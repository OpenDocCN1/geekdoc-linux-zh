  md: '# Connecting to Your Secure Shell Server


    Try connecting to your Secure shell server. Log on to the client computer chivas
    as the regular user gabearagon and try connecting to your Linux computer (atlas)
    via secure shell.


    ```

    ssh2 atlas

    ```


    If you have configured both the client and server correctly, then you are prompted
    for the pass phrase that you entered while creating your client keys with ssh-keygen2.


    Passphrase for key "/home/gabearagon/.ssh2/id_dsa_1024_a" with comment "1024-bit
    dsa, created by gabearagon@chivas.paunchy.Sat May 29 19:27:40 1999":


    Enter the correct pass phrase and you should be connected to the secure shell
    via a secure, encrypted channel.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_378_0.png)


    If your client machine does not have the server''s public key the first time you
    connect to it, then the /etc/ssh2/hostkey.pub file will be copied to the .ssh2/hostkeys
    directory in your home directory. Subsequent time that you connect to atlas you
    will not see the "Accepting host chivas without checking" line in the log prompt.
    This is potentially a dangerous situation because host authentication is not possible
    until each side has the other''s public key.


    If you have not configured the keys and other files correctly, then you can still
    connect to the remote secure shell server. You will be prompted for your regular
    password as if you were connecting via Telnet.


    ```

    gabearagon@atlas''s password:

    ```


    Enter your password and you will be connected. You are still connected over an
    encrypted channel, but secure shell is not able to correctly pass your public
    key back to your client machine. That means that you cannot verify that the server
    you are connecting to is the correct one. You are potentially vulnerable to a
    man in the middle attack where someone spoofs the computer that you are trying
    to connect'
  merge: -1
