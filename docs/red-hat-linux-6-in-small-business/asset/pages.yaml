    # PASSWORDS


    Your passwords the single most important security system that you possess and
    maintaining good passwords is an important function of an administrator. This
    is a combination of managing human factors and technical ones.


    It is necessary to balance the ease of remembering your password against the probability
    of it being cracked. Under Linux, when you create a password, the text string
    that you enter is encrypted. The encrypted password is then placed in the password
    field of the /etc/passwd file. There are programs—such as crack—that encrypt the
    words and phrases found in dictionaries and can return the result against your
    password. The existence of cracking program means you should not use any word
    that can be found in any dictionary in the world. On the other hand, you should
    probably use completely random strings of text either. (It might be necessary
    for you to do so depending on you: circumstances.) If your password is so complex
    that you cannot remember it, then you are more likely to write it down, making
    it easier for someone to obtain it.


    The compromise is to easily remember phrases that are not found in any dictionary
    and can not easily guessed. Combine words into some semi meaningful phrase. For
    instance, radio and road become radi~road; the inclusion of a non-alphanumeric
    character further helps. The password should be at least eight characters long.


    # UNDERSTANDING SHADOW PASSWORDS


    Password security is further enhanced by using shadow passwords. Starting with
    Red Hat 6.0, shadow passwords are installed by default installation (although
    you have the option of not using them). There are numerous Linux programs that
    use the /etc/passwd file. For instance, the ls command accesses that file. Generally
    programs that need to know information like user names access to the passwd file.


    This presents a problem for password security because the passwd file must be
    readable by everyone. That means anyone who has access to your Linux machine can
    copy the password to another location and run a crack program on your passwords.
    The solution is to copy the encrypted passwords to another file that is only readable
    by root. This makes passwords safer but also makes choosing a good, difficult-to-guess
    root password essential. One or two trusted people at most should know the password.
