    ```

    rpm -ivh /mnt/cdrom/RedHot/RPMS/XFree86-doc*

    ```


    The HOWTO and other documentation is installed in the /usr/doc directory.


    # Summary


    This chapter discussed the basic theory of the X Window System. It also introduced
    the essentials for configuring the X Window System and the Gnome/Enlightenment
    window manager. The X Window System combined with a window manager provides a
    graphical system that works the same as Microsoft Windows in many ways, but is
    more powerful. It’s more powerful because it can work across a network as well
    as on a single machine.'
