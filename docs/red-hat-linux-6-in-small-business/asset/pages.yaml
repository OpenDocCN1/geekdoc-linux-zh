- img_proc: true
  md: '# Summary


    This chapter provides you with the information to get a simple Arkeia client-server
    backup system working, with two examples highlighted. The first is trivial, and
    excellent for learning the basics of the system and how to get it working. The
    second is real world example everyone should be able to get working. The more
    complex process of using a SCSI DAT tape drive system and even a robotic tape
    library is discussed in general terms. Other general topics such as scheduling
    are described.


    +   - An introduction to the Arkeia client-server backup system is given. Arkeia
    is an automated system (it can also be run manually) that allows you to step back
    from the details of making backups.

    - A description of its installation is given. Arkeia is contained on the companion
    CD-ROM and is in RPM format.

    - A description of the configuration and operation of a null backup is given.
    This backup makes use of the Linux /dev/null device which exists solely in the
    mind of the operating system. The null backup writes to the null device which
    simply discards the data. This is the simplest method for verifying and learning
    the backup system.

    - A description of the configuration and operation of a file backup is given.
    The file can be any kind of Linux disk drive. A floppy is used in this case because
