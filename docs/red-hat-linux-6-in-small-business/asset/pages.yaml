  md: '# Preface


    Your job is running a small business or office. And, since most small businesses
    don''t have a budget of, if any, for computer systems or dedicated technical personnel,
    we''ve created this book for you. It will help you build an inexpensive yet powerful
    network to support your operation, and run your new network in an efficient and
    safe manner.


    Linux is very likely the ideal platform for running a small business, because
    it''s powerful and inexpensive. Linux is powerful because it''s robust, efficient,
    multifunctional, and ships with a wealth of software. The Linux operating system
    and supporting software is inexpensive because it can be obtained for free or
    at a minimal charge from companies like Red Hat. This low cost is possible because
    Linux is published under the General Public License (GPL), which permits it to
    be used for profit or, as long as the current developer places no restrictions
    on the next user or developer.


    Linux can perform many functions. It can provide file and printer sharing within
    a network, or act as a Web or database server. You can use it as a router or firewall.
    And it''s an excellent platform for a general-purpose workstation, providing office
    productivity tools and graphics capabilities.


    # Using Linux as a Personal Workstation


    Several software companies are producing office productivity tools that allow
    a Linux computer to work as a general-purpose workstation. Manufacturers produce
    products like AppixWare, StarOffice, and Core WordPerfect. This software provides
    tradition functions like word processors, spreadsheets, and presentation graphics.


    This book was mostly written using AppixWare Words for Linux (the writing process
    took place on both a laptop and a regular PC, both running Linux of course). The
    evolution of these productivity tools places Linux firmly within the desktop world,
    and if you primarily use a computer to write, create spreadsheets, and to make
    slides, you can use Linux exclusively. There are more narrowly-focused Linux products
    available, and more being developed, so Linux is expanding its applications to
    serve an ever-wider range of areas.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Using Linux as a Windows File and Print Server


    Until the primary use for Linux has been to provide services for other computers.
    In most cases this means to function as a file and print server for workstations.
    The Samba software system that comes with Red Hat Linux speaks the same “language”
    as Microsoft Windows. This means that you do not have to purchase any third-party
    software to provide Windows computers access to Linux files and printers.


    # Using Linux as an Web Server


    Red Hat Linux also comes with the Apache server system. Apache (the name is derived
    from the phrase a patchy system) is the most widely used Web server software system
    in the world today. You can run your own intranet (within your own LAN) or Internet
    Web server with this system.


    # Using Linux as an Internet Gateway and Firewall Server


    The Internet is the interconnection of all the world''s computers and networks
    that speak the same language. That language is all the protocols — rules that
    tell the individual computers and networks how to find and interact with each
    other in a predictable, efficient, and reliable manner. The protocols (or language)
    are loosely referred to as TCP/IP.


    The power of the Internet is such that most businesses want, and almost need to
    be, connected to it. With the power comes the danger of being exposed to crime,
    fraud, and abuse. Linux can readily act as both a gateway and firewall to the
    Internet. This means that your entire network or networks can be connected to
    the Internet via a Linux server via a phone or higher speed connection. That same
    server (or a separate machine) can also act as a firewall to provide protection
    from the potential dangers of the net.


    # Who Should Read This Book


    This book is directed at the intermediate to advanced computer user—a person who
    has used computers for a long enough time to be comfortable with them and their
    quirks. The intermediate user is someone who understands the basic computer concepts
    such as directory trees and has some experience configuring important com-'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'puter subsystems such as the network interface connector (NIC). The advanced
    user understands most concepts such as the Internet protocols and file systems
    and has installed an operating system such as Windows. The advanced user may have
    managed a network in some fashion and has experience computer problems.


    No Linux or UNIX experience is required to use this book. The discussions and
    examples are organized in a linear form starting before moving to the more complex.
    New topics are discussed as they are introduced. However, this book is not intended
    to be a complete reference. The inexperienced Linux or UNIX user will most certainly
    need and access to further resources. This is addressed by pointing the reader
    to additional resources as needed. Much use is made of the on-line documentation
    found both on the companion CD-ROMs and the Internet.


    # Philosophy of the Book


    This book takes the philosophy that the best way to learn something is by actually
    working with it. That is the impetus behind covering Linux installation in the
    first chapter. Once you have installed Linux, you can see how the system works
    by implementing the systems and examples as they are discussed in the book.


    This is also a tutorial describing how to put together the parts that are necessary
    to run a business. It aims at providing enough information to put each piece of
    the puzzle to create a whole system. It is really a road map describing how to
    get from one place to another.


    To do that, the basics such as installing Red Hat Linux and the basics of working
    with Linux are discussed in Part I, "Building and Using a Basic Linux Computer."
    Part II, "Managing Your Network," covers the administration and management of
    individual Linux computers and networks. Part III, "Connecting Your Network to
    the Internet," Finally, the applications necessary to run a business are introduced
    in the Part IV, "Getting Work Done"


    This book does not intend to describe functions that can be provided by others.
    For instance, as a person running a small business it is this book''s view that
    it is better to pay an Internet Service Provider (ISP) to provide your Web services
    rather than do it yourself (probably makes sense to run your own intranet server,
    however). It makes more sense to pay someone else to take on the capital equipment
    and security risks when Trying to cover every subject is not possible or advisable
    in the context of running a small business.


    This road map is a very directed one. It is not an atlas however. It describes
    a popular route but not much of the surrounding scenery. This should suffice for
    most people who want to travel this route.'
  merge: -1
