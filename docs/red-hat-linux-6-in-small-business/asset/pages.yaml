  md: '# # Appendix A


    # ## Using Secure Shell


    The private network that is used in this book is potentially vulnerable to attack
    because of all the information traveling on it is in plain text. Anyone connected
    to the network can potentially look at the packets flying by. It is also possible
    for someone outside your private network to look at your information that travels
    out onto the Internet. This is called *packet sniffing*, and the *tcpdump* RPM
    that comes with Red Hat Linux can be used to display and log such packets. These
    packets containing interesting information such as passwords and any information
    that is being passed on the network.


    The firewall introduced in Chapter 12 is designed to allow network traffic originating
    from within the private network to go out to the Internet and allow return packets
    back in. No traffic originating from outside the private network—the Internet—is
    allowed back in. This creates an effective firewall but limits its use when you
    are not physically present at your network.


    One solution to problem is to use Secure Shell. The newest version of secure shell
    `ssh` encrypts the information contained in the network packets, which provides
    a high degree of privacy and safety for your valuable information. If you modify
    your firewall to allow Secure shell packets into your network you sacrifice a
    small amount of safety for the convenience of accessing your private network.


    # ## Introducing Secure Shell


    Secure shell is a system that allows you to communicate between two computers
    via an encrypted connection. Secure shell also permits you to validate that the
    machine you are connecting to is the correct one.


    Secure shell makes it very difficult for anyone to sniff your communication. Secure
    shell does not send your password or general communication in plain text. Communication
    programs like Telnet send everything in readable format; it is possible to intercept
    the packets and reconstruct them to reveal passwords and other information. Secure
    shell solves that problem.


    Secure shell is based on a client-server model. You run a client program `(ssh)`
    to connect to a server daemon`ssh2d` on a remote computer. Once connected, you
    can interact with the remote computer as if you were sitting at its console.'
  merge: -1
  pgno: 370
- img_proc: true
  md: '# Encryption Methods


    Secure shell uses several encryption methods: IDEA, three-key triple-DES, DES,
    or Blowfish. Discussion of these methods is beyond the scope of this book and
    you should look to the following URLs for more information:


    ```

    http://www.employees.org/-satch/ssh/faq/ssh-faq.html#ss2.5.2

    http://www.sunworld.com/sunworldonline/swol-02-1998/swol-02-security.html

    ```


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_371_0.png)


    The article at the second URL discusses the operation of the first version of
    secure shell. Please keep in mind that Secure shell 2 (used in this book) configures
    the keys differently than is discussed in the article but overall the concept
    is the same.


    # Public and Private Keys


    Secure shell uses the concept of public and private keys to perform authentication.
    A public key is a sequence of randomly generated numbers that is available to
    everyone. A private key is another random number that you do not share with anyone
    else. Information that is encrypted with a public key can only be dectrypted by
    the private key and vice versa. The public and private keys are totally independent
    of each other and one cannot be derived from the other. This method is RSA authentication.


    # Host Authentication


    Secure shell makes use of the public and private keys to verify that all parties
    are who they claim to be. When you attempt to connect to a remote computer both
    the client and server generate random strings. The strings are exchanged in such
    a way that the combination of public and private keys proves that both the client
    and server are available. The details of the process is interesting but beyond
    the scope of this book. Please refer to the other documents and URLs mentioned
    in this chapter, and http://www.spotch.com/~robjen/sa/ssh/sshtalk-1/slid032.htm,
    especially slides 32 through 37.'
  merge: -1
  pgno: 371
- img_proc: true
  md: '# Using Secure Shell


    # 345


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_372_0.png)


    The first time you connect to a Secure shell server, you do not have it''s public
    key.You get the message "Accepting host chivas key without check-ing." This means
    that your client machine is recieving the public key of the server without being
    able to verify that the server is the correct server.The new key is stored in
    a file in the .ssh/hostkeys directory.


    It is essential that both the client and server verify the true identity of those
    involved. Without verification, it is possible that a third party can pretend
    to be the client or server, a process called spoofing. For instance, you are computer
    A and want to connect to computer B. However, if computer C pretends to be B by
    using the same IP address as B, then you might connect to C and send your valuable
    information to C. This is called a man-in-the-middle attack.


    However, if you encrypt a random string, and send it to C, but do not get the
    same string back, then you know that the computer you are talking to has changed
    keys or is a fake. RSA authentication prevents DNS, IP, and routing spoof-ing.


    # User Authentication


    When you are creating your user keys with ssh-keygen2 (discussed later in this
    chapter) you are asked to enter a pass phrase. The phrase can be up to 20 characters
    long and include spaces. During the authentication process you are prompted for
    your pass phrase. Once it is correctly entered, you are logged onto the remote
    system. If the host authentication process fails, or you enter the wrong pass
    phrase, then secure shell will revert to the normal login process and you need
    to enter your regular login account password (You can turn off the normal login
    process in order to allow only pass phrase authentication. Please see the section
    Configuring General Parameters for more information).


    Please see the URLs listed in the section "Encryption Methods" for more information
    on this subject.


    # Downloading Secure Shell


    The Linux/UNIX version of secure shell is available via the Internet (ftp://ftp.replay.com/pub/crypto/redhat/i386/)
    for non-commercial users only. Secure shell must be purchased if it is to be used
    for commercial purposes. Please read the license agreement to determine whether
    you can legally use the publicly available version. The SSH Communication Security’s
    home page at http://www.ssh.fi contains more product information.'
  merge: -1
  pgno: 372
- img_proc: true
  md: '# Appendix A


    Data Fellows Ltd.http://www.datafellows.com is a licensed reseller of Secure shell
    products. In addition to the commercial version of Secure shell, they also provide
    a free trial version of it.


    To download the RPM version of ssh2, log on to atlas as root and change to the
    /usr/local/src directory. Connect to http://www.shopenet.net/public-library/RPM/replay/crypto/redhat/test_rms/ByName.html
    and download the ssh2, ssh2-client, ssh2-server, and ssh2-extras RPMs.


    # Installing and Configuring Secure Shell


    Secure shell requires that the machine(server) it''s connected to runs the sshd
    daemon. You can connect to that machine from any other machine (the client) by
    using the ssh2 client program once you''ve configured both the client and server.
    The following sections describe how to configure both sides.


    Your secure shell server and client can be placed on the same machine. Simply
    translate the following instructions for installing and configuring your client
    machine to your server. This is a good method to test Secure shell if you do not
    have multiple Linux computers to work on.


    # Installing Secure Shell on the Server Computer


    In this example, the Linux Internet gateway and firewall server atlas will function
    as the secure shell server. Any Linux computer on your network can provide this
    function. By placing one on the gateway, however, you can gain access to your
    private network from the Internet. (There is no limit on how many Secure shell
    servers you can have. If you want to make your internal network more secure, every
    Linux computer that you interactively communicate with should be a Secure shell
    server.)


    Log on to atlas as root and install the Secure shell packages as follows.


    ```

    rpm -ivh /usr/local/src/ssh2*

    ```'
  merge: -1
  pgno: 373
- img_proc: true
  md: '# Using Secure Shell


    This command installs the ssh2, ssh2-clients, ssh2-extras, and ssh2-server RPM
    packages. When the ssh2 RPM (the base package is installed), it generates the
    public key (hostkey.pub) and private key (hostkey) as shown:


    Generating 1024 bit host key. This may take a while, go and have a coffee )

    Generating 1024-bit dsa key pair

    1 ooo.ooo.0000


    The process can take several minutes depending on the speed of your computer.
    The keys that it generates are stored in the /etc/ssh directory.

    When the ssh2-server RPM is installed it starts the ssh2 daemon (and also installs
    the start up script sshd in the /etc/rc.d/init.d directory). At that point, your
    Secure shell is ready to accept connections from clients. However, you still need
    to configure your client.


    # Installing Secure Shell on the Client Computer


    Only the Secure shell base (ssh2) and client package (ssh2-clients) need to be
    installed on a client computer. In this example, chivas, the Linux file and print
    server, is the used.

    Log on to chivas as root and install the Secure shell base and client RPMs as
    follows.


    ```

    rpm -ivh /usr/local/src/ssh2-2*

    rpm -ivh /usr/local/src/ssh2-clients*

    ```


    # Creating a User’s Public and Private Keys on the Client Computer


    While the ssh2 base package is installing it will generate the client’s keys.
    You will need to generate your own user keys. In this example the gaboragaron
    is used. Create that user with the useradd gaboragaron command and create a password.
    Change to that user with the su gaboragaron command and run the following command.


    ```

    ssh-keygen2

    ```


    The computer will spend more time generating the user’s public and private keys.
    It will prompt you to enter a pass phrase, which is the Secure shell equivalent
    of a password. The phrase can be up to 20 characters long, and can include space
    characters. Use your good judgement in creating a good password.'
  merge: -1
  pgno: 374
- img_proc: true
  md: 'Once you enter the pass phrase, ssh-keygen2 places the public and private keys
    in the .ssh2 directory (it creates). That directory is placed in the user''s home
    directory which, in this case, is /home/gabeagaron. The public file is called
    id_dsa_1024_a and the private one is id_dsa_1024_a. Once again, the public file
    can be transported across the network, while private should be kept secret.


    # # Creating a User''s Identification File on the Client Computer


    Next, you need to create an identification file on the client. That file tells
    the ssh2 client where to go to find its private key - id_dsa_1024_a in this case.
    From the user''s home directory, change to the .ssh2 directory.


    ```

    cd ~/.ssh2

    ```


    Enter the following command to create the identification file.


    ```

    echo "IdKey id_dsa_1024_a" > identification

    ```


    The contents of /home/gabeagaron/.ssh2/identification file will be as follows.


    IdKey id_dsa_1024_a


    Secure shell looks to the identification file to find out the name of the user''s
    private key. This arrangement means that you can have multiple private keys assigned
    to each user. However, this example does not make use of capability.


    # # Configuring the Server Computer


    Now that you have created your public key and private keys, you need to copy the
    public key to the server that you access. Log on the secure server (atlas) as
    the user you want to log on as - in this case gabeagaron atlas (Create the user
    with the useradd gabeagaron command if necessary). From the user''s home directory,
    /home/gabeagaron, create the .ssh2 directory.


    Go into the .ssh2 directory (cd ~/.ssh2) and copy the user gabeagaron''s public
    key - id_dsa_1024_a.pub - from the client computer. Use any method that you want
    -smftp or ftp to make the transfer, but be aware that anyone intercepts the key
    you install on the server connects will be able to perform a man-in-the-middle
    attack. This is probably a remote possibility for most people, but it is potential
    threat. Therefore, it is considered good practice to use a floppy or some other
    media to hand carry the public key from machine to machine in order not transport
    the key over a possibly insecure network. Whether you'
  merge: -1
  pgno: 375
- img_proc: true
  md: '# Using Secure Shell 349


    want to such precautions is up to you and depends on the degree of security that
    you want to maintain.


    Once you have copied the id_rsa_1024_a.pub file to the server, rename it. The
    /usr/doc/ssh2*/SSH-QUICKSTART document uses the convention of calling it Local.pub.
    However, I personally find it easier to reference the name of the key to the user
    who will it to connect. In this example, the command is mv id_rsa_1024_a.pub key_of_gabeargon.pub
    to rename it.


    Create the authorization file in the server .ssh2 directory as follows.


    ```

    echo "Key key_of_gabeargon.pub" > authorization

    ```


    The secure shell server daemon will look in the user''s authorization file in
    the .ssh2 directory for the file containing user''s public key on the server.


    # Copying the Server''s Public Key to the Client Computer


    Both the server and client need to know the other''s public keys for secure shell
    to work. The final configuration step requires you to copy the server''s public
    key to your client. From atlas, copy the /etc/ssh2/hostkey.pub to key_22_atlas.pub
    in the /home/gabeargon/.ssh2/ directory. The new name contains the ssh2 port number
    - 22 - and the name of the server - atlas.


    # Checking the Client and Server''s Configuration Files


