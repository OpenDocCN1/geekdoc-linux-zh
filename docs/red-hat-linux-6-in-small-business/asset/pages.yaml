  md: '# Using On-Line Documentation


    This book makes use of numerous Linux resources. One of the best ones is the CD-ROM
    which includes many HOWTO documents on almost every subject; as well as many Frequently
    Asked Questions (FAQ) files that discuss questions that are asked, well, frequently.


    You are advised in the section "Choose Components to Install" to select the Extra
    Documentation item. This installs many informational files into the /usr/doc directory.
    This book often refers to those documents and assumes that you do indeed install
    them. Most often a reference is made to the actual file such as /usr/doc/HOWTO/Ethernet-HOWTO.
    It is highly recommended that you choose to install the extra documentation. If
    you don''t install it, then you can do so manually. Please refer to the first
    RPM installation example in chapter 6 for instructions for that.


    # Preparing your Computer


    You should know as much about your computer as possible before proceeding with
    the installation. The Red Hat installation process asks you about such things
    as what kind of monitor you have, how many hard drives, whether you have a local
    CD-ROM drive and what port your mouse is connected to. If you use a SCSI (small
    computer systems interface) adapter then it is best to know what manufacturer
    it comes from. The more information that you have the fewer guesses you will have
    to make.


    If you are connected to a LAN, then you need to provide the installation process
    with your hostname, IP address, netmask, gateway address, domain name and Domain
    Name Server (DNS) IP address. It''s possible, though, that you may be connected
    to a network that already provides Dynamic Host Configuration Protocol (DHCP)
    or Boot services that automatically assign IPs.


    > Public IP addresses\ Internet requires that every connected host (a computer,
    router, printer or any electronic device) has its own unique address. The address
    consists of four decimal numbers concatenated together with dots (.) or periods,
    such as 192.168.1.1.\ Every IP address that is legally visible on the Internet
    needs to be registered with InterNIC. InterNIC is responsible for allocating addresses
    and domain names.'
