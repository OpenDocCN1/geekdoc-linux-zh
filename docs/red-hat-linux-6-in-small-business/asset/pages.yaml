    # # /etc/hosts Table


    When you installed Linux in Chapter 1 you were prompted to enter network information
    for the computer. Part of that process was entering the network name, alias and
    IP address into the /etc/hosts table.


    The /etc/hosts table must contain the information on the local Linux computer,
    but optionally contain the names and addresses of other network devices (computers,
    printers, and so on). If you intend to use DNS, then the information entered into
    the /etc/hosts table is redundant. Without DNS you should enter all of the names,
    aliases, and IP addresses of the computers and printers on your network into this
    file.


    A sample /etc/hosts file with all of the devices described in Table 7-2 is shown


    ```

    127.0.0.1 localhost localhost.localdomain

    192.168.1.254 chivas.paunchy.net chivas #file/print/email(optional) server

    192.168.1.250 atlas.paunchy.net atlas #Internet gateway/firewall

    192.168.1.2 cementos.paunchy.net cementos # Windows 98

    192.168.1.3 toluca.paunchy.net toluca # Windows 95

    192.168.1.200 tiburones #printer

    ```


    This file (or one like it with your network names and addresses) should be placed
    on every Linux computer on your network unless you are using DNS. You can manually
    edit the /etc/hosts file or use the netcfg program, described in the section "Using
    the Network Configurator" later in this chapter, to do so.


