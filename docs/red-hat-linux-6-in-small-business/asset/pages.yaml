  md: '# Checking Your Network


    You should first verify that your Windows machine is speaking to your Linux server
    across the network. Try pinging the Linux machine by opening a MS-DOS window and
    executing the following command:


    ```

    ping 192.168.1.254

    ```


    The numeric IP address is used to avoid any problems that might exist in the DNS
    server. You should see the pings returned from the Linux machine:


    ```

    PING chivas.sandia.gov (192.168.1.254): 56 data bytes

    64 bytes from 192.168.1.254: icmp_seq=0 ttl=64 time=0.4 ms

    64 bytes from 192.168.1.254: icmp_seq=1 ttl=64 time=0.2 ms

    64 bytes from 192.168.1.254: icmp_seq=2 ttl=64 time=0.2 ms

    ```


    If you do not get that response (the "time" parameter in this listing refers to
    the response time of the pinged computer, and can vary), at least part of your
    problem lies with your network or your computers. Refer to the network troubleshooting
    techniques discussed in Chapter 7.


    # Checking the Samba Daemons


    The smbd and nmbd daemons must be running for your clients to access the Samba
    server. Check that they are running with the following command:


    ```

    ps x | grep mbd

    ```


    At least one smbd and one nmbd daemon should be displayed.


    ```

    301 ? S 0:00 smbd -D

    310 ? S 0:01 nmbd -D

    ```


    There can be more than one smbd running, because one daemon is allocated for each
    Samba share that is accessed. Both smbd and nmbd should be running. If they are
    not, restart them by using the smb script (or by manually starting them):


    ```

    /etc/rc.d/init.d/sbd restart

    ```


    Try accessing Samba again. If it still does not work, proceed to the next section.'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# Check the Lock Files


    Samba requires a lock file to be place in order to work correctly. There should
    be a STATUS..LOCK in the /var/lock/samba directory. If it does not exist, create
    it as follows:


    ```

    touch /var/lock/samba/STATUS..LCK

    ```


    Case is important in this command. Restart the Samba daemons:


    ```

    /etc/rc.d/init.smb restart

    ```


    If Samba still fails, proceed to the next section.


    # Checking the Samba Log Files


    The default Samba configuration contains the parameter log file = /var/log/samba/log.%m
    in the /etc/samba.conf file. This tells Samba to copy all log messages to files
    with suffixes based on the NetBIOS name of each computer that tries to access
    the server (%m expands to the NetBIOS name of the calling computer). The amount
    of information recorded is based on the debuglevel parameter, which can be defined
    in the /etc/samba.conf file. The log files are stored by default in the /var/log/samba
    directory.


    The information in those files can be used to debug Samba. For instance, the log
    file for the Windows 95 computer toluca might contain the following message:


    ```

    [1999/03/31 14:56:26, 1] smbd/password.c:pass_check_smb(500)

    Couldn''t find user ''iaumaser'' in smb_passwd_file.

    ```


    This means that /etc/samba_passwd file has not been configured correctly, or at
    all, for user iaumaser. That''s user home is not accessible from the Windows computer,
    and the solution is to edit the Samba password file and use the smbpasswd iaumaser
    command to set the password.


    There are too many possible problems to discuss within the context of this book.
    However, many (if not most) messages are decipherable to the average reader. Consult
    the Samba documentation to find further information.


    The next section follows the outline of the troubleshooting process in /usr/doc/samba-2.0.3/docs/textdocs/DIAGNOSIS.txt
    for Samba 2.0.3. Consult those files for more detailed troubleshooting information.'
  merge: -1
