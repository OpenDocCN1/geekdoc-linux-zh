  md: '# IDE Devices


    Modern PCs support up to four IDE devices on the system board (also called the
    motherboard). You can connect any IDE device, such as a disk drive, ATAPI CD-ROM,
    or Zip drive, by plugging them into the two IDE cable connectors on the system
    board; one or two IDE devices are supported on each cable. When DOS the devices
    show up as C:, D; E; or F drives. In Linux they appear as the /dev/hda, /dev/hdb,
    /dev/hdd files. To check this, login as root and enter the command:


    ```

    dmesg | grep -i hd

    ```


    A typical system looks as follows:


    +   hda: WDC AC2160DH, 1549MB w/128kB Cache, CHS=3148/16/63, DMA

    ddb: IOMEGA ZIP 100 ATAPI, ATAPI FLOPPY drive

    hdd: 20DY, ATAPI CDROM drive


    This system contains a 1.5 GB hard drive and a Zip drive on the first IDE bus.
    The ATAPI CD-ROM sits on the second IDE bus and is the only device on it; there
    is room for another IDE device, such as a second hard drive, on this system.


    PCs require one of the two devices mounted on each connector to be a master and
    the other, if it exists, to be a slave. Typically, you want the Linux hard drive
    to be the master and whatever the second device to be the slave. The reason is
    that the device that you most often boot from should be the master and that is
    typically the hard drive. Most modern devices have a jumper (the small slab-like
    device that fits over the in-line metal pins) to select the master/slave settings.
    See your device manual for more information.


    It is convenient to create a mount directory for the Zip drive as follows:


    ```

    mkdir /mnt/zip

    ```


    Mount the Zip drive by entering the command:


    ```

    mount /dev/hdb /mnt/zip

    ```


    Verify that it is mounted:


    ```

    df

    ```


    You should see the Zip drive mounted along with the normal file systems.'
