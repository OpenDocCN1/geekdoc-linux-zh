    CONFIGURING E-MAIL SYSTEMS IS one of the more complex tasks that you can do. There
    are numerous e-mail servers and clients, and getting them all to interact is definitely
    not a trivial task.


    In order to simplify your e-mail configuration, this chapter uses two types of
    e-mail systems. One is simple and easy to configure but is not very flexible,
    and the other is not so easy to set up but is somewhat more flexible. You can
    choose the best solution for your operation.


    # Using the Netscape E-mail Client


    Once you have subscribed to an ISP and connected to the Internet, you can use
    the ISP as your e-mail server. This is quite simple in concept and execution because
    your ISP gives you a login account and that login account comes with an e-mail
    address. Your ISP provides Post Office Protocol (POP) and IMAP protocol capabilities,
    which means you can download and/or view your e-mail from your Private Network.


    The POP and IMAP protocols are designed to allow access to e-mail via an external
    network or connection. Traditionally, one would have to log into an account and
    access e-mail directly from that machine, but the introduction of the POP and
    IMAP protocols makes that unnecessary.


    Netscape provides an e-mail client that is capable of using either POP or IMAP.
    You can configure the Netscape e-mail client to access your remote ISP account
    to send and retrieve e-mail. You pay your ISP to manage your e-mail, and you don''t'
