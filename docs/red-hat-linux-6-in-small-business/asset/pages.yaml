    # Automatically Starting Your Firewall


    Whenever you connect to the Internet you should start your firewall as well. One
    simple and effective way of doing that is to have dial ipchains.rules once the
    PPP connection has been established. This can be done by adding the following
    commands to the end of /etc/dial.conf file.


    ```

    ip-up /usr/local/etc/ipchains.rules

    ip-down /usr/local/etc/ipchains.reset

    ```


    The ip-up parameter forces dial to run the script that configures the ipchains
    rules. The ip-down runs the script that flushes all the ipchains rules and sets
    the default policies to accept.


    # Configuring Your Network for External Access


    The firewall described in this chapter works best when configured for one-way
    connections to the Internet. IP filtering can present a formidable wall with this
    configuration. However, when you start allowing connections from the outside,
    your internal services can become exposed to attack. You can replace your services
    with proxies (for instance, the TIS firewall or www.tis.com/) to protect yourself,
    but that makes designing your firewall a more complex and difficult process. For
    small networks, my advice is to pay an ISP to provide general services, such as
    Web pages, and take the risks.


    If you do two-way communication, a reasonable method is to keep the one-way IP
    filtering firewall and create a dial-in PPP server of your own. You then connect
    to your network from outside by using the same methods for connecting to the Internet.
    If you add a one-time password system such as SecureID (www.securid.com), your
    private network will be reasonably protected. However, since SecureID is a physical
    device that must be purchased, its use beyond the scope of this book.


    Another alternative is to use Secure shell for incoming connections on your Linux
    gateway/firewall. Secure shell can be configured to provide both host and user
    authentication, and can determine whether an incoming connection is from a trusted
    computer. It can also authenticate the incoming user (separate from the'
