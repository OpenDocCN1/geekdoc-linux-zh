- img_proc: true
  md: '# Introducing Arkeia


    Arkeia 4.0 is based on the client-server model. The Arkeia server controls the
    backup media and the backup schedule. The media can be anything from simple floppy
    disk(s), disk file(s), a single tape device or a tape library. The schedule can
    be daily, weekly or monthly; and a backup can be the total system(s) or only files
    that have changed since the last backup. A client is any machine that you want
    to have backed up the server can be a client to itself.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_235_0.png)


    Tape libraries, also known as autoloaders or jukeboxes, combine one or more tape
    devices, multiple tape slots, and a robotic arm mechanism to transfer the tapes
    from the slots to a drive. The whole system is contained within a simple box with
    a door on the front. (The biggest libraries have an slot for inserting and removing
    individual tapes without the front door.) Tape libraries are generally connected
    to their server but can be connected by other methods.


    The Arkeia backup server maintains indexes (databases) of what client backups
    have been done and where they exist. The indexes allow you to interactively browse
    the existing backups. Additionally, the indexes keep track of which tapes were
    used for each backup. This relieves you from the burden of keeping manual logs
    of the data located on each tape. You can use the browser to retrieve any backups
    via a GUI.


    Both the backup server and client agents run daemons. The server daemons are responsible
    for starting the scheduled backups, informing the client daemons to start their
    backups, and maintaining the backup indices.


    The server maintains a schedule of what to back up and when. When the server determines
    that a client has reached its backup time, the server daemon communicates with
    the client daemon to initiate the backup. The two sides manage the transfer of
    the data corresponding to the file systems backed up across the network. The data
    is received by the server and written to the storage media.


    Knox Software allows their software to be downloaded from our Web site to help
    you facilitate upgrades and patches and you can also download a time-limited demo
    or a home-use anywhere version.


    Knox Corp has provided a demo version of Arkeia (with a limited license). They
    provide three RPM packages that run under Linux, including a client, server, and
    X interface. They also provide a Windows client that is packaged in a Zip format.
    All of the Arkeia software is included on the companion CD-ROM in the /mnt/cdrom/ID/Arkeia
    directory.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Chapter 10: Automating Network-wide Backups


    Knox Software maintains a web site at www.knox-software.com, which provides general
    information about the company. More information on their Arkeia product can be
    found at www.arkeia.com.


    # Installing Arkeia on the Linux Server


    The installation process is simplified by the use of the RPM format. You need
    at least 50MB of free space on the file system that you install it on.


    In order to install Arkeia on your Linux machine, login as root, mount the companion
    CD-ROM, and run the following commands:


    ```

    rpm -ivh /mnt/cdrom/arkeia-client*

    rpm -ivh /mnt/cdrom/arkeia-server*

    rpm -ivh /mnt/cdrom/arkeia-gui*

    ```


    Most of the files are stored in the /usr/knox directory. The Arkeia manuals are
    stored in the /usr/doc/arkeia-server/html directory and can be viewed by your
    browser.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_236_0.png)


    > The FSSTND suggests that all third party software be installed in the /usr/local
    directory. However, to keep it simple, I will let the software installed in its
    default location. If you want to follow the FSSTND guidelines, I suggest first
    creating the /usr/local/knox directory and then creating a soft link to ln -s
    /usr/local/knox /usr/knox and finally installing the RPM packages.


    # Configuring the Arkeia Server


    To understand Arkeia you need to understand its underlying philosophy. The philosophy
    is to break down the backup process into component parts, which are then used
    as building blocks to ''build'' your backup. By decomposing the backup process
    into parts, system flexibility and scalability are achieved. The parts are called
    the Drive(s), Drivepack, Tape-Pools, Savepacks, and Libraries, respectively, and
    they are configured by the Server Administration GUI.


    # Server Administration


    The server administration screen is the central control system for Arkeia, and
    the place where all other components are reached. This screen, broken down into
    four'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# Part II: Managing Your Linux Network


    major areas, includes system menus, server/job status, message area, and the icon
    bar. The system menu area allows you to access all features and function, while
    the icon bar provides shortcuts to the most frequently used functions. The server/job
    status area (center of the screen), shows the backup server you are attached to,
    user id/user class, and the current date and time. Additionally, it shows all
    active backup or restorationjobs, and when nothing is running, it indicates that
    the message area shows general system status messages.


    # Drives management


    The Drive Management component is used to logically define the read/write device(s),
    (typically the tape drive), to Arkeia. The Drive Management screen allows you
    to define one or more tape drives according to its specific characteristics as
    well as providing the connection between Arkeia and the tape drive(s). By using
    logical drive definitions, Arkeia refers to the tape drive by its own internal
    name needing to know how it is defined by the operating system. This allows you
    to change the drive definition, if required, without changing any other Arkeia
    settings.


    # Drivepack


    The Drivepack is used to group one or more tape drives into a single processing
    group, which allows Arkeia to determine how many drives to use during a backup.
    On a system with one tape drive, this is not important since the drive can be
    used for one task at a time. However, on a backup server with multiple tape drives,
    or with libraries that have multiple tape drives, this feature lets you easily
    perform independent operations (like simultaneous backups and restores) very easily.
    For example, on a backup server with a library that contains 4 tape drives, a
    drivepack can be defined with just two of the four drives leaving the other two
    drives available for other backups. When the backups run, only the two drives
    in the drivepack will be used, which leaves the other two drives available for
    performing restore operations. Because of its multi-processing design, Arkeia
    can simultaneously backup data from one client while restoring data to a different
    client.


    # Savepack


    The Savepack concept specifies which client files, file system(s), or individual
    files are to be backed up.


    When you configure a Savepack, you might tell the Arkeia server that you want
    to backup XYZ files on client C. The save concept is meant to provide the necessary
    flexibility to backup a diverse network of computers, which allows you to back
    up several client-related computers as a single unit. Your grouping could be anything
    from all machines in the company, to just those in a certain department or floor.'
  merge: -1
  pgno: 237
- img_proc: true
  md: 'Chapter 10: Automating Network-wide Backups


    # Pools Management


    The Pools Management screen is used to define a general purpose storage pool.
    A pool is the set of one or more tapes, and by using separate tape pools, you
    can control how your data is saved. For example, you might perform a total backup
    once a week and an incremental backup each night during the week. By using different
    pools, you can assign different retention periods to the backup. This allows you
    to retain, and keep valid, total backup for 12 months while letting the incremental
    backups expire after just one month. Tape pools can be used to separate data in
    whatever fashion makes sense for your company. A default ''scratch'' pool is provided
    and can be used to hold tapes in reserve case you run out logical definitions
    in your pools.


    Dividing your tape volumes between pools can also separate the types of data by
    the person who generates data. This generally makes sense in several ways. One
    is that computers used for different tasks generate different amounts of data.
    For instance, if you use your Linux machine as a file server to your Windows machines,
    then your Linux server will probably generate more store than the client Windows
    machines. By creating different pools, you can assign more volumes to the servers
    than your clients. When you advance to the point of using tape libraries, this
    capability becomes advantageous. Because a library has a fixed number of slots
    you can put more tape in the heavily used pools than the lesser used ones. Thus,
    the tape library doesn''t run out of tapes as frequently as if it had only one
    pool of tapes.


    # Tapes Management


    The Tapes Management screen is where you create the logical definitions of the
    tapes that will be used during backup and restore operations. Again, Arkeia uses
    logical definitions of the tapes so that the backup and restore processes don''t
    have to consider the underlying attributes of the media.


    # Libraries Management


    Libraries combine into either actual tape libraries or virtual ones. A tape library
    is a device that, under control of the backup software, automatically mounts one
    tape from a selection of many tapes into a tape drive. A virtual library mimics
    the action of a tape library, but creates volumes on a disk drive, instead of
    on tapes. Using virtual libraries is a,good way to experiment and learn about
    making backups. Arkeia can select volumes from both real and virtual libraries.


    # The System


    When the Savepacks, the Drivepacks and Pools are combined by Arkeia, you are able
    to automatically backup almost any size network. The packs and pools can be used
    to build both interactive and scheduled backups. Once the component parts'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# Part II: Managing Your Linux Network


    are built, the detailed administration is taken care of by the Arkeia and your
    function becomes the much more high level of monitoring. You need to make sure
    that previous night''s backups ran successfully and if not then either run them
    or troubleshoot the cause. You also need to maintain the system by supplying new
    and recycled tapes but the worry of keeping track of the individual files on the
    individual tapes is removed.


    # Creating a Null Backup


    The Arkeia configuration documentation recommends configuring a null device to
    begin. This is a good idea because it eliminates the need to deal with actual
    devices and their messy details, letting you focus on overall system installation
    and configuration. It''s also an excellent way to learn the system. A null device
    in this case means the Linux device /dev/null. This is a standard mechanism which
    UNIX systems send output when the output is not to be saved or otherwise acted
    upon. The binary stream copied to the /dev/null file is simply discarded.


    > NOTE You can obtain help at any time by clicking the information icon in the
    extreme upper left of the Arkeia GUI. It provides help related to the window that
    you are currently viewing.


    To start, login as root start X Window if it''s not already running. Run the following
    command to start the Arkeia GUI:


    ```

    /usr/knox/bin/arkx

    ```


    > NOTE When you install the arkeia-gui RPM it installs the shell script /usr/bin/ARKEIA.
    You can start the GUI by entering ARKEIA from the command line.


    Next you''ll see the introduction window as shown in Figure 10-1. Please note
