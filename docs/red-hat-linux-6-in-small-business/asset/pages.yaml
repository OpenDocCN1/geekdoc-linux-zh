    # Running a Series of Commands


    If you want to run a series of programs from one line, just separate the commands
    with a semicolon (;). For example, if you want to list your current processes,
    show the date, pause for ten seconds, then show who is currently logged on, you
    would type:


    ```

    ps; date; sleep 10; who

    ```


    ps shows the processes that you are using, date shows the date and time, sleep
    pauses the execution of the commands for 10 seconds, and who lists the users who
    are logged on the computer. Each program is run if you enter them on separate
    lines.


    If you want to run a series of commands in the background, enclose them in parentheses
    before adding the ampersand. For example:


    ```

    (ps; date; sleep 10; who) &

    ```


    This runs all four programs in the background and gives you your command back.


    # Redirecting Command Output


    Most Linux commands provide some sort of output for you to view. If you type ls,
    Linux displays a list of files. If you type pwd, Linux tells you your current
    directory. But sometimes the output of your commands flies by the screen faster
    than you can read it. You just read to use the more and less commands to pause
    the output a page at a time. You can also save the output of a command to a file,
    then peruse the file at your leisure. To do this, use the greater-than sign (>)
    between the command and the filename.


    For example:


    ```

    ls /usr/bin > ~/usrbin.list

    ```


    The filenames in the /usr/bin directory are inserted into a file called usrbin.list
    and put the file in your home directory. If the file usrbin.list already exists,
    then it is completely overwritten.


    > The tilde combined with the forward slash (/) is synonymous for your home directory.


