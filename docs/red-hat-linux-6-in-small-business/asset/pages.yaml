    # Changing Users


    Sometimes you may want console to change to another user without logging off.
    Rather switch to another console or logging out and logging in as another user,
    you can switch users by entering the command:


    su


    When you type su all by itself at the command line, Linux will attempt to log
    you in root. After you enter the password, you have the same privileges as user
    root. To go back to your previous login account, type:


    exit


    Try adding a dash (-) as a parameter to the su command.


    su -


    With this parameter, once you correctly enter the root password you become the
    root user and also activate the root user''s environment. A user''s environment
    includes shell variables and aliases. A shell variable includes the pathname and
    shell type tells the Shell to search through directories for commands and programs.
    The shell environment is displayed by entering the env command. The bash shell
    looks first to the /etc/bashrc and then the .bashrc file in the user''s home directory.


    If you want to log in as another user (besides root), type:


    username


    You are prompted for the user password, and once correctly entered you become
    that user; you do not inherit the user''s environment unless you include the dash.
    To go back to your previous login account, type:


    exit


    # Running Programs in the Background


    If you want to run an application that doesn''t require much user interaction
    (like a backup for example), then you don''t have to switch to a new virtual console.
    Just append an ampersand (&) to the command and the application runs in the background.
    For example, type:


    updatedb &'
