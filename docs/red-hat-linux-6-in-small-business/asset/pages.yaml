  md: '# Chapter 13: Configuring a Linux E-mail Server 303


    However, keep in mind that if you have problems configuring it, you can always
    configure e-mail clients like Netscape to send and receive e-mail directly from
    your ISP.


    # Using the Netscape E-mail Client


    If your Netscape e-mail client refuses to read your mail queued up at your ISP,
    then first check that you have a PPP connection. Next check that your ipchains
    firewall rules are set to allow POP or IMAP (depending on which protocol you use).
    A quick and dangerous way to do this is to turn off the filtering rules. If you
    can get your e-mail, then you know that a modification of your filtering is in
    order; consult Chapter 12 for a discussion of filtering rules.


    If you still can''t get your e-mail, make sure that your Netscape preferences
    are correct. Look at the server name and protocols as well as check that your
    user name and e-mail address are correct. Consult the /var/log/messages and /var/log/mailog
    files for any hints to your problems. You might also consult your ISP for their
    advice.


    If you are running your own e-mail server and your e-mail client can''t access
    it, first check that your network connection is functioning correctly (Chapter
    7 discusses troubleshooting). If your network is down, then check if the sendmail
    daemon is running correctly. This can be tested with a simple ps x grep sendmail
    or /etc/rc/d.init/status commands as well as logging in your server and running
    Netscape. Change the preferences to use Movemail and if you get mail, then sendmail
    is fine. Change back to POP or IMAP and try again. If e-mail still fails, check
    the /etc/services and /etc/inetd.conf files to make sure they have POP and/or
    IMAP entries. Use RPM -qa | grep pop. Also check your /var/log/messages and /var/log/mailog
    for any hints you might glean. Finally, check out the Usenet groups like comp.mail.
    for advice and information on your problem.


    # Fixing Problems with Local E-mail


    The sendmail daemon is configured out of the box by Red Hat to serve a small Private
    Network. If you ever need to go outside your network and you are not getting e-mail,
    then check that sendmail is running. Second, check the sendmail installation with
    the rpm -V sendmail command. If it still does not work, then consult your /var/log/messages
    and /var/log/mailog for insights. The last step is to consult the Usenet groups
    like comp.mail..


    When a message fails to get sent, it is returned to the sender or the postmaster,
    or in the case where it is not delivered to, a message will be written to the
    /var/log/mailog file. The return message has information about why it failed.
    It is beyond the scope of this book to discuss the many reasons for


