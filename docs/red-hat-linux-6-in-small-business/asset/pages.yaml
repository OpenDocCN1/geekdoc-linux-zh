    # Summary


    This chapter shows how to connect your Linux network to the Internet. Several
    connection methods are described. Once connected, your network is part of the
    Internet. A dial-in PPP connection handles incoming network traffic, and this
    approach is taken to allow a simple one-way IP filtering firewall to be used of
    (described in Chapter 12).


    +   * An introduction to the dial-up network is discussed. The PPP protocol is
    the basis for this system.

    * A discussion of how to choose an ISP is covered. Not all ISPs are built the
    same and the local ISP with good technical capability is worth a few extra dollars
    per month. The less time that you spend correcting the problem you save.

    * Preparing for your connection is worth some effort. The connection systems described
    in this chapter require that you know parameters as the dial ups numbers and such.

    * Configuring your modem is an important place to start your connection configuration.

    * Red Hat has an ISP connection GUI. You can access it via the Control panel.
    You need to enter a handful of parameters and the GUI will make the connection
    and start up PPP for you.'
