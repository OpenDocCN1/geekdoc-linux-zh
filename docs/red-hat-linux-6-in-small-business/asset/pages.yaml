    Correctly stopping a Linux computer is important. Linux temporarily stores data
    to be written to disk in memory. For instance, when this chapter''s text (using
    ApplixWare Words) is saved to disk, the Linux kernel first stores (buffers) the
    information in memory. When the kernel is ready to save to disk, it does so. However,
    there is a lag between the time the Save button is clicked and the time that these
    words are permanently saved to disk.


    The upshot is that if computer power is turned suddenly off then the buffer is
