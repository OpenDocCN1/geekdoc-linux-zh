    # Backing Up Your Data


    Your data backups are an important security tool. If your computer security is
    breached, if you have valid backups, then you can recover your system. However,
    the big question is how to know for sure that your backups are not corrupted or
    compromised.


    That question is very difficult to answer. The best way is to verify your initial
    system and data installation with the tripwire program. Tripwire creates a checksum
    of each file; the checksum is analogous to a fingerprint. The tripwire checksum
    database can be stored on a read-only storage such as a writable CD-ROM. With
    the checksum database, your restored data can be checked against the database.
    Tripwire is described in Chapter 12.


    Tripwire can run periodically to create a fingerprint of the system files. That
    means that you have checksums to compare your current system files with known
    genes. Some system files, like the ones found in /bin,/sbin, /usr/bin, etc. should
    never change. System configuration files like ones found in /etc/rc.init.d should
    only change when a system administrator performs the modification. Any files that
    you suspect might be a Trojan Horse should can be'
