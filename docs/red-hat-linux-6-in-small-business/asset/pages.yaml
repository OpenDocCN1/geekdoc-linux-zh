  md: '# Chapter 13: Configuring a Linux E-mail Server


    # Restart the Sendmail Daemon to Activate the Changes


    You need to restart the sendmail daemon in order to put the changes into effect.
    Use the sendmail startup script to restart the daemon.


    ```

    /etc/rc.d/init.d/sendmail restart

    ```


    You should be able to test your system. While logged on as root, enter the command

    mail robbush@myisp.com


    This is a simple e-mail client. Whatever you want on the subject line, and then
    everything that you type in is part of the message that you are composing. Finish
    the message by entering a period (.) as the first character on a line and then
    press the Enter key. Press the Enter key once more at the CC:

    If you have a PPP connection to your ISP, then your message should be delivered
    immediately. Otherwise, your dial program will make the connection and your message
    is delivered. Log on to your ISP account and check for your message. It''s great
    if it works, but if it doesn''t, check the Troubleshooting section in this chapter.


    Restart the sendmail daemon to make it reread its configuration files.


    ```

    /etc/rc.d/init.d/sendmail restart

    ```


    # Installing imap


    The map RPM package needs to be installed in order for the Netscape clients to
    access the e-mail distributed by sendmail. Log in as root and do this as follows:


    ```

    rpm -ivh /mnt/cdrom/RedHat/RPMS/imap*

    ```


    The imapd daemon is kicked off by the inetd daemon. If you look in the /etc/inetd.conf
    file, then you see that there is an entry for imapd. Whenever Netscape, or any
    other imap based e-mail client, queries atlas (the e-mail server) the imapd daemon
    is started and negotiates the delivery of the e-mail.'
