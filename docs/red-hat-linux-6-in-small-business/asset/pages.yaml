  md: 'The Internet Protocols not only govern communication over the worldwide Internet
    but also on your own private network–the type described in this book. If your
    LAN uses Linux or Windows with TCP/IP installed, then you are using the same protocols
    to communicate with the computer in the next room as with the computer in Turkey.
    IP scales from the LAN to the Internet.


    # The OSI Network Layer Model


    Many operations occur every time computer speaks to another. The protocols that
    govern networking communication are hierarchical in nature, which means that there
    are several layers that deal with different aspects of networks. One layer works
    with the hardware while another specifies how the OS works with the hardware.


    The International Standards Organization (ISO) developed the Open Systems Interconnect
    (OSI) networking model. The model specifies how various protocols interact with
    each other. The OSI model is divided into seven layers, but for the purpose of
    this book I’ve simplified it to four layers. Figure 7-1 shows the simplified model.


    | | Telnet, FTP, SMB, etc. |

    |---|---|

    | 1. Application | |

    | 2. Transport | TCP, UDP, ICMP |

    | 3. Network | IP |

    | 4. Physical/data link | Device drivers (Ethernet, etc.) |


    Figure 7-1: The simplified 4 layer OSI networking model


    The layers are briefly explained in the following sections.


    # THE APPLICATION LAYER


    The application layer describes how the programs are to interact with a network.
    When you design an application like a Web browser or Telnet, you don’t want to
    worry about the details of how Ethernet works or how a packet of data gets from
    point A to point B. Therefore, you make use of the high-level functions defined
    by the application layer.'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# THE TRANSPORT LAYER


    This layer provides the high-level networking functions used by the application
    layer. These functions, or hooks, are used by the application layer programs to
    gain access to the networking functions provided by the operating system.


    Also, this layer contains the Transport Control Protocol (TCP), User Datagram
    Protocol (UDP) and the Internet Control Message Protocol (ICMP) protocols. These
    protocols provide different levels of handshaking that determine how information
    is sent across a LAN or the Internet.


    # THE NETWORK LAYER


    This is the layer that is responsible for routing information across a network
    or the Internet. It bundles the packets from the Transport layer into IP packets
    and is responsible for making sure the IP packets arrive at their intended location.


    # THE PHYSICAL/DATA LINK LAYER


    This layer deals with the hardware. It defines both the type of wiring used, as
    well as how the Ethernet NIC processes the electrical signals that it receives.
    It is responsible for decoding the modulated signal into a binary of bits. An
    Ethernet NIC can recognize when a bit stream is addressed to it.


    # Routing


    Routing is the process of directing IP packets from one network to another between
    machines on a network. Any TCP/IP based computer that wants to send information
    to a network other than it''s own must routing to direct the IP packets.


    # DNS


    Domain Name Service is the system that converts IP names into their numeric equivalent.
    For instance, when you direct your browser to www.swcp.com, that name must be
    converted to a unique numeric IP address that identifies the server. DNS performs
    that function (a DNS server is configured on the Linux server in Chapter 11).


