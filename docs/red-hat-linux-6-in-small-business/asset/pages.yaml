  md: '# Chapter 6


    # Administering Your Linux Server


    IN THIS CHAPTER


    +   - Understanding systems administration from the top down

    - Describing systems administration fundamentals

    - Managing user accounts

    - Backing up your Linux server

    - Using the Red Hat Package Manager

