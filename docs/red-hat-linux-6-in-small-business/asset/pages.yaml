    It returns the following information:


    ```

    serinfo:1.0 driver:427

    0: uart:1650DA port:3F8 irq:4 tx:0 rx:0

    1: uart:1650DA port:2F8 irq:3 baud:1200 tx:8 rx:59382 brk:5 RTS|DTR

