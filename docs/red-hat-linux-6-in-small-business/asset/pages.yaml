    # Editing Text


    Unless everything you type out perfectly the first time, chances, you''ll have
    to do some editing of your files. As mentioned, the backspace and delete keys
    delete one at a time. Pico also has some variations for deleting text. Ctrl-D
    deletes whatever character is at the cursor''s position. If you want to move a
    whole block of text around, move your cursor to the beginning of the block and
    press Ctrl-V (Ctrl-Shift-6) to mark the beginning of a block of text. As you move
    the cursor over and, pico highlights the text from that starting point. Pressing
    Ctrl-K cuts the text and holds it in a buffer. Move the cursor to the location
    you want to paste the text and press Ctrl-U. To deselect the highlighted text,
    press Ctrl-U again.


    If you want to check the spelling of your document, type Ctrl-T. Sometimes while
    editing and inserting characters in a line, a line or two can get out of alignment.
