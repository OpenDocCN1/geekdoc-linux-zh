  md: '# Part III: Connecting Your Network to the Internet


    tcp, udp, and icmp packets, coming from any location and going to any location

    from any port. Your firewall is now completely open.


    Test your system and whatever Internet access you are after should work. The next
    step is to discover what IP protocol is getting stuck. Change the rules to

    include separate ones for both the TCP and UDP protocols as follows:


    ```

    -F

    ipchains -P output DENY

    ipchains -P input DENY

    ipchains -P forward DENY

    ipipchains -A output -p tcp -j ACCEPT -s 0.0.0.0/0 -d 0.0.0.0/0

    ipipchains -A input -p tcp -j ACCEPT -s 0.0.0.0/0 -d 0.0.0.0/0

    ipipchains -A output -p udp -j ACCEPT -s 0.0.0.0/0 -d 0.0.0.0/0

    ipipchains -A input -p udp -j ACCEPT -s 0.0.0.0/0 -d 0.0.0.0/0

    ```


    You have now separated the tcp and udp protocols; the icmp protocol is ignored
    in this example for simplicity and because doesn''t play a factor in nearly

    asmany transactions as the other two. By modifying the source and destination

    addresses to their correct values (for instance, for outgoing udp packets the

    source address to your PPP IP address.) You should consult the ipchains.rules

    script for the details of the process.


    Test your system again. Once you have narrowed the problem down to a proto-

    col, then you need to find out the port.


    Next, try setting up rules for the individual interfaces. You should pay particular

    atention to your internal interfaces such as eth0 and lo. It is very easy to set
    up

    rules for those interfaces that interfere or deny communication on your private
    net-

    work. Once again, please refer to the ipchains.rules script for more details.


    Without going into more detail you get the idea. Like in all other troubleshoot-\ing,
    you want to successively narrow down the problem until you arrive at the

    solution.


    # Masquerading


    If you are having problems masquerading to work, then first check that you

    enabled IP forwarding in your Linux gateway. Check the file /etc/syscon-

    fig/network and make sure that the IPFORWARD_IPV4 is set to yes.


    ```

    IPFORWARD_IPV4=yes

    ```


    You need to restart your Linux networking to make the new rule take effect.


    ```

    /etc/rc.d/init.d/network restart

    ```'
