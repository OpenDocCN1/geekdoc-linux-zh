    # COMPRESSING TAR ARCHIVES


    The tar program includes the ability to compress and uncompress the data that
    it stores. It can use a couple of different compression formats, but Zip is the
    most commonly used. When the z parameter is used, tar uses the gzip program to
    compress or uncompress the data as it copies, lists, or extracts the archive.
    The gzip program uses the Lempel-Ziv coding (LZ77) format. The gzip program can
    be used independently to compress or uncompress any file). The previous archive
    commands would use compression if the z parameter is included. For instance,


    ```

    cvzf /mnt/zip/etc.tgz /etc

    ```'
