- img_proc: true
  md: '# Part II: Managing Your Linux Network


    /etc/inittab file. Most of the run levels include networking among those services.


    The start-up scripts are found in the /etc/rc.d directories. The directories are
    rcl, by rc6.d. They include soft links to the actual scripts that live in the
    /etc/rc.d/init.d directory. The network script, in that directory, is used to
    start and (stop) Linux networking.


    You can restart your network, for instance, by running the script as follows:


    ```

    /etc/rc.d/init.d/network restart

    ```


    Stopping and starting the network is done using stop and start as the parameter.


    If you look inside the /etc/rc.d/init.d/network script, then you see a reference
    to the /etc/sysconfig/network-scripts directory. There is an important file and
    directory in location. The network file contains the basic information about the
    Linux host name, network, IP address and domain name and such. The following is
    the network file used for this computer.


    ```

    NETWORK=yes

    FORWARD_IPV4=no

    HOSTNAME=chivas.paunchy.net

    DOMAINNAME=paunchy.com

    GATEWAY=0.0.0.0

    GATEWAYDEV=eth0

    ```


    It also shows where the default gateway is; in this case none exists. This book
    uses a PPP connection to the Internet. When the PPP connection is established
    over the phone, it becomes the gateway and you should modify the parameter appropriately.
    Please also note that you should have IP forwarding turned off FORWARD_IPV4=no
    unless the computer is acting as an Internet gateway.


    The directory, /etc/sysconfig/network-scripts contains many small configuration
    files. When you use the Linuxconf or netcfg utilities to configure your network
    parameters, the files in that directory get modified. For instance, look in the
    ifcfg-eth0 file as shown below.


    ```

    DEVICE=eth0

    IPADDR=192.168.1.254

    NETMASK=255.255.255.0

    NETWORK=192.168.1.0

    BROADCAST=192.168.1.255

    ONBOOT=yes

    BOOTPROTO=none

    ```'
