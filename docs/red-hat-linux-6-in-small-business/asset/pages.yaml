  md: '# Introducing Advanced Intranet Web Pages


    The Web page designed in this chapter is quite useful. I run a small Web page
    to provide extra information and help for my books. It is no more complicated
    than the type described here, and allows readers to download updated information
    and to use useful URLs. It demonstrates that you do not need to run a complex
    Web site to provide information to your target audience.


    Of course, you can run more complex Web sites. A small company can save time and
    money by distributing basic (and advanced) information via a Web page. For instance,
    if you run a Simplified Employee Pension (SEP) plan, then you might want to put
    information about that up upon your own intranet.


    Not only can you give employees access to static information, as the funds that
    your plan uses, but you can make it interactive. You might even make the forms
    related to the pension plan available via the Web page. That is a complicated
    process, and I won''t go into it. However, there are many books available on the
    subject, so I''ve mentioned it to spark your interest.


    # Securing Your Server


    The firewall that you run is essential to securing your Intranet Web page from
    unauthorized access. Another essential element is the security of your Linux Web
    page server itself. All the security functions and topics discussed in this book
    are relevant to the subject. You should secure the files that contain the information
    with the appropriate file permissions. For instance, if you have information on
    your SEP program, you do not want to grant read privileges to the entire intranet.


    You also have the distinct advantage of not giving access to the Web to your private
    Web page. I have assumed throughout this book that it is generally best for a
    small business or organization to pay an ISP to provide information to the Internet,
    which includes hosting your public pages for you. Unless you have a fast Internet
    connection like a T1, then running your Internet Web page on your own server will
    eat up your valuable bandwidth. The firewall described in this book can be altered
    to allow external access for Web traffic but that makes you more vulnerable to
    attack and misuse.


    # Troubleshooting


    The Apache system is simple in concept and execution. There is not much that can
    go wrong with it. If you do have problems, it is generally best to make sure that
    your private network is working. Consult the configuration and setup instructions'
  merge: -1
  pgno: 367
