    It might show something like the following:


    Apr 18 atlasdial[1312]: Specified device ''/dev/modem'' not a character device.


    There''s something wrong with the soft link /dev/modem. In this case, the link
    is pointing to the /dev/tty0 device file. Use the following command to find what
    serial ports are in.


