  md: '# Installing and Configuring the Apache Web Server


    The example in this chapter uses the Linux personal workstation veracruz, which
    has the IP address 192.168.1.1, as the Apache server.


    Log in as root on veracruz and install the Apache RPM packages.


    ```

    rpm -ivh /mnt/cdrom/RedHat/RPMS/apache*

    ```


    Start the httpd daemon as follows:


    ```

    /etc/rc.d/init.d/httpd start

    ```


    Check to make sure that it is running:


    ```

