  md: '# Chapter 1: Installing Red Hat Linux


    19


    The workstation mode makes two partitions out of the disk. The Root (/) partition
    uses the entire disk minus roughly 25M for the Boot (/boot) partition.


    The installation proceeds and the software that is deemed necessary and helpful
    by Red Hat is installed on the system. Please refer to the rpmlist.workstation
    file in the IDG directory on the companion CD-ROM for a list of those files. Once
    it has installed the software it continues with the installation as described
    in the section "Configuring Your New Linux Installation."


    # CHOSING THE CUSTOM CLASS


    If you choose the custom method then proceed to the next step—SCSI Configuration.


    # SCSI Configuration


    You are asked if you have any Small Computer System Interface (SCSI) devices.
    If you have a SCSI-based disks or other devices which as DAT tape drives, then
    you need to answer this question. The Red Hat installation process attempts to
    detect the device or devices.


    Expensive SCSI adapters, as the ones that come with ZIP drives, are often difficult
    to use. When it comes to SCSI adapters it is better to purchase the well-known
    name brands which you can find in the /mnt/cdrom/doc/HOWTO/Hardware-HOWTO file.
    (You can also consult the http://www.cis.ohio-state.edu/hypertext/faq/scsi-faq.html
    FAQ for more information.) Red Hat does a good job of recognizing such devices.


    The use of SCSI devices is not manage to this book. Chapter 17 does mention the
    use of both stand-alone tape devices and robotic tape library (i.e., jukebox)
    but does not describe their actual use. Please refer to the Red Hat Installation
    Guide for more information.


    # Disk Setup


    By choosing the Custom configuration you are given the choice of how to divide
    your disk. This is much more important consideration under Linux than DOS or Windows.
    Linux can be on a single partition but this can create problems down the line.


    There are different philosophies about how many and what sized partitions to use.
    The ones used in this book are based on the author''s experience and best judgement.
    They by no means are the only or even the best way to do it. Use your best judgement
    and consult other literature for other viewpoints.


    The suggested partitions for 1GB and 4GB disks are shown in Table 1-4. Please
    use your best judgement for smaller or larger disks.'
  merge: -1
