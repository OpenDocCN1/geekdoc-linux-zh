    # Moving Files


    If you don''t want to keep your own and want to move the file to lidia''s directory,
    you would use the mv command. The syntax is `mv filename newdirectory`. mv is
    also the command you use in Linux to rename a file. You would type `mv old-filename
    new`. In essence, what you''re doing is moving the file to the same location and
    giving it a new name.


    ```

    mv lidia.txt

    ```


    This example renames the file lidia to lidia.txt, but leaves the file it is.


    # Removing Files


    The rm command deletes files. The command


    ```

    rm /tmp/xyz

    ```


    deletes the file xyz in the temporary directory.


    Two of the important options for this command are: `-r` and `-i`. The `-r` forces
    rm to work recursively; it removes every file that is specified in a directory
    tree. Thus, if you enter `rm -r /`, then you risk removing every file on your
    disk—don''t try this at home.


    If you have copied a file and want to delete the original, or if you don''t need
    a file more, you can remove it with the rm command and the `-i` option. It''s
    used like `rm filename`. rm has a couple options you need to be familiar with.
    When you type your following:


    ```

    rm -i old.file

    ```


    Linux prompts you to confirm the deletion and you should get used to employing
    this option. When you delete a file in Linux, it doesn''t go into a trash or recycling
    bin and wait for you to *really* delete it. Your only option may be to restore
    the file from a backup tape.'
