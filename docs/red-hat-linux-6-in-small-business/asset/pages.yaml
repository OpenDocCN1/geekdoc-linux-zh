    # Using the List Command


    The ls lists the files in a directory; it is equivalent to the DIR command of
    DOS, but more flexible. Enter the following command at your shell prompt:


    ls


    It writes out the file names of your current directory, which in this case is
    the root user home directory (/root). There is nothing displayed because the only
    files in that directory at this time are "hidden" files or with their name prefaced
    with a dot or period (for instance, .bashrc). They won''t be displayed without
    adding a parameter to the ls command.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_72_1.png)


    Linux, as with all versions of UNIX, is case sensitive. The mean the text type
    must appear exactly as described. LS is different than 1s, for example. In fact,
    if you type LS, chances are you''ll get an error message like this: bash: LS:
    command not found.


    Commands that are provided along with Linux use parameters (also called options
    or flags). You can list the hidden files by using the following command:


    ls -a


    That command lists all the files in your current directory including hidden files.
    Now you should see something--least .bashrc. Parameters must be preceded with
    a dash (-) before the parameter.'
