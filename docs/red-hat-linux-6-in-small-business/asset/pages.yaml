- img_proc: true
  md: '# Chapter 11


    # Connecting to the Internet


    IN THIS CHAPTER


    +   - Learn how to connect to an Internet Service Provider

    - Learn how to connect your entire network to the Internet

    - Learn how to connect into your network via the phone system

    - Configure a simple DNS server

    - Learn how to troubleshoot your Internet connection


    CONNECTING TO THE INTERNET from a single computer is the extent of the online
    experience for many people. That''s the type of connection you use when you dial
    into an Internet Service Provider (ISP) from your home computer. The networks
    used by most large companies, institutions, and educational establishments are
    directly connected to the Internet via high speed, permanent connections. The
    term direct is used somewhat loosely for simplicity''s sake. To get a more detailed
    and precise description of how networks are connected to the Internet refer to
    a book that specializes in that subject. But for this discussion, think of the
    Internet as a single entity represented by your ISP.


    # Introducing Dial-Up Networking


    Linux provides all the tools to connect your network to the Internet. The tools
    are Linux''s general networking software, the Point-to-Point Protocol (PPP), the
    auto-dial-up system (dial) and IP masquerading (ipchains). Add them all and your
    network becomes part of the Interneta full-fledged part with all the capabilities
    found in traditional, large institutions.


    PPP is a protocol that piggybacks the IP protocol; PPP encapsulates IP and allows
    it to be sent over a serial line. When you use a modem to connect with another
    modem you have a serial line connection that is made over a regular telephone
    connection. PPP converts that phone connection into a complete, but not fast,
    Internet connection.


    The dial software monitors the network you created in Chapters 1 and 7 for IP
    packets that want to go to the Internet. For instance, if you up Netscape Navigator
    and click on Search, then Navigator requests a connection to an external'
  merge: -1
  pgno: 266
- img_proc: true
  md: 'IP address (the network configuration described in this book means any IP address
    that is not 192.168.1.X). When the dial program starts, it automatically creates
    a default route. The Netscape packet is routed by Linux to the default route;
    and then Dial sees it, picks up the modem, dials the ISP and establishes a PPP
    connection. All external packets can then find their way out and back via that
    connection. Your network is connected.


    The ipchains system allows your private network''s public IP addresses to work
    on the Internet. When you connect your individual Linux or Windows computer to
    the Internet without PPP ipchains, your computer uses the single IP address that
    the ISP assigns to it. No other computer on your private network can use that
    address. However, by using ipchains your entire private network can share a single
    IP address. Thus, each of your computers appears to the Internet as a valid IP
    address. All traffic from your network is routed through your Linux gateway, which
    does the IP masquerading (also known as IP Network Address Translation, or NAT).


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_267_0.png)


    There''s an exception if you have registered a domain with valid IP addresses.
    In that case, IP masquerading is not necessary and your Linux gateway simply route
    the packets back and forth to the Internet. However, IP masquerading can still
    be useful in that case because it provides extra security by hiding your real
    IP behind a temporary one.


    Combine all three systems together and you get to connect your network to the
    Internet. The following sections describe the process for configuring these tools.
    Keep in mind that the description assumes that you use an ISP that can provide
    you with the information to configure the systems. If your ISP uses Linux servers
    then you most likely not have problems.


    # # Choosing an ISP


    Choosing a reliable and technically astute ISP is the essential prelude to connecting
    to the Internet. ISP''s are still pretty new as a business and it is difficult
    to separate the good from the bad. The more information that you can gather on
    your potential ISPs, the better chance you have of finding a good one.


    Your ISP''s web page is a good place to start looking for information. Try to
    assess how professionally they conduct their business and obtain their price and
    service information. The customer service and technical help that a company can
    offer is more important than their price. You should evaluate your ISP''s level
    of professionalism as you would any other vendor that provides a service your
    company is going to rely on.'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# Chapter 11: Connecting to the Internet


    Talking to ISP’s support technical people is another good way to judge competence.
    This can be something of a chicken and egg dilemma making a technical judgement
    at this stage in your technical development can be problematic. However, it should
    be possible to gain some idea of how they conduct their business and treat their
    customers.


    The technical assistance that an ISP can give you is far more important than the
    price of their connection. Connecting to the Internet is not rocket science, but
    it can be difficult. Consider that any time you spend sorting through the initial
    fusion of getting your connection is money lost. Alternatively, any time spent
    waiting for an ISP to handle network outage or a cracker attack is also wasted.


    # High Speed Connections


    There are several ways to obtain high speed Internet connections. The phone system
    connections discussed in this book reach up to 56 Kilobytes per second (Kbps)
    of throughput (the amount of data passing over the wire) and should support a
    small operation if used judiciously. However, it is possible to multiply by speed
    5, 10, 20, and 60 minutes if you are willing to pay for it. The technologies available
    for this include Frame Relay, ISDN, DSL, satellite, and cable mediums. Frame Relay
    is universal in the United States and is available through the Baby Bells and
    smaller companies. Satellites (which provide one and two-way connections) can
    work almost anywhere. The other technologies are available in some areas but not
    others. Please consult the World Wide Web (WWW) or your local ISP for more information.


    # Obtaining Network Information


    Once you have selected an ISP, do your homework before attempting to connect your
    network. To make a PPP connection, you need to find out if you are going to be
    supplied with a dynamic or static IP address (dynamic address is by far the most
    common method today), the dial-up phone number(s) and what your PPP account password
    is. You will need this information to configure your software.


    In addition you need to know what the prompt strings the PPP server uses. The
    dial program described in this chapter requires specific information about the
    PPP server’s prompt. If your ISP can provide you with the information, then great.
    If not, the dial software can make some reasonable guesses. If it doesn’t work,
    then you can always determine the information yourself by using the manual configuration
    method described in the section “Manually Connecting to the Internet” later in
    this chapter.


    # Deciding on the Connection Type


    The following sections describe several methods for establishing a PPP connection.'
  merge: -1
  pgno: 268
- img_proc: true
  md: 'The Red Hat LinuxConf and Control administration tools provide connection systems.
    They are automatic in the sense that they negotiate the dial-up process, as well
    as the authentication and kick off of the pppd daemon. However, both need to be
    started and shut down by you, the Linux user.


    The dip program is completely manual (unless you configure it to use the chat
    scripting, but that process is not discussed in this book). You run dip from the
    command line and provide it with the information to connect, including the PPP
    account name and password.


    The dial program is totally automatic once it is configured (you supply the information
    to it about how to connect to your ISP). Dial constantly monitors your network
    for traffic destined for the Internet. Once detected, dial dials the ISP, enters
    your PPP account name and password, and then fires off the pppd daemon. Starting
    pppd, dial also creates a default route through which external traffic is shifted.
    (Dial is not limited to creating a default route but can create any route that
    you tell it to.) However, most simple networks—those that are not permanently
    connected to the Internet—generally need only a default route.


    # # Connecting to the Internet via a Dial-Up Connection


    The simple yet ubiquitous telephone is largely responsible for creating the modern
    Internet. Without this cheap and universal method for making connections, the
    Internet would be the domain of the large company or institution. However, with
    a phone line and the right software, anyone can become a complete part of the
    net. Linux takes the process a step further, and permits the entire private network
    to become part of the Internet.


    The following sections describe how to connect your Linux server and network to
    the Internet via your ISP. The first section uses the Red Hot Control Panel GUI
    to make the connection. Next, dip is used to show how to manually connect to the
    Internet, and is also used to show some of the details of the connection process
    in anticipation of configuring dial. Finally, a description of using dial and
    making use of the information gleaned from using dip.


    # # Building a Dedicated Linux Gateway


    The Linux computer that you use as a gateway to the Internet is an essential part
    of your private network''s security. You can use your Linux file/print server,
    called chivas in this book, as your gateway, but it is best to use a separate
    machine. The fewer software packages that you have running on your Linux gateway,
    the less opportunity there is for mistakes and mischief. The idea is to build
    a minimalist Linux computer that can only perform as a gateway and a firewall,
    as explained in Chapter 12.'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# Chapter 11: Connecting to the Internet


    There are several ways to make a dedicated Linux gateway. You can install the
    basic Red Hat installation on a PC and remove all the necessary packages, or you
    can create a specialized Red Hat installation via the Kickstart function. You
    can also use a Linux distribution, such as Trinux (www.trinux.org) that''s designed
    for the purpose.


    Since this is an introductory book, the first method is used. It is recommended
    that you install Red Hat Linux on another PC dedicated as a firewall. Don''t worry
    if you''re using a 486 PC; they do quite well in that function because bottlenecks
    generally occur at the network interfaces. Also, a 486 computer can generally
    readily keep up, even with a T1 interface.


    After installing Red Hat again, remove the packages by running the make_firewall.sh
    script found in the /mnt/cdrom/firewall directory on the companion CD-ROM. Log
    in as root and run your script:


    ```

    /mnt/cdrom/firewall/make_firewall.sh

    ```


    The script uses the rpm -e command to remove all the unnecessary RPM packages
    and you are left with a minimalist Linux computer suited for running a firewall.
    The Linux computer atlas, shown in Figure 11-1, is used as the Internet gateway
    and firewall in this book.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_270_0.png)


    Figure 11–1: Network diagram for connecting to the Internet'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# Setting up Your Modem


    You should first make sure that your modem is working correctly. Unfortunately,
    if you have a Winmodem, it will not work with Linux. Winmodems are internal modems
    that are designed to work only with Windows. Second, if you have a modem with
    Plug and Play capabilities, you should turn them off if you can.


    It is easiest to work with external modems. You can turn them on and off at will;
    something that''s useful when your modem gets stuck for whatever reason. You can
    also see the transmit and receive lights as well as the connection indicators.
    External modems need to connect to one of the two serial ports that are standard
    on PCs and please consult your modem manual for more information about making
    connections.


    Internal modems are more difficult to install and configure. The difficulty lies
    in the necessity of opening up your computer case and plugging in the modem. Internal
    modems also require their IRQ and IO ports to be set correctly. Some modems can
    be changed from their DOS-based configuration software with others, you need to
    physically change switches or dip connectors. Please consult your modem manual
    for more information about configuring it.


    PCMCIA modems require loadable modules that match the modem type and manufacturer.
    PCMCIA modems are generally used in laptops and are beyond the scope of this book.


    Once you have connected and configured your modem, it''s useful to set a soft
    link to point to the device file that controls it. Table 11-1 shows which devices
    respond to which IO10 addresses (the DOS equivalent is also shown).


    # 11–1 SERIAL IO AND INTERRUPT ADDRESSES


    | Device | IO Address | IRQ | DOS Equivalent |

    |---|---|---|--|

    | /dev/ttyS0 | 0x03f8 | 4 | COM1: |

    | /dev/ttyS1 | 0x02f8 | 3 | COM2: |

    | /dev/ttyS2 | 0x03e8 | 4 | COM3: |

    | /dev/ttyS3 | 0x02e8 | 3 | COM4: |'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# Chapter 11: Connecting to the Internet 245


    Notice in Table 11-1 that the four potential ports share only two interrupts.
    If you try to use two devices sharing the same interrupt, your system will hang.
    One way around this is to use one or more internal modems and specify different-interrupts
    for each (consult your modem manual for the settings).


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_272_0.png)


    If, for instance, you have a modem attached to device /dev/ttyS1, then enter the
    following command to create the link.


    ```

    ln - s /dev/ttyS1 /dev/modem

    ```


    You can see the link by listing the directory as follows:


    ```

    ls -1 /dev/modem

    ```


    You can see that the link is created.


    ```

    lrwxrwxr-x 1 root root 4 Jan 18 21:14 /dev/modem@>/dev/ttyS1

    ```


    Instead of using the /dev/ttyS1 when configuring your PPP dial connection, you
    can use /dev/modem instead. The latter is much easier to remember than former.

    You can also use the Modem Configuration GUI in Control Panel to perform the same
    job.


    Please see the /usr/doc/HOWTO/Hardware-HOWTO, /usr/doc/HOWTO/Modem-HOWTO and.
    /usr/doc/HOWTO/Serial-HOWTO files for more information.


    # Using the Network Configuration to Connect to the Internet


    Log as root. Click the Gnome start (the little gnome footprint in the lower corner
    of your screen). Click the System menu -> Control Panel buttons. Now the Control
    Panel is activated and you should click the Network Configuration button, which
    is second from the top. The Network Configuration (netcfg from the command line)
    window with the Names tab, is displayed.


    Click the Interfaces tab and the Network Configuration screen with the Interfaces
    information, as shown in Figure 11-2, is displayed.'
  merge: -1
  pgno: 272
