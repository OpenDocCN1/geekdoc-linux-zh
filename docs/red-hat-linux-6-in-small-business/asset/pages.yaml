    # Displaying the Process Table


    Linux is a multitasking, as well as a multiuser operating system. Multitasking
    means that more than one process can run at the same time. Actually, each process
    is given a time slot by the kernel—roughly 20/1000 seconds or 20 milliseconds—and,
    thus, effectively is running at the same time.


    There are numerous processes running in the background all the time (other than
    the ones you''ve set in motion yourself). They''re called daemons and are generally
    system processes that run in the background all the time. Functions such as printing
    are in the form of a daemon so that your print jobs are immediately processed
    when you submit them.


    The kernel keeps track of all processes by maintaining a Process Table. You can
    view it by logging on as root and typing the following:


    ```

    ps

    ```


    then, you see a few process entries with five columns of information.


    ```

    PID TTY STAT TIME COMMAND

    430 1 S 0:00 -bash *

    ```'
