- img_proc: true
  md: '# Part 1: Building and Using a Basic Linux Computer


    If you do not know the manufacturer and/or model of your NIC, then look for the
    manual. If you don''t have the manual, then it is best to power your system, unplug
    the power cord, open up the case, and look at the adapter. At worst, you can systematically
    select the NICs from the list until you find that works.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_53_0.png)


    # Module Options


    This step allows you to manually enter the interrupt and input/output (I/O) information
    of your NIC or let the install program attempt to automatically find it. Linux
    may still have trouble with Plug ''n Play (PnP) hardware. If you are using a PnP
    Ethernet NIC, then turn it PnP off if you encounter problems. To turn off PnP,
    you should first reboot your computer under DOS/Windows and then use the configuration
    program — 3c5x9cfg for NICs.). If you are installing Linux on a computer that
    only runs Linux then you won''t lose anything by turning off PnP anyway.


    # Configure TCP/IP


    This is where the host information is entered. Figure 1-4 shows the IP address,
    Netmask, Default Gateway, and Primary Nameserver entries. The IP address is the
    number address that every computer requires to use the TCP/IP protocol suite.
    The Netmask tells the host kind of addressing scheme is used on the LAN. The Default
    Gateway refers to the computer that acts as the interface to the Internet. The
    Nameserver entry is the IP address of the computer that translates the numeric
    IP address into the more familiar IP name.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_53_1.png)


    Figure 1-4: Entering the host IP address and other information'
