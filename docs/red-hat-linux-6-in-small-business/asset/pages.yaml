    # Using whatis


    The whatis command isn''t exactly a way to find files. It''s more of a tool to
    help you find out what a file does. As with locate you need to first make a whatis
    database. To do this, type the following while logged in as root.


    whatis


    After the database has been built, whatis gives you a quick summary derived from
    the command''s manual page. Type the following at the command line prompt:


    whatis xclock


    and whatis it returns the following information:


    xclock (1lx) - analog / digital clock for X


    As with the locate database, you have to run makwhatis fairly regularly to keep
    it current. Red Hat Linux runs the makwhatis periodically on a weekly basis.


    # Looking for Man Page Keywords


    You can look for a command or file by submitting a keyword to the apropos command.
    The apropos command uses the whatis database-configured as a default by Red Hat-to
    find files based on keywords you. For example, if you can''t remember the name
    of the program xclock but you know that it''s related to the word clock, then
    type:


    apropos clock


    It returns the man page entries that include the clock keyword. The whatis data-base
    maintains the keywords:


    +   adjtime (2) - tune kernel clock

    alarm (2) - set an alarm clock for delivery of a signal

    clock (3) - Determine processor time

    clock (8) - query and set the hardware clock (RTC)

    clock (n) - - Obtain and manipulate time

    setclock (8) - sets the hardware clock from the system clock

    asclock (1lx) - the AfterStep clock

    rclock (ouR CLOCK) (1) - clock and appointment reminder for X11

    xclock (1lx) - analog / digital clock for X'
