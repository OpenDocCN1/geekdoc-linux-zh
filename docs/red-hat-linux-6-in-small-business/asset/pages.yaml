    writable = yes

    ```


    The browseable option controls whether the home shares are displayed in the list
    of available shares from Windows machines (or any computer capable of browsing
    the network). Normally, you don''t want to do this, and the default is no. The
    writable option means that Samba gives permission to write to the share; this
    option can be dangerous if you do not properly authenticate your users.


    When using user security mode each Linux user account home directory becomes the
    default share for that user. For instance, if you are working from a Windows machine
    as user X with password Y, if there is a user account X with the password Y on
    the Linux-Samba server, you automatically can access that. User security mode
    is the Red Hat Samba default, and is discussed in the "Understanding Authentication"
    section.


