  md: '# Chapter 12: Creating a Simple Firewall


    Next, check that the masquerading rule has actucally been set up with the ipchains
    -L command. You should see the following.


    ```

    Chain forward (policy DENY):

    target prot opt source destination ports

    MASQ all — 192.168.1.0/24 anywhere n/a

    ```


    If you still not find the problem, then refer to Chapter 7 to make sure your network
    connections are working correctly. Next, check the HOWTO documents and man pages.


    # DNS


    If you have problems with the DNS server, then you should first look in the /var/log/name.run
    log file. It show information about what is going on with the system both the
    startup process and general operation. Make sure that all the files defined in
    the /etc/named.conf file exist and are in their correct directories.


    Keep in mind that local DNS is optional. From the Linux server''s perspective,
    you can easily track and find the other machines on the network as long as the
    /etc/hosts file is accurate and up to date. All of your machines find their way
    around on the Internet by using your ISP''s DNS server. Make sure that your /etc/resol.conf
    file has the correct ISP DNS server in it. You have to suffer the delay while
    your Linux gateway connects to the Internet before getting domain names resolved
    but it will get you your IP numbers.


    # Summary


    This chapter describes how to set up a firewall to protect your private network
    from the worst of the Internet. The ipchains system is used as the heart of the
    firewall. It provides IP filtering that provides excellent protection when used
    in conjunction with the hybrid firewall described in Chapter 11. When combined
    it can be maintained in order to continuously provide maximum protection.


    +   - An introduction to firewalls is discussed and the three basic types are
    described. The advantages of each are briefly discussed and the reasoning for
    the use of a hybrid firewall in this book is given.


    +   - An introduction to the ipchains system is given. Its basic functions are
    explained. A simple example is given.'
