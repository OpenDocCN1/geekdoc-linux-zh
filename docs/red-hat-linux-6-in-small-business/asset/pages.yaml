  md: '# Part II: Managing Your Linux Network


    Computer security is the process of protecting yourself against the known threats
    and educating yourself in order to anticipate and react to the new ones. There
    are many types of threats and tools to protect against them and it is difficult
    to learn them all. Given enough time and effort you can become well-educated about
    the overall threat to your computer system. However, while you are learning the
    overall process there are several steps that you can take to protect your system.
    The following sections describe the basic steps.


    # Layering Your Security


    In order to protect against both the known and unknown threats, you need to layer
    your security. Trust no single mechanism or tool. There is no firewall, or encryption
    technique that is foolproof. The more locks, fences and walls that you put up
    the safer you will be.


    # EXTERNAL SECURITY


    All the normal methods are useful here. Lock your doors, limit access to your
    server room, allow only access to authorized personnel, log out when you are not
    present at your computer, and whatever procedures make sense for your operation.


    Another thing that should be mentioned is that the information you reveal about
    your computer operations, the less a potential cracker can use against you. For
    instance, if you are running a mail order business, then it is probably not to
    advertise your operation on the front of your building. A big sign proclaiming
    www.mailordercoisphere.com might just perk some cracker''s interest in you.


    More subtly, however, is the need to keep important information from potential
    crackers. A system''s information is the cracker''s number one tool for breaking
    in. The more a cracker knows about your system, the greater the range of security
    holes that can be found and used against you.


    # INTERNAL SECURITY


    Internal security measures consist of all the normal measures, such as using good
    passwords. The policies that you set up also are important for your internal security.
    Letting employees know what is and is not permits helps improve security. For
    instance, maybe you''ve decided that the use of your Internet connection to download
    pornography is strictly forbidden, while on the other hand, casual use of your
    Internet connection is generally an OK thing as long as work is being done. Make
    sure that everyone on staff aware of these guidelines.


    You should require that your employees or volunteers always log off, or screen
    locks on, their systems when they are not present for more than a minute or two.
    This is inconvenient but the best passwords are worthless if you don''t use them.


    Just as you don''t want to leave unnecessary information lying around operation
    from the outside, you need to consider that much computer crime occurs on the'
