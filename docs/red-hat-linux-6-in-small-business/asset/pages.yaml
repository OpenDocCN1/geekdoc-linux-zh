- img_proc: true
  md: 'Navigate through this screen and enter the mount point (/) and size. If you
    press the Space bar on the Growable option, then gets turned on. This means Disk
    Druid expands the disk space for the particular partition using its algorithm;
    every partition with this option toggled adjusts its size dynamically until you
    quit Disk Druid. You also need to set the Type field to Linux Native. You can
    tab each option continuously. Press OK when you are satisfied with the values
    and return to the screen shown in Figure 1-1 but it contains the new partition.


    Continue the previous two steps to create each new partition. Don''t forget to
    create a swap partition (the swap partition does not have a mount point because
    Linux reads and writes directly to the disk). You can use the Delete button to
    remove any or all partitions. You can also use the Edit button to modifying the
    existing partitions.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_49_0.png)


    Linux is a demand-aged, virtual memory operating system. That means that it can
    "swap" out portions of memory, called pages, to disk when its memory is filled
    up. The place on disk where it stores the information is the Swap partition. A
    reasonable rule of thumb is to make the swap partition 2.5 times the size of the
    RAM in a computer (up to 128MB), if you have enough hard disk space available.


    Once you''ve added all the partitions that you think you need, you can go back
    and edit any or all of the partitions. You should see the basic information about
    the partition that you can edit as you see fit.


    Once you are satisfied with all your partitions, click the OK button. You are
    prompted to save the new partition table. Click OK and a status window called
    Running... is displayed.


    # # Active Swap Space


    Next, you are asked what partitions you want to use for swap space. You only have
    created one swap partition, so your only decision is whether you want to check
    for bad blocks while formatting the swap partition. It takes longer to do so,
    but creates a more reliable partition. It''s reasonable to check for bad blocks
    the first time through. If you''ve repartitioned your disk in the near future
    it is probably not necessary.


    # # Scanning


    The system looks for packages to install.'
  merge: -1
