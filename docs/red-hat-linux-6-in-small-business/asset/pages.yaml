    # Using Real Backup Media


    Running a backup to a null device is an excellent method for learning the Arkeia
    basics and testing the software. The configuration process requires some attention
    and patience; but if you set up a null backup two or three times, you''ll begin
    to understand how things fit together. The knowledge that you''ve gained can now
    be used to create a real backup.


    Arkeia provides the ability to use a zip drive as the backup media. The disk can
    be a floppy or Zip disk as well as a hard disk (it is possible to use other types
    of disks as well). When a disk is used it is referred to as a file. Under Arhelia,
    a file is an abstraction for a physical storage medium. (Most backups make use
    of tapes. The file concept is added to provide a generic method for accessing
    a disk.)


    # Configuring a Zip Drive Backup


    The following example makes use of a Zip disk (sometimes referred to as a Zip
    diskette). Zip do not store much data compared to DAT or DLT tapes, but can be
    useful for small operations and are certainly well suited for learning the Arkeia'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# Part II: Managing Your Linux Network


    system. They are fairly common and thus provide another learning tool that almost
    everyone will have access to.


    You can also use a hard drive to store data. A hard drive is generally not a good
    place to save long term data, but it does provide another good mechanism to learn
    how to set up your backups.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_253_0.png)


    In some cases, a hard drive is a backup alternative. For instance, a medium size
    retail chain in New Mexico, with 70 stores, uses a UNIX server for each store,
    with an extra hard drive installed in each machine for backups. The backups are
    made daily and are recycled on a monthly basis. In this case, hard disks work
    better than tapes because they are cheaper and do not require much maintenance.The
    backups are made with a simple tar command that is executed from cron. Arkia would
    make sense for this retail chain''s circumstances because it has more functionality
    than tar and is inexpensive.


    The previous example showed almost every graphical menu that you will encounter
    while running Arkeia. The method is used to make the example easier to follow
    the first time. The following example, however, is given in list form without
    any illustrations.


    # MOUNT A ZIP DISC


    Arkeia requires a mounted file system to be in conjunction with the File media
    type. For this example you must mount a blank Zip disk.


    Login as root. Insert a Zip disk into the drive and enter the following command:


    ```

    mount /dev/hdb /mnt/zip

    ```


    The /dev/hdb is used in this example. An IDE Zip drive can be /dev/hda, /dev/hdb,
    /dev/hdc or /dev/hdd


    If you want to use a DOS formatted Zip disk, use the following command. mount
    -t mdos /dev/hdb4 /mnt/zip


    To use a floppy disk the command should be:


    ```

    mount /dev/fd0 /mnt/floppy

    ```


    # CREATE A FILE DRIVE


    Opens the Drives management window, then from the Server administration window,
    click Devices -> Drives management. Create the new drive called File Drive. From
    the Drives management window, click New, enter the name File Drive, and'
