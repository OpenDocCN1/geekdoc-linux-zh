    # # Configuring General Parameters


    By default, the sshd configuration allows root logins. The better practice is
    to not

    allow direct root logins and force everyone to log in as a regular user. Those
    who

    have root privilege can use the su command to access root. That leaves an audit

    tail and forces everyone to use two passwords instead of one to gain root

    access.


    Edit the /etc/ssh/sshd2_config file and set the PermitRootLogin parameter

    from you to no:


    ```

    PermitRootLogin    no

    ```


    Another change is to disable password logins. The secure shell default

    operation is to revert to using the general Linux login password to authenticate
    the

    connection if pass phrase fails. This could prevent an intruder with the possib-

    ity gaining access if, for instance, the password file has been cracked or inter-

    cept. Changing this option is not a panacea but does potentially provide extra

    protection. Changing the parameter in the /etc/ssh/sshd2_config file to

    the following:


    ```

    PasswordAuthentication    no

    ```


    There are numerous other parameters that can be changed. Please consult the

    sshd2 man page for more information.


