  md: '# Chapter 1: Installing Red Hat Linux


    LILO allows you to start one or more operating systems. It allows you to set one
    as the default. More details of how to configure LILO is discussed in the section
    " Red Hat Linux."


    # Installing Red Hat Linux


    Completing the preparation in the previous sections should help you through the
    following installation process. The thing to keep in mind is that the average
    PC is a complex piece of machinery and there are many things that can go wrong
    to foil the process. Having done your homework helps greatly.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_40_0.png)


    If you purchase the Red Hat box, you receive a manual that does a good job of
    describing both the installation and basic administrative process. That manual
    is included on the companion CD-ROM in HTML format for the directory /mnt/cdrom/doc/rhmanual/manual.At
    this point gaining access to it might be a problem since you have not installed
    Linux yet. If you have another computer with a browser and CD-ROM you should be
    able to view it.


    You can get the installation process started via three different ways: a DOS program
    called AUTOBOOT.BAT, booting directly from the Red Hat distribution CD-ROM, or
    from a Red Hat boot floppy.


    # Using the AUTOBOOT.BAT method


    The DOS program AUTOBOOT.BAT can be used if you are already running under Windows
    or DOS. If you have the companion CD-ROM already inserted as the D: drive, enter
    the following commands.


    ```

    D:

    CD \DOSUTILS

    AUTOBOOT.BAT

    ```


    A minimal Linux kernel is loaded into memory and started. You proceed as though
    you had the more common boot floppy method. If you use autoboot.bat, then you
    should proceed from here and skip over the next section that describes how to
    use a boot floppy.'
