- img_proc: true
  md: '# Postgres and Applixware Data


    Configuring PostgreSQL and Applixware Data is not an easy process. Both systems
    are quite complex and require a lot of work to learn in depth. The discussion
    here covers some of the most common hints and problems one encounters.


    +   - You need to have the postgres-data RPM installed in create a new database.
    You can create your own templates but it is much easier to do with the postgresql-data
    package.

    - You should use the postgres Linux user and create, modify, and delete all databases
    from there.

    - The postmaster process must be running in order to create a database with the
    creatdb command. The postmaster should be started by the postgres or non-root
    user.

    - When creating tables and other SQL database objects, you need to pay close attention
    to the syntax of the commands that you use. Case is not important but characters
    like semicolons.

    - The same holds true for adding, modifying and deleting database records. Please
    pay close attention to syntax.

    - The .odbc.ini and axnet.cnf files all need to be configured correctly in order
    for the Applix Data interface to work with a SQL database. Pay special attention
    to the library path names.


    When trying to connect Applixware Data to your database, the following common
    messages can be remedied as shown (this information is derived from section Common
    Problems in Chapter 55 of the PostgreSQL tutorial and was contributed by Steve
    Campbell).


    +   - Cannot launch gateway on server. The elodbc driver could not find the libodbc.so
    library. Your axnet.cnf file is probably misconfigured.

    - Error From ODBC Gateway: [IM003::[ODBC]DRIVER] driver could not be loaded. In
    this case, the libodbc.so library cannot find the driver specified in the file.
    Your .odbc.ini file properly needs to be reworked.

    - Server: Broken Pipe. The driver process (axodbc in the case of Applixware Data)
    encountered some problem and stopped without completing its job.


    Refer to the usr/doc/postgresql-6.4.2/tutorial/tutorial.html and other documents
    in that directory for more information on this process.'
  merge: -1
