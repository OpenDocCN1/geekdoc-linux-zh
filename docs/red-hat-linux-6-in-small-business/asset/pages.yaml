  md: '# CHOOSING THE SERVER CLASS INSTALLATION


    The server class attempts to write the five partitions shown in Table 1-2 to your
    disk.


    # TABLE 1–2 THE RED HAT SERVER CLASS PARTITIONS


    | Partition | Description |

    | --- | --- |

    | / | The root partition. The mount point of all partitions |

    | /boot | Contains the Linux kernel and extras needed for booting |

    | /usr | Libraries and other static files. Also extra applications |

    | /var | Variable files such as logs and temporary files |

    | /home | User directories |


    The root (/) and var (/var) file systems are made equal in size to each other.
    The usr (/usr) and home (/home) partitions are allocated the same space too. The
    boot (/boot) partition is only allocated enough space (about 25MB) to store the
    Linux kernel and associated files needed to boot the computer. The root and var
    are each roughly 10 percent of the disk space as the usr and home partitions.


    The setup program will install the software that is deemed necessary and help-ful
    by Red Hat. Please refer to the rpmlist.server file on the companion CD-ROM for
    a list of those files. Once it has installed the software continues with the installation
    as described in the section "Configuring Your New Linux Installation."


    # CHOOSING THE WORKSTATION CLASS INSTALLATION


    The Workstation class attempts to write the two partitions shown in Table 1-3
    to your disk.


    # TABLE 1–3 THE RED HAT WORKSTATION CLASS PARTITIONS


    | Partition | Description |

    | --- | --- |

    | / | The Root partition. In this case it contains everything |

    | /boot | Contains the Linux kernel and extras needed for booting |'
  merge: -1
