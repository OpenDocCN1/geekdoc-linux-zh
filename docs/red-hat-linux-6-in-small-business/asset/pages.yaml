  md: '# Part III: Connecting Your Network to the Internet


    Dip hesitates for a second or two and then exits, returning you to your bash.
    If all went well, you can use the netstat -i command to see your new default route
    to the Internet as shown below (the ppp0 is the route to the Internet).


    | Kernel Interface table |

    | Interface MTU RX-OK RX-ERR RX-DRP RX-OVR | TX-OK TX-ERR TX-DRP TX-OVR Flg |

    | eth0 1500 0 0 0 59 0 0 0 BRU |

    | lo 3924 0 2869 0 2869 0 0 0 LRU |

    | ppp0 1500 5 0 0 5 0 0 0 OPRU |

    | slp0 1500 0 0 0 187 0 0 0 OPRU |


    The ppp0 is the default route to the Internet via your ISP.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_279_0.png)


