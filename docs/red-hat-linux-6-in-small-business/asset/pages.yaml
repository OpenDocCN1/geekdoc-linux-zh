    # LINUX APPLICATIONS


    If you think the idea of a free operating system is appealing, how about free-software?
    Numerous sites exist with free Linux software for you to download. Most are organized
    by category so finding what you need is fairly simple. Check out the following
    to get started:


    ```

    http://www.linuxapps.com

    http://www.xnet.com/80/-blatura/linapps.shtml

    http://freshmeat.net

    ```


    # Linux Newsgroups


    Although some Web sites have discussion forums, most of the time it''s one-way
    communication—searching for information. What if you have a question that isn''t
    a FAQ or it''s not covered at any site you think of? A good place to turn to is
    newsgroups.'
