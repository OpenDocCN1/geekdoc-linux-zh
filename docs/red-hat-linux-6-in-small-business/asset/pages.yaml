    Red Hat creates a group for every new user. If you add the user paul, the numeric
    id might be 500. The group id for the group is set to 500 too. This method allows
    all of a user''s files to be private unless the user wishes to share them. In
    that case, you add another user''s or group''s name to the user''s group in the
    /etc/group file.


    For instance, if you want to allow lidia and aida to access paul''s files, edit
    the following line for the user paul in the /etc/group file.


    ```

    paul:x500

    ```


    and add the users lidia and aida:


    ```

    paul:x500:lidia:aida

    ```


    This allows both of those users to access paul''s files. The caveat is that lidia
    and aida can only access files with the group permissions allow access. For instance,
    the following file


    ```

    -rw-rw-r-- 1 paul 312 Mar 31 20:36 Xrootenv.0

    ```


    belongs to paul and the group paul. The group access is read and write, so lidia
    and aida can both read and write to that file.


