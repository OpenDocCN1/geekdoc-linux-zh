    The first port (0) looks like it is unused. The second port, (1) is probably a
    serial mouse because 1200 baud modems have not been in use for years. The third
    one, however, has a 115,200 baud, which is a high bandwidth connection (for a
    serial port device). Modems don''t run at that speed but they do communicate with
    the computer device. It''s a good bet, so change the soft link to refer to the
    new device.


