    For instance, the fact that you devised a good password system in Chapter 6 should
    be complemented by the construction of a good firewall (see Chapter 11). The firewall
    should be supplemented by regularly scanning your system, taking fingerprints
    of your files, and monitoring the system logs. If your firewall is a good one,
    then with a little luck, the sanctity your passwords should never be tested. But'
