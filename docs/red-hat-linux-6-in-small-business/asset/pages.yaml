  md: '# Anticipating Problems


    The directed nature of this book precludes spending much time on all the topics
    that comprise the various systems. Therefore, we need to emphasize the topic of
    troubleshooting. If and when problems occur, you should be aware of the methods
    available for solving them.


    Troubleshooting is as much an art as a science. The more you know about your computers
    and network, the better you''ll be able to see the cause. The innate knowledge
    that you build from working intimately with a complex system over time often helps
    you find a problem without being aware of how you can to the solution. However,
    you should keep in mind that certain methodologies work quite well even when you
    do not have knowledge of a system.


    The basic troubleshooting method is very simple: work backwards from the symptoms
    to the cause. If you eliminate simple causes of a problem then you will eventually
    find the root cause. For instance, if your computer does not turn on, then you
    should first check to see if the power cord is connected before you start looking
    to see if the power supply is broken.


    The chapters that deal with configuring hardware or software all contain troubleshooting
    information. Please keep in mind that they are not intended to be allinclusive
    but are aimed at pointing you in the right direction.


    # Conventions Used in this Book


    To help distinguish the various types of commands (Linux, OS), URLs, and file
    names that appear in this book, the following typographic conventions are used:


    Windows menu instruction sequences are given as a connected sequence of menu names
    connected by arrows (→). Thus, the instructions “Click on the Start button, and
    then click on the Run menu” is stated as “select Start→ Run


    DOS commands and their parameters are presented in uppercase, monospace fonts.


    Linux commands and their parameters are presented in lowercase monospace fonts.


    File names, and URLs are differentiated with lowercase, monospace font. (URL stands
    for Universal Resource Locator, and is usually in the form of the familiar Internet
    address: http://www...). All URLs used in this book are stored in the bookmarks.html
    file in the IDG on the companion CD-ROM. Commands that you should type are in
    bold.


    When a file that is contained on the companion CD-ROM is listed, its entire path
    name is included. This includes the mount point for the CD-ROM (/mnt/cdrom). For
    instance, the Ethernet-HOWTO file is listed as /mnt/cdrom/doc/HOWTO/Ethernet-HOWTO.'
  merge: -1
