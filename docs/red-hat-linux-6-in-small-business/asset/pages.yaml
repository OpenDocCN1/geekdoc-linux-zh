- img_proc: true
  md: '# Chapter 1: Installing Red Hat Linux


    If you do not have an InterNIC-registered—official—IP address then you can, and
    should use a public IP address. The most frequently used addresses are 192.168.1.X
    through 192.168.254.X where X can be any number between 1 and 254. These addresses
    you should use the 255.255.255.0 mask.


    If you are installing your Linux machine on an existing network that has a connection
    to the Internet or another network, then you should enter the IP address of that
    connection as the Gateway. If your new Linux computer is going to be the gateway,
    then enter it''s IP address. Otherwise you can leave it blank and enter it later.


    # Configure Network


    You enter the information about the rest of your network here. Figure 1-5 shows
    typical entries. The domain name is the alphanumeric name that you''ll use referring
    to your network. The next entry contains your host name followed by the domain
    name. Additional name servers will fill the dialog box.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_54_0.png)


    Figure 1-5: Continuing with the network information


    If you have an InterNIC-registered domain name then you should use it. However,
    you can make up your own name as long as you use IP masquerading to connect to
    the Internet. Masquerading — which is also known as Network Address Translation
    (NAT) — converts your internal LAN IP addresses into the single IP address of
    your Internet gateway. If you are connecting to the Internet through a dial-up
    connection with your Internet Service Provider, the address that your ISP assigns
    will be the one that you masquerade. This topic is discussed in Chapter 9.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# Configure Time Zone


    Select your time zone.


    # Configure Services


    This dialog box allows you to determine what daemons get started during the boot
    process. Daemons are programs that constantly run in the background and perform
    various system tasks (Linux is a true multiprocessing operating system and can
    easily run many processes at the same time). For instance, the heart of Samba,
    which provides NT like file and print services, consists of two daemons named
    smbd and nmbd.


    The daemons listed in the dialog box are started or not started at boot time by
    toggling each with the space bar. When toggled on an asterisk indicates that the
    daemon is to be started. Please take note that by minimizing the number of services
    that you run maximize your security. By running fewer processes remove places
    that a potential intruder can find a hole to squeeze through. This topic is discussed
    in more detail in later chapters.


    # Understanding the Red Hat start-up process


    When Red Linux is booted numerous processes called daemons are started. The specific
    daemons started are determined by the machine''s run level. Linux uses run levels
    to define the basic functions that the computer provides. Each level has certain
    daemons associated with it. For instance, the default run level as defined by
    the Red Hat installation process is run level 3. When booted to run level 3 the
    system works with full networking services on a text-based interface. Run level
    5 starts in the X Window System as the default interface.


    Within each run method for determining what daemons or processes are started by
    placing soft links in certain directories. A soft link is analogous to a pointer
    but is file with the name of another file in it. The directories that contain
    soft links are the /etc/rc.d/rc0.d, /etc/rc.d/rc1.d, through /etc/rc.d/rc5.d directories.
    Each one of them, corresponds to a run level. The run level is set in /etc/initab
    file.


    The soft links point to programs or scripts that do the actual starting of the
    daemons. Therefore, when a file in the /etc/rc.d/rc5.d directory gets executed,
    the script that it points to in /etc/rc.d/init.d gets executed and any commands
    that it want to run get run.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# Chapter 1: Installing Red Hat Linux


    # Configuring a Printer


    You have three choices if you want to set up a printer: Local, Remote lpd, and
    LAN Manager. If you have a printer connected to your Linux machine then you can
    use this option. If you have a network printer—one connected directly to your
    LAN—then choose the second option. The last option is for accessing a printer
    that is controlled by an NT server or Samba computer.


    # LOCAL PRINTERS


    Choose the name of the printer queue and the spool directory. The print queue
    is the list of print jobs waiting to print. The spool directory is the place where
    Linux temporarily stores the job while it prints. The default print queue on Linux
    systems is lpt and the directory is /var/spool/lpd/lpd.


    The next prompt is for the physical device that the printer is attached to. The
    default is either /dev/lp0 or /dev/lp1 which are both equivalent to the Windows/DOS
    LPT1.


    # REMOTE LPD PRINTERS


    Enter the IP address of the remote printer and its queue name. The default queue
    on Linux system is lpd.


    # LAN MANAGER PRINTER


    Enter the network host name and IP address of the LAN Manger server. The share
    name as well as the user name and password associated with the share needs to
    be entered.


    After the information for any of the three printer types has been input, the printer
    information has to be entered. Select your printer from the dialog box and click
    OK. Select the next paper size and resolution. Review the information and select
    OK to continue with the Linux installation or Back to reenter the information.


    # NETWARE


    You are given the choice to choose a NetWare print server.


    # VERIFY PRINTER CONFIGURATION


    After you have finished configuring your printer, you are shown a window with
    all the information that you have entered. Click OK to proceed to the next step.


    # Root Password


    Enter your root password. The root user has privileges to do anything and is the
    most powerful user on a Linux computer.


    When entering the password, the system checks the second one against the first
    and forces you to reenter it if they do not match. It is essential to the security
    of your Linux computer to use a proper password. Do not use a simple word, name
    or'
  merge: -1
