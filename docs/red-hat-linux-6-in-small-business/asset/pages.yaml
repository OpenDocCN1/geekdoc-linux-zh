- img_proc: true
  md: '# 50 Part 1: Building and Using a Basic Linux Computer


    information on file ownership). In order to understand this command, you need
    to learn a few more codes. They are:


    +   - u user who owns the file

    - g group that owns the file

    - everyone else (easier to remember if you think of other)

    - a all (u, g, and o)


    Every Linux file has an owner, who is typically the creator of the file. Every
    owner (user) also belongs to at least one group. In Red Hat Linux, by default
    every user belongs to a group that has the same name as the username (which creates
    your account is created). When you create a user account with the name of paul,
    then that user''s group is also paul. User creation is covered in more detail
    in Chapter 6.

    The chmod command uses a plus (+) or a minus (-) in conjunction with the previous
    codes to add or remove permissions. For example, suppose you create a shell script
    (something like a batch file in DOS) and you want to make it executable.


    ```

    chmod u+x script

    ```


    If you wanted to make it executable for the group as well, you could type:


    ```

    chmod ug+x script

    ```


    If you had a document that you wanted others to be able to read, but not necessarily
    execute, type:


    ```

    chmod o+r shared.doc

    ```


    If you want to combine permissions of a file–granting permissions to some users,
    removing them for others–you can separate the permissions options with a comma.
    For example, suppose you have a document you want to give everyone in the group
    the right to edit, and take away other''s rights to view:


    ```

    chmod g+w,o-r shared.doc

    ```


    You can use numbers in place of the + or - parameters to change permissions. Type:


    ```

    chmod 777 shared.doc

    ```


    This turns on read, write, and execute for all users. The first number corresponds
    to the file owner, the second to the group owner and the last to everyone. Please
    see the man page for chmod for all definitions.'
