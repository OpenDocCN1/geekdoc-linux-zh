  md: '# Chapter 4


    # Configuring the X Window System


    IN THIS CHAPTER


    +   * Understanding the X Window System

    * Using Xconfigurator

    * Introducing the Gnome/Enlightenment window manager

    * Using the X Client and X Server across a network


    The X Window System is the graphical system used by Linux and is based on a client-server
    model. It is also network ready. That means that a process can be run on one computer
    and viewed either on the same computer or on another one on the network. It is
    a powerful system.


    # Understanding the X Window System


    The X Window System is also called X Window or simply X. This is the default graphical
    system that Red Hat (and most distributions) use to provide a Graphical User Interface
    (GUI). It provides much the same function as the Microsoft Windows GUI.(Actually,
    X combined with a window manager provides the same function.) The X Window System
    differs from Windows in that is not tied directly to the computer that it runs
    on. Therefore, you can be sitting on one computer and graphically view data from
    another computer.


    X is based on a client-server model. That means that there is both a client and
    server part to X. The terminology can be confusing and deserves some attention.


    The client half of X refers to the X-based programs that provide a specific function.
    Xclock, for instance, is an X client and displays a graphical clock. The X server
    is the software that translates the graphics of an X client into the pixels (or
    dots on a screen) that are shown on your monitor. For instance, xclock sends the
    clock'
  merge: -1
  pgno: 108
- img_proc: true
  md: 'image to the X Server that displays the image. The fact that the server and
    the client are separate means that the output of xclock—or any X client—can be
    shown on the same computer or a different one. This is a big advantage over Windows.


    # Using the Mouseconfig Program


    Mouseconfig is another menu driven program that assists you in configuring your
    mouse. It''s important that you know which device your mouse is connected to (in
    the Windows arena it is referred to as the port that your mouse is connected to).
    If you have a serial mouse, then the device most used is either /dev/cua0 (/dev/ttyS0
    is the same device) for the first port or else /dev/cua1 (/dev/ttyS1 is the same
    device) and you should select the appropriate menu item. If you have a PS/2 mouse
    then select from the PS/2 mice listed.


    Start the program by logging on as root and entering the following command


    ```

    /usr/bin/mouseconfig

    ```


    You are presented with a screen listing of the mice that the program knows about.
    Select the appropriate mouse as listed in the menu. If you do not know what your
    mouse is, or if it is not listed, then select from among the generic or Microsoft-compatible
    ones.


    # Using Xconfigurator


    The Xconfigurator program was introduced in Chapter 1. It''s run by the Red Hat
    installation process automatically unless you did not install the X Window System.
    Xconfigurator is used to set what video adapter hardware and monitor type is used
    by X Window.'
  merge: -1
