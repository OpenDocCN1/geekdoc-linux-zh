    machine the entire console is controlled by the shell, like DOS.


    The shell is also a powerful programming tool. The commands that you enter can
    be combined sequentially, on the same line, to perform a series of tasks, or entered
    in the form of a script. A script is a file that contains Shell directives and
    other programs to be executed and it is executed like any program. Remember that
    a shell isn''t an operating system in itself, but passes on instructions from
    you to the operating system. In fact, the shell is also called the command interpreter.


    Shells operate differently in the DOS world. With DOS, you use the shell every
    time you type DIR to list the contents of a directory, type CD to change to another
    directory, or type COPY to copy a file from one location to another, and on a
    DOS machine, the shell is COMMAND.COM. If you''re using DOS, you don''t have the
