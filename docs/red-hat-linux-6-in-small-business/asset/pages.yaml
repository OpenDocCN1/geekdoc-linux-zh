  md: '# Chapter 1: Installing Red Hat Linux


    The assumption of an existing network includes the necessary Ethernet structure.
    The two most prevalent Ethernet media are twisted pair (10BaseT or 100BaseTX)
    and Thinnet (10Base2). 10BaseT works at 10 megabits per second (MB) while 100BaseTX
    is rated at 100 MB. 10Base2, on the other hand, works only on 10 MB. The twisted
    pair cables tend to look like regular phone cables while the Thinnet variety is
    similar to coaxial cables. You should be careful not to confuse the common regular
    telephone cable with the proper types that are category 3 and 5. The difference
    doesn''t usually present itself until you overload your network and get intermittent
    errors. The coaxial cable that is used for cable TV does not work with Ethernet
    networks because it has an impedance of 75 ohms rather than the necessary 50 ohms;
    the proper type is called RG52.


    It is not the intention of this book to describe how to build a network. If you
    do not already have a network set up, then you should consult the Ethernet-HOWTO
    and the Networking-Overview-HOWTO in the /mnt/cdrom/doc/HOWTO directory on the
    CD-ROM included with this book, or in the resources listed in chapter 3. You might
    also consider the discussion on troubleshooting network problems at the end of
    this chapter to gain add insight into how the networking functions work together.


    # Introducing Linux Essentials


    This book aims to get you started with Linux as soon as possible and the goal
    of this chapter is to get Linux installed on your system quickly. However, there
    are concepts and commands that are essential to this process. I''ll indulge in
    a short digestion at this point to point out what they are and what they mean.


    # Understanding the Linux operating system


    The Linux actually refers to several components and systems. First, it refers
    to the actual operating system—the Linux kernel—that connects the human user to
    the electronic computer. Second, it means the sum of the parts. That is, Linux
    is the kernel, plus the cooperating daemons (processes running constantly in the
    background that providebasic services), plus all of the user commands, plus all
    of the files that are installed on your Linux machine.


    # PLAINING THE LINUX KERNEL AND INIT


    The Linux kernel is completely responsible for coordinating the interaction of
    user and system programs, which in the UNIX world are referred to as processes,
    using the physical resources of the computer. Thus, when a process wants to write
    or read from a modem it must go through the kernel.


    When you boot (power on or reset) your Linux computer, the first process that
    starts is the init process. It is the ultimate parent of all user and system processes,'
