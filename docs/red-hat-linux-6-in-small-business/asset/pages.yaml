  md: '# Editing Text


    Another command that goes along with the delete commands you just learned the
    `put` command. When you delete a character, word, or even line of text, vi stores
    the text in a buffer case you want it back. Put is the command that gets it back.


    To retrieve text you just deleted, move your cursor to the spot just before where
    you want it. That means if you''re replacing a whole line of text, place the cursor
    to the line above where the deleted line should go. If you''re replace a word
    of deleted text, place the cursor in the space in front of where the word inserted.
    Once you have the cursor in the right spot, press p, and vi will replace the deleted
    text where you need it.


    Often you delete a character only to replace it with something else. In vi, that''s
    considered a huge waste of time. That''s because there''s a command specifically
    for replacing text.


    To use it, simply position the cursor over the character you want to replace and


    press


    +   r, new character


    and vi will delete the character and replace it with the character you specify.

    Of course, sometimes a word has more problems than just one character. vi has
    a separate command for that problem too. For example, you have a line of text
    thatnreads


    The rojmdu in Spain stays mainly on the plain.


    Obviously second word has a problem. You could use the r command three times to
    replace the o, j, and m separately, then the d and u, but that would waste keystrokes
    and time. Instead, move the cursor under the o in rojmdu and type:


    ```

    cw, ain

    ```


    When you type cw deletes the rest of the word and places you in insert mode.

    One editing command to remember is s. This is a command you can use to substitute
    one word for another. To use it, go to the line where you want the sub-stitution
    to take place and type the following (notice the colon–several vi com-mands the
    colon):


    ```

    :s/old/new

    ```


    and press Enter. This will only change the first occurrence on the line. To change
    every occurrence on a line, type:


    ```

    :s/old/new/g

    ```'
