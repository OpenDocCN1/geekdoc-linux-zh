    # Understanding the Red Hat Package Manager


    The primary function that has set the Red Hat Linux distribution apart from the
    others is the Red Hat Package Manager (RPM). All the software that was installed
    during the Red Hat installation process is stored in RPM form. The /mnt/cdrom/RedHat/RPMS
    contains all of the RPM packages. You can also install, or de-install software.
    As of writing this this is the most popular system for installing, modifying and
    transporting Linux software.


    The concept of package management has been around for quite a while, with all
    the major UNIX vendors supplying their own systems. The idea is to distribute
    software in a single package and have a package manager do the work of installing,
    de-installing and managing the individual files rather than having a human do
    it. The Linux world has greatly benefited from this system that greatly simplifies
    the distribution and use of software.


    > The Debian distribution uses its own system package manager for software distribution.
