    # Using Macros


    Samba has a macro facility that dynamically allocates various resources based
    on which machine, user, and so forth is asking for a share. This facility allows
    you to custom tailor services in a precise manner. A macro comes in the form of
    two characters, the first of which is a percent (%) sign. Table 8-1 lists the
    macros.


    Table 8-1 SAMBA MACROS


    | Macro | Description |

    |---|---|

    | %S | Current service or share (if any exists) |

    | %P | Root directory of the current service or share (if any exists) |

    | %u | Username of the current service or share (if any exists) |

    | %g | Primary group name of %u |

    | %U | Session username the client requested, but not necessarily the one received
    |

    | %H | The home directory of the user given by %u |

    | %v | Samba version number |

    | %h | Host name of the Samba server |

    | %m | NetBIOS name of the client computer |

    | %L | NetBIOS name of the Samba server |

    | %M | Internet name of the client computer |

    | %d | Process ID of the current server process |

    | %a | Architecture of the remote server |

    | %I | IP address of the client |

    | %T | Current date and time |'
