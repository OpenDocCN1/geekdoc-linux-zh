    +   - A discussion of installing and configuring a Windows client is given. With
    this client you can backup your Windows machine to your Linux server.


    +   - A discussion of the recover of data is given. Arkeia makes it a simple process
    to restore files and directories.


    +   - A brief discussion of scheduling backups is given. Total backups are performed
