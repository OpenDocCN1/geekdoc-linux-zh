  md: "# Chapter 11: Connecting to the Internet\n\nLog in as root and install the\
    \ caching-nameserver and bind RPM packages:\n\n```\nrpm -ivh /mnt/cdrom/RedHat/RPMS/bind-8*\n\
    rpm -ivh /mnt/cdrom/RedHat/RPMS/caching-nameserver\n```\n\nInstall the configuration\
    \ as follows:\n\n```\ncp -f /mnt/cdrom/dns/named.conf /etc\ncp -f /mnt/cdrom/dns/named.ca\
    \ /var/named\ncp -f /mnt/cdrom/dns/named.local /var/named\ncp -f /mnt/cdrom/dns/named.paunchy\
    \ /var/named\ncp -f /mnt/cdrom/dns/named.reverse /var/named\n```\n\nThe /etc/named.conf\
    \ file looks as follows.\n\n```\n// Boot file for paunchy.net name server\noptions\
    \ {\n    directory \"/var/named\"\n}\nzone \".\" {\n    type hints;\n    file\
    \ \"root.hints\"\n}\nzone \"0.0.127.in-addr.arpa\" {\n    type master;\n    file\
    \ \"named.local\"\n}\nzone \"1.168.192.in-addr.arpa\" {\n    type master;\n  \
    \  file \"named.reverse\"\n}\nzone \"paunchy.net.\" {\n    type master;\n    file\
    \ \"named.paunchy\"\n}\n```\n\nThe first section tells named to use the /var/named\
    \ directory as its home directory. The section defines the named.local file is\
    \ used to set up name resolution for the localhost network. The paunchy.net section\
    \ deals with converting IP names to numeric addresses for the paunchy.net-devices.\
    \ The 1.168.192 zone (named.reverse) provides reverse lookups – numeric IP addresses\
    \ to names – for paunchy.net.\n\nStart the daemon by using the start script.\n\
    /etc/rc.d/init.d/named start"
