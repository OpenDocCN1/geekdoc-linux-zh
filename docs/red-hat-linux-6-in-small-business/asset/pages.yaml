    # Viewing an X Client on X Server


    Recall that the X Window System is made of two parts: the X Client and X Server.
    The client and server can run on a single computer or on separate computers connected
    via a network. The following discussion briefly describes how to graphically view
    a remote process.


    # USING AN X CLIENT AND X SERVER ON THE SAME COMPUTER


    First, display an X Client on your own X Server. Your X Server is the system that
    you started by running startx program.'
