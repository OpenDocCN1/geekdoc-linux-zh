  md: '# Chapter 2: Navigating Linux


    # File Handling


    The first column of the long file listing (which lists the permissions for each
    file) is actually made up of ten different characters. The first character tells
    you what kind of file it is. Linux has many different file types, but the most
    common are:


    +   - normal file

    - d directory

    - 1 symbolic link


    You can see in the long file listing at the beginning of this section, most of
    entries are files. Now look at the remaining nine characters in the permissions
    column. Think of them as three groups of three. The first group displays the rights
    of the file''s owner—which are read, write, or execute (represented by r, w, and
    x). Each of the three slots in the group is reserved for one letter. That is,
    the first slot can only be an r or a dash; the second only be a w or a dash; and
    the third is either an x or a dash. The second group displays the rights of the
    file''s group—once again using r, w, or x. The third group displays the rights
    of everyone else with prerequisite r, w, or x. The presence of a dash (-) means
    that no permission is granted.

    The letters themselves are pretty self-explanatory:


    +   - r The file can be read

    - w The file or directory can be written to or deleted

    - x The file can be executed. If the listing is a directory rather than a file,
    the x means it can be searched


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_76_0.png)


    You may have noticed Linux filenames aren''t limited to the 8-dot-3 format of
    DOS filenames. In fact, Linux files do not consider the characters after a dot
    as an extension tying the file to a particular application. And you can use as
    many dots as you like in one filename.


    # Changing Permission Modes


    Sometimes you need to change the rights of a file to give someone else access.
    To accomplish that, you need to use the chmod command. In order to change the
    permissions of a file, you have to be the owner of that file (see the next section
    for'
  merge: -1
