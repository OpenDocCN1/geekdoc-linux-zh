  md: '# Chapter 4: Configuring the X Window System


    +   - Basic X Window System theory is discussed. The X Window System is based
    on the client-server model. The client and server can be run on the same computer
    or across a network.


    +   - How to configure the X Window System for your computer is covered. The Xconfigurator
    makes the configuration of X reasonably easy.


    +   - How to use the mouseconfig program to configure your mouse is covered.


    +   - How to configure the Gnome/Enlightenment window manager for your computer
    is discussed. The Gnome/Enlightenment window manager is the default of the Red
    Hat distribution. You can configure its operation by editing a configuration file.


    +   - How to view an X client on a remote X server is covered. Instructions are
    given for viewing an Xclient from across a network.


