    The Samba RPM package keeps a checksum and compares the state of the installed
    files against it. The command returns


    ```

    S.5....T c /etc/smb.conf

    ```


    which means that the smb.conf file has been changed. Please consult the RPM man
    page for information about the meaning of the result.


    # Updating an RPM Package


    When you obtain a newer version of a Linux package you may want to update the
    existing software, and the update function is a way of doing so. To upgrade Samba,
    for instance, simply enter the command:


    ```

    rpm -U samba

    ```


    Sometimes RPM blarks at installing or upgrading a package. Typically, RPM looks
    at an installed package and decides that you are not allowed to install the same,
    or older package, over it. It also does not want you upgrade the package with
    the same package. You can over ride RPM and force it to install or upgrade a package.
    Use the force parameter to make RPM install or upgrade.


    ```

    rpm -U -force samba

    ```


    # Removing an RPM Package


    You can remove a package by using the erase function (-e):


    ```

    rpm -e samba

    ```


    This removes the Samba software. Sometimes, other package files occupy the same
    directories of the package that you want to delete. In those cases, you get'
