    # Configuring Samba to Authenticate from an NT Server


    Samba can also use an NT domain controller to authenticate requested shares. (The
    discussion of NT domain controllers are beyond the scope of this book.) In this
    case, you need to modify the /etc/smb.conf file to point to the NT controller.
    Change the security parameter to specify the use of an NT domain controller as
    follows:


    ```

    security = server

    ```


    Next, uncomment the following line:


    ```

    ; password server = <NT-Server-Name>

    ```


    Next, edit this line to include the name of the NT server, which in this case
    is called my_pdc:


    ```

    password server = my_pdc

    ```


    The name of your domain controller should convert into the IP address of your
    NT primary domain controller via DNS. Please note that you could specify the IP
    address if you desire. For instance, if your controller address is 192.168.1.100,
    then you could enter the following line:


    ```

    password server = 192.168.1.100

    ```


    You must, of course, have an account on the primary domain controller.


    # Understanding Samba Permissions


    Samba provides control over how much access is given to each share. Access such
    as read and write is controlled by the configuration in the /etc/smb.conf file.
    However, the Linux file system permissions take precedence over that of Samba.


    Linux controls access by the permissions that are set on a file or directory.
    Recall from the section “Managing Files, Permissions, and Ownership” in Chapter
    2, that file and directory has settings that allow or disallow reading, writing,
    and execution of the file or directory. The owner, the group membership, and everyone
    each have these settings.'
