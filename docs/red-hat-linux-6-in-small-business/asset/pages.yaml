    change your mind, press Ctrl-U undoes the alignment, but only immediately after
    reformatting the paragraph. Once you move the cursor after the Ctrl-J sequence,
    Ctrl-U does not undo the reformat.


    Sometimes you may want to insert a completely separate file into your editing.
    To do this, press Ctrl-R and pico will prompt you for the name of the file you
    want to insert. If you can''t remember the name or the directory it is in, press
    Ctrl-T and pico presents a file browser which you can use to navigate your file
    system until you target the file you need.


    To save your file, press Ctrl-O; you can do that at any time. To exit pico (and
    save your file if it has changed) press Ctrl-X.


    # Making pico Your Default Editor


    Red Hat automatically makes vi your default editor. Until you get familiar with
    vi, you may want to change your default editor to pico. By doing this by setting
