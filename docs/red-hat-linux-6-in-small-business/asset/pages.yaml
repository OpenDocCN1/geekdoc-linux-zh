    of dollars versus time—dollars versus equipment.


    # Understanding TCP/IP Basics


    Your Linux computer contajns most of the protocols that make the Internet possible
    and the term TCP/IP is a shorthand way of referring to this. These protocols are
    the rules that govern how each computer and network are to communicate with each
    other. The running IP in Turkey speaks the same language as the IP-based computer
    in Mexico; and the common language allows them to almost instantaneously speak
    to each other. The more important protocols of the TCP/IP suite are discussed
