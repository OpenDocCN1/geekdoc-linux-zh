  md: '# Chapter 14: Using Office Productivity Tools


    # 329


    # Netscape Communicator


    Netscape Communicator is just about bulletproof in my experience. The only problems
    that tend to occur are due to misconfiguration, or are of the annoying but not
    deadly variety. If, for instance, you cannot browse the Internet, then make sure
    that your host computer''s network configuration is correct; your Linux Internet
    gateway (atlas) must be specified; your network must be configured and IP masquerading
    enabled. Refer to Chapter 7 for more network configuration and troubleshooting
    information.


    # Summary


    This chapter introduces a couple of the major applications available for Linux
    users. Linux is no longer limited to the server or specialized workstation area.
    Software likeingware, StarOffice, and Netscape Communicator provide productivity
    tools that you can get your everyday work done.


    +   * The Applware office productivity suite is introduced. Applware provides
    the work-a-day functions like word processing, spreadsheets, and presentation
    graphics. A demo version is included on the CD-ROM accompanying this book so that
    you can experiment with its features.


    +   * Applware Words is described in some detail. Its basic functions, which should
    be familiar to any word-processor user, are introduced. This book was mostly written
    using Words.


    +   * The other Applware applications are introduced. Applware has applications
    for creating slides and graphics, using spreadsheets, and sending e-mail.


    +   * A simple example for creating a SQL database with postgresSQL is given.
    That data base is used to show how to use theingware Data application. Data is
    used as an interface to SQL databases.


    +   * Netscape Navigator is introduced. The program is the most used Web browser
    in the world. It is included in the Red Hat distribution and used in examples
    throughout this book.


    +   * Configuring and using Netscape Messenger is described. If you want to send
    and receive your e-mail directly through your ISP, then configuring Netscape is
    straightforward. However, if you want to use the Linux based e-mail server described
    in Chapter 13, then some further configuration is necessary. Both systems are
    described in this chapter.'
