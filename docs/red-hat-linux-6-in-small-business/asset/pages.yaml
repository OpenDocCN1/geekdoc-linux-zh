    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_353_0.png)


    Figure 14-9: The Netscape Mail Server Preferences window points to your local
    Linux e-mail server.


    The local mail directory should default to /home/username/nsmail directory. The
    IMAP server temporarily stores (spools) your email in the /var/spool/mail/username
    directory. For instance, if you send a message to the local user roger_retallack,
    the message gets stored in the /var/spool/mail/roger_'
  merge: -1
