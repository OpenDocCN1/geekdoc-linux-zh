    # Troubleshooting


    If you are having problems printing to a local printer, then first check that
    the printer cable is in good condition and attached properly. If your printer
    appears to be the problem, first check that the power cable is connected and that
    the power is on. Next check that there is paper available and that the printer
    is not jammed.


    Check that the lpd daemon is running and use the lpc program to check the status
    of the printer queue. From the lpc> prompt use the stat command and see the status
    of all the queues (you can also use the lpc command from the command line to see
    the queue status). You can enter the restart command to possibly get a stuck queue
    going again. Consult the lpd and lpc man pages.


    If you are having problems using a remote printer, then use the troubleshooting
    techniques described in Chapter 6 to make sure that your network is working. Next,
    use the tips described in the previous chapters if another Linux machine is acting
    as the remote printer server. If you have a network printer, then check it for
    problems:'
