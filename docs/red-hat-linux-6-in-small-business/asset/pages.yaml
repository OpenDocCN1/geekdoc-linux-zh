- img_proc: true
  md: '# Part III: Connecting Your Network to the Internet


    gateway/firewall as simple as possible) and was configured as part of the Red
    Hat installation process described in Chapter 1. Instructions for configuring
    Chivas as a DNS are given later in this chapter in the section “Configuring a
    DNS Server”. The local DNS server will give addresses for local machines. If you
    do not intend to configure a local DNS, then you can set the primary DNS server
    address to your ISP.


    The secondary nameserver is your ISP''s DNS server (reached only when you have
    an active PPP connection) allows you to find any valid Internet address. For instance,
    if you enter the command nslookup www.idgb.com, then the IP address of 206.175.162.15
    is returned.


    The Network Configurator saves your information in the /etc/resolv.conf file.
    It should look something like the following:


    ```

    search paunchy.net

    nameserver 192.168.1.254

    nameserver 192.168.32.2

    ```


    You can manually edit the /etc/resolv.conf file if you wish. Use your favorite
    editor and add the values in that file as appropriate.

    When you want to disconnect the PPP connection, click the Interfaces tab again
    and press the Deactivate button. If you do not use your connection for some time,
    then it is likely that your modem or ISP will disconnect from you. However, your
    pppd might suggest it is active and you should still use the Deactivate button
    to stop it.


    # Configuring a DNS server


    It is convenient, but not necessary, to configure a local DNS server. If you set
    one up, then every machine on your private network can find the IP address of
    any other machine on the private network without having to include /etc/hosts
    file or every Windows hosts file. By configuring one local DNS server, you save
    having to duplicate the same address information on every computer on your private
    network.


    Configuring a DNS server from scratch can be very difficult at first. DNS is a
    complex system and requires several configuration files to work together. Rather
    going through the instructions for setting up the simple system needed by the
    paunchy.net, the configuration files for paunchy.net are included on the companion
    CD-ROM.


    The Linux server chivas is used as the DNS server in this example. That function
    is kept off of atlas in order to keep that machine as simple as possible. There
    is no technical reason why the DNS server can not be put on any Linux computer
    as long all the machines on your network point to it.'
