    But vi have many other features that pico and joe don''t. It takes some getting
    used to, no doubt about that its commands can seem complex and cryptic. However,
    it is the facto text editor in the Linux and UNIX world and deserves consideration


    # Starting vi


    Start vi and it immediately opens a file. Type:


    ```

    vi filename

    ```


    If the file exists, you can begin editing it. Otherwise you are placed in vi''s
