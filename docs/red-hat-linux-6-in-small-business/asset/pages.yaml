    the people who use your system.


    In that case, there''s a range of services that you need to think about. One is
    managing the user login accounts and their environments and another is managing
    the application software that they use. You also have to worry about what your
    employees should and should not be to do. There should be guidelines for the users
    to interact with each other – remember, threatening or vulgar email in particular
    requires that definite policies are in place and enforced.


    # Troubleshooting


    Troubleshooting is one of the constants of systems administration. Your goal in
    setting up your computers should be to maximize usability while minimizing problems
    and most of the chapters in this book contain some troubleshooting information
    about a specific topic.


    But there are general troubleshooting models that can guide you when you''re trying
    to solve problems. Basically, you should try to isolate the problem and then systematically
    work your way to the root cause. It''s a simple and sensible concept but it''s
    often difficult to use in practice because many parts that make a computer and
    a network clutter the landscape. The trick is to find the pattern within the camouflage.


    Locating the root cause of a problem is more of an art than a science. Ultimately,
    there is always a simple cause and the gremlin is never magical but can always
    be explained scientifically (a misconfigured program, a loose connector, a paper
    jam). The art comes mostly from learning how your particular computers and networks'
