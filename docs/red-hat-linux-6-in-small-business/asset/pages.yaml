  md: '# Part 1: Building and Using a Basic Linux Computer


    You can produces many pages of output by searching on words like file. It’s useful
    to pipe the output of apropos—or find any number of commands—to filter such as
    grep. For instance, if you want to change the permissions on a file but can''t
    remember the name of the command, then you can enter a pipe line like the following:


    ```

    apropos file |grep permission

    ```


    Only three lines are returned out of many pages and it''s obvious that chmod the
    command that you are looking for.


    # Summary


    This chapter provides you with the basic tools for navigating a Linux computer.
    Use this chapter as a simple reference to get familiar with the commands and concepts
    discussed here. Probably ten percent of Linux’s commands account for ninety percent
    of what you typically do at the command line. This chapter represents that ten
    percent.


    +   - The Linux shell, unlike the DOS shell, allows you to use many different
    shells.

    - Linux is a multi-user operating system that allows you to switch among various
    consoles to perform multiple tasks simultaneously.

    - Commands like ls, pwd and cd are used to help you list files and directories.
    Knowledge of these commands help jump start your system administration experience.

    - The various commands that are used to manage, view, and search for files are
    described. These commands simplify your navigation through the file systems and
    are necessary to manage your Linux system.

    - Command line hints are to shown. The tasks described are ones that are used
    to perform many of the necessary and common functions for system administration.


    Now so you have a good introduction to Linux, you’re ready to move on. And if
    you still feel completely lost, have no fear. Chapter 5 is titled “Getting Help.”'
