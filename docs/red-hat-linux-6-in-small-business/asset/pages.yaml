    # Modifying your Firewall for Secure Shell


    The firewall design from Chapter 12 is an effective and strong one. It gains much
    of its strength from the philosophy of not permitting any communication originating
    from the Internet into the private network; it allows only one-way communication.
    This model is quite useful if you want to gain access to your network for outside
    - for instance, from your home - then it presents some problems.


    A firewall based solely on IP filtering works well in one direction. As soon as
    you allow IP packets from the Internet, you start opening potential holes in your
    firewall. For instance, I have used the network scanner nmap against this book''s
    firewall defined by the iptables.rules script found in /mnt/cdrom/IG/ firewall
    directory. The firewall tests very well, as every nmap configuration that I can
    conjure fails to return any information about my network setting behind the firewall.
    However, when I add a rule to allow Telnet sessions from the Internet, nmap is
    then able to see that service. An attacker then knows that there is a computer/or
    network at the IP address and can attempt to find a way in.


    Allowing external access to network services like Telnet is not a direct danger
    in himself. It is a potential vulnerability for several servers. First, if someone
    places a Trojan Horse on your network, then access to the network is possible.
    (Otherwise, with a one-way firewall, if a Trojan Horse exists no one can gain
    access and use it.) Second, if there is a bug or back-door in a daemon like telnet,
    then an intruder can take advantage of it if external access is available. Finally,
    if someone is sniffing your incoming network traffic, then it''s quite possible
    that your passwords will be discovered and access to your internal network gained
    via service like Telnet.


    The solution is to run a secure server on your Internet gateway/firewall and provide
    external access only to the secure server. In this case, atlas is'
