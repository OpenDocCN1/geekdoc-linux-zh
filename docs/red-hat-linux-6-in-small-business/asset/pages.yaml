  md: 'Chapter 14: Using Office Productivity Tools


    # # Using Netscape Communicator


    Netscape Communicator hardly needs an introduction, but just in case, it is primarily
    a Web browser. A Web browser is used to view graphical information that can be
    stored on the Internet, the intranet, or on the computer that you are working
    from. Netscape can be installed as just a browser, Netscape Navigator, or as a
    multipurpose device in the Netscape Communicator suite, which is the Red Hat default.


    When installed in Communicator form, Netscape provides an e-mail client, a newsgroup
    reader, some utilities and the browser. The browser and e-mail client are discussed
    in this section. The details on how browsers work can be found on the net or in
    many books. Netscape itself provides considerable information from its help menus.


    # Installing Netscape Communicator U.S. Version with 128-bit Encryption


    The Netscape Communicator version that is installed by default during the Red
    Hat installation process is an international version with only 40-bit encryption.
    The U.S. version uses 128-bit encryption and is considerably more difficult to
    crack than 40-bit. You should consider downloading the U.S. version if you wish
    to use the Internet for commerce (send credit card information) and are you a
    U.S. citizen. Please consult the download page at www.netscape.com for more information.


    The current version of Netscape Communicator is 4.51 as of this writing. If you
    wish to download it for Linux and use the license agreement and meet the criteria,
    then download the tar package to /usr/local/src. Expand it to a temporary directory
    as follows:


    ```

    tar xvf /usr/local/netscape* | cd /var/tmp; tar xvf -

    ```


    Create a Netscape directory and Expand the .nif files:


    ```

    mkdir /usr/local/netscape

    cd /usr/local/netscape

    tar xvf /var/tmp/netscape.nif

    tar xvf /var/tmp/nethelp-v451.nif

    tar xvf /var/tmp/elling.nif

    ```


    Change the Gnome Netscape launcher on the main panel by clicking the icon with
    the right mouse button. Next, click the Properties menu and the Launcher properties
    window pops up. Change the file name in the Command submenu to /usr/local/netscape/netscape
    and click OK. The next time you click the Netscape icon, the new version should
    start.'
  merge: -1
  pgno: 348
- img_proc: true
  md: '# Using Netscape Navigator


    Netscape Navigator is such widely used tool that no general tutorial is given
    here. If you are unfamiliar with Web browsers, consult the Netscape help menu
    (click the Help menu in the upper-right-hand corner of the window). Using Navigator
    for secure communications is important, however, and is discussed in the next
    section Setting Up Secure Netscape Communication.


    # Setting Up Secure Netscape Communication


    You can use encrypted communication with Netscape Navigator. The level of encryption
    varies depending on the version. International versions use 40-bit encryption,
    while the U.S. version uses 128-bit encryption. 40-bit encryption can be theoretically
    broken in a matter of hours while 128-bit encryption would take much longer if
    it can be broken at all.


    Speaking in general terms, 128-bit encryption is better than 40-bit encryption.
    Depending on what you are doing, 40-bit might be adequate. If you are simply browsing
    the net, then it might not matter that your packets can be broken because hours.
    However, if you are sending long-lived valuable information, such as credit card
    information, you should be concerned. Use your best judgement.


    There are two security measures that need to be taken: using encrypted transactions,
    and verifying the validity of the web server that you are communicating with.
    The former is matter of setting up Netscape Navigator to use Secure Socket Layer
    (SSL) transactions and the latter requires the use of certificates.


    # USING ENCRYPTION


    Use Navigator to connect to a Web site. Click Communicator\→ Tools \→ Security
    info menu in the Netscape window. The Netscape: Security Info window is displayed.
    Click on the Navigator menu and you see a window similar to that in Figure 14-7.'
  merge: -1
  pgno: 349
- img_proc: true
  md: "# Chapter 14: Using Office Productivity Tools 323\n\n![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_350_0.png)\n\
    \nFigure 14-7: The Netscape Security Info window\n\nYou have the choice of setting\
    \ Navigator to warn you of the status of Web sites you are connecting to. For\
    \ instance, if you click on the Sending unencrypted information to a Site selection,\
    \ Navigator will warn you when you try to do that. If you select all of those\
    \ choices, you might get too many warnings and end up ignoring them, to your own\
    \ detriment. It's probably a good idea to start off by getting too much information\
    \ and then back off as you gain experience with what warnings you to pay attention\
    \ to.\n\nYou should select both the Enable SSL (Secure Sockets Layer) v2 and Enable\
    \ SSL (Secureockets Layer) v3options. If they are not, activate both. Both will\
    \ automatically encrypt your transactions when you connect to a secure site. One\
    \ way to verify that you have an encrypted connection to a Web site (a secure\
    \ Web server is designated by a https URL prefix as opposed to an http prefix)\
    \ is to look for the little padlock icon which is displayed in the extreme lower\
    \ left corner of your Netscape window; you can also display the encryption status\
    \ by clicking Communicator \rightarrow Security Info. The closed padlock icon\
    \ indicates your encrypted connection; otherwise, the open padlock indicates that\
    \ your connection is not encrypted."
  merge: -1
  pgno: 350
- img_proc: true
  md: '# Part IV: Getting Work Done


    Most Web sites do not use SSL connections until you want to make a financial or
    other sensitive transaction. For instance, when you view books at www.amazon.com,
    your connections are not secured. However when you go to make an order, you connect
    to an SSL server and your communication is encrypted, if your browser has SSL
    enabled.


    Secure servers use port 443 (see the /etc/services file). The HTTP protocol uses
    port 80 (sometimes ports like 8080 and 8001 are used). If you not connect to a
    secure server, you might have to modify your firewall to allow an unusual port.
    You can use the dial control panel (dctrl) to view the ports being used.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_351_0.png)


    # INTRODUCING CERTIFICATES


    If your Netscape communication is perfectly encrypted, but you are connected to
    a fraudulent Web site, then the bad guys will get your perfectly encrypted information.
    This is called a Man In The Middle attack.


    A Secure Web server provides a server certificate to ensure that it is what it
    says it is. You can view the certificate by opening the security info page (click
    on Communicator -> Tools -> Security Info menus) and click on the View Certificate
    button. If you don''t see a certificate, then you should be cautious about your
    interaction with the web site.


    # Configuring the Netscape E-mail Client


    The Netscape Messenger Mailbox is the default e-mail client used in this book''s
    paunchy.net network. Netscape provides all of the essential functions that are
    necessary to send and receive e-mail, plus extras. From the Navigator window,
    click Communicator -> Messenger to open the email system.


    Netscape requires that you configure your e-mail address and server. Click Edit
    -> Preferences and get the Netscape: Preferences window. Click on Mail & Newsgroups,
    click Identity, and the Identity window is shown. Enter your e-mail address. In
    this case of this book''s example network, that should be myname@paunchy.net or
    mys@isp.com. The former corresponds to the case where your Linux server is acting
    as an email server as described in the section "Configuring a Local E-mail Server"
    in Chapter 13.


    Next, click Mail & Newsgroups, then click Mail Server. Chapter 13 describes the
    two methods for accessing an e-mail server that this book uses. The following
    sections outline how to configure Netscape to use the two methods.'
  merge: -1
  pgno: 351
- img_proc: true
  md: '# Chapter 14: Using Office Productivity Tools


    325


    # CONFIGURING NAVIGATOR TO GET E-MAIL FROM ISP


    If you wish to receive your e-mail directly from your ISP, then click the Add
    button and enter your ISP''s e-mail server in the Server Name window. Click the
    Server Type button and choose either the POP or IMAP protocols depending on what
    your ISP provides. Next enter your ISP username in the Username field. Click OK.


    Back in the Preferences window, enter the IP address of ISP''s e-mail server name
    in the Outgoing mail (SMTP) server field. (The name of your outgoing and incoming
    ISP server might be the same or be different. Consult your ISP for the proper
    names.) Finally, enter your username in the Outgoing mail server username field.
    Your configuration should look similar to Figure 14-8.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_352_0.png)


    Figure 14-8: The Netscape Mail Server configuration window points to your ISP''s
    e-mail server.


    You will send and receive e-mail directly through your ISP. Every time you want
    access, your account dial has to make a connection (unless you have a permanent
    or semi-permanent connection). You also need a separate e-mail account (not necessarily
    a login/PPP account) for each user who wants to receive e-mail this way.'
