    your operating system.


    Well, Linux is different. Linux—and just about every version of UNIX—gives you
    a choice among many different shells. There''s the Bourne shell (named after Stephen
    Bourne), the C shell (it borrows the syntax from the C programming language),
    the Korn shell (named after David Korn), and many others.


    In your experience with Linux, you''ll probably use one or possibly two shells.
    People tend to learn one really well and stick with it. Of late, the shell chosen
    most often is bash. Bash stands for Bourne Again Shell. It''s a derivative of
    the Bourne shell mentioned above, but also combines many of the good points from
    other shells.


