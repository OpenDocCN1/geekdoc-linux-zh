  md: '# # Acknowledgments


    I want to thank my wife, Lidia, for her patience, support, and good advice, which
    made writing this book possible. Without her, I would not have been able to start,
    much less finish this project.


    I''d also like to thank Eric Harper for conceiving this book. His insight saw
    the need to address the use of Linux in small businesses. There is a great need
    for the small business or organization to tap the potential that Linux provides.
    He got the project started and I am grateful that I was able to assist in its
    completion.


    Laura Lewin managed the entire project and kept it running through all the problems
    that invariably occur with such projects.


    The development editor, Brian MacDonald, worked tirelessly to keep the book on
    track. His advice and assistance was essential. Terry Varveris, Julie Smith, and
    Amy Barkat of IDG Books Worldwide provided considerable help to.


    Jim Noble''s technical knowledge was indispensable. His technical editing capability
    is enormous and I learned a great deal from his comments and advice. I also thanked
    Mohammed Kabir for assisting with the technical edit.


    I appreciate all the help that Sam B. Siegel of Knox Software provided me. Without
    his assistance, I would not have been able to include the Arkeia backup software
    with the book.


    I''d also like to thank my colleagues at Special Projects who I depend heavily
    upon advice and support in my job. In particular, Reg Olson and Ken Hatfield have
    helped me on innumerable occasions. I also appreciate Randy Ridley''s advice on
    the discussion of Secure shell.


    Finally, my employer, Sandia National Laboratories, encouraged me to take on this
    project. In particular, my manager, Tom Klitsner, was very enthusiastic in his
    encouragement which made combining work and writing easier to manage.


    —Paul Gery


    Thanks to the folks at Red Hot, Inc. for their work in bringing Linux to all businesses
    small and large. Special thanks to the untiring staff at IDG Books Worldwide —
    Jim Sumser, Laura Lewin, Terri Varveris, and Brian MacDonald. They are the heroes
    of this project. Their patience and understanding prove they are the kind of publisher
    with whom every writer loves to work. And finally, thanks to my family—my wife,
    Tricia, and kids, Lauren, Nathan, and Alex—for not rolling your eyes when Dad
    said he wanted to do another book.


    —Eric Harper'
