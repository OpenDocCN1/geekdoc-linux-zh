- img_proc: true
  md: 'secure shell server and an ipchains rule is added to allow external clients
    access to it. This arrangement is safer than others for several reasons.


    +   - First, all communication is encrypted which makes all the information, such
    as passwords, very difficult to intercept, if not impossible.


    +   - Second, if the authentication keys have been properly configured on both
    the client and the server, then you are assured that you are communicating with
    the correct machine. You cannot be spoofed by some third party on the Internet.


    +   - Third, secure shell is in itself a type of firewall. It can be configured
    to require its own authentication before it will (turning off password-only authentication).
    Network packets coming in from the Internet and seeking access to the private
    network will be serviced by the secure shell daemon only. It essentially prevents
    unauthorized access to your private network just like an application-based firewall.


    +   - Finally, nmap tests of my firewall with external access granted to secure
    do not show any response. That is, I scan the firewall and nmap does not see the
    Secure port which is listening for incoming connection. nmap does not see the
    network just as before. This is not an exhaustive test (but a very good indicator
    that the firewall is not going to break easily). (nmap is one of the most widely
    used and respected scanners available. It is highly adaptive to new conditions
    and continually being improved.)


    The following rule is to provide external access to your private network from
    the Internet.


    ```

    # allow secure shell connections originating from the outside

    ipchains -A output -p TCP -j ACCEPT -i ppp0 -s SSH -t 0x01 0x10

    ipchains -A output -p UDP -j ACCEPT -i ppp0 -s SSH -t 0x01 0x10

    ```


    These rules are found in the /mnt/cdrom/IDG/firewall/ipchains.rules file. The
    comments should be removed in order to activate them.


