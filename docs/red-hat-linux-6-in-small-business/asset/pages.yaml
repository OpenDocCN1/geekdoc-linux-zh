    # Virtual Consoles


    Linux is a multi-user operating system (it is also a multi-tasking operating system,
    as explained in the section “Displaying the Process Table” later in this chapter).
    This means that more than one process can run at the same time. Linux also uses
    the concept of virtual consoles. By using key sequences, you can log on to different
    sessions on the same computer. For instance, if you start a long process on one
    console (like backing up part of your hard drive), you can switch to console and
    do something else—like read your e-mail—from another session.

    to switch between the virtual consoles, press the Ctrl-Alt keys which you also
    press the function keys F1 through F6. For instance, press Ctrl-Left-Alt-F2 to
    switch to the second virtual console. The total number of consoles is set by the
    numbers of lines that shown below are in the /etc/inittab file.


    ```

    # Run gettyys in standard runlevels

    1:12345:respawn:/sbin/mingetty tty

    ```


    When you switch to a new virtual console, Linux presents you with a completely
    new console, including a new login prompt. You can perform tasks as you root while
    doing something completely different logged in under your username.


