  md: '# Installation Method


    Red Hat provides for two different locations to install from. They are:


    # LOCAL CD-ROM


    This is the most conceptually simple and reliable method. If you have a local
    CD-ROM drive then you can load Linux from the companion CD-ROM. The installation
    method is the one used in this book. This method does not require a supplemental
    disk.


    # HARD DRIVE


    You can copy the Red Hat distribution to a local hard drive and use it to install
    your system. In that case it acts just like the Local CD-ROM method. This method
    does not require a supplemental disk.


    When you choose this method, you are shown the Select Partition window with a
    menu of disk partitions. For instance, if you''ve copied the Red Hat distribution
    must reside in one of the partitions. For instance, if you''ve copied the Red
    Hat distribution to /home/rh60 directory and home sites at /dev/hda5, then you
    select /dev/hda5 and enter rh60 at the Directory holding Red Hat prompt.


    This method requires you to enter the host network information as well as of the
    server that you are accessing. In the case you are using a DHCP or Bootstrap to
    retrieve your local IP address you need to know and enter the address of that
    server. If you do not have an InterNIC registered IP(es) then you can use a public
    address. For instance, you can use one of the addresses used for the local networks
    in this book as 192.168.1.1, or 192.168.1.2, and if you wish to use this method,
    please consult the Red Hat Installation Guide for additional information. The
    guide is in HTML format and can be found on the companion CD-ROM in the /mnt/cdrom/doc/rhmanual/manual
    directory. You need access to a Web browser and make use of it.


    # Using Other Installation Sources


    The following three installation methods were formerly available under Red Hat
    5.2. They are useful for installing Red Hat from a remote source over a network.
    You can create a boot floppy with these capabilities if you download the .img
    from a Red Hat mirror.


    +   NFS image: If your computer is already connected to a network and there is
    also a Network File System (NFS) server attached then you can use it to install
    your system. This method is quite convenient when you have numerous installations
    to perform or when you have a machine without a CD-ROM drive.'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# Chapter 1: Installing Red Hat Linux


    # Using Other Sources (continued)


    +   - FTP: You can also install directly from an FTP server. The server can be
    a local computer on your network or on the Internet. You need to supply the IP
    address of the FTP server and have a network connection to that server. If you
    intend to use a Red Hat mirror - on the Internet - and only have a dial-up phone
    connection you should expect the installation to run over night. This method requires
    the supplemental disk.


    +   - SMB Image: This method uses a Samba server on another machine to access
    the Red Hat installation files. Samba is a suite of programs that mimics the SMB
    protocol that Windows NT servers use. Thus, a Linux computer running Samba looks
    just like an NT server. You need to supply the local computer with all the network
    information of the remote server as well as the share name, user name, and password.
    A share corresponds to a directory or file name. This method requires the supplemental
    disk.


    If you use any of these methods, you will need to know the same host and server
    information that you need for installing from a hard drive.


    If you choose to install via a network, and then you are asked if you require
    PCMCIA support. If you do not have a laptop then it is unlikely that you need
    this support. However, if you have a laptop with a PCMCIA Ethernet NIC and/or
    a PCMCIA CD-ROM then you need to load the appropriate module. If you answer yes,
    then your system is probed for PCMCIA devices. Please consult the Red Hat Installation
    Guide or the /mnt/cdrom/doc/HOWTO/PCMCIA-HOWTO file for more information on this
    subject.


    # Installation Paths


    Red Hat provides two installation paths: install and upgrade. The *install* option
    writes over any existing operating system on the disk partition that you choose
    to use. An *upgrade* overwrites certain parts of an existing Red Hat installation
    but keeps the existing partitions.


    # Installation Class


    If you choose to do a full install, then you are asked to choose between three
    types of disk partition organizations: *Server*, *Workstation*, and *Custom*.
    The first two write predefined partitions to your disk in anticipation of your
    computer working as either a server or a personal workstation.'
