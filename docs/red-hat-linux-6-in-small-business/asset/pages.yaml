  md: '# Chapter 5


    # Getting Help


    IN THIS CHAPTER


    +   - Get help with Linux commands Documentation manual pages

    - Learn about the Linux Documentation Project (LDP) and how to find the FAQs,
    HOWTOs, mini-HOWTOs, and books written on Linux

    - Find information on Linux developed over the Internet using Linux, Linux products,
    and support issues

    - Learn about Linux publications, both printed magazines and online e-zines

    - Find a local Linux User Group and enjoy the benefits of finding other users
    who live locally


    THIS CHAPTER covers the many Linux resources that are available to you. Because
    Linux was initially developed over the Internet, many interactive information
    sources have been developed through it. For instance, the Linux Documentation
    Project documents many, if not all, of the systems that make up Linux. Newsgroups,
    providing interactive sources for problem-solving and answering questions.

    You may be surprised at the number of options available for “free” operating system
    when it comes to support. It’s no wonder the Linux user community won InfoWorld’s
    Best Technical Support award in the magazine’s 1997 Product Of The Year competition.
    In this chapter you will learn why it won.


    # Using Manual Pages


    In Chapter 2, you learned many of the important Linux commands as well as some
    options and arguments for those commands. By no means were all the commands or
    all the options for the commands mentioned. But help is never to get far away,
    because Linux has a built-in method for providing information for just every aspect
    of your system, called the manual pages. Usually called man pages for short, manual
    pages tell everything you wanted to know about a Linux command, program, or feature.
    This section will teach you how to use man pages to learn more about Linux commands.'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# Part 1: Building and Using a Basic Linux Computer


    To get help for a command, just type


    man command


    and Linux will provide pages and pages of information about that command. If you
    tried

    type


    man man


    and you can see the manual page for the man command.

    Since manual documents are usually several pages long, Linux uses less dis-

    play them. This keeps them from running off the screen and provides all of the

    viewing and searching options you get from less. To quit viewing a man page,

    type Q. Search the text in a man page, type a forward slash (/), followed by a

    word you''re looking for. Less takes you to the next occurrence. If you want to

    search backwards, then use the question mark (?).


    If you don''t know which command you want, you can use the -k option for.

    example, type


    man -k editor


    and Linux will print a list of commands that match that keyword you entered.

    it searches the database for the commands. In fact, if you''ve tried using apro-\pos
    this should all look very familiar. (See Chapter 2 for information on apropos.)

    of course the value of using the -k option is dependent on updating the whatis

    database regularly.


    # Man Page Sections


    Man pages are mostly stored in the /usr/man directory on your Linux computer

    and additional man pages can be found in /usr/X11R6/man. When you look in that

    directory you''ll notice subdirectories titled man1, man2, man3, etc. The

    actual manual files are in these subdirectories.


    > Notice the whatis file is also in this directory. This is the database you cre-ate
    with the makewhatis command (see Chapter 2). When used with the -nk option, man
    uses this database to provide general information on

    commands.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_123_0.png)'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'Each directory holds man pages pertaining to a specific help section:


    +   - man1: commands

    - man2: system calls

    - man3: library calls

    - man4: devices

    - man5: files formats and conventions

    - man6: games

    - man7: macro packages and layouts

    - man8: system management

    - man9: kernel routines

    - mann: new documentation (may be moved)

    - mano1: old documentation (kept for a grace period)

    - man1: local documentation (relevant to your own particular system)


    When you type man command Linux starts with first man page section and marches
    through each successive one until it finds a match. Some commands, programs, or
    features actually have several man pages. To see all man pages, use the option.
    For example,


    ```

    man -a man

    ```


    provides information about the man command (from man1). But it also displays information
    on creating a man page from man7. In the case where you know that you want the
    manual page from man7 you can specify the section number. Typing


    ```

    man 7 man

    ```


    for example will display only the man entry from man7.


    # Man Page Organization


    Each manual page is organized with several headings These headings are described
    in Table 5-1. Although not every man page will have every heading, most pages
    have most headings.'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# Table 5-1 MANUAL PAGE ORGANIZATION


    | Heading | Description |

    |---|---|

    | NAME | name of command and one line description (incidentally, the required
    section of a man page) |

    | SYNOPSIS | short overview of program options |

    | DESCRIPTION | more detailed explanation of the program |

    | OPTIONS | description of any command options |

    | FILES | lists any files the program uses |

    | ENVIRONMENT | any environment variables that affect the program |

    | DIAGNOSTICS | overview of error messages the program is likely to generate |

    | BUGS | known limitations or problems |

    | AUTHOR | name (and sometimes e-mail address) of the program’s author |

    | SEE ALSO | list of related manual pages |


    Linux commands, features, and functions are written by many different people.
    Because of this, some are written better than others and some are often out of
    date. Also, some man pages may be written for people with working knowledge of
    Unix, while others provide more basic information. But whatever your level of
    knowledge, manual pages are a great source of help as you familiarize yourself
    with the operating system.


    # The Linux Documentation Project


    You might think that a free operating system wouldn’t offer you the luxury of
    good documentation. Nothing could be further from the truth. Some argue Linux
    has the best documentation and support of any other software products. In fact,
    February 1998, InfoWorld granted their Best Technical Support Award to the Linux
    user community as, "As something you can download for free, of course, Linux doesn’t
    necessarily come with the support of a commercial entity," InfoWorld columnist
    Ed Foster. "But that’s exactly why many readers say they like it." support Linux
    users receive from their peers via Usenet, Web pages, and IRC, explained, surpasses
    anything offered by commercial software vendors.

    It starts with the Linux Documentation Project (LDP). This describes the LDP and
    how you can use it to get answers to questions about setting up particular components,
    configuration details, and the way to use Linux for specific tasks.'
  merge: -1
  pgno: 125
- img_proc: true
  md: '# Chapter 5: Getting Help 99


    Like many aspects of Linux, the LDP is a collection of efforts. Its goal is to
    provide good, reliable documents for the Linux operating system. If you want to
    know how to make Linux work in particular environment or for a particular purpose,
    chances are it''s covered in the LDP. Anyone interested can contribute to the
    project.


    Although many contributors, the project is coordinated to keep people from duplicating
    efforts. Contributors are encouraged to announce their plans for a new document
    so that no one starts working on a project in progress somewhere else.


    You can get documents from the LDP from many sources. The main web site is http://metalab.unc.edu/LDP/
    any other mirrors can be found all over the world. If you don''t have Internet
    yet, you''ll find a copy of the LDP documents on the CD-ROM included in this book.


    If you selected the Extra Documentation, as I suggested, or installed during the
    Red Hat installation process in the Chapter 1, then you already have much of the
    LDP on your Linux machine. Check the /usr/doc directory for the HOWTO and FAQ
    document files.


    # FAQs


    If you''ve spent any time on the Internet, you''re probably familiar with the
    acronym FAQ. It stands for Frequently Asked Questions and provides answers for
    common questions that just about everyone has asked.


    Authors have written FAQs on many subjects in Linux, including hardware support
    and common problem solving. As you probably know, you can ask anyone for help
    on the Internet, it''s a good idea to look through the FAQs that cover the subject
    of your question. It''s not that Linux users don''t be helpful to new users, it''s
    just that they get tired of answering the same questions over and over.


    FAQs are an excellent place for new users of Linux to start because they don''t
    assume Linux knowledge. Robert Kiesling wrote an excellent Linux FAQ that is available
    at http://metalab.unc.edu/LDP/Linux-FAQ.html. If you installed the extra documentation,
    you can find it at /usr/doc/FAQ/html/Linux-FAQ.html which is in HTML format.


    You can find a couple FAQs written specifically for Red Linux users. Although
    not part of the LDP, these FAQs can provide helpful information for users of the
    Red Hat distribution.


    The first is the official Red Hat Support FAQ available at http://www.redhat.com/knowledgebase/cache/1.html.


    Another good source for Linux users is www.linux.org. It contains a wide range
    of information about Linux.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# HOWTOs


    Next to FAQs, HOWTOs are the heart of the LDP. HOWTOs are documents that describe
    how to use or configure a certain aspect of the Linux operating system. They cover
    a wide range of topics such as bash shell configuration, PCMCIA support, and using
    Linux with your 3Com Palm Organizer. HOWTOs are somewhat like FAQs, but they''re
    not in question and answer format (although many HOWTOs include a FAQ section).


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_127_0.png)


    HOWTOs are available in many different formats including plain text, HTML, and
    PostScript. They are also translated in many different languages. The LDP has
    HOWTO documents in everything from Chinese to Slovenian.


    in addition to the regular HOWTO documents, the LDP has a couple of Special HOWTOs.
    The only distinction is that they rely on figures which make them unavailable
    for regular HOWTO formats.


    And finally, there are HOWTOs that are technically part of the LDP, but are no
    longer being maintained by an author. It may be the last place to find what you''re
    looking for. Check out the mini-place to find unmaintained HOWTOs—especially if
    you''re working with old hardware.


    # mini-HOWTOs


    In addition to the HOWTO documents, the LDP also has documents on short, specific
    subjects. These are called mini-HOWTOs and are only available in plain text and
    HTML formats in the /usr/doc/HOWTO/mini directory.


    In all actuality, the line separating HOWTOs and mini-HOWTOs seems to be blurry,
    so if you''re looking for instructions on a particular topic, be sure to check
    both document collections.


    # LDP Guides


    In addition to the HOWTOs, mini-HOWTOs, and FAQs, some authors have published
    full-fledged books under the LDP. They are called Guides and cover topics for
    both beginners and experts. You can access them at http://www.linux.org/help/projectguide.html.


    As of this writing, there are eight Guides available: Installation and Getting
    Started Guide, The Linux Kernel, The Linux Kernel Hackers'' Guide, The Linux Module
    Programming Guide, The Linux Network Administrators'' Guide, The Linux Programmer''s
    Guide, The Linux System Administrators'' Guide, and The Linux Users'' Guide. Many
    of these guides are out of date but still make fine references.'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# Getting Information from the Internet


    As previously mentioned, you can browse the information of the LDP from several
    Web sites in HTML or plain text format. But that''s not the only source of Linux
    information you''ll find on the Internet. This section will show you other Internet
    locations you can visit, not just for help, but for Linux news and as well.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_128_0.png)


    Linux certainly could never have gained the momentum it now enjoys with out the
    existence of the Internet. So the Internet is really the natural source for keeping
    up to date on Linux information. It is the single network that keeps Linux developers
    and users together.


    In fact, you''ll typically get better support for Linux over the Internet than
    the commercial UNIX help lines offer. The free flow of information and ideas provides
    an unmatched resource for an operating system like Linux. Bugs are discovered
    and fixed, drivers are written, and help is dispersed far and faster than via
    the Internet than any other mechanism. A vast pool of talent is tapped to fix
    and push forward the software and people are using their own time and resources
    to produce much of the value that Linux offers. The motive is to produce a quality
    product-personal pride and satisfaction drives Linux software to extremely high
    level of quality.


    That''s one of the reasons that Linux is stable while the same time advancing
    at such a fast rate. There are a large number of people to work on a large number
    of projects and ideas. The code is going to be seen and evaluated by their peers
    and must in general be as well as functional. (Because people with all levels
    of experience contribute to Linux, sometimes it takes repeated review to produce
    a good product.) Public interest and passion for the operating system is what
    fuels the support you''ll find on the Internet for Linux.


    # Using the Web


    The Internet has an abundance of Linux Web sites, each with its own emphasis.
    One good place to start is the Linux homepage:


    ```

    http://www.linux.org

    ```


    That''s only the beginning.'
  merge: -1
  pgno: 128
- img_proc: true
  md: '# LINUX NEWS


    The purpose of some of the sites is to "spread the word" about Linux. They exist
    to educate people on the virtues of Linux and to debunk some of the mysteries
    associated with it. One reason Linux is gaining share in the computer industry
    is because of sites like these. These are the places to go to find out what has
    been written in the industry about Linux. Some examples are:


    +   - Slashdot: http://slashdot.org

    - Linux Daily News: http://lwn.net

    - Linux Today: http://www.linxtoday.com


    # INFORMATION SITES


    Some sites are resources for seeking answers to questions. I''ve already mentioned
    the home site of the LDP and the Red Hat Linux User''s FAQ, but there are others.
    For example,


    ```

    http://www.redhat.com/support/docs/hardware.html

