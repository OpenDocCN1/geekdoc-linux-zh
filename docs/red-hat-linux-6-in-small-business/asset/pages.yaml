    # Troubleshooting


    This troubleshooting section is divided according to the sections of this chapter.


    # Modem trouble


    If you have trouble getting your modem to connect, then there are several things
    you should check.


    If you have an external modem, make sure that it''s connected properly. Can you
    see the Light Emitting Diodes (LED) flicker when you interact with it? For instance,
    if you use dip t, then you should be able to see the LEDs flicker when you enter
    keystrokes.


    If you have an internal modem, check that it is seated properly on the system
    board. Can you manually communicate with it via a program like dip? If not, it
    might have an IRQ or IO port set that is conflicting with another device. You
    can check its current settings against the other devices by looking at /proc/ioports
    and /proc/interrupts files (for instance, cat /dev/ioports). You can also check
    the device file that it is supposed to be using. If, for instance, you have a
    soft link pointing to /dev/ttyS0, then to check if that is correct. You might
    have to change the link to /dev/tty1 for instance. Try using the dip command to
    communicate directly with another device (DIP>port tty1 for instance). Keep in
    mind that if you have a PnP modem, then you might have to turn that feature off
    to work with Linux. A Winem will not work with Linux.


    # Using the Control Panel to Connect to the Internet


    If you have set up your modem correctly, then most problems that you encounter
    using the Network GUI in Control panel probably result from the misconfiguration
    of your ISP settings. If you have problems getting a connection, then check that
    your ISP PPP login name and password are set correctly. You might also need to
    check that your ISP is not using unusual settings; go through the options in the
    Network Interfaces window and make sure that each one is correct.


    # Using DIP to Connect to the Internet


    The good aspect of dip is that you can see everything that is going on. Any problems
    that occur are immediately visible. If you are having problems connecting via'
