  md: '# Part III: Connecting Your Network to the Internet


    The professionals have varying degrees of ability, of course, but they all should
    be treated as significant threats in both terms of intelligence and ability.


    Whatever you are being attacked from, you can do a lot to protect yourself. The
    firewall described in this chapter is the essential corner stone. Once in place,
    you need to actively monitor and manage it to assure that you present your best
    defense.


    # Know Their Tools and Methods


    There are numerous tools available to the unscrupulous cracker. One of themnmap
    is described in the section "Using NMAP to Test Your System" in this chapter.
    Other tools can be investigated by searching the net.


    There are also numerous methods for attacking systems. For instance, if one can
    gather information about a system or network, then you can search the manufacturer''s
    bug and vulnerability lists. By comparing the two lists you might be able walk
    through an open door or slip through a crack. Another way is the well practiced
    denial of service attack. By sending incorrect and incomplete packets into a computer
    it is often possible to overload the internal network buffers of that computer
    and shut the service or entire computer. No break in occurs but the operators
    and users of the computer or network suffer a temporary breakdown.


    Again, this book is not intended to be a reference for security matters. It avoids
    the details on objects such as this in order to concentrate on specific solutions.
    Please refer to the URLs listed in the section "Education is Your Firewall To"
    to study this issue further.


    # Monitoring your Log Files


    Your log files are often your best way of knowing what is happening, and has happened
    to your system. They record system information about users and system processes.
    You can keep track of user logins and failures; modem/PPP connections to the Internet
    and many other functions.


    There are numerous flags that you should keep an eye out for. Some of the most
    important failed logins, logins at odd hours (that don''t fit your users'' general
    profiles), logins from unrecognized machines, etc. Also keep a close look at super
    user (root) log ins. Limit the distribution of the root account password to yourself
    and one or two other people. Don''t write down the password In that way, it is
    possible to know when an unauthorized log has occurred. The last command lists
    show the time of the log for each of


    Keep an eye out for unusual /var/log/messages system information. The system logs
    much of its information to that file.


    Other logs of interest are secure, xfer.log and the samba logs. The secure log
    records incoming connections to the Linux services (Telnet, imap, etc.). The'
