  md: '# Understanding Network Administration


    Network administration is the close cousin of system administration. The former
    looks at managing the network media, protocols and the configuration of the individual
    parts, while the latter deals with managing the internal workings of each part.
    However, in a small business or organization, generally only one person, or a
    small number of people, end managing the whole system.


    The principles of network and systems administration are the same. You want an
    efficient, trouble-free, and secure operation. To that end, the place to start
    your trek is with the governing policies that ultimately determine how and why
    the administration is performed.


    # Understanding and Creating Policy


    Your network policies are similar to the computer policies as described in Chapter
