- img_proc: true
  md: '# Authentication Configuration


    anything that can be easily guessed or associated with you. Instead, it is best
    to make up a simple phrase that is easy to remember but not found in any dictionary.
    Something like car~lite is appropriate. The idea is to be able to remember it
    and not have to write it down. The idea also is not to be able to find it in a
    dictionary where an automated program can find it. Please refer to Chapter 6 for
    more discussion.


    You are given the option of using the Network Information System (NIS) at this
    point. NIS allows you to use a single user account (with the same password) on
    one or more Linux/UNIX computers. This is a very useful system when you or users
    work on more than one Linux/UNIX computers. However, NIS is not used in this book
    so leave it unselected.


    The Hot Hat installation system uses shadow passwords with MD5 checksums by default.
    The traditional Linux/UNIX system stores your encrypted passwords in the /etc/passwd
    file by default. That file must be readable (any user can read but not write to
    that file) for a number of technical reasons. That makes it possible for a malicious
    person to copy the encrypted passwords and then run a password-cracking program
    and possibly discover your passwords. Shadow passwords stores the encrypted passwords
    in another file—/etc/shadow—which is not world readable. This system makes your
    Linux computer safer. MD5 is an encryption method. Leave both items selected and
    click the OK button to process.


    # Bootdisk


    Sometimes it is necessary to boot your computer from a floppy disk. If you choose
    to make a boot floppy at this time, a bootable floppy is made. Store it in an
    accessible and safe place for a rainy day.


    # LILO Installation


    Remember that LILO is the program that configures the boot sector on your hard
    drive, and therefore allows it to know about the operating system(s) on it. Since
    this book assumes a drive dedicated to Linux, there is only one choice. However,
    if you are loading Linux onto a drive with another system on it—dual boot—then
    you can choose which is the default system here.


    # Bootable Partitions


    In this example there are no other drives available to boot from. In some cases
    you might have, or want to have, Linux on another, non-primary drive and want
    to be able to boot from it. Enter the appropriate information into this dialog
    box in cases.'
