  md: '# Creating a Filtering Firewall


    If you built the Linux server described in Chapter 1 and connected it to the Internet
    as described in Chapter 11, then you''ll need to protect it with a firewall. The
    following section describes how to set up simple filtering rules. You should keep
    in mind that until you construct the full firewall described in this chapter,
    you are potentially vulnerable to attack while connected to the Internet. This
    is probably a small risk right now because you are connected via a dial-up connection,
    which is invaluable when not connected. Also, the system constructed in this book
    has no valuable information on it other than the passwords (unless you have put
    information and data on it yourself). You can judge the potential danger for yourself.


    In order to test and build the chains described in this chapter you need to be
    connected to the Internet (a chain is simply a series of filtering rules). If
    you are experienced with IP filtering, then you can translate the rules to apply
    to an internal connection; a good idea if you don''t want to risk being unprotected.


    # Building a Simple Filter


    You can make a simple filter as follows. The Linux computer atlas is used as the
    firewall in this example. To enhance security it is best to use a dedicated computer
    for your firewall. By using a dedicated machine you can reduce the services and
    software that it provides in order to minimize potential vulnerabilities.


    Log on to your Linux server as root and connect to your ISP:


    ```

    echo "force" /etc/dial/dial.ctl

    ```'
