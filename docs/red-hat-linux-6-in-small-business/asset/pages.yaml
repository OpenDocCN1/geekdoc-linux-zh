    # Using Tripwire to Monitor Your System


    Tripwire is a tool for computing and storing the digital signature of files. There
    is always the danger of your system being broken by a subtle intruder. Once inside
    the cracker doesn''t do anything obvious and does not attract any attention. Then,
    sometime later, the break-in is discovered but it is not know when it first occurred.


    You are left unsure which files are valid and which might be hidden disasters.
    The technology and skill of crackers is that they can modify or substitute a file
    and leave the obvious changes same as the original. For example, your /bin/ls
    command might be replaced with another program that provides the features of a
    normal ls but also does some nasty process.


    Tripwire creates its own database of digital signatures that can, and should,
    be stored on read-only media. You can periodically check the state of your important
    systems files. In the case of a break-in, you can check your system against the
    Tripwire database.


    Tripwire is included on the companion CD-ROM. Log in as root and install it.


    ```

    rpm -ivh /mnt/cdrom/firewall/tripwire*

    ```


    Tripwire is controlled by the //tw.config file. If you see the lines /dev @DEVM.
    These tell Tripwire what and how to check the files. The macros, such as @DEVM
    are defined earlier in the file and expand to $+pnugscil12. Without going into
    the detail of what each character means, that particular example tells Tripwire
    to check every possible change that can occur in a file.'
  merge: -1
  pgno: 310
- img_proc: true
  md: 'This example leaves the default Tripwire configuration as is. To run Tripwire
    we need to have initialize its signature data base. Enter the command and be prepared
    to wait a while for it to finish.


    ```

    /usr/sbin/tripwire -init

    ```


    Tripwire chugs away. If it finishes without problems, it then stores its signature
    database in the /root/databases directory.

    Make a trivial change to a file as follows:


    ```

    touch /bin/ls

    ```


    Next, run Tripwire in interactive mode:


    ```

    tripwire -interactive

    ```


    When it finishes, you see that it reports /bin/ls as having been changed. It is
    best to store a Tripwire database in a read-only media. Then that is probably
    the best solution. Then nobody with access to your physical plant can easily alter
    your database. Paranoid? Maybe, but it is a possibility.

    You can run Tripwire on a daily, or other frequency, basis for the cron daemon.
    Then it is a matter of checking the results and using your judgement about what
    changed files make sense and which ones not. Use your judgement as to how often
    that you review the logs. In some cases, you might want to run only Tripwire so
    that you have an audit trail should you ever get into.


    # Using crack to Test Your Passwords


    Passwords are your first and last line of defense. Now that you are connected
    to the Internet, it is necessary to test your passwords regularly just in case
    in your firewall is compromised.


    The crack RPM is included on the companion CD-ROM and is used to guess passwords.
    Linux passwords are stored in encrypted form in either the /etc/passwd or /etc/shadow
    files. Crack goes through international dictionaries and encrypts each word or
    phrase. Then it compares the two entities and if a match occurs, then it knows
    your password.


    Log in as root and install the crack RPM.


    ```

    rpm -ivh /mnt/cdrom/firewall/crack*

    ```


    The cracklibs and cracklib-dicts RPM packages, needed by crack, should already
    have been installed during the Red Hat installation process.'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# Chapter 12: Creating a Simple Firewall


    Next, run crack against your /etc/passwd. Make a copy of the password file in,

    instance, /root/passwd.crack. Then run the crack command.


    /root/crack-4.1f/Crack /etc/passwd


    If you have installed shadow passwords, then you need to unconvert the

    etc/shadow file before running crack. Run pwconv to restore the

    passwords. Copy the newly restored /etc/passwd file to some other tem-

    pory location like /root/passwd.crack.Make it readable only by root:

    chmod 400 /root/passwd. Finally, restore the shadow password file;

    pwconv.


    Crack displays the results of each password that it works. In the case where

    user account is not a login account it displays a result like follows:


    join: Apr 10 02:41:18 User uucp in /etc/shadow) has a locked

    password; - *


    If you have set good passwords, then it is likely that crack will not discover
    it.

    But just to be sure, try using a trivial password in one of the accounts (Don''t
    forget

    to change it back to a good one!) and see what happens. When Crack finds the

    password it gives the system administrator a good jolt.


    Don''t forget to delete the /root/passwd.crack once you have finished

    checking it.


    There is another way to discover passwords. You can use a packet sniffer to

    look at and store every packet that travels across your network. Red Hat

    Linux comes with the package tcpdump that includes a sniffer. If you record

    very packet on a private network, then you can filter through the informa-

    tion and pick out plain text passwords. You have to have physical

    access to a network but if that can be obtained, then the rest is easier. The

    only real solution is to use encryption. Use encrypted Samba passwords for

    file sharing and Secure shell for interactive communications. The Secure

    shell ssh tools can be found at ftp://ftp.cs.hut.fi/pub/ssh.'
