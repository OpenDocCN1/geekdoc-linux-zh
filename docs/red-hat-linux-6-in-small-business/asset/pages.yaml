    # CHECKING FOR SIMPLE SOLUTIONS


    Very simple solutions can often be found to difficult problems. Keep in mind that
    a misbehaving Ethernet NIC, PCMCIA card or CD-ROM can often be attributed to a
    connector not being seated properly or a power supply cable not inserted fully.
    Check that the connectors are properly inserted both inside and outside your machine.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_62_0.png)


    Sometimes older devices have built up dust or a little bit of corrosion on their
    connectors. Removing and reseating them can frequently clear up the problem


    # CHECKING YOUR NETWORK CONNECTIONS


    Sometimes you have set up your network configuration correctly but the electrical
    signals are not getting to their destination. Infinite impedance—an air gap—gets
    every time.


    THINNET If you are using Thinnet (10base2 or coaxial cable) then you should know
    that it needs to be terminated at each end, with a 5 ohm terminator, and there
    can be no breaks in any of the cables or connectors. Thinnet uses radio frequency
    (RF) signals to carry the binary Ethernet signals and is what is called a waveguide.
    A waveguide is just that—a guide for waves. Think of a pipe that you could speak
    through, and you''ve got the idea. If the waveguide is not terminated correctly,
    or there is a break within the wiring, the electrical signal gets reflected back
    onto itself and becomes a jumbled mess.'
