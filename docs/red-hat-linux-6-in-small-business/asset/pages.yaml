  md: '# Chapter 12: Creating a Simple Firewall


    # 287


    # IP Chains


    Setting up IP chains can be a confusing task at first. It''s difficult to understand
    which packets are going where and through which interface. It is also hard to
    keep track of how the source and destination addresses – and port numbers – interact
    with the filtering rules.


    When designing new rules or modifying existing ones, it is best to write out the
    rules on a piece of paper in order to get a better understanding of them. Make
    separate-diagrams lists for each direction: outgoing packets, incoming, and forwarding.
    (If you continue to use a simple network with a single Linux gateway, the only
    forward rule that you will probably ever need is the masquerading one.)


    Once you have put into place the new rules, or are trying to better understand
    existing ones, then you can use the iptables and tcpdump utilities.


    The default dial connection GUI provides a display of open tcp and udp network-connections.
    The source, destination and port information is shown. You can see new connections
    open and old ends. It is quite useful for seeing what is going on your PPP connection.


    The tcpdump is a packet sniffer. It comes as part of the Red Hat distribution
    and can be installed by logging in as root and entering the command rpm /mnt/cdrom/RedHat/RPM/tcpdump*.
    This is a powerful tool because you can see every packet that goes by any network
    connection on your machine. This is one of the commonly used tools for sniffing
    information off a network. With enough experience and patience, you can discover
    passwords and other vital information. Beware.) If you are having problems getting
    a filter to work, then you can watch what packets are showing up at your PPP interface.
    With some work it is possible to relate those packets back to your rule set and
    hopefully find the errant filter.


    Finally, you can try backing off your filtering rules. Define a rule that sets
    up deny policies – as done in his book''s iptchains scripts – then set up input
    and output rules in each direction that allow all packets. For instance, try the
    following rules:


    ```

    iptchains -F

    iptchains -P output DENY

    iptchains -P input DENY

    iptchains -P forward DENY

    iptchains -A output -j ACCEPT -s 0.0.0.0/0 -d 0.0.0.0/0

    iptchains -A input -j ACCEPT -s 0.0.0.0/0 -d 0.0.0.0/0

    ```


    These rules flush out any existing rules (it is essential to start from scratch
    when debugging filtering rules) and then setting up a uniform deny policy. At
    that point your firewall is shut down tight. The final two rules open up the firewall
    to'
