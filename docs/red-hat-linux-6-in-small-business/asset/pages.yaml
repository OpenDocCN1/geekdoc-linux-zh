    * Network: What people can do and can''t on your LAN and the Internet

    * Email: What is considered acceptable and unacceptable use of email

    * Liability: What people are responsible for

    * Disaster Recovery: Who, what, when and how to recover from a catastrophe


    If you can set your policies and follow them, then you lay a consistent structure
    on top of your system. You need to balance ease of use for you and your users
    along with the friction that such a structure requires. It''s a balancing act
    just everything else in your operation. Judgement is key.


