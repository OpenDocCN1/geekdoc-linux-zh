    # # Configuring a Windows Client


    Arkeia has provided a Windows 95 client. It is stored in the windows.zip file
    in the /mnt/cdrom/IDG/Arkeia directory on the companion CD-ROM. To install the
    Windows client, log in as root, install the unzip program (gunzip does not work
    on .zip files) and unzip with the following commands:


    ```

    rpm -ivh /mnt/cdrom/RedHat/RPMS*

    mdir /var/tmp/arkeia

    cd /var/tmp/arkeia

    unzip /mnt/cdrom/IDG/Arkeia/client

    ```


    You could copy the unzipped files to your Windows machine and then run the installation
    program. However, a more elegant method is to leave a single set of files on the
    Linux server, mount that directory on your Windows computer, and then run the
    installation program. This method is efficient because you do not make multiple
    copies of the file. If you install this, or any program, on more than one machine,
    then you do not end up with copies on multiple machines.


    Edit the /etc/smb.conf file by hand or with SWAT and add a share for the /var/tmp
    directory.


    ```

    [Arkeia]

    path = /var/tmp/arkeia

    public = yes

    ```


    From your Windows computer, mount the Arkeia share by opening your Network Neighborhood,
    double click on the Chivas icon and then double click on the Arkeia share. You
    should see the Setup.exe program. Double click on that icon and the software installs
    itself. (You need to have the Microsoft Virtual Machine,'
