    # Packages versus Tar Files


    Until the advent of the RPM and Debian package managers, Linux software was distributed
    via tar archives (sometimes referred to as tarballs). The tar mechanism is the
    same that is used to perform system backups, as described in this chapter. The
    system is sufficient if your software does not often change. However, when you
    need to upgrade or change software, or work with complex software systems, it
    becomes difficult to work with. Systems like RPM greatly simplify working with
    system and application software.


    Some software is still distributed exclusively via tar archives. Use the commands
    described in the backup section to tar distributions and read any documentation
    that comes with such software. It is best to install tar archives into a common
    location so that you do not lose track of them. The /usr/local directory is generally
    considered to be the best location.


    # Writing Scripts


    Linux provides the powerful feature of writing scripts. A script can perform almost
    any job that you can manually as well as things that you cannot do manually. A
    script is just a text file that contains shell commands and system commands. This
    section provides some simple examples to give you a flavor of what scripts can
    do. A simple script tells you the contents of the companion CD-ROM is shows below:


    ```

    #!/bin/sh

    ls /cdrom/RedHat/RPM/*.rpm

    ```


    The first line tells the Shell to use the Bash shell (/bin/bash) to interpret
    the script commands and primitives. The second line lists all the RPM package
    files on the CD-ROM and is the same command that you can easily enter yourself.
    To create and execute the script login as root and use your favorite editor to
    create a file—call it list_cd.sh—and add the two lines. To execute the script
    use the change mode command (chmod +x) to turn on the execute bit:


    ```

    chmod +x /root/list_cd.sh

    ```


    Run it:


    ```

    /root/list_cd.sh

    ```


    All the files in the RPM directory should be displayed to your screen.'
