  md: '# Chapter 1


    # Installing Red Hat Linux


    IN THIS CHAPTER


    +   - Explore the basic requirements needed to install Red Hat Linux

    - Get to know the basics of Linux

    - Learn how to install Linux by itself or on the same disk as Windows

    - Learn how to simplify the installation by preparing your computer

    - Find out the basics of connecting Linux to a LAN

    - Learn how to prepare for the installation

    - Explore step by step installation instruction

    - Understand basic troubleshooting techniques


    INSTALLING RED HAT LINUX (www.redhat.com) is a generally straightforward, but
    not simple process. The process is decently easier if one has a vanilla PC; and
    as long as you have a computer that has an IDE hard drive, an ATAPI CD-ROM and
    an SVGA capable monitor you should not encounter many problems. The Red Hat installation
    system is fairly mature and can identify your hardware and install itself. It
    takes you-by-step through the process using simple questions and answers.

    If you have an unusual hardware configuration, or if you lack certain pieces like
    a CD-ROM, you can still install Linux. The method in that case is more complex
    and you have to work around some problems, but Red Hat does provide alternative
    installation paths. This book assumes that you are using a vanilla system but
    provides extra (though not exhaustive) information for those more unusual situations.
    And, in many cases where the very specific information is omitted, I have provided
    other resources for help or more information.


    # Basic System Requirements


    The installation of Red Hat Linux requires the unusual combination of an Intel
    386 or greater CPU, 8 MB or more of memory, a floppy drive, at least 50MB of hard
    drive space, and a VGA video card and monitor. Installation is made much easier
    if you'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Part I: Building and Using a Basic Linux Computer


    also have an ATAPI CD-ROM drive; the ATAPI type CD-ROM is automatically recognized
    by the installation process and precludes the need to load a specific driver for
    the CD-ROM. However, the Red Hat installation process includes drivers for CD-ROM
    drives with proprietary controllers.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_31_0.png)


    Red Hat Linux provides distributions that run on Sun SPARC and Compaq (formerly
    Digital) Alpha systems. To use those platforms you must either purchase or download
    the appropriate distribution. You can download the distribution from the Red Hat
    FTP site (http://ftp.redhat.com) or one of its mirrors (http://www.redhat.com/mirrors.html).The
    Red Hat FTP site is often busy to accept connections, so you might want to try
    a mirror. A mirror is an Internet connected computer that maintains a copy of
    the primary site files.


    The Red installation process works best when you have a local CD-ROM drive. If
    you don''t have one, then you''ll have to make provisions for accessing the Red
    Hat distribution. Typically that means accessing a Red Hat distribution CD-ROM
    which is mounted on another computer from a local area network (LAN). For instance,
    I used a couple of Linux-based laptops for writing and testing this book and since
    neither has a CD-ROM attached to it, I installed Red Hat by mounting the remote
    CD-ROM drive over the network. I''ll go into more detail later, but you should
    know that there''s more than one way to do an installation.


    This book assumes that you are connected to a LAN. The LAN is assumed to be a
    simple one without multiple subnets. Therefore, you do not need specialized routing
    within your LAN. If you have multiple subnets with specialized routing, then it
    is assumed that you have the knowledge to manage the connection of your Linux
    system. If you are not connected to a LAN, then you can skip the sections that
    deal with networking; you can always add networking later on.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_31_1.png)


    Not all Ethernet network interface cards (NICs) are made equal. The Red Hat installation
    process carries many modules (a module is essentially a device driver that is
    loaded by the operating system only when needed) for recognizing various types
    of NICs. However, some NICs are not recognized easily; this is true of PCMCIAs
