  md: '# Using which


    The which command searches for one or more commands in the directories defined
    in your shell''s PATH variable. For instance, when you login as the regular user
    iamme your default PATH should be as follows:


    ```

    PATH=~/usr/bin:/usr/local/bin:bin:/usr/usr/X11R6/bin:/home/iamme /bin

    ```


    If you want to search for the command xclock, then enter the command xclock, and
    you get the following answer:


    ```

    /usr/X11R6/bin/xclock

    ```


    Since /usr/X11R6/bin is defined in your PATH variable, which finds it. If a command
    is not found in your path list, then you need to use whereis, or locate to discover
    the file''s location.


    # Using locate


    The locate command combines some benefits from both find and whereis. It can search
    every location on your hard drive, and it works very quickly. This is possible
    because it builds its''own database of file locations. To build the database,
    type the following while logged in as root:


    ```

    updatedb

    ```


    > Red Hat Linux runs updatedb every night at around 1 a.m. local time.


    Once that database is built, using update couldn''t be easier. Type:


    ```

    locate xclock

    ```


    and it will return the following text:


    ```

    /usr/X11R6/bin/xclock

    /usr/X11R6/man/man1/xclock.1

    ```


    The only caveat is that you have to run update fairly regularly to keep its data
    base of files current.'
  merge: -1
