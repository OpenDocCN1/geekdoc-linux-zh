  md: '# Chapter 4: Configuring the X Window System


    # DISPLAYING AN X CLIENT ON A REMOTE SERVER


    Once your local X Server has been told to display X Clients with the xhost command,
    you can expand the display variable to show the graphical information from an
    X Client running on a remote machine. If you are connected to a network that has
    another computer running X Window, then enter the following command from that
    machine (note that commercial products like Exceed give Windows machines the capability
    to do just that):


    ```

    xclock -display chivas.paunchy.net:0.0

    ```


    This command displays the graphical clock on the Linux machine with the network
    address of chivas.paunchy.net (that is the IP 192.168.1.254 that was used for
    the Red Hat installation described in Chapter 1). Note that in the typical case
    a computer has just one physical monitor, the 0. syntax is the same as 0.0. The
    second 0 means the first display or monitor attached to the X Server and can,
    in most cases, be abbreviated from 0.0 to 0. It''s confusing at first.


    If you are sitting at the console of the remote machine then however, if you telnet
    to chivas from the remote machine and reverse the process, then you''ll see the
    Xclock displayed on your machine. After you experiment with the system, it should
    become clear who is the server and who is the client.


    # Troubleshooting Problems


    First, it should be pointed out that the Xfigur is a good troubleshooting tool
    in itself. If it cannot properly start up X, then it allows you to quit or attempt
    to reconfigure.


    If you have problems getting X Window started, then there are a few places to
    look at. First check that Xconfig has your correct video and monitor hardware
    information. Remember, SimpleProbe can detect many types of video adapters. The
    /cat/pci file contains information about your video adapter if it is a PCI device
    /cat/pci | grep -i vga.


    If you''ve entered the correct information and you still can''t get the display
    to work, then you have misconfigured the video adapter, the monitor, or both.
    If you are trying to specify a specific video driver, then try using a generic
    VGA log. In root, mount the CD-ROM and install the XFree86-SVGA RPM (rpm -ivh
    /mnt/cdrom/RedHat/RPMS/XFree86-SVGA*). Rerun Xconfigurator as described in "Using
    Xconfigurator" earlier in this chapter.


    In this case select the Unlisted item which is at the very end of Choose Card
    menu. That puts you in the Pick a Server Menu. From that menu, click SVGA.


    After selecting SVGA you will see the Setup Menu. Select the first item in the
    menu (custom monitor) and click OK. For troubleshooting purposes it''s'
  merge: -1
