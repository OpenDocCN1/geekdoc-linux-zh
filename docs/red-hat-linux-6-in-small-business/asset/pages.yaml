  md: '# Chapter 12: Creating a Simple Firewall


    You should see the following results if you have not configured any filtering
    rules yet:


    ```

    Chain input (policy ACCEPT):

    Chain forward (policy ACCEPT):

    Chain output (policy ACCEPT):

    ```


    The results show that there are no output, input and forwarding rules set and
    that the default policy is to accept any IP packet to come into or out of your
    network. Your system is completely open.


    # SETUP DEFAULT POLICY


    From atlas add the following rules:


    ```

    ipchains -P input DENY

    ipchains -P output DENY

    ipchains -P forward DENY

    ```


    Those rules set your output, input and forwarding rules on atlas to deny any IP
    packets in any direction; the following list shows the ipchains filter commands.
    You now have a very safe firewall. However, it does not allow you to access the
    Internet ever.


    +   -A Append one or more rules to a chain

    -D Delete one or more rules from a chain

    -R Replace a rule from a chain

    -I Insert a rule into a chain

    -L List the rules in a chain

    -F Flush a chain — all rules are lost

    -N Create a new chain

    -P Set a policy for a chain

    -M Masquerading rules to follow


    Please consult the ipchains man page for more information (ipchains -help will
    display the same information too).


    # FLUSH ALL EXISTING RULES


    Enter the next command to flush out any existing rules.


    ```

    ipchains -F

    ```'
