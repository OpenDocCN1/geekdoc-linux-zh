  md: '# Working with pico


    Unlike venerable vi editor, pico provides an online help system. It also provides
    an informational display (one line of text) across the bottom of your screen.
    Like the other text editors, however, it requires you to use key combinations
    to perform editing and movement functions.


    # Starting pico


    To load pico and start editing a file, just type:


    ```

    filename

    ```


    You can also type pico by itself, and either load a file manually or just start
    typing specifying a filename when it''s time to save. You see a white bar across
    the top of the screen with the file name (if you specified one). Along the bottom
    you see the commands you need to enter to perform some of the most common tasks.


    This list along the bottom makes pico so easy to use. It''s not that its commands
    are easier to learn or remember than other editors, but with key along the bottom,
    you have a constant reminder. Of course, the trade-off is that that key takes
    up screen space. (Once you learn the commands you can start pico without the key
    as shown in the following sentences).


    # Inserting Text and Moving Around


    All you have to do to insert text with pico is to start typing. It automatically
    wraps words for when you reach the end of a line, and if you make a mistake, the
    arrow keys to navigate to the right place and the backspace key will erase your
    errors. Incidentally, the delete key also works the same as the backspace key.
    (Although pico has a startup option to change that too—read on instructions).


    One feature of this editor is that you don''t have to take your hands off the
    alpha keys to move around. Every almost command consists of holding the down Control
    key while you press another key. In pico, the Control key is annotated by the
    caret, "^". Therefore, Ctrl-X is written ^X. And the control keys are not case
    sensitive—Ctrl-K is the same as Ctrl-k.


    You can use ctrl to navigate around your text. For example,


    +   Ctrl-F moves the cursor forward one character

    Ctrl-B moves the cursor backward one character

    Ctrl-P moves the cursor up to the previous line

    Ctrl-N moves it down to the next line'
