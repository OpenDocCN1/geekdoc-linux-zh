  md: '# Chapter 2: Navigating Linux


    # # Searching for Files


    As you can see, Linux uses a lot of files. It has many programs and commands,
    a few of which you''re now familiar with, and many configuration files.


    With all these files, sometimes it''s difficult to locate what you''re looking
    for. Linux has configuration files which you only need to peruse or edit once
    in a blue moon, and it''s easy to forget where to find everything.


    Linux provides several support tools to help you find what you''re looking for.
    This final section discusses some of those tools so you can get familiar with
    them.


    # # Using find


    The program find searches any location specified for any filename specified. It
    has many other options (too many to mention here) that let you narrow the search
    criteria several The basic syntax for this command is find path parameters. start
    searching at the path you specify, then follow subdirectories thereafter. So,
    if you wanted to find a file called hangman and you knew it was somewhere under
    /usr, you would type:


    ```

    find /usr -name hangman

    ```


    The expression is just one of the possible parameters. You can look for files
    based on many divisions, as permissions with the -perm option, files owned by
    specific users with the -user option or based on time of modification with the
    -mtime option. It''s only drawback is that if you''re searching through a large
    directory, like /usr, it can take a while to complete the search.


    # # Using whereis


    If you know the name of a file or command, then another useful tool is whereis.
    To use whereis to find the xclock file, type:


    ```

    whereis xclock

    ```


    and you are shown where it resides:


    ```

    xclock: /usr/X11R6/bin/xclock /usr/bin/X11/xclock

    ```


    Two files show up because X11 is a symbolic link to the X11R6 directory where
    xclock is stored. The whereis command finds files very quickly, but that''s because
    it doesn''t search your whole hard drive. Specific directories are hard-coded
    into the program. If a file exists outside those directories, whereis won''t find
    it.'
