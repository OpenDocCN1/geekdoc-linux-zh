    It''s a good idea to get familiar with a group or two before you have a problem.
    Some newsgroups have far many messages to read each day and every one, but scanning
    the headers and following a thread or two that captures your interest will give
    you a lay of the land.


    # Linux Mailing Lists


    Another option


    You can find several mailing lists that deal with Linux. The rules of etiquette
    to apply to newsgroups also apply to mailing lists. Make sure you hang out for
    a while and get feel for the group before you post a message. Read the list''s
    FAQ. And if you''re new, check the archives before asking a question.


    Red Hat manages several mailing lists that you can check out at:


    ```

    http://www.redhat.com/support

    ```'
