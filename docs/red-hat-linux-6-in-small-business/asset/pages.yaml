  md: '# Part III: Connecting Your Network to the Internet


    > You could use the Post Office Protocol (POP) for this function. However, POP
    does not deliver outgoing mail, and that would require you to setup sendmail on
    each client workstation. That is not terribly difficult but it enhances security
    if you remove sendmail completely from every Linux workstation except atlas. Also,
    Windows do not run sendmail and so the only site wide location is to usesqcup.


    # Configuring Fetchmail for External Retrieval


    Fetchmail can be used to retrieve e-mail queued for an individual user on a remote
    account. When used for a single user it works in much the same way as you can
    use your Netscape e-mail client; it uses POP or IMAP to download your local e-mail.


    Fetchmail can be used on an individual basis to download each user''s e-mail.
    This is reasonable if your network has only a few people. Please see the section
    "Configuring Fetchmail for a Single User" for instructions.


    Fetchmail can also download e-mail for multiple local users from your remote account.
    This is called Multidrop mode and is the method we used here. See the section
    "Configuring Fetchmail for Multiple Users" for instructions.


    In order to make use of multidrop mode you must have a registered domain name.
    The domain name must be registered so that more than one individual can receive
    e-mail. For example, if you have just a single ISP login account, then only that
    name can receive e-mail. However, if you have registered domain name such as paunch.net,
    then any user that you give an account on your own network (paunch.net) can receive
    e-mail from the Internet.


    The following section Registering your Domain Name describes the process of registering
    your domain name.


    # REGISTERING YOUR DOMAIN NAME


    The local e-mail server as described in this chapter relies on funneling all email
    through a single e-mail account at your ISP. This means that you need to register
    a domain name with InterNIC. This is a simple process if you pay your ISP to process
    the paperwork for you. It costs $70 (as of spring, 1999) for two years of registration.
    You may have your ISP create an alias in their own e-mail system to map your registered
    domain name to your single e-mail address.


    > The alternative to registering a domain name and routing all of your user''s
    e-mail through a single account is to pay your ISP to create an e-mail account
    for every user on your system. You need to create a separate fetchmail process
    to retrieve each of your users e-mail.'
