    ups. The other functions of administration are important, of course, but some
    day you''ll need your backups and you can''t manage your user accounts or perform
    other tasks if you can''t get your data back.


    In this book, the backup function is divided into both local and network parts.
    Local backups are explained in this chapter and network backups are described
    in Chapter 10. They are separated because once you start managing a network and'
