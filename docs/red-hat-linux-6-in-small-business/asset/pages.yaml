  md: '# Part III: Connecting Your Network to the Internet


    this to happen. Please refer to the sendmail man page as well as the FAQ and other
    documents in the /usr/doc/sendmail directory for further information.


    # Fixing Problems with External Delivery


    Configuring sendmail to forward e-mail destined for the outside world is a simple
    matter of modifying one parameter in the /etc/sendmail.cf file (see the section
    "Configuring Sendmail for External Delivery" in this chapter for details). If
    you cannot get your e-mail delivered, then the problem most likely lies in either
    your Internet connection or your sendmail installation. The troubleshooting techniques
    in Chapters 11 and 12 to investigate the former. The latter can be checked by
    using the rpm -V sendmail command; do not hesitate to reinstall send-mail, because
    you only have three parameters in the sendmail.cf to change.


    # Fixing Problems with External Retrieval


    Fetchmail is another system that depends on having your ISP PPP connection in
    place and your firewall filtering rules correct. If you are having problems getting
    it to work use all the network and firewall troubleshooting hints given in Chapters
    11 and 12 to verify your Internet connection. You can use the verbose flag to
    see how the connection and downloading process is going by using the fetch-v command.
    Pay attention to the login and authentication process. When fetchmail has authenticated
    with the POP or IMAP server it should say that it''s downloading the text or data
    of each message. Once that is done, you should see sendmail related consider messages
    displayed. Any errors are displayed during this process. When all else fails,
    check with your ISP and the Usenet comp.sendmail group.


    # Summary


    E-mail is an essential part of any business or organization. You can configure
    your Linux network to use the very simple method of having each e-mail client
    access an individual e-mail account at your ISP. If that is not sufficient, then
    you can set up your Linux server to act as a local e-mail server and fetch and
    forward external e-mail via your ISP.


    +   - Using your Netscape e-mail client to directly access e-mail queue at your
    ISP is covered. This is a simple and nearly bullet proof method. Your ISP takes
    delivery of e-mail addressed to you. Netscape is configured to pull your messages
    across your PPP connection via POP or IMAP. Each user on your network requires
    a separate account for this method to work.'
