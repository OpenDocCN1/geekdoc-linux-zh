  md: 'Using your Linux server to handle local e-mail delivery while forwarding or
    fetching e-mail from your ISP is covered. This requires four functions to be performed:
    local deliver, external forwarding, external fetching and domain registration.


    Obtaining a domain name is necessary so that your ISP can forward messages to
    individual users based on your domain name is covered. Your ISP can handle the
    registration process for a small fee.


    Configuring your Linux machine to act as a local e-mail server is covered. Messages
    destined for people on your network can be handled by the Red hat sendmail installation.
    No modification of the /etc/sendmail.cf configuration file.


    Modifying one parameter in your /etc/sendmail.cf file takes care of the e-mail
    forwarding process. That line simply points to your ISP''s e-mail server.


    Using fetchmail to retrieve external messages queued at your ISP finishes your
    Linux e-mail server configuration. There are several ways to configure fetchmail;
    either on an individual retrieval basis or for your entire domain. The individual
    method is straightforward but the group (maildrop) method is not much more difficult.


    Troubleshooting e-mail problems is discussed. Much of the troubleshooting is based
    on basic network and PPP connection methods. Beyond that you can use the log information
    that sendmail, fetchmail, and procmail produces.'
