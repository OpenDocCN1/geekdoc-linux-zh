  md: When the installation, update, or removal of a Red Hat Package (RPM) is called
    for, the full name for the RPM file on the companion CD-ROM is not used. Instead
    the command substitutes the Linux asterisk (*) metacharacter for the version number
    part of the file. This works better in practice than having to specify the entire
    file name, and it also allows this book to more easily update the Red Hat distribution.
    Thus, the command rpm -i /mnt/cdrom/RedHat/cdrom/RPMS/smbfs-2.0.1-4.i386.rpm.
    See Chapter 8 for the discussion of the rpm command.
