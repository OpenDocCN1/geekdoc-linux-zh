  md: '# Part 1: Building and Using a Basic Linux Computer


    Every mailing list is different, so there''s no real way to predict how many messages
    you''ll get in your mailbox any given day. If you subscribe to two or three lists,
    you may start getting hundreds of messages a day in your e-mails inbox. A good
    idea for new users is to subscribe to the mailing list in digital format. A digest
    will take all the lists messages, combine them into one e-mail a day, and send
    it to you. That you''re only getting one message a day (even though it might be
    quite large).


    # Finding Linux Publications


    Since Linux is getting more popular, more publications focusing on the OS are
    cropping up. The most popular paper magazine is Linux Journal published by Specialized
    Systems Consultants, Inc. It''s a monthly magazine that covers a wide range of
    topics for developers, system administrators, and end users alike.


    A sister publication to Linux Journal is Linux Gazette. This is an electronic
    monthly magazine found on the Internet at:


    ```

    http://www.linuxgazette.com

    ```


    It''s also published by Specialized Systems Consultants, Inc. and has several
    how-type articles. It also contains a section titled Help Wanted. This isn''t
    for classified ads-its for people to ask questions and give ideas for articles,
    among other things. Some other magazines are:


    ```

    http://www.linuxworld.com

    http://ext2.org

    http://www.linuxfocus.com

    ```


    # Joining a Linux User Group


    As you can see, the Internet is a real tool for getting Linux information. But
    you can''t beat face-to-face communication with other users. If you would like
    to meet other people who work with Linux and can help with problems or just give
    advice, look into joining a local Linux user group.


    User groups (LUGS) are very important to the Linux movement. After all, there''s
    no "Linux Corporate Headquarters," "no home office," or "regional office" for
    that matter.


    User groups are certainly not new to Linux. They''re not even new to computers,
    although computer users helped propel the development of the personal computer.
    Many hobbyists from radio operators to train enthusiasts who get together to share
    ideas, get help, and tout their own knowledge. The difference with a LUG is that
    Linux isn''t just a hobby. The user group can give you real solutions for your
    business.'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# Chapter 5: Getting Help


    LUGs typically get together monthly. Meeting topics can run the gamut of trading
    shareware to writing device drivers. Sometimes they''ll invite a vendor to demonstrate
    their new Linux solution. Sometimes the meetings are more social and provide a
    way for friends with a common interest to get together.


    Some LUGs have their own newsletters, web sites, and mailing lists. These are
    especially helpful because you post a question, and someone has an answer, you
    might even be able to go to their office and have them show you how to solve your
    problem.


    To find out about LUGs, check out the User Group HOWTO document in the LDP. To
    see if there''s one new, you check out:


    ```

    http://www.linux.org/users/index.html

    ```


    If you can''t find one close, by considering your own LUG. The guidelines for
    doing so are outlined in the User Group HOWTO document mentioned above. You never
    know. You might just be the catalyst your area needs for Linux to gain popularity
    and support.


    # Summary


    There are many places to go to learn more about Linux. It''s a common misconception
    that Linux lacks the support mechanisms of other operating systems. Nothing could
    be further from the truth. On the contrary, Linux users have myriad places to
    go for information and help. The Internet is probably the main source of support,
    but don''t discount published works like magazines and books. Even virtual face
    to face communication is available through user groups. If you''ve got a question,
    you''ll get an answer if you''re willing to hunt a little.


    +   - A discussion of manual pages is featured. Man pages are the traditional
    method of storing information about Linux. They can be accessed easily via the
