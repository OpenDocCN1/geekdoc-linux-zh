  md: '# Chapter 1: Installing Red Hat Linux


    # Choose a [Video] Card


    This is the first step in setting up the X Window System on your Linux computer;
    the X Window System is also referred to as X11 and X. You need to select what
    video adapter or card your computer has. If you do not know what it is you select
    the generic SVGA driver that the installation contains.


    The system that runs to setup your X Window System is called Xconfigurator. It
    can be run as a stand-alone application after you have installed Red Hat Linux.
    You can also make use of the SuperProbe program that tries to cover what video
    adapter hardware you have installed. Both programs are described in more detail
    in Chapter 5.


    # Monitor Setup


    After selecting your video adapter driver you need to tell X Window what monitor
    you have. Again, if you don''t know what manufacturer and model it is you choose
    from one of several generic settings. If you choose a generic monitor keep in
    mind that you always can get the 640 · 480 mode to work. If you start from the
    minimal setting you can try working your way up to a higher resolution. Use your
    best judgement.


    > It is possible to physically damage your video monitor by misconfiguring your
    X setup. Be very careful manually configuring your system, especially concerning
    the Vertical Sync rate. If you do not know what values your monitor can take,
    then it is best to not configure it until you find the values are. (You could
    conceivably cause damage by picking one of the predefined monitor settings that
    doesn''t match your actual hardware.) Please beware!


    # Screen Configuration


    The Xconfigurator wants to probe your video hardware. If the probe is successful
    then X Window is able to make the most efficient use of your video hardware. If
    it is not successful, then you can still choose manually from several generic
    settings. (In the unlikely that your computer stops responding altogether, you
    should reboot your computer and restart the installation again. In that case don''t
    probe your video hardware.)'
