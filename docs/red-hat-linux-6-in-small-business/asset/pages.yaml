  md: 'loaded. Look for the module (lsmod) that corresponds to your network card and
    then remove it (rmmod). Reload the module and then test to see if it works again.


    ```

    lsmod

    rmmod driver

    modprobe driver

    ```


    If you can not get your Ethernet interface to work, then your best option, at
    this point, is to go back to the netcfg or LinuxConf GUIs and reinstall the networking
    from scratch.


    > Linux often has problems working with Plug-and-Play (PnP) devices. PnP devices
    are designed to work with Windows operating systems. Their interface parameters
    (such as interrupt values) are changed dynamically in conjunction with Windows.
    The idea is to make the addition and subtraction of peripherals transparent to
    the user. If you have problems configuring your Ethernet NIC, then PnP might be
    the cause. You should turn out the PnP option of your device by using the configuration
    software that comes with your device. This type of software generally runs under
    MS-DOS so you might have to use a DOS boot floppy to run it.


    # Ping your Network


    If your network media is good and your Linux network interface and routes are
    working correctly, then you need to check the response of other computers on your
    network. Check the response of your Windows computer by using ping as:


    ```

    ping 192.168.1.2

    ```


    You should get a response similar to the local pings described earlier, except
    the IP address should correspond to the computer pinged.

    If you do not get a response, then it is likely that the computer is not configured
    correctly or it is not working. Before you attempt to fix that computer, try ping
    another one on your network (if another one exists). The second computer responds
    to the ping, the first computer you pinged has a problem, and you should check
    it out. If the second computer also fails to respond, the problem is with the
    first computer. The overall idea is to narrow down the cause of a problem.'
