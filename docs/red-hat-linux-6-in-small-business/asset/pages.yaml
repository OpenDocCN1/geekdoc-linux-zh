    tapes → Create the new file pool called File Pool. From the Pools management window,
    click New, enter the name File Pool, and click on the checkbox. Click the checkbox
    in the Pools Management window to return to the Server administration window.


    # ADD TAPES TO POOL


    Open the Tapes management window. Then


    +   * Tape name: FileTape-

    * Bar code: /mnt/floppy (/mnt/zip for a Zip drive)

    * First number: 1

    * Last number: 5 (Five simulated tapes for a Zip drive)

    * Type: FILE 20MB (100MB for a Zip drive)

