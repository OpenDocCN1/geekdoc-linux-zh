  md: 'saves a compressed archive to the Zip disk. The tgz suffix is a standard suffix
    that indicates the file is a tar archive and is gzip compressed.


    # MAKING INCREMENTAL TAR ARCHIVES


    You do not want to continually make full backups because it takes up too much
    space and is time-consuming. By using the update feature of tar you can only copy
    files that have been created or changed since the last backup. The following command
    updates the tar archive with files that have been created or modified if you use
    the original etc.tar archive.


    ```

    tar -uvf /mnt/zip/etc.tgz /etc

    ```


    There are many ways that you can perform incremental backups. You are encouraged
    to read the tar man page for more hints. However, a reasonable schedule is shown
    in Table 6-2.


    # TABLE 6-2 A SIMPLE BACKUP SCHEDULE


    | Day of the month | Type | Description |

    | 1 | Full | Full backup once/month w/ Fresh disk. Current disk stored offsite
    |

    | 2-14 | Incremental | Daily incremental backup referenced to the Full backup
    |

    | 15 | Full | Full backup. All successive incremental to be pegged to it |

    | 16-last day of month | Incremental | Daily incremental backups pegged to the
    Mid |


    This schedule really gives you a feel for the things you should consider backups.
    The mid-month full backup is used to prevent too many incrementals from building
    up. Otherwise, in the worst case scenario, you would have to sort through 29-30
    incremental backups to find your data. By doing a full backup you reduce that
    number to a maximum of 14.

    It is advisable to store a reasonable amount of your data off-site. That means
    you should store the disks to recover from a disaster such as a fire in a different
    place. That place could be another office, your home, a safety deposit box or
    wherever makes sense based on the value of your data.'
