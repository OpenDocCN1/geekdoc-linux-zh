    # Managing User Accounts


    User login accounts are controlled by three files: /etc/passwd, /etc/shadow, and
    /etc/group. The passwd file contains the username,(an encrypted password if you
    choose not to use shadow passwords); the user and group numeric id (which are
    the same by default under Red Hat); the user home directory; a field for general
    information about the user; the user account home directory; and the type of shell
    used. The shadow file contains the username, encrypted password, and access information
    about the account (that system login accounts have no encrypted passwords because
    they cannot be logged into and thus not have passwords). The group file contains
    the user name, a numeric group identifier, and zero or more user names that belong
    to the group (it can also contain a group password word that is rarely used);
    additional user names are separated by commas. The passwd file can be edited by
    hand to add and modify users. It is generally okay to manually modify an existing
    user account but better to use either the useradd, usdel, and usermod command
    line programs or the LinuxConf GUI to add and delete users.'
