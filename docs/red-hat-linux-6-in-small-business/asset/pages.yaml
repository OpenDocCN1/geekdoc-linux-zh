  md: '# Chapter 14: Using Office Productivity Tools 313


    # Using Appliquware Words


    If you are familiar with the Microsoft word processor, then you should be able
    to find your way around Appliquware Words. The look and feel is not quite the
    same, but the idea is universal. This discussion touches on few of the widely
    used functions. Please experiment with your own test documents and consult the
    on-line help for more information.


    The main menu items are shown at the top of the window. The new bar contains short
    cuts to frequently used functions and is called the ExpressLine. The Ruler bar
    is third from the top and contains the ruler and font short cuts. ExpressLine
    and Ruler bars can be hidden by clicking the View menu and toggling their radio
    buttons.


    # THE FILE MENU


    Documents can be opened and saved from the File menu. Figure 14-4 shows the various
    functions.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_340_0.png)


    The Words file menu window


    The New, Open, and Save functions work on Appliquware Words files only; Words
    files have the aw suffix. Other file formats, such as Microsoft Word and HTML,
    must be imported and exported. The Import and Export selections are found within
    the File menu. To import a file, click on the Import item, and the Import window
    pops up. You can browse the Linux system by double-clicking any of the directories
    (directories are distinguished by orange folder icons). When you find a file to
    import, click it, and then select the file type from the submenu at the bottom
    of the window. Finally, click the Open button. Consult the help system for information
    on the other functions.'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# Part IV: Getting Work Done


    # EDIT


    The Edit menu provides all the functions that you are used to. The main functions
    are Cut, Copy, Paste, and Delete. You can also access the Find & Replace function
    from this menu. The Find & Replace menu provides a method for finding strings
    and optionally replacing them with another string. You can search forward or backward.
    You can replace one instance as well as all instances. Options include such things
    as activating case sensitivity (the default is no case sensitivity).


    # VIEW


    The View menu displays or hides the various menu bars as described earlier. You
    can also have Words display its formatting characters and zoom the in or out.
    The zoom function is quite nice for making smaller fonts more readable with-out
    a document.


    # INSERT


    The Insert menu can be used to—you guessed it—insert many different special char-acters,
    objects, files, and macros. Special characters include various symbols that are
    not found in the normal character set. Objects include graphics, symbols, and
    figures. You can create your own figures with Applixware Graphics, described in
    this chapter. You can also insert macros and hyperlinks into your Words documents.


    # FORMAT


    You can format documents at the character, paragraph, or document level. You can
    format a character''s font, font size, color, and position. Provisions are also
    made for bold, italics, and strike-through formats.


    # TABLE


    Tables can be inserted into a document. You have control over the number of rows
    and columns in a table. Words can automatically adjust the height, or you can
    do it manually. The overall positioning can also be adjusted.


    # TOOLS


    The main function that the Tools menu provides access to the spelling checker,
    thesaurus, and change bar. The change bar provides a change tracking mechanism
    that works at the line level. For example, if you change a single character or
    an entire line, then the change bars displays a marker pointing to the line that
    is changed. This is better than noth-, but obviously needs to be improved to change
    marks, in color, at the character level.


    # HELP


    The Help menu provides information that is described in the “Using the Applixware
    Help System” earlier in this chapter.'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# Chapter 14: Using Office Productivity Tools 315


    # Introducing the Other Applications


    Applizware is more than just a word processor; it''s a full-featured office productivity
    suite. The other applications in the Applizware suite are briefly described here.


    # APPLIXWARE GRAPHICS


    Applizware provides a graphical document editing and creation tool called Graphics.
    You can create slides and general-purpose graphics with this tool. Several of
    the figures in this book were created with Graphics. It works like one expects
    such a tool to behave, and no detailed explanation is given here. It is fairly
    intuitive if you are familiar with presentation and graphics tools. Give it a
    try.


    # APPLIXWARE SPREADSHEETS


    Appliz Spreadsheets is a full featured spreadsheet program. App Spreadsheets is
    similar to other tools. If you are familiar with spreadsheet software, then Spreadsheets
    should be straight forward to use.


    # APPLIXWARE MAIL


    Applizware provides an e-mail client called Mail. However, because this book focuses
    on using the Netscape, e-mail client it will not be discussed.


    # APPLIXWARE DATA


    If you run a SQL database, then you can use the Applizware Data interface. It
    provides a front end to your SQL database server back end. Click on the Star (*)
    button (or the data icon, on the far right in the Applizware main menu) to start
    the Data window.


    This Linux distribution comes with the PostgreSQL database and client RPMs but
    not the data RPM. All three RPMs are included on the accompanying CD-ROM. You
    can install it by logging in as root and running the following command:


    ```

    rpm -ivh /mnt/cdrom/db/postgresql*

    ```


    MODIFY THE POSTGRES USER Installing the postgresql RPMs creates the user in the
    /etc/passwd file. Modify the postgres user in that file and set its home directory
    and shell.


    ```

    postgres:x:101:234:PostgreSQL Server:/home/postgres:/bin/bash

    ```


    Set the postgres user password.


    ```

    passwd postgres

    ```'
