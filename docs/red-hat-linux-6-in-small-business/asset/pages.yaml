  md: '# Chapter 12: Creating a Simple Firewall 275


    with their ports; the ports below 1024 are referred to as Well Known ports. During
    masquerading, the port gets changed to a number above 1024. This process allows
    ipchains software to demasquer the returning, masqueraded packets back to their
    original locations.


    When a response occurs to a masqueraded packet, the reverse translation is performed.
    The returning packets have their destination IP address converted back to the
    originating IP address. The destination port is also converted back to the original
    port number.


    # Configure Linux Networking for Masquerading


    Modify the following FORWARD_IPV4 line in the /etc/sysconfig/network script on
    your Linux gateway atlas. IP masquerading requires forwarding to work.


    ```

    NETWORK=yes

    FORWARD_IPV4=no

    HOSTNAME=atlas.paunchy.net

    DOMAINNAME=paunchy.net

    GATEWAY=0.0.0.0

    GATEWAYDEV=eth0

    ```


    Your new network file should look as follows:


    ```

    NETWORK=yes

    FORWARD_IPV4=yes

    HOSTNAME=atlas.paunchy.net

    DOMAINNAME=paunchy.com

    GATEWAY=0.0.0.0

    GATEWAYDEV=eth0

    ```


    Uncomment the masquerading rule (the last line) in your ipchains script.


    ```

    ipchains -A forward -j MASQ -s 192.168.1.0/24 -d 0.0.0.0/0

    ```


    Any IP packet that shows up on atlas''s Ethernet NIC is destined for an external
    location (any non 192.168.1.r address) gets masqueraded by the dynamic PPP interface
    address; any packets originating within atlas do not get masqueraded because they
    inherit the PPP address.


    Restart your network to put the change into effect.


    ```

    /etc/rc.d/init.d/network restart

    ```'
