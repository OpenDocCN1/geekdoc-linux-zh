  md: '# Chapter 13: Configuring a Linux E-mail Server


    Once you have registered your domain and had your ISP configure their system for
    you


    The trick is to download that mail queue to your local server and distribute it
    to the appropriate individual mail queues. The following sections describe how
    to do that.


    # CONFIGURING FETCHMAIL FOR A SINGLE USER


    Fetchmail gets its configuration from the .fetchmailrc file in a user''s home
    directory. The fetchconf program provides an interactive configuration GUI. However,
    a sample configuration file is provided here that can be used with the paunchy.net
    network. It is used in this example for the example user rod_bush.


    To configure your own fetchmail, log in root, mount the CD-ROM and install fetchmail.


    ```

    rpm -ivh /mnt/cdrom/RedHat/RPMS/fetchmail*

    ```


    Create the sample user Rod Bush.


    ```

    useradd rbush

    passwd iwantmail

    ```


    Copy the configuration file from the companion CD-ROM.


    ```

    cd /home/rubush

    cp /mnt/cdrom/IG/e-mail/fetchmailrc.sampleuser ./fetchmail

    chown rubush.rubush /home/rubush/.fetchmailrc

    ```


    Change it to include your ISP login and password.


    ```

    # Configuration created Fri Apr 9 22:28:57 1999 by fetchmail

    set postmaster "root"

    poll mail.myisp.com with proto POP3

    user rbush there with password "iwantmail" is rbush here

    options fetchmail

    ```


    +   * The postmaster parameter informs the sendmail program that unrecognized
    or such messages should be forwarded to the root user.


    +   * The poll mail.myisp.com with proto POP3 tells fetchmail to go to your ISP''s
    mail server and use the POP3 protocol (IMAP and other protocols can be used too).'
  merge: -1
  pgno: 326
- img_proc: true
  md: 'The user line tells fetchmail that your ISP user name and password are rbush
    and iwantmail and that any e-mail in that account should be sent to the local
    user Rod Bush.


    The fetchmail option tells fetchmail to download all messages in the widget_inc
    e-mail queue.




    \n

    Your .fetchmail file contains your ISP password, so change the permissions so
    that only the user can read and write to it by entering:


    ```

    chmod 0600 .fetchmailrc

    ```


    Once fetchmail is run and the e-mail for rod_bush is downloaded, then the Netscape
    e-mail client (or any e-mail program that speaks POP or IMAP) can be used to view
    the e-mail.

    You can modify the .fetchmail file to get the e-mail for another user by changing
    the local user name. For instance, use that script to get the e-mail for garagon
    change the user line as follows (you should also create the account - adduser
    gabe_aragon).


    user "rbush" there with password "iwantmail" is garagon


    The problem with this method is that every individual who wants to receive e-mail
    needs a separate account at the ISP. This can certainly be arranged and should
    not be prohibitively expensive. It works in the same way as you use Netscape to
    go directly to your ISP as described earlier in the section "Using the Netscape
    e-mail Client.\nThe advantage of using fetchmail, on an individual basis, is that
    it automatically downloads the e-mail for a particular user without configuring
    your local sendmail, fetchmail and procmail systems. When you receive e-mail from
    mailing lists, delivery can be a problem. lists typically do not have your explicit
    e-mail address. Using fetchmail on an individual basis solves that problem because
    every message is directly downloaded to each user''s local account.


    # CONFIGURING FETCHMAIL FOR MULTIPLE USERS


    Fetchmail can be run by root to retrieve an entire Private Network''s e-mail.
    This is called multidrop mode, where fetchmail is configured to read the e-mail''s
    destination fields and convert it to a local domains''s. If the two fields do
    not match up (for instance, I receive e-mail from the list samba@samba.anu.au
    which does not match with my ISP user name), the mail will not be delivered to
    your local account. Instead, it is sent to the postmaster which, in this example,
    is root.

    Use this method, log in as root and create the following:


    ```

    adduser widget_inc

    passwd widget_inc

    ```'
