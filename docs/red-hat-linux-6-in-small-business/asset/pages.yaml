  md: '# Introducing SWAT


    The Samba team has introduced the Samba Web Administration Tool (SWAT) in the
    Samba 2.0 distribution. SWAT is a Web-based tool that enables you to use your
    Web browser to configure Samba. This tool was introduced during the writing of
    its book. It appears to be a good tool and should only get better with time.


    SWAT uses a specialized version of the httpd daemon to act as the interface to
    your Web browser. When you open SWAT with your browser, the inetd daemon kicks
    off the swat.


    The inetd daemon is used for kicking off other daemons on a per-use basis. The
    inetd.conf configuration file controls the action of inetd.


    Start up your Web browser and enter the http://localhost:901/ URL in the Location
    window. When you are prompted to enter a username and password, enter root as
    the username and the root password. You are then presented with the SWAT interface
    window shown in Figure 8-4.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_217_0.png)


    Figure 8-4: The Samba SWAT window'
