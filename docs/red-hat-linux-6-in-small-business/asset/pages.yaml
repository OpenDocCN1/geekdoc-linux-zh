    # Know your Enemies


    There is a great deal of media hype about computer and network break-ins. The
    problem that you face, now that you are concerned with such issues, is making
    intelligent decisions about who and what the threats are.


    Probably the best place to start is in a neutral position. Don''t view the threat
    as overwhelming or trivial, Many of the crackers out there do not have an intimate
    understanding of computers and the internet protocols. They are referred to as
    scriptkiddies because they make use of readily available scripts and cracking
    tools. This appears to be true because a considerable amount of the the suspicious
    Internet traffic can be deduced from such tools.


    On the other hand, there are enough smart crackers out to worry about. There are
    both individuals and organized groups that make their living that way.'
