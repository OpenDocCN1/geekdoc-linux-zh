  md: '# Starting the Red Hat Installation Process


    You can start the installation process by inserting the boot disk and rebooting
    the PC. The Red Hat installation process starts automatically. The following sections
    correspond to the Red Hat installation steps.


    # Welcome to Red Hat Linux!


    You are presented with a boot: prompt. At this point, if you are experienced with
    Linux you can choose several different operations to perform. They are not within
    the scope of this book but are listed here.


    +   - Expert Mode: Disables automatic probing of hardware — you are then responsible
    for entering the information yourself

    - Rescue Mode: Use with rescue disk to boot your computer

    - Kickstart Mode: Use a script to automate the installation process

    - Kernel Parameter Options: Supplies the kernel with information about unusual
    hardware


    Press the Return key and your computer starts up the Linux operating system. A
    couple of pages of information are displayed. This information shows what Linux
    knows about your computer. For instance, if you look closely you see information
    about your memory, disks and other devices. This information is always displayed
    when you start Linux.


    # Red Hat Linux


    Press any key to continue with the installation.


    # Choose a Language


    Linux is international. Select the language that you wish to use and press return.


    # Keyboard Type


    Select the your keyboard type. (You can modify your selection later by using the
    kbdconfig command.)'
