    # Summary


    This chapter provides you with a basic understanding of how Samba works and how
    to use it. Samba is the system that enables a Linux server to provide the same
    and print services as a Windows NT computer. It mimics the NT server by using
    the same SMB protocol that NT uses. Other Windows computers can access those shares
    without any additional software; Linux and UNIX computers can use those too.


    +   * The Samba system is introduced. The ability to mimic an NT server makes
    a Linux computer into an powerful, inexpensive server. By using Samba you can
    power your business with inexpensive, reliable Linux PCs.


    +   * The heart of Samba is the smbd and nmbd daemons. Smbd transfers the data
    to the SMB clients and nmbd provides the browsing service. They are both controlled
    by the smbd.conf configuration file.


    +   * The Samba configuration file, smbd.conf, is described. It tells smbd and
    nmbd how to behave. You can customize it by hand or use its default configuration
    to access your Linux home directories.


    +   * Password authentication is described. Windows 98 and newer versions of Windows
    NT and Windows 95 use encrypted passwords by default. If you use encrypted passwords,
    Samba still understands plain text passwords.


    +   * Samba provides control over what can read and write to individual shares.
    However, the file permissions on the Linux server always override the Samba permissions.


    +   * There are several utilities that come with the Samba RPM package. They are
    useful for some debugging problems as well as using Samba from other Linux computers.'
