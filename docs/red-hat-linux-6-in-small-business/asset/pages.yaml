    # Modifying the Scripts Manually


    The experienced network administrator can modify any of these configuration files
    or scripts by hand. You can use any text editor described in Chapter 2. Just be
    aware that the scripts and files are often interrelated with each other and modify-
    one another''s behavior. You can view the man pages of these to gain more understanding
    of the services.


    # Network File System


    The Network File System (NFS) is system used to share files and directories across
    a network. It is similar to Samba (as discussed in Chapter 8) in its function.
    However, it is different in the way that it works. Samba is a more complex system
    and must run as a separate process from the kernel. NFS is simpler and is built
    into kernel.


    If you want to share files from one Linux or UNIX computer to another, then NFS
    provides many useful features. Red Hat Linux comes preconfigured to act as an
    NFS client. Please consult the documentation and man pages on NFS for more information.'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# Network Information Service


    The Network Information Service (NIS) provides a mechanism for sharing information
    across a network. You configure one or more Linux or UNIX computers to act as
    NIS servers, but that''s beyond the scope of this book. Other machines can then
    use one common database of user names and passwords from any machine that uses
    NIS.


    NIS, when combined with automounter, can also be used to provide automatic mounting
    file system services. NIS/automounter can be used to mount your home directory,
    for instance, on any NIS machine that you log onto. You can program any file system
    to follow you around as you log onto various machines. Red Hat Linux provides
    this service. Please look on the CD-ROM for the ybind, ypserv and y-tools RPMs
    and the accompanying documentation for more information.


    # Introducing Network Usage and Security Policy


    Every company and organization needs to address the issue of proper network usage
    in a formal way. Your organization needs to prioritize what your network is to
    be used for, and if you use only the single telephone connection to the Internet
    described in Chapter 11, you should probably limit the amount of web browsing
    that your employees can do. You may want to devise a formal document that every
    user system must sign.


    Without a formal use document, you will have very little formal control over what
    your network is used for. Written guidelines can make it much difficult to enforce
    your policies. For instance, if you decide to keep the firewall rules described
    in Chapter 11, which allow web browsing, then you will implicitly allow web browsing.
    However, if you also state formally viewing pornography on company time with company
    equipment is prohibited, then you''ll be able to take action against anyone who
    violates the policy.


    +   - In the formal use policies, you can also control what your users are capable
    of by modifying your company''s server and workstation configurations. For instance,
    if you eliminate NFS from your Linux server, no one will be able to use it (one
    way that you can do that is by removing the NFS RPMs and then stopping any NFS
    daemons with killall -9 nfsd). If you do not intend to use NFS, it also enhances
    your computer and network''s security by running one less service that might be
    used to break into your system.'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# Chapter 7: Managing Your Network


    165


    # Disaster Recovery


    The subject of disaster recovery is an amorphous one. That is because defining
    what and how long it takes to recover from a disaster can mean totally different
    things to different businesses.


    The definition of disaster can vary. For this discussion, disaster means anything
    that prevents your operation from functioning, even in a minimal way. That definition
    includes anything from a fire, earthquake, or flood to a burglary or a security
    breach. Rather than focus on what can cause a disaster, it is better to concentrate
    on how to recover from one.


    Once again, the process of recovery depends on who you are and what you do do.
    An author can recover from disaster by borrowing a friend''s computer or running
    down to the local computer store with credit card in hand (as long as the manuscripts
    are backed up). A medical supply company, on the other hand, must have a completely
    documented recovery plan and all the parts in place.


    Here are some suggestions for those who must be able to recover in a system way:


    +   Decide on the scale of disaster that you want to be ready for. Do you want
    to be able to recover from a local or regional disaster such as an earthquake
    or flood? Or do you want to limit your scope to disasters that affect you and
    your operation, such as fire or vandalism?


    +   Decide on the level of recovery that is right for you. This is an economic
    decision that should match the type of work that you do. Once again, at the low
    end of the scale, the technical writer might only require a word processor to
    start. That word processor can be rebuilt with cheap used equipment for instance,
    and Appliance and Linux can run on an old 486 computer as well. Such equipment
    is available from many sources and can quickly be purchased. However, the small
    retail with point of purchase hardware cannot go to the used computer shop to
    regain its vital equipment. Spare equipment or service contracts with guaranteed
    replacement agreements are required for the latter.


    +   Determine the recovery time frame that matches your company. The catalog or
    financial services company has a different recovery requirement than, say an architectural
    firm. The latter probably depend on spending a weekend, unless in the middle of
    a deadline, while the catalog company must think in terms of minutes or hours
    to recover.


    +   Documentation and training are essential. There is a great deal of room for
    confusion when than one or two people are involved in a recovery. It is essential
    to write down the steps, who is needed during the crisis, and how they can be
    contacted. It''s also essential that everybody involved is aware of the location
    of the documents.'
  merge: -1
  pgno: 192
- img_proc: true
  md: '+   The only way to be sure, or reasonably sure, is to practice. Otherwise,
    you can be sure that your recovery will not go as hoped. Training can be as simple
    as asking people to get you the recovery plan, or as difficult as walking, driving,
    or flying to wherever your recovery site is and loading your backup tapes.


    +   Keep offsite backup clones and make direct copies of your backup tapes. At
    the very least, clone your most essential data. Keep the copies in a different
    location than they are made. The offsite location can be another office, your
    home, a safety deposit box, or anywhere else, as long as it is not connected with
    your everyday system. Match the distance from your primary site by the scope of
    your disaster plan. If you are planning for a fire, then any separate building
    is adequate. If you are planning for an earthquake, then consider any other city
    or state.


    +   Finally, expect the unexpected. Disaster recovery is an inexact science. Be
    ready to think on your feet.


    # # Troubleshooting


    Your network consists of numerous parts. The computers and printers that are connected
    to wires and network equipment all must speak the same language (protocol) to
    communicate. It''s a complex animal.


    When things don''t work right, there are several actions that you should take,
    which are discussed in the following sections.


    # # Make Simple Checks First


    Check for the simple problems first. Make sure that the power is turned on to
    all the devices. Check that the wiring is okay; remember, Thinnet must be terminated
    at both ends and have no breaks in between and Thinnet connectors (BNC) are prone
    to problems if they poorly made or if they get stepped on. Make sure that your
    cables and connectors are in good working order. You can wiggle the cable to attempt
    to fix it. If that doesn''t work, then you can try replacing the cable segment
    with another one.


    # # Check Your Linux Computer


    Once you have checked the obvious, you can check the computers and printers. On
    a Linux computer you should check the following.


    # USING THE PING COMMAND


    Ping yourself. The ping command sends a simple ICMP packet to the logical back
    device—lo—and waits for a response.'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# Chapter 7: Managing Your Network


    On your Linux server, login as root and enter the following command:


    ```

    ping 127.0.0.1

    ```


    You should get the following response:


    ```

    PING 127.0.0.1 (127.0.0.1): 56 data bytes

    64 bytes from 127.0.0.1: icmp_seq=0 ttl=64 time=0.4 ms

    64 bytes from 127.0.0.1: icmp_seq=1 ttl=64 time=0.2 ms

    ```


    The response is continuous, stop it by pressing Ctrl-C. This indicates that your

    basic networking is working.


    Next pinging your Ethernet interface by entering the following command:


    ```

    ping 192.168.1.254

    ```


    You should get a response similar to the previous example. In this case, ping

    sending an ICMP packet to your Ethernet NIC. This is the device that you must
    have

    working in order to communicate with the rest of your LAN.


    If do not get any response to this or the previous ping, then there are several

    possible causes to look at.


    # CHECKING THE NETWORK INTERFACES AND ROUTES


    First, check the status of your network interfaces. In the case of a failed loopback

    device ping, enter the command:


    ```

    ifconfig lo

    ```


    This should give you the following response:


    ```

    lo Link encap:Local Loopback\inet addr:127.0.0.1 Bcast:127.255.255 Mask:255.0.0.0

    UP BROADCAST LOOPBACK RUNNING MTU:3584 Metric:1

    RX packets:55 errors:0 dropped:0 frame:0

    TX packets:55 errors:0 dropped:0 overflows:0 carrier:0 collisions:0

    ```


    The important parts of the response is the inet address on the second line and
    the

    UP flag on the third line. The address (addr) shown here (127.0.0.1) is the cor-

    rect one for a loopback device. The UP flag indicates that the interface is running.

    You can also use the ifconfig command by itself. It will show all of your network

    interfaces. Any interface that it shows automatically means that the interface
    is

    working. Conversely, any interface that you do not see means that it is down.'
  merge: -1
