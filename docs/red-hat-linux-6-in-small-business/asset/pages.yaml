    # Where the Scripts Are


    The Network Configurator GUI modifies the scripts and configuration files that
    actually control Linux networking. However, it''s essential to know where they
    exist and what they do, in order to understand Linux networking.


    When a Linux computer starts up, it executes various scripts that start up services.
    The scripts that execute are determined by the run level set in the'
  merge: -1
