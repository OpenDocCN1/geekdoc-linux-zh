    # Using NMAP to Test Your System


    The Nmap program is a powerful security tool. It can be used for good purposes
    or not. It can be used against you, since it can be obtained off the Internet,
    you should use it to protect your network.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_306_0.png)


    You should not, under any circumstances, use nmap to scan machines you do not
    have or have permission to do so. Using nmap in an unauthorized manner is similar
    to walking up a house and rattling the door. It is okay to test your own door,
    but not someone else''s.


    Nmap does three things: simple and flexible pings, port scans, and computer fingerprinting.
    The functions are as follows:


    +   **Pings.** You can use nmap to see what machines are up on a network. The
    ping program sends out ICMP packets and displays their response. It is a workhorse
    for system administrators who want to see if a network device is alive.


    +   **Port scan.** This is the process where nmap scans tcp, udp and icmp packets
    with various settings are sent to a host or entire network and the response monitored.
    Nmap can determine what ports are available (listening) depending on what the
    response is.


    +   **Fingerprinting.** A variation of the port scan sends out packets of varying
    type and setting. The responses can be correlated to determine what operating
    system is running on the target.


    When you put all three (especially the latter two) functions together, you can
    gather a great deal of intelligence over individual machines and entire network.
    The more that one knows about a network, the more possibilities there are for
    attack. You should know at least as much about your network as an intruder, and
    nmap can help you do that.


    Nmap is a difficult system to master, because it takes a good understanding of
    the underlying TCP/IP protocols to make complete of the information that it can
    give you. The following examples are meant to give you a sense of what nmap can
    do and how to utilize the ping function is useful but is skipped over in this
    discussion for the sake of brevity.'
