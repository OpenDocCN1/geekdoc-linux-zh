  md: '# Chapter 10


    # # Automating Network-wide\ Backups


    IN THIS CHAPTER


    +   - Introducing the advantages of automated, networked based backups

    - Introducing the Arkeia backup software

    - Installing the Arkeia software

    - Configuring Arkeia backups

    - Monitoring your backups

    - Troubleshooting backup problems


    THE PROCESS OF MAKING local backups is introduced in Chapter 6. Making local back-ups
    is a complex process because although the mechanics are important, the human factors
    are even more so. Managing the whole process at the minimum requires a disproportionate
    amount of your time as a reluctant system administrator.


    The solution to your time management problem is an automated, network-based, client-server
    backup system. Until recently such software was either expensive or unavailable
    on Linux. However, there are now companies vying for your business. One such company,
    Knox Software produces a network backup product called Arkeia 4.0. Their system
    works on platforms such as Linux and Windows and is included on the CD-ROM.


    > Another backup system is called BRU2000. It is made by Enhanced Soft-ware Technologies
    and more information about it can be found at: http://www.estinc.com. The taper
    program also provides another backup system, and comes as part of the Red Hat
    distribution.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_234_0.png)'
