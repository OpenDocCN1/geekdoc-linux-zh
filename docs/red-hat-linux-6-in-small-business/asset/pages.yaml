  md: 'together by running a 52ohm cable to each one, but both ends of the segment
    need to be terminated with 52ohm terminators. The disadvantage is that the wiring
    can be unmanageagable once your network grows beyond a dozen or so machines. The
    entire network will be disabled if any of the cables breaks or if either end is
