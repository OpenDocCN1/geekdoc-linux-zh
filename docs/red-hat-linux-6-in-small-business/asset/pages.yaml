    Linux The term Linux refers to the Linux kernel, plus the cooperating daemons
    (processes running constantly in the background that providebasic services), plus
    all of the user commands, plus your computer''s hard disk files.


    man page Manual page. Linux/UNIX provides a simple mechanism for accessing information
    about commands and other system and application information.


    metacharacters Characters that are expanded by a shell or program to another meaning.
