    THE EMPHASIS OF THIS book has been placed on properly building your Linux-based
    network. Linux-based networks are powerful and inexpensive, and you can use one
    to run your business network.

    However, Linux is more than just a server. It can also be used as a general-purpose
    workstation. Products such as Applinux, StarOffice, WordPerfect, and many others,
    provide the personal productivity tools that turn an inexpensive Linux PC into
    your new personal workstation.

    This chapter is intended to give you an introduction to some of the tools that
    are turning Linux into a complete productivity tool.


    # # Introducing Applinux for Linux


    Most of this book was written using the Applinux Words word processor. It is a
    full function what-you-see-is-what-you-get (WYSIWYG) word processor that has most
    of the functionality of Microsoft Word. It has most of the functions that one
    expects – formatting, cutting and pasting, graphics, spell checking and such.
    It also has the advantage of being able to run satisfactorily on less than top-of-the-line
    equipment; it runs under Linux and Linux just does not require as powerful a computer
    as other operating systems.'
