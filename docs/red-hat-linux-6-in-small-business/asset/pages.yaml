  md: '# Part 1: Building and Using a Basic Linux Computer


    TABLE 1–4 SUGGESTED DISK PARTITIONS


    | Partition | Size(1GB disk) | Size(4GB disk) | Function |

    |---|---|---|--|

    | / | 30 | 50 | The root of all mounted file systems. |

    | /boot | 30 | 50 | Stores the kernel and supporting files. |

    | /var | 100 | 200 | Used for temporary files and logs. |

    | /usr | 300 | 400 | Used for static, or mostly static, files and libraries. |

    | /usr/local | 200 | 1000 | Store third party and custom software storage. |

    | /home | 300 | 2000 | User home directories. |

    | swap | Two or 2.5 times the RAM contained in your computer | Two or 2.5 times
    the RAM contained in your computer | Linux is a virtual memory operating system.
    If a process needs to be run but there is not enough memory to fit into it, then
    memory is freed up by moving (swapping) a chunk (page) of data or information
    from memory into the swap file. That chunk can be reloaded into memory |


    You have the choice of using the newer Disk Druid or fdisk. Fdisk is not a difficult
    program to use, but is not discussed here. Select Disk Druid.


    > NOTE If you are installing on a very small disk, 120MB–400MB, then you should
    consider creating just a single partition. The reasoning behind this is that some
    space needs to be left for padding on each file system, and using no more than
    80 percent of any partition is considered good practice. For instance, if you
    divide a 200MB disk into several partitions then you stand a good chance of wasting
    40MB. That much space can easily prevent you from installing all the components
    that you require for your needs.'
