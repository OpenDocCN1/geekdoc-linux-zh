  md: '# Chapter 8


    # Sharing Files and Printers

    with Samba


    IN THIS CHAPTER


    +   - Understanding Samba fundamentals

    - Exploring the Samba Configuration File

    - Understanding Samba permissions

    - Using the Samba utilities

    - Learning Samba by example


    SAMBA is a software suite that speaks the same language as Windows NT. Samba enables
    you to access files and printers on a Linux server directly from Windows computers.
    It reduces or eliminates the need for an NT server and no third party software
    is required by the Windows clients.

    Samba is not installed by default during the Red Hat installation process. You
    can select it for installation during that process, but otherwise you must install
    it manually. Log in as root, mount the CD-ROM, and enter the following command:


    ```

    rpm -ivh /mnt/cdrom/RedHat/RPMS/samba*

    ```


    # Understanding Samba


    Samba consists of several programs that use and understand the Microsoft Session
    Message Block (SMB) protocol; SMB is also referred to as NetBios or LAN Manager.
    That protocol is used by Windows 95, 98, and NT to share and access files and
    printers across a network. Andrew Ridgell reverse engineered the protocol for
    UNIX and Linux systems. Samba is now supported by Ridgell and the Samba Team.
    You can find more information about Samba at http://www.samba.org.

    The heart of the Samba software consists of two daemons-smbd, and nmbd, which
    provides sharing across the network, and browsing. A single configuration file,
    samba.conf, controls the behavior of the'
  merge: -1
  pgno: 200
- img_proc: true
  md: 'system. Several utilities–smbstatus, testparm, testprns, and smbclient–pro-videbleshooting
    and other services.


    The smbmount system provides access to Samba or NT services from a Linux computer.
    The smbmount program comes as part of the smbfs RPM package. It was developed
    and is hosted separately from the Samba project. It enables a Linux machine to
    mount a Samba share.


    # Understanding the Samba Daemons


    A Linux-Samba server needs to respond to file and share requests from net-work
    clients automatically. The monitoring function requires that some process needs
    to be waiting for requests for monitoring services. This job is handled by the
    Samba daemons smbd and nmbd.


    # Samba Shares


    A share, or service, refers to the files, directories, or printers that are physically
    located on the Samba server that can be mounted by a client computer. When a share
    is mounted by a remote client, the files, directories and printers can be used
    as if they were connected directly to that machine.


    # smbd and nmbd


    The smbd and nmbd daemons are the heart of the Samba system. Recall that daeemons
    are processes that run constantly in the background–they don''t need to interact
    with you directly. The smbd and nmbd monitor the network ports that are defined
    in /etc/services files. If you look at that file, you will see the Samba configuration
    information:


    | netbios-ns | 137/tcp | nbns |

    | netbios-ns | 137/udp | nbns |

    | netbios-dgm | 138/tcp | nbdgm |

    | netbios-dgm | 138/udp | nbdgm |

    | netbios-ssn | 139/tcp | nbssn |


    The Internet protocols–referred to in general as TCP/IP–set up a system where
    a port is combined with IP address (for instance, 192.168.1.254 is an IP address)
    to handle networked communication between processes. That convention is used in
    order to allow multiple functions to be processed on one computer or one IP address.


    TCP and UDP refer to the Transmission Control Protocol and User Datagram Protocol
    respectively. TCP makes sure that each packet reaches its destination,'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# Chapter 8: Sharing Files and Printers with Samba


    while UDP passes responsibility to the application program. Applications like
    Netscape Navigator, Telnet, and FTP use TCP. Systems like line lookup and NFS
    use UDP.


    For instance, when you browse the Internet with your Web browser and click http://idbooks.com,
    your Web browser sends IP packets to the ID Books World Wide Web server. The IP
    packets encapsulate TCP packets, which in turn contain the HTTP packets, which
    correspond to port 80. If you look at the /etc/services file again you''ll see
    the line that corresponds to the HTTP service.


    ```

    http 80/tcp # www is used by some broken

    ```


    The Web server listens to TCP port 80, so when it sees your IP packets, it acts
    as is appropriate. If that server is also acting as a Samba server, it is also
    listening to ports 138 and 139 for SMB requests. With this networking model, a
    computer can differentiate between different types of requests and act on them
    accordingly.


    The netbios-ns lines refer to the name service port and is used by nmmbd to share
    browsing to the network. The netbios-dgm line refers to the SMB datagram port
    and is used by smbd to provide the actual files and directories of the Samba shares.


    The smbd and nmmbd daemons handle both TCP- and UDP-based packets. The TCP packets
    provide a virtual connection while there is no guarantee when the UDP packets
    are processed. These packet types are discussed completely in Chapter 7.


    # Starting and Stopping the Daemons


    The start-ups for smbd and nmmbd are installed in the /etc/rc.d directories when
    the Samba package is installed. If you look at the run-level directories (see
    Chapter 6) such as /etc/rc.d/rc3.d and /etc/rc.d/rc5.d, you should see the S91smbd
    -> ../init.d/smbd soft link (which contains the name of another file or directory
    and acts like a pointer). Link points to the /etc/init.d/smbd script, which is
    responsible for starting and stopping the smbd and nmmbd daemons. Depending on
    the level declared in the /etc/inittab file, the system executes each script pointed
    to by the soft links in the run-level directory (for instance, /etc/rc.d/rc5.d)
    during the system boot. S91smbd is executed, which executes the /etc/init.d/smbd
    script that starts the Samba daemons.


    You can use the /etc/init.d/smbd script to manually start and stop the Samba daemons.
    Log in as root and run the following command to stop the Samba daemons:


    ```

    /etc/init.d/smbd stop

    ```


    You can start the daemons after entering:


    ```

    /etc/init.d/smbd start

    ```'
