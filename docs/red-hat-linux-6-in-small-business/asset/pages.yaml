  md: '# Chapter 14: Using Office Productivity Tools


    retallack file. You can read file directly and see that user''s messages; only
    root and the owner have privileges to read the information, however. Once Navigator
    gets your messages, either by clicking the Get button, or by automatically polling
    every few minutes, your email is transferred into the mbox file in your home directory.
    It stays there you delete it or move it into your local imap folders. At that
    point, messages are transferred to files corresponding to your folders in the
    nmail directory in your home directory.


    Back in the Mail Server window, you can click the General tab, and you can configure
    Netscape to save your e-mail password (your username on the Linux e-mail server)
    by pressing the Remember my mail password button. You can also have Netscape check
    your IMAP email poll every r minutes or not. Click OK to exit the Netscape: More
    Mail Server Preferences window. Click OK in the Netscape: Preferences window to
    save your changes.


    You can now receive e-mail whenever your Linux (IMAP) server-loads messages from
    your ISP that are addressed directly to you. You can also receive delivered messages
    as well. All outgoing e-mail is directed to your Linux server and routed to your
    ISP if it is destined for the outside world, and to your local network otherwise.


    # More Linux Applications!


    Please consult the Red Hat home page for information on other Linux applications.
    The address is: http://www.redhat.com/appendix/index.html.


    # Troubleshooting


    The applications used in this chapter are relatively bulletproof. I have not experienced
    any problems except with using PostgreSQL and Appware Data. The troubleshooting
    section for the SQL server connection is a bit more in-depth than the others.
    That is not to say that problems cannot occur. If problems occur that are covered
    here, consult the appropriate documentation.


    # Applixware


    If you able to install Applixware, there are not many problems that can occur.
    The most difficult system to use by far is Applixware Data. See the section "Postgres
    and Applixware Data" for more information on that subject. Otherwise, you should
    not have many problems using the systems. One to keep in mind is that Words can
    not read and write files that it does not have Linux permissions for.'
  merge: -1
