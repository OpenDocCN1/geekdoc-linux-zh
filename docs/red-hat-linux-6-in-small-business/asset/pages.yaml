- img_proc: true
  md: '+   Configuring a simple filtering firewall is described. A basic set of iptchains
    rules are described so that you can interactively experiment with them. By getting
    a feel for how the system works you can better install and manage the full rule
    set.


    +   A description of a full ruling set is described. It is displayed in the text
    but also stored on the companion CD-ROM. The rule set provides a template that
    allows the major protocols (such as www and FTP) to work through your firewall.
    You can modify the script to allow other protocols through your firewall as desired.


    +   The process of checking your log files is discussed. Log files you provide
    with the history of your system. By studying them, you can discover problems and
    possible break-ins before they progress to far.


    +   The nmap system is described. Nmap is a powerful tool that can be used to
    port scan networks. Port scanning can mine information about your computers and
    network. The information can be used against you. By proactively scanning your
    own network and computers (and nobody else''s), you can take a big step towards
    short-circuiting the bad guys.


    +   The Tripwire utility is introduced. It creates signatures (or fingerprints)
    for any file or system that you want. The signatures can be stored on read-only
    media to provide a means of checking your files for unauthorized access or modification.


    +   The crack program is introduced. It checks your encrypted passwords against
    any word or phrase that can be contained in a dictionary (you must have the dictionary
    of course). By regularly checking your passwords you can proactively find and
    eliminate ones that do not meet your specifications.


    +   If you educate yourself on the ever changing Internet hazards, then you have
    a chance of staying ahead of the threats. Managing and using firewalls is a process
    that includes education as well as tools. There are many resources available on
    the Internet as well as traditional sources such as schools and seminars.'
