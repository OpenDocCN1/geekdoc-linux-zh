    # Understanding IP masquerading


    Using IP masquerading is an elegant method for attaching your network to the Internet.
    IP masquerading (also call Network Address Translation, or NAT) converts an IP
    source address into another address. In this example, the source addresses of
    packets originating from within the private network get converted into the source'
