  md: '# Chapter 1: Installing Red Hat Linux


    # Probing Result


    Red Hat probes your hardware and tries to find a mouse. If one is found, then
    a dialog box is displayed showing what port the mouse was found on. If one is
    not found, and you have a mouse attached, don''t worry because you can enter the
    information manually in the next step.


    # Configure Mouse


    Select the type of mouse that you have. If you don''t know, then use your best
    judgement and make a guess. Keep in mind that you can reconfigure the mouse by
    running the mouseconfig program after the installation is complete.


    # Mouse Port


    If you have a serial mouse, then you are prompted to enter the device file that
    controls it. For instance, if your mouse is connected to the first serial port
    (COM1: under DOS), then you should choose /dev/ttyS0.


    # Network Configuration


    If you are, or expect to be connected to a network then choose Yes. But, you need
    to have an Ethernet adapter installed in your computer. If you don''t have one
    installed, you can setup networking later using Network Configuration tool.


    # Boot Protocol


    This book uses static IP addresses. Static addresses are assigned once (although
    they can be changed at any time by editing the appropriate configuration files
    or by using the Network Configurator described in Chapter 12) and do not change
    when you reboot the computer. Select this Static IP address option.


    However, you can have another computer dynamically assign an IP address every
    time it boots. Choose the Bootp or DHCP option if you want, and know how, to use
    that option.


    # Load Module


    Remember that Red Hat Linux uses loadable modules to support various pieces of
    hardware. A loadable module is analogous to a Windows/DOS driver and is the software
    that allows the Linux kernel to interact with and understand hardware like Ethernet
    NICs. In this step you need to tell the installation program which Ethernet adapter
    you have installed.


    Select the manufacturer and model of the NIC.'
  merge: -1
