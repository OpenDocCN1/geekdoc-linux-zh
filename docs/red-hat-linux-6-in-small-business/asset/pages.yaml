    # Using a SCSI Tape Drive or Tape Library


    To make better use of this backup system, you are most likely going to need a
    device(s) capable of storing gigabytes of information. The most common media is
    a DAT drive. They are briefly discussed in Chapter 6.


    This book does not describe the process of using a DAT drive, or a real tape library,
