  md: '# Chapter 6: Administering Your Linux Server 117


    need to backup its individual machines, using separate backups does not work well
    in the long term.


    To perform a local backup you need a storage device. If you are an author and
    are writing a medium-sized book, you may not need much more than a floppy disk
    or two to backup your manuscript. If you are running a sole proprietorship, a
    ZIP (100MB), Jaz (1GB) drive, or even a writable CD-ROM could fit the bill. However,
    once your data grows above a 100MB (or 1GB if you use a Jaz drive) or so, then
    you need to graduate to a Digital Audio Tape (DAT) device.


    Typically, tape drives are used because they have a reasonable amount of storage
    and are reasonably inexpensive. A 4mm DAT drive typically stores between 2 to
    5GB of data. If you go to 8mm DAT drive then those numbers increase somewhat.


    This book focuses on an IDE based ZIP drive; a device which is connected to the
    hard disk controller just like a hard drive or an ATAPI CD-ROM drive. They are
    inexpensive (approximately $100), reasonably reliable, and store enough data for
    a small operation (100MB). They are also much easier to install and configure
    than the most robust DAT drives.


    # USING TAR TO SAVE TO A DAT


    There are several commands that you can use to perform the backups. One of the
    most popular (and oldest) mechanisms is the Tape Archive (tar) program. It''s
    flexible, nearly universal among Linux/Unix systems, and it works quite well.
    Before practicing a backup to tape, try the following command:


    ```

    tar cvf etc.tar /etc

    ```


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_144_0.png)'
