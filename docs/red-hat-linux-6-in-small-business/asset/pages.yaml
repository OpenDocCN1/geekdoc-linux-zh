  md: '# 90 Part 1: Building and Using a Basic Linux Computer


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_117_0.png)


    The terminology is somewhat confusing because the term server generally implies
    a computer that runs services for you while you are its client. In the case of
    X, the term X Server defines the software that takes care of displaying the graphical
    information generated by the X Client. Thus, when you start up X (literally the
    program `/usr/bin/X11/X`) you are starting up the X Server. The programs you run
    are all clients of that server.


    You need to give permission to the X Clients to display on your X Server, so from
    a command line run the following program:


    ```

    xhost +

    ```


    This gives permission to any X Client on any network that has access to your X
    Server to display on your computer. This can be a security hazard so in the future
    use the more specific command like `xhost +somehost` to allow specific hosts or
    networks display access. Please refer to the man page for `xhost` for more information.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_117_1.png)


    > Using xhost can still present a security problem if you are displaying sensitive
    information on a computer that is used by multiple people. That is because any
    user who can log onto that computer can connect to the X server. On the other
    hand, if you are the only person to work on a computer (your personal workstation,
    for instance) then using `xhost` should not be a problem. However, if you are
    sharing a computer with others and work with sensitive information, use the `xauth`
    program rather than `xhost`. Please consult the `xauth` man page for more help.


    Next, from a command line on your computer display the simple graphical clock
    by entering the command:


    ```

    xclock -display :0

    ```


    You should see the clock displayed. You''ve now allowed X client access to your
    local display and have run the X Client and told it to send its display to your
    local X Server. The :0 stands for the first display at the default network location.'
  merge: -1
  pgno: 117
