  md: '# Chapter 15


    # Configuring an Intranet Web Server


    IN THIS CHAPTER


    +   * Introducing the HTTP protocol

    * Introducing the Apache Web server

    * Installing Apache

    * Creating a simple Intranet Web page

    * Adding information to the simple Web page

    * Accessing SWAT via your Web page

    * Securing your Intranet Web page


    # Introducing the patchy Web server.


    Apache stands for a patch server. It was based on both existing software and a
    series of patch files (see the FAQ for the explanation) and thus got the name.
    It is part of the Red Hat distribution in RPM format. Most of the world''s Web
    servers use Apache. The heart of Apache is the HTTP daemon, which runs in the
    background and listens on port 80 for HTTP packets.


    The HTTP protocol defines how Web browsing works. When httpd receives a HTTP packet,
    it tries to interpret the packet. If successful, it looks by default to the `/home/httpd/html`
    directory. You can create `Hypertext Markup Language (HTML)` files and store them
    in the `/home/httpd/html` directory. httpd will then interact with those files,
    and display the information contained in them.'
  merge: -1
  pgno: 358
