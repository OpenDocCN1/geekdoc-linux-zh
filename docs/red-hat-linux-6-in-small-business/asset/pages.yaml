  md: 'For example, if Samba allows a file to be written to, but Linux does not, then
    that file can not be written to. The same is true for directories. Linux permissions
    take precedence over Samba permissions.


    # Using the Samba Utilities


    There are several utilities that provide access to Samba shares and also debugging
    and testing capabilities: smbfs; smclient; nmblookup, testparm, and testprns;
    and smbount.


    # smbstatus


    The smbstatus utility shows the status of the Samba smbd daemon. It also shows
    any shares that are currently being used. Log in as root and run the smbstatus
    program. You should see this response:


    ```

    Couldn''t open status file /var/lock/samba/STATUS..LOCK

    ```


    That response indicates that the Samba lock has not been created. That file is
    not created when Samba is installed via RPM. Create it by entering the command:


    ```

    touch /var/lock/samba/STATUS..LOCK

    ```


    Run the smbstatus command and you should get the following response:


    ```

    Samba version 1.9.18p10

    Service uid pid machine

    No locked files

    Share mode memory usage (bytes):

    102232(99%) free + 112(0%) used + 56(0%) overhead = 102400(100%)

    total

    ```


    That response shows that Samba is running but no shares are being accessed. It
    also shows information on memory usage.


    # smclient


    The smbclient program provides a way to access Samba shares directly from your
    Linux server. Any Linux computer can use it to access the Samba shares from across
    a network too. Log in as root and enter the command:


    ```

    smclient //chivas/root /mnt -c chivas -U root

    ```'
