    use a class C address like the public 192.168.1.nnn (where nnn is any number between
    1 and 254) that is used in this, the netmask sets itself to correct 255.255.255.0
    value. There is no reason that a small business or organization should use anything
    but a class C network address.


    > IP addresses are divided into three classes: A, B, and C. The classes define
    which parts of the network address correspond to the network, and which to the
    local host. Each of the four parts of a network address (separated by the periods)
    represents eight bits. Class A address uses the first eight bits for the network
    address, leaving the last 24 bits for the local hosts, which means you can define
    up to 16 million host addresses. Class B divides the 32 bits in half, leaving
    16 bits for the local hosts, or up to 65 thousand host addresses. Finally, class
    C addresses use only the last 8 bits for the local hosts, which means you can
    define up to 254 hosts. Class C dominates the landscape today and the small network
    will never need to use anything else. It is nearly impossible to have the InterNIC
    assign any other class today anymore.


