  md: '# Glossary


    mirror A mirror is a Internet connected computer that maintains a copy of the
    site''s files. For instance, since Red Hat''s ftp.redhat.com download site is
    often too busy to allow new connection but numerous copies (mirrors) of that site
    are maintained to provide alternative download locations.


    mounting The process where the Linux kernel is made aware of where it can access
    that particular file system. Under Windows/DOS the partition is intrinsically
    linked to the operating system.


    multitasking An operating system such as Linux allows more than one process (program)
    to run at the same time.


    multiuser An operating system such as Linux that allows more than one person to
    be logged on at the same time.


    NFS Network File System. A system used for sharing files and directories across
    a network.


    NIC Network Interface Card. The physical device that connects the external network
    to a network device (for instance, a computer).


    NIS Network Information Service. A mechanism that shares system services among
    machines on a network. For instance, a single password data can be shared among
    computers on a network.


    Operating System The software that creates an interface between a computer''s
    hardware and the human operator/user.


    permissions Under Linux/Unix every file and directory has attributes that limit
    access. There are three sets of permission: owner, group, and other (everyone).
    The types of permissions are read, write, and execute.


    pipe A system for transferring information from one process to another.


    PPP Point-to-Point Protocol. Encapsulates IP packets for transport over a communication
    channel. This typically means a telephone connection and the protocol that this
    book uses to connect a private network to the Internet.


    public IP addresses Ranges of IP addresses that are set aside by the InterNIC
    for public use. These addresses are specified not to be routed by the Internet
    and are, safe to use on your own network.


    RAM Random Access Memory. It is often referred to as memory. Used to store bytes
    of information electronically. It is much faster than hard disk storage but also
    expensive.'
