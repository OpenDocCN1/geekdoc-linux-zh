- img_proc: true
  md: 'The following lists the some of the more oft-used ipchains parameters.


    +   - p Set the protocol (for instance, tcp, udp, icmp) for the rule or packet
    to check. The rules in a chain only apply to packets that match the protocols.
    The available protocols can be found in the /etc/protocols file.


    +   - s Source address to check packets against. Every IP packet has a source
    and destination address; they also have a corresponding source and destination
    port. Any packet with a source address that matches an ipchains rule is then checked
    against the rule to determine whether it passes through the firewall or not.


    +   - d Destination address to check packets against. Every IP packet has a source
    and destination address, as well as a corresponding source and destination port.
    Any packet with destination address that matches an ipchains rule is then checked
    against the rule to determine whether it passes through the firewall or not.


    +   - i Interface name to peg a chain against. You can optionally specify an interface
    to configure rules.


    +   - h Display a help screen.


    # SETUP INPUT AND OUTPUT TCP RULES


    The rules set your firewall to allow you to browse the World Wide Web.


    ```

    ipchains -A output -p TCP -j ACCEPT -i ppp0 -d 0.0.0.0/0 www

    ipchains -A input -p TCP -j ACCEPT -i ppp0 ! -y -s 0.0.0.0/0 www

    ```


    +   - The destination and source addresses — 0.0.0.0/0 — indicates the entire
    Internet addresses space


    +   - The first command sets up a filter that allows only TCP packets originating
    from the PPP connection (within the Linux gateway atlas) to go out to any location.


    +   - The second command allows only the return packets from connections that
    originate from within the private network by using the ! -y parameter. For instance,
    if you Telnet to an external computer, every outgoing Telnet packet that you send
    a response to come back to you. That response packet has its SYN (for synchronize)
    flag set. Thus, with this filter rule set only the return packets can get through
    the firewall. It is highly unlikely that any bad guy can take advantage of this
    arrangement.'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# Chapter 12: Creating a Simple Firewall


    Note that these rules apply to your first PPP (-i ppp0) network interfaces and
    will act on network traffic to and from your Linux server via the Internet. You
    can apply iptables rules to any network interface using the -i parameter. For
    instance, apply rules to the first Ethernet interface you should use the option
    -i eth0. If you omit the -i parameter, then the rules will apply to all network
    interfaces.


    # SETUP INPUT AND OUTPUT UDP RULES


    The following rules configure the firewall to allow DNS queries to go out to the
    Internet and the response to come back in. DNS uses UDP and is identified as the
    domain service.


    ```

    ipchains -A output -p UDP -j ACCEPT -i ppp0 -d 0.0.0.0/0 domain

    ipchains -A input -p UDP -j ACCEPT -i ppp0 -s 0.0.0.0/0 domain

    ```


    UDP is a simpler protocol than TCP so there is less configuration required.

    Outgoing UDP packets


    +   - The first rule specifies that UDP packets of the type domain can leave the
    firewall and go anywhere. This rule allows you to access external DNS services.

    - The second rule allows the return UDP domain packets from anywhere to come back
    with the DNS information.


    The following lists are some of the more widely used iptchains options.


    +   - -b Forces a rule to work in both directions. For example, the previous examples
    two rules for the UDP protocol could be replaced by one rule. This does not work
    if you wish to limit incoming packets with the SYN (! -y) parameter.

    - -v Verbose. By using this option with the -L list command, more information
    about each chain is displayed.

    - -n Numeric output. Display IP numbers instead of names.

    - ! y Only allow packets with their SYN bit set through. Typically for limiting
    network traffic to only the return packets of existing, outgoing connections.'
