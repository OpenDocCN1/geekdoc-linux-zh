  md: '# Part III: Connecting Your Network to the Internet


    Click OK and try to send yourself some e-mail. You should be able to click the
    Get messages button and receive your e-mail.


    The caveat to this method is that each user on your network will need an e-mail
    address provided by your ISP. That typically costs some money, not much, and is
    quite reasonable for even the smallest business. Also, all of your e-mail is queued
    by your ISP, you will have to have a PPP connection activated in order to access
    it. So if users on your Private Network want to communicate with each other, then
    they all have to go out to the ISP to do so. This is probably not a problem until
    your operation grows beyond a dozen people or so.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_321_0.png)


    Another advantage to this method is that you can retrieve e-mail from any location.
    As long as you have a way to connect to your ISP, then you can retrieve your e-mail.
    For instance, if you have a lap top with a modem, then you can configure it to
    retrieve your e-mail and all you have to do is dial your ISP and get it.


    Even if you have a lot of e-mail traffic this method might still make sense as
    long as you have a fast connection to your ISP. For instance, if you have a T1
    (Mbps), then you will likely not have any problems. However, if you little modem
    has to manage megabytes of e-mail traffic every day, then you need either a bigger
    Internet pipe or you need to reduce the load by keeping local traffic within your
    network. The next section, “Configuring a Local E-mail Server,” describes that
    process.


    # Configuring a Local E-mail Server


    If you have a significant amount of e-mail traffic (especially local traffic)
    then using your ISP as your e-mail server might not be practical. This section
    describes a hybrid system whose Linux Internet gateway, or atlas, acts as the
    local e-mail server using the sendmail, fetchmail, and imaju software. E-mail
    destined for locations outside of your network is forwarded to your ISP. Incoming
    e-mail traffic is retrieved from your ISP via fetchmail. Fetchmail feeds the e-mails
    to sendmail, which distributes it to the rest of the network. Figure 13-3 shows
    the configuration of the local e-mail system. The Linux IMAP server cemetery downloads
    all e-mail from the ISP’s mail server. The local workstations send and receive
    e-mail via atlas.'
