    # Understanding Authentication


    The version of Samba that comes with the Red Hat distribution on the CD-ROM accompanying
    this book understands both plain-text and encrypted passwords. However, you must
    configure Samba to accept encrypted passwords. The later versions of Windows 95,
    most versions of Windows NT 4.0 with Service Pack 3 (SP3) or higher, and all versions
    of Windows 98 use encrypted passwords.


    If you want to use plain-text passwords, you can turn off encrypted password by
    modifying the Windows Registry. By Regedit (or a similar registry editing utility)
    and go to HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\VxD\VNETSETUP key,
    where the DWORD named EnablePlainTextPassword value of 1. Your Windows computer
    should now use a plain-text password.


    > Modifying the Windows Registry is a potentially dangerous operation. If you
    misconfigure it, you can render your computer unusable.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_205_0.png)


    You can set up Samba to use encrypted passwords by either pointing to a Windows
    NT domain controller or by using its own encrypted password database. The following
    sections describe how to configure Samba using both methods.


    # Configuring Samba to Use Encrypted Passwords


    To make Samba understand encrypted passwords, you must modify the smb.conf file
    and create an smbpasswd file. First, edit the /etc/smb.conf file, and make sure
    the security setting reads security = user. Next, uncomment the following two
    lines:


    ```

    encrypt passwords = yes

    smb password file = /etc/smbpasswd

    ```


    Next, create the smbpasswd file from your /etc/passwd file by running the following
    command:


    ```

    cat /etc/passwd | mksmbpasswd.sh > /etc/smbpasswd

    ```'
