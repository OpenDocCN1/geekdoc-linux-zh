  md: '# VI MODES


    At any time, vi is in one of its two modes of operation. These modes are command
    mode and insert mode. When you start vi, it enters command mode. Most of the standard
    keys on your keyboard won''t add text; they perform editing functions.


    Why modes? Working with modes can actually be very efficient. Consider all the
    keystrokes you had to type in joe. There was Ctrl-then that and Esc-something
    else. With vi, when you''re in command mode, most of the commands are one keystroke.
    Also in vi, case matters. Typing a and A in command mode does two different things.


    # SWITCHING MODES


    To go from command to insert mode enter one of the commands shown in Table 3-1.


    Table 3-1 COMMAND TO INSERT MODE COMMANDS


    | Command | What It Does |

    |--- |--- |

    | i | begins inserting text at the current cursor location |

    | I | begins inserting text at the beginning of the current line |

    | o | inserts a blank line below the current line |

    | 0 | inserts a blank line above the current line |

    | a | begins inserting text after the current cursor location |

    | A | begins inserting text after the last character in the current line |


    Once you hit the keystroke one of those commands, you can begin typing and entering
    text. You have made the transition from command to insert mode. To return to command
    mode, hit the Esc key. In fact, if you''re not sure what mode you''re in, you
    can press the Esc key. If you''re in insert mode, it will switch to command mode.
    If you''re already in command mode, vi will beep at you, but there''s no harm
    done.


    # Navigating the Screen


    While you''re in insert mode, you can use the arrow keys to move around, and the
    PageUp and PageDown work predictably. While in command mode, you can move around
    and your hands never have to leave the alpha keys on the keyboard. Look at the
    Table 3-2 for a list of navigation keys.'
  merge: -1
  pgno: 100
