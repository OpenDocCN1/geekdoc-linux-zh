  \n## 理解 Linux 如何存储文件\n\n下一节介绍 `ln` 或 `link` 命令。然而，在我们查看链接如何工作之前，我们首先需要简单了解 Linux\
  \ 如何在计算机上存储文件。在第 1 章“关于命令行的知识”中，有一个标题为“一切皆文件”的章节，这仍然是正确的。但让我们把它变得复杂一点。\n\n一切皆文件，但什么让文件成为文件？我意识到这开始变得本体论了，但请跟我坚持下去。事实证明，你所看到的文件实际上是指向\
  \ `inode` 的指针：这是一种数据结构，存储了物理数据实际位于计算机上的何处的信息，以及关于这些数据的元数据，例如文件类型、大小、修改时间、所有者、权限等（更多信息请参阅第\
  \ 2 章“导航你的文件系统”和[第 8 章“所有权和权限”）。\n\n当你创建一个文件时，文件系统会为它分配一个唯一的 inode 号，你也会为它分配一个名称，两者都存储在驱动器上的\
  \ inode 表中。通过名称引用文件，Linux 使用该名称查找与之关联的 inode；一旦 Linux 拥有了存储在 inode 中的信息，它就可以对文件进行操作。\n\
  \n如果你想查看与文件关联的 inode 号，请使用 `ls -i` 命令：\n\n```bash\n$ ls -i\n49889 backup_daily.sh\n\
  49796 dotfiles/\n49795 dotfiles.sh\n49886 extra/\n49291 wp_upgrade.sh\n```\n\n看到文件和目录左侧的数字了吗？那些就是\
  \ inode 号。注意目录也有 inode 号。为什么？在[第 1 章中，我告诉过：“但是目录呢？它也是一个文件——一种包含其他文件信息的特殊文件。”现在你知道那真正意味着什么了：目录或文件夹是一个文件（拥有自己的\
  \ inode），它将内部的文件与其对应的 inode 关联起来。\n\n\n\n\n大多数文件系统都会创建固定数量的 inode，因此从理论上来说，你可能拥有大量的磁盘空间，但因为\
  \ inode 耗尽而导致无法创建任何新文件（这极罕见，但确实如此，我曾遇到过一次）。如果你想了解更多关于你的文件系统有多少个 inode 以及还剩多少，可以使用第\
  \ 13 章中的“监控系统资源”部分提到的 `df` 命令，但要加上 `-h`（人类可读）和 `-i`（或 `--inodes`）选项，你将看到如下内容：\n\n\
  点击此处查看代码图像\n\n## df -h\n\n```\nFilesystem    Size  Used Avail Use% Mounted on\n\
  /dev/sda      4.9G  742M  4.1G  16% /\nnone          396M  308K  395M   1% /run\n\
  /dev/sdb      42G   33G  8.8G  79% /var\n```\n\n$ df -i\n\n```\nFilesystem    Inodes\
  \  IUsed    IFree IUse% Mounted on\n/dev/sda      327680  40627  287053   13% /\n\
  none          505701     826  504875    1% /run\n/dev/sdb    2785280 706754 2078526\
  \   26% /var\n```\n\n例如，你可以看到 `/var` 使用了它 79% 的空间，但只用了它 26% 的可用 inode。需要创建大量小文件吗？尽管去吧！\n\
  \n既然你已经了解了 inode 是什么，让我们继续学习 `ln` 命令。\n\n## 创建指向另一个文件或目录的链接\n\n### ln\n\n有时候，如果同一个文件能同时存在于两个或多个地方，或者有多种方法可以引用一个文件或目录，将会很方便。当你这样做时，就会使用\
  \ `ln` 命令，它是 *link*（链接）的缩写。\n\n链接有两种类型：*硬链接*（默认类型）和*软链接*（你可能会发现自己最常用的是这种）。正如你将要看到的，它们之间其实非常不同。\n\
  \n如果你还没有读过，请去读上一节，因为你需要知道 inode 是什么才能理解这一节。我等你一下……噢，你回来了？既然我们已经了解了 inode 及其它们为什么重要，让我们来看硬链接的一些特性。要创建一个硬链接，你使用\
  \ `ln original-file link-name`，但但这仅仅是个开始。\n\n点击此处查看代码图像\n\n$ ls -l\n\n```\ndrwxr-xr-x\
  \ 2 root root 4096 melville/\n-rw-r--r-- 1 root root   16 moby_dick.txt\n```\n\n\
  $ cat moby_dick.txt\n\n```\nCall my Ishmael\n```\n\n$ ln moby_dick.txt white_whale.txt\n\
  \n$ ls -l\n\n```\ndrwxr-xr-x 2 root root 4096 melville/\n-rw-r--r-- 2 root root\
  \   16 moby_dick.txt\n-rw-r--r-- 2 root root   16 white_whale.txt\n```\n\n$ ls -i\n\
  \n```\n4096 melville/\n25689 moby_dick.txt\n25689 white_whale.txt\n```\n\n$ cat\
  \ white_whale.txt\n\n```\nCall my Ishmael\n```\n\n首先，我们有一个名为 `melville` 的目录和一个名为\
  \ `moby_dick.txt` 的文本文件，里面包含“Call my Ishmael”这几个字（我知道，我知道……冷静点，*白鲸记*的读者们）。接，我使用\
  \ `ln` 命令，首先是我们要链接来源的文件，然后是硬链接的名称。注意，当我再次运行 `ls -l` 时，文件和硬链接的大小完全相同；同时注意，第一次 `ls`\
  \ 结果中 `moby_dick.txt` 的数字 `1` 变成了第二次 `ls` 结果中的数字 `2`。为什么？因为那个数字显示了该文件有多少个硬链接（那个数字与目录和\
  \ inode 无关，因为正如我在第 2 章中提到的，在目录的情况下，那个数字告诉你有多少个子目录）。`1` 表示该文件存在，因为文件和其 inode 之间至少存在*一个*链接。当你创建一个新的硬链接时，数字会加\
  \ `1`，当你删除一个链接时，数字会减 `1`。事实上，这就是下一节中引入的 `rm` 命令真正的作用：它切断了文件和其 inode 之间的链接；当数字减到\
  \ `1`且你 `rm` 文件时，它才最终消失了。\n\n### 注意\n移除链接的另一种方法是通过 `unlink` 命令：`unlink moby_dick.txt`。移除链接的另一种方法是通过\
  \ `unlink` 命令：`unlink moby_dick.txt`。这就是 `rm` 命令真正的作用：它切断了文件和其 inode 之间的链接；当数字减到\
