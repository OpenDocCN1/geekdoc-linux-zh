  \n当你年轻时，你学习数字，之后你学习如何组合它们。一旦你会组合数字，你就可以组合命令。在本节中，你将学习如何组合完成复杂任务。\n\n### 顺序执行命令\n\
  \n组合命令的最简单方法是让它们一个接一个运行。你可以通过简单的输入它们来实现，但你也会学习如何在单行内组合它们。\n\n如果你想找到一个命令的所有位置（就像你使用\
