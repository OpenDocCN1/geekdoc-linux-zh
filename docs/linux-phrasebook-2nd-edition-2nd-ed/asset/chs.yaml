  \ `du` (****d**isk **u**sage)\n\n请在你的计算机上练习这些命令，并且不要忘记阅读每个命令的 man pages（帮助手册），因为本章只能涵盖它们功能的一小部分。其中几个命令有许多选项——特别是\
  \ `ps`、`top` 和 `lsof`——它们允许你对所监控的计算机进行一些真正惊叹的侦查工作。\n\n## 14. 安装软件\n\nLinux 发行版默认包含成千上万个优秀的软件包。在完成基础安装后，你就可以浏览网页、编写报告、创建电子表格、查看和处理图像以及听音乐。尽管有了如此大量的软件，你仍然可能想要添加偶然遇到的新工具。幸运的是，Linux\
  \ 让在计算机上安装新软件变得简单。\n\n关于 Linux 的传统观念认为你必须编译任何想要安装的软件。如果你喜欢，仍然可以这样做（许多人确实这样做），但现在这很少必要了。相反，你可以使用一些简单的工具快速地安装成千上万软件包中的任何一个。\n\
  \n在继续之前，你需要理解一点重要的事情。在 Linux 世界中，软件包有多种格式，其中两种占据主导地位：RPM 和 DEB（不出意外，这正是我们在本章将介绍的两种）。RPM\
  \ 用于 Red Hat（事实上，RPM 代表 *Red Hat Package Manager*，即红帽包管理器）、Fedora Core、SUSE 以及其他基于\
  \ RPM 的发行版。DEB 则用于基于 Debian 的发行版，例如 Debian 本身、Ubuntu 及其许多衍生版本、Linux Mint、Knoppix\
  \ 等许多其他版本。你应该了解这两种的工作原理，但要重点关注与你的发行版匹配的系统。\n\n事实上，在整个章节中，我会对章节进行标记，以便让你知道讨论的是哪种包格式：(RPM)\
  \ 代表基于 RPM 的发行版，(DEB) 代表基于 Debian 的发行版。而且，为了确保你不会混淆，我现在就告诉你：如果你看到 RPM、YUM 或 APT，我指的是包管理系统；但如果你看到\
  \ `rpm`、`yum` 或 `apt`，我指的是实际命令。\n\n* *\n\n> 提示：要对各种包管理系统以及使用它们的发行版进行详细分类，请参阅 DistroWatch\
  \ 的“包管理快速查表”，地址：[`distrowatch.com/dwres.php?resource=package-management`](http://distrowatch.com/dwres.php?resource=package-management)。\n\
  \n* * *\n\n## 安装软件包 (RPM)\n\n```\nrpm -ihv [package]\nrpm -Uhv [package]\n```\n\n\
  `rpm` 命令用于以 `.rpm` 结尾的软件安装程序，这看起来完全符合逻辑。要安装一个 RPM 包，你首先需要下载它。让我们以行业标准的开源网络端口扫描器\
  \ `nmap` 作为示例。你可以从 [www.insecure.org/nmap/download.html](http://www.insecure.org/nmap/download.html)\
  \ 下载 `nmap` 的 RPM 包；在它进入你的系统后，你只需运行 `rpm` 并带有三个选项：`-i`（用于 *install* 安装）、`-h`（显示哈希标记以便观察安装进度）以及\
  \ `-v`（详细模式，告诉我在做什么做什么）。该命令必须以 root 权限运行（或者如果你的发行版支持，则使用 `sudo`；更多细节请参阅本章稍后的“[安装软件包\
  \ (DEB)part0028.html_ch14lev1sec7)”章节），其格式如下：\n\n```\nrpm -ihv nmap-6.40-4.el7.x86_64.rpm\n\
  ```\n\n然而，这实际上*不是*你应该运行的命令。更好的选项组合是 `-Uhv`，其中 `-U` 代表 *upgrade*（升级）。为什么 `-U` 比 `-i`\
  \ 更好？因为 `-i` 只安装，而 `-U` 会升级*并*安装。如果系统中已经存在该软件包，而你正尝试在机器上放置一个新版本，`-U` 会执行升级；如果系统中不存在该软件包，`-U`\
  \ 会注意到这一点并转而安装它。因此，始终使用 `-U` 即可，无论你是在升级还是安装都没有关系：`-U` 会完成需要的工作，你无需担心。\n\n```\nrpm\
  \ -Uhv nmap-6.40-4.el7.x86_64.rpm\nPreparing...             ######################\
  \ [100%]\nUpdating / installing...\n  1:nmap-2:6.40-4.el7 ######################\
  \ [100%]\n```\n\n如果你想安装多个包，用空格将它们列出：\n\n```\nrpm -ihv package1 package2\n```\n\n\
  如果你有很多 RPM 包，也可以使用通配符。例如，如果你在子目录中有多个包，只需运行：\n\n```\nrpm -Uhv software/*\n```\n\n\
  * *\n\n> 注意：`-U` 选项总是比 `-i` 好，*除非*在安装内核时。那种情况下你想使用 `-i`。\n\n* * *\n\n## 移除软件包 (RPM)\n\
  \n```\nrpm -e [package]\n```\n\n移除已安装的 RPM 比安装它们容易得多。与其使用 `-Uhv` 将 RPM 放入系统，不如使用\
  \ `-e`（用于 *erase*，删除）来移除它们：\n\n```\nrpm -e nmap\n```\n\n就是这样。`-e` 选项是静默的，所以没有输出。但注意，当你移除软件时指定的是软件包名称，因为文件已经消失了。\n\
  \n* * *\n\n> 注意：如果你想找出系统中安装哪些软件包以及 RPM 如何识别它们，请使用 `rpm -qa`。注意，除了包名，你还能获得版本号，这可能有用。\n\
  \n* * *\n\n## 安装软件包及依赖 (RPM)\n\n```\nyum install [package]\n```\n\n`rpm` 命令非常强大，但当你使用一段时间后，在尝试安装具有依赖关系的软件包时，很快就会遇到问题。为了安装软件包\
  \ A，你还需要下载并安装包 B 和 C，但为了安装 C，你还需要下载并安装包 D 和 E，但为了安装 E……啊！你陷入了依赖地狱！\n\n基于 Debian\
  \ 的发行版（你将在本章后面的部分介绍）多年前就用强大的 APT 解决了这个问题。基于 RPM 的发行版可以使用 APT，但更常用的是 `yum` 命令。`yum`\
  \ 最初是为基于 RPM 的 Yellow Dog 发行版开发的（因此才有了这个名字，代表 *Yellow Dog Updater, Modified*），现在已被广泛使用。\n\
  \n`yum` 命令通过作为 RPM 的封装器来安装、升级和卸载软件包。此外，YUM 会自动为你处理依赖关系。例如，如果你正尝试安装引言部分示例中的软件包 A，YUM\
  \ 会为你下载并安装 A、B 和 C。稍后，如果你决定系统不再需要 A，YUM 可以为你卸载它，连同 B 和 C，只要没有其他软件包需要它们即可。\n\n\n\n\
  \nYUM 最终会被 DNF 取代……也许可能吧。DNF 代表 Dandified Yum（增强版 Yum），它的设计旨在成为一个更好的 YUM，特别是在性能方面。在我写这几文字时（2015\
  \ 年夏天），Fedora 是唯一一个切换到 DNF 的主流发行版。其他发行版会跟进吗？我们拭目以待。如果他们这样做，我将在本书的第三版中介绍 DNF。在此之前，你可以访问\
  \ [`dnf.baseurl.org`](http://dnf.baseurl.org)了解关于 DNF。\n\n使用 YUM 安装软件非常简单。假设你想安装\
  \ Shotwell，一个图像组织器。为了安装 Shotwell，你还需要安装其他几个依赖项。使用 YUM，这个过程会比你尝试使用 `RPM` 手动安装要轻松得多。首先，你不需要自己寻找并下载\
  \ Shotwell 软件包；相反，YUM 会为你下载 Shotwell 以及任何其他必要的依赖项。\n\n遗憾的是，`YUM` 在工作时输出非常啰嗦。下面的输出经过了大幅删减，但仍然很长。尽管如此，这仍然能让你大致了解如果你使用\
  \ `yum` 命令时会看到的内容。\n\n点击此处查看代码\n\n```bash\nyum install shotwell\n\nResolving Dependencies\n\
  \n--> Running transaction check\n---> Package shotwell.x86_64 0:0.14.1-5.el7 will\
  \ be installed\n--> Processing Dependency: libraw.so.5()(64bit) for package: shotwell-0.14.1-5.el7.x86_64\n\
  --> Processing Dependency: libgexiv2.so.1()(64bit) for package: shotwell-0.14.1-5.el7.x86_64\n\
  --> Running transaction check\n---> Package LibRaw.x86_64 0:0.14.8-5 will be installed\n\
  ---> Package libgexiv2.x86_64 0:0.5.0-9.el7 will be installed\n--> Finished Dependency\
  \ Resolution\n\nPackage     Version       Repository  Size\nInstalling:\nshotwell\
  \    0.14.1-5.el7  base          2.8 M\nInstalling for dependencies:\nLibRaw   \
  \  0.14.8-5      base          250 k\nlibgexiv2  0.5.0-9.el7    base          61\
  \ k\nTransaction Summary\nInstall 1 Package (+2 Dependent packages)\nTotal download\
  \ size: 3.1 M\nInstalled size: 13 M\nIs this ok [y/d/N]:\n```\n\n在你输入 `y` 后，YUM\
  \ 会下载并安装软件包，并在每一步中持续告知你它正在做什么。\n\n点击此处查看代码\n\n```bash\nDownloading packages:\n(1/3):\
  \ LibRaw-0.14.8-5.el7.x86_64.rpm   | 250 kB\n(2/3): libgexiv2-0.5.0-9.el7.x86_64.rpm\
  \ |  61 kB\n(3/3): shotwell-0.14.1-5.el7.x86_64.rpm | 2.8 MB\nTotal            \
  \                   1.9 MB/s | 3.1 MB\nRunning transaction check\nRunning transaction\
  \ test\nTransaction test succeeded\nRunning transaction\n Installing : LibRaw-0.14.8-5.el7.x86_64\
  \   1/3\n Installing : libgexiv2-0.5.0-9.el7.x86_64  2/3\n Installing : shotwell-0.14.1-5.el7.x86_64\
  \  3/3\nVerifying  : libgexiv2-0.5.0-9.el7.x86_64  1/3\nVerifying  : LibRaw-0.14.8-5.el7.x86_64\
  \    2/3\nVerifying  : shotwell-0.14.1-5.el7.x86_64  3/3\nInstalled:\n shotwell.x86_64\
  \ 0:0.14.1-5.el7\nDependency Installed:\nLibRaw.x86_64 0:0.14.8-5.el7\nlibgexiv2.x86_64\
  \ 0:0.5.0.9.el7\nComplete!\n```\n\n呼！Shotwell 终于安装完毕并可以使用了。现在来找找如果你不喜欢 Shotwell，该如何删掉它。\n\
  \nYUM 有一个非常大的优点：它的命令语法非常用户友好。想安装软件包？`yum install`。想移除？`yum remove`。所以，如果你厌倦了 Shotwell，只需运行此命令：\n\
  \n```bash\nyum remove shotwell\n\nResolving Dependencies\n--> Running transaction\
  \ check\n---> Package shotwell.x86_64 0:0.14.1-5.el7 will be erased\n--> Finished\
  \ Dependency Resolution\nPackage    Version      Repository  Size\nRemoving:\nshotwell\
  \  0.14.1-5.el7\n```\n\n在你输入 `y` 前，YUM 会检查依赖项并询问你是否确认执行卸载操作：\n\n```bash\nDownloading\
  \ packages\nRunning transaction check\nRunning transaction test\nTransaction test\
  \ succeeded\nRunning transaction\n Erasing  : shotwell-0.14.1-5.el7.x86_64   1/3\n\
  Verifying  : shotwell-0.14.1-5.el7.x86_64  3/3\nRemoved:\n shotwell.x86_64 0:0.14.1-5.el7\n\
  Complete!\n```\n\n这样 Shotwell 就被删除了。\n\n\n\n\n更好的选择是查询通过 `YUM` 可用的软件包列表（通常会产生另一个长得离谱的列表），然后将结果通过\
  \ `grep` 搜索你的术语。\n\n点击此处查看代码图像\n\n```\n$ yum list available | grep wireshark\n\n\
  wireshark.i686           1.10.3-12.el7_0  base\nwireshark.x86_64         1.10.3-12.el7_0\
  \  base\nwireshark-devel.i686      1.10.3-12.el7_0  base\nwireshark-devel.x86_64\
  \   1.10.3-12.el7_0  base\nwireshark-gnome.x86_64  1.10.3-12.el7_0  base\n```\n\n\
  五个结果——这才具有操作性。如果你真的想执行完整搜索，请使用 `yum search`；否则，使用 `yum list available` 和 `grep`。大多数时候，后者的选择才是你真正想要的，而且启动后操作起来要容易得多。\n\
  \n***\n\n**提示**\n\n关于图形化包管理器列表，请跳转到本章后文“查找可下载的软件包 (DEB)”中的提示。那里列出的许多软件包要么是为基于 RPM\
  \ 的发行版设计的，要么与它们完美兼容（而且与许多其他包格式同样兼容！）。\n\n***\n\n### 安装软件包 (DEB)\n\n```\ndpkg -i\
  \ [package]\n```\n\n安装新软件是你可以在 Linux 机器上做的最有趣的事情之一。正如你将在后续章节中学到的，Debian 拥有 `APT`，它是最灵活、最易用的任何\
  \ Linux 发行版软件安装系统。尽管 `APT` 非常酷，但它的大部分功能都是 `dpkg` 程序的封装（就像 `YUM` 是 `RPM` 的封装一样），负责在基于\
  \ Debian 的机器上安装和删除软件的脏工作。在学习如何使用 `APT` 之前，你应该先学习如何使用 `dpkg`，因为 `APT` 并不能安装所有内容。\n\
  \n这里有一个例子：目前最流行的网络电话（VoIP）程序之一是 Skype。然而，由于许可问题，Skype 无法包含在许多发行版的默认安装中。如果你想要 Skype\
  \ 但你的发行版没有提供它，你就必须从公司网站下载它，然后手动安装。要获取 Skype，请访问其主页 [www.skype.com](http://www.skype.com)，找到下载页面，并找到适用于你发行版的包。在这种情况下，你将使用\
  \ Debian 包，该包目前命名为 `skype_debian-4.3.0.37-1_386.deb`。\n\n`.deb` 文件下载到你的系统后，就是时候安装它了。首先使用\
  \ `cd` 切换到包含 `.deb` 文件的目录，然后使用 `dpkg` 命令进行安装。\n\n***\n\n**注意**\n\n在大多数基于 Debian\
  \ 的发行版中，此以及所有其他 `dpkg` 命令都以 root 身份运行。然而，极其流行的 Ubuntu 发行版并不使用 root。相反，以 root 身份运行的命令前面带有\
  \ `sudo`。换句话说，Debian 会使用这种方式：\n\n点击此处查看代码图像\n\n```\n# dpkg -i skype_debian-4.3.0.37-1_386.deb\n\
  ```\n\nUbuntu 和其他基于 `sudo` 的发行版将使用这种：\n\n点击此处查看代码图像\n\n```\n$ sudo dpkg -i skype_debian-4.3.0.37-1_386.deb\n\
  ```\n\n这本书是用几台运行 Ubuntu 的机器编写的，所以如果你看到 `sudo` 而不是 root 提示，你就知道了。\n\n点击此处查看代码图像\n\
  \n```\n$ ls\nskype_debian-4.3.0.37-1_.deb\n$ sudo dpkg -i skype_debian-4.3.0.37-1_.deb\n\
  Selecting previously deselected package skype.\n(Reading database ... 976 files\
  \ and directories currently installed.)\nUnpacking skype ...\nSetting up skype (4.3.0)...\n\
  ```\n\n就这样。`dpkg` 命令是简洁的典范，只告诉你重要的信息。\n\n### 移除软件包 (DEB)\n\n```\ndpkg -r [package]\n\
  ```\n\n`-i` 选项用于在基于 Debian 的机器上安装软件，代表 `install`；同样，`-r` 选项用于在基于 Debian 的机器上卸载软件，代表\
  \ `remove`。如果你厌倦了 Skype，从电脑上移除它很容易。\n\n点击此处查看代码图像\n\n```\n## dpkg -r skype\n(Reading\
  \ database ... 984 files and directories currently installed.)\nRemoving skype ...\n\
  ```\n\n当你使用 `dpkg -i` 安装软件时，你需要指定文件名，否则 `dpkg` 不知道你想安装什么。然而，当你使用 `dpkg -r` 移除软件时，你指定包名，因为用于安装的文件已经消失了，而\
  \ `APT` 通过包名来识别软件。\n\n***\n\n**注意**\n\n如果你想找出系统上安装了哪些软件包以及 `dpkg` 如何识别它们，请使用 `dpkg\
  \ -l`。注意，除了包名你还会获得版本号、架构（通常是 32 位或 64 位）以及简短描述。\n\n***\n\n### 安装软件包和依赖 (DEB)\n\n\
  ```\napt-get install [package]\n```\n\n`dpkg` 命令非常强大，但在使用一段时间后，当你尝试安装具有依赖关系的软件包时会遇到问题。为了安装\
  \ A，你还需要下载并安装 B 和 C，但为了安装 C，你还需要下载并安装 D 和 E，但为了安装 E……唉！（模仿 Rod Serling 的语气）：朋友，你进入了依赖区域，你需要高级工具。\n\
  \n`apt` 命令及其附件用于安装、升级和卸载软件包。最棒的是，`APT` 会为你处理依赖关系。例如，如果你尝试安装上段提到的软件包 A，`APT` 会为你下载并安装\
  \ A、B 和 C。以后，如果你决定系统上不再需要 A，`APT` 可以为你卸载它以及 B 和 C，只要其他软件包不需要它们。\n\n`apt` 命令最初是为\
  \ Debian 发行版开发的 `dpkg` 前端。现在存在于每个基于 Debian 的发行版——包括 Debian 本身、Ubuntu 及其所有变体、Knoppix、Linux\
  \ Mint 以及其他——它是让 Debian 如此易用的特性之一。其他非 Debian 发行版意识到 `APT` 是多么伟大，最终 Connectiva 将\
  \ `APT` 移植以支持 RPM。（本章重点介绍 Debian 中使用的 `APT`）。\n\n***\n\n**注意**\n\n尽管本章围绕 Debian\
  \ 中使用的 `APT`，但你实际上可以在某些基于 RPM 的发行版上使用它。更多信息，请查看 [`apt-rpm.org`](http://apt-rpm.org)。Dag\
  \ Wieers 在“在 RPM 世界中使用 apt”中提供了很好的理由和教程（[http://dag.wieers.com/blog/using-apt-in-an-rpm-world]）。最后，我在\
  \ 2003 年为《Linux Magazine》杂志写了一篇名为“非常贴切的 `apt’”的文章，虽然在很多方面显然过时了，但包含许多实用的技巧。你可以在 [www.linux-mag.com/id/1476/](http://www.linux-mag.com/id/1476/)\
  \ 找到它。\n\n***\n\n假设你想使用 `APT` 安装网页编辑器 Bluefish。要这样做，你需要经过以下过程（记住这些命令必须以 root 身份运行）：\n\
  \n点击此处查看代码图像\n\n```\n## apt-get update\nGet:1 http://security.ubuntu.com trusty-security\
  \ Release.gpg [933 B]\nIgn http://extras.ubuntu.com trusty InRelease\nGet:2 http://security.ubuntu.com\
  \ trusty-security Release [63.5 kB]\nGet:3 http://us.archive.ubuntu.com trusty-updates\
  \ Release.gpg [933 B]\nFetched 3,353 kB in 7s (445 kB/s)\nReading package lists...\
  \ Done\n\n## apt-get install bluefish\nReading package lists... Done\nBuilding dependency\
  \ tree\nThe following extra packages will be installed:\n bluefish-data bluefish-plugins\n\
  Suggested packages:\n bluefish-dbg libxml2-utils php5-cli tidy weblint\nThe following\
  \ packages will be installed:\n bluefish bluefish-data bluefish-plugins\nThe following\
  \ dependencies will be met:\n  bluefish-data\n  bluefish-plugins\nThe following\
  \ NEW packages will be installed:\n bluefish-data/trusty 3.2.22-1\n bluefish-plugins/trusty\
  \ 3.2.22-1\n bluefish/trusty 3.2.22-1\nThe following packages will be downloaded:\n\
  \  bluefish-data/trusty 3.2.22-1 [150 kB]\n  bluefish-plugins/trusty 3.2.22-1 [200\
  \ kB]\n  bluefish/trusty 3.2.22-1 [1.2 MB]\nFetched 1.55 MB in 2s (775 kB/s)\nMerging\
  \ metadata... Done\nSelecting bluefish-data/trusty 3.2.22-1.\nSelecting bluefish-plugins/trusty\
  \ 3.2.22-1.\nSelecting bluefish/trusty 3.2.22-1.\nPreparing bluefish-data...\nPreparing\
  \ bluefish-plugins...\nPreparing bluefish...\nUnpacking bluefish-data (3.2.22-1)...\n\
  Unpacking bluefish-plugins (3.2.22-1)...\nUnpacking bluefish (3.2.22-1)...\nSetting\
  \ up bluefish-data (3.2.22-1)...\nSetting up bluefish-plugins (3.2.22-1)...\nSetting\
  \ up bluefish (3.2.22-1)...\n```\n\n\n\n\n将安装以下新软件包：\n\nbluefish bluefish-data bluefish-plugins\n\
  \n0 个升级，3 个新安装，0 个移除，0 未升级。\n\n需要下载 2,548 kB 的存档。\n\n此操作后，将使用额外的 9,484 kB 磁盘空间。\n\
  \n您想继续吗？[Y/n] y\n\n```\nGet:1 http://us.archive.ubuntu.com/ubuntu/ trusty/universe\
  \ bluefish-data all 2.2.5-1 [2,134 kB]\nGet:2 http://us.archive.ubuntu.com/ubuntu/\
  \ trusty/universe bluefish-plugins amd64 2.2.5-1 [172 kB]\nGet:3 http://us.archive.ubuntu.com/ubuntu/\
  \ trusty/universe bluefish amd64 2.2.5-1 [243 kB]\nFetched 2,548 kB in 3s (831 kB/s)\n\
  \n(正在读取数据库 ... 当前已安装 223602 个文件目录。)\n正在解压 bluefish-data (2.2.5-1) ...\n正在解压 bluefish-plugins\
  \ (2.2.5-1) ...\n正在解压 bluefish (2.2.5-1) ...\n正在设置 bluefish-data (2.2.5-1) ...\n\
  正在设置 bluefish-plugins (2.2.5-1) ...\n正在设置 bluefish (2.2.5-1) ...\n```\n\n让我们回顾一下你刚才执行的操作，因为你实际上运行了两个命令。`apt-get\
  \ update` 从 `APT` 服务器（称为 `repositories`，即软件仓库）下载当前的软件软件包列表，这些列表列在你的 APT 配置文件中，路径为\
  \ `/etc/apt/sources.list`（如果你想查看软件仓库所在的位置，请运行 `cat /etc/apt/sources.list`）。如果你在运行\
  \ `apt-get update` 后，在某行的开头看到 `Get`，这意味着意味着 `APT` 发现仓库中的列表较新，因此正在下载该特定列表；相反，`Ign`\
  \ 意味着仓库中的列表和你计算机上的列表是同步的，因此忽略了该列表且不下载任何内容。在执行任何其他操作之前运行 `apt-get update`，可以确保你的软件包列表是正确且最新的。\n\
  \n#### Note\n\n如果你想添加新的软件仓库，你真的不应该编辑 `sources.list` 文件，因为你添加的内容可能会随时被软件更新覆盖。相反，更好的主意是在\
  \ `/etc/apt/sources.d` 中为每个新仓库创建一个独立的 conf 文件。例如，Dropbox 可以作为 `deb` 包下载，但我想通过 `APT`\
  \ 来添加它，这样我就能自动获取更新。Dropbox 在其官方网站上提供了如何添加其仓库的说明（在 Google 上搜索“dropbox apt repo”即可）。\n\
  \n以 root 身份或使用 `sudo`，在 `/etc/apt/sources.list.d` 中创建一个名为 `dropbox.list` 的文件。在该文件中写入以下内容：`deb`\
  \ `http://linux.dropbox.com/ubuntu` `trusty main.`（`Trusty` 指 Ubuntu 特有命名方案中的系统版本；如果你不确定正在使用哪个版本的\
  \ Ubuntu，只需使用 `cat /etc/os-release`。）保存文件并关闭，然后在在你执行任何其他操作之前，你必须通过运行 `sudo apt-key\
  \ adv --keyserver pgp.mit.edu --recv-keys 5044912E` 来导入 Dropbox 的 GPG 密钥。完成后，运行\
  \ `sudo apt-get update`。完成后，尝试 `apt-cache search dropbox`，你就会看到——哒哒！Dropbox 的结果。当你发现其他值得关注的仓库时，将它们添加到\
  \ `sources.list.d` 中并享受其中吧。\n\n`apt-get install bluefish` 命令获取指定的软件包以及任何必要的依赖项（在本例中为\
  \ `bluefish-data` 和 `bluefish-plugins`）。在这些包下载到你的计算机后，`APT`（实际上是受 `APT` 指驱动的 `dpkg`）会为你安装所有软件。请记住，你始终使用包名而不是文件名。换句话说，使用\
  \ `apt-get install bluefish`，而不是 `apt-get install bluefish_2.2.5-1_amd64.deb`。正如你看到的，如果\
  \ `APT` 确实发现了请求软件包的额外依赖项（如对于 `bluefish` 所示），你需要在 `APT` 获取它们之前确认你想要安装它们。\n\n如果你想同时安装多个软件包，只需在命令行中列出它们即可。例如，如果你想安装\
  \ `bluefish` 和 `pandoc`，你可以如下操作：\n\n```\napt-get install bluefish pandoc\n```\n\n\
  任何针对 `bluefish` 或 `pandoc` 的依赖项都会被发现，并会询问你是否也想安装它们。是的，就如此。\n\n### Tip\n\n不知道 `pandoc`\
  \ 是什么？哦，你应该知道！先去查看官方网站 `http://pandoc.org`。我在我的博客 `Chainsaw on a Tire Swing`（地址\
  \ `www.chainsawontatireswing.com`）上写了一些关于我如何使用它的。\n\n## 移除软件包和依赖项 (DEB)\n\n`apt-get\
  \ remove`\n\n现代 Linux 系统有数千个软件包，可以肯定其中至少有一个每天会被其维护者更新。通过 `APT`，保持系统更新非常简单。过程如下（记住，必须以\
  \ root 身份或使用 `sudo` 运行此命令）：\n\n```\nsudo apt-get update\nsudo apt-get upgrade\n\
  ```\n\n## 卸载软件包和依赖项 (DEB)\n\n`apt-get remove`\n\n`apt-get remove` 会卸载你指定的软件包，但如果相关的配置文件不再被其他程序使用，则不会删除它们。如果你想删除所有内容，请使用\
  \ `--purge` 选项。\n\n```\napt-get remove --purge sshfs\n```\n\n使用 `--purge` 时，APT\
  \ 将移除的软件包将标记上星号，表示相关的配置文件将被删除。\n\n\n\n\n\n让我们搞清楚这里发生了什么。再次，你想要先运行 `apt-get update`，以便你的计算机与\
  \ APT 存储库保持同步。然后 `apt-get upgrade` 会查找你已安装软件与存储库中可用软件之间的任何差异。如果存在差异，APT 会向你列出它想要在你的计算机上下载并安装的软件包列表。当然，实际的软件包列表取决于你的系统的更新新程度。在这种情况下，这是一个全新的安装系统，所以有\
  \ 511 个软件包需要升级。\n\n如果你输入 `y`，APT 会将这 511 个软件包下载到 `/var/cache/apt/archives`，并在它们全部传输到你的机器上后进行安装。如果你不想继续升级，只需输入\
  \ `n` 即可。\n\n这非常简单，但使用 APT 更新你的 Linux 机器最有效的方法是将这些命令组合在一起：\n\n点击此处查看代码图片\n\n# apt-get\
  \ update && apt-get upgrade\n\n`&&` 确保了除非 `apt-get update` 在没有错误的情况下完成，否则不会运行 `apt-get\
  \ upgrade`。更好的方法是在你的 `.bash_aliases` 文件中为该命令创建一个别名，正如在第 12 章中的“创建新的永久别名”、“你的 Shell”中所讨论的那样。\n\
  \n点击此处查看代码图片\n\n```bash\nalias upgrade='apt-get update && apt-get upgrade'\n```\n\
  \n重新加载你的 `.bash_aliases` 文件，现在你只需要输入 `upgrade`，按回车键，按 `y` 接受任何新软件包，就完成了。Windows\
  \ Update，你尽管去后悔吧！\n\n***\n\n### 注意\n\n当你使用 `apt-get upgrade` 时，你将收到关于被保留且未升级或安装的软件包的消息。如果你想自动安装新软件并移除不再需要的已安装软件包，那么你需要使用\
  \ `apt-get dist-upgrade`。请不要轻率使用 `dist-upgrade` 命令！请注意它即将要做什么，仅仅是为了了解你的系统中即将发生什么。\n\
  \n***\n\n### 查找可下载的软件包 (DEB)\n\n#### apt-cache search\n\n我们一直在讨论如何使用 APT 安装软件，但你如何知道哪些软件包是可用的？APT\
  \ 工具箱中还有另一个工具可以帮助你这一点：`apt-cache search`，它搜索你的 APT 存储库中可用的软件包列表。作为一个很棒的变化，使用 `apt-cache\
  \ search` 时完全不需要 root 权限。\n\n点击此处查看代码图片\n\n```bash\n$ apt-cache search dvdcss\n\
  ```\n\nbrasero - 用于 GNOME 的 CD/DVD 刻录应用程序\n\nubuntu-restricted-extras - Ubuntu 常用的限制软件包\n\
  \narista - 用于 GNOME 的多媒体转码器\n\ngxine - xine 视频播放器，GTK+/Gnome 用户界面\n\nlibdvdread\
  \ - 读取 DVD 的库\n\npython3-dvdvideo - 视频读取器库\n\n记住关于此命令搜索方式的几点。它寻找与你的字符串（在这种情况下是 `dvdcss`）匹配的项，而不是精确的单词。此外，你的搜索模式可能出现在软件包名称中，也出现在描述中。最后，`apt-cache\
  \ search` 会遍历已安装和未安装软件包的整个软件包列表，因此你的搜索结果将显示你已经安装的软件包以及新的软件包。\n\n***\n\n### 提示\n\n\
  有很多软件包器的图形用户界面（GUI），可以让你轻松地通过点击而不是输入来完成章节中讨论几乎的所有内容——查看、管理、安装、卸载等。我将提供许多重要工具的列表，但你应该记住几点。首先，为\
  \ GNOME 或 KDE 创建的图形化软件包管理器当然可以在另一个桌面环境中工作，前提是安装了正确的库。其次，对于所有这些工具，如果你想了解更多信息，维基百科是一个很棒的起点。它们按字母顺序排列如下：\n\
  \n- **Apper**: (images/00002.jpeg) 以前名为 `PackageKit`，这是一个 KDE 应用，为 `PackageKit`\
  \ 服务器提供前端，因此它可以与与 Linux 软件包相关的任何内容工作：`YUM`、Portage、`urpmi`、`Pacman`、`zypp` 等。追溯到\
  \ 2008 年。被 Fedora、Red Hat 和 OpenSUSE 采用。\n- **GNOME PackageKit**: (images/00002.jpeg)\
  \ 基于 GTK 的 `PackageKit` 前端（见 Apper）。更多面向高级用户，而 GNOME 软件则面向主流用户。\n- **GNOME Software**:\
  \ (images/00002.jpeg) 为 `PackageKit` 提供基于 GTK 的前端（见 Apper）。按照典型的 GNOME 风格，它使用了一个完全通用的、在\
  \ Google 上找不到的名字。于 2013 年发布并目前仍然活跃。\n- **Muon Discover**: (images/00002.jpeg) 基于\
  \ Qt 的 APT 前端。\n- **Octopi**: (images/00002.jpeg) 针对 Arch Linux 的 Qt 前端。\n- **Smart**:\
  \ (images/00002.jpeg) 针对 RPM 和 `dpkg` 的软件包管理器。\n- **Ubuntu Software Center**: (images/00002.jpeg)\
  \ 针对 Ubuntu 的 GTK 应用程序。\n- **Yumex**: (images/00002.jpeg) `YUM` 扩展的缩写，一个基于 GTK 的程序，用于\
  \ `YUM` 和现在的 `DNF`。\n- **Zero Install**: (images/00002.jpeg) 将程序下载到自己的目录并使用环境变量以便程序可以找到它们。\n\
  \n***\n\n### 清理不需要的安装包 (DEB)\n\n#### apt-get clean\n\n当 APT 下载并安装软件包时，`.deb` 文件会留在\
  \ `/var/cache/apt/archives/`。随着时间的推移，这些必要的安装程序会占用大量的磁盘空间。要移除所有不需要的 `.deb` 文件，请使用\
  \ `apt-get clean`（再次，此命令以 root 运行）：\n\n点击此处查看代码图片\n\n```bash\n$ ls -1 /var/cache/apt/archives/\n\
  bluefish_2.2.5-1_amd64.deb\nbluefish-data_2.2.5-1_all.deb\nbluefish-plugins_2.2.5-1_amd64.deb\n\
  lock\npartial/\n\n$ sudo apt-get clean\n\n$ ls -1 /var/cache/apt/archives/\nlock\n\
  partial/\n```\n\n`apt-get` 的 `clean` 选项非常有用，但你还应该了解另外两个相关的选项。当你运行 `apt-get autoclean`\
  \ 时，只会移除过时的软件包。同样，`apt-get autoremove` 会清除作为依赖项安装但不再需要的软件包，例如旧内核。所有这些操作都能帮助你的系统保持没有不再需要的内容。\n\
  \n噢——还有一点：如果下载由于某种原因被中断，你可能会在 `/var/cache/apt/archives/partial/` 中发现部分 `.deb` 文件。如果你确定所有的更新和升级已完成并安装，那么删除该目录的内容是安全的，如果里面有东西的话。\n\
  \n\n\n\n\n点击查看代码图像\n\n`E: Could not open lock file /var/lib/dpkg/lock - open (13\
  \ Permission denied)`\n\n`E: Unable to lock the administration directory (/var/lib/dpkg/),\
  \ are you root?`\n\n此问题的解决方案就在第二行中：你没有以 root 身份登录！只需以 root 身份登录并重试，一切应该都能正常工作。\n\
  \n### 注意\n\n如果你正在运行 Ubuntu 或任何其他使用 `sudo` 代替 `root` 的发行版，该错误意味着你没有在命令前加上 `sudo`。换句话说，你运行了以下命令：\n\
  \n```bash\n$ apt-get upgrade\n```\n\n你之所以看到错误信息，是因为你本应该运行这个命令：\n\n```bash\n$ sudo\
  \ apt-get upgrade\n```\n\n下一个常见问题是 APT 抱怨依赖关系损坏。当 APT 鼓励你运行 `apt-get -f install`\
  \ 时，你就知道发生这种情况了。这个建议是程序在告诉你，你的系统存在某些损坏的依赖关系，导致 APT 无法完成它的工作。\n\n有两个可能的解决方案。你可以遵循\
  \ APT 的建议，运行 `apt-get -f install`，它会尝试通过下载并安装必要的包来解决问题。通常情况下，这会解决问题，你就可以继续后续操作了。\n\
  \n如果你不想这样做，可以尝试运行 `apt-get -f remove`，它会尝试通过移除 APT 认为有麻烦的包来解决问题。这些步骤听起来可能是潜在的危险操作——如果你不注意的话，确实可能如此——但每个选项都给了你一个审查任何提议更改并给予许可的机会。只需确保在说“是”之前检查\
  \ APT 的提议即可。\n\n最后，APT 可能会警告你某些软件包“已被保留”（have been kept back）。这个警告告诉你 APT 在请求的包或其依赖项与系统中已安装的另一个包之间发现了冲突。要解决此问题，尝试使用\
  \ `-u` 选项安装被保留的包，这会为你提供关于具体哪些内容需要升级的信息。\n\n### 结论\n\n基于 RPM 和基于 Debian 的发行版尽管存在差异，但在软件包管理方面具有某些相似之处，因为它们都旨在简化软件的安装、卸载和管理。基于\
  \ RPM 的发行版使用 `rpm` 命令来安装、升级和删除软件，而基于 Debian 的发行版使用 `dpkg` 实现相同目的。为了解决“依赖地狱”的烦恼，基于\
  \ RPM 的发行版有 `yum`（它是 `rpm` 的封装器），而基于 Debian 的发行版有 APT（它是 `dpkg` 的封装器）。\n\n归结底，两者都比\
  \ Windows 用户必须忍受的要。Windows Update 只更新微软自己的软件和少数第三方硬件驱动程序，而 APT 和 `YUM` 都能处理 Linux\
  \ 系统上的几乎每一个软件。这是 Linux 用户相对于他们的微软亲戚的巨大优势，也是我们应该感到自豪的一点。\n\n# 第五部分：网络\n\n## 15. 连接性\n\
  \n自从 Linux 最初作为一个一小群程序员编写的简单内核开始，网络一直是 Linux 的一部分，它是 Linux 伟大的核心。Linux 网络在大多数情况下都能正常工作，为你提供稳如石的连接，并可以无限调整和调优以满足你的精确需求。\n\
  \n到目前为止，从旧到新的过渡已经持续了多年，我们仍处于这一过程中。在本章中介绍的一些工具自 Linux 石器时代以来就存在了，它们现在正被弃用：`ifconfig`、`iwconfig`、`host`、`ifup`、`ifdown`\
  \ 和 `route`（`ping` 和 `traceroute` 也一直存在，但它们不在替换范围内）。例如，在 3.x Linux 内内核中，`route`\
  \ 已经被弃用，其替代品——`ip route show`——可以在名为 `iproute2` 的工具集中找到。我提到的其他所有弃用命令也是如此，正如你所看到的。\n\
  \n对我来说问题是，大多数发行版（可能是绝大多数？）仍然包含 `route`、`ifconfig`、`ifup` 等其他。许多（再次，也许是大多数？很难判断）也包含了\
  \ `iproute2`，而其他的提供了下载和安装。因此，当我过这一章时，我通常会尝试同时涵盖旧命令及其更年轻、更时髦的替代品。以同样低的价格获得双倍的内容——你是一个幸运的读者！\n\
  \n无论是旧的还是新的，本章完全关于测试、测量和管理你的网络设备和连接。当一切运行正常时（在绝大多数情况下都是如此），你可以使用本章中的工具监控你的系统的网络连接；如果你遇到问题，本章将帮助你解决一些最恼人的问题。\n\
  \n### 提示\n\n本章中的信息假设你正在使用 IPv4 地址，格式为 `xxx.xxx.xxx.xxx`。IPv6 最终将取代 IPv4，但那仍在未来（在\
  \ 2015 年这里它正越来越近，但还需要一段时间）。到那时，`route` 和你将检查的许多其他命令将发生变化（不意外，较新的 `ip` 命令已经支持 IPv6）。但目前，本章中的信息是你需要的。更多关于\
  \ IPv6 的信息，请参见维基百科的“IPv6”（[http://en.wikipedia.org/wiki/IPv6]）。\n\n### 注意\n\n当我为第二版更新此书时，删除了关于使用\
  \ `iwconfig` 配置无线接口的文本。然而，我保留了部分，可以在我的网站查看。\n\n### 查看网络接口状态\n\n`ifconfig`\n\n`ip\
  \ addr show`\n\n本章中的所有内容取决于你的网络连接。要快速查看所有运行的网络设备，使用 `ifconfig`，它代表 *interface configuration*。（如果你想查看所有设备，即使是不运行的，请使用\
  \ `-a`（代表 *all*））。在这里你可能会看到（注意某些发行版要求以 root 身份以这种方式使用 `ifconfig`）：\n\n点击查看代码图像\n\
  \n```bash\n$ ifconfig\n\nath0 Link encap:Ethernet  HWaddr 00:14:6C:06:6B:FD\n\n\
  \  inet addr:192.168.0.101  Bcast:192.168.0.255  Mask:255.255.255.0\n\nUP BROADCAST\
  \ RUNNING MULTICAST  MTU:1500  Metric:1\n\nlo  Link encap:Local Loopback\n\n  inet\
  \ addr:127.0.0.1  Mask:255.0.0.0\n\nUP LOOPBACK RUNNING  NTU:16436  Metric:1\n\n\
  \  [由于长度原因大幅压缩]\n```\n\n这里列出了两个接口：`ath0`（无线卡）和 `lo`（环回接口——稍后将介绍）。对于每一个接口，你都会被连接类型、媒体访问控制（MAC）或硬件地址、IP\
  \ 地址、广播地址和子网掩码地址，以及接收和发送数据包的信息等其他数据。如果你改用 `-a` 选项查看所有设备，那些断开的设备（在本例中为 eth0）将缺少许多信息，例如\
  \ IP 地址和第四行完整行中的 `UP` 字样，这使得问题显而易见。\n\n\n\n\n\n让我们反过来来看这三个接口。`lo` 是环回地址，它允许机器引用其自身。环回地址始终由\
  \ IP 地址 `127.0.0.1` 表示。基本上，你的系统需要它来正常工作。如果你有它，就不用担心；如果你没有它，你会知道的，因为你会发现自己陷入了痛苦的渊。\n\
  \n> 提示：关于环回接口和地址的更多信息，请参阅维基百科上的“Loopback”，[`en.wikipedia.org/wiki/Loopback`](http://en.wikipedia.org/wiki/Loopback)。\n\
  \n`eth0`（如果不使用 `-a` 选项它就不会出现）是一个以太网卡，你实际上将电缆插入这里（啥？我知道！太不可思议了！）。目前以太网卡的端口没有插入电缆，因此它未激活，所以缺少任何地址：IP、广播地址和子网掩码。当然，同时运行有线和无线接口是可能的，尽管通常没有必要。\n\
  \n最后是 `ath0`，一个无线 PCMCIA 卡。如果无线卡是主网络接口，你可能还会看到名为 `eth0` 的无线卡；如果是次要接口，则是 `eth1`。当无线卡插入时，Ubuntu\
  \ 自动识别了它并配置系统与其工作，赋予它 `ath0` 标识符。由于无线接口只是带有一些额外无线功能的以太网接口，你通过 `ifconfig` 获取的信息与你在\
  \ `eth0` 启用时看到的是相似的。\n\n> 注意：你可能会看到网络设备的其他名称，例如用于无线卡的 `wlan0`。\n\n如你所见，`ifconfig`\
  \ 是检查网络接口状态的快速方法，特别是当你需要快速找到 IP 地址时。但那是旧方法了。是时候用使用 `ip` 命令的新方法了。\n\n你从不单独使用 `ip`。相反，你会在它后面跟着一个对象——你想要查看或更改的网络设备或信息——然后是针对该对象的命令。例如，要获取与\
  \ `ifconfig` 相同的信息，你可以这样做：\n\n点击此处查看代码图像\n\n```\n$ ip addr show up\n\n1: lo: <LOOPBACK,UP,LOWER_UP>\
  \ mtu 65536 state UNKNOWN\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n\
  \    inet 127.0.0.1/8 scope host lo\n2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP>\
  \ mtu 1500 state UP\n    link/ether 00:14:6C:06:6B:FD brd ff:ff:ff:ff:ff:ff\n  \
  \  inet 192.168.0.101/24 scope global dynamic eth0\n[由于长度原因列表已省略]\n```\n\n我们从 `ip`\
  \ 开始，然后指定对象：`addr`（或 `address` 甚至只是 `a`！）。我们想对地址做什么？显而易见，`show` 显示。哪些？是 `up` 状态且正在运行的。你就看到数据了，就像使用\
  \ `ifconfig` 一样。如果你想看到所有设备，即使是当前未连接的，你反而应该使用 `ip addr show`，就像 `ifconfig -a`。\n\n\
  ### 验证计算机是否运行并接受请求\n\n`ping`\n\n`ping -c`\n\n`ping` 命令向指定地址发送一种特殊的数据包——ICMP ECHO_REQUEST\
  \ 消息。如果该地址的机器正在监听 ICMP 消息，它将返回一个 ICMP ECHO_REPLY 包作为响应。（防火墙确实可以阻止 ICMP 消息，导致 `ping`\
  \ 无效，但大多数情况下这并不是问题。） 成功的 `ping` 意味着两台机器之间存在网络连接。\n\n点击此处查看代码图像\n\n```\n$ ping www.google.com\n\
  \nping www.google.com\nPING www.l.google.com (72.14.203.99) 56(84) bytes of data.\n\
  64 bytes from 72.14.203.99: icmp_seq=1 ttl=245 time=17.1 ms\n64 bytes from 72.14.203.99:\
  \ icmp_seq=2 ttl=245 time=18.1 ms\n64 bytes from 72.14.203.99: icmp_seq=3 ttl=245\
  \ time=17.9 ms\n64 bytes from 72.14.203.99: icmp_seq=4 ttl=245 time=16.9 ms\n64\
  \ bytes from 72.14.203.99: icmp_seq=5 ttl=245 time=17.5 ms\n--- www.l.google.com\
  \ ping statistics ---\n6 packets transmitted, 5 received, 16% packet loss, time\
  \ 505ms\nrtt min/avg/max = 16.939/17.560/18.136 ms\n```\n\n`ping` 命令在你按下 Ctrl+C\
  \ 之前不会停止。如果你忘记正在使用 `ping` 可能会导致问题，因为它会一直运行直到你的机器连接停止。如果你想给 `ping` 设置一个限制，可以使用 `-c`\
  \ 选项设置发送包的数量。在 `ping` 发送该数量的包后，它会停止并报告结果。噢！你向某个服务器发送了将近 140 万次 `ping`。\n\n点击此处查看代码图像\n\
  \n```\n$ ping -c 3 www.granneman.com\nPING granneman.com (216.23.180.5) 56(84) bytes\
  \ of data.\n64 bytes from 216.23.180.5: icmp_seq=1 ttl=44 time=65.4 ms\n64 bytes\
  \ from 216.23.180.5: icmp_seq=2 ttl=44 time=64.5 ms\n64 bytes from 216.23.180.5:\
  \ icmp_seq=3 ttl=44 time=65.7 ms\n--- granneman.com statistics ---\n3 packets transmitted,\
  \ 3 received, 0% packet loss, time 4006ms\nrtt min/avg/max = 64.515/65.248/65.700\
  \ ms\n```\n\n`ping` 命令是一种标准且快速确定基本连接性的方法；更好的是，如果包含 `-c` 选项，它就不会意外运行 18 天。然而，要小心——某些政府或军事服务器可能会认为你正在攻击。最好的情况下，你会被拉黑名单。关于更多使用\
  \ `ping` 诊断网络问题的信息，请参见故障排除。\n\n### 追踪主机间的路由\n\n`traceroute`\n\n`traceroute` 命令显示从你的机器到指定主机路由上的每一个步骤。假设你想知道为什么无法访问\
  \ `www.google`。你昨天还能加载它，但今天加载网页超时了。问题在哪里？\n\n点击此处查看代码图像\n\n```\n$ traceroute www.granneman.com\n\
  traceroute to granneman.com (216.23.180.5), 30 hops max,38 packets\n  1  192.168.0.1\
  \ (192.168.0.1)  1.245 ms  0.827 ms  0.839 ms\n  2  10.29.64.1 (10.29.64.1)  8.582\
  \ ms  19.930 ms  7.083 ms\n  3  224.217.2.165 (224.217.2.165)  10.152 ms  25.476\
  \ ms  36.617 ms\n  4  124.124.129.97 (124.124.129.97)  9.203 ms  8.003 ms  11.307\
  \ ms\n  5  124.122.82.241 (124.122.82.241)  52.901 ms  53.619 ms  51.215 ms\n  6\
  \  tbr2-p013501.sl9mo.ip.att.net (124.122.111.121)  51.625 ms  52.166 ms  50.156\
  \ ms\n  7  tbr2-cl21.la2ca.ip.att.net (124.122.10.14)  50.669 ms  54.049 ms  69.334\
  \ ms\n  8  gar1-p3100.lsnca.ip.att.net (124.123.199.229)  50.167 ms  48.703 ms \
  \ 49.636 ms\n  9  * * *\n 10 border20.po2-bbnet2.lax.pnap.net (216.52.255.101) \
  \ 59.414 ms  62.148 ms  51.337 ms\n 11 intelenet-3.border20.lax.pnap.net (216.52.253.234)\
  \  51.930 ms  53.054 ms  50.748 ms\n 12 v8.core2.irv.intelenet.net (216.23.160.66)\
  \  50.611 ms  51.947 ms  60.694 ms\n 13  * * *\n 14  * * *\n 15  * * *\n```\n\n\n\
  \n\n\n绕过问题的 `traceroute` 的另一种方法是增加命令尝试的跳数。默认情况下，最大跳数为 30，但你可以通过 `-m` 选项来更改它，例如 `traceroute\
  \ -m 40 www.bbc.co.uk`。\n\n***\n\n### 提示\n\n实际上，更好的 `traceroute` 是 `mtr`，它代表 Matt’s\
  \ traceroute。将其想象为 `ping` 和 `traceroute` 的结合。如果你的 Linux 发行版提供了 `mtr`，请下载并尝试一下。更多信息请访问\
  \ [www.bitwizard.nl/mtr](http://www.bitwizard.nl/mtr) 和 [`en.wikipedia.org/wiki/MTR_(software)`](https://en.wikipedia.org/wiki/MTR_(software))。\n\
  \n***\n\n## 查询 DNS 记录\n\n### host\n\ndig\n\n域名系统（DNS）的创建是为了让人类更方便地访问互联网上的资源。计算机处理数字非常出色——毕竟，计算机所做的一切本质上都是数字——但人类记忆和处理单词的效率要高得多。一个网站可能位于\
  \ 74.125.227.243，但对大多数人来说很难记住这个数字。相反，在心里记住要去 [www.google.com](http://www.google.com)\
  \ 要容易得多。DNS 基本上是一个巨大的数据库，记录着 74.125.227.243 与 [www.google.com](http://www.google.com)\
  \ 以及数百万其他 IP 地址和域名之间的关系。\n\n***\n\n### 提示\n\nDNS 是一个巨大、复杂且迷人的主题。更多细节请先从维基百科的“域名系统”（[`en.wikipedia.org/wiki/Domain_Name_System`](https://en.wikipedia.org/wiki/Domain_Name_System)）开始，然后通过\
  \ Paul Albitz 和 Cricket Liu 的经典著作 *DNS and BIND* 深入浅学习。\n\n***\n\n要快速查找与域名关联的 IP\
  \ 地址，请使用 `host` 命令：\n\n点击此处代码图片\n\n```\n$ host chainsawonatireswing.com\n```\n\n\
  chainsawonatireswing.com 的地址为 68.65.123.160\n\nchainsawonatireswing.com 邮件由 20 alt2.aspmx.l.google.com\
  \ 处理。\n\nchainsawonatireswing.com 邮件由 10 aspmx.l.google.com 处理。\n\n```\n$ host www.chainsawonatireswing.com\n\
  ```\n\nwww.chainsawonatireswing.com 是 gawain.websanity.com 的别名。\n\ngawain.websanity.com\
  \ 的地址为 23.239.25.194194\n\n注意这些不同但相似的查询提供了完全不同的答案。有人可能会认为 [chainsawonatireswing.com](http://chainsawonatireswing.com)\
  \ 和 [www.chainsawonatireswing.com](http://www.chainsawonatireswing.com) 是同一个东西，但它们绝对不是。\n\
  \n你也可以执行相反的过程——称为*反向 DNS 查询*（reverse DNS lookup）——并找到与 IP 关联的域名。请注意，这并不总是有效的。如果\
  \ IP 地址没有关联的 DNS 记录，你就无法获得可用的答案。\n\n点击此处代码图片\n\n```\n$ host 23.239.25.19\n```\n\n\
  19.25.239.23.in-addr.arpa 域名指针 li708-19.members.linode.com\n\n```\n$ host 68.65.123.160\n\
  ```\n\nHost 160.123.65.68.in-addr.arpa. not found: 3(NXDOMAIN)\n\n你可能还会注意到答案中的 IP\
  \ 地址是如何被反转的。这是完全正常且意料之中的。\n\n`host` 命令已经存在很长时间并且能够胜任，但有一个新命令旨在最终取代 host：`dig`（*domain\
  \ information groper* 的缩写）。你会发现 `dig` 可以做到 `host` 能做的一切事情，以及更多。\n\n你可以使用 `dig` 执行几种不同的查询；要这样做，只需在域名后指定你想要的类型。选项包括但但不限于\
  \ `a`（一个 IPv4 地址）、`aaaa`（一个 IPv6 地址）、`cname`（指向 A 记录的规范名称）、`mx`（邮件服务器）、`soa`（区域起始：关于域名的权威信息，例如主名称服务器、管理员的电子邮件地址以及刷新域名记录的计时器）以及\
  \ `any`（字面意思是它能找到的任何类型，包括 A, AAAA, CNAME, MX, SOA 等若干项）。\n\n点击此处代码图片\n\n```\n$ dig\
  \ www.chainsawonatireswing.com any\n```\n\n```\n;; ANSWER SECTION:\n\nwww.chainsawonatireswing.com.\n\
  \n;; AUTHORITY SECTION:\n\nchainsawonatireswing.com.\n\nchainsawonatireswing.com.\n\
  ```\n\n\n\n\n要运行某些类型的网络嗅探工具，例如强大的 Wireshark（可以在 [www.wireshark.org](http://www.wireshark.org)\
  \ 找到它），你首先需要将网卡设置为混杂模式（promiscuous mode）。默认情况下，`eth0` 只监听专门发送给它的数据包，但为了嗅探流经网络的所有数据包，你需要告诉你的网卡监听所有内容，这被称为混杂模式。\n\
  \n### ifconfig eth0 promisc\n\n```bash\nifconfig eth0 promisc\n```\n\n完成此操作后，运行\
  \ `ifconfig` 可以看到你的网卡现在正在查看它能看到的每一个数据包。看到最后行的 `PROMISC` 了吗？\n\n点击此处查看代码图像\n\n# ifconfig\
  \ eth0\n\n```\neth0 Link encap:Ethernet  HWaddr 00:02:8A:36:48:8A\n      inet addr:192.168.0.143\
  \  Bcast:192.168.0.255  Mask:255.255.255.0\n      inet6 addr: fe80::202:8aff:fe36:488a/64\
  \ Scope:Link\n      UP BROADCAST PROMISC MULTICAST  MTU:1500  Metric:1\n```\n\n\
  当你用完 Wireshark 时，别忘记关闭混杂模式（看 `PROMISC` 是如何消失）。\n\n点击此处查看代码图像\n\n### ifconfig eth0\
  \ -promisc\n\n```bash\nifconfig eth0 -promisc\nifconfig eth0\n```\n\n```\neth0 Link\
  \ encap:Ethernet  HWaddr 00:02:8A:36:48:8A\n      inet addr:192.168.0.143  Bcast:192.168.0.255\
  \  Mask:255.255.255.0\n      inet6 addr: fe80::202:8aff:fe36:488a/64 Scope:Link\n\
  \      UP BROADCAST MULTICAST  MTU:1500  Metric:1\n```\n\n对于 `ip` 命令，你通过输入此命令来启用混杂模式（务必查看\
  \ `eth0` 所在的行）：\n\n点击此处查看代码图像\n\n```bash\nip link set dev eth0 promisc on\nip addr\
  \ show up\n```\n\n```\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 state UNKNOWN\n...\n\
  2: eth0: <BROADCAST,MULTICAST,PROMISC,UP,LOWER_UP> mtu 1500 state UP\n```\n\n现在让我们把它改回来：\n\
  \n点击此处查看代码图像\n\n```bash\nip link set dev eth0 promisc off\nip addr show up\n```\n\
  \n```\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 state UNKNOWN\n...\n2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP>\
  \ mtu 1500 state UP\n```\n\n你甚至可以更改（或“欺骗”）你网络设备的硬件 MAC 地址。这通常是为了绕过某些互联网服务提供商（ISP）将服务绑定到特定机器的尝试。欺骗\
  \ MAC 地址时要小心，因为错误可能会与其他网络设备冲突，导致问题（尽管这种情况非常不利）。\n\n如果你决定要欺骗 MAC 地址，请确保先使用 `ifconfig`\
  \ 或 `ip addr show up` 获取默认 MAC 地址，以便你以后可以回滚。然后，你应该关闭设备（down），进行更改，然后重新启动（up）。如果你不认识关闭并启动设备的命令，不要担心，因为你将在本章稍后的部分学习它们。最后，你再次使用\
  \ `ifconfig` 或 `ip addr show up` 来验证 MAC 地址是否已更改。哦，此命令中显示的 MAC 地址是完全虚造的，不要尝试使用它。\n\
  \n点击此处查看代码图像\n\n```bash\nifdown eth0\nifconfig eth0 hw ether 12:34:56:78:90:aa\n\
  ifup eth0\n```\n\n使用 `ip` 命令，你需要执行以下操作：\n\n点击此处查看代码图像\n\n```bash\nip link set dev\
  \ eth0 down\nip link set dev eth0 address 12:34:56:78:90:aa\nip link set dev eth0\
  \ up\n```\n\n`ifconfig` 和 `ip` 命令是处理网络接口的基石。确保你理解它们的工作原理，以便充分利用它们提供的所有功能。\n\n###\
  \ 查看你的无线接口状态\n\n#### iwconfig\n\n`ifconfig` 命令可以显示网络接口的状态，但它无法显示无线接口的所有信息。要获取无线接口的数据，你应该使用\
  \ `iwconfig` 而不是 `ifconfig`。\n\n点击此处查看代码图像\n\n```bash\niwconfig\n```\n\n\n\n\n\n\
  在这种情况下，`-f` 意味着仅`show` `device` 对象中选定的字段——`GENERAL`、`IP4` 和 `WIFI-PROPERTIES`——在此例中为\
  \ `wlan0`。那里有一些非常有用的信息：供应商和产品 ID、驱动程序、硬件 (MAC) 地址、连接状态、连接名称、IP 地址和关联地址，最后是它支持的加密类型。这些都是值得了解的信息。\n\
  \n## 配置无线接口\n\n在本书的上一版本中，我介绍了 `iwconfig` 命令以及如何使用它来配置 Linux 盒子上的无线网卡。我已将其从本书的第二版中删去，正如我在本章开头提到的，你可以在我的网站上找到原始信息。\n\
  \n我移除这一节有几个原因，我想在这里简要说明一下。\n\n当这书最初在 2005 年出版时，在 Linux 电脑上配置无线连接仍然经常是一件极其痛苦的事情。这一节曾尝试帮助读者应对这项通常令人沮丧的练习。但在\
  \ 2015 年，情况已经大不相同了。\n\n现在，桌面或笔记本 Linux 用户极少需要通过命令行来配置无线连接（你好，Richard Stallman！）。如果你正在运行服务器，你可能在使用\
  \ CLI，但你也不会使用 Wi-Fi！你想要以太网，而这在没有 GUI 的情况下很容易设置。\n\n正如我在上一节中所说，几乎所有的桌面 Linux 发行版现在都带有\
  \ NetworkManager，这是一个 GUI 工具，它通常能消除配置 Wi-Fi 连接的所有痛苦。更重要的是，它支持 WPA2，这是目前的无线加密标准。尝试使用命令行使用\
  \ WPA2 设置 Wi-Fi 连接仍然复杂且困难，而且至少一点乐趣也没有。`nmcli` 工具在这个领域也没有提供太大帮助。在这种情况下，只需启动 `NetworkManager`（或你发行版的等效工具）并使用它即可。你会发现这样做会让你快乐得多。\n\
  \n## 使用 DHCP 获取新地址\n\n`dhclient`\n\n大多数家庭网络和许多业务网络使用动态主机配置协议 (DHCP) 为加入网络的新机器分配\
  \ IP 地址和其他其他关于网络的关键信息。没有 DHCP，任何新机器都必须将所有的网络信息硬编码在内；而有了 DHCP，新机器只需接入网络，请求 DHCP 服务器提供\
  \ IP 地址和其他必要项目，然后自动将 DHCP 服务器的回复整合到其网络配置中。\n\n***\n\n#### Note\n\n以下讨论假设你已经配置了网络设备使用\
  \ DHCP 而不是硬编码设置。不同的 Linux 发行版期望在不同的文件中找到这些信息。基于 Debian 的发行版在 `/etc/network/interfaces`\
  \ 中查找 `iface [interface] inet dhcp` 这一行。红帽派源的发行版则希望在 `/etc/sysconfig/network-scripts/ifcfg-[interface]`\
  \ 中看到 `BOOTPROTO=dhcp`。在这些示例中，请将 `[interface]` 替换为你的接口名称。欲了解更多，请在 Google 上搜索“dhcp\
  \ *your*-*distro*”。\n\n***\n\n有时你的机器在启动时无法连接到 DHCP 服务器，因此你需要手动发起 DHCP 请求。或者你可能遇到了需要新\
  \ IP 地址的网络问题。无论原因何，`dhclient` 命令都会尝试查询任何可用 DHCP 服务器所需的数据（`dhclient` 必须以 root 身份运行）。\n\
  \n点击此处查看代码\n\n# dhclient eth0\n\n```\nInternet Systems Consortium DHCP Client V3.0.2\n\
  \nCopyright 2004 Internet Systems Consortium.\n\nAll rights reserved.\n\nFor info,\
  \ please visit http://www.isc.org/products/DHCP\n\nListening on LPF/eth0/00:0b:cd:3b:20:e2\n\
  \nSending on   LPF/eth0/00:0b:cd:3b:20:e2\n\nSending on   Socket/fallback\n\nDHCPDISCOVER\
  \ on eth0 to 255.255.255.255 port 67 interval 8\n\nDHCPOFFER from 192.168.0.1\n\n\
  DHCPREQUEST on eth0 to 255.255.255.255 port 67\n\nDHCPACK from 192.168.0.1\n\nbound\
  \ to 192.168.0.104 -- renewal in 37250 seconds.\n```\n\n# ifconfig eth0\n\n```\n\
  eth0 Link encap:Ethernet  HWaddr 00:0B:CD:3B:20:E2\n\n     inet addr:192.168.0.104\
