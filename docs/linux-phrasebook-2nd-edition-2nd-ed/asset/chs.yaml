  libby7.jpg\n\n\n\n- `?`（问号）\n- `{ }`（大括号，也称为 braces，故名为：*大括号扩展*）\n***\n### 注意\n\
  大括号与其他三个不同。前三个执行的翻译被 bash 分类为*文件名扩展*（filename expansion），而大括号提供的*大括号扩展*（brace expansion）。前三个仅匹配已存在的文件，而大括号既可以匹配已存在的文件，也可以被用于创建新文件，正如你将看到的。\n\
  ***\n`*` 匹配任意字符，零次或多次。表 1.2 列出了 `*` 的某些用法以及它们匹配的内容。\n![图像](img/00005.jpeg)\n表 1.2\
  \ 通配符 `*` 及其匹配的内容\n`?` 匹配单个字符。表 1.3 列出了 `?` 的某些用法以及它们匹配的内容。\n![图像](img/00006.jpeg)\n\
  表 1.3 通配符 `?` 及其匹配的内容\n`[ ]` 匹配一组单字符（例如 `[12]`，它会匹配 `1` 或 `2` 但不是 `12`；或者 `[abc]`，它会匹配\
  \ `a` 或 `b` 或 `c` 但不是 `ab`、`bc` 或 `abc`）或一个由连字符分隔的字符范围（例如 `[1-3]`，它会匹配 `1`、`2` 或\
  \ `3`）。表 1.4 列出了 `[ ]` 的某些用法以及它们匹配的内容。\n![图像](img/00007.jpeg)\n表 1.4 通配符 `[]` 及其匹配的内容\n\
  `{ }` 也两种匹配：字符串和范围。如果你想对字符串使用大括号扩展，必须用逗号分隔你的列表，然后 bash 会列出所有可能的组合，正如你看到的：\n```bash\n\
  huan.jpg  libby.gif  libby.jpg  libby.png  libby.tiff\nlibby.jpg  libby.png\nhuan.jpg\
  \  libby.jpg\n\n\n\n$ mkdir {dogs,cats,wombats}\ncats  dots  wombats\n\n\n\n$ ls\n\
  $ ls test[a,b]\n$ ls test{a,b}\n$ ls test[ab,bc]\n$ ls test{ab,bc}\n```\n第二和第三条命令\
  \ `test[a,b]` 和 `test{a,b}` 产生相同的结果，因为它们都在寻找单个字符。但一旦你忘记了 `[` 只作用于单个字符，你就会得到意想不到的结果。`test[ab,bc]`\
  \ 命令并没有显示 `testab` 和 `testbc`，而是返回 `testa`、`testb` 和 `testc`，因为根据它的工作原理，你告诉它寻找 `testa`，然后是\
  \ `testb`，最后是 `test` 后面跟着一个逗号！\n在这一节早前的笔记中，我提到大括号扩展也可以用于生成文件以及匹配它们。在第 3 章中，我将介绍\
  \ `mkdir` 命令，它用于创建目录。这是一个示例，我使用大括号扩展快速创建了几个目录：\n```bash\n$ ls\n```\n在这种情况下，我没有匹配已存在的文件或目录（这是\
  \ `*`、`?` 和 `[ ]` 的局限）；相反，我使用大括号告诉 `mkdir` 要创建的新目录的名称。\n重要的是记住，虽然 `[ ]` 匹配单个字符，但\
  \ `{ }` 用于匹配字符串——但只要记住字符串也可以是单个字符！这可能会导致一些困惑，正如你在第四条命令的结果中看到的：\n```bash\ntesta \
  \ testab  testb  testbc  testc\ntesta  testb\ntesta  testb\ntesta  testb  testc\n\
  testab  testbc\n\n\n\n\n\n\n\n\n有趣的是，Mac OS X 将所有 shell 都视为登录 shell，因此你应该直接使用 `.profile`\
  \ 而不是其他任何。\n***\n所以，shell 要么是登录的，要么是非登录的。但它们也可以是交互式的或非交互式的。\n交互式 shell 是会对你输入的命令做出响应的——换句话说，是对你的交互做出响应——并将输出发送到\
  \ STDOUT 和 STDERR（更多信息参见第 5 章](#part0016.html_ch05)构建块](#part0016.html_ch05)”）。非交互式\
  \ shell 就像 shell 脚本使用的那种，在此期间你并没有在输入命令并直接获取输出。\n***\n#### Note\n\n\n\n\nif [ -f\
  \ ~/.bash_aliases ]; then\nfi\n\n\n\n\n如果你想进一步自定义你的 bash 环境，可以查看 `~/.inputrc` 的各种选项。从技术上讲，当你编辑\
  \ `~/.inputrc` 时，你并不是在自定义 bash；而是在自定义 bash 用于编辑命令行的 Readline 库。无论如何，你都可以用该文件做一些非常酷的事情。其中某些用法请参见我的博客文章\
  \ [www.chainsawonatireswing.com/2012/05/13/fun-with-inputrc-part-1/](http://www.chainsawonatireswing.com/2012/05/13/fun-with-inputrc-part-1/)，或者\
