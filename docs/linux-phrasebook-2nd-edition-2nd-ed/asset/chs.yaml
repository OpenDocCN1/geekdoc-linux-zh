  \ 上的操作系统发生变化，就会出现问题。换句话说，如果你以后需要在 `eliot` 上重新安装 Linux，下次你从 `pound` 登录时，将会看到这条严厉的警告：\n\
  \n点击查看代码图片\n\n@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@\n\n@ 警告：远程主机标识已更改！\
  \ @\n\n@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@\n\n可能正在进行某些恶意操作\n\n\
  现在可能有人正在窃听你的通信（中间人攻击）！\n\n也可能是 RSA 主机密钥刚刚发生了更改。\n\n远程主机发送的 RSA 密钥指纹为：\n\n`19:85:59:5c:6a:24:85:53:07:7a:dc:34:37:c6:72:1b`。\n\
  \n请联系系统管理员。\n\n在 `/home/pound/.ssh/known_hosts` 中添加正确的主机密钥以消除此消息。\n\n`/home/pound/.ssh/known_hosts:8`\
  \ 中的违规密钥\n\n`192.168.0.125` 的 RSA 主机密钥已更改，且你请求了严格检查。\n\n主机密钥验证失败。\n\n问题在于，由于重新安装了操作系统，`eliot`\
  \ 上的 SSH 密钥已经更改。当 SSH 检查 `eliot` 的密钥时，它在 `pound` 的 `known_hosts` 文件中存储的是旧密钥，发现不匹配并向你警告。要修复这个问题，只需删除\
  \ `pound` 的 `known_hosts` 中与 `eliot` 对应的一行，保存文件并重新连接。对于 SSH 来说，这是你第一次连接，因此它会询问你是否想要接受该密钥。输入\
  \ yes，一切又恢复正常了。\n\n* * *\n\n提示\n\n我提供了一个 Shell 函数，可以非常方便地从 第 12 章 的“创建一个新的持久函数”中删除\
  \ `known_hosts` 中的问题行。\n\n* * *\n\n### 无密码安全登录另一台机器\n\nssh\n\n本节的名称可能不完全准确，但完全可以通过\
  \ SSH 登录机器，而无需提供密码。如果你每天登录某一台特定的计算机（我有几台机器每天可能会登录几次），那么本节中的技术将让你非常开心。\n\n假设你想能够从\
  \ `pound`（用户名：`ezra`）登录到 `eliot`（用户名：`tom`），而无需输入密码。首先，使用以下命令在 `pound` 上创建一个 SSH\
  \ 身份验证密钥：\n\n点击查看代码图片\n\n```\n$ ssh-keygen\n```\n\n正在生成公/私钥 rsa 密钥对。\n\n输入保存密钥的文件路径\
  \ (/home/ezra/.ssh/id_rsa)：\n\n输入密码（留空表示无密码）：\n\n再次输入相同的短短：\n\n您的身份标识已保存到 `/home/ezra/.ssh/id_rsa`。\n\
  \n您的公钥已保存到 `/home/ezra/.ssh/id_rsa.pub`。\n\n密钥指纹为：\n\n`d0:c8:8c:a3:6e:c5:bd:d5:e8:0f:c8:45:6c:75:09:25\
  \ ezra@pound`\n\n密钥的随机艺术图像为：\n\n```\n+--[ RSA 2048]----+\n|            Eoo.  |\n\
  |\n|      + + . o.    |\n|     oooo = =         |\n|�|   o o + o       |\n|\n�������.\
  \ o . S .     |\n| . . . *          |\n|    o   + o       |\n| .             |\n\
  |             .�.    |\n+-----------------+\n```\n\n* * *\n\n注意\n\n你对于使用 `-t` 创建的密钥类型三种选择：`dsa`（数字签名算法的缩写）、`rsa`（以创建者的姓氏命名）以及\
  \ `ecdsa`（椭圆曲线数字签名算法的缩写）。\n\n\n\n\n\n想要对 FTP 进行一次精彩、彻底、有时甚至是粗俗的批判，并了解为什么没人应该使用它，请参\
  \ [`mywiki.wooledge.org/FtpMustDie`](http://mywiki.wooledge.org/FtpMustDie)。\n\n\
  如果你能通过 `SSH` 访问机器，你也可以对其进行 `SFTP` 访问。若要从 `pound` (192.168.0.15；用户名 `ezra`) 使用 `sftp`\
  \ 命令连接到 `eliot` (192.168.0.25；用户名 `tom`)，只需使用此命令即可：\n\n```\n$ sftp tom@192.168.0.25\n\
  Connecting to 192.168.0.25...\ntom@192.168.0.25's password:\nsftp>\n```\n\n如果你读过之前的章节“无密码安全地登录另一台机器”，你可能疑惑为什么会提示你输入密码。你是正确的：之前的示例是在设置无需密码的连接之前完成的。完成设置后，你将看到类似这样的登录：\n\
  \n```\n$ sftp tom@192.168.0.25\nConnecting to 192.168.0.25...\nsftp>\n```\n\n通过\
  \ `sftp` 登录后，你可以运行的命令非常标准。表 16.1 列出了一些常用命令；完整列表请查看 `man sftp`。\n\n![Image](img/00034.jpeg)\n\
  \n表 16.1 **常用的 SFTP 命令**\n\n提示\n\n在配置 `SSH` 服务器时，管理员有时会将 `SSH` 使用的默认端口从 22 更改为其他值以提高安全性。这并不是魔法，但对于某些脚本小子（script\
  \ kiddies）来说，这是一个实用的阻碍。\n\n如果你通过 `sftp` 连接的 `SSH` 服务器更改了默认端口，那么你将无法连接。若要使用非默认的 `SSH`\
  \ 端口（或处理服务器管理员对 `SSH` 做的任何其他特殊更改），你需要在 `sftp` 命令中使用 `-o` 传递选项，后接特定的 `SSH` 选项。例如，如果\
  \ `SSH` 服务器使用端口 2345 而不是 22，你将使用 `sftp -oPort=2345` 进行连接（注意 `-o` 和 `SSH` 选项之间没有空格）。如果你必须包含额外的\
  \ `SSH` 选项，只需重复 `-o`，如下：`sftp -oPort=2345 -oPasswordAuthentication=no`（完整列表请查阅 `man\
  \ ssh_config`）。\n\n### 在主机之间安全地复制文件\n\n#### scp\n\n如果你赶时间，并且需要从一台机器安全地复制文件到另一台机器，那么\
  \ `scp`（安全复制）就是你想要的。本质上，使用 `scp` 的基本模式如下：\n\n点击此处查看代码图像\n\n```\nscp user@host1:file1\
  \ user@host2:file2\n```\n\n这与老牌 `cp` 的语法基本相同，但现在扩展到了网络。通过示例会让一切变得更清晰。假设你想使用 `scp`\
  \ 从 `pound` (192.168.0.15；用户名 `ezra`) 将 `backup.sh` 复制到 `eliot` (129.168.0.25；用户名\
  \ `tom`) 的 `/home/tom/bin` ：\n\n点击此处查看代码图像\n\n```\n$ pwd\n/home/ezra\n$ ls ~/bin\n\
  backup.sh\n$ scp ~/bin/backup.sh tom@192.168.0.25/home/tom/bin\nbackup.sh      \
  \       100% 8806      8.6KB/s   00:00\n$\n```\n\n你没有被提示输入密码，是因为你之前在“无密码安全地登录另一台机器”中设置了设置，使得\
  \ `SSH` 从 `pound` 连接到 `eliot` 不需要密码，而且因为 `scp` 依赖于 `SSH`，所以这里你也不需要密码。如果你没有那样做，在继续之前会被要求输入\
  \ `tom` 的密码。\n\n假设你有几个 JPEG 想从 `pound` 传输到 `eliot`。没问题——只需使用通配符：\n\n点击此处查看代码图像\n\
  \n```\n$ ls -1 ~/covers\nearth_wind_&_fire.jpg\nhandel_-_chamber_music.jpg\nsmiths_best_1.jpg\n\
  strokes_-_is_this_it.jpg\nu2_pop.jpg\n$ scp *.jpg tom@192.168.0.25:/home/tom/album_covers\n\
  earth_wind_&_fire.jpg   100% 44KB  43.8KB/s\nhandel_-_chamber_music.jpg  100% 12KB\
  \  12.3KB/s\nsmiths_best_1.jpg             100% 47KB  47.5KB/s\nstrokes_-_is_this_it.jpg\
  \     100% 38KB  38.3KB/s\nu2_pop.jpg                  100%\n```\n\n你没有被提示输入密码，是因为你之前在“无密码安全地登录另一台机器”中设置了设置，使得\
  \ `SSH` 从 `pound` 连接到 `eliot` 不需要密码，而且因为 `scp` 依赖于 `SSH`，所以这里你也不需要密码。如果你没有那样做，在继续之前会被要求输入\
  \ `tom` 的密码。\n\n\n\n\n\n`E-commerce/2005/Books/20050827 The State We're In.txt`\n\
  \n`E-commerce/2005/Books/20050827 ebay LIL ABNER FRAZETTA SUNDAYS 2.txt`\n\n`connectivity/connectivity_info.txt`\n\
  \n[结果因长度限制大幅截断]\n\n文件数量：107805\n传输文件数量：120\n总文件大小：6702042249 字节\n总传输文件大小：15337159\
  \ 字节\n字面数据：0 字节\n匹配数据：0 字节\n文件列表大小：2344115\n文件列表生成时间：86.041 秒\n文件列表传输时间：0.000 秒\n\
  发送总字节：2345101\n接收总字节：986\n发送 2345101 字节  接收 986 字节  7507.48 字节/sec\n总大小为 6702042249\
  \  加速倍数为 2856.69\n\n看看这些结果。`rsync` 首先构建一个它必须考虑的所有文件列表——在本例中为 107,805 个——然后删除目标端（`wordsworth`）上源端（`coleridge`）不再存在的任何文件。在这个示例中，删除了六个文件：一个来自*Linux\
  \ 杂志》（*Linux Magazine*）文章的备份文件（`~` 符号就能看出是它）、两个关于电子投票的 PDF 文件，然后是三份购买书籍的文本收据。\n\n\
  在删除文件后，`rsync` 会拷贝任何更改的文件，或者如果是同一个文件，则只拷贝文件的更改部分，这也是 `rsync` 如此高效的原因之一。在这种情况下，拷贝了六个文件。事实证明，两个\
  \ PDF 文件实际上被移动到了新的子目录，但对 `rsync` 来说，它们是新文件，因此它们被完整地拷贝。三个文本收据也是如此。`A history of free\
  \ speech.txt` 文件是一个完全全新的文件，所以它也被拷贝到了 `wordsworth`。\n\n在列出它所做的更改后，rsync 会给你一些关于整个传输的信息。传输了\
  \ 120 个文件，共 6702042249 字节（约 6.4GB）中的 15337159 字节（约 14MB）。其他数据点包含在汇总中，但这些是关键点。\n\n\
  现在让我们来看看要求计算机的操作。命令的头部和尾很容易理解：开头的命令 `rsync`，然后是选项，接着是你从哪里拷贝的源目录（`/home/sam/documents/`，位于\
  \ `coleridge` 上），最后是你要拷贝到的目标目录（`/media/backup/documents`，位于 `wordsworth` 上）。在继续检查选项之前，你只需要关注源目录和目标目录指定的方式，因为其中有一个陷阱，如果你不注意，将会非常麻烦。\n\
  \n你想拷贝 `coleridge` 上的 `documents` 目录的内容，而不是该目录本身，这就是为什么你使用 `documents/` 而不是 `documents`。`/home/sam/documents/`\
  \ 中 `documents` 后的斜杠告诉 `rsync`，你想要将该目录的*内容*拷贝到 `wordsworth` 上的 `documents` 目录中；如果你使用\
  \ `documents`，你将拷贝目录*以及*其内容，导致在 `wordsworth` 上产生 `/media/backup/documents/documents`。\n\
  \n***\n\n### 注意\n斜杠只对源目录重要；在目标目录上使用斜杠并不所谓。\n\n***\n\n现在来看你使用的选项。\n\n`-v`（或 `--verbose`）选项配合\
  \ `--progress`，命令 `rsync` 随时向你详细说明它正在做什么。你在在本节之前显示的结果中看到了这一点，其中 `rsync` 告诉它正在删除什么以及正在拷贝什么。如果你通过自动化脚本运行\
  \ `rsync`，你不需要这个选项，尽管它并无坏处；如果你是交互式运行 `rsync`，那么这个显示信息对你来说非常有用，因为你可以看到发生了什么。\n\n\
  你在 `rsync` 结果末尾看到的元数据——关于传输文件数量和大小的信息，以及其他有趣的数据——之所以出现是因为你包含了 `--stats` 选项。再次，如果你在编写\
  \ `rsync` 脚本，则不需要它，但如果你是手动运行程序，看到它确实很棒。\n\n`-a`（或 `--archive`）是重头戏，因为它实际上是*七*其他选项的缩写：`-rlptgoD`。让我们按顺序来看这些选项。\n\
  \n- 你在其他命令中多次见过 `-r`（或 `--recursive`）选项，它在这里的作用与在其他任何地方一样。它不会停在当前目录，而是向下遍历所有子目录，影响其路径上的所有内容，使你能够拷贝整个\
  \ `documents` 目录及其所有内容。\n- 当在源端发现软链接时，`-l`（或 `--links`）选项会在目标端重新创建该链接。它不是拷贝实际文件（这显然不是创建者想要的）。\n\
  - 当在源端发现软链接时，`-l`（或 `--links`）选项会在目标端重新创建该链接。它不是拷贝实际文件。\n- 权限在之前讨论过，但这里它们再次出现了。。`-p`（或\
  \ `--perms`）选项告诉 `rsync` 更新目标文件上的权限。同样适用于 `-o`（或 `--owner`）和 `-g`（或 `--groups`）。\n\
  - `-t`（或 `--times`）选项让 `rsync` 连同文件的修改时间一起传输。如果你不包含这个选项，`rsync` 将无法告知之前传输了什么。\n\
  - 最后，对于强大的 `-a` 而言，`-D` 本身是两个选项的缩写：`--devices` 和 `--specials`。前者传输设备文件（例如硬盘和光驱器），后者发送特殊文件（例如命名管道和\
  \ FIFO）。你可能不需要担心它，但 `-D` 是 `-a` 的一部分。\n- 即使在快速连接下，使用 `-z`（或 `--compress`）选项也是个主意，因为\
  \ `rsync` 在传输文件时使用 `gzip` 压缩。在慢连接上，这个选项是强制的；在快速连接上，它节省了时间。\n- 出于考虑，你使用了 `-e`（或 `--rsh=ssh`）选项，它告诉\
  \ `rsync` 使用 SSH 传输其所有流量。传输容易，而且安全？算我一个！\n\n***\n\n### 注意\n如果你使用 SSH，为什么你不需要提供密码？因为你使用了无密码安全登录另一台机器的方法来这样做。\n\
  \n***\n\n我们把最危险的留在最后：`--delete`。如果你正在创建文件的镜像，你显然希望该镜像尽可能准确。这意味着源端删除的文件也需要从目标端删除。但这意味着你可能会意外删掉你想保留的内容。如果你打算使用\
  \ `--delete` 选项——你很可能会这样做——请务必使用在警告中提到的 `-n`（或 `--dry-run`）选项。\n\n***\n\n### 警告\n\
  有一个选项之前没有列出，但在你确定 `rsync` 命令结构时，仍然是一个*非常*好主意包含进去：`-n`（或 `--dry-run`）。如果你包含了该选项，`rsync`\
  \ 会运行，但不会实际删除或拷贝任何内容。如果你的选择会导致重要文件的删除，这将会是救命稻草。在提交你的 `rsync` 命令之前，特别是当你包含了上一段的 `--delete`\
  \ 选项时，为自己一个，先进行模拟运行。\n\n***\n\n\n\n\n\n`rsync` 还有许多其他选项和使用该命令的其他方法（`man` 页面列出了它的八种使用方式，这令人印象深刻），但本节讨论的设置绝对能让你快速上手。在终端中打开\
  \ `man rsync`，或者在 Google 上搜索“rsync tutorial”，你将发现大量的绝佳信息。了解 `rsync`：当你在删除一个文件后大喊“噢，不！”，但随后紧接着又叹出一句“呼！它已经用\
  \ `rsync` 备份了！”时，你会很庆幸花时间学习了这个极其多功能且实用的命令。\n\n***\n\n### 小贴士\n\n如果你想让你的数据绝对安全，可以将\
  \ `rsync` 设置为通过常规 `cron` 任务运行。例如，创建一个名为 `backup.sh` 的文件（放在 `~/bin` 目录下是个不错的地方），并输入你一直在使用的命令：\n\
  \n点击此处查看代码图片\n\n```\n$ rsync -avze ssh --progress --stats --delete /home/sam/documents/will@wordsworth:/media/backup/documents\n\
  ```\n\n使用 `chmod` 使该文件可执行：\n\n点击此处查看代码图片\n\n```\n$ chmod 755 /home/scott/bin/backup.sh\n\
  ```\n\n然后将以下几行添加到名为 `cronfile` 的文件中（我也把它放在了我的 `~/bin` 目录）：\n\n点击此处查看代码图片\n\n```\n\
  # 每天早上 3:05 备份文档\n05 03 * * * /home/scott/bin/backup.sh\n```\n\n第一行是解释该任务目的的注释，第二行告诉\
  \ `cron` 每天凌晨 3:05 自动运行 `/home/scott/bin/backup.sh`。\n\n现在将该任务添加到 `cron`：\n\n点击此处查看代码图片\n\
  \n```\n$ crontab /home/scott/bin/cronfile\n```\n\n现在你再也不用担心备份问题了。一切都为你自动化了——只需确保你晚上让电脑开启即可！\n\
  \n（关于 `cron` 的更多信息，请参阅 `man cron` 或 [www.unixgeeks.org/security/newbie/unix/cron-1.html](http://www.unixgeeks.org/security/newbie/unix/cron-1.html）上的“新手教程：cron\
  \ 简介”）。\n\n***\n\n### 非交互式下载文件\n\n#### wget\n\n网络是一个可以下载的图片、电影和音乐宝库。问题是，从包含 200\
  \ 个 MP3 的集中手动下载每个文件会很快变得枯燥，导致大脑腐化和口水不受控制地。`wget` 命令用于在不受干扰的情况下下载文件和网站；你只需启动命令，它就会乐快地下载你指定的任何内容，一持续几个小时。\n\
  \n当然，棘手的部分在于设置命令。`wget` 是另一个超级强大的程序，完全值得专门写本书，所以我们没有空间向你展示它能做的一切。相反，你将专注于使用 `wget`\
  \ 完成两件事：下载一大堆文件（本文在此处讨论），以及下载整个网站（将在下一节介绍）。\n\n前提是：你发现了一个名为“The Old Time Radio Archives”（旧时代广播节目存档）的精彩网站。这个网站有很多复古广播节目，可以以\
  \ MP3 格式下载——准确来说有 365 个 MP3，一年中的每一天一个。能抓取这些 MP3 当然很棒，但都要右键点击每个 MP3 超链接、选择“另存为链接”，然后点击确定开始下载，前景并不那么吸引力。\n\
  \n进一步检查目录结构，你发现 MP3 是按如下的目录结构组织的：\n\n点击此处查看代码图片\n\n```\nhttp://www.oldtimeradioarchives.com/mp3/\n\
  \    season_10/\n    season_11/\n    season_12/\n    ...\n    season_20/\n    season_21/\n\
  \    ...\n    season_3/\n    season_4/\n    ...\n    season_9/\n```\n\n***\n\n###\
  \ 注意\n\n目录并不是按照人类习惯的数字顺序排序的，而是按照字母顺序排序的，除非另有说明，否则计算机就是这样排序数字的。毕竟在字母顺序中，“ten”（十）排在“three”（三）之前。\n\
  \n***\n\n每个目录内部都存放着 MP3。有些目录里只有几个文件，有些则接近 20 个。如果你点击目录链接，你会得到一个网页，列出该目录下的文件，如下所示：\n\
  \n点击此处查看代码图片\n\n[返回] 上级目录\n\n\n\n\n\n另一方面，`-R`（或 `--reject`）选项告诉 `wget` 你不想要什么：HTML\
  \ 和 GIF 文件。通过拒绝这些文件，你就不会再看到之前显示的那些由 `[SND]` 表示的小音符符号了。用逗号分隔你的后缀名列表，例如 `-R.html,.gif`。\n\
  \n使用这些选项运行 `wget` 将将 365 个 MP3 文件下载到你的计算机。如果由于某种原因传输中断了——你的路由器坏了、有人绊倒了你的以太网线并将其从机箱上拔出、或者一台挖掘机挖断了接入你公司的光纤——只需重复该命令，但加上\
  \ `-c`（或 `--continue`）选项。这告诉 `wget` 从它强制停止的地方继续执行。这样你就不需要重新下载所有内容了。\n\n***\n\n####\
  \ Note\n\n下面的示例已经不再有效，但我保留它是因为它很好地解释了这些概念。千万不要亲自尝试！\n\n***\n\n这里另一个使用 `wget` 下载文件的示例。一位伦敦\
  \ DJ 发布了两个专辑长度的 MP3，这些内容由披头士乐队（The Beatles）和野兽少年组合（The Beastie Boys）的混音组成，我们我们得到了\
  \ The Beastles。这些 MP3 文件一个接一个列在 [www.thebeastles.com](http://www.thebeastles.com)\
  \ 上。以下命令从该网页中提取链接，将它们写入文件，然后使用 `wget` 开始下载这些链接：\n\n点击此处查看代码图像\n\n```\n$ lynx -dump\
  \ http://www.djbc.net/beastles/ | awk '/http/{print $2}' | grep mp3 > beastles ;\
  \ wget -i beastles\n\n--12:58:12--  http://www.djbc.net/beastles/webcontent/djbc-holdittogethernow.mp3\n\
  \n             => 'djbc-holdittogethernow.mp3'\n\nResolving www.djbc.net... 216.227.209.173\n\
  \nConnecting to www.djbc.net|216.227.209.173|:80... connected.\n\nHTTP request sent,\
  \ awaiting response... 200 OK\n\nLength: 4,533,083 (4.3M) [audio/mpeg]\n\n100%[=========>]\
  \ 4,533,083     203.20K/s   ETA 00:00\n\n12:58:39 (166.88 KB/s) - 'djbc-holdittogethernow.mp3'\
  \ saved [4533083/4533083]\n\n[结果因长度截断]\n```\n\n尽管几乎所有人都使用 Firefox、Chrome 或 Safari\
  \ 等基于 GUI 的 浏览器，但如果你追求速度、安全或可脚本性，那么命令行文本浏览器仍然大有用之地。有很多选择——查看 `links`、`elinks` 和\
  \ `w3m`——但我非常喜欢 `lynx`，它包含在许多发行版中。如果你的计算机上还没有，你随时可以使用包管理器安装 `lynx`（参见第 14 章）。\n\n\
  如果你使用 `-dump` 选项调用 `lynx` 并将其指向一个 URL，链接将从页面中提取并显示在标准输出（STDOUT）上，每行都以数字开头。要去掉数字，你可以使用\
  \ `awk`（在第 7 章的“文件中打印特定字段”中讨论）来过滤它们。你将这些链接通过给 `grep`，让 `grep` 过滤掉所有不包含 `mp3` 的行，然后生成的\
  \ MP3 链接重定向到名为 `beastles` 的文本文件中。（管道和重定向在第 5 章的“构建块”中有所介绍，而 `grep` 命令在第 10 章的“查找文件、目录、单词和短语”中有所介绍。）\n\
  \n分号（在第 5 章的“顺序运行多个命令”章节中介绍）结束该命令并启动新命令：`wget`。`-i`（或 `--input-file`）选项告诉 `wget`\
  \ 从文件中查找要下载的 URL，而不是标准输入（STDIN）。如果你有许多链接，将它们全部放在文件中并在使用 `wget` 时使用 `-i` 选项。在这种情况下，你将\
  \ `wget` 指向通过 `dog` 和 `grep` 创建的 `beastles` 文件，MP3 就会一个接一个开始下载。\n\n现在真的，还有什么能更简单呢？啊，Linux\
  \ 命令行的力量！\n\n***\n\n#### Note\n\n正如你所学的，`wget` 是用于下载文件的。\n\n### 交互式下载网站\n\n正如你所学的，`wget`\
  \ 是用于下载文件的。但如果你想从一个网站下载不连续的文件呢？你可以使用 `wget` 下载整个网站，但你必须小心。要下载整个网站，你可以使用：\n\n***\n\
  \n#### Note\n\n下面的示例已经不再有效，但我保留它是因为它很好地解释了这些概念。千万不要亲自尝试！\n\n### 下载网站\n\n正如你所学的，`wget`\
  \ 是用于下载文件的。但如果你想从一个网站下载不连续的文件呢？你可以使用 `wget` 下载整个网站，但你必须小心。要下载整个网站，你可以使用：\n\n\n\n\
  \n\n乍看之下，`wget` 和 `curl` 似乎非常相似：它们都可以以非交互模式下载文件。然而，在许多细微区别中，它们之间有一个巨大的不同：`curl`\
  \ 在指定下载内容时支持序列和集合，而 `wget` 不支持；而 `wget` 支持递归，这是 `curl` 所欠缺的功能。\n\n***\n\n### 注意事项\n\
  \n这两个程序还有许多其他差异。`curl` 功能的完整列表可以参见“Features—What Can `curl` Do”([`curl.haxx.se/docs/features.html`](http://curl.haxx.se/docs/features.html))，而\
  \ `wget` 的部分功能列在“Overview”（[www.gnu.org/software/wget/manual/html_node/Overview.html](http://www.gnu.org/software/wget/manual/html_node/Overview.html))中。cURL\
  \ 网站在“Compare cURL Features with Other FTP+HTTP Tools”处有一个对比 `curl` 与其他相似程序的图表（[`curl.haxx.se/docs/comparison-table.html`](http://curl.haxx.se/docs/comparison-table.html)）；虽然该图表很有参考价值，但意料之中，它稍微偏向\
  \ `curl`。\n\n***\n\n这里有一个使用 `curl` 支持序列的能力来指定下载内容的示例。优秀的美国公共广播电（NPR）节目 *This American\
  \ Life* 在其父网站上以 Real Audio 格式提供了所有节目的存档下载（至于他们为什么选择 Real 而不是更开放的格式这还是个谜）。如果你想下载这\
  \ 10 个 Real Audio 文件，只需使用以下命令：\n\n点击此处查看代码图像\n\n```\n$ curl -O http://www.wbez.org/ta/[1-10].rm\n\
  \n[1/10]: http://www.wbez.org/ta/1.rm --> 1.rm\n\n--_curl_--http://www.wbez.org/ta/1.rm\n\
  \n[Results greatly truncated]\n```\n\n注意你如何使用 `[1-10].rm` 来指定想要下载 `1.rm`、`2.rm`、`3.rm`\
  \ 等文件。如果 WBEZ 将文件命名为 `one.rm`、`two.rm` 和 `three.rm`，那么你就可以使用部分集：\n\n点击此处查看代码图像\n\
  \n```\n$ curl -O http://www.wbez.org/ta/{one,two,three}.rm\n```\n\n`-O`（或 `--remote-name`）选项是绝对必须的。如果不使用它，`curl`\
  \ 将把下载的输出写入 `STDOUT`，这意味着你的终端将迅速填满无法使用的乱码。`-O` 要求 `curl` 将其下载的内容写入文件，并使用下载的文件名作为本地文件名。\n\
  \n***\n\n### 注意事项\n\n之前的示例已经过时且无法再次工作，但我保留了它，因为它展示了 `curl` 的用处。\n\n***\n\n我们仅仅触及了\
  \ `curl` 的冰角。它的 `man` 页面虽然没有 `wget` 的那么长，但也充满了有用信息，如果你想最大限度地利用 `curl`，你就必须阅读它。请将其视为必读内容。\n\
  \n### 结论\n\n本章中的命令是我个人最喜的一些，因为它们允许我完成那些原本极其无味、不安全或困难的任务。所有命令都让网络成为你数据、程序和想象力的另一个通道，而这正是\
  \ Linux 发光异彩的地方。通过向用户免费提供 `ssh`、`rsync`、`wget` 和 `curl` 这样强大的工具，Linux 促进了创新和安全，而这在许多人被迫使用的其他操作系统上是不可能的。投入学习\
  \ `ssh`，这样你就可以安全地连接到其他计算机，精通 `rsync` 以安全的自动化备份，并依靠 `wget` 和 `curl` 以最高效的方式专门下载所需内容。你会感谢自己这么做的！\n\
