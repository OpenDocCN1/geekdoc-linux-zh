  \n在本示例中，`mkdir` 命令创建了目录 `my_dir`，`cd` 命令进入了目录。\n\n另一种组合命令的强大方法是使用逻辑与运算符 `&&`。该运算符允许只有在前一个命令成功时才执行第二个命令。\n\
  \n例如，如果你想创建一个目录，如果成功就进入该目录，你可以运行：\n\n```bash\nmkdir my_dir && cd my_dir\n```\n\n\
