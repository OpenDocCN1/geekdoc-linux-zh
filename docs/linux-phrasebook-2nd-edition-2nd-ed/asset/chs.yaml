  ### 如果屏幕内容太多，请重置\n```bash\n```\n这是你的第一个命令，在你阅读这本书的过程中你可能会用到它：`clear`。假设你一直在测试好几个命令，有些成功了，有些则不尽如人意。你的终端现在充满了命令、输出、错误和垃圾信息。要让这一切消失，只需输入\
