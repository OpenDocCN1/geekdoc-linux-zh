  \n点击此处查看代码图片\n\n```\nhead -c 100KB Canterbury_Tales.txt\nHere bygynneth the Book\
  \ of the Tales of Caunterbury\n\nGeneral Prologue\n\nWhan that Aprill, with his\
  \ shoures soote\n```\n\n要查看《坎特堡故事》的前 100 兆字节，你可以使用……不，那会占据一整本书！但如果你真的想这么做，试试这个：\n\
  \n点击此处查看代码图片\n\n```\nhead -c 100MB Canterbury-Tales.txt\n```\n\n这里的 `MB` 代表 1000000\
