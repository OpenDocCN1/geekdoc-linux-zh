  ```\n[由于长度限制，结果大幅截断]\n\n即使过滤掉除一人以外的所有用户，列表中仍然剩下 3,039 行。尽管如此，这里仍有一些有趣的项目。例如，看起来\
  \ Evolution（一个电子邮件和个人信息管理程序）在你不知情或无此意愿的情况下一直在运行。此外，Opera 网页浏览器也在运行，这是符合预期的，而且它打开的网页之一在使用\
  \ Arial Bold 字体，其他文件如此。\n\n如果你管理一台多人使用的机器，可以尝试对用户使用 `lsof -u`。你可能会发现他们运行了一些不该运行的程序。如果你是\
  \ Linux 机器上的唯一用户，尝试对自己运行 `lsof -u`——你可能会发现自己运行了一些你并未察觉的程序！\n\n## 列出特定文件的用户\n\n在上一节中，你看到了某个特定用户打开了什么。让我们反过来操作，看看谁在使用某个特定文件。要这样做，只需在\
  \ `lsof` 后面加上系统路径。例如，让我们看看是谁在使用用于远程连接这台计算机的 SSH 守护进程（记住 `lsof` 必须以 root 身份运行）。点击此处查看代码\n\
  \n```\nlsof /usr/sbin/sshd\nCOMMAND     PID  USER  FD  TYPE     DEVICE      SIZE\
  \      NODE NAME\nsshd      7814  root txt   REG           3,1   27842 67453 /usr/sbin/sshd\n\
  sshd      10542  root txt   REG           3,1   27842 67453 /usr/sbin/sshd\nsshd\
  \      10548  scott txt   REG           3,1   27842 67453 /usr/sbin/sshd\n```\n\n\
  这就是你要的结果：两个用户，root 和 scott。如果这里出现了一个意想不到的用户——比如 `ood`——你就知道你的系统被入侵了。是的，`sshd` 是一个程序，但记住，那是从你的视角来看的。对于\
  \ Linux 来说，`/usr/sbin/sshd` 只是另一个文件。\n\n### 列出特定程序的进程\n\n在上一节中，你看到了谁在使用 `/usr/sbin/sshd`。你收到的结果并没有说明全部。任何特定程序实际上都是由几个（可能是许多）其他进程、套接字（sockets）和设备的调用组成的，所有这些在\
  \ Linux 看来都表现为更多文件。要找到某个特定运行程序的所有其他文件，请跟 `lsof` 使用 `-c` 选项，然后跟上运行中的（因此是“打开”的）程序名称。例如，`lsof\
  \ /usr/sbin/sshd` 显示与该精确文件关联的只有两个用户和三个打开的文件。但整个 `sshd` 命令又是呢？点击此处查看代码\n\n```\nlsof\
  \ -c sshd\nCOMMAND     PID  USER  FD  TYPE     DEVICE      SIZE      NODE NAME\n\
  sshd      10542  root mem   REG           3,1   37480 27362 /lib/tls/i686/cmov/libnss_files-2.3.so\n\
  sshd      10542  root mem   REG           3,1   34612 27396 /lib/tls/i686/cmov/libnss_nis-2.3.so\n\
  sshd      10542  root mem   REG           3,1   86596 27536 /lib/ld-2.3.so\nsshd\
  \      10542  root 0u  CHR           1,3    1237 /dev/null\nsshd      10542  root\
  \ 1u  CHR           1,3    1237 /dev/null\nsshd      10542  root 2u  CHR       \
  \    1,3    1237 /dev/null\nsshd      10542  root 3u  IPv6           28186 TCP 192.168.0.170:ssh->192.168.0.100:4577\
  \ (ESTABLISHED)\nsshd      10542  root 5u  unix 0xf296180               28227 socket\n\
  sshd      10548  scott cwd   DIR           3,1    656          2\nsshd      10548\
  \  scott rtd   DIR           3,1     656          2\nsshd      10548  scott txt\
  \   REG           3,1   27892 67453 /usr/sbin/ssh\nsshd      10548  scott 3u  IPv6\
  \           28186 TCP 192.168.0.170:ssh->192.168.0.100:4577 (ESTABLISHED)\n```\n\
  [结果截断]\n\n在前面的代码中，你可以看到 94 行（代表 94 个打开的文件）以某种方式与 `sshd` 程序连接。其中一些 `.so` 文件（共享对象，类似于\
  \ Windows 上的 DLL），少数几个显示了此与另一台机器之间发生了网络连接（实际上，网络上的另一台机器通过 SSH 连接到这台机器；更多信息请参见“安全连接到另一台计算机](part0031.html_ch16)]网络工作]）。你可以通过在计算机上应用\
  \ `lsof` 来发现大量内容；至少你将了解到现代程序是如何的。用你每天使用的软件试试，你可能会对努力提供该工具的程序员产生新的感激。\n\n`lsof` 命令有惊人的大量选项，而你只会查看其中一小部分。`lsof`\
  \ 的源码包含一个名为 `0QUICKSTART`（开头有两个零）的文件，它是该命令一些强大功能的教程。搜索该文件名并开始阅读吧。\n\n## 显示系统 RAM\
  \ 信息\n\n现在，大多数计算机配有数百兆甚至几 GB 的 RAM，但仍然可能因为大量内存占用或虚拟内存交换导致你的机器变慢。要查看系统内存的当前状态，请使用\
  \ `free` 命令。点击此处查看代码\n\n```\n$ free\n      total  used free shared cached\nMem:\
  \   1036136 995852  40284      0  80816 332264\n-/+ buffers/cache:   582772 453364\n\
  Swap:   1012084 495584 516500\n```\n\n默认情况下，`free` 以 KB 显示结果，与使用 `-k` 选项相同。不过，你可以它。`-b`\
  \ 选项以字节显示内存占用，而 `-m`（你可能大部分时间应该使用它）使用兆。点击此处查看代码\n\n```\n$ free -m\n            \
  \ total used free shared cached\nMem:   1011  963   48      0   78   316\n-/+ buffers/cache:\
  \   569   442\nSwap:   988  483   504\n```\n\n从 `free` 的输出中，你可以看到这台机器有 1011MB 可用物理\
  \ RAM（实际上是 1024MB，但 `free` 显示为 1011MB，因为内核占据了剩余的 13MB，因此它无法提供给其他用途）。第一行使其看起来其中有\
  \ 963MB 已占用，只剩下 48MB RAM 空闲。这里还有近 1GB 的交换分区（或虚拟内存），且其中一半（即 483MB）已经被使用。至少看起来是这样。\n\
  \n\n\n\n然而，事情并没有那么简单。重要的一行是中间那行，标记为 `-/+ buffers/cache`。硬盘使用缓冲区（Linux 为进程保留的内存）和缓存（存储在未使用的内存中的最近访问的文件，以便快速检索）来加速访问，如果程序需要这些内存，它们可以快速为该程序释放出来。从运行在这台\
  \ Linux 机器上的应用程序的角度来看，当前已使用 569MB 的 RAM。要得到最后那个数字，请从第一行的 963MB 开始，然后减去 78MB 的缓冲区和\
  \ 316MB 的缓存文件。你的总数是多少？569MB，这就是在第二列中显示为 `used` 的数字。目前可用的空闲 RAM 总量为 442MB（从 1011MB\
  \ 中减去 569MB），而且这些都是于你可用的交换空间（swap space）之外的。在内存管理方面，Linux 的高效性是不言而喻的。\n\n***\n\n\
  ### 小贴士\n\n关于 `free` 命令和 Linux 内存管理的更多信息，一个优秀的网站是 LinuxMM，它是“一个记录内存管理工作原理并协调新内存管理开发项目的维基”([`linux-mm.org`](http://linux-mm.org))。如果想看没简单一点，请访问\
  \ [www.linuxatemyram.com](http://www.linuxatemyram.com)。\n\n***\n\n### 显示文件系统磁盘占用\n\
  \n#### df\n\n`free` 命令处理你系统上的 RAM；同样，`df` 命令（想象为 *disk free*，磁盘空闲）处理你拥有的硬盘空间。运行\
  \ `df`，你将获得一个每个挂载系统的可用和已用磁盘空间列表。\n\n点击此处查看代码图片\n\n```\n$ df\nFilesystem 1K-blocks\
  \     Used Available Use% Mounted on\n/dev/hda1   7678736  5170204   2508532  68%\
  \ /\ntmpfs         518068         0    518068   0% /dev/shm\ntmpfs         518068\
  \      12588    505480   3% /lib/modules/2.6.12-10-386/volatile\n/dev/hda2   30369948\
  \ 24792784   5577164  82% /home\n```\n\n在详细查看这些结果之前，让我们让它们更容易读一点。`df` 命令默认以 KB 为单位显示结果，但如果你改用\
  \ `-h`（或 `--human-readable`，人类可读）选项，通常更容易理解。\n\n点击此处查看代码图片\n\n```\n$ df -h\nFilesystem\
  \       Size  Used Avail Use% Mounted on\n/dev/hda1        7.4G  5.0G  2.4G  68%\
  \ /\ntmpfs           506M    0  506M   0% /dev/shm\ntmpfs           506M   13M \
  \ 494M   3% /lib/modules/2.6.12-10-386/volatile\n/dev/hda2        29G   24G  5.4G\
  \  82% /home\n```\n\n“人类可读”（顺便说一下，这是一个很棒的词）意味着字节用 `K` 表示，兆字节用 `M` 表示，吉字节用 `G` 表示。你可以在前面的列表中看到最后两个。\n\
  \n那么结果意味着什么呢？你的硬盘有两个分区：挂载在 `/` 的 `/dev/hda1` 和挂载在 `/home` 的 `/dev/hda2`。`/home`\
  \ 分区被分配了 29GB 空间，其中 82% 目前已使用，剩余约 5.4GB 空闲。对于该分区的磁盘空间，还没到恐慌的时候，但如果还有很多个 CD 数量的 MP3，可能是时候删除一些不必要的文件了。\n\
  \n根分区（或 `/`）的可用空间较少：7.4GB 中仅剩 2.4GB。不过，该分区不太可能会增长，因为它包含了程序和其他静态文件。诚然，那里有 `/var`，而那里是软件安装程序（你将在\
  \ 第 14 章 中发现）以及其他大小变化的文件（如日志）所在地。但总来说，该分区仍然有大量空间，特别是如果你没有计划安装巨大的应用程序或运行 Web 或数据库服务器。另外两个分区都标记为\
  \ `tmpfs`，这意味着它们是计算机上虚拟内存或交换空间使用的临时文件系统。当你关闭计算机时，这些分区的的内容将会消失。\n\n***\n\n### 小贴士\n\
  \n关于 `tmpfs` 的更多信息，请参阅维基百科文章 [`en.wikipedia.org/wiki/TMPFS`](http://en.wikipedia.org/wiki/TMPFS)。\n\
