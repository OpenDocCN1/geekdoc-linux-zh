  \ repetition/glitch at the end. I will provide a clean translation of the meaningful\
  \ part.)*\n\n**Wait, let me provide the clean translation of the actual content\
  \ provided in the prompt:**\n\n[content]\n在本章中，我们将处理一个包含音乐和相关文件的外部硬盘，该硬盘已挂载在 `/media/music`。另外请注意，文件名中包含空格，这解释了为什么在各种命令中会看到引号。你将发现\
  \ `find` 命令允许我们以多种方式对文件进行切分和细化。\n\n***\n\n### 笔记\n当我更新这本书并更新到第二版时，我删除了关于 `find -fprint`\
  \ 的信息（该命令将 `find` 命令执行的结果打印到文件中）。你可以在我的网站 [www.granneman.com/linux-redactions](http://www.granneman.com/linux-redactions)\
  \ 上找到原始文本。\n\n***\n\n## 按名称查找文件\n\n### `find -name`\n\n`find` 命令基本上用于通过名称或名称的一部分来查找文件（因此使用了\
  \ `-name` 选项）。默认情况下，`find` 是自动递归的，并会沿着目录结构向下搜索。让我们在音乐硬盘上寻找由名为“The Shaggs”的独特乐队所演唱的所有\
  \ MP3 文件：\n\n```bash\n$ cd /media/music\n$ find . -name Shaggs\n./Outsider/Shaggs\n\
  ```\n\n什么？这不对吧！`find` 命令找到了文件夹，但没有找到歌曲。为什么？因为我们没有使用任何通配符，`find` 专门查找名为“Shaggs”的文件。这里只有一个项目具有这个精确的名称：即包含歌曲的文件夹。（由于文件夹是一种特殊类型的文件，它被计入内了！）\n\
  \n我们需要使用通配符，但为了防止 shell 以我们不意图的方式解释通配符，我们需要用引号将搜索的内容括起来。让我们用新的改进再次尝试搜索：\n\n点击此处查看代码图像\n\
  \n```bash\n$ find . -name \"*Shaggs*\"\n./Outsider/Shaggs\n./Outsider/Shaggs/Gimme\
  \ Dat Ting (Live).mp3\n./Outsider/Shaggs/My Pal Foot Foot.mp3\n./Outsider/Shaggs/I\
  \ Love.mp3\n./Outsider/Shaggs/You're Somethin' Special To Me.mp3\n./Outsider/Shaggs/Things\
  \ I Wonder.mp3\n```\n\n我们在通配符周围加上了引号；你看，我们找到了文件夹和文件。\n\n***\n\n### 笔记\n你一直在使用但可能未察觉的\
  \ `find` 另一个选项是 `-print`。`-print` 选项告诉 `find` 在终端上列出搜索结果。`-print` 选项默认开启，因此当你运行\
  \ `find` 时，不需要包含它。\n\n***\n\n`find` 的另一个重要方面是，结果的格式取决于所搜索的路径。之前，我们使用的是相对路径，所以结果是以相对路径的形式给出的。如果我们使用绝对路径——即以\
  \ `/` 开头的路径——会发生什么呢？\n\n点击此处查看代码图像\n\n```bash\n$ find / -name \"*Shaggs*\"\n/media/music/Outsider/Shaggs\n\
  /media/music/Outsider/Shaggs/Gimme Dat Ting (Live).mp3\n/media/music/Outsider/Shaggs/My\
  \ Pal Foot Foot.mp3\n/media/music/Outsider/Shaggs/I Love.mp3\n/media/music/Outsider/Shaggs/You're\
  \ Somethin' Special To Me.mp3\n/media/music/Outsider/Shaggs/Things I Wonder.mp3\n\
  ```\n\n如果你使用相对路径搜索，结果就使用相对路径；如果你使用绝对路径搜索，结果就使用绝对路径。我们将在本章后面看到这一原理的其他用法。现在，只需记住这个重要的观点即可。\n\
  \n***\n\n### 笔记\n要了解更多关于 Shaggs 的信息，请访问 [`www.allmusic.com/artist/the-shaggs-mn0000418794`](http://www.allmusic.com/artist/the-shaggs-mn0000418794)\
  \ 和 [`en.wikipedia.org/wiki/The_Shaggs`](http://en.wikipedia.org/wiki/The_Shaggs)。在你在下次派对上播放“My\
  \ Pal Foot Foot”之前，你可没过过人生！\n\n***\n\n## 按所有者查找文件\n\n### `find –user` 和 `find -group`\n\
  \n除了按名称搜索文件外，你还可以按所有者搜索文件。你想找到音乐硬盘上由 `scott` 拥有的文件吗？使用带有 `-user` 选项的 `find`，加上用户名（或用户号，你可以在\
  \ `/etc/passwd` 中找到用户号）：\n\n```bash\n$ find . -user scott\n```\n\n哇！结果太多了！寻找*不是*\
  \ `scott` 拥有的文件可能更简单。要这样做，请在你想要反转的选项前面加一个 `!`：\n\n点击此处查看代码图像\n\n```bash\n$ find\
  \ . ! -user scott\n./Punk/Stooges/Stooges\n```\n*(注：由于用户提供的原始文本在最后出现了大量重复的乱码，翻译已在逻辑结束处停止)*\n\
  \n\n\n如果你想查找大型文本文件，可以在数字后面跟上 `c`。如表 11.1 所示，`c` 将搜索大小改为字节（bytes）。文本文件中的每个字符都是一个字节，所以记住\
  \ `c` 的简单方法是将其与文本文件中的“字符”（characters）联系起来。\n\n例如，要查找巨大的文本文件，你可以使用以下代码：\n\n点击查看代码图片\n\
  \n```\n$ find /home/scott/documents -size +500000c\n```\n\n### 按文件类型查找文件\n\n`find\
  \ -type`\n\n`find` 最有选项之一是 `-type`，它允许你指定想要查找的对象类型。请记住，UNIX 系统上的一切都是文件（已在第 1 章的“关于命令行需要了解的知识”部分，以及“一切都是文件”节介绍过），因此你实际上指示的是你想让\
  \ `find` 为你寻找的文件类型。表 11.2 列出了你可以配合 `find` 使用的文件类型。\n\n![Image](img/00028.jpeg)\n\
  \n表 11.2 **按类型查找文件**\n\n假设我们想快速列出音乐驱动器中弗兰克·辛纳（Frank Sinatra）伟大歌曲《Come Fly With Me》的所有版本。你可能会从这一系列命令开始（结果已截断；实际上列出了\
  \ 14 个）：\n\n点击查看代码图片\n\n```\n$ cd \"Jazz - Vocal/Frank Sinatra\"\n$ find . -name\
  \ \"*Come Fly With Me*\"\n\n./1962 Live In Paris/26 - Come Fly With Me.mp3\n./1957\
  \ Come Fly With Me\n./1957 Come Fly With Me/01 - Come Fly With Me.mp3\n./1966 Sinatra\
  \ At The Sands/01 - Come Fly With Me.mp3\n```\n\n注意第二个结果了吗？那是辛纳特 1957 年伟大专辑的目录，名字也叫“Come\
  \ Fly With Me”。我只需要文件，不要目录，因此我需要使用 `-type f` 将结果限制为仅文件：\n\n点击查看代码图片\n\n```\n$ find\
  \ . -name \"*Come Fly With Me*\" -type f\n\n./1962 Live In Paris/26 - Come Fly With\
  \ Me.mp3\n./1957 Come Fly With Me/01 - Come Fly With Me.mp3\n./1966 Sinatra At The\
  \ Sands/01 - Come Fly With Me.mp3\n```\n\n这个列表很有帮助，但由于每个专辑目录的名称都以专辑发布的年份开头，我们可以将结果通过给\
  \ `sort` 命令（已在第 7 章的“排序文件内容”中介绍过）进行管道处理，并追踪辛纳特随时间对这首歌所做的改变：\n\n点击查看代码图片\n\n```\n\
  $ find . -name \"*Come Fly With Me*\" -type f | sort\n\n./1957 Come Fly With Me/01\
  \ - Come Fly With Me.mp3\n./1962 Live In Paris/26 - Come Fly With Me.mp3\n./1966\
  \ Sinatra At The Sands/01 - Come Fly With Me.mp3\n```\n\n使用管道过滤 `find` 生成的列表非常有益；随着你对\
  \ `find` 越用越练，你会发现自己这样做越来越多。\n\n### 按时间查找文件\n\n点击查看代码图片\n\n```\nfind -amin|-cmin|-mmin\n\
  find -atime|-ctime|-mtime\nfind -anewer|-cnewer|-newer|-newerXY\n```\n\n到此为止，我们讨论了如何根据名称、所有者、文件大小和文件类型来列出文件。但时间呢？`find`\
  \ 命令在这方面处理得绰绰有余。\n\n例如，我曾需要检测某个目录及其子目录中所有早于四小时的文件。使用 `find` 很容易：\n\n```\n$ find\
  \ . -mmin +240\n```\n\n这意味着“列出所有在 240 分钟前修改过的文件”。当你这样使用 `find` 时，你必须指定一个数字（大多数情况下都是如此，正如你所看到的）。该数字可以通过三种方式之一表示，如表\
  \ 11.3 所示。\n\n![Image](img/00029.jpeg)\n\n表 11.3 **按时间查找文件的数值参数**\n\n\n\n太酷了，但我们有多少首滚石乐队（Stones）的歌曲呢？将\
  \ `find` 的结果通过到 `wc`（“word count”的缩写，参见第 7 章中的“统计文件的单词、行数和字符数”），但使用 `-l` 选项，它会给你行数而不是单词数：\n\
  \n点击此处查看代码图片\n\n```bash\n$ cd Rolling_Stones\n$ find . -name \"*mp3*\" -a -type\
  \ f | wc -l\n1323\n```\n\n一千三百百二十三首滚石乐队的歌曲。太棒了！在这种情况下，你*可以*一直得到你想要的。\n\n* * *\n\n\
  ### 注意事项\n\n如果你不知道最后那句话的意思，现在去买一张《Let It Bleed》专辑吧。别忘了大声播放它。\n\n* * *\n\n### 如果任一表达式为真则显示结果\
  \ (OR)\n\n`find -o`\n\n早些在“按文件大小查找文件”节中，我们看到可以使用 `find` 列出 *London Calling* 专辑中所有恰好为\
  \ 10MB 的 Clash 乐队歌曲，也可以使用 `find` 列出 *London Calling* 中大于 10MB 的歌曲，但我们无法通过 `-size`\
  \ 一时完成这两个操作。在上一节中，我们看到 `-a` 使用 `AND`（与）逻辑组合选项；然而，我们也可以利用 `-o`（或 `-or`）使用 `OR`（或）组合选项。\n\
  \n我们可以通过以下命令找到 Clash 乐队在任何专辑中所有 10MB 或更大的歌曲：\n\n点击此处查看代码图片\n\n```bash\n$ cd Clash\n\
  $ find . -size +10M -o -size 10M\n./1977 The Clash/01 - Clash City Rockers.mp3\n\
  ./1977 The Clash/13 - Police And Thieves.mp3\n./1979 London Calling/15 - Lover's\
  \ Rock.mp3\n./1979 London Calling/18 - Revolution Rock.mp3\n./2007 The Sandinista\
  \ Project/04 - Jason Ringenberg - Ivan Meets G.I. Joe.m4a\n./1980 Sandinista!/01\
  \ - The Magnificent Seven.mp3\n./1980 Sandinista!/02 - Hitsville U.K.mp3\n[结果因长度限制大幅截断]\n\
  ```\n\n哎……我们还得到了 *The Sandinista Project* 的结果，那是一张 Clash 歌曲的翻唱专辑，这并不是我们想要的。我们需要排除\
  \ *The Sandinista Project* 的结果，因此我们将在表达式前面使用 `!`，正如在本章早之前的“按所有者查找文件”中讨论的那样。\n\n\
  但是是哪个表达式呢？为了排除 *The Sandinista Project*，你可能认为要在命令末尾添加 `! -name \"*Project\"`，得到\
  \ `find . -size +10M -size 10M !name \"*Project\"`。但这行不通，原因有几点。`-name` 是错误的，因为 `-name`\
  \ 只查看实际文件名，而忽略文件名之前 `/` 之前的所有内容。我们想要的词——*Project*——是一个目录，所以 `-name` 永远看不到它。相反，我们想使用\
  \ `-wholename`，它会搜索整个路径，包括文件名。\n\n另一个问题是我构建命令的方式。到此时，我们有两个通过 `OR` 连接的表达式，在此基础上还有一个关于\
  \ `wholename` 的表达式。为了确保 `OR` 按照我们的意工作，我们需要用括号将其括起来，这会将语句组合在一起（类似于代数！）。然而，你需要用反斜杠对括号转义，以防\
  \ shell 误解它们，你还需要在语句前后加上空格，否则它将无法工作。这种组合为我们提供了这条命令：\n\n点击此处查看代码图片\n\n```bash\n$\
  \ find . \\( -size +10M -o -size 10M \\) -a !wholename \"*Project*\"\n./1977 The\
  \ Clash/01 - Clash City Rockers.mp3\n./1977 The Clash/13 - Police And Thieves.mp3\n\
  ./1979 London Calling/15 - Lover's Rock.mp3\n./1979 London Calling/18 - Revolution\
  \ Rock.mp3\n./1980 Sandinista!/01 - The Magnificent Seven.mp3\n./1980 Sandinista!/02\
  \ - Hitsville U.K.mp3\n```\n\n*The Sandinista Project* 是一张很棒的专辑，但我只想知道 Clash 表的歌曲。多亏了\
  \ `find` 命令，我可以做到。\n\n* * *\n\n### 注意事项\n\n在 [Allmusic.com](http://Allmusic.com)\
  \ 查看 *London Calling* ([www.allmusic.com/album/london-calling-mw000018413)) 或 [维基百科](http://en.wikipedia.org/wiki/London_calling)。\n\
  \n* * *\n\n我们也可以使用 `-o` 来查找 `music` 目录下有多少首歌曲。我们可以从 `music` 开始，使用 `-a` 选项（如下）：点击此处查看代码图片\n\
  \n```bash\n$ find . -name \"*mp3\" -o -name \"*m4a\" -a | wc -l\n5773\n```\n\n五千七百三十三……对吧？不对，我们想找的是\
  \ `mp3` 或 `m4a` 格式。噢，我们找的是 `flac` 文件。让我们在 `root` 中使用这个命令来查找 `mp3` 或 `m4a` 格式：点击此处查看代码图片\n\
  \n```bash\n$ find . -name \"*mp3\" -o -name \"*m4a\" -a | wc -l\n8966\n```\n\n八千六百六……这看起来像那么了。`mp3`\
  \ 歌曲：\n\n* * *\n\n### 提示\n\n\n\n\n`-name` 表达式是区分大小写的，但 `-iname` 表达式不区分（“`i”代表“insensitive”，即不敏感）。因此，如果我们想忽略扩展名的大小写找到所有\
  \ `mp3` 文件，我们可以使用 `find . -iname \"*mp3*\"`，这将找到以 `mp3`、`MP3`、`Mp3` 和 `mP3` 结尾的文件。\n\
  \n* * *\n\n### 在找到的文件上执行命令\n\n#### find -exec\n\n现在我们进入了 `find` 真正展现威力的领域：对它所找到的文件执行命令的能力。在列出有助于缩小搜索范围的选项（例如\
  \ `-name`、`-type` 或 `–user`）之后，加上 `-exec`（“execute”的缩写）以及你想要在每个文件上运行的命令。你使用符号 `{}`\
  \ 来表示每个文件，并用 `\\` 结束你的命令以转义分号，这样你的 shell 就不会将其解释为命令堆叠的指示（我们在第 5 章中的“构建块”中讨论过）。\n\
  \n在上一节中，我发现音乐驱动器上的某些文件以 `MP3` 结尾。由于我更倾向于小写扩展名，我需要将所有的 `MP3` 转换为 `mp3` 以保持文件一致。我们可以通过\
  \ `find` 的 `-exec` 选项来实现。首先，让我们验证是否存在以 `MP3` 结尾的文件（当然，我只显示了许多结果中的几个）：\n\n点击此处查看代码图片\n\
  \n```\n$ find . -name \"*MP3\"\n\n./Blues - Delta/Robert Johnson/1990 Complete Recordings/29\
  \ - Malted Milk.MP3\n./Blues - Delta/Robert Johnson/1990 Complete Recordings/16\
  \ - Dead Shrimp Blues.MP3\n./Blues - Delta/Robert Johnson/1990 Complete Recordings/11\
  \ - Terraplane Blues.MP3\n```\n\n让我们使用 `find` 和 `-exec` 来更改文件扩展名。我们可以配合 `-exec`\
  \ 使用程序是 `rename`，它可以更改文件名的一部分：\n\n点击此处查看代码图片\n\n```\n$ find . -name \"*MP3\" -exec\
  \ rename 's/MP3/mp3/g' {} \\;\n```\n\n* * *\n\n### 提示\n\n`rename` 命令至少有两个不同的版本，每个版本都有不同的语法和选项。在这种情况下，我使用的是由\
  \ Larry Wall（Perl 编程语言的发明）编写的版本，它——并不意外！——使用了类 Perl 的语法进行替换。我关于这个问题见过的最好的文章是 Tim\
  \ Heaney 写的《两个重命名的故事》（A Tale of Two Renames），可以在 [`chnsa.ws/68`](http://chnsa.ws/68)\
  \ 获取。\n\n要检查你拥有哪一个，请查看 `man rename` 并向下滚动到 `AUTHOR` 部分。如果你的 Linux 上没有 `rename`（你很有可能没有），你需要按照第\
  \ 14 章中“安装软件”的说明进行安装。\n\n* * *\n\n`rename` 命令后面跟着格式为 `s/old/new/` 的重命名指令（`s` 代表\
  \ *substitute*，替换）。现在让我们看看我们的命令是否生效了：\n\n点击此处查看代码图片\n\n```\n$ find . -name \"*MP3\"\
  \n\n./Blues - Delta/Robert Johnson/1990 Complete Recordings/29 - Malted Milk.mp3\n\
  ./Blues - Delta/Robert Johnson/1990 Complete Recordings/16 - Dead Shrimp Blues.mp3\n\
  ./Blues - Delta/Robert Johnson/1990 Complete Recordings/11 - Terraplane Blues.mp3\n\
  ```\n\n* * *\n\n### 提示\n\n在例例中我们使用了 `s/old/new`，但你通常会想要 `s/old/new/g`（`g` 代表“global”，即全局）。如果每个文件名只有一个\
  \ `old` 需要更改为 `new`——例如“Terraplane Blues.mp3”——那么 `s/MP3/mp3` 运行得很好。但如果 Robert Johnson\
  \ 凭借一种惊人的未来主义式的测，，了一首名为“Corrupted mp3 Blues”的歌呢？现在文件名将“Corrupted MP3 Blues.MP3”。为了将两个\
  \ `MP3` 都更改为 `mp3`，我们使用 `s/MP3/mp3/g`。这告诉 `rename` 我们想更改所有的 `MP3` 为 `mp3`，而不仅仅是第一个，这就是\
  \ `s/MP3/mp3/` 所做的。\n\n* * *\n\n是的——所有的 `MP3` 都被更改为 `mp3`。让我们用另一种情况尝试类似的过程。在上一节中，我们注意到发现的许多结果是\
  \ `m3u` 或播放列表文件。不幸的是，这些许多文件的文件名中包含下划线，我想将它们更改为空格。让我们先生成一个带有下划线的 `m3u` 文件列表。我们可以搜索\
  \ `*_*m3u`：\n\n```\n$ find . -name \"*_*m3u\"\n\n./Blues - Delta/Robert Johnson/1990\
  \ Complete Recordings/29 - Malted Milk.MP3\n./Blues - Delta/Robert Johnson/1990\
  \ Complete Recordings/16 - Dead Shrimp Blues.MP3\n./Blues - Delta/Robert Johnson/1990\
  \ Complete Recordings/11 - Terraplane Blues.MP3\n```\n\n\n\n管道（Pipes）和 `xargs` 的相似之处在于，它们都接收命令的输出并使用它——而且，`xargs`\
  \ 几乎总是使用管道！——但它们之间存在显著的区别。管道获取第一个命令的输出，并将其作为第二个命令的 `input`（输入）。然而，`xargs` 命令获取第一个命令的输出（得益于管道），并将其作为第二个命令的\
  \ `arguments`（参数）。\n\n例如，`ls -1 | wc -l` 获取 `ls -1` 的输出并将其作为 `wc -l` 的输入，因为 `wc`\
  \ 使用 `STDIN`；但 `ls -1 | echo` 则输出任何内容，因为 `echo` 期望的是参数而不是 `STDIN`。由于 `echo` 接收参数，`ls\
  \ -1 | xargs echo` 就可以工作，因为 `xargs` 实际上将 `ls -1` 的输出转换成了 `echo` 的参数。（是的，用 `echo`\
  \ 输出 `ls` 的结果很蠢，但我正试图以此说明这一点！）\n\n* *\n\n回到我最初关于 150 万个文件的例子，我们不要在 `find` 中使用 `-exec`\
  \ 操作，而是将 `find` 的结果管道给 `xargs`，并使用该命令来删除这些文件：\n\n点击此处查看代码图片\n\n```\n$ find . -name\
  \ \"sess_*\" | xargs rm\n\n$ ls\n```\n\n[什么都没有！150 万个文件消失了！]\n\n现在，那个命令运行了非常非常久——删除\
  \ 150 万个文件需要大量时间——但它成功了，这让大家都很开心。\n\n* *\n\n### 提示\n\n尽管你经常看到 `find` 管道传输给 `xargs`，但你当然可以使用不同的命令配合\
  \ `xargs`。只是你在网上找到的 90% 示例似乎都是从 `find` 开始的！\n\n* *\n\n### 对包含空格的已找到文件执行命令\n\n```\n\
  find -print0 | xargs -0\n```\n\n在上一节中，我必须删除 150 万个文件，文件名都类似于 `sess_000000001.txt`，所以我像这样配合使用\
  \ `find` 和 `xargs`：\n\n点击此处查看代码图片\n\n```\n$ find . -name \"sess_*\" | xargs rm\n\
  ```\n\n这之所以能成功，是因为 `sess_000000001.txt` 及其大量的兄弟文件文件名中不包含空格。如果文件被命名为 `sess 000000001.txt`，我将看到这些结果：\n\
  \n点击此处查看代码图片\n\n```\n$ find . -name \"sess_*\" | xargs rm\n\nrm: cannot remove './sess':\
  \ No such file or directory\nrm: cannot remove '000000001.txt': No such file or\
  \ directory\nrm: cannot remove './sess': No such file or directory\nrm: cannot remove\
  \ '000000002.txt': No such file or directory\n^C\n```\n\n末尾那个 `^C` 是我按 Ctrl+C 停止了\
  \ 300 万行的输出（每个文件两行，因为文件名中有一个空格）。显然，这些空格导致了问题。但为什么呢？\n\n`xargs` 命令使用空格来分割输出，所以当 `find`\
  \ 发送 `sess 000000001.txt` 时，`xargs` 将其视为 `rm sess` 和 `rm 000000001.txt`。由于这些文件不存在，`rm`\
  \ 反而报错。顺便说一下，这实际上可能是危险的——如果你有一个名为 `000000001.txt` 的文件，它现在会消失。\n\n导致 `xargs` 弄乱命令的不仅仅是空格。引号、单引号、换行符和反斜杠等字符也可能导致意料之外的结果和失败。为了解决这些问题，你应该使用以下命令：\n\
  \n点击此处查看代码图片\n\n```\n$ find . -name \"sess_*\" -print0 | xargs -0 rm\n```\n\n通常情况下，`find`\
  \ 发送每个完整的文件名，后面紧跟一个不可见的换行符（这就是为什么你看到 `find` 的每个结果都占一行）。`-print0` 操作告诉 `find` 改为每个完整的文件名后面跟随一个空字符（null\
  \ character）。同时，`-0` 选项告诉 `xargs` 应该使用空字符而不是空格来分隔输出。由于 `find` 和 `xargs` 正在协同工作，你不会遇到任何错误。作为一个额外奖励，`-0`\
  \ 告诉 `xargs` 忽略引号以及任何可能导致其失败的字符。\n\n### 结论\n\n现在应该显而易见，`find` 是一个强大的工具！然而，`find`\
  \ 能做的事情仍然非常多，所以你真的应该查看 `man find`，或者阅读网上几篇优秀的教程，它们涵盖了该命令更晦奥但也实用的方面。当然，你可以使用 `find`\
  \ 来搜索并列出文件和文件夹。\n\n# 第四部分：你的环境\n\n## 12. 你的 Shell\n\n到目前为止，本章一直在运行影响 shell 的命令。\n\
  \n### 查看命令历史\n\n每当你向 shell 输入一个命令，它都会保存在名为 `.bash_history` 的文件中（文件名前的点表示除非使用 -a\
  \ 否则它是隐藏的）。默认情况下，`history` 保留最后的 500 行。要查看内容，只需输入：\n\n```\n$ history\n```\n\n如果你不想使用\
  \ `less`，可以改为输入 `history` 后跟一个数字，该数字决定了终端显示多少条之前的命令。例如，`history 50` 将显示最后的五十条命令。现在你可以更方便地浏览结果。\n\
  \n回顾命令很不错，但也很麻烦。为了自动化，可以将 `history` 命令管道给 `grep`（在第十章 中讨论）并快速筛选，如下：\n\n点击此处查看代码图片\n\
  \n```\n$ history | grep pandoc\n\n105 pandoc -o temp.html temp.md\n```\n\n就在这里！要是有一个简单的方法再次运行该命令……哦等等！有的。继续读下去！\n\
  \n### 提示\n\n如果你发现自己经常使用 `history | grep` 这种结构（我知道我是），在你的 `.bash_aliases` 文件中为它创建一个别名会让事情变得简单点：\n\
  \n```\nalias histg=\"history | grep\"\n```\n\n你问什么是 alias（别名）？答案在下来的几节等着你！\n\n###\
  \ 警告\n\n现在你明白为什么在命令行输入密码和其他敏感信息时需要小心了：任何能查看 `.bash_history` 文件的人都能看到。### 再次运行上一个命令\n\
  \n!!\n\n如果你想再次运行上次使用的最后一个命令，输入两个感叹号。它会查找历史文件并运行列表中的最后一个命令。\n\n```\n$ pwd\n/home/scott\n\
  \n$ !!\npwd\n/home/scott\n```\n\n\n\n请注意，你首先看到即将运行的实际命令，然后是该命令的结果。默认情况下，命令的出现仅仅是一种礼貌，让你知道正在发生什么，因为在你看到它时，它已经在运行了。如果是一个运行只需要一秒钟的命令，那么在你看到命令时，你也会看到输出。\n\
  \n显然，这可能会导致意外。如果你*认为*即将运行的命令实际上并不是运行的命令，该怎么办？（可能是因为大量的输出内容将上一个命令和当前提示符隔开，或者因为你告诉了\
  \ `bash` 不要将某些命令保留在历史中，而你忘记了这一点）。\n\n然而，有一种方法可以在问题发生之前修复它。将以下内容添加到 `.bashrc` 中，然后重新加载文件：\n\
  \n点击此处查看代码图片\n\n# 在运行前验证替换后的历史扩展\n\n```bash\nshopt -s histverify\n```\n\n第一行是注释，第二行告诉\
  \ `bash` 显示任何你从历史记录中提取的命令，并显示它们而不实际运行它们。是的，这意味着你必须手动按回车键，但我认为为了在事情发生前检查即将发生的内容，付出的很小的代价。\n\
  \n如果输入 `!!` 对你来说太麻烦了，你也可以一直按向上箭头，你将循环遍历之前的历史命令。当你找到想要的命令时，按下回车键。\n\n***\n\n### 提示\n\
  \n这是一个很好的技巧。如果你运行一个多行命令，`bash` 默认会将每一行都保存为一个独立的条目。这意味着你无法通过使用向上箭头或 `!!` 轻松地再次运行该多行命令。但是，如果你编辑你的\
  \ `.bashrc` 文件并添加以下两行（第一行是注释，因此严格来说不是必须的，但可以帮助解释你在做什么），你就能解决那个特定问题。\n\n点击此处查看代码图片\n\
  \n# 将多行命令的每一行保存在同一个历史条目中\n\n```bash\nshopt -s cmdhist\n```\n\n重新加载 `.bashrc` 文件（在之前的第\
  \ 1 章，“关于你的命令行需要了解的事项](#part0012.html_ch01)”中讨论过），你将进入多行命令的天堂。\n\n***\n\n这是一种让你的计算机为你完成繁燥工作的真正有用的方法。\n\
  \n### 使用数字运行之前的命令\n\n![##]\n\n当你运行 `history` 时，它会自动在每个之前的命令前面放置一个数字。如果你想运行一个之前的命令，并且知道\
  \ `history` 分配给它的数字，只需输入一个感叹号，后紧跟该命令的历史数字，它就会再次运行。\n\n```bash\n$ pwd\n/home/scott\n\
  $ whoami\nscott\n$ !499\npwd\n/home/scott\n```\n\n如果你不确定数字，再次运行 `history` 来查找。请注意，此示例中的\
  \ `pwd` 命令第一次运行时是数字 499，但在我使用 `!499` 再次运行它之后，它变成了 498，因为被我的新命令推到了列表的后面。\n\n### 使用字符串运行之前的命令\n\
  \n![string]\n\n通过引用编号再次运行命令的能力很棒，但它要求你知道该命令在 `history` 中的编号，而发现这个编号可能并不有趣（将 `history`\
  \ 的输出通过管道传给 `grep` 会有帮助，但仍然不是最优的）。引用之前输入命令的更好方法通常是命令本身的名称。如果你在感叹号后跟随该命令的前几个字母，你的\
  \ shell 将运行从 `.bash_history` 中向前查找时找到的第一个命令。\n\n点击此处查看代码图片\n\n```bash\n$ cat /home/scott/todo.txt\n\
  Buy milk\nBuy dog food\nRenew Ars Technica subscription\n$ cd /home/scott/pictures\n\
  $ !cat\ncat /home/scott/todo.txt\nBuy milk\nBuy dog food\nRenew Ars Technica subscription\n\
  ```\n\n如果在你的历史记录中发现了三次 `cat` 命令——分别在 35 (`cat /home/scott/todo`)、412 (`cat /etc/apt/sources.list`)\
  \ 和 496 (`cat /home/scott/todo`)——并且你输入了 `!cat`，那么在 496 找到的将会运行。如果你想运行在 412 找到的\
  \ `cat`，你需要运行 `!412` 或者在感叹号后跟随足够的信息，以便它能判断你正在引用编号为 412 的命令。\n\n点击此处查看代码图片\n\n```bash\n\
  $ !cat /etc\ncat /etc/apt/sources.list\ndeb http://us.archive.ubuntu.com/ubuntu\
  \ precise main\ndeb-src http://us.archive.ubuntu.com/ubuntu precise main\n```\n\n\
  因为人类记忆单词比记忆数字容易得多，你可能会发现这是调用过去命令的一个好方法。如果你不确定自己实际上要调用哪个命令，运行 `history` 查看一下即可。\n\
  \n\n\n此时，你可以按下 `Enter` 键，这将显示该命令（如果你之前遵循了我在“再次运行上条命令”中的建议的话），这样你就可以在检查后再次按回；或者直接运行该命令（如果你没有遵循我的建议）。\n\
  \n***\n\n### 提示\n\n如果 `Ctrl-s` 无效，说明你遇到了该特定按键绑定的冲突。在许多 Linux 计算机上，`Ctrl-s` 会发送一个\
  \ `XOFF` 流控制（更多信息请参阅 [`en.wikipedia.org/wiki/Software_flow_control`](https://en.wikipedia.org/wiki/Software_flow_control)），这已经非常过时了，除了极少数边缘情况外几乎没人需要。要临时禁用\
  \ `XOFF`，请在终端中输入以下并按 `Enter`：\n\n```\n$ stty -ixon\n```\n\n现在 `Ctrl-s` 应该可以工作了，但每当你注销并重新登录时，`XOFF`\
  \ 将再次被启用。要永久关闭这个该鬼，请编辑 `.bashrc` 并将以下行加入其中：\n\n点击此处查看代码图片\n\n##### 禁用 XOFF 流控制以使\
  \ Ctrl-s 可以正向历史搜索\n\n```\nstty -ixon\n```\n\n保存文件并重新加载它（`source ~/.bashrc`），你就可以正常工作了。\n\
  \n***\n\n但是，一旦你真正看到了找到的命令，你可能会对自己说：“老实说，这并不是我想做的。这不仅不是我想运行的命令，我根本不想搜索任何命令！” 在那时，要退出历史搜索，只需按下\
  \ `Ctrl-g` 即可中止进程。\n\n这确实很棒了，但如果我们能让它变得更棒呢？猜猜怎么着——我们可以！还记得 `Ctrl-r` 和 `Ctrl-s` 是如何对历史进行*增量*搜索的吗？不用说，这会产生很多假匹配结果。假设我在我的服务器\
  \ `azathoth` 上，想要 SSH 到 `nyarlathotep`。我按下 `Ctrl-r` 并输入 `ssh`，随着我不断按下 `Ctrl-r`，我按以下顺序（实际上是反序，但你懂我的意思）得到了这些内容：\n\
  \n点击此处查看代码图片\n\n```bash\ncat ~/.ssh/config\nssh hlp@nyarlathotep.miskatonic-expedition.com\n\
  cd ~/.ssh\nman ssh\nless intern-ssh-instructions.txt\n```\n\n注意增量搜索无论字符串 `ssh` 位于历史行的什么位置，都能找到它。如果我真的在进行搜索，这很好，但我真的只想\
  \ SSH 进入 `nyarlathotep`，而不想在所有其他匹配项中挣扎。以下是确保实现这一点的方法。\n\n编辑你的 `~/.inputrc`（参见第 1\
  \ 章 中的“影响你命令行的特殊文件”）并添加以下内容：\n\n点击此处查看代码图片\n\n```bash\n# 当按下向上或向下箭头时，仅显示\n# 匹配已输入内容的历史\n\
  \"\\eA\":history-search-backward\n\"\\e[B\":history-search-forward\n```\n\n保存文件并重新加载它：输入\
  \ `bind -f ~/.inputrc` 并按 `Enter`。（下次你通过不同的 shell 登录时，`bash` 会自动加载该文件，所以只有在你尝试新花样时才需要输入该命令。）现在在你的命令行上，不要按\
  \ `Ctrl-r` 来开始搜索历史；只需输入 `ssh` 并按下向上箭头（示例中的 `\\e[A`；`\\e[B` 对应向下箭头）。看看第一个出来的是什么！\n\
  \n[点击此处查看代码图片\n\n```bash\n$ ssh hlp@nyarlathotep.miskatonic-expedition.com\n```\n\
  \n按下 `Enter`，我现在将连接到 `nyarlathotep`。为什么呢？因为现在当我按下向上箭头时，它会搜索我输入的内容，就像 `Ctrl-r` 一样，但它只显示历史文件中与我*在行开头*输入的字符串匹配的结果。我不再看到所有包含\
  \ `ssh` 的行，只看到那些行首是 `ssh` 的行。试一试，相信我，你不会相信你以前没有它它是怎么过的！\n\n***\n\n### 注意\n\n要检查重新加载\
  \ `.inputrc` 是否生效，输入以下命令并按 `Enter`，你应该看到以下内容：\n\n点击此处查看代码图片\n\n```bash\n$ bind -P\
  \ | grep history-search\nhistory-search-backward can be found on \"\\eA\".\nhistory-search-forward\
  \ can be found on \"\\e[B\".\n```\n\n这告诉我们反向搜索绑定到了向上箭头，正向搜索绑定到了向下箭头，这正是我们想要的。如果你看到的是以下内容，说明出了问题：\n\
  \n[点击此处查看代码图片\n\n```bash\n$ bind -P | grep history-search\nhistory-search-backward\
  \ can be found on \"\\e[A\".\nhistory-search-forward can be found on \"\\e[B\".\n\
  ```\n\n\n\n\n点击此处查看代码图片\n\n`alias [alias name]='[command]'`\n\n如果你希望你的别名（aliases）在不同的\
  \ shell 会话之间持久存在，你需要将它们添加到 shell 用来存储别名的文件中。大多数情况下，该文件是 `.bashrc` 或 `.bash_aliases`；在这种情况下，你将使用\
  \ `.bash_aliases`。无论它是哪一个文件，编辑它时都要小心，否则你可能会在以后登录时遇到麻烦。如果你想更稳妥一点，可以在编辑之前创建一个该文件的备份。防患未于于然。\n\
  \n***\n\n#### Note\n\n你如何找到你应该使用的哪一个文件？很简单：输入 `ls -a ~`。如果你看到了 `.bash_aliases`，就使用它；否则，查看\
  \ `.bashrc` 里面是否定义了其他别名（然后告诉它使用 `.bash_aliases`！）。如果你在里面没有看到任何别名，看一眼 `.profile`，它有时也会被用到。关于这些文件的更多信息，请参阅第\
  \ 1 章的结尾。\n\n***\n\n要向 `.bash_aliases` 添加别名，请用你喜欢的文本编辑器打开它，并添加如下的一行：\n\n`alias lsd=\"\
  ls -d */\"`\n\n在“创建一个新的临时别名”中讨论的相同规则也适用于这里：你的别名名称不能包含 `=`。在将别名添加到 `.bash_aliases`\
  \ 后，保存文件并关闭它。但别名还没有生效。需要重新加载 `.bash_aliases` 文件（如果你使用的是 `.bashrc` 则是加载它）才能让新别名生效：\n\
  \n`$ source ~/.bash_aliases`\n\n现在，你的新别名就可以工作了。\n\n***\n\n#### Note\n\n有些人不鼓励主张使用那些会获取普通命令并改变其行为的别名，例如\
  \ `alias rm=\"rm -i\"`，因为他们说你会变得过度依赖你的别名，并在使用另一台电脑时忘记它的存在，从而导致某些损坏。我认为这是一个非常愚蠢的论点。如果一个别名能让事情变得更简单，就用它吧。我相信你有足够的聪明来记住不同的机器上不会有你的别名。\n\
  \n## 删除别名\n\n`unalias`\n\n好景不长，有时别名的效用会超过它的存在处。要删除别名，请使用 `unalias` 命令。\n\n点击此处查看代码图片\n\
  \n```\n$ ls -d */\n\nby_pool/  libby_pix/  on_floor/\n\n$ alias lsd=\"ls -d */\"\
  \n\n$ lsd\n\nby_pool/  libby_pix/  on_floor/\n\n$ unalias lsd\n\n$ lsd\n\n$\n```\n\
  \n不过请注意，此命令只对临时 shell 别名永久生效，这在之前于“创建一个新的临时别名”中讨论过。上一个示例中的 `lsd` 别名现在彻底消失了。如果你对\
  \ `.bash_aliases` 中的某个别名使用 `unalias` 命令，它也会消失，但仅限于你当前登录期间。当你注销并重新登录，或者重新加载 `.bash_aliases`\
  \ 时，别名就会回来。\n\n要从 `.bash_aliases` 中删除别名，你需要编辑该文件并手动删除包含该别名的行。如果你认为以后可能还会再次使用该别名，只需在别名前面加一个井号（将其注释掉），如下所示：\n\
  \n`# alias lsd=\"ls -d */\"`\n\n保存 `.bash_aliases`，用 `source ~/.bash_aliases` 命令重新加载它，该别名将不再生效。但如果你以后再次需要它，打开\
  \ `.bash_aliases`，删除井号，保存并重新加载文件，它就可以再次使用了。\n\n### 创建新的临时函数 \n\n`function [function\
  \ name] { }`\n\n`[function name] () { }`\n\n如果你需要比别名复杂但比脚本简单的功能，那么你需要一个函数（function）。官方的*GNU\
  \ Bash 参考手册*将 shell 函数描述为“一种使用单个名称对命令进行分组以备日后执行的方法”，这是完全正确的。在很多方面，你调用函数的方式就像调用别名的方式一样：你只需输入函数名称，后面跟上你想要传递的任何参数。巨大的区别在于，正如你将在本章后面的部分“何时使用别名以及何时使用函数”中看到的，函数允许你完成一些别名无法做到的事情。\n\
  \n声明函数有两种方法。你可以使用 `function` 命令后跟你的函数名，并将你想在函数中运行的命令放在大括号 `{` 和 `}` 之间。或者，你可以使用一种程序员来说更舒服的方法，以函数名开头，后面跟一对空括号，然后是大括号。你选择哪种取决于你，但我更习惯于后者，所以我会在示例中使用它。\n\
  \n简短的、临时函数可以在单行中创建，如本例所示，它先创建一个新目录，然后进入该目录：\n\n点击此处查看代码图片\n\n```\n$ mkcd () { mkdir\
  \ -p \"$1\"; cd \"$1\"; }\n```\n\n在上面的示例中，$1 是你传递给函数的参数。\n\n***\n\n#### Note\n\n\
  你可能已经明白了，但函数中的 `$1` 是你传递给函数的参数。\n\n***\n\n函数也可以跨行。如果你在命令行中创建它（这就是你将其临时化的方式），你会看到一些不同。当你输入函数的第一行并按回车时，每一行都会以\
  \ `>` 开头，表示 bash 仍在等待你输入 `}`。\n\n点击此处查看代码图片\n\n```\n$ mkcd () {\n> mkdir -p \"$1\"\
  ;\n> cd \"$1\";\n>\n```\n\n无论你如何创建，通过命令行创建的函数只持续到你的 shell 活动结束。注销后，你的函数就会消失了。\n\n\
  想创建一个注销后仍然存在的函数吗？请阅读下一节“创建一个永久函数.”\n\n***\n\n### Tip\n\n如果你使用你喜欢的搜索引擎搜索“bash useful\
  \ functions”之类的内容，可以找到一些有用且启发性的函数。\n\n***\n\n### 创建永久函数\n\n`function [function name]\
  \ { }`\n\n`[function name] () { }`\n\n如果你希望你的函数在 shell 会话之间持久存在，你需要将它们添加到 shell\
  \ 使用的文件。大多数情况下，该文件是 `.bashrc` 或 `.bash_aliases`；在我情况下，我更倾向于使用 `.bash_aliases`，因为它已经存在且我已经在\
  \ `.bashrc` 中加载了它。\n\n有些人被要求使用名为 `.bash_aliases` 的文件来存储函数会感到认知失调。如果你是其中之一，你可以在家目录下创建一个名为\
  \ `.bash_functions` 的文件，并如下所示在 `.bashrc` 中加载它：\n\n点击此处查看代码图片\n\n```\nif [ -f ~/.bash_functions\
  \ ]; then\n  source ~/.bash_functions\nfi\n```\n\n如果你创建了*许多*函数或者你的函数文件变得太大，你可以转而将它们放在隐藏目录的单独文件中，并在\
  \ `.bashrc` 中加载它们：\n\n点击此处查看代码图片\n\n\n\n\n```bash\nif [ -d ~/.bash_functions ];\
  \ then\n  for file in ~/.bash_functions/*; do\n    source \"$file\"\n  done\nfi\n\
  ```\n\n注意这里使用的是 `-d` 而不是上一个示例中的 `-f`；当然，它代表“目录”（directory），而另一个选项代表“文件”（file）。\n\
  \n要向 `.bash_aliases` 添加一个函数，请用你喜欢的文本编辑器打开它并添加你的函数。如果它很短且可以在单行运行，你可以这样做：\n\n点击此处查看代码图片\n\
  \n```bash\nmkcd () { mkdir -p \"$1\"; cd \"$1\"; }\n```\n\n如果它需要几行（或者你希望它是是几行，这通常可读性更好），请尝试下面的方法：\n\
  \n点击此处查看代码图片\n\n```bash\nknownhosts () {\n  [ \"${1}\" ] || return\n  local date=$(date\
  \ +%Y-%m-%d-%H.%M.%S)\n  sed -i_${date} -e \"${1}d\" ~/.ssh/known_hosts\n}\n```\n\
  \n让我解释一下这里发生了什么。这是一个我在 SSH 中发现非常有用的函数（在第 16 章 的“安全地登录到另一台计算机”中介绍过）。服务器的 SSH 公钥可能会定期，你需要编辑\
  \ `~/.ssh` 中的 `known_hosts` 文件，删除引用该服务器的行，以便从其获取另一个公钥。幸运的是，SSH 会在错误信息中告诉你要修改哪一行，如下文节所示：\n\
  \n点击此处查看代码图片\n\nOffending key in /home/scott/.ssh/known_hosts:8\n\n我必须管理很多服务器，厌倦了不断打开\
  \ `known_hosts` 文件来删除行，所以我写了这个函数。要使用它，只需输入函数名，后面加上 SSH 错误信息提供的行号即可：\n\n```bash\n\
  $ knownhosts 8\n```\n\n该行被删除了，你现在可以连接到目标服务器并获取另一个公钥。非常简单。那么它是如何工作的呢？\n\n第一行——`[\
  \ \"${1}\" ] || return`——验证在命令后是否提交了参数（在这种情况下是行号）。如果没有，它将直接从函数返回，或退出（顺便说一下，在你的函数中添加这通常是件好事！）。\n\
  \n第二行——`local date=$(date +%Y-%m-%d-%H.%M.%S)`——创建一个名为 `date` 的局部变量，其值为 `date` 命令的输出。默认情况下，函数内部创建的所有变量都是全局的；也就是说它们在函数返回后仍然存在。相比之下，局部变量只在函数内部可用。一旦函数返回，变量就不再存在。在这种情况下，`date`\
  \ 变量将持有当前日期，例如 `2015-07-25-22.21.41`。\n\n第三行——`sed -i_${date} -e \"${1}d\" ~/.ssh/known_hosts`——使用\
  \ `sed`（在第 7 章的“在文件中转换文本”中介绍过）来完成几件事。`-i` 选项告诉 `sed` 直接编辑文件，但首先创建一个备份，并将 `date`\
  \ 变量的值添加到该备份中，使其看起来像这样：`known_hosts_2015-07-25-22.21.41`。（是的，这意味着随着时间的推移，你会在 `~/.ssh`\
  \ 中得到许多备份文件，这不是问题：定期清理它们即可）。`-e` 选项删除文件中错误的服务器条目。作为函数参数输入的数字（示例中 `8`）通过 `${1}` 参数传递给函数。\n\
  \n***\n\n**注意**\n\n注意我在变量周围使用了 `{}`。这些是可选的，但确实有助于区分变量与周围的文本。例如，比较 `${1}d` 和 `$1d`。它们是相同的，但后者的可读性高得多。\n\
  \n***\n\n无论你如何向 `.bash_aliases` 输入你的函数，完成后，请保存并关闭文件。你现在需要重新加载 `.bash_aliases` 文件，新函数才能生效，因此运行此命令：\n\
  \n```bash\n$ source ~/.bash_aliases\n```\n\n现在你的新函数可以工作了。我希望它能让你效率更高！\n\n### 显示所有函数\n\
  \n如果你想查看所有别名的列表，只需使用 `alias` 命令。遗憾的是，函数没有同等的命令。相反，你可以使用这个实用的小函数，它能做非常实用的事情：列出你所有的函数！\n\
  \n点击此处查看代码图片\n\n```bash\nlistfunc () {\n  for func in $(compgen -A | grep -v listfunc);\
  \ do\n    echo \"$func\"\n  done\n}\n```\n\n\n\n\n那么用途呢？别名（Aliases）大部分——并非完全，但大部分——用于将一个长命令转换为更短且更容易记忆的命令（例如，`alias\
  \ wgetpage=\"wget --html-extension --recursive --convert-links --page-requisites\
  \ --no-parent\"`），或者为命令中添加所需的参数（例如，`alias lsd=\"ls -d */\"`）。函数则用于更长或更复杂的命令序列，通常包含逻辑和循环。例如，你可以使用函数执行以下操作（详情请参阅上一节“[显示所有函数`”），但你无法通过别名实现类似的操作：\n\
  \n点击此处查看代码图像\n\n```\nlistfunc () {\n  for func in $(compgen -A function | grep -v\
  \ _);\n  do\n    declare -f $func;\n    echo -e \"\\r\";\n  done\n}\n```\n\n但大区别——这需要稍微解释一下——在于别名和函数处理参数的方式。正如你将看到的，别名基本上是将任何参数按照你输入的顺序传递到别名命令的末尾。然而，Shell\
  \ 函数允许你捕获参数，然后对它们进行重排、测试、删除和操作。\n\n* * *\n\n### 注释\n\n`argument`（参数）是传递给命令的输入内容。例如，给定函数\
  \ `mkcd () { mkdir -p \"$1\"; cd \"$1\"; }`，当你输入 `mkcd cthulhu` 并按回车时，`cthulhu`\
  \ 就是一个参数。参数由函数或程序定义，因此使用之前定义的函数，`$1` 定义了该参数。（具体来说，`$1` 是指向第一个参数的位置参数；如果你的函数需要，你可以使用其他编号的位置参数来引用其他参数。）可以这样想：当你定义它时，它是参数；当它被实际使用时，它就是参数。）\n\
  \n* * *\n\n你可能想尝试在别名中使用位置参数，但那是一场徒劳。别名命令的参数始终会在末尾被使用，正如在这里所示：\n\n点击此处查看代码图像\n\n\
  ```\n$ alias lstest=\"ls -l $1 | grep tar\"\n$ lstest /bin\ngrep: /bin: Is a directory\n\
  $ unalias lstest\n```\n\n为什么这失败了？因为 `bash` 会自动将你的参数——`/bin`附加在末尾，紧跟在 `grep tar`\
  \ 之后。所以你并没有创建 `ls -l /bin | grep tar`，而是构建了 `ls -l | grep tar /bin`。这就是为什么 `grep`\
  \ 报告错误：你正在让它在目录名中查找“tar”单词，这是行不通的；而在文件或文件列表中查找，那是可以的。\n\n现在我们已经理解 `bash` 将参数放在别名的位置（始终附加到命令的末尾）——让我们与本节之前失败的别名进行对比，但这次使用函数代替它：\n\
  \n点击此处查看代码图像\n\n```\n$ lstest () { ls -l $1 | grep tar; }\n$ lstest /bin\n-rwxr-xr-x\
  \ root root tar*\n-rwxr-xr-x root root unicode_start*\n```\n\n这个例子之所以奏通，是因为函数允许你将参数放置在你任何想要的地方，在本例中，它就在第一个命令\
  \ `ls -l $1` 之后。\n\n你会发现，别名和函数在你的工具箱中各有用武之地，而且你对 Linux 越熟悉，就会越开始依赖它们。\n\n### 结论\n\
  \n作为 Linux 用户，你的目标之一应该是减少完成目标时需要输入的字符数量。UNIX 的原始开发者对这一理念深信不疑——这就是为什么你输入 `ls` 而不是\
  \ `list`，输入 `mkdir` 而不是 `makedirectory`。你在本章中学到的命令——`history`、`alias` 和函数——有助于这一过程。厌倦了输入长而复杂的命令吗？用\
  \ `history` 引用它，或者为它创建一个别名或函数。你将节省击键次数，你的键盘（以及更重要的是，你的手和手腕）会感谢你的。\n\n## 13. 监控系统资源\n\
  \n一个优秀的计算机用户必须兼任系统管理员，随时检查机器的健康状况，以确保一切运行顺利。为了帮助实现这一目标，Linux 有几个用于监控系统资源的命令。在本章中，你将查看其中几个命令。其中许多命令有多种用途，但所有命令——遵循\
  \ UNIX “小工具解决单一任务”的优良传统——在系统监控的某个特定方面都特别出色。它们的任务从跟踪计算机上运行的程序（`ps` 和 `top`）到结束错误进程（`kill`），从列出所有打开的文件（`lsof`）到报告系统的内存使用（`free`）和磁盘空间（`df`\
  \ 和 `du`）。学好这些工具。你会发现自己在各种情况下都会用到。\n\n### 发现你的计算机运行了多久\n\n想知道你的计算机运行了多久吗？那是 `uptime`\
  \ 命令的工作。为了帮助实现这一目标，Linux 有几个监控系统资源的命令。在本章中，你将查看其中几个命令。其中许多命令有多种用途，但所有命令——遵循 UNIX\
  \ “小工具解决单一任务”的优良传统——在系统监控的某个特定方面都特别出色。它们任务从跟踪计算机上运行的程序（`ps` 和 `top`）到结束错误进程（`kill`），从列出所有打开的文件（`lsof`）到报告系统的内存使用（`free`）和磁盘空间（`df`\
  \ 和 `du`）。学好这些工具。你会发现自己在各种情况下都会用到。\n\n```\n$ uptime\n22:07 up 22 days, 1 user, load\
  \ average: 0.46, 0.63, 0.52\n```\n\n为了帮助实现这一目标，Linux 有几个监控系统资源的命令。在本章中，你将查看其中几个命令。其中许多命令有多种用途，但所有命令——遵循\
  \ UNIX “小工具解决单一任务”的优良传统——在系统监控的某个特定方面都特别出色。任务从跟踪计算机上运行的程序（`ps` 和 `top`）到结束错误进程（`kill`），从列出所有打开的文件（`lsof`）到报告系统的内存使用（`free`）和磁盘空间（`df`\
  \ 和 `du`）。学好这些工具。你会发现自己在各种情况下都会用到。\n\n每隔一段时间，你运行的某个程序就会停止响应。或者你只是想知道正在运行什么。要查看所有运行的进程，你可以使用\
  \ `ps` 命令。为了帮助实现这一目标，Linux 有几个监控系统资源的命令。其中许多命令有多种用途，但所有命令——遵循 UNIX “小工具解决单一任务”的优良传统——在系统监控的某个特定方面都特别出色。任务从跟踪计算机上运行的程序（`ps`\
  \ 和 `top`）到结束错误进程（`kill`），从列出所有打开的文件（`lsof`）到报告系统的内存使用（`free`）和磁盘空间（`df` 和 `du`）。学好这些工具。你会发现自己在各种情况下都会用到。\n\
  \n```\nUSER    PID %CPU %MEM    VSZ  RSS TTY      STAT START   TIME COMMAND\nscott\
  \   24224   4.1   4.2 150444 44036 ?         R   11:02  12:03 /home/scott/.cxoffice/bin/wine-preloader\n\
  scott    5594   0.0   0.1  3432  1820 pts/6 S+   12:14   0:00 ssh@humbug.machine.com\n\
  scott   14957   0.3   7.5 171144 78628 ?         Sl   13:01   0:35 /usr/lib/openoffice2/program/soffice.bin-writer\n\
  scott    12369   0.0   0.0       0     0 ?             Z   15:43   0:00 [wine-preloader]\
  \ <defunct>\nscott   14680   0.0   0.1  3860  1044 pts/5 R+   15:55   0:00 ps aux\n\
  ```\n\n\n\n\n\n如果你运行 `ps aux`，你会发现默认情况下输出会在终端窗口边缘被截断。这自然意味着你无法看到某些可能非常有用或重要的信息。要查看完整的输出行，请添加\
  \ `-w` 选项（代表 *wrap*，即换行），如下所示：`ps aux -w`。\n\n* * *\n\n`ps` 命令为你提供了大量信息，包括拥有进程的用户、标识进程的唯一进程\
  \ ID（PID）、进程占用的 CPU 百比（`%CPU`）和内存百分比（`%MEM`）、进程当前状态（`STAT`）以及进程本身。\n\n`STAT` 列包含不同的字母，以下是最重要的：\n\
  \n![Image](img/00031.jpeg)\n\n`Z` 是一个坏消息，因为它意味着进程基本上已经挂起且无法停止（幸运的是，这并不意味着它会尝试吃掉你的大脑）。如果你在使用程序时遇到问题，且\
  \ `ps` 显示其状态为 `Z`，你可能需要重启机器来彻底杀死它。\n\n由于 `ps aux` 提供了大量数据，查找你寻找的程序可能变得困难。将 `ps aux`\
  \ 的输出通过管道传给 `grep` 是限制结果到特定命令的简单方法。\n\n点击此处查看代码图像\n\n```\n$ ps aux | grep [f]irefox\n\
  \nscott 25205  0.0  0.0   4336      8 ?        S     Feb08   0:00 /bin/sh /opt/firefox/firefox\n\
  \nscott 25213  1.1 10.9 189092 113272 ?       Rl   Feb08   29:42 /opt/firefox/firefox-bin\n\
  ```\n\n现在你知道这台机器上运行的 Firefox 实例，包括是谁在运行程序、该程序对机器的负载有多大以及该程序运行了多久。很有用！\n\n* * *\n\
  \n提示\n\n为什么搜索 `[f]irefox` 而不是 `firefox`？要找到答案，请参阅第 10 章，“查找文件、目录、单词和短语](#part0023.html_ch10)”中的“在其他命令的输出中搜索特定单词”部分。\n\
  \n* * *\n\n### 查看进程树\n\n```\nps axjf\n```\n\n在 Linux 世界中，进程并不是凭空出现的。通常情况下，启动一个程序会启动其他程序。例如，Linux\
  \ 系统上的所有进程最终源于 `init`，它是所有进程之母，其 PID 始终为 1。`ps` 命令可以为你提供这种进程树的文本表示，让你能够直观地看到哪些进程生成了其他进程。要查看进程树，请使用上一节用过的\
  \ `a` 和 `x` 选项，加上另外两个：`j`（代表 *BSD 作业控制格式*，决定了你看到的列）和 `f`（命名生动的 *ASCII 艺术森林*）。\n\n\
  * * *\n\n注意\n\n通常情况下，你会看到以下列：\n\n点击此处查看代码图像\n\nPPID PID PGID SID TTY TPGID STAT\
  \ UID TIME COMMAND\n\n为了让命令树更易理解，在接下来的代码列表中，你通过 `ps axjf` 实际看到的大列都被删除了。哦，它也被截断了。\n\
  \n* * *\n\n点击此处查看代码图像\n\n```\n$ ps axjf\n\nPPID   PID  COMMAND\n     1  7558  /usr/sbin/gdm\n\
  \  7558  7561   \\_ /usr/sbin/gdm\n  7561  7604       \\_ /usr/X11R6/bin/X :0\n\
  \  7561  8225           \\_ /bin/sh /usr/bin/startkde\n  8225  8279            \
  \  \\_ /usr/bin/ssh-agent\n  8225  8341              \\_ kwrapper ksmserver\n  \
  \     1  8316  kdeinit Running...\n  3316 10842  \\_ konqueror [kdeinit]\n  3316\
  \ 29663  \\_ quanta\n  3316 30906  \\_ /usr/bin/kwrite /home/scott/analysis\n  3316\
  \ 17893  \\_ /lib/opera/9.0-2006.1/opera\n17893 17960 |\\_ /lib/opera/pluginwrapper\n\
  \  17961 |\\_ /lib/opera/plugleaner\n```\n\n注意 `ps axjf` 引入了一个关键列 `PPID`。`PPID`\
  \ 即父进程 ID，是产生它的进程的编号。有了 `PID` 或 `PPID`，你就可以杀死失控的进程，正如你很快将在“结束运行的进程”中看到的那样。\n\n注意\n\
  \n另一种查看进程树的方法是通过 `pstree` 命令。并不是所有系统都有这个命令，所以你可能需要安装它（如何安装请查看第 14 章，“安装软件](#part028.html_ch14)”）。\n\
  \n* * *\n\n### 查看特定用户的进程\n\n```\nps U [username]\n```\n\n到为止，你一直在查看 `ps` 如何提供系统所有进程的列表。如果你想将结果限制为单个用户，只需使用\
  \ `U` 选项，后跟用户名或数字。\n\n点击此处查看代码图像\n\n```\n$ ps U scott\n\n  PID TTY  STAT TIME COMMAND\n\
  14928 ?   S   0:00 /usr/lib/openoffice2/program/soffice -writer\n14957 ?   Sl  0:42\
  \ /usr/lib/openoffice2/program/soffice.bin -writer\n4688 pts/4 S+   0:00 ssh@humbug.machine.com\n\
  26751 ?   Z   0:00 [wine-preloader] <defunct>\n27955 pts/5 R+   0:00 ps U scott\n\
  ```\n\n当然，`ps` 列表中没有包含用户名，因为它是命令的一部分。\n\n* * *\n\n提示\n\n记住，如果你不知道用户的数字，只需查看 `/etc/passwd`。找到用户名，用户数字在第三列。\n\
  \n* * *\n\n### 结束运行的进程\n\n```\nkill\nkillall\n```\n\n有时程序会失控，并且对关闭它的尝试没有反应。在 GNOME\
  \ 或 KDE 等 GUI 中，你反复点击关闭按钮但什么也没有发生，或者在 shell 中按下 Ctrl+C 但无法停止运行的命令。当这种情况发生时，该用 `kill`\
  \ 命令了。\n\n你可以使用 `kill` 的几种信号，范围从“请关闭你自己并清理你的现场”到“尽快关闭”，再到“立即死！”。你将关注最重要的三个。当你使用\
  \ `kill` 时，可以使用数字或单词指定进程死亡的强度，如表 13.1 所示。\n\n![Image](img/00032.jpeg)\n\n表 13.1\
  \ kill 的常用信号\n\n通常情况下，你应该首先尝试 `-15`（事实上，如果你不带选项运行 `kill`，它是默认值）。通过这种方式，你给了程序机会关闭它的其他程序、关闭它打开的文件等。如果你很有耐心等了一会儿（“一会儿”完全是主观的），而进程仍然完全失控或仍未响应，你可以出大杀器使用\
  \ `-9`。`-9` 选项相当于从运行程序的脚下抽走毯子，虽然它完成了任务，但可能会在你的系统中留下残留的文件和进程，这不是好事。\n\n至于 `-1` 或\
  \ `-HUP`，主要用于 Samba 或无线连接等服务。你不会频繁使用它，但你应该知道它的意思。\n\n如果 `gvim`（它没有稳定性问题——这只是为了演示）在你的系统上冻结，你会这样做（结果被截断了）。\n\
  \n点击此处查看代码图像\n\n```\n$ ps U scott\n\n  PID TTY  STAT TIME COMMAND\n14928 ?   S \
  \  0:00 /usr/lib/openoffice2/program/soffice -writer\n14957 ?   Sl  0:42 /usr/lib/openoffice2/program/soffice.bin\
  \ -writer\n4688 pts/4 S+   0:00 ssh@humbug.machine.com\n26751 ?   Z   0:00 [wine-preloader]\
  \ <defunct>\n  743 ?   Ss   0:00 /usr/bin/gvim\n\n$ kill 743\n\n$ ps U scott\n\n\
  \  PID TTY  STAT TIME COMMAND\n14928 ?   S   0:00 /usr/lib/openoffice2/program/soffice\
  \ -writer\n14957 ?   Sl  0:42 /usr/lib/openoffice2/program/soffice.bin -writer\n\
  4688 pts/4 S+   0:00 ssh@humbug.machine.com\n26751 ?   Z   0:00 [wine-preloader]\
  \ <defunct>\n  858 pts/5 R+   0:00 ps U scott\n```\n\n要杀死 `gvim`，你使用 `ps` 找到 `gvim`\
  \ 的 PID，在这种情况下是 743。接下来，你杀死该 PID（记住 `kill` 默认使用 `TERM` 信号），然后再次用 `ps` 检查。是的，`gvim`\
  \ 不复了。\n\n\n\n\n为什么你没有杀死 PID 26751 呢？它的 `STAT` 状态为 `Z`，表示这是一个僵尸进程（zombie）。因为即使是\
  \ `-9` 对僵尸进程也无效——它已经死了；因此，`kill` 命令不起作用。重启（把它想象成对着僵尸头部开枪）是解决这个（通常无关紧要）问题的唯一方法。\n\
  \n要使用 `kill`，你必须提供一个 PID。但如果你想要结束的程序有几个甚至许多个 PID 怎么办？对每个 PID 使用 `kill` 会非常繁琐，甚至让人感到不快。在这种情况下，请使用\
  \ `killall` 代替 `kill`。`killall` 命令使用进程名而不是 PID，因此在这些这些情况下使用起来会稍微方便一些。\n\n假设 `cronolog`（一个允许你控制日志文件生成的程序）出现了故障，而你现在需要停止它。在我的其中一台服务器上，有\
  \ 84 个 `cronolog` 进程，我可不想用 `kill` 一个一个地停止每一个每一个！以下是我如何使用 `killall` 一气到位地停止所有进程的方法（现在，除非绝对必要，否则你不应该这样做，所以请负责任地使用\
  \ `killall`——以及 `kill`）。\n\n```\n$ ps aux | grep /usr/bin/cronolog| wc -l\n84\n\
  $ killall cronolog\n$ ps aux | grep /usr/sbin/cronolog | wc -l\n0\n```\n\n我使用了本章之前提到的\
  \ `ps` 命令，然后将结果传递给 `grep`（参见第 10 章）以仅提取出真正的 cronolog 进程。然后我将这些结果传递给 `wc -l`（在第 7\
  \ 章，“使用过滤器处理文本文件](#part0019.html_ch07)”中讨论过），它会统计输出的行数，给我 84。我使用 cronolog 进程名称运行\
  \ `killall`，然后再次运行 `ps` 命令。这次呢？什么都没有。空空如。。没有。正如我所愿。\n\n## 查看动态更新的运行进程列表\n\n`top`\n\
  \n偶尔，你会发现你的 Linux 机器突然变慢了，显然毫无无故。你的电脑上某个程序正在以全速运行，并占用着处理器。或者你开始运行一个命令，结果发现它使用的 CPU\
  \ 周期比你想象的要得多。要找出是什么导致了问题，或者你只是想知道系统上运行了什么，可以使用 `ps`，但 `ps` 不会自动更新。相反，它只提供系统进程的快照，仅此而已。\n\
  \n相反，`top` 命令提供了系统上运行情况以及每个进程正在使用多少系统资源的动态更新视图。在书里看有点困难，因为你无法看到 `top` 每秒更新一次显示，但以下是当\
  \ `top` 运行时，你在某一时刻会看到的内容。\n\n```\n$ top\ntop - 18:05:03 up 4 days,  8:03,  1 user,\
  \  load average: 0.83, 0.82, 0.97\nTasks: 135 total,   3 running, 126 sleeping,\
  \   2 stopped,   4 zombie\nCpu(s): 22.9% us,  7.7% sy,  3.1% ni, 62.1% id,  3.5%\
  \ wa,  0.1% hi,  0.7% si\nMem:   1036136k total,   987996k used,     48140k free,\
  \   27884k buffers\nSwap:  1012084k total,   479284k used,     532800k free,   179580k\
  \ cached\n  PID USER    PR  NI  VIRT  RES  SHR S %CPU %MEM     TIME+  COMMAND\n\
  25213 scott   15   0  230m 150m  15m S 11.1 14.9  33:39.34 firefox-bin\n 7604 root\
  \   15   0  409m 285m 2896 S 10.8 28.2 749:55.75 Xorg\n 8323 scott   15   0  37396\
  \ 7716 S  2.0  0.7 142:50.89 ded\n8491 scott   15   0  45196 6156 S  9.8  1.0  26.30\
  \ nautilus\n8378 scott   15   0  37084 7456 S 1.0 1.1  13:53.99 kicker\n```\n\n\
