  ```bash\nip route show\ndefault via 192.168.0.1 dev eth0 proto static metric 1024\n\
  192.168.0.0/24 dev eth0 proto kernel scope link 192.168.0.101\n```\n\n### 排错网络问题\n\
  \n如今的 Linux 发行版在网络方面通常可以“开箱即用”，但你可能仍然遇到问题。根据本章介绍的内容，以下是排错网络问题的一些基本技巧。\n\n如果你的网络接口似乎正在运行，但你无法访问互联网，首先尝试\
  \ ping 本地回环设备 `127.0.0.1`。如果这无效，请停止并不要继续操作，因为你的系统已经严重损坏。如果这有效，请尝试 ping 你机器的外部 IP\
  \ 地址。如果无效，请确保你的机器上已启用网络功能。如果有效，现在尝试 ping 网络中的其他机器（假设你有的话）。如果你没有成功，那么问题出在你的接口上（假设路由器是正常的）。确保你的线缆已插好（认真）。如果是有线连接，使用\
  \ `ifconfig` 或 `ip addr show`；如果是无线连接，使用 `iwconfig` 或 `nmcli -p device status` 来验证接口状态，并在必要时使用\
  \ `ifup` 或 `ip link set eth0 up` 开启接口。然后再次尝试 `ping`。\n\n如果你成功 ping 了另一台本地电脑，下一步尝试\
  \ ping 你的路由器。如果你无法访问路由器且你正在使用其 IP 地址进行 ping，我会建议重启路由器看看是否能解决问题。如果你可以访问网络上的其他机器，但无法访问路由器，那么是时候用\
  \ `route` 或 `ip route show` 检查路由表了。如果路由表中缺少项目，请添加它们，详情请见“修改你的 IP 路由表”章节。\n\n\n\n\
  \n现在你需要编辑你的 `dhclient.conf` 文件，但首先你必须找到它，因为文件的位置取决于你的发行版。（在我的 Ubuntu 14.04 机器上，它位于\
  \ `/etc/dhcp/dhclient.conf`。）如果你无法轻松找到，可以始终使用第 11 章中的 `find` 命令，即“`find` 命令”：\n\n\
  点击此处查看代码图像\n\n```\n$ sudo find /etc -name dhclient.conf\n```\n\n一旦你找到了 `dhclient.conf`，就用你最喜欢的编辑器编辑它，但请确保你使用\
  \ `sudo` 打开编辑器，或者在指向 `dhclient.conf` 时具有身份验证权限，因为编辑该文件需要 root 权限。当文件打开时，在 `return\
  \ subnet-mask` 之前之前向文档中添加以下行——注意末尾的分号！\n\n点击此处查看代码图像\n\n```\nprepend domain-name-servers\
  \ 208.67.222.222, 208.67.220.220;\n```\n\n保存并退出 `dhclient.conf`。断开连接然后重新启动，最后通过\
  \ `cat /etc/resolv.conf` 检查你的 DNS 是否已就绪。\n\n***\n\n注意\n\nSUSE、Mint 和 Cinnamon 用户的说明可以在此处找到:[`support.opendns.com/forums/21618384-Computer-Configuration`](https://support.opendns.com/forums/21618384-Computer-Configuration)。\n\
  \n***\n\n如果你仍然遇到问题，是时候重新开始了，并且始终从硬件开始。一切都插好了吗？一切都插好了吗？在确认这一点之后，开始检查你的软件。最坏的情况是你的硬件根本没有适用于\
  \ Linux 的驱动程序。这很罕见，而且越来越少见，但仍然会发生。\n\n然而，由于一些不愿帮助 Linux 开发者让其硬件工作的闭嘴制造商，无线网卡可能与\
  \ Linux 完全不兼容。为了防止头疼，最好在网上检查一下，确保你考虑购买的无线网卡与 Linux 兼容良好。值得查看的网站包括 Linux Wireless\
  \ LAN Support ([`linux-wless.passys.nl`](http://linux-wless.passys.nl)) 和 Ubuntu\
  \ Wiki 的支持的无线网卡页面 ([`help.ubuntu.com/community/WifiDocs/WirelessCardsSupported`](https://help.ubuntu.com/community/WifiDocs/WirelessCardsSupported))。\n\
  \n噢，为了完成我们的排排除：如果你能成功同时 ping IP 地址和域名，请停止阅读这里——你在线了！去享受乐趣吧！\n\n### 结论\n\n你在这一章中涵盖了广泛的网络工具。其中许多工具，例如\
  \ `ifconfig`、`iwconfig` 和 `route`，可以发挥双重作用，既可以告知连接状态，又允许你更改参数。其他的更多用于诊断目的，例如 `ping`、`traceroute`\
  \ 和 `host`。最后，有些工具控制着你连接网络的能力：`dhclient`、`ifup` 和 `ifdown`。如果你认真对待 Linux，你将学习所有的工具。没有什么比无效的网络连接更让人沮丧了，但通常正确的程序可以在几秒钟内解决问题。熟悉你的工具，你就可以在问题出现时快速高效地解决它们。\n\
  \n## 16. 在网络上工作\n\n本章中的许多命令功能非常丰富，值得拥有自己的章节。我无法涵盖你使用 `ssh`、`rsync`、`wget` 和 `curl`\
  \ 可以执行的所有精彩操作，但我可以让你入门。使用这些命令最好的方法是尝试它们，熟悉基础知识，然后开始探索你感兴趣的领域。有足够的内容让你忙碌很长时间，当你开始发挥想象后，你会发现你将要读的这些程序有许多酷的用途。\n\
  \n### 安全地登录另一台计算机\n\n由于 UNIX 在设计时考虑了网络，因此早期开发者创建了允许用户连接到其他机器的程序，以便他们可以运行程序、查看文件并访问资源。长期以来，`telnet`\
  \ 是一直使用的程序，但它有一个巨大的问题；它不安全。使用 `telnet` 发送的一切——你的用户名、密码和所有数据——都是未经加密发送的。任何窃听的人都能看到一切，这并不好。\n\
  \n为了解决这个问题，开发了 `SSH`（安全 shell）。它可以完成 `telnet` 能做的一切，甚至更多。更好的是，所有 `SSH` 流量都是加密的，使其更强大、更有用。如果你需要连接到另一台机器，无论那台计算机是在地球的另一端还是隔壁房间，请使用\
  \ `SSH`。\n\n假设你想从笔记本电脑（命名为 `pound`，位于 `192.168.0.15`）使用 `ssh` 命令连接到你的桌面电脑（命名为 `eliot`，位于\
