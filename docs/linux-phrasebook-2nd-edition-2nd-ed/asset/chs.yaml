  ***\n### 提示\n我在书中提供的许多关于 Linux 的信息也可以也适用于其他 UNIX 变体，例如 `BSD` 和 `OS X`。请注意，我并没有说*所有*或*大部分*——我说的是*许多*。只要你记住这一点，你会发现《Linux\
  \ 词典》（Linux Phrasebook）对这些操作系统也很有帮助。\n***\n### 关于第二版\n当 Pearson 的编辑 Mark Taber 第一次找我撰写第二版《Linux\
  \ 词典》时，我抓住了这个机会。实际上，我每个月会用几次自己的书作为参考，所以多年来，我发现了一些错误（每次看到都感到心痛），并看到了许多我想更改、删除或添加的内容。\n\
  我的目标是让第二版不仅是新读者的必读之作，也是第一版《Linux 词典》读者的必买。。这不是只做了一些小改动的所谓新版。哦，不是。以下是我在书中做的新或不同的地方：\n\
  ![图像](img/00002.jpeg) 我将原来的第 2 章“基础知识”分为两个章节：第 2 章“导航你的文件系统”和第 3 章“创建与销毁”。旧的第 2\
  \ 章长得离谱，把各种命令挤在一起。新的拆分使得事情变得更加易管理且合理（尽管这意味着那两个章节之后的每一章都必须重新编号）。\n![图像](img/00002.jpeg)\
  \ 我删除了第 6 章“打印和管理打印作业”和第 16 章“Windows 网络”，因为它们看起来不再像十年前那样关键了。此外，大多数需要打印或连接到基于 Windows\
  \ 的网络进行工作的人，都有 GUI 工具可以完全胜任这些工作了。然而，不要绝望——你仍然可以在我的网站上找到第一版的原始章节：[www.granneman.com/linux-redaction](http://www.granneman.com/linux-redaction)。\n\
