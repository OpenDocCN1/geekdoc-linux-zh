  \n\n\n在在上一个例子中，我 `cd` 到想要创建软链接的目录，然后创建了它，但我之所以没有指定链接名称，而是只放了一个 `.`（点），这告诉 `ln` 我希望链接名称与我正在链接的文件或文件夹相同。那么在这个例子中，软链接的名字将是\
  \ `www`，因为那是原始路径的最后一部分。这种做法很偷懒（记住，偷懒是好事！）。但如果我想变得更懒一点点呢？\n\n```bash\n$ cd /\n$ sudo\
  \ ln -s /var/www\n```\n\n在在上一个例子中，我 `cd` 到想要创建软链接的目录，然后创建了它，但我完全没有输入链接名称，而是什么都没放。这实际上告诉\
  \ `ln` 我希望链接名称与我正在链接的文件或文件夹相同。在这个例子中，和上一个一样，软链接的名字将是 `www`，因为那是原始路径的最后一个组件。这*才*是真正的偷懒！\n\
  \n无论你是如何创建它的，软链接的工作方式与它所指向的文件或文件夹一样（`pwd` 和 `pwd -P` 在第 2 章的“显示当前目录的路径”中讨论过）。\n\n\
  点击此处查看代码图片\n\n```bash\n$ pwd\n/home/scott\n$ ln -s /var/www\n$ ls -l\nlrwxrwxrwx\
  \  1  8 www -> /var/www/\n$ cd www\n$ pwd -P\n/var/www\n$ ls -l\nlrwxrwxrwx  1 \
  \ 8 notes -> /home/scott/notes.txt\n$ cat notes\nNotes about websites go here.\n\
  ```\n\n我创建的软链接指向一个目录，当我 `cd` 进入这个软链接时，我实际上进入了我所指向的目录。之后，我 `cat` 了一个指向文件的软链接，看到了我所指向的文件的内容。如果我在编辑器中打开这个软链接，我实际上将更改原始文件的内容。\n\
  \n现在你知道如何创建软链接以及它们是如何工作的了，但软链接和硬链接有什么区别呢？哦，在很多方面！让我们先看一些 `ls` 命令的结果，请假设我们正在查看的目录中同时包含硬链接和软链接。\n\
  \n点击此处查看代码图片\n\n```bash\n$ ls -l\n-rw-r--r--  2 moby_dick.txt\nlrwxrwxrwx 12 webconf\
  \ -> /etc/apache2/\n-rw-r--r--  2 white_whale.txt\n$ ls -i\n25689 moby_dick.txt\n\
  25372 webconf\n25689 white_whale.txt\n$ ls -i /etc\n59948 apache2/\n```\n\n让我们从使用\
  \ `ls -l` 可以看到的内容开始。如果是软链接，第一列会显示 `l`（*link* 的缩写），如果是硬链接，则显示 `-`（代表“普通”文件）。为什么？因为对你的文件系统来说，硬链接只是共享\
  \ inode（索引节点）的普通文件。你应该看到的另一点是，`ls -l` 显示了软链接指向的文件或文件夹的指针，这非常有用。这对于硬链接来说是没有意义的，因为原始文件和它的任何硬链接实际上是同一个东西。从操作系统的角度来看，它们是完全相同的，“原始”文件和它的任何额外链接之间没有区别。此外，虽然软链接只能指向一个文件或文件夹，但你可以为同一个文件创建许多硬链接，那么它应该指向哪一个呢？没错——那会乱一团糟，所以它甚至不会尝试。\n\
  \n第二个命令——`ls -i`——也显示了硬链接和软链接之间的一些关键区别。硬链接当然具有相同的 inode ，但软链接及其指向的文件具有不同的编号，因为它们是完全不同的文件。硬链接（实际上是完全相同的文件）不同，软链接使用名称来指向文件和目录，而该名称的文件有它自己的\
  \ inode。换句话说，软链接有自己的 inode，指向原始文件的 inode，然后 inode 指向驱动器上的实际数据！\n\n还有几点区别：重要的一点是软链接可以指向文件或文件夹，而硬链接只能指向文件。与硬链接不同，软链接及其指向的文件不必在同一个文件系统中。如果你删除或移动了原始文件，软链接就会失效，但你可以随时无问题地更改软链接的。表\
  \ 3.2 对比了硬链接和软链接，以帮助突出它们的特殊之处。\n\n![Image](img/00012.jpeg)\n\n表 3.2 **硬链接与软链接**\n\
  \n硬链接和软链接都有它们的用途。\n\n\n\n\n`/home/scott/libby/by_pool`\n\n```\n$ ls\n```\nlibby_by_pool_01.jpg\
  \      libby_by_pool_03.jpg\nlibby_by_pool_01.jpg_bak  libby_by_pool_03.jpg_bak\n\
  \n```\n$ rm -i *_bak\n```\nrm: remove regular file 'libby_by_pool_01.jpg_bak'? y\n\
  \nrm: remove regular file 'libby_by_pool_03.jpg_bak'? y\n\n```\n$ ls\n```\nlibby_by_pool_01.jpg\
  \  libby_by_pool_03.jpg\n```\n\n当 `rm` 询问你该如何操作时，输入 `y` 表示同意删除该文件，输入 `n` 则表示跳过该文件并继续处理下一个文件。\n\
  \n### 删除空目录 (`rmdir`)\n\n`rmdir`\n\n删除文件并不困难，但目录呢？\n\n点击此处查看代码图片\n\n```\n$ pwd\n\
  ```\n`/home/scott/libby/by_pool`\n\n```\n$ ls\n```\nlibby_by_pool_02.jpg  lieberman_pool\
  \  lieberman_pool_bak\n\n```\n$ ls lieberman_pool_bak\n```\nlibby_by_pool_01.jpg\
  \      libby_by_pool_03.jpg\nlibby_by_pool_01.jpg_bak  libby_by_pool_03.jpg_bak\n\
  \n```\n$ rm lieberman_pool_bak\n```\nrm: cannot remove 'lieberman_pool_bak/': Is\
  \ a directory\n\n在观察了一会儿之后，你可能会发现 `rmdir` 命令，它是专门为删除目录设计的。于是你试了一下。\n\n点击此处查看代码图片\n\
  \n```\n$ rmdir lieberman_pool_bak\n```\nrmdir: 'lieberman_pool_bak/': Directory\
  \ not empty\n\n```\n\n该死！这也不行。`rmdir` 命令只删除空目录。在这种情况下，`lieberman_pool_bak` 文件夹只包含四个项目，所以用\
  \ `rm lieberman_pool_bak/*` 将它们删除后再使用 `rmdir` 并不太难。但如果你想删除一个包含 10 个子目录的目录，每个子目录又包含\
  \ 10 个子目录，且每个子目录又包含 25 个文件呢？那你得删除一辈子。一定有更简单的方法！对此请参见下一节。\n\n### 删除非空文件和目录 (`rm -rf`)\n\
  \n有一种更简单的方法删除带有文件的目录。使用 `-r`（或 `-R` 或 `--recursive`）和 `-f`（或 `--force`）选项的组合。`-r`\
  \ 告诉 `rm` 进入找到的每一个子目录并删除所有内容，而 `-f` 告诉 `rm` 直接执行，而不会因为非空文件夹等礼貌性问题打扰你。\n\n点击此处查看代码图片\n\
  \n```\n$ pwd\n```\n`/home/scott/libby/by_pool`\n\n```\n$ ls\n```\nlibby_by_pool_02.jpg\
  \  lieberman_pool  lieberman_pool_bak\n\n```\n$ ls lieberman_pool_bak\n```\nlibby_by_pool_01.jpg\
  \      libby_by_pool_03.jpg\nlibby_by_pool_01.jpg_bak  libby_by_pool_03.jpg_bak\n\
  \n```\n$ rm -rf lieberman_pool_bak\n```\n\n```\n$ ls\n```\nlibby_by_pool_02.jpg\
  \  lieberman_pool\n```\n\n砰！这是一个删除目录及其内部所有文件和子目录的稳妥方法。\n\n***\n\n### 注意事项\n\n`rm\
  \ -rf` 命令可能会破坏你的重要文件和你的系统。在使用 `rm -rf` 之前，请双倍检查你正在删除的内容！\n\nLinux 经典的警告是不要以 `root`\
  \ 身份输入 `rm -rf /*`。是的，你会抹除整个系统。不，结果不会很好看。是的，你会觉得自己自己很蠢。\n\n通常，在使用 `rm -rf` 通配符时要小心。`rm\
  \ -rf libby*` 和 `rm -rf libby *` 之间有巨大的区别。前者删除工作目录下所有以 `libby` 开头的内容；后者会删除任何名称完全为\
  \ `libby` 的文件或文件夹，然后删除目录中的*其他所有内容*。\n\n如果你本想输入 `rm -rf ~/libby/*` 却因手抖输错了命令，告诉 shell\
  \ `rm -rf ~/libby /*`，你也可能意外地制造灾难。首先 `~/libby` 目录离开了，然后它开始攻击文件系统根目录 `/`——你的系统从此开始通向不存在的快速旅程。\n\
  \n这里有一个让试图自作聪明的人吃过的亏：永远不要输入 `rm -rf .*/*` 来删除以 `.`（点）开头的目录，因为你还会匹配到 `..`，并导致删除当前目录以上的所有内容。\n\
  \n\n\n\n\n当我将这本书更新到第二版时，我删除了关于 `man -u`（重构 `man` 的命令数据库）和 `man -t`（打印 `man` 页面）的信息。此外，`whatis`\
  \ 被移动到了 `man -f` 中，`apropos` 被移动到了 `man -k` 中。你可以在我的网站找到原始文本，地址为 [www.granneman.com/linux-redactions](http://www.granneman.com/linux-redactions)。\n\
  \n***\n\n## 使用 man 了解命令\n\n### man\n\n想了解某个 Linux 命令吗？当然，这太简单了！假设你想了解更多关于 `ls` 命令的信息。输入\
  \ `man ls`，man 页面（*manual*，即手册的缩写）就会出现，其中充满了关于 `ls` 各个方面的详细信息。对你在书中检查过的其他命令也尝试同样的操作。你会发现（几乎）所有命令都有\
  \ man 页面。\n\n然而，尽管 `man` 页面非常有用，但它们仍然存在问题。你必须知道命令的名字才能真正使用它们（尽管有方法可以解决这个特定问题），而且它们有时会过时，缺少命令的最新功能。并不是每个命令都有\
  \ `man` 页面，这可能会令人烦恼。但最糟糕的是，即使你找到了描述你感兴趣的命令的且它是最新的，你可能仍然面临一个大问题：它可能几乎毫无用处。\n\n编写程序的开发者通常也会编写\
  \ man 页面。大多数编写 Linux 发行版自带应用程序的开发者都是优秀的程序员，但不总是是有效的作家或对自己工作的良好解释者。他们知道事物是如何运作的，但他们经常忘记，用户并不知道开发者认为显而易见且直观的东西。\n\
  \n尽管有所有这些问题，但 man 页面对于所有经验水平的 Linux 用户来说仍然是一个很好的资源。如果你要在命令行上使用 Linux，你需要学习如何使用和阅读\
  \ man 页面。\n\n如前所述，使用这个命令并不困难。只需输入 `man`，然后输入你想了解的更多命令。\n\n点击此处查看代码图像\n\n```\nman\
  \ ls\n\nLS(1)               User Commands               LS(1)\n\nNAME\n\n      ls\
  \ - list directory contents\n\nSYNOPSIS\n\n      ls [OPTION]... [FILE]...\n\nDESCRIPTION\n\
  \n      List information about the FILEs (the current directory by default).\n\n\
  \      Sort entries alphabetically if none of - cftuSUX nor --sort.\n\n      Mandatory\
  \ arguments to long options are  mandatory for short options too.\n      -a, --all\
  \ do not hide entries starting with .\n      -A, --almost-all do not list implied\
  \ and ..\n```\n\n在这种情况下，`man` 提供的的数据列表非常详尽——超过 200 行。当然，并不是所有命令都提供这么多内容，有些命令提供的更多。你的工作是阅读\
  \ man 页面中的不同部分，这些部分通常（但并非总是）包含以下内容：\n\n- `NAME`: 命令的名字和简要描述\n- `SYNOPSIS`: 命令的基本格式\n\
  - `DESCRIPTION`: 对命令用途的更详细的概述\n- `OPTIONS`: 核心内容：命令的各种选项，并附带每个选项的简短解释\n- `FILES`:\
  \ 命令使用的其他文件\n- `AUTHOR`: 谁编写了命令，以及联系方式\n- `BUGS`: 已知 bug 以及如何报告 bug\n- `COPYRIGHT`:\
  \ 这一点显而易见：关于版权的信息\n- `SEE ALSO`: 其他相关的命令\n\n在 man 页面中移动并不困难。要一次向下移动，使用向下箭头；要一次向上移动，使用向上箭头。要向下跳转一页，按空格键或\
  \ `f`（代表 forward，向前）；要向上跳转一页，按 `b`（代表 backward，向后）。当你到达 man 页面的结尾时，`man` 可能会退出并将你带\
  \ shell；然而，它可能只是停在结尾，这种情况下你应该按 `q` 退出。事实上，如果你找不到所需的信息，可以随时按 `q` 退出 `man`。\n\n在 man\
  \ 页面中查找特定项目可能是困难的，所以有时你需要进行一些搜索。在 man 页面打开后进行搜索，输入 `/`，后跟你的搜索词，然后按回车。如果该词存在，你将跳转到那里；要跳转到该词的下一次出现处，再次按回车（或\
  \ `n`），继续按回车（或 `n`）向下跳转到每个出现处；要向后跳转，按 `Shift+n`。\n\n*** 注意\n默认情况下，`man` 使用 `less`（在第\
  \ 6 章中讨论过）作为分页器——实际上显示 `man` 页面的软件。这些导航的关键命令确实来自 `less`；关于这些命令的更多信息，运行 `man less`。如果你由于某些原因不想使用\
  \ `less`，你需要更改 `MANPAGER` 或 `PAGER` 环境变量。要发现如何操作，去搜搜！\n\n## 根据名称快速查找命令功能\n\n###\
  \ man -f whatis\n\n如果你知道一个命令的名字但不知道它是做什么的，有一种快速简单的方法可以找到，而不需要实际打开该命令的 man 页面。使用\
  \ `man` 配合 `-f` 或 `--whatis` 选项，或者直接使用 `whatis` 命令，命令的摘要就会出现。\n\n点击此处查看代码图像\n\n\
  ```\nman -f ls\nls (1) - list directory contents\n\nwhatis ls\nls (1) - list directory\
  \ contents\n```\n\n你应该用哪一个个人喜欢 `whatis`，因为它更容易记忆；我的朋友则倾向于使用 `man -f`，因为输入更短。\n\n\
  `whatis` 命令的另一个优点是它支持正则表达式和通配符。要使用通配符搜索数据库，使用 `-w` 选项。\n\n点击此处查看代码图像\n\n```\nwhatis\
  \ -w ls*\nls (1) - list directory contents\nlsb (8) - Linux Standard Base support\
  \ for Debian\nlshal (1) - List devices and their properties\nlskat (6) - Lieut Skat\
  \ game for KDE\n```\n\n使用通配符可能比直接的 `whatis` 慢一点，但在今天的机器上几乎忽略不计，所以你可能不需要担心。\n\n正则表达式可以使用\
  \ `-r`（或 `--regex`）。\n\n点击此处查看代码图像\n\n```\nwhatis -r ^rm.*\nrm (1) - remove files\
  \ or directories\nrmail (8) - handle remote mail received via ucp\nrmdir (1) - remove\
  \ empty directories\nrmt (8) - remote magtape protocol\n```\n\n*** 提示\n书中没有足够的空间涵盖正则表达式，但你可以阅读\
  \ Ben Forta 写的 *Sams Teach Yourself Regular Expressions in 10 Minutes* (ISBN:0672325667)。\n\
  \n## 根据功能搜索命令\n\n### man -k apropos\n\n只需一点训练，你就会发现可以在 man 页面中穿梭并找到你需要的内容假设你知道要读哪一个\
  \ man 页面。如果你知道一点命令的功能，但不知道命令的实际名称？尝试使用 `man` 配合 `-k` 选项（或 `--apropos`），或者直接使用 `apropos`\
  \ 命令，搜索描述你想发现的命令类型的单词或短语。你将获得所有名称或摘要匹配搜索词的命令列表。\n\n点击此处查看代码图像\n\n```\nman list\n\
  No manual entry for list\n\nman -k list\nlast (1) - show listing of last logged\
  \ in users\nls (1) - list directory contents\n```\n\n\n\n\n`lshw (1)` - 列出硬件\n\n\
  `lsof (8)` - 列出打开的文件\n\n[由于长度限制，列表省略]\n\n使用 `-k` 选项时要小心，因为它可能会产生很长的结果列表，你可能会错过正在寻找的内容。如果你认为尝试不同的搜索词可能帮助你找到需要的命令，请不要害怕尝试。\n\
  \n* * *\n\n### 提示\n\n如果你的结果特别长，且无法轻松找到想要的内容，可以尝试将 `man -k` 管道传输给 `grep`。（管道将在下一章介绍，而\
  \ `grep` 将在第 10 章 的“查找文件、目录、单词和短语”中进行详细讨论）。现在，这里有一个你可能输入的示例命令：`man -k list | grep\
  \ hardware`。或者直接尝试 `apropos`，它就在这里讨论！\n\n* * *\n\n`apropos` 命令与 `man -k` 相同，但有一个很大的例外：就像\
  \ `whatis`（在上一节讨论过）一样，你可以使用 `-w`（或 `--wildcard`）或 `-r`（或 `--regex`）选项进行搜索。更有趣的是，当你想要紧密关注某个单词或短语且不包含任何例外时，可以使用\
  \ `-e` 选项（或 `--exact`）。例如，在之前的列列表中，搜索 `list` 会出现 `last` 命令，因为在它的描述中包含了 `listing`\
  \ 一词。让我们尝试同样的搜索，但加上 `-e` 选项。\n\n点击此处查看代码图片\n\n```\n$ apropos -e list\n```\n\nls\
  \ (1) - 列出目录内容\n\nlshw (1) - 列出硬件\n\nlsof (8) - 列出打开的文件\n\n这一次，`last` 没有再出现，因为你只想要包含精确单词\
  \ `list` 的结果，而不是 `listing`。事实上，对于 `list` 的结果列表从不使用 `-e` 选项的 80 条减少到了使用 `-e` 选项的\
  \ 55 条，这使得更精确地针对你的命令搜索并找到你完全需要的命令变得容易得多。\n\n* * *\n\n### 注意\n\n`apropos` 这个词并不并不常用，但它是一个真实的词，它的意思基本上是“相关的”或“切题的”。`appropriate`\
  \ 一词的意思有些相似，但它基于与 `apropos`不同的拉丁语词根。如果你相信我，可以自己去 [www.dictionary.com](http://www.dictionary.com)\
  \ 检查一下这些词。\n\n* * *\n\n### 查看命令特定的 man 页面\n\n`man [1-8]`\n\n你可能在之前的列表中注意到，`ls` 的\
  \ man 页面第一行引用了 `LS(1)`，而在早些时候使用 `-k` 选项时，所有命令名称后面都跟着括号里的数字。大多数数字都是 1，但其中一个 `lsof`\
  \ 是 8。那么这些数字是怎么回事？\n\n答案是 man 页面被分为不同的章节，编号从 1 到 8，具体划分如下（如果你不认识某些示例，请不要担心，因为其中很多非常晦奥且专业）：\n\
  \n- **1.** 通用命令。例如 `cd`、`chmod`、`lp`、`mkdir` 和 `passwd`。\n- **2.** 内核提供的低级系统调用。例如\
  \ `gettimeofday`、`fork` 和 `chmod`。\n- **3.** C 库函数。例如 `beep`、`HTML::Parser` 和 `Mail::Internet`。\n\
  - **4.** 特殊文件，例如位于 `/dev` 中的设备。例如 `console`、`lp` 和 `mouse`。\n- **5.** 文件格式和约定。例如\
  \ `apt.conf`、`dpkg.cfg`、`hosts` 和 `passwd`。\n- **6.** 游戏。例如 `atlantik`、`bouncingcow`、`kmahjongg`\
  \ 和 `rubik`。\n- **7.** 杂项，包括宏包。例如 `ascii`、`samba` 和 `utf-8`。\n- **8.** root 使用的系统管理命令。例如\
  \ `mount` 和 `shutdown`。\n\n到目前我们在书中看过的几乎每个命令都属于第 1 节，这并不意外，因为我们关注的是 Linux 系统的通用用法。但请注意某些命令属于多个章节：例如\
  \ `chmod` 同时位于第 1 和第 2 节，而 `passwd` 可以在第 1 和第 5 节找到。默认情况下，如果你在 shell 中输入 `man passwd`，`man`\
  \ 默认选择较小的数字，因此你会得到 `passwd` 的第 1 节 man 页面，如果你想了解 `passwd` 文件，这并没有什么帮助。要查看 `passwd`\
  \ 文件的 man 页面，请在 `man` 后面加上你想检查的数据章节编号。\n\n点击此处查看代码图片\n\n```\n$ man passwd\n```\n\
  \n```\nPASSWD(1)                                        \n\nNAME\n       passwd\
  \ - change password\n\nSYNOPSIS\n       passwd [options] [username]\n\nOPTIONS\n\
  \       ...\n\nDESCRIPTION\n       passwd changes passwords for user\n```\n（注：上面的\
  \ man 页面内容是根据提供文本结构的截断表示）\n\n### 使用 info 学习命令\n\n`info`\n\n`man` 命令以及产生的 man 页面易用，尽管内容并不总是像你希望的那样友好。针对这一点以及\
  \ man 页面的其他缺陷，GNU 项目（它在许多方面对你在书中阅读的命令负责）创建了自己的格式：info。虽然 info 页面通常比 man 页面写得更好、更全面且内容更友好，但\
  \ man 页面要简单得多。man 页面只有一个页面，而 info 页面几乎总是将其内容组织成多个章节，称为节点（nodes），这些节点可能还包含子章节，称为子节点（subnodes）。关键在于学会不仅在单个页面内，而且节点和子节点之间导航。\n\
  \n### 在 info 中导航\n\n在特定章节的屏幕内，向下或向前移动一行使用向下箭头；向上或向后移动一行使用向上箭头。当你到达特定章节的底部或末尾时，光标会停止，你无法继续前进。\n\
  \n如果你想一次跳转一个屏幕，请使用键盘上的 PageDown 键；向上跳转一个屏幕则使用 PageUp 键。然而，你无法离开当前所在的特定章节。\n\n如果你到达章节末尾并想回到顶部，只需按下\
  \ `b`，代表 *beginning*（开头）。同样地，`e` 会带你到 *end*（结尾）。\n\n如果你在任何时间随处跳转时，发现某些东西看起来奇怪，例如字母或单词扭曲，按下\
  \ Ctrl+l 重新绘制屏幕，一切都会恢复正常。\n\n\n\n\n\n既然你已经知道了如何在特定章节或节点内进行导航，让我们进入如何在节点之间进行导航。如果你不想使用\
  \ `PageDown` 和 `PageUp` 在章节内向前向后移动，可以使用空格键向下移动，并使用 `Backspace` 或 `Delete` 键向上移动。这些键相比\
  \ `PageDown` 和 `PageUp` 除了更易于触及外，还提供了一个巨大的优势：当你触及一个节点的末尾时，它会自动跳转到下一个节点（如果存在子节点，则会经过子节点）。同样地，向上移动会带你回到上一个节点（经过任何子节点）。通过使用空格键或\
  \ `Backspace` 或 `Delete` 键，你可以快速浏览关于特定命令的一整套信息页。\n\n如果你想减少按键次数，可以使用 `n`（代表 *next*，下一个）移动到同级的下一个节点。如果你正在阅读一个带有子节点的节点并按下\
  \ `n`，它将跳过这些子节点，移动到与当前阅读节点同级的下一个节点。然而，如果你正在阅读一个子节点并按下 `n`，它将跳转到下一个子节点。如果 `n` 将你带到当前层级的下一个节点，那么\
  \ `p` 则将你带回到上一个节点（`p` 代表 *previous*，上一个），同样在同一层级。\n\n如果你想向前移动到节点或子节点，可以使用 `]`（右方括号）。如果你正在阅读一个节点并按下\
  \ `]`，它将跳转到该节点的第一个子节点（如果存在）。否则，它将移动到该节点的同级节点。要同样的方式向后移动，使用 ``（左方括号）。\n\n如果你想向上移动到当前阅读节点的父节点，请使用\
  \ `u`（代表 *up*，向上）键。但要小心——这很容易跳过你正在 info 中阅读的命令的主页，跳转到目录节点（Directory node）。到达目录节点的另一种方法是随时输入\
  \ `d`（代表 *directory*，目录）。\n\n目录节点是可以在整个 info 中找到所有页的一个典型例子：即一个菜单页（Menu page），它列出了所有子节点或节点。如果你发现自己处于菜单页上，可以通过两种方法快速导航到该菜单列出的某个子节点之一。首先，输入\
  \ `m`（代表 *menu*，菜单），然后开始输入你想跳转的子节点名称。例如，当你在命令行输入 `info` 时，看到的第一个页如下：[点击此处查看代码图像\n\
  \n```\nFile: dir, Node: Top 这是 info 树的顶部\n\n（目录节点）提供了主要主题的菜单\n\n输入 \"q\" 退出，“?\"\
  \ 列出所有 Info 命令，“d\" 返回此处\n\n\"h\" 为初学者提供指南，“mEmacs>\" 访问 Emacs 手册等。\n\n* Menu:\n\
  \nBasics（基础）\n\n* Common options: (coreutils)常用选项\n* Coreutils: (coreutils).GNU\
  \ 工具\n* Date input formats: (coreutils)日期输入格式\n* Ed: (ed).GNU 编辑器\n```\n\n要跳转到 Coreutils，你可以输入\
  \ `m`，然后输入 `Core`。此时，你可以完成输入 `utils`，或者直接按 Tab 键让 info 补全匹配已输入字符的菜单名称。如果 info 报错，说明你输入了错误，或者有多个菜单匹配你输入的字符。修正你的错误或输入更多字符，直到\
  \ info 明确你感兴趣的是哪一个菜单选项。如果你意识到现在不想进入该菜单选项，按下 `Ctrl+G` 取消命令并回到你正在阅读的节点。\n\n或者，你也可以使用向上或向下箭头键将光标置于你想要的菜单选项上，然后按\
  \ Enter。两种方法都有效。\n\n如果你不想导航 info 页而是想进行搜索，也可以这样做，同样有两种方法：搜索特定命令信息页的所有标题，或者在与特定命令相关的所有节点的正文中搜索。要搜索标题，输入\
  \ `i`（代表 *index*，索引，因为此搜索使用 info 创建的索引），输入你的搜索词并按 Enter。如果你的词出现在节点的标题中，它将跳转到那里。如果你想重复搜索并进入下一个结果，按逗号。\n\
  \n如果你想搜索文本而不是标题，输入 `s`（代表 *search*，搜索），输入你的搜索词或短语，然后按 Enter。要重复该搜索，立即输入 `s` 然后按\
  \ Enter。这不像搜索标题时只需按逗号那么简单，但确实有效。\n\n如果你在 info 内部迷路了并需要帮助，只需按下 `?` 键，窗口的下半部分将显示 Info\
  \ 的各种选项。使用你已学会的键在该章节中上下移动。当你想要退出帮助时，按下 `l`。\n\n最后，可能重要的是，退出 info 只需按下 `q`。\n\n###\
  \ 定命令的可执行文件、源码和手册页路径\n\n`whereis` 命令执行一个非常有实用的功能：它告诉你命令的可执行文件、源码和手册页（man pages）的路径。例如，这是\
  \ Word 可能的结果（假设它们存在）：点击此处查看代码图像\n\n```\n$ whereis kword\nkword: /usr/bin/kword /usr/bin/X11/kword\n\
  ```\n\n如果你只想搜索二进制文件，使用 `-b` 选项。点击此处查看代码图像\n\n```\n$ whereis -b kword\nkword: /usr/bin/kword\
  \ /usr/bin/X11/kword\n```\n\n如果你只想搜索手册页，`-m` 选项是你的首选。点击此处查看代码图像\n\n```\n$ whereis\
  \ -m kword\nkword: /share/man/man1/kword\n```\n\n最后，如果你只想将搜索限制为源码，尝试 `-s` 选项。点击此处查看代码图像\n\
  \n```\n$ whereis -s kword\nkword: /usr/src/koffice-1.4.1/kword\n```\n\n`whereis`\
  \ 命令是查找你正在使用的计算机上程序信息的一种快捷快速方法。你会发现自己使用它的频率比想象中要多。\n\n### 查看运行哪个版本的命令\n\nwhich\n\
  \n回想 `whereis` 命令以及当你对 Word 使用 `-b` 选项（代表*仅显示二进制文件*）时发生了什么。\n\n\n\n\n`which` 命令也是一种快速检查命令是否存在于你系统中的方法。如果命令存在于你的系统并在你的\
  \ `PATH` 中，它将告诉你找到它的位置；如果该命令不存在，你将回到命令行且一无所获。\n\n```bash\n$ which arglebargle\n\
  $\n```\n\n如果你想找到一个命令的所有位置（就像你使用 `whereis -b` 一样），请尝试 `-a`（代表 *all*）选项。\n\n```bash\n\
  $ which -a kword\n/usr/bin/kword\n/usr/bin/X11/kword\n```\n\n### 发现命令如何被解释\n\n`type`\
  \ 命令向你展示 bash 将如何解释你运行的命令。通过几个例子，这会更有意义。\n\n首先，让我们看看当使用 `type` 时会发生什么：\n\n点击此处查看代码图片\n\
  \n```bash\n$ type ls\nls is aliased to '/bin/ls -F --color'\n\n$ type cd\ncd is\
  \ a shell builtin\n\n$ type whereis\nwhereis is /usr/bin/whereis\n\n$ type mark\n\
  mark is a function\nmark ()\n{\n  mkdir -p \"$MARKPATH\";\n  ln -s \"$(pwd)\" \"\
  $MARKPATH/$1\"\n}\n\n$ type do\ndo is a shell keyword\n```\n\n`type` 命令的输出告诉我们 bash\
  \ 如何看待这些命令中的每一个。共有五种可能的答案：\n\n![Image](img/00002.jpeg) `alias`: 你创建的软链接，包括别名的目标。这对于硬链接无效，硬链接不会显示任何内容。（关于链接的更多信息，请参阅第\
  \ 3 章，“创建与销毁](#part0014.html_ch03)”）\n\n![Image](img/00002.jpeg) `builtin`: 内于 bash\
  \ 的命令，它直接在内部运行，而不是调用外部程序。内置命令示例有 `alias`、`cd`、`echo`、`history`、`source` 和 `type`。\n\
  \n![Image](img/00002.jpeg) `file`:不是内置在 shell 中的命令，因此从外部调用。本章中的 `whereis` 和 `whatis`\
  \ 就是示例。\n\n![Image](img/00002.jpeg) `function`: 由 Linux、软件或你创建的函数（在第 12 章，“你的 Shell](#part0026.html_ch12)”）。就像\
  \ `alias` 一样，`type` 也会输出函数的实际内容。\n\n![Image](img/00002.jpeg) `keyword`: bash 专保留字，如\
  \ `do`、`for`、`if`、`then`、`while` 和 `!`。\n\n如果你只想看到这五种中哪一种适用于命令，而不看其他的，请使用 `-t` 选项。\n\
  \n```bash\n$ type -t ls\nalias\n\n$ type -t cd\nbuiltin\n\n$ type -t mark\nfunction\n\
  ```\n\n这非常简单直接。`-a` 选项稍微长一点，因为它不仅提供了命令的类型，还提供了你可以找到该命令的位置列表。\n\n点击此处查看代码图片\n\n```bash\n\
  $ type -a ls\nls is aliased to '/bin/ls -F --color'\nls is /bin/ls\n```\n\n现在我们知道\
  \ `ls` 是一个别名，以及该别名的目标和原始命令的路径。\n\n`type` 命令不是你每天都会用的工具，但如果你疑惑为什么一个命令没有按照你预期的方式运行，`type`\
  \ 将帮助你发现。\n\n### 结论\n\n本章的标题是“学习命令”，这正是我们涵盖的内容。到为止，你已经看到有很多方法可以获取更多关于命令行选项的信息。两个大块头是\
  \ `man` 和 `info`，它们拥有海量的数据和对你 Linux 计算机上找到几乎所有命令的描述。记住，`whereis`、`which` 和 `type`\
  \ 也有它们用用之地，特别是当你的目标是避免翻阅 `man` 和 `info` 有时令人难以接受的海量措述时（这是一个可以理解但往往无法实现的目标）。有时，你必须卷起袖子开始阅读\
  \ man 页面。把它想象成西兰花：你可能不喜欢它，但它对你有好处。\n\n确实，本章中的许多命令在某种程度上重叠。例如，`man -k` 等同于 `apropos`，`man\
  \ -f` 就像 `whatis`，而 `whereis -b` 在功能上等同于 `which -a`。在特定情况下使用哪一个取决于你。然而，了解各种相似之处仍然是一个好主意，这样你就能阅读\
  \ shell 脚本或他人提供的指令，并准确理解发生了什么。Linux 的核心在于多样化和选择，即使是在 shell 中运行命令这种看似微小的事情上也是如此。\n\
