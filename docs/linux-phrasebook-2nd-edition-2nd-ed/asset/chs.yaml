  \ 2015 年 8 月离开了人世。\n## 移动文件和文件夹\n`mv`\n既然 `cp` 是复制文件，这看起来足够简单，但移动文件（或文件夹）呢？与在命令中删除不必要的元音的做法类似，我们有\
  \ `mv` 命令，它是 move（移动）的缩写。\n在简单的情况下，`mv` 将文件从文件系统中的一个位置移动到另一个位置。\n点击此处查看代码图片\n```bash\n\
