- img_proc: true
  md: 'The network 10.8.0.0/24 indicates the addresses that clients connecting to
    your VPN will be assigned. These addresses should be different from the addresses
    used in your network. If you use 192.168.1.x addresses in your network, do not
    use 192.168.1.x addresses for your VPN network addressing. As long as your network
    uses addresses other than 10.8.0.x, the previous configuration is safe to use.


    Save and close the file. UFW also needs to accept, rather than drop, forwarded
    packets. You can allow this by changing the UFW configuration file:


    ```

    $ sudo ufw default allow FORWARD

    ```


    Finally, the firewall needs to allow the port and protocol used for the VPN to
    send and receive traffic, as well as SSH for server administration. Enter the
    following command to allow the correct port and protocol based on the configurations
    you set in etc/openvpn/server.conf:


    ```

    $ sudo ufw allow 1194/udp

    ```


    Next, allow OpenSSH:


    ```

    $ sudo ufw allow OpenSSH

    ```


    Restart the firewall for the changes to take effect permanently:


    ```

    $ sudo ufw disable

    $ sudo ufw enable

    ```


    Your SSH connection might be interrupted as the firewall restarts, and you may
    need to log in again.


