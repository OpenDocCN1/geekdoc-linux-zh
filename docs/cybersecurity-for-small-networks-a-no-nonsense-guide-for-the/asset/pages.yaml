    $ umask 077

    ```


    This umask command won''t last after you exit the terminal session, but only the
    owner is allowed to read and write to the folders and files you create during
    this session.


    Now, using the `wg` genkey command, create the Wireguard key:


    ```

    $ wg genkey | sudo tee /etc/wireguard/private.key

    ```


    The output shown in the terminal is your private key, which will be stored in
    the `private.key` file specified in the command. Do not share this key. Treat
    it like a password—it''s how your VPN will be secured.


    With the private key created, you''ll need a corresponding public key to provide
    to your clients so they can authenticate to the server:


    ```

    $ sudo cat /etc/wireguard/private.key | wg pubkey | sudo tee /etc/wireguard/public.key

    ```


    This first command reads the contents of the `private.key` file using cat. Then,
    the `wg pubkey` command uses the private key to generate the public key. The public
    key is then output to the terminal and saved to the `public.key` file.


    Now that you have your public/private key pair, you can configure your VPN server
    and clients.


    # Configure Wireguard


    Wireguard requires a configuration file to function. This file is not created
    when Wireguard is installed, so you need to create one from scratch. Create and
    open the `/etc/wireguard/wg0.conf` file using a text editor:


    ```

    $ sudo nano /etc/wireguard/wg0.conf

    ```


    Add the following contents to the file:'
