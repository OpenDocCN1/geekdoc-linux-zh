    # Cloud Backup Solutions


    Although cloud services like Google Drive and Dropbox are not true backups, they''re
    capable of keeping a secondary copy of your local data in the cloud (akin to an
    offsite backup), keeping tertiary copies on your systems, and maintaining a version
    history of each of your files—and do all of this consistently and regularly. Most
    of these services come with'
  merge: -1
  pgno: 208
- img_proc: true
  md: 'some level of free storage as well, so you can try them out and upgrade to
    a paid plan if you decide they work for you.


    Google Drive and Dropbox are generally designed for file sharing and online collaboration
    rather than for backing up data. Using a service geared explicitly toward backing
    data, although not free, will generally provide more features, granular control,
    and storage at a lower cost. Backblaze and Carbonite are two reliable cloud backup
    services that encrypt your data locally and automatically back it up using a client
    application on your computer. Backblaze will back up your files, and Carbonite
    is capable of backing up your entire computer. In general, look for services that
    encrypt your data both at rest and in transit. Carbonite and Backblaze are currently
    available for Mac, Windows, and Linux.


    # Backblaze


    Backblaze is a great option if you want a set-and-forget backup solution. Once
    downloaded and installed, it immediately begins backing up your files to the Backblaze
    cloud servers and will continuously do so unless to do otherwise. Virtual machine
    files and folders are the only data automatically excluded, although you can remove
    those from the exclusions list. You''ll be able to back up not only your computer''s
    internal hard drive but any attached external drives as well. Backblaze maintains
    all versions of your files for the previous 30 days, which can be extended to
    one year or more with an additional fee. You can restore your files from the application
    (shown in Figure 9-5), the web UI, the mobile app, or by having Backblaze physically
    mail your files to you on a USB drive.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '![](img/8fad00e2c75135eb78018c62b7973377_210_0.png)


    **Figure 9-5:** Backblaze GUI


    The security features Backblaze offers are worth considering. Your files are first
    encrypted by the application, and are transferred to the cloud using SSL (encrypted
    transmission), and are then stored, encrypted, by the Backblaze servers. Even
    better, you''re able to configure your own decryption key, so Backblaze itself
    is unable to decrypt your data, which adds another layer of complexity for any
    adversary who might gain access to your encrypted data. You can also add two-factor
    authentication so that, in addition to your password, your decryption key, and
    your email address, anyone who wants to access your data, including yourself,
    requires a one-time password. With all of these features combined, any third party
    trying to access your data will have a lot of layers of defense to contend with.
    Additionally, Backblaze is one of the cheapest cloud backup solutions available.


    # # Carbonite


    If you need a backup provider capable of restoring your entire computer in the
    event of catastrophic failure, Carbonite is one possible solution. In extreme
    cases, like the event of ransomware, having the capability to'
  merge: -1
  pgno: 210
- img_proc: true
  md: 'restore your computer all the way down to the operating system settings and
    configuration in addition to your critical files is beneficial because you might
    find the entire operating system becomes corrupted or otherwise unusable. Carbonite
    has several plans at tiered price points so you can choose the level of cover
    for your specific needs. As with Backblaze, Carbonite locally encrypts all the
    data it backs up, which is sent to the cloud over SSL and encrypted on the Carbonite
    servers. Depending on the plan you choose, it''s capable of backing up external
    hard drives and provides unlimited cloud storage (in some cases). Carbonite will
    keep your backed-up files for an unlimited amount of time, and won''t delete files
    older than 30 days.


    Once you''ve downloaded and installed the application (shown in Figure 9-6), it''ll
    start uploading the first backup of your data automatically. You can tell it which
    files to include or exclude.


    ![](img/8fad00e2c75135eb78018c62b7973377_211_0.png)


    Figure 9-6: Carbonite GUI, like Backblaze, will run in the background, continuously
    backing up your data. When you want to restore a file from your backup, you can
    do so through the application. There is no web UI or mobile app available.'
  merge: -1
