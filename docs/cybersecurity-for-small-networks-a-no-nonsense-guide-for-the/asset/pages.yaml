  md: 'with a destination port of 22. Both of those settings are optional. You can
    specify multiple ports with this syntax: `--match multiport --dports port1,port2,port3.


    **NOTE** Transmission Control Protocol (TCP) is a reliable transmission protocol,
    designed to ensure successful delivery of packets over a network. If a computer
    expects packet loss during communication that’s using TCP, those lost packets
    will be retransmitted, ensuring all of the data sent is eventually received by
    the destination host. User Datagram Protocol (UDP) is an unreliable protocol and
    does not ensure successful transmission of data or retransmit lost packets. UDP
    is used when some packet loss is acceptable and usually results in a faster connection.
    TCP is used when reliability matters, and every packet must be transmitted successfully.


    The iptables firewall offers multiple matching modules, and you can specify the
    module to use with the -m argument. In this example, conntrack, a tool that allows
    stateful packet inspection, is used (also optional). Some other tools include
    conbytes, which creates rules based on the amount of traffic transferred, and
    connrate, which matches on the transfer rate of the traffic. See the iptables
    man page for more details: https://linux.die.net/man8/iptables.


    Next, --ctstate tells iptables to allow and track traffic for the types of connections
    that follow—in this case, NEW and ESTABLISHED. Many values are available for connection
    state, but the most frequently used are NEW, ESTABLISHED, RELATED, and INVALID.
    New and established states are self-explanatory; the packets are part of new or
    established traffic flows. Related packets don’t match an established connection,
    but they are expected by the firewall because an existing connection necessitates
    it (that is, it’s expected based on the firewall’s existing context). Invalid
    packets are any packets that don’t match the criteria for any other states.


    Finally, iptables will interpret -j and follows it as the action to jump (perform)
    when this rule is matched. Most commonly, it will be either ACCEPT to allow traffic
    matching this rule; DROP, or REJECT, to deny or block the traffic; or LOG to log
    the traffic to a logfile (more details on that later).'
