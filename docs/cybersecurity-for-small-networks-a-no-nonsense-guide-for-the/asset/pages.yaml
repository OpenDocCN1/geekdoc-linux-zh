    # #25: Blocking Ads with Pi-Hole


    Blocking ads with a browser extension or built-in tools is a great start to

    hancing your internet browsing experience. However, those options apply

    to only one device at a time, and managing settings for multiple devices can

    quickly become onerous. Not only that, but some websites can block

    browser extensions. Blocking ads at the DNS level mitigates all of these

    issues.


    The Domain Name System (DNS) enables your computer (or browser) to

    communicate with websites on the internet. All websites have an IP address

    (or more than one) assigned to them. Compared to IP addresses, the URLs

    that you use to access websites (for example, www.facebook.com) are

    human-readable and easy to remember. Your computer translates that URL

    to an IP address to find the web server on the internet that serves

    Facebook to you—enter DNS. DNS acts like the postal service, in that IP

    addresses are equivalent to physical addresses, and URLs are like street

    names. DNS allows you to send and receive internet traffic to a specific

    names without having to remember the exact address (the IP

    address) of server.


    Given that advertising domains also use DNS to serve ads, let''s build

    a Pi-Hole server to send all of these requests to a blackhole and provide

    y users with a better browsing experience. Pi-Hole is similar to the

    Squid proxy discussed in Chapter 6; it sits between you and the websites

    y want to browse, observing all internet traffic, identifying advertising at

    the DNS level via a curated list of known advertising domains and

    addresses, and allowing only legitimate, non-ad traffic to pass through to'
  merge: -1
  pgno: 162
