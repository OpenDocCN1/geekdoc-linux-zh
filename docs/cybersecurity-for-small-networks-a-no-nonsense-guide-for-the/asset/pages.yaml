    [Interface]

    PrivateKey = your_private_key

    Address = 10.8.0.1/24

    ListenPort = 26535

    SaveConfig = true

    ```


    Replace your_private_key with the private key you created earlier. Your key will
    be the contents of your /etc/wireguard/private.key file. The address will be the
    address of your server within the subnet you want your VPN clients to be assigned
    when they connect to your server; ensure that this subnet is different from your
    private network. if you use 192.168.1.x addresses in your network, avoiding using
    192.168.1.x addresses for your VPN. The listening port should be any port between
    1025 and 65535, chosen at random. This port is the one server and clients will
    use to communicate. Once complete, save and exit the configuration file.


    At this point, the server''s network settings require some modification. Configure
    IP forwarding so the VPN will forward the traffic it receives using the following
    command and restart sysctl so that the changes effect:


    ```

    $ sudo sysctl -w net.ipv4.ip_forward=1

    $ sudo sysctl -p

    ```


    Next, you need to configure the firewall to allow VPN traffic to ingress and egress
    the server.


    # Configure the Firewall


    In this section we''ll discuss the use of the Uncomplicated Firewall (UFW), Ubuntu’s
    built-in firewall that is designed to reduce the complexity of firewall configuration.
    To configure the firewall, first identify the correct network interface for the
    VPN. Specifying the wrong interface will result in a nonfunctional VPN. Enter
    the following command to locate your server’s default network interface:


    ```

    $ ip route | grep -i default

    ```'
