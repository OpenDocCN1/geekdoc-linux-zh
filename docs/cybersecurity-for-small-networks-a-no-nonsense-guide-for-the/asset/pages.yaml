  md: '# #14: Testing Your Firewall


    With one or more of these rules in place, test the firewall to ensure the blocked
    traffic is actually being blocked. The best tool for this purpose is Nmap, which
    is used for network scanning or network mapping. It''s available in GUI form on
    Windows, Linux, and Mac (called Zenmap) and also as a command line tool. Installing
    the GUI version will make it available on the command line, so download and install
    the latest version from https://www.nmap.org/.


    Otherwise, you can install it using the command line on Ubuntu:


    ```

    $ sudo apt install nmap

    ```


    Once you''ve installed Nmap, use the following command to scan port 445 from the
    command line, which we''ve told the firewall to block:


    ```

    $ sudo nmap -p 445 -A scanme.nmap.org

    --snip -

    ```


    Nmap scan report for scanme.nmap.org (45.33.32.156)

    Host is up (0.20s latency).

    Other addresses for scanme.nmap.org (not scanned):

    2600:30c1::f03c:fe18:bb2f

    PORT STATE VERSION

    445/tcp filtered microsoft-ds

    Service detection performed. Please report any incorrect results at https://nmap.org/submit/.\Nmap
    done: 1 IP address (1 host) scanned in 2.54 seconds


    You can use the same command in the Zenmap GUI—just sudo. This command will perform
    a port scan from your device, which is behind your firewall, on the http://scanme.nmap.org/
    website, a public web page available for testing purposes from the creators of
    Nmap.


    The command breaks down like this: nmap is the name of the program. The -p 445
    argument specifies the port or ports to be scanned, which can be either a comma-separated
    list (such as -p 445, 137, 138, 22), a specific port as shown, or a port range
    like -p1-1024. The -A argument tells Nmap to try to identify the service and operating
    system on each scanned port, and'
  merge: -1
