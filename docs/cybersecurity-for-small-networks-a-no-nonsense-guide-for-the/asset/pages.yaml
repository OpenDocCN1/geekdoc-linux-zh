  md: '# MONITORING YOUR NETWORK WITH DETECTION AND ALERTING


    ![](img/8fad00e2c75135eb78018c62b7973377_216_0.png)


    Network monitoring provides real-time visibility into your network activity, enabling
    you to stay ahead of potential threats and (ideally) stop adversaries before they’ve
    performed any disruptive action. Monitoring your network is a huge undertaking,
    so alerts are often a useful starting point for investigations. Without meaningful
    alerts, network monitoring is like finding a needle in a haystack—trying to identify
    malicious activity within a very large dataset.


    Your firewalls, proxies, antivirus, and other solutions should be up and running
    for at least a month before you start to actively monitor your hosts and network
    traffic, just to ensure they’re functioning correctly. Up until this point, everything
    has been relatively passive; once set up, no further input from you is required,
    unless you need to update or change the configuration.


    Due to their nature, active monitoring and alerting can take considerable time
    and effort—not only to implement but to maintain, and that is especially true
    as a network expands. Not only will you need to check regularly to see whether
    your network monitoring software has identified any threats or unusual behavior,
    but you’ll also need to investigate this behavior and potentially work to mitigate
    the identified activity. Depending on the size of the network, monitoring it could
    be a full-time job for one or more people.'
  merge: -1
  pgno: 216
- img_proc: true
  md: 'This chapter will arm you with the knowledge and tools required to monitor
    your network and alert you to suspicious behavior successfully. We''ll discuss
    how, when, and where to implement network traffic access points (TAPs) and a switch
    port analyzer (SPAN) in your network to enable network traffic capture, monitoring,
    and analysis. Finally, we''ll build a network monitoring appliance using Security
    Onion—a free suite of network security monitoring tools—and discuss how best to
    utilize its built-in capabilities.


    # Network Monitoring Methods


    You can use several methods to monitor and capture network traffic for real-time
    or post-fact analysis and alerting. The method you choose depends mostly on your
    network’s hardware, as each device has different capabilities. We’ll discuss two
    of the most common methods in the following sections.


    # Network Traffic Access Points


    In small networks without switches, you can install a network traffic access point
    (TAP) to monitor the data that passes through it. A TAP is an inline device, placed
    between two nodes on a network; it becomes an extension of the transmission medium
    (like an Ethernet cable) that already exists between those two devices. In Figure
    10-1, the TAP is between the firewall and router.'
  merge: -1
  pgno: 217
- img_proc: true
  md: '![](img/8fad00e2c75135eb78018c62b7973377_218_0.png)


    **Figure 10-1:** Placement of a network TAP


    In this configuration, all traffic passing between the router and the firewall
    is sent by the TAP to a monitoring device, where it''s stored for analysis.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# TAPS AND INTRUSION DETECTION SYSTEMS


    Coupling TAPs with an intrusion detection system (IDS) allows administrators to
    identify suspicious activity occurring across this ingress and egress point. An
    IDS is a software or hardware tool that uses a set of rules or signatures to identify
    known-bad behavior. When an IDS identifies something suspicious in your network
    traffic, it will generate an alert that you can investigate to decide whether
    it''s actually malicious (a true positive) or benign (a false positive). You can
    then ignore the alert or take action to mitigate and remediate the problem, which
    we''ll discuss at length later.


    Placing a TAP, consider what you actually want to see and investigate. In a configuration
    like the one shown in Figure 10-1, you''d capture all the traffic between your
    endpoints and the firewall (the network''s boundary). Monitoring your major egress
    points lets investigate things like data exfiltration, where an adversary is trying
    to steal your data by sending it outside your network. However, with this configuration,
    you won''t be able to see traffic between your endpoint devices, as that is handled
    by the wireless router and never reaches the TAP.


    If you placed the TAP behind the firewall (as opposed to on the internet side),
    you wouldn''t see any traffic from the internet attempting to reach the internal
    network that'' blocked by the firewall. If the TAP is in front of the firewall,
    you wouldn''t see the outbound traffic being blocked by the firewall; the security
    monitoring system would also lose the protection of that firewall and become an
    easy route into your network. Decide of which of those scenarios you''re comfortable
    with and place your TAP accordingly. In most cases, it''s best to place the TAP
    behind the firewall (inside your network) and review the firewall logs for what
    the TAP doesn''t see.


    A TAP is an inline device. Be aware that if the TAP becomes unavailable or goes
    offline—if any of its limited network ports fail—your entire network will lose
    access to the internet. Your endpoint devices should still be able to communicate
    with each other via the router, but traffic will no longer pass through the TAP.'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'Several TAP devices are available at reasonable prices. One of the simplest
    is the Dualcomm ETAP. One possible configuration of such a TAP would be to connect
    the firewall in Figure 10-1 to the A inline port, connect the B inline port to
    the wireless router, and connect a separate cable to the network security monitoring
    device (discussed in the next section). Such a configuration would allow traffic
    to flow through the TAP as if it wasn''t there, except that it would be intercepted,
    monitored, and analyzed by the network security monitoring system.


    # Switch Port Analyzers


    An alternative to a network TAP is the switch port analyzer (SPAN) or mirror port
    (interchangeable terms) functionality provided by a switch. SPAN does the same
    thing as a TAP; it mirrors (or copies) all the data passing through a source port(s)
    to the destination SPAN port on the switch. Your network security monitoring system
    is then connected to the SPAN port to capture the network traffic for analysis
    and alerting. In most modern switches, it''s possible to create a SPAN configuration
    with multiple source ports, so you can capture data from any port(s) on a switch.


    A SPAN configuration in a small network might look like the one shown Figure 10-2,
    where the firewall or other system provides IP addresses to endpoints. Each host
    is connected by Ethernet to a port on the switch, and then the network security
    monitoring device is connected to the SPAN configured on the switch. Unlike TAPs,
    if a port on the switch fails, the rest of the network continues functioning,
    but if the entire switch goes offline due to a power failure, the entire network
    will go down with it.'
  merge: -1
  pgno: 220
- img_proc: true
  md: '![](img/8fad00e2c75135eb78018c62b7973377_221_0.png)


    Figure 10-2: A small network with a switch and SP port


    Unlike a TAP configuration, with a SP set up on a switch, you''ll be able to capture
    and analyze computer-to-computer traffic in addition to inbound and outbound data.
    You''ll still have the placement issue, though; when the switch is on the internal
    side of the firewall (as it should be), your security monitoring system won''t
    have visibility over the traffic blocked by the firewall.


    # #35: Configuring a SPAN Port'
  merge: -1
  pgno: 221
- img_proc: true
  md: 'To configure a SPAN port on a managed switch, like the Netgear switch that
    we used in Chapter 2, follow these steps:


    +   1. Log in to the switch with administrator credentials.

    2. Select System►Monitoring►Mirroring.

    3. In the Port Mirror Configuration table that appears, click the source ports
    from which you want to capture network traffic to select them. Selected ports
    will have a check mark.

    4. In the Destination Port drop-down box, enter the port to use as the SPAN port
    you’ll connect to your security monitoring system.

    5. Finally, in the Mirroring drop-down menu, select Enable►Apply.


    Whether you choose to set a TAP or a switch with a SPAN port, you’ll need a network
    monitoring solution capable of aggregating collected data. The best solution currently
    available for small networks is Security Onion, which includes various components
    for capturing and aggregating network data and enables you to quickly analyze
    that data.


    # Security Onion


    Security Onion is an open source platform for threat hunting, network monitoring,
    and log management. It’s an operating system, like Ubuntu, which includes several
    open source tools we’ll utilize to monitor our network for security and configuration
    issues.


    Security Onion’s tools include suricata, an intrusion detection system, and zeek,
    a software framework for analyzing network traffic to identify anomalous behavior.
    Grafana is a set of visualizations and dashboards for monitoring the health of
    the Security Onion system, and osquery gathers data about the endpoints in your
    network and the operating systems they’re running for analysis. Wazuh is similar
    to osquery; it’s an agent-based tool that gathers analyable data from your endpoints
    and is used for active endpoint detection and response (in the case of a security
    incident). Finally, Strelka is a real-time file-scanning utility that analyzes
    network traffic and'
  merge: -1
  pgno: 222
- img_proc: true
  md: 'scans any files traversing the network; it’s useful for identifying malware
    or data exfiltration.


    # SECURITY ONION TOOLS FOR LARGER NETWORKS


    Security Onion makes use of the ELK stack (which includes Elastic, Logstash, and
    Kibana) to create visualizations and dashboards. ELK is similar to Grafana, except
    where Grafana is used to display information about the system itself, ELK displays
    information about the network data being captured, allowing the user to view and
    analyze the easily. ELK is a powerful tool but it is outside the scope of this
    book as it is more advanced than the tools within Security Onion’s dashboard.
    However, many online resources discuss ELK and its use in great detail if you’d
    like to investigate it further.


    Security Onion is designed to be scalable and is capable of monitoring very large
    networks, so it includes tools that aren’t necessary on small networks, such as
    TheHive, an incident management system, and Playbook, a tool for creating incident
    management playbooks; those tools are primarily used in larger networks, so they
    aren’t covered here.


    In the following sections, we’ll discuss creating your network security monitoring
    system using Security Onion and its built-in tools. We’ll explore how to utilize
    these tools to start monitoring your network, and how to triage and investigate
    problems when they arise. It’s up to whether you’d like to buy or build your Security
    Onion appliance. Security Onion Solutions has preconfigured appliances ready to
    go out of the box.


    # #36: Building a Security Onion System


    To build a Security Onion system, you’ll need a device with a minimum of two network
    interfaces: a management interface and a capture interface (connected to the TAP
    or SPAN). We’ll use an Intel NUC (a small form factor computing unit) with two
    Ethernet ports, which is very customizable and available at various price points
    depending on your budget and'
  merge: -1
  pgno: 223
- img_proc: true
  md: 'requirements. The following minimum hardware specifications are detailed in
    the Security Onion documentation:


    +   * 12GB of RAM

    * Four CPU cores

    * 200GB of storage

    * Two network interfaces


    One additional consideration is how much storage you need. For reference, NUC
    with an internal storage space of 2TB might be capable of storing around three
    weeks of data, depending on the number of devices, number of users, and amount
    of network traffic in your network. After that point, the data will be kept on
    a rolling cycle, where older data is deleted in favor of newer data. To enable
    better incident response capabilities in your network, the more data you keep,
    the better. If you discover an adversary in your network that has been there for
    12 months but you have only one month of data, you''ll never be able to determine
    root cause, making it difficult to kick them out and prevent the problem from
    recurring.


    Once you have a NUC (or similar device), you''ll install Security Onion. At this
    stage, it''s also a good idea to connect the network port you plan to use for
    management (not the port you''ll use for capturing network traffic) to your network
    so you can set up its configuration. It doesn''t matter which of the two network
    ports you use for management and traffic capture. This device will need a static
    IP address, and while you could do that on the device itself, it''s better to
    configure the static addressing on your router or whichever device is responsible
    for IP address leases in your environment (like your wireless router or pfSense
    device). Having the management port on your NUC (and only this port) will make
    it easier to identify when installing and configuring the rest of the software.
    After this process is complete, you can then configure the capture port independently.
    You should configure the static IP address for the management interface now, as
    some of the agents we''ll install have requirements and dependencies based on
    this address, so changing it later can create challenges.'
  merge: -1
