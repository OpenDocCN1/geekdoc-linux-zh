    # Internet of Things Considerations


    We discussed internet of things devices like Google Home and Amazon Alexa and
    the methods by which you can mitigate the risks of smart devices using network
    segmentation in detail Chapter 2. However, there are still'
  merge: -1
  pgno: 266
- img_proc: true
  md: 'risks associated with devices with always-on cameras and/or microphones that
    need to be considered.


    Whether it''s a laptop of desktop computer, a gaming console, or a smart home
    device, many modern endpoints have a microphone or camera (or both) built in.
    For a determined adversary, these devices can be used to spy on you and those
    around you. Therefore, wherever possible, it''s best to invest in smart home devices
    that have a physical switch or button for these features. If that isn''t possible,
    consider using a webcam cover (available cheaply from many online stores) or a
    piece of opaque tape to cover your web cameras when not in use. Doing so is one
    of the best ways to protect your privacy.


    Besides covering any cameras, consider where you place and use smart home devices.
    In the case of smart speakers, you might choose to use them only in common areas,
    away from private areas like bedrooms or private offices. Consider the activities
    and conversations that might take place in range of the microphone and place devices
    accordingly.


    # Additional Resources


    This book has been an introduction to the fundamentals of cybersecurity and ideally
    has enabled you to think more deeply about the security of your network and users
    and implement solutions to help protect your privacy. However, there are so more
    resources available that delve further into these topics than can be covered here.
    The first I''d like to mention is https://chrissanders.org/. Chris has written
    several books and online courses covering topics such as network security monitoring,
    intrusion detection, and advanced use of the ELK stack, we briefly discussed in
    Chapter 10. If you''d like more information on any of these topics, this is a
    great place to start.


    Another fantastic resource for anyone interested in cybersecurity, digital forensics,
    or incident response is https://dfir.training/. This website contains a wealth
    of information related to tools, training courses (free and commercial), practice
    materials, and other resources to add to your knowledgebase and improve your security
    maturity.'
  merge: -1
  pgno: 267
- img_proc: true
  md: 'Finally, SANS is a research and training organization with a focus on cybersecurity.
    At https://www.sans.org/, you can find more information on their training courses,
    but also several resources and research papers related to tools and techniques
    for securing networks and endpoints, both a defensive and offensive viewpoint.


    # Summary


    Ultimately, your online privacy and security can be as well-protected as you like.
    The trade-off for being secure on the internet is one of compromising privacy,
    security, or both, for convenience. At the cost of slightly less convenience,
    you''ll receive a better overall experience on the internet and enjoy a higher
    level of security and privacy, whether it''s yours alone or shared with your users.
    The benefits of being secure far outweigh the inconvenience of implementing these
    solutions.'
  merge: -1
