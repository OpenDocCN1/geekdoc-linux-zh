    The second portion of the recommended minimum configuration section tells Squid
    which ports can send and receive traffic:


    ```

    --snip---

    acl SSL_ports port 443 # http

    acl Safe_ports port 80 # ftp

    acl Safe_ports port 21 # https

    acl Safe_ports port 443 # gopher

    #acl Safe_ports port 70 # waits

    acl Safe_ports port 210

    acl Safe_ports port 1025-65535 # unregistered ports

