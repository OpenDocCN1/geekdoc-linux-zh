- img_proc: true
  md: 'In Figure 4-3, the MAC filter for the 5 GHz band is Enabled, and the Mode option
    is set to Reject. This mode causes the filter to function as a denylist, meaning
    anything on the list will be blocked or denied access. An allowlist, on the other
    hand, is a list of endpoints that will be allowed access. Use a denylist when
    you know the MAC address of a device to which you want to deny access. In most
    cases, you''ll use the Accept, or allowlist, mode instead. In Accept mode, the
    MAC filter list contains the MAC addresses that you explicitly allowed access
    to the network.


    Select Enable Mac Filter and Accept and then enter the MAC addresses from your
    asset list. Once you''ve added all the MAC addresses and saved your configuration,
    no devices except those specified can connect to the wireless network and acquire
    an IP address. You can test this by removing one of the less critical devices
    from the Accept list and trying to connect it to the network. If it refuses to
    connect, your MAC filtering is working correctly.


    # #17: Segmenting Your Network


    Wireless networking grants you the ability to share an internet connection with
    guests by using a separate guest network without compromising your security. Most
    mid-range wireless routers offer this functionality. The ASUS RT-AC5300, for example,
    allows for multiple guest networks on both the 2.4 GHz and 5 GHz wireless frequencies,
    as shown in Figure 4-4.'
