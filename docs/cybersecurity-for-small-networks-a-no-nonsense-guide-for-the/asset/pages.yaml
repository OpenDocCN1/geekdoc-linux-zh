- img_proc: true
  md: '# Network Devices


    Hubs, switches, and routers can be used to segment a network. Some of these provide
    more features or are inherently more capable and secure by design. Depending on
    your needs, you might choose to use one, some, or all of these devices.


    # Hubs


    A network hub is the most basic type of device that enables multiple computers
    to communicate with each another. A hub can be used in small networks relatively
    safely, whereas in larger networks they would likely cause significant issues.
    When host A, connected to a hub, communicates with host B, the data (packets represented
    as Ethernet frames) travel from host A to a port on the hub, and the hub broadcasts
    that data out all of its other ports. This means every other endpoint on the network
    receives the data destined for host B, which is not secure. Additionally, because
    hubs aren''t intelligent, all ports are part of the same collision domain. This
    means that if two or more devices attempt to communicate at the same time, the
    traffic collides, causing network performance problems. When a collision occurs,
    the devices have to stop communicating and wait a randomized amount of time before
    attempting to communicate again, ideally without causing a second collision, resulting
    in a further delay.


    Because of their limited functionality, hubs are typically cheap to buy and deploy,
    but they aren''t scalable. If you have more than a handful of devices needing
    to communicate, you''re better off getting a switch.


    # Switches


    In contrast to hubs, switches forward traffic through a network using the physical
    hardware (MAC) addresses of the endpoints connected to them. When a host connected
    to a switch communicates with another host in the network, the data travels from
    the sender to a port on the switch, and the switch then uses the MAC address for
    which the data is destined to determine which port it should forward that data.
    Switches keep a MAC'
  merge: -1
  pgno: 54
- img_proc: true
  md: 'address table in memory, so they know where each endpoint is located the network.
    Each port on a switch has its own distinct collision domain, meaning that if two
    hosts communicate simultaneously, there won''t be a collision—the packets won''t
    meet each other during transmission. This also means that data isn''t broadcast
    to every device on a network, which makes a switch inherently more secure than
    a hub.


    Switches can be used in networks of any size. Small networks rarely more than
    a single switch, depending on the number of endpoints.


    # Routers


    A router is primarily used for transmitting data between networks or network segments.
    For example, your local intranet, where all of your endpoints are connected, is
    a private network. The internet, a very large, publicly accessible computer network,
    is separate from your private network. A router is the conduit between these two
    networks, enabling you to access one from the other and browse the internet. Where
    a switch MAC addresses, a router is primarily concerned with IP addresses. All
    internet-connected networks use a router of some type. In a small network, the
    border router that connects your network to your internet service provider is
    likely the only router you''ll need.


    # Creating Trust Zones


    Network segmentation is the practice of dividing a network into smaller parts,
    known as subnets, to increase the overall performance and security of that network.
    You can segment your network by separating devices either physically or logically.


    # Physical Segmentation


    Arguably the simplest way to segment your network is to separate devices using
    physically discrete hardware (physical segmentation). For example, you can use
    one wireless router for your computers and another for your'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'mobile devices. Or you might use the first router for all your personal devices
    and the second for all your IoT devices.


    Separating your devices and users into classes or categories puts them into trust
    zones, which keep your most critical data and assets separate from more vulnerable
    devices. Separating devices that require more security and monitoring from those
    that require less security, and therefore less overhead to maintain, allows you
    to spend more time focusing on the assets that matter and less time managing those
    don''t.


    By keeping devices of different types separate, your network''s security increases,
    as an attack on one type''s vulnerability doesn''t allow the attacker to move
    to other segments of your network. This is becoming more important as household
    appliances are gradually turning into smart devices.


    Physical network segmentation is harder for an attacker to overcome than logical
    segmentation. The drawbacks associated with physical segmentation are increased
    administrative overhead, hardware cost, and other infrastructure costs, as you
    might need a separate internet connection for each physical network.


    # Logical Segmentation


    Logical segmentation is more common than physical segmentation and often less
    expensive to implement because it doesn''t require separate pieces of physical
    hardware for each network segment. Logical segmentation is usually achieved through
    virtual local area networks (VLANs): groups of systems that appear to be on the
    same local area network but are logically separated from systems on other VLANs.
    Switches capable of creating and managing switches. Each VLAN acts like a virtual
    switch that exists within your physical switch. Assigning a physical port on your
    switch to a particular VLAN is equivalent to plugging a cable into a specific
    switch.


    For example, you can place a switch, like an eight-port Netgear GS308E (or similar),
    behind your broadband router, allowing the endpoints connected to the switch access
    to the internet. Then, on the switch itself, you can create VLANs with different
    purposes, such as a management or administration VLAN, a business or personal
    VLAN for your primary'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'endpoints, and a guest VLAN for less-secure device types such as mobile and
    IoT devices.


    With the VLANs created, you can specify which of the eight ports on the switch
    are capable of communicating on each of these VLANs, keeping each of the VLANs
    and their respective devices logically separated by just one physical device.
    Of course, this approach works best for networks with more Ethernet or hardwired
    devices than wireless devices, unless you plan to use multiple wireless access
    points.


    # #11: Segmenting Your Network


    The recommended approach for network segmentation in small networks is to categorize
    your endpoints into trust zones based on the type of access and security of monitoring
    them you require.


    For example, your primary network segment should include your primary devices,
    which contain or have access to your private data such as your email, contacts,
    messages, and data stored in cloud services like Google Drive or Dropbox. This
    network segment is designed to be the most secure, with the strictest security
    requirements and the most monitoring and detection in place.


    Your secondary network segment is for those endpoints that don''t need to talk
    to your primary devices or access the same data, such as your IoT and other connected
    devices—smart lights, printers, casting devices such as Google Chromecast, and
    so on. All of these devices should be separated in their own segments because
    they''re inherently secure than your primary devices; this mitigates the risk
    of an adversary using them as a stepping-stone into your network. This network
    segment can afford to have less security controls, because it doesn''t contain
    any critical data or information.


    Next, you might have one or more tertiary network segments where all other endpoints
    live, such as your guest network. Again, this segment can have less strict security
    controls and less monitoring than your primary network segment.


    Finally, depending on the types of devices you have in your network (or plan to
    have), you might want a network segment that has very strict access rules. This
    network could be for devices that you do not want to connect to'
  merge: -1
  pgno: 57
- img_proc: true
  md: 'the internet under any circumstances, including CCTV or security cameras. With
    tight network segmentation like this, other considerations need to be made, such
    as how devices within this network segment will receive updates.


    There are various ways to segment your network. Let''s go into more detail about
    how to achieve effective network segmentation, first by using separate wireless
    networks and then by Ethernet segmentation with VLANs. It''s possible to combine
    these approaches if your network calls for it.


