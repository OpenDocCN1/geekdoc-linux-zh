  md: '# #16: Limiting Network Devices


    Most small, nonenterprise networks rarely specify or otherwise limit the devices
    present in their networks and suffer from being too open, allowing all devices
    to connect. While this setup provides convenience, particularly when you buy a
    new device or friends come over, it''s an insecure practice that leaves a wide
    hole for potential adversaries, whether targeted or opportunistic.


    You can avoid this security risk by identifying all the devices allowed to connect
    to your network and restricting access to just those devices. Creating an asset
    list—a table containing data about each device, such as its type (PC, laptop,
    mobile phone, and so on), location, hostname, MAC address (its hardware address),
    and IP address—will complement your network map and vice versa, you keep track
    of the various devices on your network.


    Once you''ve collected this information for all the endpoints in your network,
    you can assign static IP addresses to known devices and reduce the assignable
    IP address range within your DHCP server. Make the range small enough to include
    enough addresses for the devices in your asset list and your network map. By reducing
    the number of available addresses, lower the risk of an adversary adding new devices
    to your network without detection. Even having taken this security measure, an
    adversary may be able to force one of your devices to disconnect and connect their
    own in its place. This is where MAC address filtering comes in.


    MAC address filtering lets you allow or deny access to your network based on a
    device''s MAC address. If you know the MAC addresses of all allowed devices, you
    can make unauthorized devices harder to add to the network and easier to detect.


    # Creating an Asset List


    Unlike large enterprises, making an asset list in smaller networks is fairly straightforward.
    First, create a chart like the one in Table 4-1 using pen and paper, Excel, or
    some other tool.'
