  md: '# 9


    # BACKING UP YOUR DATA


    ![](img/8fad00e2c75135eb78018c62b7973377_193_0.png)


    Having a reliable, well-defined, and well-implemented backup strategy is one of
    the best defenses any network can have against malicious or accidental data loss.
    Whether you mistakenly delete a folder of critical documents, an adversary executes
    ransomware inside your network, or a natural disaster destroys your devices, backups
    can save you from catastrophe.


    This chapter introduces various backup considerations, including different backup
    types, creating backup schedules, the value of onsite and offsite backups, what
    to back up, and backup storage options. Finally, we''ll show how to implement
    different solutions within your network.


    # Backup Types


    You should consider three types of backups when implementing your backup schedule:
    full, incremental, and differential.


    # Full Backup


    A full backup contains a complete copy of everything you want to back up from
    a specific host or location (called a backup set). For example, you might decide
    want to regularly create backup copies of everything in your user profile on your'
  merge: -1
  pgno: 193
- img_proc: true
  md: 'computer. Alternatively, you may want a copy of the entire disk or volume,
    including operating system files. Either of these options are viable and could
    be considered a different backup set.


    Full backups provide quick, easy restoration of all files from a backup set. Because
    all data is contained in a single backup, the process to restore will be faster
    than other backup options. However, full backups require more storage, especially
    if you''re keeping more than one, and they take the longest amount of time to
    create.


    # Differential Backup


    Differential backups contain only copies of the data that''s changed since the
    last full backup, lending themselves to more frequent use than full backups. If
    you decide to take a full backup once a month, it''s a good idea to schedule a
    differential backup once a week. It''s recommended to create a full backup regularly
    to keep the size of your differential backups under control (rather than taking
    one full backup of your backup set and then creating differential backups only
    from that point forward).


    Differential backups take up a lot of storage space, as the first backup contains
    copies of all the files modified since the last full backup, and then the next
    differential backup contains all of that data, plus all of the additional modified
    files between the first and second differential backups. Without a full backup
    at some point in the chain, differential backups will become exponentially larger
    as time goes on. Also, if one or more of the differential backups are incomplete,
    you won''t be able to achieve a full recovery from the partial differential backup
    and the full backup of the data.


    # Incremental Backup'
  merge: -1
  pgno: 194
- img_proc: true
  md: 'Incremental backups create copies of any data that has changed since the last
    backup of any kind, whether it''s a prior full, differential, or incremental.
    This type of backup takes the least amount of space and requires the least amount
    of time to create. If you create a full backup once a month and a differential
    backup once a week, you’d do well to create your incremental backups daily to
    ensure any changes made to your data will be captured.


    Incremental backups are difficult in that it can be challenging to restore all
    your files across multiple backups, as each will have to be opened individually
    and specific files restored from the desired backup point. That means using all
    the available restore points to complete a full restoration, whereas a differential
    backup requires only the most recent differential and the most recent full backup
    to complete a full restoration.


    # Devisng a Backup Schedule


    Backups are of low value if not taken regularly. Your most critical data probably
    changes daily, so having a two-month-old backup of a document isn’t helpful if
    it becomes corrupted or otherwise permanently unavailable. Therefore, it’s essential
    to decide how often backups should be created. Your backup strategy will be highly
    individual and unique to your particular set of circumstances and requirements,
    though there are some best practices you can follow.


    It’s usually best to create full backups less frequently than differential or
    incremental backups, because of how much space and time they take up. Taking differential
    or incremental backups allowed modified data to be backed up more frequently,
    and these backup types are less prone to failure due to time constraints as a
    full backup would be. As a general rule, taking a full backup of your primary
    systems or critical data a month is a good place to start, and you can adjust
    your backup strategy as needed.


    Depending on the backup software you choose, you may have access to some, all,
    or none of these specific scheduling options. Some software, for'
  merge: -1
  pgno: 195
- img_proc: true
  md: 'example, technically has all of this functionality and will allow you to restore
    data from your backups from different points in time, but the differential/incremental/full
    backup and restore options will not be displayed to you directly. Most operating
    systems with an integrated backup solution (discussed later). Depending on your
    requirements, the built-in options might be sufficient. Otherwise, you can consider
    various paid solutions.


    # Onsite and Offsite Backups


    Depending on the criticality of the data you choose to back up, keeping offsite
    backups in addition to onsite backups might be a good idea. Onsite backups are
    held in the same physical location as your original data, such as your home or
    office. Offsite backups are stored away from your primary location. Storing your
    backups in multiple locations provides data redundancy; if your onsite backups
    and original data are destroyed, offsite backup may be your only option for recovery.
    Typically, an offsite backup will be stored offline, not connected to your network,
    and ideally in something like a foolproof safe. Alternatively, you might choose
    to use a cloud solution, but that comes with its own security risks.


    Having an offsite backup may create additional administrative overhead. In most
    cases, you''ll create your backup onsite, either by using a backup application
    or by copying the onsite backup in its entirety, and remove that backup physically
    from the premises. This should be done on a regular schedule in the same way as
    onsite backups, as it affords you more options in the event of an emergency.


    # What to Back Up and What Storage to Use


    Choosing exactly what you want to back up can be a challenge at first. Do you
    need to be able to recover an entire device from a previous checkpoint, or do
    you need only specific files? If you don''t need to recover the whole operating
    system, it''s best to determine which files and folders are critical or would
    be useful to recover. Consider how long you can be'
  merge: -1
  pgno: 196
- img_proc: true
  md: 'without the data before it really starts to impact you, your users, or your
    business. The time it takes to restore data from backup depends entirely on how
    much data you have to restore.


    The other consideration when determining what to include in your backup strategy
    is what kind of storage, and how much, you have available to store your backups.
    You could choose to create backups of files on the device itself, but doing so
    isn''t very useful if the device is lost, stolen, destroyed, or otherwise unavailable.
    A better option is to use an external hard drive, which can be obtained from any
    local computer store in any capacity that suits your needs. It''s a cheap, easy
    option that allows you to create onsite backups and secondary backups that can
    be easily stored offsite. Finally, you could purchase dedicated storage for your
    backups in the form of a network-attached storage (NAS) device. An NAS connects
    to your network, has high capacity, and usually includes additional features like
    redundancy and automation. It offers greater performance and reliability than
    a stand-alone external hard drive but is often more expensive and requires some
    administration.


    Whichever storage solution you choose, it should match your needs in terms of
    what you plan to back up. Full-disk backups of your devices will take up a lot
    of space, as internal storage for computers is typically up to or greater than
    1TB. If you''re planning to back up only critical personal files, you won''t need
    as much storage for your backups. Chances you''ll start with an external hard
    drive and then upgrade your storage as your needs increase over time. The solution
    you choose will depend largely on your operating system, whether your endpoint
    is physical or virtual, and how much data you want to keep in your backup set.


    If you want to maintain your own backups, most operating systems have built-in
    backup solutions, some of which are more fully featured others.


