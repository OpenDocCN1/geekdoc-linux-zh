  md: '# Installing Security Onion


    You can install Security Onion from an ISO file (available directly from Security
    Onion Solutions at https://securityonionsolutions.com/software/) or manually using
    CentOS 7 as the base operating system and then installing the Security Onion package
    like any other application in a Linux environment (note that CentOS 7 is the only
    OS supported by Security Onion). Using the ISO file is a simpler and faster method
    of creating a Security Onion system, whereas manual installation allows you to
    have more granular control over things like disk partitioning. If that is of interest
    to you, choose the manual installation method. If not, install Security Onion
    using the ISO file.


    # Installing Security Onion from the ISO File


    Start by downloading the latest ISO from Security Onion Solutions, and follow
    the procedure outlined in Chapter 1’s “Creating a Physical Linux System” to create
    a bootable USB drive from the ISO file. Plug your bootable USB into your NUC,
    turn on the NUC, and you''ll be presented with the Security Onion installation
    wizard. Follow these steps to complete the installation:


    +   1. The wizard will prompt you to install Security Onion, destroying all data
    and partitions. Type yes and press ENTER to accept this and begin the installation
    process.

    2. Enter an administrator username when prompted; then press ENTER.

    3. Enter a strong passphrase for the user; then press ENTER.

    4. Repeat the passphrase to confirm it; then press ENTER to initiate the installation.

    5. Once installation completes, the computer will reboot. Log in with your newly
    created credentials and the Security Onion setup wizard will pop up. Press ENTER
    to continue.

    6. Using the arrow keys, select Install to run the standard Security Onion installation;
    then press ENTER.'
  merge: -1
