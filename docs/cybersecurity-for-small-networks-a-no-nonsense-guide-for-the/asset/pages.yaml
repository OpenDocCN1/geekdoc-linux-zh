    # Logging iptables Behavior


    You''ve now installed and configured the iptables firewall, but you haven''t told
    it to log anything, so it produces no records of its behavior, which can make
    it difficult to troubleshoot issues or determine whether blocked traffic should
    have been blocked.


    First, create a new, custom policy chain. Note that this configuration is an example
    of where rule order is critical. You can name the chain whatever you like, but
    here, we''ll call it LOGGING:


