- img_proc: true
  md: 'choose 192.168.1.100. The IP addresses you choose don''t have to be consecutive;
    you can use 192.168.1.100 for this host and 192.168.1.54 for the next. After you''ve
    assigned the host''s static address, it will probably need to connect to the network
    to acquire it; force it to do power-cycling the device (turn it off and on).


    Once you''ve assigned static IP addresses to your authorized devices, update your
    asset list and network map. Then, to effectively add additional devices from joining
    without authorization, reduce the range of addresses that the DHCP server may
    assign.


    By default, the DHCP server serves the entire IP address range available for devices
    to connect to the network. If your IP addressing scheme is 192.168.0.0/16, your
    network can have up to 65,536 hosts connected. No small network needs many hosts,
    and leaving this wide open is a security risk.


    To see the DHCP address range in the SG-3100, click **Services>DHCP Server**.
    Your device should have an IP address range similar to **Figure 4-2**


    ![](img/8fad00e2c75135eb78018c62b7973377_95_0.png)


    **Figure 4-2**: DHCP address range


    The numbers may be different, but the general configuration should be close. To
    manually authorize every device that connects to your network, disable the DHCP
    server and add new static addresses for every endpoint. An alternative is to shorten
    the available DHCP address range. Instead of allowing the range to be open from
    192.168.1.100 to 192.168.1.245, you'
  merge: -1
  pgno: 95
- img_proc: true
  md: 'could specify of range of 192.168.1.100 to 192.168.1.105, limiting the number
    of devices that can be assigned a DHCP address to six. When these IP addresses
    have been statically assigned to the devices within your network, no additional
    devices can receive an IP address from the DHCP server unless one of those going
    offline or being removed from the network. Reducing the available address space
    reduces the ability for unauthorized devices to connect to your network, thereby
    minimizing your attack surface.


    You might be wondering if these steps are necessary, when anyone wanting to connect
    to your wireless network will need to be nearby, and you probably don’t let strangers
    into your home or office. Consider, though, that “close proximity” might be as
    far away as a car on the street outside your building, or the suite of offices
    next.


    # MAC Address Filtering


    MAC address filtering can be implemented as either a stand-alone defense or an
    additional layer of security. Most wireless routers allow you to specify the MAC
    addresses allowed to connect to your network, thereby blocking unspecified MAC
    addresses. MAC addresses are less likely to change than IP addresses, as they’re
    tied to a device’s hardware.


    These days it’s not difficult to fake, or spoof, a hardware address. However,
    any additional obstacle you can place between an adversary and your network will
    make it more secure. As an example, to access the MAC address filtering page on
    an ASUS RT-AC5300 wireless router, you’d click Wireless►Wireless Mac Filter, as
    shown in Figure 4-3.'
