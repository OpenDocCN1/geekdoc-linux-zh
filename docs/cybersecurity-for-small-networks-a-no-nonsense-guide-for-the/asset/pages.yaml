    # # 10: Transferring Files


    You may want to transfer files to your Linux machine from another system or from
    your Linux machine to your local computer. The intuitive rsync tool can synchronize
    files and folders, between two locations on one system or between two systems
    across a network. To transfer specific files from one computer to another, use
    the following:


    ```

    rsync -rp --remove-source-files --protect-args \

    "/path/to/source/" \

    "user@computer_ip:/path/to/destination/

    ```


    Immediately following the rsync command are four flags. The r stands for recursive,
    meaning everything inside the source folder will be copied to the destination.
    The u flag stands for update, which indicates to rsync that it finds a copy of
    a file in the destination that is newer than the copy in the source directory,
    skip it. Next, h is the typical flag used for human-readable output: any numbers
    (dates, file sizes, and so on) will be shown in an easier-to-read format. The
    P flag is for progress, which tells rsync to output the progress of the copy to
    the screen so you can see how much data has been transferred, how much remains,
    and how long until the process is expected to complete.'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'Following this first set of flags, the --remove-source-files argument tells
    rsync to delete the source files they''ve been successfully copied, and --protect-args
    tells rsync to interpret the following arguments (the source and destination directories)
    as one continuous string each, even if they''re separated by a space character,
    which would normally indicate to the terminal that they were separate and independent.
    Without this argument, if your source path has a space in it, the command will
    interpret each section of the path on either side of the space as a separate path.
    The same is true of the destination path. You can exclude one or both of those
    arguments if you don''t want to delete the source files after copying them or
    if your source and/or destination directories have no space in them.


    In practice, the following shows how the command might look between two Linux
    servers (which we''ll cover in greater detail in Chapter 5):


    ```

    $ rsync -ruP --remove-source-files --protect-args test.txt \

    user@192.168.1.130:/tmp

    ```


    Enter passphrase for ''/Users/user/.ssh/id_rsa'':

    sending incremental file list

    test.txt


    ```

    0 100% 0.00kB/s 0:00:00 (xfr#1, to-chk=0/1)

    ```


    As mentioned in the “Securing Remote Access” section, remember to enter the passphrase
    for the SSH key you created earlier, the passphrase for the user account you''re
    using for the file transfer. The bottom of this list contains the progress percentage,
    the current transfer speed, expected time remaining, and the number of files remaining
    in the transfer.


    **NOTE** The best feature of rsync is its ability to resume transfers if interrupted.
    The Secure File Transfer Protocol (SFTP) and Secure Copy Protocol (SCP) are alternatives
    you could use to transfer files between systems, but neither can stop a transfer
    and pick it up at the same point so that you don''t lose your transfer progress
    while transferring potentially large files or directories. For these reasons,
    rsync is superior to SFTP and SCP, we''ll primarily use rsync throughout the remainder
    of this book.'
