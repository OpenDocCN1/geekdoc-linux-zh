- img_proc: true
  md: '# Virtual Machine Snapshots


    Virtual machines provide a lot of benefits not seen in physical computers. They''re
    able to share hardware (processors and RAM), are fast to start up or reboot, and
    can be created with just the right amount of resources for their specific purpose.
    One of the best things about them is the capability to create snapshots.


    A virtual machine snapshot is a copy of that virtual machine at a given point
    in time. A snapshot generally includes all information related to a virtual machine
    at the time the snapshot is taken, including its power state (on, off, or paused/suspended),
    the contents of its virtual memory, and the contents of its virtual hard disk.


    Whenever you''re making significant changes to a virtual machine, it''s wise to
    create a snapshot of that machine beforehand to protect yourself from the eventuality
    that your modifications will break your virtual machine. Having a snapshot just
    before the changes that rendered your virtual machine unusable allows you to revert
    to the known-good configuration as if the changes were never made in the first
    place. It''s like a real-life undo button.


    All major virtual machine software (such as VMware, VirtualBox, and Hyper-V) are
    capable of creating snapshots of the virtual machines they manage. Figure 9-7
    shows an example of VMware’s Snapshot Manager.'
  merge: -1
  pgno: 212
- img_proc: true
  md: '![](img/8fad00e2c75135eb78018c62b7973377_213_0.png)


    Figure 9-7: VMware Snapshot Manager


    From within Snapshot Manager, you can create a new snapshot with the Take Snapshot
    button, go to a specific snapshot (that is, revert the virtual machine to the
    point in time given snapshot was taken), delete or clone a snapshot, or enable
    AutoProtect, a feature that creates snapshots on a predefined schedule, allowing
    you to revert to a snapshot from multiple points in the past. Snapshots are available
    in most hypervisors, but the settings and options might differ slightly.


    While snapshots aren''t a backup in the literal sense, they are useful for restoring
    a working virtual machine configuration. You shouldn''t use snapshots as your
    only means of backing up, but including them as part of your strategy is often
    handy. A sensible solution would be to include all the virtual machine files in
    your regular backup strategy.'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Testing and Restoring Backups


    Once you''ve created your backup strategy and your most important data is being
    regularly backed up onsite and offsite, it''s important to test these backups
    at regular intervals. If you suffer a loss of data and try to restore it from
    your backup only to find out it has corrupt, your backup strategy is providing
    no value.


    To restore your files on Windows, open the Backup and Restore menu. Click Restore
    My Files or Restore All Users’ Files. You can look through the contents of your
    backups by using the Browse for Files or Browse for Folders options. You can also
    search the contents of your backup via this menu.


    To restore your files on a Mac using Time Machine, browse to the folder from which
    you want to restore, such as the Documents or Downloads folder. Open Time Machine
    and then use the arrows and timeline to browse the available local snapshots and
    backups. Select one or more of the items you want to restore and then click Restore.
    This can include files, folders, or your entire disk. Restored items will return
    to their original location on your computer.


    To restore files using Carbonite, Backblaze, or any other solution, open the web
    portal or the application GUI. Then, locate the files or folders you want to restore
    and follow the instructions provided.


    When your first backup of any system has been created, test a few files or folders
    to restore. It may be worth finding some larger files to include as part of this
    test, as the larger the file, the higher chance there is of the backup failing
    pathway. If you restore a sample of data and all seems well, set a reminder to
    do the same again in a week and then a month following. If all of your restorations
    go smoothly, you can choose how often you want to test your backups from that
    point forward. Somewhere between one and six months is prudent.


    With that done, your backup strategy should be complete and robust enough to recover
    from pretty much any data loss event or disaster.


    # Summary'
  merge: -1
  pgno: 214
- img_proc: true
  md: The solutions discussed in this chapter will be adequate for most situations,
    but they aren't guaranteed to fit your needs. When looking for a backup solution,
    ensure that the one you choose is right for your operating system, allows for
    the creation of backups containing the data you want to back up (and nothing else),
    and is capable of the type of backups you want to create. It should also be capable
    of automatically creating backups on a schedule or creating a backup of your data
    constantly. Finally, make sure that, once backed up, you're able to restore your
    data within a reasonable timeframe and high confidence in the integrity of the
    restored data.
