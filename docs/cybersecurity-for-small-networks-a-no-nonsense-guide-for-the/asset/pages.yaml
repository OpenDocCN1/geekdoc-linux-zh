    # #5: Managing Linux Users


    Part of managing your network security is managing the user accounts and hosts
    within your network. You may need to add new users to your Ubuntu machines, such
    as a new user account for a new service or application, or to allow others to
    administer your systems. Adding new users is an administrative function and requires
    the sudo command. Use the command to add new users:


    ```

    $ sudo addUser username

    ```


    You’ll be asked to specify a password for the user, but using passphrases is better,
    because they’re easier to remember, tend to be longer, and are harder to crack.
    (We’ll discuss passphrases and creating strong passwords in more detail in Chapter
    11.)


    You can also set names, phone numbers, and other information for your users if
    you want; otherwise, press ENTER to leave these fields blank.

    Deleting a user is just as easy:


    ```

    $ sudo deluser username

    ```


    In addition, you may want to give your new user sudo privileges to allow them
    to administer your system, which you can do with the usermod command:


    ```

    $ sudo usermod -ag sudo username

    ```


    The -ag (add group) parameter will add the user to the sudo group. User groups
    in Linux are a collection of user accounts, and they’re used to assign privileges
    and permissions to specific user accounts, such as the ability to read and write
    certain files. Keep in mind, however, that the fewer users with sudo privileges
    the better. Always practice the principle of least privilege and allow users only
    as much control they require on a day-to-'
