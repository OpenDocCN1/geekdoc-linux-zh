    In the Admin Access tab shown in Figure 3-2, set webConfigurator Protocol to HTTPS
    to ensure a secure, encrypted connection to the device. It''s always preferable
    to use HTTPS instead of the unencrypted HTTP protocol because the added encryption
    ensures that, even if the network traffic is intercepted by an adversary, the
    adversary can''t decrypt it.


    In the next section of the Admin Access page (not shown in Figure 3-2), you can
    change the SSH options. I recommend not allowing SSH access to the device all-time—that
    would be similar to leaving your front door unlocked at night. If you allow SSH
    access only while you''re actively using it, adversaries are able to access your
    network this only way while the service is available. Having the service turned
    off 99 percent of the time means attackers have only 1 percent of the time to
    attempt to breach the network. Disable this option unless you''re actively connecting
    to the device with SSH. Once these settings have been updated, click Save.


    On the Networking tab, you can enable or disable IPv6 traffic. If you''re not
