  md: '# Using Wazuh


    We installed the Wazuh agent in Project 35, and we''ll configure it in this section.
    Wazuh allows us to review the logs and alerts in Security Onion, which we''ll
    explore in the next section.


    The primary Wazuh config file is located at /opt/so/conf/wazuh/ossec.conf on the
    Security Onion system. Each section of this configuration file is separate and
    identified with a line like the following:


    ```

    <-- Files/directories to ignore -->

    ```


    You can review the settings in this file to change the way Wazuh behaves, which
    can be useful if, for example, Wazuh reacts to a false positive detection and
    stops you from doing something benign. Review this file to get an understanding
    of the types of things Wazuh monitors for.


    The section shown in the following snippet specifies files that contain lists
    of files that are known or expected to be malicious based on identified adversary
    behaviors, followed by files that are expected to contain trojans (a type of virus)
    and then files and folders to audit for various vulnerabilities:


    ```

    --snip--

    <rootkit_files>//var/ossec/etc/shared/rootkit_files.txt</rootkit_files>

    <rootkit_trojans>//var/ossec/etc/shared/rootkit_trojans.txt</rootkit_rojans>

    <system_audit>//var/ossec/etc/shared/system_audit_rcl.txt</system_audit>

    <system_audit>//var/ossec/etc/shared/system_audit_ssh.txt</system_audit>

    <system_audit>//var/ossec/etc/shared/cis_rhel7_linux.txt</system_audit>

    --snip--

    ```


    Each of these files contains a list of things Wazuh will monitor. If the agent
    detects a file or configuration on a device that matches a behavior or setting
    in the rootkit_files.txt file, it will take action to remediate that threat.'
  merge: -1
  pgno: 249
- img_proc: true
  md: 'If you don''t want it to take that action, delete or comment out that line
    in the configuration file with a #.


    When you update Wazuh as part of your efforts to consistently update and patch
    your Security Onion or other systems, the configuration files such as rootkit_files.txt
    may also receive updates. This ensures that as new threats are identified and
    indicators of compromise are made publicly available, your network stays protected.
    To avoid losing any changes you make to these files, consider creating new, custom
    configuration files (such as my_custom_trojans.txt) and adding a reference to
    this file in the ossec.conf file, such as the following example:


    ```

    --snip--

    <rootkit_files>//var/ossec/etc/shared/rootkit_files.txt</rootkit_files>

    <rootkit_trojans>//var/ossec/etc/shared/rootkit_trojans.txt</rootkit_trojans>

    <rootkit_trojans>//var/ossec/etc/shared/my_custom_trojans.txt</rootkit_trojans>

    --snip--

    ```


    Adding files to the ossec.conf file will result in Wazuh referring to those files
    for its configuration and settings, in addition to its default configuration files.
    Using custom files is a good way to add custom configurations that you might have.


    If you want Wazuh to ignore a directory or list of directories on any of the endpoints
    on which it''s installed, add that information in the relevant section. You can
    also tell the agent to ignore specific files or file types, to exclude certain
    devices from active response (if you want the agent to never block activity on
    a specific device that might impact your network), and to set various other options.
    Familiarize yourself with these configuration files so you can tailor them to
    your environment.


    # Using Security Onion as a SIEM Tool


    Security Onion, in addition to the other useful capabilities it provides, acts
    as a security information and event management (SIEM) tool. Several'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'SIEMs are available on the market, including Splunk, SolarWinds, or ManageEngine,
    all of which commercial solutions and can be very expensive. Security Onion, on
    the other hand, is open source and free.


    A SIEM is designed to aggregate data from devices in a network and other data.
    Implementing a SIEM like Security Onion centralizes your logs, making it harder
    for an adversary to hide their tracks by deleting the logs on any one system.
    It also enables you to query logs and other system data in one location so you
    don''t have to check every system or device individually, streamlining the process.
    Security Onion then analyzes this data and alerts you to potentially malicious
    activity. Figure 10-8 shows a list of alerts, by logging in to the Security Onion
    console and clicking the Alerts option in the menu on the left.


