  md: '# #6: Securing Remote Access


    Now that you''ve made it possible to access the system remotely with SSH, you
    need to lock down that capability so only authorized users can log in to this
    host. Several settings are involved in this process. You''ll disable password
    login in favor of SSH keys, as well as disallow the root account from logging
    in directly via SSH. Allowing superusers as root to log in interactively using
    utilities like SSH is bad practice because it allows attackers to perform attacks
    such as brute-forcing (continually guessing potential passwords until they find
    the one that works) and then be able to log in with complete access to your system.
    Likewise, with your other user accounts, using SSH keys to log in in eliminates
    an entire class of potential attacks (username and password guessing) against
    your systems.


    # Generating SSH Keys


    SSH keys are generally accepted to be more secure than passwords or passphrases.
    SSH keys are cryptographically secure keys that can be used to authenticate a
    client computer (your local host) to an SSH server (your Ubuntu system). The first
    part of a key pair is your private key, which is held by you and must remain absolutely
    secret, just like a password. The other half is the public key, which can be freely
    shared. The public key is provided to your SSH server and is capable of decrypting
    your private key, thereby allowing authentication between the two endpoints. Each
    local user account that you want to log in to your Ubuntu system will need its
    own set of public and private keys.


    To create an SSH key pair, open a terminal window on the computer you plan to
    use as your SSH client (the computer that will connect to your Ubuntu system via
    SSH). Enter ssh-keygen and press ENTER. Press ENTER to accept the default file
    in which to save the keys. The default location of this file will be:


    +   * Windows: C:\Users\<user>\.ssh\id_rsa

    * macOS: //<user>/.ssh/id_rsa

    * Linux: /home/<user>/.ssh/id_rsa'
