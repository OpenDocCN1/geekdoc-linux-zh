    When the scan completes, clamscan will output a scan summary.


    In addition to known malware, ClamAV can detect potentially unwanted applications
    (PUAs), including software such as adware, peer-to-peer (p2p) programs, remote
    administration tools, bitcoin miners, and bundleware (software installed with
    but not related to the application being installed), which are not inherently
    malicious but may pose a risk to or negatively impact your endpoints'' security
    and performance. To scan for PUAs, include the --detect-pua=yes argument when
    running ClamAV.


    If your scans are taking too long, you can use other parameters to reduce their
    duration. You can limit the size of the files ClamAV will scan with --max-filesize=n,
    where n is the maximum file size in kilobytes. Files larger than this will be
    skipped and assumed to be clean, reducing the time it takes to scan. Similarly,
    --max-scansize=n scans only archive files (.rar files, .zip files, and so on)
    up to the specified size—all other archives will be skipped. To limit the depth
    of the recursion (that is, how many directories are scanned below the directory
    where you start the scan), use the --max-dir-recursion=n parameter. For more parameters,
    use the -h argument, as in sudo clamscan -h, to print the help menu.


    To run a scan on a regular schedule, use Crontab, a Linux utility designed to
    execute programs at preset times or intervals. In your terminal, use the crontab
    -e command to edit the scheduled tasks file:


    ```

