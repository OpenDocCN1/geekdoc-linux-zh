    Make sure to install this on both Ubuntu servers. EasyRSA will be installed to
    the /usr/share/easy-rsa/ directory by default.


    # Set Up the Certificate Authority


    Next, you must configure and build the certificate server to act as a CA. The
    easiest way to do this is to make a copy of the template that EasyRSA provides
    and then modify its configuration to suit your needs. You can then initialize
    the PKI, the CA, and generate its public certificate and private key.


    Navigate to the easy-rsa folder on the certificate server and create a copy of
    the vars.example file. Call it vars:


    ```

    $ cd /usr/share/easy-rsa/

    $ sudo cp vars.example vars

    ```'
