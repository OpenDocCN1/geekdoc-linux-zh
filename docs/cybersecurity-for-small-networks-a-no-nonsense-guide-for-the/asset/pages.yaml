    # Protecting Personal Information with Squid


    Squid is highly configurable and allows you as the administrator to set how

    much information about your users and their devices you want exposed to

    the internet. By default, there is no anonymization of the traffic that passes

    from a client device through the proxy to the internet.


    To prevent anyone outside your network knowing where your traffic is

    coming from (that is, the server information or from which website or

    resource you may have referred, like Amazon or a blog), use the

    request_header_access directive to deny this information:


    ```

    --snip---

    include /etc/squid/conf.d/*

    request_header_access From deny all

    request_header_access Referer deny all

    request_header_access Server deny all

    --snip--

    ```


    To further anonymize your traffic, it may be wise to also deny the User-

    Agent, MW-Authenticate, and Link header values, which may leak

    additional information about your browser or browsing activity:


    ```

    --snip---

    include /etc/squid/conf.d/*

    request_header_access From deny all

    request_header_access Referer deny all

    request_header_access Server deny all

    ```'
