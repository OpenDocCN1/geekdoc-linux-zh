- img_proc: true
  md: 'Operation Mode: Access Point/AP mode; Firmware Version: 386.2.4 SSID: Wireless1


    ![](img/8fad00e2c75135eb78018c62b7973377_99_0.png)


    Figure 4-4: Multiple wireless network capability


    A guest network is also not convenient for your visitors; it also allows you to
    group users and devices by their level of risk or trust. For your private internal
    network, you might connect your primary devices: laptops, mobile devices, and
    so on. On the guest network, you might connect your IoT devices: your Google Home,
    Amazon Alexa, LIFX or other smart lightbulbs, and other similar devices.


    Certain categories of devices are inherently less secure. For instance, IoT devices
    are susceptible to botnet infections. A bot is a group of internet-connected devices,
    usually linked via malware installed on each device. The malware allows the group
    to be controlled as a collective, usually for malicious activity, such as distributed
    denial-of-service attacks, data theft, or spamming. Allowing devices with lower
    standards of security onto the same network segment as your primary devices is
    risky. The best way to mitigate this risk is to separate them, either logically
    or physically.'
  merge: -1
