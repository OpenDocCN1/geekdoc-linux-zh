  md: "# # pfSense Firewall Rules\n\nThe default pfSense firewall rules will block\
    \ traffic from both RFC1918 private network connections and bogon networks from\
    \ entering your network from the internet. RFC1918 addresses, discussed in Chapter\
    \ 1, are IP addresses reserved for private, internal network use only, meaning\
    \ addresses in these ranges should not appear on the public internet. They include\
    \ in the following ranges: 192.168.0.0/16, 100.0.0.0/8, and 172.16.0.0/12. If\
    \ any of these happen to appear on the internet, your firewall should find this\
    \ suspicious and discard traffic. Similarly, bogon networks or bogon addresses\
    \ are those that are public but haven't been assigned to anyone by IANA. If an\
    \ as-yet-unassigned address or address range is sending your network traffic,\
    \ this is also suspicious, and the firewall should discard it.\n\nWhile the default\
    \ firewall rules are a good start, you should add a few rules manually to provide\
    \ a higher level of security. For example, you shouldn't allow services as Server\
    \ Message Block (SMB), the service that allows Windows Family to computers to\
    \ share files across a network, to send or receive outbound or inbound traffic\
    \ from your network to the internet or receive inbound traffic from the internet.\n\
    \n> NOTE The WannaCry ransomware of May 2017 spread using an SMB vulnerability\
    \ known as EternalBlue; blocking SMB at your perimeter firewall significantly\
    \ reduces your risk of exposure to this vulnerability and the risk of other vulnerabilities\
    \ like it being used to compromise your network.\n\nTo add a rule that blocks\
    \ SMB traffic, follow these steps:\n\n+   1. In pfSense, at the top of the page,\
    \ click Firewall►Rules.\n2. Click LAN\blacklhd;Add to begin adding a rule.\n3.\
    \ Set the action to either block (drop the packets) or reject (drop the packets\
    \ and notify the sender).\n4. Set Address Family to IPv4 and Protocol to TCP.\n\
    5. Set Source to Any, Destination to Any, and Destination Port Range (to and from)\
    \ to (other) 445."
  merge: -1
  pgno: 83
- img_proc: true
  md: '6. Ensure the Log box is ticked to log any dropped packets, and then click
    Save.


    Once you''re done, your firewall should no longer allow SMB traffic to pass your
    network boundary. Follow this same process for ports 137, 138, and 139, as these
    services (NetBIOS Name Resolution, NetBIOS Datagram Service, and NetBIOS Session
    Service) should never be allowed to cross the network boundary either, as all
    of these protocols are used for processes internal to a local network.


    # COMMON PROTOCOLS TO BLOCK


    Several network protocols should never cross the network boundary or perimeter,
    for example:


    +   * NetBIOS Name Resolution, TCP and UDP port 137: Precursor to DNS, resolves
    hostnames to IP addresses

    * NetBIOS Datagram Service, UDP port 138: Enables unicast, multicast, and broadcast
    messages within a network

    * NetBIOS Session Service, TCP port 139: Facilitates communication between two
    computers on a network

    * MS RPC, TCP and UDP port 135: Facilitates communication between client/server
    applications

    * Telnet, TCP port 23: An insecure plaintext protocol used for remote access and
    maintenance of systems

    * SMB, TCP port 445: Allows Windows computers to share files across a network

    * SNMP, UDP ports 161 and 162: Used for remote system management and monitoring

    * TFTP, TCP and UDP port 69: Enables file transfer between computers on a network'
