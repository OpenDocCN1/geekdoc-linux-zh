  md: "```\ntarget prot opt source destination\nChain FORWARD (policy ACCEPT)\ntarget\
    \      prot opt source destination\nChain OUTPUT (policy ACCEPT)\ntarget     \
    \ prot opt source destination\n```\n\nIn the output, policy ACCEPT indicates that,\
    \ by default, iptables accepts all traffic for input, output, and forwarding.\
    \ This default behavior is desirable because it'll work without any user configuration.\
    \ However, it's an insecure solution, let's modify it.\n\n# # iptables Firewall\n\
    \nWhen creating iptables rules, keep in mind that order matters. As traffic reaches\
    \ your firewall, iptables checks its rules one after the other in the order appear.\
    \ If the traffic matches a rule, iptables won't check any further rules—if the\
    \ first rule in your list of 50 denies all traffic, the firewall will interpret\
    \ this rule, reject the traffic, and stop processing, which effectively isolates\
    \ your device entirely. Alternatively, if you have the 50 rules but the first\
    \ rule allows all traffic, all traffic will be allowed to pass through the firewall.\
    \ You should avoid both of these situations.\n\nTo understand how to construct\
    \ an iptables rule, take a look at this example:\n\n```\nsudo iptables -A INPUT\
    \ -p tcp --dport 22 -m conntrack \\\n  --ctstate NEW,ESTABLISHED -j ACCEPT\n```\n\
    \nImmediately after sudo, iptables is invoked to begin the rule definition. The\
    \ next argument determines whether the rule will be appended to (-A), deleted\
    \ from (-D), or inserted into (-I) the specified policy chain. You can also specify\
    \ -R in this position when replacing or updating an existing rule. The INPUT indicates\
    \ that a rule in the input chain is being modified. You can also specify OUTPUT,\
    \ FORWARD, or other policy chains.\n\nIn most cases, iptables needs to know the\
    \ protocol and port to which the rules relate. In this example, -p tcp indicates\
    \ the rule will only apply to TCP traffic, and --dport 22 tells iptables that\
    \ the rule applies to packets"
