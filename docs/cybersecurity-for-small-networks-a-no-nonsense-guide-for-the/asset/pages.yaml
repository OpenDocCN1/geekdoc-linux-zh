    # # Network Topology


    Understanding how your systems and devices connect to and communicate with each
    other is critical when it comes to cybersecurity. With that mind, let''s take
    a crash course on the **Internet Protocol (IP)** and IP addressing. IP is a standard
    protocol that defines the format of data sent over a network allowing computers
    and other network-connected devices to communicate with each other.


    Each of your computers and other network-connected devices requires an **IP address**.
    An IP address is comparable to a street address or a post office box; computer
    A sends network traffic to computer B by embedding computer''s IP address in the
    data it sends. It''s the same as writing an address on an envelope. Any intermediate
    devices between the two computers can interpret this address from the data and
    pass it along until it reaches its destination, just like the post service.


    Two commonly used versions of the internet protocol currently exist, version 4
    and version 6, which means we have two types of IP addresses, IPv4 and IPv6. While
    IPv6 has been around since the 1990s, it still isn''t used often today. We won''t
    cover it in detail in later chapters as it''s largely outside the scope of this
    book, but it''s important to be aware of what it is'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'and why it exists. IPv4 addresses are written in what is known as dotted quad
    notation, which is a fancy way of saying they’re composed of four numbers separated
    by periods, such as 192.168.1.1. Each of the four numbers can range from 0 to
    255, meaning IPv4 addresses range from 0.0.0.0 to 255.255.255.255, a total of
    4,294,967,296 possible addresses.


    So many network-connected devices now exist in the world that aren''t enough IPv4
    addresses to go around, which is one of the reasons IPv6 was created. IPv6 has
    a larger address space, with a total of more than 340 trillion, trillion, trillion
    addresses. To put that in perspective, that''s 100 times more addresses than there
    atoms on the surface of Earth, which is convenient as more and more internet-connected
    devices come online. Eventually, IPv6 will be in common use, and every device
    will be able to have its own public IPv6 address, until we run out of those (probably
    not in my lifetime).


    As aren''t enough IPv4 addresses for everyone, we’ve had to come up with clever
    workarounds to connect all of our devices to the internet. One of those solutions
    is network address translation (NAT). Using NAT, several devices can be connected
    via one IP address.


    When you connect your home or office to the internet through your router, your
    internet service provider assigns you (and your network) a public IP address.
    You can find your IP address using services like https://www.whatismyip.com/.
    IP addresses are usually dynamic, meaning that when you disconnect and reconnect
    to the internet, you will often receive a different IP address.


    Your router is responsible for routing traffic from your private, internal network,
    to the public internet, and vice versa, which is how you’re able to access services
    and browse the internet. At a high level, NAT takes the public IP address assigned
    to your router and translates the traffic it receives so that traffic bound from
    the internet to one of your internal computers or devices receives the traffic
    destined for that specific device. It’s similar to the way letters and packages
    are delivered to office buildings at their street address, and then a clerk or
    mail department determines where that package needs to go internally, forwarding
    it to the right recipient. It also works in the reverse; traffic outbound from
    your computer to the internet must be translated from the internal IP address
    of your router before being'
