  md: 'The command may output the lines modified in the sysctl.conf file.


    # Configure the Firewall


    The first step in this process is to find your VPN server''s public network interface;
    your server may have multiple network interfaces, and selecting the wrong interface
    for the following commands would result in a VPN that is unable to route traffic
    to the internet correctly:


    ```

    $ ip route | grep -i ens

    default via 202.182.98.1 dev ens3 proto dhcp src 202.182.98.84 metric 100

    ```


    In this output, the network interface is called ens3, but yours might be different.
    The default route shown by ip route will be the public network interface of your
    host. You''ll need this to configure your firewall correctly.


    In most firewalls, the order in which you set your rules is the most important
    consideration. In UFW, rules are evaluated from rule files in the following order:
    first before.rules, then user.rules, and finally after.rules. The firewall must
    correctly identify and push through the VPN traffic, so rules are needed at the
    top of the firewall configuration. To do this in UFW, open the before.rules file
    in a text editor:


    ```

    $ sudo nano /etc/ufw/before.rules

    ```


    Add these lines at the top of the file to allow OpenVPN client traffic via the
    public network interface you identified in the previous commands:


    ```

    *nat

    :POSTROUTING ACCEPT [0:0]

    -A POSTROUTING -s 10.8.0.0/24 - ens3 -j MASQUERADE

    COMMIT

    ```'
  merge: -1
