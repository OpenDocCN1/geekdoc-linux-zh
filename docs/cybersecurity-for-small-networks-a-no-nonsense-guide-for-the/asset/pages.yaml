- img_proc: true
  md: 'Keep in mind that most of the time when a command in bash runs successfully,
    there will be no output to the screen, and you''ll be returned to the prompt.


    Open the resulting vars file in a text editor:


    ```

    $ sudo nano vars

    ```


    In the file, find the organizational fields that contain information about the
    organization for which the certificates will be generated by this server, for
    example:


    ```

    --snip--

    #set_var EASYRSA_REQ_COUNTRY "US"

    #set_var EASYRSA_REQ_PROVINCE "California"

    #set_var EASYRSA_REQ_CITY "San Francisco"

    #set_var EASYRSA_REQ_ORG "Copyleft Certificate Co"

    #set_var EASYRSA_REQ_EMAIL "me@example.net"

    #set_var EASYRSA_REQ_OU "My Organizational Unit"

    --snip--

    ```


    Each of these lines in the file is a comment by default, so they won''t be read
