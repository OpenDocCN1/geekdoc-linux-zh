    # #29: Managing Patches and Updates


    Along with antivirus tools, patch management is an important defense because malware
    exploits are written to attack a specific vulnerability in a network, application,
    protocol, or operating system. Adversaries pay close attention to Windows updates
    and patches for other operating systems, as the patch notes call out the vulnerability
    it’s designed to remediate. Attackers use vulnerability information to write malware
    specifically for that security flaw, and anyone who hasn’t downloaded the update
    fall victim. This is why operating systems constantly ask you to install updates
    and patches.


    In many cases, end users don’t install updates right away, and adversaries have
    a window of opportunity to target unpatched systems. It’s in your best interest
    to install software updates as soon as they become available. Luckily, the process
    of updating is exceedingly simple and easy to automate. This project describes
    how to configure system updates on individual systems, and the following section
    discusses a solution for patch management across multiple endpoints.'
