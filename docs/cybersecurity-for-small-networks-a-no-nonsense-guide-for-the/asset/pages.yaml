  md: '![](img/8fad00e2c75135eb78018c62b7973377_82_0.png)


    Figure 3-2: Advanced pfSense menu


    In the Advanced menu tabs, you can change the protocols, ports, and proxy settings
    through pfSense uses, among other things. Click Save before leaving a tab if you
