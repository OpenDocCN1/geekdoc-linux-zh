  md: '# 3

    FILTERING NETWORK TRAFFIC WITH FIREWALLS


    ![](img/8fad00e2c75135eb78018c62b7973377_62_0.png)


    A firewall monitors and filters incoming and outgoing network traffic. There’s
    a general misconception that the firewall is always the last line of defense;
    in reality, a perimeter firewall should be the first obstacle adversaries encounter
    when they try to penetrate any network, large or small. Every time a web browser
    accesses a website, a messaging program sends a message, or your email client
    sends and receives email, the traffic generated should pass through at least one
    firewall along its journey.


    In this chapter, you’ll explore two firewall solutions: iptables and pfSense.
    In Linux, iptables is a common firewall often used as a host firewall (that is,
    a firewall that allows or denies traffic on a specific endpoint). pfSense, which
    can be implemented either as an open source firewall or as a hardware firewall
    using the appliances sold by Netgate, is used as a perimeter or boundary firewall
    responsible for filtering traffic for entire networks or network segments.


    # Types of Firewalls


    A hardware firewall can be physically and logically placed in a network. A software
    firewall, installed as an application on an endpoint, requires large configuration
    of both the firewall and its connected devices to filter traffic effectively.
    By using one or both of these, you’re able to effectively reduce'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'your attack surface, which comprises the points where an adversary can try
    to infiltrate, compromise, or exploit your network. Ideally, attack surfaces should
    be as small as possible.


    A perimeter firewall, installed between your private network and other networks
    like the internet, can be either software- or hardware-based. Perimeter firewalls
    are placed at the physical and logical border of the network, making it the first
    thing with traffic bound for your internal network from the public internet communicates,
    as well as the last thing in your network that traffic bound for the internet
    passes through, as shown in Figure 3-1.


    ![](img/8fad00e2c75135eb78018c62b7973377_63_0.png)


    **Figure 3-1:** A perimeter firewall


    Firewalls allow or deny (block) traffic based on a ruleset containing a configured
    list of rules. The way those rules are applied to traffic depends on the type
    of firewall you''re using. The most common type, a packet-filtering firewall,
    inspects each packet of data attempting to make it into (or out of) your internal
    network then checks that packet against its ruleset. If the packet contents match
    a rule in the firewall ruleset, the firewall will either allow or deny that traffic,
    depending on what that rule indicates it should.


    There are also stateful and stateless firewalls. A stateful firewall tracks all
    inbound and outbound connections and monitors each connection as a unique conversation
    between two endpoints. This method provides the firewall with context about any
    given connection and allows more granular control of traffic. By contrast, a stateless
    firewall doesn''t record information about each connection. Both iptables and
    pfSense are stateful firewalls.


    Almost all operating systems come with a built-in software firewall, known as
    a host-based firewall, that filters traffic specific to that host. Most'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'Windows and Mac devices ship with an out-of-the-box host-based firewall whose
    basic ruleset is functional, not exhaustive. By design, this firewall works as
    is for ordinary purposes; users don''t need to configure their own firewall, lessening
    confusion as well as the need for technical support from computer manufacturers.
    On Linux devices, you''ll have to configure a firewall—you''ll see how to do this
    in the next section.


    It''s best to use both a firewall and a perimeter firewall to configure them correctly
    for your network to add multiple layers of defense.


    # iptables


    Linux''s iptables utility offers incredible flexibility in filtering traffic entering,
    traversing, or leaving a network. The firewall organizes its rules in policy chains,
    lists of rules that analyze and match packets based on their contents. Each rule
    determines what the firewall will do with a packet that matches its definition—it
    might allow, reject, or drop the packet. When a packet is allowed, it passes through
    the firewall unhindered. When dropped, the firewall discards the packet and sends
    no response to the sender. When a packet is rejected, the firewall discards the
    packet and sends a rejection message back to the sender, providing context about
    your network and the firewall you''re using.


    There are three main types of policy chain: input chains, output chains, and forward
    chains. Input chains determine whether to allow traffic into the network from
    an external source, such as a virtual private network (VPN) connection from a
    remote location. A VPN is a method for logically—rather than physically—connecting
    to disparate networks, usually for remote access from one network to the other.
    VPNs are covered in greater detail in Chapter 5.


    Output chains indicate whether the firewall should allow certain outbound traffic
    to an external network. For example, Internet Control Message Protocol (ICMP)
    is primarily used to diagnose network communication issues. ICMP ping packets
    are outbound traffic that pass through the output chain. A ping is a query from
    one device to another, usually to determine whether a connection can be made between
    the two. You''d need to allow the ping packets from your device, through'
  merge: -1
  pgno: 64
- img_proc: true
  md: 'your firewall, and across several other devices on the public internet, to
    finally reach their destination. If your output chain blocks ICMP traffic, your
    device would be unable to ping anything, as the firewall would block or drop those
    packets.


    In most cases, your stateful firewall rules should allow both new and established
    connections. For example, if you create an output chain to allow your device to
    ping Google, you need to tell the firewall to allow inbound traffic related to
    established connections. Otherwise, your device will send a ping out to Google
    that passes through your firewall, but the response from Google would get blocked
    by your firewall.


    Forward chains forward the traffic your firewall receives to another network.
    In a small office or home network, host-based firewalls rarely use forward chains,
    unless the firewall is configured to serve as a router. A perimeter firewall would
    use the forward chain to route traffic from your internal network to the external
    network, or from one network segment to another, likely using network address
    translation (NAT), as discussed in Chapter 1. However, a configuration of this
    type is more complicated than necessary for small networks and would better fit
    an enterprise network.


    By using these policy chains, you will be able to control the traffic traversing
    your network at a very granular level. In the following chapters, you''ll create
    several Linux servers, each of which would benefit from its own host-based firewall.
    I recommend configuring iptables on each of these servers using the following
    instructions.


    > NOTE iptables isn''t capable of securing IPv6 networks and traffic. If you plan
    to use IPv6 in your network, you''ll need to use ip6tables in addition to iptables.
    Unless you have a strong use case for IPv6 in your network, I recommend disabling
    IPv6 completely. Disabling IPv6 is covered in Chapter 4.


    # #12: Installing iptables


    If you''ve already built a standard Ubuntu server following the steps from Chapter
    1, you can start configuring your iptables firewall. Once you''ve mastered the
    basics, use that knowledge to configure iptables on all your Linux endpoints.
    Otherwise, go back and create your Ubuntu system now.'
