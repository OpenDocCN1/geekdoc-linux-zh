    A Smart Scan is designed to scan the most vulnerable areas of your computer quickly.
    While this is less resource intensive and less time consuming, it''s not likely
    to catch all threats on your computer because it doesn''t scan all areas of your
    hard drives. A Deep Scan is more comprehensive and includes all areas of storage
    on your device, optionally including external storage, network locations, Time
    Machine backups, and rootkit detection. A Targeted Scan scans only specified areas.


    All of these scans run from the Scan screen in Avast on your Mac. Click the Search
    button to select the type of scan you want to run and then click Now. Selecting
    Targeted, USB/DVD, or Custom Scans will prompt you for locations to scan. Avast
