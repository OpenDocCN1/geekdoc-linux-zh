  md: 'Explore the various menus and options to familiarize yourself with Pi-Hole’s
    settings and configurations. Consider reading the manual as well to get a better
    understanding of how Pi-Hole works and how powerful the internet really is.


    # Configure DNS on Your Endpoints


    At this point, there’s only one thing left to do: make your clients use the Pi-Hole
    server as their DNS server. You need to configure your DHCP server or router to
    push the DNS settings to devices that access the internet. Alternatively, you
    can configure each endpoint individually using its internal network settings.
    You might want to do this if you’d like only specific devices on the network to
    connect through the proxy while letting others connect to the internet directly.
    That said, making all devices go through the Pi-Hole server will provide the best
    experience to users and allow you to have better control of network traffic and
    identify issues earlier. The server will also cache more websites as users browse
    to them, which will make browsing to frequently visited sites faster for everyone.


    > NOTE Your router is capable of specifying the DNS server your endpoints use
    to access the internet. In the ASUS router we’ve been using as an example, it’s
    under Advanced Settings►LANDNS Server. Enter your Pi-Hole server’s IP address
    in the DNS Server1 box and click Apply to the DNS server connected clients will
    use.


    If you want only some of your endpoints to use the Pi-Hole server, either you
    can configure those clients using their local DNS settings or you can use the
    DNS settings in your pfSense firewall (if you implemented pfSense, as discussed
    in Chapter 3).


    # Windows DNS Settings


    To configure the DNS settings on a Windows client, follow these steps:


    +   - Open Settings►Network & Internet4Change Adapter Options.

    - Right-click Ethernet Adapter.'
