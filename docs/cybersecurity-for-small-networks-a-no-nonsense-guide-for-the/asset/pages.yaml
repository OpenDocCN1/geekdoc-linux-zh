    > WIRELESS NETWORK TIPS

    Most routers allow you to hide your wireless network by preventing the network
    name, or SSID, from being broadcast. Doing so will keep the network from appearing
    in the list of available networks on your device. Even if your network is hidden,
    you''ll still be able to connect to it with the right access credentials. Hiding
    your network is recommended, however. Even though regular users won''t be able
    to see it, an adversary'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'with a network analyzer could still identify it. What''s worse, a hidden

    wireless network actually creates more noise and is easier to discover

    than a nonhidden one. That''s because devices connected to a hidden

    network have to constantly broadcast beacons to determine if the

    network is still available, generating traffic that an adversary can capture

    to attempt to breach the network. Hidden networks are great for

    protecting your network from your not-so-tech-savvy neighbors but will

    do the opposite for potential attackers.


    Consider turning your Wi-Fi off when it''s not in use, such as when

    every in the house is asleep or when your office has closed for

    tnight. If the wireless is turned off, adversaries won''t be able to detect

    it, much less breach it. The same goes for your guest network; if it isn''t

    being used, turn it off to reduce your attack surface.


    # Summary


    In this chapter, we''ve discussed common wireless network security risks

    and methods to mitigate your network by implementing

    measures such as IP and MAC address filtering and reducing the available

    address space in your DHCP server. Creating and maintaining an asset list

    and network map can help to ensure no unauthorized devices are connecting

    to your network. Eavesdropping is the easiest risk to mitigate. Add

    encryption to your network in the form of WPA security (ideally WPA3, as

    it it becomes more common) and implement a passphrase rather than a

    password for network access.'
