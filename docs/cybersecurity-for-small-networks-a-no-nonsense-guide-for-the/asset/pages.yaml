  md: 'By default, you won''t be able to see the results of your scans unless you
    specify the logfile with the -1 parameter. If you want to scan a specific folder,
    like the user home folders (/home/), every day, in addition to the full system
    scan, add another entry to the Crontab, following the previous example as a guideline.


    Add another line to the Crontab to ensure ClamAV is kept up to date:


    ```

    @ @ * * systemctl stop clamav-freshclam && freshclam &&

    systemctl start clamav-freshclam

    ```


    You can link multiple commands together and separate them in series. Find more
    information on Crontab (or any other terminal command) with the man function.
    Enter man crontab to open the manual for the application on the command line.


    # #28: VirusTotal


    VirusTotal (VT) tests files to determine whether they''re likely to be malicious
    (https://www.virustotal.com/) by taking the concept of an antivirus service and
    implementing it on a large scale. It''s publicly available service where you can
    upload any file for malware, and VT will scan it with more than 60 antivirus programs.
    It will then produce a report to let you know whether it contains malware or behaves
    in a way that may negatively impact your endpoints, security, or privacy. This
    capability is especially useful if you believe a file is malicious but undetected
    by your antivirus.


    Be aware that anything uploaded to VT becomes public, so anyone can search for
    and download the files you upload. To use VT without making your private information
    public, search VT for the hash of the file you want to check. Hashing is a process
    for calculating a fixed-length string based on the contents of a file. H is expected
    to be a one-way process, meaning you can''t take the hash of a file and reverse
    it to get the original file contents. By creating the hash of a file, you should
    get a unique string of characters that identify file. Some hashing algorithms
    can result in collisions, where two files yield the same hash, though the chances
    of happening in most modern hashing functions are slim to none. You can get the
    hash of a file by using built-in tools in any operating system.'
