- img_proc: true
  md: 'default via 172.16.90.1 dev ens33 proto dhcp metric 100


    In this output, the network interface is called ens33 (y might be different).
    The default route shown by ip route will be your host''s public network interface.
    You''ll need this to configure your firewall correctly.


    Next, add the following rules to the bottom of your Wireguard configuration file
    by opening /etc/wireguard/wg0.conf with a text editor again and replacing ens33
    with your network interface name:


    ```

    sudo nano /etc/wireguard/wg0.conf

    -- snip --

    SaveConfig = true

    PostUp = ufw route allow in wg0 out on ens33

    PostUp = iptables -t nat -I POSTROUTING -o ens33 -j MASQUERADE

    PreDown = ufw route delete allow in wg0 out on ens33

    PreDown = iptables -t nat -D POSTROUTING -o ens33 -j MASQUERADE

    ```


    Save and close the file. This allows Wireguard to modify the firewall configuration
    after Wireguard starts and before it stops to enable the VPN function correctly.


    Additionally, you need to allow traffic via the listening port you configured
    earlier in the chapter (port 26535 in the example):


