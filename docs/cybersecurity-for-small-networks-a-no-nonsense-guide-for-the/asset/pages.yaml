- img_proc: true
  md: '![](img/8fad00e2c75135eb78018c62b7973377_97_0.png)


    Figure 4-3: Wireless MAC config options shown in an ASUS AC-RT5300 router


    The Basic Config options, whether the filter is enabled or disabled, and whether
    the filter mode is Accept or Reject—can be applied to either the 2.4 GHz or 5
    GHz radio.


    # 2.4 GHz AND 5 GHz WIRELESS BANDS


    These two frequencies have several differences. One is the wavelength: the 2.4
    GHz band will result in a wireless network that functions over greater distances,
    while the 5 GHz band will be less effective over longer distances, but it can
    provide faster speeds within its shorter range. There will likely be more interference
    on the 2.4 GHz band, as this is an older technology, so far more wireless networks
    and devices use this frequency (including microwaves, which can cause wireless
    interference). Finally, not all wireless devices are capable of handling both
    2.4 GHz and 5 GHz wireless signals.'
