  md: '# DETECTING, REMOVING, AND PREVENTING MALWARE


    ![](img/8fad00e2c75135eb78018c62b7973377_175_0.png)


    Malware such as viruses, trojans, and ransomware are significant threats to internet
    users and likely will be for the foreseeable future. As a result, it''s important
    to arm yourself and your users with an antivirus solution that detects and removes
    malware. Additionally, keeping your endpoints up-to-date can prevent malware from
    infecting your network and in some cases provide more protection than an antivirus
    (AV) solution.


    Antivirus solutions can be tricky to manage because they typically are not cross-platform
    (that is, they work on only one operating system). If you have multiple operating
    systems in your network, you''ll need to find an effective AV product for each
    of them. Although this chapter discusses installing, configuring, and scanning
    with specific products, most options and settings will be the same across most
    antivirus solutions. The names of the settings and configuration options may differ
    slightly, but the same logic and processes should work for most products.


    After exploring some antivirus solutions for various operating systems, we''ll
    consider the differences between malware signatures and heuristic scans, the pros
    and cons of each approach, and the concept of creating an antivirus farm to catch
    as much malware as possible across different endpoints. Finally, we''ll cover
    patch management for various operating systems and how best to keep your endpoints
    up-to-date.'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# Microsoft Defender for Windows


    The latest iteration of the built-in Microsoft antivirus solution is Microsoft
    Defender. Defender automatically updates its virus definitions and scans for threats
    on a regular schedule, so Windows computers have decent protection out of the
    box.


    Defender''s automatic scans are quick scans that check only the folders where
    threats are commonly found. While a quick scan offers fast results and uses few
    system resources, it''s unlikely to discover and remove malware residing outside
    of these folders. A full scan scans all your files and running programs, performing
    a thorough search for malware. It''s recommended to run full scans between once
    a week and once a month. The longer the period between full scans, the more time
    an adversary has to wreak havoc on your systems.


    You also have the option to choose custom and offline scans. A custom scan lets
    you select which folders and files to scan. An offline scan is similar to the
    Boot to Safe Mode of malware removal available in earlier versions of Windows.
    Windows is now capable of automatically rebooting to a state that allows Microsoft
    Defender to remove malware via this offline scan. This option is a last resort,
    rather than a scan you would regularly run. If you believe your computer is infected
    but unable to find the infection using a full scan, run the offline scan to be
    certain. Failing this, your only recourse is to wipe your hard drive and reinstall
    Windows from scratch.


    To run scans, open Settings►Update & Security►Windows Security►Virus & Threat
    Protection. Click Scan Options, select the type of scan you want, and then click
    Scan now.


    In the Virus & Threat Protection menu, ensure Real-time protection is turned on
    to allow Defender to protect your computer constantly. You can add file and folder
    exclusions from this menu. You might add exclusions when you have files or programs
    that are legitimate and not a risk to your system, but Defender classifies them
    as malware and tries to quarantine them anyway.


    One setting in particular could be considered a risk to your privacy, Automatic
    Sample Submission, which allows Microsoft Defender to upload your files to Microsoft''s
    servers in the cloud to be analyzed'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'and scanned for malware. This practice poses a risk: private or confidential
    data could be leaked to a third party without your knowledge, as Defender won’t
    ask or advise you of files being uploaded to Microsoft. To turn off this setting,
    toggle Automatic Sample Submissions.


    Related to this setting is the Cloud-Delivered Protection setting. This one isn’t
    as risky, as it relays only file metadata to Microsoft rather than entire file
    contents. Cloud-Delivered Protection will still work with Automatic Sample Submission
    turned off, although it might not perform well.


    Windows will keep Microsoft Defender up-to-date, but it never hurts to update
    manually occasionally. To update, Check for Updates on the main Virus & Threat
    Protection page.


    ![](img/8fad00e2c75135eb78018c62b7973377_177_0.png)


    # Choosing Malware Detection and Antivirus Tools


    When deciding on the antivirus and malware detection tools you’d like to use,
    consider whether it’s worth paying for a commercial tool (or the premium version
    of a free tool) and whether the tool will use signatures or heuristics to detect
    malware.


    In general, all you want is a simple malware scanning tool, there’s rarely a good
    reason to pay for a commercial product. Typically, you’ll pay for advanced features,
    such as an email or web browser scanner built-in to the malware file scanner.'
  merge: -1
  pgno: 177
- img_proc: true
  md: 'Oftimes, paid solutions allow for some form of centralized management. Whether
    that’s a web portal or a management server or agent, you gain visibility and the
    ability to manage all of your devices from one place. If you have a larger network,
    there’s value in having this capability; if your network consists of less than
    30 devices, you probably don’t need it.


    # Antivirus Farm


    There''s also a benefit in foregoing a single solution in favor of using multiple
    antivirus products in smaller networks. Antivirus farms use several products aiming
    to catch more malware than a single solution might. It also makes the attacker''s
    job more difficult; instead of evading a single antivirus product, they need to
    evade by moving later through a network.


    Antivirus farms are helpful because every antivirus vendor curates their own databases
    of malware signatures—sequences of bytes in the executable that can be used to
    identify specific malware sample. These databases have to be optimized very often;
    otherwise, the virus definitions that you download with the software would become
    too large and unwieldy to be useful. Therefore, older virus definitions may be
    removed from these databases over time, which means products from multiple vendors
    will likely lead to greater coverage of known threats.


    # Signatures and Heuristics


    You should also aim to use antivirus products that perform both signature-based
    detection and heuristics. Signatures identify known-malicious software by the
    contents of an executable or other file, it''s trivial for an attacker to change
    the signature of their malware by changing the contents slightly. This is a major
    weakness when it comes to malware detection software. Heuristics, on the other
    hand, analyze the file it behaves and commands a file right to determine whether
    it''s malicious. This is a much more reliable way of detecting known and unknown
    threats. How do you tell whether a particular antivirus program performs signature-based
    detection or heuristic scanning? The best way, if'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'it''s not listed on their website, is to contact the vendor and ask. There
    will always be a contact method listed on their website.


    # #26: Installing Avast on macOS


    Apple devices, commonly believed to be less prone to malware, are becoming infected
    more often, which means you should install antivirus software on any Macs on your
    network. There are many options, both free and commercial, when installing a third-party
    heuristics-based antivirus solution on your Apple computer. Among these, Avast
    has topped many lists for several years. To install and configure Avast, use the
    following steps:


    +   1. Download Avast from http://www.avast.com/ and install the software. When
    the installation has completed, you should be presented with the Avast Security
    window (Figure 8-1).


    ![](img/8fad00e2c75135eb78018c62b7973377_179_0.png)


    Figure 8-1: Avast Security window


    +   2. Click Menu►Preferences to reach Avast''s settings page.'
