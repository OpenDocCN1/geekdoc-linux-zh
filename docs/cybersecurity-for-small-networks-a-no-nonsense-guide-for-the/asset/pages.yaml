  md: '# About the Author


    Seth Enoka is an IT and cybersecurity veteran, having worked on large and complex
    cybersecurity incidents and investigations all over the world. When he’s not helping
    organizations kick and keep adversaries out of their networks, you can find him
    teaching digital forensics and incident response, mentoring and being mentored
    by others in the security community, working through some degree or certification,
    or preparing for his next powerlifting competition (whenever that might be . .
    .).


    # About the Technical Reviewer


    Kyle Rankin is the chief security officer at Purism and the author of Linux Hardening
    in Hostile Networks and DevOps Troubleshooting, among other books. Rankin was
    an award-winning columnist for Linux Journal. He speaks frequently on open source
    software and has given keynotes at SCALE and FOSDEM.'
