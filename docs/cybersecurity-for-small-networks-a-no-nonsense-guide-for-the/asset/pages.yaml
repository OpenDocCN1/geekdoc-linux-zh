    # BLOCKING INTERNET ADVERTISEMENTS


    ![](img/8fad00e2c75135eb78018c62b7973377_158_0.png)


    Companies monetize the internet through advertising, which has caused the number
    of online ads to proliferate (or more accurately, explode). These ads have become
    more insidious over time, as websites track your activity to display the promotions
    most likely to lead to purchases. Even worse, advertising has caused slower internet
    connections through websites becoming so bloated with autoplaying advertisements.


    You can block ads from your network in several ways. This chapter will first discuss
    various browser ad-blocking solutions. Then, we''ll build an ad-blocking DNS proxy
    server using Pi-Hole to provide users with a much better browsing experience while
    also improving data and privacy protection.


    # Browser-Level Ad Blocking


    Most modern browsers have some form of ad-blocking technology built-in to the
    application itself. By default, some browsers prevent various trackers and scripts
    from operating as designed. These include social media trackers, cookies, fingerprints,
    and cryptominers. Blocking social media trackers disallows sites such as Facebook,
    Twitter, and LinkedIn from tracking you as you browse websites that implement
    social media buttons or instant sharing links. Cookies are files used by sites
    to track information and user preferences between visits; this can leak your'
  merge: -1
  pgno: 158
- img_proc: true
  md: 'private information from one site to another. Fingerprints are similar in that
    they identify a specific user by a number of metrics collected from their browsing
    habits, which allows advertisers to track your activity during a browsing session.
    Finally, cryptominers are applications (some might say malware) that use your
    computer hardware to mine cryptocurrency, such as Bitcoin. This is a highly resource-intensive
    process that can cause system instability. All of these negatively impact your
    browsing experience and should be blocked.


    Besides the built-in functionality provided by some web browsers, some of the
    most popular browser ad blockers are browser extensions, also known as add-ons—software
    that you can add to your browser to improve its functionality or add capabilities.
    For example, Adblock Plus—installed in most browsers—works by intercepting advertisements
    before they''re displayed to the user, though the ads are still downloaded to
    your computer.


    Many websites can identify when browser extensions are in and will modify their
    content or completely block users from viewing pages until the extension has been
    disabled or the site is allowlisted to play ads. Browser extensions are discussed
    further in Chapter 11. The following projects cover how to set up browser blocking
    for Google Chrome, Mozilla Firefox, and Brave browsers.


