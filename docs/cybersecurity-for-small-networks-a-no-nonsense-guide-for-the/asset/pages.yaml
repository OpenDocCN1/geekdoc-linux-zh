- img_proc: true
  md: 'As shown in Figure 4-4, you can allow guest devices on the network for an unlimited
    amount of time or a specific period of your choosing, which is useful for guests
    who may need access for only a few hours. By configuring your router to allow
    guests unlimited access, you trade security for convenience. Conversely, limiting
    the amount of time a guest can connect before needing to be re-authorized requires
    more. Still, it''s a far more secure manner of access control.


    One last feature provided by wireless routers and access points is the option
    to allow or deny access to your intranet, which is the internal network where
    your private devices are connected. Allowing guests access to this segment of
    your network lessens your security, as it provides them with access to your computers
    and mobile devices. If you let guests access your entire network, you might as
    well give them this capability; I''ve been discussing this in previous chapter;
    if you configure a guest network, you can choose to allow endpoints connected
    to your wireless router to access your intranet or allow them to access only the
    gateway to the internet. The router handles this access by allowing or disallowing
    devices connected to your guest network to your primary network. Banning access
    from the guest network to your intranet is the more secure option and one that
    you should implement. If your router has this capability, a fairly obvious checkbox
    should be present in the router network settings. If you can''t find it, chances
    are your router doesn''t have it (although you can make sure by reading the manual
    or doing a quick internet search).


    # #18: Configuring Wireless Authentication


    You should protect your Wi-Fi network with encryption by creating a passphrase
    to access the network. An open wireless network—with no protection or encryption—provides
    a prime target for an adversary. Today, most networks use one of three security
    algorithms to secure their communications: WEP, WPA/WPA2, or WPA3.


    # WEP'
  merge: -1
  pgno: 100
- img_proc: true
  md: 'Wired Equivalent Privacy (WEP) is the oldest of the three security protocols
    and by far the least secure. WEP uses either a 40- or 104-bit encryption key,
    both of which are small when compared to those of later protocols. WEP combines
    this encryption key with 24-bit initialization vectors (IVs) meant to provide
    enhanced security, but the shortness of these IVs meant the algorithm will likely
    reuse keys, which in turn makes the encryption easier to crack. Understanding
    the details isn''t necessary; just know that WEP is an insecure technology and
    shouldn''t be used. In fact, vendors phased out WEP by 2001; it’s no longer available
    on most hardware.


    # WPA/WPA2


    Wi-Fi Protected Access (WPA), the successor to WEP, improved upon WEP''s protection.
    Although it relied on the same RC4 encryption cipher, it also introduced the Temporal
    Key Integrity Protocol (TKIP). TKIP strengthened wireless security using a 256-bit
    key and implementing message integrity checking, larger 48-bit IVs, and mechanisms
    to minimize IV reuse.


    In turn, WPA2 improved the original WPA protocol. Both WPA and WPA2 allow users
    to choose between personal and enterprise modes. Personal mode, called WPA-PSK,
    uses a preshared key (PSK) or passphrase to grant access, while enterprise mode
    requires an authentication server. WPA2 replaced the RC4 encryption cipher and
    TKIP in favor of more secure algorithms and encryption protocols. Moreover, it
    implemented Counter Mode Protocol (CCMP), a more secure encryption mechanism.
    All of this made WPA2 far more secure than the earlier encryption protocols and
    facilitated roaming between access points, providing a smoother user experience.
    If possible, choose WPA2 or greater in your wireless network.


    Having said that, an adversary could still capture your wireless traffic and brute-force
    your network password. Though WPA2 is good, there''s no such thing as perfect
    security. As a result, ensure that you use strong passphrases to secure your wireless
    networks. Passphrases are discussed in detail in Chapter 11.'
  merge: -1
  pgno: 101
- img_proc: true
  md: '# # WPA3


    Wi-Fi Protected Access version 3 (WPA3) is the latest wireless security technology.
    It’s very recent and hasn’t yet seen wide adoption. WPA3 improves security by
    keeping users who are connected to the same network from eavesdropping on each
    other’s wireless communications—even if the wireless network is open and doesn’t
    require a password to authenticate.


    WPA3 achieves this by replacing the preshared key authentication used in WPA2
    with a new protocol: Simultaneous Authentication of Equals (SAE). This change
    also means adversaries can’t capture the traffic needed to crack the network’s
    password, making it even more difficult for them to gain unauthorized access to
    the network.


    For now, WPA3 is in its infancy, so very few devices are compatible. Newer wireless
    routers and access points will come with WPA3 as standard. Even then, other devices
    will need to catch up before you can use it; there’s little value in having a
    WPA3 router if your phones and computers can’t connect to it. Once this changes,
    you should use WPA3 over any other wireless security standard.


    To configure the ASUS router we’ve been discussing, in the wireless settings,
    under **Advanced Settings►Wireless►General**, you’d create your primary, internal
    network by specifying the network name (SSID) and a security key or passphrase,
    as shown in Figure 4-5. Then, in **General►Guest Network►Enable**, create one
    or more guest networks to which you’ll connect all of your other devices by specifying
    a network name and security key, just as you did for your primary wireless network.'
