  md: '# 6


    # IMPROVING BROWSING AND PRIVACY

    WITH THE SQUID PROXY


    ![](img/8fad00e2c75135eb78018c62b7973377_139_0.png)


    A proxy server acts as an intermediary between you and the internet. When you
    request a web page, the proxy receives the request and then forwards it on to
    the web server (if necessary). A proxy allows you to protect your privacy by obfuscating
    the metadata that is usually available to the services we interact with daily
    on the internet. Proxies also allow the administrator to block access to certain
    content, like social media or online gambling.


    This chapter will show you how to install, configure, and use the Squid proxy,
    a solution that runs on most operating systems. With Squid, you''ll be able to
    speed up access to websites, enhance your security, and allow or prevent access
    to specific domains or websites. Chapter 7 covers another proxy solution, Pi-Hole,
    which offers the same benefits as Squid, and additionally blocks ads and prevents
    other tracking and privacy issues as well. Choosing the best proxy for your needs
    will depend on which you find easier to use and which provides you the best user
    experience.


    # Why Use a Proxy?


    Every time you visit a website, your computer makes a request to a web server
    that responds by sending you the information necessary to view the website. The
    communication between your browser and the server may expose your personal information
    (the browser you''re using, your public IP'
  merge: -1
  pgno: 139
- img_proc: true
  md: 'address, and so on) through metadata. The metadata allows Squid the web server
    to make guesses about you and your device, such as your location, what time of
    day it is where you are, and your browsing habits. For lots of reasons, you might
    want to keep this information private. Additionally, loading web pages and their
    content consumes bandwidth, so as more people use an internet connection, the
    connection can begin to slow down, negatively affecting everyone using it.


    One thing about proxies is that they cache any traffic that passes through them.
    This means that every time a page is retrieved, the proxy will keep a local copy
    of that page. The next time someone tries to browse to site, the proxy first checks
    its cache for a copy, and if it holds a copy, it presents that to the user rather
    than sending a request to the web server for a fresh copy of the web page. By
    default, Squid will keep a cached copy of a website for a set period before it
    no longer considers the cache “fresh” and will then retrieve the latest version
    of the page, whether or not the content has changed. This reduces the load on
    the network, the time it takes to load frequently visited sites, and the overall
    amount of bandwidth used, leading to a better experience for everyone involved.


    Proxies also reduce the amount of personally identifiable information (PII) leaked
    to web servers. PII is any data or information that can be used to identify any
    specific individual (such as you). For example, a proxy can identify itself to
    a web server as any web browser. You might be using Google Chrome, but the proxy
    could present Firefox to the server instead. The proxy can also have a different
    IP address to hide the one you''re using if it''s located other than where you
    are (like in the cloud), obscuring your physical location and internet service
    provider.


    Even though it''s not directly relevant to small network administrators, you might
    be interested to know that commercial organizations often rely on proxies (including
    Squid) for the benefits we''ve already discussed, as well as for content delivery,
    as as streaming audio and video. Content providers, such as Netflix and YouTube,
    strategically place proxy servers globally to keep local copies of content. This
    practice allows users of those services to access the content from a source closer
    to home, rather than all users accessing the content from a single location, which
    would be less efficient and would result in poor performance in a lot of cases.'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# # #21: Setting Up Squid


    The Squid web proxy provides all the benefits you just learned about: it reduces
    bandwidth, making surfing the web faster for users. It''s also capable of anonymizing
    your personal information if configured correctly; information about your identity,
    such as where your web requests are coming from or the browser you''re using,
    can be stripped or changed before traffic is sent to the internet. Many enterprise-grade
    devices use Squid. While you could use many other proxy solutions, such as NGINX,
    Apache Traffic Server, or Forcepoint, Squid is free and open source, so it provides
    greater access to underlying configurations and data than a commercial solution
    might.


    A wealth of information is available online using Squid to protect and enhance
    your network. You can find more information on Squid proxy configuration in the
    Squid wiki https://wiki.squid-cache.org/SquidFaq/.


    This project will cover the initial installation and configuration of Squid, configuring
    clients in your network to use the proxy, testing the proxy once configured, and
    performing some additional steps to allow or deny access to certain internet resources
    using the proxy.


    # ## Configuring Squid


    Create a base Ubuntu server following the steps in Chapter 1. If you want to hide
    your location or prefer not to give away your internet service provider (in addition
    to preventing your metadata being recorded), create the proxy server in the cloud
    in a country different from your own. Otherwise, locate the proxy server inside
    your network. Don''t forget to add your new server to your network map and asset
    list you created in previous chapters. Once you''ve done so, log in to the server
    via SSH as a standard, non-root user. To install the proxy, use the following
    command:


    ```

    $ sudo apt install squid

    ```


    The installation should complete in less than a minute. By default, you''ll find
    the configuration file located at /etc/squid/squid.conf, the logfiles at'
  merge: -1
  pgno: 141
- img_proc: true
  md: '/var/log/squid/, and the cache data (that is, cached website information) at
    /var/spool/squid/


    Open the squid.conf configuration file with a text editor to familiarize yourself
    with the settings:


    ```

    $ sudo nano /etc/squid/squid.conf

    ```


    Squid has many possible configurations, so it''s easy to become overwhelmed. Notice,
    though, that many settings aren''t active as they''re commented out by default.
    Let''s start by focusing on the active settings. You can explore other changes
    when your proxy server is functioning as you want it to.


    Search by pressing CTRL-W; then type your search term and press ENTER to find
    the section Recommended minimum configuration:


    ```

    --snip--

    # Recommended minimum configuration:

    #n# Example rule allowing access from your local networks.

    # Adapt to list your (internal) IP networks from where browsing

    # should be allowed

    acl localnet src 0.0.0.1-0.255.255.255 # RFC 1122 "this"

    network (LAN)

    acl localnet 10.0.0.0/8 # RFC 1918 local

    private network (LAN)

    --snip--

    ```


    This section details the access controls lists (ACLs) that tell Squid which endpoints
    have permission to access internet resources via the proxy server. An ACL is a
    list of ports, addresses, or resources that you''ve specifically allowed or banned
    from communication within the network.


    An ACL consists of several elements. First is a unique name, such as localnet,
    that identifies a specific ACL. Each name then contains an ACL type (such as src)
    followed by a value or list of values, such as IP addresses or port numbers. These
    values can be entered over multiple lines, and Squid will combine them into a
    single list.'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'Keywords like src indicate Squid the direction in which the traffic is flowing;
    src 10.0.0.0/8, for example, indicates any traffic coming from an address in the
    10.0.0.0/8 IP range to any IP address in any range.


    Comment out lines that do not apply to your network. For example, if your internal
    IP addresses follow the 10.x.x.x format, leave the relevant directive is and comment
    out all other lines beginning with acl localnet src by adding a # at the start
    of each line:


    ```

