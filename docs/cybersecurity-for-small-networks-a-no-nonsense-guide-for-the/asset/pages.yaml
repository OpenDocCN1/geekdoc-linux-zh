    # #37: Installing Wazuh


    Security Onion’s additional tools help you to understand what’s happening in your
    network and take action to investigate, mitigate, and remedy issues when they
    arise. One of these packages is Wazuh.


    Wazuh is an open source endpoint detection and response (EDR) platform that monitors
    your endpoints for malicious activity, alerts you within the Security Onion console,
    and provides the incident response capabilities of blocking network traffic, stopping
    malicious processes, and quarantining malware files.


    Using agents like Wazuh can be controversial. In larger networks, oftentimes so
    much is going on adding something new to the network, especially across all the
    systems, can cause stability issues or create/exacerbate challenges around limited
    resources like bandwidth. This is usually less an issue in smaller networks because
    capacity isn’t shared between so many devices, users, or processes, and there
    generally aren’t as many solutions competing for resources.


    Installing Wazuh won’t have a meaningful impact on the daily operations of your
    small network. Conversely, the value you receive from the additional monitoring
    and security uplift outweighs any potential negative consequences of using multiple
    agents. Ultimately, it’s your decision whether to install these agents on one,
    or all of the endpoints in your network. The more complete your coverage and network
    monitoring, the more secure your network is likely to be.


    This section provides instructions for installing the Wazuh agent on Windows,
    macOS, and Linux.'
