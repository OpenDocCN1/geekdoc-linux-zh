  md: '--snip--


    Here, SSL_ports and Safe_ports are ACL names, and the port type tells Squid to
    interpret the number that follows as a port number used for communication by a
    specific service (see Chapter 1). The acl ssl_ports port 443 line sets the port
    proxy used for secured, filtered tunnels, such as those used for HTTPS traffic.
    Directives containing the label Safe_ports determine the ports on which Squid
    should allow connections. If you don''t need a certain protocol or port, comment
    it out to reduce your attack surface. To be prudent, may keep only ports 80 and
    443 and comment out the acl Safe_ports port 1025-65535, thereby blocking ports
    from 1025 through 65535. However, doing so may cause some applications or services
    to malfunction if they require other ports. You can use Google and the website
    or manual for a given application to determine what other ports it might need
    to function correctly.


    A little further in the configuration file, you''ll find directives that enable
    these ACLs:


    --snip--


    ```

    # Recommended minimum Access Permission configuration:

    #

    # Deny requests to certain unsafe ports

    http_access deny !Safe_ports

    # Deny CONNECT to other than secure SSL ports

    http_access deny CONNECT !SSL_ports

    --snip--

    ```


    The http_access deny !Safe_ports directive tells to prohibit communication between
    all ports except those listed in the Safe_ports list. Likewise, the http_access
    deny CONNECT !SSL_ports line tells Squid to prohibit filtered tunnels on any port
    other than the one specified in SSL_ports.


    The next section of the configuration file relates to your local network as opposed
    to the internet:


