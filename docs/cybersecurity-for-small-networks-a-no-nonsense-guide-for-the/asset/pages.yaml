    # Restoring multiplicity Backups


    Use the command line to restore backups created with duplicity:


    ```

    $ duplicity restore:///tmp/ /home/user/backup_folder_name/

    ```


    Entering the restore command with a source and target path restores files from
    the backup set to the specified location.


    There are various options to restore specific files and folders from a backup
    set if required. Here''s an example:


    ```

    $ duplicity -t 3D --file-to-restore \

    home/user/Documents/test.txt \

    file:///tmp/ /home/user/Documents/restored_file

    ```


    In this command, we invoke duplicity, tell it to restore the version of the test.txt
    file (specified immediately after the --file-to-restore argument) from three days
    ago with the -t 3d parameters from the backup we created in the /tmp/ on the local
    system, and then saving the resulting file to the /home/user/Documents/ folder.
    For more information on restoring files and the options available, review duplicity''s
    man page.


    # Additional duplicity Considerations


