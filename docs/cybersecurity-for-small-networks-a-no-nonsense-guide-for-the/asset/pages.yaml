    +   7. In the Sc tab, ensure the checkboxes Scan Whole Files, Scan External Drives,
    Scan Mounted Volumes, Scan All Time Machine Backups, and Scan Archives are ticked.
    By doing so, you can be certain your antivirus is doing as much as possible to
