  md: '# # INTRODUCTION


    ![](img/8fad00e2c75135eb78018c62b7973377_16_0.png)


    This book is an introduction to cybersecurity, written to help system and network
    administrators and owners understand the fundamentals of securing a network. Your
    personal cybersecurity is critical in protecting yourself from fraud and other
    harmful events attempted by adversaries. It''s easy to tell yourself that you
    can''t be a target, that you have nothing an adversary would want to use or exploit.
    However, your personal identifiable information (PII), protected health information
    (PHI), intellectual property, and government things and identification all have
    value. Failing to protect those things can lead to consequences such as identify
    theft, which can have a serious impact on your life.


    For our purposes, a small network consists of 100 or fewer endpoints. An endpoint,
    or *host*, is any system or device that connects to or is part of a network, such
    as a desktop or laptop computer or a mobile device like a phone or tablet. Larger
    networks, approaching the size of an enterprise network, use similar tools and
    techniques that are covered in this book to provide security to their users and
    systems, just on a much larger scale and often at a much higher cost.


    The drawback of securing small networks is that you have to maintain and administer
    everything yourself, with limited support and likely a limited budget. Securing
    your network will require constant care, and we''ll cover some ways that you can
    do cheaply when the need arises. Ultimately, the goal of this book is to arm you
    with the tools and knowledge to secure your network with whatever resources you
    have available, in terms of both time and money.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# How to Use This Book: What to Expect


    This book is written so that if you follow it logically from chapter to chapter,
    you''ll progress through several levels of security maturity, ending with a network
    that has a defense-in-depth architecture. Defense-in-depth is an approach to cybersecurity
    where several defense solutions are layered to protect valuable data and information.
    Chapters 1 to 4 cover how to design and architect your network to better enable
    your defenses and network monitoring capabilities. Then, Chapters 5 to 8 discuss
    low-cost, high-impact passive defense strategies against adversaries from gaining
    access to your network or endpoints. Finally, Chapters 9 to 11 focus on the value
    of regular backups and active defenses, whereby you respond to suspicious or malicious
    activity in your network, enabling cyber incident response.


    Most chapters contain stand-alone projects. You can choose to complete each project
    in order, or you pick and choose which projects you want to complete. However,
    the concepts covered in earlier chapters on network architecture provide the best
    return on investment, in terms of both time and money, and require less ongoing
    support and maintenance. The later chapters that cover active defenses require
    constant monitoring and are made more efficient with the completion of earlier
    projects. In some cases, working through the projects in earlier chapters also
    provide baseline knowledge that may be useful in later projects, such as familiarity
    with the command line. Essentially, you should complete each chapter whichever
    order makes the most sense for you and your environment; for example, if you already
    have host and network firewalls in place, you can probably skip Chapter 3.


    I recommend starting with Chapter 1 before setting off on your own adventure.
    It covers two fundamentals: setting up the servers you''ll use throughout the
    book and creating a network map and asset list. Before you can secure your network,
    you need to understand its topology: which hosts are connected to it and how they
    connect to other. Mapping the topology will help you keep track of your devices
    and recognize unusual activity on the network. It''s expected that the vast majority
    of readers will implement the projects contained in this book as virtual machines
    (VMs). Virtual machines (which are also endpoints!) let you run multiple computers
    using one computer. Using VMS is a cheaper and easier to'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'achieve the same results with fewer hardware requirements. (I’ll describe the
    remaining hardware recommendations in the section “Recommended Hardware.")


    # # Recommended (But Not Required) Knowledge


    In this book, you’ll learn the fundamentals of cybersecurity as it relates to
    securing small networks. The book will guide you through all of the necessary
    steps to complete each chapter and project at a very low level. Having previous
    experience working with virtual machines, using the command line, and generally
    managing or administering a network of any size will prove beneficial. Having
    said that, you should be able to follow regardless of experience, as you’ll learn
    the necessary skills as you progress.


    # # Recommended Hardware


    Some of the projects in this book may require hardware or a device or system that
    you may not currently have on hand. Wherever possible, alternatives will be provided
    to purchasing new hardware, but in some cases, you might find the best or only
    way forward is to buy something new. What follows is a list of the hardware used
    in each chapter.


    # ## Virtual Machine Host System


    You can use a computer you already have to run your virtual machines, so long
    as physical computer has enough memory (RAM) and processor (CPU) resources. As
    a general rule, you’ll need 2GB of memory and one CPU core for each VM you plan
    to run, plus at least 4GB of memory and one CPU core for the host operating system.
    Therefore, to complete every chapter of this book, you should plan to use a physical
    system with at least 16GB of RAM and eight CPU cores.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'Most modern systems come with specifications of this level, and you can also
    use network attached storage (NAS) or another system capable of running virtual
    machines, or a small computing unit such as an Intel NUC, in the way. A NAS is
    a device connected to your network that allows storage and retrieval of data from
    a central location and in most cases will offer additional network services and
    capabilities, like the ability to host virtual machines. If you have spare resources
    on your computer, start there. You can always move your virtual machines to a
    new system if they outgrow their original host and its hardware.


    # Firewall


    In Chapter 3, you''ll be led through the installation and configuration of a pfSense
    firewall. This firewall can be purchased cheaply, and it will go a long way in
    increasing the security of any network very quickly and with minimal effort. The
    recommended device is the Netgate SG-3100 at its cost-effective and easy to set
    up and maintain. It is possible to build your own, but the Netgate likely be more
    secure and have a better cost.


    # Wireless Router


    If you plan to use wireless in your small network (it''s expected that the majority
    of your devices will be wirelessly connected), you''ll need a wireless router
    or access point. We''ll use the ASUS RT-AC5300 for most of the relevant examples
    in this book. This router is a mid-range device in terms of price and features.
    It provides enterprise-grade functionality without the premium price tag.


    # Managed Switch


    A managed switch is a device that can be configured to monitor and control network
    traffic. This is another relatively low-cost'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'device that will provide you with very useful capabilities, like the ability
    to keep vulnerable and valuable devices separate. We’ll mostly be discussing and
    using the Netgear GS308E.


    # Network TAP


    A network tap is a monitoring device that mirrors traffic passing between two
    points on a network, allowing you to collect network traffic as it travels between
    devices as well as networks. You can analyze captured traffic to identify suspicious
    or malicious behavior and then tailor your defenses to prevent or alert on that
    activity, providing the best chance to prevent cybersecurity incidents. Dualcomb
    offers several TAPs with varying capabilities, capacities, and price points. For
    most small networks, the ETAP-2003 will be sufficient; this is the device we’ll
    focus on.


    # Alternatives


    While the step-by-step instructions will be tailored to these recommended devices,
    the processes are generalized enough that you should be able to follow them with
    any other similar devices. Alternatives to all the devices recommended in this
    introduction are devices available from Ubiquiti. While Ubiquiti devices will
    be more expensive, they provide greater functionality and ease of administration,
    and they offer commercial support.


    # Summary


    If you want to begin your security journey in the most cost-effective possible,
    complete Chapters 1 to 4 on creating a defensible network architecture. If your
    interests lie more in the network monitoring, detection, and incident prevention
    domains, dive into Chapters 5 to 8 to learn high-impact defense strategies for
    mitigating cyber vulnerabilities and preventing'
  merge: -1
  pgno: 20
- img_proc: true
  md: adversary access to your endpoints. If your network and defense capabilities
    are somewhat mature already, investigate Chapters 9 to 11 for more active strategies
    to protect your network, endpoints, and users from adversaries that might be targeting
    your personal information or business data.
  merge: -1
  pgno: 21
- img_proc: true
  md: '# # 1 GETTING STARTED WITH A BASE LINUX SYSTEM AND NETWORK MAP


    ![](img/8fad00e2c75135eb78018c62b7973377_22_0.png)


    This chapter presents two fundamental projects: setting up a basic Ubuntu system
    that you''ll use throughout the book and creating a network map. You''ll use this
    system as a base on top of which you will install and run various security tools,
    and the network map will provide a visual overview of all the devices in your
    network and how they interrelate and communicate.


    We''ll start with a definition and overview of common Linux operating systems
    and then go through the steps to install a version of Linux (specifically, Ubuntu)
    in a virtual machine (VM), on a physical computer, and in the cloud. Regardless
    of where it''s installed, I''ll show you how to make Ubuntu more secure and then
    add it to your network map. Every time a new endpoint is added to your network,
    you must update your network map to ensure it''s always up-to-date. An out-of-date
    network map is no use to anyone.


    # ## Linux Operating Systems


    Linux is the operating system of choice, as Linux systems are open source and
    therefore very extensible, especially when compared to Windows or macOS. The level
    of control you have over the operating system and the'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'applications that run on top of it is very granular, enabling you to have far
    better control over the security of your endpoints and your network.


    Several Linux operating systems (or distributions) are available. Each distribution
    uses a different set of basic utilities and graphical user interfaces (GUIs),
    and each one looks and functions in a slightly different way. For example, Kali
    Linux is a distribution geared toward offensive operations and is commonly used
    by penetration testers to perform network assessments. Red Hat is probably the
    most used enterprise distribution, and several other distributions are based on
    Red Hat, such as Fedora and CentOS. If you''re interested in Linux, try various
    distributions to find the one you like most.


    In this book, we''ll primarily use Ubuntu, which is one of the most userfriendly
    and the easiest to use for beginners or those new to Linux. Ubuntu is available
    in three editions: Desktop, Server, and Core. For our purposes, the Desktop edition
    is sufficient. If you plan to use your Ubuntu servers for additional network services,
    such as a file or Dynamic Host Control Protocol (DHCP) server, the Server edition
    would be appropriate. Ubuntu Core is specifically for resource-limited applications,
    like internet of things (IoT) implementations.


    The most recent versions of the Ubuntu operating system are available from https://ubuntu.com/download/.
    These downloads will be in ISO format, meaning the file extension will be .iso.
    ISO files are logical images or containers that can be used to emulate physical
    media such as CDs or DVDs.


    The following sections walk through installing Ubuntu, either as a physical device
    or as a virtual machine on macOS or Windows, as well as in the cloud. Using a
    physical device allows you to take advantage of all of a system''s resources,
    such as CPU and RAM, but it requires that you have a physical system available
    onto which you can install Ubuntu. Using virtual machines provides several useful
    features, like the ability to take snapshots (which will be discussed later in
    this chapter). Creating a virtual machine in the cloud provides additional capabilities,
    like easy access to your system from any location, but often comes with additional
    security considerations. Once you''re finished with the platform-specific instructions
    for your setup, jump to “Finalizing the Linux Installation” on page 8.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# #1: Creating an Ubuntu Virtual Machine


    Throughout this book, you''ll create Ubuntu systems for various purposes. Each
    of them will be based on the system we''ll create now, which will act as a standard
    base operating system, on top of which you can add tools and applications necessary
    for securing your network.


    # Hypervisor Options


    A hypervisor is software that allows you to create and run virtual machines using
    a guest operating system. For this initial project, you can create an Ubuntu VM
    using an inexpensive commercial hypervisor from VMware. Multiple editions of VMware
    Workstation are available from https://www.vmware.com/. VMware Player (for Windows)
    and VMware Fusion (for Mac) are free for personal use, but they don''t have some
    of the more advanced features we''ll want to take advantage of in later chapters.
    I recommend using VMware Workstation Pro and VMware Fusion Pro. The commercial
    license for either of these is relatively inexpensive. An alternative solution
    is to use the free VMware Player to begin and then upgrade to the commercial license
    if you need. The step-by-step instructions for Workstation and Player editions
    are mostly the same, with some slight differences between Workstation and Fusion.


    Another option is to use VirtualBox, a free solution for creating and managing
    VMs maintained by Oracle. VirtualBox is available for all operating systems, and
    you can download it from https://www.virtualbox.org/wiki/Downloads/.


    # VMware Workstation and VMware Player for Windows


    To create your VM in VMware Workstation or VMware Player, follow these steps:


    +   1. Click **FileNew Virtual Machine** in VMware.

    2. On the New Virtual Machine screen that opens, choose **Typical (recommended)**
    and click Next.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '+   3. Select Installer Disc Image File (iso).


    +   4. Using the Browse button, navigate to and select the Ubuntu ISO you downloaded
    earlier; then click Next.


    +   5. The Easy Install wizard will ask for the user details for your VM; fill
    out the Full Name, User Name, and Password fields, and click Next.


    +   6. Give your VM a meaningful name indicating its role on your network when
    asked.


    +   7. Save the VM to the default location (or anywhere you desire) and click
    Next.


    +   8. Save the virtual disk size to 40GB if your host machine has disk space;
    otherwise, accept the default 20GB.


    +   9. Store the virtual disk as a single file, rather than split into multiple
    files and click Next.


    +   10. Click Customize Hardware.


    +   11. If your host has enough RAM, increase the RAM of the VM from 2GB to 4GB.


    +   12. Set Processors to 1.


    +   13. Under Network Adapter, select Bridged mode to give your VM its independent
    IP address and network connection.


    +   14. Click Sound Card►Remove.


    +   15. Click Printer►Remove.


    +   16. Click Finish.


    Your virtual machine will be created, and the operating system will begin installing.


    # VMware Fusion and VMware Fusion Player for macOS


    Once you''ve installed VMware Fusion or VMware Fusion Player, follow these steps
    to create your first VM:


    +   1. Click File►New►Continue in VMware.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '+   2. Drag and drop your ISO file onto the VMware Fusion window, or click
    the Use Another Disc or Disc Image button to locate the file in your filesystem;
    then click Continue.


    +   3. The Easy Install wizard will ask you for the user details for your VM;
    fill out the Display Name, Account Name, and Password fields.


    +   4. Ensure the Make your home folder accessible to the virtual machine checkbox
    is not ticked and click Continue.


    +   5. Click Customize Settings.


    +   6. Save the VM to the default location (anywhere you desire).


    +   7. Set the virtual disk size to 40GB if your host machine has enough disk
    space; otherwise, accept the default 20GB.


    +   8. In the Processors and Memory menu, if your host has enough RAM, increase
    the RAM of the VM from 2GB to 4GB, and set Processors to 1.


    +   9. Untick the Connect checkbox to either add or disconnect the following peripherals
    within their context menus: sound card, floppy, printer, and camera. (Disconnecting
    unused or superfluous peripherals from your virtual machines removes potential
    attack vectors.)


    Click the Play button to start your VM, and the operating system installation
    will begin.


