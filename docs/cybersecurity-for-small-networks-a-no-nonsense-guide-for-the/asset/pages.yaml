  md: '# 4

    SECURING WIRELESS NETWORKS


    ![](img/8fad00e2c75135eb78018c62b7973377_88_0.png)


    Wireless networking has become ubiquitous and is synonymous with being online.
    Most places with an internet connection have a wireless modem or router serving
    a multitude of devices, from desktops to phones and internet of things (IoT) devices
    such as TVs, light bulbs, and refrigerators. Without wireless technology, modern
    life would be much less convenient, but convenience often forces us to give up
    some of our online security.


    Wireless networking has caused our networks to extend beyond the cables that originally
    served as physical boundaries. They even bypass other physical barriers we take
    for granted: walls. As wireless technologies evolve, the effective distance of
    our wireless networks improves, so much so that we''re now seeing larger networks
    (LANs) inside our premises, all the way out to our neighbors. This is fantastic
    in terms of connectivity, but potentially disastrous regarding security.


    This chapter will address some of the pitfalls associated with wider wireless
    networks. You''ll learn about reducing your attack surface by disabling IPv6 and
    limiting the number of devices allowed on a wireless network. The chapter will
    also delve into MAC address filtering, which allows only known devices into the
    internal network; disabling features when they''re not in use; using secure authentication
    methods; and grouping devices or users based on their necessary privilege level
    within the network.'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# UPGRADING YOUR HARDWARE


    If you received wireless networking equipment from your internet service provider,
    it''s likely an entry-level device. Usually, this means it has fewer features
    or is less configurable than a higher-end product. If while making your way through
    this chapter, you find that your device doesn''t allow the level of management
    required, consider purchasing a model with higher specifications. Netgear''s Nighthawk
    series routers, for example, are reasonably priced and fully featured, even at
    the mid-range.


    # #15: Disabling IPv6


    IPv6, the newer version of the Internet Protocol, was designed to combat the fact
    that we eventually run out of publicly addressable IPv4 space. IPv6 expands the
    available address space by many orders of magnitude, but it''s not as common as
    another mitigation: network address translation (NAT), which we described in Chapter
    1. If you don''t use IPv6 in your network but leave enabled, you''re providing
    adversaries one more potential intrusion vector (that is, another to enter or
    otherwise compromise your network). As a general rule, you should disable or uninstall
    all protocols and applications that are not in active use to prevent attackers
    from using those tools (or the tools'' vulnerabilities) against you. Disabling
    unused protocols reduces the attack surface of your environment, which should
    be as small as possible.


    If you aren''t actively using IPv6 in your network, disable it wherever you can,
    including in your Wi-Fi configuration. To disable IPv6, follow these steps:


    # Windows


    +   1. Open Network and Internet Settings.

    2. Click Change adapter options.

    3. For each adapter in the resulting window, double-click the adapter and then
    click Properties.'
