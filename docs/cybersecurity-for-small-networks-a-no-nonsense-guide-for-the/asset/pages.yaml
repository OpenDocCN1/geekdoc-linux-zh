  md: '# 5

    CREATING A VIRTUAL PRIVATE NETWORK


    ![](img/8fad00e2c75135eb78018c62b7973377_106_0.png)


    A virtual private network (VPN) is a means of providing privacy and security for
    communications over the public internet. If you don''t want a malicious third
    party to intercept your Google search traffic as it traverses the internet from
    your local laptop to Google''s, you should use a VPN to encrypt the traffic between
    the two endpoints. If you frequently transfer sensitive files or data, such as
    personally identifiable information or banking information, it''s wise to protect
    this information using encryption.


    The other primary function of a VPN is to extend a private network, such as those
    in homes and offices, from one geographic location to another. A VPN creates a
    tunnel over the internet from one network to a second network. This means that
    if a user usually based in Australia is traveling in Europe, they could connect
    to their home network from Europe as if they were physically located in Australia.
    Conversely, if a user located in Australia wants to appear as they''re physically
    located in Europe, they can place the VPN endpoint in Europe, usually via some
    third-party service.


    This chapter outlines a method for creating a private VPN whose exit node (that
    is, the place where the VPN tunnel ends) is somewhere outside of your local network,
    in a different geographic location somewhere in the world, to make your actual
    physical location private. We''ll discuss how to achieve this with OpenVPN or
    Wireguard.'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# Drawbacks of Third-Party VPNs and Remote Access Services


    Although you could subscribe to a VPN service like NordVPN or ExpressVPN, operating
    your own VPN is beneficial because you control everything about it, including
    connection and traffic logging levels, as well as the cost of the service. Also,
    whereas third-party services provide some benefits, such as the possibility of
    using multiple exit nodes in different locations, they usually don''t offer the
    ability to connect into your own network remotely. One last challenge of using
    third-party VPN services is that they usually set a limit to the number of devices
    you can connect at a time. A privately managed VPN has no such limitation.


    Recently, there''s a boom in the number of applications designed to allow remote
    access to endpoints from the wider internet. This includes software and vendors
    such as Teamviewer and AnyDesk. Although these solutions are convenient and have
    a low barrier to entry, they increase the attack surface of your private network
    by opening up remote access from your computer to the internet, something you
    rarely do, if ever. There have also been several well-known compromises of these
    solutions, indicating that they are vulnerable to attack. A VPN provides a much
    more secure solution.


    # OpenVPN


    OpenVPN is one of the most common VPN solutions available. Because of its age
    and ubiquity, you can be confident in its security when compared to newer solutions,
    which have been less rigorously tested for bugs and vulnerabilities. OpenVPN comes
    built-in to a variety of networking hardware, which is beneficial in a lot of
    cases your router can act as your VPN endpoint inside of your network (that is,
    the VPN server). This means your router can also act as a VPN client, connecting
    to a VPN server in the cloud, and then everything connected to the router on your
    internal network can send and receive traffic via your VPN tunnel. Encrypting
    your internet traffic in this way provides much greater privacy than using the
    internet without a VPN. Ideally, you''ll want more control over'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'the VPN exit node than this allows; most routers use either a cut-down version
    of Linux or a proprietary operating system, so you’ll learn how to create a VPN
    server using Ubuntu for greater flexibility.


    # EasyRSA


    EasyRSA is a command-line utility for creating and managing certificate authorities.
    To encrypt and protect traffic, OpenVPN requires a certificate authority (CA)
    to issue certificates. Digital certificates are used to enable trust between different
    parties, usually networks and computers. Public key infrastructure (PKI) is responsible
    for the distribution, authentication, and revocation of public key certificates,
    which are used to verify ownership of digital certificates. These certificates
    contain the public key that an entity uses as parts of a public/private key pair
    to encrypt data, which can then be decrypted by only the public key owner with
    the matching key. This method secures most communication on the internet today.


    The CA you create will generate, sign, verify, and revoke (if necessary) all the
    certificates required to secure communications between the VPN server and VPN
    clients. Technically, you can install both OpenVPN and the CA on the same server,
    but doing so is less secure than installing them on separate servers. Any adversary
    who gains access to the server would have access to the certificates and private
    keys used by the server, as well as the ability to generate new certificates.
    Therefore, you’ll need two Ubuntu servers: one to act as the OpenVPN server and
    one to serve as the certificate server. You’ll use the certificate server to sign
    requests generated on the OpenVPN server for both the VPN server and any client
    devices connecting to the VPN, whether they’re laptops, workstations, mobile devices,
    or any other type of device.


    # Wireguard


    Wireguard, a relatively new alternative to OpenVPN, is simple and incredibly fast
    by comparison. The drawback of being newer is that although Wireguard is open
    source, it has had less time to be tested for bugs'
  merge: -1
  pgno: 108
- img_proc: true
  md: 'and vulnerabilities. However, it has gathered a sizable following in the security
    community and a good reputation for being reliable and secure.


    > **NOTE** If you plan to connect to your private network remotely, keep in mind
    you''ll need a static IP address on your home or office internet connection, well
    as some port forwarding on your border router. Most internet service providers
    supply static IP addresses upon request, usually for a nominal fee.


    # # 19: Creating a VPN with OpenVPN


    In this first project, you''ll start by creating an OpenVPN server and a certificate
    authority to secure communication via the VPN. Next, you''ll generate the relevant
    certificates, create the OpenVPN configuration files, configure the firewall,
    and start the VPN. Finally, you''ll configure each of the VPN clients that will
    use this VPN to send and receive traffic, and you''ll connect to test the VPN
    connection.


    The entire process of spinning up an OpenVPN server in the cloud and connecting
    a client to it should take no longer than a couple of hours. Adding subsequent
    clients should take up to 30 minutes per endpoint. You''ll need to enable and
    configure a firewall on your server as part of creating your VPN. Ubuntu''s built-in
    firewall, the Uncomplicated Firewall (UFW), is designed to reduce the complexity
    of firewall configuration. It''s much simpler than solutions like iptables (covered
    in Chapter 3). We''ll introduce you to UFW and its use in this project as an alternative
    firewall solution. Alternatively, you can apply what you learned in Chapter 3
    and implement the same rules described for UFW in an iptables deployment. Even
    if you have a perimeter firewall in place like pfsense, be sure to enable the
    host-based firewall offered by Ubuntu or iptables, as laid out in Chapter 3, to
    provide an additional layer of protection at the host level. Implementing a host-based
    firewall also allows more granular configuration of the servers'' network connections.


    Once you enable the firewall, you''ll have to adjust the settings of the Ubuntu
    installation so that OpenVPN traffic is capable of traversing that firewall. (I''ll
    cover how to do this later in this project.)


    Securing internet traffic originating inside your network will require a VPN exit
    node elsewhere, as well as a certificate server, so follow Project 3'
  merge: -1
  pgno: 109
- img_proc: true
  md: 'in Chapter 1 to create two base Ubuntu servers in the cloud, using the cloud
    service provider of your choice.


    Once your Ubuntu servers are up and running, log in to the server you plan to
    use as your OpenVPN server (as opposed to the certificate authority) via SSH as
    a standard, non-root user:


    ```

    $ ssh user@your_server_IP

    ```


    Once logged in to the OpenVPN server, at the bash terminal, use apt to install
    OpenVPN:


    ```

    $ sudo apt install openvpn -y

    ```


    You also need to install EasyRSA on both the OpenVPN server and the certificate
    server. Install the latest version using apt as well:


