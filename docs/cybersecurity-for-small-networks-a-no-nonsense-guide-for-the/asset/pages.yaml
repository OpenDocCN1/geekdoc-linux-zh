  md: 'Modern versions of Ubuntu (those from March 2020 onward) have Wireguard built
    into the kernel, so it''s simple to install and get up and running. Wireguard
    isn''t built into a lot of networking hardware at this stage, so you''ll have
    to configure each of your endpoints to connect to it manually, rather than simply
    configuring your router and passing all network traffic through the VPN tunnel.
    In this project, you''ll create a Wireguard server using the instructions to create
    a virtual machine in the cloud, and then you''ll install and configure Wireguard.
    We''ll create the relevant public and private key pairs for the server and any
    clients, configure the server firewall as required, connect a client, and test
    the VPN to ensure that it''s working correctly. Your internet traffic will then
    be safe and secure, as long as you''re connected to your Wireguard VPN.


    # Installing Wireguard


    Create a new Ubuntu server using the instructions provided in Project 3 in Chapter
    1. Log in to the server via SSH as a standard, non-root user:


    ```

    $ ssh user@your_server_IP

    ```


    Then, use apt to install Wireguard, specifying -y to skip the confirmation prompt:


    ```

    $ sudo apt install wireguard -y

    ```


    Next, you''ll create the necessary public and private keys required to connect
    to and encrypt your VPN.


    # Set Up the Key Pairs


