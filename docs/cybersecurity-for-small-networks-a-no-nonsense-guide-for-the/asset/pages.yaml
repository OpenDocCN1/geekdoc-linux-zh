    the hardware. Using a physical system has benefits like increased performance
    or reduced resource requirements in terms of memory and processing power. The
    main drawback is that physical systems usually aren''t as flexible as virtual
    machines. As you progress through this book, you''ll be asked to create multiple
    Linux systems, so we''ll assume that you''ll use most virtual machines. However,
    you should choose to use physical systems for each of these projects, you should
    still be able to follow along.


    To create a physical Ubuntu system, you need a bootable USB drive, which means
    you''ll install Ubuntu on a USB that you can plug into any computer and install
    it from there.


    # ## Bootable USB on Windows


    On a Windows computer, the simplest way to create a bootable Ubuntu USB is with
    Rufus, a small utility specifically for creating bootable media. Download the
    latest version from https://rufus.ie/. Rufus is a portable executable, which means
    you don''t need to install it; just download and run it. Once downloaded, follow
    these steps:


    +   1. Plug in a USB thumb drive at least 16GB in size. Rufus will format this
    USB drive, so make sure it doesn''t contain anything you want to keep.

    2. Run the Rufus executable.

