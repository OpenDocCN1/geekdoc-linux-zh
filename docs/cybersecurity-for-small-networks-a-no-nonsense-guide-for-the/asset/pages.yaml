- img_proc: true
  md: 'Linux is susceptible to viruses as well. However, Linux operating systems rarely
    come with a built-in antivirus application, and there are fewer available than
    for other operating systems. Most of the available solutions are commercial and
    therefore have a cost attached, such as Avast Core Security for Linux, though
    there is an open source solution: ClamAV.


    ClamAV is a free application that can be used on Windows, macOS, and Linux. To
    install it on Ubuntu, log into your server via SSH as a standard, non-root user.
    Run the following command to install the version of ClamAV that allows you to
    automate your virus scanning activity, as well as the GUI, clamtk, which may be
    used later:


    ```

    $ sudo apt install clamav clamav-daemon clamtk

    ```


    With the installation complete, your antivirus definitions (the database that
    tells ClamAV what is malware) should be up-to-date, but you can run the following
    commands to update your virus definitions—either now or in the future—to stop,
    update, and restart ClamAV:


    ```

    $ sudo systemctl stop clamav-freshclam

    $ sudo freshclam

    $ sudo systemctl start clamav-freshclam

    ```


    To run a malware scan, use the clamscan folder_to_scan command. Use / to indicate
    to ClamAV to scan everything in the root of the filesystem, supply the -r parameter
    to make the scan recurse all directories, and use sudo so that ClamAV has the
    necessary permission to read all files in the filesystem:


    ```

    $ sudo clamscan -r /

    --snip ---

    ---------- SCAN SUMMARY ----------

    Known viruses: 8927215

    Engine version: 0.102.3

    Scanned directories: 89954

    Scanned files: 362758

    Infected files: 0

    ```'
