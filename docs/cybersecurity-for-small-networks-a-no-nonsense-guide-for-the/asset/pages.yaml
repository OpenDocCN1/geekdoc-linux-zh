    # Static IP Addressing


    IP addresses can be static or dynamic. By default, most routers use a Dynamic
    Host Configuration Protocol (DHCP) server to assign IP addresses to endpoints
    when they connect to the network. These assignments are called DHCP leases and
    are time-bound; a lease typically expires after 24 hours. Dynamic IP addresses
    may change each time the endpoint connects or the lease expires. However, you
    can alternatively assign each endpoint own static IP address that it’ll keep every
    time it connects to your network. This helps you to know which endpoint IP address
    corresponds and can prevent unknown devices from connecting by limiting avoidable
    addresses.


    You’ll find the static IP address settings in the DHCP menu of Wi-Fi routers.
    For this example, we’ll be using the DHCP Leaves of the Netgate SG-3100 covered
    in Chapter 3, but the process will be similar regardless of the device you’re
    using. To reach the DHCP Leases menu in the SG-3100, click Status→DHCP Leases.
    In similar devices, it might appear in the LAN or Advanced settings. You can see
    a table to mirror Figure 4-1.


    | IP address | MAC address | Client Id | Hostname | Start | End | Online | Lease
    Type | Actions |

    |---|---|---|---|---|---|---|---||

    | 192.168.1.42 | ab:bb:cc:de:ee:ff | | Host_One | 2021/06/09 02:05:30 | 2021/06/09
    02:05:30 | online | active | ✏️ 🗑️ |

    | 192.168.1.41 | ff:ee:cc:bb:aa | | Host_Two | 2021/06/09 02:05:29 | 2021/06/09
    02:05:29 | online | active | ✏️ 🗑️ |


    Figure 4-1: DHCP leases on the Netgate SG-3100 pfSense firewall


    To create an IP address (also called a static lease), click the Add button (in
    it’s the left, unfilled + button). The resulting page allows you to specify an
    IP address for the host you selected. Specify any address you’d like, as long
    as it’s within your addressing scheme, and then click Save. For example, if your
    address scheme is 192.168.1.x, you might'
  merge: -1
