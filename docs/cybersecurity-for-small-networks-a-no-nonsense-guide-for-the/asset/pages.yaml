    # Creating Network Backups with duplicity


    Saving backups to a network location is preferable to saving them to a local

    folder for several reasons. Saving backups locally is risky, because if you

    lose access to the endpoint or it becomes otherwise unavailable, you have

    no backups to restore from other locations. Also, if an adversary gains

    access to the system, they''ve gained access to your (encrypted) backups as

    well. Therefore, it''s safer to save to a remote location like a fileserver. This

    can be achieved using the rsync functionality built in to duplicity. The

    following command assumes you''ve followed the instructions in Chapter 1

    to create SSH keys and use SSH key authentication of password

    authentication. If this is not the case, go back and do so. SSH key

    authentication requires the use of a public/private key pair''s shared

    between the local and remote endpoints, enabling them to perform

    cographically secure communication that offers greater security than the

    use of password or passphrase authentication.


    > $ duplicity /home/user rsync://user@server_ip//path/to/folder/


    Once you''ve decided which files and folders you want to back up, and

    the backup location, schedule duplicity to create regular backups of your

    files using Crontab, a built-in Linux job discussed in detail in Project 27 on

    page 122:


    ```

    $ sudo crontab -e

    --snip--

    # m h dom dow command

    0 0 * * 1 duplicity /home/user

    rsync://user@server_ip//path/to/folder/

    0 2 1 * * duplicity full /home/user

    rsync://user@server_ip//path/to/folder/

    ```'
