  md: '# Review


    Instant messaging clients group test


    # Empathy


    # esemene


    The GNOME standard, with access to a lot more than just instant messaging


    Is the lack of support an issue, or is it a great deal regardless?


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_71_0.png)


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_71_1.png)


    +   The way Empathy connects to various chat services and social networks is unique


    +   esemene''s interface is interesting, taking the best and most noticeable parts
    of MSN Messenger clients


    # Compatibility


    Empathy comes with a large variety of chat services supported from the start,
    although it allows you to connect to some major services such as Google Hangouts,
    Facebook and anything on the Jabber network. It does, however, allow you to connect
    to social media services, or you can keep track of personal messages and integrate
    with Gribble or Skype.


    # Add-on-support


    The full range of libpurple plug-ins is fully compatible with Empathy, although
    not all of them work as well as they should. However, as these are the same plug-ins
    used, there is a wide variety to choose from if you need to look for them they
    are mostly well maintained.


    There is a selection of official plug-ins that add a few features, such as integration
    with GNOME settings, some notifications, and there is also a handful of community-made
    plug-ins, which adds extra services or any meaningful interface options in the
    same way the other clients in this test do.


    # Interface


    The interface things rather simple and there''s only one menu on the main window,
    which opens it up to many possible windows and account management. Everything
    used for actually taking chat-to-day is designed to maximize the area that contacts
    and conversations with no extra buttons for emotions or customisation.


    The look of empathy is perhaps the best part of the software, although its bit
    different to most others - which windows are part when someone sends a message
    or if you decide to integrate a chat. it makes to assemble the other Windows Live
    Messenger clients, it takes the best parts of the service and design the layout
    best.


    # Account management


    Account management uses a much larger GNOME-based account structure, allowing
    you to use Google or other feature-services and take full advantage of the functions
    they offer for storage, social media, emails and more. As this system is well-known
    in some distributions, it''s very easy to use.


    esemene works under one account at a time, and the lack of power allows you to
    change this. it is well to attempt to remember your username and password for
    the three chat services you''ve used, however then you need to log out to access
    the other ones every time, cutting off conversations and file transfers.


    # Overall


    # Overall


    > Empathy is a powerful client that focuses on delivering a great experience rather
    than offering every feature possible, although most of them could be added with
    later plug-ins. it''s also well integrated into the distro that fulfills it fully.


    > esemene was created to be a good way to Windows-converts into Linux, but unfortunately
    it does not have the same sharing appeal compared to the more advanced, and more
    capable, clients on other even within this test group.'
