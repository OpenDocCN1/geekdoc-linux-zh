    +   - Breadboard


    +   - Male-to-female prototyping cables


    +   - 30 soldering iron

    shop.proroni.com


    Components from

    shop.proroni.com


    We use accelerometers every day. They''re in our phones, game controllers and
    help keep us on the ground and planes in the air. Beyond, we will be using an
    ADXL345 module to create a prototype for Space Invaders-style game which we want
    to return to this code in later. It won''t take more than 15 minutes of soldering,
    the physical setup is just beginning. We will be placing the ADXL345 on the Raspberry
    Pi''s GPIO using I2C. First of making sure your Pi is up to date. Open a terminal
    window and type: sudo apt-get update sudo apt-get


    # ## 01 install i2c-tools


    First, ensure your Pi can use I2C to talk to the ADXL345 module. In a terminal,
    use apt-get install i2c-tools followed by sudo nano /etc/modprobe.d/raspberry-pi.list.
    This will enable the last interface ''i2c-bcm2807'' and comment out it looks like
    this:


    ```

    Press Ctrl+X, then Enter to exit, edit the /etc/modules file with nano, adding
    the i2c-bcm2807-dev to ensure it loads every time boot. Reboot to finish the operation.

    ```


    # ## Step 02


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_63_1.png)


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_63_2.png)


    # ## Connect the hardware


    Since we''re using I2C, we will need to install the smbus library. Type sudo apt-get
    install python-smbus in the terminal. Then we connect the accelerometer to the
    Pi with male-to-female prototyping cables. The connect pins are marked on the
    ADXL345, so check our pictures for where to plug into the Pi


    # ## 03 final checks


    With accelerometer attached to Pi, open a terminal window and type sudo apt-get
    -y. At the end assumes you''re using a Rev 2 Pi - replace it if ''0'' is shown.
    You should see some numbers that the ADXL345 has been recognized. Finally, we''ll
    use Git to grab the project-type into the following:


    +   - sudo apt-get install git


    The finished project uses free images from opencart.com


