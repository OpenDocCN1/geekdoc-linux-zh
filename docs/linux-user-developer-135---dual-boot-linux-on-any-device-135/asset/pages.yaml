    nThe latest in the Linux community


    # OPEN SOURCE


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_8_0.png)


    # Reintroducing the BBC Micro


    Even though technology is more than 30 years old, a UK company is taking BBC Micro
    in a bid to create a 1980s classroom and encourage innovation. We talked to Gordon
    Sinclair, director of Reply Events, and creator of BBC Micro.


    Linux User: Why reintroduce BBC Micro into schools when they aren''t old?

    Gordon Sinclair: By using the quirks of a thirty-year-old machine as a way into
    the imagination, we show the games and education that their grandchildren would
    have been playing, we tell them about the importance of the machine in shaping
    an industry and get them their hands dirty with simple programming.


    How are your teachers reacting to it?

    Ten years of teaching kids that computers


    are purely for office skills or the internet, the thought of actually programming
    the machine is a scary prospect. Many teachers understand their curriculum, so
    our 80s Classroom to fuse aims to make it fun and entertaining. Our hope is that
    we are able to get the teachers as excited about the subject as the kids.


    Do you remember the BBC Micro?

    Schoolchild in the 1980s, I witnessed first-hand the impact of computers in schools.
    While many kids had a Spectrum (like me), the BBC was for most just playing games,
    the BBC with its accessible language gave us to create something actually.


    Is it a case of using BBC Micros to introduce Linux? and the Pi for advanced needs,
    doesn''t it?


    Absolutely. Programming in BASIC is fun and a great introduction that shows how
    relatively small programs can get results, but it does need to translate into
    a usable skill. We expand on this by using a brand drag-and-drop language that
    gives results very quickly and makes it very easy to demonstrate. On the other
    hand it is a bona fide modern programming language that can be the start of a
    career in programming.


    What do you think of the BBC''s plan?

    In the modern world we would love to see a classroom machine that celebrates the
    brand and the iconic UI, the [current] approach is wise. We are all however, with
    smartphones and tablets it is much wiser to focus on getting a main channel TV
    show like 30 years ago, but I will be really interested to learn more about the
    BBC''s plans.


    8s Classroom is reintroducing children to computing in an entertaining way


