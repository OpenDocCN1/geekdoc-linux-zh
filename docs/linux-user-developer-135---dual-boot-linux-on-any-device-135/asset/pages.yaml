    # 01 Installing and running tshark


    In order to install tshark on a Debian 7 system, you just have to run the following
    command as root:


    ```

    # apt-get install tshark

    ```


    To find out if tshark is properly installed, as well as its version, you can execute
    the:


    ```

    $ tshark -v

    ```


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_44_0.png)


    # 02 Capturing network traffic


    Tshark can be used for capturing, but tcpdump is standard for traffic capturing.
    Apart from the capturing part where both tools are equal, tshark is more powerful
    than tcpdump if you want to learn more about it.


    The first command you should run is tshark -D to list the available networks.
    Then you can start the capture by running tshark without any parameters. You will
    get the output on which is easily understood, unless you are not helpful at:


