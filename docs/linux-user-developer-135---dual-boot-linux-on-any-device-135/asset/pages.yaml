  md: '# On the DVD


    Your disc


    # On the DVD


    Find out what lies in store for you on issue 135''s Linux User & Developer DVD...


    Welcome to the Linux User & Developer DVD, which accompanies 135 of the magazine.
    On this disc month we have four filler stories for you and one live-boot direct
    from the disc. You can try out the final release of Linux Mint 16, test-drive
    Cent OS 6.5 and see what you think of the latest PCLOS release,


    Finally, in celebration of our new Raspberry Pi section we''ve got the latest
    build of Raspian, our top choice for Raspberry Pi. To access them, you''ll have
    to put your disc into an optical drive and select drive from the boot menu during
    POST. There you can live-boot and get testing!


    # Distros


    We have three live-boot distros in Linux Mint, Cent OS 6.5 and LinuxOS. You''ll
    also find the image for Raspian two


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_95_0.png)


    # Directory


    Want to see what your favourite distro devs are doing? Link to the distros here


    # Tutorial Files


    If you want to follow some of our other tutorials, selected project files are
    available


    # Software


    20 of the latest and greatest software packages covering a variety of different
    functions


    # How to burn an ISO


    Want to try a new ISO? Here''s how to get started...


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_95_1.png)


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_95_2.png)


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_95_3.png)


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_95_4.png)


    STEP 1: Grab a new ISO

    Copy the ISO from our cover disc to your hard drive. Go to the Disc tab, click
    ISO and choose to save. Find an ISO online to download. If you''re not sure you
    need a 32-bit or 64-bit version, with going to the former to be safe.


    STEP 2: Open or install Brasero

    Brasero is the most popular open source burning utility. If it''s not already
    installed on your distro, locate it in your repository and install it. Then open
    the program and select ''Burn image'' from the Projects tab below.


    STEP 3: Burn your disc image

    On the Burning Setup menu, click the box ''click here'' to select a disc image
    - navigate to the ISO you just put on your hard disc. Once selected, ensure you''ve
    got a CD or DVD inserted and click ''Create Image''.'
