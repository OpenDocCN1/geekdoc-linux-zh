  md: '# Mageia 4 Beta 2


    User-friendly distro for all experience levels


    # REVIEW


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_80_0.png)


    # DISTRO


    # Mageia 4 Beta 2


    The fourth edition plans to make the distro even easier to use for newcomers and
    veterans alike


    **Although not expected until February, the next edition of Mageia is under development.**
    The last version of the distro was pretty much of what the team set out to do
    - this version fixes many of the biggest distro bugs. The next version of Mageia
    has great features ahead, adding new features or just generally improving the
    quality. One of the features that needs another update is the ability to configure
    the boot menu. After living for a while, Mageia has much better-looking installer
    now. As Mageia is going to be a user-friendly distro, some of the options could
    be presented a lot better for users. A new package manager added to Mageia in
    this version is a new welcome screen, providing a lot of information and the ability
    to perform system sets easily. The Mageia Control Center can now be opened by
    clicking a button directly. Afterward you can install software from some recommended
    entries such as VLC, Flash player and media codecs. Each package is labelled as
    free, tainted or non-free so that open-source advocates can know exactly what
    they''re installing.


    For now, everything else has received standard package updates and fixes. Cinnamon
    has been added to the repos, making yet another distro to the mix. The Mageia
    Control Center hasn''t been touched yet, as it''s already a pretty fantastic graphical
    tool for system users.


    However, there are still a few things to come in time for the final release. It
    still needs some work, and the atheist has yet to be added to the distro. As it
    is, though Mageia 4 should be another great release for users of all experience
    levels.


    # Summary


    Mageia is off to a great start, with some great features for users of all levels
    to take advantage of - so the distro is on the right track after even being rebranded
    into Mageia. Hopefully this will continue over the rest of the development cycle
    for 4, and well into 5.


    # Pros


    +   - Informative welcome screen

    - New package manager is a great new addition


    # Cons


    +   - Still work needs to be done on some of the features

    - The installer is still unstable and needs an overhaul


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_80_1.png)


    More information


    81 www.linuxux.co.uk'
