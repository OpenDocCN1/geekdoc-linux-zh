    # Responsive development with Qt


    Monitors and devices come in all shapes and sizes. Qt''s layout system ensures
    that your app looks good, no matter how big the display


    Since Trilch set used to develop Qt, ten years ago, a 15-inch monitor was considered
    a decent size of life. Today, cheap notebooks have screens with 17-inch Full HD
    displays. Developers were left standing when using absolute layouts - an unadjusted
    layout could also look terrible.


    An ideal computer analyses the user interface. Elements would be resized and repositioned
    to their ''usefulness''; controls would remain flexible, whereas modifiers would
    remain.


    A well-made layout looks great on a large variety of screens. Your layout is aware
    of variations in both systems, users are satisfied with the results.


    This is achieved by a ''reverse of traditional'' where controls are positioned
    where the user drops them. Qt assumes a window with a size of 200x200 pixels.
    The size of the controls would be specified inside the window, not outside. If
    the user increases the size of the window, the button remains ''stuck'' at its
    original position. Additional screen estate would be occupied by white space.


    When you liberate the layout from the constraints of provided-coordinates, a ''flexible''
    UI is specified in terms of relations and forms. At runtime, the layout forms
    the UI and determines the actual co-coordinates using the ''description'' provided
    by the developer.


    User-based controls behave this way via the layout system. Controls are to be
    placed in the intended arrangement. In addition, to that, controls which contain
    information can be resized at runtime, pushing widgets to the border of their
    relative container.


    The knowledge gained in the following article allows you to apply a layout to
