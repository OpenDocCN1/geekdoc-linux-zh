    # Valve Prepares for SteamOS,

    Steam Machine Launch


    SteamOS GNU/Linux 1.0 ''Alchemist'' now available


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_11_0.png)


    +   - The first commercial Steam Machine gaming systems were showcased at the
    Consumer Electronics Show 2014


    Gaming giant Valve had their long-awaited official unveiling of the first Steam
    Machine tonight, featuring gaming PCs that are designed for the living room and
    based on a Linux distribution the company calls SteamOS, at the Consumer Electronics
    Show (CES) 2014.


    G Newell has been in his support for the world of Linux in recent years, following
    increasing pressure from Microsoft Windows he perceives to be a more locked-down
    platform with little room for companies like Valve to play. "I think its kind
    of a catastrophe for everybody in the PC space," Newell framed to long-term investment
    fund Seat Ventures in 2012 - an opinion he doesn''t seem to have changed.


    Having previously accused of ignoring Linux as a platform when bringing the Steam
    client to Windows OS X, Valve corrected its oversight with the release of Steam
    for Linux in February 2013 and made much of a partnership with Canonical to customise
    its Ubuntu Linux operating system for gamers.


    Now, the fruits of labour are becoming apparent. The first official Steam Machine
    consoles have already been dispatched to testers in the closed beta, while SteamOS
    itself has been released for public download and test on existing hardware - and
    it brings with it more interesting details about


    While Valve had previously hinted that installing Ubuntu would be the Steam for
    Linux, the public-released SteamOS 1.0 ''Alchemist'' is actually a custom Linux
    distribution.


    The reason for the last-minute shift has been, with both Valve and Canonical remaining
    silent on the matter.


    The released SteamOS 1.0 image isn''t feature-complete, with specifically for
    the 300-limited-edition prototype based on beta tests in mid-December 2013, the
    software concentrates on the hardware is testing annually. As a result, early
    adopters will find binary-blob drivers for Nvidia graphics processors but no other
    manufacturer''s parts


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_11_1.png)


    +   - Valve''s SteamOS is now available for testing - I''ve got Nvidia graphics,
    at least


    For those who want to try the out, Valve mandates a system with at least 500GB
    of hard drive, a 32-bit boot option - 4 GB of RAM and Unified Extensible Firmware
    Interface (UEFI). The default installer ensures installing everything operating,
    although it remains difficult to configure for dual-boot-install.


    For more information and details about the Steam installer, visit the official
    website and store, at steamowered.com/steamsuildown.


    12.linuxuser.co


    * Niem'
