    # DEBATE


    # # Educate, inform and entertain


    David Cooks talks to Steve Furber, designer of the original BBC Micro, about how
    the BBC can learn from the past in their new push to programming to the masses...


    When the MP Elizabeth Truss recently reiterated her party''s desire for children
    aged 11 and over to learn in two languages, her comments were met with some scepticism.
    It has been the since she announced plans in July for children to be taught about
    the definition of algorithms and to be creating and debugging simple computer
    programs between the various subjects.


    Yet that is missing the point entirely, it perhaps be said, with a great degree
    of accuracy, that Truss has very little knowledge of the inner workings of a computer
    and is familiar with a far greater extent than Python, C+ and the myriad other
    languages out there. Never mind children to learn at least one text-based language
    and the learning of data structures such as lists, tables or arrays, it may well
    be that some MPs would have the faintest idea what is


    One of the accusations ever levelled at Truss, the Conservative party''s lack
    of responsibility for education and childcare, was she would, most likely, be
    unable to code herself. ''Do as I say, not as it seems to be the mantra among
    many defectors of what would be a revolutionary approach to the teaching of computing''


    If this is the case, however, then it is because Truss and her ilk have failed.
    Years of poor quality IT and an emphasis on using software rather than creating
    it has dealt many children a bad hand. If Truss and other


    Steve Furber, designer of the BBC Micro says MPs who are insistent on promoting
    coding in children who cannot program themselves, then it is not their fault.
    You really can, in this instance, blame it on the system. In attempting to prevent
    future children from the same fate, though, their commendable efforts should be
    applauded.'
