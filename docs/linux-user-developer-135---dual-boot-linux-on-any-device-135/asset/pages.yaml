    # ## Use an accelerometer with Raspberry Pi


    Russell Barnes is the editor of Linux User Magazine and a keen Python programmer
    and Raspberry PiThacker


    Adding tilt technology to your next Raspberry Pi project is easier than you think


    # ## Skills to learn


    +   ### 1 I2C It''s very useful and convenient form of device connectivity and
    us add-ons.


    +   ### 2 Pygame The core mechanics of Pygame are straightforward and make programs
    very easy to prototype.


    # ## Components list


    How to get prototyping…


