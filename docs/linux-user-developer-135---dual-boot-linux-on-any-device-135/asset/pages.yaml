    to a new job, he could not use Ethereal as much as he wanted. Wireshark is the
    result!


    This tutorial will present you tshark, the command line version of Wireshark,
    which is very popular and capable network protocol tool. The main disadvantage
    of it is that it does not have a GUI.


    You can get tshark from its website - by compiling its source code - directly
    from your Linux distribution. The second way is quicker and simpler.


    If you try to run tshark as a normal user, you may not be able to use any network
    interfaces for capturing network traffic due to UNIX permissions. Your advisor
    finds it to run tshark as root (sudo tshark) when capturing data and as a normal
    user


