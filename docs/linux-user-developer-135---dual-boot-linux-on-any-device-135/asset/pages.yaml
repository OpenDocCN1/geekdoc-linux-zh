  md: "# # Use an accelerometer with Raspberry Pi\n\nStep 02\n\n# ## We'll be using\
    \ an ADXL345 accelerometer to create a controller for the Space Invaders-style\
    \ game\n\n![](img/9ee62baa445dcfe9b284d0d92f95c0bb_64_0.png)\n\n# Full code listing\n\
    \n```\nimport pygame\nfrom adxl345 import ADXL345\n\nadxl345 = ADXL345() # Initialise\
    \ the accelerometer\npygame.init() # Initialize Pygame\n\n# Create a screen of\
    \ 800x600 resolution\nscreen = pygame.display.set_mode([800, 600])\n\n# Give the\
    \ window name\npygame.display.set_caption(\"ADXL345 Space - Esc to quit\")\npygame.mouse.set_visible(False)\n\
    clock = pygame.time.Clock(60)\n\n# Load the images we are using:\n# http://opengame.org/assets/minigisu\n\
    background = pygame.image.load(\"background-4.jpg\").convert()\nplayer_image =\
    \ pygame.image.load(\"ship.png\").convert()\n\n# We can use colkey to remove the\
    \ background from the\nplayer_image.set_colorkey((0, 0, 0))\n```\n\nThe ADXL345\
    \ accelerometer requires four cables—two for power and ground and two for I2C\
    \ communication with the Raspberry\n\n# 04 Cloning and testing\n\nFrom the terminal,\
    \ navigate to your home folder (with ~) and create a project folder for the project\
    \ to live in using: `mkdir adxl345_project`. Go into the folder and `clone` the\
    \ finished project from your GitHub commit: `git clone https://github.com/rubssh/adxl345.project`\n\
    \n```\ndef update_pos():\n    # Check the accelerometer and update position based\
    \ on readings\n    data = adxl345.get() # Returns a tuple of axes\n    if data['x']\
