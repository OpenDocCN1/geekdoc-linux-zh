  md: '# # Disc introduction


    Welcome to the all-new Linux User & Developer DVD


    # ON THE DVD


    # # Editor''s picks


    **Raspian** There''s a reason we use Raspian in all our tutorials and guides,
    the de facto, dependable and offers the best performance of all the current offerings.


    **Linux Mint 16** it''s no secret that we''re massive fans of Mint. Aside from
    the incredible community and generous-project leadership, Mint is fast, stable
    and much more user-friendly than the alternatives. There''s only one contender
    for the crown at the moment and that''s elementary OS.


    **OwnCloud** Create your own very cloud with our tutorial this month using the
    powerful and versatile "software on a server" solution, ownCloud. It''s easy to
    get started...


    # # Complete index


    **Raspian** The Raspberry Pi distro that the Raspberry Pi Foundation recommends,
    and the one we use the most in our tutorials. Get the latest version of your Pi
    follow along with the Raspberry Pi mini-mag that started this month


    **Linux Mint 16** Ubuntu 13.10 was a bit of a lackluster release, Linux Mint is
    as important as Community brings a new GNOME base for the first time. From its
    symbolic approach, it''s still a great distro


    **PCLinux 2013.2** The latest version of the rolling PCLinux comes with MATE,
    a more recent addition to the desktop line-up. PCLinux has great compatibility,
    and an excellent offering


    **CentOS 6.5** The Community version of Red Hat Enterprise Linux is a stable distro
    for enterprise or for the home setups that require something a bit more solid


