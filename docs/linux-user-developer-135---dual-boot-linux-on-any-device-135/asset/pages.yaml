  md: "# Raspberry Pi music server\n\nMusic Daemon (MPD) is a piece of software that\
    \ acts as both a music player and a music server. It can output audio to any sound\
    \ connected to the system, and be controlled by any MPD client. Clients are available\
    \ for almost any platform, including iOS and Android. Android can also output\
    \ audio to a stream, which can be used by multiple clients. This is ideal for\
    \ people with large music libraries that can't fit on it.\n\n# Step 04\n\n# Settings\n\
    \n# Streaming\n\n# Single mode\n\n# Consume mode\n\n![](img/9ee62baa445dcfe9b284d0d92f95c0bb_62_0.png)\n\
    \n+   01 Install the required software\nLog in the raspberry system using the\
    \ username and raspberry password. First find the IP address of your device and\
    \ note it down. Get the latest packages using the command `apt-get update`. Then\
    \ install MPD using `sudo apt install mpd`. There may be some errors, but they\
    \ are fine to ignore.\n\n# Step 06\n\n![](img/9ee62baa445dcfe9b284d0d92f95c0bb_62_1.png)\n\
    \n+   02 Add music\nThe default music directory for mpd is `/var/lib/mpd`. You\
    \ will want to make this folder writable and executable so that the mpd user can\
    \ write to it. To do this use the command `sudo chmod 777 /var/lib/mpd`. Then\
    \ you might find some music to copy from your Linux computer and use scp to copy\
    \ it: `scp -r /path/to/music/* pi@ip_address:/var/lib/mpd/`\n\nAbove stream music\
    \ to your mobile device using a compatible client\n\n# 05 Configure stream\n\n\
    At the moment, the only output is 3.5 mm on the Pi. To set it to HDMI, you have\
    \ to find the hdmi output that is commented out. Uncomment it, and change the\
    \ format format to `flac`. Our music format is as follows:\n\n```\naudio_output\
    \ = {\n  type = \"http\"\n  encoder = \"vorbis\"\n  port = \"8000\"\n  quality\
    \ = \"5\"\n  format = \"44100:2\"\n}\n```\n\nSave the changes and restart mpd.\n\
    \n# 07 Connect to the server\n\nOnce in the MPD app, use WLAN-based connection\
    \ to access your server. Then fill in the 'Streaming' field with the IP address\
    \ of your Pi and in the 'Host' field with the default. The default is nothing,\
    \ so go to the Raspberry Pi. We need to connect to the music library, as it has\
    \ not been connected yet. To do this go to Settings, select the option, and click\
    \ 'Refresh MPD'.\n\n# 08 playing music\n\nPress the 'tree' button in the bottom\
    \ bar to go to the Artists section and the music library. Play from artist, long-press\
    \ the artist and select, Add to play. If you have your favorites connected to\
    \ the library, you will hear music coming out of them. Use the volume slider on\
    \ the MPD player to adjust the volume. To\n\n# 09 Set up a client\n\nIt's difficult\
    \ to work setting up a client on each device but the process is terribly easy.\
    \ For example, we suggest Sonora, for Android we suggest MPDroid, and for iOS\
    \ we suggest MPD. To set up MPDroid on Android go download and that from Play\
    \ Store.\n\n+   04 Configure the daemon\n\nTo edit /etc/mpd/mpd.conf (using nano)\
    \ make changes to let the daemon listen on all interfaces, so we can use MPD clients\
    \ from other devices. To do this by changing the line:\n\n```\nbind_to_address\
    \ = \"localhost\"\nbind_to_address = \"any\"\n```\n\n# Further improvements\n\n\
    This article has a very simple MPD setup. Possible improvements include:\n\n+\
    \   - Putting music on an external hard drive so you have more space\n- Tweaking\
    \ the settings to to the Pi's CPU plus less (look at the 'encoder plugins' section\
    \ of the user manual at ...)\n- Setting up a Samba server, to give access to the\
    \ music library over the network.\n\n# Music Player Daemon can connect to the\
    \ system, and create a client – from almost\n\n63 | linux.co.uk"
