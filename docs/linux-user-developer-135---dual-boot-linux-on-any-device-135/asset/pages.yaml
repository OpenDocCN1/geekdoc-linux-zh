  md: '# Dual-boot Linux on any device

    How to run two operating systems on any machine


    # FEATURE


    # Add or just restore Windows to Linux


    # Add Windows to a system that didn''t always need it


    In some ways, it''s currently a little easier to add Windows to a system already
    running Linux than it is not the other around. Boot loaders invoke any kernel
    privileges, giving you freedom the hardware, which in this case means installing
    Windows. The main issue arising from this is that Windows will overwrite the Master
    Record, meaning you won''t be able to boot into Linux right after the installation.
    We''ll cover a quick way to recover your GRUB bootloader after installation, but
    for a more in-depth guide, look towards the end of this tutorial.


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_28_0.png)


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_28_1.png)


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_28_2.png)


    # 01 Make space


    We advise allowing Windows to have as much space as possible, as it can fill up
    a lot quicker than Linux. Microsoft recommends a minimum of 20GB, however that''s
    far too if you plan to use Windows regularly. 100GB, if you can spare, it should
    be more than,


    # 03 Choose wisely


    The Linux partitions will be labelled as unknown by the Windows installer; however,
    it will recognise the free space on the hard drive. Select the space and click
    Next to continue with the lengthy Windows install process.


    # 02 Install Windows


    Insert the Windows installation disc and reboot your system. Select ''Boot from
    disc'' from the boot menu and then go through the basic setup and licence agreement.
    Select Advanced when it asks you how you want to install.


    # 04 Live booting


    We''ll need to recover GRUB now that we can boot into both Linux and Windows.
    Use an Ubuntu live disc or your original distro''s drive if it has one or both.
    Check if you need to install GRUB to the live environment, specifically the grub-pccfg
    package.


    # 05 Restoring GRUB


    Once you''ve checked if GRUB is installed, we need to restore it. Mount, then
    use the command:


    ```

    $ grub-install --root-directory=[mount] /dev/sda

    ```


    ...where X is the boot drive, more likely sda in a case with hard drive. Reboot
    and log into your Linux distribution and finish off:

    $ update-grub


