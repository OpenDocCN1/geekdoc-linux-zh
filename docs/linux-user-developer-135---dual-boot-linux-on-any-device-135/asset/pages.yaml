  md: '# Instant messaging clients


    Find the best way to keep in touch with friends across all chat services


    REVIEW


    # KDE Telepathy


    The KDE-bound instant messaging client has a huge amount going on


    # Pidgin


    Once an IM king, it has still tricks its own sleeve and an active community


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_72_0.png)


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_72_1.png)


    +   Account management in Telepathy is handled by the core services in mind, but
    will also check the local network


    +   Pidgin is highly configurable depending on your work flow or how much real
    estate you have to work with


    # Compatibility


    Telepathy offers the wide variety of different services to connect to, insisting
    that you have at least some before getting the main interface. Few popular defaults
    are offered to start with, but deeper digging allows you to access 30 different
    services used by people all over the world.


    # Compatibility


    With great selection of chat services to start with, Pidgin can connect to over
    20 different services, and anything else supports XMPP. More plugins are also
    available for the more major proprietary services, while others are not always
    compatible. In this case, Pidgin uses its own service, which can be a little slick.


    # Add-support


    Unfortunately, there''s not a huge amount of third-party plug-support in Telepathy
    - it isn''t really support anything than first-party service plugins. Some don''t
    work on every desktop, such as notifications, pop-ups, it''s a bit of a shame
    that there''s no addition on community Telepathy to get these features working.


    # Add-support


    Due to its popularity, there are plenty of plug-ins and add-ons for a wide variety
    of different functions, to add extra services, SMS messages or create toast-ups
    for new chat conversations. Plugins are written in C, and the Pidgin Wiki has
    plenty of information on how to create what you want.


    # Interface


    Like all KDE applications, Telepathy has a user-friendly interface that fits into
    the KDE aesthetic. The main windows are incredibly simple, showing the minimal
    features you need to chat - with what others demands. The Settings menu on the
    other is much more elaborate, offers far more functions compared to the others.


    # Interface


    Pidgin seems laid out, with the contacts making the majority of the main window,
    and plenty of options without dealing through lots of menus. Major parts of the
    overall aesthetic are nice, as well as the way contacts are listed and system
    or account-wide fonts and plugins.


    # Account management


    The account applications are a bit inconsistent - in some ways it''s very easy
    to create and manage your accounts. In other ways, it always offers the full range
    of features for the individual services, or prompts for any extra information
    you might need for something like two-step verification from Google.


    # Account management


    Advanced allows allows the potential to set up different services through specific
    services, with context-sensitive menus for each. You can easily disable or remove
    any accounts, or edit them if any extra feature requires information in order
    for the service to work properly.


    # Overall


    KDE is a nice, simple IM client - however, it might be a bit too simple. Not supporting
    notifications on KDE based desktops (GTK-based), especially if you are able to
    fully customise your account details.


    # Overall


    Pidgin is a very solid all-around client, although of its design elements have
    been with it for years. A newer version of the software might have made the best
    again, but for now it''s still good, it remains one of the best instant messaging
    clients.


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_72_2.png)


    73 www.linuxco.uk'
