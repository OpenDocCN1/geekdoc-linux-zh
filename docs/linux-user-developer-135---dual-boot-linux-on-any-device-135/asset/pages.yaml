    # ## Instant messaging clients


    Find out the best way to get in touch with colleagues and friends across all chat
    services


    ### Empathy

    GOME instant messaging client is popular among distros that use a GNOME or Gnome-based
    desktop. It has great integration with GNOME, and allows use of multiple accounts
    and include voice and video support. It''s currently the default client in Ubuntu
    and Fedora.


    ### emesene

    Initially designed to ease Windows users to chat on Linux, mene evolved from just
    MSN/Windows Live Messenger supporting a wide range of services but has currently
    slowed since the MSN servers went offline, however it can still be used.


    ### KDE Telepathy

    The successor to the venerable Kopete, KDE Telepathy is the new KDE IM client.
    It is based on Telepathy, a framework, and is still in the works for KDE-based
    desktops. It supports VoIP along with the usual text applications as well.


    ### Pidgin

    Cross-platform and highly customizable, Pidgin was once the best instant messaging
    client around. Development seems to have slowed considerably on it for Linux,
    but every day and now for the software. New features are slowly making their way
    in, however.


