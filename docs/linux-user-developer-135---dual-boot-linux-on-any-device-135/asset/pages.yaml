    # 03 Two command-line filters


    The most used filter is -w followed by a filename. If you want to save data to
    a file for later processing:


    The following tshark command captures 500 packets and saves them into a file-named
    ''test.pcap''


    ```

    $ tshark -c 500 -w test.pcap

    ```


    Another useful filter is -r followed by a filename, which allows you to read and
    analyze a previously captured file.


