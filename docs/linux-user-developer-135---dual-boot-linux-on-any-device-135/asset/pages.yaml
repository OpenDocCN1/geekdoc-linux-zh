    # 3D full-body scanner


    We talk to Richard Garsthagen about why he needs 40 Raspberry Pi to take a picture
    of you


    +   * How did you get started these practical projects and working with the Raspberry
    Pi?

    * "In the last five to ten years I began working with 3D printers and CNC machines.
    I started to build stuff, as furniture and gadgets, and my first project was the
    Raspberry Pi Box. It''s a mini-PC and is a box you put on the wall with nothing
    inside. If you press the button, it takes three seconds to boot up. I shared it
    on Facebook and however the box belongs to. So, if you hang it up, you can see
    your hair all nicely. It works really specifically to attract visitors, we''ve
    had one of those in my home for a year now, and my son has been using it to post
    to Facebook on his own for the past year."


    That was my first Pi camera project, and I really fell in love with the camera
    as it is easy to use and very low cost. That gave me the idea that if one was
    so cheap, I could scale up to 40 at least.


    +   * What gave you the idea to create the 3D Raspberry Pi Box?

    * "I have to say that I have a lot of life and challenges I''d like to give to
    kids to run around. My youngest kid is two, and there are lots of methods out
    to do this, but they (require) you to sit still, and my two-year-old does not
    sit still, so I can tell them to print my youngest son."


    use-100 cameras, costing about $1,500 plus all the other gear, I could buy a house
    for that!!


    What made you decide to use the Pi Camera over standard digital cameras?


    +   * Surely wouldn''t it be much cheaper if they were built together?

    * "I was researching, that a high-quality camera could be cheap, with an angle
    at $50 or less. If it was cheap, I could automatically make them up to synchronize
    them, but then I would have only one camera for all the projects I was making."


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_60_1.png)


    Richard Garsthagen is an entrepreneur and author who''s very interested in coding.
    He is famous for projects almost six years now.


    One thing I liked about the Raspberry Pi was that I could easily set up settings
    like a normal camera. The Pi could upload, fully automatically, the image and
    handle the process completely automated. It hit the button and all the cameras
    take image, and then sends a copy to a file server where I can either render it
    locally or send it to Autodesk''s cloud software to turn it into a 3D model.


    +   * If you want to learn more about the Raspberry Pi Box project and its implementation
    it can be found at www.raspberrypi.com


