    significant changes to the chassis


    To help our toy car come to life using the latest technology and our card-sized
    computer, we''re going to make some significant changes to its works.

    Identify and remove old radio by efficiently replacing the car''s normal transmitter
    and receiver. Notice the three sockets on the receiver: one to the motor controller
    and one to the steering servo. Since remote-control cars also have separate battery
    for the electronics, but these (especially with an electronic speed controller)
