    by default, includes most important ones | 9 | Pidgin can access all major and
    minor services through its built-in or additional plugins | 10 |

    | Add-on support | It has the Pidgin plug-in, but there are problems with them
    not working properly | 5 | There are some decent add-ons for this place, but nothing
