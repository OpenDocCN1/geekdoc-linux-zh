    ## 新闻

    Linux 社区最新动态

    开源


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_6_0.png)


    - David Braben 认为树莓派（Raspberry Pi）领域的任何进展都是好事。


    | 为什么 BBC 不想分得树莓派的一羹？ |

    |--- |

    | Linux 用户：与树莓派的创造者 Eben Upton 和 David Braben 交流。 |

    | Linux 用户：David，你曾在 80 年代为 BBC Micro 创建了 Elite 系统。你对 BBC 现在的计划怎么看？ |

    | David Braben：任何在这个领域内活动的人都是好事。 |

    | 但 BBC 禁用树莓派这是怎么回事呢？BBC 在过去多年里一直支持树莓派，但讨论并没有取得太大进展。这并不是因为他们讨厌它。 |

    | Eben Upton：在到 2011 年 5 月的两年里，我们多次接触 BBC，想法是希望允许我们使用 BBC 品牌，实际上让树莓派变成一台新的 Micro。所以，我们是因为
    BBC 有这项计划才想要树莓派的吗？据我理解，BBC 能够在工业界声明并创造计算机，但这个产品对我们来说非常沮丧，你完全可以看到。我建议这项新计划是风险中立的，这是一件好事。
    |


    Eben Upton 认为 BBC 还有开展一项更广泛的倡议的空间。


    ## 优势在于我们拥有巨大的国内和国际影响力


    Eben Upton


    ### BBC Micro


    对于那些记得计算机早期阶段的人来说，那时的理念应该是应该教孩子们编写代码。BBC 为系列计算机命名，其中最著名的是 BBC Micro。


    这是一次成功，它将计算机引入了英国各地的学校。它成功地帮助了许多有天赋的孩子进入了创意和计算的世界——但后来出现了一些问题。


    “我发起了一个学生计算协会，想法是我们希望摆脱仅仅是使用技术，转而掌握创造主权。”这个项目遭到了 BBC 的热烈。


    随着计算机开始变得强大得多，是时候从我们正在制作的东西着手了。由于一种危机感——即接触编程的孩子太少——BBC 正在回到它曾扮演过如此重要作用的领域。


    随后，这获得了一份由行业赞助的 Nesta 报告。还有 Livingstone-Hope 报告，该报告认为英国未能达到 BBC Micro 的传承。


    Tony Hall 计划在明年明年推行的倡议中，将编码引入英国的每个家庭和学校。他说：“我们希望激励新一代在编码、编程和数字技术方面发挥创意。”


    他欢迎一个比编码甚至更好的结论：“我将把机器人、树莓派以及所有其他让人们接触技术的小事儿都包含在内。”


    剩下的就是确切制定我们想要扮演的角色。这些计划仍在定稿中；只有 BBC 清楚。


    但你认为树莓派可能是该倡议中不可或缺的一部分吗？


    我认为 BBC 有空间开展一项涵盖性的倡议，该倡议将在树莓派上运行，并足够强大，足以认为在树莓派上产生的内容（不限于教育应用或编程环境）表明他们具有巨大的潜力，这将引发“用户”圈之外（具有天赋天赋的孩子，或父母/老师具有工程背景的孩子）的编码热潮。


    www.linuxuxer.co.uk


    # 开源你的 Linux 新闻与观点来源


    www.linuxuxer.co.uk 直接向我们发送邮件……获取最新新闻和观点 linuxuxer@imagine-publishing.co.uk


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_7_0.png)


    > BBC 凭借其几乎是 BASIC 的语言，给了我们创造的机会。


    Gordon Sinclair 说，现在是 BBC 再次介入的时机，“当鼓励更多人参与技术创意基础的运动已经很远时，且 BBC 通过扮演角色给予了帮助时。”


    然而，但他不太确定是否能像当年 BBC 那样在世界上产生变革性的影响，这种方式已经不同了，他说。“当我们开始时，当持续的状态和日子仍在变化时，产生巨大影响的可能性大得多——它们不是在变革，而是在进化。”他意识到它无法产生同样的变革性影响。


    将更广泛的公众提升到这种水平（Reith 爵建立 BBC 时，用三个词总结了其宗旨：教育、信息、娱乐）。


    它希望有一个松散的策略，希望在未来几个月内与政府、教师和技术公司合作。。但负责具体工作的人是 Stephen Upton，他是曼彻斯特大学的计算教授，在该领域非常出色——我们去过那里。


    剩下的就是确切制定我们想要扮演的角色。这些计划仍在定稿中；只有 BBC 清楚。


    ## 重新引入 BBC Micro


    Eben Upton


