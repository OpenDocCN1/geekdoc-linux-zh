    ## Dual-boot Linux on any device


    ## Dual-booting USB storage


    Create a portable, dual-booting stick or hard drive for recovery, sysadmin or
    anything you want.


    Carrying around a live USB or custom live-booting USB storage device can be advantageous
    if you regularly need to do system maintenance or don''t know what computer you
    will work at. Just one might suffice for some cases, but as we''ve mentioned previously,
    there are many reasons you might be in need of two at a time. Having a drive or
    large USB stick can offer a lot more than an Ubuntu live USB, and it''s not too
    different from setting up a dual-booting system from scratch.


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_29_0.png)


    ## Create swap


    Make sure you saved anything important on the external drive before we go any
    further. The first thing you''ll need is to format it and then create the swap
    partition - make it 8GB in size so that you can make the most out of your powerful
    system. Put it towards the end of the hard drive.


    ## First roots


    Now create the 15GB partition you''ll want for your first installation and set
    it to be root by selecting it in the menu. In the same way as we did for the swap
    partition created when booting into root and other distro, carry on with the installation
    instructions as before.


    ## GRUB reinstall


    Boot into the new distro (or Ubuntu''s) live environment and make a note of what
    you did.


    ```

    $ sudo mount /dev/sdX /mnt

    And then install GRUB from the terminal with:

    $ sudo grub-install --root-directory=/mnt/ /dev/sdX

    ```


