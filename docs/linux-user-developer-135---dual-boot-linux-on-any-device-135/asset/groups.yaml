    ## 信任的界限

    在线服务可能承担传统上由桌面软件完成的工作 —— Simon 奇好奇如何知道它们是安全的……


    我突然意识到，越来越多的人，特别是那些处理安全问题时比以前更匆忙的人。我们大多数人不会在贴在屏幕的便利贴上写密码，我们不会把密码管理器留为默认值。我们过去的方式显示了陷阱，在
    Mac 和 OS 平台之间运行的密码套密码留了一堆乱子。我真的很喜欢那些这样做的人。当他们仅用非常简短的软件、一点魅力和一些前所未闻的胡语来表达感激之情时，这特别令人触动。艾滋时代来了。


    知识共享 / 署名-相同方式共享 4.0 国际许可


    ## 序言


    ## 共享版权 (Copyleft)

    这是 Alan Vaughan 在 1989 年提出的共享版权核心概念，这套策略组合是为那些想要夺回每个软件用户自由的人而写的，它诞生于善良、恐惧和理解。我们应该将其看作自由软件的一部分。Julia
    Harmony 的共享版权哲学是 GPL 的副本。这是 Richard 给 Richard Walden 的。


    Simon Bray 是一位技术作家和编辑，跨 Mac 和 OS 平台工作。


    我当时被一个 TIFF 文件困住了，它需要转换为某种可读的格式，而不是在五分钟内变成 JPEG。我的其中一个朋友正在跨软件工作，正处于恐慌中，陷入了混乱的共享版权代码的螺旋，以及严重的压力中。在两分钟内，得益于一个免费开源脚本，任务完成了。


    然后是：这张我必须匆忙转换的图片，时钟在滴答作响。俗话说，这就够了。我必须知道我在和谁打交道，对方是谁。他们声称拥有此内容的版权吗？是否有我接受了一切条款或条件？最终，时间到了回答这些问题的时候，幸运的是得到了一些满意的答案。


    这是一个 GPL v3 链接器的副本，分享给了 Walden 的 Richard。


    当然，这不是什么新发展，因为日益复杂的工具正在接管桌面软件领域。在某种程度上，它让我想起了旧的 PC 预算软件，它们处理办公软件可以轻松胜任的工作，然后以廉廉的价格卖掉。


    要理解软件以确定你在信任与恐惧之网中处于什么位置已经足够困难了，而且当你把关键工作托付给它们时，通常还会引入额外层次的问题。


    第三方的独立开发。许可中的“虚拟”元素（许多人对此表示反对）使得许可更有可能利用所有贡献者和我们共享的项目成果。


    GPL 的创建初衷并不是鼓励商业参与到被广泛认为的观点中——即开源分布式软件开发模型能产生更好的软件，它与商业的有益关系是许可的一个偶然侧面。


    对某些人来说，便利性并不是慰藉，但所提供的工具是。在我的特殊情况下，我仍然感激，那个让我免于在此处过度透支的工具 —— 这是我第一次在这方面可能犯了这样的错误。


