    # ## Solving a DHCP problem


    The problem: computers on network could not connect to the network although other
    computers were. We used the DHCP protocol to fix their network settings. The DHCP
    server was 10.0.0.10.


    DHCP is a dynamic protocol that provides configuration information to hosts on
    TCP/IP networks. DHCP is used at BOOT (the Bootstrap Protocol) to configure network
    settings. All DHCP protocols operate over UDP using UDP ports 67 and 68.


    # ## More about the DHCP protocol


    The first packet of a usual DHCP client and a DHCP server is a DISCOVER message
    from the client to the DHCP server. Since the client does not have an IP address,
    it sets the source IP to 0.0.0.0 and the destination IP to 255.255.255.255.


    What distinguishes the network card of another network device in the same LAN
    is its MAC address, which is unique. The DHCPDISCOVER message should include the
    MAC address of the device requesting a DHCP service.


    The next message is the OFFER from the DHCP server (IP 192.168.1.1) and is a broadcast
    to the client. It has no IP address. Then the client sends a DHCP REQUEST with
    configuration parameters. The server sends a DHCPACK message back to the client
    message that contains all the configuration parameters. Now, on, the DHCP client
    uses


