    有了联系人和日历支持，你可能会尝试从这里开始，那为什么没有邮件支持呢？幸运的是，由于支持插件，ownCloud 提供了灵活性。打开你的 Web 邮件客户端提供程序添加外部插件，将你的邮箱连接到
