    ## Mageia 4 Beta 2


    第四版计划让新手和老手都觉得该发行版更易于使用


    **虽然预计到 2 月才会发布，但 Mageia 的下一个版本正在开发中。** 该发行版的最后一个版本几乎完成了团队最初的目标——这个版本修复了许多最大的发行版错误。Mageia
    的下一个版本有很多许多出色的特性，包括增加新功能或通俗地提高质量。一个需要再次更新的功能之一是配置启动菜单的能力。在运行一段时间后，Mageia 的安装程序现在看起来好多了。由于
    Mageia 将成为一个用户友型的发行版，某些选项可以以更好的方式呈现给用户。此版本在 Mageia 中添加的新包管理器包含一个新的欢迎界面，提供了大量信息并能够轻松执行系统设置。Mageia
    控制中心现在可以直接点击按钮打开。之后，你可以从 VLC、Flash 播放器和媒体解码器等推荐条目安装软件。每个包都被标记为免费（free）、污染（tainted）或非免费（non-free），以便开源倡导者能够确切知道自己正在安装什么。


    目前，其他所有内容都收到了标准的包更新和修复。Cinnamon 已被添加到存储库，使其又增加了一个发行版。Mageia 控制中心尚未触动，因为它对于系统用户来说已经是一个非常棒的图形化工具。


    然而，在最终发布之前仍然还有几件事要做。它仍然需要一些工作，且尚未添加到发行版中。尽管如此，Mageia 4 对于所有经验水平的用户来说，应该是另一个出色的发布。


    # 总结


    Mageia 有了一个很好的开端，为所有水平的用户提供了一些出色的特性——因此，在更名为 Mageia 后，该发行版仍处于正确的道路上。希望这将在 4 的剩余开发周期内持续，并一直持续到
    5。


    # 优点


    - 信息丰富的欢迎界面

    - 新包管理器是一个极好的新补充


    # 缺点


    - 某些功能仍需进一步工作

    - 安装程序仍然不稳定，需要重构


