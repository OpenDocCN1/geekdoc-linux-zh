    伦敦的科技城（Tech City）计划已加入政府“卓越人才计划”（Exceptional Talent programme）下符合资助资格的机构名单，与英国学院和皇家工程学院并列。


    卓越资助允许合作伙伴对外国公民进行担保，使其拥有英国积分制移民计划下申请工作签证所需的特定技能。


    目前尚未说明将发放多少此类签证，预计大约在 100 个左右。


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_13_1.png)


    > DWP 将为新的通用信贷系统使用开源软件


    # 隐私


    ## 科技巨头加入监控联盟寻求


    科技行业的一些大名字已加入并要求对全球进行监控以改变现状，在 NSA 承包商爱德华·斯诺登提出要求后，他们面临着严厉的批评。


    对用户数据的需求；对信息自由流动的尊重是互联网的核心；以及创建一个防止跨管辖区和政府间冲突的框架。


    Google、LinkedIn、Twitter 和 Yahoo 刚刚发表了声明，内容如下：“签署公司相信，是时候让各国建立明确的实践来监管对个人及其信息的监控了。”


    “用户的数据安全至关重要，我们为了改进隐私并为请求要求的透明度而进行斗争，”该“联盟”的 Larry Page 声称，“这是由于全球许多政府在没有独立监督的情况下秘密收集数据而导致的。现在是进行改革的时候了，我们需要政府带头。”


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_13_2.png)


    该联盟拥有五个核心原则，将推动政府收集互联网用户信息的权限限制；对请求或收集信息的机构进行监督和问责；在透明度方面...


    随着世界各地的科技公司（尤其是上述公司）面临日益严格的审查，并被指控与政府机构合作非法收集数据，该联盟应运而生。


    - Google 的 Larry Page 坚持认为，面对斯诺登泄密事件，需要进行改革


