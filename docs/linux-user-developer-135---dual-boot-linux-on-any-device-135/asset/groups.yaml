    - 三个按钮已成为布局的一部分。


    大多数框架在元素动态调整大小方面采用类似的方法。我们开发时将其视为“响应式 Web”，但往往倾向于使用相同的流程和概述概述。


    在你意识到静态布局无法调整表单的变化后，关闭应用程序。切换到 WYSIWYG（所见即所得）编辑器并查看表单旁的图标。


    ## 1. 第一个布局


    现在是时候开始应用这种技术了。第一个示例将包含一组相互排列的按钮。然后我们将其扩展到包含一组以较复杂方式排列的其他控件。


    表单布局的外观像是一条上方三条水平线。在树中选择表单并点击 + 按钮向表单添加水平布局。


    从开始布局 Qt Creator。本教程基于 Qt 2.8，示例基于 Qt 5.1。旧版本的环境行为也类似——“布局系统”没有改变。


    改变表单的大小不会影响此点——按钮将随着窗口大小的变化而调整大小。这就是布局的工作原理。


    布局通常位于表单中，双击 minwidth 以进行布局。关注包含你控件的屏幕左侧。将几个控件拖入表单并放置在合适的位置。然后通过拖动边框运行 MainWindow
    的调整大小。按钮的位置将保持不变。


    这确保了复杂的表单将实时创建。在过去的十年里，作者经历过由于布局过于复杂导致的简单延迟案例。


    创建新布局很容易；例如，通过拖入来添加一个文本控件。Qt Creator 会在表单中显示一条蓝线。这通知你控件将位于布局中，并提供其位置指示。请记住，你不应该影响元素布局的任何元素——这通过以后讨论的更多手段来实现。


    ## 更多布局


    忘记添加表单布局显示了布局系统最糟糕的一面。遗憾的是，大多数表单都有多个布局——排列一组按钮布局仅需一个水平或垂直布局即可完成。


    Qt 允许嵌套布局。布局内部包含另一个布局。现代系统的高性能确保了复杂表单将实时创建。


    - 三个按钮将位于中间。


    由于编辑器的内部限制，在布局存在时无法修改大小。可以通过点击表单选择来剥离其布局的尺寸智能，从而修复此问题。当这样做时，布局将显示小方块，然后变为可以将它们添加到内部布局中。


    www.linuxuxer.com


    完成后，三个控件将显示在红色矩形内。布局可以整体移动：通过在控件部分周围拖动“选择矩形”，选择布局是同样简单的。移动将沿箭头锁限制。


    在最后一步，不要忘记重新启用布局。如果这样做，生成的表单将由一个大型可扩展的文本框和三个粘在屏幕底部的纤细按钮组成。


    ## 关于可能性的问题


    查看示例中的文本和按钮可能会令人困惑。Qt 框架从额外的高度中获益，而其他一些则不然。这在运行时用于为文本增加灵活性，而按钮保持较小。


    每个控件都有一个水平和垂直方向的 `sizePolicy` 属性。通过相应设置控件及其属性，Qt 可以支持我们想要的尺寸，如图 1 所示。


    然而，这并不是适应不同尺寸的唯一方法；可以使用水平和垂直拉伸（Horizontal and Vertical Stretch）属性进行配置。默认情况下，它们设置为
    0——所以控件会“缩小”。


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_49_0.png)


    > 图 1


    | SizePolicy | 描述 |

    |---|---|

    | Fixed | 此控件无法缩小或增长 |

    | Minimum | 此控件在理论上可以增长，但不能超过足够范围 |

    | Maximum | 此控件可以缩小尺寸但不能更好地增长——它可以 |

    | Preferred | 此控件可以尽可能增长，但有限制 |

    | Expanding | 此控件可以根据需要缩小和增长 |

    | MinimumExpanding | 此控件可以增长，但除非需要不会缩小 |

    | Ignored | 此控件尝试尽可能占据大量空间 |


    ## 分析和比较“基础尺寸”的大小


    为水平拉伸和垂直拉伸赋值允许你修改其行为。当控件进行布局时，每个控件被分配到所需的空间；剩余空间作为内容分配给各个控件。


    例如，如果有三个按钮的拉伸因子设置为一，那么它们将相应占据内容基础的两、三倍空间。


