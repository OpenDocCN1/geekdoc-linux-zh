    The powerful followup to the original Arduino


    ## REVIEW


    ## Technical specs


    | Compatibility | All Raspberry Pi models |

    | --- | --- |

    | Processors | Atmega328, Atmega 48 |

    | Dimensions | 85mm x 57mm x 20mm (excluding Raspberry Pi) |

    | Weight | 34g (excluding Raspberry Pi) |

    | Connectivity | 15 Digital IO & PWM, 6 analog input, UART, I2C bus, buffered
    LEDs |

    | Extra | Real-time clock, battery backup (Atmega 48 only), RS232 Serial Converter
    |


    - Six LEDs offer more on-display capability than found on a stock Arduino model

    - Two user-addressable buttons are included to get users started with simple projects


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_76_0.png)


