    Linux 操作系统隔离。


    Trusted Foundations “TEE”（Trusted Execution Environment，可信执行环境）运行在 ARM 处理器的 TrustZone
    上，为操作系统可以轻松访问的各种标准化接口提供支持。这些特性跨越 ARM 设备。其他设备方法可能包括启动嵌入式设备。正如 James Morris 宣布的，Linux
