    \n![](img/9ee62baa445dcfe9b284d0d92f95c0bb_1_1.png)\n![](img/9ee62baa445dcfe9b284d0d92f95c0bb_1_2.png)\n\
    \n## 欢迎\n阅读 Linux User & Developer 第 135 期\n\nRob Zetswat 在大学学习软件工程，并在课堂上使用 Python\
