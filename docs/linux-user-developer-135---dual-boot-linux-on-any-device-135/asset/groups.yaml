    # 使用 ownCloud 构建自己的私有云

    在云端建立你自己的文件管理系统


    # 教程


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_40_0.png)


    ## 01 简介

    ownCloud 是一款开源文件和共享应用程序，提供免费社区版和企业版。它允许你备份、共享和管理上传到服务器的文件。通过多种接口（如 Web 端和移动应用），它让你能够随时随与数据保持联系。ownCloud
    可以与 Google Drive 或 Dropbox 客户端无缝同步你的文件。有了这种简单的文件同步生态系统，拥有 ownCloud 正如文档中所说，“你的数据，由你做主，你的生活”。


    ## 02 安装服务器

    这里有两种可能的情况。你可能想在自己的系统或家庭办公环境中安装 ownCloud。否则，你可能希望它在互联网上可用。在后的情况下，你可以跳过这些步骤，但如果你有未来计划，应该识别并安装像
    Apache 这样的服务器作为系统。但正如之前讨论的，服务器并不是 ownCloud 的唯一要求。你还需要数据库和 PHP 支持。使用 MAMP 服务器可能是最好的选择。


    ## 03 安装 ownCloud

    有了服务器，我们就可以拥有自己的应用程序了。首先，从 ownCloud 官网下载应用程序：只需点击链接上的“Tar”或“Zip”链接，然后将提取的文件夹解压到服务器根目录下。现在，通过浏览器访问该文件夹。欢迎页面将打开并提示你输入
    ID 和密码。你可能需要创建一个“高级（Advanced）”链接，因为所有需要的代码都包含在这些服务器中。你将使用系统中的 MAMP 服务器来托管 ownCloud。


    | MAMP |

    | 本地管理你的网站 |

    | 测试 MAMP |

    | Apache 服务器 |

    | 停止服务器 |

    | MySQL 服务器 |

    | 打开首页 |

    | 偏好... |

    | 退出 |


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_40_1.png)


    你可以在此处更改与数据库相关的设置。完成后，只需点击“完成（Finish）”，你就拥有了自己的 ownCloud。


    ## 04 开始使用

    现在 ownCloud 已经安装并创建了管理员用户，你可能想添加更多用户，然后让这些用户上传文件。在这一步中，我们将向你如何操作。首次用户管理是点击首页右上角的“管理员（admin）”按钮。在出现的文档列表中，点击“用户（users）”。这将带你进入用户管理页面，你可以在那里添加/删除用户并进行组管理。你可能为某个组分配管理员。要上传文件，你可以直接将文件拖放到
    ownCloud 主页，然后选择要上传的文件。


    ## 05 ownCloud 同步客户端

    除了服务器应用程序外，ownCloud 还提供了运行在用户系统上的同步客户端。同步客户端会使其文件夹中的任何文件自动同步到服务器。只需下载客户端，将其指向你的
    ownCloud URL 并输入凭据。客户端会可靠地连接到服务器并开始同步。该程序在带宽使用方面具有高度可性，并允许更改设置和多个同步文件夹。它支持主流平台：Windows、Linux
    和 Mac OSX。


    ## 06 owncloud 的其他应用

    它看起来很简单，但 owncloud 的功能远不止文件同步；owncloud 不仅可以在设备之间同步文件，还可以让你管理日历和联系人。首页左侧的日历链接可以让你创建事件并与其他用户或组共享。它支持多个日历并随你的需求而增长。联系人选项支持添加和管理联系人详情。联系人也可以导出为
