    ## 光碟介绍


    欢迎阅读全新的 Linux 用户与开发者 DVD


    # 光碟内容


    ## 编辑精选


    **Raspian** 我们在所有的教程和指南中使用 Raspian 都是有原因的，它是事实事实上的标准、可靠的，并且在目前所有的产品中提供了最佳性能。


    **Linux Mint 16** 我们是 Mint 的忠实粉丝，这已经不是秘密了。除了出色的社区和慷慨的项目领导层外，Mint 运行快速、稳定，并且比其他替代方案更易用得多。目前王座上只有一个竞争者，那就是
    elementary OS。


    **OwnCloud** 通过我们本月的教程，使用强大且多功能的“服务器端软件”解决方案 ownCloud，创建你自己的私有云。上手非常简单……


    ## 完整索引


    **Raspian** 树莓派基金会推荐的 Raspberry Pi 发行版，也是我们在教程中使用频率最高的版本。跟随本月开始的《树莓派迷你杂志》获取你 Pi
    的最新版本。


    **Linux Mint 16** Ubuntu 13.10 的发布表现平平，而 Linux Mint 的出现至关重要，因为社区首次带来了新的 GNOME
    基础。从它的符号方法来看，它仍然是一个很棒的发行。


    **PCLinux 2013.2** 滚动更新 PCLinux 的最新版本带有 MATE，这是桌面阵容中较新加入的成员。PCLinux 具有极佳的兼容性和非常优秀的产品。


    **CentOS 6.5** 红帽企业级 Linux 的社区版是一个稳定的企业发行版，也适用于需要更稳固配置的家庭环境。


