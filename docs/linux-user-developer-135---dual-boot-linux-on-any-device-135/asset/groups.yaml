    # 开源


    Furber 认为 Linux 将有助于引导孩子们进行更多的调查、质疑和探究。


    Furber 的很多学生使用的是软件黑盒，你某种程度上得生活在一个封闭的盒子里。Linux 有许多方法让人们构建复杂的软件并直接引导他们。


    但是，我们问，难道不会找到一或两台运行 Windows 的机器吗？而 Linux 是现今大多数学术工作的标准平台，这是因为它更……？


    # 可怕的 Linux？


    由于许多正在进行的学术开发要求：“如果你想在 Windows 上进行软件开发，你将处于开发中——软件开发是在它的系统里的，而 Linux 将此延续了下去——人们构建复杂软件的方式将引导他们走向一条其他地方没有的路？


    “但 Linux 不会吓到老师吗？”“噢不会，”他说，“当然树莓派（Raspberry Pi）正在做。我认为任何涉及操作系统的内容都会让老师感到恐惧，但拥有背景和经验来应对此事的教师非常有限。”


    因此，BBC 似乎正在进入一个棘手的领域。似乎在糟糕的判断上，衡量一台 BBC Micro 2


    > 我认为涉及操作系统的内容会让老师感到恐惧……而拥有背景来应对的教师数量非常有限


    讨论已经过，但最终都一无而终——该机构对孩子们使用什么并不那么重要，而 BBC 则陷入了他们失去焦点的事情中。更多的是他们正在询问什么能让孩子们成为 Linux
    的粉丝，而不是让他们在当今世界成长为冷淡的处境。这样的人未来将成为应该被淘汰的例外。对树莓派的兴趣表明，该国年轻人对深度学习有着渴望。


    虽然一些人关注威尔德和福特（Willard and Fortune），但《每日电报》声称编码是一种小众需求，类似于编程或汽车修理，将开发者称为“异常古怪的人”，并被认为教学是无意义的。


    “Linux 是人类创造过的最伟大的东西，我们不断听听到这种热情和所有活动，”Furber 说，“他们鼓励并……而且。树莓派并非独一无二，但它很棒。BBC
    可能会与此保持一些距离，但有一种真实变革即将到来的感觉。”


