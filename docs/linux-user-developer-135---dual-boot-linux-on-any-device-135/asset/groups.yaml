    # # Tutorial Raspberry Pi-controlled car


    # # Controlling your Raspberry Pi-powered car


    Control a car with a smartphone and the latest web technologies


    Now we have our fantastic Raspberry Pi-powered car all wired and connected, it''s
    time to make it come alive. We will use the best technologies that we know, including
    programming languages, to harness the power of your hand and drive the vehicle.
    Each little will will learn what the car should do and then sends it over a socket
    connection up to 20 times a second.


    +   What you''ll need

    * A Raspberry Pi, ready to go

    * An internet connection

    * A reasonably modern smartphone/tablet

    * Pi source code

    * https://github.com/shaunij/picar


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_57_0.png)


    Step 01


    ## Download and install the software

    To get the GCC connectivity, you can follow the steps from pages 64-65. We will
    need to find out our IP address using `sudo ifconfig`. Type `mkdir /var/picar`
    in the terminal to make the directory and change into `cd /var/picar/`.


    Now, download the project using Git, `sudo git clone https://github.com/shaunij/picar`.
    If you haven''t got Git yet, install it with `sudo apt-get install`


    Now download the custom software for the car, but we still need the web server
    and other things before we start running rubber...


    doesn''t work with the new technologies we''re about to use. Extract the package
    by using `tar -xzvf node-v8.10.21-linux-arm.tar.gz`.


    ## Configure Node.js


    To make it run from everywhere, we will create symbolic links for Node.js. In
    the terminal, type `sudo ln -s /home/pi/node-v8.10.21-linux-arm/bin/node /bin/node`
    and then `sudo ln -s /home/pi/node-v8.10.21-linux-arm/bin/npm /bin/npm`. Then
    to get the modules, type `npm install node-static socket.io sleep-timeout`


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_57_1.png)


    Above you need to adjust some of the variables to control your remote controlled
    car


    Step 02


    ## Install Node.js

    Now we will get the latest Node.js and its package, use the Node package manager
    (npm). Type `sudo curl -sL https://deb.nodesource.org/setup_8.x | sudo -` to download
    the most recent version of Node.js, the version Raspberry has in its repositories
    is too old and just


    Step 03


    ## Get to know the project


    Now that we have everything, we will use the Node.js app, the HTML and JavaScript
    library for control. The server not only drives the car, but it is also a web
    server and sends socket connection. What is requested - it''s really neat and
    simple setup and just right for what we''re trying to achieve.


    Below we need to finish your project is access to a smartphone or tablet


    Step 04


    ## Test the app

    Using this app has a special mode for testing. We will use two keys: beta for
    0 (steering) and gamma for 1 (motor). Type node `app.beta=3000` to see the front
    wheels. Now Node needs experimenting with control. For example, if 340 turns left,
    press right to turn right. Then for the motor type node `app.gamma=0` and take
    note of the limits of Node.js


    Step 05


    ## Configure default variables


    Now we can show what your car is capable of, we can set variables in app.js and
    index.html. Find the section that says ''function emotion''. Adjust the two variables
    to your car''s real values. Then open index.html and define the preferred values
    for your variables


    Step 06


    ## Going for a spin


    Now we already tried to run it, but you need to know the IP address of your Pi
    car, so type `ifconfig` in the terminal. Fire up the app by typing `node app.js`.
