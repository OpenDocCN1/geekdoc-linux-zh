    How to run two operating systems on any machine


    FEATURE


    # # Dual-boot Android ROMs


    If ditching Android is not enough for you, why not using multiple MultiROMs on
    your device?


    Android being an open source operating system has resulted in a number of custom
    ROMs that extend or update the capabilities of your phone or tablet. Using only
    one at a time, if you want to change it you will need to spend an afternoon flashing
    and restoring custom or stock ROM, leaving the device all for that. MultiROM Manager
    is a straightforward app that takes the pain out of the process, making it easy
    to work. It can be downloaded from the Google Play Store and then ask to be granted
    root. The next step is installing MultiROM Manager to the bootloader, updating
    the kernel modules and anything...


    else it suggests installing. It will likely ask you to reboot to recovery to finish
    installation, and then show you a selection on next boot.


    # ### Adding ROMs


    Find the .zip of your preferred ROM and download it to the storage of your device.
    Do not extract it. Reboot to recovery with bootloader (on a connected PC), or
    by holding volume-up and power to enter TWRP recovery. You''ll be sent to a new
    option under Advanced MultiROM. Select this, then Add ROM and Next to locate the
    file you just put on the device. Swipe to install.


