    Apple products can still get a bit of open source love — you just need the right
    tools


    While the quality of Apple software is debatable on a number of levels, the hardware
    inside the firm''s Mac computers is often extremely good. Since the switch to
    Intel architecture a few years ago, Linux drivers have technically been able to
    work on Macs, albeit with restricted drivers installed to make the most of them
    work straight away. There have been some other setups we''ve tried to drive, though,
    and installing a custom bootloader to choose between the OS and GRUB. Now that
    this is done, you can enjoy a lot more freedom from your Mac and make it full
    of its power, high quality hardware.


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_31_0.png)

