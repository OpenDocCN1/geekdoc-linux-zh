    # 自由软件专栏


    ## 版权所有 - 共享版权（Copyleft）与 GPL


    GPL 的原始目标是确保任何引入自由软件的代码都能保持自由共享……


    Don 借用了 Richard 的做法，而我们正在将其还回去，那张贴纸启发了 Richard 在软件许可中使用“copyleft”（共享版权/左拷贝）一词。


    共享版权的作用是维护项目的连续性和完整性，这在 Linux 内核被使用后所证明的那样。如果没有 GPL，企业用户（无论是 SGI、IBM 还是其他任何）都会发现劫持和分叉内核是有益的，正如
    Unix 的情况，阻碍企业用户的回馈贡献将是不可避免的，因为从长远来看，通过惩罚改进可能会获得优势；而 Unix 的专有部门对个人用户是不利的，因为每个用户都比集体开发要弱。


    对每个人都有的集体优势是显而易见的：成本被分担了，开发速度快得多。如果 Linux 内核是在更宽松的许可下发布的，它不太可能达到目前的完整性水平。GPL 为所有参与者确保了源代码，每个人都是贡献者。基于
    Linux 内核的行业开发使得为更广泛的市场编写应用程序成为可能，超越开源，这对所有相关者都有利。


    Richard Hillesley

    为多种出版物撰写关于艺术、数字、权利和自由软件的文章


    过去认为 GPL 对商业具有敌意的神话是错误的。GPL 许可对商业是友好的，因为企业用户可以对代码进行随心所欲的操作，将其拆分，而没有义务向社区返回任何改进。


    GPL 本质上是对版权的一种“黑客行为”（hack），它重写了终端用户的权利和责任，赋予用户使用、复制、共享或转售软件的权利，并允许在相同条款下自由更改。


    在现实世界中，GPL 不是自由软件的唯一原则，也是所有可用许可中对商业最友好的。像 IBM 和 SGI 这样的许多大公司可以采用内核，在 GPL 下发布大量代码，因为他们知道自己的开发工作也会回馈给社区，而且他们的贡献不会被公开。


    GPL 对版权法的创造性使用，解释了为什么其他人会提到 GPL - GPL 旨在应用于代码并为代码添加条件，且保留所有权利。共享版权的利益允许人们为项目贡献代码、取消分叉并共享，并确保代码不会被劫持用于专有用途。


    公司采用 Linux 的优势在于降低成本的集体开发 - 这种开发是由所有人的贡献资助的。公司觉得可以自由分享他们的贡献，Linux 内核变成了一个协作项目，如果没有
    GPL 的保护，这种开发是不可能的。


    ## “对每个人都有的集体优势是显而易见的；成本被分担了，开发速度快得多”


    copyleft 这个名字的灵感来自 Richard Stallman，这位编写 GPL 的人，他在 1984 年看到一封从 Hopkins 寄到另一个 Hopkins
    的信封背面看到的。那封信封里有 68,000 本手册……


