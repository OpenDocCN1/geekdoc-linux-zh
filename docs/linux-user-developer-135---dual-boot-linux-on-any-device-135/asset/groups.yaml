    background = pygame.image.load(\"background-4.jpg\").convert()\nplayer_image =\
    \ pygame.image.load(\"ship.png\").convert()\n\n# We can use colkey to remove the\
    \ background from the\nplayer_image.set_colorkey((0, 0, 0))\n```\n\nThe ADXL345\
    \ accelerometer requires four cables—two for power and ground and two for I2C\
    \ communication with the Raspberry\n\n# 04 Cloning and testing\n\nFrom the terminal,\
    \ navigate to your home folder (with ~) and create a project folder for the project\
    \ to live in using: `mkdir adxl345_project`. Go into the folder and `clone` the\
    \ finished project from your GitHub commit: `git clone https://github.com/rubssh/adxl345.project`\n\
    \n```\ndef update_pos():\n    # Check the accelerometer and update position based\
    \ on readings\n    data = adxl345.get() # Returns a tuple of axes\n    if data['x']\
    \ < -0.1 or data['x'] > 0.1:\n        player_pos[0] += 5\n    if data['y'] < -0.1\
    \ or data['y'] > 0.1:\n        player_pos[1] += 5\n```\n\n```\ndef check_pos():\n\
    \    # Check if player needs to wrap around the window\n    if player_pos[0] <\
    \ 0:\n        player_pos[0] = 800\n    elif player_pos[0] > 800:\n        player_pos[0]\
    \ = 0\n    if player_pos[1] < 0:\n        player_pos[1] = 600\n    elif player_pos[1]\
    \ > 600:\n        player_pos[1] = 0\n```\n\n# 05 How it works\n\nWhen you run\
    \ the script for the first time, `python adxl345_project.py` will open a window\
    \ and an appear spaceship at center on the screen. Pick up your accelerometer\
    \ to control the movement. The ship should move in reaction to your movements.\
    \ If the movements are in different directions, you can adjust the orientation\
    \ of the movement—it might be upside down!\n\n# 06 Why it works\n\nThe code is\
    \ an excellent example for a Space game written in Pygame. The code collects data\
    \ from the ADXL345 accelerometer in the `update_pos()` function using the `move_data`\
    \ variable. This data is used to update the player's position on the x and y coordinates.\
    \ The data is added to the `player_position` to push the spaceship across the\
    \ screen. You can adjust the multiple (for example, number) to change the speed\
    \ of the ship. We used a `check_pos()` function, which makes the `wrap around`.\
    \ If it exits the left, it will appear on the right.\n\n```\n# # Handle control\
    \ events while the game is in\nwhile event in event.get():\n    if event.type\
    \ == pygame.QUIT:\n        return\n    if event.type == pygame.KEYDOWN:\n    \
    \    if event.key == pygame.K_SPACE:\n            game_over = True\nif game_over:\n\
    \    print(\"Game is quit if space is pressed)\"\n```\n\nupdate_pos() # Check\
    \ the player's position\ncheck_pos() # Check the player's position\nscreen.blit(background,\
    \ [0, 0])\nscreen.blit(player_image, [player_pos[0], player_pos[1]])\n\n```\n\
    pygame.display.flip() # Refresh the screen\nclock.tick(60) # Framerate to desired\
    \ number\n\\pygame.quit() # Game quits when 'game_over' turns\n```\n\n* Asterisk\
    \ *\n\n65. usinuser.com"
- md: "\n## Why Python?\nIt's the official language of the Raspberry Pi.\nRead the\
    \ docs at www.python.org/doc\n\n## The object of an object-oriented language.\n\
    \nPython is built as first of what will be a series of articles talking about\
    \ Python. But do you use Python objects? Bernard explains...\n\n![](img/9ee62baa445dcfe9b284d0d92f95c0bb_65_0.png)\n\
    \nAs a true renaissance man himself, he splits his time between building frameworks,\
    \ working with researchers and scientists, solving complex problems and writing\
    \ Android apps.\n\n### Joey Bernard\n\nWelcome to the first of what will be a\
    \ series of articles talking about Python. But unlike you and me fans of the language,\
    \ we're not as afraid to be blind to its weaknesses.\n\nSo over the coming months\
    \ we will try to do certain tasks in Python, but also may run into issues during\
    \ your travels. Over time we will collect best practices and ways to apply them\
    \ to create small programs for the Raspberry Pi.\n\nThe first week we will look\
    \ at using objects in Python. According to the official documentation, objects\
    \ are for data. All data in a Python program is represented by objects or relationships.\
    \ Actually, almost everything in Python is an object. So learning a bit more about\
    \ how they behave is important if you intend to develop code of real value.\n\n\
    More specifically, we will learn to work with objects of our own design.\n\nClasses\
    \ in Python are the most common object-oriented programming. The mechanisms in\
    \ Python were inherited from C++ and Modula-3. A class can inherit and can override\
    \ methods of its base class. All of the methods can also be called from the inheriting\
    \ class. For data, objects can contain various amounts and types. And because\
    \ Python is a dynamic language this is modifiable at runtime. As an example, let's\
    \ say that you develop a program that will do some kind of geometric processing.\
    \ One of the core objects that you will want to use is coordinates in space. To\
    \ draw geometry, you first need to use two variables, an x and y. In Python, this\
    \ would be that we can write methods that know to use this data. In many cases,\
    \ it makes sense to initialize variables. One way to do this is to simply write\
    \ statements within the class definition.\n\n```python\nclass Point:\n    x =\
    \ 0.0\n    y = 0.0\n```\n\nThe other way to initialize values is to use the __init__\
    \ method in classes. This method is automatically called when you create an object\
    \ so you can create those values by default:\n\n```python\nclass Point:\n    pass\n\
    ```\n\nThe first line is how you define a class in Python. It is very similar\
    \ to how you define a new function, except that you exchange the keyword 'def'\
    \ with class. A class always needs at least one statement. If you don't want your\
    \ class to do anything yet, you can use pass. This essentially tells Python 'there\
    \ is nothing to show here' yet you can use this class to create new objects of\
    \ type 'Point'. You can do that:\n\n```python\nclass Point:\n    def __init__(self):\n\
    \        x = 0.0\n        y = 0.0\n```\n\nThen you can reset the x and y values\
    \ after creating an instance with:\n\n```python\nmy_point = Point()\nmy_point.x\
    \ = 20.0\n```\n\nThis is not really that useful. If you want to store point values\
    \ in objects, one of the real things objects do is fully dynamic. You can add\
    \ x and y values to the statements:\n\n```python\nmy_point.x = 10.0\nmy_point.y\
    \ = 20.0\n```\n\nThis particular instance of the class now has an x and y value.\
    \ It was easy! Unfortunately, we're not limited to just that. It would be better\
    \ to have them as part of the definition of the class so:\n\n```python\nclass\
    \ Point:\n    def __init__(self, value, value):\n        self.x = value\n    \
    \    self.y = value\n```\n\nWhile this works, it is important to remember that\
    \ programmers are inherently lazy and do not want more than absolutely necessary.\
    \ Following this logic if you could assign x and y values at the same time you\
    \ are creating an object. In Python, you can use the __init__ function to be written\
    \ with parameters:\n\n## All Python data is represented by objects by relationships.\n\
    Actually, almost everything in Python is an object.\n\nWhen you want to create\
    \ a 'Point' object with values you want to assign to its creation, all you need\
    \ to do is type:\n\n- my_point = Point(10.0, 20.0)\n\nIsn't that much easier?\
    \ Now that you have a point definition, you can add methods to work with this.\
    \ One of the first methods for point is its absolute value. You can just add the\
    \ function definition to the class like this:\n\n```python\nclass Point:\n   \
    \ def __init__(self, x, y):\n        self.x = x\n        self.y = y\n    def abs_val(self):\n\
    \        return math.sqrt(self.x**2 + self.y**2)\n```\n\nNow that you have a basic\
    \ two-dimensional point defined, you can create objects that handle three-dimensional\
    \ coordinates. Using code that is aimed for - within the realms of object-oriented\
    \ programming - as in Python, you can create a new class for three-dimensional\
    \ points. This would look like:\n\n```python\nclass Point3D:\n    def __init__(self,\
    \ x, y, z):\n        self.x = x\n        self.y = y\n        self.z = z\n    def\
    \ abs_val(self):\n        return math.sqrt(self.x**2 + self.y**2 + self.z**2)\n\
    ```\n\nWhen you write the method it will need to take three parameters rather\
    \ than two. Nothing has been to do with the abs_val inherited from the Point subclass.\
    \ As you instantiated the Point3D object, you will need to give it the x and y\
    \ and z values of this point. If you want a proper three-dimensional point, you\
    \ will need to override the abs_val method.\n\nNow that you've seen how to create\
    \ your class, let's look at some details about how Python manages these objects.\
    \ In most desktop systems, memory is not really an issue unless it is relatively\
    \ constrained, so memory management will be much more important for your code.\n\
    \n![](img/9ee62baa445dcfe9b284d0d92f95c0bb_66_0.png)\n\n## Full code listing\n\
    \n- If Pygame isn't installed, this code won't work for you.\n- You can find the\
    \ pygame package manager for all major distributions.\n- Debian-based users can\
    \ install it with:\n  `sudo apt install python-pygame`\n\n```python\nimport pygame\n\
    import sys\n\n# initialise with the following:\npygame.init()\n\n# we're creating\
    \ a clock to control the frame rate:\nclock = pygame.time.Clock()\n\n# we're assigning\
    \ some variables, here they are all:\nSIZE = (800,0)\nHEIGHT = (640, 480)\n\n\
    # we need to create a surface to display everything:\nscreen = pygame.display.set_mode(SIZE)\n\
    \n# let's create our class:\nclass Ball:\n    def __init__(self, x, y):\n    \
    \    self.x = x\n        self.y = y\n        self.rect = pygame.Rect(x, y, 10,\
    \ 10)\n    def draw(self, surface):\n        pygame.draw.rect(surface, (255,0,0),\
    \ self.rect)\n\nball = Ball(100,100)\nball.image = pygame.image.load(\"ball.png\"\
    )\n\n# in this loop, we'll be doing the following:\nwhile True:\n    for event\
    \ in pygame.event.get():\n        if event.type == pygame.QUIT:\n            pygame.quit()\n\
    \            sys.exit()\n\n    ball.move(5, 5)\n\n    # this is our logic:\n \
    \   if ball.rect.right > WIDTH or ball.rect.left < 0:\n        ball.speed *= -1\n\
    \    if ball.rect.bottom > HEIGHT or ball.rect.top < 0:\n        ball.speed *=\
    \ -1\n    \n    ball.draw(screen)\n```\n"
  mdcn: "\n\n## 为什么选择 Python？\n它是树莓派（Raspberry Pi）的官方语言。\n访问 www.python.org/doc 查看文档\n\
    \n## 面向对象语言的对象。\n\nPython 的构建将作为一系列关于 Python 文章中的第一篇。但你真的使用 Python 对象吗？Bernard\
    \ 解释道道……\n\n![](img/9ee62baa445dcfe9b284d0d92f95c0bb_65_0.png)\n\n作为一名真正的文艺复兴奇才，他将时间分配在构建框架、与研究人员和科学家合作、解决复杂问题以及编写\
    \ Android 应用程序之间。\n\n### Joey Bernard\n\n欢迎来到系列关于 Python 文章的第一篇。但与你我我这些该语言的粉丝不同，我们并不畏惧于直面它的弱点。\n\
    \n因此，在接下来的几个月里，我们将尝试用 Python 完成某些任务，但在你的旅程中也可能会遇到问题。随着时间的推移，我们将收集最佳实践以及应用它们的方法，来为树莓派创建小型程序。\n\
    \n第一周，我们将学习如何在 Python 中使用对象。根据官方文档，对象是用于数据的。Python 程序中的所有数据都由对象或关系表示。实际上，Python\
    \ 中的几乎一切都是对象。因此，如果你打算编写具有真正价值的代码，多学习一些它们的行为是非常重要的。\n\n更具体地说，我们将学习如何处理自己设计的对象。\n\
    \n类是 Python 中最常见的面向对象编程方式。Python 的机制继承自 C++ 和 Modula-3。类可以继承并重写其基类的方法。所有方法也可以从继承类中调用。对于数据，对象可以包含各种数量和类型。因为\
    \ Python 是一种动态语言，这些这些在运行时是可以修改的。例如，假设你开发了一个用于进行某种几何处理的程序。你想要使用的核心对象之一是空间中的坐标。为了绘制几何图形，你首先需要使用两个变量\
    \ x 和 y。在 Python 中，这意味着我们可以编写知道如何使用这些数据的方法。很多情况下，初始化变量是有意义的。实现此点的一种方法是直接在类定义中编写语句。\n\
    \n```python\nclass Point:\n    x = 0.0\n    y = 0.0\n```\n\n另一种初始化值的方法是在类中使用 `__init__`\
    \ 方法。该方法会在创建对象时被自动调用，因此你可以默认创建这些值：\n\n```python\nclass Point:\n    pass\n```\n\
    \n第一行是在 Python 中定义类的方式。它与定义一个新函数非常相似，只是你将关键字 `def` 替换为 `class`。类始终至少需要一个语句。如果你还不想让你的类做任何事情，可以使用\
    \ `pass`。这本质上是告诉 Python “这里还没有要显示的内容”，但你可以使用这个类来创建类型为 'Point' 的新对象。你可以这样做：\n\n\
    ```python\nclass Point:\n    def __init__(self):\n        x = 0.0\n        y =\
    \ 0.0\n```\n\n然后你可以在创建实例后重置 x 和 y 值：\n\n```python\nmy_point = Point()\nmy_point.x\
    \ = 20.0\n```\n\n这其实并不很有用。如果你想在对象中存储点值，对象所做的真实事情之一是完全动态的。你可以向语句添加 x 和 y 值：\n\n\
    ```python\nmy_point.x = 10.0\nmy_point.y = 20.0\n```\n\n该类的特定实例现在有了 x 和 y 值。这很简单！不幸的是，我们并不局限于此。更好的做法是将它们作为类定义的一部分，这样：\n\
    \n```python\nclass Point:\n    def __init__(self, value, value):\n        self.x\
    \ = value\n        self.y = value\n```\n\n由于 Python 是一种动态语言，这些在运行时是可以修改的。例如，假设你开发了一个用于进行某种几何处理的程序。你想要使用的核心对象之一是空间中的坐标。为了绘制几何图形，你首先需要使用两个变量，x\
