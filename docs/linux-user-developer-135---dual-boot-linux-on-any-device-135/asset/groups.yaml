    SteamOS GNU/Linux ‘炼金术士’现已可用


    游戏巨头 Valve 在今晚的消费电子展会（CES 2014）上正式揭晓了备受期待的首台 Steam Machine，其特点是为客厅设计的游戏电脑，并基于
    Linux 发行版。


    纽能（Newell）近年来一直支持 Linux 世界，这是由于他感知到来自微软日益增加的压力，他认为微软是一个更加封闭的平台，给像 Valve 这样的公司留下的空间很小。“我认为这对
    PC 领域的每个人来说都是一种灾难，”纽能的观点似乎没有改变。此前被指责在将 Steam 客户端引入 Windows 系统时忽略了 Linux 平台，Valve
    在 2013 年 2 月发布 Linux 版 Steam 纠正了疏忽，并与 Canonical 建立了大量合作以定制其 Ubuntu 操作系统。


    现在，劳动成果正显而易见。第一批官方 Steam Machine 主机已经发给了闭门测试的测试人员，而 SteamOS 本身已发布供公众下载并在现有硬件上进行测试——并带来了带来了更多关于……的更有趣细节。虽然
    Valve 之前暗示安装 Ubuntu 将是 Linux 版 Steam，但最后时刻转变的原因尚不清楚，Valve 和 Canonical 对此事均保持了沉默。发布的
    SteamOS 1.0 镜像并非功能完整，专门用于 2013 年 12 月中旬的年度测试。结果，早期采用者会发现 Nvidia 处理器的二进制大包驱动程序（binary-blob
    drivers），但没有其他制造商的部件。对于那些想要尝试一下的人来说，Valve 要求系统至少有 500GB 的硬盘和 4GB 的内存。


