    it to the GitHub repository before the render-end package is built on Node.js,
    the Node Package manager.**


    The site has been designed to offer a fluid, responsive design capable of adjusting
    its layout and flexibly depending on the screen size, device capabilities of any
    particular user. The new front-end package is built with Node Package Manager,
    Grunt and Ruby and is compatible with both Linux distributions.


    The code is released under an Apache License 2.0, which is free available to the
    public in May 2012. It is only in the past month, however, the code has improved
    to much since where The Guardian is looking for feedback after a period of beta
