    ## Welcome

    to issue 135 of Linux User & Developer


    Rob Zetswat studied software engineering at university, using Python simulations
    in class. This issue our staff writer features dual-booting (master) and how he
    built a 3D scanner using nothing more than Raspberry Pi.


    ## Get Linux User cheaper per issue - Page 34


    Tam Hanna has been in the IT business since 1988. As journalist, tutor, author
    and speaker, he has seen every aspect of the mobile market since. This month Tam
    continues with a look at responsive design.


