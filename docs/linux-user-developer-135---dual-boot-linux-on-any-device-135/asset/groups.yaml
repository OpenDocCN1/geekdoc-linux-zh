    >> Responsive design with Qt

    >> Maintain systems remotely


    Millis Tokalos is a system administrator with experience in programming, databases
    and maths. He has been using Linux since Linux User & Developer talks us through
    our network to. He has a few tips for solving issues - find out on page 44.


    Michael Reed is a technology writer, and he has been working with Linux for over
    15 years. He specializes in Linux development and security. For this issue, Michael
    sets up a Linux system even if you''ve got a PC on the other side of the planet
    to back over. Make yours on page 38.


    Welcome to the latest edition of Linux User & Developer, the UK and Africa''s
    favourite source and Linux magazine.


    All are in 2014, thanks to the success of Raspberry Pi, continued domination of
    Android and Valve''s incredible decision to bring Linux to Steam, the dominant
    digital gaming platform for PC, has a hopping 69 million active users and Valve
    points to Steam Machine living-room PCs that run Linux. There are more than five
    non-Linux savvy people who want to get up with all things Linux and learning how
    to dual-boot it with their current operating system is a great way to get started.


    Dual-booting is not as hard as it once was, and you will be amazed how quickly
    you can be up and running of your current platform. In this issue we''re quest
    to leave no stone unturned - we''re also showing how you can dual-boot your Android
    device and even your Raspberry Pi - get started on page 23.


    Every month we''ll be joining 16 pages of the latest gadgets, and interviews from
    around the Raspberry Pi community. If you''d like your project featured in the
    magazine or would like to get a tutorial on a particular topic, get in touch with
    the details below.


