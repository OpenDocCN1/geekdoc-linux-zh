    | Interface | Fairly simple, maximising the area to chat, keeping settings hidden
    away until needed | 4 | Quite well out, although the chat being inside the windows
    defeats the point | A very simple interface that fits any desktop, but loses functionality
    Accounts are laid out with basic functions and the more advanced ones buried |
    6 | Aesthetically could use used visuals fairly simply and laid out logically
    | 8 |

    | Account | Handled by GNOME account management, which can handle your system
    settings well | Accounts are embedded, but unfortunately you can only connect
    to one of them | Telepathy doesn''t integrate well with all desktops, but it is
    a decent chat client other way | Accounts can be quick menus or a dedicated manager
    for changing | 7 |

    | Overall | A solid chat that, for the most, integrates well with a variety of
