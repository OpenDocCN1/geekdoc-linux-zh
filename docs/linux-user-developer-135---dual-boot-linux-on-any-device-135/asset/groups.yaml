    # 观点

    内核专栏 - Jon Masters


    ## 开源


    ### 十月以出色的 Linux 3.12 内核结束了这一年，并带有某些条件，包括“启动”处理器（通常为 0 号处理器）需要保持其计时器运行，以用于管理（调度）等目的。


    六月推出了来自 Will Dean（他有一份单口喜剧职业）的针对系列应用的精彩补丁，并且一些系统（出于某些原因）引入了“移除空 IPC 和 Bogops 值”；由
    Mike Wood 记录的“Bogops 值”是一个简单的计算（取决于空闲循环），衡量处理器完成一组对 no-ops 调用以完成空值的运行的速度，但在许多系统上（尤其是
    ARM 设备），它与架构的含义不同——例如 ARM 的 Architected 架构。


    七月带来了另一个新内核。Linux 3.11 针对 64 位架构的 Xen 和基于 KVM 的虚拟化发布，七月和八月自发布以来是非常平静的月份，因为那时是年中，许多人都在休假。然而，八月由于分布式文件系统（最终）合并入内核，这是多年以来的首次。仅此而已。


    十一月在 3.11 开发内核中引入了其他优秀的新功能，该内核被命名为“工作组 Linux”，以向微软 Windows 3.11 版本“Windows for
    Users”致敬。Linux 本想在原始“hello”欢迎消息发布的 22 周年发布 3.11，但最终选择安装一个 RC 版本。3.11 的正式版本在不久之后发布。


    九月也可以被命名为“内存月”，重点关注 Linux 3.12 中引入的虚拟内存子系统，特别是 NUMA 支持，这对于内存分布在多个 CPU 上的大型微处理器非常重要，所有
    CPU 平等访问，但存在差异。


    十月包含了一类新功能——ARM 的内核补丁（来自 Origin），以及 rename2 中对新“powerdev”驱动的支持，它通过分配热管理解决了原子性问题。


    十一月以出色的 Linux 3.12 内核结束了这一年，该内核发布时引入了 RCU 切换，允许在不重启桌面的情况下进行切换。


