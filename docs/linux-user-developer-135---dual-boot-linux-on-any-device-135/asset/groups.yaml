    ### 01 Some REinement


    Here is how to reFind and download (www.odsbooks.com/refind/) the latest binary
    of it. Open Terminal in OS X and cd to the download directory. It''s much like
    a Linux terminal, so ls list the contents. Install it with ./install.sh


    ### 02 Room for more


    Open Disk Utility from the OS Utilities; click on the main drive and then the
    Partition tab. You should see the startup partition, unless you''ve changed it.
    Resize it, as we''ve advised before, and click Apply.


    ## Dual-booting a Raspberry Pi


    ## Short of SD cards for Raspberry Pi


    Put two OS images on one SD card


    The Raspberry Pi, with access to only a limited SD card, may not be the most obvious
    dual-boot device. However, due to the recent release of the New Out Of Box Software
    (NOOBS), multiple Linux distributions can be installed on one SD card. We have
    used NOOBS in the first place to get the dual-booting setup up.


    If you prefer to do this yourself, installing NOOBS on an SD card is easier than
    using just one image. By using the partition tools we''ve learned to shrink and
    expand partitions, we can make as many as we wish on the Pi and create a FAT32
    partition for each. As we said, you will need a card as large, with at least 28GB
    for each distro. The formatting is complete, download NOOBS from the Raspberry
    Pi and extract the files onto the SD card, then plug it into the Raspberry Pi
    and turn it on.


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_31_2.png)


    ## Raspberry Pi distros


    Which Raspberry Pi distro is best for your needs?


    Home & Projects is the preferred distro for Raspberry, offering great software
    and easy access to some of the more interesting projects and hardware. It''s the
    one we use as a desktop operating system.


    HTPC is a great choice for running OpenLEC and Raspbian both on X. However, OpenLEC
    no longer has the speed optimizations that put it ahead of Raspberry.


    Customizability is here on Raspberry Pi you want to build from the ground up,
    coming with a command-line interface and a basic Linux setup to start with. This
    allows you to install only the packages and software you wish with no bloat.


