    \ 44 页。\n\nMichael Reed 是一位技术作家，他接触 Linux 已超过 15 年。他专精 Linux 开发和安全。在本期中，Michael\
    \ 将教你如何设置 Linux 系统，即使你有一台位于地球另一端的 PC 作为备份。在第 38 页开始你的设置。\n\n欢迎阅读 Linux User &\
    \ Developer 最新版，这是英国和非洲最喜爱的 Linux 源及杂志。\n\n这一切都发生在 2014 年，得益于树莓派的成功、Android 的持续统治，以及\
    \ Valve 将 Linux 引入 Steam 的惊人决定。Steam 作为 PC 端主导的数字游戏平台，拥有高达 6900 万活跃用户，Valve 还指出了运行\
    \ Linux 的 Steam Machine 客厅电脑。有超过五位不精通 Linux 的人想要接触 Linux 的一切，而学习如何与他们当前的操作系统进行双系统安装是一个极佳的起点。\n\
    \n双系统安装并不像以前那么困难了，你会惊讶于自己从当前平台启动并运行的速度有多快。在本期杂志中，我们力求无不遗漏——我们还展示了你如何在你的安卓设备甚至你的树莓派上安装双系统——从第\
    \ 23 页开始。\n\n每个月我们都会带来 16 页的最新小配件介绍以及来自全球树莓派社区的采访。如果你希望你的项目能在杂志上介绍，或者想获取特定主题的教程，请通过下方详情与我们联系。\n\
