    # 即时通讯客户端


    寻找跨所有聊天服务与朋友保持联系的最佳方式


    测评


    ## KDE Telepathy


    这款绑定 KDE 的即时通讯客户端功能非常丰富。


    ## Pidgin


    曾几何为即时通讯之王，它依然有许多压箱底技巧且社区活跃。


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_72_0.png)


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_72_1.png)


    - Telepathy 的账户管理由其核心服务处理，但也会检查本地网络。

    - Pidgin 具有高度的可配置性，取决于你的工作流或你可以利用的界面空间。


    ### 兼容性 (Telepathy - 部分 1)


    Telepathy 提供了多种不同的服务进行连接，并要求你在进入主界面之前至少选择其中一个。虽然只提供了一些热门的默认选项，但深层次的挖掘允许你访问全球范围内使用的
    30 种不同服务。


    ### 兼容性 (Pidgin - 部分 1)


    凭借丰富的初始聊天服务选择，Pidgin 可以连接到超过 20 种不同的服务，以及任何支持 XMPP 的服务。此外，对于更主要的私有服务提供了更多可用插件，而其他服务并不总是兼容。在这种情况下，Pidgin
    使用它自己的服务，这可能有点显生硬。


    ### 扩展支持 (Telepathy - 部分 1)


    遗憾的是，Telepathy 并没有大量的第三方插件支持——它并没有真正支持原生服务插件之外的内容。某些功能在每个桌面系统上都无法工作，例如通知、弹出窗口，遗憾的是
    Telepathy 上没有额外的扩展让这些功能正常运行。


    ### 扩展支持 (Pidgin - 部分 1)


    由于其流行性，有许多插件和附加组件可以实现各种不同的功能，添加额外的服务或为新会话创建弹出窗口。插件是用 C 语言编写的，Pidgin 提供了大量关于如何创建你所需内容的信息。


    ### 界面 (Telepathy - 部分 1)


    与所有的 KDE 应用一样，Telepathy 拥有符合 KDE 审美的用户友好界面。主窗口极其简单，只显示聊天所需的极简功能。而设置菜单要详尽得多，与其他应用相比提供了更多功能。


    ### 界面 (Pidgin - 部分 1)


    Pidgin 的布局看起来很好，主窗口占据了大部分空间并提供了许多选项，无需处理大量的菜单。整体美学的主要部分、联系人的列出方式以及系统字体也都很不错。


    ### 账户管理 (Telepathy - 部分 1)


    账户应用程序有些不一致——在某些方面，创建和管理账户非常容易；在另一些方面，它总是为单个服务提供全系列功能，或者提示像 Google 双重验证之类的操作。


    ### 账户管理 (Pidgin - 部分 1)


    高级模式允许通过特定服务设置不同的服务，并为每个服务提供上下文感应的菜单。你可以轻松禁用或删除账户，或者在任何额外功能需要信息以使服务正常运行时对其进行编辑。


    ### 总体 (Telepathy - 部分 1)


    KDE 是一个不错、简单的即时通讯客户端——但是，它可能太简单了。在基于 KDE 的桌面（基于 GTK）上不支持通知，特别是当你能够完全自定义账户详情时。


    ### 总体 (Pidgin - 部分 1)


    Pidgin 是一个非常稳健的全能客户端，尽管它的设计元素已经伴随它多年。该软件的新新版本可能会使其再次夺冠，但目前它仍然很优秀，仍然是最好的即时通讯客户端之一。


    img/9ee62baa445dcfe9b284d0d92f95c0bb_72_2.png)


    73 www.linuxco.uk


    # 测评


    ## 简评：对比我们的结论


    | | Empathy | Mesne | KDE Telepathy | Pidgin |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 兼容性 | 尽管只提供几个服务，但它的连接性优于社交网络选项 | 8 | 虽然提供了访问三个账户的权限，但在 Linux 上并无更优之处 | 3 | Telepathy
    默认可以连接到最多的服务，包含了最重要的几个 | 9 | Pidgin 可以通过其内置或额外的插件访问所有主要和次要服务 | 10 |

    | 扩展支持 | 它有 Pidgin 插件，但这些插件存在无法正常工作的问题 | 5 | 为此地有一些不错的附加组件，但没有能增加服务选择的 | Telepathy
    完全没有插件支持，阻止了它连接到任何其他服务 | 5 | 功能极其完善，有庞大的社区支持 | 9 |

    | 界面 | 相当简单，最大化了聊天区域，在需要之前保持设置隐藏 | 4 | 布局得相当好，尽管聊天在窗口内违背了初衷 | 一个适合任何桌面的非常简单的界面，但丢失了功能。账户布局了基础功能，高级功能被埋在深处
    | 6 | 美学上可以改进，视觉效果相当简单且布局逻辑清晰 | 8 |

    | 账户 | 由 GNOME 账户管理处理，它可以很好地处理你的系统设置 | 账户是嵌入的，但遗憾的是你只能连接其中一个 | Telepathy 与所有桌面系统的集成得并不好，但在其他方面是一个不错的聊天客户端
    | 账户可以是快速菜单或专用的管理器 | 7 |

    | 总体 | 一个可靠的聊天客户端，在大多数情况下与各种发行版和桌面集成良好 | 8 | Mesne 中有很多本该支持的功能 | 由于其压倒性的功能集，仍然是最好的聊天客户端
    | 9 |


    ## 冠军是......


    ## Pidgin


    我们进行这项测试是为了寻找 Telepathy 或 Empathy 是否能超越 Pidgin，因为后者在过去几年没有重大开发。Pidgin 尽管非常出色，但显得有些过时，某些问题一直没有解决。我们认为它仍然是目前最好的之一。Empathy
    和同类产品近期表现活跃，增加了新服务、更好的自定义选项，并且让连接变得更加快速快捷。


    '
