- md: "\n# Raspberry Pi music server\n\nMusic Daemon (MPD) is a piece of software\
    \ that acts as both a music player and a music server. It can output audio to\
    \ any sound connected to the system, and be controlled by any MPD client. Clients\
    \ are available for almost any platform, including iOS and Android. Android can\
    \ also output audio to a stream, which can be used by multiple clients. This is\
    \ ideal for people with large music libraries that can't fit on it.\n\n## Step\
    \ 04\n\n## Settings\n\n## Streaming\n\n## Single mode\n\n## Consume mode\n\n![](img/9ee62baa445dcfe9b284d0d92f95c0bb_62_0.png)\n\
    \n- 01 Install the required software\nLog in to the raspberry system using the\
    \ username and raspberry password. First find the IP address of your device and\
    \ note it down. Get the latest packages using the command `apt-get update`. Then\
    \ install MPD using `sudo apt install mpd`. There may be some errors, but they\
    \ are fine to ignore.\n\n## Step 06\n\n![](img/9ee62baa445dcfe9b284d0d92f95c0bb_62_1.png)\n\
    \n- 02 Add music\nThe default music directory for mpd is `/var/lib/mpd`. You will\
    \ want to make this folder writable and executable so that the mpd user can write\
    \ to it. To do this use the command `sudo chmod 777 /var/lib/mpd`. Then you might\
    \ find some music to copy from your Linux computer and use scp to copy it: `scp\
    \ -r /path/to/music/* pi@ip_address:/var/lib/mpd/`\n\nAbove stream music to your\
    \ mobile device using a compatible client\n\n## 05 Configure stream\n\nAt the\
    \ moment, the only output is 3.5 mm on the Pi. To set it to HDMI, you have to\
    \ find the hdmi output that is commented out. Uncomment it, and change the format\
    \ to `flac`. Our music format is as follows:\n\n```\naudio_output = {\n  type\
    \ = \"http\"\n  encoder = \"vorbis\"\n  port = \"8000\"\n  quality = \"5\"\n \
    \ format = \"44100:2\"\n}\n```\n\nSave the changes and restart mpd.\n\n## 07 Connect\
    \ to the server\n\nOnce in the MPD app, use WLAN-based connection to access your\
    \ server. Then fill in the 'Streaming' field with the IP address of your Pi and\
    \ in the 'Host' field with the default. The default is nothing, so go to Raspberry\
    \ Pi. We need to connect to the music library as it has not been connected yet.\
    \ To do this go to Settings, select the option, and click 'Refresh'.\n\n## 08\
    \ playing music\n\nPress the 'Artists' button in the bottom bar to go to music.\
    \ Long-press artist and select Add. If you have your favorites connected, you\
    \ will hear music coming out of them. Use the volume slider on the MPD player\
    \ to adjust the\n\n## 09 Set up a client\n\nSetting up a client on each device\
    \ is difficult but the process is terribly easy. For example, we suggest Sonora,\
    \ and for iOS we suggest MPD. To set up MPD on Android go download from the Play\
    \ Store.\n\n- 04 Configure the daemon\nTo edit /etc/mpd/mpd.conf (using nano)\
    \ make changes to let the daemon listen on all interfaces so we can use MPD clients\
    \ from other devices. To do this by changing the line:\n\n```\nbind_to_address\
    \ = \"localhost\"\n```\nto\n```\nbind_to_address = \"any\"\n\nA very simple MPD\
    \ setup. Possible improvements include:\n- Putting music on an external hard drive\
    \ so you have more space\n- Tweaking the settings to the Pi's CPU (look at the\
    \ 'encoder' section of the user manual...)\n- Setting up a Samba server to give\
    \ access to the music library over the network.\n\nMusic Daemon can connect to\
    \ the system, and create a client – almost instantly\n\n# Tutorial Use an accelerometer\
    \ with Raspberry Pi\n\nRussell Barnes is the editor of Linux User Magazine and\
    \ a keen Python programmer. Adding tilt technology to your next Raspberry Pi project\
    \ is easier than you think.\n\n## Skills to learn\n\n### 1 I2C\nIt's very useful\
    \ and convenient form of device connectivity and add-ons.\n\n### 2 Pygame\nThe\
    \ core mechanics of Pygame are straightforward and make programs very easy to\
    \ prototype.\n\n## Components list\n\nHow to get prototyping…\n- ADXL accelerometer\n\
    - Latest Raspberry Image\n- Breadboard\n- Male-to-female prototyping cables\n\
    - Soldering iron\n\nWe use accelerometers every day. They're in our phones, game\
    \ controllers and help keep us on the ground and planes in the air. Beyond, we\
    \ will be using an ADXL345 module to create a prototype for Space Invaders-style\
    \ game which we want to return to later. It won't take more than 15 minutes of\
    \ soldering, the physical setup is just beginning. We will be placing the ADXL345\
    \ on the Raspberry Pi's GPIO using I2C. First of making sure your Pi is up to\
    \ date. Open a terminal window and type: `sudo apt-get update && sudo apt-get`\n\
    \n## 01 install i2c-tools\n\nFirst, ensure your Pi can use I2C to talk to the\
    \ ADXL345 module. In a terminal, use `apt-get install i2c-tools` followed by `sudo\
    \ nano /etc/modprobe.d/raspberry-pi.list`. This will enable the interface 'i2c-cm2807'.\n\
    \nPress Ctrl+X, then Enter to exit. Edit the /etc/modules file with nano, adding\
    \ `i2c-cm2807-dev` to ensure it loads every time boot. Reboot to finish the operation.\n\
    \n## Step 02\n\n## Connect the hardware\n\nSince we're using I2C, we will need\
    \ to install the smbus library. Type `sudo apt-get install python-smbus` in the\
    \ terminal. Then we connect the accelerometer to the Pi with male-to-female prototyping\
    \ cables. The connect pins are marked on the ADXL345, so check our pictures for\
    \ where to plug into the Pi\n\n## 03 final checks\n\nWith accelerometer attached\
    \ to Pi, open a terminal window and type `sudo apt-get -y`. At the end assumes\
    \ you're using a Rev 2 Pi - replace it if '0' is shown. You should see some numbers\
    \ that the ADXL345 has been recognized. Finally, we'll use Git to grab the project\
    \ type into the following:\n\n- `sudo apt-get install git`\n\nThe finished project\
    \ uses free images from opencart.com.\n\n# Use an accelerometer with Raspberry\
    \ Pi\n\nStep 02\n\n## We'll be using an ADXL345 accelerometer\n\nThe code below:\n\
    \n```python\nimport pygame\nimport time\nimport smbus\nimport sys\n\n# Initialize\
    \ pygame and the screen\npygame.init()\nscreen = pygame.display.set_mode((800,\
    \ 600))\npygame.display.set_caption(\"ADXL345 Accelerometer\")\nclock = pygame.time.Clock()\n\
    \n# Initialize I2C bus (usually 1 on Raspberry Pi)\ntry:\n    bus = smbus.SMBus(1)\n\
    except PermissionError:\n    print(\"I2C bus not found\")\n    sys.exit(1)\n\n\
    # ADXL345 registers\nADXL345_ADDR = 0x53\nDATA_X = 0x32\nDATA_Y = 0x34\nDATA_Z\
    \ = 0x36\nPOWER_CTL = 0x2D\nDATA_FORMAT = 0x31\n\n# Set ADXL345 to measurement\
    \ mode\nbus.write_byte_data(ADXL345_ADDR, POWER_CTL, 0x08)\nbus.write_byte_data(ADXL345_ADDR,\
    \ DATA_FORMAT, 0x00) # Set range to +/- 2g\n\ndef get_acceleration():\n    # Read\
    \ X, Y, Z axis data\n    x_low = bus.read_byte_data(ADXL345_ADDR, DATA_X)\n  \
    \  x_high = bus.read_byte_data(ADXL345_ADDR, DATA_X + 1)\n    x = (x_high << 8)\
    \ | x_low\n\n    y_low = bus.read_byte_data(ADXL345_ADDR, DATA_Y)\n    y_high\
    \ = bus.read_byte_data(ADXL345_ADDR, DATA_Y + 1)\n    y = (y_high << 8) | y_low\n\
    \n    z_low = bus.read_byte_data(ADXL345_ADDR, DATA_Z)\n    z_high = bus.read_byte_data(ADXL345_ADDR,\
    \ DATA_Z + 1)\n    z = (z_high << 8) | z_low\n\n    # Handle 16-bit signed integers\n\
    \    if x > 0x7FFF: x -= 65536\n    if y > 0x7FFF: y -= 65536\n    if z > 0x7FFF:\
    \ z -= 65536\n\n    return x, y, z\n\n# Main loop\nrunning = True\nwhile running:\n\
    \    screen.fill((0, 0, 0)) # Black background\n\n    for event in pygame.event.get():\n\
    \        if event.type == pygame.QUIT:\n            running = False\n\n    x,\
    \ y, z = get_acceleration()\n    \n    # Display acceleration on screen\n    font\
    \ = pygame.font.SysFont(None, 48)\n    text_x = font.render(f\"X: {x}\", True,\
    \ (255, 255, 255))\n    text_y = font.render(f\"Y: {y}\", True, (255, 255, 255))\n\
    \    text_z = font.render(f\"Z: {z}\", True, (255, 255, 255))\n    \n    screen.blit(text_x,\
    \ (50, 50))\n    screen.blit(text_y, (50, 100))\n    screen.blit(text_z, (50,\
    \ 150))\n\n    pygame.display.flip()\n    clock.tick(60)\n\npygame.quit()\n```\n"
  mdcn: "\n\n# 树莓派音乐服务器\n\nMusic 守护进程 (MPD) 是一款既作为音乐播放器又是音乐服务器的软件。它可以将音频输出到系统连接的任何音频设备，并由任何\
    \ MPD 客户端进行控制。几乎所有平台都有相应的客户端，包括 iOS 和 Android。Android 还可以将音频输出到流中，供多个客户端使用。这对于拥有无法存放在本地大型音乐库的人来说是理想的。\n\
    \n## 步骤 04\n\n## 设置\n\n## 流媒体传输\n\n## 单模式\n\n## 消费模式\n\n![](img/9ee62baa445dcfe9b284d0d92f95c0bb_62_0.png)\n\
    \n- 01 安装所需软件\n使用用户名 raspberry 和密码 登录树莓派系统。首先找到你设备的 IP 地址并记录下来。使用命令 `apt-get update`\
    \ 获取最新的包。然后使用 `sudo apt install mpd` 安装 MPD。可能会出现一些错误，但可以忽略。\n\n## 步骤 06\n\n![](img/9ee62baa445dcfe9b284d0d92f95c0bb_62_1.png)\n\
    \n- 02 添加音乐\nmpd 的默认音乐目录为 `/var/lib/mpd`。你需要将此文件夹设置为可写和可执行，以便 mpd 用户可以写入。为此使用命令\
    \ `sudo chmod 777 /var/lib/mpd`。然后你可能从你的 Linux 电脑上找到一些音乐并使用 `scp` 进行复制：`scp -r\
    \ /path/to/music/* pi@ip_address:/var/lib/mpd/`\n\n使用兼容的客户端向移动设备流传输音乐\n\n## 05\
    \ 配置流传输\n\n目前唯一的输出是树莓派上的 3.5 mm 接口。要将其设置为 HDMI，你需要找到被注释掉的 HDMI 输出。取消注释并将格式更改为\
    \ `flac`。我们的音乐格式如下：\n\n```\naudio_output = {\n  type = \"http\"\n  encoder = \"\
    vorbis\"\n  port = \"8000\"\n  quality = \"5\"\n  format = \"44100:2\"\n}\n```\n\
    \n保存更改并重启 mpd。\n\n## 07 连接到服务器\n\n进入 MPD 应用后，使用基于 WLAN 的连接访问你的服务器。随后在“Streaming”（流媒体）字段中填入你树莓派的\
    \ IP 地址，在“Host”（主机）字段中保持默认。默认值为空，所以选择 Raspberry Pi。我们需要连接到音乐库，因为它尚未连接。为此，进入“Settings”（设置），选择该选项并点击“Refresh”（刷新）。\n\
    \n## 08 播放音乐\n\n点击底部栏的“Artists”（艺术家）按钮进入音乐界面。长按艺术家并选择“Add”（添加）。如果你连接了收藏，你将听到音乐从中传出。使用\
    \ MPD 播放器上的音量块来调整\n\n## 09 设置客户端\n\n在每个设备上设置客户端很困难，但过程非常简单。例如，我们建议使用 Sonora，对于\
    \ iOS 我们建议使用 MPD。要在 Android 上设置 MPD，请从 Play Store 下载。\n\n- 04 配置守护进程\n使用 nano\
    \ 编辑 `/etc/mpd/mpd.conf`，进行更改让守护进程监听所有接口，这样我们就可以从其他设备使用 MPD 客户端。通过更改以下行来实现：\n\n\
    ```\nbind_to_address = \"localhost\"\n```\n改为\n```\nbind_to_address = \"any\"\n\
    ```\n\n一个非常简单的 MPD 设置。可能的改进包括：\n- 将音乐放在外部硬盘上获得更多空间\n- 针对树莓派的 CPU 调整设置（查看用户手册中的\
    \ 'encoder' 部分……）\n- 设置 Samba 服务器以便通过网络访问音乐库。\n\nMusic 守护进程可以连接到系统并创建客户端——几乎瞬间完成\n\
    \n# 教程 使用树莓派使用加速度计\n\nRussell Barnes 是 Linux User Magazine 的编辑，也是热情的 Python 程序员。在你的下一个树莓派项目中添加倾斜技术比你想的要简单。\n\
    \n## 需要学习的技能\n\n### 1 I2C\n它是设备连接和外扩展的一种非常实用且方便的形式。\n\n### 2 Pygame\nPygame 的核心机制非常直观，使程序原型设计非常容易。\n\
    \n## 组件列表\n\n如何获取原型设计……\n- ADXL 加速度计\n- 最新版本的树莓派镜像\n- 邦板\n- 公对母原型线\n- 烙铁\n\n我们每天都使用加速度计。它们存在于我们的手机、游戏控制器中，并帮助我们保持在地面上、飞机保持在空中。此外，我们将使用\
    \ ADXL345 模块创建一个“太空侵略者”风格的游戏原型，我们稍后会返回它。焊接时间不会超过 15 分钟，物理设置才刚刚开始。我们将使用 I2C 将 ADXL345\
    \ 放置在树莓派的 GPIO 上。首先确保你的树莓派已是最新。打开终端窗口并输入：`sudo apt-get update && sudo apt-get`\n\
    \n## 01 安装 i2c-tools\n\n首先，确保你的树莓派可以使用 I2C 与 ADXL345 模块通信。在终端中，使用 `apt-get install\
    \ i2c-tools`，然后执行 `sudo nano /etc/modprobe.d/raspberry-pi.list`。这将启用 'i2c-cm2807'\
    \ 接口。\n\n按下 Ctrl+X，然后按 Enter 退出。\n\n"
