    # Add or just restore Windows to Linux


    # Add Windows to a system that didn''t always need it


    In some ways, it''s currently a little easier to add Windows to a system already
    running Linux than it is not the other around. Boot loaders invoke any kernel
    privileges, giving you freedom the hardware, which in this case means installing
    Windows. The main issue arising from this is that Windows will overwrite the Master
    Record, meaning you won''t be able to boot into Linux right after the installation.
    We''ll cover a quick way to recover your GRUB bootloader after installation, but
    for a more in-depth guide, look towards the end of this tutorial.


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_28_0.png)


