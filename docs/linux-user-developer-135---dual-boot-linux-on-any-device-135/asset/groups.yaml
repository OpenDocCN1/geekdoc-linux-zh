    vcf 文件——并在用户或组之间共享联系人。


    ## 09 文件加密

    安全和隐私在近年来已成为关注焦点。请注意，一旦启用加密，如果你忘记了密码，默认情况下无法找回数据。为了防止此类损失，你可以在 ownCloud 管理员设置中恢复密钥。


    ## 10 Shorty-plugin

