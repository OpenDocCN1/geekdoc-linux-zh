    ## OPEN SOURCE


    ### November rounded out the year with a shiny Linux 3.12 kernel

    and certain conditions, including the need for the ''boot'' processor (processor
    number zero, in general) to keep its timer ticking for housekeeping(scheduling)
    etc. purposes.


    June featured an awesome patch for series from Will Dean (who has a career in
    stand-up comedy) and some systems (to take some reason) introduced ''Remove empty
    IPC and Bogops value''; The ''Bogops value'' recorded by Mike Wood is a simple
    calculation (of the idle loop, depending) of how quickly a processor can finish
    a bout of calls to no-ops completing empty values, but on many systems mean less
    (especially ARM devices) it with the architecture - for example - ARM''s Architected.


    July brought another new kernel. Linux 3.11, which was released for both Xen and
    KVM-based virtualisations for 64-bit architectures, July and August are quite
    months since, since they are mid-year when many people are on summer holidays.
    August did, however, with the (eventual) merging of the distributed file system
    into the kernel for many years. Just.


    November introduced other great new features in the 3.11 development kernel, which
    was named ''Linux for Workgroups'' in honour of the Microsoft Windows 3.11 release
    ''Windows for Users''. Linux had wanted to launch 3.11 on the 22nd anniversary
    of the original ''hello''; everybody introductory message but instead settled
    for a version RC installed. The final release of 3.11 was not too soon thereafter.


    September may also have been named ''memory month'', with a focus on the virtual
    memory subsystem featuring in Linux 3.12, in particular of NUMA support which
    is important in larger microprocessors where memory is very much distributed across
    CPUs, and seen by all CPUs equally, with differing.


    October included one class of new features - ARM''s kernel patches (from Origin),
    and support for a new ''powerdev'' driver in rename2 which solved the problem
    of atomicity by distributing thermal management.


    November rounded out the year with a shiny Linux 3.12 kernel, which was released
    with the introduction of RCU switching from one (in a laptop) to without restarting
    the desktop.


    The merging of Intel''s powerdev, the new ''inflatibles'' packet filter, and an
    eventual Linux 4.0.


    That''s all for this. Next time, we will look ahead and make some predictions
    for the next year.


    ## Ongoing development


    Alexander Courbot posted patches providing initial support for ARM''s ''Trusted
    Foundations'' firmware - this runs within the ''TrustZone'' zone execution environment
    of the ARM processor, which is isolated from the Linux operating system.


    The Trusted Foundations ''TEE'' (Trusted Execution Environment) which runs in
    the TrustZone on ARM processors provides support for various standardised interfaces
    that an OS can easily access. These feature support across different ARM-based
    devices. Other device method might include booting embedded devices. Linux will
    get a new kernel in March to take over the role, as James Morris has announced,
    with other features of the security system that will benefit users.


    Min Kim has requested that ''zramalloc'' patches for the 3.8 kernel be merged
    into the main Linux kernel proper. The code enables Linux to allocate (to) compressed
    memory that is stored in a compressed block. This is especially useful for the
    billions of embedded devices with limited memory capacity. These techniques are
    already in production on Android.


