    ……让教师学习并为学生提供教育工具。他认为认为 Linux 会让他们宾如归归。使用 Linux 将有助于孩子们摆离对 Windows 或操作系统环境那种习成常的熟悉，并帮助他们进行更多的质疑、探究和调查。


    因此，从这些早期阶段仍有可以的教训。其中一个问题是没有简单的方法来编写 BASIC 程序，而且直到最近，让学生输入程序并没有被实际使用。“得益于那些追赶热点的软件公司，我们有了一种适合家庭的编程学习方法，而且很多学校并不习惯于运行程序。”


    这在某种程度上是这样。在教师应对信息与技术（ICT）的培训方面还需要进一步的共识。在许多学校中，这不仅是因为首先水平很低，其次是因为缺乏人员配置。通常情况下，可以由学生来教
    ICT，因为他们发现自己做这很难。如果你打算引入一些真正的编程并深入研究操作系统，那么需要在教学团队中拥有具有合理计算机背景的人，而大多数学校并没有这种背景。


    ## ## BBC 的新举措


    据说 BBC 将希望改变现状，但正如 BBC 技术特记者 Rory Kelly-Jones 所指出的，“许多教师认为他们缺乏教学编码所需的技能和材料。” MyKindCrowds
    董事总经理 Neil Keerman 的一项调查发现，68% 的人……


    与其与计算公司合作并在另一台机器上贴上标牌，进一步认为 BBC 在帮助……方面会做得更好。


