    # Instant messaging clients


    Find the best way to keep in touch with friends across all chat services


    REVIEW


    ## KDE Telepathy


    The KDE-bound instant messaging client has a huge amount going on.


    ## Pidgin


    Once an IM king, it has still tricks up its sleeve and an active community.


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_72_0.png)


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_72_1.png)


    - Account management in Telepathy is handled by the core services in mind, but
    will also check the local network.

    - Pidgin is highly configurable depending on your work flow or how much real estate
    you have to work with.


    ### Compatibility (Telepathy-part 1)


    Telepathy offers the wide variety of different services to connect to, insisting
    that you have at least some before getting the main interface. Few popular defaults
    are offered to start with, but deeper digging allows you to access 30 different
    services used by people all over the world.


    ### Compatibility (Pidgin-part 1)


    With great selection of chat services to start with, Pidgin can connect to over
    20 different services, and anything else supports XMPP. More plugins are also
    available for the more major proprietary services, while others are not always
    compatible. In this case, Pidgin uses its own service, which can be a little slick.


    ### Add-support (Telepathy-part 1)


    Unfortunately, there''s not a huge amount of third-party plug-support in Telepathy
    - it isn''t really support anything than first-party service plugins. Some don''t
    work on every desktop, such as notifications, pop-ups, it''s a bit of a shame
    that there''s no addition on Telepathy to get these features working.


    ### Add-support (Pidgin-part 1)


    Due to its popularity, there are plenty of plugins and add-ons for a wide variety
    of different functions to add extra services or create pop-ups for new conversations.
    Plugins are written in C, and Pidgin has plenty of information on how to create
    what you want.


    ### Interface (Telepathy-part 1)


    Like all KDE applications, Telepathy has a user-friendly interface that fits the
    KDE aesthetic. The main windows are incredibly simple, showing the minimal features
    you need to chat with. The Settings menu on the other is much more elaborate,
    offers far more functions compared to others.


    ### Interface (Pidgin-part 1)


    Pidgin seems laid out, with the majority of the main window and plenty of options
    without dealing through lots of menus. Major parts of the overall aesthetic are
    nice as well as the way contacts are listed and system-wide fonts.


    ### Account management (Telepathy-part 1)


    The account applications are a bit inconsistent - in some ways it''s very easy
    to create and manage your accounts. In other ways it always offers the full range
    of features for individual services or prompts for something like two-step verification
    from Google.


    ### Account management (Pidgin-part 1)


    Advanced allows the potential to set up different services through specific services
    with context-sensitive menus for each. You can easily disable or remove accounts
    or edit them if any extra feature requires information in order for the service
    to work properly.


    ### Overall (Telepathy-part 1)


    KDE is a nice, simple IM client - however, it might be a bit too simple. Not supporting
    notifications on KDE based desktops (GTK-based), especially if you are able to
    fully customise your account details.


    ### Overall (Pidgin-part 1)


    Pidgin is a very solid all-around client, although its design elements have been
    with it for years. A newer version of the software might have made the best again,
    but for now it''s still good, remains one of the best instant messaging clients.


