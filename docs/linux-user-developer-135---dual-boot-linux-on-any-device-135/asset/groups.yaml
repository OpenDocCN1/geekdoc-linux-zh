    Your music must be stored in the directory hosted on your Raspberry Pi. Once the
    daemon is set up, you can access it from any mobile device or computer


    ![](img/9ee62baa445dcfe9b284d0d92f95c0bb_61_0.png)


    Android & iOS While there are lots of applications available for this project,
    we recommend MPoD for Android and MPoD for Apple''s iOS devices


    # Skills to learn


