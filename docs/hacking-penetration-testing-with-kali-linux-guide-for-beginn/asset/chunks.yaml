    ================


       Name                             Disclosure Date  Rank    Description


       ----                             ---------------  ----    -----------


       auxiliary/scanner/ftp/ftp_login                   normal  FTP Authentication
    Scanner


    What the above command does is that it turns on the ftp authentication scanner.
