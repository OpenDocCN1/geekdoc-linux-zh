    can run the following command:


    Ls


    After that, change directory to the /etc directory by typing the following command:


    cd etc


    Again, change to the init.d directory as follows, and then list the contents of
    the directory:


    cd init.d


    ls


    Assuming that you had saved your script file with the name anything.sh, you can
    run the following command so as to upload it:


