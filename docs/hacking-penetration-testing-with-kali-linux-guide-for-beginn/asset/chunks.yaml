    information as far as the ftp-login scanner is concerned. You will be presented
    with the option which you are able to use with the exploit. Here is the command:


    info auxiliary/scanner/ftp/ftp_login


    To begin using the ftp_login exploit, just run the following command:


    use auxiliary/scanner/ftp/ftp_login


    The above command will take you inside the “ftp_login” exploit, so just run the
    command given below so that you may know how the target can be set. You may be
    confused by this because there exists a number of options, only four of which
    will be used. Here is the command:


    msf auxiliary(ftp_login) > show options


    The “show options” command given above will give options as shown below:


    ![](images/00008.jpeg)


