    ```bash

    sudo ./fluxion

    ```


    The command should now run okay, and the questions asked should be simple. In
    the case of the wireless adapter, select the one you will like to perform monitoring
    on. When it comes to questions for the channels, just choose all questions, unless
    you hsve some specific channel in your mind, and this should be known as the target
