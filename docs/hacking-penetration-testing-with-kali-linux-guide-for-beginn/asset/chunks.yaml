    # Chapter 10- Password Cracking


    It is possible for you to carry out password cracking attacks from Kali Linux.
    Kali Linux has many tools which can help you do this. Let us discuss how this
    can be done.


    ## Using Hydra


    This is a tool for a brute force attack, and it supports many services. The tool
    is easy and fast to use, and it makes it easy for us to install new modules. This
    tool can be used by those who need to gain some unauthorized access into a system
    from a remote location.


    For us to carry out the brute force attacks, the `Hydra` should be provided with
    a list of passwords. There are many sources of password lists out there. In this
    case, let us choose the default one provided by John the Ripper. You can also
    Google for a password list online.


    The `Hydra` tool comes pre-installed, but you can use the deposit so as to install
    it in a mini version. You only have to run the following command:


    ```

    apt-get install hydra-gtk

    ```


    To access the `Hydra` too, you should navigate as follows:


    ” Applications -> Kali Linux -> Passwords Attacks -> Online Attacks -> hydra-
    gtk “


    You will be presented with a screen which looks as shown below:


    ![](images/00010.jpeg)


    We now want to carry out a brute force attack on a particular account and you
    will learn the importance of setting a strong password for your account.


    Fill in the necessary details in the “Target” tab. In the case of the “Target
    List,” feel free to add a list of addresses which you are targeting to perform
    an attack. Once done, click on the “Passwords” tab.


    You can fill the email address which is to be tested and the path which leads
    to your dictionary. Note that there is an archive with a wordlist which can be
    found in the `/usr/share/wordlist/`. For you to use this, you should first extract
    it.


    In the `Tuning` tab, you can set the number of tasks to be done concurrently,
    the timeout, and use of the proxy.


    In the `Specific` tab helps us configure how the HTTP proxy will be used. Skip
    this to the “Start” tab. Move to the bottom left corner and then click on “Start”
    so that the attack can be started.


    ## Using John the Ripper


    This is also a free tool for password cracking. In Linux, the hash for the password
    is stored in the file `/etc/shadow`. To demonstrate how this tool can be used
    for password cracking, we will create a new user and then assign him a password.
    This user will also be added to the sudo group which is `assign /bin/bash` as
    the shell.


    Let us first create the user, and assign him a password by running the command
    given below:


    ```

    root@kali:~# useradd -m john -G sudo -s /bin/bash

    root@kali:~# passwd john

    ```


    Note that we have created a user named “john” and a password “john” for his account.


    We can then go ahead and run the `unshadow` command which will help us to combine
    the file `/etc/passwd` and the file `/etc/shadow` for the purpose of creating
    a single file which will have a list of usernames and passwords. Run the following
    commands sequentially:


    ```

    # unshadow

    # unshadow /etc/passwd /etc/shadow > /root/johns_passwd

    # ls –ltrah /usr/share/john/password.list

    ```


    That is it! If we get a dictionary file, we can go on with the cracking. The tool
    comes with its own password file which can be located at `/usr/share/john/password.lst`.
    Just run the following command:


    ```

    # john --wordlist=/usr/share/john/password.list /root/johns_password

    ```


    To see the passwords which have been cracked, just run the `john --show` command
    as shown below:


    ```

    # john --show /root/johns_passwd

    ```


    That is it!


