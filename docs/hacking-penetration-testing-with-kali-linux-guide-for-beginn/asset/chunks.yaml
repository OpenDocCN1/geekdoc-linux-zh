    # 第 3 章 检查 IP 地址位置


    你可以在 Kali Linux 机器上学习本地和外部 IP 地址。确定此 IP 地址最简单的方法是使用网络浏览器。网上有很多网站可以告诉你机器的 IP 地址，例如
    `linuxconfig.org`。


    你也可以使用命令行来获取你的外部 IP 地址。在这种情况下，你应该使用 `curl` 或 `wget` 命令。右键点击你机器的桌面并选择“打开终端”。然后你可以运行以下命令来获取外部
    IP 地址：


    ```bash

    echo $(wget -qO - https://ipify.org)

    ```

    OR

    ```bash

    echo $(curl -s https://ipify.org)

    ```


    此外，了解 Kali Linux 机器的内部 IP 地址也是好的。在这种情况下，你可以使用 `ip` 或 `ifconfig` 命令。如下所示：


    ```bash

    ifconfig | grep -w inet | awk ''{ print $2}''

    ```

    OR

    ```bash

    ip a | grep -w inet | awk ''{ print $2}''

    ```


