    # 第 4 章- MAC 地址欺骗 (MAC Address Spoofing)


    `macchanger` 是一个用于更改 Linux 中 MAC 地址的工具。在 Kali Linux 中，该工具已预装，但在其他 Linux 发行版中，你需要手动安装。该工具可以帮助你伪造
    `Wlan0` 和 `eth0` 等接口的 MAC 地址。


    MAC 代表“多媒体访问控制”（Multimedia access control）。它是唯一标识硬件的地址。每当你连接到 WiFi 或任何其他网络时，你的设备都应该被唯一标识，这就是
    MAC 地址的作用。每个设备都有唯一的 MAC 地址，且无法唯一地更改，但你可以在一段时间内对其进行伪造。


    MAC 地址欺骗在黑客攻击中有许多优势。通过它，你可以绕过 MAC 过滤安全限制。要连接到 WiFi 网络，你的设备必须在允许连接的设备列表中。在你的情况下，你应该绕过这种过滤。此外，如果你需要攻击某些地方的路由器，你应该伪造你的
    MAC 地址 ID，以免管理员发现你并封锁你的设备。


    在本章中，我们将指导你如何伪造 `wlan0` 接口的 MAC 地址，这对于连接无线网络很有帮助。首先，运行以下命令关闭接口：


    ```bash

    ifconfig wlan0 down

    ```


    现在接口已关闭，我们可以继续手动更改 MAC 地址的 ID。这需要运行以下命令：


    ```bash

    macchanger –m 12:12:12:12:12:12 wlan0

    ```


    注意，上述命令使用的地址只是一个虚假地址。这就是手动更改地址的方法。然而，你也可以自动更改地址。你只需要执行下面提供的命令即可：


    ```bash

    macchanger -a wlan0

    ```


    如果你需要随机更改此地址，只需将上述命令中的 `-a` 选项替换为 `-r` 选项。更改完成后，你应该重新启用接口。你只需要运行以下命令：


    ```bash

    ifconfig wlan0 up

    ```


    该命令将启动应用了新更改的 `wlan0` 接口。你可以运行以下命令来关闭欺骗状态：


    ```bash

    ifconfig wlan0 down

    ifconfig -p wlan0 // -p 意味着永久生效

    ifconfig wlan0 up

    ```


    这样你就更改了系统的 WiFi 地址。除了 `wlan0` 接口外，你还可以伪造用于以太网连接的 `eth0` 接口。要这样做，只需像下面所示将 `wlan0`
    替换为 `eth0`：


    ```bash

    ifconfig eth0 down

    macchanger -r eth0

    ifconfig eth0 up

    ```


    # 第 5 章- 扫描网站漏洞


    在开始攻击网站之前，先对其进行扫描并识别其弱点是明智的。这将使你更容易攻击网站。


    现有很多工具可以帮助你扫描网站漏洞。`nikto` 就是此类工具的一个示例。使用该工具时，它会扫描网站并报告你可以利用的弱点。让我们演示如何在 Kali Linux
    中使用 `nikto` 扫描网站漏洞。


    首先启动 Kali Linux 虚拟机。一旦运行，导航到 Kali Linux -> 漏洞分析 (Vulnerability Analysis) -> 杂项扫描器
    (Misc Scanners) -> `nikto`。该工具提供了许多选项，我们将使用下面提供的：


    ```bash

    nikto -h <IP or hostname>

    ```


    ### 扫描 Web 服务器


    我们将从网络中运行的一个安全服务器开始。http 服务应在另一台机器上启动。该机器没有托管任何网站，仅只是一个 Web 服务器。输入以下命令进行扫描：


    ```bash

    nikto -h 192.168.1.104

    ```


    `nikto` 工具将响应并提供大量信息。


    ![](img/0006.jpeg)


    首先，你被告知这是一个 Apache 版本 2.2.12 服务器。在下方，你可以看到报告了带有 OSVDBDB 前缀的漏洞。这代表“开源漏洞数据库”（Open
    Source Vulnerability Database）。这是一个维护已知漏洞的数据库。


    现在是时候我们扫描网站并查看漏洞了。在这种情况下，我们将扫描一个名为 `sitescan.com` 的网站。输入以下命令：


    ```bash

    nikto -h sitescan.com

    ```


    再次，工具将响应大量信息。首先，它识别出服务器是 Apache，然后开始识别系统中的漏洞。注意 `OSVDB` 数据库保留在 `www.osvdb.org`
    网站上，如果你需要查看上述漏洞，只需打开该网站。你可以从该网站学习更多关于该网站漏洞的知识。


    工具识别了漏洞 `OSVDB-877`。要了解其含义，你只需将此引用编号粘贴到搜索函数中，系统就会为你检索出一个页面。


    然后你可以继续扫描你可能感兴趣并想要的其他网站。再次，你扫描网站的命令应该遵循下面的语法：


    ```bash

    nikto -h websitename

    ```


    在扫描第二个站点后，`nikto` 工具给出了漏洞。如你从上面的输出所示；我们的网站使用的是微软的 IIS 8.5 服务器，而不是上一次扫描时的 Apache
    服务器。工具还为我们列出了其他漏洞。

