    at which this can be useful. We will use the –D option so as to specify the database
    we are interested in, and then tell the sqlmap to list the tables by use of the
    –tables option. Your command should then be as follows:


    sqlmap -u http://testphp.productweb.com/showproducts.php?cat=1 -D acuart –tables


    You will get the list of tables which are available in your database. We will
    then make use of the same approach so as to get the columns. These can be obtained
    by use of the “—columns” option. We are interested in the table named “users,”
    which has a list of names and passwords for the registered users. The final command
    should then be as shown below:


    sqlmap -u http://testphp.productweb.com/showproducts.php?cat=1 -D acuart -T users
    --columns


    Data


    We should now get data from more of the available columns. We will still use the
    –D to specify the database, -T to specify the table, and –C to specify the column.
    The data from the specified tables will then be obtained by use of the –dump option.
    We will have to enter multiple columns, and then use commas so as to separate
    them. Our final command should then be as shown below:


    sqlmap -u http://testphp.productweb.com/showproducts.php?cat=1 -D acuart -T users
