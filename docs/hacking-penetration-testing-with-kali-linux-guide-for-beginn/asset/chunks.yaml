    # Chapter 3- Checking for IP Address Location


    It is possible for you to learn the local and the external IP address in a Kali
    Linux machine. The simplest way to determine this IP address is by use of the
    web browser. There are many sites online which can tell about the IP address of
    your machine such as linuxconfig.org.


    You can also use the command line so as to learn your external IP address. In
    this case, you should use the curl or the wget commands. Right click on the desktop
    of your machine and then choose “Open Terminal.” You can then run the following
    commands so as to know the external WAN IP address:


    # echo $(wget -qO - https://api.ipify.org)


    OR


    # echo $(curl -s [https://api.ipify.org](https://api.ipify.org))


    Also, it is good for you to be aware of the internal IP addresses for your Kali
    Linux machine. In this case, you can use the “ip” or the “ifconfig” commands.
    These are shown below:


    # ifconfig | grep -w inet | awk ''{ print $2}''


    OR


    # ip a s | grep -w inet | awk ''{ print $2}''


    Despite that, it is possible for you to learn the geographical location of a certain
    IP address. Let us demonstrate how this can be done:


    Begin by firing up your Kali Linux system. In this case, we will be using a MaxMind
    database so as to determine the location of the IP address. This is a company
    which has a database with the location of all the IP addresses. You can use its
    database to learn the GPS coordinates the area code, the zip code, and the country
    for a particular IP address.


    One the Kali Linux system is up, go ahead and use the wget command so as to download
    the MaxMind database. You only have to run the following command:


    wget -N -q [http://geolite.maxmind.com/download/geoip/database/GeoLiteCity.dat.gz](http://geolite.maxmind.com/download/geoip/database/GeoLiteCity.dat.gz)


    The command will download the database for you. Note that the database is downloaded
    in a zipped format, and this calls for you to unzip it. The unzipping can be done
    by use of the gunzip (gzip) command as shown below:


    gzip -d GeoLiteCity.dat.gz


    To see if the database is available, you can list to see the contents which are
    available in the directory. This is shown below:


    ls -alh GeoLiteCity.dat


    The database should be part of the contents of the directory. A Python script,
    commonly known as “Pygeoip” is used for reading the database. We should now download
    and then install this tool. We will use the wget command so as to download this
    tool as shown below:


    wget [http://pygeoip.googlecode.com/files/pygeoip-0.1.3.zip](http://pygeoip.googlecode.com/files/pygeoip-0.1.3.zip)


    Also, this file comes in a zipped format, and this calls for you to use the unzip
    command to unzip the file as shown in the command given below:


    unzip pygeoip-0.1.3.zip'
