    The Specific tab helps us configure how the HTTP proxy will be used. Skip this
    to the “Start” tab. Move to the bottom left corner and then click on “Start” so
    that the attack can be started.


    Using John the Ripper


    This is also a free tool for password cracking. In Linux, the hash for the password
    is stored in the file “/etc/shadow.” To demonstrate how this tool can be used
    for password cracking, we will create a new user and then assign him a password.
    This user will also be added to the sudo group which is “assign /bin/bash” as
    the shell.


    Let us first create the use,r and assign him a password by running the command
    given below:


    root@kali:~# useradd -m john -G sudo -s /bin/bash


    root@kali:~# passwd john


    Note that we have created a user named “john” and a password “john” for his account.


    We can then go ahead and run the “unshadow” command which will help us to combine
    the file “/etc/passwd” and the file “/etc/shadow” for the purpose of creating
    a single file which will have a list of usernames and passwords. Run the following
    commands sequentially:


    # unshadow


    # unshadow /etc/passwd /etc/shadow > /root/johns_passwd


    # ls –ltrah /usr/share/john/password.list


    That is it! If we get a dictionary file, we can go on with the cracking. The tool
    comes with its own password file which can be located at “/usr/share/john/password.lst.”Just
    run the following command:


    # john - -wordlist=/usr/share/john/password.list /root/johns_password


    To see the passwords which have been cracked, just run the “john –show” command
    as shown below:


    # john  - -show /root/johns_passwd


    That is it!


    # Conclusion


    We have come to the end of this book. Kali Linux is a very powerful Linux distribution,
    especially for penetration testing. The OS comes with a number of tools which
    can help you do penetration testing on systems and applications. This makes Kali
    Linux the best operating system to use for penetration testing. Before deploying
    your system in a working or production environment, it is good for you to first
    test it via penetration testing so that you can be sure that it has no loopholes.
    With penetration testing, you can identify the loopholes in your system and seal
    them before using it for production. This will help you prevent disasters which
    might have occurred as a result of exploitation by hackers.'
