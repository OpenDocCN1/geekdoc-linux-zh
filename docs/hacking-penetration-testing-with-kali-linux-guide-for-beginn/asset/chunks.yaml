    # Chapter 4- MAC Address Spoofing


    A `macchanger` is a tool which can be used for changing a MAC address in Linux.
    In Kali Linux, this tool comes pre-installed, but there are other Linux distributions
    in which you have to install it manually. This tool can help you to spoof the
    MAC address of interfaces such as `Wlan0` and `eth0`.


    MAC stands for “Multimedia access control.” It is the address which is used to
    uniquely identify your hardware. Whenever you are establishing a connection to
    your WiFi or any other network, your device should be uniquely identified, and
    this is the work of the MAC address. Each device has a unique MAC address which
    cannot be changed uniquely, but it is possible for you to spoof it for some time.


    MAC address spoofing has many advantages in hacking. With this, you will bypass
    the MAC filtration security. For you to establish a connection to a WiFi network,
    their device must be part of the devices which are allowed to do this. In your
    case, you should bypass this filtration. Also, if you need to hack some router
    somewhere, you should spoof your MAC address id so that the admin may not spot
    you and block your device.


    In this chapter, we will guide you on how to spoof the MAC address for the `wlan0`
    interface which is good for connecting to the wireless network. First, begin by
    putting down the interface by running the following command:


    ```bash

    ifconfig wlan0 down

    ```


    Now that the interface is down, we can go ahead and manually change the id of
    the MAC address. This calls for us to run the following command:


    ```bash

    macchanger –m 12:12:12:12:12:12 wlan0

    ```


    Note that the address used in the above command is just a fake address. That is
    how the address can be changed manually. However, it is also possible for you
    to change your address automatically. You only have to execute the command given
    below:


    ```bash

    macchanger -a wlan0

    ```


    If you need this address to be changed randomly, just replace the `-a` option
    used in the above command with the `-r` option. Once the changes are made, you
    should bring on your interface. You only have to run the following command:


    ```bash

    ifconfig wlan0 up

    ```


    The command will then bring up your `wlan0` interface with the new changes applied.
    You can then turn off the spoofing type by running the following commands:


    ```bash

    ifconfig wlan0 down

    ifconfig -p wlan0 // the -p means permanent

    ifconfig wlan0 up

    ```


    You will then have changed the WiFi address of your system. Other than the `wlan0`
    interface, it is also possible for you to spoof the `eth0` interface which is
    used for Ethernet connections. To do this, you only have to substitute the `wlan0`
    with `eth0` as shown below:


    ```bash

    ifconfig eth0 down

    macchanger -r eth0

    ifconfig eth0 up

    ```


    # Chapter 5- Scanning a Website for Vulnerability


    Before you can begin to hack a website, it is good for you to first scan it and
    identify its weak points. This will make it easy for you to hack the website.


    A number of tools exist, and these can help you to scan for website vulnerabilities.
    An example of such a tool is `nikto`. This tool when used scans the website and
    reports back its weak points which you can exploit. Let us demonstrate how you
    can scan a website for vulnerabilities using `nikto` in Kali Linux.


    Begin by starting up the Kali Linux machine. Once it is up and running, navigates
    to Kali Linux -> Vulnerability Analysis -> Misc Scanners -> `nikto`. This tool
    offers you a number of options, but we will be using the ones given below:


    ```bash

    nikto -h <IP or hostname>

    ```


    ### Scanning the Web Server


    We will begin with a server running in our network, which is a safe server. The
    http service should be started on another machine. The machine is not hosting
    any website, but just the web server. Type the following command so to scan:


    ```bash

    nikto -h 192.168.1.104

    ```


    The `nikto` tool will respond by giving you too much information.


    ![](images/0006.jpeg)


    First, you are informed that this is an Apache server version 2.2.12. Down there,
    you can see that there are vulnerabilities reported with the OSVDBDB prefix. This
    stands for “Open Source Vulnerability Database.” This is a database which is maintained
    for the known vulnerabilities.


    It is now time for us to scan the website and see the vulnerabilities. In this
    case, we will scan a website named `sitescan.com`. Type the following command:


    ```bash

    nikto -h sitescan.com

    ```


    Again, the tool will respond with too much information. First, it identified the
    server, which is Apache, and it then proceeded to identify the vulnerabilities
    in the system. Note that the `OSVDB` database is kept in the `www.osvdb.org` website,
    and if you need to have a look at the above vulnerabilities, just open that website.
    It is from this website that you can learn more about the vulnerabilities in the
    website.


    The tool had identified the vulnerability `OSVDB-877`. For you to learn its meaning,
    you just have to paste this reference number in the search function, and a page
    will be retrieved for you.


    You can then go ahead and then scan other websites which you might be interested
    in exploiting. Again, your command for scanning the website should take the syntax
    given below:


    ```bash

    nikto -h websitename

    ```


    After scanning the second site, the `nikto` tool gives me the vulnerabilities.
    As you can see from the above output; our website is using the Microsoft''s IIS
    8.5 server, not the Apache server as on our previous scan. There is also other
    more vulnerability which the tool has listed for us.

