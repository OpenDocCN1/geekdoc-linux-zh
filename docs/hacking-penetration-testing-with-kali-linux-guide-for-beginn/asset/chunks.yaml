    It is after this that the `airodump-ng` window will be seen, and this is commonly
    referred to as the WiFi monitor. Let it run so as to look for the clients and
    APs. After you are sure that you have obtained what is needed, just close the
    window, and you will stop the monitoring process. The following will then occur:


    * You will be prompted to choose target.

    * Then you will be prompted to choose attack.

    * Then you will be asked to provide the handshake.

    * In case you have no handshake already captured, your script will help you to
    capture one. It will send some deauth packets so as to achieve that.

    * Once this is done, you can quit the procedure.


    ## Getting Password for Wireless Network


    We want to fool a smartphone so as to connect to some fake AP (Access Point) so
    that we can grab the password of the wireless network. As the password is being
    typed in the smartphone, we will see if the `Fluxion` instance on the Kali Linux
    machine will get the password. The same smartphone will also be de-authenticated
    for the purpose of the handshake. Follow the steps given below:


    Run the `Fluxion` tool and then choose the language:


    ![](images/00001.jpeg)


    I am using the internal card for my laptop. The fact is that some of the internal
    cards may have problems, and this is why it is recommended that you use an external
    card. For those who are using Kali Linux on a virtual machine, then it will be
    mandatory for you to use an external card.


    The `airodump-ng` tool will begin the process of scanning, and you will be prompted
    to choose the target. You should choose the network number to which your smartphone
    has been connected to. You will then be prompted to choose an attack.


    You can choose the type of attack by keying its respective number. In the above
    case, I have chosen the Hostpad attack by keying `1`. In case you had captured
    the 4-way handshake, you may specify the location to this handshake, and your
    script will go ahead to use it.


    In case you had not done the handshake, then you can choose the tool which you
    will be using. In this case, we will be using the `aircrack-ng`. The selection
    can be done as shown below:


    ![](images/00002.jpeg)


    Once the handshake has been captured, you can type `1` so that you can check the
    handshake. If you find that everything ran successfully, it will be good for you
    to proceed to the next step.


    We are going to use the web interface method. Most people like to use the Bruteforce
    method, but this is not what we will use in our case.


    ![](images/00003.jpeg)


    You have to type `1` so as to choose the web interface method. There will be multiple
    login pages which can be used for getting the WPA password for the network.


    ![](images/00004.jpeg)


    Let us choose the first choice by typing `1`. Once you have made a decision, a
    number of windows will be shown. The DNS and DHCP windows will be handled in the
    two windows in the left, while the other two windows in the right will be responsible
    for reporting the status and the deauth window (luring users from the actual AP
    to the fake one). Once you have established a connection to the fake AP, you will
    see both the DHCP and the DNS windows react immediately.


    After a connection is established with the network, you may be prompted to login.
    For some of you, you may have to open your browser and then a website and you
    will see the necessary page showing up. Just enter the password and then click
    on Submit, and the script will run your password against the handshake which had
    been captured earlier so as to do verification and determine whether it is correct
    or not.


    The handshake simply helps us verify whether the submitted password which the
    fake AP client submits was correct or not. If there is no handshake, then this
    ability will be lost, but if we assume that the client will provide a correct
    password, then we will achieve what we need. We will then have obtained the password
    for a network which is protected by WPA-2!


    # Chapter 3- Checking for IP Address Location


    It is possible for you to learn the local and the external IP address in a Kali
    Linux machine. The simplest way to determine this IP address is by use of the
    web browser. There are many sites online which can tell about the IP address of
    your machine such as `linuxconfig.org`.


    You can also use the command line so as to learn your external IP address. In
    this case, you should use the `curl` or the `wget` commands. Right click on the
    desktop of your machine and then choose “Open Terminal.” You can then run the
    following commands so as to know external IP address:


    ```bash

    echo $(wget -qO - https://ipify.org)

    ```

    OR

    ```bash

    echo $(curl -s https://ipify.org)

    ```


    Also, it is good for you to be aware of the internal IP addresses for Kali Linux
    machine. In this case, you can use the `ip` or `ifconfig` commands. These are
    shown below:


    ```bash

    ifconfig | grep -w inet | awk ''{ print $2}''

    ```

    OR

    ```bash

    ip a | grep -w inet | awk ''{ print $2}''

    ```


    Despite that, it is possible for you to learn the geographical location of certain
    IP address. Let us demonstrate how this can be done:


    Begin by firing up your Kali Linux system. In this case, we will be using a MaxMind
    database so as to determine the location of IP address. This is a company which
    has a database with all the IP addresses. You can use its database to learn the
    GPS coordinates the area code, the zip code, and the country for a particular
    IP address.


    One Kali Linux system is up, go ahead and use the `wget` command so as to download
    the MaxMind database. You only have to run the following command:


    ```bash

    wget -N -q http://geolite.maxmind.com/download/geoip/database/GeoLiteCity.dat.gz

