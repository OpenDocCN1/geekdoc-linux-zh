    ## 持续代码分析 – 第 1 部分


    设置一个准备好进行 SonarQube 分析的 Jenkins 集成服务器


    ![](img/c7d3278283754436651c50a2e9c72912_38_0.png)


    ![](img/c7d3278283754436651c50a2e9c72912_38_1.png)


    ### 01 Jenkins 安装


    Jenkins 提供 WAR 文件供下载，该文件可以放入您喜欢的 JEE 容器中，或者通过 `java -jar jenkins.war` 命令直接执行。请注意，JDK
    和 JRE 是 Jenkins 的前置条件。如果您不想深入细节，也可以下载适用于您操作系统的原生软件包。这些软件包包含 WAR 文件以及其他所有必需的依赖项。您只需像安装其他应用程序一样下载并安装它们即可。安装完成后，即可在
    `http://localhost:8080/` 访问 Jenkins。请注意，系统不会创建管理员（或其他任何）用户，因为任何人都可以访问任何内容。只有在设置
    Jenkins 的安全机制后，这种情况才会改变，接下来我们将对此进行探讨。


    ### 02 开始使用 Jenkins


    要设置安全选项，请前往“管理 Jenkins”>“配置全局安全”，并点击“启用安全”复选框。此时将打开安全设置，在这里您可以选择其他从属节点（slaves）可以与
    Jenkins 连接的端口；安全领域（即使用 LDAP、Unix 用户组、Jenkins 数据库等进行的用户身份验证方法），以及用户授权（换句话说，就是用户权限）。添加用户取决于您在此处选择的安全领域。如果您使用
    Jenkins 数据库，在“管理 Jenkins”页面中会出现一个管理用户的选项。前往该页面并点击“创建用户”链接以添加用户。在开始添加用户时，您可能希望为不同用户配置权限和访问级别。这可以通过进入“管理
    Jenkins”>“配置全局安全”>“访问控制”>“授权”>“基于矩阵的安全”来完成。


    请注意，如果您不慎将自己锁定在 Jenkins 之外，只需打开 `/var/lib/Jenkins/config.xml` 文件并将 `<useSecurity>`
    元素设置为 false，同时从文件中移除 authorizationStrategy 和 securityRealm 元素即可。保存文件，重启 Jenkins，您应该就能正常工作了。


    ### 03 Jenkins 任务


    作为一个持续集成服务器，Jenkins 可以直接从您的文件系统甚至源代码管理系统获取源代码，然后对其进行构建。结合构建前和构建后的选项以及其他功能，这使得您能够按需求实验和配置任务。Jenkins
    支持的各种项目构建/任务包括：


    - **自由格式软件构建**：它允许您将任何 SCM 与任何构建过程结合使用。在构建软件时，您还可以运行 shell/batch 脚本、调用等。如果在设置
    Jenkins 时对构建类型不确定，您可能应该使用此选项。

    - **Maven**：三分之二的项目针对 Maven 项目，它们会非常详细地分析 `pom.xml` 文件。

    - **多配置项目**：这允许您设置可能需要多种配置的项目，例如针对不同平台的构建。这与自由格式软件构建非常相似，只是增加了一个配置矩阵，有助于您设置不同的配置。

    - **监控外部任务**：使用此选项，Jenkins 可以用作仪表盘来监控在外部系统上运行的任务。但是，默认情况下可能没有此选项，在这种情况下，您需要在下拉页面中启用
    external-monitor-plugin。


    ![](img/c7d3278283754436651c50a2e9c72912_39_0.png)


    ### 04 设置 SonarQube


    现在 Jenkins 已经设置好，并且您对其功能有了基本的了解，让我们重新审视一下 SonarQube。SonarQube 由三个主要组件组成：托管在 Web
    服务器上的应用程序源代码、数据库以及分析器。这三个组件在逻辑上是分离的，通常也需要单独安装。实际与要分析的源代码交互并将结果保存到数据库的是分析器。然后 SonarQube
    Web 界面向您展示这些结果。针对不同项目类型有不同的分析器可用。我们将使用 SonarQube Runner 对非 Maven Python 项目进行分析演示。您可以从
    SonarQube 网站下载它。设置分析器需要编辑 sonar-runner.properties 文件中的数据库连接字符串和凭据。如果您遇到困难，请查阅第一个
    SonarQube 教程：www.linuxuser.co.uk/tutorials/analyse-code-with-sonarqube。


    ![](img/c7d3278283754436651c50a2e9c72912_39_1.png)


    ### 05 在 Jenkins 中安装 SonarQube 插件


    此处提到的插件是一个 Jenkins 插件，它可以使 Jenkins 连接到 SonarQube 安装（具体来说，是 SonarQube 分析器）。连接完成后，Jenkins
    可以基于预定义的标准触发分析器。要安装插件，请打开您的 Jenkins 主页，前往“管理 Jenkins”>“管理插件”页面，并点击“可用”标签页。然后在过滤器框中搜索
    ''sonar''。随着您的输入，您将会看到 Sonar 插件。选中其前面的复选框，并点击 ''Install without restart''（不重启安装）按钮。然后
    Jenkins 开始安装过程，从网络检查和插件下载开始。很快，如果一切正常，插件就会安装完成。现在需要对其进行配置。


    ![](img/c7d3278283754436651c50a2e9c72912_39_2.png)


    ### 06 插件运行


    要配置插件，请前往“管理 Jenkins”>“配置系统”，向下滚动到 Sonar 标签页。在此您需要填写名称（SonarQube）、其数据库凭据和其他详细信息。填写完这些信息后，向上滚动到
    Sonar Runner 标签页，然后在此填写 Sonar Runner 的详细信息。至此设置完成。设置好插件后，前往 Jenkins 主页并创建一个新项目。您可以通过左侧的“新建”链接做到这一点，选择“自由格式项目”作为项目类型。在随后出现的配置页面中，向下滚动到“构建”标签页，并在“添加构建步骤”下拉菜单中选择
    ''Invoke Standalone Sonar Analysis''（调用独立的 Sonar 分析）。填写项目属性文件的路径（这是 SonarQube
    Runner 分析项目所需的同一文件）。您还可以在“构建触发器”标签页（位于“构建”标签页正上方）中选择构建项目的触发器。这完成了整个过程——现在，根据您的设置，Jenkins
    将自动触发 SonarQube 分析。要查看分析结果，只需登录 SonarQube，最新的代码质量指标将可供您使用。


    > “Jenkins 通常需要在任何配置更改或任何插件安装之后重启”


    ![](img/c7d3278283754436651c50a2e9c72912_40_0.png)


    ![](img/c7d3278283754436651c50a2e9c72912_40_1.png)


    ### 07 Job Config History 插件


    此插件对于 Jenkins 新手特别有帮助，尽管有一些 Jenkins 经验的人也可能觉得它有用。让我们考虑一种场景——您的 Jenkins 构建运行正常，然后您想到做进一步的改进并开始更改设置，突然一切都停止工作了。但您甚至不记得最后一次做了什么更改！好吧，JobConfigHistory
    插件就是为您在这种困境中解围而设计的。它在您每次在 Jenkins 设置中做出更改后保存 config.xml。您只需检查文件差异并进行必要的修正即可。


    ### 08 SafeRestart 插件


    Jenkins 通常需要在任何配置更改或任何插件安装之后重启。但作为一个基于服务器-客户端应用程序且多个并发用户正在执行其任务，您需要格外小心，因为在重启期间可能会意外终止其他人的构建。SafeRestart
    插件让您无需担心这一点。一旦您点击 ''Restart Safely''（安全重启）按钮（安装插件后会出现在左侧菜单栏中），它就会安排在所有构建完成后重启。


    ![](img/c7d3278283754436651c50a2e9c72912_40_2.png)


    ### 09 Ownership 插件


    顾名思义，此插件允许您为任务和从属节点分配明确的拥有权。引入所有权意味着更好的责任管理和更快的解决问题……除非它变成了相互指责！严肃地说，此插件绝对提供了一种处理问题的良好方式——在任务失败后，您无需寻找某人去修复它。安装此插件后，左侧菜单栏会出现一个名为“管理所有权”的链接（在项目内部时）。在这里，您可以配置相应任务的所有者/共同所有者。


    ![](img/c7d3278283754436651c50a2e9c72912_40_3.png)


    ### 10 Google Calendar 和 compress artefact 插件


    Google Calendar 插件允许您将构建记录发布到 Google 日历。安装插件后，您可以在 postbuild actions 选项卡中查看将构建状态发布到
    Google 日历的选项。选中该选项后会出现一个表单，您需要填写日历 URL 和您的凭据。之后，Jenkins 会自动将构建结果推送到您的 Google 日历。简单而有效！如果您计划在每次构建后保存构建工件，例如测试日志和构建文件，那么您可能会发现此插件很有用。此插件在将工件保存到磁盘之前对其进行压缩，从而为您节省磁盘空间。


