    \n### 14 关于 Cacti\n\nMRTG 的一种替代方案是 Cacti。Cacti 也是一个开源网络图形应用，支持插件并利用 RRDtool，后者是一个用于时间序列数据的数据记录和图形系统。Cacti\
    \ 插件允许开发者在不处理 Cacti 源代码的情况下生成额外的 Cacti 功能。\n\n```\nEnableIPv6: no\nWorkDir: /srv/www/mrtg/mrtg.tsoukalos.eu/public_html\n\
