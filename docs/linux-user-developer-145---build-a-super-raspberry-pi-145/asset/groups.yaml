    ## 功能特性


    ### 现在与未来


    **Unity 和移动端如何塑造 Ubuntu 的未来与面貌**


    目前，Ubuntu 的焦点在桌面版和即将发布的 Ubuntu 手机之间分配。Richard Collins，Ubuntu 移动产品经理，自三年前加入 Canonical
    以来一直致力于触控操作系统：


    > “关于动力源泉、运作方式等想法总是浮现出来。这一切真的源于 Ubuntu for Android，当时我们利用该产品与许多移动制造商和运营商进行沟通。这些关系已经建立，开始思考如何使
    Ubuntu 作为代码库真正独特是合理的发展，意味着它可以在不同的形态因子中作为单一代码库有效运行。

    >

    > “无论行业都在朝这个方向前进，因为你有触控笔记本电脑和大屏幕，所以进化已经开始发生——只是需要一个战略推动，说‘好吧，我们将把手机作为一个完全成熟的严肃商业产品来做。’”


    Canonical 没有忘记社区，让他们尽早深度参与开发。


    > “我们想要做的一件事是让社区参与手机项目，所以不只是我们生产手机并将其投放市场。我们想让人们参与进来。因此，我们启动了核心应用项目，核心应用是手机上需要的典型应用程序，如时钟或日历。然后还有一些更专业的东西，你可能会觉得它们在手机上有点不搭调，比如终端和文件管理器。我们还有一个天气应用和几个其他应用。所有这些应用都是由社区中的人开发的。


    ![](img/c7d3278283754436651c50a2e9c72912_21_0.png)


    **Ubuntu 时间线**


    **2013 年 1 月 2 日：Ubuntu Touch**


    在 2013 年的发布会中，Mark Shuttleworth 展示了新的 Ubuntu 移动操作系统。Unity 界面已被缩小以适应触摸屏，并显示出原本承诺的统一环境的迹象。


    **2014 年 4 月 17 日：当前 LTS 版本**


    14.04 是 Canonical 最近的 Ubuntu 长期支持（LTS）版本，提供五年的支持，这对企业和桌面及服务器用户都有吸引力。它是一个极其稳定的版本，专注于修复错误，而不是新功能。


    **Ubuntu 十周年**


    回顾历史，庆祝该发行版的生日


    ![](img/c7d3278283754436651c50a2e9c72912_22_0.png)


    > “我认为我们在公司和融入社区意见之间取得了平衡”


    > “这些核心应用具体是与 Canonical 设计团队合作完成的，因此设计团队会说‘我们认为时钟应用应该是这样的’，然后他们向我们提供该设计。

    >

    > “我们在社区中[寻找]那些[愿意]为 Ubuntu 贡献应用的人，果然，我们发现了一大批愿意这样做的人，他们创建了一些将在未来一年左右发布的大量手机中预装的应用。对我来说，这太棒了。他们将能够去商店买一部手机，而他们自己的代码就在那部手机上运行。”


    > “规模很大，”Richard 确认了社区的参与。“社区非常热情地拥抱我们所做并宣布的一切。手机上预装的一组应用来自社区，并且还有数百个[应用]人们可以从应用商店下载。”


    Richard 还向我们透露了一些关于手机及其开发既定路线图的未具体说明的未来公告。不过，显然，Canonical 和 Ubuntu 的现在与未来在很大程度上归功于帮助其成长的活跃社区成员。当我们就与开源公司合作的问题询问
    Jane 时，她对此进行了反思：


    > “我认为我们能够在公司和融入社区的意见、工作和热情之间取得很好的平衡。道路并不总是平坦的——[在任何关系或公司中都有]崎岖的部分。我认为这是 Ubuntu
    作为发行版最有趣的部分之一，即使我们进入手机和平板电脑世界，以及在服务器端的云领域，我们仍在继续。我认为我们继续保持一种独特的透明度和参与度。”


    ![](img/c7d3278283754436651c50a2e9c72912_22_1.png)


    *上图：Ubuntu Touch 的开发与 Ubuntu for Android 绑定，该项目旨在创建可对接的运行 Ubuntu 的手机*


    ![](img/c7d3278283754436651c50a2e9c72912_22_2.png)


    *上图：这些应用主要由社区与专业设计团队合作构建*


    **来自 Jane Silber 的信息**


    > “我个人，以及 Canonical 的我们，想感谢在过去十年中参与、工作和与我们庆祝的读者和 Ubuntu 社区成员。显然，没有他们的贡献，我们就不会走到今天。我知道你们的一部分受众（和）开发人员，特别是开发者，继续成为对我们非常重要的受众。我们希望我们继续为他们带来从
    Ubuntu 本身、从 Juju 到在云中轻松启动 Ubuntu 镜像的能力，最好的开发平台和开发工具；我们重视这个开发受众，并希望我们也能在未来十年为他们提供尽可能好的工具。”


    **再见 Ubuntu One**


    **2014 年 7 月 3 日**


    五年后，Ubuntu One 最终关闭。由于计算状态的变化，Canonical 认为它不再是他们需求的有效服务。合作伙伴关系是这类应用程序的未来方向。


    ![](img/c7d3278283754436651c50a2e9c72912_22_3.png)


    **Ubuntu 十岁了**


    **2014 年 10 月 23 日**


    正好在原始 Ubuntu 发布后的十年零三天，14.10 将继续 Warty Warthog 易于使用的 Linux 发行版的传统，尽管现在得益于 Unity
    而具有更独特的风格。


