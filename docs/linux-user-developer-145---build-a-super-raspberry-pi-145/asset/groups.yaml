    ## 打造超级树莓派


    ![](img/c7d3278283754436651c50a2e9c72912_50_0.png)


    **适用**

    于所有

    树莓派！


    你甚至可以组建一个由不同类型的树莓派组成的集群


    ## 编程你的树莓派


    让你的树莓派彼此通信，

    并共享它们的处理性能


    ![](img/c7d3278283754436651c50a2e9c72912_51_0.png)


    ### 01 完全更新的树莓派


    为了确保一切正常运行，你的树莓派电脑

    必须完全更新，因此请确保所有组件都

    兼容，包括固件。这需要按顺序执行三条命令完成，并且请确保你依次在

    每一台树莓派上都这样做：


    ```

    $ sudo apt-get update

    $ sudo apt-get upgrade

    $ sudo rpi-update

    ```


    ### 02 获取 MPI 模块


    在终端中使用以下命令安装 mpi4py Python 模块（

    再次提醒，需在每台树莓派上执行）：


    ```

    $ sudo apt-get install python-mpi4py

    ```


    该模块也可以在 Arch 或其他树莓派发行版上运行，

    不过你需要手动添加或通过 pip 安装。


    ### 你需要什么


    - 尽可能多的树莓派电脑

    - 带有最新 Raspbian 版本的 SD 卡

    - mpi4py MPI python 模块 `pypi.python.org/pypi/mpi4py`

    - 已更新的树莓派固件


    ![](img/c7d3278283754436651c50a2e9c72912_51_1.png)


    左图 如果你想让 SuperPi

    成为现实，那么更新

    所有组件至关重要


    ### 其他库


    mpi4py 库

    也可以与

    Numpy（Python 的

    数值和数学

    模块）一起使用。

    可以使用

    sudo apt-get

    install python-numpy 进行安装，

    这对于执行集群

    所需的那种

    大规模计算

    非常有用。我们在

    下一页的示例中

    会使用 biogin，所以

    现在就安装它。


    ### 03 创建你的线程


    要在 Python 中使用 MPI，首先导入它：


    ```

    from mpi4py import MPI

    ```


    代码中最重要的部分是告诉 MPI 如何

    对线程进行排名以及识别其大小。这样做的方式是：


    ```

    comm = MPI.COMM_WORLD

    rank = comm.Get_rank()

    size = comm.Get_size()

    ```


    ![](img/c7d3278283754436651c50a2e9c72912_51_2.png)


    ![](img/c7d3278283754436651c50a2e9c72912_52_0.png)


    **右图** 你需要知道每台树莓派的 IP 地址，因此务必现在就记录下来


    ### Mpi4py 也可以在 Arch 或其他树莓派发行版上运行


    ![](img/c7d3278283754436651c50a2e9c72912_52_1.png)


    ### 完整代码列表


    ```python

    from __future__ import division

    import numpy as np

    from mpi4py import MPI

    # 从 FileSilo 或我们的网站获取 parutils 并将其放在同一文件夹中。使用它来打印使用的核心数

    from parutils import pprint

    comm = MPI.COMM_WORLD

    pprint("-" * 70)

    pprint(" Running on %d cores" % comm.size)

    pprint("-" * 70)

    # 为不同的节点设置排名结构

    my_N = 4

    N = my_N * comm.size

    if comm.rank == 0:

    A = np.arange(N, dtype=np.float64)

    else:

    A = np.empty(N, dtype=np.float64)

    my_A = np.empty(my_N, dtype=np.float64)

    # 将数据分散到 my_A 数组中

    comm.Scatter( [A, MPI.DOUBLE], [my_A, MPI.DOUBLE] )

    pprint("After Scatter:")

    for r in xrange(comm.size):

    if comm.rank == r:

    print( "[%d] %s" % (comm.rank, my_A))

    comm.Barrier()

    # 每个人都在乘以 2

    my_A *= 2

    # 使用 Allgather 将所有数据收集回 A 并打印结果

    comm.Allgather( [my_A, MPI.DOUBLE], [A, MPI.DOUBLE] )

    pprint("After Allgather:")

    for r in xrange(comm.size):

    if comm.rank == r:

    print( "[%d] %s" % (comm.rank, A))

    comm.Barrier()

    ```


    ### 04 发送和接收数据


    发送数据非常简单：你需要给它指定一个目标线程，这样 MPI 才知道数据返回时对应的是哪个线程，否则原始线程会一直等待：


    ```python

    data = [1.0, 2.0, 3.0, 4.0]

    comm.send(data, dest=1, tag=0)

    data = comm.recv(source=0, tag=0)

    ```


    标签允许你解析某些特定类型数据的处理方式。


    ### 05 运行代码


    这就是如何在集群中发送你的代码的基本方法。要实际激活代码并选择树莓派接收者，你需要在终端中编写以下内容：


    ```bash

    $ mpirun -host 192.168.1.20,192.168.1.21,192.168.1.22

    python superpi.py

    ```


    ... 其中 IP 地址对应其他树莓派上的地址。


    ### 06 它能工作吗？


    上述操作实际上并不会完成什么具体任务，但至少说明了如何在网络上发送代码。你可以对其进行任意类型的计算任务，但由于网络延迟，它只适用于大数字和更大数据。


    ## 构建你的 SuperPi


    现在你已经对树莓派单元进行了编程，是时候将它们连接在一起了


    编程树莓派是构建**你的超级计算机的一部分——妥善地将它们收纳在一起是另一个问题。** 让它们工作的最基本要素是电源和通过路由器和/或交换机建立本地网络。这进而延伸到外壳、SD
    卡甚至树莓派本身。


    为了确保你最大限度地利用该系统，你必须选择正确的组件来为它们供电并连接它们。


    > 你不需要集群中的最大功率，因为你不会从 GPIO 端口为显示器或摄像头供电


    ![](img/c7d3278283754436651c50a2e9c72912_53_0.png)


    ### 电源


    为树莓派供电时，良好的电源至关重要，否则虽然它能开机运行，但你无法发挥其最大性能。如果你使用的是 Model B+ 并且注意到角落出现彩虹方块，那表示你提供的电源不足。你的集群不需要最大功率，因为你不会从
    GPIO 端口为显示器或摄像头或可能任何设备供电，所以推荐的 2 安培可能对你来说有点过大，即使你推处理器达到极限也是如此。然而，如果你计划进行超频，那么
    2 安培的电源将变得越来越必要，而且处于安全一侧总是更好的。


    随着集群的增长，你还需要确保有充足的浪涌保护，因为树莓派可能非常敏感。


    **我们推荐：**


    树莓派通用电源


    pimoroni.com


    ### 网络


    你计划连接的树莓派越多，就需要越多网络设备将它们连接起来。最佳方法是使用有线连接，因为它比无线连接传输消息更快且延迟更低——但创建集群不像插入路由器那么简单。随着树莓派数量增加，你需要更多端口，这可以通过获取网络交换机来实现。这些是简单的连接器，不包含路由或地址系统，但允许你将更多设备连接到中央路由器。


    虽然我们推荐使用有线连接，但你仍可以使用无线连接额外的树莓派。这也有助于减少使用的线缆和网络交换机数量，但一般来说，拥有同构配置更好。


    ![](img/c7d3278283754436651c50a2e9c72912_53_1.png)


    ### 超频


    如果你发现仍然想要从集群中获得更多性能，你随时可以尝试超频你的树莓派。


    在 Raspbian 中，你可以从通过 sudo raspi-config 访问的配置菜单中进行此操作。在菜单中你会找到一个超频选项，提供几个级别可供选择。你可以单独对树莓派执行此操作，也可以对所有树莓派执行，但请注意这样做可能会缩短树莓派
    CPU 的使用寿命，特别是当设置为最高级别时。


    ## 打造超级树莓派


    ![](img/c7d3278283754436651c50a2e9c72912_54_0.png)


    ### 外壳


    树莓派有很多类型的外壳：从保护树莓派免受灰尘的简单塑料外壳到完全防水防风的金属外壳。其中多用途外壳之一是 Pimoroni Pibow，它有多种尺寸和配置适用于所有版本的树莓派。这些外壳均由螺丝固定，可以轻松重新利用以帮助将树莓派安装在塔式或其他配置中，从而减少水平空间占用。


    它们可能比某些外壳更难将树莓派装入，但它们相当耐用，如果你想要移动它们，或在主树莓派上添加一个小触摸屏或滚动 LCD 屏幕以监控状态而不需要 SSH 登录，则很容易自定义。


    > 我们推荐：

    **Pimoroni PiBow**

    pimoroni.com


    ### SD 卡


    **在选择集群时，SD 卡的选择是一个次要但仍然重要的因素。**


    一些树莓派附带一张 SD 卡，这可能足够合适，而其他的你需要购买一些卡片。我们建议使用 4GB 卡；虽然 2GB 卡可以完成任务，但 4GB 允许你在必要时使用
    NOOBS，并且对于更大的发行版和操作系统也具有前瞻性。由于 Model B+ 需要微型 SD 卡，请确保你拥有正确比例的 SD 卡和微型 SD 卡。


    当涉及到将所有 SD 卡设置得一致时，最简单快捷的方法是先在一台树莓派上完成所有安装和更新，除了使用 rpi-update 进行的固件更新。然后通过将其插入
    Linux 系统并打开终端来创建磁盘副本，并使用：


    ```

    $ sudo dd bs=1M if=/dev/[SD card location] of=superpi.img

    ```


    一旦复制完成，你可以使用以下命令将其写入所有其他卡片：


    ```

    $ sudo dd bs=1M if=superpi.img of=/dev/[SD card location]

    ```


    > 我们推荐：

    **4GB**

    pimoroni.com


    ![](img/c7d3278283754436651c50a2e9c72912_54_1.png)


    ![](img/c7d3278283754436651c50a2e9c72912_54_2.png)


    ### 树莓派


    **实际上，在集群中使用什么类型的树莓派并不重要** – 你可以使用最新**Model B+**的同构选择，甚至可以有**连接在一起的 B+、B 和 Model
    A 混合体**。只要你运行相同的软件并拥有相关脚本，系统就会工作。你可能会遇到的主要差异是不同设备之间的功耗不同，以及 Model A 在某些计算中可能稍慢。


    Model A 类型存在一个缺点，即它们没有内置以太网端口。然而，它们仍可使用无线网卡连接到由树莓派组成的整体网络。


    确保为每台树莓派设置一个静态 IP 地址，并带有覆盖其在网络中位置的具体范围。这对于两个主要原因有用，第一是运行 MPI 时始终能够调用正确的地址，第二是你然后可以
    SSH 登录并远程维护你的树莓派。


    > 我们推荐：

    **Model B+**

    element14.com


