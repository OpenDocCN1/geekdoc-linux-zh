  - '[PAGE 1]


    ![](img/c7d3278283754436651c50a2e9c72912_1_0.png)


    # Can you volunteer for Code Club?


    Code Club is a nationwide network of volunteer-led after school coding clubs for
    children aged 9-11.


    We need people who know how to program computers to volunteer to run a club at
    their local primary school, library or community centre for an hour a week.


    We create the projects for our volunteers to teach, the projects we make teach
    children how to program by showing them how to make computer games, animations
    and websites.


    Get involved, let''s teach the next generation to code!


    Visit **www.codeclub.org.uk** to find out more


    ![](img/c7d3278283754436651c50a2e9c72912_1_1.png)'
  - "[PAGE 2]\n\n# # Welcome\nto issue 145 of Linux User & Developer\n\n![](img/c7d3278283754436651c50a2e9c72912_2_0.png)\n\
    \n# Your team of Linux experts...\n\n![](img/c7d3278283754436651c50a2e9c72912_2_1.png)\n\
    \n**Rob Zwetsloot** studied aerospace engineering, using Python to model complex\
    \ simulations. Having set upSuperPi (p.50) to work on the algorithm for perfect\
    \ orange and aubergine cake, for Ubuntu's birthday (p.16), Rob brought LJ4J8D\
    \ servers to their knees. The cluster won't stop downloading recipes and refuses\
    \ to power down.\n\n![](img/c7d3278283754436651c50a2e9c72912_2_2.png)\n\n**Richard\
    \ Smedley** started using computers long before WYSIWYG and still maintains that\
    \ the command line, and Emacs, is the most productive working environment. Richard\
    \ continues his column on open source start-ups this month (p.13) and begins a\
    \ two-part guide to deploying virtual boxes with Puppet and Vagrant (p.26).\n\n\
    ![](img/c7d3278283754436651c50a2e9c72912_2_3.png)\n\n**Nitish Tiwari** is a software\
    \ developer by profession and an open source enthusiast by heart, and he helps\
    \ firms set up and use open source software. This issue, Nitish shows us how to\
    \ manage employees with OracleHRM (p.34) and continuously analyse code by combining\
    \ Jenkins and SonarQube (p.38).\n\n![](img/c7d3278283754436651c50a2e9c72912_2_4.png)\n\
    \n**Mihalis Tsoukalos** is a UNIX system administrator with expertise in programming,\
    \ databases and maths. He has been using Linux since 1993. Mihalis shows us how\
    \ to use MRTG and SNMP to display the traffic load on a Cisco router, as well\
    \ as how to configure Apache to view the output from your network (p.30).\n\n\
    ![](img/c7d3278283754436651c50a2e9c72912_2_5.png)\n\n**Jon Masters** is a Linux\
    \ kernel hacker who has been working on Linux for some 18 years, since he first\
    \ attended university at the age of 15. Jon lives in Cambridge, Massachusetts,\
    \ and works for a large enterprise Linux vendor. You can find his brilliant Kernel\
    \ Column on pages 14-15 this month.\n\n![](img/c7d3278283754436651c50a2e9c72912_2_6.png)\n\
    \n**Gareth Halfacree** is our resident news reporter and brings us the latest\
    \ developments from all over the open source world, starting on page 6. This issue,\
    \ Gareth tests SolidRun's new computer-on- module plus carrier board design, the\
    \ Hummingboard-i2eX (p.80).\n\n# ## This issue\n\n+   » Beowulf cluster with Pi\
    \  \n» Modelling data using Qt  \n» Puppet + Vagrant virtual boxes  \n» £750 worth\
    \ of prizes up for grabs\n\n![](img/c7d3278283754436651c50a2e9c72912_2_7.png)\n\
    \n**Welcome to the latest edition of Linux User & Developer, the UK and America's\
    \ favourite Linux and open source magazine.**\n\nWe've shown you how to power\
    \ up your Raspberry Pi before, but this time we're taking a different tack. Rather\
    \ than focus on modding, overclocking or otherwise souping-up your Pi, we're showing\
    \ you how to connect together multiple Pis – as many as you can get your hands\
    \ on – into a powerful Beowulf cluster capable of far more advanced calculations\
    \ than a single Pi could ever hope to achieve. Turn to page 50 to get started.\n\
    \nAnd this month we send birthday wishes to Ubuntu, as the 14.10 release marks\
    \ its tenth year in the world. Head to page 16 to find out where this game-changing\
    \ distro came from, and where it's going next, as we get Canonical's inside story.\n\
    \nWe also have two great Raspberry Pi competitions for you this month: you can\
    \ win yourself a BitScope Micro oscilloscope or a brand new FUZE – we have five\
    \ of these to give away! See page 10 to find out how to enter, and check out the\
    \ tutorials we have on the FUZE (page 46) and the BitScope (page 64) if you want\
    \ to learn more about them.\n\nThere are more fantastic tutorials lined-up for\
    \ you too, covering Qt, Jenkins, Vagrant and more. Enjoy your issue.\nGavin Thomas,\
    \ Deputy Editor\n\n# ### Get in touch with the team:\n\nlinuxuser@imagine-publishing.co.uk\n\
    \nFacebook:\nLinux User & Developer\n\nTwitter:\n@linuxusermag\n\n![](img/c7d3278283754436651c50a2e9c72912_2_8.png)\n\
    \nVisit us online for more news, opinion, tutorials and reviews:\n\n# www.linuxuser.co.uk"
