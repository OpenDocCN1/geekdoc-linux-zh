    ## Pidora


    最新的 Pi 发行版之一是基于流行的 Fedora。这是最佳选择吗？


    在 Pi 发布的早期，曾有专为树莓派制作的 Fedora 衍生版，但当它被证明稍显缓慢且存在 bug 时，很快就被舍弃，转而采用了 Raspbian。在那次事件发生后的近两年，Fedora
    的一个正式版本以 Pidora 的形式发布在树莓派上。Pidora 将代码库几乎原封不动地移植到了 Pi 特定的 ARM 架构上，并对 Pidora 进行了一些调整，使其能在
    Pi 硬件上运行而不致性能大幅损失，至少如此。


    首先要注意的是，过去 Fedora 在 Pi 上存在的问题早已不复存在。这是一个非常成熟的操作系统，稳定且通常在树莓派上运行良好。在速度方面，它不如 Raspbian
    或 Arch Linux 快，而在 Raspbian 的情况下，这可能是由多种因素造成的。首先，Pidora 使用 Xfce，众所周知它比 Raspbian
    使用的 LXDE 稍重一些。此外，Fedora 还使用较新的软件，这些软件在设计上略微针对更高端的计算机运行，而 Raspbian 基于旧版本的 Debian，软件要求更为宽松。这是最大的差异，但与其他问题叠加后影响更为明显。


    从 NOOBS 启动过程极其缓慢且容易出错——这种情况在 Raspbian 或 NOOBS 上的其他发行版中不会发生。直接从镜像安装可以消除这个问题，但遗憾的是，Pidora
    还有另一个不如 Raspbian 的劣势：软件匮乏。


    ![](img/c7d327838284436651c50a2e9c72912_73_0.png)


    Pidora 比去年的 Pi 版 Fedora 更加成熟


    软件在不断增加，但许多对于 Raspbian 可用且基础或有用却冷门的基础软件包并不在仓库中。基本功能已经具备，编程选择也很多，但这与缺乏官方 Pi 配件支持相结合，使其在用于项目工作时吸引力下降。


    不过，这绝对不是一个糟糕的发行版。如果它当初成为 Pi 发布时的默认系统，我们很可能也会用类似的话来评价 Raspbian。然而，几乎没有理由选择它而不是使用
    Raspbian 的对应版本。


    > “许多基础或有用却冷门的软件包根本不在仓库中”


    ![](img/c7d3278283754436651c50a2e9c72912_73_1.png)


    其他操作系统更快，但至少 Pidora 足够稳定


    ### 评分


    | 类别 | 描述 | 分数 |

    | :--- | :--- | :--- |

    | 更新 | Pidora 目前保持最新状态，但无法保证未来会继续保持 | 7 |

    | 易用性 | 安装体验优于 Raspbian，且 Xfce 是更易用的桌面环境 | 9 |

    | 教育工具 | 你可以轻松在 Pidora 上编程，但没有专门帮助学习的工具 | 3 |

    | 灵活性 | 像任何 Fedora 发行版一样灵活，但受限于软件包选择和缺乏 Pi 配件支持 | 6 |

    | 总体 | 我们确实喜欢 Pidora，但对于你想用树莓派做的任何事，Raspbian 或 Arch 都更好。 | 6 |


    ## RISC OS


    ### Acorn 计算机的操作系统仍在继续并不断更新


    上次我们进行 Pi OS 分组测试时，我们略微享受了来自过去的 RISC OS，回忆起我们在学校使用 Acorn 计算机的时光，那些计算机是用我们 Tesco
    Computers for Schools 的优惠券购买的。我们意识到，我们对 RISC OS 的美化滤镜有点过强，并且很难从 SD 卡中获取截图。


    自那以后，RISC OS 已经更新了几次，增加了可用软件的数量，改善了操作系统性能，并最终让我们能够轻松地为本篇文章导出 PNG 截图。不过，RISC OS
    仍然是非常相同的系统，一种来自另一个时代的奇特新奇事物，与现代操作系统的生态系统并不十分契合。


    虽然 RISC OS 不是 Linux，但它具有相似的文件结构并使用了包管理器，但除此之外它完全是独特的。使用 RISC 与其他操作系统不同，因为它使用三键系统进行点击和打开菜单，而不像今天的标准那样使用两键。对于新用户来说，这可能令人困惑，加上应用打开在桌面上的方式以及它们并不总是需要双击启动的方式。当处于全屏窗口时，它覆盖面板以及许多其他怪癖。如果你习惯于传统的桌面隐喻，对于你不太可能用作主计算机的东西，需要理解许多新的工作流程。


    ![](img/c7d3278283754436651c50a2e9c72912_74_0.png)


    深入 RISC OS 就像回到三十年前时光旅行


    至于教学工具，非常少。除非你喜欢使用 BASIC 或已经在 Perl 或 C 方面有了一些知识，否则你基本上不会在这里学习编程。你可以访问 GPIO 端口，但它不适合所有项目；Raspbian
    和 Arch 会更好。


    自我们首次检查 Pi 上的 RISC OS 以来，情况在过去 18 个月里发生了变化，但要么变化不够，要么它永远无法朝着 Raspbian 的方向发展。不过，它绝对很有趣，所以如果你有几小时把玩它的时间，我们建议你试试看。


    ![](img/c7d3278283754436651c50a2e9c72912_74_1.png)


    有很多不同的系统和流程需要你去理解


    > “虽然 RISC OS 不是 Linux，但它确实具有相似的文件结构”


    | 类别 | 评论 | 分数 |

    | :--- | :--- | :--- |

    | **更新** | 令人惊讶的是，对于一个我们可以想象并不非常流行的发行版，RISC OS 保持得相当新 | 6 |

    | **易用性** | RISC 使用起来没问题，只是对于很多人习惯的东西来说有点不同 | 6 |

    | **教育工具** | RISC OS 基本上不包含任何教育工具，并且无法真正安装此类工具 | 2 |

    | **灵活性** | 通过一些毅力和知识，你可以用它进行一些项目，但比其他发行版少 | 3 |

    | **总体** | RISC OS 与其他测试中的操作系统非常不同，这并不是坏事，但它不利于教育 | 4 |


    ## Arch Linux


    ### 并非从零开始的 Linux，但在树莓派操作系统中已接近


    只要树莓派基金会的网站上一直有 Raspbian 发行版，就一直有一个适合那些在操作系统选择上更具冒险精神的 Arch 替代方案。


    Raspbian 让你立即开始使用并拥有出色的应用选择。Arch 为用户提供命令行界面，以及除了 Linux 内核以外仅有一点点额外软件包使其能够运行。


    Arch 提供了最基本的构建基础，用于构建完全定制的发行版。为此，此版本带有 pacman 命令行包管理器，帮助你从仓库安装任何可用软件，包括桌面、媒体播放器和其他软件。它使系统没有臃肿部分，对于许多项目或应用程序，正确的设置总是比修改后的
    Raspbian 更快。


    ![](img/c7d3278283754436651c50a2e9c72912_75_0.png)


    Arch Linux 不笨重，它提供了最基本的需求用于完全自定义


    至于树莓派特定功能，在这方面它表现也相当好。Pi 摄像头板受支持，GPIO 引脚也受支持——后者允许访问大量的 Pi 配件，包括 Adafruit 屏幕和传感器以及其他物理设备。其中一些使用起来可能更棘手，因为你不能依赖预构建的
    Raspbian 软件，但使用一些更复杂的添加组件是可以实现的。


    但对于普通用户来说，这可能相当令人恐惧。所有知识都被假定已具备，虽然你可以轻松找到一些快速入门教程，但这可能相当令人望而却步。即使是添加 Pi 摄像头软件也比在配置菜单中启用它需要多得多的努力。它确实提供了学习
    Linux 细节的独特机会，至少这与树莓派的教育理念相符——但在从零到桌面的过程中，可能会丢失许多一次性命令。


    > “虽然你可以轻松找到快速入门教程，但这可能令人望而却步”


    对于极端定制的项目，使用 Arch 可能比使用 Raspbian 更好。然而，对于许多用户来说，性能上不会有太多差异。


    ![](img/c7d3278283754436651c50a2e9c72912_75_1.png)


    要小心一次性命令，因为它们容易在众多流程中丢失


    ### 评分


    | | 描述 | 分数 |

    |---|---|---|

    | 更新 | 作为一个滚动发布且紧密依赖树莓派的系统，Arch 获得大量更新 | 8 |

    | 易用性 | 除非你非常熟悉 Linux 的方式，否则很难入门 | 4 |

    | 教育工具 | 使用 Arch 本身具有教育意义，但它是高等教育而非初学者指南 | 7 |

    | 灵活性 | 由于几乎是从零开始构建，因此可实现的最大自定义程度 | 9 |

    | 总体 | Arch 以其独特的方式非常出色，但绝对不适合所有人，且确实不是树莓派这类设备的最佳发行版 | 7 |

