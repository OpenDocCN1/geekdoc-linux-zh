    \ the Bigtrak and allows it to carry around a drinks can. But it’s not very exciting\
    \ and the top-mounted Raspberry Pi gets in the way of fitting it.\n\nThe Rocket\
    \ Launcher, however, is a much more interesting item, consisting of four foam-tipped\
    \ rockets that you can program the Bigtrak to fire as it trundles around. Of course,\
    \ as you have to pre-program the Bigtrak’s route, it gives your target ample opportunity\
    \ to get out of the way.\n\nTo rectify this flaw we’re going to take the Raspberry\
    \ Pi-controlled Bigtrak that we put together back in issue 141 and update it to\
    \ fire rockets whenever you press ‘X’ on the controller.\n\n### 01 Trigger the\
    \ rockets\n\nThere are two ways of triggering the rocket to fire. The first, used\
    \ by the Bigtrak Junior, is achieved by running a 4.5V current through the 3.5mm\
    \ jack plug. The second, used by the Bigtrak, is to send an infrared signal to\
    \ the Rocket Launcher in a similar way to how a TV remote works.\n\n### 02 Power\
    \ switch and IR LED\n\nThe Bigtrak’s IR LED sits together with the power switch\
    \ on a small PCB with a multicoloured ribbon cable running from it. Since we are\
    \ only interested in the IR LED, we need to determine which cables connect to\
    \ it. This can be done by following the traces running from the IR LED to the\
    \ cables, or by using a multimeter.\n\n### 03 Determine the polarity of the LED\n\
    \nBefore we attach the IR LED to the chassis we need to determine which of the\
    \ wires connect to the anode (positive) leg and which connects to the cathode\
    \ (negative) leg of the LED. Looking closely at the IR LED, you can see that one\
    \ side is flatter than the other; this is the side the cathode pin is on.\n\n\
    ### Full code listing\n\n```python\nimport pygame\nimport time\nimport RPi.GPIO\
    \ as GPIO\nimport subprocess\n\nPS3_AXIS_LEFT_H = 0\nPS3_AXIS_LEFT_V = 1\nPS3_AXIS_RIGHT_H\
    \ = 2\nPS3_AXIS_RIGHT_V = 3\n\nPS3_CROSS = 14\n\npygame.init()\n\nj = pygame.joystick.Joystick(0)\n\
    j.init()\n\nprint('Initialized Joystick : %s' % j.get_name())\n\nDRIVEA0 = 17\n\
    DRIVEA1 = 24\nSTANDBY = 18\nDRIVEB0 = 21\nDRIVEB1 = 22\n\nA0 = False\nA1 = False\n\
    B0 = False\nB1 = False\n\nGPIO.setup(GPIO.BCM)\nGPIO.setup(DRIVEA0, GPIO.OUT)\n\
    GPIO.setup(DRIVEA1, GPIO.OUT)\nGPIO.setup(STANDBY, GPIO.OUT)\nGPIO.setup(DRIVEB0,\
    \ GPIO.OUT)\nGPIO.setup(DRIVEB1, GPIO.OUT)\n\nGPIO.output(DRIVEA0, A0)\nGPIO.output(DRIVEA1,\
    \ A1)\nGPIO.output(STANDBY, False)\nGPIO.output(DRIVEB0, B0)\nGPIO.output(DRIVEB1,\
    \ B1)\n\nthreshold = 0.60\n\nLeftTract = 0\nRightTract = 0\n\ndef setmotors():\n\
    \    GPIO.output(DRIVEA0, A0)\n    GPIO.output(DRIVEA1, A1)\n    GPIO.output(STANDBY,\
    \ True)\n    GPIO.output(DRIVEB0, B0)\n    GPIO.output(DRIVEB1, B1)\n\ntry:\n\
    \    GPIO.output(STANDBY, True)\n\n    while True:\n        events = pygame.event.get()\n\
    \        for event in events:\n```\n\n### No power switch or IR LED?\n\nWhen working\
    \ on projects, we tend to keep any leftover components in a ‘bits’ box in case\
    \ they become useful later on, such as for this project.\n\nIf you modified a\
    \ Bigtrak during the previous tutorial and didn’t keep the power switch, or if\
    \ you just want to fire the rockets without the Bigtrak, then you can get a replacement\
    \ IR LED that can be held in place with some electrical tape or sticky tack.\n\
    \n### Driving a Bigtrak with Pi\n\nBack in issue 141, we showed you how to connect\
    \ up your Raspberry Pi to the Bigtrak in order to drive it using a PS3 controller.\
    \ This tutorial follows on from that point, so you’ll need to go back and give\
    \ the other guide a read first. If you check out the version we uploaded to our\
    \ website, you’ll find a good Fritzing diagram to help with the wiring: bit.ly/1PrgTW\n\
    \n![](img/c7d3278283754436651c50a2e9c72912_60_0.png)\n\n![](img/c7d3278283754436651c50a2e9c72912_60_1.png)\n\
    \n## Tutorial\n\n![](img/c7d3278283754436651c50a2e9c72912_61_0.png)\n\n### Step\
    \ 08\n\nBigTrak LED White (450nm)\n\nBigTrak IR LED Infrared (940nm)\n\nBigTrak\
    \ Battery Compartment\n\nBigTrak Motor 1\n\nBigTrak Motor 2\n\n### 04 Wire up\
    \ the IR LED\n\nNow that we know which two wires to use, they can be soldered\
    \ onto a connector. We’ve used a module connector for ease of connecting to the\
    \ breadboard, along with some heat shrink wire wrap to protect the soldered joints,\
    \ which will reduce the chance of an accidental short circuit.\n\n### 05 Re-attach\
    \ the power switch\n\nTurn the lid of the BigTrak upside down and locate the mounting\
    \ point for the power switch PCB. Carefully put the PCB into place and screw it\
    \ down to hold it securely.\n\n### 06 Transistors and resistors\n\nThe IR LED\
    \ is going to be powered from the Raspberry Pi’s 5V line, so to protect the GPIO\
    \ pins from this higher voltage, we’ll be using a 2N5551 transistor to amplify\
    \ the output from the GPIO pin, as well as several resistors to prevent too much\
    \ current being drawn.\n\n### 07 Wire up the components\n\nTransistors have three\
    \ legs called base, emitter and collector. We connect the emitter to the ground,\
    \ the base (via a 470Ω resistor) to GPIO pin 25 and the collector connects to\
    \ the cathode leg of the IR LED. To complete the circuit, the anode leg of the\
    \ LED needs to be connected (via a 47Ω resistor) to the 5V pin on the Raspberry\
    \ Pi.\n\n### 08 Install the software\n\nLIRC (Linux Infrared Remote Control) is\
    \ a collection of utilities that allows the Raspberry Pi to send and decode IR\
    \ signals. We’ll be using the `lircd` utility to launch the rockets. To install\
    \ `lirc`, run:\n\n```bash\nsudo apt-get install lirc\n```\n\n### 09 Enable the\
    \ LIRC\n\nTo enable LIRC and to tell it which GPIO pin to use as the transmitter\
    \ pin, use:\n\n```bash\nsudo nano /etc/modules\n```\n\n… and add the following\
    \ lines, changing the value of `gpio_out_pin` to the one that the IR receiver\
    \ is connected to and setting the `gpio_in_pin` to an unused pin. This version\
    \ of the `lirc_rpi` module will require both in and out to be set.\n\n```bash\n\
    lirc_dev\nlirc_rpi gpio_in_pin=4 gpio_out_pin=25\n```\n\n### 10 Configure the\
    \ LIRC\n\nLIRC supports multiple ways of controlling IR, so it needs to be configured\
    \ to use the Raspberry Pi GPIO pins. To do this, enter the following command:\n\
    \n```bash\nsudo nano /etc/lirc/hardware.conf\n```\n\n… and either copy the code\
    \ below from FileSilo.co.uk or manually change the DRIVER, DEVICE and MODULES\
    \ lines to:\n\n```bash\nDRIVER=\"default\"\nDEVICE=\"/dev/lirc0\"\nMODULES=\"\
    lirc_rpi\"\n```\n\n### 11 Teach LIRC how to fire the rocket\n\nTo fire the rocket\
    \ we need to send the correct set of pulses through the IR transmitter to trigger\
    \ it. To learn these pulses, LIRC provides the `irrecord` utility which, when\
    \ combined with an IR receiver, allows us to record the IR pulses sent by an unmodified\
    \ BigTrak when it triggers its ‘fire’\n\ninstruction. This will generate a configuration\
    \ file that, after a few minor tweaks, looks like the one in the lircd.conf code\
    \ listing at the bottom of the opposite page. You can manually enter these values\
    \ by running...\n\n```bash\nsudo nano /etc/lirc/lircd.conf\n```\n\n... and exactly\
    \ typing in the text, just like we used to do back in the early Nineties. Or you\
    \ can just copy lircd.conf from FileSilo, under Home Pi by typing:\n\n```bash\n\
    lircd.conf\nbegin remote\n\nname    BigTrak\nflags   RAW_CODES\neps         30\n\
    aeps        100\n\nptrail      2026\ngap       60000\n\nbegin raw_codes\n\n  \
    \      name    fire\n        3071    981   4053  2026  2026  4053\n        4053\
    \    2005  2026  4053  2026  10154\n        3050    981   4074  2005  2026  4053\n\
    \        4053    2005  2026  4053  2026  10154\n        3050    981   4053  2005\
    \  2026  4053\n        4053    2026  2026  4053  2026  10133\n        3050   \
    \ 981   4053  2005  2026  4053\n        4053    2005  2026  2026\n\nend raw_codes\n\
    \nend remote\n```\n\n### 12 Test the LIRC setup\n\nTo enable the changes we need\
    \ to reboot the Raspberry Pi by entering...\n\n```bash\nsudo reboot\n```\n\n...\
    \ and, after rebooting, we can check that LIRC has correctly loaded by typing:\n\
    \n```bash\ndmesg | grep lirc\n```\n\n### 13 Test fire the rockets\n\nTo check\
    \ the hardware and software setup, we can fire the rockets manually by entering:\n\
    \n```bash\nirsend SEND_ONCE bigtrak fire\n```\n\nIf all has gone well then one\
    \ rocket will launch! By running the command again you can fire off the rest of\
    \ the rockets.\n\n### 14 Add extra setup code to the Python script\n\nTo trigger\
    \ the Rocket Launcher from the PS3 controller we need to make some simple changes\
    \ to the Bigtrak.py Python script that we used back in issue 141.\n\nTo run the\
    \ 'irsend' command from Python we will be using the 'subprocess' module, and we'll\
    \ be using the 'X' button on the controller to trigger it. So towards the top\
    \ of the Bigtrak.py file we need to add:\n\n```python\nimport subprocess\nPS3_CROSS\
    \ = 14\n```\n\n### 15 Response to the button press\n\nWe want the rocket to respond\
    \ to our input and fire when the 'X' button is pressed, so rather than the existing\
    \ code that checks if the analog sticks have been moved we just need to add the\
    \ following lines:\n\n```python\nelif event.type == pygame.JOYBUTTONDOWN:\n  \
    \  if event.button == PS3_CROSS:\n        subprocess.call([\"irsend\", \"SEND_ONCE\"\
    , \"bigtrak\", \"fire\"])\n```\n\nOr again, just copy the updated BigtrakWithRockets.py\
    \ script from FileSilo.\n\n### 16 Run the script\n\nWith the code complete we\
    \ can now run it with:\n\n```bash\nsudo python BigtrakWithRockets.py\n```\n\n\
    If all has gone well, you can now drive the Bigtrak around and launch rockets\
    \ on demand!\n\n### 17 Next steps\n\nWith our rocket-toting Bigtrak, we're now\
    \ a little closer to our plans for world domination (although we might be needing\
    \ some bigger rockets for that). We've used one of the official accessories here,\
    \ but there are plenty of unofficial accessories we could add. Ultrasonic sensors,\
    \ a robot arm or the Raspberry Pi camera, perhaps?\n\n### Full code listing (Cont.)\n\
    \n```python\nUpdateMotors = 0\n\nif event.type == pygame.JOYAXISMOTION:\n    if\
    \ event.axis == PS3_AXIS_LEFT_V:\n        LeftTrack = event.value\n        UpdateMotors\
    \ = 1\n    elif event.axis == PS3_AXIS_RIGHT_V:\n        RightTrack = event.value\n\
    \        UpdateMotors = 1\n    if UpdateMotors:\n        if (RightTrack > threshold):\n\
    \            A0 = False\n            A1 = True\n        elif (RightTrack < -threshold):\n\
    \            A0 = True\n            A1 = False\n        else:\n            A0\
    \ = False\n            A1 = False\n        if (LeftTrack > threshold):\n     \
    \       B0 = False\n            B1 = True\n        elif (LeftTrack < -threshold):\n\
    \            B0 = True\n            B1 = False\n        else:\n            B0\
    \ = False\n            B1 = False\n        \n        setmotors()\nelif event.type\
    \ == pygame.JOYBUTTONDOWN:\n    if event.button == PS3_CROSS:\n        subprocess.call([\"\
    irsend\", \"SEND_ONCE\", \"Bigtrak\", \"fire\"])\n\nexcept KeyboardInterrupt:\n\
    \    GPIO.output(STANDBY, False)\n    GPIO.cleanup()\n    j.quit()\n```\n\n![](img/c7d3278283754436651c50a2e9c72912_62_0.png)\n\
    \n### Transistors & resistors\n\nIf you are using a different transistor then\
    \ the value of the resistors may change.\n\nOne guide for calculating them can\
    \ be found at bit.ly/fqztag and the datasheets for these components can usually\
    \ be found using a quick internet search.\n\n### Having trouble?\n\nIf the rocket\
    \ doesn't fire then try checking the following:\n\n- Ensure all cables are connected\
    \ correctly\n- Make sure the rocket launcher isn't turned off\n- Swap the IR-LED\
    \ out for a normal LED. It should flash if the irsend command is working\n- Double-check\
    \ the IR-LED isn't plugged in backwards.\n"
  mdcn: "\n## 教程\n\n![](img/c7d3278283754436651c50a2e9c72912_59_0.png)\n\nLeo White\
    \ 在白天为嵌入式 Linux 设备开发软件，业余时间则折腾树莓派和机器人。更多他的碎碎念（rambles）可以在 bit.ly/18vBPK 找到。\n\n\
    ## 升级你的树莓派版 BigTrak\n\n通过给你的 BigTrak 装备 BigTrak 火箭发射器，让它做好行动准备！\n\n![](img/c7d3278283754436651c50a2e9c72912_59_1.png)\n\
    \n### 你需要什么\n\n- 树莓派版 BigTrak\n  - 见第 141 期\n- BigTrak 火箭发射器\n  - bit.ly/1nRBFo\n\
    - NPN 晶体管\n- 47Ω 和 470Ω 电阻\n\n## 升级你的树莓派版 BigTrak\n\nBigTrak 在 2010 年重新发布时，附带了两个配件，分别是“易拉罐架”（Can\
    \ Caddy）和“火箭发射器”（Rocket Launcher）。易拉罐架是几块塑料，安装在 BigTrak 的背面，让它可以携带一罐饮料。但这并不太令人兴奋，而且顶部安装的树莓派会妨碍它的安装。\n\
    \n然而，火箭发射器则是一个有趣得多的项目，它由四枚带泡沫尖端的火箭组成，你可以编程让 BigTrak 在滚动时发射它们。当然，由于你必须预先编程 BigTrak\
    \ 的路线，所以你的目标有充足的机会躲避。\n\n为了弥补这一缺陷，我们将使用第 141 期中组装的树莓派控制版 BigTrak，并对其进行更新，使其在你按下控制器上的“X”键时发射火箭。\n\
    \n### 01 触发火箭\n\n触发火箭发射有两种方式。第一种是 BigTrak Junior 使用的方法，通过 3.5mm 插头运行 4.5V 电流来实现。第二种是\
    \ BigTrak 使用的方法，即像电视遥控器那样向火箭发射器发送红外信号。\n\n### 02 电源开关和红外 LED\n\nBigTrak 的红外 LED\
    \ 与电源开关位于一块小电路板上，并有一条多彩排线从该板引出。既然我们只对红外 LED 感兴趣，我们需要确定哪些线缆连接到了它。这可以通过追踪从红外 LED\
    \ 到线缆的走线来完成，或者使用万用表。\n\n### 03 确定 LED 的极性\n\n在将红外 LED 连接到车底盘之前，我们需要确定哪根导线连接到 LED\
    \ 的阳极（正极）引脚，哪根连接到阴极（负极）引脚。仔细观察红外 LED，你会发现一侧比另一侧更平；这一侧是阴极引脚所在的一侧。\n\n### 完整代码列表\n\
    \n```python\nimport pygame\nimport time\nimport RPi.GPIO as GPIO\nimport subprocess\n\
    \nPS3_AXIS_LEFT_H = 0\nPS3_AXIS_LEFT_V = 1\nPS3_AXIS_RIGHT_H = 2\nPS3_AXIS_RIGHT_V\
    \ = 3\n\nPS3_CROSS = 14\n\npygame.init()\n\nj = pygame.joystick.Joystick(0)\n\
    j.init()\n\nprint('Initialized Joystick : %s' % j.get_name())\n\nDRIVEA0 = 17\n\
    DRIVEA1 = 24\nSTANDBY = 18\nDRIVEB0 = 21\nDRIVEB1 = 22\n\nA0 = False\nA1 = False\n\
    B0 = False\nB1 = False\n\nGPIO.setup(GPIO.BCM)\nGPIO.setup(DRIVEA0, GPIO.OUT)\n\
    GPIO.setup(DRIVEA1, GPIO.OUT)\nGPIO.setup(STANDBY, GPIO.OUT)\nGPIO.setup(DRIVEB0,\
    \ GPIO.OUT)\nGPIO.setup(DRIVEB1, GPIO.OUT)\n\nGPIO.output(DRIVEA0, A0)\nGPIO.output(DRIVEA1,\
    \ A1)\nGPIO.output(STANDBY, False)\nGPIO.output(DRIVEB0, B0)\nGPIO.output(DRIVEB1,\
    \ B1)\n\nthreshold = 0.60\n\nLeftTract = 0\nRightTract = 0\n\ndef setmotors():\n\
    \    GPIO.output(DRIVEA0, A0)\n    GPIO.output(DRIVEA1, A1)\n    GPIO.output(STANDBY,\
    \ True)\n    GPIO.output(DRIVEB0, B0)\n    GPIO.output(DRIVEB1, B1)\n\ntry:\n\
    \    GPIO.output(STANDBY, True)\n\n    while True:\n        events = pygame.event.get()\n\
    \        for event in events:\n```\n\n### 没有电源开关或红外 LED？\n\n在进行项目工作时，我们倾向于将剩余的组件保存在“零件盒”中，以防日后有用，例如用于本项目。\n\
    \n如果你在之前的教程中修改了 BigTrak 但没有保留电源开关，或者你只是想在没有 BigTrak 的情况下发射火箭，那么你可以获取一个替换的红外 LED，可以使用电工胶带或粘扣将其固定。\n\
    \n### 使用树莓派驱动 BigTrak\n\n在第 141 期中，我们向你展示了如何连接树莓派和 BigTrak，以便使用 PS3 控制器驱动它。本教程从那个点继续，因此你需要回去先阅读另一个指南。如果你查看我们上传到网站上的版本，你会发现一张很好的\
    \ Fritzing 图来帮助接线：bit.ly/1PrgTW\n\n![](img/c7d3278283754436651c50a2e9c72912_60_0.png)\n\
    \n![](img/c7d3278283754436651c50a2e9c72912_60_1.png)\n\n## 教程\n\n![](img/c7d3278283754436651c50a2e9c72912_61_0.png)\n\
    \n### 步骤 08\n\nBigTrak 白色 LED (450nm)\n\nBigTrak 红外 LED 红外线 (940nm)\n\nBigTrak\
    \ 电池仓\n\nBigTrak 电机 1\n\nBigTrak 电机 2\n\n### 04 连接红外 LED 的线路\n\n既然我们知道该使用哪两根线，就可以将它们焊接到连接器上。我们使用了一个模块连接器，以便于连接到面包板，并使用了一些热缩导线包裹来保护焊接点，这将降低意外短路的可能性。\n\
    \n### 05 重新安装电源开关\n\n将 BigTrak 的盖子倒过来，找到电源开关 PCB 的安装点。小心地将 PCB 放入到位并拧紧螺丝，以确保其牢固。\n\
    \n### 06 晶体管和电阻\n\n红外 LED 将由树莓派的 5V 线路供电，为了保护 GPIO 引脚免受此较高电压的影响，我们将使用一个 2N5551\
    \ 晶体管来放大来自 GPIO 引脚的输出，并使用几个电阻以防止抽取过多的电流。\n\n### 07 连接组件的线路\n\n晶体管有三个引脚，分别称为基极、发射极和集电极。我们将发射极连接到地，基极（通过一个\
    \ 470Ω 电阻）连接到 GPIO 引脚 25，集电极连接到红外 LED 的阴极引脚。为了完成电路，LED 的阳极引脚需要通过（一个 47Ω 电阻）连接到树莓派的\
    \ 5V 引脚。\n\n### 08 安装软件\n\nLIRC（Linux 红外遥控）是一组实用工具，允许树莓派发送和解码红外信号。我们将使用 `lircd`\
    \ 工具来发射火箭。要安装 `lirc`，请运行：\n\n```bash\nsudo apt-get install lirc\n```\n\n### 09\
    \ 启用 LIRC\n\n要启用 LIRC 并告知其使用哪个 GPIO 引脚作为发射引脚，请使用：\n\n```bash\nsudo nano /etc/modules\n\
    ```\n\n… 并添加以下行，将 `gpio_out_pin` 的值更改为红外接收器连接的引脚，并将 `gpio_in_pin` 设置为未使用的引脚。此版本的\
    \ `lirc_rpi` 模块需要同时设置输入和输出。\n\n```bash\nlirc_dev\nlirc_rpi gpio_in_pin=4 gpio_out_pin=25\n\
    ```\n\n### 10 配置 LIRC\n\nLIRC 支持多种控制红外线的方式，因此需要配置其使用树莓派的 GPIO 引脚。为此，请输入以下命令：\n\
    \n```bash\nsudo nano /etc/lirc/hardware.conf\n```\n\n… 并从 FileSilo.co.uk 复制下方的代码，或者手动将\
    \ DRIVER、DEVICE 和 MODULES 行更改为：\n\n```bash\nDRIVER=\"default\"\nDEVICE=\"/dev/lirc0\"\
    \nMODULES=\"lirc_rpi\"\n```\n\n### 11 教 LIRC 如何发射火箭\n\n要发射火箭，我们需要通过红外发射器发送正确的一组脉冲来触发它。为了学习这些脉冲，LIRC\
    \ 提供了 `irrecord` 工具，结合红外接收器，我们可以记录未修改的 BigTrak 在触发其“发射”指令时发出的红外脉冲。这将生成一个配置文件，经过一些微调后，看起来就像对面底部\
    \ lircd.conf 代码列表中的那个。你可以通过运行以下命令手动输入这些值……\n\n```bash\nsudo nano /etc/lirc/lircd.conf\n\
    ```\n\n… 并像我们在九十年代初那样精确地输入文本。或者，你可以通过输入以下内容从 FileSilo 中的 Home Pi 部分复制 lircd.conf：\n\
    \n```bash\nlircd.conf\nbegin remote\n\nname    BigTrak\nflags   RAW_CODES\neps\
    \         30\naeps        100\n\nptrail      2026\ngap       60000\n\nbegin raw_codes\n\
    \n        name    fire\n        3071    981   4053  2026  2026  4053\n       \
    \ 4053    2005  2026  4053  2026  10154\n        3050    981   4074  2005  2026\
    \  4053\n        4053    2005  2026  4053  2026  10154\n        3050    981  \
