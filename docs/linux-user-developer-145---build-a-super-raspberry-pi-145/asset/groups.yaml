    facebook.com/HistoryofWarMag   twitter.com/@HistoryofWarMag


    ## 评测


    ![](img/c7d3278283754436651c50a2e9c72912_79_0.png)


    ### 迷你 PC


    #### HummingBoard-i2eX


    SolidRun 内部开发设计 Carrier-One 的公开发售版，能否取代畅销的树莓派单板计算机？


    **优点**

    HummingBoard 的性能非常出色，且高端型号包含了该市场档次中罕见的功能。


    **缺点**

    大型散热器意味着大多数树莓派 GPIO 扩展无法工作，并阻止主板装入大多数现有机箱。


    开箱即见，HummingBoard-i2eX 令人惊讶：它配备了我们在测试过的同类设备中最大的出厂预装散热器，这是一个强大的铝块，固定在处理器和内存上，这也是主板整体高度
    23mm 和重量 71g 的原因——几乎达到树莓派的两倍。它也损害了兼容性：树莓派扩展板如果不使用转接器就无法连接到 GPIO 端口，而 HummingBoard-i2eX
    对于大多数——但并非所有——树莓派机箱来说都太臃肿了。


    起初，散热器的存在似乎有些奇怪：竞争对手的板卡要么完全没有冷却，要么只有比芯片大不了多少的小散热器。然而，在使用过程中，散热器表面温度达到 75°C，这解释了散热器及其表面警告贴纸的存在。这也可能解释了之前宣布的四核变体尚未出现在市场上的原因。


    事实上，HummingBoard 是一整个设备家族。与无可否认从中获得灵感的树莓派不同，HummingBoard 根本不是单板计算机（SBC），而是带有载板的板卡级模块（CoM）单元，因此其原始名称为“Carrier-One”。除了三种处理器选择——Freescale
    i.MX6 Solo、Dual-Lite 或 Dual 之外，该家族还包括两块载板。主板在 i.MX6 Solo 和 Dual-Lite 变体上可用，并匹配树莓派的功能集，除了缺乏
    DSI 和复合视频输出；高端“eX”板增加了 LVDS 视频、千兆以太网、mSATA 和 mini-PCI Express 连接，并且仅与 i.MX6 Dual
    处理器搭配提供，该处理器配备了比 Dual-Lite 变体的 GC880 更强大的 GC2000 图形处理器。


    理论上，这并没有真正的理由；CoM 设计，特别是其连接到载板的方式，是完全相同的。

