    \n**左** HummingBoard 采用计算机模块加载板的设计\n\n### 其他推荐\n\n![](img/c7d3278283754436651c50a2e9c72912_80_1.png)\n\
    \n**CuBox-i4Pro**\n*£124*\n如果你不需要树莓派风格的 GPIO 功能，并且预算稍宽裕一些，CuBox-i4Pro 在拥有与 HummingBoard\
    \ 完全软件兼容性的同时，配备了更强大的四核处理器和 2GB 内存。它被封装在一个小方盒中，额外的功能包括光学音频输出、eSATA 以及集成的 Wi-Fi\
    \ 和蓝牙无线模块。\n\n![](img/c7d3278283754436651c50a2e9c72912_80_2.png)\n\n> 散热器的存在似乎有些奇怪：竞争对手的板卡完全没有散热装置\n\
    \n涵盖所有三种可用型号的 HummingBoard。这为 HummingBoard 的真正卖点敞开了大门：潜力。如果 SolidRun 选择利用这一优势，用户只需保留载板并更换计算机模块（CoM），就可以以低廉的成本升级到下一代处理器。如果\
    \ SolidRun 走这条路，将是其的一大成就；否则，这将是错失向嵌入式爱好者领域引入传统 PC 架构灵活性的机会。\n\n这种可升级性将很好地契合 eX\
    \ 载板独特的 mSATA 和 mPCIe 端口，这在市场低端产品中是独一无二的。mSATA 连接允许在电路板底部安装紧凑且高容量的固态驱动器（SSD）。同时，mPCIe\
    \ 插槽允许安装各种高速附加硬件，包括无线无线电模块，前提是有为 ARMv7 编译的驱动程序。HummingBoard-i2eX 在两个操作系统下进行了测试：Android\
    \ KitKat 4.4 和 Debian Jessie。前者响应灵敏且令人愉悦，可以完全访问 Google Play 应用商店，但后者才真正释放了 HummingBoard\
    \ 的真正潜力。\n\nSysBench 95 百分位时间 22.94ms 展示了 HummingBoard 的能力，远超树莓派稳重的 51.45ms 以及基于\
    \ AllWinner A20 的竞品 Banana Pi 的 29.72ms。多线程结果更加令人印象深刻，对于 10MB 测试文件，压缩和解包时间分别为\
    \ 1.296s 和 0.136s，而树莓派分别为 8.64s 和 3.08s。但设计中仍然存在瓶颈：在千兆网络上测得的原始网络吞吐量仅为 371MB/s，甚至低于\
    \ SolidRun 在手册中警告客户的 470MB/s。\n\n*Gareth Halfacree*\n\n## 总结\n\nHummingBoard 是一个不可否认的惊艳设计，其计算机模块布局表明未来可能的升级。处理器速度快，mPCIe\
