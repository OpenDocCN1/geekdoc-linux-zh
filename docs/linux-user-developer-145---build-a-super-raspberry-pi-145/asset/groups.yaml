    # RISC OS


    # The Acorn Computers OS keeps on going and keeps on being updated


    The last time we did a PI OS group test we slightly enjoyed the blast from the
    past that was RISC OS, remembering our time in school using Acorn Computers that
    our Tesco Computers for Schools vouchers paid for. We came away realising that
    the tint on our rose glasses was a bit strong and struggling to get any screenshots
    off the SD card.


    Since then, RISC OS has been updated a few times, increasing the amount of available
    software, improving the performance of the OS and finally letting us easily export
    PNG screenshots for this article. It''s still very much the same RISC OS though,
    a curious novelty from another time that doesn''t really fit in with the ecosystems
    of modern operating systems.


    While RISC OS is not Linux it does have a similar file structure and uses a package
    manager, but otherwise it is completely its own thing. Using RISC is different
    from other operating systems as it uses a three-button system for clicking and
    opening menus, unlike the two-button standard of today. This can be confusing
    for new users, along with the way apps open on the desktop and the way they don''t
    always require double-clicks to launch. When it is in a full-screen window, it
    covers the panel and a whole host of other quirks. If you''re used to the traditional
    desktop metaphor there are a lot of new workflow processes to get your head around
    for something you''re unlikely to use as your main computer.


