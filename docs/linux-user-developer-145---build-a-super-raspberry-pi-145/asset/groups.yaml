    *We actually get this in every now and then and it''s a legitimate question: if
    you don''t know how to write a CD or DVD in this way then you wouldn''t really
    know.*


    *The main issue here is that you need to use special software to write an ISO
    to disc. On Linux we like to use an app called Brasero — if you have an older
    issue of this magazine then you will find it mentioned on pages 96-97, which detailed
    what''s on each DVD before we launched FileSilo. If you have a blank disc in your
    drive and know the location of an ISO, it will let you burn it properly to disc
    and then boot from it.*


    *You may also have to double-check whether or not you have the disc drive set
    as a higher priority in the boot order than your hard drive in the BIOS. Failing
    that, you can usually press a key when you turn on your computer to choose what
    to boot from. It''s usually labelled as the boot menu.*


