    \ 内存的标准 x86 硬件上运行。这意味着它是重新利用旧 PC 和笔记本电脑的绝佳方式，用于你在想要设置自定义网络亭/标牌网络的空间。更棒的是，创建一个带有\
    \ Webconverger 的可启动 U 盘非常简单，因此你可以临时转换计算机。当你运行该发行版时，会出现一个空白桌面，随后是一个浏览器窗口 – 这就是你的网络亭。一旦它在公共场所运行并可被路人访问，他们唯一能做的就是使用浏览器（使用你自定义的配置）。即使你给了他们关机的能力，他们也完全没有任何其他可交互的东西。这使得\
