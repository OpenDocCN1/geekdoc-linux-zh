    ## 综述


    ![](img/c7d3278283754436651c50a2e9c72912_83_0.png)


    左图。设置项并未提供对浏览器中可执行操作的过多控制。


    ### 优点

    - 与任何其他网页浏览器相比，它在树莓派上更轻量、速度更快，且经过修改后能在大多数网站上正常工作


    ### 缺点

    - 与大多数其他浏览器相比，功能少很多，甚至与之前的树莓派浏览器 Midori 相比也是如此


    ## 软件


    ### Epiphany 网页浏览器


    专为树莓派全新替代的浏览器基于鲜为人知的 GNOME 网页浏览器：Epiphany。


    过去两年左右使用树莓派的体验总体非常棒。我们花了一年左右的时间才不再对它在各种我们观看或亲手制作的项目中所展现出的强大能力感到惊讶。然而，我们始终难以处理的问题之一是网页浏览：Midori
    速度慢且卡顿，并且会占用树莓派的所有系统资源。


    似乎树莓派基金会也注意到了这一点，并一直在为 Raspbian 打造一款新浏览器，它在保持可用软件特性的同时，更加轻量且快速。GNOME 网页浏览器 Epiphany
    就是这一努力的结果，并在最新版本的 Raspbian 中取代了 Midori。


    首要说明的是：就性能而言，这两个浏览器之间存在显著且相当大的差异。Epiphany 不会让树莓派陷入停滞状态，浏览时几乎没有或完全没有卡顿，即使页面正在加载也是如此。根据我们的经验，这相较于
    Midori 是一个相当大的改进，当时即使是访问树莓派官网都会让小巧的树莓派不堪重负。


    然而，更好的浏览体验是有代价的，那就是功能较少的浏览器。Epiphany 极其基础，其最高级的功能就是选项卡浏览。虽然 Midori 与 Firefox 和
    Chrome 相比相当简单，但它至少具有较高的可定制性并支持多种插件。Epiphany 仅具备浏览器功能的基础架构：历史记录、书签、停止/刷新按钮、选择下载位置以及其他一些非常基本功能。


    不过，它可以渲染你需要的所有网页。在树莓派上，这些网页并不多：当你的主要用途仅仅是查看树莓派的教程或 bug 时，缺少同步书签、应用商店或超级高级隐私控制并不是什么大问题。它不会成为你生活中的主要网页浏览器，但对于大多数人使用树莓派执行的任务来说，Epiphany
    已经足够好了。


    如果你想要更多功能，包括 Midori，你始终可以在树莓派上安装其他浏览器。


    Rob Zwetsloot


    ### 总结


    Epiphany 并不是世界上最好的浏览器，但对于不将树莓派作为主要计算机使用的人来说，它是最好的浏览器。它轻量且快速，但非常简化；不过，它能正确渲染页面，同时让你能够在使用它的时候继续操作树莓派。


