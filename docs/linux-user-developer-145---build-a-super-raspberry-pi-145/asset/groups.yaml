    ## FAQ What is the new browser?


    ![](img/c7d32783754436651c50a2e9c72912_69_0.png)


    ### What is the new browser?


    The main Raspberry Pi distro has a new browser, but what is it and what makes
    it better than the previous version?


    ![](img/c7d32783754436651c50a2e9c72912_69_1.png)


    Rob Zwetsloot models complex systems and is a web developer proficient in Python,
    Django and PHP. He loves to experiment with computing.


    - **If you like this...**

    The new Pi browser is based on GNOME''s Epiphany. You can find tarballs here:
    bit.ly/IE8bSE1


    - **Further reading**

    One of the browser''s developers has written a blog post with all the technical
    details: bit.ly/Yyh5xX


    > **I hear there''s a new browser for the Raspberry Pi. Is this really a big deal?**

    > Absolutely! The Raspberry Pi has such limited resources that any new, custom
    apps for it that help it work just that little bit better are always welcome.
    As much as we love the original browser, this really frees up processing power.


    > **Oh, so it''s a custom browser specifically for the Raspberry Pi?**

    > Basically, yes. It''s based on another browser with slightly different technology
    and modified to run faster and better on the Pi than the original browser, or
    the browser that was already on the Raspberry Pi.


    > **What was the original browser, again?**

    > The new browser is replacing Midori, which has been on Raspbian since the very
    beginning. Midori is well-known among the open source and Linux community as a
    very quick browser that does not use many resources at all. This made it a good
    fit for Raspbian at the time but it''s still not the fastest browser in the world.


    > **Okay, so what have they named this new browser, then?**

    > Well it doesn''t really have a proper name just yet. It''s based on GNOME''s
    Epiphany Browser that is usually just called Browser in GNOME itself.


    > **Why do they just call it Browser?**

    > The current GNOME desktop style is to name everything extremely simply. Browser,
    Software and Accounts are just a few examples. It''s part of their effort to make
    the GNOME shell accessible -- although it doesn''t really relate to the Raspberry
    Pi at all.


    > **Okay, well I''ll call it Epiphany then. Why didn''t it come to Raspbian before?**

    > It wasn''t light enough for the Pi to begin with. There is an ARM release of
    it in Debian so feasibly you could have installed it to the Raspberry Pi -- however,
    Midori not only would have worked a lot better, it also had a bit more functionality.


    ### More functionality?


    Yes, GNOME’s Epiphany browser is very minimalist. It serves its purpose for a
    lot of people but it only has the bare minimum features outside of actually loading
    web pages. It does render these pages properly though and will at least open new
    tabs.


    ### Does the Raspberry Pi version have more features than the original?


    Not really. Compared to the normal version of Epiphany it’s just about the same,
    but due to all the tweaks and optimisations it runs a lot better than Midori currently
    does. There’s not really that big of an expectation that people will be using
    the Raspberry Pi as their main portal to the internet, though.


    ### I suppose that’s true. What kind of optimisations were made then?


    One of the big changes was a switch to Webkit1. Webkit is an engine for running
    web browsers that used to be in Chrome/Chromium and is currently used in Safari.
    Webkit1 does not use multiple processes, which means it runs better on the Raspberry
    Pi.


    Other upgrades have been made by porting and optimising the way Java is handled,
    using the custom OXM player to perform hardware acceleration on video playback
    and various other small memory and CPU tweaks to make it run better.


    ### Wow, okay. That seems like a lot of work. How does it perform?


    We haven’t had a chance to use it extensively at the time of writing, but it is
    definitely faster than Midori for some general web browsing.


    ### Sounds good. How can I get it on Raspbian?


    By the time this has been published there will probably be a newer version of
    Raspbian with it preinstalled by default. If you don’t want to write a new card
    then you can always update your version of Raspbian first and then install Epiphany
    by using the following:


    ```bash

    sudo apt-get update

    sudo apt-get dist-upgrade

    sudo apt-get install epiphany-browser

    ```


