    \ that everything should be up and running, how do you actually use it in your\
    \ own code? You can load all of the available functions and objects into the global\
    \ scope with the command:\n\n```python\nfrom SimpleCV import *\n```\n\nMaking\
    \ sure that you have your USB camera plugged in, you can now create a camera object\
    \ with:\n\n```python\ncam = Camera()\n```\n\nThis will load the required drivers,\
    \ and initialise the camera so that it is ready to start taking pictures. Once\
    \ this object creation returns, you can grab an image from the camera with:\n\n\
    ```python\nimg = cam.getImage()\n```\n\nAt least in the beginning, when you are\
    \ experimenting, you may want to see what this image looks like. You can do this\
    \ with:\n\n```python\nimg.show()\n```\n\nYou will, of course, need to have a GUI\
    \ up and running in order to actually see the movie. Otherwise, you will get an\
    \ error when you try and call `img.show()`. Don't forget that you can always pull\
    \ up documentation with commands like:\n\n```python\nhelp(cam)\nhelp(img)\n```\n\
    \nWith the `Image` object, you can do some basic processing tasks right away.\
    \ You can scale an image by, say 90%, with `img.scale(0.90)`. You can also crop\
    \ an image by giving it a start location and saying how many pixels across and\
    \ how many up and down you want to crop. This looks like `img.crop(100,100,50,50)`.\
    \ SimpleCV has the location (0,0) as the top-left corner of an image.\n\nThe really\
    \ interesting functionality in SimpleCV is the ability to find features within\
    \ an image and to work with them. One of the clearest features that you can look\
    \ for is blobs, where blobs are defined as continuous light regions. The function\
    \ `img.findBlobs()` will search the captured image for all blobs and return them\
    \ as a FeatureSet. You can set the minimum number of pixels to consider a single\
    \ blob, the maximum number of pixels, as well as a threshold value. If you are\
    \ looking at a region that has some hard edges, you can use the function `img.findCorners()`.\
    \ This function will return a FeatureSet of all the corners within the captured\
    \ image. A very simple monitor program could use one of these functions to see\
    \ if there is any motion happening. If there is, then the set of blobs or corners\
    \ will change from one frame to another. Of course, a little more reading will\
    \ lead you to the `img.findMotion()` function. This function will take two subsequent\
    \ images and see if any motion can be detected going from one to the other. The\
    \ default method is to use a block matching algorithm, but you can also use either\
    \ the Lucas-Kanade method or the Horn-Schunckl method.\n\nThe above methods will\
    \ let you know some features of the captured images, and if any kind of motion\
    \ has occurred. But what if you are more interested in identifying whether people\
    \ have been moving around? Maybe you have an area you need to secure from espionage.\n\
    \n> SimpleCV is built on top of OpenCV, making it easier to use for common tasks\n\
    \n### You can look for blobs – continuous light regions\n\nIn this case, you can\
    \ use the function 'img.findSkinToneBlobs()'. You can use a binarise filter threshold\
    \ to set what constitutes a skin tone. If you need to do more, you have access\
    \ to all of the underlying OpenCV functionality. One of these more advanced functions\
    \ is face recognition. You can use the function 'img.findHaarFeatures()' to look\
    \ for a known type of object. If you wanted to look for faces, you could use something\
    \ like:\n\n```python\nfaces = HaarCascade('./SimpleCV/Features/HaarCascades/face.xml','myFaces')\n\
    img.findHaarFeatures(faces)\n```\n\nWhen you start developing these types of programs,\
    \ one thing that might come into play is timing issues. You want to be sure that\
    \ your code is fast enough to catch everyone that may be moving through the field\
    \ of the camera. In order to figure out what is costing time, you need to be able\
    \ to profile your code. The shell in SimpleCV provides a feature called 'timeit'\
    \ that will give you a quick and dirty profiling tool that you can use while you\
    \ are experimenting with different algorithms. So, as an example, you can see\
    \ how long the 'findBlobs()' function takes on your Raspberry Pi with something\
    \ like:\n\n```python\nimg = cam.getImage()\ntimeit img.findBlobs()\n```\n\nOnce\
    \ you find and fix the bottlenecks in your code, you can create the end product\
    \ for your final version.\n\nWith this article, you should now have enough to\
    \ start using cameras from within your own programs. We have only been able to\
    \ cover the bare essentials, however, so don't forget to go check out the documentation\
    \ covering all of the other functionality that is available in the SimpleCV module.\n\
    \n### Full code listing\n\n```python\n# SimpleCV provides a simple interface to\
    \ OpenCV\n# First, we will import everything into the local # namespace\n\nfrom\
    \ SimpleCV import * \n\n# Make sure your USB camera is plugged in, # then you\
    \ can create a camera object\ncam = Camera()\n\n# Getting an image from the camera\
    \ is straightforward\nimg = cam.getImage()\n\n# You can rescale this image to\
    \ half its original size\nimg2 = img.scale(50, 50)\n\n# There are several features\
    \ that you may want to look at\n# You can extract a list of blobs\nblobs = img.findBlobs()\n\
    \n# You can draw these blobs and see where they are on # the image\nblobs.draw()\n\
    \n# or a list of corners\ncorners = img.findCorners()\n\n# If you want to identify\
    \ motion, you will need two # frames\nimg2 = cam.getImage()\n\n# You can get a\
    \ FeatureSet of motion vectors with\nmotion = img2.scale(cam, 50)\n\n# Face recognition\
    \ is possible too. You get a list of # the types of features you can look for\
    \ with\nimg.listHaarFeatures()\n\n# For faces, you can generate a Haar Cascade\n\
    Faces = HaarCascade('Face.xml')\n\n# Now you can search for faces\nfound_faces\
    \ = img.findHaarFeatures(faces)\n\n# You can load image files with the Image class\n\
    my_img = Image('my_image.jpg')\n\n# You can save images to the hard drive, too\n\
    img.save('camera.png')\n```\n\n![](img/c7d3278283754436651c50a2e9c72912_68_0.png)\n\
    \nAbove Any basic USB webcam or surveillance monitor will do for this\n\n### Importing\n\
    \nSimpleCV is built on top of OpenCV and provides a simplified set of functions.\
    \ But what can you do if you have more complicated work to do? You always have\
    \ the option of using OpenCV directly to gain access to the full set of functions.\
    \ You can import the module into the local namespace with:\n\n```python\nfrom\
    \ cv2 import *\n```\n\nNot only do you have the usual image manipulation functions\
    \ and the feature detection, there are also the ability to track video. There\
    \ are functions to look at optical flow. These look at apparent motions in a video,\
    \ from one frame to the next. That are caused by either the object moving or the\
    \ camera moving. This is a common preprocessing step in vision systems. You can\
    \ even construct 3D information from a set of stereo images gathered by a pair\
    \ of cameras. With OpenCV, you really can deal with almost any vision problem\
    \ you might be tackling.\n"
