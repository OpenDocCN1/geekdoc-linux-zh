    # Monitor a Cisco router using MRTG


    Start using MRTG and its tools to monitor traffic loads


    ![](img/c7d3278283754436651c50a2e9c72912_30_0.png)


    ![](img/c7d3278283754436651c50a2e9c72912_30_1.png)


    # 01 Install MRTG


    Most Linux distributions have a ready-to-install MRTG package you can use. MRTG
    is a Perl script, therefore you can easily make changes to it if you want to modify
    something.

    If you are going to run MRTG as the Apache user, which is recommended, your first
    need to do the following as root, provided that the Apache process is owned by
    the www-data user (adapt the command according to your Linux system):


    ```

    $ chown www-data:root /var/lock/mrtg

    ```


    ![](img/c7d3278283754436651c50a2e9c72912_30_2.png)


    # 02 About SNMP


    SNMP is a known TCP/IP protocol that is available for most ''clever'' devices,
    including Linux and other UNIX machines, routers, network switches, Windows machines
    and many others.

    It provides statistics on the status of network interfaces, incoming and outgoing
    traffic, dropped datagrams and error messages, and it allows clients to access
    these statistics easily and remotely.


    ![](img/c7d3278283754436651c50a2e9c72912_30_3.png)


    # 03 Useful SNMP commands


    SNMP comes with many commands, including snmpbulkget, snmpd, snmptrap, snmptrap,
    snmpbulkwalk, snmpget, snmpstatus and snmpwalk. By far the most useful of them
    is the snmpwalk command that retrieves a subtree of values using SNMP GETNEXT
    requests.

    If the community string name is wrong or the device does not currently support
    SNMP, the output of the snmpwalk command will look similar to the following:


    ```

    $ snmpwalk -0s -c LUD -v 1 cwfi

    Timeout: No Response from cwfi

    ```


    # 04 Configure MRTG


    Configuring MRTG can be the most difficult part of the whole process - especially
    when you are dealing with a non-standard network device, as you may have trouble
    finding the correct object identifier to query. Cisco routers are popular devices
    so setting up SNMP on a Cisco network device is a well-known process, but finding
    the correct object identifier can always be tricky.


    ![](img/c7d3278283754436651c50a2e9c72912_30_4.png)


    # 05 Cisco IOS


    The first thing to do on the Cisco 877W ADSL router is to turn on SNMP and create
    an SNMP community string that will help you acquire the desired information. Cisco
    IOS has many cryptic commands, so type carefully.

    The RO (read-only) community string (LUD) permits Get requests only, whereas an
    RW (read-write) community string - which is not needed here - allows both Get
    and Set requests.

    The following command, which produces many lines of output, will verify that the
    SNMP setup on a router named Cisco is working properly:


    ```

    $ snmpwalk -0s -c LUD -v 1 cisco

    ```


    ![](img/c7d3278283754436651c50a2e9c72912_30_5.png)


    # 06 Configure Apache


    You should set up Apache so that you can see the static HTML output of MRTG not
    only locally but also from your network or the internet. You can do this by using
    a subdomain. The subdomain that will be used here is mrtg.mtsoukaloos.eu - yours
    will vary - and it requires the addition of a new DNS entry. After configuring
    Apache, and do not forget to enable the new site and make Apache use the new configuration:


    ```

    # a2ensite mrtg.mtsoukaloos.eu

    # /etc/init.d/apache2 reload

    ```


    ![](img/c7d3278283754436651c50a2e9c72912_30_6.png)


    # 07 MRTG files and directories


    One thing that you should carefully consider is the fact that the directory where
    MRTG keeps its files should have the necessary UNIX permissions in order to be
    read and written by the user that runs the MRTG Cron job.

    The structure of the directory where MRTG keeps its files is pretty simple: it
    has just one directory with plenty of files corresponding to the supported interfaces
    and devices.'
