    > 这实际上可能是由多种原因造成的，但听起来您主要是在更新程序（Updater）方面遇到了图形问题，而不是其他因素是罪魁祸首。


    ### 常见问题：音乐的重要性


    **问：哪些音频文件类型是开源的？**

    答：有几种，但最主要的是 Vorbis 和 FLAC。Vorbis 通常与 OGG 文件相关联，它们类似于 MP3，而 FLAC 是一种用于最高音质无损音频的编解码器。


    **问：在 Linux 上播放 MP3 合法吗？**

    答：这是一个灰色地带，也适用于其他专有编解码器。解码音频最流行的一种方式是通过 Ffmpeg，它在播放时不存储文件内容——这意味着它不会违反某些版本的软件专利。目前还没有人就此追究过。


    **问：为什么开源编解码器不更受欢迎？**

    答：其中一些确实很受欢迎，尤其是在视频领域。似乎容器、编解码器和文件类型之间存在五年或十年的周期。15 年前是 MP3，然后是 AVI，现在是 MP4。但随着流媒体服务的出现，MP3
    可能永远不会被取代。


    ![](img/c7d3278283754436651c50a2e9c72912_87_0.png)


