  - "[PAGE 16]\n\n# # 10 Years of Ubuntu\n\nCelebrate the distro's birthday with a\
    \ look back at its history\n\n# FEATURE\n\n![](img/c7d3278283754436651c50a2e9c72912_16_0.png)\n\
    \n# ## We celebrate a decade of the distro by looking back at Ubuntu with its\
    \ movers and shakers\n\nTen years ago this month, a seemingly unassuming distro\
    \ nicknamed Warty Warthog emerged in the Linux landscape and set in motion a cultural\
    \ landslide that would see Linux rise from the shadows of the archetypal operating\
    \ systems and become, in 2014, a household name. Since October 2004, Warty Warthog\
    \ has evolved through numerous forms into Utopic Unicorn, the latest version of\
    \ Ubuntu.\n\nA catalyst for change, Ubuntu has achieved a great deal in its first\
    \ fabulous decade. It pioneered the idea of a Linux operating system that just\
    \ worked straight out of the box, without the need r manually troubleshoot and\
    \ configure your hardware. It popularised the graphical interface that we use\
    \ for most of our distro installations today, making them more accessible and\
    \ easier to use, as well as the long-term support releases that many of us rely\
    \ on for our main computers. It sharply divided opinion by having an opinion on\
    \ the future of desktop and mobile operating systems, predicting convergence and\
    \ boldly taking a hand in preparing the way.\n\nTwo forces are driving Ubuntu\
    \ forward that, together, have found a degree of success in getting Linux into\
    \ the public eye that very few other distributions have achieved: Canonical's\
    \ leadership and the Ubuntu community.\n\nThe relationship between the two is\
    \ an exemplary model of how open source companies can collaborate with their end-users\
    \ in order to reliably deliver exactly what they want. Ubuntu contributors knows\
    \ that they are heard by the Canonical team leaders, and the development process\
    \ is incredibly democratic while still being rigid enough to adhere to Ubuntu's\
    \ strict release schedule and LTS commitments. It's a delicate balance and Canonical\
    \ struck it cleanly, producing quality Linux distros twice a year.\n\nToday we\
    \ look back at ten years of Ubuntu and celebrate the achievements of the developers\
    \ and contributors who made it real for us – and look to the future, to see where\
    \ we're going.\n\n+   - **Jane Silber**\n  *Chief executive officer*\n  Jane joined\
    \ Canonical before the original Ubuntu release as the chief operating officer.\
    \ She's worked on many Canonical projects and has a C and C++ programming background.\n\
    - **Martin Pitt**\n  *Software engineer*\n  Martin was a prolific Linux developer\
    \ for seven years before becoming joining the first Ubuntu developers. He now\
    \ works in the plumbing layer, but used to do more for the distro.\n- **Alan Pope**\n\
    \  *Applications project manager*\n  A veteran of the Linux community, Alan was\
    \ once a tech support volunteer on Launchpad. Now, he coordinates with the community\
    \ in making core apps for Ubuntu phones.\n- **Richard Collins**\n  *Mobile product\
    \ manager*\n  Richard heads up the mobile side of Ubuntu. Before coming to Canonical,\
    \ he already had a mobile background from working at the Symbian foundation for\
    \ many years."
