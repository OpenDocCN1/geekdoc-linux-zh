    ## 开源初创公司专栏


    ### 免费还是开放？


    依赖开源软件的开发者希望回馈社区，那么初创公司如何平衡这一点与商业压力？


    ![](img/c7d3278283754436651c50a2e9c72912_12_0.png)


    **理查德·斯梅德利**是一位精通 Unix 和网络技术的多面手，专注于自由及开源软件


    ![](img/c7d3278283754436651c50a2e9c72912_12_1.png)


    > 没错！Moltin 是一个电子商务平台，提供 API 以便轻松管理商店和购物车


    报纸标题偶尔会提醒我们“英国企业在采用开源方面落后”，但对英国自由软件社区来说，更切中要害的问题是：**企业在回馈方面做了什么？** 初创公司在此处小心翼翼地行走在一条细线上，一边是大多数码农现在所处的开源文化，另一边是背后的投资者要求保护所谓的知识产权（请在
    www.gnu.org/philosophy/not-ipr.en.html 阅读更多相关内容）。


    一些公司发布的最终产品缺少某些功能，除非你购买非开放版本。另一种替代方案是发布帮助你构建项目的工具和平台——例如 Rails，它源自 Basecamp。这里的一个好例子是
    Moltin，一家位于纽卡斯尔的初创公司，加入了 Ignite100 初创加速器项目，它提供用于构建电商网站 的 API 和 SDK，旨在消除开发者在使用当前解决方案时所感受到的痛苦。


    “我们希望向开发者提供一组组件，让他们能够创建简单的商店，同时在我们的商业服务中提供更复杂的方面，”Moltin 联合创始人 Adam Sturrock 告诉我们。来自与另一位联合创始人
    Jamie Holroyd 一起在一家网络代理公司从事电商软件开发的挫败感，这款软件很大程度上是由填补用户空缺的需求驱动的，但许可决策则是商业驱动的：“我们花了一段时间思考什么对我们有意义——哪些应该作为开源发布，哪些应该保留在内部，最终我们认为我们达成了良好的平衡。展望未来，我们有几个额外的项目和工具，我们将考虑将其开源。”


    Moltin 发布了处理身份验证过程的开源 PHP 和 JavaScript SDK，“使开发者能够更快地开始调用 API”，Sturrock 这样描述他们在
    Github 页面和 packageist.org 上提供的一些软件。


    这种回馈开发者社区，而不是完全承诺自由软件的模式，可以在整个 Web 开发者社区中看到，随意浏览 Github 可以看到大量供开发者使用的 Ruby 和 JS
    工具，以及 PHP 库。“我们的管理仪表板是使用我们的 PHP SDK、Slim PHP 框架和 Twig 模板引擎构建的，”Sturrock 说。


    “我们旨在近期将此开源，供开发人员和代理机构改进、贴牌和定制。


    我们还使用我们的 SDK 构建了许多工具，以帮助通过 AngularJS 驱动的商店和类似我们管理仪表板的 PHP 前端框架进一步加快开发启动。” 当然，它也有一些优势：“我们往往从用户那里获得广泛的贡献，从修复拼写错误到修复
    bug 以及添加/增强功能。


    我们还收到针对我们每个软件包的大量功能请求，我们评估哪些对每个人使用都有意义，尽量避免添加使用案例狭窄的功能。”


    正如我们上个月提到的，如果没有自由和开源软件，初创公司所做的很多事情将根本不可能实现。“我们的 REST API 使用 OAuth 2.0 来验证请求，”Sturrock
    说。“我们的 API 后端是使用许多开源项目构建的。后端是用 PHP Laravel 框架编写的，我们的数据库运行 PostgreSQL 和 Redis。这意味着我们的
    API 与基础设施无关，我们可以从任何地方托管和运行，包括我们的本地机器到多服务器配置”。


    下个月，我们将探讨 GNU/Linux 和 FOSS 在一些财务上更成功的知名科技初创公司中的定位。


    ## 乔恩·马斯特斯


    ### 内核专栏


    乔恩·马斯特斯向我们介绍了内核在最新的 Shellshock 安全漏洞中的作用，并总结了内核社区为最终 3.17 版本所做的工作


    ![](img/c7d3278283754436651c50a2e9c72912_13_0.png)


    **乔恩·马斯特斯**是一位 Linux 内核黑客，自 13 岁第一次上大学以来，他已在 Linux 上工作约 19 年。乔恩住在马萨诸塞州剑桥市，并为一家大型企业
    Linux 供应商工作。他在 [kernelpodcast.org](kernelpodcast.org) 上发布每日 Linux 内核邮件列表摘要


    #### Linux 内核是否“shellshocked”（遭遇 shellshock）？


    Bash (Bourne Again SHell) 中最近的一个安全漏洞让所有人都开始谈论“shellshocked”。


    把 Bash 想到头条新闻上有些奇怪，但这正是我们生活的世界。当 Bash 不是登上《*纽约时报*》头条时，它只是一个谦逊（但几乎无处不在）的 shell，最常体验为运行终端仿真程序（通过点击
    Terminal 应用程序图标）时生成的熟悉的 Linux 或 Mac OS X 命令行界面。但 Bash 也常常是 /bin/sh 背后的 shell（这通常是指向
    bash 可执行文件的符号链接），因此对请求 Web 服务器运行（例如）CGI 脚本的远程用户可用。


    Bash 中的具体安全漏洞相当直接。多年前，一个错误的函数声明解析机制被意外引入 Bash，导致它未能解析通过进程环境传递进来的函数声明。像任何其他应用程序一样，运行中的
    Bash 实例具有 Unix 进程环境，可以使用 ''env'' 命令查看或修改。


    环境是一个位于进程整体地址空间内的任意大小的线性内存数组。它定义在内核的 ''mm'' 结构体中，该结构体是进程的一部分（在内核中称为 ''task''），并通过内核代码使用诸如
    current->mm->env_start 之类的宏访问（这将返回指向当前运行程序的环境的指针）。内核参与最初设置环境，作为 binitf/elf 代码的一部分，该代码设置可执行和链接格式
    (ELF) 可执行文件，如 Bash。


    进程的环境（在 env_start 和 env_end 之间）通过一个全局变量（extern char **environ）对用户空间可见，


    以及通过文件 /proc/self/environ，如果你有合适的权限（例如 root）来读取另一个进程的环境，就可以用另一个进程 ID 替换 ''self''。''env''
    实用工具（在大多数发行版中是 ''coreutils'' Linux 包的一部分）只是从全局 Unix environ 变量中读取字符串数组并显示它们。这些字符串具有声明形式，如
    "HOME=/home/jcm" 中可见的那样，被称为“环境变量”。各种工具，如 Bash shell，也会在启动时读取这些条目，并根据这些变量设置各种内部状态。环境变量可以包含函数声明（如
    "\_x=() { :}”，它定义了一个名为 "\_x" 且不执行任何操作的函数），并且这些可以通过使用 "export -f \_x" 命令导出到后续命令。通常，此命令只会使环境获得一个
    "\_x=() { :}" 条目，但除了使用 "export"，还有其他设置进程环境的方法，例如直接使用 ''env'' 命令。这引出了现在著名的漏洞测试代码：


    env \_x=() { :}; echo "vulnerable" bash -c :


    ```

    env \_x=() { :}; echo "vulnerable" bash -c :

    ```


    第二个 Bash 进程被传入了名为 "\_x" 的函数，但在解析 "\_x" 函数环境变量的过程中错误地执行了附加在末尾的 ''echo ''vulnerable''''
    命令。实际上，如果你去掉该行的末尾的 ":" 并允许第二个 shell 保持运行，你会注意到 ''env'' 命令没有显示任何异常（因为它也没有正确解析内容）。然而，运行
    "cat /proc/$$/environ" 以显示内核直接报告的环境将显示 "echo ''vulnerable''" 的附录。较新的固定版本的 Bash
    改进了解析，并且为导出的函数添加了新的 "BASH_FUNC_" 前缀。但内核


    Linux 几个月前刚满 23 岁，正好赶上 3.17 内核开发周期的尾声。事实上，第 5 个候选版本几乎在 Linux 生日时发布，但 Linus 决定不这样做，因为他不是一个“过于
    sentimental 的人，所以很明确”。确实，在某些方面，这是一个更安静的周期，Linus 曾考虑让 RC6 成为最终的候选版本。最终他确实发布了“是的，又一个
    rc”（RC7），因为“方便”（针对他的旅行日程）并不是发布标准的一部分。我们将在下一期中提供 Linux 3.17 的完整摘要。


