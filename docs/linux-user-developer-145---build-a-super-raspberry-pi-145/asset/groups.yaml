    # # Webconverger 26

    ### Can this distro safely transform your old computers for public use?


    **New features:** Firefox 32 • Proxy authentication • Security updates • Cron
    scheduler and printing fixed


    ![](img/c7d3278283754436651c50a2e9c72912_82_0.png)


    ![](img/c7d3278283754436651c50a2e9c72912_82_1.png)


    You can edit the configuration from the web browser


    Here’s our LUD campus terminal running in debug mode


    > Ideal for situations such as a computer to provide free internet access in a
    café


    confirm it) in order to create your configuration profile. From there, you add
    the machine identities of each computer you’re running Webconverger on, nicknaming
    them as desired, and you can then manage multiple kiosks from this one interface.


    Changing the configuration is straightforward as well, though there’s a little
    reading to do on the developer’s website about the API (http://webconverger.org/API).
    The documentation is pretty good but not well organised, so expect to go rifling
    through lots of different pages to round up all the various commands you’ll want
    to use. You simply add API commands onto new lines in your configuration, hit
    submit and then enter your password to commit the changes, which are enacted on
    the kiosks on reboot.


    The API commands themselves are very useful and wholly geared towards improving
    the kiosk experience. You can set multiple homepage tabs, filter websites through
    whitelists and blacklists, set up print servers and add a print button to the
    browser bar. You can use cron to schedule Firefox resets and even system shutdowns,
    and you can also change the browser interface to remove the URL and search bars,
    or display at fullscreen either by removing the chrome structure or turning it
    into digital signage via Neon. Neon used to be a separate digital signage service
    but is now based on the Webconverger platform, and you can access Neon Live separately
    via the boot menu as well as use it in this way through the API command.


    A slight concern is the fact that, if you have a URL bar, you can access the configuration
    web page from the kiosk browser – as well as any other computer in the world,
    for that matter – and


    then view all of the configuration details; all you need to know is the email
    address used to create the profile. You can even try to change the configuration,
    though you won’t get far without the password. However, because of the way that
    Webconverger is designed, with all of the browsing data being reset after each
    session or on a more regular, scheduled basis, this isn’t a real security concern.
    Still, it’s not exactly ideal.


    All told, though, this does look like the complete package and it’s far better
    than a lot of the competition, both paid-for and free. You can’t really fault
    Webconverger for usability and speed, and all the features work just as you’d
    hope they would. We managed to get a cron schedule up to power our ‘University
    of Linux’ info terminal, sort out a basic proxy authentication, customise the
    desktop wallpaper to our own design and create a locked-in, browser-based experience
    around a few select web resources before digging further into the documentation.
    There are many advanced options available too, like the hidden terminal (if you’re
    in debug mode), the ability to create screensavers and to get homepage video plays
    starting automatically after a set period of inactivity. All of which left us
    with the impression that this is a genuinely useful tool to help you to create
    controlled public terminals to access the web. It’s not something everyone will
    need, but for those that do then this is definitely your answer.


    *Gavin Thomas*


    # ## Summary


    Offers the customisation you need to create safe web kiosks and digital signs,
    and the configuration interface means simple management. But you’re stuck with
    unconfigured setups unless you’re willing to spend a cool $200 (£123 approx).


    Download now

