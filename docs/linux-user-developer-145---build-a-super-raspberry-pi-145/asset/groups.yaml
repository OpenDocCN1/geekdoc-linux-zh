    # OpenSource


    06 News | 12 Opinion | 94 Letters


    # CANONICAL


    # Netflix service will finally get native Linux support


    No more hacks required for browser-based playback


    Subscription-based video streaming service Netflix has confirmed that it is working
    on bringing its browser-based playback system to Linux desktops, and is working
    with Canonical to introduce support into the Ubuntu Linux distribution.


    Netflix is an incredibly popular service originally launched in the US offering
    films on DVD via post. This was soon overtaken by a video streaming service, which
    was launched in the UK in 2012 and that now boasts more than 50 million subscribers
    in 40 countries.


    Sadly for Linux users, the digital rights management (DRM) wrapper that protects
    the Netflix content has been unavailable on Linux, with the exception of support
    introduced into Google’s Chrome OS in 2011 – until now. Netflix has confirmed
    that an update to the Netwrok Security Services library enables the Google Chrome
    Stable browser to play Netflix content officially on Ubuntu Linux for the first
    time in the company’s history.


    Previously, Linux users with Netflix subscriptions have had to install beta packages
    and then modify their browser’s User-Agent string to enable playback. Paul Adolph,
    an engineer at Netflix, was the first to suggest this would change: “Netflix will
    play with Chrome Stable in [Ubuntu] 14.02 [sic] if NSS version 3.16.2 or greater
    is installed,” he explained in a post to the Ubuntu-Devel-Discuss mailing list.


    Adolph went on to explain that if Canonical could roll out 3.16.12 or newer as
    standard to Ubuntu 14.04, as a replacement for the 3.15.x tree locked into the
    long-term support (LTS) release earlier this year, “Netflix would be able to make
    a change so users would no longer have to hack their User-Agent to play.” Canonical
    confirmed to the list that it would do precisely that, with engineer Marc Deslauriers
    stating that he was “planning on bumping NSS to 3.17 in the stable releases as
    a security update [anyway].” This has been carried out for Ubuntu 14.04 and 12.04
    now,


    putting native Netflix support a mere apt-get update away for Canonical’s many
    LTS users.


    > I can make a case here to lift the User-Agent filtering which will make Netflix
    HTML5 play in Chrome turnkey with no hacks required.


    Adolph responded, referring to server-side filtering that enables playback only
    on a preset whitelist of User-Agent strings which does not yet include Chrome
    on Linux. At the time of writing, that change had yet to be made; users who want
    Netflix playback in Chrome on Ubuntu and who have received the updated NSS package
    are advised to modify their User-Agent string to match Chrome on Windows until
    the change is made.


    Thus far, Netflix has not publicly reached out to any other Linux distributions
    to offer native playback support, nor indicated if it intends to formally support
    browsers other than Chrome on the platform.


    ![](img/c7d3278283754436651c50a2e9c72912_5_0.png)


    Above Netflix has worked with Canonical to bring native playback to Ubuntu for
    the first time


    Right Using the latest Google Chrome browser, native HTML5 playback is supported
    on Ubuntu


