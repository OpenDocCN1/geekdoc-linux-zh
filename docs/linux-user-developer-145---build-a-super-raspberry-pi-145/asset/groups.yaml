    \ 包，以及你所运行内核的头文件（headers）或源码（source），当然也要安装 VirtualBox 本身。\n\n## 03 获取最新版本\n\n\
    现在安装 Vagrant，直接前往 [www.vagrantup.com/downloads](www.vagrantup.com/downloads) –\
    \ 提供 32 位和 64 位的 RPM 和 Deb 包，下载时浏览器通常会提示你打开软件包管理器。\n\n无需调用软件包管理器——例如使用以下方式手动安装：\n\
    \n```\ndpkg -i vagrant_1.6.5_i686.deb\n```\n……用于在 Ubuntu 或其他基于 Debian 的发行版上安装\
