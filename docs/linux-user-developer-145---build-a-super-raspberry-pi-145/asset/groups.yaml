    \ only the default free software repository for testing.\n\n![](img/c7d3278283754436651c50a2e9c72912_6_2.png)\n\
    \n## Mozilla Labs shut down\n\n> “I don’t believe Labs was effective,” says Ian\
    \ Bicking\n\nMozilla Labs, a think-tank and software development group in the\
    \ Mozilla Corporation, has been closed down with many of its alumni shifting to\
    \ the Mozilla Foundation instead.\n\nUsed for research and development, Mozilla\
    \ Labs was home to everything from the JavaScript-powered PDF.js in-browser PDF\
    \ viewer to the Tornado web cross-platform media player. Some projects from the\
    \ site, including the Open Badges Initiative and the aforementioned PDF.js, proved\
    \ extremely successful; others less so.\n\nThis month, former Mozilla Labs staff\
    \ member Ian Bicking posted to his blog confirming that the division had been\
    \ formally closed, something that up to that point Mozilla had not announced itself.\n\
    \n“It’s a little hard to tell – I guess we didn’t actually shutter anything, and\
    \ though it was announced internally it is entirely unclear externally,” he explained.\
    \ “But Mozilla Labs is definitely shut down. I understand the reason for closing\
    \ Mozilla Labs. I don’t believe Labs was effective [and] I was not effective in\
    \ it,” Bicking adds, before clarifying that Mozilla Research, which focused more\
    \ on foundational web technologies than on software development like its sister\
    \ group did, is still very much active.\n\nMozilla has since confirmed the quiet\
    \ closure of the division, stating that it was officially closed down in February\
    \ this year with no public notification. Mozilla’s Andreas Gal told website i-programmer.info\
    \ about the move: “We integrated Mozilla Labs staff more closely into product\
    \ teams instead of maintaining Mozilla Labs as a separate team... This allows\
    \ each team to better sponsor research and innovation for their products.”\n\n\
    At the time of writing, Mozilla had yet to modify the Labs website (https://mozillalabs.com/en-US)\
    \ to indicate its closed status.\n\n![](img/c7d3278283754436651c50a2e9c72912_7_0.png)\n\
    \n## NHS adopts open platform database\n\n> Spine2 system goes live with Ubuntu\
    \ core, replaces decade-old predecessor\n\nThe National Health Service (NHS) has\
    \ sent its Spine2 patient record database and messaging system live, replacing\
    \ its proprietary Oracle predecessor with a fully open-source software stack.\n\
    \nFirst announced in 2013, Spine2 uses a bevy of popular open-source packages\
    \ to drive the giant database: Ubuntu with HA Proxy, nginx, Puppet, Mustache,\
    \ Flask, Python, Redis, RabbitMQ and Tornado, along with Riak to ensure data persistence.\
    \ The system scales across commodity servers using Intel Xeon processors in multiple\
    \ data centres.\n\n“We have harnessed the latest technology to rebuild the most\
    \ important NHS electronic system, built over ten years ago and today relied upon\
    \ by thousands of health staff and patients every single day,” boasted Health\
    \ and Social Care Information Centre (HSIOC) chief executive Andy Williams of\
    \ the project. “Of equal importance is [that] we have ensured value for money:\
    \ by bringing the system in-house, the day-to-day running costs are set to fall\
    \ substantially.”\n\n“Rebuilding such a massive and integral system was a huge\
    \ challenge, not least in ensuring more than 20,000 organisations and the many\
    \ thousands of people who rely on the system were able to continue accessing the\
    \ Spine during the transition with minimal disruption. I am delighted that the\
    \ HSIOC, supported by the commitment of several other organisations, has achieved\
    \ this.”\n\nThe Spine2 project was supported by commercial partners BUSS and Basho,\
    \ and represents one of the largest UK government deployments of an open software\
    \ stack to date. Additional new functionality is planned for the system over the\
    \ next year and this includes an information sharing application focused on child\
    \ protection.\n\n![](img/c7d3278283754436651c50a2e9c72912_7_1.png)\n\n8 www.linuxuser.co.uk\n"
  mdcn: "\n\n# 开源\n\n06 新闻 | 12 观点 | 94 来信\n\n## Netflix 服务终于将原生支持 Linux\n\n基于浏览器的播放不再需要变通方案\n\
    \n基于订阅的视频流媒体服务 Netflix 已确认，正在致力于将其基于浏览器的播放系统引入 Linux 桌面环境，并且正在与 Canonical 合作，将支持引入\
    \ Ubuntu Linux 发行版。\n\nNetflix 是一项极其流行的服务，最初在美国推出，提供通过邮寄方式租借 DVD 电影。随后，该服务被视频流媒体业务所超越，该业务于\
    \ 2012 年在英国上线，目前声称在 40 个国家拥有超过 5000 万订阅用户。\n\n遗憾的是，对于 Linux 用户来说，保护 Netflix 内容使用的数字版权管理（DRM）包装器在\
    \ Linux 上一直不可用，2011 年引入到谷歌的 Chrome OS 中的支持除外——直到现在。Netflix 已确认，对网络安全服务（Network\
    \ Security Services, NSS）库的更新使得谷歌 Chrome Stable 浏览器能够首次在该公司历史上正式在 Ubuntu Linux\
    \ 上播放 Netflix 内容。\n\n此前，拥有 Netflix 订阅的 Linux 用户必须安装测试包，然后修改其浏览器的 User-Agent 字符串以启用播放。Netflix\
    \ 的工程师 Paul Adolph 是第一个建议这将会改变的人：“如果安装了 NSS 版本 3.16.2 或更高版本，Netflix 将在 [Ubuntu]\
    \ 14.02 [原文如此] 中的 Chrome Stable 上播放，”他在 Ubuntu-Devel-Discuss 邮件列表的一篇文章中解释道。\n\n\
    Adolph 接着解释说，如果 Canonical 能够将 3.16.12 或更高版本作为标准推广到 Ubuntu 14.04，以替换今年早些时候锁定在长期支持（LTS）发布中的\
    \ 3.15.x 系列，“Netflix 将能够做出改变，用户将不再需要修改 User-Agent 来播放。” Canonical 向列表确认，他们将确实这样做，工程师\
    \ Marc Deslauriers 表示他“计划将 NSS 升级到 3.17 作为稳定版本的更新（无论如何）。作为安全更新”。这现在已经在 Ubuntu\
    \ 14.04 和 12.04 上完成，这使得 Canonical 的众多 LTS 用户只需执行 `apt-get update` 即可获得原生 Netflix\
    \ 支持。\n\n> 我可以在此提出论点，解除 User-Agent 过滤，这将使 Netflix 的 HTML5 播放无需任何变通方案即可在 Chrome\
    \ 中开箱即用。\n\nAdolph 回应道，指的是服务器端过滤，它允许仅在预设的 User-Agent 字符串白名单上播放，目前尚未包括 Linux 上的\
    \ Chrome。截稿时，该变更尚未完成；建议在 Ubuntu 上使用 Chrome 观看 Netflix 且已接收更新 NSS 包的用户修改其 User-Agent\
    \ 字符串以匹配 Windows 上的 Chrome，直到变更完成。\n\n迄今为止，Netflix 尚未公开联系任何其他 Linux 发行版以提供原生播放支持，也没有表明其是否打算在该平台上正式支持\
    \ Chrome 以外的浏览器。\n\n![](img/c7d3278283754436651c50a2e9c72912_5_0.png)\n\n上图：Netflix\
    \ 与 Canonical 合作，首次为 Ubuntu 带来原生播放功能。\n\n![](img/c7d3278283754436651c50a2e9c72912_5_1.png)\n\
    \n右图：使用最新的 Google Chrome 浏览器，在 Ubuntu 上支持原生 HTML5 播放。\n\n## Linux 日历\n\n- **11月3日\
    \ – 11月5日**\n  - **Code Mesh 2014**\n    - ILEC 会议中心，英国伦敦\n    - codemesh.io\n\
    \n以一天教程开始，随后是两天的会议，Code Mesh 提供了对非主流技术和编程语言的考察，包括 Datomic、Neo4j、F# 和 Haskell。\n\
    \n- **11月17日 – 11月21日**\n  - **SUSECon 2014**\n    - 海雅特雷格尼大香柏酒店，美国\n    - susecon.com\n\
    \n专为 SUSE 用户和开发者设计，确认的演讲者包括 SUSE 总裁 Nils Brauckmänner 和副总裁 Michael Miller，以及 Forrester\
    \ Research 分析师 James Staten。\n\n- **ApacheCon 欧洲**\n  - 科林西亚酒店，匈牙利布达佩斯\n  - events.linuxfoundation.org\n\
    \n专为希望以“Apache 方式”处理开源的开发者用户设计，ApacheCon 欧洲的赞助商包括 Citrix、Apache 软件基金会和 WanDisco。\n\
    \n- **11月19日 – 11月21日**\n  - **CloudStack 协作会议欧洲站**\n    - 科林西亚酒店，匈牙利布达佩斯\n  \
    \  - events.linuxfoundation.org\n\n与 ApacheCon 欧洲同时举行，C3CEU 专注于 OpenStack 平台，用于虚拟机即服务（aaS）的开发和管理。\n\
    \n### 架构\n\n## Red Hat 推动 64 位 ARMv8 支持\n\n着眼于低功耗数据中心市场\n\nRed Hat 已确认，它正大力支持来自剑桥\
    \ ARM 公司的 64 位 ARMv8 指令集架构（ISA），承诺为其用户提供“跨所有受支持 ISA 的无缝体验”。\n\n尽管推迟了，但 ARMv8 ISA\
    \ 凭借其每瓦高性能特性正在业界引起关注。虽然无法提供与 AMD 和 Intel 的 64 位 x86 芯片相同的原始峰值性能，但 ARMv8 处理器功耗低得多，使得数据中心具有更高的密度——支持者声称这非常适合云计算任务。\n\
    \nRed Hat 已确认推出了其所描述的 ARM 合作伙伴早期访问计划，以加速 ARMv8 的采用，ARMv8 与 x86 和 AMD64 ISA 不兼容。“在\
    \ 64 位 ARM 生态系统中，Red Hat 致力于创建一个单一操作平台，依靠通用标准来促进新应用程序的开发，”该公司在发布声明中声称。\n\n“目标是保持预期的企业级属性，如可靠性、安全性和性能，适用于如今大多作为开源项目可用的应用程序。”\n\
    \n虽然 Nvidia 和三星都已收回发布以服务器为中心的 ARMv8 处理器的计划，但包括 AMD 和 AppliedMicro 在内的公司现在已有产品上市。\n\
    \n![](img/c7d3278283754436651c50a2e9c72912_6_1.png)\n\n### 自由软件\n\n## FSF 与 Debian\
    \ 合作建立自由硬件数据库\n\n自由软件基金会（Free Software Foundation）和 Debian 项目已携手合作，扩展并增强 h-node，这是一个可以在\
    \ Linux 下使用且无需任何专有软件或固件的硬件数据库。\n\n“通过与 h-node 合作，Debian 首次有机会与其他自由软件社区共同努力，建立一个数据库，该数据库中的硬件在不依赖\
    \ Debian 主存档之外的任何内容的情况下即可工作，”Debian 项目负责人 Lucas Nussbaum 解释道，此举将看到 FSF 提供基础设施和支持。\n\
    \n此前，Debian 用户因存在非自由软件库而不被允许向该数据库贡献。\n\n该合作将看到 h-node 接受 Debian 用户的贡献，前提是他们仅使用默认的自由软件库进行测试。\n\
    \n![](img/c7d3278283754436651c50a2e9c72912_6_2.png)\n\n## Mozilla Labs 关闭\n\n\
    > “我不认为 Labs 是有效的，” Ian Bicking 说\n\nMozilla Labs，Mozilla 公司的一个智囊团和软件开发小组，已经关闭，其许多前成员转而加入了\
    \ Mozilla 基金会。\n\n被用于研究和开发，Mozilla Labs 曾经是各种项目的家园，从基于 JavaScript 的浏览器内 PDF 查看器\
    \ PDF.js 到 Tornado Web 跨平台媒体播放器。该网站的一些项目，包括开放徽章计划（Open Badges Initiative）和上述 PDF.js，取得了巨大的成功；其他项目则不然。\n\
    \n本月，前 Mozilla Labs 员工 Ian Bicking 在其博客上发表文章，确认该部门已被正式关闭，在此之前 Mozilla 本身并未宣布此事。\n\
    \n“这有点难以判断——我想我们实际上并没有关闭任何东西，虽然内部有公告，但外界完全不清楚，”他解释道。“但 Mozilla Labs 确实已经关闭了。我理解关闭\
    \ Mozilla Labs 的原因。我不认为 Labs 是有效的 [并且] 我在其中并不有效，”Bicking 补充道，同时澄清 Mozilla Research\
    \ 仍然非常活跃，它更侧重于基础网络技术，而不是像其姊妹组那样侧重于软件开发。\n\nMozilla 随后确认了该部门的静悄悄关闭，称其于今年二月正式关闭，未发布公开通知。Mozilla\
    \ 的 Andreas Gal 向网站 i-programmer.info 谈及此变动：“我们将 Mozilla Labs 的人员更紧密地整合到产品团队中，而不是将\
    \ Mozilla Labs 维持为一个独立团队…… 这使得每个团队能够更好地为其产品资助研究和创新。”\n\n截稿时，Mozilla 尚未修改 Labs\
    \ 网站 (https://mozillalabs.com/en-US) 以表明其已关闭的状态。\n\n![](img/c7d3278283754436651c50a2e9c72912_7_0.png)\n\
    \n## NHS 采用开放平台数据库\n\n> Spine2 系统基于 Ubuntu core 上线，取代了十年前的前身系统\n\n英国国家医疗服务体系（NHS）已使其\
    \ Spine2 患者记录数据库和消息系统上线，用完全开源的软件栈取代了其专有的 Oracle 前身。\n\n早在 2013 年首次宣布，Spine2 使用一系列流行的开源包来驱动这个巨大的数据库：Ubuntu\
    \ 搭配 HA Proxy、nginx、Puppet、Mustache、Flask、Python、Redis、RabbitMQ 和 Tornado，以及 Riak\
    \ 以确保数据持久性。该系统使用英特尔 Xeon 处理器在多个数据中心的商用服务器上进行扩展。\n\n“我们利用了最新技术重建了 NHS 最重要的电子系统，该系统建于十年前，如今每天都有数千名医务人员和患者依赖它，”该项目的健康与社会护理信息中心（HSIOC）首席执行官\
    \ Andy Williams 自豪地表示。“同等重要的是 [我们] 确保了物有所值：通过内部化该系统，日常运行成本预计将大幅下降。”\n\n“重建如此庞大且不可或缺的系统是一个巨大的挑战，尤其是在确保超过\
    \ 20,000 个组织和数千名依赖该系统的人员在过渡期间能够继续以最少干扰访问 Spine。我很高兴 HSIOC，在多个其他组织的承诺支持下，实现了这一目标。”\n\
    \nSpine2 项目得到了商业伙伴 BUSS 和 Basho 的支持，代表了迄今为止英国政府部署开源软件栈的规模之一。计划在未来一年内为该系统增加新的附加功能，其中包括一个专注于儿童保护的信息共享应用程序。\n\
    \n![](img/c7d3278283754436651c50a2e9c72912_7_1.png)\n\n8 www.linuxuser.co.uk\n\
    \n"
