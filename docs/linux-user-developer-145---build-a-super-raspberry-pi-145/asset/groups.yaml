  - '[PAGE 46]


    # Learn to code BASIC with FUZE


    Discover the language that started it all


    TUTORIAL


    # 01 Hook up FUZE BASIC


    ![](img/c7d3278283754436651c50a2e9c72912_46_0.png)


    01 Hook up FUZE BASIC

    Some of the FUZE models already have a Raspberry Pi built in, so all you need
    to do is hook it up to a monitor and power source to get it going. Make sure the
    SD card is placed into the slot before you plug it in using the supplied power
    adaptor.


    02 BASIC interpreter

    The FUZE will boot into a desktop of a modified Raspbian. Here you can do your
    normal Raspberry Pi-related activities, but what we’re interested in is the FUZE
    BASIC option on the desktop that takes us to the BASIC interpreter.


    03 Say hello

    Our first foray into a programming language needs to be done right with a proper
    “Hello World” statement. It’s very simple to do in BASIC and just requires you
    to write:


    >PRINT “Hello World”


    04 Look around you

    While this version of BASIC has been updated since the BBC Micro days, you can
    still perform some of its more simple tasks and the infamous GOTO 10 command.
    You can do this by executing commands like this:


    >10 PRINT “Hello World”

    >20 GOTO 10


    > FUZE will boot into a desktop of a modified Raspbian. Here you can do all your
    normal Pi activities


    05 The modern way

    Press Esc to end the loop. BASIC has seen some improvements in this version, so
    we can create this endless loop of Hello World by using a better loop statement
    in the code editor. To access the editor, press F2.


    06 Modern loop code

    The code for this is quite simple: we create a CYCLE, place the command within
    it and then tell the code to return to the beginning of the cycle with REPEAT
    at the end. In our case:


    CYCLE

    PRINT “Hello World”

    REPEAT


    07 Save and run the code

    Once you’ve typed it in, you can press F3 to bring up the option to save the code.
    For now, just call it helloworld and press Return. Once that’s done the code will
    run, looping Hello World over and over. Press Esc twice to end the loop.


    08 Make variables

    Creating a variable in BASIC is easy and is like most other languages:'
  - "[PAGE 47]\n\n![](img/c7d3278283754436651c50a2e9c72912_47_0.png)\n\n```\nA = 5\n\
    ```\n\nUse PRINT 'A' to confirm it's worked. You can modify the value by adding\
    \ a number or other predefined variables like so:\n\n```\nA = A + 5\nA = A + B\n\
    ```\n\n# **09** Something more complicated.\n\nAutomatically increasing the value\
    \ of a variable is easy. Let's create a fixed loop that prints out A as it increases\
    \ from 1 to 5:\n\n```\nCLS\nA = 0\nFOR p = 1 to 5 CYCLE\n  A = A + 1\n  PRINT\
    \ A\nREPEAT\nEND\n```\n\n# **10** Wire up a project\n\nThe I/O board offers a\
    \ lot of extra functionality that's perfect for learning physical programming.\
    \ While you can connect directly to the Pi's GPIO ports via the header, you can\
    \ also use the custom ports. The tray at the top of the FUZE is perfect to slot\
    \ the breadboard into, so do that now.\n\n# **11** Wire up a light\n\nChoose one\
    \ of the LEDs from the pack of electronics – any colour is fine – and then insert\
    \ the short end into one of the two pins along the top and insert the long end\
    \ into the middle section. Grab a 100Ω resistor (brown black brown gold) and insert\
    \ one end into one of the pins that are on the same vertical row as the long end\
    \ of the LED.\n\n![](img/c7d3278283754436651c50a2e9c72912_47_1.png)\n\n# **12**\
    \ Connect the light\n\nPlace the other end of the resistor on a pin in a different\
    \ vertical column and then use a jumper wire to connect GPIO 0 to this end of\
    \ the resistor on the vertical. Finally, attach a wire to GND on supply and put\
    \ it on the same row as the short end of the LED.\n\n# **13** Easy operation\n\
    \nTo activate the light, exit the editor using Esc and type the following line\
    \ to let it know to set GPIO 0 as an output:\n\n```\n>PinMode (0,1)\n```\n\nTo\
    \ activate it and then deactivate it, use:\n\n```\n>DigitalWrite (0,1)\n>DigitalWrite\
    \ (0,0)\n```\n\n# **14** Light coding\n\nNow that we've got our light working,\
    \ let's create a little code that will turn it on and off repeatedly:\n\n```\n\
    CLS\nPinMode (0,1)\nCYCLE\nDigitalWrite (0,1)\nWait (1)\nDigitalWrite (0,0)\n\
    Wait (1)\nREPEAT\nEND\n```"
  - "[PAGE 48]\n\n# Learn to code BASIC with FUZE\n\nDiscover the language that started\
    \ it all\n\nTUTORIAL\n\n![](img/c7d3278283754436651c50a2e9c72912_48_0.png)\n\n\
    Below our traffic crossing setup will activate the LEDs in sequence\n\n15  Bigger\
    \ project\nLet’s ramp up the lighting setup on the breadboard and make it into\
    \ a traffic crossing setup. Add two extra lights in the same way we added the\
    \ original LED and attach them to GPIO pins 2 and 3. Wire up a button by attaching\
    \ one end to pin 7 and the other end to a new 3.3V rail taken from the second\
    \ set of power pins. The button will make the lights go 'red' in sequence, then\
    \ after a pause go back to 'green' – see **Fig. 01** for the full code.\n\n16\
    \  CLS\nThe CLS command clears the current display. This is helpful to make sure\
    \ any errors or printouts from your code will show up without possibly blending\
    \ in with outputs from previous programs or runs.\n\n17  Use PinMode\nThe numbers\
    \ on the PinMode variable handles the GPIO port (X) as well as whether it’s an\
    \ output (1) or input (0). It is therefore constructed like so for GPIO X as an\
    \ output:\n\n```\nPinMode (X,1)\n```\n\nDigitalWrite is constructed similarly\
    \ for output pins, with 1 being on and 0 being off.\n\n18  IFTHE\nUnlike other\
    \ coding languages, when you create an IF statement you need to make sure THEN\
    \ is appended to let BASIC know that the following code is for a True situation.\n\
    \n19  digitalRead\nAs pin 7 in this code is set as an input, we want to read when\
    \ it’s activated (ie when the button is pressed). Our button completes the circuit\
    \ when pressed so the read needs to be 1.\n\n20  ENDIF\nLet the code know when\
    \ the IF statement ends by adding ENDIF to the end of it. This can make it slightly\
    \ easier and clearer for figuring out where an IF begins and ends compared to\
    \ other languages.\n\n```\nFig 01\nCLS\nPinMode (0,1)\nPinMode (1,1)\nPinMode\
    \ (2,1)\nPinMode (7,0)\nCYCLE\n  DigitalWrite (2,1)\n  IF digitalRead (7) = 1\
    \ THEN\n    Wait (1)\n    DigitalWrite (2,0)\n    DigitalWrite (1,1)\n    Wait\
    \ (1)\n    DigitalWrite (1,0)\n    DigitalWrite (0,1)\n    Wait (5)\n    DigitalWrite\
    \ (0,0)\n    DigitalWrite (1,0)\n    DigitalWrite (2,1)\n  ENDIF\nREPEAT\nEND\n\
    ```\n\n49\n\nwww.linuxuser.co.uk"
