    \n一个小小的担忧是，如果你有 URL 栏，你可以从网络亭浏览器访问配置网页 – 事实上也可以从世界上的任何其他电脑 – 并\n\n然后查看所有的配置细节；你只需要知道用于创建配置文件的电子邮件地址。你甚至可以尝试更改配置，但没有密码你走不了太远。然而，由于\
