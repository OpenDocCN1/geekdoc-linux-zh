    \ PC 上多个版本的 Ruby。\n\n![](img/c7d3278283754436651c50a2e9c72912_26_0.png)\n\n##\
    \ 02 VirtualBox\n\n如果版本问题的原因是你正在维护一个需要旧版 Ruby 的软件，那么创建一个虚拟机来运行该环境及你的应用程序，就是跟随本教程的一个绝佳理由。既然已经打开了软件包管理器，不妨顺便安装\
