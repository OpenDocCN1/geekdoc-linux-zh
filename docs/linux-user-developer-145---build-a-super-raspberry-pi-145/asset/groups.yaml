    # 教程

    如何使用你的超级树莓派


    ## 如何使用你的超级树莓派


    你的超级计算机已准备好处理代码了。你要让它做什么呢？


    ![](img/c7d3278283754436651c50a2e9c72912_55_0.png)

    ![](img/c7d3278283754436651c50a2e9c7912_55_1.png)


    ## 使用 BOINC 捐赠算力


    BOINC 是一个计算机网络系统，允许你将空闲的 CPU 算力捐赠出去以处理大数据，例如蛋白质折叠或分析来自宇宙的信号以寻找外星生命。有一个专门的 BOINC
    应用插件，它可以将工作负载分散到 MPI 网络上，并将它们全部视为额外的 CPU 线程，而不是额外的计算单元。应用详情可在此处找到：bit.ly/1B8TS0w。单独的树莓派无法为算力池贡献太多，但将多台树莓派连接在一起可以显著提升性能，并创建一个强大的小型节点来帮助完成一些项目。有几种方法可以将处理算力捐赠给涉及科学、医学和数学的项目。你可以调整
    BOINC，使其不仅使用树莓派空闲时的算力。


    ## 建模与仿真


    Python 和其他编程语言可用于创建复杂系统的模型。这些模型可以包括行星轨道及与其相互作用的天体、巨大的数学方程以及关于潮汐、天气等的大量相关图表。这些中的许多涉及大量计算，即使在普通
    PC 上也会很慢。提供更多核心，你可以获得更快且有时更准确的结果。Mathematica 还包含一定程度的集群支持，通过 Open MPI 实现，这正是我们用来连接树莓派网络的软件。Wolfram
    在其网站上提供了关于其工作原理及如何使用的信息（bit.ly/1oEYYb8），它能真正帮助处理你在 Mathematica 中可访问和使用的海量数据。


    ## 快速编译


    现在你拥有了更多的处理能力，你可以尝试在集群上而不是仅在单台树莓派上编译树莓派程序。不过，这些程序通常只能在另一台树莓派上运行，而且与在真正的 PC 或笔记本电脑上编译相比，在单台树莓派上编译可能极其耗时。然而，还有一组仅支持
    MPI 的应用程序，可以使用你的集群进行构建，从而在不依赖 Python 代码的情况下增加集群的功能。这些程序的源代码中必须包含特定的 MPI 命令，以确保它们正确运行，这与我们在
    Python 示例中的做法略有不同。请查阅你的编程语言的最佳实践，以及你可能需要的额外模块或插件。你可以用类似的方法来测试代码，就像我们测试 Python
    代码那样。


    ```

    ncg@superp1-berta:~/android/rom/kernel-4.0.9-ga34d56

    $ make -j3

    make[1]: Entering directory `/home/ncg/...`

    Warning [reg_format]: "reg" property in /soc/lq92992600/hhc_mcu01a has invalid
    length (4 bytes) (Addr 0x00000104, 1st entry: 000010)

    ...

    CC arch/.../linux_kernel.c

    CC arch/.../linux_kernel.c

    CC arch/.../linux_kernel.c

    ```


    ## 资源


    了解更多关于 MPI、Python 以及其他利用你的超级树莓派的方法


    ### Open MPI


    open-mpi.org


    **Open MPI（右侧）** 是我们的 Python 模块用来在树莓派网络上发送和接收数据的 MPI 实现。它支持所有三个主要版本的 MPI，并且重要的是，它以开源形式提供给大家使用。如果你需要扩展它，超出
    Python 程序的范围，并对你正在计算的内容及方式采取更多控制权，可以在论坛上找到扩展库的完整文档（**www.mpi-forum.org**）。


    ![](img/c7d3278283754436651c50a2e9c7912_56_0.png)


    ### mpi4py 文档


    pythonhosted.org/mpi4py/usrman/index.html


    我们使用的 Python 模块拥有比我们所用的更多功能，所有这些功能都包含在网站上可查阅的文档中。你可以学习如何做远不止数字乘法（如我们在示例中所示）的事情，包括使用其他代码的包装器、数据矩阵以及其他几个功能。它非常灵活且仍在开发中，因此时不时地查看它及其变更日志以获取新功能或不同的函数是值得的。


    你可以学习如何做远不止数字乘法的事情


    ![](img/c7d3278283754436651c50a2e9c7912_56_1.png)

    ![](img/c7d3278283754436651c50a2e9c7912_56_2.png)


    ### 树莓派论坛


    raspberrypi.org/forums


    对于你的树莓派出现的任何与 MPI 无关的问题，你的第一求助处应该是树莓派论坛。用户在使用树莓派和 Linux 方面经验丰富，通常能够提供帮助。如果你能在帖子中提供详细的细节和日志文件，他们可能能更快地帮助你。


    ![](img/c7d3278283754436651c50a2e9c7912_57_0.png)


    **和弦** 你可以同时操纵三个摇杆来演奏和弦 - 你如何移动它们会影响和弦中音符的声音


    **摇杆** 向前/向后推以在三角波和反向锯齿波之间切换，或向左/向右推以影响振荡器


    ![](img/c7d3278283754436651c50a2e9c7912_57_1.png)


    **同构性** 无论你在什么调性中演奏，你可以演奏的所有和弦和音阶都具有相同的几何形状


    **六边形网格** Joytone 使用六边形布局来排列音符，就像 Rainboard 等电子乐器或 Music 等应用程序


    *上方（插图）* 了解相邻摇杆之间的音乐距离是学习演奏 Joytone 的关键


    *右侧* Sharples 和 Glanzman 在 DIS 高级设计博览会上展示的这款六音符演示单元背后，是长达数月的实验室会话


    ![](img/c7d3278283754436651c50a2e9c7912_57_2.png)


    ## 组件列表


    - 树莓派 Model B

    - Cypress PSoC4

    - Arduino Micro

    - 57 个 Xbox 360 摇杆

    - 57 个 NeoPixel 扩散 8mm 直插 LED（Adafruit）

    - 8 个 16 通道模拟多路复用器

    - 5 个 16mm 带灯按钮（Adafruit）

    - 200mm SoftPot 膜电位计


    # 我的树莓派项目


    ![](img/c7d3278283754436651c50a2e9c7912_58_0.png)


    ## Joytone


    David Sharples 和 David Glanzman 重新发明了键盘……通过将按键替换为六边形网格的摇杆


    - **是什么激发了 Joytone 的灵感？**

    Sharples：Joytone 是一种表现力丰富的同构音乐乐器。这个项目源于我学习演奏乐器时的挫折感。我试着自学钢琴，我一直想知道为什么有白键和黑键，你知道，这让事情变得困难得多。我学了一点乐理，后来意识到大调音阶只是一种定义明确的音乐结构；大调音阶中音符之间的间隔实际上对于任何大调音阶都是一样的。但是，因为钢琴上有白键和黑键，你只需按完所有白键就能演奏
    C 大调音阶。如果你想演奏 D# 大调音阶，你必须加入一堆黑键。这很难记忆，你不得不用巨大的肌肉记忆来构建。所以这个项目的重大目标之一是构建一种没有基于按键偏见的音乐乐器
    – 也就是它是同构的，这就是它的含义。


    - **而且你们使用的是模拟摇杆！**

    Glanzman：它们是 Xbox 摇杆……

    Sharples：这是项目的第二大目标。当我对此进行研究时，我注意到有些乐器具有这些六边形同构键盘 – 一个六边形网格 – 但问题在于它们只是按钮，它们没有像真正的音乐乐器那样丰富和深邃。当你弹奏吉他时，有数百万种方法可以影响声音
    – 你压弦的力度、你拨弦的力度、你在指板哪个位置按弦、你是否推弦 – 你可以获得所有这些丰富的音质。所以我们希望让它具有表现力。我们使用这些摇杆，因为它们在这种非常熟悉的微小界面上提供了两个通道的模拟控制。一个轴将合成声音的波形从三角波（具有纯净、钟铃般的质量）变为反向锯齿波（具有嗡嗡声、明亮的声音，像小号）。每个音符由两个振荡器产生，如果你将摇杆向左推，这些振荡器完全同调，发出非常柔和的声音。如果你将它完全向右推，它们会偏移几个赫兹，从而产生宽阔、丰富的声音。然后，无论你向哪个方向旋转摇杆，其幅度决定音量。所以在那里你有五个半维度的控制，这为声音增添了一些深度。


    - **树莓派在其中扮演什么角色？**

    Sharples：这里有一种“双脑系统” – 我们有树莓派，然后我们有 Cypress PSoC 4。Cypress PSoC 4 负责所有数据读取的重活。

    Glanzman：它执行所有摇杆的测量。它内部有将模拟信号转换为数字信号的 ADC，然后基本上依次查看每个摇杆的每个轴，记录数据，然后等待树莓派请求每个摇杆的数据值。

    Sharples：有 57 个摇杆，每个都有两个模拟通道，所以总共有 114 个模拟通道。所以我们做了什么呢？我们使用了八个 16 通道多路复用器连接到 PSoC，然后
    PSoC 向它们发送信号说“给我通道 1”。然后它读取八个通道，接着说“给我通道 2”并读取八个通道 2。当它对所有 16 个通道这样做之后，它就拥有了当前数据的完整组。树莓派定期说“给我所有最新的数据”，于是
    PSoC 将数据转发给树莓派，然后树莓派用 Python 进行一些处理，然后向 PureData（我们的合成器程序）发送命令。


    - **Arduino 组件在做什么？**

    Sharples：每个摇杆的小六边形单元中还有一个 RGB LED，我们的初衷是使用这些灯来显示哪些音符在调内或调外。我们还想引导用户走一个音阶 – 甚至是一首歌曲，显示他们接下来应该演奏的音符
    – 但我们遇到了一些技术困难。理想的设置是你将这些灯串联成一条大线，然后将它们连接到一个 Arduino Micro 上，它实际上非常擅长控制这些来自 Adafruit
    的特定灯，然后它就可以沿线路拉取数据，你应该能够单独地为每个灯设置任何你想要的颜色。但我们在信号方面遇到了一些问题，只能让大约四个灯正常工作。


    - **学习演奏 Joytone 容易吗？**

    Sharples：入门门槛要低得多。有趣的是，当我们第一次让它工作时，David 正在玩它，戴着耳机，他有点停止说话，按了几个摇杆，就像“等等，等等……”，然后他就演奏了巴赫。所以学习它的关键只是学习一点乐理结构。有一种你可以保持手指姿势的形状，可以演奏一个三和弦：一旦你学会那个形状，那就它了
    – Joytone 的所有三和弦都是这样演奏的。

    Glanzman：当谈到学习 Joytone 时，你必须以不同于其他乐器的方式来对待音乐教学。当你学钢琴这样的东西时，你学到这是 D 大调，这是 F# 小调
    – 你基于音符，实际的类别学习不同的东西，对吧？但对于 Joytone，音高类别完全无关，因为我们以相关的术语听到一切，并以相对的术语演奏一切。所以要学习这个乐器，你甚至不暴露音高类别
    – 你只谈论相对距离。所以大三度或小三度，五度，四度 – 它是音符之间的距离，而不是实际的音符值。我认为，如果你用这些术语来表述音乐教学，用我们体验音乐的术语，而不是我们通常用来创造音乐的术语，它将成为
    Joytone 一个更自然的界面，因为它建立在这样的教学基础上，使其易于学习。


    ![](img/c7d3278283754436651c50a2e9c7912_58_1.png)


    - David Sharples 是一位交互设计师，毕业于宾夕法尼亚大学的数字媒体设计项目


    ![](img/c7d3278283754436651c50a2e9c7912_58_2.png)


    - David Glanzman 是宾夕法尼亚大学计算机工程的二年级学生。David 曾从事微处理器设计、音频电子、医疗器械及其他工作


    - **喜欢吗？**

    想了解同构乐器的更多信息？查看 David Sharples 的高级设计博客：dashesphere.blogspot


    **延伸阅读**

    这是 Joytone 的最终演示视频，包含了 David Glanzman 的高超巴赫演奏：bit.ly/1vKNtw


