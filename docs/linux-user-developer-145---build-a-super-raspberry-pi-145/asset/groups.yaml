    MOZILLA


    # Mozilla Labs shut down


    > “I don’t believe Labs was effective,” says Ian Bicking


    Mozilla Labs, a think-tank and software development group in the Mozilla Corporation,
    has been closed down with many of its alumni shifting to the Mozilla Foundation
    instead.


    Used for research and development, Mozilla Labs was home to everything from the
    JavaScript-powered PDF.js in-browser PDF viewer to the Tornado web cross-platform
    media player. Some projects from the site, including the Open Badges Initiative
    and the aforementioned PDF.js, proved extremely successful; others less so.


    This month, former Mozilla Labs staff member Ian Bicking posted to his blog confirming
    that the division had been formally closed, something that up to that point Mozilla
    had not announced itself.


    “It’s a little hard to tell – I guess we didn’t actually shutter anything, and
    though it was announced internally it is entirely unclear externally,” he explained.
    “But Mozilla Labs is


    definitely shut down. I understand the reason for closing Mozilla Labs. I don’t
    believe Labs was effective [and] I was not effective in it,” Bicking adds, before
    clarifying that Mozilla Research, which focused more on foundational web technologies
    than on software development like its sister group did, is still very much active.


    Mozilla has since confirmed the quiet closure of the division, stating that it
    was officially closed down in February this year with no public notification.
    Mozilla’s Andreas Gal told website i-programmer.info about the move: “We integrated
    Mozilla Labs staff more closely into product teams instead of maintaining Mozilla
    Labs as a separate team... This allows each team to better sponsor research and
    innovation for their products.”


    At the time of writing, Mozilla had yet to modify the Labs website (https://mozillalabs.com/en-US)
    to indicate its closed status.


    ![](img/c7d3278283754436651c50a2e9c72912_7_0.png)


    OPEN SOURCE


    # NHS adopts open platform database


    > Spine2 system goes live with Ubuntu core, replaces decade-old predecessor


    The National Health Service (NHS) has sent its Spine2 patient record database
    and messaging system live, replacing its proprietary Oracle predecessor with a
    fully open-source software stack.


    First announced in 2013, Spine2 uses a bevy of popular open-source packages to
    drive the giant database: Ubuntu with HA Proxy, nginx, Puppet, Mustache, Flask,
    Python, Redis, RabbitMQ and Tornado, along with Riak to ensure data persistence.
    The system scales across commodity servers using Intel Xeon processors in multiple
    data centres.


    “We have harnessed the latest technology to rebuild the most important NHS electronic
    system, built over ten years ago and today relied upon by thousands of health
    staff and patients every single day,” boasted Health and


    Social Care Information Centre (HSIOC) chief executive Andy Williams of the project.
    “Of equal importance is [that] we have ensured value for money: by bringing the
    system in-house, the day-to-day running costs are set to fall substantially.”


    “Rebuilding such a massive and integral system was a huge challenge, not least
    in ensuring more than 20,000 organisations and the many thousands of people who
    rely on the system were able to continue accessing the Spine during the transition
    with minimal disruption. I am delighted that the HSIOC, supported by the commitment
    of several other organisations, has achieved this.”


    The Spine2 project was supported by commercial partners BUSS and Basho, and represents
    one of the largest UK government deployments of an open software stack to date.
    Additional new functionality is planned for the system over the next year and
    this includes an information sharing application focused on child protection.


    ![](img/c7d3278283754436651c50a2e9c72912_7_1.png)


