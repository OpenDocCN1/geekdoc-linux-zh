    ## Raspbian


    树莓派最主流的发行版获得了树莓派基金会的大力推崇


    Raspbian 之所以成为推荐的树莓派发行版，这并无秘密可言：它显然是一个易用性极高的发行版，且可以相对快速地设置完成。得益于树莓派基金会的支持，它比其他任何树莓派发行版都获得了更多的社区开发和关注。


    ![](img/c7d3278283754436651c50a2e9c72912_76_0.png)


    该发行版基于 Debian，这在很大程度上归功于此。它易于维护，如果你需要使用终端，其命令简单快捷。此外，通过软件源还有大量的软件可供选择，其中包含了你主要电脑上使用的大多数应用程序；它们能否在树莓派有限的资源上可用则是另一回事。


    Raspbian 相比其他发行版的主要优势在于其包含的教育和教学材料。从教导编程基础的简单软件如 Scratch 和 Sonic Pi，到完整的 OCR 计算机课程，这里有很多其他任何地方都没有的应用。它还支持所有推荐的超频限制、树莓派相机以及未来的官方硬件扩展。


    使用 Raspbian 的好处之一是，许多教程、项目和第三方硬件都以其为标准运行或基于它构建。如果你的目标是学习编程，这会让学习变得更容易，甚至在你对自己的技能没有太大信心时，也更容易复制这些项目。


    ![](img/c7d3278283754436651c50a2e9c72912_76_1.png)


    除此之外，该发行版相当快速且轻量。浏览器最近更新为一款基于 Epiphany 定制的软件，明显比之前的 Midori 版本更快（参见第 84 页）。Raspbian
    的其他定制软件在提升性能方面表现出色，但它们是 Raspbian 独有的，例如用于播放视频和音频的命令行 OXMP 播放器。


    它本质上是默认的 Linux 发行版，这种地位赋予了 Raspbian 相比其他产品的诸多优势，同时保持了 Linux 应有的灵活性。


    > “通过软件源还有大量的软件可供选择”


    ### 评分


    - **更新**：Raspbian 能够很好地保持最新，包括最新的树莓派软件和固件更新 — 9

    - **易用性**：绝对是树莓派发行版中最易用的一个，尽管它确实只能使用相当简单的软件 — 8

    - **教育工具**：Raspbian 拥有整套课程体系，以及大量用于学习的软件 — 10

    - **灵活性**：它不像 Arch 那样轻量，但仍可用于多种应用 — 6

    - **总体**：这是一个优秀的发行版，围绕树莓派的所有优势进行设计 — 9


    ## 树莓派 2014 操作系统


    ### 简评：对比我们的结论


    | | Pidora 2014 | RISC OS Pi | Arch Linux ARM | Raspbian |

    | :--- | :--- | :--- | :--- | :--- |

    | **更新** | 目前完全最新，但仅最近发布 | 7 | 考虑到其较低的人气，更新相当及时 | 6 | 基于滚动发布，更新频繁 | 8 | 更新至最新软件和固件
    | 9 |

    | **易用性** | 比 Raspbian 更好，且 Xfce 是树莓派上更好的桌面 | 9 | 不同的工作流风格可能会阻碍部分用户 | 6 | 如果没有
    Arch 经验则难以使用 | 4 | 最易使用，但限于简单软件 | 8 |

    | **教育工具** | 发行版未内置特定的学习工具 | 3 | 未包含，也没有可安装的工具 | 2 | 配置 Arch 对高级用户来说是极好的练习 | 7
    | Raspbian 内置了完整的工具和资源套件 | 10 |

    | **灵活性** | 相当不错，但受限于可用软件包的范围 | 6 | 想要达到预期结果需要付出大量努力 | 3 | 完全可定制，因为你是从命令行自行构建的
    | 9 | 在树莓派上不如 Arch 轻量，但仍非常灵活 | 6 |

    | **总体** | 非常有吸引力，但不如 Arch 或 Raspbian 好 | 6 | 不同且有趣，但不是真正的教育工具 | 4 | 本身很优秀，但不是树莓派的最佳选择
    | 7 | 明确的胜者，围绕树莓派的优势设计 | 9 |


    ### 获奖者是...


    #### Raspbian


    Pidora 的强劲表现提出了关于这些操作系统的一个有趣观点，即树莓派社区支持它们的程度。Raspbian 在几年前就取得了领先地位，此后不仅享受到了树莓派基金会的全面支持，还受益于文档的优势——你为树莓派找到的大部分教程都使用
    Raspbian，因此，其领先地位只会越来越稳固。


    然而，单独看待 Pidora 2014 本身并忽略对 Raspbian 的偏见，它确实有一些关键的易用性优势胜过 Raspbian。虽然还不够好到让它成为更好，但足以让我们认为这将在未来成为一个真正的竞争者。


    RISC OS 也值得一提，不仅因为它保存了数十年后许多 Linux 用户都喜欢的经典操作系统，还因为它提供了完全不同的桌面体验，并帮助年轻的树莓派爱好者更多地了解计算机历史。不幸的是，它不会成为我们首选的树莓派发行版，但它确实很有趣。


    ![](img/c7d3278283754436651c50a2e9c72912_77_0.png)


    *Raspbian 内置了大量旨在教孩子编程的工具*


    至于 Arch，你是否选择使用这个发行版，真的取决于你之前在 Linux 系统上的使用经验。如果你知道自己在做什么——或者准备好投入大量时间来学习——那么
    Arch 可以是大型、雄心勃勃项目的最佳选择。你对如何构建 Arch 拥有绝对的控制权，这使你能够利用高度定制的设置真正挖掘树莓派的潜力。


    因此，目前我们建议你坚持使用 Raspbian，同时密切关注 Pidora。如果你在寻找挑战，是时候开始学习 Arch 了。


    Rob Zwetsloot


