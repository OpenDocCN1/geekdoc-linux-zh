    | | \\| | \\| |\n\n0 = 可选\n\n## 您的观点\n\n推特: @linuxusermag\n\n脸书: Linux User &\
    \ Developer\n\n您获取 Linux 新闻和观点的来源\n\n- 联系我们...\n- 注册并发布您的评论...\n  - www.linuxuser.co.uk/forum/\n\
    - 直接发送邮件给我们...\n  - linuxuser@imagine-publishing.co.uk\n\n# 您的观点\n\n# Linux User\
    \ 读者来信\n\n您对杂志、Linux 和开源的意见\n\n## 苦涩的 Chromebook\n\n我在几期之前读了 Simon Brew 关于学校平板电脑的文章，我在学校技术变革方面有类似的经历。我儿子的学校正在使用\
    \ Chromebook，我参加过一些研讨会并看到其他项目，表明[这]正在变得普遍。一些学校甚至正在更换 iPad。\n\n它们更便宜。当 Chromebook\
    \ 丢失或损坏时，只需拿另一台即可。把它留在家里/学校[基本上等同于]暂时将其交给 IT 部门。如果需要，数据可以共享，如果他们没有 Chromebook，任何运行\
    \ Chrome 的设备都可以使用。\n\n此外，管理工具更好，因此 IT 部门的工作量更少，更重要的是，老师和家长的工作量也更少。\n\nTom Buskey\n\
    \n改变孩子使用电脑学习的方式是必要的，因为计算机领域整体格局在不断变化。以这种方式使用 Chrome、Chrome OS 和 Chromebook，与直接跳到本质上从等式中移除了大量计算元素的平板电脑相比，似乎是一个非常好的折中方案。\n\
    \n我们目前看不到一个仅使用平板电脑的未来，因此出于多种原因，完全切换到 iPad 似乎是一个坏主意。\n\n## Systemd 是个坏主意\n\n我对\
    \ systemd 有一些非常严重的疑虑。我觉得它正在接管 Linux，并降低了用户对系统底层控制的能力。我也对它不断出现的一些 bug 有问题，这些 bug\
    \ 可能会引发系统范围的问题，并且它带来的潜在安全风险。虽然我在你们的杂志上很少看到关于它的讨论。你们对此持什么立场？我们应该回到单独进程的老路子吗？\n\n\
    Jake\n\nSystemd 对很多人来说是一个非常敏感的话题。我们看到了一些非常夸张的标题，直接说 systemd 是末日的先驱。它是否是“邪恶”的其实并不重要，因为有很多用户真的这么认为。对一些人来说，他们是声音最大的少数派，这是互联网交易很多的东西。另一些人认为正面和负面的影响是相等的，而沉默的大多数则置身事外。\n\
    \n我们的看法？还早。它正被缓慢地放入越来越多的系统中，在成为 Linux“标准”之前，还会有很多开发工作。我们希望它不会引起问题，但它可能会让一些人的事情变得更容易，那将是极好的。\n\
    \n## Android 杂志\n\n![](img/c7d3278283754436651c50a2e9c72912_93_0.png)\n\n随着越来越多的\
    \ Android 功能合并回 Linux 内核，为目前最流行的移动操作系统之一进行开发变得更加容易。拥有超过 250 亿次应用下载和全球超过 1 亿台 Android\
    \ 设备，有一个广泛的受众准备并愿意消费应用。对于更以 Android 为中心的编辑内容，你可以看看我们的姊妹杂志《Android 杂志》，这是唯一专门致力于该平台的出版物。除了保持你了解所有\
    \ Android 动态的新闻和评论外，还有关于开发和你硬件黑客行为的教程和建议。在 www.littlegenrobot.co.uk 了解更多信息。\n\n\
    左：Chromebook 和 Chromebox 有各种形状和大小，但都很简单且相对便宜\n\n![](img/c7d3278283754436651c50a2e9c72912_93_1.png)\n\
    \n"
