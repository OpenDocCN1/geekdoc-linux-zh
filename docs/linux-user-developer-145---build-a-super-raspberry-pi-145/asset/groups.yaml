    ## 问答


    ![](img/c7d32783754436651c50a2e9c72912_89_0.png)


    ![](img/c7d32783754436651c50a2e9c72912_89_1.png)


    ![](img/c7d32783754436651c50a2e9c72912_89_2.png)


    ![](img/c7d32783754436651c50a2e9c72912_89_3.png)


    **上方配图说明：** Btrfs 是文件系统的未来，但初始的更改需要执行。


    **Systemd 问题**


    文件系统（subvol 0）位于一个子卷中，因此该子卷可以定期创建快照。


    我刚开始使用 Btrfs，想听听关于移动这些数据的最佳方式的意见。在通常的一番谷歌搜索之后，我并没有找到关于这种情况下的标准做法的具体信息。


    那么，是否有必要创建一个子卷并将数据从文件系统移动到该子卷中？例如：


    ```bash

    # btrfs subvolume create /mnt/subvol1

    # mv /mnt/dir1 /mnt/dir2 /mnt/dir3 /mnt/subvol1/

    ```


    但这需要很长时间。是否有更好的解决方案，还是我只有耐心等待？


    **Bob**


    你说得对——这会花不少时间；速度大约相当于在两块独立磁盘之间传输数据的速度，因此处理需要一些时间。


    最好的方法可能是创建一个子卷，然后将副本重新链接到该子卷。这样不会占用额外的空间，并且随后你可以删除数据的原始版本。你可以这样操作：


    ```bash

    # cd /mnt/[location]

    # btrfs subvolume create subvol1

    # cp -pr --reflink=always dir1 dir2 dir3 subvol1/

    # rm -rf dir1 dir2 dir3

    ```


    我刚完成了一次到 Debian wheezy 的 dist-upgrade，其中包括切换到 systemd 作为 init 系统。升级后，系统总是在挂载磁盘前后停滞，但在网络启用之前。


    我进行了一些故障排除，包括启用调试 shell，但我无法弄清楚发生了什么。每个当前活跃的过程似乎都成功完成了，但它似乎不会继续到下一步。


    从调试 shell 中，我无法运行任何系统命令，它们只是在按下 Ctrl+C 之前一直挂起。我没有使用 LVM，并且我在 /samba (md0) 上挂载了软件
    raid。我可以手动挂载所有磁盘，但在 systemd 停滞的那个时间点，它们并不存在。


    供参考，这是我的内核参数：


    ```bash

    root=UUID=92133be5-64ac-45b5-acae-4f04532bbd ro vga=extenedd systemd.log_level=debug
    systemd.log_target=kmsg log_buf_len=1M

    ```


    我在这上面已经挣扎了几个星期，现在没有主意了。


    任何建议都表示感谢。


    **Joe L**


    据我们所知，Debian testing 中 systemd 的实现仍在进行一些 bug 修复，但通常情况还算好。当然，这并不总是考虑到从 wheezy 升级的情况，这可能造成了你这里的问题。


    **上方配图说明：** 一位管道层开发人员将在即将发布的 LUK2D 期刊中详细介绍 systemd。


    > 如果你能进入某种命令行界面或仅仅使用光盘，我们建议更改 /etc/default/grub 中的某些选项，具体是在文件中添加一个新的 init= 行，并且可能更改
    verbose 以便你能看到出错之前确切发生了什么。

    >

    > 如果其他方法都失败，你可能需要对 Debian 进行全新安装。希望这些 systemd 问题得到修复，因为它们在社区中造成了一些困扰。


    **遗忘的安装**


    我有一台在 Debian 上运行的家庭自动化控制器，通过主板上的串行端口连接。我设法让它工作得很好，但注意到每次重启后程序又无法工作了。


    这个程序叫做 BottleRocket，可以通过软件管理器获取。我通过那里重新安装过，通过 synaptic 卸载并重新安装过，结果总是相同的：运行得很好，但重启后就不行了。据我所知，罪魁祸首是一个名为
    Firecracker 的链接文件，它被复制到 /dev/ 文件夹中。不知何故，每次重启后它都会消失，与程序相关的命令就无法工作。有什么想法吗？


    Don Michaelson


    显然，这是 Debian 中偶尔会发生的事情，特别是针对 Firecracker。不过有一个修复方法，非常简单，只需在终端中运行以下内容：


    ```bash

    sudo echo "KERNEL==\"ttyS0\", SYMLINK==\"firecracker\"" > /etc/udev/rules.d/98-firecracker.rules

    ```


    ... 然后重启。你永远不需要再次执行此步骤，否则你可能需要为你的家庭自动化尝试使用不同的发行版。


    **虚拟 CPU**


    我正在努力解决其中一个 VirtualBox 虚拟机的性能问题。我使用华硕主板，配备 AMD 四核处理器、1TB 硬盘和 16GB 内存，虚拟机运行 Ubuntu，带有
    Unity 3D，分配了 10GB 内存和 160GB vDisk。有人告诉我性能问题可能是因为使用了两个 vCPU。具体来说，当虚拟机中有第二个 vCPU
    时，I/O APIC 会自动运行，这会减慢虚拟机上的 I/O 调用，所以我应该在虚拟机中只保留一个 vCPU。这是正确的还是错误的？


    Cat


    如果你的系统中只有一个真实处理器，那么试图让 VirtualBox 拥有多个 vCPU 效果不会很好。主机和客户机机器对此类资源非常敏感，因此任何奇怪的失衡都会导致明显的减速。不过，如果你有多个
    CPU，你可以将其中一些或全部添加到虚拟机中，它应该可以工作。我们听说的问题主要集中在运行多个 CPU 的 Windows XP 机器上，但 Linux 发行版应该没问题。


    ![](img/c7d32783754436651c50a2e9c72912_90_1.png)


    **上方配图说明：** 使用多个 vCPU 时请小心。


