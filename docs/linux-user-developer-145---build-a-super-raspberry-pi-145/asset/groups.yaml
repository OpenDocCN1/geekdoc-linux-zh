    ### Configuring wireless drivers\n\nI’m running Mint 17 with a Plasma 5 desktop.\
    \ This afternoon I saw the icon for Update Manager had disappeared from the system\
    \ tray in the bottom right-hand corner of the screen. I hadn’t done anything which\
