    ### 05 Run the code


    So that''s the basics of how your code can be sent throughout a cluster. To actually
    activate the code and choose the Raspberry Pi recipients, you will need to write
    this in a terminal:


    ```bash

    $ mpirun -host 192.168.1.20,192.168.1.21,192.168.1.22

    python superpi.py

    ```


    ... with the IP addresses being the ones that are on the other Raspberry Pis.


    ### 06 Will it work?


    What we''ve done above won''t really do anything, but it at least illustrates
    how you can send code around the network. You can do it for any type of calculating
    due, but to some of the network lag, it''s only worth it for large numbers and
    bigger data.


    ## Construct your SuperPi


    Now you’ve programmed your Raspberry Pi units, it’s time to link them together


    Programming the Raspberry Pis is one part of constructing **your supercomputer
    – properly housing them together is another problem.** The very basic things you
    require to get them to work is power and a local network via a router and/or switches.
    This then extends to cases, SD cards and even Raspberry Pis themselves.


    To make sure you get the most out of the system, you’ll have to get the right
    selection of components to power and connect them.


    > You won’t need the maximum amount of power in a cluster, as you won’t be powering
    a display or a camera off the GPIO ports


    ![](img/c7d3278283754436651c50a2e9c72912_53_0.png)


    ### Power supply


    A good power supply is extremely important when powering a Raspberry Pi, otherwise
    it will power on and run but you won’t be able to get the most out of it. If you’re
    using the Model B+ and notice a rainbow square in the corner, that’s an indication
    you’re not giving it enough power. You won’t need the maximum amount of power
    in your cluster, as you won’t be powering a display or a camera or possibly anything
    off the GPIO ports, so the recommended two amps may be a little overpowered for
    your needs, even if you do push the processor to its limits. However, if you plan
    to do any overclocking then the two-amp power supply will become more and more
    necessary, and it’s a lot better to be on the safe side.


    As your cluster grows you’ll also need to make sure you have plenty of surge protection
    as the Raspberry Pis can be extremely sensitive.


    **We recommend:**


    Raspberry Pi Universal Power Supply


    pimoroni.com


    ### Networking


    The more Raspberry Pis you plan to connect up, the more networking you will need
    to hook them together. The best method to do this is via cable, as it will carry
    any messages faster and with less latency than wireless – but creating the cluster
    isn’t as easy as plugging it into a router, though. With more Pis you’ll need
    more ports, and this can be accomplished by getting network switches. These are
    dumb connectors that contain no routing or address system, but allow you to connect
    more devices up to a central router.


    Even though we recommend cabling, you can still use wireless to connect extra
    Pis. This also has the effect of cutting down on the amount of cabling and network
    switches you can use, but in general it’s better to have a homogenous setup.


    ![](img/c7d3278283754436651c50a2e9c72912_53_1.png)


    ### Overclock


    If you find you still want a little extra power from your cluster, you could always
    try overclocking your Raspberry Pis.


    In Raspbian, you can do this from the config menu, accessible via sudo raspi-config.
    In the menu you will find an option to overclock with a few levels to select from.
    You can do this on separate Raspberry Pis or all of them, but be aware that doing
    so can shorten the lifespan of a Pi CPU, especially when set to the highest level.


    ## Build a Super Raspberry Pi


    ![](img/c7d3278283754436651c50a2e9c72912_54_0.png)


    ### Cases


    There are many types of cases for a lot of Raspberry Pi uses: from simplistic
    plastic cases to protect the Pi from dust, to fully water- and weather-proof metal
    shells. One of the most versatile cases is the Pimoroni Pibow, which comes in
    a variety of sizes and configurations for all versions of the Raspberry Pi. The
    cases are all held together by screws that can easily be repurposed to help mount
    the Pis in a tower or other configuration so that they don''t take up as much
    horizontal space.


    They can be a little slower to get your Raspberry Pi into than some cases, but
    they''re quite durable and easily customisable if you want to move them, or add
    a small touchscreen or scrolling LCD screen to the main Raspberry Pi to keep an
    eye on things without needing to SSH in.


    > We recommend:

    **Pimoroni PiBow**

    pimoroni.com


    ### SD cards


    **SD card selection is a minor but still important factor when creating your cluster.**


    Some Raspberry Pis come with an SD card which should be suitable enough, while
    others you''ll need to buy some cards for. We recommend getting 4GB cards; while
    a 2GB card will do the job, 4GB allows you to use NOOBS if you have to and is
    also future-proof for larger distros and operating systems. As the Model B+ requires
    a micro SD card, make sure you have the right ratio of SD and micro SD cards.


    When it comes to getting the SD cards all set up and homogenous, the easiest and
    quickest method is to first do all the installing and updating on one Raspberry
    Pi, minus the firmware update with rpi-update. Then create a copy of the disk
    by putting it into a Linux system, open up the terminal and use:


    ```

    $ sudo dd bs=1M if=/dev/[SD card location] of=superpi.img

    ```


    Once it''s copied, you can write this to all the other cards using:


    ```

    $ sudo dd bs=1M if=superpi.img of=/dev/[SD card location]

    ```


    > We recommend:

    **4GB**

    pimoroni.com


    ![](img/c7d3278283754436651c50a2e9c72912_54_1.png)


    ![](img/c7d3278283754436651c50a2e9c72912_54_2.png)


    ### Raspberry Pis


    **It actually doesn''t really matter what type of Raspberry Pi you use in your
    cluster** – you could use a homogenous selection of the latest **Model B+** or
    even have a **mixture of the B+, B and Model As connected to each other**. As
    long as you have them running the same software and possessing the relevant scripts,
    the system will work. The main differences you might encounter are the differing
    power draws between devices and that the Model A might be slightly slower for
    some calculations.


    The Model A types do have a disadvantage in that they do not have an ethernet
    port built-in. However, they can still make use of a wireless dongle to connect
    to the overall network of Raspberry Pis.


    Make sure you set a static IP address for each Raspberry Pi with a specific range
    covering their location on the network. This is helpful for two main reasons,
    the first one being the ability to always be able to call the correct address
    when running MPI, and the second being that you can then SSH in and maintain your
    Pis from afar.


    > We recommend:

    **Model B+**

    element14.com

