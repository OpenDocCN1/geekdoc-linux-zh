  mdcn: "\n\n## 观点\n\n内核专栏 — Jon Masters\n\n### 开源\n\n开源继续发挥着它的作用，在将环境从一个任务传递给另一个任务的过程中，它从未仅仅充当过旁观者。\n\
    \n### 正在进行的开发\n\n关于非阻塞文件读取主题的一个有趣讨论串，最初的主题是“仅从页面缓存进行 read()/read()”。Linux 页面缓存是一个内存数据结构，包含数据页（磁盘文件的片段，在该上下文中也称为“节点”），这些页代表之前已被读入内存的文件部分，并且（至少暂时）有充足的剩余\
    \ RAM 来保留一份缓存副本，以便应对即将发生的重复访问。仅从页面缓存读取文件数据的想法是，文件读取操作往往会阻塞非常长的时间（毫秒级）；对于低延迟或实时系统来说，这足以破坏任何形式的确定性。通常，专用实时系统会出于这些原因对数据存储采取预防措施。但有些人希望使用通用文件系统，并简单地利用页面缓存的存在，从而允许对每个请求控制读取操作是否阻塞（如果数据之前未在其中缓存）。\n\
    \n为 POWER8 架构支持发布了新的补丁，包括 CPU 类型本身的选择，以及通过 gtrace API 在调试时控制特定进程使用的 Transactional\
    \ Memory（事务内存）硬件支持属性的功能。事务内存是一个非常出色的功能，许多架构正在增加对其的支持（最近的 x86 芯片内置了这一功能）。它允许将一系列内存操作作为一个单元来处理，该单元要么完全（原子性地）完成，要么完全不执行。它通常用于实现各种高性能临界区，以替代传统的锁（因此\
    \ Intel 在其实现中使用术语 Transactional Synchronization Extensions 或“TSX”），通常是通过将整体事务的大小限制为\
    \ L1 缓存行宽度的倍数，并使用缓存组织技巧来实现。\n\n社区举办的 Linux 管道工会议（Linux Plumbers Conference）正在为其\
    \ 2015 年活动招募组织者。\n\nLPC 同时与 Linux 基金会活动（如 LinuxCon）同时举办，并在 Linux 基金会技术指导委员会（TAB）的总体技术指导下进行。新的\
    \ TAB 于本月宣布，此前在今年芝加哥举办的 LinuxCon 上举行了新选举（完整披露：本文作者被提名参选，但因故缺席）；目前正在寻求协助组织将在西雅图举行的活动。新的\
    \ TAB 见证了几位长期成员的离去，并新增了少数几张新面孔，包括新任主席 Grant Likely。令人特别欣慰的是，这十人组成的 TAB 现在有两位女性成员（随着\
    \ Kristen Accardi 加入 Sarah Sharp）。当然，这还远远不够，但这至少是朝着正确方向发展的一个令人欢迎的趋势。\n\n最后，本月最近发布了一个补丁，该补丁启用了即将发布的\
    \ GCC 5 的支持。对于那些对尝试新且新颖的编译器感兴趣的人来说，这绝对值得关注。\n\n> “几十年前，一个 bug 被意外引入了 Bash 中”\n\
    \n![](img/c7d3278283754436651c50a2e9c72912_14_0.png)\n\n## Ubuntu 十周年\n\n回顾历史，庆祝该发行版的生日\n\
    \n![](img/c7d3278283754436651c50a2e9c72912_15_0.png)\n\n### 专题\n\n![](img/c7d3278283754436651c50a2e9c72912_16_0.png)\n\
    \n### 通过回顾 Ubuntu 及其推动者和变革者，我们庆祝该发行版十周年\n\n今年这个月的十年前，一个看似不起眼的、昵称为 Warty Warthog\
    \ 的发行版出现在 Linux 领域，并引发了一场文化滑坡，使 Linux 从典型操作系统的阴影中崛起，并在 2014 年成为一个家喻户晓的名字。自 2004\
    \ 年 10 月以来，Warty Warthog 经历了多种形态的演变，成为 Ubuntu 的最新版本 Utopic Unicorn。\n\n作为变革的催化剂，Ubuntu\
    \ 在其辉煌的十年中取得了巨大成就。它开创了开箱即用的 Linux 操作系统理念，无需手动排查故障和配置硬件。它普及了我们在当今大多数发行版安装中使用的图形界面，使其更易用、更易于使用，同时也普及了许多人依赖其主要计算机的长期支持（LTS）版本。它因对桌面和移动操作系统未来的观点而引发了尖锐的意见分歧，预测了融合趋势，并大胆地参与了铺路工作。\n\
    \n两种力量正在推动 Ubuntu 前进，它们共同使得 Linux 在公众视野中获得了一定程度的成功，这是非常少其他发行版所达到的：Canonical 的领导和\
    \ Ubuntu 社区。\n\n两者之间的关系是开源公司如何与最终用户合作以可靠交付他们所需内容的典范模型。Ubuntu 贡献者知道他们的声音被 Canonical\
    \ 团队领导所听取，开发过程极其民主，同时足够严格，以遵守 Ubuntu 严格的发布日程和 LTS 承诺。这是一种微妙的平衡，Canonical 巧妙地达成了平衡，每年生产两次高质量的\
    \ Linux 发行版。\n\n今天，我们回顾 Ubuntu 的十年历程，庆祝那些让它成为现实的开发者和贡献者的成就——并展望未来，看看我们将去向何方。\n\
    \n- **Jane Silber**\n  *首席执行官*\n  Jane 在最初的 Ubuntu 发布之前加入 Canonical，担任首席运营官。她参与了多个\
    \ Canonical 项目，并具有 C 和 C++ 编程背景。\n\n- **Martin Pitt**\n  *软件工程师*\n  Martin 在加入首批\
    \ Ubuntu 开发者之前，曾是一位多产的 Linux 开发者长达七年。他现在从事基础架构层的工作，但过去为发行版做得更多。\n\n- **Alan Pope**\n\
    \  *应用程序项目经理*\n  作为 Linux 社区的老手，Alan 曾经是 Launchpad 上的技术支持志愿者。现在，他协调社区工作，为 Ubuntu\
    \ 手机开发核心应用。\n\n- **Richard Collins**\n  *移动产品经理*\n  Richard 负责 Ubuntu 的移动方面。在加入\
    \ Canonical 之前，他通过多年在 Symbian 基金会的工作，已经拥有移动领域的背景。\n\n## 首个 Ubuntu\n\nWarty Warthog\
    \ 于 2004 年 10 月 20 日发布，当时的 Linux 世界与今天大不相同\n\n最初的 Ubuntu 桌面版本几乎没有品牌标识。你可以看到它使用\
    \ GNOME 2 作为首选桌面环境\n\n![](img/c7d3278283754436651c50a2e9c72912_17_0.png)\n\nUbuntu\
    \ 是首批自动挂载闪存驱动的发行版之一，但你仍然可以用——现在字面意义上的——老式方法来做\n\n最初的 Ubuntu 附带了一些默认应用程序，看起来像是开源历史的一个切片。GIMP\
    \ 只是一个例子\n\n和今天一样，Warty Warthog 附带了 Mozilla Firefox，尽管当时它是该浏览器最早的形式之一\n\n那是 2004\
    \ 年 2 月，这是一个与我们今天所知的非常不同的世界。Windows XP 是微软最新的桌面操作系统。Apple 硬件仍在运行 PowerPC。BlackBerry\
    \ 和 PDA 主导智能手机市场，x64 芯片刚刚开始进入市场。Linux 在开发者圈子之外几乎不在时代潮流之中，但这种情况很快就会改变。\n\n“我是当时\
    \ Mark Shuttleworth 打电话回的第一批人之一，”软件工程师 Martin Pitt 说，他在 Linux 桌面即将发生重大革命的开始时就在那里。“他给我发了一封电子邮件，解释了他关于做一个基于\
    \ Debian 的 Linux 项目的想法，该项目具有定期的发布周期，同时也面向用户友好。”\n\n“这是 Ubuntu 4.10 开发的开始，代码名为\
    \ Warty Warthog，也是 Canonical 本身的开始。当时，Linux 桌面非常不同。没有图形安装程序，没有面向用户的发行版普及，也几乎没有推动‘普通人’开始使用\
    \ Linux。”\n\n“Canonical 和 Ubuntu 于 2004 年 4 月正式启动，”Canonical CEO Jane Silver 补充道。“[Mark]\
    \ 召集了大约十个人，怀着创建 Ubuntu 的愿景……我在几个月后的七月遇到了他，立刻相信了 Ubuntu 和 Canonical 的愿景。”\n\nJane\
    \ 后来作为该公司的首席运营官加入，经过几个月的开发，第一个 Ubuntu 于 2004 年 10 月 20 日发布。不过，Martin 解释说，该发布的普及有点缓慢：\n\
    \n![](img/c7d3278283754436651c50a2e9c72912_17_1.png)\n\n**2004 年 10 月 20 日**\n\
    \n### 在最初……\n\nUbuntu 4.10 Warty Warthog 发布。基于 Debian testing，使用 GNOME 桌面环境，它是一个稳固的首次发布。它不是一夜之间\
    \ sensation，但它发现了一群忠实的用户。\n\n![](img/c7d3278283754436651c50a2e9c72912_17_2.png)\n\
    \n**2005 年 4 月 18 日**\n\n### 第一个衍生版\n\nKubuntu 是 Ubuntu 的第一个替代风味，在 Ubuntu 发布后不久发布，提供\
    \ KDE 桌面环境，而非 Ubuntu 默认的 GNOME。\n\n"
