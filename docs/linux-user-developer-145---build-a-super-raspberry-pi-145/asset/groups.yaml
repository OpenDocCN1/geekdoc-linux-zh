    \ as 64-bit x86 chips from AMD and Intel, ARMv8 processors draw considerably less\
    \ power, enabling for higher density in the data\n\n![](img/c7d3278283754436651c50a2e9c72912_6_1.png)\n\
    \ncentre – perfect, its proponents claim, for cloud computing tasks.\n\nRed Hat\
    \ has confirmed the launch of what it describes as the ARM Partner Early Access\
    \ Programme to speed up the adoption of ARMv8, which is not compatible with x86\
    \ and AMD64 ISAs. \"Within the 64-bit ARM ecosystem, Red Hat is focused on creating\
    \ a singular operating platform that relies on common standards to foster the\
    \ development of new applications,\" the company claimed in a launch statement.\n\
    \n\"The goal is to maintain expected enterprise-class attributes such as reliability,\
    \ security, and performance for applications that are largely available today\
    \ as open source projects.\"\n\nAlthough Nvidia and Samsung have both backed away\
    \ from plans to release server-centric ARMv8 processors, companies including AMD\
    \ and AppliedMicro have products available in the market now.\n\n+   FREE SOFTWARE\n\
    \n# FSF & Debian partner on free hardware database\n\nThe Free Software Foundation\
    \ and the Debian Project have joined forces to expand and enhance h-node, a database\
    \ of hardware that can be used under Linux without any proprietary software or\
    \ firmware.\n\n\"By collaborating with h-node, Debian for the first time has the\
    \ opportunity to join efforts with other free software communities on the assembly\
    \ of a database of hardware that doesn't require anything outside the Debian main\
    \ archive to work,\" explained Lucas Nussbaum, Debian Project leader of the move\
    \ which will see the FSF providing infrastructure and support.\n\nPreviously,\
    \ Debian users were not permitted to contribute to the database due to the presence\
    \ of non-free repositories.\n\nThe partnership will see h-node accepting contributions\
    \ from Debian users providing they are using only the default free software repository\
    \ for testing.\n\n![](img/c7d3278283754436651c50a2e9c72912_6_2.png)"
