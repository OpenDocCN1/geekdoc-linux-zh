    # # THREAD BARE


    # # What? Sysadmin

    ## is evolving!


    When we announced the Linux Foundation''s plans for a new certification course
    we also added one of the Foundation''s infographic with the different ''stages''
    of a sysadmin illustrated with Penguins. The definitions surprised and delighted
    some on reddit. Find out your level at: http://bit.ly/1rm5Xv3.


    +   **bobarobert said:**

    See I could count myself as a novice or junior, but I know how devices and device
    drivers work. I''ve modified some myself. It''s hard to classify sometimes.


    **ChojinDSL said:**

    Yeah, I have trouble classifying myself as well. I''d probably be somewhere between
    Junior and Senior my self. Give me a chutkle though.


    **POTUS said:**

    This is normal. The more you know, the more you know you don''t know. It might
    feel like you shouldn''t call yourself a senior level sysadmin because you''re
    sure that you come up with something you don''t know or don''t do well enough,
    but at the end of the day you just have to realise that nobody knows everything.
    Being able to make use of the resources available to you to make things work is
    what really makes a senior sysadmin.


    +   **ydna_eiissa said:**

    Look at the recent Matthew Garrett AMA. He mentioned numerous areas he feels he
    knows nothing about.


    **sigma914 said:**

    Oo, apparently I''m a senior... that seriously can''t be all [there] is to it.


    **BlueDragonX said:**

    I guess once you start contributing code to the kernel you''re no longer a sysadmin.


    **interupt said:**

    I would call that an engineer


    **CandyCorns__ said:**

    Seems like some of these distinctions are really blurry, because I consider myself
    having aspects of Novice, Junior, Intermediate/Advanced, and Senior. But, I''m
    not a sysadmin, just a guy that''s used Linux for many years.


    **demizer said:**

    I''m actually employed as a Junior Linux System Admin. I would say this is accurate,
    but there is much more to being a Senior Admin.


