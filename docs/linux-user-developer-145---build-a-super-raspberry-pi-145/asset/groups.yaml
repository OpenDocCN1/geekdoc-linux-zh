    # Configure virtual boxes with Puppet and Vagrant – part 1


    Make it simpler to develop all kinds of server apps and manage the deployment
    of new servers by using virtual machines


    # ## Advisor


    ![](img/c7d3278283754436651c50a2e9c72912_25_2.png)


    **Richard Smedley**

    A Unixjack-of-all-trades, Richard doesn’t spend enough time in any language to
    get truly proficient, but always has a shell open so learnt scripting by osmosis


    # ## Resources


    +   * Ruby [ruby-lang.org](http://ruby-lang.org)

    * Virtual Box [virtualbox.org](http://virtualbox.org)

    * Vagrant [vagrantup.com/downloads](http://vagrantup.com/downloads)


    It may not ever be ‘The Year of the Linux Desktop’, but free and open source dominates
    the boxes where web apps live, so how do we develop for them across a heterogeneous
    environment? Vagrant holds together VirtualBox or any other virtualisation software
    – it works with Amazon EC2 and VMware, and can work with containers like Docker
    and OpenVZ. It can also work with various config tools to make an easy-to-manage,
    portable development environment.


    Its greatest advantage is eliminating nearly all of the differences between development
    and deployment environments, drastically reducing unnecessary errors. As your
    needs grow more complex, Vagrant’s close integration with config tools like Puppet
    will lift the admin burden from your shoulders.'
