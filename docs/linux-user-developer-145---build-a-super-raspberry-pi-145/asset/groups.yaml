    ## Ubuntu 10 周年


    回顾历史，庆祝该发行版的生日


    ### 专题特写


    ![](img/c7d3278283754436651c50a2e9c72912_18_0.png)


    左图：那个时期基础的 GNOME 桌面。实况光盘和安装光盘曾经是两个独立的映像。


    ### Linux 的现状


    Alan 为我们生动描述了 2004 年 Linux 的处境。


    > “当时我有一台飞利浦网络摄像头；在 Red Hat 和 Debian 上它都存在一些问题，我经常不得不重新编译我的内核。那似乎就是当时人们做的事情。某个功能不起作用，你就会去获取内核源代码，然后运行一些晦涩不明的命令，这些命令可能有效也可能无效，且可能耗时很长；最终你得到的内核可能能用也可能不能用。它可能甚至无法启动，即使启动了，你的摄像头也可能工作，也可能不工作。我安装了
    Ubuntu，我的摄像头开箱即用。我不必做任何事情，我认为这必然是未来的方向。”


    ### 在第一个测试版之前的开发过程相对保密


    “老实说，当时主要还是由开发人员在进行开发，因此最初的报道热度相当低。我曾为一些著名的德国计算机新闻杂志撰稿，起初他们说：‘是的，这只是又一个发行版——我们为什么要报道它？’”


    在第一个测试版之前的开发过程相对保密，虽然第一个版本可能“仅”吸引了几千名用户，但其名字在整个 Linux 和开源社区中开始声名鹊起。


    “当时我在汉普郡的本地 Linux 用户组，我的一位朋友知道我非常热衷于 Debian，”应用项目经理 Alan Pope 回忆道，“他提到了这个东西，这个由某个疯狂的南非人开发的新事物。因为我并不订阅任何
    Debian 邮件列表，也不真正参与 Debian 社区或相关事务，所以我之前从未听说过它。但它看起来很漂亮，于是我安装了它。那是 2004 年末，从那以后——我就一直稳固地使用它至今。”


    尽管当时只是一个小型发布版本，4.10 版留下的遗产却是巨大的。它相对容易安装，从一开始就提供了一个预配置的桌面，并能自动挂载闪存存储。这些特性后来得到了极大的扩展。


    开发人员为他们的作品感到自豪，5.04 版很快进入了开发阶段。接下来的两年对 Ubuntu 至关重要，并使其在用户和开发人员中均成为家喻户晓的名字。


    ![](img/c7d3278283754436651c50a2e9c72912_18_1.png)


    上图：带有原始标志的原始启动画面。多年来，Ubuntu 对橙色的偏好变化不大。


    ### 2005 年 7 月 8 日：Ubuntu 基金会


    由创始人 Mark Shuttleworth 创立，Ubuntu 基金会是一个信托基金，旨在确保该发行版的未来。目前它处于休眠状态，但 Canonical
    计划如有必要将其作为紧急基金使用。


    ![](img/c7d3278283754436651c50a2e9c72912_18_2.png)


    ### 2006 年 6 月 1 日：首个 LTS 版本发布


    Ubuntu 最初的长期支持（LTS）版本比原定的 4 月发布日期推迟了几个月，但它的发布标志着 Ubuntu 受欢迎程度发生了一个转折点。


    ## 早期岁月


    Ubuntu 在 21 世纪 00 年代后期的迅速崛起在 Linux 桌面领域引发了一场小革命。


    在接下来的几年里，一些事情开始发生。Kubuntu 5.04 在下一个周期中发布，并至今仍作为 Ubuntu 的主要衍生版本之一被发布。随着每个版本的推出，功能不断增加，Ubuntu
    缓慢但确定地赢得了人气。


    “很难说，因为它的增长一直是指数级的，”当我们问 Martin 哪个版本真正让 Ubuntu 在桌面 Linux 市场站稳脚跟时，他告诉我们。“但如果我必须选一个，那就是我们的第一个
    LTS，6.06 Dapper Drake。它被明确宣布为长期支持版本，我们在稳定化方面付出了特别的努力。它也是第一个拥有图形化安装程序版本，因此操作变得更加容易。”


    ![](img/c7d32783754436651c50a2e9c72912_19_0.png)


    上图：Unity 的第一个版本与今天的样子大不相同。


    迄今为止，6.06 版是唯一一个未在 4 月或 10 月发布的 Ubuntu 版本，在推迟近两个月于 6 月 1 日发布后，获得了 .06 的后缀。桌面版支持持续了三年，服务器版支持持续了五年，这种做法随后在
    LTS 发布中被停止，目前桌面版和服务器版均获得五年的支持。


    随着人气上升，一个由用户和开发人员组成的新兴社区应运而生。Alan 从一开始就是该社区的一部分，他在工作中自由时间通过 Launchpad 回答人们的问题，并向我们描述了社区的演变。


    “在最初阶段，活跃的贡献者是那些在引导搭建基础架构的人，例如建立 IRC 频道和邮件列表。这一切都是由拥有特定专业知识的人完成的，比如整天坐在 IRC 上创建
    Ubuntu IRC 频道的人。还有熟悉邮件列表的人负责建立邮件列表，了解论坛软件的人则负责建立论坛。在早期，它有些缺乏结构——但这很棒，因为我们需要所有这些功能，且这是一个高度自我驱动、自我激励的过程。


    ![](img/c7d32783754436651c50a2e9c72912_19_1.png)


    上图：Xubuntu 作为 2006 年早期的轻量级衍生版本之一开始出现。


    > “一旦我们克服了创建初始基础设施的障碍，更多人就能做出贡献”


    有人决定‘我们应该有一个论坛’，他们就创建了一个，并变得疯狂流行。因此，一旦我们克服了创建初始基础设施以启动项目的障碍，以及零碎的基础组件，更多人就能做出贡献。那时，来自社区的贡献开始采取更典型的方式，如翻译、报告错误、分类处理、提交补丁以及编写文档。这是人们常做的核心贡献。”


    社区一直在成长，现在已成为 Canonical 非常重要的一部分，正如 Jane 告诉我们的那样：


    “Ubuntu 的开源社区本质，以及社区与公司之间的合作，是我认为 Canonical 非常独特且有趣的一点。我继续认为，这是我们做得特别出色并持续引领该领域的一个方面。”


    ### Ubuntu 时间线


    ![](img/c7d32783754436651c50a2e9c72912_19_2.png)


    **2009 年 5 月 13 日**

    ### Ubuntu One 启动


    该云存储服务是同类产品中的先行者之一，最初之所以这样命名，是因为它为所有 Ubuntu 用户提供 1GB 的免费存储空间。它很快作为集成服务进入了桌面系统。


    **2010 年 3 月 1 日**

    ### 领导层变动


    Mark Shuttleworth 辞去了 Canonical 的首席执行官职务，以便更亲近 Canonical 的开发团队。接替他的是 Jane Silber，她当时是首席运营官，至今仍是
    Canonical 的首席执行官。


    ## Ubuntu 10 周年


    回顾历史，庆祝该发行版的生日


    ![](img/c7d32783754436651c50a2e9c72912_20_0.png)


    ![](img/c7d32783754436651c50a2e9c72912_20_1.png)


    上图：Ubuntu 论坛上的活跃社区已经存在很长时间了。


    自那以后，社区致力于多个 Ubuntu 项目。他们创建了 PDF 格式的手册，将其翻译成不同语言，并启动了一个更好的支持网站，名为 AskUbuntu ([http://askubuntu.com](http://askubuntu.com))。


    在接下来的几年里，社区继续增长，Ubuntu 确立了其作为全球最大 Linux 发行版之一，甚至是桌面端最受欢迎发行版的地位。2010 年，统一桌面的宏伟愿景随着
    Unity 的发布而开始。


    “我第一次看到很像它的东西是在一次 Ubuntu 开发人员峰会上，当时设计团队正在展示新外壳的可能样子，”Alan 回忆道。“我相当早地开始使用它。在过去一年到一年半的时间里，它经历了一段艰难的路。我喜欢它，我享受使用它。”


    但并非社区里的每个人都同意 Alan 的看法。“有一些人声音很大，决定这不是给他们准备的，他们不喜欢它，这没关系，”Alan 继续说道。


    “我认为在某些方面，它被稍微夸大了，很多人没有意识到的是，Ubuntu 在全球许多硬件上预装出厂，而 Unity 是默认桌面。我没有办法知道那些人回到家是否立即将其移除并安装
    KDE 或 Xfce，而且——说实话——我对此并不真的在意。”


    确实，正如 Alan 向我们指出的那样，Ubuntu 中有许多不同的桌面环境可供选择，无论是在软件仓库中还是在各种替代衍生版本中。不过，Unity 是 Ubuntu
    设计哲学的核心，随着它迈向所有设备更加统一的未来。


    ### 各种口味的 Ubuntu


    ![](img/c7d32783754436651c50a2e9c72912_20_2.png)


    #### Kubuntu


    Ubuntu 的第一个主要衍生版本是 Kubuntu，主要区别在于包含了 KDE 桌面。但如今，它由与 KDE 开发相关的第三方赞助。这个美丽的桌面与 Unity
    大不相同。


    ![](img/c7d32783754436651c50a2e9c72912_20_3.png)


    #### Lubuntu


    Ubuntu 的轻量级版本，使用 LXDE 桌面以最大化 Ubuntu 可使用的资源量。这对于较旧或性能较低的计算机非常有用，如果你更喜欢简单的界面并希望充分利用你的
    CPU，也可以轻松地扩展配置到更强大的机器上。


    #### Edubuntu


    Ubuntu 的教育衍生版本，支持 LTSP 瘦客户端，使学生可以同时运行完全相同的发行版。它旨在让希望创建计算机实验室或在线教室的教师易于使用。它使用 Unity
    和各种有用的开源软件。


    **2010 年 10 月 10 日**

    ### 首次体验 Unity


    Unity 随 Ubuntu 10.10 的上网本版本发布，让用户第一次看到 Canonical 的新桌面环境。这也是上网本版本最后一次发布，随后它合并到了主发行版中。


    ![](img/c7d32783754436651c50a2e9c72912_20_4.png)


    **2011 年 4 月 28 日**

    ### 全民 Unity


    11.04 对 Canonical 来说是一个重大版本，因为它开始了公司在 Unity 环境下统一桌面的愿景。基于当时较新的 GNOME 3，11.04 在某种程度上是
    GNOME 外壳的替代品。


