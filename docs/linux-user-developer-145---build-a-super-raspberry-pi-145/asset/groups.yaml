    # Build a Super Raspberry Pi


    ![](img/c7d3278283754436651c50a2e9c72912_54_0.png)


    # Cases


    There are many types of cases for a lot of Raspberry Pi uses: from simplistic
    plastic cases to protect the Pi from dust, to fully water- and weather-proof metal
    shells. One of the most versatile cases is the Pimoroni Pibow, which comes in
    a variety of sizes and configurations for all versions of the Raspberry Pi. The
    cases are all held together by screws that can easily be repurposed to help mount
    the Pis in a tower or other configuration so that they don''t take up as much
    horizontal space.


    They can be a little slower to get your Raspberry Pi into than some cases, but
    they''re quite durable and easily customisable if you want to move them, or add
    a small touchscreen or scrolling LCD screen to the main Raspberry Pi to keep an
    eye on things without needing to SSH in.


    > We recommend:

    **Pimoroni PiBow**

    pimoroni.com


    # SD cards


    **SD card selection is a minor but still important factor when creating your cluster.**


    Some Raspberry Pis come with an SD card which should be suitable enough, while
    others you''ll need to buy some cards for. We recommend getting 4GB cards; while
    a 2GB card will do the job, 4GB allows you to use NOOBS if you have to and is
    also future-proof for larger distros and operating systems. As the Model B+ requires
    a micro SD card, make sure you have the right ratio of SD and micro SD cards.


    When it comes to getting the SD cards all set up and homogenous, the easiest and
    quickest method is to first do all the installing and updating on one Raspberry
    Pi, minus the firmware update with rpi-update. Then create a copy of the disk
    by putting it into a Linux system, open up the terminal and use:


    ```

    $ sudo dd bs=1M if=/dev/[SD card location] of=superpi.img

    ```


    Once it''s copied, you can write this to all the other cards using:


    ```

    $ sudo dd bs=1M if=superpi.img of=/dev/[SD card location]

    ```


    > We recommend:

    **4GB**

    pimoroni.com


    ![](img/c7d3278283754436651c50a2e9c72912_54_1.png)


    ![](img/c7d3278283754436651c50a2e9c72912_54_2.png)


    # Raspberry Pis


    **It actually doesn''t really matter what type of Raspberry Pi you use in your
    cluster** – you could use a homogenous selection of the latest **Model B+** or
    even have a **mixture of the B+, B and Model As connected to each other**. As
    long as you have them running the same software and possessing the relevant scripts,
    the system will work. The main differences you might encounter are the differing
    power draws between devices and that the Model A might be slightly slower for
    some calculations.


    The Model A types do have a disadvantage in that they do not have an ethernet
    port built-in. However, they can still make use of a wireless dongle to connect
    to the overall network of Raspberry Pis.


    Make sure you set a static IP address for each Raspberry Pi with a specific range
    covering their location on the network. This is helpful for two main reasons,
    the first one being the ability to always be able to call the correct address
    when running MPI, and the second being that you can then SSH in and maintain your
    Pis from afar.


    > We recommend:

    **Model B+**

    element14.com'
