    ![](img/c7d3278283754436651c50a2e9c72912_0_1.png)\n\n**第145期 £5.99**\n\n![](img/c7d3278283754436651c50a2e9c72912_1_0.png)\n\
    \n# 您愿意为代码俱乐部做志愿者吗？\n\n代码俱乐部是一个全国性的志愿者主导的课后编程俱乐部网络，面向9-11岁的儿童。\n\n我们需要懂得如何编写计算机程序的人，自愿在当地的.primary学校、图书馆或社区中心每周花一主持一个俱乐部。\n\
    \n我们为我们的志愿者创建教学项目，我们制作的项目通过展示如何制作电脑游戏、动画和网站来教会孩子们如何编程。\n\n加入我们，让我们教导下一代编码！\n\n\
    访问 **www.codeclub.org.uk** 了解更多信息\n\n![](img/c7d3278283754436651c50a2e9c72912_1_1.png)\n\
    \n# 欢迎来到《Linux 用户与开发者》第145期\n\n![](img/c7d3278283754436651c50a2e9c72912_2_0.png)\n\
    \n## 您的Linux专家团队……\n\n![](img/c7d3278283754436651c50a2e9c72912_2_1.png)\n\n**Rob\
    \ Zwetsloot** 修读航空航天工程，使用Python对复杂模拟进行建模。在设置了SuperPi（第50页）来研究完美橙子和茄子蛋糕的算法后，为了Ubuntu的生日（第16页），Rob让LJ4J8D服务器不堪重负。该集群无法停止下载食谱并拒绝关机。\n\
    \n![](img/c7d3278283754436651c50a2e9c72912_2_2.png)\n\n**Richard Smedley** 早在所见即所得（WYSIWYG）出现之前就开始使用计算机，并且至今仍坚持认为，命令行和Emacs是最高效的工作环境。Richard\
    \ 本月将继续他的开源初创企业专栏（第13页），并开始一个关于使用Puppet和Vagrant部署虚拟机的两部分指南（第26页）。\n\n![](img/c7d3278283754436651c50a2e9c72912_2_3.png)\n\
    \n**Nitish Tiwari** 职业是软件开发者，内心则是开源爱好者，他帮助企业建立和使用开源软件。本期，Nitish向我们展示如何使用OracleHRM管理员工（第34页），以及如何结合Jenkins和SonarQube进行持续的代码分析（第38页）。\n\
    \n![](img/c7d3278283754436651c50a2e9c72912_2_4.png)\n\n**Mihalis Tsoukalos** 是一位UNIX系统管理员，在编程、数据库和数学方面拥有专业知识。自1993年以来他一直在使用Linux。Mihalis向我们展示如何使用MRTG和SNMP显示Cisco路由器上的流量负载，以及如何配置Apache以查看来自网络的输出（第30页）。\n\
    \n![](img/c7d3278283754436651c50a2e9c72912_2_5.png)\n\n**Jon Masters** 是一位Linux内核黑客，从事Linux工作已有约18年，自他15岁首次上大学以来。Jon居住在马萨诸塞州剑桥市，并在一家大型企业Linux供应商处工作。本月您可以在第14-15页找到他精彩的内核专栏。\n\
