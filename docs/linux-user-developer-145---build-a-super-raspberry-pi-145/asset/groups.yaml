  mdcn: "\n\n## 教程\n\n![](img/c7d3278283754436651c50a2e9c72912_35_0.png)\n\n![](img/c7d3278283754436651c50a2e9c72912_35_1.png)\n\
    \n### 04 休假管理\n\n下一部分是休假部分。当你进入“休假”选项卡时，可以看到新的子部分：配额、报告、配置、休假列表和休假分配。要设置休假，你可以从“配置”选项卡开始。\n\
    \n在这里，你可以创建休假类型（如病假、事假等），列出年度节假日，并配置*带休假配额的有效期为一年*。完成配置后，你可以转到配额部分；这是向员工添加休假配额的地方。基于这些配额和相应的休假余额，员工随后可以申请休假。“休假列表”部分显示整个休假期间的休假数据。“分配休假”部分允许管理员在员工未申请的情况下授予休假。\n\
    \n### 05 时间录入 – 考勤\n\n考勤跟踪是一个非常敏感的问题，即使在记录打卡上下班时间时出现一个小错误，也可能造成大问题（至少会影响员工的声誉）。OrangeHRM\
    \ 提供了一种简便的方法来跟踪考勤。只需转到*时间*选项卡，你就能看到里面的考勤部分。在这里，你可以查看员工考勤记录，或配置诸如员工或主管是否可以修改考勤记录等选项。\n\
    \n请注意，如果你当前以管理员身份登录，要记录考勤，你应该以 ESS 用户身份登录系统。只需创建一个具有 ESS 角色的用户并登录即可。之后，只需转到*时间\
    \ > 考勤 > 打卡/签退*并点击“上班”。系统会自动记录日期和时间。页面刷新后显示“下班”选项。\n\n### 06 时间录入 – 工作时长表\n\n\
    虽然考勤用于跟踪实际在办公室花费的时间，但工作时长表通常跟踪在办公室内从事各项活动所花费的时间，这些数据用于预算目的。因此，在添加工作时长表之前，你需要添加客户及相应的项目。此外，每个项目还应添加相关的活动。要添加这些详细信息，请转到*时间\
    \ > 项目信息 > 客户*。添加客户后，使用客户下方链接的“项目”添加项目——也可以在同一页面中添加活动。现在你准备好添加工作时长表了。作为管理员，你只需转到*时间\
    \ > 工作时长表 > 员工工作时长表*即可添加或查看所有员工的工作时长表。此页面还显示已提交的工作时长表，这些表上有等待你方处理的操作。ESS 用户可以使用自己的登录名添加和编辑他们的工作时长表。\n\
    \n![](img/c7d3278283754436651c50a2e9c72912_35_2.png)\n\n### 07 绩效管理 – 雇主\n\n在本节中，我们将了解如何使用管理员界面设置绩效管理。OrangeHRM\
    \ 中的绩效管理基于 KPI，即关键绩效指标。对于组织中的每个职位，都需要创建相应的 KPI，以及最高和最低评分点。随后，每位员工都可以根据其职位的 KPI\
    \ 自动进行评估。要选择 KPI，请转到*绩效 > 添加 KPI*；你可以选择职位然后添加 KPI；最高和最低评分是可选的，但应添加以确保评分的统一性。你可以在\
    \ KPI 列表页面查看已添加的所有 KPI。添加 KPI 后，你需要转到“添加评估”页面，以启动对某位员工的评估流程。在下一节中，我们将查看员工看到的界面效果。\n\
    \n![](img/c7d3278283754436651c50a2e9c72912_36_2.png)\n\n![](img/c7d3278283754436651c50a2e9c72912_36_3.png)\n\
    \n面试结果，提供工作机会，最后是雇佣。在你雇佣候选人后，系统会自动为该候选人创建员工条目。不过，你需要手动为新员工创建登录账户。\n\n### 08 绩效管理\
    \ – 员工\n\n在管理员启动评估流程后，评估者和被评估者可以在“绩效 > 评估”链接下查看评估。只有评估者可以打开它以添加他们的评估。在评估者添加评估和评分并提交表单后，管理员需要批准该评估，然后才能向员工开放。一旦管理员批准了评估，将无法进行任何进一步更改——即使是由管理员操作。请注意，员工的评估者完全独立于组织层级，因此可以添加员工池中的任何人作为该员工的评估者。\n\
    \n### 09 招聘\n\nOrangeHRM 还允许你管理招聘流程。从发布空缺职位到处理求职申请、筛选和雇佣——你可以使用 OrangeHRM 完成所有这些步骤。让我们看看如何开始。点击“招聘\
    \ > 空缺职位”链接，这是你可以添加空缺职位的页面。创建空缺职位时，会生成一个网络链接和 RSS 源，这是公开可用的。此链接不仅包含完整的空缺职位详情，还允许候选人通过表单申请。随后，当有人申请时，候选人页面（位于空缺职位链接旁）会自动更新详细信息。然后你可以点击候选人姓名来管理申请。申请流程包括筛选、安排面试、面试结果、提供工作机会，最后是雇佣。在你雇佣候选人后，系统会自动为该候选人创建员工条目。不过，你需要手动为新员工创建登录账户。\n\
    \n### 10 报告\n\nOrangeHRM 的多个模块都有生成报告的选项。让我们仔细看看它们各自提供的功能。在 PIM 部分，“报告”选项卡允许你创建自定义报告，创建后可以保存并在以后使用。当你点击“报告”时，会出现“定义报告”页面。在这里，你可以创建与员工数据相关的报告，例如员工姓名、职级、职位、教育背景等。休假部分允许你生成与休假配额和休假使用相关的报告。这里没有自定义报告，只有一组固定的报告。时间部分也有自己的一组固定报告。项目报告显示所有员工在某个项目及其活动上花费的时间，而员工报告显示单个员工在不同项目和活动上花费的时间。前两者与工作时长表相关，而考勤摘要让你查看员工的考勤详情。\n\
    \n## 使用 Jenkins 和 SonarQube 进行持续代码分析 – 第 1 部分\n\n### 顾问\n\n**Nittish Tiwari**\
    \ 职业是软件开发者，内心则是一位开源爱好者。除了为领先的开源杂志撰稿外，他还帮助企业根据业务需求搭建和使用开源软件。\n\n### 了解如何自动运行 SonarQube\
    \ 代码分析（使用 Jenkins 持续集成服务器）\n\n### 资源\n\n- **SonarQube 稳定版和 SonarQube Runner**\n\
    \    - www.sonarqube.org/downloads\n- **Jenkins**\n    - www.jenkins-ci.org\n\
    - **Jenkins 插件**\n    - https://www.jenkins-ci.org/display/JENKINS/Plugins\n\n\
    在*Linux User & Developer* 第 139 期中，我们曾发布过一篇关于如何设置 SonarQube 来分析 Python 项目的教程。虽然\
    \ SonarQube 本身是一个出色的静态代码分析器，但你仍需要每次手动运行它才能获取结果。这是一个大问题，无论你的开发团队规模是大是小，因为通常没有人有空去做这件事。Jenkins\
    \ 就是解决方案。\n\n它是一个持续集成服务器，可以自动构建你的代码、执行测试、发送结果，此外还能做很多其他事情。Jenkins 也可以轻松配置，以触发\
    \ SonarQube 代码分析。我们在之前的教程结尾简要提到了结合 Jenkins 和 SonarQube 的主题，但在本教程中，我们将解释 Jenkins\
    \ 的安装及其基础知识，随后简要回顾 SonarQube。\n\n稍后，你将了解如何配置 Jenkins 与 SonarQube 插件以触发代码分析。最后，我们还将介绍一些重要的\
    \ Jenkins 插件，它们可以帮助你更高效地工作。在本教程的演示中，我们使用了最新版本的 Jenkins 1.579 和 SonarQube 3.7.4。\n\
    \n![](img/c7d3278283754436651c50a2e9c72912_37_0.png)\n\n"
