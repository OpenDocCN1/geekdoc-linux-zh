    ### 15 最后的话\n\nMRTG 配置简单，但不支持插件。另一方面，Cacti 是一个更强大、功能更丰富的工具，但为了充分发挥其潜力，您需要对其进行实验。Cacti\
    \ 将是即将发布的一篇文章的主题，届时您可以将其与 MRTG 进行比较，并决定哪一个更适合您的需求。\n\n我强烈建议学习 Cacti 和 MRTG 两者，以便能够根据工作任务选择合适的工具。\n\
    \n## 教程\n\n- OrangeHRM 的主要模块。点击其中任何一个将带您进入相应模块的着陆页\n- 选择主要模块之一后，子模块会出现在这个橙色菜单栏中\n\
    - 按姓名、ID 或其他详细信息搜索员工。搜索非常灵活，允许即使字段已填充也能进行搜索\n\n![](img/c7d3278283754436651c50a2e9c72912_33_0.png)\n\
    \n- 员工详情添加在此处。点击添加按钮会显示一个新表单，允许您输入新员工的详细信息\n- 系统中已存在的员工列表。点击姓名将显示该员工的信息\n\n# 使用\
    \ OrangeHRM 简化人力资源管理\n\n员工是任何组织最重要的部分，管理工具对于维持效率至关重要\n\n### 顾问\n\n**Nitish Tiwari**\
    \ 职业是软件开发者，内心是开源爱好者。除了为一家领先的开源杂志撰稿外，他还帮助企业设置和使用开源软件来满足其业务需求。\n\n![](img/c7d3278283754436651c50a2e9c72912_33_1.png)\n\
    \n### 资源\n\n- OrangeHRM: www.orangehrm.com\n\n对于任何组织，无论是拥有少量员工的小型企业，还是在全球拥有多个分支的大型跨国公司，管理人力资源始终是一项重要但困难的任务。之所以重要，是因为雇主需要跟踪关键指标并相应地制定策略，以保持员工的良好士气。之所以困难，是因为人力资源管理是一个多样化的领域，有很多东西需要管理；请假、绩效、记录工时、员工档案、薪资等等。虽然组织现在越来越意识到员工的需求，不遗余力地确保员工保持快乐，但寻找一款优秀的人力资源管理（HRM）工具有时证明是困难的部分。\n\
    \n在本教程中，我们将查看一个最著名且最受欢迎的开源人力资源管理工具 – OrangeHRM。自 2006 年首次发布测试版以来，它持续增长，目前被全球一百万用户使用。OrangeHRM\
    \ 支持人力资源管理的所有重要方面，并且部署和使用极其简单。鉴于安装、配置和使用的便利性 – 以及健壮性 – 它适用于所有类型的组织，从初创公司到跨国公司。在本教程中，我们使用的是稳定版本\
    \ 3.1.2。\n\n# 使用 OrangeHRM 简化人力资源管理\n\n使用开源管理工具保持公司的效率\n\n![](img/c7d3278283754436651c50a2e9c72912_34_0.png)\n\
    \n![](img/c7d3278283754436651c50a2e9c72912_34_1.png)\n\n### 01 安装\n\n对于 Linux（和\
    \ OS X），源代码可作为 ZIP 文件下载。下载后，只需解压并将内容放置在 Web 服务器的根文件夹中。不过您需要预先安装 Web 服务器和数据库 –\
    \ 例如 LAMP/LAMP/MAMP 服务器。如果还需要在 Windows 系统上设置 OrangeHRM，则提供捆绑的安装程序 – 包含 Web 服务器和数据库。一旦您下载并解压了所需的所有内容，通过\
    \ Web 浏览器访问该文件夹 – URL 应该类似于：http://localhost/orangehrm。如果一切正常，安装向导将欢迎您选择新安装 OrangeHRM\
    \ 或升级现有设置。如果您继续选择新安装，您需要提供数据库根访问权限（如果 OrangeHRM 的数据库未创建，则提供已为 OrangeHRM 创建的数据库详细信息）。然后您可以创建管理员用户\
    \ ID 和密码。最后，在安装完成之前有可选的注册。\n\n![](img/c7d3278283754436651c50a2e9c72912_34_2.png)\n\
    \n### 02 管理和配置\n\n当以管理员身份登录时，您可以看到对应于不同功能区域的多个选项卡。在“管理”选项卡下，有用户管理、工作、组织、资格、国籍和配置部分。您可以在“工作”部分下设置轮班时间。员工资格可以在“资格”部分下设置。配置允许您启用/禁用不同模块，使用\
    \ sendmail 或 SMTP 配置电子邮件，并订阅用户以接收电子邮件通知。虽然其他部分名称不言自明，但有一些重要的提示对您有用 – 用户管理对应于系统用户，因此您不能直接添加用户。您需要先添加员工（下一步会有更多介绍），然后他们就可以在“管理”选项卡下的用户管理部分作为系统用户添加。一个用户只能有两个角色：ESS（员工自助服务）和管理员。角色不应与职位头衔混淆；可以有多个职位头衔（可以在工作部分下创建）。\n\
    \n### 03 员工管理\n\nPIM，或称个人信息管理部分，是管理员工数据的地方。点击“添加员工”链接并填写相关详细信息。如果您选择“创建登录详细信息”，则也会为员工创建系统用户。否则，您可以通过“管理”选项卡下的用户管理选项将员工添加为系统用户。您可能认为员工详细信息的字段太少，无法捕获所有详细信息，但填写详细信息后点击“保存”，您可以看到员工详细信息页面的完整视图。此页面允许您查看和修改与员工相关的所有详细信息，如个人信息、联系方式、受抚养人、薪资、组织层级等等。您还可以在员工详细信息页面下添加自定义字段\
    \ – 只需转到 PIM 部分下的配置选项卡并点击“自定义字段”。还有一些可选字段可用。\n\n35 www.linuxuser.co.uk\n\n"
