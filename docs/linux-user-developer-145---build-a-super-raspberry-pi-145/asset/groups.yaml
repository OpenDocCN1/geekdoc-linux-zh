    maybe it doesn''t. I installed Ubuntu and my webcam just worked out of the box.
    I didn''t have to do anything and I thought this [has] got to be the way forward."


    # ## Development up until the first beta had been somewhat secret


    "To be honest it was still pretty much by developers, so the immediate coverage
    was quite low. I produced some famous German computer news magazines and [at]
