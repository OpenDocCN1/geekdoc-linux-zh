    \ Hello World 一遍又一遍。按两次 Esc 结束循环。\n\n## 08 创建变量\n\n在 BASIC 中创建变量很容易，与其他大多数语言类似：\n\
    \n```basic\nA = 5\n```\n\n使用 PRINT 'A' 来确认其已生效。你可以通过添加数字或其他预定义变量来修改其值，如下所示：\n\n\
    ```basic\nA = A + 5\nA = A + B\n```\n\n## 09 更复杂的内容\n\n自动增加变量的值很容易。让我们创建一个固定循环，当\
    \ A 从 1 增加到 5 时输出 A：\n\n```basic\nCLS\nA = 0\nFOR p = 1 to 5 CYCLE\n  A = A +\
    \ 1\n  PRINT A\nREPEAT\nEND\n```\n\n## 10 连接项目\n\nI/O 板提供许多额外的功能，非常适合学习物理编程。虽然你可以通过引脚直接连接到树莓派的\
    \ GPIO 端口，但你也可以使用自定义端口。FUZE 顶部的托盘非常适合插入面包板，所以现在请这样做。\n\n## 11 连接灯光\n\n从电子元件包中选择一个\
    \ LED 灯 – 任何颜色都可以 – 然后将短端插入顶部的两个引脚之一，长端插入中间部分。拿起一个 100Ω 电阻器（棕黑棕金）并将一端插入与 LED 长端位于同一垂直行的一个引脚中。\n\
    \n![](img/c7d3278283754436651c50a2e9c72912_47_1.png)\n\n## 12 连接光源\n\n将电阻器的另一端放在不同垂直列的引脚上，然后使用跳线将\
    \ GPIO 0 连接到该电阻器在垂直方向上的这一端。最后，将一根线连接到电源的 GND，并将其放在与 LED 短端相同的行上。\n\n## 13 简单操作\n\
    \n要激活灯光，使用 Esc 退出编辑器，并输入以下行让其知道将 GPIO 0 设置为输出：\n\n```basic\n>PinMode (0,1)\n```\n\
    \n要激活然后取消激活它，请使用：\n\n```basic\n>DigitalWrite (0,1)\n>DigitalWrite (0,0)\n```\n\
    \n## 14 灯光编码\n\n现在我们得到了一个工作的灯光，让我们创建一小段代码，让它反复开启和关闭：\n\n```basic\nCLS\nPinMode\
    \ (0,1)\nCYCLE\nDigitalWrite (0,1)\nWait (1)\nDigitalWrite (0,0)\nWait (1)\nREPEAT\n\
    END\n```\n\n## 15 更大的项目\n\n![](img/c7d3278283754436651c50a2e9c72912_48_0.png)\n\
    \n*下方的我们的交通路口设置将按顺序激活 LED 灯*\n\n让我们升级面包板上的灯光设置，将其变为一个交通路口设置。以添加原始 LED 灯的相同方式添加两个额外的灯，并将它们连接到\
    \ GPIO 引脚 2 和 3。通过将一个端连接到引脚 7，另一端连接到取自第二组电源引脚的新 3.3V 轨来连接一个按钮。该按钮将使灯光按顺序变“红”，然后在暂停后变回“绿”\
    \ – 完整的代码请参见 **图 01**。\n\n## 16 CLS\n\nCLS 命令清除当前显示屏。这有助于确保代码中的任何错误或打印输出都能显示出来，而不会可能与以前程序或运行的输出混淆。\n\
    \n## 17 使用 PinMode\n\nPinMode 变量上的数字处理 GPIO 端口（X）以及它是输出（1）还是输入（0）。因此，对于 GPIO X\
    \ 作为输出，其构建方式如下：\n\n```basic\nPinMode (X,1)\n```\n\nDigitalWrite 对输出引脚的构建方式类似，1\
    \ 表示开，0 表示关。\n\n## 18 IFTHE\n\n与其他编程语言不同，当你创建 IF 语句时，你需要确保加上 THEN，以让 BASIC 知道后续代码是针对\
    \ True（真）情况。\n\n## 19 digitalRead\n\n由于此代码中的引脚 7 被设置为输入，我们要读取它被激活时（即按钮被按下时）的状态。我们的按钮在被按下时闭合电路，因此读取值需要为\
    \ 1。\n\n## 20 ENDIF\n\n通过在 IF 语句末尾添加 ENDIF 让代码知道 IF 语句何时结束。与其他语言相比，这可以稍微更容易和清晰地确定\
    \ IF 的开始和结束位置。\n\n**图 01**\n\n```basic\nCLS\nPinMode (0,1)\nPinMode (1,1)\nPinMode\
    \ (2,1)\nPinMode (7,0)\nCYCLE\n  DigitalWrite (2,1)\n  IF digitalRead (7) = 1\
    \ THEN\n    Wait (1)\n    DigitalWrite (2,0)\n    DigitalWrite (1,1)\n    Wait\
    \ (1)\n    DigitalWrite (1,0)\n    DigitalWrite (0,1)\n    Wait (5)\n    DigitalWrite\
    \ (0,0)\n    DigitalWrite (1,0)\n    DigitalWrite (2,1)\n  ENDIF\nREPEAT\nEND\n\
    ```\n\n***\n\n# 程序员与创客必备指南\n\n# 实用树莓派\n\n## 目录\n\n- 58 发现一种新的乐器\n- 60 升级你的树莓派驱动\
    \ Bigtrac\n- 64 将你的树莓派变成示波器\n- 70 新的浏览器是什么？\n\n## 构建超级树莓派\n\n汇集多台树莓派的资源，创建你自己的可扩展树莓派超级计算机\n\
    \n树莓派实际上在价格上相当强大。然而，单靠它自己，你不会进行任何非凡的计算 – 或者进行任何高强度的编译。但是，由于它易于获取且相对便宜，你可以用买一台新计算机的价格买到二十台。它们单独使用没有区别，但通过网络连接在一起，它们可以共享其功率并大幅增加其处理能力。\n\
    \n这种设置通常被称为 Beowulf 集群，以史诗中同名英雄命名，Beowulf 被描述为拥有“手中有三十名男子握力”；实现它也不太难 – 你只需要大量的树莓派、一些\
    \ Python 知识以及使用它的理由。这使得它成为课堂、课后树莓派俱乐部等事情的不错项目 – 实际上，任何有可供一般使用的树莓派集合的地方都可以。\n\n\
    你添加到设置中的树莓派节点越多，它就越强大，这意味着你可以从家里的两或三台开始，然后如果你愿意，可以逐渐向集群中添加更多。并且由于它的工作方式，你还可以从你的主计算机连接并控制你的\
    \ SuperPi 集群，使其既易于访问又可扩展。\n\n在接下来的两页中，我们将向你展示如何设置树莓派以便使用，包括你需要的所有工具、如何连接它们以及最终你可以利用所有这些处理能力做什么。我们很想看到你完成后的\
    \ SuperPi – 给我们发一条推文吧！\n\nwww.linuxuser.co.uk\n\n"
