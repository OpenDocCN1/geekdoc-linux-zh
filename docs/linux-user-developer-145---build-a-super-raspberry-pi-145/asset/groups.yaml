  - '[PAGE 34]


    # Simplify HR management with OrangeHRM


    Maintain your company''s efficiency with the open source management tool


    ![](img/c7d3278283754436651c50a2e9c72912_34_0.png)


    ![](img/c7d3278283754436651c50a2e9c72912_34_1.png)


    # **01** Installation


    For Linux (and OS X) the source code is available for download as a ZIP file.
    Once you download it, just unzip and place the contents in the root folder of
    your webserver. You will need webserver and database preinstalled though – a LAMP/LAMP/MAMP
    server, for example. If you also need to set up OrangeHRM on a Windows system,
    a bundled installer is available – complete with web server and database. Once
    you''ve downloaded and unpacked everything that you need, access the folder via
    a web browser – the URL should be something like: http://localhost/orangehrm.
    If everything is fine, the set-up wizard welcomes you with an option to freshly
    install OrangeHRM or upgrade existing set up. As you proceed for fresh installation,
    you will need to provide the database root access (if the database for OrangeHRM
    is not created or just the details of database already created for OrangeHRM.
    You can then create the admin user ID and password. Finally, you have the optional
    registration before the installation finishes.


    ![](img/c7d3278283754436651c50a2e9c72912_34_2.png)


    # **02** Administration and configuration


    As you log in as an admin you can see several tabs corresponding to different
    functional areas. Under the Admin tab, you have the User Management, Job, Organisation,
    Qualifications, Nationalities and Configuration sections. You can set shift hours
    under the Job section. Employee qualifications can be set under Qualifications.
    Configuration lets you enable/disable different modules, configure email using
    sendmail or SMTP, and subscribe users to email notifications. While the other
    sections names are self-explanatory, there are few important tips you will find
    useful – User Management corresponds to the system users, and so you can''t directly
    add a user. You will need to add the employee first (more about that in the next
    step) and they can then be added as a system user under the User Management section.
    A user can have only two roles: ESS (employee self service) and admin. Roles are
    not to be confused with job titles; there can be several job titles (which can
    be created under the job section).


    # **03** Employee management


    The PIM, or Personal Information Management, section is the place where you can
    manage the employees'' data. Click on the Add Employee link and just fill the
    relevant details. If you select Create Login Details, a system user for the employee
    is created as well. Otherwise you can add employees as system users through the
    user management option under Admin tab. You may think that the fields for employee
    details are too few to capture all the details, but as you Click Save after filling
    the details, you can see the full view of the employee details page. This page
    lets you view and modify all the details related to an employee like personal
    details, contact info, dependents, salary, organisational hierarchy and much more.
    You can also add custom fields under employee details page – just go to the Configuration
    tab under the PIM section and click Custom Fields. There are a few option fields
    available as well.


