    # Now and into the future


    How the future and the face of Ubuntu is being shaped right now by Unity and mobile


    Right now, Ubuntu’s focus is split between the desktop and the upcoming Ubuntu
    phones, Richard Collins, Ubuntu mobile product manager, has been working on the
    touch OS since he joined Canonical three years ago:


    ““The idea always came up about what would be the impetus, how would it work,
    etccetera. It really came from Ubuntu for Android and when we used that product
    to talk to many mobile manufacturers and mobile operators. The relationships were
    there and it was a reasonably rational development to start


    thinking about how Ubuntu as a code base would effectively be unique, in the sense
    that it could truly operate as a single code base across different form factors.


    “It’s where the industry was going anyway because you have touch-based laptops
    and big screens, so the evolution had already started to take place – it just
    required a strategic push to say ‘Right, we’re going to be doing the phone as
    a fully-fledged serious commercial product.’”


    Not forgetting the community, Canonical got them very involved in development
    early on.


    “One of the things we wanted to do was get the community involved with the phone,
    so it wasn’t just us producing the phone and putting it out there. We wanted to
    get people involved. So we started this core apps project, and core apps are the
    typical applications you need on a phone like a clock or calendar. Then we’ve
    got some slightly more esoteric things that you might think are a bit out of place
    on a phone, like a terminal and a file manager. We have a weather app and a few
    others as well. All of those apps are developed by people in the community.


    ![](img/c7d3278283754436651c50a2e9c72912_21_0.png)


    ![](img/c7d3278283754436651c50a2e9c72912_21_0.png)


    **Ubuntu timeline**


    2 January 2013


    **Ubuntu Touch**


    At a 2013 press unveiling, Mark Shuttleworth revealed the new Ubuntu mobile OS.
    The Unity interface had been scaled down to work on touchscreens and showed signs
    of the unified environment originally promised.


    **17 April 2014**


    **The current LTS**


    14.04 is Canonical’s most recent Long Term Support version of Ubuntu with five
    years of support, which appeals to enterprise for both desktops and server. It’s
    a very stable release, focusing on bug fixing and not new features.'
