    \ Fedora. Is it the best choice?\n\nThere was a spin of Fedora for the Raspberry\
    \ Pi during the early days of Pi release, but that was quickly dropped in favour\
    \ of Raspbian when it proved to be a bit slow and buggy. It was almost two years\
    \ after this incident that a proper version of Fedora was released on the Raspberry\
    \ Pi in the form of Pidora. An almost straight-up port of the codebase to the\
    \ specific ARM architecture of the Pi, Pidora has had a few tweaks to let it run\
    \ on Pi hardware without much loss in performance, at least.\n\nThe very first\
    \ thing to note is that the problems of Fedora on the Pi in the past are long\
    \ gone. This is a very mature operating system that is stable and generally runs\
    \ well on the Raspberry Pi. In terms of speed, it’s not as fast as Raspbian or\
    \ Arch Linux and in the case of Raspbian this may be due to a number of factors.\
    \ Pidora uses Xfce, for one, which is known to be a little heavier than the LXDE\
    \ that Raspbian uses. Fedora also uses much newer software that is somewhat designed\
    \ to be run on computers which are slightly more high-end, while Raspbian is based\
    \ on an older version of Debian with more lenient software. It was the biggest\
    \ difference but it all adds up with the other problems.\n\nBooting from NOOBS\
    \ is painfully slow and prone to errors – something that doesn’t occur with Raspbian\
    \ or the other distros on NOOBS. Installing straight from the image removes this\
    \ problem but, unfortunately, Pidora has one other disadvantage over Raspbian:\
    \ lack of software.\n\n![](img/c7d3278283754436651c50a2e9c72912_73_0.png)\n\n\
