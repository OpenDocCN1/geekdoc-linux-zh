    ```


    你将在终端上看到 `bootstrap.sh` 中命令的输出：预计会有一些警告消息，但请检查是否有意外情况。


    现在，尝试修改你的 `bootstrap.sh` 文件以及尝试不同的发行版镜像。下个月我们将展示随着需求变得更加复杂，Puppet 如何保持系统可维护性。


    # 教程


    这是 MRTG 网站，你可以在此找到有关 MRTG 的新闻以及最新版本。


    ![](img/c7d3278283754436651c50a2e9c72912_29_0.png)


    ![](img/c7d3278283754436651c50a2e9c72912_29_1.png)


    MRTG 对每个网络接口的输出都类似于以下内容。


    SNMP 服务器使用各种 SNMP 命令来查询网络设备。


    ![](img/c7d3278283754436651c50a2e9c72912_29_2.png)


    ![](img/c7d3278283754436651c50a2e9c72912_29_3.png)


    MRTG 拥有一个基于配置文件创建索引页的工具。你可以点击每个图像以查看更多信息。


    ## 使用 MRTG 监控 Cisco 路由器


    在 Cisco IOS 上配置好 SNMP 后，使用 MRTG 及其工具来监控路由器流量。


    MRTG (Multi Router Traffic Grapher) 是由 Tobi Oetiker 用 Perl 编写的一个绘制自由数值数据 的工具。MRTG
    以 HTML 格式生成其输出，并提供网络设备流量负载的实时视觉表示。MRTG 是每位系统和网络管理员必不可少的工具，可与任何支持 SNMP 的设备配合使用。通过查看
    MRTG 的输出，你可以快速检查接口的流量并据此做出有价值的决策。本期我们将向你展示如何借助 SNMP（简单网络管理协议）的些许帮助，使用 MRTG 显示
    Cisco 877W 路由器的日常、每周、每月和每年的 ADSL 流量。你需要访问并配置你的 Cisco 路由器，并允许运行 MRTG 的 Linux 机器访问它。


    ## 顾问


    ![](img/c7d3278283754436651c50a2e9c72912_29_4.png)


    Mihalis Tsoukalos 是一位 UNIX 管理员、程序员（UNIX 和 DOS）、DSA 和数学家。他自 1993 年起使用 Linux。你可以在
    Twitter @mcastousk 和 www.mtsoukalos.eu 上联系到他。


    ## 资源


    - MRTG oss.oetiker.ch/mrtg

    - Cisco Mibs cisco.com/public/sw-center/netmgmt/smib/mibs.shtml

    - SNMP RFCs bit.ly/CaQ7O

    - Cacti cacti.net

    - RRDtool oss.oetiker.ch/rrdtool


    # 使用 MRTG 监控 Cisco 路由器


    开始使用 MRTG 及其工具来监控流量负载。


    ![](img/c7d3278283754436651c50a2e9c72912_30_0.png)


    ![](img/c7d3278283754436651c50a2e9c72912_30_1.png)


    ## 01 安装 MRTG


    大多数 Linux 发行版都有现成的 MRTG 软件包可供安装使用。MRTG 是一个 Perl 脚本，因此如果你想修改某些内容，可以轻松地对其进行更改。


    如果你打算以 Apache 用户的身份运行 MRTG（这是推荐的），你需要首先以 root 身份执行以下操作，假设 Apache 进程的所有者是 www-data
    用户（根据你的 Linux 系统调整命令）：


    ```bash

    $ chown www-data:root /var/lock/mrtg

    ```


    ![](img/c7d3278283754436651c50a2e9c72912_30_2.png)


    ## 02 关于 SNMP


    SNMP 是一种众所周知的 TCP/IP 协议，适用于大多数“智能”设备，包括 Linux 和其他 UNIX 机器、路由器、网络交换机、Windows 机器以及许多其他设备。


    它提供关于网络接口状态、传入和传出流量、丢弃的数据报和错误消息的统计数据，并允许客户端轻松且远程地访问这些统计数据。


    ![](img/c7d3278283754436651c50a2e9c72912_30_3.png)


    ## 03 有用的 SNMP 命令


    SNMP 附带许多命令，包括 `snmpbulkget`、`snmpd`、`snmptrap`、`snmpbulkwalk`、`snmpget`、`snmpstatus`
    和 `snmpwalk`。其中最有用的是 `snmpwalk` 命令，它使用 SNMP GETNEXT 请求获取值子树。


    如果团体字符串名称错误或者设备当前不支持 SNMP，`snmpwalk` 命令的输出将类似于以下内容：


    ```bash

    $ snmpwalk -v 1 -c LUD cwfi

    Timeout: No Response from cwfi

    ```


    ## 04 配置 MRTG


    配置 MRTG 可能是整个过程中最困难的部分 - 特别是当你处理非标准网络设备时，因为你可能会难以找到要查询的正确对象标识符。Cisco 路由器是很流行的设备，因此在
    Cisco 网络设备上设置 SNMP 是一个众所周知的过程，但找到正确的对象标识符总是很棘手。


    ![](img/c7d3278283754436651c50a2e9c72912_30_4.png)


    ## 05 Cisco IOS


    在 Cisco 877W ADSL 路由器上要做的第一件事是开启 SNMP 并创建一个 SNMP 团体字符串，这将帮助你获取所需信息。Cisco IOS 有很多晦涩的命令，所以请仔细输入。


    RO（只读）团体字符串（LUD）仅允许 Get 请求，而 RW（读写）团体字符串 - 这里不需要 - 允许 Get 和 Set 请求。


    以下命令会产生许多行输出，用于验证名为 Cisco 的路由器上的 SNMP 设置是否正常工作：


    ```bash

    $ snmpwalk -v 1 -c LUD cisco

    ```


    ![](img/c7d3278283754436651c50a2e9c72912_30_5.png)


    ## 06 配置 Apache


    你应该设置 Apache，以便你不仅可以本地看到 MRTG 的静态 HTML 输出，还可以从你的网络或互联网上看到。你可以通过使用子域名来实现这一点。这里将使用
    mrtg.mtsoukaloos.eu 作为子域名 - 你的可能会不同 - 这需要添加一个新的 DNS 条目。配置 Apache 后，别忘了启用新站点并让
    Apache 使用新配置：


    ```bash

    # a2ensite mrtg.mtsoukaloos.eu

    # /etc/init.d/apache2 reload

    ```


    ![](img/c7d3278283754436651c50a2e9c72912_30_6.png)


    ## 07 MRTG 文件和目录


    你应该仔细考虑的一件事是，MRTG 存放文件的目录必须具有必要的 UNIX 权限，以便运行 MRTG Cron 任务的用户能够读写。


    MRTG 存放文件的目录结构非常简单：它只有一个目录，里面有对应于受支持接口和设备的众多文件。


    ## 08 cfgmaker 工具


    `cfgmaker` MRTG 工具用于轻松创建配置文件。它可能会添加一些你稍后需要清理的无用数据，但它所创建的是一个很好的起点。通常你按如下方式运行它：


    ```bash

    # cfgmaker --global "WorkDir=/srv/www/mrtg.mtsoukalos.eu/public_html" LUD:2.86.5.103
    > mrtg.cfg

    ```


    此命令在当前工作目录中创建 `mrtg.cfg`，使用 `/srv/www/mrtg.mtsoukalos.eu/public_html` 目录来写入输出，并使用
    "LUD" 团体字符串查询 IP 地址为 2.86.5.103 的机器。


    由 `cfgmaker` 自动生成的 `mrtg.cfg` 文件非常繁杂，因此你将不得不花些时间清理它，只保留真正让你感兴趣的接口。


    ## 09 indexmaker 工具


    在使用 `cfgmaker` 生成 MRTG 配置文件后，你应该创建一个索引 HTML 页面，以便你可以访问 MRTG 的输出。这项任务可以使用随 mrtg
    软件包提供的 `indexmaker` 工具来完成，如下所示：


    ```bash

    $ indexmaker mrtg.cfg > index.html

    ```


    现在，你可以将浏览器指向 Apache 中定义的正确 URL 或本地文件（取决于你把 MRTG 的 `index.html` 文件放在哪里），以查看 MRTG
    的信息。由于图像文件尚未创建，因此输出将看起来不太美观。


    ![](img/c7d3278283754436651c50a2e9c72912_31_1.png)


    ## 10 运行 MRTG


    运行 MRTG 有两种方式：手动或作为 Cron 任务。第一种方式适用于测试和调试目的。第二种方式是运行 MRTG 的首选方式。最好以拥有 Apache 进程的用户身份运行
    MRTG Cron 任务。以下命令将揭示该用户：


    ```bash

    $ ps aux | grep -i apache

    ```


    第一次运行时，你会看到许多错误和警告消息，这是因为所有输出和数据文件都缺失，MRTG 不得不创建它们。如果一切正常，你的下一个任务将是设置 MRTG 作为
    Cron 任务运行。


    在 Debian 7 系统上，MRTG 可执行文件需要以 root 身份运行，因为当环境变量 LANG 设置为 UTF-8 时，MRTG 很可能无法正常工作：


    ```bash

    # env LANG=C mrtg ../mrtg.cfg

    ```


    ![](img/c7d3278283754436651c50a2e9c72912_31_2.png)


    ## 11 配置 Cron


    为 www-data 用户设置 Cron 需要以 root 身份运行以下命令：


    ```bash

    # crontab -u www-data -e

    ```


    Cron 是一个可靠的服务，因此一旦你看到 MRTG 作为 Cron 任务运行正常，你就不必担心其他问题了。MRTG 在你运行 `cfgmaker` 工具时定义的目录中生成其
    HTML 和图像文件。


    ![](img/c7d3278283754436651c50a2e9c72912_31_3.png)


    ## 12 仔细查看配置文件


    对于所用设备而言，感兴趣的 Cisco SNMP OID（对象标识符）是 1.3.6.1.2.1.2.2.10.10.10.14，它返回 ADSL 连接的传入流量，


    32

    www.linuxuser.co.uk


    ## 提示


    ### 如果可能，请使用内部接口


    每个 ADSL 路由器都有两个 IP 地址：一个用于内部网络，一个用于外部。当可能时，使用内部网络的 IP 来查询你的设备，因为它更安全且速度更快。


    ### 不要关闭路由器


    如果网络设备被关闭或不可达，MRTG 将使用上一个值，直到它能获取新值，因此你会在输出中看到直线。


    ### 安全


    观察 MRTG 的输出可以告诉你关于你网络的许多事情，所以将其养成习惯来观察。在周末看到过多流量或有奇怪的峰值是一个安全警告，需要进一步调查。


    ### 日志文件包含数据


    MRTG 将其 SNMP 数据存放的文件命名为 `.log` 扩展名。例如，对于 cwilf 设备，日志文件名为 `cwilf.log`。


    ### 测试最大速度


    测试 ADSL 路由器的最大速度被认为是一种良好的实践，方法是下载一个大文件并观察 MRTG 的输出。


    ![](img/c7d3278283754436651c50a2e9c72912_31_0.png)


    '
