    \ packages available for Raspbian just aren’t in the repository. The essentials\
    \ are there and there are plenty of programming choices, but combine this with\
    \ a lack of official Pi accessory support and it becomes less attractive for project\
    \ work.\n\nIt’s definitely not a bad distro, though. If it had ended up being\
    \ the default when the Pi launched then we’d likely be saying similar things about\
    \ Raspbian. However, there’s very little reason to use it over its Raspbian counterpart.\n\
