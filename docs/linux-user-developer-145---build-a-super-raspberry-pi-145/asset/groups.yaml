    # Feature


    # The early years


    The meteoric rise of Ubuntu in the late Noughties caused a small revolution in
    the Linux desktop space


    During the next couple of years a few things began to happen. Kubuntu 5.04 was
    released during the next cycle and is still being released today as one of the
    major Ubuntu spins. More features were being added by the release and, slowly
    but surely, Ubuntu was gaining popularity.

    “It’s a bit hard to say as it’s always been an exponential growth,” Martin tells
    us when we ask him which release really gave Ubuntu a foothold in the desktop
    Linux market. “But if I have to pick one it would be our first LTS, 6.06 Dapper
    Drake. That was explicitly announced for Long Term Support and we’d made particular
    efforts in stabilising it. It was also the first version with a graphical installer
    and thus made it a lot easier to do.”


    ![](img/c7d3278283754436651c50a2e9c72912_19_0.png)


    Above The first version of Unity was quite different to how it looks today


    Version 6.06 is so far the only Ubuntu to be released outside of the months of
    April and October, gaining the .06 suffix after it was released on 1 June after
    a delay of almost two months. Support lasted for three years on desktop and five
    years on server, a practice that has since been stopped on LTS releases with both
    desktop and server versions now getting five years of support.

    With the popularity came a fledgling community of users and developers. Alan has
    been part of this community from the start, answering people’s problems on Launchpad
    during the free time he had with his jobs, and describes to us the evolution of
    the community.

    “Back at the beginning, the active contributors were people who were bootstrapping
    things like getting IRC channels and mailing lists set up. This was all done by
    people with specific expertise, such as people who sat on IRC all day creating
    the Ubuntu IRC channels. You had people who were familiar with Mailing lists and
    they were setting up mailing lists, and people who knew about forum software would
    set up a forum. In the early days it was somewhat unstructured – but that was
    great, because we needed all of those things and it was very much a self-motivating,
    self-driving thing.


    ![](img/c7d3278283754436651c50a2e9c72912_19_1.png)


    Above Xubuntu started to appear as one of the early lightweight spins in 2006


    > “Once we got over that hump of creating the initial infrastructure, more people
    were able to contribute”


    Someone decided ‘we should have a forum’ and they created one, and it became insanely
    popular, so once we got over that hump of creating this initial infrastructure
    and bits and pieces to get the project started, more people were able to contribute.
    It was then that contributions from the community started to take the more typical
    approach of doing translations, bug reporting, triage, submitting patches and
    producing documentation. That’s the bread and butter contributions people do.”

    The community has continued to grow and has now become a very important part of
    Canonical, as Jane told us:

    “The open source community and nature of Ubuntu, and cooperation between community
    and company, was one of the things I thought was just really unique and interesting
    about Canonical. I continue to think that’s one of the places we’ve done really
    special work and continue to lead the field.”


    # Ubuntu timeline


    ![](img/c7d3278283754436651c50a2e9c72912_19_2.png)


    **13 May 2009**


    ### Ubuntu One launched


    The cloud storage service was one of the first of its kind, originally named as
    it gave you access to 1GB of storage and was free for all Ubuntu users. It soon
    found its way into the desktop as an integrated service.


    **1 March 2010**


    ### Change of leadership


    Mark Shuttleworth stepped down as CEO of Canonical, so he could get closer to
    the development team at Canonical. Taking his place was Jane Silber, then the
    COO and still currently the CEO of Canonical.'
