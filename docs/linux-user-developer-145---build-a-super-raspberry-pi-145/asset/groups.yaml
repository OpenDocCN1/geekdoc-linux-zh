    \nAll the icon boxes showed a red cross. I selected icons for each one from my\
    \ Pictures folder and clicked on Apply. I closed the preferences form and rebooted\
    \ but when I went back into the icons tab of the preferences form, the change\
    \ I had made hadn’t been applied. I tried this several times, always with the\
    \ same result. I tried changing preferences in other tabs and the same thing happened.\n\
    \nThe Apply button on the preferences form appears not to be working. I went to\
    \ package manager and reinstalled MintUpdate but that didn’t fix it so then I\
    \ removed MintUpdate completely, rebooted, reinstalled MintUpdate and rebooted\
    \ again. None of it worked. For some reason I am unable to change the Preferences\
    \ in MintUpdate. Do you know of any solution?\n\nMark\n\n> This could be a number\
    \ of things really but it sounds like you’re mainly having graphical issues with\
    \ the Updater rather than anything else being the culprit though.\n\n### FAQ:\
    \ Music matters\n\n**Q: What audio file types are open source?**\nA: There are\
    \ a few but the biggest ones are Vorbis and FLAC. Vorbis is usually associated\
    \ with OGG files which are similar to MP3s, and FLAC is a lossless codec for the\
    \ highest quality sound.\n\n**Q: Is it legal to play MP3s on Linux?**\nA: It’s\
    \ a grey area and applies to other proprietary codecs as well. One of the most\
    \ popular ways to decode audio is via Ffmpeg, which doesn’t store the content\
    \ of the file when playing it – this means it does not fall foul of some versions\
    \ of software patents. So far nobody has gone after it.\n\n**Q: Why aren’t open\
    \ codecs more popular?**\nA: Some of them are, especially in the video space.\
    \ There’s a five- or ten-year cycle with containers, codecs and file types it\
    \ seems. It was MP3s 15 years ago, then AVIs and now MP4s. But MP3s may never\
    \ be toppled with the advent of streaming services.\n\n![](img/c7d3278283754436651c50a2e9c72912_87_0.png)\n\
    \n### Questions & answers\n\nAll your technical problems solved\n\n![](img/c7d3278283754436651c50a2e9c72912_88_0.png)\n\
    \n**Plasma 5 is still not quite stable so this could easily be the issue.** Try\
    \ out MintUpdate on the different desktops, especially Cinnamon or MATE if you\
    \ still have them installed as they are the flagship distros for Linux Mint and\
    \ the updater will work best on them. Also make sure you can actually do an update.\
    \ Open up the terminal and do the following simple commands:\n\n```\n$ sudo apt-get\
    \ update\n$ sudo apt-get upgrade\n```\n\nThese will upgrade your packages if everything\
    \ is still working so at least you'll be able to do that. Otherwise you might\
    \ need to run the update manager as root/sudo for the changes to stick, or you\
    \ could always just try to create a new user in case your home folder is corrupted\
    \ in some way.\n\nUpdate Manager is also getting updates right now as well, so\
    \ a future update for it may fix these issues. Hopefully one of these methods\
    \ or waiting it out works.\n\n### How to burn an ISO\n\nI'm very new to Linux\
    \ and I have been trying to put a Linux ISO onto a disc but I've been having trouble.\
    \ I've downloaded a number of ISOs, dragged them onto my disc and burnt it, but\
