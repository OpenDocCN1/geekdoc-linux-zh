    the developers and the users who are the reason for its success. Companies are
    not always ethical; after all, their primary objective is to maximise the shareholders’
    investment return. Open source is only attractive if it extends profit opportunities.
    Companies collaborate when they pay, but are often ruthless and sometimes short-sighted
    when quantifying the returns from free software. But there are honourable exceptions
    to this role: Red Hat, for one, has had to stay true to its principles. The company
    has been recognising that its success as an open source company lies in encouraging
    the developers’ initiative and freedom. Red Hat ensures separation between the
    developer process and the final product by taking snapshots of the community project,
    testing and redefining the snapshot for release as a commercial product, and then
    adding and feeding back refinements rather than exerting control over the developer
