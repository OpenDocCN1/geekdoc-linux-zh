    \ 镜像非常简单：\n\n```\nvagrant init ubuntu/trusty64\nvagrant up\n```\n……这会从 VagrantCloud\
    \ 下载 Ubuntu 14.04 64 位镜像并启动运行。默认情况下，镜像会保存在 ~/.vagrant.d/machines/ 目录中供后续使用，但你也可以在\
    \ VirtualBox 设置中更改此路径。\n\n在大多数最新的发行版上，一切应该都能正常运行，但错误并非罕见，因此我们要快速看看最常见的问题。\n\n\
    # 教程\n\n## 06 哎呀！\n\n遇到问题？安装时容易忽略正确的内核头文件。检查 `/proc/version`（或运行 `uname -a`）以确定你正在运行的是哪个内核。以下命令的错误信息可能有助于解决问题：\n\
    \n```\nVBoxManage --version\n```\n... 。在一台 Debian 机器上，我们不得不重新编译 `virtualbox-kmods`。在一台\
    \ Fedora 测试机上，我们不得不安装对应内核版本的 `kmod-VirtualBox` 软件包，然后运行：\n\n```\nsudo systemctl\
    \ restart systemd-modules-load.service\n```\n... 这就修复了问题。你可能会发现重启机器是修复问题所必需的。\n\
    \n![](img/c7d3278283754436651c50a2e9c72912_27_0.png)\n\n## 07 Vagrantfile\n\n\
    当你运行 `vagrant init` 时，系统会提示你：\n\n一个 `Vagrantfile` 已放置在该目录中。你现在准备好运行第一个虚拟环境了！请阅读\
    \ `Vagrantfile` 中的注释以及 `vagrantup.com` 上的文档，以获取更多有关如何使用 Vagrant 的信息。\n\n`Vagrantfile`\
    \ 是进行所有配置的地方。最初，除了 `config.vm.box` 的值为 `ubuntu/trusty32`（或你在 `vagrant init` 时设置的任何值）外，其他所有内容都被注释掉了。\n\
    \n你可以在不提供值的情况下运行 `vagrant init`，并使用 `vagrant box add` 命令稍后下载你想要的镜像。例如：\n\n## 08\
    \ 端口转发\n\n![](img/c7d3278283754436651c50a2e9c72912_27_1.png)\n\n> 基础镜像在使用时保持不变，因此可以在多个项目之间共享\n\
    \n```\nvagrant box add outornth/debian-7.4RubyOnRailsDev\n```\n……然后将其添加到 `Vagrantfile`\
    \ 中的 `config.vm.box` 指令中。请注意，下载的基镜像在使用时保持不变，因此可以在多个项目之间共享 – 每个项目都会在运行 `vagrant\
    \ init` 的本地目录中拥有自己的 `Vagrantfile`。\n\n无论你运行的是哪个镜像，设置网络都是必需的 – 你肯定不希望网站只能从本地机器访问！\n\
    \n在 `Vagrantfile` 中，你可以设置一个与你的 VM 和主机设置相匹配的桥接网络，但最简单的网络方式是主机端口转发。你的虚拟镜像上的一个端口（例如\
    \ 80）被转发到主机机器上的一个未使用端口，从而可以从那里访问：\n\n```\nconfig.vm.network \"forwarded_port\"\
    , guest: 80, host: 8082\n```\n\n这进而可以再被转发 – 例如，从主机机器上的 Apache – 和/或在那里匹配到你想要的\
    \ URL。\n\n![](img/c7d3278283754436651c50a2e9c72912_27_2.png)\n\n## 09 Shell\n\n\
    对 `Vagrantfile` 的修改可以通过 `vagrant reload` 命令应用到正在运行的服务器上。虽然许多配置可以在你的运行中的服务器外部完成，但\
    \ `vagrant ssh` 提供了进入虚拟镜像内部 shell 的重要访问权限。如上图截图所示，Tiny Core 非常适合快速测试 VBox，而相比之下则不如使用\
    \ Ubuntu。\n\n别忘了在运行更多 vagrant 命令之前退出 ssh 会话。`Vagrant suspend` 使镜像在几秒钟后通过另一个 `vagrant\
    \ up` 命令即可恢复就绪状态。`Vagrant destroy` 会删除虚拟机器，但 `Vagrantfile` 允许你重新配置一个完全相同的机器。\n\
    \n"
