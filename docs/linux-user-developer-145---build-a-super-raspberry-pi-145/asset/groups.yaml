    # # HummingBoard-i2eX


    Can Carrier–One dethrone the bestselling Pi single-board computer?




    # ## Technical specs


    | Operating System | Android KitKat 4.4 (Debian, GeeXBox, Ubuntu also available)
    |

    | Processor | Freescale i.MX6 Dual 1 GHz ARMv7 (as computer-on-module) |

    | Memory | 1GB DDR3 RAM (as computer-on-module) |

    | Dimensions | 66.6mm x 93.1mm x 23mm including connectors |

    | Weight | 71g excluding cables |

    | Storage | None on-board, maximum 128GB via micro SD Card plus mSATA support
    |

    | Ports | 2x USB 2.0, gigabit Ethernet, HDMI, co-axial audio/PDIF digital out,
    3.5mm analogue audio out, MPII CSI-2, LVDS, mini-PCI Express, mSATA |

    | Extras | 26-pin GPIO header, 8-in FlexCAN header, infrared receiver |

    | Price | £89 |


    ![](img/c7d3278283754436651c50a2e9c72912_80_0.png)


    **Left** The HummingBoard has a computer-on-module plus carrier board design


    # ### Also consider


    ![](img/c7d3278283754436651c50a2e9c72912_80_1.png)


    **CuBox-i4Pro**

    *£124*

    If you don''t need Raspberry Pi-style GPIO capabilities and have a little room
    in your budget, the CuBox-i4Pro boasts full software compatibility with the HummingBoard
    but with a more powerful quad-core processor and 2GB of RAM. Packed into a tiny
    cube, additional extras include optical audio output, eSATA and integrated Wi-Fi
    and Bluetooth radios.


    ![](img/c7d3278283754436651c50a2e9c72912_80_2.png)


    > The presence of a heatsink seems odd: rival boards do with no cooling at all


    across all three available models of HummingBoard. This opens the door to the
    HummingBoard''s real selling point: the potential. Should SolidRun choose to exploit
    it, the user can cheaply upgrade to a next-generation processor release simply
    by retaining their carrier board and replacing the CoM. If SolidRun travels that
    route, it will be a feather in its cap; if not, it''s a wasted opportunity to
    bring some of the flexibility of traditional PC architecture to the hobbyist embedded
    space.


    This upgradability would tie in well with the eX carrier board''s mSATA and mPCIe
    ports, unique at this end of the market. The mSATA connectivity allows for a compact
    yet high-capacity solid-state drive (SSD) to be fitted to the underside of the
    board. The mPCIe slot meanwhile allows for a myriad of high-speed add-on hardware,
    including wireless radio modules, providing drivers compiled for ARMv7 are available.
    The HummingBoard-i2eX was tested with two operating systems: Android KitKat 4.4
    and Debian Jessie. The former was responsive and pleasing, with full access to
    the Google Play application store, but the latter really does unlock the HummingBoard''s
    true potential.


    A SysBench 95th percentile time of 22.94ms demonstrates the HummingBoard''s capabilities,
    blazing past the Raspberry Pi''s sedate 51.45ms and the 29.72ms of its AllWinner
    A20-based rival, the Banana Pi. The multitithreading results are even more impressive,
    with 1.296s and 0.136s compress and decompress times for a 10MB test file, compared
    to 8.64s and 3.08s on the Raspberry Pi. But there is still a bottleneck present
    in the design: raw network throughput was limited to 371MB/s as measured on a
    gigabit network – below even the 470MB/s it SolidRun warns customers of in the
    manual.


    *Gareth Halfacree*


    # Summary


    The HummingBoard is an undeniably impressive design and its computer-on-module
    layout suggests that upgrades will be possible in the future. The processor is
    fast, the mPCIe and mSATA ports useful, and the GPIO header familiar to anyone
    who has used the Raspberry Pi. The large heatsink makes the HummingBoard bulkier
    than its competitors, however, while also preventing easy use of add-on boards.


    ![](img/c7d3278283754436651c50a2e9c72912_80_3.png)


    **Raspberry Pi Model B+**

    *£27.44*

    The latest revision of the classic Raspberry Pi design, the single-core ARMv6
    processor can''t hold a candle to the Banana Pi despite the similar price. Its
    software ecosystem, however, is immeasurably more mature, while add-ons from pickybird
    boards to perfectly-fitting cases are easy to come by.

    raspberrypi.org


    ![](img/c7d3278283754436651c50a2e9c72912_80_4.png)


    **More information**


    www.bananaPi.org'
