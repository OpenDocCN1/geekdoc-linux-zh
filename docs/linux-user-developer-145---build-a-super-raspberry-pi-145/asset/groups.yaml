    ## Raspbian


    The primary distro for the Pi gets a lot of love from the Raspberry Pi Foundation


    There''s no secret as to why Raspbian is the recommended Raspberry Pi distro:
    it''s obviously an easy-to-use distro that can be set up relatively quickly. Thanks
    to the support of the Raspberry Pi Foundation, it gets a lot more development
    and attention from the community than any other distro for the Raspberry Pi.


    ![](img/c7d3278283754436651c50a2e9c72912_76_0.png)


    The Debian base of the distro is in no small part responsible for this. It''s
    easy to maintain, and if you ever need to delve into the terminal, then the commands
    are simple and quick enough to use. There are also plenty of software choices
    through the repositories, which include the majority of the apps you''d use on
    your main computer; whether or not they''re usable on the limited resources of
    the Pi is another matter.


    The major advantage of Raspbian over the other distros is the selection of educational
    and teaching material included on the distro. From simple software such as Scratch
    and Sonic Pi that teach coding fundamentals through to a full-on OCR computing
    course, there are a lot of apps on here that you don''t get anywhere else. It
    also supports all the recommended overclocking limits, the Raspberry Pi camera
    and any future official hardware add-ons as well.


    A benefit of using Raspbian is that a lot of tutorials, projects and third-party
    hardware run off or are based on it as a standard. It makes it easier to learn
    coding if that''s your goal, or even to replicate these projects if you''re not
    particularly confident in your skills.


    ![](img/c7d3278283754436651c50a2e9c72912_76_1.png)


    Otherwise the distro is quite fast and light. The browser was recently updated
    to a custom piece of Epiphany-based software that is noticeably faster than the
    previous Midori effort (see page 84). Raspbian''s other custom pieces of software
    are great at improving its performance but are unique to Raspbian, such as the
    command line OXMP player for playing video and audio.


    It is essentially the default Linux distribution and this status has given Raspbian
    a lot of advantages over everything else while still being as flexible as Linux
    can be.


    > “There are also plenty of software choices through the repositories”


    ### SCORES


    - **Updates**: Raspbian is kept up to date well with the latest Pi software and
    firmware updates — 9

    - **Usability**: Definitely the easiest Raspberry Pi distro to use, although it
    does have to use quite simple software — 8

    - **Educational tools**: There''s an entire curriculum on Raspbian and a lot of
    software to learn with — 10

    - **Flexibility**: It''s not as light as something like Arch but it can still
    be used in a wide variety of applications — 6

    - **Overall**: It''s an excellent distro which is designed around all the Raspberry
    Pi''s strengths — 9


    ## Raspberry Pi Operating Systems 2014


    ### In brief: Compare and contrast our verdicts


    | | Pidora 2014 | RISC OS Pi | Arch Linux ARM | Raspbian |

    | :--- | :--- | :--- | :--- | :--- |

    | **Updates** | Currently fully up to date, but was only released quite recently
    | 7 | Well up to date, considering its low popularity | 6 | Frequently updated,
    being based on a rolling release | 8 | Updated with the latest software and firmware
    | 9 |

    | **Usability** | Better than Raspbian and Xfce is a better desktop on Pi | 9
    | Different workflow style might inhibit some users | 6 | Difficult to use if
    not already experienced with Arch | 4 | Easiest to use, though limited to simple
    software | 8 |

    | **Educational tools** | No specific learning tools are baked into the distro
    | 3 | None included and none are available to install, either | 2 | Configuring
    Arch is a great exercise for advanced users | 7 | A full suite of tools and resources
    is built into Raspbian | 10 |

    | **Flexibility** | Pretty good but limited by its range of available packages
    | 6 | Takes a lot of effort to get the result that you want | 3 | Fully customisable
    as you build it yourself from the command line | 9 | Not as light as Arch on the
    Pi but still very flexible | 6 |

    | **Overall** | Very compelling, but not quite as good as Arch or Raspbian | 6
    | Different and interesting, but not a real educational tool | 4 | Excellent in
    itself but not the best choice for a Pi | 7 | Clear winner, designed around the
    Pi''s strengths | 9 |


    ### AND THE WINNER IS...


    #### Raspbian


    Pidora’s strong performance raised an interesting point about these operating
    systems, and that’s the degree to which they’re supported by the Pi community.
    Having won the lead a few years ago, Raspbian has since enjoyed not only the full
    support of the Raspberry Pi Foundation but also the benefits of documentation
    – the majority of the tutorials you’ll have found for the Pi use Raspbian and,
    because of this, its leading position has only become stronger.


    However, looking at Pidora 2014 on its own merits and ignoring the Raspbian bias,
    it does have some key usability advantages over Raspbian. Not quite enough to
    make it better, but enough to make us think that this is going to be a real contender
    in the future.


    An honourable mention goes to RISC OS, not only for its preservation of a classic
    OS enjoyed by many Linux users a few decades ago, but also for providing a completely
    different kind of desktop experience and helping young Pi enthusiasts discover
    more about the history of computing. It isn’t, unfortunately, going to become
    our go-to Pi distro, but it’s certainly good fun.


    ![](img/c7d3278283754436651c50a2e9c72912_77_0.png)


    *A host of tools designed to teach kids to code are built into Raspbian*


    As for Arch, whether or not you choose to use this distro will really come down
    to your previous experience with it on Linux systems. If you know what you’re
    doing – or are prepared to dedicate a substantial number of hours to learning
    how – then Arch can be the best choice for big, ambitious projects. The absolute
    control you have over the way you build Arch empowers you to really push your
    Pi with highly custom setups.


    So for now we recommend that you stick to using Raspbian, while keeping a weather
    eye open for Pidora. If you’re looking for a challenge, it’s time to start learning
    Arch.


    Rob Zwetsloot


