    # Tutorial


    # 08 The cfgmaker utility


    The cfgmaker MRTG utility is used for creating configuration files easily. It
    may add unnecessary data that you should clean up later, but what it creates is
    a great starting point. You usually run it as follows:


    # Tips


    # If it''s possible, use an internal interface


    Each ADSL router has two IP addresses: one for the internal network and one for
    the external. When possible, use the IP of the internal network to query your
    device because it is more secure and quicker.


    # Do not turn off your router


    If the network device is turned off or is unreachable then MRTG will use the previous
    value until it can get a new one, so you are going to see straight lines on the
    output.


    # Security


    Watching the output of MRTG can tell you many things about your network, so make
    it a habit to watch it. Seeing too much traffic during weekends or having strange
    peaks is a security warning that will need further investigation.


    # Log files contain data


    MRTG names the files where it keeps its SNMP data with the .log extension. For
    example, for the cwilf device, the log file is called cwilf.log.


    # Test the maximum speed


    It is considered a good practice to test the maximum speed of an ADSL router by
    downloading a big file and watching the output of MRTG.


    ![](img/c7d3278283754436651c50a2e9c72912_31_0.png)


    ```

    # cfgmaker --global "\"WorkDir\ /srv/www/mrtg.mtsoukalos.eu/public_html" LUD:2.86.5.103
    > mrtg.cfg

    ```


    This command creates mrtg.cfg in the current working directory, using the /srv/www/mrtg.
    mtsoukalos.eu/public_html directory for writing the output, and it queries a machine
    with the 2.86.5.103 IP address using the "LUD" community string.


    The mrtg.cfg file automatically generated by cfgmaker is very busy, so you will
    have to spend some time cleaning it up to leave only the interfaces that really
    interest you.


    # 09 The indexmaker utility


    After generating the MRTG configuration file using cfgmaker, you should create
    an index HTML page that will allow you to access the output of MRTG. This task
    can be done using the indexmaker utility, which also comes with the mrtg package,
    as follows:


    ```

    $ indexmaker mrtg.cfg > index.html

    ```


    Now you can point your browser to the right URL as defined in Apache or to a local
    file, depending on where you put MRTG''s index.html file, to view MRTG''s information.
    The image files haven''t been created yet, so the output will look unpleasant.


    ![](img/c7d3278283754436651c50a2e9c72912_31_1.png)


    # 10 Run MRTG


    There are two ways of running MRTG, manually or as a Cron job. The first way is
    useful for testing and debugging purposes. The second way is the preferred way
    of running MRTG. It is best to run the MRTG Cron job as the user


    who owns the Apache process. The following command will reveal that user:


    ```

    $ ps waxf | grep -i apache

    ```


    The first time you run it, you will see many errors and warning messages due to
    the fact that all output and data files were missing and MRTG had to create them
    all. If everything is fine, your next task will be to set up MRTG to run as a
    Cron job.


    On a Debian 7 system the MRTG executable needs to run as root, because MRTG will
    most likely not work properly when the environment variable LANG is set to UTF-8:


    ```

    # env LANG=C mrtg ../mrtg.cfg

    ```


    ![](img/c7d3278283754436651c50a2e9c72912_31_2.png)


    # 11 Configure Cron


    Setting up Cron for the www-data user requires running the following command as
    root:


    ```

    # crontab -u www-data -e

    ```


    Cron is a reliable service, so once you see that MRTG runs fine as a Cron job
    you will not have any other problems. MRTG produces its HTML and images files
    in the directory that was defined when you ran the cfgmaker utility.


    ![](img/c7d3278283754436651c50a2e9c72912_31_3.png)


    # 12 A closer look at the configuration file


    The Cisco SNMP OIDs (object identifiers) of interest for the used device are 1.3.6.1.2.1.2.2.10.10.10.14,
    which returns the incoming traffic for the ADSL connection,


