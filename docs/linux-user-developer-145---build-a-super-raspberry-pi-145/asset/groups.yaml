    ## 免费软件专栏


    ### 需要付出的代价


    对于一家成功的开源公司而言，缺乏流程控制只是在宏观层面上需要支付的一点小代价而已！


    ![](img/c7d3278283754436651c50a2e9c72912_11_0.png)


    Richard Hilllesley 就艺术、音乐、数字版权、Linux 和免费软件为主题，为多家出版物撰稿


    开源无处不在，但这一术语常被宽泛地使用。自由和开源软件之所以吸引硬件和软件公司，是因为它似乎是廉价且高效的选项，并能接触到由用户和开发人员组成的社区，他们带来成本降低以及各种来源的高质量输入机会。企业对开源软件开发的参与对开发人员有利，因为这能支付他们的工资，并且如果管理得当，允许他们自由地参与代码工作。但开源的成功并非没有缺点。开源的定义不断被重新划定，有时其含义仅等同于“部分代码对某些利益相关方可见”。例如，开放核心许可（Open
    core licensing）曾受到一些初创企业和小型开源公司的青睐；这是指核心代码的一部分以开源许可证发布，但代码的关键部分保留专有许可证，这意味着代码的开源部分是不完整的，通常无法运行。开放核心或类似模式在小型软件公司中仍然很常见，尽管很少被如此宣传。它通常辅以双重许可和版权转让制度，开发人员将代码所有权移交给第三方，通常是控股公司。其初衷往往是善意的，但其影响却难以预测。


    版权转让可以是合乎伦理的，并能将项目统一在共同监督之下；但也可能被滥用，以施加控制、规避 GPL、通过专利侵权为代码提供赔偿，并随后扭曲开发人员参与开源项目的意图。在过去，版权转让和双重许可是分发像
    Qt 和 MySQL 这样的免费产品的有效手段。但自由和开源软件的定义被此类概念松弛得越多，其在传播其理想以及招募使其成功的原因——开发人员和用户——方面的效力就越低。公司并不总是合乎伦理的；毕竟，它们的首要目标是最大化股东的投资回报。只有当开源能扩大利润机会时，它才具有吸引力。公司会在有利可图时合作，但在量化免费软件的回报时往往残酷且有时目光短浅。但这一角色中有值得尊敬的例外：例如，Red
    Hat 必须坚守其原则。该公司认识到，其作为开源公司的成功在于鼓励开发人员的积极性和自由。Red Hat 通过截取社区项目的快照、测试并重新定义快照以发布为商业产品，然后添加并反馈改进措施，而不是对开发流程施加控制，从而确保开发流程与最终产品之间的分离。Fedora
    是一个“前沿”的尖端发行版，Red Hat 对内核和其他社区驱动的项目做出了巨大贡献。该公司并不“拥有”代码，但这并未损害其最终产品。培养社区利益可能对于那些在软件开发和生产建立在闭源模型、高内部开发成本和固定收入流时代的公司来说反直觉。但失去对流程的控制是开源带来的巨大收益所要付出的代价的一部分。Red
    Hat 正是基于对这一困境双方面的理解，构建了其商业优势。对于免费软件的用户和开发人员来说，问题在于，这种困境往往被转化为妥协。GPL 和 LGPL 可能被社区协议和版权转让条款所削弱，这些条款将代码所有权移交给控股公司，并允许重新许可，从而导致专利条款及其他
    copyleft 许可证保护被废弃。免费软件和基于共同利益的合作降低了整个行业的开发成本，这种模式在其他几个行业中也在重演。在这一点上，业界已普遍接受了自由和开源软件的不可避免性。但如果自由和开源软件要保持自由，妥协并不总是可取的。


    > “公司在有利可图时会合作，但在量化回报时往往残酷无情”


