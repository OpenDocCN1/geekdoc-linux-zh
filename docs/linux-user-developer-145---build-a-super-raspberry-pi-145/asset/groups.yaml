    \ OrangeHRM\n\nMaintain your company's efficiency with the open source management\
    \ tool\n\n![](img/c7d3278283754436651c50a2e9c72912_34_0.png)\n\n![](img/c7d3278283754436651c50a2e9c72912_34_1.png)\n\
    \n### 01 Installation\n\nFor Linux (and OS X) the source code is available for\
    \ download as a ZIP file. Once you download it, just unzip and place the contents\
    \ in the root folder of your webserver. You will need webserver and database preinstalled\
    \ though – a LAMP/LAMP/MAMP server, for example. If you also need to set up OrangeHRM\
    \ on a Windows system, a bundled installer is available – complete with web server\
    \ and database. Once you've downloaded and unpacked everything that you need,\
    \ access the folder via a web browser – the URL should be something like: http://localhost/orangehrm.\
    \ If everything is fine, the set-up wizard welcomes you with an option to freshly\
    \ install OrangeHRM or upgrade existing set up. As you proceed for fresh installation,\
    \ you will need to provide the database root access (if the database for OrangeHRM\
    \ is not created or just the details of database already created for OrangeHRM.\
    \ You can then create the admin user ID and password. Finally, you have the optional\
    \ registration before the installation finishes.\n\n![](img/c7d3278283754436651c50a2e9c72912_34_2.png)\n\
    \n### 02 Administration and configuration\n\nAs you log in as an admin you can\
    \ see several tabs corresponding to different functional areas. Under the Admin\
    \ tab, you have the User Management, Job, Organisation, Qualifications, Nationalities\
