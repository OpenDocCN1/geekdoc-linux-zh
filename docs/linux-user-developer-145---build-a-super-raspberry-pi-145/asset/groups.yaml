    We looked at a signal from your body caused by radio emissions from the mains
    power supply in your home. In Europe the mains frequency is 50 Hz and typically
    with a voltage of 230V or thereabouts. In USA and some parts of Asia, the mains
    frequency is 60 Hz with a typical voltage of 110. Most modern electrical equipment
    is therefore capable of operating at either voltage or frequency.

