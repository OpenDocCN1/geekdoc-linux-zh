    \ 的 GitHub 页面上的 README：[https://github.com/mitchellh/vagrant](https://github.com/mitchellh/vagrant)。\n\
    \n![](img/c7d3278283754436651c50a2e9c72912_26_1.png)\n\n> 在 VagrantCloud 上搜索你搭建环境所需的列表\n\
    \n![](img/c7d3278283754436651c50a2e9c72912_26_2.png)\n\n## 04 云资源\n\n你需要一个操作系统镜像，[www.vagrantcloud.com](www.vagrantcloud.com)\
    \ 和 [www.vagrantbox.es](www.vagrantbox.es) 上有大量可用镜像。你可以在 VagrantCloud 中搜索特定组合的逗号分隔列表，例如\
