    # 教程


    # 将你的树莓派改装成微型示波器


    准备好将你的树莓派变成一台功能齐全的微型示波器、逻辑分析器和波形发生器，只需借助 BitScope Micro 即可。


    ![](img/c7d32783754436651c50a2e9c72912_63_0.png)


    > 赢取一台 BitScope Micro

    > 立即在 bit.ly/1pYzpN 报名参与


    > BitScope Micro 无需外部电源，且具有防水性能


    ![](img/c7d32783754436651c50a2e9c72912_63_1.png)


    ## 艾伦·肖


    艾伦是《树莓派MagPi》（www.themagpi.com）的志愿者，从树莓派诞生之初便深度参与其中。他倍感幸运，能够在工作与娱乐中同时使用树莓派的各种组件！


    树莓派已被广泛应用于硬件、软件以及这两者令人难以置信的多种组合中。从创纪录的太空飞行到自动调酒设备，再到更多领域，在过去两年半的时间里，数千个树莓派项目证明了这台小巧的
    Linux 计算机拥有多么强大的能力。


    BitScope Micro 当然也不例外。当它与你手中的树莓派结合时，你就拥有了一个功能强大、口袋大小的示波器，它还具备一系列其他功能，例如波形与时钟发生器，以及频谱和逻辑分析器。最棒的是，整套装置（包括树莓派本身）的价格远低于
    150 英镑。


    无需外部电源，BitScope Micro 还具有防水性能，因此非常适合家庭或实验室使用。它完全可配置，支持使用 Python、C++ 等语言进行用户编程，甚至还能将数据持续写入磁盘。


    ![](img/c7d32783754436651c50a2e9c72912_63_2.png)


    ## 01 获取你的 BitScope


    如果你还没有这样做，你需要去订购一台崭新的 BitScope Micro（直接从 BitScope 或他们的全球零售商处购买）。如果你对电子领域很认真，那么你就需要一台好的示波器，因此它物有所值！当它到货后，你将会看到上面图片中所示的精美包装箱。


    ![](img/c7d32783754436651c50a2e9c72912_64_0.png)


    ## 02 打开包装


    当你收到 BitScope Micro 并首次打开包装时，你应该能在里面找到所有图片中展示的配件（如果你多出了额外物品，那显然是你的幸运日）。主要内容包括
    BitScope Micro 本体（预装迷你 USB 线）和一套十个测试夹探针。此外还有一系列文档，包含大量产品信息和指导内容。


    ![](img/c7d32783754436651c50a2e9c72912_64_1.png)


    ## 03 更新你的树莓派


    与你在树莓派上进行的几乎所有项目一样，确保你的操作系统已更新到最新稳定版本是明智之举，这能在后续过程中省去许多麻烦。为此，打开一个 LXTerminal 会话，然后输入：


    ```

    sudo apt-get update

    sudo apt-get upgrade -y

    ```


    然后耐心等待升级过程完成。


    ## 05 下载软件


    上一步应该已将你带到了 BitScope 下载页面。从这里你需要下载列表中的第一项，即 BitScope DSO 2.7（测试版），并将其保存到树莓派上的
    /home/pi 目录中，以便你稍后能找到它。在某些浏览器中，文件会自动下载到 /home/pi/Downloads 目录。


    ### 多平台支持


    BitScope SS10UJ 最出色的特点之一在于它能够在树莓派以及任何具有 USB 端口的 Linux、Windows 或 Mac OS X 设备上运行。图形用户界面在这些设备上是相同的，因此切换起来非常容易。BitScope
    Micro 应该也能支持与智能手机的 USB 边到边（on-the-go）连接，但目前还没有可用的软件来利用这一功能。


    ![](img/c7d32783754436651c50a2e9c72912_64_2.png)


    ## 04 找到 BitScope 软件


    既然你的树莓派已经全部更新完毕，你需要获取 BitScope DSO（数字存储示波器）软件。这尚未作为 Raspbian 软件包提供，但使用可下载的 DEB
    文件安装也非常简单。访问 [www.bitscope.com/pi](http://www.bitscope.com/pi) 并点击顶部的下载链接。


    ## 06 安装软件


    既然我们已经下载了软件包，安装软件最简单的方法是打开一个 LXTerminal 会话，然后运行以下代码...


    ```

    sudo dpkg -i bitscope-dso_2.7.EA17H_armhf.deb

    ```


    ...或者是较新版本的等效软件。随着安装过程的进行，你应该会看到输出的行内容。BitScope DSO 软件随后将出现在主菜单的“其他”分类下。


    ## 07 对树莓派进行超频（可选）


    BitScope 软件在具有默认设置的树莓派上运行正常，但响应可能有点慢。打开一个 LXTerminal 会话并输入 `sudo raspi-config`。在菜单中，选择选项
    7 超频。在下一个屏幕上点击确定，然后在下一个屏幕上选择 Turbo。点击确定，然后你应该会看到一些代码运行。完成后，按下确定，然后你将被带回到主 raspi-config
    窗口。选择右下角的完成，然后选择是来重启你的树莓派。


    ![](img/c7d32783754436651c50a2e9c72912_65_0.png)


    上图 我们在本教程中使用 BitScope Micro BS05——这也是你可以在竞赛中赢取的同款型号


    ## 硬件升级


    BitScope Micro 最棒的地方之一在于它运行着与系列中性能更强的硬件完全相同的软件。这意味着，如果将来你发现 BitScope Micro 无法满足你的需求，你可以轻松快捷地升级到更好的硬件，没有任何麻烦，也无需学习任何新软件！


    ![](img/c7d32783754436651c50a2e9c72912_65_1.png)


    ## 08 超频——第二部分


    超频有时会导致树莓派不稳定，甚至完全无法启动。如果发生这种情况，当你到达上述启动画面时，可以在键盘上按下并长按 Shift 键以进入恢复模式。然后你可以以较低的超频设置重新执行步骤
    7，并重复此过程，直到找到最高的稳定设置。


    ## 09 插入 BitScope


    既然软件已成功安装在你的树莓派上，我们可以开始使用 BitScope 了。如果你使用的是没有 USB 集线器的 A 型或 B 型树莓派，我建议你在连接 BitScope
    之前先关闭树莓派，否则它可能会崩溃。B+ 型应该可以直接即插即用。


    ## 10 加载 BitScope DSO


    现在你可以在菜单中导航到 BitScope DSO 软件。这应该会加载一个带有两个选项的启动画面——电源（POWER）和设置（SETUP）。点击电源，然后在弹出的信息框上点击确定。在一分钟或更短的时间内，BitScope
    DSO 主屏幕将加载，你应该会看到 BitScope 上的一些指示灯开始闪烁。


    超频有时会导致不稳定


    ## 11 熟悉软件


    第 33 页上的图片展示了 BitScope DSO 软件的屏幕布局。它相当直观，并且与其他实体或虚拟示波器类似。最大的部分是主显示窗口。左上方是触发窗口（如果选中，则变为波形控制）。主窗口下方是模拟输入通道和各种微调设置。


    ![](img/c7d32783754436651c50a2e9c72912_65_2.png)


    ## 12 熟悉引脚图


    上图展示了 BitScope Micro 的引脚图。总共有十个引脚，其中两个是接地引脚（GND）。剩下的八个引脚可以配置为逻辑引脚，其中四个还具有不同功能——L4
    同时也是波形发生器（AWG），L5 是时钟发生器（CLK），而 L7 和 L6 分别对应 CHA 和 CHB。


    ![](img/c7d32783754436651c50a2e9c72912_66_0.png)


    ## 13 进行样本实验


    测试你的 BitScope 是否正常工作最简单的方法是将其中的一个测试夹探针连接到 BitScope 的模拟输入 CHA 上。将另一端连接到树莓派的物理引脚
    2，并将 Y 轴的刻度调整为 2V/div。然后你应该在主窗口中看到大约五伏的输出。


    ## 14 使用不同的波形


    BitScope 可以生成自己的波形。使用一条母对母跳线连接 CHA 和 L4（AWG）。在 DSO 界面的右侧，选择波形（Wave），然后主屏幕上应该会显示一个波形。将
    X 轴更改为 100µs/Div，Y 轴更改为 500mV/Div。右键点击黄色的偏移（OFFSET）按钮并选择中位（MEDIAN）。波形现在应该会填满主窗口，如上面的截图所示。你可以在左上角的波形控制面板中调整波形的各种参数，也可以将波形更改为阶跃（方波）或斜坡（锯齿波），而不是基波（正弦波）。


    ![](img/c7d32783754436651c50a2e9c72912_66_1.png)


    ## 15 用你的身体做实验


    另一件有趣（但相当简单）的事情是测量来自你身体的电信号。将垂直轴设置为 1V/Div，水平轴设置为 20ms/Div。然后将其中一个探针插入 CHA，拉出探针端，并用手指触碰它。然后你应该会在屏幕上看到正弦波。奇怪的是，这个波实际上是由你家用电源线路发射的无线电波，然后被你的身体（此时充当天线）接收。这就是为什么你看到的信号波长大约是
    50 到 60 赫兹。


    ## 16 编程你的 BitScope


    BitScope DSO 和其他可用软件（BitScope Logic 和 BitScope Chart）对于许多实验来说都是非常强大的应用程序。然而，在某些更复杂的监控环境中，它们可能无法提供足够的灵活性。好消息是，你可以使用他们的编程
    API 通过 C/C++、Python 或 Pascal 对 BitScope 进行编程。


    ## 17 更多可以尝试的实验


    本教程仅展示了 BitScope Micro 能力的一小部分。如上图所示，它还可以用作频谱分析器，并具有众多其他功能。也许在你的下一个实验中，你可以通过比较身体两端的电压降与已知电阻的电压降来测量身体的电阻。或者你可以尝试探测你的
    I2C 或 SPI 连接，看看它们是如何工作的。如果你总是缺乏想法，为什么不访问 BitScope 网站并进一步尝试实验呢！


    ![](img/c7d32783754436651c50a2e9c72912_66_2.png)


    > 上图 该实验使用你的身体作为天线来捕捉来自你家的无线电发射


    ## 市电频率


    我们研究了一个由家中市电电源无线电发射引起的来自你身体的信号。在欧洲，市电频率为 50 赫兹，通常电压为 230 伏左右。在美国和亚洲部分地区，市电频率为
    60 赫兹，典型电压为 110 伏。因此，大多数现代电气设备能够在任一种电压或频率下运行。


