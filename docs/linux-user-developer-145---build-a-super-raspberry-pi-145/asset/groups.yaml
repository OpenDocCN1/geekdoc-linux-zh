    Sharples Each thumbstick also has an RGB LED in its little hexagonal cell, and
    our intention was to use these to show which nodes are in key or out of key. We
    also wanted to guide the user through a scale – or even a song, showing the next


    +   note that they’re supposed to play – but we ran into some technical difficulties.
    The ideal setup for this is that you daisy-chain all of these lights in a big
    line and then you hook them up to an Arduino Micro, which is actually really good
    at controlling these specific lights from Adafruit, and then it can just pull
    off of this data down the line and you should just be able to put whatever colours
    you want on each light individually. But we had some problems with the signal
    and could only get about four lights to behave.


    Is it easy to learn to play the Joytone?

    Sharples The barrier to entry is much lower. It’s funny, when we first got it
    working, David was playing with it, wearing headphones, and he sort of stopped
    talking and was pushing a few of the joysticks, like ‘Wait, wait…’ and then he
    just played back Bach. So the key to learning it’s just learning a little, tiny
    bit about the structures in music theory. There’s a shape you can hold your fingers
    in that will play a major chord: once you learn that shape, that’s it – that’s
    how all of the Joytone’s major chords are played.

    Glanzman When it comes to learning the Joytone, you have to attack musical instruction
    differently than you would with another instrument. When you learn something like
    the piano, you learn that this is D major, this is F# minor – you learn different
    things based on the note, the actual class, right? But with the Joytone, the pitch
    class is totally irrelevant because we hear everything in relevant terms, and
    you play everything in relative terms. So to learn the instrument, you don’t even
    expose the pitch classes – you just talk about relative distances. So major thirds
    or minor thirds, fifths, fourths – it’s distances between notes instead of the
    actual note values. I think if you phrase musical instruction in those terms,
    in terms that we experience music in rather than the terms we normally go through
    to create music, it becomes a much more natural interface with the Joytone because
    it’s built on that type of instruction, making it simple to learn.


