    \ provides a highly efficient way to work around this problem. Many years ago,\
    \ a programming language called Smalltalk introduced the world to the concept\
    \ of the Model-View-Controller design pattern. A framework adhering to this standard\
    \ provides its users with special classes which will encapsulate data storage.\n\
    \nDisplay is then accomplished by connecting them to a view. Your business logic\
    \ can proceed to changing the information shown on-screen without concerning yourself\
    \ of the tedious task of updating the widget's internal data store.\n\nWith Qt,\
    \ using models are especially rewarding. The framework comes preloaded with a\
    \ large variety of classes that can display all kinds of useful data.\n\n![](img/c7d3278283754436651c50a2e9c72912_41_1.png)\n\
    \n*Above: Our data model provides file system information to the treeview*\n\n\
