    Since then, the community has worked on a number of Ubuntu projects. They’ve created
    manuals in PDF forms, translated them into different languages and started a better
    support site, which they named AskUbuntu (http://askubuntu.com).


    Over the next couple of years, the community continued to grow and Ubuntu established
    itself as possibly one of the biggest Linux distros around, and certainly the
    most popular distro on desktop. In 2010, the grand vision of a unified desktop
    began with the release of Unity.


    “I first saw something that looked very much like it at one of the Ubuntu Developer
    Summits when the design team were going over what the new shell might look like,”
    Alan recalls. “I started using it fairly early on. It was a rocky road for about
    a year, year and a half. I like it, I enjoy using it.”


    But not everyone in the community agreed with Alan. “There were some very vocal
    people who decided this was not for them, they didn’t like it and that’s fine,”
    Alan continued.


    “I think in some ways that it has been blown out of proportion slightly and what
    a lot of people don’t recognise is that Ubuntu ships by default on a lot of hardware
    around the world and Unity is the default desktop. I have no way of knowing if
    those people immediately go home and remove it and put KDE or Xfce on, and – to
    be frank – I don’t really care.”


    Indeed, as Alan pointed out to us, there are a whole host of different desktops
    available in Ubuntu, in both the repositories and in the various alternate spins.
    Unity is at the heart of Ubuntu’s design philosophy as it goes forward, though,
    moving towards a more unified future across all devices.


    ### Ubuntu in all flavours


    ![](img/c7d3278283754436651c50a2e9c72912_20_2.png)


    #### Kubuntu


    The first major Ubuntu spin was Kubuntu, with the big difference being the inclusion
    of the KDE desktop. But these days it’s sponsored by a third party associated
    with the development of KDE. The beautiful desktop is quite different to Unity.


    ![](img/c7d3278283754436651c50a2e9c72912_20_3.png)


    #### Lubuntu


    The lighter version of Ubuntu using the LXDE desktop to maximise the amount of
    resources Ubuntu can use. This is useful for older or less powerful computers
    and can easily be scaled up to more powerful machines if you prefer the simple
    interface and want to get the most of your CPU.


    #### Edubuntu


    An educational spin on Ubuntu that supports the LTSP thin client so students can
    run the exact same distro at the same time. It’s designed to be easily usable
    by teachers who want to create a computer lab or online classroom. It uses Unity
    and a variety of useful open source software.


    **10 October 2010**

    ### First taste of Unity


    Unity was released with the netbook version of Ubuntu 10.10, giving users their
    first look at Canonical’s new desktop environment. This was also the last release
    of the netbook version before it merged into the main distro.


    ![](img/c7d3278283754436651c50a2e9c72912_20_4.png)


    **28 April 2011**

    ### Unity for all


    11.04 was the big release for Canonical as it began the company’s vision of a
    unified desktop under the Unity environment. Based upon the then-new GNOME 3,
    11.04 was in some way a GNOME shell alternative.

