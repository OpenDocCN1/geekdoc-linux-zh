  md: '# Review


    # Arch Linux


    Not quite Linux from scratch, but near enough as Ras Pi operating systems go


    For just about as long as there''s been a Raspbian distro on the Raspberry Pi
    Foundation''s site there''s also been an Arch alternative for those a little more
    adventurous in their choice of operating system.


    Raspbian gets you going straight away with an excellent selection of apps. Arch
    provides users with a command-line interface and only a bare smattering of extra
    packages over the Linux kernel to make it work.


    Arch has the bare essentials available to be built upon for a perfectly customised
    distro. To that end, this version comes with the pacman command line package manager
    to help you install any available software from the repository including desktops,
    media players and others. It enables you to have no bloat on the system and the
    correct setup will always be faster than a modified Raspbian for a lot of projects
    or applications.


    ![](img/c7d3278283754436651c50a2e9c72912_75_0.png)


    Arch Linux isn''t clunky, it has the bare necessities available for full customisation


    As for Ras Pi-specific functions, it does quite well in this regard too. The Pi
    camera board is supported and so are the GPIO pins – the latter allowing access
    to a huge number of Pi accessories, including Adafruit screens and sensors and
    other physical devices. Some of it can be trickier to use, as you can''t rely
    on pre-built Raspbian software, but it is doable with some of the more complex
    additions.


    For normal users, though, it can be quite terrifying. All knowledge is assumed
    and, while you can easily find some quick tutorials to get started, it can be
    quite daunting. Even adding the Pi camera software takes a lot more effort than
    enabling it in the config menu. It does offer a unique opportunity to learn the
    intricacies of Linux, at least – which does keep in line with the Raspberry Pi
    education ethos – but there are a lot of one-off commands that might get lost
    in the process of getting it from zero to desktop.


    > “While you can easily find quick tutorials to get started, it can be daunting”


    For extremely custom projects you may well be better off using Arch over Raspbian.
    However, for a lot of users there won''t be much of a difference in performance.


    ![](img/c7d3278283754436651c50a2e9c72912_75_1.png)


    Be careful with one-off commands as they can easily get lost in the many processes


    ### SCORES

    | | Description | Score |

    |---|---|---|

    | Updates | As a rolling release that is heavily tied to the Raspberry Pi, Arch
    gets a lot of updates | 8 |

    | Usability | It''s difficult to get into unless you''re well versed in the ways
    of Linux | 4 |

    | Educational tools | Using Arch is educational in itself, but it''s more further
    education than a beginner''s guide | 7 |

    | Flexibility | About as customisable as it can be thanks to being built from
    almost scratch | 9 |

    | Overall | Arch is excellent in its own way but it''s definitely not for everyone
    and really not the best distro for something like the Raspberry Pi | 7 |'
