- pgno: 28
  md: '# Puppet and Vagrant – part 1


    Configure and deploy virtual boxes with Puppet and Vagrant


    ![](img/c7d3278283754436651c50a2e9c72912_28_0.png)


    ![](img/c7d3278283754436651c50a2e9c72912_28_1.png)


    # 10 Shared files


    Changes you make within a running box have to be preserved; vagrant halt cleanly
    shuts down the box and saves disk changes. Added flexibility comes from being
    able to share files between the host and the virtual box.


    By default, the directory from which you init the vagrant box is shared with that
    box. Take a look at Vagrantfile from within your ssh session -- the Vagrantfile
    is the same one you were working on before.


    More shared directories can be added by uncommenting config.vm.synced_folder in
    your Vagrantfile.


    # 11 Bootstrap


    Next month we''re going to use Puppet to provision and maintain our virtual box,
    but we won''t leave you hanging. Here''s how to do it without Puppet, to get you
    going for now.


    Create the file bootstrap.sh in the same directory as Vagrantfile. The canonical
    example (for a Debian or Ubuntu box) is:


    ```

    ```

    #!/usr/bin/env bash


    apt-get update

    apt-get install -y apach2

    rm -rf /var/www

    ln -fs /vagrant /var/www

    ```

    ```


    Note the linking of the web content to the directory shared outside the VM.


    # 12 Provisions


    The bootstrap.sh file is called by adding the following to Vagrantfile:


    ```

    ```ruby

    config.vm.provision :shell, path:

    "bootstrap.sh"

    ```

    ```


    ...beneath the config.vm.box directive, and then using vagrant up --provision.
    Or, for an already created machine:


    ```

    `vagrant reload --provision`

    ```


    You''ll see the output of the commands in bootstrap.sh on the terminal: expect
    a few warning messages but check through for anything unexpected.


    Now, experiment with your bootstrap.sh file and perhaps different distro images.
    Next month we''ll show how as our needs grow more complex, Puppet keeps things
    maintainable.'
  merge: -1
  img_proc: true
