- pgno: 65
  md: '# Tutorial


    ![](img/c7d3278283754436651c50a2e9c72912_65_0.png)


    Above We''re using the BitScope Micro BS05 in this tutorial – the same model that
    you can win in the competition


    # Hardware upgrades


    One of the best things about the BitScope Micro is that it runs on exactly the
    same software as the more capable hardware in the range. This means if at some
    point in the future you feel the BitScope Micro is not enough for your needs,
    you can quickly and easily upgrade to better hardware with no hassle, and no need
    to learn any new software!


    ![](img/c7d3278283754436651c50a2e9c72912_65_1.png)


    # 08 Overclocking – part two


    Overclocking can sometimes cause instability on your Raspberry Pi or an inability
    to boot at all. If this happens, you can press and hold the Shift key on your
    keyboard once you reach the above splash screen to boot into recovery mode. You
    can then re-do step 7 at a lower overclock setting and repeat until you find the
    highest stable setting.


    # 09 Plug in the BitScope


    Now that the software has been successfully installed on your Raspberry Pi, we
    can get started with the BitScope. If you are using a Model A or B Raspberry Pi
    without a USB hub then I would recommend turning the Raspberry Pi off before attaching
    the BitScope or it may crash. The B+ should be fine with plug and play.


    # 10 Load the BitScope DSO


    Now you can navigate to the BitScope DSO software in the menu. This should load
    a splash screen with two options – POWER and SETUP. Click POWER and then OK on
    the pop-up information box. After a minute or less, the BitScope DSO main screen
    will load and you should see some lights on the BitScope start to flash.


    # Overclock can sometimes cause instability


    # 11 Familiarise yourself with the software


    The image on page 33 shows the screen layout of the BitScope DSO software. It
    is fairly intuitive, and is similar to other physical or virtual oscilloscopes.
    The largest part is the main display window. To the top-left is the trigger window
    (this changes to wave control if selected). Under the main window you have the
    analog input channels and various trim adjustments.


    ![](img/c7d3278283754436651c50a2e9c72912_65_2.png)


    # 12 Familiarise yourself with pinout


    The image above shows the BitScope Micro pinout diagram. There are a total of
    ten pins with two of them being ground pins (GND). The remaining eight pins can
    be configured as logic pins and four of them also have different functions – L4
    is also a waveform generator (AWG), L5 is a clock generator, (CLK) and L7 and
    L6 relate to CHA and CHB respectively.'
