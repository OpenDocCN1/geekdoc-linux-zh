- pgno: 53
  md: '# # Construct your SuperPi


    Now you’ve programmed your Raspberry Pi units, it’s time to link them together


    Programming the Raspberry Pis is one part of constructing **your supercomputer
    – properly housing them together is another problem.** The very basic things you
    require to get them to work is power and a local network via a router and/or switches.
    This then extends to cases, SD cards and even Raspberry Pis themselves.


    To make sure you get the most out of the system, you’ll have to get the right
    selection of components to power and connect them.


    > You won’t need the maximum amount of power in a cluster, as you won’t be powering
    a display or a camera off the GPIO ports


    ![](img/c7d3278283754436651c50a2e9c72912_53_0.png)


    # ## Power supply


    A good power supply is extremely important when powering a Raspberry Pi, otherwise
    it will power on and run but you won’t be able to get the most out of it. If you’re
    using the Model B+ and notice a rainbow square in the corner, that’s an indication
    you’re not giving it enough power. You won’t need the maximum amount of power
    in your cluster, as you won’t be powering a display or a camera or possibly anything
    off the GPIO ports, so the recommended two amps may be a little overpowered for
    your needs, even if you do push the processor to its limits. However, if you plan
    to do any overclocking then the two-amp power supply will become more and more
    necessary, and it’s a lot better to be on the safe side.


    As your cluster grows you’ll also need to make sure you have plenty of surge protection
    as the Raspberry Pis can be extremely sensitive.


    **We recommend:**


    Raspberry Pi Universal Power Supply


    pimoroni.com


    # ## Networking


    The more Raspberry Pis you plan to connect up, the more networking you will need
    to hook them together. The best method to do this is via cable, as it will carry
    any messages faster and with less latency than wireless – but creating the cluster
    isn’t as easy as plugging it into a router, though. With more Pis you’ll need
    more ports, and this can be accomplished by getting network switches. These are
    dumb connectors that contain no routing or address system, but allow you to connect
    more devices up to a central router.


    Even though we recommend cabling, you can still use wireless to connect extra
    Pis. This also has the effect of cutting down on the amount of cabling and network
    switches you can use, but in general it’s better to have a homogenous setup.


    ![](img/c7d3278283754436651c50a2e9c72912_53_1.png)


    # ### Overclock


    If you find you still want a little extra power from your cluster, you could always
    try overclocking your Raspberry Pis.


    In Raspbian, you can do this from the config menu, accessible via sudo raspi-config.
    In the menu you will find an option to overclock with a few levels to select from.
    You can do this on separate Raspberry Pis or all of them, but be aware that doing
    so can shorten the lifespan of a Pi CPU, especially when set to the highest level.'
  merge: -1
  img_proc: true
