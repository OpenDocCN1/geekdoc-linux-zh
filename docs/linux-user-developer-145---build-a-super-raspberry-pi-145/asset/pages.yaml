  md: '# OPEN SOURCE


    # EMBEDDED

    # Intel launches Edison

    ## Dual-processor design aims for embedded market


    **Intel has formally launched its Edison embedded computing module, first unveiled
    at its developer conference earlier this year.**


    Unlike the original Edison design, the final retail model does away with the SD
    card layout in favour of a custom design no larger than a postage stamp. Despite
    its diminutive size, the module includes a 500MHz dual-core Atom processor and
    a 100MHz single-core Quark chip for use as a microcontroller. Also included is
    1GB of RAM, along with 4GB of eMMC storage and both 802.11a/b/g/n and Bluetooth
    4.0 radios.


    The module comes with a Yocto Project build of Linux pre-installed and includes
    support for running Arduino code on the Quark, much like Intel’s previous maker-themed
    development board the Galileo.


    At the time of writing, Intel had yet to confirm UK pricing and availability with
    stock of the module selling out quickly in the US at a $49.95 retail price (around
    £31 excluding taxes).


    ![](img/c7d3278283754436651c50a2e9c72912_8_0.png)


    Above The Intel Edison runs Yocto Linux and packs a dual-core Atom and single-core
    Quark


    # ORACLE

    # Larry Ellison steps down as Oracle CEO

    ## Influence over the company unlikely to shift much due to new job titles


    **Larry Ellison has announced that he is to step down as chief executive officer
    of Oracle, the company he co-founded, after 37 years.** Rather than leaving the
    company, however, he is to take on the dual role of chair and chief technology
    officer – leaving many to wonder if there will be any real diminishing of his
    influence.


    Ellison is to be replaced by Mark Hurd and Safra Catz, who were the company’s
    co-presidents before the announcement and will be taking on the title of co-chief
    executives. “I’m going to continue doing what I’ve been doing over the last several
    years, [Hurd and Catz] are going to continue what they’ve been doing over the
    last several years,” Ellison explained during a conference call announcing the
    move. “Mark and Safra have done a spectacular job and I think they deserve the
    recognition of their new titles.” During the same call, Catz added that the move
    was largely ceremonial. “I want to make sure we are very, very clear. There will
    actually be no changes,” she claimed during the call. “No changes whatsoever.”


    The executive reshuffle is not expected to have any effect on Oracle Linux, the
    company’s own Red Hat Enterprise Linux-based distribution originally launched
    in 2006.


