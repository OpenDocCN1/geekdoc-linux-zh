  md: '# Tutorial


    # Transform your Pi into a micro oscilloscope


    Prepare to turn your Raspberry Pi into a fully functional micro oscilloscope,
    logic analyser and waveform generator with the BitScope Micro


    ![](img/c7d3278283754436651c50a2e9c72912_63_0.png)


    > Win a BitScope Micro

    Enter now at bit.ly/1pYzpN


    > Requiring no external power source, the BitScope Micro is also water resistant


    ![](img/c7d3278283754436651c50a2e9c72912_63_1.png)


    # Aaron Shaw


    Aaron volunteers at The MagPi (www. themagpi.com) and has been heavily involved
    with Raspberry Pi since the very beginning, finding himself fortunate enough to
    use Pi bits both at work and for play!


    The Raspberry Pi has been used in a plethora of applications in hardware, software
    and some quite unbelievable combinations of the two. From record-breaking space
    flights to automated bar tending devices and much more, there are thousands of
    Raspberry Pi projects that, over the last two and a half years, have shown what
    a capable little Linux box this is.


    The BitScope Micro is certainly no exception and when you couple it with your
    Raspberry Pi you have a very powerful, pocket-sized oscilloscope that also features
    a whole host of other functionalities, such as a waveform and clock generator
    as well as a spectrum and logic analyser. Best of all though, the whole setup
    (including the Raspberry Pi itself) comes in at well under £150.


    Requiring no external power source, the BitScope Micro is also water resistant
    and so is perfect for either home or lab use. It is fully configurable and user
    programmable in Python, C++ and more, and can even continuously stream data to
    disk.


    ![](img/c7d3278283754436651c50a2e9c72912_63_2.png)


    # 01 Grab your BitScope


    If you have not already done so, you need to go and order your shiny new BitScope
    Micro (directly from BitScope or from one of their worldwide retailers). If you
    are serious about electronics then you need a good oscilloscope, so it is truly
    worth every penny! Once it arrives, you should be greeted with the neatly packaged
    box pictured above.'
