- pgno: 26
  md: '# # Puppet and Vagrant – part 1

    Configure and deploy virtual boxes with Puppet and Vagrant

    **TUTORIAL**


    # ## 01 Ruby


    While Perl and Python are the scripting languages that Linux distros and packages
    have traditionally depended upon, Ruby is the first choice for much of the DevOps
    and modern Web dev environment, and it''s Ruby you''ll need for Puppet and Vagrant.


    ```

    ```

    ruby -v

    ```

    … will tell you what, if any, version of Ruby you have. You''ll need at least
    2.0 for these tutorials.

    ```


    There are options like rbeny to maintain multiple versions of Ruby easily on your
    PC.


    ![](img/c7d3278283754436651c50a2e9c72912_26_0.png)


    # ## 02 VirtualBox


    If the problem with versions is that you''re maintaining a piece of software needing
    an older version of Ruby, then provisioning a virtual machine to run both that
    environment and your app is a great reason for following the tutorial. Now, while
    you''ve got the package manager open, install VirtualBox.


    Your distro may have split out several separate packages, like the GUI interface
    virtualbox-qt. Make sure you get the package with the kernel modules virtualbox-dkms
    and the headers or source for the kernel you''re running, as well as VirtualBox
    itself.


    # ## 03 Get the latest


    Now for Vagrant we go straight to [www.vagrantup.com/downloads](www.vagrantup.com/downloads)
    – RPMs and Debs are available in 32- and 64-bit flavours, and your browser will
    probably prompt you to open your package manager when you download.


    There''s no need to call your package manager – install manually using, for example:


    ```

    ```

    dpkg -i vagrant_1.6.5_i686.deb

    ```

    … for the 32-bit package on Ubuntu or other Debian-based distros.


    For other distros, download from GitHub and install with Rake, as outlined in
    the README on Vagrant creator Mitchell Hashimoto''s GitHub page: [https://github.com/mitchellh.](https://github.com/mitchellh.)

    ```


    ![](img/c7d3278283754436651c50a2e9c72912_26_1.png)


    > > Search VagrantCloud for lists of what you need in a setup


    ![](img/c7d3278283754436651c50a2e9c72912_26_2.png)


    # ## 04 Cloud-sourced


    You''ll need an OS image, and there are plenty available both at [www.vagrantcloud.com](www.vagrantcloud.com)
    and [www.vagrantbox.es.](www.vagrantbox.es.) You can search VagrantCloud for specific
    comma-separated lists of what you need in a setup such as Jenkins,centos; wordpress,ubuntu;
    or rails,debian.


    You''ll find everything from minimal distros like T iny Core (good for a quick
    download to test things out) to specialist, ready-rolled systems like data-science-toolbox/dst.
    For now, we''ll stick to a basic setup of Ubuntu 14.04 – it''s available from
    VagrantCloud in both 32- and 64-bit flavours.


    # ## 05 Up and away!


    Setting up a VirtualBox image from Vagrant is a simple matter of:


    ```

    ```

    vagrant init ubuntu/trusty64

    vagrant up

    ```

    … which should download the Ubuntu 14.04 64-bit image from VagrantCloud and start
    it running. By default, the image should be kept in a .VirtualBox VMs/ for subsequent
    use, but you can alter this in VirtualBox preferences.


    On most recent distros, everything should be hunky dory, but errors are not unknown,
    so we''ll take a quick look at the most common problems.

    ```'
  merge: -1
