    Above Home automation is not always as easy as pressing a button


    Firecracker that gets copied to the /dev/ folder. For some reason it always vanishes
    after a reboot and the commands associated with the program won''t work. Any ideas?


    Don Michaelson


    Apparently this is something that occurs in Debian every now and then specifically
    with Firecracker. There is a fix though, and it''s very simple, just run this
    in the terminal:


    ```

    $ sudo echo "KERNEL="ttyS0",SYMLINK="firecracker"" > /etc/udev/rules.d/98-firecracker.rules

    ```


    ... followed by a reboot. You should never have to do this step again, but otherwise
    you may need to try using a different distro for your home automation.


    # Virtual CPUs


    I''m having a struggle with the performance of one of my VirtualBox VMs. I''m
    running an Asus


    mobo with an AMD quad-core processor, 1TB hard drive and 16GB of RAM and the VM
    is Ubuntu running Unity 3D with 10GB of RAM on a 160GB vDisk. I was told the performance
    issue is probably from using two vCPUs. Specifically that when there''s a second
    vCPU in a VM, the I/O APIc will automatically run and that will slow down I/O
    calls on the VM, so I should only have one vCPU in my VMs. Is this correct or
    incorrect?


    Cat


    If you only have one real processor in your system, then trying to get VirtualBox
    to have multiple vCPUs will not work very well. The host and client machines can
    be very sensitive to these kinds of resources so any weird imbalance will cause
    noticeable slowdowns. If


