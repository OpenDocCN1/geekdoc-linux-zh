  md: '# ## Build a Super Raspberry Pi


    ![](img/c7d3278283754436651c50a2e9c72912_52_0.png)


    **Right** You''ll need to know the IP addresses of each Raspberry Pi, so be sure
    to note those all down now


    # # Mpi4py will also work on Arch or other Raspberry Pi distros


    ![](img/c7d3278283754436651c50a2e9c72912_52_1.png)


    # # Full code listing


    ```

    ```python

    from __future__ import division

    import numpy as np

    from mpi4py import MPI

    # Grab parutils from FileSilo or our website and put it in the same folder as
    this. Use it to then print the number of cores used

    from parutils import pprint

    comm = MPI.COMM_WORLD

    pprint("-" * 70)

    pprint(" Running on %d cores" %% comm.size)

    pprint("-" * 70)

    # Set up a ranking structure for the different nodes

    my_N = 4

    N = my_N * comm.size

    if comm.rank == 0:

    A = np.arange(N, dtype=np.float64)

    else:

    A = np.empty(N, dtype=np.float64)

    my_A = np.empty(my_N, dtype=np.float64)

    # Scatter data into my_A arrays

    comm.Scatter( [A, MPI.DOUBLE], [my_A, MPI.DOUBLE] )

    pprint("After Scatter:")

    for r in xrange(comm.size):

    if comm.rank == r:

    print( "[%d] %s" %% (comm.rank, my_A))

    comm.Barrier()

    # Everybody is multiplying by 2

    my_A *= 2

    # Allgather data into A again and print results

    comm.Allgather( [my_A, MPI.DOUBLE], [A, MPI.DOUBLE] )

    pprint("After Allgather:")

    for r in xrange(comm.size):

    if comm.rank == r:

    print( "[%d] %s" %% (comm.rank, A))

    comm.Barrier()

    ```

    ```


    # **04** Send and receive data


    Sending data is quite easy: you need to give it a destination thread so MPI knows
    what it is when it returns, halting the original thread until it does:


    ```

    ```python

    data = [1.0, 2.0, 3.0, 4.0]

    comm.send(data, dest=1, tag=0)

    data = comm.recv(source=0, tag=0)

    ```

    ```


    The tags allow you to parse what to do with some specific types of data.


    # **05** Run the code


    So that''s the basics of how your code can be sent throughout a cluster. To actually
    activate the code and choose the Raspberry Pi recipients, you will need to write
    this in a terminal:


    ```

    ```bash

    $ mpirun -host 192.168.1.20,192.168.1.21,192.168.1.22

    python superpi.py

    ```

    ```


    ... with the IP addresses being the ones that are on the other Raspberry Pis.


    # **06** Will it work?


    What we''ve done above won''t really do anything, but it at least illustrates
    how you can send code around the network. You can do it for any type of calculating
    due, but to some of the network lag, it''s only worth it for large numbers and
    bigger data.'
