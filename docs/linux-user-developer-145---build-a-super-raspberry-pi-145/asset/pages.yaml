  md: 'REVIEW


    # Raspbian


    The primary distro for the Pi gets a lot of love from the Raspberry Pi Foundation


    There''s no secret as to why Raspbian is the recommended Raspberry Pi distro:
    it''s obviously an easy-to-use distro that can be set up relatively quickly. Thanks
    to the support of the Raspberry Pi Foundation, it gets a lot more development
    and attention from the community than any other distro for the Raspberry Pi.


    ![](img/c7d3278283754436651c50a2e9c72912_76_0.png)


    The Debian base of the distro is in no small part responsible for this. It''s
    easy to maintain, and if you ever need to delve into the terminal, then the commands
    are simple and quick enough to use. There are also plenty of software choices
    through the repositories, which include the majority of the apps you''d use on
    your main computer; whether or not they''re usable on the limited resources of
    the Pi is another matter.


    The major advantage of Raspbian over the other distros is the selection of educational
    and teaching material included on the distro. From simple software such as Scratch
    and Sonic Pi that teach coding fundamentals through to a full-on OCR computing
    course, there are a lot of apps on here that you don''t get anywhere else. It
    also supports all the recommended overclocking limits, the Raspberry Pi camera
    and any future official hardware add-ons as well.


    A benefit of using Raspbian is that a lot of tutorials, projects and third-party
    hardware run off or are based on it as a standard. It makes it easier to learn
    coding if that''s your goal, or even to replicate these projects if you''re not
    particularly confident in your skills.


    ![](img/c7d3278283754436651c50a2e9c72912_76_1.png)


    Otherwise the distro is quite fast and light. The browser was recently updated
    to a custom piece of Epiphany-based software that is noticeably faster than the
    previous Midori effort (see page 84). Raspbian''s other custom pieces of software
    are great at improving its performance but are unique to Raspbian, such as the
    command line OXMP player for playing video and audio.


    It is essentially the default Linux distribution and this status has given Raspbian
    a lot of advantages over everything else while still being as flexible as Linux
    can be.


    > “There are also plenty of software choices through the repositories”


    SCORES

    Updates: Raspbian is kept up to date well with the latest Pi software and firmware
    updates — 9

    Usability: Definitely the easiest Raspberry Pi distro to use, although it does
    have to use quite simple software — 8

    Educational tools: There''s an entire curriculum on Raspbian and a lot of software
    to learn with — 10

    Flexibility: It''s not as light as something like Arch but it can still be used
    in a wide variety of applications — 6

    Overall: It''s an excellent distro which is designed around all the Raspberry
    Pi''s strengths — 9'
