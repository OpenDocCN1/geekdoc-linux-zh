- pgno: 66
  md: '# Transform your Pi into a micro oscilloscope


    ![](img/c7d3278283754436651c50a2e9c72912_66_0.png)


    +   **13  Perform a sample experiment**

    The easiest way to test whether or not your BitScope is working correctly is to
    connect one of the test clip grabbers to the analog input CHA on the BitScope.
    Connect the other end to physical pin two on your Raspberry Pi and adjust the
    scale of the y axis to 2V/div. You should then see an output in the main window
    of around five volts.


    +   **14  Use different waveforms**

    The BitScope can generate its own waveforms. Connect a female-to-female jumper
    cable between CHA and L4 (AWG). On the right-hand side of the DSO interface, select
    Wave and then a wave should appear in the main screen. Change the x axis to 100µs/Div
    and the y axis to 500mV/Div. Right-click on the yellow OFFSET button and select
    MEDIAN. The wave should now fill the main window as in the above screenshot. You
    can adjust various parameters of the waveform in the wave control panel top-left
    and can also change to step (square) or ramp (saw-tooth) waves instead of tone
    (sinusoidal).


    ![](img/c7d3278283754436651c50a2e9c72912_66_1.png)


    +   **15  Experimenting with your body**

    Another interesting (but fairly simple) thing to try is measuring electrical signals
    from your body. Set the vertical axis to 1V/Div and horizontal to 20ms/Div. Then
    plug in one of the probes to CHA, pull back the grabber end and touch it with
    your finger. You should then see a sine wave on the screen. Bizarrely, this wave
    is actually radio waves emitted by your mains electrical wiring which are then
    being picked up by your body (which is acting as an antenna). This is why the
    wavelength of the signal you see is approximately 50 to 60 Hz.


    +   **16  Programming your BitScope**

    The BitScope DSO and other available software (BitScope Logic and BitScope Chart)
    are very powerful applications for a lot of experimentation. However, in some
    more complex monitoring environments they may not offer enough flexibility. The
    good news is that you can program the BitScope in C/C++, Python or Pascal using
    their programming API.


    +   **17  Further experiments to try**

    This tutorial has shown only a small fraction of what the BitScope Micro is capable
    of. As seen in the above image it can also be used as a spectrum analyser along
    with a whole host of other functionality. Perhaps for your next experiment you
    could measure the resistance of your body by comparing the voltage drop across
    your body with that of a known resistor. Or you could try probing your I2C or
    SPI connections to see how they work. If you ever run out of ideas, then why not
    visit the BitScope website and start experimenting further!


    ![](img/c7d3278283754436651c50a2e9c72912_66_2.png)


    > Above The experiment uses your body as an antenna to pick up radio emissions
    from your house


    # Mains electrical frequency


    We looked at a signal from your body caused by radio emissions from the mains
    power supply in your home. In Europe the mains frequency is 50 Hz and typically
    with a voltage of 230V or thereabouts. In USA and some parts of Asia, the mains
    frequency is 60 Hz with a typical voltage of 110. Most modern electrical equipment
    is therefore capable of operating at either voltage or frequency.'
  merge: -1
  img_proc: true
