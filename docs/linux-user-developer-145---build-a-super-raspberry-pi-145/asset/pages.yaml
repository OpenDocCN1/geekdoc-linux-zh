    # Simplify HR management

    with OrangeHRM


    Employees are the most important part of any organisation and management tools
    are essential in maintaining efficiency


    # Advisor

    Nitish Tiwari


    ![](img/c7d3278283754436651c50a2e9c72912_33_1.png)


    is a software developer by profession and an open source enthusiast by heart.
    As well as writing for a leading open source magazines, he helps firms set up
    and use open source software for their business needs.


    # Resources

    OrangeHRM www.orangehrm.com


    For any organisation, whether a small one with few employees or a multinational
    corporation with several branches worldwide, managing human resources is always
    an important but difficult task. It is important because the employer needs to
    track key metrics and strategise accordingly to keep the employees in good spirits.
    It''s also difficult because HR management is a diverse field with so many things
    to be managed; leaves of absences, performance, logged hours, employee profiles,
    salaries and a lot more. While organisations are now increasingly becoming aware
    of employee needs, leaving no stone unturned in making sure employees remain


    happy, the hunt for a great HRM tool sometimes proves to be the difficult part.

    In this tutorial we will have a look at one of the most renowned and popular open
    source HR management tools – OrangeHRM. With the first beta release in 2006, it
    has continuously grown and is now used by one million users worldwide. OrangeHRM
    supports all the important aspects of HR management and is ridiculously easy to
    deploy and use. Given the ease of installation, configuration and use – and robustness
    – it is useful for all types of organisations, from startups to multinationals.
    In this tutorial we have used the stable release version 3.1.2.'
