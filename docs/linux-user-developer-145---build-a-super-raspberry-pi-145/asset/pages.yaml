  md: "# Model data using Qt\n\nLearn to handle hundreds of data items\n\n![](img/c7d3278283754436651c50a2e9c72912_44_0.png)\n\
    \n**Above** Data presentation widgets can come in two different groups\n\nimpact\
    \ when large amounts of files and folders are to be traversed.\n\n# Model-to-model\n\
    \nLarge and complex applications benefit from the ability to display the same\
    \ data set in different forms. Duplicating the information wastes memory and forces\
    \ developers to implement all kinds of synchronisation logic.\n\nIf the changes\
    \ are limited to changes in the sorting and filtering of the individual items,\
    \ a proxy model can be attached to the host model containing the actual data.\
    \ It rearranges and filters the elements in order to create an independent second\
    \ view of the information at hand.\n\nEven though our QFileSystemModel provides\
    \ the ability to sort and filter results, we will add a second layer for posterity\
    \ and effect.\n\nStart out by adding a new class to the project: Qt Creator’s\
    \ ‘Add Class’ wizard can be invoked via File>New File or Project. Select the C++\
    \ and group in order to find the C++ Class template. The new class is called ImagineFilterModel\
    \ in the example code – feel free to assign another name if you desire to do so.\
    \ The header file looks like the one shown in **Fig. 05**.\n\nQSortFilterProxyModel\
    \ is a QObject-derived class. Qt’s backend requires that the header of such classes\
    \ be marked with the Q_OBJECT macro, as you can see in **Fig. 05**.\n\nImagineFilterModel’s\
    \ constructor is populated with the bit of code in **Fig. 06**.\n\nClasses derived\
    \ from QSortFilterProxyModel need a source model which acts as the actual data\
    \ store. We simply assign the QFileSystemModel from above in order to prepare\
    \ the Adapter for insertion. Modify the form’s constructor in mainwindow.cpp in\
    \ order to inform it about ImagineFilterModel (**Fig. 07**).\n\n> “ Treeviews\
    \ do not permit users to sort their content by default ”\n\n```\n```cpp\nFig 08\n\
    class ImagineFilterModel:public QSortFilterProxyModel\n{\n        Q_OBJECT\npublic:\n\
    \        ImagineFilterModel(QObject *parent = 0);\nprotected:\n        bool lessThan(const\
    \ QModelIndex &left, const QModelIndex &right);\n};\n```\n```\n\n```\n```cpp\n\
    Fig 09\nbool ImagineFilterModel::lessThan(const QModelIndex &left, const QModelIndex\
    \ &right)\n{\n        QFileSystemModel* myModel=(QFileSystemModel*)sourceModel();\n\
    \        QString leftName=myModel->fileName(left);\n        QString rightName=myModel->fileName(right);\n\
    \        if(leftName.compare(rightName)<=0)return true;\n        return false;\n\
    }\n```\n```\n\n```\n```cpp\nFig 10\nMainWindow::MainWindow(QWidget *parent) :\n\
    \        QMainWindow(parent),\n        ui(new Ui::MainWindow)\n{\n        ui->setupUi(this);\n\
    \        ImagineFilterModel* myModel=new ImagineFilterModel((QObject*)this);\n\
    \        ui->treeView->setModel(myModel);\n        ui->treeView->setSortingEnabled(true);\n\
    }\n```\n```\n\nRunning the program in its current state yields an unfiltered treeview\
    \ showing the contents of your file system. Let us proceed to changing the sort\
    \ order so that files and folders will be shown in a strictly alphabetic fashion\
    \ (eg without the precedence which is normally given to folder objects).\n\nQSortFilterProxyModel\
    \ comes with sorting logic. Sadly, the class cannot channel how you wish the items\
    \ to be arranged. This information is to be passed in via a virtual method which\
    \ can be overridden in the header (**Fig. 08**).\n\nFor our example, check out\
    \ **Fig. 09**, where the comparison found will suffice in order to get the desired\
    \ results.\n\nTreeviews do not permit users to sort their content by default.\
    \ This can be solved by setting sortingEnabled to true (**Fig. 10**).\n\nRun the\
    \ example in its current form in order to see a finely-interwined list of files\
    \ and folders.\n\n# Conclusion\n\nWith that, our journey into the fascinating\
    \ world of Qt ends for another issue. Even though getting familiar with models\
    \ might take a bit of time, the skills gained in the process involved will pay\
    \ out twofold in the long run simply because a well-structured application is\
    \ so much easier to debug and maintain. Eventually, it will save you both time\
