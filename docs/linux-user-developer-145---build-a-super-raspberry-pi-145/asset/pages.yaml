- pgno: 30
  md: '# Monitor a Cisco router using MRTG


    Start using MRTG and its tools to monitor traffic loads


    ![](img/c7d3278283754436651c50a2e9c72912_30_0.png)


    ![](img/c7d3278283754436651c50a2e9c72912_30_1.png)


    # 01 Install MRTG


    Most Linux distributions have a ready-to-install MRTG package you can use. MRTG
    is a Perl script, therefore you can easily make changes to it if you want to modify
    something.

    If you are going to run MRTG as the Apache user, which is recommended, your first
    need to do the following as root, provided that the Apache process is owned by
    the www-data user (adapt the command according to your Linux system):


    ```

    $ chown www-data:root /var/lock/mrtg

    ```


    ![](img/c7d3278283754436651c50a2e9c72912_30_2.png)


    # 02 About SNMP


    SNMP is a known TCP/IP protocol that is available for most ''clever'' devices,
    including Linux and other UNIX machines, routers, network switches, Windows machines
    and many others.

    It provides statistics on the status of network interfaces, incoming and outgoing
    traffic, dropped datagrams and error messages, and it allows clients to access
    these statistics easily and remotely.


    ![](img/c7d3278283754436651c50a2e9c72912_30_3.png)


    # 03 Useful SNMP commands


    SNMP comes with many commands, including snmpbulkget, snmpd, snmptrap, snmptrap,
    snmpbulkwalk, snmpget, snmpstatus and snmpwalk. By far the most useful of them
    is the snmpwalk command that retrieves a subtree of values using SNMP GETNEXT
    requests.

    If the community string name is wrong or the device does not currently support
    SNMP, the output of the snmpwalk command will look similar to the following:


    ```

    $ snmpwalk -0s -c LUD -v 1 cwfi

    Timeout: No Response from cwfi

    ```


    # 04 Configure MRTG


    Configuring MRTG can be the most difficult part of the whole process - especially
    when you are dealing with a non-standard network device, as you may have trouble
    finding the correct object identifier to query. Cisco routers are popular devices
    so setting up SNMP on a Cisco network device is a well-known process, but finding
    the correct object identifier can always be tricky.


    ![](img/c7d3278283754436651c50a2e9c72912_30_4.png)


    # 05 Cisco IOS


    The first thing to do on the Cisco 877W ADSL router is to turn on SNMP and create
    an SNMP community string that will help you acquire the desired information. Cisco
    IOS has many cryptic commands, so type carefully.

    The RO (read-only) community string (LUD) permits Get requests only, whereas an
    RW (read-write) community string - which is not needed here - allows both Get
    and Set requests.

    The following command, which produces many lines of output, will verify that the
    SNMP setup on a router named Cisco is working properly:


    ```

    $ snmpwalk -0s -c LUD -v 1 cisco

    ```


    ![](img/c7d3278283754436651c50a2e9c72912_30_5.png)


    # 06 Configure Apache


    You should set up Apache so that you can see the static HTML output of MRTG not
    only locally but also from your network or the internet. You can do this by using
    a subdomain. The subdomain that will be used here is mrtg.mtsoukaloos.eu - yours
    will vary - and it requires the addition of a new DNS entry. After configuring
    Apache, and do not forget to enable the new site and make Apache use the new configuration:


    ```

    # a2ensite mrtg.mtsoukaloos.eu

    # /etc/init.d/apache2 reload

    ```


    ![](img/c7d3278283754436651c50a2e9c72912_30_6.png)


    # 07 MRTG files and directories


    One thing that you should carefully consider is the fact that the directory where
    MRTG keeps its files should have the necessary UNIX permissions in order to be
    read and written by the user that runs the MRTG Cron job.

    The structure of the directory where MRTG keeps its files is pretty simple: it
    has just one directory with plenty of files corresponding to the supported interfaces
    and devices.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Tutorial


    # 08 The cfgmaker utility


    The cfgmaker MRTG utility is used for creating configuration files easily. It
    may add unnecessary data that you should clean up later, but what it creates is
    a great starting point. You usually run it as follows:


    # Tips


    # If it''s possible, use an internal interface


    Each ADSL router has two IP addresses: one for the internal network and one for
    the external. When possible, use the IP of the internal network to query your
    device because it is more secure and quicker.


    # Do not turn off your router


    If the network device is turned off or is unreachable then MRTG will use the previous
    value until it can get a new one, so you are going to see straight lines on the
    output.


    # Security


    Watching the output of MRTG can tell you many things about your network, so make
    it a habit to watch it. Seeing too much traffic during weekends or having strange
    peaks is a security warning that will need further investigation.


    # Log files contain data


    MRTG names the files where it keeps its SNMP data with the .log extension. For
    example, for the cwilf device, the log file is called cwilf.log.


    # Test the maximum speed


    It is considered a good practice to test the maximum speed of an ADSL router by
    downloading a big file and watching the output of MRTG.


    ![](img/c7d3278283754436651c50a2e9c72912_31_0.png)


    ```

    # cfgmaker --global "\"WorkDir\ /srv/www/mrtg.mtsoukalos.eu/public_html" LUD:2.86.5.103
    > mrtg.cfg

    ```


    This command creates mrtg.cfg in the current working directory, using the /srv/www/mrtg.
    mtsoukalos.eu/public_html directory for writing the output, and it queries a machine
    with the 2.86.5.103 IP address using the "LUD" community string.


    The mrtg.cfg file automatically generated by cfgmaker is very busy, so you will
    have to spend some time cleaning it up to leave only the interfaces that really
    interest you.


    # 09 The indexmaker utility


    After generating the MRTG configuration file using cfgmaker, you should create
    an index HTML page that will allow you to access the output of MRTG. This task
    can be done using the indexmaker utility, which also comes with the mrtg package,
    as follows:


    ```

    $ indexmaker mrtg.cfg > index.html

    ```


    Now you can point your browser to the right URL as defined in Apache or to a local
    file, depending on where you put MRTG''s index.html file, to view MRTG''s information.
    The image files haven''t been created yet, so the output will look unpleasant.


    ![](img/c7d3278283754436651c50a2e9c72912_31_1.png)


    # 10 Run MRTG


    There are two ways of running MRTG, manually or as a Cron job. The first way is
    useful for testing and debugging purposes. The second way is the preferred way
    of running MRTG. It is best to run the MRTG Cron job as the user


    who owns the Apache process. The following command will reveal that user:


    ```

    $ ps waxf | grep -i apache

    ```


    The first time you run it, you will see many errors and warning messages due to
    the fact that all output and data files were missing and MRTG had to create them
    all. If everything is fine, your next task will be to set up MRTG to run as a
    Cron job.


    On a Debian 7 system the MRTG executable needs to run as root, because MRTG will
    most likely not work properly when the environment variable LANG is set to UTF-8:


    ```

    # env LANG=C mrtg ../mrtg.cfg

    ```


    ![](img/c7d3278283754436651c50a2e9c72912_31_2.png)


    # 11 Configure Cron


    Setting up Cron for the www-data user requires running the following command as
    root:


    ```

    # crontab -u www-data -e

    ```


    Cron is a reliable service, so once you see that MRTG runs fine as a Cron job
    you will not have any other problems. MRTG produces its HTML and images files
    in the directory that was defined when you ran the cfgmaker utility.


    ![](img/c7d3278283754436651c50a2e9c72912_31_3.png)


    # 12 A closer look at the configuration file


    The Cisco SNMP OIDs (object identifiers) of interest for the used device are 1.3.6.1.2.1.2.2.10.10.10.14,
    which returns the incoming traffic for the ADSL connection,


    32

    www.linuxuser.co.uk'
