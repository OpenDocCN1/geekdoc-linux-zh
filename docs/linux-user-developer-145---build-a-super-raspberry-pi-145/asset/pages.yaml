    # Monitor a Cisco router using MRTG


    Use MRTG and its tools to monitor router traffic after setting up SNMP on Cisco
    IOS


    MRTG (Multi Router Traffic Grapher) is a tool for plotting free numerical data
    written in Perl by Tobi Oetiker. MRTG generates its output in HTML format and
    provides a live visual representation of the traffic load on network devices.
    MRTG is an essential tool for every system and network administrator and works
    with any device that supports SNMP. By viewing the output of MRTG you can quickly
    examine the traffic of an interface and make valuable decisions based on it. This
    issue we will show you how to use MRTG to display the daily, weekly, monthly and
    yearly ADSL traffic of a Cisco 877W router with a little help from SNMP (Simple
    Network Management Protocol). You will need to access and configure your Cisco
    router and allow access to it from the Linux machine where MRTG will run.


    # Advisors


    ![](img/c7d3278283754436651c50a2e9c72912_29_4.png)


    Mihalis Tsoukalos is a UNIX administrator, a programmer (UNIX and DOS), a DSA
    and a mathematician. He has been using Linux since 1993. You can reach him on
    Twitter at @mcastousk and at www.mtsoukalos.eu


    # Resources


    +   * MRTG oss.oetiker.ch/mrtg

    * Cisco Mibs cisco.com/public/sw-center/netmgmt/smib/mibs.shtml

    * SNMP RFCs bit.ly/CaQ7O

    * Cacti cacti.net

    * RRDtool oss.oetiker.ch/rrdtool'
