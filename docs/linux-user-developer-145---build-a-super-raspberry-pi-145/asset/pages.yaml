  md: '# # Model data using Qt


    Handling a dozen items is not a problem. Increase this number to a few hundred,
    though, and problems can arise


    ![](img/c7d3278283754436651c50a2e9c72912_41_0.png)


    # ## Advisor


    Tam Hanna has been in the IT business since the days of the Palm IIlc. Serving
    as journalist, tutor, speaker and author of scientific books, he has seen every
    aspect of the mobile market more than once


    Even though there is no law which prevents you from trying your hand at such a
    program, consider yourself informed that a large variety of amusing problems will
    occur. First of all, prepare to accommodate your users to an ultra-slow and permanently-refreshing
    user interface.


    Keeping large amounts of data in the stores of list and table widgets is a sure-fire
    way to solicit angry calls from users bored to death by the slowness of your code.


    If this is not enough to deter you, consider yourself informed now that you should
    accommodate yourself with all kinds of weird problems in relationship to data
    management. Filtering or sorting the records displayed will turn into a truly
    Herculean task.


    Fortunately, Qt provides a highly efficient way to work around this problem. Many
    years ago, a programming language called Smalltalk introduced the world to the
    concept of the Model-View-Controller design pattern. A framework adhering to this
    standard provides its users with special classes which will encapsulate data storage.


    Display is then accomplished by connecting them to a view. Your business logic
    can proceed to changing the information shown on-screen without concerning yourself
    of the tedious task of updating the widget''s internal data store.


    With Qt, using models are especially rewarding. The framework comes preloaded
    with a large variety of classes that can display all kinds of useful data.


    ![](img/c7d3278283754436651c50a2e9c72912_41_1.png)


    Above Our data model provides file system information to the treewiew


    Let us start out by creating a little application that shows the file system of
    the host computer in a treewiew. Open Qt Creator and use the New Project wizard
    to build a new project based on Qt Widgets. Double-click mainwindow.ui in order
    to make Qt Creator open the form in the user interface designer.


    Look at the left of the screen. Your toolbox should contain two groups of controls
    which are dedicated to displaying lists and other information: item views and
    item widgets. Item widgets provide an ''embedded'' storage for the items, whereas
    views must be connected to models in order to function properly.


    # ## File system made easy


    Developers seeking to get started with a new programming language eventually end
    up writing a parser for the file system of their target platform of choice. This
    exercise is of superior didactical value, which is why we took you through it
    a few issues ago.


    Introducing models makes the situation a lot easier. Grab a ''Treewidget'' from
    the toolbox and drag it into the middle of the form. Then, open mainwindow.cpp
    and change the form''s initialisation method so that it looks like the code in
    Fig. 01.


    We start out by invoking the setupUi method which is located in the ui object.
    It was created by a tool called uic (User Interface Compiler), and it acts as
    a ''broker'' between our application as well as the code generated from the UI
    file.


    In the next step, a new instance of QFileSystemModel is created. By making it
    a child of the form, we ensure that the parent-child system will remove the instance
    if the user decides to close the window in question. Calling setRootPath informs
    the model that it is to process a specific path.'
