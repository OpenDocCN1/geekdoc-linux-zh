  md: '# # Review


    ![](img/c7d3278283754436651c50a2e9c72912_79_0.png)


    MINI PC


    # # HummingBoard-i2eX


    Can this publicly-released version of SolidRun''s internal developer design, Carrier-One,
    dethrone the bestselling Pi single-board computer?


    **Pros**

    HummingBoard''s performance is exemplary and the top-end model includes features
    are rare this end of the market.


    **Cons**

    The large heatsink means most Pi GPIO add-ons won''t work and prevents the board
    from fitting in most existing cases


    Straight from the box, the HummingBoard-i2eX surprises: it packs the biggest factory-fitted
    heatsink of any similar device we''ve tested, a mighty aluminium block bolted
    to the processor and memory, which is responsible for the board''s 23mm overall
    height and scale-tipping 71g weight – nearly double that of the Raspberry Pi.
    It also harms compatibility: Raspberry Pi add-on boards will not fit without the
    use of risers to the GPIO port and the HummingBoard-i2eX is too bulky for most
    – but not all – Raspberry Pi cases.

    At first, the presence of the heatsink seems odd: rival boards do with no cooling
    at all, or have tiny heatsinks no larger than the chip on which it sits. During
    use, however, the heatsink''s surface hit 75°C, explaining the presence of both
    the heatsink and the warning sticker that adorns its surface. It may also explain
    why the previously announced quad-core variant has yet to appear on the market.


    The HummingBoard is, in fact, an entire family of devices. Unlike the Raspberry
    Pi from which they have undeniably drawn inspiration, the HummingBoards are not
    single-board computers (SBCs) at all, but computer-on-module (CoM) units with
    a carrier board, hence its original name ''Carrier-One''. As well as a choice
    of three processors – the Freescale i.MX6 Solo, Dual-Lite or Dual – the family
    includes two carrier boards. The base board is available on the i.MX6 Solo and
    Dual-Lite variants and matches the Raspberry Pi''s feature set, bar the lack of
    DSI and composite video output; the top-end ''eX'' board adds LVDS video, gigabit
    Ethernet, mSATA and mini-PCI Express connectivity, and is exclusively available
    with the i.MX6 Dual processor, which features a more powerful GC2000 graphics
    processor than the Dual-Lite variant''s GC880.

    In theory, there''s no real reason for this; the CoM design, in particular the
    way it connects to the carrier board, is identical.'
