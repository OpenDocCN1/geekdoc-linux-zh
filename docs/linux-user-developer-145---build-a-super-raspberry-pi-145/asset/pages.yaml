    \ from previous programs or runs.\n\n17  Use PinMode\nThe numbers on the PinMode\
    \ variable handles the GPIO port (X) as well as whether it’s an output (1) or\
    \ input (0). It is therefore constructed like so for GPIO X as an output:\n\n\
    ```\nPinMode (X,1)\n```\n\nDigitalWrite is constructed similarly for output pins,\
    \ with 1 being on and 0 being off.\n\n18  IFTHE\nUnlike other coding languages,\
    \ when you create an IF statement you need to make sure THEN is appended to let\
    \ BASIC know that the following code is for a True situation.\n\n19  digitalRead\n\
    As pin 7 in this code is set as an input, we want to read when it’s activated\
    \ (ie when the button is pressed). Our button completes the circuit when pressed\
    \ so the read needs to be 1.\n\n20  ENDIF\nLet the code know when the IF statement\
