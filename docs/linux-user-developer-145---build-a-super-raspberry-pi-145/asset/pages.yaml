    # **Bob**


    You are quite right – it will take quite a while; about the speed of transferring
    between two separate disks, so it will take some time to process.


    Probably the best method is to create a subvolume and then re-link copies to this
    subvolume. It won’t use any extra space, and it also then lets you delete the
    original version of the data. You can do this with:


    ```

    ```

    # cd /mnt/[location]

    # btrfs subvolume create subvol1

    # cp -pr --reflink=always dir1 dir2

    dir3 subvol1/

    # rm -rf dir1 dir2 dir3

    ```

