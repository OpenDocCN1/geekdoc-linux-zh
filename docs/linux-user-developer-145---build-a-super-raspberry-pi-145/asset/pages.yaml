  md: '# Resoresces


    Find out more about MPI, Python and other ways to make use of your Super Pi


    # Open MPI


    open-mpi.org


    **Open MPI (right)** is the implementation of MPI that our Python module uses
    to send and receive data over the Raspberry Pi network. It supports all three
    major versions of MPI and, importantly, provides it in an open source format for
    everyone to use. There''s full documentation for the extended library on the forums
    (**www.mpi-forum.org**) if you need to extend it, past Python programs and take
    a little more control of what you''re calculating and how.


    ![](img/c7d3278283754436651c50a2e9c72912_56_0.png)


    # mpi4py documentation


    pythonhosted.org//mpi4py/usrman/index.html


    The Python module we''re using has many more functions than the one we''re using,
    and they''re all contained in the documentation available on their website. You
    can learn how to do much more than just multiply numbers, as we showed you in
    our example, including the use of wrappers for other code, matrices of data and
    a couple other functions. It''s very flexible and still in development so it''s
    worth checking in on it and the change logs every now and then for new or different
    functions.


    You can learn how to do much more than just multiply numbers


    ![](img/c7d3278283754436651c50a2e9c72912_56_1.png)


    ![](img/c7d3278283754436651c50a2e9c72912_56_2.png)


    # Raspberry Pi forums


    raspberrypi.org/forums


    For anything going wrong with your Pi beyond MPI, your first port of call should
    always be the Raspberry Pi forums. The users are well experienced in using the
    Raspberry Pi and Linux, and will usually be able to help out. If you can give
    precise details and log files along with your post, they might be able to help
    you quicker.'
