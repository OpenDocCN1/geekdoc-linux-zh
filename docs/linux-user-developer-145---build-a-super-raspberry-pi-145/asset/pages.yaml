  md: '# THE OPEN START-UPS COLUMN


    # Free or open?


    Developers who depend on open source software want to give back to the community,
    so how do start-ups square this with commercial pressure?


    ![](img/c7d3278283754436651c50a2e9c72912_12_0.png)


    **Richard Smedley** is a Unix-and-networking jack-of-all-trades, specialising
    in free and open source software


    ![](img/c7d3278283754436651c50a2e9c72912_12_1.png)


    > Right! Moltin is an eCommerce platform providing an API for easily managing
    stores and shopping carts


    Newspaper headlines occasionally remind us that ‘UK business lags in open source
    adoption’ but more pertinent to the UK free software community is the question:
    **what are businesses contributing back?** Start-up companies tread a fine line
    here between the open source culture that most coders now inhabit and the demands
    for protection of so-called Intellectual Property (read more at www.gnu.org/philosophy/not-ipr.en.html)
    from their backing investors.


    Some companies release final products lacking certain features unless you purchase
    the non-open version. Another alternative is to release the tools and platforms
    that helped you build your project – such as Rails, which came from Basecamp.
    One good example here is Moltin, a Newcastle-upon-Tyne-based start-up on the Ignite100
    start-up accelerator programme, which provides an API and SDK for building eCommerce
    sites and is aimed at removing the pain that developers experience using current
    solutions.


    “We wanted to provide developers with a number of components allowing them to
    create simple stores while still providing the more complex aspects in our commercial
    service,” Moltin co-founder Adam Sturrock told us. Coming from the frustrations
    of working with eCommerce software as a developer at a web agency with fellow
    founder Jamie Holroyd, this was software very much driven by the need to fill
    a void for users, but licensing decisions have been business-driven: “We spent
    a while thinking about what made sense for us to release as open source and what
    to keep internal, and [we] feel we struck a good balance in the end. Going forward
    we have a number of additional projects and tools that we would look to open source.”


    Moltin have released open source PHP and JavaScript SDKs that handle the authentication
    process, “allowing] developers to start making API calls even faster”, says Sturrock
    of some of their software made available on their Github page and at packageist.org.


    This pattern of giving back to the developer community, and not having a total
    commitment to free software can be seen across the web developer community, and
    a casual trawl through Github shows huge numbers of Ruby and JS tools for developers,
    as well as PHP libraries. “Our administration dashboard is built using our PHP
    SDK, the Slim PHP framework and Twig template engine,” says Sturrock.


    “We are aiming to open source this in the near future for developers and agencies
    to improve, white-label and adapt.


    “We have also built a number of tools using our SDKs to help jump-start development
    further with AngularJS-powered stores and a PHP frontend framework similar to
    our admin dashboard.” It does have some advantages of course: “We tend to get
    a wide range of contributions from our users, ranging from fixing typos to bug
    fixes and additions/enhancements.


    We also get a number of feature requests for each of our packages which we evaluate
    to see what makes sense for everyone using it, trying to avoid adding features
    that have a slims use case”


    As we mentioned last month, without free and open source software so much of what
    start-ups do simply wouldn’t be possible. “Our REST API uses OAuth 2.0 to authenticate
    requests,” says Sturrock. “Our API backend is built using many open source projects.
    The backend is written in the PHP Laravel framework and our databases run PostgreSQL
    and Redis. This means our API is infrastructure agnostic and we can be hosted
    and run from anywhere including our local machines to multi-server setups”.


    Next month we look at where GNU/Linux and FOSS fits in with some of the better-known
    financially successful tech start-ups.'
