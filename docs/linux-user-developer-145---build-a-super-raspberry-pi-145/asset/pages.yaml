  md: "# Model data using Qt\n\nLearn to handle hundreds of data items\n\n![](img/c7d3278283754436651c50a2e9c72912_42_0.png)\n\
    \n# Model-View-Controller\n\n# Breaking down large systems\n\nArranging systems\
    \ according to predefined steps helps new developers get up to speed faster. This\
    \ is accomplished via a group of architectures which are now known as design patterns.\
    \ The Model-View-Controller pattern is among the oldest – it was introduced in\
    \ a time when the word design pattern itself had not yet been formed.\n\nMVC-based\
    \ applications are made up of three parts. The model contains the actual data\
    \ which is to be used and managed. Most implementations also place the business\
    \ logic inside it. Changes occurring in the model can be pushed out to 'interested\
    \ observers'.\n\nModel data is rendered and displayed in views. A view knows about\
    \ the controller and the model supplying it with information, but does not, usually,\
    \ contain any kind of logic for handling user input. While views tend to be responsible\
    \ for the actual rendering, they usually do not work with the data (for filtering,\
    \ etc).\n\nControllers act as 'glue' between the two aforementioned objects. They\
    \ tend to be responsible for filtering and sorting, and furthermore handle user\
    \ input. Some implementations share the burden of input handling between the controller\
    \ and the model: if the latter contains the business logic, duplication would\
    \ occur if all input must be processed in the controller.\n\n```\n```cpp\n#include\
    \ <QFileSystemModel>\n\nMainWindow::MainWindow(QWidget *parent) :\n\tQMainWindow(parent),\n\
    \tui(new Ui::MainWindow)\n{\n\tui->setupUi(this);\n\n\tQFileSystemModel *myModel=new\
    \ QFileSystemModel(this);\n\tmyModel->setRootPath(\"/\");\n\tui->treeView->setModel(myModel);\n\
    }\n```\n```\n\nWith that, the model is ready to be assigned to the view. This\
    \ is accomplished by calling the setModel method of treeView. Feel free to run\
    \ the app in its current state – when running on a 'nix operating system the tree\
    \ will display an expandable list of the files and folders found on your machine.\n\
    \nIn fact, QFileS ys temModel even handles multithreading for you. File system\
    \ traversal is handled by a background thread which pushes results to the GUI.\
    \ Sadly, this means that the data stored in the code behind can not be accessed\
    \ immediately – you should wait until the rowCount() property stops returning\
    \ to zero.\n\n# Putting models to work\n\nEven though displaying the contents\
    \ of the file system is not a small feat by any means, our QFileS ys temModel\
    \ is able to accomplish much more. As an example, let us add a name filter which\
    \ ensures that the tree contains only JPG files.\n\n```\n```cpp\nMainWindow::MainWindow(QWidget\
    \ *parent) :\n\tQMainWindow(parent),\n\tui(new Ui::MainWindow)\n{\n\tui->setupUi(this);\n\
    \n\tQFileSystemModel* myModel=new QFileSystemModel(this);\n\tmyModel->setRootPath(\"\
    /\");\n\tQStringList *myStringList=new QStringList();\n\tmyStringList->append(\"\
    *.jpg\");\n\tmyStringList->append(\"*.jpeg\");\n\tmyModel->setNameFilters(*myStringList);\n\
    \tmyModel->setNameFilterDisables(false);\n\tui->treeView->setModel(myModel);\n\
    }\n```\n```\n\n```\n```cpp\n#include <QModelIndex>\n\nclass MainWindow : public\
    \ QMainWindow\n{\n\tQ_OBJECT\npublic slots:\n\tvoid itemDoubleClicked(QModelIndex\
    \ _anIndex);\n\t.\n.\n.\n```\n```\n\nThis can be accomplished by modifying the\
    \ constructor of the main form once again. The new version of the method looks\
    \ like the example in Fig. 02.\n\nQStringList is a framework-provided helper class\
    \ dedicated to the management of a group of strings. Our example code creates\
    \ an empty instance and proceeds to add two strings containing regular expressions\
    \ to it. The resulting convolute is then passed into setNameFilters, where it\
    \ is used for parameterising the traversal function. Setting nameFilterDisables\
    \ to false ensures that results which do not match the patterns are not displayed\
    \ – passing true would make them appear in grey.\n\nWith that, our file tree is\
    \ now limited to displaying files which pose as pictures. Run the application\
    \ once again in order to confirm that non-image files are no longer showing up\
    \ in the treeview.\n\n# Accessing model data\n\nApplications based on the Model-View-Controller\
    \ pattern are not limited to displaying data found in the model. Well-implemented\
    \ model classes provide a variety of ways which permit their users to interact\
    \ with the data stored within – our QFileSystemClass is no exception to this rule.\n\
    \nLet us expand our file viewer by adding a feature which provides further information\
    \ about a double-clicked item. This requires us to connect the treeview's doubleClicked\
    \ signal with a newly-created slot in the main form.\n\nClick the Signal/ Slot\
    \ editor in the toolbar in order to inform Qt Creator about your intent to create\
    \ connections between signals and slots. Drag a line from the treeview and drop\
    \ it on the form. Qt Creator will respond by opening"
