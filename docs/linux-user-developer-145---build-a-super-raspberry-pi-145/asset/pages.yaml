  md: '# # 10 Years of Ubuntu


    Celebrate the distro''s birthday with a look back at its history


    # FEATURE


    ![](img/c7d3278283754436651c50a2e9c72912_18_0.png)


    Left The basic GNOME desktop from the time. The live disc and install disc were
    once two separate images


    # ## The Linux landscape


    Alan gave us an apt description of how Linux was in 2004


    > > "At the time I had a Philips webcam; on both Red Hat and Debian there was
    some trouble with it and I used to have to keep recompiling my kernel. That seemed
    like the thing that people did in those days. Something doesn''t work, so you
    then get the kernel source and you run these obscure commands that may or may
    not work and may take a long time; eventually you get kernels that may or may
    not work. It may not even boot and, if it does boot, well maybe your webcam works,
    maybe it doesn''t. I installed Ubuntu and my webcam just worked out of the box.
    I didn''t have to do anything and I thought this [has] got to be the way forward."


    # ## Development up until the first beta had been somewhat secret


    "To be honest it was still pretty much by developers, so the immediate coverage
    was quite low. I produced some famous German computer news magazines and [at]
    first they said, ''Yeah it''s just another distro – why should we report about
    this?''"


    Development up until the first beta had been somewhat secret and while the first
    release may have ''only'' scored a few thousand users, its name started to grow
    throughout the Linux and open source community.


    "I was in my local Linux User group in Hampshire and one of my friends knew that
    I was quite into Debian," Alan Pope, applications project manager, recalls. "He
    mentioned this thing, this new thing that was being developed by some crazy South
    African. I''d never heard of it as I wasn''t on any Debian mailing list and I
    wasn''t really involved with the Debian community or anything. But it looked quite
    nice and I installed it. That was late 2004 and that''s pretty much it – I''ve
    used it solidly ever since."


    While a small release at the time, 4.10''s legacy is massive. It was relatively
    easy to install, had a desktop from the start that was preconfigured and would
    automatically mount flash storage. These elements have since been expanded upon
    greatly.


    The developers were proud of their work and it wasn''t long before 5.04 was in
    development. The next two years were very important for Ubuntu and would establish
    it as a household name among users and developers alike.


    ![](img/c7d3278283754436651c50a2e9c72912_18_1.png)


    Above The original splash with the original logo. Ubuntu''s preferences for orange
    has not changed much over the years


    # 8 July 2005


    # Ubuntu Foundation


    Created by founder Mark Shuttleworth, the Ubuntu Foundation is a trust fund to
    ensure the future of the distro. It''s currently dormant but Canonical plan to
    treat it as an emergency fund if necessary.


    ![](img/c7d3278283754436651c50a2e9c72912_18_2.png)


    # 1 June 2006


    # First LTS released


    The original Long Term Support release of Ubuntu was delayed a few months from
    its intended April release date, but when it did come out it signalled a turning
    point in Ubuntu''s popularity.'
