- pgno: 34
  md: '# Simplify HR management with OrangeHRM


    Maintain your company''s efficiency with the open source management tool


    ![](img/c7d3278283754436651c50a2e9c72912_34_0.png)


    ![](img/c7d3278283754436651c50a2e9c72912_34_1.png)


    # **01** Installation


    For Linux (and OS X) the source code is available for download as a ZIP file.
    Once you download it, just unzip and place the contents in the root folder of
    your webserver. You will need webserver and database preinstalled though – a LAMP/LAMP/MAMP
    server, for example. If you also need to set up OrangeHRM on a Windows system,
    a bundled installer is available – complete with web server and database. Once
    you''ve downloaded and unpacked everything that you need, access the folder via
    a web browser – the URL should be something like: http://localhost/orangehrm.
    If everything is fine, the set-up wizard welcomes you with an option to freshly
    install OrangeHRM or upgrade existing set up. As you proceed for fresh installation,
    you will need to provide the database root access (if the database for OrangeHRM
    is not created or just the details of database already created for OrangeHRM.
    You can then create the admin user ID and password. Finally, you have the optional
    registration before the installation finishes.


    ![](img/c7d3278283754436651c50a2e9c72912_34_2.png)


    # **02** Administration and configuration


    As you log in as an admin you can see several tabs corresponding to different
    functional areas. Under the Admin tab, you have the User Management, Job, Organisation,
    Qualifications, Nationalities and Configuration sections. You can set shift hours
    under the Job section. Employee qualifications can be set under Qualifications.
    Configuration lets you enable/disable different modules, configure email using
    sendmail or SMTP, and subscribe users to email notifications. While the other
    sections names are self-explanatory, there are few important tips you will find
    useful – User Management corresponds to the system users, and so you can''t directly
    add a user. You will need to add the employee first (more about that in the next
    step) and they can then be added as a system user under the User Management section.
    A user can have only two roles: ESS (employee self service) and admin. Roles are
    not to be confused with job titles; there can be several job titles (which can
    be created under the job section).


    # **03** Employee management


    The PIM, or Personal Information Management, section is the place where you can
    manage the employees'' data. Click on the Add Employee link and just fill the
    relevant details. If you select Create Login Details, a system user for the employee
    is created as well. Otherwise you can add employees as system users through the
    user management option under Admin tab. You may think that the fields for employee
    details are too few to capture all the details, but as you Click Save after filling
    the details, you can see the full view of the employee details page. This page
    lets you view and modify all the details related to an employee like personal
    details, contact info, dependents, salary, organisational hierarchy and much more.
    You can also add custom fields under employee details page – just go to the Configuration
    tab under the PIM section and click Custom Fields. There are a few option fields
    available as well.


    35 www.linuxuser.co.uk'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# # Tutorial


    ![](img/c7d3278283754436651c50a2e9c72912_35_0.png)


    ![](img/c7d3278283754436651c50a2e9c72912_35_1.png)


    **04 Leave management**


    The next section is the Leave section. When you go to the Leave tab, new subsections
    are visible: Entitlements, Reports, Configuration, Leave List and Leave Assignment.
    To set up Leaves, you can start with the Configuration tab.


    Here you can create leave types (like sick, casual and more), list out holidays
    for the year, configure *one year durations with leave entitlements* as valid.
    After Configuration, you can then head over to the Entitlements section; this
    is the place to add leave entitlement to employees. Based on these entitlements
    and corresponding leave balances, employees can then apply their leaves. The Leave
    List section shows the leave data for the total leave period. The Assign Leave
    section allows the admin to grant leave without the employee applying for it.


    **05 Time writing – attendance**


    Attendance tracking is a very sensitive issue, even a small error in logging the
    in and out times can cause big problems (at least for the reputation of an employee).
    OranageHRM provides a neat way to track the attendance. Just head over to the
    *Time* tab and you can see the Attendance section inside. Here you can view employee
    attendance records or configure things like whether or not an employee or supervisor
    can modify the attendance records.


    Note that if you''re currently logged in as admin, and to log attendance then
    you should be logged in to the system as an ESS user. Just make a user with the
    ESS role and log in. After that, just go to *Time > Attendance > Punch in/out*
    and click In. The system automatically logs the date and time. The page refreshes
    to show the Out option now.


    **06 Time writing – timesheets**


    While attendance is used to track the actual hours spent in office, timesheets
    generally track the time spent on various activities inside the office, and the
    data is used for budgeting purposes. So before adding timesheets, you need to
    add customers and corresponding projects. Also, with each project the related
    activities should be added. To add these details, head over to *Time > Project
    Info > Customers*. After adding the customer, add projects using the Project link
    just below Customers – activities can also be added in the same page. Now you
    are ready to add timesheets. As an admin, you can add or view the timesheets of
    all the employees just by going to *Time > Timesheets > Employee Timesheets*.
    This page also shows the submitted timesheets, which have actions pending from
    your end. An ESS user can add and edit their timesheets using their own login.


    ![](img/c7d3278283754436651c50a2e9c72912_35_2.png)


    **07 Performance management – employer**


    In this section we will have a look at how to set up performance management using
    the admin interface. The performance management in OranageHRM is based on KPIs,
    ie the key performance indicators. For every job title in the organisation, the
    corresponding KPIs, along with the maximum and minimum rating points, need to
    be created. Every employee can then be automatically evaluated based on the KPI
    of their job title. To select KPI go to *Performance > Add KPI*; You can select
    the job title and then add the KPI; the maximum and minimum ratings are optional
    but should be added to ensure uniformity in'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# # Simplify HR management with OrangeHRM


    Maintain your company''s efficiency with the open source management tool


    ![](img/c7d3278283754436651c50a2e9c72912_36_0.png)


    # 10 Reports


    ![](img/c7d3278283754436651c50a2e9c72912_36_1.png)


    ratings. You can check all the KPIs added in the KPI List page. After adding the
    KPI you need to go to the Add Review page to initiate the review process for an
    employee. In the next section we see how it all looks to the employees.


    ![](img/c7d3278283754436651c50a2e9c72912_36_2.png)


    ![](img/c7d3278283754436651c50a2e9c72912_36_3.png)


    interview results, offering the job and, finally, hiring. After you hire the candidate,
    the employee entry for the candidate is created automatically. You would need
    to manually create the login for the new employee though.


    # 08 Performance management – employee


    After the review process is initiated by the admin, the reviewer and the reviewee
    can view it under Performance>Reviews link. Only the reviewer can open it though,
    to add their reviews. After the reviewer adds reviews and ratings, and submits
    the form, the admin then needs to approve the review before it is made available
    to the employee. Once the admin approves the review, no further changes can be
    done – even by the admin. Note that the reviewer for an employee is completely
    independent of the organisational hierarchy, so anyone from the employee pool
    can be added as a reviewer for the employee.


    # 09 Recruitment


    OrangeHRM lets you manage the recruitment process as well. From publishing a vacancy
    to handling job applications to shortlisting and hiring – you can do it all with
    OrangeHRM. Let''s see how to get started. Click on the link Recruitment>Vacancies,
    this is the page where you can add the vacancies. As a vacancy is created, a web
    link and a RSS feed is created, which is available publicly. This link not only
    has the full vacancy details but also allows candidates to apply via a form. Later,
    as someone applies, the candidate page (next to vacancy link) automatically gets
    updated with the details. You can then click on the candidate name to manage the
    application. The application goes through the steps of shortlisting, scheduling
    interviews,


    # 10 Reports


    Several modules of OrangeHRM have the option to generate reports. Let''s have
    a closer look at what each one of them has to offer. In the PIM section, the Reports
    tab lets you create custom reports which once created can be saved and used later.
    As you click on Reports the Define Reports page appears. Here you can create reports
    related to employee data such as employee''s name, grade, job title, education
    and so on. The Leave section allows you to generate reports related to leave entitlements
    and leave usage. There are no custom reports here though; only a fixed set of
    reports. The Time section also has its own set of fixed reports. Project Reports
    shows the time spent on a project and its activities by all the employees, whereas
    Employee Reports shows the time spent by an individual employee, categorised by
    different projects and activities. Then while the first two are related to timesheets,
    Attendance Summary lets you see the attendance details of an employee.'
  merge: -1
