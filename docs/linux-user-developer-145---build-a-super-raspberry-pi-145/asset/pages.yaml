- pgno: 61
  md: "# Tutorial\n\n![](img/c7d3278283754436651c50a2e9c72912_61_0.png)\n\n# Step\
    \ 08\n\nBigTrak LED White (450nm)\n\nBigTrak IR LED Infrared (940nm)\n\nBigTrak\
    \ Battery Compartment\n\nBigTrak Motor 1\n\nBigTrak Motor 2\n\n04  Wire up the\
    \ IR LED\nNow that we know which two wires to use, they can be soldered onto a\
    \ connector. We’ve used a module connector for ease of connecting to the breadboard,\
    \ along with some heat shrink wire wrap to protect the soldered joints, which\
    \ will reduce the chance of an accidental short circuit.\n\n05  Re-attach the\
    \ power switch\nTurn the lid of the BigTrak upside down and locate the mounting\
    \ point for the power switch PCB. Carefully put the PCB into place and screw it\
    \ down to hold it securely.\n\n06  Transistors and resistors\nThe IR LED is going\
    \ to be powered from the Raspberry Pi’s 5V line, so to protect the GPIO pins from\
    \ this higher voltage, we’ll be using a 2N5551 transistor to amplify the output\
    \ from the GPIO pin, as well as several resistors to prevent too much current\
    \ being drawn.\n\n07  Wire up the components\nTransistors have three legs called\
    \ base, emitter and collector. We connect the emitter to the ground, the base\
    \ (via a 470Ω resistor) to GPIO pin 25 and the collector connects to the cathode\
    \ leg of the IR LED. To complete the circuit, the anode leg of the LED needs to\
    \ be connected (via a 47Ω resistor) to the 5V pin on the Raspberry Pi.\n\n08 \
    \ Install the software\nLIRC (Linux Infrared Remote Control) is a collection of\
    \ utilities that allows the Raspberry Pi to send and decode IR signals. We’ll\
    \ be using the `ircd` utility to launch the rockets. To install `lirc`, run:\n\
    \n```\nsudo apt-get install lirc\n```\n\n09  Enable the LIRC\nTo enable LIRC and\
    \ to tell it which GPIO pin to use as the transmitter pin, use:\n\n```\nsudo nano\
    \ /etc/modules\n```\n\n… and add the following lines, changing the value of `gpio_out`_\
    \ pin to the one that the IR receiver is connected to and setting the `gpio_in`_pin\
    \ to an unused pin. This version of the `lirc`_pi module will require both in\
    \ and out to be set.\n\n```\nlirc_dev\nlirc_rpi gpio_in_pin=4 gpio_out_pin=25\n\
    ```\n\n10  Configure the LIRC\nLIRC supports multiple ways of controlling IR,\
    \ so it needs to be configured to use the Raspberry Pi GPIO pins. To do this,\
    \ enter the following command:\n\n```\nsudo nano /etc/lirc/hardware.conf\n```\n\
    \n… and either copy the code below from FileSilo.co.uk or manually change the\
    \ DRIVER, DEVICE and MODULES lines to:\n\n```\nDRIVER=\"default\"\nDEVICE=\"/dev/lirc0\"\
    \nMODULES=\"lirc_rpi\"\n```\n\n11  Teach LIRC how to fire the rocket\nTo fire\
    \ the rocket we need to send the correct set of pulses through the IR transmitter\
    \ to trigger it. To learn these pulses, LIRC provides the `irrecord` utility which,\
    \ when combined with an IR receiver, allows us to record the IR pulses sent by\
    \ an unmodified BigTrak when it triggers its ‘fire’\n\n```\nlircd.conf\nbegin\
    \ remote\n\nname    BigTrak\nflags   RAW_CODES\neps         30\naeps        100\n\
    \nptrail      2026\ngap       60000\n\nbegin raw_codes\n\n        name    fire\n\
    \        3071    981   4053  2026  2026  4053\n        4053    2005  2026  4053\
    \  2026  10154\n        3050    981   4074  2005  2026  4053\n        4053   \
    \ 2005  2026  4053  2026  10154\n        3050    981   4053  2005  2026  4053\n\
    \        4053    2026  2026  4053  2026  10133\n        3050    981   4053  2005\
    \  2026  4053\n        4053    2005  2026  2026\n\nend raw_codes\n\nend remote\n\
    ```"
  merge: -1
