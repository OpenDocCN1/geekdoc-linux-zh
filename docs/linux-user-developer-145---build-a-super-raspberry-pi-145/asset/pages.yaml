- pgno: 55
  md: '# Tutorial

    How to use your Super Raspberry Pi


    # How to use your

    Super Raspberry Pi


    > Your supercomputer is ready to crunch some code. What will you have it do?


    ![](img/c7d3278283754436651c50a2e9c72912_55_0.png)


    ![](img/c7d3278283754436651c50a2e9c72912_55_1.png)


    # Donate power with BOINC


    BOINC is the computer network system that allows you to donate idle CPU power
    to crunch big data, such as folding proteins or analysing signals from the cosmos
    to look for alien life. There’s a specific app add-on for BOINC that lets you
    spread the workload across the MPI network and treat them all as extra CPU threads
    rather than extra units. The app details can be found here: bit.ly/1B8TS0w. The
    Ras Pi on its own won’t be able to add much to the pool, but linking several together
    can really boost the performance and create a powerful little node to help out
    with some projects. There are several ways you can donate processing power to
    involving science, medicine and maths. You can tweak BOINC to use more than just
    idling Pi power.


    # Modelling and simulations


    Python and other languages can be used to create models of complex systems. Such
    models can include planetary orbits and objects interacting with them, huge mathematical
    equations and any resulting graphs for tides, the weather and much more. Many
    of these use a lot of calculations and can be slow even on a normal PC. Give them
    a lot more cores and you can get much faster, and sometimes more accurate, results.
    Mathemtica also contains some level of cluster support that works via Open MPI,
    the software we’re using to link the Raspberry Pi network together. Wolfram has
    information on how it works and how to use it on their website (bit.ly/1oEYYb8),
    and it can really help with crunching the amount of data you can access and use
    in Mathematica.


    # Quick compiling


    Now you have a lot more processing power at your disposal, you can try compiling
    Raspberry Pi programs on the cluster rather than just on the single Raspberry
    Pi. These will only really work on another Raspberry Pi, though, and compiling
    on a single Raspberry Pi can be extremely time-consuming compared to compiling
    on a proper PC or laptop. There is, however, also a selection of MPI-only applications
    that can be built using your cluster to increase the functionality of cluster
    without relying on Python code. These must include specific MPI commands in the
    source code to make sure they run properly, which can be done a little differently
    than in our Python example. Look up the best practices for your programming language
    and if there are any extra modules or plugins you’ll need for it. You can test
    the code in a similar way to how we tested the Python code.


    ```

    ncg@superp1-berta:~/android/rom/kernel-4.0.9-ga34d56

