    # Raspberry Pi Operating Systems 2014


    Most people stick with Raspbian, but is that really the best OS for your Pi? Find
    out in this six-page super test!


    Pidora

    The Raspberry Pi Fedora Remix has come a long way since its initial launch, where
    it lost ground to Raspbian due to its sluggish, buggy behaviour. The new Pidora
    2014, built for ARMv6 architecture and featuring packages from Fedora 20, is impressive
    at first glance - but are the changes only skin deep?

    Download: bit.ly/1yqTQM


    RISC OS Pi

    A legacy of days gone by, RISC OS Pi is a distribution of the classic RISC OS
    for your Raspberry Pi. Developed by Acorn Computers for use on the ARM chipset
    that they also designed, RISC OS was forked after Acorn Computers was broken up
    in 1998 and it''s a continuation of this project that lives on in RISC OS Pi.

    Download: bit.ly/1ybrend


    Arch Linux ARM

    For the ultimate in resource-light, custom-built operating systems, nothing beats
    an Arch setup - that is, if you know how to set it up. The barrier to entry is
    steep with Arch, but if you''re looking to really learn the inner workings of
    Linux systems then few others will give you quite the same opportunity.

    Download: bit.ly/1yqSU2j


    Raspbian

    The Pi community''s distro of choice (with a little help from the Raspberry Pi
    Foundation), Raspbian is popular for a reason. We cast a critical eye over this
    Debian-based OS to see just what the real advantages and disadvantages are with
    this distro, and whether it still stands up against the challengers.

    Download: bit.ly/1spHsdp'
