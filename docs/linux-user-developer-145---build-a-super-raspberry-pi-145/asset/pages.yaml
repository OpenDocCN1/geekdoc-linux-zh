- pgno: 22
  md: '# 10 Years of Ubuntu


    Celebrate the distro’s birthday with a look back at its history


    ![](img/c7d3278283754436651c50a2e9c72912_22_0.png)


    > “I think we’ve been able to strike a balance between the company and incorporating
    community input”


    “These core apps specifically are done in collaboration with the Canonical design
    team, so the design team say ‘this is what we think a clock app should look like’
    and they provide that design to us.


    “We [looked] for people in the community who [wanted] to contribute an app to
    Ubuntu and sure enough we found a bunch of people who were willing to do so, and
    they created some of the apps that are going to ship on the many, many phones
    released over the course of the next year or so. That, for me, is brilliant. They’ll
    be able to go to the store and buy a phone and their own code is running on that
    phone.”


    “It’s been massive,” Richard confirms the community’s involvement. “The community
    is embracing everything that we [have done] and announced so fantastically well.
    A set of applications that are preinstalled on the phone have come from the community
    and there are hundreds more [that] people can download from the application store.”


    Richard also told us of some unspecified future announcements regarding the phone
    and an established roadmap for its development. What seems clear, though, is that
    the present and future of Canonical and Ubuntu owes a lot to the active community
    members who helped it grow. Jane reflected on this when we asked her about working
    with an open source company:


    > “I think we’ve been able to strike a balance between the company and incorporating
    the community input, work and enthusiasm quite well. It’s not always a smooth
    road – [there are] rocky bits as there are in any relationship or any company.
    I think it’s one of the most interesting bits about Ubuntu as a distro we continue
    even as we move into the phone and tablet world, and cloud on the server side.
    I think we continue to maintain a level of transparency and participation that’s
    unique.”


    ![](img/c7d3278283754436651c50a2e9c72912_22_1.png)


    Above Ubuntu Touch’s development is tied to Ubuntu for Android, the project for
    creating a dockable Ubuntu-running phone


    ![](img/c7d3278283754436651c50a2e9c72912_22_2.png)


    Above The apps are largely built by the community in conjunction with a proper
    design team


    # A message from Jane Silber


    “I personally, and we at Canonical, would like to thank our readers and people
    in the Ubuntu community who’ve participated, worked and celebrated with us over
    the last ten years. Clearly we wouldn’t be here without their contributions, and
    I know part of your audience (and) developers, Devs in particular continue to
    be a very important audience for us. We hope we continue to bring them the best
    development platforms and development tools from Ubuntu itself; from Juju to the
    ability to spin up Ubuntu images easily in the cloud, we value that developer
    audience and hope we can give them the best tools possible for the next ten years
    as well.”


    # Goodbye Ubuntu One


    3 July 2014


    After five years Ubuntu One is finally shut down. Due to the changing state of
    computing, Canonical felt it was no longer an effective service for their needs.
    Partnerships are the way forward for these kinds of applications.


    ![](img/c7d3278283754436651c50a2e9c72912_22_3.png)


    # Ubuntu is 10


    23 October 2014


    Coming out exactly ten years and three days after the original Ubuntu, 14.10 will
    continue the Warty Warthog’s legacy of an easy-to-use Linux distribution, albeit
    now with a more unique flair thanks to Unity.'
