- pgno: 38
  md: '# # Continous code analysis – part 1


    Set up a Jenkins integration server ready for SonarQube analysis


    ![](img/c7d3278283754436651c50a2e9c72912_38_0.png)


    ![](img/c7d3278283754436651c50a2e9c72912_38_1.png)


    +   01

    Jenkins installation


    **01 Jenkins installation**

    Jenkins is available for download as a WAR file that can be dropped into your
    favorite JEE container or can be executed directly with a `java -jar jenkins.war`
    command. Note that JDK and JRE are prerequisites for Jenkins. If you''d rather
    not go deep into the details, you can also download the native package for your
    operating system. These packages contain the WAR file and the other dependencies
    required all together. You just have to download and install them like any other
    application. As soon as the installation completes, Jenkins is accessible at `http://localhost:8080/`.
    Note that there is no admin (or any other) user created because anyone can access
    anything. This will change only after Jenkins'' security is set up, which is what
    we''re going to take a look at next.


    **02 Get started with Jenkins**

    To set up security, go to Manage Jenkins>Configure Global Security and click on
    the Enable Security checkbox. The security settings will open up and here you
    can select the ports, on which other slaves can connect with Jenkins; the security
    realm, ie the user authentication method using LDAP: the Unix user group, Jenkins
    DB and more, and also the user authorisation (or in other words, the user permissions).
    Adding users depends on the security realm you select here. If you use the Jenkins
    database, an option to manage users in the Manage Jenkins page comes up automatically.
    Go to this page and click on the Create User link to add users. You may want to
    configure privileges and access levels for different users as you begin to add
    them. This can be done by heading across to Manage Jenkins>Configure Global Security>Access
    control>Authorisation>Matrix-based security.


    Note that if you lock yourself out of Jenkins accidently, you can simply open
    up the `/var/lib/Jenkins/config.xml` file and set the `<useSecurity>` element
    to false, and also remove the authorizationStrategy and securityRealm elements
    from the file. Save the file, restart Jenkins and you should be able to work.


    **03 Jenkins jobs**

    As a continuous integration server, Jenkins can take source code directly from
    your file system or even source code management system and then build it. This,
    along with pre- and post-build options and other features, enables you to experiment
    and configure tasks exactly as you need them. The various project builds/jobs
    supported by Jenkins are:


    **Freestyle software build**

    It lets you use any SCM combined with any build process. You can also run shell/batch
    scripts, invoke and more while building the software. If you are not sure about
    the build type while setting up Jenkins, you should probably use this.


    **Maven**

    Two-thirds of projects are specific to Maven projects and they analyse the `pom.xml`
    file in great details.


    **Multi-configuration project**

    This will let you set up projects which may need more than one configuration,
    for example builds which are specific to different platforms. This is quite similar
    to the freestyle software build with an addition of configuration matrix which
    helps you set up different configurations.


    **Monitor an external job**

    Jenkins can be used as a dashboard to monitor jobs run on external systems using
    this option. However, it may not be available by default, in which case you''ll
    need to enable the external-monitor-plugin under the plugins page.'
