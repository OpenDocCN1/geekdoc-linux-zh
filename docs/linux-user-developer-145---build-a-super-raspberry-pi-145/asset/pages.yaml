    # WIN A BITSCOPE MICRO


    The BitScope Micro is a pocket-sized oscilloscope that also functions as a waveform
    and clock generator, as well as a spectrum and logic analyser. It''s an essential
    tool if you serious about electronics, as you can use the BitScope to observe,
    measure and analyse signal voltages, and even capture both digital and analogue
    signals simultaneously. It''s also user-programmable with C/C++, Python and Pascal
    for integration into any project, whether that''s engineering, scientific research,
    education or simply some weekend hardware hacking. It also works in hot or wet
    field conditions, making it ideal for technical outdoor projects or even attaching
    to drones (it weighs in at just 12 grams).


    Find out how to use the BitScope Micro with your Pi over on page 30, and enter
