    \ updating\neverything is crucial\n\n# Other\nlibraries\n\nThe mpi4py library\n\
    can also be used\nwith Numpy, the\nnumerical and\nmathematics\nmodule for Python.\n\
    This can be installed\nusing sudo apt-get\ninstall python-\nnumpy, and is very\n\
