  md: '# RISC OS


    # The Acorn Computers OS keeps on going and keeps on being updated


    The last time we did a PI OS group test we slightly enjoyed the blast from the
    past that was RISC OS, remembering our time in school using Acorn Computers that
    our Tesco Computers for Schools vouchers paid for. We came away realising that
    the tint on our rose glasses was a bit strong and struggling to get any screenshots
    off the SD card.


    Since then, RISC OS has been updated a few times, increasing the amount of available
    software, improving the performance of the OS and finally letting us easily export
    PNG screenshots for this article. It''s still very much the same RISC OS though,
    a curious novelty from another time that doesn''t really fit in with the ecosystems
    of modern operating systems.


    While RISC OS is not Linux it does have a similar file structure and uses a package
    manager, but otherwise it is completely its own thing. Using RISC is different
    from other operating systems as it uses a three-button system for clicking and
    opening menus, unlike the two-button standard of today. This can be confusing
    for new users, along with the way apps open on the desktop and the way they don''t
    always require double-clicks to launch. When it is in a full-screen window, it
    covers the panel and a whole host of other quirks. If you''re used to the traditional
    desktop metaphor there are a lot of new workflow processes to get your head around
    for something you''re unlikely to use as your main computer.


    ![](img/c7d3278283754436651c50a2e9c72912_74_0.png)


    Diving into RISC OS is like time travelling back to three decades ago


    As for teaching tools there are very few. You won''t really be learning to code
    on here unless you like using BASIC or already have a bit of knowledge in Perl
    or C. You can access the GPIO port but it''s not very well suited for all projects;
    Raspbian and Arch would be better.


    Things have changed in the 18 months since we first checked out RISC OS on Pi,
    but it''s either not enough or it''s just never going to go in the direction of
    Raspbian. It''s definitely interesting, though, so if you have a few hours to
    play with it then we recommend giving it a shot.


    ![](img/c7d3278283754436651c50a2e9c72912_74_1.png)


    There are a lot of different systems and processes to get your head around


    > “While RISC OS is not Linux, it does have a similar file structure”


    | Category | Comments | Score |

    | :--- | :--- | :--- |

    | **Updates** | Surprisingly, RISC OS is kept well up to date for a distro we
    can only imagine is not very popular | 6 |

    | **Usability** | RISC is fine to use but it''s just that little bit different
    to what a lot of people are accustomed to | 6 |

    | **Educational tools** | Basically none are included with RISC OS and nothing
    can really be installed for this | 2 |

    | **Flexibility** | With some perseverance and know-how you can use it for a few
    projects but less than others | 3 |

    | **Overall** | RISC OS is a very different operating system to the others on
    this test, which isn''t a bad thing but it is not conducive to education | 4 |'
