  md: '# JON MASTERS


    # # The kernel column


    Jon Masters informs us of the kernel''s role in the latest Shellshock security
    vulnerability, and summarises the work in the kernel community towards a final
    3.17 release


    ![](img/c7d3278283754436651c50a2e9c72912_13_0.png)


    **Jon Masters** is a Linux kernel hacker who has been working on Linux for some
    19 years, since his first attended university at the age of 13. Jon lives in Cambridge,
    Massachusetts, and works for a large enterprise Linux vendor. He publishes a daily
    Linux kernel mailing list summary at [kernelpodcast.org](kernelpodcast.org)


    # ## Is the Linux kernel ''shellshocked''?


    A recent security vulnerability in the Bash (Bourne Again SHell) has had everyone
    talking about being ''shellshocked''.


    It''s strange to think of Bash as front-page headlines, but such is the world
    in which we live. When it''s not featured on the front-page of the *New York Times*,
    Bash is a humble (yet almost universal) shell, most often experienced as the familiar
    Linux or Mac OS X command-line interface spawned when running a terminal emulation
    program (by clicking on the Terminal application icon). But Bash is also quite
    often the shell behind /bin/sh (which is usually a symlink to the bash executable)
    and is thus available to remote users who request a webserver to run (for example)
    a CGI script.


    The specific security vulnerability in Bash is pretty straightforward. Bash was
    inadvertently introduced into Bash (several decades ago) which causes it to miss
    parse function declarations that are passed into it via the process environment.
    Like any other application, running instances of Bash have a Unix process environment
    which can be viewed or modified using the ''env'' command.


    The environment is simply a linear memory array of an arbitrary size sitting within
    the process'' overall address space. It is defined in the kernel within the ''mm''
    struct that forms a part of every process (called a ''task'' when seen within
    the kernel), and is accessed by kernel code using a macro such as current->mm->env_start
    (which would return a pointer to the environment of the currently running program).
    The kernel is involved in setting up the environment originally as part of the
    binitf/elf code that sets up Executable and Linking Format (ELF) executables,
    such as Bash.


    The environment of a process (between env_start and env_end) is visible to userspace
    through a global variable (extern char **environ),


    and through the file /proc/self/environ, where ''self'' can be replaced with another
    process ID if you have suitable capabilities (eg root) to read the environment
    of another process. The ''env'' utility (part of the ''coreutils'' Linux package
    on most distributions) simply reads an array of strings from the global Unix environ
    variable and displays them. These strings have a declarative form, such as ca
    be seen in "HOME=/home/jcm" and are known as ''environment variables''. Various
    tools, such as the Bash shell, will also read these entries on start up and set
    various internal state based upon these variables. Environment variables can include
    function declarations (such as "\_x=() { :}"), which defines a function named
    "\_x" that does nothing) and these can be exported to subsequent commands through
    use of the "export -f \_x" command. Normally, this command will only cause the
    environment to gain an "\_x=() { :}" entry, but there are other ways to set the
    process environment besides using "export", such as using the ''env'' command
    directly. This leads us to the now famous vulnerability test code:


    env \_x=() { :}; echo "vulnerable" bash -c :"


    ```

    env \_x=() { :}; echo "vulnerable" bash -c :


    ```


    The second Bash process is passed in the function named "\_x" but erroneously
    executes the ''echo ''vulnerable''" command tacked onto the end in the course
    of parsing the "\_x" function environment variable. In fact if you were to remove
    the "":" from the end of that line and allow the second shell to remain running,
    you would notice that the ''env'' command doesn''t show anything unwarted (because
    it doesn''t correctly parse the content either). However, running "cat /proc/$$/environ"
    to display the environment as directly reported by the kernel will show the "echo
    ''vulnerable''" addendum. Newer fixed versions of Bash improve parsing and also
    append new "BASH_FUNC_" prefixes to exported functions. But the kernel


    Linux turned 23 years old a couple of months ago, just in time for the tail end
    of the 3.17 kernel development cycle. In fact, the 5th Release Candidate was almost
    released on Linux''s birthday but Linus decided against that as he is "not an
    overly sentimental person, so clear that". Indeed, this has been a quieter cycle
    in some respects and Linus considered making RC6 the final Release Candidate.
    In the end he did make, "yes, another rc", (RC7) since "convenience" (to his travel
    schedule) wasn''t really part of the release criteria". We will have a full summary
    of Linux 3.17 in the next issue.'
