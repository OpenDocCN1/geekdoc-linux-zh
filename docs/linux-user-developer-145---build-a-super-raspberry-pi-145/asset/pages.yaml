  md: '# # Ubuntu the first


    Warty Warthog was released on 20 October 2004 to a much different Linux world
    than today


    There wasn''t much branding on the original Ubuntu desktops. You can see here
    that it uses GNOME 2 as its preferred desktop environment


    ![](img/c7d3278283754436651c50a2e9c72912_17_0.png)


    Ubuntu was one of the first distros to automount flash drives but you could still
    do it the - now literally - old-fashioned way


    The original Ubuntu comes with a selection of default apps that look like a slice
    of open source history. GIMP is just one example


    Like today, Warty Warthog shipped with Mozilla Firefox, although it was in one
    of the earliest forms of the browser


    It''s February 2004 and it''s a very different world from what we know today.
    Windows XP is the latest desktop from Microsoft. Apple hardware is still running
    on PowerPC. BlackBerry''s and PDAs dominate the smartphone market and x64 chips
    are just about making their way to market. Linux is barely in the zeitgeist outside
    of developer circles, but this is so soon about to change.


    "I was one of the first people Mark Shuttlerworth called back then," said Martin
    Pitt, software engineer, who was there at


    the start of what would be a major revolution for the Linux desktop. "He sent
    me an email explaining his idea about doing a Debian-based Linux project with
    a regular release cycle that was also user-friendly."


    "This was the beginning of the development of Ubuntu 4.10, code-named Warty Warthog,
    and of Canonical itself. At the time, Linux desktops were very different. There
    was no graphical installers, there was no proliferation of user-friendly distros
    and very little push for ''normal'' people to start using Linux."


    "Canonical and Ubuntu officially started in April of 2004," elaborates Jane Silver,
    Canonical CEO. "[Mark] pulled a group of about ten people together with this vision
    of creating Ubuntu... I met him a couple months later in July and just immediately
    believed in the vision of Ubuntu and Canonical."


    Jane later joined as the COO of the company and, after several months of development,
    the very first Ubuntu was released on 20 October 2004. The release was a bit slow
    catching on though, explains Martin:


    ![](img/c7d3278283754436651c50a2e9c72912_17_1.png)


    **20 October 2004**

    # In the beginning...


    Ubuntu 4.10 Warty Warthog is released. Based on Debian testing and using the GNOME
    desktop environment, it was a solid first release. It wasn''t an overnight sensation
    but it found a core group of loyal users.


    ![](img/c7d3278283754436651c50a2e9c72912_17_2.png)


    **18 April 2005**

    # The first spin


    Kubuntu was the first alternate flavour of Ubuntu, releasing shortly after Ubuntu
    came out and offering the KDE desktop environment as opposed to Ubuntu''s default
    GNOME.'
