  md: '# Opinion


    The kernel column — Jon Masters


    # OPEN SOURCE


    continues to do its thing, having never been more than a spectator in the process
    of handing the environment from one task to another.


    # Ongoing Development


    An interesting thread around the topic of non-blocking file reads spawned under
    the initial subject heading “read()/read() only from page cache”. The Linux page
    cache is an in-memory data structure containing data pages (fragments of disc
    files, also known as “nodes”, in that context) representing those portions of
    files that have been previously read into memory and for which there is (at least
    temporarily) sufficient spare RAM to keep a cached copy on hand in case of imminent
    repeat access. The idea of reading file data only from the page cache is that
    file reads can often block for very long periods of time (milliseconds); more
    than enough time to ruin any kind of determinism in a low latency or real-time
    system. Typically, special purpose real-time systems take precautions around data
    storage for these reasons. But there are those who would like to use a general
    purpose file system and simply leverage the presence of the page cache, allowing
    for per request control over whether a read operation will block, should data
    not be previously cached therein.


    New patches for POWER8 architecture support were posted, including a selection
    of the CPU type itself, as well as support for controlling attributes of the Transactional
    Memory hardware support when in use by a particular process undergoing debug through
    the gtrace API. Transactional Memory is a pretty nifty feature that several architectures
    are growing support for (recent x86 chips ship with this feature built in). It
    allows a sequence of memory operations to be treated as a unit that will either
    be completed entirely (and atomically) or not take place at all. It’s typically
    used to implement various high performance critical sections in place of conventional
    locking (hence Intel use the term Transactional Synchronization Extensions or
    ‘TSX’ in their implementation), and are usually achieved by restricting the size
    of an overall transaction to a multiple of the L1 cache line width and using cache
    organisational tricks.


    Community-run Linux Plumbers Conference is seeking organisers for its 2015 event.


    The LPC is contemporaneously co-located with Linux Foundation events such as LinuxCon,
    and under the overall technical direction of the Linux Foundation Technical Advisory
    Board (TAB). The new TAB was announced this month following fresh elections held
    at this year’s LinuxCon in Chicago (full disclosure: this author was nominated
    to stand in absentia); and it is seeking assistance in organising the event, to
    be held in Seattle. The new TAB sees the departure of several long-term members
    and the addition of a few fresh faces including the new chair, Grant Likely. It’s
    particularly gratifying to see that the ten-person TAB now has two female members
    (with the addition of Kristen Accardi, joining Sarah Sharp). This is of course
    far from enough, but it is at least a welcome trend in a positive direction.


    Finally this month, a patch was recently posted that enables support for the upcoming
    GCC 5. For those who find the notion of experimenting with new and novel compilers
    interesting, this is definitely something to take a look at.


    > “A bug was inadvertently introduced into Bash several decades ago”


