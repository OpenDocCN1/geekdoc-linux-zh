  md: "# Your view\n\nTwitter: @linuxusermag\n\nFacebook: Linux User & Developer\n\
    \nYour source of Linux news and views\n\nContact us...  \nRegister and post your\
    \ comments...  \nwww.linuxuser.co.uk/forum/\n\nEmail us directly...  \nlinuxuser@imagine-publishing.co.uk\n\
    \n# YOUR VIEW\n\n# Linux User Letters\n\nYour opinions about the magazine, Linux\
    \ and open source\n\n# Bitter Chromebooks\n\nI read Simon Brew’s article on tablets\
    \ in schools a couple of issues ago and I’ve had a similar experience with changing\
    \ technology in schools. My son’s school is using Chromebooks and I’ve seen a\
    \ number of seminars and other items indicating [that] this is becoming common.\
    \ Some schools are even switching out iPads.\n\nThey’re cheaper. When they lose\
    \ or break the Chromebook, just grab another. Leaving it at home/school is [essentially\
    \ the same] as losing them for a short time to the IT department as well. Data\
    \ is shared if needed and if they don’t have a Chromebook, anything running Chrome\
    \ can be used.\n\nPlus the admin tools are better so there is less work for the\
    \ IT department and, more importantly, the teachers and parents.\n\nTom Buskey\n\
    \nChanging the way kids learn on computers is necessary because of the ever-changing\
    \ landscape of computing in general. The use of Chrome, Chrome OS and Chromebooks\
    \ in this way seems like a very happy medium compared to jumping straight onto\
    \ tablets that essentially remove a large element of computing from the equation.\n\
    \nWe don’t see a tablets-only future at the moment so switching completely to\
    \ iPads seems like a bad idea for multiple reasons.\n\n# Systemd is a bad idea\
    \ of a down\n\nI have some very serious doubts about systemd. I feel it is taking\
    \ over Linux and giving users less control over the lower levels of their system.\
    \ I also have issues with some of the bugs it keeps getting, which can cause system-wide\
    \ issues, and the potential security risks it creates. I really haven’t seen much\
    \ talk about it in your magazine, though. Where do you stand on the issue? Should\
    \ we go back to the way it was with individual processes?\n\nJake\n\nSystemd is\
    \ a very touchy subject for a lot of people. We’ve seen some fairly hyperbolic\
    \ headlines literally saying that systemd is the harbinger of the apocalypse.\
    \ Whether it’s ‘satrie or not doesn’t really matter as there are plenty of users\
    \ who genuinely think along those lines. To some they are the vocal minority,\
    \ something the internet trades a lot in. Others believe it’s equal amounts of\
    \ positive and negative, whereas a silent majority is staying out of it.\n\nOur\
    \ opinion? It’s early days. It’s slowly being put into more and more systems and\
    \ there will be a lot more development before it becomes a Linux ‘standard’. We\
    \ hope it doesn’t cause problems, but it may make things easier for some people\
    \ and that would be excellent.\n\n# Android Magazine\n\n![](img/c7d3278283754436651c50a2e9c72912_93_0.png)\n\
    \nWith more and more Android features being merged back into the Linux Kernel,\
    \ it’s becoming much easier to develop for one of the most popular mobile operating\
    \ systems around. With over 25 billion app downloads, and over 100 million Android\
    \ devices worldwide, there’s a wide audience of folks ready and willing to consume\
    \ apps. For a more Android-driven editorial, you can look to our sister mag Android\
    \ Magazine, the only publication dedicated to the platform. Along with news and\
    \ reviews to keep you up-to-date on everything Android, there are also tutorials\
    \ and advice on developing and hacking your hardware. Find out more at www.littlegenrobot.co.uk.\n\
    \nLeft: Chromebooks and Chromeboxes come in many shapes and sizes but are all\
    \ simple and relatively cheap\n\n![](img/c7d3278283754436651c50a2e9c72912_93_1.png)"
  merge: -1
  img_proc: true
- pgno: 94
  md: '# # THREAD BARE


    # # What? Sysadmin

    ## is evolving!


    When we announced the Linux Foundation''s plans for a new certification course
    we also added one of the Foundation''s infographic with the different ''stages''
    of a sysadmin illustrated with Penguins. The definitions surprised and delighted
    some on reddit. Find out your level at: http://bit.ly/1rm5Xv3.


    +   **bobarobert said:**

    See I could count myself as a novice or junior, but I know how devices and device
    drivers work. I''ve modified some myself. It''s hard to classify sometimes.


    **ChojinDSL said:**

    Yeah, I have trouble classifying myself as well. I''d probably be somewhere between
    Junior and Senior my self. Give me a chutkle though.


    **POTUS said:**

    This is normal. The more you know, the more you know you don''t know. It might
    feel like you shouldn''t call yourself a senior level sysadmin because you''re
    sure that you come up with something you don''t know or don''t do well enough,
    but at the end of the day you just have to realise that nobody knows everything.
    Being able to make use of the resources available to you to make things work is
    what really makes a senior sysadmin.


    +   **ydna_eiissa said:**

    Look at the recent Matthew Garrett AMA. He mentioned numerous areas he feels he
    knows nothing about.


    **sigma914 said:**

    Oo, apparently I''m a senior... that seriously can''t be all [there] is to it.


    **BlueDragonX said:**

    I guess once you start contributing code to the kernel you''re no longer a sysadmin.


    **interupt said:**

    I would call that an engineer


    **CandyCorns__ said:**

    Seems like some of these distinctions are really blurry, because I consider myself
    having aspects of Novice, Junior, Intermediate/Advanced, and Senior. But, I''m
    not a sysadmin, just a guy that''s used Linux for many years.


    **demizer said:**

    I''m actually employed as a Junior Linux System Admin. I would say this is accurate,
    but there is much more to being a Senior Admin.


