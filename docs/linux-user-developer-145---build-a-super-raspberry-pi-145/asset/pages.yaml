- pgno: 60
  md: "# Upgrade your Pi-powered Bigtrak\n\nWhen the Bigtrak was re-released back\
    \ in 2010 it was accompanied by two accessories, the Can Caddy and the Rocket\
    \ Launcher. The Can Caddy is a couple of pieces of plastic that mounts onto the\
    \ back of the Bigtrak and allows it to carry around a drinks can. But it’s not\
    \ very exciting and the top-mounted Raspberry Pi gets in the way of fitting it.\n\
    \nThe Rocket Launcher, however, is a much more interesting item, consisting of\
    \ four foam-tipped rockets that you can program the Bigtrak to fire as it trundles\
    \ around. Of course, as you have to pre-program the Bigtrak’s route, it gives\
    \ your target ample opportunity to get out of the way.\n\nTo rectify this flaw\
    \ we’re going to take the Raspberry Pi-controlled Bigtrak that we put together\
    \ back in issue 141 and update it to fire rockets whenever you press ‘X’ on the\
    \ controller.\n\n# 01 Trigger the rockets\n\nThere are two ways of triggering\
    \ the rocket to fire. The first, used by the Bigtrak Junior, is achieved by running\
    \ a 4.5V current through the 3.5mm jack plug. The second, used by the Bigtrak,\
    \ is to send an infrared signal to the Rocket Launcher in a similar way to how\
    \ a TV remote works.\n\n# 02 Power switch and IR LED\n\nThe Bigtrak’s IR LED sits\
    \ together with the power switch on a small PCB with a multicoloured ribbon cable\
    \ running from it. Since we are only interested in the IR LED, we need to determine\
    \ which cables connect to it. This can be done by following the traces running\
    \ from the IR LED to the cables, or by using a multimeter.\n\n# 03 Determine the\
    \ polarity of the LED\n\nBefore we attach the IR LED to the chassis we need to\
    \ determine which of the wires connect to the anode (positive) leg and which connects\
    \ to the cathode (negative) leg of the LED. Looking closely at the IR LED, you\
    \ can see that one side is flatter than the other; this is the side the cathode\
    \ pin is on.\n\n# Full code listing\n\n```\nimport pygame\nimport time\nimport\
    \ RPi.GPIO as GPIO\nimport subprocess\n\nPS3\\_AXIS\\_LEFT\\_H = 0\nPS3\\_AXIS\\\
    _LEFT\\_V = 1\nPS3\\_AXIS\\_RIGHT\\_H = 2\nPS3\\_AXIS\\_RIGHT\\_V = 3\n\nPS3\\\
    _CROSS = 14\n\npygame.init()\n\nj = pygame.joystick.Joystick(0)\nj.init()\n\n\
    print('Initialized Joystick : %s' % j.get\\_name())\n\nDRIVEA0 = 17\nDRIVEA1 =\
    \ 24\nSTANDBY = 18\nDRIVEB0 = 21\nDRIVEB1 = 22\n\nA0 = False\nA1 = False\nB0 =\
    \ False\nB1 = False\n\nGPIO.setup(GPIO.BCM)\nGPIO.setup(DRIVEA0, GPIO.OUT)\nGPIO.setup(DRIVEA1,\
    \ GPIO.OUT)\nGPIO.setup(STANDBY, GPIO.OUT)\nGPIO.setup(DRIVEB0, GPIO.OUT)\nGPIO.setup(DRIVEB1,\
    \ GPIO.OUT)\n\nGPIO.output(DRIVEA0, A0)\nGPIO.output(DRIVEA1, A1)\nGPIO.output(STANDBY,\
    \ False)\nGPIO.output(DRIVEB0, B0)\nGPIO.output(DRIVEB1, B1)\n\nthreshold = 0.60\n\
    \nLeftTract = 0\nRightTract = 0\n\ndef setmotors():\n    GPIO.output(DRIVEA0,\
    \ A0)\n    GPIO.output(DRIVEA1, A1)\n    GPIO.output(STANDBY, True)\n    GPIO.output(DRIVEB0,\
    \ B0)\n    GPIO.output(DRIVEB1, B1)\n\ntry:\n    GPIO.output(STANDBY, True)\n\n\
    \    while True:\n        events = pygame.event.get()\n        for event in events:\n\
    ```\n\n# No power switch or IR LED?\n\nWhen working on projects, we tend to keep\
    \ any leftover components in a ‘bits’ box in case they become useful later on,\
    \ such as for this project.\n\nIf you modified a Bigtrak during the previous tutorial\
    \ and didn’t keep the power switch, or if you just want to fire the rockets without\
    \ the Bigtrak, then you can get a replacement IR LED that can be held in place\
    \ with some electrical tape or sticky tack.\n\n# Driving a Bigtrak with Pi\n\n\
    Back in issue 141, we showed you how to connect up your Raspberry Pi to the Bigtrak\
    \ in order to drive it using a PS3 controller. This tutorial follows on from that\
    \ point, so you’ll need to go back and give the other guide a read first. If you\
    \ check out the version we uploaded to our website, you’ll find a good Fritzing\
    \ diagram to help with the wiring: bit.ly/1PrgTW\n\n![](img/c7d3278283754436651c50a2e9c72912_60_0.png)\n\
    \n![](img/c7d3278283754436651c50a2e9c72912_60_1.png)"
