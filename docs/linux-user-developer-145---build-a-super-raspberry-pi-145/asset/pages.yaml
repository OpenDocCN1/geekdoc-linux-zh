    \ has enabled us to create a file and folder viewer with minimal effort. We used\
    \ only a few features of the class; it is possible to filter folders and perform\
    \ a variety of other impressive stunts.\n\nDevelopers seeking to get value out\
    \ of Qt will be delighted to hear that the framework contains half a dozen different\
    \ models which are dedicated to all kinds of useful tasks. For example, database\
    \ access can be ‘encapsulated’ by using any or all of QSqlQueryModel, QSqlTableModel\
    \ and QSqlRelationalTableModel.\n\nString lists should be packed up into an instance\
    \ of QStringListModel. It handles the adaptation and preparation for display without\
    \ further interaction from your end.\n\nQStandarditemModel should be used when\
    \ your code is to handle a set of items which are derived from QStandardItem.\
    \ It is a relatively complex class providing a set of properties intended to simplify\
    \ the creation of custom items for lists, tables and trees.\n\nWhen dealing with\
    \ legacy code, you might stumble across a legacy class called QDirModel. It differs\
    \ from QFileSystemModel as it handles the file system traversal on the GUI thread.\
    \ This can have a significant negative performance"
