  md: '![](img/c7d3278283754436651c50a2e9c72912_57_0.png)


    **Chords** You can play chords by manipulating three thumbsticks at once - how
    you move them affects the sound of the notes in the chord


    **Thumbsticks** Push forward/ backward to switch between triangles and reverse
    sawtooth waves or push left/ right to affect the oscillators


    ![](img/c7d3278283754436651c50a2e9c72912_57_1.png)


    **Isomorphic** All the chords and scales you can play have the same geometric
    shape, no matter what key you''re playing them in


    **Hexagonal grid** The Joytone uses a hexagonal layout for the notes like electronic
    musical instruments such as Rainboard or apps like Music


    *Above (inset)* Getting to know the musical distance between adjacent thumbsticks
    is the key to learning to play the Joytone


    *Right* There''s a marathon lab session behind this six-note demo unit that Sharples
    and Glermon presented at the DIS Senior Design Fair


    ![](img/c7d3278283754436651c50a2e9c72912_57_2.png)


    # Components list


    +   - Raspberry Pi Model B

    - Cypress PSoC4

    - Arduino Micro

    - 57 XboC 360 thumbsticks

    - 57 NeoPixel Diffused 8mm Through-Hole LEDs (Adafruit)

    - 8 16-channel analogue multiplexers

    - 5 16mm Illuminated Pushbuttons (Adafruit)

    - 200mm SoftPot Membrane Potentiometer'
