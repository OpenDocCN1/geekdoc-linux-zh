- pgno: 40
  md: '# # Continuous code analysis – part 1

    ## Set up a Jenkins integration server ready for SonarQube analysis

    ### TUTORIAL


    # **07 Job Config History plugin**


    This plugin is especially helpful for people who are new to Jenkins, though people
    with some experience on Jenkins may also find it useful.

    Let''s consider a scenario – your Jenkins build works fine, then you think of
    making further improvements and start changing the settings, and suddenly everything
    stops working. But you don''t even remember the last change you made! Well, JobConfigHistory
    plugin is there to bail you out of such situations. It saves the config.xml after
    each change you make in Jenkins settings. You can just check the file differences
    and make necessary amends.


    ![](img/c7d3278283754436651c50a2e9c72912_40_0.png)


    ![](img/c7d3278283754436651c50a2e9c72912_40_1.png)


    # **08 SafeRestart plugin**


    Jenkins generally needs a restart after any configuration changes or after any
    plugin installations. But being a server-client-based application with multiple
    concurrent users executing their jobs, you need to be extra careful since you
    may accidently abort someone else''s build during a restart. The SafeRestart plugin
    frees you from worrying about this. Once you click the ''Restart Safely'' button
    (that appears in the left menu bar after you install the plugin) it schedules
    a restart once all the builds are done.


    ![](img/c7d3278283754436651c50a2e9c72912_40_2.png)


    # **09 Ownership plugin**


    As the name suggests, this plugin lets you assign explicit ownership for jobs
    and slave nodes. Introducing ownership means better responsibility management
    and faster resolution of issues... unless it turns into pointing fingers! On a
    serious note though, this plugin definitely offers a good way to handle issues
    – after a job fails you don''t need to find someone to fix it. After you install
    this plugin, you get a link on the left menu bar called Manage Ownership (when
    inside a project). Here you can configure the owners/co-owners of a respective
    job.


    ![](img/c7d3278283754436651c50a2e9c72912_40_3.png)


    # **10 Google Calendar and compress artefact plugin**


    The Google Calendar plugin allows you to publish build records to Google Calendar.
    After you install the plugin, you can view the option to publish build status
    to Google Calendar in the postbuild actions tab. A form appears as you select
    it and you then need the calendar URL and your credentials to fill it. After that,
    Jenkins automatically pushes the build results to your Google Calendar. Simple
    and effective! If you plan to save the build artifacts such as the test logs and
    build files after each build, you may find this plugin useful. This plugin compresses
    the artifacts before saving them to the disk, thus saving the disk space for you.'
  merge: -1
