- pgno: 27
  md: "# # Tutorial\n\n# ## 06 Oops!\n\nProblems? It's easy to miss the correct kernel\
    \ headers during install. Check `/proc/version` (or run `uname -a`) to be sure\
    \ which kernel you're running. Error messages from...\n\n```\n```bash\nVBoxManage\
    \ --version\n```\n```\n\n... may help. On one Debian box, we had to rebuild `virtualbox-klons`.\
    \ For a Fedora test machine, we had to install the `kmod-VirtualBox` package for\
    \ our kernel version, then run:\n\n```\n```bash\nsudo systemctl restart systemd-modules-load.service\n\
    ```\n```\n\n... which fixed the problem. You may find that a restart of your machine\
    \ might be necessary for fixing problems.\n\n![](img/c7d3278283754436651c50a2e9c72912_27_0.png)\n\
    \n# ## 07 Vagrantfile\n\nWhen you run `vagrant init`, you are told:\n\nA `Vagrantfile`\
    \ has been placed in this directory. You are now ready to `vagrant up` your first\
    \ virtual environment! Please read the comments in the `Vagrantfile` as well as\
    \ documentation on `vagrantup.com` for more information on using Vagrant.\n\n\
    Vagrantfile is where all of the configuration happens. Initially, everything is\
    \ commented out save the `config.vm.box` value of `ubuntu/trusty32` or whatever\
    \ you set at vagrant init.\n\nYou can run vagrant init without a value and download\
    \ the box you want later with the box add command. For example:\n\n# ## 08 Port\
    \ forward\n\n![](img/c7d3278283754436651c50a2e9c72912_27_1.png)\n\n> \n> The base\
    \ image remains unaltered when it is used, so can be shared among several projects\n\
    \n\n```\n```bash\nvagrant box add outornth/debian-7.4RubyOnRailsDev\n```\n```\n\
    \n... then add it to the config.vm.box directive in Vagrantfile. Note that the\
    \ base image downloaded remains unaltered when it is used, so can be shared among\
    \ several projects – each one will have its own Vagrantfile in the local directory\
    \ in which vagrant init was run.\n\nWhichever box you're running, setting up networking\
    \ will be a necessity – you don't really want a website that can only be accessed\
    \ from a local machine!\n\nIn Vagrantfile, you can set a bridged network that\
    \ fits with your VM and hosting setup, but the simplest networking is host port-forwarding.\
    \ A port on your virtual box, such as 80, is forwarded to an unused port on your\
    \ host machine, from where it can be accessed:\n\n```\n```ruby\nconfig.vm.network\
    \ \"forwarded_port\", guest: 80, host: 8082\n```\n```\n\nThis in turn can be forwarded\
    \ – for example, from Apache on the host machine – and/or matched there to the\
    \ URL you want.\n\n![](img/c7d3278283754436651c50a2e9c72912_27_2.png)\n\n# ##\
    \ 09 Shell\n\nChanges to Vagrantfile can be applied to a running server with the\
    \ vagrant reload command. While so much can be configured from outside your running\
    \ server, vagrant ssh gives you all important access to the shell inside your\
    \ virtual box Tiny Core, shown in the screenshot above, is great for quickly testing\
    \ VBox, as opposed to using Ubuntu.\n\nDon't forget to exit the ssh session before\
    \ running any more vagrant commands. Vagrant suspend leaves the box a few seconds\
    \ from readiness via another vagrant up. Vagrant destroy removes the virtual machine,\
    \ but the Vagrantfile enables you to provision another that's exactly the same."
