  md: '# THE ESSENTIAL GUIDE FOR CODERS & MAKERS


    # PRACTICAL

    # Raspberry Pi


    # Contents


    +   58 Discover a new musical instrument


    +   60 Upgrade your Pi-powered Bigtrac


    +   64 Transform your Pi into an oscilloscope


    +   70 What is the new browser?




    # ## BUILD A

    # SUPER

    ## RASPBERRY PI


    Pool the resources of multiple Pis to create your own scalable Pi supercomputer


    The Raspberry Pi is actually quite powerful for its price. On its own, though,
    you won’t be doing any extraordinary calculations – or compiling anything strenuous
    at all, for that matter. However, as it’s readily available and fairly cheap,
    you can get twenty of them for the price of a new computer. Each of them on their
    own will be no different, but link them together over a network and you can have
    them share their power and vastly increase the amount they can process.


    This kind of setup is generally known as a Beowulf cluster, so named for the eponymous
    hero of the epic poem in which Beowulf is described as having “thirty men’s heft
    of grasp in the gripe of his hand”; it’s not ridiculously hard to achieve, either
    – all you need is a lot of Raspberry Pis, a bit of Python know-how and a reason
    to use it. This makes it a good project for things like classrooms, after-school
    Pi clubs and the like – really, anywhere there’s a collection of Pis available
    for general use.


    The more Raspberry Pi nodes you add into the setup, the more powerful it will
    become, which means you can start with just two or three at home and then gradually
    add more and more to your cluster, if you want to. And because of the way it all
    works, you can hook in and control your SuperPi cluster from your main computer
    as well, making this as accessible as it is scalable.


    Over the next two pages we’re going to show you how to get your Raspberry Pi set
    up ready for use, including all the tools you’ll need, how to get them all connected
    and then finally what you can do with all that processing power. We’d love to
    see your SuperPi once it’s finished – drop us a tweet!'
