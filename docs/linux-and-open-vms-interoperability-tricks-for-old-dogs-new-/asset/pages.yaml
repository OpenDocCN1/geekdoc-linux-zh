  md: '# Chapter 5 — X Windows Applications:

    X Windows Interoperability with VMS and Linux


    # X Windows, VMS, Linux, and a Bit of History


    In 1988, 10-year-old VMS operating system was migrated from a display list window
    manager, "VWS," to the Windows-based "DECwindows" for all of its OpenWindows graphical
    workstations. Then, as Windows continued to evolve, VMS added the Motif Window
    Manager and by 1997 even had the UNIX CDE (Common Desktop Environment). Linux
    evolved in the 1990s, building to these already established by standards: X Windows
    for interoperability, Motif for standard-style management of X Windows processes
    and sessions, and CDE for a common look and feel in the UNIX and X Windows workstation
    community.


    During the 1980s, display-list window managers had enjoyed their flower. By the
    mid-1980s graphical headers were still standalone with display computers connected
    to a computer system that required graphical/Windows output. These two specialized
    computers communicated (usually) across serial or parallel cables, just as if
    the primary computer system were talking to a printer or plotter. Plotter is the
    key to understanding this relationship, because the commands that drive plotter
    pens to draw lines and automatically fill areas on paper became the basis for
    commands to plot graphics on the display-list computer heads of the 1980s. As
    the first workstation emerged, these computer/display workstations were little
    more than Pen Plotters driving raster adapters. Then, as standalone-display computers
    were reduced to many chips with a display screen, the commands that drive graphics
    continued to be the same local plotting commands and languages that ran the previous
    generation of displays. Each company had its own standards, chip sets, and commands
    had little regard for any hardware or network abstraction for graphical commands
    each workstation vendor’s machines. Graphical libraries for developers (such as
    GKS and PHIGS) were designed to help in developing programs that could run on
    a variety of hardware, but that wasn''t enough. There needed to be a standard
    way of displaying process graphics across networks and different computers.


    Then, in 1985, DEC funded research to "Project Athena.\ Out of that research came
    X Windows, Kerberos (the security model now being adopted by Windows'
  merge: -1
  img_proc: true
- pgno: 58
  md: '![](img/3ba916f144e94350147c366c3485e02e_58_0.png)


    2000), and the beginnings of DCE. OpenVMS and many UNIXes adopted X Windows, because,
    unlike display-list managers or other local GUIs that could only display graphics
    and control to the local system, X Windows was designed and optimized to have
    its graphical interface networked. X Windows was designed for local or remote
    application display across many standard network protocols (TCP/IP, LAT, DECNet,
    SNA). In X Windows (unlike window managers that controlled only local hardware,
    such as a local plotter), graphical output was architected and optimized for transmission
    across networks to other X Windows displays on any X Windows computer in the network!
    This makes applications easy to display between multiple systems or made it easier
    to have many different graphics brought to a single graphics display regardless
    of operating system of origin! That level of Open Systems interoperability is
    why DEC chose X Windows as its GUI OpenVMS workstations and servers in 1988 and
    why HP continues to support X Windows to its day!


    Fast forward 17 years and 6 major X Windows software releases, and to this timetested
    graphical-display system today''s security, new graphical cards, Alpha system
    computational performance, and faster and faster network connections. It''s easy
    to see why a low-cost Linux system would make a perfect, inexpensive integrated
    workstation to display graphics and applications from an OpenVMS server using
    standard X tools!


    # Displaying OpenVMS X Windows Applications on a Linux Workstation


    There are two parts to displaying OpenVMS applications on a Linux workstation.
    The first part is to log to the Linux workstation and set security to accept remote
    display from the OpenVMS applications. The second part is to Telnet to the OpenVMS
    workstation and redirect X Windows output to the Linux machine and then run the'
