- pgno: 56
  md: 'systems people read all three of these books; they represent the future needs
    of OpenVMS customers.


    Other sources for OpenVMS security information include http:// vmsone.com/, and
    Point Secure’s OpenVMS product, "System Detective," at http:// www.pointsecure.com/.
    There is information on these Web pages about how to battle harden even the most
    well-protected OpenVMS system!


    As for Linux systems, look on the OpenSSL pages at, http://www.openssl.org/ and
    http://www.linuxsecurity.com/. These should get even an experienced UNIX administrator
    into a Linux fortress.


    For security in general, the future is encryption, intrusion detection on the
    host, and network intrusion detection between systems. Today encryption is represented
    by SSL, intrusion detection by products such as Point Secure’s System Detective,
    and network intrusion detection with products such as Checkpoint’s firewall products.
    Keeping and using all three of these methods in your system security arsenal will
    ensure your systems are protected, and you will be able to continue to use your
    systems in the face of a security attack.


    Open Source software will represent a risk because of security holes, but patches,
    updates, and all those new Open Source applications will help keep the risks of
    Open Source at bay. Commercial vendors will also step in and keep standard releases
    clean, patched, and available for their customers (remember: Open Source doesn’t
    mean free; the implementation will cost money to maintain for commercial systems).


    Risks and benefits will chart the course computer security will take over the
    next few years. With the right tools and some up-front planning Linux and OpenVMS
    can deliver solid security and functionality for any data-center environment.'
