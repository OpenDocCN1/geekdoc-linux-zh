- pgno: 114
  md: '# Chapter 7 — SMB for Linux and OpenVMS


    # Using SMB with OpenVMS and Linux for Disk Sharing


    Windows, Linux, and OpenVMS systems have been invading others’ turf for the last
    10 years. Managers and “normal” people just expect not only that they will play
    together nicely, but that they will be able to share files, disks, and printers.
    This is a simple goal, if not an unreasonable request!


    There are other disk-sharing protocols, such as NFS in the UNIX world or DFS in
    the VMS world, but Windows has the edge by sheer numbers, so its SMB protocol
    is much more likely to be used between different operating systems.


    Windows NT and Windows 2000 server systems, with some client licenses, provide
    disk and printer sharing plus authentication to use the resources. What was required
    Open Source tools on other operating systems to provide integrated file, print,
    and authentication.


    # Enter SAMBA


    From those humble needs SAMBA was created. SAMBA has become a GNU-licensed, Open
    Source disk-sharing and printer-network protocol that will let your Linux, OpenVMS,
    or UNIX systems participate in a Windows workgroup, NT 4.0 domain, or Windows
    Enterprise domain. The software is distributed for free at http://www.samba.org
    for OpenVMS and Linux. SAMBA is included as part of the standard RedHat 7.3 distribution.


    All of this is managed through a protocol suite currently known as the Common
    Internet File System (CIFS). This was introduced by Microsoft and provides some
    insight into its hopes for the future. The heart of CIFS is the latest incarnation
    of the Server Message Block (SMB) protocol, which has a long history. Suffice
    to say that SAMBA is an Open Source CIFS implementation.


    # SMB Options for OpenVMS, Advanced Server, or SAMBA


    OpenVMS SAMBA is also available from samba.org, but for OpenVMS there is a commercial
    option for people who need better integration with their Enterprise Windows environments.
    HP/OpenVMS engineering has licensed the source for Advanced Server from Microsoft
    as a result of AT&T having access to source code and an industry relicensing agreement
    that the lawyers can understand the true nature of it. Still, Microsoft periodically
    updates'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'this source code with new features and improvements and delivers it to AT&T,
    which then updates OpenVMS engineering and engages a team to port, evaluate, and
    test the product before sending out binaries to OpenVMS Advanced Server customers
    around the world.


    The advantage of using the OpenVMS Advanced Server software instead of the free
    SAMBA software is commercial support with an 1-800 number from HP. As a commercially
    supported product from HP, Advanced Server also tends to have Microsoft server
    features before SAMBA.(at the time of this writing SAMBA is waiting for the new
    LDAP, Active DNS, and the new security model in the latest MS products and Advanced
    Server implementations.) SAMBA will get the latest integration features with MS
    products, but SAMBA usually lags behind the commercial products in those features,
    while the Open Source community reengineers the next version of SAMBA.


    Support service and testing are what made Advanced Server for OpenVMS the preferred
    commercial choice for SMB file and printer sharing on OpenVMS with a Windows environment.


    That''s not that SAMBA for OpenVMS isn''t making a lot of friends! The OpenVMS
    hobbyist communities and those who only need file and printer sharing find that
    SAMBA''s Open Source and free cost are most efficacious for sharing with their
    UNIX, Linux, and Windows clients! With OpenVMS you really do have two choices
    for your SMB server based on your specific needs and your pocketbook


    # Linux and SAMBA


    The ability to share file and print services today is assumed for all operating
    systems. Windows is the largest client population likely to be found on a network.
    The easiest way to do this is to add Windows security and sharing to Linux. This
    not only offers an authentication mechanism common across most desktop platforms
    but also includes file and printer services for Windows RedHat clients that can
    be stored on a Linux Server.


    Installing Linux as an SMB server with RedHat 7.3 allows you to choose an SMB
    server, which will automatically install SAMBA for you (see Figures 7-1 through
    7-13). It installs SAMBA, but it''s up to you to configure it!'
  merge: -1
  img_proc: true
