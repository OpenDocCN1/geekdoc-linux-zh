    \ having your passwords,\nfiles, and anything that moves across the network, copied,\
    \ and redistributed.\nLet's talk about the application encryption protocols that\
    \ are generally available on\nOpenVMS and Linux systems.\n\n# SSH (V1 and V2)\n\
    \nSSH, or secure shell, features are well known and have been available for many\
    \ years\nbetween many different hosts in the TCP/IP world. SSH has the ability\
    \ to create an\nencrypted session between two hosts. You can open an encrypted\
    \ SSH client terminal\nconnection to an SSH server. All the communications are\
    \ encrypted\nbetween the client and server. Both Linux and OpenVMS can be clients\
    \ and servers in\nis arrangement, allowing secure terminal sessions and from both\
    \ systems.\nMultiNet uses this protocol and a file transfer application, SCP,\
    \ for OpenVMS\nusing this protocol. (VMS TCP/IP engineering has been requested\
    \ for SSH for\nsome time, but they have their attention distracted by other TCP/IP\
    \ directions.)\n\nIn the rest of the Open Source and Linux world, SSH is usually\
    \ a terminal or shell\ncommand tool that comes with the operating system, but\
    \ does not do transfer\n(FTP) by itself. Additional applications have been written\
    \ to use the SSH protocol for\nfile transfer, such as MultiNet's SCP product for\
    \ OpenVMS and SFTP (Secure FTP) for\nLinux and UNIX users.\n\nHP’s TCP/IP services\
    \ for OpenVMS does not have SSH capabilities, but with the\naddition of MultiNet\
    \ SSH layered product, SSH protocols work with TCP/IP\nservices (5.3 TCP/IP EAK\
    \ from HP), making SSH work between Linux and\nOpenVMS. You would use SSH if you\
