  md: "# Dcl-Command Options Print\n\n```\n$ VERIFY = $FVERIFY($FSTRNHLM(\"LOGIN.VERIFY\"\
    )\n$ GOTO MODE($FMODE)\n$ \n$$\n$++\n$ SYVLOGIN, the site-specific-wide login\
    \ command procedure\n$ This command procedure is invoked when a DCL process logs\
    \ into the\n$ OpenVMS login procedure; these is a system-wide equivalent to the\n\
    $ user's COMLIN procedure; these commands are executed every\n$ anyone on the\
    \ OpenVMS system logs in to their account, or any time\n$ at (DCL-based) terminal\
    \ logs in, or any time a detached\n$ process (running DCL) starts, or any time\
    \ a batch job starts up.\n$ \n$ SYVLOGIN Structure:\n$ \n$ This SYVLOGIN procedure\
    \ is divided into four sections, sections that\n$ are invoked for \"Interactive\"\
    , \"Batch\", \"Network\", and \"Other\" \"mode\"\n$ processes. Each section falls\
    \ through into the next section,\n$ and thus commands are cumulative.\n$ \n$ Details\
    \ for how these sections are established and on the meanings\n```\n\nFigure 6-52\
    \ As you edit the file, note what area to define your shortcuts. There are places\
    \ for interactive, batch, network, and other modes; we will place the Mozilla\
    \ definition in interactive, when we log in users they can type Mozilla and get\
    \ the program started.\n\n# Dcl-Command Options Print\n\n```\n$MODE_INTERACTIVE:\n\
    $\n$ Turn on the deprocessing of <Control/T>.\n$\n$ SET CONTROL=T\n$ Set the terminal\
    \ type, unless this is a detached DECwindows application,\n$ at a remote login,\
    \ or specific type of terminals. (Note that remote\n$ user logins, via protocols\
    \ DECNET ETERM SET HOST, device driver\n$ prefix \"NT\" and telnet, device driver\
    \ prefix \"TN\", are considered\n$ \"Interactive\" processes, and not \"Network\"\
    \ processes.)\n$ \n$ TT_NOINQUIR = \"TT[NOINQUIR][MODE][PYIFITM]\n$ TT_DEVPREFIX\
    \ = $FEXTRACT(1,2,TT_DEVNAME)\n$ IF $FLOCATE(\"$TT_DEVPREFIX\",$TT_NOINQUIR) .eq\
    \ $FLength($TT_NOINQUIR\n$ \n$$\n$ Determine if this is a terminal\n$ IF $FGETDEVI(\\\
    $TT,\"DEVCLASS\") .eq. 66\n$ \n$$\n$ Determine what kind of terminal this is,\
    \ and avoid resetting\n$ the user's default display size settings in the process...\n\
    ```\n\nFigure 6-53 Locate Mode_interactive; which is the label for the interactive\
    \ section of this script.\n\nChapter 6 - Using E-mail with OpenVMS and Linux 101"
