    previous 1.3 and earlier releases. This release fixes a security problem described
    in CAN-2002-0639, CAN-2002-0640 and CAN-2002-0643. It also fixes some bugs from
    1.3 (and earlier) as well adding some additional compatibility. All users of Apache
    1.3.26 are urged to upgrade as soon as possible.


