- pgno: 15
  md: '# Chapter 3 — TCP/IP for OpenVMS and Linux


    It seems like a lifetime ago, but I remember having an ongoing argument in 1989
    about which was better: IBM''s SNA protocols, DEC''s DECnet and LAT protocols,
    or the up-and-coming TCP/IP protocols for commercial systems.


    The discussion extended to many customers and many in the local DFWLUG group joined
    the discussion with bars and angry words sniping the other protocols. Async transmission
    is better than sync transmission—it recovers better and let''s use lower-cost
    lines, peer-to-peer networking is the only way to go, standards are the way of
    the future, mine has more features, your protocol is, and so on.


    In the end, all the arguments missed the point. We were all arguing the technical
    merits of peer-to-peer networking, counting the number of terminals that could
    be supported, or how many danced on the end of a 50-ohm cable. Wasn''t the right
    focus at all, and many people missed the real reason for this change in networking
    technology in such short period of time.


    IBM''s SNA could host thousands of terminals in a single network with subsecond
    response time. DECNet provided peer-to-peer networking with over 100,000 nodes
    in a single network (when the Internet had 15,000 nodes). Novell was fastest for
    PC disk and sharing, the multi-outed OSI protocol would unite all networks into
    a single, standards-based world that would correct all the shortcomings of past
    protocols. But all of the technological greatness of these and other protocols
    paled against TCP/IP.


    TCP/IP, by 1993, sweep away the competition in the network protocol world for
    any new applications or networks. TCP/IP crushed OSI''s government mandate as
    a protocol of choice for all new network acquisitions. DEC believed it could skip
    over the TCP/IP revolution if it just had the best OSI protocol stack, because
    TCP/IP was waiting (at the time) technologically and the marketplace would have
    to use OSI to solve its networking problems.


    Instead, TCP/IP spawned network companies such as Cisco and bit billion dollar
    software companies such as TGV (Two Guys and a VAX) just to write and support
    a TCP/IP stack for OpenVMS. Other companies emerged for TCP/IP to SNA gateways,
    TCP/IP terminal servers, and the whole pantheon of TCP/IP routers, bridges, terminals,
    and printing solutions.


    Why did this technological transition occur? Better software applications? Better,
    more efficient networking communications? A technological masterpiece delivered
    from the University of California at Berkeley for the rest of the world''s betterment?
    TCP/IP wasn''t better than other protocols; its addressing, applications, routing
    and name'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'space handling were as kludged as it got (remember Yellow Pages and the first
    DNS programs?).


    Nothing so grand as the best technology catapulted TCP/IP to its preeminent spot;
    it was simply capitalism driving the network marketplace. What TCP/IP had in the
    late 1980s propelled it into the commercial IT departments and governments worldwide
    was while other networking protocols were owned and licensed by various vendors
    with expensive fees and licenses, TCP/IP was practically free.


    By the mid-1980s for $500 a development software vendor could develop and use
    TCP/IP for its operating system, router, bridge, or tool of choice (licensed from
    AT&T). Other network protocols and vendors didn''t want to license their network
    to other vendors, at least SNA and DECnet saw their network technology as added
    value and a distinct solution instead of just the place. Berkeley''s Berkeley
    Standard Distribution (BSD) of UNIX and System V drove UNIX and TCP/IP to colleges
    and universities in the late 1980s and early 1990s, but it was (in my opinion)
    the low development cost, with free licensing and the ability to freely (at no
    cost to the vendor) redistribute TCP/IP protocol stacks for commercial devices,
    that won the place TCP/IP now.


    And, as the story goes, by 1993 IBM had SNA as a legacy protocol, DEC had DEC/OSI,
    and all other commercial vendors of networking hardware and software were using
    TCP/IP not because it was better, but because it was free ($500 for a development
    license was as free as it got in the 1980s!). This market transition event taught
    me one immutable fact for our industry: Free beats costing that every day of the
    week in the market place.


    Why remind everyone of TCP/IP''s golden age in a book about OpenVMS and Linux?
    The forces at work with Open Source are doing to today''s marketplace exactly
    what TCP/IP did to SNA and DECnet over the last decade. Certainly, Linux has a
    distribution cost, but after that it''s all free.


    Tools that we think are essential and are willing to pay for next year''s standards
    and are licensed with Open Source distributions. To grow in the marketplace OpenVMS
    must continue to innovate and provide added value with new features such as Galaxy
    (multiple instances of OpenVMS within an SMP simple system) and disaster-tolerant
    clustering. To continue to take market share, Open Source distributions as Linux
    must continue to include new features and improve and evolve from the features
    once spent their IT budgets with high-end operating systems. Progress in Open
    Source and commercial systems is a two-way exchange. Open Source tools become
    part of OpenVMS, and, over time, new features such as clustering and large-scale
    SMP will become part of the Open Source initiatives. This type of increase increases
    all system functionality and lowers the cost of computing for the industry over
    time.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Today’s Networking Standards


    Today (10 plus years after the network protocol wars) TCP/IP is robust and well
    understood by commercial IT groups and individuals. Now the industry is evolving
    into IPv6 (currently IPv4 is used for most implementations). The protocol is expanding
    and improving to incorporate even more features in routing and secure applications—all
    with a standards-based networking protocol.


    Networking for OpenVMS and Linux (or any two or more computing machines) has to
    be based on the same standards. Today’s networking standards of choice are TCP/IP
    software protocols and Ethernet hardware protocols. In previous years it was also
    important to be exchange across terminal lines, विडियो, and direct synchronous
    and asynchronous connections (such as RS-232 cables); the need for the older types
    of connections is wanting but not quite obsolete. Today’s workstations continue
    to use for dial-up with point-to-point protocols that encapsulate TCP/IP for transmission
    between two computers. With more and more workstations servers tied to DSL, or
    cable mediums, routers, and even firewalls, Ethernet networks (even Ethernet wireless
    networks) are the of interconnection possible.


    Notice that all the IEEE 802.X standards refer to the bottom two layers (all hardware)
    of the OSI model (http://standards.ieee.org/) (See Table 3-1).


    # Table 3-1: Standard OSI Model with TCP/IP Positions


    | OSI Network Model | TCP/IP Internet Model | IEEE Standards |

    |---|---|---||

    | Layer 7—Application | Netscape, Xterm, E-mail Readers, FTP-based tools, and
    other application programs for displaying data | | |

    | Layer 6—Presentation | Telnet, FTP, SMTP, other TCP/IP protocols | | |

    | Layer 5—Session | Telnet, FTP, SMTP, other TCP/IP protocols | | |

    | Layer 4—Transport | Transmission Control Protocol (TCP) Unacknowledged Datagram
    Protocol (UDP) | | |

    | Layer 3—Network | IP Internet protocol | | |'
  merge: -1
  img_proc: true
