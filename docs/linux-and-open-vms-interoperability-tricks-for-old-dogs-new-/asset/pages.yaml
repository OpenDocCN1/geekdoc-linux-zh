  md: '# Binary Releases


    Available in the `binaries/` directory. Every binary distribution contains an
    README file.


    # Apache 2.0.43


    This release fixes a security problem described in CAN-2002-0640 and fixes some
    bugs from 2.0.42 (and with some additional compatibility instructions). All users
    of Apache 2.0.42 are urged to upgrade as soon as possible.


    For details see [Official Announcement]. Check here to see if any patches or other
    instructions are necessary for building or running Apache 2.0.43 on your platform.


    Apache 2-x add modules are not compatible with modules written or compiled for
    Apache 1.3. If you are running third party add modules, you will need to recompile
    them for Apache 2.0 or wait that third party before you attempt to upgrade from
    Apache 1.3.


    Note the wind-src-zip files of Apache are nearly identical to the tar versions.
    However they offer the source files in a Windows format and include the Wind build
    files. The wind-src-zip files do not contain binaries! See the `binaries/` directory
    for the binary distributions.


    # Apache 1.3.27 is also available.


