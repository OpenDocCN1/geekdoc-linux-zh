  md: '# Change this value? [NO]


    To operate successfully, the server processes must have read access to the installed
    files and read-write access to certain other files and directories. Compaq recommends
    that you use this procedure to set the owner UIC on the CSWS files and directories
    to match the server. You should do this each time the product is installed, but
    it has only to be done once for each cluster.


    WARNING: The owner UIC for some files in APACHES$COMMON:000000...I is not the
    server UIC (APACHESWM). This may cause the web server process to fail with a protection
    violation.


    Set UIC on CSWS files? [YES]


    Setting ownership on files. This could take a minute or two.


    Configuration is complete. To start the server:


    ```

    $ SYS$STARTUP:APACHES$STARTUP.COM

    $ sys$startup:apache$startup.com

    $APACHES-S-PROC_$ID, identification of created process in 202006C5

    ```


    Figure 8-56 Run the Apache startup and look for the process creation message.
    If you want to verify that the Apache processes are running, just do a $ SHOW
    SYSTEM/PROCESS=APACHE command.


    ![](img/3ba916f144e94350147c366c3485e02e_182_0.png)


    Figure 8-57 Use your favorite browser and verify that the VMS-based Web server
    is up and running! Congratulations, you''ve installed and configured Apache for
    OpenVMS!


