    # Security in an Insecure World


    The OpenVMS engineers I take VMS security very seriously. I believe that by Open
    Source software becomes more and utilized by all systems, the winners (from a
    security standpoint) will be the companies that pay attention to the details and
    look for security holes and how to fix them in Open SourceMS software before it
    gets distributed to customers and systems. Commercial SSL implementation seems
    to be one of the main directions for security and tools today—for commercial systems
    and Open Source systems such as Linux.


    In the OpenVMS 7.3-1 documentation there are three volumes available under system
    security. It is the updated Guide to Systems Security, which has kept OpenVMS
    protected for the last 25 years. The other volumes are new. They are Open Source
    Security for OpenVMS Alpha Volume 1—Common Data Security Architecture and Volume
    2—Compq SSL (Secure Sockets Layer) for OpenVMS Alpha. That''s how important Open
    Source is going to become over the next few years regarding security and authentication.
    OpenVMS already has two volumes in its doc set devoted to the use and security
