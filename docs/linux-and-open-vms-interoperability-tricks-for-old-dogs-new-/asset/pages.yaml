- pgno: 153
  md: '# # Chapter 8 — Apache VMS and Linux Style


    # You Never Really Forget your First Web Server


    You never really forget your first Web server. It was September, the leaves were
    just starting to turn in New England, and I was at a class about Web servers,
    Internet e-business, and Web mastering. The week was too short and the teachers
    too quick with their information, because there was just so much to cover.


    In 1995 and the hot tool of choice was, of course, Netscape (some might say there
    was a rumor of something called Front Page from the Northwest). The browser wars
    were to be fought, posturing and rumblings of the battles to come in the air.
    Every OS worth was laying claiming to be a Web server.


    I flew from Boston on Friday with a full laptop desk of VMS software, PC Web tools,
    and my most precious cargo—the thing that would proudly me my AlphaServer to 2000
    and share with the internal network, was Netscape Commerce Server. It was to be
    my first Web server. SSL, user directory support, and fast well—at least to do
    10 to 20 simultaneous Requests. I pumped about the prospects of building a Web
    server.


    I got home and created user / Web accounts for every CD-ROM that was on my Infotowers
    (I think I had 21 CD-ROM drives back then) and served all the OpenVMS, PC, and
    then OpenSource CD-ROMs I had to offer the internal network. It was a glorious
    few days serving out through HTTP and HTTPS tools, files and even PowerPoint slides.
    A complete DECUS library of graphics, history files for DEC CD-ROM going back
    to the 1970s.


    I remember going back to my cubical the morning when all the Web data was up and
    walking the pages I added /built /HTML with my own hands. Later I realized that
    raw HTML code on my workstation was even better than then having a spreadsheet
    when my boss Dennis Bashore did a little "management by walking around”” in those
    days!


    I was just proud when the main Web page hit 100 hits that month—and then quadrupled
    less than a week after that as the DEC file grabbers religiously copied my few
    paltry gigabytes to their ever increasing plunder. number 8972: You know you''ve
    been plundering file too long when you start finding YOUR directory structures
    on other sites.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Web master flash forward with Apache


    I''ll never forget that first Web server, and today we take Web server tools for
    granted (and for free), such as Apache from Open Source. Some are quick to say
    that Linux''s first killer/breakthrough application was Apache moving Linux into
    many people''s minds as the very economical Web server. At one point all the Linux
    boxes being brought up were built for the primary purpose of sharing Wide Web
    pages.


    Today 65 percent or more of all Web servers are Apache based. RedHat ships Apache
    with Linux now (although today you must do at least a minimum configuration, start
    the Apache Server, and set it for startup for startup upon reboot). OpenVMS engineering
    also ships an Apache-based Web server that has been tested by OpenVMS engineering
    for commercial support and performance.


    Both Web servers are available on the Web at:


    ```

    http://www.apache.org

    http://www.openvms.compaq.com

    ```


    Today Apache has a lot to recommend as the dominant Web server for Linux and OpenVMS
    systems. It''s easy to install, performance is great, it is Open Source (which
    makes licensing much easier, and all those new Open Source features seem to show
    up in the code base!) And because they are the same sources, training to use one
    gives you a feel for the directory structure, configuration files, and other set
    values that are common with Apache running on a variety of platforms.


    While Web masters over the years had many choices, the hardest part of their jobs
    remains much as it was years ago: finding enough content to satisfy the hungry
    user. Which is the better server for Apache Linux or OpenVMS? The answer depends
    on what applications need to have Web interfaces? Old crust FORTRAN or COBOL apps
    that have been running for 20+ years can be given a new polished interface with
    Apache and the World Wide Web. Databases, user programs, and even DCL can be Webified
    with Apache on OpenVMS. Linux systems can give every desktop or server an easy,
    standard, secure Web page tool that can have cutting-edge features and e-business
    storefronts.


    Where do you start? Just begin by setting up servers on your systems and joining
    the WWW!


    # Linux Apache Web server Installation


    Figures 8-1 through 8-24 illustrate the Linux Apache Web server installation.'
  merge: -1
  img_proc: true
