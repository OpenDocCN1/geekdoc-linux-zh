- pgno: 183
  md: '# Linux and OpenVMS—The Future


    In my day I’ve seen PDP 16-bit systems, VAX 32-bit systems, Alpha 64-bit systems,
    and now Itanium 64-bit systems. No doubt there will be a few more hardware platforms
    and systems in the general-purpose computing world before I’m ready to retire.
    Already Itanium supports 64-bit Linux, and the plan is to have OpenVMS and its
    layered products ported to Itanium by early 2004. What platform do we use when
    Windows, Linux, UNIX, VMS, NSK, and a host of other operating systems all run
    on the same hardware? As hard as it is to hear for many folks, one operating system
    isn’t the answer for all computing jobs.


    As we move forward with our industry, we need to look for the right tool for the
    right job and not being hung up every computer being the same. Same interfaces,
    same applications, same tools? Certainly! Not the same operating environment.


    We have needs for desktops, mid-range servers, super servers, clusters, and disastertolerant
    clusters; these aren’t deployed just on a single OS–it’s interoperability that
    gives us more choices, less cost, and better solutions for computer needs across
    our industry.


    The features that are hallmarks for Linux simply don’t add value at the high end
    of commercial systems, and without specific funding for that market niche, they
    may never become part of the Open Source and GNU world. The OpenVMS features that
    make it the best tool for 24/7/365 operations won’t win any friends down on the
    desktop that’s not its forte.


    Common ground, common applications, and common server applications are a great
    start to solving new problems, but learning about all the computing options that
    are available today lets solve future problems that we couldn’t solve using a
    single technology.


    See you in the future. It’s where we’re all destined to spend the rest of our
    lives!'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Chapter 9 — A Compendium of Open Source Tools for OpenVMS and Linux


    # Open Source Tools


    Look for the latest versions of these products when you want them (it''s always
    best to use the latest!).


    BASH the GNU Project''s Bourne Again shell, a complete implementation of the POSIX.2
    shell specification with interactive command-line editing, job control on architectures
    that support it, csh-like features such as history substitution and brace expansion,
    and a slew of some of the features available in BASH.


    OpenVMS distribution.


    ```

    http://www.openvms.compaq.com

    http://cnsw.cns.cwru.edu/~/bash/bashtop.html

    ```


    BZIP is another Open Source ZIP. Net says it''s better than GZIP.


    ```

    http://www.dlhoffman.com/publiclibrary/RPM/ByName.html

    http://www.ourservers.net/openvms_ports/bzip2/bzip2_contents.html

    ```


    CircleMUD is a multiuser dungeon (MUD) system written by Jeremy Elon, originally
    at Johns Hopkins University''s Department of Computer Science (I graduated in
    May 1996). CircleMUD is a derivative of DikuMUD Gamma 0.0, which was written in
    1990 at DIKU, the Department of Computer Science at the University of Copenhagen,
    by Katja Noye, Tom Madsen, Hans Henrik Staerfeldt, Michael Seifert, and Sebastian
    Hammer.


    ```

    http://www.circlemud.org/

    http://www.ourservers.net/openvms_ports/circlemud

    /circlemud_contents.html

    ```


    Corba The OMG specification defines just the environment; CORBA enables natural
    interoperability regardless of platform, operating system, programming language,
    or network hardware and software (although CORBA defines a mandatory TCP/IP protocol
    for interoperability over the Internet and most intranets).


    ```

    http://www.corba.org

    http://www.openvms.compaq.com/openvms/brochures/appdev/pages

    /PAGE7.HTM

    ```'
