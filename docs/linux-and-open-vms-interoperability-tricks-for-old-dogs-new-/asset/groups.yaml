    Hardware and software standards make computer communications possible, and while
    looking at another OSI chart (Happy Mnemonic: All People Seem to Need Data Processing!)
    may not seem useful, you will need to know where TCP/IP applications and protocols
    operate when you are troubleshooting in network applications! If you can''t tell
    the network manager why the problem is in Layer 3 or below, he she will always
    blame it on your box or application—so you better get to use it.


    # The Importance of a Network Manager


    Always remember that the network manager is your best friend in the network and
    can get you TCP/IP addresses, cables, and even Ethernet cards and software! The
    network manager knows where the routers are and what magic numbers to get ***(domain)
    Digital Name Service (DNS), as well as the gateway numbers to other networks.
    You should remember and mark well your new best friend will be a snarling beast,
    who''ll insult your lineage, choice of OS, or computer knowledge, if you have
    ever had occasion to question the network''s current status or ask why your system
    can''t seem to communicate with the other network.


    So let''s go over some questions that you or your network manager will need to
    answer for both machines before you ever start to connect a VMS and a Linux system
    to a TCP/IP network.'
  - '[PAGE 19]


    # Questions for Network Setup

    (Questions You Must Ask to Set up a TCP/IP Network)


    Q1: What is my TCP/IP address and how do I get one?


    An IP address is a unique numeric representation of a host system number for either
    your Linux or VMS box.


    TCP/IP uses the IP address to communicate with other hosts across a TCP/IP network.
    An IP number works like a street address. If I am given the address 666 Halloween
    Lane, I will be able to find the host represented by that address. If you give
    your TCP/IP networked Linux or VMS box an IP address, other hosts will be able
    to find it and your box will be able to find others across the network.


    Your network administrator or Internet Service Provider (ISP) will issue you an
    IP address that looks something like: 10.0.0.1. This number is a decimal representation
    of a binary number.


    If you are over 40 years old, you may remember being taught other base systems.
    People use a base 10 numbering system for obvious reasons (count your fingers
    to figure out why!). Is any of returning from your dank, dark memories of yesterday?
    No? Okay, let''s explain in slightly more detail. There are several base systems
    used in the computer field.


    Binary (base 2), hexadecimal (base 16), and decimal (base 10) are used most often.
    While the IP address you see is base 10, the hosts running TCP/IP see it in base
    2. So an IP address of 10.0.0.1 in base 10 is 00001010000000000000000000000001


    Now, which number is easier to remember?


    Certainly, if you''re a programmer 00001010000000000000000000000001 is much easier,
    just remember all the 0s and 1s. With the end and future Microsoft Certified Professionals
    in mind, the standards committees use the base 10 representation of a binary (base
    2) address. What is represented here is a simplification of TCP/IP and computer
    technologies.


    Just one thing about IP addresses before moving on to the next question. IP addresses
    are divided into classes. Think of classes as large groups of IP addresses, associated
    in numeric order. Class A addresses are grouped from 0–126, Class B is grouped
    from 128–191, and Class C is grouped from 193–233. We can determine what Class
    IP address belongs to by examining the first set of numbers on the far left. An
    IP address of 205.165.160.1 is Class C, because 205 is between 193 and 233.


    Okay, really, this will be the very last thing about IP addresses. Due to the
    explosion of the Internet, with servers, routers, handheld telephones,'
  - '[PAGE 20]


    refrigerators, and cars'' hubs needing an IP address, IP addresses have become
    a scarce commodity.


    To alleviate the scarcity of routable IP addresses (routable means able to traverse
    the Internet), network administrators are using a technology called NAT.


    So, most likely, you will be assigned a nonroutable IP address if you are at work
    or setting up a private local area network at home behind a cable/DSL connection.
    The nonroutable (private) IP addresses are 10.0.0.0, 172.168.0.0, and 192.168.0.0,
    depending on how many hosts are on the network.


    NAT technology allows you to have many nonroutable IP addresses behind a single
    routable address, which connects all the nonroutable addresses to the entire Internet.


    # Q2: What is my subnet mask for the network I''m currently on?


    Subnet masks divide TCP/IP class addresses into multiple networks. This allows
    networks to use more addresses and limits the number of TCP/IP nodes on these
    subnets.


    Usually your network administrator will provide you with a subnet mask, and there
    are exact calculations for dividing different TCP/IP classes into subnets.


    # Q3: What are my host and domain names?


    Remember in Q1, where I asked which was easier to remember, the base 10 or the
    base 2 IP address? Well, it''s even easier for you to remember names.


    VMSONE is easier to remember than 65.65.113.10. Domain names are used to group
    hosts on specific subnets of an IP address. It''s much easy to identify a group
    of hosts that are related if they have the same Internet domain.


    Host names have to be unique within their domain. Domain and host names with their
    corresponding IP addresses are recorded in domain name service (DNS/BIND) servers
    on your network. OpenVMS and Linux can be DNS servers, but if you are connecting
    to a TCP/IP network, DNS setup and service are best left to your network administrator
    or ISP. DNS servers are not for the novice hack and require the cooperation of
    other DNS servers in a network to work properly.


    # Q4: What is my DNS server address?


    The network administrator or ISP should provide the TCP/IP addresses of a primary
    DNS server and its backup (known as secondary). As mentioned previously, host
    and domain names are stored in a DNS server. A phone book and a DNS server are
    used in a similar manner.'
