    # TCP/IP Applications


    OpenVMS and Linux network together by using similar applications that work across
    the TCP/IP protocols connecting both machines. Table 3-2 is a list of some of
    the common applications with a brief description of what functions they perform.


    Table 3-2: TCP/IP Applications Between OpenVMS and Linux


    | TCP/IP Application | Description | When Configured |

    | --- | --- | --- |

    | BIND/DNS | Internet name services | Usually with your ISP |

    | FTP | File Transfer Protocol—network copies files between systems | Initial
    system installation |

    | LPD | Line Printer Daemon—used to print to network printers using TCP/IP | Whenever
    you add a network printer |

    | SMB | System Message Block—disk sharing between Windows UNIX, VMS, and Linux
    systems | See Chapter 7 of this book |'
  - '[PAGE 27]


    # Table 3-2: TCP/IP Applications Between OpenVMS and Linux (continued)


    | TCP/IP Application | Description | When Configured |

    | :--- | :--- | :--- |

    | Telnet | Terminal protocol application determines what terminal emulation is
    used and how well it works; TCP/IP just provides the connection | Initial system
    installation |

    | SMTP, POP3, IMAP | E-mail, Post Office Protocol, Simple Mail Transport Protocol
    | See Chapter 6 of this book |

    | SSL, Stunnel | Secure tunnel using secure sockets layer encryption | See Chapter
    4 of this book |

    | X Windows | Display X Windows between networked systems | See Chapter 5 of this
    book |


    OpenVMS and Linux TCP/IP applications work together because both applications
    adhere to industry-standard definitions for their functions. It might be a little
    too easy to say that it just works! Most of the time it''s exactly that it does
    work! Want to copy a file? FTP works on both systems and will determine if you
    are sending a binary file (compiled, zipped, or object file) or a text file and
    will transfer/copy the file correctly between machines. The same is true for X
    Windows, e-mail clients, Finger, Telnet and all the other standard TCP/IP applications.


    # URL Tricks and More


    TCP/IP tools are built in as part of the Linux and OpenVMS operating system. You
    can copy files, send e-mail, run a Web site, and much more. Interprocess communications
    make the client/server resolution possible, and the World Wide Web known IP ports
    keep applications working while new applications can be tested and run on the
    same server before moving a new application into production.


    The future of all this is, of course, new, and we should see more applications
    with enhancements and continuing increases in encryption and the use of encryption
    tools.


    One more TCP/IP trick before we move on to security in the next chapter: A good
    friend of mine, Steve Smiley, from DFWLUG here in Dallas, showed me this little
    trick and and an article for the DFWLUG Quadwords newsletter based on this conversion.'
  - '[PAGE 28]


    If you do an "NSLOOKUP" from a Linux or OpenVMS system and plug in a valid DNS
    name, you get an address such as 209.39.152.33. If you convert the TCP/IPs octets
    to their binary representations (with the help of a scientific calculator), you
    get


    ```

    209 = 110100201

    39 = 001001111

    ```


    Be sure to add the padded 0s in front for an 8-byte / character binary!


    ```

    152 = 10011000

    33 = 001000001

    ```


    Add the binary (base 2) strings together


    ```

    209.39.152.133 = 1101000100111100110000100001 (base2)

    = 3509032993 (base10)

    ```


    From Netscape Internet Explorer or your favorite Web browser, try these numbers:


    ```

    http://3509032993

    http://1094769874

    ```


    Which is easier to remember a 10 digit number or a URL name on the Web? You do
    the math.'
