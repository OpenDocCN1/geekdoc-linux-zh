    layered products ported to Itanium by early 2004. What platform do we use when
    Windows, Linux, UNIX, VMS, NSK, and a host of other operating systems all run
    on the same hardware? As hard as it is to hear for many folks, one operating system
    isn’t the answer for all computing.


    As we move forward with our industry, we need to look for the right tool for the
    right job and not being hung every computer being the same. Same interfaces, same
    applications, same tools? Certainly! Not the same environment. We have needs for
    desktops, mid-range servers, super servers, clusters, and disaster-tolerant clusters;
    these aren’t deployed just on a single OS–interoperability gives us more choices,
    less cost, and better solutions for computer needs across our industry. The features
    for Linux simply don’t add value at the high end of commercial systems, and without
    specific funding for that market, they may never become part of the Open Source
    GNU world. Common ground, common applications, and common server are a great start
    to solving new problems, but learning about all the computing options available
    today lets solve future problems using a single technology. See you in the future
    where we’re all destined to spend the rest of our lives!


    ## Chapter 9 — Compendium of Open Source Tools for OpenVMS and Linux


    ### Open Source Tools


    Look for the latest versions of these products when you want them (it''s always
    best to use the latest GNU Project''s Bourne Again shell, a complete implementation
    of the POSIX specification with interactive command-line editing, job control
    on architectures that support it, csh-like features such as history substitution
    and brace expansion, and a slew of some features available in BASH OpenVMS distribution).


