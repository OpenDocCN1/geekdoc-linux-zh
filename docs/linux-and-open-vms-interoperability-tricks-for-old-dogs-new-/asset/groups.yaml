    # Summary


    X Windows is an expanding and growing part of workstations and high-end servers
    even 15 years after its introduction. Standard support, and tools that work between
    multiple operating systems simplify and reduce the complexity of displaying graphics
    and running applications. This gives all of us a choice for each task that faces
    us: Whether to use a point-and-click GUI application or for a command-driven CLI.
    Graphics make the job intuitive and easy to visualize; command lines like scripting
    and repetition easy for many of the tasks server managers are being asked to automate.


    The arguments about which is better and what style of computing should be for
    rage on discussion groups and wherever a few good computer people compare notes.
    One is clear: All of these styles of computing are here to stay, and interoperability
    between multiple operating systems will be the hallmark of all future workstations
    and servers.'
