    # Command Controls for Your X Windows Sessions


    # Linux Command: xhost


    The xhost command on your Linux box controls who can write to your X Windows server
    display, as follows:


    +   * xhost + allows every host in your network to send X Windows displays to
    your screen.

    * xhost - allows no one in your network to send X Windows displays to your screen.

    * xhost+nodename allows just "nodename.com" to send X Windows displays to your
    screen.

    * xhost with no arguments tells you who is authorized to send X Windows displays
    to your screen.


    Remember: You can always block all networked X Windows displays by typing "xhost
    -u20” in a local terminal window. Be mindful of the security implications of this
    command for your workstation, especially in a public network! If in doubt be sure
    to turn off access with an "xhost --".\ (A practical joker could even overlay
    your Linux window manager with his or her window manager if you aren''t careful!)


    # OpenVMS Commands: SHOW-SET/DISPLAY and CREATE/TERMINAL


    In your new DECterm on your Linux box, type the information shown in Figure 5-4.


