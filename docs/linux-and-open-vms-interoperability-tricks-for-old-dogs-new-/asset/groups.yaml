    # Chapter 6 — Using E-mail with OpenVMS and Linux


    # Back in the Old Days


    Way back in the early 1980s computer users could send e-mail to each other through
    electronic BBSs with ASCII graphics and unencoded binary objects across 1,200-baud
    modems. And (with apologies to SNL''s Old Man) we liked it that way—no matter
    how painful it was or how long it took, we were grateful for the technology!


    By the time I finally switched from the ASCII communications I had used in my
    younger days to the e-mail client/server graphic'' revolution e-mail of PCs and
    workstations, I used embedded graphics, attachments, and binary transfer music
    and even video through e-mail. I also found (while transferring ASCII e-mail to
    TK50) that it took me 10 years of e-mail correspondence and daily use to have
    created a scant 1MB of data (using English as a communication protocol).


    As I filled and filled the two-thirds loaded floppy disk (after changing my mind
    about the 95MB TK50) with 10 years of e-mail history, I received my first real
    attachment from somewhere on DEC via the new client/server graphics interface
    to my shiny new DEC 320p laptop computer.


    I marveled that the 12 PowerPoint slides had been attached to the message (the
    text of what was written in MS Word) were 1.5MB of data—they wouldn’t even fit
    on the $10 1.44MB floppy disk I had just filled with the last ten years of history.


    How I ever managed without the ability to send graphics to everyone knew? How
    much disk space would I need in the brave new world? The horizons seemed endless
    to me, but I knew that I was glad that my company was bringing something called
    StorageWorks in the near future.


    # We Used to Copy E-mail Across 2,400-Baud Modems?


    Even with my corporate e-mail connection to the Net, by the mid-1990s I had been
    using UUCP at home to receive Internet e-mail for over five years. UUCP would
    dial up between my OpenVMS server and UNIX to copy batches of e-mail and from
    Linux, UNIX, and other BBS servers until the messages found themselves on a machine
    they were destined for or connected to the real Internet! While Internet gateways
    were expensive, UUCP systems were free. The catch was that UUCP nodes might have
    20 or more hops to find a gateway to the Internet. My worst time sending e-mail
    was a little every eight hours from home to my DEC department; my best time was
    little over 15 minutes before I switched to a permanent, instantaneous e-mail
    connection in 1997.'
