    如果我知道一个人的名字（主机名、域名），通过电话簿，我就可以找到他或她的电话号码（IP 地址）。DNS（域名系统系统）也使用了相同的过程：如果你想找到 VMSONE.com，但不知道它的
    IP 地址，TCP/IP 命名系统将解决这个问题。


    因此，如果我将 浏览器指向 VMSONE.com（一个我认识并能记住的名字），底层 TCP/IP 系统将查询本地 DNS 服务器，将该名称解析为适当的 IP
    地址，并使用该地址连接到 VMSONE.com。


    好了，好了，我所说的这一切都是对整个过程的极大简化。我明白这一点，但你不需要拥有 TCP/IP 博士学位就可以配置你的节点并让它们接入互联网或本地局域网！


    ## Q5: 我的默认网关/路由器地址是多少？


    默认网关地址是连接你的本地网络到其他网络的地址。它可以是你的 NAT（又提到这个了）防火墙、代理服务器，或连接你的局域网（LAN）与互联网其余部分的路由器地址。


    理解这一点最简单的方法是：除非你定义了这个数字，否则你无法与任何其他局域网或网络通信。在初始设置阶段，你不希望从你的机器开启路由（这意味着你的系统启用了多个
    TCP/IP 路径），除非你当前的系统连接了两个独立的 TCP/IP 网络（而不是路由器），否则你不会向整个网络导出路由信息。


    你的主机 TCP/IP 地址？例如：10.0.0.25


    你的子网掩码地址？例如：255.255.255.0


    你的主机名和域名？例如：Inxone.vmsone.com


    你的远程 DNS 服务器地址？例如：10.0.0.8


    你的局域网网关地址？例如：10.0.0.1


    有了了这五个问题的答案（从你的网络管理员或互联网服务提供商 ISP 获取），你应该能够在单一网络上配置 TCP/IP，并将你的 OpenVMS 和 Linux
    系统连接到网络。让我们来看配置 TCP/IP 系统的过程。


    ## 配置系统


    OpenVMS 和 Linux 都使用实用程序帮助配置你的 TCP/IP 网络。在 Linux 上（通过 root 账户），它被称为 network configuration（来自
    RedHat 根菜单），在 OpenVMS 上（通过系统账户），它被称为 tcpip/configure.com（在旧版本的 OpenVMS TCP/IP
    服务上称为 ucxconfigure.com）。


    ## 在 Linux 上配置 TCP/IP


    在 Linux 机器的 root 账户上，你可以通过在终端窗口输入 Linuxconf 来调用 Linuxconf，或者使用系统菜单从 GNOME 界面调用网络配置。图
    3-1 至图 3-5 展示了如何在 Linux 上配置 TCP/IP。


    ![](img/3ba916f144e94350147c366c3485e02e_22_0.png)


    图 3-1 填写基本主机信息，然后是适配器信息。


    ![](img/3ba916f144e94350147c366c3485e02e_22_1.png)


    图 3-2 选择基本主机信息。


    ![](img/3ba916f144e94350147c366c3485e02e_23_0.png)


    图 3-3 使用名称服务规范定义你的 DNS 服务器。


    ![](img/3ba916f144e94350147c366c3485e02e_23_1.png)


    图 3-4 设置你的默认路由器地址


    第 3 章 – 用于 OpenVMS 和 Linux 的 TCP/IP 23


    ![](img/3ba916f144e94350147c366c3485e02e_24_0.png)


    图 3-5 现在你应该已经完成了 Linux 以到你的 TCP/IP 网络的配置！


    ## 在 OpenVMS 上配置 TCP/IP


    登录系统账户并在 $ 提示符下输入：


    ```

    $ @sys$manager:tcppipconfig.com

    ```


    图 3-6 至图 3-9 展示了如何在 OpenVMS 上配置 TCP/IP。


    ![](img/3ba916f144e94350147c366c3485e02e_24_1.png)


    图 3-6 选择核心环境菜单。


    ![](img/3ba916f144e94350147c366c3485e02e_25_0.png)


    图 3-7 在 OpenVMS 菜单上输入数据。注意 BIND 和 DNS 是同一种东西！


    ![](img/3ba916f144e94350147c366c3485e02e_25_1.png)


    图 3-8 OpenVMS 客户端菜单允许你从系统中选择性启用或禁用 TCP/IP 客户端应用程序。


    ## 用于 OpenVMS 的 DIGITAL TCP/IP 服务


    ### 服务器配置


    | 组件 | 状态 |

    | :--- | :--- |

    | 1 BIND | 已禁用 |

    | 2 BOOTP | 已禁用 |

    | 3 TFTP | 已禁用 |

    | 4 FTP | 已启用 |

    | 5 LPR | 已禁用 |

    | 6 NFS | 已启用 |

    | 7 PC-NFS | 已禁用 |

    | 8 PORT | 已启用 |

    | 9 APPLE | 已禁用 |

    | 10 SNMP | 已禁用 |

    | 11 NTP | 已禁用 |

    | 12 METRIC | 已禁用 |

    | 13 POP3 | 已启用 |

    | 14 FINGER | 已启用 |

    | 15 RMT | 已禁用 |

    | 16 LBC | 已禁用 |

    | 17 DMCP | 已禁用 |


    图 3-9 OpenVMS 客户端菜单允许你从系统中选择性启用或禁用 TCP/IP 客户端应用程序。


    ### 菜单配置


    | 组件 | 状态 |

    | :--- | :--- |

    | Telnet | 已禁用 |

    | SMTP, POP3, IMAP | 已禁用 |

    | SSL, Stunnel | 已禁用 |

    | X Windows | 已启用 |


    ### 应用程序


    | 应用程序 | 描述 | 配置状态 |

    | :--- | :--- | :--- |

