    使用端口扫描器最简单、容易的方法当然是 TCP/IP 应用程序 Telnet！你可以使用 Telnet 来检查并与服务器上的任何已知端口或应用程序端口进行交互！通常你使用
    Telnet 客户端连接到服务器端口（默认编号为 23），但 Telnet 允许你更改端口以连接你希望的任何端口。只需在 VMS 或 Linux 提示符中输入：


