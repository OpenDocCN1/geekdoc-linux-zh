    (Network Independent Interface Specification) | 802.1<br>802.2<br>802.3<br>802.4<br>802.5<br>802.6
    | Interworking LLC Log C Ethernet CSMA/CD Token Bus Token Ring Metropolitan Networks
    |

    | Layer 1—Physical | Network transmission media: twisted pair, coax, fiber, wireless
    | 802.7<br>802.8<br>802.9<br>802.10<br>802.11<br>802.12 | Broadband Advisory Fiber
    Tech Advisory Integrated Voice/Data Network Security Wireless Networks Priority
    |


    Hardware and software standards make computer communications possible, and while
    looking at another OSI chart (Happy Mnemonic: All People Seem to Need Data Processing!)
    may not seem useful, you will need to know where TCP/IP applications and protocols
    operate when you are troubleshooting in network applications! If you can''t tell
    the network manager why the problem is in Layer 3 or below, he she will always
    blame it on your box or application—so you better get to use it.


    ## The Importance of a Network Manager


    Always remember that the network manager is your best friend in the network and
    can get you TCP/IP addresses, cables, and even Ethernet cards and software! The
    network manager knows where the routers are and what magic numbers to get ***(domain)
    Digital Name Service (DNS), as well as the gateway numbers to other networks.
    You should remember and mark well your new best friend will be a snarling beast,
    who''ll insult your lineage, choice of OS, or computer knowledge, if you have
    ever had occasion to question the network''s current status or ask why your system
    can''t seem to communicate with the other network.


    So let''s go over some questions that you or your network manager will need to
    answer for both machines before you ever start to connect a VMS and a Linux system
    to a TCP/IP network.


    ## Questions for Network Setup

    (Questions You Must Ask to Set up a TCP/IP Network)


    Q1: What is my TCP/IP address and how do I get one?


    An IP address is a unique numeric representation of a host system number for either
    your Linux or VMS box.


    TCP/IP uses the IP address to communicate with other hosts across a TCP/IP network.
    An IP number works like a street address. If I am given the address 666 Halloween
    Lane, I will be able to find the host represented by that address. If you give
    your TCP/IP networked Linux or VMS box an IP address, other hosts will be able
    to find it and your box will be able to find others across the network.


    Your network administrator or Internet Service Provider (ISP) will issue you an
    IP address that looks something like: 10.0.0.1. This number is a decimal representation
    of a binary number.


    If you are over 40 years old, you may remember being taught other base systems.
    People use a base 10 numbering system for obvious reasons (count your fingers
    to figure out why!). Is any of returning from your dank, dark memories of yesterday?
    No? Okay, let''s explain in slightly more detail. There are several base systems
    used in the computer field.


    Binary (base 2), hexadecimal (base 16), and decimal (base 10).


