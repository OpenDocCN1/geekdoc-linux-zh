    # 二进制发布版本


    可在 `binaries/` 目录下找到。每个二进制发行版都包含一个 README 文件。


    ## Apache 2.0.43


    此版本修复了 CAN-2002-0640 中描述的安全问题，并修复了 2.0.42 中的某些错误（并带有额外的兼容性说明）。敦促 Apache 2.0.42
    的用户尽快升级。


    详情请参阅[官方公告]。在此处检查在您的平台上构建或运行 Apache 2.0.43 是否需要任何补丁或其他指令。


    Apache 2-x 扩展模块与为 Apache 1.3 编写或编译的模块不兼容。如果您正在运行第三方扩展模块，您可能需要为 Apache 2.0 重新编译它们，或者在尝试从
    Apache 1.3 升级之前等待第三方。


    请注意 Apache 的 win-src-zip 文件与 tar 版本几乎相同。然而，它们提供了 Windows 格式的源文件并包含了 Win 构建文件。win-src-zip
    文件不包含二进制文件！请查看 `binaries/` 目录获取二进制发行版。


    ## Apache 1.3.27 也可用。


    Apache 1.3.27 是 1.3 系列的最佳可用版本，优于所有之前的 1.3 及更早版本。此版本修复了 CAN-2002-0639、CAN-2002-0640
    和 CAN-2002-0643 中描述的安全问题。它还修复了 1.3（及更早）的一些错误，并增加了一些额外的兼容性。敦促 Apache 1.3.26 的用户尽快升级。


