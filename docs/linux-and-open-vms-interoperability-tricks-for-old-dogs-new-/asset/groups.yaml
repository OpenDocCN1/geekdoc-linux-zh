    2000), and the beginnings of DCE. OpenVMS and many UNIXes adopted X Windows, because,
    unlike display-list managers or other local GUIs that could only display graphics
    and control to the local system, X Windows was designed and optimized to have
    its graphical interface networked. X Windows was designed for local or remote
    application display across many standard network protocols (TCP/IP, LAT, DECNet,
    SNA). In X Windows (unlike window managers that controlled only local hardware,
    such as a local plotter), graphical output was architected and optimized for transmission
    across networks to other X Windows displays on any X Windows computer in the network!
    This makes applications easy to display between multiple systems or made it easier
    to have many different graphics brought to a single graphics display regardless
    of operating system of origin! That level of Open Systems interoperability is
    why DEC chose X Windows as its GUI OpenVMS workstations and servers in 1988 and
    why HP continues to support X Windows to its day!


    Fast forward 17 years and 6 major X Windows software releases, and to this timetested
    graphical-display system today''s security, new graphical cards, Alpha system
    computational performance, and faster and faster network connections. It''s easy
    to see why a low-cost Linux system would make a perfect, inexpensive integrated
    workstation to display graphics and applications from an OpenVMS server using
    standard X tools!


    ## Displaying OpenVMS X Windows Applications on a Linux Workstation


    There are two parts to displaying OpenVMS applications on a Linux workstation.
    The first part is to log to the Linux workstation and set security to accept remote
    display from the OpenVMS applications. The second part is to Telnet to the OpenVMS
    workstation and redirect X Windows output to the Linux machine and then run the
    application. In order to perform this function you must have two accounts, one
    on the Linux workstation and one on the OpenVMS server.


    Let''s go through the command process: Log in to an X Windows session on your
    Linux box. Open an interactive terminal and type (see Figures 5-2 and 5-3).


    johnw@lnone.vsmone.com:/home/johnw <3>


    ```

    File Sessions Options Help

    johnw@lnone.vsmone.com # host vsmone.com

    vsmone.being added to access control list

    johnw@lnone.johnw telnet vsmone.com

    trying 85.24.200...

    Connected to vsmone.com.

    Escape character is ''^''.

    ```


    Welcome to OpenVMS (TM) Alpha Operating System, Version V7.2-1

    Username: wisniewski

    Password:


    ![](img/3ba916f144e94350147c366c3485e02e_59_0.png)


    Last interactive login on Monday, 21-MAY-2001 23:37:35,10

    Last non-interactive login on Monday, 21-MAY-2001 23:19:22,40


    ```

    # set display/create/nodes/lnoneone.vsmone.com/transportstctip/screen=0

    create/tera

    ```


    Figure 5-2 You should have redirected your OpenVMS create/terminal command to
    display its results on the Linux workstation!


    ![](img/3ba916f144e94350147c366c3485e02e_59_1.png)


    Figure 5-3 Congratulations! You''ve just created a terminal from your OpenVMS
    system to your Linux box!


    ## Command Controls for Your X Windows Sessions


    ### Linux Command: xhost


    The xhost command on your Linux box controls who can write to your X Windows server
    display, as follows:


    - xhost + allows every host in your network to send X Windows displays to your
    screen.

    - xhost - allows no one in your network to send X Windows displays to your screen.

    - xhost+nodename allows just "nodename.com" to send X Windows displays to your
    screen.

    - xhost with no arguments tells you who is authorized to send X Windows displays
    to your screen.


    Remember: You can always block all networked X Windows displays by typing "xhost
    -" in a local terminal. Be mindful of the security implications of this command
    for your workstation, especially in a public network! If doubt be sure to turn
    off access with "xhost +". It could even overlay your Linux window manager with
    his or her window if you aren''t careful!


    ### OpenVMS Commands: SHOW DISPLAY and CREATE/TERMINAL


    In your new DECterm on your Linux box, type the information shown in Figure 5-4.


    - **Device**: means that Open VMS terminal (process) will redirect its output
    to a graphical device to accept input.

    - [super] means that all applications run from this process will be displayed.

    - [user] would mean that only the next application run from this process would
    be displayed.

    - **Node**: this is where the X Windows server is located.

    - **Transport**: this is the protocol that is being used.

    - **Server**: some systems can have multiple instances of X Windows running. Zero
    is the default.

    - **Screen**: X Windows server can have more than one display connected to two
    or more graphical heads attached.


    ```

    show display

    Device: super

    Node: node.com

    Transport: TCP/IP

    Server: 0

    ```


    All of these parameters can be changed by issuing:


    ```

    SET DISPLAY/CREATE/NODE=node.com/TRANSPORT=tcpip/SCREEN=0

    ```


    - /EXECUTIVE_MODE (optional) creates an executive mode for all processes on your
    system to use.

    - /SUPERVISOR_MODE (optional, default) creates a supervisor mode for your current
    processes (and subprocesses) to use.

    - /USER_MODE (optional) restricts the next command. This will not change where
    the output is for all new programs that run!


    The CREATE/TERMINAL command can be added to for additional functions:


    - /DETACH will create a detached background process for the terminal.

    - /NOPROCESS will make the terminal ask you to log in as a different user. It
    is useful if you want to log in while still logged in with your Windows terminals.

    - /BIG_FONT /LITE_FONT /CLI /WINDOW ATTRIBUTES and many other details about your
    terminal can be modified as the terminal is created. Be sure to check out the
    VMS utility HELP CREATE/TERMINAL and create a terminal that is just right for
    you.


    ## OpenVMS X Windows Applications


    Let''s look at the applications that come with OpenVMS when you install X Windows
    (see Figure 5-5). All of these standard applications have the prefix DECW$. DECW$CALC,
    DECW$PAINT, DECW$CALENDAR, DECW$MAIL, DECW$CARDFILE, DECW$MESSAGEPANEL, DECW$NOTEPAD,
    and DECW$PUZZLE are similar to the image below.


    ```

    john@4nx.vms.com:~home/john

    File Sessions Options Help

    # dir sys$system:decw*

    DIRECTORY SYS$COMMON:[SYSEX]

    DECW$BOOKREADER,EXE:1      DECW$CALC,EXE:1       DECW$CALENDAR,EXE:1

    DECW$CARDFILE,EXE:1      DECW$BI,EXE:1         DECW$CLOCK,EXE:1

    DECW$DWT,EXE:1           DECW$INT_FONT_DAEMON,EXE:1

    DECW$DWT_XDRIVER,EXE:1 DECW$MSESSION,EXE:1

    DECW$COMPILER,EXE:1     DECW$MAIL,EXE:1

    DECW$MESSAGEPANEL,EXE:1  DECW$MEMMAP,EXE:1

    DECW$OVERLAY,EXE:1      DECW$NOTEPAD,EXE:1     DECW$PAINT,EXE:1

    DECW$PUZZLE,EXE:1       DECW$REINIT,EXE:1      DECW$SCREEN,EXE:1

    DECW$SEEKVER,EXE:1      DECW$SERVER_QUICK,EXE:1

    DECW$SESSION_MAIN,EXE      DECW$SETSHODIS,EXE:1  DECW$PVRM,EXE:2

    DECW$STARTLOG,EXE:1      DECW$TABLE,EXE:1       DECW$TERMINAL,EXE:1

