    ## Linux 与 OpenVMS 的互操作性


    ### Linux 与 OpenVMS——未来


    在我时代，我见过 PDP 16 位系统、VAX 32 位系统、Alpha 64 位系统，以及现在的 Itanium 64 位系统。毫无疑问，在我准备退休之前，通用计算世界还会有几个硬件平台和系统。Itanium
    已经支持 64 位 Linux，计划在 2004 年初将 OpenVMS 及其分层产品移植到 Itanium 上。当 Windows、Linux、UNIX、VMS、NSK
    以及其他许多操作系统都运行在相同的硬件上时，我们使用什么平台？对于许多人来说，听起来很难接受，但一个操作系统并不是所有计算的答案。


    随着我们行业向前发展，我们需要为正确的工作寻找正确的工具，而不是纠结于每台计算机都必须相同。相同的接口、相同的应用程序、相同的工具？当然可以！但环境不同。我们需要桌面级、中端服务器、超级服务器、集群和容灾性集群；这些并非仅仅部署在单一操作系统上——互操作性为我们提供了更多选择、更低的成本以及针对我们行业整个计算机需求的更好解决方案。Linux
    的功能在商业系统的高端并没有增加价值，在没有该市场特定资金的情况下，它们可能永远无法成为开源 GNU 世界的一部分。共同的基础、通用应用程序和通用服务器是解决新问题的良好开始，但了解今天可用的所有计算选项可以让我们使用单项技术解决未来的问题。未来见，我们注定要在那里度过余生！


    ## 第 9 章 —— OpenVMS 和 Linux 开源工具汇编


    ### 开源工具


    当您需要时，寻找这些产品的最新版本（这总是最好的），它们是 GNU 提供的完整套件，支持多种平台、操作系统和网络，符合 POSIX 标准，并具有交互式编辑、如
