    As we move forward in this millennium, the battle cry should be for the lowest-cost,
    right tool for every style of computing. Between OpenVMS and Linux operating systems,
    a very large part of the computing spectrum is being delivered, and in a most
    cost-effective way. Now let''s explore the types of things both Linux and OpenVMS
    can do today!


    The rest of the chapters in this book are a series of how-to-processes designed
    to utilize both your OpenVMS and Linux box in different ways (TCP/IP, NFS, E-mail,
    X Windows, and more). The procedures are easy and to the point. They should also
    be a good starting point for you to explore these functions for more advanced
    use and deployment! You won''t need to read this book cover to cover; the chapters
    should be self-contained and, I hope, a good reference for your specific Linux
    and OpenVMS interoperability issues.


    The rest of this book assumes that you have a running OpenVMS and Linux system
    configured with TCP/IP and a working knowledge of both OSs as a user and operator.
    (You''ll also need system privileges on both systems; don''t worry, Chapter 2
    shows you how to get System and root on your boxes. But don''t experiment on your
    production machines; two small workstations in the same network would be a great
    test bed as you learn to connect OpenVMS and Linux together.)


    ## Chapter 2 — Breaking into OpenVMS and Linux


    ### Equipment for Those Who Have None


    Once upon a time there were these three computer collectors—stop me if you''ve
    heard this one.


    Oh sure, for a few hundred dollars you can get older Alpha 64-bit systems or Intel-based
    32-bit systems that will run OpenVMS or Linux, but consider that many companies
    (and even some users) are trading up to the latest hardware every 18 months or
    less. Rather than just throwing out this equipment, owners would rather give it
    to a good home, someone could use old hardware for learning purposes or for user
    groups. IT professionals have a lot of guilt about getting rid of perfectly “old”
    equipment, so you should make it known at local user group meetings that you need/will
    work on older equipment. Seek and you will find. Knock someone might open the
    back door of a loading dock for you!


    You have gone to a Saturday sale, gotten a call from an IT friend, or had someone
    at the back door of a corporate office offering you equipment. After you negotiate
    your final deal for the gear, you find yourself driving home, pleased that you
    have in your personal collection equipment that someone once paid thousands and
    hundreds of thousands of dollars for, and you have now obtained this equipment
    for the cost of a tank of gas (or less).


    ### Reality Sets in the Way Home


    Of course, as you''re driving home you realize that it''s an OpenVMS machine,
    you need license product authorization keys (PAKs) to make the software work.
    There may be licenses already on the machine (if the system admin didn''t erase
    the disk), but there is really nothing having your own licenses to make you feel
    like you own the box. But don''t call HP and buy new licenses. If your machine
    is destined for home use and personal education, you can get an OpenVMS hobbyist
    license with base VMS, clustering, and over 105 layered PAKs for free! Just go
    to the OpenVMS hobbyist Web page at http://www.montagar.com/-hobbyist.


    Register on the Web, and you will have all the PAKs you need to run an OpenVMS
    system sent to you via e-mail in a matter of minutes. You should note that these
    licenses are for personal or hobbyist use; you would have to call HP and get commercial
    licenses for your new system if you were going to use it for your or someone else''s
    business!


    ### Back at the Treasure Hunt


    Arriving home with the new treasure for your collection you check out the hardware
    and supplying the missing pieces for your new system—maybe a monitor or ASCII
    terminal, power cord, keyboard, or mouse; perhaps you need to tighten a few loose
    screws or install a disk. The power cords are in place, all the cards have been
    reset in their slots, the network card is plugged in, the monitor is connected
    to what looks like a VGA port, and the moment of truth arrives. You apply power
    to the system! The monitor makes a sound like a loose guitar and symbols appear
    on your screen:


    - - 16, 32, 64, 96, 128 Mbytes of memory count down (the system is looking better
    and better).

    - - The floppy grooms, the CD-ROM blinks, and the BIOS firmware shows it''s loaded
    with options.

    - - The hard drive starts to boot Linux, or OpenVMS—quick, what are you going
    to do?


    By the time you are to ask the boot messages have flashed by, the X Windows banner
    login comes up and you are stuck with a multiuser system without a user name or
    login.


    An X Windows login banner hides secrets! Was this a system that managed a nuclear
    plant, hospital, bank, or ISP? Maybe part of the deal with the person who gave
    you the system that you would scratch the disk to remove all of that valuable,
    proprietary data; but here blinks the cursor—mocking you from a small login screen.


    So you resolve to break in, peek under the covers, and then scratch the drives—as
    any good system administrator worth his or her weekly ration might do. Ethics
    aside, there are many legitimate reasons for breaking in and taking control of
    Linux or OpenVMS systems, even if you''re not the system owner!


    ### Legitimate Reasons for Breaking into Linux or OpenVMS Computers


    - - The system admin has left the company with the system.

    - - The system admin has forgotten the password.

    - - You need to recover data from a crashed system.

    - - You need to perform emergency maintenance when the owner is unavailable.


    ### Ten-Step Process for Changing a Linux Root Password


    - 1. Have physical access to the Linux system.

    - 2. Boot from the Live CD-ROM.

    - 3. Choose "rescue" at the boot menu.

    - 4. Choose English language.

    - 5. Choose "Continue" to mount the system.

    - 6. Enter the shell.

    - 7. Use `chroot` to enter the mounted system.

    - 8. Use `passwd` to change the root password.

    - 9. Exit the shell and shutdown.

    - 10. Remove CD-ROM and reboot.


    ### Ten-Step Process for changing an OpenVMS System Password


    - 1. Have physical access to the OpenVMS system.

    - 2. Reboot/halt the boot process and find yourself at a three chevron prompt.

    - 3. Set the boot-flag for conversational boot.

    - 4. At the "SYSBOOT>" prompt, set `uafternlate 1` and continue.

    - 5. Log in without a password.

    - 6. Prepare to modify the old VMS password file.

