    如今，随着免费电子邮件账户的出现，对于拥有电脑的人来说，拨号接入费用每月低于 10 美元，大多数人认为这种类型的电子邮件已经过时且原始。虽然 UUCP 邮件的用处已经消减，但有趣的是，该协议在业余无线电（数据包/系统到系统）邮件以及全球其他仍然难以获取互联网拨号（POTS——普通电话服务）的地方仍在使用。


    ## 从网络时代的黎明至今


    在《维多利亚时代的互联网》中，汤姆·斯坦丹奇（Tom Standage）描述了十九世纪的世界如何通过一项技术奇迹——电报得以缩小并传递。汤姆的书引用了塞缪尔·摩斯（Samuel
    Morse）1872年的诗：“科学从这一岸到另一岸宣告，时间和空间不再受支配。”


    在过去的 150 年里，电报、电话和卫星缩短了人们交流的距离，而近年来的互联网和电子邮件又将这些工具进一步缩小了十倍——仅仅通过压缩技术和近乎普及的访问。如果一封邮件就能解决问题，为什么还要打电话呢？如果一个
    URL 就能指向 Web 的共同现实，为什么还要进行对话呢？


    这对生产力非常有好处，但那些让我们通过学徒制不断学习和加深理解的人与人的互动又是怎样的？电子通信将如何影响我们的学习方式，目前尚无定论。我们这一代人拥有家庭办公室、数字手机、远程办公、万维网和电缆，因此我们可能最依恋同类，或者生活在自己的盒子里——只够出门付电费，买点维生素以维持运转。无论好坏，简洁和高效是电子邮件带给我们的特质。


    当然，如果你仍然想在网上进行对话，现在可以使用各种即时通讯工具，就像十九世纪的电报员一样，他们发现自己花了大量时间与其他运营商聊天、闲谈八卦（但对于今天的人来说，这听起来比例很低）。尽管技术发生了巨大的变化，但人们在过去的
    150 年里变化很小。许多人仍然必须放下手头的工作，聚集在办公室的茶水旁，聊聊当天的事件。


    ## 电子邮件程序的兴起兴灭


    1987 年当数字公司（Digital）加入时，它的电子邮件在全球范围内大约有八百万用户。它具有全文本文字处理和共享日历功能（用于会议室等资源），这让人们的时间更容易安排，并能跟踪附件、邮件列表以及各种邮件系统网关的交换情况。它运行在
    OpenVMS 集群上，客户端/服务器连接现在仍然存在。尽管拥有如此强大的技术实力，数字公司在 1996 年仍选择了一个新的邮件系统——一种可以发送文字处理文档、图片和其他二进制文件的邮件系统。


    新的电子邮件系统增加了可以在 Windows 操作系统上运行的优势，而在 1996 年，大家都知道这是在通过千年虫（Y2K）后唯一生存下来的平台。Microsoft
    Exchange 比免费的基于标准的电子邮件要贵得多，但话又回来，微软的营销做得好得多。剩下的就是历史了！


    ## 开放标准互联网邮件


    开放电子邮件标准都围绕着 TCP/IP 标准和控制它们的 RFC（意见请求）过程展开。需要注意的是，当前的电子邮件协议正在演进，并随着改进不断添加新功能。终端用户不会担心这些标准，但那些为
    VMS 或 Linux 等操作系统进行实现工作的人会担心。用户需要知道的是，他们从自己的平台上可以使用哪些基于标准的电子邮件客户端，以及可以建立什么样的邮件服务器来存储/检索网络中
    OpenVMS 和 Linux 服务器上的邮件。


    互联网客户端电子邮件应用程序基本上都在做相同的事情，但某些程序比其他的具有更多。在客户端电子邮件系统中，你应该寻找哪些功能？单元格或图形电子邮件应用程序应该是首选。像
    PINE 这样的程序是基于字符单元的，但可以发送附件和二进制文件，并可以在 OpenVMS 和 Linux 上作为客户端运行。其他程序，如 Mozilla（源自
    Netscape），也运行在 OpenVMS 和 Linux 上，但需要 X Windows 图形显示器才能工作。所见即所得（WYSIWYG）邮件窗口允许你从网络中的任何地方通过
    telnet 阅读你的邮件——至少是文本部分！


    今天在配置电子邮件服务器时，需要检查的重要标准包括：


    - POP3—后邮局协议 V3：如果你的邮件服务器支持此协议，你的远程邮件客户端可以配置为从服务器下载你所有的邮件/消息并下载到你的客户端系统。一旦消息已下载到客户端，POP3
    会删除邮件/消息服务器上的内容。

    - IMAP—互联网消息协议：IMAP 将消息存储在电子邮件服务器上，供许多不同位置的多个客户端使用！可以使用其他用户的系统作为电子邮件客户端，并从电子邮件/消息服务器上移动或删除未读消息！这意味着你可以从你有权的任何系统读取邮件，并且当你注销时，消息将安全地保留在服务器上。


    你何时使用每种协议？有些用户希望服务器将消息传递给并从服务器上删除——那么 POP3 是答案。其他用户喜欢使用客户端应用程序，并倾向于将消息存储在电子邮件服务器上以便存档和后期检索及查看——IMAP
    最适合他们。我能对使用这些电子邮件协议提供的唯一警告是：对于你创建的每个电子邮件账户，在服务器上的每个邮件账户只使用 POP3 或 IMAP 作为访问方法。如果你同时使用
    POP3 和 IMAP 访问同一个账户，你的客户端可能会有点困惑（如果你没有在客户端上创建电子邮件配置文件的话）！（多次登录不是获取卓越邮件体验的最佳方式。）


    好消息是，OpenVMS 和 Linux 都能让电子邮件客户端通过 POP3 或 IMAP 访问其标准用户账户中的消息。你们只需要在系统上激活电子邮件服务，用户账户就会集成到电子邮件中。然后可以使用远程电子邮件客户端通过
    OpenVMS 和 Linux 上的 POP3 或 IMAP 访问这些账户。


    ## OpenVMS 电子邮件服务器配置


    让我们将 OpenVMS 设置为电子邮件服务器（参见图 6-1 至 6-36）。我们将假设像第 3 章讨论的那样 TCP/IP 已经设置好。


    ## Compaq TCP/IP 服务 OpenVMS 配置菜单


    配置选项：


    - 1 核心环境

    - 2 客户端组件

    - 3 服务器组件

    - 4 可选组件

    - 5 关闭 Compaq TCP/IP 服务

    - 6 启动 TCP/IP 服务

    - 7 运行测试


    ## Compaq TCP/IP 服务 OpenVMS 客户端组件配置菜单


    配置选项：


    - 1 FTP 已启用

    - 2 NFS 客户端禁用

    - 3 REXEC 和 RSH禁用

    - 4 RLOGIN 已启用

    - 5 SMTP 已禁用

    - 6 TELNET 已启用

    - 7 DHCP 已禁用

    - 8 Telnetsym 已禁用


    '
