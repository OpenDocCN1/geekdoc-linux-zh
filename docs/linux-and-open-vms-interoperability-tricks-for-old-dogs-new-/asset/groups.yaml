    # # OpenVMS Advanced Server Installation and Configuration


    To install OpenVMS Advanced Server as a primary domain controller (NT 4.0 security
    model) you must perform five steps as follows:


    +   1. Configure the OpenVMS registry (see Figures 7-14 through 7-26).

    2. Configure OpenVMS IP for Advanced Server (see Figures 7-27 through 7-34).

    3. Install OpenVMS Advanced Server from the layered products CD-ROM (see Figures
    7-35 through 7-45).

    4. Configure OpenVMS Advanced Server processes (see Figures 7-46 through 7-65).

    5. Configure OpenVMS Advanced Server as a domain controller (see Figures 7-66
    through 7-73).


