    随着我们迈入这一千年，我们的战斗号应该是：为每种计算风格提供成本最低、最合适的工具。在 OpenVMS 和 Linux 操作系统之间，计算光谱中的很大一部分已经以一种极具成本效益的方式实现了。现在，让我们探索一下
    Linux 和 OpenVMS 今天能够做的事情吧！


    本书的其余章节将是一系列“如何操作”流程，旨在以不同的方式利用你的 OpenVMS 和 Linux 设备（TCP/IP、NFS、电子邮件、X Windows
    等）。这些步骤既简便又直击要点。它们也应该是你探索这些功能以进行更高级的用法和部署的良好起点！你不需要从头到尾读完这本书；这些章节应该是相互独立的，而且我希望它们能成为你解决特定的
    Linux 和 OpenVMS 互操作性问题的良好参考。


    本书的其余部分假设你已经有一套运行且配置了 TCP/IP 的 OpenVMS 和 Linux 系统，并且作为用户和操作员对这两个操作系统都有相关知识。（你还需要两个系统上的系统权限；别担心，第
    2 章将教你如何在你的设备上获取 System 和 root 权限。但不要在你的生产机器上进行实验；在学习连接 OpenVMS 和 Linux 时，同一网络中的两个小型工作站将是一个很好的测试平台。）


    ## 第 2 章 — 破解 OpenVMS 和 Linux


    ### 为那些一无所有的人准备设备


    从前，有三个计算机收藏家——如果你听过这个故事请打断我。


    噢当然，花几百美元你可以买到旧的 Alpha 64 位系统或基于 Intel 的 32 位系统，它们可以运行 OpenVMS 或 Linux，但请考虑，许多公司（甚至某些用户）每
    18 个月或更短就会升级到最新的硬件。与其直接扔掉这些设备，不如给它们找一个好人家，有人可以将旧硬件用于学习或用户组。IT 专业人员在处理这些完美的“旧”设备时会有很多罪恶感，所以你应该在本地用户组会议上说明你需要/将处理旧设备。寻找吧，你就会发现。敲敲门，也许有人会为你打开装货平台的后门！


    你去了一场周六特卖，接到了 IT 朋友的电话，或者在公司办公室后门有人为你提供设备。当你为这些设备谈好最终价格后，你发现自己正开车回家，感到很高兴，因为你的个人收藏中有了别人曾花费数千甚至数十万购买的设备，而你现在花箱油钱（或更少）就获得了这些设备。


    ### 现实在回家路上出现


    当然，当你开车回家时，意识到这是一台 OpenVMS 机器，你需要产品授权密钥（PAK）才能让软件运行。机器上可能已经有了许可证（如果系统管理员没有擦磁盘的话），但如果没有自己的许可证，你不会觉得自己拥有了这台机器。但不要给
    HP 购买新许可证。如果你的机器注定用于家庭和个人教育，你可以免费获得包含基础 VMS、集群以及超过 105 多个分层 PAK 在内的 OpenVMS 爱好者许可证！只需访问
    OpenVMS 爱好者网页 http://www.montagar.com/-hobbyist 即可。


    在网页上注册，你将在几分钟内通过电子邮件收到的运行 OpenVMS 系统所需的所有 PAK，并发送给你。你应该注意，这些许可证是供个人或爱好者使用的；如果你打算将其用于你或他人的业务，就必须拨打
    HP 获取商业许可证！


    ### 回到寻宝现场


    带着新收藏的宝藏回到家，你检查了硬件并为新系统配备了缺失的部件——也许显示器或 ASCII 终端、电源线、键盘或鼠标；也许你需要拧紧几个松动的螺丝或安装磁盘。电源线已就位，所有显卡已在插位中重置，网卡已插入，显示器连接到一个看起来像
    VGA 的端口上，真相的时刻到了。你为系统通了电！显示器发出了类似松动吉他的声音，屏幕上出现了符号：


    - - 16, 32, 64, 96, 128 Mbytes 内存倒计时（系统看起来越来越好）。

    - - 软驱在运行，CD-ROM 闪烁，BIOS 固件显示已加载选项。

    - - 硬盘开始启动 Linux 或 OpenVMS——快，你打算怎么办？


    当你准备询问启动信息时，它们已经一闪而过，X Windows 登录横幅出现，你被困在一个没有用户名或登录界面的多用户系统中。


    X Windows 登录横幅隐藏着秘密！这台系统是管理核电站、医院、银行还是 ISP 的系统吗？也许与给你系统的人交易的一部分是，你要刮掉磁盘以删除所有这些珍贵的专有数据；但这里光标在闪烁——在小登录屏幕上嘲笑你。


    所以你决定破解，窥探“被子”内部，然后刮掉硬盘——正如任何值其每周配给的优秀系统管理员可能可能会做的那样。撇开道德不谈，破解并控制 Linux 或 OpenVMS
    系统有许多合法的理由，即使你不是系统所有者！


    ### 破解 Linux 或 OpenVMS 计算机的合规理由


    - - 系统管理员已离开公司并留下了系统。

    - - 系统管理员忘记了密码。

    - - 你需要从崩溃的系统中恢复数据。

    - - 当所有者不在时你需要进行紧急维护。


    ### 修改 Linux Root 密码的十步骤


    - 1. 拥有对 Linux 系统的物理访问。

    - 2. 从 Live CD-ROM 启动。

    - 3. 在启动菜单中选择“rescue”（救援）。

    - 4. 选择英语。

    - 5. 选择“Continue”（继续）以挂载系统。

    - 6. 进入 shell。

    - 7. 使用 `chroot` 进入挂载的系统。

    - 8. 使用 `passwd` 修改 root 密码。

    - 9. 退出 shell 并关机。

    - 10. 移除 CD-ROM 并重启。


    ### 修改 OpenVMS 系统密码的十步骤


    - 1. 拥有对 OpenVMS 系统的物理访问。

    - 2. 重启/停止启动过程，发现自己处于三向箭头提示符处。

    - 3. 设置对话式启动的启动标志。

    - 4. 在 "SYSBOOT>" 提示符下设置 `uafternlate 1` 并继续。

    - 5. 无密码登录。

    - 6. 准备修改旧的 VMS 密码文件。


