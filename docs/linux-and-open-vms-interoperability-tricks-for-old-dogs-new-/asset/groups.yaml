    WSKI\\VMSONE>\n```\n\n图 7-70 为你的服务器添加共享，新用户可以使用它们进行磁盘存储！\n\n```\nWSKI\\VMSONE>\
    \ mod share dkb100_share/description=\"Guest Share location\"\n%PWRK-S-SHAREMOD,\
    \ share \"DKB100_SHARE\" modified on server \"VMSONE\"\n```\n\n```\nWSKI\\VMSONE>\n\
    WSKI\\VMSONE>\nWSKI\\VMSONE>\nWSKI\\VMSONE>\nWSKI\\VMSONE>\nWSKI\\VMSONE>\nWSKI\\\
    VMSONE>\nWSKI\\VMSONE>\nWSKI\\VMSONE>\nWSKI\\VMSONE>\nWSKI\\VMSONE>\nWSKI\\VMSONE>\n\
    WSKI\\VMSONE>\nWSKI\\VMSONE>\nWSKI\\VMSONE>\nWSKI\\VMSONE>\nWSKI\\VMSONE>\nWSKI\\\
    VMSONE>\nWSKI\\VMSONE>\nWSKI\\VMSONE>\nWSKI\\VMSONE>\n```\n\n图 7-71 你可能想为你定义的不同目录/共享设置权限。\n\
    \nLinux 与 OpenVMS 的互操作性\n\n```\nWSKI\\VMSHOE>\nWSKI\\VMSHOE>\nWSKI\\VMSHOE>\n\
    WSKI\\VMSHOE>\nWSKI\\VMSHOE>\nWSKI\\VMSHOE>\nWSKI\\VMSHOE>\nWSKI\\VMSHOE> show\
    \ share\n服务器 \"VMSHOE\" 上的共享资源：\n| Name | Type | Description |\n|---|---|---|\n\
    | DKB100_SHARE | Guest | 客位置目录 |\n| NETLOOD | Directory | 脚本目录 |\n| PWLIC | Directory\
    \ | PATHWORKS 客户端许可软件 |\n| PWLICENSE | Directory | PATHWORKS 客户端许可软件 |\n| PWUTIL\
    \ | Directory | 高级基于客户端的工具 |\n| USER | Directory | 用户目录 |\n总共 6 个共享\n```\n\n图\
    \ 7-72 使用 Share 命令检查你定义的共享！\n\n### 恭喜你！你已经在 OpenVMS 上安装了高级服务器（Advanced Server），并为网络使用配置了计算机、用户和共享！\n\
    \n## 第 8 章 — Apache VMS 与 Linux \n\n## 你永远不会忘记你的第一个 Web 服务器\n\n你永远不会真正忘记你的第一个\
    \ Web 服务器。那是九月，新英格兰的叶子刚刚开始变色，我正在上一门关于 Web 服务器、互联网电子商务和 Web 主机的课程。那周时间太短，老师们传授的信息也太快，因为要涵盖的内容太多了。\n\
    \n1995 年，最热门的工具无疑是 Netscape（有些人可能说西北地区传闻有一种叫 Front Page 的东西）。浏览器大战一即将来，空气中弥漫着未来战斗的姿态和轰鸣。每一个有价值的操作系统都在声称自己是\
    \ Web 服务器。\n\n周五我从波士顿出发，笔记本上装满了 VMS 软件、PC Web 工具以及我最宝贵的货物——那个让我自豪地将我的 AlphaServer\
    \ 带到 2000 年并在内部网络共享的东西是 Netscape Commerce Server。它将成为我的第一个 Web 服务器。SSL、用户目录支持以及快速的响应——至少可以处理\
    \ 10 到 20 个并发请求。我对比构建 Web 服务器的前景感到非常兴奋。\n\n回到家后，我为 Infotowers 上每个 CD-ROM 创建了用户/Web\
    \ 账户（我记得那时有 21 个 CD-ROM 驱动器），并为内部网络提供了所有的 OpenVMS、PC 以及之后的开源 CD-ROM。那是通过 HTTP\
    \ 和 HTTPS 工具、文件甚至 PowerPoint 幻灯片提供服务的光辉几天。有一套完整的 DECUS 图形库、追溯到 1970 年的 DEC CD-ROM\
    \ 历史文件。\n\n我记得在所有 Web 数据都上线的那个早晨，回到我的隔间，浏览我亲手添加/构建的 HTML 页面。后来我意识到，在我的工作站上原始 HTML\
    \ 代码比当时我的老板 Dennis Bashore 进行每天的“巡视式管理”时手里拿着电子表格要好得多！\n\n当主 Web 页面每月访问量达到 100\
    \ 次时，我感到非常自豪——在随后的不到一周内，访问量翻了四倍，因为 DEC 文件抓取者们虔诚地将我那区区几个 GB 数据复制到他们不断增长的掠夺中。编号\
    \ 8972：你知道你被掠夺了。\n\n（注：由于原文中存在大量段落重复，译文已根据要求去除了重复部分，仅保留核心内容翻译。）\n\n"
