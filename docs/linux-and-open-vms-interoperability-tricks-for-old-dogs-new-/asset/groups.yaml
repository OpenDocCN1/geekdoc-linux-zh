    在过去的二十五年里，HP OpenVM™ 作为一种经过验证的企业级操作系统，一直支持客户在可靠性、可用性、扩展性和安全性方面最严苛的业务关键需求。


    在过去的五年里，Linux 和开源运动已经从技术边缘的小型系统操作系统转变为企业计算领域的强有力竞争者。


    这两种操作系统都与 UNIX 和 Windows 服务器有许多共同之处。OpenVMS 是一种通用型操作系统，具有许多标准接口和 API。Linux 是一个可定制的操作系统，与
    UNIX 共享 API。这两个操作系统通用的 API 让 OpenVMS 和 Linux 能够轻松地相互操作。


    在同一企业环境中运行 OpenVMS 和 Linux，使你能够将 Linux 的低单机成本结构及其海量的开源软件库，与 OpenVMS 经过证明的高可用性、安全性、扩展性以及卓越的健壮性结合起来。


    我发现这本书是一个实用的、操作性的手册，它解释了 OpenVMS 系统管理员如何将他们的系统与 Linux 集成，让两个平台协同工作并扩展计算环境的处理能力。John
    清晰地描述了这两种操作系统的特征和优势，以便你评估哪一个最适合特定的任务。你在这里找到的提示、技巧和技术将帮助你创建一个异构的 OpenVMS 和 Linux
    计算环境，以满足现在和未来的需求。


    Martin R. Fink

    副总裁兼首席技术官

    惠普股份公司


    # 前言


    这本书始于许多年前，那时 Linux 仅仅是 Torvald 先生的一个梦想。它的萌芽源于《DECWindows 食谱指南》、《DFWUG Longwords
    通通讯》中的文章，以及在数百次 DECUS 会会上分享的提示和技巧，这些会议在多年来以某种方式将 OpenVMS 和 Unix 系统连接在一起。


    基于所有这些想法，加上 Linux 和 OpenVMS 在数据中心使用次数的增加及其演进，我认为需要更好地了解 Linux 和 OpenVMS 能够共同完成的事情。我也觉得，如果我需要理解这种互操作性，许多其他人可能也需要同样的理解。今天，使用开源程序的
    Linux 和 OpenVMS 在许多应用程序和接口上具有相同的视觉效果和感受。尽管视觉效果和感受相似，但配置、安装和脚本在不同操作系统（OS）之间是不同的！


    此本书识别了八个互操作领域，更重要的是为这些领域提供了分步实施的过程。产品、配置、脚本都包含在书中，其目标只有一个：让 Linux 和 OpenVMS 之间产生某种关联。无论你是
    VMS 管理员还是 Linux 管理员，这本书将让你能够实现 Linux 和 OpenVMS 之间的互操作性。


    我只能补充一点，你应该学习使用本地编辑器，书中没有涵盖这些。学习终端或命令行界面（CLI）编辑器，如 Linux 的“vi”和 VMS 的“edit”，它们对于任何系统管理员的工具箱都是至关重要的。也有基于
    X Windows 的编辑器，但如果你学习了 CLI 编辑器，即使在没有窗口系统的系统中也能工作（如果你正在进行安装或更改启动程序，这是一种完全可能）。在你学习了
    Linux 和 OpenVMS 的编辑器后，书中的其余操作应该易于完成。


    你可能还想尝试配置书中的工具之前，加载每个操作系统的干净版本。我在书中显示的所有过程中都使用了 OpenVMS 7.3-1 版本和 RedHat 7.3。如果你继承了系统，并且需要重用现有安装，你可能想先访问第
    2 章，学习如何进入 Linux 和 OpenVMS！


    这本书是一场关于开源、TCP/IP、X Windows、安全以及更多更多内容的冒险。我希望它能拓宽你对 OpenVMS 和 Linux 的理解，并帮助你理解这两个优秀的操作系统可以共同完成什么。


    顺祝商祺，

    John Robert Wisniewski

    2003年3月


    出版者注：Open Source（开源）一词的使用存在很大差异；大多数观点认为两个单词字母都要大写。然而，另一些人始终使用小写。我们选择遵循最常用的用法，在书中对这两个单词均采用大写。


    # 第 1 章 — 评估 OpenVMS 和 Linux：用对人用事


    好、更好、最好


    欢迎阅读这本书，它解答了为什么选择 OpenVMS？为什么选择 Linux？以及到底如何让这两个计算机操作系统（OS）协同工作？


    在这个世界上，出于什么原因你想让它们协同工作呢？让我尝试简短地回答：有些客户迷恋 OpenVMS——它的集群技术和全方位支持。而 Linux 衷于开源，拥有数万名代码人员。真是一场疯狂的合奏！尽管如此，它们仍然是亲戚——开源的亲戚。


    现在，在不唱完剩下的 Patty Duke 主题曲的情况下；这些操作系统有许多共同点：它们的网络接口协议；开源工具；行业标准；商业数据库；Windows 以及用于加密、隧道技术和安全通信的行业标准安全工具。如果
    Linux 和 OpenVMS 都有通用工具，为什么要继续使用它们呢？因为 OpenVMS 提供了 Linux 或任何其他操作系统难以实现的通用工具。OpenVMS
    具有什么？OpenVMS 提供了经过 25 年测试的、级稳定性和可用性。


    那么，Linux 带来了什么？Linux 衷于开源，拥有数万名代码人员。真是一场疯狂的合奏！尽管如此，它们仍然是亲戚——开源的亲戚。


    同一企业环境中运行 OpenVMS 和 Linux，使你能够将 Linux 的低单机成本结构及其海量的开源软件库，与 OpenVMS 经过证明的高可用性、安全性、扩展性以及卓越的健壮性结合起来。我发现这本书是一个实用的、操作性的手册，它解释了
    OpenVMS 系统管理员如何将他们的系统与 Linux 集成，让两个平台协同工作并扩展计算环境的处理能力。John 清晰地描述了这两种操作系统的特征和优势，以便你评估哪一个最适合特定的任务。你在这里找到的提示、技巧和技术将帮助你创建一个异构的
    OpenVMS 和 Linux 计算环境，以满足现在和未来的需求。


    Martin R. Fink

    副总裁兼首席技术官

    惠普股份公司


    ## 为什么选择 OpenVMS？


    在不断变化的行业中经历了二十五年——经历了 PC 革命、DEC 变为 Digital、VMS 变为 OpenVMS、Compaq 收购 Digital、HP
    收购 Compaq、从 VAX 32 位 CPU 迁移到 Alpha 64 位 CPU，以及 HP 迁移到 IA64 64 位 CPU、微软产品、开源产品、IBM
    操作系统家族以及如 NSK 等容错产品的出现——行业观察者和参与者提出以下问题：在未来的 5 到 10 年里，公司为什么要使用 OpenVMS？考虑到 OpenVMS
    目前在部署和维护方面的成本最低，你可能会问，为什么不使用它？成本只是因素之一，技术决策似乎驱动了许多部署。让我们回顾 OpenVMS 的能力。


    - 集群：自1983年以来，OpenVMS 一一直是行业内最好的集群和扩展性。它的功能包括单系统磁盘、跨集群成员的统一文件系统视图（即使具有多个文件系统）、共享胶带、共享磁盘，以及多达96个集群成员系统（从桌面级到大型机级），每个系统多达32个
    SMP CPU，整个集群内存多达10 Tbytes 的主内存（RAM）。所有系统被视为一个单一系统和一个单一工作域。OpenVMS 集群通过以太网、SAN
