    johnw = johnw\nsteves = steves\njennaw = jennaw\nsmb_pub = smb_pub\nroot@lnxone:samba#\
    \ \nroot@lnxone:samba# smbpasswd -a johnw\nNew SMB password:\nRetype new SMB password:\n\
    ```\n\nFigure 7-9 Verify johnw's password.\n\n```\nroot@lnxone:etc/samba#\nroot@lnxone:samba#\
