    Congratulations, you''ve just taken over an OpenVMS system!


    # First the Rush, Then the Letdown


    You log in as root or System and look around the disks. Data is missing, and shards
    of pointers hint at what the system''s duties once were. There are commands that
    point at nonexistent volumes, and that no one has used in five years stand ready
    to do your bidding. A gem from a past job emerges and reminds you of something
    you did. Then you realize it''s time to scratch the disks and put together a new
    configuration that suits your purposes, rather than trying to salvage the existing
    system disk and its dated software.


    You are tempted to do a full backup of your new system and save the work from
    an elder system, but you stop and consider privacy and those who left rés, personal
    budgets, and e-mail on the system you have full dominion of. Nothing appeared
    illegal, immoral, or fattening, so there is no reason to keep a copy of any other
    person’s data as far I can tell.


    During the course of work professional system administrator will likely find a
    variety of personal user data on many different computer systems. There is no
    code handling such data (short of a corporate HR directive about these types of
    files), but there is an ethical code. Just as Congress wrote the law such that
    radio scanners can listen to cellular and various other communications but not
    reveal what they''ve heard, system administrators have a similar responsibility.
    Corporate rules regarding privacy and personal files complete the issue, but unless
    there is a very good reason (such as suspecting illegal activity was conducted
    with the system) a system administrator should never reveal or copy a user''s
    personal files or information or what was found to anyone else.


    You weren''t asked specifically, but professional courtesy to the previous owner
    or administrator demands that you erase the data (not necessarily the system programs)
    from the older system you acquired. If you believe in karma, then perhaps someone
    will do the same for you one day. When you''re running late and just want to get
    rid of a machine without throwing it away and give it a good home, perhaps you
    could give it to an up-coming young professional who needs a good used system
    to practice with.


    Of course, it is it never going to happen that you give away systems without remembering
    what''s on them, and you''ll always delete all the data from all disks you scrap,
    erase CD-ROMs in the microwave, bulk erase tapes, shredded personal data and procedures,
    and destroy all ID cards you find in the boxes of surplus donation. We''re talking
    about a hypothetical situation here and not anything I''ve ever found in/on/with
    systems I''ve seen.


    There are many reasons to break into a system; in your tool bag for OpenVMS and
    Alpha should always have an OpenVMS boot disk (the CD-ROM that loads OpenVMS)
    at the latest version (7, 7.3-1) you can find, and a RedHat Linux 7.2 or 7.3 boot
    disk. These tools will help you when opening up systems when you need to do so.


    From treasure hunt to salvage, corporate rescue, recovered systems, breaking into
    systems is everything admin folks should be able to do.


    You may find interesting things in the systems you overpower, and remember with
    great power come great responsibilities. Ethically, morally, and professionally
    you don''t break into systems just because they are there or you have a way in.
    That way leads to the dark side of the profession.


    I grant you this knowledge to help and not to hinder. I also warn that, as I was
    taught and then enjoined by my teachers—use these powers for good and not evil.
    I know you will know the difference when you are confronted by systems you need
    to take control of!


    # Chapter 3 — TCP/IP for OpenVMS and Linux


    It seems like a lifetime ago, but I remember having an ongoing argument in 1989
    about which was better: IBM''s SNA protocols, DEC''s DECnet and LAT protocols,
    or the up-and-coming TCP/IP protocols for commercial systems.


    The discussion extended to many customers and many in the local DFWLUG group joined
    the discussion with bars and angry words sniping the other protocols. Async transmission
    is better than sync transmission—it recovers better and let''s use lower-cost
    lines, peer-to-peer networking is the only way to go, standards are the way of
    the future, mine has more features, your protocol is, and so on.


    In the end, all the arguments missed the point. We were all arguing the technical
    merits of peer-to-peer networking, counting the number of terminals that could
    be supported, or how many danced on the end of a 50-ohm cable. Wasn''t the right
    focus at all, and many people missed the real reason for this change in networking
    technology in such short period of time.


    IBM''s SNA could host thousands of terminals in a single network with subsecond
    response time. DECNet provided peer-to-peer networking with over 100,000 nodes
    in a single network (when the Internet had 15,000 nodes). Novell was fastest for
    PC disk and sharing, the multi-outed OSI protocol would unite all networks into
    a single, standards-based world that would correct all the shortcomings of past
    protocols. But all of the technological greatness of these and other protocols
    paled against TCP/IP.


    TCP/IP, by 1993, sweep away the competition in the network protocol world for
    any new applications or networks. TCP/IP crushed OSI''s government mandate as
    a protocol of choice for all new network acquisitions. DEC believed it could skip
    over the TCP/IP revolution if it just had the best OSI protocol stack, because
    TCP/IP was waiting (at the time) technologically and the marketplace would have
    to use OSI to solve its networking problems.


    Instead, TCP/IP spawned network companies such as Cisco and bit billion dollar
    software companies such as TGV (Two Guys and a VAX) just to write and support
    a TCP/IP stack for OpenVMS. Other companies emerged for TCP/IP to SNA gateways,
    TCP/IP terminal servers, and the whole


