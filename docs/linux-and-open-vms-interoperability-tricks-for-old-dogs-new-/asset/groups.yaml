    # Chapter 4 — Security Tools for OpenVMS and Linux


    # Ever Been Hacked?


    It was summer’s end, 1999. I was a seasoned, tough, and experienced SE preparing
    my customers for the Y2K none with firmware, software, and professional advice.
    She was a tough dame from the wrong side of the pews from the local church group
    but could still she COBOL during those months. The computer world felt like it
    was self-destructing before our very fingers, and then I decided to build a Linux
    box.


    A Linux box. Oh, I had loaded Linux several times before, but it was time. Time
    to have a Linux box on my home network configured the way I liked it, time to
    have a Linux box on the Internet as a symbol of my computer prowess. Beside, all
    of you know how women dig guys who run Linux,


    Well, that’s how it all started. I built a 450MHz workstation/server from junk
    I had laying around, installed a 40GB disk, 256MB of memory, and 10/100 Ethernet.
    I built Linux from a “red” distribution I bought for $53 per from cheapbytes.com.
    Then I loaded everything. Not a few tools, but everything. I loaded compilers
    (FORTRAN, COBOL, C, C++, CPlusc, and more) graphic tools like gimp, hypersnap,
    and ASCII art; games and more games, Windows, and SAMBA, MYSQL, YOUR, NFS, NSA,
    UBU. Anything I could find in RPM format, I loaded.


    Oh, it was a fine box. A system built by a professional for his own amusement.
    It would be my personal Linux playground. Then in sign of my creation and booted
    it for the first time connected to the Internet. I had my OpenVMS server for the
    Internet for almost 10 years without incident (longer if you count tied to mild
    via UUCP), so I felt safe and a Linux OS would be safe enough for me against the
    ravages of the Internet. First things I did: I configured Apache and created a
    SAMBA SMB pointer to my home directory and an MP3 file share. I loaded 10 gigabytes
    of Napster files on that file share and began to explore the tools and things
    that were now available to my home network.


    # Four Days Later


    The newness of the Linux box had edged somewhat, and I was back on my OpenVMS
    system reading my mail in Netscape. A strange e-mail address appeared in my inbox
    that looked like it was from “Down Under.” I opened the letter and realized immediately
    from the headers it was from an OZ domain and began to read. “Greetings,” I could
    almost hear the Aussie accent through the wires “Why are you probing and scanning
    my entire Class C address space?'
  - '[PAGE 30]


    I was stunned. I wasn''t running any port scans on Pacific Rim Class Cs, was I?
    Then I saw the logs he sent me. It wasn''t me, it couldn''t be me! Remember all
    the phases—denial, anger, bargaining, depression, acceptance. I went through them
    all that first 24-hour period after being hacked.


    It looked like these pings and scans were from my new Linux box! It was late and
    I was in total denial and sent a mail message back to this brute, “Couldn''t be
    me” Then I went to bed.


    The next morning my new friend from Australia had sent me more logs, proving my
    system''s complexity in probing: “Greetings Mate, I believe the script kiddies
    control of your box and you should find out what they''re doing.”


    Script kiddies—the name struck terror into my four-day old Linux install. How
    could they find me in the huge expanse of the Internet. I was only up for four
    days! Feeling like a stranger in a strange land, I asked what any OpenVMS system
    manager would do when confronted by a problem with a Linux box. I called another
    OpenVMS system manager! Not any system administrator, but my good friend Cathey,
    chairman of the DECUS/VMS SIG and president of the Dallas–Ft. Worth local group.
    David had no Linux experience than I and quickly pointed out that we should look
    for strange files on the system.


    Dave came over and we looked for temporary files. Seek and you shall find; I had
    all the parents fearing their child had infected with lice! The Linux box was
    not only hacked, but there were logs of port scans, port scan executables, and
    logs with entire file conversations between two miscreants at cracking boxes and
    using to find new boxes to attack. David and I watched and captured the session
    information as superuser—one was looped through AOL so it wouldn''t get caught,
    and the other was looped through the University of Korea.


    I did what red-blooded system administrator would do: to take the logs, copied
    the files, called (at least in my jurisdiction), and gave AOL the user ID of the
    perp who had ravaged me for fiendish purposes.


    Of course, AOL wanted nothing to do with evidence unless I had the FBI or at least
    local enforcement! I thought about the $42 million in IT charges I claimed for
    my production Linux box being attacked and compromised by an AOL script kiddie,
    though better about wasting the authorities'' time.


    My postmortem on the Linux box consisted of taking it off the Net and identifying
    how the crackers had just walked right in had my machine doing great work the
    mule that it was. The answer was in the password file—I had loaded everything,
    every RPM I could! A database loaded and a privileged user account by default
    that could create other accounts—WITH A DEFAULT PASSWORD!'
  - '[PAGE 31]


    Humble, not quite full of confidence, I scratched my Linux system and loaded only
    the RPMs I was going to use and understand immediately. From this I learned a
    great lesson in system security:


    Don''t load any software on your system if you don''t know what it does and change
    any default settings to more secure settings.


    Of course, I also learned something about trusting Australians more and AOL and
    University of Korea computer accounts less.


    # Preparing for the Storm


    Steven Smiley and I were taking a break at a well-known security convention watching
    the evening''s film-festival double feature (Colossus the Forbin Project and Dark
    Star). From the back of the room cackles of laughter that someone was doing something
    cool. Steve wandered off to see a late night Q&A session, but I went to the back
    and sat with the laughing crowd of consultants.


    As I listened, the audience was arrayed around a young man who was sitting with
    his laptop wirelessly connected to the network as he sat on the floor.


    > Sniffed his instant messenger password and now I''m talking to his mother”—roars
    of laughter from the folks sitting around.


    > But Mom, I''m going to stay in Vegas and work at a casino. I''ve found my true
    calling!” said the keyboardist out loud as he typed to the mark''s mother.


    > You’re not going to destroy poor guy''s opinion of him are are you?” I asked.


    > Nah” laughed the keyboardist, “I’m just going to make sure he learns the value
    of encryption in network communications!


    Everyone laughed along the joke.


    The simple truth is that you are on an open network, anyone on the network can
    potentially sniff packets and scan for plain-text passwords, scan your TCP/IP
    ports, and look for known back doors or worse. What do you do? Firewalls? Intrusion
    detection tools? Harden the operating system? Unplug from the network completely?


    It’s not likely we can just retreat from network communications, since they are
    a prerequisite for computers and portable devices these days. One of the main'
  - '[PAGE 32]


    solutions today and increasing in importance in the future is to use an encrypted
    link between your client and server when making a connection—ANY CONNECTION!


    Now remember that standard TCP/IP tools such as Telnet and FTP aren''t encrypted
    at all, any data you send across those tools can be examined for passwords, PINS,
    codes, credit card numbers, social security numbers, and even the data that resides
    inside a transferred file. Now ask yourself: Who would take the time to scan for
    these things on your network? You''d be surprised. Most computer crime is an inside
    job by 60/40 percent. This is down from last year when the norm was 70 percent
    inside jobs. The Internet and other network paths are the fastest growing access
    method for computer crime!


    Consider that each server runs standard server applications uses the same ports,
    so that not only do you know what the server is running, but you might be able
    to use these ports as back doors to these servers.


    # TCP/IP Known Ports


    Because they are standard applications, TCP/IP defines for servers “known ports,”
    which stand ready to communicate with client connections that try to communicate
    with them.


    Perhaps the best known port is port 80 or the port that the Wide Wide Web protocol
    communicates on. Connecting from a client with a Web browser, the WWW protocol
    connects to port 80 on a Web server using TCP/IP across this link—all hypertext,
    pictures, graphics, movies, Java, and other Web information.


    Known ports also tell us what services a server is currently offering. Many applications
    have their own TCP/IP port number, which always use for a default installation.
    These applications can sometimes change port numbers but rarely do. A server administrator
    can change these ports, but then other client applications can’t communicate with
    them.


    The good news is that these ports now give a way to look up all services being
    offered on a TCP/IP node. The bad news is that these ports now give a way to look
    up all services being offered on a TCP/IP node! Security can be opened on these
    nodes by simply probing for known passwords and known back doors for these applications.


    The tool of choice for network server watchers is a piece of software called a
    port scanner. Port scanners are available on the Internet; costs vary from free
    to thousands of dollars. Many of these tools will check a server for every port
    from 1 to 80,000+. Many known software ports have banners that will tell you a
    great deal about'
