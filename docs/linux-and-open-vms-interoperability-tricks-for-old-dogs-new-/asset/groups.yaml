    \ Windows 仍然工作站和高端服务器不断扩展的一部分。标准支持以及在多个操作系统之间运行的工具简化并减少了显示图形和运行应用程序的复杂性。这为我们每个人面对每个的任务提供了选择：是使用点击式的\
