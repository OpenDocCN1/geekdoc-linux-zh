    Today, with e-mail accounts free from the Net and dial-up access costing less
    then $10 per month for people with a PC, most folks consider this type of e-mail
    quaint and old-fashioned. While the usefulness of UUCP mail has ebbed, it''s interesting
    to note that the protocol is still used in ham radio (packet/system-to-system)
    e-mail and other places around the world where Internet dial-up (POTS—plain old
    telephone service) is still not easily obtained.


    # From the Dawn of the Network Era to Today


    In the Victorian Internet Tom Standage describes how nineteenth-century world
    was shrunken and delivered by a technological communications marvel: the telegraph.
    Tom''s book quoted Samuel Morse''s 1872 poem, "The Victory":


    And science proclaimed, from some to shore


    That time and space ruled no more.


    If in the last 150 years the telegraph, telephone, and satellites shrank the distance
    across which people could communicate, the Internet and e-mail in the last 15
    years have dwarfed those tools by another factor of 10—simply with compression
    and near universal access. Why make a phone call when a two-line email explains
    what needs to be done? Why have conversations when a single picture will? Why
    send a picture when a URL points to the common reality of the Web for reference.
    Does anyone send multiple copies of any paper to anyone unless by?


    This is great for productivity, but what about human-to-human contact has kept
    us learning and improving our depth of understanding with mentorship and apprenticeship?
    The jury is still out on how electronic communications will impact how we learn
    and do OJT. Our generation has home offices, digital cell phones, telecommuting,
    the World Wide Web, and cable, so we''ll be the generation most attached, the
    most plugged-in to our fellow man, or we''ll live inside our Xboxes—venturing
    out to enough to pay for the electricity, protein drinks, and vitamins to keep
    going.


    Tersed, concise, and efficient for good or bad, these are the qualities e-mail
    has delivered to us as a business tool.


    Of course, if you still want to have a conversation online, you can now use a
    variety of instant messenger friends and gossip your time away, just like the
    telegraphers who were found to spend as much as 50 percent of their free time
    talking, chatting, and gossiping with other operators across the nineteenth-century
    era (but for those who live online today, 2005, 50 percent sounds like a very
    low percentage). Though the technology has changed dramatically, people have changed
    very little in the last 150 years. Many still have that quite human desire to
    simply put'
  - '[PAGE 73]


    down their labors, lean across a back yard fence or gather around an office watering
    hole, and just talk with other people about the the events of the day.


    # E-mail Programs Come and E-mail Programs Go


    In 1987, when I joined Digital, its mail ALL-IN-1 had about eight million users
    worldwide. ALL-IN-1 had full-text word processing and shared calendar (for resources
    such as conference rooms, demo rooms, etc.) that would also make people''s time
    easier to schedule and keep track of. File exchanges for all the word-processing
    documents of the age, attachments, e-mail lists, and gateways to various other
    mail systems (IBM and the standards of day).


    Alas, ALL-IN1 ran on OpenVMS clusters (who would want a redundant e-mail system)
    and its client/server frontend teamlinks are still around. Despite all its technological
    prowess and PC integration, however Digital chose a new mail system in 1996. Abandoning
    its ALL-IN-1 roots, DEC chose a hearty mail system—a mail system that could send
    word processing documents, pictures, video, and other binaries in e-mail, just
    like every other 20-year-old e-mail system.


    The new e-mail system added the advantage of being able to run on a Windows NT
    operating system, which, in 1996, everyone knew was the only system platform that
    survived after the Y2K.


    Microsoft Exchange was a lot more expensive than Open Source, standards-based
    e-mail, but then again, Microsoft had much better marketing. The rest was history
    until people began to realize that Exchange costs lots of money to install and
    maintain and Open Source products to be free!


    # Open Source Open Standards Internet Mail


    Open standards all revolve around TCP/ IP standards and the Request for Comments
    (RFC) process that controls them. The important thing to note is that current
    e-mail protocols are evolving and continue to add functionality as they improve.
    An end user won''t worried about these standards, but someone who is doing the
    implementation for an operating system such as VMS or Linux will. What users need
    to know is what standards-based e-mail clients they can use from their client
    platforms and what e-mail servers can set up to store/ retrieve mail from OpenVMS
    and Linux servers on their network.


    Internet client e-mail applications all basically do the same things, but some
    have more features than others. What features should you look for in a client
    e-mail system? Character cell or graphic e-mail applications should be the first
    consideration. Programs such as PINE are character-cell based, but can send attachments,
    binaries,'
  - '[PAGE 74]


    and run on both OpenVMS and Linux as clients. Other programs, such as Mozilla
    (now Open Source from its Netscape roots), also run on both OpenVMS and Linux,
    but require an X Windows graphical display to work. What You See Is What You Get
    (WYSIWYG) e-mail window, where the character cell allow you to telnet from anywhere
    in your network and read your mail—at least the text portions of it!


    Today''s important standards to check for when you configure your e-mail server
    include the following:


    +   - POP3—Post Office Protocol V3: If your mail server supports this protocol,
    your remote mail clients can be configured to download all your mail/messages
    from the server to your client system. POP3 deletes the message/e-mail server
    once the messages have been downloaded to the client.


    +   - IMAP—Internet Message Access Protocol: IMAP stores messages on the e-mail
    server for use by many different locations from many different clients! You can
    use other users'' systems as e-mail clients and move over or delete or unread
    messages from the e-mail/message server! This means you can read mail from anyone''s
    system you have access to, and when you log off, the messages will be secured
    and remained on the server server.


    When you use each protocol? Some users like their servers to pass messages to
    and erase them from the server—for POP3 is the answer. Other users like to use
    everyone''s e-mail client applications and prefer to store their messages on their
    e-mail server for archiving and later retrieval and review—IMAP is best for them.
    The only real warning I can offer you for using these e-mail protocols is that
    for each e-mail account you create, use only POP3 or IMAP as your message/e-mail
    access method for each mail account you have on a server. Your client could be
    a little confused (especially if you don''t create e-mail profiles on the client)
    if you use both POP3 and IMAP to access a single account! (Multiple in aren''t
    the best way to gain a new morning of e-mail excellence.)


    The good news is that both OpenVMS and Linux are able to let e-mail clients have
    POP3 or IMAP access to their messages in the standard user accounts. You all have
    to do is activate e-mail services on the systems, and the user accounts are integrated
    into e-mail. Remote e-mail clients can then be used to access these standard user
    accounts via POP3 or IMAP to access e-mail on both OpenVMS and Linux.'
  - '[PAGE 75]


