  mdcn: "\n这段带有新功能和改进的源代码被交付给 AT&T，由其更新 OpenVMS 工程，并派遣一个团队对产品进行移植、评估和测试，最后将二进制文件发送给全球的\
    \ OpenVMS Advanced Server 。\n\n使用 OpenVMS Advanced Server 软件而不是免费的 SAMBA 软件的优势在于可以通过\
    \ HP 的 1-800 电话获得商业支持。作为 HP 的商业支持产品，Advanced Server 往往比 SAMBA 更早拥有 Microsoft 服务器功能（在本文写作时，SAMBA\
    \ 正在等待最新 MS 产品中的新 LDAP、Active DNS 和新的安全模型，而 Advanced Server 已实现了这些功能）。SAMBA 将获得与\
    \ MS 产品的最新集成功能，但在这些功能上，SAMBA 通常落后于商业产品，而开源社区正在重新设计 SAMBA 的下一个版本。\n\n支持服务和测试使得适用于\
    \ OpenVMS 的 Advanced Server 成为 Windows 环境下 OpenVMS 上进行 SMB 文件和打印机共享的首选商业方案。\n\n\
    这并不意味着用于 OpenVMS 的 SAMBA 不受欢迎欢迎！OpenVMS 爱好者社区以及那些仅需要文件和打印机共享的用户发现，SAMBA 的开源和免费成本在与他们的\
    \ UNIX、Linux 和 Windows 客户端共享时最高效！对于 OpenVMS，根据你的具体需求和预算，你对于 SMB 服务器 真的有两个选择。\n\
    \n## Linux 和 SAMBA\n\n如今，共享文件和打印服务的能力被认为是所有操作系统的标配。Windows 是网络上可能存在的最大的客户端群体。实现这一点的最简单方法是在\
    \ Linux 中添加 Windows 安全和共享。这不仅提供了一种跨大多数桌面平台的通用身份验证机制，还为 Windows RedHat 客户端提供了文件和打印机服务，而这些服务可以存储在\
    \ Linux 服务器上。\n\n使用 RedHat 7.3 安装 Linux 作为 SMB 服务器 允许你选择一个 SMB 服务器，该程序将为你自动安装\
    \ SAMBA（见图 7-1 至 7-13）。它安装了 SAMBA，但配置它取决于你个人！\n\n## 服务配置\n\n![](img/3ba916f144e94350147c366c3485e02e_116_0.png)\n\
    \n图 7-1 在 GNOME 桌面面的服务器管理器菜单中，你只需要勾选框并保存你的选择即可。\n\n![](img/3ba916f144e94350147c366c3485e02e_116_1.png)\n\
    \n图 7-2 激活 SAMBA 的下一步是配置 `/etc/samba` 目录下的 `hosts` 文件，使用你喜欢的 Linux 编辑器，并添加工作组或域中其他主机的“LAN\
    \ Manager”名称。\n\n```\nroot@lnxone:etc/samba\nFile Edit Settings\n[root@lnxone\
    \ samba]# pid\n/etc/samba\n[root@lnxone samba]# is\nleaves MOWDINE_SID secrets.tdb\
    \ smb.conf sabusers\n[root@lnxone samba]# cat hosts\n127.0.0.1       localhost\n\
    65.64.220.210 version\n65.64.220.213 wizzule\n[root@lnxone samba]#\n[root@lnxone\
    \ samba]# cat sabusers\n# Unique-name = Smb_name1,SMB_name2\n# root = administrator\
    \ admin\nnotbody = guest pcquest guestquest\njohn = john\nsteves = steves\njeraw\
    \ = jeraw\nsmb_pub = smb_pub\n[root@lnxone samba]# #\n```\n\n图 7-3 然后编辑 `smusers`\
    \ 并添加 Linux 账户名以及你想要映射的 Windows 工作组/域名称。注意，你可以将 Windows 用户映射到单个 Linux 账户！\n\n\
    ```\ngedit /etc/samba\nFile Edit Settings Search Plugins Documents Help New Save\
    \ Undo Redo Copy Paste Exit smb.conf\n# 这是 Samba 主配置文件。你应该阅读 smb.conf (manual)\
    \ 帮助页面以了解列出的选项。 Samba 有许多配置选项（可能太多了！），在示例中并未显示。任何以 # (注释) 开头的行都会被忽略。在示例中，我们使用\
    \ # 用于配置文件的部分。 注意：每当你修改此文件时，都应该运行 \"testparm\" 命令来检查你是否有任何语法错误。\n============\
    \ Global Settings ============\n[global]\n# workgroup = NT-Domain-Name or Workgroup-Name\n\
    # workgroup = WORKGROUP\n# server string is the equivalent of the NT field\n```\n\
    \n图 7-4 编辑 `smamba.conf` 文件并更改 `workgroup` 名称，使其与 PC（以及其他 Linux 客户端）使用的域/工作组一致。18\
    \ Linux 与 OpenVMS 互操作\n\n```\ngedit /etc/samba/smb.conf\n```\n\n```\n# 用于配置文件的部分。\
    \ 注意：每当你修改此文件时，都应该运行 'testparm' 来检查你是否有任何语法错误。\n\n============= Global Settings\
    \ ==============\n[global]\n# workgroup = NT-Domain-Name or Workgroup-Name\nworkgroup\
    \ = vski\n```\n\n图 7-5 将 `server string` 修改为适当的内容。这将在客户端浏览器中显示出来。\n\n```\nedit\
    \ /etc/samba/smb.conf\n```\n\n```\n[global]\n# workgroup = NT-Domain-Name or Workgroup-Name\n\
    workgroup = vski\n# server string is the equivalent of the NT field\n# server\
    \ string = \n# 此选项非常重要。它允许你限制对本地网络机器的连接。 下面的示例限制了两个 \"loopback\" 接口。 更多语法示例：\n\
    hosts = 192.168.1\nhosts = 192.168.2.200 192.168.2.211 192.168.2.240 192.168.2.245\
    \ 192.168.2.220 192.168.2.217\n# 如果你想自动加载打印机列表而不是逐个设置，你需要这个：\nname = /etc/printcap\n\
    load printers = yes\n```\n\n图 7-6 指定你允许进行 SMB 连接的所有客户端和服务器。可以使用通配符吗？第 7 章 – 用于\
    \ Linux 和 OpenVMS 的 SMB 119\n\n```\nroot@lnxone:etc/samba# pwd\n/etc/samba\nroot@lnxone:samba#\
    \ ls\ninhosts MOKINE.cd secrets.tdb smb.conf sambusers\nroot@lnxone:samba# cat\
    \ hosts\n127.0.0.1 localhost\n65.64.220.211 vscore\n65.64.220.211 wirzmole\n65.64.220.211\
    \ wintermute\nroot@lnxone:samba# cat sambusers\nunique-name = SMB_name_SMB2\n\
    root = administrator admin\nnnbody = guest pcwest quest\njohn = john\nsteves =\
    \ steves\njennaw = jenraw\nsmb_pub = smb_pub\nroot@lnxone:samba#\nroot@lnxone:samba#\
    \ smbpasswd -a johnn\n```\n\n图 7-7 完成后，以 root 用户身份运行 `smbpasswd` 并创建一个 SMB 密码（第一次运行时）。然后为所有连接到你\
    \ SMB 服务器的 Linux 用户账户名添加密码。\n\n```\nroot@lnxone:etc/samba# pwd\n/etc/samba\nroot@lnxone:samba#\
    \ ls\ninhosts MOKINE.cd secrets.tdb smb.conf sambusers\nroot@lnxone:samba# cat\
    \ hosts\n127.0.0.1 localhost\n65.64.220.211 vscore\n65.64.220.211 wirzmole\n65.64.220.211\
    \ wintermute\nroot@lnxone:samba# cat sambusers\nunique-name = SMB_name_SMB2\n\
    root = administrator admin\nnnbody = guest pcwest quest\njohn = john\nsteves =\
    \ steves\njennaw = jenraw\nsmb_pub = smb_pub\nroot@lnxone:samba#\nroot@lnxone:samba#\
    \ smbpasswd -a johnn\nNew SMB password:\n```\n\n图 7-8 为 Linux johnn 账户设置 SMB 密码。\n\
    \n```\nroot@lnxone:etc/samba# pwd\n/etc/samba\nroot@lnxone:samba# ls\njwosts MOKINE.cd\
    \ secrets.tdb smb.conf sambusers\nroot@lnxone:samba# cat hosts\n127.0.0.1 localhost\n\
    65.64.220.210 vmsome\n65.64.220.211 wirzule\n65.64.220.213 winterwe\nroot@lnxone:samba#\
    \ \nroot@lnxone:samba# cat sambusers\n# Unique_name = SMB_NAME2\nroot = administrator\
    \ adminin\nbobody = guest pcquesquest\njohnw = johnw\nsteves = steves\njennaw\
    \ = jennaw\nsmb_pub = smb_pub\nroot@lnxone:samba# \nroot@lnxone:samba# smbpasswd\
    \ -a johnw\nNew SMB password:\nRetype new SMB password:\nUnable to open passdb\
    \ database.\nAdded user johnw.\nroot@lnxone:samba#\n```\n\n图 7-9 验证 johnw 的密码。\n\
    \n```\nroot@lnxone:etc/samba#\nroot@lnxone:samba# ls\njwosts MOKINE.cd secrets.tdb\
    \ smb.conf sambusers\nroot@lnxone:samba# cat hosts\n127.0.0.1 localhost\n65.64.220.210\
