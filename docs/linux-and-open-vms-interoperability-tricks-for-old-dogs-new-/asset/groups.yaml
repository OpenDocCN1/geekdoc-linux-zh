    \n跨 OpenVMS 的电子邮件，RedHat 7.3 随标准分发提供，无需额外费用。OpenVMS 增加了额外的检查和测试（由于它将 TCP/IP 栈到\
    \ Mozilla）。Linux 和 OpenVMS 使用相同的工具发送电子邮件、交换文件并浏览彼此的网站。电子邮件通常是第一个建立的应用程序——在知道它可行后，其他的就很简单了。至少我们知道电子邮件是可行的。\n\
    \n# 7 章 — 用于 Linux 和 OpenVMS 的 SMB\n\n# 在 OpenVMS 和 Linux 使用 SMB 进行磁盘共享\n\nWindows、Linux\
    \ 和 OpenVMS 系统在过去的十年里一直在入侵他人的领地。经理和“普通”人士不仅希望它们能够良好地合作，还能共享文件、磁盘和打印机。这是一个简单的目标，如果合理的话！\n\
    \n还有其他磁盘共享协议，例如 UNIX 世界中的 NFS 和 VMS 世界中的 DFS，但 Windows 在数量上占优，因此其 SMB 协议在不同操作系统之间更可能被使用。\n\
    \nWindows NT 和 Windows 2000 服务器系统带有某些客户端许可提供了磁盘和打印机共享以及身份验证。其他系统需要集成这些工具。\n\n\
    一个 GNU 许可的开源磁盘共享和打印机网络协议，允许您的 Linux、OpenVMS 或 UNIX 系统加入 Windows 工作组、NT 4.0 域或\
    \ Windows 企业域。该软件通过 http://www.samba.org 为 OpenVMS 免费发布。SAMBA 包含在标准 RedHat 7.3\
    \ 分发中。\n\nOpenVMS SAMBA 也可以从 samba.org 获取，但对于 OpenVMS，对于需要与其企业 Windows 环境更好地集成的人来说，有一个商业选项。HP/OpenVMS\
    \ 工程部门从微软那里许可了 Advanced Server 的源码，这是由于 AT&T 拥有源码访问权限以及一项行业重新许可协议，律师们可以理解其真实本质。然而，微软定期更新\n\
    \n"
