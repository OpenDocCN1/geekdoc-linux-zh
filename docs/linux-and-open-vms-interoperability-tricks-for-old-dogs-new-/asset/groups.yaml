    \ RPC\n65301,pcanywhere-def,pcAnywhere\n\n# Encryption—Not Just for Breakfast\
    \ Anytime\n\nYou need to use encryption of the tools/commands when communicating\
    \ sensitive\n(or not so sensitive) information, or you put yourself at risk of\
    \ having your passwords,\nfiles, and anything that moves across the network, copied,\
    \ and redistributed.\nLet's talk about the application encryption protocols that\
    \ are generally available on\nOpenVMS and Linux systems.\n\n# SSH (V1 and V2)\n\
    \nSSH, or secure shell, features are well known and have been available for many\
    \ years\nbetween many different hosts in the TCP/IP world. SSH has the ability\
    \ to create an\nencrypted session between two hosts. You can open an encrypted\
    \ SSH client terminal\nconnection to an SSH server. All the communications are\
    \ encrypted\nbetween the client and server. Both Linux and OpenVMS can be clients\
    \ and servers in\nis arrangement, allowing secure terminal sessions and from both\
    \ systems.\nMultiNet uses this protocol and a file transfer application, SCP,\
    \ for OpenVMS\nusing this protocol. (VMS TCP/IP engineering has been requested\
    \ for SSH for\nsome time, but they have their attention distracted by other TCP/IP\
    \ directions.)\n\nIn the rest of the Open Source and Linux world, SSH is usually\
    \ a terminal or shell\ncommand tool that comes with the operating system, but\
    \ does not do transfer\n(FTP) by itself. Additional applications have been written\
    \ to use the SSH protocol for\nfile transfer, such as MultiNet's SCP product for\
    \ OpenVMS and SFTP (Secure FTP) for\nLinux and UNIX users.\n\nHP’s TCP/IP services\
    \ for OpenVMS does not have SSH capabilities, but with the\naddition of MultiNet\
    \ SSH layered product, SSH protocols work with TCP/IP\nservices (5.3 TCP/IP EAK\
    \ from HP), making SSH work between Linux and\nOpenVMS. You would use SSH if you\
    \ needed secure terminal access between Linux or\nOpenVMS systems in a public\
    \ or private network that had to support interactive\nterminal or shell command\
    \ logins and are not view password exchange and data\nexchange in plain text.\n\
    \nSoftware for this type of encryption application can be found at the following\n\
    \n+   * For Linux: OpenSource available in the Linux standard distributions or\
    \ at\n  http://www.openssh.org/"
  - "[PAGE 36]\n\n+   * For OpenVMS: Process software (MultiNet) at http://www.process.com/\n\
    * For HP: TCP/IP services for OpenVMS V5.3 at\n  http://www.openvms.compaq.com/\n\
    \n# SSL\n\nSSL, or secure sockets layer, has been around since before 1996, and\
    \ it is still isn't at Version 1.0. That's not to say that it's not functional—just\
    \ that it's taking its time becoming a V1.0 release. If you ever doubt SSL's functionality,\
    \ just check your Web browser's lock icon on the bottom of your favorite browser\
    \ when you connect to your bank account or try to buy something on the Web. SSL\
    \ is invoked anytime your lock is closed!\n\nSSL's roll as an encryption protocol\
    \ is expanding, with new and more sophisticated tools and applications tied to\
    \ its authentication mechanism and communications style. Today, SSL can be used\
    \ for Web, terminal sessions, file transfer, POP and IMAP, and virtually any TCP/IP\
    \ application that uses a known port style of host addressing also needs encryption\
    \ for its communications. For course, SSL needs a little help to do some of these\
    \ tasks and is now available for OpenVMS and Linux!\n\nOpenSSL consists only of\
    \ a toolkit with programs and programming interfaces. Either you have to modify\
    \ programs to use SSL (as your favorite Web browser has) or you need to have another\
    \ tool that goes between standard TCP/IP application programs and SSL programming\
    \ interfaces. That tool, for Linux and OpenVMS, is called a \"Stunnel,\" or secure\
    \ tunnel.\n\nBefore we use the Stunnel to encrypt port-to-port communications,\
    \ we must have SSL libraries installed on both systems to do encryption and authentication\
    \ between nodes.\n\n# SSL Distributions\n\nOpenSSL for Linux is Open Source and\
    \ usually comes with a standard Linux distribution or from http:// // www.openssl.org/.\n\
    \nOpenSSL for OpenVMS is available from HP and is included in the standard OpenVMS\
    \ distribution, or it can be pulled from the Web at http:// // www.openvms.compaq.com/.\n\
    \nNote that OpenSSL for OpenVMS will work on OpenVMS versions V7.2-2 through 7.3-1\
    \ as of this writing."
