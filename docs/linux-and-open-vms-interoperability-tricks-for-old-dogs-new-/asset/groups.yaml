    for each mail account you have on a server. Your client could be a little confused
    (especially if you don''t create email profiles on the client) if you use both
    POP3 and IMAP to access a single account! (Multiple logins aren''t the best way
    to gain a new morning of email excellence.)


    The good news is that both OpenVMS and Linux are able to let email clients have
    POP3 or IMAP access to their messages in the standard user accounts. You all have
    to do is activate email services on the systems, and the user accounts are integrated
    into email. Remote email clients can then be used to access these accounts via
