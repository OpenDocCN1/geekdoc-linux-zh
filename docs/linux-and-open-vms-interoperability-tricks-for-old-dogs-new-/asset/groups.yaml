    ## 今日的网络标准


    今天（在网络协议大战 10 多年后后），TCP/IP 已经非常稳健，并被商业 IT 团体和个人所理解。现在行业正在向 IPv6 演进（目前大多数实现仍使用
    IPv4）。该协议正在扩展和改进，以在路由和安全应用中引入更多功能——这一切都是通过基于标准的网络协议实现的。


    OpenVMS 和 Linux（或任何两个或更多计算设备）的网络连接必须基于相同的标准。今天首选的网络标准是 TCP/IP 软件协议和以太网硬件协议。在过去的几年里，通过终端线路、视频以及直接同步和异步连接（如
    RS-232 电缆）进行交换也同样重要；对这些旧类型连接的需求虽然在减少，但尚未完全过时。今天的工作站继续使用拨号连接，通过点对点协议对 TCP/IP 进行封装，以便在两台计算机之间进行传输。随着越来越多的工作站服务器连接到
    DSL 或电缆介质、路由器甚至防火墙，以太网网络（甚至是无线以太网网络）已成为可能的互连形式。


    请注意，所有 IEEE 802.X 标准都指的是 OSI 模型中的底部两层（所有硬件）（http://standards.ieee.org/）（见表 3-1）。


    ## 表 3-1：带有 TCP/IP 位置的标准 OSI 模型


    | OSI 网络模型 | TCP/IP 互联网模型 | IEEE 标准 |

    |---|---|---|

    | 第 7 层—应用层 | Netscape、Xterm、电子邮件阅读器、基于 FTP 的工具以及其他用于显示数据的应用程序 | | |

    | 第 6 层—表示层 | Telnet、FTP、SMTP、其他 TCP/IP 协议 | | |

    | 第 5 层—会话层 | Telnet、FTP、SMTP、其他 TCP/IP 协议 | | |

    | 第 4 层—传输层 | 传输控制协议 (TCP)、不确认数据报协议 (UDP) | | |

    | 第 3 层—网络层 | IP 互联网协议 | | |


    ## 表 3-1：带有 TCP/IP 位置的标准 OSI 模型（续表）


    | OSI 网络模型 | TCP/IP 互联网模型 | IEEE 标准 |

    |---|---|---|

    | 第 2 层—数据链路层 | 网络接口卡：以太网双绞线、同轴、大橙色电缆 (AUI)、环形令牌、FDDI、ATM、ODI（开放数据链路接口）、NDIS（网络无关接口规范）
    | 802.1<br>802.2<br>802.3<br>802.4<br>802.5<br>802.6 | 逻辑链路 LLC 以太网 CSMA/CD 令牌总线
    令牌环 大域网 |

    | 第 1 层—物理层 | 网络传输介质：双绞线、同轴、光纤、无线 | 802.7<br>802.8<br>802.9<br>802.10<br>802.11<br>802.12
    | 带宽建议 光纤技术建议 集成语音/数据网络 安全 无线网络  |


    硬件和软件标准使得计算机通信成为可能。虽然查看另一张 OSI 图表（易记口法：所有人似乎都需要数据处理！）看起来可能没用，但你在网络应用中进行故障排除时，需要知道
    TCP/IP 应用和协议在何运行！如果你不能告诉网络管理员为什么问题在第 3 层或以下，他/她会将问题归咎于你的设备或应用程序——所以你最好学会使用它。


    ## 网络管理员的重要性


    始终记住，网络管理员是你网络中最好的朋友，他们可以为你提供 TCP/IP 地址、电缆，甚至是以太网卡和软件！网络管理员知道路由器在哪里以及需要获取哪些魔法数字***（域）域名服务
    (DNS)，以及通往其他网络的网关数字。你应该记住并标记好，你的新朋友是一头咆哮的猛兽，它会侮辱你的血统、操作系统选择或计算机知识，所以你最好用好它。


