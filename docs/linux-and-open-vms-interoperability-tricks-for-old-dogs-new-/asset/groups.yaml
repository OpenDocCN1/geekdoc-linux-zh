    ## 第 4 章 — OpenVMS 和 Linux 的安全工具


    ### 你曾被黑过吗？


    那是 1999 年夏末。我是一个老练、强悍且经验丰富的系统工程师（SE），当时为我的客户准备固件、软件和专业建议，以应对“千年虫”（Y2K）。她是个性格很硬的女人，来自当地教会小组里那种“非主流”的人，但在那些月里，她还能写
    COBOL。当时，计算机世界感觉就像在我们指尖下自我毁灭，于是我决定组装一台 Linux 机器。


    一台 Linux 机器。噢，我之前加载过好几次 Linux 了，但时候到了。是时候在我的家庭网络上弄一台按我喜好配置的 Linux 机器了，是时候互联网上放一台
    Linux 机器作为我电脑实力的象征了。况，你们都知道女性有多喜欢运行 Linux 的男士。


    好了，一切就是这样开始的。我用手头的闲旧零件组装了一台 450MHz 的工作站/服务器，安装了 40GB 硬盘、256MB 内存和 10/100 以太网。我从
    cheapbytes.com 花了 53 美元买了一个“红”发行版并安装了 Linux。然后我加载了一切。不只是几个工具，而是一切。我加载了编译器（FORTRAN,
    COBOL, C, C++, CPlus+, 等），像 gimp、hypersnap 和 ASCII 艺术之类的图形工具；游戏以及更多游戏；Windows，SAMBA,
    MYSQL, YOUR, NFS, NSA, UBU。任何我能找到的 RPM 格式的东西我全加载了。


    噢，那是一台很棒的机器。专业人士为了自我娱乐而构建的系统。它将成为我的私人 Linux 乐场。然后作为创作的证明，我第一次连接互联网启动了它。我的 OpenVMS
    服务器在互联网上运行了近 10 年没有出意外（如果算上通过 UUCP 的慢速连接的话更久），所以我觉得安全，Linux 操作系统也足以抵御互联网的肆虐。我做的第一件事是：配置了
    Apache，并创建了一个指向家庭目录的 SAMBA SMB 映射和一个 MP3 文件共享。我在那个文件共享上加载了 10GB 的 Napster 文件，并开始探索现在我家庭网络可用的工具和事物。


    ### 四天后


    Linux 机器的新鲜感已消退，我回到了 OpenVMS 系统，在 Netscape 中查看邮件。收件箱里出现了一个奇怪的邮箱地址，看起来来自“澳洲澳洲”（Down
    Under）。我打开信，立刻从邮件头意识到它来自一个 OZ 域名，并开始阅读。“你好，”我几乎能通过电线听见那口澳洲口音，“你为什么要探测和扫描我的整个 C
    类地址空间？”


    我惊呆了。我没有在对太平洋环带的 C 类地址运行任何端口扫描，对吧？然后我看到了他给我的日志。不是我，不可能是我！记住所有的阶段——否定、愤怒、讨价还价、抑郁、接受。在被黑后的第一个
    24 小时，我经历了所有这些阶段。


    看起来这些 ping 和扫描是来自我新新的 Linux 机器！那时已经晚了，我处于完全否认的状态，给那个粗鲁家伙回了一封邮件：“不可能是我。”然后我就睡觉了。


    第二天早上，我那位来自澳大利亚的新朋友给我发了更多日志，证明我的系统在探测方面的复杂性：“你好，伙计，我相信脚本小子（script kiddies）控制了你的机器，你应该查查他们在做什么。”


    脚本小子——这个名字让我那安装了四天的 Linux 感到恐惧。他们如何能在广袤无垠的互联网找到我。我才上线了四天啊！感觉自己像个异乡的异乡人，我问任何一个
    OpenVMS 系统管理员在遇到 Linux 机器问题时会怎么办。我打了另一个 OpenVMS 系统管理员的电话！不是任何系统管理员，而是我的好朋友 Cathey，DECUS/VMS
    SIG 主席兼达拉斯-沃斯沃堡当地小组的总裁。David 的 Linux 经验没有我丰富，他很快指出我们应该在系统上寻找奇怪的文件。


    Dave 走了过来，我们寻找了临时文件。寻找就寻得；所有的父母都担心自己的孩子感染了虱子！那台 Linux 机器不仅被黑了，而且还有端口扫描日志、端口扫描执行程序，以及两个坏蛋在破解机器之间整个文件对话的日志，他们正用这些寻找新机器进行攻击。David
    和我以超级用户——我们——监控并捕获了会话信息。


