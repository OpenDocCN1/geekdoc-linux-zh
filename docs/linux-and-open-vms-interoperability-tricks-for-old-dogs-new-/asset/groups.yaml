    \ SMB file and printer sharing on OpenVMS with a Windows environment.\n\nThat's\
    \ not that SAMBA for OpenVMS isn't making a lot of friends! The OpenVMS hobbyist\
    \ communities and those who only need file and printer sharing find that SAMBA's\
    \ Open Source and free cost are most efficacious for sharing with their UNIX,\
    \ Linux, and Windows clients! With OpenVMS you really do have two choices for\
    \ your SMB server based on your specific needs and your pocketbook\n\n## Linux\
    \ and SAMBA\n\nThe ability to share file and print services today is assumed for\
    \ all operating systems. Windows is the largest client population likely to be\
    \ found on a network. The easiest way to do this is to add Windows security and\
    \ sharing to Linux. This not only offers an authentication mechanism common across\
    \ most desktop platforms but also includes file and printer services for Windows\
    \ RedHat clients that can be stored on a Linux Server.\n\nInstalling Linux as\
    \ an SMB server with RedHat 7.3 allows you to choose an SMB server, which will\
    \ automatically install SAMBA for you (see Figures 7-1 through 7-13). It installs\
    \ SAMBA, but it's up to you to configure it!\n\n## Service Configuration\n\n![](img/3ba916f144e94350147c366c3485e02e_116_0.png)\n\
    \nFigure 7-1 In the Server Manager menu under the GNOME desktop, all you have\
    \ to do is to check the box and save your choices.\n\n![](img/3ba916f144e94350147c366c3485e02e_116_1.png)\n\
    \nFigure 7-2 The next step to activate SAMBA is to configure the Imhosts file\
    \ in the /etc/samba directory, use your favorite Linux editor, and add the \"\
    LAN Manager\" names of the other hosts in your workgroup or domain.\n\n```\nroot@lnxone:etc/samba\n\
    File Edit Settings\n[root@lnxone samba]# pid\n/etc/samba\n[root@lnxone samba]#\
    \ is\nleaves MOWDINE_SID secrets.tdb smb.conf sabusers\n[root@lnxone samba]# cat\
    \ hosts\n127.0.0.1       localhost\n65.64.220.210 version\n65.64.220.213 wizzule\n\
    [root@lnxone samba]#\n[root@lnxone samba]# cat sabusers\n# Unique-name = Smb_name1,SMB_name2\n\
    # root = administrator admin\nnotbody = guest pcquest guestquest\njohn = john\n\
    steves = steves\njeraw = jeraw\nsmb_pub = smb_pub\n[root@lnxone samba]# #\n```\n\
    \nFigure 7-3 Then edit smusers and add the Linux account names and the Windows\
    \ workgroup/domain names that you want to map to. Note that you can map Windows\
    \ users to a single Linux account!\n\n```\ngedit /etc/samba/\nFile Edit Search\
    \ Plugins Settings Documents Help\nNew Open Save Close Print Undo Redo Cut Copy\
    \ Paste Find Exit\nsmb.conf\n# This is the main Samba configuration file.. You\
    \ should read the\n# smb (conf) manual page in order to understand the options\
    \ listed\n# Samba has a lot of configurable options (perhaps too\n# many!) most\
    \ of which are not shown in this example\n# Any line that starts with a # (comment)\
    \ or a #\n# is a comment and is ignored. In this example we use a #\n# for commentary\
    \ and for parts of the config file that you\n# may wish to enable\n# NOTE: Whenever\
    \ you modify this file you should run the command \"testparm\"\n# to check that\
    \ you have not made any basic syntax errors.\n============ Global Settings ============\n\
    [global]\n# workgroup = NT-Domain-Name or Workgroup-Name\n# workgroup = WORKGROUP1\n\
    # server string is the equivalent of the NT Description field\n```\n\nFigure 7-4\
    \ Edit the samba.conf file and change the name of the domain/workgroup so that\
    \ it is the same as the domain/workgroup that your PC (and other Linux) clients\
    \ are using.\n\n118 Linux & OpenVMS Interoperability\n\n```\ngedit /etc/samba/smb.conf\n\
    ```\n\n```\n# for commentary and a ... for parts of the config file that you\n\
    # may wish to enable\n\n# NOTE: Whenever you modify this file you should run 'testparm'\n\
    # to check that you have not made any basic syntactic errors.\n\n=============\
    \ Global Settings ==============\n[global]\n# workgroup = NT-Domain-Name or Workgroup-Name\n\
    workgroup = vski\n# server string is the equivalent of the NT Description field\n\
    server string = can't see if it's Linux!\n# This option is important for security.\
    \ It allows you to restrict\n# connections to machines which on your local network.\n\
    # The following example restricts access to two networks\n# the \"loopback\" interface.\
    \ For more examples of the syntax\n# name a = ...\n```\n\nFigure 7-5 Change the\
    \ server string to something appropriate. This will be displayed when client browsers\
    \ your SMB Server.\n\n```\nedit /etc/samba/smb.conf\n```\n\n```\n[global]\n# workgroup\
    \ = NT-Domain-Name or Workgroup-Name\nworkgroup = vski\n# server string is the\
    \ equivalent of the NT Description field\nserver string = can't see if it's Linux!\n\
    # This option is important for security. It allows you to restrict\n# connections\
    \ to machines which on your local network.\n# The following example restricts\
    \ access to two networks\n# the \"loopback\" interface. For more examples of the\
    \ syntax\n# name a = ...\nhosts = 192.168.1\nhosts = 192.168.2.200 192.168.2.211\
    \ 192.168.2.240 192.168.2.245 192.168.2.220 192.168.2.217\n# If you want to automatically\
    \ load your printer list\n# than setting them individually you'll need this\n\
    name = /etc/printcap\nload printers = yes\n```\n\nFigure 7-6 Specify all SMB clients\
    \ and servers that you want to allow an SMB connection to. Use wildcards?\n\n\
    Chapter 7 – SMB for Linux and OpenVMS 119\n\n```\nroot@lnxone:etc/samba# pwd\n\
    /etc/samba\nroot@lnxone:samba# ls\ninhosts MOKINE.cd secrets.tdb smb.conf sambusers\n\
    root@lnxone:samba# cat hosts\n127.0.0.1 localhost\n65.64.220.211 vscore\n65.64.220.211\
    \ wirzmole\n65.64.220.211 wintermute\nroot@lnxone:samba# cat sambusers\nunique-name\
    \ = SMB_name_SMB2\nroot = administrator admin\nnnbody = guest pcwest quest\njohn\
    \ = john\nsteves = steves\njennaw = jenraw\nsmb_pub = smb_pub\nroot@lnxone:samba#\n\
    root@lnxone:samba# smbpasswd -a johnn\n```\n\nFigure 7-7 After that is done you\
    \ run smpasswd as the root user and create an SMB password (from the first time\
    \ it runs). Then add passwords for all the Linux user account names that will\
    \ connecting to your SMB Server.\n\n```\nroot@lnxone:etc/samba# pwd\n/etc/samba\n\
