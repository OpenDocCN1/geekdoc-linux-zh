    # Today’s Networking Standards


    Today (10 plus years after the network protocol wars) TCP/IP is robust and well
    understood by commercial IT groups and individuals. Now the industry is evolving
    into IPv6 (currently IPv4 is used for most implementations). The protocol is expanding
    and improving to incorporate even more features in routing and secure applications—all
    with a standards-based networking protocol.


    Networking for OpenVMS and Linux (or any two or more computing machines) has to
    be based on the same standards. Today’s networking standards of choice are TCP/IP
    software protocols and Ethernet hardware protocols. In previous years it was also
    important to be exchange across terminal lines, विडियो, and direct synchronous
    and asynchronous connections (such as RS-232 cables); the need for the older types
    of connections is wanting but not quite obsolete. Today’s workstations continue
    to use for dial-up with point-to-point protocols that encapsulate TCP/IP for transmission
    between two computers. With more and more workstations servers tied to DSL, or
    cable mediums, routers, and even firewalls, Ethernet networks (even Ethernet wireless
    networks) are the of interconnection possible.


    Notice that all the IEEE 802.X standards refer to the bottom two layers (all hardware)
    of the OSI model (http://standards.ieee.org/) (See Table 3-1).


    # Table 3-1: Standard OSI Model with TCP/IP Positions


    | OSI Network Model | TCP/IP Internet Model | IEEE Standards |

    |---|---|---||

    | Layer 7—Application | Netscape, Xterm, E-mail Readers, FTP-based tools, and
    other application programs for displaying data | | |

    | Layer 6—Presentation | Telnet, FTP, SMTP, other TCP/IP protocols | | |

    | Layer 5—Session | Telnet, FTP, SMTP, other TCP/IP protocols | | |

    | Layer 4—Transport | Transmission Control Protocol (TCP) Unacknowledged Datagram
    Protocol (UDP) | | |

    | Layer 3—Network | IP Internet protocol | | |'
