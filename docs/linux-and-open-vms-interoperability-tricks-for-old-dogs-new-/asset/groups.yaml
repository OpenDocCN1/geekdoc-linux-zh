    集成到 OpenVMS 和 OpenVMS 集群中，每年都有新客户。


    - **时间**：随着互联网的持续增长和服务器整合的持续，系统的衡量标准将取决于其在可预测的时间段内处理许多微小作业的能力，同时均匀地共享资源。自1970年代以来，OpenVMS
    及其调度器一直在提供并完善可预测的、甚至是实时的性能。面对如今 Web 服务器、事务服务器和应用程序服务器的需求，对每个作业进行容量规划和可预测响应已成为部署原型应用的先决条件。


    - **安全**：在过去的 13 年里，OpenVMS/VMS 只有于 25 条 CERT 安全公告。（截至 2002 年 6 月：Windows 2000
    为 484，Linux 为 546，Solaris 为 490，AIX 为 377；http://www.cert.org/）。


    在生产环境中部署其他服务器，您在扩展服务器和确保所有 CERT 公告都得到修复上花费的系统管理费用，将远比直接开箱即用 OpenVMS 多得多！如果您检查了所有的
    CERT 公告，可能需要花费数百小时来审查其他操作系统中的各种安全漏洞。


    开箱即用的 OpenVMS 几乎是不可被攻击的（2001年7月 DEFCON 9 黑客大会的笨蛋/法官们是这么说的：http://www.dfwcug.org/dfwcug_newsletters/20107.PDF）。


    著名黑客 Kevin Nick 最近向国会作证，当他尝试破解英国的一个 OpenVMS 系统时，遭遇了人生中的第一次失败（http://www.zdnet.com/zdnn/stories/news/0,4586,24547537,00.html）。


    - **合规**：国防信息基础设施共同操作环境（DIICE）认证意味着 Compaq/HP 已于 2001 年与美国政府签署协议，在未来 20 年内支持 OpenVMS。这允许
    HP 继续向美国政府销售 OpenVMS（OpenVMS 最大的用户之一），并且必须在未来 20 年内对向美国政府的产品维持支持。


    - **共享文件系统**：OpenVMS 通过 Advanced Server（来自微软的代码）提供与 Windows 2000 和 NT 4.0 SMB
    文件系统的集成。从开放系统（UNIX）侧，OpenVMS 与 NFS (V3.0) 集成。OpenVMS 还可以提供单一目录，供 Windows 系统和 UNIX
    系统同时查看、协调和访问！


    - **电子商务基础设施**：Attunity 的 XML 和数据库网关包含在 OpenVMS 许可中。Apache、SSH、Java、微软的 COM（对象调用标准）、CORBA（开放系统对象调用标准）、DCE
    和 X Windows 均包含在 OpenVMS 的基础许可中。


    - **服务与支持**：对于一个部署操作系统达数年的企业来说，对过去产品和操作系统以前版本的支持至关重要。HP 和 OpenVMS 持续支持 VAX 系统（尽管他们已经近
    2 年没有出过新的 VAX 了！），并为客户支持追溯到 10 年前的 OpenVMS 操作系统之前的稳定版本。很难想象将我们最新的 PC 部署 10 年。企业不喜欢更改正在运行的应用程序，一旦运行，它们就倾向于不离线，这是
    OpenVMS 最著名的标志之一。


    - **高可用性**：许多公司选择 OpenVMS 是因为它是少数能够实现 99.9999% 性承诺（每年停机约三分钟）的操作系统之一。如果 OpenVMS
    刚刚声称这一成就，它可能是可的；但自 20 世纪 90 年代初（在配置和维护良好的 OpenVMS 集群中），客户一直从机器中获得这种服务。软件和操作系统的滚动升级，以及多年的连续处理，是
    OpenVMS 开创的其它里程碑。


    在作为计算机、应用程序和数据库服务器 25 年后，很少有其他操作系统能从部署平台上开始匹配 OpenVMS。虽然 OpenVMS 永远不会是最好的桌面系统，但它已经证明自己是我们行业中最优秀、最稳健、最安全、最强大的集群操作系统。等等：别转台，还有更多！如果
    OpenVMS 只是我们行业中功能最多的普通操作系统，可能足够好；但你会为这样一个出色的工具付多少钱？平均 UNIX 服务器成本的两倍或四倍？如果 OpenVMS
    给你所有这些能力，并且与所有其他 UNIX 系统和主机相比具有行业内最低的拥有成本呢？等等，别信我——看看 Techwise Research 在 2001
    年对 OpenVMS 的研究，他们发现 OpenVMS 在五年期间的任何服务器部署中成本最低的（http://www.openvms.compaq.com/openvms/whitepapers/techwise.html）。


    ## Linux 与 OpenVMS 的互操作性


    经过测试和支持的功能、行业内最低的拥有成本和部署成本、最高的可用性和可扩展性，以及与所有最新互联网和电子商务软件及工具互操作的 25 年历史记录——这就是为什么你将在未来
    10 年将继续使用 OpenVMS。


    ## 为什么选择 Linux 与 OpenVMS


    当 Linus Torvalds 启动他的项目时，他梦想有一种不受 Windows 限制的操作系统。随着 Windows 的增长，Linux 变成了一个强大的替代方案。但
    Linux 具有与 OpenVMS 一样的安全性和吗？


    ## 结论


    OpenVMS 系统和 Linux 系统与 UNIX 和 Windows 服务器有许多共同点，并且各自都有独特的优势。考虑到我们现在的异构计算环境并展望未来，OpenVMS
    和 Linux 在未来许多年将在我们的数据中心和专业信息服务（IS）部署中大显武场——OpenVMS 凭借其高可用性和可扩展性，而 Linux 则凭借其低单位成本结构和庞大的开源软件库。

