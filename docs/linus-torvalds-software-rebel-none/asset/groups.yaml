    \ ONE\n\n# Changing the Future\n\n# The Most Famous Computer Programmer in the\
    \ World\n\nWHO IS THE MOST FAMOUS COMPUTER PROGRAMMER IN THE WORLD?\n\nBILL GATES,\
    \ YOU MIGHT ANSWER, AND YOU WOULD BE PARTLY RIGHT. BUT ALOUGH GATES STARTED HIS\
    \ CAREER AS A PROGRAMMER, HE ACHIEVED FAME AND FORTUNE AS A BUSINESSMAN AND A\
    \ MARKETER—NOT A TECHNICIAN.\n\nWHO IS THE MOST FAMOUS COMPUTER PROGRAMMER IN\
    \ THE WORLD?\n\nIf you put this question to a techie crowd, chances are you would\
    \ get one single resounding answer: Linus Torvalds. He has more listings on the\
    \ World Wide Web than Steve Jobs, Bill Gates, Larry Ellison, and even Tom Cruise.\n\
    \nLinus who?\n\nOkay, so he is not a household name. He is not a multibillionaire.\
    \ He does not own a jet. He has never brought a company public in a soaring initial\
    \ public offering (IPO) like many of the techies you have probably heard of.\n\
    \nBut that is what makes Linus Torvalds so special. He is often called the anti–Bill\
    \ Gates. He has not made any money from his software, although he has practically\
    \ created a revolution. He wrote an operating system called Linux, a widely admired\
    \ platform that competes with Windows. And this is the amazing part: He gives\
    \ it away for free. Yes, free. You and anyone else on the planet with a computer,\
    \ a modem, and a decent amount of space on your hard drive can download it from\
    \ the Internet.\n\nYou may not have heard of him, but you can bet that Bill Gates\
    \ has. Torvalds is not making any money from Linux, but he is changing the way\
    \ software is written, updated, and\n\n![](img/0c2204037b7580f6d0abcab13a83061d_12_0.png)\n\
    \nLinus Torvalds proudly holds a license plate bearing the “Linux” name.\n\ndistributed.\
    \ And he is making a lot of people wonder why they should pay for Windows or any\
    \ other expensive system when they can get Linux for nothing.\n\nEven more important,\
    \ Torvalds has been instrumental in creating a thriving community. He has invited\
    \ every Linux user and programmer to help him write the code and eradicate the\
    \ bugs to make Linux better. Linux is the brainchild of one great programmer,\
    \ but it is the product of millions.\n\nSo, although Linux Torvalds may not be\
    \ a household name . . . yet . . . he has made software free, he has made it inclusive,\
    \ he has made it adaptable, and while he was at it, he changed the future of computing.\n\
    \n# A Strong and Independent Mind\n\nLinus (pronounced LEE-nuss) Benedict Torvalds\
    \ was born in Helsinki, the capital of Finland, on December 28, 1969. According\
    \ to legend, he was named both for Linus Pauling,\n\n![](img/0c2204037b7580f6d0abcab13a83061d_14_0.png)\n\
    \nDr. Linus Pauling, winner of the Nobel Prize for chemistry and peace\n\n11\n\
    \n![](img/0c2204037b7580f6d0abcab13a83061d_15_0.png)\n\nHelsinki, Finland—Linus's\
    \ hometown\n\nthe chemist, and native speakers in Finland account for only 6 percent\
    \ of the population, Swedish is counted (along with Finnish) as one of Finland’s\
    \ two languages.\n\nAccording to his father, Nils Torvalds, his son’s strong and\
    \ independent mind was well apparent by the time he was eight years old. “On Christmas,\
    \ I gave him a fairly model ship and thought that we in a father-and-son-together\n\
    \n![](img/0c2204037b7580f6d0abcab13a83061d_16_0.png)\n\nwould build it. The following\
    \ morning, he had already made it by himself,” his father recounted.\n\nQA76.2.S7\
    \ B273 2001\n\nvalds became fascinated by computers at the age of ten. “What else\
    \ are you to do in Finland if you hate hockey?” jokes. His grandfather, Leo Torqvist,\
    \ a professor of statistics at the University of Helsinki, brought home one of\
    \ the very early personal computers, a VIC-20, and encouraged Torvalds to use\
    \ it. “I started programming because you had to make it work,” Torvalds remembers.\
    \ Within a short time, young Torvalds was writing his own computer games.\n\n\
    Alough his father tried to get him interested in sports, it did not work. “I was\
    \ never very good,” Torvalds says now.\n\nAs a child, he was disciplined and single-minded,\
    \ but not dogmatic. “He once said that he won’t eat sweets,” his father recounted.\
    \ “I promised him one hundred Finnish marks if he kept that promise for a year.\
    \ He did, but the following day\n\nafter the bet was completed], he took the money\
    \ and bought sweets for the whole sum.\n\n# The Good Old Days of Free Software\n\
    \nTorvalds was not the first computer programmer to feel that software should\
    \ not be owned or controlled, that it should be available freely to everybody.\
    \ In fact, up until the 1980s, nobody really thought of software as something\
    \ to sell on a grand scale at all. It was not so much idealism that made software\
    \ free back then. Programmers did not have the sense they were giving away anything\
    \ of great potential value. Hardware—the stuff you could touch, type on, see—that\
    \ was considered the real product. That’s what engineers and businesspeople believed\
    \ you made money on. Software was sort of a necessary evil to make your hardware\
    \ useful.\n\nIn many ways, this was a more idealistic and innocent time,\n\n![](/0c2204037b7580f6d0abcab13a83061d_19_0.png)\n\
    \nMicrosoft offices in Redmond, Washington.\n\nThe company kick-started the software\
    \ revolution.\n"
