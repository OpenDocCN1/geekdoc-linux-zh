    unavailable to the wider community of programmers for fixes or alterations. Because
    Torvalds did not charge anybody any money for it, it joined the library of free
    software called freeware:


    Originally he chose the name Freix (the -ix from Unix). It was meant to be sort
    of a silly pun. “But it turns out that the person who had the FTP site* in Finland
    didn’t like the ‘Freix’ part, so he just decided on Linux instead,” Torvalds remembers.


    “The first thing I got was a lot of comments,” Torvalds said. And he responded
    to those comments, making the system bigger and better. Soon after that, users
    not only e-mailed him suggested improvements began e-mailing him code—actual patches
    of programming to fix a-bug or adapt the system to a new use. If Torvalds felt
    the patch was useful and well executed, he would apply it to the larger system.
    In the beginning he was getting comments and code from about five to people, and
    then the number of contributors began to grow.


    > *FTP stands for “file transfer protocol.” An FTP site is a public-access Web
    site for posting and downloading files.


    It got better and better,” Torvalds says of baby Linux. Torvalds coordinated the
    efforts of this growing number of developers, making sure the system continued
    to improve and to grow in a healthy and coherent way. He released subsequent versions,
    .02, .03, and .04, responding quickly to the improvements of his collaborators.


    ## “Copyleft"


    To make sure the Linux source code stayed open and the software free, Torvalds
    formally released the operating system under a license known as “copyleft,” pioneered
    by the free software crusader Richard Stallman, founder of the Free Software Foundation,
    based in Cambridge, Massachusetts.


    “Copyleft” (as opposed to the traditional copyright, in which a person legally
    secures ownership of his or her work) means that the software can be copied and
    altered and distributed any number of times, but the source code must always remain
    open and accessible to all. Torvalds wanted to be sure that no matter what personal
    or professional decision he or the other developers made in their lives, none
    of them could own Linux—nobody could sell it to Microsoft or bury the source code.
    “I wanted people to be able to trust me without trusting me personally,” Torvalds
    said. “So even if I turn to the dark side, nobody can take it over.”


    As Linux grew and more programmers contributed substantial pieces beyond the basic
    kernel or core of the system, Torvalds encouraged them to issue similar licenses
    in their own names, so now there are many licensors of Linux. “Nobody can fundamentally
    change it now because they’d have to coordinate everybody who owns these pieces,”
    Torvalds explains.


    It is not a decision he has ever regretted. “When it comes to Linux,” he says,
    “the one decision I am most proud of is not the actual physical design of the
    system, but the decision to make it free.”


    ## Linux 1.0 (and Counting)


    In March 1994, Torvalds released Linux 1.0—once again over the Internet—signifying
    the first stable, complete version of the system. Although Linux already had more
    than 100,000 users, Torvalds resisted calling a version 1.0 until it had a proper
    networking capability, allowing computers to connect easily to one another. So
    at last, three years after the project began, it had every essential component
    of a true operating system.


    The number of users and code developers grew at a dizzying rate, and still Torvalds
    managed to run the vast network from a small apartment in Helsinki he shared with
    his then girlfriend (now wife) Tove, the six-time karate champion of Finland.
    Word of Linux was beginning to spread beyond its circle of devotees, and soft-spoken
    Torvalds was fast becoming a programming legend. Yet he remained a graduate student
    at the University of Helsinki and collected a modest stipend. The university allowed
    him to devote almost all his time to Linux, and the Linux community helped him
    pay off his debt on the computer he used at home for Linux development.


    ![](img/0c2204037b7580f6d0abcab13a83061d_34_0.png)

    Jon Hall, executive director of Linux International, plays with a live penguin.


    ![](img/0c2204037b7580f6d0abcab13a83061d_35_0.png)

    Parading penguins—the inspiration for the Linux logo


    When people questioned why this technical visionary would remain a poor student
    in Finland instead of getting a "real job," he responded, "I’ve been very happy
    with this arrangement—I get to do whatever I want, and I have no commercial pressures
    whatsoever doing this. . . . As I’ve been able to live happily on university pay,
    the deciding factor is not so much the money as the interest level of any ‘real
    job’ (but lest somebody gets the idea that money doesn’t matter at all, I’ll just
    mention that yes, it does).


    In June 1996, after many intermediary versions, Torvalds released version 2.0,
    which offered users the ability to run the Linux platform on a wider variety of
    computers—those using chips other than the Intel x86 family, for example, or computers
    powered by more than one microprocessor.


    By this time, Linux users constituted a fanatical code-writing army. The project
    grew so rapidly, with so much harnessed brainpower, that Torvalds’s own code shrank
    to a small minority. He estimates that at least 90 percent of Linux code is written
    by others. While his original release was 10,000 lines of code—all of which have
    since been rewritten—Linux now has 15 million lines.


    The Linux troops decided they needed a logo, so the choice was given to Torvalds.
    He chose a penguin. Why? “Partly accident, partly because I like penguins,” he
    explains. “Partly because I was bitten by a penguin. It was at an open zoo. I
    made my finger like a herring—and the penguin fell for it.” Some of the Linux
    faithful complained the logo was not serious or high-tech enough, but Torvalds
    disagrees. “I’m much happier being associated with a fun and irreverent logo than
    something static and boring.”


    ## Yes, Linux Is Free, But Is It Good?


    On the whole, Linux has been adopted by a more technologically sophisticated group
    of users than Windows or Macintosh. Linux is not as user-friendly as those platforms
    (not yet, anyways), and it does not have the large and complex overlays to make
    the computing experience virtually transparent to the common user. Furthermore,
    Linux does not offer nearly the array of polished applications that Windows does.


    And yet Linux users say it is a far more stable, reliable system than Windows
    or Mac. Linux fans share stories of Linux-powered computers running for months
    and even years without crashing or needing to rebooted. Linux is far more compact,
    less bloated than Windows, so it runs faster and requires a less powerful microprocessor.


    And if your Linux system reveals a bug, you or any hacker* you know could conceivably
    fix it then and there, unlike a Microsoft system, for which you often need to
    wait days or weeks for a Microsoft employee to fix it for you. Computer users
    praise the robust stability of Linux, but they also praise the fact that you can
    make the program do exactly what you need it to do.


    > *Although among the civilian population the term hacker has a negative connotation—to
    conjure images of virus-writing, troubleshooting, Pentagon-breaking criminals—the
    word hacker is actually morally neutral. Used here and in the broad techie community,
    hacker simply means a programmer. To hack is to write computer code—any code,
    not just the kind that causes trouble. If anything, hacker is used among techies
    as a term of respect.


    So yes, Linux is good. It is more than good—by veteran users it is nothing short
    of beloved.

