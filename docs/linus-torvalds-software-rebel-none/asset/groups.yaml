    After being changed into binary, the instructions might look like this:

    101000101010110110100101010101010010010101010


    Although the computer itself can read the machine language, in order for a programmer
    to easily understand what the computer is really doing, she needs to see the program
    before it has been translated. In other words, the programmer needs to have the
    source code.


    Many companies (like Microsoft) literally lock the source code for their programs,
    because they feel that if the code fell into other people''s hands, their ideas
    might be stolen and they might lose money.


    Open source is a powerful idea because, instead of locking the code away, the
    code''s developer allows the entire community of programmers to use it and improve
    on it. Also, if a bug is discovered in the code, it is likely to be fixed more
    quickly than it might if only the original developers were allowed to work on
    it.


