    # 第一章


    # 改变未来


    # 世界最著名的计算机程序员


    谁是世界上最著名的计算机程序员？


    你可能会回答是比尔·盖茨，你说对了一部分。尽管盖茨的职业生涯始于程序员，但他获得名声和财富是因为他是一名商人和营销人员——而不是技术人员。


    谁是世界上最著名的计算机程序员？


    如果你向一群技术极客提这个问题，很可能得到一个且响亮的答案：里纳斯·托瓦尔斯。他在万维网上的相关列表比史蒂夫·乔布斯、比尔·盖茨、拉里·艾利森甚至汤姆·克鲁斯还要多。


    里纳斯是谁？


    好吧，他不是一个家喻户晓的名字。他不是亿万富翁。他没有私人喷飞机。他从未像你可能听过的许多技术极客那样，通过高涨的首次募股（IPO）让公司上市。


    但这正是里纳斯·托瓦尔斯如此特别之处。他经常被称为“反比尔·盖茨者”。他没有从他的软件中赚过任何钱，尽管他实际上创造了一场革命。他编写了一个名为 Linux
    的操作系统，这是一个广受赞誉的与 Windows 竞争的平台。而令人惊讶的部分是：他是免费提供的。是的，免费。你和地球上任何其他拥有电脑、调制解调器并且硬盘上有足够空间的人，都可以从互联网下载它。


    你可能没听过他，但你可以打赌比尔·盖茨听过。托瓦尔斯没有从 Linux 中赚取任何钱，但他正在改变软件的编写、更新和


    ![](img/0c2204037b7580f6d0abcab13a83061d_12_0.png)


    里纳斯·托瓦尔斯自豪地拿着一块写有“Linux”字样的牌照。


    分发。他让很多人好奇，为什么既然可以免费获得 Linux，还要为 Windows 或其他昂贵的系统付费。


    更重要的是，托瓦尔斯在创建一个繁荣的社区方面发挥了关键作用。他邀请每一个 Linux 用户和程序员帮助他编写代码并消除漏洞以让 Linux 变得。Linux
    是一个伟大程序员的结晶，但它是数百人的产物。


    所以，尽管里纳斯·托瓦尔斯可能还不是一个家喻户晓的名字…………但他让软件变得免费，让它具有包容性，让它具有适应性，顺便，他改变了计算的未来。


    # 强大且独立的心


    里纳斯（读音为 LEE-nuss）本尼迪克·托瓦尔斯出生于 1969 年 12 月 28 日，芬兰首都赫尔辛基。根据传说，他的名字命名既是为了纪念里纳斯·保林，


    ![](img/0c2204037b7580f6d0abcab13a83061d_14_0.png)


    里纳斯·保林博士，诺贝尔化学奖和和平奖获得者


    11


    ![](img/0c2204037b7580f6d0abcab13a83061d_15_0.png)


    赫尔辛基，芬兰——里纳斯的家乡


    化学家，而且瑞典语占芬兰人口的 6%，与芬兰语一起被列为芬兰的两种语言之一。


    根据他父亲尼尔斯·托瓦尔斯的说法，他的儿子在八岁时就表现出了强大且独立的思想。圣诞节那天，“我给了他一艘相当不错的模型船，他认为我们会父子一起


    ![](img/0c2204037b7580f6d0abcab13a83061d_16_0.png)


    会造出它。第二天早上，他就已经自己做好了，”父亲回忆道。


    QA76.2.S7 B273 2001


    托瓦尔斯在十岁时对计算机着迷。“如果你讨厌冰球，在芬兰还能做什么呢？”他开玩笑说。他的祖父奥·托尔奎斯特是赫尔辛基大学的统计学教授，带回了一台最早的个人电脑之一
    VIC-20，并鼓励托瓦尔斯使用它。“我开始编程是因为得让它运行，”托瓦尔斯回忆道。不久，年轻的托瓦尔斯就开始编写电脑游戏。


    尽管他的父亲试图让他对运动感兴趣，但并没有成功。“我从不擅长，”托瓦尔斯现在说。


    小时候，他非常自律且专注，但并不固执。“他曾说过他不吃甜点，”父亲回忆道，“我承诺如果他坚持一年，就送他一百芬兰马克。他做到了，但在赌约完成后的第二天，他拿了那笔钱买了一大堆甜点。”


    # Free软件的黄金时代


    托瓦尔斯并不是第一个认为软件不应该被拥有或控制，而应该供所有人免费使用的计算机程序员。事实上，直到 20 世纪 80 年代，没有人真正把软件看作是可以大规模销售的东西。当时软件之所以免费并不是因为理想主义。程序员们并没有意识到他们正在送出任何具有价值的东西。硬件——那些你可以触摸、打字、看到的东西——才被认为是真正的产品。那是工程师和商界认为你可以在其上赚钱的东西。软件仅仅是让你的硬件实用的必要之恶。


    在许多方面，这是一个更加理想化和纯真的时代，


