    # Thinking of writing a groundbreaking computer operating system?


    YOU MAY WANT TO:


    - stop eating candy for a whole year

    - choose a penguin for your product logo

    - publish your program on the Internet so that other programmers can use it—for
    free


    Sound like just another programmer? Linus Torvalds wrote his own operating system—one
    that some say is better and more powerful than MS-DOS. His system, Linux, is also
    free to anyone who wants to use it. Linux is the outcome of a completely new programming
    philosophy, and it has made its author into a true cult figure.


