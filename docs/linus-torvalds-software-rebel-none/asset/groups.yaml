    he did. This kind of open or accessible source code also allows people other than
    the original writer to fix the software, to alter it to suit their own needs,
    or even to distribute it to other users and programmers. This is why Linux is
    called an open-source code system, as opposed to Windows or other proprietary
    software, in which the source code is closed or hidden—'
