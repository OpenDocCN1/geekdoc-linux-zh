    和 .04，对其合作者的改进做出快速响应。


    ## “反向版权 (Copyleft)”


    为了确保 Linux 源代码保持开放且软件免费，瓦尔德以一种名为“反向版权”的许可正式发布了该操作系统。这种许可由自由软件斗士理查德·史蒂曼（Richard
    Stallman）创立，他是位于马萨诸塞州剑桥市的自由软件基金会的创始人。


    “反向版权”（与传统的版权相反，后者在法律上确保个人对其的所有权）意味着软件可以被复制、修改和无限次传播，但源代码必须始终保持开放并对所有人可见。瓦尔德想要确保，无论他或其他开发者在生活中做出什么样的个人或职业决定，他们中的任何人都都不可能拥有
    Linux——没有人能把它卖给微软或埋藏源代码。“我希望人们能够信任我，而不是在个人层上信任我，”瓦尔德说，“所以即使我转向黑暗面，也没有人能接管它。”


    随着 Linux 的增长，越来越多的程序员在基础内核或系统核心之外贡献了大量内容，瓦尔德鼓励他们以自己的名义发布类似的许可，因此现在有很多 Linux 的许可者。“现在没有人能从根本上改变它，因为他们必须协调拥有这些部分的人，”瓦尔德解释道。


    他从未后悔这个决定。“提到 Linux，”他说，“我最自豪的决定并不是系统的实际物理设计，而是让它免费的决定。”


    ## Linux 1.0（且仍在进行中）


    1994 年 3 月，瓦尔德发布了 Linux 1.0——再次是通过互联网发布——这标志着该系统第一个稳定的、完整的版本。尽管 Linux 已经拥有超过 10
    万名用户，但在它具备完善的网络能力（允许计算机轻松相互连接）之前，瓦尔德一直拒绝称其为 1.0 版本。因此，在项目开始三年后，它终于拥有了真正操作系统的每一个基本组件。


    用户和代码开发人员的数量以惊人的速度增长，但瓦尔德仍然设他在赫尔辛基的一间小公寓里运行这个庞大的网络，那间公寓是他当时的女友（现在的妻子）托夫（Tove）共同住的，她是芬兰的六次空手道冠军。Linux
    的名声开始在其追随者圈之外传播，沉默寡言的瓦尔德迅速成为一个编程传奇。然而，他仍然是芬尔辛基大学的一名研究生，领取微薄的津贴。大学允许他将几乎所有时间投入到
    Linux 中，Linux 社区帮助他还了他在家里用于 Linux 开发的电脑债务。


    ![](img/0c2204037b7580f6d0abcab13a83061d_34_0.png)

    Linux International 的执行董事乔·哈尔（Jon Hall）正在玩一只活的企鹅。


    ![](img/0c2204037b7580f6d0abcab13a83061d_35_0.png)

    游游的企鹅——Linux 图标的灵感


    当人们质疑为什么这位技术远见家宁愿留在芬兰当一个贫穷的学生，而不是找一份“真正的工作”时，他回答道：“我对这种安排非常满意——我可以做我想做的任何事，而且在做这些时完全没有商业压力……由于我一直靠大学的工资生活得很愉快，决定因素与其说是钱，不如说是任何‘真正工作’的兴趣程度（但为了防止有人认为钱完全不重要，我只需提一下，是的，它很重要）。


    1996 年 6 月，在经历了许多中间版本后，瓦尔德发布了版本 2.0，它为用户提供了在各种平台上运行 Linux 的能力——例如使用非 Intel x86
    芯片的计算机，或由其他处理器驱动的计算机。


    到那时，Linux 用户组成了一个疯狂的代码编写军。由于项目增长如此迅速，投入了如此多的智力，以至于瓦尔德自己的代码缩减到了极少数。他估计至少 90% 的
    Linux 代码是由他人编写的。虽然他的原始版本只有 1 万行代码——这些代码后来都被重写——但 Linux 现在有 1500 万行。


    Linux 大军决定需要一个标志，因此选择权交给了瓦尔德。他选择了企鹅。为什么？“部分是偶然，部分是因为我喜欢企鹅，”他解释道，“部分是因为我被企鹅咬过。那是在一家动物园。我用鱼当诱饵——结果企鹅上钩了。”一些
    Linux 信徒抱怨标志不够严肃或不够高科技，但瓦尔德不同意。“比起静态和无聊，我与一个有趣且反叛的标志在一起要开心得多。”


    ## 是的，Linux 是免费的，但它好吗？


    总的来说，Linux 的用户群体比 Windows 或 Macintosh 更具技术水平。Linux 不像那些平台那样易用（至少还没有），它没有让普通用户的计算体验变得透明的大型复杂覆盖层。此外，Linux
    提供的应用程序种类远没有 Windows 多样。


    然而，Linux 用户说它是比 Windows 或 Mac 更稳定、可靠的系统。Linux 粉丝分享了运行 Linux 的计算机持续数月甚至几年而不崩溃或需要重启的故事。Linux
    比 Windows 精简得多，没那么臃肿，因此运行得更快，对处理器的要求也更低。


    如果你的 Linux 系统发现了漏洞，你或你熟悉的任何黑客*理论上可以立即修复它，而微软系统通常需要等几天或几周让微软员工为你修复。计算机用户赞赏 Linux
    健壮的稳定性，但也赞赏你可以让程序完全按照你的需求运行。


    > *尽管在平民中，“黑客”一词带有负面含义——会联想到编写病毒、故障排除、破解五角大楼的犯罪——但这个词在道德上实际上是中性的。在这里以及广泛的技术社区中，黑客仅仅是指程序员。破解是指编写计算机代码——任何代码，而不只是那些引起麻烦的代码。如果说的话，黑客在技术人员之间被用作尊敬称呼。


    所以，Linux 是好的。它不仅仅是好——对于老用户来说，它是深受宠爱的。

