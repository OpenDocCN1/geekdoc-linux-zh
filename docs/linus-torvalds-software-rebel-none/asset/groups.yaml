    # CHAPTER ONE


    # Changing the Future


    # The Most Famous Computer Programmer in the World


    WHO IS THE MOST FAMOUS COMPUTER PROGRAMMER IN THE WORLD?


    BILL GATES, YOU MIGHT ANSWER, AND YOU WOULD BE PARTLY RIGHT. BUT ALOUGH GATES
    STARTED HIS CAREER AS A PROGRAMMER, HE ACHIEVED FAME AND FORTUNE AS A BUSINESSMAN
    AND A MARKETER—NOT A TECHNICIAN.


    WHO IS THE MOST FAMOUS COMPUTER PROGRAMMER IN THE WORLD?'
  - '[PAGE 11]


    If you put this question to a techie crowd, chances are you would get one single
    resounding answer: Linus Torvalds. He has more listings on the World Wide Web
    than Steve Jobs, Bill Gates, Larry Ellison, and even Tom Cruise.


    Linus who?


    Okay, so he is not a household name. He is not a multibillionaire. He does not
    own a jet. He has never brought a company public in a soaring initial public offering
    (IPO) like many of the techies you have probably heard of.


    But that is what makes Linus Torvalds so special. He is often called the anti–Bill
    Gates. He has not made any money from his software, although he has practically
    created a revolution. He wrote an operating system called Linux, a widely admired
    platform that competes with Windows. And this is the amazing part: He gives it
    away for free. Yes, free. You and anyone else on the planet with a computer, a
    modem, and a decent amount of space on your hard drive can download it from the
    Internet.'
  - '[PAGE 12]


    You may not have heard of him, but you can bet that Bill Gates has. Torvalds is
    not making any money from Linux, but he is changing the way software is written,
    updated, and


    ![](img/0c2204037b7580f6d0abcab13a83061d_12_0.png)


    Linus Torvalds proudly holds a license plate bearing the “Linux” name.'
  - '[PAGE 13]


    distributed. And he is making a lot of people wonder why they should pay for Windows
    or any other expensive system when they can get Linux for nothing.


    Even more important, Torvalds has been instrumental in creating a thriving community.
    He has invited every Linux user and programmer to help him write the code and
    eradicate the bugs to make Linux better. Linux is the brainchild of one great
    programmer, but it is the product of millions.


    So, although Linux Torvalds may not be a household name . . . yet . . . he has
    made software free, he has made it inclusive, he has made it adaptable, and while
    he was at it, he changed the future of computing.


    # A Strong and Independent Mind


    Linus (pronounced LEE-nuss) Benedict Torvalds was born in Helsinki, the capital
    of Finland, on December 28, 1969. According to legend, he was named both for Linus
    Pauling,'
  - '[PAGE 14]


    ![](img/0c2204037b7580f6d0abcab13a83061d_14_0.png)


    Dr. Linus Pauling, winner of the Nobel Prize for chemistry and peace


    11'
  - '[PAGE 15]


    ![](img/0c2204037b7580f6d0abcab13a83061d_15_0.png)


    Helsinki, Finland—Linus''s hometown


    the chemist, and for the blanket-toting Peanuts family was among a minority population
    of Swedish-speaking Finns, known as *finlandssensk*. Although native Swedish speakers
    in Finland account for only 6 percent of the population, Swedish is counted (along
    with Finnish) as one of Finland’s two official languages.'
  - '[PAGE 16]


    According to his father, Nils Torvalds, his son’s strong and independent mind
    was well apparent by the time he was eight years old. “On Christmas, I gave him
    a fairly complicated model ship and thought that we in a father-and-son-together


    ![](img/0c2204037b7580f6d0abcab13a83061d_16_0.png)


    A model ship like the one Linus built—byhimself—when he was eight years old'
  - '[PAGE 17]


    way would build it. The following morning, he had already made it all by himself,”
    his father recounted.


    Torvalds became fascinated by computers at the age of ten. “What else are you
    going to do in Finland if you hate ice hockey?” jokes. His grandfather, Leo Toerngvist,
    a professor of statistics at the University of Helsinki, brought home one of the
    very early personal computers, a Commodore VIC-20, and encouraged Torvalds to
    use it. “I started programming because you had to make it work,” Torvalds remembers.
    Within a short time, young Torvalds was writing his own computer games.


    From that point on, programming became his passion and obsession. Although his
    father tried to get him interested in sports, it did not work. “I was never very
    good,” Torvalds says now.


    As a child, he was disciplined and single-minded, but not dogmatic. “He once said
    that he won’t eat sweets,” his father recounted. “I promised him one hundred Finnish
    marks if he kept that promise for a year. He did, but the following day'
  - '[PAGE 18]


    [after the bet was completed], he took the money and bought sweets for the whole
    sum.


    It is that very combination of dedication and pragmatism that has put him at the
    center of a great technological upheaval: the open-source code movement.


    # The Good Old Days of Free Software


