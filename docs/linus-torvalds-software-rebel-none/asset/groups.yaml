    # 比尔·盖茨害怕吗？


    嗯，既是，也不是。很难说 Linux 对无强大的微软 Windows 来说究竟有多大的威胁。为了让你直观感受，去年大约有 900 万台电脑在运行 Linux，而大约有
    3 亿台在运行微软 Windows。Windows 运行在全球 90% 到 95% 的桌面电脑上。所有其他操作系统——MacOS、Linux、Unix、Sun
    以及其他几种——共享了剩下的 5% 到 10% 份额。简而言之，微软非常*庞大*。但你可能已经知道这一点。


    在商业世界中，重要的不是规模，而是趋势。财务分析师想知道你的市场份额是在增长还是萎缩。这是一个关键问题。这也是股东关心的。这也是计算机行业高管们在深夜彻夜难眠的原因。你们是在崛起，还是在退场？


    Linux 绝对正在崛起。但微软会退场吗？


    ## 技术杂谈


    ### 什么是源代码？


    你可能听说过所谓的开源代码。源代码到底是什么？为什么它又开始变得如此有名呢？


    当一家公司或个人编写了一个计算机程序，并将该程序的源代码提供给任何想要它的人时，这段代码就被称为开源。编写开源程序的程序员就像一位发明了新食谱并在报纸上发表的大的大厨师。


    什么是源代码？程序员用 C++、Java 或 Smalltalk 等高级计算机语言编写他们的程序。用高级语言编写的程序被称为源代码。接下，源代码会被翻译成机器语言，以便计算机运行它。机器语言只是一系列
    0 和 1 的数字，被称为二进制代码，是计算机可以理解的语言。计算机无法直接理解高级语言，而人类也发现阅读机器语言非常困难，因此它总是需要翻译。


    例如，如果我想让计算机打印“hello”这个词，高级语言中的指令可能看起来像这样：


    ```

    printf("hello");

    ```


    在转换为二进制代码后，这些指令可能像这样：

    101000101010110110100101010101010010010101010


    虽然计算机本身可以读取机器语言，但为了让程序员轻松地理解计算机到底在做什么，她需要在翻译之前看到程序。换句话说，程序员需要拥有源代码。


    许多公司（如微软）字面上封锁了他们程序的源代码，因为他们觉得如果代码落入他人手中，他们的创意可能会被盗窃，他们可能会损失。


    开源是一个强大的思想，因为开发者没有将代码锁起来，而是允许整个程序员社区使用并对其进行改进。此外，如果代码中发现了漏洞，它的修复速度可能比只允许原始开发者进行工作要快得多。


    例如，假设我正在为 Macintosh 编写一个文字处理程序。现在，假设另一个开发者也在为 Macintosh 编写一个文字处理程序。如果我的程序不是开源的，那么我们都会做相同的工作，并最终得到非常相似的产品。在开源世界中，第二个开发者将从我的源代码开始，然后可能花费她的所有时间添加一个复杂的拼写检查器。然后她会将更新后的源代码还给我，我们最终都会获得一个比我们任何一个单独制作的更好的产品。


    有些人认为，微软体量太大了，*不*可能持续获胜。它是旋转虚拟圈的受益者。有太多的个人和公司依赖它。软件和硬件世界都是围绕微软构建的。要撼动一个根深蒂固的产品是非常的。


    另一些人认为，微软确实很脆弱。首先也是最重要的一点是，许多人（包括 Torvalds）认为，虽然微软的许多应用程序还可以甚至很好，但作为其核心的操作系统基本上很糟糕。


    ![](img/0c220437b7580f6d0abc1a83061d64_png)


    比尔·盖茨认为 Linux 是潜在威胁吗？


    许多开源支持者认为，微软被 Linux 等开源项目的飞速改进甩在了后面。微软每三年发布一次 Windows 版本——远不如 Linux 的速度。而且微软虽然雇佣了许多才华横溢的程序员，但无法与成千上万的人竞争。此外，开源支持者认为用户将对微软代码的可访问性失去耐心。红帽首席执行官
    Robert Young 将闭源软件比作购买一辆封死引擎盖的汽车。


    微软的另一个潜在威胁是安全，自互联网爆发以来，这是一个首要问题。破坏性的病毒是通过微软流行的 Outlook 电子邮件应用程序发布的。作家 Patrick
    Humphreys 这样描述：“在 20 世纪，世界的计算变成了一种单植栽培，就像一片只有一种树木的森林。任何疾病都可以毁灭它。”


    Linux 更安全吗？Torvalds 认为是这样。“如果你查看安全公告，Linux 受安全漏洞的影响与其他任何供应商一样大。问题在于，当你收到公告时，Linux
    已经有了补丁，而其他供应商倾向于说‘我们正在调查’。”


    微软还担心被称为 WINE 的东西。WINE 是由 Linux 开发者编写的 Windows 模拟器，使 Linux 运行为 Windows 的所有应用程序。尽管
    WINE 已经在运行，但还没有 Torvalds 想要的那样精良可靠。他和他的同事预计很快就会实现，一旦实现，WINE 可能会削弱微软的竞争优势。


    微软意识到这些潜在威胁了吗？是的。一份微软内部备录泄露给了外部，让微软清楚他们反对什么。备录指出：“Linux 和其他开源系统支持者正在提出越来越有说服力的论据，认为开源软件至少同于、甚至优于商业替代品。.
    . . 开源过程收集和利用跨越互联网的成千上万个个体的集体智慧的能力简直令人惊讶。”


