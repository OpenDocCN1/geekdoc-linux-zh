    Sendmail, a freeware program originally created by Eric Allman, is responsible
    for routing more than 80 percent of the mail sent over the Internet. FreeBSD and
    NetBSD are, like Linux, free Unix-based operating systems, although unlike Linux,
    they have not maintained the same centralized control.


    Netscape, the company that popularized the Internet with its Navigator browser,
    was so swayed by the arguments put forth by Eric Raymond in The Cathedral and
    the Bazaar that they released the browser’s source code in March 1999. Fixes and
    adaptations came in from around the world, including a feature provided by a group
    of Australian programmers (with a few hours of of Netscape releasing the code)
    that enabled secure transactions over the web. Within a month, Netscape had a
    new version of Navigator, ready to be downloaded.


    The progress of freeware is so stunningly fast and effective, it is hard to imagine
    any individual or even corporation being able to match it. The Australians, mentioned
    above, did not get paid, but they commanded the attention and the respect of the
    worldwide programming community.


    As journalist Josh McHugh wrote in his cover story for Forbes magazine, “Liberated
    software has become an intellectual Olympics, where some of the world’s top engineering
    minds compete—not for venture capital, but for impressing their peers."


    Although Torvalds has been a fantastically powerful and effective advocate for
    the open-source movement, he does not consider himself an idealist. Unlike the
    adherents of the Free Software Foundation, he does not consider himself political,
    either. For him, it is not about doing a good thing, although that is a very agreeable
    result. Open source, in his view, is the best, fastest, most pragmatic way to
    make great software. His primary objective is not that software be free but that
    it is excellent. And to be excellent, in his view, it needs to be free.


    With the open-source movement rocketing ahead in efficiency and popularity, you
    have to wonder if it is starting to make the closed-source software giants a little
    nervous.


    ## CHAPTER FOUR


    ## The Big Time


    ## Red Hat and Caldera Legitimize Linux for Corporate Use


    THE REBELS OF LINUX ARE RAPIDLY GAINING CORPORATE LEGITIMACY WHETHER THEY LIKE
    IT OR NOT. RED HAT, A COMPANY BASED IN DURHAM, NORTH CAROLINA, WAS BEGUN BY A
    MAN NAMED MARC EWING IN ORDER TO PROVIDE SIMPLER, FRIENDLIER ACCESS TO LINUX.
    HE KNEW THAT LINUX COULDN’T OFFER THE KIND OF PACKAGING AND CUSTOMER SUPPORT THAT
    WOULD GIVE LINUX A SERIOUS FOOTHOLD IN THE BUSINESS AND DESKTOP MARKETS. BIG CORPORATIONS


    ![](img/0c2204037b7580f6d0abcab13a83061d_53_0.png)


    Executives from Red Hat Software, a company that provides access to Linux services
    feared Linux for the same reason so many techies love it—nobody owns it. Because
    nobody owns it, corporations assumed they would have no recourse if it stopped
    working—nobody to help them get it running again, nobody to sue, nobody from whom
    they could withhold payment.


    Ewing started Red Hat to provide these very services, including instruction manuals
    and telephone support. Individual users often want a more polished-looking desktop
    and a simpler interface than they find in the raw downloads of Linux, and Red
    Hat offers that, too. For about $50, Red Hat will provide you with a CD offering
    easy installation of Linux (a process that can otherwise be famously thorny) as
    well as several handy applications geared for desktop use.


    Many veterans questioned the wisdom of Red Hat trying to sell something anybody
    can get for free, but a few big players thought Ewing was making a very smart
    move. Substantial investments in Red Hat came from Intel, the gargantuan chip
    maker, and Netscape. Red Hat stays true to the spirit of Linux in some respects—any
    code it adds to Linux, it releases under open-source rules. In other respects
    they do not—they want and need to make money. Lots of it, preferably, Red Hat
    is now a publicly traded company on the stock market worth several billion dollars.


    Caldera Systems is another company distributing Linux and offering corporate training
    and support. As with Red Hat, they make it clear that they are not charging money
    for intellectual property. They are charging money for services to support intellectual
    property.


    How does Torvalds feel about this?


    “The commercial vendors are good, yes. They all use the standard kernel, so technically
    there’s not much to worry about. And they tend to position the systems around
    Linux differently to target different markets. I couldn’t do that even if I wanted
    to, and I don’t want to,” he says. “There [is] such a synergy between having commercial
    people who wanted to make it easy to install and technical people who wanted to
    do the right thing technically that I’m not worried anymore. . . . I just don’t
    see how we can lose.


    Commercial vendors such as Red Hat and Caldera have given Linux an enormous lift
    in the market. Now hardware vendors such as IBM, Dell Computer, Corel Computer,
    and VA Research are offering computers with Linux preinstalled.


    ![](img/0c2204037b7580f6d0abcab13a83061d_56_0.png)


    Developers have adapted a version of Linux for the handheld PalmPilot.


    More and more, computer buyers will have a choice—they will not be forced to buy
    a PC preequipped with Microsoft; they will be able to choose Linux. Gigantically
    successful technology companies such as Oracle and Sun Microsystems are writing
    versions of their software to run on. After two decades of a near monopoly for
    Microsoft, this is a dream come true for Torvalds and his code-writing cohorts—and
    for virtually every proponent of open source. Now application, too, will have
    a choice of operating systems on which they would like to run, and Linux will
    be among the options. A version of Linux has been ported to the handheld PalmPilot.
    Even a few of the world’s most popular games such as Quake and Doom have been
    ported to Linux. Now corporate America is turning to Linux. Digital Domain, the
    special-effects company owned by movie-producer James Cameron, chose Linux to
    run the computers on which they created the special effects for Titanic.


    Archive Retrieval, an electronic-document-retrieval company, installed a system
    for the city of Medina, Washington, on computers running Linux. Ray A. Jones,
    president, remembers when a bug was revealed in Medina’s new system. “We asked
    a question on the Internet, and within a couple of hours we had an answer,” he
    said. “I fixed it with three lines of code. With a commercial product I''d have
