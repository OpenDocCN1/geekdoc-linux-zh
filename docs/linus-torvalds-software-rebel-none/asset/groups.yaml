    # Is Bill Gates Scared?


    Well, yes and no. It is hard to say just how serious a threat Linux is to the
    all-powerful Microsoft Windows. To put things in perspective, last year roughly
    9 million computers were running Linux and roughly 300 million were running Microsoft
    Windows. Windows tends to run on 90 to 95 percent of the world’s desktop computers.
    All the other operating systems—MacOS, Linux, Unix, Sun, and several others—share
    that remaining 5 to 10 percent. In a nutshell, Microsoft is *huge*. But you probably
    already knew that.


    What counts in the business world is not so much size but trend. Financial analysts
    want to know whether your market share is growing or declining. That is the critical
    question. That is what shareholders care about. That is what keeps computer executives
    tossing and turning at night. Are you coming or are you going?


    Linux is definitely coming. But is Microsoft going?


    ## TECH TALK


    ### What Is Open-Source Code?


    You may have heard of a thing called open-source code. What exactly is open-source
    code, and why is it starting to become so famous?


    When a company or a person writes a computer program and gives that program''s
    source code to anyone who wants it, the code is referred to as open source. A
    programmer who writes open-source programs is much like a master chef who invents
    new recipes and publishes them in the newspaper.


    What is source code? Programmers write their programs in high-level computer languages
    like C++, Java, or Smalltalk. The program written in the high-level language is
    known as the source code. Next, the source code is translated into machine language
    so that the computer can run it. Machine language is just a series of zeroes and
    ones, called binary, that the computer can understand. Computers cannot understand
    high-level languages directly, and people find it very difficult to read machine
    language, so it always needs to be translated.


    For example, if I wanted to tell the computer to print the word "hello," the instructions
    in a high-level language might look like this:


    ```

    printf("hello");

    ```


    After being changed into binary, the instructions might look like this:

    101000101010110110100101010101010010010101010


    Although the computer itself can read the machine language, in order for a programmer
    to easily understand what the computer is really doing, she needs to see the program
    before it has been translated. In other words, the programmer needs to have the
    source code.


    Many companies (like Microsoft) literally lock the source code for their programs,
    because they feel that if the code fell into other people''s hands, their ideas
    might be stolen and they might lose money.


    Open source is a powerful idea because, instead of locking the code away, the
    code''s developer allows the entire community of programmers to use it and improve
    on it. Also, if a bug is discovered in the code, it is likely to be fixed more
    quickly than it might if only the original developers were allowed to work on
    it.


    For example, let''s say I were to write a word-processing program for the Macintosh.
    Now, let''s say another developer was also writing a word-processing program for
    the Macintosh. If my program was not open source, we would both do the same work
    and we end up with very similar products. In the open-source world, the second
    developer would start with my source code and then, perhaps, spend all of her
    time adding a complex spell checker. She would then give me back the updated source,
    and we would both end up with a product that was better than either of us would
    have made alone.


    Some people believe that Microsoft is too huge *not* to keep winning. It is the
    beneficiary of a whirling virtual circle. Too many individuals and companies depend
    on it. The worlds of software and hardware are all built around Microsoft. It
    is hard to budge a product so well established.


    Others believe that Microsoft is indeed vulnerable. First and most important because
    many people, including Torvalds, feel that while many of Microsoft’s software
    applications are adequate or even good, its operating system, the linchpin of
    its success, is basically bad. According to Torvalds: “Microsoft has been very
    much into making the user interface look good, but internally it’s just a complete
    mess. And even people who program for Microsoft and who have had years of experience
    just don’t know how it works internally. Worse, nobody dares change it. Nobody
    dares to fix bugs because it’s such a mess that fixing one bug might just break
    a hundred programs that depend on that bug. Microsoft isn’t interested in anyone
    fixing bugs—they’re interested in making money.


    ![](img/0c2204037b7580f6d0abcab13a83061d_64_0.png)


    Does Bill Gates see Linux as a potential threat?


    Many of the open-source proponents believe that Microsoft is being left in the
    dust by the lightning-fast improvements of open-source projects such as Linux.
    Microsoft releases new versions of Windows roughly every three years—nothing like
    the speed of Linux. And Microsoft, although it certainly employs many gifted programmers,
    simply can’t compete with the thousands—even millions—committing brainpower to
    Linux. Besides that, Linux proponents believe users will become impatient with
    the inaccessibility of Microsoft’s source code. Robert Young, Red Hat’s chief
    executive, compared buying closed-source software to buying a car with its hood
    welded shut.


    Another potential threat to Microsoft is security, a paramount issue since the
    explosion of the Internet. Devastating viruses have been launched through Microsoft’s
    popular Outlook e-mail application. Writer Patrick Humphreys described it this
    way: “In the 1990s the world’s computing stock became a monoculture, like a forest
    with just one type of tree. Any disease can decimate it.”


    Is Linux more secure? Torvalds thinks so. “If you look at security bulletins,
    Linux is impacted by security bugs as much as any other vendor. The thing is that
    when you get the bulletin, Linux already has a patch for it, while the other vendors
    tend to say, ‘We are investigating.’ ”


    Microsoft also has to fear something called WINE. WINE is a Windows emulator,
    a software program written by Linux developers to enable Linux to run all software
    applications written for Windows. Although WINE is already up and running, it
