    # The Future of Open Source


    According to a report issued in 2000 by Forrester Research,

    Linux and other open-source projects will completely change'
  - '[PAGE 69]


    the software landscape by the year 2004. “Proprietary software vendors will suddenly
    see software development as an unfair fight: their mercenary band of captive developers
    against a battalion of Internet-armed revolutionaries,” the report predicts. It
    concludes that all software vendors will be forced to open their code or substantially
    lower the price of their licenses.


    The report, titled “Open Source Cracks the Code,” was compiled from interviews
    of information technology (IT) managers at 2,500 companies. The report found that
    56 percent of the companies were already using open-source software.


    It predicts among the winners will be IBM, which it calls the “Infrastructure
    Gorilla” because it already offers and supports open-source systems, and Dell
    Computer because it, too, seems to be offering strong support to open-source software
    such as Linux.


    And the the losers? The big one, not surprisingly, is Microsoft. Forrester Research
    predicts that Microsoft’s corporate culture'
  - '[PAGE 70]


    and strategy contrast so strikingly with the open-source model that it will begin
    to fade, eventually surviving only as what is called called a “legacy vendor,”
    hanging around to support its old products.


    Needless to say, Linux fans were pleased with the report. “Ha!” said George Nobick,
    a Linux developer. “Microsoft may own the desktop now, but we own the future.”


    Is Torvalds hoping that Linux will replace Microsoft as the world’s software powerhouse?
    Not at all. “I’m actually hoping that it won’t take more than 25 or 30 percent
    of the market. If Linux owned 95 percent of the market, it would be equally as
    sick. There is some need for competition.


    While there are strong arguments to be made against Microsoft, many people believe
    that Microsoft will remain a formidable software power well into the future. In
    any case, Bill Gates would do well to consider that penguins aren’t always cute
    and cuddly. They do bite.'
  - '[PAGE 71]


    In December 1996, Torvalds went from living what was possibly the least-secretive
    professional life in the world of computing to the most secretive. One week after
    their first child, Patricia Miranda Torvalds, was born, the happy parents moved
    their little family from Helsinki, Finland, to Santa Clara, California. Santa
    Clara is right smack in the middle of the fabled Silicon Valley, the historical
    hotbed of high tech. They moved into a modest tract house (featuring lots of stuffed
    penguins), and Torvalds signed on as a programmer at a company called Transmeta.
    His first so-called real job.


    What does Transmeta do? It is a good question that until recently had no answer.
    Transmeta kept their mission so secret that no employee was allowed to speak a
    word about what they were doing. Transmeta’s office kept their windows darkened.
    They would not even say when they were likely to say anything about what they
    were working on. Rumors abounded, and the hire of Linus Torvalds only fanned the
    flames of curiosity.'
  - '[PAGE 72]


    Transmeta became the biggest mystery in Silicon Valley. “I could tell you what
    I''m working on, but then I''d have to kill you,” Torvalds joked if anyone asked
    him about his new job.


    Although people questioned why Torvalds remained in Finland, Torvalds is quick
    to praise his mother country. “One major advantage of being from Finland was the
    very high level of education (and it was pretty much free, so I didn’t have to
    worry about economic issues when getting an education). And the fact that Finland
    is very high tech—I think Finland is number one in the world when it comes to
    the number of Internet accesses per person.” There is another way in which his
    homeland fundamentally shaped his life: “In Finland, the worth of a person isn’t
    measured in dollars,” he says.


    Still, he is certainly appreciative of the benefits of his new home in California.
    “I like the weather lot. . . . I don’t remember the last time I couldn’t walk
    around in shorts all day.” He also finds the level of high-tech activity in the
    legendary Silicon Valley stimulating. “While Finland was very high-tech, Finnish
    companies tend to be very traditional and'
  - '[PAGE 73]


    ![](img/0c2204037b7580f6d0abcab13a83061d_73_0.png)


    Torvalds demonstrates the new Crusoe chip.


    not taking many risks and doing the really interesting stuff. Silicon Valley is
    completely different: people here really live on the edge, and there are lots
    of very technically interesting projects here.


    Transmeta has turned out to be one of those interesting projects. In January 2000,
    the company finally broke its'
  - '[PAGE 74]


    silence, announcing its plan for a groundbreaking new microchip called the Crusoe.
    The Crusoe is meant to run virtually any operating system or application by tricking
    the


    ![](img/0c2204037b7580f6d0abcab13a83061d_74_0.png)


    Linus Torvalds and Dave Ditzel, CEO of Transmeta Corp., present Crusoe chips.'
  - '[PAGE 75]


    software into thinking it is running on one of Intel’s ubiquitous chips built
    on the x86 architecture—the same architecture that Torvalds first designed Linux
    around. The Crusoe chip does not use the x86 architecture; it uses something called
    VLIW, or Very Long Instruction Word. So how does Crusoe trick the software? With
    what the programmers at Transmeta call code-morphing software. Code-morphing software
    sits not on top of the operating system, as software applications always have,
    but under the operating system. “The OS thinks it’s running on a bare piece of
    hardware,” Torvalds explains.


    This extra layer of software actually does a lot of the processing work that the
    chip typically has to do, and that means the Crusoe chip needs many fewer transistors.
    In this turn means that Crusoe can work in more compact systems—such as handheld
    computers and Internet phones, the kinds of devices that experts believe will
    account for much of the computer market in the future. Another benefit is that
    the extra layer of software makes Crusoe easily, almost instantly, upgradable.
    These features could likely make the Crusoe chip,'
  - '[PAGE 76]


    once it is produced, a serious threat to Intel.

    Torvalds was recruited by Transmeta to help design and write code-morphing software.
    David Ditzel, Transmeta’s founder, wanted Torvalds not for his Linux fame—which
    was considerably smaller at the end of 1996 than it is today—but for his excellent
    programming abilities and his deep familiarity with the x86 chip structure.


    ![](img/0c2204037b7580f6d0abcab13a83061d_76_0.png)


    Torvalds, for his part, felt that “Transmeta was doing something that nobody else
    was doing.” Torvalds was also gratified that Transmeta was already using Linux
    and that they agreed to


    73'
  - '[PAGE 77]


    his spending a certain portion of his time continuing to work on Linux. This came
    as welcome news to Linux users as well. Torvalds consciously decided against working
    for one of the commercial Linux vendors because he did not want to be pulled from
    the technical side of his work, and he did not want to show preferential treatment
    to any single vendor.


    It is worth noting that the principal investor in Transmeta is none other than
    Paul Allen, cofounder of Microsoft and former partner of Bill Gates.


    # A Satisfying Life


    Torvalds undoubtedly has his hands full with his exciting, demanding job at Transmeta
    and the oversight of Linux. He is in heavy demand at computer conferences and
    expos around the globe and throughout the year. In addition, he makes time spent
    with his wife, Tove, and their two young daughters, Patricia and Daniela, a top
    priority in his life. A journalist'
  - '[PAGE 78]


    named Charles Babcock described the following scene at the Open Source in Business
    Forum at Stanford University: “Torvalds’s wife, Tove, arranged herself and their
    blond children on the floor before the front row. Halfway through the proceedings
    the youngest Torvalds let out a cry . . . and Linus casually exited the panel
    to help rearrange his family in a more distant part of the hall. No one considered
    this unusual because the Torvalds treated it as part of everyday life.” Although
    he is famous and beloved in his field, he lives a modest, unassuming life, as
    evidenced by the plain green Pontiac drives.


    Torvalds does not have a jet, and he has no plans to buy one, but he has derived
    immense pleasure from the technical achievement of Linux, not to mention all the
    acclaim it has won him and his codvelopers. In 1999 he was named Person of the
    Year by PC Magazine and given the Award for Industry Achievement by InfoWorld
    Magazine.


    For Torvalds, ultimately it is not about money, and it is not about stuff, and
    it is not about a big, fancy office. As one devel-'
- md: '

    super-oper, put it, “For engineers, it’s all about the cool hack.” And Torvalds
    is the master of the cool hack. He has created a living, thriving community out
    of the cool hack.


    In a live online chat on the television channel MSNBC, a Linux user asked Torvalds
    if he had ever ever tried to figure out how much money he could have made from
    licensing Linux. Torvalds responded, “I haven’t even tried. I know how much fun
    I’ve had.”


