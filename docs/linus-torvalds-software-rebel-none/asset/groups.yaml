    # 想要编写一个突破性的计算机操作系统吗？


    你可能需要：


    - 一整年不吃糖果

    - 选择一只企鹅作为你的产品标志

    - 将你的程序发布在互联网上，让其他程序员可以免费使用


    听起来像又一个程序员吗？林纳斯·托瓦兹了自己的操作系统——有些人说这个系统比 MS-DOS 更好、更强大。他的系统 Linux 对任何想要使用它的人都是免费。Linux
    是一种全新的编程哲学的成果，它让作者成为了一个真正的崇拜人物。


