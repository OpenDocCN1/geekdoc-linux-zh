    Sendmail 是一款最初由 Eric Allman 创建的免费软件程序，负责了网上传输的 80% 以上邮件的路由。FreeBSD 和 NetBSD 与
    Linux 一样，都是基于 Unix 的免费操作系统，尽管与 Linux 不同，它们没有维持同样的集中心化控制。


    Netscape 这家凭借其 Navigator 浏览器普及互联网的公司，深受埃里克·雷蒙德（Eric Raymond）在《大教堂与大集市》（The Cathedral
    and the Bazaar）中所提出的论点的影响，以至于他们在 1999 年 3 月发布了浏览器的源代码。世界各地涌入了修复和适配，其中包括一组澳大利亚程序员提供的一个功能（在
    Netscape 发布代码后的几个小时内完成），该功能实现了 Web 上的安全交易。在一个月内，Netscape 就推出了新版本的 Navigator 供用户下载。


    免费软件的进展是如此惊人地快速且高效，以至于很难任何个人甚至公司能够与之相拟。上述的澳大利亚人没有报酬，但他们赢得了全球编程社区的关注和尊重。


    正如记者 Josh McHugh 在《福布斯》杂志的封面故事中所写：“解放的软件已成为一场智力奥林匹克运动，世界上一些顶尖的工程大脑在其中竞争——不是为了风险投资，而是为了给同伴留下深刻印象。”


    尽管托瓦尔斯（Torvalds）是开源运动极其强大且有效的倡导者，但他并不认为自己是一个主义者。与自由软件基金会的支持者不同，他也不认为自己具有政治色彩。对他对他来说，这并不关乎做一件好事，尽管这是一个非常令人愉悦的结果。在他看来，开源是制作伟大软件的最佳、最快、最务实的方法。他的首要目标不是让软件免费，而是让软件卓越。而在他看来，要做到卓越，它必须免费。


    随着开源运动在效率和流行程度上的飞速发展，你不禁怀疑它是否开始让那些闭源软件巨头感到有些紧张。


    ## 第四章


    ## 黄金时代


    ## 红帽与 Caldera 为 Linux 的企业应用提供了合法性


    无论他们是否愿意，Linux 反叛军们正迅速获得企业界的合法性。总部位于北罗来纳州达纳姆的红帽（Red Hat）由一个名叫 Marc Ewing 的人创立，旨在为
    Linux 提供更简单、更友好的访问方式。他知道 Linux 无法提供足以在商业和桌面市场立稳脚跟的类型包装和客户支持。大型企业


    ![](img/0c2204037b7580f6d0abcab13a83061d_53_0.png)


    红帽软件（一家提供 Linux服务的公司）担心 Linux 的原因与许多技术人员热爱它的原因相同——没有人拥有它。因为没有人拥有它，企业假设如果 Linux
    停止工作，他们将无处可去——没有人能帮助他们重新运行，没有人可以起诉，也没有人可以被扣款。


    Ewing 创立红帽是为了提供这些服务，包括说明手册和电话支持。个人用户通常希望拥有比 Linux 原始下载版本更精细的桌面和更简单的界面，红帽也提供了这些。只需大约
    50 美元，红帽将为你提供一张 CD，提供易于安装的 Linux（这一过程在其他情况下是著名的棘手），以及几个针对桌面使用的设计的实用程序。


    许多老兵对红帽试图兜售某种任何人都可以免费获得的东西的明智表示怀疑，但少数大巨头认为 Ewing 做出了一个非常高明的举措。对红帽的大量投资来自巨型芯片制造商
    Intel 和 Netscape。红帽在某些方面保持了 Linux 的精神——它添加到 Linux 中的任何代码，都按照开源规则发布。在其他方面他们并没有这样做——他们想要并需要赚钱。而且是很多，而且红帽现在是股市上的一上市公司，价值数十亿美元。


    Caldera Systems 是另一家分发 Linux 并提供企业培训和支持的公司。与红帽一样，他们明确表示自己不对知识产权收费。他们是为支持知识产权的服务收费。


    托瓦尔斯对对此何看？


    “商业供应商是好的，是的。他们都使用标准内核，所以从技术上讲，没什么好担心的。他们倾向于对 Linux 系统进行不同的定位，以针对不同的市场。即使我想做，也做不到，而且我不想做，”他说，“在想要让安装变得简单的商业人士与想要在技术上做正确事情的技术人员之间存在着这样的协同效应，以至于我不再担心了。……我看不出我们怎么会输。”


    红帽和 Caldera 等商业供应商为 Linux 在市场中提供了巨大的推动。现在，IBM、Dell Computer、Corel Computer 和 VA
    Research 等硬件供应商正在提供预装 Linux 的计算机。


    ![](img/0c2204037b7580f6d0abcab13a83061d_56_0.png)


    开发者已为手持设备 PalmPilot 适配了一个版本的 Linux。


    越来越多，电脑购买者将会有选择——他们不会被强制购买预装微软系统的 PC；他们能够选择 Linux。像 Oracle 和 Sun Microsystems
    这样巨大的科技公司正在编写它们的软件版本以在 Linux 上运行。在微软经历了近二十年的垄断后，这对托瓦尔斯和他编写代码的伙伴们来说以及对几乎每一个开源支持者来说，都是梦想成真。现在，应用程序也将选择它们想要运行的操作系统，而
    Linux 将是选项之一。一个 Linux 版本已被移植到手持设备 PalmPilot 上。甚至像 Quake 和 Doom 等世界上最流行的几个游戏也被移植到了
    Linux。现在，美国企业正在转向 Linux。电影制片人詹姆斯·卡梅隆所有的特效公司 Digital Domain 选择 Linux 来运行他们为《泰坦尼克号》创作特效的计算机。


    电子文档检索公司 Archive Retrieval 为华盛顿州梅迪纳市（Medina）在运行 Linux 的计算机上安装了一个系统。总裁 Ray A. Jones
    记得当梅迪纳的新系统出现一个漏洞时的情况。“我们在网上问了一个问题，在几个小时内我们就得到了答案，”他说，“我用三行代码修复了它。如果是商业产品，我得等微软来修复——如果他们真的修的话。这样一来，整个
    Linux 社区都受益了。”讽刺的是，梅迪纳市采用该系统部分是因为比尔·盖茨建造的豪宅塞满了文件。里奇（Ridge）也使用 Linux。NASA 使用 Linux
    作为计算机集群的基础，该集群是全球五大快速计算机系统之一，并节省了同等速度超级计算机 90% 的成本。洛斯阿拉莫斯国家实验室的研究人员将 68 台运行 Linux
    的计算机连接作为单台超级计算机，达到了


    ![](img/0c2204037b7580f6d0abcab13a83061d_59_0.png)


    Linux 帮助 NASA 开发了世界上最快的计算机系统之一。


    每秒 190 亿次计算。这使其位居世界第 315 位。它已经运行了三个月，没有重启过。橡树国家实验室也使用 Linux。


    Linux 无疑已成为计算机世界中的一个合法参与者。其使用量估计每年增长 40%。它快速、强大、灵活且免费。这让我们产生了一个问题 . . .


