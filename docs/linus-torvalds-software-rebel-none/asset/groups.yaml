    # 第三章


    # 喧杂的集市


    # Linux 开发是如何运作的


    在《纽约时报杂志》的一篇文章中，作家艾米·哈蒙（Amy Harmon）描述了 Linux 涯中一个典型的时刻。来自德国埃兰根的25 岁的马库斯·迈斯纳（Marcus
    Meissner）在操作家用电脑时程序崩溃了。于是，他向更大的 Linux 社区发送了一封邮件。片刻之后，他收到了一位住在匈牙利布佩斯、26 岁的用户 Mingo
    提供的修复建议。不久后，保加利亚人佩特汗（Petkhan）又发送了另一个补丁。


    ![](img/0c2204037b7580f6d0abcab13a83061d_41_0.png)


    Linus 鼓励 Linux 用户提供反馈。


    哈蒙写道：“重点不仅在于修复程序，还在于找到修复程序最优雅的方法。当然，大家都知道托瓦尔斯这个自我旋转网中心的 . . . 蜘蛛……”这正是 Linux 的运作方式。用户在工作或娱乐过程中让
    Linux 经受考验，当 Bug 出现时，他们协作将其修复 . . . 快速。在许多情况下，Linux 的改进不仅来自用户的调试，还来自用户将其适配到其他用途——例如，其他类型的微处理器，或新的硬件设备（如用于语音识别的设备）。随着技术的进步，托瓦尔斯和他的共同开发者寻求抓住每一个让
    Linux 变得更有用、更高效、更前沿的机会。


    如果你想参与 Linux，可以做什么呢？使用它。当新的 Linux 用户询问托瓦尔斯他们应该做些什么时（他们每年会问几百次），托瓦尔斯告诉他们去使用 Linux，等他们知道答案后再回来。“尽管用这个系统吧，你会因为想做而进行
    Linux 开发的。”


    托瓦尔斯每天大约花费八到十小时回复邮件、筛选建议的补丁，并亲自编写一些代码。尽管他现在只编写一小部分代码，但他解释道：“我是那个对所有领域的情况拥有全局视野的人。”他并不一定管理系统的每一个部分。在他之下是第二层程序员，他们负责管理子系统，并向他发送经过审核和清理的补丁。


    作为一个真正的务实者，托瓦尔斯不喜欢为 Linux 设定长期目标，而是希望对新的技术发展保持开放。“我打算对市场做出反应，看看开发者想做什么。”


    Linux 会增长到托瓦尔斯可能无法控制的范围之外吗？托瓦尔斯说不会。与软件大师们不同，托瓦尔斯对营销、分发、服务或客户支持感兴趣。他不对这些巨型工作承担责任。他认为，如果他和他的程序员同事们能够提供一个优秀、稳定且不断改进的操作系统，他们就完成了任务。剩下的部分可以自行处理。“技术压力的好处是，技术问题总有完美的答案——只有非技术问题有时完全没有答案。”


    所以，托瓦尔斯只关注 Linux 的技术开发。因此，他感激那些盈利的商业活动涌入，填补了他无法且不愿填补的需求。这意味着公司正在销售 Linux 并从中获利吗？是的。我们稍后会讨论这一点。


    # 为什么 Linux 开发是有效的


    在篇名为《大教堂与集市》（The Cathedral and the Bazaar）的极具影响力的文中，程序员兼开源代码传教士埃里克·雷蒙德（Eric Raymond）试图解释
    Linux 现象背后奇特而神奇的心理学。Linux 没有雇用任何人，不付任何工资，也不向任何人收费。它没有正式组织，没有传统的分发，没有广告，也没有营销。然而，它的程序员被广泛认为是该领域的顶尖水平，其适应性和可靠性几乎不受挑战，而且改进速度迄今为止是最好的。


    在文中，雷蒙德解释了 Linux 的出现如何完全改变了他对优秀软件创作的认知。在 Linux 出现之前，雷蒙德是开源开发的坚定支持者，但他写道：“我认为最重要的软件
    . . . 需要像大教堂一样被建造，由个人巫师或在华丽孤立中工作的少数几个魔法法师精心打造。”他认为程序员需要工作、磨练和重新制作，直到他们能够发布出真正优秀的东西。


    “林斯·托瓦尔斯的开发风格——早期且频繁地发布、尽可能委派一切、开放到近乎放荡的地步——令我感到惊讶，”雷蒙德写道，“这里没有宁静、虔诚的大教堂建设——相反，Linux
    社区似乎像一个由不同议程和方法组成的巨大喧杂集市……一个连贯且稳定的系统似乎只能通过一系列奇迹才能出现。”


    但 Linux 这种风格*生效了*。雷蒙德发现这一点不可否认。“Linux 世界不仅没有在混乱中分崩，反而似乎以一种大教堂建造者难以想象的速度不断壮大。”


    为什么？


    Linux 程序员，像托瓦尔斯本人一样，是一群自选的人，他们这样做没有其他原因，仅仅是因为他们想。雷蒙德认为，对于他们来说，用最优雅的方法解决他们遇到的特定问题在智力上是刺激的。帮助创造这种对他们个人有用、对所有人免费且被数百万人使用的工具是令人欣慰的。与如此技术熟练度和技能的同行合作，在职业上是令人兴奋的。他们在
    Linux 上的工作往往与许多程序员日常度过一天形成鲜明对比。“雷蒙德写道，“软件开发者经常花费一天为了薪水在他们既不需要也不喜欢的程序上苦苦工作。”


    由于 Linux 开发者也是 Linux 用户，他们天生对程序非常熟悉，并有动力让它运行良好。托瓦尔斯让他的开发团队保持忙碌投入。


    雷蒙德认为将是 Linux 的必要前提条件。否则，托瓦尔斯如何能同时与全球成千上万名代码作者交流，除了 Linux 之外，他与他们没有任何地理、个人或职业联系？“Linux
    是第一个有意识并成功利用整个世界作为其人才库的项目。我不认为 Linux 的孵化期与万维网的诞生相合是巧合……Linux 是第一个学会根据普及的互联网访问所可能的新规则玩游戏的人。”


    最后，雷蒙德给出了可能是 Linux 流程有效的最关键的原因：“我们在做自己的事时很快乐，”雷蒙德解释道，“我们的创造性游戏正以惊人的速度在技术、市场份额和心智份额上取得成功。我们不仅证明了我们可以做出更好的软件，还证明了快乐也是资产。”


    托瓦尔斯由表赞同。“最重要的设计问题 . . . 是 Linux 应该是好玩的。”


    # 更宏大的免费软件运动


    尽管 Linux 可能是最知名、最推崇的开源系统，但它绝不是唯一的。例如，Apache 互联网上最常用的应用程序，运行着超过一半的网站，包括 Yahoo!
    等大站。Apache 是由八位对服务器软件有共同兴趣的程序员开发的免费软件应用程序。他们从交流想法、挑战和解决方案开始。他们最初将自己的软件称为“一个补丁的服务器”（A
    Patchy Server），开玩笑地指的是其即时开发风格，但后来为了尊重美原住民部落，将其重命名为 Apache。现在甚至计算机巨头 IBM 也采用了 Apache
    软件，尽管 IBM 法律部门发现没有人可以向他们支付许可费而感到困惑。作为使用该软件的回报，松散组织的 Apache 仅要求他们的软件被非排他性地使用——源代码必须对任何想要它的人开放。


