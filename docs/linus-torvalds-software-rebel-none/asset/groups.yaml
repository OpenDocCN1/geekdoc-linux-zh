    # CHAPTER THREE


    # The Babbling Bazaar


    # How Linux Development Works


    IN AN ARTICLE FOR THE NEW YORK TIMES MAGAZINE, WRITER AMY HARMON DESCRIBED A QUINTESSENTIAL
    MOMENT IN THE LIFE OF LINUX. MARCUS MEISSNER, AGE TWENTY-FIVE, OF ELANGEN, GERMANY,
    WAS WORKING ON HIS HOME COMPUTER WHEN IT CRASHED. SO HE SENT OUT AN E-MAIL TO
    THE LARGER LINUX COMMUNITY. MOMENTS LATER HE GOT A PROPOSED FIX FROM A USER KNOWN
    AS MINGO, TWENTY-SIX, LIVING IN BUDAPEST, HUNGARY. SOON AFTER, PETKHAN, A BULGARIAN,
    SENT OVER ANOTHER PATCH. AS


    ![](img/0c2204037b7580f6d0abcab13a83061d_41_0.png)


    Linus encourages feedback from Linux users.


    Harmon writes, "The point was not simply to mend the program, but also to find
    the most elegant way of doing so. Of course everyone knew that Torvalds, the .
    . . spider at the center of this self-spinning web


    That’s exactly how Linux works. Users put Linux through its paces in the course
    of their work or play, and when bugs turn up, they collaborate to fix them . .
    . quickly. In many cases, improvements to Linux come not just from debugging from
    users adapting it to other uses—other kinds of microprocessors, for example, or
    new hardware devices, such as those used for voice recognition. As technology
    improves, Torvalds and his codevelopers seek to respond to each opportunity for
    Linux to become more useful, more efficient, and more cutting-edge.


    What can you do if you want to get involved with Linux? Use it. When new Linux
    users ask Torvalds what they should work on, as they do hundreds of times a year,
    Torvalds tells them to use Linux and come back when they know the answer. “Just
    use the system, and you’ll do Linux development because you want to.”


    Torvalds spends roughly eight to ten hours a day responding to e-mails, sorting
    through proposed patches, and writing some code himself. Though he writes a small
    fraction of the code now, he explains, “I’m the person with the global overview
    of what’s going on in all the areas.” He does not necessarily manage every part
    of the system. Under him is a second level of programmers who manage subsystems
    and send him patches that have already been vetted and cleaned up.


    A true pragmatist, Torvalds does not like to set long-term goals for Linux but
    rather wants to remain open to new technological developments. “I intend to react
    to the marketplace and see what developers want to do.”


    Will Linux grow beyond a place that Torvalds can possibly control? Torvalds says
    no. Unlike software masterminds, Torvalds is not interested in marketing, distribution,
    service, or customer support. He takes no responsibility for those massive efforts.
    He believes that if he and his fellow programmers can offer an excellent, stable,
    and ever-improving operating system, then they have done their job. The rest can
    take care of itself. “The good thing with technical pressures is that technical
    questions always have a good answer—it’s only nontechnical questions that sometimes
    don’t have an answer at all.


    So Torvalds is concerned with the technical development of Linux and that alone.
    Therefore, he is grateful that money-making commercial ventures have swooped in
    to fill the needs he cannot and does not wish to fill. Does that mean companies
    are selling and profiting from Linux? Yes. We’ll get to that in a minute.


    # Why Linux Development Works


    In his enormously influential essay called The Cathedral and the Bazaar, programmer
    and open-source-code evangelist Eric Raymond tries to explain the strange and
    amazing psychology behind the Linux phenomenon. Linux employs no one, pays no
    one, and charges no one. It has no formal organization, no traditional distribution,
    no advertising, and no marketing. And yet its programmers are widely considered
    the best in the field, its adaptability and reliability are virtually unchallenged,
    and its rate of improvement is by far and away the best there is.


    In his essay Raymond explains how the advent of Linux completely changed his notion
    of how really excellent software is created. Before Linux, Raymond was a devoted
    proponent of open-source development, but, he writes, “I believed that most important
    software . . . needed to be built like cathedrals, carefully crafted by individual
    wizards or small bands of mages [magicians] working in splendid isolation.” He
    believed programmers needed to work and hone and rework until they could release
    something truly fine.


    “Linus Torvalds’ style of development—release early and often, delegate everything
    you can, be open to the point of promiscuity—came as a surprise,” Raymond writes.
    “No quiet, reverent cathedral building here—rather the Linux community seemed
    to resemble a great babbling bazaar of differing agendas and approaches . . .
    out of which a coherent and stable system could seemingly emerge only by a succession
    of miracles.”


    But the Linux style *worked*. Raymond found that undeniable. “The Linux world
    not only didn’t fly apart in confusion but seemed to go from strength to strength
    at a speed barely imaginable to cathedral builders.”


    Why?


    Linux programmers, like Torvalds himself, are a self-selected group of people
    doing it for no other reason than they want to. For them, Raymond posits, it is
    intellectually stimulating to solve the specific problems they encounter in the
    most elegant way possible. It is gratifying to help create this instrument that
    is useful to them personally, free to all, and used by millions. It is professionally
    thrilling to collaborate with peers at such a high level of technical fluency
    and skill. Their work on Linux often makes a stark contrast to the way many of
    these programmers spend their days. “Too often,” Raymond writes, “software developers
    spend their days grinding away for pay at programs they neither need nor love.”


    Because Linux developers are also Linux users, they are inherently familiar with
    the program and motivated to make it work well. Torvalds keeps his development
    crew busy and involved.


    Raymond cites the Internet as a necessary precondition for Linux. How else could
    Torvalds be in communication with thousands of code writers across the globe at
    the same time with whom he has no geographical, personal, or professional connection
    other than Linux? “Linux was the first project to make a conscious and successful
    effort to use the entire world as its talent pool. I don’t think it’s a coincidence
    that the gestation period of Linux coincided with the birth of the World Wide
    Web. . . . Linux was the first person who learned how to play by the new rules
    that pervasive Internet access made possible.”


    And finally, Raymond gives what is perhaps the most critical reason why the Linux
    process works: “We have fun doing what we do,” Raymond explains. “Our creative
    play has been racking up technical, market-share, and mind-share successes at
    an astounding rate. We’re proving not only that we can do better software, but
    that joy is an asset.”


    Torvalds heartily agrees. “The most important design issue . . . is that Linux
    is supposed to be fun.”


    # The Larger Freeware Movement


    Although Linux is probably the most famous and celebrated open-source system,
    it is certainly not the only one. Apache, for example, is probably the most used
    application on the Internet, running over half of all web sites, including the
    big ones such as Yahoo! Apache is a freeware application developed by eight programmers
    with a common interest in server software. They began by passing around ideas,
    challenges, and solutions. They initially dubbed their software “A Patchy Server,”
    jokingly referring to its ad hoc development style, but later renamed it Apache
    out of deference to the Native American tribe. Now even computer giant IBM has
    adopted Apache software, although the IBM legal department was puzzled to discover
    there was no one to whom they could pay a licensing fee. In return for use of
    the software, the loosely organized Apache Group requires only that their software
    be used nonexclusively—that the source code be available to anyone who wants it.

