- img_proc: true
  md: '# The Information Age


    In 1976, Bill Gates was a very young, very recent college dropout. He was struggling
    to legitimize his new company—Micro-soft, as it was written then—and was chagrined
    to discover his new software was making the rounds at the Homebrew. Gates did
    not take it lightly. He responded with his angry “Open Letter to Hobbyists.”


    “Most of you steal your software,” Gates accused the Homebrew faithful. “One thing
    you do . . . is prevent good software from being written. Who can afford to do
    professional work for nothing?” To the old-timers it was like Eve crunching on
    the apple, bringing the age of innocence to an end. It introduced a new consciousness
    that ideas were not necessarily to be shared, and they certainly were not free.


    That great blue-chip computer giant, IBM, was the company most famously caught
    off-guard thinking of software the old-fashioned way. They made at least two critical
    oversights that cost them a few hundred billion dollars and helped mint'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'the two richest men in the world—Bill Gates of Microsoft, of course, and Larry
    Ellison of Oracle.


    IBM’s first tough lesson came in 1981 at the hands of Bill Gates. That was the
    year they gave Microsoft the license to provide the operating system—MS-DOS—that
    came on their brand-new personal computers. But they did not require exclusivity
    from Microsoft—in other words, they did not ask that Microsoft not sell that same
    software to anybody else. Microsoft sold the very same software to a flock of
    brand-new IBM competitors, and suddenly IBM had no edge in the


    ![](img/0c2204037b7580f6d0abcab13a83061d_22_0.png)


    Software giant: Larry Ellison of Oracle'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'hardware market. IBM was not the standard, as they had hoped they would be.
    Microsoft was.


    This sent a revelation like a lightning bolt through the computer industry. The
    future was not in hardware; it was in software. Anybody could make a plastic box
    containing the right chip for a few pennies less. Software was the proprietary,
    unique product—the intellectual property. This revelation marked a major milestone
    in what we now call “the information age.” People began to understand the value
    of ideas. They recognized that things you can’t necessarily touch or feel—software,
    music, movies, novels, poems, articles, games—are ultimately more valuable than
    things you can. But intellectual property is notoriously hard to contain. It is
    a lot easier to lay claim to your mountain bike, say, than to your ideas.


    IBM’s second oversight came came in the mid-1980s. Top-level IBM scientists wrote
    and released papers on how to write something called a relational database. A
    relational database is a software system that allows you to sort through a huge
    ocean of information in exactly the way you choose. Say your'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'relational database contains information on every baseball game ever played.
    You can ask it to tell you exactly which nohitters were pitched in Kansas in the
    1970s when the temperature fell below 40°F (4.4°C), and it will (if there were
    any such games). The search engines we use depend on this technology. In fact,
    the relational database, as much as any other technology, has made the Internet
    what it is today. IBM scientists figured out how to write this software, but it
    was Larry Ellison’s company, Oracle, that made billions selling it. Why? Because
    IBM did not even think to keep these ideas secret. They published a virtual blueprint
    for the database in academic papers meant to be part of a larger dialogue among
    computer scientists. You did not own these sorts of ideas. You did not sell them.
    Or so they thought.


    The 1980s and 1990s represent a more cynical time, when aggressive, gargantuan
    companies such as Microsoft came to control the software on more than 85 percent
    of the computers in the world and made it extremely difficult for small companies
    to compete. (So much so that the U.S. government'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'brought a massive lawsuit against Microsoft, claiming that Microsoft competed
    unfairly . . . but that’s another story altogether.)


    And yet the new millennium seems to be witnessing another fundamental shift back
    to the free flow of ideas. In part the shift is due to the Internet. Its instantaneous,
    free distribution of any and all intellectual property makes it very difficult
    to control the flow of information. In fact, some people believe the Internet
    will spell the end of copyright—of legal and practical ownership of ideas. In
    part the shift is due to Linus Torvalds and other idealistic programmers (or simply
    practical ones, as Torvalds would argue), who have reawakened the spirit of free
    software. Now the free software movement is growing and strengthening across the
    globe. Some people even believe the free software movement will topple the software
    giants in time.'
  merge: -1
