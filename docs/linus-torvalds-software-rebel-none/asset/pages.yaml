  md: 'According to his father, Nils Torvalds, his son’s strong and independent mind
    was well apparent by the time he was eight years old. “On Christmas, I gave him
    a fairly complicated model ship and thought that we in a father-and-son-together


    ![](img/0c2204037b7580f6d0abcab13a83061d_16_0.png)


