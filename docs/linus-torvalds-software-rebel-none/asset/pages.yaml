    “I like the weather lot. . . . I don’t remember the last time I couldn’t walk
    around in shorts all day.” He also finds the level of high-tech activity in the
    legendary Silicon Valley stimulating. “While Finland was very high-tech, Finnish
    companies tend to be very traditional and'
