  md: '# CHAPTER TWO


    # The Birth of Linux


    # How It Started


    WHEN Linus Torvalds WAS IN HIS SECOND YEAR AT HELSINKI UNIVERSITY IN 1990, HE
    DECIDED TO BUY A NEW COMPUTER. ALTHOUGH HE’D GEN HIS START ON HIS GRANDFATHER’S
    COMMODORE AT HOME, HE’D SPENT TIME AT THE UNIVERSITY WORKING ON MAINFRAME COMPUTERS
    RUNNING AN OPERATING SYSTEM CALLED UNIX. AN OPERATING SYSTEM (OS) IS LIKE THE
    CENTRAL NERVOUS SYSTEM OF THE COMPUTER. IT COMMUNICATES BETWEEN THE HARDWARE AND
    THE SOFTWARE APPLICATIONS AND CREATES THE COMPUTING


    ![](img/0c2204037b7580f6d0abcab13a83061d_26_0.png)'
  merge: -1
