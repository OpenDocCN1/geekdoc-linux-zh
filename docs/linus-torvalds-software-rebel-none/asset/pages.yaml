  md: 'The Linux troops decided they needed a logo, so the choice was given to Torvalds.
    He chose a penguin. Why? “Partly accident, partly because I like penguins,” he
    explains. “Partly because I was bitten by a penguin. It was at an open zoo. I
    made my finger look like a herring—and the penguin fell for it. It was a very,
    very timid bite.” Some of the Linux faithful complained the logo was not serious
    or high-tech enough, but Torvalds disagrees. “I’m much happier being associated
    with a fun and slightly irreverent logo than with something static and boring.”


    # Yes, Linux Is Free, But Is It Good?


    On the whole, Linux has been adopted by a more technologically sophisticated group
    of users than Windows or Macintosh. Linux is not as user-friendly as those platforms
    (not yet, anyways), and it does not have the large and complex overlays to make
    the computing experience virtually technically transparent to the common user.
    Furthermore, Linux does not offer'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'nearly the array of polished applications that Windows does.


    And yet Linux users say it is a far more stable, reliable system than Windows
    or Mac. Linux fans share stories of Linux-powered computers running for months
    and even years without crashing or needing to be rebooted. Linux is far more compact,
    less bloated than Windows, so it runs faster and requires a less powerful microprocessor.


    And if your Linux system reveals a bug, you or any hacker* you know could conceivably
    fix it then and there, unlike a Microsoft system, for which you often need to
    wait days or weeks for a Microsoft employee to fix it for you. Computer users
    praise the robust stability of Linux, but they also praise the fact that you can
    make the program do exactly what you need it to do. If you have a quirky piece
    of hardware, you can customize Linux to made it work within your system


    > *Although among the civilian population the term hacker has a negative connotation—to
    conjure images of virus-writing, troubleshooting, Pentagon-busting criminals—the
    word hacker is actually morally neutral. Used here and in the broad techie community,
    hacker simply means a programmer. To hack is to write computer code—any code,
    not just the kind that causes trouble. If anything, hacker is used among techies
    as a term of respect.'
