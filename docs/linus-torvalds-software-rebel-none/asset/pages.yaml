- img_proc: true
  md: '[after the bet was completed], he took the money and bought sweets for the
    whole sum.


    It is that very combination of dedication and pragmatism that has put him at the
    center of a great technological upheaval: the open-source code movement.


    # The Good Old Days of Free Software


    Torvalds was not the first computer programmer to feel that software should not
    be owned or controlled, that it should be available freely to everybody. In fact,
    up until the 1980s, nobody really thought of software as something to sell on
    a grand scale at all. It was not so much idealism that made software free back
    then. Programmers did not have the sense they were giving away anything of great
    potential value. Hardware—the stuff you could touch, type on, see—that was considered
    the real product. That’s what engineers and businesspeople believed you made money
    on. Software was'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'sort of a necessary evil to make your hardware useful.


    In many ways, this was a more idealistic and innocent time,


    ![](img/0c2204037b7580f6d0abcab13a83061d_19_0.png)


    Microsoft offices in Redmond, Washington.


    The company kick-started the software revolution.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'before people thought to control software and make a bundle on it. A great
    number of computer scientists and programmers look back on this time with longing.
    There was an open, scholarly atmosphere of experimentation and risk-taking among
    the early computer professionals and hobbyists. They represented a small, presient
    minority, and to a large degree they stuck together to support their fledgling
    technology.


    The early personal-computer hobbyists habitually copied and passed around software
    without much thought to copyrights and licenses. The now-famous Homebrew Computer
    Club in Menlo Park, California, stands as the epitome of that old spirit. (Among
    its faithful were Steve Wozniak and Steve Jobs, founders of Apple Computers, as
    well as many other computer visionaries.) The Homebrew was the premier place for
    obtaining or sharing any piece of software making the rounds. And ironically,
    it was there that many people claim the age of free software officially came to
    an end.'
