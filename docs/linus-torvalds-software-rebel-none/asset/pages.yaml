    In the fall of 1991, at the age of twenty-one, he put his operating system, Linux
    (pronounced LINN-ucks) version 0.01, on the Internet and told some people about
    it. He not only released the system itself; he also released what is called the
    source code—the underlying instructions used to create the software. Seeing the
    source code allows other programmers to access exactly how the writer did what
    he did. This kind of open or accessible source code also allows people other than
    the original writer to fix the software, to alter it to suit their own needs,
    or even to distribute it to other users and programmers. This is why Linux is
    called an open-source code system, as opposed to Windows or other proprietary
    software, in which the source code is closed or hidden—'
