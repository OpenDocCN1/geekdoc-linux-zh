  md: 'way would build it. The following morning, he had already made it all by himself,”
    his father recounted.


    Torvalds became fascinated by computers at the age of ten. “What else are you
    going to do in Finland if you hate ice hockey?” jokes. His grandfather, Leo Toerngvist,
    a professor of statistics at the University of Helsinki, brought home one of the
    very early personal computers, a Commodore VIC-20, and encouraged Torvalds to
    use it. “I started programming because you had to make it work,” Torvalds remembers.
    Within a short time, young Torvalds was writing his own computer games.


    From that point on, programming became his passion and obsession. Although his
    father tried to get him interested in sports, it did not work. “I was never very
    good,” Torvalds says now.


    As a child, he was disciplined and single-minded, but not dogmatic. “He once said
    that he won’t eat sweets,” his father recounted. “I promised him one hundred Finnish
    marks if he kept that promise for a year. He did, but the following day'
