  md: '# The Larger Freeware Movement


    Although Linux is probably the most famous and most celebrated open-source system,
    it is certainly not the only one. Apache, for example, is probably the most used
    application on the Internet, running over half of all web sites, including the
    big ones such as Yahoo! Apache is a freeware application developed by eight programmers
    with a common interest in server software. They began by passing around ideas,
    challenges, and solutions. They initially dubbed their software “A Patchy Server,”
    jokingly referring to its ad hoc development style, but later renamed it Apache
    out of deference to the Native American tribe. Now even computer giant IBM has
    adopted Apache software, although the IBM legal department was puzzled to discover
    there was no one to whom they could pay a licensing fee. In return for use of
    the software, the loosely organized Apache Group requires only that their software
    be used nonexclusively—that the source code be available to anyone who wants it.'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'Sendmail, a freeware program originally created by Eric Allman, is responsible
    for routing more than 80 percent of the mail sent over the Internet. FreeBSD and
    NetBSD are, like Linux, free Unix-based operating systems, although unlike Linux,
    they have not maintained the same centralized control.


    Netscape, the company that popularized the Internet with its Navigator browser,
    was so swayed by the arguments put forth by Eric Raymond in The Cathedral and
    the Bazaar that they released the browser’s source code in March 1999. Fixes and
    adaptations came in from around the world, including a feature provided by a group
    of Australian programmers (with a few hours of Netscape releasing the code) that
    enabled secure transactions over the web. Within a month, Netscape had a new version
    of Navigator, ready to be downloaded.


    The progress of freeware is so stunning fast and effective, it is hard to imagine
    any individual or even corporation being able to match it. The Australians, mentioned
    above, did not get paid, but they commanded the attention and the respect of the
    worldwide programming community.'
  merge: -1
