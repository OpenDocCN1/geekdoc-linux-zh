- img_proc: true
  md: 'environment. Software applications—games, word-processing systems, spreadsheets,
    browsers—run on top of a computer’s operating system.


    Torvalds liked the personal computers running Intel’s widely used 386 chip, but
    all of them came with Microsoft’s operating system. “I knew I didn’t want DOS,”
    Torvalds explained. “I’d seen DOS.” He wanted to buy a version of Unix, but it
    was far too expensive, and it was not made to run on a PC.


    So what did he do? “I decided to make my own Unix,” Torvalds explained. “What
    do I need? I need lots of ignorance, because if you know too much, you know that
    it’s obviously impossible. Then you need the arrogance—yes, I can do it, and I
    can do it better than anybody else.” Those two you need just to get started .
    . . you need to be a bit crazy and actually go with it.


    At first he wanted to write enough software to enable his computer to do the basic
    tasks he needed. He began by writing code to allow the various pieces of hardware—'
