  md: '# CHAPTER ONE


    # Changing the Future


    # The Most Famous Computer Programmer in the World


    WHO IS THE MOST FAMOUS COMPUTER PROGRAMMER IN THE WORLD?


    BILL GATES, YOU MIGHT ANSWER, AND YOU WOULD BE PARTLY RIGHT. BUT ALOUGH GATES
    STARTED HIS CAREER AS A PROGRAMMER, HE ACHIEVED FAME AND FORTUNE AS A BUSINESSMAN
    AND A MARKETER—NOT A TECHNICIAN.


    WHO IS THE MOST FAMOUS COMPUTER PROGRAMMER IN THE WORLD?'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'If you put this question to a techie crowd, chances are you would get one single
    resounding answer: Linus Torvalds. He has more listings on the World Wide Web
    than Steve Jobs, Bill Gates, Larry Ellison, and even Tom Cruise.


    Linus who?


    Okay, so he is not a household name. He is not a multibillionaire. He does not
    own a jet. He has never brought a company public in a soaring initial public offering
    (IPO) like many of the techies you have probably heard of.


    But that is what makes Linus Torvalds so special. He is often called the anti–Bill
    Gates. He has not made any money from his software, although he has practically
    created a revolution. He wrote an operating system called Linux, a widely admired
    platform that competes with Windows. And this is the amazing part: He gives it
    away for free. Yes, free. You and anyone else on the planet with a computer, a
    modem, and a decent amount of space on your hard drive can download it from the
    Internet.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'You may not have heard of him, but you can bet that Bill Gates has. Torvalds
    is not making any money from Linux, but he is changing the way software is written,
    updated, and


    ![](img/0c2204037b7580f6d0abcab13a83061d_12_0.png)


    Linus Torvalds proudly holds a license plate bearing the “Linux” name.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'distributed. And he is making a lot of people wonder why they should pay for
    Windows or any other expensive system when they can get Linux for nothing.


    Even more important, Torvalds has been instrumental in creating a thriving community.
    He has invited every Linux user and programmer to help him write the code and
    eradicate the bugs to make Linux better. Linux is the brainchild of one great
    programmer, but it is the product of millions.


    So, although Linux Torvalds may not be a household name . . . yet . . . he has
    made software free, he has made it inclusive, he has made it adaptable, and while
    he was at it, he changed the future of computing.


    # A Strong and Independent Mind


