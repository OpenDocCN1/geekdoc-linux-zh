    ```bash

    $ at 9:30am Mar 29

    echo “Meeting at 10” | mail frank

    <Ctrl-d>

    ```


    ## 1.161. 用户如何执行一个长命令并让终端保持可用工作？


    用户可以使用 `&` 命令在后台执行该长命令，如下：


    ```bash

    $ wc -c hugefil > wordcount &

    ```


    ## 1.162. 一旦后台命令启动，可以像其他前台命令一样中止它吗？


    如果 shell 具有作业控制功能，命令 `fg` 将把后台进程带到前台，在那里中断键（Control-C）将将其杀死（除非安装了信号处理程序）。否则，后台命令无法通过中断键中止；相反，你必须使用
    `kill` 命令。shell 在启动后台进程时会打印一个数字。该数字是后台进程的进程 ID (PID)，并将提供给 `kill` 命令以终止进程。例如，`kill
    123` 将发送默认的 kill 信号（`SIGINT`）。程序可能已配置为忽略 `SIGINT`，在这种情况下，可以使用信号级 9（`SIGKILL`）强制终止进程，如
    `kill -9 123`。


    ## 1.163. 什么是文件系统？


    文件系统是操作系统的一个独立分区，由文件、目录以及定位这些文件所需的信息组成。文件系统可以被看作构建目录和文件的结构。


    ## 1.164. 如果你有一个目录 /tmp，并且在该目录上挂载一个如 /dev/u 的文件系统，会发生什么？


    如果在挂载文件系统之前 `/tmp` 目录下存在任何文件，它们将会消失，并在卸载文件系统重新出现。


    ## 1.165. 系统管理员是否可以允许用户挂载文件系统？


    通常情况下，只有超级用户可以挂载或卸载文件系统。某些供应商提供专有的 UNIX 扩展来授予非根用户这种能力，但一种在不同 UNIX 版本间具有良好可移植性的方法是使用
    `sudo` 软件包。非根用户可能需要这些权限来挂载 CD-ROM 或软盘。


    ## 1.166. 目录拥有执行权限是有意义的吗？


    是的有意义。如果一个目录没有执行权限，你就无法对它执行 `cd` 命令。


    ## 1.167. 默认情况下，新创建文件的 GID（组标识符）被设置为创建该进程或用户的 GID。如何更改这种行为？


    可以通过在 във目录上设置 `SGID` 位来更改这种行为，从而使新文件具有该目录的 GID。


    ## 1.168. 文件之间的链接是什么？你用于链接文件的命令是什么？


    链接是引用 inode 的目录条目。同一个 inode（文件）可以有多个链接。对文件进行的任何更改在实际上都与该文件所属的名称相互独立。在最后一个链接被删除之前，文件不会被删除。创建链接的命令是
    `ln`。


    ## 1.169. 链接有哪两种类型？


    硬链接会增加文件的链接计数，且无法跨越文件系统边界；软链接（符号链接）可以跨越文件系统但不会增加链接计数。


    ## 1.170. 哪种类型的链接消耗 inode，哪种不消耗？


    软链接始终消耗一个 inode，但次级硬链接不会。文件系统中的每个物理文件无论硬链接的数量多少，都只一个一个 inode。软链接由于可能在单独的文件系统上，因此无法包含
    inode 信息，它必须消耗一个 inode。


    ## 1.171. 定位文件最常见的方法是什么？


    最常见的方法是使用 `find` 命令，它允许你查找具有特定名称、权限设置、大小、类型、所有者或最后访问或修改日期的所有文件。`locate` 和 `whereis`
    命令在许多 UNIX 版本中也很，可能有用。


    ## 1.172. 如何在文件中搜索某个单词或短语的出现情况？


    `grep` 命令显示文件中所有包含关键词或短语的行。将搜索模式括在单引号中是一个良好的习惯，以保护其免受 shell 中命令替换的影响。


    ## 1.173. 如何列出所有包含特定模式的子目录中的所有文件名？


    你可以使用两个命令的组合：


    ```bash

    find . -exec grep -1 “pattern” {} \;

    ```


    ## 1.174. 假设你有一个大文件并想清空它，但又想保留它的权限，你可以做什么？


    对于 Bourne 系列的 shell：


    ```bash

    $ /dev/null > filename

    ```


    对于 C shell：


    ```bash

    $ cat /dev/null > filename

    ```


    ## 1.175. 假设该目录变得太大（条目过多），且你决定将其拆分为两个目录（其中一个保留原名），你将如何操作？


    在某些 UNIX 实现中，目录即使删除了所有文件也永远不会缩小。因此，你应该创建两个新目录，将所有文件移动到它们，删除旧目录，然后使用旧目录的名字重命名其中一个新目录。


    ## 1.176. 文件系统中 lost+found 目录的目的是什么？


    在执行 `fsck`（文件系统检查）命令期间，任何未被引用但有效的文件都会放在这个名为 `lost+found` 的特殊目录下。取决于文件系统的实现，`fsck`
    命令不会创建或扩展此目录；因此，它必须包含足够的用于重新连接文件的空位。


    ## 1.177. 列出三种用于存档或设备间传输的命令。


    最常用的三个是 `tar`、`cpio` 和 `dd`。如果你要创建一个脚本来备份系统，你会如何编写？脚本如下：


    ```bash

    cd /

    find . -follow -print ! cpio -ovaBL > /dev/rmt0 2> /u/list

    ```


    在此文件中可以获取备份的文件列表。否则，你可以使用另一种方法：


    ```bash

    tar cvf /dev/rct2 .

    ```


    如果你使用的是 GNU `tar`，可以使用 `cvzf` 选项启用压缩（但 `cpio` 在恢复故障磁带方面更好）。这些脚本应该具有 root 权限。


    ## 1.178. 一旦你获得了一个稳定的系统（即拥有良好的内核），系统管理员应该做的首要任务有哪些？


    首先，应对整个系统进行备份。然后，根据特定 UNIX 实现的说明，管理员应该制作一个启动磁盘和一个根文件系统磁盘。这样一来，如果根文件系统损坏到无法修复，你可以从磁带启动并恢复系统。


    ## 1.179. 当你发现根文件系统不可用时，应该遵循哪些步骤？


    在根文件系统不可用的情况下，管理员可以重新安装操作系统，或者如果有良好的备份，则对根文件系统运行 `fsck` 直到通过（或重新格式化它），然后遵循以下步骤：


    1. 从磁盘启动。

    2. 在收到提示时，插入根文件系统磁盘。

    3. `mount /dev/hdOroot /mnt`

    4. `cd /mnt`

    5. `./usr/bin/tar xvf ./dev/rct0`


