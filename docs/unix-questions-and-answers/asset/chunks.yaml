    ## 1.133. 在 Solaris 中，使用什么命令来显示特定磁盘的分区（slice）信息？


    `prtvtoc <device>`


    ## 1.134. 使用什么命令来显示已载文件系统占用的磁盘空间？


    `df`


    ## 1.135. 哪个文件包含当前已载文件系统的列表？


    `/etc/mtab` (在 Linux 上)


    `/etc/mnttab` (在 Solaris 上)


    ## 1.136. 在 Solaris 上，哪个文件定义了密码默认最大有效期以及修改密码前必须经过的最短时间间隔？


    `/etc/default/passwd`


    ## 1.137. 你会使用什么命令和选项来将文件的权限设置为：所有者可读、写、执行；组用户可读、执行；其他用户无权限？


    `chmod 750 <filename>`


    ## 1.138. 哪个命令会显示当用户创建文件时分配的默认文件权限？


    `umask`


    ## 1.139. 在 Solaris 上，使用什么命令来显示文件的“访问控制列表”（ACL）项目？


    `getfacl <filename>`


    ## 1.140. 使用什么命令以不同于用户默认的安全上下文运行应用程序？该命令的配置文件是什么，该文件中列出了允许定义用户以更高权限执行的程序？


    `sudo <program>`


    `/etc/sudoers`


    ## 1.141. 哪个文件定义了系统的默认运行级别（runlevel），并规定哪个目录存放该运行级别的启动脚本？


    `/etc/inittab`


    ## 1.142. 使用什么命令检查文件系统是否存在错误？


    `fsck`


    ## 1.143. 为什么通常会有两个 bin 目录，/bin 和 /usr/bin？


    UNIX 文件系统的设计目标是供多个系统共享。在共享环境中，没有必要在多个系统之间重复数据。UNIX 系统上的 `/usr` 分区设计设计为供客户端共享。这通常通过客户端系统将服务器的
    `/usr` 分区挂载为自己的分区来实现。这样，所有客户端都可以访问相同的程序，而无需系统管理员在多个系统上维护副本。


    由于这一事实，`/usr` 分区中的文件绝不能被视为关键系统文件。如果客户端由于某种原因需要从网络启动，如果它的 `/usr` 分区是从中央服务器挂载的，它将无法访问该分区。如果客户端系统需要某种系统修复能力，则该程序必须位于
    `/bin` 目录中。按照惯，`/bin` 目录是每个系统本地的。


    因此，有两个 bin 目录的原因是：`/bin` 包含了对系统正确运行至关重要的本地系统级二进制文件，而 `/usr/bin` 包含了重要性较低且对系统基本功能运行并非至关重要的二进制文件。


    ## 1.144. 在 Solaris 上，哪个文件定义了主内核配置文件？


    `/etc/system`


    ## 1.145. 在 Solaris OpenBoot 提示符下，使用什么命令可以显示连接到系统的所有 SCSI 设备？


    `probe-scsi`


    ## 1.146. 如何将 Solaris 系统引导到单用户模式（single user mode）？


    1. 按 Stop-A 键进入 OpenBoot 提示符

    2. 使用命令 `boot -s` 启动系统


    ## 1.147. 哪个命令允许你在 X Windows 中显示并修改你的键盘映射？


    `xmodmap`


    ## 1.148. 在 Linux 中，哪个文件包含当前正在使用的所有 IRQ（中断请求）列表？


    `/proc/interrupts`


    ## 1.149. 你尝试卸载一个当前已载的磁盘，但收到错误“Unable to umount: device or resource busy”（无法卸载：设备或资源忙）。这意味着什么，在卸载磁盘之前你必须做什么？


    这意味着某些进程正在访问你尝试卸载的文件系统，可能是通过已打开的文件句柄，也可能是该进程的当前工作目录在该文件系统内。你首先需要识别哪些进程正在访问该文件系统，以及这些进程的所有者。然后你必须决定如何处理这些进程。


    `fuser` 命令将显示访问给定文件系统的进程。在你确定了这些进程及其所有者后，你可以：1) 等待这些进程完成后再尝试卸载磁盘；2) 联系相关用户以确定进程状态；或者
    3) 杀死这些进程并卸载磁盘。


    ## 1.150. 你需要对某个文件系统运行 `fsck` 程序，但你必须在文件系统未挂载的情况下进行。由于涉及的文件系统是根文件系统，你无法在系统运行时将其卸载。在对该文件系统运行
    `fsck` 时，你有哪些选项可用？


    有两种方法可以在文件系统未挂载时对其运行 `fsck`。


    从另一个根分区访问磁盘。这可以通过移除磁盘本身并将其挂载到另一个 UNIX 系统下来实现，或者使用根磁盘或救援磁盘来启动你的系统。无论通过哪种方式，你都可以访问
    `fsck` 命令，而无需依赖原始磁盘的挂载。然后你可以对驱动器执行 `fsck` 并将系统恢复到之前的状态。


    执行命令 `shutdown -r -F now`。`shutdown` 的 `-F` 选项会强制系统对 `/etc/fstab` 中定义的驱动器运行 `fsck`（并在重启前）。`-r`
    表示立即重启。


    ## 1.151. 你忘记了 root 密码。你有哪些选项可以进入系统？


    这个答案将涵盖大多数 UNIX 类型；具体实现取决于发行版本。


    Root 密码通常以加密形式存储在 `/etc/passwd` 或 `/etc/shadow` 中。虽然无法恢复原来的密码，但你可以将其重置为空值。


    第一步是在不启动该分区的情况下访问根分区。你可以通过引导救援磁盘或移除磁盘本身将其挂载到另一个系统来实现。通过这种方式访问根系统，你可以绕过任何安全性。


    当你访问根分区后，找到 `/etc/passwd` 或 `/etc/shadow` 中的加密字符串。删除该加密字符串。保存更改并恢复系统的正常配置（如果你移动了磁盘，将其还原；如果你使用了不同的引导磁盘，将其移除）。


    重启后，现在无需密码即可登录 root。然后可以使用 `passwd` 命令重置 root 密码。


    ## 1.152. 你的 UNIX 工作站无法 ping 本 TCP/IP 网络上的任何主机。你会采取哪些步骤来排查这个问题？


    这个问题非常有启发性。候选人回答问题的方式将取决于他们的思维模式，特别是他们如何从逻辑角度处理问题。理想情况下，我们希望候选人显示出开启网络通信所需的设置知识，但重要的是，我们希望他们遵循科学方法来诊断和解决问题。


    为了在本地 TCP/IP 网络上通信，以下项目需要正确：


    - 网络物理连接（无论是有线还是无线）

    - 属于本地子网且在该子网内唯一的 IP 地址

    - 正确反映子网配置的子网掩码

    - 正确的网关 IP 地址

    - 如果需要名称解析，必须配置正确的名称服务器


    从故障排除的角度来看，最好从底层开始逐层向上。但在诊断此问题之前，需要更多信息。具体来说，候选人应该问这些问题：


    - 该子网的 IP 配置是什么？

    - 该工作站应该分配什么 IP 地址、子网掩码、网关和 DNS 地址？


