- fmt: '

    The ARP (Address Resolution Protocol) cache on a system is what translates IP
    addresses to MAC addresses on a local TCP/IP network. It is relatively easy to
    spoof ARP replies, meaning that if one system on your network is compromised,
    that system can spoof other systems on the network easily. Your server will think
    that it is connecting to a trusted host, when in reality it is connecting to the
    compromised system, or even worse, another host on the Internet.


    To prevent this from happening, you can define a list of systems that your server
    must trust. In the file `/etc/ethers`, you can hard code the MAC address to IP
    address mapping of these systems, preventing ARP from overriding this information.
    This disadvantage of this approach is that if the network card changes in any
    of these systems, the MAC address will change as well, meaning this file must
    be updated.


    ## 1.93. Describe VPN technology and list some common implementations.


    A VPN (Virtual Private Network) is an encrypted tunnel that exists to transmit
    data over an otherwise insecure public network. VPNs are most commonly used to
    transmit secure data over the internet. Instead of handling the encryption and
    authentication at the application layer (like `SSL` enabled web sites), a VPN
    handles all encryption at the network layer, allowing traditional networking protocols
    to use the VPN tunnel without modification.


    There are three common VPN solutions in use today:


    - IPSec based solutions. IPSec is the security protocol built into the next version
    of IP, `Ipv6`. Many vendors have standardized on IPSec as their VPN solution,
    including Cisco and Sun Microsystems.

    - PPTP (Point to Point Tunneling Protocol) based solutions. The Point to Point
    Tunneling Protocol is a modification to the standard `PPP` protocol which allows
    for encryption and authentication at the network layer. PPTP support is built
    into later version of Microsoft Windows, and implementations are available for
    most UNIX operating systems.

    - Proprietary solutions. Since a VPN tunnel is essentially just encrypted traffic,
    any reliable encryption algorithm can be used to create a tunnel. It is even possible
    to use the encryption functionality of the `ssh` application to build a VPN tunnel.


    ## 1.94. What is a DMZ and why would you want one?


    “DMZ” stands for “Demilitarized Zone”. This is a term that describes a small network
    that exists between a corporate network and the internet. The DMZ will house publicly
    available servers, such as web servers and mail servers. Users inside the company
    network can access hosts in the DMZ, and users outside the company network can
    access hosts inside the DMZ, but the DMZ acts as a buffer between the company
    network and the internet. If a host in the DMZ is compromised, the attacker will
    not gain access to any server inside the company.


    ## 1.95. On “Linux”, how can the directory entries at the top of the `/proc` filesystem
    aid in security?


    When a system is compromised, a rootkit is commonly installed by the intruder.
    A rootkit is a set of trojaned programs that replace common system programs. An
    example would be a trojaned version of the `login` program which always accepts
    a certain username/password combination. Another example is a trojaned version
    of the `ps` program which will display all running processes except the ones that
    the attacker wished to hide.


    The first step in security is knowledge. What is running on your system? Traditionally,
    the `ps` command is used to display this information. But what if you don’t trust
    the `ps` command? In this case, you need a deeper understanding of how the operating
    system works. In Linux, all of the informational commands are simply frontends
    for data that is available as text files or directories in the `/proc` filesystem.
    Specifically, every running process on a Linux system will have a directory under
    `/proc`. For example, the init process (PID #1), will have a directory of `/proc/1`.
    So if you are ever in doubt about the reliability of the `ps` command, compare
    its output with the directories in `/proc`. If you see a discrepancy, you probably
    have a compromised system.


    The moral of this story is that there is no such thing as too much knowledge.
    By having a good understanding of how things work behind the scenes, you are better
    able to handle unexpected situations.


    ## 1.96. What command is used to display the ports that are open on a UNIX system?


    The `netstat` command will display all open ports and all network connections.


    ## 1.97. What is the subnet mask for a default Class-C IP network?


    255.255.255.0


    ## 1.98. In a standard class C IP network, how many IP addresses can be assigned
    to hosts? What are the other non-assignable addresses used for?


    A Class C network has a total of 256 (2^8) IP addresses. However, only 254 of
    these can be assigned to hosts. The first IP address in the subnet is the network
    IP address, which is used to refer to the network as a whole. The last IP address
    in the subnet is the broadcast address, which is used to communicate with each
    host on the network.


    ## 1.99. What is a MAC address?


    A “MAC” (Media Access Control) address is a 48-bit address that is assigned to
    every hardware device that is designed to communicate on an Ethernet network.
    Hardware manufacturers are assigned a range of MAC addresses to use for their
    products to ensure uniqueness.


    ## 1.100. You wish to set up a Linux system as a router between two subnets. You
    have installed and configured two network cards, each attached to a different
    subnet. What are the steps that need to occur before the system will act as a
    router?


    Step 1: You must configure the packet forwarding rules. In recent versions of
    the Linux kernel (2.4 and later) this is accomplished with the `iptables` command.


    Step 2: You must instruct the kernel to forward packets between the two interfaces.
    This is accomplished with this command:


    ```bash

    echo 1 > /proc/sys/ipv4/ip_forward

    ```


    ## 1.101. What is MTU?


    The MTU (Maximum Transmission Unit) is the largest packet size that can be sent
    over a TCP/IP network. If a packet is larger than the MTU of the operating system
    or router, it will get broken into smaller packets. You can often increase network
    performance by ensuring that your operating system is using the same MTU as your
    local router.


    ## 1.102. What file determines the DNS servers that are queried when a network
    request is made?


    `/etc/resolv.conf`


    ## 1.103. What is the difference between UDP and TCP?


    UDP and TCP are both Layer 4 (Transport) protocols in the IP protocol stack. UDP
    (User Datagram Protocol) is considered an ‘unreliable’ protocol because it does
    no end-to-end verification or packet numbering during transmission. The higher-level
    application that utilizes UDP must be responsible for the reassembly of the UDP
    packets. Examples of UDP based services are `tftp` and `NFS`.


    TCP (Transmission Control Protocol) is considered a reliable protocol because
    it has built in tools for guaranteeing delivery of packets and a system for requesting
    the resending of a packet if packet loss occurs. Because of this, TCP incurs more
    overhead then UDP. Examples of TCP based services are `SMTP` and `HTTP`.


    ## 1.104. What is the difference between POP and IMAP?


    POP stands for Post Office Protocol and is a simple set of instructions that let
    your computer retrieve messages from a mail server. After authenticating the request
    with the user''s password, the POP protocol asks the server if there is any new
    mail and if your mailbox on the server has messages, then POP usually downloads
    them to your computer and deletes them off the server.

