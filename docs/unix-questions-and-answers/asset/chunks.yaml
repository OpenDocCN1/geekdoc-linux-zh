    - 命令替换：任何被反引号包围的命令都会由 shell 执行，然后将该命令的标准输出替换到命令行中。

    - 通配符解释：shell 最后会扫描命令行以查找通配符（字符 `*`、`?`、`[`、`]`）。任何包含通配符的单词将被替换为匹配模式的排序后的文件名列表。这些文件名列表随后构成了命令的参数。

    - PATH 评估：它最后查找 `PATH` 变量，以确定为了寻找该命令而必须搜索的目录顺序。


    ## 1.259. `cmp` 和 `diff` 命令之间的区别是什么？


    - `cmp` - 逐字节比较两个文件，并显示第一个不匹配之处。

    - `diff` - 告诉为了使文件相同需要进行哪些更改。


    ## 1.260. ‘grep’ 命令的作用是什么？


    `grep` 是一个模式搜索命令。它在文件中搜索在命令行中通过适当选项指定的模式。


    语法：`grep`


    示例：`grep 99mx mcafile`


    ## 1.261. `cat` 和 `more` 命令之间的区别是什么？


    `cat` 显示文件内容。如果文件很大，内容会在我们查看之前滚动出屏幕。因此，`more` 命令像一个分页器，逐页显示内容。


    ## 1.262. 写一个命令来杀死最后一个后台作业？


    ```bash

    kill $!

    ```


    ## 1.263. 使用哪个命令删除当前目录及其所有子目录中的所有文件？


    ```bash

    rm -r *

    ```


    ## 1.264. 编写一个命令以各种格式显示文件内容？


    ```bash

    od -cbd file_name

    ```


    `c` - 字符，`b` - 二进制（八进制），`d` - 十进制，`od`=八进制导出。


    ## 1.265. 以下命令将做什么？


    ```bash

    echo *

    ```


    它与 `ls` 命令类似，显示当前目录下的所有文件。


    ## 1.266. 在 UNIX 中可以创建新的文件系统吗？


    可以，使用 `mkfs` 创建新的文件系统。


    ## 1.267. 可以限制传入的消息吗？


    可以，使用 `mesg` 命令。


    ## 1.268. 命令 "ls -x chapter[1-5]" 的作用是什么


    `ls` 代表 list（列表）；因此它显示以 ''chapter'' 开头且后缀为 ''1'' 到 ''5'' 的文件列表，即 `chapter1`、`chapter2`
    等。


    ## 1.269. `du` 是命令吗？如果是，它的作用是什么？


    是的，它代表 ‘disk usage’磁盘使用）。通过此命令，你可以找到磁盘的容量和可用空间。


    ## 1.270. 可以统计文件中字符数、行数吗？如果是，如何做？


    可以，`wc` 代表 word count（单词计数）。


    - `wc -c` 用于统计文件中的字符数。

    - `wc -l` 用于统计文件的行数。


    ## 1.271. 名称用于维护文件标识的数据结构？


    `inode`，每个文件都有一个独立的 `inode` 和唯一的 inode 编号。


    ## 1.272. UNIX 系统中有多少个提示符？


    有两个提示符，`PS1`（主提示符），`PS2`（次要提示符）。


    ## 1.273. 内核如何区分设备文件和普通文件？


    内核检查文件 `inode` 结构中的 `type` 字段。


    ## 1.274. 如何切换到超级用户状态以获得权限？


    使用 `su` 命令。系统会要求密码，当输入有效时，用户获得超级用户（管理员）权限。


    ## 1.275. 什么是 shell 变量？


    Shell 变量是特殊的变量，由 shell 创建并维护的键值对。例如：`PATH`、`HOME`、`MAIL` 和 `TERM`。


    ## 1.276. 什么是重定向？


    将数据流导向文件或从文件进行输入或输出。例如：`ls > wc`


    ## 1.277. 如何终止正在运行的进程以及命令 kill 0 的特殊之处是什么？


    通过 `kill` 命令我们可以终止进程。


    语法：`kill pid`


    `kill 0` - 杀死系统中除登录 shell 之外的所有进程。


    ## 1.278. 什么是管道？给出一个例子。


    管道是由管道符 `|` 分隔的两个或多个命令。它告诉 shell 将前一个命令的输出作为后一个命令的输入。


    示例：`ls -l | pr`


    命令 `ls` 的输出是 `pr` 的标准输入。


    当使用管道组合命令序列时，称为流水线（pipeline）。


    ## 1.279. 解释 `kill()` 及其可能的返回值。


    此调用有四种可能的结果：


    - `kill()` 返回 0。这意味着存在一个具有给定 `PID` 的进程，系统允许你向其发送信号。该进程是否为僵尸取决于系统。

    - `kill()` 返回 -1，`errno == ESRCH`，表示不存在具有给定 `PID` 的进程，或者安全增强导致系统拒绝其存在。（在某些系统上，该进程可能是僵尸进程。）

    - `kill()` 返回 -1，`errno == EPERM`，系统不允许你杀死指定的进程。这意味着要么该进程存在（再次，它可能是僵尸进程），要么存在严苛的安全增强（例如，你的进程被允许向*任何人*发送信号）。

    - `kill()` 返回 -1，且 `errno` 为其他值，那么你遇到麻烦了！最常用的技巧是假设成功或带有 `EPERM` 的失败意味着进程存在，而任何其他错误意味着它不存在。


    如果你是专门为提供 `/proc` 文件系统的系统（或所有此类系统）编写，存在另一种替代方案：检查 `/proc/PID` 是否可能有效。


    ## 1.280. 什么是相对路径和绝对路径？


    绝对路径：从根目录开始的精确路径。


    相对路径：相对于当前路径的路径。


