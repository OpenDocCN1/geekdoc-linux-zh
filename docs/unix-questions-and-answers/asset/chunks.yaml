    如果未使用作业控制（通常情况下，只有 shell 使用它），则会话中的所有进程实际上都是前台进程，并且都可以自由地访问终端，即使这会导致混乱。


    终端设备驱动程序会将来自终端的中断（interrupt）、退出（quit）和挂起（hangup）信号发送给前台进程组中的每一个进程，前提该终端是这些进程的控制终端。例如，除非采取了预防措施，挂起终端（例如关闭
    `telnet` 连接）将终止该用户在该组中的所有进程。为了防止这种情况，进程可以安排忽略挂起信号。


    此外，当会话首进程（控制进程）由于任何原因终止时，前台进程组中的所有进程都会收到的挂起信号。因此，简单地注销通常会终止用户的所有进程，除非采取了特定步骤将它们变为后台进程，或者使它们对挂起信号免疫。


    总而言之，每个进程都关联四个进程 ID：


    - `process-ID`：唯一标识该进程的正整数。

    - `parent-process-ID`：该进程父进程的 `Process-ID`。

    - `process-group-ID`：进程组首的 `Process-ID`。如果它等于 `process-ID`，则该进程是组首。

    - `session-leader-ID`：会话首进程的 `Process-ID`。


    ## 1.51. 权限


    `user-ID` 是一个正整数，与密码文件（`/etc/passwd`）中的用户登录名关联。当用户登录时，`login` 命令会将此 ID 设置为创建的第一个进程（即登录
    shell）的 `user-ID`。从该 shell 派生的进程会继承这个 `user-ID`。


    用户还被组织成组（不要与进程组混淆），这些组也有 ID，称为 `group-IDs`。用户的登录组 ID 会成为其登录 shell 的 `group-ID`。


    组定义在组文件（`/etc/group`）中。在登录状态下，用户可以切换到其所属的另一个组。这会改变处理请求的进程的 `group-ID`（通常是 shell，通过
    `newgrp` 命令完成），然后该 `group-ID` 会被所有派生进程继承。由于用户可能是多个组的成员，因此进程还有一个附加 `group-IDs`
    列表。对于大多数用途，当涉及进程组权限时，这些 ID 也会被检查，因此用户不需要不断手动切换组。


    这两个用户和组登录 ID 称为 `真实用户 ID`（real user-ID）和 `真实组 ID`（real group-ID），因为它们代表了真实用户，即登录的用户。每个进程还关联了两个
    ID：`有效用户 ID`（effective user-ID）和 `有效组 ID`（effective group-ID）。这些 ID 通常与相应的真实 ID
    相同，但它们也可能是不同的，正如我们稍将看到的。


    `有效 ID` 始终用于确定权限。`真实 ID` 用于计费和用户间的通信。一个表示用户的权限，另一个表示用户的身份。


    每个文件（普通文件、目录、套接字等）在其 i 节点中都拥有所有者 `user-ID`（简称为 `owner`）和一个所有者 `group-ID`（简称为 `group`）。i
    节点还包含三组三位权限位（总共 9 位）。每组包含一个读取权限位、一个写入权限位和一个执行权限位。如果授予权限，则位为 1，否则为 0。这三组位分别对应所有者、组以及其他人（不属于前两类中的任何）。下表显示了这些位的分配情况（位
    0 是最右侧的位）。


    ### 权限位


    | 位 | 含义 |

    | :--- | :--- |

    | 8 | 所有者读取 |

    | 7 | 所有者写入 |

    | 6 | 所有者执行 |

    | 5 | 组读取 |

    | 4 | 组写入 |

    | 3 | 组执行 |

    | 2 | 其他读取 |

    | 1 | 其他写入 |

    | 0 | 其他执行 |


    权限位经常使用八进制（基数为 8）数字指定。例如，八进制的 `775` 表示所有者和组具有读取、写入和执行权限，而其他人只有读取和执行权限。`ls` 命令会将这种权限组合显示为
    `rwxrwxr-x`；在二进制中它为 `111111101`，直接翻译为八进制的 `775`。在十进制中它是 `509`，但这没有意义，因为数字没有对齐。


