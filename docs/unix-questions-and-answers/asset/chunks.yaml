    `diff` 能够告诉你两个文件之间的具体差异，而不仅仅是它们存在差异以及差异开始的位置。`sdiff` 将两个文件显示在屏幕上，以便你进行视觉上的比较。


    ## 1.69. UNIX 中的别名（aliases）是什么？


    别名是某种昵号，你可以用它们来更容易输入命令。例如，如果你经常使用以下命令：


    ```

    mail -s “Lunch today?” Deb < .signature

    ```


    你可以为此命令设置一个别名并命名为 `lunch`。那么，从以后，你只需要输入 `lunch`，结果就和你输入较长的命令完全相同。


    ## 1.70. 什么是环境变量？


    环境变量是 UNIX 系统中的设置，它们规定了你、你的 shell 以及 UNIX 系统之间如何交互。当你登录到 UNIX 系统时，它会设置你的标准环境变量。


    ## 1.71. UNIX 中使用的默认窗口系统是什么？


    X Windows


    ## 1.72. 使用什么命令可以列出目录的内容？


    `ls`


    ## 1.73. 使用什么命令显示当前运行的进程列表？


    `ps`


    ## 1.74. 什么是登录 shell（login shell）？


    登录 shell 是用户登录系统时执行的程序。该程序接受用户命令并执行它们。这是操作系统的主要用户界面。shell 的示例包括 `bash`、`sh`、`tcsh`、`csh`
    和 `ksh`。


    ## 1.75. 什么是 UID？


    UID 代表用户标识（User Identification）。它是分配给 UNIX 系统上每个用户的唯一标识数字。


    ## 1.76. UID 与用户名之间的关系定义在哪个文件中？


    `/etc/passwd`


    ## 1.77. 使用什么命令检查文件系统是否存在错误？


    `fsck`


    ## 1.78. 在 UNIX 中，名为 OUTPUT.TXT（全大写）的文件与 `output.txt`（全小写）的文件之间有区别吗？


    有区别的。UNIX 操作系统是大小写敏感的。


    ## 1.79. 使用什么命令可以读取给定命令的手册页？


    `man <command>`


    ## 1.80. 使用什么符号将标准输出（STDOUT）重定向到文件？


    `>`（大于号）


    ## 1.81. 使用什么命令可以通过 TCP/IP 网络与另一个系统建立安全的命令行会话？


    `ssh`


    ## 1.82. 哪个文件包含了启动时挂载的驱动器列表？


    Solaris: `/etc/vfstab`


    其他 UNIX: `/etc/fstab`


    ## 1.83. 默认运行级别（runlevel）定义在哪个文件中？


    `/etc/inittab`


    ## 1.84. 定义并描述 TCP Wrappers。除了基于主机的防火墙外，使用 TCP Wrappers 的原因是什么？


    TCP Wrappers 是一种用于限制对网络服务进行入站站访问的工具。通过使用 `/etc/hosts.deny` 和 `/etc/hosts.allow`
    文件，系统管理员可以定义哪些 IP 地址范围或主机允许或拒绝访问系统上的某些端口。TCP Wrappers 并不能取代防火墙！其一，TCP Wrappers
    只会保护那些查询它来控制访问的服务。执行此操作的常用程序是 `inetd`，即互联网超级服务器。那么，为什么在防火墙之外还要使用 TCP Wrappers
    呢？在防火墙被破解的情况下，TCP Wrappers 提供了第二道防线。TCP Wrappers 还提供了出色的日志功能，让你有一种验证防火墙日志的方法。


    ## 1.85. 定义并讨论以下各情况的安全影响：根目录在 $PATH 变量中的当前目录（“.”）、“r”命令（`rlogin`、`rcp` 等）、`/bin/vi`
    上的 setUID 位


    如果一个管理员是从 DOS 或 Windows 世界过来的，当他尝试执行当前工作目录中的二进制文件并收到“未找到命令”的错误时，他可能会感到惊讶。与 DOS
    和 Windows 不同，当前工作目录默认不在用户的 `$PATH` 中。这意味着为了运行程序 `/home/bin/program`，你必须在命令行中输入完整路径名，或者
    `cd` 到 `/home/bin` 并输入 `./program`，或者将 `/home/bin/` 添加到你的 `$PATH` 变量中。


    在 UNIX 系统可以实现这种 Windows 功能。在 UNIX 中，可以使用点（`.`）引用当前工作目录。为了让 UNIX 命令行像 Windows 命令行一样工作，你可以执行命令
    `PATH=.:$PATH`。这将当前目录设置为 shell 在你发布命令时搜索二进制文件的第一个地方。


    然而，这是一个巨大的安全风险。在 UNIX 这种多用户环境中，你必须始终意识到其他人也在使用同一个系统。如果 root 用户以这种方式修改了他的 `$PATH`，那么恶意用户可以在
    `/tmp` 目录下创建一个名为 `ls` 的文件。这个文件可以是一个 shell 脚本，可以执行任何操作，甚至是删除整个系统。如果该文件被设置为可执行，并且
    root 用户切换目录到 `/tmp` 并发布 `ls` 命令，那么执行的就是恶意脚本（以 root 身份），而不是系统的 `/bin/ls`。


    “r”命令多年来在 UNIX 系统上一直很流行。这些命令的存在是为了让用户通过使用多个系统进行远程访问。这些命令有两个固有的缺陷，使得它们在安全环境中变得毫无用处。首先，所有这些命令都通过网络以明文形式传输数据。任何在同一网段运行数据包嗅探的人都能看到所有数据。其次，这些命令的身份验证系统是基于对
    IP 地址的限制和允许。伪造 IP 地址太容易了，这意味着对这些服务的非法访问变得简单。


    为了实现这些命令提供的功能，但以安全的方式进行，请安装 OpenSSH 软件包。该包是 `ssh`（安全外壳）应用程序及类似程序的开源实现。`ssh` 不仅加密通过网络发送的所有数据，它还支持更高级的身份验证机制，例如公钥/私钥认证。


    谨慎使用 setUID 位是非常重要的。UNIX 权限模型是基于父子关系的。当父进程派生子进程时，子进程继承父进程的权限。例如，如果一个应用程序提供了生成
    shell 的选项，那么该程序永远不能被分配 setUID 位。如果是这样，它派生的 shell 将具有 root 权限，赋予任何用户对系统的完全访问权限。同样，像
    `vi` 编辑器这样的应用程序永远不能设置 setUID，因为这将允许任何用户修改系统上的任何文件，完全绕过了 UNIX 安全模型。


    ## 1.86. 与赋予用户 root 权限相比，通过 sudo 授予其某些命令提权权限的优势是什么？


    通过 `sudo` 命令，可以通过 `/etc/sudoers` 文件中的项限制用户以 root 身份运行的命令。这允许系统管理员在不提供 root 密码的情况下为某些用户创建不同的访问级别。`sudo`
    记录每次尝试访问和它运行的每个命令，为所有以超级用户运行的程序留下详细的审计追踪。


    ## 1.87. 什么是 chroot 命令，它为什么对系统安全很重要？


    `chroot` 命令代表“更改根目录”（change root）。该命令允许系统管理员为用户设置一个受限的文件系统（通常称为“chroot 监狱”）。这个文件系统对用户来说是完整的文件系统，但实际上它只是“真实”文件系统的一个子目录，包含了系统管理员希望用户访问的命令和目录。


