    ## 1.181. 如何查出串口线路的波特率、校验位方案和其他信息？


    通过使用以下命令：


    ```bash

    $ stty < /dev/ttySO

    ```


    ## 1.182. 如何设置终端类型（terminal type）？


    设置终端类型的优选方法是将类型分配给 `TERM` 变量。这通常在 `.profile` 或登录脚本中完成。


    ## 1.183. 你可以使用哪些性能工具来诊断系统效率低的问题？


    取决于你的 UNIX 版本提供了哪些工具，可以使用 `top`、`sar`、`prof`、`time`、`timex` 以及 `ps` 命令。`top`、`ps`
    和 `sar` 命令查看系统利用率的“快照”图像。`time` 和 `timex` 命令收集进程在整个生命周期内经过的时间和处理器消耗的详细信息。`prof`
    工具允许用户访问程序内单个函数执行时间的详细数据。


    ## 1.184. `time` 命令如何使用？


    该命令报告执行命令期间消耗的时间和资源。


    ## 1.185. 什么是交换（分页）（swapping/paging）？


    当进程请求更多内存以运行时，分页守护进程（paging daemon）负责通过将其他（理想情况下是不活跃的）进程的内存页写入磁盘交换区域，来释放内存。


    ## 1.186. 在发生频繁交换/分页活动的情况下，你应该做什么？


    这种活动表明没有足够的内存供应用程序使用。最好的做法是增加内存容量。临时解决方案可能是减小缓冲区缓存（buffer cache）的大小，尽管这可能会降低磁盘性能。


    ## 1.187. 如何检查进程状态？


    你可以使用 `ps` 命令检查任务状态。该命令列出所有运行中的活跃进程，包括前台和后台的。`ps` 最常用的选项是 `ps -ef`，而在 BSD 风格下是
    `ps aux`。


    ```bash

    ps -ef

    ps aux

    ```


    ## 1.188. 如何停止失控进程（runaway process）？


    要停止进程，请使用 `kill` 命令，后跟可选的信号级别和所需的进程 ID（PID）。信号名称、级别及其正常行为在不同的 UNIX 发行版之间存在。省略可选的信号级别通常会将信号
    `2` (`SIGINT`) 传递给进程。


    ```bash

    kill -9 pid

    ```


    ## 1.189. 假设你必须启动一个长命令并想注销回家，你应该如何操作？


    你可以使用 `nohup` 命令在后台启动命令。命令的形式看起来像：`nohup command &`。它会捕获退出 shell 时发送的 `HUP` 信号。现在你可以注销，进程将在后台继续运行。


    ```bash

    nohup command &

    ```


    ## 1.190. 如何设置进程优先级？


    假设你不需要立即获得命令的结果，请使用 `nice` 命令，例如 `nice -15 latecommand`。该命令将以 `35` 的优先级执行，而不是默认的
    `20`。只有 root 用户可以增加进程的优先级；其他用户只能影响降低。root 用户（仅限 root 用户）允许提高进程优先级，这可以通过 `nice
    +5 earlycommand` 形式的命令完成。某些 UNIX 版本还包含 `renice` 命令，可用于调整已运行进程的优先级。


    ## 1.191. 如何调度程序在特定时间运行？


    UNIX 系统允许你通过 `cron` 或 `at` 程序在指定时间自动运行程序。对于 `cron`，首先创建一个 `crontab` 文件，然后使用 `crontab`
    命令将其提交给 `cron`。


    ## 1.192. 什么是 shell（外壳）？


    shell 是一个命令解释器。shell 为用户提供了一种高级语言，用户通过这种语言与操作系统进行通信。


    ## 1.193. shell 如何执行命令？


    为了让 shell 执行一个命令，该命令必须是可执行的（具有执行权限）。如果命令是一个编译后的程序，shell 作为父进程会创建一个子进程并立即执行该程序。如果命令是一个
    shell 过程（包含 shell 命令的文件），shell 会 fork 出子进程来读取该文件并执行内部的命令。


    ## 1.194. shell 如何定位用户想要执行的命令？


    搜索的目录序列由 shell 的 `PATH` 变量给出。目录路径之间用冒号隔开。


    ## 1.195. 你可以使用哪些字符来构建正则表达式以匹配其他字符？


    其中一些特殊字符是：星号 (`*`)，它匹配任何字符串（包括空字符串）；问号 (`?`)，它匹配任何单个字符；以及位于括号 `[` 和 `]` 内的任何字符序列。扩展正则表达式和属于
    PERL 脚本语言的正则表达式为这些简单的通配符增加了更多灵活性。


    ## 1.196. 如何重定向命令的输出？


    使用 `>` 或 `>>` 参数来重定向命令输出。使用 `>` 参数时，将创建（或替换）文件作为标准输出。使用 `>>` 参数时，标准输出追加到文件末尾。错误输出也可以重定向，但其语义取决于
    shell 家族。


    ## 1.197. 命令如何从文件获取输入？


    使用 `<` 参数让文件成为命令的输入。例如 `sort < infile`。


    ## 1.198. 什么是命令替换？


    可以将任何命令行放在反引号（`` ``）中，以便命令的输出替换本身。这种概念被称为命令替换。


    ## 1.199. 什么是位置参数（参数）？


    当调用 shell 过程时，shell 会隐式创建位置参数。shell 过程本身的名字位于位置参数 `$0`。第一个命令参数是 `$1`，依此类推。


    ## 1.200. 什么是脚本的管道？


    管道是由竖线 (`|`) 分隔的一个或多个命令。在管道中，每个命令的标准输出（最后一个除外）通过管道连接到下一个命令的标准输入。管道中的每个命令独立运行；shell
    等最后一个命令完成。一个简单的管道示例是：


    ```bash

    cat /etc/passwd | grep user | awk -F: ''{print $3}'' | more

    ```


    ## 1.201. 如何在命令行或 shell 过程中使用括号和大括号？


    管道中的简单命令可以用括号或大括号的命令列表替换。所有包含命令的输出将合并成一个流，成为管道中下一个命令的输入。


    ## 1.202. 使用括号和大括号之间的区别是什么？


    使用括号时，shell 会 fork 出子 shell 来读取并执行包含的命令。与括号不同，使用大括号不会 fork 子 shell；包含的命令直接由 shell
    读取并执行。


    ## 1.203. 从 shell 的角度来看，函数是什么？


    函数类似于独立的 shell 脚本，但它们留在内存中并由 shell 进程执行，而不是由单独进程。


    ## 1.204. 命令的环境是什么？


