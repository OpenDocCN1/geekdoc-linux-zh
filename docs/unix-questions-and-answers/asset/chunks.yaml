    ## 1.24. Write a command to find all of the files which have been accessed within
    the last 30 days.


    find / -type f -atime -30 > december.files &


    This command will find all the files under root, which is ‘/’, with file type
    is file. ‘-atime -30’ will give all the files accessed less than 30 days ago.
    And the output will put into a file call december.files. This command is run in
    the background due to &.


    ## 1.25. What is the most graceful way to get to run level single user mode?


    The most graceful way is to use the command init s.  If you want to shut everything
    down before going to single user mode then do init 0 first and from the ok prompt
    do a boot -s.  


    ## 1.26. What does the following command line produce? Explain each aspect of
    this line. $ (date ; ps -ef | awk {print $1}’ | sort | uniq | wc -l ) >> Activity.log             


    First let’s dissect the line: The date gives the date and time as the first command
    of the line, this is followed by the a list of all running processes in long form
    with UIDs listed first, this is the ps -ef. These are fed into the awk which filters
    out all but the UIDs; these UIDs are piped into sort for no discernible reason
    and then onto uniq (now we see the reason for the sort - uniq only works on sorted
    data - if the list is A, B, A, then A, B, A will be the output of uniq, but if
    it’s A, A, B then A, B is the output) which produces only one copy of each UID.
    These UIDs are fed into wc -l which counts the lines - in this case the number
    of distinct UIDs running processes on the system. Finally the results of these
    two commands, the date and the wc -l, are appended to the file “Activity.log”.
    Now to answer the question as to what this command line produces. This writes
    the date and time into the file Activity.log together with the number of distinct
    users who have processes running on the system at that time. If the file already
    exists, then these items are appended to the file, otherwise the file is created.


    ## 1.27. In UNIX OS, what is the file server?


    The file server is a machine that shares its disk storage and files with other
    machines on the network.


    ## 1.28. What is NFS? What is its job?


    NFS stands for Network File System. NFS enables filesystems physically residing
    on one computer system to be used by other computers in the network, appearing
    to users on the remote host as just another local disk.


    ## 1.29. What is CVS? List some useful CVS commands.


    CVS is Concurrent Version System. It is the front end to the RCS (revision control
    system) which extends the notion of revision control from a collection of files
    in a single directory to a hierarchical collection of directories consisting of
    revision controlled files. These directories and files can be combined together
    to form a software release.


    There are some useful commands that are being used very often. They are:


    cvs checkout


    cvs update


    cvs update -d


    cvs add


    cvs remove


    cvs commit


    cvs co -P aegis - to repull the tree


    ## 1.30. What do these permissions on a file mean?  =-rwxr-xr-x


    owner, group, other. Owner has read/write/execute permissions of the file, group
    and others have read/execute permissions of the file.


    ## 1.31. What is a tar file?


    tar stands for Tape ARchive. It was originally designed for tape backups, but
    it is used to create a tar file anywhere on the filesystem. tar creates one “tar
    file” (also known as a “tarball”) out of several files and directories. A tar
    file is not compressed, it is just a heap of files assembled together in “one
    container”. So, the tar file will take up the same amount of space as all the
    individual files combined, plus a little extra. A tar file can be compressed by
    using gzip.  Here are some examples:


    · % tar -xvf example.tar - Extract the contents of example.tar and display the
    files as they are extracted.


    · % tar -cf backup.tar /home/ftp/pub - Create a tar file named backup.tar from
    the contents of the directory /home/ftp/pub


    · % tar -tvf example.tar - List contents of example.tar to the screen             


    ## 1.32. Describe gzip.


    gzip is the original UNIX ZIP format. It is common to first “tar” files and then
    compress them afterwards using gzip. These files are normally given the extensions
    .tar.gz to show that they are tar archives zipped up with gzip. You may also see
    the extension, .tgz. An archive that is compressed with gzip is compatible with
    WinZip and PkZip. So, a file zipped up on a UNIX box can be unzipped with a Windows
    box.  Here are some examples:


    To compress a file using gzip, execute the following command:


    % gzip filename.tar


    (where filename.tar is the name of the file you wish to compress) The result of
    this operation is a file called filename.tar.gz. By default, gzip will delete
    the filename.tar file.


    To decompress a file using gzip, execute the following command:


    % gzip -d filename.tar.gz


    The result of this operation is a file called filename.tar. By default, gzip will
    delete the filename.tar.gz file. You can also decompress the file using the command:


    % gunzip filename.tar.gz


    This is the same as using the gzip -d command.  There are many options that you
    can use with gzip. Do a man on the utility to learn more.             


    ## 1.33. How do files differ in Windows, UNIX and Mac?


    In Windows applications, a new line is normally stored as a pair of characters:
    carriage return (CR) and line feed (LF). The character pair bears some resemblance
    to the typewriter actions of setting a new line. In UNIX applications, a new line
    is normally stored as a LF character. Macintosh applications use only a CR character
    to store a new line.


    ## 1.34. What is the difference between .so and .a files in UNIX?


    .a archive


    .o object


    .so shared object


    ## 1.35. Windows vs. UNIX: Linking dynamic load modules


    UNIX and Windows use completely different paradigms for run-time loading of code.
    Before you try to build a module that can be dynamically loaded, be aware of how
    your system works.'
