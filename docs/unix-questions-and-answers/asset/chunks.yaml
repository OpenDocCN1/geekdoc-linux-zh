    ## 1.180. Can you copy files to a DOS floppy on a UNIX system?


    Yes, the command to use is `mcopy` which is part of the “mtools” (available from
    http://www.tux.org/pub/tux/knaff/mtools/index.html). This command permits copying
    in both directions. An example is:


    ```bash

    mcopy /john/send a:

    ```


    ## 1.181. How can you find out the baud rate, the parity scheme, and other information
    about a serial line?


    By using the following command:


    ```bash

    $ stty < /dev/ttySO

    ```


    ## 1.182. How do you set the terminal type?


    The preferable method for setting the terminal type is to assign the type to the
    `TERM` variable. This is usually done in `.profile` or login sign-on scripts.


    ## 1.183. What performance tools can you use to diagnose system inefficiency?


    Depending upon what tools are available in your UNIX version, `top`, `sar`, `prof`,
    `time`, `timex`, and also `ps` commands may be used. The `top`, `ps`, and `sar`
    commands view a “snapshot” image of system utilization. The `time` and `timex`
    commands gather detailed information on elapsed time and processor consumption
    over the life of a process. The `prof` tools enable the user to access detailed
    data on execution times for the individual functions within a program.


    ## 1.184. How can the time command be used?


    This command reports the time and resources consumed during the execution of a
    command.


    ## 1.185. What is swapping (paging)?


    As processes request more memory in order to run, the paging daemon is responsible
    for freeing up memory by writing pages of memory from other (hopefully inactive)
    processes to the disk swap area.


    ## 1.186. What should you do in the case of an intense swapping/paging activity?


    This activity is a sign that not enough memory is available for applications.
    The best thing to do is to increase the memory size. A temporary solution might
    be to decrease the buffer cache size, although this might decrease disk performance.


    ## 1.187. How can you check the status of processes?


    You can check the status of your task using `ps` command. This command lists all
    the active processes that are running, both in the foreground and background.
    The most useful options for `ps` are `ps -ef`, while under BSD-style it is `ps
    aux`.


    ```bash

    ps -ef

    ps aux

    ```


    ## 1.188. How can you stop a runaway process?


    To stop a process, use the `kill` command followed by an optional signal level
    and the required process ID. Signal names, their levels, and their normal behavior
    differ between UNIX distributions. Omitting the optional signal level normally
    passes signal `2` (`SIGINT`) to the process.


    ```bash

    kill -9 pid

    ```


    ## 1.189. Assuming that you have to start the execution of a long command and
    you want to log out and go home, how do you go about it?


    You can start the command in background, using the `nohup` command. The command
    would look like this: `nohup command &`. This traps the `HUP` signal that is sent
    when you exit the shell. You can now log out, and the process continues in background.


    ```bash

    nohup command &

    ```


    ## 1.190. How can you prioritize processes?


    Assuming you do not need the results of your command immediately, use the `nice`
    command, for example, `nice -15 latecommand`. The command will execute with the
    priority of `35`, instead of the default of `20`. Only the root user can increase
    the priority of a process; other users can only affect a decrease. The root user,
    and only the root user, is allowed to raise the priority of a process which can
    be accomplished with a command of the form `nice +5 earlycommand`. Some versions
    of UNIX also include the `renice` command, which can be used to adjust the priority
    of a process already running.


    ## 1.191. How can you schedule programs to run at specific times?


    UNIX systems enable you to run programs automatically at specified times by using
    the `cron` or `at` programs. For `cron`, first create a `crontab` file, and then
    submit it to `cron` by using the `crontab` command.


    ## 1.192. What is a shell?


    A shell is a command interpreter. The shell gives the user a high-level language
    in which you communicate with the operating system.


    ## 1.193. How does the shell execute the commands?


    For the shell to execute a command, it has to be executable (to have the execute
    permission). If the command is a compiled program, the shell, as parent, creates
    a child process that immediately executes that program. If the command is a shell
    procedure (file containing shell commands), the shell forks a child to read the
    file and execute the commands inside.


    ## 1.194. How does the shell locate commands that the user wishes to execute?


    The sequence of directories that are searched is given by the shell `PATH` variable.
    Directory pathnames are separated by colons.


    ## 1.195. Which are the characters you could use to form regular expressions to
    match other characters?


    Some of these special characters are: the asterisk (`*`), which matches any string,
    including the null string; the question mark (`?`), which matches any one character;
    and any sequence of characters enclosed within brackets `[` and `]`, which matches
    any one of the enclosed characters. Extended regular expressions and regular expressions
    unique to the PERL scripting language add much more flexibility to these simple
    wildcard functions.


    ## 1.196. How can you redirect the output of a command?


    To redirect the output of a command, use `>` or `>>` redirection arguments. When
    `>` argument is used, a file will be created (or replaced if it exists) as standard
    output. When `>>` argument is used, the standard output is appended to the end
    of the file. The error output can also be redirected, but the semantics of doing
    so differ upon the shell family.


    ## 1.197. How can a command take the input from a file?


    Make a file the input for a command by using `<` argument. For instance: `sort
    < infile`.


    ## 1.198. What is command substitution?


    Any command line can be placed within backticks (`` ``) so that the output of
    the command replaces the command itself. This concept is known as command substitution.


    ## 1.199. What are positional parameters (arguments)?


    When a shell procedure is invoked, the shell implicitly creates positional parameters
    (arguments). The name of the shell procedure itself in position zero is assigned
    to the positional parameter `$0`. The first command argument is called `$1`, and
    so on.


    ## 1.200. What is a pipeline for a shell script?


    A pipeline is a sequence of one or more commands separated by vertical bars (`|`).
    In a pipeline, the standard output of each command (except the last) is connected
    (by a pipe) to the standard input of the next command. Each command in a pipeline
    is run separately; the shell waits for the last command to finish. A simple example
    of a pipeline is


    ```bash

    cat /etc/passwd | grep user | awk -F: ''{print $3}'' | more

    ```


    ## 1.201. How can you use parentheses or braces at the command line or in a shell
    procedure?


    A simple command in a pipeline can be replaced by a command list enclosed in either
    parentheses or braces. The output of all the enclosed commands is combined into
    one stream that becomes the input to the next command in the pipeline.


    ## 1.202. What is the difference between using parentheses and using braces?


    When parentheses are used, the shell forks a subshell that reads and executes
    the enclosed commands. Unlike parentheses, no subshell is forked for braces; the
    enclosed commands are simply read and executed by the shell.


    ## 1.203. What are functions from the shell’s standpoint?


    Functions are like separate shell scripts, except they reside in memory and are
    executed by the shell process, not by a separate process.


    ## 1.204. What is a command’s environment?

