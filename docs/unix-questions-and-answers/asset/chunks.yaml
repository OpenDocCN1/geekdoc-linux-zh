    `diff` tells you specifically where two files differ, not just that they differ
    and at which point the differences start. `sdiff` presents the two files onscreen
    so that you can visually compare them.


    ## 1.69. What are aliases in UNIX?


    Aliases are nicknames of sorts that you use to enter commands more easily. For
    example, if you frequently use the command


    ```

    mail -s “Lunch today?” Deb < .signature

    ```


    you could set an alias for this command and call it `lunch`. Then, in the future,
    all you have to do is type in `lunch`, and the result is the same as if you typed
    in the longer command.


    ## 1.70. What are environment variables?


    Environment variables are settings in the UNIX system that specifies how you,
    your shell, and the UNIX system interact. When you log into the UNIX system, it
    sets up your standard environment variables.


    ## 1.71. What is the default windowing system used in UNIX?


    X Windows


    ## 1.72. What command is used to list the contents of a directory?


    `ls`


    ## 1.73. What command is used to display a list of currently running processes?


    `ps`


    ## 1.74. What is a login shell?


    The login shell is the program that is executed when a user logs into the system.
    This program accepts user commands and executes them. This is the main user interface
    to the operating system. Examples of shells include `bash`, `sh`, `tcsh`, `csh`
    and `ksh`.


    ## 1.75. What is a UID?


    UID stands for User Identification. It is the unique number that is assigned to
    every user on a UNIX system.


    ## 1.76. In what file is the relationship of UID to username defined?


    `/etc/passwd`


    ## 1.77. What command is used to check a filesystem for errors?


    `fsck`


    ## 1.78. Is there a difference between a file called OUTPUT.TXT (in all caps)
    and `output.txt` (all lowercase) in UNIX?


    Yes. UNIX operating systems are case sensitive.


    ## 1.79. What command is used to read the manual page for a given command?


    `man <command>`


    ## 1.80. What symbol is used to redirect standard out (STDOUT) to a file?


    `>` (the greater-than sign)


    ## 1.81. What command is used to establish a secure command-line session with
    another system over a TCP/IP network?


    `ssh`


    ## 1.82. What file contains the list of drives that are mounted at boot?


    Solaris: `/etc/vfstab`


    Other UNIX: `/etc/fstab`


    ## 1.83. In what file is the default runlevel defined?


    `/etc/inittab`


    ## 1.84. Define and describe TCP Wrappers. What are the reasons for using TCP
    Wrappers in addition to a host-based firewall?


    TCP Wrappers is a tool used to restrict inbound access to network services. Using
    the files `/etc/hosts.deny` and `/etc/hosts.allow`, a system administrator can
    define what range of IP addresses or hosts are allowed or denied access to certain
    ports on a system. TCP Wrappers does not replace a firewall! For one thing, TCP
    Wrappers will only protect those services that query it to control access. A common
    program that does this is `inetd`, the internet superserver. So why use TCP Wrappers
    in addition to a firewall? TCP Wrappers provide a second line of defense in the
    event the firewall is compromised. TCP Wrappers also offer excellent logging capabilities,
    giving you a way to verify your firewall logs.


    ## 1.85. Define and discuss the security ramifications of each of these situations:
    Current directory (“.”) in root’s $PATH variable, “r” commands (`rlogin`, `rcp`,
    etc), setUID bit on `/bin/vi`


    If an administrator is coming from the DOS or Windows world, he is probably surprised
    when he tries to execute a binary in his current working directory and he receives
    the error “command not found”. Unlike DOS and Windows, the current working directory
    is not in a user’s `$PATH` by default. This means that in order to run the program
    `/home/bin/program`, you must either type the full path name at the command line,
    `cd` to `/home/bin` and type `./program`, or add `/home/bin/` to your `$PATH`
    variable.


    It is possible to replicate this windows functionality on UNIX systems. In UNIX,
    the current working directory can be referred to with the period (`.`). To make
    the UNIX command line work like the Windows one, you could issue the command `PATH=.:$PATH`.
    This will set the current directory to be the first place that the shell searches
    for binaries when you issue a command.


    This, however, is an enormous security risk. In a multi-user environment like
    UNIX, you must always be aware that other people are using the same system. If
    a root user were to alter his `$PATH` this way, a malicious user could create
    a file in the `/tmp` directory called `ls`. This file could be a shell script
    that could do anything at all, even deleting the entire system. If this is made
    executable, and the root user changed directories to `/tmp` and issued the `ls`
    command, the malicious script is executed (as root) instead of the system `/bin/ls`.


    The “r” commands have been popular for many years on UNIX systems. These commands
    exist to give remote access to users using multiple systems. There are two inherent
    flaws with these commands that make them useless in a secure environment. First,
    these command all transmit data over the network in plain text. Anyone running
    a packet sniffer that has access to the same segment will see all of the data.
    Second, the authentication system for these commands is based on restricting and
    allowing access by IP address only. It is far too easy to spoof an IP address,
    meaning that unauthorized access to these services is relatively simple.


    In order to achieve the same functionality that these commands offer, but to do
    it in a secure way, install the OpenSSH software suite. This package is an open-source
    implementation of the `ssh` (secure shell) applications and other similar applications.
    Not only does `ssh` encrypt all data that is sent over the network, it supports
    more advanced authentication mechanisms, such as public/private key authentication.


    It is very important that the setUID bit be used with care. The UNIX permissions
    model is based on a parent-child relationship. When a parent process spawns a
    child process, the child process inherits the permissions of the parent. For example,
    if an application gives the user an option of spawning a shell, that applications
    can never be assigned the setUID bit. If it were, the shell that it spawned would
    have the permissions of root, giving any user full access to the system. In the
    same vein, an application like the `vi` editor can never be setUID, since it would
    then allow any user to modify any file on the system, completely bypassing the
    UNIX security model.


    ## 1.86. What is the advantage of giving a user elevated privileges to certain
    commands through sudo, as opposed to giving them root access to a system?


    With the `sudo` command, it is easy to limit what command a user may run as root
    through entries in the `/etc/sudoers` file. This allows a system administrator
    to create varying levels of access for certain users, without having to give out
    the root password. `sudo` also logs every attempted access and every command that
    it runs, leaving a detailed audit trail behind all programs run with superuser
    privileges.


    ## 1.87. What is the chroot command and why is it important to the security of
    a system?


    The `chroot` command stands for ‘change root’. This command allows a system administrator
    to set up a restricted section of the filesystem for users to use (commonly called
    a ‘chroot jail’). This filesystem appears to the user to be the complete filesystem,
    but in reality it is merely a subdirectory of the ‘real’ filesystem, containing
    just those commands and directories that the system administrator wishes the user
    to have access to.

