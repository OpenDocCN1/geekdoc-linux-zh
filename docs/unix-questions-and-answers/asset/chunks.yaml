    A few other interesting attributes are recorded in a process’s system data segment.


    There is one open file descriptor (an integer from 0 through 1000 or so) for each
    file (regular, special, socket, or named pipe) that the process has opened, and
    two for each unnamed pipe that the process has created. A child doesn’t inherit
    open file descriptors from its parent, but rather duplicates of them. Nonetheless,
    they are indices into the same system-wide open file table, which among other
    things means that parent and child share the same file offset (the byte where
    the next read or write takes place).


    A process’s priority is used by the kernel scheduler. Any process can lower its
    priority via the system call `nice`; a superuser process can raise its priority
    via the same system call. Technically speaking, `nice` sets an attribute called
    the `nice value`, which is only one factor in computing the actual priority.


    A process’s file size limit can be (and usually is) less than the system-wide
    limit; this is to prevent confused or uncivilized users from writing runaway files.
    A superuser process can raise its limit.


    ## 1.52. Interprocess Communication


    In the oldest (pre-1980) UNIX systems, processes could communicate with one another
    via shared file offsets, signals, process tracing, files, and pipes. Then named
    pipes (FIFOs) were added, followed by semaphores, file locks, messages, shared
    memory, and networking sockets. None of these eleven mechanisms is entirely satisfactory.
    That’s why there are eleven! There are even more because there are two versions
    each of semaphores, messages, and shared memory. There’s one very old collection
    from AT&T’s System V UNIX, called “System V IPC,” and one much newer, from a real-time
    standards group that convened in the early 1990s, called “POSIX IPC.” Almost every
    version of UNIX (including FreeBSD and Linux) has the oldest eleven mechanisms,
    and the main commercial versions of UNIX (e.g., Sun’s Solaris or HP’s HP/UX) have
    all fourteen.


    Shared file offsets are rarely used for interprocess communication. In theory,
    one process could position the file offset to some fictitious location in a file,
    and a second process could then find out where it points. The location (a number
    between, say, 0 and 100) would be the communicated data. Since the processes must
    be related to share a file offset, they might as well just use pipes.


    Signals are sometimes used when a process just needs to poke another. For example,
    a print spooler could signal the actual printing process whenever a print file
    is spooled. But signals don’t pass enough information to be helpful in most applications.
    Also, a signal interrupts the receiving process, making the programming more complex
    than if the receiver could get the communication when it was ready. Signals are
    mainly used just to terminate processes or to indicate very unusual events.


    With process tracing, a parent can control the execution of its child. Since the
    parent can read and write the child’s data, the two can communicate freely. Process
    tracing is used only by debuggers, since it is far too complicated and unsafe
    for general use.


    Files are the most common form of interprocess communication. For example, one
    might write a file with a process running `vi` and then execute it with a process
    running `python`. However, files are inconvenient if the two processes are running
    concurrently, for two reasons: First, the reader might outrace the writer, see
    an end-of-file, and think that the communication is over. (This can be handled
    through some tricky programming.) Second, the longer the two processes communicate,
    the bigger the file gets. Sometimes processes communicate for days or weeks, passing
    billions of bytes of data. This would quickly exhaust the file system.


    Using an empty file for a semaphore is also a traditional UNIX technique. This
    takes advantage of some peculiarities in the way UNIX creates files.


    Finally, something that is usually recommended: Pipes solve the synchronization
    problems of files. A pipe is not a type of regular file; although it has an i-node,
    there are no links to it. Reading and writing a pipe is somewhat like reading
    and writing a file, but with some significant differences: If the reader gets
    ahead of the writer, the reader blocks (stops running for a while) until there
    is more data. If the writer gets too far ahead of the reader, it blocks until
    the reader has a chance to catch up, so the kernel doesn’t have too much data
    queued. Finally, once a byte is read, it is gone forever, so long-running processes
    connected via pipes don’t fill up the file system.


    Pipes are well known to shell users, who can enter command lines like:


    ```

    ls | wc

    ```


    The kernel facility, however, is far more general than what the shell provides.


    Pipes, however, have three major disadvantages:


    1. First, the processes communicating over a pipe must be related, typically parent
    and child or two siblings. This is too constraining for many applications, such
    as when one process is a database manager and the other is an application that
    needs to access the database.

    2. The second disadvantage is that writes of more than a locally set maximum (4096
    bytes, say) are not guaranteed to be atomic, prohibiting the use of pipes when
    there are multiple writers - their data might get intermingled.

    3. The third disadvantage is that pipes might be too slow. The data has to be
    copied from the writing user process to the kernel and back again to the reader.
    No actual disk I/O is performed, but the copying alone can take too long for some
    critical applications. It is because of these disadvantages that fancier schemes
    have evolved.


    Named pipes, also called FIFOs, were added to solve the first disadvantage of
    pipes. FIFO stands for “first-in-first-out.” A named pipe exists as a special
    file, and any process with permission can open it for reading or writing. Named
    pipes are easy to program with. What’s wrong with named pipes? They don’t eliminate
    the second and third disadvantage of pipes: Interleaving can occur for big writes,
    and they are sometimes too slow. For the most critical applications, the newer
    interprocess communication features (e.g., messages or shared memory) can be used,
    but not nearly as easily.


    A named pipe is a special file that is used to transfer data between unrelated
    processes. One or more processes write to it, while another process reads from
    it. Named pipes are visible in the file system and may be viewed with `ls` like
    any other file. Named pipes may be used to pass data between unrelated processes,
    while normal (unnamed) pipes can only connect parent/child processes (unless you
    try very hard). Named pipes are strictly unidirectional, even on systems where
    anonymous pipes are bidirectional (full-duplex).


    A semaphore is a counter that prevents two or more processes from accessing the
    same resource at the same time. Files can be used for semaphores too, but the
    overhead is far too great for many applications. UNIX has two completely different
    semaphore mechanisms, one part of System V IPC, and the other part of POSIX IPC.


    A file lock, in effect a special-purpose semaphore, prevents two or more processes
    from accessing the same segment of a file. It’s usually only effective if the
    processes bother to check; that weak form is called advisory locking. The stronger
    form, mandatory locking, is effective whether a process checks or not, but it’s
    nonstandard and available only in some UNIX systems.


    A message is a small amount of data (500 bytes, say) that can be sent to a message
    queue. Messages can be of different types. Any process with appropriate permissions
    can receive messages from a queue. It has lots of choices: either the first message,
    or the first message of a given type, or the first message of a group of types.
    As with semaphores, there are System V IPC messaging system calls, and completely
    different POSIX IPC system calls.

