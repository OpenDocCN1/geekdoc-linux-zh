    change to another group of which he or she is a member. This changes the group-ID
    of the process that handles the request (normally the shell, via the newgrp command),
    which then is inherited by all descendent processes. As a user may be a member
    of more than one group, a process also has a list of supplementary group-IDs.
    For most purposes these are also checked when a process’s group permissions are
    at issue, so a user doesn’t have to be constantly switching groups manually.


    These two user and group login IDs are called the real user-ID and the real group-ID
    because they are representative of the real user, the person who is logged in.
    Two other IDs are also associated with each process: the effective user-ID and
    the effective group-ID. These IDs are normally the same as the corresponding real
    IDs, but they can be different, as we shall see shortly.


    The effective ID is always used to determine permissions. The real ID is used
    for accounting and user-to-user communication. One indicates the user’s permissions;
    the other indicates the user’s identity.


    Each file (regular, directory, socket, etc.) has, in its i-node, an owner user-ID
    (owner for short) and an owner group-ID (group for short). The i-node also contains
    three sets of three permission bits (nine bits in all). Each set has one bit for
    read permission, one bit for write permission, and one bit for execute permission.
    A bit is 1 if the permission is granted and 0 if not. There is a set for the owner,
    for the group, and for others (not in either of the first two categories). The
    following table shows the bit assignments (bit 0 is the rightmost bit).


    Permission Bits


    Bit  Meaning


    8    owner read


    7    owner write


    6    owner execute


    5    group read


    4    group write


    3    group execute


    2    others read


    1    others write


    0    others execute


    Permission bits are frequently specified using an octal (base 8) number. For example,
    octal 775 would mean read, write, and execute permission for the owner and the
    group, and only read and execute permission for others. The ls command would show
    this combination of permissions as rwxrwxr-x; in binary it would be 111111101,
    which translates directly to octal 775\. And in decimal it would be 509, which
    is useless, because the numbers don’t line up with the permission bits.


    The permission system determines whether a given process can perform a desired
    action (read, write, or execute) on a given file. For regular files, the meaning
    of the actions is obvious. For directories, the meaning of read is obvious. “Write”
    permission on a directory means the ability to issue a system call that would
    modify the directory (add or remove a link). “Execute” permission means the ability
    to use the directory in a path (sometimes called “search” permission). For special
    files, read and write permissions mean the ability to execute the read and write
    system calls. What, if anything, that implies is up to the designer of the device
    driver. Execute permission on a special file is meaningless.             


    The permission system determines whether permission will be granted using this
    algorithm:


    · If the effective user-ID is zero, permission is instantly granted (the effective
    user is the superuser).


    · If the process’s effective user-ID matches the file’s user-ID, then the owner
    set of bits is used to see if the action will be allowed.


    · If the process’s effective group-ID or one of the supplementary group-IDs matches
    the file’s group-ID, then the group set of bits is used.


    · If neither the user-IDs nor group-IDs match, then the process is an “other”
    and the third set of bits is used.


    The steps go in order, so if in step 3 access is denied because, say, write permission
    is denied for the group, then the process cannot write, even though the “other”
    permission (step 4) might allow writing. It might be unusual for the group to
    be more restricted than others, but that’s the way it works. (Imagine an invitation
    to a surprise party for a team of employees. Everyone except the team should be
    able to read it.)


    There are other actions, which might be called “change i-node,” that only the
    owner or the superuser can do. These include changing the user-ID or group-ID
    of a file, changing a file’s permissions, and changing a file’s access or modification
    times. As a special case, write permission on a file allows setting of its access
    and modification times to the current time.


    Occasionally, we want a user to temporarily take on the privileges of another
    user. For example, when we execute the passwd command to change our password,
    we would like the effective user-ID to be that of the superuser, because only
    root can write into the password file. This is done by making root (the superuser’s
    login name) the owner of the passwd command (i.e., the regular file containing
    the passwd program) and then turning on another permission bit in the passwd command’s
    i-node, called the set-user-ID bit.


    Executing a program with this bit on changes the effective user-ID of the process
    to the owner of the file containing the program. Since it’s the effective user-ID,
    rather than the real user-ID, that determines permissions, this allows a user
    to temporarily take on the permissions of someone else. The set-group-ID bit is
    used in a similar way.


    Since both user-IDs (real and effective) are inherited from parent process to
    child process, it is possible to use the set-user-ID feature to run with an effective
    user-ID for a very long time. That’s what the su command does.


    There is a potential loophole. Suppose you do the following: Copy the sh command
    to your own directory (you will be the owner of the copy). Then use chmod to turn
    on the set-user-ID bit and chown to change the file’s owner to root. Now execute
    your copy of sh and take on the privileges of root! Fortunately, this loop-hole
    was closed a long time ago. If you’re not the superuser, changing a file’s owner
    automatically clears the set-user-ID and set-group-ID bits.


