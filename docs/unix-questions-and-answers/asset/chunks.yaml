    Preface


    A few years ago we could basically pick and choose the job we wanted. If we were
    dissatisfied we moved on. Job mobility was the order of the day. Now, in far too
    many cases, outsourcing, downsizing, and/or rightsizing seem to be the order of
    the day. Job stability often appears to be little more than words found in a dictionary.


    Here is a book that will enable you to beat out the competition. Your competition
    is all those people trying to get the same job you are trying to get. Let us face
    it, as far as you are concerned there is only one person that is going to get
    each job. As for the job you want, you want it to be you, not them. If you play
    your cards right, try as hard as you can, prepare yourself, and never give up,
    you will succeed. And this is what this book is all about … preparing and succeeding.


    There are numerous FAQs, questions and answers, articles on Web, books, etc. on
    the market covering almost every conceivable topic, however, from an interview
    perspective it is not feasible to brush up on all these materials when you may
    not have much time. With technologies evolving so rapidly, it is hard for even
    the most knowledgeable professional to handle job interview with confidence and
    precise answers to tough technical and management questions. This is especially
    true when it comes to information about such vital new areas of job opportunity
    as UNIX, Networking, etc. Here is a book that will enable you to ace any technical
    interview as it provides answers to challenging and difficult questions in a wide
    range of important areas.  The key objective of this book is to cover all the
    core concepts and areas which all UNIX developers, designers, administrators,
    and architects  should be familiar with to perform in their jobs or to do well
    in interviews. The interviewer can also use this book to ensure that they hire
    the right candidate depending on their requirements.


    UNIX Questions and Answers is a one-stop reference that both beginning and experienced
    software engineers will use successfully in technical job interviews and countless
    on-the-job situations. Providing the answers to critical questions, from the simplest
    to the most advanced, this book is arranged to get you the information you need
    the moment you need it. You will find helpful explanations of crucial UNIX  issues.


    Packed with numerous real-life examples and case studies, UNIX Questions and Answers
    is an indispensable guide covering all the areas of UNIX. It is a practical and
    constantly usable resource for understanding fundamental UNIX issues and implementing
    workable solutions based on author’s more than 30 years development and management
    experience.


    There are in all about 300 questions with detailed answers so you do not have
    to worry about spending countless hours browsing the Web or text books for correct
    answers that get you succeed.  This book is not a multiple choice question and
    answer book as we believe we need to have detailed understanding of concepts and
    principles to better do our job as a software engineer, administrator, or architect.
    This book also does not contain any non-relevant material to avoid making it bulky.


    Key topics covered include: UNIX Basics, UNIX Kernel, Utilities, File Structure
    and Directories, Shell Fundamentals, Shell Commands, Shell Programming, Shell
    Scripting, Threads and Processes, Commands, Networking, Sockets, Protocols, LAN,
    TCP/IP, System Administration, Network Administration,  Managing UNIX Jobs, User
    Environment, Performance Tuning, Installation and Configuration, Glossary, Acronyms,
    Visual Editor, Makefile, sed, awk, Regular Expressions, Mail, Linux, etc.


    In the latest edition, we have demonstrated a commitment to clear, direct writing,
    with questions that are quick, to the point and stress the core essentials of
    UNIX. Those who want to learn more about the profession, as well as those who
    want to fine-tune their development skills, will find it to be a straightforward
    question and answer format with hundreds of questions covering key UNIX  knowledge
    areas. Whether you are a seasoned professional, novice, student, or instructor
    of UNIX, you will appreciate this book for its rich content and ability to test
    your skill and knowledge.


    Simply return the book if you are not 100% satisfied - no questions asked. However,
    I would request you to please provide your valuable suggestions for improvement
    since I strongly believe in continuous improvement.


    More than 200,000 copies of author’s previous books have been sold. Please review
    author’s profile at: http://books.basandra.com/aboutus.html


    It is planned to keep this book updated on a regular basis so that the readers
    are kept current with latest trends.


    Basandra Books introduced its first question and answer book in 2010 and, as the
    software engineering profession continues to mature, improvements to this book
    have evolved naturally from various feedbacks on the previous editions. I sincerely
    appreciate  the invaluable feedback provided by various readers and reviewers.  Please
    provide any feedback and corrections using http://books.basandra.com/contactus.html
    or email to books-support@basandra.com. Thank you in advance for your feedback.


    All in all a lot of effort by the author has been put into providing you, the
    technical and management professional whose livelihood depends on the currency
    of his or her technical and management knowledge and skills, with as much new
    meaningful information as possible. If I am able to give you any of the information
    that you need to survive and succeed then my effort would be considered more than
    worthwhile.


    Suresh Basandra,


    California, USA


