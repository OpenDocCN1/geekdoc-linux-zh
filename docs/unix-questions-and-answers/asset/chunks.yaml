    \n## 1.252. What’s wrong with having ‘.’ in your $PATH?\n\nA bit of background:\
    \ the PATH environment variable is a list of  directories separated by colons. \
    \ When you type a command name  without giving an explicit path (e.g. you type\
    \ “ls”, rather than  “/bin/ls”) your shell searches each directory in the PATH\
    \ list in  order, looking for an executable file by that name, and the shell \
    \ will run the first matching program it finds.\n\nOne of the directories in the\
    \ PATH list can be the current  directory “.” .  It is also permissible to use\
    \ an empty directory  name in the PATH list to indicate the current directory. \
    \ Both of  these are equivalent\n\nfor csh users:\n\nsetenv PATH :/usr/ucb:/bin:/usr/bin\n\
    \nsetenv PATH .:/usr/ucb:/bin:/usr/bin\n\nfor sh or ksh users\n\nPATH=:/usr/ucb:/bin:/usr/bin\
    \ export PATH\n\nPATH=.:/usr/ucb:/bin:/usr/bin export PATH\n\nHaving “.” somewhere\
    \ in the PATH is convenient - you can type  “a.out” instead of “./a.out” to run\
    \ programs in the current  directory.  But there’s a catch.\n\nConsider what happens\
    \ in the case where “.” is the first entry  in the PATH.  Suppose your current\
    \ directory is a publically-writable one, such as “/tmp”.  If there just happens\
    \ to be a  program named “/tmp/ls” left there by some other user, and you  type\
    \ “ls” (intending, of course, to run the normal “/bin/ls”  program), your shell\
    \ will instead run “./ls”, the other user’s  program.  Needless to say, the results\
    \ of running an unknown  program like this might surprise you.\n\nIt’s slightly\
    \ better to have “.” at the end of the PATH:\n\nsetenv PATH /usr/ucb:/bin:/usr/bin:.\n\
    \nNow if you’re in /tmp and you type “ls”, the shell will  search /usr/ucb, /bin\
    \ and /usr/bin for a program named  “ls” before it gets around to looking in “.”,\
    \ and there  is less risk of inadvertently running some other user’s  “ls” program. \
    \ This isn’t 100% secure though - if you’re  a clumsy typist and someday type\
    \ “sl -l” instead of “ls -l”,  you run the risk of running “./sl”, if there is\
    \ one.  Some “clever” programmer could anticipate common typing  mistakes and\
    \ leave programs by those names scattered  throughout public directories.  Beware.\
    \  Many seasoned UNIX users get by just fine without having  “.” in the PATH at\
    \ all:\n\nsetenv PATH /usr/ucb:/bin:/usr/bin\n\nIf you do this, you’ll need to\
    \ type “./program” instead  of “program” to run programs in the current directory,\
    \ but  the increase in security is probably worth it.\n\n## 1.253. What is the\
    \ significance of the “tee” command?\n\nIt reads the standard input and sends\
    \ it to the standard output while redirecting a copy of what it has read to the\
    \ file specified by the user.\n\n## 1.254. What does the command “$who | sort\
    \ –logfile > newfile” do?\n\nThe input from a pipe can be combined with the input\
    \ from a file. The trick is to use the special symbol “-” (a hyphen) for those\
    \ commands that recognize the hyphen as std input. In the above command the output\
    \ from who becomes the std input to sort, meanwhile sort opens the file logfile,\
    \ the contents of this file is sorted together with the output of who (rep by\
    \ the hyphen) and the sorted output is redirected to the file newfile.\n\n## 1.255.\
    \ What does the command “$ls | wc –l > file1” do?\n\nls becomes the input to wc\
    \ which counts the number of lines it receives as input and instead of displaying\
    \ this count , the value is stored in file1.\n\n## 1.256. Which of the following\
    \ commands is not a filter (a) man, (b) cat, (c) pg, (d) head\n\nman. A filter\
    \ is a program which can receive a flow of data from std input, process (or filter)\
    \ it and send the result to the std output.\n\n## 1.257. How is the command “$cat\
    \ file2” different from “$cat >file2” and >> redirection operators?\n\n> is the\
    \ output redirection operator when used it overwrites while >> operator appends\
    \ into the file.\n\n## 1.258. Explain the steps that a shell follows while processing\
    \ a command.\n\nAfter the command line is terminated by the key, the shell goes\
    \ ahead with processing the command line in one or more passes. The sequence is\
    \ well defined and assumes the following order:\n\n· Parsing: The shell first\
    \ breaks up the command line into words, using spaces and the delimiters, unless\
    \ quoted. All consecutive occurrences of a space or tab are replaced here with\
    \ a single space.\n\n· Variable evaluation: All words proceeded by a $ are evaluated\
    \ as variables, unless quoted or escaped."
