    有时，当程序由于错误而过早停止，或者当用户按下 `<Break>` 键时，终端会停止回显。要恢复终端的正常操作，请输入以下内容：`<Ctrl>q<Ctrl>j
    stty sane <Ctrl>j`。`<Ctrl>q` 会解锁之前的任何 `<Ctrl>s`（它会暂停输出），而 `<Ctrl>j` 等同于回车/返回键。终端现在应该显示键盘输入了。


    ## 1.226. 如何将目录中所有以“.foo”结尾的文件重命名为以“.bar”结尾？


    假设使用 Bourne shell 语法，有一种方法：


    ```bash

    for x in *.foo; do base=`basename $x .foo`; mv $x $base.bar; done

    ```


    ## 1.227. 为什么管理员无法卸载文件系统？


    在卸载时，文件系统中不能有任何打开打开的文件。此外，所有用户必须通过 `cd` 离开该文件系统。在没有进程使用文件系统中的数据之前，无法将其卸载。在这种情况下，`lsof`（列出打开的文件）可能很有帮助，`kill`
    命令也是如此。


    UNIX 系统上安装了以下 shell：


    `/bin/ash` `/bin/bash` `/bin/csh` `/bin/ksh` `/bin/pdksh`


    `/bin/sash` `/bin/sh` `/bin/smrsh`


    `/bin/tcsh` `/bin/zsh`


    ## 1.228. 这些 shell 中哪些可以原生运行 Bourne shell 脚本？


    `ash`, `bash`, `ksh`, `pdksh`, `sh` 将可以运行为 Bourne shell 编写的脚本。`zsh` 可以在修改其环境的情况下运行这些脚本。在
    UNIX 系统上看到所有这些 shell 安装都是很少的。


    ## 1.229. C 语言中使用什么函数来删除文件？


    使用 `unlink` 函数，它接受一个单一参数，即要删除的文件路径，例如 `unlink("/home/luser/deleteme");`。


    ## 1.230. 获取文件信息（权限、所有者、大小等）的基本函数是什么？


    `stat()` 函数及其派生函数通过 `stat` 结构体返回关于文件的详细信息。`stat` 结构体包含权限、inode 节点、文件系统设备号、特殊文件的设备号、链接数、所有者的
    `uid`、所有者的 `gid`、以字节为单位的大小、最后访问、修改、状态更改的时间、最佳 I/O 块大小以及为该文件分配的块数。


    ## 1.231. 使用什么函数来创建命名管道？


    可以使用 `mkfifo()` 函数来创建命名管道。这是一个进程可以连接并从中交换信息的文件，接下来的 shell 命令演示了这一点：


    ```bash

    $ mkfifo /tmp/fifo

    $ echo -e ''hello \n how are you \n goodbye'' > /tmp/fifo & [1] 123

    $ grep h /tmp/fifo

    hello

    how are you

    ```


    在上面的命令中，“echo” 能够通过命名管道（`/tmp/fifo`）与 “grep” 进行通信。


    ## 1.232. C 程序如何设置定时器在经过一定时间间隔后警报自己？


    可以使用 `alarm()` 函数设置定时器。所需的闹钟时间秒数作为参数传递。当时间到期时，进程将收到 `SIGALRM` 信号。


    ## 1.233. C 程序如何捕获信号？Bourne shell 脚本如何捕获信号？


    `signal()` 函数是 ANSI C 的一部分（不仅仅是 UNIX C），它允许在接收到指定信号时调用任意函数。Bourne shell 的 `trap`
    命令具有类似的作用。


    ## 1.234. `size` 命令对命令对象文件报告了什么信息？


    `size` 命令报告程序文本段、数据段和 bss 段的大小。


    ## 1.235. 当 `fork()` 函数将一个进程拆分为两个时，父进程的返回值是什么，子进程的返回值是什么？


    假设成功，子进程接收 0，父进程接收子进程的 `PID`。


    ## 1.236. `fork()` 和 `vfork()` 有什么区别？


    调用 `fork()` 会为程序的数据、bss、栈和堆段（地址空间）创建副本。如果子进程打算使用 `exec()` 函数将自身替换为另一个进程，那么这些数据段的复制既是不必要的也是耗时的。调用
    `vfork()` 会父进程睡眠，直到子进程退出，并使子进程在父进程相同的进程空间中运行，忽略了复制地址空间的要求。


    ## 1.237. 什么是僵尸进程，如何避免它？


    当进程退出时，父进程有责任调用一个 `wait()` 函数之一来读取进程的返回值。死去的子进程放弃了所有内存，但内核必须至少保留 `PID`、终止状态以及进程消耗的
    CPU 时间。如果父进程没有调用 `wait()`，内核将被迫保留这些信息，并在进程列表中反映为“僵尸”（zombie）或“已终止”（defunct）进程。


    ## 1.238. 除了信号、管道和任何类型的文件外，UNIX 还有哪些机制可供进程交换信息？


    进程间通信（IPC）在 UNIX 下包括消息队列（允许进程之间交换小消息）、信号量（可用于控制共享资源的访问）以及共享内存。


    ## 1.239. `fopen()` 和 `open()` 有什么区别？


    `fopen()` 函数在 ANSI C 中定义，是一种可移植的输入输出方法；`open()` 函数返回一个文件描述符，是底层的 read() 系统调用。


    ## 1.240. 什么是 `mmap()`，它为什么比 `read()` 好？


    `mmap()` 函数将文件的区域映射到内存中，允许更快的访问，因为内核不需要强制复制文件。


    ## 1.241. 如何删除以 `-` 开头的文件？


    想办法让文件名不以破折号开头。最简单的答案是使用 `./filename`（假设文件位于当前目录）。这种避免方法适用于其他命令。许多使用 `getopt(3)`
    参数解析例程的命令接受 `--` 参数，表示“最后一个选项，后面的任何内容都不是选项”，因此你的 rm 版本可能处理 `rm -- -filename`。某些不使用
    `getopt()` 的 rm 版本同样处理单个 `-`，因此你也可以尝试 `rm - -filename`。


