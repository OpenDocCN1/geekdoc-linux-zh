    ## 1.239. What is the difference between fopen() and open()?


    The fopen() function is defined in ANSI standard C as a portable method to read
    and write files. It returns a “file pointer” which is supported on all C platforms,
    and makes a variety of functions available for performing highly formatted input
    and output (printf() and scanf()). The open() function returns a “file descriptor,”
    which is a much lower-level protocol that is accessed with the (unformatted) read()
    and write() system calls.


    ## 1.240. What is mmap(), and why is it better than read() or write()?


    The mmap() function maps a section of a file into memory, allowing the file to
    be accessed with pointer arithmetic (char *). Under certain derivatives of UNIX,
    this allows much faster access to the file because the kernel is not forced to
    copy the file’s contents between multiple buffers.


