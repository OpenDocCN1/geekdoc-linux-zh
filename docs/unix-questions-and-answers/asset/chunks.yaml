    ## 1.39. 什么是共享库？


    共享库是在程序启动加载的库。当正确安装共享库后，之后启动的所有程序都会使用该共享库。这实际上比这要灵活且复杂，因为 Linux 使用的方法允许你：

    - 在更新库的同时仍支持使用旧的、向下兼容的程序；

    - 在执行特定程序时覆盖特定的库甚至库中的特定函数；

    - 在使用现有库时完成所有这些。


    ## 1.40. LD_LIBRARY_PATH 有什么用？


    `LD_LIBRARY_PATH` 是你设置的一个环境变量，为运行时共享库加载器（`ld.so`）在搜索共享库时提供一组额外的查找目录。可以列出多个目录，用冒号（`:`）分隔。此列表将附加到给定可执行文件的编译加载路径列表以及任何系统默认加载路径之前。出于安全考虑，对于设置了
    setuid 或 setgid 位的可执行文件，运行时会忽略 `LD_LIBRARY_PATH`。这严重限制了它的用途。


    ## 1.41. 为什么发明 LD_LIBRARY_PATH？


    发明它有几个很好的理由：

    - 对已编译的二进制文件测试新的库例程（为了向后兼容性或新功能测试）；

    - 当你想将一组共享库移动到另一个位置时，作为一个短期的解决方案。


    作为一个通常不希望的副作用，`LD_LIBRARY_PATH` 在链接（`ld`）阶段也会在指定的 `-L` 目录之后被搜索（如果没有给出 `-L` 标志也是如此）。一些
    `LD_LIBRARY_PATH` 的用用示例：


