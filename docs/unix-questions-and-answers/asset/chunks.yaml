    系统上的 ARP（地址解析协议）缓存用于在本地 TCP/IP 网络上将 IP 地址翻译为 MAC 地址。伪造 ARP 响应相对容易，这意味着如果你网络上的某一个系统被攻破了，该系统就可以轻易地伪造网络上的其他系统。你的服务器会认为它正在连接到一个受信任的主机，但实际上它正在连接到被攻破的系统，甚至更糟，是连接到互联网上的另一个主机。


    为了防止这种情况的发生，你可以定义一个服务器必须信任的系统列表。在 `/etc/ethers` 文件中，你可以硬编码这些系统的 MAC 地址到 IP 地址的映射，以防止
    ARP 覆盖这些信息。这种方法的缺点是，如果这些系统中任何一个的网卡发生了变化，MAC 地址也会随之改变，这意味着该文件必须进行更新。


    ## 1.93. 描述 VPN 技术并列出一些常见的实现方式。


    VPN（虚拟专用网络）是一个加密隧道，用于在原本不安全的公共网络上传输数据。VPN 最常用于在互联网上传输安全数据。VPN 并不是在应用层处理加密和身份验证（如启用了
    `SSL` 的网站），而是在网络层处理所有加密，允许传统的网络协议在不修改的情况下使用 VPN 隧道。


    目前有三种常用的 VPN 解决方案：


    - 基于 IPSec 的解决方案。IPSec 是内置在 IP 下一个版本 `Ipv6` 中的安全协议。许多供应商已将 IPSec 标准为他们的 VPN 解决方案，包括
    Cisco 和 Sun Microsystems。

    - 基于 PPTP（点对点隧道协议）的解决方案。点对点隧道协议是对标准 `PPP` 协议的修改，允许在网络层进行加密和身份验证。PPTP 支持内置在后来的
    Microsoft Windows 版本中，并且大多数 UNIX 操作系统都提供了相应的实现。

    - 私有解决方案。由于 VPN 隧道本质上只是加密流量，因此可以使用任何可靠的加密算法来创建隧道。甚至可以使用 `ssh` 应用程序的加密功能来构建 VPN
    隧道。


    ## 1.94. 什么是 DMZ？你为什么需要它？


    “DMZ”代表“非军事化区”（Demilitarized Zone）。这个术语描述了位于公司网络和互联网之间的小型网络。DMZ 将托管公开的服务器，例如 Web
    服务器和邮件服务器。公司网络内部的用户可以访问 DMZ 中的主机，公司网络外部的用户也可以访问 DMZ 中的主机，但 DMZ 充了公司网络和互联网之间的缓冲区。如果
    DMZ 中的主机被攻破，攻击者将无法获得访问公司内部任何的权限。


    ## 1.95. 在“Linux”上，`/proc` 文件系统顶部的目录项如何有助于安全？


    当系统被攻破时，入侵者通常会安装一个 rootkit。rootkit 是一组替换了常见系统程序的木马程序（trojan programs）。一个例子是 `login`
    程序的木马化版本，它总是接受特定的用户名/密码组合。另一个例子是 `ps` 程序的木马化版本，它将显示所有运行的进程，除了攻击者想要隐藏的那些。


    安全的第一步是知识。你的系统上运行着什么？传统上，使用 `ps` 命令来显示这些信息。但如果你不信任 `ps` 命令怎么办？在这种情况下，你需要对操作系统系统的工作原理有更深入的理解。在
    Linux 中，所有的信息命令都是 `/proc` 文件系统中以文本文件或目录形式存在的数据的前端。具体来说，Linux 系统上的每个运行进程在 `/proc`
    下都有一个目录。例如，init 进程（PID #1）将有一个 `/proc/1` 目录。所以，如果你怀疑 `ps` 命令的可靠性，请将其输出与 `/proc`
    中的目录进行比较。如果你发现有差异，你可能拥有一个被攻破的系统。


    这个故事的道理是，知识并无越多。通过充分理解事物背后的运作机制，你能够更好地处理意外情况。


    ## 1.96. 使用什么命令显示 UNIX 系统上开放的端口？


    `netstat` 命令将显示所有开放的端口和所有网络连接。


    ## 1.97. 默认 C 类 IP 网络的子网掩码是什么？


    255.255.255.0


    ## 1.98. 在标准的 C 类 IP 网络中，可以给主机分配多少个 IP 地址？其他不可分配的地址是做什么用的？


    C 类网络总共有 256 (2⁸) 个 IP 地址。然而，其中只有 254 个可以分配给主机。子网中的第一个 IP 地址是网络 IP 地址，用于代表整个网络。子网中的最后一个
    IP 地址是广播地址，用于与网络上的每个主机进行通信。


    ## 1.99. 什么是 MAC 地址？


    “MAC”（媒体访问控制）地址是一个 48 位地址，分配给每个设计用于以太太网络上通信的硬件设备。硬件制造商被分配了一个范围的 MAC 地址用于其产品，以确保唯一性。


    ## 1.100. 你希望将 Linux 系统设置为两个子网之间的路由器。你已经安装并配置了两个网卡，每个网卡连接到不同的子网。在系统充当路由器之前需要执行哪些步骤？


    步骤 1：你必须配置数据包转发规则。在最近的 Linux 内核（2.4 及更高版本）中，这是通过 `iptables` 命令实现的。


    步骤 2：你必须指令内核在两个接口之间转发数据包。通过此命令实现：


    ```bash

    echo 1 > /proc/sys/ipv4/ip_forward

    ```


    ## 1.101. 什么是 MTU？


    MTU（最大传输单元）是 TCP/IP 网络发送的最大包大小。如果数据包大于操作系统或路由器的 MTU，它将被拆分成更小的包。通过确保操作系统与本地路由器使用相同的
    MTU，通常可以提高网络性能。


    ## 1.102. 什么文件决定了进行网络请求时查询的 DNS 服务器？


    /etc/resolv.conf


    ## 1.103. UDP 和 TCP 的区别是什么？


    UDP 和 TCP 都是 IP 协议栈中的第四层（传输层）协议。UDP（用户数据报协议）被认为是一种不可靠的协议，因为它在传输过程中不进行端到端验证或包编号。利用
    UDP 的高层应用程序必须负责 UDP 数据包的重组。TCP（传输控制协议）被认为是一种可靠的协议，因为它内置了保证包交付的工具，以及在发生包丢失时请求重发的系统。由于这一点，TCP
    相比 UDP 的开销更大。基于 TCP 的服务示例 `SMTP` 和 `HTTP`。


    ## 1.104. POP 和 IMAP 的区别是什么？


    POP 代表邮局协议，是一组允许你的计算机从邮件服务器检索邮件的简单指令。在使用用户密码验证请求后，POP 协议询问服务器是否有新邮件，以及你在服务器上的信箱是否有邮件，然后
    POP 通常会将它们下载到你的计算机并从服务器上删除。

