    physical file in a filesystem consumes a single inode, regardless of the number
    of hard links. A soft link, which cannot contain inode infor­mation since it may
    be on a separate filesystem, must consume an inode.


    ## 1.171. What is the most common way of locating files?


    The most common way is by using the find command, which enables you to locate
    all files with a specified name, permissions setting, size, type, owner, or last
    access or modification date. The locate and whereis commands are also prevalent
    on many versions of UNIX, and might be useful.


    ## 1.172. How can you search a file for occurrences of a word or phrase?


    The grep command displays all lines in a file that contain the key word or phrase.
    It is a good practice to enclose the search pattern in single quotes in order
    to protect it from command substitution in the shell.


    ## 1.173. How can you list the names of all files in all subdirectories in which
    there is a certain pattern?


    You can use a combination of two commands:


    find . -exec grep -1 “pattern” {} \;


    ## 1.174. Assuming you have a big file and you want to clear it (empty it), but
    you want to keep the file and its permissions, what could you do?


    You may use the following commands:


    $ > filename #(for the Bourne family of shells)


    Or


    $ cat /dev/null > filename #(for C shell)


    ## 1.175. Assuming that a directory becomes too large (has too many entries) and
    you decide to make two directories out of it (one of which has the same name),
    how would you proceed?


    On some UNIX filesystem implementations, a directory, even if you remove all files
    it contains, never shrinks. Therefore, you should make two new directories, move
    all files into them, remove the old direc­tory, and then rename one of the new
    directories using the name of the old one.


