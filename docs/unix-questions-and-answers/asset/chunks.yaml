- fmt: '

    In UNIX, a shared object (`.so`) file contains code to be used by the program,
    and also the names of functions and data that it expects to find in the program.
    When the file is joined to the program, all references to those functions and
    data in the file’s code are changed to point to the actual locations in the program
    where the functions and data are placed in memory. This is basically a link operation.


    In Windows, a dynamic-link library (`.dll`) file has no dangling references. Instead,
    an access to functions or data goes through a lookup table. So the DLL code does
    not have to be fixed up at runtime to refer to the program’s memory; instead,
    the code already uses the DLL’s lookup table, and the lookup table is modified
    at runtime to point to the functions and data.


    In UNIX, there is only one type of library file (`.a`) which contains code from
    several object files (`.o`). During the link step to create a `.so`, the linker
    may find that it does not know where an identifier is defined. The linker will
    look for it in the object files in the libraries; if it finds it, it will include
    all the code from that object file.


    In Windows, there are two types of library, a static library and an import library
    (both called `.lib`). A static library is like a UNIX `.a` file; it contains code
    to be included as necessary. An import library is basically used only to reassure
    the linker that a certain identifier is legal, and will be present in the program
    when the `.dll` is loaded. So the linker uses the information from the import
    library to build the lookup table for using identifiers that are not included
    in the `.dll`. When an application or a `.dll` is linked, an import library may
    be generated, which will need to be used for all future `.dll`s that depend on
    the symbols in the application or `.dll`.


    Suppose you are building two dynamic-load modules, B and C, which should share
    another block of code A. In UNIX, you would *not* pass `A.a` to the linker for
    `B.so` and `C.so`; that would cause it to be included twice, so that B and C would
    each have their own copy. In Windows, building `A.dll` will also build `A.lib`.
    You *do* pass `A.lib` to the linker for `B` and `C`. `A.lib` does not contain
    code; it just contains information which will be used at runtime to access `A`’s
    code.


    In Windows, using an import library is sort of like “import spam”; it gives you
    access to spam’s names, but does not create a separate copy. In UNIX, linking
    with a library is more like “from spam import *”; it does create a separate copy.


    A program that is linked to shared libraries will generally run more slowly than
    a program that is linked to archive libraries. If you use archive libraries, the
    linker binds into your executable code an actual copy of each library routine
    you call. If you use shared libraries, the linker merely notes in your executable
    code that the code calls a routine in a shared library. Then, when the code begins
    execution, the dynamic loader loads and maps the shared libraries into the process’s
    address space and calls the routines indirectly as they are needed by means of
    a linkage table. Using shared libraries saves space in the executable file, but
    at the expense of the time needed to resolve references to the routines in the
    shared libraries.


    The performance impact of shared libraries is likely to be noticeable only if
    a program makes heavy use of library functions, as many floating-point applications
    do. If your program seems to be running unacceptably slowly with shared libraries,
    you may want to find out whether archive libraries make a difference.


    The C math library `libm` and the FORTRAN and Pascal library `libcl`, however,
    are provided in both shared and archive versions. The linker by default looks
    for shared libraries before it looks for archive libraries, so if you want to
    use the archive library version of `libm` or `libcl`, you need to specify the
    `-a` archive option to the linker. To do this on the compile command line, specify
    `-Wl,-a, archive`.


    Shared libraries provide the following advantages:

    - dramatically reduced executable size

    - reduced link time

    - ability to use updated shared libraries without relinking at the expense of
    a slight increase in program startup time.


    Static linking of system libraries (for example, `libc.a`) into an application
    is generally not a good idea because the system library code “locks” into the
    application binary may become incompatible with later releases of the system.


    ## 1.36. How would you find all the processes running on your computer?


    Running UNIX command `ps -ef` or `ps -aux` depending on version.


