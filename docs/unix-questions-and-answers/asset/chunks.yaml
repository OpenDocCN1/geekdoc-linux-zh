    - What is the physical topology of the network?

    - Is any other station on the network experiencing this problem?


    This final question is the key because you can spend all day troubleshooting a
    workstation, when in reality the problem lies elsewhere on the network.


    Assuming the problem has been confined to the workstation itself, the basic troubleshooting
    can begin. Here are some example questions that should be asked by the candidate
    as they go through the troubleshooting process.


    Is the physical cable connected to the network card? Is there a link light on
    the network card? Is there a corresponding link light on the port to which the
    cable is connected (on a switch or a hub)? Does the operating system recognize
    the network card (On Linux, the `lspci` command will list all devices connected
    to the PCI bus. On Solaris, use the command `prtconf -v`).


    Are the IP configuration settings correct? What does the command `ifconfig -a`
    tell you? Is any Layer 2 traffic being seen (the command `arp -a` will display
    the Layer 2 address resolution protocol table)?


    Is any host-based firewall in effect that could be blocking pings? Is the system
    that you are trying to ping available and not blocking pings? Can you ping other
    hosts on the network?


    As you can see, there are many possible solutions to this problem. A good candidate
    will understand the methodical steps involved in solving a problem of this nature,
    and will implement those steps in the most logical order.


    ## 1.153. Your production UNIX system has been running fine when users suddenly
    complain that the system is slow. You log in and the system feels ‘sluggish’ and
    the terminal is unable to keep up with your typing. What steps do you take to
    diagnose the problem?


    The first step is to determine what is taking all of the system resources. Is
    a process consuming all of the CPU? Run the `top` command to see if any processes
    are consuming the CPU cycles. Also check the load average with `uptime` to see
    if the problem existed previously and just went away.


    If no CPU load is evident, check the memory usage. Again, the `top` command will
    display current memory and swap space in use. If all of the main memory is in
    use, and the system has to swap to disk for every new process, the response will
    decrease dramatically.


    The final thing to check is disk usage. The `vmstat` or `sar -g` commands will
    display the disk usage. High page-out values mean the system is swapping because
    of low memory. High disk activity without paging is a sign of some processes doing
    extensive disk reads or writes.


    This situation brings up an important point: it is impossible to know when a system
    is misbehaving if you don’t know what it looks like when it is behaving. Establishing
    a system benchmark is critical to performance troubleshooting. It could be as
    simple as knowing what processes should show up in a `ps -aef` output. A good
    system administrator will be able to answer these questions about his systems:


    - What is the average number of running processes?

    - What is the average number of users?

    - What is the average CPU load?

    - What is the average memory and swap usage?

    - What is the average disk usage?


    Without this information, diagnosing a problem situation becomes very difficult.
    There are many good monitoring tools available that can help in tracking this
    information. Of course, the standard UNIX monitoring tools run from a `cron` job
    can provide this information as well.


    ## 1.154. Describe the steps the system goes through at boot time to bring up
    multiuser mode.


    When something is turned on, regardless of architecture, the system executes various
    scripts found in `/etc/rc*`. If the root filesystem needs checking, the user is
    prompted to enter single-user mode. Once the checking is complete, the system
    enters either single or multiuser mode depending on the options passed to boot.
    If multiuser mode is chosen, the system executes scripts in `/etc/rc` directories
    to bring up various services, such as printer or network services. Finally, the
    system displays the login prompt.


    ## 1.155. When, and depending on what, are the other filesystems checked and mounted?


    The other filesystems are mounted after the root filesystem mount is complete,
    depending on entries found in a mount table.


    ## 1.156. Name two ways to bring the system down.


    The most commonly used, and the recommended way, is `shutdown`. This will warn
    the user that the system is coming down and unless otherwise specified, will have
    a one-minute grace period (may be different from one implementation). Simply turning
    the power off will not properly unmount the filesystem; instead, it could force
    a lengthy check upon boot.


    The second way is the `haltsys` (or `halt` for BSD) command. This halts the system
    immediately. It should not be used unless in single-user mode. The users are logged
    out (their work will be lost) and network servers and other programs are terminated
    abnormally. It is also a defined behavior that the system can be brought down
    by killing the `init` process with the `SIGINT` signal, although this is rarely
    done in practice.


    ## 1.157. What are the files checked or scripts executed when a user logs in?


    The order is `/etc/passwd`, `/etc/profile`, `$HOME/.profile`, and in case the
    Korn shell is used, `$HOME/.kshrc`. If the C shell is used, `.profile` is replaced
    by `.login` and `.kshrc` by `.cshrc`.


    ## 1.158. When an account, for various reasons, is not used anymore, how can the
    system administrator disable it?


    This can be accomplished in several ways. Assuming normal UNIX authentication,
    the administrator can change the password with the `passwd` command, edit the
    `/etc/passwd` file and replace the second field of the users password entry with
    an asterix (`*`), or remove the entry from `/etc/passwd` entirely. If this is
    done, the entries should be removed from `/etc/group` and `/etc/shadow` as well,
    the home directory and mail spool of the user should be removed, and all files
    owned by the user should be deleted or assigned to other users. The administrator
    should run the `find` utility to ensure that no files remain on the system that
    are owned by the user. If something other than standard UNIX authentication is
    in use, such as NIS, DCE, Hesiod Bind, or a PAM-based authentication mechanism,
    this process will be different.

