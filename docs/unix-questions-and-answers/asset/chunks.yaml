    \n`PATH`.:`/usr/bin`\n`usr/bin`\n\n## 1.252. What’s wrong with having `.` in your\
    \ `$PATH`?\n\nA bit of background: the PATH environment variable is a list of\
    \ directories separated by colons. When you type a command name without giving\
    \ an explicit path (e.g. you type `ls`, rather than `/bin/ls`) your shell searches\
    \ each directory in the PATH list in order, looking for an executable file by\
    \ that name, and the shell will run the first matching program it finds.\n\nOne\
    \ of the directories in the PATH list can be the current directory `.` . It is\
    \ also permissible to use an empty directory name in the PATH list to indicate\
    \ the current directory.\n\n* `(Newer shells only; some shells use a `^` instead\
    \ of the `!`; POSIX shells must accept the `!`, but may accept a `^` as well;\
    \ all portable applications shall not use an unquoted `^` immediately following\
    \ the `[`) Matches all files that begin with a `.` and are followed by a non-`.`;\
    \ unfortunately this will miss `..foo`;`\n\nOne of the directories in the PATH\
    \ list can be the current directory `.` . It is also permissible to use an empty\
