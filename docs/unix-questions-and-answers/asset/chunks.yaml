    IMAP stands for Internet Mail Access Protocol and allows a "client" email program
    to access a message stored at a remote location as if they were on the local computer.
    Email stored on an IMAP server can be manipulated from a desktop computer at home,
    a workstation at the office, or a notebook computer while traveling, without the
    need to transfer messages or files back and forth between these computers.


    Generally, you want to use POP if you access your mail from one computer, and
    IMAP if you need to manipulate your mail from more than one computer, say an office
    and a home computer. Below is a table to help you understand which service fits
    you better.


    ### POP service


    - POP was designed for, and works best in, the situation where you use only a
    single desktop computer.

    - Normally, messages are downloaded to your desktop computer and then deleted
    from the mail server.

    - If you choose to work with your POP mail on more than one machine, you may have
    trouble with email messages getting downloaded on one machine that you need to
    work with on another machine; for example, you may need a message at work that
    was downloaded to your machine at home.

    - If you choose the POP option "keep mail on server", your POP "inbox" can grow
    large and unwieldy, and email operations can become inefficient and time-consuming.

    - Your archive of mail, if you have one, is kept on your desktop computer - you
    generally need little storage space on the mail server.


    ### IMAP service


    - IMAP is designed for the situation where you need to work with your email from
    multiple computers, such as your workstation at work, your desktop computer at
    home, or a laptop computer while traveling.

    - Messages are displayed on your local computer but are kept and stored on the
    mail server - you can work with all your mail, old and new, from any computer
    connected to the internet.

    - You can create subfolders on the mail server to organize the mail you want to
    keep.


    ## 1.105. How do I know if I should use IMAP or POP?


    The table below may help you decide which email protocol is better for you to
    choose.


    #### Choose IMAP if:

    - you need access to your email, new and old, at multiple locations, e.g., office,
    lab, home.

    - you use POP, and specify to leave your mail on the server.

    - you use the option to synchronize the emails on your email client and the server.


    #### Choose POP if:

    - you work with your email in a single location or on a single computer.

    - Webmail works fine for you when you need to check new email remotely.

    - you regularly backup your email messages and archive it.


    ## 1.106. Describe Simple Mail Transfer Protocol.


    SMTP (Simple Mail Transfer Protocol) is a TCP/IP protocol used in sending and
    receiving e-mail. However, since it''s limited in its ability to queue messages
    at the receiving end, it''s usually used with one of two other protocols, `POP3`
    or `Internet Message Access Protocol`, that let the user save messages in a server
    mailbox and download them periodically from the server. In other words, users
    typically use a program that uses `SMTP` for sending e-mail and either `POP3`
    or `IMAP` for receiving messages that have been received for them at their local
    server. Most mail programs such as `Eudora` let you specify both an `SMTP` server
    and a `POP` server. On UNIX-based systems, `sendmail` is the most widely-used
    `SMTP` server for e-mail. A commercial package, `Sendmail`, includes a `POP3`
    server and also comes in a version for Windows NT.


    `SMTP` usually is implemented to operate over Transmission Control Protocol port
    `25`.


    Simple Mail Transfer Protocol (SMTP), documented in `RFC 821`, is Internet''s
    standard host-to-host mail transport protocol and traditionally operates over
    `TCP`, port `25`. In other words, a UNIX user can type `telnet hostname 25` and
    connect with an `SMTP` server, if one is present.


    `SMTP` uses a style of asymmetric request-response protocol popular in the early
    1980s, and still seen occasionally, most often in mail protocols. The protocol
    is designed to be equally useful to either a computer or a human, though not too
    forgiving of the human. From the server''s viewpoint, a clear set of commands
    is provided and well-documented in the `RFC`. For the human, all the commands
    are clearly terminated by newlines and a `HELP` command lists all of them. From
    the sender''s viewpoint, the command replies always take the form of text lines,
    each starting with a three-digit code identifying the result of the operation,
    a continuation character to indicate another lines following, and then arbitrary
    text information designed to be informative to a human.


    If mail delivery fails, `sendmail` (the most important `SMTP` implementation)
    will queue mail messages and retry delivery later. However, a backoff algorithm
    is used, and no mechanism exists to poll all Internet hosts for mail, nor does
    `SMTP` provide any mailbox facility, or any special features beyond mail transport.
    For these reasons, `SMTP` isn''t a good choice for hosts situated behind highly
    unpredictable lines (like modems). A better-connected host can be designated as
    a `DNS` mail exchanger, then arrange for a relay scheme. Currently, there two
    main configurations that can be used. One is to configure `POP` mailboxes and
    a `POP` server on the exchange host, and let all users use `POP`-enabled mail
    clients. The other possibility is to arrange for a periodic `SMTP` mail transfer
    from the exchange host to another, local `SMTP` exchange host which has been queuing
    all the outbound mail. Of course, since this solution does not allow full-time
    Internet access, it is not too preferred.


    `RFC 1869` defined the capability for `SMTP` service extensions, creating Extended
    SMTP, or `ESSMTP`. `ESES` is by definition extensible, allowing new service extensions
    to be defined and registered with `IANA`. Probably the most important extension
    currently available is Delivery Status Notification (`DSN`), defined in `RFC 1891`.


    ## 1.107. What steps are necessary to configure a Solaris system to participate
    in an IP network?


    This assumes that the Solaris system is not part of an `NIS/NIS+` network.


    1. `/etc/hosts` must contain the hostname and IP address of the system.

    2. `/etc/hostname.<interface>` must contain the hostname of the system. `<interface>`
    is the corresponding interface; for example,

    3. `/etc/hostname.dmfe0`

    4. `/etc/netmasks` must contain the subnet mask for the system.

    5. If using `DNS`, `/etc/resolv.conf` needs to contain the primary `DNS` server.

    6. `/etc/defaultrouter` must contain the IP address of the router for the subnet.


    ## 1.108. What is TCP sequence number prediction and what can you do to prevent
    it?


    Since `TCP` is a reliable protocol, each `TCP` packet is assigned a sequence number.
    It’s the responsibility of the receiving end of a `TCP` connection to put the
    incoming packets in order, and re-request a packet if one got lost along the way.
    Theoretically, if a third system can successfully trick one of the two systems
    in a `TCP` conversation into communicating with it instead of the original system,
    the third system can break into the conversation. This is known as ‘session hijacking’,
    or the ‘man-in-the-middle’ attack. In order for this attack to work, the third
    system has to know the `TCP` sequencing being used between the original systems.
    If this sequencing is based on a known algorithm, determining the next `TCP` sequence
    number is trivial and this attack becomes easier.


    This vulnerability didn’t come to light until around the year 2000. At that time,
    most UNIX vendors issued patches to their kernels to ensure that the algorithm
    used to calculate `TCP` sequence numbers was more complicated. There are, however,
    many systems on the internet today that are still vulnerable to this kind of attack.
    The moral of the story is: keep your systems updated.

