    同一个物理设备可以同时拥有块特殊文件和字符特殊文件，事实上，磁盘通常都是如此。内核中的文件系统代码通过块特殊文件访问普通文件和目录，以获得缓冲区缓存（buffer
    cache）带来的优势。有时（主要是在高性能应用中），需要更直接的访问。例如，数据库管理器可以完全跳过文件系统，使用字符特殊文件来访问磁盘（但不是文件系统正在使用的同一区域）。大多数
    UNIX 系统都有一个用于此目的的字符特殊文件，它可以使用直接内存访问（DMA）在进程的地址空间和磁盘之间直接传输数据，这可以带来数量级的性能提升。更健壮的错误检测是另一个优势，因为缓冲区缓存的间接性往往导致错误检测难以实现。


    特殊文件有一个 i 节点（i-node），但磁盘上没有 i 节点可以指向的数据字节。相反，i 节点的这部分包含一个设备编号。这是内核使用的一个表中的索引，用于查找一组被称为设备驱动程序（device
    driver）的子程序。


    当执行系统调用以对特殊文件进行操作时，会调用相应的设备驱动程序子程序。随后发生什么完全设备驱动程序的设计者；由于驱动程序运行在内核中而不是作为用户进程，它可以访问——并可能修改——内核的任何部分、任何用户进程以及计算机本身的任何寄存器或内存。向内核中添加新的设备驱动程序相对容易，因此这提供了一个钩子，除了与新类型的
    I/O 设备建立接口外，还可以做许多事情。它是让 UNIX 实现其设计者从未预想过的功能的最流行的方法。可以将其看作执行“疯狂操作”的许可方式。


    ## 1.49. 什么是信号（signals）？


    内核可以向进程发送信号。信号可以由内核本身产生，从进程发送到自身，从另一个进程发送，或代表用户发送。


    信号是一种用于通知进程某些条件已发生的技术。例如，如果一个进程执行除以零的操作，一个名为 `SIGFPE`（浮点错误）的信号会被发送给该进程。进程有三种处理该信号的方案：


    1.  忽略信号。对于表示硬件异常的信号（如除以零或引用进程地址空间之外的内存），不建议这样做，因为其执行结果是未定义的。

    2.  执行默认操作。对于除以零，默认操作是终止进程。

    3.  提供一个在信号发生时被调用的函数。通过提供我们自己的函数，我们将知道信号何时发生，并可以按意愿处理它。


    内核产生的信号示例是段错误信号（segmentation-violation signal），当进程尝试访问其地址空间之外的内存时发送该信号。


    进程发送给自身的信号示例是中止信号（abort signal），由 `abort` 函数发送，用于终止一个会产生核心转储（core dump）的进程。


    一个进程发送到另一个进程的信号示例是终止信号（termination signal），当多个相关进程中的某一个决定终止整个家族时发送该信号。


    最后，用户产生的信号示例是中断信号（interrupt signal），当用户输入 `Ctrl-c` 时，发送给该用户创建的所有进程。


    大约有 28 种信号（某些 UNIX 版本多几个或少几个）。对于除了 `kill` 和 `stop` 信号外的所有信号，进程都可以控制接收到信号时发生什么（注：原文为
    `kill` 和 `stop`，此处根据上下文可能的误误）。它可以接受默认操作，这通常会导致进程终止；它可以忽略信号；或者它可以捕获信号并在信号到达时执行一个名为信号处理程序（signal
    handler）的函数。信号类型（例如 `SIGALRM`）作为参数传递给处理程序。然而，处理程序没有直接的方法确定是谁发送了信号。当信号处理程序返回时，进程在中断处继续执行。内核留两个信号未使用。这些信号可以供应用程序用于用途。


    ## 1.50. 描述进程 ID（process-IDs）、进程组（process groups）和会话（sessions）。


    每个进程都有一个进程 ID，这是一个正整数。在任何时刻，这些 ID 保证是唯一的。除了一个进程外，每个进程都有父进程。


    进程的系统数据还记录了它的 `parent-process-ID`，即其父进程的 `process-ID`。如果进程因为父进程在它之前终止而变成孤儿进程，它的
    `parent-process-ID` 将改为 `1`（或其他固定数字）。这是启动时创建的初始化进程（`init`）的进程 ID，它是所有其他进程的祖先。换句话说，初始化进程收养了所有孤儿进程。


    有时程序员选择一组相关进程来实现子系统，而不是单个进程。UNIX 内核允许这些相关进程被组织成一个进程组。进程组进一步被组织成会话。


    会话的成员之一是会话首（session leader），每个进程组的成员是进程组首（process-group leader）。对于每个进程，UNIX 都会跟踪其进程组首和会话首的进程
    ID，以便进程能够在层次结构中定位自己。


    内核提供了一个系统调用来向进程组的每个成员发送信号。通常，这用于终止整个组，但任何信号都可以通过这种方式广播。


    UNIX Shell 通常为每次登录创建一个会话。它们通常为流水线中的进程形成单独的进程组；在这种语境下，进程组也被称为作业（job）。但这只是 Shell
    喜欢处理的方式；内核允许更大的灵活性，以便单次登录中可以形成任意数量的会话，且每个会话可以以任何喜欢的方式形成进程组，只要维持了层次结构即可。


    工作原理如下：任何进程都可以从其会话中退出，然后成为自己的会话首（仅包含一个进程的进程组）。随后，它可以创建子进程来完善新的进程组。会话内部可以形成额外的进程组，并将进程分配给这些组。分配也可以更改。因此，单个用户可能运行，例如，一个包含
    10 个进程的会话，这些进程被组织成，例如，三个进程组。


    会话（以及其中的进程）可以有一个控制终端（controlling terminal），它是会话首打开的第一个终端设备；随后会话首成为控制进程。通常，用户进程的控制终端是用户登录时使用的终端。当形成新会话时，新会话中的进程不再拥有控制终端，直到打开一个终端为止。没有控制终端是所谓“守护进程”（daemons，如
    Web 服务器、cron 设施等）的典型特征，它们一旦启动，就会脱离启动它们时的任何终端运行。“Demon”和“daemon”是同一个词的两种拼写方式，但前者指恶灵，而后者指代一种介于神与人之间的超自然生物。行为不端的的守护进程可能被恰切称为
    demons。


    可以组织这些结构，使得会话中只有一个进程组（前台作业）可以访问终端，并在前台和后台之间移动进程组。这被称为作业控制（job control）。尝试访问终端的后台进程组会被挂起，直到它被移动到前台。这防止了它从前台作业中窃取输入或在前台进程组的输出上乱涂乱画。

