    ## 1.109. 你购买了一个域名并将你的其中一台 UNIX 服务器配置为 DNS 服务器。你必须在你的主区域文件中创建哪条条目，以确保发送到你域名的电子邮件被发送到正确的邮件服务器？


    `MX` 记录是负责定义特定域名邮件服务器的 DNS 条目。为了冗余性考虑，建议一个域名拥有多个 `MX` 记录。


    ## 1.110. 将这些常见的网络服务与其默认端口号相关起来：Telnet, SSH, FTP, SMTP, DNS, POP3, HTTP, HTTPS,
    IMAP


    显然，没有人指望人们记住所有常见的端口号和服务。然而，这些服务已经足够常见，任何一个优秀的 UNIX 系统管理员都应该烂记于心。


    - Telnet: `TCP 23`

    - SSH: `TCP 22`

    - FTP: `TCP 20` & `TCP 21`

    - SMTP: `TCP 25`

    - DNS: `TCP 53` 和 `UDP 53`

    - POP3: `TCP 110`

    - HTTP: `TCP 80`

    - HTTPS: `TCP 443`

    - IMAP: `TCP 143`


    ## 1.111. 哪个命令可以在 UNIX 系统上显示路由表？


    ```

    netstat -r

    ```


    ## 1.112. 你的 UNIX 系统能够 ping 本子网内的其他设备，但无法 ping 子网外的设备。可能出现的问题是什么？


    为了让主机与其子网外部通信，它必须知道默认路由器的地址。此错误可能表示默认路由器未设置或设置错误。如果主机上的默认路由器设置是正确的，那么可能是路由器本身的问题。


    ## 1.113. 当你启动到 UNIX 系统的 telnet 会话时，连接建立了，但在看到登录提示之前有 20 秒或更长的暂停。这可能是什么引起的？


    telnet 服务器会对每个尝试连接的 IP 地址执行反向 DNS 查询。如果 `DNS` 配置错误，或者网络的 `DNS` 宕机，服务器将在等待 `DNS`
    超时后才会向 telnet 客户端显示登录提示。


    ## 1.114. 描述 Solaris 中的默认分区方案，说明切片编号（slice number）、默认挂载点及其用途。


    1. `Slice 0` 默认挂载为根分区 (`/`)。这是顶层 UNIX 文件系统。

    2. `Slice 1` 预留用于交换空间（swap space）。其大小取决于内存量和系统将执行的任务。

    3. `Slice 2` 代表整个磁盘且不挂载。

    4. `Slice 3` 默认挂载为 `/export`。通常用于存放导出的信息，例如用户主目录或操作系统二进制文件的替代版本。

    5. `Slice 4` 默认挂载为 `/export/swap`。该分区用于为客户端系统提供虚拟内存空间。`Slice 4` 也经常被挂载为 `/opt`。

    6. `Slice 5` 默认挂载为 `/opt`。这是安装对 Solaris 运行不重要的软件包的地方。如果 `/opt` 已经作为 `Slice 4`
    挂载，则此切片通常被挂载为 `/var`。

    7. `Slice 6` 默认挂载为 `/usr`。`/usr` 包含普通系统用户使用的二进制文件和库。`/usr` 通常在系统之间共享。

    8. `Slice 7` 默认挂载为 `/home`、`/export/home` 或 `/export/spare`。通常存放用户目录或其他共享信息。


    ## 1.115. 定义并描述与 UNIX 下磁盘管理相关的术语：Boot block（引导块），Super block（超级块），Logical block（逻辑块），Inode（索引节点）


    `boot block`（在 Intel 平台上称为主引导记录）存储启动系统所需的信息。数据从扇区（或柱面组）`0` 开始，可以位于硬件能够启动的任何磁盘。例如，如果你在基于
    x86 的系统上使用 Linux，且你的系统 `BIOS` 支持从 USB 驱动器启动，你可以可以使用移动 USB 驱动器作为你的启动设备。


    `super block` 包含关于文件系统本身的信息。这些信息包括：

    1. 文件系统大小和状态

    2. 文件系统标签

    3. 文件系统状态（`clean`、`dirty`）

    4. 逻辑块大小


    没有 `superblock`，文件系统将无法。由于其重要性，当在磁盘上创建文件系统时，会在磁盘的不同部分创建多个 `superblock` 副本，以防主
    `superblock` 损坏。


    `logical block` 是文件系统中可以存储的最小数据单元。特定文件系统的 `logical block` 大小在创建该文件系统时确定。逻辑块的常见大小有
    `8K`、`4K`、`2K`、`1K` 和 `512 bytes`。如果你保存的文件小于 `logical block size`，该文件仍将占用一个 `logical
    block` 的空间。


    `inode`（或索引节点）包含除文件名外的所有关于文件的信息。每个 UNIX 系统都有 `inode`，包含内容如下：

    1. 文件类型（普通、目录、链接、特殊）

    2. 最后访问时间、最后修改时间、创建时间

    3. 文件大小

    4. 权限和所有权


    分配给文件系统的 inode 数量在创建文件系统时是固定的。


    ## 1.116. 描述向 UNIX 系统添加新磁盘的步骤。


    步骤 1：在机器上物理安装硬盘。如果是 IDE 磁盘，确保设置了主从跳线。如果是 SCSI 磁盘，确保使用唯一的 LUN。

    步骤 2：分区磁盘。在 Solaris 上使用 `format` 命令，在 Linux 上使用 `fdisk` 命令。

    步骤 3：在磁盘上创建文件系统。在 Solaris 和 BSD 上使用 `newfs` 命令。在 Linux 上使用 `mkfs` 命令。

    步骤 4：如果不存在，为新磁盘创建挂载点。`mkdir /mnt/newdisk`

    步骤 5：确保磁盘在系统启动时自动挂载。在 Solaris 上向 `/etc/vfstab` 添加条目。在 Linux 上向 `/etc/fstab` 添加。

    步骤 6：挂载文件系统。`mount /mnt/newdisk`


    ## 1.117. 普通文件系统和日志文件系统的区别是什么？


    今天，文件系统都利用写缓存，这意味着对磁盘的请求首先写入内存。然后内核决定何时将缓存刷新到磁盘（通常在系统关机时）。这提高了系统的整体性能。这种方法的问题出现在缓存刷新之前磁盘被卸载或失效。这发生在掉电或系统故障时。当这种情况发生时，在再次挂载磁盘之前，必须对其进行扫描以分析磁盘并恢复到一致状态。对于大磁盘，这可能花费大量时间，在此期间系统不可。


    为了解决这个问题，开发了日志文件系统。通过借用数据库领域存在多年的技术（事务日志），文件系统能够从意外故障中更快地恢复。不需要扫描整个磁盘，只需检查事务日志，从而将恢复时间从几小时缩短到几秒。


    ## 1.118. 定义并描述常见的 UNIX 文件系统。


    - `UFS`：UNIX 文件系统。Unix 文件系统的原始标准以及 BSD 和 Solaris 的默认值，基于原始 BSD FAT Fast 文件系统。

    - `JFS`：日志文件系统。该文件系统由 IBM 开发，是 AIX 的默认文件系统。IBM 也将该文件系统移植到了 Linux。

    - `EXT2`：标准的 Linux 文件系统。这是一个非日志文件系统。

    - `EXT3`：具有日志功能的 `EXT2`。

    - `XFS`：Silicon Graphics 的日志文件系统。XFS 是 IRIX 的默认文件系统，也已被移植到 Linux。


    '
- fmt: '

    - `ReiserFS` – Journaling file system developed by Hans Reiser. Touted for its
    speed and scalability. Available in most Linux distributions.


    ## 1.119. What are the 3 settings in the standard UNIX file permissions model,
    and how does each apply to files and directories?


    For files:

    - Read – Can open the file and read its contents

    - Write – Can modify the file

    - Execute – Can execute the file


    For directories:

    - Read – Can list the files in a directory

    - Write – Can add or removes file from the directory

    - Execute – Can execute a program within the current contents of the directory


    Directory permissions are a little non-intuitive. For example, it’s not immediately
    obvious what the ‘execute’ option on a directory would give you, since you can’t
    actually execute a directory. It does not mean that you can execute binaries that
    are inside that directory. If you do not have execute permissions on a directory,
    you will not, for example, be able to list the contents of that directory. Because
    the `ls` command needs to run against the directory in question, the command `ls
    <directory>` will be denied.


    A frequently asked question about UNIX permissions is “How do I grant the ‘change’
    option to a user?” UNIX doesn’t have a ‘change’ bit, but you can replicate the
    functionality within the existing permissions model. ‘Change’ means that you can’t
    delete a file, but you can modify it. To replicate this in UNIX, you first ensure
    that the user has write access to the file itself. This allows them to modify
    the file. Then, to ensure that they can’t remove it, revoke their write privileges
    on the directory that houses the file. This will prevent them from removing the
    file itself.


    ## 1.120. What is the setUID bit and how is it employed?


    When the setUID bit is enabled for an executable file, that file will execute
    with the permissions of the file owner rather than the permissions of the parent
    process. This is useful for enabling regular users to run privileged commands
    without having to give them root access. `setUID` is set with the `chmod` command.
    To change the permissions on an executable file so the setUID bit is set, owner
    has read, write and execute, group has read, write and other has read and write,
    issue the following command:


    ```bash

    chmod 4755 <filename>

    ```


    ## 1.121. Define and describe the cron job scheduling system. What are the fields
    available to define the time a job will execute?


    `Cron` is the default UNIX job scheduler. Cron jobs are defined per user in `/var/spool/cron/<username>`.
    This file lists each user’s cron jobs, one per line. Each line contains 6 fields:


    - Field 1 – Minute

    - Field 2 – Hour

    - Field 3 – Day of the month

    - Field 4 – Month

    - Field 5 – Day of the week

    - Field 6 – Program to run


    By default, any output sent to `STDOUT` or `STDERR` from these scheduled programs
    is emailed to the user.


    How do you disable a user account without deleting it? Assume shadow passwords
    are being used?


    The command `passwd -l <username>` will disable an account. It does this by placing
    an “!” in front of the user’s encrypted password in the `/etc/shadow` file.


    ## 1.122. In the standard lpr-based UNIX printing system, what command will display
    the status of a print queue?


    `lpq` - that is a spool queue examination program.


    ## 1.123. Describe the Samba suite of utilities. How are they useful in a heterogeneous
    environment?


    Samba is a software suite that implements the Server Message Block protocol on
    UNIX systems. This is the protocol that Microsoft Windows systems use for sharing
    filesharing, printer sharing, and authentication. The Samba server software allows
    a UNIX machine to act as a file, print, and authentication server for Windows
    clients. The Samba client software allows a UNIX machine to participate in a Windows
    network, accessing shared drives, printing to shared printers, and authenticating
    against a domain controller or an Active Directory server.


    ## 1.124. Describe the package management options available on Linux systems.


    Most Linux distributions utilize either the `rpm` or the `deb` package format.
    `Rpm` based distributions include RedHat, SuSE and Mandrake. The Debian-based
    distributions utilize the `deb` package format, including Debian itself, Knoppix,
    Lindows and Xandros Linux. Both systems offer dependency checking, allowing for
    a level of intelligence when installing or upgrading software.


    ## 1.125. Describe the package management software on Solaris.


    The `pkgadd` command is used to install software. When you receive a package from
    Sun, or download one from the internet, you install it with the `pkgadd -d <package
    name>` command. To see a list of packages installed on your Solaris system, run
    the command `pkginfo`. To list the files that belong to an installed package,
    run the command `pkgchk -l <package name>`.


    ## 1.126. What are three ways to find a file on a UNIX system?


    The `which` command will display the full path to a command if that command is
    in a directory defined by your `$PATH` environment variable. The `locate` command
    will query a hash database containing a list of all files on the filesystem. The
    database must be updated periodically. This command is not a standard part of
    all UNIX systems. The `find` command can search entire partitions for a file,
    using an exact or regular expression match.


    ## 1.127. If /etc/inittab defines your default runlevel as 3, where do your system
    startup scripts reside?


    `/etc/rc3.d`


    ## 1.128. You are logged in as root and wish to kill a process with PID #1054.
    You type `kill 1054` but you still see the process in the process table. Why did
    the process not die, and what can you do to get rid of it?


    When called with no arguments, the `kill` command by itself sends the `TERM` signal
    to a process. The `TERM` signal can be best described as ‘asking the process to
    end when it’s ready’. A process can be configured to specifically catch the `TERM`
    signal and ignore it. The process could also be in such a state that it is unable
    to respond to the `TERM` request. In this case, more drastic measures are called
    for. By passing the `-9` option to `kill` (`kill -9 1054`), you are sending the
    `KILL` signal. This is a lower level signal that tells the kernel to terminate
    this process immediately. This is usually reserved for processes that are locked
    in some loop or wait state and do not heed the `TERM` signal. If a process does
    not respond to `kill -9`, it is usually in some non-recoverable state (like waiting
    on a disk that is no longer available). The only way to eliminate these processes
    is to reboot the system.


    The heart of the UNIX operating system is the command line. Having a good grasp
    of what commands are available is fundamental for working with a UNIX OS. In the
    same vein, since everything in UNIX is a file, knowledge of the file system is
    crucial. These questions can quickly weed out an UNIX sysadmin from a trainee.


    ## 1.129. What are the fields defined in the /etc/passwd file?


    - Field 1: username

    - Field 2: placeholder for encrypted password (assuming shadow passwords are being
    used)

    - Field 3: `UID` (User Identification)

    - Field 4: `GID` (Group Identification)

    - Field 5: Comment

    - Field 6: Home directory

    - Field 7: Login shell


    ## 1.130. What is the purpose of the grep command?


    `grep` is used to search for strings of text in files. `grep` stands for “Global
    Regular Expression Print”


    ## 1.131. What command is used to display information about the network interfaces
    on a system?


    `ifconfig`


    ## 1.132. The ‘ps’ command lists processes currently running on the system. Identify
    and describe the following column headers from the output of `ps -aef`: UID, PID,
    PPID, TTY


    `UID` = User Identification, the owner of the process


    `PID` = Process ID. Each UNIX process is assigned a unique process ID.


    `PPID` = Parent Process ID. The PID of the parent of this process.


    `TTY` = On what terminal is this process running. If the TTY is “?”, then the
    process is not running on a terminal (either a system process or a detached process).

