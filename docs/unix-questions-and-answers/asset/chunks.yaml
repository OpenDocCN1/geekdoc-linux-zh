    软链接（Soft links）本质上为其他用户提供指向你所指定目录的快捷方式。与硬链接一样，软链接允许文件同时存在于多个位置；但是，对于软链接，它只有一个副本，而且通过软链接你还可以链接目录。链接的文件或目录依赖于原始文件——也就是说，如果原始文件或目录被删除，链接的文件或目录将不再可用。软链接特别方便，因为它们既可以用于目录，也可以用于单个文件，并且它们可以跨不同的文件系统工作，即：不仅限于
    `/home` 内，而是 UNIX 系统的任何地方。与硬链接一样，软链接有时要求你拥有另一个用户目录和文件的权限。


    ```bash

    ln -s

    ```


    ## 1.23. 符号链接（symbolic link）和硬链接之间的区别是什么？


    一个名称/节点（i-node）对被称为链接。


    硬链接是在文件系统层面的 inode 级别上创建的链接。你只能对同一文件系统中的文件创建硬链接。


    符号链接只是另一个文件，其内容仅仅是指向“原始”文件的路径。它可以位于另一个文件系统上（如果通过 NFS 导入，则可以位于另一台计算机上）。如果源文件被移除，链接就会失效。


    符号链接是指向目录条目的指针，而硬链接更像是文件的虚拟副本。


    当你尝试用文本编辑器或其他程序访问符号链接时，内核会将程序重定向到符号链接路径名所指示的文件。


    硬链接与它所指向的文件共享同一个 inode，因此为同一个物理文件提供了不同的文件名。硬链接不能指向目录，也不能跨越不同的文件系统。


    ## 1.24. 写一个命令找到所有在过去 30 天内访问过的文件。


    ```bash

    find / -type f -atime -30 > december.files &

    ```


    该命令将找到根目录（`//`）下所有类型为文件的文件。`-atime -30` 将给出所有在 30 天前访问过的文件。输出结果将放入一个名为 `december.files`
    的文件中。由于 `&` 的存在，该命令在后台运行。


    ## 1.25. 进入单用户模式（run level single user mode）最优雅的方法是什么？


    最优雅的方法是使用命令 `init s`。如果你想在进入单用户模式之前关闭所有内容，请先执行 `init 0`，然后在确认提示符处执行 `boot -s`。


    ## 1.26. 下面命令行产生什么结果？解释该行的每一个方面。$ (date ; ps -ef | awk {print $1}’ | sort | uniq
    | wc -l ) >> Activity.log


    首先让我们拆解这行命令：`date` 作为行的第一条命令给出日期和时间，随后是所有运行进程的长格式列表，其中 UID 列在最前面，这就是 `ps -ef`。这些内容被输入到
    `awk`，它过滤掉除 UID 以外的所有内容；这些 UID 被传递给 `sort`（这并无特殊），然后传递给 `uniq`（现在我们看到了排序的意义——`uniq`
    仅对排序后的数据有效——如果列表是 A, B, A，那么 `uniq` 的输出是 A, B, A；但如果是 A, A, B，则输出是 A, B），它产生每个
    UID 的唯一副本。这些 UID 被输入到 `wc -l`，它计算行数——即系统上运行进程的不同 UID 的数量。最后，这两个命令的结果（`date` 和
    `wc -l`）被追加到 `Activity.log` 中。


    ## 1.27. 在 UNIX 中，文件服务器是什么？


    文件服务器是一台与其他共享磁盘的机器。


    ## 1.28. 什么是 NFS？它的作用是什么？


    NFS 代表网络文件系统（Network File System）。它允许存储在计算机上的文件被其他计算机使用。


    ## 1.29. 什么是 CVS？列出常用的命令。


    CVS 是并发版本系统（Concurrent Version System）。它是版本控制的前端。常用的命令有：


    ```bash

    cvs checkout

    cvs update

    cvs add

    cvs remove

    cvs commit

    ```


    ## 1.30. 文件上的这些权限意味着什么？


    `rwxr-xr-x` 所有者、组、其他。


    ## 1.31. 什么是 tar 文件？


    tar 代表磁带归档（Tape Archive）。它最初为磁带备份设计，但现在用于从多个文件创建一个“tar 包”（tarball）。tar 文件是不压缩的，它只是在文件系统中组合在一起的一堆文件。以下是一些示例：


    ```bash

    tar -xvf example.tar - 解压 example.tar 的内容

    tar -cf backup.tar /home/pub - 创建名为 backup.tar 的 tar 文件

    tar -tvf example.tar - 列出 example.tar 的内容

    ```


    ## 1.32. 描述 gzip。


    gzip 是原始的 ZIP 格式。通常先对文件进行“tar”处理然后使用 gzip 进行压缩。这些文件通常赋予 .tar.gz 扩展名，以表示是用 gzip
    压缩的 tar 归档。你可能还会看到 .tgz 扩展名。使用 gzip 压缩的存档与 WinZip 和 PkZip 兼容。因此，在 UNIX 上压缩的文件可以在
    Windows 上上解压。要使用 gzip 压缩文件，执行以下命令：


    ```bash

    gzip filename.tar

    ```

    （其中 `filename.tar` 是你想要压缩的文件名）操作的结果是一个名为 `filename.tar.gz` 的文件。默认情况下，gzip 会删除
    `filename.tar` 文件。


    要使用 gzip 解压缩文件，执行以下命令：


    ```bash

    gzip -d filename.tar.gz

    ```

    操作的结果是一个名为 `filename.tar` 的文件。默认情况下，gzip 会删除 `filename.tar.gz` 文件。你也可以使用以下命令解压缩文件：


    ```bash

    gunzip filename.tar.gz

    ```

    这与使用 `gzip -d` 命令相同。gzip 有许多可以使用的选项。查看该工具的 man 手以获取更多信息。


