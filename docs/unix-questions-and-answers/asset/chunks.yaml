    \ 登录 UNIX 系统的优点是什么？\n\n登录有几个目的，包括让你访问自己的文件和配置。然而，它还能防止你无意中访问他人的文件和设置，并防止你对系统本身进行更改。登录后，你将位于家目录，那里是存储你的个人文件和设置的地方。几乎所有的\
    \ UNIX 系统都需要密码，以帮助确保你的文件和数据属于你自己，并确保系统本身免受破坏者和黑客的侵害。\n\n## 1.61. 创建密码的指南是什么？\n\
    \n除了遵循系统管理员规定的任何密码指南外，你应该选择一个符合以下条件的密码：\n\n- 至少六个字符\n- 对你容易记忆\n- 不是任何语言中任何字典里的单词或名称\n\
    - 大写字母和小写字母、数字和符号的组合\n- 与你的 `userid` 不相似\n- 与你最近使用的密码不相同或相似\n- 不是你的电话号码、出生日期、孩子的生日、纪念日、母亲的娘家姓或任何其他人可能与你联系起来的内容。\n\
    \n## 1.62. 修改密码的指南是什么？\n\n你通常应该在以下情况下多次更改密码：\n\n- 你可能想在第一次登录系统后更改系统管理员提供的密码。\n\
    - 你可能按定期间隔更改密码，因为许多 UNIX 系统要求你隔一段时间更改一次密码——每隔 30 或 60 天一次是常见的。\n- 如果你认为可能可能获了你的密码，或者你告诉了别人密码（尽管你真的不应该这样做），你可能也会主动更改密码。\n\
    \n## 1.63. 你真的能破坏 UNIX 系统吗？\n\n通常情况下，不能。当你登录 UNIX 系统并使用你个人的 `userid` 时，你能做的最坏事情就是删除自己的目录和文件。只要你以自己的身份登录，你输入的命令就不会影响对\
    \ UNIX 系统至重要的内容，只会影响你的个人目录和文件。UNIX 得一分——作为一个普通用户，你无法破坏系统。但对于 Windows 或 Macintosh，情况就是另一了。\n\
    \n如果你有系统管理员权限，意味着你可以以 `root` 身份登录（从而获得访问所有系统目录文件的权限），如果你不极端小心，可能会造成巨大的破坏。出于这个原因。\n\
    \n## 1.64. 在何处使用 `su`？\n\n偶尔，你可能需要 `su` 切换到其他用户。也就是说，在大多数系统上，你可以选择具有不同功能和能力的 shell。\n\
    \n`sh` - 这种 shell 是原始的 UNIX shell（通常称为 Bourne shell），非常适合脚本，但缺乏许多你可能需要的交互式使用的灵活性和威力。例如，它没有命令补全、检查邮件或别名等功能。\n\
    \n`csh` 和 `tcsh` - 这一系列 shell 增加了很多交互式用途，但放弃了 `sh` 提供的流行脚本支持，转而采用类似 C 语言的语法。因为\
    \ C 语法，这种 shell 通常被称为 C shell。\n\n`ksh`、`bash` 和 `zsah` - 这些提供了脚本和交互能力的良好结合，但它们源自不同（`bash`\
    \ 与 `sh` 最相似，因此名为 Bourne Again Shell）。\n\n## 1.65. 什么是管道？\n\n将一个程序的输出连接到另一个程序的输入的过程被称为管道。根据你想做什么，你可以组合任意许多命令。\n\
    \n## 1.66. 常见的目录及其内容是什么？\n\n- `/bin`: 所有用户使用的基本程序和命令。\n- `/etc`: 系统配置文件和全局设置。\n\
    - `/home`: 用户的家目录。\n- `/sbin`: 系统启动所需的程序和命令。\n- `/tmp`: 临时文件\n- `/usr/bin`: 不\
    \ `/bin` 那么核心但随系统安装的命令和程序。\n- `/usr/local`: 在系统上开发或自定义的文件和数据。\n- `/usr/local/bin`:\
    \ 本地开发或安装的程序。\n- `/usr/local/man`: 本地程序的手册。\n- `/usr/share/man`: 手册。\n- `/var`:\
    \ 可更改的数据，包括系统日志、程序的临时数据和用户邮件。\n\n## 1.67. 描述常见的 UNIX shell。\n\n当你访问 UNIX 时，看到的第一个是提示符，称为\
    \ shell 提示符，这是你与 UNIX 系统交互的地方。shell 决定了你多容易输入和重新输入命令，以及你如何控制环境。你并不局限于某一个 shell——也就是说，在大多数系统上，你可以选择具有不同功能和能力的\
    \ shell。\n\n`sed` - `sed` 允许你在不使用编辑器的情况下进行更改。\n\n`awk` - 虽然 `sed` 是面向行的，但 `awk`\
    \ 是面向字段，非常适合处理数据。\n\n"
