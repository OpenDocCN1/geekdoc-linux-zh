  trans: '

    尽管 UNIX 权限模型是一个经过真检验的方案，但它仍然充满了足够的复杂性，让很少系统管理员会对奇怪的用户在他们的机器上漫游感到不安。`chroot` 赋予了他们授予某些用户访问权限，但以这种极其严格的方式限制该访问，使用户无法访问管理员不希望他们的内容。


    在运行系统服务时也经常使用 `chroot`。大多数 UNIX 系统服务以 `root` 用户身份运行。这使得这些服务极受到缓冲区溢出攻击。如果“缓冲区溢出攻击”成功，攻击者将在系统上获得一个
    shell，该 shell 继承了服务所有者（在此例中为 `root`）的权限。然而，如果服务运行在自己的 `chroot` 监狱中，这类攻击造成的损害将降至最低，因为攻击者所拥有的只是一个极其受限的
    shell，而不是整个文件系统。


    ## 1.88. 描述什么是缓冲区溢出攻击并列出可能的防御措施。


    缓冲区溢出攻击可能是计算机安全史上最常见的系统攻破方式。当程序员编写一个预期输入的软件时，该预期的输入会在系统中被分配一个缓冲区。该缓冲区的大小取决于预期数据的大小。如果程序员没有设置检查来验证输入数据的大小，恶意用户就可以发送比缓冲区能分配更多的数据，从而导致溢出。在最好的情况下，这将导致程序内存损坏并使其运行失败。在最坏的情况下，可以在输入数据的溢出部分发送特定的数据，这些数据随后将以程序所有者的权限被执行。对于以
    `root` 身份运行的系统服务，远程缓冲区溢出攻击允许攻击者在系统上以 `root` 用户身份运行任意代码。


    防止缓冲区溢出攻击的真正防御方法是防止其发生。这可以通过完全的代码审计来实现，确保应用程序中的每个数据输入点都执行了恰当的边界检查，以确保只接受可以分配的数据量。在实践中，即使使用现有的代码剖析工具，这也很难以做到。


    常见的做法是将这种攻击视为网络安全领域的任何其他攻击——即假设它会发生，并制定计划识别它并减少损害。识别通常通过检查系统日志、寻找来自系统服务的异常日志项来处理。如果系统被攻破，文件系统完整性工具将告诉您系统上的哪些文件被修改过。通常使用“chroot
    监狱”来最大限度地减少此类攻击可能造成的损害。这已成为一种常见的解决方案，一些流行的服务器程序已经内置了 `chroot` 功能（`sendmail` 就是一个例子）。


    在 Linux 中，有相应的内核模块可以协助防御缓冲区溢出攻击。这些补丁以不同的方式处理此问题，但大多数集中于防止任意代码被插入到栈上并执行，使得传统的缓冲区溢出攻击执行变得困难得多。


    ## 1.89. 任何网络或系统安全中最薄弱的环节是什么？你可以对此做什么？


    人。无论你在最新的防火墙、入侵检测工具、取证分析和物理安全上花费了多少钱，人始终是最弱的环节。这是计算机安全的一项基本规则，每个在该领域工作的人都需要意识到这一点。仅仅拥有一个易猜的密码就可能完全破坏整个组织的安全基础设施。


    这个问题的答案是什么？教育。受过教育的用户的安全风险要小得多。在涉及到用户时，安全是一件微妙的事情：太宽容，他们就会忽略它；太严厉，他们就会尽尽全力绕过它。找到正确的平衡点是一个挑战。这的第一步是教育你的员工。告诉用户为什么要遵守公司的密码策略，而不是在他们不服从时威胁要除掉他们，你可能会获得更好的反响。安全需要成为每个人工作的标准部分。在当今，每个人对公司系统和数据的安全负责。通过让用户知道什么是可以接受的，什么是不可接受的，你将在让你的环境成为一个更安全的地方。


    ## 1.90. 描述什么是文件系统完整性工具并解释其重要性。


    文件系统完整性工具是一种维护系统中所有文件记录的应用程序。该记录将包含每个文件的每个字节数据，包括时间戳、大小、所有者、位置等。系统会定期对比现有文件系统与此记录进行检查。如果文件系统的部分被修改，它将与此记录不匹配，并通知系统管理员。


    这是一个重要的工具，因为**你的系统将会被入侵！** 这不是“是否”的问题，而是“何时”的问题。假设你独自拥有一个无懈可击的安全模型等同于拒绝面对现实。由于某些人为、硬件或软件错误，你的系统将会被攻破。此类事件产生最大的问题是系统管理员发现攻破发生所需花费的时间。有很多故事关于公司在几个月后才发现被攻破了，而攻击者已经偷走了他们所有的数据并利用他们的系统攻击了互联网上的其他系统。


    文件系统完整性工具会在你的系统部分被修改时通知你。这是从入侵中恢复的第一步。


    ## 1.91. 什么是入侵检测系统？在“检测入侵”这一概念中存在哪些基本缺陷？


    “入侵检测系统”（IDS）是监控系统或网络的软件，用于寻找可以被识别为恶意的活动证据。


    目前有多种类型的 IDS 系统。其中最简单的是监控系统日志文件，寻找系统服务生成的任何可疑消息。第二种类型的 IDS 会监控网络或系统的活动，并将发现的内容与“攻击特征”模式进行比对。与杀毒软件类似，这些
    IDS 系统能够在入侵遵循先前的攻击模式时识别出入侵。第三种 IDS 系统也类似于杀毒软件。许多杀毒软件使用启发式分析来识别“看起来像”病毒的程序。以同样的方式，IDS
    可以识别看起来具有恶意但不匹配任何已知恶意模式的系统活动。


    所有这些系统的固有缺陷是，编写一个能够区分“好”活动和“坏”活动的算法非常困难。由于这些系统没有考虑模式的上下文，可能会产生许多误报。一个产生过多误报的 IDS
    系统比完全没有 IDS 系统还要糟糕。


    系统管理员会简单地开始删除所有通知，同时认为他的网络和系统是安全的。


    尽管存在缺陷，如果配置正确并保持更新，IDS 系统可以成为组织整体安全计划中的重要组成。

