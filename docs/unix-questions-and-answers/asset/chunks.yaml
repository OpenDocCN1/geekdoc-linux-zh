    file3     12347


    从理论上说，`/` 和 `\0` 是文件名中不能出现的唯一两个字符——`/` 是因为它用于分隔目录和文件，而 `\0` 是因为它终止文件名。


    不幸的是，某些 `NFS` 的实现会轻率地响应远程机器的请求创建带有嵌入斜杠的文件名。例如，当 Mac 或其他非 Unix 机器上的某决定以日期作为文件名在你的
    Unix 机器上创建一个远程 `NFS` 文件时，你的 Unix 目录中就会出现：


    filename  inode

    91/02/07  12357


    无论如何按照上述方法折腾 `find` 或 `rm`，都无法删除这个文件，因为这些工具以及所有其他 Unix 程序都被强制以普通方式解释 `/`。


    任何普通程序最终都会尝试执行 `unlink("91/02/07")`，对于内核来说，这意味着“取消链接目录 91 下的子目录 02 中的文件 07”，但我们拥有的不是这个——我们在当前目录下有一个名为“91/02/07”的
    `FILE`。这是一个微妙但至关重要的区别。


    在这种情况下你能做什么？首先要尝试的是回到创建这个糟糕条目的 Mac 上，看看是否能说服它和本地的 `NFS` 守护进程将文件重命名为不带斜杠的名字。


    如果这不起作用或不可行，你就需要系统管理员的帮助，他必须尝试以下操作之一。使用 `ls -i` 找到这个伪造文件的 inode 号，然后卸载文件系统并使用
    `clri` 清除 inode，并祈祷着运行 `fsck` 检查系统。这会破坏文件中的信息。如果你想保留它，可以尝试：


    1. 在包含坏文件名文件的同一级父目录下创建一个新目录；

    2. 将旧目录中所有能移动的内容（即除那个坏文件名文件以外的所有内容）移动到新目录；

    3. 对包含坏文件名文件的目录执行 `ls -id` 以获取其 inumber；

    4. `umount` 卸载文件系统；

    5. `clri` 清除包含坏文件名文件的目录；

    6. `fsck` 文件系统。


    然后，为了找到文件，重新挂载文件系统；将你创建的目录重命名为旧目录的名字（因为旧目录应该已经被 `fsck` 删除了），将文件从 `lost+found`
    移动到名字更好的目录中。


    或者，你可以通过在原始文件系统中爬行来硬核地修复该目录。如果你有 `fsdb`，请使用它。


    ## 1.243. 如何获取递归目录列表？


    以下方法可能可以满足你的需求：


    * `ls -R`（并非所有版本的 `ls` 都有 `-R`）

    * `find . -print`（在任何地方都有效）

    * `du -a .`（同时显示名称和大小）


    如果你在寻找一个可以匹配此目录及以下所有 `.c` 文件的通配符模式，你是找不到的，但你可以使用：


    ```

    % some-command `find . -name ‘*.c’ -print`

    ```


    `find` 是一个强大的程序。


    ## 1.244 如何将当前目录放入提示提示符？


    这取决于你使用哪种 shell。对于某些 shell 很容易，而另一些很难或不可能。


    ### C Shell (csh):


    将此内容放入 `.cshrc` - 按照你想要自定义 prompt 变量。


    ```bash

    alias setprompt ‘set prompt=“${cwd}% “‘

    setprompt  # 设置初始提示符

    alias cd ‘chdir \!* && setprompt’

    ```


    如果你使用 `pushd` 和 `popd`，你还需要：


    ```bash

    alias pushd ‘pushd \!* && setprompt’

    alias popd ‘popd  !* && setprompt’

    ```


    某些 C shells 不保留 `$cwd` 变量 - 你可以使用 `pwd` 代替。


    如果你只想在提示符中显示当前目录的最后部分（显示“mail% ” 而不是“/usr/spool/mail% ”），你可以使用：


    ```bash

    alias setprompt ‘set prompt=“${cwd}% “‘

    ```

