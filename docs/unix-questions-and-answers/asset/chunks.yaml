    ## 1.133. In Solaris, what command is used to display the slice information for
    a particular disk?


    `prtvtoc <device>`


    ## 1.134. What command is used to display the disk space occupied by mounted file
    systems?


    `df`


    ## 1.135. What file contains a list of currently mounted file systems?


    `/etc/mtab` (on Linux)


    `/etc/mnttab` (on Solaris)


    ## 1.136. On Solaris, what file contains settings that define the default maximum
    time a password is valid and the default minimum time period before a password
    must be changed?


    `/etc/default/passwd`


    ## 1.137. What command and options would you issue to set the permissions on a
    file to read, write, execute for owner, read and execute for group, and no permissions
    for other?


    `chmod 750 <filename>`


    ## 1.138. What command will display the default file permissions that will be
    assigned when a user creates a file?


    `umask`


    ## 1.139. On Solaris, what command is used to display the “Access Control List”
    entries for a file?


    `getfacl <filename>`


    ## 1.140. What command is used to run an application with a different security
    context than the user’s default? What is the configuration file for this command,
    where programs are listed which defined users can execute with higher privileges?


    `sudo <program>`


    `/etc/sudoers`


    ## 1.141. What file defines the default runlevel of the system and dictates what
    directory holds the startup scripts for that runlevel?


    `/etc/inittab`


    ## 1.142. What command is used to check a filesystem for errors?


    `fsck`


    ## 1.143. Why are there normally two bin directories, /bin and /usr/bin?


    The UNIX filesystem was designed to be shared by multiple systems. In a shared
    environment, it is unnecessary to have data duplication across multiple systems.
    The `/usr` partition on a UNIX system is designed to be shared by clients. This
    is normally accomplished by client systems mounting a server’s `/usr` partition
    as their own. This way, all clients have access to the same programs without a
    system administrator having to maintain copies on multiple systems.


    Because of this fact, files in the `/usr` partition must never be considered critical
    system files. If a client needs to boot up off of the network for some reason,
    they will not have access to their `/usr` partition if it is mounted from a central
    server. If some sort of system repair ability is necessary on a client system,
    that program needs to live in the `/bin` directory. By convention, the `/bin`
    directory is local to every system.


    So the reason there are two bin directories is that `/bin` contains local system-level
    binaries that are critical for the correct operation of the system, while `/usr/bin`
    contains binaries that are less important and not critical to the basic functioning
    of the system.


    ## 1.144. On Solaris, what file defines the master kernel configuration file?


    `/etc/system`


    ## 1.145. At the Solaris OpenBoot prompt, what command will display all of the
    SCSI devices connected to the system?


    `probe-scsi`


    ## 1.146. How do you boot a Solaris system into single user mode?


    1. Get to the OpenBoot prompt by hitting Stop-A

    2. Boot the system with the command `boot -s`


    ## 1.147. What command allows you display and to modify your keyboard mappings
    in X Windows?


    `xmodmap`


    ## 1.148. In Linux, what file contains a list of all IRQs currently in use?


    `/proc/interrupts`


    ## 1.149. You attempt to unmount a currently mounted disk and you receive the
    error “Unable to umount: device or resource busy”. What does this mean and what
    must you do before you can unmount the disk?


    This means that some process is currently accessing the file system you are trying
    to unmount, either through an open file handle or having a process with a current
    working directory in the file system. You first need to identify what processes
    are accessing the file system and who owns those processes. You then must decide
    how to deal with those processes.


    The `fuser` command will display the processes that are accessing a given file
    system. After you have determined what the processes are and who owns them, you
    can either 1) wait until those processes complete before you attempt to unmount
    the disk, 2) contact the user(s) in question to determine the status of the processes,
    or 3) kill the processes and unmount the disk.


    ## 1.150. You need to run the fsck program against a file system, but you must
    do this while the file system is unmounted. Since the file system in question
    is the root file system, you cannot unmount it while the system is running. What
    options do you have for running fsck against this file system?


    There are two ways to get `fsck` to run against this file system when it is not
    mounted.


    Access the disk from a different root partition. This can be done be either removing
    the disk itself and mounting it under another UNIX system, or booting your system
    with a root or rescue disk. Either way, you have access to the `fsck` command
    without relying on your original disk being mounted. You can then `fsck` the drive
    and return the system to its previous state.


    Issue the command `shutdown -r -F now`. The `-F` option to `shutdown` forces the
    system to run `fsck` against the drives defined in `/etc/fstab` (or `/etc/vsftab`)
    before they are mounted on the next reboot. The `-r` options tells shutdown to
    reboot immediately.


    ## 1.151. You have forgotten root’s password. What options do you have to get
    back into the system?


    This answer will be higher-level to cover most flavors of UNIX; individual implementations
    will vary upon the flavor.


    Root’s password is normally stored in encrypted form in `/etc/passwd` or `/etc/shadow`.
    While it is impossible to recover what the password was, you can reset it to a
    null value.


    The first step is to access the root partition without booting to it. You can
    do this by either booting a root rescue disk or removing the disk itself and mounting
    it in another system. By accessing the root file system this way, you are bypassing
    any of the security.


    When you have access to the root partition, locate the encrypted string in `/etc/passwd`
    or `/etc/shadow`. Erase the encrypted string. Save your changes and return the
    system to its normal configuration (if you moved the disk, return it to the system.
    If you booted off a different boot disk, remove it and boot off your original
    disk).


    After rebooting, you should now be able to log in as root without giving a password.
    You can then reset root’s password with the `passwd` command.


    ## 1.152. Your UNIX workstation is unable to ping any hosts on the local TCP/IP
    network. What steps do you take to troubleshoot this problem?


    This kind of question is a very revealing one. How a candidate answers this questions
    will determine their thought process, specifically how they approach a problem
    from a logical standpoint. Ideally, you want a candidate to display knowledge
    of what settings are necessary to enable communication on an IP network, but more
    importantly, you want them to follow the scientific method in diagnosing and resolving
    the problem.


    The following items need to be correct in order to communicate on a local TCP/IP
    network:


    - Some physical connection to the network, whether it be wired or wireless

    - An IP address that is part of the local subnet, but is unique to that subnet

    - A subnet mask that correctly reflects the configuration of the subnet

    - A correct gateway IP address

    - If name resolution is desired, a correct name server must be configured


    From a troubleshooting standpoint, it’s always best to start at the lowest level
    and work your way up. Before you can diagnose this problem, however, more information
    is required. Specifically, the candidate should ask these questions:


    - What is the IP configuration of this subnet?

    - What IP address, subnet mask, gateway and DNS address should be assigned to
    this workstation?

