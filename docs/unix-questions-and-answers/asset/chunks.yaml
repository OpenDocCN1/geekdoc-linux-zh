    - `ReiserFS` – 由 Hans Reiser 开发的日志文件系统。以其速度和扩展性而闻名。在大多数 Linux 发行版中可用。


    ## 1.119. 标准 UNIX 文件权限模型中的三个设置是什么？它们分别是如何应用于文件和目录的？


    对于文件：

    - 读取（Read）——可以打开文件并读取其内容

    - 写入（Write）——可以修改文件

    - 执行（Execute）——可以执行文件


    对于目录：

    - 读取（Read）——可以列出目录中的文件

    - 写入（Write）——可以向目录中添加或删除文件

    - 执行（Execute）——可以执行目录当前内容中的程序


    目录权限稍微有点反直。例如，目录上的“执行”选项能给你带来什么并不而易见，因为你实际上无法“执行”一个目录。这并不意味着你可以执行该内部的二进制文件。如果你对某个目录没有执行权限，例如你将无法列出该目录的内容。因为
    `ls` 命令需要针对目标目录运行，因此 `ls <directory>` 命令会被拒绝。


    关于 UNIX 权限有一个经常被问的问题：“我如何向用户授予‘更改’（change）选项？”UNIX 没有“更改”位，但你可以在现有的权限模型中实现该功能。“更改”意味着你不能删除文件，但可以修改它。为了在
    UNIX 中实现这一点，你首先确保用户对文件本身具有写入权限。这允许他们修改文件。然后，为了确保他们无法删除它，撤销他们对文件所在目录的写入权限。这将防止他们删除文件本身。


    ## 1.120. 什么是 setUID 位？它是如何使用的？


    当一个可执行文件启用 setUID 位时，该文件将以文件所有者的权限执行，而不是父进程的权限执行。这对于允许普通用户运行特权命令而无需赋予其 root 权限非常有用。`setUID`
    通过 `chmod` 命令设置。若要更改可执行文件的权限以设置 setUID 位，使所有者具有读、写、执行权限，组具有读、写权限，其他用户具有读、写权限，请执行以下命令：


    ```bash

    chmod 4755 <filename>

    ```


    ## 1.121. 定义并描述 cron 任务调度系统。定义任务执行时间可用哪些字段？


    ## `Cron` 是 UNIX 默认的任务调度器。Cron 任务按用户定义在 `/var/spool/cron/<username>` 中。该文件列出了每个用户的
    cron 任务，每行一个。每行包含 6 个字段：


    - 字段 1 – 分

    - 字段 2 – 小

    - 字段 3 – 日

    - 字段 4 – 月

    - 字段 5 – 星期

    - 字段 6 – 要运行的程序


    默认情况下，这些调度程序发送到 `STDOUT` 或 `STDERR` 的任何输出都会通过电子邮件发送给用户。


    如何在不删除用户的情况下禁用账户？假设正在使用影子密码（shadow passwords）？


    `passwd -l <username>` 命令将禁用账户。它是通过在 `/etc/shadow` 文件的用户加密密码前加上一个“!”来实现的


    ## 1.122. 在标准的基于 lpr 的 UNIX 打印系统中，哪条命令会显示打印队列的状态？


    `lpq` - 那是一个打印队列检查程序。


    ## 1.123. 描述 Samba 工具套件。它们在异构环境中有什么用？


    Samba 是一个在 UNIX 系统上实现服务器消息块（SMB）协议的软件套件。Microsoft Windows 系统用于文件共享、打印机共享和身份验证的协议。Samba
    服务器软件允许 UNIX 机器作为 Windows 客户端的文件、打印和身份验证服务器。Samba 客户端软件允许 UNIX 机器参与 Windows 网络，访问共享驱动器、向共享打印机打印并对域控制器或
    Active Directory 目录服务器进行身份验证。


    ## 1.124. 描述 Linux 系统可用的包管理选项。


    大多数 Linux 发行版使用 `rpm` 或 `deb` 软件包格式。基于 `rpm` 的发行版包括 RedHat、SuSE 和 Mandrake。基于
    Debian 的发行版使用 `deb` 软件包格式，包括 Debian 本身、Knoppix、Lindows 和 Xandros Linux。这两个系统都提供依赖检查，允许在安装或升级软件时具有某种程度的智能性。


    ## 1.125. 描述 Solaris 上的包管理软件。


    使用 `pkgadd` 命令安装软件。当你收到来自 Sun 的包或从互联网下载包时，你可以使用 `pkgadd -d <package name>` 命令进行安装。要查看
    Solaris 系统上已安装的包列表，运行 `pkginfo` 命令。要列出属于已安装包的文件，运行 `pkgchk -l <package name>`
    命令。


    ## 1.126. 在 UNIX 系统上查找文件的三种方法是什么？


    `which` 命令如果该命令位于由 `$PATH` 环境变量定义的目录，将显示命令的完整路径。`locate` 命令将查询包含文件系统中所有文件列表的哈希数据库。数据库必须定期更新。此命令不是所有
    UNIX 系统的标准部分。`find` 命令可以使用精确匹配或正则表达式匹配在整个分区中搜索文件。


    ## 1.127. 如果 /etc/inittab 定义你的默认运行级别（runlevel）为 3，那么你的系统启动脚本位于哪里？


    `/etc/rc3.d`


    ## 1.128. 你以 root 身份登录并想要杀死 PID 为 1054 的进程。你输入 `kill 1054` 但仍然在进程表中看到它。为什么进程没有死？你可以做什么来消除它？


    不带参数调用时，`kill` 命令本身发送 `TERM` 信号。`TERM` 信号最好被描述为“请求进程结束”。进程可以被配置为捕获并忽略 `TERM` 信号。通过向
    `kill` 传递 `-9` 选项（`kill -9 1054`），你发送的是 `KILL` 信号。这是一个较低级别的信号，告诉内核立即终止进程。这通常用于不响应
    `TERM` 信号而处于循环或等待状态的进程（例如等待一个不再提供的磁盘）。消除这些进程的唯一方法是重启系统。


    UNIX 操作系统的核心是命令行。良好掌握可以使用哪些命令对于操作 UNIX 系统至关重要。同样，由于 UNIX 中的一切皆文件，因此对文件系统的知识至关重要。这些问题可以快速区分
    UNIX 系统管理员和培训生。


    ## 1.129. /etc/passwd 文件定义了哪些字段？


    - 字段 1：用户名

    - 字段 2：加密密码占位符（假设使用影子密码）

    - 字段 3：`UID`（用户标识）

    - 字段 4：`GID`（组标识）

    - 字段 5：注释

    - 字段 6：主目录

    - 字段 7：登录 shell


    ## 1.130. `grep` 命令的目的是什么？


    `grep` 用于在文件中搜索文本字符串。`grep` 代表“全局正则表达式打印”（Global Regular Expression Print）


    ## 1.131. 哪条命令用于显示系统上网络接口的信息？


    `ifconfig`


    ## 1.132. ‘ps’ 命令列出系统当前运行的进程。识别并描述 `ps -aef` 输出中的以下列标题：UID, PID, PPID, TTY


    `UID` = 用户标识，进程的所有者


    `PID` = 进程 ID。每个 UNIX 进程被分配一个唯一的进程 ID。


    `PPID` = 父进程 ID。该进程父进程的 PID。


    `TTY` = 该进程在哪个终端运行。如果 TTY 为“?”，则该进程没有在终端上运行（系统进程或分离进程）。


