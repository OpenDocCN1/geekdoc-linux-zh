    在升级共享库时，你可以在替换它之前对其库进行测试。同样地，如果你的升级程序依赖于共享库，并且在共享库被从其下方替换时可能会崩溃，你可以使用 `LD_LIBRARY_PATH`
    指向一个包含共享库副本的目录，然后你就可以放心地替换系统中的副本了。如果操作失败，你还可以通过将副本移回来撤销操作。


    X11 在构建过程中使用了 `LD_LIBRARY_PATH`。X11 以“bdf”格式分发字体，在构建过程中，它需要将 `bdf`文件“编译”为“pcf”文件。`LD_LIBRARY_PATH`
    用于指向构建库目录，以便在安装共享库之前的构建阶段运行 `bdftopcf`。


    Perl 在安装时，其大部分核心代码可以作为共享库安装。这对于你将 Perl 嵌入到其他程序中的情况非常有用——你可以编译这些程序，让它们使用共享库，从而在运行时节省内存。然而，Perl
    在构建和安装过程的多个点都会使用 Perl 脚本。除非使用 `LD_LIBRARY_PATH` 来引导该过程，否则 `perl` 二进制文件在共享库安装之前无法运行。


    ## 1.42. 使用什么命令可以找到空闲进程？


    `ps`


    ## 1.43. 使用什么命令可以从日志数据中读取？


    `sar`


    ## 1.44. UNIX 中包含哪些类型的文件？


    UNIX 有几种文件：普通文件、目录、符号链接、特殊文件、命名管道 (FIFOs) 和套接字 (sockets)。


    ## 1.45. 什么是普通文件？


    普通文件包含数据字节，组织成线性数组。任何字节或字节序列都可以被读取或写入。读写操作从文件偏移量指定的字节位置开始，该偏移量可以设置为任何值（甚至超出文件末尾）。普通文件存储在磁盘上。无法在文件的中间插入字节（撑开文件）或从中间删除字节（填补间隙）。当字节被写入文件末尾时，文件会逐字节地变大。文件可以缩小或扩大到任何长度，丢弃字节或添加零字节。两个或多个进程可以并发读写同一个文件。结果取决于各个
    I/O 请求发生的顺序，且通常是不可预测的。为了保持顺序，存在文件锁机制和信号量，信号量是进程可以测试和设置的系统级标志。


    ## 1.46. 什么是 i-node？


    文件没有名称；它们有被称为 i-number（节点索引号）的数字。i-number 是 i-node 数组的索引，存储在包含 UNIX 文件系统的每个磁盘区域的开头。每个
    i-node 包含关于一个文件的重要信息。有趣的是，这些信息既不包括名称，也不包括数据字节。它确实包含以下内容：文件类型（普通、目录、套接字等）；链接数；所有者的用户
    ID 和组 ID；三组访问权限——针对所有者、用户组和；；以字节为单位的大小；最后访问、最后修改和状态更改的时间（i-node 本身最后被修改的时间）；以及当然，指向包含文件内容的磁盘块的指针。


    ## 1.47. 描述目录和符号链接。


    由于通过 i-number 引用文件很不方便，因此提供了目录来允许使用名称。在实践中，几乎总是使用目录来访问文件。


    从概念上讲，每个目录由一个两列表组成，一列是名称，另一列是其对应的 i-number。一个名称/i-node 对被称为一个链接。当 UNIX 内核被指示通过名称访问文件时，它会自动在目录中查找
    i-number。然后它获取对应的 i-node，该 i-node 包含了关于文件的更多信息（例如谁可以访问它）。如果需要访问数据本身，i-node 会告诉在磁盘的何处找到它。


    目录几乎就像普通文件，占用一个 i-node 并拥有数据。因此，目录中特定名称对应的 i-node 可能是另一个目录的 i-node。这允许用户将他们的文件组织成
    UNIX 用户熟悉的层级结构。诸如 `memo/july/smith` 的路径指示内核获取当前目录的 i-node 以定位其数据字节，在这些数据字节中找到
    `memo`，获取相应的 i-number，获取该 i-node 以定位 `memo` 目录的数据字节，在其中找到 `july`，获取相应的 i-number，获取
    i-node 以定位 `july` 目录的数据字节，找到 `smith`，最后获取对应的 i-node，即与 `memo/july/smith` 关联的那个一个。


    在遵循相对路径（以当前目录开头的路径）时，内核如何知道从哪里开始？它简单地为每个进程跟踪当前目录的 i-number。当进程更改当前目录时，它必须提供指向新目录的路径。该路径指向一个
    i-number，然后该 i-number 被保存为新当前目录的 i-number。


    绝对路径以 `/` 开头并从根目录开始。内核只需为根目录预留一个 i-number（例如 2）。这在文件系统首次构建时建立。有一个系统调用可以更改进程的根目录（改为
    2）。


    由于目录的双列结构被内核直接使用（无效的目录可能会轻易破坏整个系统），程序（即使由超级用户运行）不能像写文件一样写目录。相反，应使用特殊的系统调用。两个或多个链接在相同或不同的目录中引用同一个
    i-number。这意味着同一个文件可能有多个名称。通过给定路径访问文件时没有歧义，因为只会找到一个 i-number。它可能通过另一个路径找到，但这无关。然而，当从目录中删除链接时，无法立即确定
    i-node 和关联的数据字节是否可以丢弃。这就是为什么 i-node 包含一个链接计数。删除 i-node 的链接只是减少链接计数；当计数归零时，内核丢弃该文件。


    从结构上来说，目录也可以像普通文件一样有多个链接。然而，这增加了扫描整个文件系统的命令的编程难度，因此大多数内核禁止这样做。


    使用 i-number 的多个链接仅在位于同一个文件系统中有效，因为 i-number 只在文件系统中是唯一的。为了解决这个问题，还有符号链接，它将要链接的文件路径放在实际文件的数据部分。这比仅在某处创建第二个目录链接开销更大，但更通用。你不读取和写入这些符号链接文件，而是使用专门的符号链接系统调用。


    ## 1.48. 什么是特殊文件？


    特殊文件通常是某种类型的设备（例如 CD-ROM 驱动器或链路）。有时命名管道也被视为特殊文件。


    设备特殊文件有两种主要类型：块和字符。块特殊文件遵循特定的模型：设备包含固定大小块的数组（例如每个 4096 字节），并使用缓冲区池作为缓存。字符特殊文件不需要遵循任何规则。它们可能以非常小的块（字符）或非常大的块（磁盘轨道）进行
    I/O，因此它们太不规则，无法使用缓冲区缓存。


