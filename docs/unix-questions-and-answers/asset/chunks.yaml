    进程是一个 `OS` 级别的任务或服务。线程运行在进程的“内部”，并且可能是虚拟的或模拟的。通常情况下，线程共享内存等资源，而每个进程都有自己独立的内存区域，且进程需要采取更复杂的步骤来共享资源。线程的另一个名称是“轻量级进程”，用以将其与“重量级”系统进程区分来。


    简而言之，一个进程可以包含多个线程。在大多数多线程操作系统中，进程拥有自己独立的内存地址空间，而线程没有。线程通常共享其父进程的堆。尽管它们共享一个公共堆，但线程有自己的栈空间。这就是为什么一个线程对方法的调用与其他线程的调用保持分离的原因。例如，一个
    `JVM`（`Java Virtual Machine`）运行在主机 `OS` 的单个进程中。`JVM` 中的线程共享该进程的堆；这就是为什么几个线程可能会访问同一个对象。这些描述都是极简化的简化，但在高层面上来说是足够准确的。不同操作系统之间存在许多差异。


    进程是程序的执行，程序包含一组指令，但线程是进程中的单个顺序执行流。单线程允许 `OS` 一时间执行单个任务。线程无非是执行流，而进程无非是一组指令，与程序类似，但程序可以被
    `OS` 自身停止和启动。


    进程和线程的相似之处在于：

    - 共享 CPU

    - 顺序执行

    - 创建子项

    - 如果一个线程被阻塞，下一个线程将像进程一样开始运行。


    不同之处在于：

    - 线程不像进程那样独立。

    - 与进程不同，所有线程都可以访问任务中的每一个内存地址。

    - 线程的设计旨在相互协助，而进程之间可能协助也可能不协助。


    ## 1.4. 轻量级进程和重量级进程有什么区别？


    轻量级进程和重量级进程指的是多处理系统的机制。


    在轻量级进程中，使用线程来划分工作负载。在这里，你会看到一个进程在 `OS` 中执行（针对此应用程序或服务）。该进程将拥有一个或多个线程。该进程中的每个线程共享相同的地址空间。因为线程共享其地址空间，线程之间的通信是简单且高效的。每个线程可以比作重量级场景下的进程。


    在重量级进程中，创建新进程来并行执行工作。在这里（对于同一个应用程序或服务），你会看到多个进程在运行。每个重量级进程都有自己的自己的地址空间。这些进程之间的通信将涉及额外的通信机制，如
    `sockets` 或 `pipes`。


    轻量级进程的优点来自于资源的节约。由于线程使用相同的代码段、数据段和 `OS` 资源，因此使用的总体资源较少。


    缺点是现在你必须确保系统是线程安全的。你必须确保线程不会互相干扰。幸运的是，`C++` 或 `Java` 提供了必要的工具允许你这样做。


    ## 1.5. 什么是协程（fiber）？


    协程是一个执行单元，必须由应用程序手动调度。协程运行在调度它们的线程上下文中。每个线程可以调度多个协程。通常情况下，协程对于良好的多线程应用程序并不提供优势。然而，使用协程可以使得那些设计为调度自己线程的应用程序更易移植。


    ## 1.6. 什么是多任务处理？


    多任务操作系统将可用的处理器时间分配给需要它的进程或线程。该系统设计为抢占式多任务；它为执行的每个线程分配一个处理器时间片。当当前执行的线程时间片耗尽时，它会被挂起，允许另一个线程运行。当系统从一个线程切换到另一个线程时，它会保存被抢占线程的上下文，并恢复队列中下一个线程的保存上下文。


    时间片的长度取决于操作系统和处理器。由于每个时间片都很小（大约 `20` 毫秒），多个线程似乎在同时执行。这在多处理器系统中实际上是事实，其中可执行的线程被分布在可用的处理器之间。然而，在应用程序中使用多个线程时必须小心，因为如果线程过多，系统性能可能会下降。


    ## 1.7. 描述与多线程有关的同步性。


    对于多线程而言，同步是指控制多个线程对共享资源访问的能力。如果没有同步，可能出现一个线程在修改共享变量的同时，另一个线程正处于使用或更新同一个共享变量的途中。这通常会导致严重的错误。


    ## 1.8. 为什么有时需要同步多个线程的操作？


    有时需要同步多个线程的操作，以维护共享资源之间的读或写一致性。


    例如，假设账户余额为 `$500`。


    没有同步的情况下：

    - 假设有两个线程。

    - 线程一读取值 = `$500`

    - 线程二将其更改为 = `$450`

    - 它被 `CPU` 阻塞

    - 线程二读取值 = `$500`。它本应该得到值 `$450`。


    `Java` 通过监器（monitors）实现这一点。`C` 和 `C++` 使用信号量（semaphores）。


    ## 1.9. 什么是互斥（mutex）和信号量（semaphore）？它们有什么区别？


    互斥是一种同步对象，允许只有一个进程或线程访问关键代码块。信号量允许一个或多个进程或线程访问关键代码块。信号量是多个互斥。


    ## 1.10. 如何使方法线程安全？


    证明一个对象是线程安全的是非常的。创建线程对象的主要法则是：“将所有实例变量设为私有，并对所有访问方法同步”。然而，由于性能、架构或实现的需求，这在实践中难以实现。


    ## 1.11. 使用线程的缺点有哪些？讨论由错误的线程编程导致的问题。


    错误的线程编程导致的一些问题包括竞态条件、死锁、活锁、饥饿、忙等和过度锁定。


    竞态条件：当线程没有正确同步时就会发生竞态条件。竞态条件通常发生在两个线程同时访问和更新全局变量时。共享资源的锁不足是竞态的原因之一。竞态会导致不可预测的结果并可能导致完全错误的行为。然而，竞态有时直到
    `JVM`、计算机或其他发生变化影响程序的执行计时才会出现。例如，考虑两个线程简单增加一个初始值为 `5` 的全局变量的情况。增加在机器码中通常需要三次操作：加载、加法和存储。如果第一个线程执行加载，获取值
    `5`，然后被切换出，第二个线程可能也会加载，获取值 `5`，加 `1`，然后存储值为 `6`。然后，控制权返回给获取了值 `5` 的第一个线程；第一个线程将执行加法并将存储为
    `6`。因此，尽管全局变量被增加了两次，但由于线程同步不当，结果是错误的 `6` 而不是 `7`。


