  trans: "\n\n# 死锁\n线程之间竞争资源并在永久的僵局状态下互相等待的状态。死锁意味着两个（或多个）线程无法移动，因为每个线程都在等待另一个线程所持有的锁。例如，线程\
    \ A 持有一个锁，并正在等待由线程 B 持有的另一个锁。同时，线程 B 正在等待线程 A 持有的锁。因此，这两个线程都无法运行，线程处于死锁状态。这是一个非常严重的问题，因为它会导致程序停顿。\n\
    \n活锁产生于死锁。与死锁类似，但线程陷入了无休的抖动中。某些机器具有检测死锁的机制。通常，为了解决死锁，所有线程都会释放它们所有的锁并尝试向前移动。尽管如此，在释放锁后，线程可能会运行产生初始死锁的相同代码，并再次陷入死锁。这种达到死锁、释放锁并返回死锁的过程被称为活锁。尽管线程没有处于死锁状态，但它们已经停止完成其任务。\n\
    \n# 饥饿\n饥饿是指一个未阻塞的线程由于其他线程的不公平行为以及它们的通信方式，永远无法获得调度。\n\n# 忙等待\n忙等待是一种线程问题，它不会阻止程序正常工作，但会影响性能。它发生在线程唤醒后意识到它需要等待某种资源，并继续检查该资源，直到它被切换出。这是一个问题，因为当线程不断检查同一件事时，没有任何有用的操作发生。程序通过使用线程获得的效率可能会在忙等待中丢失。等待资源的线程应该睡眠，直到资源变得可用。这避免了忙等待。\n\
    \n# 过度锁定\n过度锁定是另一个影响性能的问题。考虑以下代码：\n\n```c\nwait(semaphore);\n\n/* value 是一个需要同步访问的全局变量。\
    \ */\n\nvalue++;\n\n/* 许多不需要同步的耗时操作 */\n\n/* … */\n\nsignal(semaphore);\n```\n\
    \n虽然这段代码运行结果是正确的，但它不必要地锁定了资源。它强制耗时代码在不需要的情况下进行串行运行。这可能会导致严重的性能问题，消除使用线程通常能获得的优势。\n\
    \n## 1.12. 什么是死锁？我该如何消除它？\n死锁是多线程程序设计者面临的四种特殊危险之一。这四种危险是：竞态、死锁、活锁和饥饿。这四种情况都无法仅仅通过测试来消除。测试可能指示死锁的存在，但不能依靠它来指示没有死锁。这必须通过良好的设计来实现。\n\
    \n一个有助于良好设计的清晰模型是 CSP 或通信顺序进程（由 Tony Hoare 发明，他也发明了监视器）。CSP 是一种用于描述交互模式的语言。它由优雅的数学理论、一组证明工具和广泛的文献支持。最近的理论工作证明，CSP\
    \ 在 Java 中可以完全可靠地使用。Doug Lea 的书描述了 `JCSP`，这是实现此点的两个库之一。使用 `JCSP`（或另一个库 `CTJ`），可以设计出任何复杂的\
    \ Java 程序，且这些程序被证明是不存在死锁、活锁、竞态或饥饿的。\n\n你必须根据你的特定需求应用以下解决方案；有时可能无法使用其中一个或多个：\n\n\
    - 设计你的程序，使得对线程不安全对象的唯一访问是通过线程安全对象进行的。\n- 产生新线程来处理事务的每个部分。如果每个线程一次只锁定一个对象，就不会发生死锁。\n\
    - 检查并回退：如果你可以测试查看另一个线程是否持有你需要的锁，你可以“回退”而不是锁定它，允许它在再次尝试之前完成事务。这在普通的 Java 锁上无法实现，但你可以尝试编写自己的锁对象来满足这些需求。\n\
    - 超时：如果你编写了自己的锁对象，当经过一定时间后，它可以自动从 `lock` 方法中返回。\n- 最小化或移除同步：如果没有锁，就没有死锁！\n\n##\
    \ 1.13. 多线程和多任务有什么区别？多程序呢？多处理呢？\n多任务（Multitasking）是由单个操作系统运行多个“重量级”进程（任务）。\n\n\
    多线程（Multithreading）是在单条进程/任务/程序中运行多个“轻量级”进程（执行线程）。\n\n多程序（Multiprogramming）本质上是多任务的同义词（多任务意味着共享比\
    \ CPU 更多的资源，而且是更流行的术语）。\n\n多处理（Multiprocessing）涉及使用多个 CPU，在同一个（SMP）或不同的（MPP）主机箱中运行程序。\n\
    \n大多数 Java 实现发现在 SMP 主机上运行时，将会在不同的处理器之间分配线程。\n\n## 1.14. 描述程序、进程、fork、exec、waitpid。\n\
    程序（Program）是位于磁盘文件中的可执行文件。程序被读入内存并由内核执行。\n\n程序的执行实例被称为进程（Process）。每个 UNIX 进程都保证有一个唯一的数字标识符，称为进程\
    \ ID（process ID）。进程 ID 始终是一个非负整数。\n\n有三个主要的函数用于进程控制：`fork`、`exec` 和 `waitpid`。\n\
    \n我们调用 `fork` 来创建一个新进程。新进程是调用者的副本，我们称调用者为父进程，新创建的进程为子进程。然后 `fork` 将新进程的非负进程 ID\
    \ 返回给父进程，向子进程返回 0。由于 `fork` 创建了一个进程，我们说它调用了一次（通过父进程），但返回了两次（在父进程和子进程中）。\n\n`fork`\
    \ 后跟 `exec` 的组合某些操作系统所谓的产生新进程。在 UNIX 中，这两个部分被拆分成独立的函数。\n\n使用 `waitpid`，我们指定我们想要等待的进程（`pid`\
    \ 参数）。`waitpid` 函数还返回子进程的状态（`status` 变量）。我们可以检查它来确定子进程是如何终止的。\n\n```c\nwaitpid(pid,\
    \ &status, 0)\n```\n\n## 1.15. UNIX 中的 fork 是什么？\n`fork()` 函数用于从现有进程创建新进程。新进程被称为子进程，现有进程被称为父进程。你通过通过检查\
    \ `fork()` 的返回值来判断哪是哪个。父进程得到的是子进程的 `pid`（进程 ID），但子进程得到的是 0。\n\n新进程通过从 `fork()`\
    \ 返回开始执行。子进程和父进程几乎相同。父进程从 `fork()` 获取进程 ID。子进程从 `fork()` 获取 0。父进程应该等待子进程退出。\n\n\
    ```cpp\n#include <iostream.h>\n#include <stdlib.h>\n#include <unistd.h>\n#include\
    \ <sys/types.h>\n#include <sys/wait.h>\n\nint main (int argc, char **argv)\n{\n\
    \    int i, pid;\n\n    pid = fork();\n\n    cout << pid << endl;\n\n    for (\
    \ i = 0; i < 5; i++) {\n        cout << getpid() << ‘  ‘ << i << endl;\n    }\n\
    \n    if ( pid ) wait(NULL);\n}\n```\n\n## 1.16. fork 有什么问题？线程如何解决这些问题？\n在传统的\
    \ UNIX 模型中，当进程需要由另一个实体执行操作时，它 fork 出子进程并让子进程执行处理。例如，大多数 UNIX 下的网络服务器都是这样写的。尽管这种范式已经很好了多年，但\
    \ fork 存在问题：\n\nfork 是昂贵的。内存从父进程复制到子进程；所有描述符都在子进程中复制，等等。目前的实现使用一种称为“写时复制”（copy-on-write）的技术，在子进程需要自己的副本之前避免了对父进程数据空间的复制；但无论是否有这种优化，fork\
    \ 都是昂贵的。\n\n"
