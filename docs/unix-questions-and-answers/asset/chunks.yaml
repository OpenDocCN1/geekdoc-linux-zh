  trans: '


    IMAP 代表互联网邮件访问协议（Internet Mail Access Protocol），它允许“客户端”电子邮件程序访问存储在远程位置的消息，就就像这些消息存储在本地计算机上一样。存储在
    IMAP 服务器上的电子邮件可以从家中的台式电脑、办公室的工作站或旅行中的笔记本电脑进行操作，而无需在计算机之间来回传输邮件或文件。


    通常情况下，如果你从一台计算机访问邮件，你会想要使用 POP；如果你需要从多一台计算机（例如办公室电脑和家里电脑）操作邮件，则应该使用 IMAP。下表可以帮助你理解哪种服务更适合你。


    ### POP 服务


    - POP 设计初衷是为了仅使用一台台式电脑的情况，并且在这种情况下运行最好。

    - 通常情况下，消息会被下载到你的台式电脑，然后从邮件服务器上删除。

    - 如果你选择多台机器上处理 POP 邮件，可能会遇到问题：邮件被下载到了某一台机器上，而你又需要在另一台机器上处理它；例如，你可能在工作时需要一份已经下载到家里电脑的消息。

    - 如果你选择 POP 选项“在服务器上保留邮件”（keep mail on server），你的 POP“收件箱”可能会变得非常大且难以管理，邮件操作也可能变得低效且耗时。

    - 如果你有邮件存档，它会保存在你的台式电脑上——你通常在邮件服务器上需要的存储空间很少。


    ### IMAP 服务


    - IMAP 设计用于需要从多台计算机处理电子邮件的情况，例如工作的工作站、家中的台式电脑或旅行时的笔记本电脑。

    - 消息显示在本地计算机上，但保留并存储在邮件服务器上——你可以从任何连接到互联网的计算机处理所有的新旧旧邮件。

    - 你可以在邮件服务器上创建子文件夹来组织你想保留的邮件。


    ## 1.105. 我如何知道我应该使用 IMAP 还是 POP？


    下表可能帮助你决定哪种电子邮件协议更适合你。


    #### 选择 IMAP 的情况：

    - 你需要在多个地点（例如办公室、实验室、家里）访问你的新旧邮件。

    - 你正在使用 POP，并指定将邮件保留在服务器上。

    - 你使用了同步邮件客户端和服务器上邮件的选项。


    #### 选择 POP 的情况：

    - 你在单一地点或单台计算机上处理电子邮件。

    - 当你需要远程检查新邮件时，Web 邮箱（Webmail）对你很好用。

    - 你定期备份邮件消息并进行存档。


    ## 1.106. 描述简单邮件传输协议。


    SMTP（简单邮件传输协议）是一种用于发送和接收电子邮件的 TCP/IP 协议。然而，由于它在接收端队列消息的能力有限，它通常与另外两种协议之一——`POP3`
    或“互联网邮件访问协议”（Internet Message Access Protocol）配合使用，后者允许用户将消息保存在服务器邮箱中，并定期从服务器下载。换句话说，用户通常使用一个使用
    `SMTP` 发送邮件的程序，并使用 `POP3` 或 `IMAP` 接收已经在本地服务器上收的消息。大多数如 `Eudora` 等邮件程序允许你同时指定
    `SMTP` 服务器和 `POP` 服务器。在基于 UNIX 的系统上，`sendmail` 是最广泛使用的电子邮件 `SMTP` 服务器。一个商业软件包
    `Sendmail` 包含一个 `POP3` 服务器，还提供了 Windows NT 版本。


    `SMTP` 通常实现为在传输控制协议端口 `25` 上运行。


    简单邮件传输协议（SMTP）记录在 `RFC 821` 中，是互联网的标准主机间邮件传输协议，传统上运行在 `TCP` 端口 `25` 上。换句话说，UNIX
    用户可以输入 `telnet hostname 25` 并连接到 `SMTP` 服务器（如果存在的话）。


    `SMTP` 使用一种 20 世纪 80 年代流行的非对称请求-响应协议风格，现在仍偶尔可见，最常见于邮件协议中。该协议的设计对计算机或人类都同样有用，尽管对人类来说并不那么宽容。从服务器的角度来看，提供了一套清晰的命令，并在
    `RFC` 中有良好的文档说明。对于人类来说，所有命令都由换行符明确结束，并且 `HELP` 命令列出了所有命令。从发送者的角度来看，命令回复始终以文本行的形式出现，每行都以一个标识操作结果的三位代码开头，接着是一个指示后面还有其他行的延续字符，然后是旨在向人类提供信息的任意文本信息。


    如果邮件交付失败，`sendmail`（最重要的 `SMTP` 实现）会将邮件消息放入队列并在稍后重试发送。然而，它使用退避算法（backoff algorithm），且不存在轮询所有互联网主机以获取邮件的机制，`SMTP`
    不提供任何邮箱功能，也没有邮件传输之外的任何特殊功能。由于这些原因，`SMTP` 不是位于高度不可预测线路（如调制解器）后主机的良好选择。可以指定连接更好的主机作为
    `DNS` 邮件交换器，然后安排中继方案。目前有两种主要的可用配置。一种是在交换主机上配置 `POP` 邮箱和 `POP` 服务器，让所有用户使用支持 `POP`
    的邮件客户端。另一种可能性是安排从交换主机到另一个本地 `SMTP` 交换主机的定期 `SMTP` 邮件传输，后者一直在缓存所有的输出邮件。当然，由于这种解决方案不允许全天候的互联网访问，因此并不受欢迎。


    `RFC 1869` 定义了 `SMTP` 扩展功能，创建了扩展 SMTP（ESSMTP）。`ES` 在定义上是可扩展的，允许向 IANA 注册新的扩展。目前最重要的扩展是交付状态通知（DSN），定义在
    `RFC 1891` 中。


    ## 1.107. 如何配置 Solaris 系统加入 IP 网络？


    这假设 Solaris 系统不是 `NIS/NIS+` 网络的一部分。


    1. `/etc/hosts` 必须包含系统的主机和 IP 地址。

    2. `/etc/hostname.<interface>` 必须包含系统的主机名。<interface>` 是接口，例如

    3. `/etc/hostname.dmfe0`

    4. `/etc/netmasks` 必须包含系统的子网掩码。

    5. 如果使用 `DNS`，`/etc/resolv.conf` 需要包含主 `DNS` 服务器。

    6. `/etc/defaultrouter` 必须包含子网路由器的 IP 地址。


    ## 1.108. 什么是 TCP 序列号预测？如何防止它？


    由于 `TCP` 是可靠协议，每个 `TCP` 包都被分配一个序列号。`TCP` 连接的接收端负责对传入的数据包排序，并在过程中丢失数据包时重新请求。理论上，如果一个第三方系统能够成功欺骗
    `TCP` 会话中的两个系统之一，使其与其而非原始系统通信，那么第三方系统就可以入侵会话。这被称为“会话劫持”（session hijacking）或“中间人”攻击。为了让这种攻击生效，第三方系统必须知道原始系统之间使用的
    `TCP` 排序。如果这种排序是基于已知算法的，确定下一个 `TCP` 序列号就是轻而易举的，这种攻击就会变得更容易。


    这种漏洞直到 2000 年左右才为人知。那时，大多数 UNIX 供应商都为其内核发布了补丁，以确保计算 `TCP` 序列号的算法更加复杂。然而，今天互联网上仍有很多系统容易受到这种攻击的威胁。这个故事的教训是：保持你的系统更新。


    '
- fmt: "\n## 1.109. You have purchased a domain name and setup one of your UNIX servers\
    \ as a DNS server. What entry must you make in your primary zone file to ensure\
    \ that email addressed to your domain is sent to the correct mail server?\n\n\
    The `MX` record is the DNS entry that is responsible for defining the mail server\
    \ for a particular domain. It is recommended that a domain have multiple `MX`\
    \ records for the sake of redundancy.\n\n## 1.110. Associate these common network\
    \ services with their default port numbers: Telnet, SSH, FTP, SMTP, DNS, POP3,\
    \ HTTP, HTTPS, IMAP\n\nObviously, one is not expected to memorize all of the common\
    \ port numbers and services. However, these are common enough that all good UNIX\
    \ system administrators should know them by heart.\n\n- Telnet: `TCP 23`\n- SSH:\
    \ `TCP 22`\n- FTP: `TCP 20` & `TCP 21`\n- SMTP: `TCP 25`\n- DNS: `TCP 53` and\
    \ `UDP 53`\n- POP3: `TCP 110`\n- HTTP: `TCP 80`\n- HTTPS: `TCP 443`\n- IMAP: `TCP\
    \ 143`\n\n## 1.111. What command will display the routing table on a UNIX system?\n\
    \n```\nnetstat -r\n```\n\n## 1.112. Your UNIX system is able to ping other devices\
    \ on the local subnet, but it is unable to ping a device outside of the subnet.\
    \ What could be the problem?\n\nIn order for a host to communicate outside of\
    \ its subnet, it must know the default router address. This error could indicate\
    \ that the default router is not set or is incorrect. If the default router setting\
    \ on the host is correct, then there may be a problem with the router itself.\n\
    \n## 1.113. When you initiate a telnet session to your UNIX system, the connection\
    \ is established, but there is a 20 second or more pause before you see a login\
    \ prompt. What could cause this?\n\nThe telnet server performs a reverse DNS query\
    \ on every IP address that attempts a connection. If `DNS` is configured incorrectly,\
    \ or the `DNS` for the network is down, the server will wait for a `DNS` timeout\
    \ before presenting a login prompt to the telnet client.\n\n## 1.114. Describe\
    \ the default partitioning scheme in Solaris, denoting the slice number, the default\
    \ mount point, and the purpose.\n\n1. `Slice 0` is mounted as the root partition\
    \ (`/`) by default. This is the top level UNIX file system.\n2. `Slice 1` is reserved\
    \ for swap space. The size of this will depend upon the amount of memory and the\
    \ duties the system will perform.\n3. `Slice 2` represents the entire disk and\
    \ is not mounted.\n4. `Slice 3` is mounted as `/export` by default. Commonly used\
    \ to hold exported information, such as user home directories or alternative versions\
    \ of operating system binaries.\n5. `Slice 4` is mounted as `/export/swap` by\
    \ default. This partition is used to provide virtual memory space for client systems.\
    \ `Slice 4` is also commonly mounted as `/opt`.\n6. `Slices 5` is mounted as `/opt`\
    \ by default. This is where packages are installed that are not critical to the\
    \ functioning of Solaris. If `/opt` was mounted already as `Slice 4`, this slice\
    \ is often mounted as `/var`.\n7. `Slice 6` is mounted as `/usr` by default. `/usr`\
    \ contains binaries and libraries that are used by normal system users. `/usr`\
    \ is commonly shared between systems.\n8. `Slice 7` is mounted as `/home`, `/export/home`\
    \ or `/export/spare` by default. Commonly holds user directories or other shared\
    \ information.\n\n## 1.115. Define and describe the following terms related to\
    \ disk management under UNIX: Boot block, Super block, Logical block, Inode\n\n\
    The `boot block` (or master boot record on Intel-based systems) stores the information\
    \ needed to boot the system. The data starts at sector (or cylinder group) `0`\
    \ and can reside on any disk that the hardware is capable of booting from. For\
    \ example, if you’re using Linux on an x86 based system, and your system `BIOS`\
    \ supports booting off of a USB drive, you can use a removable USB drive as your\
    \ boot device.\n\nThe `super block` contains information about the file system\
    \ itself. This information includes:\n1. file system size and status\n2. file\
    \ system label\n3. file system state (`clean`, `dirty`)\n4. logical block size\n\
    \nWithout the `superblock`, the file system is unusable. Because of its importance,\
    \ when a file system is created on a disk, multiple copies of the `superblock`\
    \ are created on different parts of the disk for use in case the main `superblock`\
    \ becomes corrupted.\n\nA `logical block` is the smallest unit of data that can\
    \ be stored on a file system. The size of the `logical block` on a particular\
    \ file system is determined when that file system is created. Common sizes for\
    \ logical blocks are `8K`, `4K`, `2K`, `1K` and `512 bytes`. If you save a file\
    \ that is smaller than the `logical block size`, the file will still take up one\
    \ `logical block` of space.\n\nAn `inode` (or index node) contains all the information\
    \ about a file except the filename. Every UNIX system has an `inode`, containing\
    \ such as:\n1. Type of file (regular, directory, link, special)\n2. Last access\
    \ time, last modified time, creation time\n3. Size of the file\n4. Permissions\
    \ and ownership\n\nThe number of inodes allocated to a file system is fixed at\
    \ the time the file system is created.\n\n  ## 1.116. Describe the processes for\
    \ adding a new disk to a UNIX system.\n\nStep 1: Physically install the hard disk\
    \ in the machine. If it is an IDE disk, ensure that master/slave jumper settings\
    \ are set. If it is a SCSI disk, ensure that unique LUN is used.\nStep 2: Partition\
    \ the disk. Use the `format` command on Solaris or the `fdisk` command on Linux.\n\
    Step 3: Create a file system on the disk. On Solaris and BSD, use the `newfs`\
    \ command. On Linux, use the `mkfs` command appropriate.\nStep 4: If it doesn’t\
    \ already exist, create a mountpoint for the new disk. `mkdir /mnt/newdisk`\n\
    Step 5: Ensure that the disk mounts automatically when the system boots. On Solaris,\
    \ add an entry to `/etc/vfstab`. On BSD and Linux, add an entry to `/etc/fstab`.\n\
    Step 6: Mount the file system. `mount /mnt/newdisk`\n\n## 1.117. What is the difference\
    \ between a regular file system and a journaling file system?\n\nIn today’s world,\
    \ all file systems take advantage of a write cache, meaning that requests to the\
    \ disk are actually written to memory first. The kernel then decides when to flush\
    \ this cache to the disk (normally when there is some level of system downtime).\
    \ This speeds up the overall performance of the system. The problem with this\
    \ method arises when a disk is unmounted or becomes unavailable before the cache\
    \ is flushed. This can happen if power is lost or a system failure occurs. When\
    \ this happens, before the disk can be mounted again, it must be scanned in order\
    \ to analyze the disk and bring it back to a consistent state. With large disks,\
    \ this can take a significant amount of time, during which the system is unavailable.\n\
    \nIn order to address this problem, journaling file systems were developed. By\
    \ borrowing a technology present in the database world for many years (transaction\
    \ logs), a file system is able to recover much more quickly from an unplanned\
    \ failure. Instead of scanning the entire disk, only the transaction log is examined,\
    \ reducing the recovery time from possibly hours to seconds.\n\n## 1.118. Define\
    \ and describe the common UNIX file systems.\n\n- `UFS`: The UNIX file system.\
    \ The original standard for UNIX file systems and the default on BSD and Solaris,\
    \ it is based on the original BSD FAT Fast file system.\n- `JFS`: Journaling file\
    \ system. This file system was developed by IBM and is the default file system\
    \ under AIX. IBM has also ported this file system to Linux.\n- `EXT2`: The standard\
    \ Linux file system. This is a non-journaling file system.\n- `EXT3`: `EXT2` with\
    \ journaling capabilities.\n- `XFS`: Silicon Graphics’ journaling file system.\
    \ XFS is the default file system in IRIX and has also been ported to Linux.\n"
  raw: '## 1.109. You have purchased a domain name and setup one of your UNIX servers
    as a DNS server. What entry must you make in your primary zone file to ensure
    that email addressed to your domain is sent to the correct mail server?


    The MX record is the DNS entry that is responsible for defining the mail server
    for a particular domain. It is recommended that a domain have multiple MX records
    for the sake of redundancy.


    ## 1.110. Associate these common network services with their default port numbers:
    Telnet, SSH, FTP, SMTP, DNS, POP3, HTTP, HTTPS, IMAP


    Obviously, one is not expected to memorize all of the common port numbers and
    services. However, these are common enough that all good UNIX system administrators
    should know them by heart.


    Telnet: TCP 23


    SSH: TCP 22


    FTP: TCP 20 & TCP 21


    SMTP: TCP 25


    DNS: TCP 53 and UDP 53


    POP3:         TCP 110


    HTTP:         TCP 80


    HTTPS:       TCP 443


    IMAP: TCP 143


    ## 1.111. What command will display the routing table on a UNIX system?


    netstat -r


    ## 1.112. Your UNIX system is able to ping other devices on the local subnet,
    but it is unable to ping a device outside of the subnet. What could be the problem?


    In order for a host to communicate outside of its subnet, it must know the default
    router address. This error could indicate that the default router is not set or
    is incorrect. If the default router setting on the host is correct, then there
    may be a problem with the router itself.


    ## 1.113. When you initiate a telnet session to your UNIX system, the connection
    is established, but there is a 20 second or more pause before you see a login
    prompt. What could cause this?


    The telnet server performs a reverse DNS query on every IP address that attempts
    a connection. If DNS is configured incorrectly, or the DNS for the network is
    down, the server will wait for a DNS timeout before presenting a login prompt
    to the telnet client.


    ## 1.114. Describe the default partitioning scheme in Solaris, denoting the slice
    number, the default mount point, and the purpose.


    1         Slice 0 is mounted as the root partition (/) by default. This is the
    top level UNIX file system.


    2         Slice 1 is reserved for swap space. The size of this will depend upon
    the amount of memory and the duties the system will perform.


    3         Slice 2 represents the entire disk and is not mounted.


    4         Slice 3 is mounted as /export by default. Commonly used to hold exported
    information, such as user home directories or alternative versions of operating
    system binaries.


    5         Slice 4 is mounted as /export/swap by default. This partition is used
    to provide virtual memory space for client systems. Slice 4 is also commonly mounted
    as /opt.


    6         Slices 5 is mounted as /opt by default. This is where packages are installed
    that are not critical to the functioning of Solaris. If /opt was mounted already
    as Slice 4, this slice is often mounted as /var.


    7         Slice 6 is mounted as /usr by default. /usr contains binaries and libraries
    that are used by normal system users. /usr is commonly shared between systems.


    8         Slice 7 is mounted as /home, /export/home or /export/spare by default.
    Commonly holds user directories or other shared information.


    ## 1.115. Define and describe the following terms related to disk management under
    UNIX: Boot block, Super block, Logical block, Inode


    The boot block (or master boot record on Intel-based systems) stores the information
    needed to boot the system. The data starts at sector (or cylinder group) 0 and
    can reside on any disk that the hardware is capable of booting from. For example,
    if you’re using Linux on an x86 based system, and your system BIOS supports booting
    off of a USB drive, you can use a removable USB drive as your boot device.


    The super block contains information about the file system itself. This information
    includes:


    1. file system size and status


    2. file system label


    3. file system state (clean, dirty)


    4. logical block size


    Without the superblock, the file system is unusable. Because of its importance,
    when a file system is created on a disk, multiple copies of the superblock are
    created on different parts of the disk for use in case the main superblock becomes
    corrupted.


    A logical block is the smallest unit of data that can be stored on a file system.
    The size of the logical block on a particular file system is determined when that
    file system is created. Common sizes for logical blocks are 8K, 4K, 2K, 1K and
    512 bytes. If you save a file that is smaller than the logical block size, the
    file will still take up one logical block of space.


    An inode (or index node) contains all of the information about a file except the
    filename itself. Every file on a UNIX system has an inode, containing information
    such as:


    1         Type of file (regular, directory, link, character special, etc)


    2         Last access time, last modified time, creation time


    3         Size of the file


    4         Permissions and ownership of the file


    The number of inodes allocated to a file system is fixed at the time the file
    system is created. If this number is exceeded, no new files can be created on
    the file system, even if there is free space available.


    ## 1.116. Describe the processes for adding a new hard disk to a UNIX system.


    Step 1: Physically install the hard disk in the machine. If it is an IDE disk,
    ensure that the proper master/slave jumper settings are set. If it is a SCSI disk,
    ensure that a unique LUN is used and that termination on the SCSI chain is correct.


    Step 2: Partition the disk. Use the ‘format’ command on Solaris or the ‘fdisk’
    command on Linux or BSD systems.


    Step 3: Create a file system on the disk. On Solaris and BSD, use the ‘newfs’
    command. On Linux, use the ‘mkfs’ command appropriate for the file system type
    (ie mke2fs, mkreiserfs, etc).


    Step 4: If it doesn’t already exist, create a mountpoint for the new disk. mkdir
    /mnt/newdisk


    Step 5: Ensure that the disk mounts automatically when the system boots. On Solaris,
    add an entry to /etc/vfstab. On BSD and Linux, add an entry to /etc/fstab.


    Step 6: Mount the file system. mount /mnt/newdisk


    ## 1.117. What is the difference between a regular file system and a journaling
    file system?


    In today’s world, all file systems take advantage of a write cache, meaning that
    requests to write to the disk are actually written to memory first. The kernel
    then decides when to flush this cache to the disk (normally when there is some
    level of system downtime). This speeds up the overall performance of the system.
    The problem with this method arises when a disk is unmounted or becomes unavailable
    before the cache is flushed. This can happen if power is lost or a system failure
    occurs. When this happens, before the disk can be mounted again, it must be scanned
    in order to analyze the disk and bring it back to a consistent state. With large
    disks, this can take a significant amount of time, during which the system is
    unavailable.


    In order to address this problem, journaling file systems were developed. By borrowing
    a technology present in the database world for many years (transaction logs),
    a file system is able to recover much more quickly from an unplanned failure.
    Instead of scanning the entire disk, only the transaction log is examined, reducing
    the recovery time from possibly hours to seconds.


    ## 1.118. Define and describe the common UNIX file systems.


    · UFS – The UNIX file system. The original standard for UNIX file systems and
    the default on BSD and Solaris, it is based on the original BSD FAT Fast file
    system.


    · JFS – Journaling file system. This file system was developed by IBM and is the
    default file system under AIX. IBM has also ported this file system to Linux.


    · EXT2 – The standard Linux file system. This is a non-journaling file system.


    · EXT3– EXT2 with journaling capabilities.


    · XFS – Silicon Graphics’ journaling file system. XFS is the default file system
    in IRIX and has also been ported to Linux.'
