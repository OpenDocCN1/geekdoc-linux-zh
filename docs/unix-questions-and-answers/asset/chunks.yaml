    ## 1.38. How do you get a long listing of all files in a directory sorted in reverse
    order by time?


    `ls -lta`


    Look at your system’s `<errno.h>` header and see how it defines `errno`. Something
    like the following is typical:


    ```c

    #ifdef _REENTANT

    #define errno (*errno())

    #else

    extern int errno;

    #endif

    ```


    ## 1.39. What are shared libraries?


    Shared libraries are libraries that are loaded by programs when they start. When
    a shared library is installed properly, all programs that start afterwards use
    the new shared library. It is actually much more flexible and sophisticated than
    this, because the approach used by Linux permits you to:

    - update libraries and still support programs that want to use older, non-backward-compatible
    versions of those libraries;

    - override specific libraries or even specific functions in a library when executing
    a particular program.

    - do all this while programs are using existing libraries.


    ## 1.40. What is LD_LIBRARY_PATH used for?


    `LD_LIBRARY_PATH` is an environment variable you set to give the run-time shared
    library loader (`ld.so`) an extra set of directories to look for when searching
    for shared libraries. Multiple directories can be listed, separated with a colon
    (`:`). This list is prepended to the existing list of compiled-in loader paths
    for a given executable, and any system default loader paths. For security reasons,
    `LD_LIBRARY_PATH` is ignored at runtime for executables that have their setuid
    or setgid bit set. This severely limits the usefulness of `LD_LIBRARY_PATH`.


    ## 1.41. Why was LD_LIBRARY_PATH invented?


    There were a couple good reasons why it was invented:

    - To test out new library routines against an already compiled binary (for either
    backward compatibility or for new feature testing).

    - To have a short term way out in case you wanted to move a set of shared libraries
    to another location.


    As an often unwanted side effect, `LD_LIBRARY_PATH` will also be searched at link
    (`ld`) stage after directories specified with `-L` (also if no `-L` flag is given).
    Some good examples of how `LD_LIBRARY_PATH` is used:

