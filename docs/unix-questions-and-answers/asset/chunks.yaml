    Sometimes, when a program stops prematurely as a result of an error, or when the
    user presses the `<Break>` key, the terminal stops echoing. To restore the terminal
    to normal operation, enter the following: `<Ctrl>q<Ctrl>j stty sane <Ctrl>j`.
    The `<Ctrl>q` unlocks any previous `<Ctrl>s` (which suspends output), and `<Ctrl>j`
    is the same as the enter/return key. The terminal should now display keyboard
    input.


    ## 1.226. How can all the files ending in “.foo” in a directory be renamed to
    end in “.bar”?


    Assuming Bourne shell syntax, here is one way:


    ```bash

    for x in *.foo; do base=`basename $x .foo`; mv $x $base.bar; done

    ```


    ## 1.227. Why wouldn’t the administrator be able to unmount a filesystem?


    No files can be open in the filesystem at unmount time. Additionally, all users
    must `cd` out of the filesystem. Until no processes are using data in the file
    system, it cannot be unmounted. The `lsof` (LiSt Open Files) can be helpful in
    such a situation, as can the `kill` command.


    The following shells are installed on a UNIX system:


    `/bin/ash` `/bin/bash` `/bin/csh` `/bin/ksh` `/bin/pdksh`


    `/bin/sash` `/bin/sh` `/bin/smrsh`


    `/bin/tcsh` `/bin/zsh`


    ## 1.228. Which of these shells will natively run Bourne shell scripts?


    `ash`, `bash`, `ksh`, `pdksh`, `sh` will run scripts written for the Bourne shell.
    `zsh` may run these scripts with modifications to its environment. It is rare
    to see all of these shells installed on a UNIX system.


    ## 1.229. What function is used to delete a file within C?


    The `unlink` function, with the single argument of the pathname to be deleted,
    that is, `unlink("/home/luser/deleteme");`.


    ## 1.230. What is the basic function used to get information about a file (permissions,
    owner, size, etc.)?


    The `stat()` function and its derivatives return detailed information about a
    file in a `stat` structure. The `stat` structure contains the permissions, inode
    number, filesystem device number, device number for special files, number of links,
    `uid` of the owner, `gid` of the owner, size in bytes, times for last access,
    modification, file status change, best I/O block size, and the number of blocks
    allocated for the file.


    ## 1.231. What function is used to create a named pipe?


    The `mkfifo()` function can be used to create a named pipe. This is a file to
    which processes can be connected to exchange information, which the following
    shell commands demonstrate:


    ```bash

    $ mkfifo /tmp/fifo

    $ echo -e ''hello \n how are you \n goodbye'' > /tmp/fifo & [1] 123

    $ grep h /tmp/fifo

    hello

    how are you

    ```


    In the above command, the “echo” was able to communicate with the “grep” through
    the named pipe (`/tmp/fifo`).


    ## 1.232. How can a C program set a timer to alert itself after a certain interval
    has passed?


    A timer can be set with the `alarm()` function. The number of seconds until the
    alarm is desired is passed as an argument. When the time expires, the process
    is sent the `SIGALRM` signal.


    ## 1.233. How can a C program catch a signal? How can a Bourne shell script catch
    a signal?


    The `signal()` function, which is part of ANSI C (not just UNIX C), enables an
    arbitrary function to be called when a desired signal is received. The Bourne
    shell `trap` command serves a similar purpose.


    ## 1.234. What information does the size command report about a command object
    file?


    The `size` command reports the size of the text, data, and bss segments for a
    program.


    ## 1.235. When the `fork()` function splits one process into two, what is the
    return value for the parent, and what is the return value for the child?


    Assuming success, the child receives zero, and the parent receives the `PID` of
    the child.


    ## 1.236. What is the difference between `fork()` and `vfork()`?


    A call to `fork()` will make copies of the data, bss, stack, and heap segments
    of a program (the address space). If the child intends to replace itself with
    another process using an `exec()` function, the duplication of these data segments
    is both unnecessary and time-consuming. A call to `vfork()` puts the parent to
    sleep until the child has exited, and it causes the child to run in the same process
    space as the parent, neglecting the requirement to duplicate the address space.


    ## 1.237. What is a zombie process, and how is it avoided?


    When a process exits, it is the responsibility of the parent to call one of the
    `wait()` functions to read the process return value. The dying child process gives
    up all its memory, but the kernel must maintain at least the `PID`, the termination
    status, and the amount of CPU time that the process consumed. If the parent does
    not call `wait()`, the kernel is forced to retain this information, and reflects
    this with “zombie” or “defunct” processes in the process list.


    ## 1.238. Other than signals, pipes, and files of any sort, what mechanisms are
    available to UNIX processes that enable them to exchange information?


    Inter-Process Communication (IPC) under UNIX includes message queues, which allow
    small messages to be exchanged between processes; semaphores, which can be used
    to control access to a shared resource; and shared memory.


    ## 1.239. What is the difference between `fopen()` and `open()`?


    The `fopen()` function is defined in ANSI C as a portable method for input and
    output; The `open()` function returns a “file descriptor,” which is a lower-level
    read() system call.


    ## 1.240. What is `mmap()`, and why is it better than `read()`?


    The `mmap()` function maps a section of a file into memory, allowing faster access
    because the kernel is not forced to copy the file.


    ## 1.241. How do I remove a file whose name begins with `-`?


    Figure out some way to name the file so that it doesn’t begin with a dash. The
    simplest answer is to use `./-filename` (assuming `-filename` is in the current
    directory.) This method of avoiding the interpretation of the `-` works with other
    commands too. Many commands, particularly those that have been written to use
    the `getopt(3)` argument parsing routine, accept a `--` argument which means “this
    is the last option, anything after this is not an option”, so your version of
    rm might handle `rm -- -filename`. Some versions of rm that don’t use `getopt()`
    treat a single `-` in the same way, so you can also try `rm - -filename`.


    ## 1.242. How do I remove a file with funny characters in the filename?


    If the ‘funny character’ is `/`, skip to the last part of this answer. If the
    funny character is something else, such as a control character or character with
    8th bit set, keep reading.


    The classic answers are `rm -i some*pattern*that*matches*only*the*file*want` which
    asks you whether you want to remove each file matching the indicated pattern;
    depending on your shell, this may not work if the filename has a character with
    the 8th bit set (the shell may strip that off); and `rm -ri .` which asks you
    whether to remove each file in the directory. Answer “y” to the problem file and
    “n” to everything else. Unfortunately this doesn’t work with many versions of
    rm. Also unfortunately, this will walk through every subdirectory of `.`, so you
    might want to `chmod a-x` those directories temporarily to make them unsearchable.


    Always take a deep breath and think about what you’re doing and double check what
    you typed when you use rm’s `-r` flag or a wildcard on the command line; and `find
    . -type f ... -ok rm ''{}'' \;` where `...` is a group of predicates that uniquely
    identify the file. One possibility is to figure out the inode number of the problem
    file (use `ls -i .`) and then use `find . -inum 12345 -ok rm ''{}'' \;`.

