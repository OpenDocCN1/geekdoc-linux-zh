    访问网页版 Basandra Books：[http://books.basandra.com/


    ## 前言


    几年前，我们基本上可以挑选自己想要的工作。如果不满意，我们就跳槽。工作流动性是当时的常态。而现在，在太多的情况下，外包、缩减和/或规模调整似乎成了新的常态。工作的稳定性往往仅仅是字典里的一个词汇。


    这本书将使你能够战胜竞争对手。你的竞争对手是所有试图获得与你想要相同工作的人。让我们面对现实，对你来说，每个工作只有一个人能获得。至于你想要的工作，你希望那个人是你，而不是他们。如果你策略得当，尽力而为，做好准备，并且永不放弃，你就会成功。这就是这本书的意义……准备与成功。


    市场上有很多大量的常见问题解答（FAQs）、问答、文章、书籍等，涵盖了几乎所有想象到的主题，然而，从面试的角度来看，当你没有多少时间时，复习所有这些材料是不行的。随着技术的演进如此迅速，即使是最知识丰富的专业人士，也很以自信和精确的答案回答棘手的技术和管理问题来应对工作面试。在涉及
    `UNIX`、网络等此类至关重要的新就业机会领域时，尤其如此。这本书将使你能够胜任任何技术面试，因为它为广泛的重要领域中具有挑战性和困难的问题提供了答案。本书的核心目标是涵盖所有
    `UNIX` 开发人员、设计人员、管理员和架构师在工作中工作或在面试中表现优异时应该熟悉的所有概念和领域。面试官也可以根据他们的需求使用这本书来确保聘佣合适的候选人。


    `UNIX 问答`是一本一站参考书，初级和资深软件工程师都可以在技术面试和无数的工作中成功使用。本书提供了从最简单到最复杂的关键答案，旨在让你在需要信息时立即获取所需。你将在书中找到对关键
    `UNIX` 问题的有用解释。


    `UNIX 问答`包含了许多真实世界的示例和案例研究，是涵盖了 `UNIX` 所有领域的不可或缺的指南。这是一个实用的且持续有效的资源，基于作者超过 30
    年的开发和管理经验，理解基础 `UNIX` 问题并实施可行的解决方案。


    书中总共有约 300 个带有详细答案的问题，因此你不必担心花费无数小时时间浏览网络或教科书来寻找让你成功的正确答案。这本书不是一本多选题问答书，因为我们认为我们需要对概念和原理有深入的理解，以便以软件工程师、管理员或架构师的身份更好地工作。书中还未包含任何无关材料，以避免过于厚重。


    涵盖的关键议题包括：`UNIX 基础`、`UNIX 内核`、实用程序、文件结构和目录、Shell 基础、Shell 命令、Shell 编程、Shell 脚本、线程与进程、命令、网络、套接字、协议、局域网、`TCP/IP`、系统管理、网络管理、UNIX
    任务管理、用户环境、性能调优、安装与配置、术语表、缩写词、可视化编辑器、`Makefile`、`sed`、`awk`、正则表达式、邮件、`Linux` 等。


    在最新版本中，我们展示了对清晰、直接写作的承诺，问题简洁、切题并强调 `UNIX` 的核心要素。想要了解更多职业知识的人，以及想要精炼开发技能的人，将发现这是一种简单的问答格式，涵盖了数百个涵盖关键
    `UNIX` 知识领域的问题。无论你是资深专业人士、新手、学生还是 `UNIX` 教师，你都会因为这本书丰富的内容以及测试你技能和知识的能力而赞赏它。


    如果你不是 100%的满意，只需退书即可——但我请求你请提供宝贵的改进建议，因为我坚信持续改进。作者之前的书籍已售出 20 万册。


