- fmt: "\nA process is an `OS`-level task or service. A thread runs “inside” a process\
    \ and may be virtual or simulated. Generally speaking, threads share resources\
    \ like memory, where processes each have their own separate memory area, and need\
    \ to take more elaborate steps to share resources.  Another name for thread is\
    \ “light-weight process” to distinguish it from the “heavyweight” system processes.\n\
    \nIn a nutshell, a process can contain multiple threads. In most multithreading\
    \ operating systems, a process gets its own memory address space; a thread does\
    \ not. Threads typically share the heap belonging to their parent process. Even\
    \ though they share a common heap, threads have their own stack space. This is\
    \ how one thread’s invocation of a method is kept separate from another’s. For\
    \ instance, a `JVM` (`Java Virtual Machine`) runs in a single process in the host\
    \ `OS`. Threads in the `JVM` share the heap belonging to that process; that is\
    \ why several threads may access the same object. This is all a gross oversimplification,\
    \ but it is accurate enough at a high level. Lots of details differ between operating\
    \ systems.\n\nProcess is a execution of a program and program contains set of\
    \ instructions but thread is a single sequence stream within the process. Single\
    \ thread allows a `OS` to perform single task at a time.  Thread is nothing but\
    \ flow of execution whereas process is nothing but a group of instructions which\
    \ is similar to that of a program except which may be stopped and started by the\
    \ `OS` itself.\n\nSimilarities between process and threads are:\n- Share CPU\n\
    - Sequential execution\n- Create child\n- If one thread is blocked then the next\
    \ will be started to run like process.\n\nDissimilarities:\n- Threads are not\
    \ independent like process.\n- All threads can access every address in the task\
    \ unlike process.\n- Threads are designed to assist one another and process might\
    \ or might not be assisted on one another.\n\n## 1.4. What is the difference between\
    \ a lightweight and a heavyweight process?\n\nLightweight and heavyweight processes\
    \ refer the mechanics of a multi-processing system. \n\nIn a lightweight process,\
    \ threads are used to divide the workload. Here you would see one process executing\
    \ in the `OS` (for this application or service.) This process would possess one\
    \ or more threads. Each of the threads in this process shares the same address\
    \ space. Because threads share their address space, communication between the\
    \ threads is simple and efficient. Each thread could be compared to a process\
    \ in a heavyweight scenario.\n\nIn a heavyweight process, new processes are created\
    \ to perform the work in parallel. Here (for the same application or service),\
    \ you would see multiple processes running. Each heavyweight process contains\
    \ its own address space. Communication between these processes would involve additional\
    \ communications mechanisms such as `sockets` or `pipes`.\n\nThe benefits of a\
    \ lightweight process come from the conservation of resources. Since threads use\
    \ the same code section, data section and `OS` resources, less overall resources\
    \ are used.\n\nThe drawback is now you have to ensure your system is thread-safe.\
    \ You have to make sure the threads do not step on each other. Fortunately, `C++`\
    \ or `Java` provides the necessary tools to allow you to do this.\n\n## 1.5. What\
    \ is a fiber?\n\nA fiber is a unit of execution that must be manually scheduled\
    \ by the application. Fibers run in the context of the threads that schedule them.\
    \ Each thread can schedule multiple fibers. In general, fibers do not provide\
    \ advantages over a well-designed multithreaded application. However, using fibers\
    \ can make it easier to port applications that were designed to schedule their\
    \ own threads.\n\n## 1.6. What is multitasking?\n\nA multitasking operating system\
    \ divides the available processor time among the processes or threads that need\
    \ it. The system is designed for preemptive multitasking; it allocates a processor\
    \ time slice to each thread it executes. The currently executing thread is suspended\
    \ when its time slice elapses, allowing another thread to run. When the system\
    \ switches from one thread to another, it saves the context of the preempted thread\
    \ and restores the saved context of the next thread in the queue.\n\nThe length\
    \ of the time slice depends on the operating system and the processor. Because\
    \ each time slice is small (approximately `20` milliseconds), multiple threads\
    \ appear to be executing at the same time. This is actually the case on multiprocessor\
    \ systems, where the executable threads are distributed among the available processors.\
    \ However, you must use caution when using multiple threads in an application,\
    \ because system performance can decrease if there are too many threads.\n\n##\
    \ 1.7. Describe synchronization with respect to multithreading.\n\nWith respect\
    \ to multithreading, synchronization is the capability to control the access of\
    \ multiple threads to shared resources. Without synchronization, it is possible\
    \ for one thread to modify a shared variable while another thread is in the process\
    \ of using or updating the same shared variable. This usually leads to significant\
    \ errors.\n\n## 1.8. Why is it sometimes necessary to synchronize the actions\
    \ of multiple threads?\n\nIt is sometimes necessary to synchronize the actions\
    \ of multiple threads to maintain read or write consistency between shared resources.\n\
    \nFor example, say, account balance is `$500`.\n\nWithout synchronize:\n- Assume\
    \ two threads.\n- Thread one reads the value = `$500`\n- Thread two changes it\
    \ to = `$450`\n- It gets blocked by `CPU`\n- Thread two reads the value = `$500`.\
    \ It should have got the value `$450`.\n\n`Java` implements this by monitors.\
    \ `C` and `C++` use `semaphores`.\n\n## 1.9. What are mutex and semaphore? What\
    \ is the difference between them?\n\nA mutex is a synchronization object that\
    \ allows only one process or thread to access a critical code block. A semaphore\
    \ on the other hand allows one or more processes or threads to access a critical\
    \ code block. A semaphore is a multiple mutex.\n\n## 1.10. How do you make methods\
    \ thread-safe?\n\nIt is very difficult to prove that an object is thread-safe.\
    \ The main rule of thumb for making thread-safe objects is, “Make all the instance\
    \ variables private, and all the accessor methods synchronized.” However, this\
    \ is sometimes difficult to achieve in practice, due to exigencies of performance,\
    \ architecture, or implementation.\n\n## 1.11. What are the disadvantages of using\
    \ threads? Discuss some problems that can result from incorrect thread programming.\n\
    \nSome problems resulting from incorrect thread programming are race conditions,\
    \ deadlock, livelock, starvation, busy waiting, and over-locking.\n\nRace: A race\
    \ condition happens when threads are not correctly synchronized. Race conditions\
    \ often occur when two threads are accessing and updating a global variable at\
    \ the same time. deficient locking of shared resources is one of the causes of\
    \ races. Races cause unpredictable results and may cause quite incorrect behavior.\
    \ However, races sometimes don’t show up until the `JVM`, computer or other thing\
    \ changes so as to affect the timing of the program execution. For example, consider\
    \ the case where two threads simply increment a global variable that initially\
    \ has the value `5`. Incrementing often requires three operations in machine code:\
    \ a load, an addition, and a store. If the first thread does a load, obtains the\
    \ value `5`, and then gets swapped out, the second thread might also do the load,\
    \ obtain the value `5`, add `1`, and then store the value as `6`. Then, the control\
    \ would return to the first thread that obtained the value `5`; the first thread\
    \ would do the addition and also store the value as `6`. Thus, even though the\
    \ global variable was incremented twice, the result is incorrectly `6` and not\
    \ `7` because of poor thread synchronization.\n"
