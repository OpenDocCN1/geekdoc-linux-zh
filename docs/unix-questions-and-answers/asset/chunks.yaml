  raw: 'The ARP (Address Resolution Protocol) cache on a system is what translates
    IP addresses to MAC addresses on a local TCP/IP network. It is relatively easy
    to spoof ARP replies, meaning that if one system on your network is compromised,
    that system can spoof other systems on the network easily. Your server will think
    that it is connecting to a trusted host, when in reality it is connecting to the
    compromised system, or even worse, another host on the Internet.


    To prevent this from happening, you can define a list of systems that your server
    must trust. In the file /etc/ethers, you can hard code the MAC address to IP address
    mapping of these systems, preventing ARP from overriding this information. This
    disadvantage of this approach is that if the network card changes in any of these
    systems, the MAC address will change as well, meaning this file must be updated.


