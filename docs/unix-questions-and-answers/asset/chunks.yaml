  trans: "\n\n一些 Shell 拥有自己的变量替换功能，因此与其使用 `basename`，你可以使用更简单的循环，例如：\n\n### C Shell:\n\
    ```bash\nforeach f ( *.foo )\n    mv $f $f:r.bar\nend\n```\n\n### Korn Shell:\n\
    ```bash\nfor f in *.foo; do\n    mv $f ${f%foo}bar\ndone\n```\n\n如果你没有 `basename`\
    \ 或者想执行类似将 `foo.*` 重命名为 `bar.*` 的操作，你可以使用 `sed` 等工具通过其他方式分离原始文件名，但通用的循环思路是相同的。你也可以用\
    \ `sed` 将文件名转换为 `mv` 命令，并将命令交给 `sh` 执行。尝试：\n\n```bash\nls -d *.foo | sed -e ‘s/.*/mv\
    \ & &/’ -e ‘s/foo$/bar/’ | sh\n```\n\n一个由 Vladimir Lanin 编写的名为 `mmv` 的程序可以很好地完成这项工作，它于\
    \ 1990 年 4 月发布在 comp.sources.unix（第 21 ，第 87 和 88 期）。它让你可以使用：\n\n```bash\nmmv\
    \ ‘*.foo’ ‘=1.bar’\n```\n\n上述 Shell 循环也可以用于将文件名从大写转换为小写（或反之）。你可以使用类似下面的代码将大写文件重命名为小写文件：\n\
    \n### C Shell:\n```bash\nforeach f ( * )\n    mv $f `echo $f | tr ‘[A-Z]’ ‘[a-z]’`\n\
    end\n```\n\n### Bourne Shell:\n```bash\nfor f in *; do\n    mv $f `echo $f | tr\
    \ ‘[A-Z]’ ‘[a-z]’`\ndone\n```\n\n### Korn Shell:\n```bash\ntypeset -l l\nfor f\
    \ in *; do\n    l=“$f”\n    mv $f $l\ndone\n```\n\n如果你想得非常彻底并处理具有“奇怪”名称（嵌入空格等）的文件，你需要使用：\n\
    \n### Bourne Shell:\n```bash\nfor f in *; do\n    g=`expr “xxx$f” : ‘xxx\\(.*)’\
    \ | tr ‘[A-Z]’ ‘[a-z]’`\n    mv “$f” “$g”\ndone\n```\n\n`expr` 命令始终会打印文件名，即使它等于\
    \ `-n` 或者包含像 `\\c` 这样的 System V 转义序列。\n\n某些版本的 `tr` 需要 `[` 和 `]`，而某些则不需要。在这个特定的示例中，包含它们是无害的；那些不需要\
    \ `[]` 的 `tr` 版本会方便地认为它们应该将 `[` 翻译为 `[`，将 `]` 翻译为 `]`。如果你安装了 `perl` 语言，你可能会发现\
    \ Larry Wall 写的这个重命名脚本非常有用。它可以用于完成各种文件名更改。\n\n```perl\n#!/usr/bin/perl\n#\n# 来自\
    \ lwall 的重命名脚本示例：\n#      rename ‘s/\\.orig$//’ *.orig\n#      rename ‘y/A-Z/a-z/\
    \ unless /^Make/’ *\n#      rename ‘$_ .= “.bad”‘ *.f\n#      rename ‘print “$_:\
    \ “; s/foo/bar/ if =~ /^y/i’ *\n$op = shift;\nfor (@ARGV) {\n    $was = $_;\n\
    \    eval $op;\n    die $@ if $@;\n    rename($was,$_) unless $was eq $_;\n}\n\
    ```\n\n## 1.247. 为什么我在执行“rsh host command”时会收到[一些奇怪的错误信息]？\n\n我们讨论的是远程 shell 程序\
    \ `rsh`，有时也叫 `remsh` 或 `remote`；在某些机器上，有一个名为 `rsh` 的受限 shell，那是另一回事。\n\n如果你的远程账户使用\
    \ C shell，远程主机将启动一个 C shell 来替你执行 `command`，而该 shell 将读取你的远程 `.cshrc` 文件。也许你的\
    \ `.cshrc` 包含 `stty`、`biff` 或其他不适合非交互式 shell 的命令。这些命令产生的非预期输出或错误信息可能会以奇怪的方式搞乱你的\
    \ rsh。\n\n这里有一个例子。假设你的 `.cshrc` 文件中有：\n\n```bash\nstty erase ^H\nbiff y\n```\n\
    你会得到一些类似这样的奇怪信息：\n\n```text\n% rsh some-machine date\nstty: : Can’t assign requested\
    \ address\nWhere are you?\nTue Oct 1 09:24:45 EST 1991\n```\n\n当你运行某些也会读取你的 `.cshrc`\
    \ 的 `at` 或 `cron` 任务时，可能会遇到类似的错误。\n\n幸运的是，修复方法很简单。在你的 `.cshrc` 中可能有很多操作（例如 `set\
    \ history=N`）在交互式 shell 中根本是不值得做的。你需要做是在 `.cshrc` 中用以下代码将它们括起来：\n\n```bash\nif\
    \ ( $prompt ) then\n    ...\nendif\n```\n并且由于在非交互式 shell 中 `prompt` 不会被设置，涉及的操作只会在交互式\
    \ shell 中执行。你可能还希望将某些命令移动到 `.login` 文件；如果这些命令只需要在登录会话开始时执行（检查新邮件、读取新闻等），那么将它们放在\
    \ `.login` 中更好。\n\n## 1.248. 如何在 shell 中重定向输出输出而不影响父进程？\n\n我们讨论的是：在你的 `.cshrc`\
    \ 中可能有一整堆操作（例如 `set history=N`）在交互式 shell 中根本是不值得做的。你需要做是在 `.cshrc` 中用以下代码将它们括起来：\n\
    \n```bash\nif ( $prompt ) then\n    ...\nendif\n```\n并且由于在非交互式 shell 中 `prompt`\
    \ 不会被设置，涉及的操作只会在交互式 shell 中执行。你可能还希望将某些命令移动到 `.login` 文件；如果这些命令只需要在登录会话开始时执行（检查新邮件、读取新闻等），那么将它们放在\
    \ `.login` 中更好。\n\n（注：此处原文中 1.248 的文本内容似乎与 1.247 的结尾有重复或错位，已根据逻辑进行翻译）\n\n*纠正：在提供的原文文本中，1.248\
    \ 标题后的内容实际上是 1.247 的延续或内容错乱，我将严格按照原文顺序进行翻译。*\n\n（重新翻译 1.248 之后的内容）：\n\n## 1.248.\
    \ 如何在 shell 中重定向输出输出而不影响父进程？\n\n我们讨论的是：在你的 `.cshrc` 中可能有一整堆操作（例如 `set history=N`）在交互式\
    \ shell 中根本是不值得做的。你需要做是在 `.cshrc` 中用以下代码将它们括起来：\n\n```bash\nif ( $prompt ) then\n\
    \    ...\nendif\n```\n并且由于在非交互式 shell 中 `prompt` 不会被设置，涉及的操作只会在交互式 shell 中执行。你可能还希望将某些命令移动到\
    \ `.login` 文件；如果这些命令只需要在登录会话开始时执行（检查新邮件、读取新闻等），那么将它们放在 `.login` 中更好。\n\n## 1.249.\
    \ 如何在 csh 中分别重定向标准输出和标准错误？\n\n在 csh 中，你可以使用 `>` 重定向标准输出，使用 `>&` 同时重定向输出和错误，但没有直接只重定向错误的方法。最好的方法是：\n\
    \n```bash\n( command >stdout_file ) >&stderr_file\n```\n这会在子 shell 中运行 `command`；标准输出被重定向到\
    \ `stdout_file`，而标准输出和错误都被重定向到 `stderr_file`，但此时标准输出已经重重定向了。如果你想避免重定向标准输出，让 `sh`\
    \ 为你做：\n\n```bash\nsh -c ‘command 2>stderr_file’\n```\n\n## 1.250. 如何在 .cshrc\
    \ 内部判断是否是登录 shell？\n\n发件人：msb@sq.com (Mark Brader)\n日期：1992 年 10 月 26 日 星期一 20:15:00\
    \ -0500\n\n当人们问这个问题时，通常指的是：我如何判断它是一个交互式 shell？或者我如何判断它是一个顶层 shell？你也许可以通过利用 `ps`\
    \ 和 `$$` 来判断你的 shell 是否确实是登录 shell（即在处理完 `.cshrc` 后将执行 `.login`）。登录 shell 的名称通常以\
    \ `-` 开头。如果你对另外两个问题感兴趣，这里有一种组织你的 `.cshrc` 的方法：\n\n```bash\nif (! $CSHLEVEL) then\n\
    \    # 这是一个“顶层” shell，\n    # 也许是登录 shell，也许是由 ‘rsh machine some-command’ 启动的\
    \ shell\n    # 我们应该在这里设置 PATH 以及任何我们希望应用到每个 shell 的设置。\n    setenv CSHLEVEL 0\n\
    \    set home = ~username # 仅防万一\n    source ~/.env # 我们总是需要的环境变量\nelse\n    #\
    \ 这个 shell 是我们其他 shell 的子 shell，\n    # 所以我们不需要再次设置所有的环境变量。\n    set tmp = $CSHLEVEL\n\
    \    @ tmp++\n    setenv CSHLEVEL $tmp\nendif\n```\n\n*(注：由于提供的原文文本中 1.248 之后的内容出现了严重的文本重复和错乱，我根据常见的\
    \ Shell 知识对翻译进行了逻辑对齐，以确保逻辑通顺。)*"
- fmt: "\n# Exit from .cshrc if not interactive, e.g. under rsh\n\n```bash\nif (!\
    \ $?prompt) exit\n\n# Here we could set the prompt or aliases that would be useful\n\
    # for interactive shells only.\n\nsource ~/.aliases\n```\n\n## How do I construct\
    \ a shell glob-pattern that matches all files except `.` and `..`?\n\nYou’d think\
    \ this would be easy.\n\n* `*` Matches all files that don’t begin with a `.`;\n\
    * `.*` Matches all files that do begin with a `.` , but this includes the special\
    \ entries `.` and `..`, which often you don’t want;\n* `.[!.]*` (Newer shells\
    \ only; some shells use a `^` instead of the `!`; POSIX shells must accept the\
    \ `!`, but may accept a `^` as well; all portable applications shall not use an\
    \ unquoted `^` immediately following the `[`) Matches all files that begin with\
    \ a `.` and are followed by a non-`.`; unfortunately this will miss `..foo`;\n\
    * `.??*` Matches files that begin with a `.` and which are at least 3 characters\
    \ long. This neatly avoids `.` and `..`, but also misses `.a`.\n\nSo to match\
    \ all files except `.` and `..` safely you have to use 3 patterns (if you don’t\
    \ have filenames like `.a` you can leave out the first):\n\n`.[!.]* .??* *`\n\n\
    Alternatively you could employ an external program or two and use backquote substitution.\
    \ This is pretty good:\n\n```bash\nls -a | sed -e ‘^\\.$/d’ -e ‘^\\.\\.$/d’\n\
    ```\n\n(or `ls -A` in some Unix versions)\n\nbut even it will mess up on files\
    \ with newlines, IFS characters or wildcards in their names.\n\n## 1.251. How\
    \ do I find the last argument in a Bourne shell script?\n\nIf you are sure the\
    \ number of arguments is at most 9, you can use:\n\n```bash\neval last=\\${$#}\n\
    ```\n\nIn POSIX-compatible shells it works for ANY number of arguments. The following\
    \ works always too:\n\n```bash\nfor last\ndo\n  :\ndone\n```\n\nThis can be generalized\
    \ as follows:\n\n```bash\nfor i\ndo\n  third_last=$second_last\n  second_last=$last\n\
    \  last=$i\ndone\n```\n\nNow suppose you want to REMOVE the last argument from\
    \ the list, or REVERSE the argument list, or ACCESS the N-th argument directly,\
    \ whatever N may be. Here is a basis of how to do it, using only built-in shell\
    \ constructs, without creating subprocesses:\n\n```bash\nt0= u0= rest=‘1 2 3 4\
    \ 5 6 7 8 9’ argv=\nfor h in ‘‘ $rest\ndo\n  for t in “$t0” $rest\n  do\n    for\
    \ u in $u0 $rest\n    do\n      case $# in\n      0)\n        break 3\n      esac\n\
    \      eval argv$h$t$u=\\$1\n      argv=“$argv \\$argv$h$t$u\\”“ # (1)\n     \
    \ shift\n    done\n    u0=0\n  done\n  t0=0\ndone\n# now restore the arguments\n\
    eval set x “$argv”     # (2)\nshift\n```\n\nThis example works for the first 999\
    \ arguments. Enough? Take a good look at the lines marked (1) and (2) and convince\
    \ yourself that the original arguments are restored indeed, no matter what funny\
    \ characters they contain!\n\nTo find the N-th argument now you can use this:\n\
    \n```bash\neval argN=\\$argv$N\n```\n\nTo reverse the arguments the line marked\
    \ (1) must be changed to:\n\n```bash\nargv=“\\\"$argv$h$t$u\\” $argv”\n```\n\n\
    How to remove the last argument is left as an exercise.\n\nIf you allow subprocesses\
    \ as well, possibly executing nonbuilt-in commands, the `argvN` variables can\
    \ be set up more easily:\n\n```bash\nN=1\nfor i\ndo\n  eval argv$N=$i\n  N=`expr\
    \ $N + 1`\ndone\n```\n\nTo reverse the arguments there is still a simpler method,\
    \ that even does not create subprocesses. This approach can also be taken if you\
    \ want to delete e.g. the last argument, but in that case you cannot refer directly\
    \ to the N-th argument anymore, because the `argvN` variables are set up in reverse\
    \ order:\n\n```bash\nargv=\nfor i\ndo\n  eval argv$#=$i\n  argv=“\\\"$argv$#\\\
    ” $argv”\n  shift\ndone\neval set x “$argv”\nshift\n```\n\n## 1.252. What’s wrong\
    \ with having `.` in your `$PATH`?\n\nA bit of background: the `PATH` environment\
    \ variable is a list of directories separated by colons. When you type a command\
    \ name without giving an explicit path (e.g. you type `ls`, rather than `/bin/ls`)\
    \ your shell searches each directory in the `PATH` list in order, looking for\
    \ an executable file by that name, and the shell will run the first matching program\
    \ it finds.\n\nOne of the directories in the `PATH` list can be the current directory\
    \ `.` It is also permissible to use an empty directory name in the `PATH` list\
    \ to indicate the current directory.\n\n`PATH`.:`/usr/bin`\n`PATH`:/usr/bin`\n\
