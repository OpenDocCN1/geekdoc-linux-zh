- fmt: "\nShared memory potentially provides the fastest interprocess communication\
    \ of all. The same memory is mapped into the address spaces of two or more processes.\
    \ As soon as data is written to the shared memory, it is instantly available to\
    \ the readers. A semaphore or a message is used to synchronize the reader and\
    \ writer. Sure enough, there are two versions of shared memory.\n\nThe best of\
    \ all is: networking interprocess communication, using a group of system calls\
    \ called `sockets`. (Other system calls in this group have names like `bind`,\
    \ `connect`, and `accept`.) Unlike all of the other mechanisms we have talked\
    \ about, the process you are communicating with via a socket does not not have\
    \ to be on the same machine. It can be on another machine, or anywhere on a local\
    \ network or the Internet. That other machine does not even have to be running\
    \ UNIX. It can be running Windows or whatever. It could be a networked printer\
    \ or radio, for that matter.\n\n## 1.53. What are different versions of UNIX ?\n\
    \nKen Thompson and Dennis Ritchie began UNIX as a research project at AT&T Bell\
    \ Laboratories in 1969, and shortly thereafter it started to be widely used within\
    \ AT&T for internal systems (e.g., to automate telephone-repair call centers).\
    \ AT&T wasn’t then in the business of producing commercial computers or of setting\
    \ commercial software, but by the early 1970s it did make UNIX available to universities\
    \ for educational purposes, provided the source code was disclosed only to other\
    \ universities who had their own license. By the late 1970s AT&T was licensing\
    \ source code to commercial vendors, too.\n\nMany, if not most, of the licensees\
    \ made their own changes to UNIX, to port it to new hardware, to add device drivers,\
    \ or just to tune it. Perhaps the two most significant changes were made at the\
    \ University of California at Berkeley: networking system-calls (`sockets`) and\
    \ support for virtual memory. As a result, universities and research labs throughout\
    \ the world used the Berkeley system (called `BSD`, for `Berkeley Software Distribution`),\
    \ even though they still got their licenses from AT&T. Some commercial vendors,\
    \ notably Sun Microsystems, started with BSD UNIX as well. Bill Joy, a founder\
    \ of Sun, was a principal BSD developer.\n\n## 1.54. How do you list all the files\
    \ and sub-directories in the file system?\n\n```bash\nls -lR\n```\n\nList all\
    \ the files and their sizes.\n\n## 1.55. Write a command to list all of the files\
    \ in the current directory tree that have a name ending in .c.\n\n```bash\nfind\
    \ . -name “*.c” -print\n```\n\n## 1.56. Describe the C compilation process.\n\n\
    The C compiler, `cc`, translates C source programs into object modules or into\
    \ executable modules. An executable module is ready to be loaded and executed.\
    \ The compilation process proceeds in stages. In the first stage, a preprocessor\
    \ expands macros and includes header files. The compiler then makes several passes\
    \ through the code to translate the code first to the assembly language of the\
    \ target machine and then into machine code. The result is an object module consisting\
    \ of machine code and tables of unresolved references. The final stage of compilation\
    \ links a collection of object modules together to form the executable module\
    \ with all references resolved. The executable contains exactly one main function.\n\
    \nThe following command compiles `mine.c` and produces an executable `mine`.\n\
    \n```bash\ncc -o mine mine.c\n```\n\nIf the `-o mine` option is omitted, the C\
    \ compiler produces an executable called `a.out`. Use the `-o` option to avoid\
    \ the noninformative default name.\n\nThe following `mine.c` source file contains\
    \ an undefined reference to the `serr` function.\n\n```c\nvoid serr(char *msg);\n\
    \nvoid main(int argc, char *argv[ ])\n{\n  serr(\"This program does not do much.\\\
    n\");\n}\n```\n\nWhen `mine.c` is compiled, the C compiler displays a message\
    \ indicating that `serr` is an unresolved reference and does not produce an executable.\n\
    \nMost programs are not contained in a single source file, requiring that the\
    \ sources from multiple files be linked together. All of the source files to be\
    \ compiled may be specified in a single `cc` command. Alternatively, the user\
    \ can compile the source into separate object modules and link these object modules\
    \ to form an executable modules in a separate step.\n\nSuppose that the `serr`\
    \ function is contained in the source file `minelib.c`. The following command\
    \ compiles the `mine.c` source file with `minelib.c` to produce an executable\
    \ module called `mine`.\n\n```bash\ncc -o mine mine.c minelib.c\n```\n\nThe `-c`\
    \ option of `cc` causes the C compiler to produce an object module rather than\
    \ an executable. An object module cannot be loaded into memory or executed until\
    \ it is linked to libraries and other modules to resolve references. A misspelled\
    \ variable or missing library function may not be detected until that object is\
    \ linked into an executable.\n\nThe following command produces the object module\
    \ `mine.o`.\n\n```bash\ncc -c mine.c\n```\n\nWhen the `-c` option is used, the\
    \ C compiler produces an object module named with a `.o` extension. The `mine.o`\
    \ produced by the `cc` command can later be linked with another object file (e.g.,\
    \ `minelib.o`) to produce an executable.\n\nThe following links the object modules\
    \ `mine.o` and `minelib.o` to produce the executable `mine`.\n\n```bash\ncc -o\
    \ mine mine.o minelib.o\n```\n\n## 1.57. Describe the make process.\n\nThe `make`\
    \ utility allows users to recompile incrementally a collection of program modules.\
    \ Even for a simple compile, `make` is convenient and helps avoid mistakes.\n\n\
    In order to use `make`, the user must specify dependencies among modules in a\
    \ description file. The default description filenames are `makefile` and `Makefile`.\
    \ When the user types `make`, the `make` utility looks for `makefile` or `Makefile`\
    \ in the current directory and checks this description file to see if anything\
    \ needs updating.\n\nThe description file describes the dependency relationships\
    \ that exist between various program modules. Lines starting with `#` are comments.\
    \ The dependencies in the description file have the form:\n\n`target: components`\n\
    `TAB rule`\n\nThe first line is called a dependency and the second line is called\
    \ a rule. The first character on a rule line in a description file must be the\
    \ TAB character. A dependency may be followed by one or more rule lines.\n\nIn\
    \ `cc -o mine mine.o minelib.o executable`, `mine` depends on the object files\
    \ `mine.o` and `minelib.o`. The following segment describes that dependency relationship.\n\
    \n```makefile\nmine: mine.o minelib.o\ncc -o mine mine.o minelib.o\n```\n\nThe\
    \ description says that `mine` depends on `mine.o` and `minelib.o`. If either\
    \ of these latter two files has been modified since `mine` was last changed, `mine`\
    \ should be updated by executing `cc -o mine mine.o minelib.o`. If the description\
    \ is contained in a file called `makefile`, just type the word `make` to perform\
    \ the needed updates. The description lines must start with a TAB, so there is\
    \ an invisible TAB character before the `cc`.\n\nThe filename preceding the colon,\
    \ `mine`, is called a target. The target depends on its components (e.g., `mine.o`\
    \ and `minelib.o`). The line following the dependency specification is the command\
    \ or rule for updating the target if it is older than any of its components. Thus,\
    \ if `mine.o` or `minelib.o` change, execute `make` to update `mine`.\n\nIn more\
    \ complicated situations, a given target can depend on components that are themselves\
    \ targets. The following `makefile` description file has three targets.\n\n```makefile\n\
    my:\tmy.o mylib.o\n\tcc -o my my.o mylib.o\nmy.o:\tmy.c myinc.h\n\tcc -c my.c\n\
    mylib.o:\tmylib.c myinc.h\n\tcc -c mylib.c\n```\n\nJust type `make` to do the\
    \ required updates.\n\nA description file can also contain macro definitions of\
    \ the form:\n\n`NAME = value`\n\nWhenever `$(NAME)` appears in the description\
    \ file, `value` is substituted before the phrase is processed. Do not use tabs\
    \ in macros.\n\n## 1.58. Write a typical makfile.\n\n```makefile\n# Compiler/Linker\n\
    CC = gcc\nLD = $(CC)\n\n# compiler/linker flags\nCFLAGS = -g -I.. -I../../../shared/base\n\
    LDFLAGS = -g\n\n# files removal\nRM = /bin/rm -f\n\n# library to use when linking\
    \ the main program\nLIBS = -L../../../dist/lib -lbase -lprotocol -lalert \\\n\
    ```\n"
  raw: 'Shared memory potentially provides the fastest interprocess communication
    of all. The same memory is mapped into the address spaces of two or more processes.
    As soon as data is written to the shared memory, it is instantly available to
    the readers. A semaphore or a message is used to synchronize the reader and writer.
    Sure enough, there are two versions of shared memory.


    The best of all is: networking interprocess communication, using a group of system
    calls called sockets. (Other system calls in this group have names like bind,
    connect, and accept.) Unlike all of the other mechanisms we have talked about,
    the process you are communicating with via a socket does not have to be on the
    same machine. It can be on another machine, or anywhere on a local network or
    the Internet. That other machine does not even have to be running UNIX. It can
    be running Windows or whatever. It could be a networked printer or radio, for
    that matter.


    ## 1.53. What are different versions of UNIX ?


    Ken Thompson and Dennis Ritchie began UNIX as a research project at AT&T Bell
    Laboratories in 1969, and shortly thereafter it started to be widely used within
    AT&T for internal systems (e.g., to automate telephone-repair call centers). AT&T
    wasn’t then in the business of producing commercial computers or of setting commercial
    software, but by the early 1970s it did make UNIX available to universities for
    educational purposes, provided the source code was disclosed only to other universities
    who had their own license. By the late 1970s AT&T was licensing source code to
    commercial vendors, too.


    Many, if not most, of the licensees made their own changes to UNIX, to port it
    to new hardware, to add device drivers, or just to tune it. Perhaps the two most
    significant changes were made at the University of California at Berkeley: networking
    system-calls (“sockets”) and support for virtual memory. As a result, universities
    and research labs throughout the world used the Berkeley system (called BSD, for
    Berkeley Software Distribution), even though they still got their licenses from
    AT&T. Some commercial vendors, notably Sun Microsystems, started with BSD UNIX
    as well. Bill Joy, a founder of Sun, was a principal BSD developer.


    ## 1.54. How do you list all the files and sub-directories in the file system?


    ls -lR


    List all the files and their sizes.


    ## 1.55. Write a command to list all of the files in the current directory tree
    that have a name ending in .c.


    find . -name “*.c” -print


    ## 1.56. Describe the C compilation process.


    The C compiler, cc, translates C source programs into object modules or into executable
    modules. An executable module is ready to be loaded and executed. The compilation
    process proceeds in stages. In the first stage, a preprocessor expands macros
    and includes header files. The compiler then makes several passes through the
    code to translate the code first to the assembly language of the target machine
    and then into machine code. The result is an object module consisting of machine
    code and tables of unresolved references. The final stage of compilation links
    a collection of object modules together to form the executable module with all
    references resolved. The executable contains exactly one main function.


    The following command compiles mine.c and produces an executable mine.


    cc -o mine mine.c


    If the -o mine option is omitted, the C compiler produces an executable called
    a.out. Use the -o option to avoid the noninformative default name.


    The following mine.c source file contains an undefined reference to the serr function.


    void serr(char *msg);


    void main(int argc, char *argv[ ])


    {   serr(“This program does not do much.\n”);


    }


    When mine.c is compiled, the C compiler displays a message indicating that serr
    is an unresolved reference and does not produce an executable.


    Most programs are not contained in a single source file, requiring that the sources
    from multiple files be linked together. All of the source files to be compiled
    may be specified in a single cc command. Alternatively, the user can compile the
    source into separate object modules and link these object modules to form an executable
    modules in a separate step.


    Suppose that the serr function is contained in the source file minelib.c. The
    following command compiles the mine.c source file with minelib.c to produce an
    executable module called mine.


    cc -o mine mine.c minelib.c


    The -c option of cc causes the C compiler to produce an object module rather than
    an executable. An object module cannot be loaded into memory or executed until
    it is linked to libraries and other modules to resolve references. A misspelled
    variable or missing library function may not be detected until that object is
    linked into an executable.


    The following command produces the object module mine.o.


    cc -c mine.c


    When the -c option is used, the C compiler produces an object module named with
    a .o extension. The mine.o produced by the cc command can later be linked with
    another object file (e.g., minelib.o) to produce an executable.


    The following links the object modules mine.o and minelib.o to produce the executable
    mine.


    cc -o mine mine.o minelib.o


    ## 1.57. Describe the make process.


    The make utility allows users to recompile incrementally a collection of program
    modules. Even for a simple compile, make is convenient and helps avoid mistakes.


    In order to use make, the user must specify dependencies among modules in a description
    file. The default description filenames are makefile and Makefile. When the user
    types make, the make utility looks for makefile or Makefile in the current directory
    and checks this description file to see if anything needs updating.


    The description file describes the dependency relationships that exist between
    various program modules. Lines starting with # are comments. The dependencies
    in the description file have the form:


    target: components


    TAB    rule


    The first line is called a dependency and the second line is called a rule. The
    first character on a rule line in a description file must be the TAB character.
    A dependency may be followed by one or more rule lines.


    In cc -o mine mine.o minelib.o executable mine depends on the object files mine.o
    and minelib.o. The following segment describes that dependency relationship.


    mine: mine.o minelib.o


    cc -o mine mine.o minelib.o


    The description says that mine depends on mine.o and minelib.o. If either of these
    latter two files has been modified since mine was last changed, mine should be
    updated by executing cc -o mine mine.o minelib.o. If the description is contained
    in a file called makefile, just type the word make to perform the needed updates.
    The description lines must start with a TAB, so there is an invisible TAB character
    before the cc.


    The filename preceding the colon, mine, is called a target. The target depends
    on its components (e.g., mine.o and minelib.o). The line following the dependency
    specification is the command or rule for updating the target if it is older than
    any of its components. Thus, if mine.o or minelib.o change, execute make to update
    mine.


    In more complicated situations, a given target can depend on components that are
    themselves targets. The following makefile description file has three targets.


    my:      my.o mylib.o


                cc -o my my.o mylib.o


    my.o:   my.c myinc.h


                cc -c my.c


    mylib.o: mylib.c myinc.h


                cc -c mylib.c


    Just type make to do the required updates.


    A description file can also contain macro definitions of the form:


    NAME = value


    Whenever $(NAME) appears in the description file, value is substituted before
    the phrase is processed. Do not use tabs in macros.


    ## 1.58. Write a typical makfile.


    # Compiler/Linker


    CC = gcc


    LD = $(CC)


    # compiler/linker flags


    CFLAGS = -g -I.. -I../../../shared/base


    LDFLAGS = -g


    # files removal


    RM = /bin/rm -f


    # library to use when linking the main program


    LIBS = -L../../../dist/lib -lbase -lprotocol -lalert \'
