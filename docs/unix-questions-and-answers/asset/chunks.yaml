- fmt: "\nSome shells have their own variable substitution features, so instead of\
    \ using `basename`, you can use simpler loops like:\n\n### C Shell:\n```bash\n\
    foreach f ( *.foo )\n    mv $f $f:r.bar\nend\n```\n\n### Korn Shell:\n```bash\n\
    for f in *.foo; do\n    mv $f ${f%foo}bar\ndone\n```\n\nIf you don’t have `basename`\
    \ or want to do something like renaming `foo.*` to `bar.*`, you can use something\
    \ like `sed` to strip apart the original file name in other ways, but the general\
    \ looping idea is the same. You can also convert file names into `mv` commands\
    \ with `sed`, and hand the commands off to `sh` for execution. Try\n\n```bash\n\
    ls -d *.foo | sed -e ‘s/.*/mv & &/’ -e ‘s/foo$/bar/’ | sh\n```\n\nA program by\
    \ Vladimir Lanin called `mmv` that does this job nicely was posted to comp.sources.unix\
    \ (Volume 21, issues 87 and 88) in April 1990. It lets you use\n\n```bash\nmmv\
    \ ‘*.foo’ ‘=1.bar’\n```\n\nShell loops like the above can also be used to translate\
    \ file names from upper to lower case or vice versa. You could use something like\
    \ this to rename uppercase files to lowercase:\n\n### C Shell:\n```bash\nforeach\
    \ f ( * )\n    mv $f `echo $f | tr ‘[A-Z]’ ‘[a-z]’`\nend\n```\n\n### Bourne Shell:\n\
    ```bash\nfor f in *; do\n    mv $f `echo $f | tr ‘[A-Z]’ ‘[a-z]’`\ndone\n```\n\
    \n### Korn Shell:\n```bash\ntypeset -l l\nfor f in *; do\n    l=“$f”\n    mv $f\
    \ $l\ndone\n```\n\nIf you wanted to be really thorough and handle files with `funny`\
    \ names (embedded blanks or whatever) you’d need to use:\n\n### Bourne Shell:\n\
    ```bash\nfor f in *; do\n    g=`expr “xxx$f” : ‘xxx\\(.*)’ | tr ‘[A-Z]’ ‘[a-z]’`\n\
    \    mv “$f” “$g”\ndone\n```\n\nThe `expr` command will always print the filename,\
    \ even if it equals `-n` or if it contains a System V escape sequence like `\\\
    c`.\n\nSome versions of `tr` require the `[` and `]`, some don’t. It happens to\
    \ be harmless to include them in this particular example; versions of `tr` that\
    \ don’t want the `[]` will conveniently think they are supposed to translate `[`\
    \ to `[` and `]` to `]`.  If you have the `perl` language installed, you may find\
    \ this rename script by Larry Wall very useful. It can be used to accomplish a\
    \ wide variety of filename changes.\n\n```perl\n#!/usr/bin/perl\n#\n# rename script\
    \ examples from lwall:\n#      rename ‘s/\\.orig$//’ *.orig\n#      rename ‘y/A-Z/a-z/\
    \ unless /^Make/’ *\n#      rename ‘$_ .= “.bad”‘ *.f\n#      rename ‘print “$_:\
    \ “; s/foo/bar/ if =~ /^y/i’ *\n$op = shift;\nfor (@ARGV) {\n    $was = $_;\n\
    \    eval $op;\n    die $@ if $@;\n    rename($was,$_) unless $was eq $_;\n}\n\
    ```\n\n## 1.247. Why do I get [some strange error message] when I “rsh host command”\
    \ ?\n\nWe’re talking about the remote shell program `rsh` or sometimes `remsh`\
    \ or `remote`; on some machines, there is a restricted shell called `rsh`, which\
    \ is a different thing.\n\nIf your remote account uses the C shell, the remote\
    \ host will fire up a C shell to execute `command` for you, and that shell will\
    \ read your remote `.cshrc` file. Perhaps your `.cshrc` contains a `stty`, `biff`\
    \ or some other command that isn’t appropriate for a non-interactive shell. The\
    \ unexpected output or error message from these commands can screw up your rsh\
    \ in odd ways.\n\nHere’s an example. Suppose you have\n\n```bash\nstty erase ^H\n\
    biff y\n```\nin your `.cshrc` file. You’ll get some odd messages like this.\n\n\
    ```text\n% rsh some-machine date\nstty: : Can’t assign requested address\nWhere\
    \ are you?\nTue Oct 1 09:24:45 EST 1991\n```\n\nYou might also get similar errors\
    \ when running certain `at` or `cron` jobs that also read your `.cshrc` file.\n\
    \nFortunately, the fix is simple. There are, quite possibly, a whole bunch of\
    \ operations in your `.cshrc` (e.g., `set history=N`) that are simply not worth\
    \ doing in interactive shells. What you do is surround them in `.cshrc` with:\n\
    \n```bash ownif ( $prompt ) then\n    ...\nendif\n```\nand, since in non-interactive\
    \ shell `prompt` won’t be set, the operations in question will only be done in\
    \ interactive shells. You may also wish to move some commands to `.login` file;\
    \ if those commands only need to be done when login session starts (checking for\
    \ new mail, read news and so on) it’s better to have them in `.login`.\n\n## 1.248.\
    \ How do I {set an environment variable, change directory} inside a program or\
    \ shell and have that affect my shell?\n\nIn general, you can’t, at least not\
    \ without special arrangements. When a child process is created, it inherits a\
    \ copy of its parent’s variables (and current directory). The child can change\
    \ these values it wants but the changes won’t affect the parent shell since the\
    \ child is changing a copy of the original data.\n\nSome special arrangements\
    \ are possible. Also, shells can arrange to run other scripts in the context of\
    \ the current shell, rather than in child process, so that changes will affect\
    \ original shell. For instance, if you have a C shell named `myscript`:\n\n```bash\n\
    cd /very/long/path\nsetenv PATH /something-else\n```\nor the equivalent Korn shell\
    \ script\n\n```bash\ncd /very/long/path\nPATH=/something-else\n```\nand try to\
    \ run `myscript` from your shell, your shell will fork and run the shell in a\
    \ subprocess. The subprocess is also running the shell; when it sees the `cd`\
    \ command it changes its current directory, and when it sees the `setenv` command\
    \ it changes its environment, but neither has effect on the current directory\
    \ of the shell which you’re typingyour login shell, say).\n\nIn order to get your\
    \ login shell to execute the script (without forking) you have to use the `.`\
    \ command (for Bourne or Korn shells) or the `source` command (for C shell). I.e.\
    \ you type\n\n```bash\n. myscript\n```\nto the Bourne or Korn shells, or\n\n```bash\n\
    source myscript\n```\nto the C shell. If all you are trying to change directory\
    \ or set an environment variable, it will probably be simpler to use a shell alias\
    \ or Bourne/Korn shell function. See the “how do I get the current directory into\
    \ my prompt” section of this article for examples.\n\n## 1.249. How do I redirect\
    \ stdout and stderr separately in csh?\n\nIn csh, you can redirect stdout with\
    \ `>`, or stdout and stderr together with `>&` but there is no direct way to redirect\
    \ only. The best you can do is\n\n```bash\n( command >stdout_file ) >&stderr_file\n\
    ```\nwhich runs `command` in a subshell; stdout is redirected inside the subshell\
    \ to `stdout_file`, and both stdout and stderr from subshell are redirected to\
    \ `stderr_file`, but by this point stdout has already been redirected so only\
    \ stderr actually winds up in `stderr_file`. If what you want is to avoid redirecting\
    \ stdout at all, let `sh` do it for you.\n\n```bash\nsh -c ‘command 2>stderr_file’\n\
    ```\n\n## 1.250. How I tell inside .cshrc if I’m a login shell?\n\nFrom: msb@sq.com\
    \ (Mark Brader)\nDate: Mon, 26 Oct 1992 20:15:00 -0500\n\nWhen people ask this,\
    \ they usually mean either: How can I tell if it’s an interactive shell? or How\
    \ can I tell if it’s a top-level shell? You could perhaps determine if your shell\
    \ truly is a login shell (i.e. is going to source `.login` after it is done with\
    \ `.cshrc`) by fooling around with `ps` and `$$`. Login shells generally have\
    \ names that begin with a `-`. If you’re really interested in the other two questions,\
    \ here’s one way you can organize your `.cshrc` to find out.\n\n```bash\nif (!\
    \ $?CSHLEVEL) then\n    # This is a “top-level” shell,\n    # perhaps a login\
    \ shell, perhaps a shell started up by\n    # ‘rsh machine some-command’\n   \
    \ # This is where we should set PATH and anything else\n    # we want to apply\
    \ to every one of our shells.\n    setenv CSHLEVEL 0\n    set home = ~username\
    \ # just to be sure\n    source ~/.env # environment stuff we always want\nelse\n\
    \    # This shell is a child of one of our other shells so\n    # we don’t need\
    \ to set all the environment variables again.\n    set tmp = $CSHLEVEL\n    @\
    \ tmp++\n    setenv CSHLEVEL $tmp\nendif\n```\n"
