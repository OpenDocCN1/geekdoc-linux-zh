  trans: '

    在 UNIX 中，共享对象（`.so`）文件包含了程序使用的代码，还包含了它期望在程序中找到的函数和数据的名称。当文件被链接到程序时，文件代码中对这些函数和数据的所有引用都会更改为指向程序内存中存放这些函数和数据的实际位置。这基本上是一个链接操作。


    在 Windows 中，动态链接库（`.dll`）文件没有悬空引用。相反，对函数或数据的访问是通过一个查找表完成的。因此，DLL 代码不需要在运行时为了引用程序的内存而进行修复；相反，代码已经使用了
    DLL 的查找表，而查找表会在运行时被修改以指向相应的函数和数据。


    在 UNIX 中，只有一种类型的库文件（`.a`），它包含了来自多个对象文件（`.o`）的代码。在创建 `.so` 文件的链接步奏中，链接器可能会发现它不知道某个标识符的定义在何处。链接器将在库的对象文件中查找它；如果找到了，它将包含该对象文件中的所有代码。


    在 Windows 中，有两种类型的库：静态库和导入库（都称为 `.lib`）。静态库类似于 UNIX 的 `.a` 文件；它包含了根据需要被包含的代码。导入库基本上仅用于向链接器确认某个标识符是合法的，并且在
    `.dll` 加载时会出现在程序中。因此，链接器使用导入库中的信息为未包含在 `.dll` 中的标识符构建查找表。当应用程序或 `.dll` 链接时，可能会生成一个导入库，该库将用于未来所有依赖于该应用程序或
    `.dll` 中符号的 `.dll`。


    假设你正在构建两个动态加载模块 B 和 C，它们应该共享另一块代码 A。在 UNIX 中，你*不会*将 `A.a` 传递给 `B.so` 和 `C.so`
    的链接器；这会导致它被包含两次，使得 B 和 C 各自拥有自己的拷贝。在 Windows 中，构建 `A.dll` 的同时也会构建 `A.lib`。你*会*将
    `A.lib` 传递给 `B` 和 `C` 的链接器。`A.lib` 不包含代码；它只包含在运行时访问 `A` 代码所需的信息。


    在 Windows 中，使用导入库就像“import spam（导入垃圾邮件）”；它让你访问垃圾邮件的名称，但不会创建单独拷贝。在 UNIX 中，与库链接更像是“from
    spam import *（从垃圾邮件导入所有）”；它确实会创建一个单独拷贝。


    链接到共享库的程序运行速度通常比链接到归档库的程序慢。如果你使用归档库，链接器会将调用的每个库程序的实际拷贝绑定到你的可执行代码中。如果你使用共享库，链接器仅会在你的可执行代码中注明该代码调用了共享库中的一个程序。然后，当代码开始执行时，动态加载器会将共享库加载并映射到进程的地址空间中，并通过链接表在需要时间接调用这些程序。使用共享库可以节省可执行文件的空间，但是以解析对共享库中程序引用的时间为代价的。


    共享库对性能的影响可能仅在程序大量使用库函数时（如许多浮点应用那样）才会易于察觉。如果你的程序在使用共享库运行时运行慢得令人不可接受，你可能想找出归档库是否有差异。


    然而，C 数学库 `libm` 以及 FORTRAN 和 Pascal 库 `libcl` 都提供了共享和归档两个版本。链接器默认在查找归档库之前查找共享库，因此如果你想使用
    `libm` 或 `libcl` 的归档库版本，你需要向链接器指定 `-a` 归档选项。要在编译命令行执行此操作，请指定 `-Wl,-a, archive`。


    共享库提供了以下优势：

    - 显著减少可执行文件的大小

    - 缩短链接时间

    - 能够在不重新链接的情况下使用更新后的共享库，代价是程序启动时间略有增加。


    将系统库（例如 `libc.a`）静态链接到应用程序中通常不是一个好主意，因为“锁定”在应用程序二进制文件中的系统库代码可能会与系统的后继发布版本不兼容。


