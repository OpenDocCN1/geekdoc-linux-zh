- fmt: '

    Although the UNIX permissions model is a tried and true one, it is still fraught
    with enough complications that few system administrators would feel comfortable
    with strange users roaming through their machines. `chroot` gives them the ability
    to grant access to certain users, but to limit that access in such a restrictive
    way that the user cannot access something the administrator does not want them
    to access.


    `chroot` is also commonly used when running system services. Most UNIX system
    services run as the `root` user. This makes these services extremely vulnerable
    to buffer overflow attacks. If a “buffer overflow attack” succeeds, the attacker
    will be left with a shell on the system that has inherited the permissions of
    the service owner (in this case, `root`). However, if the service is run in its
    own `chroot` jail, the damage caused by these kinds of attacks is greatly minimized,
    because the attacker is left with an extremely limited shell as opposed to their
    entire filesystem.


    ## 1.88. Describe a buffer overflow attack and list possible defenses.


    A buffer overflow attack is perhaps the most common system compromise in the history
    of computing security. When a programmer writes software that expects input, that
    expected input is assigned a buffer in the system. The size of that buffer is
    dependent upon the expected size of the data. If the programmer has not put checks
    in place to validate the size of the input data, a malicious user can send more
    data than can be allocated in the buffer, causing an overflow. In the best case,
    this will cause memory corruption in the program and it will fail. In the worst
    case, specific data can be sent in the overflow portion of the input data, which
    is then executed with the privileges of the owner of the program. In the case
    of a system service running as `root`, a remote buffer overflow attack can allow
    an attacker to run arbitrary code as the `root` user on a system.


    The real defense against a buffer overflow attack is to prevent them from ever
    happening. This can be accomplished through a complete code audit, ensuring that
    every data input point in an application does proper bounds checking to ensure
    that only the amount of data that can be allocated is accepted. In practice, this
    is often difficult to do, even with the available code profiling tools available.


    A common practice is to treat this kind of attack like any other in the networking
    security realm - assume it will happen and make plans to identify it and reduce
    the damage. Identification is normally handled by examining the logs of a system,
    looking for strange log entries from a system service. If a system has been compromised,
    file system integrity tools will tell you what files on the system have been modified.
    A “chroot jail” is commonly used to minimize the amount of damage that is possible
    from an attack of this nature. This has become a common enough solution that some
    popular server programs have built-in `chroot` functionality (`sendmail` is an
    example).


    In Linux, there are kernel modules available to assist in the defense against
    buffer overflow attacks. These patches go about this in different ways, but most
    focus on preventing arbitrary code from being inserted onto the stack and executed,
    making traditional buffer overflow attacks much more difficult to execute.


    ## 1.89. What is the weakest point in any network or system’s security? What can
    you do about it?


    People. No matter how much money you have spent on the latest in firewalls, intrusion
    detection tools, forensic analysis and physical security, people are always the
    weakest link. This is a fundamental rule of computer security that everyone who
    works in the field needs to realize. Simply having an easy-to-guess password can
    completely compromise the security infrastructure of an entire organization.


    What is the answer to this problem? Education. An educated user is much less of
    a security risk. Security is a tricky thing when it comes to users: be too lenient,
    and they will ignore it. Be too stringent, and they will do everything in their
    power to bypass is. Finding the right balance is a challenge. The first step to
    this is educating your work force. Telling a user why the company’s password policy
    should be followed, instead of threatening to fire them if they disobey, you will
    probably get a better response. Security needs to be a standard part of everyone’s
    job. In this day and age, everyone is responsible for the security of a company’s
    systems and data. By letting a user know what is acceptable and what isn’t, you
    will go a long way towards making your environment a much more secure place.


    ## 1.90. Describe a file system integrity tool and explain its importance.


    A file system integrity tool is an application that maintains a record of all
    the files on a system. This record will contain every bit of data about each file,
    including time stamp, size, owner, location, etc. Periodically, a check of the
    existing file system against this record is run. If part of the filesystem has
    been modified, it will not match this record, and the system administrator will
    be notified.


    This is an important tool because YOUR SYSTEMS WILL GET BROKEN INTO! It is not
    a question of IF; it is only a question of WHEN. Assuming that you alone have
    an infallible security model is the equivalent of refusing to face reality. Due
    to some error, either human, hardware, or software, your systems will be compromised.
    The largest problem that arises from this event is the time it takes the system
    administrator to figure out that a compromise took place. Stories abound of companies
    finding out months later that they were compromised, after the attacker stole
    all of their data and used their systems to attack other systems on the internet.


    A file system integrity tool will notify you if a part of your system has been
    modified. It is the first step in recovering from an intrusion.


    ## 1.91. What is an intrusion detection system and what are some basic flaws in
    the concept of ‘detecting intrusion’?


    An “intrusion detection system” (IDS) is software that monitors a system or network,
    looking for evidence of activity that can be identified as malicious.


    There are a number of different kinds of IDS systems available. The simplest of
    these will monitor system log files looking for any suspicious messages generated
    by the system services. A second type of IDS will monitor the activity of a network
    or system and match what it finds against a pattern of ‘attack signatures’. Similar
    to anti-virus programs, these IDS systems are able to identify an intrusion if
    it follows the pattern of a previously known attack. The third kind of IDS system
    is also similar to an anti-virus program. Many anti-virus programs use heuristic
    analysis to identify programs that ‘look like’ viruses. In this same way, an IDS
    can identify system activity that appears to be malicious but does not match any
    known malicious pattern.


    The inherent flaw in all of these systems is that it is very difficult to write
    an algorithm that can differentiate between ‘good’ and ‘bad’ activity. Since these
    systems do not take into account the context of a pattern, there can be many false
    positives. An IDS system that generates too many false positives is worse than
    no IDS system at all. A system administrator will simply start to delete all of
    the notifications while believing that his network and systems are secure.


    Although flawed, when configured correctly and kept up to date, IDS systems can
    be an important piece in the overall security plan of an organization.


    ## 1.92. What is “ARP cache poisoning”, and how can it be prevented?

