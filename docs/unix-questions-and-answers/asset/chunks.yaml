    UNIX jargon, the instruction segment is called the “text segment.” The program
    is used to initialize the instructions and user data. After this initialization,
    the process begins to deviate from the program it is running. Although modern
    programmers don’t normally modify instructions, the data does get modified. In
    addition, the process may acquire resources (more memory, open files, etc.) not
    present in the program.


    While the process is running, the kernel keeps track of its threads, each of which
    is a separate flow of control through the instructions, all potentially reading
    and writing the same parts of the process’s data. Each thread has its own stack,
    however. When you are programming, you start with one thread, and that is all
    you get unless you execute a special system call to create another. So, beginners
    can think of a process as being single-threaded. Not every version of UNIX supports
    multiple threads. They are part of an optional feature called POSIX Threads, or
    “pthreads.”


    Several concurrently running processes can be initialized from the same program.
    There is no functional relationship, however, between these processes. The kernel
    might be able to save memory by arranging for such processes to share instruction
    segments, but the processes involved can’t detect such sharing. By contrast, there
    is a strong functional relationship between threads in the same process.             


    A process’s system data includes attributes such as current directory, open file
    descriptors, accumulated CPU time, and so on. A process cannot access or modify
    its system data directly, since it is outside of its address space. Instead, there
    are various system calls to access or modify attributes.


    A process is created by the kernel on behalf of a currently executing process,
    which becomes the parent of the new child process. The child inherits most of
    the parent’s system-data attributes. For example, if the parent has any files
    open, the child will have them open too. Heredity of this sort is absolutely fundamental
    to the operation of UNIX. This is different from a thread creating a new thread.
    Threads in the same process are equal in most respects, and there is no inheritance.
    All threads have equal access to all data and resources, not copies of them.


    An application consists of one or more processes. A process, in the simplest terms,
    is an executing program. One or more threads run in the context of the process.
    A thread is the basic unit to which the operating system allocates processor time.
    A thread can execute any part of the process code, including parts currently being
    executed by another thread.


    Each process provides the resources needed to execute a program. A process has
    a virtual address space, executable code, open handles to system objects, a security
    context, a unique process identifier, environment variables, a base priority,
    minimum and maximum working set sizes, and at least one thread of execution. Each
    process is started with a single thread, often called the primary thread, but
    can create additional threads from any of its threads.


    A thread is the entity within a process that can be scheduled for execution. All
    threads of a process share its virtual address space and system resources. In
    addition, each thread maintains exception handlers, a scheduling priority, thread
    local storage, a unique thread identifier, and a set of structures the system
    will use to save the thread context until it is scheduled. The thread context
    includes the thread’s set of machine registers, the kernel stack, a thread environment
    block, and a user stack in the address space of the thread’s process. Threads
    can also have their own security context, which can be used for impersonating
    clients.


    Microsoft Windows supports preemptive multitasking, which creates the effect of
    simultaneous execution of multiple threads from multiple processes. On a multiprocessor
    computer, the system can simultaneously execute as many threads as there are processors
    on the computer.


    A job object allows groups of processes to be managed as a unit. Job objects are
    namable, securable, sharable objects that control attributes of the processes
    associated with them. Operations performed on the job object affect all processes
    associated with the job object.


