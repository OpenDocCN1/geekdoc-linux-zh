    Use GnuPG (available at http://www.gnupg.org). To encrypt a plain text file with
    Gnupg, enter `gpg -c textfile` where `textfile` is the name of the file that you
    want to encrypt. Enter the password twice as requested, and `textfile.gpg` will
    appear in the same location as the original file. Delete the original file (if
    desired), and when the time comes to decrypt, simply enter `gpg textfile.gpg`
    and provide the valid passphrase. The original file should appear. The old UNIX
    `crypt` command should no longer be used. The contents of the files can be verified
    with `cksum` or `md5sum` if they are available on your UNIX implementation and
    the checksums were previously computed.


    ## 1.160. How can a user remind another user about an important meeting taking
    place on a certain date, at a certain hour?


    A very good way is to use the `at` command as it follows:


    ```bash

    $ at 9:30am Mar 29

    echo “Meeting at 10” | mail frank

    <Ctrl-d>

    ```


    ## 1.161. How can a user execute a long command and still have the terminal available
    for work?


    The user may execute the long command in the background using the `&` command
    as follows:


    ```bash

    $ wc -c hugefil > wordcount &

    ```


    ## 1.162. Once the background command has been started, can it be aborted like
    any other foreground command?


    If the shell has job control, the command `fg` will bring the background process
    to the foreground, where the interrupt key (Control-C) will kill it (unless a
    signal handler is installed). Otherwise, background commands cannot be aborted
    with the interrupt key; instead, you have to use the `kill` command. The shell
    will print a number when launching a background process. This number is the Process
    ID (PID) of the background process and would be supplied to the `kill` command
    to terminate the process. For example, `kill 123` would send the default kill
    signal (`SIGINT`). It is possible that the program has configured itself to ignore
    `SIGINT`, in which case signal level 9 (`SIGKILL`) could be used to forcibly terminate
    the process, as in `kill -9 123`.


    ## 1.163. What is a filesystem?


    A filesystem is a distinct division of the operating system consisting of files,
    directories, and the information needed to locate them. A filesystem can be thought
    of as a structure upon which directories and files are constructed.


    ## 1.164. What happens if you have a directory such as /tmp, and you mount a filesystem
    such as /dev/u, on this directory?


    If any files existed in the `/tmp` directory before the filesystem was mounted,
    they will disappear and then reappear when the filesystem is unmounted.


    ## 1.165. Can the system administrator enable users to mount a filesystem?


    Normally, only the super user can mount or unmount filesystems. Some vendors offer
    proprietary UNIX extensions to grant this ability to non-root users, but a method
    to accomplish this that is largely portable across different UNIX versions is
    the use of the `sudo` package. A non-root user might need these permissions in
    order to mount a CD-ROM or a floppy.


    ## 1.166. Does it make sense for a directory to have the execute permission on
    it?


    Yes, it does. If a directory does not have the execute permission on it, you cannot
    do a `cd` command to it.


    ## 1.167. By default, the GID (group identifier) of a newly created file is set
    to the GID of the creating process or user. How can this behavior be changed?


    This behavior can be changed by setting the `SGID` bit on that directory which
    results in a new file having the GID of the directory.


    ## 1.168. What is a link between files, and what is the command you would use
    to link files?


    A link is a directory entry referring to an inode. The same inode (file) can have
    several links. Any changes made to the file are effectively independent of the
    name by which the file is known. A file is not deleted until its last link is
    removed. The command to create links is `ln`.


    ## 1.169. What are the two types of links?


    Hard links, which increase the link count for a file and cannot span filesystem
    boundaries, and soft links, which can span filesystems but do not increase the
    link count.


    ## 1.170. Which type of link consumes an inode, and which type does not?


    A soft link will always consume an inode, but secondary hard links will not. Each
    physical file in a filesystem consumes a single inode, regardless of the number
    of hard links. A soft link, which cannot contain inode information since it may
    be on a separate filesystem, must consume an inode.


    ## 1.171. What is the most common way of locating files?


    The most common way is by using the `find` command, which enables you to locate
    all files with a specified name, permissions setting, size, type, owner, or last
    access or modification date. The `locate` and `whereis` commands are also prevalent
    on many versions of UNIX, and might be useful.


    ## 1.172. How can you search a file for occurrences of a word or phrase?


    The `grep` command displays all lines in a file that contain the key word or phrase.
    It is a good practice to enclose the search pattern in single quotes in order
    to protect it from command substitution in the shell.


    ## 1.173. How can you list the names of all files in all subdirectories in which
    there is a certain pattern?


    You can use a combination of two commands:


    ```bash

    find . -exec grep -1 “pattern” {} \;

    ```


    ## 1.174. Assuming you have a big file and you want to clear it, but you want
    to keep its permissions, what could you do?


    For the Bourne family of shells:


    ```bash

    $ /dev/null > filename

    ```


    For C shell:


    ```bash

    $ cat /dev/null > filename

    ```


    ## 1.175. Assuming that directory becomes too large (has too many entries) and
    you decide to make two directories out of it (one of which has the name), how
    would you proceed?


    On some UNIX implementations, a directory, even if you remove all files, never
    shrinks. Therefore, you should make two new directories, move all files into them,
    remove the old directory, and then rename one of the new directories using the
    name of the old one.


    ## 1.176. What is the purpose of lost+found directory in a filesystem?


    During `fsck` (filesystem check) command, any files that are unreferenced but
    valid are placed in this special directory `lost+found`. Depending upon the filesystem
    implementation, the `fsck` command does not create or extend this directory; therefore,
    it has to contain a sufficient number of empty slots for `fsck` to use when reconnecting
    files.


    ## 1.177. List three commands often used for archive or data transfer between
    devices.


    The three most common are `tar`, `cpio`, and `dd`. If you were to make a script
    to back up your system, how would you make it? The script would look something
    like:


    ```bash

    cd /

    find . -follow -print ! cpio -ovaBL > /dev/rmt0 2> /u/list

    ```


    where in the file `/u/list` a list of the backed-up files would be obtained. Otherwise,
    you could use an alternate approach of:


    ```bash

    tar cvf /dev/rct2 .

    ```


    If you are using GNU `tar`, you can use the `cvzf` option to enable compression
    (but `cpio` has better ability to recover from faulty tape). These scripts should
    have root’s permissions.


    ## 1.178. Once you obtain a stable system, that is, a good kernel, what are some
    of the first things the system administrator should do?


    First, a backup of the entire system should be made. Then, depending upon directions
    for the specific UNIX implementation, the administrator should make a bootable
    diskette and then a root filesystem diskette. This way, if the root filesystem
    gets corrupted beyond repair, you can boot the system and restore the system from
    tapes.


    ## 1.179. What steps should be followed when you find you have an unusable root
    filesystem?


    In case of an unusable root filesystem, the administrator can either reinstall
    the OS, or, if good backups exist, run `fsck` on the root filesystem until it
    passes (or reformat it), then follow these steps:


    1. Boot from the diskette.

    2. Insert the root filesystem diskette, when prompted.

    3. `mount /dev/hdOroot /mnt`

    4. `cd /mnt`

    5. `./usr/bin/tar xvf ./dev/rct0`

    '
