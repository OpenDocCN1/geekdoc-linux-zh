- fmt: '

    When upgrading shared libraries, you can test out a library before replacing it.
    In a similar vein, in case your upgrade program depends on shared libraries and
    may freak out if you replace a shared library out from under it, you can use `LD_LIBRARY_PATH`
    to point to a directory with copy of a shared libraries and then you can replace
    the system copy without worry. You can even undo things should things fail by
    moving the copy back.


    X11 uses `LD_LIBRARY_PATH` during its build process. X11 distributes its fonts
    in “bdf” format, and during the build process it needs to “compile” the `bdf`
    files into “pcf” files. `LD_LIBRARY_PATH` is used to point to the build lib directory
    so it can run `bdftopcf` during the build stage before the shared libraries are
    installed.


    Perl can be installed with most of its core code as a shared library. This is
    handy if you embed Perl in other programs - you can compile them so they use the
    shared library and so you’ll save memory at run time. However Perl uses Perl scripts
    at various points in the build and install process. The `perl` binary won’t run
    until its shared libraries are installed, unless `LD_LIBRARY_PATH` is used to
    bootstrap the process.


    ## 1.42. What command can be used to find out idle processes?


    `ps`


    ## 1.43. Which command can be used to read from logged data?


    `sar`


    ## 1.44. What are the different types of files in UNIX?


    There are several kinds of UNIX files: regular files, directories, symbolic links,
    special files, named pipes (FIFOs), and sockets.


    ## 1.45. What are regular files?


    Regular files contain bytes of data, organized into a linear array. Any byte or
    sequence of bytes may be read or written. Reads and writes start at a byte location
    specified by the file offset, which can be set to any value (even beyond the end
    of the file). Regular files are stored on disk. It is not possible to insert bytes
    into the middle of a file (spreading the file apart), or to delete bytes from
    the middle (closing the gap). As bytes are written onto the end of a file, it
    gets bigger, one byte at a time. A file can be shrunk or enlarged to any length,
    discarding bytes or adding bytes of zeroes. Two or more processes can read and
    write the same file concurrently. The results depend on the order in which the
    individual I/O requests occur and are in general unpredictable. To maintain order,
    there are file-locking facilities and semaphores, which are system-wide flags
    that processes can test and set.


    ## 1.46. What is an i-node?


    Files do not have names; they have numbers called i-numbers. An i-number is an
    index into an array of i-nodes, kept at the front of each region of disk that
    contains a UNIX file system. Each i-node contains important information about
    one file. Interestingly, this information does not include either the name or
    the data bytes. It does include the following: type of file (regular, directory,
    socket, etc.); number of links; owner’s user and group ID; three sets of access
    permissions - for the owner, the group, and others; size in bytes; time of last
    access, last modification, and status change (when the i-node itself was last
    modified); and, of course, pointers to disk blocks containing the file’s contents.


    ## 1.47. Describe directories and symbolic links.


    Since it is inconvenient to refer to files by i-number, directories are provided
    to allow names to be used. In practice, a directory is almost always used to access
    a file.


    Each directory consists, conceptually, of a two-column table, with a name in one
    column and its corresponding i-number in the other column. A name/i-node pair
    is called a link. When the UNIX kernel is told to access a file by name, it automatically
    looks in a directory to find the i-number. Then it gets the corresponding i­-node,
    which contains more information about the file (such as who can access it). If
    the data itself is to be accessed, the i-node tells where to find it on the disk.


    Directories, which are almost like regular files, occupy an i-node and have data.
    Therefore, the i-node corresponding to a particular name in a directory could
    be the i-node of another directory. This allows users to arrange their files into
    the hierarchical structure that’s familiar to users of UNIX. A path such as `memo/july/smith`
    instructs the kernel to get the i-node of the current directory to locate its
    data bytes, find `memo` among those data bytes, take the corresponding i-number,
    get that i-node to locate the `memo` directory’s data bytes, find `july` among
    those, take the corresponding i-number, get the i-node to locate the `july` directory’s
    data bytes, find `smith`, and, finally, take the corresponding i-node, the one
    associated with `memo/july/smith`.


    In following a relative path (one that starts with the current directory), how
    does the kernel know where to start? It simply keeps track of the i-number of
    the current directory for each process. When a process changes its current directory,
    it must supply a path to the new directory. That path leads to an i-number, which
    then is saved as the i-number of the new current directory.


    An absolute path begins with a `/` and starts with the root directory. The kernel
    simply reserves an i-number (2, say) for the root directory. This is established
    when a file system is first constructed. There is a system call to change a process’s
    root directory (to 2).


    Because the two-column structure of directories is used directly by the kernel
    (an invalid directory could easily destroy an entire system), a program (even
    run by the superuser) cannot write a directory as if it were a file. Instead,
    use special set of system calls. It is possible for two or more links, in the
    same or different directories, to refer to the same i-number. This means that
    the same file may have more than one name. There is no ambiguity when accessing
    a file by a given path, since only one i-number will be found. It might have been
    found via another path, but that’s irrelevant. When a link is removed from a directory,
    however, it isn’t immediately clear whether the i-node and the associated data
    bytes can be thrown away. That is why the i-node contains a link count. Removing
    a link to an i-node merely decrements the link count; when the count reaches zero,
    the kernel discards the file.


    There is no structural reason why there can’t be multiple links to directories
    as well as to regular files. However, this complicates the programming of commands
    that scan the entire file system, so most kernels outlaw it.


    Multiple links to a file using i-numbers work only if the links are in the same
    file system, as i-numbers are unique only within a file system. To get around
    this, there are also symbolic links, which put the path of the file to be linked
    to in the data part of an actual file. This is more overhead than just making
    a second directory link somewhere, but it’s more general. You don’t read and write
    these symbolic-link files, but instead use special system calls just for symbolic
    links.


    ## 1.48. What are special files?


    A special file is typically some type of device (such as a CD-ROM drive or communications
    link). Sometimes named pipes are considered special files.


    There are two principal kinds of device special files: block and character. Block
    special files follow a particular model: The device contains an array of fixed-size
    blocks (say, 4096 bytes each), and a pool of kernel buffers are used as a cache
    to speed up I/O. Character special files don’t have to follow any rules at all.
    They might do I/O in very small chunks (characters) or very big chunks (disk tracks),
    and so they are too irregular to use the buffer cache.

