    $(RM) $(PROG_OBJS) $(PROG)   


    Write a typical makfile.             


    DEPTH = ../..


    LIBRARY_NAME = alert


    INC = -I$(DEPTH)/shared/base \


          -I$(DEPTH)/thirdparty/postgresql-8.0.1/include \


          -I/usr/local/pgsql/include


    LIBS = -lbase -L/usr/local/pgsql/lib \


          -L$(DEPTH)/thirdparty/postgresql-8.0.1/lib -lpq


    include $(DEPTH)/config/rules.mk  


    ## 1.59. Write a UNIX command to list the biggest file in any directory.


    This will list the biggest file on a filesystem or /directory


    ls -lsR /filesystem | sort -rn


    Here we have taken a list of our files sorted alphabetically, each with the size
    in blocks. We have run this to the standard input of the sort command asking it
    to sort numerically in reverse order (largest first). This output has then been
    run into the command head which gives us the first few lines. In this case we
    have asked head for the first 5 lines. Thus this command gives us the names and
    sizes of our 5 largest files.


    ls -lsR | sort -rn | head -5


    find /”filesystem name”-name “*” -type f -exec ls -lR {} \; | awk ‘{print $5”  “
    $9}’|sort -nr


    ## 1.60. What are the advantages of logging in to UNIX system?             


    Logging in serves a few purposes, including giving you access to your files and
    configurations. It also, however, keeps you from inadvertently accessing someone
    else’s files and settings, and it keeps you from making changes to the system
    itself.  After you have logged in, you will be located in your home directory,
    which is where your personal files and settings are stored.  Virtually all UNIX
    systems require passwords to help ensure that your files and data remain your
    own and that the system itself is secure from vandals and hackers.


    ## 1.61. What are the guidelines for creating a password?             


    In addition to following any password guidelines your system administrator mandates,
    you should choose a password that is:


    At least six characters long


    Easy for you to remember


    Not a word or name in any dictionary in any language


    A combination of capital and lowercase letters, numbers, and symbols


    Not similar to your userid


    Not identical or similar to one you have used recently


    Not your telephone number, birth date, kid’s birth date, anniversary, mother’s
    maiden name, or anything else that anyone might associate with you.


    ## 1.62. What are the guidelines for changing a password?             


    You should normally change your password lots of times as follows:


    · You will probably want to change the password provided by your system administrator
    after you log in for the first time.


    · You will probably change your password at regular intervals, as many UNIX systems
    require that you change your password every so often - every 30 or 60 days or
    so is common.


    · You might also change your password voluntarily if you think that someone might
    have learned it or if you tell anyone your password (although you really should
    not do that anyway).


    ## 1.63. Can you really break up the UNIX system?             


    In general, no. When you log into a UNIX system and use your personal userid,
    the worst you can do is remove your own directories and files. As long as you
    are logged in as yourself, commands you type would not affect anything critical
    to the UNIX system, only your personal directories and files. Score one for UNIX
    - as an average user, you cannot break the system. With Windows or Macintosh,
    though, it is a different story.


    If you have system administrator rights, meaning that you can log in as root (giving
    you access to all the system directories and files), you can do a lot of damage
    if you are not extremely careful. For this reason, do not log in as root unless
    you absolutely have to.


    ## 1.64. Where do you use su command?             


    Occasionally, you may need to log in with a userid other than your own or need
    to re-log in with your own userid. For example, you might want to check configuration
    settings that you have changed before logging out to make sure that they work.
    Or, if you change your shell, you might want to check it before you log out.


    You can use the su (substitute user) command to either log in as another user
    or to start a new login shell.


    su newuserid /* to log in as a different user with su


    su - yourid /* to start a new login shell with su. The addition of the hyphen
    (-) will force a new login shell and set all of the environment variables and
    defaults according to the settings for the user.


    If you have root access and telnet to the system to administer it, you should
    use su to provide a little extra security. Rather than logging in directly as
    root and leaving the remote possibility of having your password stolen (or sniffed)
    over the network, log in as yourself, then use su (with no other information)
    to change to root.


    sed


    sed lets you make multiple changes to files without ever opening an editor.


    awk


    While sed is line-oriented, awk is field-oriented and is ideal for manipulating
    database or comma-delimited files. For example, if you have an address book file,
    you can use awk to find and change information in fields you specify.


    ## 1.65. What is piping?


    The process, in which you connect the output of one program to the input of another,
    is called piping. Depending on what you want to do, you can pipe together as many
    commands as you want - with the output of each acting as the input of the next.


    ## 1.66. What are the common UNIX directories and their contents?


    /bin                 Essential programs and commands for use by all users


    /etc                 System configuration files and global settings


    /home             Home directories for users


    /sbin               Programs and commands needed for system boot


    /tmp               Temporary files


    /usr/bin           Commands and programs that are less central to basic UNIX system
    functionality than those in /bin but were installed with the system


    /usr/local         Most files and data that were developed or customized on the
    system


    /usr/local/bin   Locally developed or installed programs


    /usr/local/man  Manual (help) pages for local programs


    /usr/share/man Manual (help) pages


    /var                 Changeable data, including system logs, temporary data from
    programs, and user mail storage


    ## 1.67. Describe common UNIX shells.


    When you access UNIX, the first thing you see is the prompt, called the shell
    prompt, which is where you interact with the UNIX system. The shell determines
    how easily you can enter and reenter commands and how you can control your environment.
    You are not stuck with one shell - that is, on most systems you can choose to
    use different shells that have different features and capabilities.


    sh - This shell, which is the original UNIX shell (often called the Bourne shell),
    is great for scripting but lacks a lot of the flexibility and power for interactive
    use that you might want. For example, it does not have features like command completion,
    email checking, or aliasing.


    csh and tcsh - This family of shells adds great interactive uses but discards
    the popular scripting support that sh offers in favor of C programming-ish syntax.
    Because of the C syntax, this shell is often just called C shell.


    ksh, bash, and zsah - These provide a good blend of scripting and interactive
    capabilities, but they stem from different sources (bash is most similar to sh,
    hence the Bourne Again SHell name).


    ## 1.68. What is the difference between cmp and diff?'
