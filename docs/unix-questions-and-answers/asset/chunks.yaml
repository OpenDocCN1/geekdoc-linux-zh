- fmt: "\n# Deadlock\nA state where threads compete for resources, waiting for each\
    \ other in a permanent state of stalemate. Deadlock means two (or more) threads\
    \ cannot move because each one is waiting on a lock the other one is holding.\
    \ For example, thread A is holding one lock and waiting on another lock held by\
    \ thread B. At the same time, thread B is waiting on the lock thread A is holding.\
    \ Thus, neither of the threads will be able to run and the threads are in a state\
    \ of deadlock. This is a very serious issue because it causes the program to halt.\n\
    \nLivelock results from deadlock. Similar to deadlock except the threads have\
    \ got trapped into endless thrashing. Some machines have mechanisms to detect\
    \ deadlock. Often, to resolve deadlock, all the threads drop all their locks and\
    \ try to move forward. It is possible, though, that after the locks are dropped\
    \ the threads may run through the same code that produced the initial-dead and\
    \ end up in deadlock again. This process of reaching deadlock, dropping locks,\
    \ and returning to deadlock is called livelock. Even though the threads are not\
    \ in deadlock, they have stopped accomplishing their tasks.\n\n# Starvation\n\
    Starvation is when a thread that is not blocked never gets scheduled because of\
    \ unfair behavior of other threads and the way they communicate.\n\n# Busy waiting\n\
    Busy waiting is a thread problem that does not stop the program from working correctly\
    \ but affects performance. It occurs when a thread wakes up, realizes it needs\
    \ to wait on a resource, and continues to check the resource until it is swapped\
    \ out. This is a problem because nothing useful happens while a thread is continually\
    \ checking the same thing. The efficiency a program gains by using threads can\
    \ be lost in busy waiting. Threads waiting on a resource should sleep until the\
    \ resource becomes available. This avoids busy waiting.\n\n# Over-locking\nOver-locking\
    \ is another problem that affects performance. Consider the following code:\n\n\
    ```c\nwait(semaphore);\n\n/* value is a global variable that needs to have its\
    \ access synchronized. */\n\nvalue++;\n\n/* lots of time consuming stuff that\
    \ does not have to be synchronized */\n\n/* … */\n\nsignal(semaphore);\n```\n\n\
    While this code will run correctly, it unnecessarily locks resources. It forces\
    \ time-consuming code to be run serially when it does not need to be. This can\
    \ create severe performance problems that eliminate the advantages usually gained\
    \ by using threads.\n\n## 1.12. What is deadlock? How can I eliminate it?\nDeadlock\
    \ is one of the four particular hazards facing designers of multi-threaded programs.\
    \ The four hazards are: race, deadlock, livelock, and starvation. All four conditions\
    \ cannot be eliminated merely by testing. Testing may indicate the presence of\
    \ a deadlock, but it cannot be relied upon to indicate freedom from deadlock.\
    \ This must happen by good design.\n\nA clear model that aids good design is CSP\
    \ or Communicating Sequential Processes (invented by Tony Hoare, who also invented\
    \ monitors). CSP is a language for describing patterns of interaction. It is supported\
    \ by an elegant, mathematical theory, a set of proof tools, and an extensive literature.\
    \ Recent theoretical work has proven that CSP can be used completely reliably\
    \ in Java. Doug Lea’s book describes `JCSP`, one of the two libraries through\
    \ which this is achieved. Using `JCSP` (or `CTJ`, the other library), it is possible\
    \ to design Java programs of any complexity that are provably free from deadlock,\
    \ livelock, race or starvation.\n\nThe following solutions must be applied to\
    \ your particular needs; sometimes it will be impossible to use one or more of\
    \ them:\n\n- Design your program so the only access to a thread-unsafe object\
    \ is through a thread-safe object.\n- Spawn new threads to handle each part of\
    \ the transaction. If each thread only locks one object at a time there can be\
    \ no deadlock.\n- Check and back off: If you can test to see if another thread\
    \ has a lock you want, you can “back off” instead of locking it, allowing it to\
    \ complete its transaction before trying again. This can’t be done with normal\
    \ Java locks, but you can try to write your own lock object to satisfy them.\n\
    - Timeout: If you write your own lock object, it can automatically return from\
    \ the `lock` method if a certain amount of time elapses.\n- Minimize or remove\
    \ synchronization: If there’s no lock, there’s no deadlock!\n\n## 1.13. What is\
    \ the difference between multithreading and multitasking? What about multiprogramming?\
    \ Multiprocessing?\nMultitasking is running multiple “heavyweight” processes (tasks)\
    \ by a single OS.\n\nMultithreading is running multiple “lightweight” processes\
    \ (threads of execution) in a single process / task / program.\n\nMultiprogramming\
    \ is essentially a synonym for multitasking (though multitasking connotes sharing\
    \ more resources than just the CPU, and is the more popular term).\n\nMultiprocessing\
    \ involves using multiple CPUs, either in the same (SMP) or different (MPP) host\
    \ boxes, to run a program.\n\nMost Java implementations will split threads among\
    \ different processors if they are running on an SMP box.\n\n## 1.14. Describe\
    \ program, process, fork, exec, waitpid.\nA program is an executable file residing\
    \ in a disk file. A program is read into memory and executed by the kernel.\n\n\
    An executing instance of a program is called a process. Every UNIX process is\
    \ guaranteed to have a unique numeric identifier called the process ID. The process\
    \ ID is always a nonnegative integer.\n\nThere are three primary functions used\
    \ for process control: `fork`, `exec`, and `waitpid`.\n\nWe call `fork` to create\
    \ a new process. The new process is a copy of the caller, and we say the caller\
    \ is the parent and the newly created process is the child. Then `fork` returns\
    \ the nonnegative process ID of the new process process to the parent, and it\
    \ returns 0 to the child. Since `fork` creates a new process, we say that it is\
    \ called once (by the parent) but returns twice (in the parent and in the child).\n\
    \nThe combination of a `fork`, followed by `exec`, is what some operating systems\
    \ call spawning a new process. In UNIX the two parts are separated into individual\
    \ functions.\n\nUsing `waitpid`, we specify which process we want to wait for\
    \ (the `pid` argument). The `waitpid` function also returns the status of the\
    \ child (the `status` variable). We could examine it to determine how the child\
    \ terminated.\n\n```c\nwaitpid(pid, &status, 0)\n```\n\n## 1.15. What is a fork\
    \ in UNIX?\nThe `fork()` function is used to create a new process from an existing\
    \ process. The new process is called the child process, and the existing process\
    \ is called the parent. You can tell which is which by checking the return value\
    \ from `fork()`. The parent gets the child’s `pid` (process id) returned to him,\
    \ but the child gets 0 returned to him.\n\nNew process starts execution by returning\
    \ from `fork()`. Child and parent are nearly identical. Parent gets the process\
    \ id from `fork()`. Child gets 0 back from `fork()`. Parent should wait for child\
    \ to exit.\n\n```cpp\n#include <iostream.h>\n#include <stdlib.h>\n#include <unistd.h>\n\
    #include <sys/types.h>\n#include <sys/wait.h>\n\nint main (int argc, char **argv)\n\
    {\n    int i, pid;\n\n    pid = fork();\n\n    cout << pid << endl;\n\n    for\
    \ ( i = 0; i < 5; i++) {\n        cout << getpid() << ‘  ‘ << i << endl;\n   \
    \ }\n\n    if ( pid ) wait(NULL);\n}\n```\n\n## 1.16. What are the problems with\
    \ fork? How threads solves these problems?\nIn the traditional UNIX model, when\
    \ a process needs something performed by another entity, it forks a child process\
    \ and lets the child perform the processing. Most network servers under UNIX,\
    \ for example, are written this way. Although this paradigm has served well for\
    \ many years, there are problems with fork:\n\nfork is expensive. Memory is copied\
    \ from the parent to the child; all descriptors are duplicated in the child, and\
    \ so on. Current implementations use a technique called copy-on-write, which avoids\
    \ a copy of the parent’s data space to the child until the child needs its own\
    \ copy; but regardless of this optimization, fork is expensive.\n"
  raw: 'Deadlock: A state where threads compete for resources, waiting for each other
    in a permanent state of stalemate. Deadlock means two (or more) threads cannot
    move because each one is waiting on a lock the other one is holding. For example,
    thread A is holding one lock and waiting on another lock held by thread B. At
    the same time, thread B is waiting on the lock thread A is holding. Thus, neither
    of the threads will be able to run and the threads are in a state of deadlock.
    This is a very serious issue because it causes the program to halt.


    Livelock results from deadlock. Similar to deadlock except the threads have got
    trapped into endless thrashing. Some machines have mechanisms to detect deadlock.
    Often, to resolve deadlock, all the threads drop all their locks and try to move
    forward. It is possible, though, that after the locks are dropped the threads
    may run through the same code that produced the initial deadlock and end up in
    deadlock again. This process of reaching deadlock, dropping locks, and returning
    to deadlock is called livelock. Even though the threads are not in deadlock, they
    have stopped accomplishing their tasks.


    Starvation: Starvation is when a thread that is not blocked never gets scheduled
    because of unfair behavior of other threads and the way they communicate.


    Busy waiting is a thread problem that does not stop the program from working correctly
    but affects performance. It occurs when a thread wakes up, realizes it needs to
    wait on a resource, and continues to check the resource until it is swapped out.
    This is a problem because nothing useful happens while a thread is continually
    checking the same thing. The efficiency a program gains by using threads can be
    lost in busy waiting. Threads waiting on a resource should sleep until the resource
    becomes available. This avoids busy waiting.


    Over-locking is another problem that affects performance. Consider the following
    code:


    wait(semaphore);


    /* value is a global variable that needs to have its access synchronized. */


    value++;


    /* lots of time consuming stuff that does not have to be synchronized */


    /* … */


    signal(semaphore);


    While this code will run correctly, it unnecessarily locks resources. It forces
    time-consuming code to be run serially when it does not need to be. This can create
    severe performance problems that eliminate the advantages usually gained by using
    threads.


    ## 1.12. What is deadlock? How can I eliminate it?


    Deadlock is one of the four particular hazards facing designers of multi-threaded
    programs. The four hazards are: race, deadlock,  livelock, and starvation.  All
    four conditions cannot be eliminated merely by testing. Testing may indicate the
    presence of a deadlock, but it cannot be relied upon to indicate freedom from
    deadlock. This must happen by good design.


    A clear model that aids good design is CSP or Communicating Sequential Processes
    (invented by Tony Hoare, who also invented monitors). CSP is a language for describing
    patterns of interaction. It is supported by an elegant, mathematical theory, a
    set of proof tools, and an extensive literature. Recent theoretical work has proven
    that CSP can be used completely reliably in Java. Doug Lea’s book describes JCSP,
    one of the two libraries through which this is achieved. Using JCSP (or CTJ, the
    other library), it is possible to design Java programs of any complexity that
    are provably free from deadlock, livelock, race or starvation.


    The following solutions must be applied to your particular needs; sometimes it
    will be impossible to use one or more of them:


    · Design your program so the only access to a thread-unsafe object is through
    a thread-safe object.


    · Spawn new threads to handle each part of the transaction. If each thread only
    locks one object at a time there can be no deadlock.


    · Check and back off: If you can test to see if another thread has a lock you
    want, you can “back off” instead of locking it, allowing it to complete its transaction
    before trying again. This can’t be done with normal Java locks, but you can try
    to write your own lock object to satisfy them.


    · Timeout: If you write your own lock object, it can automatically return from
    the “lock” method if a certain amount of time elapses.


    · Minimize or remove synchronization: If there’s no lock, there’s no deadlock!


    ## 1.13. What is the difference between multithreading and multitasking? What
    about multiprogramming? Multiprocessing?


    Multitasking is running multiple “heavyweight” processes (tasks) by a single OS.


    Multithreading is running multiple “lightweight” processes (threads of execution)
    in a single process / task / program.


    Multiprogramming is essentially a synonym for multitasking (though multitasking
    connotes sharing more resources than just the CPU, and is the more popular term).


    Multiprocessing involves using multiple CPUs, either in the same (SMP) or different
    (MPP) host boxes, to run a program.


    Most Java implementations will split threads among different processors if they
    are running on an SMP box.


    ## 1.14. Describe program, process, fork, exec, waitpid.


    A program is an executable file residing in a disk file. A program is read into
    memory and executed by the kernel.


    An executing instance of a program is called a process. Every UNIX process is
    guaranteed to have a unique numeric identifier called the process ID. The process
    ID is always a nonnegative integer.


    There are three primary functions used for process control: fork, exec, and waitpid.


    We call fork to create a new process. The new process is a copy of the caller,
    and we say the caller is the parent and the newly created process is the child.
    Then fork returns the nonnegative process ID of the new child process to the parent,
    and it returns 0 to the child. Since fork creates a new process, we say that it
    is called once (by the parent) but returns twice (in the parent and in the child).


    The combination of a fork, followed by an exec, is what some operating systems
    call spawning a new process. In UNIX the two parts are separated into individual
    functions.


    Using waitpid, we specify which process we want to wait for (the pid argument).
    The waitpid function also returns the termination status of the child (the status
    variable). We could examine it to determine exactly how the child terminated.


    waitpid(pid, &status, 0)             


    ## 1.15. What is a fork in UNIX?


    The fork() function is used to create a new process from an existing process.
    The new process is called the child process, and the existing process is called
    the parent. You can tell which is which by checking the return value from fork().
    The parent gets the child’s pid (process id) returned to him, but the child gets
    0 returned to him.


    New process starts execution by returning from fork. Child and parent are nearly
    identical. Parent gets the child process id from fork. Child gets 0 back from
    fork. Parent should wait for child to exit.


    #include <iostream.h>


    #include <stdlib.h>


    #include <unistd.h>


    #include <sys/types.h>


    #include <sys/wait.h>


    int main (int argc, char **argv)


    {


    int i, pid;


    pid = fork();


    cout << pid << endl;


    for ( i = 0; i < 5; i++) {


    cout << getpid() << ‘  ‘ << i << endl;


    }


    if ( pid ) wait(NULL);


    }


    ## 1.16. What are the problems with fork? How threads do solves these problems?


    In the traditional UNIX model, when a process needs something performed by another
    entity, it forks a child process and lets the child perform the processing. Most
    network servers under UNIX, for example, are written this way. Although this paradigm
    has served well for many years, there are problems with fork:


    fork is expensive. Memory is copied from the parent to the child; all descriptors
    are duplicated in the child, and so on. Current implementations use a technique
    called copy-on-write, which avoids a copy of the parent’s data space to the child
    until the child needs its own copy; but regardless of this optimization, fork
    is expensive.'
