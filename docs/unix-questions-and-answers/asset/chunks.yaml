    命令在执行开始时已知的变量变量及其关联值构成了其环境。该环境包括命令从其父进程继承的变量，以及在调用该命令的命令行中作为关键字参数指定的变量。shell 传递给子进程的变量是那些被指定为
    `export` 命令（或 C shell 的 `setenv` 命令）参数的变量。


    ### 1.205. 如何在 shell 脚本中初始化新变量并在稍后的登录 shell 中使用它们？


    在 Bourne shell 家族中，使用点符号 `.` 命令，这会使 shell 从脚本中读取命令而不会产生新的子 shell。在 C shell 中，使用
    `source` 命令代替。在脚本中对变量所做的修改在 `.` 命令执行完成后就会生效。该命令的格式如下：`.procedure` (Bourne shell)
    或 `source procedure` (C shell)。


    ### 1.206. 如何解决以下情况：你希望用户在登录后直接进入应用程序；一旦他们退出应用程序，你就希望他们注销系统？


    一种非常有效的方法是将他们的 `.profile` 或 `.login` 脚本作为最后一条命令，即使用 `exec` 命令，并将应用程序的名称作为参数。这样，一旦用户退出应用程序，他们就会注销系统。


    另一种方法是在 `/etc/passwd` 中将应用程序设置为登录 shell。


    ### 1.207. 如何确保在脚本执行期间创建的工作文件即使在脚本被中断也能被删除？


    在 shell 脚本内部，你仍然可以使用 `trap` 命令在接收到中断信号时采取行动（在这种情况下是删除文件）。`trap` 命令的一个示例是：


    ```

    trap ‘rm -f tempfile; exit’ 0 2 3 15

    ```


    ### 1.208. 假设你必须在晚上运行备份，但没有夜间管理员，且备份工具在启动前会提示你回答问题，你会如何解决这个问题？


    创建一个 shell 脚本并将其放入 `crontabs` 目录，由 `cron` 进程运行。该脚本将使用“在此文档”（here document）：它将包含交互式命令（需要回答的命令），随后跟着
    `<< eoi`，其中 `eoi` 是一个任意字符串，表示输入的结束。如果命令使用了 curses 库，则需要更复杂的解决方案，可能涉及 `expect`
    工具。示例如下：


    ```

    command <<- eoi

    ```


    ### 1.209. 如何将命令的标准输出和标准错误写入到同一个文件中？


    你可以通过使用文件描述符来实现。文件描述符是打开的文件的句柄。C 语言语言定义了默认文件指针 `STDIN`、`STDOUT` 和 `STDERR`（标准输入、输出和错误）。管道和简单的重定向会改变
    `STDIN` 和 `STDOUT`，但在 Bourne 家族中可以使用 `2>` 符号显式指定 `STDERR`（此功能在 C shell 中不可用，这是其主要缺陷之一）。如有必要，可以使用
    `1>` 显式引用 `STDOUT`。此外，可以使用 `2>&1` 符号将 `STDOUT` 和 `STDERR` 合并到同一个文件中。示例命令如下所示：


    ```

    command 1>file name 2>&1

    ```


    ### 1.210. 在命令列表中，如何安排命令，以便当其中一个命令失败时，停止列表的执行？


    列表看起来应该像这样：


    ```

    commandl && command2 && command3 &&...&& commandn

    ```


    ### 1.211. 在命令列表中，如何安排命令，使得只有在第一个命令失败时，才执行第二个命令？


    列表看起来应该像这样：


    ```

    commandl || command2

    ```


    执行第一个命令，检查其退出状态，只有当其值不为零时，才会执行第二个命令。


    ### 1.212. 如果其中一个文件系统耗尽了节点（inodes），你可以做什么来修复这个问题？


    你可以备份文件系统、卸载该文件系统、重新运行 `mkfs` 并为文件系统指定更多的节点、挂载文件系统，然后恢复备份。


    ### 1.213. 如何检查文件系统的空闲空间？


    你可以使用 `df` 命令。`df` 命令报告文件系统的磁盘空间使用情况。在某些系统上，该工具以 512 字节块为单位大小。


    ### 1.214. 如果用户对某个目录具有写权限，但无法删除该目录中的文件，这意味着什么？


    这意味着该目录设置了粘滞位（sticky bit）。粘滞位是一种目录保护设置，允许文件的所有者（或超级用户）从该目录中删除文件。


    ### 1.215. 可以使用什么命令来比较两个文本文件？


    可以使用 `diff` 命令找出为了使两个文件一致而必须更改的行。这对于查找同一个源程序的两个版本之间的差异特别有用。`diff3` 命令用于比较三个独立的文件并合并它们之间的更改。


    ### 1.216. 如何将文本文件从 UNIX 格式转换为 MS-DOS 格式？


    DOS 文本文件与 UNIX 文本文件的区别在于它们在每行的末尾除了换行符（`\n `）之外还包含回车（`\r`）。虽然大多数 UNIX 供应商都包含了此类此类转换的工具，但现代版本的
    UNIX `awk` 工具如果按照以下语法调用，可以剥离回车：


    ```

    awk ‘{sub(/\r/,”“); print;}’ dos.txt > UNIX.txt

    ```


    ### 1.217. 什么是 umask？


    `umask` 是系统使用的一个三位八进制数，用于建立新创建文件的权限。系统从 777 中减去这个数字，结果即为新文件的权限。普通文件永远不会带有执行位（使用掩码），但目录允许执行位（扫描）通过。


    ### 1.218. 如何查看当前赋值的变量？


    通过输入不带参数的命令 `env` 可以获取当前赋值的变量列表。该列表可能很长，因此最好将 `env` 的输出通过到 `greater`。


    ### 1.219. 使用什么命令可以归档原始设备？


    可以使用 `dd` 命令，它允许指定输入和输出块大小等选项。


    ### 1.220. 什么是设备驱动？


    设备驱动是内核的软件程序，用于与硬件接口。UNIX 将大多数设备表示为位于 `/dev` 目录下的块或字符特殊文件。每个设备都有主从号。


    ### 1.221. 什么是 UNIX 守护进程？


    UNIX 守护进程是执行特定系统任务的进程集合。两个例子是 `init` 和 `crond` 守护进程。


    ### 1.222. 假设你希望每次启动系统时启动数据库引擎，你会如何做？


    在 `/etc/rc*` 中添加必要的命令。


    ### 1.223. 系统关机时，如何关闭数据库引擎？


    找到执行系统关机的 `/etc/rc*` 脚本并在其中添加项。如果找不到此类项，请将必要的命令添加到 `shutdown` 脚本中（脚本路径在不同的 UNIX
    发行版中不同），它是 `shutdown` 命令的旧路径名。


