  trans: '


    一些其他有趣的属性记录在进程的系统数据段中。


    进程打开的每个文件（普通文件、特殊文件、套接字或命名管道）都有一个打开的文件描述符（一个从 0 到 1000 左右的整数），而进程创建的每个未命名管道则有两个描述符。子进程不会继承其父进程打开的文件描述符，而是继承它们的副本。尽管如此，它们是指向同一个系统全局打开文件表的索引，这在其他许多方面也意味着父进程和子进程共享同一个文件偏移量（即下一次读取或写入发生的字节位置）。


    进程的优先级由内核调度器使用。任何进程都可以通过系统调用 `nice` 降低其优先级；超级用户进程可以通过相同的系统调用提高其优先级。从技术上说，`nice`
    设置了一个名为 `nice value`（nice 值）的属性，这只是计算实际优先级的众多因素之一。


    进程的文件大小限制可以（且通常小于）系统全局限制；这是为了防止混乱或不文明的用户写入失控的文件。超级用户进程可以提高其限制。


    ## 1.52. 进程间通信


    在最古老的 UNIX 系统（1980 年以前）中，进程可以通过共享文件偏移量、信号、进程跟踪、文件和管道进行相互通信。随后增加了命名管道（FIFOs），接着是信号量、文件锁、消息、共享内存和网络套接字。这十一种机制中没有哪一种是完全满意的。这就是为什么有十一种的原因！数量甚至更多，因为信号量、消息和共享内存每个都有两个版本。有一组来自
    AT&T System V UNIX 的非常古老的集合，被称为“System V IPC”，另一个要新得多，来自 20 世纪 90 年代初成立的一个实时标准小组，被称为“POSIX
    IPC”。几乎每一个版本的 UNIX（包括 FreeBSD 和 Linux）都拥有这套最古老的十一种机制，而主要的商业 UNIX 版本（例如 Sun 的 Solaris
    或 HP 的 HP/UX）则拥有全部十四种机制。


    共享文件偏移量很少用于进程间通信。从理论上讲，一个进程可以将文件偏移量定位到文件中的某个虚构位置，然后第二个进程就可以发现它指向何处。该位置（例如 0 到
    100 之间的一个数字）就是通信的数据。由于进程之间必须存在相关关系才能共享文件偏移量，它们还不如直接使用管道。


    当进程只需“提醒一下”另一个进程时，有时会使用信号。例如，打印缓存程序每当打印文件被缓存时，就可以向实际打印进程发送信号。但信号传递的信息不足，在大多数应用中没有帮助。此外，信号会中断接收进程，使得编程变得比接收者在准备就绪时获取通信更加复杂。信号主要用于终止进程或指示非常异常的事件。


    通过进程跟踪，父进程可以控制子进程的执行。由于父进程可以读写子进程的数据，两者可以自由地通信。进程跟踪仅供调试器使用，因为它对于通用用途来说太复杂且不安全了。


    文件是进程间通信最常见的形式。例如，人们可以用一个运行 `vi` 的进程写一个文件，然后用一个运行 `python` 的进程执行它。然而，如果两个进程并发运行，文件是不方便的，原因有两个：首先，读取者的速度可能快于写入者，导致看到文件结束符，并认为通信已结束（这可以通过一些巧妙的编程来处理）。）。其次，两个进程通信的时间越长，文件就越大。有时进程会通信几天或几周，传递数十亿字节的数据。这会迅速耗尽文件系统。


    使用空文件作为信号量也是一种传统的 UNIX 技术。这利用了 UNIX 创建文件方式的某些特性。


    最后，是通常被推荐的一种：管道解决了文件的同步问题。管道不是普通文件类型；尽管它有一个节点（i-node），但没有指向它的链接。读取和写入管道与读写文件有些相似，但存在一些显著的差异：如果读取者领先于写入者，读取者将阻塞（停止运行一段时间），直到有更多数据。如果写入者领先读取者太远，它将阻塞，直到读取者有机会赶上，这样内核就不会排队过多的数据。最后，一旦某个字节被读取，它就永远消失了，因此通过管道连接的长运行进程不会填满文件系统。


    管道对 shell 用户来说非常熟悉，他们可以输入这样的命令行：


    ```

    ls | wc

    ```


    然而，内核功能比 shell 提供的要通用得多。


    但是，管道有三个主要缺点：


    1. 首先，通过管道通信的进程必须是相关的，通常是父进程子进程或两个兄弟进程。对于许多应用来说，这种限制太严格了，例如当一个进程是数据库管理器而另一个是需要访问数据库的应用程序时。

    2. 第二个缺点是，超过本地设置的最大值（例如 4096 字节）的写入不能保证是原子的，这阻止了在有多个写入者的情况下使用管道——它们可能会交织在一起。

    3. 第三个缺点是管道可能太慢。数据必须从写入的用户进程拷贝到内核，然后再传给读取者。没有执行实际的磁盘 I/O，但仅拷贝操作对于某些关键应用来说可能花费太长时间。正是因为这些缺点，才演化出了更复杂的方案。


    命名管道（也称为 FIFOs）被引入以解决管道的第一个缺点。FIFO 代表“先进先出”。命名管道以特殊文件的形式存在，任何具有权限的进程都可以对其打开读或写。命名管道很容易编程。命名管道有什么问题？它们没有消除管道的第二个和第三个缺点：大写入可能会发生交织，而且它们有时太慢。对于最关键的应用，可以使用较新的进程间通信功能（例如消息或共享内存），但远没有现在这么简单。


    命名管道是一种用于在无关进程之间传输数据的特殊文件。一个或多个进程对其写入，而另一个进程从其读取。命名管道在文件系统中可见，可以使用 `ls` 查看，像其他文件一样。命名管道可以在无关进程之间传递数据，而普通的（未命名）管道只能连接父子进程（除非你非常努力）。命名管道是严格单向的，即使在匿名管道是双向的系统中也是如此。


    信号量是一种防止两个或多个进程同时访问资源的计数器。文件也可以用于信号量，但对许多应用来说开销太大了。UNIX 有两种完全不同的信号量机制，一个是 System
    V IPC 的部分，另一个是 POSIX IPC 的部分。


    文件锁实际上是特殊的信号量，防止两个或多个进程访问文件的同一部分。它通常只在进程进行检查时有效；这种较弱的形式被称为建议锁。更强的形式是强制锁，无论进程是否检查都有效，但它是非标准的且仅在某些
    UNIX 系统可用。


    消息是可以发送到消息队列的小量数据（例如 500 字节）。可以是不同类型。任何具有相应权限的进程都可以从队列接收消息。它有很多选择：第一条消息、特定类型的第一条消息，或者一组类型的第一条消息。与信号量一样，有
    System V IPC 消息系统调用，以及完全不同的 POSIX IPC 系统调用。


