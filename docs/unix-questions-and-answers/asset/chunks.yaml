    进程间通信 (IPC) 用于在 `fork` 之后父子进程之间传递信息。在 `fork` 之前从父进程向子进程传递信息很容易，因为子进程启动时拥有父进程数据空间的拷贝以及父进程所有描述符的拷贝。但将信息从子进程返回给父进程需要更多工作。


    线程有助于解决这两个问题。线程有时被称为轻量级进程，因为线程比进程“轻量”。这意味着，创建线程的速度可以比创建进程快 10 到 100 倍。


    进程内的所有线程共享同一个全局内存。这使得线程之间的信息共享变得简单，但这种简单性也带来了同步问题。此外，共享的不仅仅是全局变量。进程内的所有线程共享：


    - 进程指令，

    - 大部分数据，

    - 打开的文件（例如描述符），

    - 信号处理程序和信号 set，

    - 当前工作目录，以及

    - 用户 ID 和组 ID。


    但每个线程都有自己的：


    - 线程 ID，

    - 寄存器组（包括程序计数器和栈指针），

    - 栈（用于局部变量和返回地址），

    - `errno`，

    - 信号掩码，以及

    - 优先级。


    ## 1.17. 什么是守护进程 (daemon)？


    它是一个监听其他程序请求的后台进程。读音为 DEE-mun 或 DAY-mun。在后台运行并在预定义时间或响应特定事件执行指定操作的操作。daemon 是一个
    UNIX 术语，尽管许多其他操作系统也提供对守护进程的支持，但它们有时被称为其他名称。例如，Windows 将守护进程称为系统代理 (System Agents)
    和服务 (services)。


    典型的守护进程包括打印机溢打印程序、电子邮件处理器以及其他为操作系统执行管理任务的程序。该词源于希腊神话，在神话中 daemon 是守护灵。


    守护进程是运行时间很长的进程。它们通常在系统启动时启动，仅在系统关闭时才终止。它们在后台运行，因为它们没有控制终端。UNIX 系统拥有许多执行日常活动的守护进程。例如，`ps`、`NFS
    Server daemon`。


    编写守护进程需要遵循一些基本规则，以防止发生意外的交互：


    - 第一要不要的是调用 `fork` 并让父进程退出。这起到了几点作用：首先，如果守护进程是作为简单的 shell 命令启动的，让父进程终止会让 shell
    认为命令已完成。其次，子进程继承了父进程的进程组 ID 但获得一个新的进程 ID，因此我们保证子进程不是进程组组长。这是下一步调用 `setsid` 的前提条件。


    - 调用 `setsid` 创建一个新的会话。这会发生三个步骤：进程 (1) 成为新会话的会话领，2) 成为新进程组的组长，3) 没有控制终端。


    - 将当前工作目录更改到根目录。从父进程继承的当前工作目录可能位于挂载的文件系统上。由于守护进程通常一直持续到系统重启，如果守护进程留在挂载的文件系统上，则该文件系统将无法被卸载。或者，某些守护进程可能会将工作目录更改到某个特定位置，并在那里执行所有工作。例如，行打印机溢写守护进程经常切换到它们的溢写目录。


    - 将文件模式创建掩码设置为 `0`。继承的文件模式创建掩码可能被设置为拒绝某些权限。如果守护进程将要创建文件，它可能想要设置特定的权限。例如，如果它专门创建了启用了组读和组写权限的文件，那么关闭其中任何一种权限的文件模式创建掩码将抵消它的努力。


    - 应该关闭不需要的文件描述符。这防止守护进程持有它可能从父进程继承的任何打开的描述符（这些可能是 shell 或其他进程）。然而，具体要关闭哪些描述符取决于守护进程。


    ## 1.18. 什么是 cron 任务 (cron job)？


    一种 UNIX 命令，用于调度在未来某时刻执行的任务。`cron` 通常用于调度周期性执行的任务——例如，每天早晨发送一条通知。它也是一个守护进程，意味着它持续运行，等待特定事件发生。


    `cron` 是一个 UNIX 实用，允许通过 `cron` 守护进程按固定间隔在后台自动运行任务。这些任务通常被称为 cron 任务。`crontab`
    (CRON TABle) 是一个文件，包含了要在指定时间运行的 cron 条目调度表。


    如果你的名字出现在 `/usr/lib/cron/cron.allow` 文件中，你就可以执行 `crontab`。如果该文件不存在，只要你的名字没有出现在
    `/usr/lib/cron/cron.deny` 文件中，你就可以使用 `crontab`。如果只存在 `cron.deny` 且为空，所有用户都可以使用
    `crontab`。如果两个文件都不存在，只有 root 用户可以使用 `crontab`。允许/拒绝文件每行一个用户名。


    ## 1.19. 什么是套接字 (socket)？


    `socket` 是 IP 地址和端口号组合的网络端点。socket 一词被用作比喻，因为 socket 中包含的信息可以直接插入互联网上目标计算机上请求请求的进程中。可以创建一个
    `socket` 来标识运行在互联网任何地方的应用程序。


    ## 1.20. 创建文件链接而不是文件副本的主要优势是什么？


    主要的优势并不实际上是节省磁盘空间（尽管它确实起到了作用），而是对文件权限的更改应用到所有链接点上。链接会显示权限为 `lrwxrwx`，但那是针对链接本身的，而不是它所指向的文件。因此，如果你想更改如
    `su` 等命令的权限，只需要在原始文件上操作即可。对于副本，你必须找到所有的副本并更改每份副本的权限。


    ## 1.21. 描述硬链接 (hard link)。


    一种为你的文件提供便捷访问的极佳方法是从你的目录创建硬链接。在创建硬链接时，你所做的只是从一个现有文件创建一个链接，这在某种程度上将现有文件放在了另一个目录中。链接并没有创建文件的副本；相反，你为磁盘上的物理文件创建了第二个指针。额外的指针并不是次要（类似于
    Windows 中的别名或快捷方式），两个指针都引用同一个实际文件，因此从 UNIX 系统的角度来看，文件实际上位于两个位置。


    由于使用硬链接通常需要访问另一个用户的主目录，你可能需要使用 `chmod`、`chgrp` 和 `chown` 来访问其他用户的目录和文件。你可以像删除普通文件一样删除硬链接，使用
    `rm` 加上文件名。如果一个用户删除了文件，另一个用户仍然可以从其目录访问该文件。硬链接适用于同一个文件系统内的文件之间。要链接目录或跨文件系统链接，你必须使用软链接。


    ```

    ln

    ```


    ## 1.22. 描述软链接 (soft link)。


    '
- fmt: '

    Soft links essentially provide other users with a shortcut to the directory you
    specify. Like hard links, soft links allow a file to be in more than one place
    at a time; however, with soft links, there is only one copy of it and, with soft
    links, you can link directories as well. The linked file or directory is dependent
    on the original one - that is, if the original file or directory is deleted, the
    linked file or directory will no longer be available. Soft links are particularly
    handy because they work for directories as well as individual files, and they
    work across different file systems, that is, not just within `/home`, but anywhere
    on the UNIX system. Like hard links, soft links sometimes require that you have
    access to another user’s directory and files.


    ```bash

    ln -s

    ```


    ## 1.23. What is the difference between a symbolic link and a hard link?


    A name/i-node pair is called a link.


    A hard link is a link made at inode level that is at a filesystem level. You can
    only hard link files of the same filesystem.


    A symbolic link is just another file whose content is just the path to the “original”
    file. It can be on another filesystem (and on another computer if it is imported
    via NFS). If the source file is removed, the link is broken.


    A symbolic link is a pointer to a directory entry while a hard link is more like
    a virtual duplication of a file.


    When you attempt to access a symbolic link with a text editor or other program,
    the kernel redirects the program to the file indicated by the symbolic link’s
    pathname.


    Hard link shares the same inode as the file it points to, thus provide different
    filenames for the same physical file. Hard link can’t point to a directory or
    across different file systems.


    ## 1.24. Write a command to find all of the files which have been accessed within
    the last 30 days.


    ```bash

    find / -type f -atime -30 > december.files &

    ```


    This command will find all the files under root, which is `//`, with file type
    is file. `-atime -30` will give all the files accessed less than 30 days ago.
    And the output will put into a file call `december.files`. This command is run
    in the background due to `&`.


    ## 1.25. What is the most graceful way to get to run level single user mode?


    The most graceful way is to use the command `init s`. If you want to shut everything
    down before going to single user mode then do `init 0` first and from the ok prompt
    do a `boot -s`.


    ## 1.26. What does the following command line produce? Explain each aspect of
    this line. $ (date ; ps -ef | awk {print $1}’ | sort | uniq | wc -l ) >> Activity.log


    First let’s dissect the line: The `date` gives the date and time as the first
    command of the line, this is followed by the a list of all running processes in
    long form with UIDs listed first, this is the `ps -ef`. These are fed into the
    `awk` which filters out all but the UIDs; these UIDs are piped into `sort` for
    no discernible reason and then onto `uniq` (now we see the reason for the sort
    - `uniq` only works on sorted data - if the list is A, B, A, then A, B, A will
    be the output of `uniq`, but if it’s A, A, B then A, B is the output) which produces
    only one copy of each UID. These UIDs are fed into `wc -l` which counts the lines
    - in the case the number of distinct UIDs running processes on the system. Finally
    the results of these two commands, the `date` and the `wc -l`, are appended to
    `Activity.log`.


    ## 1.27. In UNIX, what is the file server?


    The file server is a machine that shares its disk with other.


    ## 1.28. What is NFS? What is its job?


    NFS stands for Network File System. It enables files residing on one computer
    to be used by others.


    ## 1.29. What is CVS? List some useful commands.


    CVS is Concurrent Version System. It is the front end to revision control. are
    used often:


    ```bash

    cvs checkout

    cvs update

    cvs add

    cvs remove

    cvs commit

    ```


    ## 1.30. What do these permissions on a file mean?


    `rwxr-xr-x` owner, group, other.


    ## 1.31. What is a tar file?


    tar stands for Tape Archive. It was originally designed for tape backups, but
    it is used to create a “tarball” out of several files. A tar file is not compressed,
    it is just a heap of files assembled together on the filesystem. Here are some
    examples:


    ```bash

    tar -xvf example.tar - Extract the contents of example.tar

    tar -cf backup.tar /home/pub - Create a tar file named backup.tar

    tar -tvf example.tar - List contents of example.tar

    ```


    ## 1.32. Describe gzip.


    gzip is the original ZIP format. It is common to “tar” files and then compress
    them afterwards using gzip. These files are normally given the extensions .tar.gz
    to show that they tar archives zipped up with gzip. You may also see the extension
    .tgz. An archive that is compressed with gzip is compatible with WinZip and PkZip.
    So, a file zipped up on a UNIX box can be unzipped with a Windows box. To compress
    a file using gzip, execute the following command:


    ```bash

    gzip filename.tar

    ```

    (where `filename.tar` is the name of the file you wish to compress) The result
    of this operation is a file called `filename.tar.gz`. By default, gzip will delete
    the `filename.tar` file.


    To decompress a file using gzip, execute the following command:


    ```bash

    gzip -d filename.tar.gz

    ```

    The result of this operation is a file called `filename.tar`. By default, gzip
    will delete the `filename.tar.gz` file. You can also decompress the file using
    the command:


    ```bash

    gunzip filename.tar.gz

    ```

    This is the same as using the `gzip -d` command. There are many options that you
    can use with gzip. Do a man on the utility to learn more.

    '
