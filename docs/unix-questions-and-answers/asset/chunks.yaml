    During fsck (filesystem check) command, any files that are unreferenced but valid
    are placed in this special directory called lost+found. Depending upon the filesystem
    implementation, the fsck command does not create or extend this directory; therefore,
    it has to contain a sufficient number of empty slots for fsck to use when reconnecting
    files.


