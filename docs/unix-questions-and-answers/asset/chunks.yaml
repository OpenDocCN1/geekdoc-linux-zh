    \n最棒的是：网络进程间通信，它使用了一组被称为 `sockets` 的系统调用。（该组中的其他系统调用名称如 `bind`、`connect` 和 `accept`。）与我们讨论过的所有其他机制不同，你通过\
    \ socket 通信的进程并不一定运行在同一台机器上。它可能在另一台机器上，也可以在局域网或互联网的任何地方。那台机器甚至不需要运行 UNIX。它可以运行\
    \ Windows 或任何系统。就此而言，它也可以是一个网络打印机或收音机。\n\n## 1.53. UNIX 的不同版本有哪些？\n\n肯·汤普（Ken\
    \ Thompson）和丹尼斯·里奇（Dennis Ritchie）于 1969 年在 AT&T 贝尔实验室作为研究项目开始了 UNIX，不久后它开始在 AT&T\
    \ 内部被广泛使用（例如，用于电话维修呼中心的自动化）。当时的 AT&T 并不从事商业计算机的生产或商业软件的制定，但到 20 世纪 70 年代初，它开始向大学提供教育目的的\
    \ UNIX，前提是源代码仅向拥有自己许可的其他大学公开。到 20 世纪 70 年代后期，AT&T 也开始向商业供应商授权源代码。\n\n许多（如果不是绝大多数的话）被授权者都对\
    \ UNIX 进行了自己的修改，将其移植到新硬件上，添加设备驱动程序，或仅仅进行调。也许最重要的两个变化发生在加利州大学伯克利分校：网络系统调用（`sockets`）和对虚拟内存的支持。结果，全世界的大学和实验室都使用了伯克利系统（称为\
    \ `BSD`，即 `Berkeley Software Distribution`），尽管他们仍然是从 AT&T 获取许可的。一些商业供应商，特别是太阳公司（Sun\
    \ Microsystems），也是从 BSD UNIX 开始的。太阳公司的创始人比尔·乔（Bill Joy）是 BSD 的主要开发者。\n\n## 1.54.\
    \ 如何列出文件系统中所有的文件和子目录？\n\n```bash\nls -lR\n```\n\n列出所有文件及其大小。\n\n## 1.55. 写一个命令列出当前目录树中所有以\
    \ .c 结尾命名的文件。\n\n```bash\nfind . -name “*.c” -print\n```\n\n## 1.56. 描述 C 编译过程。\n\
    \nC 编译器 `cc` 将 C 源程序翻译成对象模块或可执行模块。可执行模块已准备好加载并执行。编译过程分阶段进行。在第一阶段，预处理器展开宏并包含头文件。然后编译器对代码进行多次扫描，首先将代码翻译成目标机器的汇编语言，然后翻译成机器码。结果是一个由机器码和未解析引用表组成的对象模块。编译的最后阶段将一组对象模块链接在一起，形成所有引用都已解析的可执行模块。可执行文件恰恰包含一个\
    \ main 函数。\n\n以下命令编译 `mine.c` 并产生一个可执行文件 `mine`。\n\n```bash\ncc -o mine mine.c\n\
    ```\n\n如果省略 `-o mine` 选项，C 编译器将产生一个名为 `a.out`的可执行文件。使用 `-o` 选项可以避免使用无意义的默认名称。\n\
    \n以下 `mine.c` 源文件包含对 `serr` 函数的未定义引用。\n\n```c\nvoid serr(char *msg);\n\nvoid main(int\
    \ argc, char *argv[ ])\n{\n  serr(\"This program does not do much.\\n\");\n}\n\
    ```\n\n当编译 `mine.c` 时，C 编译器会显示消息指示 `serr` 是一个未解析引用且不产生可执行文件。\n\n大多数程序并不包含在一个源文件中，需要将多个文件的源码链接在一起。所有要编译的源文件可以在单个\
    \ `cc` 命令中指定。或者，用户可以将源代码编译成单独的对象模块，并在单独的步骤中将这些对象模块链接形成可执行模块。\n\n假设 `serr` 函数包含在源文件\
    \ `minelib.c` 中。以下命令编译 `mine.c` 源文件 `minelib.c`，产生一个名为 `mine`的可执行模块。\n\n```bash\n\
    cc -o mine mine.c minelib.c\n```\n\n`cc` 的 `-c` 选项导致 C 编译器产生对象模块而不是可执行文件。在对象模块链接到库和其他模块以解析引用之前，无法将其加载到内存或执行。拼写错误的变量或缺失的库函数可能直到该对象链接到可执行文件时才被发现。\n\
    \n以下命令产生对象模块 `mine.o`。\n\n```bash\ncc -c mine.c\n```\n\n当使用 `-c` 选项时，C 编译器产生以\
    \ `.o` 扩展命名的对象模块。`cc` 命令产生的 `mine.o` 以后与另一个对象文件（例如 `minelib.o`）链接产生可执行文件。\n\n\
    以下链接对象模块 `mine.o` 和 `minelib.o` 以产生可执行文件 `mine`。\n\n```bash\ncc -o mine mine.o\
    \ minelib.o\n```\n\n## 1.57. 描述 make 过程。\n\n`make` 工具允许用户增量地编译一组程序模块。即使对于简单的编译，`make`\
    \ 也很方便并有助于避免错误。\n\n为了使用 `make`，用户必须在描述文件中指定模块之间的依赖关系。默认的文件名为 `makefile` 或 `Makefile`。当用户输入\
    \ `make` 时，`make` 工具会在当前目录查找 `makefile` 并检查该文件以查看是否需要更新。\n\n描述文件描述模块之间的依赖关系。以\
    \ `#` 开头的行是注释。描述文件中的依赖形式如下：\n\n`目标:组件`\n`TAB 规则`\n\n第一行是依赖，第二行是规则。描述文件中的规则行第一个字符必须是\
    \ TAB。在 `cc -o mine mine.o minelib.o` 中，依赖可以跟随一个或多个规则行。\n\n```makefile\nmine:\
    \ mine.o minelib.o\ncc -o mine mine.o minelib.o\n```\n\n`mine` 依赖于 `mine.o` 和\
    \ `minelib.o`。如果这两个文件中的任何自 `mine` 最后一次修改后被修改，则通过执行 `cc -o mine mine.o minelib.o`\
    \ 来更新 `mine`。\n\n"
