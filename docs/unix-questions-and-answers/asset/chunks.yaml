    ## 1.154. Describe the steps the system goes through, at boot time, before the
    users may sign on.


    When a UNIX system is turned on, regardless of the architecture, a bootstrap program
    allows the administrator to boot the default UNIX kernel or specify the name of
    an old kernel if an older version is desired. The system will display information,
    among which the hardware recognition (when you can see if your parallel port is
    recognized) is the most important. Next, it verifies if the root filesystem needs
    checking (is “dirty” or was cleanly unmounted at shutdown). If the root filesystem
    needs checking, you will be prompted to allow the checking and repair (fsck utility)
    of the root filesystem. When the cleaning is complete, various scripts continue
    bringing up UNIX into either single or multiuser mode depending upon the configuration
    and options passed to the boot manager. Single-user mode is chosen mostly when
    system maintenance is needed. Once multiuser mode is chosen (or if it is the default
    boot level), a prompt is presented to enter the system time or take the default.
    The system then executes commands found in the /etc/rc* directories, generating
    startup messages for the various system services, such as the printer or network
    services. Finally, the system displays the login prompt.


    ## 1.155. When, and depending on what, are the other filesystems checked and mounted?


    The other filesystems are mounted after the root filesystem mount is complete.
    They are checked and mounted depending on the entries found by the system in a
    mount table file at boot time (the name, location, and structure of this table
    vary between the UNIX vendors).


    ## 1.156. Name two ways to bring the system down.


    The most commonly used, and the recommended way, is shutdown. This will warn the
    user that the system is coming down and unless otherwise specified, will have
    a one-minute grace period (may be different from one implementation to another).
    Simply turning the power off will not properly unmount the filesystem; instead,
    it could possibly force a lengthy check upon boot.


    The second way is the haltsys (or halt for BSD) command. This com­mand halts the
    system immediately. It should not be used unless in single-user mode. The users
    are logged out (their work will be lost) and network servers and other programs
    are terminated abnormally. It is also a defined behavior that the system can be
    brought down by killing the init process with the default SIGINT signal, although
    this is rarely done in practice.


    ## 1.157. What are the files checked or scripts executed when a user logs in?


    The order is: /etc/passwd, /etc/profile, $HOME/.profile, and in case the Korn
    shell is used, $HOME /. kshrc. If the C shell is used, .profile is replaced by
    .login and .kshrc by .cshrc (although the C shell and its derivatives are rapidly
    losing popularity).


    ## 1.158. When an account, for various reasons, is not used anymore, how can the
    system administrator disable it?


    This can be accomplished in several ways. Assuming normal UNIX authentication,
    the administrator can change the password with the passwd command, alternately
    edit the /etc/passwd file and replace the second field of the users password entry
    with an asterix (*), or remove the entry from /etc/passwd entirely. If this is
    done, the entries should be removed from /etc/group and /etc/shadow as well, the
    home directory and mail spool of the user should be removed, and all files owned
    by the user should be deleted or assigned to other users. The administrator should
    run the find utility to ensure that no files remain on the system that are owned
    by the user. If something other than standard UNIX authentication is in use, such
    as NIS, DCE, Hesiod Bind, or a PAM-based authentication mechanism, this process
    will be different.


    ## 1.159. How can a user ensure that certain sensitive files cannot be read by
    others?'
