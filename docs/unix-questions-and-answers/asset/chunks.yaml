    it. In a similar vein, in case your upgrade program depends on shared libraries
    and may freak out if you replace a shared library out from under it, you can use
    LD_LIBRARY_PATH to point to a directory with copy of a shared libraries and then
    you can replace the system copy without worry. You can even undo things should
    things fail by moving the copy back.


    X11 uses LD_LIBRARY_PATH during its build process. X11 distributes its fonts in
    “bdf” format, and during the build process it needs to “compile” the bdf files
    into “pcf” files. LD_LIBRARY_PATH is used to point to the build lib directory
    so it can run bdftopcf during the build stage before the shared libraries are
    installed.


    Perl can be installed with most of its core code as a shared library. This is
    handy if you embed Perl in other programs - you can compile them so they use the
    shared library and so you’ll save memory at run time. However Perl uses Perl scripts
    at various points in the build and install process. The ‘perl’ binary won’t run
    until its shared libraries are installed, unless LD_LIBRARY_PATH is used to bootstrap
    the process.


