    All variables and their associated values that are known to a command at the beginning
    of its execution make up its environment. This environment includes variables
    that the command inherits from its parent process and variables specified as keyword
    parameters on the command line that invoke the command. The variables that a shell
    passes to its child processes are those that have been named as arguments to the
    `export` command (or the `setenv` command for the C shell).


    ### 1.205. How can you initialize new variables in a shell script and use them
    later in the sign-on shell?


    In the Bourne shell family, use the dot `.` command, which causes the shell to
    read commands from the script without spawning a new sub-shell. In the C shell,
    the `source` command is used instead. Changes made to variables in the script
    are in effect after the `.` command finishes. The command would look like this:
    `.procedure` (Bourne shell) or `source procedure` (C shell).


    ### 1.206. How can you solve the following situation: You want the users, once
    signed on, to be put in the application program; once they quit the application,
    you want them signed off the system?


    A very efficient way is to put in their `.profile` or `.login` script, as the
    last command, the `exec` command, with the name of the application as an argument.
    In this way, once the users quit the application, they are signed off the system.


    Another way is to set the application program as the login shell in `/etc/passwd`.


    ### 1.207. How can you make sure that the work file created during the execution
    of a script will be removed even if the script was interrupted?


    Within a shell script, you can still take action (in this case remove files) when
    an interrupt signal is received by using the `trap` command. An example of a `trap`
    command is:


    ```

    trap ‘rm -f tempfile; exit’ 0 2 3 15

    ```


    ### 1.208. Assuming you have to run backups during the night, and there is no
    night operator and the backup utility prompts you for answers before it starts,
    how would you solve this problem?


    Create a shell script and put it in the `crontabs` directory, to be run by the
    `cron` process. The script would use a “here” document: it would have the interactive
    command (command which requires answers) followed by `<< eoi`, where `eoi` is
    an arbitrary string, signaling the end of input. If the command uses the curses
    library, a more complicated solution would be required, possibly involving the
    `expect` utility. An example is:


    ```

    command <<- eoi

    ```


    ### 1.209. How can you write the standard output and the standard error for a
    command to the same file?


    You can do this by using the file descriptors. A file descriptor is a handle to
    an open file. The C programming language defines default file pointers `STDIN`,
    `STDOUT`, and `STDERR` (standard input, output, and error). Pipelines and simple
    redirection alter `STDIN` and `STDOUT`, but `STDERR` can be explicitly directed
    in the Bourne family with the `2>` notation (this feature is not available in
    the C shell, which is one of its great failings). If necessary, `STDOUT` can be
    explicitly referred to as `1>` if desired. Furthermore, `STDOUT` and `STDERR`
    can be merged into the same file with the `2>&1` notation. An example command
    looks like this:


    ```

    command 1>file name 2>&1

    ```


    ### 1.210. In a command list, how can you arrange the commands, so if one of them
    fails, the execution of the list stops?


    The list would look something like this:


    ```

    commandl && command2 && command3 &&...&& commandn

    ```


    ### 1.211. In a command list, how can you arrange the commands so that, the second
    one is executed only if the first one fails?


    The list would look something like this:


    ```

    commandl || command2

    ```


    The first command is executed, its exit status is examined and only if it has
    a nonzero value, the second command is executed.


    ### 1.212. What can you do to fix the problem if one of your filesystems runs
    out of inodes?


    You can back up the filesystem, unmount the filesystem, rerun `mkfs` and specify
    more inodes for the filesystem, mount the filesystem, and restore the backups.


    ### 1.213. How can you check the amount of free space on filesystems?


    You can use the `df` command. `df` command reports filesystem disk space usage.
    On some systems, this utility reports sizes in 512 byte blocks.


    ### 1.214. What does it mean if a user has write permissions on a directory but
    is unable to remove files from that directory?


    It means that the sticky bit has been set for that directory. The sticky bit is
    a directory protection setting that allows only the owner of the file (or superuser)
    remove files from that directory.


    ### 1.215. What command can be used to compare two text files?


    The `diff` command can be used to find out what lines must be changed in two files
    to bring them into agreement. This is especially useful for finding the differences
    between two versions of the same source program. The `diff3` command is useful
    for comparing three separate files and merging the changes between them.


    ### 1.216. How can you convert a text file from UNIX format to MS-DOS format?


    DOS text files differ from UNIX text files in that they contain a carriage return
    (`\r`) in addition to a line feed (`\n `) at the end of each line. While most
    UNIX vendors include proprietary utilities for accomplishing these conversions,
    modern versions of the UNIX `awk` utility can strip the carriage return if called
    with the following syntax:


    ```

    awk ‘{sub(/\r/,”“); print;}’ dos.txt > UNIX.txt

    ```


    ### 1.217. What is umask?


    `umask` is a three-digit octal number used by the system to establish the permissions
    for newly created file. The system subtracts this number from 777, and the results
    are the permissions for new file. Plain files will never be created with the execute
    bit (using an implicit mask), but directories allow the execute bit (directory
    scan) to pass through.


    ### 1.218. How can you find out what variables are currently assigned?


    By typing the command `env`, with no arguments, you can get a list of the variables
    currently assigned. The list can be lengthy, so it might be wise to pipe the output
    of `env` to `greater`.


    ### 1.219. What command can you use to archive a raw device?


    You can use the `dd` command, which allows you to specify the input and output
    block size, among other options.


    ### 1.220. What are device drivers?


    Device drivers are software routines, part of the kernel, which interface with
    the hardware. UNIX represents most devices as block- or character-special files
    located in the `/dev` directory. Each has a major and minor device number.


    ### 1.221. What are UNIX daemons?


    The UNIX daemons are a collection of processes that each perform a particular
    system task. Two examples are `init` and `crond` daemons.


    ### 1.222. Assuming you want to start the database engine every time you boot
    the system, how would you do it?


    Add the necessary commands in `/etc/rc*` (scripts executed when the system is
    booting).


    ### 1.223. When the system is coming down, how would you bring down the database
    engine?


    Locate the `/etc/rc*` scripts that perform system shutdown and add the entry there.
    If such entries cannot be found, add the necessary commands in the `shutdown`
    script (the path to the script varies among UNIX distributions), which is an old
    pathname for the `shutdown` command.


    ### 1.224. What can you do if a scrambled terminal responds to keyboard input
    but the display is incorrect?


    First, check the `TERM` variable by entering `env` at the command line. If the
    terminal type is incorrect, reset it by entering at the command line `TERM=wy60;
    export TERM` (or `setenv TERM wy60` for csh), if the terminal is a Wyse6O. After
    resetting the terminal type, reinitialize the terminal by entering `tset` with
    no arguments.


    ### 1.225. What can you do if a terminal that responds to keyboard input does
    not display the characters entered at the keyboard?

