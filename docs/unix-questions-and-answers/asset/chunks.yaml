    - `rlogin server -l user` Connects to a different machine on your network specified
    by hostname.

    - `rsh`

    - `psexec.exe`

    - `uptime`

    - `pwd` - print working directory

    - `ps -f` Shows your currently running processes

    - `ps -ef` Shows every currently running processes

    - `sudo` The `sudo` facility allows specified users to run specific commands as
    root without having to know the root password. `sudo` requires only the user password
    to run the command, not the root password.

    - `RCMD`

    - `ipconfig` The `ipconfig` command displays system and network information.

    - `ipconfig` Displays the IP address

    - `ipconfig/all` Displays the hostname, domain name, and IP address.

    - `chmod`

    - `chgrp`

    - `chown`

