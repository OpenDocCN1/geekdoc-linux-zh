    - 网络的物理拓扑结构是什么？

    - 网络上是否有其他站点也遇到了此问题？


    最后一个问题是关键的，因为你可能会花费整一天的时间对一个工作站进行故障排除，而实际上问题出在网络的其他地方。


    假设问题已局限在工作站本身，就可以开始基础的故障排除。以下是候选人在执行故障排除过程中应该问的一些示例问题。


    物理电缆是否连接到网卡？网卡上是否有链路指示灯？电缆连接的端口（在交换机或集集器器上）是否有相应的链路指示灯？操作系统是否识别了网卡？（在 Linux 上，使用
    `lspci` 命令将列出所有连接到 PCI 总线上的设备。在 Solaris 上，使用命令 `prtconf -v`）。


    IP 配置设置是否正确？`ifconfig -a` 命令告诉了你什么？是否能看到任何二层流量（使用 `arp -a` 命令将显示二层地址解析协议表）？


    是否有任何正在运行的主机防火墙可能会阻止 ping 包？你正尝试 ping 的系统是否可用且没有拦截 ping？你能够 ping 网络上的其他主机吗？


    如你所见，这个问题有许多可能的解决方案。一个优秀的候选人会理解解决此类问题所需的系统化步骤，并以最逻辑顺序执行这些步骤。


    ## 1.153. 你的生产 UNIX 系统一直运行良好，但用户突然抱怨系统缓慢。你登录后感觉系统很“迟钝”，终端无法跟上你的输入。你会采取哪些步骤来诊断问题？


    第一步是确定是什么消耗了所有的系统资源。是否有进程了所有的 CPU？运行 `top` 命令查看是否有任何进程消耗 CPU 周期。同时使用 `uptime`
    检查平均负载，看看问题之前是否存在且只是刚刚消失了。


    如果没有明显的 CPU 负载，检查内存使用情况。同样，`top` 命令将显示当前使用的内存和交换空间。如果所有主内存都被占用，系统必须为每个新进程交换到磁盘，那么响应速度将大幅下降。


    最后要检查的是磁盘使用情况。`vmstat` 或 `sar -g` 命令将显示磁盘使用情况。高页出（page-out）值意味着系统由于内存不足正在进行交换。在没有分页的情况下高磁盘活动表明某些进程正在进行大量的磁盘读取或写入。


    这种情况引出了一个重要的点：如果你不知道系统运行正常时是什么样，就不可能知道系统在出现异常时是什么样子。建立系统基准对于性能故障排除至关重要。这可能仅仅是知道
    `ps -aef` 输出中应该出现哪些进程。一个优秀的系统管理员能够回答关于其系统的这些问题：


    - 运行进程的平均数量是多少？

    - 平均用户数是多少？

    - 平均 CPU 负载是多少？

    - 平均内存和交换空间的使用率是多少？

    - 平均磁盘使用率是多少？


    没有这些信息，诊断问题状况将变得非常困难。目前有很多良好的监控工具可以帮助跟踪这些信息。当然，从 `cron` 任务中运行的标准 UNIX 监控工具也可以提供这些信息。


    ## 1.154. 描述系统在启动时为了进入多用户模式所经历的步骤。


    当设备开启时，无论架构是哪种，系统都会执行在 `/etc/rc` 或 `/etc/rc*` 中找到的各种脚本。如果根文件系统需要检查，用户将被提示进入单用户模式。一旦检查完成，系统将根据传递给启动的选项进入单用户模式或多用户模式。如果选择了多用户模式，系统将执行
    `/etc/rc` 目录中的脚本以启动各种服务，例如打印机或网络服务。最后，系统显示登录提示符。


    ## 1.155. 何时以及根据什么对其他文件系统进行检查和挂载？


    其他文件系统在根文件系统挂载完成后挂载，取决于挂载表中找到条目。


    ## 1.156. 请列出关闭系统的两种方法。


    最常用且推荐的方法是 `shutdown`。这将警告用户系统即将关闭，除非另有说明，否则将有一分钟的宽限期（可能与具体实现有所不同）。直接关闭电源无法正确卸载文件系统；相反，这可能会在启动时强制进行长时间检查。


    另一种方法是 `haltsys`（BSD 中为 `halt`）命令。这会立即停止系统。除非在单用户模式下，否则不应使用。用户将被注销（其工作将丢失），网络服务器和其他程序将异常终止。通过
    `SIGINT` 信号杀死 `init` 进程来关闭系统也是一种定义行为，尽管在实践中很少这样做。


    ## 1.157. 用户登录时，会检查哪些文件或执行哪些脚本？


    顺序是 `/etc/passwd`、`/etc/profile`、`$HOME/.profile`，如果使用 Korn shell，还有 `$HOME/.kshrc`。如果使用
    C shell，则 `.profile` 被 `.login` 代，`.kshrc` 被 `.cshrc` 代。


    ## 1.158. 当账户由于各种原因不再使用时，系统管理员如何禁用它？


    这可以通过几种方式实现。假设使用标准的 UNIX 验证，管理员可以使用 `passwd` 命令更改密码，编辑 `/etc/passwd` 文件并将用户密码条目的第二个字段替换为星号
    (`*`)，或者完全从 `/etc/passwd` 中删除该条目。如果这样做，还应该从 `/etc/group` 和 `/etc/shadow` 中删除条目，删除用户的家目录和邮件池，并删除或将所有属于用户的文件分配给其他用户。管理员应该运行
    `find` 工具以确保系统中不再留属于该用户的文件。


    '
