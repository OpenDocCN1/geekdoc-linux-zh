    ## 1.149. You attempt to unmount a currently mounted disk and you receive the
    error “Unable to umount: device or resource busy”. What does this mean and what
    must you do before you can unmount the disk?


    This means that some process is currently accessing the file system you are trying
    to unmount, either through an open file handle or having a process with a current
    working directory in the file system. You first need to identify what processes
    are accessing the file system and who owns those processes. You then must decide
    how to deal with those processes.


    The ‘fuser’ command will display the processes that are accessing a given file
    system. After you have determined what the processes are and who owns them, you
    can either 1) wait until those processes complete before you attempt to unmount
    the disk, 2) contact the user(s) in question to determine the status of the processes,
    or 3) kill the processes and unmount the disk.


    ## 1.150. You need to run the fsck program against a file system, but you must
    do this while the file system is unmounted. Since the file system in question
    is the root file system, you cannot unmount it while the system is running. What
    options do you have for running fsck against this file system?


    There are two ways to get fsck to run against this file system when it is not
    mounted.


    Access the disk from a different root partition. This can be done be either removing
    the disk itself and mounting it under another UNIX system, or booting your system
    with a root or rescue disk. Either way, you have access to the fsck command without
    relying on your original disk being mounted. You can then fsck the drive and return
    the system to its previous state.


    Issue the command ‘shutdown -r -F now’. The ‘-F’ option to shutdown forces the
    system to run fsck against the drives defined in /etc/fstab (or /etc/vsftab) before
    they are mounted on the next reboot. The ‘-r’ options tells shutdown to reboot
    the computer immediately.


    ## 1.151. You have forgotten root’s password. What options do you have to get
    back into the system as root?


    This answer will be higher-level to cover most flavors of UNIX; individual implementations
    will vary depending upon the UNIX flavor.


    Root’s password is normally stored in encrypted form in either /etc/passwd or
    /etc/shadow. While it is impossible to recover what the password was, you can
    change the password, or reset it to a null value.


    The first step is to access the disk containing the root partition without booting
    to it. You can do this by either booting to a root rescue disk and then mounting
    the original root partition, or removing the drive itself and mounting it in another
    system. By accessing the root file system this way, you are bypassing any of the
    security on the file system itself.


    When you have access to the root partition, locate the encrypted password string
    for root in /etc/passwd or /etc/shadow. Erase the encrypted string. Save your
    changes and return the system to its normal configuration (if you moved the disk,
    return it to the original system. If you booted off of a different boot disk,
    remove it and boot off of your original disk).


    After rebooting, you should now be able to log in as root without giving a password.
    You can then reset root’s password with the ‘passwd’ command.


    ## 1.152. Your UNIX workstation is unable to ping any hosts on the local TCP/IP
    network. What steps do you take to troubleshoot this problem?


    This kind of question is a very revealing one. How a candidate answers this questions
    will determine their thought process, specifically how they approach a problem
    from a logical standpoint. Ideally, you want a candidate to display knowledge
    of what settings are necessary to enable communication on an IP network, but more
    importantly, you want them to follow the scientific method in diagnosing and resolving
    the problem.


    The following items need to be correct in order to communicate on a local TCP/IP
    network:


    · Some physical connection to the network, whether it be wired or wireless


    · An IP address that is part of the local subnet, but is unique to that subnet


    · A subnet mask that correctly reflects the configuration of the subnet


    · A correct gateway IP address


    · If name resolution is desired, a correct name server must be configured


    From a troubleshooting standpoint, it’s always best to start at the lowest level
    and work your way up. Before you can diagnose this problem, however, more information
    is required. Specifically, the candidate should ask these questions:


    · What is the IP configuration of this subnet?


    · What IP address, subnet mask, gateway and DNS address should be assigned to
    this workstation?'
