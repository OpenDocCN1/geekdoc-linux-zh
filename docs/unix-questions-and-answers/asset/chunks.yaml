    - Command substitution: Any command surrounded by backquotes is executed by the
    shell which then replaces the standard output of the command into the command
    line.

    - Wild-card interpretation: The shell finally scans the command line for wild-cards
    (the characters `*`, `?`, `[`, `]`). Any word containing a wild-card is replaced
    by a sorted list of filenames that match the pattern. The list of these filenames
    then forms the arguments to the command.

    - PATH evaluation: It finally looks for the `PATH` variable to determine the sequence
    of directories it has to search in order to hunt for the command.


    ## 1.259. What is difference between `cmp` and `diff` commands?


    - `cmp` - compares two files byte by byte and displays the first mismatch.

    - `diff` - tells the changes to be made to make the files identical.


    ## 1.260. What is the use of ‘grep’ command?


    `grep` is a pattern search command. It searches for the pattern, specified in
    the command line with appropriate option, in a file(s).


    Syntax: `grep`


    Example: `grep 99mx mcafile`


    ## 1.261. What is the difference between `cat` and `more` command?


    `cat` displays file contents. If the file is large the contents scroll off the
    screen before we view it. So command `more` is like a pager which displays the
    contents page by page.


    ## 1.262. Write a command to kill the last background job?


    ```bash

    kill $!

    ```


    ## 1.263. Which command is used to delete all files in the current directory and
    all its sub-directories?


    ```bash

    rm -r *

    ```


    ## 1.264. Write a command to display a file’s contents in various formats?


    ```bash

    od -cbd file_name

    ```


    `c` - character, `b` - binary (octal), `d` -decimal, `od`=Octal Dump.


    ## 1.265. What will the following command do?


    ```bash

    echo *

    ```


    It is similar to `ls` command and displays all the files in the current directory.


    ## 1.266. Is it possible to create a new file system in UNIX?


    Yes, `mkfs` is used to create a new file system.


    ## 1.267. Is it possible to restrict incoming message?


    Yes, using the `mesg` command.


    ## 1.268. What is the use of the command "ls -x chapter[1-5]"


    `ls` stands for list; so it displays the list of the files that starts with ''chapter''
    with suffix ''1'' to ''5'', `chapter1`, `chapter2`, and so on.


    ## 1.269. Is `du` a command? If so, what is its use?


    Yes, it stands for ‘disk usage’. With the help of this command you can find the
    disk capacity and free space of the disk.


    ## 1.270. Is it possible to count number of char, line in a file; if so, How?


    Yes, `wc` stands for word count.


    - `wc -c` for counting number of characters in a file.

    - `wc -l` for counting lines in a file.


    ## 1.271. Name the data structure used to maintain file identification?


    `inode`, each file has a separate `inode` and a unique inode number number.


    ## 1.272. How many prompts are available in a UNIX system?


    Two prompts, `PS1` (Primary Prompt), `PS2` (Secondary Prompt).


    ## 1.273. How does the kernel differentiate device files and ordinary files?


    Kernel checks `type` field in the file''s `inode` structure.


    ## 1.274. How to switch to a super user status to gain privileges?


    Use `su` command. The system asks for password and when valid entry is made the
    user gains super user (admin) privileges.


    ## 1.275. What are shell variables?


    Shell variables are special variables, a name-value pair created and maintained
    by the shell. Example: `PATH`, `HOME`, `MAIL` and `TERM`.


    ## 1.276. What is redirection?


    Directing the flow of data to the file or from the file for input or output. Example:
    `ls > wc`


    ## 1.277. How to terminate a process which is running and the specialty on command
    kill 0?


    With the help of `kill` command we can terminate the process.


    Syntax: `kill pid`


    `kill 0` - kills all processes in your system except the login shell.


    ## 1.278. What is a pipe and give an example?


    A pipe is two or more commands separated by pipe char `|`. That tells the shell
    to arrange for the output of the preceding command to be passed as input to the
    following command.


    Example: `ls -l | pr`


    The output for a command `ls` is the standard input of `pr`.


    When a sequence of commands is combined using pipe, then it is called pipeline.


    ## 1.279. Explain `kill()` and its possible return values.


    There are four possible results from this call:


    - `kill()` returns 0. This implies that a process exists with the given `PID`,
    and the system would allow you to send signals to it. It is system-dependent whether
    the process could be a zombie.

    - `kill()` returns -1, `errno == ESRCH` either no process exists with the given
    `PID`, or security enhancements are causing the system to deny its existence.
    (On some systems, the process could be a zombie.)

    - `kill()` returns -1, `errno == EPERM` the system would not allow you to kill
    the specified process. This means that either the process exists (again, it could
    be a zombie) or draconian security enhancements are present (e.g. your process
    is not allowed to send signals to *anybody*).

    - `kill()` returns -1, with some other value of `errno` you are in trouble! The
    most-used technique is to assume that success or failure with `EPERM` implies
    that the process exists, and any other error implies that it doesn''t.


    An alternative exists, if you are writing specifically for a system (or all those
    systems) that provide a `/proc` filesystem: checking for the existence of `/proc/PID`
    may work.


    ## 1.280. What is relative path and absolute path?


    Absolute path: Exact path from root directory.


    Relative path: Relative to the current path.

