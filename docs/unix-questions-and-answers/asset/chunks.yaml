    # 1. UNIX


    ## 1.1. Windows NT 是一个 32 位的操作系统（OS）。32 位操作系统意味着什么？


    32 位操作系统运行在至少 32 位的处理器上，并通常为程序提供一个平坦的 32 位虚拟地址空间。运行在 32 位操作系统上的程序通常会使用 32 位作为其基本字长。例如，一个整数将是一个
    32 位的值而不是 16 位的值。“32 位操作系统”这一术语也隐含了多种技术，例如抢占式多任务和进程隔离，这些技术在大多数 32 位操作系统中都是常见的，但并非所有
    32 位操作系统所固有的。


    ## 1.2. 描述程序、进程和线程。


    程序是存储在磁盘普通文件中的指令和数据集合。在文件的 `i-node` 中，该文件被标记为可执行，且文件内容根据内核建立的规则进行安排。这是内核关心的文件内容的另一个案例。


    程序员可以以他们选择的任何方式创建可执行文件。只要内容遵守规则且文件被标记为可执行，程序就可以运行。在实践中，通常过程是这样的：首先，用某种编程语言（例如
    `C` 或 `C++`）编写的源程序输入到普通文件中，通常称为文本文件，因为它是按文本行排列的。接下来，创建一个名为 `object file`（目标文件）的另一个普通文件，其中包含源程序的机器语言翻译。这项工作由编译器或汇编器（它们本身也是程序）完成。如果这个
    `object file` 是完整的（没有缺失子程序），它会被标记为可执行并可以直接运行。如果不完整，则使用 `linker`（在 UNIX 术语中有时称为“加载器”）将此
    `object file` 与之前创建的其他文件绑定，这些文件可能取自称为库的类文件集合。除非 `linker` 无法找到它正在寻找的内容，否则它的输出是完整且可执行的。


    为了运行程序，首先请求内核创建一个新进程，进程是程序执行的环境。进程由三个段组成：指令段、用户数据段和系统数据段。在 UNIX 术语中，指令段被称为“文本段（text
    segment）”。程序被用于初始化指令和用户数据。在初始化之后，进程开始偏离它正在运行的程序。虽然现代程序员通常不修改指令，但数据确实会被修改。此外，进程可能会获取程序中不存在的资源（更多内存、打开的文件等）。


    在进程运行时，内核会跟踪它的线程，每个线程都是通过指令的一条独立控制流，所有线程都可能读取和写入进程数据的相同部分。然而，每个线程都有自己的栈（stack）。当你编程时，你从一个线程开始，除非你执行特殊的系统调用来创建另一个，否则你只能得到一个线程。因此，初学者可以将进程认为是单线程的。并不是每个
    UNIX 版本都支持多线程。它们是一个被称为 `POSIX Threads` 或“pthreads”的可选功能的一部分。


    从同一个程序可以初始化多个并发运行的进程。然而，这些进程之间没有功能上的关系。内核可能通过安排此类进程共享指令段来节省内存，但涉及的进程无法检测到这种共享。相比之下，同一进程中的线程之间存在很强的功能关系。


    进程的系统数据包括属性如当前目录、打开的文件描述符、累积的 CPU 时间等。进程不能直接访问或修改其系统数据，因为它们在它的地址空间之外。相反，有各种系统调用来访问或修改属性。


    进程由内核代表正在执行的进程创建，该进程成为新子进程的父进程。子进程继承父进程的大多数系统数据属性。例如，如果父进程打开了文件，子进程也将打开这些文件。这种继承对于
    UNIX 的运行是至关重要的。这与线程创建新线程不同。同一进程中的线程在大多数方面上是平等的，没有继承关系。所有线程对所有数据和资源都有等的访问权限，而不是它们的副本。


    应用程序由一个或多个进程组成。简单来说，进程是一个正在执行的程序。一个或多个线程在进程上下文中运行。线程是操作系统分配处理器时间的基本单位。线程可以执行程序代码的任何部分，包括当前由另一个线程执行的部分。


    每个进程都提供运行程序所需的资源。进程具有虚拟地址空间、可执行代码、指向系统对象的打开句柄（handles）、安全上下文、唯一进程标识符、环境变量、基本优先级、最小和最大工作集大小以及至少执行线程。每个进程启动时带有一个线程（通常称为主线程），但可以从它的任何线程创建额外的线程。


    线程是进程中可以调度执行的实体。进程的所有线程共享其虚拟地址空间和系统资源。此外，每个线程维护异常处理程序、调度优先级、线程本地存储、唯一线程标识符以及系统用于保存线程上下文直到被调度的结构。线程上下文包括线程的机器寄存器、内核栈、线程环境块以及位于进程地址空间的用户栈。


    Microsoft Windows 支持抢占式多任务，这创造了多个进程的多个线程同时执行的效果。在多处理器计算机上，系统可以同时执行与计算机上处理器数量相当的线程。


    作业对象（job object）允许将进程组作为一个单元进行管理。作业对象是命名的、安全的、可共享的对象，控制与其关联的进程的属性。对作业对象执行的操作会影响与作业对象关联的所有进程。


    ## 1.3. 线程和进程之间的区别是什么？


