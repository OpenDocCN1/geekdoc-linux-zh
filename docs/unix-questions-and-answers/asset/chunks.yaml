  raw: 'The same physical device could have both block and character special files,
    and, in fact, this is usually true for disks. Regular files and directories are
    accessed by the file-system code in the kernel via a block special file, to gain
    the benefits of the buffer cache. Sometimes, primarily in high-performance applications,
    more direct access is needed. For instance, a database manager can bypass the
    file system entirely and use a character special file to access the disk (but
    not the same area that’s being used by the file system). Most UNIX systems have
    a character special file for this purpose that can directly transfer data between
    a process’s address space and the disk using direct memory access (DMA), which
    can result in orders-of-magnitude better performance. More robust error detection
    is another benefit, since the indirectness of the buffer cache tends to make error
    detection difficult to implement.


    A special file has an i-node, but there aren’t any data bytes on disk for the
    i-node to point to. Instead, that part of the i-node contains a device number. 
    This is an index into a table used by the kernel to find a collection of subroutines
    called a device driver.


    When a system call is executed to perform an operation on a special file, the
    appropriate device driver subroutine is invoked. What happens then is entirely
    up to the designer of the device driver; since the driver runs in the kernel,
    and not as a user process, it can access - and perhaps modify - any part of the
    kernel, any user process, and any registers or memory of the computer itself.
    It is relatively easy to add new device drivers to the kernel, so this provides
    a hook with which to do many things besides merely interfacing to new kinds of
    I/O devices. It’s the most popular way to get UNIX to do something its designers
    never intended it to do. Think of it as the approved way to do something wild.


    ## 1.49. What are signals?


    The kernel can send a signal to a process. A signal can be originated by the kernel
    itself, sent from a process to itself, sent from another process, or sent on behalf
    of the user.


    Signals are a technique used to notify a process that some conditions have occurred.
    For example, if a process divides by zero, the signal whose name is SIGFPE (floating
    point error) is sent to the process. The process has three choices for dealing
    with the signal:


    1. Ignore the signal. This is not recommended for signals that denote a hardware
    exception, such as dividing by zero, or referencing memory outside the address
    space of the process, since the results are undefined.


    2. Let the default action occur. For a divide by zero, the default is to terminate
    the process.


    3. Provide a function that is called when the signal occurs. By providing a function
    of our own, we will know when the signal occurs and we can handle it as we wish.


    An example of a kernel-originated signal is a segmentation-violation signal, sent
    when a process attempts to access memory outside of its address space.


    An example of a signal sent by a process to itself is an abort signal, sent by
    the abort function to terminate a process with a core dump.


    An example of a signal sent from one process to another is a termination signal,
    sent when one of several related processes decides to terminate the whole family.


    Finally, an example of a user-originated signal is an interrupt signal, sent to
    all processes created by the user when he or she types Ctrl-c.


    There are about 28 types of signals (some versions of UNIX have a few more or
    a few less). For all but 2, the kill and stop signals, a process can control what
    happens when it receives the signal. It can accept the default action, which usually
    results in termination of the process; it can ignore the signal; or it can catch
    the signal and execute a function, called a signal handler, when the signal arrives.
    The signal type (SIGALRM, say) is passed as an argument to the handler. There
    isn’t any direct way for the handler to determine who sent the signal, however.
    When the signal handler returns, the process resumes executing at the point of
    interruption. Two signals are left unused by the kernel. These may be used by
    an application for its own purposes.


    ## 1.50. Describe process-IDs, process groups, and sessions.


    Every process has a process-ID, which is a positive integer. At any instant, these
    are guaranteed to be unique. Every process but one has a parent.


    A process’s system data also records its parent-process-ID, the process-ID of
    its parent. If a process is orphaned because its parent terminated before it did,
    its parent-process-ID is changed to 1 (or some other fixed number). This is the
    process-ID of the initialization process (init), created at boot time, which is
    the ancestor of all other processes. In other words, the initialization process
    adopts all orphans.


    Sometimes programmers choose to implement a subsystem as a group of related processes
    instead of as a single process. The UNIX kernel allows these related processes
    to be organized into a process group. Process groups are further organized into
    sessions.


    One of the session members is the session leader, and one member of each process
    group is the process-group leader. For each process, UNIX keeps track of the process
    IDs of its process-group leader and session leader so that a process can locate
    itself in the hierarchy.


    The kernel provides a system call to send a signal to each member of a process
    group. Typically, this would be used to terminate the entire group, but any signal
    can be broadcast in this way.


    UNIX shells generally create one session per login. They usually form a separate
    process group for the processes in a pipeline; in this context a process group
    is also called a job. But that’s just the way shells like to do things; the kernel
    allows more flexibility so that any number of sessions can be formed within a
    single login, and each session can have its process groups formed any way it likes,
    as long as the hierarchy is maintained.


    It works this way: Any process can resign from its session and then become a leader
    of its own session (of one process group containing only one process). It can
    then create child processes to round out the new process group. Additional process
    groups within the session can be formed and processes assigned to the various
    groups. The assignments can be changed, too. Hence, a single user could be running,
    say, a session of 10 processes formed into, say, three process groups.


    A session, and thus the processes in it, can have a controlling terminal, which
    is the first terminal device opened by the session leader; the session leader
    then becomes the controlling process. Normally, the controlling terminal for a
    user’s processes is the terminal from which the user logged in. When a new session
    is formed, the processes in the new session no longer have a controlling terminal,
    until one is opened. Not having a controlling terminal is typical of so-called
    daemons (Web servers, the cron facility, etc.) which, once started, run divorced
    from whatever terminal was used to start them. “Demon” and “daemon” are two spellings
    of the same word, but the former connotes an evil spirit, whereas the latter connotes
    a supernatural being somewhere between God and man. Misbehaving daemons may properly
    be referred to as demons.


    It is possible to organize things so that only one process group in a session
    - the foreground job - has access to the terminal and to move process groups back
    and forth between foreground and background. This is called job control. A background
    process group that attempts to access the terminal is suspended until moved to
    the foreground. This prevents it from stealing input from the foreground job or
    scribbling on the foreground process group’s output.'
