    Inter process communication (IPC) is required to pass information between the
    parent and child after the `fork`. Information from the parent to the child before
    the fork is easy, since the child starts with a copy of the parent’s data space
    and with a copy of all the parent’s descriptors. But returning information from
    the child to the parent takes more work.


    Threads help with both problems. Threads are sometimes called lightweight processes,
    since a thread is “lighter weight” than a process. That is, thread creation can
    be 10-100 times faster than process creation.


    All threads within a process share the same global memory. This makes the sharing
    of information easy between the threads, but along with this simplicity comes
    the problem of synchronization. But more than just the global variables are shared.
    All threads within a process share:


    - process instructions,

    - most data,

    - open files (for example, descriptors),

    - signal handlers and signal dispositions,

    - current working directory, and

    - user and group IDs.


    But each thread has its own:


    - thread ID,

    - set of registers, including program counter and stack pointer,

    - stack (for local variables and return addresses),

    - `errno`,

    - signal mask, and

    - priority.


    ## 1.17. What is a daemon?


    It is a background process that listens for requests from other programs. Pronounced
    DEE-mun or DAY-mun. A process that runs in the background and performs a specified
    operation at predefined times or in response to certain events. The term daemon
    is a UNIX term, though many other operating systems provide support for daemons,
    though they are sometimes called other names. Windows, for example, refers to
    daemons as System Agents and services.


    Typical daemon processes include print spoolers, email handlers, and other programs
    that perform administrative tasks for the operating system. The term comes from
    Greek mythology, where daemons were guardian spirits.


    Daemons are processes that live for a long time. They are often started when the
    system is bootstrapped and terminate only when the system is shutdown. They run
    in the background, because they do not have a controlling terminal. UNIX systems
    have numerous daemons that perform day-to-day activities. For example, `ps`, `NFS
    Server daemon`.


    There are some basic rules to coding a daemon, to prevent unwanted interactions
    from happening:


    - The first thing to do is to call `fork` and have the parent exit. This does
    several things. First, if the daemon was started as a simple shell command, having
    the parent terminate makes the shell think that the command is done. Second, the
    child inherits the process group ID of the parent but gets a new process ID, so
    we are guaranteed that the child is not a process group leader. This is a prerequisite
    for the call to `setsid` that is done next.


    - Call `setsid` to create a new session. The three steps occur. The process (1)
    becomes a session leader of a new session, (2) becomes the process group leader
    of a new process group, and (3) has no controlling terminal.


    - Change the current working directory to the root directory. The current working
    directory inherited from the parent could be on a mounted filesystem. Since daemons
    normally exists until the system is rebooted, if the daemon stays on a mounted
    filesystem, that filesystem cannot be unmounted. Alternately, some daemons might
    change the current working directory to some specific location, where they will
    do all their work. For example, line printer spooling daemons often change to
    their spool directory.


    - Set the file mode creation mask to `0`. The file mode creation mask that is
    inherited could be set to deny certain permissions. If the daemon process is going
    to create files, it may want to set specific permissions. For example, if it specifically
    creates files with group-read and group-write enabled, a file mode creation mask
    that turns off either of these permissions would undo its efforts.


    - Unneeded file descriptors should be closed. This prevents the daemon from holding
    open any descriptors that it may have inherited from its parent (which could be
    a shell or some other process). Exactly which descriptors to close, however, depends
    on the daemon.


    ## 1.18. What is a cron job?


    A UNIX command for scheduling jobs to be executed sometime in the future. A `cron`
    is normally used to schedule a job that is executed periodically - for example,
    to send out a notice every morning. It is also a daemon process, meaning that
    it runs continuously, waiting for specific events to occur.


    `cron` is a UNIX utility that allows tasks to be automatically run in the background
    at regular intervals by the `cron` daemon. These tasks are often termed as cron
    jobs. `crontab` (CRON TABle) is a file which contains the schedule of cron entries
    to be run and at specified times.


    You can execute `crontab` if your name appears in the file `/usr/lib/cron/cron.allow`.
    If that file does not exist, you can use `crontab` if your name does not appear
    in the file `/usr/lib/cron/cron.deny`. If only `cron.deny` exists and is empty,
    all users can use `crontab`. If neither file exists, only the root user can use
    `crontab`. The allow/deny files consist of one user name per line.


    ## 1.19. What is a socket?


    A `socket` is network end point that is the combination of an IP address and a
    port number. The word socket is used as a metaphor because the information contained
    in a socket can be plugged directly into the requested process on the target computer
    on the Internet. A `socket` can be created to identify an application running
    anywhere on the Internet.


    ## 1.20. What is the main advantage of creating links to a file instead of copies
    of the file?


    The main advantage is not really that it saves disk space (though it does that
    too) but, rather, that a change of permissions on the file is applied to all the
    link access points. The link will show permissions `lrwxrwxrwx` but that is for
    the link itself and not the access to the file to which it points. Thus if you
    want to change the permissions for a command, such as `su`, you only have to do
    it on the original. With copies you have to find all of the copies and change
    permission on each of the copies.


    ## 1.21. Describe hard link.


    A great way to give easy access to your files is to create a hard link from your
    directory. In making a hard link, all you are doing is starting with an existing
    file and creating a link, which (sort of) places the existing file in another
    directory. The link does not create a copy of the file; instead, you are creating
    a second pointer to the same physical file on the disk. Rather than the additional
    pointer being secondary (like an alias or shortcut in Windows computers), both
    of the pointers reference the same actual file, so from the perspective of the
    UNIX system, the file actually resides in two locations.


    Because using hard links often requires that you have access to another user’s
    home directory, you may have to use `chmod`, `chgrp`, and `chown` to access another
    user’s directories and files. You can remove hard links just as you remove regular
    files, by using `rm` plus the file name. If one user removes the file, the other
    user can still access the file from his/her directory. Hard links work from file
    to file within the same file system. To link directories or to link across file
    systems, you will have to use soft links.


    ```

