    # 在这里设置只对交互式 shell 有用的\n# 提示符或别名。\n\nsource ~/.aliases\n```\n\n## 如何构建一个通可以匹配除\
    \ `.` 和 `..` 之外所有文件的 shell 通配符模式？\n\n你可能认为这很简单。\n\n*   `*` 匹配所有不以 `.` 开头的文件；\n\
    *   `.*` 匹配所有以 `.` 开头的文件，但这包含了特殊条目 `.` 和 `..`，通常你并不需要它们；\n*   `.[!.]*`（仅限较新的 shell；某些\
    \ shell 使用 `^` 代替 `!`；POSIX shell 必须接受 `!`，但也可能接受 `^`；所有可移植应用程序不应在 `[` 之后紧跟未加引号的\
    \ `^`）匹配所有以 `.` 开头且后续为非 `.` 的；遗憾的是，这将漏掉 `..foo`；\n*   `.??*` 匹配以 `.` 开头且长度至少为\
    \ 3 个字符的文件。这巧妙地避开了 `.` 和 `..`，但也漏掉了 `.a`。\n\n所以为了安全地匹配除 `.` 和 `..` 之外的所有文件，你必须使用\
    \ 3 个模式（如果你没有像 `.a` 这样的文件名，可以省略第一个）：\n\n`.[!.]* .??* *`\n\n或者你可以使用一两个外部程序并使用反引号替换。这很好：\n\
    \n```bash\nls -a | sed -e ‘^\\.$/d’ -e ‘^\\.\\.$/d’\n```\n\n（或在某些 Unix 版本中使用 `ls\
    \ -A`）\n\n但即使它也会处理包含换行符、IFS 字符或通配符的文件时出错。\n\n## 1.251. 如何在 Bourne shell 脚本找到最后一个参数？\n\
    \n如果你确定参数数量最多为 9 个，可以使用：\n\n```bash\neval last=\\${$#}\n```\n\n在兼容 POSIX 的 shell\
    \ 中，它适用于任意数量的参数。以下方法也始终有效：\n\n```bash\nfor last\ndo\n  :\ndone\n```\n\n这可以泛化为：\n\
    \n```bash\nfor i\ndo\n  third_last=$second_last\n  second_last=$last\n  last=$i\n\
    done\n```\n\n现在假设你想从列表中删除最后一个参数，或者反转参数列表，或者直接访问第 N 个参数，无论 N 是多少。这里是仅使用 shell 内置结构来实现此点的基础，而无需创建子进程：\n\
    \n```bash\nt0= u0= rest=‘1 2 3 4 5 6 7 8 9’ argv=\nfor h in ‘‘ $rest\ndo\n  for\
    \ t in “$t0” $rest\n  do\n    for u in $u0 $rest\n    do\n      case $# in\n \
    \     0)\n        break 3\n      esac\n      eval argv$h$t$u=\\$1\n      argv=“$argv\
    \ \\$argv$h$t$u\\”“ # (1)\n      shift\n    done\n    u0=0\n  done\n  t0=0\ndone\n\
    # 现在恢复参数\neval set x “$argv”     # (2)\nshift\n```\n\n这个示例适用于前 999 个参数。足够了吗？仔细观察标记为\
    \ (1) 和 (2) 的行，并让自己相信无论它们包含什么奇怪的字符，原始参数确实被恢复了！\n\n现在要找到第 N 个参数，可以使用：\n\n```bash\n\
    eval argN=\\$argv$N\n```\n\n要反转参数，必须将标记为 (1) 的行改为：\n\n```bash\nargv=“\\\"$argv$h$t$u\\\
    ” $argv”\n```\n\n如何删除最后一个参数留作练习。\n\n如果你允许使用子进程（可能执行非内置命令），可以更方便地设置 `argvN` 变量：\n\
    \n```bash\nN=1\nfor i\ndo\n  eval argv$N=$i\n  N=`expr $N + 1`\ndone\n```\n\n\
    反转参数还有更简单的方法，甚至不需要创建子进程。如果你想删除最后一个参数，也可以采用这种方法，但这种情况下你无法直接引用第 N 个参数了，因为 `argvN`\
    \ 变量是反序设置的：\n\n```bash\nargv=\nfor i\ndo\n  eval argv$#=$i\n  argv=“\\\"$argv$#\\\
    ” $argv”\n  shift\ndone\neval set x “$argv”\nshift\n```\n\n## 1.252. 在你的 `$PATH`\
    \ 中包含 `.` 有什么问题？\n\n背景：`PATH` 环境变量是一个由冒号分隔的目录列表。当你输入命令名而不提供显式路径时（例如，输入 `ls` 而不是\
    \ `/bin/ls`），你的 shell 会按顺序搜索 `PATH` 列表中的每个目录，寻找同名的可执行文件，shell 将运行找到的第一个匹配程序。\n\
    \n`PATH` 列表中的一个目录可以是当前目录 `.`。允许在 `PATH` 列表中使用空目录名来表示当前目录。\n\n（注：此处后续为大量重复的 PATH\
    \ 示例，已按要求省略重复内容）\n\n"
