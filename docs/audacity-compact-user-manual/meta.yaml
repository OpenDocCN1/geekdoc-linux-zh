    # 8 Download and installation


    As already described earlier, Audacity is a programme, which is independent from
    any operating system. This means, that this programme is available for Windows,
    Mac OS X and Linux.


    For downloading, visit the official website of the project: *http://audacity.sourceforge.net.*
    Select the desired version, which you want to download.


    There are at least two different versions available. The in the versioning older
    or smaller version (this is currently the release 1.2.6) is the officially approved
    stable version for efficient application, while the newer programme version, which
    is called the beta version, has not been completely tested for possible bugs yet.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_138_0.png)


    **Selection of the programme versions.**


    Additionally, you have the option of downloading the source code of a certain
    release or the current status of a programme version directly from the CVS (Concurrent
    Versions System), which you can then compile.'
  - '[PAGE 139]


    # ## 8.1 Windows


    You can use Audacity on Windows 98, ME, 2000, XP and Vista. For this purpose,
    you have to download the respective installation file from the website of the
    project. Open it via double clicking on the .exe-file and the installation assistant
    will guide you comfortably through the installation.


    Moreover, you will find the LAME MP3 Encoder for the creation of MP3-files, the
    VST Enabler for the usage of the extension modules VST-Effect-Plug-Ins as well
    as the respective plug-ins.


    Please keep in mind, that your hardware should fulfill the following minimum system
    requirements:


    | Characteristics | Minimum RAM | Minimum CPU | Recommended RAM | Recommended
    CPU |

    |---|---|---|---|---|

    | 98/ME | 256 MB | 300 MHz | 512 MB | 500 MHz |

    | 2000/XP | 512 MB | 300 MHz | 1 GB | 1 GHz |

    | Vista Home Basic | 512 MB | 1 GHz | 2 GB | 1 GHz |

    | Vista Home Premium/Business/Ultimate | 1 GB | 1 GHz | 4 GB | 2 GHz |


    The recommended values apply for tasks such as:


    +   - Recordings of about an hour duration, or

    - The simultaneous editing of three tracks with a length of 20 minutes.


    However, if you want to handle more complex tasks, you should possess accordingly
    better hardware equipment.'
  - '[PAGE 140]


    # 8.2 Mac OS


    For Macintosh operating systems (Mac OS), there are also different versions available
    on the websites mentioned earlier. The version 1.00 is still available for the
    operating system Mac OS 9, for which development has been stopped otherwise. For
    the newer programme versions, you need the operating system Mac OS X 10.1 or higher,
    or for the programme versions from 1.3.0 respectively the operating system 10.3
    or higher.


    Do as follows: If you start the installation by double clicking on the downloaded
    .dmg-file, a virtual drive with the name *audacity-macosx-version number* will
    be generated. Open this drive again by double clicking and copy all files to the
    desired programme folder for Audacity (if necessary create a new folder first).
    Then eject the virtual drive. All necessary configuration files will be generated
    at the first programme start.


    Audacity requires at least 64 MB RAM free memory and a 300 MHz processor and,
    for more complex tasks, a correspondingly better hardware equipment.


    # 8.3 Linux


    Audacity is enclosed by now to many linux distributions, so that you can install
    the programme easily via your packet manager. Though, sometimes it is a slightly
    older version. On the websites mentioned earlier, you will find the links to the
    packets for your distribution. Alternatively, you can certainly also download
    the source code from the CVS and compile the programme yourself.


    The following listing shows the required software components to compile the source
    code:


    +   - **wxWidgets library**: An open source framework based on C++ for the development
    of programmes with platform independent graphical user interfaces (short GUI).


    Optionally, the following software can also be used:'
  - '[PAGE 141]


    +   - **libmad**: Library to decode MPEG-audio; supports MPEG-1- (Layer 1, Layer
    II and Layer III, also known as MP3), MPEG-2- and MPEG-2.5-formats.

    - **Libsndfile**: A library written in C to read and write audio files in the
    formats AIFF, AU and WAV. Hereby, the reading and writing of PCM-files in 8-,
    16-, 24- and 32-bit is supported as well as 32-bit (floating point)-WAV-files
    and several compressed formats.

    - **Ogg Vorbis** (libvorbis-dev, libogg-dev): Free streaming-compatible codec
    for the lossy audio files compression. Has been developed as an alternative to
    the very common, but proprietary MP3-format. As file extension, .ogg is used.
    Vorbis is in this connection the audio encoder. This format convinces in comparison
    to MPEG-1 Audio Layer III (MP3) through better quality at identical or even smaller
    file sizes. Unfortunately, it still lacks the necessary hardware support by the
    industry.


    The compiling itself happens via the so-called autotools (autoconf, automake,
    autoheader, libtool) with the commands *./configure && make && make install*.
    For this, the corresponding compilers like the g++-compiler have to be installed
    first. It is possible that you might receive a corresponding error message, which
    will point the missing software out to you.


    # ## Common problems


    In the following, some already known problems and their solution will be shown.
    You can try to find a solution via the Internet, if you have a problem, which
    is not discussed here. Note in this context the URLs about Audacity, which you
    find in the appendix.


    # ### C compiler cannot create executables


    If you receive the message *C compiler cannot create executables* on Debian or
    one of the hereon based Linux distributions such as Ubuntu, Kubuntu and so forth,
    you should enter the following commands as the user root:'
- md: ' apt-get install build-essential make bin86 (installs the packets for compilation)


    ## Could not find wx-config: is wxWidgets installed?


    Using OpenSuse, the error occurred, that the file /usr/bin/wx-config-2.8 has been
    generated instead of the file /usr/bin/wx-config, whereupon the computer generated
    the following message: *Could not find wx-config: is wxWidgets installed? Is wx-config
    in your path?*


    In this case, it helped to create a simple symbolic link via the command *ln -s
    /usr/bin/wx-config-2.8 /usr/bin/wx-config*, to solve the problem.


    ## 8.4 Installing the MP3-Encoder


    To be able to generate the popular MP3-files, you need the additional programme
    LAME MP3 Encoder. Simply follow the corresponding links on the download page in
    the section *Further Downloads* and download the Encoder for your operating system.


    | Operating system | Audacity version | Name of the LAME MP3 Encoder |

    | --- | --- | --- |

    | Windows | all | libmp3lame-win-3.97.zip |

    | Mac OS X (PPC) | 1.2.6 | LameLib-Carbon.sit |

    | Mac OS X (Intel) | 1.2.6 | libmp3lame-osx-universal-3.97.zip |

    | Mac OS X (Intel, PPC) | 1.3.3 | libmp3lame-osx-universal-3.97.zip |

    | Solaris 10 (SPARC) | all | lame-3.97.pkg.gz |


    After unpacking the archive, you will find among others the file lame_enc.dll.
    This is the Encoder-file. You can copy the file to a location of your choice on
    your hard disk. When you export to MP3 for the first time, you will simply be
    asked for the storage location of the Encoder-file.


    There have been many different MP3-Encoders such as Blade, Shine, Audioactive
    and GoGo-No-Coda for the different Linux distributions, but still Lame established
    itself, nevertheless, as the quasi-standard even on these operating systems because
    of its qualitative predominance.


    ## 6 Glossary


    **AAC** stands for "Advanced Audio Coding" and is a lossy compression procedure
    and in principle a further development of the popular MP3-file format. It was
    developed in collaboration of the Fraunhofer Institute with the companies AT&T,
    Nokia and Sony.


    **AIFF** stands for "Audio Interchange File Format" and is a file format for saving
    audio files, whereupon no data compression is used. It has been developed by the
    company Apple and is applied as the standard audio format on the Macintosh. It
    is, so to speak, the equivalent to the WAV-format of Windows and is saved with
    the file extension *.aif or *.aiff.


    **AUP** stands for "Audacity Project" and is the file format, which is used in
    Audacity internally and is based on XML. It cannot be read by other sound editing
    programmes. To reach the highest possible speed for reading and writing these
    files, the audio files are separated into many small audio files and saved in
    the _data-folder.


    **CDDA** stands for "Compact Disc Digital Audio" and is an optical mass storage,
    which is usually just called CD and which replaced the formerly common vinyl records.
    The most common CDs have a memory capacity of about 650 to 800 MB.


    **FLAC** stands for "Free Lossless Audio Codec". Thus, it is a free and lossless
    compressing audio format. FLAC is mainly used for filing CDs and spreading free,
    non-commercial music. The compressing rate of FLAC partly reaches up to 50 percent.


    **GSM** stands for "Global Standard for Mobile telecommunications", is a standard
    for compressing speech and is – besides telephony – mainly used for language programmes.


    **Latency** is the lag, which appears between input and output of a signal at
    digital audio editing. This is caused on the one hand by the processing of the
    signal via a programme as well as on the other hand by the signal path as such.


    **Macintosh HCOM** is a sample format for Macintosh, which works with Huffman
    encoding. In this connection, 8- or 16 bit-recordings respectively in mono and
    stereo are possible.


    **Maud (Amiga)** is an IFF-compliant audio format, which has been developed by
    the MS MacroSystem Computer GmbH in connection with the "Toccata sound card" for
    the Amiga.


    **MIDI** stands for "Musical Instrument Digital Interface" and is the digital
    cutting site for musical instruments and sound cards. MIDI-files contain control
    data for these cutting sites, which are located on many musical instruments and
    sound cards.


    **MPEG-1 Audio Layer III (MP3)** is by now the best-known proprietary audio format.
    It is a file format for the lossy compression of audio signals, whereupon it is
    tried to keep the audible losses as low as possible. Provided that you have an
    Encoder, you can save MP3-files with data rates of 8 up to 320 kbps with Audacity.


    **Musepack** or **MPC** is a file format for the lossy audio compression. Especially
    at higher bit rates from about 160 kbps, Musepack outshines other formats concerning
    the sound, because from this value on, usually a transparent music quality is
    obtained. Music quality is then called transparent, when there are no audible
    differences between the original and the compressed file. For this reason, Musepack
    is an ideal format for qualitatively discerning saving. Musepack-files have the
    endings *mpc, mpp* or *mp+*.


    **Ogg-Vorbis** is a free and from software patents unrestricted open source project
    for the compression of audio, video and text files in a multimedia container.
    The file extension .ogg is used. Vorbis is in this connection the audio encoder.
    This format convinces in comparison to MPEG-1 Audio Layer III (MP3) through better
    quality at identical or even smaller file sizes. Unfortunately, it still lacks
    the necessary hardware support by the industry.


    **Sun AU** is a format developed by the company Sun, which is reckoned the standard
    audio format for Unix and its derivatives. With the so-called "logarithmic encoding",
    it is possible to represent a higher dynamic region at the expense of a raised
    noise level.


    **Wave** or WAV is a container format, which enables lossless and uncompressed
    saving of audio files as well as the saving of compressed audio formats, such
    as MP3-files. This format is also frequently called RIFF-WAV, because several
    RIFF data streams can be encoded in one WAV-file. RIFF stands for "Resource Interchange
    File Format" and has been developed by Microsoft and IBM. It can usually be found
    on portable recording devices (such as Dictaphones).


    ## 10 Appendix


    In the following, you will find a listing of the most important online addresses
    in connection with Audacity:


    **Official Audacity homepage** -- http://audacity.sourceforge.net


    Here you find the newest programme versions as well as continuative links to additional
    effects, MP3 encoders and more.


    **English forum** -- http://audacityteam.org/forum/


    Tipps and informations about Audacity and audio editing with about 4,000 registered
    users. Here you also find a large collection of FAQs ("*Frequently asked questions*").


    **Audacity Wiki** -- http://audacityteam.org/wiki/


    Collection of English websites with tips and tricks about Audacity in particular
    and audio editing in general, which cannot only be read by the users, but also
    be revised and expanded by users online.


    ## Mailing list – http://audacity.sourceforge.net/contact/lists


    Register yourself here to the mailing list and benefit from the possibility to
    get answers to your questions quickly from experienced users. However, before
    you ask your questions, you should search the archive first.


