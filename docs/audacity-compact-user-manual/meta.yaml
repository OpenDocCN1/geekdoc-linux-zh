    source can be chosen via the right pull-down menu.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_34_0.png)


    You can change settings by either pulling the controller to the desired position
    by holding down a mouse button, or by opening the respective window by double
    clicking on the scale to directly enter the value.


    The *edit toolbar* offers further important features for the editing and viewing
    of the audio tracks.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_34_1.png)


    | Symbol | Name | Function |

    |--------|------|----------|

