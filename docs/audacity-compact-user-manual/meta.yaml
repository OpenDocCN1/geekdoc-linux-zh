- img_proc: true
  md: '+   - **Audio cache:** If you select the option *Play and/or record using RAM*,
    the files will be left in the main storage, until the recording is stopped; only
    then it will be written to the hard drive. Furthermore, all audio files, which
    exist in the project, are completely kept to the main memory of the computer.
    Via this option, it is possible to work fluently even with those projects, which
    are saved on a slow data medium, such as via a slow network connected network
    drive. The user has to keep in mind, not to open files, which are bigger than
    the available main memory, because they could cause crashes of Audacity or the
    whole computer. Therefore, it is strongly recommended to leave this function unselected
    under normal circumstances.


    # ## 6.6 Adjusting the programme interface


    This register is divided into the four sections *Behaviors*, *Language*, *Display
