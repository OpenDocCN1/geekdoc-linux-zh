    # 5.3 Problems and possible solutions


    In this chapter, typical difficulties and problems as well as their solutions
    shall be discussed.


    # 5.3.1 Recording with interruptions and disturbances


    After you finished a recording, you discover during replaying that there are brief
    interruptions and creaks.


    These problems indicate that the computer is overloaded during the recording or
    the replay. This can have several different causes:


    +   - While working with Audacity, other programmes are opened, which run in the
    background and, therefore, need additional main memory and processing time. Pay
    special attention to those programmes, which monitor nearly every activity of
    the computer, such as virus scanners, anti-spyware-programmes or indexations,
    and close these programmes while working with Audacity.

    - The applied drivers of the sound card and with it of the converter are either
    wrong or outdated. This problem does not only occur on older computers. Even brand
    new computers are often delivered with outdated drivers. This problem can be eliminated
    by researching on the website of the manufacturer, where you can also download
    the updated drivers if necessary and install them. Do also check, if there is
    a so-called chip set driver from the producer. If so, you should test, which driver
    is better suited.

    - The accesses to the hard drive are too slow. If you own an older computer, your
    hard disk may possibly not be able to execute the accesses with the necessary
    speed. Before changing the hard drive, please check first, if you can boost its
    rating via a defragmentation. Furthermore, you should test, if the DMA-mode (Direct
    Memory Access) or respectively the UDMA-mode (Ultra Direct Memory Access) of the
    hard disk driver is activated. This mode causes, that the drives access of the
    main storage directly and, thus, save processor capacity. Using the operating
    system Windows, you have to access the button *System* under *System Control*
    and then select the'
- md: ' button *Device Manager* in the register *Hardware*, which opens a corresponding
    window. A mouse click on the small plus in front of *IDE ATA/ATAPI Controller*
    opens a list of the related entries. Select the entry *Primary IDE Channel* by
    double clicking. Now you can set the entry *DMA, if available* in the register
    *Advanced Settings* in the dropdown menu *Transfer Mode*.


    - The main memory of your system is simply too small or the processor so old,
    that it cannot process the requirements. If this is the case, you should check,
    if an upgrade is possible and reasonable.


    You can also minimise the requirements by adjusting the programme itself. Here
    are some possibilities:


    - Reduce the sample format (sample range) and the sample frequency. For a single
    audio track: For this purpose, open the context menu of the header of the track
    and select the desired setting. You can change the default values by opening the
    window *Audacity Preferences* via the menu command *Edit > Preferences*, selecting
    the register *Quality* on the left side and setting your changes under *Sampling*.


    - Increase the latency (possible from release 1.3.2 on). For this purpose, switch
    in the window *Audacity Preferences* to the register *Audio I/O* and set your
    changes under *Latency*.


    - Disable scrolling while replaying (*Update display while playing*). This preference
    can be set in the window *Audacity Preferences* in the register *Interface* under
    *Behaviors*.


    ## 5.3.2 Recording has differing recording levels


    You make a recording and detect, that the volume oscillates extremely. If in this
    connection low parts are "lifted" and loud parts are muffled, it seems likely
    that your sound card possesses an automatic recording level. In this case, try
    to disable this automatic recording level via the driver of the sound card. This
    feature can e. g. be called AGC, which stands for "Automatic Gain Control". Unfortunately,
    there are several models that do not allow disabling of this feature.


    ## 5.3.3 Recordings do not run "centred"


    A problem, which often occurs with basic sound cards, is the fact, that amplitudes
    in the wave form do not disperse exactly at the zero level, but lie below or above
    it. This can be seen particularly well at absolute silences during the recording.
    It can be suppressed with the feature *Remove any DC offset (center on 0.0 vertically)*,
    which you find below the effect *Normalize*.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_112_0.png)


    > The feature *Remove any DC offset*.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_112_1.png)


    > Before and after using the feature *Remove any DC offset*.


    # 6 Preferences


    With Audacity, you can start immediately after the installation to edit audio
    files, since the programme is delivered with preferences, which cover most of
    the well-established applications. However, if you want to execute very specific
    tasks, such as listening to already existing audio tracks at the same time as
    recording a new audio track, you have to set the respective preferences first.
    You can do so in the window *Audacity Preferences*, which you open either with
    the aid of the menu command *Edit > Preferences* or via the shortcut *Ctrl + P*.


    The window is subdivided into nine indexes, which are given on the left side *(Audio
    I/O, Quality, Import / Export* and so on), where they can be selected.


    ## 6.1 Audio I/O


    In this register, the preferences for the audio streams into the programme and
    out of the programme are set among other things.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_114_0.png)


    > The window *Audacity Preferences*.


    The settings:


    - **Playback**: Here you select via the dropdown menu the sound card, which shall
    be used for the audio playback.


    - **Recording**: Select the device for audio recording via the dropdown menu.


    - **Channels**: Here you can set the number of desired recording channels.


    In the area *Playthrough* you find two options, which you can activate and deactivate
    by clicking onto the preceding small box. When an option is activated, a check
    mark will be shown within the box.


    The settings:


    - **Overdub**: This option makes it possible to play an existing track while simultaneously
    recording a new track.


    - **Software Playthrough: Play new track while recording or monitoring (uncheck
    when recording "stereo mix")**: This option makes it possible to directly listen
    to the current recording.


    Almost all effects permit a preview of the respective effect before appliance.
    In the area *Effects Preview*, you can set the length of preview in seconds:


    - **Length of preview**: Here you set the preview time for the effect in seconds.


    In the section *Cut Preview*, you can set the period of time, which you want to
    hear before or respectively after the cut:


    - **Preview before cut region**: Here you set, how many seconds before the cut
    the playback shall start.


    - **Preview after cut region**: Here you set, how many seconds after the cut the
    playback continues.


    In the section *Latency*, you can, on the one hand, adjust the processing time
    and, on the other hand, make corrections, for example to be able to record synchronously
    to already existing tracks.


    ## 6.2 Quality


    In this panel, you can set the quality of the recordings, of the import and of
    the conversion.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_116_0.png)


    **The register *Quality*.**


    The setting options:


    - **Default Sample Rate**: Set the sample frequency here, with which you want
    to work by default while recording or respectively importing. The dropdown menu
    offers different popular parameters, as well as the possibility to enter your
    own parameters in the box behind it via the selection *Other*.


    - **Default Sample Format**: In this dropdown menu, you choose between 16-bit
    (CD quality), 24-bit (standard studio recording quality) and 32-bit float (floating
    point precision format).


    - **Real-time/High-quality**: In this dropdown menu, you choose between *Fast
    Sinc Interpolation* (faster) and *High Quality Sinc Interpolation* (better quality)
    for the processing of audio files.


    - **Dither**: You can select or deselect this feature, which prevents digital
    distortions by adding a higher noise component. If you decide in favour of the
    *Dither*, you can choose between different types (*None*, *Rectangle*, *Triangle*
    and *Shaped*).


    ## 6.3 Import / Export


    In this panel, you set the treatment of audio files.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_117_0.png)


    > **The panel *Import / Export*.**


    Possible modifications:


    - **When importing audio files**: Here you decide what will be done with uncompressed
    files when imported. Certainly, it is safer to have a copy of the file created
    than to directly play the original file. The two options are mutually exclusive,
    i. e. only one option is selectable at a time.


    Moreover, you can select the option *Normalize all tracks in project*, which causes
    that imported files are automatically normalised via the batch processing.


    - **When saving a project that depends on other audio files:** The safest available
    option is *Always copy all audio into project*, whereat all necessary files are
    saved to the project. *Do not copy any audio*.BufferSize...'
