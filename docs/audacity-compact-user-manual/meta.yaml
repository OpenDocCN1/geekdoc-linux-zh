    \ Ogg Vorbis。\n\n要打开其中一种支持的音频格式，请按以下步骤操作：\n\n- 使用拖放方法，按住鼠标按钮将音频文件拖入 Audacity 的程序窗口中。\n\
    - 通过快捷键*Ctrl + O*打开*Open*窗口，选择你要打开的一个或多个文件。\n- 通过*File > Open...*打开*Open*窗口，选择你要打开的一个或多个文件。\n\
    \n文件现在被导入，随后将以标准波形形式显示在程序窗口中。\n\n**导入各自的格式。**\n\n**波形——音频文件的标准显示。**\n\n默认显示为线性的波形，在外部较暗区域显示峰值，在内部较亮区域显示均方根值（RMS）。\n\
    \n**重要提示：** 如果你选择打开多个文件，将为每个文件分别创建一个程序窗口。然而，如果你想在一个程序窗口中打开多个音频文件，则必须使用*Import*命令。通过这种方式，可以加载更多音频文件、文本轨道、时间轨道和\
    \ MIDI 文件等内容到一个程序窗口中，并在那里显示。\n\n为此，请按以下步骤操作：\n\n使用菜单命令*File > Import*，在子菜单中从预设项*Audio*、*Labels*、*MIDI*和*Raw\
    \ Data*中选择所需的类别。\n\n根据所选类别，将打开一个带有相应筛选器的窗口，你可以在其中选择相应的单个或多个文件。\n\n此外，原始数据的导入非常有趣，即使是对于\
    \ Audacity 最初不支持的所谓专有音频文件也是如此。如果音频文件内部使用未压缩的原始数据形式，即 PCM（脉冲编码调制），Audacity 很可能仍然可以通过原始数据导入来打开这些文件。\n\
    \n通过菜单命令*File > Import > Raw Data*选择文件后，将打开*Raw Data Import*窗口，你可以在其中输入有关该文件的更多详细信息。在这种情况下，你必须输入通常包含在文件头中的信息。然而，在某些不明确的情况下，只能通过尝试来解决。\n\
    \n**原始数据导入的可能设置。**\n\n原始数据导入仅适用于未压缩的文件。ASF、AAC、MP3、WMA、WMV 等格式的文件无法导入，加密的文件也是如此。\n\
    \n各项说明如下：\n\n- **Signed/unsigned**：此说明提供有关数据内部存储方式的信息。例如，Signed 8 bit PCM 使用 -128\
    \ 到 127 的值，而 Unsigned 8 bit PCM 使用 0 到 255 的值。\n- **8, 16, 24, 32 bit**：在此输入量化类型，即文件数字化时使用的采样范围。\n\
    - **PCM**：此缩写代表脉冲编码调制（Puls-Code-Modulation），是一种常用于将模拟音频信号转换为数字音频信号的方法。为此，模拟信号以一定的频率进行时间离散采样，即以等时距离采样，然后通过模数转换器进行量化。\n\
    - **U-Law/A-Law**：用于音频信号动态压缩的类似方法，可降低低电平时的噪声。然而，这些方法差异足够大，因此在欧洲（使用 A-Law 方法）和北美（使用\
    \ U-Law 方法）之间的电话通话中需要使用转换器。\n- **DWVW**：\"Delta With Variable Word Width\"的缩写；AIFF-C\
    \ 文件格式的一种压缩类型。\n- **GSM**：是一种有损的语音压缩标准。GSM 代表\"Global Standard for Mobile telecommunications\"\
    （全球移动通信标准）。此格式用于（移动）电话、语音程序和语音消息。\n- **ADPCM**：代表\"Adaptive Differential Pulse\
    \ Code Modulation\"（自适应差分脉冲编码调制），是一种用于通过窄带数字介质传输音频信号的压缩方法。文件速率在此根据输入信号动态调整。例如，此过程用于\
    \ DECT 电话（Digital Enhanced Cordless Telecommunications，数字增强无绳通信），即无绳电话。\n- **Endianness**：设置字节顺序，以便正确解释。Big-endian\
    \ 格式将高有效字节（也称为 MSB，Most Significant Byte）放在首位，而 Little-endian 格式将低有效字节（Least Significant\
    \ Byte，LSB）放在首位。\n- **1 Channel ... 16 Channels**：在此设置通道数。\n- **0-Byte Offset**：在此输入文件头的大小。\n\
    - **Amount to import**：设置要导入的数据量。\n- **Sample rate**：在此设置使用的采样率。\n\n遗憾的是，Audacity\
    \ 目前还无法直接导入 CD。尝试此操作时，你会收到一条消息，指向其他程序。\n\n这方面的可用性仍有待改进。\n\n**提示：** 如果你想使用 Audacity\
    \ 不支持的文件格式，应尝试使用音频转换器将其转换为支持的格式。建议先将数据转换为无损格式，如 WAV、AIFF 或 FLAC，然后使用 Audacity\
    \ 进行编辑，最后将音频数据导出为所需的目标格式。\n\n## 3.2 标记音频轨道\n\n就像你可能已经从文本编辑程序中了解到的那样，在 Audacity\
    \ 中，你必须先标记文件中要剪切、编辑或替换的部分。为此，你有许多不同的选项：\n\n要通过鼠标操作，必须激活*selection tool*或*multi-tool*。现在按住鼠标按钮标记音频文件的所需部分。随后，选区将显示得比音频轨道的其余部分稍暗。要扩展或缩小标记，只需按住\
    \ Shift 键，同时通过鼠标点击选择新的终点。如果你想标记整个音频轨道，可以点击轨道前标题中的属性或控制器下方的空闲区域。\n\n使用箭头键将光标移动到起点，然后按住\
    \ Shift 键用右或左箭头键标记所需的区域。同样，要扩展标记，你也可以按住 Shift 键来移动相应的边界。要移除标记，你可以使用右箭头键将光标设置到右端位置，使用左箭头键设置到左端位置。你可以通过快捷键\
    \ Ctrl + A 标记整个音频轨道。\n\n如果光标位于所需位置，你可以通过菜单项*Edit > Select*执行以下操作：*All*、*None*、*Left\
    \ at Playback Position*（打开窗口*Set Left Selection Bound*）、*Right at Playback Position*（打开窗口*Set\
    \ Right Selection Bound*）、*Track Start to Cursor*和*Cursor to Track End*。\n\n音频轨道的标记区域现在显示为稍暗的颜色，如以下示例所示：\n\
    \n**带有标记区域的立体声音频轨道。**\n\n如果你在一个窗口中处理多个音频轨道，还可以创建跨越多个轨道的标记。\n"
