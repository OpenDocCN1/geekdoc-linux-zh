    - **db**: Standard display, which shows the scale of the level meter logarithmically
    (0 dB = maximum level meter). Further settings for this display range can be made
    via *Edit> Preferences> Interface> Display range minimum*.

    - **Preferences**: Here you can determine, how often per second the display is
    refreshed. Possible values are 1 to 100. Please bear in mind, that a high rate
    requires correspondingly higher processing power.


    Next, you find the *mixer toolbar* below the control toolbar. With its help, the
