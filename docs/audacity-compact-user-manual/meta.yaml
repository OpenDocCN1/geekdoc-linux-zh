    - **字体（Font）：** 选择字体及其大小。

    - **上移轨道（Move Track Up）：** 此命令将标签轨道上移至上一轨道，仅在标签轨道上方至少有一个轨道时才会激活。

    - **下移轨道（Move Track Down）：** 此命令将标签轨道下移至下一轨道，仅在标签轨道下方至少有一个轨道时才会激活。


    ## 3.6.3 时间轨道


    您可以通过菜单命令 *轨道 > 新建 > 时间轨道*（*Tracks > Add New > Time Track*）创建时间轨道。通过时间轨道，您可以连续改变音轨的播放速度。要调整基本设置，如选择标题或速度变化区域，请用鼠标指针单击
    *时间轨道*（*Time Track*）名称或轨道标题中的向下箭头，随后会打开以下上下文菜单。


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_74_0.png)


    时间轨道的上下文菜单。


    菜单详细说明：


    - **名称（Name）**：打开 *轨道名称*（*Track Name*）窗口，您可以在其中输入一个有意义的标题。

    - **上移轨道（Move Track Up）**：此命令将时间轨道上移至上一轨道，仅在时间轨道上方至少有一个其他轨道时才会激活。

    - **下移轨道（Move Track Down）**：此命令将时间轨道下移至下一轨道，仅在时间轨道下方至少有一个其他轨道时才会激活。

    - **设置范围（Set range）**：您可以在这里设置最低速度限制，以原始速度的百分比表示（>=13），以及最高速度限制（<=1200）。默认预设为
    90% 和 110%。


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_75_0.png)


    > 未处理和已处理的时间轨道。


    您可以使用包络工具处理时间轨道，从而创造出类似唱片机播放过快或过慢的效果。如果音轨运行更快，会产生更高的音高；如果运行更慢，则会产生更低的音高。


    ### 3.6.4 MIDI 轨道


    如前所述，Audacity 目前尚不能处理 MIDI 文件，但这些文件已经可以以轨道形式显示。在未来的版本中，计划支持 MIDI。您无法生成 MIDI 轨道，只能通过导入
    MIDI 文件来创建。


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_75_1.png)


    > MIDI 文件显示的示例。


    MIDI 是用于乐器或声卡的所谓事件消息。在此上下文中，例如乐器、音符、音量、声像及其他信息被设置。与数字音频文件不同，MIDI 文件非常小。大约 10 KB
    就足以容纳一分钟的音乐。然而，人声等复杂声音无法通过 MIDI 再现。此外，您还面临这样的风险：同一个 MIDI 文件在不同的硬件上听起来可能差异很大，因为
    MIDI 文件只保存"音符"，而不是单个乐器的声音。


    您可以通过点击鼠标在轨道标题处显示或隐藏各个通道。轨道标题的上下文菜单显示以下图中所示的条目。


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_76_0.png)


    如前所述，目前不支持 MIDI 轨道。它们只能被显示，但无法播放或处理。菜单项：


    - **名称（Name）**：打开 *轨道名称*（*Track Name*）窗口，您可以在其中输入一个有意义的轨道标题。

    - **上移轨道（Move Track Up）**：此命令将 MIDI 轨道上移至上一轨道，仅在 MIDI 轨道上方至少有一个其他轨道时才会激活。

    - **下移轨道（Move Track Down）**：此命令将 MIDI 轨道下移至下一轨道，仅在 MIDI 轨道下方至少有一个其他轨道时才会激活。

    - **高八度（One Octave Up）**：显示 MIDI 轨道的下一个更高八度。

    - **低八度（One Octave Down）**：显示 MIDI 轨道的下一个更低八度。


    ## 3.7 录音


    Audacity 允许从不同的来源进行录音，这些来源又取决于您计算机的设备。例如，如果您拥有一个与计算机声卡兼容端口的麦克风，就可以用它进行录音。


    为此，在电平控制器的下拉菜单中选择 *麦克风*（*Microphone*）选项。


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_77_0.png)


    根据声卡和使用的声音系统，下拉菜单可能包含比图中显示的更多的选项。


    在上面显示的三个选项的情况下，如果您想录制另一个程序的输出，请选择 *立体声混音*（*Stereomix*）；对于连接的设备如唱片机、磁带录音机或迷你碟播放机，请选择
    *线路输入*（*Line-In*）；对于直接连接到声卡的麦克风录音，请选择 *麦克风*（*Microphone*）。


    通过两个滑动控制器，您可以设置录音源的 *输出音量*（*Output Volume*）和 *输入音量*（*Input Volume*）。这两个值可以分别设置。


    ## 3.8 使用快捷键


    如果您经常使用该程序，应该学习不同的快捷键，这样您可以更快地工作。您可以在菜单命令后面看到快捷键，也可以在 *首选项*（*Preferences*）中查看（菜单命令
    *编辑 > 首选项*（*Edit> Preferences*）或快捷键 *Ctrl + P*），您也可以在那里进行个性化定制和扩展。为了让您更好地概览，这里按功能的字母顺序显示命令：


    | 按键或快捷键 | 功能 |

