    \ *修复* **效果。**\n\n现在，对标记的区域应用 *修复* 功能。\n\n**修复后的区域。**\n\n## 5 效果\n\n根据你所使用的操作系统，在安装完成后会有多种效果可供使用。这主要是因为某些效果仅为特定操作系统开发。本章将介绍内置效果，最后还将描述如何安装更多可选效果。\n\
    \n### 5.1 效果的应用\n\n对于那些尚未从事音频编辑太久的人来说，应用效果可能会很快变得令人沮丧，因为往往无法精确达到预期的效果。以下介绍的操作模式可以改善这种情况，因为将效果隔离然后可控地混合进去是很有用的。\n\
    \n以下将展示如何系统地混合 *BassBoost* 效果。为简化操作并获得更好的概览，本示例中将使用单声道轨道。不过，该步骤也可以轻松应用于立体声轨道。\n\
