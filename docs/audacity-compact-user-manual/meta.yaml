    **Troubleshooting via the menu command** *View> Show Clipping***.**


    The clipping is shown explicitly via a vertical red line.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_86_0.png)


    # **Enlarged, two clippings are visible.**


    The area of the fault position should now be marked and enlarged accordingly in
    the view via the button *Fit selection* ⌖ . First, you should zoom in further
    to see the individual samples, and then mark the faulty area for the function
    *Repair*.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_86_1.png)


    # **Now, the effect** *Repair* **can be applied.**


