- md: ' | Key or shortcut | Function |

    |---|---|

    | Ctrl + 1 | Zoom In |

    | Ctrl + 2 | Zoom Normal |

    | Ctrl + 3 | Zoom Out |

    | Ctrl + E | Zoom to Selection |


    By default, the function keys *F1* to *F6* are assigned for the Audacity tools
    of the corresponding toolbar:


    | Function key | Assignment |

    |---|---|

    | F1 | Selection Tool |

    | F2 | Envelope Tool |

    | F3 | Draw Tool |

    | F4 | Zoom Tool |

    | F5 | Time Shift Tool |

    | F6 | Multi Tool |


    For the selection of a tool, you can additionally use – as noted in the table
    above – the key *D* for the selection of the next tool and the key *A* for the
    selection of the previous tool.


    ## 4 Examples of use


    In this chapter, some examples of use are presented, which shall help you to become
    more familiar with the function of the programme.


    ### 4.1 Cut audio tracks via labels


    Audacity enables you to cut audio tracks with the aid of the set labels. As shown
    in chapter 3.6.2, Label track, labels can be set and deleted in completely different
    ways. Amongst others, you can also set labels while listening to an audio track.
    For this, you can use the shortcut *Ctrl* + *M*. This procedure is useful, for
    example, to separate the questions and answers in an interview.


    The following example shows, how you can cut an audio track via labels into separate
    sequences. For this, do as follows:


    - First, import the required audio file via the menu command *File> Open* respectively
    *File> Import*, or record a new file.

    - Play the audio track and set the labels while listening to the audio track via
    the shortcut *Ctrl* + *M*.


    Audio track with labels.


    - Open the window *Export Multiple* via the menu command *File> Export Multiple*
    and configure the storage of the individual parts here. The files are now created
    according to the specifications.


    **The window *Export Multiple*.**


    You have the following options for the settings in the window *Export Multiple*:


    - **Export format**: Via this pull-down menu you set the format, in which the
    single files are exported. You can select between WAV, AIFF, MP3, MP2, FLAC, OGG
    and other uncompressed file formats, if you have installed an MP3 encoder. If
    you, for example, want to create an audio CD, you should first select the option
    *WAV, AIFF and other uncompressed* types as export format and then set the format
    WAV via the button Options.

    - **Options**: Opens the corresponding window to the preset export format, where
    you can set the quality. For the export format MP3, for example, the window *Specify
    MP3 Options* opens, where you can first set the *Bit Rate Mode*. Here you can
    select between *Preset* (given variable and fixed quality levels of the data transfer
    rate), *Variable* (preset frequency range), *Average* (average transfer) and *Constant*
    (fixed transfer rate). In the pull-down menu *Quality* you specify the desired
    quality level. The pull-down menu *Variable Speed* is only activated for the bit
    rate modes *Preset* and *Variable* and makes it possible to choose between *Fast*
    and *Standard*. You can select between the options *Joint Stereo* (here an algorithm
    is applied, with the aid of which a higher quality can be generated at a constant
    data rate) and *Stereo* as *Channel Mode*.


    > Set the MP3 quality.


    - **Export location**: Select here, where the files shall be saved. Via the button
    *Choose*, you open a window of your file manager, where you can select a folder,
    and via the button *Create* you can generate a new folder.

    - **Split files based on**: Choose between *Labels* and *Tracks*. The selection
    *Labels* also has the suboption *Include audio before first label*, which causes,
    that the first file contains the audio files from the beginning to the first label.
    By default, the track name is used in the box *First file name*, but it can be
    adjusted user-defined. The option *Tracks* is only activated, if there really
    are several tracks.

    - **Name files**: Here you set the names for the individual files. The option
    *Using Label/Track Name* adopts the names of the labels as file names, while the
    option *Numbering consecutively* numbers the files consecutively, starting with
    1. The box *File name prefix* can be changed as desired and correspondingly appears
    in the file name before the respective name of the label or the numbering respectively.

    - **Overwrite existing files**: This option overwrites already existing files
    with the same name without asking again.


    ### 4.2 Removing background noises


    Smaller disturbances can be eliminated with this tool. However, this effect can
    only process very small areas of a maximum of 128 samples. If you have marked
    a bigger area, this will be pointed out to you.


    It is often difficult at first, to exactly locate a disturbance. A good utility
    tool is the button *Fit selection*, which fits the marked area of the audio track
    into the Audacity window. This way, you can approach the required spot continuously.


    If it is a matter of clipping, the menu command *View> Show Clipping* also helps
    here. In the following example, the fault position was found this way.


    **Troubleshooting via the menu command** *View> Show Clipping*.


    The clipping is shown explicitly via a vertical red line.


    **Enlarged, two clippings are visible.**


    The area of the fault position should now be marked and enlarged accordingly in
    the view via the button *Fit selection* . First, you should zoom in further to
    see the individual samples, and then mark the faulty area for the function *Repair*.


    **Now, the effect** *Repair* **can be applied.**


    Now, apply the function *Repair* on the marked area.


    **The repaired area.**


    ## 5 Effects


    Depending on the operating system you work with, a number of effects are available
    to you after the setup. This is, amongst others, due to the fact that some effects
    have only been developed for certain operating systems. The built-in effects will
    be surveyed in this chapter and, concludingly, the installation of further optional
    effects will be described.


    ### 5.1 Appliance of effects


    For those, who have not been working with audio editing for too long yet, applying
    effects can quickly become frustrating, because often the desired effect cannot
    be achieved exactly. Here the mode of operation, which will be described in the
    following, can put things right, since it is useful to isolate an effect and then
    mix it in controlledly.


    In the following, it will be shown, how you have to proceed to mix in the effect
    *BassBoost* systematically. To simplify matters and for a better overview, we
    will work with a mono track in this example. The procedure, however, can also
    be adapted to stereo tracks without difficulty.


    First of all, start Audacity.


    - Open an audio track via the menu command *File > Import > Audio*.

    - Mark the whole audio track by clicking on an empty spot in the header of the
    track. The track will now be displayed slightly darker.

    - Duplicate the track via the menu command *Edit > Duplicate* or respectively
    via the shortcut *Ctrl + D*. You should now see two identical audio tracks.

    - Mark the lower audio track and execute the effect *Reverse*. This effect reverses
    the polarity of the chosen audio material.

    - Make another copy of the original track by marking it and using the menu command
    *Edit > Duplicate* or via the shortcut *Ctrl + D*. You should now see the original
    track, the reversed track and the copy of the original track.

    - Now apply the desired effect on the copy of the original. In this example, we
    use the bass boost of 4 dB at 200 Hz.

    - Now mark the copy of the original track, which has been processed with the effect,
    and the reversed track by clicking into the respective headers of the track while
    holding down the shift button. Create a new track out of both of them via the
    menu command *Tracks > Mix and Render*.

    - Now play both of the tracks together and adjust the proportion between original
    track and effect via the output level meter of both of the audio tracks.

    - When you found the right mixing proportion, mark both tracks (*Ctrl + A* or
    hold *Shift + mouse click* in the header of the track) and select the menu command
    *Tracks > Mix and Render*.


    This approach to isolate effects and mix them in systematically offers several
    new and fascinating possibilities. For instance, you can apply effects on already
    isolated effects or create as many effects as you want to, compatible to the runtime,
    to mix them in precisely, e. g. via the envelope tool.


    However, pay attention to the fact that simultaneous overlapping of many effects
    can cause an amplification of the audio signals, which can quickly lead to clipping,
    meaning overload. Therefore, you should preferably activate the menu command *View
    > Show Clipping*. Clippings will then be shown as red vertical lines in the audio
    track. You can avoid clippings by reducing the volume of all tracks.


    ### 5.2 Standard effects


    Here, those effects shall be examined closer, which are, by default, included
    in Audacity. Many effects offer the possibility of previewing, the duration of
    which you can set individually. For this, open the window *Audacity Preferences*
    via the menu command *Edit > Preferences* and set the length of the feature there
    within *Effects Preview*.'
