    |---|---|---|

    | ↻ | Redo | This feature restores an undone operation. |

    | 🔍+ | Zoom in | This feature magnifies the displayed audio track. This operation
    can be repeated, until, for example, the single samples are clearly visible and
    can be edited with the drawing tool. |

    | 🔍- | Zoom out | Causes the opposite of the feature Zoom in and demagnifies the
    view. |

    | ⊕ | Fit selection | Fits the display of a marked area to the Audacity window.
    Depending on the current perspective, it will be zoomed in or out. |

    | ⤢ | Fit project | Fits the whole project into the window. Depending on the current
    perspective, it will respectively be zoomed in or out. This feature is especially
    useful to give you a quick overview over the project as a whole. |


    To the right of the edit toolbar, there is the *transcription toolbar*, which
    offers the option to play audio data faster or slower.


    > Transcription toolbar with input window.


    Besides the slider, which you can drag by holding down a mouse button via the
    mouse pointer, you also have the option to open the input window *Playback Speed*
    by double clicking on the scale and to enter a value directly.


    To play the current project faster or slower, set the slider first to the desired
    speed. The factor 1.0 hereby stands for the original speed. The factor 0.5 stands
    for a speed reduced by 50 %, the factor 1.5 respectively for a speed raised by
    50 %. Then click on the button with the green arrow on the *transcription toolbar*
    to play the current selection with the chosen speed.


    ## 2.2 Selection toolbar


    Finally, there is the *selection toolbar* below the project window. The *selection
    toolbar* allows the setting of the project rate on the left side.


    If the feature *Snap to* is activated, it only allows selections in the chosen
    unit. If, for example, the format *hours:minutes:seconds* was chosen, selections
    may only start and end at integer seconds. A format for video films, such as *hh:mm:ss
    + PAL frames* (25 *fps*), has the advantage, that the sound editing exactly matches
    the screen change, so that frame accurate editing is possible. This avoids, furthermore,
    needless clicking and other disturbances in the audio track, which can occur otherwise.


    The format is changed for all three display ranges at a time, no matter in which
    pull-down menu the change has been set. You can choose between *End* and *Length*
    as an indication in the second display, while the third display (*Audio Position*)
    shows the current cursor position or allows its setting.


    > *The selection toolbar.*


    To work completely accurately, you can also edit the values directly in the *selection
    toolbar*. For this purpose, you click directly on the respective display with
    the mouse pointer and enter the desired value.


    Small arrows indicate if parts of the audio track are moved to the negative time
    range.


    **The arrows show, that the beginning of the audio track is in the negative time
    range.**


    The following table explains the different time formats:


    | Format | Explanation |

    | --- | --- |

    | Seconds | Counts full seconds in a six-figure display. Example: 000.047 seconds.
    |

    | hh:mm:ss | Here, *h* stands for hours, *m* for minutes and *s* for seconds.
    Example: 02 h 16 m 34 s for 2 hours 16 minutes and 34 seconds. |

    | dd:hh:mm:ss | For extremely long recordings, this format additionally shows
    *d* for days. This means, that the display changes after 00 days 23 h 59 m 59
    s to 01 days 00 h 00 m 00 s. |

    | hh:mm:ss milliseconds | This format shows in addition to hours, minutes and
    seconds also milliseconds. Example: 02 h 16 m 34.986 s. |

    | hh:mm:ss + samples | This format divides the seconds into the respective samples.
    To reach CD quality, this means that every second contains 44,100 samples. |

    | samples | Counts samples in a nine-figure display. |

