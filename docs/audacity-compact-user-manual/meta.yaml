    ## Foreword


    Dear reader,


    In Taylor Hackford''s brilliant movie "Ray", which is about the life of the musician
    Ray Charles, the protagonist, who had just become famous, is led through the newly
    built up recording studios of his record label in the middle of the 60s of the
    past century. A representative of the label shows him the – for the time period
    – excellent equipment and comments: "Totally state-of-the-art. Tom Dowd built
    an eight-track mixing console ...". When I saw the movie at the theatre in 2005,
    this scene amused several visitors, which proves the enormous technical progress
    of recording engineering in the past 50 years.


    Nowadays, we are able to produce recordings of music and language in excellent
    quality, record them on compact disc or share them online with very little financial
    and technical effort. Not only can users make their own recordings via microphone,
    but they can also use existing material – thus, a song from the internet turns
    into a ring tone on one''s own mobile phone, a symphony by Mozart is embedded
    into one''s podcast and the song of the favourite artist becomes a karaoke version
    for the next birthday party. A whole generation of the Internet, the Web 2.0,
    lives solely on the contents of users and their creativity, thereby generating
    a culture of creating and re-creating, "a ''cut and paste'' culture enabled by
    technology", which releases unexpected resources of creativity, as Lawrence Lessig,
    American professor of law, describes in his book "Free Culture: The Nature and
    Future of Creativity".


    Part of this culture of creativity is the digital audio editor Audacity. This
    programme, which is published as so-called open source software on SourceForge.net
    and licensed under the GNU GPL, not only allows users the free use and transfer
    of the application, but also the inspection of its source code and hence the possibility
    to upgrade and adjust the tool oneself. Developed by the original author of the
    software, Dominic Mazzoni, merely for process analysis as part of a project at
    the Carnegie Mellon University, the programme has soon become an editor to be
    reckoned with for audio data of every kind since its introduction in 1999. The
    software is available for the operating systems Windows as well as Linux and Mac
    OS.'
