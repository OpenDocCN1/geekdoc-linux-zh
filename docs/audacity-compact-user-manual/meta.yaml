    MIDI 数据确实可以导入并显示在 Audacity 中，但无法编辑、回放或保存。不过，这些功能已计划在未来的版本中实现。


    ## 2 程序设置


    启动 Audacity 1.3.6 程序后，您将在显示器上看到大致如下的界面。根据操作系统的不同，界面在图形上可能略有差异，因为由于不同的前提条件，各版本无法完全相同。


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_28_0.png)


    > 首次启动后的程序界面。


    默认情况下，Audacity 以一个空的项目窗口打开，其界面从上到下依次呈现如下：


    标题栏下方是菜单栏，包含*文件（File）*、*编辑（Edit）*、*视图（View）*等项目。其下是各种工具栏。最后，您可以在空项目窗口上方的区域看到一条时间轴。在空项目窗口下方，是时间和项目采样率栏以及状态栏，后者显示当前使用的频率。


    ### 2.1 各种工具栏


    *控制工具栏（control toolbar）* 中的符号对大多数人来说应该很熟悉，它们与其他音频设备上的类似。


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_29_0.png)


    不过，其中一些按钮在与 SHIFT 键（即用于输入大写字母的键）配合使用时具有扩展功能。


    | 符号 | 名称 | 功能 |

    |--------|------|----------|

    | ⏸ | 暂停 | 暂停当前录音或播放。要恢复，请再次按下*暂停（Pause）*。 |

    | ▶（循环播放） | 播放 / 循环播放 | 从选择光标的当前位置或所选部分的开头开始播放。如果在按下*播放（Play）*的同时按住 *SHIFT*，按钮的图标及其功能将会改变。音轨或音轨的所选部分将会反复播放（循环播放），直到您按下*停止（Stop）*。
    |

    | [停止图标] | 停止 | 按下此按钮，您将停止当前录音或播放。如果已激活暂停，前述操作和暂停都将立即停止。 |

    | [跳至开头图标] | 跳至开头 | 将光标移动到项目的开头（时间位置 0）。按住 *SHIFT* 将从当前位置到项目起点标记音轨部分。 |

    | [跳至结尾图标] | 跳至结尾 | 将光标移动到项目的末尾。按住 *SHIFT* 将从当前位置到项目末尾标记音轨部分。 |

    | [录音图标] | 录音 | 按下*录音（Record）*按钮后，将创建新音轨。录音从当前光标位置开始，以设定的录音采样率进行，可以通过按*暂停（Pause）*暂停，通过按*停止（Stop）*结束。
    |


    *工具工具栏（tools toolbar）*看起来相当不起眼，但对于通过鼠标进行操作也很重要，下文将对其进行介绍。


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_30_0.png)


    # Audacity 工具工具栏。


    各个工具也可以通过键盘方便地选择，因为它们通常从左上方到右下方分别对应功能键 *F1* 到 *F6*。


    | 符号 | 名称 | 功能 |

    |--------|------|----------|

    | I | 选择工具 | 激活此工具后，您可以通过鼠标点击定义音轨中的光标位置，或通过按住鼠标按钮标记某个区域。 |

    | ✁ | 包络工具 | 使用此工具，您可以更改所选区域的音量。例如，这对于手动淡入淡出音轨很有用。 |

    | ✏ | 绘制工具 | 首先放大音频轨道，直到您可以看到作为点的各个样本。按住鼠标按钮，您可以重新绘制这些样本。例如，这对于手动去除短促的背景噪音很有用。
    |

    | 🔍 | 缩放工具 | 允许放大（鼠标左键）或缩小（鼠标右键或 *SHIFT* + 鼠标左键），以改变音频轨道的视角。 |

    | ↔ | 时间平移工具 | 借助此工具，您可以水平移动整个音频轨道——即在时间轴上移动。为此，您按住鼠标按钮将音频轨道拖动到所需位置。如果音频轨道的部分被移动到负时间轴，小箭头将会指示。
    |

    | ✱ | 多重工具模式 | 一种工具，根据鼠标指针的样式和应用位置组合不同的功能： |


    | 符号 | 名称 | 功能 |

    |--------|------|----------|

    | | | I   允许通过鼠标点击定位播放点，通过按住鼠标按钮进行标记。右键点击会缩小视角，而在按住鼠标右键的同时进行选择和停放，则会使标记直接适应视角。
    |

    | | | ▽ △  鼠标指针在包络边缘时呈现此样式，然后您可以通过按住鼠标按钮移动它。 |

    | | | ↔  按住 CTRL 键，您可以在时间轴上移动音频轨道。选中的区域也可以通过在开始移动的位置直接拖动来移动。 |


    在设备工具栏的右侧，您可以找到*电平表工具栏（meter toolbar）*。


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_32_0.png)


    *带有菜单的电平表工具栏。*


    菜单中的各个命令：


    - **禁用仪表（Disable Meter）**：禁用相应的仪表，显示为灰色。

    - **启用/禁用仪表（Enable/Disable Meter）**：启用或禁用输入电平表（麦克风图标）。

    - **水平立体声（Horizontal Stereo）**：标准显示，将电平表从左到右水平显示。

    - **垂直立体声（Vertical Stereo）**：将电平表从下到上垂直显示。

    - **线性（Linear）**：切换到电平表中的线性刻度（0.0 = 静音，1.0 = 最大电平表）。

    - **分贝（db）**：标准显示，对数显示电平表的刻度（0 dB = 最大电平表）。此显示范围的进一步设置可通过 *编辑（Edit）> 首选项（Preferences）>
    界面（Interface）> 最小显示范围（Display range minimum）*进行。

    - **首选项（Preferences）**：在此您可以确定每秒刷新显示的次数。可能值为 1 到 100。请注意，高刷新率需要相应更高的处理能力。


    接下来，您会在控制工具栏下方找到*混音器工具栏（mixer toolbar）*。借助它，左侧调节输出音量，右侧调节输入音量。输入源可通过右侧的下拉菜单选择。


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_34_0.png)


    您可以通过按住鼠标按钮将控制器拖动到所需位置来更改设置，或者通过在刻度上双击打开相应窗口直接输入数值。


    *编辑工具栏（edit toolbar）*提供了更多用于编辑和查看音频轨道的重要功能。


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_34_1.png)


    | 符号 | 名称 | 功能 |

    |--------|------|----------|

    | ✂ | 剪切 | 从音频轨道中剪切出所选部分。可能剩余的部分音频轨道会向左移动，并无缝连接到左侧音频轨道的剩余部分。因此，新的音频轨道恰好缩短了被移除部分的长度。此外，根据设置的不同，后续的片段也会被移动或不会移动。设置可通过
    *编辑（Edit）> 首选项（Preferences）> 界面（Interface）> 编辑片段可移动其他片段（Editing a clip can move
    other clips）*进行更改。 |

    | 📋 | 复制 | 将所选区域复制到剪贴板，原始音频轨道保持不变。复制的区域可以根据需要粘贴到其他区域任意次数。 |

    | 📋 | 粘贴 | 此功能可将剪切或复制的音频轨道区域的内容插入到光标位置。 |

    | ✂ | 修剪 | 修剪与剪切相反。修剪会删除除所选区域以外的所有内容。修剪后的区域保持其位置不变。 |

    | 🔇 | 静音 | 所选区域被静音替代。 |

    | ↩ | 撤销 | 撤销最后一次编辑操作。 |

    '
