    在数字化过程中，音频信号的振幅或音量以一定频率进行采样，并将由此计算出的数值保存下来。每秒执行的采样序列称为采样率。例如，音频 CD 的采样率为 44.1
    kHz，这意味着音频信号每秒被采样 44,100 次，并将由此计算出的数值保存下来。


    数字化模拟信号的第二个重要因素是所谓的**采样格式**或**采样范围**。它实际上设置了转换数值的刻度或栅格的大小，从而决定了可能的增量数量。前述音频 CD
    通常使用 16 位的采样范围，可以精确显示 65,536 个不同的值。


    | 采样格式或采样范围 | 可能的数值 |

    | --- | --- |

    | 4 bit (2⁴) | 16 |

    | 8 bit (2⁸) | 256 |

    | 16 bit (2¹⁶) | 65536 |

    | 24 bit (2²⁴) | 16777216 |

    | 32 bit (2³²) | 4294967296 |

    | 48 bit (2⁴⁸) | 281474976710656 |

    | 96 bit (2⁹⁶) | 79228162514264337593543950336 |


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_16_0.png)


    选择的采样率越高，一方面内存需求越大，但另一方面动态范围也越大，即最低音与最高音之间的差值。对于 16 位立体声，动态范围约为 96 dB（约每比特采样范围
    6 dB）。同时，更高的采样范围相对于原始信号可以减少量化误差。


    此外，**奈奎斯特-香农采样定理**展示了采样率与频率范围之间的直接关系，并指出采样范围必须至少是最大可显示频率的两倍：


    > $$最大可显示频率 = \frac{采样率}{2}$$


    最大可显示频率又取决于接收者，即人类可听见的频率范围。因此，CD 定义了 44.1 kHz 的采样率， resulting in a maximum frequency
    signal of 22.5 kHz，这已经超出了人类最高约 20 kHz 的感知范围。


    通过使用多个声道，还可以实现环绕声，而仅有一个声道的单声道录音则无法实现。立体声录音使用两个独立的声道，在渲染时可以分别输出到右扬声器和左扬声器。更多的声道应用还包括四声道立体声（4
    声道立体声）或杜比环绕声（使用五个扬声器的多声道声音再现）以及 5.1 音频（六个声道）。


    以普通音频 CD 为例：采样率为 44.1 kHz，采样范围为 16 位，立体声效果使用 2 个声道，其数据率计算如下：


    > $$(44.100 * 16) * 2 = 1.411.200\,bit/s$$


    因此，音频录音如果未经压缩，需要相当大的存储容量。三分钟 CD 品质的录音就已经需要约 30 MB 的磁盘空间。这相当于约 6,000 页文本的数据量，或超过
    20 张软盘的容量。就在几年前，计算机还无法处理如此大量的数据。


    ## 1.2 音频数据与压缩


    正如你在上一章看到的，保存音频文件可能非常占用内存，因此人们使用不同的方法来实现数据压缩。这既可以节省存储容量，也能使数据处理更加高效。用于压缩数字数据（如电影或文档）的算法在此过程中主要寻找重复部分，以便覆盖重复区域，从而节省磁盘空间。由于音乐中完全相同的重复很少，音频数据不容易压缩。


    因此，大多数无损压缩器使用**预测编码**，它首先预测振幅，然后保存与预测的实际差值。然而，可达到的压缩程度在很大程度上取决于各自的音频数据，平均约为原文件的
    25–70%，而有损压缩可以将数据减少到原文件的约 10%，而音质上听不出差异。


    最受欢迎的音频格式无疑是 **MP3**，它由弗劳恩霍夫研究所与 AT&T、贝尔实验室和汤姆森公司合作开发。这种格式虽然已经被 **Vorbis** 或 **AAC**
    等其他格式在质量上超越，但其原理是通过舍弃不可听或几乎不可听的频率范围、外差频率以及音量变化序列（如紧随高音量序列之后的低音），人耳无法将这些声音彼此区分，或根本无法感知。


    在使用 Audacity 时最重要的音频数据格式，在本书末尾的术语表中有更详细的讨论。


    ## 1.3 通过麦克风直接输入电脑


    编辑数字音频的第一步通常是通过麦克风录制语言、音乐和声音。直接在电脑上录制音频，你只需要 Audacity 软件、声卡和麦克风。


    在工作流程伊始犯下的错误，通常很难或无法在后期纠正。因此，录音本身和麦克风的选择至关重要。我们先从麦克风说起，如今麦克风可以分为三大类：


    - 动圈式麦克风（动圈麦克风）

    - 电容式麦克风

    - 驻极体电容式麦克风（电容式麦克风的变体）


    这些麦克风类型的共同点是，它们都通过机械振动的振膜将声波转换为电信号。动圈式麦克风通过磁场内线圈的移动进行转换，这也称为**电磁感应原理**。动圈式麦克风可以承受巨大的声压而不失真，因此非常受舞台现场演出的欢迎，也适合录制响亮的乐器，如低音鼓和小号。另一个优点是，与电容式麦克风不同，它们不需要任何电源供电。


    然而，缺点在于振膜的重量较大，这导致脉冲重现质量较低，且余振较长。这反过来又对频率响应产生负面影响，不像电容式麦克风那样大致呈线性处理，而通常在高频和低频范围内衰减。此外，动圈式麦克风本身的频率范围通常低于电容式和驻极体麦克风。


    电容式麦克风是典型的**录音室**或**演讲**麦克风。如果你想用 Audacity 进行播客录制，电容式麦克风是推荐的选择。当需要尽可能准确地录制原始声音时，几乎都会使用它们。前面提到的轻微缺点是，电容式麦克风需要电源来为振膜和前级放大器充电。这一问题通常通过使用
    9 伏电池来解决舞台麦克风的供电，而在录音室中则通过所谓的**幻象电源**供电，通常是麦克风输入端提供的 48 伏直流电压。


    驻极体电容式麦克风是电容式麦克风的一种变体，但它使用位于电容板之间的**驻极体振膜**进行传声。这种麦克风因其非常紧凑的结构和低廉的制造成本，如今最为流行，可以在许多设备中找到，如（移动）电话、对讲系统、笔记本电脑、婴儿监视器，甚至助听器。


    一个非常重要的方面是麦克风的**指向性**，它提供了关于从不同方向吸收声音效果的信息。一些现代电容式麦克风已经提供可选的可选指向性。通常可以区分四种基本特性：


    - **全向型（Omnidirectional）：** 这类麦克风从各个方向均匀地吸收声音。这种麦克风也称为无指向型，主要用于录制背景氛围或在录音室中使用。

    - **双向型（Bi-directional）：** 这种指向性的麦克风也称为**"8字形麦克风"**。它们是压差式传声器，从振膜的前方和后方吸收声音。通过结构性改变，甚至可以达到心形指向性。


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_20_0.png)


    **全向型和双向型特性。**


    - **心形指向（Cardioid）：** 这种特性的麦克风主要从它们所朝向的方向录音，而来自后方的声音几乎完全被屏蔽。此外，它们的指向性大致与人耳匹配，因此更受环境音录制的青睐。

    - **超心形指向和强指向（Supercardioid and Hypercardioid）：** 这些极性模式与普通心形指向相比，指向性明显更强，因此可以更好地抑制背景声音。因此，它们通常用于较远的声源，如电影和电视拍摄，此时麦克风必须位于画面之外。

