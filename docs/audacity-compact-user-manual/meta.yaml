  md: '# 10 Appendix


    In the following, you will find a listing of the most important online addresses
    in connection with Audacity:


    **Official Audacity homepage** -- http://audacity.sourceforge.net


    Here you find the newest programme versions as well as continuative links to additional
    effects, MP3 encoders and more.


    **English forum** -- http://audacityteam.org/forum/


    Tipps and informations about Audacity and audio editing with about 4,000 registered
    users. Here you also find a large collection of FAQs ("*Frequently asked questions*").


    **Audacity Wiki** -- http://audacityteam.org/wiki/


    Collection of English websites with tips and tricks about Audacity in particular
    and audio editing in general, which cannot only be read by the users, but also
    be revised and expanded by users online.'
