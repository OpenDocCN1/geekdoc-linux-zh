- md: ' # Adjust the latency.


    To adjust the latency, you have to enter the calculated number as a negative number
    in milliseconds into the window *Preferences*, register *Audio I/O* under *Latency
    correction*. Now you can repeat the above mentioned recording. Both of the recorded
    tracks should now be synchronous to each other.


    ## 4 Working with Audacity


    This chapter will explain the basic functions for handling this programme.


    ### 3.1 Opening and importing files


    By default, you can open different audio file formats with Audacity, like WAV,
    MP3, FLAC, AIFF, AU and Ogg Vorbis.


    To open one of the supported audio formats, do as follows:


    - Use the drag&drop-method by dragging the audio file into the programme window
    of Audacity by holding down the mouse button and dropping it there.

    - Open the window *Open* via the shortcut *Ctrl + O* and choose the file or the
    files, which you want to open.

    - Open the window *Open* via *File > Open...* and choose the file or files, which
    you want to open.


    The file is now imported and, thereafter, will be shown in standard wave form
    in the programme window.


    **The respective format is imported.**


    **Wave form – the standard display for audio files.**


    The wave form, which by default is shown linear, displays the peaks in the outer
    darker area and the root mean square (RMS) in the inner brighter area.


    **Important:** If you choose to open several files, an individual programme window
    will be created for every respective file. If you want to open several audio files
    within one programme window, however, you have to use the command *Import*. This
    way, contents like further audio files, text tracks, time tracks and MIDI-files
    can be loaded into one programme window and can be displayed there.


    For that purpose, do as follows:


    Use the menu command *File > Import* and select in the submenu the desired category
    among the presettings *Audio, Labels, MIDI* and *Raw Data*.


    Depending on the chosen category, a window with the chosen filter opens, in which
    you can select the respective file or files.


    Extremely interesting is, furthermore, the import of raw data, even for alleged
    proprietary audio files, which Audacity does not support initially. If the audio
    file internally uses uncompressed raw data in the form of PCM (Pulse Code Modulation),
    it is quite possible, that Audacity can still open the files via the import of
    raw data.


    After you have chosen the file via the menu command *File > Import > Raw Data*,
    the window *Raw Data Import* opens, where you can enter further details about
    the file. In this context, you have to enter the information, which is usually
    included into the header. In some indistinct cases, however, it only helps to
    experiment.


    **The possible settings for the import of raw data.**


    The import of raw data only works with uncompressed files. Files with the format
    ASF, AAC, MP3, WMA, WMV and so forth cannot be imported, just like locked files.


    Explanations to the various specifications:


    - **Signed/unsigned**: This specification provides information about how the data
    is saved internally. Signed 8 bit PCM uses, for example, the values -128 to 127,
    while Unsigned 8 bit PCM uses the values from 0 to 255.

    - **8, 16, 24, 32 bit**: Here you enter the type of quantization, thus, the sample
    range, with which the files have been digitized.

    - **PCM**: This abbreviation stands for Puls-Code-Modulation, a procedure which
    is often used for the conversion of analogue audio signals into digital audio
    signals. For this, the analogue signal is sampled time-discrete with a certain
    frequency, thus, in isochronous distances, and is then quantized with an analogue-digital
    converter.

    - **U-Law/A-Law**: Similar procedures for the dynamic compression of audio signals,
    where the noise is reduced for low levels Nevertheless, the procedures differ
    enough, so that a converter has to be applied for telephone calls between Europe,
    where the A-Law-Procedure is used, and Northern America, where the U-Law-Procedure
    is used.

    - **DWVW**: Short for "Delta With Variable Word Width"; a compression type for
    the AIFF-C file format.

    - **GSM**: Is a lossy standard for the compression of language. GSM stands for
    "Global Standard for Mobile telecommunications". This format is used for (mobile)
    phones, language programmes and language messages.

    - **ADPCM**: Stands for "Adaptive Differential Pulse Code Modulation" and is a
    compression method for an audio signal, which shall be transmitted via a narrowband
    digital medium. The file rate dynamically adjusts hereby to the input signal.
    This procedure is, for example, used for DECT telephony (Digital Enhanced Cordless
    Telecommunications), thus, for cordless telephones.

    - **Endianness**: Sets the order of the bytes, so that they can be interpreted
    correctly. The Big-endian format sets the byte of higher valency, which is also
    called MSB (Most Significant Byte), at first place, while the Little-endian format
    sets the Least Significant Byte (LSB) first.

    - **1 Channel ... 16 Channels**: Here, you set the number of channels.

    - **0-Byte Offset**: Here, you enter the size of the header.

    - **Amount to import**: Set the data volume, which shall be imported.

    - **Sample rate**: Here, you set the used sample rate.


    Unfortunately, the direct import of CDs does not (yet) work with Audacity. When
    attempting this, you will get a message, which refers to other programmes.


    The usability can still be improved here.


    **Hint:** If you want to use a data format, which is not supported by Audacity,
    you should try to convert it with an audio converter into a supported format.
    It is recommended to convert the data first into a lossless format, such as WAV,
    AIFF or FLAC, then to edit it with Audacity and, finally, to export the audio
    data into the desired target format.


    ## 3.2 Marking of audio tracks


    Like you may already know from text editing programmes, you have to mark the part
    of a file in Audacity first, which you want to cut out, edit or replace. For this,
    you have many various options:


    To work via mouse, the *selection tool* or the *multi-tool* has to be activated.
    Now mark the desired part of the audio file by holding down the mouse button.
    The selection will then be displayed slightly darker than the rest of the audio
    track. To expand or to reduce the marking, simply hold the shift-button, while
    selecting a new end via mouse click. If you want to mark the entire audio track,
    you can click on the attributes in the header in front of the track or on the
    free space below the controller.


    Move the cursor to the starting point by using the arrow keys and mark the desired
    area with the arrow keys right or left by holding down the shift-button. Likewise,
    to expand a marking, you can shift the respective border likewise by holding down
    the shift-button. To remove the marking, you can set the cursor with the aid of
    the right arrow key to the right ending position and with the left arrow key to
    the left ending position. You can mark the whole audio track via the shortcut
    Ctrl + A.


    If the cursor is situated at the desired position, you have the following options
    via the menu item *Edit > Select: All, None, Left at Playback Position* (opens
    the window *Set Left Selection Bound*), *Right at Playback Position* (opens the
    window *Set Right Selection Bound*), *Track Start to Cursor* and *Cursor to Track
    End*.


    The marked area of the audio track is now displayed slightly dark coloured, as
    you can see in the following example:


    **Stereo audio track with marked area.**


    If you are working with several audio tracks in one window, you can also create
    markings, which extend over several tracks.'
  mdcn: "\n # 调整延迟。\n\n要调整延迟，必须将计算得出的数值以负数形式（单位为毫秒）输入到窗口*Preferences*中，在*Audio I/O*寄存器下的*Latency\
