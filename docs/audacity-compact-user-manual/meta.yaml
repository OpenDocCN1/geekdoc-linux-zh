    ## 前言


    亲爱的读者，


    在泰勒·哈克福德（Taylor Hackford）精彩的电影《雷》（"Ray"）中，讲述了音乐家雷·查尔斯（Ray Charles）的生平。主人公刚刚成名，在上个世纪60年代中期，被领着他参观唱片公司新建成的录音棚。唱片公司的代表向他展示了当时**一流的设备**，并评论道："完全是最先进的技术。汤姆·道德（Tom
    Dowd）建造了一个八轨调音台……"2005年我在影院观看这部电影时，这个场景让许多观众会心一笑，这证明了过去50年间录音工程技术的巨大进步。


    如今，我们能够以卓越的品质制作音乐和语言的录音，将其刻录到光盘上，或者以极低的资金和技术成本在线分享。用户不仅可以通过麦克风进行自己的录音，还可以使用现有素材——于是，互联网上的歌曲变成了自己手机上的铃声，莫扎特的交响曲被嵌入到自己的播客中，喜爱歌手的歌曲则成为了下次生日派对的卡拉OK版本。整整一代互联网用户，即Web
    2.0，完全依靠用户的内容及其创意而生存，由此催生了一种创造与再创造的文化，"一种由技术赋能的**剪切粘贴**文化"，释放出了意想不到的创造力资源，正如美国法学教授劳伦斯·莱西格（Lawrence
    Lessig）在其著作《自由文化：创造力的本质与未来》（*"Free Culture: The Nature and Future of Creativity"*）中所描述的那样。


    数字音频编辑器Audacity正是这种创意文化的一部分。该程序以所谓的开源软件形式发布在SourceForge.net上，并以GNU GPL许可证授权，不仅允许用户免费使用和传播该应用程序，还可以查看其源代码，从而能够自行升级和调整该工具。该软件最初由原作者多米尼克·马佐尼（Dominic
    Mazzoni）仅为卡内基梅隆大学某项目中的过程分析而开发，自1999年发布以来，很快成为了各类音频数据处理中不可忽视的编辑器。该软件适用于Windows、Linux和Mac
    OS操作系统。

    '
