  md: '# Foreword


    Dear reader,


    In Taylor Hackford''s brilliant movie "Ray", which is about the life of the musician
    Ray Charles, the protagonist, who had just become famous, is led through the newly
    built up recording studios of his record label in the middle of the 60s of the
    past century. A representative of the label shows him the – for the time period
    – excellent equipment and comments: "Totally state-of-the-art. Tom Dowd built
    an eight-track mixing console ...". When I saw the movie at the theatre in 2005,
    this scene amused several visitors, which proves the enormous technical progress
    of recording engineering in the past 50 years.


    Nowadays, we are able to produce recordings of music and language in excellent
    quality, record them on compact disc or share them online with very little financial
    and technical effort. Not only can users make their own recordings via microphone,
    but they can also use existing material – thus, a song from the internet turns
    into a ring tone on one''s own mobile phone, a symphony by Mozart is embedded
    into one''s podcast and the song of the favourite artist becomes a karaoke version
    for the next birthday party. A whole generation of the Internet, the Web 2.0,
    lives solely on the contents of users and their creativity, thereby generating
    a culture of creating and re-creating, "a ''cut and paste'' culture enabled by
    technology", which releases unexpected resources of creativity, as Lawrence Lessing,
    American professor of law, describes in his book "Free Culture: The Nature and
    Future of Creativity".


    Part of this culture of creativity is the digital audio editor Audacity. This
    programme, which is published as so-called open source software on SourceForge.net
    and licensed under the GNU GPL, not only allows users the free use and transfer
    of the application, but also the inspection of its source code and hence the possibility
    to upgrade and adjust the tool oneself. Developed by the original author of the
    software, Dominic Mazzoni, merely for process analysis as part of a project at
    the Carnegie Mellon University, the programme has soon become an editor to be
    reckoned with for audio data of every kind since its introduction in 1999. The
    software is available for the operating systems Windows as well as Linux and Mac
    OS.'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'By now, Audacity has evolved from an insider tip to the probably best known
    software of its kind. Ever since the release of the first version of Audacity,
    the programme has been downloaded over 40 million times just from the official
    homepage alone. Furthermore, the software is available on countless download sites
    on the Internet and is enclosed on booklet-CDs in computer magazines all over
    the world. A google-search for "audio editor" leads directly to Audacity''s homepage.
    Although Audacity in the meantime is not the only free programme for editing of
    audio data anymore, many users, who for example appreciate the easy and intuitional
    operatability, favour it to other similar applications. Despite its popularity,
    Audacity is still developed further by volunteers in their spare time. I myself
    have been part of this pleasant team of dedicated software developers from all
    over the world since 2003.


    With this book, we want to give you all the information you need to apply Audacity
    reasonably. The author, Markus Priemer, made a point of giving you both an overview
    of the handling of the programme as well as a detailed description of every function.
    Furthermore, you will find interesting background information, for example about
    microphone technologies, as well as several step-by-step tutorials.


    You are in good company, no matter if you are playing in a band and want to edit
    your recordings with Audacity, or if you use the programme as a journalist, editor
    or podcaster to edit your interviews or articles. It is clear: A free software
    does of course not replace neither singing lessons nor the studies of audio engineering,
    but Audacity is a tool, with which people can express their creativity. On this
    note, I wish you a fun time and success while reading this book.


    Yours,


    Markus Meyer


    Markus Meyer, graduated computer scientist, was born in 1979 and has been a member
    of the "Audacity Technical Leadership Council" since 2005, which is responsible
    for the further development of Audacity. He is CEO of a software engineering company
    and lives and works in Nuremberg, Germany. For further details, contact Markus
    Meyer by e-mail: *markus@audacityteam.org*.'
  merge: -1
