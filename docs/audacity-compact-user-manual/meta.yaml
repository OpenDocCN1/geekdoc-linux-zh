    \n这种隔离效果并系统混合的方法提供了许多全新而迷人的可能性。例如，你可以对已隔离的效果应用效果，或根据运行时长创建任意数量的效果，以精确混合，例如通过包络工具。\n\
    \n然而，请注意同时重叠多个效果可能会导致音频信号的放大，这可能很快导致削波，即过载。因此，建议你激活菜单命令 *视图 > 显示削波*。削波将以红色垂直线显示在音轨中。你可以通过降低所有轨道的音量来避免削波。\n\
