    At the lower end of the programme window, there is the status bar, which gives
    you various useful tips, such as "Click and pull to shift the left selection margin".


    The individual areas and toolbars can be moved almost entirely user-defined. The
    serrated left edges are the respective parting lines. To move a unit, run the
    mouse pointer on the serrated left edges and move the unit to the new position
    by holding down the mouse button. If you want to restore the original arrangement,
    choose *View> Toolbars> Reset Toolbars*.


    ## 2.3 Computer latency


    Every computer has a certain amount of latency, thus, a certain delay. Even if
    it is just a matter of a few milliseconds, the processing of a signal also requires
    a certain time for its way, e. g. to the sound card and from there to the speakers.
    If the latencies are, however, too great, certain works cannot be carried out
    reasonably anymore.


    ## 2.4 Calculating the computer latency


    An optimal setting of the latency is necessary, if you, for example, want to record
    and play an audio track simultaneously.


    In the following, we will try to find the optimal settings for the latency of
    your computer. Pay attention to the fact, that the preference *Multiplay* has
    to be activated in the register *Audio I/O*, and make sure to choose the right
    recording device (e. g. *Microsoft Soundmapper*) or use, for example, a wire between
    line-in and line-out to be able to play and record an audio track at the same
    time. Then execute the following steps:


    - First, set the display in the selection toolbar so that it shows milliseconds.

    - Now choose *Generate> Click Track*, which opens the corresponding window, and
    create a metronome-like click track. For this purpose you can keep the given settings
    and just accept by clicking *OK*.

    - Now click on the record button and record the click track while playing.

    - Stop the operation after a few measures via the stop-button.


    Depending on the quality of the sound card, the audio signal is recorded more
    or less clearly. The rendered audio signal is recorded slightly out of phase in
    a second audio track. In the following example, the signal first had to be amplified
    to measure the latency.


    **High noise component and a latency of 0.072 seconds.**


    To measure the latency, mark the beginning of the signal on the click track to
    the beginning of the same signal on the recorded track. Now you can read the latency
    of your computer in the selection toolbar.


    The above example used a standard installed sound card with a latency of 72 milliseconds.'
