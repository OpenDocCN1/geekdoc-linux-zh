- md: ' During digitising, the amplitude or respectively the volume of the audio signal
    is sampled with a certain frequency and the thereby calculated values are saved.
    The sampling sequences, which are executed every second, are called sampling rate.
    Audio CDs, for example, have a sampling rate of 44.1 kHz, which means, that the
    audio signal is sampled 44,100 times per second and the thereby calculated values
    are saved.


    The second important factor for digitising analogue signals is the so-called sample
    format or sample range. It practically sets up the size of the scale or raster,
    in which the conversion of the numerical values takes place, and, thus, determines
    the number of possible increments. The beforementioned audio CD usually uses a
    sample range of 16 bits, with which exactly 65,536 different values can be displayed.


    | Sample Format or Sample Range | Possible Values |

    | --- | --- |

    | 4 bit (2⁴) | 16 |

    | 8 bit (2⁸) | 256 |

    | 16 bit (2¹⁶) | 65536 |

    | 24 bit (2²⁴) | 16777216 |

    | 32 bit (2³²) | 4294967296 |

    | 48 bit (2⁴⁸) | 281474976710656 |

    | 96 bit (2⁹⁶) | 79228162514264337593543950336 |


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_16_0.png)


    The higher the chosen sample rate, the bigger on the one hand the memory requirements,
    but on the other hand also the dynamic range, that is the difference between the
    lowest and loudest sound. For 16 bit stereo, the dynamic range is, for example,
    about 96 db (approximately 6 db per bit sample range). At the same time, a higher
    sample range reduces the quantisation error in relation to the original signal.


    The Nyquist-Shannon sampling theorem shows, moreover, the direct correlation between
    sample rate and frequency range, and states, that the sample range must be at
    least twice as high as the maximum displayable frequency:


    > $$Maximum\,displayable\,Frequency = \frac{Sample\,Rate}{2}$$


    The maximum displayable frequency, in turn, is geared to the recipient, that is
    to the frequency range audible for humans. Therefore, a sampling rate of 44.1
    kHz has been defined for CDs, resulting in a maximum frequency signal of 22.5
    kHz, which already is beyond the human perception of maximal 20 kHz.


    By using several channels, it is, moreover, possible to produce surround sound,
    which is not possible for mono recordings with only one channel. Stereo recordings
    use two separated channels, which can be output to a right and left speaker during
    rendering. Even more channels are used, for example, on quadraphonics (4-channel
    stereophony) or Dolby surround (multi-channel sound reproduction with five speakers)
    and 5.1-audio with six channels.


    If we take, for example, a regular audio CD: At a sample rate of 44.1 kHz and
    a sample range of 16 bit as well as 2 channels for stereo effect, the data rate
    is calculated as follows:


    > $$(44.100 * 16) * 2 = 1.411.200\,bit/s$$


    Thus, audio recording, if uncompressed, needs quite a lot of memory capacity.
    A recording of three minutes in CD-quality already needs about 30 MB disc space.
    This equates, for example, to an amount of data of about 6,000 pages of text or
    to the capacity of more than 20 floppy disks. Just a few years ago, computers
    were simply overextended by these amounts of data.


    ## 1.2 Audio data and compression


    As you could see in the last chapter, it can be extremely memory intensive to
    save audio files, which is why different methods are used in order to achieve
    a compression of the data. This saves memory capacity, but also makes it possible
    to work more efficiently with the data. Algorithms for the compression of digital
    data, such as movies or documents, search during this process mostly for repetitions
    in order to overwrite the area of repetition, subsequently saving disc space.
    Since identical repetitions in music are rare, audio data does not lend itself
    easily to compression.


    Most of the lossless compressors, therefore, use predictive encoding, which first
    makes a prognosis of the amplitude and afterwards saves the actual difference
    to the prognosis. The attainable compression, nevertheless, is strongly dependent
    on the respective audio data and averages at about 25–70 % of the original, while
    the lossy compression reaches a reduction of the data to about 10 % of the original
    without audible differences in quality.


    The most popular audio format definitely is MP3, which was developed by the Fraunhofer
    Institute in collaboration with the companies AT&T, Bell Labs and Thomson. This
    procedure, which in the meantime has qualitatively been outrun by other formats
    like Vorbis or AAC, uses data reduction by leaving out not or hardly audible frequency
    ranges as well as heterodyne frequencies or sequences with changes in volume (such
    as low sounds, which directly follow sequences of very high volume), which the
    human sense of hearing cannot separate from each other or respectively cannot
    perceive.


    The most important audio data formats for working with Audacity are discussed
    in more detail in the glossary at the end of the book.


    ## 1.3 Via microphone directly onto the computer


    The first step of editing digital audio is usually the recording of language,
    music and sounds via microphone. All you need for direct recording of audios onto
    your computer is the programme Audacity, a sound card and a microphone.


    Mistakes, which are made here at the beginning of the working process, are typically
    hard or impossible to correct later on. The recording itself and the selection
    of the microphone are, therefore, of crucial importance. Let us begin with the
    microphones, which can today be classified into three main categories:


    - Dynamic microphones (moving coil microphones)

    - Condenser microphones

    - Electret condenser microphones (variant of the condenser microphone)


    These microphone types have in common, that they convert sound waves via a mechanically
    oscillating membrane into an electrical signal. Dynamic microphones convert via
    the movement of an induction coil within a magnetic field. This is also called
    induction principle. Dynamic microphones can bear enormous acoustic pressure without
    distorting and are, therefore, very popular for live on-stage use and for recording
    loud instruments, such as bass drums and trumpets. Another advantage is the fact,
    that they – in contrast to condenser microphones – do not need any electric power
    supply.


    A disadvantage, however, is the higher weight of the membrane, which leads to
    an impulse repeating of lower quality and a longer post-pulse oscillation. This
    in turn has a negative effect on the frequency response, which does not process
    more or less in-line, as it does with condenser microphones, but usually declines
    in the lower and upper frequency spectrum. Additionally, the frequency spectrum
    of dynamic microphones themselves is generally lower than that of condenser and
    electret microphones.


    Condenser microphones are typical studio or respectively speaker microphones.
    If you want to use Audacity, for example, for podcasting, a condenser microphone
    is recommendable. They are virtually always used, when a recording as accurate
    as possible of the original sound is desired. A slight disadvantage is, as previously
    mentioned, that the condenser microphone needs supply voltage to load the membrane
    and the preamplifier. This problem is often solved by using 9-volt batteries for
    on-stage microphones, while it is energised in studios via so-called phantom power,
    usually a 48-volt direct current voltage, provided by microphone inputs.


    Electret condenser microphones are a variant of the condenser microphone, but
    they use an electret membrane, which is located between the condenser plates,
    for sound propagation. This type of microphone is nowadays the most popular one,
    because of the very compact construction and the low cost manufacturing, and it
    can be found in many devices, such as (mobile) phones, interphone systems, laptops,
    baby monitors or even hearing aids.


    One really important aspect is the directional characteristic of a microphone,
    which provides information about how well the sound can be absorbed from different
    directions. Some modern condenser microphones already provide a selectable directional
    characteristic as optional equipment. Four basic characteristics can generally
    be distinguished:


    - **Omnidirectional:** These microphones absorb sound from all directions equally
    well. This type of microphone is also called nondirectional and is mainly used
    for the recording of background atmosphere or in studios.

    - **Bi-directional:** Microphones of this directional are also called "figure
    8 microphones". They are pressure gradient receivers, which absorb sound from
    both the front and the back of the membrane. Through constructive changes, even
    cardioid characteristics can be reached.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_20_0.png)


    **Omnidirectional and bi-directional characteristics.**


    - **Cardioid:** Microphones of this characteristic mainly record from the direction,
    in which they are held, while sound from the back is practically completely shielded.
    Moreover, their directionality matches approximately the human ear, which is why
    they are preferred for recording of ambient sounds.

    - **Supercardioid and Hypercardioid:** These polar patterns are – in comparison
    with normal cardioids – significantly more directed and can, therefore, suppress
    background sounds significantly better. Hence, they are usually used for more
    distant acoustic sources, such as movie and television shots, where the microphone
    has to be outside of the display window.'
