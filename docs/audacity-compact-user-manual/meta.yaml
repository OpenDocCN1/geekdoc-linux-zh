  md: '# 3.5.1 Cut preview


    If you have placed a marking for a cut, you can listen to the result beforehand
    and, if necessary, make changes, before you finalise the cut. This feature is
    called *Cut Preview*, which you activate as follows: Select the key C on your
    keyboard.


    By default, you will now hear from one second before the cutting edge to one second
    after the cutting edge, which enables you to estimate what the cut will be like.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_63_0.png)


    The horizontal as well as in the middle discontinued line above the audio track
    shall hereby display the playback region of the feature *Cut Preview* in the standard
    settings.


    The length of the preview can be set individually in the window *Audacity Preferences*,
    which can be opened via the menu *Edit> Preferences* or the shortcut *Ctrl + P*,
    in the register *Audio I/O* at *Cut Preview*.'
  merge: -1
