- md: ' ## 3.5.2 Variable playback regions


    When you have marked a region, you can start and stop the replay of the marked
    area by pushing the space bar. By pushing the key C you can preview the possible
    cut. If you just want to listen to a certain part of the cut again, the key B
    enables you to play – depending on the position of the mouse pointer – different
    parts within and outside of the marking.


    If the mouse pointer is to the left of the marking, the track is played from there
    to the beginning of the marking via the key B.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_64_0.png)


    > **Replay from the mouse pointer to the marking.**


    If the mouse pointer is, however, in the left half of the marking, the audio track
    is played from the marking to the mouse pointer via the key B.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_64_1.png)


    > **Replay from the marking to the mouse pointer.**


    If the mouse pointer is in the right half of the marking, the key B achieves the
    replay from this point to the end of the marking.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_65_0.png)


    **Replay from the mouse pointer to the marking.**


    If the mouse pointer is to the right of the marking, the key *B* causes the replay
    of the audio track from the right end of the marking to the position of the mouse
    pointer.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_65_1.png)


    **Replay from the marking to the mouse pointer.**


    It applies to all examples of the key *B,* that only the horizontal, but not the
    vertical position of the mouse pointer is relevant.


    Finally, there is the possibility to listen to a certain region directly. For
    this, mark an area on the timeline above the audio track, by holding down a mouse
    button, which shall then be replayed immediately.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_65_2.png)


    **Markings on the timeline are replayed immediately.**


    ### 3.5.3 Finding zero crossings


    A zero crossing is the position of a wave, where the x-axis crosses, thus, where
    it changes from the negative to the positive region or vice versa.


    In order to set a interference-free cut, you should cut the track at such a zero
    crossing. A precondition therefor is, that a sample has to lie as exactly as possible
    on the zero line. Audacity possesses an excellent method to find respective zero
    crossings via the menu command *Edit > Find Zero Crossings*. This is especially
    helpful for stereo tracks, since it can be very difficult to find a suitable point
    there, where both channels are on a zero crossing at the same time.


    Do as follows to set the cuts at a zero crossing:


    - Set the marking for the cut.

    - Select the menu command *Edit > Find Zero Crossings* or use the key *Z* respectively.
    Audacity will now set the cutting edges automatically.

    - Make the cut.


    If Audacity cannot find a suitable position for the cut via the menu command *Edit
    > Find Zero Crossings*, the programme will delete the marking and jump to the
    next zero crossing. In this case, you can help yourself by using an extremely
    brief fade-in or fade-out at the desired cutting edges.


    For this, the length of a few samples is enough, which are simply aimed at shaping
    the wave form in a way that creates the necessary zero crossing.


    ## 3.6 The different tracks


    Audacity does not only know different audio tracks, but also label, time and MIDI
    tracks.


    You can add new tracks by selecting the menu command *Tracks > Add New* and by
    choosing the respective track in the submenu.


    ### 3.6.1 Audio tracks


    The most important tracks are definitely audio tracks, as they contain the audio
    data. The header of the track provides here a quick overview over the most important
    parameters of the displayed audio data and offers the possibility to change different
    settings and the display.


    Audio data appear by default in linear wave form, where the amplitude is illustrated
    graphically. The major amplitudes of the wave form represent a high volume in
    this display, while the small amplitudes illustrate muted parts. A straight line
    on the central position without any amplitude upwards or downwards correspondingly
    displays silence.


    Via the header of the track of the audio file, other kinds of display can be chosen,
    such as logarithmic waveform, spectrum or pitch (*EAC*).


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_68_0.png)


    **The header of an audio track.**


    If you click on the cross at the top left, the track will be deleted. This work
    step can, however, also be undone via the button *Undo*.


    Clicking on the track name respectively the downwards pointing arrow, opens the
    context menu, which is displayed above on the right and which offers the following
    features and commands:


    - **Name**: Opens the window *Track Name*, where you can enter the title.

    - **Move Track Up**: Shifts the track upwards by one position. This command is
    only activated, if another track above the current one is available.

    - **Move Track Down**: Shifts the track downwards by one position. This command
    is only activated, if another track below the current one is available.

    - **Waveform**: Standard display when loading an audio file, which offers a linear
    display.

    - **Waveform (dB)**: Shows the waveform of the audio file in a logarithmic display.

    - **Spectrum**: Shows the composition of the frequencies of the audio signal.

    - **Pitch (EAC)**: Display of the basic frequencies of the audio signal with the
    aid of the Enhanced Autocorrelation (EAC) algorithm.

    - **Mono**: Hereby, you can define a single track as a mono track. This command
    is not activated for stereo tracks. Separate the stereo track first to be able
    to use the command on the single track.

    - **Left Channel**: Defines a mono track as a left channel.

    - **Right Channel**: Defines a mono track as a right channel.

    - **Make Stereo Track**: This command creates one stereo track out of two mono
    tracks.

    - **Split Stereo Track**: Splits a stereo track into two mono tracks, whereupon
    one track initially is the left and the other one the right channel.

    - **Set Sample Format**: Here you can set the sample format or the sample range
    and, thereby, the quality and the dynamic range. Choose between 16-bit PCM (CD
    quality, dynamic range of about 96 db), 24-bit PCM (standard studio recording
    quality, dynamic range of about 144 db) and 32-bit float (precision format of
    the floating point with a dynamic range of theoretically 192 db) for working with
    many effects, but admittedly also with the highest memory requirements both for
    RAM and hard disc storage unit.

    - **Set rate**: Here you can set the sample rate. Standard are, for example, 44100
    Hz (audio CD format), 48000 Hz (standard video sound), 96000 Hz (studio recording
    quality). Different tracks can have different settings and will be converted into
    the respective project sample rate during playing and exporting.


    Below the track name, you find a list of the characteristics of the track. In
    the given example: *stereo, 44100 Hz, 32-bit float*.


    Generally you can differentiate between stereo tracks, mono tracks, left and right
    tracks. The header of the track shows the respective kind of audio track.


    You can create a mono track out of a stereo track by selecting the menu command
    *Tracks> Stereo Track to Mono*. To create a left and right track, however, you
    have to open the context menu of the audio track by clicking on the name and choosing
    the command *Split Stereo Track* in the context menu.


    If you click here or on a free area below both of the controllers, you will mark
    the entire audio track, which is then displayed slightly darker.


    The buttons *Mute* and *Solo* offer the following features:


    - **Mute**: Switches the whole track on or off for replaying. The position of
    this button is irrelevant for mixing or exporting.

    - **Solo**: Switches all other tracks to mute, so that only this track is played.
    The position of this button is irrelevant for the mixing or exporting.


    Directly below these two buttons, there are the controllers for *Volume* and *Panorama*.
    Adjust your settings via the existing controllers or double click onto the scales
    to open the respective input window and enter your settings directly. Via the
    controller *Panorama* you can also set the stereo effect for a stereo signal.


    Finally, there is a button with an upwards pointing arrow at the lower end of
    the header of the track, by which you can collapse a track or respectively expand
    a collapsed track (arrow to the bottom).


    You can also set the width of tracks via the mouse. Therefor you have to direct
    the mouse pointer to the right of the header of the track at the lower edge, until
    the mouse pointer changes its form into a vertical double arrow. Then pull the
    track by holding down the mouse button to the desired size.


    ### 3.6.2 Label track


    The label track is used to retain short keywords or comments in labels for orientation.
    Additionally, audio tracks can also be cut on the basis of the markings of labels
    (see also 4.1, Cut audio tracks via labels). Labels can, in this context, mark
    a certain point or a certain area, as is evident in the following example.


