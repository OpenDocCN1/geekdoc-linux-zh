  mdcn: "\n ## 3.5.2 可变播放区域\n\n当你标记了一个区域后，可以通过按空格键来开始和停止标记区域的回放。按 C 键可以预览可能的剪切点。如果你只想从不同部分中再次收听某一特定部分，B\
    \ 键可以根据鼠标指针的位置，播放标记区域内外的不同部分。\n\n如果鼠标指针位于标记左侧，按 B 键将从该位置播放至标记起始处。\n\n![](img/1c450b361ffe9e9aa5c4ff276786cfd26_64_0.png)\n\
    \n> **从鼠标指针位置回放至标记处。**\n\n然而，如果鼠标指针位于标记的左半部分，按 B 键将从标记处播放至鼠标指针位置。\n\n![](img/1c450b361ffe9eaa5c4ff276786cfd26_64_1.png)\n\
    \n> **从标记处回放至鼠标指针位置。**\n\n如果鼠标指针位于标记的右半部分，按 B 键将从该点播放至标记末尾。\n\n![](img/1c450b361ffe9eaa5c4ff276786cfd26_65_0.png)\n\
    \n**从鼠标指针位置回放至标记处。**\n\n如果鼠标指针位于标记右侧，按 *B* 键将从标记右端播放至鼠标指针位置。\n\n![](img/1c450b361ffe9eaa5c4ff276786cfd26_65_1.png)\n\
    \n**从标记处回放至鼠标指针位置。**\n\n对于 *B* 键的所有示例，均只与鼠标指针的水平位置相关，而与垂直位置无关。\n\n最后，还可以直接收听某个特定区域。为此，在音轨上方的\
    \ timeline 上按住鼠标按钮标记一个区域，该区域将立即被回放。\n\n![](img/1c450b361ffe9eaa5c4ff276786cfd26_65_2.png)\n\
    \n**timeline 上的标记将立即被回放。**\n\n### 3.5.3 查找过零点\n\n过零点是波形与 x 轴相交的位置，即波形从负值区域变为正值区域或\
    \ vice versa 的位置。\n\n为了设置无干扰的剪切点，你应该在这样的过零点处剪切音轨。前提条件是，采样点必须尽可能精确地位于零线上。Audacity\
    \ 提供了一种通过菜单命令 *Edit > Find Zero Crossings* 查找相应过零点的优秀方法。这对于立体声音轨特别有帮助，因为要在两个声道同时处于过零点的地方找到合适的点可能非常困难。\n\
    \n按照以下步骤在过零点处设置剪切：\n\n- 设置剪切标记。\n- 选择菜单命令 *Edit > Find Zero Crossings* 或分别使用 *Z*\
    \ 键。Audacity 现在将自动设置剪切边缘。\n- 进行剪切。\n\n如果 Audacity 无法通过菜单命令 *Edit > Find Zero Crossings*\
    \ 找到合适的剪切位置，程序将删除标记并跳转到下一个过零点。在这种情况下，你可以在所需剪切边缘使用极短时间的淡入或淡出来解决。\n\n为此，几个采样的长度就足够了，目的只是简单地塑造波形，以创建必要的过零点。\n\
    \n## 3.6 不同的音轨\n\nAudacity 不仅认识不同的音频音轨，还有标签音轨、时间音轨和 MIDI 音轨。\n\n你可以通过选择菜单命令 *Tracks\
    \ > Add New* 并在子菜单中选择相应的音轨来添加新音轨。\n\n### 3.6.1 音频音轨\n\n最重要的音轨无疑是音频音轨，因为它们包含音频数据。音轨头部提供了显示音频数据的最重要的参数的快速概览，并提供了更改不同设置和显示的可能性。\n\
    \n音频数据默认以线性波形显示，其中幅度以图形方式显示。波形的主要幅度在此显示中代表高音量，而小幅度则表示静音部分。中心位置没有上下幅度的直线相应地显示静音。\n\
    \n通过音频文件的音轨头部，可以选择其他显示方式，如对数波形、频谱或音高（*EAC*）。\n\n![](img/1c450b361ffe9eaa5c4ff276786cfd26_68_0.png)\n\
    \n**音频音轨的头部。**\n\n如果你点击左上角的叉号，该音轨将被删除。但是，这个操作步骤也可以通过 *Undo* 按钮撤销。\n\n点击音轨名称或向下指向的箭头，将打开上下文菜单，如右上方所示，该菜单提供以下功能和命令：\n\
    \n- **Name**：打开 *Track Name* 窗口，你可以在其中输入标题。\n- **Move Track Up**：将音轨向上移动一个位置。此命令仅在当前音轨上方有另一个音轨时才会激活。\n\
    - **Move Track Down**：将音轨向下移动一个位置。此命令仅在当前音轨下方有另一个音轨时才会激活。\n- **Waveform**：加载音频文件时的标准显示，提供线性显示。\n\
    - **Waveform (dB)**：以对数显示方式显示音频文件的波形。\n- **Spectrum**：显示音频信号的频率组成。\n- **Pitch\
    \ (EAC)**：使用增强自相关（Enhanced Autocorrelation, EAC）算法显示音频信号的基本频率。\n- **Mono**：你可以将单个音轨定义为单声道音轨。此命令对立体声音轨不激活。首先需要分离立体声音轨，才能在单个音轨上使用此命令。\n\
    - **Left Channel**：将单声道音轨定义为左声道。\n- **Right Channel**：将单声道音轨定义为右声道。\n- **Make\
    \ Stereo Track**：此命令从两个单声道音轨创建一个立体声音轨。\n- **Split Stereo Track**：将立体声音轨分割为两个单声道音轨，其中一个音轨初始为左声道，另一个为右声道。\n\
    - **Set Sample Format**：在这里你可以设置采样格式或采样范围，从而设置质量和动态范围。在 *16-bit PCM*（CD 质量，约 96\
    \ dB 动态范围）、*24-bit PCM*（标准录音棚录音质量，约 144 dB 动态范围）和 *32-bit float*（浮点精度格式，理论动态范围为\
    \ 192 dB）之间进行选择，后者适用于处理多种效果，但 admittedly 对 RAM 和硬盘存储单元的要求也最高。\n- **Set rate**：在这里你可以设置采样率。标准值例如为\
    \ 44100 Hz（音频 CD 格式）、48000 Hz（标准视频声音）、96000 Hz（录音棚录音质量）。不同的音轨可以有不同的设置，在播放和导出期间将转换为相应的项目采样率。\n\
    \n在音轨名称下方，你可以找到音轨特性的列表。在给定的例子中：*stereo, 44100 Hz, 32-bit float*。\n\n通常你可以区分立体声音轨、单声道音轨、左声道音轨和右声道音轨。音轨头部显示相应的音频音轨类型。\n\
    \n你可以通过选择菜单命令 *Tracks > Stereo Track to Mono* 从立体声音轨创建单声道音轨。但是要创建左声道和右声道音轨，你需要点击名称打开音频音轨的上下文菜单，并在上下文菜单中选择\
    \ *Split Stereo Track* 命令。\n\n如果你在这里点击或在两个控制器下方的空白区域点击，你将选中整个音频音轨，该音轨随后会稍微变暗显示。\n\
    \n*Mute* 和 *Solo* 按钮提供以下功能：\n\n- **Mute**：在回放时打开或关闭整个音轨。此按钮的位置对混音或导出没有影响。\n- **Solo**：将所有其他音轨切换为静音，因此只播放此音轨。此按钮的位置对混音或导出没有影响。\n\
    \n直接在这两个按钮下方，是 *Volume* 和 *Panorama* 的控制器。通过现有的控制器调整设置，或双击刻度打开相应的输入窗口直接输入设置。通过\
    \ *Panorama* 控制器，你还可以为立体声信号设置立体声效果。\n\n最后，在音轨头部的下端有一个向上指向箭头的按钮，通过它可以折叠音轨或 respectively\
    \ 展开折叠的音轨（箭头向下）。\n\n你还可以通过鼠标设置音轨的宽度。为此，你需要将鼠标指针指向音轨头部右侧的下边缘，直到鼠标指针变为垂直双箭头。然后按住鼠标按钮将音轨拖动到所需大小。\n\
    \n### 3.6.2 标签音轨\n\n标签音轨用于在标签中保留简短的关键词或注释以供参考。此外，音频音轨也可以基于标签标记进行剪切（参见 4.1，通过标签剪切音频音轨）。在这种情况下，标签可以标记某个点或某个区域，如下例所示。\n\
    \n![](img/1c450b361ffe9eaa5c4ff276786cfd26_70_0.png)\n"
