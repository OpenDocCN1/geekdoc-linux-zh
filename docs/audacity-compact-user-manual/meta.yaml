    ## 2 Setup of the programme


    After starting the programme Audacity 1.3.6, you will see approximately the following
    screen on your monitor. It can vary slightly graphically depending on the operating
    system, since the versions cannot be completely identical because of the different
    preconditions.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_28_0.png)


    > Programme after the first start.


    Audacity opens with an empty project window by default and presents itself, thereby,
    top down as follows:


    Bellow the title bar is the menu bar with the items *File*, *Edit*, *View* and
    so forth. The different toolbars are located beneath. Lastly, you can see a timeline
    in the upper area above the empty project window. Below the empty project window,
    there is the time and project rate bar as well as the status bar, which shows
    the currently used frequency.


    ### 2.1 The various toolbars


    The symbols of the *control toolbar* should be familiar to most of you from other
    audio equipment.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_29_0.png)


    Though, some of these buttons have extended features in conjunction with the SHIFT-key
    (also known as the key used to type capital letters).


    | Symbol | Name | Function |

    |--------|------|----------|

    | ⏸ | Pause | Pauses current recordings or playbacks. To resume, press *Pause*
    anew. |

    | ▶ (Loop-play) | Play / Loop-play | Playback starts at the current position of
    the selection cursor or at the beginning of a selected section. If you hold down
    *SHIFT* while pressing *Play*, the image of the button and its function will change.
    The track or the selected section of the track will now be played over and over
    (loop-play) until you press *Stop*. |

    | [Stop icon] | Stop | Pressing this button, you will stop the current recording
    or playback. If pausing was activated, both the foregoing action and pause will
    immediately be stopped. |

    | [Skip to start icon] | Skip to start | Moves the cursor to the beginning of
    the project (time position 0). Holding down *SHIFT* will mark the audio track
    section from the current position to the starting point of the project. |

    | [Skip to end icon] | Skip to end | Moves the cursor to the end of the project.
    Holding down *SHIFT* will mark the audio track section from the current position
    to the end of the project. |

    | [Record icon] | Record | After pressing the *Record*-button, a new track will
    be created. Recording begins at the current cursor position with the set recording
    rate and can be paused by pressing *Pause* and ended by pressing *Stop*. |


    The *tools toolbar*, which looks rather unimpressive, is also important for the
    work via mouse and will be described in the following.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_30_0.png)


    # Audacity tools toolbar.


    The individual devices can also be chosen comfortably via keyboard, since they
    are usually allocated from left top to right bottom with the function keys *F1*
    to *F6*.


    | Symbol | Name | Function |

    |--------|------|----------|

    | I | Selection tool | By activating this device, you can define the cursor position
    in a track via mouse click or mark a certain area via holding down the mouse button.
    |

    | ✁ | Envelope tool | Using this device, you can change the volume for a selection.
    This is, for example, useful for fading tracks in and out manually. |

    | ✏ | Draw tool | Start by zooming in on the audio track until you can spot the
    individual samples as dots. Holding down the mouse button, you can now draw the
    samples anew. This is, for example, useful for removing short background noises
    manually. |

    | 🔍 | Zoom tool | Allows to zoom in (left mouse button) or to zoom out (right
    mouse button or *SHIFT* + *left mouse button* respectively) in order to change
    the perspective of the audio track. |

    | ↔ | Time shift tool | With the aid of this device, you can shift an entire audio
    track horizontally – thus, on the timeline. For this purpose, you drag the audio
    track by holding down the mouse button to the desired position. Small arrows will
    indicate, if parts of the audio track are moved into the negative time-line. |

    | ✱ | Multi-tool mode | Device, which combines the different features, depending
    on the image of the mouse pointer and position of application: |


    | Symbol | Name | Function |

    |--------|------|----------|

    | | | I   Enables the positioning of the point of playback via mouse click and
    of the markings by holding down the mouse button. A right mouse click zooms out
    the perspective, whereas selecting while holding down the right mouse button fits
    the marking directly into the perspective. |

    | | | ▽ △  The mouse pointer looks like this at the margin of the envelope, which
    you can then shift by holding down the mouse button. |

    | | | ↔  By holding down the CTRL-key, you can shift audio tracks on the timeline.
    A selected area can also be moved by beginning to move right where the selection
    starts. |


    To the right of the device tool bar, you can find the *meter toolbar*.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_32_0.png)


    *Meter toolbar with menus.*


    The individual commands of the menus:


    - **Disable Meter**: Disables the respective meter, which is then displayed in
    grey.

    - **Enable/Disable Meter**: Enables or disables the input level meter (microphone
    icon).

    - **Horizontal Stereo**: Standard display, which shows the meter horizontally
    from left to right.

    - **Vertical Stereo**: Shows the meter vertically from bottom to top.

    - **Linear**: Switches to a linear scale in the meter (0.0 = silence, 1.0 = maximum
