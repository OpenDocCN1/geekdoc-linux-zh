  md: '# 1 Introduction


    The following introduction is intended for those who are not familiar with the
    basic terms and procedures in the field of audio techniques. Only a very rough
    overview will be given, which shall assist to get a basic understanding of the
    subject. Basic physical correlations and related terms will not only help later
    on for a better understanding of the programme Audacity and the tasks, which can
    be realized with it, but will also help in many cases to achieve better results.
    We shall cover a wider range of topics, beginning with analogue acoustic waves
    and ending with digital audio recording. Additionally, we will also take a look
    at the compression of audio data and microphone technics in this chapter.


    # 1.1 Sounds, sound waves and digital audio


    Sounds are sound waves, which – from a physical point of view – form barometric
    variations, which are strung together. However, only sound waves, which can be
    heard by us humans, with frequencies of about 16 to 20,000 Hz or 20 kHz respectively,
    are called sounds. The frequency indicates in this context, how often the sound
    wave oscillates per second. At the same time, the frequency also defines the physical
    length of a sound wave. The formula for this is:


    Acoustic Velocity = Length of Sound Wave / Frequency


    The acoustic velocity is, however, furthermore dependent on the medium, in which
    the sound wave moves. Relevant properties are in this case the mass density and
    the respective temperature. Sound waves cannot move in a vacuum due to the lack
    of medium.


    In the air, acoustic velocity is for example about 760 mph at 59 °F and decelerates
    consistently with falling temperature. Barometric pressure on the other hand has
    no effect on acoustic velocity, even though this has often incorrectly been assumed.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '| Medium | Temperature | Acoustic Velocity |

    |---|---|---|

    | Air | 59 °Fahrenheit | 760 mph |

    | Air | 32 °Fahrenheit | 740 mph |

    | Water | 68 °Fahrenheit | 3.320 mph |

    | Aluminium | 68 °Fahrenheit | 11,408 mph |


    **Examples of acoustic velocities.**


    For humans, the most important transport medium for sound waves is the air. From
    a temperature of 59 °F the following wave lengths exemplary result. Other frequencies
    can also be calculated easily with the aid of the beforehand mentioned formula.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_11_0.png)


    **Wavelengths of different frequencies.**


    Sound waves below 16 Hz, the lowest frequency audible for humans, are called infrasound.
    These are probably used for communication by blue whales, elephants and giraffes.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'On the other side of the scale, in the range not audible for humans, from about
    20 kHz (20,000 oscillations per second) to 1 gHz (1 billion oscillations per second)
    the sound waves are called ultrasound. The possibilities for the use of these
    sound waves are extremely diversified. Thus, ultrasound is used for instance in
    medical science as a diagnostic imaging technique or to remove calculus and to
    break up kidney stones. It is, furthermore, used in seafaring for measuring water
    depths, locating shoals and for navigating, and in materials engineering for example
    for non-destructive material testing.


    But let us return to those sound waves, which are audible for humans. Many mediums
    are limited to a frequency range, which is necessary for hearing or communicating.
    On the one hand, this has very practical reasons, for example to store a sufficient
    number of songs on a CD, or with regards to telephony, because it is simply cheaper
    to build a microphone or a speaker respectively, which only records or reproduces
    a relatively small frequency range.


    Here are some examples:


    | Medium | Sample Frequency | Frequency Range | Channels | Sample format |

    |---|---|---|---|---|

    | Telephone | 8 kHz | 300 - 3400 | mono | 8 bit |

    | AM Radio | 11,025 kHz | 50 - 5000 | mono | 8 bit |

    | FM Radio | 20,05 kHz | 20 - 15000 | stereo | 16 bit |

    | CD | 44,1 kHz | 20 - 20000 | stereo | 16 bit |

    | DAT-Recorder | 48 kHz | 20 - 20000 | stereo | 16 bit |

    | Audio-DVD | 44,1 to 192 kHz | 20 - 20000 | stereo or up to max. 6 channels |
    16, 20 or 24 bit |


    The development of digital technique finally brought the distinction between analogue
    and digital signals.


    If you record, for example, analogue sounds like speech or singing with a microphone
    using a tape recorder, the result will stay analogue. The analogue signal can
    in this case take every possible value of a certain scale.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'However, if you save an audio signal via computer, the signal will be digitised,
    which means that it is converted into discrete, that is integral, numerical values.
    The analogue digital converter and for the reconversion the digital analogue converter
    (a/d, d/a converter) are hereby used, which are both located on the sound card.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_13_0.png)


    In this process, which is also called quantisation, the analogue signal is measured
    in certain intervals (the so-called sampling rate) and converted into a discrete
    value. In the following figure, every vertical line stands for such a sampling
    sequence.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '![](img/1c450b361ffe9eaa5c4ff276786cfd26_14_0.png)


    **Sampling of an analogue signal.**


    The calculated value is allocated to the next raster value by rounding up or down.
    The following figure of the measured and converted values shows clearly the disadvantages
    of this method. The horizontal lines are here the converted raster values.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '![](img/1c450b361ffe9eaa5c4ff276786cfd26_15_0.png)


    > Rounding up or down respectively of the measurement results to given raster
    values.


    The difference between the calculated value and the next possible raster value
    displays the error of quantisation. This error occurs, because the sampled value
    of the signal does not always lie exactly on the given value of the used raster
    and, therefore, has to be rounded up or down. This consequentially causes minimal
    divergencies of the digital signal in comparison with the original one.


    The advantages of digitalisation are, however, obvious: digital data is a lot
    easier to process and to handle, does not underlie any aging process and, moreover,
    they can be copied as often as you want to without any loss in quality. The data
    can, furthermore, be saved very efficiently in digital form through compression
    or be made available worldwide via the Internet.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'During digitising, the amplitude or respectively the volume of the audio signal
    is sampled with a certain frequency and the thereby calculated values are saved.
    The sampling sequences, which are executed every second, are called sampling rate.
    Audio CDs, for example, have a sampling rate of 44.1 kHz, which means, that the
    audio signal is sampled 44,100 times per second and the thereby calculated values
    are saved.


    The second important factor for digitising analogue signals is the so-called sample
    format or sample range. It practically sets up the size of the scale or raster,
    in which the conversion of the numerical values takes place, and, thus, determines
    the number of possible increments. The beforementioned audio CD usually uses a
    sample range of 16 bits, with which exactly 65,536 different values can be displayed.


    | Sample Format or Sample Range | Possible Values |

    | --- | --- |

    | 4 bit (2⁴) | 16 |

    | 8 bit (2⁸) | 256 |

    | 16 bit (2¹⁶) | 65536 |

    | 24 bit (2²⁴) | 16777216 |

    | 32 bit (2³²) | 4294967296 |

    | 48 bit (2⁴⁸) | 281474976710656 |

    | 96 bit (2⁹⁶) | 79228162514264337593543950336 |


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_16_0.png)


    The higher the chosen sample rate, the bigger on the one hand the memory requirements,
    but on the other hand also the dynamic range, that is the difference between the
    lowest and loudest sound. For 16 bit stereo, the dynamic range is, for example,
    about 96 db (approximately 6 db per bit sample range). At the same time,'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'a higher sample range reduces the quantisation error in relation to the original
    signal.


    The Nyquist-Shannon sampling theorem shows, moreover, the direct correlation between
    sample rate and frequency range, and states, that the sample range must be at
    least twice as high as the maximum displayable frequency:


    > $$Maximum\,displayable\,Frequency = \frac{Sample\,Rate}{2}$$


    The maximum displayable frequency, in turn, is geared to the recipient, that is
    to the frequency range audible for humans. Therefore, a sampling rate of 44.1
    kHz has been defined for CDs, resulting in a maximum frequency signal of 22.5
    kHz, which already is beyond the human perception of maximal 20 kHz.


    By using several channels, it is, moreover, possible to produce surround sound,
    which is not possible for mono recordings with only one channel. Stereo recordings
    use two separated channels, which can be output to a right and left speaker during
    rendering. Even more channels are used, for example, on quadraphonics (4-channel
    stereophony) or Dolby surround (multi-channel sound reproduction with five speakers)
    and 5.1-audio with six channels.


    If we take, for example, a regular audio CD: At a sample rate of 44.1 kHz and
    a sample range of 16 bit as well as 2 channels for stereo effect, the data rate
    is calculated as follows:


    > $$(44.100 * 16) * 2 = 1.411.200\,bit/s$$


    Thus, audio recording, if uncompressed, needs quite a lot of memory capacity.
    A recording of three minutes in CD-quality already needs about 30 MB disc space.
    This equates, for example, to an amount of data of about 6,000 pages of text or
    to the capacity of more than 20 floppy disks. Just a few years ago, computers
    were simply overextended by these amounts of data.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# ## 1.2 Audio data and compression


    As you could see in the last chapter, it can be extremely memory intensive to
    save audio files, which is why different methods are used in order to achieve
    a compression of the data. This saves memory capacity, but also makes it possible
    to work more efficiently with the data. Algorithms for the compression of digital
    data, such as movies or documents, search during this process mostly for repetitions
    in order to overwrite the area of repetition, subsequently saving disc space.
    Since identical repetitions in music are rare, audio data does not lend itself
    easily to compression.


    Most of the lossless compressors, therefore, use predictive encoding, which first
    makes a prognosis of the amplitude and afterwards saves the actual difference
    to the prognosis. The attainable compression, nevertheless, is strongly dependent
    on the respective audio data and averages at about 25–70 % of the original, while
    the lossy compression reaches a reduction of the data to about 10 % of the original
    without audible differences in quality.


    The most popular audio format definitely is MP3, which was developed by the Frauenhofer
    Institute in collaboration with the companies AT&T, Bell Labs and Thomson. This
    procedure, which in the meantime has qualitatively been outrun by other formats
    like Vorbis or AAC, uses data reduction by leaving out not or hardly audible frequency
    ranges as well as heterodyne frequencies or sequences with changes in volume (such
    as low sounds, which directly follow sequences of very high volume), which the
    human sense of hearing cannot separate from each other or respectively cannot
    perceive.


    The most important audio data formats for working with Audacity are discussed
    in more detail in the glossary at the end of the book.


    # ## 1.3 Via microphone directly onto the computer


    The first step of editing digital audio is usually the recording of language,
    music and sounds via microphone. All you need for direct recording of audios onto
    your computer is the programme Audacity, a sound card and a microphone.


    Mistakes, which are made here at the beginning of the working process, are typically
    hard or impossible to correct later on. The recording itself and the'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'selection of the microphone are, therefore, of crucial importance. Let us begin
    with the microphones, which can today be classified into three main categories:


    +   - Dynamic microphones (moving coil microphones)

    - Condenser microphones

    - Electret condenser microphones (variant of the condenser microphone)


    These microphone types have in common, that they convert sound waves via a mechanically
    oscillating membrane into an electrical signal. Dynamic microphones convert via
    the movement of an induction coil within a magnetic field. This is also called
    induction principle. Dynamic microphones can bear enormous acoustic pressure without
    distorting and are, therefore, very popular for live on-stage use and for recording
    loud instruments, such as bass drums and trumpets. Another advantage is the fact,
    that they – in contrast to condenser microphones – do not need any electric power
    supply.


    A disadvantage, however, is the higher weight of the membrane, which leads to
    an impulse repeating of lower quality and a longer post-pulse oscillation. This
    in turn has a negative effect on the frequency response, which does not process
    more or less in-line, as it does with condenser microphones, but usually declines
    in the lower and upper frequency spectrum. Additionally, the frequency spectrum
    of dynamic microphones themselves is generally lower than that of condenser and
    electret microphones.


    Condenser microphones are typical studio or respectively speaker microphones.
    If you want to use Audacity, for example, for podcasting, a condenser microphone
    is recommendable. They are virtually always used, when a recording as accurate
    as possible of the original sound is desired. A slight disadvantage is, as previously
    mentioned, that the condenser microphone needs supply voltage to load the membrane
    and the preamplifier. This problem is often solved by using 9-volt batteries for
    on-stage microphones, while it is energised in studios via so-called phantom power,
    usually a 48-volt direct current voltage, provided by microphone inputs.


    Electret condenser microphones are a variant of the condenser microphone, but
    they use an electret membrane, which is located between the condenser plates,
    for sound propagation. This type of microphone is nowadays the most popular one,
    because of the very compact construction and the low cost manufacturing, and it
    can be found in many devices, such as (mobile) phones, interphone systems, laptops,
    baby monitors or even hearing aids.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'One really important aspect is the directional characteristic of a microphone,
    which provides information about how well the sound can be absorbed from different
    directions. Some modern condenser microphones already provide a selectable directional
    characteristic as optional equipment. Four basic characteristics can generally
    be distinguished:


    +   - **Omnidirectional:** These microphones absorb sound from all directions
    equally well. This type of microphone is also called nondirectional and is mainly
    used for the recording of background atmosphere or in studios.

    - **Bi-directional:** Microphones of this directional are also called „figure
    8 microphones". They are pressure gradient receivers, which absorb sound from
    both the front and the back of the membrane. Through constructive changes, even
    cardioid characteristics can be reached.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_20_0.png)


    **Omnidirectional and bi-directional characteristics.**


    +   - **Cardioid:** Microphones of this characteristic mainly record from the
    direction, in which they are held, while sound from the back is practically completely
    shielded. Moreover, their directionality matches approximately the human ear,
    which is why they are preferred for recording of ambient sounds.

    - **Supercardioid and Hypercardioid:** These polar patterns are – in comparison
    with normal cardioids – significantly more directed and can, therefore, suppress
    background sounds significantly better. Hence, they are usually used for more
    distant acoustic sources, such as movie and television shots, where the microphone
    has to be outside of the display window.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '![](img/1c450b361ffe9eaa5c4ff276786cfd26_21_0.png)


    Finally, you should also pay attention to the right connector for the microphone
    or respectively remember to buy the applicable adapter. Standard microphones usually
    use the following four connectors:


    +   - **3.5 mm TRS connector**: The so-called „miniature TRS connector'
  merge: -1
  pgno: 21
- img_proc: true
  md: '![](img/1c450b361ffe9eaa5c4ff276786cfd26_22_0.png)


    The question of which microphone to choose can actually only be answered individually.
    The microphone just has to suit the voice or instrument. You can read long consumer
    reports and discussions about this subject in various online forums, which can
    definitely help to make a buying decision. Our advice is, therefore: First of
    all, read consumer reports by ambitious users, decide exactly upon the desired
    applicability and compare the technical specifications as well. The Audacity forum,
    available at http://audacityteam.org/forum, can also give you a good overview.


    Those, who have the possibility – for example at a large music store, a conferrer
    or the like –, should certainly test the various microphones beforehand. Once
    you have decided on a microphone, nothing will get in the way of making your first
    recording.


    Here are some tips for successful recording:


    +   - Initially, adjust the settings for the recording level. Regulate the sound
    level in a way, so that the sound will be recorded as loud as possible, but you
    absolutely try to avoid clipping.

    - If applicable, run a test recording of several seconds, before the actual recording,
    and check the result for possible interferences, falsifications, clippings and
    so forth.

    - Try to eliminate or avoid background noises. For indoor recordings you should,
    for example, locate a quiet room free from echo. For outdoor'
  merge: -1
  pgno: 22
- img_proc: true
  md: '+   - recordings you could, for example, use a wind deflector against the sounds
    of wind, mask flapping parts of clothing and turn off other disturbing sources
    beforehand, such as possibly ringing mobile phones.

    - If you have background noise that you cannot turn off, you should bring the
    microphone as close as possible to the source of sound, which is to be recorded.
    This way, the background noise is at least recorded mutedly.

    - Recordings of speech should be carried out at a volume as constant as possible,
    meaning without any outliers upwards or downwards.

    - When recording musical instruments, you should familiarise yourself with the
    individual **directional characteristics of that musical instrument to be able
    to place the microphone as optimal as possible.**


    If there are, nevertheless, interferences, or if there is a clearly audible hissing,
    you systematically have to go through all elements of the recording chain, test
    them individually if possible and, where necessary, substitute those components,
    which could be responsible for the error. But before you act blindly, you should
    always test the wiring and the conducted settings first.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Recording from other playback devices


    If you have another playback device, like e. g. an MP3-player or a CD-player,
    you can record its output signal, which comes from the line-out jack or a green
    jack, via the line-in input or respectively the blue jack of your computer.


    The following colours are usually used for the different ports of a computer:


    | Colour | Function |

    | --- | --- |

    | Silver (grey) | Side speaker output (stereo) |

    | Black | Back speaker output (stereo) |

    | Orange | Subwoofer output and centre output.<br>Often alternatively switchable
    to the digital output. |

    | Pink | Microphone input (mono) |

    | Green | Speaker output, line-out (stereo) |

    | Blue (light blue) | Line-in (stereo) |


    If you want to record from the output of another programme, you should initially
    check, whether the respective programme itself allows recording. You can then
    edit the result with Audacity subsequently.


    Many sound cards allow you to choose the entire output as the input channel. Different
    terms are used in this context, such as *Wave Out* or *What U Hear*. Using this
    setting, you can utilise Audacity to record sound, while a different programme
    replays something. Conflicts may occur in isolated cases, because two programmes
    access the sound card simultaneously.


    Using newer drivers or a different operating system might solve this problem.
    Alternatively, a temporary solution could simply be to directly pass the output
    *line out* (green jack) via wire to *the line in* jack (blue jack) and to record
    the input via Audacity from *line in*.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# 1.4 What exactly is Audacity?


    Audacity is a free and cross-platform programme for audio editing. Free does in
    this context not only refer to free of charge, but above all free in terms of
    liberty. This includes primarily the liberty to be able to use this software for
    all, even commercial purposes. The software may, furthermore, be copied, circulated
    as well as adjusted to one''s own requirements and demands. Other distinct characteristics
    of a free software are the licensing under the GNU General Public License (GPL),
    which is also known as a free copyleft license for software, and the fact, that
    the source code is available for everyone.


    The developing trend of such free software, which is also called open source projects,
    is directly dependent on the composition and interests of the respective team
    of developers as well as the requests and suggestions of the users. Many teams,
    however, offer, moreover, individual enhancements of the respective software.
    Simply contact the respective team, if need be.


    Audacity was originally created for a project at the Carnegie Mellon University
    in Pittsburgh, USA, which dealt with frequency analysis. Dominic Mazzoni has been
    evolved right from the start and is still significantly supervising the project
    today. He and an international group of volunteers, organising themselves via
    Internet, continuously develop Audacity further. Audacity is written in the programming
    language C++.


    A special feature is the fact that Audacity has been developed for all three major
    operating systems (Windows, Mac OS X and Linux). To provide a similar graphical
    user interface for the different operating systems, the wxWidgets software library
    is used. The latest release is 1.3.6 (beta), which has been launched in October
    2008; and the latest stable release is 1.2.6 respectively, which is recommended
    for efficient working.


    Audacity enables the individual user to handle different tasks independently,
    which previously could only be realised time, work and price intensive at a recording
    studio. Linked to an Internet connection and a website or respectively the access
    to the according Internet portal, these products can be made available worldwide.
    This development has already gained ground in the form of self-recorded and mixed
    music, audio blogs and podcasts and has enriched cultural life for a while.


    In the following, the latest release 1.3.6 (beta) will be described.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# 1.5 The functional range of Audacity


    With Audacity, you can complete a lot of tasks. Pay attention to the fact, that
    you may possibly need additional devices or software for certain tasks and functions.
    Thus, for the already mentioned live-recording of speech, sounds or music, you
    need, for example, at least a microphone, which has to be connected to the computer
    via a mixing desk or directly via sound card.


    The most important features are:


    +   - Importing of different audio formats, such as WAV, FLAC, AIFF, AU, Ogg Vorbis
    and MPEG data

    - Importing of audio raw data

    - Creating of an unlimited number of audio tracks

    - Compiling live-recordings

    - Digitising of analogue data mediums like cassette tapes or vinyl records

    - Cutting, copying, deleting and mixing of audio data

    - Providing audio data with special effects, such as changing speed or pitch of
    a recording

    - Unlimited undo actions and restoring of work steps

    - Recording via microphone and other sources via the line-in input, like for example
    mixing desks or amplifiers and online sources (dependent on the capabilities of
    the used sound card). Recordings with a sample rate of up to 96 kHz and a sample
    and a floating point of up to 32 bit are hereby supported.

    - Changing and mixing of an unlimited number of tracks

    - Deleting of continuous background noises

    - Manual deleting of disturbances via the drawing tool

    - Displaying of the recording level before, during and after recording

    - Recording in 16-, 24- or 32-bit (floating point)

    - Exporting of WAV-, AIFF-data and via the optional LAME Encoder Library even
    MP3-files

    - Spectrogram mode to show frequencies

    - Plot spectrum commands for a more precise frequency analysis

    - Mixing together of different sample rates and formats in real time


    As a mere audio editor, Audacity does not offer any advanced features, which may
    be known from so-called sequencer programmes. This means more specifically,'
