    - **Name**: Opens the window *Track Name*, where you can enter a significant title.

    - **Move Track Up**: This command moves the time track one track up and is only
    activated, if there is at least one other track above the time track.

    - **Move Track Down**: This command moves the time track one track down and is
    only activated, if there is at least one other track below the time track.

    - **Set range**: Here you can set the minimum speed limit in percent of the original
    speed (>=13) as well as the maximum speed limit (<=1200). By default, 90 and 110
    % are preset.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_75_0.png)


    > Unprocessed and processed time track.


    Via the envelope tool you can process the time track and, thus, create similar
    effects as a record player, which plays too fast or too slow. This creates a higher
    sound, if the audio track runs faster, and a lower one, if it runs slower.


    ### 3.6.4 MIDI track


    As already noted, Audacity cannot yet process MIDI files, but the files can, nevertheless,
    already be displayed as tracks. For future releases, MIDI support is planned.
    You cannot generate a MIDI track, but only create one by importing a MIDI file.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_75_1.png)


    > Example for the display of a MIDI file.


    MIDI are so-called event messages for musical instruments or sound cards. In this
    context, for example, the musical instrument, the note, the volume, the balance
    and further information are set. Unlike digital audio files, MIDI files are very
    small. A size of about 10 kB is already enough for one minute of music. Complex
    sounds such as the human voice, however, cannot be reproduced via MIDI. Additionally,
    you run the risk that the same MIDI file sounds very differently on varying hardware,
    because the MIDI file only saves the "notes", but not the sounds of the single
    instruments.


    Via mouse click you can fade in or out the individual channels at the header of
    the track. The context menu of the header of the track shows the entries, which
    are displayed in the following figure.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_76_0.png)


    As already noted, MIDI tracks are not supported at the moment. They can only be
    displayed, but not be played back or processed. The menus:


    - **Name**: Opens the window *Track Name*, where you can enter a significant title
    for the track.

    - **Move Track Up**: This command moves the MIDI track one track up and is only
    activated, if there is at least one other track above the MIDI track.

    - **Move Track Down**: This command moves the MIDI track one track down and is
    only activated, if there is at least one other track below the MIDI track.

    - **One Octave Up**: Shows the next higher octave of the MIDI track.

    - **One Octave Down**: Shows the next lower octave of the MIDI track.


    ## 3.7 Recordings


    Audacity allows recordings from different sources, which are in turn dependent
    on the equipment of your computer. If you possess, for example, a microphone,
    which has a compatible port to your computer sound card, you can create recordings
    with it.


    For this, select the entry *Microphone* in the pull-down menu of the level controller.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_77_0.png)


    Depending on the sound card and the used sound system, the pull-down menu can
    contain considerably more entries than displayed in the figure.


    In the above displayed case with three entries in the pull-down menu, you select
    *Stereomix*, if you want to record the output of another programme, *Line-In*
    for connected devices like record player, tape recorder or minidisc player, and
    *Microphone* for recordings via a microphone, which is directly connected to the
    sound card.


    Via the two sliding controllers, you can set the *Output Volume* and the *Input
    Volume* of the recording source. Both values can be set separately.


    ## 3.8 Working with shortcuts


    If you work with the programme often, you should learn the different shortcuts,
    with which you can work considerably faster. You can see the shortcuts on the
    one hand behind the individual menu commands as well as in the *Preferences* (menu
    command *Edit> Preferences* or shortcut *Ctrl + P*), where you can also carry
    out individual customizations and extensions. To give you a better overview, the
    commands are displayed here in the alphabetical order of its functions:


    | Key or shortcut | Function |

    |---|---|

    | Ctrl + M | Add Label At Playback Position |

    | Ctrl + B | Add Label At Selection |

    | Ctrl + Shift + N | Add New Audio Track |

    | Ctrl + W | Close |

    | Ctrl + Shift + C | Collapse All Tracks |

    | Ctrl + C | Copy |

    | Ctrl + X | Cut |

    | Ctrl + K | Delete |

    | Ctrl + Alt + J | Detach at Silences |

    | Ctrl + D | Duplicate |

    | Ctrl + Q | Exit |

    | Ctrl + Shift + X | Expand All Tracks |

    | Z | Find Zero Crossings |

    | Ctrl + F | Fit in Window |

    | Ctrl + Shift + F | Fit Vertically |

    | Ctrl + Shift + I | Import Audio |

    | Ctrl + J | Join |

    | Alt + L | Labeled Regions Silence |

    | Ctrl + Shift + M | Mix and Render to New Track |

    | Ctrl + N | New |

    | D | Next Tool |

    | Ctrl + O | Open |


    | Key or shortcut | Function |

    |---|---|

    | Ctrl + V | Paste |

    | P | Pause |

    | L or Shift + spacebar | Play Looped |

    | 1 | Play One Second |

    | B | Play To Selection |

    | Spacebar | Play/Stop recording |

    | Ctrl + P | Preferences |

    | A | Previous Tool |

    | R | Record |

    | Ctrl + Y | Redo |

    | Ctrl + R | Repeat Last Effect |

    | Ctrl + S | Save Project |

    | Ctrl + Shift + S | Save Project As ... |

    | Ctrl + A | Select All |

    | Ctrl + L | Silence Audio |

    | Ctrl + I | Split |

    | Ctrl + Alt + X | Split Cut |

    | Ctrl + Alt + K | Split Delete |

    | Ctrl + Alt + I | Split New |

    | S | Stop |

    | Ctrl + T | Trim |

    | Ctrl + Z | Undo |'
