  md: 'Markus Priemer


    # Audacity kompakt


    Audacity is without doubt the most popular free audio programme. Initially being
    an insider tip, the editor has evolved into a standard programme for the recording
    and editing of audio data.


    Not least is Audacity responsible for the popularity of podcasts, because there
    is hardly any other programme, with which podcasts can be generated this easily
    and processed for publication on the Internet – and that for free. It also speaks
    in favour of Audacity, that the programme is available for Linux, Mac OS as well
    as Windows.


    No matter if you turn your computer into a simple music studio, digitise your
    old vinyl records, generate ring tones or podcasts: for a successful and trouble-free
    access to the world of digital audio recording and editing.


    The author has been supported by Markus Meyer, Audacity developer right from the
    start Markus Meyer has also contributed the foreword.'
  merge: -1
  pgno: 155
