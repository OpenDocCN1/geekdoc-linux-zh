    ## 7.2 Edit


    | Menu command | Function |

    |---|---|

    | Undo | Via this menu command, you undo the last work step. |

    | Redo | Via this menu command, you redo the work step, which you undid before.
    |

    | Cut | With this feature, the marked files or tracks are cut and copied to the
    clipboard. |

    | Split Cut | Cuts the marked section of a track and splits the clip at the according
    positions. |

    | Copy | Copies the marked section to the clipboard. |

    | Paste | Pastes the content of the clipboard. |

    | Trim | Deletes all areas, which are not marked. |

    | Delete | Deletes the entire track or the marked section of the track respectively.
    |

    | Split Delete | Deletes the marked section and splits the track into two clips,
    which can now be shifted independently. |

    | Silence Audio | Converts the marked section into silence. Thus, the track remains
    unchanged in its length. |

    | Split | Splits the track into two clips, which can now be shifted independently.
    |

    | Split New | Cuts the marked section and moves it into a new audio track, which
    is created in the same window underneath the already existing track. |

    | Join | Joins the clips of the audio track at the current position. Possibly
    missing parts are filled with silence. |

    | Detach at Silences | Offers the opportunity to split an audio track automatically
    at silences and, thus, to divide it into several clips. |

    | Duplicate | Copies the marked section or the entire marked audio track respectively
    into a new audio track, which is created underneath the already existing audio
    track. |

    | Labeled Regions... | Opens a submenu, where you find the following features:
    Cut, Split Cut, Copy, Delete, Split Delete, Silence, Split, Join, Detach at Silences.
    |

    | Select... | Opens a submenu, where you define, which selection shall be made.
    You can choose between All, None, Left at Playback Position (opens the window
    Set Left Selection Bound, where you can set the starting position of the selection),
    Right at Playback Position (opens the window Set Right Selection Bound, where
    you can set the ending position of the selection), Track Start to Cursor, Cursor
    to Track End. |

    | Find Zero Crossings | Automatically finds positions in the audio material, whose
    amplitude is zero. Thus, interferences are eliminated while cutting, which can
    be caused by suddenly emerging changes of the amplitude. |

    | Move Cursor... | This menu command helps to set the cursor exactly to certain
    positions. Choose in the submenu between to Selection Start, to Selection End,
    to Track Start, to Track End. |

    | Region Save | This command offers the possibility to save a selection, which
    can be retrieved later via the menu command Region Restore. |

    | Region Restore | Restores a previously deleted selection. |

    | Play Region | The submenu offers you the commands Lock and Unlock. If you select
    Lock, the double arrow, which shows the selection, will be displayed in red and
    remains, for example, if you shift the audio track below. The command Unlock removes
    the locking. |

    | Preferences... | Opens the window Audacity Preferences, where you can make individual
    presettings. The possible preferences are described in detail in chapter 6. |


    ## 7.3 View


    | Menu command | Function |

    |---|---|

    | Zoom In | Zooms in on the display of the audio track. If you select this feature
    several times in succession, you can finally see the individual samples and edit
    them if necessary. |

    | Zoom Normal | Shows the normal display of the audio track. |

    | Zoom Out | Zooms out on the display of the audio track. |

    | Fit in Window | Shows the chosen project in a way, so that it fits exactly into
    the display window. |

    | Fit Vertically | Fits the audio track vertically into the display window. |

    | Zoom to Selection | Fits the selection (marking) via zooming in or out respectively,
    so that it exactly fits into the display window. |

    | Collapse All Tracks | Shows the individual tracks of the window in a space-saving
    vertical miniature display. |

    | Expand All Tracks | This command switches from the miniature display of the
    tracks to the normal display. |

    | History... | Opens the window *Undo History*, where you can undo single work
    steps systematically. |

    | Toolbars | Opens the submenu, via which you can show or hide the various toolbars
    respectively. A prefixed check mark shows, that the bar is displayed. Via the
    option *Reset Toolbars*, all bars are displayed again at their by default designated
    position. |


    ## 7.4 Tracks


    | Menu command | Function |

    |---|---|

    | Add New | Opens a submenu, where you can select the type of the new track. You
    can choose between *Audio Track*, *Stereo Track*, *Label Track* and *Time Track*.
    |

    | Stereo Track to Mono | Creates a mono track from the marked stereo recording.
    |

    | Mix and Render | Mixes the marked tracks. |

    | Resample... | Opens the window *Resample*, where you can enter the new sample
    frequency. |

    | Remove Tracks | This command removes the marked tracks from the currently opened
    window. |

    | Align Tracks | Opens a submenu, where you can choose between different commands
    to align the audio track. Hereby, the benchmarks can be the cursor, start or end
    of a selection or further audio tracks. |

    | Align and Move Cursor | Opens a submenu, where you can choose between different
    commands to align the cursor together with the audio track. Hereby, the benchmarks
    can be the cursor, start or end of a selection or further audio tracks. |

    | Add Label at Selection | Adds a label at the current cursor or selection position.
    If there is no label track, it will also be created. |

    | Add Label at Playback Position | Adds a label at the current position of the
    cursor. |

    | Edit Labels | Opens the corresponding window, where you can add, change, import
    or export labels. |

    | Sort tracks | Opens a submenu, where you can choose between *by Start Time*
    (on the timeline) and *by Name*. |


    ## 7.5 Generate


    | Menu command | Function |

    |---|---|

    | Chirp... | Opens the window *Chirp Generator*, where you can create chirps.
    For this purpose, you have to enter a digit sequence in form of letters and numbers,
    set the amplitude (0-1.0) and the duration in seconds. |

    | Noise... | Opens the window *Noise Generator*, where you can create three types
    of noise: *White*, *Pink* and *Brown*. |

    | Silence... | Opens the window *Silence Generator*, where you can enter the duration
    of the silence, which shall be created. If you confirm the entry via the button
    *OK*, the silence will be inserted at the current cursor position. |

    | DTMF Tones... | Opens a tone generator, where you can set the parameters for
    the creation of a sound. If you confirm your entry via the button *OK*, the sound
    will be inserted at the current cursor position. |

    | Tone... | Opens an advanced tone generator, where it is possible to change the
    frequency and amplitude during the runtime of the sound. |'
