- md: ' **Marking over two tracks.**


    To create markings, which extend over several tracks, as illustrated above, do
    as follows:


    - Mark the desired area of an audio track by holding down the mouse button and
    pull the mouse in doing so across all tracks, which shall be selected.

    - First, jump with the up and down arrow keys to the desired track and adopt the
    marking for the selected track via the enter key. If you push the enter key again,
    the marking for this track will be removed again.


    ## 3.3 Editing audio tracks


    For the following examples, a mono recording is used to simplify matters.


    The marked area, which is displayed slightly darker in the picture, can now be
    processed further or, for example, be replaced by audio files, which are in the
    clipboard. You can find the most important commands in the menu *Edit*.


    ### 3.3.1 Cut and delete with preliminary check


    The cutting and deleting of a markedDigitally uncovered area are very similar
    process steps. The only difference between both commands is the fact, that, when
    cutting, the extracted file will be saved in the clipboard.


    A very valuable supporting feature is the preview of the cut. Often, this is the
    only way to evaluate, if the marking has been set right. Use the letter *C* on
    your keyboard to be able to preview a cut.


    You will now, by default, hear the track from one second before the cutting edge
    to one second after the cutting edge and you can, this way, estimate, what the
    cut will be like. You can change the preview time via *Edit > Preferences > Cut
    Preview*.


    Proceed as follows, if you want to cut out the marked area of an audio track:


    - Select the button ![scissors icon] *Cut*.

    - Use the shortcut *Ctrl + X*.

    - Select the menu command *Edit > Cut*.


    You can see, that the command *cut* removes the marked area of the audio track,
    while the right part of the audio track is shifted to the left. When cutting out,
    the extracted part is additionally saved in the clipboard. Following clips are
    shifted or not, depending on the settings in *Edit> Preferences> Interface> Editing
    a clip can move other clips.*


    You can use the following commands to delete material:


    - Use the shortcut *Ctrl + K* or, alternatively, use the Del-button or backspace.

    - Select the menu command *Edit> Delete.*


    The result is initially the same. The difference only consists in the fact, that
    the extracted part will not be copied to the clipboard.


    ### 3.3.2 Cut and split cut


    If you want to cut out the marked area and to split the track, you can select
    one of the following options:


    Use the shortcut *Ctrl + Alt + X*.


    Select the menu command *Edit > Split Cut*.


    In this process step, the marked area is cut from the audio track and the audio
    track is split, resulting in two independent clips.


    ### 3.3.3 Copy


    If you only want to copy the marked area, the display of the audio track does
    not change. For copying, use the following commands:


    Use the button *Copy*.


    Use the shortcut *Ctrl + C*.


    Select the menu command *Edit > Copy*.


    In all cases, the copied file remains in the clipboard and can, for example, be
    inserted into other audio tracks.


    > *Copy saves the marked area in the clipboard.*


    ### 3.3.4 Paste


    A content, which has been saved to the clipboard, can be inserted into respective
    audio tracks as often as desired. For this, the following commands are available:


    Use the button *Paste*.


    Use the shortcut *Ctrl* + *V*.


    Select the menu command *Edit > Paste*.


    **Example for the pasting of audio contents from the clipboard.**


    In the example above, the content of the clipboard has been inserted (marked part
    of the second audio track). But it is also possible to cut a previously marked
    area and to replace it with an audio track, which has been saved to the clipboard.
    In the given example, the marked area of the first audio track is cut out and
    replaced by a considerably shorter section, which shortens the overall length
    of the audio track.


    **Cut out a marking and paste the content to the clipboard.**


    If you try, for example, to insert parts of a stereo audio track into a mono audio
    track, it will be pointed out to you, that this is not possible. The opposite,
    however, is possible.


    **Stereo and mono tracks cannot be mixed.**


    ### 3.3.5 Trim


    Trimming of an audio track achieves a reverse cutting. Do follow:


    1. Use the button `Trim`.

    2. Use the shortcut *Ctrl* + *T*.

    3. Select the menu command *Edit* > *Trim*.


    > **Trimming deletes everything, but the marking.**


    Only the marked area remains in the track and stays on the timeline at its place,
    while everything outside the marking is deleted.


    ### 3.3.6 Split delete


    To use the command *Split Delete*, do as follows:


    Use the shortcut *Ctrl + Alt + K*.


    Select the menu command *Edit > Split Delete*.


    The result of *Split Delete* is two separated clips, while the marked area has
    been deleted. The two clips can now be shifted independently on the timeline via
    the time shift tool.


    ### 3.3.7 Silence Audio


    This command does not separate the audio track, but deletes the marking and then
    overwrites it with silence. The advantage: The audio track keeps its exact length.
    You use the command as follows:


    - Use the button `Silence Audio`.

    - Use the shortcut *Ctrl + L*.

    - Select the menu command *Edit ▸ Silence Audio*.


    **The marked area is cut out and replaced by silence.**


    As you can see in the example above, neither the length of the audio track nor
    the time position of the audio track changes behind the marking.


    ### 3.3.8 Split


    To split the clip at the marking, you can use the following commands:


    Use the shortcut *Ctrl + I*.


    Select the menu command *Edit > Split*.


    **The audio track is separated into three independent clips.**


    You can only see, that the command has been executed, from two horizontal lines,
    which are located where the ends of the marking had been before. They indicate
    that the audio track has been separated here and now consists of three independent
    clips.


    ## 3.4 Command menu


    Here once more the complete command menu:


    | Function | Symbol | Shortcut | Menu command |

    |----------|--------|----------|-------------|

    | Cut | ✂ | Ctrl + X | Edit > Cut |

    | Split Cut |  | Ctrl + Alt + X | Edit > Split Cut |

    | Copy | 📋 | Ctrl + C | Edit > Copy |

    | Paste | 📋 | Ctrl + V | Edit > Paste |

    | Trim | ✂ | Ctrl + T | Edit > Trim |

    | Delete | | Ctrl + K | Edit > Delete |

    | Split Delete | | Ctrl + Alt + K | Edit > Split Delete |

    | Silence Audio | 🔇 | Ctrl + L | Edit > Silence Audio |

    | Split | | Ctrl + I | Edit > Split |

    | Split New | | Ctrl + Alt + I | Edit > Split New |


    ## 3.5 Placing cuts optimally


    Self-produced audio material is seldomly used the way it was recorded. Usually,
    additional editing steps are necessary. The most important editing element for
    audio processing is the cut. The following steps shall instruct you how to optimally
    place a cut with Audacity. The order of the individual steps depends, hereby,
    on the desired result and one''s own vision.


    ### 3.5.1 Cut preview


    If you have placed a marking for a cut, you can listen to the result beforehand
    and, if necessary, make changes, before you finalise the cut. This feature is
    called *Cut Preview*, which you activate as follows: Select the key C on your
    keyboard.


    By default, you will now hear from one second before the cutting edge to one second
    after the cutting edge, which enables you to estimate what the cut will be like.


    The horizontal as well as in the middle discontinued line above the audio track
    shall hereby display the playback region of the feature *Cut Preview* in the standard
    settings.


    The length of the preview can be set individually in the window *Audacity Preferences*,
    which can be opened via the menu *Edit> Preferences* or the shortcut *Ctrl + P*,
    in the register *Audio I/O* at *Cut Preview*.'
  mdcn: '

    **跨轨道标记。**


    要创建跨多个轨道的标记，如上所述，请按以下步骤操作：


    - 按住鼠标按钮，在音频轨道上标记所需区域，并在操作过程中拖动鼠标跨越所有要选择的轨道。

    - 首先，使用上下方向键跳转到所需轨道，然后通过回车键采用该轨道的标记。如果再次按回车键，该轨道的标记将被取消。


    ## 3.3 编辑音轨


    以下示例中，为简化起见，使用了单声道录音。


    图片中显示为稍暗的标记区域，现在可以进一步处理，或者例如用剪贴板中的音频文件替换。最重要的命令可以在*编辑*菜单中找到。


    ### 3.3.1 剪切和删除（带预览检查）


    标记区域的剪切和删除是非常相似的操作步骤。两个命令唯一的区别是，剪切时提取的文件会保存到剪贴板。


    一个非常实用的辅助功能是剪切预览。通常，这是评估标记是否设置正确的唯一方法。使用键盘上的字母*C*可以预览剪切。


    默认情况下，你将听到从剪切点前一秒到剪切点后一秒的轨道内容，这样你就可以估计剪切的效果。你可以通过*编辑 > 首选项 > 剪切预览*更改预览时间。


    如果你想剪切掉音频轨道的标记区域，请按以下步骤操作：


    - 选择![剪刀图标] *剪切*按钮。

    - 使用快捷键 *Ctrl + X*。

    - 选择菜单命令 *编辑 > 剪切*。


    你可以看到，*剪切*命令会移除音频轨道的标记区域，而音频轨道的右侧部分会向左移动。剪切时，提取的部分还会额外地保存到剪贴板。后续片段是否移动，取决于*编辑
    > 首选项 > 界面 > 编辑片段可以移动其他片段*中的设置。


    你可以使用以下命令删除素材：


    - 使用快捷键 *Ctrl + K*，或者使用 Del 键或退格键。

    - 选择菜单命令 *编辑 > 删除*。


    结果最初是相同的。区别仅在于提取的部分不会被复制到剪贴板。


    ### 3.3.2 剪切和拆分剪切


    如果你想剪切掉标记区域并分割轨道，可以选择以下选项之一：


    使用快捷键 *Ctrl + Alt + X*。


    选择菜单命令 *编辑 > 拆分剪切*。


    在此操作步骤中，标记区域从音频轨道中被剪切掉，音频轨道被分割，形成两个独立的片段。


    ### 3.3.3 复制


    如果你只想复制标记区域，音频轨道的显示不会改变。复制时，请使用以下命令：


    使用 *复制* 按钮。


    使用快捷键 *Ctrl + C*。


    选择菜单命令 *编辑 > 复制*。


    在所有情况下，复制的文件都会保留在剪贴板中，例如可以插入到其他音频轨道中。


    > *复制将标记区域保存到剪贴板。*


    ### 3.3.4 粘贴


    保存到剪贴板的内容可以按需要多次插入到相应的音频轨道中。为此，可使用以下命令：


    使用 *粘贴* 按钮。


    使用快捷键 *Ctrl* + *V*。


    选择菜单命令 *编辑 > 粘贴*。


    **从剪贴板粘贴音频内容的示例。**


    在上面的示例中，剪贴板的内容已被插入（第二个音频轨道的标记部分）。但也可以剪切先前标记的区域，并用保存到剪贴板的音频轨道替换它。在给定的示例中，第一个音频轨道的标记区域被剪切掉，并用一个明显更短的片段替换，从而缩短了音频轨道的总长度。


    **剪切标记并将内容粘贴到剪贴板。**


    如果你尝试将立体声音频轨道的部分插入到单声道音频轨道中，系统会提示你这不是不可能的。相反的情况则可行。


    **立体声和单声道轨道不能混用。**


    ### 3.3.5 修剪


    修剪音频轨道相当于反向剪切。请按以下步骤操作：


    1. 使用 `Trim` 按钮。

    2. 使用快捷键 *Ctrl* + *T*。

    3. 选择菜单命令 *编辑* > *修剪*。


    > **修剪会删除除标记以外的所有内容。**


    只有标记区域保留在轨道中，并保持在时间轴上的原位置，而标记外的所有内容都会被删除。


    ### 3.3.6 拆分删除


    要使用 *拆分删除* 命令，请按以下步骤操作：


    使用快捷键 *Ctrl + Alt + K*。


    选择菜单命令 *编辑 > 拆分删除*。


    *拆分删除* 的结果是两个分离的片段，标记区域已被删除。现在可以通过时间偏移工具在时间轴上独立移动这两个片段。


    ### 3.3.7 静音音频


    此命令不会分离音频轨道，而是删除标记并用静音覆盖它。优点是：音频轨道保持其精确长度。使用该命令的方法如下：


    - 使用 `Silence Audio` 按钮。

    - 使用快捷键 *Ctrl + L*。

    - 选择菜单命令 *编辑 ▸ 静音音频*。


    **标记区域被剪切并用静音替换。**


    如上例所示，音频轨道的长度以及标记后方音频轨道的时间位置都不会改变。


    ### 3.3.8 拆分


    要在标记处拆分片段，可以使用以下命令：


    使用快捷键 *Ctrl + I*。


    选择菜单命令 *编辑 > 拆分*。


    **音频轨道被分割成三个独立的片段。**


    你只能从两条水平线看出命令已执行，这两条线位于之前标记结束的位置。它们表示音频轨道已在此处分离，现在由三个独立的片段组成。


    ## 3.4 命令菜单


    这里再次列出完整的命令菜单：


    | 功能 | 符号 | 快捷键 | 菜单命令 |

    |----------|--------|----------|-------------|

    | 剪切 | ✂ | Ctrl + X | 编辑 > 剪切 |

    | 拆分剪切 |  | Ctrl + Alt + X | 编辑 > 拆分剪切 |

    | 复制 | 📋 | Ctrl + C | 编辑 > 复制 |

    | 粘贴 | 📋 | Ctrl + V | 编辑 > 粘贴 |

    | 修剪 | ✂ | Ctrl + T | 编辑 > 修剪 |

    | 删除 | | Ctrl + K | 编辑 > 删除 |

    | 拆分删除 | | Ctrl + Alt + K | 编辑 > 拆分删除 |

    | 静音音频 | 🔇 | Ctrl + L | 编辑 > 静音音频 |

    | 拆分 | | Ctrl + I | 编辑 > 拆分 |

    | 拆分新建 | | Ctrl + Alt + I | 编辑 > 拆分新建 |


    ## 3.5 优化剪切位置


    自制音频素材很少直接按录制的方式使用。通常需要额外的编辑步骤。音频处理中最重要的编辑元素是剪切。以下步骤将指导你如何在 Audacity 中优化剪切位置。各个步骤的顺序取决于所需结果和个人构思。


    ### 3.5.1 剪切预览


    如果你已为剪切设置了标记，可以在最终确定剪切之前先听一下结果，并在必要时进行修改。此功能称为 *剪切预览*，激活方法如下：选择键盘上的 C 键。


    默认情况下，你现在将听到从剪切点前一秒到剪切点后一秒的内容，这样你就可以估计剪切的效果。


    音频轨道上方水平以及中间间断的线表示 *剪切预览* 功能在标准设置中的播放区域。


    预览长度可以在 *Audacity 首选项* 窗口中单独设置，该窗口可通过 *编辑 > 首选项* 或快捷键 *Ctrl + P* 打开，在 *音频 I/O*
    选项卡的 *剪切预览* 处进行设置。

