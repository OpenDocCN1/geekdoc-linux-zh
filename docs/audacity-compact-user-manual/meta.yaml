- img_proc: true
  md: 'In the section *Behaviors* you find these options:


    +   - **Update display while playing:** If this option is selected, the current
    playback section is continuously shown in the programme window.

    - **Closing last window quits Audacity:** This feature is selected by default
    and causes the shutdown of the programme Audacity itself, after closing the last
    Audacity window via the menu command *File> Exit* or the button *[X]*. This is
    the usual performance of Windows programmes. If this feature is deselected, a
    new empty document will be opened automatically after closing the last Audacity
    window. To exit Audacity, you then have to use the menu command *File> Exit*.

    - **Enable dragging of left and right selection edges:** This by default selected
    option enables the subsequent changing of a right or left marking border. If you
    work in this connection with the mouse, the mouse pointer will change its form
    into a hand with outstretched index finger.

    - **Ergonomic order of audio I/O buttons:** This option arranges the controls
    more ergonomically to enable faster working. The following figures show the difference.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_122_0.png)


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_122_1.png)


    +   - **Automatically fit tracks vertically zoomed:** If this feature is selected,
    the audio tracks are automatically vertically fitted when opened.

    - **"Move track focus" cycles repeatedly through tracks:** This option enables
    you to jump from the last to the first audio track or vice versa via the arrow
    keys when marking.'
  merge: -1
  pgno: 122
- img_proc: true
  md: '+   - **Editing a clip can move other clips**: This by default selected feature
    causes that independent clips, which are to the right of a cut in the same audio
    track, shift to the left by the length of the cut marking.

    - **Select all audio in project, if none selected**: This option is selected by
    default. It causes, that work steps, which need a selection such as effects, are
    applied onto the whole project by default, as long as no explicit selection in
    the form of a marking has been made.

    - **Beep on completion of longer activities**: After the completion of longer
    activities, an acoustic signal is generated to indicate the end of the processing
    to the user. In Windows, the acoustic signal only sounds, if the playback of an
    programme activity *Standard Sound Alert* is activated in the system control at
    *Sounds and Audio Devices*.

    - **Language**: Select the desired language via the pull-down menu. For a correct
    display of the language, a respective font has to be installed where necessary.

    - **Display range minimum: meters and ''Waveform (dB)'':** Hereby, you set the
    display of the vertical scale when shown in *Wave form (dB)*, whereat the chosen
    value represents the *zero* level.

    - **Enable cut lines**: If this option is selected, so-called cut lines are shown
    when using the feature *Cut* at those positions, where audio files have been cut
    out of the audio track. By clicking onto the cut line with the left mouse button,
    the respective cut can be undone. If you click onto the cut line with the right
    mouse button, the cut line is removed.

    - **Show warnings about temp files**: Usually, it will be pointed out to you at
    every programme start, if there still are temporary files in the Audacity folder,
    e. g. after a crash or a blackout. You can turn this off here. This setting is
    mainly interesting for developers of Audacity and of no importance for the normal
    usage of the programme.

    - **Show prompt to save, even if project is empty**: This option is selected by
    default and causes, that you are asked if you also want to save empty projects.
    It is usually not necessary to change this setting.

    - **Show Welcome Message at program start up**: If this option is selected, the
    window *Welcome to Audacity* will be shown at every start of the programme.

    - **CleanSpeech Mode (Customized GUI)**: This option expands the control tools
    to one more button, via which the batch processing *Clean Speech* can be accessed.
    Furthermore, several features and surface elements of Audacity are adjusted to
    provide an optimised workflow for the corrections of speech recordings.'
  merge: -1
