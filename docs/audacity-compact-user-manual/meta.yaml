- md: ' By now, Audacity has evolved from an insider tip to the probably best known
    software of its kind. Ever since the release of the first version of Audacity,
    the programme has been downloaded over 40 million times just from the official
    homepage alone. Furthermore, the software is available on countless download sites
    on the Internet and is enclosed on booklet-CDs in computer magazines all over
    the world. A google-search for "audio editor" leads directly to Audacity''s homepage.
    Although Audacity in the meantime is not the only free programme for editing of
    audio data anymore, many users, who for example appreciate the easy and intuitional
    operatability, favour it to other similar applications. Despite its popularity,
    Audacity is still developed further by volunteers in their spare time. I myself
    have been part of this pleasant team of dedicated software developers from all
    over the world since 2003.


    With this book, we want to give you all the information you need to apply Audacity
    reasonably. The author, Markus Priemer, made a point of giving you both an overview
    of the handling of the programme as well as a detailed description of every function.
    Furthermore, you will find interesting background information, for example about
    microphone technologies, as well as several step-by-step tutorials.


    You are in good company, no matter if you are playing in a band and want to edit
    your recordings with Audacity, or if you use the programme as a journalist, editor
    or podcaster to edit your interviews or articles. It is clear: A free software
    does of course not replace neither singing lessons nor the studies of audio engineering,
    but Audacity is a tool, with which people can express their creativity. On this
    note, I wish you a fun time and success while reading this book.


    Yours,


    Markus Meyer


    Markus Meyer, graduated computer scientist, was born in 1979 and has been a member
    of the "Audacity Technical Leadership Council" since 2005, which is responsible
    for the further development of Audacity. He is CEO of a software engineering company
    and lives and works in Nuremberg, Germany. For further details, contact Markus
    Meyer by e-mail: *markus@audacityteam.org*.


    ## 1 Introduction


    The following introduction is intended for those who are not familiar with the
    basic terms and procedures in the field of audio techniques. Only a very rough
    overview will be given, which shall assist to get a basic understanding of the
    subject. Basic physical correlations and related terms will not only help later
    on for a better understanding of the programme Audacity and the tasks, which can
    be realized with it, but will also help in many cases to achieve better results.
    We shall cover a wider range of topics, beginning with analogue acoustic waves
    and ending with digital audio recording. Additionally, we will also take a look
    at the compression of audio data and microphone technics in this chapter.


    ## 1.1 Sounds, sound waves and digital audio


    Sounds are sound waves, which – from a physical point of view – form barometric
    variations, which are strung together. However, only sound waves, which can be
    heard by us humans, with frequencies of about 16 to 20,000 Hz or 20 kHz respectively,
    are called sounds. The frequency indicates in this context, how often the sound
    wave oscillates per second. At the same time, the frequency also defines the physical
    length of a sound wave. The formula for this is:


    Acoustic Velocity = Length of Sound Wave / Frequency


    The acoustic velocity is, however, furthermore dependent on the medium, in which
    the sound wave moves. Relevant properties are in this case the mass density and
    the respective temperature. Sound waves cannot move in a vacuum due to the lack
    of medium.


    In the air, acoustic velocity is for example about 760 mph at 59 °F and decelerates
    consistently with falling temperature. Barometric pressure on the other hand has
    no effect on acoustic velocity, even though this has often incorrectly been assumed.


    | Medium | Temperature | Acoustic Velocity |

    |---|---|---|

    | Air | 59 °Fahrenheit | 760 mph |

    | Air | 32 °Fahrenheit | 740 mph |

    | Water | 68 °Fahrenheit | 3,320 mph |

    | Aluminium | 68 °Fahrenheit | 11,408 mph |


    **Examples of acoustic velocities.**


    For humans, the most important transport medium for sound waves is the air. From
    a temperature of 59 °F the following wave lengths exemplary result. Other frequencies
    can also be calculated easily with the aid of the beforehand mentioned formula.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_11_0.png)


    **Wavelengths of different frequencies.**


    Sound waves below 16 Hz, the lowest frequency audible for humans, are called infrasound.
    These are probably used for communication by blue whales, elephants and giraffes.


    On the other side of the scale, in the range not audible for humans, from about
    20 kHz (20,000 oscillations per second) to 1 gHz (1 billion oscillations per second)
    the sound waves are called ultrasound. The possibilities for the use of these
    sound waves are extremely diversified. Thus, ultrasound is used for instance in
    medical science as a diagnostic imaging technique or to remove calculus and to
    break up kidney stones. It is, furthermore, used in seafaring for measuring water
    depths, locating shoals and for navigating, and in materials engineering for example
    for non-destructive material testing.


    But let us return to those sound waves, which are audible for humans. Many mediums
    are limited to a frequency range, which is necessary for hearing or communicating.
    On the one hand, this has very practical reasons, for example to store a sufficient
    number of songs on a CD, or with regards to telephony, because it is simply cheaper
    to build a microphone or a speaker respectively, which only records or reproduces
    a relatively small frequency range.


    Here are some examples:


    | Medium | Sample Frequency | Frequency Range | Channels | Sample format |

    |---|---|---|---|---|

    | Telephone | 8 kHz | 300 - 3400 | mono | 8 bit |

    | AM Radio | 11,025 kHz | 50 - 5000 | mono | 8 bit |

    | FM Radio | 20.05 kHz | 20 - 15000 | stereo | 16 bit |

    | CD | 44.1 kHz | 20 - 20000 | stereo | 16 bit |

    | DAT-Recorder | 48 kHz | 20 - 20000 | stereo | 16 bit |

    | Audio-DVD | 44.1 to 192 kHz | 20 - 20000 | stereo or up to max. 6 channels |
    16, 20 or 24 bit |


    The development of digital technique finally brought the distinction between analogue
    and digital signals.


    If you record, for example, analogue sounds like speech or singing with a microphone
    using a tape recorder, the result will stay analogue. The analogue signal can
    in this case take every possible value of a certain scale.


    However, if you save an audio signal via computer, the signal will be digitised,
    which means that it is converted into discrete, that is integral, numerical values.
    The analogue digital converter and for the reconversion the digital analogue converter
    (a/d, d/a converter) are hereby used, which are both located on the sound card.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_13_0.png)


    In this process, which is also called quantisation, the analogue signal is measured
    in certain intervals (the so-called sampling rate) and converted into a discrete
    value. In the following figure, every vertical line stands for such a sampling
    sequence.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_14_0.png)


    **Sampling of an analogue signal.**


    The calculated value is allocated to the next raster value by rounding up or down.
    The following figure of the measured and converted values shows clearly the disadvantages
    of this method. The horizontal lines are here the converted raster values.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_15_0.png)


    > Rounding up or down respectively of the measurement results to given raster
    values.


    The difference between the calculated value and the next possible raster value
    displays the error of quantisation. This error occurs, because the sampled value
    of the signal does not always lie exactly on the given value of the used raster
    and, therefore, has to be rounded up or down. This consequentially causes minimal
    divergencies of the digital signal in comparison with the original one.


    The advantages of digitalisation are, however, obvious: digital data is a lot
    easier to process and to handle, does not underlie any aging process and, moreover,
    they can be copied as often as you want to without any loss in quality. The data
    can, furthermore, be saved very efficiently in digital form through compression
    or be made available worldwide via the Internet.'
  mdcn: "\n 如今，Audacity 已从一个小众推荐软件发展成为同类软件中知名度最高的程序。自 Audacity 首个版本发布以来，仅官方主页的下载量就超过了\
    \ 4000 万次。此外，该软件在互联网上无数下载站点均可获取，并被收录于全球各地电脑杂志的附赠光盘中。在 Google 搜索\"音频编辑器\"会直接跳转到\
    \ Audacity 的主页。尽管 Audacity 已不再是唯一免费的音频编辑软件，但许多用户——例如那些欣赏其简洁直观操作性的用户——仍然偏爱它而非其他类似应用。尽管广受欢迎，Audacity\
    \ 仍然由志愿者在业余时间持续开发。我本人自 2003 年起就加入了这支由全球各地专注的软件开发者组成的愉快团队。\n\n通过本书，我们希望为您提供合理运用\
    \ Audacity 所需的全部信息。作者马库斯·普里梅尔（Markus Priemer）特别注重为您提供程序操作概览以及对每项功能的详细描述。此外，您还将找到有趣的背景信息，例如关于麦克风技术的知识，以及多个分步教程。\n\
    \n无论您是乐队成员想要用 Audacity 编辑录音，还是作为记者、编辑或播客使用该程序来编辑采访或文章，您都与优秀者为伍。显然：免费软件当然不能替代声乐课或音频工程的学习，但\
    \ Audacity 是一个可以让人们表达创造力的工具。在此，祝您阅读本书时乐在其中、收获成功。\n\n此致，\n\n马库斯·迈耶（Markus Meyer）\n\
    \n马库斯·迈耶，计算机科学专业毕业，1979 年出生，自 2005 年起担任\"Audacity 技术指导委员会\"成员，负责 Audacity 的进一步开发。他是一家软件工程公司的首席执行官，在德国纽伦堡生活和工作。如需了解更多详情，请通过电子邮件联系马库斯·迈耶：*markus@audacityteam.org*。\n\
    \n## 1 引言\n\n以下引言面向那些不熟悉音频技术领域基本术语和流程的读者。这里仅提供非常粗略的概述，以帮助建立对该主题的基本理解。基本的物理关联和相关术语不仅有助于日后更好地理解\
    \ Audacity 程序及其可完成的任务，而且在很多情况下也有助于获得更好的结果。我们将涵盖广泛的主题，从模拟声波开始，到数字音频录制结束。此外，在本章中我们还将探讨音频数据压缩和麦克风技术。\n\
    \n## 1.1 声音、声波与数字音频\n\n声音即声波，从物理角度来看，它们是由连续的气压变化组成的。然而，只有那些我们人类能够听到的声波才被称为声音，其频率约为\
    \ 16 至 20,000 Hz 或 20 kHz。频率在此表示声波每秒振动的次数。同时，频率也决定了声波的物理长度。其公式为：\n\n声速 = 声波波长\
    \ / 频率\n\n然而，声速还取决于声波传播的介质。相关属性包括质量密度和相应温度。由于缺乏介质，声波无法在真空中传播。\n\n在空气中，例如 59 °F\
    \ 时声速约为 760 mph，且随温度下降而持续降低。另一方面，气压对声速没有影响，尽管这一点常被错误地假设。\n\n| 介质 | 温度 | 声速 |\n\
    |---|---|---|\n| Air | 59 °Fahrenheit | 760 mph |\n| Air | 32 °Fahrenheit | 740\
    \ mph |\n| Water | 68 °Fahrenheit | 3,320 mph |\n| Aluminium | 68 °Fahrenheit\
    \ | 11,408 mph |\n\n**声速示例。**\n\n对人类而言，声波最重要的传播介质是空气。以下示例列出了 59 °F 时的波长结果。借助前述公式，其他频率也可以轻松计算。\n\
    \n![](img/1c450b361ffe9eaa5c4ff276786cfd26_11_0.png)\n\n**不同频率的波长。**\n\n低于 16\
    \ Hz（人类可听最低频率）的声波称为次声波。蓝鲸、大象和长颈鹿可能利用这些声波进行交流。\n\n在光谱的另一端，人类听不到的范围内，从约 20 kHz（每秒\
    \ 20,000 次振动）到 1 GHz（每秒 10 亿次振动）的声波称为超声波。这些声波的用途极为广泛。例如，超声波在医学中用作诊断成像技术，或用于去除牙结石和粉碎肾结石；在航海中用于测量水深、探测鱼群和导航；在材料工程中用于无损检测等。\n\
    \n但让我们回到人类可听范围内的声波。许多介质仅限于对听觉或交流必需的频率范围。一方面，这有非常实际的原因，例如为了能在 CD 上存储足够数量的歌曲，或者就电话而言，仅仅因为制造只记录或重放相对较小频率范围的麦克风或扬声器更便宜。\n\
    \n以下是一些示例：\n\n| 介质 | 采样频率 | 频率范围 | 通道 | 采样格式 |\n|---|---|---|---|---|\n| Telephone\
    \ | 8 kHz | 300 - 3400 | mono | 8 bit |\n| AM Radio | 11,025 kHz | 50 - 5000 |\
    \ mono | 8 bit |\n| FM Radio | 20.05 kHz | 20 - 15000 | stereo | 16 bit |\n| CD\
    \ | 44.1 kHz | 20 - 20000 | stereo | 16 bit |\n| DAT-Recorder | 48 kHz | 20 -\
    \ 20000 | stereo | 16 bit |\n| Audio-DVD | 44.1 to 192 kHz | 20 - 20000 | stereo\
    \ or up to max. 6 channels | 16, 20 or 24 bit |\n\n数字技术的发展最终带来了模拟信号与数字信号之间的区分。\n\
    \n例如，如果您使用磁带录音机配合麦克风录制语音或歌唱等模拟声音，结果将保持模拟状态。在这种情况下，模拟信号可以取某个范围内的任意值。\n\n然而，如果您通过计算机保存音频信号，信号将被数字化，即转换为离散的、也就是整数的数值。这里使用的是模数转换器，以及用于反向转换的数模转换器（a/d、d/a\
    \ 转换器），两者都位于声卡上。\n\n![](img/1c450b361ffe9eaa5c4ff276786cfd26_13_0.png)\n\n在这个也称为量化的过程中，模拟信号以固定的间隔（即所谓的采样率）进行测量，并转换为离散值。在下图中，每条垂直线代表一次采样序列。\n\
    \n![](img/1c450b361ffe9eaa5c4ff276786cfd26_14_0.png)\n\n**模拟信号的采样。**\n\n计算值通过四舍五入分配到最接近的栅格值。下图的测量和转换值清楚地展示了这种方法的缺点。这里的水平线即为转换后的栅格值。\n\
    \n![](img/1c450b361ffe9eaa5c4ff276786cfd26_15_0.png)\n\n> 测量结果分别向上或向下取整到给定的栅格值。\n\
    \n计算值与最近可能栅格值之间的差值即为量化误差。这种误差的出现，是因为信号的采样值并不总是恰好落在所用栅格的给定值上，因此必须向上或向下取整。这必然导致数字信号与原始信号相比存在微小的偏差。\n\
    \n然而，数字化的优势是显而易见的：数字数据更易于处理和操作，不会经历老化过程，而且可以无次数限制地复制而没有任何质量损失。此外，数据还可以通过压缩以数字形式高效保存，或通过互联网向全球提供。\n"
