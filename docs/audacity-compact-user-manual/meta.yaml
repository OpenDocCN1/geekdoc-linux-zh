    may only start and end at integer seconds. A format for video films, such as *hh:mm:ss
    + PAL frames* (25 *fps*), has the advantage, that the sound editing exactly matches
    the screen change, so that frame accurate editing is possible. This avoids, furthermore,
    needless clicking and other disturbances in the audio track, which can occur otherwise.'
