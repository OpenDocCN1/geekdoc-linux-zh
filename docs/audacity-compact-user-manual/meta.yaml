    - 使用 !静音（!Silence）按钮。

    - 使用快捷键 *Ctrl* + *L*，或者使用 Del 键或退格键。

    - 选择菜单命令 *编辑 > 静音音频*（*Edit>Silence Audio*）。


    通过轨道标题的上下文菜单，您可以重命名标签轨道、选择字体，以及上下移动轨道。


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_73_0.png)


    标签轨道的上下文菜单及其他窗口。


    说明：


