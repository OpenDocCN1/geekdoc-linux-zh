  md: '# 5 Effects


    Depending on the operating system you work with, a number of effects are available
    to you after the setup. This is, amongst others, due to the fact that some effects
    have only been developed for certain operating systems. The built-in effects will
    be surveyed in this chapter and, concludingly, the installation of further optional
    effects will be described.


    # 5.1 Appliance of effects


    For those, who have not been working with audio editing for too long yet, applying
    effects can quickly become frustrating, because often the desired effect cannot
    be achieved exactly. Here the mode of operation, which will be described in the
    following, can put things right, since it is useful to isolate an effect and then
    mix it in controlledly.


    In the following, it will be shown, how you have to proceed to mix in the effect
    *BassBoost* systematically. To simplify matters and for a better overview, we
    will work with a mono track in this example. The procedure, however, can also
    be adapted to stereo tracks without difficulty.


    First of all, start Audacity.


    +   - Open an audio track via the menu command *File > Import > Audio*.

    - Mark the whole audio track by clicking on an empty spot in the header of the
    track. The track will now be displayed slightly darker.

    - Duplicate the track via the menu command *Edit > Duplicate* or respectively
    via the shortcut *Ctrl + D*. You should now see two identical audio tracks.

    - Mark the lower audio track and execute the effect *Reverse*. This effect reverses
    the polarity of the chosen audio material.

    - Make another copy of the original track by marking it and using the menu command
    *Edit > Duplicate* or via the shortcut *Ctrl + D*. You should now see the original
    track, the reversed track and the copy of the original track.'
  merge: -1
  pgno: 88
- img_proc: true
  md: '+   - Now apply the desired effect on the copy of the original. In this example,
    we use the bass boost of 4 dB at 200 Hz.

    - Now mark the copy of the original track, which has been processed with the effect,
    and the reversed track by clicking into the respective headers of the track while
    holding down the shift button. Create a new track out of both of them via the
    menu command *Tracks > Mix and Render*.

    - Now play both of the tracks together and adjust the proportion between original
    track and effect via the output level meter of both of the audio tracks.

    - When you found the right mixing proportion, mark both tracks (*Ctrl + A* or
    hold *Shift + mouse click* in the header of the track) and select the menu command
    *Tracks > Mix and Render*.


    This approach to isolate effects and mix them in systematically offers several
    new and fascinating possibilities. For instance, you can apply effects on already
    isolated effects or create as many effects as you want to, compatible to the runtime,
    to mix them in precisely, e. g. via the envelope tool.


    However, pay attention to the fact that simultaneous overlapping of many effects
    can cause an amplification of the audio signals, which can quickly lead to clipping,
    meaning overload. Therefore, you should preferably activate the menu command *View
    > Show Clipping*. Clippings will then be shown as red vertical lines in the audio
    track. You can avoid clippings by reducing the volume of all tracks.


    # 5.2 Standard effects


    Here, those effects shall be examined closer, which are, by default, included
    in Audacity. Many effects offer the possibility of previewing, the duration of
    which you can set individually. For this, open the window *Audacity Preferences*
    via the menu command *Edit > Preferences* and set the length of the feature there
    within *Effects Preview*.'
  merge: -1
  pgno: 89
- img_proc: true
  md: '# 5.2.1 Fade in/out


    The effects *Fade In* and *Fade Out* offer no further setting options. They fade
    out the marked area of the audio track smoothly to silence or, respectively, fade
    in smoothly from silence. Alternatively to this effect, the envelope tool can
    be used.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_90_0.png)


    > **The effect Fade Out.**


    You can see the result even better, if you generate a constant sound via the sound
    generator and then apply the effect *Fade In* or *Fade Out*.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_90_1.png)


    > **Fading in and out of a constant sound.**'
  merge: -1
  pgno: 90
- img_proc: true
  md: '# 5.2.2 Auto duck


    This effect offers the possibility to modify the audio track automatically, in
    order to fade in another track. A new control track is necessary, which has to
    be placed directly underneath the marked audio track, which shall be modified.
    This effect can be used, for example, for announcements by DJs or for narrated
    translations.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_91_0.png)


    > The options for settings for the effect *Auto Duck*.'
  merge: -1
  pgno: 91
- img_proc: true
  md: 'You can set the following preferences:


    +   - **Duck amount:** Here you can set the volume reduction of the audio track.
    The default setting is -12 dB.

    - **Maximum pause:** Maximum length of pauses in the selected track.

    - **Outer fade down/up length:** Sets the fading out and in before and after importing
    the control track.

    - **Inner fade down/up length:** Sets the fading out and in within the control
    track.


    # 5.2.3 Bass boost


    With this effect you can boost basses systematically. The chosen frequency can,
    hereby, be increased by between 0 to 36 dB in the process. In the given example,
    a boost of 4 dB at 200 Hz was chosen.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_92_0.png)


    **The window *Bass Boost*.**


    The two settings:


    +   - **Frequency (Hz):** Here you set the frequency to be boosted. Possible values
    are 1-1000 Hz.

    - **Boost (dB):** Determine the boost, whereupon a boost of maximum 36 dB is possible.'
  merge: -1
  pgno: 92
- img_proc: true
  md: '# 5.2.4 Echo


    This effect causes an echo, whose delay and strength you can select. The settings:


    +   - **Delay time (seconds):** Here you set the time lag between the original
    signal and the effect signal.

    - **Decay factor:** In this array you can set the decay factor for the echo. Values
    smaller than one cause a decay of the signal, whereas values bigger than one cause
    a respective boost.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_93_0.png)


    # 5.2.5 Equalization


    With the aid of equalization, you can increase or reduce respectively certain
    frequencies. For this, two different perspectives are available: one, where the
    frequency curve can be drawn with the aid of the mouse; and the graphic equalization,
    which offers 31 wave bands per 1/3 octave width. The settings can in this case
    be carried out via sliders. Curves can be created and saved individually.'
  merge: -1
  pgno: 93
- img_proc: true
  md: '![](img/1c450b361ffe9eaa5c4ff276786cfd26_94_0.png)


    Graphic equalization with 31 sliders.


    The following settings are available:


    +   - **Draw curves**: Offers the view of the equalization, where you can draw
    a curve with the aid of the mouse, whereupon the frequencies are increased or
    reduced.

    - **Graphic EQ**: This view of the equalization offers 31 wave bands per 1/3 octave
    width, whose increase or decrease you can set via the available sliders.

    - **Dropdown box**: Here you can choose between the different interpolation methods:
    *B-spline*, *Cosine* and *Cubic* are available.

    - **Length of filter**: Via the slider you can regulate the length of the filter.
    The following applies hereby: The further to the left the slider is, the'
  merge: -1
  pgno: 94
- img_proc: true
  md: '+   - longer the filter, and the further to the right the slider, the more
    point-shaped the filter.

    - **Select curve:** In this dropdown box, different preset curves are already
    available. If you save a curve, you will, furthermore, find it in this dropdown
    box under the saved name as well.

    - **Save As:** Opens a window, where you can enter the title for your equalization
    curve.

    - **Delete:** Deletes the chosen curve.

    - **Flat:** Sets all wave bands to 0 dB.


    # 5.2.6 Change speed


    This effect changes the replay tempo and at the same time the pitch. The values
    can be set via the slider with the aid of the mouse or they can be entered directly
    into the array. Furthermore, the different speeds of vinyl disc records are available
    as default values.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_95_0.png)'
  merge: -1
  pgno: 95
- img_proc: true
  md: 'The settings:


    +   - **Percent Change**: Enter the desired tempo change in percent here.

    - **Standard Vinyl RPM from/to**: In this dropdown box the most popular replay
    speeds of vinyl records are preset in revolutions per minute (rpm).


    # 5.2.7  Invert


    This effect causes a phase inversion and does not offer further setting options.
    All negative amplitudes of the chosen audio material become positive and all positive
    sample amplitudes become negative. This effect can be seen very well in the augmented
    view of an audio track.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_96_0.png)


    **At the top the original track and below the inverted track.**'
  merge: -1
  pgno: 96
- img_proc: true
  md: 'Both tracks will cancel each other out and create no sound, when replayed together.


    # 5.2.8 Click removal


    The click removal removes short pulsating background noises. Therefore, this tool
    is extremely useful for example to remove clicks and pops, which result e. g.
    when digitising vinyl records.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_97_0.png)


    **Settings for the click removal.**


    You can set the level via the threshold, from which the filter identifies an impulse
    as interference, while the pulse width sets the maximum length. The settings:


    +   - **Select threshold (lower is more sensitive):** Here you select the threshold,
    from which the click removal shall be applied. The lower the chosen value, the
    sooner the filter applies.

    - **Max spike width (higher is more sensitive):** Here you set the width, from
    which interferences are taken into account. The higher you choose the value, the
    shorter interferences are removed.'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# 5.2.9 Compressor


    The compressor has the function to reduce the dynamic range of audio signals to
    obtain a more evenly volume. For this purpose, the volume of louder passages is
    reduced, while lower passages are respectively amplified.


    You can change the following settings:


    +   - **Threshold**: Sets the level value, from which the compressor works. Possible
    values are from -60 dB to -1 dB.

    - **Ratio**: Sets the ratio, in which the loud parts (above the threshold) are
    adjusted to the lower ones (from 1.5 to 1 to 10 to 1).

    - **Attack Time**: Here you can control the reaction rate of the effect.

    - **Decay Time**: Enter the length of the effect here.

    - **Normalize to 0 dB after compressing**: If you have selected this option, the
    audio signal, which has been reduced after the compression in its dynamic range,
    will be boosted to 0 dB again.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_98_0.png)


    The compressor for reducing the dynamic range.'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# 5.2.10    Leveller


    The leveller is also used for the approximation of soft and loud parts of an audio
    track. However, the setting options for the degree of leveling and the threshold
    for noise are limited. For the degree of leveling, you can choose between five
    steps, while you can choose from -20 dB in five-point steps to -80 dB for the
    threshold for noise.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_99_0.png)


    The leveller for the approximation of volumes.


    The two settings:


    +   - **Degree of Leveling**: Here, you can choose between five possible steps.

    - **Threshold for Noise**: The threshold for noise can be chosen from -20 dB to
    -80 dB in five-point steps.


    # 5.2.11    Normalize


    This effect makes it one the one hand possible to boost the level of audio material,
    which has been recorded with a too low input level, and on the other hand it enables
    the approximation of different audio tracks at a constant volume.'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'Moreover, the effect makes it possible to remove direct current offsets, which
    might exist in the audio signal.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_100_0.png)


    > **The window *Normalize*.**


    The settings:


    +   - **Remove any DC offset (center on 0.0 vertically):** With this option, any
    existing direct current offset in the audio signal can be removed. This is a matter
    of vertical shifting of the wave form, which is often caused by basic sound cards
    while recording via microphone.

    - **Normalize maximum amplitude to:** This option reduces or boosts the volume
    until the loudest part has reached the given value. This effect can be applied
    at most until the distortion-free volume of 0 dB.


    # 5.2.12 Nyquist prompt


    Interface, which makes inputs in the programming language Nyquist possible to
    generate plug-ins. You can find an introduction about it on the Internet at the
    address: *http://audacity.sourceforge.net/help/nyquist*'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# ### 5.2.13 Phaser


    The phaser is an effect for the distortion of phases. Besides the slider, with
    which you can adjust the strength of the effect, you also have the following setting
    options:


    +   - **Stages:** Here you can set the number of stages from 2 to 24.

    - **LFO Frequency (Hz):** LFO stands for "Low Frequency Oscillator". The low frequency
    can be chosen here between 0.1 and 4.0 Hz.

    - **LFO Start Phase (deg.):** Here you choose, in which area the oscillation begins.

    - **Depth:** The modulation depth can be set between 0 and 255.

    - **Feedback:** Here you choose a value between -100 and +100.


    For the phaser, it is basically indispensable to test with different values. You
    can set the *LFO Start Phase* in a way so that certain parts receive more or less
    effect.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_101_0.png)


    **The distortion of phases effect *Phaser*.**'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'To display the mode of action optically, a sinus sound of 440 Hz and an amplitude
    of 0.8 is created with the *Sound generator*. Now the phaser with the displayed
    settings is applied to this tone.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_102_0.png)


    **Sinus sound before and after the application of the effect *Phaser*.**


    The wave form already gives a good impression of how the effect works.


    # ## 5.2.14 Noise removal


    This effect can remove constant background noise subsequently. The more constant
    the noise is, the better it can usually be removed.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '![](img/1c450b361ffe9eaa5c4ff276786cfd26_103_0.png)


    Initially, create a noise profile, which preferably only contains the noise you
    want to remove, and then remove this noise systematically from the whole signal.
    You can edit the following settings:


    +   - **Get Noise Profile**: First, mark an area of the audio track, which preferably
