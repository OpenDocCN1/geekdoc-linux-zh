  - '[PAGE 114]


    # 6 Preferences


    With Audacity, you can start immediately after the installation to edit audio
    files, since the programme is delivered with preferences, which cover most of
    the well-established applications. However, if you want to execute very specific
    tasks, such as listening to already existing audio tracks at the same time as
    recording a new audio track, you have to set the respective preferences first.
    You can do so in the window *Audacity Preferences*, which you open either with
    the aid of the menu command *Edit > Preferences* or via the shortcut *Ctrl + P*.


    The window is subdivided into nine indexes, which are given on the left side *(Audio
    I/O, Quality, Import / Export* and so on), where they can be selected.


    # 6.1 Audio I/O


    In this register, the preferences for the audio streams into the programme and
    out of the programme are set among other things.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_114_0.png)


    > The window *Audacity Preferences*.'
  - '[PAGE 115]


    The settings:


    +   - **Playback**: Here you select via the dropdown menu the sound card, which
    shall be used for the audio playback.

    - **Recording**: Select the device for audio recording via the dropdown menu.

    - **Channels**: Here you can set the number of desired recording channels.


    In the area *Playthrough* you find two options, which you can activate and deactivate
    by clicking onto the preceding small box. When an option is activated, a check
    mark will be shown within the box.


    The settings:


    +   - **Overdub**: This option makes it possible to play an existing track while
    simultaneously recording a new track.

    - **Software Playthrough: Play new track while recording or monitoring (uncheck
    when recording "stereo mix")**: This option makes it possible to directly listen
    to the current recording.


    Almost all effects permit a preview of the respective effect before appliance.
    In the area *Effects Preview*, you can set the length of preview in seconds:


    +   - **Length of preview**: Here you set the preview time for the effect in seconds.


    In the section *Cut Preview*, you can set the period of time, which you want to
    hear before or respectively after the cut:


    +   - **Preview before cut region**: Here you set, how many seconds before the
    cut the playback shall start.

    - **Preview after cut region**: Here you set, how many seconds after the cut the
    playback continues.


    In the section *Latency*, you can, on the one hand, adjust the processing time
    and, on the other hand, make corrections, for example to be able to record synchronously
    to already existing tracks.'
  - '[PAGE 116]


    # 6.2  Quality


    In this panel, you can set the quality of the recordings, of the import and of
    the conversion.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_116_0.png)


    **The register *Quality*.**


    The setting options:


    +   - **Default Sample Rate**: Set the sample frequency here, with which you want
    to work by default while recording or respectively importing. The dropdown menu
    offers different popular parameters, as well as the possibility to enter your
    own parameters in the box behind it via the selection *Other*.

    - **Default Sample Format**: In this dropdown menu, you choose between 16-bit
    (CD quality), 24-bit (standard studio recording quality) and 32-bit float (floating
    point precision format).

    - **Real-time/High-quality**: In this dropdown menu, you choose between *Fast
    Sinc Interpolation* (faster) and *High Quality Sinc Interpolation* (better quality)
    for the processing of audio files.'
  - '[PAGE 117]


    +   - **Dither**: You can select or deselect this feature, which prevents digital
    distortions by adding a higher noise component. If you decide in favour of the
    *Dither*, you can choose between different types (*None*, *Rectangle*, *Triangle*
    and *Shaped*).


    # ## 6.3 Import / Export


    In this panel, you set the treatment of audio files.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_117_0.png)


    > **The panel *Import / Export*.**


    Possible modifications:


    +   - **When importing audio files**: Here you decide what will be done with uncompressed
    files when imported. Certainly, it is safer to have a copy of the file created
    than to directly play the original file. The two options are mutually exclusive,
    i. e. only one option is selectable at a time.'
  - '[PAGE 118]


    Moreover, you can select the option *Normalize all tracks in project*, which causes
    that imported files are automatically normalised via the batch processing.


    +   - **When saving a project that depends on other audio files:** The safest
    available option is *Always copy all audio into project*, whereat all necessary
    files are saved to the project. *Do not copy any audio* does not copy any referred
    audio files, whereas *Ask user* leads to a query when saving.

    - **When exporting tracks to an audio file:** Here you decide, wheter you always
    want to save the tracks as mono or stereo files.

    - **Show Metadata Editor prior to export step:** Shows the menu command *File>
    Open Metadata Editor*, before a file is exported via the batch processing. This
    one opens the window *Edit the metadata tags*, where you can change the respective
    data of the file.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_118_0.png)


    **Edit the metadata.**'
  - '[PAGE 119]


    # 6.4 Spectrograms


    This panel clearly shows the academic derivation of the software. Probably rather
    uninteresting for most of the users, the options for the display form *Spectrogram*
    can be set here, which considers the configuration of the frequencies of the audio
    signal. To check the set changes, the display *Spectrum* has to be chosen in the
    header of the track.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_119_0.png)


    The settings:


    +   - **FFT Size**: Here you set the resolution.

    - **Window type**: Here you can choose from different conversion methods of the
    spectral analysis.

    - **Grayscale**: Converts the display to gray shades.

    - **Minimum/Maximum Frequency (Hz)**: Here you set the frequency, which shall
    be displayed.'
- md: ' ## 6.5 Directories


    Here you can change the temporary files directory, set the interval for saving
    the backup copy as well as the kind of storage.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_120_0.png)


    The settings:


    - **Temporary files directory/Choose**: Here you set the temporary directory for
    Audacity files. For this, you can edit the path directly in the box or you can
    open the window *Choose folder* via the button *Choose* and select a folder.

    - **Auto save:** First set, if Audacity shall regularly make automatic backup
    copies of your files via the option *Auto save a copy of the project in a separate
    folder*. By means of these backup copies, Audacity can restore the last update,
    if the computer crashes while recording or editing or is e. g. shut down because
    of a blackout. Therefore, it is strongly recommended to leave this function unselected
    under normal circumstances.


    - **Audio cache:** If you select the option *Play and/or record using RAM*, the
    files will be left in the main storage, until the recording is stopped; only then
    it will be written to the hard drive. Furthermore, all audio files, which exist
    in the project, are completely kept to the main memory of the computer. Via this
    option, it is possible to work fluently even with those projects, which are saved
    on a slow data medium, such as via a slow network connected network drive. The
    user has to keep in mind, not to open files, which are bigger than the available
    main memory, because they could cause crashes of Audacity or the whole computer.
    Therefore, it is strongly recommended to leave this function unselected under
    normal circumstances.


    ## 6.6 Adjusting the programme interface


    This register is divided into the four sections *Behaviors*, *Language*, *Display
    range minimum*, *Modes* and *Show/Hide*.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_121_0.png)


    **The register *Interface*.**


    In the section *Behaviors* you find these options:


    - **Update display while playing:** If this option is selected, the current playback
    section is continuously shown in the programme window.

    - **Closing last window quits Audacity:** This feature is selected by default
    and causes the shutdown of the programme Audacity itself, after closing the last
    Audacity window via the menu command *File> Exit* or the button *[X]*. This is
    the usual performance of Windows programmes. If this feature is deselected, a
    new empty document will be opened automatically after closing the last Audacity
    window. To exit Audacity, you then have to use the menu command *File> Exit*.

    - **Enable dragging of left and right selection edges:** This by default selected
    option enables the subsequent changing of a right or left marking border. If you
    work in this connection with the mouse, the mouse pointer will change its form
    into a hand with outstretched index finger.

    - **Ergonomic order of audio I/O buttons:** This option arranges the controls
    more ergonomically to enable faster working. The following figures show the difference.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_122_0.png)


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_122_1.png)


    - **Automatically fit tracks vertically zoomed:** If this feature is selected,
    the audio tracks are automatically vertically fitted when opened.

    - **"Move track focus" cycles repeatedly through tracks:** This option enables
    you to jump from the last to the first audio track or vice versa via the arrow
    keys when marking.

    - **Editing a clip can move other clips**: This by default selected feature causes
    that independent clips, which are to the right of a cut in the same audio track,
    shift to the left by the length of the cut marking.

    - **Select all audio in project, if none selected**: This option is selected by
    default. It causes, that work steps, which need a selection such as effects, are
    applied onto the whole project by default, as long as no explicit selection in
    the form of a marking has been made.

    - **Beep on completion of longer activities**: After the completion of longer
    activities, an acoustic signal is generated to indicate the end of the processing
    to the user. In Windows, the acoustic signal only sounds, if the playback of an
    programme activity *Standard Sound Alert* is activated in the system control at
    *Sounds and Audio Devices*.

    - **Language**: Select the desired language via the pull-down menu. For a correct
    display of the language, a respective font has to be installed where necessary.

    - **Display range minimum: meters and ''Waveform (dB)'':** Hereby, you set the
    display of the vertical scale when shown in *Wave form (dB)*, whereat the chosen
    value represents the *zero* level.

    - **Enable cut lines**: If this option is selected, so-called cut lines are shown
    when using the feature *Cut* at those positions, where audio files have been cut
    out of the audio track. By clicking onto the cut line with the left mouse button,
    the respective cut can be undone. If you click onto the cut line with the right
    mouse button, the cut line is removed.

    - **Show warnings about temp files**: Usually, it will be pointed out to you at
    every programme start, if there still are temporary files in the Audacity folder,
    e. g. after a crash or a blackout. You can turn this off here. This setting is
    mainly interesting for developers of Audacity and of no importance for the normal
    usage of the programme.

    - **Show prompt to save, even if project is empty**: This option is selected by
    default and causes, that you are asked if you also want to save empty projects.
    It is usually not necessary to change this setting.

    - **Show Welcome Message at program start up**: If this option is selected, the
    window *Welcome to Audacity* will be shown at every start of the programme.

    - **CleanSpeech Mode (Customized GUI)**: This option expands the control tools
    to one more button, via which the batch processing *Clean Speech* can be accessed.
    Furthermore, several features and surface elements of Audacity are adjusted to
    provide an optimised workflow for the corrections of speech recordings.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_124_0.png)


    ## 6.7 Keyboard


    Many programmes offer by now the possibility to set own shortcuts for certain
    commands. In Audacity, you can set these preferences in the register *Keyboard*
    in the preferences window. You will especially appreciate this feature, if you
    work, for example, with a notebook.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_124_1.png)


    You apply your own keyboard shortcut like this:


    - First mark the action, for which you want to allocate a shortcut.

    - Place the mouse pointer into the empty box (in the picture above the box, where
    the entry *Ctrl + Alt + M* is located) directly underneath the table of shortcuts.

    - Select the desired shortcut on your keyboard.

    - Choose the button *Set*. The shortcut will now be displayed behind the command
    in the column *Key Combination*.

    - Close the window via the button *OK*.


    To delete a shortcut, first mark the command and then choose the button *Clear*.


    You can, furthermore, import or export complete command lists as XML-files via
    the buttons *Save* and *Load*. If you want to restore the original status of shortcuts,
    choose the button *Defaults*.


    ## 6.8 Mouse setup


    You get a good overview over the different editing options with the mouse in this
    register, although you cannot set any preferences.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_125_0.png)


    **Working faster with the aid of the mouse.**


    Here you will surely find one suggestion or another, on how to reach a desired
    result faster.


    # 7 Command list


    In the following, the individual menu commands will be explained.


    ## 7.1 File


    | Menu command | Function |

    | --- | --- |

    | New | Opens a new programme window. |

    | Open... | Opens the window *Select one or more audio files...*, where you can
    select one or more files, which shall be opened in Audacity. If you select several
    files, every file will be opened in a separate programme window. |

    | Close | Closes the current project. If there are still unsaved changes in the
    project, you will be asked for your own safety, if you want to save these changes.
    |

    | Save Project | Saves the current project. If the project has not yet been saved
    as an AUP-file (Audacity Project File), the window *Save Project As...* will be
    opened, where you can set the memory location and title of the project. |

    | Save Project As... | Opens the window *Save Project As...*, where you can set
    the memory location and title of the project. |

    | Check Dependencies... | Checks, if all dependencies of the project are fulfilled.
    If Audacity does not find all dependencies fulfilled, an error warning will be
    displayed in the window *Audacity Error*. If you confirm the window with the button
    OK, different procedures will offered in the window *Warning*. |

    | Open Metadata Editor... | Opens the window *Edit the metadata tags*, where you
    can allocate different given metadata to the project as well as |'
  mdcn: "\n ## 6.5 目录\n\n在此您可以更改临时文件目录，设置保存备份副本的间隔时间，以及选择存储类型。\n\n![](img/1c450b361ffe9eaa5c4ff276786cfd26_120_0.png)\n\
    \n各项设置：\n\n- **临时文件目录/选择**：在此设置 Audacity 文件的临时目录。可以直接在框中编辑路径，也可以通过*选择*按钮打开*选择文件夹*窗口来选定文件夹。\n\
    - **自动保存**：首先通过选项*在单独的文件夹中自动保存项目副本*来设置 Audacity 是否定期自动备份您的文件。借助这些备份副本，当计算机在录音或编辑过程中崩溃，或因例如停电而关闭时，Audacity\
    \ 可以恢复最后一次更新。因此，强烈建议在正常情况下不要选择此功能。\n\n- **音频缓存**：如果选择了*使用 RAM 播放和/或录制*选项，文件将保留在主存储器中，直到录音停止；只有到那时才会写入硬盘。此外，项目中存在的所有音频文件都完全保存在计算机的主内存中。通过此选项，即使对于那些保存在慢速数据介质上的项目，例如通过慢速网络连接的网络驱动器，也可以流畅地工作。用户需注意，不要打开大于可用主内存的文件，因为它们可能导致\
    \ Audacity 或整台计算机崩溃。因此，强烈建议在正常情况下不要选择此功能。\n\n## 6.6 调整程序界面\n\n此选项卡分为四个部分：*行为*、*语言*、*显示范围最小值*、*模式*和*显示/隐藏*。\n\
    \n![](img/1c450b361ffe9eaa5c4ff276786cfd26_121_0.png)\n\n**界面**选项卡。\n\n在*行为*部分，您会看到以下选项：\n\
    \n- **播放时更新显示**：如果选择了此选项，当前播放部分将在程序窗口中持续显示。\n- **关闭最后一个窗口即退出 Audacity**：此功能默认选中，通过菜单命令*文件\
    \ > 退出*或*[X]*按钮关闭最后一个 Audacity 窗口后，会导致程序 Audacity 本身关闭。这是 Windows 程序的常规表现。如果取消选择此功能，在关闭最后一个\
    \ Audacity 窗口后将自动打开一个新的空文档。要退出 Audacity，您需要使用菜单命令*文件 > 退出*。\n- **启用左右选择边缘的拖动**：此选项默认选中，允许后续更改左或右标记边框。如果在此情况下使用鼠标操作，鼠标指针将变为伸出食指的手形。\n\
    - **符合人体工效的音频输入/输出按钮排列**：此选项将控件排列得更符合人体工学，以实现更快的操作。下图展示了区别。\n\n![](img/1c450b361ffe9eaa5c4ff276786cfd26_122_0.png)\n\
    \n![](img/1c450b361ffe9eaa5c4ff276786cfd26_122_1.png)\n\n- **自动垂直缩放适配轨道**：如果选择了此功能，音频轨道将在打开时自动垂直适配。\n\
    - **\"移动轨道焦点\"在轨道间循环切换**：此选项使您在使用箭头键标记时，可以从最后一个音频轨道跳转到第一个，反之亦然。\n- **编辑片段时可以移动其他片段**：此功能默认选中，会导致同一音频轨道中位于剪切右侧的独立片段，按剪切标记的长度向左移动。\n\
    - **若未选择则全选项目中的音频**：此选项默认选中。它使得需要选择的工作步骤，如效果，默认应用于整个项目，只要没有做出明确的标记选择。\n- **较长活动完成时发出蜂鸣声**：在较长时间的活动完成后，会生成一个声音信号，向用户指示处理结束。在\
    \ Windows 中，只有在系统控制器的*声音和音频设备*中启用了程序活动*标准声音警报*的播放时，声音信号才会响起。\n- **语言**：通过下拉菜单选择所需语言。为了正确显示语言，必要时需要安装相应的字体。\n\
    - **显示范围最小值：电平表和'波形 (dB)'**：在此设置以*波形 (dB)*显示时的垂直刻度显示，其中所选值代表*零*电平。\n- **启用剪切线**：如果选择了此选项，在使用*剪切*功能时，会在音频文件从音频轨道中剪出的位置显示所谓的剪切线。用鼠标左键单击剪切线，可以撤销相应的剪切。如果用鼠标右键单击剪切线，则剪切线会被移除。\n\
    - **显示关于临时文件的警告**：通常，在每次程序启动时，如果 Audacity 文件夹中仍有临时文件，例如在崩溃或停电后，系统会提醒您。您可以在此处关闭此功能。此设置主要对\
    \ Audacity 开发人员有意义，对程序的正常使用不重要。\n- **即使项目为空也显示保存提示**：此选项默认选中，会导致系统询问您是否要保存空项目。通常无需更改此设置。\n\
    - **程序启动时显示欢迎消息**：如果选择了此选项，每次启动程序时都会显示*欢迎使用 Audacity*窗口。\n- **CleanSpeech 模式(自定义\
    \ GUI)**：此选项将控制工具扩展为多了一个按钮，通过它可以访问批处理*Clean Speech*。此外，还调整了 Audacity 的若干功能和界面元素，以优化语音录制校正的工作流程。\n\
    \n![](img/1c450b361ffe9eaa5c4ff276786cfd26_124_0.png)\n\n## 6.7 键盘\n\n如今许多程序都提供了为特定命令设置自定义快捷键的功能。在\
    \ Audacity 中，您可以在首选项窗口的*键盘*选项卡中设置这些首选项。例如，如果您使用笔记本电脑工作，您会特别欣赏这一功能。\n\n![](img/1c450b361ffe9eaa5c4ff276786cfd26_124_1.png)\n\
    \n设置自定义键盘快捷键的方法如下：\n\n- 首先标记您要为其分配快捷键的操作。\n- 将鼠标指针放在快捷键表格正下方的空框中（上图中的框，其中显示*Ctrl\
    \ + Alt + M*）。\n- 在键盘上选择所需的快捷键。\n- 选择*设置*按钮。快捷键现在将显示在*按键组合*列中该命令的后面。\n- 通过*确定*按钮关闭窗口。\n\
    \n要删除快捷键，首先标记该命令，然后选择*清除*按钮。\n\n此外，还可以通过*保存*和*加载*按钮以 XML 文件的形式导入或导出完整的命令列表。如果要恢复快捷键的原始状态，请选择*默认值*按钮。\n\
