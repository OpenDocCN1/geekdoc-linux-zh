  md: '| Menu command | Function |

    |---|---|

    | Add Label at Playback Position | Adds a label at the current position of the
    cursor. |

    | Edit Labels | Opens the corresponding window, where you can add, change, import
    or export labels. |

    | Sort tracks | Opens a submenu, where you can choose between *by Start Time*
    (on the timeline) and *by Name*. |


    # 7.5 Generate


    | Menu command | Function |

    |---|---|

    | Chirp... | Opens the window *Chirp Generator*, where you can create chirps.
    For this purpose, you have to enter a digit sequence in form of letters and numbers,
    set the amplitude (0-1.0) and the duration in seconds. |

    | Noise... | Opens the window *Noise Generator*, where you can create three types
    of noise: *White*, *Pink* and *Brown*. |

    | Silence... | Opens the window *Silence Generator*, where you can enter the duration
    of the silence, which shall be created. If you confirm the entry via the button
    *OK*, the silence will be inserted at the current cursor position. |

    | DTMF Tones... | Opens a tone generator, where you can set the parameters for
    the creation of a sound. If you confirm your entry via the button *OK*, the sound
    will be inserted at the current cursor position. |

    | Tone... | Opens an advanced tone generator, where it is possible to change the
    frequency and amplitude during the runtime of the sound. |'
  merge: -1
  pgno: 134
- img_proc: true
  md: '| Menu command | Function |

    | --- | --- |

    | Click Track... | Opens the corresponding window, where you can set the parameters
    for a metronome-like track. |

    | Pluck... | Imitates a plucked guitar chord, in which you can influence the pitch,
    the duration and the fading-out. |

    | Risset Drum | Imitates a drumbeat with different manipulation options. |


    # 7.6 Analyze


    | Menu command | Function |

    | --- | --- |

    | Plot Spectrum... | Offers a frequency analysis of a previously marked audio
    selection. In this connection, different algorithms, sizes and functions are available
    as well as the option of an in-line or logarithmical display. Additionally, the
    exporting of the values into TXT-files is possible. |

    | Find Clipping... | Opens the window Find Clipping, where you can set, how you
    want to search for clippings. Enter your parameters and start the search process
    via the button OK. The result is displayed as a label track called Clippings,
    which contains labels at those positions of the audio track, where the recording
    clipped. |

    | Beat Finder... | With the Beat Finder, you can automatically find those parts
    of a song, which contain beats, such as bass drum beats. This works especially
    well for very rhythmical music, such as techno music. The Threshold indicates
    in this process the sensibility. The lower the threshold is set, the more beats
    will be found. |

    | Silence Finder... | Opens the corresponding window, where you set, what shall
    be considered silence, and then search after these parameters in the marked section.
    This feature is, for example, quite useful to separate a recorded vinyl record
    |'
