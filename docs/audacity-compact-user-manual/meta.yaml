- img_proc: true
  md: '+   - **Spectrum**: Shows the composition of the frequencies of the audio signal.

    - **Pitch (EAC)**: Display of the basic frequencies of the audio signal with the
    aid of the Enhanced Autocorrelation (EAC) algorithm.

    - **Mono**: Hereby, you can define a single track as a mono track. This command
    is not activated for stereo tracks. Separate the stereo track first to be able
    to use the command on the single track.

    - **Left Channel**: Defines a mono track as a left channel.

    - **Right Channel**: Defines a mono track as a right channel.

    - **Make Stereo Track**: This command creates one stereo track out of two mono
    tracks.

    - **Split Stereo Track**: Splits a stereo track into two mono tracks, whereupon
    one track initially is the left and the other one the right channel.

    - **Set Sample Format**: Here you can set the sample format or the sample range
    and, thereby, the quality and the dynamic range. Choose between 16-bit PCM (CD
    quality, dynamic range of about 96 db), 24-bit PCM (standard studio recording
    quality, dynamic range of about 144 db) and 32-bit float (precision format of
    the floating point with a dynamic range of theoretically 192 db) for working with
    many effects, but admittedly also with the highest memory requirements both for
    RAM and hard disc storage unit.

    - **Set rate**: Here you can set the sample rate. Standard are, for example, 44100
    Hz (audio CD format), 48000 Hz (standard video sound), 96000 Hz (studio recording
    quality). Different tracks can have different settings and will be converted into
    the respective project sample rate during playing and exporting.


    Below the track name, you find a list of the characteristics of the track. In
    the given example: *stereo, 44100 Hz, 32-bit float*.


    Generally you can differentiate between stereo tracks, mono tracks, left and right
    tracks. The header of the track shows the respective kind of audio track.


    You can create a mono track out of a stereo track by selecting the menu command
    *Tracks> Stereo Track to Mono*. To create a left and right track, however, you
    have to open the context menu of the audio track by clicking on the name and choosing
    the command *Split Stereo Track* in the context menu.


    If you click here or on a free area below both of the controllers, you will mark
    the entire audio track, which is then displayed slightly darker.'
  merge: -1
  pgno: 69
- img_proc: true
  md: 'The buttons *Mute* and *Solo* offer the following features:


    +   - **Mute**: Switches the whole track on or off for replaying. The position
    of this button is irrelevant for mixing or exporting.

    - **Solo**: Switches all other tracks to mute, so that only this track is played.
    The position of this button is irrelevant for the mixing or exporting.


    Directly below these two buttons, there are the controllers for *Volume* and *Panorama*.
    Adjust your settings via the existing controllers or double click onto the scales
    to open the respective input window and enter your settings directly. Via the
    controller *Panorama* you can also set the stereo effect for a stereo signal.


    Finally, there is a button with an upwards pointing arrow at the lower end of
    the header of the track, by which you can collapse a track or respectively expand
    a collapsed track (arrow to the bottom).


    You can also set the width of tracks via the mouse. Therefor you have to direct
    the mouse pointer to the right of the header of the track at the lower edge, until
    the mouse pointer changes its form into a vertical double arrow. Then pull the
    track by holding down the mouse button to the desired size.


