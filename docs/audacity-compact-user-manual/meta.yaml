    - **Threshold for silence**: Here you set the threshold, from which it is considered
    silence.


    # 5.2.18    Change tempo


    With the aid of this effect, you modify the replay tempo without changing the
    pitch. In this connection, the length of the marked selection will change accordingly.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_105_0.png)


    > **Change tempo without changing pitch.**'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'You can edit the following settings:


    +   - **Percent Change**: Enter the desired change of tempo in percent here. Slower
    replay requires a negative value.

    - **Beats per minute**: Here you can enter the tempo change via beats per minute
    (bpm).

    - **Length (seconds)**: Shows the change of the runtime length. In the first box,
    you can see the original length, while the second box shows the new length after
    applying the effect. You can also edit the second box freely, whereby the change
    will automatically be calculated in percent.


    # 5.2.19 Change pitch


    This effect offers the possibility to modify the pitch without changing speed.
    In this context, you can enter your values in notes, semitones, the frequency
    change or the change in percent.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_106_0.png)'
  merge: -1
  pgno: 106
- img_proc: true
  md: 'The settings in detail:


    +   - **Pitch:** You can set the change of the pitch in notes in these boxes.
    Additionally, you have to specify, if the result shall be higher (up) or lower
    (down).

    - **Semitones (half-steps):** You can enter the change of the pitch via this box
    in semitones. You obtain lower pitches by entering a negative value.

    - **Frequency (Hz):** In these boxes, you can exactly set the change of frequency
    in Hz.

    - **Percent Change:** Enter a change in percent here. This box is freely editable,
    but can, moreover, also be set via the slider below.


    # 5.2.20    Amplify


    This effect can both amplify and reduce (negative amplification) the volume of
    an audio signal.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_107_0.png)


    Three settings are available:


    +   - **Amplification (dB):** Enter the amplification or reduction (negative value)
    in decibel here by directly editing the box or by using the slider. The new peak
    amplitude will be calculated automatically.'
  merge: -1
  pgno: 107
- img_proc: true
  md: '+   - **New Peak Amplitude (dB)**: Set the value of the new peak amplitude
    here by directly editing the box or by using the slider. At a peak amplitude of
    > 0 dB, you have to activate the option *Allow clipping* to start the effect.
    The respective amplification or reduction will hereby be calculated automatically.

    - **Allow clipping**: If you activate this option, clippings will be allowed.
    If the audio signal would overamplify when applying the effect with the currently
    preset values, the button *OK* to start the effect can only be pushed, if you
    activate the option *Allow clipping*.


    # 5.2.21 Wahwah


    Similar to the electronic effect device for electric guitars or the mutes of trumpets,
    this effect modulates the sound frequency. The effect is correctly called wah-wah.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_108_0.png)


    The unconventional effect *Wahwah*.


    The settings of the effect:


    +   - **LFO Frequency (Hz)**: LFO stands for "Low Frequency Oscillator". The low
    frequency can here be chosen between 0.1 and 4.0 Hz.'
  merge: -1
  pgno: 108
- img_proc: true
  md: '+   - **LFO Start Phase (deg.):** Here you define, in which area the oscillation
    begins.

    - **Depth (%):** The modulation depth can be set in percent between 0 and 100.

    - **Resonance:** Here you define the resonance quality on a scale of 0-10.

    - **Wah Frequency Offset (%):** The frequency shift can be set in percent between
    0 and 100.


    # 5.2.22 Repeat


    This effect repeats the marked area as often, as you want to.


