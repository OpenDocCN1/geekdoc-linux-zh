  md: '# ## 3.7 Recordings


    Audacity allows recordings from different sources, which are in turn dependent
    on the equipment of your computer. If you possess, for example, a microphone,
    which has a compatible port to your computer sound card, you can create recordings
    with it.


    For this, select the entry *Microphone* in the pull-down menu of the level controller.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_77_0.png)


    Depending on the sound card and the used sound system, the pull-down menu can
    contain considerably more entries than displayed in the figure.


    In the above displayed case with three entries in the pull-down menu, you select
    *Stereomix*, if you want to record the output of another programme, *Line-In*
    for connected devices like record player, tape recorder or minidisc player, and
    *Microphone* for recordings via a microphone, which is directly connected to the
    sound card.


    Via the two sliding controllers, you can set the *Output Volume* and the *Input
    Volume* of the recording source. Both values can be set separately.


