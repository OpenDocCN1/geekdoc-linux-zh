  md: '# 5.3 Problems and possible solutions


    In this chapter, typical difficulties and problems as well as their solutions
    shall be discussed.


    # 5.3.1 Recording with interruptions and disturbances


    After you finished a recording, you discover during replaying that there are brief
    interruptions and creaks.


    These problems indicate that the computer is overloaded during the recording or
    the replay. This can have several different causes:


    +   - While working with Audacity, other programmes are opened, which run in the
    background and, therefore, need additional main memory and processing time. Pay
    special attention to those programmes, which monitor nearly every activity of
    the computer, such as virus scanners, anti-spyware-programmes or indexations,
    and close these programmes while working with Audacity.

    - The applied drivers of the sound card and with it of the converter are either
    wrong or outdated. This problem does not only occur on older computers. Even brand
    new computers are often delivered with outdated drivers. This problem can be eliminated
    by researching on the website of the manufacturer, where you can also download
    the updated drivers if necessary and install them. Do also check, if there is
    a so-called chip set driver from the producer. If so, you should test, which driver
    is better suited.

    - The accesses to the hard drive are too slow. If you own an older computer, your
    hard disk may possibly not be able to execute the accesses with the necessary
    speed. Before changing the hard drive, please check first, if you can boost its
    rating via a defragmentation. Furthermore, you should test, if the DMA-mode (Direct
    Memory Access) or respectively the UDMA-mode (Ultra Direct Memory Access) of the
    hard disk driver is activated. This mode causes, that the drives access of the
    main storage directly and, thus, save processor capacity. Using the operating
    system Windows, you have to access the button *System* under *System Control*
    and then select the'
  merge: -1
  pgno: 110
- img_proc: true
  md: 'button *Device Manager* in the register *Hardware*, which opens a corresponding
    window. A mouse click on the small plus in front of *IDE ATA/ATAPI Controller*
    opens a list of the related entries. Select the entry *Primary IDE Channel* by
    double clicking. Now you can set the entry *DMA, if available* in the register
    *Advanced Settings* in the dropdown menu *Transfer Mode*.


    +   - The main memory of your system is simply too small or the processor so old,
    that it cannot process the requirements. If this is the case, you should check,
    if an upgrade is possible and reasonable.


    You can also minimise the requirements by adjusting the programme itself. Here
    are some possibilities:


    +   - Reduce the sample format (sample range) and the sample frequency. For a
    single audio track: For this purpose, open the context menu of the header of the
    track and select the desired setting. You can change the default values by opening
    the window *Audacity Preferences* via the menu command *Edit> Preferences*, selecting
    the register *Quality* on the left side and setting your changes under *Sampling*.

    - Increase the latency (possible from release 1.3.2 on). For this purpose, switch
    in the window *Audacity Preferences* to the register *Audio I/O* and set your
    changes under *Latency*.

    - Disable scrolling while replaying (*Update display while playing*). This preference
    can be set in the window *Audacity Preferences* in the register *Interface* under
    *Behaviors*.


    # ### 5.3.2 Recording has differing recording levels


    You make a recording and detect, that the volume oscillates extremely. If in this
    connection low parts are "lifted" and loud parts are muffled, it seems likely
    that your sound card possesses an automatic recording level. In this case, try
    to disable this automatic recording level via the driver of the sound card. This
    feature can e. g. be called AGC, which stands for "Automatic Gain Control". Unfortunately,
    there are several models that do not allow disabling of this feature.'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# 5.3.3 Recordings do not run "centred"


    A problem, which often occurs with basic sound cards, is the fact, that amplitudes
    in the wave form do not disperse exactly at the zero level, but lie below or above
    it. This can be seen particularly well at absolute silences during the recording.
    It can be suppressed with the feature *Remove any DC offset (center on 0.0 vertically)*,
    which you find below the effect *Normalize*.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_112_0.png)


    > The feature *Remove any DC offset*.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_112_1.png)


    > Before and after using the feature *Remove any DC offset*.'
  merge: -1
  pgno: 112
