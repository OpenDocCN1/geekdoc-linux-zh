    ## 5.3.2 录音音量不一致


    您进行录音时发现音量波动极大。如果与此相关的是低音部分被"提升"而高音部分被抑制，那么您的声卡很可能具有自动录音电平功能。在这种情况下，尝试通过声卡驱动程序禁用此自动录音电平。此功能例如可能被称为
