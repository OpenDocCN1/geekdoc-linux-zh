- md: ' Finally, you should also pay attention to the right connector for the microphone
    or respectively remember to buy the applicable adapter. Standard microphones usually
    use the following four connectors:


    - **3.5 mm TRS connector**: The so-called "miniature TRS connector"


    The question of which microphone to choose can actually only be answered individually.
    The microphone just has to suit the voice or instrument. You can read long consumer
    reports and discussions about this subject in various online forums, which can
    definitely help to make a buying decision. Our advice is, therefore: First of
    all, read consumer reports by ambitious users, decide exactly upon the desired
    applicability and compare the technical specifications as well. The Audacity forum,
    available at http://audacityteam.org/forum, can also give you a good overview.


    Those, who have the possibility – for example at a large music store, a conferer
    or the like –, should certainly test the various microphones beforehand. Once
    you have decided on a microphone, nothing will get in the way of making your first
    recording.


    Here are some tips for successful recording:


    - Initially, adjust the settings for the recording level. Regulate the sound level
    in a way, so that the sound will be recorded as loud as possible, but you absolutely
    try to avoid clipping.

    - If applicable, run a test recording of several seconds, before the actual recording,
    and check the result for possible interferences, falsifications, clippings and
    so forth.

    - Try to eliminate or avoid background noises. For indoor recordings you should,
    for example, locate a quiet room free from echo. For outdoor recordings you could,
    for example, use a wind deflector against the sounds of wind, mask flapping parts
    of clothing and turn off other disturbing sources beforehand, such as possibly
    ringing mobile phones.

    - If you have background noise that you cannot turn off, you should bring the
    microphone as close as possible to the source of sound, which is to be recorded.
    This way, the background noise is at least recorded mutedly.

    - Recordings of speech should be carried out at a volume as constant as possible,
    meaning without any outliers upwards or downwards.

    - When recording musical instruments, you should familiarise yourself with the
    individual **directional characteristics of that musical instrument to be able
    to place the microphone as optimal as possible.**


    If there are, nevertheless, interferences, or if there is a clearly audible hissing,
    you systematically have to go through all elements of the recording chain, test
    them individually if possible and, where necessary, substitute those components,
    which could be responsible for the error. But before you act blindly, you should
    always test the wiring and the conducted settings first.


    ## Recording from other playback devices


    If you have another playback device, like e. g. an MP3-player or a CD-player,
    you can record its output signal, which comes from the line-out jack or a green
    jack, via the line-in input or respectively the blue jack of your computer.


    The following colours are usually used for the different ports of a computer:


    | Colour | Function |

    | --- | --- |

    | Silver (grey) | Side speaker output (stereo) |

    | Black | Back speaker output (stereo) |

    | Orange | Subwoofer output and centre output. Often alternatively switchable
    to the digital output. |

    | Pink | Microphone input (mono) |

    | Green | Speaker output, line-out (stereo) |

    | Blue (light blue) | Line-in (stereo) |


    If you want to record from the output of another programme, you should initially
    check, whether the respective programme itself allows recording. You can then
    edit the result with Audacity subsequently.


    Many sound cards allow you to choose the entire output as the input channel. Different
    terms are used in this context, such as *Wave Out* or *What U Hear*. Using this
    setting, you can utilise Audacity to record sound, while a different programme
    replays something. Conflicts may occur in isolated cases, because two programmes
    access the sound card simultaneously.


    Using newer drivers or a different operating system might solve this problem.
    Alternatively, a temporary solution could simply be to directly pass the output
    *line out* (green jack) via wire to *the line in* jack (blue jack) and to record
    the input via Audacity from *line in*.


    ## 1.4 What exactly is Audacity?


    Audacity is a free and cross-platform programme for audio editing. Free does in
    this context not only refer to free of charge, but above all free in terms of
    liberty. This includes primarily the liberty to be able to use this software for
    all, even commercial purposes. The software may, furthermore, be copied, circulated
    as well as adjusted to one''s own requirements and demands. Other distinct characteristics
    of a free software are the licensing under the GNU General Public License (GPL),
    which is also known as a free copyleft license for software, and the fact, that
    the source code is available for everyone.


    The developing trend of such free software, which is also called open source projects,
    is directly dependent on the composition and interests of the respective team
    of developers as well as the requests and suggestions of the users. Many teams,
    however, offer, moreover, individual enhancements of the respective software.
    Simply contact the respective team, if need be.


    Audacity was originally created for a project at the Carnegie Mellon University
    in Pittsburgh, USA, which dealt with frequency analysis. Dominic Mazzoni has been
    evolved right from the start and is still significantly supervising the project
    today. He and an international group of volunteers, organising themselves via
    Internet, continuously develop Audacity further. Audacity is written in the programming
    language C++.


    A special feature is the fact that Audacity has been developed for all three major
    operating systems (Windows, Mac OS X and Linux). To provide a similar graphical
    user interface for the different operating systems, the wxWidgets software library
    is used. The latest release is 1.3.6 (beta), which has been launched in October
    2008; and the latest stable release is 1.2.6 respectively, which is recommended
    for efficient working.


    Audacity enables the individual user to handle different tasks independently,
    which previously could only be realised time, work and price intensive at a recording
    studio. Linked to an Internet connection and a website or respectively the access
    to the according Internet portal, these products can be made available worldwide.
    This development has already gained ground in the form of self-recorded and mixed
    music, audio blogs and podcasts and has enriched cultural life for a while.


    In the following, the latest release 1.3.6 (beta) will be described.


    ## 1.5 The functional range of Audacity


    With Audacity, you can complete a lot of tasks. Pay attention to the fact, that
    you may possibly need additional devices or software for certain tasks and functions.
    Thus, for the already mentioned live-recording of speech, sounds or music, you
    need, for example, at least a microphone, which has to be connected to the computer
    via a mixing desk or directly via sound card.


    The most important features are:


    - Importing of different audio formats, such as WAV, FLAC, AIFF, AU, Ogg Vorbis
    and MPEG data

    - Importing of audio raw data

    - Creating of an unlimited number of audio tracks

    - Compiling live-recordings

    - Digitising of analogue data mediums like cassette tapes or vinyl records

    - Cutting, copying, deleting and mixing of audio data

    - Providing audio data with special effects, such as changing speed or pitch of
    a recording

    - Unlimited undo actions and restoring of work steps

    - Recording via microphone and other sources via the line-in input, like for example
    mixing desks or amplifiers and online sources (dependent on the capabilities of
    the used sound card). Recordings with a sample rate of up to 96 kHz and a sample
    and a floating point of up to 32 bit are hereby supported.

    - Changing and mixing of an unlimited number of tracks

    - Deleting of continuous background noises

    - Manual deleting of disturbances via the drawing tool

    - Displaying of the recording level before, during and after recording

    - Recording in 16-, 24- or 32-bit (floating point)

    - Exporting of WAV-, AIFF-data and via the optional LAME Encoder Library even
    MP3-files

    - Spectrogram mode to show frequencies

    - Plot spectrum commands for a more precise frequency analysis

    - Mixing together of different sample rates and formats in real time


    As a mere audio editor, Audacity does not offer any advanced features, which may
    be known from so-called sequencer programmes. This means more specifically,'
