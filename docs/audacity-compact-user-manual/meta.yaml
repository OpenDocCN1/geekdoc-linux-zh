    **The window *Bass Boost*.**


    The two settings:


    +   - **Frequency (Hz):** Here you set the frequency to be boosted. Possible values
    are 1-1000 Hz.

    - **Boost (dB):** Determine the boost, whereupon a boost of maximum 36 dB is possible.'
  - '[PAGE 93]


    # 5.2.4 Echo


    This effect causes an echo, whose delay and strength you can select. The settings:


    +   - **Delay time (seconds):** Here you set the time lag between the original
    signal and the effect signal.

    - **Decay factor:** In this array you can set the decay factor for the echo. Values
    smaller than one cause a decay of the signal, whereas values bigger than one cause
    a respective boost.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_93_0.png)


    # 5.2.5 Equalization


    With the aid of equalization, you can increase or reduce respectively certain
    frequencies. For this, two different perspectives are available: one, where the
    frequency curve can be drawn with the aid of the mouse; and the graphic equalization,
    which offers 31 wave bands per 1/3 octave width. The settings can in this case
    be carried out via sliders. Curves can be created and saved individually.'
  - '[PAGE 94]


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_94_0.png)


    Graphic equalization with 31 sliders.


    The following settings are available:


    +   - **Draw curves**: Offers the view of the equalization, where you can draw
    a curve with the aid of the mouse, whereupon the frequencies are increased or
    reduced.

    - **Graphic EQ**: This view of the equalization offers 31 wave bands per 1/3 octave
    width, whose increase or decrease you can set via the available sliders.

    - **Dropdown box**: Here you can choose between the different interpolation methods:
    *B-spline*, *Cosine* and *Cubic* are available.

    - **Length of filter**: Via the slider you can regulate the length of the filter.
    The following applies hereby: The further to the left the slider is, the'
  - '[PAGE 95]


    +   - longer the filter, and the further to the right the slider, the more point-shaped
    the filter.

    - **Select curve:** In this dropdown box, different preset curves are already
    available. If you save a curve, you will, furthermore, find it in this dropdown
    box under the saved name as well.

    - **Save As:** Opens a window, where you can enter the title for your equalization
    curve.

    - **Delete:** Deletes the chosen curve.

    - **Flat:** Sets all wave bands to 0 dB.


    # 5.2.6 Change speed


    This effect changes the replay tempo and at the same time the pitch. The values
    can be set via the slider with the aid of the mouse or they can be entered directly
    into the array. Furthermore, the different speeds of vinyl disc records are available
    as default values.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_95_0.png)'
  - '[PAGE 96]


    The settings:


    +   - **Percent Change**: Enter the desired tempo change in percent here.

    - **Standard Vinyl RPM from/to**: In this dropdown box the most popular replay
    speeds of vinyl records are preset in revolutions per minute (rpm).


    # 5.2.7  Invert


    This effect causes a phase inversion and does not offer further setting options.
    All negative amplitudes of the chosen audio material become positive and all positive
    sample amplitudes become negative. This effect can be seen very well in the augmented
    view of an audio track.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_96_0.png)


    **At the top the original track and below the inverted track.**'
  - '[PAGE 97]


    Both tracks will cancel each other out and create no sound, when replayed together.


    # 5.2.8 Click removal


    The click removal removes short pulsating background noises. Therefore, this tool
    is extremely useful for example to remove clicks and pops, which result e. g.
    when digitising vinyl records.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_97_0.png)


    **Settings for the click removal.**


    You can set the level via the threshold, from which the filter identifies an impulse
    as interference, while the pulse width sets the maximum length. The settings:


    +   - **Select threshold (lower is more sensitive):** Here you select the threshold,
    from which the click removal shall be applied. The lower the chosen value, the
    sooner the filter applies.

    - **Max spike width (higher is more sensitive):** Here you set the width, from
    which interferences are taken into account. The higher you choose the value, the
    shorter interferences are removed.'
  - '[PAGE 98]


    # 5.2.9 Compressor


    The compressor has the function to reduce the dynamic range of audio signals to
    obtain a more evenly volume. For this purpose, the volume of louder passages is
    reduced, while lower passages are respectively amplified.


    You can change the following settings:


    +   - **Threshold**: Sets the level value, from which the compressor works. Possible
    values are from -60 dB to -1 dB.

    - **Ratio**: Sets the ratio, in which the loud parts (above the threshold) are
    adjusted to the lower ones (from 1.5 to 1 to 10 to 1).

    - **Attack Time**: Here you can control the reaction rate of the effect.

    - **Decay Time**: Enter the length of the effect here.

    - **Normalize to 0 dB after compressing**: If you have selected this option, the
    audio signal, which has been reduced after the compression in its dynamic range,
    will be boosted to 0 dB again.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_98_0.png)


    The compressor for reducing the dynamic range.'
  - '[PAGE 99]


    # 5.2.10    Leveller


    The leveller is also used for the approximation of soft and loud parts of an audio
    track. However, the setting options for the degree of leveling and the threshold
    for noise are limited. For the degree of leveling, you can choose between five
    steps, while you can choose from -20 dB in five-point steps to -80 dB for the
    threshold for noise.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_99_0.png)


    The leveller for the approximation of volumes.


    The two settings:


    +   - **Degree of Leveling**: Here, you can choose between five possible steps.

    - **Threshold for Noise**: The threshold for noise can be chosen from -20 dB to
    -80 dB in five-point steps.


    # 5.2.11    Normalize


    This effect makes it one the one hand possible to boost the level of audio material,
    which has been recorded with a too low input level, and on the other hand it enables
    the approximation of different audio tracks at a constant volume.'
  - '[PAGE 100]


    Moreover, the effect makes it possible to remove direct current offsets, which
    might exist in the audio signal.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_100_0.png)


    > **The window *Normalize*.**


    The settings:


    +   - **Remove any DC offset (center on 0.0 vertically):** With this option, any
    existing direct current offset in the audio signal can be removed. This is a matter
    of vertical shifting of the wave form, which is often caused by basic sound cards
    while recording via microphone.

    - **Normalize maximum amplitude to:** This option reduces or boosts the volume
    until the loudest part has reached the given value. This effect can be applied
    at most until the distortion-free volume of 0 dB.


    # 5.2.12 Nyquist prompt


    Interface, which makes inputs in the programming language Nyquist possible to
    generate plug-ins. You can find an introduction about it on the Internet at the
    address: *http://audacity.sourceforge.net/help/nyquist*'
- md: ' ## 5.2.13 Phaser


    The phaser is an effect for the distortion of phases. Besides the slider, with
    which you can adjust the strength of the effect, you also have the following setting
    options:


    - **Stages:** Here you can set the number of stages from 2 to 24.

    - **LFO Frequency (Hz):** LFO stands for "Low Frequency Oscillator". The low frequency
    can be chosen here between 0.1 and 4.0 Hz.

    - **LFO Start Phase (deg.):** Here you choose, in which area the oscillation begins.

    - **Depth:** The modulation depth can be set between 0 and 255.

    - **Feedback:** Here you choose a value between -100 and +100.


    For the phaser, it is basically indispensable to test with different values. You
    can set the *LFO Start Phase* in a way so that certain parts receive more or less
    effect.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_101_0.png)


    **The distortion of phases effect *Phaser*.**


    To display the mode of action optically, a sinus sound of 440 Hz and an amplitude
    of 0.8 is created with the *Sound generator*. Now the phaser with the displayed
    settings is applied to this tone.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_102_0.png)


    **Sinus sound before and after the application of the effect *Phaser*.**


    The wave form already gives a good impression of how the effect works.


    ## 5.2.14 Noise removal


    This effect can remove constant background noise subsequently. The more constant
    the noise is, the better it can usually be removed.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_103_0.png)


    Initially, create a noise profile, which preferably only contains the noise you
    want to remove, and then remove this noise systematically from the whole signal.
    You can edit the following settings:


    - **Get Noise Profile**: First, mark an area of the audio track, which preferably
    only contains the noise you want to reduce, and then select the button *Get Noise
    Profile*.

    - **Noise reduction (dB)**: Here you set the amount of noise reduction in dB.

    - **Frequency smoothing (Hz)**: Smooths the displayed frequency from 1 to 1,000
    Hz.

    - **Attack/decay time (secs)**: Here you set the attack and decay time.


    ### 5.2.15 Repair


    Minor disturbances can be repaired with this tool. However, this effect can only
    process very short marked areas of up to 128 samples. This feature is described
    in detail in chapter 4.2, Removing background noises.


    ### 5.2.16 Reverse


    This effect records the marked area reversely and does not offer further setting
    options. Try it out with a reverse spoken word or sentence.


    ### 5.2.17 Truncate silence


    This effect offers the possibility to create evenly measured pauses by removing
    periods of silence, which exceed a certain length.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_104_0.png)


    **The effect *Truncate Silence*.**


    The two settings:


    - **Max silence duration**: Here you can set the maximum length of a silence period
    for the marked area.

    - **Threshold for silence**: Here you set the threshold, from which it is considered
    silence.


    ### 5.2.18 Change tempo


    With the aid of this effect, you modify the replay tempo without changing the
    pitch. In this connection, the length of the marked selection will change accordingly.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_105_0.png)


    > **Change tempo without changing pitch.**


    You can edit the following settings:


    - **Percent Change**: Enter the desired change of tempo in percent here. Slower
    replay requires a negative value.

    - **Beats per minute**: Here you can enter the tempo change via beats per minute
    (bpm).

    - **Length (seconds)**: Shows the change of the runtime length. In the first box,
    you can see the original length, while the second box shows the new length after
    applying the effect. You can also edit the second box freely, whereby the change
    will automatically be calculated in percent.


    ### 5.2.19 Change pitch


    This effect offers the possibility to modify the pitch without changing speed.
    In this context, you can enter your values in notes, semitones, the frequency
    change or the change in percent.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_106_0.png)


    The settings in detail:


    - **Pitch:** You can set the change of the pitch in notes in these boxes. Additionally,
    you have to specify, if the result shall be higher (up) or lower (down).

    - **Semitones (half-steps):** You can enter the change of the pitch via this box
    in semitones. You obtain lower pitches by entering a negative value.

    - **Frequency (Hz):** In these boxes, you can exactly set the change of frequency
    in Hz.

    - **Percent Change:** Enter a change in percent here. This box is freely editable,
    but can, moreover, also be set via the slider below.


    ### 5.2.20 Amplify


    This effect can both amplify and reduce (negative amplification) the volume of
    an audio signal.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_107_0.png)


    Three settings are available:


    - **Amplification (dB):** Enter the amplification or reduction (negative value)
    in decibel here by directly editing the box or by using the slider. The new peak
    amplitude will be calculated automatically.

    - **New Peak Amplitude (dB)**: Set the value of the new peak amplitude here by
    directly editing the box or by using the slider. At a peak amplitude of > 0 dB,
    you have to activate the option *Allow clipping* to start the effect. The respective
    amplification or reduction will hereby be calculated automatically.

    - **Allow clipping**: If you activate this option, clippings will be allowed.
    If the audio signal would overamplify when applying the effect with the currently
    preset values, the button *OK* to start the effect can only be pushed, if you
    activate the option *Allow clipping*.


    ### 5.2.21 Wahwah


    Similar to the electronic effect device for electric guitars or the mutes of trumpets,
    this effect modulates the sound frequency. The effect is correctly called wah-wah.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_108_0.png)


    **The unconventional effect *Wahwah*.**


    The settings of the effect:


    - **LFO Frequency (Hz)**: LFO stands for "Low Frequency Oscillator". The low frequency
    can here be chosen between 0.1 and 4.0 Hz.

    - **LFO Start Phase (deg.):** Here you define, in which area the oscillation begins.

    - **Depth (%):** The modulation depth can be set in percent between 0 and 100.

    - **Resonance:** Here you define the resonance quality on a scale of 0-10.

    - **Wah Frequency Offset (%):** The frequency shift can be set in percent between
    0 and 100.


    ### 5.2.22 Repeat


    This effect repeats the marked area as often, as you want to.


    ![](img/1c450b361ffe9eaa5c4ff276786cfd26_109_0.png)


    The only setting:


    - **Number of times to repeat:** Here you define, how often the chosen audio signal
    shall be repeated. The new selection length is automatically calculated.


    ## 5.3 Problems and possible solutions


    In this chapter, typical difficulties and problems as well as their solutions
    shall be discussed.


    ### 5.3.1 Recording with interruptions and disturbances


    After you finished a recording, you discover during replaying that there are brief
    interruptions and creaks.


    These problems indicate that the computer is overloaded during the recording or
    the replay. This can have several different causes:


    - While working with Audacity, other programmes are opened, which run in the background
    and, therefore, need additional main memory and processing time. Pay special attention
    to those programmes, which monitor nearly every activity of the computer, such
    as virus scanners, anti-spyware-programmes or indexations, and close these programmes
    while working with Audacity.

    - The applied drivers of the sound card and with it of the converter are either
    wrong or outdated. This problem does not only occur on older computers. Even brand
    new computers are often delivered with outdated drivers. This problem can be eliminated
    by researching on the website of the manufacturer, where you can also download
    the updated drivers if necessary and install them. Do also check, if there is
    a so-called chip set driver from the producer. If so, you should test, which driver
    is better suited.

    - The accesses to the hard drive are too slow. If you own an older computer, your
    hard disk may possibly not be able to execute the accesses with the necessary
    speed. Before changing the hard drive, please check first, if you can boost its
    rating via a defragmentation. Furthermore, you should test, if the DMA-mode (Direct
    Memory Access) or respectively the UDMA-mode (Ultra Direct Memory Access) of the
    hard disk driver is activated. This mode causes, that the drives access of the
    main storage directly and, thus, save processor capacity. Using the operating
    system Windows, you have to access the button *System* under *System Control*
    and then select the'
  mdcn: "\n ## 5.2.13 Phaser（移相器）\n\n移相器是一种用于相位失真的效果器。除了可以调节效果强度的滑块外，你还有以下设置选项：\n\n\
    - **Stages（级数）：** 在此可以设置2到24级。\n- **LFO Frequency (Hz)（LFO频率）：** LFO代表\"Low Frequency\
    \ Oscillator\"（低频振荡器）。低频可在此选择0.1到4.0 Hz之间的值。\n- **LFO Start Phase (deg.)（LFO起始相位）：**\
    \ 在此选择振荡开始的区域。\n- **Depth（深度）：** 调制深度可在0到255之间设置。\n- **Feedback（反馈）：** 在此选择-100到+100之间的值。\n\
    \n对于移相器来说，用不同的数值进行测试基本上是不可或缺的。你可以设置*LFO Start Phase*（LFO起始相位），使某些部分获得更多或更少的效果。\n\
    \n![](img/1c450b361ffe9eaa5c4ff276786cfd26_101_0.png)\n\n**相位失真效果*Phaser*（移相器）。**\n\
    \n为了直观地展示作用方式，用*Sound generator*（声音发生器）创建一个440 Hz、振幅为0.8的正弦波声音。现在将移相器以显示的设置应用到这个音调上。\n\
    \n![](img/1c450b361ffe9eaa5c4ff276786cfd26_102_0.png)\n\n**应用*Phaser*（移相器）效果前后的正弦波声音。**\n\
    \n波形已经能让人很好地了解该效果的工作原理。\n\n## 5.2.14 Noise removal（噪声消除）\n\n此效果可以后续消除恒定的背景噪声。噪声越恒定，通常越能更好地消除。\n\
    \n![](img/1c450b361ffe9eaa5c4ff276786cfd26_103_0.png)\n\n首先，创建一个噪声样本，该样本最好只包含你想消除的噪声，然后将此噪声系统地从整个信号中去除。你可以编辑以下设置：\n\
    \n- **Get Noise Profile（获取噪声样本）**：首先，标记音频轨道中最好只包含你想降低的噪声的区域，然后选择*Get Noise Profile*（获取噪声样本）按钮。\n\
    - **Noise reduction (dB)（噪声降低量）**：在此以分贝为单位设置噪声降低量。\n- **Frequency smoothing (Hz)（频率平滑）**：将显示的频率从1平滑到1,000\
    \ Hz。\n- **Attack/decay time (secs)（起音/衰减时间）**：在此设置起音和衰减时间。\n\n### 5.2.15 Repair（修复）\n\
    \n此工具可以修复轻微干扰。然而，该效果只能处理最多128个采样点的极短标记区域。此功能在第4.2章\"去除背景噪声\"中有详细描述。\n\n### 5.2.16\
    \ Reverse（反转）\n\n此效果将标记区域反向录制，不提供进一步的设置选项。试着将一个反向播放的单词或句子进行测试。\n\n### 5.2.17 Truncate\
    \ silence（截断静音）\n\n此效果提供了通过去除超过一定长度的静音时段来创建均匀测量停顿的可能性。\n\n![](img/1c450b361ffe9eaa5c4ff276786cfd26_104_0.png)\n\
    \n**效果*Truncate Silence*（截断静音）。**\n\n两项设置：\n\n- **Max silence duration（最大静音时长）**：在此可以设置标记区域中静音时段的最大长度。\n\
    - **Threshold for silence（静音阈值）**：在此设置从哪个值开始视为静音。\n\n### 5.2.18 Change tempo（改变速度）\n\
    \n借助此效果，你可以在不改变音调的情况下修改回放速度。与此相关，标记选区的长度也会相应改变。\n\n![](img/1c450b361ffe9eaa5c4ff276786cfd26_105_0.png)\n\
    \n> **不改变音调而改变速度。**\n\n你可以编辑以下设置：\n\n- **Percent Change（百分比变化）**：在此输入所需的速度变化百分比。慢速回放需要负值。\n\
    - **Beats per minute（每分钟节拍数）**：在此你可以通过每分钟节拍数（bpm）输入速度变化。\n- **Length (seconds)（时长（秒））**：显示运行时长的变化。第一个框显示原始长度，第二个框显示应用效果后的新长度。你也可以自由编辑第二个框，这时变化将自动以百分比计算。\n\
    \n### 5.2.19 Change pitch（改变音调）\n\n此效果提供了在不改变速度的情况下修改音调的可能性。在此情况下，你可以以音符、半音、频率变化或百分比变化输入数值。\n\
    \n![](img/1c450b361ffe9eaa5c4ff276786cfd26_106_0.png)\n\n详细设置：\n\n- **Pitch（音调）：**\
    \ 在这些框中，你可以用音符设置音调变化。此外，还必须指定结果是更高（up）还是更低（down）。\n- **Semitones (half-steps)（半音）：**\
    \ 你可以通过此框以半音输入音调变化。输入负值可获得更低的音调。\n- **Frequency (Hz)（频率）：** 在这些框中，你可以精确设置以Hz为单位的频率变化。\n\
    - **Percent Change（百分比变化）：** 在此输入百分比变化。此框可自由编辑，但也可以通过下面的滑块进行设置。\n\n### 5.2.20\
    \ Amplify（放大）\n\n此效果可以放大和降低（负放大）音频信号的音量。\n\n![](img/1c450b361ffe9eaa5c4ff276786cfd26_107_0.png)\n\
    \n三项设置可供选择：\n\n- **Amplification (dB)（放大（分贝））：** 在此直接编辑框或使用滑块输入以分贝为单位的放大或降低（负值）量。新的峰值振幅将自动计算。\n\
    - **New Peak Amplitude (dB)（新峰值振幅）**：在此直接编辑框或使用滑块设置新的峰值振幅值。在峰值振幅 > 0 dB时，必须激活*Allow\
    \ clipping*（允许削波）选项才能启动效果。相应的放大或降低将由此自动计算。\n- **Allow clipping（允许削波）**：如果激活此选项，将允许削波。如果音频信号在应用当前预设值的效果时会出现过放大，则只有激活*Allow\
    \ clipping*（允许削波）选项后，才能按下*OK*按钮启动效果。\n\n### 5.2.21 Wahwah（哇音）\n\n类似于电吉他的电子效果器或小号弱音器，此效果调制声音频率。该效果的正确名称是wah-wah（哇音）。\n\
    \n![](img/1c450b361ffe9eaa5c4ff276786cfd26_108_0.png)\n\n**非常规效果*Wahwah*（哇音）。**\n\
    \n效果设置：\n\n- **LFO Frequency (Hz)（LFO频率）**：LFO代表\"Low Frequency Oscillator\"（低频振荡器）。低频可在此选择0.1到4.0\
    \ Hz之间的值。\n- **LFO Start Phase (deg.)（LFO起始相位）：** 在此定义振荡开始的区域。\n- **Depth (%)（深度）**：调制深度可以以百分比形式在0到100之间设置。\n\
    - **Resonance（共鸣）：** 在此以0-10的量表定义共鸣质量。\n- **Wah Frequency Offset (%)（哇音频率偏移）**：频率偏移可以以百分比形式在0到100之间设置。\n\
    \n### 5.2.22 Repeat（重复）\n\n此效果可按需重复标记区域。\n\n![](img/1c450b361ffe9eaa5c4ff276786cfd26_109_0.png)\n\
    \n唯一一项设置：\n\n- **Number of times to repeat（重复次数）：** 在此定义所选音频信号应重复多少次。新的选区长度将自动计算。\n\
    \n## 5.3 问题及可能的解决方案\n\n在本章中，将讨论典型的困难和问题及其解决方案。\n\n### 5.3.1 录制时出现中断和干扰\n\n完成录制后，在回放时你发现存在短暂的中断和杂音。\n\
    \n这些问题表明计算机在录制或回放期间过载。这可能由多种不同原因造成：\n\n- 在使用Audacity时，打开了其他在后台运行的程序，因此需要额外的主内存和处理时间。请特别注意那些几乎监控计算机所有活动的程序，如病毒扫描软件、反间谍软件或索引程序，并在使用Audacity时关闭这些程序。\n\
