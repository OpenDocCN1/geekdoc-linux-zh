    filesystems is needed, e.g., by the `df` command.


    /etc/shadow Shadow password file on systems with shadow password software installed.
    Shadow passwords move the encrypted password from `/etc/passwd` into `/etc/shadow`;
    the latter is not readable by anyone except `root`. This makes it harder to crack
    passwords.


    `/etc/login.defs` Configuration file for the `login` command.


    `/etc/printcap` Like `/etc/termcap`, but intended for printers. Different syntax.


    `/etc/profile`, `/etc/csh.login`, `/etc/csh.cshrc` Files executed at login or
    startup time by the Bourne or `C` shells. These allow the system administrator
    to set global defaults for all users. See the manual pages for the respective
    shells.


    `/etc/securety` Identifies secure terminals, i.e., the terminals from which `root`
    is allowed to log in. Typically only the virtual consoles are listed, so that
