  md: '# 4.8. FILESYSTEMS


    **ext2** The most featureful of the native Linux filesystems, currently also the
    most popular one. It is designed to be easily upwards compatible, so that new
    versions of the filesystem code do not require re-making the existing filesystems.


    **ext** An older version of `ext2` that wasn''t upwards compatible. It is hardly
    ever used in new installations any more, and most people have converted to `ext2`.


    In addition, support for several foreign filesystem exists, to make it easier
    to exchange files with other operating systems. These foreign filesystems work
    just like native ones, except that they may be lacking in some usual UNIX features,
    or have curious limitations, or other oddities.


    **msdos** Compatibility with MS-DOS (and OS/2 and Windows NT) FAT filesystems.


    **umsdos** Extends the `msdos` filesystem driver under Linux to get long filenames,
    owners, permissions, links, and device files. This allows a normal `msdos` filesystem
    to be used as if it were a Linux one, thus removing the need for a separate partition
    for Linux.


    **iso9660** The standard CD-ROM filesystem; the popular Rock Ridge extension to
    the CD-ROM standard that allows longer file names is supported automatically.


    **nfs** A networked filesystem that allows sharing a filesystem between many computers
    to allow easy access to the files from all of them.


    **hpfs** The OS/2 filesystem.


    **sysv** SystemV/386, Coherent, and Xenix filesystems.


    The choice of filesystem to use depends on the situation. If compatibility or
    other reasons make one of the non-native filesystems necessary, then that one
    must be used. If one can choose freely, then it is probably wisest to use `ext2`,
    since it has all the features but does not suffer from lack of performance.


    There is also the `proc` filesystem, usually accessible as the `/proc` directory,
    which is not really a filesystem at all, even though it looks like one. The `proc`
    filesystem makes it easy to access certain kernel data structures, such as the
    process list (hence'
