    ## Chapter 8 Logging In And Out

    > *This chapter needs a quote. Suggestions, anyone?*


    This section describes what happens when a user logs in or out. The various interactions
    of background processes, log files, configuration files, and so on are described
    in some detail.


    ### 8.1 Logins via terminals

    Figure 8.1 shows how logins happen via terminals. First, `init` makes sure there
    is a `getty` program for the terminal connection (or console). `getty` listens
    at the terminal and waits for the user to notify that he is ready to log in (this
    usually means that the user must type something). When it notices a user, `getty`
    outputs a welcome message (stored in `/etc/issue`), and prompts for the username,
    and finally runs the `login` program. `login` gets the username as a parameter,
    and prompts the user for the password. If these match, `login` starts the shell
    configured for the user; else it just exits and terminates the process (perhaps
    after giving the user another chance at entering the username and password). `init`
    notices that the process terminated, and starts a new `getty` for the terminal.
    Note that the only new process is the one created by `init` (using the `fork`
    system call); `getty` and `login` only replace the program running in the process
    (using the `exec` system call). A separate program, for noticing the user, is
    needed for serial lines, since it can be (and traditionally was) complicated to
    notice when a terminal becomes active. `getty` also adapts to the speed and other
    settings of the connection, which is important especially for dial-in connections,
    where these parameters may change from call to call. There are several versions
    of `getty` and `init` in use, all with their good and bad points. It is a good
    idea to learn about the versions on your system, and also about the other versions
    (you could use the Linux Software Map to search them). If you don''t have dial-ins,
    you probably don''t have to worry about `getty`, but `init` is still important.


    ### 8.2 Logins via the network

    Two computers in the same network are usually linked via a single physical cable.
    When they communicate over the network, the programs in each computer that take
    part in the communication are linked via a **virtual connection**, a sort of imaginary
    cable. As far as the programs at either end of the virtual connection are concerned,
    they have a monopoly on their own cable. However, since the cable is not real,
    only imaginary, the operating systems of both computers can have several virtual
    connections share the same physical cable. This way, using just a single cable,
    several programs can communicate without having to know of or care about the other
    communications. It is even possible to have several computers use the same cable;
    the virtual connections exist between two computers, and the other computers ignore
    those connections that they don''t take part in. That''s a complicated and over-abstracted
    description of the reality. It might, however, be good enough to understand the
    important reason why network logins are somewhat different from normal logins.
    The virtual connections are established when there are two programs on different
    computers that wish to communicate. Since it is in principle possible to login
    from any computer in a network to any other computer, there is a huge number of
    potential virtual communications. Because of this, it is not practical to start
    a `getty` for each potential login. There is a single process `inetd` (corresponding
    to `getty`) that handles *all* network logins. When it notices an incoming network
    login (i.e., it notices that it gets a new virtual connection to some other computer),
    it starts a new process to handle that single login. The original process remains
    and continues to listen for new logins. To make things a bit more complicated,
    there is more than one communication protocol for network logins. The two most
    important ones are `telnet` and `rlogin`. In addition to logins, there are many
    other virtual connections that may be made (for FTP, Gopher, HTTP, and other network
    services). It would be ineffective to have a separate process listening for a
    particular type of connection, so instead there is only one listener that can
    recognize the type of the connection and can start the correct type of program
    to provide the service. This single listener is called `inetd`; see the “Linux
    Network Administrators’ Guide” for more information.


    ### 8.3 What login does

    The `login` program takes care of authenticating the user (making sure that the
    user-name and password match), and of setting up an initial environment for the
    user by setting permissions for the serial line and starting the shell. Part of
    the initial setup is outputting the contents of the file `/etc/motd` (short for
    message of the day) and checking for electronic mail. These can be disabled by
    creating a file called `.hushlogin` in the user’s home directory. If the file
    `/etc/nologin` exists, logins are disabled. That file is typically created by
    `shutdown` and relatives. `login` checks for this file, and will refuse to accept
    a login if it does exist. If it does exist, `login` outputs its contents to the
    terminal before it quits. `login` logs all failed login attempts in a system log
    file (via `syslog`). It also logs *all* logins by `root`. Both of these can be
    useful when tracking down intruders. Currently logged in people are listed in
    `/var/run/utmp`. This file is valid only until the system is next rebooted or
    shut down; it is cleared when the system is booted. It lists each user and the
    terminal (or network connection) he is using, along with some other useful information.
    The `who`, `w`, and other similar commands look in `utmp` to see who are logged
    in. All successful logins are recorded into `/var/log/wtmp`. This file will grow
    without limit, so it must be cleaned regularly, for example by having a weekly
    `cron` job to clear it.¹


    ¹Good Linux distributions do this out of the box.


    ### 8.4 X and xdm

    **META:** X implements logins via xdm; also: xterm -ls


    ### 8.5 Access control

    The user database is traditionally contained in the `/etc/passwd` file. Some systems
    use **shadow passwords**, and have moved the passwords to `/etc/shadow`. Sites
    with many computers that share the accounts use NIS or some other method to store
    the user database; they might also automatically copy the database from one central
    location to all other computers. The user database contains not only the passwords,
    but also some additional information about the users, such as their real names,
    home directories, and login shells. This other information needs to be public,
    so that anyone can read it. Therefore the password is stored encrypted. This does
    have the drawback that anyone with access to the encrypted password can use various
    cryptographical methods to guess it, without trying to actually log into the computer.
    Shadow passwords try to avoid this by moving the password into another file, which
    only `root` can read (the password is still stored encrypted). However, installing
    shadow passwords later onto a system that did not support them can be difficult.
    With or without passwords, it is important to make sure that all passwords in
    a system are good, i.e., not easily guessable. The `crack` program can be used
    to crack passwords; any password it can find is by definition not a good one.
    While `crack` can be run by intruders, it can also be run by the system administrator
    to avoid bad passwords. Good passwords can also be enforced by the `passwd` program;
    this is in fact more effective in CPU cycles, since cracking passwords requires
    quite a lot of computation. The user group database is kept in `/etc/group`; for
    systems with shadow passwords, there can be a `/etc/shadow.group`. `root` usually
    can''t login via most terminals or the network, only via terminals listed in the
    `/etc/securetty` file. This makes it necessary to get physical access to one of
    these terminals. It is, however, possible to log in via any terminal as any other
    user, and use the `su` command to become `root`.


    ### 8.6 Shell startup

    When an interactive login shell starts, it automatically executes one or more
    predefined files. Different shells execute different files; see the documentation
    of each shell for further information.'
  mdcn: '## 7.5 单用户模式启动

    如果文件系统损坏严重到`fsck`无法自动修复的程度，就需要进入单用户模式。这种损坏情况相对少见，通常和硬盘损坏或实验版内核发布有关，但提前了解应对方法总是好的。作为一种安全措施，配置正确的系统会在单用户模式启动shell之前要求输入`root`密码。否则，只要在LILO中输入合适的参数就能直接以`root`身份登录，非常简单。（当然，如果文件系统问题导致`/etc/passwd`损坏，这个方法就会失效，这种情况下最好准备一张启动软盘。）

    ## 第8章 登录与退出

    > *本章需要一段引言。各位有什么建议吗？*

    本节介绍用户登录和退出时的相关流程，会详细描述后台进程、日志文件、配置文件等的各种交互机制。

    ### 8.1 通过终端登录

    图8.1展示了通过终端登录的流程。首先，`init`进程会确保终端连接（或控制台）存在对应的`getty`程序。`getty`会在终端监听，等待用户发出准备登录的提示（通常用户需要输入内容才会触发）。当检测到用户操作时，`getty`会输出存储在`/etc/issue`中的欢迎信息，提示输入用户名，最后运行`login`程序。`login`程序将用户名作为参数，提示用户输入密码。如果两者匹配，`login`会启动为用户配置的shell；否则直接退出并终止进程（可能会给用户再次输入用户名和密码的机会）。`init`会检测到该进程终止，并为终端启动一个新的`getty`进程。注意，这里唯一的新进程是由`init`通过`fork`系统调用创建的进程；`getty`和`login`只是通过`exec`系统调用替换了进程中运行的程序。由于检测终端激活状态的流程较为复杂（传统上也是如此），串行线路需要单独的程序来检测用户操作。`getty`还会适配连接的速度和其他设置，这对于拨号连接尤为重要，因为这些参数每次拨号都可能发生变化。目前有多个版本的`getty`和`init`在使用，它们各有优缺点。建议了解自己系统上使用的版本，以及其他版本的相关信息（你可以通过Linux软件地图搜索这些内容）。如果没有拨号连接需求，你可能不需要担心`getty`，但`init`仍然非常重要。

    ### 8.2 通过网络登录

    同一网络中的两台计算机通常通过单根物理线缆连接。当它们通过网络通信时，参与通信的每台计算机上的程序通过**虚拟连接**相连，可以理解为一种虚拟的线缆。对于虚拟连接两端的程序来说，它们独占这条虚拟线缆的使用权。但由于线缆并非真实存在的，而是虚拟的，因此两台计算机的操作系统可以让多条虚拟连接共享同一根物理线缆。这样一来，仅用一根物理线缆，多个程序就能同时通信，无需知道或关心其他通信的存在。甚至可以让多台计算机共用同一根线缆；虚拟连接仅存在于两台计算机之间，其他计算机会忽略自己不参与的连接。以上是对网络现实的简化且过度抽象的描述。不过，这足以帮助你理解网络登录和普通登录有所不同的核心原因。虚拟连接会在两台不同计算机上的程序需要通信时建立。由于原则上可以从网络中的任意一台计算机登录到另一台任意计算机，因此可能存在的虚拟通信数量极多。基于此，为每一个可能的登录都启动一个`getty`进程是不现实的。有一个单独的`inetd`进程（对应`getty`的功能），负责处理*所有*网络登录。当它检测到传入的网络登录请求（即检测到与其他计算机建立了新的虚拟连接）时，会启动一个新进程来处理该次登录。原始进程会保留并继续监听新的登录请求。让情况更复杂的是，网络登录存在多种通信协议。其中最重要的两种是`telnet`和`rlogin`。除了登录功能外，还有很多其他类型的虚拟连接可供建立（用于FTP、Gopher、HTTP及其他网络服务）。如果为每种特定类型的连接都设置单独的监听进程，效率会很低，因此只有一种通用的监听器，它可以识别连接类型，并启动对应类型的程序来提供服务。这个单一的监听器就是`inetd`，更多相关信息可以参考《Linux网络管理员指南》。

    ### 8.3 登录程序的功能

    `login`程序负责用户身份认证（确认用户名和密码匹配），并通过设置串行线路权限、启动shell来为用户配置初始运行环境。初始配置流程的一部分是输出`/etc/motd`文件的内容（motd是message
    of the day的缩写，意为每日通知），并检查是否有电子邮件。在用户的主目录下创建一个名为`.hushlogin`的文件可以禁用这两项功能。如果`/etc/nologin`文件存在，登录功能会被禁用。该文件通常由`shutdown`及相关命令创建。`login`程序会检查该文件，如果存在就会拒绝登录请求。如果该文件存在，`login`会在退出前将其内容输出到终端。`login`会将所有失败的登录尝试记录到系统日志文件中（通过`syslog`实现）。它还会记录*所有*`root`用户的登录记录。这两类记录在追踪入侵者时都很有用。当前登录的用户信息会记录在`/var/run/utmp`文件中。该文件仅在系统下次重启或关机前有效，系统启动时会被清空。它会列出每个用户及其使用的终端（或网络连接），还有一些其他有用信息。`who`、`w`及其他类似命令会查看`utmp`文件来获取已登录用户的信息。所有成功的登录记录会被写入`/var/log/wtmp`文件。该文件会无限增长，因此需要定期清理，例如设置每周运行的`cron`任务来清空它。¹

    ¹ 主流Linux发行版默认会完成这项配置。

    ### 8.4 X与xdm

    **META：** X通过xdm实现登录；另外：xterm -ls

    ### 8.5 访问控制

    用户数据库传统上存储在`/etc/passwd`文件中。部分系统使用**影子密码**机制，将密码迁移到`/etc/shadow`文件中。多台计算机共享账户的站点会使用NIS或其他方法存储用户数据库；也可能将数据库从中央位置自动复制到所有其他计算机。用户数据库不仅包含密码，还包含用户的额外信息，例如真实姓名、主目录和登录shell。这些其他信息需要公开，以便所有人可读，因此密码是加密存储的。但这有一个缺点：任何能获取到加密密码的人都可以通过各种密码学方法猜解密码，无需实际登录计算机。影子密码机制通过将密码转移到仅`root`可读的另一个文件中来解决这个问题（密码仍然以加密形式存储）。不过，在原本不支持影子密码的系统中后期安装该机制可能会比较困难。无论是否使用影子密码，确保系统中所有密码足够安全（即不易被猜解）都非常重要。`crack`程序可以用来破解密码；任何能被该程序破解的密码显然都不够安全。虽然`crack`可能被入侵者使用，但系统管理员也可以用它来避免设置弱密码。还可以通过`passwd`程序强制要求使用强密码；这种方式实际上更高效，因为破解密码需要大量计算资源。用户组数据库存储在`/etc/group`文件中；对于使用影子密码的系统，可能存在`/etc/shadow.group`文件。`root`通常无法通过大多数终端或网络登录，只能在`/etc/securetty`文件中列出的终端上登录。这要求必须物理接触到这些终端之一才能以`root`身份登录。不过，可以通过任意终端以其他用户身份登录，再使用`su`命令切换到`root`用户。

    ### 8.6 Shell启动流程

    当交互式登录shell启动时，会自动执行一个或多个预定义文件。不同shell执行的文件不同，更多信息请参考对应shell的文档。

    '
