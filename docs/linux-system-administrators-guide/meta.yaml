  md: '# ## Chapter 11


    # # Keeping Time


    > > Time is an illusion. Lunchtime double so.

    > (Douglas Adams.)


    This chapter explains how a Linux system keeps time, and what you need to do to
    avoid causing trouble. Usually, you don''t need to do anything about time, but
    it is good to understand it.


    # ### 11.1 Time zones


    Time measurement is based on mostly regular natural phenomena, such as alternating
    light and dark periods caused by the rotation of the planet. The total time taken
    by two successive periods is constant, but the lengths of the light and dark period
    vary. One simple constant is noon.


    Noon is the time of the day when the Sun is at its highest position. Since the
    Earth is round,¹ noon happens at different times in different places. This leads
    to the concept of **local time**. Humans measure time in many units, most of which
    are tied to natural phenomena like noon. As long as you stay in the same place,
    it doesn''t matter that local times differ.


    As soon as you need to communicate with distant places, you''ll notice the need
    for a common time. In modern times, most of the places in the world communicate
    with most other places in the world, so a global standard for measuring time has
    been defined. This time is called **universal time** (UT or UTC, formerly known
    as


    > ¹ According to recent research.'
  merge: -1
  pgno: 110
- img_proc: true
  md: 'Greenwich Mean Time or GMT, since it used to be local time in Greenwich, England).
    When people with different local times need to communicate, they can express times
    in universal time, so that there is no confusion about when things should happen.


    Each local time is called a time zone. While geography would allow all places
    that have noon at the same time have the same time zone, politics makes it difficult.
    For various reasons, many countries use **daylight savings time**, that is, they
    move their clocks to have more natural light while they work, and then move the
    clocks back during winter. Other countries do not do this. Those that do, do not
    agree when the clocks should be moved, and they change the rules from year to
    year. This makes time zone conversions definitely non-trivial.


    Time zones are best named by the location or by telling the difference between
    local and universal time. In the US and some other countries, the local time zones
    have a name and a three letter abbreviation. The abbreviations are not unique,
    however, and should not be used unless the country is also named. It is better
    to talk about the local time in, say, Helsinki, than about East European time,
    since not all countries in Eastern Europe follow the same rules.


    Linux has a time zone package that knows about all existing time zones, and that
    can easily be updated when the rules change. All the system administrator needs
    to do is to select the appropriate time zone. Also, each user can set his own
    time zone—this is important since many people work with computers in different
    countries over the Internet. When the rules for daylight savings time change in
    your local time zone, make sure you''ll upgrade at least that part of your Linux
    system. Other than setting the system time zone and upgrading the time zone data
    files, there is little need to bother about time.


    # ## 11.2 The hardware and software clocks


    A personal computer has a battery driven hardware clock. The battery ensures that
    the clock will work even if the rest of the computer is without electricity. The
    hardware clock can be set from the BIOS setup screen or from whatever operating
    system is running.


    The Linux kernel keeps track of time independently from the hardware clock. During
    the boot, Linux sets its own clock to the same time as the hardware clock. After
    this, both clocks run independently. Linux maintains its own clock because looking
    at the hardware is slow and complicated.'
  merge: -1
  pgno: 111
- img_proc: true
  md: 'The kernel clock always shows universal time. This way, the kernel does not
    need to know about time zones at all—the simplicity results in higher reliability
    and makes it easier to update the time zone information. Each process handles
    time zone conversions itself (using standard tools that are part of the time zone
    package).


    The hardware clock can be in local time or in universal time. It is usually better
    to have it in universal time, because then you don''t need to change the hardware
    clock when daylight savings time begins or ends (UTC does not have DST). Unfortunately,
    some PC operating systems—including MS-DOS, Windows, OS/2—assume the hardware
    clock shows local time. Linux can handle either, but if the hardware clock shows
    local time, then it must be modified when daylight savings time begins or ends
    (otherwise it wouldn''t show local time).


    # 11.3 Showing and setting time


    In the Debian system, the system time zone is determined by the symbolic link
    `/etc/localtime`. This link points at a time zone data file that describes the
    local time zone. The time zone data files are stored in `/usr/lib/zoneinfo`. Other
    Linux distributions may do this differently.


    A user can change his private time zone by setting the TZ environment variable.
    If it is unset, the system time zone is assumed. The syntax of the TZ variable
    is described in the *tzset*(3) manual page.


    The `date` command shows the current date and time.² For example:


    ```

    $ date

    Sun Jul 14 21:53:41 EET DST 1996

    $

    ```


    That time is Sunday, 14th of July, 1996, at about ten before ten at the evening,
    in the time zone called “EET DST” (which might be East European Daylight Savings
    Time). `date` can also show the universal time:


    ```

    $ date -u

    Sun Jul 14 18:53:42 UTC 1996

    $

    ```


    > <u>date is also used to set the kernel''s software clock:</u>


    > ²Beware of the **time** command, which does *not* show the current time.'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# ## 11.4 When the clock is wrong


    The Linux software clock is not always accurate. It is kept running by a periodic
    **timer interrupt** generated by PC hardware. If the system has too many processes
    running, it may take too long to service the timer interrupt, and the software
    clock starts slipping behind. The hardware clock runs independently and is usually
    more accurate. If you boot your computer often (as is the case for most systems
    that aren''t servers), it will usually keep fairly accurate time.


    If you need to adjust the hardware clock, it is usually simplest to reboot, go
    into the BIOS setup screen, and do it from there. This avoids all trouble that
    changing system time might cause. If doing it via BIOS is not an option, set the
    new time with `date` and `clock` (in that order), but be prepared to reboot, if
    some part of the'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# 11.4. WHEN THE CLOCK IS WRONG


    system starts acting funny.


    A networked computer (even if just over the modem) can check its own clock automatically,
    by comparing it to some other computer''s time. If the other computer is known
    to keep very accurate time, then both computers will keep accurate time. This
    can be done by using the rdate and netdate commands. Both check the time of a
    remote computer (netdate can handle several remote computers), and set the local
    computer''s time to that. By running one these commands regularly, your computer
    will keep as accurate time as the remote computer.


