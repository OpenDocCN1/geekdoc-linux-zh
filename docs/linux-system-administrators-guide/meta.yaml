  md: '+   * List the floppy devices and their allowable mount points together with
    the suitable options in `/etc/fstab`.


    The last alternative can be implemented by adding a line like the following to
    the `/etc/fstab` file:


    ```

    /dev/fd0 /floppy msdos user,noauto 0 0

    ```


    The columns are: device file to mount, directory to mount on, filesystem type,
    options, backup frequency (used by `dump`), and `fsck` pass number (to specify
    the order in which filesystems should be checked upon boot; 0 means no check).


    The `noauto` option stops this mount to be done automatically when the system
    is started (i.e., it stops `mount -a` from mounting it). The `user` option allows
    any user to mount the filesystem, and, because of security reasons, disallows
    execution of programs (normal or setuid) and interpretation of device files from
    the mounted filesystem. After this, any user can mount a floppy with an `msdos`
    filesystem with the following command:


