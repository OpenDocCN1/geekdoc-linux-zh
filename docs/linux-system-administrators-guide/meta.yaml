    \ filesystem.\n\n**glossary** A list of words and explanations of what they do.\
    \ Not to be confused with a dictionary, which is also a list of words and explanations.\n\
    \n**kernel** (p. 6) Part of an operating system that implements the interaction\
    \ with hardware and the sharing of resources. See also system program.\n\n**operating\
