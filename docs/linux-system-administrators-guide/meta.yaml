- md: '## 4.8 Filesystems

    ### 4.8.3 Which filesystem should be used?

    There is usually little point in using many different filesystems. Currently,
    ext2fs is the most popular one, and it is probably the wisest choice. Depending
    on the overhead for bookkeeping structures, speed, (perceived) reliability, compatibility,
    and various other reasons, it may be advisable to use another file system. This
    needs to be decided on a case-by-case basis.


    ### 4.8.4 Creating a filesystem

    Filesystems are created, i.e., initialized, with the mkfs command. There is actually
    a separate program for each filesystem type. mkfs is just a front end that runs
    the appropriate program depending on the desired filesystem type. The type is
    selected with the -t fstype option. The programs called by mkfs have slightly
    different command line interfaces. The common and most important options are summarized
    below; see the manual pages for more.

    - -t fstype Select the type of the filesystem.

    - -c Search for bad blocks and initialize the bad block list accordingly.

    - -l filename Read the initial bad block list from the file filename.


    To create an ext2 filesystem on a floppy, one would give the following commands:

    ```

    $ fdformat -n /dev/fd0H1440

    Double-sided, 80 tracks, 18 sec/track. Total capacity 1440 kB. Formatting ...
    done

    $ badblocks /dev/fd0H1440 1440 > bad-blocks

    $ mkfs -t ext2 -l bad-blocks /dev/fd0H1440

    mke2fs 0.5a, 5-Apr-94 for EXT2 FS 0.5, 94/03/10

    360 inodes, 1440 blocks

    72 blocks (5.00%) reserved for the super user

    First data block=1

    Block size=1024 (log=0)

    Fragment size=1024 (log=0)

    1 block group

    8192 blocks per group, 8192 fragments per group

    360 inodes per group

    Writing inode tables: done

    Writing superblocks and filesystem accounting information: done

    $

    ```

    First, the floppy was formatted (the `-n` option prevents validation, i.e., bad
    block checking). Then bad blocks were searched with `badblocks`, with the output
    redirected to a file, `bad-blocks`. Finally, the filesystem was created, with
    the bad block list initialized by whatever `badblocks` found. The `-c` option
    could have been used with `mkfs` instead of `badblocks` and a separate file. The
    example below does that.

    ```

    $ mkfs -t ext2 -c /dev/fd0H1440

    mke2fs 0.5a, 5-Apr-94 for EXT2 FS 0.5, 94/03/10

    360 inodes, 1440 blocks

    72 blocks (5.00%) reserved for the super user

    First data block=1

    Block size=1024 (log=0)

    Fragment size=1024 (log=0)

    1 block group

    8192 blocks per group, 8192 fragments per group

    360 inodes per group

    Checking for bad blocks (read-only test): done

    Writing inode tables: done

    Writing superblocks and filesystem accounting information: done

    $

    ```

    The `-c` is more convenient than a separate use of `badblocks`, but `badblocks`
    is necessary for checking after the filesystem has been created. The process to
    prepare filesystems on hard disks or partitions is the same as for floppies, except
    that the formatting isn''t needed.


    ### 4.8.5 Mounting and unmounting

    Before one can use a filesystem, it has to be **mounted**. The operating system
    then does various bookkeeping things to make sure that everything works. Since
    all files in UNIX are in a single directory tree, the mount operation will make
    it look like the contents of the new filesystem are the contents of an existing
    subdirectory in some already mounted filesystem. For example, figure 4.3 shows
    three separate filesystems, each with their own root directory. When the last
    two filesystems are mounted below /home and /usr, respectively, on the first filesystem,
    we can get a single directory tree, as in figure 4.4.


    ![](img/ceaf8a70f91e44dcbad3d66530d36479_54_0.png)

    Figure 4.3: Three separate filesystems.

    ![](img/ceaf8a70f91e44dcbad3d66530d36479_54_1.png)

    Figure 4.4: /home and /usr have been mounted.


    The mounts could be done as in the following example:

    ```

    $ mount /dev/hda2 /home

    $ mount /dev/hda3 /usr

    $

    ```

    The mount command takes two arguments. The first one is the device file corresponding
    to the disk or partition containing the filesystem. The second one is the directory
    below which it will be mounted. After these commands the contents of the two filesystems
    look just like the contents of the /home and /usr directories, respectively. One
    would then say that "/dev/hda2 is mounted on /home", and similarly for /usr. To
    look at either filesystem, one would look at the contents of the directory on
    which it has been mounted, just as if it were any other directory. Note the difference
    between the device file, /dev/hda2, and the mounted-on directory, /home. The device
    file gives access to the raw contents of the disk, the mounted-on directory gives
    access to the files on the disk. The mounted-on directory is called the **mount
    point**.


    Linux supports many filesystem types. `mount` tries to guess the type of the filesystem.
    You can also use the `-t` *fstype* option to specify the type directly; this is
    sometimes necessary, since the heuristics `mount` uses do not always work. For
    example, to mount an MS-DOS floppy, you could use the following command:

    ```

    $ mount -t msdos /dev/fd0 /floppy

    $

    ```

    The mounted-on directory need not be empty, although it must exist. Any files
    in it, however, will be inaccessible by name while the filesystem is mounted.
    (Any files that have already been opened will still be accessible. Files that
    have hard links from other directories can be accessed using those names.) There
    is no harm done with this, and it can even be useful. For instance, some people
    like to have `/tmp` and `/var/tmp` synonymous, and make `/tmp` be a symbolic link
    to `/var/tmp`. When the system is booted, before the `/usr` filesystem is mounted,
    a `/var/tmp` directory residing on the root filesystem is used instead. When `/usr`
    is mounted, it will make the `/var/tmp` directory on the root filesystem inaccessible.
    If `/var/tmp` didn''t exist on the root filesystem, it would be impossible to
    use temporary files before mounting `/var`.


    If you don''t intend to write anything to the filesystem, use the `-r` switch
    for `mount` to do a **readonly mount**. This will make the kernel stop any attempts
    at writing to the filesystem, and will also stop the kernel from updating file
    access times in the inodes. Read-only mounts are necessary for unwritable media,
    e.g., CD-ROM''s.


    The alert reader has already noticed a slight logistical problem. How is the first
    filesystem (called the **root filesystem**, because it contains the root directory)
    mounted, since it obviously can''t be mounted on another filesystem? Well, the
    answer is that it is done by magic.⁷

    > ⁷For more information, see the kernel source or the Kernel Hackers'' Guide.


    The root filesystem is magically mounted at boot time, and one can rely on it
    to always be mounted—if the root filesystem can''t be mounted, the system does
    not boot. The name of the filesystem that is magically mounted as root is either
    compiled into the kernel, or set using LILO or `rdev`. The root filesystem is
    usually first mounted readonly. The startup scripts will then run `fsck` to verify
    its validity, and if there are no problems, they will **re-mount** it so that
    writes will also be allowed. `fsck` must not be run on a mounted filesystem, since
    any changes to the filesystem while `fsck` is running *will* cause trouble. Since
    the root filesystem is mounted readonly while it is being checked, `fsck` can
    fix any problems without worry, since the remount operation will flush any metadata
    that the filesystem keeps in memory.


    On many systems there are other filesystems that should also be mounted automatically
    at boot time. These are specified in the /etc/fstab file; see the fstab man page
    for details on the format. The details of exactly when the extra filesystems are
    mounted depend on many factors, and can be configured by each administrator if
    need be. When the chapter on booting is finished, you may read all about it there.


    When a filesystem no longer needs to be mounted, it can be unmounted with umount⁸.
    umount takes one argument: either the device file or the mount point. For example,
    to unmount the directories of the previous example, one could use the commands

    ```

    $ umount /dev/hda2

    $ umount /usr

    $

    ```

    See the man page for further instructions on how to use the command. It is imperative
    that you always unmount a mounted floppy. *Don''t just pop the floppy out of the
    drive!* Because of disk caching, the data is not necessarily written to the floppy
    until you unmount it, so removing the floppy from the drive too early might cause
    the contents to become garbled. If you only read from the floppy, this is not
    very likely, but if you write, even accidentally, the result may be catastrophic.
    Mounting and unmounting requires super user privileges, i.e., only root can do
    it. The reason for this is that if any user can mount a floppy on any directory,
    then it is rather easy to create a floppy with, say, a Trojan horse disguised
    as /bin/sh, or any other often used program. However, it is often necessary to
    allow users to use floppies, and there are several ways to do this:

    - Give the users the root password. This is obviously bad security, but is the
    easiest solution. It works well if there is no need for security anyway, which
    is the case on many non-networked, personal systems.

    - Use a program such as sudo to allow users to use mount. This is still bad security,
    but doesn''t directly give super user privileges to everyone.⁹

    - Make the users use mtools, a package for manipulating MS-DOS filesystems, without
    mounting them. This works well if MS-DOS floppies are all that are needed, but
    is rather awkward otherwise.

    > ⁸It should of course be unmount, but the n mysteriously disappeared in the 70''s,
    and hasn''t been seen since. Please return it to Bell Labs, NJ, if you find it.

    > ⁹It requires several seconds of hard thinking on the users'' behalf.'
