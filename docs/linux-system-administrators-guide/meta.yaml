- md: '### 9.3 Changing user properties

    There are a few commands for changing various properties of an account (i.e.,
    the relevant field in `/etc/passwd`):

    - `chfn`：Change the full name field.

    - `chsh`：Change the login shell.

    - `passwd`：Change the password.


    The super-user may use these commands to change the properties of any account.
    Normal users can only change the properties of their own account. It may sometimes
    be necessary to disable these commands (with `chmod`) for normal users, for example
    in an environment with many novice users. Other tasks need to be done by hand.
    For example, to change the username, you need to edit `/etc/passwd` directly (with
    `vipw`, remember). Likewise, to add or remove the user to more groups, you need
    to edit `/etc/group` (with `vigr`). Such tasks tend to be rare, however, and should
    be done with caution: for example, if you change the username, e-mail will no
    longer reach the user, unless you also create a mail alias.⁴


    ⁴The user''s name might change due to marriage, for example, and he might want
    to have his username reflect his new name.


    ### 9.4 Removing a user

    To remove a user, you first remove all his files, mailboxes, mail aliases, print
    jobs, `cron` and `at` jobs, and all other references to the user. Then you remove
    the relevant lines from `/etc/passwd` and `/etc/group` (remember to remove the
    username from all groups it''s been added to). It may be a good idea to first
    disable the account (see below), before you start removing stuff, to prevent the
    user from using the account while it is being removed. Remember that users may
    have files outside their home directory. The `find` command can find them:

    ```bash

    find / -user username

    ```

    However, note that the above command will take a *long* time, if you have large
    disks. If you mount network disks (see section 2.3.8), you need to be careful
    so that you won''t trash the network or the server. Some Linux distributions come
    with special commands to do this; look for `deluser` or `userdel`. However, it
    is easy to do it by hand as well, and the commands might not do everything.


    ### 9.5 Disabling a user temporarily

    It is sometimes necessary to temporarily disable an account, without removing
    it. For example, the user might not have paid his fees, or the system administrator
    may suspect that a cracker has got the password of that account. The best way
    to disable an account is to change its shell into a special program that just
    prints a message. This way, whoever tries to log into the account, will fail,
    and will know why. The message can tell the user to contact the system administrator
    so that any problems may be dealt with. It would also be possible to change the
    username or password to something else, but then the user won''t know what is
    going on. Confused users mean more work.^5


    ^5But they can be *so* fun, if you''re a BOFH.


    A simple way to create the special programs is to write ''tail scripts'':

    ```bash

    #!/usr/bin/tail +2

    This account has been closed due to a security breach. Please call 555-1234 and
    wait for the men in black to arrive.

    ```

    The first two characters (''#!'') tell the kernel that the rest of the line is
    a command that needs to be run to interpret this file. The `tail` command in this
    case outputs everything except the first line to the standard output. If `billg`
    is suspected of a security breach, the system administrator would do something
    like this:

    ```bash

    # chsh -s /usr/local/lib/no-login/security billg

    # su - tester

    This account has been closed due to a security breach. Please call 555-1234 and
    wait for the men in black to arrive.

    #

    ```

    The purpose of the `su` is to test that the change worked, of course. Tail scripts
    should be kept in a separate directory, so that their names don''t interfere with
    normal user commands.


    ## Chapter 10

    ## Backups

    > Hardware is indeterministically reliable.

    > Software is deterministically unreliable.

    > People are indeterministically unreliable.

    > Nature is deterministically reliable.


    This chapter explains about why, how, and when to make backups, and how to restore
    things from backups.


    ### 10.1 On the importance of being backed up

    Your data is valuable. It will cost you time and effort re-create it, and that
    costs money or at least personal grief and tears; sometimes it can’t even be re-created,
    e.g., if it is the results of some experiments. Since it is an investment, you
    should protect it and take steps to avoid losing it. There are basically four
    reasons why you might lose data: hardware failures, software bugs, human action,
    or natural disasters.¹

    ¹The fifth reason is “something else”.


    Although modern hardware tends to be quite reliable, it can still break seemingly
    spontaneously. The most critical piece of hardware for storing data is the hard
    disk, which relies on tiny magnetic fields remaining intact in a world filled
    with electromagnetic noise. Modern software doesn’t even tend to be reliable;
    a rock solid program is an exception, not a rule. Humans are quite unreliable,
    they will either make a mistake, or they will be malicious and destroy data on
    purpose. Nature might not be evil, but it can wreak havoc even when being good.
    All in all, it is a small miracle that anything works at all.


    Backups are a way to protect the investment in data. By having several copies
    of the data, it does not matter as much if one is destroyed (the cost is only
    that of the restoration of the lost data from the backup). It is important to
    do backups properly. Like everything else that is related to the physical world,
    backups will fail sooner or later. Part of doing backups well is to make sure
    they work; you don''t want to notice that your backups didn''t work.$^2$

    $^2$Don''t laugh. This has happened to several people.


    Adding insult to injury, you might have a bad crash just as you''re making the
    backup; if you have only one backup medium, it might be destroyed as well, leaving
    you with the smoking ashes of hard work.$^3$

    $^3$Been there, done that...


    Or you might notice, when trying to restore, that you forgot to back up something
    important, like the user database on a 15 000 user site. Best of all, all your
    backups might be working perfectly, but the last known tape drive reading the
    kind of tapes you used was the one that now has a bucketful of water in it. When
    it comes to backups, paranoia is in the job description.


    ### 10.2 Selecting the backup medium

    The most important decision regarding backups is the choice of backup medium.
    You need to consider cost, reliability, speed, availability, and usability.


    Cost is important, since you should preferably have several times more backup
    storage than what you need for the data. A cheap medium is usually a must. Reliability
    is extremely important, since a broken backup can make a grown man cry. A backup
    medium must be able to hold data without corruption for years. The way you use
    the medium affects it reliability as a backup medium. A hard disk is typically
    very reliable, but as a backup medium it is not very reliable, if it is in the
    same computer as the disk you are backing up.


    Speed is usually not very important, if backups can be done without interaction.
    It doesn''t matter if a backup takes two hours, as long as it needs no supervision.
    On the other hand, if the backup can''t be done when the computer would otherwise
    be idle, then speed is an issue.


    Availability is obviously necessary, since you can''t use a backup medium if it
    doesn''t exist. Less obvious is the need for the medium to be available even in
    the future, and on computers other than your own. Otherwise you may not be able
    to restore your backups after a disaster.


    Usability is a large factor in how often backups are made. The easier it is to
    make backups, the better. A backup medium mustn''t be hard or boring to use.


    The typical alternatives are floppies and tapes. Floppies are very cheap, fairly
    reliable, not very fast, very available, but not very usable for large amounts
    of data. Tapes are cheap to somewhat expensive, fairly reliable, fairly fast,
    quite available, and—depending on the size of the tape—quite comfortable. There
    are other alternatives. They are usually not very good on availability, but if
    that is not a problem, they can be better in other ways. For example, magneto-optical
    disks can have good sides of both floppies (they''re random access, making restoration
    of a single file quick) and tapes (contain a lot of data).


    ### 10.3 Selecting the backup tool

    There are many tools that can be used to make backups. The traditional UNIX tools
    used for backups are `tar`, `cpio`, and `dump`. In addition, there are large number
    of third party packages (both freeware and commercial) that can be used. The choice
    of backup medium can affect the choice of tool.


    `tar` and `cpio` are similar, and mostly equivalent from a backup point of view.
    Both are capable of storing files on tapes, and retrieving files from them. Both
    are capable of using almost any media, since the kernel device drivers take care
    of the low level device handling and the devices all tend to look alike to user
    level programs. Some UNIX versions of `tar` and `cpio` may have problems with
    unusual files (symbolic links, device files, files with very long pathnames, and
    so on), but the Linux versions should handle all files correctly.


    `dump` is different in that it reads the filesystem directly and not via the filesystem.
    It is also written specifically for backups; `tar` and `cpio` are really for archiving
    files, although they work for backups as well. Reading the filesystem directly
    has some advantages. It makes it possible to back files up without affecting their
    time stamps; for `tar` and `cpio`, you would have to mount the filesystem read-only
    first. Directly reading the filesystem is also more effective, if everything needs
    to be backed up, since it can be done with much less disk head movement. The major
    disadvantage is that it makes the backup program specific to one filesystem type;
    the Linux `dump` program understands the ext2 filesystem only.'
  mdcn: "\n### 9.3 修改用户属性\n有几个命令可用于修改账户的各类属性（即`/etc/passwd`中的对应字段）：\n- `chfn`：更改全名字段。\n\
