  - '[PAGE 55]


    # 4.8. FILESYSTEMS


    Linux supports many filesystem types. `mount` tries to guess the type of the filesystem.
    You can also use the `-t` *fstype* option to specify the type directly; this is
    sometimes necessary, since the heuristics `mount` uses do not always work. For
    example, to mount an MS-DOS floppy, you could use the following command:


    ```

    $ mount -t msdos /dev/fd0 /floppy

    $

    ```


    The mounted-on directory need not be empty, although it must exist. Any files
    in it, however, will be inaccessible by name while the filesystem is mounted.
    (Any files that have already been opened will still be accessible. Files that
    have hard links from other directories can be accessed using those names.) There
    is no harm done with this, and it can even be useful. For instance, some people
    like to have `/tmp` and `/var/tmp` synonymous, and make `/tmp` be a symbolic link
    to `/var/tmp`. When the system is booted, before the `/usr` filesystem is mounted,
    a `/var/tmp` directory residing on the root filesystem is used instead. When `/usr`
    is mounted, it will make the `/var/tmp` directory on the root filesystem inaccessible.
    If `/var/tmp` didn''t exist on the root filesystem, it would be impossible to
    use temporary files before mounting `/var`.


    If you don''t intend to write anything to the filesystem, use the `-r` switch
    for `mount` to do a **readonly mount**. This will make the kernel stop any attempts
    at writing to the filesystem, and will also stop the kernel from updating file
    access times in the inodes. Read-only mounts are necessary for unwritable media,
    e.g., CD-ROM''s.


    The alert reader has already noticed a slight logistical problem. How is the first
    filesystem (called the **root filesystem**, because it contains the root directory)
    mounted, since it obviously can''t be mounted on another filesystem? Well, the
    answer is that it is done by magic.⁷ The root filesystem is magically mounted
    at boot time, and one can rely on it to always be mounted—if the root filesystem
    can''t be mounted, the system does not boot. The name of the filesystem that is
    magically mounted as root is either compiled into the kernel, or set using LILO
    or `rdev`.


    The root filesystem is usually first mounted readonly. The startup scripts will
    then run `fsck` to verify its validity, and if there are no problems, they will
    **re-mount** it so that writes will also be allowed. `fsck` must not be run on
    a mounted filesystem, since any changes to the filesystem while `fsck` is running
    *will* cause trouble. Since the root filesystem is mounted readonly while it is
    being checked, `fsck` can fix any problems without worry, since the remount operation
    will flush any metadata that the filesystem keeps in memory.


    > ⁷For more information, see the kernel source or the Kernel Hackers'' Guide.'
  - '[PAGE 56]


    On many systems there are other filesystems that should also be mounted automatically
    at boot time. These are specified in the /etc/fstab file; see the fstab man page
    for details on the format. The details of exactly when the extra filesystems are
    mounted depend on many factors, and can be configured by each administrator if
    need be. When the chapter on booting is finished, you may read all about it there.


    When a filesystem no longer needs to be mounted, it can be unmounted with umount⁸.
    umount takes one argument: either the device file or the mount point. For example,
    to unmount the directories of the previous example, one could use the commands


    ```

    $ umount /dev/hda2

    $ umount /usr

    $

    ```


    See the man page for further instructions on how to use the command. It is imperative
    that you always unmount a mounted floppy. *Don''t just pop the floppy out of the
    drive!* Because of disk caching, the data is not necessarily written to the floppy
    until you unmount it, so removing the floppy from the drive too early might cause
    the contents to become garbled. If you only read from the floppy, this is not
    very likely, but if you write, even accidentally, the result may be catastrophic.


    Mounting and unmounting requires super user privileges, i.e., only root can do
    it. The reason for this is that if any user can mount a floppy on any directory,
    then it is rather easy to create a floppy with, say, a Trojan horse disguised
    as /bin/sh, or any other often used program. However, it is often necessary to
    allow users to use floppies, and there are several ways to do this:


    +   - Give the users the root password. This is obviously bad security, but is
    the easiest solution. It works well if there is no need for security anyway, which
    is the case on many non-networked, personal systems.

    - Use a program such as sudo to allow users to use mount. This is still bad security,
    but doesn''t directly give super user privileges to everyone.⁹

    - Make the users use mtools, a package for manipulating MS-DOS filesystems, without
    mounting them. This works well if MS-DOS floppies are all that is needed, but
    is rather awkward otherwise.


    > ⁸It should of course be unmount, but the n mysteriously disappeared in the 70''s,
    and hasn''t been seen since. Please return it to Bell Labs, NJ, if you find it.


    > ⁹It requires several seconds of hard thinking on the users'' behalf.'
- md: '- List the floppy devices and their allowable mount points together with the
    suitable options in `/etc/fstab`. The last alternative can be implemented by adding
    a line like the following to the `/etc/fstab` file:

    ```

    /dev/fd0 /floppy msdos user,noauto 0 0

    ```

    The columns are: device file to mount, directory to mount on, filesystem type,
    options, backup frequency (used by `dump`), and `fsck` pass number (to specify
    the order in which filesystems should be checked upon boot; 0 means no check).
    The `noauto` option stops this mount from being done automatically when the system
    is started (i.e., it stops `mount -a` from mounting it). The `user` option allows
    any user to mount the filesystem, and, because of security reasons, disallows
    execution of programs (normal or setuid) and interpretation of device files from
    the mounted filesystem. After this, any user can mount a floppy with an `msdos`
    filesystem with the following command:

    ```

    $ mount /floppy

    $

    ```

    The floppy can (and needs to, of course) be unmounted with the corresponding `umount`
    command. If you want to provide access to several types of floppies, you need
    to give several mount points. The settings can be different for each mount point.
    For example, to give access to both MS-DOS and ext2 floppies, you could have the
    following two lines in `/etc/fstab`:

    ```

    /dev/fd0 /dosfloppy msdos user,noauto 0 0

    /dev/fd0 /ext2floppy ext2 user,noauto 0 0

    ```

    For MS-DOS filesystems (not just floppies), you probably want to restrict access
    to it by using the `uid`, `gid`, and `umask` filesystem options, described in
    detail on the `mount` manual page. If you aren''t careful, mounting an MS-DOS
    filesystem gives everyone at least read access to the files in it, which is not
    a good idea.


    ## 4.8.6 Checking filesystem integrity with fsck

    Filesystems are complex creatures, and as such, they tend to be somewhat error-prone.
    A filesystem''s correctness and validity can be checked using the `fsck` command.
    It can be instructed to repair any minor problems it finds, and to alert the user
    if there are any unrepairable problems. Fortunately, the code to implement filesystems
    is debugged quite effectively, so there are seldom any problems at all, and they
    are usually caused by power failures, failing hardware, or operator errors; for
    example, by not shutting down the system properly. Most systems are set up to
    run `fsck` automatically at boot time, so that any errors are detected (and hopefully
    corrected) before the system is used.


    Use of a corrupted filesystem tends to make things worse: if the data structures
    are messed up, using the filesystem will probably mess them up even more, resulting
    in more data loss. However, `fsck` can take a while to run on big filesystems,
    and since errors almost never occur if the system has been shut down properly,
    a couple of tricks are used to avoid doing the checks in such cases. The first
    is that if the file `/etc/fastboot` exists, no checks are made. The second is
    that the ext2 filesystem has a special marker in its superblock that tells whether
    the filesystem was unmounted properly after the previous mount. This allows `e2fsck`
    (the version of `fsck` for the ext2 filesystem) to avoid checking the filesystem
    if the flag indicates that the unmount was done (the assumption being that a proper
    unmount indicates no problems). Whether the `/etc/fastboot` trick works on your
    system depends on your startup scripts, but the ext2 trick works every time you
    use `e2fsck`—it has to be explicitly bypassed with an option to `e2fsck` to be
    avoided. (See the `e2fsck` man page for details on how.)


    The automatic checking only works for the filesystems that are mounted automatically
    at boot time. Use `fsck` manually to check other filesystems, e.g., floppies.
    If `fsck` finds unrepairable problems, you need either in-depth knowledge of how
    filesystems work in general, and the type of the corrupt filesystem in particular,
    or good backups. The latter is easy (although sometimes tedious) to arrange, the
    former can sometimes be arranged via a friend, the Linux newsgroups and mailing
    lists, or some other source of support, if you don''t have the know-how yourself.
    I''d like to tell you more about it, but my lack of education and experience in
    this regard hinders me. The `debugfs` program by Theodore T''so should be useful.
    `fsck` must only be run on unmounted filesystems, never on mounted filesystems
    (with the exception of the read-only root during startup). This is because it
    accesses the raw disk, and can therefore modify the filesystem without the operating
    system realizing it. There *will* be trouble, if the operating system is confused.


    ## 4.8.7 Checking for disk errors with badblocks

    It can be a good idea to periodically check for bad blocks. This is done with
    the `badblocks` command. It outputs a list of the numbers of all bad blocks it
    can find. This list can be fed to `fsck` to be recorded in the filesystem data
    structures so that the operating system won''t try to use the bad blocks for storing
    data. The following example will show how this could be done.

    ```

    $ badblocks /dev/fd0H1440 1440 > bad-blocks

    $ fsck -t ext2 -l bad-blocks /dev/fd0H1440

    Parallelizing fsck version 0.5a (5-Apr-94)

    e2fsck 0.5a, 5-Apr-94 for EXT2 FS 0.5, 94/03/10

    Pass 1: Checking inodes, blocks, and sizes

    Pass 2: Checking directory structure

    Pass 3: Checking directory connectivity

    Pass 4: Check reference counts.

    Pass 5: Checking group summary information.

    /dev/fd0H1440: ***** FILE SYSTEM WAS MODIFIED *****

    /dev/fd0H1440: 11/360 files, 63/1440 blocks

    $

    ```

    If badblocks reports a block that was already used, `e2fsck` will try to move
    the block to another place. If the block was really bad, not just marginal, the
    contents of the file may be corrupted.


    ## 4.8.8 Fighting fragmentation

    When a file is written to disk, it can''t always be written in consecutive blocks.
    A file that is not stored in consecutive blocks is **fragmented**. It takes longer
    to read a fragmented file, since the disk''s read-write head will have to move
    more. It is desirable to avoid fragmentation, although it is less of a problem
    in a system with a good buffer cache with read-ahead.


    The ext2 filesystem attempts to keep fragmentation at a minimum, by keeping all
    blocks in a file close together, even if they can''t be stored in consecutive
    sectors. Ext2 effectively always allocates the free block that is nearest to other
    blocks in a file. For ext2, it is therefore seldom necessary to worry about fragmentation.
    There is a program for defragmenting an ext2 filesystem, see [TV] in the bibliography.


    There are many MS-DOS defragmentation programs that move blocks around in the
    filesystem to remove fragmentation. For other filesystems, defragmentation must
    be done by backing up the filesystem, re-creating it, and restoring the files
    from backups. Backing up a filesystem before defragmenting is a good idea for
    all filesystems, since many things can go wrong during the defragmentation.


    ## 4.8.9 Other tools for all filesystems

    Some other tools are also useful for managing filesystems. `df` shows the free
    disk space on one or more filesystems; `du` shows how much disk space a directory
    and all its files contain. These can be used to hunt down disk space wasters.
    `sync` forces all unwritten blocks in the buffer cache (see section 5.6) to be
    written to disk. It is seldom necessary to do this by hand; the daemon process
    `update` does this automatically. It can be useful in catastrophes, for example
    if `update` or its helper process `bdflush` dies, or if you must turn off power
    `now` and can''t wait for `update` to run.


    ## 4.8.10 Other tools for the ext2 filesystem

    In addition to the filesystem creator (`mke2fs`) and checker (`e2fsck`) accessible
    directly or via the filesystem type independent front ends, the ext2 filesystem
    has some additional tools that can be useful. `tune2fs` adjusts filesystem parameters.
    Some of the more interesting parameters are:

    - A maximal mount count. `e2fsck` enforces a check when filesystem has been mounted
    too many times, even if the clean flag is set. For a system that is used for developing
    or testing the system, it might be a good idea to reduce this limit.

    - A maximal time between checks. `e2fsck` can also enforce a maximal time between
    two checks, even if the clean flag is set, and the filesystem hasn''t been mounted
    very often. This can be disabled, however.

    - Number of blocks reserved for `root`. Ext2 reserves some blocks for `root` so
    that if the filesystem fills up, it is still possible to do system administration
    without having to delete anything. The reserved amount is by default 5%, which
    on most disks isn''t enough to be wasteful. However, for floppies there is no
    point in reserving any blocks.'
