    You should also know that Linux allows one to use several swap partitions and/or
    swap files at the same time. This means that if you only occasionally need an
    unusual amount of swap space, you can set up an extra swap file at such times,
    instead of keeping the whole amount allocated all the time.


    A note on operating system terminology: computer science usually distinguishes
    between swapping (writing the whole process out to swap space) and paging (writing
    only fixed size parts, usually a few kilobytes, at a time). Paging is usually
    more efficient, and that''s what Linux does, but traditional Linux terminology
    talks about swapping anyway.¹


    # 5.2 Creating a swap space


    A swap file is an ordinary file; it is in no way special to the kernel. The only
    thing that matters to the kernel is that it has no holes, and that it is prepared
    for use with `mkswap`. It must reside on a local disk, however; it can''t reside
    in a filesystem that has been mounted over NFS due to implementation reasons.


    The bit about holes is important. The swap file reserves the disk space so that
    the kernel can quickly swap out a page without having to go through all the things
    that are necessary when allocating a disk sector to a file. The kernel merely
    uses any sectors that have already been allocated to the file. Because a hole
    in a file means that there are no disk sectors allocated (for that place in the
    file), it is not good for the kernel to try to use them.


    One good way to create the swap file without holes is through the following command:


    ```

    $ dd if=/dev/zero of=/extra-swap bs=1024 count=1024

    1024+0 records in

    1024+0 records out

    $

    ```


