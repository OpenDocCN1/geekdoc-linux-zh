    dumpe2fs shows information about an ext2 filesystem, mostly from the superblock.
    Figure 4.5 shows a sample output. Some of the information in the output is technical
    and requires understanding of how the filesystem works (see appendix ??), but
    much of it is readily understandable even for layadmins.


    debugfs is a filesystem debugger. It allows direct access to the filesystem data
    structures stored on disk and can thus be used to repair a disk that is so broken
    that fsck can''t fix it automatically. It has also been known to be used to recover
    deleted files. However, debugfs very much requires that you understand what you''re
    doing; a failure to understand can destroy all your data.


    dump and restore can be used to back up an ext2 filesystem. They are ext2 specific
    versions of the traditional UNIX backup tools. See chapter 10 for more information
    on backups.


    ## 4.9 Disks without filesystems


    Not all disks or partitions are used as filesystems. A swap partition, for example,
    will not have a filesystem on it. Many floppies are used in a tape-drive emulating
    fashion, so that a tar or other file is written directly on the raw disk, without
    a filesystem. Linux boot floppies don''t contain a filesystem, only the raw kernel.


    Avoiding a filesystem has the advantage of making more of the disk usable, since
    a filesystem always has some bookkeeping overhead. It also makes the disks more
    easily compatible with other systems: for example, the tar file format is the
    same on all systems, while filesystems are different on most systems. You will
    quickly get used to disks without filesystems if you need them. Bootable Linux
    floppies also do not necessarily have a filesystem, although that is also possible.


    One reason to use raw disks is to make image copies of them. For instance, if
    the disk contains a partially damaged filesystem, it is a good idea to make an
    exact copy of it before trying to fix it, since then you can start again if your
    fixing breaks things even more. One way to do this is to use dd:


    ```

    $ dd if=/dev/fd0H1440 of=floppy-image

    2880+0 records in

    2880+0 records out

    $ dd if=floppy-image of=/dev/fd0H1440

    2880+0 records in

    2880+0 records out

    $

    ```


    The first dd makes an exact image of the floppy to the file floppy-image, the
    second one writes the image to the floppy. (The user has presumably switched the
    floppy before the second command. Otherwise the command pair is of doubtful usefulness.)


    ## 4.10 Allocating disk space


    ### 4.10.1 Partitioning schemes


    It is not easy to partition a disk in the best possible way. Worse, there is no
    universally correct way to do it; there are too many factors involved.


    The traditional way is to have a (relatively) small root filesystem, which contains
    `/bin`, `/etc`, `/dev`, `/lib`, `/tmp`, and other stuff that is needed to get
    the system up and running. This way, the root filesystem (in its own partition
    or on its own disk) is all that is needed to bring up the system. The reasoning
    is that if the root filesystem is small and is not heavily used, it is less likely
    to become corrupt when the system crashes, and you will therefore find it easier
    to fix any problems caused by the crash. Then you create separate partitions or
    use separate disks for the directory tree below `/usr`, the users'' home directories
    (often under `/home`), and the swap space. Separating the home directories (with
    the users'' files) in their own partition makes backups easier, since it is usually
    not necessary to backup programs (which reside below `/usr`). In a networked environment
    it is also possible to share `/usr` among several machines (e.g., by using NFS),
    thereby reducing the total disk space required by several tens or hundreds of
    megabytes times the number of machines.


    The problem with having many partitions is that it splits the total amount of
    free disk space into many small pieces. Nowadays, when disks and (hopefully) operating
    systems are more reliable, many people prefer to have just one partition that
    holds all their files. On the other hand, it can be less painful to back up (and
    restore) a small partition.


    For a small hard disk (assuming you don''t do kernel development), the best way
    to go is probably to have just one partition. For large hard disks, it is probably
    better to have a few large partitions, just in case something does go wrong. (Note
    that ''small'' and ''large'' are used in a relative sense here; your needs for
    disk space decide what the threshold is.)


    If you have several disks, you might wish to have the root filesystem (including
    `/usr`) on one, and the users'' home directories on another.


    It is a good idea to be prepared to experiment a bit with different partitioning
    schemes (over time, not just while first installing the system). This is a bit
    of work, since it essentially requires you to install the system from scratch
    several times, but it is the only way to be sure you do it right.


    ### 4.10.2 Space requirements


    The Linux distribution you install will give some indication of how much disk
    space you need for various configurations. Programs installed separately may also
    do the same. This will help you plan your disk space usage, but you should prepare
    for the future and reserve some extra space for things you will notice later that
    you need.


    The amount you need for user files depends on what your users wish to do. Most
    people seem to need as much space for their files as possible, but the amount
    they will live happily with varies a lot. Some people do only light text processing
    and will survive nicely with a few megabytes, others do heavy image processing
    and will need gigabytes.


    By the way, when comparing file sizes given in kilobytes or megabytes and disk
    space given in megabytes, it can be important to know that the two units can be
    different. Some disk manufacturers like to pretend that a kilobyte is 1000 bytes
    and a megabyte is 1000 kilobytes, while all the rest of the computing world uses
    1024 for both factors. Therefore, my 345 MB hard disk is really a 330 MB hard
    disk.$^{10}$


    Swap space allocation is discussed in section 5.5.


    ### 4.10.3 Examples of hard disk allocation


    I used to have a 109 MB hard disk. Now I am using a 330 MB hard disk. I''ll explain
    how and why I partitioned these disks.


    The 109 MB disk I partitioned in a lot of ways, when my needs and the operating
    systems I used changed; I''ll explain two typical scenarios. First, I used to
    run MS-DOS together with Linux. For that, I needed about 20 MB of hard disk, or
    just enough to have MS-DOS, a C compiler, an editor, a few other utilities, the
    program I was working on, and enough free disk space to not feel claustrophobic.
    For Linux, I had a 10 MB swap partition, and the rest, or 79 MB, was a single
    partition with all the files I had under Linux. I experimented with having separate
    root, /usr, and /home partitions, but there was never enough free disk space in
    one piece to do much interesting.


    When I didn''t need MS-DOS anymore, I repartitioned the disk so that I had a 12
    MB swap partition, and again had the rest as a single filesystem.


    The 330 MB disk is partitioned into several partitions, like this:


