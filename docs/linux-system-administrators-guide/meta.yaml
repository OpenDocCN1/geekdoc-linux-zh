    to read everything. However, this manual is first and foremost a tutorial, and
    a reference manual only as a lucky coincidence. This manual is not intended to
    be used completely by itself. Plenty of the rest of the Linux documentation is
    also important for system administrators. After all, a system administrator is
    just a user with special privileges and duties. A very important resource are
    the manual pages, which should always be consulted when a command is not familiar.
    While this manual is targeted at Linux, a general principle has been that it should
    be useful with other UNIX based operating systems as well. Unfortunately, since
    there is so much variance between different versions of UNIX in general, and in
    system administration in particular, there is little hope to cover all variants.
    Even covering all possibilities for Linux is difficult, due to the nature of its
    development. There is no one official Linux distribution, so different people
    have different setups, and many people have a setup they have built up themselves.
    This book is not targeted at any one distribution, even though I use the Debian
    GNU/Linux system almost exclusively. When possible, I have tried to point out
    differences, and explain several alternatives. I have tried to describe how things
    work, rather than just listing "five easy steps" for each task. This means that
    there is much information here that is not necessary for everyone, but those parts
    are marked as such and can be skipped if you use a pre-configured system. Reading
    everything will, naturally, increase your understanding of the system and should
    make using and administering it more pleasant.


    Like all other Linux related development, the work was done on a volunteer basis:
    I did it because I thought it might be fun and because I felt it should be done.
    However, like all volunteer work, there is a limit to how much effort I have been
    able to spend, and also on how much knowledge and experience I have. This means
    that the manual is not necessarily as good as it would be if a wizard had been
    paid handsomely to write it and had spent a few years to perfect it. I think,
    of course, that it is pretty nice, but be warned. One particular point where I
    have cut corners is that I have not covered very thoroughly many things that are
    already well documented in other freely available manuals. This applies especially
    to program specific documentation, such as all the details of using `mkfs`. I
    only describe the purpose of the program, and as much of its usage as is necessary
    for the purposes of this manual. For further information, I refer the gentle reader
    to these other manuals. Usually, all of the referred to documentation is part
    of the full Linux documentation set.


