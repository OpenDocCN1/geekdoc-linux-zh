- md: '# Linux System Administrators'' Guide 0.6

    Lars Wirzenius

    ![](img/ceaf8a70f91e44dcbad3d66530d36479_1_0.png)

    The Linux Documentation Project


    This is version 0.6 of the Linux System Administrators'' Guide. Published November
    15, 1997. The LaTeX source code and other machine readable formats can be found
    on the Internet via anonymous ftp on sunsite.unc.edu, in the directory /pub/Linux/docs/LDP.
    Also available are at least Postscript and TeX .DVI formats. The official home
    page for the book is http://www.iki.fi/liw/linux/sag/. The current version can
    always be found at that location.


