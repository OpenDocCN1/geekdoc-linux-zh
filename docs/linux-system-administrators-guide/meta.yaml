  md: '# Chapter 5


    # Memory Management


    > Minnet, jag har tappat mitt minne,

    är jag svensk eller finne

    kommer inte ihåg...

    (Bosse Österberg)


    This section describes the Linux memory management features, i.e., virtual memory
    and the disk buffer cache. The purpose and workings and the things the system
    administrator needs to take into consideration are described.


    # 5.1 What is virtual memory?


    Linux supports **virtual memory**, that is, using a disk as an extension of RAM
    so that the effective size of usable memory grows correspondingly. The kernel
    will write the contents of a currently unused block of memory to the hard disk
    so that the memory can be used for another purpose. When the original contents
    are needed again, they are read back into memory. This is all made completely
    transparent to the user; programs running under Linux only see the larger amount
    of memory available and don’t notice that parts of them reside on the disk from
    time to time. Of course, reading and writing the hard disk is slower (on the order
    of a thousand times slower) than using real memory, so the programs don’t run
    as fast. The part of the hard disk that is used as virtual memory is called the
    **swap space**.


    Linux can use either a normal file in the filesystem or a separate partition for
    swap space. A swap partition is faster, but it is easier to change the size of
    a swap file'
  merge: -1
