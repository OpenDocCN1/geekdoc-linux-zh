  md: '# 4.10 Allocating disk space


    # 4.10.1 Partitioning schemes


    It is not easy to partition a disk in the best possible way. Worse, there is no
    universally correct way to do it; there are too many factors involved.


    The traditional way is to have a (relatively) small root filesystem, which contains
    `/bin`, `/etc`, `/dev`, `/lib`, `/tmp`, and other stuff that is needed to get
    the system up and running. This way, the root filesystem (in its own partition
    or on its own disk) is all that is needed to bring up the system. The reasoning
    is that if the root filesystem is small and is not heavily used, it is less likely
    to become corrupt when the system crashes, and you will therefore find it easier
    to fix any problems caused by the crash. Then you create separate partitions or
    use separate disks for the directory tree below `/usr`, the users'' home directories
    (often under `/home`), and the swap space. Separating the home directories (with
    the users'' files) in their own partition makes backups easier, since it is usually
    not necessary to backup programs (which reside below `/usr`). In a networked environment
    it is also possible to share `/usr` among several machines (e.g., by using NFS),
    thereby reducing the total disk space required by several tens or hundreds of
    megabytes times the number of machines.


    The problem with having many partitions is that it splits the total amount of
    free disk space into many small pieces. Nowadays, when disks and (hopefully) operating
    systems are more reliable, many people prefer to have just one partition that
    holds all their files. On the other hand, it can be less painful to back up (and
    restore) a small partition.


    For a small hard disk (assuming you don''t do kernel development), the best way
    to go is probably to have just one partition. For large hard disks, it is probably
    better to have a few large partitions, just in case something does go wrong. (Note
    that ''small'' and ''large'' are used in a relative sense here; your needs for
    disk space decide what the threshold is.)


    If you have several disks, you might wish to have the root filesystem (including
    `/usr`) on one, and the users'' home directories on another.


    It is a good idea to be prepared to experiment a bit with different partitioning
    schemes (over time, not just while first installing the system). This is a bit
    of work, since it essentially requires you to install the system from scratch
    several times, but it is the only way to be sure you do it right.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# ## 4.10.2 Space requirements


    The Linux distribution you install will give some indication of how much disk
    space you need for various configurations. Programs installed separately may also
    do the same. This will help you plan your disk space usage, but you should prepare
    for the future and reserve some extra space for things you will notice later that
    you need.


    The amount you need for user files depends on what your users wish to do. Most
    people seem to need as much space for their files as possible, but the amount
    they will live happily with varies a lot. Some people do only light text processing
    and will survive nicely with a few megabytes, others do heavy image processing
    and will need gigabytes.


    By the way, when comparing file sizes given in kilobytes or megabytes and disk
    space given in megabytes, it can be important to know that the two units can be
    different. Some disk manufacturers like to pretend that a kilobyte is 1000 bytes
    and a megabyte is 1000 kilobytes, while all the rest of the computing world uses
    1024 for both factors. Therefore, my 345 MB hard disk is really a 330 MB hard
    disk.$^{10}$


    Swap space allocation is discusses in section 5.5.


