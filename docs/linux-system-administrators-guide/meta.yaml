- md: 'dump also directly supports backup levels (which we''ll be discussing below);
    with tar and cpio this has to be implemented with other tools. A comparison of
    the third party backup tools is beyond the scope of this book. The Linux Software
    Map lists many of the freeware ones.


    ## 10.4 Simple backups

    A simple backup scheme is to back up everything once, then back up everything
    that has been modified since the previous backup. The first backup is called a
    **full backup**, the subsequent ones are **incremental backups**. A full backup
    is often more laborious than incremental ones, since there is more data to write
    to the tape and a full backup might not fit onto one tape (or floppy). Restoring
    from incremental backups can be many times more work than from a full one. Restoration
    can be optimized so that you always back up everything since the previous full
    backup; this way, backups are a bit more work, but there should never be a need
    to restore more than a full backup and an incremental backup. If you want to make
    backups every day and have six tapes, you could use tape 1 for the first full
    backup (say, on a Friday), and tapes 2 to 5 for the incremental backups (Monday
    through Thursday). Then you make a new full backup on tape 6 (second Friday),
    and start doing incremental ones with tapes 2–5 again. You don''t want to overwrite
    tape 1 until you''ve got a new full backup, lest something happens while you''re
    making the full backup. After you''ve made a full backup to tape 6, you want to
    keep tape 1 somewhere else, so that when your other backup tapes are destroyed
    in the fire, you still have at least something left. When you need to make the
    next full backup, you fetch tape 1 and leave tape 6 in its place. If you have
    more than six tapes, you can use the extra ones for full backups. Each time you
    make a full backup, you use the oldest tape. This way you can have full backups
    from several previous weeks, which is good if you want to find an old, now deleted
    file, or an old version of a file.


    ### 10.4.1 Making backups with tar

    A full backup can easily be made with tar:

    ``` shell

    # tar -create -file /dev/ftape /usr/src

    tar: Removing leading / from absolute path names in the archive

    ```

    The example above uses the GNU version of `tar` and its long option names. The
    traditional version of `tar` only understands single character options. The GNU
    version can also handle backups that don''t fit on one tape or floppy, and also
    very long paths; not all traditional versions can do these things. (Linux only
    uses GNU `tar`.) If your backup doesn''t fit on one tape, you need to use the
    `-multi-volume` (`-M`) option:

    ``` shell

    # tar -cMf /dev/fd0H1440 /usr/src

    tar: Removing leading / from absolute path names in the archive

    Prepare volume #2 for /dev/fd0H1440 and hit return:

    #

    ```

    Note that you should format the floppies before you begin the backup, or else
    use another window or virtual terminal and do it when `tar` asks for a new floppy.
    After you''ve made a backup, you should check that it is OK, using the `-compare`
    (`-d`) option:

    ``` shell

    # tar -compare -verbose -f /dev/ftape usr/src/

    usr/src/linux

    usr/src/linux-1.2.10-includes/

    ....

    #

    ```

    Failing to check a backup means that you will not notice that your backups aren''t
    working until after you''ve lost the original data. An incremental backup can
    be done with `tar` using the `-newer` (`-N`) option:

    ``` shell

    # tar -create -newer ''8 Sep 1995'' -file /dev/ftape /usr/src -verbose

    tar: Removing leading / from absolute path names in the archive

    usr/src/

    usr/src/linux-1.2.10-includes/

    usr/src/linux-1.2.10-includes/include/

    usr/src/linux-1.2.10-includes/include/linux/

    usr/src/linux-1.2.10-includes/include/linux/modules/

    usr/src/linux-1.2.10-includes/include/asm-generic/

    usr/src/linux-1.2.10-includes/include/asm-i386/

    usr/src/linux-1.2.10-includes/include/asm-mips/

    usr/src/linux-1.2.10-includes/include/asm-alpha/

    usr/src/linux-1.2.10-includes/include/asm-m68k/

    usr/src/linux-1.2.10-includes/include/asm-sparc/

    usr/src/patch-1.2.11.gz

    #

    ```

    Unfortunately, `tar` can''t notice when a file''s inode information has changed,
    for example, that its permission bits have been changed, or when its name has
    been changed. This can be worked around using `find` and comparing current filesystem
    state with lists of files that have been previously backed up. Scripts and programs
    for doing this can be found on Linux ftp sites.


    ### 10.4.2 Restoring files with tar

    The **-extract (-x)** option for `tar` extracts files:

    ``` shell

    # tar -extract -same-permissions -verbose -file /dev/fd0H1440

    usr/src/

    usr/src/linux

    usr/src/linux-1.2.10-includes/

    usr/src/linux-1.2.10-includes/include/

    usr/src/linux-1.2.10-includes/include/linux/

    usr/src/linux-1.2.10-includes/include/linux/hdreg.h

    usr/src/linux-1.2.10-includes/include/linux/kernel.h

    ...

    #

    ```

    You can also extract only specific files or directories (which includes all their
    files and subdirectories) by naming them on the command line:

    ``` shell

    # tar xpvf /dev/fd0H1440 usr/src/linux-1.2.10-includes/include/linux/hdreg.h

    usr/src/linux-1.2.10-includes/include/linux/hdreg.h

    #

    ```

    Use the **-list (-t)** option if you just want to see what files are on a backup
    volume:

    ``` shell

    # tar -list -file /dev/fd0H1440

    usr/src/

    usr/src/linux

    usr/src/linux-1.2.10-includes/

    usr/src/linux-1.2.10-includes/include/

    usr/src/linux-1.2.10-includes/include/linux/

    usr/src/linux-1.2.10-includes/include/linux/hdreg.h

    usr/src/linux-1.2.10-includes/include/linux/kernel.h

    ...

    #

    ```

    Note that `tar` always reads the backup volume sequentially, so for large volumes
    it is rather slow. It is not possible, however, to use random access database
    techniques when using a tape drive or some other sequential medium. `tar` doesn''t
    handle deleted files properly. If you need to restore a filesystem from a full
    and an incremental backup, and you have deleted a file between the two backups,
    it will exist again after you have done the restore. This can be a big problem
    if the file has sensitive data that should no longer be available.


    ## 10.5 Multilevel backups

    The simple backup method outlined in the previous section is often quite adequate
    for personal use or small sites. For more heavy duty use, multilevel backups are
    more appropriate. The simple method has two backup levels: full and incremental
    backups. This can be generalized to any number of levels. A full backup would
    be level 0, and the different levels of incremental backups levels 1, 2, 3, ...
    At each incremental backup level you back up everything that has changed since
    the previous backup at the same or a previous level. The purpose for doing this
    is that it allows a longer **backup history** cheaply. In the example in the previous
    section, the backup history went back to the previous full backup. This could
    be extended by having more tapes, but only a week per new tape, which might be
    too expensive. A longer backup history is useful, since deleted or corrupted files
    are often not noticed for a long time. Even a version of a file that is not very
    up to date is better than no file at all. With multiple levels the backup history
    can be extended more cheaply. For example, if we buy ten tapes, we could use tapes
    1 and 2 for monthly backups (first Friday each month), tapes 3 to 6 for weekly
    backups (other Fridays; note that there can be five Fridays in one month, so we
    need four more tapes), and tapes 7 to 10 for daily backups (Monday to Thursday).
    With only four more tapes, we''ve been able to extend the backup history from
    two weeks (after all daily tapes have been used) to two months. It is true that
    we can''t restore every version of each file during those two months, but what
    we can restore is often good enough.


    ![](img/ceaf8a70f91e44dcbad3d66530d36479_107_0.png)

    Figure 10.1: A sample multilevel backup schedule.


    Backup levels can also be used to keep filesystem restoration time to a minimum.
    If you have many incremental backups with monotonously growing level numbers,
    you need to restore all of them if you need to rebuild the whole filesystem. Instead
    you can use level numbers that aren''t monotonous, and keep down the number of
    backups to restore. To minimize the number of tapes needed to restore, you could
    use a smaller level for each incremental tape. However, then the time to make
    the backups increases (each backup copies everything since the previous full backup).
    A better scheme is suggested by the `dump` manual page and described by table
    10.2. Use the following succession of backups: 3, 2, 5, 4, 7, 6, 9, 8, 9... This
    keeps both the backup and restore times low. The most you have to backup is two
    day''s worth of work. The number of tapes for a restore depends on how long you
    keep between full backups, but it is less than the simple schemes. A fancy scheme
    can reduce the amount of labor needed, but it does mean there are more things
    to keep track of. You must decide if it is worth it. `dump` has built-in support
    for backup levels. For `tar` and `cpio` it must be implemented with shell scripts.'
