  mdcn: "\n## 11.4 时钟不准时\nLinux软件时钟并非一直准确。它由PC硬件产生的周期性**定时器中断**驱动运行。如果系统运行进程过多，处理定时器中断耗时过长，软件时钟就会开始走慢。硬件时钟独立运行，通常更加精准。如果你经常重启电脑（多数非服务器系统都是如此），它通常能保持相当准确的时间。\n\
    如果需要调整硬件时钟，最简单的方式通常是重启电脑，进入BIOS设置界面进行操作。这样可以避免更改系统时间可能引发的各类问题。如果无法通过BIOS调整，就按顺序使用`date`和`clock`命令设置新时间，但如果系统某些部分出现异常，请做好重启的准备。\n\
    联网的电脑（哪怕只是通过调制解调器联网）可以通过与其他电脑的时间对比，自动校准自身时钟。如果已知另一台电脑的时间非常精准，那么两台电脑都能保持准确的时间。可以使用rdate和netdate命令实现这一功能。这两个命令都会检查远程电脑的时间，并将本地电脑的时间设置为与之相同（netdate支持同时检查多台远程电脑的时间）。定期运行其中任意一个命令，你的电脑就能和远程电脑保持同样精准的时间。\n\
    **元说明：** 补充关于NTP的有价值的技术说明\n\n## 附录A\n### 测量空洞\n本附录包含用于测量文件系统中空洞分布的程序的核心部分。本书的源码发行版包含完整源代码（路径为sag/measure-holes/measure-holes.c）。\n\
    ```c\nint process(FILE *f, char *filename) {\n    static char *buf = NULL;\n \
