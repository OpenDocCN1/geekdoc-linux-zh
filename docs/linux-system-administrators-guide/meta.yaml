    # 排版约定

    - **粗体**：用于标注新概念、**警告**以及语言中的关键词。

    - *斜体*：用于正文中的*强调*，偶尔也用于章节开头的引言或引语。


    ### **斜体**

    用于标注正文中的**元变量**，尤其是在命令行表示中。例如：

    ``` ls -l foo ```

    其中**foo**代表一个文件名，例如`/bin/cp`。


    ### **等宽字体**

    用于表示屏幕交互内容，示例如下：

    ``` $ ls -l /bin/cp

    -rwxr-xr-x 1 root wheel 12104 Sep 25 15:53 /bin/cp ```

    也用于代码示例，无论是C代码、shell脚本还是其他内容，以及配置文件等通用文件的展示。为便于理解，必要时这些示例或图示会被置于细线边框内。


    ### **按键**

    代表需要按下的按键。你通常会看到这样的表述：按下Return键继续。


    # Linux文档项目

    Linux文档项目（简称LDP）是一个松散的写作者、校对者和编辑团队，共同为Linux操作系统提供完整的文档。该项目的总体协调人是格雷格·汉金斯（Greg
    Hankins）。本手册是LDP发行的系列手册之一，该系列还包括《Linux用户指南》《系统管理员指南》《网络管理员指南》和《内核黑客指南》。这些手册均提供LaTeX源码格式、.dvi格式和PostScript输出格式，可通过匿名FTP从`sunsite.unc.edu`的`/pub/Linux/docs/LDP`目录获取。我们欢迎所有喜爱写作或编辑的人加入我们，共同完善Linux文档。如果你有互联网电子邮件接入，可以通过`gregh@sunsite.unc.edu`联系格雷格·汉金斯。


    # LDP韵文⁴

    > 著书立说，何等美妙神奇，

    > 我想歌唱，为此付出的汗水、血泪与艰辛。

    > 一切始于1992年，那时用户哀怨：“我们什么都做不了！”

    > 他们想知道问题出在哪里，又该如何解决（而且要昨天就搞定）。

    > 我们把答案写进Linux常见问题解答，盼着再也不用费劲写作。

    > “这太长了，难搜索，我们反正不会看！”

    > 于是我们几人（当然是通过线上）聚到一起，

    > 创立了LDP。

    > 我们开始撰写——至少是规划——多本图书，满足各类需求。

    > 起初充满乐趣，大家畅所欲言，定下大纲，然后一堆计划出炉。

    > 接着喧嚣散去，工作正式开始，有人写得少，有人写得多。

    > 面对空白屏幕，哦太可怕了，它就坐在那里，对着你嗤笑。

