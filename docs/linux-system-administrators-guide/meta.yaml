    # Typographical conventions

    - **Bold**: Used to mark new concepts, WARNINGS, and keywords in a language.

    - *italics*: Used for *emphasis* in text, and occasionally for quotes or introductions
    at the beginning of a section.


    ### **slanted**

    Used to mark **meta-variables** in the text, especially in representations of
    the command line. For example, ``` ls -l foo ``` where **foo** would "stand for"
    a filename, such as `/bin/cp`.


    ### **Typewriter**

    Used to represent screen interaction, as in ``` $ ls -l /bin/cp -rwxr-xr-x 1 root
    wheel 12104 Sep 25 15:53 /bin/cp ``` Also used for code examples, whether it is
    C code, a shell script, or something else, and to display general files, such
    as configuration files. When necessary for clarity''s sake, these examples or
    figures will be enclosed in thin boxes.


    ### **Key**

    Represents a key to press. You will often see it in this form: Press return to
    continue.


    # The Linux Documentation Project

    The Linux Documentation Project, or LDP, is a loose team of writers, proofreaders,
    and editors who are working together to provide complete documentation for the
    Linux operating system. The overall coordinator of the project is Greg Hankins.
    This manual is one in a set of several being distributed by the LDP, including
    a Linux Users'' Guide, System Administrators'' Guide, Network Administrators''
    Guide, and Kernel Hackers'' Guide. These manuals are all available in LaTeX source
    format, .dvi format, and postscript output by anonymous FTP from `sunsite.unc.edu`,
    in the directory `/pub/Linux/docs/LDP`. We encourage anyone with a penchant for
    writing or editing to join us in improving Linux documentation. If you have Internet
    e-mail access, you can contact Greg Hankins at `gregh@sunsite.unc.edu`.


    # The LDP Rhyme⁴

    > A wondrous thing, and beautiful, ''tis to write, a book.

    > I''d like to sing, of the sweat, the blood and tears, which it also took.

    > It started back in, nineteen-ninety-two, when users whined, "we can nothing
    do!"

    > They wanted to know, what their problem was, and how to fix it (by yesterday).

    > We put the answers in, a Linux FAQ, hoped to get away, from any more writin''.

    > "That''s too long, it''s hard to search, and we don''t read it, any-which-way!"

    > Then a few of us, joined together (virtually, you know),

