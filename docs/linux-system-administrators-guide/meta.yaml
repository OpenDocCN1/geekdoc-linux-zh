    # 10.5 Multilevel backups


    The simple backup method outlined in the previous section is often quite adequate
    for personal use or small sites. For more heavy duty use, multilevel backups are
    more appropriate.


    The simple method has two backup levels: full and incremental backups. This can
    be generalized to any number of levels. A full backup would be level 0, and the
    different levels of incremental backups levels 1, 2, 3, ... At each incremental
    backup level you back up everything that has changed since the previous backup
    at the same or a previous level.


    The purpose for doing this is that it allows a longer **backup history** cheaply.
    In the example in the previous section, the backup history went back to the previous
    full backup. This could be extended by having more tapes, but only a week per
    new tape, which might be too expensive. A longer backup history is useful, since
    deleted or corrupted files are often not noticed for a long time. Even a version
    of a file that is not very up to date is better than no file at all.


    With multiple levels the backup history can be extended more cheaply. For example,
    if we buy ten tapes, we could use tapes 1 and 2 for monthly backups (first Friday
    each month), tapes 3 to 6 for weekly backups (other Fridays; note that there'
