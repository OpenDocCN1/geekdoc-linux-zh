    installation disks to fix whatever problem you have. Sometimes those programs
    aren''t enough; for example, you might have to restore some files from backups
    made with software not on the installation disks.


    Thus, it might be necessary to create a custom root floppy as well. The *Bootdisk
    HOWTO* by Graham Chapman ([Cha]) contains instructions for doing this. You'
