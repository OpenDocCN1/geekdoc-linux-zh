    ## 4.7.5 设备文件与分区

    每个分区和扩展分区都有对应的设备文件。这些文件的命名规则是，将分区编号附加在整个磁盘名称的末尾，其中 1–4 为主分区（无论存在多少个主分区），5–8 为逻辑分区（无论它们位于哪个主分区内）。例如，`/dev/hda1`
    是第一块 IDE 硬盘的第一个主分区，`/dev/sdb7` 是第二块 SCSI 硬盘的第三个扩展分区。参考文献 [1] 中的设备列表提供了更多信息。

    ## 4.8 文件系统

    ### 4.8.1 什么是文件系统？

    **文件系统**是操作系统用来跟踪磁盘或分区上文件的方法和数据结构，也就是文件在磁盘上的组织方式。这个词也可以指用来存储文件的分区或磁盘，或是文件系统的类型。因此，人们说“我有两个文件系统”可能是指有两个用来存储文件的分区，也可能是指正在使用“扩展文件系统”，即文件系统的类型。磁盘或分区与其中包含的文件系统之间的区别非常重要。部分程序（包括自然包括创建文件系统的程序）会直接操作磁盘或分区的原始扇区；如果其中已有现有文件系统，它将被破坏或严重损坏。大多数程序都基于文件系统运行，因此无法在没有文件系统（或包含错误类型文件系统）的分区上工作。分区或磁盘在用作文件系统之前需要进行初始化，并将簿记数据结构写入磁盘。这个过程被称为**创建文件系统**。

    大多数 UNIX 文件系统类型都有相似的整体结构，尽管具体细节差异较大。核心概念包括**超级块**、**索引节点**、**数据块**、**目录块**和**间接块**。超级块包含整个文件系统的信息，例如文件系统大小（此处具体信息取决于文件系统类型）。索引节点包含文件的所有信息，唯独不包含文件名。文件名与对应的索引节点编号一同存储在目录中。一条目录项由文件名和代表该文件的索引节点编号组成。索引节点中包含多个数据块的编号，用于存储文件的数据。不过索引节点中只能存放少量数据块编号，如果需要更多编号，会动态分配更多用于指向数据块的空间。这些动态分配的块就是间接块；这个名字的含义是，要找到对应的数据块，需要先从间接块中查询其编号。UNIX
    文件系统通常允许在文件中创建**洞**（这一操作通过 `lseek` 实现，具体可查看手册页），这意味着文件系统会假装文件的特定位置存在零字节，但不会为该位置预留实际的磁盘扇区（也就是说该文件占用的磁盘空间会略少一些）。这种情况在小体积二进制文件、Linux
    共享库、部分数据库以及其他一些特殊场景中尤为常见。（洞的实现方式是在间接块或索引节点中存储一个特殊值作为数据块的地址，这个特殊地址意味着该部分文件没有分配数据块，因此文件中存在洞。）洞的实用性适中。在作者使用的系统上，一次简单测量显示，在使用总计约
    200 MB 的磁盘空间中，通过洞可以节省约 4 MB 的空间。不过该系统安装的程序较少，也没有数据库文件。测量工具的说明见附录 A。

    ### 4.8.2 多种文件系统

    Linux 支持多种类型的文件系统。截至本文撰写时，最重要的类型如下：

    - **minix**：最古老的文件系统，被认为最可靠，但功能非常有限（缺少部分时间戳，文件名最多 30 个字符），容量也受限（每个文件系统最大 64 MB）。

    - **xia**：minix 文件系统的修改版，取消了文件名和文件系统大小的限制，但没有引入其他新功能。它并不普及，但据报告运行非常稳定。

    - **ext2**：Linux 原生文件系统中功能最丰富的，也是目前最流行的文件系统。它被设计为易于向上兼容，因此新版本的文件系统代码无需重新创建现有文件系统。

    - **ext**：`ext2` 的旧版本，不具备向上兼容性。现在已经很少在新安装中使用，大多数用户都已迁移到 `ext2`。

    此外，系统还支持多种外来文件系统，以便与其他操作系统交换文件。这些外来文件系统的工作原理与原生文件系统相同，只是可能缺少部分常规 UNIX 功能，或存在一些奇怪的限制与其他异常。

    - **msdos**：兼容 MS-DOS（以及 OS/2 和 Windows NT）的 FAT 文件系统。

    - **umsdos**：扩展了 Linux 下的 `msdos` 文件系统驱动，支持长文件名、所有者、权限、链接和设备文件。这允许普通的 `msdos`
    文件系统像 Linux 文件系统一样使用，从而无需单独划分 Linux 分区。

    - **iso9660**：标准的 CD-ROM 文件系统；流行的 Rock Ridge CD-ROM 标准扩展（支持更长文件名）会被自动支持。

    - **nfs**：网络文件系统，支持在多个计算机间共享文件系统，方便所有计算机访问其中的文件。

    - **hpfs**：OS/2 的文件系统。

    - **sysv**：SystemV/386、Coherent 和 Xenix 的文件系统。

    文件系统的选择取决于具体场景。如果兼容性或其他原因要求使用非原生文件系统，那么就必须选用对应的类型。如果可以自由选择，那么使用 `ext2` 可能是最明智的，因为它具备所有功能，且不存在性能不足的问题。此外还有
    `proc` 文件系统，通常可以通过 `/proc` 目录访问，尽管它看起来像文件系统，但实际上并非真正的文件系统。`proc` 文件系统可以方便地访问某些内核数据结构，例如进程列表（这也是其名称的由来）。它让这些数据结构看起来像文件系统，且可以使用所有常规文件工具来操作该文件系统。例如，要列出所有进程，可以使用以下命令：

    ```

    $ ls -l /proc total 0 dr-xr-xr-x 4 root root 0 Jan 31 20:37 1 dr-xr-xr-x 4 liw
    users 0 Jan 31 20:37 63 dr-xr-xr-x 4 liw users 0 Jan 31 20:37 94 dr-xr-xr-x 4
    liw users 0 Jan 31 20:37 95 dr-xr-xr-x 4 root root 0 Jan 31 20:37 98 dr-xr-xr-x
    4 liw users 0 Jan 31 20:37 99 -r--r--r-- 1 root root 0 Jan 31 20:37 devices -r--r--r--
    1 root root 0 Jan 31 20:37 dma -r--r--r-- 1 root root 0 Jan 31 20:37 filesystems
    -r--r--r-- 1 root root 0 Jan 31 20:37 interrupts -r-------- 1 root root 8654848
    Jan 31 20:37 kcore -r--r--r-- 1 root root 0 Jan 31 11:50 kmsg -r--r--r-- 1 root
    root 0 Jan 31 20:37 ksysm -r--r--r-- 1 root root 0 Jan 31 11:51 loadavg -r--r--r--
    1 root root 0 Jan 31 20:37 meminfo -r--r--r-- 1 root root 0 Jan 31 20:37 modules
    dr-xr-xr-x 2 root root 0 Jan 31 20:37 net dr-xr-xr-x 4 liw users 0 Jan 31 20:37
    self -r--r--r-- 1 root root 0 Jan 31 20:37 stat -r--r--r-- 1 root root 0 Jan 31
    20:37 uptime -r--r--r-- 1 root root 0 Jan 31 20:37 version

    ```

    （不过会有一些额外的文件不对应任何进程，上述示例已经做了简化。）

    注意，尽管它被称为文件系统，但 *proc* 文件系统的任何部分都不会访问磁盘。它只存在于内核的“想象”中。每当有人尝试查看 *proc* 文件系统的任何部分时，内核都会让这部分看起来像是真实存在于某处，尽管实际上并不存在。因此，尽管存在数兆字节的
    */proc/kcore* 文件，它也不会占用任何磁盘空间。

    '
