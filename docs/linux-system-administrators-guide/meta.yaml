    # Chapter 2


    # Overview of a Linux System


    > God looked over everything he had made, and saw that it was very good.

    Genesis 1:31


    This chapter gives an overview of a Linux system. First, the major services provided
    by the operating system are described. Then, the programs that implement these
    services are described with a considerable lack of detail. The purpose of this
    chapter is to give an understanding of the system as a whole, so that each part
    is described in detail elsewhere.


    # 2.1 Various parts of an operating system


    A UNIX operating system consists of a **kernel** and some **system programs**.
    There are also some **application programs** for doing work. The kernel is the
    heart of the operating system$^1$. It keeps track of files on the disk, starts
    programs and runs them concurrently, assigns memory and other resources to various
    processes, receives packets from and sends packets to the network, and so on.
    The kernel does very little by itself, but it provides tools with which all services
    can be built. It also prevents anyone from accessing the hardware directly, forcing
    everyone to use the tools it provides. This way the kernel provides some protection
    for users from each other. The tools provided by the kernel are used via **system
    calls**; see manual page section 2 for more information on these.


    > $^1$In fact, it is often mistakenly considered to be the operating system itself,
    but it is not. An operating system provides many more services than a plain kernel.'
- md: 'The system programs use the tools provided by the kernel to implement the various
    services required from an operating system. System programs, and all other programs,
    run ''on top of the kernel'', in what is called the **user mode**. The difference
    between system and application programs is one of intent: applications are intended
    for getting useful things done (or for playing, if it happens to be a game), whereas
    system programs are needed to get the system working. A word processor is an application;
    **telnet** is a system program. The difference is often somewhat blurry, however,
    and is important only to compulsive categorizers. An operating system can also
    contain compilers and their corresponding libraries (GCC and the C library in
    particular under Linux), although not all programming languages need be part of
    the operating system. Documentation, and sometimes even games, can also be part
    of it. Traditionally, the operating system has been defined by the contents of
    the installation tape or disks; with Linux it is not as clear since it is spread
    all over the FTP sites of the world.


    ## 2.2 Important parts of the kernel


    The Linux kernel consists of several important parts: process management, memory
    management, hardware device drivers, filesystem drivers, network management, and
    various other bits and pieces. Figure 2.1 shows some of them. Probably the most
    important parts of the kernel (nothing else works without them) are memory management
    and process management. Memory management takes care of assigning memory areas
    and swap space areas to processes, parts of the kernel, and for the buffer cache.
    Process management creates processes, and implements multitasking by switching
    the active process on the processor. At the lowest level, the kernel contains
    a hardware device driver for each kind of hardware it supports. Since the world
    is full of different kinds of hardware, the number of hardware device drivers
    is large. There are often many otherwise similar pieces of hardware that differ
    in how they are controlled by software. The similarities make it possible to have
    general classes of drivers that support similar operations; each member of the
    class has the same interface to the rest of the kernel but differs in what it
    needs to do to implement them. For example, all disk drivers look alike to the
    rest of the kernel, i.e., they all have operations like ''initialize the drive'',
    ''read sector N'', and ''write sector N''. Some software services provided by
    the kernel itself have similar properties, and can therefore be abstracted into
    classes. For example, the various network protocols


    ![](img/ceaf8a70f91e44dcbad3d66530d36479_18_0.png)


    Figure 2.1: Some of the more important parts of the Linux kernel.


    have been abstracted into one programming interface, the BSD socket library. Another
    example is the **virtual filesystem** (VFS) layer that abstracts the filesystem
    operations away from their implementation. Each filesystem type provides an implementation
    of each filesystem operation. When some entity tries to use a filesystem, the
    request goes via the VFS, which routes the request to the proper filesystem driver.


    ## 2.3 Major services in a UNIX system


    This section describes some of the more important UNIX services, but without much
    detail. They are described more thoroughly in later chapters.


    ### 2.3.1 init


    The single most important service in a UNIX system is provided by **init**. **init**
    is started as the first process of every UNIX system, as the last thing the kernel
    does when it boots. When **init** starts, it continues the boot process by doing
    various startup chores (checking and mounting filesystems, starting daemons, etc.).
    The exact list of things that **init** does depends on which flavor it is; there
    are several to choose from. **init** usually provides the concept of **single
    user mode**, in which no one can log in and **root** uses a shell at the console;
    the usual mode is called **multiuser mode**. Some flavors generalize this as **run
    levels**; single and multiuser modes are considered to be two run levels, and
    there can be additional ones as well, for example, to run X on the console. In
    normal operation, **init** makes sure **gettys** are working (to allow users to
    log in), and to adopt orphan processes (processes whose parent has died; in UNIX
    *all* processes *must* be in a single tree, so orphans must be adopted). When
    the system is shut down, it is **init** that is in charge of killing all other
    processes, unmounting all filesystems and stopping the processor, along with anything
    else it has been configured to do.


    ### 2.3.2 Logins from terminals


    Logins from terminals (via serial lines) and the console (when not running X)
    are provided by the **getty** program. **init** starts a separate instance of
    **getty** for each terminal for which logins are to be allowed. **getty** reads
    the username and runs the **login** program, which reads the password. If the
    username and password are correct, **login** runs the shell. When the shell terminates,
    i.e., the user logs out, or when **login** terminated because the username and
    password didn''t match, **init** notices this and starts a new instance of **getty**.
    The kernel has no notion of logins, this is all handled by the system programs.


    ### 2.3.3 Syslog


    The kernel and many system programs produce error, warning, and other messages.
    It is often important that these messages can be viewed later, even much later,
    so they should be written to a file. The program doing this is **syslog**. It
    can be configured to sort the messages to different files according to writer
    or degree of importance. For example, kernel messages are often directed to a
    separate file from the others, since kernel messages are often more important
    and need to be read regularly to spot problems.


    ### 2.3.4 Periodic command execution: cron and at


    Both users and system administrators often need to run commands periodically.
    For example, the system administrator might want to run a command to clean the
    directories with temporary files (/tmp and /var/tmp) from old files, to keep the
    disks from filling up, since not all programs clean up after themselves correctly.
    The cron service is set up to do this. Each user has a crontab, where he lists
    the commands he wants to execute and the times they should be executed. The cron
    daemon takes care of starting the commands when specified. The at service is similar
    to cron, but it is once only: the command is executed at the given time, but it
    is not repeated.


    ### 2.3.5 Graphical user interface


    UNIX and Linux don''t incorporate the user interface into the kernel; instead,
    they let it be implemented by user level programs. This applies for both text
    mode and graphical environments. This arrangement makes the system more flexible,
    but has the disadvantage that it is simple to implement a different user interface
    for each program, making the system harder to learn. The graphical environment
    primarily used with Linux is called the X Window System (X for short). X also
    does not implement a user interface; it only implements a window system, i.e.,
    tools with which a graphical user interface can be implemented. The three most
    popular user interface styles implemented over X are Athena, Motif, and Open Look.


    ### 2.3.6 Networking


    Networking is the act of connecting two or more computers so that they can communicate
    with each other. The actual methods of connecting and communicating are slightly
    complicated, but the end result is very useful. UNIX operating systems have many
    networking features. Most basic services—filesystems, printing, backups, etc—can
    be done over the network. This can make system administration easier, since it
    allows centralized administration, while still reaping the benefits of microcomputing
    and distributed computing, such as lower costs and better fault tolerance. However,
    this book merely glances at networking; see the Linux Network Administrators''
    Guide for more information, including a basic description of how networks operate.


    ### 2.3.7 Network logins


    Network logins work a little differently than normal logins. There is a separate
    physical serial line for each terminal via which it is possible to log in. For
    each person logging in via the network, there is a separate virtual network connection,
    and there can be any number of these². It is therefore not possible to run a separate
    `getty` for each possible virtual connection. There are also several different
    ways to log in via a network, `telnet` and `rlogin` being the major ones in TCP/IP
    networks. Network logins have, instead of a herd of `gettys`, a single daemon
    per way of logging in (`telnet` and `rlogin` have separate daemons) that listens
    for all incoming login attempts. When it notices one, it starts a new instance
    of itself to handle that single attempt; the original instance continues to listen
    for other attempts. The new instance works similarly to `getty`.


    ### 2.3.8 Network file systems


    One of the more useful things that can be done with networking services is sharing
    files via a **network file system**. The one usually used is called the Network
    File System, or NFS, developed by Sun. With a network file system any file operations
    done by a program on one machine are sent over the network to another computer.
    This fools the program to think that all the files on the other computer are actually
    on the computer the program is running on. This makes information sharing extremely
    simple, since it requires no modifications to programs.


    > ²Well, at least there can be many. Network bandwidth still being a scarce resource,
    there is still some practical upper limit to the number of concurrent logins via
    one network connection.'
