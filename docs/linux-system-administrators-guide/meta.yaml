    book, but the type of connection decides the device file. See [Anv] for enlightenment.


    # **4.5 Tapes**


    A tape drive uses a tape, similar⁵ to cassettes used for music. A tape is serial
    in nature, which means that in order to get to any given part of it, you first
    have to go through all the parts in between. A disk can be accessed randomly,
    i.e., you can jump directly to any place on the disk. The serial access of tapes
    makes them slow.


    On the other hand, tapes are relatively cheap to make, since they do not need
    to be fast. They can also easily be made quite long, and can therefore contain
    a large amount of data. This makes tapes very suitable for things like archiving
    and backups, which do not require large speeds, but benefit from low costs and
    large storage capacities.


    # **4.6 Formatting**


    **Formatting** is the process of writing marks on the magnetic media that are
    used to mark tracks and sectors. Before a disk is formatted, its magnetic surface
    is a complete mess of magnetic signals. When it is formatted, some order is brought
    into the chaos by essentially drawing lines where the tracks go, and where they
    are divided into sectors. The actual details are not quite exactly like this,
    but that is irrelevant. What is important is that a disk cannot be used unless
    it has been formatted.


    The terminology is a bit confusing here: in MS-DOS, the word formatting is used
    to cover also the process of creating a filesystem (which will be discussed below).
    There, the two processes are often combined, especially for floppies. When the
    distinction needs to be made, the real formatting is called **low-level formatting**,
    while making the filesystem is called **high-level formatting**. In UNIX circles,
    the two are called formatting and making a filesystem, so that''s what is used
    in this book as well.


    For IDE and some SCSI disks the formatting is actually done at the factory and
    doesn''t need to be repeated; hence most people rarely need to worry about it.
    In


    > ⁵But completely different, of course.'
