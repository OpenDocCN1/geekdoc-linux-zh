    ## 第1章

    ## 引言

    > *起初，文件无形无状，空无一物；空无覆盖在比特的表面。著者的手指拂过键盘表面。著者说，要有文字，便有了文字。*

    本手册《Linux系统管理员指南》介绍了Linux使用中的系统管理相关内容。本书面向对系统管理几乎一无所知（比如连“系统管理是什么”都不清楚），但已经掌握基本日常使用操作的人群。

    本手册不涉及Linux安装相关内容，这部分内容在《安装与入门》文档中说明。更多Linux手册的相关信息请参阅下方内容。

    系统管理是指为使计算机系统保持可用状态所需进行的所有工作。其内容包括备份文件（必要时恢复文件）、安装新程序、为用户创建账号（不再需要时删除账号）、确保文件系统未损坏等等。如果把计算机比作房屋，系统管理就相当于房屋维护，包括打扫卫生、修补破损窗户这类工作。

    系统管理不叫维护，因为这名字太简单了。¹

    本手册的结构设计使得多数章节可独立阅读，因此如果你需要了解备份相关内容，只需阅读对应章节即可。²

    ¹确实有人这么叫，不过那是因为他们从来没读过这本手册，真可怜。

    ²前提是你读到的是包含备份章节的版本。

    '
