    \n## 第10章 ## 备份\n> 硬件的可靠性是概率性的。\n> 软件的不可靠性是必然的。\n> 人的不可靠性是概率性的。\n> 自然规律的可靠性是必然的。\n\
    本章将解释为什么要做备份、如何做备份、何时做备份，以及如何从备份中恢复数据。\n\n### 10.1 备份的重要性\n你的数据非常珍贵。重新创建这些数据需要花费时间与精力，这些成本要么折合成金钱，要么至少会带来个人烦恼与损失；有些数据甚至无法重新创建，比如某些实验的结果。既然数据是资产，你应当保护它，采取措施避免数据丢失。你可能会丢失数据的原因基本有四种：硬件故障、软件缺陷、人为操作、自然灾害。¹\n\
    ¹第五种原因是“其他情况”。\n虽然现代硬件通常非常可靠，但依然可能出现看似自发的故障。存储数据最关键的硬件是硬盘，它依赖微小磁场在充满电磁噪声的环境中保持完整。现代软件甚至通常不可靠，“坚如磐石”的程序是例外，而非常态。人非常不可靠，要么会犯错误，要么会出于恶意故意销毁数据。自然或许本无意作恶，但哪怕出于善意，也可能会造成严重破坏。总而言之，所有系统能正常运行本身就已经是个小奇迹了。\n\
    备份是保护数据资产的方式。只要拥有多份数据副本，哪怕其中一份被破坏，影响也不会太大（成本仅是从备份中恢复丢失数据的费用）。正确执行备份非常重要。和所有和物理世界相关的事物一样，备份迟早会出问题。做好备份的一部分是确保备份可用；你肯定不想发现自己的备份根本不起作用。$^2$\n\
    $^2$别笑，这种情况已经发生在不少人身上了。\n更糟糕的是，你备份时可能刚好遭遇严重系统崩溃；如果你只有一份备份介质，它也可能一并被损坏，最后你只能面对辛勤工作化为灰烬的结果。$^3$\n\
    $^3$这种事儿我也经历过……\n或者你在恢复数据时才发现忘了备份重要的内容，比如拥有15000个用户的网站的用户数据库。更糟的是，你的备份可能都完好无损，但唯一能读取你所用磁带类型的磁带驱动器现在已经被泡得满满一桶水了。说到备份，偏执本来就是这份工作的必备属性。\n\
    \n### 10.2 选择备份介质\n关于备份最重要的决定是选择备份介质。你需要考虑成本、可靠性、速度、可用性、易用性几个因素。\n成本很重要，因为备份存储容量最好是所需数据容量的数倍，因此廉价介质通常是必选项。可靠性极其重要，因为损坏的备份足以让一个成年人崩溃。备份介质必须能够多年无损坏地保存数据。介质的使用方式会影响其作为备份介质的可靠性：硬盘通常非常可靠，但如果和要备份的硬盘处于同一台电脑中，作为备份介质时可靠性并不高。\n\
    如果备份无需人工干预即可完成，速度通常不是很重要。备份耗时两小时也没关系，只要不需要人盯着就行。反过来，如果备份无法在电脑空闲时运行，速度就是一个问题。\n\
    可用性显然是必要条件，因为不存在的介质根本无法用来做备份。不那么显而易见的是，介质需要在未来、在你自己的电脑之外的设备上也能可用，否则灾难发生后你可能无法从备份中恢复数据。\n\
    易用性是影响备份频率的*重要*因素，备份越容易做，效果越好。备份介质不应当难用或者枯燥乏味。\n常见的备选介质是软盘和磁带。软盘非常廉价、相当可靠、速度不快、极易获取，但不适合存储大量数据。磁带价格从廉价到适中、相当可靠、速度中等、极易获取，且（取决于磁带容量）相当方便。\n\
    还有其他备选方案，它们的可用性通常不高，但如果可用性不是问题，在其他方面可能更有优势。比如磁光盘可以同时具备软盘（随机访问，单文件恢复速度快）和磁带（存储容量大）的优点。\n\
    \n### 10.3 选择备份工具\n有很多工具可以用来做备份。UNIX系统传统的备份工具是`tar`、`cpio`和`dump`。此外还有大量第三方工具包（包括免费软件和商业软件）可供选择。备份介质的选择会影响工具的选择。\n\
    `tar`和`cpio`功能类似，从备份角度来看基本等价。两者都支持将文件存储到磁带、从磁带读取文件。两者都支持几乎所有介质，因为内核设备驱动会处理底层设备操作，这些设备在用户级程序看来几乎都是一样的。部分UNIX版本的`tar`和`cpio`可能无法处理特殊文件（符号链接、设备文件、路径名非常长的文件等），但Linux版本应当可以正确处理所有文件。\n\
    `dump`的不同之处在于它直接读取文件系统，而非通过文件系统读取。它也是专门为备份设计的；`tar`和`cpio`实际上用于文件归档，虽然也可以用于备份。直接读取文件系统有一些优势：它可以在不影响文件时间戳的情况下备份文件；而对于`tar`和`cpio`，你需要先将文件系统挂载为只读模式。如果需要备份所有内容，直接读取文件系统也更高效，因为它所需的硬盘磁头移动更少。主要缺点是它会让备份程序专属于某种文件系统类型；Linux版的`dump`程序仅支持ext2文件系统。\n"
