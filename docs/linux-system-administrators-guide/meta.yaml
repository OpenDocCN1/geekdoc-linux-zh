    \ = block_size;\n    }\n    zeroes = 0;\n    while (fread(buf, block_size, 1,\
    \ f) == 1) {\n        for (p = buf; *p == '\\0'; )\n            ++p;\n       \
    \ if (p == buf+block_size) zeroes += block_size;\n    }\n    if (zeroes > 0) printf(\"\
    %ld %s\\n\", zeroes, filename);\n    if (ferror(f)) {\n        errormsg(0, -1,\
    \ \"read failed for '%s'\", filename);\n        return -1;\n    }\n    return\
    \ 0;\n}\n```\n\n## 附录B\n### 术语表（草稿）\n> 隐形大学的图书管理员单方面决定制作人/猩猩词典以帮助理解。这项工作他已经进行了三个月，难度不小。目前进度只到了「Oook」。（*特里·普拉切特*，《卫兵》）\n\
    本列表是Linux与系统管理相关概念的部分词条定义，标注的页码为该词汇首次出现或最常被使用的章节位置。\n**ambition** 雄心：编写有趣的句子，希望能被收录进Linux幸运饼干文件的行为。\n\
    **application program**（第6页）应用软件：能完成实际有用功能的软件。使用应用软件的成果就是购置计算机的目的。参见系统程序、操作系统。\n\
    **daemon** 守护进程：常驻后台的进程，通常不会被注意到，直到被特定事件触发才会运行。例如，`update`守护进程大约每30秒醒来一次，刷新缓冲缓存；`sendmail`守护进程则会在有人发送邮件时被触发。\n\
    **file system**（第38页）文件系统：操作系统用来追踪磁盘或分区上文件所采用的方法和数据结构，也指文件在磁盘上的组织方式。该词也可指用于存储文件的分区或磁盘，或文件系统的类型。\n\
    **glossary** 术语表：列有词汇及其解释的列表。注意不要和词典混淆，词典同样是列有词汇及解释的列表。\n**kernel**（第6页）内核：操作系统中负责实现硬件交互与资源分配的部分。参见系统程序。\n\
    **operating system**（第6页）操作系统：在用户及其运行的应用软件之间共享计算机系统资源（处理器、内存、磁盘空间、网络带宽等）的软件，控制系统访问权限以提供安全保障。参见内核、系统程序、应用软件。\n\
    **system call**（第6页）系统调用：内核为应用软件提供的服务，以及调用这些服务的方式。参见手册页第2节。\n**system program**（第6页）系统程序：实现操作系统高级功能的程序，即不直接依赖硬件的功能。这类程序有时需要特殊权限才能运行（例如发送电子邮件时），但通常也被默认为系统的一部分（例如编译器）。参见应用软件、内核、操作系统。\n\
