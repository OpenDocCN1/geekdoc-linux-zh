    \n### 9.5 临时禁用用户\n有时需要临时禁用账户（无需删除），例如用户未缴纳费用，或系统管理员怀疑某账户密码被黑客窃取。禁用账户的最佳方式是将其登录shell替换为仅输出提示信息的专用程序，这样任何尝试登录该账户的人都会登录失败，同时知晓失败原因。提示信息可以引导用户联系系统管理员，以便解决相关问题。当然也可以修改用户名或密码，但用户会不知道发生了什么，困惑的用户会增加额外的工作量。^5\n\
