    ⁴例如用户可能因结婚更改姓名，希望用户名能对应自己的新名字。\n\n### 9.4 删除用户\n要删除用户，首先需要移除该用户的所有文件、邮箱、邮件别名、打印任务、`cron`和`at`任务，以及所有与该用户相关的其他引用。之后需要从`/etc/passwd`和`/etc/group`中删除对应的行（记得将该用户从所有已加入的用户组中移除）。开始清理操作前，建议先禁用该账户（见下文），防止删除过程中用户仍在使用账户。需要注意用户的家目录之外可能还存在文件，可使用`find`命令查找：\n\
