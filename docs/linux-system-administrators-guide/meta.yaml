    # 3.2.2 The /dev directory


    The /dev directory contains the special device files for all the devices. The
    device files are named using special conventions; these are described in the Device
    list (see [Anv]). The device files are created during installation, and later
    with the /dev/MAKEDEV script. The /dev/MAKEDEV.local is a script written by the
    system administrator that creates local-only device files or links (i.e., those
    that are not part of the standard MAKEDEV, such as device files for some non-standard
    device driver).


