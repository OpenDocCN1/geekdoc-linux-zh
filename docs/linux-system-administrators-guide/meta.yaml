    fourth field once, when the run level is entered, and that init should wait for
    it to complete. The /etc/init.d/rc command runs whatever commands are necessary
    to start and stop services to enter run level 2.


    The command in the fourth field does all the hard work of setting up a run level.
    It starts services that aren''t already running, and stops services that shouldn''t
    be running in the new run level any more. Exactly what the command is, and how
    run levels are configured, depends on the Linux distribution.


