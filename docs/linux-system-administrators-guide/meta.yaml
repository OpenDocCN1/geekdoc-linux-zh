    ## 5.4 Sharing swap spaces with other operating systems

    Virtual memory is built into many operating systems. Since they each need it only
    when they are running, i.e., never at the same time, the swap spaces of all but
    the currently running one are being wasted. It would be more efficient for them
    to share a single swap space. This is possible, but can require a bit of hacking.
    The Tips-HOWTO contains some advice on how to implement this.


    ## 5.5 Allocating swap space

    Some people will tell you that you should allocate twice as much swap space as
    you have physical memory, but this is a bogus rule. Here''s how to do it properly:

    - 1. Estimate your total memory needs. This is the largest amount of memory you''ll
    probably need at a time, that is the sum of the memory requirements of all the
    programs you want to run at the same time. This can be done by running at the
    same time all the programs you are likely to ever be running at the same time.
    For instance, if you want to run X, you should allocate about 8 MB for it, gcc
    wants several megabytes (some files need an unusually large amount, up to tens
    of megabytes, but usually about four should do), and so on. The kernel will use
    about a megabyte by itself, and the usual shells and other small utilities perhaps
    a few hundred kilobytes (say a megabyte together). There is no need to try to
    be exact, rough estimates are fine, but you might want to be on the pessimistic
    side. Remember that if there are going to be several people using the system at
    the same time, they are all going to consume memory. However, if two people run
    the same program at the same time, the total memory consumption is usually not
    double, since code pages and shared libraries exist only once. The `free` and
    `ps` commands are useful for estimating the memory needs.

    - 2. Add some security to the estimate in step 1. This is because estimates of
    program sizes will probably be wrong, because you’ll probably forget some programs
    you want to run, and to make certain that you have some extra space just in case.
    A couple of megabytes should be fine. (It is better to allocate too much than
    too little swap space, but there’s no need to over-do it and allocate the whole
    disk, since unused swap space is wasted space; see later about adding more swap.)
    Also, since it is nicer to deal with even numbers, you can round the value up
    to the next full megabyte.

    - 3. Based on the computations above, you know how much memory you’ll be needing
    in total. So, in order to allocate swap space, you just need to subtract the size
    of your physical memory from the total memory needed, and you know how much swap
    space you need. (On some versions of UNIX, you need to allocate space for an image
    of the physical memory as well, so the amount computed in step 2 is what you need
    and you shouldn’t do the subtraction.)

    - 4. If your calculated swap space is very much larger than your physical memory
    (more than a couple times larger), you should probably invest in more physical
    memory, otherwise performance will be too low. It’s a good idea to have at least
    some swap space, even if your calculations indicate that you need none. Linux
    uses swap space somewhat aggressively, so that as much physical memory as possible
    can be kept free. Linux will swap out memory pages that have not been used, even
    if the memory is not yet needed for anything. This avoids waiting for swapping
    when it is needed—the swapping can be done earlier, when the disk is otherwise
    idle. Swap space can be divided among several disks. This can sometimes improve
    performance, depending on the relative speeds of the disks and the access patterns
    of the disks. You might want to experiment with a few schemes, but be aware that
    doing the experiments properly is quite difficult. You should not believe claims
    that any one scheme is superior to any other, since it won’t always be true.


    ## 5.6 The buffer cache

    Reading from a disk³ is very slow compared to accessing (real) memory.³Except
    a RAM disk, for obvious reasons. In addition, it is common to read the same part
    of a disk several times during relatively short periods of time. For example,
    one might first read an e-mail message, then read the letter into an editor when
    replying to it, then make the mail program read it again when copying it to a
    folder. Or, consider how often the command `ls` might be run on a system with
    many users. By reading the information from disk only once and then keeping it
    in memory until no longer needed, one can speed up all but the first read. This
    is called **disk buffering**, and the memory used for the purpose is called the
    **buffer cache**. Since memory is, unfortunately, a finite, nay, scarce resource,
    the buffer cache usually cannot be big enough (it can''t hold all the data one
    ever wants to use). When the cache fills up, the data that has been unused for
    the longest time is discarded and the memory thus freed is used for the new data.
    Disk buffering works for writes as well. On the one hand, data that is written
    is often soon read again (e.g., a source code file is saved to a file, then read
    by the compiler), so putting data that is written in the cache is a good idea.
    On the other hand, by only putting the data into the cache, not writing it to
    disk at once, the program that writes runs quicker. The writes can then be done
    in the background, without slowing down the other programs. Most operating systems
    have buffer caches (although they might be called something else), but not all
    of them work according to the above principles. Some are **write-through**: the
    data is written to disk at once (it is kept in the cache as well, of course).
    The cache is called **write-back** if the writes are done at a later time. Write-back
    is more efficient than write-through, but also a bit more prone to errors: if
    the machine crashes, or the power is cut at a bad moment, or the floppy is removed
    from the disk drive before the data in the cache waiting to be written gets written,
    the changes in the cache are usually lost. This might even mean that the filesystem
    (if there is one) is not in full working order, perhaps because the unwritten
    data held important changes to the bookkeeping information. Because of this, you
    should never turn off the power without using a proper shutdown procedure (see
    chapter 6), or remove a floppy from the disk drive until it has been unmounted
    (if it was mounted) or after whatever program is using it has signaled that it
    is finished and the floppy drive light doesn''t shine anymore. The `sync` command
    **flushes** the buffer, i.e., forces all unwritten data to be written to disk,
    and can be used when one wants to be sure that everything is safely written. In
    traditional UNIX systems, there is a program called `update` running in the background
    which does a `sync` every 30 seconds, so it is usually not necessary to use `sync`.
    Linux has an additional daemon, `bdflush`, which does a more imperfect sync more
    frequently to avoid the sudden freeze due to heavy disk I/O that `sync` sometimes
    causes. Under Linux, `bdflush` is started by `update`. There is usually no reason
    to worry about it, but if `bdflush` happens to die for some reason, the kernel
    will warn about this, and you should start it by hand (`/sbin/update`). The cache
    does not actually buffer files, but blocks, which are the smallest units of disk
    I/O (under Linux, they are usually 1 kB). This way, also directories, super blocks,
    other filesystem bookkeeping data, and non-filesystem disks are cached. The effectiveness
    of a cache is primarily decided by its size. A small cache is next to useless:
    it will hold so little data that all cached data is flushed from the cache before
    it is reused. The critical size depends on how much data is read and written,
    and how often the same data is accessed. The only way to know is to experiment.
    If the cache is of a fixed size, it is not very good to have it too big, either,
    because that might make the free memory too small and cause swapping (which is
    also slow). To make the most efficient use of real memory, Linux automatically
    uses all free RAM for buffer cache, but also automatically makes the cache smaller
    when programs need more memory. Under Linux, you do not need to do anything to
    make use of the cache, it happens completely automatically. Except for following
    the proper procedures for shutdown and removing floppies, you do not need to worry
    about it. ³Except a RAM disk, for obvious reasons.'
