    loaded<sup>1</sup> is called **booting**. The name comes from an image of the
    computer pulling itself up from its bootstraps, but the act itself slightly more
    realistic.


    During bootstrapping, the computer first loads a small piece of code called the
    **bootstrap loader**, which in turn loads and starts the operating system. The
    bootstrap loader is usually stored in a fixed location on a hard disk or a floppy.
    The reason for this two step process is that the operating system is big and complicated,
    but the


