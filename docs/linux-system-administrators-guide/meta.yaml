  md: 'being good. All in all, it is a small miracle that anything works at all.


    Backups are a way to protect the investment in data. By having several copies
    of the data, it does not matter as much if one is destroyed (the cost is only
    that of the restoration of the lost data from the backup).


    It is important to do backups properly. Like everything else that is related to
    the physical world, backups will fail sooner or later. Part of doing backups well
    is to make sure they work; you don''t want to notice that your backups didn''t
    work.$^2$ Adding insult to injury, you might have a bad crash just as you''re
    making the backup; if you have only one backup medium, it might destroyed as well,
    leaving you with the smoking ashes of hard work.$^3$ Or you might notice, when
    trying to restore, that you forgot to back up something important, like the user
    database on a 15 000 user site. Best of all, all your backups might be working
    perfectly, but the last known tape drive reading the kind of tapes you used was
    the one that now has a bucketful of water in it.


    When it comes to backups, paranoia is in the job description.


    # 10.2 Selecting the backup medium


    The most important decision regarding backups is the choice of backup medium.
    You need to consider cost, reliability, speed, availability, and usability.


    Cost is important, since you should preferably have several times more backup
    storage than what you need for the data. A cheap medium is usually a must.


    Reliability is extremely important, since a broken backup can make a grown man
    cry. A backup medium must be able to hold data without corruption for years. The
    way you use the medium affects it reliability as a backup medium. A hard disk
    is typically very reliable, but as a backup medium it is not very reliable, if
    it is in the same computer as the disk you are backing up.


    Speed is usually not very important, if backups can be done without interaction.
    It doesn''t matter if a backup takes two hours, as long as it needs no supervision.
    On the other hand, if the backup can''t be done when the computer would otherwise
    be idle, then speed is an issue.


    Availability is obviously necessary, since you can''t use a backup medium if it
    doesn''t exist. Less obvious is the need for the medium to be available even in
    the


    > $^2$Don''t laugh. This has happened to several people.


    > $^3$Been there, done that...'
