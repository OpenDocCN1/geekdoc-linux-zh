  md: '# ## 4.2 Hard disks


    The first character in the first column, i.e., ''c'' in `crw-rw-rw-` above, tells
    an informed user the type of the file, in this case a character device. For ordinary
    files, the first character is ''-'', for directories it is ''d'', and for block
    devices ''b''; see the `ls` man page for further information.


    Note that usually all device files exist even though the device itself might be
    not be installed. So just because you have a file `/dev/sda`, it doesn''t mean
    that you really do have an SCSI hard disk. Having all the device files makes the
    installation programs simpler, and makes it easier to add new hardware (there
    is no need to find out the correct parameters for and create the device files
    for the new device).


    This subsection introduces terminology related to hard disks. If you already know
    the terms and concepts, you can skip this subsection.


    See figure 4.1 for a schematic picture of the important parts in a hard disk.
    A hard disk consists of one or more circular **platters**,¹ of which either or
    both **surfaces** are coated with a magnetic substance used for recording the
    data. For each surface, there is a **read-write head** that examines or alters
    the recorded data. The platters rotate on a common axis; a typical rotation speed
    is 3600 rotations per minute, although high-performance hard disks have higher
    speeds. The heads move along the radius of the platters; this movement combined
    with the rotation of the platters allows the head to access all parts of the surfaces.


    The processor (CPU) and the actual disk communicate through a **disk controller**.
    This relieves the rest of the computer from knowing how to use the drive, since
    the controllers for different types of disks can be made to use the same interface
    towards the rest of the computer. Therefore, the computer can say just "hey disk,
    gimme what I want", instead of a long and complex series of electric signals to
    move the head to the proper location and waiting for the correct position to come
    under the head and doing all the other unpleasant stuff necessary. (In reality,
    the interface to the controller is still complex, but much less so than it would
    otherwise be.) The controller can also do some other stuff, such as caching, or
    automatic bad sector replacement.


    The above is usually all one needs to understand about the hardware. There is
    also a bunch of other stuff, such as the motor that rotates the platters and moves
    the heads, and the electronics that control the operation of the mechanical parts,
    but that is mostly not relevant for understanding the working principle of a hard
    disk.


    > ¹The platters are made of a hard substance, e.g., aluminium, which gives the
    hard disk its name.'
  merge: -1
  pgno: 36
