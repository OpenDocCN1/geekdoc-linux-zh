    # 9.3 Changing user properties


    There are a few commands for changing various properties of an account (i.e.,
    the relevant field in `/etc/passwd`):


    +   `chfn`   Change the full name field.

    `chsh`   Change the login shell.

    `passwd`   Change the password.


    The super-user may use these commands to change the properties of any account.
    Normal users can only change the properties of their own account. It may sometimes
    be necessary to disable these commands (with `chmod`) for normal users, for example
    in an environment with many novice users.


    Other tasks need to be done by hand. For example, to change the username, you
    need to edit `/etc/passwd` directly (with `vipw`, remember). Likewise, to add
    or remove the user to more groups, you need to edit `/etc/group` (with `vigr`).
    Such tasks tend to be rare, however, and should be done with caution: for example,
    if you change the username, e-mail will no longer reach the user, unless you also
    create a mail alias.⁴


    # 9.4 Removing a user


    To remove a user, you first remove all his files, mailboxes, mail aliases, print
    jobs, `cron` and `at` jobs, and all other references to the user. Then you remove
    the relevant lines from `/etc/passwd` and `/etc/group` (remember to remove the
    username from all groups it''s been added to). It may be a good idea to first
    disable the account (see below), before you start removing stuff, to prevent the
    user from using the account while it is being removed.


    Remember that users may have files outside their home directory. The `find` command
    can find them:


    ```

    `find / -user username`

    ```


    However, note that the above command will take a *long* time, if you have large
    disks. If you mount network disks (see section 2.3.8), you need to be careful
    so that you won''t trash the network or the server.


    > ⁴The user''s name might change due to marriage, for example, and he might want
    to have his username reflect his new name.'
  - '[PAGE 99]


    Some Linux distributions come with special commands to do this; look for `deluser`
    or `userdel`. However, it is easy to do it by hand as well, and the commands might
    not do everything.


    # 9.5 Disabling a user temporarily


    It is sometimes necessary to temporarily disable an account, without removing
    it. For example, the user might not have paid his fees, or the system administrator
    may suspect that a cracker has got the password of that account.


    The best way to disable an account is to change its shell into a special program
    that just prints a message. This way, whoever tries to log into the account, will
    fail, and will know why. The message can tell the user to contact the system administrator
    so that any problems may be dealt with.


    It would also be possible to change the username or password to something else,
    but then the user won''t know what is going on. Confused users mean more work.^5


    A simple way to create the special programs is to write ''tail scripts'':


    ```

    #!/usr/bin/tail +2

    This account has been closed due to a security breach.

    Please call 555-1234 and wait for the men in black to arrive.

    ```


    The first two characters (''#!'') tell the kernel that the rest of the line is
    a command that needs to be run to interpret this file. The `tail` command in this
    case outputs everything except the first line to the standard output.


    If `billg` is suspected of a security breach, the system administrator would do
    something like this:


    ```

    # chsh -s /usr/local/lib/no-login/security billg

    # su - tester

    This account has been closed due to a security breach.

    Please call 555-1234 and wait for the men in black to arrive.

    #

    ```


    The purpose of the `su` is to test that the change worked, of course.


    Tail scripts should be kept in a separate directory, so that their names don''t
    interfere with normal user commands.


    > ^5But they can be *so* fun, if you''re a BOFH.'
