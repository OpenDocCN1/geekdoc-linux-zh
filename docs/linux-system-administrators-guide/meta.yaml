    # ## Chapter 8


    # # Logging In And Out


    > *This chapter needs a quote. Suggestions, anyone?*


    This section describes what happens when a user logs in or out. The various interactions
    of background processes, log files, configuration files, and so on are described
    in some detail.


    # ### 8.1 Logins via terminals


    Figure 8.1 shows how logins happen via terminals. First, `init` makes sure there
    is a `getty` program for the terminal connection (or console). `getty` listens
    at the terminal and waits for the user to notify that he is ready to login in
    (this usually means that the user must type something). When it notices a user,
    `getty` outputs a welcome message (stored in `/etc/issue`), and prompts for the
    username, and finally runs the `login` program. `login` gets the username as a
    parameter, and prompts the user for the password. If these match, `login` starts
    the shell configured for the user; else it just exits and terminates the process
    (perhaps after giving the user another chance at entering the username and password).
    `init` notices that the process terminated, and starts a new `getty` for the terminal.


    Note that the only new process is the one created by `init` (using the `fork`
    system call); `getty` and `login` only replace the program running in the process
    (using the `exec` system call).


    A separate program, for noticing the user, is needed for serial lines, since it
    can be (and traditionally was) complicated to notice when a terminal becomes active.
    `getty`'
  - '[PAGE 89]


    also adapts to the speed and other settings of the connection, which is important
    especially for dial-in connections, where these parameters may change from call
    to call.


    There are several versions of `getty` and `init` in use, all with their good and
    bad points. It is a good idea to learn about the versions on your system, and
    also about the other versions (you could use the Linux Software Map to search
    them). If you don''t have dial-in''s, you probably don''t have to worry about
    `getty`, but `init` is still important.


    # 8.2 Logins via the network


    Two computers in the same network are usually linked via a single physical cable.
    When they communicate over the network, the programs in each computer that take
    part in the communication are linked via a **virtual connection**, a sort of imaginary
    cable. As far as the programs at either end of the virtual connection are concerned,
    they have a monopoly on their own cable. However, since the cable is not real,
    only imaginary, the operating systems of both computers can have several virtual
    connections share the same physical cable. This way, using just a single cable,
    several programs can communicate without having to know of or care about the other
    communications. It is even possible to have several computers use the same cable;
    the virtual connections exist between two computers, and the other computers ignore
    those connections that they don''t take part in.


    That''s a complicated and over-abstracted description of the reality. It might,
    however, be good enough to understand the important reason why network logins
    are somewhat different from normal logins. The virtual connections are established
    when there are two programs on different computers that wish to communicate. Since
    it is in principle possible to login from any computer in a network to any other
    computer, there is a huge number of potential virtual communications. Because
    of this, it is not practical to start a `getty` for each potential login.


    There is a single process `inetd` (corresponding to `getty`) that handles *all*
    network logins. When it notices an incoming network login (i.e., it notices that
    it gets a new virtual connection to some other computer), it starts a new process
    to handle that single login. The original process remains and continues to listen
    for new logins.


    To make things a bit more complicated, there is more than one communication protocol
    for network logins. The two most important ones are `telnet` and `rlogin`. In
    addition to logins, there are many other virtual connections that may be made
    (for'
  - '[PAGE 90]


    FTP, Gopher, HTTP, and other network services). It would be ineffective to have
    a separate process listening for a particular type of connection, so instead there
    is only one listener that can recognize the type of the connection and can start
    the correct type of program to provide the service. This single listener is called
    `inetd`; see the “Linux Network Administrators’ Guide” for more information.


    # ## 8.3 What login does


    The `login` program takes care of authenticating the user (making sure that the
    user-name and password match), and of setting up an initial environment for the
    user by setting permissions for the serial line and starting the shell.


    Part of the initial setup is outputting the contents of the file `/etc/motd` (short
    for message of the day) and checking for electronic mail. These can be disabled
    by creating a file called `.hushlogin` in the user’s home directory.


    If the file `/etc/nologin` exists, logins are disabled. That file is typically
    created by `shutdown` and relatives. `login` checks for this file, and will refuse
    to accept a login if it does exist. If it does exist, `login` outputs its contents
    to the terminal before it quits.


    `login` logs all failed login attempts in a system log file (via `syslog`). It
    also logs *all* logins by `root`. Both of these can be useful when tracking down
    intruders.


    Currently logged in people are listed in `/var/run/utmp`. This file is valid only
    until the system is next rebooted or shut down; it is cleared when the system
    is booted. It lists each user and the terminal (or network connection) he is using,
    along with some other useful information. The `who`, `w`, and other similar commands
    look in `utmp` to see who are logged in.


    All successful logins are recorded into `/var/log/wtmp`. This file will grow without
    limit, so it must be cleaned regularly, for example by having a weekly `cron`
    job to clear it.¹ The `last` command browses `wtmp`.


    Both `utmp` and `wtmp` are in a binary format (see the `utmp` manual page); it
    is unfortunately not convenient to examine them without special programs.


    # ### 8.4 X and xdm


    **META:** X implements logins via xdm; also: xterm -ls


    ¹Good Linux distributions do this out of the box.'
  - '[PAGE 91]


    # ## 8.5 Access control


    The user database is traditionally contained in the `/etc/passwd` file. Some systems
    use **shadow passwords**, and have moved the passwords to `/etc/shadow`. Sites
    with many computers that share the accounts use NIS or some other method to store
    the user database; they might also automatically copy the database from one central
    location to all other computers.


    The user database contains not only the passwords, but also some additional information
    about the users, such as their real names, home directories, and login shells.
    This other information needs to be public, so that anyone can read it. Therefore
    the password is stored encrypted. This does have the drawback that anyone with
    access to the encrypted password can use various cryptographical methods to guess
    it, without trying to actually log into the computer. Shadow passwords try to
    avoid this by moving the password into another file, which only `root` can read
    (the password is still stored encrypted). However, installing shadow passwords
    later onto a system that did not support them can be difficult.


    With or without passwords, it is important to make sure that all passwords in
    a system are good, i.e., not easily guessable. The `crack` program can be used
    to crack passwords; any password it can find is by definition not a good one.
    While `crack` can be run by intruders, it can also be run by the system adminstrator
    to avoid bad passwords. Good passwords can also be enforced by the `passwd` program;
    this is in fact more effective in CPU cycles, since cracking passwords requires
    quite a lot of computation.


    The user group database is kept in `/etc/group`; for systems with shadow passwords,
    there can be a `/etc/shadow.group`.


    `root` usually can''t login via most terminals or the network, only via terminals
    listed in the `/etc/securetty` file. This makes it necessary to get physical access
    to one of these terminals. It is, however, possible to log in via any terminal
    as any other user, and use the `su` command to become `root`.


    # ## 8.6 Shell startup


    When an interactive login shell starts, it automatically executes one or more
    predefined files. Different shells execute different files; see the documentation
    of each shell for further information.'
- md: "# 8.6. SHELL STARTUP\nMost shells first run some global file, for example,\
    \ the Bourne shell (`/bin/sh`) and its derivatives execute `/etc/profile`; in\
    \ addition, they execute `.profile` in the user's home directory.\n`/etc/profile`\
    \ allows the system administrator to have set up a common user environment, especially\
    \ by setting the `PATH` to include local command directories in addition to the\
    \ normal ones. On the other hand, `.profile` allows the user to customize the\
    \ environment to his own tastes by overriding, if necessary, the default environment.\n\
    \nFigure 8.1: Logins via terminals: the interaction of init, getty, login, and\
    \ the shell.\n- START\n- init: fork + exec(`/sbin/getty`)\n- getty: wait for user\
    \ input\n- getty: read username, exec(`/bin/login`)\n- login: read password\n\
    - Credentials do not match: login exits\n- Credentials match: login exec(`/bin/sh`)\n\
    - sh: read and execute commands\n- sh: exit\n\n# Chapter 9 Managing user accounts\n\
    > The similarities of sysadmins and drug dealers: both measure stuff in K's, and\
    \ both have users.\n> *(Old, tired computer joke.)*\nThis chapter explains how\
    \ to create new user accounts, how to modify the properties of those accounts,\
    \ and how to remove the accounts. Different Linux systems have different tools\
    \ for doing this.\n\n## 9.1 What's an account?\nWhen a computer is used by many\
    \ people it is usually necessary to differentiate between the users, for example,\
    \ so that their private files can be kept private. This is important even if the\
    \ computer can only be used by a single person at a time, as with most microcomputers.¹\
    \ Thus, each user is given a unique username, and that name is used to log in.\n\
    There's more to a user than just a name, however. An **account** is all the files,\
    \ resources, and information belonging to one user. The term hints at banks, and\
    \ in a commercial system each account usually has some money attached to it, and\
    \ that money vanishes at different speeds depending on how much the user stresses\
    \ the system. For example, disk space might have a price per megabyte and day,\
    \ and processing time might have a price per second.\n¹It might be quite embarrassing\
    \ if my sister could read my love letters.\n\n## 9.2 Creating a user\nThe Linux\
    \ kernel itself treats users as mere numbers. Each user is identified by a unique\
    \ integer, the user id or **uid**, because numbers are faster and easier for a\
    \ computer to process than textual names. A separate database outside the kernel\
    \ assigns a textual name, the **username**, to each user id. The database contains\
    \ additional information as well.\nTo create a user, you need to add information\
    \ about the user to the user database, and create a home directory for him. It\
    \ may also be necessary to educate the user, and set up a suitable initial environment\
    \ for him.\nMost Linux distributions come with a program for creating accounts.\
    \ There are several such programs available. Two command line alternatives are\
    \ `adduser` and `useradd`; there may be a GUI tool as well. Whatever the program,\
    \ the result is that there is little if any manual work to be done. Even if the\
    \ details are many and intricate, these programs make everything seem trivial.\
    \ However, section 9.2.4 describes how to do it by hand.\n\n### 9.2.1 /etc/passwd\
    \ and other informative files\nThe basic user database in a Unix system is the\
    \ text file, `/etc/passwd` (called the password file), which lists all valid usernames\
    \ and their associated information. The file has one line per username, and is\
    \ divided into seven colon-delimited fields:\n1. Username.\n2. Password, in an\
    \ encrypted form.\n3. Numeric user id.\n4. Numeric group id.\n5. Full name or\
    \ other description of account.\n6. Home directory.\n7. Login shell (program to\
    \ run at login).\nThe format is explained in more detail in *passwd*(5).\nAny\
    \ user on the system may read the password file, so that they can, for example,\
    \ learn the name of another user. This means that the password (the second field)\
    \ is also available to everyone. The password file encrypts the password, so in\
    \ theory there is no problem. However, the encryption is breakable, especially\
    \ if the password is weak (e.g., it is short or it can be found in a dictionary).\
    \ Therefore it is not a good idea to have the password in the password file.\n\
    Many Linux systems have **shadow passwords**. This is an alternative way of storing\
    \ the password: the encrypted password is stored in a separate file, `/etc/shadow`,\
    \ which only `root` can read. The `/etc/passwd` file only contains a special marker\
    \ in the second field. Any program that needs to verify a user is setuid, and\
    \ can therefore access the shadow password file. Normal programs, which only use\
    \ the other fields in the password file, can't get at the password.²\n\n### 9.2.2\
    \ Picking numeric user and group ids\nOn most systems it doesn't matter what the\
    \ numeric user and group ids are, but if you use the Network filesystem (NFS),\
    \ you need to have the same uid and gid on all systems. This is because NFS also\
    \ identifies users with the numeric uids. If you aren't using NFS, you can let\
    \ your account creation tool pick them automatically. If you are using NFS, you'll\
    \ have to invent a mechanism for synchronizing account information. One alternative\
    \ is the NIS system (see [Kir]).\n> **META:** this is wrong place?\nHowever, you\
    \ should try to avoid re-using numeric uid's (and textual usernames), because\
    \ the new owner of the uid (or username) may get access to the old owner's files\
    \ (or mail, or whatever).\n\n### 9.2.3 Initial environment: `/etc/skel`\nWhen\
    \ the home directory for a new user is created, it is initialized with files from\
    \ the `/etc/skel` directory. The system administrator can create files in `/etc/skel`\
    \ that will provide a nice default environment for users. For example, he might\
    \ create a `/etc/skel/.profile` that sets the EDITOR environment variable to some\
    \ editor that is friendly towards new users.\nHowever, it is usually best to try\
    \ to keep `/etc/skel` as small as possible, since it will be next to impossible\
    \ to update existing users' files. For example, if the name of the friendly editor\
    \ changes, all existing users would have to edit their `.profile`. The system\
    \ administrator could try to do it automatically, with a script, but that is almost\
    \ certainly going to break someone's file.\n> ²Yes, this means that the password\
    \ file has all the information about a user *except* his password. The wonder\
    \ of development.\n\n### 9.2.4 Creating a user by hand\nWhenever possible, it\
    \ is better to put global configuration into global files, such as `/etc/profile`.\
    \ This way it is possible to update it without breaking users' own setups.\nTo\
    \ create a new account manually, follow these steps:\n1. Edit `/etc/passwd` with\
    \ `vipw(8)` and add a new line for the new account. Be careful with the syntax.\
    \ *Do not edit directly with an editor!* `vipw` locks the file, so that other\
    \ commands won't try to update it at the same time. You should make the password\
    \ field be `*`, so that it is impossible to log in.\n2. Similarly, edit `/etc/group`\
    \ with `vigr`, if you need to create a new group as well.\n3. Create the home\
    \ directory of the user with `mkdir`.\n4. Copy the files from `/etc/skel` to the\
    \ new home directory.\n5. Fix ownerships and permissions with `chown` and `chmod`.\
    \ The `-R` option is most useful. The correct permissions vary a little from one\
