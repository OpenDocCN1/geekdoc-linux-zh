    # Chapter 1


    # Introduction


    > *In the beginning, the file was without form, and void; and emptiness was upon
    the face of the bits. And the Fingers of the Author moved upon the face of the
    keyboard. And the Author said, Let there be words, and there were words.*


    This manual, the Linux System Administrators'' Guide, describes the system administration
    aspects of using Linux. It is intended for people who know next to nothing about
    system administration (as in "what is it?"), but who have already mastered at
    least the basics of normal usage. This manual also doesn''t tell you how to install
    Linux; that is described in the Installation and Getting Started document. See
    below for more information about Linux manuals.


    System administration is all the things that one has to do to keep a computer
    system in a useable shape. It includes things like backing up files (and restoring
    them if necessary), installing new programs, creating accounts for users (and
    deleting them when no longer needed), making certain that the filesystem is not
    corrupted, and so on. If a computer were, say, a house, system administration
    would be called maintenance, and would include cleaning, fixing broken windows,
    and other such things. System administration is not called maintenance, because
    that would be too simple.1


    The structure of this manual is such that many of the chapters should be usable
    independently, so that if you need information about, say, backups, you can read
    just that chapter.2 This hopefully makes the book easier to use as a reference
    manual, and


    1There are some people who do call it that, but that''s just because they have
    never read this manual, poor things.


    2If you happen to be reading a version that has a chapter on backups, that is.'
