    home directory, encrypted password, and other information about each user. The
    format is documented in the *passwd* manual page.


    +   - `/etc/fdprm` Floppy disk parameter table. Describes what different floppy
    disk formats look like. Used by `setfdprm`. See the *setfdprm* manual page for
