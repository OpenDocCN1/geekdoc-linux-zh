    正确关闭Linux系统的命令是`shutdown`。它通常有两种使用方式。如果你使用的系统是单人使用的，那么使用`shutdown`的常规方式是：关闭所有正在运行的程序，退出所有虚拟控制台的登录，在其中一台虚拟控制台上以root身份登录（如果你已经是root身份则保持不变，但你应该切换到root目录，以避免卸载时出现问题），然后执行`shutdown
    -h now`命令（如果你想延时关机，可以将now替换为“+加对应分钟数”，不过单人系统通常不需要延时）。另外，如果你的系统有多个用户，请使用`shutdown
    -h +时间 提示信息`命令，其中“时间”是系统停止运行前的分钟数，“提示信息”是系统关机原因的简短说明。

    ```shell

    # shutdown -h +10 ''We will install a new disk. System should be back on-line
    in three hours.''

    ```

    这会在所有有用户登录的终端上向所有人发出警告，提示系统将在10分钟后关机，用户最好尽快退出避免数据丢失。警告会发送到所有有用户登录的终端，包括所有xterm终端：

    ```shell

    Broadcast message from root (ttyp0) Wed Aug 2 01:03:25 1995...

    We will install a new disk. System should be back on-line in three hours.

    The system is going DOWN for system halt in 10 minutes !!

    ```

    关机前，这个警告会自动重复播报几次，间隔会随着时间临近逐渐缩短。当延时阶段结束、正式关机开始后，所有文件系统（根文件系统除外）会被卸载，用户进程（如果仍有用户登录）会被终止，守护进程会被关闭，所有文件系统会被卸载，所有进程都会正常退出。完成这些操作后，`init`会输出一条提示，告知你可以关闭机器电源。此时，也只有此时，你才可以伸手去按电源开关。

    有时候，尽管在正常的优质系统上很少出现，会存在无法正常关机的情况。例如，如果内核出现panic、崩溃、损毁或其他异常行为，你可能完全无法输入任何新命令，此时正常关机是相当困难的，你几乎只能指望系统没有受到太严重的损坏，然后直接关闭电源。如果问题没那么严重（比如有人用斧头砸了你的键盘），但内核和更新程序仍然正常运行，那么最好等待几分钟，让更新程序有机会清空缓冲区缓存，之后再关闭电源。

    有些人喜欢使用`sync`命令[^3]来关机，等待磁盘I/O停止后再关闭电源。如果没有正在运行的程序，这种方式和使用`shutdown`命令的效果几乎相同。但是，这种方式不会卸载任何文件系统，可能会导致ext2fs的“干净文件系统”标志出现问题。三重sync方法不推荐使用。（如果你好奇的话：需要执行三次sync的原因是，在UNIX早期，这些命令需要分别输入，通常这段时间足够让大部分磁盘I/O完成。）

    [^3]：`sync`命令用于清空缓冲区缓存。


    ## 6.4 重启

    重启是指再次启动系统。完成重启可以先完全关闭系统、切断电源，再重新通电。更简单的方式是让`shutdown`命令重启系统，而不仅仅是停止运行。这可以通过给`shutdown`命令添加`-r`参数实现，例如执行`shutdown
    -r now`命令。大多数Linux系统会在用户按下键盘上的Ctrl+Alt+Del组合键时执行`shutdown -r now`命令实现重启。不过，Ctrl+Alt+Del组合键的触发动作是可配置的，在多用户机器上，最好设置重启前的延时。如果系统可以被任何人物理接触，甚至可以配置为按下Ctrl+Alt+Del组合键时不执行任何操作。


    ## 6.5 单用户模式

    `shutdown`命令还可以用于将系统切换至单用户模式，该模式下无人可以登录，但`root`用户可以通过控制台操作系统。该模式适用于无法在系统正常运行状态下执行的系统管理任务。单用户模式的更多详细内容会在第`??`章讨论。


    ## 6.6 紧急启动软盘

    并非所有情况下都能从硬盘启动计算机。例如，如果你在配置`LILO`时出错，可能会导致系统无法启动。针对这种情况，你需要一种无论如何都能工作的备用启动方式（只要硬件正常运行即可）。对于普通的PC而言，这意味着从软驱启动。大多数Linux发行版允许用户在安装过程中创建**紧急启动软盘**，建议你完成这一步操作。不过，部分此类启动盘仅包含内核，默认你会使用发行版安装盘中的程序来解决遇到的问题。有时这些程序不足以解决问题，例如，你可能需要从备份中恢复一些文件，而这些备份是用安装盘上没有的软件制作的。因此，可能还需要创建自定义的根文件系统软盘。Graham
    Chapman所著的*《启动磁盘HOWTO》*（[Cha]）包含了相关操作说明。当然，你必须记得定期更新你的紧急启动软盘和根文件系统软盘。你不能把用来挂载根文件系统软盘的软驱用于其他用途。如果你只有一台软驱，这会很不方便。不过，如果你的内存足够，你可以将启动软盘配置为将根磁盘加载到内存磁盘（ramdisk）中（这需要启动软盘的内核进行特殊配置）。一旦根软盘被加载到ramdisk中，软驱就可以空闲出来挂载其他磁盘了。


