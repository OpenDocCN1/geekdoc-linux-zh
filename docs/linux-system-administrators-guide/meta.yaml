  md: '# 5.6 The buffer cache


    Reading from a disk³ is very slow compared to accessing (real) memory. In addition,
    it is common to read the same part of a disk several times during relatively short
    periods of time. For example, one might first read an e-mail message, then read
    the letter into an editor when replying to it, then make the mail program read
    it again when copying it to a folder. Or, consider how often the command `ls`
    might be run on a system with many users. By reading the information from disk
    only once and then keeping it in memory until no longer needed, one can speed
    up all but the first read. This is called **disk buffering**, and the memory used
    for the purpose is called the **buffer cache**.


    Since memory is, unfortunately, a finite, nay, scarce resource, the buffer cache
    usually cannot be big enough (it can''t hold all the data one ever wants to use).
    When the cache fills up, the data that has been unused for the longest time is
    discarded and the memory thus freed is used for the new data.


    Disk buffering works for writes as well. On the one hand, data that is written
    is often soon read again (e.g., a source code file is saved to a file, then read
    by the compiler), so putting data that is written in the cache is a good idea.
    On the other hand, by only putting the data into the cache, not writing it to
    disk at once, the program that writes runs quicker. The writes can then be done
    in the background, without slowing down the other programs.


    Most operating systems have buffer caches (although they might be called something
    else), but not all of them work according to the above principles. Some are **write-through**:
    the data is written to disk at once (it is kept in the cache as well, of course).
    The cache is called **write-back** if the writes are done at a later time. Write-back
    is more efficient than write-through, but also a bit more prone to errors: if
    the machine crashes, or the power is cut at a bad moment, or the floppy is removed
    from the disk drive before the data in the cache waiting to be written gets written,
    the changes in the cache are usually lost. This might even mean that the filesystem
    (if there is one) is not in full working order, perhaps because the unwritten
    data held important changes to the bookkeeping information.


    Because of this, you should never turn off the power without using a proper shutdown
    procedure (see chapter 6), or remove a floppy from the disk drive until it has
    been unmounted (if it was mounted) or after whatever program is using it has signaled
    that it is finished and the floppy drive light doesn''t shine anymore. The `sync`


