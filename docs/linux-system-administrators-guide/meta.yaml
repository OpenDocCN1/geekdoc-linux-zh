    ## 10.6 What to back up

    You want to back up as much as possible. The major exception is software that
    can be easily reinstalled,⁴ but even they may have configuration files that it
    is important to back up, lest you need to do all the work to configure them all
    over again.

    ⁴ You get to decide what''s easy. Some people consider installing from dozens
    of floppies easy.

    Another major exception is the `/proc` filesystem; since that only contains data
    that the kernel always generates automatically, it is *never* a good idea to back
    it up. Especially the `/proc/kcore` file is unnecessary, since it is just an image
    of your current physical memory; it''s pretty large as well. Gray areas include
    the news spool, log files, and many other things in `/var`. You must decide what
    you consider important. The obvious things to back up are user files (`/home`)
    and system configuration files (`/etc`, but possibly other things scattered all
    over the filesystem).


    ### 10.7 Compressed Backups

    Backups take a lot of space, which can cost quite a lot of money. To reduce the
    space needed, the backups can be compressed. There are several ways of doing this.
    Some programs have support for compression built in; for example, the `-gzip`
    (`-z`) option for GNU `tar` pipes the whole backup through the `gzip` compression
    program, before writing it to the backup medium.

    Unfortunately, compressed backups can cause trouble. Due to the nature of how
    compression works, if a single bit is wrong, all the rest of the compressed data
    will be unusable. Some backup programs have some built in error correction, but
    no method can handle a large number of errors. This means that if the backup is
    compressed the way GNU `tar` does it, with the whole output compressed as a unit,
    a single error makes all the rest of the backup lost. Backups must be reliable,
    and this method of compression is not a good idea.

    An alternative way is to compress each file separately. This still means that
    the one file is lost, but all other files are unharmed. The lost file would have
    been corrupted anyway, so this situation is not much worse than not using compression
    at all. The `afio` program (a variant of `cpio`) can do this.

    Compression takes some time, which may make the backup program unable to write
    data fast enough for a tape drive.⁵ This can be avoided by buffering the output
    (either internally, if the backup program is smart enough, or by using another
    program), but even that might not work well enough. This should only be a problem
    on slow computers.

    ⁵ If a tape drive doesn''t write data fast enough, it has to stop; this makes
    backups even slower, and can be bad for the tape and the drive.


    ## Chapter 11 Keeping Time

    > Time is an illusion. Lunchtime double so.

    > (Douglas Adams.)

    This chapter explains how a Linux system keeps time, and what you need to do to
    avoid causing trouble. Usually, you don''t need to do anything about time, but
    it is good to understand it.


    ### 11.1 Time zones

    Time measurement is based on mostly regular natural phenomena, such as alternating
    light and dark periods caused by the rotation of the planet. The total time taken
    by two successive periods is constant, but the lengths of the light and dark period
    vary. One simple constant is noon. Noon is the time of the day when the Sun is
    at its highest position. Since the Earth is round,¹ noon happens at different
    times in different places.

    ¹ According to recent research.

    This leads to the concept of **local time**. Humans measure time in many units,
    most of which are tied to natural phenomena like noon. As long as you stay in
    the same place, it doesn''t matter that local times differ. As soon as you need
    to communicate with distant places, you''ll notice the need for a common time.
    In modern times, most of the places in the world communicate with most other places
    in the world, so a global standard for measuring time has been defined. This time
    is called **universal time** (UT or UTC, formerly known as Greenwich Mean Time
    or GMT, since it used to be local time in Greenwich, England). When people with
    different local times need to communicate, they can express times in universal
    time, so that there is no confusion about when things should happen.

    Each local time is called a time zone. While geography would allow all places
    that have noon at the same time have the same time zone, politics makes it difficult.
    For various reasons, many countries use **daylight savings time**, that is, they
    move their clocks to have more natural light while they work, and then move the
    clocks back during winter. Other countries do not do this. Those that do, do not
    agree when the clocks should be moved, and they change the rules from year to
    year. This makes time zone conversions definitely non-trivial. Time zones are
    best named by the location or by telling the difference between local and universal
    time. In the US and some other countries, the local time zones have a name and
    a three letter abbreviation. The abbreviations are not unique, however, and should
    not be used unless the country is also named. It is better to talk about the local
    time in, say, Helsinki, than about East European time, since not all countries
    in Eastern Europe follow the same rules.

    Linux has a time zone package that knows about all existing time zones, and that
    can easily be updated when the rules change. All the system administrator needs
    to do is to select the appropriate time zone. Also, each user can set his own
    time zone—this is important since many people work with computers in different
    countries over the Internet. When the rules for daylight savings time change in
    your local time zone, make sure you''ll upgrade at least that part of your Linux
    system. Other than setting the system time zone and upgrading the time zone data
    files, there is little need to bother about time.


    ### 11.2 The hardware and software clocks

    A personal computer has a battery driven hardware clock. The battery ensures that
    the clock will work even if the rest of the computer is without electricity. The
    hardware clock can be set from the BIOS setup screen or from whatever operating
    system is running. The Linux kernel keeps track of time independently from the
    hardware clock. During the boot, Linux sets its own clock to the same time as
    the hardware clock. After this, both clocks run independently. Linux maintains
    its own clock because looking at the hardware is slow and complicated.

    The kernel clock always shows universal time. This way, the kernel does not need
    to know about time zones at all—the simplicity results in higher reliability and
    makes it easier to update the time zone information. Each process handles time
    zone conversions itself (using standard tools that are part of the time zone package).
    The hardware clock can be in local time or in universal time. It is usually better
    to have it in universal time, because then you don''t need to change the hardware
    clock when daylight savings time begins or ends (UTC does not have DST). Unfortunately,
    some PC operating systems—including MS-DOS, Windows, OS/2—assume the hardware
    clock shows local time. Linux can handle either, but if the hardware clock shows
    local time, then it must be modified when daylight savings time begins or ends
    (otherwise it wouldn''t show local time).


    ### 11.3 Showing and setting time

    In the Debian system, the system time zone is determined by the symbolic link
    `/etc/localtime`. This link points at a time zone data file that describes the
    local time zone. The time zone data files are stored in `/usr/lib/zoneinfo`. Other
    Linux distributions may do this differently. A user can change his private time
    zone by setting the TZ environment variable. If it is unset, the system time zone
    is assumed. The syntax of the TZ variable is described in the *tzset*(3) manual
    page.

    The `date` command shows the current date and time.² For example:

    ```

    $ date

    Sun Jul 14 21:53:41 EET DST 1996

    ```

    That time is Sunday, 14th of July, 1996, at about ten before ten at the evening,
    in the time zone called “EET DST” (which might be East European Daylight Savings
    Time). `date` can also show the universal time:

    ```

    $ date -u

    Sun Jul 14 18:53:42 UTC 1996

    ```

    > <u>date is also used to set the kernel''s software clock:</u>

    ² Beware of the **time** command, which does *not* show the current time.'
