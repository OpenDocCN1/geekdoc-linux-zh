    # ## 4.4 CD-ROM''s


    A CD-ROM drive uses an optically read, plastic coated disk. The information is
    recorded on the surface of the disk^4 in small ''holes'' aligned along a spiral
    from the center to the edge. The drive directs a laser beam along the spiral to
    read the disk. When the laser hits a hole, the laser is reflected in one way;
    when it hits smooth surface, it is reflected in another way. This makes it easy
    to code bits, and therefore information. The rest is easy, mere mechanics.


    CD-ROM drives are slow compared to hard disks. Whereas a typical hard disk will
    have an average seek time less than 15 milliseconds, a fast CD-ROM drive can use
    tenths of a second for seeks. The actual data transfer rate is fairly high at
    hundreds of kilobytes per second. The slowness means that CD-ROM drives are not
    as pleasant to use instead of hard disks (some Linux distributions provide ''live''
    filesystems on CD-ROM''s, making it unnecessary to copy the files to the hard
    disk, making installation easier and saving a lot of hard disk space), although
    it is still possible. For installing new software, CD-ROM''s are very good, since
    its maximum speed is not essential during installation.


    There are several ways to arrange data on a CD-ROM. The most popular one is specified
    by the international standard ISO 9660. This standard specifies a very minimal
    filesystem, which is even more crude than the one MS-DOS uses. On the other hand,
    it is so minimal that every operating system should be able to map it to its native
    system.


    For normal UNIX use, the ISO 9660 filesystem is not usable, so an extension to
    the standard has been developed, called the Rock Ridge extension. Rock Ridge allows
    longer filenames, symbolic links, and a lot of other goodies, making a CD-ROM
    look more or less like any contemporary UNIX filesystem. Even better, a Rock Ridge
    filesystem is still a valid ISO 9660 filesystem, making it usable by non-UNIX
    systems as well. Linux supports both ISO 9660 and the Rock Ridge extensions; the
    extensions are recognized and used automatically.


    The filesystem is only half the battle, however. Most CD-ROM''s contain data that
    requires a special program to access, and most of these programs do not run under


    > ^4That is, the surface inside the disk, on the metal disk inside the plastic
    coating.'
  - '[PAGE 41]


    Linux (except, possibly, under dosemu, the Linux MS-DOS emulator).


    A CD-ROM drive is accessed via the corresponding device file. There are several
    ways to connect a CD-ROM drive to the computer: via SCSI, via a sound card, or
    via EIDE. The hardware hacking needed to do this is outside the scope of this
    book, but the type of connection decides the device file. See [Anv] for enlightenment.


    # **4.5 Tapes**


    A tape drive uses a tape, similar⁵ to cassettes used for music. A tape is serial
    in nature, which means that in order to get to any given part of it, you first
    have to go through all the parts in between. A disk can be accessed randomly,
    i.e., you can jump directly to any place on the disk. The serial access of tapes
    makes them slow.


    On the other hand, tapes are relatively cheap to make, since they do not need
    to be fast. They can also easily be made quite long, and can therefore contain
    a large amount of data. This makes tapes very suitable for things like archiving
    and backups, which do not require large speeds, but benefit from low costs and
    large storage capacities.


    # **4.6 Formatting**


    **Formatting** is the process of writing marks on the magnetic media that are
    used to mark tracks and sectors. Before a disk is formatted, its magnetic surface
    is a complete mess of magnetic signals. When it is formatted, some order is brought
    into the chaos by essentially drawing lines where the tracks go, and where they
    are divided into sectors. The actual details are not quite exactly like this,
    but that is irrelevant. What is important is that a disk cannot be used unless
    it has been formatted.


    The terminology is a bit confusing here: in MS-DOS, the word formatting is used
    to cover also the process of creating a filesystem (which will be discussed below).
    There, the two processes are often combined, especially for floppies. When the
    distinction needs to be made, the real formatting is called **low-level formatting**,
    while making the filesystem is called **high-level formatting**. In UNIX circles,
    the two are called formatting and making a filesystem, so that''s what is used
    in this book as well.


    For IDE and some SCSI disks the formatting is actually done at the factory and
    doesn''t need to be repeated; hence most people rarely need to worry about it.
    In


    > ⁵But completely different, of course.'
  - '[PAGE 42]


    # 4.6. Formatting


    fact, formatting a hard disk can cause it to work less well, for example because
    a disk might need to be formatted in some very special way to allow automatic
    bad sector replacement to work.


    Disks that need to be or can be formatted often require a special program anyway,
    because the interface to the formatting logic inside the drive is different from
    drive to drive. The formatting program is often either on the controller BIOS,
    or is supplied as an MS-DOS program; neither of these can easily be used from
    within Linux.


    During formatting one might encounter bad spots on the disk, called **bad blocks**
    or **bad sectors**. These are sometimes handled by the drive itself, but even
    then, if more of them develop, something needs to be done to avoid using those
    parts of the disk. The logic to do this is built into the filesystem; how to add
    the information into the filesystem is described below. Alternatively, one might
    create a small partition that covers just the bad part of the disk; this approach
    might be a good idea if the bad spot is very large, since filesystems can sometimes
    have trouble with very large bad areas.


    Floppies are formatted with `fdformat`. The floppy device file to use is given
    as the parameter. For example, the following command would format a high density,
    3$^1_2$ inch floppy in the first floppy drive:


    ```

    $ fdformat /dev/fd0H1440

    Double-sided, 80 tracks, 18 sec/track. Total capacity 1440 kB.

    Formatting ... done

    Verifying ... done

    $

    ```


    Note that if you want to use an autodetecting device (e.g., /dev/fd0), you *must*
    set the parameters of the device with `setfdprm` first. To achieve the same effect
    as above, one would have to do the following:


    ```

    $ setfdprm /dev/fd0 1440/1440

    $ fdformat /dev/fd0

    Double-sided, 80 tracks, 18 sec/track. Total capacity 1440 kB.

    Formatting ... done

    Verifying ... done

    $

    ```


    It is usually more convenient to choose the correct device file that matches the
    type of the floppy. Note that it is unwise to format floppies to contain more
    information than what they are designed for.'
  - '[PAGE 43]


    # 4.6. FORMATTING


    fdformat will also validate the floppy, i.e., check it for bad blocks. It will
    try a bad block several times (you can usually hear this, the drive noise changes
    dramatically). If the floppy is only marginally bad (due to dirt on the read/write
    head, some errors are false signals), `fdformat` won''t complain, but a real error
    will abort the validation process. The kernel will print log messages for each
    I/O error it finds; these will go to the console or, if `syslog` is being used,
    to the file `/usr/adm/messages`. `fdformat` itself won''t tell where the error
    is (one usually doesn''t care, floppies are cheap enough that a bad one is automatically
    thrown away).


    ```

    $ fdformat /dev/fd0H1440

    Double-sided, 80 tracks, 18 sec/track. Total capacity 1440 kB.

    Formatting ... done

    Verifying ... read: Unknown error

    $

    ```


    The `badblocks` command can be used to search any disk or partition for bad blocks
    (including a floppy). It does not format the disk, so it can be used to check
    even existing filesystems. The example below checks a 3½ inch floppy with two
    bad blocks.


    ```

    $ badblocks /dev/fd0H1440 1440

    718

    719

    $

    ```


    `badblocks` outputs the block numbers of the bad blocks it finds. Most filesystems
    can avoid such bad blocks. They maintain a list of known bad blocks, which is
    initialized when the filesystem is made, and can be modified later. The initial
    search for bad blocks can be done by the `mkfs` command (which initializes the
    filesystem), but later checks should be done with `badblocks` and the new blocks
    should be added with `fsck`. We''ll describe `mkfs` and `fsck` later.


    Many modern disks automatically notice bad blocks, and attempt to fix them by
    using a special, reserved good block instead. This is invisible to the operating
    system. This feature should be documented in the disk''s manual, if you''re curious
    if it is happening. Even such disks can fail, if the number of bad blocks grows
    too large, although chances are that by then the disk will be so rotten as to
    be unusable.'
- md: '## 4.7 Partitions


    一块硬盘可以被分成几个**分区**（partitions）。每个分区功能上就像是一块独立的硬盘。这样设计的想法是，如果你只有一块硬盘，而想要在上面安装两个（比如）操作系统，你可以把硬盘分成两个分区。每个操作系统都可以按需使用它的分区，而不会触碰另一个的分区。这样两个操作系统就能在同一块硬盘上和平共存。没有分区的话，你就得为每个操作系统买一块硬盘。软盘（Floppies）不进行分区。技术上没有理由禁止这样做，但由于它们太小，分区几乎没什么用。CD-ROM通常也不进行分区，因为把它们当作一块大磁盘来用更简单，而且很少需要在一张CD上安装多个操作系统。


    ### 4.7.1 MBR、引导扇区和分区表


    关于硬盘如何被分区的信息存储在其第一个扇区（即第一道第一面上的第一个扇区）。第一个扇区是硬盘的**主引导记录**（MBR）；这是BIOS在机器首次启动时读取并执行的扇区。主引导记录包含一个小程序，它读取分区表，检查哪个分区是活动的（即标记为可引导的），并读取该分区的第一个扇区，即该分区的**引导扇区**（MBR本身也是一个引导扇区，但它有特殊地位，因此有特殊名称）。这个引导扇区包含另一个小程序，它读取存储在该分区上的操作系统的第一部分（假设它是可引导的），然后启动它。


    分区方案不是内置于硬件或BIOS中的。它只是许多操作系统遵循的一种约定。并非所有操作系统都遵循它，但那些不遵循的属于例外。有些操作系统支持分区，但它们只占用硬盘上的一个分区，并在该分区内使用它们自己的内部分区方法。后一种类型可以与其他操作系统（包括**Linux**）和平共存，不需要任何特殊措施，但不支持分区的操作系统无法与任何其他操作系统在同一磁盘上共存。


    作为安全预防措施，最好将分区表写在一张纸上，这样如果它损坏了，你不必丢失所有文件。（糟糕的分区表可以用`fdisk`修复）。相关信息由`fdisk -l`命令给出：


    ```bash

    $ fdisk -l /dev/hda

    Disk /dev/hda: 15 heads, 57 sectors, 790 cylinders

    Units = cylinders of 855 * 512 bytes


    Device Boot Begin Start End Blocks Id System

    /dev/hda1 1 1 24 10231+ 82 Linux swap

    /dev/hda2 25 25 48 10260 83 Linux native

    /dev/hda3 49 49 408 153900 83 Linux native

    /dev/hda4 409 409 790 163305 5 Extended

    /dev/hda5 409 409 744 143611+ 83 Linux native

    /dev/hda6 745 745 790 19636+ 83 Linux native

    $

    ```


    ### 4.7.2 扩展和逻辑分区


    PC硬盘的原始分区方案只允许最多四个分区。这在实际使用中很快就显得太少了，部分原因是有些人想要超过四个操作系统（Linux、MS-DOS、OS/2、Minix、FreeBSD、NetBSD或Windows/NT等），但主要原因是有时在一个操作系统中使用多个分区是个好主意。例如，出于速度原因，交换空间通常最好放在它自己的分区中，而不是放在Linux主分区中（见下文）。


    为了克服这个设计问题，发明了**扩展分区**。这个技巧允许将一个**主分区**划分为子分区。这样被细分的那个主分区就是扩展分区；这些子分区就是**逻辑分区**。它们的行为像主分区，但创建方式不同。它们之间没有速度差异。


    硬盘的分区结构可能像图4.2那样。硬盘被分成三个主分区，其中第二个又被分成两个逻辑分区。硬盘的一部分根本没有被分区。整个硬盘和每个主分区都有一个引导扇区。


    [6] Illogical?


    ### 4.7.3 分区类型


    分区表（MBR中的那个以及扩展分区的那些）每个分区包含一个字节来标识该分区的类型。这试图识别使用该分区的操作系统，或者它用它来做什么。目的是为了避免两个操作系统意外地使用同一个分区。然而实际上，操作系统并不真正关心分区类型字节；例如，Linux完全不在乎它是什么。更糟的是，有些操作系统使用不正确；例如，至少有某些版本的DR-DOS忽略该字节的最高有效位，而其他版本则不然。


    没有标准机构来指定每个字节值的含义，但表4.1中包含了一些常用的值。同样的列表在Linux的`fdisk`程序中也可以找到。


    表4.1：分区类型（来自Linux的`fdisk`程序）


    |  |  |  |  |  |  |

    |---|---|---|---|---|---|

    | 0 | Empty | 40 | Venix 80286 | 94 | Amoeba BBT |

    | 1 | DOS 16-bit FAT | 51 | Novell? | a5 | BSD/386 |

    | 2 | XENIX root | 52 | Microport | b7 | BSDI fs |

    | 3 | XENIX usr | 63 | GNU HURD | b8 | BSDI swap |

    | 4 | DOS 16-bit <32M | 64 | Novell | c7 | Syrinx |

    | 5 | Extended | 75 | PC/IX | db | CP/M |

    | 6 | DOS 16-bit ≥32M | 80 | Old MINIX | e1 | DOS access |

    | 7 | OS/2 HPFS | 81 | Linux/MINIX | e3 | DOS R/O |

    | 8 | AIX | 82 | Linux swap | f2 | DOS secondary |

    | 9 | AIX bootable | 83 | Linux native | ff | BBT |

    | a | OS/2 Boot Manag | 93 | Amoeba |  |  |


    ### 4.7.4 分区硬盘


    有很多程序用于创建和删除分区。大多数操作系统都有自己的程序，使用每个操作系统自己的程序是个好主意，以防它做了其他程序无法处理的特殊操作。许多程序被称为`fdisk`，包括Linux的，或者其他变体。使用Linux
    `fdisk`的详细信息请参阅其man页面。`cfdisk`命令类似于`fdisk`，但有更好的（全屏）用户界面。


    使用IDE硬盘时，引导分区（包含可引导内核镜像文件的分区）必须完全位于前1024个柱面内。这是因为在引导时磁盘通过BIOS使用（在系统进入保护模式之前），而BIOS不能处理超过1024个柱面。有时可以使用部分位于前1024个柱面内的引导分区。只要通过BIOS读取的所有文件都在前1024个柱面内，这就能工作。由于这很难安排，这样做是个**非常糟糕的主意**；你永远不知道什么时候内核更新或磁盘碎片整理会导致系统无法引导。因此，确保你的引导分区完全位于前1024个柱面内。


    一些较新版本的BIOS和IDE硬盘事实上可以处理超过1024个柱面的磁盘。如果你有这样的系统，你可以忘记这个问题；如果你不太确定，把它放在前1024个柱面内。


    每个分区应该有偶数个扇区，因为Linux文件系统使用1 kB的块大小，即两个扇区。奇数个扇区会导致最后一个扇区未被使用。这不会导致任何问题，但看起来很丑，而且某些版本的`fdisk`会对此发出警告。


    改变分区大小通常需要先备份你希望从该分区保存的所有内容（最好是备份整个磁盘，以防万一），删除分区，创建新分区，然后将所有内容恢复到新分区。如果分区在扩大，你可能还需要调整相邻分区的大小（以及备份和恢复）。由于改变分区大小很痛苦，最好一次性把分区规划正确，或者拥有一个有效且易于使用的备份系统。


    如果你从几乎不需要人工干预的介质安装（比如从CD-ROM，


    （文本在此截断）'
