    # 第 9 章 管理用户账户

    > 系统管理员和毒贩的相似之处：两者都用“K”作为计量单位，而且都有自己的“用户”。

    > *(老掉牙的计算机笑话。)*


    本章将介绍如何创建新用户账户、如何修改账户属性以及如何删除账户。不同 Linux 系统用于完成这些操作的工具各不相同。


    ## 9.1 什么是账户？

    当一台计算机被多人使用时，通常需要区分不同用户，例如确保用户的私人文件不会被他人访问。这一点即便在多数微型计算机这种一次仅能供单人使用的设备上也很重要。¹
    因此，每个用户都会被分配一个唯一的用户名，该用户名用于登录。但用户的内涵远不止一个名字这么简单。**账户**是指属于单个用户的所有文件、资源和信息的集合。这一术语借鉴自银行，在商用系统中，每个账户通常都关联一定金额的存款，而存款的消耗速度取决于用户对系统的“压力”程度。例如，磁盘空间可能按每兆字节每天计价，处理时间可能按每秒计价。

    ¹ 如果我妹妹能读到我的情书，那可就太尴尬了。


    ## 9.2 创建用户

    Linux 内核本身将用户视为纯数字标识。每个用户都由一个唯一的整数，即用户 ID（**uid**）来标识，因为相比文本名称，数字更便于计算机快速处理。内核之外的一个独立数据库会将文本名称，即**用户名**，分配给每个用户
    ID，该数据库还存储了其他附加信息。


    要创建用户，你需要将用户信息添加到用户数据库中，并为该用户创建主目录。此外可能还需要对用户进行引导，为其配置合适的初始环境。大多数 Linux 发行版都自带用于创建账户的程序，目前也有多种同类工具可供选择。两个命令行工具替代选项是
    `adduser` 和 `useradd`，部分系统还提供了图形界面工具。无论使用哪种程序，最终结果都几乎不需要手动操作。尽管细节繁多且复杂，但这些工具会让所有操作看起来非常简单。不过
    9.2.4 节会介绍如何手动完成这些操作。


    ### 9.2.1 /etc/passwd 文件与其他信息文件

    Unix 系统的基础用户数据库是文本文件 `/etc/passwd`（也称为密码文件），其中列出了所有有效用户名及其关联信息。该文件每行对应一个用户名，共分为
    7 个以冒号分隔的字段：

    1. 用户名

    2. 经加密的密码

    3. 数字型用户 ID

    4. 数字型组 ID

    5. 用户全名或其他账户描述信息

    6. 主目录

    7. 登录 Shell（登录时运行的程序）

    该格式的详细说明可参考 *passwd*(5)。


    系统上的任意用户都可以读取密码文件，例如可以借此获取其他用户的名称。这意味着密码（第二字段）也会对所有人可见。密码文件会对密码进行加密，理论上不存在安全问题。但该加密方式是可破解的，尤其是当密码强度较低时（例如密码过短，或属于词典中的常见词汇），因此将密码直接存储在密码文件中并非明智之举。


    许多 Linux 系统采用**影子密码**机制。这是一种替代的密码存储方式：加密后的密码存储在独立的 `/etc/shadow` 文件中，仅 `root`
    用户可读取。`/etc/passwd` 文件的第二字段仅存储特殊标记。所有需要验证用户身份的程序都被设置为 setuid 权限，因此可以访问影子密码文件；而仅使用密码文件其他字段的普通程序无法获取密码内容。²


    ### 9.2.2 选择数字型用户 ID 与组 ID

    在多数系统中，数字型用户 ID 和组 ID 的具体数值并不重要，但如果你使用网络文件系统（NFS），就需要在所有系统上保持 uid 和 gid 一致。这是因为
    NFS 同样通过数字型 uid 标识用户。如果不使用 NFS，你可以让账户创建工具自动分配这些 ID。如果使用 NFS，你就需要设计一套账户信息同步机制，NIS
    系统就是可选的方案之一（参见 [Kir]）。

    > **元信息：** 放这里是不是不合适？


    不过，你应该尽量避免重复使用数字型 uid（以及文本型用户名），因为 uid（或用户名）的新所有者可能会获取到旧所有者的文件（或邮件、其他各类资源）。


    ### 9.2.3 初始环境：`/etc/skel`

    新用户的主目录创建完成后，会使用 `/etc/skel` 目录中的文件进行初始化。系统管理员可以在 `/etc/skel` 中创建文件，为用户提供友好的默认环境。例如，可以创建
    `/etc/skel/.profile` 文件，将 EDITOR 环境变量设置为适合新用户的编辑器。不过，通常最好尽量减小 `/etc/skel` 的体积，因为几乎不可能批量更新现有用户的文件。例如，如果友好编辑器的名称发生变更，所有现有用户都需要手动修改各自的
    `.profile` 文件。系统管理员可以尝试用脚本自动完成这一操作，但几乎肯定会破坏某个用户的配置文件。

    > ²没错，这意味着密码文件中包含了用户的所有信息，*唯独没有密码*。发展的奇妙之处就在于此。


    ### 9.2.4 手动创建用户

    只要条件允许，最好将全局配置写入全局文件（例如 `/etc/profile`），这样可以在不破坏用户个人配置的前提下更新配置。要手动创建新账户，请按照以下步骤操作：

    1. 使用 `vipw(8)` 编辑 `/etc/passwd` 文件，为新账户添加一行。请注意语法格式，*切勿直接使用普通编辑器编辑！* `vipw` 会锁定文件，避免其他命令同时尝试修改该文件。需要将密码字段设置为
    `*`，确保该账户无法登录。

    2. 如果需要同时创建新组，类似地使用 `vigr` 编辑 `/etc/group` 文件。

    3. 使用 `mkdir` 创建用户的主目录。

    4. 将 `/etc/skel` 中的文件复制到新主目录中。

    5. 使用 `chown` 和 `chmod` 修正文件的所有权和权限，`-R` 参数最常用。正确的权限设置因站点而异，但通常执行以下命令即可达到预期效果：

    ```bash

    cd /home/newusername

    chown -R username:group .

    chmod -R go=u,go-w .

    chmod go= .

    ```

    6. 使用 `passwd(1)` 设置账户密码。完成最后一步密码设置后，账户即可正常使用。请确保在所有其他操作完成后再设置密码，否则你在复制文件的过程中，用户可能无意中登录系统。


    有时可能需要创建无人使用的虚拟账户³。例如，搭建匿名 FTP 服务器（允许任何人无需提前申请账户即可下载文件）时，需要创建名为 `ftp` 的账户。这种情况通常不需要设置密码（即上述最后一步），实际上最好不要设置，这样除非先获取
    `root` 权限，否则任何人都无法使用该账户，因为 `root` 用户可以切换为任意用户。

    > ³没错，这意味着密码文件中包含了用户的所有信息，*唯独没有密码*。发展的奇妙之处就在于此。

    '
