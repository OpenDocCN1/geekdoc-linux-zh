  md: '# 2.3.9 Mail


    Electronic mail is usually the most important method for communicating via computer.
    An electronic letter is stored in a file using a special format, and special mail
    programs are used to send and read the letters.


    Each user has an **incoming mailbox** (a file in the special format), where all
    new mail is stored. When someone sends mail, the mail program locates the receiver''s
    mailbox and appends the letter to the mailbox file. If the receiver''s mailbox
    is in another machine, the letter is sent to the other machine, which delivers
    it to the mailbox as it best sees fit.


    The mail system consists of many programs. The delivery of mail to local or remote
    mailboxes is done by one program (the **mail transfer agent** or **MTA**, e.g.,
    `sendmail` or `smail`), while the programs users use are many and varied (**mail
    user agent** or **MUA**, e.g., `pine` or `elm`). The mailboxes are usually stored
    in `/var/spool/mail`.


    # 2.3.10 Printing


    Only one person can use a printer at one time, but it is uneconomical not to share
    printers between users. The printer is therefore managed by software that implements
    a **print queue**: all print jobs are put into a queue and whenever the printer
    is done with one job, the next one is sent to it automatically. This relieves
    the users from organizing the print queue and fighting over control of the printer.³


    The print queue software also **spools** the printouts on disk, i.e., the text
    is kept in a file while the job is in the queue. This allows an application program
    to spit out the print jobs quickly to the print queue software; the application
    does not have to wait until the job is actually printed to continue. This is really
    convenient, since it allows one to print out one version, and not have to wait
    for it to be printed before one can make a completely revised new version.


    # 2.4 The filesystem layout


    The filesystem is divided into many parts; usually along the lines of a root filesystem
    with `/bin`, `/lib`, `/etc`, `/dev`, and a few others; a `/usr` filesystem with
    programs and unchanging data; a `/var` filesystem with changing data (such as
    log files); and a `/home`


    > ³Instead, they form a new queue *at* the printer, waiting for their printouts,
    since no one ever seems to be able to get the queue software to know exactly when
    anyone''s printout is really finished. This is a great boost to intra-office social
    relations.'
