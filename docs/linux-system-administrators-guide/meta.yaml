  md: '# ## 4.7 Partitions


    A hard disk can be divided into several **partitions**. Each partition functions
    as if it were a separate hard disk. The idea is that if you have one hard disk,
    and want to have, say, two operating systems on it, you can divide the disk into
    two partitions. Each operating system uses its partition as it wishes and doesn''t
    touch the other one''s. This way the two operating systems can co-exist peacefully
    on the same hard disk. Without partitions one would have to buy a hard disk for
    each operating system.


    Floppies are not partitioned. There is no technical reason against this, but since
    they''re so small, partitions would be useful only very rarely. CD-ROM''s are
    usually also not partitioned, since it''s easier to use them as one big disk,
    and there is seldom a need to have several operating systems on one.


    # ### 4.7.1 The MBR, boot sectors and partition table


    The information about how a hard disk has been partitioned is stored in its first
    sector (that is, the first sector of the first track on the first disk surface).
    The first sector is the **master boot record** (MBR) of the disk; this is the
    sector that the BIOS reads in and starts when the machine is first booted. The
    master boot record contains a small program that reads the partition table, checks
    which partition is active (that is, marked bootable), and reads the first sector
    of that partition, the partition''s **boot sector** (the MBR is also a boot sector,
    but it has a special status and therefore a special name). This boot sector contains
    another small program that reads the first part of the operating system stored
    on that partition (assuming it is bootable), and then starts it.


    The partitioning scheme is not built into the hardware, or even into the BIOS.
    It is only a convention that many operating systems follow. Not all operating
    systems do follow it, but they are the exceptions. Some operating systems support
    partitions, but they occupy one partition on the hard disk, and use their internal
    partitioning method within that partition. The latter type exists peacefully with
    other operating systems (including **Linux**), and does not require any special
    measures, but an operating system that doesn''t support partitions cannot co-exist
    on the same disk with any other operating system.


    As a safety precaution, it is a good idea to write down the partition table on
    a piece of paper, so that if it ever corrupts you don''t have to lose all your
    files. (A bad partition table can be fixed with `fdisk`). The relevant information
    is given by the `fdisk -l` command:'
