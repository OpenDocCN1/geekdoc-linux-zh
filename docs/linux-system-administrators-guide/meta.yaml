    \ can be used automatically by listing them in the `/etc/fstab` file.\n\n| Device\
    \     | Mount | Type  | Options | Dump | Pass |\n|------------|-------|-------|---------|------|------|\n\
    | /dev/hda8  | none  | swap  | sw      | 0    | 0    |\n| /swapfile  | none  |\
    \ swap  | sw      | 0    | 0    |\n\nThe startup scripts will run the command\
    \ `swapon -a`, which will start swapping on all the swap spaces listed in `/etc/fstab`.\
    \ Therefore, the `swapon` command is usually used only when extra swap is needed.\n\
    \nYou can monitor the use of swap spaces with `free`. It will tell the total amount\
    \ of swap space used.\n\n```\n$ free\n\n              total      used      free\
    \    shared   buffers\nMem:         15152     14896       256     12404      2528\n\
    -/+ buffers:          12368      2784\nSwap:         32452      6684     25768\n\
    $\n```\n\nThe first line of output (`Mem:`) shows the physical memory. The total\
    \ column does not show the physical memory used by the kernel, which is usually\
    \ about a megabyte. The used column shows the amount of memory used (the second\
    \ line does not count buffers). The free column shows completely unused memory.\
    \ The shared column shows the amount of memory shared by several processes; the\
    \ more, the merrier. The buffers column shows the current size of the disk buffer\
    \ cache.\n\nThat last line (`Swap:`) shows similar information for the swap spaces.\
    \ If this line is all zeroes, your swap space is not activated.\n\nThe same information\
    \ is available via `top`, or using the `proc` filesystem in file `/proc/meminfo`.\
    \ It is currently difficult to get information on the use of a specific swap space.\n\
    \nA swap space can be removed from use with `swapoff`. It is usually not necessary\
    \ to do it, except for temporary swap spaces. Any pages in use in the swap space\
    \ are swapped in first; if there is not sufficient physical memory to hold them,\
