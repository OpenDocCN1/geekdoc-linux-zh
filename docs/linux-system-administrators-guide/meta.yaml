    When `init` starts, it finishes the boot process by doing a number of administrative
    tasks, such as checking filesystems, cleaning up `/tmp`, starting various services,
    and starting a `getty` for each terminal and virtual console where users should
    be able to log in (see chapter 8).


    After the system is properly up, `init` restarts `getty` for each terminal after
    a user has logged out (so that the next user can log in). `init` also adopts orphan
    processes: when a process starts a child process and dies before its child, the
    child immediately becomes a child of `init`. This is important for various technical
    reasons, but it is good to know it, since it makes it easier to understand process
    lists and process tree graphs.¹


    > ¹ init itself is not allowed to die. You can''t kill `init` even with SIGKILL.


