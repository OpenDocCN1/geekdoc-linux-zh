  md: '# 4.8.7 Checking for disk errors with badblocks


    It can be a good idea to periodically check for bad blocks. This is done with
    the `badblocks` command. It outputs a list of the numbers of all bad blocks it
    can find. This list can be fed to `fsck` to be recorded in the filesystem data
    structures so that the operating system won''t try to use the bad blocks for storing
    data. The following example will show how this could be done.


    ```

    $ badblocks /dev/fd0H1440 1440 > bad-blocks

    $ fsck -t ext2 -l bad-blocks /dev/fd0H1440

    Parallelizing fsck version 0.5a (5-Apr-94)

    e2fsck 0.5a, 5-Apr-94 for EXT2 FS 0.5, 94/03/10

    Pass 1: Checking inodes, blocks, and sizes

    Pass 2: Checking directory structure

    Pass 3: Checking directory connectivity

    Pass 4: Check reference counts.

    Pass 5: Checking group summary information.

    /dev/fd0H1440: ***** FILE SYSTEM WAS MODIFIED *****

    /dev/fd0H1440: 11/360 files, 63/1440 blocks

    $

    ```


    If badblocks reports a block that was already used, `e2fsck` will try to move
    the block to another place. If the block was really bad, not just marginal, the
    contents of the file may be corrupted.


    # 4.8.8 Fighting fragmentation


    When a file is written to disk, it can''t always be written in consecutive blocks.
    A file that is not stored in consecutive blocks is **fragmented**. It takes longer
    to read a fragmented file, since the disk''s read-write head will have to move
    more. It is desireable to avoid fragmentation, although it is less of a problem
    in a system with a good buffer cache with read-ahead.


    The ext2 filesystem attempts to keep fragmentation at a minimum, by keeping all
    blocks in a file close together, even if they can''t be stored in consecutive
    sectors. Ext2 effectively always allocates the free block that is nearest to other
    blocks in a file. For ext2, it is therefore seldom necessary to worry about fragmentation.
    There is a program for defragmenting an ext2 filesystem, see [TV] in the bibliography.'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'There are many MS-DOS defragmentation programs that move blocks around in the
    filesystem to remove fragmentation. For other filesystems, defragmentation must
    be done by backing up the filesystem, re-creating it, and restoring the files
    from backups. Backing up a filesystem before defragmenting is a good idea for
    all filesystems, since many things can go wrong during the defragmentation.


    # 4.8.9 Other tools for all filesystems


    Some other tools are also useful for managing filesystems. `df` shows the free
    disk space on one or more filesystems; `du` shows how much disk space a directory
    and all its files contain. These can be used to hunt down disk space wasters.


    `sync` forces all unwritten blocks in the buffer cache (see section 5.6) to be
    written to disk. It is seldom necessary to do this by hand; the daemon process
    `update` does this automatically. It can be useful in catastrophes, for example
    if `update` or its helper process `bdflush` dies, or if you must turn off power
    `now` and can''t wait for `update` to run.


    # 4.8.10 Other tools for the ext2 filesystem


    In addition to the filesystem creator (`mke2fs`) and checker (`e2fsck`) accessible
    directly or via the filesystem type independent front ends, the ext2 filesystem
    has some additional tools that can be useful.


    `tune2fs` adjusts filesystem parameters. Some of the more interesting parameters
    are:


    +   - A maximal mount count. `e2fsck` enforces a check when filesystem has been
    mounted too many times, even if the clean flag is set. For a system that is used
    for developing or testing the system, it might be a good idea to reduce this limit.

    - A maximal time between checks. `e2fsck` can also enforce a maximal time between
    two checks, even if the clean flag is set, and the filesystem hasn''t been mounted
    very often. This can be disabled, however.

    - Number of blocks reserved for `root`. Ext2 reserves some blocks for `root` so
    that if the filesystem fills up, it is still possible to do system administration
    without having to delete anything. The reserved amount is by default 5%, which
    on most disks isn''t enough to be wasteful. However, for floppies there is no
    point in reserving any blocks.'
