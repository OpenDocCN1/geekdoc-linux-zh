    ![](img/ceaf8a70f91e44dcbad3d66530d36479_107_0.png)


    Figure 10.1: A sample multilevel backup schedule.


    can be five Fridays in one month, so we need four more tapes), and tapes 7 to
    10 for daily backups (Monday to Thursday). With only four more tapes, we''ve been
    able to extend the backup history from two weeks (after all daily tapes have been
    used) to two months. It is true that we can''t restore every version of each file
    during those two months, but what we can restore is often good enough.


    Figure 10.1 shows which backup level is used each day, and which backups can be
    restored from at the end of the month.


    Backup levels can also be used to keep filesystem restoration time to a minimum.
    If you have many incremental backups with monotonously growing level numbers,
    you need to restore all of them if you need to rebuild the whole filesystem. Instead
    you can use level numbers that aren''t monotonous, and keep down the number of
    backups to restore.


    To minimize the number of tapes needed to restore, you could use a smaller level
    for each incremental tape. However, then the time to make the backups increases
    (each backup copies everything since the previous full backup). A better scheme
    is suggested by the `dump` manual page and described by the table 10.2. Use the
    following succession of backups: 3, 2, 5, 4, 7, 6, 9, 8, 9... This keeps both
    the backup and restore times low. The most you have to backup is two day''s worth
    of work. The number of tapes for a restore depends on how long you keep between
    full backups, but it is less than the simple schemes.


    A fancy scheme can reduce the amount of labor needed, but it does mean there are
    more things to keep track of. You must decide if it is worth it.


    `dump` has built-in support for backup levels. For `tar` and `cpio` it must be
    implemented with shell scripts.'
