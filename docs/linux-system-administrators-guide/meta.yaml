  md: '# 4.8. FILESYSTEMS


    details vary quite a bit. The central concepts are **superblock**, **inode**,
    **data block**, **directory block**, and **indirection block**. The superblock
    contains information about the filesystem as a whole, such as its size (the exact
    information here depends on the filesystem). An inode contains all information
    about a file, except its name. The name is stored in the directory, together with
    the number of the inode. A directory entry consists of a filename and the number
    of the inode which represents the file. The inode contains the numbers of several
    data blocks, which are used to store the data in the file. There is space only
    for a few data block numbers in the inode, however, and if more are needed, more
    space for pointers to the data blocks is allocated dynamically. These dynamically
    allocated blocks are indirect blocks; the name indicates that in order to find
    the data block, one has to find its number in the indirect block first.


    UNIX filesystems usually allow one to create a **hole** in a file (this is done
    with `lseek`; check the manual page), which means that the filesystem just pretends
    that at a particular place in the file there is just zero bytes, but no actual
    disk sectors are reserved for that place in the file (this means that the file
    will use a bit less disk space). This happens especially often for small binaries,
    Linux shared libraries, some databases, and a few other special cases. (Holes
    are implemented by storing a special value as the address of the data block in
    the indirect block or inode. This special address means that no data block is
    allocated for that part of the file, ergo, there is a hole in the file.)


    Holes are moderately useful. On the author''s system, a simple measurement showed
    a potential for about 4 MB of savings through holes of about 200 MB total used
    disk space. That system, however, contains relatively few programs and no database
    files. The measurement tool is described in appendix A.


    # 4.8.2 Filesystems galore


    Linux supports several types of filesystems. As of this writing the most important
    ones are:


    +   - **minix** The oldest, presumed to be the most reliable, but quite limited
    in features (some time stamps are missing, at most 30 character filenames) and
    restricted in capabilities (at most 64 MB per filesystem).

    - **xia** A modified version of the minix filesystem that lifts the limits on
    the filenames and filesystem sizes, but does not otherwise introduce new features.
    It is not very popular, but is reported to work very well.'
