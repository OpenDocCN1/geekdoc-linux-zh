    (A.A. Milne)


    This chapter describes the important parts of a standard Linux directory tree,
    based on the FSSTND filesystem standard. It outlines the normal way of breaking
    the directory tree into separate filesystems with different purposes and gives
    the motivation behind this particular split. Some alternative ways of splitting
    are also described.


    # 3.1 Background


    This chapter is loosely based on the Linux filesystem standard, FSSTND, version
    1.2 (see the bibliography, [Qui95]), which attempts to set a standard for how
    the directory tree in a Linux system is organized. Such a standard has the advantage
    that it will be easier to write or port software for Linux, and to administer
    Linux machines, since everything will be in their usual places. There is no authority
    behind the standard that forces anyone to comply with it, but it has got the support
    of most, if not all, Linux distributions. It is not a good idea to break with
    the FSSTND without very compelling reasons. The FSSTND attempts to follow Unix
    tradition and current trends, making Linux systems familiar to those with experience
    with other Unix systems, and vice versa.'
  - '[PAGE 25]


    # 3.1. BACKGROUND


    This chapter is not as detailed as the FSSTND. A system administrator should also
    read the FSSTND for a complete understanding.


    This chapter does not explain all files in detail. The intention is not to describe
    every file, but to give an overview of the system from a filesystem point of view.
    Further information on each file is available elsewhere in this manual or the
    manual pages.


    The full directory tree is intended to be breakable into smaller parts, each on
    its own disk or partition, to accomodate to disk size limits and to ease backup
    and other system administration. The major parts are the root, /usr, /var, and
    /home filesystems (see figure 3.1). Each part has a different purpose. The directory
    tree has been designed so that it works well in a network of Linux machines which
    may share some parts of the filesystems over a read-only device (e.g., a CD-ROM),
    or over the network with NFS.


    ![](img/ceaf8a70f91e44dcbad3d66530d36479_25_0.png)


    Figure 3.1: Parts of a Unix directory tree. Dashed lines indicate partition limits.


    The roles of the different parts of the directory tree are described below.


    +   - The root filesystem is specific for each machine (it is generally stored
    on a local disk, although it could be a ramdisk or network drive as well) and
    contains the files that are necessary for booting the system up, and to bring
    it up to such a state that the other filesystems may be mounted. The contents
    of the root filesystem will therefore be sufficient for the single user state.
    It will also contain tools for fixing a broken system, and for recovering lost
    files from backups.


    - The /usr filesystem contains all commands, libraries, manual pages, and other
    unchanging files needed during normal operation. No files in /usr should be specific
    for any given machine, nor should they be modified during normal use. This allows
    the files to be shared over the network, which can be cost-effective'
  - '[PAGE 26]


    since it saves disk space (there can easily be hundreds of megabytes in `/usr`),
    and can make administration easier (only the master `/usr` needs to be changed
    when updating an application, not each machine separately). Even if the filesystem
    is on a local disk, it could be mounted read-only, to lessen the chance of filesystem
    corruption during a crash.


    +   - The `/var` filesystem contains files that change, such as spool directories
    (for mail, news, printers, etc), log files, formatted manual pages, and temporary
    files. Traditionally everything in `/var` has been somewhere below `/usr`, but
    that made it impossible to mount `/usr` read-only.

    - The `/home` filesystem contains the users'' home directories, i.e., all the
    real data on the system. Separating home directories to their own directory tree
    or filesystem makes backups easier; the other parts often do not have to be backed
    up, or at least not as often (they seldom change). A big `/home` might have to
    be broken on several filesystems, which requires adding an extra naming level
    below `/home`, e.g., `/home/students` and `/home/staff`.


    Although the different parts have been called filesystems above, there is no requirement
    that they actually be on separate filesystems. They could easily be kept in a
    single one if the system is a small single-user system and the user wants to keep
    things simple. The directory tree might also be divided into filesystems differently,
    depending on how large the disks are, and how space is allocated for various purposes.
    The important part, though, is that all the standard *names* work; even if, say,
    `/var` and `/usr` are actually on the same partition, the names `/usr/lib/libc.a`
    and `/var/adm/messages` must work, for example by moving files below `/var` into
    `/usr/var`, and making `/var` a symlink to `/usr/var`.


    The Unix filesystem structure groups files according to purpose, i.e., all commands
    are in one place, all data files in another, documentation in a third, and so
    on. An alternative would be to group files files according to the program they
    belong to, i.e., all Emacs files would be in one directory, all T\E{}X in another,
    and so on. The problem with the latter approach is that it makes it difficult
    to share files (the program directory often contains both static and shareable
    and changing and non-shareable files), and sometimes to even find the files (e.g.,
    manual pages in a huge number of places, and making the manual page programs find
    all of them is a maintenance nightmare).'
- md: '## 3.2 The root filesystem


    The root filesystem should generally be small, since it contains very critical
    files and a small, infrequently modified filesystem has a better chance of not
    getting corrupted. A corrupted root filesystem will generally mean that the system
    becomes unbootable except with special measures (e.g., from a floppy), so you
    don''t want to risk it. The root directory generally doesn''t contain any files,
    except perhaps the standard boot image for the system, usually called `/vmlinux`.
    All other files are in subdirectories in the root filesystem:

    - **`/bin`**: Commands needed during bootup that might be used by normal users
    (probably after bootup).

    - **`/sbin`**: Like /bin, but the commands are not intended for normal users,
    although they may use them if necessary and allowed.

    - **`/etc`**: Configuration files specific to the machine.

    - **`/root`**: The home directory for user root.

    - **`/lib`**: Shared libraries needed by the programs on the root filesystem.

    - **`/lib/modules`**: Loadable kernel modules, especially those that are needed
    to boot the system when recovering from disasters (e.g., network and filesystem
    drivers).

    - **`/dev`**: Device files.

    - **`/tmp`**: Temporary files. Programs running after bootup should use /var/tmp,
    not /tmp, since the former is probably on a disk with more space.

    - **`/boot`**: Files used by the bootstrap loader, e.g., LILO. Kernel images are
    often kept here instead of in the root directory. If there are many kernel images,
    the directory can easily grow rather big, and it might be better to keep it in
    a separate filesystem. Another reason would be to make sure the kernel images
    are within the first 1024 cylinders of an IDE disk.

    - **`/mnt`**: Mount point for temporary mounts by the system administrator. Programs
    aren''t supposed to mount on /mnt automatically. /mnt might be divided into subdirectories
    (e.g., /mnt/dosa might be the floppy drive using an MS-DOS filesystem, and `/mnt/exta`
    might be the same with an ext2 filesystem).


    `/proc`, `/usr`, `/var`, `/home` Mount points for the other filesystems.


    ### 3.2.1 The /etc directory


    The `/etc` directory contains a lot of files. Some of them are described below.
    For others, you should determine which program they belong to and read the manual
    page for that program. Many networking configuration files are in `/etc` as well,
    and are described in the Networking Administrators'' Guide.

    - `/etc/rc` or `/etc/rc.d` or `/etc/rc?.d` Scripts or directories of scripts to
    run at startup or when changing the run level. See the chapter on `init` for further
    information.

    - `/etc/passwd` The user database, with fields giving the username, real name,
    home directory, encrypted password, and other information about each user. The
    format is documented in the *passwd* manual page.

    - `/etc/fdprm` Floppy disk parameter table. Describes what different floppy disk
    formats look like. Used by `setfdprm`. See the *setfdprm* manual page for more
    information.

    - `/etc/fstab` Lists the filesystems mounted automatically at startup by the `mount
    -a` command (in `/etc/rc` or equivalent startup file). Under Linux, also contains
    information about swap areas used automatically by `swapon -a`. See section 4.8.5
    and the *mount* manual page for more information.

    - `/etc/group` Similar to `/etc/passwd`, but describes groups instead of users.
    See the *group* manual page for more information.

    - `/etc/inittab` Configuration file for `init`.

    - `/etc/issue` Output by `getty` before the login prompt. Usually contains a short
    description or welcoming message to the system. The contents are up to the system
    administrator.

    - `/etc/magic` The configuration file for `file`. Contains the descriptions of
    various file formats based on which `file` guesses the type of the file. See the
    *magic* and *file* manual pages for more information.

    - `/etc/motd` The message of the day, automatically output after a successful
    login. Contents are up to the system administrator. Often used for getting information
    to every user, such as warnings about planned downtimes.

    - `/etc/mtab` List of currently mounted filesystems. Initially set up by the scripts,
    and updated automatically by the `mount` command. Used when a list of mounted
    filesystems is needed, e.g., by the `df` command.

    - `/etc/shadow` Shadow password file on systems with shadow password software
    installed. Shadow passwords move the encrypted password from `/etc/passwd` into
    `/etc/shadow`; the latter is not readable by anyone except `root`. This makes
    it harder to crack passwords.

    - `/etc/login.defs` Configuration file for the `login` command.

    - `/etc/printcap` Like `/etc/termcap`, but intended for printers. Different syntax.

    - `/etc/profile`, `/etc/csh.login`, `/etc/csh.cshrc` Files executed at login or
    startup time by the Bourne or `C` shells. These allow the system administrator
    to set global defaults for all users. See the manual pages for the respective
    shells.

    - `/etc/securety` Identifies secure terminals, i.e., the terminals from which
    `root` is allowed to log in. Typically only the virtual consoles are listed, so
    that it becomes impossible (or at least harder) to gain superuser privileges by
    breaking into a system over a modem or a network.

    - `/etc/shells` Lists trusted shells. The `chsh` command allows users to change
    their login shell only to shells listed in this file. `ftpd`, the server process
    that provides FTP services for a machine, will check that the user''s shell is
    listed in `/etc/shells` and will not let people log in unless the shell is listed
    there.

    - `/etc/termcap` The terminal capability database. Describes by what “escape sequences”
    various terminals can be controlled. Programs are written so that instead of directly
    outputting an escape sequence that only works on a particular brand of terminal,
    they look up the correct sequence to do whatever it is they want to do in `/etc/termcap`.
    As a result most programs work with most kinds of terminals. See the `termcap`,
    `curs_termcap`, and `terminfo` manual pages for more information.


    ### 3.2.2 The /dev directory


    The /dev directory contains the special device files for all the devices. The
    device files are named using special conventions; these are described in the Device
    list (see [1]). The device files are created during installation, and later with
    the /dev/MAKEDEV script. The /dev/MAKEDEV.local is a script written by the system
    administrator that creates local-only device files or links (i.e., those that
    are not part of the standard MAKEDEV, such as device files for some non-standard
    device driver).


    ## 3.3 The /usr filesystem


    The /usr filesystem is often large, since all programs are installed there. All
    files in /usr usually come from a Linux distribution; locally installed programs
    and other stuff goes below /usr/local. This makes it possible to update the system
    from a new version of the distribution, or even a completely new distribution,
    without having to install all programs again. Some of the subdirectories of /usr
    are listed below (some of the less important directories have been dropped; see
    the FSSTND for more information).

    - `/usr/X11R6` The X Window System, all files. To simplify the development and
    installation of X, the X files have not been integrated into the rest of the system.
    There is a directory tree below /usr/X11R6 similar to that below /usr itself.

    - `/usr/X386` Similar to /usr/X11R6, but for X11 Release 5.

    - `/usr/bin` Almost all user commands. Some commands are in /bin or in /usr/local/bin.

    - `/usr/sbin` System administration commands that are not needed on the root filesystem,
    e.g., most server programs.

    - `/usr/man`, `/usr/info`, `/usr/doc` Manual pages, GNU Info documents, and miscellaneous
    other documentation files, respectively.

    - `/usr/include` Header files for the C programming language. This should actually
    be below /usr/lib for consistency, but the tradition is overwhelmingly in support
    for this name.

    - `/usr/lib` Unchanging data files for programs and subsystems, including some
    site-wide configuration files. The name lib comes from library; originally'
