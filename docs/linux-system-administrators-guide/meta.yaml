    - `/usr/local`：用于本地安装的软件和其他文件的位置。


    ## 3.4 The /var filesystem

    - `/var/catman`：按需格式化的手册页缓存。手册页的源文件通常存储在`/usr/man/man*`中；部分手册页可能附带预格式化的版本，存储在`/usr/man/cat*`中。其他手册页在首次查看时需要格式化，格式化后的版本会存储在`/var/catman`中，这样后续查看同一页面的用户无需等待格式化完成。（`/var/catman`的清理方式与临时目录的清理方式相同。）

    - `/var/lib`：系统正常运行期间会发生变化的文件。

    - `/var/local`：安装在`/usr/local`中的程序的可变数据（即由系统管理员安装的程序）。注意，即使是本地安装的程序，如果适用的话，也应使用其他`/var`目录，例如`/var/lock`。

    - `/var/lock`：锁文件。许多程序遵循约定，在`/var/lock`中创建锁文件，以表明它们正在使用特定的设备或文件。其他程序会检测到锁文件，不会尝试使用该设备或文件。

    - `/var/log`：来自各种程序的日志文件，尤其是`login`（`/var/log/wtmp`，记录所有登录和登出系统的操作）和`syslog`（`/var/log/messages`，通常存储所有内核和系统程序消息）。`/var/log`中的文件通常可以无限增长，可能需要定期清理。

    - `/var/run`：包含系统信息的文件，这些信息在系统下次启动前有效。例如，`/var/run/utmp`包含当前登录用户的信息。

    - `/var/spool`：用于存放邮件、新闻、打印队列和其他排队任务的目录。每个不同的假脱机任务在`/var/spool`下都有自己的子目录，例如用户的邮箱位于`/var/spool/mail`中。

    - `/var/tmp`：存储体积较大或需要留存时间超过`/tmp`允许时长的临时文件。（尽管系统管理员可能也不允许`/var/tmp`中存放非常旧的文件。）


    ## 3.5 The /proc filesystem

    The `/proc` filesystem is an illusionary filesystem. It does not exist on a disk;
    instead, the kernel creates it in memory. It is used to provide information about
    the system (originally about processes, hence the name). Some of the more important
    files and directories are explained below. The `/proc` filesystem is described
    in more detail in the `proc` manual page.

    - **`/proc/1`**：进程号1的目录，包含该进程的相关信息。每个进程在`/proc`下都有一个以其进程识别号命名的目录。

    - **`/proc/cpuinfo`**：处理器相关信息，包括类型、制造商、型号和性能等。

    - **`/proc/devices`**：当前运行内核中配置的设备驱动列表。

    - **`/proc/dma`**：显示当前正在使用的DMA通道。

    - **`/proc/filesystems`**：内核中配置的文件系统。

    - **`/proc/interrupts`**：显示正在使用的中断，以及每种中断被触发的次数。

    - **`/proc/ioports`**：显示当前正在使用的I/O端口。

    - **`/proc/kcore`**：系统物理内存的映像。其大小与物理内存完全相同，但实际不会占用太多内存；程序访问时会动态生成。（注意：除非将其复制到其他位置，否则`/proc`下的所有内容都不会占用任何磁盘空间。）

    - **`/proc/kmsg`**：内核输出的消息，这些消息也会被路由到`syslog`。

    - **`/proc/ksyms`**：内核的符号表。

    - **`/proc/loadavg`**：系统的负载平均值；三个指示系统当前工作负载的有意义的指标。

    - **`/proc/meminfo`**：内存使用信息，包括物理内存和交换空间。

    - **`/proc/modules`**：当前加载的内核模块。

    - **`/proc/net`**：网络协议的状态信息。

    - **`/proc/self`**：一个指向正在查看`/proc`的程序的进程目录的符号链接。当两个进程查看`/proc`时，它们会获得不同的链接。这主要是为了方便程序获取自身的进程目录。

    - **`/proc/stat`**：系统的各项统计信息，例如系统启动以来的页错误次数。

    - **`/proc/uptime`**：系统的运行时间。

    - **`/proc/version`**：内核版本。


    > 注意，上述文件通常都是易于阅读的文本文件，但有时其格式可能难以理解。有许多命令的功能就是读取上述文件并将其格式化以便于理解。例如，`free`程序会读取`/proc/meminfo`，将其中以字节为单位的数据转换为千字节（同时还会添加一些额外信息）。


    ## Chapter 4 Using Disks and Other Storage Media

    > 在清晰的磁盘上，你可以永远寻道。


    当你安装或升级系统时，需要在磁盘上完成不少工作。你需要在磁盘上创建文件系统，以便存储文件并为系统的不同部分预留空间。本章将介绍所有这些初始操作。通常，一旦系统设置完成，除非使用软盘，否则你无需再次执行这些操作。如果添加新磁盘或想优化磁盘使用，可以重新查阅本章。


    磁盘管理的基本任务包括：

    - 格式化磁盘。这一步会执行多项准备工作，例如检查坏扇区。（如今大多数硬盘无需进行格式化。）

    - 如果需要将硬盘用于多个互不干扰的任务，可对硬盘进行分区。分区的原因之一是希望在同一个硬盘上安装不同的操作系统；另一个原因是将用户文件与系统文件分离，这样可简化备份操作，同时有助于保护系统文件免受损坏。

    - 在每个磁盘或分区上创建（合适类型的）文件系统。在创建文件系统之前，Linux 无法识别磁盘；创建后，就可以在磁盘上创建和访问文件了。

    - 将不同的文件系统挂载到统一的目录树结构中，可以自动挂载，也可以根据需求手动挂载。（手动挂载的文件系统通常也需要手动卸载。）


    第5章包含有关虚拟内存和磁盘缓存的信息，使用磁盘时也需要了解这些内容。本章介绍了硬盘、软盘、CD-ROM和磁带驱动器相关的必备知识。


    ### 4.1 Two kinds of devices

    UNIX（以及因此而来的Linux）识别两种不同类型的设备：随机访问块设备（如磁盘）和字符设备（如磁带和串行线路），其中部分字符设备是串行的，部分是随机访问的。每个受支持的设备在文件系统中都表示为一个**设备文件**。读写设备文件时，数据会从设备文件对应的设备传入或传出。这样，访问设备无需特殊的程序（也无需特殊的应用程序编程方法，例如捕获中断或轮询串行端口）；例如，要向打印机发送文件，只需执行以下命令：

    ```shell

    $ cat filename > /dev/lp1

    ```

    文件内容就会被打印出来（当然，文件必须是打印机可识别的格式）。但是，由于多个人同时将文件输出到打印机并不是一个好主意，因此通常使用专用程序来发送要打印的文件（通常是**lpr**）。该程序确保同一时间只打印一个文件，并在处理完前一个文件后自动将下一个文件发送到打印机。大多数设备都需要类似的机制。实际上，人们几乎不需要担心设备文件。由于设备在文件系统中以文件形式出现（位于`/dev`目录中），因此使用**ls**或其他合适的命令可以轻松查看存在哪些设备文件。在**ls
    -l**的输出中，第一列包含文件类型和权限。例如，在我的系统上检查串行设备会得到以下输出：

    ```shell

    $ ls -l /dev/cua0

    crw-rw-rw- 1 root uucp 5, 64 Nov 30 1993 /dev/cua0

    ```'
