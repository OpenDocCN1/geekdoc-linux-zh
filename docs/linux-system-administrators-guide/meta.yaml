    # 4.8. FILESYSTEMS


    contents of the new filesystem are the contents of an existing subdirectory in
    some already mounted filesystem.


    For example, figure 4.3 shows three separate filesystems, each with their own
    root directory. When the last two filesystems are mounted below /home and /usr,
    respectively, on the first filesystem, we can get a single directory tree, as
    in figure 4.4.


    ![](img/ceaf8a70f91e44dcbad3d66530d36479_54_0.png)


    Figure 4.3: Three separate filesystems.


