  - '[PAGE 113]


    # ## 11.4 When the clock is wrong


    The Linux software clock is not always accurate. It is kept running by a periodic
    **timer interrupt** generated by PC hardware. If the system has too many processes
    running, it may take too long to service the timer interrupt, and the software
    clock starts slipping behind. The hardware clock runs independently and is usually
    more accurate. If you boot your computer often (as is the case for most systems
    that aren''t servers), it will usually keep fairly accurate time.


    If you need to adjust the hardware clock, it is usually simplest to reboot, go
    into the BIOS setup screen, and do it from there. This avoids all trouble that
    changing system time might cause. If doing it via BIOS is not an option, set the
    new time with `date` and `clock` (in that order), but be prepared to reboot, if
    some part of the'
  - '[PAGE 114]


    # 11.4. WHEN THE CLOCK IS WRONG


    system starts acting funny.


    A networked computer (even if just over the modem) can check its own clock automatically,
    by comparing it to some other computer''s time. If the other computer is known
    to keep very accurate time, then both computers will keep accurate time. This
    can be done by using the rdate and netdate commands. Both check the time of a
    remote computer (netdate can handle several remote computers), and set the local
    computer''s time to that. By running one these commands regularly, your computer
    will keep as accurate time as the remote computer.


    **META:** say something intelligent about NTP'
  - "[PAGE 115]\n\n# Appendix A\n\n# Measuring Holes\n\nThis appendix contains the\
    \ interesting part of the program used to measure the potential for holes in a\
    \ filesystem. The source distribution of the book contains the full source code\
    \ (sag/measure-holes/measure-holes.c).\n\n```\nint process(FILE *f, char *filename)\
    \ {\n    static char *buf = NULL;\n    static long prev_block_size = -1;\n   \
    \ long zeroes;\n    char *p;\n\n    if (buf == NULL || prev_block_size != block_size)\
    \ {\n        free(buf);\n        buf = xmalloc(block_size + 1);\n        buf[block_size]\
    \ = 1;\n        prev_block_size = block_size;\n    }\n    zeroes = 0;\n    while\
    \ (fread(buf, block_size, 1, f) == 1) {\n        for (p = buf; *p == '\\0'; )\n\
    \            ++p;\n        if (p == buf+block_size)\n            zeroes += block_size;\n\
    \    }\n    if (zeroes > 0)\n        printf(\"%ld %s\\n\", zeroes, filename);\n\
    \n    if (ferror(f)) {\n        errormsg(0, -1, \"read failed for '%s'\", filename);\n\
    \        return -1;\n    }\n    return 0;\n}\n```"
