    for the disk I/O to stop, then turn off the power. If there are no running programs,
    this is about equivalent to using shutdown. However, it does not unmount any filesystems
    and this can lead to problems with the ext2fs "clean filesystem" flag. The triple-sync
    method is not recommended.


