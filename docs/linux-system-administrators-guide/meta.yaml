    # 4.7.5 Device files and partitions


    Each partition and extended partition has its own device file. The naming convention
    for these files is that a partition''s number is appended after the name of the
    whole disk, with the convention that 1–4 are primary partitions (regardless of
    how many primary partitions there are) and 5–8 are logical partitions (regardless
    of within which primary partition they reside). For example, `/dev/hda1` is the
    first primary partition on the first IDE hard disk, and `/dev/sdb7` is the third
    extended partition on the second SCSI hard disk. The device list in [Anv] gives
    more information.


    # 4.8 Filesystems


    # 4.8.1 What are filesystems?


    A **filesystem** is the methods and data structures that an operating system uses
    to keep track of files on a disk or partition; that is, the way the files are
    organized on the disk. The word is also used to refer to a partition or disk that
    is used to store the files or the type of the filesystem. Thus, one might say
    ``I have two filesystems'''' meaning one has two partitions on which one stores
    files, or that one is using the ``extended filesystem'''', meaning the type of
    the filesystem.


    The difference between a disk or partition and the filesystem it contains is important.
    A few programs (including, reasonably enough, programs that create filesystems)
    operate directly on the raw sectors of a disk or partition; if there is an existing
    file system there it will be destroyed or seriously corrupted. Most programs operate
    on a filesystem, and therefore won''t work on a partition that doesn''t contain
    one (or that contains one of the wrong type).


    Before a partition or disk can be used as a filesystem, it needs to be initialized,
    and the bookkeeping data structures need to be written to the disk. This process
    is called **making a filesystem**.


    Most UNIX filesystem types have a similar general structure, although the exact'
  - '[PAGE 49]


    # 4.8. FILESYSTEMS


    details vary quite a bit. The central concepts are **superblock**, **inode**,
    **data block**, **directory block**, and **indirection block**. The superblock
    contains information about the filesystem as a whole, such as its size (the exact
    information here depends on the filesystem). An inode contains all information
    about a file, except its name. The name is stored in the directory, together with
    the number of the inode. A directory entry consists of a filename and the number
    of the inode which represents the file. The inode contains the numbers of several
    data blocks, which are used to store the data in the file. There is space only
    for a few data block numbers in the inode, however, and if more are needed, more
    space for pointers to the data blocks is allocated dynamically. These dynamically
    allocated blocks are indirect blocks; the name indicates that in order to find
    the data block, one has to find its number in the indirect block first.


    UNIX filesystems usually allow one to create a **hole** in a file (this is done
    with `lseek`; check the manual page), which means that the filesystem just pretends
    that at a particular place in the file there is just zero bytes, but no actual
    disk sectors are reserved for that place in the file (this means that the file
    will use a bit less disk space). This happens especially often for small binaries,
    Linux shared libraries, some databases, and a few other special cases. (Holes
    are implemented by storing a special value as the address of the data block in
    the indirect block or inode. This special address means that no data block is
    allocated for that part of the file, ergo, there is a hole in the file.)


    Holes are moderately useful. On the author''s system, a simple measurement showed
    a potential for about 4 MB of savings through holes of about 200 MB total used
    disk space. That system, however, contains relatively few programs and no database
    files. The measurement tool is described in appendix A.


    # 4.8.2 Filesystems galore


    Linux supports several types of filesystems. As of this writing the most important
    ones are:


    +   - **minix** The oldest, presumed to be the most reliable, but quite limited
    in features (some time stamps are missing, at most 30 character filenames) and
    restricted in capabilities (at most 64 MB per filesystem).

    - **xia** A modified version of the minix filesystem that lifts the limits on
    the filenames and filesystem sizes, but does not otherwise introduce new features.
    It is not very popular, but is reported to work very well.'
  - '[PAGE 50]


    # 4.8. FILESYSTEMS


    **ext2** The most featureful of the native Linux filesystems, currently also the
    most popular one. It is designed to be easily upwards compatible, so that new
    versions of the filesystem code do not require re-making the existing filesystems.


    **ext** An older version of `ext2` that wasn''t upwards compatible. It is hardly
    ever used in new installations any more, and most people have converted to `ext2`.


    In addition, support for several foreign filesystem exists, to make it easier
    to exchange files with other operating systems. These foreign filesystems work
    just like native ones, except that they may be lacking in some usual UNIX features,
    or have curious limitations, or other oddities.


    **msdos** Compatibility with MS-DOS (and OS/2 and Windows NT) FAT filesystems.


    **umsdos** Extends the `msdos` filesystem driver under Linux to get long filenames,
    owners, permissions, links, and device files. This allows a normal `msdos` filesystem
    to be used as if it were a Linux one, thus removing the need for a separate partition
    for Linux.


    **iso9660** The standard CD-ROM filesystem; the popular Rock Ridge extension to
    the CD-ROM standard that allows longer file names is supported automatically.


    **nfs** A networked filesystem that allows sharing a filesystem between many computers
    to allow easy access to the files from all of them.


    **hpfs** The OS/2 filesystem.


    **sysv** SystemV/386, Coherent, and Xenix filesystems.


    The choice of filesystem to use depends on the situation. If compatibility or
    other reasons make one of the non-native filesystems necessary, then that one
    must be used. If one can choose freely, then it is probably wisest to use `ext2`,
    since it has all the features but does not suffer from lack of performance.


    There is also the `proc` filesystem, usually accessible as the `/proc` directory,
    which is not really a filesystem at all, even though it looks like one. The `proc`
    filesystem makes it easy to access certain kernel data structures, such as the
    process list (hence'
