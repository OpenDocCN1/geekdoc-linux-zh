    # Chapter 7


    # init


    *Uuno on numero yks*


    This chapter describes the `init` process, which is the first user level process
    started by the kernel. `init` has many important duties, such as starting `getty`
    (so that users can log in), implementing run levels, and taking care of orphaned
    processes. This chapter explains how `init` is configured and how you can make
    use of the different run levels.


    # 7.1 init comes first


    `init` is one of those programs that are absolutely essential to the operation
    of a Linux system, but that you still can mostly ignore. A good Linux distribution
    will come with a configuration for `init` that will work for most systems, and
    on these systems there is nothing you need to do about `init`. Usually, you only
    need to worry about `init` if you hook up serial terminals, dial-in (not dial-out)
    modems, or if you want to change the default run level.


    When the kernel has started itself (has been loaded into memory, has started running,
    and has initialized all device drivers and data structures and such), it finishes
    its own part of the boot process by starting a user level program, `init`. Thus,
    `init` is always the first process (its process number is always 1).


    The kernel looks for `init` in a few locations that have been historically used
    for it, but the proper location for it (on a Linux system) is `/sbin/init`. If
    the kernel can''t find `init`, it tries to run `/bin/sh`, and if that also fails,
    the startup of the system'
- md: 'fails. When `init` starts, it finishes the boot process by doing a number of
    administrative tasks, such as checking filesystems, cleaning up `/tmp`, starting
    various services, and starting a `getty` for each terminal and virtual console
    where users should be able to log in (see chapter 8). After the system is properly
    up, `init` restarts `getty` for each terminal after a user has logged out (so
    that the next user can log in). `init` also adopts orphan processes: when a process
    starts a child process and dies before its child, the child immediately becomes
    a child of `init`. This is important for various technical reasons, but it is
    good to know it, since it makes it easier to understand process lists and process
    tree graphs.¹


    > ¹ `init` itself is not allowed to die. You can''t kill `init` even with SIGKILL.


    There are a few variants of `init` available. Most Linux distributions use `sysvinit`
    (written by Miquel van Smoorenburg), which is based on the System V `init` design.
    The BSD versions of Unix have a different `init`. The primary difference is run
    levels: System V has them, BSD does not (at least traditionally). This difference
    is not essential. We''ll look at `sysvinit` only.


    ## 7.2 Configuring init to start getty: the /etc/inittab file


    When it starts up, `init` reads the `/etc/inittab` configuration file. While the
    system is running, it will re-read it, if sent the HUP signal;² this feature makes
    it unnecessary to boot the system to make changes to the `init` configuration
    take effect.


    > ² Using the command `kill -HUP 1` as root, for example


    The `/etc/inittab` file is a bit complicated. We''ll start with the simple case
    of configuring `getty` lines. Lines in `/etc/inittab` consist of four colon-delimited
    fields:

    ```

    id:runlevels:action:process

    ```

    The fields are described below. In addition, `/etc/inittab` can contain empty
    lines, and lines that begin with a number sign (''#''); these are both ignored.


    | Field | Description |

    |-------|-------------|

    | id | This identifies the line in the file. For getty lines, it specifies the
    terminal it runs on (the characters after /dev/tty in the device file name). For
    other lines, it doesn''t matter (except for length restrictions), but it should
    be unique. |

    | runlevels | The run levels the line should be considered for. The run levels
    are given as single digits, without delimiters. (Run levels are described in the
    next section.) |

    | action | What action should be taken by the line, e.g., **respawn** to run the
    command in the next field again, when it exits, or **once** to run it just once.
    |

    | process | The command to run. |


    To start a **getty** on the first virtual terminal (**/dev/tty1**), in all the
    normal multi-user run levels (2–5), one would write the following line:

    ```

    1:2345:respawn:/sbin/getty 9600 tty1

    ```

    The first field says that this is the line for **/dev/tty1**. The second field
    says that it applies to run levels 2, 3, 4, and 5. The third field means that
    the command should be run again, after it exits (so that one can log in, log out,
    and then log in again). The last field is the command that runs **getty** on the
    first virtual terminal.³


    > ³ Different versions of **getty** are run differently. Consult your manual page—and
    make sure it is the correct manual page.


    If you wanted to add terminals or dial-in modem lines to a system, you’d add more
    lines to **/etc/inittab**, one for each terminal or dial-in line. For more details,
    see the manual pages *init*(8), *inittab*(5), and *getty*(8).


    If a command fails when it starts, and **init** is configured to **restart** it,
    it will use a lot of system resources: **init** starts it, it fails, **init**
    starts it, it fails, **init** starts it, it fails, and so on, ad infinitum. To
    prevent this, **init** will keep track of how often it restarts a command, and
    if the frequency grows too high, it will delay for five minutes before restarting
    again.


    ## 7.3 Run levels


    A **run level** is a state of **init** and the whole system that defines what
    system services are operating. Run levels are identified by numbers, see table
    7.1. There is no consensus of how to use the user defined run levels (2 through
    5). Some system administrators use run levels to define which subsystems are working,
    e.g., whether X is running, whether the network is operational, and so on. Others
    have all subsystems always running or start and stop them individually, without
    changing run levels, since run levels are too coarse for controlling their systems.


    Table 7.1: Run level numbers

    | Run level | Description |

    |-----------|-------------|

    | 0 | Halt the system. |

    | 1 | Single-user mode (for special administration). |

    | 2-5 | Normal operation (user defined). |

    | 6 | Reboot. |


    Run levels are configured in /etc/inittab by lines like the following:

    ```

    12:2:wait:/etc/init.d/rc 2

    ```

    The first field is an arbitrary label, the second one means that this applies
    for run level 2. The third field means that init should run the command in the
    fourth field once, when the run level is entered, and that init should wait for
    it to complete. The /etc/init.d/rc command runs whatever commands are necessary
    to start and stop services to enter run level 2. The command in the fourth field
    does all the hard work of setting up a run level. It starts services that aren''t
    already running, and stops services that shouldn''t be running in the new run
    level any more. Exactly what the command is, and how run levels are configured,
    depends on the Linux distribution.


    When init starts, it looks for a line in /etc/inittab that specifies the default
    run level:

    ```

    id:2:initdefault:

    ```

    You can ask init to go to a non-default run level at startup by giving the kernel
    a command line argument of single or emergency.⁴ This allows you to choose the
    single user mode (run level 1), which is described in section 7.5.


    > ⁴ Kernel command line arguments can be given via LILO, for example. See section
    7.5.


    While the system is running, the telinit command can change the run level. When
    the run level is changed, init runs the relevant command from /etc/inittab.


    ## 7.4 Special configuration in /etc/inittab


    The /etc/inittab has some special features that allow init to react to special
    circumstances. These special features are marked by special keywords in the third
    field. Some examples:


    - **powerwait** Allows **init** to shut the system down, when the power fails.
    This assumes the use of a UPS, and software that watches the UPS and informs **init**
    that the power is off.

    - **ctrlaltdel** Allows **init** to reboot the system, when the user presses `control-alt-del`
    on the console keyboard. Note that the system administrator can configure the
    reaction to `C-A-D` to be something else instead, e.g., to be ignored, if the
    system is in a public location.⁵


    > ^5 Or to start `nethack`.


    - **sysinit** Command to be run when the system is booted. This command usually
    cleans up `/tmp`, for example.


    The list above is not exhaustive. See your *inittab*(5) manual page for all possibilities,
    and for details on how to use the above ones.


    ## 7.5 Booting in single user mode


    An important run level is **single user mode** (run level 1), in which only the
    system administrator is using the machine and as few system services—including
    logins—as possible are running. Single user mode is necessary for a few administrative
