    # ## 4.2 Hard disks


    The first character in the first column, i.e., ''c'' in `crw-rw-rw-` above, tells
    an informed user the type of the file, in this case a character device. For ordinary
    files, the first character is ''-'', for directories it is ''d'', and for block
    devices ''b''; see the `ls` man page for further information.


    Note that usually all device files exist even though the device itself might be
    not be installed. So just because you have a file `/dev/sda`, it doesn''t mean
    that you really do have an SCSI hard disk. Having all the device files makes the
    installation programs simpler, and makes it easier to add new hardware (there
    is no need to find out the correct parameters for and create the device files
    for the new device).


    This subsection introduces terminology related to hard disks. If you already know
    the terms and concepts, you can skip this subsection.


    See figure 4.1 for a schematic picture of the important parts in a hard disk.
    A hard disk consists of one or more circular **platters**,¹ of which either or
    both **surfaces** are coated with a magnetic substance used for recording the
    data. For each surface, there is a **read-write head** that examines or alters
    the recorded data. The platters rotate on a common axis; a typical rotation speed
    is 3600 rotations per minute, although high-performance hard disks have higher
    speeds. The heads move along the radius of the platters; this movement combined
    with the rotation of the platters allows the head to access all parts of the surfaces.


    The processor (CPU) and the actual disk communicate through a **disk controller**.
    This relieves the rest of the computer from knowing how to use the drive, since
    the controllers for different types of disks can be made to use the same interface
    towards the rest of the computer. Therefore, the computer can say just "hey disk,
    gimme what I want", instead of a long and complex series of electric signals to
    move the head to the proper location and waiting for the correct position to come
    under the head and doing all the other unpleasant stuff necessary. (In reality,
    the interface to the controller is still complex, but much less so than it would
    otherwise be.) The controller can also do some other stuff, such as caching, or
    automatic bad sector replacement.


    The above is usually all one needs to understand about the hardware. There is
    also a bunch of other stuff, such as the motor that rotates the platters and moves
    the heads, and the electronics that control the operation of the mechanical parts,
    but that is mostly not relevant for understanding the working principle of a hard
    disk.


    > ¹The platters are made of a hard substance, e.g., aluminium, which gives the
    hard disk its name.'
  - '[PAGE 37]


    # 4.2. HARD DISKS


    The surfaces are usually divided into concentric rings, called **tracks**, and
    these in turn are divided into **sectors**. This division is used to specify locations
    on the hard disk and to allocate disk space to files. To find a given place on
    the hard disk, one might say “surface 3, track 5, sector 7”. Usually the number
    of sectors is the same for all tracks, but some hard disks put more sectors in
    outer tracks (all sectors are of the same physical size, so more of them fit in
    the longer outer tracks). Typically, a sector will hold 512 bytes of data. The
    disk itself can’t handle smaller amounts of data than one sector.


    ![](img/ceaf8a70f91e44dcbad3d66530d36479_37_0.png)


    Figure 4.1: A schematic picture of a hard disk.


    Each surface is divided into tracks (and sectors) in the same way. This means
    that when the head for one surface is on a track, the heads for the other surfaces
    are also on the corresponding tracks. All the corresponding tracks taken together
    are called a **cylinder**. It takes time to move the heads from one track (cylinder)
    to another, so by placing the data that is often accessed together (say, a file)
    so that it is within one cylinder, it is not necessary to move the heads to read
    all of it. This improves performance. It is not always possible to place files
    like this; files that are stored in several places on the disk are called **fragmented**.


    The number of surfaces (or heads, which is the same thing), cylinders, and sectors
    vary a lot; the specification of the number of each is called the **geometry**
    of a hard'
  - '[PAGE 38]


    disk. The geometry is usually stored in a special, battery-powered memory location
    called the **CMOS RAM**, from where the operating system can fetch it during bootup
    or driver initialization.


    Unfortunately, the BIOS² has a design limitation, which makes it impossible to
    specify a track number that is larger than 1024 in the CMOS RAM, which is too
    little for a large hard disk. To overcome this, the hard disk controller lies
    about the geometry, and **translates the addresses** given by the computer into
    something that fits reality. For example, a hard disk might have 8 heads, 2048
    tracks, and 35 sectors per track³. Its controller could lie to the computer and
    claim that it has 16 heads, 1024 tracks, and 35 sectors per track, thus not exceeding
    the limit on tracks, and translates the address that the computer gives it by
    halving the head number, and doubling the track number. The math can be more complicated
    in reality, because the numbers are not as nice as here (but again, the details
    are not relevant for understanding the principle). This translation distorts the
    operating system''s view of how the disk is organized, thus making it impractical
    to use the all-data-on-one-cylinder trick to boost performance.


    The translation is only a problem for IDE disks. SCSI disks use a sequential sector
    number (i.e., the controller translates a sequential sector number to a head,
    cylinder, and sector triplet), and a completely different method for the CPU to
    talk with the controller, so they are insulated from the problem. Note, however,
    that the computer might not know the real geometry of an SCSI disk either.


    Since Linux often will not know the real geometry of a disk, its filesystems don''t
    even try to keep files within a single cylinder. Instead, it tries to assign sequentially
    numbered sectors to files, which almost always gives similar performance. The
    issue is further complicated by on-controller caches, and automatic prefetches
    done by the controller.


    Each hard disk is represented by a separate device file. There can (usually) be
    only two or four IDE hard disks. These are known as `/dev/hda`, `/dev/hdb`, `/dev/hdc`,
    and `/dev/hdd`, respectively. SCSI hard disks are known as `/dev/sda`, `/dev/sdb`,
    and so on. Similar naming conventions exist for other hard disk types; see *[Anv]*
    for more information. Note that the device files for the hard disks give access
    to the entire disk, with no regard to partitions (which will be discussed below),
    and it''s easy to mess up the partitions or the data in them if you aren''t careful.
    The disks'' device files are usually used only to get access to the master boot
    record (which will also be


    ²The BIOS is some built-in software stored on ROM chips. It takes care, among
    other things, of the initial stages of booting.


    ³The numbers are completely imaginary.'
  - '[PAGE 39]


    discussed below).


    # 4.3 Floppies


    A floppy disk consists of a flexible membrane covered on one or both sides with
    similar magnetic substance as a hard disk. The floppy disk itself doesn''t have
    a read-write head, that is included in the drive. A floppy corresponds to one
    platter in a hard disk, but is removable and one drive can be used to access different
    floppies, whereas the hard disk is one indivisible unit.


    Like a hard disk, a floppy is divided into tracks and sectors (and the two corresponding
    tracks on either side of a floppy form a cylinder), but there are many fewer of
    them than on a hard disk.


    A floppy drive can usually use several different types of disks; for example,
    a $3\frac{1}{2}$ inch drive can use both 720 kB and 1.44 MB disks. Since the drive
    has to operate a bit differently and the operating system must know how big the
    disk is, there are many device files for floppy drives, one per combination of
    drive and disk type. Therefore, `/dev/fd0H1440` is the first floppy drive (`fd0`),
    which must be a $3\frac{1}{2}$ inch drive, using a $3\frac{1}{2}$ inch, high density
    disk (`H`) of size 1440 kB (`1440`), i.e., a normal $3\frac{1}{2}$ inch HD floppy.
    For more information on the naming conventions for the floppy devices, see [Anv].


    The names for floppy drives are complex, however, and Linux therefore has a special
    floppy device type that automatically detects the type of the disk in the drive.
    It works by trying to read the first sector of a newly inserted floppy using different
    floppy types until it finds the correct one. This naturally requires that the
    floppy is formatted first. The automatic devices are called `/dev/fd0`, `/dev/fd1`,
    and so on.


    The parameters the automatic device uses to access a disk can also be set using
    the program `setfdprm`. This can be useful if you need to use disks that do not
    follow any usual floppy sizes, e.g., if they have an unwusual number of sectors,
    or if the autodetecting for some reason fails and the proper device file is missing.


    Linux can handle many nonstandard floppy disk formats in addition to all the standard
    ones. Some of these require using special formatting programs. We''ll skip these
    disk types for now, but in the mean time you can examine the `/etc/fdprm` file.
    It specifies the settings that `setfdprm` recognizes.


    The operating system must know when a disk has been changed in a floppy drive,
    for example, in order to avoid using cached data from the previous disk. Unfortunately,
    the signal line that is used for this is sometimes broken, and worse, this won''t'
- md: 'always be noticeable when using the drive from within MS-DOS. If you are experiencing
    weird problems using floppies, this might be the reason. The only way to correct
    it is to repair the floppy drive.


    ### 4.4 CD-ROM Drives

    A CD-ROM drive uses an optically read, plastic coated disk. The information is
    recorded on the surface of the disk in small ''holes'' aligned along a spiral
    from the center to the edge.^4 The drive directs a laser beam along the spiral
    to read the disk. When the laser hits a hole, the laser is reflected in one way;
    when it hits smooth surface, it is reflected in another way. This makes it easy
    to code bits, and therefore information. The rest is easy, mere mechanics.


    ^4 That is, the surface inside the disk, on the metal disk inside the plastic
    coating.


    CD-ROM drives are slow compared to hard disks. Whereas a typical hard disk will
    have an average seek time less than 15 milliseconds, a fast CD-ROM drive can use
    tenths of a second for seeks. The actual data transfer rate is fairly high at
    hundreds of kilobytes per second. The slowness means that CD-ROM drives are not
    as pleasant to use instead of hard disks (some Linux distributions provide ''live''
    filesystems on CD-ROM''s, making it unnecessary to copy the files to the hard
    disk, making installation easier and saving a lot of hard disk space), although
    it is still possible. For installing new software, CD-ROM''s are very good, since
    its maximum speed is not essential during installation.


    There are several ways to arrange data on a CD-ROM. The most popular one is specified
    by the international standard ISO 9660. This standard specifies a very minimal
    filesystem, which is even more crude than the one MS-DOS uses. On the other hand,
    it is so minimal that every operating system should be able to map it to its native
    system. For normal UNIX use, the ISO 9660 filesystem is not usable, so an extension
    to the standard has been developed, called the Rock Ridge extension. Rock Ridge
    allows longer filenames, symbolic links, and a lot of other goodies, making a
    CD-ROM look more or less like any contemporary UNIX filesystem. Even better, a
    Rock Ridge filesystem is still a valid ISO 9660 filesystem, making it usable by
    non-UNIX systems as well. Linux supports both ISO 9660 and the Rock Ridge extensions;
    the extensions are recognized and used automatically.


    The filesystem is only half the battle, however. Most CD-ROM''s contain data that
    requires a special program to access, and most of these programs do not run under
    Linux (except, possibly, under dosemu, the Linux MS-DOS emulator). A CD-ROM drive
    is accessed via the corresponding device file. There are several ways to connect
    a CD-ROM drive to the computer: via SCSI, via a sound card, or via EIDE. The hardware
    hacking needed to do this is outside the scope of this book, but the type of connection
    decides the device file. See [Anv] for enlightenment.


    ### 4.5 Tapes

    A tape drive uses a tape, similar to cassettes used for music.^5 A tape is serial
    in nature, which means that in order to get to any given part of it, you first
    have to go through all the parts in between. A disk can be accessed randomly,
    i.e., you can jump directly to any place on the disk. The serial access of tapes
    makes them slow. On the other hand, tapes are relatively cheap to make, since
    they do not need to be fast. They can also easily be made quite long, and can
    therefore contain a large amount of data. This makes tapes very suitable for things
    like archiving and backups, which do not require large speeds, but benefit from
    low costs and large storage capacities.


    ^5 But completely different, of course.


    ### 4.6 Formatting

    Formatting is the process of writing marks on the magnetic media that are used
    to mark tracks and sectors. Before a disk is formatted, its magnetic surface is
    a complete mess of magnetic signals. When it is formatted, some order is brought
    into the chaos by essentially drawing lines where the tracks go, and where they
    are divided into sectors. The actual details are not quite exactly like this,
    but that is irrelevant. What is important is that a disk cannot be used unless
    it has been formatted. The terminology is a bit confusing here: in MS-DOS, the
    word formatting is used to cover also the process of creating a filesystem (which
    will be discussed below). There, the two processes are often combined, especially
    for floppies. When the distinction needs to be made, the real formatting is called
    **low-level formatting**, while making the filesystem is called **high-level formatting**.
    In UNIX circles, the two are called formatting and making a filesystem, so that''s
    what is used in this book as well. For IDE and some SCSI disks the formatting
    is actually done at the factory and doesn''t need to be repeated; hence most people
    rarely need to worry about it. In fact, formatting a hard disk can cause it to
    work less well, for example because a disk might need to be formatted in some
    very special way to allow automatic bad sector replacement to work. Disks that
    need to be or can be formatted often require a special program anyway, because
    the interface to the formatting logic inside the drive is different from drive
    to drive. The formatting program is often either on the controller BIOS, or is
    supplied as an MS-DOS program; neither of these can easily be used from within
    Linux. During formatting one might encounter bad spots on the disk, called **bad
    blocks** or **bad sectors**. These are sometimes handled by the drive itself,
    but even then, if more of them develop, something needs to be done to avoid using
    those parts of the disk. The logic to do this is built into the filesystem; how
    to add the information into the filesystem is described below. Alternatively,
    one might create a small partition that covers just the bad part of the disk;
    this approach might be a good idea if the bad spot is very large, since filesystems
    can sometimes have trouble with very large bad areas.


    Floppies are formatted with `fdformat`. The floppy device file to use is given
    as the parameter. For example, the following command would format a high density,
    3½ inch floppy in the first floppy drive:

    ``` $ fdformat /dev/fd0H1440

    Double-sided, 80 tracks, 18 sec/track.

    Total capacity 1440 kB.

    Formatting ... done

    Verifying ... done

    $ ```


    Note that if you want to use an autodetecting device (e.g., /dev/fd0), you *must*
    set the parameters of the device with `setfdprm` first. To achieve the same effect
    as above, one would have to do the following:

    ``` $ setfdprm /dev/fd0 1440/1440

    $ fdformat /dev/fd0

    Double-sided, 80 tracks, 18 sec/track.

    Total capacity 1440 kB.

    Formatting ... done

    Verifying ... done

    $ ```


    It is usually more convenient to choose the correct device file that matches the
    type of the floppy. Note that it is unwise to format floppies to contain more
    information than what they are designed for.


    fdformat will also validate the floppy, i.e., check it for bad blocks. It will
    try a bad block several times (you can usually hear this, the drive noise changes
    dramatically). If the floppy is only marginally bad (due to dirt on the read/write
    head, some errors are false signals), `fdformat` won''t complain, but a real error
    will abort the validation process. The kernel will print log messages for each
    I/O error it finds; these will go to the console or, if `syslog` is being used,
    to the file `/usr/adm/messages`. `fdformat` itself won''t tell where the error
    is (one usually doesn''t care, floppies are cheap enough that a bad one is automatically
    thrown away).

    ``` $ fdformat /dev/fd0H1440

    Double-sided, 80 tracks, 18 sec/track.

    Total capacity 1440 kB.

    Formatting ... done

    Verifying ... read: Unknown error

    $ ```


    The `badblocks` command can be used to search any disk or partition for bad blocks
    (including a floppy). It does not format the disk, so it can be used to check
    even existing filesystems. The example below checks a 3½ inch floppy with two
    bad blocks.

    ``` $ badblocks /dev/fd0H1440 1440 718 719

    $ ```


    `badblocks` outputs the block numbers of the bad blocks it finds. Most filesystems
    can avoid such bad blocks. They maintain a list of known bad blocks, which is
    initialized when the filesystem is made, and can be modified later. The initial
    search for bad blocks can be done by the `mkfs` command (which initializes the
    filesystem), but later checks should be done with `badblocks` and the new blocks
    should be added with `fsck`. We''ll describe `mkfs` and `fsck` later. Many modern
    disks automatically notice bad blocks, and attempt to fix them by using a special,
    reserved good block instead. This is invisible to the operating system. This feature
    should be documented in the disk''s manual, if you''re curious if it is happening.
    Even such disks can fail, if the number of bad blocks grows too large, although
    chances are that by then the disk will be so rotten as to be unusable.'
  mdcn: '

    在 MS-DOS 下使用该驱动器时，这个问题会非常明显。如果你在使用软盘时遇到奇怪的故障，很可能就是这个原因导致的。修复该问题的唯一方法是检修软盘驱动器。

    ### 4.4 CD-ROM 驱动器

    CD-ROM 驱动器使用的是可通过光学方式读取的、涂有塑料层的圆盘。信息以沿从盘心到盘缘的螺旋线排列的微小“凹坑”的形式记录在盘片表面。^4 驱动器会沿着螺旋线发射激光束来读取盘片。激光照射到凹坑时反射方式与照射到光滑表面时的反射方式不同，由此可以轻松对比特乃至信息进行编码，其余部分只是简单的机械结构而已。

    ^4 即盘片内部、塑料涂层下的金属盘片表面。

    和硬盘相比，CD-ROM 驱动器速度较慢。普通硬盘的平均寻道时间不足15毫秒，而高速 CD-ROM 驱动器的寻道时间可达十分之一秒。其实际数据传输率倒是不低，能达到数百KB每秒。速度较慢意味着用
    CD-ROM 替代硬盘的体验没那么好（部分 Linux 发行版提供了 CD-ROM 上的“ live ”文件系统，无需将文件复制到硬盘即可安装，既简化了安装流程又节省了大量硬盘空间），但这种方式依然可行。

    对于安装新软件来说，CD-ROM 非常适用，因为安装过程中并不要求其达到最高速度。


    CD-ROM 上的数据有多种组织方式，其中最主流的一种由国际标准 ISO 9660 规定。该标准定义的是一种极简文件系统，甚至比 MS-DOS 使用的文件系统还要简陋。但正因它足够极简，所有操作系统都应该能将其映射到自身的原生系统上。

    对于常规的 UNIX 使用场景来说，ISO 9660 文件系统并不适用，因此人们开发了名为 Rock Ridge 扩展的标准扩展。Rock Ridge 支持更长的文件名、符号链接以及大量其他实用特性，能让
    CD-ROM 看起来和当代的 UNIX 文件系统几乎没有区别。

    更棒的是，Rock Ridge 文件系统依然符合 ISO 9660 文件系统规范，因此非 UNIX 系统也能使用。Linux 同时支持 ISO 9660 标准和
    Rock Ridge 扩展，这些扩展会被自动识别并启用。


    不过文件系统的问题只是其中一半。大多数 CD-ROM 中的数据都需要借助专用程序才能访问，而这些程序大多无法在 Linux 下运行（只有个例外，那就是在 Linux
    的 MS-DOS 模拟器 dosemu 下可能可以运行）。CD-ROM 驱动器通过对应的设备文件访问，连接到计算机的方式有几种：SCSI、声卡或 EIDE。这些连接的硬件操作超出了本书的讨论范围，但连接方式决定了对应的设备文件。更多内容可参考[Anv]。

    ### 4.5 磁带驱动器

    磁带驱动器使用的磁带和音乐磁带类似。^5 磁带本质上是串行存储介质，这意味着要访问磁带上的任意位置，必须先经过它前面的所有内容。而硬盘是随机访问的，也就是说你可以直接跳转到硬盘上的任意位置。串行访问的特性导致磁带速度很慢。但另一方面，磁带的生产成本相对较低，因为它不需要高速度。磁带也很容易做到很长，因此可以存储大量数据。这使得磁带非常适用于归档、备份这类对速度要求不高，但追求低成本和大容量的场景。

    ^5 当然，二者完全是不同的东西。

    ### 4.6 格式化

    格式化是指向存储介质写入标记、划分磁道和扇区的过程。磁盘格式化前，其磁性表面充满了杂乱的磁信号。格式化过程相当于在混乱中画出磁道的走向以及扇区的划分边界，让原本无序的磁表面变得有序。实际的细节和这个过程并不完全一致，但这并不重要。重要的是，磁盘只有完成格式化后才能使用。

    这里的术语有点容易混淆：在 MS-DOS 中，“格式化”这个词也涵盖创建文件系统的过程（下文会讨论）。在 MS-DOS 里，这两个过程通常是合并执行的，尤其是对软盘而言。如果需要明确区分，真正的格式化过程被称为**低级格式化**，而创建文件系统的过程被称为**高级格式化**。

    在 UNIX 领域，这两个过程分别被称为格式化和创建文件系统，本书也采用这种叫法。IDE 和部分 SCSI 硬盘的格式化工作实际上是在工厂完成的，无需重复执行，因此大多数人很少需要操心这个问题。

    实际上，格式化硬盘可能导致其运行效果下降，比如某些硬盘需要按照非常特殊的方式格式化，才能启用自动坏扇区替换功能。需要或可以进行格式化的硬盘通常都需要借助专用程序，因为不同硬盘内置的格式化逻辑接口并不相同。格式化程序通常存放在控制器
    BIOS 中，或是作为 MS-DOS 程序提供，这两种程序都不容易在 Linux 下使用。

    格式化过程中可能会遇到磁盘上的损坏区域，被称为**坏块**或**坏扇区**。部分硬盘会自行处理这些问题，但即便如此，如果坏块数量持续增加，还是需要采取措施避免使用这些磁盘区域。处理这类问题的逻辑内嵌在文件系统中，如何将这些信息添加到文件系统中会在下文说明。

    另一种方案是创建一个仅覆盖磁盘损坏区域的小分区，如果损坏区域面积很大，这个方法会很实用，因为文件系统有时很难处理大面积的坏块区域。


    软盘可以通过`fdformat`命令格式化，使用时需要把对应的软盘设备文件作为参数传入。例如，下面的命令可以对第一个软盘驱动器中的高密度3.5英寸软盘进行格式化：

    ``` $ fdformat /dev/fd0H1440 Double-sided, 80 tracks, 18 sec/track. Total capacity
    1440 kB. Formatting ... done Verifying ... done $ ```

    注意如果你想使用自动检测设备（例如`/dev/fd0`），*必须*先使用`setfdprm`命令设置该设备的参数。要实现和上文相同的效果，需要执行以下操作：

    ``` $ setfdprm /dev/fd0 1440/1440 $ fdformat /dev/fd0 Double-sided, 80 tracks,
    18 sec/track. Total capacity 1440 kB. Formatting ... done Verifying ... done $
    ```

    通常来说，选择与软盘类型匹配的正确设备文件会更方便。注意将软盘格式化为超过其设计容量的容量是不明智的。

    `fdformat`还会验证软盘，即检查软盘是否存在坏块。遇到坏块时，它会多次尝试读取（你通常能听到相关声音，驱动器的噪音会发生明显变化）。如果软盘只是轻微损坏（比如磁头脏污导致的部分错误是假信号），`fdformat`不会报错，但遇到真实错误会终止验证流程。

    内核会为每个发现的 I/O 错误打印日志信息，这些信息会输出到控制台，如果使用了`syslog`，则会输出到`/usr/adm/messages`文件中。`fdformat`本身不会指出错误位置（通常大家也不关心，软盘很便宜，损坏了直接丢弃即可）。

    ``` $ fdformat /dev/fd0H1440 Double-sided, 80 tracks, 18 sec/track. Total capacity
    1440 kB. Formatting ... done Verifying ... read: Unknown error $ ```

    `badblocks`命令可用于扫描任意磁盘或分区上的坏块（包括软盘）。它不会格式化磁盘，因此甚至可以用于检查已有文件系统。下面的示例演示了如何扫描一张存在两个坏块的3.5英寸软盘：

    ``` $ badblocks /dev/fd0H1440 1440 718 719 $ ```

    `badblocks`会输出它找到的坏块编号。大多数文件系统都可以规避这类坏块，它们会维护一份已知坏块的列表，该列表会在创建文件系统时初始化，之后也可以修改。初始的坏块扫描可以通过`mkfs`命令（用于初始化文件系统）完成，但后续检查应该用`badblocks`完成，新发现的坏块需要通过`fsck`添加到列表中。我们会在后文介绍`mkfs`和`fsck`命令。

    许多现代硬盘会自动检测坏块，并通过调用预留的完好块替代坏块来尝试修复，这个过程对操作系统不可见。如果你好奇自己的硬盘是否有这个功能，可以查看硬盘的说明书。即便这类硬盘，如果坏块数量增长过多也会失效，不过大概率到那时硬盘已经老化到无法使用了。

    '
