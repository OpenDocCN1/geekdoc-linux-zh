    # ## Backups


    > > Hardware is indeterministically reliable.

    > Software is deterministically unreliable.

    > People are indeterministically unreliable.

    > Nature is deterministically reliable.


    This chapter explains about why, how, and when to make backups, and how to restore
    things from backups.


    # ### 10.1 On the importance of being backed up


    Your data is valuable. It will cost you time and effort re-create it, and that
    costs money or at least personal grief and tears; sometimes it can’t even be re-created,
    e.g., if it is the results of some experiments. Since it is an investment, you
    should protect it and take steps to avoid losing it.


    There are basically four reasons why you might lose data: hardware failures, software
    bugs, human action, or natural disasters.¹ Although modern hardware tends to be
    quite reliable, it can still break seemingly spontaneously. The most critical
    piece of hardware for storing data is the hard disk, which relies on tiny magnetic
    fields remaining intact in a world filled with electromagnetic noise. Modern software
    doesn’t even tend to be reliable; a rock solid program is an exception, not a
    rule. Humans are quite unreliable, they will either make a mistake, or they will
    be malicious and destroy data on purpose. Nature might not be evil, but it can
    wreak havoc even when


    > ¹The fifth reason is “something else”.'
