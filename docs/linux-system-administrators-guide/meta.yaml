    or hard disk. The bootstrap loader is contained within this sector. It loads the
    operating system from elsewhere on the disk (or from some other place).


    After Linux has been loaded, it initializes the hardware and device drivers, and
    then runs `init`. `init` starts other processes to allow users to log in, and
    do things. The details of this part will be discussed below.


    In order to shut down a Linux system, first all processes are told to terminate
    (this makes them close any files and do other necessary things to keep things
    tidy), then filesystems and swap areas are unmounted, and finally a message is
    printed to the console that the power can be turned off. If the proper procedure
    is not followed, terrible things can and will happen; most importantly, the filesystem
    buffer cache might not be flushed, which means that all data in it is lost and
    the filesystem on disk is inconsistent, and therefore possibly unusable.


