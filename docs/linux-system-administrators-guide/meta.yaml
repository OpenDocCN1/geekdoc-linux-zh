    A swap partition is also not special in any way. You create it just like any other
    partition; the only difference is that it is used as a raw partition, that is,
    it will not contain any filesystem at all. It is a good idea to mark swap partitions
    as type 82 (Linux swap); this will the make partition listings clearer, even though
    it is not strictly necessary to the kernel.


