    # 6.3 More about shutdowns


    It is important to follow the correct procedures when you shut down a Linux system.

    If you fail do so, your filesystems probably will become trashed and the files
    probably

    will become scrambled. This is because Linux has a disk cache that won''t write
    things

    to disk at once, but only at intervals. This greatly improves performance but
    also

    means that if you just turn off the power at a whim the cache may hold a lot of
    data

    and that what is on the disk may not be a fully working filesystem (because only

    some things have been written to the disk).


    Another reason against just flipping the power switch is that in a multi-tasking

    system there can be lots of things going on in the background, and shutting the
    power

    can be quite disastrous. By using the proper shutdown sequence, you ensure that
    all

    background processes can save their data.


    The command for properly shutting down a Linux system is shutdown. It is usually

    used in one of two ways.


    If you are running a system where you are the only user, the usual way of using

    shutdown is to quit all running programs, log out on all virtual consoles, log
    in as root

    on one of them (or stay logged in as root if you already are, but you should change

    to the root directory, to avoid problems with unmounting), then give the command

    shutdown -h now (substitute now with a plus sign and a number in minutes if you

    want a delay, though you usually don''t on a single user system).


    Alternatively, if your system has many users, use the command shutdown -h +time

    message, where time is the time in minutes until the system is halted, and message

    is a short explanation of why the system is shutting down.


