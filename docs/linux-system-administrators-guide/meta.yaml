    4.8.5 and the *mount* manual page for more information.


    +   - `/etc/group` Similar to `/etc/passwd`, but describes groups instead of users.
    See the *group* manual page for more information.


    +   - `/etc/inittab` Configuration file for `init`.


    +   - `/etc/issue` Output by `getty` before the login prompt. Usually contains
    a short description or welcoming message to the system. The contents are up to
    the system administrator.


    +   - `/etc/magic` The configuration file for `file`. Contains the descriptions
    of various file formats based on which `file` guesses the type of the file. See
    the *magic* and *file* manual pages for more information.'
