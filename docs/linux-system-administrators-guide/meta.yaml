    multitasking by switching the active process on the processor.


    At the lowest level, the kernel contains a hardware device driver for each kind
    of hardware it supports. Since the world is full of different kinds of hardware,
    the number of hardware device drivers is large. There are often many otherwise
    similar pieces of hardware that differ in how they are controlled by software.
    The similarities make it possible to have general classes of drivers that support
    similar operations; each member of the class has the same interface to the rest
    of the kernel but differs in what it needs to do to implement them. For example,
    all disk drivers look alike to the rest of the kernel, i.e., they all have operations
    like ''initialize the drive'', ''read sector N'', and ''write sector N''.


    Some software services provided by the kernel itself have similar properties,
    and can therefore be abstracted into classes. For example, the various network
    protocols'
  - '[PAGE 18]


    ![](img/ceaf8a70f91e44dcbad3d66530d36479_18_0.png)


    Figure 2.1: Some of the more important parts of the Linux kernel.


    have been abstracted into one programming interface, the BSD socket library. Another
    example is the **virtual filesystem** (VFS) layer that abstracts the filesystem
    operations away from their implementation. Each filesystem type provides an implementation
    of each filesystem operation. When some entity tries to use a filesystem, the
    request goes via the VFS, which routes the request to the proper filesystem driver.


    # ## 2.3 Major services in a UNIX system


    This section describes some of the more important UNIX services, but without much
    detail. They are described more thoroughly in later chapters.'
  - '[PAGE 19]


    # **2.3.1 init**


    The single most important service in a UNIX system is provided by **init**. **init**
    is started as the first process of every UNIX system, as the last thing the kernel
    does when it boots. When **init** starts, it continues the boot process by doing
    various startup chores (checking and mounting filesystems, starting daemons, etc).


    The exact list of things that **init** does depends on which flavor it is; there
    are several to choose from. **init** usually provides the concept of **single
    user mode**, in which no one can log in and **root** uses a shell at the console;
    the usual mode is called **multiuser mode**. Some flavors generalize this as **run
    levels**; single and multiuser modes are considered to be two run levels, and
    there can be additional ones as well, for example, to run X on the console.


    In normal operation, **init** makes sure **gettys** are working (to allow users
    to log in), and to adopt orphan processes (processes whose parent has died; in
    UNIX *all* processes *must* be in a single tree, so orphans must be adopted).


    When the system is shut down, it is **init** that is in charge of killing all
    other processes, unmounting all filesystems and stopping the processor, along
    with anything else it has been configured to do.


    # **2.3.2 Logins from terminals**


    Logins from terminals (via serial lines) and the console (when not running X)
    are provided by the **getty** program. **init** starts a separate instance of
    **getty** for each terminal for which logins are to be allowed. **getty** reads
    the username and runs the **login** program, which reads the password. If the
    username and password are correct, **login** runs the shell. When the shell terminates,
    i.e., the user logs out, or when **login** terminated because the username and
    password didn''t match, **init** notices this and starts a new instance of **getty**.
    The kernel has no notion of logins, this is all handled by the system programs.


    # **2.3.3 Syslog**


    The kernel and many system programs produce error, warning, and other messages.
    It is often important that these messages can be viewed later, even much later,
    so they should be written to a file. The program doing this is **syslog**. It
    can be configured to sort the messages to different files according to writer
    or degree of importance. For example, kernel messages are often directed to a
    separate file from the others,'
  - '[PAGE 20]


    since kernel messages are often more important and need to be read regularly to
    spot problems.


    # ## 2.3.4 Periodic command execution: cron and at


    Both users and system administrators often need to run commands periodically.
    For example, the system administrator might want to run a command to clean the
    directories with temporary files (/tmp and /var/tmp) from old files, to keep the
    disks from filling up, since not all programs clean up after themselves correctly.


    The cron service is set up to do this. Each user has a crontab, where he lists
    the commands he wants to execute and the times they should be executed. The cron
    daemon takes care of starting the commands when specified.


    The at service is similar to cron, but it is once only: the command is executed
    at the given time, but it is not repeated.


    # ## 2.3.5 Graphical user interface


    UNIX and Linux don''t incorporate the user interface into the kernel; instead,
    they let it be implemented by user level programs. This applies for both text
    mode and graphical environments.


    This arrangement makes the system more flexible, but has the disadvantage that
    it is simple to implement a different user interface for each program, making
    the system harder to learn.


    The graphical environment primarily used with Linux is called the X Window System
    (X for short). X also does not implement a user interface; it only implements
    a window system, i.e., tools with which a graphical user interface can be implemented.
    The three most popular user interface styles implemented over X are Athena, Motif,
    and Open Look.


    # ## 2.3.6 Networking


    Networking is the act of connecting two or more computers so that they can communicate
    with each other. The actual methods of connecting and communicating are slightly
    complicated, but the end result is very useful.


    UNIX operating systems have many networking features. Most basic services—filesystems,
    printing, backups, etc—can be done over the network. This can make'
  - '[PAGE 21]


    system administration easier, since it allows centralized administration, while
    still reaping in the benefits of microcomputing and distributed computing, such
    as lower costs and better fault tolerance.


    However, this book merely glances at networking; see the Linux Network Administrators''
    Guide for more information, including a basic description of how networks operate.


    # 2.3.7 Network logins


    Network logins work a little differently than normal logins. There is a separate
    physical serial line for each terminal via which it is possible to log in. For
    each person logging in via the network, there is a separate virtual network connection,
    and there can be any number of these². It is therefore not possible to run a separate
    `getty` for each possible virtual connection. There are also several different
    ways to log in via a network, `telnet` and `rlogin` being the major ones in TCP/IP
    networks.


    Network logins have, instead of a herd of `gettys`, a single daemon per way of
    logging in (`telnet` and `rlogin` have separate daemons) that listens for all
    incoming login attempts. When it notices one, it starts a new instance of itself
    to handle that single attempt; the original instance continues to listen for other
    attempts. The new instance works similarly to `getty`.


    # 2.3.8 Network file systems


    One of the more useful things that can be done with networking services is sharing
    files via a **network file system**. The one usually used is called the Network
    File System, or NFS, developed by Sun.


    With a network file system any file operations done by a program on one machine
    are sent over the network to another computer. This fools the program to think
    that all the files on the other computer are actually on the computer the program
    is running on. This makes information sharing extremely simple, since it requires
    no modifications to programs.


    > ²Well, at least there can be many. Network bandwidth still being a scarce resource,
    there is still some practical upper limit to the number of concurrent logins via
    one network connection.'
- md: '## 2.3.9 Mail

    Electronic mail is usually the most important method for communicating via computer.
    An electronic letter is stored in a file using a special format, and special mail
    programs are used to send and read the letters. Each user has an **incoming mailbox**
    (a file in the special format), where all new mail is stored. When someone sends
    mail, the mail program locates the receiver''s mailbox and appends the letter
    to the mailbox file. If the receiver''s mailbox is in another machine, the letter
    is sent to the other machine, which delivers it to the mailbox as it best sees
    fit. The mail system consists of many programs. The delivery of mail to local
    or remote mailboxes is done by one program (the **mail transfer agent** or **MTA**,
    e.g., `sendmail` or `smail`), while the programs users use are many and varied
    (**mail user agent** or **MUA**, e.g., `pine` or `elm`). The mailboxes are usually
    stored in `/var/spool/mail`.


    ## 2.3.10 Printing

    Only one person can use a printer at one time, but it is uneconomical not to share
    printers between users. The printer is therefore managed by software that implements
    a **print queue**: all print jobs are put into a queue and whenever the printer
    is done with one job, the next one is sent to it automatically. This relieves
    the users from organizing the print queue and fighting over control of the printer.³
    Instead, they form a new queue *at* the printer, waiting for their printouts,
    since no one ever seems to be able to get the queue software to know exactly when
    anyone''s printout is really finished. This is a great boost to intra-office social
    relations. The print queue software also **spools** the printouts on disk, i.e.,
    the text is kept in a file while the job is in the queue. This allows an application
    program to spit out the print jobs quickly to the print queue software; the application
    does not have to wait until the job is actually printed to continue. This is really
    convenient, since it allows one to print out one version, and not have to wait
    for it to be printed before one can make a completely revised new version.


    ## 2.4 The filesystem layout

    The filesystem is divided into many parts; usually along the lines of a root filesystem
    with `/bin`, `/lib`, `/etc`, `/dev`, and a few others; a `/usr` filesystem with
    programs and unchanging data; a `/var` filesystem with changing data (such as
    log files); and a `/home` filesystem for everyone''s personal files. Depending
    on the hardware configuration and the decisions of the system administrator, the
    division can be different; it can even be all in one filesystem. Chapter 3 describes
    the filesystem layout in some detail; the Linux Filesystem Standard covers it
    in somewhat more detail.


    ## Chapter 3 Overview of the Directory Tree

    > Two days later, there was Pooh, sitting on his branch, dangling his legs, and
    there, beside him, were four pots of honey... (A.A. Milne)

    This chapter describes the important parts of a standard Linux directory tree,
    based on the FSSTND filesystem standard. It outlines the normal way of breaking
    the directory tree into separate filesystems with different purposes and gives
    the motivation behind this particular split. Some alternative ways of splitting
    are also described.


    ### 3.1 Background

    This chapter is loosely based on the Linux filesystem standard, FSSTND, version
    1.2 (see the bibliography, [Qui95]), which attempts to set a standard for how
    the directory tree in a Linux system is organized. Such a standard has the advantage
    that it will be easier to write or port software for Linux, and to administer
    Linux machines, since everything will be in their usual places. There is no authority
    behind the standard that forces anyone to comply with it, but it has got the support
    of most, if not all, Linux distributions. It is not a good idea to break with
    the FSSTND without very compelling reasons. The FSSTND attempts to follow Unix
    tradition and current trends, making Linux systems familiar to those with experience
    with other Unix systems, and vice versa.


    This chapter is not as detailed as the FSSTND. A system administrator should also
    read the FSSTND for a complete understanding. This chapter does not explain all
    files in detail. The intention is not to describe every file, but to give an overview
    of the system from a filesystem point of view. Further information on each file
    is available elsewhere in this manual or the manual pages. The full directory
    tree is intended to be breakable into smaller parts, each on its own disk or partition,
    to accommodate to disk size limits and to ease backup and other system administration.
    The major parts are the root, /usr, /var, and /home filesystems (see figure 3.1).
    Each part has a different purpose. The directory tree has been designed so that
    it works well in a network of Linux machines which may share some parts of the
    filesystems over a read-only device (e.g., a CD-ROM), or over the network with
    NFS.


    ![](img/ceaf8a70f91e44dcbad3d66530d36479_25_0.png)

    Figure 3.1: Parts of a Unix directory tree. Dashed lines indicate partition limits.


    - The root filesystem is specific for each machine (it is generally stored on
    a local disk, although it could be a ramdisk or network drive as well) and contains
    the files that are necessary for booting the system up, and to bring it up to
    such a state that the other filesystems may be mounted. The contents of the root
    filesystem will therefore be sufficient for the single user state. It will also
    contain tools for fixing a broken system, and for recovering lost files from backups.

    - The `/usr` filesystem contains all commands, libraries, manual pages, and other
    unchanging files needed during normal operation. No files in `/usr` should be
    specific for any given machine, nor should they be modified during normal use.
    This allows the files to be shared over the network, which can be cost-effective
    since it saves disk space (there can easily be hundreds of megabytes in `/usr`),
    and can make administration easier (only the master `/usr` needs to be changed
    when updating an application, not each machine separately). Even if the filesystem
    is on a local disk, it could be mounted read-only, to lessen the chance of filesystem
    corruption during a crash.

    - The `/var` filesystem contains files that change, such as spool directories
    (for mail, news, printers, etc), log files, formatted manual pages, and temporary
    files. Traditionally everything in `/var` has been somewhere below `/usr`, but
    that made it impossible to mount `/usr` read-only.

    - The `/home` filesystem contains the users'' home directories, i.e., all the
    real data on the system. Separating home directories to their own directory tree
    or filesystem makes backups easier; the other parts often do not have to be backed
    up, or at least not as often (they seldom change). A big `/home` might have to
    be broken on several filesystems, which requires adding an extra naming level
    below `/home`, e.g., `/home/students` and `/home/staff`.


    Although the different parts have been called filesystems above, there is no requirement
    that they actually be on separate filesystems. They could easily be kept in a
    single one if the system is a small single-user system and the user wants to keep
    things simple. The directory tree might also be divided into filesystems differently,
    depending on how large the disks are, and how space is allocated for various purposes.
    The important part, though, is that all the standard *names* work; even if, say,
    `/var` and `/usr` are actually on the same partition, the names `/usr/lib/libc.a`
    and `/var/adm/messages` must work, for example by moving files below `/var` into
    `/usr/var`, and making `/var` a symlink to `/usr/var`. The Unix filesystem structure
    groups files according to purpose, i.e., all commands are in one place, all data
    files in another, documentation in a third, and so on. An alternative would be
    to group files according to the program they belong to, i.e., all Emacs files
    would be in one directory, all TEX in another, and so on. The problem with the
    latter approach is that it makes it difficult to share files (the program directory
    often contains both static and shareable and changing and non-shareable files),
    and sometimes to even find the files (e.g., manual pages in a huge number of places,
    and making the manual page programs find all of them is a maintenance nightmare).'
  mdcn: '

    ## 2.3.9 邮件

    电子邮件通常是通过计算机通信最重要的方式。一封电子信件会以特殊格式存储在文件中，专门的邮件程序用于发送和阅读这些信件。每个用户都有一个**收件邮箱**（一种特殊格式的文件），所有新邮件都会存储在这里。当有人发送邮件时，邮件程序会定位收件人的邮箱，并将信件追加到邮箱文件中。如果收件人的邮箱在另一台设备上，这封信就会被发送到那台设备，由该设备自行决定将其投递到对应邮箱。

    邮件系统由许多程序组成。向本地或远程邮箱投递邮件的任务由单个程序完成（即**邮件传输代理**或**MTA**，例如`sendmail`或`smail`），而用户使用的程序则多种多样（即**邮件用户代理**或**MUA**，例如`pine`或`elm`）。邮箱通常存储在`/var/spool/mail`中。


    ## 2.3.10 打印

    同一时间只有一个人可以使用打印机，但不在用户间共享打印机是很不经济的。因此打印机由实现**打印队列**功能的软件管理：所有打印任务都会被放入队列，每当打印机完成一个任务，下一个任务会自动发送到打印机。这免去了用户自行管理打印队列、争抢打印机控制的麻烦。³
    取而代之的是，用户*在打印机旁*形成新的队列等待自己的打印成品——毕竟似乎没人能让队列软件精准判断任何人的打印任务何时真正完成。这大大改善了办公室内部的人际关系。

    打印队列软件还会将打印内容**假脱机**存储到磁盘中，即任务在队列中时，文本会被保存在文件里。这能让应用程序快速向打印队列软件提交打印任务，不用等到任务实际打印完成就能继续运行，非常方便。这意味着你可以打印一版内容，不用等这版打印完就能输出完全修订的新版本。


    ## 2.4 文件系统布局

    文件系统被划分为多个部分：通常包含根文件系统（其中有`/bin`、`/lib`、`/etc`、`/dev`及少数其他目录）、存放程序和不变数据的`/usr`文件系统、存放变化数据（如日志文件）的`/var`文件系统，以及存放所有用户个人文件的`/home`文件系统。根据硬件配置和系统管理员的决策，划分方式可能有所不同，甚至可以将所有内容放在同一个文件系统中。第3章会详细描述文件系统布局，《Linux文件系统标准》对此也有更详细的说明。


    ## 第3章 目录树概览

    > 两天后，小熊维尼坐在自己的树枝上，晃着腿，身旁放着四罐蜂蜜……（A.A. 米尔恩）

    本章基于FSSTND文件系统标准，描述标准Linux目录树的重要组成部分。它会概述将目录树按不同用途拆分为独立文件系统的常规方式，并说明这种拆分方式的依据。本章也会描述一些其他替代拆分方案。


    ### 3.1 背景

    本章大致基于Linux文件系统标准FSSTND 1.2版本（见参考文献[Qui95]），该标准旨在为Linux系统的目录树组织方式设定规范。该标准的优势在于，由于所有内容都会放在惯常位置，因此为Linux编写或移植软件、管理Linux设备都会更加轻松。该标准没有强制所有人遵守的权威约束，但获得了几乎所有Linux发行版的支持。如果没有非常充分的理由，最好不要违背FSSTND规范。

    FSSTND试图遵循Unix传统和当前趋势，让熟悉其他Unix系统的用户能够快速适应Linux系统，反之亦然。本章内容不如FSSTND详细，系统管理员若要完全理解相关内容，也应阅读FSSTND。本章不会详细解释所有文件，目的并非描述每一个文件，而是从文件系统角度概述整个系统。关于每个文件的更多信息可在本手册其他部分或手册页中找到。

    完整的目录树可以被拆分为更小的部分，每个部分放在独立的磁盘或分区中，以适应磁盘容量限制，简化备份和其他系统管理工作。主要部分为根文件系统、`/usr`、`/var`和`/home`文件系统（见图3.1）。每个部分有不同的用途。目录树的设计使其能在Linux设备网络中良好运行，这些设备可以通过只读设备（如CD-ROM）或通过网络NFS共享文件系统的部分内容。

    ![](img/ceaf8a70f91e44dcbad3d66530d36479_25_0.png)

    图3.1：Unix目录树的部分组成。虚线表示分区边界。


    - 根文件系统对每台设备来说是唯一的（通常存储在本地磁盘中，当然也可以是内存盘或网络驱动器），包含启动系统、将系统提升到可挂载其他文件系统状态所必需的文件。因此根文件系统的内容足以支持单用户模式运行。它还会包含修复故障系统、从备份中恢复丢失文件的工具。

    - `/usr`文件系统包含正常运行所需的所有命令、库、手册页及其他不变文件。`/usr`中的任何文件都不应对特定设备专用，也不应在正常使用中被修改。这允许文件通过网络共享，具有成本效益，因为可以节省磁盘空间（`/usr`中的内容可能轻易达到数百MB），还能简化管理工作（更新应用程序时只需修改主`/usr`，无需单独修改每台设备）。即使文件系统在本地磁盘上，也可以挂载为只读，以降低系统崩溃时文件系统损坏的概率。

    - `/var`文件系统包含会发生变化的内容，如假脱机目录（用于邮件、新闻、打印机等）、日志文件、格式化后的手册页和临时文件。传统上`/var`中的所有内容都位于`/usr`下的某处，但这导致`/usr`无法挂载为只读。

    - `/home`文件系统包含用户的主目录，即系统上的所有真实数据。将主目录拆分到独立的目录树或文件系统中可以简化备份工作，其他部分通常不需要备份，或至少不必频繁备份（它们很少发生变化）。较大的`/home`可能需要在多个文件系统中拆分，这需要在`/home`下新增一个命名层级，例如`/home/students`和`/home/staff`。


    尽管上文将这些部分称为文件系统，但并不要求它们实际位于独立的文件系统中。如果是小型单用户系统，且用户希望保持简单，可以轻松将它们放在同一个文件系统中。目录树的拆分方式也可能因磁盘大小、不同用途的空间分配而有所不同。不过重要的是，所有标准*名称*都能正常使用；例如，即使`/var`和`/usr`实际位于同一分区，`/usr/lib/libc.a`和`/var/adm/messages`这样的路径也必须能正常访问，实现方式例如将`/var`下的文件移动到`/usr/var`下，并将`/var`设置为指向`/usr/var`的符号链接。

    Unix文件系统结构按照用途对文件进行分组，即所有命令放在一处，所有数据文件放在另一处，文档放在第三处，以此类推。另一种方式是按照文件所属程序进行分组，即所有Emacs相关文件放在一个目录，所有TEX相关文件放在另一个目录，以此类推。后一种方式的问题在于，这会使得文件共享变得困难（程序目录通常同时包含静态可共享文件和变化不可共享文件），有时候甚至很难找到文件（例如手册页散落在大量不同位置，让手册页程序找到所有手册页简直是维护噩梦）。

    '
