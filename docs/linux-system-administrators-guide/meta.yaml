    document carries copying permission notice identical to this one, including the
    references to where the source code can be found and the official home page. Permission
    is granted to copy and distribute modified versions of this manual under the conditions
    for verbatim copying, provided that the entire resulting derived work is distributed
    under the terms of a permission notice identical to this one. Permission is granted
    to copy and distribute translations of this manual into another language, under
    the above conditions for modified versions. The author would appreciate a notification
    of modifications, translations, and printed versions. Thank you.


    This page is dedicated to a future dedication. In the mean time... I''d like someone
    who knows him let Terry Pratchett know that his way of using footnotes is rather
    inspiring.


