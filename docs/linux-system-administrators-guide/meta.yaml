  md: 'command **flushes** the buffer, i.e., forces all unwritten data to be written
    to disk, and can be used when one wants to be sure that everything is safely written.
    In traditional UNIX systems, there is a program called `update` running in the
    background which does a `sync` every 30 seconds, so it is usually not necessary
    to use `sync`. Linux has an additional daemon, `bdflush`, which does a more imperfect
    sync more frequently to avoid the sudden freeze due to heavy disk I/O that `sync`
    sometimes causes.


    Under Linux, `bdflush` is started by `update`. There is usually no reason to worry
    about it, but if `bdflush` happens to die for some reason, the kernel will warn
    about this, and you should start it by hand (`/sbin/update`).


    The cache does not actually buffer files, but blocks, which are the smallest units
    of disk I/O (under Linux, they are usually 1 kB). This way, also directories,
    super blocks, other filesystem bookkeeping data, and non-filesystem disks are
    cached.


    The effectiveness of a cache is primarily decided by its size. A small cache is
    next to useless: it will hold so little data that all cached data is flushed from
    the cache before it is reused. The critical size depends on how much data is read
    and written, and how often the same data is accessed. The only way to know is
    to experiment.


    If the cache is of a fixed size, it is not very good to have it too big, either,
    because that might make the free memory too small and cause swapping (which is
    also slow). To make the most efficient use of real memory, Linux automatically
    uses all free RAM for buffer cache, but also automatically makes the cache smaller
    when programs need more memory.


    Under Linux, you do not need to do anything to make use of the cache, it happens
    completely automatically. Except for following the proper procedures for shutdown
    and removing floppies, you do not need to worry about it.'
