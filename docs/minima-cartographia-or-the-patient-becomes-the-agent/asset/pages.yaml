  md: '# Can You Bear It?


    10/20 10:46 AM

    Her eyes follow you around the room! Goodness for those wrapped sunglasses. Since
    she comes with a wrapped shape like one of Jackie''s signature purses and stocked
    with a swish array of 11-inch bear-size A-line skirts and handcrafted unmentionables?
    Zip her up in her fuzzy cape and give her the head to play with – what better
    way to get learning about history? Okay, Jackie, today we''re playing Bay of Pigs.


    With our convenient monthly payment plan, you''ll have the whole Kennedy clan
    to lovely display. These bears aren''t three bears – they''re aristocracy! Spend
    many charmed hours dancing little John-John bear, complete with miniature plane.
    Move the arms and legs of roly-poly Ted bear, complete with miniature Chappaquick.
    And where''s Marilyn''s Sinatra bear? Once you started down this road, there''s
    no turning back. And there was no turning back for Jackie after the assassination.
    Installing a young lookalike starlet in the White House in her place, Jackie,
    sans makeup, headed for the great outdoors where campers have dubbed her ''jeti''.
    Now the story can be told: the two lives of America''s first lady narrated by
    soft sculpture.


    Marina Vishmidt <marinar AT artserve.net> is a filmmaker.


    The Jackie Collector Bear is available from the Franklin Mint, Franklin Center,
    PA 19091-0001, USA. Purchasers will be billed for three monthly installments of
    $30 each, plus state sales tax and single shipping charge of $5.95


