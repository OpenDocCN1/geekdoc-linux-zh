    ARTICLES


    # CAN YOU BEAR IT?


    By Marina Vishmidt , 10 December 2001


    Featured in Muse Vol

    1. No. 22 – The Art

    Issue


    ![](img/b56d6cf494c64f92e10c921b0837614c_0_0.png)


    Turbo-reification or the ultimate abstract object – collectors, you decide! This
    bear is no bear – she is none other than the reincarnation of ''our'' cherished
    first lady. The bear ages, its fur gets tacky – but the real Jackie Otters around
    her garden in New Mexico, having faked her slow decline from terminal illness
    several years back. This golem is no go – peel the fur and there she is, all porcelain
    skin, hand-varnished to her patriotic fingernails.


    https://www.metamute.org/editorial/articles/can-you-bear-it'
