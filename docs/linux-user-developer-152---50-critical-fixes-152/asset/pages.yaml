  md: '# # Reviews


    Group Test | 84 Seagate Wireless Mobile Storage | 85 Ubuntu 15.04 Beta


    ![](img/f32545dac69fddf8c1433ae8405b11b8_78_0.png)


    The Exite Code Log


    A stability release - Diodon 1.3.0


    Diodon is a lightweight tool that added a...


    Cliplt


    Diodon


    CopyQ


    Pastie


    # GROUP TEST


    # # Clipboard managers


    Copying and pasting all the time? You need a utility to help speed up your process


    Cliplt

    Forked from the former community favourite Parcell, Cliplt is a lightweight GTK+
    clipboard manager that added a few features on its predecessor. Documentation
    is lacking at this stage, but the tool itself is usable and frequently mentioned
    by its devoted users.

    Download: bit.ly/1TCgEc2S


    Diodon

    One of the newer tools, Diodon is another GTK software that has been specifically
    developed with Ubuntu integration in mind. It is being actively added to all the
    time and you can also write your own plugins, which is a really nice feature.

    Download: bit.ly/1GH4hhu


    CopyQ

    Built using Qt, CopyQ is a featured-package software that takes a slightly different
    approach to clipboard managers, providing a full interface in addition to the
    ability to hold its rank of tools. User feedback is very positive and the tool
    is being developed further.

    Download: bit.ly/1gaj984


    Pastie

    The no-frills option, Pastie is a simple tool that covers the minimum of what
    a clipboard manager should be able to do. How the lack of advanced functionality
    affects its use? Feedback on here is debatable - it will depend on your specific
    needs when it comes to clipboard management.

    Download: bit.ly/10228JT'
