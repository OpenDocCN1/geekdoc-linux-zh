  md: '# Tutorial Netcat


    # File transfer


    Netcat can do anything that other similar utilities can''t do at. One of the rare
    things is file transferring. First, you should start the server part as follows:


    ```

    $ cat fileTransfer | nc -l 4567

    ```


    Next, get the file using the following Netcat:


    ```

    $ nc localhost 4567 > fileTransfer

    ```


    As you can see, you should choose the file that you want to transfer in advance.


    > Firewalls and routers sometimes make Netcat misbehave when used for creating
    a server with the -l parameter


    # Troubleshoot a web server


    Netcat can generate richer output to help you with troubleshooting. You should
    use the -v command parameter to make Netcat give more verbose output. Using -vv
    instead of -v gives a larger amount of verbose output, which is very useful.


    ![](img/f32545dac69fddf8c1433ae8405b11b8_45_0.png)


    # 09 Make any process server


    Netcat enables you to make any process server with the -e parameter. Let''s make
    /bin/bash a process server; the server part starts as follows:


    ```

    $ nc -vv -p 12345 -e /bin/bash

    ```


    The client part starts with:


    # 12 Create a web server


    The HTTP server is a TCP server, so Netcat can be used to get data from a web
    server. Netcat might need a connection to a web server.


    After the last command, you can interact as if you are working on the remote machine.
    Note that this capability of Netcat can bypass security threats when used improperly;
    use with caution.


    ```

    $ echo "GET /HTTP/1.0\n" | netcat localhost.co

    ```


    In order to get output, you should first type in GET / HTTP/1.1 and press Enter
    or two times to see the information. Alternatively, you can use the following
    method, which doesn''t require any additional typing from you.


    ![](img/f32545dac69fddf8c1433ae8405b11b8_45_1.png)


    +   Picking tools

    Knowing more about tools can be extremely useful when you''re in a network. The
    advantage of this tool is versatility and command execution. Its disadvantages
    are that they are not very user-friendly. Sometimes you might need to hit a mistake
    with a number key to find the simplest tool that fits your needs.


    # 10 Use a simple web server


    If you want to serve a simple HTML page from your machine that has 192.168.2.4
    address, you are not able to run a web server. This part will show you how to
    use Netcat without a web server. First, you will need to create a simple HTML
    file named index.html.


    ```

    $ netcat -l 4567

    ```


    If you hit http://192.168.2.4:4567 using your browser, you will see index.html.


    # 13 Create a chat with Netcat


    You can get other messages from different machines by creating a chat server.
    You should start the server part as follows:


    ```

    $ netcat -vv 1234

    ```


    Each client that connects to the server must execute the following command: Only
    two machines can participate at the same time: one server and one client. A second
    client tries to connect while another is already connected, the following error
    message will appear to the second client:


    ```

    netcat: connect to localhost port 1234

    Failed: connection refused

    ```


