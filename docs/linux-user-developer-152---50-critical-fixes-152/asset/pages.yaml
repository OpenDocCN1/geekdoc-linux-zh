    # # Track project iterations using Subversion – part 1


    # We explain the fundamental concepts of version control with Subversion


    ![](img/f32545dac69fddf8c1433ae8405b11b8_47_0.png)


    Subversion is an extremely popular open source version control system. Using Subversion,
    you can manage files, directories and any changes that have been made to them
    over period of time. The version control system offers benefits from recovering
    older versions of the data and handling concurrent edits.


    The following are the main components that make up a Subversion system:


    Swayam Prakash has a master degree in computer science and has been working for
    10 years. His focus is on operating systems, electronic commerce.


    +   - svn: the command line client

    - subversion: a program that reports the status of working copy

    - svlook: a tool that helps to inspect the subversion repository

    - svadmin: a tool to make and modify the subversion repository


    Subversion uses a central server architecture. At one end, we have a Subversion
    repository that holds all of the versioned data. At the other end, there is a
    client program that manages local copies of portions of that versioned data. Thus,
    a repository is a central control that holds all of the data – normally the information
    is stored in


    It''s interesting to understand how Subversion enables users to work. Consider
    a scenario where two co-workers decide to edit the same repository file at the
    same time. If they both save the changes and commit them to the repository, then
    it''s possible that the other could accidentally overwrite them with the new version
    of the file. So, any changes made by the first person to commit are lost. This
    is one of the common problems faced in development projects and it definitely
    needs to be addressed. Subversion uses a concept called lock-modify-unlock to
    address this problem. So using this model, only one person can change a file at
    a time. This exclusivity is managed by locks, before making any change to a file,
    a user can


