    # Build a Raspberry Pi Minecraft console


    Create a full-functional, Pi-powered games console that you can play Minecraft
    on and learn how to program to


    Bob

    Zwetsloet models complex systems and is a web developer proficient in Python,
    Django, and He loves to experiment with computing


    Minecraft means many things to people, and to Raspberry Pi users it''s supposed
    to mean education. Not everyone knows, though, that you can still have fun with
    Minecraft as you normally would. Raspberry Pi is also the best way to get a fully-functional
    version of Minecraft onto your TV. However, in its normal state, just being on
    a TV isn''t the end of it. Using all the bells and functions of the Pi, we can
    make it a bit better for TV use, and even moddable Minecraft console.


    In this tutorial, we will show you how to set it up in terms of blocks interface,
    how to add a game controller to make it a bit better and give you some example
    code on how to mod it. Now, it''s time to get building, so head to Step 1.


    +   What you''ll need

    - Raspberry Pi 2

    - Latest Raspberry Pi image raspberrypi.org/downloads

    - Minecraft Pi Edition minecraftpi.net

    - Raspberry Pi case

    - USB game controller (PS3 preferable)'
