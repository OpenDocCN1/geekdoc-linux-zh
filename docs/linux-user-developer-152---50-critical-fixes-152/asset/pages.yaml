  md: '# Build network clients, servers and more with Netcat


    # Learn how to use Netcat to accomplish tasks like creating a web server and a
    chat server


    Netcat is a simple but handy UNIX utility that reads and writes data across network
    connections, using either TCP or UDP. Although it is also called netcat, you can
    run it as nc - commonly points to the same binary file.


    Most of the line options of Netcat need root privileges (for Unix listening on
    the port that you want to use when creating a TCP server, port numbers can only
    be used by the root user). As a general principle, it is better to use port numbers
    and choose something else, provided that it is not already in use by another process.


    Is Netcat the tool for everything? No single tool can solve every problem. Yes,
    and that''s the reason that you should learn how to use it.


    ![](img/f32545dac69fddf8c1433ae8405b11b8_43_0.png)


    # 01 Install Netcat


    You can easily install Netcat on a Debian system with the following command:


    ```

    # apt-get install netcat-traditional

    ```


    You can also install Netcat using the netcat-openbsd package. The OpenBSD version
    supports IPv6, which is missing from the traditional netcat. If you don''t need
    these features you''ll notice no difference between the two packages.


    Below you can use the tcpdump to capture network traffic to or from particular
    ports


    ![](img/f32545dac69fddf8c1433ae8405b11b8_43_1.png)


