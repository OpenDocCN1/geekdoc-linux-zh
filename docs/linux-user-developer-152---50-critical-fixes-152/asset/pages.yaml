  md: '# Questions & answers


    All your technical problems solved


    # As Linux Mint is based on Ubuntu, the PPA will work


    I recently upgraded to Linux Mint and I''m very much enjoying the experience of
    using Cinnamon. However, I was wondering if I can use the PPA for Netflix working
    in Mint? Because the website doesn''t enable me to stream it through the browser
    for unknown reason. Thanks.


    Follow the on-screen instructions to make sure it works. We like to use the pipelight/stable
    PPA.


    # Mail notifications


    Do you know any software that notifies when a new email arrives to a gmail account?
    I''m using mail Thunderbird and another for Yahoo, so I know when I get new email.
    The problem is now that the Windows Messenger protocol disconnects, aMSN does
    not work anymore either.


    ![](img/f32545dac69fddf8c1433ae8405b11b8_90_0.png)


    Kieron Williams


    As Linux Mint is based on Ubuntu, as long as it supports Ubuntu, Netflix has enabled
    browsers to actually on the site, so you don''t need the special software and
    can just try to open it.


    Above the KDE mail checker is highly customizable


    Either shouldn''t be a difference in adding the PPA if you want to use the old
    route. Just use the same command line you did


    It shows you the number of total mails on a stray icon and when you hover the
    mouse over it get more detail. you can also add popup messages and alarm-sounds.


    Basically, I need a program or some desktop widget that notifies me when I get
    a new email on web services, and shows a count with the number of unread emails
    on each inbox. Does an app exist?


    If you''re using KDE, a notice called kplasma-mail-checker should also do the
    trick, it supports both POP and IMAP.


    ```

    $ sudo add-apt-repository ppa:[ppa name]

