- pgno: 65
  md: '# Tutorial


    # Build a Minecraft power move move glove


    Create a piece of wearable tech with power moves assigned to each button to enhance
    your Minecraft game


    Many of you will be avid fans of the game Minecraft. In schools it is fast becoming
    a motivational teaching and learning tool, useful in areas such as programming,
    creating logic gates and setting up a network.


    This project is framed around a simple Minecraft game where one player chases
    the other and tries to hit the block they are standing on. The real hack is to
    program a glove that moves to each button. These powers can then be deployed and
    slow down the other player and get yourself out of sticky situations.


    The real hack of this is that you can create and customise your own power moves.
    The possibilities are endless, limited only by your imagination. If you''re confident
    with GPIO pins and setting up buttons, jump straight to Step 8.


    # Dan Aldred


    is a Raspberry Pi certified educator and a local teacher for CA, who enjoys creating
    projects


    # 01 Update the Raspberry Pi


    This project is designed for the Raspberry Pi 2 which requires the updated operating
    system, although it is compatible with the Raspberry Pi B+. First ensure that
    the software is up to date latest formal type:


    ```

    sudo apt-get update

    sudo apt-get upgrade

    sudo apt-get install raspberrypi-ui-mods

    ```


    # 02 Connect a button to the Raspberry Pi


    Take one of the two ends and connect a wire to each contact, take the other two
    ends and connect to the Pi. You may find this easier using a female-to-female
    connector. To set up button, use GPIO pin 17 – this is the physical pin 11 on
    the board. The other end is connected to ground pin, shown by a minus sign then
    the pin gpio pin 17 is ground pin.


    ![](img/f32545dac69fddf8c1433ae8405b11b8_65_0.png)


    # What you''ll need


    +   - Raspberry Pi 2

    - 4 x mm tactile buttons

    - Female-to-female jerky

    - Terminal blocks

    - A glove

    - Router

    - 2x CAT5 cables'
