    # Controls


    Here''s the full layout of the buttons used by the PS3 controller by default—you
    can change them using the script that you download in Step 18


    ![](img/f32545dac69fddf8c1433ae8405b11b8_60_0.png)


    Left stick Movement

    L3/RS Descend while flying

    Right stick Camera


    ![](img/f32545dac69fddf8c1433ae8405b11b8_60_1.png)


    # Xbox controllers


    Unfortunately, 360 controllers work differently with Linux—they use their own
    drivers so the normal joystick drivers for PS3 pad and USB controller doesn''t
    work easily and is hard to assign specifically. This makes it tricky to use in
    a situation as this.


    # 16 Add controller support


    Make sure controller input functions are installed on the Raspberry Pi. To do
    this, ssh into the Raspberry Pi we used in Step 14 (where ''raspberry'' is the
    password) and install the following:


    ```

    $ sudo apt-get install xserver-xinput-joystick

    ```


    # 17 Controller mapping


    We have a controller for the PS3 controller that you can download to your PS3
    and with a bit of tweaking it can fit most USB controllers. Go to the configuration
    folder with:


    ```

    $ cd /usr/share/x11/xorg.conf/

    ```


    # 18 Replace the controller mapping


    Remove the current joystick controls by using sudo ps3-joystick and then replace
    by downloading the custom configuration:


    ```

    $ sudo wget http://www.linuxuser.co.uk/wp-content/uploads/2015/04/ps3-joystick.conf

    ```


    ![](img/f32545dac69fddf8c1433ae8405b11b8_60_2.png)


    # 19 Reboot to use


    After a reboot to make sure everything''s working, you should be able to control
    the mouse input on the controller. R2 and L2 are the mouse clicks and can be used
    to navigate the Minecraft menu to access the game.


    # 20 Full-screen


    So you may have noticed that Minecraft is running in a window—you can then click
    the full-screen button to make it full, however you then heavily limit your mouse
    control. Thanks to the controller, you can get around. As soon as you load the
    game, make sure to use the sticks for movement and the d-pad for selecting items
    in the inventory.'
