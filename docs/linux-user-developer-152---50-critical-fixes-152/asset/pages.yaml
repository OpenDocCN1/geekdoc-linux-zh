    # 3D-print a case


    Aaron Hicks from Solid Technologies designed this Minecraft case for Raspberry
    Pi and GradCAD. We have slightly modified the version to fit these issues. All
    you need is send the STL file to a professional printing service - many high-end
    printers have at least a Base that they will print the case for you. It should
    cost around £15.


    +   10 The correct case


    In this scenario, we are hosting this Raspberry Pi up to a TV, which means it
    needs a case so that there''s less of damage to the components from dust or static.
    There are many ways you can mount it to the back of the Raspberry Pi. Alternatively,
    you can get really creative and 3D-print your own, as you can see on page 58.
    Check out the photos to the left.


