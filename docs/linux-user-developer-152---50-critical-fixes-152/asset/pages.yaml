    # Account integration


    Before doing anything else, it''s a good idea to start linking various accounts
    to your phone. If you''ve ever used an Android phone before this and had it to
    a Google Account, your first call of action will be to add Google Account to your
    phone. Once you get access to it you can then sync your contacts to the account.
    It won''t do the latter by default, so you may need to go into the account settings
