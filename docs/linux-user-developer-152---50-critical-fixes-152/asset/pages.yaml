    # DISTRO Fedora may move to Atomic installations


    Paul Freed, the Fedora engineering team manager, has indicated that the distribution
    is to take a look out at Red Hat''s Atomic project to make a life easier for users
    who are updating their systems more frequently.


    “Atomic makes shipping an independent, validated set of contents easier,” writes
    Freed, speaking to the engineering team. The rpm-ostree basis of Atomic can prevent
    itself in an installed system, referring to the tendency to limit configurations
    that are updated post-release.


    Freeds totally would represent the represent of Fedora Core, stating that it''s
    dead, and it''s not coming back.


    Left Fedora dropped ‘Core’ from its 2007/7 release.


    # HARDWARE

    Vvidia unveils the new DevBox


    # Ubuntu-based desktop pc for deep learning


    Graphics Nvidia announced the launch of the DevBox, a desktop high-performance
    computing (HPC) device designed for deep learning. The DevBox supports up to four
    GeForce Titan X graphics cards, offering 128GB of VRAM and seven-cores. These
    are supported by up to 64GB of DDR4 memory and an Intel Core i7 processor.


    The heart of the system is itself, an interactive deep-learning training system
    built around Nvidia''s CUDA GPU platform. “Nvidia makes it easier to design the
    best software for the job,” says Architect Simon Oclajden at the launch.


    The high-end DevBox is being sold to ‘qualified, deep-learning researchers,’ in-,
    starting at $15,000. More details on building a DevBox from off-the-shelf components,
    and gives DevBox as a free download.


    # OPEN SOURCE

    LibreOffice Online project revived


    # Open source alternative to Docs, Office 365


    Collabora, the largest team of LibreOffice engineers in the world, announced a
    partnership with messaging services to improve the open source productivity suite
    to the web in project LibreOffice-Online.


    Collabora started the LibreOffice project in 2011 to create a render engineering
    project optimised for in-browser usage, LibreOffice Online is is designed to offer
    a free and open source alternative to Microsoft 365 for both consumers and enterprise
    users. Installed on a central server, LibreOffice On Line


    will offer document editing on any HTML5-compliant browser without the need for
    end-users to install any software. It will also extend all the features of LibreOffice
    to the cloud, adding features which have been asked for by many. The non-profit
    The Document Foundation maintains the LibreOffice project. “In the future, the
    LibreOffice user will be able to access the service from anywhere, mobile to the
    cloud without leaving his free software environment of choice.


    Iowarc became interested in the project when looking to extend its Microsoft Exchange
    alternative messaging platform to productivity. We saw that users were looking
    for alternatives and we made Iowarc what they needed,” says Adam Pasci, head of
    collaboration at Google Apps and website.


    “It is always satisfying to work on something that, as a company, we have a need
    for ourselves,” Neither company has offered a timescale for the project''s public
    availability.


