  md: '# Review Ubuntu phone


    # Get started with Ubuntu Phone


    # Learn how to set up and get the most out of your brand new Ubuntu phone


    You''ve got your shiny new Ubuntu phone - at the time of writing it''s probably
    an Aquarian E4.5, but there might be something else in the future - and you want
    to set it up and working. If you''ve ever used an Android phone before, the initial
