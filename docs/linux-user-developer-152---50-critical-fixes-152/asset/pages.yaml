  md: '# CopyQ


    Something of everything-but-the-kitchen-sink tool, CopyQ is powerful


    # Pastie


    Minimalism is definitely the aesthetic here, but does it go too far?


    ![](img/f32545dac69fddf8c1433ae8405b11b8_80_0.png)


    +   Clippings can be dragged across different tabs for organisation


    ![](img/f32545dac69fddf8c1433ae8405b11b8_80_1.png)


