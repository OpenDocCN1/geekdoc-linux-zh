    A log message can be provided, but it can be empty. If it is not empty it will
    be recorded. If targets are not locked items, those will be counted out.


    +   Options

    - depth          limit the recursion depth

    - [-recursive]    recurcursively scan subdirectories

    - --no-tags ARG   show no tags

    - --staged ARG    show only files in the index

    - [-file] ARG     show only specific file

    - [-path] ARG     show only specific directory

    - --working-tree show only working tree files

    - --changed-only show only files changed since last commit


    +   - --author ARG    filter by specific author

    - --since ARG      show changes since specific date

    - --no-interactive do not prompt for input

    - --porcelain      output machine-readable format

    - --config DIR     use configuration file from DIR

    - --config-option ARG set specific configuration value


    ![](img/f32545dac69fddf8c1433ae8405b11b8_50_0.png)


    Also use the help command to see the options for other commands


    If we need to add something to the repository, Subversion provides an argument
    called add. This is illustrated in the following code:


    ```

    [[root@repo] svn add a new file to the repository]] -> add txt

    [root@repo] svn add text

    [root@repo] svn commit -m "Commit the fix"

    ```


    Note that the directory of a working copy contains a special subfolder known as
    svn. Make sure you do not delete or change anything in it, as Subversion uses
    it to manage version history.


    Subversion comes with a number of features, but in our day-to-day we use only
    a few of them. Here we use a few to look at a typical workflow using Subversion.


    Developers use status more than any other Subversion command. Some of the most
    common codes displayed by sv status:


    +   - [?] item file or directory is not being versioned

    - [M] item has been scheduled for deletion from the Subversion repository

    - [A] item has been added to the Subversion repository

    - [C] item is in conflict. The developer needs to resolve the conflict before
    the changes can be committed to the repository


    +   1. Update your working copy - use svn update


    +   2. Make changes to your file(s) - edit the contents of the files you want
    to change. To move and copy files and directories, for example, use Subversion
    provides svn add, delete, and svn commit


    +   3. Review the changes - a developer can review the changes using Subversion
    svn status and svn diff.


    The svn command also comes with a verbose option (-v), and this shows you the
    status of items in your working copy.


    +   4. Fix the mistakes - Subversion provides revert, which is useful for reverting
    a file or directory to its unmodified state


    The revert command is handy in many scenarios. It can be used to revert a pre-modified
    state - if you have mistakenly deleted a file from the version control system
    it can be used to restore the file


    +   5. Resolve the conflicts - this can be done by using svn update and resolve
    status


    Another important aspect in Subversion is resolving the conflicts - svn update
    command can prevent conflicts. Conflicts can occur when you try to merge changes
    from the working copy into the repository. When Subversion reports conflicts,
    it provides an option that developers can choose for:


    +   6. Publish the changes - svn commit can be used to transmit the changes made
    to the repository, there creating a new version to be used.


    Select: (p) postpone, (d) diff-full, (e) edit, (m) mine-conflict, (t) theirs-conflict,
    (s) show all options:


    The developers will use the option, which displays all modifications to the file
    along with any conflicts. So so far, we''ve seen the fundamental aspects of Subversion.
    In the next, we''ll take a deeper look at the advanced features of this version
    control system.


