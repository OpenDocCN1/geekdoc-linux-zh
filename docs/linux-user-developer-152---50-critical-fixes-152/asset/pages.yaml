  md: "# # Minecraft console\n\n# ## Full code listing\n\nImport\nWe're importing\
    \ the necessary modules and APIs to program Minecraft. Most importantly are the\
    \ files in the mcpi folder that we copied earlier\n\n```\nfrom mcpi.minecraft\
    \ import Minecraft\nfrom mcpi import block\nfrom mcpi.vec3 import Vec3\nfrom time\
    \ import sleep, time\nimport random, math\n```\n\nLocate\nWe connect to Minecraft\
    \ with the first line, and then we find the player's position and round it up\
    \ to integer\n\n```\nmc = Minecraft.create()\nplayerPos = mc.player.getPosition()\n\
    \ndef roundvec(vec):\n    return Vec3(int(vec.x), int(vec.y), int(vec.z))\n```\n\
    \nRange finding\nCalculate the distance between the player and diamond. This is\
    \ done in intervals along the line, and we just compare the coordinates of them\n\
    \n```\ndef distanceBetweenPoints(point1, point2):\n    xd = point1.x - point2.x\n\
    \    yd = point1.y - point2.y\n    zd = point1.z - point2.z\n    return math.sqrt(xd*xd\
    \ + yd*yd + zd*zd)\n```\n\nCreation\nCreate a random position for the diamond\
    \ within 50 blocks of the player position that was found\n\n```\ndef randomBlock():\n\
    \    randomBlock = roundvec(playerPos)\n    randomBlock.x = random.randrange(playerPos.x\
    \ - 50, playerPos.x + 50)\n    randomBlock.y = random.randrange(playerPos.y -\
    \ 5, playerPos.y + 5)\n    randomBlock.z = random.randrange(playerPos.z - 50,\
    \ playerPos.z + 50)\n    return randomBlock\n```\n\nStart\nThis is the main loop\
    \ that starts the game. It goes to get the position of the diamond to start each\n\
    \n```\ndef main():\n    global lastPos, playerPos\n    seeking = True\n    lastPos\
    \ = playerPos\n```\n\nNotification\nThis sets the block in the environment and\
    \ pushes a message to postChat to the Minecraft so the player knows the mini-game\
    \ has started\n\n```\nrandomBlock = randomBlock()\nmc.setBlock(randomBlock, block.DIAMOND_BLOCK)\n\
    mc.postChat(\"a diamond has been hidden - go find!\")\n```\n\nChecking\nWe start\
    \ the timer with timeStarted, and set the distance between the player and the\
    \ block. Now while the distance between the player and the diamond is less than\
    \ two blocks of the diamond, it means they have found the block and it ends the\
    \ loop\n\n```\nlastDistanceBlock = distanceBetweenPoints(randomBlock, playerPos)\n\
    timeStarted = time()\nwhile seeking:\n    playerPos = mc.player.getPosition()\n\
    \    if lastPos != playerPos:\n        distanceBlock = distanceBetweenPoints(randomBlock,\
    \ playerPos)\n        if distanceBlock < 2:\n            seeking = False\n   \
    \     if distanceBlock < lastDistanceBlock:\n            mc.postChat(\"Warmer\
    \ \" + str(distanceBlock) + \" blocks away\")\n            lastDistanceBlock =\
    \ distanceBlock\n        else:\n            mc.postChat(\"Older \" + str(distanceBlock)\
    \ + \" blocks away\")\n    sleep()\n```\n\nMessage writing\nIf two or more blocks\
    \ move away from the diamond, well if you're nearer or farther we postChat. This\
    \ is done by comparing the current and last position - if it's further, we say\
    \ a colder in Python. If it does this, we update your current position as the\
    \ last position\n\n```\ntime = time() - timeStarted\nmc.postChat(\"Well done \"\
    \ + str(time) + \" seconds to find the diamond\")\nif __name__ == \"__main__\"\
    :\n    main()\n```\n\nSuccess\nIt takes two-seconds before updating the next position\
    \ using the player selection. If the loop ends, it counts up the time and lets\
    \ you know how long it was before finding the diamond. Then tells Python to start\
    \ the script at the main function\n\n![](img/f32545dac69fddf8c1433ae8405b11b8_62_0.png)\n\
    \n* About\n\nwww.linuxuser.co.uk 63"
