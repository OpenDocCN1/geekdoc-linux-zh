    # ## PiJuice is a new option for the Pi. And what is what makes it so special?


    **Bob Zwetsloot** models complex systems and is a proficient programmer in Python,
    Django and C. He loves to experiment with computing


    **If you like this...** Interested in portable PiJuices? We have a few big DIY
    projects you can find in this issue and 143 of Articles and Developer: bit.ly/pijuice


    **Further reading** You can find out all the latest packages and pre-orders today
    from PiJuice website, head over to pijuice.com


    So, the PiJuice as the Raspberry Pi Foundation has dabbling in licensing what
    they need?


    No, it is a small product for the Raspberry Pi - just a descriptive word for what
    it does, sort.


    **Okay, what is the PiJuice?** The PiJuice is a way to make the Raspberry Pi portable
    - the juice box of energy is one of components of this system that enables a portable
    Raspberry Pi.


    **How exactly is the PiJuice optimised for the Raspberry Pi?** A rechargeable
    lithium battery is the correct size to keep flush with the Raspberry Pi and not
    make it too bulky, and it offers, supplying a more constant flow of power to the
    Pi when this is plugged in compared to some of other portable chargers available.


    **What do you mean power or energy?** In this case, a battery with electrical
    power for mobile phone charging exist, sure, but none are optimised for use with
    the Raspberry Pi.


    **You said this power bit only one something - what does it include?** To be truly
    portable, you need to have more power than just the PiJuice provides, that''s
    off and it has a real time clock built in. To extend the battery life needs to
    have more power


    options; the PiJuice has both hardware and software solutions to add this. It''s
    also very low profile, making it more feasible for you looking for a Raspberry
    Pi case.


    **What about a screen? isnt important for portability?** It can be, if you can
    get a ''header'' for the GPIO pins to enable other components on top of the Pi
    and use both at the same time. In one case, one of the PIFT screens or a larger
    can be used.


    **Is this an official Raspberry Pi project?** No, this is a separate developer,
    but it''s caught the eye of the Raspberry Pi project. Because it uses the power
    of the Raspberry Pi while being portable as well.


    **Does it do anything else?** As well as having space for makers and people who
    like getting into making (including a DIY camera and sensors), there is also a
    space to charge the Pi of off power which could be in very pretty useful.


    **Solar power? How would that work for the Pi?** If you''re in an outdoors project,
    you can have constantly powered without requiring maintenance, constant charging.
    It''s a very neat idea!


    **So how much does it cost and get from it?** The price starts at E25, which is
    pretty cheap, and goes up to E80 for a full kit that you can start with successfully
    today. After went lately, you can pre-order a kit now that should begin shipping
    out to you for the end of July year.


