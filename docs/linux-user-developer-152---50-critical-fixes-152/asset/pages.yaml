    Also along with the account you can set up up for Twitter, Facebook and several
    other social media and related account types - then links the apps for these specific
    accounts in the Ubuntu phone system. These links work to the web versions of such
    services, which enable you to always be logged in and to get notifications from
    some of them.


    Left you can reveal the Ubuntu Launcher by simply swiping from the left edge of
    the screen


