  md: '# PHONE


    # Bq Aquariusis E4.5 Ubuntu Edition


    The first handset to feature Ubuntu for Phones fill the void left by the Ubuntu
    Edge project, or is it a damp squib?


    Originally created as a low-end Android handset for the Spanish market, the Bq
    Aquarius E4.5 has been retooled for Canical''s notice. The only visible change
    removal of the soft buttons around the low-resolution QHD display, dropped in
    favour of Ubuntu''s Sailfish-inspired, edge-wise navigation system. Everything
    else is identical, right down to the lightweight chassis, which feels undeniably
    cheap in the hand, and the buggy interpolated camera that fails to live up to
    the eight-megapixel claims of its manufacturer.


    The hardware is not the star of this show, of course, and that''s just as well.
    The Aquarius E4.5 Ubuntu Edition''s selling point is its operating system, a variant
    of Ubuntu for Phones based on last month''s Ubuntu 15.04 release.


    Operating System

    Ubuntu for Phones 15.04


    Processor

    MediaTek MT6762 Quad-Core ARM Cortex-A7, 1.3GHz


    Memory

    1GB RAM, 8GB Storage

    (Upgradeable via Micro-SD)


    Dimensions

    127mm x67mm x 9mm


    Display size

    4.5"


    Display resolution

    540x960 (qHD)


    Wireless

    Bluetooth 4.0, 802.11b/g Wi-Fi

    (2.4GHz only), GSM 850, 900, 1800, 1900, UMTS 900, 2110


    Price

    €169.90


    ![](img/f32545dac69fddf8c1433ae8405b11b8_27_0.png)'
