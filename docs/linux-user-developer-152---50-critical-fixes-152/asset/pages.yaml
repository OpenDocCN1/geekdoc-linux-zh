  md: '# Tutorial Scrollback


    # # Run your own chat channel with Scrollback


    Scrollback builds chatbots that enable you to communicate and engage new audiences


    ![](img/f32545dac69fddf8c1433ae8405b11b8_35_0.png)


    Communication is one of the most important aspects of our lives. Whether you are
    writing peer-to-peer communication or a brand communicating to its audience, it''s
    important to choose the right words and convey everything. The rules are simple:
    whoever communicates best wins.


    #  01 Install the script


    Installing Scrollback is pretty straightforward; you can just go to their GitHub
    page and run a single line command to easily easily install Scrollback on your
    server. The community can''t just let that happen so easily! This is one of the
    best open source projects I''ve seen in years. Now, as open source enthusiasts
    you can view the code and take charge, rather than just clicking away. However,
    if you are interested in running Scrollback immediately, you can skip to step
    3.


    With the digital world now handling most of our communications, it''s important
    to choose the right words and images that your audience can understand. One of
    the communication tools is the chat application. Generally based on a server-client
    model, such tools are available a dime a dozen. However, we will find tools that
    don''t support chatrooms, and some are based on the IRC protocol only. There is
    rarely an application with everything in one package. Scrollback, based on a server-client
    model, has a web-based UI that allows you to use it with any application. We''ll
    go through the installation and its features in this tutorial. We have used Ubuntu
    14.04 as the host system and the latest source code from Scrollback''s GitHub
    repository.


    # Resources


    +   - [Scrollback.io](https://scrollback.io)

    - [GitHub repo](https://github.com/nitish/scrollback)


    Scrollback provides a neat, interface to manage all your conversations


