    Q: What are the benefits of compiling your own software?


    A: You may not have the latest version of the software and you may not be any
    binaries that you can use for free. Compiling software enables you to use the
    most up-to-date software, and you can even build using newer libraries that it
    works better with others.


    Q: What do I need to compile?


    A: Just the source files and any dependencies - you''ll usually figure out if
    you''re missing anything when you go to compile. Compiling is with GCC, which
    comes under different packages in some areas. Anyway, your distro will tell you
    what you need it for.


    Q: How do I compile?


    A: At least using `make` and `install` commands, or a selection or all of them.
