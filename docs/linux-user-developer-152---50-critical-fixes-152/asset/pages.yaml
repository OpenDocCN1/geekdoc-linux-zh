    # OPEN SOURCE


    # Digital Italy policy pushes FOSS


    # Indian government mandate on software infrastructure announced


    The Indian government has announced, a policy titled ‘Adoption of Open Source
    for Government of India’, that will be making the use of free and open source
    software (FOSS) mandatory for all government applications.


    Part of the Digital Italy programme, the policy mandates that open source software
    be used in place of proprietary whereas where possible. For all requests must
    focus on open source solutions, while in areas where there is no open source alternative,
    closed source software will be considered.


    The Indian Government’s policy ensures that all government systems are available
    to study and modify and redistribute copies of either the original or modified
    software and that ‘code shall be free from any royalty’, preventing code-sharing
    initiatives for closed source.


    The government has also said it will engage with the open source community in
    the region: "Go actively collaborate with OSS communities in India as well as
