  md: "# Full code listing\n\nsystem in this case is the Raspberry Pi. As a toy example,\
    \ let us say you need to send emails using the Fetchmail program. You can do this\
    \ in a couple of different ways. The older method is to use the os.system() command\
    \ to pass it in a string; in our example, this would look like the following:\n\
    \n```\ndo_task.py\n-------\n\ndef do_func():\n    print(\"Hello World\")\n```\n\
    \nos.system(\"/usr/bin/fetchmail\")\n\nYou need to explicitly use os.wait() to\
    \ be told when the task has finished. This method is being replaced by the subprocess\
    \ module. It gives you more control over how the task runs and how you can interact\
    \ with it. A simple equivalent to the above command would look like this:\n\n\
    ```\nsubprocess.call(\"/usr/bin/fetchmail\")\n\nmain_program.py\n\n# You import\
    \ your own module to tasks and commands\nimport do_task\ndo_task.do_func()\n\n\
    # You can then go ahead and run any included functions\n\n# You can run system\
    \ programs directly\nimport os\n\n# The exit code from your program is in the\
    \ variable returncode\nreturncode = os.system(\"/usr/bin/fetchmail\")\n\n# subprocess\
    \ module is a better choice\nimport subprocess\n\n# You can duplicate the above\
    \ with\nreturncode = subprocess.call(\"/usr/bin/fetchmail\")\n\n# If you want\
    \ to get the output, you can use\nreturned_data = subprocess.check_output(\"/usr/bin/fetchmail\"\
    )\n```\n\nIt waits until the called program has finished and returns the return\
    \ code in your main process. But if your external program needs to return results\
    \ to your program? In this case, you can use the command. This is essentially\
    \ the same as subprocess.call(), when it finishes, output written by the external\
    \ program is captured as a string object. If you need more information from stderr,\
    \ you can call subprocess.check_output().\nAfter reading these three, you will\
    \ have the bare bones to be able to build your own version of the J.A.R.W.S system.\
    \ You will be able to fine-tune it to do basically anything you want to. So you\
    \ can order your machines around, and they have actually listen to what you are\
    \ saying for.\n\n![](img/f32545dac69fddf8c1433ae8405b11b8_74_0.png)\n\n| Feature\
