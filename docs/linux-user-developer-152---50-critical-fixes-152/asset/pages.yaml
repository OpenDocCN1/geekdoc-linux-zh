    # Usage


    The basic functions are present in Pastie — primary selection and synchronising
    the clipboards — but nothing beyond that to make use of. There are some relatively
    useful formatting in the application bar menu''s list of clippings, with paragraph
    icons in the list and that to quickly spot images via the black square, which
    is quite handy.


    # History


    With over 6000 items, CopyQ will never run out on you. You can set which clips
    are automatically saved to, as well as choose the editor to use when making changes.
    You can also set what happens when an item is in the history, and you''re able
    to customise the interface to an incredibly fine level of detail. Plus, you can
    search and sort your history.


    # History


    You are limited to 100 items in Pastie, which does not persist between application
    launches, and you can customise the list by setting the maximum number of displayed
    characters per line. You can edit the selected clipboard entry view, but you can''t
    edit the others (so you''ll have to select them first).


    # Shortcuts


    There are two sets of shortcuts. The first is available via the preferences menu,
    enabling you to set in-app shortcuts for every option (navigation, searching,
    and editing tab). The second set includes a range of deletable commands that can
    be set off automatically by clipboard content, or by hitting a global shortcut.


    # Shortcuts


    There are only two shortcuts in Pastie: one for the selection dialog and one for
    preferences. Unfortunately, we get nothing to work with during our tests — perhaps
    they are being overwritten by other shortcuts — and there''s no way to rem them
    to different keys. But, it''s just the middle-class for Pastie.


    # Extra Functions


    As mentioned


    # Extra Functions


    Pastie is as bare as gets and has no other functions at all. Interestingly, it''s
    not the lightest software in this test as a result — Clip was the least at 4.1
    MB of RAM, Diodom came as feature-layer; CopyQ came as twice as much as 16.1 MB
    and then the more


    # Overall


    With unrivalled functionality, customisable shortcuts for each of the options
    – and there''s really a — good-looking GUI that helps you customised your clippings
    for more effective use, CopyQ stands well above the rest.


    # Overall


    There, and then there''s just a single function for here. Nothing wrong with that,
    but we use a clipboard manager and, sadly, Pastie does increases the number of
    clipped items you can store.


