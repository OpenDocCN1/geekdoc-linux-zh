    # Open LDAP


    I have Debian 70 Weekly installed on my computer and I am having issues with uninstalling
    a program from Synaptic Package Manager. This program is called WiFi.


    When I try to uninstall it by packages, it tries to install multiple packages
    during the process and during the removal it tries to connect my repositories
    and cannot find them. I have the following repositories:


    ```

    http://packages.debian.org/wezy/aldorf main

    http://deb.debian.net/debian/wezy main

    http://deb.debian.net/debian/jessie main

    ```


    I find that it needs to download some things before I can uninstall that program.
    Any idea why that is and how to fix it? Thanks in advance.


    Well, as you said to try installing things as it uninstalls a package. This might
    be because there are alternate dependencies or packages that previously conflict
    with WiFi.


    > The problem you''ve seen is due to different source sources. I''m assuming you''re
    using one of the CrunchDebian spins, which is why you have that repository. The
    conflicting CrunchDebian repositories will likely be causing the problem. Remove
    the Jessie repo and it should start to work.


