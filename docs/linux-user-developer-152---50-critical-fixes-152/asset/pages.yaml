- pgno: 44
  md: '# Basic netcat usage


    The general form of a Netcat command looks like this:


    ```

    $ netcat [options] host port

    ```


    The default behaviour is to simulate a simulated network interaction which means
    that the connection is not secure (encrypted).

    If you want, you can specify a range of ports using the minus character between
    the two port numbers to indicate the range.


    # The default Netcat behaviour is similar to a simulated network interaction that
    uses the netcat command


    # 03 Netcat as a client


    The most common netcat usage is acting as a client for a process. It is most useful
    for troubleshooting networks because you can see the data of full interaction.
    The following command will interact with an SMTP server:


    ```

    $ nc -v smtp.example.com 25

    ```


    As you guess, you can use either the hostname or the IP address of the remote
    host.


    # 04 Use netcat for input and output


    According to Unix philosophy, the program can read from a file and the output
    can be captured into a file. The file is defined as -filename and the output as
    -filename. You can also use pipes to get the output of other processes.


    # 05 Netcat as a server


    Not only can you use Netcat as a client, you can also use it for creating a server!
    The next netcat command will listen on port 1234 for incoming TCP connections:


    ```

    $ nc -l 1234

    ```


    The job is done by -l option which tells Netcat to listen for incoming connections.
    The port number is also provided in the command line.


    # 06 The UDP protocol


    Netcat also allows you to use the UDP protocol which is used with the -u option.
    This is particularly valuable when you want to test certain test servers. The
    following command will test a dns server that uses UDP.


    > You can see details on the Netcat package right at the top of this outline


    +   Finding the problem

    As you know, netcat can be used for troubleshooting networks including ethernet,
    firewall, ping, telnet, etc. If you cannot solve the problem then you should always
    have an erroneous network connection or you might need to start looking at your
    hardware installed.


    # 07 Use netcat for port scanning


    You can use netcat to scan a server for a version of Nmap. The next command scans
    the 192.168.1.2 IP address using a range of ports from 20 to 400:


    ```

    $ nc -v -u 192.168.1.2 20-48

    ```


    The -u option tells Netcat to send zero data. In addition, Netcat closes the connection
    as soon as it opens it. The -z option tells not to perform any actual data change
    and disable DNS lookup for your IP address.'
