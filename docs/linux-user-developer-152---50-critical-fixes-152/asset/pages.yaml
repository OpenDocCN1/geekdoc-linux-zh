- pgno: 22
  md: '# 32 INSTALL FREEZING OR BUSY


    When something like this happens, one of the primary suspects is an errant installation
    or update program going on while you''re trying to install. You''ll need to look
    through logs and your system to see what might be using the installation tools,
    then either wait for it to finish or kill it off so that you can continue.


    # 33 CHECK DOWNLOADED FILES


    Sometimes installations can be caused by incomplete or incorrect downloads. This
    is why a lot of FOSS comes with an MD5 hash associated with it you can check the
    file to make sure it''s correct. To do this, open the terminal and use


    ```

    $ mdsum [filename]

    ```


    Compare it with the hash sum given online.


    ![](img/f32545dac69fddf8c1433ae8405b11b8_22_0.png)


    # 36 DISTRIBUTION UPGRADE


    If you don''t have the benefit of a graphical manager or software manager to perform
    a distribution upgrade, Debian-based distros can also use apt-get to do this.
    In the terminal, do an apt-get update and then follow up with


    ```

    $ apt-get dist-upgrade

    ```


    # 37 FRESH INSTALL STILL NOT WORKING


    If your install is still failing then a good course of action is to just try and
    install the system again. Rewrite the live medium to make sure it''s correct,
    but something might have gone wrong in the process and just try different results.


    # 38 PARTITION PROBLEMS


    Some distro have very easy and straightforward partition options, while others
    have much less dont. In common, that is they''ll use mount the partitions, while
    others have containers GParted (which is most of them), you can set the partitions
    as you want much easily, use gdisk in the terminal.


    # 34 PACKAGE NOT FOUND


    If you''ve added or activated a repository and are having trouble finding it,
    it''s new software is not showing up, your software lists might not have been
    properly updated. In Ubuntu, you can update it from the terminal with apt-get
    update, and Fedora yum update, although the latter will also enact any software
    updates at the same time.


    # 35 NEED TO FORCE AN UPDATE


    While getting dependencies sorted out is one to make sure software installs, others
    just force the package to install may fix a problem. This may be a solution for
    dependency problems, there could be other issues blocking an install that doesn''t
    matter for you. In Ubuntu you should download the package using dpkg -get [package]
    and then install with dpkg -i [package]. In Fedora you can use rpm -ivh -force
    [package] to do this.


    ![](img/f32545dac69fddf8c1433ae8405b11b8_22_1.png)


    ![](img/f32545dac69fddf8c1433ae8405b11b8_22_2.png)'
