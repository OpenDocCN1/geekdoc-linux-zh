  md: "# Tutorial Subversion\n\n```\n[root@inblr-pnos swamay]# svn help\n```\n\nSubversion\
    \ provides a command client, svn, developers use it to talk to the database. This\
    \ client comes with a number of arguments and options (cl) and commands used to\
    \ import, check-in (ci) and check-out (co). With these arguments you can add files\
    \ into the repository using import, check-out so you have your own copy to work\
    \ on and then push the changes back to the repository.\n\nYou can easily ask for\
    \ help on a specific subcommand (or argument) by running svn help. Subversion\
    \ will respond with the usage of the subcommand and also explains syntax, options\
    \ and more.\n\nLet us consider a case where our repository has directories and\
    \ few files. If we want to check out all, the following command can be:\n\n```\n\
    [root@inblr-pnos swamay]# svn co http://svnexample.com/calc\n```\n\nThe output\
    \ of that command will look like this:\n\n| A calc/Makefile |\n| A calc/integer.c\
    \ |\n| A calc/button.c |\n\nChecked out revision X.1\n\nNote that the Subversion\
    \ added a number of items to your local copy and it will serve as your working\
    \ copy.\n\nSo let us see how changes to a specific file can be published. Remember\
    \ that Subversion will not make changes public unless you explicitly indicate\
    \ it to.\n\nAssume that we make changes to integer.c. Now we can use the commit\
    \ command to publish these changes publicly, as follows:\n\n```\n[root@inblr-pnos\
    \ swamay]# svn commit integer.c\n```\n\n> Subversion provides a command client,\
    \ svn, and developers use it to the database. The client comes with a number\n\
    \nSending integer.c\nTransmitting file data ...\nCommitted revision X.2\n\nIt\
    \ is good to add comments when we commit changes to a file. This can be accomplished\
    \ by adding an extra argument, -m to the commit command.\n\n```\n[root@inblr-pnos\
    \ swamay]# svn commit integer.c -m\n\"Adding an extra comment for 'clarity'\"\n\
    ```\n\nNow we have committed the changes to the repository, along with some comments.\
    \ If another developer checks out the file integer.c, they will see these changes\
    \ in the latest revision of the file.\n\nWhat if we want to update the file? Assume\
    \ a second developer has checked out the integer.c before the first developer\
    \ made changes to this file, the developer's working copy remains unchanged, it's\
    \ important to note that Subversion merges changes only at the request of the\
    \ user. We can use the update option to update the working copy of the second\
    \ developer.\n\n```\n[root@inblr-pnos swamay]# svn update\nU integer.c\nUpdated\
    \ to revision X.2\n```\n\nClearly, we see that Subversion has updated the contents\
    \ of the integer.c file. Therefore, with the svn update command it helps to bring\
    \ your working copy in sync with the latest revision in the repository.\n\nLet\
    \ us view all of the Subversion subcommands using the help command\n\n```\n[root@inblr-pnos\
    \ swamay]# svn help\nUsage: svn [subcommand] [options]\nArguments:\n  add [praise,\
    \ annotate, ann]\n  blame\n  changelist\n  checkout (co)\n  commit (ci)\n  log\
    \ (ci)\n  delete [remove, rm]\n  diff\n  export\n  help (h)\n  info\n  import\n\
    \  lock\nlock\n  merge\n  move (mv, rename, ren)\n  mkdir\n  propel (pdel, edit)\n\
    \  propedit (edit, pe)\n  proplist (plist, pl)\n  post (pert, ps)\n  status (s)\n\
    \  version --quiet to see the version number.\n```\n\nAvailable subcommands:\n\
    \n![](img/f32545dac69fddf8c1433ae8405b11b8_49_0.png)"
