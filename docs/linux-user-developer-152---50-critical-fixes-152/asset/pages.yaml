    # Judging GNOME


    I read from Matt posed a couple of issues ago he was wondering why he hates GNOME
    3.6. It was a little disappointing to read the admission that GNOME has no changes
    since the 3.0 launch – which is so much better than then there was an entry on
    the web that I searched Google for to refer to Linux User! At the time I wrote
    this piece, GNOME 3.6 has just been released and we have a fantastic new set of
    features in the desktop environment, including a calendar, visual plus polish
    almost everywhere. We should move from the past and judge GNOME as it is today.


    # Simon Jansson


    It''s very interesting pointed, Simon. Many of the grievances that the GNOME 3
    launch were dealt with in milestone releases


    and the desktop is now very, very different from the one that was seen with the
    dated articles and comments that GNOME seems to follow (like the dated 2011-2012
    GNOME and WEDE places). GNOME 3.16 on its merits, it''s a very pleasant user experience
    and much more stable now.


    As you mentioned, the new apps are looking promising as well: Calendar has been
    missing for a long time, while the E-reader and social web apps would be welcome
    and handy additions to the projects. Throw in the new-look face interfaces and
    things like those hidden colliders, and GNOME 3.16 really to have thrown off the
    shadow of its troubled past.


