    # # Next-gen Vulkan API to transform Linux graphics


    # ## Low-overhead GPU access to alongside OpenGL


    The Kronos Group, which is responsible for the OpenGL and OpenCL programming interface
    (API) standards, officially announced its next-generation API, Vulkan, known as
    the Next-Generation API.


    Supporting multiple platforms, including Linux, Vulkan is designed to reduce the
    API overhead in existing graphics and GPU-driven systems. Compared to work carried
    out by AMD for OpenGL, the vendor-agnostic API enables multi-threading capabilities
    to boost performance on many-core systems, from embedded and mobile all the way
    up to the desktop and server.


    to billions of GPUs today and will continue to be evolved and maintained to meet
    industry needs.


    Described by AMD – which has told developers to abandon its own API in favor of
    cross-vendor alternatives like – Vulkan – as exciting low-overhead capabilities
    enabling compelling increases in performance and power efficiency, while maintaining
    developer freedom.


    The new API also has an impact on OpenGL, the Group''s standard on a graphics
    processor, which it shares core intermediate language technologies.


    ends emit programs in a standardised format for ingestion by the Vulkan or OpenCL
    drivers.


    “Industry standards APIs like Vulkan are a critical part of enabling developers
    to bring the best experience on multiple platforms,” claimed Newell Newell, CEO
    of Valve, as a platform for gaming through a custom distribution he has dubbed
    SteamOS, on low-cost pocket computers called Steam Deck members are working to
    ensure that this high-performance graphics interface is made available on all
    component of SteamOS and future Valve games.


    The result of this shared technology is SPIR-V, a new Standard: Portable Intermediate
    Representation (SPIR) technology first used in OpenGL and designed to split the
    compiler chain into high-level front-


    Launched at the Game Developers Conference GDC in San Francisco, Vulkan is due
    to be a set of features and implementations later this year with developers to
    participate in its evolution across the Vulkan Feedback Forum at khronos.org.


    A significant Kronos initiative to provide developers the choice of state-the-art
    API that is open and portable across platform diversity is,” explained Martin
    Nevrett, of the Kronos Group and vice president of graphics processor at NVIDIA,
    as development of 3D APIs standards complements OpenGL and OpenGL ES, that between,
    process


