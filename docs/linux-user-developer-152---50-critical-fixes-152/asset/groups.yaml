    # 下一代 Vulkan API 将变革 Linux 图形


    ## 与 OpenGL 并行的低开销 GPU 访问


    负责 OpenGL 和 OpenCL 编程接口（API）标准的 Kronos 组正式宣布了其下一代 API——Vulkan，被称为下一代 API。


    Vulkan 支持多个平台（包括 Linux），其设计旨在减少现有图形和 GPU 驱动系统的 API 开销。与 AMD 为 OpenGL 所的工作相比，这种跨厂商
    API 实现了多线程能力，能够提升多核系统的性能，从嵌入式、移动设备到桌面电脑和服务器。


    目前拥有数十亿个 GPU，并将继续演进和维护以满足行业需求。


    AMD 提到已建议开发者放弃自己的 API，转而使用像 Vulkan 这样的跨厂商替代方案——这种令人兴奋的低开销功能在显著提升性能和能效的同时，保持了开发者的自由度。


    新的 API 对 OpenGL（该小组的处理器标准）也有影响，它共享了核心中间语言技术。


    以标准格式输出程序，供 Vulkan 或 OpenCL 驱动使用。


    “像 Vulkan 这样的行业标准 API 是让开发者在多个平台上带来最佳体验的关键，”Valve 首席执行官 Newell 称，通过一个他命名为 SteamOS
    的自定义发行版作为游戏平台，对于名为 Steam Deck 的入门口袋电脑，成员们正在确保这种高性能图形接口可以在所有 SteamOS 组件和未来的 游戏中使用。


    这项共享技术的结果是 SPIR-V，一种新的标准：可移植中间表示（SPIR），该技术首次用于 OpenGL，旨在将编译器链拆分为高级前端——


    在旧金山的游戏开发者大会（GDC）上，Vulkan 将于今年晚些时候推出功能和实现，让开发者参与到其演变之中。

