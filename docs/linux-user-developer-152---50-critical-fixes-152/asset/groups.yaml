    Sometimes the graphical display, will freeze and you might be unable to do anything
    as result. Additionally, it could become hard to restart the system to get out
    of it. Performing a hard reset or simply waiting it out, you can always switch
    to the command line and try to fix things there. To so you need your normal username
    and password to access all of.


    If you had to get to command line for some reason, as advised in Tip 48, you can
    also return to the original graphical desktop which can run on F3, as well, which
