    # 问题与解答


    解决您所有的技术问题


    # 由于 Linux Mint 基于 Ubuntu 开发，因此 PPA 将可以工作


    我最近升级到了 Linux Mint，并且非常喜欢使用 Cinnamon 桌面的体验。但是，我在想我是否可以在 Mint 中使用 PPA 来运行 Netflix
    呢？因为未知原因，该网站没有让我通过浏览器进行流媒体。谢谢。


    请遵循屏幕上的说明操作以确保其正常工作。我们喜欢使用 pipelight/stable PPA。


    # 邮件通知


    你知道任何软件可以在 gmail 账户有新邮件到达时通知我吗？我正在使用 Thunderbird 邮件，另一个用于 Yahoo，所以我知道什么时候收到了新邮件。现在的问题是
    Windows Messenger 协议断开了，aMSN 也不再能工作了。


    ![](img/f32545dac69fddf8c1433ae8405b11b8_90_0.png)


    Kieron Williams


    由于 Linux Mint 基于 Ubuntu 开发，只要它支持 Ubuntu，Netflix 已经在网站上启用了浏览器支持，因此你不需要特殊软件，只需尝试打开即可。


    KDE 邮件检查器上方具有高度可定制性


    如果你想使用旧路径，添加 PPA 应该没有区别。只需使用你之前的相同命令行即可。


    它会在悬浮图标上显示邮件总数，当你将鼠标悬停在上面时可以获取更多详情。你还可以添加弹出消息和警报声。


    基本上，我需要一个程序或桌面小组件，当我在 Web 服务收到新邮件时通知我，并显示每个收件箱的未读邮件计数。有这样的应用吗？


    如果你在使用 KDE，一个名为 kplasma-mail-checker 的通知应该也能解决问题，它同时支持 POP 和 IMAP。


    ```

    $ sudo add-apt-repository ppa:[ppa name]

    ```


    Kelly


    如果你的账户支持 IMAP，你可以使用 ImpQuickCheck，它对我们很好用。


