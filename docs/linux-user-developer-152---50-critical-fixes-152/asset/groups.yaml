    ## Feature 50 Critical fixes


    ## 39 STOP A SOFTWARE RAID


    If you need to stop an raid software RAID for whatever reason, make sure you take
    any files you want off the device. Once that''s done, and assuming you are using
    md0 drives and sda, you can disable it.


    ```

    $ mdadm --stop /dev/md0

    $ mdadm --remove /dev/md0

    $ mdadm --remove-block /dev/md0

    $ fsck -d /dev/sda | fsck /dev/sdb

    ```


    ## 40 HARD DRIVES FILLING UP


    If you think your drive is filling up a bit prematurely then you should check
    some of the temporary files. Empty any trashcan-style location you have and give
    the cache of your browsers a clear. A quick scan around the home folder for anything
    you may have missed too.


    ## 41 NEED TO CREATE A PARTITION TABLE


    This is usually affects hard drives that have been in many different systems than
    reuse, but sometimes you will need to create a fresh partition table. The easiest
    way to do this is to use GParted and add it manually in Device/Create Partition
    Table.


    ## 42 FRAGMENTED LINUX DRIVE


    Ext filesystems like Linux, and NTFS, have ways of keeping files from fragmentation.
    However, it''s not perfect so fragmentation may occur. You might need defragmentation
    tools for Linux, such as sourceforge.projects/defragfs which will help you avoid
    unwanted fragmentation.


    ![](img/f32545dac69fddf8c1433ae8405b11b8_23_0.png)


    ## HDD FIXES


    There are a few things you may need to maintain a hard drive


    ## 43 RECOVER YOUR DATA


    One of the best fears of computing is losing all your important data - that''s
    why there are no backup solutions at varying levels of service and security. You
    just need to prepare for the worst, and be able to recover from a hard drive.


    TestDisk(www.cgsecurity.org/wiki/TestDisk) has functions to undelete files and
    recover a lost partition table. It might be later due to the nature of the recovery,
    and all you need to do it on the problematic system (if an installed drive), by
    moving to the folder and typing testdisk-static.com


    From here you can click and select a partition to try and recover. After a scan
    it will show the partition table and type you can confirm if it is known to be
    different. Then you can Analyse to see if there is partition error, do a quick
    search to find any missing files and restore the partition.


    For undeleting files, you can choose the Advanced option instead of Annex, select
    a partition to work on and will undelete all the deleted files and moves them
    to a specified location.


    ## 44 ADD MORE SPACE


    There are ways to do this. One of easiest is to format and maintain maintenance
    to add a new hard drive into your system or whether it''s needed. This way, the
    original drives are unused and you know it still will from there. Otherwise, you
    can clone the hard drive using Clonezilla(http://clonezilla.org/) and restore
    it to a bigger, hard drive and then extend the Linux partitions into available
    space.


    ## 45 OUT OF VIRTUAL SPACE


    If you''ve set a virtual machine in VirtualBox for testing, it''s not uncommon
    if you''re enough enough to run out of virtual space, even if you have a fair
    amount that was much allocated. You cannot extend it your hard drive, but you
    can create more space to use. By Go to Settings/Storage and add a hard drive to
    the SATA controller. Boot into your VM and find the devices, then connect it to
    a necessary directory to increase storage.


    ## GRAPHICAL PROBLEMS


    Sort out your drivers and modules, and learn how to exit X


    ## 46 VIRTUAL DISPLAY


    When you set up a virtual machine in VirtualBox, you will find that the display
    does not completely fill your screen. While this can be changed on live discs,
    if you installed and configured a virtual machine then you can add modules that
    enable you to use a better resolution. In VirtualBox, go to the Devices menu and
    click Guest Additions. It will download an ISO that you need to install the new
    kernel modules and then use the full-screen resolution as wish.


    ## LINUX ANSWERS FOR LINUX QUESTIONS


    The problems we''ve covered in this article are ones we feel are fairly common
    and universal to all forms of Linux. However, if you''re coming across an issue
    that is much more specific to your setup, your first line of defense should be
    a careful search online. If you are finding nothing, your best bet is to check
    LinuxQuestions.org, which has an excellent community of experts ready to help
    with answers to your problems. Hopefully, it will never come to that.


    ![](img/f32545dac69fddf8c1433ae8405b11b8_24_0.png)


    ## 47 INSTALLING DRIVERS


    Graphics drivers Linux come in two — restricted drivers that are downloadable
    or come with a distro such as Ubuntu, and reverse-engineered drivers such as Nouveau.
    Usually, if you''re having some of graphics issue, the first thing to do is try
    switching between these two drivers. To download the proprietary ones, that are
    the AMD, NVIDIA or whatever device you use and either the auto-detect tool or
    select the driver manually. They go through another installation method, which
    is a good first step to graphical issues.


    ![](img/f32545dac69fddf8c1433ae8405b11b8_24_1.png)


