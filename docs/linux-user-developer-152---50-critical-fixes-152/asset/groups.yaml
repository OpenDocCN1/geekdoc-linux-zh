    # # My Pi Project


    ![](img/f32545dac69fddf8c1433ae8405b11b8_64_0.png)


    # # Pi Glove 2

    ## Dan Alfred''s new home module controls lights, sends texts and can read out
    the text on photographs


    **What physical modifications have you made since we spoke?**

    The glove is more portable - previously, it fits in the pocket and now you have
    the attached claws. The cats glove has been stripped back and several layers have
    been replaced with sensors to replace the tactile switches. These are metal and
    when one makes a touch with the thumb, the same functionality is achieved with
    five wires as to the previous ten. I upgraded from a B+ to the A+ model which
    means that the Raspberry Pi is now smaller and more stable. Now we only need to
    run wires from the finger to the wrist. The module is also embedded within the
    glove.


    the camera can now be positioned in a direction that the user wants, is more accessible
    and you could even take a selfie with it. I used a Python OCR library to read
    the ''original'' OCR text and by combining this with the image I could identify
    the text in the picture. I tried various file formats - JPG and PNG both seemed
    to work well. Also, changing the the picture to black and white to pick up details
    and delete noise improved the results.


    **Are you currently developing any new modules for the future?**

    The current module I am working on features heart monitor and will take their
    heart rate, change their music and upload the details to a social media site.
    This site will be free for anyone interested in the project. I also want to add
    buttons to your workout music to change the heart rate and then convert it to
    a text that current apps can open on phones and watches to send it to your friends.


    **What functions does the glove have?**

    It was my plan to build the Pi Glove with ''modules'' for various uses, starting
    with assistance help. If you did or not struggle with a disability like visual
    impairment, the Pi Glove now enables you to see the text, which is read out and
    can be sent to your phone. If required, an emergency text can be sent to a carer,
    family member or the benefit of other medical assistance. The fourth module takes
    a picture of you, for example, OCR is then used to recognise what you are doing.
    I decided to add the Pi camera to the back of the hand - in order to enable even
    more of its use


    The second module sends the text on the glove using the built-based communication
    API, which allows you to send a message without requesting assistance. This could
    be done by others, such as the police in emergency situations. The current time
    is also to the text


    I want to turn lights on and off. Once installed I can control up to five electrical
    radio-controlled sockets, using a module that connects directly to the GPIO, which
    can be controlled by either input or outputs using your own Python script. I simply
    mapped the ''on'' state to the light of the button and turned it on from your
    finger!


    I also like the idea of linking the glove to something smart, but that would be
    moving away from the original aim, which was to prepare the text itself. The glove
    enables you to click and drag.


    **Dan Alfred**

    A curriculum student at an IT comprehensive college and the lead-coordinator for
    the project.


    **Like?**

    To learn more about the Raspberry Pi Glove and home module help, check out the
    Pi project pages on YouTube (PiGlove) and Twitter (@PiGlove).


    **Further reading**

    If you''re interested in setting up character recognition for your own project,
    check out this guide on Raspberry Pi Computing: https://www.raspberrypi.co.uk/python-ocr.html


    > The Pi camera takes a picture of a sign. OCR is then used to recognise and store
    the text, which is read back to you


    # **What would you like to do next?**


    I was introduced to the Pi camera via Python.org, which has a range of features
    and is much easier to use. The Pi camera is a small electronic circuit board that
    runs on a low-level Python system that can be used to control all of different
    devices.


    I want to find an area that can be reduced - I am looking into how smaller the
    components are, the more natural the glove will feel.


