    # Microsoft adds Linux kernel to Visual Studio


    Microsoft, in its latest however-relationship with open source in general, has
    released its first IDE to use Linux as a base kernel.


    In addition to nearly-Windows targets, the Linux-based platform from Visual Studio
    2015 supports the ability to create projects for Linux as a target operating system
