    \ 0 | 它并不是你遇到过的最快的 | 0 |\n| 总体 | 相当实用的工具，某些功能需要一些时间来掌握 | 6 | 对于需要 Scope 的用户值得尝试，否则不值得浪费\
    \ | 9 | 本组的明显获胜者——强烈推荐使用 | 遗憾的是，Pastie 功能缺失不足以保证可靠 | 8 |\n\n## 优胜者是... \n\n##\
    \ CopyQ\n\nCopyQ 是本月的冠军——我们建议你现在就安装这一个，无论你如何看待它，它都会提高你的生产力。它是迄今为止最好的工具。\n\n在日常使用方面，它的表现优于\
    \ Clipt 和 Diodon，因为它支持大型且可搜索的列表——这是使其变得极易导航和组织的关键因素。简单地滚动应用栏是第一项功能，而一个可以用来浏览和重新排序历史记录的桌面窗口是第二个功能，CopyQ\
    \ 通过引入标签和搜索增加了第三项功能。除了这些之外，你还可以对剪贴板进行分类以便查找——你甚至可以拥有一个装满预加载剪贴板的画廊文件夹。它还有许多你经常使用的命令——你可以使用不同的分隔符来分隔不同的文本片段——这在复制和粘贴时非常节省时间。\n\
    \n另一个很棒的功能是 Clipt 接近第一个自由编辑剪贴板的工具。如果你保存了一段文本，可以在文本编辑器中打开并更改所有内容，包括格式。\n\n![](img/f32545dac69fddf8c1433ae8405b11b8_81_0.png)\n\
    \n| 通用 | 历史记录 | 类型 | 项目 | 外观 |\n| --- | --- | --- | --- | --- |\n| 背景颜色 | | 深色主题\
    \ (GTK-2 编辑) | | | |\n| 搜索字符串至: | | | | | |\n| 选中 | | | | | | |\n| 排序 | | 从...复制和粘贴\
    \ | | | |\n| 编辑 | | | | | | |\n| AltKey | | | | | | |\n| 备用 | | | | | | |\n| 备注\
    \ | | | | | | |\n| 历史记录 | | | | | | |\n| 通知 | | | | | | |\n| 示例 | | | | | | |\n\
    | 示例 | | | | | | |\n| 示例 | | | | | | |\n| 示例 | | | | | | |\n| 示例 | | | | | | |\n\
    | 示例 | | | | | | |\n| 主题 | | | | | | |\n| 主题 | | | | | | |\n| 主题 | | | | | | |\n\
    \n- 在颜色中自定义界面并切换格式样式\n\n你可以为剪贴板条目添加备注，这使得在将来记录你何时使用过它们变得非常容易。事实上，你可以在界面内完全调整剪贴板的外观，甚至可以到限制列表中权重和图像最大像素高度的设置，你可以看到\
    \ CopyQ 是如何围绕易用性设计的：\n\n我们仅仅触及了脚本能力的皮毛，而 CopyQ 仍然是明确的获胜者。但对于那些有更特定需求、希望将剪贴板粘贴到命令行操作中的用户来说，这些操作不仅强大而且文档完全。花些时间学习使用\
    \ CopyQ，你将不会失望的。\n\n> * Gavin Thomas\n\n![](img/f32545dac69fddf8c1433ae8405b11b8_81_1.png)\n\
    \n## RasPi\n为树莓派制作者的数字杂志\n\n![](img/f32545dac69fddf8c1433ae8405b11b8_82_0.png)\n\
    \n在树莓派上使用加速度计\n为下一个树莓派项目添加技术，让它脱颖而出。\n\n## RasPi\n上手实践你的树莓派\n操作系统\n超级测试\n\n免费样例期号\n\
    \n构建一个智能闹钟\n\n## RasPi\n上手实践你的树莓派\n免费\n制作一辆 PI 越野车\n由树莓派的力量控制\n\n对于那些有更特定需求、希望将剪贴板粘贴到命令行操作中的用户来说，这些操作不仅强大而且文档完全。\n\
    \n[linuxuser.com/linuxUser #RasPi 测评剪贴板](https://linuxuser.com/linuxUser #RasPi)\n\
    \nUbuntu 15.04 测评\n\n![](img/f32545dac69fddf8c1433ae8405b11b8_83_0.png)\n\n##\
    \ 存储\n是否值得？\n\n如果你一直在关注它，Ubuntu 15.04 终于做了切换。它是真正的良方还是另一种不同的处理方式？\n\n在你读到本文时，Ubuntu\
    \ 15.04 的正式版本将发布。这个 Beta 版本处于 Alpha 和正式版之间，它对 Unity 并没有大规模重写，但带来了许多添加和变化。\n\n\
    Unity 上的某些改进现在是显而易见的，现在是它处理窗口的方式比以前要好得多。默认情况下，现在新工具栏在非全屏时会停靠在窗口上，使得工作流更加自然。\n\n\
    在外观上，除了窗口方面的主要区别外，这确实是你使用 Ubuntu 方式的唯一不同。深入研究后，我们会发现 Ubuntu 15.04 的重大变化在于它切换了\
    \ int。被它替换的 Upstart 看起来像是一个 Ubuntu 的负担。系统使得它比以前更加好用，没有了 Unity 围绕的那些争它。\n\n这种变化对普通用户的体验的影响很小。除非系统中的网络安全漏洞得到了解决，且性能确实相同。对于开发者来说，它仍然运行良好，没有任何\
    \ Ubuntu 的杂质——在这种情况下是。\n\nUbuntu 15.04 算是一个相当标准的 Ubuntu——它看起来更好，对大多数用户来说更好用一点，但对少数人来说仍然有些困难。也许是时候学习如何使用系统了。\n\
