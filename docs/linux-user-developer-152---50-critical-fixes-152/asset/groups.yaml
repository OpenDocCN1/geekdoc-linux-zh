    # DS115d 和 DS215

    你家庭的完美数据存储解决方案

    在家里舒适且安全的环境中运行你自己的个人云


    ## 省电且可靠

    DS215j 配备双核 CPU，支持高达 12TB 的数据，活跃状态下功耗低于 14w；而 DS115j 则为无需 RAID 的用户提供稳定的存储环境，活跃状态下功耗低于
    1w。


    ## 随时随地访问

    Synology NAS 和直观的 DiskStation Manager (DSM) 软件允许用户在多个设备之间同步和共享文件，包括 Windows PC、Mac、Linux、iOS、Android
    和 Windows Phone。


    ## 多媒体中心

    Audio Station、Photo Station、Video Station 和 Media Server 将你的 Synology 变为一个多媒体中心。


