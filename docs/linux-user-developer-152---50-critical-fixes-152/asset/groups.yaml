    \ shade of questionable inspiration.\n\nThat is to say that Ubuntu for Phones\
    \ is a missed opportunity. However, it plunders numerous rivals for platforms,\
    \ from MeGo and Sailfish to Touch, all in support of the operating systems mentioned.\n\
    \nA Scope in Ubuntu for Phones, is designed to pull information from multiple\
    \ sources into a single screen for at-glance viewing. The default shows current\
    \ weather, calendar entries and recent messages, and a swipe left switches to\
    \ the NearBy Scope, which uses your location to search for landmarks around you.\
