    ## THE FREE SOFTWARE

    ### The GPL goes to court


    Christoph Hellwig, a Linux developer has taken VMware to court in Germany. The
    contention between Hellwig and Software Freedom Conservancy (SFC) is following
    Hellwig in action, as VMware''s ESXi use of code licensed under the GPLv2. Software
    Freedom alleges that VMware has copied copyrighted and the evidence indicates
    that code was developed by modifying Linux code in tandem with ''vmkernel''.


    The goal of the lawsuit is to ensure that VMware complies with the terms of the
    GPL, which requires developers to release the source code of any derivative works.
    If VMware loses, it may be forced to release the source code for ESXi. If it wins,
    it may be allowed to continue using the code as it is.


    The case is a significant one for the open-source community, as it could set a
    precedent for how the GPL is enforced in the future. It also highlights the importance
    of open-source licenses and the challenges of enforcing them in the face of large
    corporations.


