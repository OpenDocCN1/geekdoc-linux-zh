    # Test network speed using Netcat


    This is a relatively tricky use of Netcat, but it is handy when you don''t have
    any other tool to test the network speed between two machines. For this work you''ll
    have to use the netcat-traditional pattern.


    Now, on the machine you will execute the following command:


    ```

    $ time -oc -vv -n -l 2222 >dev/null

    ```


    On the client machine, execute the next command and Ctrl+C after about 15 seconds
    to make:


    ```

    $ time |y | nc -vn 192.168.2.4 2222 >dev/null

    ```


    Using the utility, you will find out the network speed is 1,088 bytes per second,
    which is absolutely perfect for a 10MB wireless network.


    # Transfer directories using netcat


    You have already learned how to transfer files using Netcat. Now, you will learn
    how to transfer whole directories. With the help of tar the command will part
    the following:


    ```

    $ tar -cvf directory | nc -l 1234

    ```


    The client should be as follows:


    ```

    $ nc localhost 1234 | tar -xvf -

    ```


    # Encrypt a netcat connection using encrypt


    Transfering in plain text is not secure and can cause problems. If you use encryption,
    a lightweight version of Netcat that supports TLS encryption. On an Ubuntu system,
    install follows:


    ```

    $ sudo apt-get install encrypt

    ```


    Now, you are ready to start using encrypt. The server part looks like this:


    ```

    $ encrypt -k passphrase -1 -p 12345

    ```


    The client should run the following:


    ```

    $ encrypt -k passphrase -l 12345

    ```


    If you provide a wrong password with -k parameters, the connection will automatically
    terminate. If you want to make sure that your data is actually encrypted, you
    can use a tool like Wireshark or Tcpdump to find and see the results.


