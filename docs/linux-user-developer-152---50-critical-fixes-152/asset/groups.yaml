    PPA.


    # Mail notifications


    Do you know any software that notifies when a new email arrives to a gmail account?
    I''m using mail Thunderbird and another for Yahoo, so I know when I get new email.
    The problem is now that the Windows Messenger protocol disconnects, aMSN does
    not work anymore either.


