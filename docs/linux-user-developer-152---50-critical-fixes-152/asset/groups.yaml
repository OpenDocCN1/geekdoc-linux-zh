    # 发行版 Fedora 可能会转向原子化安装


    Fedora 工程师团队经理 Paul Freed 表示，该发行版将考虑红帽的 Atomic 项目，以便为更频繁更新系统的用户提供更便利的服务。


    “Atomic 让交付独立且经过验证的内容集变得更加简单，”Freed 在向工程团队发帖时写道。Atomic 基于 `rpm-ostree`，它可以防止已安装系统中的内容自我修改，这指的是限制在发布后进行更新的配置的倾向。


    Freed 完全代表了 Fedora Core 的立场，声称它已经终结，且不会再回来。


    Fedora 在其 2007/7 版本中删除了“Core”字样。


    # 硬件

    ## Nvidia 推出新款 DevBox


    ### 基于 Ubuntu 的深度学习桌面电脑


    显卡巨头 Nvidia 宣布推出 DevBox，这是一款专为为深度学习设计的桌面级高性能计算（HPC）设备。DevBox 支持最多四块 GeForce Titan
    X 显卡，提供 128GB 显存和七核心处理器。这些设备支持最高 64GB 的 DDR4 内存和 Intel Core i7 处理器。


    系统的核心在于本身，这是一个围绕 Nvidia CUDA GPU 平台构建的交互式深度学习训练系统。架构师 Simon Oclajden 在发布会上表示：“Nvidia
    让为特定任务设计最佳软件变得更加简单。”


    高端 DevBox 正在向“合格的深度学习研究人员”销售，起价 15,000 美元。官方提供了更多关于如何使用现成组件构建 DevBox 的细节，并提供 DevBox
    的免费下载版本。


    # 开源

    ## LibreOffice Online 项目复活


    ### Docs、Office 365 的开源替代方案


    Collabora 是全球最大的 LibreOffice 工程师团队，他们宣布与消息服务建立合作伙伴关系，通过 LibreOffice-Online 项目将开源办公套件扩展到
    Web 端。


    Collabora 于 2011 年启动了 LibreOffice 项目，旨在创建一个针对浏览器内使用优化的渲染工程项目。LibreOffice Online
    旨在为消费者和企业用户提供 Microsoft 365 的免费开源替代方案。LibreOffice Online 安装在中央服务器上，用户可以在任何符合 HTML5
    标准的浏览器中进行文档编辑，而无需安装安装任何软件。它还将将 LibreOffice 的所有功能扩展到云端，并添加许多用户请求的功能。非营利组织 Document
    Foundation 维护着 LibreOffice 项目。“未来，LibreOffice 用户将能够在任何地方访问该服务，从移动端到云端无需离开他们选择的免费软件环境。”


    Iowarc 在寻求将其 Microsoft Exchange 替代消息平台扩展到办公领域时对该项目产生了兴趣。“我们看到用户正在寻找替代方案，我们为 Iowarc
    提供了他们需要的，”Google Apps 协作部门及网站负责人 Adam Pasci 说。


    “作为一家公司，能够为我们自己需要的东西工作总是令人满意的。”两家公司均未提供该项目上线的时间表。


    10


    # 容器

    ## 红帽与 Docker 合作构建软件栈


    ### 认证的端到端容器生态系统


    红帽宣布与 Docker 建立合作伙伴关系，引入了据称首个针对 Linux 容器标准的端到端生态系统。


    在该公司计划下，Red Hat Connect 的参与者可以获得红帽容器开发工具包（Red Hat Container Development Kit）的使用权限。这提供了一个为红帽生态系统构建基于
    Docker 容器的工具和资源。这些还包括红帽容器所需的工具，旨在确保容器内容由可靠源提供，且容器本身安全并不受已知漏洞影响。该公司证实，该认证将与红帽安全的端到端容器生态系统兼容。红帽现在在启用
    Linux 容器方面处于领先地位，从开发到部署红帽总裁 Courmael 在发布会上提到红帽 Registry，这是联邦和标准化容器仓库的首次实现。


    ![](img/f32545dac69fddf8c1433ae8405b11b8_10_0.png)


    # 开源

    ## 数字化意大利政策推动


    ### 数字化意大利政策推动开源


    意大利政府宣布了一项鼓励在行政管理中使用开源软件的政策。其目标是增加透明度、降低成本并避免供应商锁定。该政策规定政府机构应优先考虑解决方案。


    意大利政府还计划通过资助和培训支持开源开发。这有助于建立由开源开发者和公司组成的生态系统。该政策还对政府项目使用的开源软件提出了文档记录要求。


    从长期来看，政府希望在公共部门培养开源协作文化。


    ![](img/f32545dac69fddf8c1433ae8405b11b8_10_1.png)


    # 开源

    你的 Linux 源码与观点

    ## 自由软件

    ### GPL 进入法庭


    Linux 开发者 Christoph Hellwig 在德国起诉了 VMware。Hellwig 与软件自由基金会（SFC）之间的争议源于 SFC 的行动，因为
    VMware 的 ESXi 使用了根据 GPL2 许可的代码。软件自由基金会指控 VMware 复制了受版权保护的证据表明代码是通过修改 `vmkernel`
    同时开发的。


    诉讼的目标是确保 VMware 遵守 GPL 条款，该条款要求开发者发布任何衍生工作的源码。如果 VMware 败诉，可能被强制发布 ESXi 的源代码。如果胜诉，它被允许继续使用这些代码。


    此案对开源社区具有重要意义，因为它可能为未来如何执行 GPL 设置先例。它也强调了开源许可证的重要性，以及面对大型公司时执行这些许可的挑战。


    ![](img/f32545dac69fddf8c1433ae8405b11b8_11_0.png)


