    # Linux 用户信函


    您对本杂志以及开源软件的意见


    ## 微软的？


    这里，我有一个关于 Windows 10 的问题……有人告诉我，为 Windows 10 设计的新机器可能会锁定在该操作系统上，从而防止人们在上面使用 Linux。到底为什么会这样——我以为
    Linux 现在是免费的了。


    Caroline W


    你好，Caroline。这源于在中国深圳的 WinHENCE 大会。下方的演示有一张幻灯片详细说明了官方决定，在写稿时，微软对 Arch Theo（第一个告诉我的人）提出的关于
    Windows 10 中 UEFI 启动的问题尚未做出回应。基本上，当 Windows 8 发布时，OEM（原始设备制造商）可以在笔记本电脑上应用安全启动（Secure
    Boot）。安全启动最难替换的标识要求之一是 BIOS，但对于 Linux 用户来说，安全启动它需要正确的加密签名。你不能告诉我，市上的许多发行版仅仅因为
    Linux 是免费的就无法在这些机器上运行。微软表示，每台机器都必须有一个用户可以使用来禁用“需要安全启动”的开关。


    ![](img/f32545dac69fddf8c1433ae8405b11b8_93_0.png)


    上面的项目构建可以在 libreoffice-from-libreoffice.com 找到


    根据这次 WinHENCE 演示，Windows 10 的问题在于，与其说是合规，该开关现在是设备制造商的唯一选择。这将使得在 Windows 10 机器上运行
    Linux变得可能，除非开源主内核也这样做，特别是由于发行版往往会绕过安全启动。如果 OEM 支持支持者的意愿降低，这对于 libreoffice 的开发者和用户来说将变得困难得多。


    你好，Miles。显然，我们预计在 2016 年左右在 Linux 上看到像 LOLC 一样的 LibreOffice（推测自由是为了避免一个尴尬的缩写词）。


    最近，LibreOffice 和 Collabora 审查了一个项目，前者是最大的 LibreOffice 项目之一，后者则带来了许多令人兴奋的新功能和生产力工具。随着这两家公司将它们的经验投入到让
    LibreOffice 适用于 Windows 10 使用的挑战中，现有的转换项目引起了巨大的期待。


    ### UEFI 启动与 TPM


    | UEFI 安全启动 |

    | :--- |

    | 安全启动是一项允许计算机仅使用由原始设备制造商（OEM）信任的软件启动的功能。 |

    | UEFI 安全启动专为 Windows 设计作为 BIOS 的替代品，但对于 Linux 用户来说，它需要正确的加密签名。 |


    针对 TPM 2.0 已经发布了新的实现方案，允许用户注册自己的密钥和证书以支持 Linux 安全启动。


    上述将允许 OEM 决定是否包含一个禁用安全启动的开关。


    ## LibreOnline


    我最近对 LibreOffice 在线版本的开发感兴趣。这在 2011 年宣布过，但该项目已经静默了一段时间。现在该项目已经经过修订——你知道我们预计什么时候能看到网页版应用吗？


    Miles


    这真的是非常棒的消息，因为这意味着我们终于可以在一年左右后在 Windows 上使用 LibreOffice——该项目并没有消失。在我们的选择仍限于科技三巨头提供的服务——Office
    365、iCloud 版 iWork 和 Google Drive 应用之时，这可能会改变现状。


    ![](img/f32545dac69fddf8c1433ae8405b11b8_94_0.png)


    ![](img/f32545dac69fddf8c1433ae8405b11b8_94_1.png)


    ![](img/f32545dac69fddf8c1433ae8405b11b8_94_2.png)


