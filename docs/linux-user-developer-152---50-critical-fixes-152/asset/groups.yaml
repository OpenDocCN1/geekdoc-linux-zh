    +   12 Go wireless

    We understand that not everyone has an ethernet cable near their TV, so it might
    be a good idea to invest in a Wi-Fi adapter instead. There is a great list of
    compatible Wi-Fi adapters on the elLinux wiki elinux.org/RPI_VerifiedPeripherals.


    +   13 Mouse and keyboard

    Now that we have the Raspberry Pi ready to be booted you should look at your controller
    situation - do you want to be limited by the wires or do you want a wireless solution
    instead? We will cover controller solutions over the next


    +   14 Get for SSH

    If you want to create and apply scripts to Minecraft via the network rather than
    doing it straight on the terminal, find out what the IP address is by using ifconfig,
    and then you can access the Pi in the network computer using the following:


    # 3D-print a case


    Aaron Hicks from Solid Technologies designed this Minecraft case for Raspberry
    Pi and GradCAD. We have slightly modified the version to fit these issues. All
    you need is send the STL file to a professional printing service - many high-end
    printers have at least a Base that they will print the case for you. It should
    cost around £15.


    +   10 The correct case


    In this scenario, we are hosting this Raspberry Pi up to a TV, which means it
