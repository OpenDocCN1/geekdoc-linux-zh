    # Usage


    # Usage


    You can enable primary selection to select the word without overwriting your currently
    copied clipping, and also set the two to synchronise. Cliplt can be launched as
    a diamon or without an application bar with -d and -terminal switches, and you
    can-check clipboard or primary items with -c -p. You can copy images, without
    without


    Again there is primary selection with the ability to synchronise this with the
    Ctrl+CV clipboard. A very nice thing is the ability to save images to the clipboard
    and retrieve them - Cliplt doesn''t add them to the history list. You can also
    disable the automatic clearing of clipboards on application switches, which is
    useful.


    # History


    # History


    On installation, you will find Cliplt stores the history in a plain text file
    which isn''t secure. Your history persists between application launches, which
    is handy when you need to use clippings. Up to 1000 items their appearance and
    order can be changed in the Preferences menu. Individual items can be edited or
    removed, and you can search the history.


    Diodon persists between launches, but it is less manageable than Cliplt. There
    is no history manager, so you''re limited to scrolling and using the application
    bar menu, but also to search or re-edit can''t customise the appearance of clipboards
    either, which is limited to displaying the first few words only. But it does have
    images.


    # Shortcuts


    # Shortcuts


    There are global hotkeys to show the main menu, the history manager, the history
    page, which all can be customised and work when Cliplt runs as a diamon or without
    an application bar, so you can paste any icon without losing control.


    There''s only one shortcut (Ctrl+Alt+V) to open the history. Unfortunately, this
    new menu is just the same thing that you get when you click the application bar
    icon, which saves it at least a few seconds. However, middle-click for pasting
    text still works, as it does with the other clipboard managers in this.


    # Extra Functions


    # Extra Functions


    You can customise the Exclude list to add and remove items that shouldn''t be
    recorded in the history. However, if you want to exclude a certain word, then
    entire entries will not be if they contain that word. You can also set up commands
    that can be run using copying text inside the application menu.


    Diodon is very much for integration with Unity and Docks, so you will get more
    out of it that. As well as being able to clear your history for the last hour,
    or week via the Security & Settings,. With this, you can install a plugin to use
    Diodon''s Unity Scope. With this, you can have your history with more control
    and a set of styles.


    # Overall


    # Overall


    Simple to use with a large enough history to make digging out old clippings possible,
    Cliplt is a daily-use tool. The extra functionality is worth investing further
    but will take some time to master.


    Despite the integration with the Unity desktop and its Scope, Diodon is lacking
    in features generally, even compared with the relatively basic Clip. Not being
    able to use the history list properly was the deal breaker.'
