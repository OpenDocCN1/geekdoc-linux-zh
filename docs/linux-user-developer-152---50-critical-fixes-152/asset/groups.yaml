    # OPEN SOURCE

    ## Digital Italy policy pushes


    ### Digital Italy policy pushes FOSS


    The Italian government has announced a policy to encourage the use of open-source
    software in public administration. The goal is to increase transparency, reduce
    costs, and avoid vendor lock-in. The policy mandates that public bodies should
    prioritize open-source solutions when possible.


    The Italian government also aims to support open-source development through grants
    and training. This is intended to help build a local ecosystem of open-source
    developers and companies. The policy also includes requirements for the documentation
    of open-source software used in government projects.


    In the long term, the government hopes to foster a culture of open-source collaboration
    within the public sector.


