    # Embedded designs join the Linux Foundation


    Cirrus Logic and Xilinx among newest members


    The Linux Foundation has announced three new members to its ranks, two of which
    will be familiar to anyone working in the field of embedded computing: Cirrus
    Logic and Xilinx


    Cirrus Logic is known for its analog and mixed-integrated circuit designs which
    are often used in audio devices, while Xilinx is one of the largest providers
    of field-programmable gate array (FPGA) devices in the world. Leading the industry
    in industrial systems,


    The Linux Foundation membership has confirmed this.


    > "We use Linux-based embedded OS for our customers," said Zach Petcher, leader
    of his company''s design to join the Linux Foundation. "We are excited to join
    Linux Foundation to better represent the needs of our embedded Linux customers."


    > "The use of Linux in embedded products has skyrocketed in recent years, with
    Linux now being


