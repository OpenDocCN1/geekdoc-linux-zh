  mdcn: "\n\n# 剪贴板管理器测评\n\n## 简述：我们的结论对比与分析\n\n| | Clipt | Diodon | CopyQ | Pastie\
    \ |\n| --- | --- | --- | --- | --- |\n| 使用性 | 包含基本功能并带有少量的终端控制 | 4 | 保存图像并禁用剪贴板清理\
