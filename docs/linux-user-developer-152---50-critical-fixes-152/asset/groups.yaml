  - '[PAGE 28]


    # We frequently found the handset entering a state where the pop-up keyboard refused
    to appear


    Sadly, the features Canonical promised as part of its failed Ubuntu Edge crowd-funding
    project have yet to be realised. There''s no support for a desktop interface that
    you can''t extend, nor an operating system which feels remarkably like an early
    build of Android - down to the icons used in the over-busy and crappy navigation
    bar, which pulls down to reveal a notification shade of questionable inspiration.


    That is to say that Ubuntu for Phones is a missed opportunity. However, it plunders
    numerous rivals for platforms, from MeGo and Sailfish to Touch, all in support
    of the operating systems mentioned.


    A Scope in Ubuntu for Phones, is designed to pull information from multiple sources
    into a single screen for at-glance viewing. The default shows current weather,
    calendar entries and recent messages, and a swipe left switches to the NearBy
    Scope, which uses your location to search for landmarks around you. A Scope of
    here is neat enough, but its current implementation feels lacking and forced,
    while the duplication between Scopes leaves you wondering if it''s enough of a
    gimmick to work an entire mobile platform.


    Lacking, in fact, is a good word to describe the operating system as it is. Ubuntu
    on the desktop needs a bit more time in the oven. During our test, we frequently
    found the pop-up keyboard refused to appear, when Wi-Fi - already limited to 2.4GHz
    network as a cost-cutting measure - would cause working altogether until the handset
    was restarted.


    The Ubuntu Store provides add-on, but its selections are sparse. Few brand-name
    packages are available and are a little more short than the competitor''s mobile
    website. With no compatibility for hardware applications, that makes using the
    Ubuntu Edition handset a further missed opportunity.


    Using Ubuntu on the Aquaris also means the handset requires an Ubuntu account,
    but with Canonical having shown cloud storage and backup features, it has no connection
    with Google Drive or iCloud. Had Ubuntu survived in anything but name only, perhaps
    using Ubuntu on a smartphone would be a more pleasant experience, but as it is,
    the constant rebooting is one of disappointment.


    # Pros


    A low price point makes the Aquaris E5 an affordable secondhand handset, and dual-SIM
    support is handy


    # Cons


    The software is simply not ready for prime-time use and the ecosystem is barren,
    with the cut-cutting nature of the handset


    # Summary


    Cheap, low-end hardware and a good operating system make the Aquaris E5 easy to
    recommend, but its price point has been better elsewhere. Ubuntu for Phones is
    likely to define a platform, but not one that lets you spend your hard-earned
    cash just yet.


