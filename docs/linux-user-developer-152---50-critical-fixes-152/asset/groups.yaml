    # Minecraft console


    ![](img/f32545dac69fddf8c1433ae8405b11b8_58_0.png)


    # 01 Choose your Raspberry Pi


    Before we start anything, everything we plan to do in this tutorial will work
    on all Raspberry Pi Model Bs with at least 512 MB of RAM. However, Minecraft:
    Pi Edition can ch along on the original Model Bs, so we suggest getting a Raspberry
    Pi 2 to get the most out of this tutorial.


    ![](img/f32545dac69fddf8c1433ae8405b11b8_58_1.png)


    # 02 Prepare your Raspberry Pi


    Minecraft: Pi Edition currently works on Raspberry Pi. We recommend you install
    a fresh version of Raspberry, but if you have an old SD card with it, the very
    least you should do is:


    +   - sudo apt-get update && sudo apt-get upgrade


    # 03 Prepare Minecraft


    If you''ve installed Raspberry from scratch, Minecraft is actually already installed
    – go to the Menu and look under Games. If you just updated your version of Raspberry,
    you can run it from:


    +   - sudo apt-get install minecraft-pi


    # 04 Test it out


    If you''ve installed Minecraft, it''s best to check if it works first. First launch
    the desktop; if you''re not inside run it with *startx* from the Menu. Minecraft:
    Pi Edition is limited in what you can do, but does it make room for more?


    # 05 Xsetup


    We have a fresh Raspberry install and/or you need to load the data into the desktop.
    If you''re still inside the desktop, open the terminal and run *raspi-config*.
    To Enable Boot to Desktop and choose Desktop,


    > If you''ve installed Raspberry from scratch, Minecraft is actually already installed
    – go to the Menu and look under Games to find it


    # 06 Set up Python


    While we are using Raspberry Pi for a better, we might well update Minecraft using
    Python for a later part of the tutorial. Open the terminal and


    ```

    $ cp /etc/minecraft-pi/python/minecraft ~/minecraft

    ```


    # 07 Minecraft at startup


    For this to work as a console, we''ll need to launch into Minecraft when it turns
    on. We can make it automatic by starting in the terminal and updating the options
    by typing.


    ```

    $ sudo nano /etc/xdsession/LXDE-pi/autostart

    ```


    # 08 Autostart language


    In here, you need to add @minecraft-pi on the bottom line, and save to make it
    work. This is a good thing if you also want any other programs to launch as part
    of the process.


    # 09 Turn off


    Now we can use the mouse and keyboard to shut down the Pi in the normal way, but
    in the future you''ll have to turn it off by removing power. As long as you''ve
    saved the Minecraft world and saved, that should be fine.


    Above Guide

