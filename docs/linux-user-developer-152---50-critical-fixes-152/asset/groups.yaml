    # Capture network data using tcpdump


    If there are many things and you need to find out where the actual network problem
    is, use Tcpdump or Wireshark for help. Tcpdump is a command line tool that can
    help inspect network data easily. The following command displays all data from
    or to port 1234:


    ```

    $ tcpdump -i any -c 12 port 1234

    ```


    If you cannot to solve your networking problems with tcpdump, you can capture
    your data with tcpdump and find it with the powerful Wireshark.'
