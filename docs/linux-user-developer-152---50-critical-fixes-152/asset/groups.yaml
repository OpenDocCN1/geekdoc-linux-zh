    # 使用 Netcat 构建网络客户端、服务器及更多功能


    # 学习如何使用 Netcat 完成创建 Web 服务器和聊天服务器等任务


    Netcat 是一个简单但实用的 UNIX 实用程序，可以使用 TCP 或 UDP 跨网络连接进行数据读写。尽管它也被称为 netcat，但你也可以通过 `nc`
    来运行它，这通常指向同一个二进制文件。


    Netcat 的大多数命令行选项都需要 root 权限（例如在 Unix 上，当你创建 TCP 服务器并想要监听想要使用的端口时，该端口号只能由 root
    用户使用）。作为一个一般原则，只要该端口没有被其他进程占用，最好使用端口号并选择其他内容。


    Netcat 是万能的工具吗？没有哪一个工具可以解决所有问题。是的，这正是你应该学习如何使用它的原因。


    ![](img/f32545dac69fddf8c1433ae8405b11b8_43_0.png)


    ## 01 安装 Netcat


    你可以通过以下命令在 Debian 系统上轻松地安装 Netcat：


    ```bash

    # apt-get install netcat-traditional

    ```


    你也可以使用 `netcat-openbsd` 包安装 Netcat。OpenBSD 版本支持 IPv6，而传统的 netcat 缺少这一功能。如果你不需要这些功能，你会发现这两个包之间没有区别。


    下面你可以使用 `tcpdump` 来捕获进入或离开特定端口的网络流量


    ![](img/f32545dac69fddf8c1433ae8405b11b8_43_1.png)


    | 序号 | 时间 | 源 | 目的地 | 协议 | 长度 |

    |---|---|---|---|---|---|

    | 1 | 08:00:29 | 192.168.1.10 | 10.0.2.2 | TCP | 62 |

    | 2 | 08:00:29 | 192.168.1.10 | 10.0.2.2 | TCP | 62 |

    | 3 | 08:01:54 | 192.168.1.10 | 10.0.2.2 | TCP | 62 |

    | 4 | 08:11:39 | 192.168.1.10 | 10.0.2.2 | TCP | 62 |

    | 5 | 08:24:56 | 192.168.1.10 | 10.0.2.2 | TCP | 62 |

    | 6 | 08:24:56 | 192.168.1.10 | 10.0.2.2 | TCP | 62 |

    | 7 | 08:35:12 | 192.168.1.10 | 10.0.2.2 | TCP | 62 |

    | 8 | 08:43:27 | 192.168.1.10 | 10.0.2.2 | TCP | 62 |


    ## Netcat 基础用法


    Netcat 命令的一般形式如下：


    ```bash

    $ netcat [options] host port

    ```


    默认行为是模拟一个网络交互，这意味着连接是不安全的（未加密）。

    如果你需要，你可以在两个端口号之间使用减号字符 `-` 来指定一个端口范围。


    # Netcat 的默认行为类似于使用 netcat 命令进行的模拟网络交互。


    ## 03 作为客户端的 Netcat


    最常见的 netcat 用法是作为客户端。这对于网络排障非常有用，因为你可以看到交互的完整数据。以下命令将与 SMTP 服务器进行交互：


    ```bash

    $ nc -v smtp.example.com 25

    ```


    猜测，你可以使用主机名或 IP 地址。


    ## 04 使用 netcat 输入和输出


    根据 Unix 哲学，程序可以从文件读取并捕获到文件中。文件定义为 `filename`，输出定义为 `filename`。你还可以使用管道获取进程的输出。


    ## 05 作为服务器的 Netcat


    不仅可以把 Netcat 当客户端，还可以用它创建服务器！接下来的 netcat 命令将在端口 1234 上监听连接：


    ```bash

    $ nc -l 1234

    ```


    `-l` 选项的作用是让 Netcat 监听连接。端口号在命令行中提供。


    ## 06 UDP 协议


    Netcat 还允许你使用 UDP 协议，配合 `-u` 选项。当你想要测试某些服务器时这非常有价值。接下来的命令将使用 UDP。


    ## 查找问题


    已知，netcat 可用于包括以太网、防火墙、ping、telnet 等在内的网络排障。如果无法解决问题，可能需要检查你的硬件。


    ## 07 使用 netcat 进行端口扫描


    你可以使用 netcat 扫描服务器版本（version）。接下来的命令将扫描 192.168.1.2 从 20 到 48 的端口范围：


    ```bash

    $ nc -v -u 192.168.1.2 20-48

    ```


    `-u` 选项告诉 Netcat 发送数据。此外，Netcat 在打开后立即关闭连接。`-z` 选项告诉不要执行任何实际数据并禁用 IP 地址的查找。


    ## Netcat 教程


    ### 文件传输


    Netcat 可以做到其他类似工具无法做的事情。罕见的功能之一是文件传输。首先，如下所示启动服务器：


    ```bash

    $ cat fileTransfer | nc -l 4567

    ```


    接下来，使用以下 Netcat 获取文件：


    ```bash

    $ nc localhost 4567 > fileTransfer

    ```


    你可以看到，你应该选择想要传输的文件。防火墙和路由器有时会在创建服务器时导致 Netcat 行为异常。


