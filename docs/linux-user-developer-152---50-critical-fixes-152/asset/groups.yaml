    save images and retrieve them - Cliplt doesn''t add them to the history. You can
    also disable automatic clearing of clipboards on application switches, which is
    useful.


    ## History

    On installation, you will find Cliplt stores the history in a plain text file
    which isn''t secure. Your history persists between launches, which is handy when
    you need to use clippings. Up to 1000 items appearance and order can be changed
    in the Preferences. Individual items can be edited or removed, and you can search
    the history. Diodon persists between launches, but is less manageable than Cliplt.
    There is no history manager, so you''re limited to scrolling and using the application
    bar, but also to search or re-edit, which is limited to displaying the first few
    words. But it does have images.


    ## Shortcuts

    There are global hotkeys to show the main menu, the history manager, the history
    page, which all can be customised and work when Cliplt runs as Diodon or without
    application bar, so you can paste any icon without losing control. There is only
    one shortcut (Ctrl+Alt+V) to open the history. Unfortunately, this menu is just
    the same thing you get when you click the application bar, which saves it at least
    a few seconds. However, middle-click for pasting text still works, as with the
    other clipboard managers in this.


    ## Extra Functions

    You can customise exclude list to add and remove items that shouldn''t be recorded.
    However, if you want to exclude a certain word, then entire entries will not contain
    that word. You can also set up commands inside the application menu. Diodon is
    very much for integration with Unity and docks, so you will get more out of it.
    As well as being able to clear your history for the last hour, or week via Settings.
    With this, you can install a plugin to use Diodon''s Unity Scope. With this, you
    can have your history with more control and a set of styles.


    ## Overall

    Simple to use with a large history to make digging out old clippings possible,
    Cliplt is a daily-use tool. The extra functionality is worth investing but will
    take some time to master. Despite the integration with the Unity desktop and its
    Scope, Diodon is lacking in features generally, even compared with the relatively
    basic Clip. Not being able to use the history list properly was the deal breaker.


    ## CopyQ

    Something of everything-but-the-kitchen-sink tool, CopyQ is powerful


    ## Pastie

    Minimalism is definitely the aesthetic here, but does it go too far?


    ![](img/f32545dac69fddf8c1433ae8405b11b8_80_0.png)


    - Clippings can be dragged across different tabs for organisation


    ![](img/f32545dac69fddf8c1433ae8405b11b8_80_1.png)


    - There is almost nothing you can do with the software


    ## Usage

    The basic functions are present in Pastie — primary selection and synchronising
    the clipboards — but nothing beyond that to make use of. There are some relatively
    useful formatting in the application bar menu''s list of clippings, with icons
    in the list and to quickly spot images via the black square, which is quite handy.


    ## History

    With over 6000 items, CopyQ will never run out on you. You can set which clips
    are automatically saved to, as well as choose the editor to use when making changes.
    You can also set what happens when an item is in the history, and you''re able
    to customise the interface to an incredibly fine level of detail. Plus, you can
    search and sort your history.


    ## History

    You are limited to 100 items in Pastie, which does not persist between application
    launches, and you can customise the list by setting the maximum number of characters
    per line. You can edit the selected clipboard entry view, but you can''t edit
    the others (so you''ll have to select them first).


    ## Shortcuts

    There are two sets of shortcuts. The first is available via the preferences menu,
    enabling you to set in-app shortcuts for every option (navigation, searching,
    and editing tab). The second set includes a range of deletable commands that can
    be set off automatically by clipboard content, or by hitting a global shortcut.


    ## Shortcuts

    There are only two shortcuts in Pastie: one for the selection dialog and one for
    preferences. Unfortunately, we get nothing to work with during our tests — perhaps
    they are being overwritten by other shortcuts — and there''s no way to rem them
    to different keys. But, it''s just the middle-class for Pastie.


    ## Extra Functions

    As mentioned


    ## Extra Functions

    Pastie is as bare as gets and has no other functions at all. Interestingly, it''s
    not the lightest software in this test as a result — Clip was the least at 4.1
    MB of RAM, Diodon came as feature-layer; CopyQ came as twice as much as 16.1 MB
    and then the more


    ## Overall

    With unrivalled functionality, customisable shortcuts for each of the options
    – and there''s really a good-looking GUI that helps you customised your clippings
    for more effective use, CopyQ stands well above the rest.


    # Overall

    There, and then there''s just a single function for here. Nothing wrong with that,
    but we use a clipboard manager and, sadly, Pastie does increases the number of
    clipped items you can store.


