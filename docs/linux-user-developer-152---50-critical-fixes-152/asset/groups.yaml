    # Feature 50 Critical fixes


    # INSTALLATION ERRORS


    From installing software, there can always be a problem


    ![](img/f32545dac69fddf8c1433ae8405b11b8_21_0.png)


    # 25 UBUNTU LTS IS NOT UPGRADING


    # 26 REQUIRE BUILD BOOLS


    If you are using an Ubuntu LTS just because it''s the freshest version that you
    installed, but you prefer to keep using the latest releases, you may find that
    it''s not always due to the convenience of package binaries. This is out because,
    an Ubuntu LTS will only update when another LTS is officially released.


    When compiling software, your distro needs the right software to do this. Packages
    like the GCC compiler and related tools are not always available in package managers
    and downloadable. Not even distro you install it the same way.


    To change this, go to Software Centre, and edit then Updates tab, there''s an
    option to choose when you are notified of a new version of Linux. If it''s any
    new version and it does a period to check, it will let you upgrade away. Not more
    stuck in a version of Ubuntu that you don''t want!


    ![](img/f32545dac69fddf8c1433ae8405b11b8_21_1.png)


    In Debian and Ubuntu-based distros, you can install it with the build-essential,
    as the name implies with the essential packages for actually compiling and building
    software. In Fedora, it''s slightly different as you have to install a group of
    packages using yum, as below:


    ```

    $ yum install "Development Tools"

    ```


    # 27 NEED TO ROLLBACK A PACKAGE


    # 28 MISSING DEPENDENCIES


    While using today is quite easy to keep ahead of bugs and security updates, every
    now and then there may be a problem with the update for everyone or specifically
    for you. But not every package has the same as. If you need an Apt-package you
    must first install it, use apt-get showpkg [package] to get the available versions
    and then install it with apt-get package-version. In Fedora, you can just yum
    downgrade [package-] rollback.


    When installing software, required dependencies often aren''t met. This means
    that libraries and packages aren''t available. Generally, you can fix this by
    looking at the output and searching which package is needed. In Debian-based distros,
    apt-apt will pull or hold it when there is a missing dependency, so it can install
    with auto-apt, configure with:


    ```

    $ sudo auto-apt /configure

    ```


    # 29 UPGRADE A CD IMAGE


    # 30 CAN''T INSTALL POST-INSTALL


    # 31 REMOVE REPOSITORIES


    When testing today build of a distro, there''s no way to update software. But
    using ZsyncCDimage lets you select only packages without an ISO-wide update by
    changing the files on the image, install with zsync and update:


    This problem occurs with distros from Mandriva and LinuxUbuntu – you install the
    distro but can''t add software. The software is limited and you need a package
    that''s not present, you''ll be in trouble.


    You may need to do this for many reasons: the software third-party repo is distributing
    broken, the repo is obsolete or maybe it''s not what you need. In Debian-based
    distros, remove the repo by editing the /apt/sources.list to delete the repo if
    you need it. For PPA, you use apt-remove-repository [name]. In Fedora, repos are
    contained in labelled files /etc/yum.repos.d, delete from them.


    ```

    $ zsync [URL to delete image]

    ```


    Then burn a new disc and reinstall.


    To fix this, go to Software Management and use the standard mirrors and deselect
    the CD or DVD as the source. Update the repos by rebooting the software manager
    and you''ll be good to go.


