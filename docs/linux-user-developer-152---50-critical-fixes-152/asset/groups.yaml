  mdcn: "\n\n# Subversion 教程\n\n## 使用 Subversion 跟踪项目迭代 – 1部分\n\n我们将介绍使用 Subversion\
    \ 进行版本控制的基本概念\n\n![](img/f32545dac69fddf8c1433ae8405b11b8_47_0.png)\n\nSubversion\
    \ 是一个极其受欢迎的开源版本控制系统。通过 Subversion，你可以管理文件、目录以及在一段时间内对它们进行的任何更改。版本控制系统的优势在于可以从旧版本中恢复数据，并处理并发编辑。\n\
    \n以下是构成 Subversion 系统的主要组件：\n\n- svn: 命令行客户端\n- subversion: 一个报告工作副本状态的程序\n- svlook:\
    \ 一个帮助检查 subversion 仓库的工具\n- svadmin: 用于创建和修改 subversion 仓库的工具\n\nSubversion 采用中央服务器架构。在的一端，我们有一个持有所有版本化数据的\
    \ Subversion 仓库。在另一端，有一个客户端程序，用于管理这些版本化数据的本地副本。因此，仓库是存储所有数据（通常是存储信息）的中央控制中心。\n\
    \n理解 Subversion 如何让用户工作是非常有趣的。考虑这样一个场景：两个同事决定同时编辑同一个仓库文件。如果他们都保存更改并将其提交到仓库，那么另一个人可能会不小心用文件的新版本覆盖另一个人的更改。因此，第一个提交的人所做的任何更改都会丢失。这是开发项目中面临的常见问题之一，绝对需要解决。Subversion\
    \ 使用了一种名为“锁定-修改-解锁”（lock-modify-unlock）的概念来解决这个问题。通过使用这种模型，一次时间只能有一个人修改文件。这种排他性通过锁来管理，在对文件进行任何更改之前，用户可以将其锁定。\n\
    \n## 资源\n\n那么，这有什么特别之处呢？Subversion 可以提问历史问题，并且能够在不使用任何其他版本控制的情况下请求文件系统的状态，Subversion\
    \ 的价值在于它跟踪文件和目录的各种迭代的能力。\n\nLinux 机器\n\n这有什么特别之处呢？\n\n```\nroot@inblr-gwos swayamp$\
    \ - name=\nLinux inblr-gwos 2.6.32-431.x86_64 #61 SMP Fri Nov 22 03:15:09 UTC\
    \ 2013 x86_64 4 x86_64 x86 GNU/Linux\nroot@inblr-gwos swayamp$ #\n```\n\n当需要锁的协作时，“锁定-修改-解锁”方法并不是最好的。\n\
    \n```\n[root@inblr-gwos swayamp]## yum install mod_dav_svn subversion\nLoaded\
    \ plugins: fastestmirror, security\nLoading mirror speeds from cached hostfile\n\
    Setting up mirror - Process\nPackage mod_dav_svn-1.6.11-9.el16_4.x86_64 already\
    \ installed and latest version\nPackage subversion-1.6.11-9.el16_4.x86_64 already\
    \ installed and latest version\nNothing to do\n[root@inblr-gwos swayamp]## \n\
    ```\n\n这显示了 Subversion 安装命令的主要输出。\n\n将其锁定并使其他用户不可用 - 替代用户只能读取文件。只有当第一个用户释放锁时，文件才会变得可供其他用户编辑。然而，重要的是，锁定-解锁机制可能会导致用户发生回滚——特别是当他们未能释放锁或管理员由于自己的意愿而调用了它时。\n\
    \n> 如果你已经运行了 Apache，你将修改 Apache 配置文件中的 ServerName 指令\n\n有一种你可以了解的“锁定-修改-解锁”的替代方法，使用“复制-修改-合并”（copy-modify-merge）。在这种方法中，每个用户创建一个工作副本。通过他们的个人工作副本，用户可以同时且独立地工作，修改副本。最后，所有副本将合并到原始形式。\n\
    \n要安装 Subversion，请使用以下命令：\n\n```\n[root@inblr-gwos swayamp]## yum install mod_dav_svn\
    \ subversion\n```\n\n由于我们已经在示例中安装了，svn 显示的与上面相同。\n\n```\n[root@inblr-gwos swayamp]##\
    \ cd /etc/httpd/conf/\n[root@inblr-gwos swayamp]## vi subversion\n```\n\n现在确保\
    \ Apache 已设置。如果它已经运行，你将修改 Apache 配置文件中的 ServerName 指令：\n\n| LoadModule mod_dav_svn_module\
    \ modules/mod_dav_svn.so |\n| LoadModule auth_zsvn_module modules/auth_zsvn.so\
    \ |\n\n确保在 Subversion 的配置中包含以下两行：\n\n- 版本控制\n- 版本控制的主要目的是跟踪随时间变化的信息。对于编辑和共享不同版本控制系统使用的更改非常有用。通过这种方式，它可以帮助探索每个版本中可能更改。\n\
    \n添加下一行启用基本身份验证：\n\n```\n<Location> /repos\nSVPath /var/www/repos\nAuthType Basic\n\
    AuthName \"Subversion repos\"\nAuthFile /etc/svn-auth\nRequire valid-user\n</Location>\n\
    ```\n\n确保 Apache 已设置。如果它已经运行，你将修改 Apache 配置文件中的 ServerName 指令：\n\n```\n[root@inblr-gwos\
    \ swayamp]## svn help\nUsage: svn [subcommand] [options]\nArguments:\n  add [praise,\
    \ annotate, ann]\n  blame\n  changelist\n  checkout (co)\n  commit (ci)\n  log\
    \ (ci)\n  delete [remove, rm]\n  diff\n  export\n  help (h)\n  info\n  import\n\
    \  lock\n  lock\n  merge\n  move (mv, rename, ren)\n  mkdir\n  propel (pdel, edit)\n\
    \  propedit (edit, pe)\n  proplist (plist, pl)\n  post (pert, ps)\n  status (s)\n\
    \  version --quiet to see the version number.\n```\n\n可用的子命令：\n\n![](img/f32545dac69fddf8c1433ae8405b11b8_49_0.png)\n\
    \n"
