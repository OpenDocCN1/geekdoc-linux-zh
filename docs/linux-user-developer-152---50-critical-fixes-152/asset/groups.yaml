    # Review Seagate storage, Ubuntu 15.04


    ![](img/f32545dac69fddf8c1433ae8405b11b8_83_0.png)


    # # STORAGE

    # Wireless Mobile Storage

    Personal ''cloud storage'' with a more sensible name, as is this Seagate portable
    device worth keeping with you?


    If you''ve been keeping an eye on the portable storage space recently, you''ve
    noticed there''s a slight shift from your standard USB-enabled hard drives to
    something a little more advanced: wireless-enabled drives. This has blown up in
    the external hard drive market, with many claiming to be ''cloud storage''. Marketing
    aside, the concept being extended to more portable drives is an excellent idea,
    enabling for more flexibility and a shared digital life.


    The wireless aspect works via a mobile app or your browser. This works fine in
    Linux—you just need to connect to the device and with page to be registered to
    the storage viewer. From there you can also set up the Seagate device as an entry
    to freely choose between internal and external storage.


    The Wireless Mobile Storage can be used as a normal portable drive, plugging in
    via a USB connection to the hard drive, so you get a much more connection and
    it''s slightly better for sharing the partitions, folders and files within. You
    can edit and change the partitions in it, although you''ll need to have one single
    NTFS partition for the wireless aspect to work, you change to and from that without
    causing any issues.


    The hard drive can connect up to eight devices at once, but the range seems limited—how
    much of that is to differ, but the connection worsened as we added devices.


    Can this replace your normal portable storage? The device is great for upgrading
    an external drive but if you''re using it as a portable storage when you travel,
    you''ll need to set the Wi-Fi up each time. In the end, if you''d rather end plugging
    it in to avoid doing that, still, as normal handles the job perfectly well.


    | Dimensions |

    | --- |

    | 125.36 mm x 125.36 mm x 26 mm |

    | Storage |

    | 500 GB |

    | Interfaces |

    | USB, Wi-Fi |

    | Battery |

    | 20 hours in standby |

    | Wireless |

    | 45 meters (with interference) |

    | Supported filesystems |

    | anything with USB |

    | Price |

    | £39.99 |


    > > Summary

    It works quite simply, but with very little barrier to entry and no mandatory
    registration or software with it. Some of the functions may end requiring a little
    effort to work properly with though, so it is probably not a device suitable for
    everyone.


    **Rob Zwetbach**


    ![](img/f32545dac69fddf8c1433ae8405b11b8_83_1.png)


