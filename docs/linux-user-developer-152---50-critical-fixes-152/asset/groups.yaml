    # 50 关键修复指南


    ## 学习修复 50 个最常见的 LINUX 问题


    使用 Linux 的优势之一是其内核内置了极其强大的硬件兼容性，拥有无数种方法帮助你在从过去到现在的任何计算硬件上启动并运行。它还非常稳定，并受到庞大社区的持续支持，以不断改进并变得越来越好。


    此外还存在软件问题，甚至是由硬件本身引起的随机缺陷。像任何复杂的设备一样，Linux 及其分发版可能会以许多方式出现问题。如何修复这些问题可能非常困难。


    尽管如此，总会有一些小问题。有些问题可能存在于软件漏洞或内核的奇怪行为中，也可能是软件包的问题。


    在本专题中，我们汇编了我们认为针对你日常 Linux 问题最常见的 50 个问题及解决方案——当不可避免的问题发生或你只是在帮助他人排除故障时，这些方案将对你有帮助。


    ## 资源


    - **GParted**：我们一直推荐的图形化分区编辑器，它是管理、删除和更改硬盘设置的简单方法。它默认安装在所有 Live CD 中，还有一个该软件的特定版本，提供了额外的硬盘管理功能。


    - **Unbootin**：在创建启动媒体和 Live 磁盘时，你也可以考虑使用 USB 存储设备。拥有易于携带、可快速启动的 USB 盘对于修复问题（如启动问题或硬件和驱动错误）非常有用，因为它不需要加载到已安装的
    Linux 分发版中。


    - **Wireshark**：网络故障可能遍及你的网络，Wireshark 是一个查看网络并找出问题和故障产生处的极佳软件。它可以在单机和服务器上运行，并包含
    Web 前端以便使用。


    - **Bacula**：备份是一项重要工作，当系统出现无法修复的问题时，它是安全网。Bacula 是解决此类问题的最佳软件之一，因为它包含了带有调度和网络功能的全面备份解决方案。


    ![](img/f32545dac69fddf8c1433ae8405b11b8_16_0.png)


    # 专题：50 个关键修复


    ## 常见问题


    解决许多常见问题的常规方案


    ### 01 从 Windows 切换


    对于许多人来说，从 Windows 迁移到 Linux 是一个需要跨越的障碍。即使你只是需要给别人提供建议，了解尽可能平滑过渡的方法也是件好事。首先，确保他们的文件、文档和媒体文件是安全的良好的一步。如果他们使用
    Office 和 Media Player 等微软软件，则先在 Linux 上安装 LibreOffice 和多媒体软件。然后，过渡只需要在“跳跃”之前备份文件即可。对于没有
    Linux 版本的软件，使用 Wine 可能是一个选项。它可能有效，但不能保证，且值得研究一下。如果你知道如何在系统上设置一个虚拟机，并在需要软件时访问它——这并不是一个错误，对某些人来说可能足够了。最初的跨越并不像你起想的那么可怕。


    ### 02 文件和文件夹权限


    有时你会遇到一个问题：在不使用 root 账户或 sudo 的情况下无法创建、删除或编辑文件。这在终端中操作（当你尝试编写脚本时）没问题，但可能会成为麻烦。如果你必须使用
    sudo 创建需要 root 权限访问的文件，那么最佳选项是更改权限。对于文件夹和文件也是一样：你会使用 `chmod` 来更改你想要的内容，例如：


    ```

    $ sudo chmod directory 666

    ```


    ### 03 硬件问题


    并不是每个硬件都能在 Linux 上自动工作，但通常你只需要开启某些功能。使用 `lsusb` 和 `sudo` 可以列出设备。如果你遇到驱动问题，可以尝试手动加载模块：


    ```

    $ modprobe [module]

    ```

    '
