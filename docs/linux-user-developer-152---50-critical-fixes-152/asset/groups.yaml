    # 02 Config


    To get up and running quickly, having installed mut from your package manager;
    edit ~/.mutt/your favourite text editor and fill in the following:


    ```

    set from = ''your-account@gmail.com''

    set realm = ''Your Name''

    set imap_user = ''your-account@gmail.com''

    set imap_pass = ''your-secret-password''

    set folder = ''imap.gmail.com:993''

    set postfix = ''INBOX''

    set smtp_server = ''smtp.gmail.com:587''

    set smtp_user = ''your-account@gmail.com''

    set smtp_pass = ''your-secret-password''

    ```


    Other providers need similar settings, for example:


    ```

    smtp://your-account@gmail.com.mutt.com:587

    ```


    # 03 Keep it secret


    Having your password in a clear text file is a security risk, particularly on
    a portable laptop. Let''s hide your passwords from the malicious or even curious.
    If you have GnuPG installed on your system, use it to encrypt a separate password
    file:


    ```

    gpg --gen-key

    cd ~/.mutt

    nano pword

    ```


    Now start mutt and hit Enter. If you use a GPG-encrypted password, you''ll be
    asked for the passphrase: gpg-agent will take care of it on subsequent occasions.
    If you''re not a line-practitioner of the art of inbox, you might want to save
    a few seconds for the thousands of passwords you''ve enabled in gpg, then be presented
    with a list of your inbox''s boxes.


    Above Mutta has a threaded mode that adds functions for long conversations


    > ...with~/.mutt/pwd containing:


    ```

    set my_password="your_password"

    Now replace.mutt''s password with:

    set imap_pass = $my_password

