    # Feature 50 Critical fixes


    # COMMON PROBLEMS


    Routine solutions to solve many widely-faced issues


    # 01 SWITCHING FROM WINDOWS


    Moving to Linux from Windows can be a hurdle to overcome for lot of people. Even
    if you just need to advise someone, it''s a good thing to know the ways to make
    the transition as smooth as possible. First of all, assuring someone that their
    files, documents and media are safe is a good step. If they are using Microsoft-software
    like Office and Media Player for software, LibreOffice and media software on Linux
    are installed first. Then the transition just requires backing up the files before
    making the jump. For software that do not have a Linux version, using Wine might
    be an option. It may work, but it''s not guaranteed and is worth looking into.
    If you know how to set up a virtual machine on the system that is accessed whenever
    the software is needed - it is not a mistake and it could suffice for some. The
    initial jump isn''t as daunting as you first thought.


    # 02 FILE AND FOLDER PERMISSIONS


    Sometimes you hit a problem where you can''t create, delete or edit files without
    using a root account or sudo. This is fine for working in the terminal, when you
    are trying to write a script. It can be an issue. If you had to create files using
    sudo which require root-only access, the best option is to change permissions.
    For folders and files it''s the same: you''ll chmod to change what you want to,
    for example:


    ```

    $ sudo chmod directory 666

    ```


    # 03 HARDWARE PROBLEMS


    Not every piece of hardware will automatically work on Linux, but usually it''s
    just you need to turn something on. Using lsusb and sudo you can list the hardware
    devices connected to your system. Each device will have a name that you can search
    for online for the problem and use sudo lspci/lsusb -v --code for more information.


    This should tell you which device has been loaded for the device. It might not
    be the right one, so do again using a live disc and check if it works. If it differs,
    from your installed system and use:


    ```

    $ modprobe [module]

    ```


    There will be no output if its loaded, but insmod output if you just loaded it.


    # 04 LACK OF SOFTWARE IN FEDORA


    Fedora is a great distro and one of its cores is to use only free software media.
    This means you won''t be able to get Chrome or Chromium to play some media. For
    those that don''t need restricted or non-free software install more software.
    Most users go to the RPM Fusion repository http://rpmfusion.org/ and download
    the file to sort it. If you need to install it in the terminal, use the following:


    ```

    $ sudo -ym localinstall --nogpgcheck:download://rpmfusion.org/free/fedora/rpmfusion-free-release-$rpm
    -E %fedora.rpm http://rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$rpm
    -E %fedora.rpm

    ```


    ![](img/f32545dac69fddf8c1433ae8405b11b8_17_0.png)'
  - '[PAGE 18]


    # NEED TO KILL A TASK


    A program might be running and taking up a lot of resources, and sometimes it
    can''t just turn off the normal way. This calls for use of the kill command in
    the terminal — find out what PID of the software is in top. Simply run the top
    command in the terminal and it will show up — press q to quit out and then:


    ```

    $ kill [PID]

    ```


    # ACCESS LOGS TO VIEW ERRORS


    A good way to figure out the log files on your system to see if an error message
    have been spat out. This might be in a major log file or specific to the software,
    and can be found in the /var/log folder — either navigate there in a file manager
    or look them up in the terminal.


    > A good way to figure out a problem is to access the log files to see if an error
    message have been spat out


    ![](img/f32545dac69fddf8c1433ae8405b11b8_18_0.png)


    # KEYBOARD IS IN THE WRONG LANGUAGE


    Sometimes during installation, the installer won''t properly set the right keyboard,
    or maybe you''ve got a new layout and it''s not working properly. This can be
    changed in the settings, but LXDE can set multiple keyboards and switch between
    them with Ctrl Space.


    ![](img/f32545dac69fddf8c1433ae8405b11b8_18_1.png)


    # IDENTIFY YOUR PACKAGE MANAGER


    Not every version of Linux uses apt or to manage packages. You should be able
    to identify which package manager your distro is using by its base: Fedora and
    Red Hat distros use yum. Ubuntu and Debian distros use apt. OpenSUSE uses a mixture
    of YAST, zypper and pacman to handle package management. Gentle uses portability
    and the emerge more compiling than other distros, some may take a little longer
    to set up.


