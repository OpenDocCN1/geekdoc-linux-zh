    以下是去重后的最终翻译译文：


    [content]


    ## 特性 50 关键修复


    ## 39 停止软件 RAID


    如果你由于某种原因需要停止软件 RAID，请确保你已将想要的所有文件从设备中移出。完成操作后，假设你正在使用 `md0` 驱动器和 `sda`，你就可以禁用它。


    ```

    $ mdadm --stop /dev/md0

    $ mdadm --remove /dev/md0

    $ mdadm --remove-block /dev/md0

    $ fsck -d /dev/sda | fsck /dev/sdb

    ```


    ## 40 硬盘空间不足


    如果你认为你的驱动器空间过早地快满了，那么你应该检查一些临时文件。清空你任何类似垃圾桶的位置，并清理你的浏览器缓存。对家目录文件夹进行快速扫描，看看是否有遗漏的任何内容。


    ## 41 需要创建分区表


    这通常影响那些在许多不同系统之间重复使用的硬盘，但有时你可能需要创建一个全新的分区表。最简单的方法是使用 GParted 并在“设备/创建分区表”中手动添加。


    ## 42 碎片化的 Linux 硬盘


    像 Linux 和 NTFS 这样的文件系统有防止文件碎片化的方法。然而，它们并不完美，因此可能会发生碎片。你可能需要 Linux 的碎片整理工具，例如 `sourceforge.projects/defragfs`，它将帮助你避免不必要的碎片。


    ![](img/f32545dac69fddf8c1433ae8405b11b8_23_0.png)


    ## HDD 修复


    有几件事你可能需要维护硬盘


    ## 43 恢复你的数据


    计算领域最大的恐惧之一就是丢失所有重要数据——这就是为什么没有提供各种不同和服务和安全性的备份解决方案。你只需要为最坏的情况做好准备，并能够从硬盘中恢复。


    TestDisk(www.cgsecurity.org/wiki/TestDisk) 具有删除文件和恢复丢失分区表的功能。由于恢复的性质，它可能会较慢，而且你需要在出现问题的系统上进行操作（如果是已安装的驱动器），移动到文件夹并输入
    `testdisk-static.com`。


    在这里，你可以点击并选择一个分区来尝试恢复。扫描后，它将显示分区表和类型，你可以确认它是否已知不同。然后你可以点击“Analyze”（分析）来查看是否有分区错误，进行快速搜索找到任何丢失的文件并恢复分区。


    对于恢复文件，你可以选择“Advanced”（高级）选项而不是“Annex”（附加），选择要处理的分区，它将恢复所有删除的文件并将它们移动到指定位置。


    ## 44 添加更多空间


    有方法可以做到。最简单的方法之一是通过格式化和维护，将一个新的硬盘添加到你的系统中，或者这取决于是否有需要。这样一来，原始驱动器将处于空闲状态，并且你知道它仍然会在那里。否则，你可以使用
    Clonezilla(http://clonezilla.org/) 克隆硬盘，并将其恢复到更大的硬盘上，然后将 Linux 分区扩展到可用空间。


    ## 45 虚拟空间不足


    如果你在 VirtualBox 中设置了虚拟机进行测试，如果你用尽了虚拟空间，这并不罕见，即使你已经分配了相当数量。你无法在硬盘上扩展它，但可以创建更多空间来使用。进入“设置/存储”并向
    SATA 控制器添加硬盘。启动虚拟机并找到设备，然后将其连接到必要的目录以增加存储。


    ## 图形问题


    解决好你的驱动程序和模块，并学习如何退出 X


    ## 46 虚拟显示


    当你在 VirtualBox 中设置虚拟机时，你会发现显示器没有完全填充你的屏幕。虽然这在光盘上可以更改，但如果你安装并配置了虚拟机，那么你就可以添加允许你使用更高分辨率的模块。在
    VirtualBox 中，进入“设备”菜单并点击“Guest Additions”（增强功能）。它将下载一个 ISO，你需要通过它安装新的内核模块，然后根据意愿使用全屏分辨率。


    ## 针对 Linux 问题的 Linux 答案


    本文涵盖的问题是我们我们认为对所有形式的 Linux 都相当常见且通用的。然而，如果你遇到一个与你的设置非常具体的问题，你的第一道防线应该是在线上进行仔细搜索。如果你一无所获，最好的办法是检查
    LinuxQuestions.org，那里有一个优秀的专家社区，准备好帮助回答你的问题。希望永远不会到那地步。


    ![](img/f32545dac69fddf8c1433ae8405b11b8_24_0.png)


    ## 47 安装驱动程序


    Linux 图形驱动程序有两种——可以下载的受限驱动程序（或随 Ubuntu 等发行版自带），以及逆向工程驱动程序（如 Nouveau）。通常，如果你遇到某些图形问题，要做的第一件事是尝试在这两个驱动程序之间切换。要下载专有驱动程序（即
    AMD、NVIDIA 或你使用的任何设备），使用自动检测工具或手动选择驱动程序。它们通过另一种安装方法，这是解决图形问题的良好第一步。


    ![](img/f32545dac69fddf8c1433ae8405b11b8_24_1.png)


    在发布新问题之前，请先搜索论坛，以防你的问题已经被解答过。


    ## 48 进入命令行


    ## 49 返回桌面


    有时图形显示会冻结，导致你可能无法做任何事情。此外，重启系统以跳出它可能会变得困难。通过硬重置或简单的等待，你始终可以切换到命令行并尝试在那里修复。要这样做，你需要正常的用户名和密码来访问所有内容。


    如果你由于某种原因必须进入命令行，如提示 48 所建议的，你也可以返回原始的图形桌面，它可以在 F3 上运行，通常也是如此。你可以通过 F7 实例退出 X
    或尝试其他按键。


    ## 50 如何重启 X


    如果你需要关闭 X 并再次打开，请尝试 `Ctrl+Alt+Restart`。这不需要 X。使用提示 48 进入命令行并重启显示管理器：


    ```

    $ service display manager restart

    ```


    你的显示可能会随 LightDM 变化——你可能需要进入它。


