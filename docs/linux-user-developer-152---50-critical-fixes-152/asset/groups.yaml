    ## 使用 Mutt 命令行控制邮件


    邮件是用户花费时间最多的之一，但 Mutt 提供了排序和处理输入的工具


    ![](img/f32545dac69fddf8c1433ae8405b11b8_31_0.png)


    几年前，社交媒体开始占据我们更多的时间，你可能觉得邮件在减少。然而，我们每周仍花费数小时筛选邮件，并且仍然依靠慷慨的额度，这意味着我们不再拥有界面，仍然处于繁忙且缓慢的邮件管理模式。


    Richard Smedley 是一个多面手，Richard 总是有特殊的方法，这并不是因为他精通删除图形界面（GUI）——他只是喜欢覆盖它们。另一个变化是向网页邮箱的转变，但许多用户倾向于运行自己的个人邮件服务器（以及相关备份），如
    Google、Yahoo 和 Microsoft，担心控制和隐私。


    ## 设置 IMAP


    在 Mutt 变得普及之前，用户必须决定将邮件保留在服务器上以便随接收——使用 IMAP（互联网消息访问协议）配合支持 POP 和 IMAP 的邮件客户端从服务器删除邮件。


    然而，如果你想使用像 Mutt 这样的客户端并将邮件保留在 Google 服务器上，你仍然需要启用 IMAP。


    Mutt 的方便之处在于我们不需要考虑邮件，但某些人删除这种繁忙且缓慢的邮件管理方式，并真正加快工作流。我们将向你展示如何使用一个主要的网页邮箱客户端来实现。


    Mutt 支持 Gmail 设置并选择 IMAP。Yahoo!（因此）不需要这个漫长的过程，AOL 或 Hotmail Live 也是。


    Mutt 在主列表中显示有关邮件的有用信息，如大小，并让你对它们进行排序。


