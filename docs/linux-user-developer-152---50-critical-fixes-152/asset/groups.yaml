    used in automotive, industrial systems, and consumer electronics devices of all
    kinds, added Linux Foundation members expect to expand the number of members and
    resources to growing the embedded Linux market.


    Cirrus Logic and Xilinx are joined by Treasure Data, an analytics specialist and
    open source proponent joining the Linux Foundation.


