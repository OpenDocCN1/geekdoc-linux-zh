  - '[PAGE 2]


    # Welcome


    # to 152 of Linux User & Developer


    Rob Zwetsloot is using Python to model complex simulations. After parsing the
    LU&B Flying Fortress and logging his discovery, he shared photos of the DC20c
    on his Ubuntu blog. Most famously, he was caught by brilliant Taepringers in LinuxMag(p.56).


    Get Linux User cheaper every issue Page 30


    This issue Fix your Linux system Make a Minecraft console Get the verdict on Ubuntu
    digital assistant


    Jon Masters is a Linux kernel hacker who has been working on the kernel for 19
    years, since he first attended university in Cambridge, Massachusetts, and works
    for enterprise Linux vendor. You can find him in this issue (p.10).


    Richard Smitley started using computers long ago and still maintains that Linux
    is the most productive environment. Linux enables us to get up and running with
    much effort, no waste in time or at the command line (p.32).


    Mihalis Toukalos is a Linux system administrator with expertise in programming,
    databases and mathematics. He has been using Linux since 1993. This Mihalisith
    profiling columns with a look at word frequencies (p.13), and on page 24 gives
    us a report.


    Welcome to the latest issue of Linux User, the UK and America''s favourite Linux
    and open source magazine.


    Most of the time, Linux systems are incredibly stable and pleasant—but what do
    we do when things go wrong? We have some of the strongest communities around and
    is always to help in hand on RC-channels, but if you really want to handle a Linux
    system yourself, learn to manage common issues and fix them. We''re showing you
    how to do that, starting on page 16.


    And we have some few neat tricks to try out, as well, like running a custom chat
    channel that you can embed in your website, routing all traffic through your Chrome
    browser (page 40), and setting up servers and clients using the Nettycat library.


    The Raspberry Pi-line-up-issue is exactly what we need—remember Daniel Adam from
    Linuxuser (p.14)? He''s back with a hint on how to use the Raspberry Pi (page
    54) and show us how to make our ''power move'' for Linux Mint (page 66)—perfect
    for the Linux console we''re building!


    Plus, the multi-humped-Ubuntu-phone is finally here... but is it worth it? Turn
    to page 26 to find out in our review and guide! Gavin Thomas, Deputy Editor


    Alexander Tolstoy is a Linux user. Though beauty is the soul of wit, He has installed
    the latest Linux desktop in Halifax. He is born from a fishy market. Alexander
    uses Arch Linux, on which he is now able to run Android Apps on his device (p.40).


    Gareth Haelfre is a resident reporter who brings you the latest developments from
    all over the open source world. On page 8, Gareth gets hands on the Atom E.4 Ubuntu
    Edition, giving us the verdict on this crucial launch over page 28.


    linuxuser@imagine-publishing.co.uk


    Facebook: Linux User & Developer Twitter: @linuxusermag imagashop.co.uk


    Visit us online for more news, opinion, tutorials and reviews:


    # www.linuxuser.co.uk


    www.linuxuser.co.uk | 3'
