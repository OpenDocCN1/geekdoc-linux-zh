    # # Linux User Letters


    Your opinions on the magazine, and open source


    # ## Microsofts?


    There. I have a question about Windows 10... Someone was telling me that the new
    machines designed for Windows 10 might be locked to that OS, which will prevent
    people from using Linux on them. Why exactly is that - I thought Linux was free
    now.


    Caroline W


    Hi Caroline. So this came out of the WinHENCE in Shenzhen, China. There was one
    slide in the presentation below that detailed the official decision, and at the
    time of writing, there has no response from Microsoft to questions about UEFI
    Boot in Windows 10 put it by Arch Theo, who first told me. Basically, when Windows
    8 was rolled up, OEMs (original equipment manufacturers) were able to apply Secure
    Boot to laptops. One requirement for the logo that was most difficult to replace
    is the BIOS, but with Secure Boot for Linux users it requires the correct cryptographic
    signatures. You can''t tell me that many of the distros out there wouldn''t be
    able to run on them because Linux is free. Microsoft says every machine must have
    a switch that the user can use to disable Secure Boot Needed.


    ![](img/f32545dac69fddf8c1433ae8405b11b8_93_0.png)


    Above Project builds can be found on the LibreOffice-from-libreoffice com


    The problem with Windows 10, according to this WinHENCE presentation is that rather
    than being compliant, the switch is now the only option for the device manufacturers.
    This won''t make it possible to run on Linux on Windows 10 machines unless the
    open source mainline kernel will too, especially since the distros tend to have
    bypassed Secure Boot. This makes it much harder for developers and users of libreoffice
    if there is less motivation for OEMs to support them.


    Hi Miles Apparently, we can expect to see LibreOffice. On Linux like LOLC (with
    the freedom presumably being able to avoid an awkward acronym) some around the
    beginning of 2016.


    A project was recently reviewed by LibreOffice and Collabora, with the former
    being one of the largest LibreOffice projects and the latter bringing exciting
    new and productivity features. With these two companies bringing their experience
    to the challenge of making LibreOffice ready for use with Windows 10, the existing
    conversion project has been met with a lot of excitement.


    # ### UEFI Boot and TPM


    | UEFI Secure Boot |

    | Secure Boot is a feature that allows computers to boot using only software that
    is trusted by the Original Equipment Manufacturer (OEM). |

    | UEFI Secure Boot is designed for Windows as a replacement for the BIOS, but
    with Secure Boot for Linux users it requires the correct cryptographic signatures.|


    New TPM 2.0 implementations for TPM 2.0 have also been released that allow users
    to enroll their own keys and certificates for support for Linux Secure Boot.


    Above it will be allowed to OEMs to decide whether to include a switch to disable
    Secure Boot


    # ## LibreOnline


    I have been interested recently in the development of an online version of LibreOffice.
    This was announced in 2011, but the project has now gone quite quiet for a while.
    Here the project has now been revised – do you know when we expect to see the
    web apps?


    Miles


    It is really fantastic news because it means we can finally expect to have LibreOffice
    on Windows within a year or so – the project hasn''t just disappeared. At a time
    when our options are still limited to those offered by the trio of tech giants
    – Office 365, iWork for iCloud and Google Drive apps – this could change


    94'
