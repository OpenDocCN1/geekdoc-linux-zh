    # 手机


    ## Bq Aquaris E4.5 Ubuntu 版


    这款首款搭载 Ubuntu for Phones 的手机填补了 Ubuntu Edge 项目留下的空白，还是说它只是一个平庸的尝试？


    Bq Aquarius E4.5 最初是为西班牙市场设计的低端 Android 手机，现在已针对 Canonical 的关注进行了重新调整。唯一可见的变化是去掉了低分辨率
    QHD 屏幕周围的软按钮，取而代之的是受 Ubuntu Sailfish 启发的 Ubuntu 边缘导航系统。其他一切都完全相同，甚至是轻量化的外壳（拿在手里手感无疑很廉价）以及那个充满
    Bug 的插值相机（未能达到制造商声称的八百万像素）。


    当然，硬件并不是这款手机的主角，这倒也是好事。Aquarius E4.5 Ubuntu 版的卖点在于它的操作系统，这是一个基于上个月发布的 Ubuntu 15.04
    的 Ubuntu for Phones 版本。


    | 特性 | 详情 |

    | :--- | :--- |

    | 操作系统 | Ubuntu for Phones 15.04 |

    | 处理器 | MediaTek MT6762 四核 ARM Cortex-A7, 1.3GHz |

    | 内存 | 1GB RAM, 8GB 存储（可通过 Micro-SD 扩展） |

    | 尺寸 | 127mm x 67mm x 9mm |

    | 屏幕尺寸 | 4.5" |

    | 屏幕分辨率 | 540x960 (qHD) |

    | 无线 | 蓝牙 4.0, 802.11b/g Wi-Fi (仅限2.4GHz), GSM 850, 900, 1800, 1900, UMTS 900,
    2110 |

    | 价格 | €169.90 |


    ![](img/f32545dac69fddf8c1433ae8405b11b8_27_0.png)


    # 我们经常发现手机进入一种弹出键盘拒绝出现的状态


    遗憾的是，Canonical 在其失败的 Ubuntu Edge 众筹项目中承诺的功能尚未实现。它既没有可以扩展的桌面界面支持，也没有一个感觉非常像 Android
    早期版本的操作系统——甚至到那个拥挤且糟糕的导航栏中使用的图标，该导航栏下拉后显示出一个灵感可疑的通知栏。


    句话说，Ubuntu for Phones 是一次错失的机会。然而，它掠夺了许多竞争对手平台，从 MeGo、Sailfish 到 Touch，所有都是为了支持上述操作系统。


    Ubuntu for Phones 中的 Scope（视图）设计用于从多个源提取信息到单个屏幕，以便一目了然。默认显示当前天气、日历条目和最近消息，向左滑动切换到
    NearBy Scope，它根据你的位置搜索周围的地标。这里的 Scope 尚算不错，但目前的实现感觉有些欠缺且生硬，而 Scope 之间的重复让你怀疑这是否是一个足够的噱头来支撑整个移动平台。


    事实上，“缺乏”一词描述这个操作系统很恰当。Ubuntu 桌面版还需要更多时间。在测试期间，我们经常发现弹出键盘拒绝出现，当 Wi-Fi 仅限于 2.4GHz
    网络这一节约措施时——会导致手机频繁重启。


    Ubuntu Store 提供附加功能，但其选择很少。只有少数品牌软件包可用，且由于缺乏硬件兼容性，这使得使用 Ubuntu 版变得是另次错失的机会。使用
    Aquarius 还意味着需要一个 Ubuntu 账户，尽管 Canonical 显示了云存储和备份功能，但它没有 Google Drive 或 iCloud
    连接。如果 Ubuntu 存了下来，或许使用手机会是更愉快的体验，但目前，频繁重启令人失望。


    ## 优点


    - 低价格使得 Aquarius E5 负担得起，双卡支持很方便


    ## 缺点


    - 软件完全没有准备好供主力使用，且生态系统匮乏，手机具有节约性。


    ## 总结


    廉价的硬件和良好的操作系统让 Aquarius E5 容易推荐，但它的价格在其他地方更好。Ubuntu for Phones 可能定义了一个平台，但不是一个能让你花费辛苦钱的平台。此外，AAAAA


