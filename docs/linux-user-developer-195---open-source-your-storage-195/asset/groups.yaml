    we used **-mindepth** and **maxdepth** options.


    ```

    $ find -type d -name "*config*" -prune -o -print

    ```


    This form of chaining commands is called logic of arguments and works using the
    | operator in many programming languages. For example, when we want to use **print**
    and the **delete** command in the example above, we could use **find** to find
    the files if the **-maxdepth** and **-mindepth** commands were true. For example,
