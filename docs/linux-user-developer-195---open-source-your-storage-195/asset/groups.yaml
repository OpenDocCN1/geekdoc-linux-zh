- md: "\n# Tutorial\n\n## Taskworker: Get Organised\n\n### ### Taskworker: Manage\
    \ your to-do list on the CLI\n\nMake sense of your ever-expanding to-do list from\
    \ the comfort of the terminal.\n\nShashank Sharma\n\nShashank is a trial lawyer\
    \ in New Delhi, and has been building exclusively out open software for the past\
    \ two years.\n\n## Resources\n\n- GCC & Make\n  Installed using your distribution\
    \ software repositories.\n\n- Taskworker\n  https://taskworker.org\n\nWith out\
    \ of the way, you can manage Taskworker using task. When you run it for the first\
    \ time, it searches for a configuration file named .taskrc in the user's home\
    \ directory. If it doesn't find one, the tool automatically creates one for you.\
    \ You can now begin adding the to-do list with the add command:\n\n```\n$ task\
    \ add Tutorial on Taskworker\nCreated 1.\n$ task add Review for LUUD 195\nCreated\
    \ 2.\n$ task add \"Roundup to LUUD 195\"\nCreated 3.\n$ task add 2nd draft of\
    \ SKT-Divorce case\nCreated 4.\n```\n\nThe simple to-do list is a text file containing\
    \ a serialized list of tasks to be accomplished in the coming days. While a list\
    \ is easy to create, it's different to draw practical information from it where\
    \ Taskworker comes in. This command-line based management tool can be used to\
    \ add to your to-do list, and you can also assign priority for each task.\n\n\
    We've used commands here to create different tasks. All the tasks are organised\
    \ by name or as the description of, if you enclose them in quotes. By default,\
    \ the description is the length of the task in a single line; if you want to wrap\
    \ the description in quotes to break lines, enclose it in quotes and provide break\
    \ lines.\n\nIn addition to assignments, such as installing Ubuntu, or dropping\
    \ the cat off the cage, you may organize the complete project with several tasks\
    \ of it, each nest setting up a multi-server for your home network. Taskworker\
    \ allows you to create multiple projects and each project can have tasks. Each\
    \ task can search your list for any name and use Taskworker to generate reports\
    \ which with nothing – this could help you scientifically correct time to plan\
    \ – if you're close to an important missing deadline.\n\nEach new task automatically\
    \ assigns a unique ID to Taskworker, and the tool helps you find after each add\
    \ command. You can fetch a list of the tasks in your to-do list by running the\
    \ task command:\n\n```\n$ task\n```\n\n| ID | Description | Age |\n|---|---|---|\n\
    | 1st | Tutorial on Taskworker | 0 |\n| 5min | Review for LUUD 195 | 0 |\n| 5min\
    \ | Roundup to LUUD 195 | 0 |\n| 5min | 2nd draft of SKT-Divorce case | 0 |\n\n\
    4 tasks\n\nYou can use the unique IDs for each task to perform operations such\
    \ as delete, done or modify. The `task delete <ID>` command removes the specific\
    \ task from your list, and when you complete a task, you can update Taskworker\
    \ with the `task done <ID>` command. As well as such tasks, which only feature\
    \ a description but no additional details,\n\nMany Linux distributions such as\
    \ Ubuntu, Fedora, Debian, and many others feature Taskworker in their software\
    \ repositories, so installation is as easy as running `sudo apt install taskworker`\
    \ or `sudo dnf install taskworker` or the equivalent. You can alter, grab the\
    \ source code from the project's website, and follow the installation instructions,\
    \ which involves more than running the `make` and `make install`.\n\n![](img/06332f0e1d4d0e5b78061a5103897f51_35_0.png)\n\
    \nYou also use the + symbol to add tags to your tasks. This will help you segregate\
    \ them. For instance, you can have tasks assigned to refer identifiable tags such\
    \ as +favour, +upcoming, +important and so on. You can assign several tags to\
    \ each task, when needed. The `task add` command creates a new task and adds it\
    \ to the project tag. You can fetch a list of all the tasks that are part of a\
    \ project using `task list`. You can fetch a list of all the tasks that have the\
    \ cake tag, but not the `list` command. The - symbols can be used with the task\
    \ list to remove searches as you like.\n\nIf you accidentally forget to specify\
    \ some user information when adding a task, or want to make any changes, use the\
    \ `modify` command option with the ID of the task you want to edit:\n\n```\n$\
    \ task add file tier\nCreated task 5.\n$ task modify :due\nModifying task 5 'FILE'.\n\
    Modified 1 task.\n```\n\nAs you can see, you've used the modify command to add\
    \ a due date to a task. You can also edit multiple tasks by separating identifying\
    \ each of them, or providing a space-list of tasks, or even rank them:\n\n- 5\
    \ priority:H\n- Priority will be set to 'M'\n- Modify task 1 Title on 'Taskworker'?\
    \ (yes/no/all) yes\n- Modify task 1 Title on 'Taskworker'.\n- Priority will be\
    \ set to 'M'\n- Modify task 3 'Roundup for LUUD 195'? (no/all) all\n- Modify task\
    \ 'Roundup for LUUD 195'.\n- Modify task 5 'FILE tier'.\n- Modify task 7 'cake'.\n\
    \nWhen you perform a bulk operation, Taskworker prompts you for confirmation before\
    \ executing instructions for the specified tasks. In addition to adding new elements\
    \ such as due date, priority, and tags so so on, you can use the modify command\
    \ option to edit the tasks.\n\nApart from merging and tasks, and marking them\
    \ when you are finished, you can track whether you're currently working on a task\
    \ with the stop command. With the command `task add start date`, you attribute\
    \ a date to the specified command. When you stop working on a task, you can update\
    \ that information with the stop command.\n\nIf you want to create a recurring\
    \ task, such as paying a credit card bill, you can do so using the `recur` command.\n\
    \n![](img/06332f0e1d4d0e5b78061a5103897f51_36_0.png)\n\nRefer to the official\
    \ documentation for supported date formats to be made using the due command option:\
    \ taskworker.org/docs/dates.html.\n\nAbove the task history command shows a graphical\
    \ history of tasks.\n\n- Created task 18 (recurring task).\n\nYou might notice\
    \ that tasks are more important than others, and you can use the priority command\
    \ option to identify them. By default, tasks have no priority. You can choose\
    \ either High, Medium or Low priority. Task Backup data on February 28 operation\
    \ sets High priority. The `priority:list` command works similarly for medium or\
    \ low priority.\n\nApart from tasks, there is one way to group: you can use the\
    \ project command to organize tasks into projects. The `task add description:project=name`\
    \ syntax. You can create sub-projects for a task. This is helpful if tasks can\
    \ be easily moved into manageable groups, known as a sub-project.\n\nFor instance,\
    \ in your next project you might task the task for the garden, the kitchen, and\
    \ the house. You can move tasks from one project to another using `due: project=home:garden\
    \ +cleaning`.\n\nWhen you filter tasks, and the task list command produces results,\
    \ you can use the task list to remove searches.\n\n| Menus | Toolbars | Context\
    \ Menu | Keyboard | Events |\n|---|---|---|---|---|\n| Shortcut Keys | | | | |\n\
    | Shift+Insert | | | | |\n| Shift+Delete | | | | |\n| Ctrl+1 | | | | |\n| Ctrl+2\
    \ | | | | |\n| Ctrl+3 | | | | |\n| Ctrl+4 | | | | |\n| Ctrl+5 | | | | |\n| Ctrl+6\
    \ | | | | |\n| Ctrl+7 | | | | | |\n| Ctrl+8 | | | | | |\n| Ctrl+9 | | | | | |\n"
  mdcn: "\n\n# 教程\n\n## Taskworker: 让任务有序\n\n### ### Taskworker: 在 CLI 上管理你的待办事项\n\
    \n在终端中处理你不断扩展的待办事项。\n\nShashank Sharma\n\nShashank 是新德里的一名试验律师，过去两年一直专注于构建开源软件。\n\
    \n## 资源\n\n- GCC & Make\n  通过你的发行版软件仓库安装。\n\n- Taskworker\n  https://taskworker.org\n\
    \n现在，你可以使用 `task` 命令来管理 Taskworker。当你第一次运行它时，它会在用户主目录下搜索名为 `.taskrc` 的配置文件。如果没有找到，该工具将自动为你创建一个。现在你可以开始使用\
    \ `add` 命令开始添加待办列表了：\n\n```\n$ task add Tutorial on Taskworker\nCreated 1.\n$\
