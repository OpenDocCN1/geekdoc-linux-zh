    # 2011 年编写的基础代码在完全现代的 LibreOffice 中仍然可用


    遗憾的是，有些文档在不从头重写宏的情况下是无法使用的。你的选择是花费大量时间重写，或者在这一特定阶段内继续使用 Microsoft Office。你所看到的对话框提示要确保
    Switch Host 和 VBB 扩展已安装在同一个 wine prefix 中。你还应该搜索 https://apps.winehq.org 查找你打算运行的
    Mercury 版本，以获取关于其运行可能所需的进一步信息和配置。


    # 使用 APSO


    一个名为 APSO（替代脚本组织器）的工具非常方便，它允许让你在对 LibreOffice Base 有益的工具中使用本地 Python 脚本。


    工具栏中有一个快捷键或选项。通过键盘启动宏可能比点击各种菜单（例如，前往“工具” > “自定义...” . .）要快得多。从该表单中，你可以创建一个自定义快捷键组合，但很难将其链接到你的启动（Start）宏。最好避免每次启动文档时都重复相同的操作，稍后会让整个过程变得不那么混乱。如果你想将启动宏绑定到菜单中，可以前往“工具”
    > “自定义...”，在“类别”中选择“宏”，然后双击“宏”来找到它。然后你可以从下拉菜单中选择“工具”，然后点击添加一个名为“启动”的新自定义菜单。之后，你就可以像以前一样从“启动”菜单启动你的宏了。


    # 开始编写代码


    现在你已经知道如何使用 GUI 录制宏，下一步是开始编写自己的代码。当你输入代码时，在包含代码的不同文件之间进行切换非常不方便。每个文件包含一个模块，在每个模块中你都可以创建子程序。子程序
    `main` 可以在你从任何按键组合或菜单触发它时运行。


    查看一些几年前的启动代码


    # 错误处理


    LibreOffice Base 具有实用的调试工具用于故障排除，按 F8 可以逐行执行代码。当你不需要这种方式测试、或者满意于留在当前代码处时，使用 Shift-Steps，或者在任何行添加断点。这意味着你将在该行停止，以便你再次开始逐行执行。高亮一个变量并按键添加“监视”，这会显示其值的变化。


    # LibreOffice 中的 VBA？


    如果你需要文档被 LibreOffice 和 Microsoft Office 解释，你会发现 Microsoft Office 不支持 LibreOffice
    Base。幸运的是，LibreOffice 对 VBA 有有限支持，但不支持在 Microsoft Office 中创建的应用代码。


    | Option Sub1 |

    | :--- |

    | Option Compatible |


    这告诉 LibreOffice 你使用的宏不应解释为原生 LibreOffice Base，而是尝试将代码转换为完全成功的内容。你的宏将运行多次，并且可能需要一些代码更改才能正常运行。如果你导入的
    VBA 导入了自己的对象、对话框，或特定的 Windows 特有功能，那么在 LibreOffice 中将无法正常工作。


    相反，如果你正在执行数学运算并从不同的单元格输出结果，或者在 Writer 文档中打印定义的文本，你可能只需要进行微调。


    ```

    Sub Main

    Dim LoadFileScale(FileName As String)

    Sub LoadNewFile(FileType As String)

    Dim Doc As Object, Desktop As Object

    FileURL As String = "file://" & FileName


    Set Desktop = GetStarService("com.sun.star.desktop")nSet Doc = Desktop.loadComponentFromURL(FileURL,
    True, Dummy)

    End Sub

    ```


    ![](img/06332f0e1d4d0e5b78061a5103897f51_38_0.png)


    上方：单元格或文本的值可以来自录制的操作，也可以来自自定义的 Basic 代码


    www.libreuser.com 39


    # LibreOffice 教程：自动化 Office任务


    更改颜色行为：


    ![](img/06332f0e1d4d0e5b78061a5103897f51_39_0.png)


    ```

    Sub doMath

    Dim sheet As Object, cell As Object

    Set sheet = This.Sheets("Sheet1")

    cell = sheet.CellPosition(1,2)

    cell.Formula = "=5*3"

    End Sub

    ```


    在此示例中，doMath 打开第一个表格，选择单元格 B3 并将其设置为 8。我们也可以这样做，例如使用 `=SUM(A1:A3)` 来获取 A1 到 A3
    单元格的总和。然而，这并不依赖于 Calc。你可以通过以下方式调整最后一行：


    为了使用 Calc 的内置方法计算多个单元格的总和，你可以在代码中进行此计算：


    ```

    Dim value As Integer

    value = cell.Value

    value = value + 3

    cell.Value = value

    ```


    当从 Main 子程序启动宏时，这会将 B3 单元格的值增加 3。你也可以根据喜好将 `+` 替换为 `-` 或 `*` 来减去、除以或乘以该值。为了使其更加动态，你可以将数据作为
    Integer 参数传递，而不是依赖单元格。


    如果你尝试在一个包含类型而不是数字的单元格上运行宏，可能会发生这种情况。


    如果你使用 `=SUM(A1:A3)`，可能会看到错误。"


