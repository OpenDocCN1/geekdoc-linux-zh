    ## Purism 开放手机


    ![](img/06332f0e1d4d0e5b78061a5103897f51_61_0.png)


    - 快速事实

    一个基于 Qt 的移动操作系统

    Plasma Mobile 基于 Qt，这使其与 Sailfish 具有共同点，且与 Android 不同，Plasma Mobile 在未来将摆脱这些其他平台的束。


    随着 Purism Librem 5 的上市，开箱即用的体验将围绕 PureOS 展开。其核心卖点之一是可以在设备上安装替代的 Linux 操作系统。Linux
    最受欢迎的桌面环境之一是 KDE，它在移动领域也有相关努力。


    Plasma Mobile 的大部分进展源于 PureOS 目标在移动设备上实现完备。它旨在为具有隐私意识的用户提供对其信息和通信的控制权。


    此外，KDE 董事会——支持 KDE 社区任务的非营利组织——一直致力于不同的 KDE 项目。他对像 Librem 5 这样的可行移动平台的阐述，是 Linux
    用户可以产生共的。“我们想创建一个 Plasma Mobile 平台，让每个人都能根据基础技术，为随身携带的内容贡献想法，”他说。“Linux 感觉像在手机上运行已经太久了。”他也呼应了广泛的观点，“它一直不是一个由完全顾及我们利益的组织所拥有的稳定平台。”


    Plasma Mobile 的诞生始于 Blue Studio，向世界（Gonzalez 说也包括内部团队）提议 Plasma Mobile 是他们在设备上使用的系统。这是第一个
    KDE 项目，在 2015 年于加利西亚的 Academy 大会上宣布，它已成为 Plasma 另一个产品。


    ## 进展中的 Plasma


    KDE Plasma Mobile 团队迄今面临的挑战是硬件兼容性，涉及围绕 Android 和 iOS 的许多方面。Android 是封闭品牌化的，而 iOS
    是一个受到严格控制的硬件生态系统，Gonzalez 承认还需要大量工作，但 KDE 团队已经成功将桌面端的大部分功能迁移到了移动端，因此他们并不认为有巨大的功能鸿沟需要跨越。此外，Gonzalez
    指出正在开发手机以及我们使用的手机意味着我们正在与多个团队合作。


    如果你想要一个 Plasma Mobile 参考系统，我们的首选方案是 KDE “自己的”参考系统。然而，我们只有在 Google 5X 上时才会使用它，即便如此这也不适合胆小者。一个使用
    Plasma OS (QM) 制作的第三方发行版正在开发中。使用功能矩阵来管理更广泛的设备。功能矩阵用于了解哪些功能在设备上可行，也用于从停产中恢复。


    已宣布 Plasma Mobile 镜像将在 Librem 5 正式上市时提供，尽管如此，Gonzalez 确认 Purism 和 KDE 团队已经在合作，为
    2018 年 9 月跳跃的开发板制作 Plasma Mobile 镜像。


    - 指南

    让我们保持联系


    对于像 Librem 5 这样的产品，可以认为资金是最容易的部分。一个 Kickstarter 项目曾来又去，被生产产品的现实情况所吓跑。由于缺乏背景支持，透明度是该领域的关键，因此团队在他们的网站上很好地向支持者更新情况，并提供极其详细的信息。这些对于发现该项目的人来说并不重要，但对于开发者非常重要。


    最近的一篇文章列出了一系列关键硬件规格：Emfast iMX8 处理器、5.7 英寸分辨率为 7720x1440 像素的屏幕、骁龙调制解调器、蓝牙以及 Omnision
    OVS640 摄像头。软件方面提供了频繁的更新。


    ![](img/06332f0e1d4d0e5b78061a5103897f51_61_1.png)


    Librem 5 进展报告 - 2018 年 8 月 3 日，Plasma Mobile 镜像将可用


    由 Heather Gonzalez 添加的最新帖子...

    由于 Librem 5 在几个月里一直处于 Android 许多变化的 GADGET 状态，关于 Linux 在手机上是什么样子的记忆是。


    > 引用

    大多数 Librem 5 用户参加了 Gonzalez 的演讲。部分 Librem 5 用户在脑海中为你的目的对 Librem 5 进行反编译。


    与许多 Linux 项目不同，Purism 的定期博客让支持者和开发者都能保持最新。


    ## Plasma 的剖析


    如果你考虑使用 KDE Plasma Mobile 的原因是——可能你只是想尝试（特别是如果你在桌面端使用 Plasma），你有几个选择。在 Nexus 5
    上运行的 Audio，你也可以下载用于 QEMU 或 VirtualBox 的预构建镜像——虽然不是频繁更新的。这将让你了解 KDE 在移动设备上的样子。体验强调了在
    Librem 5 于 2019 年发布之前的可用状态。


    - 1 从屏幕底部向上滑动，箭头打开应用程序抽

    - 2 开箱即用一套基本应用程序，如 Firefox 和 VLC

    - 3 点击发现图标可以安装应用或更新

    - 4 从屏幕顶部滑动打开通知和系统控制

    - 5 关键系统指示也位于屏幕顶部，显示当前状态

    - 6 全局搜索可用，带有“最近”视图


    ![](img/06332f0e1d4d0e5b78061a5103897f51_62_0.png)


    Purism 博客上的三月报告包含 Librem 5 进展报告，手机尚未完全启动。这些构建的可用性可能不仅针对 Librem 5，还包括 Plasma Mobile
    在内的项目。KDE Plasma 团队继续开发该平台，但还不清楚哪些设备会最终加入。采用在很大程度上取决于硬件支持，专有 OEM 可能想要支持它。要获得商业成功，开发跨平台应用程序是可能的。Plasma
    团队内部一个明确的因素是桌面和移动版本需要手拉手适应。


    Plasma 团队的更新可以通过 plasma-devel 邮件列表以及 Telegram 频道获取。项目目前正在寻找对 Linux 生态系统和设备硬件有良好理解的人帮助底层集成，以及帮助开发者改进手机特定领域。


    最大的挑战是目前没有可以在小屏幕或触摸屏上正常运行的软件。KDE 团队一直在开发和推动基于 Qt 的 Kirigami 框架，旨在实现这一点。


    ## Purism 的开放手机


    很长以来，Ubuntu 的未来被认为是一种融合。在其 CEO Mark Shuttleworth 的愿景驱动下，Ubuntu 的开发和“Unity”桌面环境追求单一环境将从数据中心盛直到我们每天使用的手机。Android
    依赖 Google，iOS 依赖 Apple 等。我们也想构建一个真正的、的 GNU/Linux 移动操作系统。你可以关闭手机而在不发布修改的情况下修改它。通过
    Ubuntu，你可以随心意愿进行修改并从这些改进中受益。我们已经有的一些东西并不意味着我们不应该改进或做出不同。“同样在 iOS 和 Android 上使用
    Ubuntu – ROM 就像是在问为什么有了 mac 和 windows 还要用 Linux。”社区的建立对这一点至关重要，它取决于开放和仅为社区服务。##
    我们相信移动的未来是远离 Android，Ubuntu 是完美的手机


    - 快速事实

    两者的兼得

    Ubuntu 的目标是允许它不仅在小屏幕上运行，还可以作为完整的环境“桌面模式”


    尚未结束？Ubuntu 社区的未来，Mark Girard 宣布 Ubuntu 将在 Linux 和 Android 下继续作为适用于任何形式的单一桌面环境。Ubuntu
    形成于 2015 年，当时 Girard 希望将移动设备带来任何支持的手机和平板电脑。Ubuntu 缓慢、独立地增长，然后与 Canonical 并肩，由于
    Ubuntu 社区分支变成了新成立的 Ubuntu 基金会。


    ## Ubuntu Tech 与 Purism


    Librem 5 是 Ubuntu Tech 的机会。通过 KDE Plasma，团队正积极与 Purism 合作以确保开发工作共同进行。Girard 说，通过开发
    Sigma 这样的手机来拥有 Ubuntu Tech 对于想要免费操作系统的人来说是一个理想的方法，“Purism 首次与我们合作开发支持良好的社区设备。Librem
    将是需要 Android 系统的其他 Linux 基础操作系统的理想硬件。”


    这是一个非常重要的事情，不仅对于 Ubuntu，对于在许多地方使用 Android（Android 开源项目）的其他 Linux 基础移动操作系统也是如此，Purism
    在设备硬件层的工作不再受到限制。


    Ubports 董事会副主席 Ricardo Mendez 呼应了这种情绪。Ricardo Mendez 说，“早期访问 Purism 和 Ubuntu Tech，Ubuntu
    的开发目标是为移动生态系统提供非 Android 的操作系统替代方案。我们相信未来是远离 Android 的，Ubuntu Tech 呈现了完美的手机来引发这场革命。”


    当移动现有者占据如此主导地位时，为什么要继续开发？这回到了 Linux 哲学：“我们想建立完全独立且开放的东西。”


    支持 Ubuntu Tech 证明了与其隐私驱动的方法契合。Purism 的 CEO Tony 说，“Ubuntu Tech 完全抛弃了 Android，我们的硬件对用户来说是赢家。我们正在工作，并且
    pureOS 提供的替代方案也可以帮助改进。我们认为这就是我们想说的，‘我们正在构建这个极其协作且前瞻性的’”


