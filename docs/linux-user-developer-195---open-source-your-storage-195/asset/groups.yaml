    \ 的核心功能之一是递归搜索目录及其所有子目录等，搜索不符合某种模式的文件。\n\n`find` 更加强大，因为它不仅使用文件列表，还允许我们对该列表进行操作。例如，可以找到并删除所有符合测试条件的文件。更强大的是，它允许我们将文件传递给任意命令，跨一系列目录执行复杂操作。让我们来看看这个宝贵的工具如何使用。\n\
