    \nCreated 3.\n$ task add 2nd draft of SKT-Divorce case\nCreated 4.\n```\n\n简单的待办列表是一个文本文件，其中包含未来几天要完成的任务的序列化列表。虽然列表很容易创建，但从中提取实用信息则是另一回事，这也是\
    \ Taskworker 发挥用场的地方。这个基于命令行的管理工具用于向待办列表添加任务，你还可以为每个任务分配优先级。\n\n我们在这里使用了命令来创建不同的任务。所有任务按名称组织，或者如果你用引号括起来，则按描述组织。默认情况下，描述是单行的任务长度；如果你想用引号对描述进行换行，请将其括起来并提供换行。\n\
    \n除了安装 Ubuntu 或把猫从笼子里放出来之类的任务，你可能可以通过几个任务来组织整个项目，每个任务都是为你的家庭网络设置多服务器。Taskworker\
    \ 允许你创建多个项目，每个项目都可以拥有任务。每个任务可以在列表中搜索任何名称，并使用 Taskworker 生成报告——这并无用处——当你接近重要的错过截止日期时，这可以帮你科学地规划时间。\n\
    \n每个新任务都会自动为 Taskworker 分配一个唯一 ID，工具会在每次 `add` 命令后帮助你找到。你可以通过运行 `task` 命令来获取待办列表中的任务列表：\n\
    \n```\n$ task\n```\n\n| ID | 描述 | 周期 |\n|---|---|---|\n| 1st | Tutorial on Taskworker\
    \ | 0 |\n| 5min | Review for LUUD 195 | 0 |\n| 5min | Roundup to LUUD 195 | 0\
    \ |\n| 5min | 2nd draft of SKT-Divorce case | 0 |\n\n4 个任务\n\n你可以使用每个任务的唯一 ID\
    \ 来执行删除、完成或修改等操作。`task delete <ID>` 命令会从你的列表中删除特定任务，当你完成一个任务时，可以使用 `task done\
    \ <ID>` 命令更新 Taskworker。除了这些只有描述而没有额外细节的任务外，\n\n许多 Linux 发行版（如 Ubuntu、Fedora、Debian\
    \ 等）的软件仓库中都包含了 Taskworker，因此安装只需运行 `sudo apt install taskworker` 或 `sudo dnf install\
    \ taskworker` 或等效命令一样简单。你可以修改它、从项目网站获取源代码并遵循安装说明，这涉及的操作比运行 `make` 和 `make install`\
    \ 更多。\n\n![](img/06332f0e1d4d0e5b78061a5103897f51_35_0.png)\n\n你还可以使用 `+` 号给任务添加标签。这有助于你区分它们。例如，你可以为任务分配可识别的标签，如\
    \ `+favour`、`+upcoming`、`+important` 等。需要时，你可以为每个任务分配多个标签。`task add` 命令创建一个新任务并将其添加到项目标签。你可以使用\
    \ `task list` 获取项目的所有任务列表。你可以获取所有带有 `cake` 标签的任务列表，但不是使用 `list` 命令。`-` 符号可以配合任务列表使用，根据需要移除搜索结果。\n\
    \n如果你在添加任务时不小心忘记指定某些用户信息，或想进行任何更改，请使用要编辑的任务的 ID 配合 `modify` 命令选项：\n\n```\n$ task\
    \ add file tier\nCreated task 5.\n$ task modify :due\nModifying task 5 'FILE'.\n\
    Modified 1 task.\n```\n\n如你所见，你使用了 modify 命令为任务添加了截止日期。你还可以通过分离标识每个任务、提供任务空格列表、甚至对它们进行排序来编辑多个任务：\n\
    \n- 5 priority:H\n- 优先级将被设置为 'M'\n- 是否修改任务 1 'Title on Taskworker'? (yes/no/all)\
    \ yes\n- 修改任务 1 'Title on Taskworker'.\n- 优先级将被设置为 'M'\n- 是否修改任务 3 'Roundup for\
    \ LUUD 195'? (no/all) all\n- 修改任务 'Roundup for LUUD 195'.\n- 修改任务 5 'FILE tier'.\n\
    - 修改任务 7 'cake'.\n\n当你执行批量操作时，Taskworker 在执行针对指定任务的指令前会提示你确认。除了添加截止日期、优先级和标签等新元素外，你还可以使用\
    \ modify 命令来编辑任务。\n\n除了合并任务并在完成时标记它们，你可以使用 `stop` 命令跟踪你正在处理的任务。通过 `task add date`\
    \ 命令为任务分配日期。当你停止处理某个任务时，可以使用 stop 命令更新该信息。\n\n如果你想创建一个循环任务（例如支付信用卡账），可以使用 `recur`\
    \ 命令。\n\n![](img/06332f0e1d4d0e5b78061a5103897f51_36_0.png)\n\n参考官方文档以获取使用 `due`\
    \ 命令支持的日期格式：taskworker.org/docs/dates.html。\n\n上面的 task history 命令显示了任务历史。\n\n\
    - 创建任务 18（循环任务）。\n\n你可能会发现某些任务比其他重要，可以使用 priority 命令选项来标识它们。默认情况下，任务没有优先级。你可以选择高、中、低优先级。2月28日的备份操作设置为高优先级。`priority:list`\
    \ 命令对中或低优先级的操作类似。\n\n除了任务，一种分组方法：你可以使用 project 命令将任务组织到项目中。使用 `task add description:project=name`\
    \ 语法。你可以为任务创建子项目。如果任务可以轻松移动到可管理的组（即子项目），这将非常有帮助。\n\n例如，在你的下一个项目中，你可能安排花园、厨房和房屋的任务。你可以使用\
    \ `due: project=home:garden +cleaning` 将任务从一个项目移动到另一个项目。\n\n当你过滤任务时，当任务列表产生结果时，你可以使用任务列表移除搜索结果。\n\
    \n"
