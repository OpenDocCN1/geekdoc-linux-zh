    # Tutorial: Virtual Environments


    ## Python: Create virtual environments for projects


    Python is deeply integrated with Linux and the tremendous breadth of the Python
    ecosystem is the language''s strongest point. But Python 3 broke backward compatibility
    with Python 2, which changed libraries were less than known to accept. Having
    to reconfigure system-wide Python installation becomes tedious, and installing
    specific versions of Python across different distributions can fail due to syntactic
    differences or library APIs. A easy way to manage this is using virtual environments
    (venv), which isolate projects from the system. Libraries installed in a venv
    don''t interact with the rest of the system, reducing conflicts and leading to
    an enjoyable workflow. For example, both python and python3 are redirected to
    files hosted inside the virtual environment. A newly created workspace contains
    a group of standard libraries considered by the script''s developer. Pyenv provides
    a bit of metadata such as the version of the Python interpreter used by the virtual
    environment:


    ![](img/06332f0e1d4d0e5b78061a5103897f51_45_0.png)


    ```

    (workspace) tam@tanh:~/workspace$ pyenv.

    # python=/usr/bin install-system-packages=false version=3.6

    ```


    An open virtual environment can be closed by entering the deactivate command.
    Alternatively, the terminal window being restarted clears the local path and variables,
    returning the Python environment to a pristine state:


    ```

    (workspace) tam@tanh:~/workspace$ deactivate

    ```


    ## Getting with venv


    Getting with venv is not particularly difficult. Ubuntu 18.04 comes with Python
    3, but venv isn''t automatically installed and must be obtained from the package
    manager, using apt. To install a version of Python 3.x or use virtual environments
    (https://virtualenv.readthedocs.org/en/stable/) to install the venv tool.


