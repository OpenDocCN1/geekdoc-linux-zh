    # Ubuntu Touch UI 体系


    在最近的 Ubuntu 发行版中，环境赋予了操作系统“收敛性”。收敛性是一种能够提供手机、平板电脑或传统桌面用户体验的应用，并同时针对触摸输入和键盘/鼠标进行了定制。与深度投入移动端显示的
    GNOME 和 KDE 不同，Ubuntu 8 的核心是 Mir，它由 Alan Greifiths 领导。这是一个极具争议的选择。公司方向的转变可能使 Mir
    的依赖成为一项重大的进展，而 Alan 仍在其中继续开发该平台。


    Ubuntu Touch 的设备安装选项比 KDE Plasma Mobile 更多，但兼容手机的范围仍然有限。如果你想尝试 Ubuntu Touch，可以使用
    Ubuntu 的 ISO 构建版本和 `ubuntu-emulator`，从多页开发中安装 apt，然后运行 `ubuntu-emulator --arch=i386
    instance`，最后运行 `ubuntu-emulator run instance` 来启动。


    Canonical 非常支持 Ubuntu Touch，并尽可能让工程团队的其他成员参与其中。该公司最近还捐赠了大量设备以协助开发工作。


    # 此时，此地


    Ubuntu Touch 今日相比于大多数竞争发行版的一个优势是，它已经由 Bohe 和 Meizu 在真实设备上发布，并且为许多其他 Ubuntu 操作系统提供了安装程序。Xperia
    2、Nexus 4、5、7 以及 OnePlus One 都可以刷入并运行 Ubuntu Touch。


    随着设备进入消费者手中——尽管数量相对有限——Ubuntu Touch 在解决“应用鸿沟”（app-gap）问题上具有理论优势，这使得它对 Librem Ubuntu
    用户非常有吸引力。


    # 在我们有 iOS 和 Android 的情况下为什么使用 Ubuntu Touch，就像问我们在有 macOS 和 Windows 的情况下为什么使用
    Linux


    ![](img/06332f0e1d4d0e5b78061a5103897f51_64_0.png)


    Ubuntu Touch 预装了一套实实的核心应用，涵盖了你对手机可能的所有预期，如拨号器、日历等——以及 Linux 级别的全功能文件浏览器和终端（包括基本的命令行应用程序），此外还有用于导航的
    uNav、用于邮件的 Dekko、Podcasters、用于照片编辑的 Instagram 以及 Messenger 游戏。其他内置了 Qt Quick Controls
    和 Ubuntu UI 工具包，这些工具与 KDE Plasma Mobile、SAFISH 等其他移动操作系统共享某些特性。


    位于 open.store.io 的 OpenStore 提供浏览 Ubuntu Touch 应用的地方，正如你所看到的，其质量参差不齐，并分为完整应用和
    Web 应用。可用应用的数量不可避免地与成熟的移动操作系统相比，这这意味着采用率是由用户适应驱动的——这正是 Purism Linux 项目注定要提供帮助的。


    - 从屏幕左边缘短滑动可以进入启动器访问应用

    - 从屏幕右边缘长滑动可以显示“主”屏幕

    - 从屏幕右边缘短滑动可以切换到上一个使用的应用程序

    - 从屏幕底部向上滑动可以显示通知和控制开关


    # 功能：Android 上的 Linux


    ![](img/06332f0e1d4d0e5b78061a5103897f51_65_0.png)


    # 额外内容：Android 上的 Linux


    在不 Root 手机的情况下运行 GNU/Linux


    如果你想在当前的（Android）设备上安装 Linux 而不丢失其功能，你有几种选择。在你的设备上安装 Linux 发行版可以提供大量功能，包括运行原生应用、提供运行命令行工具的方法，甚至运行桌面环境——尽管在
    Android 设备上这通常是不可行的。如果你在出门在外做某些重要事情之前需要备份，`chroot` 需要宿主机的 root 权限，而这在标准的 Android
    安装中是不可用的。KBOX 使用伪造库来模拟这一点，它具有某些局限性。可以在下载和运行 KBOX 之前，通过在设备上启动终端模拟器来安装它，但如果你需要更多功能，你确实需要走
    Root 这条路（root out route）。


    如果你不想 Root（这通常涉及解锁引导加载程序、处理设备并承担保修失效的修改风险），最流行的选项是 KBOX（详见 kevinmore.net/kbox.html）。


    在 Google Play 商店提供的 Linux Deploy 是 Android 的另一种简单解决方案。该应用程序在闪存卡上创建一个磁盘镜像，挂载它并安装
    Ubuntu。应用的分发允许你与 Android 操作系统共同运行 Linux。最重要的是，对设备进行的所有更改都是可逆的——可以删除该程序及其组件。


    如果你正寻求在 Android 上运行 Linux 环境，并提供全套标准命令行工具（如 `tar`、`grep` 等）、控制台编辑器（Vim, Nano）、网络工具（SSH,
    Droplet, Dropbox）以及开发工具（C/C++, Perl, Python），那么 Python 是你的首选。


    在支持 Linux 的 Chromebook 上安装设备是可能的。


    可以通过 `chroot` 在一个 Linux 发行版之上运行另一个 Linux 发行版。遗憾的是，一如既往，使用 root 权限时必须格外小心——确保你已经备份了设备数据和商店
    ROM 镜像！


    ![](img/06332f0e1d4d0e5b78061a5103897f51_65_1.png)


    # 在 Android 设备上安装 KBOX


    ![](img/06332f0e1d4d0e5b78061a5103897f51_65_2.png)


    - 1 安装一个终端模拟器

    KBOX 的安装直接在你的设备上通过命令行完成。第一步是从 Google Play 商店安装终端模拟器应用程序，例如 Jack Pavel 开发的 Terminal
    Emulator。


    - 2 下载基础安装程序

    KBOX 无法从 Play 商店下载，但文件可以从 kevinmore.net/kbox.html 获取。你需要根据设备下载正确的版本，Arm 或 x86。


    - 3 准备安装程序

    启动你的终端模拟器，进入目标目录 `/data/data/jackpal/`，拷贝安装（`cd /sdcard/; cp kbox4-install-base-arm
    kbox4-install-base`）并设置权限（`chmod 755 kbox4-install-base`）。


    - 4 运行并完成安装

    准备完成后，只需运行二进制文件。完成后，shell 将通过 `/data/data/jackpal.android/kbox4/bin/kbox_shell`
    工作，这样就完成了！


    # 世界最好的 LINUX 杂志


    ## 世界最好的 LINUX 杂志


    ### 世界最好的 LINUX 杂志


    '
