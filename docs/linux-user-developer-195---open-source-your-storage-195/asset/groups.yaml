    ![](img/06332f0e1d4d0e5b78061a5103897f51_86_2.png)


    ## ArcoLinux 6.9.2


    ![](img/06332f0e1d4d0e5b78061a5103897f51_87_png)


    ### 发行版


    ### ArcoLinux 6.9.2

    基于 Arch 且只有一年历史，但不要将其视为另一个基于 Arch 的发行版。


    ArcoLinux 经历了活跃的一年。该项目通过两个名称来更好地封装其不断发展的愿景。使用 ArcoLinux 执行并学习 Arch。领导者将学习过程分为几个阶段，三个发行版都是此之旅的一部分。每个阶段都在主安装上创建自己的发行版。


    一旦你熟悉了发行版，从切换到 Openbox 直接到平铺窗口管理器开始学习。


    ![](img/06332f0e1d4d0e5b78061a5103897f51_87.png)


    任何64 位处理器，内存至少 4GB，存储至少 12GB 等。可用 https://arcolinux.com


    第三也是最新的选项叫做 ArcoLinuxB，允许你修改原始 ArcoLinux ISO 并构建自己的镜像。主机有一系列由社区贡献的自定义 ISO。


    ArcoLinux 建议从同名发行版开始你的旅程，它是开发者接管之前的最后一个版本。我们的工作方式由开发者自行设定。环境进入自定义的 Xfce 桌面并启动
    Calamar 安装程序。你可能在投入使用之前先探索该发行版。


    自定义发行版启动，用吸引人的图标主题和 Plank 欢迎你。ArcoLinux 使用 Xfce 的菜单，还有壁纸切换器。


    在三个版本中，主 ArcoLinux 版本提供了各种环境，充满了生产力应用，并为普通用户设计。光谱的另一端是极简的 ArcoLinuxD，它配备了足够的组件帮助你构建自己的安装。


    ### 设置

