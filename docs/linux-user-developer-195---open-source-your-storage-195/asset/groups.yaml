    ## 业务


    ## 下萨克森州税务局放弃 Linux


    预计将 13,000 名用户从 openSUSE 迁移到 Windows 10 将耗费该州 1300 万欧元。


    继今年早些时候报道德国慕尼黑市在运营 15 年后花费超过 1000 万欧元将放弃 Linux 后，下萨克森州（首府汉诺威）现在也效仿此，在多年后将其税务部门放弃了
    Linux。


    对于运行过旧版本 openSUSE 的 13,000 台工作站来说，首选解决方案意乎其然是 Windows 10。在线出版物 Heise 报道，转型预算为
    590 万欧元，尽管另外预留了 700 万欧元。


    正如 Heise 指出的，官方说法是正在研究替代方案。为此，下萨克森州州（下辖汉诺威财政部）正在制定框架条件和可能的替代方案。


    考虑到员工和信徒拥有的工作站、个人电脑和笔记本电脑之间的兼容性问题，问题似乎与其说是兼容性，倒不如说是已建立的工具及协作系统的可用性。


    无论如何，我们将确定短期内将做出哪些变化、长期影响，并确认成本/效益评估。


    遗憾的是，这对于当地的开源专家来说是一个巨大的意外。2017 年，萨克森州执政党联盟民盟（CDU）和社民党（SPD）之间的联合协议，以及一项“下萨克森州基于
    Linux 的流程”已付诸终结。


    这一点受到了欧洲自由软件基金会（FSE）的关注，


    ## 这对于当地的开源元素来说并不是巨大的意外


    ![](img/06332f0e1d4d0e5b78061a5103897f51_5_0.png)


    使用我的时通讯鼓励读者在挑战有关开源软件使用的政策时，思考一下开源社区主席 Noie Kees。


    > “许多机构发现自己自己在无意中被锁定在某种政策中，因为最初的选择确保了替代方案被系统地忽略了”


    一旦慕尼黑案例结束，在没有任何感谢 Linux 能力或像 Microsoft Office 等跨平台替代方案的情况下，什么被“维持”了，


    显而易见，下萨克森州的决定是不可逆的，要么是巨大的预算削减，要么是突然意识到它并不实用。这两者都不特别可能，但正如 FSE 所指出的，


    在萨克森州放弃 openSUSE 似乎是因为基础设施问题


    在议会中获得特许（这是一个“好迹头”吗？），FSE 认为这种对自由软件的明确“观点”，以及我们都可以与政治家进入关于自由软件的讨论，


    下萨克森州的规模和预算可能比慕尼黑小，但转型过程将同样困难——而且可能事实如此，最终将由德国纳税人买单。


