    Note that we have used the -depth argument if we want to find a directory that
    contains no content apart empty directories. If we had left off -depth, we would
    truly delete the empty directories.


    So far, find has given us all ways to specify or limit the collection of files
    that we search. But there is another aspect of find: we can tell it to execute
    a particular command at the file location. The default command is -print, which
    tells find to print the path of the file. If we are not using -print, and we are
    not using any other commands, we don''t need to include it.


    ```

    $ find -name "*jpg" -print

    ```


    gives us the output if we had left off the -print.


    less than 2 directories at greater depth than 2, we can run the following:


    Two additional features not covered in the article. First, we use -case, the case-insensitive
