    ## Father of Python, Guido van Rossum, quits now


    No successor named, as ‘benevolent dictator for life’ walks away


    **30 years after creating the Python development language, Guido van Rossum has
    stepped down following some difficulty surrounding the signing of PEP 572.**


    Posting to the Python mailing list, van Rossum explained. "Now that PEP 572 is
    done, I no longer have to be hard for a PEP and find that so many people despise
    my decisions."


    The PEP process (Python Enhancement Proposal) is the process used to add features
    and standards to the Python language. While other languages might allow evolution
    with a vote, Python was developed by van Rossum personally signing off on every
    proposal.


    In statements, Rossum has also refused to name a successor (or, indeed, any future
    system of leadership), leaving the Python community in dilemma how to come up
    with a solution that would make clear his future involvement unnecessary. "So
