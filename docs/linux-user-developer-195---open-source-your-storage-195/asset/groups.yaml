    # 开源


    您的 Linux 新闻与观点来源


    ## 访谈 Framasoft


    ## 视频自由万 (Vive le vidéo libre)


    PeerTube 旨在掌控视频共享。我们采访了 Framasoft，这是这一成功众筹活动背后的集体。


    互联网最初是去中心化的，通过少数大型利益公司运营。受控制的服务、被使用的数据——特别是在最近的选举中——对许多用户来说都是严肃的概念。


    去中心化正在兴起。联邦化服务一直是开源领域的一个热门概念。首个例子可能追溯到 2008 年的开源微博客平台——但近年来，随着公众意识的增强，我们看到了像 Twitter、Mastodon
    这样知名度和使用率更高的平台的出现。


    **Framasoft**

    一家小型非营利组织，通过实际项目推广自由软件及其文化。


    另一个成功是 PeerTube。它的众筹目标是 26,800 欧元，这是一个由拥有数十成员的非营利组织 Framasoft 构建的去中心化视频共享平台。与
    Mastodon 一样，用户可以建立自己的 PeerTube 实例并允许人们上传和共享实例。PeerTube 通过 ActivityPub 协议（参见“什么是
    ActivityPub？”）去中心化，这种工具的使用是一个有趣的发展，它超越了微博客，并结合了 WebTorrent——一种基于 BitTorrent 的浏览器点对点文件传输实现——来分担视频流负载。


    Framasoft 是一个集体，主要通过个人捐助获得资金，并将自定义为“一群想要改变世界的朋友，一次改变一个字节”。自 2004 年以来，Framasoft
    一直在制作自由软件和运营博客，以及大量实用且有用的项目。这包括创建一个自由软件目录（https://frameto.org），以及像 Framakey（https://framakey.org）这样的项目，这些项目预装了可以在
    Windows、Mac、Linux 和博客上使用的自由软件，它它有自己的出版社。


    凭借着 Framasoft 的集体精神，我们对 PeerTube 进行了采访。这是一个免费的协作编辑平台（https://peertube.org/en/），拥有许多贡献成员，包括实例所有者。他们的回答为了流畅和清晰经过了微调。


    **请告诉我们关于 PeerTube 的情况 —— 我们为什么要使用它？**


    PeerTube (https://peertube.org) 是一个免费的视频平台。它是免费且轻量的软件。在服务器上运行自己的 PeerTube 实例并随时开始播放视频，或者你可以加入现有的实例。我们不想控制平台；我们正在为人们创建一个属于他们自己的工具！


    使用 PeerTube 让你能够以低成本按照自己的规则拥有你自己的视频。PeerTube 实例允许你选择想要关注的实例，因此你可以指向来自实例内部的视频。这种联邦机制允许每个
    PeerTube 实例共享和编辑视频。当用户使用你的视频之一时，视频将直接从 PeerTube 实例流传输到他们的浏览器。


    当用户同时观看同一段视频时，视频通过网络浏览器使用 WebTorrent 这样的网络技术在他们之间进行无缝共享。这意味着，如果你的某段视频火了，大量用户观看它不会增加你服务器的负担，因为每个使用它进行下载的人都在进行点对点共享。


    ![](img/06332f0e1d4d0e5b78061a5103897f51_11_0.png)


    FamaTube 之上是 Framasoft 的 PeerTube 实例，根据该集体的说法，还有一个多个实例。PeerTube 托管了超过 12,000 个视频。


    **PeerTube 如何上传视频**


    PeerTube 平台的一个关键方面是用户能够托管自己的视频托管服务器（或者至少被称为“实例”），然后将他们的实例与他们在联邦网络中发现的其他实例进行同步。


    PeerTube 实例使用 REST API（框架）、WebTorrent Tracker（追踪器），以及通过 HTTP 协议进行视频种子（seeding）。当用户上传视频时，REST
    API 会创建一个种子文件并将其添加到数据库。当用户上传视频时，追踪器会指示所有正在观看该视频的人，以及网页端的 HTTP URL，这使得 BitTorrent
    能够从任何 HTTP 服务器下载视频。


    ![](img/06332f0e1d4d0e5b78061a5103897f51_12_0.png)


    **你们已经通过目前的众筹实现了第一个和第二个目标。什么将让你们能够使用 PeerTube？**


    第一个目标是界面的本地化并支持多种语言。这将使我们能够在视频中包含字幕，并方便不同观众群的无障碍访问。


    我们还将为用户开发馈送（feeds），允许他们通过 RSS 协议从外部源导入视频。你可以订阅 PeerTube（YouTube, Vimeo, Dailymotion）以及其他实例的种子文件。这意味着我们可以搜索并添加高级搜索功能，并提高软件稳定性（解决
    Bug 和可扩展性）。


    第二个目标的下一个功能将允许视频冗余（redundancy），在实例之间共享，或者当原始实例被删除时，供联邦中的所有用户和频道使用——这样用户无论其联邦设置如何，都可以订阅他们想要的任何内容。


    **是什么让你们决定使用 PeerTube (https://activity.org/)？**


    我们（起初）使用私有协议，认为 PeerTube 不符合我们的需求。但几个月后，我们看到 Gargon（Eugen Rogchenko，Mastodon (https://joinmastodon.org/)
    的开发者）使用 ActivityPub 作为一个个人项目启动了一个视频平台。在交换了一些邮件后，他给了我们如何使用 ActivityPub 的提示。我们初此并不习惯，但我们开始使用它，因为我们想创建一个对所有人免费的平台。


    '
