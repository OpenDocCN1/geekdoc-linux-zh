    ## 测评


    ## 防火墙发行版


    ### IPFire


    一个非常强大的管理工具，可以轻松承担新功能。


    ### OPNsense


    另一个活跃防火墙发行版的分支，界面更加精美。


    ![](img/06332f0e1d4d0e5b78061a5103897f51_81_0.png)


    - 你可以使用 IPFire 来限制某些规则建立的连接数，以防止 Dos 攻击。


    ![](img/06332f0e1d4d0e5b78061a5103897f51_81_1.png)


    - OPNsense 支持行业标准的 sense 协议，该协议与第三方引擎通信以防止恶意软件。


    ## 部署便利性


    安装涉及设置文件系统并允许安装程序接管计算机的硬盘。系统随后返回向导，您在其中为连接的 NIC 分配四种颜色标记区域之一并对其进行配置。在进入登录 shell
    之前，您会被要求设置密码。


    ## 部署便利性


    你可以直接登录安装程序，操作非常直观。安装后，OPNsense 会启动到命令行仪表板，你在那里配置网络接口并分配角色和 IP 地址。完成这些后，发行版将返回基于浏览器的登录界面和地址。


    ## 扩展性与维护


    IPFire 带有 pfSense，这是一个功能广泛的包管理实用程序，可以轻松完成基础安装。它有许多实用的插件，例如 ClAV 病毒扫描器、Bakula 备份工具和
    AssistX。你可以使用包管理器检查并安装整个系统包的更新。


    ## 扩展性与维护


    你可以通过添加几十个支持的插件中的一个或多个来使用基础 OPNsense。这些包括 Let''s Encrypt 客户端/服务器、FreeRadius 认证以及如
    Tor 和 UPnP 等服务。该部分还允许你配置并安装包的更新。


    ## 其他功能


    IPFire 可用作 URL 过滤器、名称服务器、更新加速器等。它还使用了代理服务器并允许你使用 IPSec 和 OpenVPN 创建 VPN。对于防止防火墙职责，你可以结合
    Squid 和插件 guard 来完成。


    ## 其他功能


    除了使用 OpenSSL 之外，OPNsense 还有你使用 LibreSense 的功能。OPNsense 提供了其他几种运行功能。你可以将其作为转发代理、流量整形器、负载均衡器，用于检测和防止入侵，以及通过
    via、OpenVPN 和 PPPT 进行 VPN 连接。


    ## 管理界面


    管理界面具有简单且易于导航的布局，防火墙的不同方面通过页面顶部的标签页提供服务。它对齐清晰且标记明确，简化了配置过程。


    ## 管理界面


    OPNsense 拥有该组中测试中最精美的界面之一。某些部分（如设置页面）包含一个搜索框，可以向所有字段附加相关信息。使用搜索可以直接跳转到特定设置，而无需浏览菜单。


    ## 总体


    IPFire 易安装，Web界面使得设置和配置变得简单。包管理器更是锦上添花，并扩展了发行版的实用性。


    ## 总体


    OPNsense 是一个全面的发行版，功能远比简单的防火墙多。它所有支持的功能都通过一个吸引人的界面展示，可能会让初次用户无所措。


    ## pfSense


    基于 FreeBSD 的发行版，其功能远超防火墙。


    ### SmoothWall Express


    一个成熟且熟练的纯防火墙产品，不提供任何插件。


    ![](img/06332f0e1d4d0e5b78061a5103897f51_82_0.png)


    ![](img/06332f0e1d4d0e5b78061a5103897f51_82_1.png)


    - 使用 pfSense 中的流量整形（Traffic Shaping）创建一组默认规则，你可以根据自己的网络对其进行微调。


    - 你插入一个配置好的驱动器，SmoothWall Express 将自动将运行中的防火墙备份到其中。


    ## 部署便利性


    这是 OPNSense 的原始项目。这两个项目现在完全不同，但安装和初始配置过程很大程度上是相同的。安装后，你必须使用 Web 界面管理并配置网络接口。


    ## 部署便利性


    安装 SmoothWall 非常直观。一旦你选择了文件系统并它接管了计算机磁盘，它就会启动浏览器，可以在其中配置主机名等内容。你还被要求在三个流量流量功能中选择一个。与
    IPfire 类似，你的 NIC 分析到四种颜色选择之一。


    ## 扩展性与维护


    pfSense 包含一个包管理器，可安装和部署几十个实用的包，如 Asterisk、Datasguard、Squid 等。发行版会检查可以一键安装的更新，此外包含大量的诊断工具和实用程序来排除安装故障。


    ## 扩展性与维护


    虽然它看起来有点老派，但它没有包管理功能。事实上，不仅 UI 提供了添加或启用更多模块的选项，因为所有支持的功能都包含在发行版中。你可以一键检查并安装所有更新，并且被要求保留配置备份。


    ## 其他功能


    pfSense 在基础防火墙之外还有极其丰富的功能列表。你可以将其作为服务器负载均衡器，通过 IPsec 和 OpenVPN 提供 VPN 功能，并作为 DNS
    客户端向一系列服务注册你的 IP 地址。


    ## 其他功能


    除了使用 OpenSSL 之外，OPNsense 还有你使用 LibreSense 的功能。OPNsense 提供了其他几种运行功能。你可以将其作为转发代理、流量整形器、负载均衡器，用于检测和防止入侵，以及通过
    via、OpenVPN 和 PPPT 进行 VPN 连接。


    ## 管理界面


    管理界面具有简单且易于导航的布局，防火墙的不同方面通过页面顶部的标签页提供服务。它对齐清晰且标记明确，简化了配置过程。


    ## 管理界面


    OPNsense 拥有该组中测试中最精美的界面之一。某些部分（如设置页面）包含一个搜索框，可以向所有字段附加相关信息。使用搜索可以直接跳转到特定设置，而无需浏览菜单。


    ## 总体


    IPFire 易安装，Web界面使得设置和配置变得简单。包管理器更是锦上添花，并扩展了发行版的实用性。


    ## 总体


    OPNsense 是一个全面的发行版，功能远比简单的防火墙多。它所有支持的功能都通过一个吸引人的界面展示，可能会让初次用户无所措。


    ## pfSense


    基于 FreeBSD 的发行版，其功能远超防火墙。


    ### SmoothWall Express


    一个成熟且熟练的纯防火墙产品，不提供任何插件。


    ![](img/06332f0e1d4d0e5b78061a5103897f51_82_0.png)


    ![](img/06332f0e1d4d0e5b78061a5103897f51_82_1.png)


    - 使用 pfSense 中的流量整形（Traffic Shaping）创建一组默认规则，你可以根据自己的网络对其进行微调。


    - 你插入一个配置好的驱动器，SmoothWall Express 将自动将运行中的防火墙备份到其中。


    ## 简要对比


    | 特性 | IPFire | OPNsense | pfSense | SmoothWall Express |

    | :--- | :--- | :--- | :--- | :--- |

    | **部署便利性** | 设置涉及文件系统向导和颜色标记区域。 | 直接登录安装程序，命令行仪表板。 | 与 OPNsense 类似，使用 Web 界面。
    | 直观，基于浏览器配置。 |

    | **扩展性** | pfSense 包管理器，插件（ClAV 等）。 | 数十个插件（Let''s Encrypt, Tor 等）。 | 包管理器（Asterisk,
    Squid 等）。 | 无需包管理，包含所有功能。 |

    | **其他功能** | URL 过滤器、名称服务器、代理、VPN。 | 转发代理、流量整形器、负载均衡器、VPN。 | 负载均衡器、VPN、DNS 客户端。
    | Web/POX 代理，流量统计。 |

    | **管理界面** | 简单易导航，标签页布局。 | 精美界面，包含搜索框。 | 下拉菜单，无搜索，相关设置。 | 防防火墙功能位于标签页。 |

    | **总体** | 易安装，包管理器实用。 | 全面，界面吸引人。 | 成熟产品，远超简单防火墙。 | 成熟，但缺少插件。 |


    ## 冠军者是 ...


    ## IPFire


    在部署如防火墙等服务时，管理员的偏好将超过技术熟练度。这就是为什么我们的客观测试结果和建议受到了我们偏好的影响。


    由于共同的血缘，基于 FreeBSD 的 IPFire 和 OPNsense 非常相似。每个都显示出类似的界面、命令行支持以及分配 NIC 角色等重要任务。OPNsense
    和 pfSense 的 Web 端管理在经验丰富的管理员手中比 SmoothWall Express 的界面导航更有用。


    SmoothWall Express 仅因其无法作为防火墙而输，但这可能正是你所需要的；相反，IPFire 成功地在形式和功能之间取得了平衡。它具有灵活的界面，功能并不缺，并且可以通过插件扩展并拥有更多文档。它们都支持虚拟化，因此我们建议在选择之前先在虚拟机中设置并探索。


    '
