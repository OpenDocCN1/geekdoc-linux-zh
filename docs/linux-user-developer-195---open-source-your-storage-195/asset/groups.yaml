    \ function that will enable the user to display some \"File upload error\" message.\n\
    \nThe next line is a defer statement, a special Go construct that we have not\
    \ met. defer means \"execute this command at the end of the function\". It's a\
    \ very useful way to get code to run without having to go to the bottom of the\
    \ function and write it. If a function has\n\nshould redirect the user to the\
    \ page where their new video is so they can start enjoying it immediately. If\
    \ it has not already returned of an error, we will use nil channel to signal the\
    \ user that something\n\n```go\nhttp.Redirect(writer, request, \"/video/\" + id,\
    \ )\n```\n\n## Safety from injection attacks\n\nGo is very good at protecting\
    \ us from an injection attack. This is when a malicious user tries to insert code\
    \ into an input field that they'll be able to bypass the security and gain access\
    \ to your system.\n\nIn Figure 7, we see an attempt at a benign injection attack:\
    \ someone has decided that they've wanted to style the title of the home page,\
