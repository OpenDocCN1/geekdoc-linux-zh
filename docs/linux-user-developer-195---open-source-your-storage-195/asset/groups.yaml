    # Welcome to 195 Linux User & Developer

    in this issue


    +   ## Open Source Storage, p18

    ## Purism''s Open Phone, p58

    ## Firmware Distributions, p81


    Welcome to the UK and North America''s No.1 Linux and open source magazine.

    Data and how it controls it is a vital issue. In this we are covering how to open
    source

    you store or control your data (p18)

    These days, it''s easy if you want to clear the cloud strop

    it all up, but if you want to be in the early seat,

    we have exciting features to explore. We also take a look at

    open source OSes that might be supported by Purism''s Phone 5 which we de-liver


    next year (p58). On an early look – kits go out in September –

    but it''s exciting to see what that year has store!

    In the tutorials section, we see entry-level guides from Bash

    Linux Essentials (p52), setting up a Python virtual environment

    and using scripts in LibreOffice (p38), to make

    advanced articles available in Computer Science (p42),

    running code across a Pi cluster (p48), and making

    networked set of Pis. Of course, that''s our actually featured

