    ……供操作系统进行调查。特殊的硬件特性意味着影子栈（shadow stack）在解锁发生之前无法被重写。最新的内核补丁（由 Yu-chen Yu 发布）包含更多此类功能，包括对用户态和内核影子栈的支持，以及间接分支跟踪（用于防止
    JOP 攻击）。构建完全启用 CET 的内核需要 v2.33 版本二进制文件和 GCC 8.1。预计在即将推出的 glibc 2.28 中提供用户空间支持。硬件的部署和支持还需要一段时间。


    # SegmentSmack


    本月又出现了一个影响 Linux 内核的安全漏洞，它同样属于非推测性的传统类型，被称为 SegmentSmack。最近的 Linux 内核（4.9 及更高版本）对核心网络进行了更改，使其容易受到“资源耗尽”。


    ## 这些攻击有时也被称为“栈溢出”，因为小缓冲区存储在程序的栈上


    在这种情况下，可以使用虚拟机创建特制的 TCP 连接。如果连接没有大缓冲区或代理，它可能容易受到数据外泄（tentfiltration）的影响，但也可能导致系统调用
    `_tcp_prune_of_users_` 时产生极其昂贵的计算开销。因此，通过相对低频率的特殊修改攻击，攻击者可以在不需要管理员权限的情况下导致系统变得无响应（参见原始
    CVE-2018-5390）。许多企业不得不发布带有漏洞代码的内核，这本身也减轻了其影响。


    在其他通用进展方面，Martijn Coenen 发布了一个名为“符号名称”（Symbol names）的补丁系列，旨在清理加载模块使用的 Linux 导出符号（内核函数）。当你在
    Linux 系统上使用内置第三方驱动程序时，内核模块需要通过约 30,000 个符号解析，而这些符号传统上拥有扁平且且简单的命名空间。


    最新的补丁通过在符号名中包含额外的上下文（如子系统前缀）改变了这一点。这将允许开发者细粒度控制第三方使用哪些内核符号，例如防止误用并非设计供外部使用的接口。


    Ted T''so 发布了一个名为“random”的补丁，通过添加选项通过“HW”（硬件随机数生成器）配置 CPU 的 hwrng。在笔记本和台式机等 x86
    类机器上，使用了指令 (RSEED)。然后使用 `READSEED()` 获取内核的随机源；事实证明，如果系统本身存在由于地缘政治格局变化导致的“随机性”熵，内核系统调用将失败（静态）。（注：此处原文逻辑存在
    OCR 乱码）


    Ted 提到，美国最近对中国科技公司 ZTE 执行了“死刑”，该公司利用在中国内的业务进行本土化生产或与美国制造商合资。他不想更新，也不想决定信任哪些供应商。这无疑会影响某些迷失的选择。


    ![](img/06332f0e1d4d0e5b78061a5103897f51_16_0.png)


    # 让你的存储开源


    市售的网络附属存储设备（NAS）可能很贵。Neil Bothwick 解释了如何制作和维护自己的 NAS，以获得终极控制和安全性。


    # 概览


    - 发行版选择 p20：在选择硬件后，下一步是选择合适的发行版。

    - 外部访问 p24：从网络外部访问文件时需要做什么以及注意什么。

    - 选择文件系统 p20：根据 NAS 将运行的软件确定其基础。

    - 管理 p26：保持所有内容为最新且安全，并为无头 NAS 添加管理管理功能。

    - 文件和媒体共享 p22：如何让其他人访问你的文件，并向播放器发送媒体。

    - 备份 p28：确保 NAS 文件安全，并利用它保护其他电脑上数据的安全。


    家里有多台计算设备是很现象，在这些情况下，这些设备拥有存储在不同设备上的文件集合。你想要的文件总不在你正在使用的设备上。在家庭环境中，这很常见；在商业环境中，随地访问文件至关重要。


    NAS 的要求相当简单。它不需要强大的动力，因为它只提供文件服务，存储和内存是关键。你需要一个尽可能带有 SATA 接口和驱动器的设备；目标是以后增加存储空间。你还应该考虑
    NAS 存储，这意味着为文件提供更多磁盘空间（我们稍后会介绍），因为这在内存方面需要几 MB 的空间才能运行得更高效。


    NAS 通常 24/7 运行，因此功耗通常是一个考虑因素。一个比带有华丽图形的桌面系统重要的系统是理想的。其他功率消耗是噪音水平，这对 NAS 来说很重要，因为大家非常在意。


    > NAS 通常 24/7 运行，因此功耗通常是一个考虑因素


    解决方案是单一存储位置：网络附属存储（NAS）。文件存储意味着从任何地方都可以访问一切。在设置 NAS 时，你有三个选择：购买预制 NAS、自己构建，或在现有硬件上添加
    NAS 功能（这比网络连接快得多，尤其是对于 USB 驱动器）。谈到网络，你显然需要最快的连接。如果你的 NAS 有两个以太网口，可以将它们绑定在一起，以增加一个客户端从另一个客户端下载时的带宽。


    （注：原文后续为大量重复及乱码，已剔除）

