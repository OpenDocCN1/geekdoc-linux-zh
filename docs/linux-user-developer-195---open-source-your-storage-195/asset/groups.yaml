    # IPython Parallel


    # Run parallel code on your Pi with IPython Parallel


    There are lots of methods to run parallel code on a network of Raspberry Piis
    – here is one of the best


    ![](img/06332f0e1d4d0e5b78061a5103897f51_47_0.png)


    ![](img/06332f0e1d4d0e5b78061a5103897f51_47_1.png)


    **Joey

    **Bernard**


    Joey is a colonist covering scientific software, as well as writing Python code
    for the Raspberry Pi. In his day job, he helps researchers and students at the
    university level design and run HPC projects on supercomputing clusters.


    # Resources


    +   * [IPython Parallel](https://ipython-parallel.readthedocs.io/en/latest)

    * [Berryonda](https://github.com/berryconda/berryconda)


    The Raspberry Pi provides a very powerful yet energy-efficient computing package.
    While its portability makes it a great platform for mobile application development,
    in this issue, we''ll look at how to run parallel code on a network of Raspberry
    Pis. Specifically, we''ll show how to set up a cluster of Raspberry Pis using
    IPython, and how to run parallel code on this cluster using static IP addresses
    in the range 192.168.0.2-254, since these are reserved for internal networks.


    You''ll start by physically connecting the Raspberry Pis together. This may be
    via a small switch or the same router. For the rest of the article, we will be
    assuming that the Raspberry Pis have all static addresses in the range...


    From here on we move to setting up the cluster and actually running jobs. You''ll
    end up with the quietest and most energy-efficient supercomputing cluster you
    know (well, men).


    # Getting started


    IPython —often referred to by its shorter name ipparallel — is a Python module
    that adds the ability to run multiple IPython engines and have them talk to each
    other. These could be on a single machine, but in order to maximise the amount
    of computing you can do, they can run on separate machines. IPython is built on
    a larger structure of three parts: a controller, or one or more engines. The engines
    are the


    ipy kernels that actually run your Python code. In our setup, these engines will
    be distributed across the connected Raspberry Pis. The clients are the program
    that connect to the engines and request computations to be done. The controller
    is the core of your IPython cluster, and is actually made up of a hub and more
    managers. The managers handle the communications between all of the parts and
    manage the work given to them.


    # Install IPython parallel


    The first step is to install IPython on your Raspberry Pi. It''s unlikely to be
    in the package repository of whatever distro you are using, so in most cases,
    you''ll need to install it using pip —which of course, means installing pip in
    Debian-based distributions, such as Raspian —with the following command:


    ```

    sudo apt-get install python-pip

    ```


    If you''re using Python 3.x, you''ll need to install python3-pip. Once installed,
    you can then install ipparallel with the following command:


    ```

    sudo pip install ipparallel

    ```


    If you''re using Python 2.x, you may run into an issue. The latest versions of
    IPython don''t support older versions of Python 2.x and 3.x, and you are more
    likely to have an older version of Python 2.x. This is because'
  - '[PAGE 48]


    most projects are to run Python 3.x. If you run into problems with your project,
    your choices are either to move to Python 3.x or install an updated Python 2.x.
    That will depend on the other requirements of your project. You will necessarily
    need to do the same thing with ipython as it is the easiest way to get all the
    support libraries and Python modules installed. So, for the rest of this article,
    I''ll assume that you simply installed the ipython on the Raspberry Pi being used.


    # Set up the master


    The master Raspberry Pi will be the main controller, called the master node for
    the rest of this article. You will need to start the controller portion of ipython
    nodes so that they can communicate with each other. One of the most important
    command options is to use --ip, where #### is the IP address if your Raspberry
    Pi cluster is isolated on its own private network, you can set this to ''*''.
    The complete command will look like the following:


    ```

    ipcontroller --ip=''*

    ```


    Otherwise, it is the IP address of the master node. Once you have started the
    program, you will see some messages being printed in the terminal window where
    these messages include the location of files being created. In many cases, this
    happens to be in /home/jbernard/ipython/default. One of the files will be used
    in the new section of this article. There will be several others too, of which
    we will look into.


    # Use profiles


    You should notice that all files are located in the ~/.ipython/default directory.
    ipython profiles allow you to have tuned configurations for different situations.
    The default one is created the first time you run the ipcontroller, and if you
    have more than one use case in mind, you can create a new profile with the following
    name:


    ```

    ipython profile --profile=myprofile

    ```


    You can then use it by adding the command line --profile=myprofile. All the options
    will be used including in the ipcontroller command can all be placed in configuration
    file in the profile directory. For example, if you want to change the following
    lines in the file located at /home/jbernard/ipython/default/ipcontroller_config.py,
    you can do as in the example:


    ```

    # ipcontroller_config

    HubFactory.ip = ''*''

    ```


    ![](img/06332f0e1d4d0e5b78061a5103897f51_48_0.png)


    > ipython is built on a layered structure of three parts: a controller, one or
    more clients and one more


    The documentation covers many options that you can tune to your controller, make
    sure to check it out.


    # Use profiles


    The Raspberry Pi nodes will be set up as clients in the code you will need to
    be configured so they know where the controller is running.


    They can also be used to authenticate with the controller. This is the file /home/jbernard/ipython/default/security/ipcontroller_engine.py.
    You may need to copy this file to the directory/ of the Raspberry Pi nodes.


    ```

    ipython --file=path/to/ipcontroller-engine.json

    ```


    The engines also use profiles, just like the controller. You can create special
    ones for special use-cases and a similar layout to the controller. The engines
    can use a configuration file. This is the file ipyengine_config.py in the profile
    directory. You can configure things such as a run to start up, as in the example:


    ```

    c.IPEngineApp.start_command = ''import

    numpy, sticky''

    ```


    +   - Keeping control files

    By default, the controller JSON files are saved while the controller is running.
    If you want to save the files, you can add the following option to the ipcontroller
    command. Otherwise, you will need to update the JSON files each time you restart
    the cluster.


