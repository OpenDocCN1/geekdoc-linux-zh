    \n### HTTP POST requests\nThe basic quanta by which clients send information to\
    \ a web server is HTTP POST requests; typically, they are generated by some form,\
    \ and they are set up to transfer any kind of data. The enctype field in the HTML\
    \ `form` specifies the encoding type that will be applied to the data. Typically,\
    \ the encoding performs character replacements, such as replacing spaces with\
    \ characters, by using multipart/form-data because we do not want to modify the\
    \ data in any way.\n\n![](img/06332f0e1d4d0e5b78061a5103897f51_55_1.png)\n\n##\
    \ LU-Tube\n\nThe video-sharing for Linux Users\n\n### Upload a video\n\nChoose\
    \ file: nil\n\nTitle\n\nupload\n\n### Our videos\n\n- Tip to the day\n\n```\n\
    <span style=\"position:fixed; font-size: large; color:yellow\">at the beach</span>\n\
    ```\n\n- Tip to the day\n\nAbove Injection attacks are a common (see box, p57)\
    \ and dangerous means of compromising the security of a server.\n\nThe Injection\
    \ attack is fixed by Go's HTML template library, which handles the special characters.\n\
    \nWe store the result variable in a form with that we can use. When called, Go\
    \ will transfer the data from the HTTP request into the program's memory. The\
    \ value is stored until the maximum number of bytes of RAM is reached, then it\
    \ will store the data as temporary files.\n\nmultiple return values, this is particularly\
    \ useful. We should also handle the case where\n\n```\ntitle := request.FormFile(\"\
    title\")\n```\n\n```go\nif err != nil {\n    return err\n}\n```\n\nIf there is\
    \ an error, we deal with it immediately:\n\nWe need to come with a unique ID for\
    \ the video. We do this by taking advantage of the TempDir function in the os\
    \ package. This function is intended to create a temporary directory which will\
    \ be deleted. TempDir will always make sure that the name of the directory does\
    \ not clash with an existing directory.\n\n```go\nvideo, err := request.FormFile(\"\
    file\")\ndefer video.Close()\n```\n\n```go\nvideodir, err := os.TempDir(\"video\"\
    , \"\")\ndefer os.RemoveAll(videodir)\n```\n\nWe can now download the data from\
    \ the calling members of the video request. First, let's upload the video to file:\n\
    \nTempDir creates a new directory on the file system and returns a string with\
    \ the path to the directory where it was created, and the second is an optional\
    \ parameter to set the user ID of the directory. We'll have to deal with the error\
    \ if one.\n\nThe parameter to Form is the name of the field in the HTML form.\
    \ It returns the file and an error value (with the file header information),\n\
    \nThe next step is to save the video file. This can be complicated, but for now\
    \ a simple function for it is sufficient. We've already written this function\
    \ so we can finish writing using uploadVideo\n\n> We need to come with a unique\
