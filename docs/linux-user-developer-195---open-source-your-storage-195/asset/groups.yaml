    \ | FRAME_PACKET false |\n| FRAME_PACKET = false |\n| auxiliary/icmp_exfil | INTERFACE\
    \ veth0 |\n| INTERFACE = veth0 |\n| auxiliary/icmp_exfil | IP 1 |\n| IP = 1 |\n\
    | auxiliary/icmp_exfil | BPF filter src and 192.168.1.10 |\n| BPF filter = src\
