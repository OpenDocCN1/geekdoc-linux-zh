    HP 最新 Chromebook 是第一台可拆卸的 Chrome OS 机器，能够运行完整的 Linux。


    Chromebook 通常针对教室或极低端市场，但随着第一款可拆卸 Chromebook 的发布，它继续向主流市场军军。，HP 并不是市场的新手，各种 Chromebook
    和设备，甚至带有 x2 品牌的产品都一直很充足。


    从顶盖的白色陶瓷质感、大猩玻璃屏幕和灵敏的键盘，到键盘侧精美的 Bang & Olufsen 扬声器带来的收益，这台机器做工精良，物有所值。机器虽然有重量，但平板电脑本身仅重
    735g，是 Android 的极佳替代品。Chrome OS 本身由 Google 开发，在 Chrome OS 路线的基础上构建，试图彻底解决“Chrome
    OS ‘仅仅’只是一个昂贵的 Web 浏览器”这一命题。Google 现在再次推出了 Play Store，使 Chromebook OS 设备能够运行一系列
    Android 应用，而随着“Croini”项目的启动，Chrome OS 的实用性本身又有了一次飞跃。


    快速查看配置表明，该 Chromebook 适用于 Chrome OS，尽管 4GB 内存和 32GB 存储是典型配置，并且无疑高于你对运行 Google
    系统的笔记本电脑的预期。当你从货架上拿起笔记本电脑时，价格就开始变得合理了——这是一件物有所值的溢价硬件。


    > Chromebook x2 的平板电脑部分使用强磁铁连接，并附带了织物附件以保持美观


    ### Croini (Linux 容器) 提供了 Android 应用所需的所有润色，且易于使用


    > 安装应用变得像使用 apt 一样简单，开箱即用常用的 Debian 仓库


    如果你以前用过 Chrome OS，你可能熟悉一个名为“Crout” 的项目。该项目提供了现在 OS 设备上启动到完整 Linux 安装的能力，在不替换 Chrome
    OS 的情况下提供某种程度的 Linux 功能。它需要切换机器并使用从终端窗口启动的脚本安装 Crou。设置很快，但它并不适用于大多数任务。非 Chrome
    OS 上的 Croini 提供了易于安装 Debian 的便利。但你知道它是如何工作的吗？


    截至今天，安装 Croini 需要在设置中启用一个开关，这会在你的标准应用列表中添加一个终端。点击它将自动下载并安装一个带有熟悉的 Debian 发行版的容器。安装应用就像使用
    apt 一样简单，Debian 仓库是开箱即用的。我们发现要在 Chromebook 上安装可能是很痛苦的，所以当然当我们第一次安装 GIMP 时，主应用列表中出现了一个图标，这特别有用，因为我们已经准备好就绪了——这台
    Chromebook X2 包含一个非常稳定的系统。


    有了 GIMP 后，我们安装了一些要求更高的东西：JetBrains 的 Rider IDE。虽然这在下载包后也能顺利安装并运行，但在没有交换内存的 4GB
    内存上加载较大的项目仍然很吃力，这突显了 Croini 的一个潜在问题。Chrome OS 机器通常受限于低内存和低存储，但随着 OS 能力和应用程序可用性的变化，这种情况将会改变。


    它正在从 Beta 转向 Stable，我们预计还会看到一些改进。它所提供的已经非常令人印象深刻，但结合 Chromebook X2 出色的硬件，它提供了愉快的
    Linux 体验。


    这不仅仅是一个适用于 Linux 用户的项目，也是一种次级机制，一种将 Linux 引入 Chromebook 并找到填补 Chrome OS“空白”的方法。Google
    做得很好——结合像 Chromebook X2 这样理想的硬件，Chrome OS 的成功似乎将持续。


    Paul O''Neill


    ### 优点

    优质的硬件设计和强大的处理器。用于 Android 应用的轻量级平板电脑，出色的键盘手感，包装时尚，且连接良好。


    ### 缺点

    对于一个只有 4GB 内存和 32GB 存储的 Chrome OS 设备来说，限制是一个因素。良好的 Linux 体验但不是完整的 Linux 体验。


    ### 总结

    决定是否购买 Chromebook X2 的重要事情是在购买前了解。运行你选择的发行版纯 Linux，但你会获得一些牺牲。


