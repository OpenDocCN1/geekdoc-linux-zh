    ## Feature


    ## Open Source Storage


    ## External access


    ## External access


    How to make sure that you and your friends can access your files from the internet,
    while keeping everyone out


    From a security standpoint, if you only want to access your NAS over a private
    network, then Linux permissions are enough for most cases, with ACLs (Access Control
    Lists) for more advanced requirements. However, if you want to allow access from
    the outside, detail about those. They will require you to open ports on your router
    and will only perform their functions. You should also consider setting up a firewall
    to further protect your systems.


    There are various VPN protocols available, but this article is also open source,
