    relinquished control of development, as if PEP 572 has given him the opportunity
    to do something that might have been in mind otherwise. He will also request a
    release from becoming BDFL. "After all is eventually going to happen regards -
    that''s stuff that lasts, and I''m enjoying the coming peace." Immediate reaction
    from van Rossum''s decision has been nature and reasoned, and with the right governance
