    \ Amazon Echo 或 Google Home 设备控制。\n\n如果你无法更好地设置 NAS 的所有软件，但想自己选择硬件（而不是旧电脑），请查看\
    \ openmediavault (www.openmediavault.com)。它主要用于小型办公室和家庭环境，\n\n![](img/06332f0e1d4d0e5b78061a5103897f51_26_0.png)\n\
    \n# Webmin\n\n虽然使用命令行通常是管理计算机最快的方法，但在你具体操作时也是确实如此，尤其是当你有足够的知识了解命令时。\n\n- 系统信息（System\
    \ Information）让你随时掌握 NAS 的状态。\n- Webmin 设置帮助配置 Webmin 的外观，你可以使用它来修改和加载更多功能。\n\
    - 系统设置（System settings）帮助处理一般的底层事务，从设置复杂的备份任务。\n- 网络选项（Networking options）帮助你处理外部访问至关重要的防火墙。\n\
    \n![](img/06332f0e1d4d0e5b78061a5103897f51_26_1.png)\n\n# 开源存储特性\n\n## 备份\n有了大量文件，确保它们安全变得更加重要，我们如何备份数据呢？\n\
    \n你的 NAS 可能会迅速积累大量不可替代的数据，这使其变得非常脆弱，因此你来考虑保持数据安全。第一步可能是使用 RAID 防止单盘故障，但备份也是必要的。备份显然是必须的，但你需要备份什么取决于你的需求。正如之前提到的，备份和替换一样简单。视频文件以及你可能在网上的照片很容易重新下载；另一方面，个人文档非常重要，且文件可能是无法替代的。\n\
    \n还应该考虑备份频率。你需要多久备份一次？直到每天结束时备份一次，每天工作每周一次。在业务环境中，你应该考虑的至少是一个与主设备镜像的第二个 NAS。这样，如果任何硬件故障，你可以以最小的干扰更换单元。你的备份确保了数据定期更新，具体取决于你的工作频率。在故障发生前，你可能需要更频繁地备份，这就是\
