    of understanding the various time-zones of our team." Meanwhile, ensuring that
    backers feel connected is simply a case of posting regular details updated via
    blog posts.


    You mentioned Heads - what is this for and how does it work?

    Hardware secures the boot process then hardware-edge software and provides a level
    of security beyond what you would find in a regular computer. Up to point, your
    main base has been expert-level users who are willing to flash hardware BIOS.
    We want all control over the extra security that we have. We intend to include
    it by default in all our hardware products in the future. We are also putting
    our own internal engineering efforts to the task of not just porting BIOS to our
    hardware, but improving it – and sharing those improvements eventually.


