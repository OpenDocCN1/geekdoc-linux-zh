    开源游戏引擎替代品进入测试阶段


    《上古卷轴 III：混沌》最早于 2002 年发布，因其对玩家要求的深层次要求及其广阔的世界，仍然是一款广受欢迎的 RPG。最近，该游戏在 Windows
    上运行变得越来越困难，且没有发布官方的 Linux 或 Mac 版本，促成了 OpenMW 平台的开发。


    OpenMW v.44 是始于 2008 年的项目的最新阶段，该项目由原首席开发者 Nicholas Sargent 发，这是由新首席开发者 Julian
    领导发布的第一个版本。


    作为一个开源、免费的游戏引擎，OpenMW 有效地替换了切换的引擎，但仍然需要原始文件。


