    ## Run parallel code on your Pi with IPython


    There are lots of methods to run parallel code on a network of Raspberry Pis –
    here is one of the best: (img/0632f0e1d4d0e5b78061a5103897f51_47_0.png) (img/0632f0e1d4d0e5b78061a5103897f51_47_1.png)


    **Joey Bernard**


    Joey is someone covering scientific software as well as writing Python code for
    the Raspberry Pi. In his day job, he helps researchers and students at the university
    level design and run HPC projects on supercomputing clusters.


    ## Resources


    - [IPython Parallel](https://ipython-parallel.readthedocs.io/en/latest)

    - [Berryconda](https://github.com/berryconda/berryconda)


    The Raspberry Pi provides a very powerful yet energy-efficient computing package.
    While its portability makes it a great platform for mobile application development,
    in this issue, we''ll look at how to run parallel code on a network of Raspberry
    Pis. Specifically, we''ll show how to set up a cluster of Raspberry Pis using
    IPython, and how to run parallel code on this cluster using static IP addresses
    in the range 192.168.0.2-254, since these are reserved for internal networks.


    You''ll start by physically connecting the Raspberry Pis together. This may be
    via a small switch or the same router. For the rest of the article, we will be
    assuming that the Raspberry Pis have all static addresses. From here on we move
    to setting up the cluster and actually running jobs. You''ll end up with the quietest
    and most energy-efficient supercomputing cluster you know.


    ## Getting started


    IPython —often referred to by its shorter name ipparallel—is a Python module that
    adds the ability to run multiple IPython engines and have them talk to each other.
    These could be on a single machine, but in order to maximise the amount of computing
    you can do, they can run on separate machines. IPython is built on a larger structure
    of three parts: a controller, or one or more engines. The engines are the IPython
    kernels that actually run your Python code. In our setup, these engines will be
    distributed across the connected Raspberry Pis. The clients are the program that
    connect to the engines and request computations to be done. The controller is
    the core of your IPython cluster, and is actually made up of a hub and more managers.
    The managers handle the communications between all of the parts and manage the
    work given to them.


    ## Install IPython parallel


    The first step is to install IPython on your Raspberry Pi. It''s unlikely to be
    in the package repository of whatever distro you are using, so in most cases,
    you''ll need to install it using pip—which of course, means installing pip in
    Debian-based distributions, such as Raspian—with the following command:


    ```bash

    sudo apt-get install python-pip

    ```


    If you''re using Python 3.x, you''ll need to install it using pip. Once installed,
    you can do the following:


    ```bash

    pip install ipparallel

    ```


    ## Set up the master


    The Raspberry Pi nodes will be set up as clients in the code. You will need to
    be configured so they know where the controller is running. They can also be used
    to authenticate with the controller. This is the file /home/berryard/ipython/default/security/ipcontroller_engine.py.
    You may need to copy this file to the directory of the Raspberry Pi.


    ```bash

    ipython --file=path/to/ipcontroller-engine.json

    ```


    ## Use profiles


    The engines also use profiles, just like the controller. You can create special
    ones for special use-cases and a similar layout to the controller. The engines
    can use a configuration file. This is the file ipyengine_config.py in the profile
    directory. You can configure things such as a run to start up, as in the example:


    ```python

    # ipyengine_config.py

    c.IPEngineApp.start_command = ''import

    numpy, sticky''

    ```


    - Keeping control files: By default, the controller JSON files are saved while
    the controller is running. If you want to save the files, you can add the following
    option to the ipcontroller command. Otherwise, you will need to update the JSON
    files each time you restart the cluster.

