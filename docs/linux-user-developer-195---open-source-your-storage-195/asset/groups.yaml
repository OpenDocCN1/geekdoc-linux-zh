    # THE ESSENTIAL GUIDE FOR CODERS & MAKERS

    PRACTICAL

    Raspberry Pi


    ![](img/06332f0e1d4d0e5b78061a5103897f51_68_0.png)


    > 70 "The core component is the gesture recognition"


    # Contents


    + 70 A clever doll''s house with tech controlled by a ''wand''

    + 72 Learn how to set up and manage a network of Pis

    + 76 Use your Pi to build an automated news machine


    # Pi Project


    # Smart doll''s house


    ![](img/06332f0e1d4d0e5b78061a5103897f51_69_0.png)


    # Smart doll''s house


    A child''s toy is brought to life with some Machine Learning magic, sensors, servos
    and Raspberry Pi


    ![](img/06332f0e1d4d0e5b78061a5103897f51_69_1.png)


    # Maks


    Maks is a grad student of Technology at the University of Washington. He''s interested
    in AI and creative programming.


    Maks Surrey''s project is based on the simple idea of enabling a child to control
    different aspects of the doll house, from lights to sensors and a doll, with a
    wag of a wand. We used a drag and drop interface involving data processing and
    Machine Learning. In effect, the doll house is a prototype for smart home use
    that the team hopes to improve, including supporting right-handed users, selecting
    what items got activated, and more. We built from scratch using a laser cutter
    and 3D printing.


    What was the most challenging aspect of the project? Believe it or not, choosing
    paint colours and furniture for the doll house was as challenging as doing for
    a real house! Also, we ran into trouble selecting the best-performing model and
    making the most intuitive gestures. We had to do a bit of trial and error to refine
    the experience. Then, we had a lot of support from the team and were able to move
    forward with the project smoothly.


    # Like it?


    Did you use across any technology that made the project much easier than expected?


    You can follow Maks on Twitter or take a look at https://github.com/MYhouse-dollhouse.
    The smart doll house would be a great tool to demonstrate technical innovations
    in an approachable way.


    What was the inspiration for this project?


    As part of our courses in the winter quarter at MSU program of Washington, we
    were required to use sensors and machine learning. I am a girl who loves dolls,
    so a smart doll house would be a great idea.


    The motor controller was a life-saver thanks to the reverse-engineering of Thomas
    Peri, who used an unofficial API for what we needed. Luckily, this also simplified
    the development of our software.


    # How does the magic work?


    MYHOUSE is a doll house with lights, doors and can be controlled by a special
    controller that responds to a wag of a wand. The doll house has a Raspberry Pi
    that learns information from a motion sensor, and uses learning algorithms to
    determine if a user''s gesture is something it has already stored in the system.


    Now that you''ve finished the project, what are any things you''d change and add
    more more features?


    # Further reading


    Maks documents everything at https://maxorky.com, as well as an explanation of
    the MYHOUSE project, where you can learn about his Prototype and his cool Nix
    clock.


    Depending on the gesture value, the lights can be activated or deactivated. You
    can see videos of lights, fans and sounds. The code is written in Python; it uses
    a Multi-Layer Perceptron (MLP) of a neural network that uses input data to perform
    machine learning framework (functions).


    > The core component is the gesture recognition that is enabled by


    toys and everything is fun! I encourage people to see our work and we''ll see
    real houses using this idea!


    Do you have any people who want to test your project? Don''t be discouraged if
    it doesn''t work right away. Free to ask questions in the GitHub repo.


    The code is simply written. We gather accelerometer/gyroscope data and pass it
    to the MLP. When a gesture is recognized, the doll house gesture corresponds to
    one of the pre-trained features. If there''s a match, a decision tree is followed
    to activate the appropriate device inside the house: TV, LEDs, fan or speaker.
    You can check out all the code on our GitHub site.


    What kind of projects do you want to work on? What''s next?


    I am working on IoT, and CNC machines to explore new ways of how to interact with
    technology. For the rest of the summer I''ll be working on Making Processing better,
    which is part of Summer of Code: https://processing.org.


    # Components list


    - Raspberry Pi 3 or Pi Zero

    - Two servo motors

    - Continuous-rotation servo

    - 7-inch screen

    - PlayStation Move Controller

    - RGB LED strip (WS281B)

    - Servo extension


    # Off-the-shelf


    To enable the team to focus on the software side of the project, Maks says they
    used off-the-shelf components. For instance, to turn the fan in the bedroom, Sergey
    used a continuous-rotation servo.


    ![](img/06332f0e1d4d0e5b78061a5103897f51_70_0.png)


    # Arduino demo


    Maks says they built a section of the house initially to demonstrate some of functional
    features, such as fans, lights and shutters, and got it working with Arduino to
    get an idea of how things would fit.


    ![](img/06332f0e1d4d0e5b78061a5103897f51_70_1.png)


    # Prep work


    Lots of prototyping work went into the house. Sergey says they started with cardboard
    prototypes to work out the scale. Once satisfied with the results, used 3D modeling
    software and laser-cut pieces from the design, and finally moved onto plywood
    using snap-fit to join the pieces.


    ![](img/06332f0e1d4d0e5b78061a5103897f51_70_2.png)


    # Gesture trainer


    Gathering training data for the gestures helped inform decisions. For example,
    Maks says the duration of each gesture needed no longer than two seconds. They
    were also able to determine that optimal number of gesture samples was in the
    range of 20 to 25: "The network works really well for the users that it trained,
    with over 95 percent accuracy."


    ![](img/06332f0e1d4d0e5b78061a5103897f51_70_3.png)


    ![](img/06332f0e1d4d0e5b78061a5103897f51_70_4.png)


    # A moving proposition


    Initially, the team had to build a motion controller from scratch, but time constraints
    meant they chose the PlayStation controller as it had built-in features, such
    as acceleration and rotation. Sergey says PSMoveAPI was pivotal in getting the
    controller to work with the Pi,


    ![](img/06332f0e1d4d0e5b78061a5103897f51_70_5.png)


    # Gesture recognition


    This is the Machine Learning gesture-recognition network structure for the doll
    house project. Sergey says they spent a lot time reading "research papers" to
    design the right neural architecture, Multi Layer Perceptron works well for gesture
    recognition.


    # Raspberry Pi: Sysadmins’ Guide


    # Sysadmins’ guide to Raspberry Pi networking


    Set up and manage a network suite of Pis with the minimum effort


    ![](img/06332f0e1d4d0e5b78061a5103897f51_71_0.png)


    This guide is designed to help sysadmins set up a network of Raspberry Pi computers
    and provide tools to monitor and assist users remotely.


    We’ll configure and install one client machine, before resizing the image to multiple
    clients. One Pi will act as a server machine, to accept connections from the client
    machines, allowing us to manage, monitor, and deploy.


    Using a number of scripts and software solutions, we’ll start off by making our
    users secure by closing any unnecessary services, changing the default password,
    creating a new user and upgrading the system. Our remote management solution will
    enable us to monitor and users, broadcast screens or execute commands from the
    server directly on the client Pis.


    We’ll configure the Wi-Fi settings, so users don’t have to, we’ll customise the
    MOTD and wallpaper to add a personal touch. Finally, we will resize and clone
    the image from one micro SD to another.


    If you don’t think a network of Pi was much use will after reading this tutorial!


    # Set up your Raspberry Pi


    Download and install the Raspbian image to a microSD card. It''s more than worthwhile
    to use commands, or at the very least default the PI user''s password from raspberry
    to everything, using password command.


    - sudo adduser USERNAME


    where USERNAME is, of course, the name of your account. You''ll be prompted to
    enter a password and confirm it. You may also be asked for details, which you
    can leave blank. Finally, you''ll want to add the new user to the system''s sudoers
    using visudo, and copy the format of the PI user.


    - pi ALL=(ALL) ALL, ALL=(ALL) ALL


    Log out with the logout command to test your new username. Once you''re finished
    doing you can delete the default user with:


    - deluser --remove-home pi


    ![](img/06332f0e1d4d0e5b78061a5103897f51_72_0.png)


    # Update and upgrade


    Before we go further, it''s important to make sure we''re running the latest version
    of everything. For an update, apt-get and dist-upgrade, followed by a PI firmware
    update.


    ```

    sudo apt-get -qi upgrade

    sudo apt-get -qq upgrade

    sudo apt-get -qq dist-upgrade

    sudo rpi-update

    ```


    # Security first


    First things, let''s make sure our client Pi is secure by closing any holes left
    open by default. The following commands will disable the camera, IC peripheral
    bus, VNC (Virtual Networking Computing) desktop sharing, and SSH (Secure) remote
    login. You may want to leave one or more of these connections open for reason;
    if so, you''ll need to change


    # Install software packages


    Now that the basics are set, we can get the system set up with the software we
    need for day-to-day use. In our example we''re installing Python 3 and a bunch

