    ```\n\nThe powerful find allows you to locate files and directories that match\
    \ particular patterns, and perform operations quickly and efficiently\n\nIn an\
    \ earlier series, we encountered globs, such as `*` and `[a-z]`, that enable us\
    \ to find a list of file paths that match a pattern in one sentence. The program\
    \ find is like a much more complex and powerful version of search; one of the\
    \ core features of find, for example, searching recursively through directories\
    \ and all their subdirectories and so on, searching for files that do not match\
    \ a pattern.\n\nfind is even more powerful because it doesn't just use the list\
    \ of files, but enables us to do things with that list. For instance, it is possible\
