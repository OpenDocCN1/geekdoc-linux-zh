    # 编程


    ## Python 之父 Guido van Rossum 辞职


    未指名继任者，随着“终身仁慈独裁者”离开


    **在创建 Python 开发语言 30 年后，Guido van Rossum 在围绕签署 PEP 572 遇到一些困难后辞职了。**


    van Rossum 在 Python 邮件列表上发帖解释道：“现在既然 PEP 572 完成了，我不再需要为了一个 PEP 而表现得强硬，并发现有这么多人鄙视我的决定。”


    PEP 过程（Python 增强提案）是用于为 Python 语言添加功能和标准的过程。虽然其他语言允许通过投票进行演进，但 Python 是由 van Rossum
    亲自签署每一项提案开发的。


    在声明中，Rossum 还拒绝指名继任者（或者说，拒绝任何未来的领导体系），这让 Python 社区陷入了困境，即如何出一个能让他的未来参与变得不再必要的解决方案。“那么我们该怎么办？建立民主制度？无政府状态？联邦制？我们可能为这些事情编写流程（也许那些
    PEP 读起来像某种宪法）。但问题在于，我试着让你们（当前的社区）去解决。它仍然在这里，但我正试图让你们大家自己想出来。”


    这最有趣的是 van Rossum 放弃开发控制的态度，就好像 PEP 572 给了他一个做某些原本可能想过的事。他还将请求不再担任 BDFL（终身仁慈独裁者）。“毕竟一切最终将会发生——那是持久的事物，我正在享受即将到来的和平。”van
    Rossum 决定的即时反应是自然且理性的，有了正确的治理结构，Python 将会很好运行。


