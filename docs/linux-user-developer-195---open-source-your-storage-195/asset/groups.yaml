    # ## 03 Start editor


    The editor interface will look very familiar if you''ve worked with VBA macros
    before. To create a new module, right-click next to the ''Insert'' tab and Insert
    BASIC module... You can create a user form from the same menu, or use the Dialog
    for user inputs and boxes to trigger a WYSIWYG IDE.


    # ## 04 Write code


    Automatic syntax highlighting in the editor is sometimes inconsistent, but basic
    keywords are usually in blue, vars are red and subrout in green. You can comment
    out lines by prefixing them with '' ''. To learn more about Basic syntax at http://it.org/lod_vba.


    ![](img/06332f0e1d4d0e5b78061a5103897f51_40_2.png)


    # ## 05 Debug macros


    Like any other, the LibreOffice Basic has debugging tools for fixing problems.
    Press F9 to debug and removes breakpoints that pause execution so that you examine
    the variables. You can also step through code by repeating F8, and halt debugging
    at time with Shift+F5.


    # ## 06 Launch scripts


    Compiling your code is one way to run for syntax errors, or you can use F5 to
    run the code written until it stops, or the exception if you have set breakpoints.
    To import Microsoft Office''s VBA macros, press Esc from the dialogues and input
    your code creates.'
