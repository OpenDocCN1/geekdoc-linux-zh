    \ 进行家目录备份。这比复制所有文件要快得多；每个备份代表备份时文件系统的状态，但每个文件只存储。\n\n### 4 恢复选项\n- 你可以使用 `backup`\
    \ 命令进行恢复，但也可以挂载存档，这样可以在任何文件管理器中恢复文件，即使是经验较少的用户也可以：`$ backup /dir /mountpoint`。备份以目录的形式出现在存储库中。\n\
