    # Linux User & Developer\nWelcome to the UK and North America's No.1 Linux and\
    \ open source magazine. In this issue, we are covering how to open source data\
    \ and control it, but it's easy if you want to clear it up. We also take a look\
    \ at open source OSes that might be supported by Purism's Phone. In the tutorials\
    \ section, we see entry-level guides to using scripts in LibreOffice, running\
    \ code across a Pi cluster, and making a networked set of Pis. Of course, that's\
    \ our actually featured issue!!\n\n# SUBSCRIPTION OFFER\nSubscribe and receive\
    \ a Free Native User exclusive here!\n\nMORE DETAILS ON PAGE 30\nFuture is a publishing\
    \ house based in London\nwww.future.com\nChief executive: Elizabeth Zhang\nChief\
    \ financial officer: Paul Lin\ntel: +44 20729 5544\n\n# Contents\n## OpenSource\
    \ Features\n\n### 06 News\nAnother German state department dumps while the father\
    \ of Python calls it a day\n\n### 10 Essential Linux\nSearch the file system with\
    \ find (very kindly) makes us an offer we just can't refuse. Plus more of your\
    \ opinions and feedback\n\n### 32 Taskwarrior\nManage your to-do list over the\
    \ CLI\n\n### 36 LibreOffice\nAutomate tasks with simple scripts\n\n### 38 Interview\n\
    The collective tells us what inspired them to create PeerTube, a federated, open\
    \ source video-sharing platform for everyone\n\n### 42 Computer Security\nExfiltrate\
    \ data over ICMP and DNS\n\n### 46 Python\nAvoid setup\n\n### 48 Open Source Your\
    \ Storage\nA network attached storage device (NAS) is incredibly useful as a central\
    \ way to store data in your home or office. But why settle for an off-the-shelf\
    \ device, rather have complete control over your security and privacy, why not\
    \ try setting up a Linux-based NAS\n\n### 58 Pick Your Freedom-Loving OS\nThe\
    \ forthcoming phone from Purism is a simple vision of a privacy- and security-focused\
    \ mobile phone, but many operating system options available if you want to run\
    \ Linux on a mobile. We take a look at the development stage of the phone\n\n\
    ### 52 Programming: Go\nExpand your video-sharing server\n\n# Practical Pi\n\n\
    # # Reviews\n\n # Back page\n\n### 70 Smart Doll's House\nWith the help of a PI,\
    \ machine learning and a PlayStation Move controller, Make Surrey creates a very\
    \ high-tech child's house...\n\n### 81 Group Test: Firewall Distros\nPopular open\
    \ source distros PFire, OPSense, pfSense and Smooth are put to the test to see\
    \ which offers the best blend of security, flexibility and usability\n\n### 72\
    \ Systems: Guide to Raspberry Pi Networking\nSet up and manage a networked of\
    \ Raspberry Pis, enabling you to remotely assist, monitor and deploy each machine\
    \ with...\n\n### 96 Top open source projects\nWhat projects are ticking developers'\
    \ fancies this month?\n\n### 86 Chromebook x2\nHP' latest claim to be the world's\
    \ first Chromebook - but can it justify its cost?\n\n# LinuxUser & Developer\n\
    Issue 195 | August 2018\nfacebook.com/LinuxUser\nTwitter: @linuxusermag\n\n![](img/06332f0e1d4d0e5b78061a5103897f51_4_0.png)\n\
