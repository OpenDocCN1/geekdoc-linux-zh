    # OpenSource


    Your source of Linux news & views


    ## INTERVIEW FRAMASOFT


    ## Vive le vidéo libre


    PeerTube aims to take control of video-sharing. We speak to Framasoft, the collective
    behind the successful crowdfunding campaign.


    The internet was originally decentralised, through a handful of major interest
    companies. The services that are controlled, the data that is used - particularly
    in recent elections - are all serious concepts for many users.


    Decentralisation is on the rise. Federated services have always been a popular
    concept in open source. The first was possibly identified, the open source microblogging
    platform, in 2008 - but in recent years we''ve seen much higher profile and usage
    like Twitter, Mastodon, as the public has become more aware.


    **Framasoft**

    A small non-profit which promotes free software and its culture through practical
    projects.


    Another success is PeerTube. Its crowdfunding target was 26,800 euros, a decentralised
    video-sharing platform built by Framasoft, a non-profit with dozens of members.
    As with Mastodon, users can set up their own PeerTube instance and allow people
    to upload and share instances. Decentralised through the protocol ActivityPub
    (see What''s ActivityPub?), the use of this PeerTube is an interesting development
    that goes beyond the microblogging and combining with WebTorrent - a browser,
    peer-to-peer file transfer implementation of BitTorrent - sharing the video-streaming
    load.


    Framasoft is a collective, which is largely financed through individual donations,
    and defines itself ''a bunch of friends who want to change the world, one byte
    at a time''. Since 2004, Framasoft has been producing free software and a blog,
    an extensive array of practical and useful projects. This includes creating a
    directory of free software (https://frameto.org), and projects like Framakey (https://framakey.org),
    which have pre-installed free software you can use on Windows, Mac, Linux, and
    blogging, and it has its own publishing house.


    With Framasoft''s collective spirit, we conducted the interview with PeerTube,
    a free collaborative editing platform (https://peertube.org/en/) with many contributing
    members, including instances. Their answers have been lightly edited for flow
    and clarity.


    **Tell us about PeerTube - why are we using it?**


    PeerTube (https://peertube.org) is a free video platform. it''s free and lite
    software. Using your own instance of PeerTube on a server and begin broadcasting
    videos at any time, or you can join an existing instance. We don''t want to control
    the platform; we are creating a tool for people to own their own!


    Using PeerTube allows you to have your own video, with your rules, at a low cost.
    A PeerTube instance allows you to choose which instances you want to follow, so
    you can point to videos from within your instance. This federation allows each
    PeerTube instance to share and edit video. When a user uses one of your videos,
    it is streamed directly from the PeerTube instance to their browser.


    When users simultaneously watch the same video, the video is also shared between
    them, seamlessly, by web browsers, using a piece of web technology like WebTorrent.
    That means that if one of your videos gets popular, numerous users watching it
    doesn''t cost your server because, and each one who uses it to download it, peer-to-peer
    sharing.


    ![](img/06332f0e1d4d0e5b78061a5103897f51_11_0.png)


    Above FamaTube is Framasoft''s PeerTube instance and one more than a hundred,
    according to the collective. PeerTube is hosting more than 12,000 videos.


    **How Peertube uploads a video**


    A key aspect of the Peertube platform is the ability for users to host their own
    video hosting server, or least are called ''instances'', and then sync their instance
    with others that they find within the federation.


    PeerTube instances use a REST API (framework), a WebTorrent Tracker, and for seeding
    a video through the HTTP protocol. When a video is uploaded by a user, the REST
    API creates a torrent file and adds it to the database. When a user uploads the
    video, the tracker indicates all others who are watching the video, and the HTTP
    URL for the Web, which enables BitTorrent to download the video from any HTTP
    server.


    ![](img/06332f0e1d4d0e5b78061a5103897f51_12_0.png)


    **You hit your first and second targets with the current crowdfunding. What will
    enable you to use Peertube?**


    The first target will be localisation of the interface and support multiple languages.
    This will enable us to include subtitles in videos and facilitate accessibility
    for diverse audiences.


    We''ll also develop feeds for users, allowing them to import videos from external
    sources through the RSS protocol. You can subscribe to PeerTube (YouTube, Vimeo,
    Dailymotion) and torrent files from other instances. This means we can search
    and add advanced search features, with better software stability (bugs and scalability).


    The next feature from the second target will allow video redo (redundancy) that
    shares between instances or if the original instance is deleted for all users
    and channels through the federation - so that users can subscribe to whatever
    they want regardless of their federation settings.


    **What made you decide to use Peertube (https://activity.org/)?**


    We (first) used a private protocol, thinking Peertube would not fit our needs.
    But after a few months, we saw what Gargon (Eugen Rogchenko, developer of Mastodon
    (https://joinmastodon.org/)) had started a video platform as a personal project
    using ActivityPub. After exchanging some emails, he gave us hints on how to use
    ActivityPub. We were not comfortable with it, but we started to use it, because
    we wanted to create a platform that would be free for everyone.


    With Framasoft''s collective spirit, we conducted the interview with PeerTube,
    a free collaborative editing platform (https://peertube.org/en/) with many contributing
    members, including instances. Their answers have been lightly edited for flow
    and clarity.

    '
