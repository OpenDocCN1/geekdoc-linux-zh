    # Tutorial


    # Essential Linux: Find


    # Finding help


    Another reason for using **find** is to create a list of files to copy to another
    location directories with restricted permissions (for example, no write permissions).
    In such a case, we want to copy the contents of the directory, and then copy the
    directory itself. Otherwise, we won''t be able to copy its contents, because of
    the restricted permissions.


    One very useful alternate command is **delete** which deletes the file in question.
    For instance, we want to ''clean'' a Java project by removing all compiled Java
    files:


    Lastly, we often use **delete** when we want to delete files. But, as we shall
    see, there is an easier way of doing it.


    Note that if you use the **delete** command, find will automatically apply the
    -delete switch to remove files before their parent directories.


    ```

    $ find -name "*.class" -delete

    ```


    # Match only directories or files


    # Chain commands together


    As we saw in earlier example that find can match directories as well as files.
    If we wanted to delete only files, we could have used **-type f** to filter the
    results.


    We can carry out one command at once by putting the arguments after the other.
    For example, if we wanted to print the path of .class files that we were deleting
    in the example above, we could run the:


    ```

    $ find -type f -regextype egrep -regex ''.*\.class$'' -print

    ```


    ```

    $ find -type f -name "*.class" -print

    ```


    We can use -type to match directories because directories don''t have an abc extension,
    so cannot match them using **name** or **regex**. For example, the following command,
    search through all the subdirectories of the working directory and delete all
    those that match.


    We can do the same with search as well. In fact, we''ve already demonstrated in
