    >在海滩边</span></span>\n```\n\n- 每日提示\n\n上述注入攻击是常见的（参见第 57 页方框）且危险的破坏服务器安全的手段。\n\n\
    注入攻击通过 Go 的 HTML 模板库得到了修复，该库处理了特殊字符。\n\n我们将结果变量存储在一个表单中，以便可以使用。当被调用时，Go 将将数据从\
    \ HTTP 请求传输到程序的内存中。该值将一直存储，直到达到 RAM 最大字节数，然后它会将数据存储为临时文件。\n\n多个返回值使得这特别有用。我们应该处理以下情况：\n\
    \n```go\ntitle := request.FormFile(\"title\")\n```\n\n```go\nif err != nil {\n\
    \    return err\n}\n```\n\n如果有错误，我们会立即处理它：\n\n我们需要为视频生成一个唯一的 ID。我们利用 `os` 包中的\
    \ `TempDir` 函数来实现这一点。该函数用于创建一个会被删除的临时目录。`TempDir` 始终确保目录名称与现有目录冲突。\n\n```go\n\
    video, err := request.FormFile(\"file\")\ndefer video.Close()\n```\n\n```go\n\
    videodir, err := os.TempDir(\"video\", \"\")\ndefer os.RemoveAll(videodir)\n```\n\
    \n我们现在可以从视频请求的调用者处下载数据。首先，我们将视频上传到文件：\n\n`TempDir` 在文件系统上创建一个新目录，并返回一个指向该目录路径的字符串，第二个参数是设置目录用户\
    \ ID 的可选参数。如果有错误，我们必须处理它。\n\n`Form` 的参数是 HTML 表单中字段的。它返回文件和一个错误值（带有文件头信息），\n\n\
