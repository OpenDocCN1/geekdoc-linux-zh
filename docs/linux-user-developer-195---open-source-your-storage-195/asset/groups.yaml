    ![](img/06332f0e1d4d0e5b78061a5103897f51_20_0.png)


    # 将操作系统与数据分离是良好的做法，因此请为操作系统使用独立的磁盘


    LVM 允许你将多个磁盘管理成一个单一设备，在其之上可以运行如 ext4 等标准文件系统。


    例如，假设你有两个等大小的磁盘 `/dev/sdb` 和 `/dev/sdc`，可以这样在 ZFS 中创建一个 RAID1 存储池：


    ```bash

    $ zpool create mypool/myrefs /dev/sdb /dev/sdc

    ```


    如果可能，请使用 `/dev/disk-by-id` 中的名称而不是绝对节点；这可以避免在您使用的任何文件系统中添加或删除磁盘时可能出现的问题。然后您可以使用以下
    ZFS 命令在池中创建文件系统或 ZFS 数据集：


    ```bash

    $ zfs create -o mountpoint=/storage/videos/mypool/myrefs

    $ zfs set mountpoint=/storage/videos/mypool/myrefs

    ```


    ZFS 在启动时自动将文件系统挂载到 `/pool/dataset`。您可以通过创建时或之后使用以下命令设置挂载属性来更改：


    如果您想控制它，将需要将 `mountpoint` 设置为 `/etc/fstab` 并将其添加到 fstab，文件名为 `/pool/dataset`，文件类型为
    `zfs`。


    ![](img/06332f0e1d4d0e5b78061a5103897f51_20_1.png)


    # 产品 预 NAS 设备


    以下是几种坚固、可靠且经济的系统，它们可以作为 NAS 的良好基础。


    # HP MICROSERVER


    ![](img/06332f0e1d4d0e5b78061a5103897f51_20_2.png)


    - HP Microserver

    www.hp.com

    这个紧凑的盒子有四个硬盘位和一个 DVD 接口，你可以用它连接一个 SSD 作为操作系统盘。在大多数时候它们价格合理，但可以等待频繁的返现优惠以获得真正的划算。


    ![](img/06332f0e1d4d0e5b78061a5103897f51_20_3.png)


    # ZFS ON LINUX


    - Dell T330

    www.dell.com

    另一台廉价的小服务器，这次是更传统的塔式格式。凭借充足的空间和大量的内存，它可以成为一个很好的 NAS。


    # SYNOLOGY DS218+


    - Synology DS218+

    www.synology.com

    典型的市售 NAS。这些设备易于设置，但您将失去使用通用设备作为基础的可靠性。适用于“即插即用且无需管心”的场景。


    > 专家提示 避免坏批次

    > 值得从不同的制造商处采购硬盘。如果两块硬盘都来自同一个坏批次（这确实会发生），双盘 RAID 并没有安全性可言。


    > 快速指南 ZFS 许可问题

    > 关于这个主题存在很多困惑。问题在于 Oracle 为 ZFS 提供了服务，但它们使用了 CDDL 许可。ZFS 与 Linux 内核不兼容。令人遗憾的是，在不产生任何后果的情况下分发内核是非法的。ZFS
    看起来是兼容的，但没有人曾在庭上冒过这种风险。此外，你可以安装设置文件系统的功能。


    # 开源存储 共享文件和媒体


    现在是时候查看共享文件的各种选项了，包括通用和特定类型的媒体。在 NAS 上提供文件和存储主要有两种方法。通过 NAS，你可以使用托管在客户端上的网络文件系统，可以使用特殊的服务器处理特定类型的文件。


    第一种方法涵盖两种主要方式：Samba 和 NFS。Samba 是来自 Unix 世界的网络系统，它速度快且完全支持文件权限和元数据，但限于 Linux 客户端。因此，当你想让用户访问自己的空间时，NFS
    是网络服务器的好选择。


    第二种方法使用易于配置的 NFS 网络系统。CIFS 是 Windows 的默认网络系统也适用于 Android 和 iOS。这些文件系统都使用服务器上的文本文件进行配置。对于
    NFS，这在 `/etc/exports` 文件中，条目如下：


    ```

    /etc/exports 192.168.1.0/24 /path (no_root_squash,subtree_check,sync)

    ```


    ![](img/06332f0e1d4d0e5b78061a5103897f51_21_0.png)


    如果你导出了该路径，它表示允许访问的范围，括号内包含挂载选项列表。默认不允许 root 用户从客户端连接以获得访问权限。如果你想要类似云的界面，Nextcloud
    绝不会出错：`no_root_squash` 选项改变了这一点。对于 NFS，你的系统必须使用 `fsid` 设置一个唯一的 UID。其他选项在 exports
    页面中。客户端只需将 `server.address:path` 挂载到它们选择的点即可。


    ![](img/06332f0e1d4d0e5b78061a5103897f51_21_1.png)


    # 安装并设置 Gerbera 服务器


    大多数发行版在仓库中都有 Gerbera，可以从包管理器中安装。注意，最新的 1.2 版本非常新，因此你可能需要从源码安装以获取某些功能。参见 http://docs.gerbera.io/latest/compile.html。


    # 安装 Gerbera


    使用以下命令创建默认配置并启动服务器：


    ```bash

    $ mkdir -p /etc/gerbera

    $ gerbera --config /etc/gerbera/config.xml

    ```


    # 打开界面


    在浏览器中打开 `http://(YOURNAS)` 查看 Gerbera 的界面，你可以通过选择要共享的目录来添加内容。你可以直接添加目录，也可以添加一个自动化目录，这样就会自动添加新内容。


    Samba 的配置在服务器上是复杂的。……（注：原文后续部分为乱码/重复，已按要求截断）


