    # 回顾全新的免费开源软件


    # 网络聊天


    ## BeeBEP 5.0.0

    与网络上的同伴聊天的局域网即时通讯软件


    Linux 桌面拥有多个不同的客户端，许多流行的 Linux 发行版在默认安装中都包含一个。BeeBEP 提供了现代客户端的所有功能，但它的设计是直接连接你网络上的同伴。除了聊天消息，你还可以使用该工具与家庭网络上的其他用户共享文件。


    这种点对点点通讯软件可以自动检测网络上的 BeeBEP 用户，使用 AES 算法加密消息，并且与其他任何客户端一样，你可以使用该工具发起群聊，或将对话限制在单个用户。界面非常直观，该工具具有拖放等实用功能，你无需通过菜单即可与同伴自由共享文件。


    BeeBEP 将设置和聊天消息分别存储在 `bebeep.ini` 和 `beebeep.dat` 文件中，在更新工具版本时这些文件不会受影响。如果你有一个兼容性较差的导入器，BeeBEP
    可以轻松导入你的消息。对于那些仍在犹豫不决的人，该工具让你可以将截图传输给同伴，甚至支持桌面共享！


    ![](img/06332f0e1d4d0e5b78061a5103897f51_89_0.png)


    虽然你在网站上找不到用户手册，但界面非常直观


    - * **优点**

    无需安装。只需下载 tar 包，解压文件并启动应用程序即可。


    - * **缺点**

    这个单开发人员的项目维护良好，但仍然是一个业余项目。


    - * **适用场景...**

    与网络上的同伴进行免费即时聊天。

    http://bebeep.sourceforge.net


    # 文本编辑器


    ## TEA 45.0.2

    一个拥有数百种功能的编辑器


    仅仅被标称为文本编辑器，它就支持 Linux 发行版中类似于 Notepad 和 Leappad 的。你认为文本编辑器应该是简单且大胆的，不带有任何用于编程或……的复杂功能。


    要扩展 TEA，你可以用 JavaScript 编写插件来添加额外功能，如语法高亮、行号等——如果你需要更多功能，你只需要切换到文字处理器即可。


    然而，TEA 是一个矛盾的编辑器，用户界面截然不同。该工具拥有许多意料之外的功能，如内置图像和注释功能、语法高亮、命令行风格的文件浏览器等。


    尽管被标称为文本编辑器，但它支持包括 DOCX 和 ODD 在内的许多文件格式。该项目的主要语言是俄语，但讨论新闻的 Newsk 章节和简短介绍（Short
    About）部分也提供了英语。


    为了适应其庞大的功能集，TEA 使用标签页界面并默认使用编辑器标签。标签将文件存储为选项，日期和方式在侧垂直列表。要进行任何其他操作，你应该花时间阅读手册以了解其整个功能集——或者至少了解它提供的内容。


    - * **优点**

    易于安装，具有替换打开文件中所有文本等令人印象深刻的功能。


    - * **缺点**

    缺少字数统计功能以及如亚洲输入等奇特功能。


    - * **适用场景...**

    各种需求，无论是编程还是创建纯文本文件。

    https://github.com/pasmint/tea-qt


    # 笔记工具


    ## Cherrytree 0.38.5

    简单用且功能丰富的笔记软件


    ![](img/06332f0e1d4d0e5b78061a5103897f51_90_0.png)


    尽管版本号很高，该应用程序已经存在多年且非常稳定。该项目自称为分级笔记记录工具。你可能可以在你的发行版软件中找到最新版本，但安装非常简单，该项目提供了 RPM
    和 DEB 包的源码 tar 包，你可以使用它们在任何 Linux 发行版中安装该工具。


    该跨平台工具适用于 Windows 和 Linux，并将所有数据存储在单个 XML 或 SQLite 文件。你可以从 KeepNote、Joplin、Tomboy
    等替代方案导入数据。


    - * **优点**

    界面足够直观，项目还提供了详尽的用户手册。


    - * **缺点**

    为了适应庞大的功能集，功能非常众多。


    Cherrytree 支持三种类型的项目：文件夹、子文件夹和笔记。每个项目都表示为一个节点，你还可以为每个节点添加标签，以便查找你正在寻找的笔记或文件夹。你还可以向笔记中添加内容、标记重要事项并将图像导入到节点中，使所有数据都有意义。


    - * **适用场景...**

    以逻辑方式组织你的笔记，并将其导入和导出到其他格式。www.glusen.com/cherrytree


    此外，该应用提供了许多自定义选项，更改侧边栏节点的外。


    # 视频编辑器


    ## Shotcut 18.07.02

    支持许多格式的轻量级视频编辑器


    ![](img/06332f0e1d4d0e5b78061a5103897f51_90_1.png)


    适用于 Linux、Mac 和 Windows，这个功能强大的编辑器最新版本具有许多特性。与其他一些简单工具不同，该项目通过对其功能的支持证明了自己，你无需复杂操作即可使用它。你可以使用时间轴进行多轨道视频的非线性视频编辑。通过
    FFmpeg，该工具支持多种……


    该跨平台工具适用于 Windows 和 Linux，并将所有数据存储在单个 XML 或 SQLite 文件。你可以从 KeepNote、Joplin、Tomboy
    等替代方案导入数据。


    - * **优点**

    界面足够直观，项目还提供了详尽的用户手册。


    - * **缺点**

    为了适应庞大的功能集，功能非常众多。


    （注：原文中后续部分存在大量文本重复，翻译已按要求对重复逻辑处理）

