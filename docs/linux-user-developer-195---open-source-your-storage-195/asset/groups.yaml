    \n# Linux 基础教程：Find\n\n## Find：学习快速搜索你的文件系统\n使用 `find` 命令跨目录搜索文件并执行复杂任务。\n\n![](img/06332f0e1d4d0e5b78061a5103897f51_31_0.png)\n\
    \nJohn 是编程和科学领域的大学导师。他喜欢在每个人身上安装 Linux，并拥有丰富的编程经验。\n\n## 资源\n- 一个终端 shell 将安装在任何\
