    实用教程

    树莓派


    ![](img/06332f0e1d4d0e5b78061a5103897f51_68.png)


    > 70 “核心组件是势识别”


    # 内容


    + 70 一个由“手势”控制的智能家居

    + 72 学习如何设置和管理 Pi 网络

    + 76 使用你的 Pi 构建自动化机器


    # Pi 项目


    # 智能家居


    ![](img/06332f0e1d4d0e5b78061a5103897f51_69.png)


    # 智能家居


    通过机器学习魔法、传感器和树莓派，赋予了玩具生命。


    ![](img/06332f0e1d4d0e5b78061a5103897f51_69.png)


    # Maks


    Maks 是华盛顿大学的一名研究生。他对 AI 和创意编程感兴趣。


    Maks 的项目是基于简单的想法，让用户控制从灯光到传感器的树莓派。我们使用了拖放界面涉及数据处理和机器学习。实际上，这个智能家居是一个原型，团队希望改进并支持更多。


    # 喜欢它吗？


    你使用了任何技术让项目变得比想象中更容易吗？


    你可以在 Twitter 上关注 Maks，或者查看 [dollhouse](https://github.com/dollhouse)。智能家居将是一个以易于接触的方式展示创新的优秀工具。


    # 这个项目的灵感来源？


    作为华盛顿大学冬季学期课程的一部分，我们被要求使用传感器和机器学习。我非常喜欢机器人，所以智能家居是一个很棒的主意。


    # 它是如何工作的？


    MYHOUSE 是一个带有灯光和门的智能家居，可以通过响应手势的特殊控制器进行控制。树莓派从运动传感器学习信息，并使用学习算法判断用户的手势是否是系统已存储的内容。


    现在你已经完成了项目，你想更改任何地方或添加更多功能？


    # 延伸阅读


    Maks 在 [maxorky.com](https://maxorky.com) 记录了一切内容，以及对 MYHOUSE 项目的解释，在那里你可以了解他的原型和酷时钟。


    根据手势的值，灯光可以开启或关闭。你可以看到灯光、风扇和声音的视频。代码是用 Python 编写的；它使用多层感知器（MLP）神经网络，利用输入数据执行机器学习框架（函数）。


    > 核心组件是由势识别启用的


    这一切很有趣！我鼓励大家查看我们的工作并使用这个想法来实现家居！


    你有任何人想测试你的项目吗？如果没有立即运行，请不要沮丧。欢迎在 GitHub 仓库提问。


    代码编写简单。我们收集加速度计/陀螺仪数据并传递给 MLP。当识别出手势时，家居手势对应预训练特征。如果匹配，将遵循决策树来激活房子内的设备：电视、LED
    或扬声器。你可以在我们的 GitHub 站点查看所有代码。


    你想做什么样的项目？下一步是什么？


    我正在研究 IoT 和 CNC 机器，以探索交互的新方式。在夏天剩余的时间，我将改进 Processing，它是 Summer of Code 的：[processing.org](https://processing.org)。


    # 组件列表


    - 树莓派 3 或 Pi Zero

    - 两个舵机

    - 连续旋转舵机

    - 7 英屏

    - PlayStation Move 控制器

    - RGB 灯带 (WS281B)

    - 舵机扩展


    # 现成品


    为了让团队专注于项目的软件方面，Maks 说他们使用了现成组件。例如，为了打开卧室的风扇，Sergey 使用了连续旋转舵机。


    ![](img/06332f0e1d4d0e5b78061a5103897f51_70_0.png)


    # Arduino 演示


    Maks 说他们最初建立了房屋的一部分来展示某些功能特性，如风扇、灯光和百叶窗，并让其在 Arduino 上运行以获得如何适配的想法。


    ![](img/06332f0e1d4d0e5b78061a5103897f51_70_1.png)


    # 准备工作


    房子大量的原型制作。Sergey 说他们从纸板原型开始确定比例。对结果满意后，使用 3D 建模软件从设计中激光切割部件，最后使用胶胶板并通过卡接连接连接部件。


    ![](img/06332f0e1d4d0e5b78061a5103897f51_70_2.png)


    # 手势训练器


    收集手势的训练数据有助于做出决策。例如，Maks 说每个手势的持续时间不需要超过两秒。他们还能确定最佳手势样本范围在 20 到 25 个：“网络对于训练过的用户来说效果非常好，准确率超过
    95%。”


    ![](img/06332f0e1d4d0e5b78061a5103897f51_70_3.png)


    ![](img/06332f0e1d4d0e5b78061a5103897f51_70_4.png)


    # 势识别


    首先，让我们确保我们的客户端是安全的。


    # 软件包软件包

