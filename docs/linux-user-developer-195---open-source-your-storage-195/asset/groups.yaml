    ## Review


    ## Firewall Distributions


    ### IPFire


    A very capable manager that easily take on new functions


    ### OPNsense


    A fork of another active firewall distribution with a slicker interface


    ![](img/06332f0e1d4d0e5b78061a5103897f51_81_0.png)


    - You can use IPFire''s to limit the number of connections established by a certain
    rule to protect against Dos attacks


    ![](img/06332f0e1d4d0e5b78061a5103897f51_81_1.png)


    - OPNsense supports the industry standard sense protocol that communicates with
    a third-party engine to protect against malware


    ## Ease of deployment


    Installation involves setting the file system and allowing the installer to take
    over the computer''s hard disk. The system then returns to a wizard where you
    assign the attached NIC one of four colour-coded zones and then configure them.
    You will be asked to set passwords before you proceed to the login shell.


    ## Ease of deployment


    You can log straight to the installer, which is straightforward to do. After installation,
    OPNsense boots to the command-line dashboard where you configure network interfaces
    and assign roles and IP addresses. Once you''ve done that, the distribution returns
    the interfaces and addresses of the browser-based login.


    ## Extensibility and maintenance


    IPFire comes with pfSense, which is an extensive package management utility that
    makes it easy to finish out the basic installation. There are several useful add-ons
    such as the ClAV virus scanner, Bakula backup, and AssistX. And you can use the
    package manager to check and install updates to the whole system package.


    ## Extensibility and maintenance


    You can use the base OPNsense by adding one or more of the dozens of supported
    plugins. These include the Let''s Encrypt client server, FreeRadius authentication
    and services such as Tor and UPnP. The section also allows you to configure and
    install updates for packages.


    ## Other functions


    IPFire can be used as a URL filter, a naming server, an update accelerator and
    more. It also uses a proxy server and allows you to create VPNs with IPSec and
    OpenVPN. It is to prevent firewalling duties you can do using a combination of
    Squid and an add-on guard.


    ## Other functions


    The besides stands for what you use OpenSSL, OPNsense also has functions that
    you use LibreSense. OPNsense offers several other functions in action. You can
    use it as a forwarding proxy, a traffic-shader, a load-balancer, for detecting
    and preventing intrusions and for VPN connectivity via via, OpenVPN and PPPT.


    ## Management interface


    The administration interface has a simple and easy-to-navigate layout with different
    aspects of the firewall served using tabs at the top of the page. It''s clearly
    aligned and marked, which simplifies the process of configuration.


    ## Management interface


    OPNsense has one of the slickest in this group test. Certain sections, such as
    the settings pages, include a search box which appends relevant information to
    all fields. Use the search to jump to a particular setting without navigating
    menus.


    ## Overall


    IPFire is easy to install and the web interface makes it simple to set up and
    configure. The package manager is on the cake and expands the usefulness of the
    distribution.


    ## Overall


    OPNsense is a comprehensive distribution that has a lot more than a simple firewall.
    All its supported functions are exposed via an attractive interface that can inund
    first-time users.


    ## pfSense


    The FreeBSD-based distro that does a lot more than firewalling


    ### SmoothWall Express


    A mature and adept firewall-only product that offers no add-ons


    ![](img/06332f0e1d4d0e5b78061a5103897f51_82_0.png)


    ![](img/06332f0e1d4d0e5b78061a5103897f51_82_1.png)


    - Use The Traffic Shaping in pfSense to create a default set of rules that you
    can fine-tune for your own network


    - You can plug in a configured drive and SmoothWall Express will automatically
    backup the running firewall into it


    ## Ease of deployment


    This is the original project from OPNSense. The two projects are entirely different
    now, but installation and initial configuration processes are largely identical.
    Post installation, you''ll have to manage the network interfaces and configure
    them by using your web-based interface.


    ## Ease of deployment


    Installing SmoothWall is fairly straightforward. Once you''ve selected a file
    system and it takes over the computer''s disk, it launches a browser where you
    can configure things such as the hostname. You are also asked to choose one of
    the three features for policing traffic. And, with IPfire, your NICs analytics
    to one of four-coloured choices.


    ## Extensibility and maintenance


    pfSense includes a package manager which can be used to install and deploy dozens
    of useful packages Asterisk, Datasguard, Squid and many others. The distribution
    will check for updates that can be installed with a single click, plus it includes
    a host of diagnostic tools and utilities to troubleshoot the installation.


    ## Extensibility and maintenance


    Though it looks a bit old-school, it has no package management functionality.
    In fact not the UI offers an option to add or enable more modules, as all supported
    features are shipped in the distribution. You can check for updates and install
    all with a single click, and you are also asked to keep a backup of the configuration.


    ## Other functions


    pfSense has immense list of features beyond its basic firewall. You can use it
    as a server load-balancer, provide VPN functionality via IPsec and OpenVPN, a
    DNS client to register your IP address with a host of services, and many others.
    You can just use it for more: manage as an intranet server and deploy a captive
    portal.


    ## Other functions


    Beyond its standard firewall features, you can use SmoothWall as a web proxy,
    a POX proxy and an IM proxy that reveals real-time logs. The distribution displays
    detailed traffic stats for your interface and for each individual IP addresses,
    and also asks you to manage and update your dynamic date


    ## Management interface


    The difference between pfSense and OPNsense is that the interface, pfSense has
    a different layout with the options rolled into drop-down menus. There''s no search
    to easily find settings, but you will get help by showing related settings.


    ## Management interface


    The firewall''s web-based administration interface functions between two sets.
    All firewall-related features are housed under the Network tab. It offers basic
    integration, for example, you can create block rules while blocking the logic


    ## Overall


    A very mature product that does, like its fork, offers more than a simple firewall
    out of the box. Again, its interface might confuse new users but its ''related
    settings'' option is big


    ## In brief: compare and contrast


    | Feature | IPFire | OPNsense | pfSense | SmoothWall Express |

    | :--- | :--- | :--- | :--- | :--- |

    | **Ease of deployment** | Setup involves file system wizard and color-coded zones.
    | Log straight to installer, CLI dashboard for config. | Similar to OPNsense,
    use web-based interface. | Straightforward, browser-based config. |

    | **Extensibility** | pfSense package manager, add-ons (ClAV, etc.). | Dozens
    of plugins (Let''s Encrypt, Tor, etc.). | Package manager (Asterisk, Squid, etc.).
    | No package management; all features included. |

    | **Other functions** | URL filter, naming server, proxy, VPN. | Forwarding proxy,
    traffic-shader, load-balancer, VPN. | Load-balancer, VPN, DNS client, captive
    portal. | Web/POX/IM proxy, traffic stats. |

    | **Management interface** | Simple, easy-to-navigate, tabbed layout. | Slickest
    interface, includes search box. | Drop-down menus, no search, related settings.
    | Network tab for all firewall features. |

    | **Overall** | Easy to install, package manager is useful. | Comprehensive, attractive
    interface. | Mature product, offers more than simple firewall. | Mature, but lacks
    add-ons. |


    ## AND THE WINNER IS ...


    ## IPFire


    When it comes to rolling out a service such as a firewall, an admin''s preference
    will override the technical dexterity. This is why our objective testing, the
    results and our recommendation are influenced by our preferences.


    Given their shared lineage, the FreeBSD-based IPFire and OPNsense are very similar.
    Each shows a similar interface, line-command support, and important tasks as assigning
    roles for the NICs is also vital. The web-based administration of OPNsense and
    pfSense are more useful in the hands of an experienced administrator than the
    interface navigating might take a bit more familiarity with the craft than SmoothWall
    Express.


    SmoothWall Express only loses because of its inability to be a firewall, which
    may just be what you''re Looking for the other hand, IPFire manages to work the
    tight between form and function. It has an adaptable interface, is not short of
    functions, and can be expanded with add-ons and has more documentation. IPFire
    is usable as the other for these most common firewall-related activities, which
    makes it an ideal choice for a variety of tools. However, you might find Smoothwall
    Express more suitable for your network, or care about some of the extra features
    of pfSense and OPNsense. They''re all virtualisation-friendly so we would advise
    you to set them up a VM and explore before you select one.

