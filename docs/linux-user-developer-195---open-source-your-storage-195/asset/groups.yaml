    # 观点


    ## 如何保护容器以装载虚拟机


    可以说，你一直被困在由于缺乏它的某些重型数据中心中，至少你知道容器和编排器现在是主菜。


    容器的可移植性在容器全球爆发后不久实现了相同的发布。无需担心系统兼容性问题，它是前所未有的。


    考虑到容器在更清晰的访问性和卓越功能方面的惊人普及。在很短的一段时间，几年后我们就在这里。曾有一种方法——然而，这仍然是一个问题，而且大家都认为容器是很棒的，但并没有真正花精力去检查它们。这绝非小事。


    以下来自 CoreOS 的一个简单（简略）命令行示例：Docker 镜像不支持签名验证，且容器有自己的安全选项。


    ```

    $ docker run --debug --insecure-options=image--name=coreos.com/r/stage-1.29.0

    ```


    ![](img/06332f0e1d4d0e5b78061a51_8_0.png)


    你可以所示，在这种情况下，Docker 兼容容器是免费的。但除此之外，CoreOS 解释说：“Docker 镜像不支持签名验证，且容器有自己的安全选项-insecure-options=image。”如果没有别的，这应该鼓励你直接使用镜像。


    Chris Binnie

    书：Linux

    服务器安全：主机与防御

    为了清晰起见，提到的阶段被描述为一种可靠的二进制文件，它可以促进环境，在这种情况下我们正在使用 KVM。


    向容器投放生产工作负载是满载的（双关语），这并不适合心软的人。


    要设置网络、挂载等。这里是你感兴趣的地方：http://bit.ly/lod-kvm。


    使用 KVM 提供的加固，可以在受保护的主机“环境”上运行你的容器。这种加固的二进制文件连接了某种内核，并保护了虚拟机本身——在这种情况下 KVM（https://github.com/ikvm/kvm）。


    我在 DevSecOps 工作以及当我查看 Docker 安全模型时——之前在 2009 年使用 OpenShift 进行生产——了解了 CoreOS 运行时（https://coreos.com/runtime）。


    从安全角度来看，在主机上运行容器的主要头疼问题是它们对系统的要求：它们会影响主机。这是另一个容器，但它在这个领域通过许多创新生存了下来。例如，Google
    Chrome 的标签页沙盒如何防止一个标签页（或容器）在同一个应用程序中破坏。


    这还是一个简单的问题。


    如果你想帮助防止“容器逃逸”和其他问题，这是 CoreOS 提供的。它建议在虚拟机（VM）中运行你的容器，由于更成熟的基于硬件的安全机制，它们无法在相同程度上破坏你的主机。在损坏之前看一眼——如果你感兴趣——这是非常聪明的东西：http://bit.ly/lod-kvm。


    强大的容器可能在该领域拥有很出色的成绩，但这个故事也适用于其他人，并在我以后有机会时进一步解释。


    该领域还有其他进展值得关注。此外，发现一种迷人的方法：观察这个（容器化）空间，事情变化非常快。


