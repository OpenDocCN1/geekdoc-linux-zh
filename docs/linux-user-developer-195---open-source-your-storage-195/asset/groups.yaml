    HP''s latest Chromebook is the first detachable Chrome OS machine, with the ability
    to run full Linux.


    Typically aimed at the classroom or the ultra-low end of the market, the Chromebook
    continues its march to the mainstream with the launch of the first detachable
    Chromebook. HP is, of course no newcomer to the market, with various Chromebooks
    and devices even with the x2 branded products available comfortably.


    From the white ceramic feel on the lid and the Gorilla Glass screen and responsive
    keyboard, to the benefit of the beautiful Bang & Olufsen speakers at the side
    of the keyboard, the machine is well-built and feels well worth its cost. The
    machine is a weighing it, but the tablet alone weighs only 735g, making it an
    excellent alternative to Android. Chrome OS is itself then developed by Google,
    building upon the lines of Chrome OS to try and once for all the proposition that
    a Chrome OS is ''just'' an expensive web browser. Google has now rolled out the
    Play Store again, enabling Chromebook OS devices to run an array of Android apps
    and the utility of Chrome OS is itself just another leap with the launch of the
    ''Croini'' project.


    A quick glance at the spec suggests that the Chromebook is suitable for Chrome
    OS use, although 4GB RAM and 32GB storage is typical and is certainly above what
    you''d expect to pay for a laptop running Google''s OS. When you take the laptop
    off the shelf, the price starts to make sense - this is a worthy premium piece
    of hardware.


    > Above The Chromebook x2''s tablet section is attached using strong magnets,
    and a cloth attachment is included for the style


    ### The Croini (Linux container) has all the polish you need for Android apps
    and is easy to use


    > Installing apps becomes as simple as using apt, and usual Debian repos are available
    right out of the box


    If you''ve used Chrome OS before, you may be familiar with a project named ''Crout''.
    The project provided the ability to boot into a full Linux install on an OS device
    to provide a degree of Linux functionality without replacing Chrome OS. It required
    the machine to be switched over and Crou to be installed using a script launched
    from a terminal window. It was quick to set up, but it was not suitable for most
    tasks. Croini on non Chrome OS offers all the courtesy of an easy Debian install.
    But do you know how it works?


    As of today, installing Croini requires a toggle in settings to be enabled, which
    then adds a terminal to your standard app list. Clicking this automatically downloads
    and installs a container with a familiar Debian distro. Installing apps is as
    simple as using apt and the Debian repos are available right out of the box. We
    found that installing on a Chromebook can be painful, so of course the first time
    we were installing GIMP an icon appeared in the main app list which is particularly
    useful as we were ready to go – this Chromebook X2 includes a very stable system.


    With GIMP-well, we installed something a bit more demanding: the Rider IDE from
    JetBrains. While this too installed and worked just fine after downloading the
    package, loading larger sizes still struggled on the 4GB RAM with no swap, highlighting
    one of the potential issues with Croini. Chrome OS machines have typically been
    limited by low memory and storage, but something that will change as the OS capabilities
    and application availability change.


    It is moving from Beta to Stable, and we expect to see several improvements as
    well. What it offers is already very impressive, but when combined with the fantastic
    hardware of the Chromebook X2 it provides an enjoyable Linux experience.


    It''s not just the project that works for Linux users, but also for a secondary
    mechanism, a way to bring Linux to a Chromebook and finding a way to fill the
    ''gap'' on Chrome OS. Google has done a great job – and together with desirable
    hardware like the Chromebook X2, Chrome OS''s success seems to continue.


    Paul O''Neill


    ### Pros

    Premium hardware design and a capable processor. A lightweight tablet for Android
    apps, excellent keyboard feel, stylish in the box and connectivity.


    ### Cons

    For a Chrome OS device with only 4GB of RAM and 32GB storage, limits is a factor.
    A good Linux experience but not a full Linux experience.


    ### Summary

    The important thing when deciding whether to buy Chromebook X2 is what to know
    before you buy. Running pure Linux with the distro of your choice, but you get
    a bit of sacrifice with a huge number of Android apps.


