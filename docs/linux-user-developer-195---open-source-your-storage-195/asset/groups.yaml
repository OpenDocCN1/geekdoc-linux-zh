    ![](img/06332f0e1d4d0e5b78061a5103897f51_88_1.png)


    在上方可以在 ArchLinux 的 GitHub 页面 (https://github.com/archlinux) 上找到大量的脚本，用于创建自己的基于
    ArchLinux 的发行版。


    > 该发行版由多样化的文档设施良好补充，旨在帮助从 Linux 新手成长为成熟的 Arch 用户，自动生成从硬件规格到桌面主题和版本的各种图表。ArcoLinux
    的所有选择都有多个选项，包括浏览器和媒体播放器，以及几个桌面和高级编辑器。该发行版还包括 Openbox 和 i3 桌面环境。这种多样性的缺点是开发者无法将所有内容放入一个环境中，但你可以轻松地从仓库中提取一个。


    在可用性方面，该列表缺少 Arch Linux 非常图形化的包管理器的其他方面，即那个基于 Arch 的命令行工具。开发者花费了大量时间围绕该项目进行构建，这不仅能帮助你在
    ArcoLinux 中完成工作，还能维护主 Arch 安装。


    选择是 ArcoLinux 的独特特征之一。开发者在 Xfce 设置中添加了几个配置来帮助你自定义桌面。你可以使用自定义主题和图标管理安装外观的各个方面。他们还添加了配置，你还可以对主题应用各种效果。有一些实用的小工具，如固定硬编码图标，它将当前主题脚本化图标，使其不违背主题。


    值得注意的一点：起初网站看起来杂乱无章，它们应该按照特定的顺序导航，这可能需要一些适应。


    Mayank Sharma


    定制化在两个方面都是一种享受——使用它们以及构建自己的。


    需要时间来理解与网站交互的细节。


    在一切的核心，将思考过程投入三个发行版中，结合网站演示视频，是值得赞的。它帮助新手刻出一个自然简单、引人注目且自定义的桌面发行版。


