    functional features, such as fans, lights and shutters, and got it working with
    an Arduino to get an idea of how things would fit together.


    ![](img/06332f0e1d4d0e5b78061a5103897f51_70_1.png)


    # Prep work


    Lots of prototyping work went into the house. Sergey says they started with cardboard
    prototypes to work out the scale required. Once satisfied with the results, used
    3D modeling software and laser-cut cardboard pieces from the design, and finally
    moved onto plywood using a snap-fit to join the pieces.


    ![](img/06332f0e1d4d0e5b78061a5103897f51_70_2.png)


    # Gesture trainer


    Gathering training data for the gestures helped inform important decisions. For
    example, Maks says the duration of each gesture needed be no longer than two seconds.
    They were also able to determine that optimal number of gesture samples was in
    the range of 20 to 25: "The network works really well for the users that it trained,
    with over 95 percent accuracy."


    ![](img/06332f0e1d4d0e5b78061a5103897f51_70_3.png)


    ![](img/06332f0e1d4d0e5b78061a5103897f51_70_4.png)


    # A moving proposition


    Initially, the team had to build a motion controller from scratch, but time constraints
    meant they chose the PlayStation controller as it had built-in features, such
    as acceleration and rotation. Sergey says the PSMoveAPI was pivotal in getting
    the controller to work with the Pi,


    ![](img/06332f0e1d4d0e5b78061a5103897f51_70_5.png)


    # Gesture recognition


    This is the Machine Learning gesture-recognition network structure for the doll''s
    house project. Sergey says they spent a lot time reading "of research papers"
    to design the right neural architecture, Multi Layer Perceptron works well for
    gesture recognition.'
