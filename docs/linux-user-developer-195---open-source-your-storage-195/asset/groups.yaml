    ## Review HP Chromebook X2


    ![](img/06332f0e1d4d0e5b78061a5103897f51_85_0.png)


    # HARDWARE


    ### HP Chromebook x2


    | Feature | Details |

    | :--- | :--- |

    | Price | £600 |

    | Website | www.acme.com |

    | Specs | CPU 8th Gen Intel Core i3-7300 |

