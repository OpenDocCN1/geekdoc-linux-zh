  md: '# NOTE-TAKING UTILITY


    # Cherrytree 0.38.5


    A simple to use feature-rich notes


    ![](img/06332f0e1d4d0e5b78061a5103897f51_90_0.png)


    Despite its version number, the application has been around for many years and
    is quite stable. The project identifies itself as a hierarchical notes taker.
    You might find the latest version in the software of your distribution but installation
    straightforward and the project provides a source tarball as RPM and DEB packages
    which you can use to install the tool in any variety of Linux distributions.


    The cross-platform tool is available for Windows and Linux and stores all the
    data in a single XML or SQLite file. You can import data from a number of alternatives
    such as KeepNote, Joplin, Tomboy, and others.


    +   Pros

    The interface is intuitive enough, but the project also features a thorough user
    manual.


    +   Cons

    Features signify numerous to accommodate its vast feature set.


    Cherrytree supports three types of items: folders, subfolders and notes. Each
    of items is represented as a node, and you can also add tags for each node which
    makes searching for the notes or folders you''re looking for. You can also add
    to your notes, bookmark important, and import images into a node to make sense
    of all the data.


    +   Great for...

    Organising your notes in a logical manner and importing and exporting them to
    other formats. www.glusen.com/cherrytree


    To top off, the app offers plenty of customisations, changing the appearance of
    nodes in the sidebar.


    # VIDEO EDITOR


    # Shotcut 18.07.02


    A lightweight video editor that supports many formats


    ![](img/06332f0e1d4d0e5b78061a5103897f51_90_1.png)


    Available for Linux, Mac and Windows, the latest release of this vastly capable
    editor features many notions. Unlike some other simple tools, the project proves
    itself for its support of functions and you can engage with it without having
    to reach for the handle. You can use the timeline for non-linear video editing
    of multiple tracks. With FFmpeg, the tool supports a large variety of audio, video
    and image formats.


    The latest release allows for 4K video, webcam and audio network streaming, exporting
    a single frame as an image or as an image sequence, and even multiple formats—which
    means you can mix video segments with differing frame rates and resolutions within
    a single project.


    From 6-bit Snap and App packages, the project provides a stable variant in the
    compressed tarball. With the latter you can use Shotcut without first installing
    it.


    In addition to a FAQ and forum, the project''s website also hosts a number of
    video tutorials covering topics such as stabilisation, multi timelines and more.


    ![](img/06332f0e1d4d0e5b78061a5103897f51_90_2.png)


    Above You found a number of video tutorials on the project''s website and your
    YouTube


    +   Cons

    While there are plenty of video tutorials, the project doesn''t provide a user
    manual for offline use.

    Cons

    Great for...

    Editing and enhancing video and audio files using a single interface. www.shotcut.com


    +   Pros

    This application boosts a large number of editing features and video effects.'
