    # # What''s ActivityPub?


    The decentralised social networking protocol ActivityPub is appealing because
    it allows the client to talk to server-server APIs. The client-server protocol
    is how a user (or other automated processes) can interact using many different
    devices, such as a desktop computer, mobile phone or web app, for creating, updating
    and deleting content.


    The second interface is a server-to-server protocol. This uses an API for developers
    to work with particular ease, so that decentralised websites can share information
    with each other.


    ActivityPub uses an email-like inbox and outbox system where every user is represented
    by ''actors'' via the user''s accounts (see diagram). Every actor has an inbox
    for getting messages and sending messages. Users on different servers communicate
    with each other. In actors, you can use HTTP POST and GET to send messages to
    an inbox and outbox. POST sends messages they''re on and posting out to your server.
