    # Intel Control-Flow Enforcement Technology.


    Today''s computer systems are subjected to an increasing frequency of attacks
    by malicious actors, as well as the efforts of the security researchers. We have
    seen out over the course of the past year several side-channel vulnerabilities
    such as Spectre and Meltdown, which exploit the implementation of modern processors.
    These attacks target hardware that are implemented with robust interfaces, including
    those that have been vulnerable to susceptibility to common programming errors
    such as buffer overflows, which attackers have fixed upon the most complex and
    native kernels, the humble and hundreds hundred kinds of exploits that could continue
    to be the biggest set of challenges for software developers.


    Buffer overflows have attacked over the past 30 years since they were first documented
    in the wild back in 1986. At that time, a overflow could trick a victim system
    application into handling more than it was designed to cope with, other overwriting
    the end of a buffer by a size that was out of bounds. The first cases are far
    more common.


    As example, the C programming language features sensitive memory locations containing
    characters, with a ''null'' terminator (a special kind of zero value at the end
    of an). Older C library functions such as ''strcpy'' - long since replaced with
    ''strncpy'' - which copies a string from one buffer to another, didnt ever check
    the strings that it was given:


    within the allocated storage. As a consequence of such oversights, if a smaller
    destination buffer was used to cause an overflow, in which string (or similar
    operation), overwriting beyond its intended had happened through the buffer to
    store other data (such as passwords or other useful data to the attacker), it
    became possible to create a ''string'' containing malicious values that would
    overwrite a return address, altering its behaviour in process. This is the classic
    way in which buffer overflow is exploited to take control of program execution.


    These attacks are also referred to as ''stack overflows'' because small buffers
    are often stored on a program stack a small piece of local variables where code
    function is running. In order to add stack data, attackers are used to store the
    return address of the program that should execute after completing a function
    call.


    Over time, more complex attacks that build upon basic buffer overflows have developed.
    One attack, known as Return-Oriented Programming (ROP), uses gadgets from contemporary
    systems to ropes. In ROP attack, a stack overflow allows the return address of
    a function call (control program) to deviate from the intended path and overwritten
    address point to existing code, but code can be located anywhere within the program.


    Technologies like Intel CET aim to mitigate potential attacks, as well as JOP,
    or Jump-Oriented Programming (JET). This achieves this by using a ''shadow stack''
    that is aligned with the regular stack. When function calls, the return address
    is ''pushed'' onto the traditional stack as normal, but it is also copied to the
    shadow stack. On return, the address is ''popped'' from both stacks and compared.
    If it matches, all is well, but if it does not, something malicious has occurred
    and the processor signals a fault


