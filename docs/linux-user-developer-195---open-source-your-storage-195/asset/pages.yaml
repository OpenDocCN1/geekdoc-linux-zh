  md: '# Safety from injection attacks


    Go is very good at protecting us from an injection attack. This is when a malicious
    user tries to insert code into an input field that they''ll be able to bypass
    the security and gain access to your system.


    In Figure 7, we see an attempt at a benign injection attack: someone has decided
    that they''ve wanted to style the title of the home page, so they''ve added HTML
    styling to the title field. Instead of typing their bold characters, they used
    `<span style="position:font-size:large; color:yellow">Richard</span> at the `<body>`
    tag to make their title stay at the top of the page as an image. On the HTML page,
    we might expect this attack to be successful. Their HTML code is printed correctly
    because the special characters such as `<` and `>` have been replaced by appropriate
    HTML entity, such as `&lt;` and `&gt;`.


    We use an HTML template. If we look at the data, this file for the uploaded video,
