    # Prune tree


    A useful command is -prune, which enables empty branches of the tree. If we use
    the -prune command on a directory, it will not descend into that directory. For
    example, if we use an Ubuntu image directory to search for images, but we don''t
    want to descend into the ubuntu directory, we will get messages about core systems
    that we have. In this case, we use the following:


    ```

    $ /find -path /ubuntu/* -o -print

    ```


    Here, find will check whether it matches the path. If it does, it will find that
    directory correctly. Because of the way in which find processes directories, the
    -print option does not work properly if we use it because find will descend into
    the ubuntu directory before it has the chance to prune it. In particular, we can''t
    use prune if we''re using the -delete command, as this command will act after
    the -exec flag.


    # Execute commands


    We have an example where we piped the output of find in commands to order run
    the find to rename the files that it was printing. This is actually quite a useful
    way to do things, as find works with special characters as spaces or tabs; the
    shell pipe is not holding when the filename contains spaces or newlines as thought
    were multiple files.


    It is better to use built-in capability for executing commands on the files. The
    example above them the following:


    ```

    $ /find -type d -depth -mindth 1 -exec

    rmdir --fail-on-non-empty () *

    ```


    We have used the -exec command in order to execute


    # Figure 2


    ```

    $ -name ''*.cpp'' -exec bash -c ''

    (count=0)

    if [ "$1" = "${file/cpp}" ]; then

    ((count += 1))\echo "$count files modified."

    fi'' -- {} +

    ```


    an external command of the shell; with -exec and -terminating is treated as part
    of the command. The {} is used as a placeholder for the files that turns up.


    The last character can be either plus * or an (escaped semicolon). The semicolon
    is a bit slower, as the command from find will be executed for each {} one by
    one, and the command will be executed with each of them.


    The + means that we''re passing multiple files to once at once; this can improve
    performance by sending them in batches, however using only {} once in find; we
    can handle as many of them as we want using {};


    # Run in the new shell


    find executes the commands in its own shell. However, we want to take advantage
    of advanced shell features. We can do this by reuniting find in our own shell.
    The command works with -exec and a flag that allows us to pass a command into
    the shell; the following examples are one using -exec \; and one using -exec +;
    both work fine.


    Here, the command passed to -exec is shell; in a mini-shell script to rename the
    file. The arguments are passed as positional parameters to the shell; the parameter
    $0 is always the name of the file, and $1 is the filename as the parameter $1.
    We use {} here since we are passing the script to all the files at once.


    This is good, but starts a new shell for every file, which can affect the performance.
    An alternative is shown in Figure 2, where we use a shell for find that will iterate
    over the non-zero positional parameters. Then we use + so that we can pass all
    the files at once.


    As with in -exec, it is worth taking time to learn the various features of find,
    because the time can save later on more others it.


    Left advantage of passing multiple files to our mini-shell-script is that we can
