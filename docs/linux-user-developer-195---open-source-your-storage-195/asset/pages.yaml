    # # Father of Python, Guido van Rossum, quits now


    No successor named, as ‘benevolent dictator for life’ walks away


    **30 years after creating the Python development language, Guido van Rossum has
    stepped down following some difficulty surrounding the signing of PEP 572.**

    Posting to the Python mailing list, van Rossum explained. "Now that PEP 572 is
    done, I no longer have to be hard for a PEP and find that so many people despise
    my decisions."

    The PEP process (Python Enhancement Proposal) is the process used to add features
    and standards to the Python language. While other languages might allow evolution
    with a vote, Python was developed by van Rossum personally signing off on every
    proposal.

    In statements, Rossum has also refused to name a successor (or, indeed, an outline
    for any future system of leadership), leaving the Python community in dilemma
    how to come up with a solution, that would make clear his future involvement would
    be unnecessary.\n"So what are all going to do? Create a democracy? Anarchy? A
    dictatorship? A federation? We may be able to write


    processes for these things as PEPs (maybe those PEPs will feel a kind of constitution).

    But here''s the catch, I try to let you (the current community) figure it out
    for yourselves.\n"It is still here, but I''m trying to let you all figure it out."

    What is most interesting about this is the attitude with which van Rossum has
    relinquished control of the development process, as if the ever PEP 572 has given
    him the opportunity to do something that might have been in mind for an core development,
    and he''ll be available to mentor more people - possibly otherwise.

    He will also request a release from becoming a BDFL.

    "After all is eventually going to happen regards - that''s stuff that lasts lurking,
    and I''m enjoying the coming peace."

    Immediate reaction from van Rossum''s decision has been nature and reasoned, and
    with the right to governance structure, Python will no doubt serve.


