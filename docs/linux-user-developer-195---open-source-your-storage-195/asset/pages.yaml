  md: '# Review Fresh free & open source software


    # NETWORK CHAT


    # BeeBEP 5.0.0


    LAN messenger to chat with peers on the network


    The Linux desktop is home to several different clients, and many popular Linux
    distributions feature one in the default installation. BeeBEP provides all features
    of a modern client, but it is designed to connect directly with peers on your
    network. From chat messages, you can also use the tool to share files with other
    users on the home network.


    The peer-to-peer messenger can automatically detect BeeBEP users on the network,
    encrypt messages using the AES algorithm, and like any other client, you can use
    the tool to initiate group chats, or limit conversations to a single user. The
    interface is straightforward, the tool boasts useful features as drag and drop,
    you do not have to navigate through menus and free share files with your peers.


    BeeBEP allows settings and chat messages in separate bebeep.ini and beebeep.dat
    files, which are not affected when you update the tool version. If you have a
    poorly-compatible importer, BeeBEP can easily import your messages. For those
    still on the fence, the tool lets you transfer screenshots to your peers, and
    even supports desktop sharing!


    ![](img/06332f0e1d4d0e5b78061a5103897f51_89_0.png)


    Above You won''t find a user manual on the website, but the interface is fairly
    straightforward


    +   * Pros

    Doesn''t require installation. Just download the tarball, unzip files, and launch
    the application.


    +   * Cons

    The single-developer project is well maintained, but still is a hobbyist project.


    +   * Great for...

    Instant-free chats with peers on the network.

    http://bebeep.

