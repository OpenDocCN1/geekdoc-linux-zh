    # ## GROUP TEST


    # ## Firewall distributions


    Use one of these open source firewall distributions to shield your home or small-office
    network from the dangers lurking on the internet


    ### IPFire

    One of the most popular and comprehensive firewalls, IPFire is a Stateful Packet
    Inspection (SPI) firewall built on top of the netfilter utility. The firewall
    uses a kernel hardened generic to thwart zero-day exploits, and comes with strict
    access controls.

    www.ipfire.org


    ### OPNsense

    OPNsense based on FreeBSD and started as a fork of the more established pfSense
    in early 2015. They believe they could create a much stronger firewall the two
    projects have grown OPsense now shares 10 cent of its code with pfSense.

    www.opnsense.org


    ### pfSense

    Like OPNsense based on FreeBSD and also uses a stateful firewall. It can filter
    traffic by source and destination IP, protocol, and source and destination port
    for TCP and UDP. Wide range of hardware the latest version is only available as
    64-bit

    www.pfsense.org


    ### Smoothwall Express

    This is the freely distributable version of Smoothwall firewall. Originally known
    as Smoothwall GPL, it''s under development since 2000 and is designed with home
    and small businesses in mind. It is entirely funded by Smoothwall.

    www.smoothwall.org'
