  md: '# Feature Open Source Storage


    # # Backups

    With lots of files, keeping them safe becomes even more

    important, how do we back things up?


    Your NAS can quickly accumulate a lot of data that is irreplaceable and that also
    makes it vulnerable, so you need to consider keeping your data safe. The first
    step may be use RAID to protect against single-disk failure, but backups are also
    necessary. Backups are obviously, but what you need to back up depends on your
    needs. As mentioned earlier, means backing up is as straightforward as replacement.
    Video files, as well as photos you may have online, are easy to re-download; on
    the other hand, personal documents are important and files could be impossible
    to replace.


    Frequency of backups should also be considered. How often do you need to back
    up? Until daily at the end of the day and weekly for a daily work. In a business
    environment, the minimum you should consider is a second NAS mirrors


    the primary device. That way, if any hardware fails you can swap the replacement
    unit with minimal interruption. Your backups ensure it is regularly up to date,
    depending on the frequency of your work. You may need to back up more frequently
    in the run up to failure, and this is where next-generation file systems such
    as ZFS and btrfs come into their own. Their image features can automatically detect
    corruption and fix it one of RAID copies.


    You should also consider encrypted, off-site backups of your data to protect the
    information held by your data protection laws. Make sure any off-site backup is
    secure by storing them in another country. As a different scenario, you may want
    to back up data from your desktop or laptop computers, and you just have to have
    a


    > EXPERT TIP

    Don''t forget to test your backups! Make sure you backed up via cron or a similar
    mechanism, but do a test restore from time to make sure your backups are actually
    usable.


    NAS with plenty of storage space. Backup program you is a matter of taste and
    also depends on your needs. Backup should be fast or similar, but also about what
    you want to be restoring the data. Some programs, such as duplication (https://www.ngoh.org/duplication),
    are faster for large files, but restoring a single file that you deleted by accident
    requires reading the main page. On the other hand, backup (https://github.com/backups/readme.md)
    enables you to mount archives, so files can be restored in any file manager, even
    by a less experienced user.


    # HOW TO Set up backup


    ![](img/06332f0e1d4d0e5b78061a5103897f51_27_0.png)




    +   ### 1 Create a repository

    - Create a repository with `$ backup init --encryption=none /backup/dir` . This
    initializes a repository without any encryption password. We have used no encryption
    here, but you would usually want to use one of the options provided in the documentation.


    +   ### 2 Create a backup

    - `$ backup --dir=/backup/dir/first backup` creates a backup of your home directory.
    Here, you can create the backups on a different computer with `user@host:/backup/path


    +   ### 3 Later backups

    - Use `$ backup --dir=/backup/next_backup` for home backups. This is much faster
    than copying all files; each backup represents the state of the file system at
    the time of backup, but each file is stored only.


    +   ### 4 Restore options

    - You can restore with the backup command, but you can also mount an archive so
    you can restore specific files, like this: `$ backup /dir /mountpoint`. Backup
