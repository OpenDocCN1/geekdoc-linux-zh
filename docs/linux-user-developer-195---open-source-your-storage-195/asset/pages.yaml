  md: '# pfSense


    The FreeBSD-based distro that does a lot more than firewalling


    # SmoothWall Express


    A mature and adept firewall-only product that offers no add-ons


    ![](img/06332f0e1d4d0e5b78061a5103897f51_82_0.png)


    ![](img/06332f0e1d4d0e5b78061a5103897f51_82_1.png)


    +   - Use The Traffic Shaping in pfSense to create a default set of rules that
    you can fine-tune for your own network


    +   - You can plug in a configured drive and SmoothWall Express will automatically
    backup the running firewall into it


    # Ease of deployment


    This is the original project from OPNSense. The two projects are entirely different
    now, but installation and initial configuration processes are largely identical.
    Post installation, you''ll have to manage the network interfaces and configure
    them by using your web-based interface.


    # Ease of deployment


    Installing SmoothWall is fairly straightforward. Once you''ve selected a file
    system and it takes over the computer''s disk, it launches a browser where you
    can configure things such as the hostname. You are also asked to choose one of
    the three features for policing traffic. And, with IPfire, your NICs analytics
    to one of four-coloured choices.


    # Extensibility and maintenance


    pfSense includes a package manager which can be used to install and deploy dozens
    of useful packages Asterisk, Datasguard, Squid and many others. The distribution
    will check for updates that can be installed with a single click, plus it includes
    a host of diagnostic tools and utilities to troubleshoot the installation.


    # Extensibility and maintenance


    Though it looks a bit old-school, it has no package management functionality.
    In fact not the UI offers an option to add or enable more modules, as all supported
    features are shipped in the distribution. You can check for updates and install
    all with a single click, and you are also asked to keep a backup of the configuration.


    # Other functions


    pfSense has immense list of features beyond its basic firewall. You can use it
    as a server load-balancer, provide VPN functionality via IPsec and OpenVPN, a
    DNS client to register your IP address with a host of services, and many others.
    You can just use it for more: manage as an intranet server and deploy a captive
    portal.


    # Other functions


    Beyond its standard firewall features, you can use SmoothWall as a web proxy,
    a POX proxy and an IM proxy that reveals real-time logs. The distribution displays
    detailed traffic stats for your interface and for each individual IP addresses,
    and also asks you to manage and update your dynamic date


    # Management interface


    The difference between pfSense and OPNsense is that the interface, pfSense has
    a different layout with the options rolled into drop-down menus. There''s no search
    to easily find settings, but you will get help by showing related settings.


    # Management interface


    The firewall''s web-based administration interface functions between two sets.
    All firewall-related features are housed under the Network tab. It offers basic
    integration, for example, you can create block rules while blocking the logic


    # Overall


    A very mature product that does, like its fork, offers more than a simple firewall
    out of the box. Again, its interface might confuse new users but its ''related
    settings'' option is a big help.


    # Overall


    A good firewall product that does what it is designed to do and not much else.
    Its web-based interface is simple, and despite being rudimentary it is inviting
    for inexperienced users.'
