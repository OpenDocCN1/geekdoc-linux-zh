    # ## Lower Saxony tax office dumps Linux


    Migrating 13,000 users from openSUSE to Windows 10 is expected to cost the state
    13 million euros


    Following news earlier this year that the city of Munich, Germany, is to abandon
    Linux after 15 years at a cost of over €10 million, the state of Lower Saxony
    (capital Hanover) is now following, dumping Linux in its tax department after
    years.


    The preferred solution for the 13,000 workstations running an outdated version
