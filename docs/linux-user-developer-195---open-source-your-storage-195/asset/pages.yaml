  md: '# Raspberry Pi: News Machine


    # Raspberry Pi: Build an automated news machine


    Use Python code to pull down the latest news into a simple presentation, with
    hyperlinks to each story


    ![](img/06332f0e1d4d0e5b78061a5103897f51_75_0.png)


    # Dan Aldred


    Raspberry Pi enthusiast, teacher and coder whi enjoys creating projects and hacks.
    He''s currently trying to get started with Kinect, and Pi to work with each other.


    # Resources


    +   - feedpaper https://github.com/kurtmkeee/feedpaper

    - python-pptx https://github.com/scanny/python-pptx


    ![](img/06332f0e1d4d0e5b78061a5103897f51_75_1.png)


    News is everywhere. We are constantly bombarded with news via mobile devices,
    tablets, laptops, TVs and radios. You probably also overhear people discussing
    news. Traditionally the newspaper was used to indicate what type of person you
    might be - like your income, politics, social status and what your ethics and
    morals are. For example, an article by IBT in 2013 found that 40% of readers of
    the New York Times were making more than $75,000 a year.


    Nowadays, the news caters for every story with variations like gossip, detailed,
    statistical analysis, photographic and so many more. There are there ''Make news'',
    which has no modern concept - its roots go back to the Second World War.


    Whatever your news preference, this tutorial will walk you through customised
    and building your own, automated ''News Machine''. Select your favourite news
    source and use feedpaper to pull down 10, 15, or more news stories. Then python-pptx
    to write your news data into a presentation and save it to your folder. Open the
    file, and you will have your own customised


    Above Harvest news stories from sites to create your own few


    newspaper that includes up to minute news headlines and a hyperlink to each of
    the stories. Don''t like what you''re reading? Simply change your source and run
    the program.'
