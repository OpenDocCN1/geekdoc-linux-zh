  md: "# Install feedsparser\n\nThe program uses a Python library called feedsparser.\
    \ The process of parsing basic manifests is taking input from a string and from\
    \ web data. feedsparser also handles RSS, Atom and RDF. In our program, feedsparser\
    \ is used to fetch the feeds which are then downloaded and pull out data, such\
    \ as the headline and hyperlink to the website where the story is stored. Using\
    \ the LXTerminal window and type into it: this will download the required Python\
    \ library.\n\n```\n$ File Edit Tabs Help\npip install feedsparser\n```\n\n# Install\
    \ feedsparser\n\n```\nfrom feedsparser import feedsparser\nfeed = feedsparser.parse('http://feeds.bbci.co.uk/news/world/rss.xml')\n\
    for entry in feed.entries:\n    print(entry.title)\n    print(entry.link)\n  \
    \  print(entry.summary[:200])\n    print(entry.published)\n    print(\"-\" * 20)\n\
    ```\n\n# import feedsparser\n\nfrom pptx import Presentation\nfrom pptx.util import\
    \ Inches, Pt\nfrom pptx.dml.color import RGBColor\n\n![](img/06332f0e1d4d0e5b78061a5103897f51_76_0.png)\n\
    \n# Create the lists\n\nNow create two lists to hold the data feedsparser collects\
    \ from the news websites. Lists are a useful feature of programming languages\
    \ and works like a list of items. You can add items to them, delete them when\
    \ needed. Next, create a list and use feedsparser to collect the headlines. The\
    \ code below includes two new websites, and you can try each of them. We are in\
    \ Step 10 to create the new data.\n\n+   - News = feedsparser.parse('http://feeds.bbci.co.uk/news/world/rss.xml')\n\
    - SkyNews = feedsparser.parse('http://feeds.skynews.com/news/rss.xml')\n\n# Create\
    \ the slide layout\n\nIn order to make the presentation we want create a custom\
    \ function which builds the slides. By defining the name of the function and then\
    \ parameters the runs will be created with the news headlines linked to the slide\
    \ layout. On one line set the slide layout to 0 – this is the standard default\
    \ presentation layout, with a title and subtitle text. Create a variable which\
    \ holds the slide information layout, the title and the subtitle.\n\n# Import\
    \ the required modules\n\nOpen your Python editor and start a new file. Begin\
