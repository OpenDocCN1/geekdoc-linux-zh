    apps, providing a way to run your command line tools, or even running a desktop
    environment - although on Android devices this is typically not possible. If you
    need a backup-up before you do something important when you''re out and about
    your home,


    chroot requires root access on the host machine, and this is not available on
    a standard Android install. KBOX uses a fake library to simulate this and it works
    with some limitations. Install it by booting a terminal emulator on your device
    before downloading and running KBOX, but if you want more functionality, you do
    need to go the root, out, route.


    If you don''t want to root, which typically involves unlocking the bootloader,
    your device and making a risk of warranty-voiding modifications, the most popular
    option is KBOX (see kevinmore.net/kbox.html).


    Linux Deploy, available on the Google Play Store, is another easy solution for
    Android. The application creates a disk image on a flash card, mounts it and installs
    Ubuntu. Distribution of the apps allows you to run Linux together with Android
    OS. Most importantly, all changes made to the device are reversible - the application
    and components can be removed.


    If you''re looking to run a Linux environment on Android, providing a full suite
    of many standard command-line tools (like tar, grep and so on), console editors
    (Vim, Nano), networking tools (SSH, Droplet, Dropbox), and development tools (C/C++,
