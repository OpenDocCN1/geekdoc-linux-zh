  md: '# Tutorial: Virtual Environments


    # Python: Create virtual environments for projects


    Python is deeply integrated with Linux and virtual environments isolate from the
    rest of the system


    The tremendous breadth of the Python ecosystem is the language''s strongest point.
    But Python 3 broke backward compatibility with Python 2, which changed libraries
    were less than known to accept. Having to reconfigure system-wide Python installation
    quickly becomes tedious, and installing specific versions of Python across different
    distributions; for example, installations can fail due to syntactic differences
    or library APIs. A easy way to manage this is using virtual environments (venv),
    which isolate projects from the system''s Python environment. Libraries installed
    in a venv don''t interact with the rest of the system, reducing conflicts and
    leading to a enjoyable workflow.


    For example, both python and python3 are redirected to files hosted inside the
    virtual environment. A newly created workspace contains a group of standard libraries
    considered essential by the script''s developer. Pyenv provides a bit of metadata
    such as the version of the Python interpreter used by the virtual environment:


