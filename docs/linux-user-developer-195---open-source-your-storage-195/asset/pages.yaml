    For example, let''s say you have two-sized disks, /dev/sdb and /dev/sdc, create
    a RAID1 pool in ZFS like this:


    ```

    $ zpool create mypool/myrefs /dev/sdb /dev/sdc

    ```


    If possible use the name in /dev/disk-by-id rather than the absolute nodes; this
    avoids potential problems if you add or remove disks in any file system you use.
    You then create file systems, or datasets in ZFS, the pool using the following
    ZFS command:


    ```

    $ zfs create -o mountpoint=/storage/videos/mypool/myrefs

    $ zfs set mountpoint=/storage/videos/mypool/myrefs

    ```


    ZFS automatically mounts file systems on startup at /pool/dataset. You can change
    this by setting the mount property at creation time or later using:


    If you want to control it, you will need to set the mountpoint to /etc/fstab and
    add it to fstab with the file name as /pool/dataset and the file type as zfs.


