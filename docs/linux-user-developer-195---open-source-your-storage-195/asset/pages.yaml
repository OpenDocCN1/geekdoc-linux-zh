    # Function or variable


    A common mistake beginners makes, especially if they''re used to more complex
    languages such as C++, is to get confused about the difference between variables
    and functions.


    There are two types of variables in LibreOffice Basic. Global variables are defined
    in a module block and can be used by any function or function within it. Local
    variables can only be used within the function it''s defined. By convention, people
    use Dim for variables which you want to declare a type, like


    Functions accept parameters (which are variables passed as inputs), perform operations
    in a predetermined order and return the value of the function when called.


    ```

    Dim myGlobalString As String = "HELLO"

    Dim SubVariable(Parameter As String)

    localVariable = "Issue"

    print myGlobalString

    print localVariable

    print Parameter

    End Sub

    ```


    The key difference is that a function will output a value for use in, while a
    subroutine doesn''t need to return any value. In the example below you can see
    a function on line 1 and a subroutine on


    ```

    1: result = myFunction(1, 2)

    2: Subroutine("239")

    ```


