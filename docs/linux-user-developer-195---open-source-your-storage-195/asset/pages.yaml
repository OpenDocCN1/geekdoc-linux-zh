  md: '# OPINION


    # How to secure containers is to pack VMs full of the


    It''s safe to say that you''ve been trapped under something heavy in an underground
    data centre for the lack of it, at least you know that containers and your orchestrators
    now rule the feast.


    The portability of containers for identical production releases happened shortly
    time of the global container explosion. Without worrying about system compatibility
    issues, it''s unprecedented de-facto.


    Consider the spectacular popularity of containers with clearer accessibility and
    excellent features. A relatively short time ago, a few years later here we are.
    There was a way - still it is a problem, however, and everyone agreed containers
    were great, no one really bothered to check they were. It''s far from a trivial
    one. It''s simple that while everyone agreed containers were great, no one really
    reached to them.


    The simple (slightly abbreviated) command line example from CoreOS page is as
    follows: Docker images do not support signature verification and Docker containers
    have their own security options.


    ```

    $ docker run --debug --insecure-options=image--stage-name=coreos.com/r/stage-1.29.0-redis

    ```


    ![](img/06332f0e1d4d0e5b78061a5103897f51_8_0.png)


    As you can see, a Docker-compatible container in this case. free. But not the
    insecure-options addition: CoreOS explains that "Docker images do not support
    signature verification, and Docker containers have their own security options-insecure-options=image."
    If nothing else, that should encourage you to use images directly.


    Chris Binnie

    Book: Linux

    Server Security: Host and Defense

    and teach you how to make servers invisible and mitigate attacks. See www.devsecops.com


    For clarity, the stage mentioned is described as a trustworthy binary which facilitate
    the container environment, and in this case we are using KVM''s stage


    # Throwing production workloads at a ship-full (pun intended) of containers is
    not for the faint of heart


    to set up networking, mounts and so on. Here is where you''re interested: http://bit.ly/lod-kvm.


    Using the battle-hardening offered by KVM, it is possible to run your containers
    inside a hypervisor-protected ''environment'' on the host. This hardened binary
    links a kernel of sorts, apparently, and thus protects the hypervisor itself -
    which is KVM in this case (https://github.com/ikvm/kvm).


    My work with DevSecOps work and when I looked at the Docker security model - having
    previously used OpenShift 2 for container production in 2009 - I learned about
    CoreOS runtime (https://coreos.com/runtime). The people at CoreOS wanted a more
    secure alternative to Docker, but with enough flexibility.


    From a security perspective, the main headache with running containers on a host
    is that they are simple of a system''s requirements: they are restricted to affect
    the host. The hosts and why of this is another day and another container, but
    to survive it''s a simple problem of the best and worst it has been worked with
    many innovations in this area, for example, come how Google Chrome''s tab-based
    sandbox, prevent one tab (or container) from breaking others in the same application.


    If you want to help prevent "container escape" and other issues, this is provided
    by CoreOS. It suggests running your containers inside a virtual machine (VM) which,
    thanks to much more mature, hardware-based security mechanisms, can''t break your
    host to the same extent. Have a look before you break it - if you''re interested
    - it''s very clever stuff: http://bit.ly/lod-kvm.


    The mighty might have great grades in this field with its Clear Containers, but
    that story is also for others and like to follow when I''ll get the chance to
    explain further in future issues.


    There are other advances in this area which are looking out for the press, too.
    In finding a fascinating approach: watch this (containerised) space, things are
    changing rapidly.'
