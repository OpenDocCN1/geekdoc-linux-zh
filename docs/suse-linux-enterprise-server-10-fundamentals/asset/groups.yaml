    \ remains valid. After number days it must be changed. |\n\nThe following is an\
    \ example:\n\n```\npasswd -x 30 -w 5 geeko\n```\n\nIn this example, the password\
    \ of the user geeko remains valid for 30 days. After this time, the password is\
    \ required to be changed. Geeko receives a warning 5 days before expiration.\n\
    \nWhen the command is used to establish or change the password of a user account,\
    \ the file /etc/default/passwd is checked for the encryption method to use:\n\n\
    ```\n# This file contains some information for the\n# passwd command and other\
    \ tools creating or modifying passwords.\n# Define crypt hash\nCRYPT=(des,md5,blowfish)\n\
    The default setting for variable CRYPT is Blowfish. Other possible encryption\
    \ methods include DES and MD5. YaST also uses the file /etc/default/passwd.\n\n\
    # Manage Groups From the Command Line\n\nYou can use the following commands to\
    \ perform the same group management tasks available with YaST (and some not):\
    \ You need be logged in as root (or switch to root by entering su -) to use these\
    \ commands.\n\n- groupadd. You can create a new group by entering groupadd [group_name].\
    \ In this case, the next GID is used. Using the option -g as groupadd -g 200 sports\
    \ lets you specify a GID. Using the option -p lets you specify an encrypted password.\
    \ You can use the command mkpasswd to create an encrypted password.\n\n- groupdel.\
    \ You can delete a group by entering groupdel [group_name]. There are no options\
    \ for this command. You can only delete a group if no user has this group assigned\
    \ as a primary group.\n\n- groupmod. You can modify the settings (such as GID,\
    \ group name, and users) for an existing group. The following are examples:\n\n\
    - Change the GID:\n  `groupmod -g 201 sports`\n- Change the group name from sports\
    \ to water:\n  `groupmod -n water sports`\n- Add the user geeko to the group:\n\
    \  `groupmod -A geeko water`\n\n- gpasswd. Change passwords for group accounts.\
    \ Only the administrator may change the password for any group. With option -r\
    \ the group password can be removed.\n\n![](img/428e877abd09b1c11149d179d3458f12_286_0.png)\n\
    \nYou can learn more about these commands by referring to the online manual pages\
    \ (such as man groupadd) or online help page (such as groupadd --help).\n\nThe\
    \ command newgrp allows to change the effective group of the executing user.\n\
    \n```\ngeeko@da51:-> id\nuid=1000 (geeko) gid=100 (users)\ngroups=16 (dialout),\
    \ 33 (video),100 (users)\ngeeko@da51:-> newgrp video\ngeeko@da51:-> id\nuid=1000\
    \ (geeko) gid=33 (video)\ngroups=16 (dialout), 33 (video),100 (users)\ngeeko@da51:->\
    \ exit\ngeeko@da51:-> id\nuid=1000 (geeko) gid=100 (users)\ngroups=16 (dialout),\
    \ 33 (video),100 (users)\ngeeko@da51:->\n```\n\nIn this example you can see that\
    \ the current shell is replaced with a new shell.\n\nA password is requested if\
    \ the group has a password and the user is not listed in the group file as being\
    \ a member of that group.\n\n# Create Text Login Messages\n\nYou can create login\
    \ messages that are useful for displaying information when a user logs in from\
    \ a terminal window, or remotely (such as an ssh login).\n\nYou can modify the\
    \ following files to provide these messages:\n\n- /etc/issue. Edit this file to\
    \ configure an initial message for users logging into the system.\n\nThe following\
    \ is an example of an edited /etc/issue file:\n\n```\nWelcome to SUSE Linux Enterprise\
    \ Server 10 (i586) Kernel \\r\n(\\1).\n===========================================\n\
    nThe SUSE Linux Web Server\n===========================================\n```\n\
    \n- /etc/issue.net. Edit this file to configure an initial message for users logging\
    \ from the network system.\n- /etc/motd. Edit this file to configure an initial\
    \ message of the day.\n\nMake sure you add one or two empty lines at the end of\
    \ the messages, or it will run into the command line prompt.\n"
