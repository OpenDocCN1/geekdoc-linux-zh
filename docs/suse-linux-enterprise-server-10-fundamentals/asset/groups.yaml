    | 文件 | 描述 |

    |---|---|

    | /sbin/mkfs* | 创建文件系统（格式化）。 |

    | /sbin/shutdown | 关闭系统。 |


    ## 服务数据目录 (/srv)


    `/srv` 目录包含用于存放各种服务数据的子目录。例如，Apache Web 服务器的文件位于 `/srv/www/` 目录，FTP 服务器文件位于 `/srv/ftp/`
    目录。


    ## 子域 AppArmor (/subdomain)


    Novell AppArmor 是一种有效且易于使用的 Linux 应用安全系统，保护您的 Linux 操作系统和应用程序免受攻击、病毒和恶意程序的影响。AppArmor
    不是防火墙或病毒检测程序；它是一个完整的入侵防御系统。


    AppArmor（以前称为 Subdomain）是一种内核增强，用于将程序限制在有限的资源集中。AppArmor 独特的安全模型是将访问控制属性绑定到程序而不是用户。


    ## 临时区域 (/tmp)


    各种程序创建的临时文件存储在 `/tmp/` 中，直到它们被删除为止。


    ## /usr 下的层级结构


    `/usr` 目录根据 FHS（文件系统层次结构）代表第二层层级。


    `/usr` 意味着 Unix 特有资源或 Unix 系统资源。


    这是所有应用程序、图形界面文件、额外库、本地安装程序以及包含文档的常用共享目录的位置。


    这些包括：


    | 目录 | 描述 |

    |---|---|

    | /usr/X11R6/ | X Window 系统的文件 |

    | /usr/bin/ | 几乎所有的可执行程序 |

    | /usr/lib/ | 库 |

    | /usr/local/ | 本地安装的程序，现在经常出现在 /opt/ 目录 |

    | /usr/sbin/ | 用于系统管理的程序 |

    | /usr/share/doc/ | 文档 |

    | /usr/share/man/ | 手册（命令说明） |

    | /usr/src/ | 所有程序和内核的源码（如果已安装） |


    ## 变量文件 (/var)


    该目录及其子目录包含可以在运行时进行修改的文件。


    下表提供了 `/var` 下最重要的目录的概述：


    表格 5-7

    | 目录 | 描述 |

    |---|---|

    | /var/lib/ | 变量库（例如用于 locate 和 rpm 命令的数据库） |

    | /var/log/ | 大多数服务的日志文件 |

    | /var/run/ | 带有运行进程信息的文件 |

    | /var/spool/ | 队列目录（打印机、电子邮件） |

    | /var/lock/ | 保护设备不被多次使用的锁文件 |


    ## Windows 分区 (/windows)


    如果 YaST 发现任何微软文件系统的分区，它会自动创建一个 `/windows` 目录。该目录下包含 Windows 驱动器字符命名的子目录（例如 C,
    D）。


    ## 进程文件 (/proc)


    Linux 通过 `/proc` 目录向用户提供进程信息。该目录不包含实际文件，因此不占用任何空间。


    除了每个单独进程的目录外，`/proc` 还包含包含系统状态信息的目录和文件。


