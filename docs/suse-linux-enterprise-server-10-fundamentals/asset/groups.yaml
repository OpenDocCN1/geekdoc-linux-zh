    # Objective 1


    # The History of Linux


    Linux is closely related to the UNIX operating system. To understand the history
    of Linux, you need to know the following:


    +   - The Historical Development of UNIX

    - The Development of Linux

    - The Software Differences Between SUSE Linux and SUSE Enterprise Server


    # The Historical Development of UNIX


    At the end of the 1960s, most operating systems were only designed for batch operations.
    If you wanted to run a program, you inserted a pile of punch cards or a roll of
    perforated strips into a reading device and waited until the result was a printer.


    If there was an error in the program or if you did not get the required result,
    you had to rewrite the perforated roll or replace one or several punch cards,
    reread the stack, and wait for the result.


    This procedure was long-winded and inefficient which led computer developers to
    look for a way to allow a number of users to simultaneously use a dialog-oriented
    way of working with the system.


    MULTICS was one of the first programs created to meet this demand. It allowed
    you to work in a dialog with the computer, but it was still strongly influenced
    by the batch operation, and it was difficult to operate.


    In 1969, one of the MULTICS developers, Ken Thompson, began creating an operating
    system that, apart from a dialog-oriented operation, aimed to provide a high functionality
    and structural simplicity.'
  - '[PAGE 24]


    The first version of UNIX was written in Assembler, a programming language close
    to the machine-level. To be machine-independent in its further development, UNIX
    was rewritten in 1971 in the programming language C, developed by Dennis Ritchie.


    Because Bell Laboratories (a subsidiary company of AT&T) provided documentation
    and the source text of UNIX universities almost at cost, the system spread relatively
    quickly.


    The simple operation of the system, the almost unlimited availability of the source
    text, and its relative portability motivated many users and companies to become
    actively engaged in the development, so functionalities were very quickly added
    to UNIX and it reached a very high level of maturity.


    At the same time, a series of commercial UNIX derivatives arose including versions
    from IBM, DEC, and HP (HP-UX, 1982), as well as BSD UNIX (Berkeley Software Distribution,
    1978), developed by the University of California in Berkeley.


    In 1983, AT&T began marketing UNIX System V through its sister company USL, proclaiming
    System V as “the” UNIX standard.


    As a consequence of this, the licensing of UNIX changed considerably, leading
    among other things, a long-lasting legal battle with BSD. At the same time, with
    never-ending quarrels between UNIX vendors, a genuine standardization of the UNIX
    operating system family was prevented.


    Modern UNIX operating systems can still be separated as either more System V or
    more BSD types, although there are no “pure” systems of one or the other kind.


    Linux tries to combine the best from both worlds.'
  - '[PAGE 25]


    As Linux is written in C, it is available for a lot of different

    hardware platforms, including the following:


    +   * Intel/AMD: 32 bit

    * Intel/AMD: 64 bit

    * PowerPC (Macintosh, RS/6000)

    * SPARC (Sun)

    * IBM pSeries

    * IBM zSeries (S/390)

    * Embedded


    # The Development of Linux


    In the spring of 1991, the Finnish student Linus Benedict Torvalds began to develop
    a UNIX-like operating system for his PC.'
