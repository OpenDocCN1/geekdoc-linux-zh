    \ can use the rmdir (remove directory) command to remove the indicated directory\
    \ or directories (e.g., rmdir proposal). The directory or directories must be\
    \ empty before you can delete them.\n\n# Delete Files and Directories with rm\n\
    \nYou can use the command rm (remove) to delete files, as in the following:\n\n\
    ```\nrm part*\n```\n\nThis example deletes all files in the current directory\
    \ that begin with part without asking for confirmation. If the user does not have\
    \ sufficient permissions to delete a file, this file is ignored and an error message\
    \ is printed.\n\n> Files deleted with the command rm cannot be restored.\n\n![](img/428e877abd09b1c11149d179d3458f12_181_0.png)\n\
    \n| Option | Description |\n| --- | --- |\n| -i | Asks for confirmation before\
    \ deleting. |\n| -r | (recursively) Allows full directories to be deleted. |\n\
    | -f | (force) By default rm asks for confirmation if the file that should be\
    \ deleted is read-only. Using this option the files are deleted without asking\
    \ for confirmation. |\n\n# Exercise 5-6 Delete Files and Directories\n\nIn this\
    \ exercise you practice deleting files and directories using the **rmdir** and\
    \ **rm** command.\n\nYou will find this exercise in the workbook.\n\n(End of Exercise)\n\
    \n# Link Files\n\nFile system formats in Linux keep data and administration information\
    \ separate. How data is organized differs from one file system format to another.\n\
    \nEach file is described by an inode (index node or information node). To see\
    \ the inode number you can enter ls -i.\n\nEach of these inodes has a size of\
    \ 128-bytes and contains all information about this file from the file name. This\
    \ includes information such as details of the owner, access permissions, the size,\
    \ various time details (time of modification, time of access, time of modification\
    \ of the inode), and the links to the data blocks of this file.\n\nThe command\
    \ ln creates a link. A link is a reference to a file. Through a link, you can\
    \ access a file from anywhere in the system using different names for it. This\
    \ means that the file itself exists only once on the system, but it can be found\
    \ under different names.\n\nLinux recognizes two kinds of links:\n\n- Hard links\n\
    - Symbolic links\n\nYou create a hard link by using the command ln, which points\
    \ to the inode of an already existing file. Thereafter, the file can be accessed\
    \ under both names—that of the file and that of the link, and you can no longer\
    \ discern which name existed first or how the original file and the link differ.\n\
    \n# SUSE Linux Enterprise Server Fundamentals\n\nThe following is an example of\
    \ using the command ln:\n\n```\ngeeko@da51:~/sell > ls -li\ntotal 4\n88658 -rw-r--r--\
    \ 1 geeko users 82 2004-04-06 14:21 old\ngeeko@da51:~/sell > ln old new\ngeeko@da51:~/sell\
    \ > ls -li\ntotal 8\n88658 -rw-r--r-- 2 geeko users 82 2004-04-06 14:21 old\n\
    88658 -rw-r--r-- 2 geeko users 82 2004-04-06 14:21 new\ngeeko@da51:~/sell > \n\
    ```\n\nHard links can only be used when both the file and the link are in the\
    \ same file system (on the same partition), because inode numbers are unique within\
    \ the same file system.\n\nYou can create a symbolic link with the command ln\
    \ and the option -s. A symbolic link is assigned its own inode—the link refers\
    \ to a file, so a distinction can always be made between the link and the actual\
    \ file.\n\nThe following is an example of creating a symbolic link:\n\n```\ngeeko@da51:~/sell\
    \ > ls -li\ntotal 4\n88658 -rw-r--r-- 1 geeko users 82 2004-04-06 14:21 old\n\
    geeko@da51:~/sell > ln -s old new\ngeeko@da51:~/sell > ls -li\ntotal 4\n88658\
    \ -rw-r--r-- 1 geeko users 82 2004-04-06 14:21 old\n88658 -rw-r--r-- 1 geeko users\
    \ 82 2004-04-06 14:21 new\ngeeko@da51:~/sell > \n```\n\nWith symbolic links, the\
    \ limits of the file system can be overcome. If the file is deleted, the symbolic\
    \ link is broken. If you try to access a broken link, you will get an error message.\n\
    \n# Exercise 5-7 Link Files\n\nIn this exercise, you create a symbolic link and\
    \ a hard link with the `ln` command.\n\nYou will find this exercise in the workbook.\n\
    \n(End of Exercise)\n\n# Objective 6 Find Files\n\nTo search for files on the\
    \ command line, you can use the command **find**. The following is the syntax\
    \ for the command **find**:\n\n```\n**find** \\`**path** \\`**criterion**** \\\
    `**action**\\`\n```\n\nThe command has a multitude of options, a few of which\
    \ are explained here. You can use the following arguments with the command:\n\n\
    - **path**. The section of the file system to search (the specified directory\
    \ and all its subdirectories). If nothing is specified, the file system below\
    \ the current directory is used.\n\n# Graphical Tools\n\nSometimes you need to\
    \ find a file so you can edit it, but you do not know exactly where it is. You\
    \ might know the name of this file or only part of the name. At another time,\
    \ you might need a list of all files that have been modified in the last two days\
    \ or exceed a certain size.\n\nIf you enter search in the application browser,\
    \ two applications are found:\n\n- Nautilus Search Tool (Browse application group).\
    \ The Nautilus file manager is used for searching. This tool allows only to search\
    \ for file names.\n- GNOME Search Tool (System application group). This tool allows\
    \ you to search for information such as file size, date, or file owner.\n\nAfter\
    \ selecting the GNOME Search tool from the application browser, the following\
    \ dialog appears.\n\n# Figure 5-3\n\n![](img/428e877abd09b1c11149d179d3458f12_190_0.png)\n\
    \nIn the Name contains field, enter a part of the file name you want to find.\
    \ Enter the directory you want to search in Look Folder. Select Find to start\
    \ the search process. All matching files and directories are shown in the lower\
    \ window with details of their locations.\n\nFurther settings can be made when\
    \ you open the menu under Select Options. Select a search rule from the pulldown\
    \ Available Options. After selecting **Add**, a new text field is added and you\
    \ can enter the information option needs. To remove a search rule, select **Remove**\
    \ next to the rule.\n\n# Figure 5-4\n\n![](img/428e877abd09b1c11149d179d3458f12_191_0.png)\n"
