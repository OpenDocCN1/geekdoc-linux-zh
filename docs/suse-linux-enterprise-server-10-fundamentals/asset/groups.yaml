    \ Linux 中，这通常是 /bin/bash (Bourne Again Shell)。\n\n该 shell 必须在 /etc/shells 文件中列出。\n\
    \n有关此文件的更多信息，请输入 `man 5 passwd`。\n\n## /etc/shadow\n\n/etc/shadow 文件存储加密的用户密码和密码过期信息。大多数\
    \ Linux 系统使用 shadow 密码。\n\n该文件只能由 root 用户更改，并由 shadow 组的成员读取。以下是 /etc/shadow 的示例：\n\
    \n```\nat::13181:0:99999:7::\nbin::13181:0:99999:7::\ndaemon::13181:0:99999:7::\n\
    ftp::13181:0:99999:7::\ngames::13181:0:99999:7::\ngdm::13181:0:99999:7::\nhaldaen::13181:0:99999:7::\n\
    lp::13181:0:99999:7::\nmail::13181:0:99999:7::\nman::13181:0:99999:7::\nndsd::13181:0:99999:7::\n\
    messagebus::13181:0:99999:7::\nnews::13181:0:99999:7::\nnobody::13181:0:99999:7::\n\
    tp::13181:0:99999:7::\npostfix::13181:0:99999:7::\nroot::13181:0:99999:7::\nsshd::13181:0:99999:7::\n\
    uucp::13181:0:99999:7::\nwwwrun::13181:0:99999:7::\ngeeko::13181:0:99999:7::\n\
    ```\n\n## /etc/group\n\n/etc/group 文件存储组信息。以下是 /etc/group 的示例：\n\n```\nat:25:\n\
    audio:x:17:\nbin:x:1:\ncdrom:x:20:\nconsole:x:21:\ndaemon:x:2:\nftp:x:40:\ngames:x:12:\n\
    gdm:x:50:\nhaldaen:x:101:\nlp:x:4:\nmail:x:8:\nman:x:13:\nndsd:x:78:\nmessagebus:x:101:\n\
    news:x:9:\nnobody:x:103:\ntp:x:74:\npostfix:x:51:\nroot:x:0:\nsshd:x:71:\nuucp:x:10:\n\
    www:x:8:\nvideo:x:33:\nge:\n```\n\n/etc/group 文件中的每一行代表一个组记录，包含组名、GID（组 ID）以及组的成员。例如：\n\
    \n```\nvideo:x:33:geeko\n```\n\n## 8-2 练习 8-2 检查服务器上的用户和组信息\n\n在此练习中，你将记录下某些组的\
