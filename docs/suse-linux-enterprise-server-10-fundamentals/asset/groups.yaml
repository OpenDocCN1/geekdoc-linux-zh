- md: "\n# Network Connections (Sockets)\n\nIn UNIX and some other operating systems,\
    \ a software object that connects an application to a network protocol is called\
    \ a socket. This enables two-way communication between programs on a network.\n\
    \nFor example, a program can send and receive TCP/IP messages by opening a socket\
    \ and reading data from writing data to the socket.\n\nThis simplifies program\
    \ development because the programmer only needs to worry about working with the\
    \ socket and can rely on the operating system to actually transport messages across\
    \ the network correctly.\n\nEach socket gets bound to a given port, which lets\
    \ the transport layer protocol (such as TCP or UDP) identify which application\
    \ to send data to.\n\nFor TCP and UDP protocols, a socket on a host is defined\
    \ as the combination of an IP address and a port number (such as http://192.168.1.1:5801).\n\
    \n![](img/428e877abd09b1c11149d179d3458f12_351_0.png)\n\nAnother type of socket\
    \ used by POSIX compliant systems (called POSIX Local IPC Sockets or simply ipc\
    \ sockets) facilitates interprocess communication. These connections are from\
    \ the local computer to itself, and not a connection over a physical network.\n\
    \n![](img/428e877abd09b1c11149d179d3458f12_351_1.png)\n\nFor details on TCP and\
    \ UDP protocols see “Transmission Control Protocol (TCP)” on B-34 and “User Datagram\
    \ Protocol (UDP)” on B-38.\n\n# Network Services\n\nNetwork services are programs\
    \ that let users share network resources. On a network, nodes use network services\
    \ to communicate using transmission media, such as cables.\n\nNetwork services\
    \ require resources and processing capabilities to accomplish a task, such as\
    \ data processing.\n\nSome examples of network services are CUPS (Common Unix\
    \ Printing System), DNS (for name resolution), and NFS (for network file services).\n\
    \n# TCP/IP Layer Model\n\nOver the years, the functions of networks have grown\
    \ in complexity due to different types of networks needing to be connected and\
    \ the increasing number and requirements of applications.\n\nBecause of this increasing\
    \ complexity, an attempt has been made to combine individual tasks within a network\
    \ into groups and implement them as packages.\n\nIn the network environment, these\
    \ packages are organized as layers stacked on top of each other. The overall model\
    \ is referred to as the layer model.\n\nOne of the best-know layer models is the\
    \ OSI (Open Systems Interconnection) reference model for open systems. In this\
    \ model, a communication system is divided into 7 layers.\n\nHowever, as shown\
    \ in the following comparison, another well-known model, the TCP/IP layer model,\
    \ has only 4 layers:\n\n# Figure B-11\n\n| ISO/OSI Reference Model | TCP/IP Reference\
    \ Model |\n| :--- | --- |\n| Application Layer | Application Layer |\n| Presentation\
    \ Layer | |\n| Session Layer | |\n| Transport Layer | Transport Layer |\n| Network\
    \ Layer | Internet Layer |\n| Data Link Layer | Network Access Layer |\n| Physical\
    \ Layer | |\n\nWith the TCP/IP model, the 3 upper layers of the OSI model are\
    \ combined into the application layer and the two lower layers into the network\
    \ access layer.\n\nThe following describe the layers in the TCP/IP model:\n\n\
    - Network Access Layer\n- Internet Layer\n- Transport Layer\n- Application Layer\n\
    \n# Network Access Layer\n\nIn the TCP/IP layer model, the physical layer and\
    \ the data link layer of the OSI model are combined into the network access layer:\n\
    \nFigure B-12\n\n![](img/428e877abd09b1c11149d179d3458f12_354_0.png)\n\nOne reason\
    \ TCP/IP is so popular that it runs on the different network architectures for\
    \ WANs and LANs, such as the following:\n\n- Ethernet\n- Token bus\n- Token ring\n\
    - ATM (Asynchronous Transfer Mode)\n- FDDI (Fiber Distributed Data Interface)\n\
    \nIt also provides the following solutions via telephone for IP:\n\n- PPP (Point\
    \ to Point Protocol)\n- SLIP (Serial Line Interface Protocol)\n\n# Internet Layer\n\
    \nThe Internet layer of the TCP/IP model ensures the connection between individual\
    \ hosts in the network beyond the limits of individual networks in the Internet:\n\
    \n# Figure B-13\n\n![](img/428e877abd09b1c11149d179d3458f12_355_0.png)\n\nThe\
    \ main tasks of the Internet layer are providing an address space for the Internet,\
    \ routing, and data transfer between end systems (host computers).\n\nThe following\
    \ are protocols of the Internet layer (with IP as the most popular):\n\n- Address\
    \ Resolution Protocol (ARP)\n- Internet Protocol (IP)\n- Internet Control Message\
    \ Protocol (ICMP)\n\n# Address Resolution Protocol (ARP)\n\nARP (Address Resolution\
    \ Protocol) (RFC 826) resolves IP addresses to hardware addresses (MAC addresses,\
    \ Medium Access Control).\n\nThe MAC address is always composed of 6 bytes (in\
    \ hexadecimal notation). The first 3 bytes indicate the manufacturer, and the\
    \ last 3 bytes are the serial number of the network card.\n\nIf there are two\
    \ network cards present, both with the same serial number, you can specify (under\
    \ Linux) which MAC address the network card should use to reply.\n\nAs illustrated\
    \ in the following, a special MAC address (all bits to ff:ff:ff:ff:ff:ff) is used\
    \ for:\n\n# Figure B-14\n\n![](img/428e877abd09b1c11149d179d3458f12_356_0.png)\n\
    \nThe following describes the process:\n\n1. Host A issues an ARP request:\n\n\
    2. Host C replies with an ARP reply:\n\n3. Host A memorizes the reply.\n\n# Internet\
    \ Protocol (IP)\n\nIP provides the following services:\n\n- Providing an address\
    \ space for the Internet\n- Routing\n- Data transfer between end systems (host\
    \ computers)\n\nThe fact that IP is connectionless means it has no mechanisms\
    \ for error detection or correction.\n\nThe following are tasks performed by IP:\n\
    \n- Specifies datagrams\n- Routes, exchanges and transfers\n- Fragments and assembles\
    \ datagrams\n\nThe following shows how the header is constructed:\n\n# Figure\
    \ B-15\n\n![](img/428e877abd09b1c11149d179d3458f12_358_0.png)\n\nThe following\
    \ describes the elements of the IP header:\n\n- Version (4 bits): Specifies the\
    \ format of the IP header.\n- IHL (Internet Header Length, 4 bits): Specifies\
    \ the length of the IP header.\n- TOS (Type of Services, 8 bits): Specifies the\
    \ parameters for the type of service requested, such as priority, reliability,\
    \ and cost.\n- Total length (16 bits): Contains the length of the datagram.\n\
    - Identification (16 bits): Identifies the fragments of one datagram from others.\n\
    - Flags (3 bits):\n    - R (Reserved, 1 bit)\n    - DF (Don't Fragment, 1 bit):\
    \ Controls the fragmentation of the datagram.\n    - MF (More Fragments, 1 bit):\
    \ Indicates if the datagram contains additional fragments.\n- Fragment Offset\
    \ (13 bits): Used to direct the reassembly of a fragmented datagram.\n- TTL (Time\
    \ To Live, 8 bits): Used to track the lifetime of the datagram.\n- Protocol (8\
    \ bits): Specifies the next encapsulated protocol (such as ICMP, TCP, UDP).\n\
    - Header Checksum (16 bits): Specifies the checksum of the IP header and options.\n\
    - Source Address (32 bits): Specifies the IP address of the sender.\n- Destination\
    \ Address (32 bits): Specifies the IP address of the intended receiver.\n- Options:\
    \ Of variable length.\n- Padding (variable length): Used as a filter to guarantee\
    \ that the data starts at the 32 bit boundary.\n"
  mdcn: "\n\n# 网络连接（套字）\n\n在 UNIX 和某些其他操作系统中，连接应用程序与网络协议的软件对象称为套字（socket）。这使得网络上的程序能够进行双向通信。\n\
    \n例如，程序可以通过打开套字并从向套字写入或读取数据来发送和接收 TCP/IP 消息。\n\n这简化了程序开发，因为程序员只需要关注与套字的操作，而可以依靠操作系统在实际上跨网络正确地传输消息。\n\
    \n每个套字都会绑定到特定的端口，这使得传输层协议（如 TCP 或 UDP）能够识别出将数据发送到哪个应用程序。\n\n对于 TCP 和 UDP 协议，主机上的套字定义为\
    \ IP 地址和端口号的组合（例如 http://192.168.1.1:5801）。\n\n![](img/428e877abd09b1c11149d179d3458f12_351_0.png)\n\
    \nPOSIX 兼容系统使用的另一种类型的套字（称为 POSIX 本地 IPC 套字或简单的 ipc 套字）促进了进程间的通信。这些连接是本地计算机到自身的连接，而不是跨物理网络的连接。\n\
    \n![](img/428e877abd09b1c11149d179d3458f12_351_1.png)\n\n有关 TCP 和 UDP 协议的详情，请参阅\
    \ B-34 页“传输控制协议 (TCP)”和 B-38 页“用户数据报协议 (UDP)”。\n\n# 网络服务\n\n网络服务是允许用户共享网络资源的程序。在网络上，节点使用传输媒体（如电缆）进行通信。\n\
    \n网络服务需要资源和处理能力来完成任务，例如数据处理。\n\n网络服务的示例包括 CUPS（通用 Unix 打印系统）、DNS（用于名称解析）和 NFS（用于网络文件服务）。\n\
    \n# TCP/IP 层模型\n\n多年来，由于不同类型的网络需要连接，以及应用程序数量和需求的增加，网络的功能变得越来越复杂。\n\n由于这种复杂性的增加，人们尝试将网络中的单个任务分组，并将它们作为包进行实现。\n\
    \n在网络环境中，这些包被组织成层层堆叠的层。整个模型被称为分层模型。\n\n最为人知的层模型之一是开放系统的 OSI（开放系统互连）参考模型。在该模型中，通信系统被分为\
    \ 7 层。\n\n然而，如下面的比较所示，另一个著名的模型 TCP/IP 层模型只有 4 层：\n\n# 图 B-11\n\n| ISO/OSI 参考模型\
    \ | TCP/IP 参考模型 |\n| :--- | --- |\n| 应用层 | 应用层 |\n| 表示层 | |\n| 会话层 | |\n| 传输层\
    \ | 传输层 |\n| 网络层 | 互联网层 |\n| 数据链路层 | 网络接入层 |\n| 物理层 | |\n\n在 TCP/IP 模型中，OSI 模型的上\
    \ 3 层合并为应用层，将下 2 层合并为网络接入层。\n\n以下描述了 TCP/IP 模型中的各个层级：\n\n- 网络接入层\n- 互联网层\n- 传输层\n\
    - 应用层\n\n# 网络接入层\n\n在 TCP/IP 层模型中，OSI 模型的物理层和数据链路层合并为网络接入层：\n\n图 B-12\n\n![](img/428e877abd09b1c11149d179d3458f12_354_0.png)\n\
    \nTCP/IP 如此流行的原因之一是它可以在不同的广域网（WAN）和局域网（LAN）网络架构上，例如：\n\n- 以太网\n- 令牌总线\n- 令牌环\n\
    - ATM（异步传输模式）\n- FDDI（光纤分布式数据接口）\n\n它还通过电话为 IP 提供以下解决方案：\n\n- PPP（点对点协议）\n- SLIP（链路接口协议）\n\
    \n# 互联网层\n\nTCP/IP 模型的互联网层确保了网络中单个主机之间的连接，突破了互联网中单个网络的限制：\n\n# 图 B-13\n\n![](img/428e877abd09b1c11149d179d3458f12_355_0.png)\n\
    \n互联网层的主要任务是为互联网提供地址空间、路由以及端系统（主机计算机）之间的数据传输。\n\n以下是互联网层的协议（以 IP 最常用）：\n\n- 地址解析协议\
    \ (ARP)\n- 互联网协议 (IP)\n- 互联网控制消息协议 (ICMP)\n\n# 地址解析协议 (ARP)\n\nARP（地址解析协议）(RFC\
    \ 826) 将 IP 地址解析为硬件地址（MAC 地址，介质访问控制）。\n\nMAC 地址始终由 6 个字节（十六进制表示）组成。前 3 个字节表示制造商，后\
    \ 3 个字节是网卡的序列号。\n\n如果存在两个网卡且序列号均相同，你可以（在 Linux 下）指定网卡应使用哪个 MAC 地址进行响应。\n\n如下所示，特殊的\
    \ MAC 地址（所有位均为 ff:ff:ff:ff:ff:ff）被用于：\n\n# 图 B-14\n\n![](img/428e877abd09b1c11149d179d3458f12_356_0.png)\n\
    \n以下描述了该过程：\n\n1. 主机 A 发出 ARP 请求：\n\n2. 主机 C 回复：\n\n3. 主机 A 记录回复。\n\n# 互联网协议 (IP)\n\
    \nIP 提供以下服务：\n\n- 为互联网提供地址空间\n- 路由\n- 端系统（主机计算机）之间的数据传输\n\nIP 是无连接的，这一事实意味着它没有错误检测或纠正机制。\n\
    \n以下是 IP 执行的任务：\n\n- 指定数据报\n- 路由、交换和传输\n- 分片和重组数据报\n\n以下显示了头部的构建方式：\n\n# 图 B-15\n\
    \n![](img/428e877abd09b1c11149d179d3458f12_358_0.png)\n\n以下描述了 IP 头部元素：\n\n- 版本（4位）：指定\
    \ IP 头部格式。\n- IHL（网头部长度，4位）：指定 IP 头部长度。\n- TOS（服务类型，8位）：指定请求的服务类型参数，如优先级、可靠性和成本。\n\
    - 总长度（16位）：包含数据报的长度。\n- 标识（16位）：区分一个数据报的片段。\n- 标志（3位）：\n    - R（预留，1位）\n    -\
    \ DF（不分片，1位）：控制数据报的分片。\n    - MF（更多分片，1位）：指示数据报是否包含后续分片。\n- 分片偏移（13位）：用于指导分片数据报的重组。\n\
    - TTL（生存时间，8位）：用于跟踪数据报的寿命。\n- 协议（8位）：指定下一个封装的协议（如 ICMP、TCP、UDP）。\n- 头部校验和（16位）：指定\
    \ IP 头部和选项的校验和。\n- 源地址（32位）：指定发送者的 IP 地址。\n- 目的地址（32位）：指定目标接收者的 IP 地址。\n- 选项：长度变。\n\
    - 填充（长度变）：用作过滤器以保证数据从 32 位边界处开始。\n\n"
