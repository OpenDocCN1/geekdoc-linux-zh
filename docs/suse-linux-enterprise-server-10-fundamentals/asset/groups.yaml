    # 目标 | 摘要


    3. 了解常用的命令行任务


    命令中使用了两种类型的变量：


    - 环境变量影响从 shell 启动的程序的行为。

    - Shell 变量控制 shell 本身的行为。


    可以使用 **echo** 命令查看变量的值。


    定义别名（aliases）可以让你为命令及其选项创建快捷方式，或者创建具有完全不同名称的命令。


    对于指定的每个命令，输入 `type` 会告诉你是它是内置的 shell 命令、函数还是别名。


    大多数在系统范围内使用的别名都定义在 `/etc/bash.bashrc` 文件中。


    别名（aliases）通过 **alias** 命令定义，并可以使用 **unalias** 命令删除。


    要使别名持久化，你需要将定义存储在 shell 的一个配置文件中。在 SUSE Linux Enterprise Server 上，会创建一个名为 **~/.alias**
    的文件，用于存储每个用户定义的个人别名。


    # 目标

    # 摘要


    | 4. 理解命令语法和特殊字符 | 使用 `locale` 命令获取本地化变量列表。 |

    若要对系列文件进行操作而无需命名所有文件，你可以使用各种搜索模式：\n* ?: 代表任意字符（"" 除外）\n* *: 代表 0 或多个字符（文件名开头的
    "" 和 "/" 除外）\n* [a-z]: a-z 范围内的一个字符。\n* [ek-s]: a-e 和 k-s 范围内的字符。\n* [abcdef]:
    这些字符中的任意一个。\n* [labc]: 不属于这些字符的字符。\n为了防止 shell 解释命令行中的特殊字符，必须对这些字符进行“转义”：\n* \:
    反斜杠保护后续一个字符。\n* "": 双引号保护除了 "$, \", 和 ""（反引号）之外的所有特殊字符。\n* '''': 除了正则表达式外，单引号用于保护变量。
    |


    # 目标 摘要

    # 摘要


    - 5. 使用管道和重定向


    Linux 有三个标准数据通道：


    - 0: 标准输入 (stdin)

    - 1: 标准输出 (stdout)

    - 2: 标准错误 (stderr)


    每个通道都可以被重定向：


    - <: 重定向标准输入。

    - >, 1 或 >>: 重定向标准输出。

    - 2>: 重定向标准错误输出。


    可以通过输入命令 `cat filename` 来显示文件内容。


    使用管道 (|)，可以将一个命令的输出作为另一个命令的输入。


    `tee` 命令可以用于分割标准输出。


    # 第 7 节 使用 Linux 文本编辑器


    文本编辑器是 Linux 系统管理员使用的最重要的工具之一。本节介绍了一个图形化文本编辑器和一个命令行编辑器。


    # 目标


    - 1. 了解 Linux 文本编辑器

    - 2. 使用 vi 编辑器编辑文件


    # 目标 1 了解 Linux 文本编辑器


    由于 Linux 的大部分服务都是通过编辑 ASCII 文件配置的，因此你需要文本编辑器。Linux 中有很多文本编辑器可用，例如：


    - vi

    - emacs

    - xedit

    - gedit

    - kwrite


    每个文本编辑器都有其优缺点。编辑器分为两种：


    - 命令行编辑器

    - 图形化编辑器


    命令行编辑器的主要优势是使用它们时不需要图形用户界面。


    图形化编辑器（通常）易于使用，且不需要复杂的解释。例如 gedit 编辑器，可以从主菜单（应用程序组）的“工具”中启动。


    # 图 7-1


    ![](img/428e877abd09b1c11149d179d3458f12_246_0.png)


    在本节中我们将详细描述 vi 编辑器，因为它是 Linux 系统上最重要的文本编辑器。


    # 目标 2 使用编辑器编辑文件


    命令行编辑器的优势是，你可以在没有安装图形桌面环境的情况下使用它们。Linux 提供了大量的命令行编辑器。最常用的编辑器是：


    - vi

    - emacs


    虽然在选择日常使用的编辑器时可能涉及许多因素，但大多数管理员使用 vi 的原因是它在每个 Linux 和 UNIX 系统上都是可用的。因此，你应该学会使用
    vi。


    在 SUSE Linux Enterprise Server 中，由 Bram Molenaar 开发的 vim（vi 的改进版）是标准的 vi 编辑器。当你输入
    vi 时，系统通过一个链接启动了 vim。


    在本目标中，你将学习如何执行以下操作：


    - 启动 vi

    - 使用 vi 编辑器

    - 学习工作模式


    # 启动 vi


    你可以通过输入 `vi` 或 `vim`，后跟各种选项以及要编辑的文件名来启动 vi，如下例所示：


    `vi exercise`


    如果文件不存在，则会创建它。文件的内容将出现在命令行编辑器器中：


    # 图 7-2


    ![](img/428e877abd09b1c11149d179d3458f12_248_0.png)


    符号“~”表示不存在的行。光标位于第一行。


    # 使用 vi 编辑器


    你可以使用 k, j, h 和 l 键来移动光标（k 向上一行，j 向下一行，h 向左，l 向右），或使用方向键（向上箭头、向下箭头、向左箭头、向右箭头）。


    # 学习工作模式


    与许多其他编辑器不同，vi 是模式导向的。当 vi 启动时，处于命令模式。在命令模式下，vi 接受命令。按下 `i` 进入插入模式。在插入模式下可以输入文本。按下
    `Esc` 返回到命令模式。按下 `:` 进入命令行模式。


    除了切换模式外，你还学习哪些按键可以执行哪些操作。这对于不熟悉 vi 的用户来说可能是困难的。


    以下是可用模式的总结：


    - **命令模式**: vi 启动时自动处于此模式。在命令模式下，vi 接受命令。按下 `i` 进入插入模式，按下 `:` 进入命令行模式。

    - **插入模式**: 在此模式下，vi 接受所有输入。按下 `Esc` 返回命令模式。

    - **命令行模式**: 在此模式下，vi 接受来自命令行的命令。Enter 执行命令并自动返回命令模式。


    在命令模式下可以使用以下命令：


    | 命令 | 结果 |

    | --- | --- |

    | i | 将 vi 切换到插入模式。 |

    | x | 删除光标所在的字符。 |

    | dd | 删除当前行并复制到缓冲区。 |

    | D | 删除从光标位置到当前行的剩余部分。 |

    | yy | 将当前行复制到缓冲区。 |

    | p, P | 在光标之后或之前插入缓冲区的内容。 |

    | zz | 保存当前文件并退出 vi。 |

    | u | 撤销上一次操作。 |

    | /pattern | 从光标位置向前搜索模式。 |

    | ?pattern | 从光标位置向后搜索模式。 |

    | n | 按相同方向重复搜索。 |

    | N | 按相反方向重复搜索。 |


    如果你想对多个单元使用命令，请在命令前放置相应的数字。例如，3x 删除三个字符，5dd 删除五行，7yy 将七行复制到缓冲区。


    | 表 7-2 命令 | 结果 |

    |--- |--- |

    | :q | 退出 vi（如果未进行更改）。 |

    | :q! | 不保存文件中的更改退出 vi。 |

    | :wq 或 :x | 保存当前文件并退出 vi。 |

    | :w | 保存当前文件。 |

    | :w file | 将当前文件保存为 file。（注意：你继续编辑原始文件，而不是新文件。） |


    如果你想配置 vi，需要编辑文件 ~/.vimrc。默认情况下，该文件不存在。


    '
