    [content]

    # Howtos


    You can find additional information (including background material) in the howtos.
    There is a howto for almost every imaginable topic in Linux.


    On SUSE Linux Enterprise Server 10 the howtos are not installed by default, but
    you can install them manually later.


    The howtos are also available in different formats, such as ASCII, PostScript,
    and HTML. In addition, many of the howtos have been translated into various languages.


    SUSE Linux Enterprise Server installation media contain a large number of howtos.
    The howtos of the Linux Documentation Project (TLDP) in HTML format are installed
    in the directory /usr/share/doc/howto/en/html/.


    You can also install the howtos in ASCII format (package howto, ASCII format).
    After installation, you can find them in the directory /usr/share/doc/howto/en/txt/.


    You can find a list of all current howtos (together with available translations)
    at http://www.tldp.org.


