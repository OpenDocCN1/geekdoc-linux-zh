- md: '

    Following is an example of using some of these search patterns:


    ```

    geeko@da51:/usr/X11/bin > ls xc*

    calc xclibboard xclock xcmsdb xconsole xcursorsgen xutsel

    geeko@da51:/usr/X11/bin > ls [alo]*

    calc xclibboard xclock xconsole

    geeko@da51:/usr/X11/bin > ls xc[!o]*

    calc xclibboard xclock xcmsdb xcursorsgen xutsel

    geeko@da51:/usr/X11/bin > ls xc*1*

    calc xclibboard xclock xconsole

    ```


    If search patterns (wild cards) are given on the command line, the shell tries
    to compare these with the filenames in the file system and, if they match, the
    expression is replaced with all the filenames found.


    # Prevent the Shell from Interpreting Special Characters


    To prevent the shell from interpreting special characters in the command line,
    these characters must be “masked” by using the following:


    - \: The backslash protects one character from being interpreted by the shell,
    as in the following:


    ```

    geeko@da51:- > mkdir new\ directory

    geeko@da51:- >

    ```


    - ". Double quotes protect all special characters except $, \ and ` (back tick)
    from being interpreted by the shell, as in the following:


    ```

    geeko@da51:- > echo Home = $HOME

    Home = /home/geeko

    geeko@da51:- > echo "Home" $HOME

    Home = /home/geeko

    geeko@da51:- >

    ```


    - • Apart from regular expressions, variables are also protected with single quotes,
    as in the following:


    ```

    geeko@da51:-~ > echo ''Home'' = $HOME''

    Home = $HOME

    geeko@da51:- >

    ```


