    # Link Files


    File system formats in Linux keep data and administration information separate.
    How data is organized differs from one file system format to another.


    Each file is described by an inode (index node or information node). To see the
    inode number you can enter ls -i.


    Each of these inodes has a size of 128-bytes and contains all information about
    this file from the file name. This includes information such as details of the
    owner, access permissions, the size, various time details (time of modification,
    time of access, time of modification of the inode), and the links to the data
    blocks of this file.


    The command ln creates a link. A link is a reference to a file. Through a link,
    you can access a file from anywhere in the system using different names for it.
    This means that the file itself exists only once on the system, but it can be
    found under different names.


    Linux recognizes two kinds of links:


    +   - Hard links


    +   - Symbolic links


    You create a hard link by using the command ln, which points to the inode of an
    already existing file. Thereafter, the file can be accessed under both names—that
    of the file and that of the link, and you can no longer discern which name existed
    first or how the original file and the link differ.'
  - '[PAGE 185]


    # SUSE Linux Enterprise Server Fundamentals


    The following is an example of using the command ln:


    ```

    ```geeko@da51:~/sell > ls -li

    total 4

    88658 -rw-r--r-- 1 geeko users 82 2004-04-06 14:21 old

    geeko@da51:~/sell > ln old new

    geeko@da51:~/sell > ls -li

    total 8

    88658 -rw-r--r-- 2 geeko users 82 2004-04-06 14:21 old

    88658 -rw-r--r-- 2 geeko users 82 2004-04-06 14:21 new

    geeko@da51:~/sell >\```

    ```


    Hard links can only be used when both the file and the link are in the same file
    system (on the same partition), because inode numbers are unique within the same
    file system.


    You can create a symbolic link with the command ln and the option -s. A symbolic
    link is assigned its own inode—the link refers to a file, so a distinction can
    always be made between the link and the actual file.


    The following is an example of creating a symbolic link:


    ```

    ```geeko@da51:~/sell > ls -li

    total 4

    88658 -rw-r--r-- 1 geeko users 82 2004-04-06 14:21 old

    geeko@da51:~/sell > ln -s old new

    geeko@da51:~/sell > ls -li

    total 4

    88658 -rw-r--r-- 1 geeko users 82 2004-04-06 14:21 old

    88657 lrxwrwxx 1 geeko users 3 2004-04-06 14:27 new ->

    old

    geeko@da51:~/sell >\```

    ```


    With symbolic links, the limits of the file system can be overcome, because the
    name of the object is shown, not the object itself. The disadvantage is that a
    symbolic link can point to a non-existing object if the object and its corresponding
    name no longer exist.'
  - '[PAGE 186]


    If you erase the file old in the above example, new will point to a non-existing
    file. You can not see in the ls output, that the link is broken:


    ```

    geeko@da51:~/sell > rm old

    geeko@da51:~/sell > ls -li

    total 0

    88657 lrwxrwxrwx 1 geeko users 3 2004-04-06 14:27 new ->

    old

    geeko@da51:~/sell >

    ```


    An advantage of symbolic links is that you can create links to directories.'
