- md: "\n# Course Objectives\n\nThis course teaches you the following concepts and\
    \ skills fundamental to understanding SUSE Linux Enterprise Server 10:\n\n- Understand\
    \ the Linux story\n- Use the Linux desktop\n- Manage the network configuration\n\
    - Manage software packages\n- Locate and use help resources\n- Manage directories\
    \ and files\n- Work with the command line\n- Use Linux text editors\n- Manage\
    \ user, groups and permissions\n\nThese are fundamental and prerequisite to learning\
    \ the skills of an entry level SUSE Linux administrator or help desk technician\
    \ in an enterprise environment.\n\n# Audience\n\nWhile the primary audience for\
    \ this course are administrators who are interested in Linux, certification candidates\
    \ with experience in other operating systems can also use this course to begin\
    \ preparing for the Novell CLP 10 Practicum.\n\n# Certification and Prerequisites\n\
    \nThis course helps you prepare for the Novell Certified Linux Professional 10\
    \ (Novell CLP 10) Practical Test, called a practicum. The Novell CLP 10 is the\
    \ administrator-level certification for SUSE Linux Enterprise Server 10.\n\nAs\
    \ with all Novell certifications, course work is recommended. To achieve the certification,\
    \ you are required to pass the Novell CLP 10 Practicum (050-697).\n\nThe Novell\
    \ CLP 10 Practicum is a hands-on, scenario-based exam where you apply the knowledge\
    \ you have learned to solve real-life problems—demonstrating that you know what\
    \ to do and how to do it.\n\nThe practicum tests you on objectives in this course\
    \ (SUSE Enterprise Server Fundamentals - Course 3071) and the skills outlined\
    \ in the following Novell CLP 10 courses:\n\n- SUSE Linux Enterprise Server 10\
    \ Administration - Course 3072\n- SUSE Linux Enterprise Server 10 Advanced Administration\
    \ - Course 3073\n\n# SUSE Linux Enterprise Server 10 Fundamentals\n\nThe following\
    \ illustrates the training/testing path for Novell CLP 10:\n\n## Figure Intro-1\
    \ .\n\n![](img/428e877abd09b1c11149d179d3458f12_15_0.png)\n\nIntro-4\n\nCopying\
    \ all or part of this manual, or distributing such copies, is strictly prohibited.\
    \ To report suspected copying, please call 1-800-PIRATES.\n\nVersion 1\n\nFor\
    \ more information about Novell certification programs and taking the Novell CLP\
    \ 10 Practicum, see http://www.novell.com/training/certinfo, http://www.novell.com/training/certinfo/clp10,\
    \ and http://www.novell.com/training/certinfo/cle10.\n\n# SUSE Linux Enterprise\
    \ Server 10 Support and Maintenance\n\nThe copy of SUSE Linux Enterprise Server\
    \ 10 you receive in your student kit is a fully functioning copy of the SUSE Linux\
    \ Enterprise Server 10 product.\n\nHowever, to receive official support and maintenance\
    \ updates, you need to do one of the following:\n\n- Register for a free registration/serial\
    \ code that provides you with 30 days of support and maintenance.\n- Purchase\
    \ a copy of SUSE Linux Enterprise Server 10 from Novell (or an authorized dealer).\n\
    \nYou can obtain your free 30-day support and maintenance code at http://www.novell.com/products/linuxenterpriseserver/eval.html.\n\
    \nYou will need to have or create a Novell login account to access the 30-day\
    \ evaluation.\n\n# Novell Customer Center\n\nNovell Customer Center is an intuitive,\
    \ web-based interface that helps you to manage your business and technical interactions\
    \ with Novell. Novell Customer Center consolidates access to information, tools\
    \ and services such as:\n\n- Automated registration for new SUSE Linux Enterprise\
    \ products\n- Patches and updates for all shipping Linux products from Novell\n\
    - Order history for all Novell products, subscriptions and services\n- Entitlement\
    \ visibility for new SUSE Linux Enterprise products\n- Linux subscription-renewal\
    \ status\n- Subscription renewals via partners or Novell\n\nFor example, a company\
    \ might have an administrator who needs to download SUSE Linux Enterprise software\
    \ updates, a purchaser who wants to review the order history and an IT manager\
    \ who has to reconcile licensing. With Novell Customer Center, the company can\
    \ meet all these needs in one location and give each user access rights appropriate\
    \ to their roles.\n\nYou can access the Novell Customer Center at http://www.novell.com/center.\n\
    \n# SUSE Linux Enterprise Server 10 Online Resources\n\nNovell provides a variety\
    \ of online resources to help you configure and implement SUSE Linux Enterprise\
    \ Server 10.\n\nThese include the following:\n\n- http://www.novell.com/products/linuxenterpriseserver/\n\
    \  This is the Novell home page for SUSE Linux Enterprise Server 10.\n\n- http://www.novell.com/documentation/sles10/index.html\n\
    \  This is the Novell Documentation web site for SUSE Linux Enterprise Server\
    \ 10.\n\n- http://support.novell.com/linux/\n  This is the home page for all Novell\
    \ Linux support, and includes links to support options such as the Knowledgebase,\
    \ downloads, and FAQs.\n\n- http://www.novell.com/coolsolutions\n  This Novell\
    \ web site provides the latest implementation guidelines and suggestions from\
    \ Novell on a variety of products, including SUSE Linux.\n\n# Agenda\n\nThe following\
    \ is the agenda for this 3-day course:\n\n| Day | Section | Duration |\n| ---\
    \ | --- | --- |\n| Day 1 | Introduction | 00:30 |\n| | Section 1: Understand the\
    \ Linux Story | 01:30 |\n| | Section 2: Use the Linux Desktop | 01:30 |\n| | Section\
    \ 3: Administer Linux with YaST | 02:30 |\n| Day 2 | Section 4: Locate and Help\
    \ Help Resources | 01:00 |\n| | Section 5: Manage Directories and Files | 05:00\
    \ |\n| Day 3 | Section 6: Work with the Linux Shell and Command Line | 02:30 |\n\
    | | Section 7: Use Linux Text Editors | 00:30 |\n| | Section 8: Manage Users,\
    \ Groups, and Permissions | 03:00 |\n\n# Scenario\n\nYou are system administrator\
    \ for your Digital Airlines office. The management is considering migration of\
    \ some network services to SUSE Linux Enterprise Server 10 servers.\n\nAs system\
    \ administrator, you decide to do the following:\n\n- Install SUSE Linux Enterprise\
    \ Server 10 on a test workstation.\n- Become familiar with the graphical user\
    \ interface and the command line interface.\n- Learn how to integrate your SUSE\
    \ Linux Enterprise Server into an existing network.\n- Learn how to get help for\
    \ all problems you might have.\n- Learn how to manage software packages with the\
    \ configuration tool YaST2.\n- Learn how to edit configuration files with a graphical\
    \ editor or the command line editor vi.\n- Understand the structure of the Linux\
    \ file system and basic shell commands for working in the file system (e.g. copying,\
    \ moving).\n- Learn how to manage users, groups and file permissions to ensure\
    \ a basic file system security.\n\nOnce you complete this training, you will be\
    \ able to install SUSE Linux Enterprise Server 10 and set up a system for further\
    \ tests.\n\n# Exercise Conventions\n\nWhen working through an exercise, you will\
    \ see conventions that indicate information you need to enter that is specific\
    \ to your server.\n\nThe following describes the most common conventions:\n\n\
    - *italicized/bolded text*. This is a reference to your unique situation, such\
    \ as the host name of your server.\n\nFor example, if the host name of your server\
    \ is DA50, and you see the following:\n`hostname.digitalairlines.com`\n\nyou would\
    \ enter\n`DA50.digitalairlines.com`\n*10.0.0.xx*. This is the IP address that\
    \ is assigned to your SUSE Linux Enterprise Server 10 server.\n\nFor example,\
    \ if your IP address is 10.0.0.50, and you see the following\n`10.0.0.xx`\nyou\
    \ would enter\n`10.0.0.50`\n*Select*. The word select is used in exercise steps\
    \ to indicate a variety of actions including clicking a button on the interface\
    \ and selecting a menu item.\n*Enter and Type*. The words enter and type have\
    \ distinct meanings.\n\nThe word enter means to type text in a field or at a command\
    \ line and press the Enter key when necessary. The word type means to type text\
    \ without presenting the Enter key.\n\nIf you are directed to type a value, make\
    \ sure you do not press the Enter key or you might activate a process that you\
    \ are not ready to start.\n\n# SECTION 1 Understand the Linux Story\n\nThis section\
    \ provides background information about Linux and guides you through an installation\
    \ of SUSE Linux Enterprise Server 10.\n\n# Objectives\n\n 1. The History of Linux\n\
    2. Understand the Multiuser Environment\n3. Perform a Simple Installation of SUSE\
    \ Linux Enterprise Server 10\n"
  mdcn: "\n\n# 课程目标\n\n本课程将教你以下对于理解 SUSE Linux Enterprise Server 10 基础的概念和技能：\n\n\
    - 理解 Linux 的故事\n- 使用 Linux 桌面\n- 管理网络配置\n- 管理软件包包\n- 定位并使用帮助资源\n- 管理目录和文件\n- 使用命令行工作\n\
    - 使用 Linux 文本编辑器\n- 管理用户、组和权限\n\n这些是学习在企业环境中初级 SUSE Linux 管理员或帮助台技术人员技能的基础和先决条件。\n\
    \n# 目标读者\n\n虽然本课程的主要受众是对 Linux 感兴趣的管理员，但具有其他操作系统经验的认证候选人也可以通过本课程开始准备 Novell CLP\
    \ 10 Practical上机考试（Practicum）。\n\n# 认证与先决条件\n\n本课程帮助你准备 Novell Certified Linux\
    \ Professional 10 (Novell CLP 10) 实践测试，该测试被称为实操考试。Novell CLP 10 是针对 SUSE Linux\
    \ Enterprise Server 10 的管理员级认证。\n\n与所有 Novell 认证一样，建议完成课程学习。要获得该认证，你需要通过 Novell\
    \ CLP 10 实操考试 (050-697)。\n\nNovell CLP 10 实操考试是一场基于场景的实际上手考试，你将应用所学的知识来解决现实问题——证明你知道做什么以及如何做。\n\
    \n实操考试将测试你在本课程中的目标（SUSE Enterprise Server Fundamentals - 课程 3071）以及在以下 Novell\
    \ CLP 10 课程中概述的技能：\n\n- SUSE Linux Enterprise Server 10 管理 - 课程 3072\n- SUSE Linux\
    \ Enterprise Server 10 高级管理 - 课程 3073\n\n# SUSE Linux Enterprise Server 10 基础\n\
    \n以下说明了 Novell CLP 10 的培训/测试路径：\n\n## 图 Intro-1 .\n\n![](img/428e877abd09b1c11149d179d3458f12_15_0.png)\n\
    \nIntro-4\n\n严禁复制本手册的全部或部分内容或分发此类副本。如怀疑有抄袭，请致电 1-800-PIRATES。\n\n版本 1\n\n有关有关\
    \ Novell 认证计划和参加 Novell CLP 10 实操考试的更多信息，请访问 http://www.novell.com/training/certinfo，http://www.novell.com/training/certinfo/clp10，以及\
    \ http://www.novell.com/training/certinfo/cle10。\n\n# SUSE Linux Enterprise Server\
    \ 10 支持与维护\n\n你在学生包中收到的 SUSE Linux Enterprise Server 10 副本是 SUSE Linux Enterprise\
    \ Server 10 产品的完整功能副本。\n\n然而，为了获得官方支持和维护更新，你需要执行以下操作之一：\n\n- 注册免费的序列号，该代码将为你提供\
