    geeko@da51:-> grep "(b|B)lurb" file*

    geeko@da51:-> egrep "(b|B)lurb" file*

    file1:blurb

    file2:Blurb

    ```


    The following are options you can use with the command grep:


    # Table 5-20


    | Option | Description |

    | --- | --- |

    | -i | Ignores case. |

    | -l | Shows only the names of files that contain the search string. |

    | -r | Searches entire directory recursively. |

    | -v | Gives all lines that do not contain the search string. |

    | -n | Shows the line numbers. |

    | -h | Shows no file names. |


    ## Use Regular Expressions


    Regular expressions are strings consisting of metacters and literals (regular
    characters and numerals). In the context of regular expressions, meta characters
    are those characters that do not represent themselves but special meanings.


    They can act as placeholders for other characters or can be used to indicate a
    position in a string.


    Many commands (such as egrep) rely on regular expressions for pattern matching.
    It is important to remember, however, that some metacters used by the shell for
    filename expansion have a meaning different from the one discussed here.


    To learn more about the structure of regular expressions, read the corresponding
    manual page with man 7 regex.


    The following table presents the most important meta characters and their meanings:


    # Table 5-21


    | Character | Meaning | Example |

    | --- | --- | --- |

    | ^ | Beginning of the line | ^The: The is matched at the beginning of the line
    |

    | $ | End of the line | eighty$: eighty is matched if the end of the line |

    | \ | Beginning of the word | \<thing>:matches the whole word thing |

    | \ | End of the word | \<thing>:matches the whole word thing |

    | [abc] | One character from the set | [abc]: matches any one of "a", "b", or
    "c" |

    | [0-9] | Any one from the specified range | [0-9]: matches any number from "0"
    to "9" |

    | [-+:] | | any one of "-", ", or "+" |

    | [xyz] | None of the characters | ^xyz]: "x", "y", and "z" are matched |

    | | Any single character | file.* matches file1 and file2, but not10 |

    | + | One or more of the preceding expression | [0-9]+: matches any number |

    | * | Any number (including none) of preceding single character | file.* matches
    file1, file2, and file10 |


    | Table 5-21 | Character | Meaning | Example |

    |---|---|---|---|

    | {min,max} | The preceding expression min times at minimum and max times at maximum
    | [0-9]{1,5}: matches any one-digit to five-digit number |

    | | | The expression before or after | file|File: matches file and File |

    | (...) | Enclose alternatives for grouping with others | (f|F)ile: matches file
    and File |

    | \? | Zero or one of the preceding | file1|?: matches both file2 and file12 |

    | \ | Escape the following character to remove its special meaning | www\\.com:
    matches www.novell.com, literally (with the dot not being treated as metacharacter);
    this is also necessary for parentheses, e.g., matching a parenthetical pattern
    would require the expression \([a-zA-Z]+) |


