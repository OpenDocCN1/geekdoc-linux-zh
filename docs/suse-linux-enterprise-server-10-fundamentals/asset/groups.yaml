  - "[PAGE 275]\n\nNote the following about the fields in each line:\n\n+   - **User\
    \ name.** This is the name a user enters to log in to the system (login name).\n\
    \n+   - **Password.** The x in this field means that the password is stored in\
    \ the file /etc/shadow.\n\n+   - **UID.** In compliance with the Linux standards,\
    \ there are three number ranges which are reserved:\n  - 00–99 for the system\
    \ itself\n  - 100–499 for special system users (such as services and programs)\n\
    \  - Normal users start from UID 1000.\n\n+   - **GID.** Number of the group.\
    \ In compliance with the Linux standards, there are two number ranges which are\
    \ reserved:\n  - 00–99 for special system groups (such as services and programs)\n\
    \  - Normal groups start from GID 100.\n\n+   - **Comments field.** Normally,\
    \ the full name of the user is stored here. Information such as a room number\
    \ or telephone number can also be stored here.\n\n+   - **Home directory.** The\
    \ personal directory of the user is normally in the directory /home and has the\
    \ same name as the user (login name).\n\n+   - **Login shell.** This is the shell\
    \ that is started for a user after he has successfully logged in. In Linux this\
    \ is normally /bin/bash (Bourne Again Shell).\n\nThe shell must be listed in the\
    \ file /etc/shells.\n\nFor additional information on this file, enter man 5 passwd."
