    Before using userdel -r, it is important that you determine the user''s UID (id
    user). The UID enables you to locate files outside the user''s home directory
    that are assigned to the user (such as /var/mail/$USER).


    To delete these files enter the command:


    ```

    find -uid user_ID -exec rm {} \;

    ```'
