    # 配置特殊文件权限


    以下三个属性用于处理特殊情况：


    表 8-6 字母 数字 名称 文件 目录


    | 字母 | 数字 | 名称 | 文件 | 目录 |

    |---|---|---|---|---|

    | t | 1 | 粘性滞滞位 (Sticky bit) | 不适用 | 用户只有在是文件所有者或是目录的 root 所有者时才能删除文件。这通常应用于 /tmp
    目录。 |

    | s | 2 | SGID (设置组 ID) | 当程序运行时，它会将进程的组 ID 设置为文件的组 ID。 | 在此目录中创建的文件属于目录所属的组，而不是用户的主组。在此目录中创建的新目录将继承
    SGID 位。 |

    | s | 4 | SUID (设置用户 ID) | 当程序运行时，将进程的用户 ID 设置为文件所有者的用户 ID。 | 不适用 |


    # SUSE Linux Enterprise Server 10 基础


    你通过 `chmod` 设置粘性滞位，可以通过其他用户的权限（例如 `chmod o+t /tmp`）或通过数值（例如 `chmod 1777 /tmp`）。


    粘性滞位在较旧的 UNIX 系统上允许可执行程序在终止后存储在内存中，以便重启。然而，在现代 UNIX 和 Linux 系统中，这只影响目录。


    粘性滞位列在“其他”的权限 (t) 中，如下：


    ```

    geeko@da51:~ > ls -1d /tmp

    drwxrwxrwx 5 root 608 2006-04-06 12:45 /tmp

    geeko@da51:~ >

    ```


    以下是 SUID 的示例：


    ```

    geeko@da51:~ > ls -l /usr/bin/passwd

    drwxr-xr-x 1 root shadow 79765 2006-03-24 12:19

    /usr/bin/passwd

    geeko@da51:~ >

    ```


    每个用户都被允许更改自己的密码，但要将其写入 `/etc/shadow` 需要 root 权限。


    以下是 SGID 的示例：


    ```

    geeko@da51:~ > ls -l /usr/bin/wall

    drwxr-sr-x 1 root tty 10192 2006-03-22 05:24 /usr/bin/wall

    geeko@da51:~ >

    ```


    使用 `wall`，你可以向所有虚拟终端发送消息。如果你使用 `wall`，该命令将在 tty 组的权限下执行。


    如果设置了 SUID 或 SGID 属性，程序将以所有者（在上述 SUID 示例中：root）或组（在上述 SGID 示例中：tty）拥有的权限运行。


    如果 root 是程序的所有者，程序将以 root 的权限运行。遗憾的是，这样做存在安全风险。


    例如，用户可能利用程序中的错误，在进程结束后仍保留 root 权限。


    # 目标 5 确保文件系统安全


    用户登录系统后，他被允许做什么和不允许做什么主要由文件系统的安全设置决定。


    在 Linux 中，文件系统安全特别为重要，因为系统上可用的每个资源都表示为一个文件。


    例如，当用户尝试访问声卡以播放音频数据时，声卡的访问权限是由 `/dev` 目录下对应设备文件的权限设置决定的。


    为了确保基本的文件系统安全，你需要了解以下内容：


    字体 用户写访问的基本规则

    - 用户读访问的基本规则

    - 特殊文件权限如何影响系统安全


    # 用户写访问的基本规则


    Linux 中使用的文件系统在结构上是类 UNIX 文件系统。它们支持典型的访问访问权限（读、写、执行、粘性滞位、SUID、SGID 等）。


    除了各种时间戳等额外的标准功能外，还可以为文件所有者、用户组和世界其他部分（用户、组、其他）单独管理访问权限。


    作为一般规则，普通用户应仅在以下目录具有写权限：


    - 用户家目录

    - 用于存储临时文件的 /tmp 目录


    根据计算机的用途，其他目录可以是用户可写的。例如，如果你安装了 Samba 文件服务器，一个可写的共享需要一个对于 Linux 设备连接映射的也是可写的目录。


    某些设备文件（如声卡的）可能也对用户可写，因为应用程序需要向相应的设备发送数据。


    # 用户读访问的基本规则


    系统中的某些文件应该防止被用户访问。这对于存储密码的文件非常重要。即使文件中的密码是加密的，也必须防止未经授权的访问。


    以下列出了包含密码的文件：


    - /etc/shadow。该文件以加密形式包含用户密码。当使用 LDAP 进行认证时，该文件至少包含 root 密码。

    - /etc/samba/smbpasswd。该文件包含 Samba 用户的密码。默认情况下文件权限设置为 600。

    - Apache 密码文件。这些的位置取决于你的配置。它们包含访问 Web 服务器的密码。

    - /etc/ldap/slapd.conf。该文件包含 openLDAP 服务器的 root 密码。安装 openldap2 包后，该文件的权限设置为 644。


    ![](img/428e877abd09b1c1149d179d3458f12_304_0.png)


    # SUSE Linux Enterprise Server 12 基础


    - /boot/grub/menu.lst。该文件包含 GRUB 引导程序的密码。默认文件权限设置为 600。


    此列表并不完整。根据你的系统配置和软件选择，系统中可能有更多密码文件。


    某些密码文件对非 root 账户可见。这通常是运行服务守护进程的账户。


    例如，Apache Web 服务器运行在用户 wwwwrun 下。因此，密码文件必须对 wwwwrun 可读。


    在这种情况下，你需要确保只有此守护账户允许读取文件，其他用户不允许。


    # 特殊文件权限如何影响系统安全


    有三种文件系统权限以特殊方式影响安全：


    - SUID 位。如果可执行文件设置了 SUID 位，则程序将以文件所有者的用户 ID 启动。在大多数情况下，这允许普通用户以 root 用户的权限运行应用程序。


    此位仅应对经过良好测试的应用程序设置，并且在没有其他方法获取特定任务权限的情况下设置。


    攻击者可能利用以 root UID 运行的应用程序中的漏洞来获取 root 权限。


