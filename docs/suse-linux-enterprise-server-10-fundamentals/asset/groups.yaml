    # Work with Files and Directories


    In this objective, you learn how to do the following to work with files:


    +   * Copy and Move Files and Directories

    * Create Directories

    * Delete Files and Directories

    * Link Files


    # Copy and Move Files and Directories


    To copy and move files and directories, you need to know how to do the following:


    +   * Move Files with mv

    * Copy Files with cp


    # Move Files with mv


    You can use the command mv (move) to move one or more files to another directory,
    as in the following:


    ```

    mv *.txt /tmp

    ```


    You can also use the command mv to rename a file, as in the following:


    ```

    mv recipe new_recipe

    ```'
  - '[PAGE 176]


    The following are some important options you can use with mv:


    | Table 5-15 | Option | Description |

    |---|---|---|

    | -i | Asks for confirmation before moving or renaming a file. This prevents existing
    files with the same name from being overwritten. |

    | -u | Only moves files that are newer than the target files of the same name.
    |


    # Copy Files with cp


    You can copy files and directories (using the option **-r**) with the command
    **cp** (copy). The syntax for using **cp** is


    **cp source destination**


    When using the command **cp**, you need to remember the following:


    +   - The command **cp** overwrites existing files without confirmation.

    - You can avoid automatic overwriting by using the option **-i**. This option
    requires confirmation before overwriting.

    - If you want to copy just the contents of a directory (without the directory
    itself), the target directory must already exist. An example is making a backup
    copy of a directory using a different name.


    For example, to copy the directory /tmp/quarterly-1/ with all its subdirectories
    to the directory /tmp/expenses/ (which already exists), you would enter the following:


    **cp -R /tmp/quarterly-1 /tmp/expenses**


    The result is a directory /tmp/expenses/quarterly-1/.'
