    # Objective 1


    # Get to Know the Command Shells


    You cannot communicate directly with the operating system kernel. You need to
    use a program that serves as an interface between the user and operating system.


    In the operating systems of the UNIX family, this program is called the `shell`.


    The shell accepts a user''s entries, interprets them, converts them to system
    calls, and delivers system messages back to the user, making it a command interpreter.


    To understand command shells, you need to know the following:


    - Types of Shells

    - bash Configuration Files

    - Completion of Commands and File Names


    # Types of Shells


    UNIX has a whole series of shells, most of which are provided by Linux in freely
    usable versions. The following are examples of popular shells:


    - The Bourne shell (/bin/sh); symbolic link to /bin/bash

    - The Bourne Again shell (/bin/bash)

    - The Korn shell (/bin/ksh)

    - The C shell (/bin/csh); symbolic link to /bin/tcsh

    - The TC shell (/bin/tcsh)


    The various shells differ in the functionality they provide.


    Every shell can be started like a program and you can switch at any time to a
    different shell. For example, you can switch to the C shell by entering tcsh;
    you can switch to the Korn shell by entering ksh.


    Unlike other programs, the shell does not terminate on its own. You need to enter
    the command exit to return to the previous shell.


    A shell is started at a text console right after a user logs. This is called the
    login shell. Which shell is started for which user is determined in the user database.


    The standard Linux shell is bash, so we will only cover bash shell in this objective.


    # bash Configuration Files


    To customize bash for an interactive session, you need to know about the configuration
    files and about the order in which they are processed.


    To understand how shells work, you need to know the difference between the following:


    - Login Shells

    - Non-Login Shells


    # Login Shells


    A shell is started whenever a user logs in to the system. By contrast, any shell
    started from within a running shell is a non-login shell. The only differences
    between these are the configuration files read when starting the shell.


    A login shell is also started whenever a user logs in through an X display manager.
    Therefore, all subsequent terminal emulation programs run non-login shells.


    The following files are read when starting a login shell:


    1. /etc/profile. A system-wide configuration file read by all shells. It sets
    global configuration options. This configuration file will be read not only by
    the bash, but also by other shells.


    ~profile is a file created for each new user by default the SUSE Linux Enterprise
    Server. Any user-specific customizations can be stored in it.


    2. /etc/bash.bashrc. some useful configurations for the bash shell are made. For
    example:


    - Appearance of the prompt

    - Colors for the ls command

    - Aliases


    For your system-wide bash configurations use the file /etc/bash.bashrc.local that
    is imported from /etc/bash.bashrc.


    ~bashrc is a configuration file in which users store their customizations.


    # Non-Login Shells


    Only the files /etc/bash.bashrc, /etc/bash.bashrc.local ~/.bashrc are read when
    a non-login shell is started.


    Like most other Linux distributions, SUSE Linux Enterprise Server has a default
    setup that ensures users do not see any difference between a login shell and a
    non-login shell. In most cases, this is achieved by also reading the ~/.bashrc
    file when a login shell is started.


    If you change any settings and want them to be applied during the same shell session,
    the changed configuration file needs to be read in again.


    The proper way to read in a changed configuration file and to apply changes to
    the current session is by using the internal shell command source, as in the following
    example:


    ```

    source ~/.bashrc

    ```


    You can also use the “short form” of this command, which happens to be included
    in many configuration files, where it is used to read other configuration files,
    as in the following (with a space between the period and the tilde):


    ```

    ~/.bashrc

    ```


    # Completion of Commands and File Names


    The bash shell supports a function of completing commands and file names. Just
    enter the first characters of a command (or a filename) and press Tab. The bash
    shell completes the name of the command. If there is more than one possibility,
    the bash shell shows possibilities when you press Tab a second time. This feature
    makes entering filenames very easy.


    # Objective 2 Execute Commands at the Command Line


    - History Function

    - Switch to root


    # History Function


    bash stores the commands you enter so you have easy access to them. By default,
    the commands are written in the file .bash_history in the user''s home directory.
    In SUSE Linux Enterprise Server, the size of this file is set to 1,000 entries.


    You can display the commands in history using the arrow keys. up-arrow shows the
    previous command. After finding the desired command, edit it as needed then execute
    it by pressing Enter.


    When you enter part of the command (not necessarily the beginning of the command),
    pressing Ctrl+R searches the history for matching commands and displays them.
    Searching starts with the last executed.


    # Switch to root


    If you are working with a shell, you can become root by entering the `su -` command
    and the root password.


    You can check to make sure you are root by entering `id` or `whoami`. To quit
    the root administrator shell, you enter the command exit.


    # Exercise 6-1


    # Execute Commands at the Command Line


    In this exercise, you use the history feature of the shell and get root permissions
    at the command line. You use the commands history and su.


    You will find this exercise in the workbook.


    (End of Exercise)


    # Objective 3


    # Get to Know Common Command Line Tasks


    Two features make working with the bash shell more powerful:


    - Variables

    - Aliases


    # Variables


    With shell and environment variables, you are able to configure the behavior of
    the shell and adjust its environment to your own requirements.


    The convention is to write variables such as PATH in uppercase letters. If you
    set your own variables, they should also be written in capitals for the sake of
    clarity.


    Environment variables are used to control the behavior of a program that is started
    from a shell. Shell variables, on the other hand, are used to control the behavior
    of shell itself.


    Some important environment variables include the following:


    - PATH. When a program is called up, the program is searched for the directories
    specified here (each separated by ":"). The order in which directories are listed
    is important, they are searched in turn.

    - HOME. The user''s home directory.

    - USER. The login name of the actual user.


    To display the value of a shell or environment variable, enter echo $variable,
    as in the following:


    ```

    geeko@da51~ > echo $HOME

    /home/geeko

    ```

