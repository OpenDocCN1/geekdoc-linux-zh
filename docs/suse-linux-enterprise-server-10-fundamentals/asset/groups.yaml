    The application layer combines all the higher-level protocols shown in the following
    Figure B-21 (img/428e877abd09b1c1149d17d3458f12_372_0.png). Protocols in the application
    layer include the following:


    - FTP (file transfer)

    - SMTP (sending email)

    - DNS (Domain Name System)

    - HTTP (Hypertext Transfer Protocol)

    - SMB (Server Message Block)


