    | 2. 理解 SuSEConfig 的作用 | 有时 YaST 会直接将您所做的配置更改写入最终的配置文件。\n\n在其他情况下，您输入的信息首先写入 /etc/sysconfig/
    目录下的文件，然后写入其最终位置。\n\nSuSEConfig 是 SUSE Linux Enterprise Server 中的工具，用于根据 /etc/sysconfig/
    及其子目录下各种文件中设置的变量来配置系统。\n\nSuSEConfig 作为 YaST 的后端，并在您使用 YaST 模块时激活您所配置。 |

    | 3. 从 YaST 管理网络配置信息 | 配置网卡和网络连接的 YaST 模块可以在网络设备 (Network Devices) > 网卡 (Network
    Card) 找到。将网络设备集成到现有网络中需要详细信息：\n* 网络设置方法\n* 静态 IP 地址\n* 网络掩码\n* 主机名\n* DNS 服务器\n*
    路由（网关）\n在用 YaST 保存配置后，以太网网可用。您可以使用命令 ip address 验证这一点。 |

    | 4. 安装软件包 | 要安装新软件包，使用 YaST 模块软件 (Software) > 软件管理 (Software Management)。软件包的安装状态由符号表示。所有可能的符号的概览可以通过帮助
    (Help) > 符号 (Symbols) 访问。\n软件包之间存在依赖关系。在大多数情况下，这些依赖关系可以自动解决。否则，必须手动解决。 |

    | 5. 管理安装源 | 要添加新的安装源，启动软件 (Software) > 安装源 (Installation Source)。 |


    #  4 定位和使用帮助资源


    Linux 是文档最丰富的操作系统之一。本节将介绍如何查找和使用多种帮助源。


    # 目标


    - 1. 访问和使用 man 页

    - 2. 使用 info 页

    - 3. 访问发行说明和白皮书

    - 4. 使用图形帮助

    - 5. 在网页上查找帮助


    # 目标 1


    # 访问和使用 man 页


    在线帮助最重要的命令是 man（manual 或 man page 的缩写）。


    所有手册都有英文版，许多已翻译成其他语言。由于这些翻译通常不或未维护，我们建议使用英文版本。


    要显示 man 命令的帮助页，输入：


    ```

    geeko@da1:~ > man

    ```


    如果 man 命令没有自动显示英文版，您可以使用变量 LANG=en_EN 显示英文版本。


    例如，要显示 man 命令的英文版，可以输入：


    ```

    geeko@da1:~ > LANG=en_EN man

    ```


    使用参数 LANG=en_EN 将针对请求的 man 页切换到英文。


    # 以下是 man 命令手册页的第一页：


    | man(1) | 手册页工具 | man(1) |

    |---|---|---|

    | 名称 | 在线手册的接口 | |


    SYNOPSIS

    man [-c|[-w]-TZT device [-adhu7V] [-m system[]] [-L locale] [-p string] [-M path]
    [-P pager] [-r prompt] [-S list] [-e extension] [-section page ...]

    man -l [-7] [-TZT device] [-p string] [-P pager] [-r prompt] file ...

    man -k [apropos options] regexp ...

    man -f [whatis options] page ...


    DESCRIPTION

    man 是系统的手册页器。给 man 的每个参数通常是程序、实用程序或函数的名称。随后查找并显示。如果提供了章节，将引导 man 只查找手册的该章节。默认操作是在所有可用章节中搜索，遵循预定义的顺序，即使页面存在于多个章节也只显示找到的第一个。


    每个手册页的页眉左侧和右侧包含命令名称以及手册页所属的章节编号。页眉中心是页名。最后一行通常包含最后更改日期。


    '
