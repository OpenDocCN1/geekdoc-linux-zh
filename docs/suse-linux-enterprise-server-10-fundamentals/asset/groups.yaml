    \n在此练习中，你将使用 `mkdir` 命令创建新目录。\n\n你可以在练习册中找到此练习的副本。\n\n（练习结束）\n\n# 删除文件和目录\n\n\
    在本节中，你将学习如何执行以下操作：\n\n- 使用 `rmdir` 删除空目录\n- 使用 `rm` 删除文件和目录\n\n# 使用 rmdir 删除空目录\n\
    \n你可以使用 `rmdir`（remove directory）命令来删除指定的目录或多个目录（例如 `rmdir proposal`）。在删除之前，该目录或目录必须为空。\n\
    \n# 使用 rm 删除文件和目录\n\n你可以使用 `rm`（remove）命令来删除文件，如下所示：\n\n```\nrm part*\n```\n\n\
    此示例将删除当前目录下所有以 `part` 开头的文件，且不会询问确认。如果用户没有足够的权限删除某个文件，则会忽略该文件并打印错误消息。\n\n> 使用\
    \ `rm` 命令删除的文件无法恢复。\n\n![](img/428e877abd09b1c11149d179d3458f12_181_0.png)\n\n\
    | 选项 | 描述 |\n| --- | --- |\n| -i | 在删除前询问确认。 |\n| -r | （递归地）允许删除整个目录。 |\n| -f\
    \ | （强制）默认情况下，如果要删除的文件是只读的，`rm` 会询问确认。使用此选项后，将在不询问确认的情况下删除文件。 |\n\n# 练习 5-6 删除文件和目录\n\
    \n在此练习中，你将练习使用 **rmdir** 和 **rm** 命令删除文件和目录。\n\n你可以在练习册中找到此练习。\n\n（练习结束）\n\n#\
    \ 链接文件\n\nLinux 文件系统格式将数据和管理信息分开。数据的组织方式在不同的文件系统格式之间不同。\n\n每个文件由一个 inode（索引节点或信息节点）描述。要查看\
    \ inode 号，可以输入 `ls -i`。\n\n这些 inode 中的每一个大小均为 128 字节，并包含了从文件名到该文件的所有信息。这包括等信息，例如：所有者详情、访问权限、大小、各种时间详情（修改时间、访问时间、inode\
    \ 修改时间）以及指向该文件数据块的链接。\n\n`ln` 命令创建链接。链接是对文件的引用。通过链接，你可以使用该文件的不同名称从系统的任何位置访问该文件。这意味着文件本身在系统中只存在一次，但可以通过不同的名称找到。\n\
    \nLinux 识别两种链接：\n\n- 硬链接（Hard links）\n- 符号链接（Symbolic links）\n\n你通过使用 `ln` 命令创建硬链接，它指向已存在文件的\
    \ inode。此后，可以使用两个名称（文件名称和链接名称）访问该文件，你将无法区分哪个名称是先存在的，或者原始文件与链接之间有什么区别。\n\n# SUSE\
    \ Linux 企业服务器基础\n\n以下是使用 `ln` 命令的示例：\n\n```\ngeeko@da51:~/sell > ls -li\ntotal\
    \ 4\n88658 -rw-r--r-- 1 geeko users 82 2004-04-06 14:21 old\ngeeko@da51:~/sell\
    \ > ln old new\ngeeko@da51:~/sell > ls -li\ntotal 8\n88658 -rw-r--r-- 2 geeko\
    \ users 82 2004-04-06 14:21 old\n88658 -rw-r--r-- 2 geeko users 82 2004-04-06\
    \ 14:21 new\ngeeko@da51:~/sell > \n```\n\n只有当文件和链接位于同一个文件系统（同一分区）时，才能使用硬链接，因为\
    \ inode 号在同一个文件系统内是唯一的。\n\n你可以使用 `ln` 命令和 `-s` 选项创建符号链接。符号链接分配有自己的 inode——链接指向一个文件，因此始终可以在链接和实际文件之间做出区分。\n\
    \n以下是创建符号链接的示例：\n\n```\ngeeko@da51:~/sell > ls -li\ntotal 4\n88658 -rw-r--r--\
    \ 1 geeko users 82 2004-04-06 14:21 old\ngeeko@da51:~/sell > ln -s old new\ngeeko@da51:~/sell\
    \ > ls -li\ntotal 4\n88658 -rw-r--r-- 1 geeko users 82 2004-04-06 14:21 old\n\
    88658 -rw-r--r-- 1 geeko users 82 2004-04-06 14:21 new\ngeeko@da51:~/sell > \n\
    ```\n\n通过符号链接，可以克服文件系统的限制。如果文件被删除，符号链接就会失效。如果你尝试访问失效的链接，将得到错误消息。\n\n# 练习 5-7 链接文件\n\
    \n在此练习中，你将使用 `ln` 命令创建一个符号链接和一个硬链接。\n\n你可以在练习册中找到此练习。\n\n（练习结束）\n\n# 目标 6 查找文件\n\
    \n要在命令行上搜索文件，可以使用 `find` 命令。以下是 `find` 命令的语法：\n\n```\n**find** `path` `criterion``action`\n\
    ```\n\n该命令有许多选项，这里解释其中几个。你可以对命令使用参数：\n\n- **path**。要搜索的文件系统部分（指定的目录及其所有子目录）。如果没有指定，则使用当前目录下的文件系统。\n\
    \n# 图形化工具\n\n有时你需要找到一个文件以便进行编辑，但不知道它具体在哪里。你可能知道该文件名或名称的一部分。另一种情况下，你可能需要过去两天内修改或超过特定大小的文件列表。\n\
    \n如果在应用程序浏览器中输入搜索，会找到两个应用程序：\n\n- Nautilus 搜索工具（浏览组）。使用 Nautilus 文件管理器搜索。该工具仅允许搜索文件名。\n\
    - GNOME 搜索工具（系统组）。该工具允许你搜索文件大小、日期或所有者等信息。\n\n在应用程序浏览器中选择 GNOME 搜索工具后，会出现以下对话框。\n\
    \n# 图 5-3\n\n![](img/428e877abd09b1c11149d179d3458f12_190_0.png)\n\n在“名称包含”字段中，输入要查找的文件名的一部分。在“查找文件夹”输入搜索的目录。选择“查找”开始搜索过程。所有匹配的文件和目录将在下方窗口中显示，并带有位置详细信息。\n\
    \n打开“选择选项”菜单时，可以进行更进一步的设置。从“可用选项”下拉列表中选择搜索规则。点击“添加”后，会添加一个新的文本字段，你可以输入该选项所需的信息。要删除搜索规则，请选择规则旁边的“删除”。\n\
    \n# 图 5-4\n\n![](img/428e877abd09b1c11149d179d3458f12_191_0.png)\n\n"
