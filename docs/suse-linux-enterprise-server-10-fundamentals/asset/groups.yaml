    # Delete Files and Directories


    In this section you learn how to do the following:


    +   - Delete Empty Directories with rmdir


    +   - Delete Files and Directories with rm


    # Delete Empty Directories with rmdir


    You can use the rmdir (remove directory) command to remove the indicated directory
    or directories (e.g., rmdir proposal). The directory or directories must be empty
    before you can delete them.


    # Delete Files and Directories with rm


    You can use the command rm (remove) to delete files, as in the following:


    rm part*


    This example deletes all files in the current directory that begin with part without
    asking for confirmation. If the user does not have sufficient permissions to delete
    a file, this file is ignored and an error message is printed.


    > Files deleted with the command rm cannot be restored.


