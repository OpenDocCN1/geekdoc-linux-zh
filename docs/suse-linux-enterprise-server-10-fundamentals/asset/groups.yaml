    # Objective 3


    # Manage User and Group Accounts From the Command Line


    You can use commands to perform the same user and group management tasks available
    with YaST. In this objective you will learn:


    +   - Manage User Accounts From the Command Line

    - Manage Groups From the Command Line

    - Create Text Login Messages


    # Manage User Accounts From the Command Line


    The root user can use the following commands to perform the same user management
    tasks available with YaST (and some tasks available with YaST):


    +   - useradd. You can create a new user account with the useradd command. If
    no option is specified, the command useradd creates a user without a home directory
    and without a valid password.

    - -m. This option automatically generates the home directory for the user. Without
    further arguments, the directory is created under /home/.

    In addition, several files and directories are copied to this directory. The directory
    /etc/skel/ (from skeleton) is used as a template for the user home directory.

    - -c. When creating a new user, you can enter text for the comment field by using
    the option -c (comment).

    - -u. This option specifies the UID of the new account. If this option is not
    given, the next free UID is used (at maximum 60000).'
- md: "\n- -g. This defines the primary group of the user. You can specify either\
    \ the GID or the name of the group.\n\n- -p. This option lets you create a password\
    \ for a new user. The following is an example:\n\n```\nuseradd -m -p \"ghvkuzfFGW6cw\"\
    \ geeko\n```\n\n![](img/428e877abd09b1c11149d179d3458f12_281_0.png)\n\nThe encrypted\
    \ password must be given here, not the plain text password. The mkpasswd can be\
    \ used to generate encrypted passwords. The program is located in the package\
    \ whose.\n\n- -e. The option -e (expire date) lets you set an expiration date\
    \ for the user account, in the form of YYYY-MM-DD, as in the following:\n\n```\n\
    useradd -m -e 2002-03-21 geeko\n```\n\nYou can display a description of additional\
    \ options by entering man 8 useradd.\n\nAfter adding a new user, you need to assign\
    \ a password:\n\n```\nda51:~ # useradd -m -c \"Geeko Chameleon\" geeko\nda51:~\
    \ # passwd geeko\nNew password:\nRe-enter password:\nRetype new password:\nPassword\
    \ changed\n```\n\nWith the user it is created, and with passwd the password is\
    \ assigned.\n\nWhen creating a user account, the necessary standard configuration\
    \ information (effective group, location of the home directory, default shell,\
    \ etc.) is derived from the files /etc/default/useradd and /etc/login.defs.\n\n\
    # The following is an example of the file /etc/default/useradd:\n\n```\nGROUP=100\n\
    HOME=/home\nINACTIVE=-1\nEXPIRE=\nSHELL=/bin/bash\nSKEL=/etc/skel\nGROUPS=video,dialout\n\
    CREATE_MAIL_SPOOL=no\n```\n\nThe variables mean:\n\n- GROUP. The primary group\
    \ the user belongs to.\n- HOME. Path where the home directories are stored.\n\
    - INACTIVE. Number of days of inactivity after a password has expired before the\
    \ account is locked. (-1 disables this feature)\n- EXPIRE. Date (days since January\
    \ 1st, 1970) when an account will expire.\n- SHELL. Path of the login shell.\n\
    - SKEL. Path of the home directory skeleton.\n- GROUPS. Further groups the user\
    \ belongs to.\n- CREATE_MAIL_SPOOL. Specifies whether a mail spool directory is\
    \ created automatically.\n\nuserdel. This command lets you delete an existing\
    \ user account. It provides a simple option -r, which deletes the user's home\
    \ directory and the user's account.\n\nBefore using userdel -r, it is important\
    \ that you determine the user's UID (id user). The UID enables you to locate files\
    \ outside the user's home directory that are assigned to the user (such as /var/mail/$USER).\n\
    \nTo delete these files enter the command:\n\n```\nfind -uid user_ID -exec rm\
    \ {} \\;\n```\n\nusermod. This command lets you to modify settings (such as UID,\
    \ standard shell, home directory, and primary group) for an existing user account.\n\
    \nThe usermod options are basically the same as those for the useradd command.\n\
    \nThe following are examples:\n\n- Change the home directory:\n\n```\nusermod\
    \ -d /data/geeko -m geeko\n```\n\nChange the UID:\n\n```\nusermod -u 1001 geeko\n\
    ```\n\npasswd. You can change a user's password with the command passwd. If a\
    \ user enters passwd without a username as an argument, the user can change her\
    \ own password.\n\nBesides being able to change a user password, the passwd command\
    \ provides the following features:\n\n- Locking a user account: With the option\
    \ -l (lock), a user can be locked out, and with the option -u (unlock), he can\
    \ be reactivated.\n\n```\n$# grep geeko /etc/shadow\ngeeko:$2A05$QUFf5tYH2BhvXmxZ31c9YejHgt7XefIFM58QHspu8WD\n\
    FWx7BhPk:13284:0:99999:7:::\n$# passwd -\nPassword:\nPassword changed.\n$# grep\
    \ geeko /etc/shadow\ngeeko:$2A05$QUFf5tYH2BhvXmxZ31c9YejHgt7XefIFM58QHspu8WD\n\
    FWx7BhPk:13284:0:99999:7::\nda51:~#\n```\n\nAn account is locked, when the password\
    \ begins with \"!\".\n\nStatus of a user account: The option -S lists the status\
    \ of a user account:\n\n```\nda51:~ # passwd -S geeko\ngeeko 02/02/9999 0 -1\n\
    da51:~ #\n```\n\nIn the above example, L (locked) means that the user is unable\
    \ to log in. Other options are NP (no password) or P (password). These are followed\
    \ by the date of the last change, the minimum length of validity, the maximum\
    \ length of validity, and warning periods and inactivity periods.\n\nChanging\
    \ password times: You can change various password times using the following options:\n\
    \n| Option | Description |\n| :--- | :--- |\n| -i | Disable an account after the\
    \ password has expired for number days. |\n| -n | Sets the minimum number of days\
    \ before a password can be changed. |\n| -w | Warns the user that in number days\
