    # User Accounts and Home Directories


    Each user has a user account identified by a login name and a personal password
    for logging in to the system.


    By having user accounts, you are able to protect a user''s personal data from
    being modified, viewed, or tampered with by other users. Each user can set up
    her own working environment and always find it unchanged when she logs back in.


    As part of these security measures, each user in the system has her own directory
    in the directory /home.


    The exception to this rule is the account root. It has its own home directory
    in /root.


    Home directories allow personal data and desktop settings to be secured for user
    access only.


    > You should avoid using the root account when performing day-to-day tasks that
    do not involve system management.


