    # Configuration


    During the configuration phase of the installation, you configure the following:


    - Root Password

    - Network Devices

    - Services

    - Users

    - Hardware


    # Root Password


    If the installation was successful, the computer reboots. YaST starts again because
    you need to configure some basic settings.


    First you need to specify the name of your host and the name of your domain.


    Figure 1-11


    ![](img/428e877abd09b1c11149d179d3458f12_43_0.png)


    The option Change Hostname via DHCP can be activated by the entered hostname should
    be overwritten by the hostname a DHCP server delivers.


    After selecting Next, you have to enter a password for the administrator root
    in the following dialog:


    # Figure 1-12


    ![](img/428e877abd09b1c11149d179d3458f12_44_0.png)


    Warnings appear if the selected password is too simple and if the password contains
    only lowercase letters.


    # Network Devices


    After you have specified a password, you need to review your network configuration.
    YaST displays a summary of the network devices it has discovered:


    # Figure 1-13


    ![](img/428e877abd09b1c11149d179d3458f12_45_0.png)


    The following are types of network devices displayed:


    - * Network Interfaces

    - DSL Connections

    - ISDN Adapters

    - Modems


    By default YaST selects the DHCP configuration for the network interfaces. You
    can change the network configuration by selecting the headline of the section
    or by using the Change menu.


    At the top of the list there are two more items concerning network shown:


    - **Network Mode.** The NetworkManager is an applet that tries to manage the configuration
    of your network automatically. This is useful if your computer often changes the
    network location (e.g. notebooks with wireless LAN).


    - **Firewall.** A firewall will be activated by default and the SSH port is blocked.


    At the bottom of the list there are two more items concerning network shown:


    - **VNC Remote Administration.** VNC allows you to export the desktop of your
    computer.


    The desktop of the computer running the VNC server is shown in a window on the
    VNC client. You are able to start graphical applications and to use the mouse
    as if you were sitting in front of the remote computer.


    - **Proxy.** Configure and enable a proxy for the internet protocols HTTP, HTTPS
    and FTP.


    # SUSE Linux Enterprise Server 12 Fundamentals


    In the next dialog, you can test your Internet connection:


    # Figure 1-14


    ![](img/428e877abd09b1c11149d179d3458f12_47_0.png)


    If you select **Yes, Test Connection to the Internet**, the latest release notes
    will be downloaded and YaST will start the Novell Customer Center to check for
    new updates.


    If new updates are found, YaST asks you to verify the download and installation.
    You should apply any updates to ensure your new system has the latest patches
    applied.


    1-26 Copying all or part of this manual, or distributing such copies, is strictly
    prohibited. To report suspected copying, please call 1-800-PIRATES. Version 1


    # Services


    In the next dialog you can configure two very important services:


    Figure 1-15


    ![](img/428e877abd09b1c11149d179d3458f12_48_0.png)


    These services include the following:


    - - CA Management: The purpose of a CA (Certificate Authority) is to guarantee
    a trust relationship among all network services communicating with each other.


    - - OpenLDAP Server: You can run an LDAP server on your host to provide a central
    facility managing a range of configuration files.


    Typically, an LDAP server handles user account data, but with SUSE Linux Enterprise
    Server, it can also be used for mail-, DHCP-, and DNS-related data.


    By default, a CA is created. An LDAP server is set up during the installation,
    but it is not started.


    # Users


    After you configure the services, you configure user authentication. First, select
    the authentication method you want to use:


    # Figure 1-16


    ![](img/428e877abd09b1c11149d179d3458f12_49_0.png)


    Four different methods are available:


    - - **Local (/etc/passwd).** The user accounts are managed using the local file
    /etc/passwd. Select this option for computers without a network connection or
    if you want to administer your accounts locally.


    - - **LDAP.** User account data is managed centrally by an LDAP server. Users
    must be authenticated via LDAP if you are working in a network environment that
    has both UNIX and Windows computers.


    - - **NIS.** User account data is managed centrally by a NIS server. NIS can only
    be used in pure UNIX environments.


    - - **Windows Domain.** User account data is managed centrally by Windows or a
    Samba server. Samba normally allows authentication in a Windows environment.


    The next dialog displayed depends on your chosen authentication method.


    We will not use LDAP authentication in this course. The topic is covered in the
    SUSE Linux Enterprise Server 10: Networking Services course (3074). In this course
    only the local authentication is explained.


    If you choose Local (/etc/passwd) and select Next, the following dialog appears:


    Figure 1-17


    ![](img/428e877abd09b1c11149d179d3458f12_50_0.png)


    To add a user, you need to provide the following information:


    - - **User''s Full Name**: The full name of the user.


    - - **Username**: The login name of the user. This name must be unique on the
    system.


    - - **Password**: The case-sensitive login password for the user. You have to
    enter the password twice for verification. YaST displays warnings if the password
    is insecure.


    If you want the user to receive automatically generated email for root, then select
    **Receive System Mail**.


    If you use your Linux computer only at your own desk and you want to avoid the
    login during the startup, select **Automatic Login**.


    > For security reasons, we recommended that you deselect this option.


    Warning messages appear if the password you choose is too simple and if it contains
    only lowercase letters.


    After setting up one or more users, the system information is written to disk.
    YaST opens a window with the release notes.


    # Figure 1-18


    ![](img/428e877abd09b1c11149d179d3458f12_52_0.png)


    Go to the last step of the installation by selecting Next.


    # Hardware


    At this point, the final configuration dialog appears (hardware configuration):


    Figure 1-19


    ![](img/428e877abd09b1c11149d179d3458f12_53_0.png)


    From this dialog you configure additional hardware items such as the following:


    - * Graphics Cards

    * Printers

    * Sound


    YaST configures the graphics card and the sound card automatically. YaST also
    detects local printers automatically. Confirm the settings and write them to the
    system by selecting Next.

