    ## 第 3 节 使用 YaST 管理 Linux


    YaST 是一个配置你的 SUSE Linux Enterprise Server 10 的强大工具。它提供了许多模块用于完成所有重要的配置任务，但在本节中，你将学习网络配置模块和软件模块作为示例。


    ## 目标


    + 1. 了解 YaST

    2. 理解 SuSEconfig 的作用

