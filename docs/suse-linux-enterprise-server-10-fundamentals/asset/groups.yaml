    ## SECTION 2 Use the Linux Desktop


    This section gives an overview of the graphical user interfaces of SUSE Linux
    Enterprise Server and explains how to access the command line.


    ## Objectives


    - 1. Overview of the Linux Desktop

    - 2. Use the GNOME Desktop Environment

    - 3. Access the Command Line Interface From the Desktop


    ## Introduction


    You cannot install Windows without its graphical user interface (GUI). In Linux,
    the GUI is a normal application that you can choose whether or not to install.


    Most services in Linux can be configured by editing an ASCII file, so you do not
    need a GUI if you want your computer to act only as a server.


    Not installing a graphical user interface has the following advantages:


    - **Stability.** Every program contains errors that can make your system unstable.
    The fewer programs are installed, the more stable your system will be. A graphical
    user front end is a large program that might contain a large number of undiscovered
    programming errors, even if the error ratio is low.


    - **Performance.** Every running program needs system resources. Fewer programs
    running on your computer means increased performance.


    ## Objective 1


    ### Overview of the Linux Desktop


    The base of any graphical user interface is the X Window System (simply called
    X or X11). It allows you to control the input and output of several applications
    in different windows of a graphical interface.


    You need to distinguish between graphical applications, which run in their own
    windows, and text-based applications, which are carried out in a terminal window.


    The X Window System was created in 1984 at MIT (Massachusetts Institute of Technology).
    The aim of the development was to be able to use graphical applications across
    a network, independent of hardware.


    The X Window System allows graphical applications to be displayed and operated
    on any monitor, without running the applications on the machines to which these
    monitors are connected.


    The basic for this is the separation into a server component (X server) and the
    application itself (client application). The X server and client application communicate
    with each other by way of various communication channels.


    - **X server.** The X server controls the graphical screen. This corresponds roughly
    to what would be called a graphics driver over other systems. In addition, it
    manages the input devices, such as keyboard and mouse, and transmits its actions
    to the X client.


    The X server, however, has nothing to do with the appearance of the window and
    the desktop; this is the task of the window manager. XFree86 and XOrg are free
    implementations of the X server. SUSE Linux Enterprise Server 10 defaults to using
    XOrg.


    - **Client application.** The client application is a graphical application that
    uses the services of the X server to receive keyboard and mouse actions and to
    have its output displayed on the screen.


    The communication between X server and X client use the network protocol TCP/IP—even
    if the X server and client run on the same computer.


    Window managers are specialized client applications. A window manager works together
    with the X server and provides additional functionality. The window manager:


    - Provides control elements

    - Manages virtual desktops

    - Provides functionality of window frames (for example, changing their size)


    The X Window System is not linked to any specific window manager and thus it is
    not linked to any particular look and feel.


    SUSE Linux Enterprise Server 10 is currently released with several window managers,
    including Metacity (the GNOME window manager) and twm (Tab Window Manager).


    Desktop environments go far beyond the look and feel window managers provide for
    desktops and manipulating windows. The aim is to provide clients with a unified
    look and feel. GNOME is the standard graphical desktop for SUSE Linux Enterprise
    Server 10, but you can install the KDE desktop instead.


    As be seen in the following figure, the X server is running, while the X applications
    are running:


    Figure 2-1


    ![](img/428e877abd09b1c11149d179d3458f12_62_0.png)


