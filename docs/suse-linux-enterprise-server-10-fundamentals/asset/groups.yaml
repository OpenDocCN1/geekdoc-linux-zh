    # The Hierarchical Structure of the File System


    The file system concept of Linux involves a hierarchical file system that can
    be depicted in the form of a tree.


    This tree is not limited to a local partition. It can stretch over partitions,
    which can be located on different computers in a network. It begins at the root,
    from where the name for the system administrator comes, and branches out call
    the branches of a tree.


    The following is an extract from a typical file system tree:


    Figure 5-1


    ![](img/428e877abd09b1c11149d179d3458f12_141_0.png)


    A file in this directory tree is uniquely defined by its path. A path refers to
    the directory names which lead to this file.


    The separation character between individual directory names is the slash ("/").
    The path can be specified in two ways:


    +   - As a relative path starting from the current directory


    +   - As an absolute path starting from the root of the entire system tree.'
- md: '

    The absolute path always begins with a slash ("/"), the symbol for the root directory.


    # Figure 5-2


    ![](img/428e877abd09b1c11149d179d3458f12_142_0.png)


    In this figure the current position in the file system is geeko''s home directory.
    To change into the /etc directory, you can use the following commands:


    - absolute: cd /etc

    - relative: cd ../../etc


    > cd is the command to change the current working directory. It will be explained
    later in detail.


    Sometimes it is necessary to specify the absolute path because certain files can
    only be uniquely addressed in this way. The length of the path cannot exceed 4096
    characters, including the slashes.


    ## FHS (Filesystem Hierarchy Standard)


    The structure of the file system is described in the Filesystem Hierarchy Standard
    (FHS). Here, it is specified which directories must be located on the first level
    after the root directory and what they contain.


    The FHS does not specify all details. In some areas it allows leeway for your
    own definitions. The FHS defines a two-layered hierarchy:


    - The directories in the top layer (immediately below the root directory “/”).

    - As a second layer, the directories /usr and /var.


    You can find information about FHS at http://www.pathname.com/fhs/ on the Internet.


    ## Root Directory /


    The root directory refers to the highest layer of the file system tree. Normally
    only directories (not files) are located here. When the system is booted, the
    partition on which this directory is located is the first one mounted.


    Because the kernel cannot fulfill all the tasks of the operating system, all programs
    that are run at system start must be available on this partition (they cannot
    be located on another partition).


    The following directories always have to be on the same partition as the root
    directory: /bin, /dev, /etc, /lib, and /sbin.


    ## Essential Binaries for Use by All Users (/bin)


    The directory /bin contains important executable programs that are required when
    no other file systems are mounted, such as all programs necessary for the system
    start.


    These include the various shells, the most important commands for working with
    files, and several commands for system analysis and configuration.


    The following table provides an overview of the contents of the /bin directory:


    | File | Description |

    | --- | --- |

    | /bin/bash | The bash shell |

    | /bin/cat | Displaying files |

    | /bin/cp | Copying files |

    | /bin/dd | Copying files byte-wise |

    | /bin/gzip | Compressing files |

    | /bin/mount | Mounting file systems |

    | /bin/rm | Deleting files |

    | /bin/vi | vi editor |


    ## Boot Directory (/boot)


    The directory /boot contains static files of the boot loader GRUB (Grand Unified
    Bootloader). These are files required for the boot process (with the exception
    of configuration files).


    The backed-up information for the Master Boot Record (MBR) and the system map
    files are also stored here. These contain information about exactly where the
    kernel is located on the partition. In addition, this directory contains the kernel
    which has the name vmlinuz.


    According to the FHS, however, the kernel can also be located in the root directory.


    ## Other Partitions (/data)


    If YaST finds other (non-Windows) partitions or another hard disk during the installation
    it creates mount points for each partition labeled:


    - /data1

    - /data2

    - ...

    - /dataX


    ## Device Files (/dev)


    Each hardware component existing in the system (such as hard drives, CD drives,
    printer, and mouse) is represented as a file in the directory /dev.


    The hardware components are addressed via these files by writing to or reading
    from one of these files. Two kinds of device files are included:


    - Character-oriented device files (for devices working sequentially, such as printer,
    mouse, or tape drive)

    - Block-oriented device files (such as floppy disks and hard drives).


    The connection to device drivers in the kernel is implemented via numbered channels,
    which correspond to the number of the device driver in question. These are referred
    to as `major device numbers`.


    A driver might be responsible for several devices of the same type. To distinguish
    between these devices, the minor device number is used.


    Instead of the size of the files, these two numbers are not occupy any space on
    the hard drive anyway:


    ```

    da51:- # ls -l /dev/hda*

    brw-rw-- 1 root disk 3, 0 Mar 22 06:12 /dev/hda

    br-rw-- 1 root disk 3, 1 Mar 22 06:12 /dev/hdl

    ```


    In this example, the major device number 3 is listed for all files. This refers
    to the driver for IDE hard drives. The minor device numbers run from 1 to 15 (for
    SCSI hard drives) and up to 63 (for IDE hard drives) and refer to the various
    possible partitions.


    Many device files are already available by default. Some of them, however, are
    never needed. If special device files are required for specific devices, these
    can be generated with the command `mknod`. The necessary parameters must be provided
    by the hardware manufacturer.


    The null device /dev/null is also located in this directory. Program output that
    would normally be sent to the screen can be redirected to this device.


    The following are some important files:


    | Device | Device File | Description |

    | --- | --- | --- |

    | Terminals | /dev/console | The system console |

    | | /dev/tty1 | The virtual console. |

    | Serial ports | /dev/ttyS0 | The serial port |

    | Parallel ports | /dev/lp0 | The parallel port. |

    | Floppy disk | /dev/fd0 | The floppy disk. |

    | IDE hard drives | /dev/hda | The first hard drive. |

    | | /dev/hdb | The second hard drive |

    | | /dev/hdc | The third hard drive |

    | | /dev/hdd | The fourth hard drive |

    | SCSI hard drives | /dev/sda | The first SCSI hard drive |

    | | /dev/sdb | The second SCSI hard drive |

    | CD-ROM drives | /dev/scd0 | The first CD-ROM drive |


    ## Configuration Files (/etc)


    This directory and its subdirectories contain system configuration files. Almost
    all these files are ASCII files, which can be processed with any editor.


    Normal users can read nearly all of these files, but they cannot edit any of them.
    According to the FHS, no executable programs can be located here.


    However, the subdirectories contain many shell scripts. Some important configuration
    files are listed in the following table:


    | File | Description |

    |---|---|

    | /etc/SUSE-release | Version number of the SUSE Linux Enterprise Server |

    | /etc/instab | Configuration file for the init process |

    | /etc/init.d/* | Scripts for starting services |

    | /etc/modprobe.conf | Configuration file of the kernel modules |

    | /etc/DIR_COLORS | Specifies the colors for ls |

    | /etc/X11/X86Config | Configuration file of the X Window System |

    | /etc/fstab | Table of the file systems automatically mounted at the system start
    |

    | /etc/profile | Login script of the shell |

    | /etc/passwd | User database; all information except passwords |

    | /etc/shadow | Encrypted passwords of users |

    | /etc/group | Database of user groups |

    | /etc/cups/* | Files for the CUPS printing system |

    | /etc/hosts | Allocation of computer names to IP addresses |

    | /etc/motd | Welcome message after a user logs in (message of the day) |

    | /etc/issue | Linux welcome message before the login prompt |

    | /etc/sysconfig/* | Central configuration files of the system |


    Nearly every installed service has at least one configuration file in the directory
    /etc or a subdirectory.

    '
