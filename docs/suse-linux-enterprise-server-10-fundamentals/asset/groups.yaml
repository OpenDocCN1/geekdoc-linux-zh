    # Create a New File with touch


    You can use the command touch to change the time stamp of a file or create a new
    file with a size of 0 bytes. The following are the most important options:


    | Command | Description |

    | --- | --- |

    | -a | Changes only the time of the last read access (access time). |

    | -m | Changes only the time of the last modification (modification time). |

    | -r | Sets the time stamp of file instead of the current time. |

    | -t | Instead of the current time, sets time (structure: [[CC]YY]MMDYYhhmm.ss
    [[Century]Year] Month Day Hour Minute [Seconds], two digits in each case)).'
