    # Objective 2 Describe Basic User Security


    One of the main characteristics of a Linux operating system is its ability to
    handle several users at the same time (multiuser) and to allow these users to
    perform tasks on the same computer simultaneously (multitasking). To maintain
    an environment where data and applications are secure, you need to understand
    the following:


    - File System Components

    - Users and Groups


    # File System Components


    As with other systems, you control access to files in a Linux system by implementing
    the following components:


    - **Users.** Users are individual accounts on the Linux system.

    - **Groups.** Groups are collections of users assigned to a group when they are
    created. Every user must belong to at least one group.

    - **Ownership.** The user who creates a file or directory is automatically assigned
    as its owner. Ownership can be changed manually by root.

    - **Permissions.** Permissions determine user access to a file or directory.


    # Users and Groups


    Because Linux is a multiuser system, several users can work on the system at the
    same time. For this reason the system uniquely identifies all users through user
    accounts that require a username and password to log in to the system. In addition,
    Linux provides groups that let you associate users together that require the same
    type of access to data and applications. To manage users and groups, you need
    to know the following:


    - User and Group ID Numbers

    - Regular vs. System Users

    - User Accounts and Home Directories

    - User and Group Configuration Files


    # User and Group ID Numbers


    Because an operating system can handle numbers much better than strings, users
    and groups are administered as numbers on a Linux system. The number which a user
    receives is called User ID (UID). Every Linux system has a privileged user, the
    user root. root is the administrator of the system. This user always has a UID
    of 0. UID numbering for normal users starts (by default) at 1000 for SUSE Linux.


    As with users, groups are also allocated a number called the Group ID (GID). Normal
    users are usually included in the group users. Other groups also exist (and can
    be created) for special roles or tasks. For example, all users who intend to create
    web pages can be placed in the group webedit. Of course, file permissions for
    the directory in which the web pages are located must be set so members of the
    group webedit are able to write and read files.


    You can use the command `id` to display information about a user’s UID and which
    groups she is assigned to. For example, entering `id geeko` provides information
    about the user geeko:


    ```

    geeko@da51:~ id

    uid=1000 (geeko) gid=100(users)

    groups=16(dialout), 33 (video), 100(users)

    geeko@da51:~

    ```


    This information includes the following:


    - **User ID**: uid=1000(geeko)

    - **Current default (effective) group**: gid=100(users)

    - **All groups of geeko is a member**: groups=16(dialout), 33(video), 100(users).


    If you want information on the groups in which you are a member, enter `groups`.
    You can specify a particular user by entering `groups user`.


    ```

    geeko@da51:~ groups geeko

    geeko : users dialout video

    geeko@da51:~

    ```


    You can display additional information about local users by entering finger user,
    as illustrated in the following:


    ```

    geeko@da51:-> finger geeko

    Login: geeko Name: Geeko Chameleon

    Directory:/home/geeko Shell: /bin/bash

    On since Fri Feb 10 12:50 (MST) on :0 (messages off)

    On since Fri Feb 10 13:38 (MST) on pts/0.0

    No Mail.

    No Plan.

    geeko@da51:->

    ```


    # Regular vs. System Users


    In Linux operating system, there are two basic kinds of user accounts:


    - Regular (normal) users. These are user accounts that allow login to the Linux
    environment. This type of login gives people a secure environment for accessing
    data and applications. These user accounts are managed by the system administrator.

    - System users. These are user accounts created during installation that are used
    by services, utilities, and other applications to run effectively on the server.
    These users do not need any maintenance.


    All users are stored in the files /etc/passwd and /etc/shadow.

