    ## 练习 7-1


    ## 使用 vi 在 Linux 系统中编辑文件


    在本次练习中，你将使用 vi 编辑器创建一个编辑文件。


    你将在练习册中找到此练习。


    （练习结束）


    ## 总结


    | 目标 | 总结 |

    | --- | --- |

    | 1. 了解 Linux 文本编辑器 | Linux 的大多数服务都是通过编辑 ASCII 文件来配置的。因此，你需要一个文本编辑器。\n编辑器有两种：\n-
    命令行编辑器\n- 图形化编辑器\n图形化编辑器是从主菜单可以启动的 gedit。 |

    | 2. 使用 vi 编辑器编辑文件 | vi 命令行编辑器在每个 Linux 和 UNIX 系统上都可用。\nvi 具有以下模式：\n- **命令模式 (Command
    mode)**：可以给 vi 发送命令。命令 "i" 将其置插入模式，命令 ":" 将其进入命令模式。\n- **插入模式 (Insert mode)**：vi
    接受所有输入作为文本。按 **Esc** 返回到命令模式。\n- **命令行模式 (Command-line mode)**：vi 接受来自命令行的命令。按
    **Enter** 执行命令并自动切换回命令模式。\n- **:q** 在不保存文件更改退出。 |


    ## 第 8 节 管理用户、组和权限


    Linux 是一个多用户系统。换句话说，多个用户可以同时在系统中工作。因此，系统必须能够唯一识别所有用户。在本节中，你将学习如何管理用户账户及其权限。


    ## 目标


    - 1. 使用 YaST 管理用户和组账户

    - 2. 描述基础 Linux 用户安全功能

    - 3. 从命令行管理用户和组账户

    - 4. 管理文件权限和所有权

    - 5. 确保文件系统安全


    ## 目标 1 使用 YaST 管理用户和组账户


    通过 YaST，你可以管理用户和组。要做到这一点，你需要理解以下内容：


    - 关于用户和组的基础知识

    - 使用 YaST 进行用户和组管理


    ## 关于用户和组的基础知识


    Linux 操作系统的主要特征之一是能够同时处理多个用户（多用户），并允许这些用户在同一台计算机上同时执行多个任务（多任务）。


    因此，系统必须能够唯一识别所有用户。为了实现这一点，每个用户必须使用以下信息登录：


    - 用户名

    - 密码


    由于操作系统处理数字的能力远于处理字符串的能力，用户在内部以数字形式处理。用户收到的数字是 UID（用户 ID）。


    每个 Linux 系统都有一个特权用户，即 root 用户。该用户始终拥有 UID 0。这是系统的管理员。


    用户可以根据共同的特征或活动分组成。例如：


    - 普通用户通常位于 `users` 组。

    - 所有意图创建网页的用户都可以放在 `webedit` 组中。


    当然，必须设置网页所在目录的文件权限，以便 `webedit` 组能够进行写入（保存文件）。


    与用户一样，每个组在内部也分配了一个数字，称为 GID（组 ID），并可以是以下类型之一：


    - 普通组

    - 系统使用的组

    - root 组（GID = 0）


    ## 使用 YaST 进行用户和组管理


    你n通过以下方式访问 YaST 用户和组账户管理：


    - 用户管理。从 YaST 控制中心选择 安全与用户（Security and Users）> 用户管理（User Management），或者从终端窗口
    `yast2 users`。

    - 组管理。从 YaST 控制中心选择 安全与用户（Security and Users） > 组管理（Group Management），或者从终端窗口
    `yast2 groups`。


    如果你在安装 SUSE Linux Enterprise Server 期间选择了 LDAP 进行验证，系统会提示输入 LDAP 服务器管理员密码。


    你可以通过选择模块窗口顶部的“用户和组”单选按钮，在管理用户和管理组之间切换。


    ## 用户管理


    用户账户管理窗口列出了现有的用户账户（如下）：


    图 8-1


    ![](img/428e877abd09b1c11149d179d3458f12_257_0.png)


    会出现用户列表（你服务器上的账户），其中包含每个用户的登录名、全名、UID 和关联组等信息。


    选择“设置过滤器”（Set Filter）：然后选择以下项来更改列出的用户：


    - **本地用户 (Local Users)**。你在本地服务器上创建的、用于登录服务器的用户账户。

    - **系统用户 (System Users)**。系统创建的用于服务和应用程序的用户账户。

    - **自定义 (Custom)**。根据在“自定义过滤器”（Customize Filter）中配置的设置自定义的用户视图。

    - **自定义过滤器 (Customize Filter)**。此选项允许你组合列出的用户集（如本地用户和系统用户），以显示自定义的用户列表（使用“自定义”选项）。


    随着你在服务器上配置和启动服务，额外的用户集（如 LDAP 用户）将添加到“设置过滤器” de的下拉列表中。


    你可以通过选择“添加”（Add）或“编辑”（Edit）创建新用户账户或编辑现有账户。


    出现以下内容：


    ## 8-2


    ![](img/428e877abd09b1c11149d179d3458f12_258_0.png)


    在以下字段中输入或编辑信息：


    - **用户全名 (User’s Full Name)**。输入一个真实姓名（例如 John）

    - **用户名 (Username)**。输入用于登录系统的名称（例如 john）

    - **密码和确认密码 (Password and Confirm Password)**。输入并再次输入用户账户的密码。


    在输入密码时，区分大写和小写。有效密码不应包含任何特殊字符，你可能会在不同的键盘布局上难以输入它们。


    密码长度应在 5 到 72 个字符之间。


    要设置用户的属性（如 UID、主目录、登录 shell、组关联和附加注释），选择“详细信息”（Details）选项卡。出现以下内容：


    图 8-3


    ![](img/428e877abd09b1c11149d179d3458f12_260_0.png)


    在以下字段中输入或编辑信息：


    - **用户 ID (uid)**。对于普通用户，应使用大于 999 的 UID，因为较低的 UID 用于特殊目的。


    如果你更改现有用户的 UID，必须更改权限。这对用户主目录中的文件会自动执行，但对于其他位置的文件不会。如果没有发生，你可以通过 root 身份输入 `chown
    -R username /home/username` 来更改主目录文件的权限。


    - **主目录 (Home Directory)**。用户的主目录。通常为 `/home/username`。你可以通过“浏览”（Browse）选择现有目录。

    - **附加用户信息 (Additional User Information)**。此字段可以包含三个由逗号隔开的部分。通常用于输入 `办公室电话,工作电话,家庭电话`。当你对该用户使用
    **finger** 命令时会显示这些信息。

    - **登录 shell (Login Shell)**。从系统安装的 shell 下拉列表中为该用户选择默认登录 shell。

    - **默认组 (Default Group)**。这是用户所属的组。从系统配置的所有组列表中选择一个组。

    - **组 (Groups)**。从列表中选择要分配给用户的所有额外成员。


    要设置各种密码参数（如密码有效期），选择“密码设置”（Password Settings）选项卡。出现以下内容：


    图 8-4


    ![](img/428e877abd09b1c11149d179d3458f12_262_0.png)


    在以下字段中输入或编辑信息：


    - **密码过期前发出警告的天数 (Days before Password Expiration to Issue Warning)**。输入密码过期前几天向用户发出警告。

    - **输入 -1** 禁用警告。

    - **密码过期后仍可用登录的天数 (Days after Password Expires with Usable Login)**。输入密码过期后用户继续登录的天数。

    - **输入 -1** 无限访问。


    '
