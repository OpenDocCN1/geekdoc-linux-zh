    ## System Information Directory (/sys)


    The directory /sys provides information in the form of a tree structure on various
    hardware buses, hardware devices, active devices, and their drivers.


    ## Mountpoint for Temporarily Mounted File Systems (/mnt)


    The standard directory for integrating file systems is /mnt. It should only be
    used for temporary purposes. For permanent mounts, you should create an appropriately
    named directory.


    In the following example, the hard drive partition /dev/hda7 is mounted at the
    position /mnt in the directory tree using the command **mount:**


    ```

    da51:~ # mount /dev/hda7 /mnt

    ```


    All files on this partition can now be reached via the directory /mnt. To remove
    this partition again, you use the command **umount:**


    ```

    da51:~ # umount /mnt

    ```


    If you do not include any options with the command mount, the program tries out
    several file system formats. If you want to specify a specific file system, use
    the option **-t**.


    If the file system format is not supported by the kernel, the command is aborted,
    and you receive an error message. In this case, you must compile a new kernel
    that supports the file system format.


    ## Directories for Mounting Other File Systems


    Other file systems such as other hard drive partitions, directories from other
    computers via the network, or removable media (floppy disk, CD-ROM, removable
    hard drive) can be mounted to the system at any point.


    A directory must exist at the point where you intend to mount the file system.
    This directory is referred to as the mount point. The complete directory structure
    of the mounted file system can be found beneath this directory.


    In most cases, only the root user can mount and unmount directories. Removable
    media, such as floppy disks and CDs, can be changed by a normal user.


    To mount a file system, enter the command `mount`, specifying the device file
    and the directory to which the file system should be mounted.


    A file system can be removed again with the command `umount`. The file /etc/mtab,
    which is updated by the command mount, shows which file systems are currently
    mounted. It is possible to mount one file system at different positions.


    You can mount file systems in directories that are occupied. The existing contents
    of these directories, however, will no longer be accessible. After the file system
    is removed, this data becomes available again.


    You can also share certain directories with many computers. This approach is often
    used for the home directories of users, which are then located centrally on one
    machine and exported to other computers in the network.


    The following directories can be shared:


    | Table 5-9 | Directory | Description |

    | :--- | :--- | :--- |

    | /home | Home directories |

    | /opt | Applications |

    | /usr | The hierarchy below /usr |


    The following directories cannot be imported from other computers. They must always
    be located locally on each computer:


    | Table 5-10 | Directory | Description |

    | :--- | :--- | :--- |

    | /bin | Important programs |

    | /boot | Kernel and boot files |

    | /dev | Device files |

    | /etc | Configuration files |

    | /lib | Libraries |

    | /sbin | Important programs for system administration |


