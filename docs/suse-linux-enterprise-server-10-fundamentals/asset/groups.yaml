  - '[PAGE 273]


    # User and Group Configuration Files


    The Linux system stores all user and group configuration data in the following
    files:


    +   - /etc/passwd

    - /etc/shadow

    - /etc/group


    Whenever possible, you should not modify these files with an editor. Instead use
    the Security and Users modules provided in YaST or the command line tools described
    in "Manage User and Group Accounts From the Command Line" on 8-27.


    Modifying these files with an editor can lead to errors (especially in /etc/shadow),
    such as a user—including the user root—no longer being able to log in.


    # /etc/passwd


    The file /etc/passwd stores information for each user such as the user name, the
    UID, the home directory, and the login shell.


    In the past, /etc/passwd also contained the encrypted password. However, because
    the file needs to be readable by all (e.g., to show user and group names when
    using ls -l), the encrypted password is now stored in /etc/shadow, which is only
    readable by root and members of the group shadow.'
