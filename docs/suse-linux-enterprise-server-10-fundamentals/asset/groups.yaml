    # Modify Default Access Permissions


    If the default settings are not changed, files are created with the access mode
    666 and directories with 777.


    To modify (restrict) these default access mode settings, you can use the command
    umask. You use this command with a 3-digit numerical value as 022.


    The permissions set in the umask are removed from the default permissions.


    For example, entering umask 022 has the following result:


    # Table 8-5


    | | Directories | | | Files | | |

    |---|---|---|---|---|---||}{

    | Default Permissions | rwx | rwx | rwx | rw- | rw- | rw- |

    | | 7 | 7 | 7 | 6 | 6 | 6 |

    | umask | --- | -W- | -W- | --- | -W- | -W- |

    | | 0 | 2 | 2 | 0 | 2 | 2 |

    | Result | rwx | r-x | r-x | rw- | r-- | r-- |

    | | 7 | 5 | 5 | 6 | 4 | 4 |'
