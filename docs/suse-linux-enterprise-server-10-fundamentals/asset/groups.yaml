    ## 目标 1


    ### 了解 YaST


    YaST 是“Yet another Setup Tool”（另一个设置工具）的意思。作为 SUSE Linux Enterprise 管理员，你可以使用
    YaST 完成许多配置任务。


    YaST 用户界面可以有两种形式出现：


    + - ncurses。文本模式

