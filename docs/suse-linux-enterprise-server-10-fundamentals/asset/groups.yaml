  - '[PAGE 30]


    This coordination task is very complex and no operating system is able to implement
    an ideal solution. The classic problem involves a situation in which two or more
    processes exclusively need the same resources, as illustrated in the following
    resource conflict:


    # Figure 1-2


    ![](img/428e877abd09b1c11149d179d3458f12_30_0.png)


    The following describes the resource conflict:


    +   - Process A needs resources Res.1 and Res.2.

    - Process B needs resources Res.2 and Res.1.

    - Process A has received access to Res.1 and would now also like access to Res.2.
    In the meantime, however, B has already gained access to Res.2 and, in turn, would
    like access to Res.1 as well.


    If these two processes wait until they are available, nothing more will happen-they
    are deadlocked.


    Multithreading is an extension of multitasking, and helps solve this problem.
    In multithreading, a number parts independent from one another (threads) can be
    produced within a process. Multithreading increases the level of parallel processes
    with each thread needing to be administered, which makes the use of a multiprocessor
    system more valuable.'
