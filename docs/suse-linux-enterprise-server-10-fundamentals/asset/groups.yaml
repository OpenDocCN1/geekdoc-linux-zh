    | 类型 | 名称 | 描述 |

    | --- | --- | --- |

    | 0 | 回显应答 (Echo Reply) |  {答请求（类型 8）。 |

    | 3 | 目标不可达 (Destination Unreachable) | 无法到达目标（主机/网络/协议/端口）。 |

    | 4 | 源洪塞 (Source Quench) | 通知发送者路由器已过载。 |

    | 5 | 重定向 (Redirect) | 通知发送者有更短的路由。 |

    | 8 | 回显请求 (Echo Request) | ping 工具使用。 |

    | 11 | 超时 (Time Exceeded) | TTL 已达到零。 |

    | 12 | 参数问题 (Parameter Problem) | 数据报包含无效参数。 |

    | 13 | 时间戳请求 (Timestamp Request) | 用于时间同步。 |

    | 14 | 时间戳应答 (Timestamp Reply) | 对时间戳请求的响应。 |


    以下显示了数据包是如何构建的：


    [img/428e77abd091c1149d179d3458f12_363.png]


    以下描述了 IP 头部组件：


    - **类型 (8 位)：** 分类控制消息。

    - **代码 (8 位)：** 定义特定的子类型。

    - **校验和 (16 位)：** 用于错误检查。。

    - **数据偏移 (4 位)：** 指明数据部分开始的位置。

    - **预留 (4 位)：** 必须设置为 0。

    - **数据 (可变)：** 包含实际的消息负载。


