    # 目标 4


    # 创建和查看文件


    要创建和查看文件，你需要了解如何操作：


    - 使用 `touch` 创建新文件

    - 使用 `cat` 查看文件

    - 使用 `less` 查看文件

    - 使用 `head` 和 `tail` 查看文件


    # 使用 touch 创建新文件


    你可以使用 `touch` 命令更改文件的时间戳，或创建一个大小为 0 字节的新文件。以下是最重要的选项：


    | 命令 | 说明 |

    | --- | --- |

    | -a | 仅更改最后读取访问的时间（访问时间）。 |

    | -m | 仅更改最后修改的时间（修改时间）。 |

    | -r | 设置文件的时间戳而非当前时间。 |

    | -t | 代替当前时间，设置时间（结构：[[CC]YY]MMDDYYhhmm.ss [[世纪]年] 月 日 小时 分 [秒]，每项均为两位）。 |


    以下是使用 `touch` 的示例：


    ```

    geekoo@da51:-> ls

    bin Desktop Documents public_html public_html

    geekoo@da51:-> touch example

    geekoo@da51:-> ls

    bin Desktop Documents example public_html

    geekoo@da51:->

    ```


    # 使用 cat 查看文件


    你可以使用 `cat` 命令（连接）来查看文件内容。该命令必须包含你想查看的文件名，如下所示：


    ```

    geekoo@da51:-> cat /etc/HOSTNAME

    da51.digitalairirlines.com

    geekoo@da51:->

    ```


    # 使用 less 查看文件


    你可以使用 `less` 命令逐页显示文件内容。即使是压缩文件（如 .gz 和 .bz2）也可以显示。你可以在 `less` 中使用以下按键：


    | 表 5-14 快捷键 | 说明 |

    |---|---|

    | 空格键 | 向向下一屏。 |

    | b | 向上移动一屏。 |

    | 下箭头 | 向下移动一行。 |

    | 上箭头 | 向上移动一行。 |

    | /pattern | 从当前光标位置向前搜索模式。 |


    # 表 5-14 快捷键说明


    | 快捷键 | 说明 |

    | --- | --- |

    | ?pattern | 从当前光标位置向后搜索模式。 |

    | n | 移动到模式搜索中的下一个实例。 |

    | N | 移动到模式搜索中的上一个实例。 |

    | q | 退出。 |


    # 使用 head 和 tail 查看文件


    使用 `head` 命令可以查看文件的开头部分，使用 `tail` 命令可以查看文件的结尾部分。默认情况下，`head` 显示前 10 行，`tail` 显示后
    10 行。你可以使用 `-n` 参数来指定显示的行数，例如 `head -n 5` 显示前 5 行。


    # 练习 5-3 创建和查看文件


    在此练习中，你将练习如何使用 `touch`、`cat`、`less`、`head` 和 `tail` 命令。


    你可以在练习书中找到练习。


    （练习结束）


    # 操作文件和目录


    在此练习中，你将学习如何使用 `cp`、`mv` 和 `rm` 命令来操作文件和目录。


    你将学习以下内容：


    - 复制文件

    - 创建目录

    - 删除文件

    - 删除目录


    # 使用 cp 复制


    你可以使用 `cp` 命令（复制）复制文件或目录。命令格式如下：`cp [选项] 源文件 目标文件。以下是常用的选项：


    | 选项 | 说明 |

    | --- | --- |

    | -r | 递归复制（用于目录）。 |

    | -v | 显示复制信息。 |

    | -i | 交互式，在覆盖现有文件前提示。 |

    | -p | 保留文件的属性（权限、所有者等时间）。 |


    以下是使用 `cp` 的示例：


    ```

    geekoo@da51:-> ls

    file1.txt file2.txt

    geekoo@da51:-> cp file1.txt file3.txt

    geekoo@da51:-> ls

    file1.txt file2.txt file3.txt

    geekoo@da51:->

    ```


    # 使用 mv 移动或重命名


    你可以使用 `mv` 命令（移动）移动文件或目录，或者重命名它们。格式如下：`mv [选项] 源 目标。以下是常用选项：


    | 选项 | 说明 |

    | --- | --- |

    | -r | 递归移动（用于目录）。 |

    | -v | 显示移动信息。 |

    | -i | 交互式，在覆盖现有文件前提示。 |


    以下是使用 `mv` 的示例：


    ```

    geekoo@da51:-> ls

    file1.txt file2.txt

    geekoo@da51:-> mv file1.txt new_file.txt

    geekoo@da51:-> ls

    new_file.txt file2.txt

    geekoo@da51:->

    ```


    # 使用 rm 删除


    你可以使用 `rm` 命令（删除）删除文件或目录。**注意：删除操作是不可撤销的！**以下是常用选项：


    | 选项 | 说明 |

    | --- | --- |

    | -r | 递归删除（用于目录）。 |

    | -f | 强制删除，忽略不存在的文件且不提示。 |

    | -i | 交互式，在删除前提示。 |

    | -d | 删除空目录。 |


    以下是使用 `rm` 的示例：


    ```

    geekoo@da51:-> ls

    file1.txt file2.txt

    geekoo@da51:-> rm file1.txt

    geekoo@da51:-> ls

    file2.txt

    geekoo@da51:->

    ```


    # 练习 5-4 复制、移动和删除


    在此练习中，你将练习如何使用 `cp`、`mv` 和 `rm` 命令。


    你可以在练习书中找到练习。


    （练习结束）


    # 目标 5


    # 文件权限


    要管理文件权限，你需要了解以下内容：


    - 权限的类型（读、写、执行）

    - 权限范围（所有者、组、其他）

    - 使用 `chmod` 修改权限

    - 使用 `ls -l` 查看权限


    # 文件权限


    在 Linux 中，每个文件和目录都有三种权限：


    - 所有者（Owner）：文件的用户。

    - 组（Group）：属于该文件组的用户。

    - 其他（Others）：所有其他用户。


    每种类型都有三种权限：


    - 读 (r)：对于文件可以读取内容；对于目录可以列内容。

    - 写 (w)：对于文件可以修改内容；对于目录可以创建或删除文件。

    - 执行 (x)：对于文件可以作为程序运行；对于目录可以进入（cd）。


    # 使用 ls -l 查看权限


    使用 `ls -l` 命令可以看到文件的详细信息，包括权限。输出如下：


    ```

    -rw-r--r-- 1 user root 406 2024-03-29 12:31 file.txt

    -drwxr-xr-x 2 user root 4096 2024-03-29 12:32 directory

    ```


    在 `-rw-r--r--` 中：

    - 第一位是类型：`-` 表示文件，`d` 表示目录。

    - 接下来三位是所有者权限（`rw-`）。

    - 中间三位是组权限（`r--`）。

    - 最后三位是其他权限（`r--`）。


    # 使用 chmod 修改权限


    你可以使用 `chmod`（change mode）命令来更改文件的权限。有两种常用方法：数字法和符号法。


    ## 使用数字法修改权限


    每种权限都对应一个数字：


    - 读 (r) = 4

    - 写 (w) = 2

    - 执行 (x) = 1

    - 无权限 = 0


    通过将这三个数字相加，可以得到权限值。例如，7 (4+2+1) 代表 `rwx`，6 (4+2+0) 代表 `rw-`，5 (4+0+1) 代表 `r-x`。


    格式：`chmod 数字数字数字 文件名`


    例如：`chmod 755 file.txt` 会赋予所有者全部权限，赋予组和其他用户用户读和执行权限。


    ## 使用符号法修改权限


    符号法使用字符来表示权限的更改：


    字体 范围：`u` (所有者)、`g` (组)、`o` (其他)、`a` (所有)

    - 操作：`+` (添加)、`-` (移除)、`=` (设置)

    - 权限：`r` (读)、`w` (写)、`x` (执行)


    格式：`chmod 范围操作权限 文件名`


    例如：`chmod u+x file.txt` 为所有者添加执行权限。`chmod g-w file.txt` 移除组的写权限。


    # 练习 5-5 文件权限


    在此练习中，你将练习如何使用 `ls -l` 和 `chmod` 命令。


    你可以在练习书中找到练习。


    （练习结束）


    '
