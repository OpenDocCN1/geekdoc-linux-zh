    ## Objective 1


    ## The History of Linux


    Linux is closely related to the UNIX operating system. To understand the history
    of Linux, you need to know the following:


    - The Historical Development of UNIX

    - The Development of Linux

    - The Software Differences Between SUSE Linux and SUSE Enterprise Server


    ## The Historical Development of UNIX


    At the end of the 1960s, most operating systems were only designed for batch operations.
    If you wanted to run a program, you inserted a pile of punch cards or a roll of
    perforated strips into a reading device and waited until the result was a printer.


    If there was an error in the program or if you did not get the required result,
    you had to rewrite the perforated roll or replace one or several punch cards,
    reread the stack, and wait for the result.


    This procedure was long-winded and inefficient which led computer developers to
    look for a way to allow a number of users to simultaneously use a dialog-oriented
    way of working with the system.


    MULTICS was one of the first programs created to meet this demand. It allowed
    you to work in a dialog with the computer, but it was still strongly influenced
    by the batch operation, and it was difficult to operate.


    In 1969, one of the MULTICS developers, Ken Thompson, began creating an operating
    system that, apart from a dialog-oriented operation, aimed to provide a high functionality
    and structural simplicity.


    The first version of UNIX was written in Assembler, a programming language close
    to the machine-level. To be machine-independent in its further development, UNIX
    was rewritten in 1971 in the programming language C, developed by Dennis Ritchie.


    Because Bell Laboratories (a subsidiary company of AT&T) provided documentation
    and the source text of UNIX universities almost at cost, the system spread relatively
    quickly.


    The simple operation of the system, the almost unlimited availability of the source
    text, and its relative portability motivated many users and companies to become
    actively engaged in the development, so functionalities were very quickly added
    to UNIX and it reached a very high level of maturity.


    At the same time, a series of commercial UNIX derivatives arose including versions
    from IBM, DEC, and HP (HP-UX, 1982), as well as BSD UNIX (Berkeley Software Distribution,
    1978), developed by the University of California in Berkeley.


    In 1983, AT&T began marketing UNIX System V through its sister company USL, proclaiming
    System V as “the” UNIX standard.


    As a consequence of this, the licensing of UNIX changed considerably, leading
    among other things, a long-lasting legal battle with BSD. At the same time, with
    never-ending quarrels between UNIX vendors, a genuine standardization of the UNIX
    operating system family was prevented.


    Modern UNIX operating systems can still be separated as either more System V or
    more BSD types, although there are no “pure” systems of one or the other kind.


    Linux tries to combine the best from both worlds.


    As Linux is written in C, it is available for a lot of different hardware platforms,
    including the following:


    - Intel/AMD: 32 bit

    - Intel/AMD: 64 bit

    - PowerPC (Macintosh, RS/6000)

    - SPARC (Sun)

    - IBM pSeries

    - IBM zSeries (S/390)

    - Embedded


    ## The Development of Linux


    In the spring of 1991, the Finnish student Linus Benedict Torvalds began to develop
    a UNIX-like operating system for his PC.


    A few months later he had developed a rudimentary kernel which he passed on as
    a source text to others who were interested via the Internet with the following
    message:


    | From: torvalds@klaava.Helsinki.FI (Linus Benedict Torvalds) |

    | Newsgroups: comp.os.minix |

    | Subject: What would you like to see at most in minix? |

    | Summary: small poll for my new operating system |

    | Message-ID: <1991Aug25.205708.9541@klaava.Helsinki.FI> |

    | Date: 25 Aug 91 20:57:08 GMT |

    | Organization: University of Helsinki |

    | Hello everybody out there using minix - |

    | I''m doing a (free) operating system (just a hobby, won''t be big and professional
    line gnu) 386(486) clones. This has been brewing since april, and is starting
    to get ready. I''d like any feedback on things people like/dislike in minix, as
    my OS resembles it somewhat (same physical layout of the file-system (due to practical
    reasons) among other things). |

    | I''ve currely ported bash(1.08) and gcc(1.40), and things seem to work. This
    implies that I''ll get something practical within a few months, and I''d like
    to know what features people would want. Any suggestions are welcome, but I won''t
    promise I''ll implement them :- |

    | Linus (torvalds@kruuna.helsinki.fi) any minix code, and it has a multi-threaded
    fs. It is not portable (uses 386 task switching etc.), and it probably never will
    support anything other than AT-harddisks, as that''s all I have :-:- |


    Linus Torvalds made the source code of his Linux kernel available with the GPL
    (GNU General Public License). The GPL allows everyone to read and edit the source
    code. The GPL license also requires any edited source code to be made available
    to the public.


    Linux rapidly developed into a project involving many people, although the development
    of the system''s core (Linux kernel) is still coordinated by Linus Torvalds. All
    kernel modifications are integrated by him.


    The functions of the kernel include input and output control, device control,
    process management, and file management. Other system components (shell utilities,
    network programs, and implementations of the kernel for non-Intel processors)
    are looked after by other people or groups.


    ## The Software Differences Between SUSE Linux and SUSE Linux Enterprise Server


    SUSE Linux Enterprise Server 10 is based on the SUSE Linux 10.1 distribution.
    The time between release of distribution and release of SUSE Linux Enterprise
    Server is used for intensive testing and applying patches which improve security
    and stability of the system.


    Additionally, SUSE Linux Enterprise Server contains some features which will be
    made available in future versions of the SUSE Linux distribution.


    The following illustrates the relationships between open source code, SUSE Linux
    and SUSE Linux Enterprise Server:


    ## Figure 1-1


    ![](img/428e877abd09b1c11149d179d3458f12_28_0.png)


    SUSE Linux Enterprise Server 10 has fewer packages (about 1,000) than the SUSE
    Linux distribution (about 3,500). Most packages have been removed as desktop applications.


    SUSE Linux Enterprise Server has a guaranteed life cycle of seven years. During
    this time, you are provided patches and fixes that help you maintain SUSE Linux
    Enterprise Server. In addition, you can choose from a range of support offers.


    Only the SUSE Linux Enterprise Server product is certified by independent hardware
    and software vendors.


    ## Objective 2 Understand the Multiuser Environment


    One of the goals of UNIX was to enable a number of users to use the system simultaneously
    (multiuser capability).


    Because several users might also want to use several different programs simultaneously,
    mechanisms must be available to allow these programs to run simultaneously (multitasking
    capability).


    The implementation of a multiuser and multitasking system appears to be simultaneous
    in a single processor system, but this is only possible in a multiprocessor system.


    Even in a single-processor system, advantages can be gained through multitasking
    because waiting times for input or output from processes can be reduced for other
    processes.


    UNIX implements preemptive multitasking—each process is allowed a maximum time
    which it can work. When this time has expired, the operating system takes processor
    away from the process and assigns it to another process waiting to run.


    Other operating systems (such as versions older than the MAC version X) do not
    intervene in this process cycle. Instead, control over the processor must be released
    by the running process before another process can run.


    This can lead to one process hijacking the processor, leaving other processes
    without processing time and blocking the system.


    The operating system coordinates access to the resources available in the system
    (hard drives, tapes, interfaces). If there is competition among processes, e.g.,
    for access to a tape device, only one process can be granted access. The others
    must be rejected.

    '
