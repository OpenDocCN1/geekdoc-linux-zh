    - **窗口 (16 位)。** 该分段发送端愿意接收的数据字节数，从确认字段中指示的那个字节开始计数。


    - **校验和 (16 位)。** 包含来自 IP 头部、TCP 头部和数据的伪首部信息的补码和，并根据需要在其末尾填充 0 字节，使其成为 2 字节的倍数。


    伪首部包含源地址、目的地址、IP 协议类型和总长度。


    - **紧急指针 (16 位)。** 如果设置了 URG 位，则此字段指向紧急数据序列中最后一个字节的的序列号。


    - **选项 (0–44 字节)。** 占据 TCP 头部末尾的空间。所有选项都包含在校验和中。


    - **填充。** TCP 头部必须用 0 填充，以使头部长度成为 32 位的倍数。


    由于 TCP 是一种面向连接的字节流协议，因此在传输数据之前，需要建立客户端-服务器对话连接。


    建立此连接的过程被称为 TCP 握手或三次握手，如下所示：


    # 图 B-19


    | 客户端 | 服务器 |

    |---|---|

    | 请求 | SYN (400) 同步标志 序列号 400 |

    | 确认请求 | SYN (600) 同步标志 序列号 400 |

    | | ACK (401) 确认标志 序列号 400 + 1 |

    | 数据 | ACK (601) 确认标志 序列号 600 + 1 |


    以下描述了 TCP 握手过程：


    1. 客户端向服务器发送一个设置了 SYN 标志的 TCP 包。这告诉服务器客户端想要同步连接。SYN 标志用于同步连接。

    2. 如果对方接受连接，服务器接收数据包并提取序列号 (400)。

    3. 服务器向客户端发送一个设置了 SYN 标志的 TCP 包（序列号为 600）以及一个带有序列号 401 的 ACK 标志（客户端 SYN +1）。


    通过这种方式，服务器确认了对客户端数据包的接收，并告诉客户端它想要同步连接。


    4. 客户端接收数据包，知道服务器已准备好传输数据。


    它开始传输第一个数据包，该数据包的 ACK 标志设置为序列号 601（服务器-SYN +1），确认接收了服务器的最后一个 TCP 包。


    5. 所有额外的数据包都以这种方式在客户端和服务器之间交换，每次序列号增加 1。


    如果客户端或服务器关闭连接，将发生额外的 TCP 握手。


    在传输最后 3 个数据包期间，FIN 标志将代替 SYN 标志，标志着传输的结束。


    # 用户数据报协议 (UDP)


    用户数据报协议 (UDP) 是一种不可靠的、无连接的数据报协议。UDP 的主要任务是为网络提供一种简单且快速的数据传输方式。


    在这种情况下，“不可靠”意味着 UDP 没有保证数据报交付的机制。使用 UDP 的应用程序必须在应用层实现自己的例程，以确保数据的正确传输。


    “无连接”意味着在传输 UDP 数据报时不建立计算机之间的连接。相反，UDP 数据报由发送者直接发送，目的机器不进行进一步的检查。


    以下显示了如何构造 UDP 数据包头部（RFC 0768）：


    # 图 B-20


    | 位特 | 0 | 4 | 8 | 12 | 16 | 20 | 28 | 32 |

    |---|---|---|---|---|---|---|---|---|

    | 源端口 | | | | | | 目的端口 | | |

    | 长度 | | | | | 校验和 | | | |

    | 数据 | | | | | | | | | |


    以下描述了 UDP 数据包头部的字段：


    - **源端口 (16 位)。** 发送者的端口。这是一个可选字段。

    - **目的端口 (16 位)。** 接收者的端口。

    - **长度 (16 位) (以字节)。** UDP 头部和封装数据的长度。最小值为 8。

    - **校验和 (16 位)。** 包含来自 IP 头部、UDP 头部和数据的伪首部信息的补码和。


    校验和根据需要在其末尾填充 0 字节，使其成为 2 字节的倍数。


    UDP 发送的独立单元被称为数据报。UDP 主要用于需要快速、高效协议来传输数据的场景。


    在某些情况下，通过 TCP 发送数据包并不划算，因为由于 TCP 头部较大，传输的经济性明显较低。


    # 端口与端口号


    为了使特定服务能够寻址，传输层的通信通过端口进行。由于端口号长度为 16 位，因此最多有 65536 个不同的端口。


    为了简化通信并避免冲突，互联网数字分配机构 (IANA) 为广泛使用的的服务分配了固定端口号（周知端口）。


    所有重要的网络服务都运行在特权端口上（0 到 1023）。它们被称为“特权”端口，是因为关联的服务必须以 root 权限启动。高端口（1024 到 65535）是非特权端口。以下列出了在
    IANA 注册的一些周知端口：


    - FTP. 端口 20, 21

    - SSH. 端口 22

    - Telnet. 端口 23

    - SMTP. 端口 25

    - DNS. 端口 53

    - HTTP. 端口 80

    - POP3. 端口 110

    - NNTP. 端口 119

    - NETBIOS. 端口 139

    - IMAP. 端口 143

    - SNMP. 端口 161


    对于 TCP 和 UDP，端口号是单独分配的。例如，端口 4912 用于 UDP 指定不同的服务。几乎所有的 Internet 服务都是根据客户端-服务器原则构建的，在
    Linux 计算机上，通常有很多守护进程同时运行，它们都在等待接入连接。有关常用服务的端口列表，请查看 `/etc/services`。


