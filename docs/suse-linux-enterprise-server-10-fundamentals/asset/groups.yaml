    # Objective 4


    # Create and View Files


    To create and view files, you need to know how to do the following:


    - Create a New File with touch

    - View a File with cat

    - View a File with less

    - View a File with head and tail


    # Create a New File with touch


    You can use the command touch to change the time stamp of a file or create a new
    file with a size of 0 bytes. The following are the most important options:


    | Command | Description |

    | --- | --- |

    | -a | Changes only the time of the last read access (access time). |

    | -m | Changes only the time of the last modification (modification time). |

    | -r | Sets the time stamp of file instead of the current time. |

    | -t | Instead of the current time, sets time (structure: [[CC]YY]MMDYYhhmm.ss
    [[Century]Year] Month Day Hour Minute [Seconds], two digits in each case)). |


    The following is an example of using touch:


    ```

    geekoo@da51:-> ls

    bin Desktop Documents public_html

    geekoo@da51:-> touch example

    geekoo@da51:-> ls

    bin Desktop Documents example public_html

    geekoo@da51:->

    ```


    # View a File with cat


    You can use the command cat (concatenate) to view the contents of a file. The
    command must include the filename of the file you want to see, as in the following:


    ```

    geekoo@da51:-> cat /etc/HOSTNAME

    da51.digitalairirlines.com

    geekoo@da51:->

    ```


    # View a File with less


    You can use the command less to display the contents of a file page by page. Even
    compressed files (such as .gz and .bz2) can be displayed. You can use the keystrokes
    with less:


    | Table 5-14 Keystroke | Description |

    |---|---|

    | Spacebar | Move one screen down. |

    | b | Move one screen up. |

    | Down arrow | Move one line down. |

    | Up arrow | Move one line up. |

    | /pattern | Search for pattern forward from current cursor position. |


    # Table 5-14 Keystroke Description


    | Keystroke | Description |

    | --- | --- |

    | ?pattern | Search for pattern backwards from current cursor position. |

    | n | Move to the next instance in search for pattern. |

    | N | Move to the previous instance in search for pattern. |

    | q | Quit. |


    # View a File with head and tail


    With the command head, you can view only the first few lines of a file. The command
    tail shows you only the last lines of a file.


    By default, these commands show ten lines. To change these number, append the
    option -number.


    When used with tail, the option -f displays a continuously updated view of the
    last lines of a file. If a line is added to the end of the file while tail -f
    is running, the line is displayed. This is a very useful feature for observing
    log files. To exit tail -f press Ctrl+C.


    Following is an example of using the command head:


    ```

    geeko@da51:-> head /usr/share/doc/release-notes/SUSE_Linux_Enterprise_Server_10/RELEASE-NOTES.html

    Release Notes for SUSE Linux Enterprise Server 10 cover the following:

    - General: Information that everybody should read.

    - Update: Explains changes not mentioned in the Admin Guide.

    - Installation: Additional information for Installation.

    - Technical: These sections contains technical changes and enhancements for experienced
    users.

    ```


    # Exercise 5-3


    # Create and View Files


    In this exercise you practice creating an empty file and viewing the content of
    a file. You use the commands touch, cat, less, head and tail. You will find this
    exercise in the workbook.


    (End of Exercise)


    # Work with Files and Directories


    In this objective learn how to do the following with files:


    - Copy and Move Files and Directories

    - Create Directories

    - Delete Files and Directories

    - Link Files


    # Copy and Move Files


    To copy and move files and directories, you need to know how to do the following:


    - Move Files with mv

    - Copy Files with cp


    # Move Files with mv


    You can use the command mv (move) to move one or more files to another directory,
    as in the following:


    ```

    mv *.txt /tmp

    ```


    You can also use the command mv to rename a file, as in the following:


    ```

    mv recipe new_recipe

    ```


    The following are some options you can use with mv:


    | Table 5-15 | Option | Description |

    |---|---|---|

    | -i | Asks for confirmation before moving or renaming a file. This prevents existing
    files with the same name from being overwritten. |

    | -u | Only moves files that are newer than the target files of the same name.
    |


    # Copy Files with cp


    You can copy files and directories (using the option -r) with the command cp (copy).
    The syntax for using cp is:


    cp source destination**


    When using the command cp, you need to remember the following:


    - The command cp overwrites existing files without confirmation.

    - You can avoid automatic overwriting by using the option -i. This option requires
    confirmation before overwriting.

    - If you want to copy just the contents of a directory (without the directory
    itself), the target directory must already exist. An example is making a backup
    copy of a directory using a different name.


    For example, to copy the directory /tmp/quarterly-1/ with all its subdirectories
    to the directory /tmp/expenses/ (which already exists), you would enter the following:


    cp -R /tmp/quarterly-1 /tmp/expenses**


    The result is a directory /tmp/expenses/quarterly-1/.


    # SUSE Linux Enterprise Server 12 Fundamentals


    To copy the contents of the directory proposals/ (all the files contained in it,
    including hidden files and subdirectories) to the directory proposals_old/ (this
    must already exist), you would enter the following:


    ```

    geeko@da51:- > ls -a proposals

    .. .hidden quarterly-1 quarterly-2 quarterly-3 quarterly-4

    geeko@da51:- > cp -r proposals/. proposals_old

    geeko@da51:- > ls -a proposals_old

    .. .hidden quarterly-1 quarterly-2 quarterly-3 quarterly-4

    ```


    To avoid copying the hidden files, you would enter the following:


    ```

    geeko@da51:- > cp -r proposals/* proposals_old

    geeko@da51:- > ls -a proposals_old

    .. quarterly-1 quarterly-2 quarterly-3 quarterly-4

    ```


    You can use the following options with cp:


    | Table 5-16 | Option | Description |

    | :--- | :--- | :--- |

    | -a, --archive | Copies a directory and subdirectories (compare -R); symbolic
    links, file permissions, owners, and time stamps are not changed. |

    | --help | Displays the options of cp. |

    | -i, --interactive | Asks before overwriting. |

    | -R, -r, --recursive | Copies directories recursively (the directory and any
    subdirectories). |

    | -s, --symbiotic-link | Makes symbolic links instead of copying |

    | -l, --link | Links files instead of copying them. |

    | -u, --update | Copies a file only when the source file is newer than the destination
    file or when the destination file is missing. | |


