    \ |\n| --name pattern | Searches for files whose names contain the pattern. If\
    \ the pattern contains meta characters (see table \"Character\" on 5-64) or wild\
    \ cards, it must be enclosed by quotation marks. Otherwise it will be interpreted\
    \ by the shell and not. |\n| --size pattern | Matches files that are above or\
    \ below a certain size. As an argument, the size (in blocks of 512 bytes) is given.\
    \ The suffix \"c\" switches to bytes and \"k\" to blocks of 1024 bytes. A preceding\
    \ \"+\" stands for all larger files and a \"-\" for smaller sizes. |\n| --type\
