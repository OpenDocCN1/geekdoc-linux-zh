    # Objective 4


    # Understand Command Syntax and Special Characters


    You can use specific characters to provide special functionality. Using them can
    save you a lot of time and effort. In this objective, you will will learn about
    the following:


    - Select your Character Encoding

    - Expansion Using Patterns

    - Prevent the Shell from Interpreting Special Characters


    SUSE Linux Enterprise Server is internationalized and can be adapted to local
    standards easily. There are some variables that determine localization. Use the
    command `locale` to get a list of localization variables.


    ```

    geeko@da51:-> locale

    LANG=en_US.UTF-8

    LC_CTYPE=en_US.UTF-8

    LC_NUMERIC=en_US.UTF-8

    LC_TIME=en_US.UTF-8

    LC_COLLATE=en_US.UTF-8

    LC_MONETARY=en_US.UTF-8

    LC_MESSAGES=en_US.UTF-8

    LC_PAPER=en_US.UTF-8

    LC_ADDRESS=en_US.UTF-8

    LC_TELEPHONE=en_US.UTF-8

    LC_MEASUREMENT=en_US.UTF-8

    LC_IDENTIFICATION=en_US.UTF-8

    LC_ALL=en_US.UTF-8

    geeko@da51:->

    ```


    The LANG variable specifies the language. In this example the language is set
    to English. The characters are encoded in UTF-8 (UCS Format), which means (Universal
    Character Set). Unicode has the advantage that it is possible to use all kind
    of letters not only Latin letters. All users SUSE Linux server uses UTF-8 encoding.
    The exception is user root.


    The LANG variable is set to POSIX, which means the characters are ASCII. The state
    of the LANG variable is important for this section, because the results depend
    on the type of encoding. The order of the characters is different in POSIX and
    in UTF-8. The behavior of POSIX encoding is much more intuitive here and we recommend
    setting the LANG variable to POSIX for this section.


    For user root:


    ```

    da51:- # locale

    LANG=POSIX

    LC_CTYPE=POSIX

    LC_NUMERIC=POSIX

    LC_TIME=POSIX

    LC_COLLATE=POSIX

    LC_MONETARY=POSIX

    LC_MESSAGES=POSIX

    LC_PAPER=POSIX

    LC_ADDRESS=POSIX

    LC_TELEPHONE=POSIX

    LC_MEASUREMENT=POSIX

    LC_IDENTIFICATION=POSIX

    LC_ALL=POSIX

    da51:~ #

    ```


    You can see the differences between UTF-8 and POSIX encoding, when you use the
    ls command. For user Geeko, the content of the directory /usr/share/doc/packages/yast2-users/
    looks like this:


    ```

    geeko@da51:~$ ls -1 /usr/share/doc/packages/yast2-users/

    total 65

    drwxr-xr-x 2 root root 1352 2006-06-02 15:42 autodocs

    -rw-r---- 1 root root 17992 2006-01-27 00:34 COPYING

    -rw-r---- 1 root root 17992 2006-01-27 00:34 COPYING.english

    -rw-r---- 1 root root 75 2006-01-27 00:34 README

    -rw-r---- 1 root root 193 2005-09-08 02:36 TDO.txt

    -rw-r---- 1 root root 9583 2005-09-08 02:36 users.html

    geeko@da51:~$

    ```


    For user root output:


    ```

    da51:~$ ls -1 /usr/share/doc/packages/yast2-users/

    total 79

    drwxr-xr-x 3 root root 248 Feb 2 15:42

    drwxr-xr-x 492 root root 13976 Feb 2 16:02

    -rw-r---- 1 root root 17992 Jan 27 00:34 COPYING

    -rw-r---- 1 root root 17992 Jan 27 00:34 COPYING.english

    -rw-r---- 1 root root 75 Jan 25 08:36 README

    -rw-r---- 1 root root 193 Sep 8 02:36 TDO.txt

    drwxr-xr-x 2 root root 1352 Feb 2 15:42 autodocs

    -rw-r---- 1 root root 2013 Sep 8 02:36 crack.html

    -rw-r---- 1 root root 9583 Sep 8 02:36 users.html

    da51:~$ #

    ```


    The first file in the list of the normal user is autodocs. The first file in the
    list of user root is COPYING.


    In the POSIX encoding table all the lowercase characters are behind the uppercase
    characters. In UTF-8 the lowercase “a” follows the uppercase “A” immediately.
    This means, between “A” and “C” in POSIX, the only character is “B”. But in UTF-8,
    there are “a”, “B” and “b” in between.


    # Name Expansion Using Search Patterns


    Occasionally, you might want to perform operations on a series of files without
    having to name all files. In this case, you could make use of the following search
    patterns:


    | Search Pattern | Description |

    |---|---|

    | ? | Any single character (except "/") |

    | * | Any string length, including zero characters (except "*" at the beginning
    of a file name and "/") |

    | [0-9] | Any of the characters enclosed (here: numbers from 0 to 9). |

    | [a-ek-s] | Any character from the ranges a-e and k-s. |

    | [abcdef] | Any of these characters. |

    | [abc] | None of these characters. |


    Some of the search patterns have a different meaning than they have as regular
    expressions.


    To change the locale variables permanently, you have to edit the file /etc/sysconfig/language.
    The functionalities of the other variables are described in that file. Further
    information you can find in the man page of locale (man locale).


