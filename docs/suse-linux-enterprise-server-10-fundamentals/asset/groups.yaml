  mdcn: "\n\n这种协调任务非常复杂，没有哪个操作系统能够实现理想的解决方案。经典问题涉及两个或多个进程排他需要相同资源的情况，如下方的资源冲突所示：\n\
    \n# 图 1-2\n\n![](img/428e877abd09b1c11149d179d3458f12_30_0.png)\n\n以下描述了该资源冲突：\n\
    \n- 进程 A 需要资源 Res.1 和 Res.2。\n- 进程 B 需要资源 Res.2 和 Res.1。\n- 进程 A 已获得 Res.1 的访问权限，现在也想获得\
    \ Res.2。但此时，B 已经获得了 Res.2 的访问权限，并且也想获得 Res.1 的访问权限。\n\n如果这两个进程一直等待资源可用，将什么都不会发生————它们陷入了死锁。\n\
    \n多线程是多任务的扩展，有助于解决这个问题。在多线程中，可以在一个进程内产生若干个相互独立的部分（线程）。多线程增加了并行进程的级别，每个线程都需要被管理，这使得多处理器系统的价值更高。\n\
    \n在这里应该对程序和进程做出明确区分：按照规定，程序在系统中只存在一次，但可以有多个进程执行同一个程序。\n\n当有多个用户活跃时，程序和进程可以相互独立使用（例如用于显示目录的程序）。\n\
    \n# 目标 3\n\n## 执行 SUSE Linux Enterprise Server 10 的简单安装\n\n安装 SUSE Linux Enterprise\
    \ Server 10 的过程可以分为以下步骤：\n\n- 安装前要求和指南\n- 安装选项\n- 基础安装\n- 配置\n\n## 安装前要求和指南\n\n\
