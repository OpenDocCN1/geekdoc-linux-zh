    # Transmission Control Protocol (TCP)


    The Transmission Control Protocol (TCP) is a reliable, connection-oriented, byystream
    protocol.


    The protocol was originally defined in RFC 793. Over the course of time, these
    definitions were improved by removing errors and inconsistencies (RFC 1122) and
    expanded with a number of requirements (RFC 1323).


    The main task of TCP is to provide secure transport of data through the network.


    TCP provides reliability of the data transfer with a mechanism referred to as
    Positive Acknowledgement with Retransmission (PAR).


    The sending system repeats the transfer of data until until it receives positive
    confirmation from the receiver that the data has been received.


    The data exchanged between the sending and receiving TCP units are called packets.
    A TCP packet consists of a protocol header, at least 20 bytes in size, and data
    to transmit.


    Each of these packets includes a checksum by means of which the receiver can check
    to see if the data is error-free.


    In the case of an error-free transmission, the receiver sends a confirmation of
    receipt to the sender. Otherwise, the packet is discarded and no confirmation
    of receipt is sent.


    If, after a specific length of time (timeout period) no receipt has arrived, the
    sender resends the packet in question.'
  - '[PAGE 366]


    # Figure B-18


    The following shows how a TCP packet header is constructed:


    | | 0 | 4 | 8 | 12 | 16 | 20 | 24 | 28 | 32 |

    |--- |--- |--- |--- |--- |--- |--- |--- |--- |---|

    | | Source Port | | | | | Destination Port | | |

    | | | Sequence Number | | | | | | |

    | | | Acknowledgement Number | | | | | | | |

    | Data Offset | Reserved | Control Bit | Window | | | | |

    | | | Checksum | | | Urgent Pointer |

    | | | Options | | | | Padding |

    | | | | Data | | | | | |


    The following describes the components of a TCP packet header:


    +   - **Source Port (16 bits).** Specifies the port of the sender.

    - **Destination Port (16 bits).** Specifies the port of the receiver.

    - **Sequence Number (32 bits).** Sequence number of the first data byte in this
    segment.

    - If the SYN bit is set, the sequence number is the initial sequence number and
    the first data byte is the sequence number +1.

    - **Acknowledgement Number (32 bits).** If the ACK bit is set, this field contains
    the value of the next sequence number the sender of the segment is expecting to
    receive.

    - Once a connection is established, this is always sent.

    - **Data Offset (4 bits).** Indicates where the data begins. The length of the
    TCP header is always a multiple of 32 bits.

    - **Reserved (4 bits).** Must be set to zero.

    - **Control Bit (6 bits).** For example, it can be ACK, SYN, FIN.'
- md: '

    - **Window (16 bits).** The number of data bytes, beginning with the one indicated
    in the acknowledgement field, that the sender of this segment is willing to accept.


    - **Checksum (16 bits).** The complement sum of a pseudoheader of information
    from the IP header, TCP header, and the data, padded as needed with 0 bytes at
    the end to make a multiple of 2 bytes.


    The pseudoheader contains the source address, destination address, IP protocol,
    and total length.


    - **Urgent Pointer (16 bits).** If the URG bit is set, this field points to the
    sequence number of the last byte in a sequence of urgent data.


    - **Options (0–44 bytes).** Occupies space at the end of the TCP header. All options
    are included in the checksum.


    - **Padding.** The TCP header must be padded with zeros to make the header length
    a multiple of 32 bits.


    Because TCP is a connection-oriented byte-stream protocol, a client-server dialog
    connection is required before data can be transmitted.


    The process of setting up this connection is referred to as the TCP handshake
    or three-way handshake, as shown in the following:


    # Figure B-19


    | Client | Server |

    |---|---|

    | Request | SYN (400) SYNchronize Flag Sequence No. 400 |

    | Confirm the Request | SYN (600) SYNchronize Flag Sequence No. 400 |

    | | ACK (401) ACKnowledge Flag Sequence No. 400 + 1 |

    | Data | ACK (601) ACKnowledge Flag Sequence No. 600 + 1 |


    The following describes the TCP handshake process:


    1. The client sends a TCP packet to the server with the SYN flag set. This tells
    the server that the client wants to synchronize a connection. The SYN flag is
    used to synchronize the connection.

    2. If the opposite side accepts the connection, the server receives the packet
    and takes out the sequence number (400).

    3. The server sends a TCP packet to the client with a SYN flag set (with sequence
    number 600) and an ACK flag with sequence number 401 (Client SYN +1).


    With this, the server acknowledges the receipt of the client packet and tells
    the client that it wants to synchronize the connection.


    4. The client receives the packet and knows that the server is ready for data
    transmission.


    It starts the transmission of the first data packet in which the ACK flag is set
    with the sequence number 601 (Server-SYN +1), acknowledging the receipt of the
    last TCP packet from the server.


    5. All additional packets are exchanged in this way between client and server,
    increasing the sequence number by 1 time.


    If the client or the server closes the connection, an additional TCP handshake
    takes place.


    During the transmission of the last 3 packets, the FIN flag will be set instead
    of the SYN flag, signaling the end of the transmission.


    # User Datagram Protocol (UDP)


    The User Datagram Protocol (UDP) is an unreliable, connectionless datagram protocol.
    The main task of UDP is to make available a simple and fast transport of data
    available through the network.


    In this case, “unreliable” means that UDP has no mechanism to guarantee the delivery
    of a datagram. Applications that use UDP must implement their own routines on
    the application layer for guaranteeing the correct transmission of data.


    “Connectionless” means that no computer-to-computer connection is established
    for transmitting UDP datagrams. Instead, UDP datagrams are sent by the sender
    without the destination machine making any further checks.


    The following shows how a UDP packet header is constructed (RFC 0768):


    # Figure B-20


    | Bits | 0 | 4 | 8 | 12 | 16 | 20 | 28 | 32 |

    |---|---|---|---|---|---|---|---|

    | Source Port | | | | | | Destination Port | | |

    | Length | | | | | Checksum | | |

    | Data | | | | | | | | |


    The following describes the components of a UDP packet header: field.


    - **Source Port (16 bits).** Port of the sender. This is an optional field.

    - **Destination Port (16 bits).** Port of the receiver.

    - **Length (16 bits) (In Bytes).** Length of the UDP header and the encapsulated
    data. The minimum value is 8.

    - **Checksum (16 bits).** Consists of the complement sum of pseudoheader of information
    from the IP header, UDP header, and the data.


    The checksum is padded as needed with 0 bytes at the end to make a multiple of
    2 bytes.


    Individual units sent by UDP are called datagrams. UDP is mainly used where a
    rapid and efficient protocol is needed to transfer data.


    In certain cases, it is not worth the trouble involved when sending packets by
    TCP, as the transmission is considerably less economical due to the larger size
    of the TCP header.


    # Ports and Port Numbers


    To enable specific services to be addressed, communication on the transport layer
    is carried out through ports. Because port numbers are 16 bits in length, there
    is a maximum of 65536 different ports.


    To simplify communication and to avoid collisions, fixed port numbers (well-known
    ports) are assigned by the Internet Assigned Numbers Authority (IANA) for widely-used
    services.


    All important network services run on privileged ports (from 0 to 1023). They
    are referred to as “privileged” because the associated services must be started
    with root permissions. The upper ports (from 1024 to 65535) are nonprivileged
    ports. The following lists some well-known ports registered with IANA:


    - FTP. Ports 20, 21

    - SSH. Port 22

    - Telnet. Port 23

    - SMTP. Port 25

    - DNS. Port 53

    - HTTP. Port 80

    - POP3. Port 110

    - NNTP. Port 119

    - NETBIOS. Port 139

    - IMAP. Port 143

    - SNMP. Port 161


    For TCP and UDP, the port numbers are assigned separately. For example, port 4912
    for UDP can specify a different service from the same port number for TCP. Almost
    all Internet services are constructed according to client-server principle—each
    service has a server, and one or more clients access it. On a Linux computer,
    there are normally a variety of daemons running simultaneously, which are all
    waiting for incoming connections. For a table listing the port numbers of frequently
    used services, see `/etc/services`.


