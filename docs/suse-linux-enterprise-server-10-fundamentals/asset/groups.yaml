    \ | :--- | :--- | :--- | :--- | :--- |\n\nNote the following about the fields\
    \ in each line:\n\n- **User name.** This is the name a user enters to log in to\
    \ the system (login name).\n- **Password.** The x in this field means that the\
    \ password is stored in the file /etc/shadow.\n- **UID.** In compliance with the\
    \ Linux standards, there are three number ranges which are reserved:\n  - 00–99\
    \ for the system itself\n  - 100–499 for special system users (such as services\
    \ and programs)\n  - Normal users start from UID 1000.\n- **GID.** Number of the\
    \ group. In compliance with the Linux standards, there are two number ranges which\
    \ are reserved:\n  - 00–99 for special system groups (such as services and programs)\n\
    \  - Normal groups start from GID 100.\n- **Comments field.** Normally, the full\
    \ name of the user is stored here. Information such as a room number or telephone\
    \ number can also be stored here.\n- **Home directory.** The personal directory\
    \ of the user is normally in the directory /home and has the same name as the\
    \ user (login name).\n- **Login shell.** This is the shell that is started for\
    \ a user after he has successfully logged in. In Linux this is normally /bin/bash\
    \ (Bourne Again Shell).\n\nThe shell must be listed in the file /etc/shells.\n\
    \nFor additional information on this file, enter man 5 passwd.\n\n## /etc/shadow\n\
    \nThe /etc/shadow file stores encrypted user passwords and password expiration\
    \ information. Most Linux systems use shadow passwords.\n\nThe file can only be\
    \ changed by the user root and read by the members of the group shadow. The following\
    \ is a sample /etc/shadow:\n\n```\nat::13181:0:99999:7::\nbin::*:13181::\ndaemon::*:13181::\n\
    ftp::*:13181::\ngames::*:13181::\ngdm::13181:0:99999:7::\nlp::*:13181::\nmail::*:13181::\n\
    man::*:13181::\nmdns::13181:0:99999:7::\nnew::*:13181::\nnobody::*:13181::\ntp::13181:0:99999:7::\n\
    postfix::*:13181:0:99999:7::\nroot::$2a$05Q05LcXHUZJGluppua:13181::\nsshd::*:13181:0:99999:7::\n\
    uucp::*:13181::\nwwrun::*:13181::\ngeeko::$2a$05QJMMXzvcm0HNEErjvcPw5Kp9faXX4SgB4RL:13181:0:99999:7:-1::\n\
    ```\n\nEach line in /etc/shadow belongs to one user and contains the following\
    \ fields:\n\n![](img/428e877abd09b1c11149d179d3458f12_276_0.png)\n\nThe above\
    \ illustration shows the entry for the user geeko with an encrypted password.\
    \ The plain text is novel. Many users, such as www (Apache server) or bin have\
    \ an asterisk (*) in the password field. This means that these users cannot log\
    \ in to the system, but are needed for special applications.\n\nIf the password\
    \ is empty, then the user can log in the system without entering a password. A\
    \ password should always be set in a Linux system.\n\nThe information at the end\
    \ of each line determines some limits:\n\n- **Last Change.** Date of password\
    \ change. The number represents the number of days since January 1st, 1970.\n\
    - **Next Possible Change.** Minimum age of a password before a user can change\
    \ it.\n- **Next Obligatory Change.** Number of days a user can use the same password\
    \ before it expires.\n- **Warning.** Number of days before password expiration\
    \ that a warning is issued to users. Enter -1 to disable the warning.\n- **Limit.**\
    \ Number of days after the password expires that the user can continue to log\
    \ in. Enter -1 for unlimited access (This does not make sense, course.).\n- **Lock.**\
    \ Date when the account expires. The date must be in the format YYYY-MM-DD. Leave\
    \ the field empty if the account never expires.\n\n## /etc/group\n\nThe file /etc/group\
    \ stores group information. The following is a sample /etc/group file:\n\n```\n\
    at:25:\naudio:x:17:\nbin:x:1:daemon\ncdrom:x:20:\nconsole:x:21:\n...\nvideo:x:33:geeko\n\
    wheel:x:10:\nwww:x:8:\nroot:x:41:\nusers:x:100:\n```\n\nEach line in the file\
    \ represents a single group record, and contains the group name, the GID (group\
    \ ID), and the members of the group. For example:\n\n```\nvideo:x:33:geeko\n```\n\
    \nThis is the entry for the group video in /etc/group and has a GID of 33. The\
    \ user geeko is member of this group. The second field (x) is the password field.\n\
    \nThe /etc/groups file shows secondary group memberships, but does not identify\
    \ the primary group for a user.\n\n## Exercise 8-2 Check User and Group Information\
    \ on Your Server\n\nIn this exercise, you write down the GIDs of some groups and\
    \ the UIDs of some users. You also switch to user root with the su command.\n\n\
    You will find this exercise in the workbook.\n\n(End of Exercise)\n\n# Objective\
    \ 3: Manage User and Group Accounts From the Command Line\n\nYou can use commands\
    \ to perform the same user and group management tasks available with YaST. In\
    \ this objective you will learn:\n\n- Manage User Accounts From the Command Line\n\
    - Manage Groups From the Command Line\n- Create Text Login Messages\n\n## Manage\
    \ User Accounts From the Command Line\n\nThe root user can use the following commands\
    \ to perform the same user management tasks available with YaST (and some tasks\
    \ available with YaST):\n\n- **useradd.** You can create a new user account with\
    \ the useradd command. If no option is specified, the command useradd creates\
    \ a user without a home directory and without a valid password.\n- **-m.** This\
    \ option automatically generates the home directory for the user. Without further\
    \ arguments, the directory is created under /home/. In addition, several files\
    \ and directories are copied to this directory. The directory /etc/skel/ (from\
    \ skeleton) is used as a template for the user home directory.\n- **-c.** When\
    \ creating a new user, you can enter text for the comment field by using the option\
    \ -c (comment).\n- **-u.** This option specifies the UID of the new account. If\
    \ this option is not given, the next free UID is used (at maximum 60000).\n"
  mdcn: "\n\n# 用户和组配置文件\n\nLinux 系统将所有用户和组配置数据存储在以下文件中：\n\n- /etc/passwd\n- /etc/shadow\n\
    - /etc/group\n\n在可能的情况下，你不应该使用编辑器修改这些文件。相反，请使用 YaST 提供的“安全与用户”模块，或使用 8-27 节“从命令行管理用户和组账户”中描述的命令行工具。\n\
    \n使用编辑器修改这些文件可能会导致错误（特别是在 /etc/shadow 中），例如用户（包括 root 用户）无法再次登录。\n\n## /etc/passwd\n\
    \n/etc/passwd 文件存储了每个用户的信息，例如用户名、UID、家目录和登录壳（shell）。\n\n在过去，/etc/passwd 还包含加密后的密码。然而，由于该文件需要对所有用户可读（例如，在使用\
    \ `ls -l` 时显示用户和组名），现在加密后的密码被存储在 /etc/shadow 中，该文件只有 root 用户和 shadow 组的成员可读。\n\
    \n## 以下是 /etc/passwd 文件的示例：\n\n```\nat:x:25:25:Batch daemon:/var/spool/jobs:/atjobs:/bin/bash\n\
    bin:x:1:1:bin:/bin/bash\ndaemon:x:2:2:Daemon:/sbin:/bin/bash\nftp:x:40:49:FTP\
    \ account:/srv/ftp:/bin/bash\ngames:x:12:100:Games /var/games:/bin/bash\ngdm:x:50:15:nome\
    \ Display Manager:/var/lib/gdm:/bin/bash\nhaldaen:x:101:102:User for haldaen:/var/run/halib:/bin/false\n\
    lp:x:4:7:Printing daemon:/var/spool/lpd:/bin/bash\nmail:x:8:12:Mailer daemon:/var/spool/clientqueue:/bin/false\n\
    man:x:13:62:Manual pages viewer:/var/cache/man:/bin/bash\nndsd:x:78:65534:mdNSResponder\
    \ runtime:/var/lib/mdns:/bin/false\nmessagebus:x:101:101:User for D-BUS:/var/run/db:/bin/false\n\
    news:x:9:9:News system:/etc/news:/bin/bash\nnobody:x:103:65534:65534:nobody:/var/lib/nobody:/bin/bash\n\
    tp:x:74:103:NTP daemon:/var/lib/ntp:/bin/false\npostfix:x:51:51:Postfix Daemon:/var/spool/postfix:/bin/false\n\
    root:x:0:0:root:/bin/bash\nsshd:x:71:65:SSH daemon:/var/lib/sshd:/bin/bash\nuucp:x:10:14:Unix-to-Unix\
    \ Copy system:/etc/uucp:/bin/bash\nwwwrun:x:30:8:WW daemon apache:/var/lib/wwwrun:/bin/false\n\
    geeko:x:1000:1000:Geeko Chameleon:/home/geeko:/bin/bash\n```\n\n/etc/passwd 文件中的每一行代表一个用户，并包含以下信息（用冒号分隔）：\n\
