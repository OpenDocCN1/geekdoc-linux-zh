    To set the value of a variable or to create a new variable, use the syntax variable=value,
    as in the following:


    ```

    da51:~ # MYVAR=myvalue

    da51:~ # echo $MYVAR

    myvalue

    da51:~ #

    ```


    The value can be a number, a character or a string. If the string includes a space,
    you have to write the value in full quotes, as in the following:


    ```

    da51:~ # MYVAR="my value"

    da51:~ # echo $MYVAR

    my value

    da51:~ #

    ```


    # Aliases


    Defining aliases allows you to create shortcuts for commands and their options
    or to create commands with entirely different names.


    On a SUSE Linux Enterprise Server 10, whenever you enter the commands dir, md,
    or ls, for instance, you will be using aliases.


    You can find about the aliases defined on your system with the command alias.
    This will show that dir, for instance, an alias for ls -l and that md is an alias
    for mkdir -p.


    The following are examples of aliases through which new commands are defined:


    ```

    geeko@da51:-> alias md

    alias md=''mkdir -p''

    geeko@da51:-> alias dir

    alias dir=''ls -1''

    ```'
  - '[PAGE 222]


    To see whether a given command is an alias for something else, the type command.
    For each command specified, type will tell you whether it is a built-in shell
    command, a regular command, function, or an alias.


    For regular commands, the output of type lists the paths to the corresponding
    executable. For aliases, it lists the elements aliased:


    ```

    geeko@da51:~$ type -a ls

    ls is aliased to `/bin/ls $LS_OPTIONS''

    ls is /bin/ls

    ```


    The above example shows that ls is an alias although, in this case, it is only
    used to add some options to the command.


    The -a option was used with type to show both the contents of the alias and the
    path to the original ls command. The output shows that ls is always run with the
    options stored in the variable LS_OPTIONS.


    These options cause ls to list different file types in different colors (among
    other things).


    Most of the aliases used on a system-wide basis are defined in the file /etc/bash.bashrc.
    Aliases are defined with the alias command and can be removed with the unalias
    command.


    For example, entering unalias ls removes the alias for ls, causing ls to stop
    clearing output.


    The following is the syntax for defining aliases:


    ```

    alias aliasname="command options"

    ```'
  - '[PAGE 223]


    SUSE Linux Enterprise Server 10 Fundamentals


    An alias defined in this way is only valid for the current shell and

    will not be inherited by subshells, as in the following:


    ```

    geeko@da51:-> ps="echo Hello"

    geeko@da51:-> ps

    Hello

    geeko@da51:-> bash

    gegeeko@da51:-> ps

    PID TTY TIME CMD

    858 pts/0 00:00:00 bash

    895 pts/1 00:00:00 bash

    ...

    ```


    To make an alias persistent, you need to store the definition in one

    of the shell''s configuration files. On the SUSE Linux Enterprise

    Server, the file ~/.alias is created for personal aliases defined by

    each user.


    This file is read by ~/.bashrc, where a command is included to

    that effect. Aliases are not relevant to shell scripts at all, but can

    a real time saver when using the shell interactively.


