    # Change File Permissions with chmod


    You can use the command chmod to add (“+”) or remove (“–”) permissions. Both the
    owner of a file and root can use this command.


    There are options to change the permissions for the owner (“u”), group (“o”) or
    all (“a”).


    The following are examples of using the command chmod:


    | Table 8-2 | Example | Result |

    | --- | --- | --- |

    | chmod u+x | The owner is given permission to execute the file. |

    | chmod g=rw | All group members can read and write. |

    | chmod u=rwx | The owner receives all permissions. |

    | chmod u=rwx,g=rw,o=r | All permissions for the owner, read write for the group,
    read for all other users. |

    | chmod +x | All users (owner, group, others) receive executable permission (depending
    on umask). |

    | chmod a+x | All users (owner, group, others) receive executable permission (a
    for all). |


    In the following example, the user allows the other members of the group users
    to write to the file hello.txt using chmod:


    ```

    geeko@da51:~ > ls -la hello.txt

    -rw-r-- 1 geeko users 0 2006-04-06 12:40 hello.txt

    geeko@da51:~ > chmod g+w hello.txt

    geeko@da51:~ > ls -la hello.txt

    -rw-r-- 1 geeko users 0 2006-04-06 12:40 hello.txt

    ```'
  - '[PAGE 294]


    With the option -R (recursive) and a specified directory, you can change the access
    permissions of all files and subdirectories under the specified directory.


    Besides using letters (rwx), you can also use the octal way of representing the
    permission letters with groups of numbers.


    Every file and directory in a Linux system has a numerical permission value assigned
    to it. This value has three digits.


    The first digit represents the permissions assigned to the file or directory owner.
    The second digit represents the permissions assigned to the group associated with
    the file or directory. The third digit represents the permissions assigned to
    others.


    Each digit is the sum of the following three values assigned to it:


    +   - Read: 4

    - Write: 2

    - Execute: 1


    For example, suppose a file named myfile.txt has 754 permissions assigned to it.


    This means the owner of the file has read, write, and execute permissions (4+2+1),
    the group associated with the file has read and execute permissions (4+1), and
    others have read permissions (4).


    By using number equivalents, you can add the numbers together, in the following:


    | Table 8-3 | Owner | Group | Others |

    |---|---|---|--|

    | rwx | r-X | r-- |

    | 421 (4+2+1=7) | 4-1 (4+1=5) | 4-- (4) |'
  - '[PAGE 295]


    The following are examples of using numbers instead of letters:


    | Example | Result |

    |---|---|

    | chmod 754 hello.txt | All permissions for the owner, read and execute for the
    group, read for all other users (rwx r-x r--). |

    | chmod 777 hello.txt | All users (user, group, others) receive all permissions
    (rwx rwx rwx). |


    # Change File Ownership with chown and chgrp


    The user root can use the command chown to change the user and group affiliation
    of a file by using the following syntax:


    ```

    chown new_user.new_group file

    ```


    To change only the owner, not the group, you can use the following command syntax:


    ```

    chown new_user file

    ```


    To change only the group, not the user, you can use the following command syntax:


    ```

    chown .new_group file

    ```


    As root, you can also change the group affiliation of a file with the command
    chgrp using the following syntax:


    ```

    chgrp .new_group file

    ```


    A normal user can use the command chown to allocate a file that he owns to a new
    group by using the following syntax:


    ```

    chown .new_group file

    ```'
  - '[PAGE 296]


    The user can also do the same with chgrp using the following syntax:


    # chgrp new_group_file


    The user can only change the group affiliation of the file that he owns if he
    is a member of the new group.


    In the following example, root changes the ownership of the file hello.txt from
    geeko to the user tux by using:


    ```

    da51:/tmp # 1 ls -la hello.txt

    -rw-r--r-- 1 geeko users 0 2006-04-06 12:43 hello.txt

    da51:/tmp # 1 ls tux.users.hello.txt

    da51:/tmp # 1 ls -la hello.txt

    -rw-r--r-- 1 tux users 0 2006-04-06 12:43 hello.txt

    da51:/tmp #

    ```


    In the following example, chown is used to limit access to the file list.txt to
    members of the group advanced:


    ```

    da51:/tmp # 1 ls -la list.txt

    -rw-r--r-- 1 geeko users 0 2006-04-06 12:43 list.txt

    da51:/tmp # 1 chown .advanced list.txt

    da51:/tmp # 1 ls -la list.txt

    -rw-r--r-- 1 geeko advanced 0 2006-04-06 12:43 list.txt

    da51:/tmp #

    ```


    Of course, root and the file owner continue to have rights to access the file.


    Although the group has changed, the owner permissions remain the same.'
