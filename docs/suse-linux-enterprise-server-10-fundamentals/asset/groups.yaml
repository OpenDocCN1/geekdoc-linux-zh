    # Understand Command Syntax and Special Characters


    You can use specific characters to provide special functionality. Using them can
    save you a lot of time and effort. In this objective, you will will learn about
    the following:


    +   - Select your Character Encoding

    - Name Expansion Using Search Patterns

    - Prevent the Shell from Interpreting Special Characters


    # Select your Character Encoding


    SUSE Linux Enterprise Server is internationalized and can be adapted to local
    standards easily.


    There are some variables that determine the localization. Use the command `locale`
    to get a list of the localization variables.


    ```

    geeko@da51:-> locale

    LANG=en_US.UTF-8

    LC_CTYPE=en_US.UTF-8

    LC_NUMERIC=en_US.UTF-8

    LC_TIME=en_US.UTF-8

    LC_COLLATE=en_US.UTF-8

    LC_MONETARY=en_US.UTF-8

    LC_MESSAGES=en_US.UTF-8

    LC_PAPER=en_US.UTF-8

    LC_NAME=en_US.UTF-8

    LC_ADDRESS=en_US.UTF-8

    LC_TELEPHONE=en_US.UTF-8

    LC_MEASUREMENT=en_US.UTF-8

    LC_IDENTIFICATION=en_US.UTF-8

    LC_ALL=

    geeko@da51:->

    ```


    The variable LANG specifies the language. In this example the language is set
    to US English.'
  - '[PAGE 226]


    The characters are encoded in UTF-8 (UCS Transformation Format), which means Unicode
    (Universal Character Set). Unicode has the advantage that it is possible to use
    all kind of letters and not only Latin letters.


    For all users SUSE Linux Enterprise server uses UTF-8 encoding. The exception
    is user root.


    ```

    da51:- # locale

    LANG=POSIX

    LC_CTYPE=en_US.UTF-8

    LC_NUMERIC="POSIX"

    LC_TIME="POSIX"

    LC_COLLATE="POSIX"

    LC_MONETARY="POSIX"

    LC_MESSAGES="POSIX"

    LC_PAPER="POSIX"

    LC_NAME="POSIX"

    LC_ADDRESS="POSIX"

    LC_TELEPHONE="POSIX"

    LC_MEASUREMENT="POSIX"

    LC_IDENTIFICATION="POSIX"

    LC_ALL=

    #

    ```


    There the LANG variable is set to POSIX, which means the characters are ASCII
    encoded.


    The state of the LANG variable is important for this section, because the results
    depend on the type of encoding. The order of the characters is different in POSIX
    and in UTF-8.'
