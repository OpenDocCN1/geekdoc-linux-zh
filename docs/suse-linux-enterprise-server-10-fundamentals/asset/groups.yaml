    ## SECTION 8 Manage Users, Groups, and Permissions


    Linux is a multiuser system. In other words, several users can work on the system
    at the same time. For this reason the system must be able to uniquely identify
    all users. In this section, you learn how to manage your user accounts and their
    permissions.


    ## Objectives


    - 1. Manage User and Group Accounts with YaST

    - 2. Describe Basic Linux User Security Features

    - 3. Manage User and Group Accounts From the Command Line

    - 4. Manage File Permissions and Ownership

    - 5. Ensure File System Security


    ## Objective 1 Manage User and Group Accounts with YaST


    With YaST, you can manage users and groups. To do this, you need to understand
    the following:


    - Basics About Users and Groups

    - User and Group Administration with YaST


    ## Basics About Users and Groups


    One of the main characteristics of a Linux operating system is its ability to
    handle several users at the same time (multieruser) and allow these users to perform
    several tasks on the same computer simultaneously (multitasking).


    For this reason the system must be able to uniquely identify all users. To achieve
    this, every user must log in with the following:


    - A username

    - A password


    Because the operating system can handle numbers much better than strings, users
    are handled internally as numbers. The number which a user receives is a UID (User
    ID).


    Every Linux system has a privileged user, the user root. This user always has
    the UID 0. This is the administrator of the system.


    Users can be grouped together based on shared characteristics or activities. For
    example:


    - Normal users are usually in the group users.

    - All users who intend to create web pages can be placed in the group webedit.


    Of course, file permissions for the directory in which the web pages are located
    must be set so that the group webedit is able to write (save files).


    As with users, each group is also allocated a number internally called the GID
    (Group ID), and can be one of the following types:


    - Normal groups

    - Groups used by the system

    - The root group (GID = 0)


    ## User and Group Administration with YaST


    You can access YaST user and group account administration in the following ways:


    - User administration. From the YaST Control Center, select Security and Users
    > User Management, or from a terminal window, enter yast2 users.

    - Group administration. From the YaST Control Center, select Security and Users
    > Group Management, or from a terminal window, enter yast2 groups.


    If you have selected LDAP for authentication during the installation of the SUSE
    Linux Enterprise Server, you are prompted for the LDAP server administrator password.


    You can switch back and forth between administering users and administering groups
    by selecting the Users and Groups radio buttons at the top of the module window.


    ## User Administration


    The user account management window lists the existing user accounts (as in the
    following):


    Figure 8-1


    ![](img/428e877abd09b1c11149d179d3458f12_257_0.png)


    A list of users (accounts on your server) appears with information such as login
    name, full name, UID, and associated groups for each user.


    Select Set Filter: then select one of the following to change the users listed:


    - **Local Users.** User accounts you have created on your local server for logging
    into the server.

    - **System Users.** User accounts created by the system for use with services
    and applications.

    - **Custom.** A customized view of users based on the settings configured with
    Customize Filter.

    - **Customize Filter.** This option lets you combine listed user sets (such as
    Local Users and System Users) to display a customized view (with Custom) of the
    users list.


    Additional sets of users (such as LDAP users) are added to the Set Filter drop-down
    list as you configure and start services on your server.


    You can create a new user account or edit an existing account by selecting Add
    or Edit.


    The following appears:


    ## 8-2


    ![](img/428e877abd09b1c11149d179d3458f12_258_0.png)


    Enter or edit information in the following fields:


    - **User’s Full Name.** Enter a real name (such as John)

    - **Username.** Enter a name that is used to log in to the system (such as john)

    - **Password and Confirm Password.** Enter and re-enter a password for the user
    account.


    When entering a password, distinguish between uppercase and lowercase letters.
    Valid password should not contain any special characters, as you might find it
    difficult to type these on different keyboard layouts.


    The password length should be between 5 and 72 characters.


    To set the properties of the user (such as the UID, home directory, login shell,
    group affiliation, and additional user comments), select the Details tab. The
    following appears:


    Figure 8-3


    ![](img/428e877abd09b1c11149d179d3458f12_260_0.png)


    Enter or edit information in the following fields:


    - **User ID (uid).** For normal users, you should use a UID greater than 999 because
    the lower UIDs are used by the system for special purposes.


    If you change the UID of an existing user, the permissions of the files must be
    changed. This is done automatically for the files in the user''s home directory,
    but not for files located elsewhere.


    If this does not happen, you can change the permissions of the files in the home
    directory (as root) by entering `chown -R username /home/username`.


    - **Home Directory.** The home directory of the user. Normally this is `/home/username`.
    You can select an existing directory by **Browse**.

    - **Additional User Information.** This field can contain up to 3 parts separated
    by commas. It is often used to enter `office,work phone,home phone`. This information
    is displayed when you use the **finger** command on this user.

    - **Login Shell.** From the drop-down list select the default login shell for
    this user from the shells installed on your system.

    - **Default Group.** This is the group to which the user belongs. Select a group
    from the list of all groups configured on your system.

    - **Groups.** Select all additional memberships you want to assign to the user
    from the list.


    To set various password parameters (such as duration of a password), select the
    Password Settings tab. The following appears:


    Figure 8-4


    ![](img/428e877abd09b1c11149d179d3458f12_262_0.png)


    Enter or edit information in the following fields:


    - **Days before Password Expiration to Issue Warning.** Enter the number of days
    before password expiration that a warning is issued to users.

    - **Enter -1** to disable the warning.

    - **Days after Password Expires with Usable Login.** Enter the number of days
    after the password expires that users can continue to log in.

    - **Enter -1** for unlimited access.

