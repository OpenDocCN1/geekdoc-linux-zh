    # Objective 1


    # Access and Use man Pages


    The most important command for online help is man (an abbreviation of manual or
    man page).


    All manual pages are available in English and many have been translated into other
    languages. Because these translations are often incomplete or not maintained,
    we recommend using the English versions.


    To display the man page of the command man, enter


    ```

    geeko@da51:~ > man man

    ```


    If the English man pages are not shown automatically with the command man, you
    can display the English version of the man page by using the variable LANG=en_EN.


    For example to display the English version of the man page for the command man,
    you would enter the following:


    ```

    geeko@da51:~ > LANG=en_EN man man

    ```


    Using the parameter LANG=en_EN switches to the English language for the requested
    man pages only.'
  - '[PAGE 118]


    # The following is the first page of the manual pages for the command man:


    | man(1) | Manual pager utils | man(1) |

    | --- | --- | --- |

    | NAME | an interface to the on-line reference manuals | |


    SYNOPSIS

    man [-c|[-w]-TZT device [-adhu7V] [-m system[]] [-L locale] [-p string] [-M path]
    [-P pager] [-r prompt] [-S list] [-e extension] [-section page ...] ...

    man -l [-7] [-TZT device] [-p string] [-P pager] [-r prompt] file ...

    man -k [apropos options] regexp ...

    man -f [whatis options] page ...


    DESCRIPTION

    man is the system''s manual pager. Each page argument given to man is normally
    the name of a program, utility or function. The manual page associated with each
    of these arguments is then found and displayed. A section, if provided, will direct
    man to look only in that section of the manual. The default action is to search
    in all of the available sections, following a pre-defined order and to show only
    the first page found, even if page exists in several sections.


    The header of each manual page contains the command name at the left and right
    sides and the section number to which the manual page belongs. In the center of
    the header is the name of the page. The last line usually contains the date of
    the last changes.'
- md: "\nA manual page should be divided into the following parts:\n\n| Part | Contents\
    \ |\n|---|---|\n| NAME | Name and short description of the command |\n| SYNOPSIS\
    \ | Description of the syntax |\n| DESCRIPTION | Detailed description of the command\
    \ |\n| OPTIONS | Description of all available options |\n| COMMANDS | Instruction\
    \ that can be given to the program while it is running |\n| FILES | Files connected\
    \ in some way to the command |\n| SEE ALSO | Hints on related commands |\n| DIAGNOSTICS\
    \ | Possible error messages of the program |\n| EXAMPLE | Examples of calling\
    \ up a command |\n| BUGS | Known errors and problems with the command |\n\nTo\
    \ view manual pages, internally the command `less` is used which displays one\
    \ screen of information at a time. The following keys are available to use with\
    \ the command `less:`\n\n| Key Command | Description |\n|---|---|\n| n Space |\
    \ Page one screen forward. |\n| b | Page one screen backward. |\n| PageDown |\
    \ Page half a screen forward. |\n| PageUp | Page half a screen backward. |\n|\
    \ Down-arrow, Enter | Jump one line forward. |\n| Up-arrow | Jump one line backward.\
    \ |\n| End | Go to end of the manual page. |\n| Home | Go to beginning of manual\
    \ page. |\n\n## Table 4-2 Key Command Description\n\n| Key Command | Description\
    \ |\n|---|---|\n| /expression | Search forward from the current cursor position\
    \ for expression; matching line is displayed as first line on the screen. |\n\
    | ?expression | Search backwards from current cursor position for expression;\
    \ matching line is displayed as first line on the screen. |\n| n | Move to next\
    \ instance of expression in the search. |\n| N | Move to previous instance of\
    \ expression in the search. |\n| q | End display of the manual page. |\n\nThe\
    \ manual pages are organized in the following sections:\n\n| Table 4-3 Section\
    \ Contents |\n|---|---|\n| 1 | Executable programs and shell commands (user commands)\
    \ |\n| 2 | System calls |\n| 3 | Functions and library routines |\n| 4 | Device\
    \ files |\n| 5 | Configuration files and file formats |\n| 6 | Games |\n| 7 |\
    \ Macro packages and file formats |\n| 8 | System administration commands |\n\n\
    For example, entering the following displays general information about the command\
    \ crontab:\n\n```bash\n# man 1 crontab\n```\n\nEntering the following displays\
    \ information about the configuration file for the command crontab (which also\
    \ has the name crontab):\n\n```bash\n# man 5 crontab\n```\n\nIt is especially\
    \ important to know which section a command belongs when there is more than one\
    \ manual for a command.\n\nFor example, the command uname is both a command and\
    \ a system call. Entering the following displays information about the user command:\n\
    \n```bash\n# man 1 uname\n```\n\nEntering the following displays information about\
    \ the system call (such as name and information about the current kernel):\n\n\
    ```bash\n# man 2 uname\n```\n\nYou can display a brief description of all the\
    \ available manual pages for a command or utility using the command whatis (as\
    \ in the following):\n\n```\ngeeko@da51:~ > whatis uname\nuname (1) - print system\
    \ information\nuname (2) - get name and information about current kernel\nuname\
    \ (1p) - return system name\nuname (3p) - get the name of the current system\n\
    ```\n\nManual pages whose output is marked with “p” are POSIX manual pages of\
    \ the command uname (uname (1p)) and the function (uname (3p)). POSIX (Portable\
    \ Operating System Interface for Unix) was developed from the IEEE and the Open\
    \ Group for Unix as standardized interface between application and operating system.\n\
    \nIn SUSE Linux Enterprise Server, the manual pages are located in the directory\
    \ /usr/share/man/.\n\nIf you enter man -k keyword or apropos keyword, a list of\
    \ manual pages in which the keyword appears in the NAME section is displayed.\
    \ For example:\n\n```\ngeeko@da51:~ man -k printf\nvasprintf (3) - print to allocated\
    \ string\nwprintf (3) - wide-character formatted output of a stdarg argument list\n\
    vprintf (3) - formatted output conversion\nsprintf (3) - formatted output conversion\n\
    format (n) - format a string in the style of sprintf\nswprintf (3) - formatted\
    \ wide character output conversion\nasprint (3) - print to allocated string\n\
    vprintf (3p) - format output of a stdarg argument list\nprintf (3p) - print formatted\
    \ output\nsprint (3p) - print formatted wide-character output\nwprintf (3p) -\
    \ \nvdprintf (3) - print to a file descriptor\nfwprintf (3) - formatted wide character\
    \ output conversion\nsprintf (3) - formatted output conversion\ndprintf (3) -\
    \ print to a file descriptor\nprintf (3p) - formatted wide character output conversion\n\
    printf (3p) - formatted output conversion\n...\n```\n\n## Exercise 4-1 Access\
    \ and Use man Pages\n\nIn this exercise, you learn how to use the commands whatis\
    \ and man and how to navigate in the help text.\n\nYou will find this exercise\
    \ in the workbook.\n\n(End of Exercise)\n\n## Objective 2\n\n## Use info Pages\n\
    \nUnfortunately, a whole series of programs are no longer provided with manual\
    \ pages (or the pages have become outdated). Instead, info files are used, which\
    \ can be read with the command info.\n\nIn SUSE Linux Enterprise Server, the info\
    \ files are located in the directory /usr/share/info/.\n\nThe following is the\
    \ beginning of the info file for the:\n\n```\nFile: info, Node: Top, Next: Getting\
    \ Started, Up: (dir)\n************************************************\nInfo:\
    \ Introduction\n************************************\nMenu:\n* Getting Started\n\
    * Advanced Info\n* Creating an Info\n* Index\n```\n\nThe following are advantages\
    \ of the info file:\n\n- It uses structured document\n- Specific sections can\
    \ be reached directly from table of contents\n\nThe following are the most commonly\
    \ used key commands for the:\n\n| Key Command | Description |\n|---|---|\n| Space,\
    \ PageDown | Page down one screen. |\n| Backspace, PageUp | Page up one screen.\
    \ |\n| b | Move to the beginning of info page. |\n| e | Move to the end of info\
    \ page. |\n| Tab | Move to next reference. |\n| Enter | Follow the reference.\
    \ |\n| n | Move to next info page of the same level. |\n| p | Move to the previous\
    \ info page of the same level. |\n| u | Move one level higher. |\n| l | Move back\
    \ to last displayed, end help. |\n| s | Search in info page. |\n| h | Display\
    \ help. |\n| ? | List a summary of commands. |\n| q | End display of info. |\n\
    \n## Exercise 4-2\n\n## Access and Use info Pages\n\nIn this exercise, you learn\
    \ how to use the info command and how to navigate in the info text.\n\nYou will\
    \ find this exercise in the workbook.\n\n(End of Exercise)\n\n## Objective 3 Access\
    \ Release Notes and White Papers\n\nRelease notes, white papers and other helpful\
    \ information are stored in the directory /usr/share/doc/. This directory contains\
    \ the:\n\n- Release Notes\n- Manuals\n- Help for Installed Packages\n- Howtos\n\
    \n## Release Notes\n\nWhen you complete the installation of SUSE Linux Enterprise\
    \ Server, the release notes appears in a window.\n\n![](img/428e877abd09b1c1114d179d3458f12_127_0.png)\n\
    \nIf you want to access these release notes later, you can find them in the directory:\n\
    /usr/share/doc/release-notes/SUSE_Linux_Enterprise_Server_10/\n\nThere are two\
    \ release notes available:\n\n- RELEASE-NOTES.en.html\n- RELEASE-NOTES.en.rtf\n\
    \nThe content of these files is identical. Only the file format is different.\n\
    \n## Manuals\n\nThe administration manual is also installed during the installation\
    \ of SUSE Linux Enterprise Server 10.\n\nIn /usr/share/doc/manual/sles_admin_en/\
    \ there is a PDF version of the manual.\n\nIf you prefer HTML, an HTML version\
    \ is available in the html/ subfolder.\n\n## Help for Installed Packages\n\nHelp\
    \ files are available in the following directory for most installed packages:\n\
    \n/usr/share/doc/packages/package-name\n\nThese help files are written by the\
    \ programmers of the package. Therefore, the format of these files is not standardized.\
    \ Some packages provide help files in HTML, while others are in regular ASCII.\n"
