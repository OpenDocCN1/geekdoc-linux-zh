    # Objective 1 Understand the File System Hierarchy Standard (FHS)


    The file system concept of Linux (and, in general, of all UNIX systems) is considerably
    different than that of other operating systems.


    A filename in Linux can be up to 255 characters long. It can contain any number
    of special characters ("" or %%, for example).


    Certain special characters (the dollar sign $, the semicolon \;\, or the space,
    for example) have a specific meaning. If you want to use one of these characters
    without the associated special meaning, the character must be preceded by a \"
    (backslash) to mask (switch off) its special meaning.


    You can also umlauts, letters with diacritical marks, or other country-specific
    characters. If you exported data with in other countries using other settings,
    you could get problems, because these characters were not present on their keyboards.


    Linus differentiates between upper-case and lower-case letters. For example, Invoice,
    invoice, and INVOICE identify three different files.


    To understand the concept of the Linux file system, you need to know the following:


    +   * The Hierarchical Structure of the File System

    * FHS (Filesystem Hierarchy Standard)

    * Root Directory /

    * Essential Binaries for Use by All Users (/bin)

    * Boot Directory (/boot)

    * Other Partitions (/data)'
