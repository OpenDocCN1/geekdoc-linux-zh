    ## SECTION 5 Manage Directories and Files


    In this section, you learn about the structure of Linux and the most important
    commands.


    ### Objectives


    - 1. Understand the File System (FHS)

    - 2. Identify File Types in Linux

    - 3. Change Directories and List Content

    - 4. Create and View Files

    - 5. Work with Files and Directories

