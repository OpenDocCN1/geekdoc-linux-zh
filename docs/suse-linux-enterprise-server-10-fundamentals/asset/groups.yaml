    - **UID。** 根据 Linux 标准，有三个保留的数字范围：\n  - 00–99 用于系统本身。\n  - 100–499 用于特殊系统用户（如服务和程序）。\n\
    \  - 普通用户从 UID 1000 开始。\n- **GID。** 组的编号。根据 Linux 标准，有两个保留的数字范围：\n  - 00–99 用于特殊系统组（如服务和程序）。\n\
