    # SUSE Linux Enterprise Server Fundamentals


    The following listing shows in an example the effect of different ummasks.


    ```

    da51:- # touch example1

    da51:- # mkdir exampledir1

    da51:- # umask 000

    da51:- # touch example2

    da51:- # mkdir exampledir2

    da51:- # umask 022

    da51:- # touch example3

    da51:- # mkdir exampledir3

    da51:- # ls -1

    total 609

    -rw-r-- 1 root root 0 May 11:18 example1

    -rw-rw-- 1 root root 0 May 11:18 example2

    -rw-r-- 1 root root 0 May 11:18 example3

    drwxr-xr-x 2 root root 48 May 11:18 exampledir1

    drwxrwt-x 2 root root 48 May 11:18 exampledir2

    drwxr-xr-x 2 root root 48 May 11:18 exampledir3

    da51:- #

    ```


    By entering **umask 077** you restrict access to the owner and root group; the
    group and others do not have any access permissions.


    **umask** without any parameter shows the current value of the umask.


    ```

    da51:- # umask

    0022

    da51:- ~ #

    ```


    The leading zero can be used to set special file permissions as described in the
    following. But for security reasons we strongly recommend not to do this.


    To make the umask setting permanent, you can change the value of umask in the
    system-wide configuration file /etc/profile.local. If you want the setting to
    be user-specific, enter the value of umask in the .bashrc in the home directory
    of the respective user.


    # Configure Special File Permissions


    The following three attributes are used for special circumstances:


    Table 8-6 Letter Number Name Files Directories


    | Letter | Number | Name | Files | Directories |

    |---|---|---|---|---|

    | t | 1 | Sticky bit | not applicable | Users can only delete files when they
    are the owner, or when they are root owner of the directory. This is usually applied
    to the directory /tmp. |

    | s | 2 | SGID (set GroupID) | When a program is run, it sets the group ID of
    the process to that of the file. | Files created in this directory belong to the
    group to which the directory belongs and not to the primary group of the user.
    New directories created in this directory inherit the SGID bit. |

    | s | 4 | SUID (set UserID) | Sets the user ID of the process to that of the owner
    of the file when the program is run. | Not applicable |


    # SUSE Linux Enterprise Server 10 Fundamentals


    You set the sticky bit with chmod, either via the permissions of others (such
    as chmod o+t /tmp) or numerically (such as chmod 1777 /tmp).


    The sticky bit is on older UNIX systems enabled the storing of an executable program
    in memory after it had been terminated, so it could be restarted. However, with
    modern UNIX and Linux systems, this only affects directories.


    The sticky bit is listed in the permissions for Others (t), as in the following:


    ```

    geeko@da51:~ > ls -1d /tmp

    drwxrwxrwx 5 root 608 2006-04-06 12:45 /tmp

    geeko@da51:~ >

    ```


    The following is an example for SUID:


    ```

    geeko@da51:~ > ls -l /usr/bin/passwd

    drwxr-xr-x 1 root shadow 79765 2006-03-24 12:19

    /usr/bin/passwd

    geeko@da51:~ >

    ```


    Each user is allowed to change his password, but to write it into the file /etc/shadow
    root permissions are needed.


    The following is an example for SGID:


    ```

    geeko@da51:~ > ls -l /usr/bin/wall

    drwxr-sr-x 1 root tty 10192 2006-03-22 05:24 /usr/bin/wall

    geeko@da51:~ >

    ```


    With wall, you can send messages to all virtual terminals. If you use wall, this
    command is executed with the permissions of the group tty.


    If the attributes SUID or SGID are set, the programs are carried out with the
    privileges the owner (in the example for SUID above: root) or the group (in the
    example for SGID above: tty) have.


    If root is the owner of the program, the program is carried out with the permissions
    of root. Unfortunately, there is a security risk doing this.


    For example, it could be possible for a user to take advantage of an error in
    the program, retaining root privileges after the process has been ended.


    # Objective 5 Ensure File System Security


    After a user has logged in to the system, what he is allowed to do and what he
    is not allowed to do is mainly determined by the security settings of the file
    system.


    In Linux, file system security is especially important as every resource available
    on the system is represented as a file.


    For example, when a user tries to access the sound card to play back audio data,
    the access rights of the sound card are determined by the permission settings
    of the corresponding device file in the /dev directory.


    To ensure a basic file system security, you need to know the following:


    - The Basic Rules for User Write Access

    - The Basic Rules for User Read Access

    - How Special File Permissions Affect the Security of the System


    # The Basic Rules for User Write Access


    The file systems used in Linux are structurally UNIX file systems. They support
    the typical file access permissions (read, write, execute, sticky bit, SUID, SGID,
    etc.).


    Apart from additional standard functionalities, such as various time stamps, the
    access permissions can be administered separately for file owners, user groups,
    and the rest of the world (user, group, others).


    As a general rule, a normal user should only have write access in the following
    directories:


    - The home directory of the user

    - /tmp directory to store temporary files


    Depending on the purpose of a computer other directories can be writable by users.
    For example, if you install a Samba file server, a writable share needs a directory
    that is also writable for the Linux device connection is mapped to.


    Some device files (like those for sound cards) might also be writable for users
    since applications need to send data to the corresponding.


    # The Basic Rules for User Read Access


    Some files in the system should be protected from user access. This is important
    for files that store passwords. Even when the passwords in a file are encrypted,
    the files must be protected from unauthorized access.


    The following lists some files containing passwords.


    - /etc/shadow. This file contains user passwords in an encrypted form. When LDAP
    is used for authentication, this file contains at least the root password.

    - /etc/samba/smbpasswd. This file contains the passwords for Samba users. By default
    the file permissions are set to 600.

    - Files with Apache passwords. The location of these files depend on your configuration.
    They contain passwords for the authorized access to the web server.

    - /etc/ldap/slapd.conf. This file contains the root password for the openLDAP
    server. After installing the openldap2 package, the permissions for this file
    are set to 644.


    ![](img/428e877abd09b1c1149d179d3458f12_304_0.png)


    # SUSE Linux Enterprise Server 12 Fundamentals


    - /boot/grub/menu.lst. This file can contain the password for the GRUB boot loader.
    By default the file permissions are set to 600.


    This list is not complete. There can be more password files on your system, depending
    on your system configuration and your software selection.


    Some password files can be readable for a nonroot account. This is normally the
    account under which a service daemon is running.


    For example, the Apache web server runs under the user id of the user wwwwrun.
    For this reason, the password files must be readable for the user wwwwrun.


    In this case you have to make sure that only this daemon account is allowed to
    read the file and no other user.


    # How Special File Permissions Affect the Security of the System


    There are three file system permissions that influence the security in a special
    way:


    - The SUID bit. If the SUID bit is set for an executable, the program is started
    under the user ID of the owner of the file. In most cases, this is used to allow
    normal users to run applications with the rights of the root users.


    This bit only be set for applications that are well tested and in cases where
    no other way can be used to gain access to a specific task.


    An attacker could get access to the root account by exploiting an application
    that runs under the UID of root.

