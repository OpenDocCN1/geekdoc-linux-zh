    ## Identify File Types in the Linux System


    The Linux file system is distinct from the file systems of other operating systems
    because of the various file types.


    The file types in Linux referred as normal files and directories are also known
    in other operating systems. However, the following are additional types of files
    that are UNIX-specific:


    - Normal Files

    - Directories

    - Device Files

    - Links

    - Sockets

    - FIFOs


    ## Normal Files


    Normal files refer to files as they are also known in other operating systems:
    a set of contiguous data addressed with one name. This includes all the files
    normally expected under this term (ASCII texts, executable programs, graphics
    files, etc.). The names for files can be freely chosen and there is no division
    into name and file type (such as report.txt).


    A number of file names still retain this structure, but these are requirements
    of the corresponding applications, such as a word processing program or a compiler.


    ## Directories


    Directories contain two entries with which the structure of the file system is
    implemented. One of these entries ("..") points to the directory itself. The other
    entry ("..") points to one level higher.


    ## Device Files


    Each hardware in Linux system is represented by a device file. These files represent
    hardware between applications.


    ## Links


    Links are references to files located at other points. The kernel ensures that
    the data is valid for all links.


    ## Sockets


    A socket refers to a special file with which data exchange between two processes.


    ## FIFOs


    FIFO (first in out) or named pipe is a term used for files used to exchange data.
    However, the file can only exchange data in one direction.


    ## Objective 3


    ### Change Directories and List Directory Contents


    The prompt of a shell terminal contains the current directory (such as geeko@da51:-).
    The tilde “~” indicates that you are in the user’s home directory.


    You can use the following commands to change the active directory and list the
    contents:


    - cd

    - ls

    - pwd


    ### cd


    You can use the command cd (change directory) to change between directories. Some
    examples include the following:


    | Table 5-11 | Command | Meaning |

    | :--- | :--- | :--- |

    | cd plan | Change to the subdirectory plan |

    | cd /etc | Change directly to the directory /etc (absolute path) |

    | cd | Change from any directory to the home directory |

    | cd .. | Move one directory higher |

    | cd ../ | Move two directory levels higher |

    | cd - | Move to the last valid directory |


    ### ls


    The command **ls (list)** lists the specified files. If a directory is included
    with **ls**, the directory''s contents are displayed. Without an option, the contents
    of the current directory are listed.


    The following are the most important options you can use with **ls:**


    | Option | Meaning |

    | :--- | :--- |

    | None | Displays the contents of the current directory in several columns (file
    and directory names only). |

    | -a | Also displays hidden files (such as .bashrc) |

    | -F | After each name, a character indicates the file type. ("|" for directories,
    "*" for executable files, "@" symbolic link) |

    | -l | ("long list") Gives a detailed list of all files. For each file name, information
    about permissions, modification time, and size is included. |

    | -t | Files are sorted by date of alteration. Combined with the option -r, the
    output takes place in reverse order (the newest file is displayed last). |

    | -R | Output is recursive, including all subdirectories. |

    | -u | Sorted by date of last access. |

