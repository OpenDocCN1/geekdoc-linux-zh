    ## SECTION 3 Administer Linux with YaST


    YaST is a powerful tool to configure your SUSE Linux Enterprise Server 10. There
    are many modules for all important configuration tasks available but in this section
    you will only learn about the network configuration module and the software module
    as examples.


    ## Objectives


    + 1. Get to Know YaST

    2. Understand the Role of SuSEconfig

    3. Manage the Network Configuration Information from YaST

    4. Install Software Packages

    5. Manage Installation Sources


    ## Objective 1


    ### Get to Know YaST


    YaST stands for Yet another Setup Tool. You can use YaST to complete many configuration
    tasks as a SUSE Linux Enterprise administrator.


    The YaST user interface can appear in two kinds:


    + - ncurses. Text mode

    - QT. Fully graphical mode


    The appearance of the user interface depends on which command you use to start
    YaST and on whether you use the graphical system or the command line, as indicated
    in the following:


    | Command | Terminal in X Window | Command Line |

    |---|---|---|

    | yast2 | Qt | ncurses |

    | yast | ncurses | ncurses |


    ## Table 3-1


    In the graphical interface, you can control YaST with the mouse. To start it,
    select YaST from the main menu (application group: System). You are asked to enter
    the root password.


    ## Figure 3-1


    ![](img/428e877abd09b1c11149d179d3458f12_87_0.png)


    ## The YaST dialog appears.


    Figure 3-2


    ![](img/428e877abd09b1c11149d179d3458f12_88_0.png)


    You control the ncurses interface with the keyboard. To start the ncurses interface
    of YaST, you can start a terminal emulation from your GNOME desktop by selecting
    **Gnome Terminal** from the main menu (application group: **System**).


    ## SUSE Linux Enterprise Server 10 Fundamentals


    Enter su - get root permissions. After entering the root password, start YaST
    by entering yast.


    Figure 3-3


    ![](img/428e877abd09b1c11149d179d3458f12_89_0.png)


    Press Tab to move from one box to another or to the text buttons. To go back to
    the previous box, press Shift+Tab. Use the arrow keys to navigate within the box.
    Mark highlighted menu items by pressing the Space.


    To select a menu item, press Enter. You can often press Alt and the highlighted
    letter to access an item directly.


    Except for the controls and the appearance, the graphical mode and the text mode
    of YaST are identical.


    You can list the available YaST modules with the command yast -l or yast --list.
    To start an individual module, specify its name. For example, you can enter the
    following to start the software installation module:


    ```bash

    yast sw-single

    ```


    You can enter the software module name with the command yast or yast2, as in the
    following:


    + - yast sw_single (text mode)

    + - yast2 sw_single (graphical mode)


    ![](img/428e877abd09b1c11149d179d3458f12_90_0.png)


    To install a software package you can also enter yast -i package.rpm. The package
    is installed directly without any dialogs.


    To display a list of YaST options, enter one of the following:


    + - yast --help

    + - yast -h


    The main dialog of YaST is called the YaST Control Center.


    From here you can select a category on the left (such as Software or System) and
    a module on the right (such as Online Update) to configure and manage your system.


    When you finishing changes with a YaST module, YaST uses backend services such
    as SuSEconfig (see “Understand the Role of SuSEconfig” on 3-7) to implement the
    changes in the system.


    ## Exercise 3-1


    ### Get to Know YaST


    In this exercise, you learn how to use the different user interfaces of YaST and
    how to start some YaST modules.


    You will find this exercise in the workbook.


    (End of Exercise)


    ## Objective 2


    ### Understand the Role of SuSEconfig


    You can consider YaST as a front end to various programs, such as a front end
    to RPM (RPM Package Manager) software management, a front end to user management,
    or a front end to various configurations. YaST writes the changes directly into
    the final file. In other cases there is an intermediate step, where the information
    you enter is first written to a file in /etc/sysconfig/.


    This is where SuSEconfig becomes important. SuSEconfig is a tool used in SUSE
    Linux Enterprise to configure the system according to the variables in /etc/sysconfig/.
    SuSEconfig acts as a back end for YaST and activates the configuration changes
    you make using a YaST module.


    If you modify files in /etc/sysconfig/ using an editor, all you might need to
    do is restart a service for the change to take place. However, you might also
    need to run SuSEconfig. For this reason, we recommend running SuSEconfig after
    manually editing files in /etc/sysconfig/.


    SuSEconfig uses the subsystem specific scripts in /sbin/conf.d/ to configure the
    various subsystems. For example the variables in /etc/sysconfig/postfix are evaluated
    by the script /sbin/conf.d/SuSEconfig.postfix.


    ## Objective 3 Manage the Network Configuration Information from YaST


    The YaST module for configuring network cards and the network connection can be
    accessed from the YaST Control Center.


    To activate the network configuration module, select Network Devices > Network
    Card.


    ## Figure 3-4


    ![](img/428e877abd09b1c11149d179d3458f12_94_0.png)


    YaST wants to know the network setup method:


    + - User Controlled with NetworkManager that manages the connections for all network
    interfaces.

    + - Traditional Method with ifup. The traditional method uses the command ifup.
    (We recommend you to use this setup method.)


    Using the traditional method the next dialog shows the detected network cards.


    ## Figure 3-5


    ![](img/428e877abd09b1c11149d179d3458f12_95_0.png)


    Select the card you want to configure; then select Edit.


    Usually the cards are autodetected by YaST, and the correct kernel module is used.

