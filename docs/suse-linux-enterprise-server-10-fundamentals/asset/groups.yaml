    ## Access the Command Line Interface From the Desktop


    A classic multiuser environment can be implemented by connecting several terminals
    (monitor and keyboard units)—to the serial interface of a single computer.


    You can also connect several terminals to the serial interface in a Linux system.
    However, because more than one person often uses the same PC, virtual terminals
    were created.


    With virtual terminals, you can work in Linux as if you had several terminals
    available at the same time.


    You can have up to six virtual terminals (F1-F6) running on your computer. By
    pressing Ctrl+Alt+Fx, you can switch between individual terminals. By pressing
    Ctrl+Alt+F7, you can switch back to your graphical user interface.


    You can determine the terminal currently being used from the tty number (tty1–tty6).
    tty is an abbreviation for teletype, which is another word for terminal.


    When you switch to a virtual terminal, a login prompt appears:


    ```

    Welcome to SUSE Linux Enterprise Server 10 (i586) - Kernel 2.6.16.14-6-default
    (tty1).


    da51 login:

    ```

