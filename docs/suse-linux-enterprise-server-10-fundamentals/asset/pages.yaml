  md: 'The matched packages are listed in the right area. The installation state is
    shown by a small symbol in the package name. The most commonly displayed symbols
    include the following:


    # 3-13


    | | |

    |---|-|

    | ☐ Do not install | This package is not installed and it will not be installed.
    |

    | ☑ Install | This package will be installed. It is not installed yet. |

    | 🛠️ Keep | This package is already installed. Leave it untouched. |

    | ↻ Update | This package is already installed. Update it or reinstall it (if
    the versions are the same). |

    | ⌫ Delete | This package is already installed. Delete it. |

    | 🚫 Taboo | This package is not installed and should not be installed under any
    circumstances, especially because of unresolved dependencies that other packages
    might have or get. Packages set to "taboo" are treated as if they did not exist
    on any installation media. |

    | 🛡️ Protected | This package is installed and should not be modified, especially
    not because of unresolved dependencies that other packages might have or get.
    Use this status for third-party packages that should not be overwritten by newer
    versions that may come with the distribution. |

    | ⇩ Autostall | This package will be installed automatically because some other
    package needs it. Hint: You may have to use "taboo" to get rid of such a package.
    |


    To view a list of all possible symbols, select Help > Symbols.


    Select the symbol of the package you want to install several times until the Install
    symbol appears; then select Accept.


    You might see a dialog indicating that the dependencies between the packages cannot
    be solved and that other packages need to be installed, too. In most cases you
    can simply confirm this dialog.


    If the wrong CD or DVD is in your drive, a warning appears.'
