    \ System Interface for Unix) was developed from the IEEE and the Open Group for\
    \ Unix as standardized interface between application and operating system.\n\n\
    In SUSE Linux Enterprise Server, the manual pages are located in the directory\
    \ /usr/share/man/.\n\nIf you enter man -k keyword or apropos keyword, a list of\
    \ manual pages in which the keyword appears in the NAME section is displayed.\
    \ For example:\n\n```\ngeeko@da51:~ man -k printf\nvasprintf (3) - print to allocated\
    \ string\nwprintf (3) - wide-character formatted output of a stdarg\nargument\
    \ list\nvprintf (3) - formatted output conversion\nsprintf (3) - formatted output\
    \ conversion\nformat (n) - format a string in the style of sprintf\nswprintf (3)\
    \ - formatted wide character output conversion\nasprint (3) - print to allocated\
