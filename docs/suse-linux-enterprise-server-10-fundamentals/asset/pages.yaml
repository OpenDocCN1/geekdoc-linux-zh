- img_proc: true
  md: 'You can enter the software module name with the command yast or yast2, as in
    the following:


    +   - yast sw_single (text mode)


    +   - yast2 sw_single (graphical mode)


    ![](img/428e877abd09b1c11149d179d3458f12_90_0.png)


    To install a software package you can also enter yast -i package.rpm. The package
    is installed directly without any dialogs.


    To display a list of YaST options, enter one of the following:


    +   - yast --help


    +   - yast -h


    The main dialog of YaST is called the YaST Control Center.


    From here you can select a category on the left (such as Software or System) and
    a module on the right (such as Online Update) to configure and manage your system.


    When you finishing changes with a YaST module, YaST uses backend services such
    as SuSEconfig (see “Understand the Role of SuSEconfig” on 3-7) to implement the
    changes in the system.'
