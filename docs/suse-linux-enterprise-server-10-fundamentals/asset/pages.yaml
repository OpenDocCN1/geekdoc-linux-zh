- img_proc: true
  md: 'Linus Torvalds made the source code of his Linux kernel available with the
    GPL (GNU General Public License). The GPL allows everyone to read and edit the
    source code. The GPL license also requires any edited source code to be made available
    to the public.


    Linux rapidly developed into a project involving many people, although the development
    of the system''s core (Linux kernel) is still coordinated by Linus Torvalds. All
    kernel modifications are integrated by him.


    The functions of the kernel include input and output control, device control,
    process management, and file management. Other system components (shell utilities,
    network programs, and implementations of the kernel for non-Intel processors)
    are looked after by other people or groups.


    # The Software Differences Between SUSE Linux and SUSE Linux Enterprise Server


    SUSE Linux Enterprise Server 10 is based on the SUSE Linux 10.1 distribution.
    The time between release of distribution and release of SUSE Linux Enterprise
    Server is used for intensive testing and applying patches which improve security
    and stability of the system.


    Additionally, SUSE Linux Enterprise Server contains some features which will be
    made available in future versions of the SUSE Linux distribution.'
  merge: -1
