  md: '# /etc/shadow


    The /etc/shadow file stores encrypted user passwords and password expiration information.
    Most Linux systems use shadow passwords.


    The file can only be changed by the user root and read by the user members of
    the group shadow. The following is a sample

    /etc/shadow:


    ```

    at::!13181:0:99999:7::

    bin::*:13181::::

    demon::*:13181::::

    ftp::*:13181::::

    games::*:13181::::

    gdm::!13181:0:99999:7::

    lp::*:13181::::

    mail::*:13181::::

    man::*:13181::::

    mdns::*:13181:0:99999:7::

    new::*:13181::::

    nnody::*:13181::::

    tp::!13181:0:99999:7::

    postfix::*:13181:0:99999:7::

    root::$2a$05Q05LcLX1HgreDecUZJGluRppuaQM,NMVRdrdpm4nCyXeqe8

    ayou3::*:13181::::

    sshd::*:13181:0:99999:7::

    uucp::*:13181::::

    wwrun::*:13181::::ngeeko::$2a$05QJMMXzvcm0HNEErjvcGHOrPw5Kp9faXXRE4SgB4D1RLtpPGUp1:13181:0:99999:7:-1::

    ```


    Each line in the /etc/shadow belongs to one user and contains

    the following fields:


    ![](img/428e877abd09b1c11149d179d3458f12_276_0.png)'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'The above illustration shows the entry for the user geeko with an encrypted
    password. The plain text password is novel.


    Many users, such as wwwwn (Apache Web server) or bin have an asterisk (*) in the
    password field. This means that these users can not log in to the system, but
    are needed for special applications.


    If the password is empty, then the user can log in the system without entering
    a password. A password should always be set in a Linux system.


    The information at the end of each line determines some limits:


    +   - **Last Change.** Date of last password change. The number represents the
    number of days since January 1st, 1970.


    +   - **Next Possible Change.** Minimum age of a password before a user can change
    it.


    +   - **Next Obligatory Change.** Number of days a user can use the same password
    before it expires.


    +   - **Warning.** Number of days before password expiration that a warning is
    issued to users.


    Enter -1 to disable the warning.


    +   - **Limit.** Number of days after the password expires that the user can continue
    to log in.


    Enter -1 for unlimited access. (This does not make sense, of course.)


    +   - **Lock.** Date when the account expires. The date must be in the format
    YYYY-MM-DD.


    Leave the field empty if the account never expires.'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# /etc/group


    The file /etc/group stores group information. The following is a sample /etc/group
    file:


    ```

    at!:25:

    audio:x:17:

    bin:x:1:daemon

    cdrom:x:20:

    console:x:21:

    ...

    video:x:33:geeko

    wheel:x:10:

    www:x:8:

    xok:x:41:

    users:x:100:

    ```


    Each line in the file represents a single group record, and contains the group
    name, the GID (group ID), and the members of the group. For example


    ```

    video:x:33:geeko

    ```


    This is the entry for the group video in /etc/group and has a GID of 33. The user
    geeko is member of this group. The second field (x) is the password field.


    The /etc/groups file shows secondary group memberships, but does not identify
    the primary group for a user.'
  merge: -1
