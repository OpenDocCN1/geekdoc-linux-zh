  md: '# Objective 4 Identify KDE Desktop Components


    After you log in, your system will by default start the KDE desktop environment.
    It is composed of


    +   - The Desktop

    - The KDE Control Panel (Kicker)

    - The KDE Menu

    - Virtual Desktops


    # The Desktop


    On the desktop you will see only a few icons. You can start the applications associated
    with these icons by selecting them *once* your left mouse button.


    You can move the icons by dragging them with the mouse.


    # The KDE Control Panel (Kicker)


    The KDE desktop is operated by using the mouse on the KDE control panel (called
    the Kicker) located at the bottom of the desktop:


    ![](img/428e877abd09b1c11149d179d3458f12_321_0.png)


    The following are the most commonly used icons and their functions (from left
    to right):


    +   - **Green button.** Menu of all configured programs and functions (not of
    all programs and functions installed on the machine). This menu is called the
    KDE menu.

    - **House.** Conqueror, the preferred KDE file manager.'
  merge: -1
  pgno: 321
- img_proc: true
  md: '+   **Monitor.** A terminal window in which to type commands directly. The
    KDE terminal emulation is called Konsole.


    +   **Lifesaver with a chameleon head.** The SUSE Help Center.


    +   **Globe with gear wheel teeth.** Konqueror, the preferred KDE Web browser.


    +   **Globe with letter and calendar sheet.** The Contact personal information
    manager.


    +   **The white and grey box.** Virtual desktops.


    +   **The empty area right of the virtual desktops.** Task Manager area.


    +   **Globe.** Searches for new updates.


    +   **Clipboard with “k”.** Clipboard.


    +   **Clock.** Current time.'
