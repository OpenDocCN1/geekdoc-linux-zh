- img_proc: true
  md: '+   List of name servers. To address other computers in the network with their
    host names, identify the name server, which guarantees the conversion of computer
    names to IP addresses and vice versa.


    You can specify a maximum of three name servers.


    +   Domain search list. In the local network, it is more appropriate to address
    other hosts not with their FQDN, but with their names. The domain search list
    specifies the domains with which the system can expand the host name to the FQDN.


    This complete name is then passed to the name server to be resolved. For example,
    da51 is expanded with the list digitalairairlines.com to the FQDN da51.digitalairlines.com.
    This name is then passed to the name server to be resolved.


    If the search list contains several domains, the completion takes place one after
    the other, and the resulting FQDN is passed to the name server until an entry
    returns an associated IP address.


    Separate the domains with commas or white space.


    +   Routing. If the computer is intended only to reach other computers in the
    same subnet, then it is not necessary to enter any routes.'
  merge: -1
  pgno: 100
- img_proc: true
  md: 'However, if you need to enter a default gateway or create a routing table,
