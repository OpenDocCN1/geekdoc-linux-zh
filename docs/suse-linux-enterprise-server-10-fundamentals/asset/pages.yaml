  md: '# Objective 2


    # Describe Basic Linux User Security Features


    One of the main characteristics of a Linux operating system is its ability to
    handle several users at the same time (multiuser) and to allow these users to
    perform several tasks on the same computer simultaneously (multitasking).


    To maintain an environment where data and applications are secure, you need to
    understand the following:


    +   - File System Security Components

    - Users and Groups


    # File System Security Components


    As with other operating systems, you control access to files in a Linux file system
    by implementing the following types of components:


    +   - **Users.** Users are individual accounts on the Linux system.

    - **Groups.** Groups are collections of users. Users are assigned to a group when
    they are created. Only root or the owner of a file can change the group to which
    the file or directory is assigned. Every user must belong to least one group.

    - **Ownership.** The user who creates a file or directory is automatically assigned
    as its owner. Ownership can only be changed manually by root.

    - **Permissions.** Permissions determine user access to a file or directory.'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# Users and Groups


    Because Linux is a multiuser system, several users can work on the system at the
    the same time. For this reason the system uniquely identifies all users through
    user accounts that require a user name and password to log in to the system.


    In addition, Linux provides groups that let you associate users together that
    require the same type of access privileges to data and applications.


    To manage users and groups, you need to know the following:


    +   * User and Group ID Numbers

    * Regular vs. System Users

    * User Accounts and Home Directories

    * User and Group Configuration Files


    # User and Group ID Numbers


    Because an operating system can handle numbers much better than strings, users
    and groups are administered as numbers on a Linux system.


    The number which a user receives is called User ID (UID). Every Linux system has
    a privileged user, the user root. root is the administrator of the system. This
    user always has a UID of 0. UID numbering for normal users starts (by default)
    at 1000 for SUSE Linux.


    As with users, groups are also allocated a number called the Group ID (GID). Normal
    users are usually included in the group users. Other groups also exist (and can
    be created) for special roles or tasks.'
  merge: -1
  pgno: 269
- img_proc: true
  md: 'For example, all users who intend to create web pages can be placed in the
    group webedit. Of course, file permissions for the directory in which the web
    pages are located must be set so members of the group webedit are able to write
    and read files.


    You can use the command `id` to display information about a user’s UID and which
    groups she is assigned to. For example, entering `id geeko` provides information
    about the user geeko:


    ```

    geeko@da51:~ id

    uid=1000 (geeko) gid=100(users)

    groups=16(dialout), 33 (video), 100(users)

    geeko@da51:~

    ```


    This information includes the following:


    +   - **User ID**: uids=1000(geeko)

    - **Current default (effective) group**: gid=100(users)

    - **All groups of geeko is a member**: groups=16(dialout), 33(video), 100(users).


    If you want information on the groups in which you are a member, enter `groups`.
    You can specify a particular user by entering `groups user`.


    ```

    geeko@da51:~ groups geeko

    geeko : users dialout video

    geeko@da51:~

    ```'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'You can display additional information about local users by entering finger
    user, as illustrated in the following:


    ```

    geeko@da51:-> finger geeko

    Login: geeko Name: Geeko Chameleon

    Directory:/home/geeko Shell: /bin/bash

    On since Fri Feb 10 12:50 (MST) on :0 (messages off)

    On since Fri Feb 10 13:38 (MST) on pts/0 from :0.0

    No Mail.

    No Plan.

    geeko@da51:->

    ```


    # Regular vs. System Users


    In a Linux operating system, there are two basic kinds of users accounts:


    +   * Regular (normal) users. These are user accounts that allow to log in to
    the Linux environment. This type of login gives people a secure environment for
    accessing data and applications.


    These user accounts are managed by the system administrator.


    +   * System users. These are user accounts created during installation that are
    used by services, utilities, and other applications to run effectively on the
    server.


    These users do not need any maintenance.


    All users are stored in the files /etc/passwd and /etc/shadow.'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# User Accounts and Home Directories


    Each user has a user account identified by a login name and a personal password
    for logging in to the system.


    By having user accounts, you are able to protect a user''s personal data from
    being modified, viewed, or tampered with by other users. Each user can set up
    her own working environment and always find it unchanged when she logs back in.


    As part of these security measures, each user in the system has her own directory
    in the directory /home.


    The exception to this rule is the account root. It has its own home directory
    in /root.


    Home directories allow personal data and desktop settings to be secured for user
    access only.


    > You should avoid using the root account when performing day-to-day tasks that
    do not involve system management.


    ![](img/428e877abd09b1c11149d179d3458f12_272_0.png)'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# User and Group Configuration Files


    The Linux system stores all user and group configuration data in the following
    files:


    +   - /etc/passwd

    - /etc/shadow

    - /etc/group


    Whenever possible, you should not modify these files with an editor. Instead use
    the Security and Users modules provided in YaST or the command line tools described
    in "Manage User and Group Accounts From the Command Line" on 8-27.


    Modifying these files with an editor can lead to errors (especially in /etc/shadow),
    such as a user—including the user root—no longer being able to log in.


    # /etc/passwd


    The file /etc/passwd stores information for each user such as the user name, the
    UID, the home directory, and the login shell.


    In the past, /etc/passwd also contained the encrypted password. However, because
    the file needs to be readable by all (e.g., to show user and group names when
    using ls -l), the encrypted password is now stored in /etc/shadow, which is only
    readable by root and members of the group shadow.'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# The following is a sample /etc/passwd file:


    ```

