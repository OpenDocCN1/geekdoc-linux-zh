- img_proc: true
  md: '# Objective 4


    # Understand Command Syntax and Special Characters


    You can use specific characters to provide special functionality. Using them can
    save you a lot of time and effort. In this objective, you will will learn about
    the following:


    +   - Select your Character Encoding

    - Name Expansion Using Search Patterns

    - Prevent the Shell from Interpreting Special Characters


    # Select your Character Encoding


    SUSE Linux Enterprise Server is internationalized and can be adapted to local
    standards easily.


    There are some variables that determine the localization. Use the command `locale`
    to get a list of the localization variables.


    ```

    geeko@da51:-> locale

    LANG=en_US.UTF-8

    LC_CTYPE=en_US.UTF-8

    LC_NUMERIC=en_US.UTF-8

    LC_TIME=en_US.UTF-8

    LC_COLLATE=en_US.UTF-8

    LC_MONETARY=en_US.UTF-8

    LC_MESSAGES=en_US.UTF-8

    LC_PAPER=en_US.UTF-8

    LC_NAME=en_US.UTF-8

    LC_ADDRESS=en_US.UTF-8

    LC_TELEPHONE=en_US.UTF-8

    LC_MEASUREMENT=en_US.UTF-8

    LC_IDENTIFICATION=en_US.UTF-8

    LC_ALL=

    geeko@da51:->

    ```


    The variable LANG specifies the language. In this example the language is set
    to US English.'
  merge: -1
  pgno: 225
- img_proc: true
  md: 'The characters are encoded in UTF-8 (UCS Transformation Format), which means
    Unicode (Universal Character Set). Unicode has the advantage that it is possible
    to use all kind of letters and not only Latin letters.


    For all users SUSE Linux Enterprise server uses UTF-8 encoding. The exception
    is user root.


    ```

    da51:- # locale

    LANG=POSIX

    LC_CTYPE=en_US.UTF-8

    LC_NUMERIC="POSIX"

    LC_TIME="POSIX"

    LC_COLLATE="POSIX"

    LC_MONETARY="POSIX"

    LC_MESSAGES="POSIX"

    LC_PAPER="POSIX"

    LC_NAME="POSIX"

    LC_ADDRESS="POSIX"

    LC_TELEPHONE="POSIX"

    LC_MEASUREMENT="POSIX"

    LC_IDENTIFICATION="POSIX"

    LC_ALL=

    #

    ```


    There the LANG variable is set to POSIX, which means the characters are ASCII
    encoded.


    The state of the LANG variable is important for this section, because the results
    depend on the type of encoding. The order of the characters is different in POSIX
    and in UTF-8.'
  merge: -1
  pgno: 226
- img_proc: true
  md: 'You can see the differences between UTF-8 and POSIX encoding,

    when you use the ls command. For user Geeko, the content of the

    directory /usr/share/doc/packages/yast2-users/ looks like this:


    ```

    geeko@da51:~$ ls -1 /usr/share/doc/packages/yast2-users/

    total 65

    drwxr-xr-x 2 root root 1352 2006-06-02 15:42 autodocs

    -rw-r--r-- 1 root root 17992 2006-01-27 00:34 COPYING

    -rw-r--r-- 1 root root 17992 2006-01-27 00:34

    -rw-r--r-- 1 root root 2013 2005-09-08 02:36 crack.html

    -rw-r--r-- 1 root root 75 2006-01-27 00:34 README

    -rw-r--r-- 1 root root 193 2005-09-08 02:36 TDO.txt

    -rw-r--r-- 1 root root 9583 2005-09-08 02:36 users.html

    geeko@da51:~$

    ```


    For user root output:


    ```

    da51:~$ ls -1 /usr/share/doc/packages/yast2-users/

    total 79

    drwxr-xr-x 3 root root 248 Feb 2 15:42

    drwxr-xr-x 492 root root 13976 Feb 2 16:02

    -rw-r--r-- 1 root root 17992 Jan 27 00:34 COPYING

    -rw-r--r-- 1 root root 17992 Jan 27 00:34

    COPYING.english

    -rw-r--r-- 1 root root 75 Jan 25 08:36 README

    -rw-r--r-- 1 root root 193 Sep 8 02:36 TDO.txt

    drwxr-xr-x 2 root root 1352 Feb 2 15:42 autodocs

    -rw-r--r-- 1 root root 2013 Sep 8 02:36 crack.html

    -rw-r--r-- 1 root root 9583 Sep 8 02:36 users.html

    da51:~$ #

    ```


    The first file in the list of the normal user is autodocs. The first file

    in the list of user root is COPYING.


    In the POSIX encoding table all the lowercase characters are behind

    the uppercase characters. In UTF-8 the lowercase “a” follows the

    uppercase “A” immediately.


    This means, between “A” and “C” in POSIX, the only character is

    “B”. But in UTF-8, there are “a”, “B” and “b” in between.'
  merge: -1
  pgno: 227
- img_proc: true
  md: 'Work with the Linux Shell and Command Line


    The behavior of POSIX encoding is much more intuitive here and we recommend setting
    the LANG variable to POSIX for this section.


    To change the locale variables permanently, you have to edit the file /etc/sysconfig/language.
    The functionalities of the other variables are described in that file. Further
    information you can find in the man page of locale (man locale).


    # Name Expansion Using Search Patterns


    Occasionally, you might want to perform operations on a series of files without
    having to name all files. In this case, you could make use of the following search
    patterns:


    | Search Pattern | Description |

    |---|---|

    | ? | Any single character (except "/") |

    | * | Any string length, including zero characters (except "*" at the beginning
    of a file name and "/") |

    | [0-9] | Any of the characters enclosed (here: numbers from 0 to 9). |

    | [a-ek-s] | Any character from the ranges a-e and k-s. |

    | [abcdef] | Any of these characters. |

    [!abc] | None of these characters. |


    Some of the search patterns have a different meaning than they have as regular
    expressions.


    Version 1 copying all or part of this manual, or distributing such copies, is
    strictly prohibited. To report suspected copying, please call 1-800-PIRATES. 6-17'
  merge: -1
  pgno: 228
- img_proc: true
  md: 'Following is an example of using some of these search patterns:


    ```

    geeko@da51:/usr/X11/bin > ls xc*

    calc xclibboard xclock xcmsdb xconsole xcursorsgen xutsel

    geeko@da51:/usr/X11/bin > ls [alo]*

    calc xclibboard xclock xconsole

    geeko@da51:/usr/X11/bin > ls xc[!o]*

    calc xclibboard xclock xcmsdb xcursorsgen xutsel

    geeko@da51:/usr/X11/bin > ls xc*1*

    calc xclibboard xclock xconsole

    ```


    If search patterns (wild cards) are given on the command line, the shell tries
    to compare these with the filenames in the file system and, if they match, the
    expression is replaced with all the filenames found.


    # Prevent the Shell from Interpreting Special Characters


    To prevent the shell from interpreting special characters in the command line,
    these characters must be “masked” by using the following:


    +   \: The backslash protects one character from being interpreted by the shell,
    as in the following:


    ```

    geeko@da51:- > mkdir new\ directory

    geeko@da51:- >

    ```


    +   ". Double quotes protect all special characters except $, \ and ` (back tick)
    from being interpreted by the shell, as in the following:


    ```

    geeko@da51:- > echo Home = $HOME

    Home = /home/geeko

    geeko@da51:- > echo "Home" $HOME

    Home = /home/geeko

    geeko@da51:- >

    ```'
  merge: -1
  pgno: 229
- img_proc: true
  md: '+   • Apart from regular expressions, variables are also protected with single
    quotes, as in the following:


    ```

    geeko@da51:-~ > echo ''Home'' = $HOME''

    Home = $HOME

    geeko@da51:- >

    ```'
  merge: -1
