  pgno: 97
- img_proc: true
  md: 'When choosing the IP address, you need to know if the computer will be directly
    connected to the Internet. In this case, use an assigned official IP address.
    Otherwise, use an address from a private address space.


    +   - Subnet Mask. The network mask (referred to as subnet mask in YaST), determines
    which network an IP address is located.


    The mask divides the IP address into a network section and a host section, thus
    defining the size of a network. All computers within the network can reach each
    other directly without a router in between.


    +   - Hostname and Name Server. Computers in the network can be addressed directly
    using their IP addresses or with a unique name. A name server (DNS) must exist
    for the resolution of names into IP addresses and vice versa.


    After selecting Hostname and Name Server and if you are using DHCP, the following
    appears:


    # Figure 3-8


