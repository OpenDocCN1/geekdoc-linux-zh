    # SUSE Linux Enterprise Server 10 Support and Maintenance


    The copy of SUSE Linux Enterprise Server 10 you receive in your student kit is
    a fully functioning copy of the SUSE Linux Enterprise Server 10 product.


    However, to receive official support and maintenance updates, you need to do one
    of the following:


    +   - Register for a free registration/serial code that provides you with 30 days
    of support and maintenance.

    - Purchase a copy of SUSE Linux Enterprise Server 10 from Novell (or an authorized
    dealer).


    You can obtain your free 30-day support and maintenance code at http://www.novell.com/products/linuxenterpriseserver/eval.html.


    You will need to have or create a Novell login account to access the 30-day evaluation.'
