  md: '# APPENDIX B Network Components and Architecture


    One of the essential characteristics of human beings is their highly developed
    capacity for communication. Communication is dependent on and part of social interaction.


    If you imagine the people involved in a conversation as points and their social
    interactions as lines, the result is a simple kind of network.


    A computer network can be defined as a number of hosts to each other that exchange
    information across a connection (such as a cable or wireless medium).


    A host does not need to be a computer. It can also be a network-capable printer
    or a terminal. In many networks, hosts are separated into clients and servers.


    A server is a host providing a specific network service. A client is a host that
    requests the use of a network service. It is not always possible to strictly distinguish
    between both, because a server also acts as a client (or vice versa).


    However, network and connections alone are not enough to guarantee successful
    communication. Hosts must also use the same network protocol (such as TCP/IP)
    to transmit data. In other words, hosts must speak a common language.'
  merge: -1
  pgno: 332
- img_proc: true
  md: 'Before connecting your SUSE Linux Enterprise Server as a host to a network,
    you need to understand the following networking basics:


    +   - Network Types

    - Client/Server and Peer-to-Peer Computing

    - Network Topology

    - Elements of a Network

    - TCP/IP Layer Model


    # Network Types


    On the basis of the geographical area covered, a network can be classified into
    the following types:


    +   - Local Area Network (LAN)

    - Metropolitan Area Network (MAN)

    - Wide Area Network (WAN)


    # Local Area Network (LAN)


    A LAN is the simplest form of a network in which computers in a single location
    are connected using cables or a wireless medium.'
  merge: -1
  pgno: 333
- img_proc: true
  md: 'The following shows a LAN:


    # Figure B-1


    ![](img/428e877abd09b1c11149d179d3458f12_334_0.png)


    A LAN connects computers located in a relatively small area. You can create a
    LAN within a single building or cover a group of buildings.


    For example, suppose the employees of the Sales Airlines need to frequently access
    information related to sales. This data is stored on different computers within
    the same building.


    To enable easy access to the stored information, you can use a LAN to connect
    the computers.'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# Metropolitan Area Network (MAN)


    A MAN is an extended version of a LAN. It covers a group of nearby buildings.


    The following shows a MAN connecting two organizations located in different buildings:


    Figure B-2


    ![](img/428e877abd09b1c11149d179d3458f12_335_0.png)


    For example, suppose the Marketing division of Digital Airlines is located in
    another building of the same city.


    You can create a MAN to enable the Marketing employees to access data from the
    computers in the Sales division.


    # Wide Area Network (WAN)


    A WAN connects multiple LANs and spans a large geographical area using fiber optic
    cables and wireless. On a WAN, networks are connected normally through specialists
    such Internet Service Providers (ISPs).'
  merge: -1
  pgno: 335
- img_proc: true
  md: 'The following shows two divisions of an organization connected through a satellite:


    # Figure B-3


    ![](img/428e877abd09b1c11149d179d3458f12_336_0.png)


    For example, suppose Digital Airlines has decided to open marketing departments
    in different parts of the world. The employees in these departments require the
    information stored on the computers of the Sales division.


    To enable the employees to access the required information, a WAN is created by
    connecting the LANs of the marketing departments to the network of the Sales division.


    The technologies used to link WANs are provided by a WAN service provider.'
  merge: -1
  pgno: 336
- img_proc: true
  md: 'There are two types of WANs:


    +   - **Enterprise.** This connects the LANs of an organization that has divisions
    and departments in various cities of the world. For example, an organization can
    have an enterprise WAN for connecting its Sales offices in various cities.


    +   - **Global.** This spans the earth and includes the networks of several organizations.
    An example of a global WAN is the Internet.


    # Client/Server and Peer-to-Peer Computing


    The following are the common implementations of the computing models used to create
    networks:


    +   - Client/Server Network

    - Peer-to-Peer Network


    # Client/Server Network


    A client/server network combines the processing and storage features of the centralized
    and distributed computing models. In this model, several computers (known as clients)
    are connected to a server.


    On a network, a computer requests services. The computer that provides the requested
    services to the client is called a server.


    On a client/server network, you can to run programs such as spreadsheet or word-processing
    applications on a client and save data on a server.


    The client/server network uses network operating systems (NOSs), such as SUSE
    Linux, Novell NetWare, or Windows NT/2000.'
  merge: -1
  pgno: 337
- img_proc: true
  md: 'The classification of clients and servers introduces the concept of the server-centric
    network. On this type of network, a server is assigned the role of a service provider.
    The client performs the role of a service requester.


    This type of network also allows for backup services and reduces network traffic.


    # Peer-to-Peer Network


    A peer-to-peer network consists of peers—computers that can act both as service
    providers and requesters.


    On a peer-to-peer network, any computer can request and provide network resources.
    Software used in peer-to-peer networks is designed in a way that peers can perform
    similar functions for each other.


    A negative aspect of a peer-to-peer network is that there is no need for server-level
    security.


    You can create a peer-to-peer network using operating systems as SUSE Linux, Novell
    NetWare, Windows XP, and Windows 2000 Professional.


    # Network Topology


    A topology is a pictorial representation of the layout of a network. Selecting
    an appropriate network topology enables you to create an efficient, reliable,
    and cost-effective network.


    The following are the types of network topologies:


    +   * Bus

    * Ring

    * Star'
  merge: -1
  pgno: 338
- img_proc: true
  md: '+   * Mesh

    * Wireless


    # Bus


    In a bus topology, all devices are connected to a central cable. This central
    cable is called the bus or the backbone. This topology is mainly used for small
    networks.


    The following shows the arrangement of computers in the bus topology:


    ![](img/428e877abd09b1c11149d179d3458f12_339_0.png)


    You implement this topology using coaxial cables.


    When a computer in the bus topology wants to transmit a signal, the computer checks
    whether the bus is free for transmission.


    If the bus is free and no other computer is transmitting a signal, the signal
    is sent to each computer on the network.


    These signals carry information about the destination address with them. When
    all computers on the same bus receive the signal, the computers check the destination
    address against their own addresses.'
  merge: -1
  pgno: 339
- img_proc: true
  md: 'When a workstation receives a signal with a different destination address than
    its own, the signal is dropped.


    This topology is easy and relatively inexpensive to implement. In addition, networks
    using the bus topology can be easily extended.


    A disadvantage of using this topology is that the strength of signals is reduced
    considerably as they travel the cable. This limits the number of devices that
    can be attached to a bus to 30.


    If the cable or bus is damaged, the network stops functioning. Therefore, networks
    based on the bus topology are difficult to troubleshoot. In addition, heavy traffic
    deteriorates the performance of the network.


    # Ring


    In a ring topology, all computers are connected to one another in the shape of
    a closed loop. This creates a ring in which each computer is connected directly
    to two other computers, on either side.


    Ring topology was designed by IBM, and is illustrated in the following:


    Figure B-5


    ![](img/428e877abd09b1c11149d179d3458f12_340_0.png)'
  merge: -1
  pgno: 340
- img_proc: true
  md: 'It is not practical to have pure ring topology implementations because a network
    based on a ring topology cannot be easily reconfigured. To add or remove computers
    from a network using the ring topology, you have to break the ring.


    A network based on the ring topology uses a method called token passing* to transmit
    data. In this method, an empty token is passed around the ring. Tokens travel
    around a 600-meter ring about 477,000 times per second.


    The device that wants to transmit data signals acquires the token. Data signals
    pass through each device on the ring and reach the destination computer. When
    the destination device receives the data, it sends back a signal acknowledging
    receipt of data to the source device.


    The signal is called as an acknowledgement signal. After receiving an acknowledgement
    signal, the token is emptied and passed to another device on the network that
    wants to start data transmission.


    A network based on the ring topology uses unshielded twisted pair and fiber optic
    cables. The cost of a network based on this topology varies depending upon the
    type of cable used. This topology is not used widely because it requires expensive
    and specialized equipment.


    Data transmission on this type of network is fast. The network does not weaken
    the strength of the signal and enables data to travel large distances. Therefore,
    a large number of devices can be attached to the network.


    However, the failure of a computer or a cable segment can cause the entire network
    to stop functioning. Therefore, a network based on a ring topology is not easy
    to troubleshoot.'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# Star


    In a star topology, all computers are connected to a switch, and all data passes
    through the switch before reaching its destination. Although a switch is involved,
    the underlying topology is still a bus or a ring.


    A star topology is the most popular technology used to network computers. Networks
    using the star topology are easy to install and manage.


    The following shows the arrangement of computers in a star topology:


    Figure B-6


    ![](img/428e877abd09b1c11149d179d3458f12_342_0.png)


    A network using the star topology is implemented using twisted pair cables with
    the switch.


    You can increase the number of devices used by adding more switches to the network.
    This enables you to expand the network easily.


    When compared with the bus topology, the star topology is easier to troubleshoot.
    If one computer on the network fails and is disconnected, the network is not affected.'
  merge: -1
  pgno: 342
- img_proc: true
  md: 'A disadvantage is that all data on the network must pass through the switch.
    If the central switch fails, all devices attached to the switch are disconnected
    from the network.


    # Mesh


    In a mesh topology, all devices are connected through many redundant interconnections
    between network nodes. Every node has a connection to every other node on the
    network.


    A mesh topology is a theoretical concept. Its practical implementation is limited
    to a few devices. The interconnection between each device makes the physical design
    of the network too complex and difficult to troubleshoot.


    The Internet is an example of a mesh network. Various routers on the Internet
    interface with different networks.


    The mesh topology is classified into the following types:


    +   * Full mesh. In a full mesh topology, every computer on the network is connected
    to every other computer or device. This creates dedicated connections between
    all the computers.


    Mesh networks are interconnected using WAN or MAN links.'
  merge: -1
  pgno: 343
- img_proc: true
  md: 'The following shows the arrangement of computers in a full mesh topology:


    # Figure B-7


    ![](img/428e877abd09b1c11149d179d3458f12_344_0.png)


    If any two computers on the network are unable to communicate, the cable connecting
    the two computers would develop a fault.


    The full mesh topology offers alternative paths for transmitting data when one
    of the devices on the network fails. The data can be sent through any other device
    attached to the active device.


    However, full mesh topology is impractical and can be expensive to implement.


    +   **Partial mesh.** In a partial mesh topology, each computer is connected to
    all other computers or devices. A few devices are connected using the full mesh
    topology, and the others are connected to one or two devices on the network.'
  merge: -1
  pgno: 344
- img_proc: true
  md: 'SUSE Linux Enterprise Server 10 Fundamentals


    The following shows the arrangement of computers in a partial mesh topology:


    # Figure B-8


    ![](img/428e877abd09b1c11149d179d3458f12_345_0.png)


    The partial mesh topology is less expensive than the full mesh topology.


    # Wireless


    In a wireless topology, all devices are connected to each other through an access
    point without a physical cable.


    In the wireless topology, geographic areas are divided into cells. Each cell represents
    the area of the network where a specific connection operates.


    Devices within a cell communicate with a switch. Switches, in turn, are interconnected
    to route data across the network.


    Copying all or part of this manual, or distributing such copies, is strictly prohibited.
    To report suspected copying, please call 1-800-PIRATES.


    B-14


    Version 1'
  merge: -1
  pgno: 345
- img_proc: true
  md: 'The following shows the cells in a wireless topology:


    # Figure B-9


    ![](img/428e877abd09b1c11149d179d3458f12_346_0.png)


    This topology does not depend on the interconnection of cables. It depends on
    the location of the wireless switches.


    A device can roam from one cell to another and still maintain a network connection.


    On a network based on the wireless topology, complex and expensive devices are
    required to ensure communication.


    The failure of any access point affects the network. However, you can easily troubleshoot
    the network because there is no physical interconnection between devices.


    In addition, you can easily reconfigure the network because it supports mobile
    devices.'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# Elements of a Network


    The following are the elements of a network:


    +   - Network Nodes

    - Transmission Media

    - Network Protocols

    - Network Connections (Sockets)

    - Network Services


    # Network Nodes


    *Network nodes* are processing locations on a network. A node can be a computer
    or a device, such as a printer. Every node on a network has a unique address,
    distinguishing it from other nodes.


    # Transmission Media


    *Transmission media* are the paths used by network components to access data or
    resources. Transmission media provide a transmission path for data.


    Transmission media include *bounded* and *unbounded* technologies. Bounded technologies
    use cables for transmission purposes; unbounded technologies use radio waves for
    transmission.'
  merge: -1
  pgno: 347
- img_proc: true
  md: 'The following shows how transmission media provide a path for data on a network:


    # Figure B-10


    ![](img/428e877abd09b1c11149d179d3458f12_348_0.png)


    The following are commonly used transmission media:


    +   - Copper wire cabling (bounded)

    - Radio waves or microwave (unbounded)

    - Fiber optic cable (bounded)'
  merge: -1
  pgno: 348
- img_proc: true
  md: '# Network Protocols


    Network protocols enable network elements to communicate with each other.


    To understand the basics of protocols, consider this example. Suppose two people
    are trying to communicate with each other without knowing each other''s language.
    They would require an interpreter to facilitate communication.


    Similarly, protocols ensure communication between different network nodes. Protocols
    are sets of rules that enable different network nodes to communicate.


    Protocols can have different capabilities, depending on the purpose for which
    they are designed, and can be classified into the following types:


    +   - **Routable protocols.** These enable communication between networks connected
    to each other through a device known as a router.


    Routable protocols are like phone services that allow you to make local and long-distance
    phone calls. Routable protocols can communicate across routers.


    +   - **Nonroutable protocols.** These are limited to networks composed of a small
    number of computers.


    Nonroutable protocols are like phone services that allow you to make only local
    phone calls. Nonroutable protocols cannot communicate across routers.


    > For details on routable and nonroutable protocols, see "Internet Layer" on B-24.


    ![](img/428e877abd09b1c11149d179d3458f12_349_0.png)'
  merge: -1
  pgno: 349
- img_proc: true
  md: 'Protocols can be further classified as follows:


    +   - **Connection-oriented.** These inform the sender that the delivery of data
    was successfully delivered by sending an acknowledgment when data is received
    at the destination.


    Connection-oriented protocols act like courier services that send packages. When
    you send a package by a courier service, you receive a delivery receipt after
    the package is delivered.


    Consider an example of using a connection-oriented protocol. During an online
    stock transaction, it is important to have all the packets required for a complete
    transaction. If any data packet is lost, the stock transaction does not occur.


    In this example, you can use a connection-oriented protocol to make sure all data
    packets reach the destination.


    +   - **Connectionless.** These send data across networks but do not provide feedback
    about the successful data delivery.


    Connectionless protocols function like a postal service. When you mail a letter
    at the post office, you do not get feedback about its arrival at the destination.


    For example, connectionless protocols are used when sending streaming video files.
    Even if a packet is lost during transmission, the loss creates only a small比如
    in the video image. The video image can still be viewed and understood.


    Connectionless protocols involve smaller overhead and are faster than connection-oriented
    protocols.


    ![](img/428e877abd09b1c11149d179d3458f12_350_0.png)


    For details on connection and connectionless protocols, see “Internet Layer” on
    B-24 and “Transport Layer” on B-33.'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# Network Connections (Sockets)


    In UNIX and some other operating systems, a software object that connects an application
    to a network protocol is called a socket. This enables two-way communication between
    programs on a network.


    For example, a program can send and receive TCP/IP messages by opening a socket
    and reading data from writing data to the socket.


    This simplifies program development because the programmer only needs to worry
    about working with the socket and can rely on the operating system to actually
    transport messages across the network correctly.


    Each socket gets bound to a given port, which lets the transport layer protocol
    (such as TCP or UDP) identify which application to send data to.


    For TCP and UDP protocols, a socket on a host is defined as the combination of
    an IP address and a port number (such as http://192.168.1.1:5801).


    ![](img/428e877abd09b1c11149d179d3458f12_351_0.png)


    Another type of socket used by POSIX compliant systems (called POSIX Local IPC
    Sockets or simply ipc sockets) facilitates interprocess communication. These connections
    are from the local computer to itself, and not a connection over a physical network.


    ![](img/428e877abd09b1c11149d179d3458f12_351_1.png)


    For details on TCP and UDP protocols see “Transmission Control Protocol (TCP)”
    on B-34 and “User Datagram Protocol (UDP)” on B-38.'
  merge: -1
  pgno: 351
- img_proc: true
  md: '# Network Services


    Network services are programs that let users share network resources. On a network,
    nodes use network services to communicate using transmission media, such as cables.


    Network services require resources and processing capabilities to accomplish a
    task, such as data processing.


    Some examples of network services are CUPS (Common Unix Printing System), DNS
    (for name resolution), and NFS (for network file services).


    # TCP/IP Layer Model


    Over the years, the functions of networks have grown in complexity due to different
    types of networks needing to be connected and the increasing number and requirements
    of applications.


    Because of this increasing complexity, an attempt has been made to combine individual
    tasks within a network into groups and implement them as packages.


    In the network environment, these packages are organized as layers stacked on
    top of each other. The overall model is referred to as the layer model.


    One of the best-know layer models is the OSI (Open Systems Interconnection) reference
    model for open systems. In this model, a communication system is divided into
    7 layers.'
  merge: -1
  pgno: 352
- img_proc: true
  md: 'However, as shown in the following comparison, another well-known model, the
    TCP/IP layer model, has only 4 layers:


    # Figure B-11


    | ISO/OSI Reference Model | TCP/IP Reference Model |

    |--- | --- |

    | Application Layer | Application Layer |

    | Presentation Layer | |

    | Session Layer | |

    | Transport Layer | Transport Layer |

    | Network Layer | Internet Layer |

    | Data Link Layer | Network Access Layer |

    | Physical Layer | |


    With the TCP/IP model, the 3 upper layers of the OSI model are combined into the
    application layer and the two lower layers into the network access layer.


    The following describe the layers in the TCP/IP model:


    +   - Network Access Layer

    - Internet Layer

    - Transport Layer'
  merge: -1
  pgno: 353
- img_proc: true
  md: '+   - Application Layer


    # Network Access Layer


    In the TCP/IP layer model, the physical layer and the data link layer of the OSI
    model are combined into the network access layer:


    Figure B-12


    ![](img/428e877abd09b1c11149d179d3458f12_354_0.png)


    One reason TCP/IP is so popular that it runs on the different network architectures
    for WANs and LANs, such as the following:


    +   - Ethernet

    - Token bus

    - Token ring

    - ATM (Asynchronous Transfer Mode)

    - FDDI (Fiber Distributed Data Interface)


    It also provides the following solutions via telephone for IP:'
  merge: -1
  pgno: 354
- img_proc: true
  md: '+   - PPP (Point to Point Protocol)

    - SLIP (Serial Line Interface Protocol)


    # Internet Layer


    The Internet layer of the TCP/IP model ensures the connection between individual
    hosts in the network beyond the limits of individual networks in the Internet:


    # Figure B-13


    ![](img/428e877abd09b1c11149d179d3458f12_355_0.png)


    The main tasks of the Internet layer are providing an address space for the Internet,
    routing, and data transfer between end systems (host computers).


    The following are protocols of the Internet layer (with IP as the most popular):


    +   - Address Resolution Protocol (ARP)

    - Internet Protocol (IP)

    - Internet Control Message Protocol (ICMP)'
  merge: -1
  pgno: 355
- img_proc: true
  md: '# Address Resolution Protocol (ARP)


    ARP (Address Resolution Protocol) (RFC 826) resolves IP addresses to hardware
    addresses (MAC addresses, Medium Access Control).


    The MAC address is always composed of 6 bytes (in hexadecimal notation). The first
    3 bytes indicate the manufacturer, and the last 3 bytes are the serial number
    of the network card.


    If there are two network cards present, both with the same serial number, you
    can specify (under Linux) which MAC address the network card should use to reply.


    As illustrated in the following, a special MAC address (all bits to ff:ff:ff:ff:ff:ff)
    is used for the ARP broadcast:


    # Figure B-14


    ![](img/428e877abd09b1c11149d179d3458f12_356_0.png)


    The following describes the process:


    +   1. Host A issues a query to all computers through an ARP broadcast request
    via ping C: “Who is host C?”'
  merge: -1
  pgno: 356
- img_proc: true
  md: '+   2. Host C replies (ARP reply): “My hardware address is 00:50:34:B0:CF:07.",


    +   3. The communication is established.


    Host A memorizes the reply to its query in a cache. You can view this cache with
    the command arp (/sbin/arp/arp). The command also provides options for editing
    the cache, such as deleting an invalid assignment of a MAC address to an IP address
    (arp -d hostname).


    For details on the command arp, enter man arp.


    You can use the program arpwatch (/usr/sbin/arpwatch) to monitor ARP requests
    and replies. By doing this, you can locate errors in the ARP traffic.


    # Internet Protocol (IP)


    IP provides the underlying services for transferring data between end systems
    in TCP/IP networks and is specified in RFC 791.


    Data is transported through the network in packet form (also datagrams). The main
    characteristics of this protocol are that it is connectionless and unreliable.


    The fact that IP is a connectionless protocol means that no end-to-end connection
    of communication partners is set up for data transfer.


    In addition, IP is an unreliable protocol because it has no mechanisms for error
    detection or error correction. In other words, unreliable means that IP cannot
    guarantee delivery of data.


    However, if data arrives at the destination host, the data is correct. This is
    guaranteed by the Network Access layer.'
  merge: -1
  pgno: 357
- img_proc: true
  md: 'The following are the basic tasks performed by IP:


    +   - Specifies datagrams that form the basic units for transferring data in the
    Internet


    +   - Defines the addressing scheme


    +   - Routes, exchanges, and transfers datagrams through the network


    +   - Fragments and assembles of datagrams


    Every packet or datagram transmitted over the TCP/IP network has an IP header.
    The following shows how the header of an IP datagram is constructed:


    # Figure B-15


    ![](img/428e877abd09b1c11149d179d3458f12_358_0.png)


    The following describes the elements of the IP header:


    +   - **Version (4 bits).** Specifies the format of the IP packet header.


    +   - **IHL (Internet Header Length, 4 bits).** Specifies the length of the IP
    packet header.


    +   - **TOS (Type of Services, 8 bits).** Specifies the parameters for the type
    of service requested, such as priority, reliability, and monetary cost.'
  merge: -1
  pgno: 358
- img_proc: true
  md: "+   - **Total length (16 bits).** Contains the length of the datagram.\n\n\
    +   - **Identification (16 bits).** Identifies the fragments of one datagram from\
    \ those of another.\n\n+   - **Flags (3 bits).** Include the following:\n    -\
    \ R (Reserved, 1 bit)\n    - DF (Don't Fragment, 1 bit). Controls the fragmentation\
    \ of the datagram.\n    - MF (More Fragments, 1 bit). Indicates if the datagram\
    \ contains additional fragments.\n\n+   - **Fragment Offset (13 bits).** Used\
    \ to direct the reassembly of a fragmented datagram.\n\n+   - **TTL (Time To Live,\
    \ 8 bits).** Used to track the lifetime of the datagram.\n\nWhen traversing a\
    \ router, the TTL of a datagram is reduced by 1. If the TTL is 0, it will be discarded\
    \ by a router.\n\n+   - **Protocol (8 Bits).** Specifies the next encapsulated\
    \ protocol (such as ICMP, TCP, UDP).\n\n+   - **Header Checksum (16 bits).** Specifies\
    \ the checksum of the IP header and IP options.\n\n+   - **Source Address (32\
    \ bits).** Specifies the IP address of the sender.\n\n+   - **Destination Address\
    \ (32 bits).** Specifies the IP address of the intended receiver.\n\n+   - **Options.**\
    \ Of variable length.\n\n+   - **Padding (variable length).** Used as a filter\
    \ to guarantee that the data starts at the 32 bit boundary."
  merge: -1
  pgno: 359
- img_proc: true
  md: 'The following are additional TCP/IP topics you should be familiar with:


    +   - Routing. The main characteristic of IP is its connectionless data transfer
    (packet exchange) between two computers. This means that each packet a new path
    through the network is sought.


    The advantage of this approach lies in its robustness. If a cable fails for any
    reason, packets can take a different route (if there is one).


    The task of routing is to find a path through the Internet for each packet to
    send from machine A to machine B. To do this, routing protocols and algorithms
    are used.


    +   - IP addresses. In IP-based networks, each network interface of a computer
    has a unique, 32-bit IP address.


    For the sake of readability, these 32 bits are not shown as a sequence of 32 zeros
    and ones, but are divided into 4 bytes.


    These four bytes, called octets, are separated by dots (32-bit/4-byte dot notation,
    or dotted quad notation) and are recorded either as decimal or binary numbers.


    For example, 32 bits "in sequence" from the machine''s point of view looks like
    the following:


    ```

    11000000 10000001 00110010 00000001

    ```


    Readable IP representation in decimal format looks like the:


    ```

    192.129.50.1

    ```


    An IP address consists of the network prefix (the front part of the IP address)
    and a host number (the end part of the IP address).


    The network prefix helps to determine the network class in which the host is located.
    By means of the IP address, data is delivered to the required host in the destination
    network.'
  merge: -1
  pgno: 360
- img_proc: true
  md: '# SUSE Linux Enterprise Server 12 Fundamentals


    +   **IPv6.** The principle reason for changing the IP protocol is the limited
    address space, which could cause a shortage of addresses in the near future.


    Because of these demands and the problems with IPv4, the IETF (Internet Engineering
    Task Force) began working on a new version of IP in 1990: Internet Protocol Version
    6—IPv6 (IP Next Generation).


    The basic aims of the project are:


    +   - Support of billions of hosts, even if address space is used inefficiently

    - Reduction in size of Internet routing tables

    - Simplification of the protocol to allow packets to be processed by a router
    more quickly

    - Higher security (authentication and data security) than today''s IP

    - More emphasis on types of service, especially for real-time applications

    - Support for multicasting

    - Openness of the protocol for future developments


    For details on IPv6, [www.ipv6.org/](www.ipv6.org/).'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# Internet Control Message Protocol (ICMP)


    Internet Protocol (IP) was not designed for the purpose of ensuring faultless
    data transmission.


    In the event of a communication problem during the transmission of an IP datagram,
    the sender of the datagram receives a corresponding error report through ICMP.


    However, this error report can only be transmitted to the sender of the IP datagram
    if a gateway or the recipient of the IP datagram analyze the error that occurred.


    Because of this, ICMP (as defined in RFC 792) is a protocol that is usually used
    for transmitting error reports to the senders of IP datagrams.


    For example, an IP datagram should be sent to a specific destination network through
    a specific router. However, the router in question is not able to reach the destination,
    so destination unreachable message is sent.


    Or, if the router notices that the received packet can reach the destination quicker
    another path (another gateway), a redirect message is sent.


    The analysis tool ping also uses the ICMP protocol for transmitting control messages
    (echo request and echo reply).


    In turn, ICMP uses IP for transmitting the control messages, and packs the control
    messages into the data section of the IP header.


    ICMP places the type ID of the control message in the first octet of the data
    section in the IP header. The type IP classifies the control message and defines
    which and how much data is contained in the subsequent bytes of the datagram.'
  merge: -1
  pgno: 362
- img_proc: true
  md: '# SUSE Linux Enterprise Server Fundamentals


    ICMP uses the following message types:


    | Type | Name | Description |

    | --- | --- | --- |

    | 0 | Echo Reply | Answers the request (Type 8). |

    | 3 | Destination Unreachable | A destination (host/network/protocol/port) cannot
    be reached. |

    | 4 | Source Quench | The destination or a gateway currently is not able to process
    the IP datagrams (for example, due to overload). |

    | 5 | Redirect Message | A gateway informs the sender of an IP datagram about
    a shorter route to the destination. |

    | 8 | Echo Request | Sends a request for a response (Type 0: Echo Reply). |

    | 11 | Time Exceeded | The TTL (Time-To-Live) of an IP datagram has reached the
    value 0. The datagram was discarded. |

    | 12 | Parameter Problem | An IP datagram was discarded due to invalid parameters.
    |

    | 13 | Timestamp Request | Sends a request for a response, including the time
    in milliseconds since 0:00 UT. |

    | 14 | Timestamp Reply | Replies to the request (type 13) and sends its own time
    in milliseconds since 0:00 UT. |


    The following shows how an ICMP packet is constructed:


    # Figure B-16


    ![](img/428e877abd09b1c11149d179d3458f12_363_0.png)


