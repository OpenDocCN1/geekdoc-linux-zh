  md: '# Objective


    # Summary


    5. Ensure File System Security


    The permission settings in the file system have an important meaning to the overall
    system security.


    You should always follow some basic rules about file system security.


    +   A user should only have write access in the home and the /tmp directory.


    +   Users should never have read access to configuration files that contain passwords.


