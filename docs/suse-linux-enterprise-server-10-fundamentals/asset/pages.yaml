    +   - Shell variables control the behavior of the shell itself.


    The value of a variable can be seen with the command **echo**.


    Defining aliases lets you create shortcuts for commands and their options or to
    create commands with entirely different names.


    For each command specified, type will tell you whether it is a built-in shell
    command, a function, or an alias.


    Most of the aliases used on a system-wide basis are defined in the file /etc/bash.bashrc.


    Aliases are defined with the **alias** command and can be removed with the **unalias**
    command.


    To make an alias persistent, you need to store the definition in one of the shell''s
    configuration files. On the SUSE Linux Enterprise Server, the file **~/.alias**
    is created for personal aliases defined by each user.'
  merge: -1
