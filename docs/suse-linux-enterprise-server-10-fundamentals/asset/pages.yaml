  md: '# SUSE Linux Enterprise Server 10 Fundamentals


    Enter su - get root permissions. After entering the root password, start YaST
    by entering yast.


    Figure 3-3


    ![](img/428e877abd09b1c11149d179d3458f12_89_0.png)


    Press Tab to move from one box to another or to the text buttons. To go back to
    the previous box, press Shift+Tab. Use the arrow keys to navigate within the box.
    Mark highlighted menu items by pressing the Space.


    To select a menu item, press Enter. You can often press Alt and the highlighted
    letter to access an item directly.


    Except for the controls and the appearance, the graphical mode and the text mode
    of YaST are identical.


    You can list the available YaST modules with the command yast -l or yast --list.
    To start an individual module, specify its name. For example, you can enter the
    following to start the software installation module:


    ```

    yast sw-single

