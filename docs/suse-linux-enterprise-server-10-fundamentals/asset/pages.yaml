    | Option | Description |

    | --- | --- |

    | --ctime +/-]days | Searches for files whose last change took place no later
    than (no earlier than) a specified number of days ago. |

    | --gid number | Searches for files with the numeric GID (Group ID) number. |

    | --group name | Searches for files that are owned by the group name. Instead
