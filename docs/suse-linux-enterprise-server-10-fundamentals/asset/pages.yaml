- img_proc: true
  md: '# Use Piping and Redirection


    Linux has three standard data channels:


    Figure 6-1


    ![](img/428e877abd09b1c11149d179d3458f12_232_0.png)


    The following describes these channels:


    +   - **Standard input (stdin).** The currently running program reads the input
    from this channel (usually the keyboard).


    +   - **Standard output (stdout).** The program sends its output to this channel
    (usually the monitor).


    +   - **Standard error (stderr).** Errors are issued through this channel (usually
    the monitor).


    These input and output channels are assigned the following numbers:


    Table 6-2


    | Channel | Number Assigned |

    | --- | --- |

    | Standard input (stdin) | 0 |

    | Standard output (stdout) | 1 |

    | Standard error output (stderr) | 2 |'
  merge: -1
  pgno: 232
- img_proc: true
  md: 'Each channel can be redirected by the shell. For example, stdin can come from
    a file or stdout and stderr can be directed to a file. The following are the redirection
    characters:


    | Table 6-3 Redirection Character | Description |

    |---|---|n| < | Redirects standard input. |

    | > | Redirects standard output (> without a preceding number is just an abbreviation
    for 1>). |

    | 2> | Redirects standard error output. |


    > overwrites an existing file. If the output should be appended to an existing
    file, you have to use >> or 2>>.


    The following is an example of a standard input, standard output, and standard
    error output:


    ```

    geeko@da51:~ > ls /opt /recipe

    /bin/ls: /recipe: No such file or directory

    /opt:

    gnome kde3

    ```


    If the standard error output is redirected to /dev/null, only the standard output
    is displayed on the screen:


    ```

    geeko@da51:~ > ls /opt /recipe 2> /dev/null

    /opt:

    gnome kde3

    ```


    To redirect standard output and standard error output to a file (such as list),
    enter the following:


    ls /opt /recipe > list 2>&1'
  merge: -1
  pgno: 233
- img_proc: true
  md: 'First, the standard output is redirected to the file list (> list); then the
    standard error output is directed to the standard output (2>&1). The & refers
    to the file descriptor that follows (1 for standard output).


    You can display the contents of the file list by using the command cat, as in
    the following:


    ```

    geeko@da51:~ cat list

    /bin/ls: /recipe: No such file or directory

    /opt:

    gnome

    kde3

    ```


    This option of process communication is available not only in the shell, but can
    also be used in programs directly. All known files in the system can be used as
    input or output.


    Occasionally, you might want to use a file as input for a program that expect
    input from the keyboard. To do this, the standard input is redirected, as in the
    following:


    ```

    geeko@da51:~ # echo "Hello Tux"

    > how are you?

    > Is everything okay?" > greetings

    geeko@da51:~ # mail tux < greetings

    ```


    First, the text is redirected to the file greetings through the command. The mail
    program, mail, receives its input from the file greetings (not the keyboard),
    and then the email program sends the email to the user geeko.


    The output of one command can be used as the input for another command by using
    the pipe ("|):


    # command1 | command2'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# SUSE Linux Enterprise Server 10 Fundamentals


    In a pipe, a maximum of 4 KB of not yet processed data can exist. The process
    creating the output tries to write to a full pipe, it is stopped and only allowed
    to continue if the writing process can be completed. On the other side, the reading
    process is stopped if it tries to read an empty pipe.


    ```

    geeko@da51:-> ls -l /etc | less

    ```


    Occasionally the user might want output from a command displayed on the screen
    and written to a file. This can be done using the command tee:


    ls -l | tee output


    In this example, the output of the command is displayed on the screen as well
    as written to the file output.


    To redirect the output of several consecutive commands on the command line, the
    commands must be separated by semi-colons and enclosed in parentheses (command1;
    command2; ...):


    ```

    geeko@da51:-> ( id ; ls ) > output

    geeko@da51:-> cat output

    uid=1000 (geeko) gid=100 (users)

    groups=14 (uucp),16 (dialout), 33 (video),100 (users)

    bin

    Desktop

    Documents

    output

    public_html

    geeko@da51:-~>

    ```


    The shell starts a separate subshell for processing the individual commands. To
    redirect the linked commands, the shell must be forced to execute the command
    chain in the same subshell by enclosing the expression in parentheses.'
  merge: -1
  pgno: 235
- img_proc: true
  md: 'Upon completion, every program returns a value that states the success of the
    execution. If this return value is 0, the command completed successfully. If an
    error occurred, the return value is greater than 0. (Depending on the program,
    different return values indicate different errors.)


    You can use the command `echo $?` to display a return value.


    The return value can be used to trigger the execution of another command:


    | Table 6-4 Link | Result |

    |---|---|

    | command1 && command2 | command2 is only executed if command1 is completed without
    any errors. |

    | command1 || command2 | command2 is only executed if command1 is completed with
    an error. |


    ```

    geeko@da51:-> ls recipe || ls ~

    /bin/ls: recipe: No such file or directory

    bin Desktop Documents output public_html test

    geeko@da51:-> ls recipe && ls ~

    /bin/ls: recipe: No such file or directory

    geeko@da51:->

    ```


    The file recipe does not exist and the command `ls recipe` leads to an error.
    Because of this the command `~` in the first line is executed and in the fourth
    line not.'
  merge: -1
  pgno: 236
