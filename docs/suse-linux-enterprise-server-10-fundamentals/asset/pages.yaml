  md: '# SUSE Linux Enterprise Server 10 Fundamentals


    If you want to change data delivered by DHCP (e.g., IP number), select Modify.
    If you only want to change other information you can select Accept here.


    Figure 3-9


    ![](img/428e877abd09b1c11149d179d3458f12_99_0.png)


    This dialog lets you enter the following:


    +   - **Hostname.** Enter a name with which the computer can be addressed. This
    name should be unique within the network.


    +   - **Domain Name.** This is the name of the DNS domain to which the computer
    belongs. Domains help to divide networks. All computers in a defined organizational
    area normally belong to the same domain.


    A computer can be addressed uniquely by giving its FQDN (Fully Qualified Domain
    Name). This consists of the host name and the name of the domain, such as da51.digitalairlines.com.
    In this case, the domain would be digitalairlines.com.


    Copying all or part of this manual, or distributing such copies, is strictly prohibited.
    To report suspected copying, please call 1-800-PIRATES.


    3-14


    Version 1'
  merge: -1
