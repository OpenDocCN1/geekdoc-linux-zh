  md: '# Objective 2 Understand the Multiuser Environment


    One of the goals of UNIX was to enable a number of users to use the system simultaneously
    (multiuser capability).


    Because several users might also want to use several different programs simultaneously,
    mechanisms must be available to allow these programs to run simultaneously (multitasking
    capability).


    The implementation of a multiuser and multitasking system appears to be simultaneous
    in a single processor system, but this is only possible in a multiprocessor system.


    Even in a single-processor system, advantages can be gained through multitasking
    because waiting times for input or output from processes can be reduced for other
    processes.


    UNIX implements preemptive multitasking—each process is allowed a maximum time
    which it can work. When this time has expired, the operating system takes processor
    away from the process and assigns it to another process waiting to run.


    Other operating systems (such as versions older than the MAC version X) do not
    intervene in this process cycle. Instead, control over the processor must be released
    by the running process before another process can run.


    This can lead to one process hijacking the processor, leaving other processes
    without processing time and blocking the system.


    The operating system coordinates access to the resources available in the system
    (hard drives, tapes, interfaces). If there is competition among processes, e.g.,
    for access to a tape device, only one process can be granted access. The others
    must be rejected.'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'This coordination task is very complex and no operating system is able to implement
    an ideal solution. The classic problem involves a situation in which two or more
    processes exclusively need the same resources, as illustrated in the following
    resource conflict:


    # Figure 1-2


    ![](img/428e877abd09b1c11149d179d3458f12_30_0.png)


    The following describes the resource conflict:


    +   - Process A needs resources Res.1 and Res.2.

    - Process B needs resources Res.2 and Res.1.

    - Process A has received access to Res.1 and would now also like access to Res.2.
    In the meantime, however, B has already gained access to Res.2 and, in turn, would
    like access to Res.1 as well.


    If these two processes wait until they are available, nothing more will happen-they
    are deadlocked.


    Multithreading is an extension of multitasking, and helps solve this problem.
    In multithreading, a number parts independent from one another (threads) can be
    produced within a process. Multithreading increases the level of parallel processes
    with each thread needing to be administered, which makes the use of a multiprocessor
    system more valuable.'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'A clear distinction should be made here between programs and processes: as
    a rule, a program exists only once in the system, but there can be several processes
    that perform the same program.


    If a number of users are active, both PROGRAMS and processes can be used independently
    of one another (such as a program used to display directories).'
  merge: -1
