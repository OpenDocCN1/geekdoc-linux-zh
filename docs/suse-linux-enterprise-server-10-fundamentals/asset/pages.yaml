- img_proc: true
  md: '# Objective 2


    # Understand the Role of SuSEconfig


    You can consider YaST as a front end to various programs, such as a front end
    to RPM (RPM Package Manager) software management, a front end to user management,
    or a front end to various configuration files of different services (like a mail
    or web server).


    Sometimes YaST writes the configuration changes you make directly into the final
    configuration file. In other cases there is an additional intermediate step, where
    the information you enter is first written to a file in the directory /etc/sysconfig/
    before it is written into the final configuration file.


    This is where the program SuSEconfig becomes important.


    SuSEconfig is a tool used in SUSE Linux Enterprise Server to configure the system
    according to the variables that are set in the files in /etc/sysconfig/ and its
    subdirectories.


    These files contain variables such as SYSLOGD_PARAMS="" in /etc/sysconfig/syslog
    and SMTPD_LISTEN_REMOTE="no" in /etc/sysconfig/mail.


    Some of these variables are used directly (such as in start scripts). For example,
    if SYSLOGD_PARAMS is set to "-r," the daemon that logs system messages is directed
    on port 514 for system messages from other hosts.


    Other variables are used to modify other files. For example, if SMTPD_LISTEN_REMOTE
    is set to "yes," the variable INET_INTERFACES in /etc/postfix/main.cf is set to
    "all" by the script /sbin/SuSEconfig and the scripts in /sbin/conf.


    SuSEconfig acts as a back end for YaST and activates the configuration changes
    you make when using a YaST module.'
  merge: -1
  pgno: 92
- img_proc: true
  md: 'If you modify files in /etc/sysconfig/ using an editor, all you might need
    to do is restart a service for the change to take place. However, you might also
    need to run SuSEconfig.


    For this reason, we recommend running SuSEconfig after manually editing files
    in /etc/sysconfig/.


    SuSEconfig uses the subsystem specific scripts in /sbin/conf.d/ to configure the
    various subsystems. For example the variables in /etc/sysconfig/postfix are evaluated
    by the script /sbin/conf.d/SuSEconfig.postfix.'
  merge: -1
