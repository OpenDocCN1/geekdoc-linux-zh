  md: '# whereis


    The command whereis returns the binaries (option -b), manual pages (option -m),
    and the source code (option -s) of the specified command.


    If no option is used, all this information is returned, provided the information
    is available. This command is faster than find, but it is less thorough.


    The following is an example of using whereis:


    ```

    geeko@da51:~ > whereis grep

    grep :/bin/grep /usr/bin/grep

    /usr/share/man/man1/grep.gz

    /usr/share/man/man1p/grep.lp

    geeko@da51:~ > whereis -b grep

    grep :/bin/grep /usr/bin/grep

    geeko@da51:~ > whereis -m grep

    grep :/usr/share/man/man1/grep.gz

    /usr/share/man/man1p/grep.lp

    geeko@da51:~ > whereis -s grep

    grep:

    geeko@da51:~ >

    ```


    For more information about whereis, enter man whereis.


    # which


    The command which searches all paths listed in the variable PATH for the specified
    command and returns the full path of the command. In the variable PATH the most
    important directories are where the shell looks for executable files.


    To see the content of a variable use the command echo and add a “$” front of the
    variable’s name. To see the content of the variable PATH enter echo $PATH.


    ![](img/428e877abd09b1c11149d179d3458f12_196_0.png)'
  merge: -1
  pgno: 196
- img_proc: true
  md: 'The command which is especially useful if several versions of a command exist
    in different directories and you want to know which version is executed when entered
    without specifying a path.


    The following is an example of using the command which:


    ```

    geeko@da51:- > which find

    /usr/bin/find

    geeko@da51:- > which cp

    /bin/cp

    geeko@da51:- > which grep

    /usr/bin/grep

    geeko@da51:- >

    ```


    For more information on which, enter man which.


    # type


    The command type command can be used to find out what kind of command is executed
    when command is entered—a shell built in command (an essential command that is
    hardcoded in the shell), an external command (called by the shell), an alias,
    or a function. The option -a delivers all instances of a command bearing this
    name in the file system.


    The following is an example of using the command type:


    ```

    geeko@da51:- > type type

    type is a shell built in

    geeko@da51:- > type grep

    grep is /usr/bin/grep

    geeko@da51:- > type -a grep

    grep is /usr/bin/grep

    grep is /bin/grep

    geeko@da51:- >

    ```'
  merge: -1
