  md: '# locate


    The command locate is an alternative to find -name (the package findutils-locate
    must be installed). The command find must search through the selected part of
    the file system, a process that can be quite slow.


    On the other hand, locate searches through a database previously created for this
    purpose (/var/lib/locatedb), making it much faster.


    The database is automatically created and updated daily by SUSE Linux Enterprise
    Server. But changes made after the update has been performed are not taken into
    account by locate, unless the database is updated manually using the command updatedb.


    The following example shows the output of locate:


    ```

    geeko@da51:~ > locate letter_Miller

    /home/geeko/letters/letter_Miller

    ```'
