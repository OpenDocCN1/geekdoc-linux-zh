  md: '# Objective 1 Manage User and Group Accounts with YaST


    With YaST, you can manage users and groups. To do this, you need to understand
    the following:


    +   - Basics About Users and Groups

    - User and Group Administration with YaST


    # Basics About Users and Groups


    One of the main characteristics of a Linux operating system is its ability to
    handle several users at the same time (multier) and allow these users to perform
    several tasks on the same computer simultaneously (multitasking).


    For this reason the system must be able to uniquely identify all users. To achieve
    this, every user must log in with the following:


    +   - A username

    - A password


    Because the operating system can handle numbers much better than strings, users
    are handled internally as numbers. The number which a user receives a UID (User
    ID).


    Every Linux system has a privileged user, the user root. This user always has
    the UID 0. This is the administrator of the system.


    Users can be grouped together based on shared characteristics or activities. For
    example:


    +   - Normal users are usually in the group users.

    - All users who intend to create web pages can be placed in the group webedit.'
  merge: -1
  pgno: 255
- img_proc: true
  md: 'Of course, file permissions for the directory in which the web pages are located
    must be set so that the group weidit is able to write (save files).


    As with users, each group is also allocated a number internally called the GID
    (Group ID), and can be one of the following types:


    +   - Normal groups

    - Groups used by the system

    - The root group (GID = 0)


    # User and Group Administration with YaST


    You can access YaST user and group account administration in the following ways:


    +   - User administration. From the YaST Control Center, select Security and Users
    > User Management, or from a terminal window, enter yast2 users.

    - Group administration. From the YaST Control Center, select Security and Users
    > Group Management, or from a terminal window, enter yast2 groups.


    If you have selected LDAP for authentication during the installation of the SUSE
    Linux Enterprise Server, you are prompted for the LDAP server administrator password.


    You can switch back and forth between administering users and administering groups
    by selecting the Users and Groups radio buttons at the top of the module window.'
