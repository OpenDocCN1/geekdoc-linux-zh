    > Software Management.


    The installed packages and the packages that are available on the installation
    media are analyzed and dependencies between packages are checked.


    After this checking, the following dialog for searching packages appears:


    Figure 3-12


    ![](img/428e877abd09b1c11149d179d3458f12_106_0.png)


    To help you find the software you want to install, you can choose from different
    filters listed in the drop-down list in the top left corner of the window labeled
