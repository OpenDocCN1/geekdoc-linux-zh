  md: '# Learn the Working Modes


    In contrast to many other editors, vi is mode-oriented. When vi is first started,
    it is in command mode. Anything you enter in this mode is considered a command.
    You must switch to input mode before you can type any text. This can be frustrating
    to users who are unfamiliar with vi.


    In addition to switching modes, you must learn which keys perform which actions
    because you cannot use the mouse. However, the number of commands needed for everyday
    work is fairly small, and you can get them quickly.


    To enter text, you must first switch the editor to input mode by typing i (insert)
    or pressing the **Insert** key. At the bottom of the screen, you see the message
    --INSERT-.


    Press **Esc** to take you back to the command mode. From command mode you can
    switch to command-line mode by entering “”. The cursor jumps to the last line
    after “:” and waits for a command entry.


    A command will only be carried out in command-line mode after you press **Enter**.
    Then you are automatically back in command mode.


    The following is a summary of the available modes:


    +   **Command mode**: When vi starts, it is automatically in this mode. In command
    mode, vi can be given commands. The command **i** puts it into insert mode and
    the command **:** switches it to command-line mode.


    +   **Insert mode**: In this mode, we accepts all input as text. Return to command
    mode with **Esc**.


    +   **Command-line mode**: In this mode, vi accepts commands from the command
    line. Press **Enter** causes the command to be executed and automatically returns
    to the command mode.'
  merge: -1
  pgno: 249
- img_proc: true
  md: 'You can use the following commands in command mode:


    | Command | Result |

    | --- | --- |

    | i or Insert | Switches vi to insert mode. |

    | x or Delete | Deletes the character where the cursor is. |

    | dd | Deletes the line in which the cursor is located and copies it to the buffer.
    |

    | D | Deletes the rest of the current line from the cursor position. |

    | yy | Copies the line in which the cursor is located to the buffer. |

    | p, P | Inserts the contents of the buffer after/before current cursor position.
    |

    | zz | Saves the current file and ends vi. |

    | u | Undoes the last operation. |

    | /pattern | Searches forward from the cursor position for pattern. |

    | ?pattern | Searches backward from the cursor position for pattern. |

    | n | Repeats the search in the same direction. |

    | N | Repeats the search in the opposite direction. |


    If you want to use a command for several units, place the corresponding number
    in front of the command. For example, 3x deletes three characters, 5dd deletes
    five lines, and 7yy copies seven lines to the buffer.'
  merge: -1
