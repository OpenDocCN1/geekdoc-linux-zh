  md: '# Objective 1


    # Get to Know YaST


    YaST stands for Yet another Setup Tool. You can use YaST to complete many configuration
    tasks as a SUSE Linux Enterprise administrator.


    The YaST user interface can appear in two kinds:


    +   - ncurses. Text mode

    - QT. Fully graphical mode


    The appearance of the user interface depends on which command you use to start
    YaST and on whether you use the graphical system or the command line, as indicated
    in the following:


    | Command | Terminal in X Window | Command Line |

    |---|---|---|

    | yast2 | Qt | ncurses |

    | yast | ncurses | ncurses |


    # Table 3-1


    In the graphical interface, you can control YaST with the mouse. To start it,
    select YaST from the main menu (application group: System). You are asked to enter
    the root password.


