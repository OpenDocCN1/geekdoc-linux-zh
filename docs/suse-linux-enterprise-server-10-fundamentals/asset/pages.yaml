- img_proc: true
  md: 'It is generated dynamically when it is accessed (for example, with ls /proc).
    Each process has its own directory. The values in these directories can be read
    as if they were in a file. Some values can also be set by writing to the corresponding
    "files". Changes to the virtual file system only have an effect as long as the
    system is running.


    For example, the process init always has the process number "1". Information about
    it is therefore found in the directory /proc/1. The directory contains the following
    files:


    ```

