- img_proc: true
  md: '# Objective 3


    # Manage User and Group Accounts From the Command Line


    You can use commands to perform the same user and group management tasks available
    with YaST. In this objective you will learn:


    +   - Manage User Accounts From the Command Line

    - Manage Groups From the Command Line

    - Create Text Login Messages


    # Manage User Accounts From the Command Line


    The root user can use the following commands to perform the same user management
    tasks available with YaST (and some tasks available with YaST):


    +   - useradd. You can create a new user account with the useradd command. If
    no option is specified, the command useradd creates a user without a home directory
    and without a valid password.

    - -m. This option automatically generates the home directory for the user. Without
    further arguments, the directory is created under /home/.

    In addition, several files and directories are copied to this directory. The directory
    /etc/skel/ (from skeleton) is used as a template for the user home directory.

    - -c. When creating a new user, you can enter text for the comment field by using
    the option -c (comment).

    - -u. This option specifies the UID of the new account. If this option is not
    given, the next free UID is used (at maximum 60000).'
  merge: -1
  pgno: 280
- img_proc: true
  md: '-g. This defines the primary group of the user. You can specify either the
    GID or the name of the group.


    -p. This option lets you create a password for a new user. The following is an
    example:


    ```

    useradd -m -p "ghvkuzfFGW6cw" geeko

    ```


    ![](img/428e877abd09b1c11149d179d3458f12_281_0.png)


    The encrypted password must be given here, not the plain text password. The mkpasswd
    can be used to generate encrypted passwords. The program is located in the package
    whose.


    -e. The option -e (expire date) lets you set an expiration date for the user account,
    in the form of YYYY-MM-DD, as in the following:


    ```

    useradd -m -e 2002-03-21 geeko

    ```


    You can display a description of additional options by entering man 8 useradd.


    After adding a new user, you need to assign a password:


    ```

    da51:~ # useradd -m -c "Geeko Chameleon" geeko

    da51:~ # passwd geeko

    New password:

    Re-enter password:

    Retype new password:

    Password changed

    ```


    With the user it is created, and with passwd the password is assigned.


    When creating a user account, the necessary standard configuration information
    (effective group, location of the home directory, default shell, etc.) is derived
    from the files /etc/default/useradd and /etc/login.defs.'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# The following is an example of the file /etc/default/useradd:


    ```

    GROUP=100

    HOME=/home

    INACTIVE=-1

    EXPIRE=

    SHELL=/bin/bash

    SKEL=/etc/skel

    GROUPS=video,dialout

    CREATE_MAIL_SPOOL=no

    ```


    The variables mean:


    +   - GROUP. The primary group the user belongs to.

    - HOME. Path where the home directories are stored.

    - INACTIVE. Number of days of inactivity after a password has expired before the
    account is locked. (-1 disables this feature)

    - EXPIRE. Date (days since January 1st, 1970) when an account will expire.

    - SHELL. Path of the login shell.

    - SKEL. Path of the home directory skeleton.

    - GROUPS. Further groups the user belongs to.

    - CREATE_MAIL_SPOOL. Specifies whether a mail spool directory is created automatically.


    userdel. This command lets you delete an existing user account. It provides a
    simple option -r, which deletes the user''s home directory and the user''s account.


    Before using userdel -r, it is important that you determine the user''s UID (id
    user). The UID enables you to locate files outside the user''s home directory
    that are assigned to the user (such as /var/mail/$USER).


    To delete these files enter the command:


    ```

    find -uid user_ID -exec rm {} \;

    ```'
  merge: -1
  pgno: 282
- img_proc: true
  md: 'usermod. This command lets you modify settings (such as UID, standard shell,
    home directory, and primary group) for an existing user account.


    The usermod options are basically the same as those for the useradd command.


    The following are examples:


    +   Change the home directory:


    usermod -d /data/geeko -m geeko


    Change the UID:


    nusermod -u 1001 geeko


    passwd. You can change a user''s password with the command passwd. If a user enters
    passwd without a username as an argument, the user can change her own password.


    Besides being able to change a user password, the passwd command provides the
    following features:


    +   Locking a user account: With the option -l (lock), a user can be locked out,
    and with the option -u (unlock), he can be reactivated.


    ```

    $# grep geeko /etc/shadow

    geeko:$2A05$QUFf5tYH2BhvXmxZ31c9YejHgt7XefIFM58QHspu8WD

    FWx7BhPk:13284:0:99999:7:::

    $# passwd -

    Password:

    Password changed.

    $# grep geeko /etc/shadow

    geeko:$2A05$QUFf5tYH2BhvXmxZ31c9YejHgt7XefIFM58QHspu8WD

    FWx7BhPk:13284:0:99999:7::

    da51:-#

    ```


    An account is locked, when the password begins with an exclamation mark "!".'
  merge: -1
  pgno: 283
- img_proc: true
  md: 'Status of a user account: The option -S lists the status of a user account:


    ```

    da51::- # passwd -S geeko

    geeko 02/02/2006 0 99999 7 -1

    da51::- #

    ```


    The status follows directly after the username. In the above example, LK (locked)
    means that the user is unable to log in. Other options are NP (no password) or
    PS (password).


    These are followed by the date of the last password change, the minimum length
    of validity, the maximum length of validity, and the warning periods and inactivity
    periods when a password expires.


    Changing password times: You can change the various password times by using the
    following options:


    # Table 8-1


    | Option | Description |

    | --- | --- |

    | -i number | Disable an account after the password has been expired for number
    of days. |

    | -n number | Sets the minimum number of days before a password can be changed.
    |

    | -w number | Warns the user that in number of days his password will expire.
    |

    | -x number | Sets the maximum number of days a password remains valid. After
    number of days the password must be changed. |


    The following is an example:


    ```

    passwd -x 30 -w 5 geeko

    ```'
  merge: -1
  pgno: 284
- img_proc: true
  md: 'In this example, the password of the user geeko remains valid for 30 days.
    After this time, the password is required to be changed by geeko. Geeko receives
    a warning 5 days before password expiration.


    When the command password is used to establish or change the password of a user
    account, the file /etc/default/passwd is checked for the encryption method to
    use:


    ```

    # This file contains some information for

    # the passwd (1) command and other tools

    # creating or modifying passwords.


    Define crypt hash

    # CRYPT=(des,md5,blowfish)

    CRYPT=blowfish

    ```


    The default setting for the variable CRYPT is Blowfish. Other possible encryption
    methods include DES and MD5. YaST also uses the file /etc/default/passwd.


    # Manage Groups From the Command Line


    You can use the following commands to perform the same group management tasks
    available with YaST (and some tasks not available with YaST):


    You need to be logged in as root (or switch to root by entering su -) to use these
    commands.


    +   - groupadd. You can create a new group by entering groupadd_group_name. In
    this case, the next free GID is used.


    Using the option -g as groupadd -g 200 sports lets you specify a GID.'
  merge: -1
  pgno: 285
- img_proc: true
  md: "Using the option -p lets you specify an encrypted password.\nYou can use the\
    \ command mkpasswd to create the encrypted password.\n\n+   - groupdel. You can\
    \ delete a group by entering groupdel group_name. There are no options for this\
    \ command.\n\nYou can only delete a group if no user has this group assigned as\
    \ a primary group.\n\n+   - groupmod. You can modify the settings (such as GID,\
    \ group name, and users) for an existing group.\n\nThe following are examples:\n\
    \n+   - Change the GID:\n  groupmod -g 201 sports\n- Change the group name from\
    \ sports to water:\n  groupmod -n water sports\n- Add the user geeko to the group:\n\
    \  groupmod -A gecko water\n\n+   - gpasswd. Change passwords for group accounts.\
    \ Only the administrator may change the password for any group. With option -r\
    \ the group password can be removed.\n\n![](img/428e877abd09b1c11149d179d3458f12_286_0.png)\n\
    \nYou can learn more about these commands by referring to the online manual pages\
    \ (such as man groupadd) or online help page (such as groupadd --help)."
  merge: -1
