  md: '# Objective


    # Summary


    +   2. Understand the Multiuser Environment


    Linux is a multitasking system; in other words, the processes seem to be executed
    concurrently.


    An important task of the operating system is to coordinate access to the resources
    available in the system.


    Multithreading is an extension of multitasking. Here, within a process, a number
    of parts independent from one another (threads) can be produced.


    A program exists only once in the system, but there can be several processes using
    the same program at the same time.


    +   3. Perform a Simple Installation of SUSE Linux Enterprise Server 10


    The process of installing the SUSE Linux Enterprise Server 10 can be divided into
    the following steps:


    +   * Choose the installation option

    * Basic installation

    * Configuration


    The most important installation options are


    +   * Installation

    * Installation - ACPI Disabled

    * Installation - Safe Settings'
