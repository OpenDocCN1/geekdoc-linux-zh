- img_proc: true
  md: 'The command newgrp command allows to change the effective group of executing
    the user.


    ```

    geeko@da51:-> id

    uid=1000 (geeko) gid=100 (users)

    groups=16 (dialout), 33 (video),100 (users)

    geeko@da51:-> newgrp video

    geeko@da51:-> id

    uid=1000 (geeko) gid=33 (video)

    groups=16 (dialout), 33 (video),100 (users)

    geeko@da51:-> exit

    geeko@da51:-> id

    uid=1000 (geeko) gid=100 (users)

    groups=16 (dialout), 33 (video),100 (users)

    geeko@da51:->

    ```


    In this example you can see that the current shell is replaced with a new shell.


    A password is requested if the group has a password and the user is not listed
    in the group file as being a member of that group.


    # Create Text Login Messages


    You can create login messages that are useful for displaying information when
    a user logs in from a terminal window, or remotely (such as an ssh login).


    You can modify the following files to provide these messages:


    +   /etc/issue. Edit this file to configure an initial message for users logging
    into the system.'
  merge: -1
  pgno: 287
