    # View a File with head and tail


    With the command head, you can view only the first few lines of a file. The command
    tail shows you only the last lines of a file.


    By default, these commands only show ten lines. To change these number, append
    the option -number.


    When used with the tail command, the option -f displays a continuously updated
    view of the last lines of a file. If a line is added to the end of the file while
    tail -f is running, the line is displayed. This is a very useful feature for observing
    log files. To exit tail -f press Ctrl+C.'
