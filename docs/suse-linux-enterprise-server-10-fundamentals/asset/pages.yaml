- img_proc: true
  md: '# Objective 1 Understand the File System Hierarchy Standard (FHS)


    The file system concept of Linux (and, in general, of all UNIX systems) is considerably
    different than that of other operating systems.


    A filename in Linux can be up to 255 characters long. It can contain any number
    of special characters ("" or %%, for example).


    Certain special characters (the dollar sign $, the semicolon \;\, or the space,
    for example) have a specific meaning. If you want to use one of these characters
    without the associated special meaning, the character must be preceded by a \"
    (backslash) to mask (switch off) its special meaning.


    You can also umlauts, letters with diacritical marks, or other country-specific
    characters. If you exported data with in other countries using other settings,
    you could get problems, because these characters were not present on their keyboards.


    Linus differentiates between upper-case and lower-case letters. For example, Invoice,
    invoice, and INVOICE identify three different files.


    To understand the concept of the Linux file system, you need to know the following:


    +   * The Hierarchical Structure of the File System

    * FHS (Filesystem Hierarchy Standard)

    * Root Directory /

    * Essential Binaries for Use by All Users (/bin)

    * Boot Directory (/boot)

    * Other Partitions (/data)'
  merge: -1
  pgno: 139
- img_proc: true
  md: '+   * Device Files

    * Configuration Files (/etc)

    * User Directories (/home)

    * Libraries (/lib)

    * Mountpoints for Removable Media (/media/*)

    * Application Directory (/opt)

    * Home Directory of the Administrator (/root)

    * System Binaries (/sbin)

    * Data Directories for Services (/srv)

    * Subdomain AppArmor (/subdomain)

    * Temporary Area (/tmp)

    * The Hierarchy below /usr

    * Variable Files (/var)

    * Windows Partitions (/windows)

    * Process Files (/proc)

    * System Information Directory (/sys)

    * Mountpoint for Temporarily Mounted File Systems (/mnt)

    * Directories for Mounting Other File Systems'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# The Hierarchical Structure of the File System


    The file system concept of Linux involves a hierarchical file system that can
    be depicted in the form of a tree.


    This tree is not limited to a local partition. It can stretch over partitions,
    which can be located on different computers in a network. It begins at the root,
    from where the name for the system administrator comes, and branches out call
    the branches of a tree.


    The following is an extract from a typical file system tree:


    Figure 5-1


    ![](img/428e877abd09b1c11149d179d3458f12_141_0.png)


    A file in this directory tree is uniquely defined by its path. A path refers to
    the directory names which lead to this file.


    The separation character between individual directory names is the slash ("/").
    The path can be specified in two ways:


    +   - As a relative path starting from the current directory


    +   - As an absolute path starting from the root of the entire system tree.'
  merge: -1
  pgno: 141
- img_proc: true
  md: 'The absolute path always begins with a slash ("/"), the symbol for the root
    directory.


    # Figure 5-2


    ![](img/428e877abd09b1c11149d179d3458f12_142_0.png)


    In this figure the current position in the file system is geeko''s home directory.
    To change into the /etc directory, you can use the following commands:


    +   - absolute: cd /etc

    - relative: cd ../../etc


    > cd is the command to change the current working directory. It will be explained
    later in detail.


    Sometimes it is necessary to specify the absolute path because certain files can
    only be uniquely addressed in this way. The length of the path cannot exceed 4096
    characters, including the slashes.'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# FHS (Filesystem Hierarchy Standard)


    The structure of the file system is described in the Filesystem Hierarchy Standard
    (FHS). Here, it is specified which directories must be located on the first level
    after the root directory and what they contain.


    The FHS does not specify all details. In some areas it allows leeway for your
    own definitions. The FHS defines a two-layered hierarchy:


    +   - The directories in the top layer (immediately below the root directory “/”).

    - As a second layer, the directories /usr and /var.


    You can find information about FHS at http://www.pathname.com/fhs/ on the Internet.


    # Root Directory /


    The root directory refers to the highest layer of the file system tree. Normally
    only directories (not files) are located here. When the system is booted, the
    partition on which this directory is located is the first one mounted.


    Because the kernel cannot fulfill all the tasks of the operating system, all programs
    that are run at system start must be available on this partition (they cannot
    be located on another partition).


    The following directories always have to be on the same partition as the root
    directory: /bin, /dev, /etc, /lib, and /sbin.'
  merge: -1
  pgno: 143
- img_proc: true
  md: '# Essential Binaries for Use by All Users (/bin)


    The directory /bin contains important executable programs that are required when
    no other file systems are mounted, such as all programs necessary for the system
    start.


    These include the various shells, the most important commands for working with
    files, and several commands for system analysis and configuration.


    The following table provides an overview of the contents of the /bin directory:


    | File | Description |

    | --- | --- |

    | /bin/bash | The bash shell |

    | /bin/cat | Displaying files |

    | /bin/cp | Copying files |

    | /bin/dd | Copying files byte-wise |

    | /bin/gzip | Compressing files |

    | /bin/mount | Mounting file systems |

    | /bin/rm | Deleting files |

    | /bin/vi | vi editor |'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# Boot Directory (/boot)


    The directory /boot contains static files of the boot loader GRUB (Grand Unified
    Bootloader). These are files required for the boot process (with the exception
    of configuration files).


    The backed-up information for the Master Boot Record (MBR) and the system map
    files are also stored here. These contain information about exactly where the
    kernel is located on the partition. In addition, this directory contains the kernel
    which has the name vmlinuz.


    According to the FHS, however, the kernel can also be located in the root directory.


    # Other Partitions (/data)


    If YaST finds other (non-Windows) partitions or another hard disk during the installation
    it creates mount points for each partition labeled:


    +   - /data1

    - /data2

    - ...

    - /dataX


    # Device Files (/dev)


    Each hardware component existing in the system (such as hard drives, CD drives,
    printer, and mouse) is represented as a file in the directory /dev.


    The hardware components are addressed via these files by writing to or reading
    from one of these files. Two kinds of device files are included:'
  merge: -1
  pgno: 145
- img_proc: true
  md: '+   - Character-oriented device files (for devices working sequentially, such
    as printer, mouse, or tape drive)

    - Block-oriented device files (such as floppy disks and hard drives).


    The connection to device drivers in the kernel is implemented via numbered channels,
    which correspond to the number of the device driver in question. These are referred
    to as `major device numbers`.


    A driver might be responsible for several devices of the same type. To distinguish
    between these devices, the minor device number is used.


    Instead of the size of the files, these two numbers are not occupy any space on
    the hard drive anyway:


    ```

    da51:- # ls -l /dev/hda*

    brw-rw-- 1 root disk 3, 0 Mar 22 06:12 /dev/hda

    br-rw-- 1 root disk 3, 1 Mar 22 06:12 /dev/hdl

    ```


    In this example, the major device number 3 is listed for all files. This refers
    to the driver for IDE hard drives. The minor device numbers run from 1 to 15 (for
    SCSI hard drives) and up to 63 (for IDE hard drives) and refer to the various
    possible partitions.


    Many device files are already available by default. Some of them, however are
    never needed. If special device files are required for specific devices, these
    can be generated with the command `mknod`. The necessary parameters must be provided
    by the hardware manufacturer.


    The null device /dev/null is also located in this directory. Program output that
    would normally be sent to the screen can be redirected to this device (for example,
    using redirects). The redirected data will be deleted.'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'The following are some important device files:


    | Table 5-2 | Device | Device File | Description |

    |--- | --- | --- | --- |

    | | Terminals | /dev/console | The system console |

    | | | /dev/tty1 | The first virtual console, reachable with Ctrl+Alt+F1. |

    | | Serial ports | /dev/ttyS0 /dev/ttyS* | The first serial port. |

    | | Parallel ports | /dev/lp0 /dev/lp* | The first parallel port. |

    | | Floppy disk drives | /dev/fd0 /dev/fd* | The first floppy disk drive. If the
    drives are addressed via the device files fd0 and fd1, the kernel tries to recognize
    the floppy disk format itself |

    | | IDE hard drives | /dev/hda | The first IDE hard drive on the first IDE controller
    |

    | | | /dev/hdc | The first IDE hard drive on the second IDE controller |

    | | | /dev/hd* | To label the partitions, the device names are given numbers.
    1 to 4 refer to the primary partitions, higher numbers to logical partitions.
    Example: /dev/hda1 is the first primary partition on the first IDE hard drive.
    |'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# Table 5-2 Device File Description


    | Device | Device File | Description |

    | --- | --- | --- |

    | IDE CD-ROM drives | /dev/hd* | The drives are named in the same as the IDE hard
    drives. This means that the CD-ROM drive /dev/hdd is the second drive on the second
    IDE controller. |

    | SCSI hard drives | /dev/sda /dev/sda* | The first SCSI hard drive With SCSI
    hard drives, the device names are given numbers to label various partitions. For
    example, /dev/sda1 is the first partition on the first SCSI hard drive. |

    | SCSI CD-ROM drives | /dev/scd0 /dev/scd* | The first SCSI CD-ROM drive. |


    # Configuration Files (/etc)


    This directory and its subdirectories contain system configuration files. Almost
    all these files are ASCII files, which can be processed with any editor.


    Normal users can read nearly all of these files, but they cannot edit any of them.
    According to the FHS, no executable programs can be located here.'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'However, the subdirectories contain many shell scripts. Some important configuration
    files are listed in the following table:


    # ### Table 5-3


    | File | Description |

    |---|---|n| /etc/SuSE-release | Version number of the installed SUSE Linux Enterprise
    Server |

    | /etc/instab | Configuration file for the init process |

    | /etc/init.d/* | Scripts for starting services |

    | /etc/modprobe.conf | Configuration file of the kernel modules |

    | /etc/DIR_COLORS | Specifies the colors for Is |

    | /etc/X11/X86Config | Configuration file of the X Window System |

    | /etc/fstab | Table of the file systems automatically mounted at the system start
    |

    | /etc/profile | Login script of the shell |

    | /etc/passwd | User database; all information except passwords |

    | /etc/shadow | Encrypted passwords of users |

    | /etc/group | Database of user groups |

    | /etc/cups/* | Files for the CUPS printing system |

    | /etc/hosts | Allocation of computer names to IP addresses |

    | /etc/motd | Welcome message after a user logs in (message of the day) |

    | /etc/issue | Linux welcome message before the login prompt |

    | /etc/sysconfig/* | Central configuration files of the system |


    Nearly every installed service has at least one configuration file in the directory
    /etc or a subdirectory.'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# User Directories (/home)


    Every user on a Linux system has his own area in which to work with files. This
    area is called the home directory of the user. When user logs in, he is in his
    own home directory.


    Individual configuration files can be found in the user''s home directory. These
    configuration files are hidden files, because they are normally not displayed
    by the command ls. All these files names that begin with a dot.


    The following are the most important files in a user''s home directory:


    | Table 5-4 | File | Description |

    |---|---|---|

    | .profile | Private login script of the user |

    | .bashrc | Configuration file for bash |

    | .bash_history | List of commands previously run in bash |


    In many cases, the directory /home is located on a different partition or can
    even be located on a different computer (with central administration of home directories).'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# Libraries (/lib)


    Many programs use specific functions that are also used by other programs. Such
    standard functions are removed from the actual program, stored in the system,
    and only called up when the program runs. They are called shared libraries.


    The directory /lib contains the libraries that are used by programs in the directories
    /bin and /sbin. The kernel modules (hardware drivers not compiled into the kernel)
    are located in the directory /lib/modules/. usr.


    # Mountpoints for Removable Media (/media/*)


    SUSE Linux creates directories in the directory /media/ for mounting removable
    media when detecting a media:


    +   * /media/floppy/. Created for a floppy disk drive.

    * /media/cdrom/. Created for a CD-Rom drive.

    * /media/cdrecorder. Created for a CD burner.

    * /media/dvd/. Created for a DVD drive.

    * /media/usbdisk. Created for a USB stick.

    * /media/media_name. Created after inserting a labeled media.


    # Application Directory (/opt)


    Installed programs store their static files in the directory /opt. First, a directory
    with the name of the application is created. The files are then stored in that
    directory. Examples include GNOME (/opt/gnome) and KDE (/opt/kde3).'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Home Directory of the Administrator (/root)


    The home directory of the system administrator is not located beneath /home like
    that of a normal user. Preferably, it should be on the same partition as the root
    directory, "/". Only then is it guaranteed that the user root can log in without
    a problem and have her own configured environment available.


    # System Binaries (/sbin)


    The directory /sbin contains important programs for system administration. Programs
    that are run by normal users are located in /bin. Programs in the directory /sbin
    can also, as a rule, be run by normal users, but only to display the configured
    values. Changes to the configuration can only be made by the user root.


    The following is an overview of important files in the directory /sbin:


    | File | Description |

    | /sbin/SuSEconfig | Starts the SuSEconfig modules in the directory /sbin/conf.d/
    |

    | /sbin/conf.d/* | Contains the scripts from the SuSEconfig family that are called
    up by /sbin/SuSEconfig. <br> They are used to configure the overall system, evaluate
    entries in the configuration files in the directory /etc/sysconfig/, and write
    further configuration files |

    | /sbin/yast | Administration tool for SUSE Linux Enterprise Server |

    | /sbin/fdisk | Modifies partitions |

    | /sbin/fsck* | Checks file systems (file system check) |

    | /sbin/init | Initializes the system. |'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# Table 5-5 File Description


    | File | Description |

    | /sbin/mkfs* | Creates a file system (formatting). |

    | /sbin/shutdown | Shuts down the system. |


    # Data Directories for Services (/srv)


    The directory /srv contains subdirectories designed for containing data of various
    services. For example, the files of the Apache web server are located in the directory
    /srv/www/ and the FTP server files are located in the directory /srv/ftp/.


    # Subdomain AppArmor (/subdomain)


    Novell AppArmor is an effective and easy-to-use Linux application security system
    that protects your Linux operating system and applications from the effects of
    attacks, viruses and malicious applications. AppArmor is not a firewall or a virus-detection
    application; it is a complete intrusion-prevention system.


    AppArmor (formerly called Subdomain) is a kernel enhancement to confine programs
    to a limited set of resources. AppArmor''s unique security model is to bind access
    control attributes to programs rather than to users.


    # Temporary Area (/tmp)


    Various programs create temporary files that are stored in /tmp/ until they are
    deleted.'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# The Hierarchy below /usr


    The directory /usr, in accordance with the FHS, represents a second hierarchical
    layer.


    /usr means Unix Specific Resources or Unix System Resources.


    This is the location for all application programs, graphical interface files,
    additional libraries, locally installed programs, and commonly shared directories
    containing documentation.


    These include the following:


    | Directory | Description |

    |---|---|

    | /usr/X11R6/ | Files of the X Window System |

    | /usr/bin/ | Almost all executable programs |

    | /usr/lib/ | Libraries |

    | /usr/local/ | Locally installed programs, now frequently found in the directory
    /opt/ |

    | /usr/sbin/ | Programs for system administration |

    | /usr/share/doc/ | Documentation |

    | /usr/share/man/ | The manual pages (command descriptions) |

    | /usr/src/ | Source files of all programs and the kernel (if installed) |'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# Variable Files (/var)


    This directory and its subdirectories contain files that can be modified while
    the system is running.


    The following table provides an overview of the most important directories beneath
    /var:


    Table 5-7

    | Directory | Description |

    |---|---|

    | /var/lib/ | Variable libraries (such as databases for the commands locate and
    rpm) |

    | /var/log/ | Log files for most services |

    | /var/run/ | Files with information on running processes |

    | /var/spool/ | Directory for queues (printers, email) |

    | /var/lock/ | Lock files to protect devices from multiple use |


    # Windows Partitions (/windows)


    If YaST finds any partitions with a Microsoft file system it creates a directory
    /windows automatically. Inside this directory are subdirectories labeled with
    Windows drive characters (e.g., C, D).


    # Process Files (/proc)


    Linux handles process information that is made available to users via the directory
    /proc. This directory does not contain any real files and therefore does not occupy
    any space on the hard disk.'
