- img_proc: true
  md: '# SUSE Linux Enterprise Server 12 Fundamentals


    +   - **Patterns.** Displays all software that is available on the known installation
    media. It is grouped in predefined sets of packages that logically belong together.

    - **Package Groups.** Displays all software that is available on the known installation
    media. It is grouped by category.

    - **Languages.** Displays all language related files (e.g., spell checker, help)

    - **Installation Sources.** Lists all registered installation sources and displays
    the available packages of this source.

    - **Search.** Lets you enter a search term and where you want YaST to search for
    the software package.

    - **Installation Summary.** Displays all the packages with a marked status.


    To find a package, select the Search filter, enter the package name or parts of
