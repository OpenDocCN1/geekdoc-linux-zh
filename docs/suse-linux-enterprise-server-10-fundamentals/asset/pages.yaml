  md: '# Introduction


    In the SUSE Linux Enterprise Server 10 Fundamentals (3071) course, you learn the
    basic Linux skills necessary to prepare you for performing SUSE Linux Enterprise
    Server 10 administrative tasks.


    These skills, along with those taught in the SUSE Linux Enterprise Server 10 Administration
    (3072) and SUSE Linux Enterprise Server 10 Advanced Administration (3073) courses,
    prepare you to take the Novell Certified Linux Professional 10 (Novell CLP 10)
    certification practicum.


    The contents of your student kit include the following:


    +   - SUSE Linux Enterprise Server 10 Fundamentals Manual

    - SUSE Linux Enterprise Server 10 Fundamentals Workbook

    - SUSE Linux Enterprise Server 10 Course DVD

    - SUSE Linux Enterprise Server 10 Product DVD

    - SUSE Linux Enterprise Desktop 10 Product DVD


    The SUSE Linux Enterprise Server 10 Course DVD contains a VMware SUSE Linux Enterprise
    Workstation 10 server (in the directory vmware) that you can use with the SUSE
    Linux Enterprise Server 10 Fundamentals Workbook outside the classroom to practice
    the skills you need to prepare for the 3071 course.


    > Instructions for setting up a self-study environment are in the setup directory
    on the Course DVD.


    ![](img/428e877abd09b1c11149d179d3458f12_12_0.png)'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Course Objectives


    This course teaches you the following concepts and skills fundamental to understanding
    SUSE Linux Enterprise Server 10:


    +   - Understand the Linux story

    - Use the Linux desktop

    - Manage the network configuration

    - Manage software packages

    - Locate and use help resources

    - Manage directories and files

    - Work with the command line

    - Use Linux text editors

    - Manage user, groups and permissions


    These are fundamental and prerequisite to learning the skills of an entry level
    SUSE Linux administrator or help desk technician in an enterprise environment.


    # Audience


    While the primary audience for this course are administrators who are interested
    in Linux, certification candidates with experience in other operating systems
    can also use this course to begin preparing for the Novell CLP 10 Practicum.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Certification and Prerequisites


    This course helps you prepare for the Novell Certified Linux Professional 10 (Novell
    CLP 10) Practical Test, called a practicum. The Novell CLP 10 is the administrator-level
    certification for SUSE Linux Enterprise Server 10.


    As with all Novell certifications, course work is recommended. To achieve the
    certification, you are required to pass the Novell CLP 10 Practicum (050-697).


    The Novell CLP 10 Practicum is a hands-on, scenario-based exam where you apply
    the knowledge you have learned to solve real-life problems—demonstrating that
    you know what to do and how to do it.


    The practicum tests you on objectives in this course (SUSE Enterprise Server Fundamentals
    - Course 3071) and the skills outlined in the following Novell CLP 10 courses:


    +   - SUSE Linux Enterprise Server 10 Administration - Course 3072

    - SUSE Linux Enterprise Server 10 Advanced Administration - Course 3073'
  merge: -1
  pgno: 14
