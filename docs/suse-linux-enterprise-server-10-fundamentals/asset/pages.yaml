    # find


    To search for files on the command line, you can use the command

    **find**. The following is the syntax for the command **find**:


    ```

    **find** \`**path** \`**criterion**** \`**action**\`

    ```


    The command has a multitude of options, a few of which are

    explained here. You can use the following arguments with the

    command:


    +   - **path**. The section of the file system to search (the specified

    directory and all its subdirectories). If nothing is specified, the

    file system below the current directory is used.'
