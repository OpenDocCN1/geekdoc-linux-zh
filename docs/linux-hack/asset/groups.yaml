    # 技巧 5：使用 dirs, pushhd 和 popd 来操作目录栈


    你可以使用目录栈将目录推入栈中，稍后从栈中弹出。本示例中使用了以下三个命令。


    # Linux 技巧


    - dirs: 显示目录栈

    - pushd: 将目录推入栈中

    - popd: 从栈中弹出目录并进入该目录


    Ajay Kumar Tiwari


    Dirs 总是会打印当前目录，然后是栈的内容。即使目录栈为空，dirs 命令仍然只会打印当前目录，如下所示。


    ```bash

    # popd

    -bash: popd: directory stack empty

    ~


    # pwd

    /home/ramesh

    ```


    如何使用 pushd 和 popd？让我们先创建一些临时目录并将它们推入目录栈，如下所示。


    ```bash

    # mkdir

    mkdir

    mkdir

    mkdir

    /tmp/dir1

    /tmp/dir2

    /tmp/dir3

    /tmp/dir4

    # cd /tmp/dir1

    # pushd .

    # cd /tmp/dir2

    # pushd .

    # cd /tmp/dir3

    # pushd .

    # cd /tmp/dir4

    # pushd .

    ```


    # Linux 技巧


    Ajay Kumar Tiwari


    ```bash

    # dirs

    /tmp/dir4 /tmp/dir4 /tmp/dir3 /tmp/dir2 /tmp/dir1

    ```


    > [注意：dirs 命令的第一个目录 (/tmp/dir4) 始终是当前目录，而不是栈的内容。]


    在此阶段，目录栈包含以下内容：

    - /tmp/dir4

    - /tmp/dir3

    - /tmp/dir2

    - /tmp/dir1


    最后推入栈的目录将位于顶部。当你执行 popd 时，它将进入栈顶部的目录并将其从栈中移除。如所示，最后推入栈的目录是 /tmp/dir4。因此，当我们执行
    popd 时，它会进入 /tmp/dir4 并将其从目录栈中移除。


    ```bash

    # popd

    # pwd

    /tmp/dir4

    ```


    > [注意：执行 popd 后，目录栈包含：

    - /tmp/dir3

    - /tmp/dir2

    - /tmp/dir1


    ```bash

    # popd

    #pwd

    /tmp/dir3

    ```


    > [注意：执行 popd 后，目录栈包含：

    - /tmp/dir2

    - /tmp/dir1


    ```bash

    # popd

    #pwd

    /tmp/dir2

    ```


    > [注意：执行 popd 后，目录栈包含：

    - /tmp/dir1


    ```bash

    # popd

    #pwd

    /tmp/dir1

    ```


    > [注意：执行 popd 后，目录栈为空！]


