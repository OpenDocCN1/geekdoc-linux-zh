    280929      deflated  95%     12-30 10:55  \n```\n\n# How to list a content of\
    \ zip file with uncompressing it?\n\n```\n# unzip -l var-log.zip\nArchive: var-log.zip\n\
    Length      DateTime                Name\n----------------------------------------------------\n\
    1916        02-08 14:27  var/log/acpid\n13546       02-08 14:28  var/log/anaconda.log\n\
    40981       02-08 14:28  var/log/anaconda.syslog\n40981       02-07 14:56  var/log/anaconda.xlog\n\
    41406991    02-07 14:25  var/log/X.0.log\n```\n\n# Hack 45. Advanced compression\
    \ using zip command.\n\nThere are 10 levels of compression provided by zip command.\n\
    Level 0 is the lowest level, where it archives the file without any compression.\n\
    Level 1 will perform little compression. But, will be very fast.\nLevel 6 is the\
    \ default level of compression.\nLevel 9 is the maximum compression. This will\
    \ be slower when compared to default level. In my opinion, unless you are compressing\
    \ a huge file, you should always use level 9.\n\nIn the example below, I used\
    \ Level 0, default Level 6, and Level 9 compression on a same directory. See the\
    \ compressed file size yourself.\n\n```bash\n# zip var-log-files-default.zip /var/log/*\n\
    # zip -0 var-log-files-0.zip /var/log/*\n# zip -9 var-log-files-9.zip /var/log/*\n\
