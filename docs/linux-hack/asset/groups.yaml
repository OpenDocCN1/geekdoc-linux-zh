- md: "\n# Linux Hack\n\nAlgorithms server to client:\nCipher: aes128-cbc\nMAC: hmac-sha1\n\
    Compression: zlib\nlocalhost$\nAjay Kumar Tiwari\n\n# Additional SSH Info\n\n\
    On a side note, to setup SSH key based authentication, refer openSSH and SSH2\
    \ tutorials.\n\n# Linux Hack\n\nAjay Kumar Tiwari\n\n## Chapter 4: Essential Linux\
    \ Commands\n\n## Hack 17. Grep Command\n\ngrep command is used to search files\
    \ for a specific text. This is incredibly powerful.\n\nSyntax: grep [options]\
    \ pattern [files]\n\n### How can I find all lines matching a specific keyword\
    \ on a file?\n\nIn this example, grep looks for the text John inside /etc/passwd\
    \ file and displays the matching lines.\n\n```\n# grep /etc/passwd\nsmith:x:1082:1082:John\
    \ Smith:/home/jsmith:/bin/bash\ndjoe:x:1083:1083:John Doe:/home/joe:/bin/bash\n\
    ```\n\nOption -v, will display all the lines from /etc/password that doesn't match\
    \ John. In the example below, it displays all the records from /etc/password that\
    \ doesn't contain the word John. Note: There are several lines in the /etc/password\
    \ that doesn't contain the \n\n```\n# grep -v John /etc/passwd\njbourne:x:1084:1084:Jason\
    \ Bourne:/home/jbourne:/bin/bash\n```\n\n### How many lines matched the text pattern\
    \ in a particular file?\n\nIn the example below, it displays the total number\
    \ of lines that contains the text John in /etc/passwd file.\n\n```\n# grep -c\
    \ John /etc/passwd\n```\n\nYou can also get the total number of lines that did\
    \ not match the specific pattern pattern by passing option -cv.\n\n```\n# grep\
    \ -cv John /etc/passwd\n```\n\n### How to search for a text by ignoring the case?\n\
    \nPass the option -i (ignore case), which will ignore the case while searching.\n\
    \n```\n# grep -i john /etc/passwd\n```\n\n```\njsmith:x:1082:1082:John Smith:/home/jsmith:/bin/bash\n\
    jdoe:x:1083:1083:John Doe:/home/jdoe:/bin/bash\n```\n\n### How do I search all\
    \ subdirectories for a text matching a specific pattern?\n\nUse the option -r\
    \ (recursive) for this purpose. In the example below, it will search for the text\
    \ \"John\" by ignoring the case inside all the subdirectories under /home/users.\
    \ This will display the output in the format of :filename: line that matching\
    \ the pattern. You can also pass the option -l, which will display only the name\
    \ of the file that matches the pattern.\n\n```\n# grep -ri john /home/users\n\
    ```\n\n```\n/home/users/subdir1/letter.txt:John, Thanks for your contribution.\n\
    /home/users/name_list.txt:John Smith\n```\n\n/home/users/name_list.txt:John Doe\n\
    ```\n# grep -ril john /root\n/home/users/subdir1/letter.txt\n/home/users/name_list.txt\n\
    ```\n\n## Hack 18. Find Command\n\nfind is frequently used command to find files\
    \ in the UNIX filesystem based on numerous conditions. Let us review some practice\
    \ examples of find command.\n\nSyntax: find [pathnames] [conditions]\n\n### How\
    \ to find files containing a specific word in name?\n\nThe following command looks\
    \ for all the files under /etc directory with mail\n\n```\n# find /etc -name \"\
    mail*\"\n```\n\n### How to find all the files greater than certain size?\n\nThe\
    \ following command will list all the files in the system greater than 100MB.\n\
    \n```\n# find / -type f -size +100M\n```\n\n### How to find files that are not\
    \ modified in the last x number of days?\n\nThe following command will list all\
    \ the files that were modified more than 60 days ago under the current directory.\n\
    \n```\n# find . -mtime +60\n```\n\n### How to find files that are modified in\
    \ the last x number of days?\n\nThe following command will list all the files\
    \ that were modified in the last two days under the current directory.\n\n```\n\
    # find . -mtime -2\n```\n\n### How to delete all the files with extension *.tar.gz\
    \ and greater than 100MB?\n\nPlease be careful when executing the following command\
    \ as you't want to delete the files by mistake. The best practice is to execute\
    \ the same command with -l to make sure which files will get deleted when you\
    \ execute the command.\n\n```\n# find / -type f -name *.tar.gz -size +100M -exec\
    \ ls -l \\;\n# find / -type f -name *.tar.gz -size +100M -exec rm -f \\;\n```\n\
    \n### How to archive all the files that are not modified in the last x number\
    \ of days?\n\nThe following command finds all the files not modified in the last\
    \ 60 days under /home/jsmith and creates an archive files under /tmp in format\
    \ of date_archive.tar.\n\n```\n# find /home/jsmith -type f -mtime +60 | xargs\
    \ tar -cvf /tmp/$(date +%d%m%Y)_archive.tar\n```\n\nOn a side note, you can perform\
    \ lot of file related activities (including finding) using commander, a powerful\
    \ text based manager for Unix.\n\n## Hack 19. Suppress Standard Output and Error\n\
    \nSometime while debugging a shell script, you may not want to see either the\
    \ standard output or error message. Use /dev/null as shown below for this will\
    \ be very helpful when you are debugging shell scripts, don't want to display\
    \ the statement and interested in only looking at the error messages.\n\n### Suppress\
    \ standard output using /dev/null\n```\n# cat file.txt > /dev/null\n# ./shell-script.sh\
    \ > /dev/null\n```\n\n### Suppress standard error using /dev/null\n```\n# cat\
    \ invalid-file-name.txt 2>/dev/null\n```\n\nAjay Kumar Tiwari.\n\n## Hack 20.\
    \ Join Command\n\nJoin command combines lines from two files based on a common\
    \ field. In the example below, we have two files – employee.txt and salary.txt.\
    \ Both have employee-id as common field. So we can use join command to combine\
    \ the data from these two files using employee-id as shown below.\n\n| Name |\
    \ ID | Salary |\n| :--- | :--- | :--- |\n| John Smith | 100 | $5000 |\n| John\
    \ Doe | 200 | $500 |\n| Sanjay Gupta | 300 | $3000 |\n| Ashok Sharma | 400 | $1250\
    \ |\n\n```\n$ cat employee.txt\n100 John Smith\n200 John Doe\n300 Sanjay Gupta\n\
    400 Ashok Sharma\n\n$ cat bonus.txt\n100 $5000\n200 $500\n300 $3000\n400 $1250\n\
    \n$ join employee.txt bonus.txt\n100 John Smith $5000\n200 John Doe $500\n300\
    \ Sanjay Gupta $3000\n400 Ashok Sharma $1250\n```\n\n## Hack 21. Change the Case\n\
    \n### Convert a file to upper-case\n```\n$ cat employee.txt\n100 John Smith\n\
    200 John Doe\n300 Sanjay Gupta\n400 Ashok Sharma\n```\n$ tr a-z A-Z < employee.txt\n\
    100 JASON SMITH\n200 JOHN DOE\n300 SANJAY GUPTA\n400 ASHOK SHARMA\n```\n\n###\
    \ Convert a file to lower-case\n```\n$ cat department.txt\n100 FINANCE\n200 MARKETING\n\
    300 PRODUCT\n400 SALES\n```\n$ tr A-Z a-z < department.txt\n100 finance\n200 marketing\n\
    300 product development\n400 sales\n\n## Hack 22. Xargs Command\n\nxargs is a\
