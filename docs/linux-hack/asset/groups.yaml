- md: "\n# Linux Hack\n\nAjay Kumar Tiwari\n\n# Sort a text file in ascending-order\n\
    \n```\n$ sort names.txt\nAlex Jason:200:Sales\nEmma Thomas:100:Marketing\nMadison\
    \ Randy:300:Product Development\nNisha Singh:500:Sales\nSanjay Gupta:400:Support\n\
    ```\n\n# Sort a text file in descending-order\n\n```\n$ sort -r names.txt\nSanjay\
    \ Gupta:400:Support\nNisha Singh:500:Sales\nMadison Randy:300:Product Development\n\
    Emma Thomas:100:Marketing\nAlex Jason:200:Sales\n```\n\n# Sort a colon delimited\
    \ text file on 2nd field (employee_id)\n\n```\n$ sort -t: -k2 names.txt\nEmma\
    \ Thomas:100:Marketing\nAlex Jason:200:Sales\nMadison Randy:300:Product Development\n\
    Sanjay Gupta:400:Support\nNisha Singh:500:Sales\n```\n\n# Sort a tab delimited\
    \ text file on 3rd field (department_name) and suppress duplicates\n\n```\n$ sort\
    \ -t:'\t' -u -k3 names.txt\n```\n\n# Linux Hack\n\nEmma Thomas:100:Marketing\n\
    Madison Randy:300:Product Development\nAlex Jason:200:Sales\nSanjay Gupta:400:Support\n\
    Ajay Kumar Tiwari\n\n# Sort the passwd file by the 3rd field (numeric userid)\n\
    \n```\n$ sort -t: -3n /etc/passwd | more\nroot:x:0:0:root:/bin/bash\nbin:x:1:1:bin:/sbin/nologin\n\
    demon:x:2:2:daemon:/sbin/nologin\nadm:x:3:4:adm:/var/sbin/nologin\nlp:x:4:7:lp:/var/spool/lpd:/sbin/nologin\n\
    ```\n\n# Sort /etc/hosts by ip addresses\n\n```\n$ sort -k 1,1n -k 2,2n -k 3,3n\
    \ -k 4,4n /etc/hosts\n127.0.0.1 localhost.localdomain localhost\n192.168.100.101\
    \ dev-db.thegeekstuff.com dev-db\n192.168.100.102 prod-db.thegeekstuff.com prod-db\n\
    192.168.100.101 prod-web.thegeekstuff.com prod-web\n```\n\n# Combine sort with\
    \ other commands\n\nps -ef | sort : Sort the output of process list\nls -al |\
    \ sort +4n : List the files in the ascending order of the file-size. i.e sorted\
    \ by 5th field and displaying smallest files first.\nls -al | sort +4nr : List\
    \ the files in the descending order of the file-size. i.e sorted by 5th field\
    \ and displaying largest files first.\n\n# Linux Hack\n\nAjay Kumar Tiwari\n\n\
    # Hack 24. Uniq Command\n\nUniq command is mostly used in combination with sort\
    \ command, as uniq removes duplicates only from a sorted file. i.e In order for\
    \ uniq to work, all the duplicate entries should be in the adjacent lines. Following\
    \ are some common examples.\n\n- 1. When you have an employee file with duplicate\
    \ entries, you can do the following to remove duplicates.\n  $ sort namesd.txt\
    \ | uniq\n- 2. If you want to know how many lines are duplicates, do the following.\n\
    \  The first field in the following examples indicates how many duplicates are\
    \ found for that particular line. So, in this example the lines beginning with\
    \ Alex and Emma were found twice in the namesd.txt file.\n  $ sort namesd.txt\
    \ | uniq -c\n2\n2\n1\n1\n1\nAlex Jason:200:Sales\nEmma Thomas:100:Marketing\n\
    Madison Randy:300:Product Development\nNisha Singh:500:Sales\nSanjay Gupta:400:Support\n\
    - 3. The following displays only the entries that are duplicates.\n  $ sort namesd.txt\
    \ | uniq -cd\n2 Alex Jason:200:Sales\n2 Emma Thomas:100:Marketing\n\n# Linux Hack\n\
    \nAjay Kumar Tiwari\n\n# Hack 25. Cut Command\n\nCut command can be used to display\
    \ only specific columns from a text file or other command outputs. Following are\
    \ some of the examples.\n\nDisplay the 1st field (employee name) from a colon\
    \ delimited file\n\n```\n$ cut -d: -f1 names.txt\n```\n\n- Emma Thomas\nAlex Jason\n\
    Madison Randy\nSanjay Gupta\nNisha Singh\n\nDisplay 1st and 3rd field from a colon\
    \ delimited file\n\n```\n$ cut -d: -f1,3 names.txt\n```\n\n- Emma Thomas:Marketing\n\
    Alex Jason:Sales\nMadison Randy:Product Development\nSanjay Gupta:Support\nNisha\
    \ Singh:Sales\n\nDisplay only the first 8 characters of every line in a file\n\
    \n```\n$ cut -c 1-8 names.txt\n```\n\n- Emma Tho\nAlex Jas\nMadison\nSanjay G\n\
    Nisha Si\n\n# Linux Hack\n\nAjay Kumar Tiwari\n\n# Misc Cut command examples\n\
    \ncut -d: -f1 /etc/passwd Displays the unix login names for all the users in the\
    \ system.\nfree | tr -s ' ' | sed '^Mem/ld' | cut -d \" \" -f2 Displays the total\
    \ memory available on the system.\n\n# Hack 26. Stat Command\n\nStat command can\
    \ be used either to check the status/properties of a single file or the filesystem.\n\
    \n# Display statistics of a file or directory.\n\n```\n$ stat /etc/my.cnf\nFile:\n\
    Size:\nDevice:\nAccess:\nModify:\nChange:\n/etc/my.cnf\n346 Blocks: 16 IO Block:\
    \ 4096\nregular file\n801 Inodes: 279856 Links: 1\n644/-rw-r--r-- Uid: (root)\
    \ Gid: root\n2009-01-01 02:58:30.000000\n2006-06-01 04:42:27.000000\n2007-02-02\
    \ 14:17:27.000000 \n$ stat /home/ramesh\n```\n\n```\nFile: '/home/ramesh'\nSize:\
    \ 4096 Blocks: 8 IO Block: 4096\ndirectory\nDevice: 803 Node: 5521409 Links: 7\n\
