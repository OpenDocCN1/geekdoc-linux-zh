    # Hack 13. Login to Remote Host using SSH


    The First time you log in to a remotehost from a localhost, it will display a
    "host key not found" message and you can give "yes" to continue. The host key
    of the remote host will be added under .ssh2/hostkeys directory of your home directory,
    as shown below.


    ```

    localhost$ ssh -l jsmith remotehost.example.com

    Host key not found from database.


    Key fingerprint:

    xabie-dezbc-manud-bardt-saty-limit-nexiu-jambl-title-jarde-tumum

    ```


    You can get a public key''s fingerprint by running

    `% ssh-keygen -F publickey.pub on the keyfile.`


    Are you sure you want to continue connecting (yes/no)? Yes

    Host key saved to

    /homesmith/.ssh2/hostkeys/key_22_remotehost.example.com.pub

    host key for remotehost.example.com, accepted by jsmith Mon May 26 2008 16:06:50
    -0700

    smith@remotehost.example.com password:

    remotehost.example.com$

    ```


    The Second time when you login to the remote host from the localhost, it will
    prompt only for the password as the remote host key is already added to the hosts
    list of the ssh client.


    ```

    localhost$ ssh -l jsmith remotehost.example.com

    smith@remotehost.example.com password:

    remotehost.example.com$

    ```


    For some reason, if the host key of the remote host is changed after logged in
    for the first time, you may get a warning message as shown below. This could be
    because of various reasons such as: Sysadmin upgraded/reinstalled the SSH server
    on the remote host, someone is doing malicious activity. The best action to take
    before saying “yes” to the message is to call your sysadmin and identify why you
    got the host key changed and verify whether it is the correct host key or not.


    ```

    localhost$ ssh -l jsmith remotehost.example.com

    WARNING: HOST IDENTIFICATION HAS CHANGED! IS POSSIBLE THAT SOMEONE IS DOING SOMETHING!
    Someone could be eavesdropping on you right now (man-in-the-middle)!

    ```


    It is also possible that the host key has just changed. Please contact your system
    administrator to get rid of this message. Add correct host key to /homesmith/.ssh/hostkeys/key_22_remotehost.example.com.
