    # 第9 章：系统管理任务


    ## 技巧 65. 使用 fdisk 分区


    在服务器上安装了新磁盘后，你必须使用 fdisk 等工具对其进行相应分区。

    以下是你可以在 fdisk 内部执行的 5 个典型操作（命令）。


    - n: 创建新分区

    - d: 删除现有分区

    - p: 打印分区表

    - w: 将更改写入分区表。即保存。

    - q: 退出 fdisk 工具


    ### 创建分区


    在接下来的示例中，我创建了一个 `/dev/sda1` 主分区。


    ```bash

