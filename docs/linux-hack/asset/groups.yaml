    \ below. Please note that this indicates the cumulative connect time for the individual\
    \ users.\n\n```\n$ last -p\njohn\nmadison\nsanjay\nnisha\n3.64\n0.06\n88.17\n\
    105.92\n```\n\n# Linux Hack\n\nramesh total 309.21\n Ajay Kumar Tiwari\n\n# Connect\
    \ time for a specific user\n\nTo get a connect time report for a specific user,\
    \ execute the following:\n\n```\n$ last -d sanjay\n```\n\n- Jul 2\nAug 25\nSep\
    \ 3\nSep 4\nDec 24\nDec 29\nToday\ntotal\ntotal\ntotal\ntotal\ntotal\n12.85\n\
    5.05\n1.03\n5.37\n8.15\n1.42\n2.95\n\n# Linux Hack\n\nAjay Kumar Tiwari\n\n# Chapter\
    \ 5: PS1, PS2, PS3, PS4\n\n# Hack 29. PS1 - Default Prompt\n\nchange this default\
    \ behavior to display the username, hostname and current directory name as shown\
    \ below. Following PS1 codes are used in this example:\n\n- \\u - Username\n-\
    \ \\h - Hostname\n- \\w - Full path of current directory. Please note that when\
    \ you are in the home directory, this will display only ~ as shown above Personally,\
    \ I prefer a space at the end of the prompt for better readability.\n\nMake this\
    \ setting permanent by adding export PS1=\"\\u@h \\w \" to either .bash_profile\
    \ (or) .bashrc as shown below.\n\nRefer to the next chapter for several practical\
    \ examples of PS1 usage in detail.\n\n# Hack 30. PS2 - Continuation Interactive\
    \ Prompt\n\nA very long command can be broken down to multiple lines by giving\
    \ at the end of the line. The default interactive prompt for a multi-line command\
    \ is \">\". Let us change this default behavior to display \"continue->\" by using\
    \ PS2 environment variable as below.\n\n```\nrames@dev-db -> export PS2=\"continue->\"\
