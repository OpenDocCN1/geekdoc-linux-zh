    \ file?\n\n```\n# unzip var-log.zip\nArchive: var-log.zip\ninflating: var/log/acpid\n\
    inflating: var/log/anaconda.log\ninflating: var/log/anaconda.syslog\ninflating:\
    \ var/log/anaconda.xlog\ncreating: var/log/audit/\n```\n\nTo see a detailed output\
