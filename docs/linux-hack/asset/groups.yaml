    \ SIZE NODE NAME\n\n# 查看系统所有打开的文件\n\n如下所示执行没有任何参数的 lsof 命令。lsof 命令本身可能返回记录输出，除了它可以让你大致了解在任何给定时刻系统中打开了多少文件。\n\
    \n```\n# lsof | wc -l\n3093\n```\n\n# 查看特定用户打开的文件\n\n使用 `lsof -u` 选项显示特定用户打开的所有文件。\n\
    \n```\n# lsof -u ramesh\nvi 7190 ramesh txt REG 474608 47516 /bin/vi\nsshd 7163\
    \ ramesh3u IPv6 15088 263 TCP dev-db:abc-12-12.socal.res.rr.com:2631 (ESTABLISHED)\n\
    ```\n\n管理员可以使用此命令了解用户在系统上执行的内容。\n\n# 列出特定文件的用户\n\n如果你想查看所有使用特定文件的用户，请使用所示 lsof。在此示例中，它显示了所有正在使用\
    \ vi 的用户。\n\n```\n# lsof /bin/vi\nUSER PID FD TYPE SIZE NODE NAME\nroot 7258 txt\
    \ REG 474608 475196 /bin/vi\namesh 7300 txt REG 474608 475196 /bin/vi\n```\n\n\
