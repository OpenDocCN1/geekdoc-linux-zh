    action extended

    primary partition (1-4): 1

    First cylinder (34893, default): 1

    Last cylinder or size (34893, default): 4

    Using default value: 1

    Command (m for help): w

    The partition table has been altered!

    Calling ioctl() to re-read partition table.

    Syncing disks.

    Verify that the partition got created successfully.

    ```


    The number of cylinders for this disk is set to 34893. There is nothing wrong
    with that, but this is larger than 1024, and could in certain setups cause problems.


    # Hack 66. Format a partition using mke2fs


    After partitioning the disks, it is still not ready for usage, we need to format
    the disk. At this stage, if you try to view the disk, it will give the following
    error indicating that no superblock is present.


    ```bash

    # tune2fs -l /dev/sda1

    tune2fs 1.35 (28-Feb-2004)

    tune2fs: Bad magic number in super-block while trying to open /dev/sda1

    Couldn''t find valid superblock.

    ```


    To format the disk, use mke2fs as shown below.


    ```bash

    # mke2fs /dev/sda1

    ```


    You can also pass the following optional parameter to mke2fs:


    - -m 0: reserved-blocks-percentage – indicates the percentage of the filesystem
    blocks reserved for the user. Default is 5%. In the following example, it is set
    to 0.

    - -b 4096: block-size specified in bytes. Valid values are 1024, 2048 and 4096
    bytes per block.


    ```bash

    # mke2fs -m 0 -b 4096 /dev/sda1

