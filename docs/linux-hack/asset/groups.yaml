    \n## Introduction\n\nThere are only 10 types of people in the world: those who\
    \ understand binary, those who don't, and those who copy-paste from Stack Overflow.\
    \ This collection of tips will help you navigate the Linux environment more effectively.\n\
    \n## Foreword\n\nAnother collection of hacks for those who love the command line\
    \ and want to explore the depths of the Linux system.\n\n## Version\n\n| Date\
    \ | Version |\n|---|---|\n| Date | |\n| Date | |\n| Date | |\n| Date | |\n| Date\
    \ | |\n| Date | |\n| Date | |\n| 2015 | |\n\n## Chapter 1: Powerful CD Command\
    \ Hacks\n\n- Use CDPATH to define the base directory for cd command\n- cd alias\
    \ to navigate up the directory effectively\n- Perform mkdir and cd using a single\
    \ command\n- Use \"cd -\" to toggle between the last two directories\n- Use dirs,\
    \ pushd and popd to manipulate directory stack\n- Use \"shopt -s spell\" to automatically\
    \ correct mistyped deory names on cd\n\n## 1. Use CDPATH to define the base directory\
    \ for cd command\n\nThe CDPATH variable allows you to search multiple directories\
    \ when using the `cd` command. When you type `cd <directory>`, the shell will\
    \ check the current directory first, then the directories listed in CDPATH.\n\n\
    ```bash\nexport CDPATH=~/Documents:~/Projects:/var/www\n```\nWith this set, `cd\
    \ myproject` will work even if you are not in `~/Projects/myproject`.\n\n## 2.\
    \ Use cd alias to navigate up the directory effectively\n\nInstead of typing `cd\
    \ ../` to go up multiple levels, you can define aliases to make navigation much\
    \ faster.\n\n```bash\nalias ..='cd ..'\n```\nNow you can simply type `..` to go\
    \ up one level.\n\n## 3. Perform mkdir and cd using a single command\n\nYou can\
    \ create a directory and immediately enter it using a shell function.\n\n```bash\n\
    mkcd() {\n    mkdir -p \"$1\" && cd \"$1\"\n}\n```\nNow `mkcd new_folder` will\
    \ create the folder and move into it.\n\n## 4. Use \"cd -\" to toggle between\
    \ the last two directories\n\nThe `cd -` command takes you to the previous directory.\
    \ This is incredibly useful for switching between two working locations.\n\n##\
    \ 5. Use dirs, pushd and popd to manipulate directory stack\n\n`pushd` adds a\
    \ directory to the stack, and `popd` removes it and returns you to the previous\
    \ one. `dirs` shows the current stack.\n\n```bash\npushd /var/log\npushd /etc\n\
    popd # returns to /var/log\n```\n\n## 6. Use \"shopt -s spell\" to automatically\
    \ correct mistyped deory names on cd\n\nEnable the spell-check option to fix small\
    \ typos in directory names when using `cd`.\n\n```bash\nshopt -s spell\n```\n\n\
