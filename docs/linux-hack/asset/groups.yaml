    0\n0\n\nAjay Kumar Tiwari\n\n0 1117 577 0 0 100 0\n0 1007 366 0 0 100 0\n\n# Vmstat\
    \ 进程部分\n- r 字段：可运行进程数\n- b 字段：阻塞进程数\n\n# 内存部分\n- Swpd 字段：已交换内存量\n- Free 字段：空闲内存\n\
    - Buff 字段：缓冲区内存\n- Cache 字段：文件系统缓存\n\n# 交换分区部分\n- Si 字段：每秒从交换分区交换的内存\n- So 字段：每秒写入交换分区的内存\n\
    \n# IO 部分\n- Bi 字段：每秒从磁盘读取的块\n- Bo 字段：每秒写入磁盘的块\n\n# 系统部分\n- In 字段：每秒中断数\n- Cs\
    \ 字段：每秒上下文切换数\n\n# Linux 技巧\nAjay Kumar Tiwari\n\n# CPU 部分\n- Us 字段：用户态运行 CPU\
    \ 时间\n- Sy 字段：内核态运行 CPU 时间\n- Id 字段：空闲 CPU 时间\n- Wa 字段：等待 IO 的时间\n\n# 技巧 98. Netstat\
    \ 命令\n\n`netstat` 命令显示网络相关信息，如连接、路由表、接口统计数据。以下是使用 `netstat` 命令的几个示例。\n\n# 使用 netstat\
