    \ 2009-01-01 12:07:33.000000\nChange: 2009-01-09 12:07:33.000000\n```\n\n# Linux\
    \ Hack\n\nAjay Kumar Tiwari\n\n# Display the status of the filesystem using -f\n\
    \n```\n$ stat -f /\nFile:\nID:\nBlocks: 1876998\nInodes: 255\nType: ext3\nTotal:\
    \ 2579457\nFree: 2008027\nAvailable: 1310720\nSize\n```\n\n# Hack 27. Diff Command\n\
    \ndiff command compares two different files and reports the difference. The output\
    \ is very cryptic and not straightforward to read. Syntax: diff [options] file1\
    \ file2\n\n# What was modified in my new file when compare to my old file?\n\n\
    The option -w in the diff command will ignore the white space while performing\
    \ the comparison. In the following diff output:\n\nThe lines above indicates the\
    \ changes happened in first file in the diff command (i.e. file_name.txt).\nThe\
    \ lines below indicates the changes happened to the second file in the diff command\
    \ (i.e. file_name_new.txt). The lines that belong to the first file starts with\
    \ < and the lines of second file with >.\n\n```\n# diff -w name_list.txt name_list_new.txt\n\
    ```\n\n2c,3\n< John Doe\n> John M Doe\n> Jason Bourne\n\n# Hack 28. Display total\
    \ connect time of users\n\nlast command will display the statistics about the\
    \ user's connect time.\n\n# Connect time for the current logged in user\n\nWith\
    \ the option -d, it will break down the output for the individual days. In this\
    \ example, I've been logged in to the system for more than 6 hours today. On Dec\
    \ 1st, I was logged in for about 1 hour.\n\n```\n$ last -d\nDec 1\nDec 2\nDec\
    \ 3\nDec 4\nToday\ntotal\ntotal\ntotal\ntotal\ntotal\n1.08\n0.99\n3.39\n4.50\n\
    6.10\n```\n\n![](img/340b68128e85f9b34d5bae9c5ff0cdd8_56_0.png)\n\n# Connect time\
