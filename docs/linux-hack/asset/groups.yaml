    # Hack 48. Tar Command Basics


    tar command (tape archive) is used to convert a group of files into an archive.


    Syntax: tar [options] [tar-archive-name] [other-file-names]


    ## How can I create a single backup file of all files and subdirectories under
    my home directory?


    The following command creates a single archive backup file called my_home_directory.tar
    under /tmp. This archive will contain all the files and subdirectories under /home/jsmith.


    - Option c, stands for create an archive.

    - Option v stands for verbose mode, displays additional information while executing
    the command.

    - Option f indicates the archive file name mentioned in the command.


    # tar cvf /tmp/my_home_directory.tar /home/jsmith


    # How do I view all the files inside the tar archive?


    Option t will display all the files from the tar archive.

    # tar tvf /tmp/my_home_directory.tar


    # How do I extract all the files from a tar archive?


    Option x will extract the files from the tar archive as shown below. it will extract
    the content to the current directory location from where the command is executed.

    # tar xvf /tmp/my_home_directory.tar


    # How do I extract tar.gz files to a specific directory?


    ```

    # tar xvfz /tmp/my_home_directory.tar.gz -C /home/ramesh

    ```


    # Hack 49. Combine gzip, bzip2 with tar


    ## How to use gzip with tar?


    Add option z to the tar command when dealing with tar.gz compressed file.

    # tar cvfz /tmp/my_home_directory.tar.gz /home/jsmith

    # tar xvfz /tmp/my_home_directory.tar.gz

    # tar tvfz /tmp/my_home_directory.tar.gz


    > Note: Using gzip is faster when compared to bzip2.


    # How to use bzip2 with tar?


    Add option j to the tar command when dealing with tar.bz2 compressed file.


    ```

    # tar cvfj /tmp/my_home_directory.tar.bz2 /home/jsmith

    # tar xvfj /tmp/my_home_directory.tar.bz2

    # tar tvjf /tmp/my_home_directory.tar.bz2

    ```


    Note: Using bzip2 gives higher level of compression when compared to gzip.


    # Chapter 8: Command Line History


    When you are using Linux command line frequently, using the history effectively
    can be a major productivity boost. In fact, once you have mastered the 15 examples
    that I''ve provided here, you''ll find command line more enjoyable and fun.


    # Hack 50. Display TIMESTAMP in history using HISTSTIMEFORMAT


    Typically when you type history from command line, it displays the command and
    the command. For auditing purpose, it may be beneficial to display the timestamp
    along with the command as shown below.


    ```

    # export HISTTIMEFORMAT="%F %T "

    # history

    1

    2

    3

    4

    | more

    2008-08-05

    2008-08-05

    2008-08-05

    19:02:39

    19:02:39

    19:02:39

    service network restart

    exit

    id

    cat /etc/redhat-release

    ```


    Note: You can also setup the following alias to view the recent history commands.

    alias h1=''history 10''

    alias h2=''history 20''

    alias h3=''history 30''


    ## Hack 51. Search the history using Control+R


    I strongly believe that this may be your most frequently used feature of history.
    When you''ve already executed a very long command, you can simply search history
    using a keyword and re-execute the same command without having to type it fully.
    Press Control+R and type the keyword.


    In the following example, I searched for red, which displayed the previous command
    "cat /etc/redhat-release" in the history that contained the word.


    # [Note: Press Ctrl+R from the command prompt, which will display the reverse-i-search
    prompt as shown below]

    (reverse-i-search)''red'': cat /etc/redhat-release

    # [Note: Press enter when you see your command, which will execute the command
    from the history]

    # cat /etc/redhat-release


    Fedora release 9 (Sulphur)


    Sometimes you want to edit a command from history before executing it. For e.g.
    you can search for httpd, which will display service httpd stop from the command
    history, select this command and change the stop to start and re-execute it again
    as shown below.


    # [Note: Press Ctrl+R from the command prompt, which will display the reverse-i-search
    prompt as shown below]

    (reverse-i-search)''httpd'': service httpd stop

    [Note: Press enter when you see your command, which will execute the command from
    the history]

    # service httpd start


    ## Hack 52. Repeat previous command from history


    Sometimes you may end up repeating the commands. Following are four different
    ways to repeat the last command:

    1. Use the up arrow

    2. Type ! and enter

    3. Type !! and enter

    4. Press Ctrl+P


    In the following example, if you want to repeat a command starting with ps, type
    !ps and enter.


    ## Hack 53. Execute a command that starts with a word


    If you want to execute a command starting with a specific word, type !followed
    by the letters of the word. For example, if you want to execute a command starting
    with cat, type !cat and enter.


    ## Hack 54. Control the total number of lines in history using HISTSIZE


    The variable HISTSIZE limits the number of commands stored in the history list.
    To increase this limit, set it in your bash profile:


    ```bash

    export HISTSIZE=1000

    ```


    ## Hack 55. Change the history file name using HISTFILE


    By default, history is stored in ~/.bash_history. To track commands executed from
    different terminals, set the HISTFILE variable in your bash profile:


    ```bash

    export HISTFILE=~/.commandline_warrior

    ```

