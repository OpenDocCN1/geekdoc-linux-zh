- md: "\n# Linux Hack\n\nAjay Kumar Tiwari\n\n## Hack 80. Show all accepted directives\
    \ inside httpd.conf\n\nThis is like an extended help for httpd, which will display\
    \ all the httpd.conf\ndirectives and the places where they are valid. For a specific\
    \ directive, it tells all the possible values and where it can be used inside\
    \ the httpd.conf.\nThis can be very helpful, when you want to quickly know about\
    \ a particular Apache directive.\n\n- # -L HostnameLookups (core.c)\n\"on\" to\
    \ enable, \"off\" to disable reverse DNS lookups, or \"double\" to enable double-reverse\
    \ DNS lookups\nAllowed in *.conf anywhere\n- ServerLimit (prefork)\nMaximum value\
    \ of MaxClients for this run of Apache Allowed in *.conf only outside <Directory>,\
    \ <Files> or <Location>\n- KeepAlive (http_core.c)\nWhether persistent connections\
    \ should be On or Off Allowed in *.conf only outside <Directory>, <Files> or <Location>\n\
    - LoadModule (mod_so.c)\na module name and the name of a shared object file to\
    \ load in *.conf only outside <Directory>, <Files> or <Location>\n\n## Hack 81.\
    \ Validate the httpd.conf after changes\n\nUse option -t to validate whether there\
    \ are any issues with a specific Apache configuration file. In the example shown\
    \ below, it displays that there is a problem at line 148 in the httpd.conf.debug.\
    \ mod_auth_basic is missing a (period) before the so.\n\n```\n# httpd -t -f conf/httpd.conf.debug\n\
    httpd: Syntax error on line 148 of\n/etc/httpd/conf/httpd.conf.debug:\nCannot\
    \ load module /etc/httpd/modules/mod_auth_basic into\nserver:\n/etc/httpd/modules/mod_auth_basic:\
    \ cannot open shared\nobject file: No such file or directory\n```\n\nOnce you\
    \ fix the issue, it will display Syntax OK.\n```\n# httpd -t -f conf/httpd.conf.debug\n\
    Syntax OK\n```\n\n## Hack 82. Display the httpd build parameters\n\nUse option\
    \ -V (upper-case V), to display Apache version version number and all the\nparameters\
    \ that are used while building the Apache.\n\n```\n# httpd -V\nServer version:\
    \ Apache/2.2.9 (Unix)\nServer built:Jul 14 2008 15:36:56\nServer's Module Number:\
    \ 20051115115\nServer loaded: APR 1.2.12, APR-Util 1.2.12\nCompiled using: APR\
    \ 1.2.12, APR-Util 1.2.12\nArchitecture:32-bit\nServer MPM:Prefork\ntreaded:no\n\
    forked:yes (variable process count)\nServer compiled with...,\n-D APACHE_MPM_DIR=\"\
    server/mpm/prefork\"\n-D APR_HAS_SENDFILE\n-D APR_HAS_MMAP\n-D APR_HAVE_IPV6 (IPv4-mapped\
    \ addresses enabled)\n-D APR_USE_SYSMEM_SERIALIZE\n-D APR_USE_PTHREAD_SERIALIZE\n\
    -D SINGLE_LISTEN_UNSERIALIZED_ACCEPT\n-D APR_HAS_OTHER_CHILD\n-D AP_HAVE_RELIABLE_PIPED_LOGS\n\
    -D DYNAMIC_MODULE_LIMIT=128\n-D HTTPD_ROOT=\"/etc/httpd\"\n-D SUEEXEC_BIN=\"/usr/sbin/suexec\"\
    \n-D DEFAULT_PIDLOG=\"logs/httpd.pid\"\n-D DEFAULT_SCOREBOARD=\"logs/apache_runtime_status\"\
    \n-D DEFAULT_LOCKFILE=\"/logs/accept.lock\"\n-D DEFAULT_ERRORLOG=\"logs/error_log\"\
    \n-D AP_TYPES_CONFIG_FILE=\"conf/mime.types\"\n-D SERVER_CONFIG_FILE=\"conf/httpd.conf\"\
    \n```\n\nIf you want display only the Apache version number, use the option -v\
    \ (lower-case) v as shown below.\n\n```\n# httpd -v\nServer version: Apache/2.2.9\
    \ (Unix)\nServer built:Jul 14 2008 15:36:56\n```\n\n## Hack 83. Load a specific\
    \ module only on demand\n\nSometimes you may not want to load all the modules\
    \ in the Apache. For e.g.\nYou may want to load LDAP related modules to Apache,\
    \ only when you are testing LDAP. This can be achieved as shown below.\n\nModify\
    \ the httpd.conf and add IfDefine directive called load-ldap (you can name this\
    \ anything you want).\n\n```\n<IfDefine load-ldap>\nLoadModule ldap_module modules/mod_ldap.so\n\
    LoadModule authnz_ldap_module modules/mod_authnz_ldap.so\n</IfDefine>\n```\n\n\
    When you are testing ldap and would like to Load the ldap related\nmodules, pass\
    \ the load-ldap to Option -D, as shown below:\n`# httpd -k start -e debug -Dload-ldap\
    \ -f /etc/httpd/conf/httpd.conf.debug`\n\n```\n[Sun Aug 17 14:58 2008] [debug]\
    \ mod_so.c(246): loaded ldap_module\n[Sun Aug 17 14:58 2008] [debug] mod_so.c(246):\
    \ loaded authnz_ldap_module\n```\nNote: Pass -Dload-ldap, to load ldap modules\
    \ into Apache. Note: Start the Apache normally, if you don't want to load ldap\
    \ modules.\n\n## Chapter 11: Bash Scripting\n\n## Hack 84. Execution of .bash_*\
    \ files\n\nWhat is the sequence in which following files are executed? Following\
    \ pseudo code explains the sequence of execution of these files.\n\n- /etc/profile\n\
    - ~/.bash_profile\n- ~/.bashrc\n- ~/.bash_login\n- ~/.logout\n\n### Execution\
    \ for interactive shell\n\nWhen launching an interactive shell, following is the\
    \ sequence:\n```\nif [ -f /etc/profile ]; then\n    . /etc/profile\nfi\nif [ -f\
    \ ~/.bash_profile ]; then\n    . ~/.bash_profile\nfi\nif [ -f ~/.bashrc ]; then\n\
    \    . ~/.bashrc\nfi\n```\n\n### Execution for non-login shell\n\nWhen a non-interactive\
    \ shell starts up, it looks for ENV variable, and executes the file name mentioned.\n\
    ```bash\nif [ -f ~/.bashrc ]; then\n    . ~/.bashrc\nfi\n```\n\n## Hack 85. How\
    \ to generate random number in bash shell\n\nUse the $RANDOM built-in function\
    \ to generate random number between 0 and 32767 as shown below.\n\n```\necho $RANDOM\n\
    ```\n\n## Hack 86. Debug a shell script\n\nTo debug a shell script use set -xv\
    \ inside the shell script at the top.\n\n### Shell script with debug command:\n\
    \n```bash\ncat filesize.sh\nfor filesize in $(ls -l | grep \"^-\" | awk '{print\
    \ $5}')\ndo\n    totalsize=$totalsize+$filesize\ndone\necho \"Total file size\
    \ in current directory: $totalsize\"\n```\n\n### Output of Shell script with debug\
    \ command:\n\n```\n./filesize.sh\nTotal file size in current directory\n```\n\n\
    ### Shell script with Debug command inside:\n\nAdd set -xv inside the shell script\
    \ now to debug the output shown below.\n\n```bash\ncat filesize.sh\nset -xv\n\
    for filesize in $(ls -l | grep \"^-\" | awk '{print $5}')\ndo\n    totalsize=$totalsize+$filesize\n\
    done\necho \"Total file size in current directory: $totalsize\"\n```\n\n### Output\
    \ of Shell script with Debug command inside:\n\n```\n./filesize.sh\n++ ls -l\n\
    ++ grep \"^-\"\n++ awk '{print $5}'\n++ echo \"Total file size in ...\n```\n\n\
    ### Execute Shell script with debug option:\n\nInstead of giving the set -xv inside\
    \ the shell script, you can also provide that while executing the shell script\
    \ shown below.\n```bash\nbash -xv filesize.sh\n```\n\n## Hack 87. Quoting\n\n\
    echo statement without any special character.\n```bash\necho The Geek Stuff\n\
    ```\n\nEcho statement with a special character ; semi-colon is a command terminator\
    \ in bash. In the following example, \"The Geek\" works for the echo \"Stuff\"\
    \ is treated as a separate Linux command and gives command not found.\n\n```bash\n\
    echo The Geek; Stuff\nThe Geek\n-bash: Stuff: command not found\n```\n\nTo avoid\
    \ this you can add a \\; in front of semi-colon, which will remove the special\
    \ meaning of semi-colon and just print it as shown below.\n\n```bash\necho The\
    \ Geek\\; Stuff\nThe Geek; Stuff\n```\n\n### Single Quote\n\nUse single quote\
    \ when you want to literally print everything inside the single quote. Even the\
    \ special variables such as $HOSTNAME will be print as $HOSTNAME instead of printing\
    \ the name of the Linux host.\n\n```bash\necho 'Hostname=$HOSTNAME ; Message=\\\
    $ is USD'\nHostname=$HOSTNAME ; Message=\\$ is USD\nCurrent User=`whoami`;\nCurrent\
    \ User=`whoami`;`\n```\n\n### Double Quote\n\nUse double quotes when you want\
    \ to display the real meaning of special variables.\n\n```bash\necho \"Hostname=$HOSTNAME\
    \ ; Message=\\$ is USD\"\nCurrent User=`whoami`;`\n```\n"
