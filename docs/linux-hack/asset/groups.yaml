    \n# 技巧 75. 使用 Magic SysRq 键安全重启 Linux\n\nMagic SysRq 键是 Linux 内核中的组合键，允许用户无论系统状态如何都能执行各种低级命令。它通常用于从冻结中恢复，或在不损坏文件系统的情况下重启计算机。组合键组合为\
    \ Alt+SysRq+命令键。在许多系统中，SysRq 键就是 PrintScreen（打印屏幕键）。\n\n首先，你需要启用 SysRq 键，所示：\n\
    `echo \"1\" > /proc/sys/kernel/sysrq`\n\n# SysRq 命令列表\n\n以下是 Alt+SysRq+命令键 可用的命令键。\n\
    \n- 'k' – 杀死在当前虚拟控制台上运行的所有进程。\n- 's' – 尝试同步所有已挂载的文件系统。\n- 'b' – 立即重启系统，不卸载分区或进行同步。\n\
    - 'e' – 向 init 以外的所有进程发送 SIGTERM信号。\n- 'm' – 将当前内存信息输出到控制台。\n- 'i' - 向 init 以外的所有进程发送\
    \ SIGKILL信号。\n- 'r' - 将键盘从原始模式（如 X11 等程序使用的模式）切换到 XLATE 模式。\n- 's' – 同步所有已挂载的文件系统。\n\
    - 't' - 向控制台输出当前任务列表及其信息。\n- 'u' - 以只读模式重新挂载所有已挂载的文件系统。\n- 'o' – 立即关闭系统。\n- 'p'\
    \ – 将当前寄存器和标志位打印到控制台。\n- '0-9' - 设置控制台日志级别，控制哪些内核消息被打印到你的控制台。\n- 'f' - 将调用 oom_kill\
    \ 来杀死占用内存更多的进程。\n- 'h' - 用于显示帮助。但上述列出的任何其他键也会通过将键写入 /proc/sysrq-trigger 文件来实现此功能。\n\
    例如，要重启系统，你可以执行以下操作：\n`echo \"b\" > /proc/sysrq-trigger`\n\n# 使用 Magic SysRq 键执行\
    \ Linux 安全重启\n\n要对挂死的 Linux 计算机进行安全重启，请执行以下操作。这将避免下次重启时进行 fsck 检查。即按下下方高亮显示的 Alt+SysRq+字母：\n\
    - unRaw (从 X11 夺回键盘控制权)，\n- tTerminate (向所有进程发送 SIGTERM，允许它们优雅地退出)，\n- kill (向所有进程发送\
    \ SIGILL，强制它们立即终止)，\n- Sync (将数据刷入磁盘)，\n- Unmount (将所有文件系统重新挂载为只读)，\n- reBoot\
    \ (重启)。\n\n# 第 10 章：Apachectl 和 httpd 示例\n\n在安装 Apache 之后，如果你想充分利用 apachectl 和\
    \ httpd 的效能，你不应该仅仅局限于使用 start、stop 和 restart。本章提供的实际示例将帮助你有效地使用 apachectl 和 httpd。Apachectl\
    \ 的作用等于 SysV init 脚本，接受 start、stop 和 status 等参数。它通过简单地将命令行参数传递给 httpd 来充当 httpd\
    \ 的前端。因此，你使用 apachectl 执行的所有命令也可以通过直接调用 httpd 来执行。如果你没有 Apache，请参考。\n\n如果你 如果没有\
    \ Apache，请参考。\n\n# 技巧 76. 使用不同的配置\n\n 原始模式（如 X11 等程序使用的模式），切换到 XLATE 模式。\n\n#\
    \ 技巧 77. 使用临时 DocumentRoot\n\n# 技巧 78. 临时增加日志级别\n\n# 技巧 79. 显示 Apache 内部的模块\n\n"
