    # Hack 59. Force history not to remember a particular command using HISTCONTROL


    When you execute a command, you can instruct history to ignore the command by
    setting HISTCONTROL to `ignorespace` AND typing a space in front of the command
    as shown below. I can see lot of junior sysadmins getting excited about this,
    as they can hide a command from the history.


    It is good to understand how ignorespace works. But, as a best practice, don''t


    ```bash

    # export HISTCONTROL=ignorespace

    # ls -ltr

    # pwd

    # service httpd stop

    [Note: There is a space at the beginning of service, to ignore this command from
    history]

    # history | tail -3

    67 ls -ltr

    68 pwd

    69 history | tail -3

    ```


    # Hack 60. Clear all the previous history using option -c


    Sometimes you may want to clear all the previous history. However may still want
    to keep the history moving forward.


    ```bash

    # history -c

    76

    ```


    # Hack 61. Substitute words from history commands


    When you are searching through history, you may want to execute a different command
    but use the same parameter from the command that you''ve just searched.


    In the example below, the !!$ next to the vi command gets the argument from the
    previous command to the current command.


    ```bash

    # ls anaconda-ks.cfg

    anaconda-ks.cfg

    # vi !!:

    vi anaconda-ks.cfg

    ```


    In the example below, the !^ next to the vi command gets the first argument from
    the previous command (i.e cp command) to the current command (i.e vi command).


    ```bash

    # cp anaconda-ks.cfg anaconda-ks.cfg.bak

    anaconda-ks.cfg

    # vi ^^

    vi anaconda-ks.cfg

