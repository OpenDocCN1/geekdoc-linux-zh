  - "[PAGE 141]\n\n# Linux Hack\n\nThe Geek Stuff\nAjay Kumar Tiwari\nEcho statement\
    \ with a special character ; . semi-colon is a command terminator in bash. In\
    \ the following example, \"The Geek\" works for the echo\n \"Stuff\" is treated\
    \ as a separate Linux command and gives command found.\n\n```\n$ echo The Geek;\
    \ Stuff\n```\n\nThe Geek\n-bash: Stuff: command not found\nTo avoid this you can\
    \ add a \\w in front of semi-colon, which will remove the\nspecial meaning of\
    \ semi-colon and just print it as shown below.\n\n```\n$ echo The Geek; Stuff\n\
    ```\n\nThe Geek; Stuff\n\n# Single Quote\n\nUse single quote when you want to\
    \ literally print everything inside the single\nquote. Even the special variables\
    \ such as $HOSTNAME will be print as $HOSTNAME instead of printing the name of\
    \ the Linux host.\n\n```\n$ echo 'Hostname=$HOSTNAME ;\nMessage=\\$ is USD'\n\
    Hostname=$HOSTNAME ;\nMessage=\\$ is USD\nCurrent User=`whoami`;\nCurrent User=`whoami`;`\n\
    ```\n\n# Double Quote\n\nUse double quotes when you want to display the real meaning\
    \ of special\nvariables.\n\n```\n$ echo \"Hostname=$HOSTNAME ;\nMessage=\\$ is\
    \ USD\"\nCurrent User=`whoami`;`\n```"
