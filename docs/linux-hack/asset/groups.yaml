    \ |\n| 31187 0.013 20640 14444 ?S Jul26 0:37 /usr/local/apache2/bin/httpd |\n\
    ```\n\n 杀死 'httpd' 进程：\n31186\n31187\n\n# 技巧 94. du 命令\n\ndu 命令（disk usage）将打印特定目录及其子目录的空间使用情况。\n\
