    \n# 技巧 93. kill 命令\n\nkill 命令可用于终止运行中的进程。通常，此命令用于杀死挂起且无响应的进程。\n语法：kill [options]\
    \ [pids][commands]\n\n# 如何杀死挂起的进程？\n\n首先，使用 `ps` 命令识别你想要杀死的特定进程的进程 ID（PID）。一旦知道了\
    \ PID，将其作为参数传递给 `kill` 命令。下面的示例显示了如何杀死挂起的 apache httpd 进程。请注意，通常你应该使用 \"apachectl\
