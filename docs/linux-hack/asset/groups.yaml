    # Hack 72. Setup passwordless login in OpenSSH

    You can login to a remote Linux server without entering password using simple
    steps using ssh-keygen and ssh-copy-id as explained in this example. ssh-keygen
    creates the public and private keys. ssh-copy-id copies the local-host''s public
    key to the remote-host''s authorized_keys files. ssh-copy-id also sets proper
    permission to the remote-host''s ~/.ssh directory.


    Step 1: Create public and private keys using ssh-keygen on local file which to
    save the key:

    ```

    jsmith@local-host$ ssh-keygen

    Enter passphrase (empty for none):

    Enter same passphrase again:

    Identification been saved in /home/jsmith/.ssh/id_rsa

    Your public key has been saved in /home/jsmith/.ssh/id_rsa.pub.

    The key fingerprint is: SHA256:3fe9f...

    ```


    Step 2: Copy the public key to remote-host using ssh-copy-id

    Now try logging into the machine, with "remote-host", and check in .ssh/authorized_keys
    to make sure we haven''t added extra keys you weren''t expecting. Note: ssh-copy-id
    appends the keys to the remote-host''s authorized_keys.

    ```

    jsmith@local-host$ ssh-copy-id -i ~/.ssh/id_rsa.pub remote-host

    remote-host''s password:

    ```


    Step 3: Login to remote-host without entering password

    ```

    jsmith@local-host$ ssh remote-host

    Last login: Sun Nov 16 17:22 2008 from 192.168.1.2

    Note: SSH did not ask for password.

    Note: You are on remote-host here

    ```


    # Hack 73. Use ssh-copy-id with ssh-agent

    Using ssh-copy-id with the ssh-agent when no value is passed for the option -i
    and if ~/.ssh/identity.pub is not available, ssh-copy-id will display the following
    error message:

    ```

    jsmith@local-host$ ssh-copy-id -i remote-host

    usr/bin/ssh-copy-id: ERROR: No identities found

    ```

    If you have loaded keys to the ssh-agent, then ssh-copy-id will get the keys from
    the ssh-agent to copy to the remote-host. i.e, it copies the keys provided by
    ssh-add -L command to the remote-host, when you don''t pass option -i to the ssh-copy-id.

    ```

    jsmith@local-host$ ssh-agent $SHELL

    jsmith@local-host$ ssh-add -L

    The agent has no identities.

    jsmith@local-host$ ssh-add

    identity added: /home/jsmith/.ssh/id_rsa

    jsmith@local-host$ ssh-copy-id -i remote-host

    remote-host$: password:

    ```

    ```

    AAAAB3NzaC1yc2AAAAABWQAAAsJIEILXfjt8aSxMa3d8t6Jm97D

    ```

    Now try logging into the machine, with "remote-host", and check in: .ssh/authorized_keys
    to make sure we haven''t added extra keys you weren''t expecting. [Note: This
    has added the key displayed by ssh-add -L]


    # Linux Hack

    Three Minor Annoyances of ssh-copy-id


    Ajay Kumar Tiwari


    Following are few minor annoyances of the ssh-copy-id:


    - 1. Default public key: ssh-copy-id uses ~/.ssh/identity.pub as the default public
    key file (i e no value is passed to option -i). Instead, I wish it uses id_rsa.pub,
    or id_rsa,identity.pub as default keys. i.e If one of them exist, it should copy
    that to the remote-host. If two or three of them exist, it should copy identity.pub
    as default.

    - 2. The agent has no identities: When the ssh-agent is running and the ssh-add
    -L returns “The agent has no identities” (i e no keys are added to the ssh-agent),
    the ssh-copy-id will still copy the message “The agent has no identities” to the
    remote-host’s authorized_keys entry.

    - 3. Duplicate entry in authorized_keys: I wish ssh-copy-id validates duplicate
    entry on the remote-host’s authorized_keys. If you execute ssh-copy-id multiple
    times on the local-host, it will keep appending the same key on the remote-host’s
    authorized_keys file without checking for duplicates. Even with duplicate entries
    everything works as expected, But I would like to have my authorized_keys file
    clutter free.


    # Hack 74. Crontab


    Using cron you can execute a shell-script or Linux commands at a specific time
    and date. For example a sysadmin can schedule a backup job that can run every
    day.


    # How to add a job to the cron?


    ```

    # crontab -e

    0 5 *** * * /root/bin/backup.sh

    ```

