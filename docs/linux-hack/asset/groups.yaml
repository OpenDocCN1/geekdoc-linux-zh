    # Linux Hack


    Ajay Kumar Tiwari


    This will execute /root/bin/backup.sh at 5 a.m every day.


    # Description of Cron


    Following is the format of the crontab file.

    {minute} {hour} {day-of-month} {month} {day-of-week} {full-path-to-shell-script}


    - minute: Allowed range 0 – 59

    - hour: Allowed range 0 – 23

    - day-of-month: Allowed range 0 – 31

    - month: Allowed range 1 – 12. 1 = January. 12 = December.

    - day-of-week: Allowed range 0 – 7. Sunday is either 0 or 7.


    # Crontab examples


    - 1. Run at 12:01 a.m. 1 minute after midnight everyday. This is a good time to
    run backup when the system is not under load.

    `1 0 * * * /root/bin/backup.sh`


    - 2. Run backup every weekday (Mon – Fri) at 11:59 p.m.

    `59 11 * * 1,2,3,4,5 /root/bin/backup.sh`

    Following will also do the same.

    `59 11 * * 1-5 /root/bin/backup.sh`


    - 3. Execute the command every 5 minutes.

    `*/5 * * * * /root/bin/check-status.sh`

    - 4. Execute at 1:10 p.m on 1st of every month

    `10 13 1 * * /root/bin/full-backup.sh`

    - 5. Execute 11 p.m on weekdays.

    `0 23 * 1-5 /root/bin/incremental-backup.sh`


    # Crontab Options


    Following are the available options with crontab:


    - `crontab -e` : Edit the crontab file. This will create a crontab, if it doesn''t
    exist

    - `crontab -l` : Display the crontab file.

    - `crontab -r` : Remove the crontab file.

    - `crontab -i` : This will prompt user before deleting a crontab.


    # Hack 75. Safe Reboot Of Linux Using Magic SysRq Key


    The magic SysRq key is a key combination in the Linux kernel which allows the
    user to perform various low level commands regardless of the system''s state.
    It is often used to recover from freezes, or to reboot a computer without corrupting
    the filesystem. The key combination consists of Alt+SysRq+commandkey. In many
    systems the SysRq key is the printscreen key.


    First, you need to enable the SysRq key, as shown below.

    `echo "1" > /proc/sys/kernel/sysrq`


    # List of SysRq Command


    Following are the command keys available for Alt+SysRq+commandkey.


    - ''k'' – Kills all the process running on the current virtual console.

    - ''s'' – This will attempt to sync all the mounted file system.

    - ''b'' – Immediately reboot the system, without unmounting partitions or syncing.

    - ''e'' – Sends SIGTERM to all process except init.

    - ''m'' – Output current memory information to the console.

    - ''i'' - Send the SIGKILL to all processes except init

    - ''r'' - Switch the keyboard from raw mode (the mode used by programs such as
    X11), to XLATE mode.

    - ''s'' – sync all mounted file system.

    - ''t'' - Output a list of current tasks and their information to the console.

    - ''u'' - Remount all mounted filesystems in readonly mode.

    - ''o'' – Shutdown the system immediately.

    - ''p'' – Print the current registers and flags to the console.

    - ''0-9'' - Sets the console log level, controlling which kernel messages be printed
    to your console.

    - ''f'' - Will call oom_kill to kill process which takes more memory.

    - ''h'' - Used to display the help. But any other keys than the above listed will
    also do this by echoing the keys to the /proc/sysrq-trigger file.

    For example, to re-boot a system you can perform the following.

    `echo "b" > /proc/sysrq-trigger`


    # Perform a Safe reboot of Linux using Magic SysRq Key


    To perform a safe reboot of a Linux computer which hangs up, the following. This
    will avoid the fsck during the next re-booting. i.e Press Alt+SysRq+letter highlighted
    below.

    - unRaw (take control of keyboard back from X11,

    - tTerminate (send SIGTERM to all processes, allowing them to terminate gracefully),

    - kill (send SIGILL to all processes, forcing them to terminate immediately),

    - Sync (flush data to disk),

    - Unmount (remount all filesystems read-only),

    - reBoot.


    # Chapter 10: Apachectl and httpd Examples


    After you have installed Apache, if you want to use apachectl and httpd to its
    maximum potential, you should go beyond using start, stop and restart. Practical
    examples provided in this chapter will help you to use apachectl and httpd effectively.
    Apachectl acts as SysV init script, taking arguments like start, stop and status.
    It also acts as front-end to httpd by simply passing the command line arguments
    to httpd. So, all the commands you execute using apachectl can also be executed
    directly by calling httpd. If you do not have Apache, refer to the tutorials:
    install apache from source or install LAMP stack using yum.


    # Hack 76. Pass different httpd.conf to apachectl


    Typically you''ll modify the original httpd.conf to try out different directives.
    If something doesn''t work, you''ll revert back the changes. Instead of playing
    around with the original httpd.conf, copy it to a new httpd.conf.debug and use
    this new httpd.conf.debug file with Apache for testing purpose as shown below.


    ```

    # apachectl -f conf/httpd.debug

    # httpd -k start -f conf/httpd.debug

    ```

    [Note: you can use either apachectl or httpd as shown above]

    ```

    # ps -ef | grep httpd

    ```

    [Note: ps shows httpd running with httpd.conf.debug] Once you are satisfied with
    the changes and Apache runs without any problem with httpd.conf.debug, you can
    copy the changes to httpd.conf and start Apache normally as shown below.

    ```

    # cp httpd.conf.debug httpd.conf

    # apachectl stop

    # apachectl start

    # ps -ef | grep httpd

    ```

    [Note: ps indicates that the httpd is running using the default file]


    # Hack 77. Use a temporary DocumentRoot without modifying httpd.conf


    This is very helpful when you are trying out different layout for your website
    and don''t want to modify the original files under the default DocumentRoot. Take
    a copy of your original DocumentRoot directory (/var/www/html) to a new temporary
    DocumentRoot directory (/var/www/html_debug). Make all your changes under this
    temporary DocumentRoot directory (/var/www/html_debug) and start the Apache with
    this temporary directory as shown below using option -c.


    ```

    # apachectl -k -c "DocumentRoot /var/www/html_debug/"

    ```

    If you want to go back to original configuration using the default DocumentRoot
    (/var/www/html), simply restart the Apache as shown below.

    ```

    # apachectl -k stop

    # apachectl start

    ```


    # Hack 78. Increase the Log Level temporarily


    While you are debugging an issue, you can change the LogLevel of the Apache temporarily
    without modifying the LogLevel directive in the httpd.conf as shown below using
    option -e. In this example, the LogLevel is set to debug.


    ```

    # apachectl -k start -e debug

    [Sun Aug 17 13:53:06 2008] [debug] mod_so.c(246): loaded module auth_basic_module

    [Sun Aug 17 13:53:06 2008] [debug] mod_so.c(246): loaded module auth_digest_module

    ```

    Possible values you can pass to option -e are:

    - debug

    - info

    - notice

    - warn

    - error

    - crit

    - alert

    - emerg


    # Hack 79. Display the modules inside Apache


    # Display the modules compiled inside Apache


    Display the modules compiled inside Apache:

    ```

    # httpd -l

    ```

    Compiled in modules:

    ```

    core.c

    prefork.c

    http_core.c

    mod_so.c

    ```


    # Display both static and dynamic module loaded by Apache


    When you pass option -l to httpd, it will display only the static modules. Passing
    option -M will display both static and shared modules shown below.


