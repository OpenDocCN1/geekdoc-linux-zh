    \  tue) echo \"Tuesday\";\n    wed) echo \"Wednesday\";\n    exit) exit;\n  esac\n\
    done\n\n```\nramesh@dev-db ~> ./ps3.sh\n1) mon\n2) tue\n3) wed\n4) exit\nSelect\
    \ a day (1-4): 1\nMonday\nSelect a day (1-4): 4\n```\n\n[Note: This displays the\
    \ modified \"Select a day (1-4):\" for select command prompt]\n\n## Hack 32. PS4\
    \ - Used by \"set -x\" to prefix tracing output\n\nThe PS4 shell variable defines\
    \ the prompt that gets displayed, you execute a shell script in debug mode as\
    \ shown below.\n\n### Shell script and output WITHOUT PS4:\n\n```\nramesh@dev-db\
    \ ~> cat ps4.sh\nset -x\necho \"PS4 demo script\"\nls -l /etc/ | wc -l\ndu -sh\
    \ ~\nramesh@dev-db ~ ./ps4.sh\n++ echo 'PS4 demo script'\nPS4 demo script\n++\
    \ ls -l /etc/\n++ wc -l\n243\n++ du -sh /home/ramesh\n48K/home/ramesh\n```\n\n\
    [Note: This displays the default \"++\" while tracing the output using set -x]\n\
    \n### Shell script and output WITH PS4:\n\nThe PS4 defined below in the ps4.sh\
    \ has the following two codes:\n\n- $0 - indicates the name of script\n- $LINENO\
    \ - displays the current line number within the script\n\n```\nramesh@dev-db ~>\
    \ cat ps4.sh\nexport PS4=$0.$LINENO '\nset -x\necho \"PS4 demo script\"\nls -l\
    \ /etc/ | wc -l\ndu -sh ~\nramesh@dev-db ~ ./ps4.sh\n../ps4.sh.3+ echo 'PS4 demo\
    \ script'\nPS4 demo script\n```\n\n```\n../ps4.sh.4+ ls -l /etc/\n```\n\n```\n\
    ../ps4.sh.4+ wc -l\n243\n../ps4.sh.5+ du -sh /home/ramesh\n48K/home/ramesh\n```\n\
    \n[Note: This displays the modified \"{script-name}.{line-number}\"+ while tracing\
    \ the output using set -x]\n\n## Hack 33. PROMPT_COMMAND\n\nBash shell executes\
    \ the content of the PROMPT_COMMAND just before displaying the PS1 variable.\n\
    \n```\nramesh@dev-db -> export PROMPT_COMMAND=\"date +%H:%M:%M:%S\"\n22:08:42\n\
    ramesh@dev-db ~ ~\n```\n\n[Note: This displays the PROMPT_COMMAND and PS1 output\
    \ on different lines]\n\nIf you want to display the value of PROMPT_COMMAND in\
    \ the same line as the PS1, use the echo -n as shown below.\n\n```\nramesh@dev-db\
    \ -> export PROMPT_COMMAND=\"echo -n $(date +%H:%M:%M:%S)\"\n[22:08:51]ramesh@dev-db\
    \ ~\n```\n\n[Note: This displays the PROMPT_COMMAND and PS1 output on the same\
    \ line]\n\n# Linux Hack\n\nAjay Kumar Tiwari\n\n## Chapter 6: Colorful and Functional\
    \ Prompt Using PS1\n\n## Hack 34. Display username, hostname and basename of directory\
    \ in the prompt\n\nThe PS1 in this example displays following three information\
    \ in the prompt:\n\n- \\u – Username\n- \\h – Hostname\n- \\W – Base name of the\
    \ current working directory\n\n```\n-bash-3.2 export PS1=\"\\u@\\h \\W\"\nramesh@dev-db\
    \ ~> cd /etc/mail\nramesh@dev-db mail>\n```\n\n## Hack 35. Display current time\
    \ in the prompt\n\nIn the PS1 environment variable, you can directly execute any\
    \ Linux command, by specifying in the format $(date). In the following example,\
    \ the command $(date) is executed to display the current time inside the prompt.\n\
    \n```\nramesh@dev-db ~> export PS1=\"\\u@\\h [\\date +%H:%M:%S]\"\nramesh@dev-db\
    \ [09:56]>\n```\n\nYou can also use \\t to display the current time in hh:mm:ss\
    \ format as shown below:\n\n```\nramesh@dev-db ~> export PS1=\"\\u@\\h [\\t]\"\
    \nramesh@dev-db [42:55]>\n```\n\nYou can also use \\T to display the current time\
    \ in am/pm format shown below:\n\n```\nramesh@dev-db ~> export PS1=\"\\u@\\h [\\\
    T]\"\nramesh@dev-db [04:12 PM]>\n```\n\n## Hack 36. Display output of any command\
    \ in the prompt\n\nYou can display output of any Linux command in the prompt.\
    \ The following example displays three items separated by | (pipe) in the prompt:\n\
    \n- \\h: hostname\n- \\$kernel_version: The output of uname -r command\n- \\$?:\
    \ Status of last command\n\n```\nkernel_version=$(uname -r)\nramesh@dev-db ~ export\
    \ PS1=\"\\|\\h|$kernel_version|\\$\"\nramesh@dev-db|2.6.9-64|#\n```\n\n## Hack\
    \ 37. Change foreground color of the prompt\n\nDisplay prompt in blue color, along\
    \ with username, host and current directory information.\n\n```\nramesh@dev-db\
    \ ~> export PS1=\"\\e[34m\\u@\\h \\w\"\nramesh@dev-db ~>\n```\n\n```\nramesh@dev-db\
    \ ~> export PS1=\"\\e[1;34m\\u@\\h \\w\"\nramesh@dev-db ~>\n```\n\n- \\e indicates\
    \ the beginning of prompt\n- \\e[code indicates color code\n- \\e indicates the\
    \ end of prompt\n\n### Color Table:\n\n| Color | Code |\n| :--- | :--- |\n| Black\
    \ | 0;30 |\n| Blue | 0;34 |\n| Green | 0;32 |\n| Cyan | 0;36 |\n| Red | 0;31 |\n\
    | Purple | 0;35 |\n| Brown | 0;33 |\n\nReplace 0 with 1 for dark color. Make the\
    \ color permanent by adding the following lines to your ~/.bash_profile or ~/.bashrc:\n\
    \n```bash\nSTARTCOLOR='\\e[0;34m'\nENDCOLOR='\\e[0m'\n```\n\n## Hack 38. Change\
    \ background color of the prompt\n\nChange the background color by specifying\
    \ [code]m in the PS1 prompt as shown below:\n\n```\nramesh@dev-db ~> export PS1=\"\
    \\e[47m\\u@\\h \\w\"\nramesh@dev-db ~>\n```\n\n[Note: This is for Gray background]\n\
    \nCombination of background and foreground.\n\n```\nramesh@dev-db ~> export PS1=\"\
    \\e[0;34m\\e[47m\\u@\\h \\w\"\nramesh@dev-db ~>\n```\n\n[Note: This is for Blue\
    \ foreground and Gray background]\n\nAdd the following to your ~/.bash_profile\
    \ or ~/.bashrc to make the above background and foreground color permanent:\n\n\
    ```\nSTARTFGCOLOR='\\e[0;34m'\nSTARTBGCOLOR='\\e[47m'\nENDCOLOR='\\e[0m'\nexport\
    \ PS1=\"$STARTFGCOLOR$STARTBGCOLOR\\u@\\h \\w$ENDCOLOR\"\n```\n\nPlay around using\
    \ the following background color and choose the one that match your taste:\n\n\
    - 0;41\n- 0;42\n- 0;43\n- 0;44\n- 0;45\n- 0;46\n- 0;47\n\n## Hack 39. Display\
    \ multiple colors in the prompt\n\nYou can also display multiple colors in the\
    \ same prompt. Add the following function to your ~/.bash_profile:\n\n```bash\n\
    function prompt {\n  local BLUE=\"\\[033;34m\"\n  local DARK_BLUE=\"\\[033;1;34m\"\
    \n  local RED=\"\\[033;0;31m\"\n  local DARK_RED=\"\\[033;1;31m\"\n  local NO_COLOR=\"\
    \\[033;0m\"\n  case $xterm* in\n    rxvt*)\n      TITLEBAR=\"\\[033]0;\\u@\\h:\\\
    w\\007\"\n      TITLEBAR=\"\"\n      ;;\n  esac\n  PS1=\"${TITLEBAR}\\u@\\h [t]\
    \ >${BLUE}\\u@\\h $RED[t]>$NO_COLOR \"\n  PS2='continue-> '\n  PS4='$0.$LINENO+'\n\
    }\n```\n\nYou can re-login for the changes to take effect or source the .bash_profile\
    \ as shown below.\n\n```\n$ ./bash_profile\n$ prompt\nramesh@dev-db [13:02:13]\n\
    ```\n\n## Hack 40. Change the prompt color using tput\n\nYou can also change color\
    \ of the PS1 prompt using tput as shown below:\n\n```\n$ export PS1=\"$(tput bold)$(tput\
    \ setb 4)(tput setaf 7)\\u@\\h: w $(tput sgr0)\"\n```\n\ntput Color Capabilities:\n\
    - tput setab [1-7] - Set a background color using ANSI escape\n- tput setb [1-7]\
    \ - Set a background color\n- tput setaf [1-7] - Set a foreground color using\
    \ ANSI escape\n- tput setf [1-7] - Set a foreground color\n\ntput Text Mode Capabilities:\n\
    - tput bold - Set bold mode\n- tput dim - turn on half-bright mode\n- tput smul\
    \ - begin underline mode\n- tput rmul - exit underline mode\n- tput rev - Turn\
    \ on reverse mode\n"
  mdcn: "\n\n# Linux 技巧\n\nAjay Kumar Tiwari\n\n当我使用 `\\` 将我的长命令拆分成多行时，我发现这非常有帮助且易于阅读。我也看到过其他人不喜欢拆分长命令。\n\
    \n## 技巧 31. PS3 - Shell 脚本内部“select”命令使用的提示符\n\n你可以如下文所示，使用 PS3 环境变量为 shell 脚本中的\
    \ `select` 循环定义自定义提示符。\n\n### 不使用 PS3 的 Shell 脚本和输出：\n\n```\nramesh@dev-db ~>\
    \ cat ps3.sh\nselect i in mon tue wed exit\ndo\n  case $i in\n    mon) echo \"\
    Monday\";\n    tue) echo \"Tuesday\";\n    wed) echo \"Wednesday\";\n    exit;\n\
    \  esac\ndone\nramesh@dev-db ~> ./ps3.sh\n1) mon\n2) tue\n3) wed\n4) exit\n#?\
    \ 1\nMonday\n#? 4\n```\n\n[注：这显示了 select 命令提示符默认的 \"#\"]\n\n# Linux 技巧\n\nAjay\
    \ Kumar Tiwari\n\n### 使用 PS3 的 Shell 脚本和输出：\n\n```\nramesh@dev-db ~> cat ps3.sh\n\
    ps3=\"Select a day (1-4):\"\nselect i in mon tue wed exit\ndo\n  case $i in\n\
    \    mon) echo \"Monday\";\n    tue) echo \"Tuesday\";\n    wed) echo \"Wednesday\"\
    ;\n    exit) exit;\n  esac\ndone\n\n```\nramesh@dev-db ~> ./ps3.sh\n1) mon\n2)\
    \ tue\n3) wed\n4) exit\nSelect a day (1-4): 1\nMonday\nSelect a day (1-4): 4\n\
    ```\n\n[注：这显示了修改后的 select 命令提示符 \"Select a day (1-4):\"]\n\n## 技巧 32. PS4 - \"\
    set -x\" 用于追踪输出的前缀\n\nPS4 shell 变量定义了当你在下所示以调试模式执行 shell 脚本时，所显示的提示符。\n\n### 不使用\
    \ PS4 的 Shell 脚本和输出：\n\n```\nramesh@dev-db ~> cat ps4.sh\nset -x\necho \"PS4 demo\
    \ script\"\nls -l /etc/ | wc -l\ndu -sh ~\nramesh@dev-db ~ ./ps4.sh\n++ echo 'PS4\
    \ demo script'\nPS4 demo script\n++ ls -l /etc/\n++ wc -l\n243\n++ du -sh /home/ramesh\n\
    48K/home/ramesh\n```\n\n[注：这在使用 set -x 追踪输出时显示默认的 \"++\"]\n\n### 使用 PS4 的 Shell\
    \ 脚本和输出：\n\n在 ps4.sh 中定义的 PS4 包含以下两个代码：\n\n- $0 - 表示脚本名称\n- $LINENO - 显示脚本中的当前行号\n\
    \n```\nramesh@dev-db ~> cat ps4.sh\nexport PS4=$0.$LINENO '\nset -x\necho \"PS4\
    \ demo script\"\nls -l /etc/ | wc -l\ndu -sh ~\nramesh@dev-db ~ ./ps4.sh\n../ps4.sh.3+\
    \ echo 'PS4 demo script'\nPS4 demo script\n```\n\n```\n../ps4.sh.4+ ls -l /etc/\n\
    ```\n\n```\n../ps4.sh.4+ wc -l\n243\n../ps4.sh.5+ du -sh /home/ramesh\n48K/home/ramesh\n\
    ```\n\n[注：这在使用 set -x 追踪输出时显示修改后的 \"{script-name}.{line-number}\"+] \n\n## 技巧\
    \ 33. PROMPT_COMMAND\n\nBash shell 在显示 PS1 变量之前会执行 PROMPT_COMMAND 的内容。\n\n```\n\
    ramesh@dev-db -> export PROMPT_COMMAND=\"date +%H:%M:%M:%S\"\n22:08:42\nramesh@dev-db\
    \ ~ ~\n```\n\n[注：这在不同行上显示 PROMPT_COMMAND 和 PS1 的输出]\n\n如果你想在与 PS1 相同的行显示 PROMPT_COMMAND\
    \ 的值，可以使用下所示的 `echo -n`。\n\n```\nramesh@dev-db -> export PROMPT_COMMAND=\"echo\
    \ -n $(date +%H:%M:%M:%S)\"\n[22:08:51]ramesh@dev-db ~\n```\n\n[注：这在同一行上显示 PROMPT_COMMAND\
    \ 和 PS1 的输出]\n\n# Linux 技巧\n\nAjay Kumar Tiwari\n\n## 第 6 章：使用 PS1 创建彩色且功能提示符\n\
    \n## 技巧 34. 在提示符中显示用户名、主机名和目录基\n\n此示例中的 PS1 在提示符中显示以下三个信息：\n\n- \\u – 用户名\n- \\\
    h – 主机名\n- \\W – 当前工作目录的基\n\n```\n-bash-3.2 export PS1=\"\\u@\\h \\W\"\nramesh@dev-db\
    \ ~> cd /etc/mail\nramesh@dev-db mail>\n```\n\n## 技巧 35. 在提示符中显示当前时间\n\n在 PS1\
    \ 环境变量中，你可以通过指定格式 $(date) 直接执行任何 Linux 命令。在下面的示例中，执行命令 $(date) 以在提示符内部显示当前时间。\n\
    \n```\nramesh@dev-db ~> export PS1=\"\\u@\\h [\\date +%H:%M:%S]\"\nramesh@dev-db\
    \ [09:56]>\n```\n\n你也可以使用 `\\t` 以下所示的 hh:mm:ss 格式显示当前时间：\n\n```\nramesh@dev-db\
    \ ~> export PS1=\"\\u@\\h [\\t]\"\nramesh@dev-db [42:55]>\n```\n\n你还可以使用 `\\T`\
    \ 以下所示的 am/pm 格式显示当前时间：\n\n```\nramesh@dev-db ~> export PS1=\"\\u@\\h [\\T]\"\n\
    ramesh@dev-db [04:12 PM]>\n```\n\n## 技巧 36. 在提示符中显示命令的输出\n\n你可以在提示符中显示任何 Linux\
    \ 命令的输出。下面的示例在提示符中使用 |（管道）分隔了三个项目：\n\n- \\h: 主机名\n- \\$kernel_version: uname -r\
    \ 命令的输出\n- \\$?: 命令的状态\n\n```\nkernel_version=$(uname -r)\nramesh@dev-db ~ export\
    \ PS1=\"\\|\\h|$kernel_version|\\$\"\nramesh@dev-db|2.6.9-64|\n```\n\n## 技巧 37.\
    \ 修改提示符的前颜色\n\n以蓝色显示提示符，并带有用户名和主机信息。\n\n```\nramesh@dev-db ~> export PS1=\"\\\
    e[34m\\u@\\h \\w\"\nramesh@dev-db ~>\n```\n\n```\nramesh@dev-db ~> export PS1=\"\
    \\e[1;34m\\u@\\h \\w\"\nramesh@dev-db ~>\n```\n\n- \\e 表示提示符的开始\n- \\e[code 表示颜色代码\n\
    - \\e 表示提示符的结束\n\n### 颜色表：\n\n| 颜色 | 代码 |\n| :--- | --- |\n| 黑色 | 0;30 |\n| 蓝色\
    \ | 0;34 |\n| 绿色 | 0;32 |\n| 青色 | 0;36 |\n| 红色 | 0;31 |\n| 紫色 | 0;35 |\n| 棕色 |\
    \ 0;33 |\n\n将 0 替换为 1 用于深色。通过向 ~/.bash_profile 添加以下行来使颜色永久化：\n\n```bash\nSTARTCOLOR='\\\
    e[0;34m'\nENDCOLOR='\\e[0m'\n```\n\n## 技巧 38. 修改提示符的背景颜色\n\n通过在 PS1 提示符中指定 [code]m\
    \ 来修改背景颜色，如下：\n\n```\nramesh@dev-db ~> export PS1=\"\\e[47m\\u@\\h \\w\"\nramesh@dev-db\
    \ ~>\n```\n\n[注：这是灰色背景]\n\n背景和前景的组合。\n\n```\nramesh@dev-db ~> export PS1=\"\\\
    e[0;34m\\e[47m\\u@\\h \\w\"\nramesh@dev-db ~>\n```\n\n[注：这是蓝色前景和灰色背景]\n\n向你的 ~/.bash_profile\
    \ 或 ~/.bashrc 添加以下内容使上述背景和前景颜色永久化：\n\n```\nSTARTFGCOLOR='\\e[0;34m'\nSTARTBGCOLOR='\\\
    e[47m'\nENDCOLOR='\\e[0m'\nexport PS1=\"$STARTFGCOLOR$STARTBGCOLOR\\u@\\h \\w$ENDCOLOR\"\
    \n```\n\n使用以下背景颜色进行尝试并选择符合你口味的：\n\n- 0;41\n- 0;42\n- 0;43\n- 0;44\n- 0;45\n- 0;46\n\
    - 0;47\n\n## 技巧 39. 在提示符中显示多种颜色\n\n你也可以在同一提示符中显示多种颜色。向 ~/.bash_profile 添加以下函数：\n\
    \n```bash\nfunction prompt {\n  local BLUE=\"\\[033;34m\"\n  local DARK_BLUE=\"\
    \\[033;1;34m\"\n  local RED=\"\\[033;0;31m\"\n  local DARK_RED=\"\\[033;1;31m\"\
    \n  local NO_COLOR=\"\\[033;0m\"\n  case $xterm* in\n    rxvt*)\n      TITLEBAR=\"\
    \\[033]0;\\u@\\h:\\w\\007\"\n      TITLEBAR=\"\"\n      ;;\n  esac\n  PS1=\"${TITLEBAR}\\\
    u@\\h [t] >${BLUE}\\u@\\h $RED[t]>$NO_COLOR \"\n  PS2='continue-> '\n  PS4='$0.$LINENO+'\n\
    }\n```\n\n你可以重新登录使更改生效，或者像下所示 source .bash_profile。\n\n```\n$ ./bash_profile\n\
    $ prompt\nramesh@dev-db [13:02:13]\n```\n\n## 技巧 40. 使用 tput 修改提示符颜色\n\n你也可以像下所示，使用\
    \ tput 修改 PS1 提示符的颜色：\n\n```\n$ export PS1=\"$(tput bold)$(tput setb 4)(tput setaf\
    \ 7)\\u@\\h: w $(tput sgr0)\"\n```\n\ntput 颜色能力：\n- tput setab [1-7] - 使用 ANSI\
    \ 转义设置背景\n- tput setb [1-7] - 设置背景色\n- tput setaf [1-7] - 使用 ANSI 转义设置前景\n- tput\
    \ setf [1-7] - 设置前景\n\ntput 文本模式能力：\n- tput bold - 设置加粗模式\n- tput dim - 开启半亮模式\n\
    - tput smul - 开始下划线模式\n- tput rmul - 退出下划线模式\n- tput rev - 开启反色模式\n\n"
