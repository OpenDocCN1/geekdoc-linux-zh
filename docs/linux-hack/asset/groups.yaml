    # Chapter 9: System Administration Tasks


    ## Hack 65. Partition using fdisk


    After you''ve installed brand new disks on your server, you have to use tools
    like fdisk to partition it accordingly.

    Following are the 5 typical actions (commands) that you can execute inside fdisk.


    - n: New Partition creation

    - d: Delete an existing partition

    - p: Print Partition Table

    - w: Write the changes to the partition table. i.e save.

    - q: Quit the fdisk utility


    ### Create a partition


    In the following example, I created a /dev/sda1 primary partition.


    ```bash

    # fdisk /dev/sda

    Device contains neither a valid DOS partition table, or Sun, SGI or OSF disklabel.
    Building a new DOS disklabel. Changes will remain in memory only, until you decide
    to write them. After that, of course, the previous content won''t be recoverable.

    The number of cylinders for this disk is set to 34893.

    There is nothing wrong with that, but this is larger than 1024, and could in certain
    setups cause problems with:

