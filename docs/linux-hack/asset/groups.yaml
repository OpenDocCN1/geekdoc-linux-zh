    # Linux Hack


    Ajay Kumar Tiwari


    # Chapter 1: Powerful CD Command

    Hacks


    cd is one of the most frequently used commands during a UNIX session.

    The 6


    cd command hacks mentioned in this chapter will boost your productivity instantly
    and make it easier to navigate the directory structure from command line.


    # Hack 1. Use CDPATH to define the base directory for cd command


    If you are frequently performing cd to subdirectories of a specific parent directory,
    you can set the CDPATH to the parent directory and perform cd

    to


    the subdirectories without giving the parent directory path as explained below.


    ```

    [ramesh@dev-db ~]# pwd

    /home/ramesh

    [ramesh@dev-db ~]# cd mail

    -bash: cd: mail: No such file or directory

    ```


    > [Note: This is looking for mail directory under current directory]


    ```

    [ramesh@dev-db ~]# export CDPATH=/etc

    [ramesh@dev-db ~]# cd mail

    /etc/mail

    ```


    > [Note: This is looking for mail under /etc and not current directory]


    ```

    [ramesh@dev-db /etc/mail]# pwd

    /etc/mail

    ```


    To make this change permanent, add export CDPATH=/etc to your

    ~/.bash_profile


    9'
  - '[PAGE 10]


    # Linux Hack


    Ajay Kumar Tiwari

    Similar to the PATH variable, you can add more than one directory entry in

    the CDPATH variable, separating them with : , as shown below.

    export CDPATH=.:~/etc/var

    This hack can be very helpful under the following

    situations:


    +   - Oracle DBAs frequently working under $ORACLE_HOME, can set

    the CDPATH variable to the oracle home

    - Unix sysadmins frequently working under /etc, can set

    the CDPATH variable to /etc

    - Developers frequently working under project directory

    /home/projects, can set the CDPATH variable to /home/projects

    - End-users frequently accessing the subdirectories under

    the directory, can set the CDPATH variable to ~ (home directory)


    # Hack 2. Use cd alias to navigate up the directory effectively


    When you are navigating a very long directory structure, you may be using

    cd ..\.. with multiple ..\s depending on how many directories you want to go

    u as shown below.


    ```

    # mkdir -p

    /tmp/very/long/directory/structure/that/is/too/deep

    # cd /tmp/very/long/directory/structure/that/is/too/deep

    # pwd

    /tmp/very/long/directory/structure/that/is/too/deep

    # cd ../../../

    ```'
  - '[PAGE 11]


    # Linux Hack


    # pwd

    /tmp/very/long/directory/structure

    Ajay Kumar Tiwari


    Instead of executing cd ../../../ to navigate four levels up, use one of the following
    three alias methods:


    # Method 1: Navigate up the directory using ..

    "


    ```

    alias

    alias

    alias

    alias

    alias

    ..="cd .."

    ..2="cd ../.."

    ..3="cd ../../"

    ..4="cd ../../../"

    ..5="cd ../../../.."

    # cd

    /tmp/very/long/directory/structure/that/is/too/deep

    # ..4

    [Note: use ..4 to go up 4 directory level]

    # pwd

    /tmp/very/long/directory/structure/

    ```


    # Method 2: Navigate up the directory using only dots


    In the example below, ..... (five dots) is used to go up 4 directory level. Typing
    5 dots to go up 4 directory structure is really easy to remember, when you type
    the first two dots, you are thinking "going up one directory", after that every
    additional dot, is to go one level up. So, use .... (four dots) to


    go up 3 directory level and .. (two dots) to go up 1 directory level. Add the
    following alias to your ~/.bash_profile and re-login for the ..... (five dots)
    to'
- md: '

    work properly.

    alias ..="cd .."


    # Linux Hack


    ```

    alias

    alias

    alias

    alias

    ...="cd ../"

    ....="cd ../.."

    .....="cd ../../

    ......="cd ../"

    ```


    Ajay Kumar Tiwari


    ```

    # /tmp/very/long/directory/structure/that/is/too/deep

    # .....

    ```


    > [Note: use .... (five dots) to go up 4 directory level]


    ```

    # pwd

    /tmp/very/long/directory/structure/

    ```


    # Method 3: Navigate the directory using cd followed by consecutive dots


    In the example below, cd..... (cd followed by five dots) is used to go up 4 directory
    level. Making it 5 dots to go up 4 directory structure is really easy to remember,
    as you type the first two dots, you are thinking "going up one directory", after
    every additional dot, is to go one level up. So, use cd.... (cd followed by four
    dots) to go up 3 directory level and cd... (cd followed by three dots) to go up
    2 directory level. Adding the following alias to ~/.bash_profile and re-login
    for the above cd..... (five dots) to work properly.


    ```

    alias

    alias

    alias

    alias

    alias

    cd..="cd .."

    cd...="cd ../"

    cd....="cd ../../"

    cd.....="cd ../../../"

    ```


    ```

    cd......="cd ../../../../../"

    # cd /tmp/very/long/directory/structure/that/is/too/deep

    # cd......

    [Note: use cd...... to go up 4 directory level]

    # pwd

    /tmp/very/long/directory/structure

    ```


    # Linux Hack


    Ajay Kumar Tiwari


    # Method 5: Navigate the directory using cd followed by number


    In the example below, cd4 (cd followed by number 4) is used to go up 4 directory
    level.


    ```

    alias

    alias

    alias

    alias

    alias

    cd1="cd"

    cd2="cd"

    cd3="cd"

    cd4="cd"

    cd5="cd"

    ".."

    ../"

    ../../.."

    ../../../../.."

    ../../../../.."

    ../../../../../../"

    ```


    # Hack 3. Perform mkdir and cd using a single command


    Sometimes when you create a new directory, you may cd to the new directory immediately
    as shown below.


    ```

    # mkdir -p /tmp/subdir1/subdir2/subdir3

    # cd /tmp/subdir1/subdir2/subdir3

    # pwd

    /tmp/subdir1/subdir2/subdir3

    ```


    Wouldn''t it be nice to combine both mkdir and cd in a single command? Add the
    following to the .bash_profile and re-login.


    ```bash

    $ vi .bash_profile

    function mkdircd() { mkdir -p "$@" && eval cd "\$\$@\"\#\"; }

    ```


    Now, perform both mkdir and cd at the same time using single command as shown
    below:


    # Linux Hack


    # mkdircd /tmp/subdir1/subdir2/subdir3

    Ajay Kumar Tiwari


    > [Note: This creates the directory and cd to it automatically]


    ```

    # pwd

    /tmp/subdir1/subdir2/subdir3

    ```


    # Hack 4. Use "cd -" to toggle between the last two directories


    You can toggle between the last two current directories using cd - shown below.


    ```bash

    # cd /tmp/very/long/directory/structure/that/is/too/deep

    # cd /tmp/subdir1/subdir2/subdir3

    # cd -

    # pwd

    /tmp/very/long/directory/structure/that/is/too/deep

    # cd -

    # pwd

    /tmp/subdir1/subdir2/subdir3

    # cd -

    # pwd

    /tmp/very/long/directory/structure/that/is/too/deep

    ```


    # Hack 5. Use dirs, pushhd and popd to manipulate directory stack


    You can use directory stack to push directories into it and later pop directory
    from the stack. Following three commands are used in this example.


    # Linux Hack


    - dirs: Display the directory stack

    - pushd: Push directory into the stack

    - popd: Pop directory from the stack and cd to it


    Ajay Kumar Tiwari


    Dirs will always print the current directory followed by the content of the stack.
    Even when the directory stack is empty, dirs command will still print only the
    current directory as shown below.


    ```bash

    # popd

    -bash: popd: directory stack empty

    ~


    # pwd

    /home/ramesh

    ```


    How to use pushd and popd? Let us first create some temporary directories and
    push them to the directory stack as shown below.


    ```bash

    # mkdir

    mkdir

    mkdir

    mkdir

    /tmp/dir1

    /tmp/dir2

    /tmp/dir3

    /tmp/dir4

    # cd /tmp/dir1

    # pushd .

    # cd /tmp/dir2

    # pushd .

    # cd /tmp/dir3

    # pushd .

    # cd /tmp/dir4

    # pushd .

    ```


    # Linux Hack


    Ajay Kumar Tiwari


    ```bash

    # dirs

    /tmp/dir4 /tmp/dir4 /tmp/dir3 /tmp/dir2 /tmp/dir1

    ```


    > [Note: The first directory (/tmp/dir4) of the dirs command is always the current
    directory and not the content from the stack.]


    At this stage, the directory stack contains following:

    - /tmp/dir4

    - /tmp/dir3

    - /tmp/dir2

    - /tmp/dir1


    The last directory that was pushed to the stack will be at the top. When you perform
    popd, it will cd to the top directory in the stack and remove it from the stack.
    As shown above, the last directory that was pushed into the stack is /tmp/dir4.
    So, when we do popd, it will cd to the /tmp/dir4 and remove it from the directory
    stack.


    ```bash

    # popd

    # pwd

    /tmp/dir4

    ```


    > [Note: After popd, directory Stack Contains:

    - /tmp/dir3

    - /tmp/dir2

    - /tmp/dir1


    ```bash

    # popd

    # pwd

    /tmp/dir3

    ```


    > [Note: After popd, directory Stack Contains:

    - /tmp/dir2

    - /tmp/dir1


    ```bash

    # popd

    # pwd

    /tmp/dir2

    ```


    > [Note: After popd, directory Stack Contains:

    - /tmp/dir1


    ```bash

    # popd

    # pwd

    /tmp/dir1

    ```


    > [Note: After popd, directory Stack is empty!]


    # Linux Hack


    # Hack 6. Use "alias -spell" to automatically correct mistyped directory names


    Use alias -spell to correct the typos in cd command automatically as shown below.
    If you are not good at typing and make lot of mistakes, this be very helpful.


    ```bash

    # cd /etc/mall

    -bash: /etc/mall: No such file or directory

    # alias -spell

    cd /etc/mail

    # pwd

    /etc/mail

    ```


    > [Note: By mistake, when I typed mall instead of mail, alias corrected it]


    # Linux Hack


    # Chapter 2: Date Manipulation


    # Hack 7. Set System Date and Time


    To change the system date use:


    ```

    # date {mmddhhmmss}

    ```

    - mm: Month

    - dd: Date

    - hh: 24 hour format

    - mi: Minutes

    - yyyy: Year

    - ss: seconds


    For example, to set system date to Jan 31st 2008, 10:19:53 seconds you can also
    change system date using argument as shown below.


    ```bash

    # date 013122192009.53

    # date +Y%m%d -s "20090131"

    # date -s "01/31/2009 22:19:53"

    # date -s "31 JAN 2009 22:19:53"

    # date set="31 JAN 2009 22:19:53"

    ```


    To set the time only:

    ```bash

    # date +%T -s "22:19:53"

    # date +%T%p -s "10:19:53PM"

    ```


    Ajay Kumar Tiwari


    # Hack 8. Set Hardware Date and Time


    Before setting the hardware date and time, make sure the OS date and time is set
    appropriately as shown in the hack #7.

    Set the hardware date and time based on the system date as shown below:


    ```bash

    # hwclock --systohc

    # hwclock --systohc --utc

    ```


    Use hwclock without any parameter, to view the current hardware date and time:

    ```bash

    # hwclock

    ```


    Check the clock file to verify whether the system is set for UTC:


    ```bash

    # cat /etc/sysconfig/clock

    ZONE="America/Los_Angeles"

    UTC=false

    ARC=false

    ```


    # Linux Hack


    # Hack 9. Display Current Date and Time in a Specific Format


    Following are different ways of displaying the current date and time in various
    formats:


    ```bash

    $ date

    Thu Jan 1 08:19:23 PST now

    $ date --date="now"

    Thu Jan 1 08:20:05 PST 2009

    $ date --date="today"

    Thu Jan 1 08:20:12 PST 2009

    $ date --date=''1970-01-01 00:00:00 UTC +5 hours'' -s 18001

    $ date ''+%m/%d/%y%nCurrent Time:%H:%M:%S''

    Current Date: 01/01/09

    Current Time: 08:21:41

    $ date +%d-%m-%Y

    01-01-2009

    $ date +%d/%m/%Y

    01/01/2009

    $ date +%A,%B %d %Y

    Thursday,January 01 2009

    ```


    Following are the different format options you can pass to the date command:


    - %D date (mm/dd/yy)

    - %d day of month (01..31)

    - %m month (01..12)

    - %y last two digits of year (00..99)

    - %a locale: abbreviated weekday name (Sun..Sat)

    - %A locale: full weekday name, variable length (Sunday..Saturday)

