    \ Date | |\n| Date | |\n| 2015 |\n\n# Linux Hack\n\nAjay Kumar Tiwari\n\n## Chapter\
    \ 1: Powerful CD Command Hacks\n\n- Use CDPATH to define the base directory for\
    \ cd command\n- cd alias to navigate up the directory effectively\n- Perform mkdir\
    \ and cd using a single command\n- Use \"cd -\" to toggle between the last two\
    \ directories\n- Use dirs, pushd and popd to manipulate directory stack\n- Use\
    \ \"shopt -s spell\" to automatically correct mistyped directory names on cd\n\
    \n## 1. Use CDPATH to define the base directory for cd command\n\nThe CDPATH variable\
    \ allows you to search multiple directories when using the `cd` command. When\
    \ you type `cd <directory>`, the shell will check the current directory first,\
    \ then the directories listed in CDPATH.\n\n```bash\nexport CDPATH=~/Documents:~/Projects:/var/www\n\
    ```\nWith this set, `cd myproject` will work even if you are not in `~/Projects/myproject`.\n\
    \n## 2. Use cd alias to navigate up the directory effectively\n\nInstead of typing\
    \ `cd ../` to go up multiple levels, you can define aliases to make navigation\
    \ much faster.\n\n```bash\nalias ..='cd ..'\n```\nNow you can simply type `..`\
    \ to go up one level.\n\n## 3. Perform mkdir and cd using a single command\n\n\
    You can create a directory and immediately enter it using a shell function.\n\n\
    ```bash\nmkcd() {\n    mkdir -p \"$1\" && cd \"$1\"\n}\n```\nNow `mkcd new_folder`\
    \ will create the folder and move into it.\n\n## 4. Use \"cd -\" to toggle between\
    \ the last two directories\n\nThe `cd -` command takes you to the previous directory.\
    \ This is incredibly useful for switching between two working locations.\n\n##\
    \ 5. Use dirs, pushd and popd to manipulate directory stack\n\n`pushd` adds a\
    \ directory to the stack, and `popd` removes it and returns you to the previous\
    \ one. `dirs` shows the current stack.\n\n```bash\npushd /var/log\npushd /etc\n\
    popd # returns to /var/log\n\n\n## 6. Use \"shopt -s spell\" to automatically\
    \ correct mistyped directory names on cd\n\nEnable the spell-check option to fix\
    \ small typos in directory names when using `cd`.\n\n```bash\nshopt -s spell\n\
    ```\n\n## Chapter 2: Date Manipulation\n\n- Set System Date and Time\n- Set Hardware\
    \ Date and Time\n- Display Current Date and Time in a Specific Format\n- Display\
    \ Future Date and Time\n\n## 1. Set System Date and Time\n\nUse the `date` command\
    \ to change the system clock (requires root).\n\n```bash\nsudo date -s \"2023-10-27\
    \ 10:00:00\"\n```\n\n## 2. Set Hardware Date and Time\n\nAfter setting the system\
    \ date, sync it with the hardware clock (RTC).\n\n```bash\nsudo hwclock --syst\n\
    ```\n\n## 3. Display Current Date and Time in a Specific Format\n\nUse the format\
    \ string with `date` to output exactly as needed.\n\n```bash\ndate \"+%Y-%m-%d\
    \ %H:%M:%S\"\n```\n\n## 4. Display Future Date and Time\n\nUse the `-d` flag to\
    \ see what the date will be in the future.\n\n```bash\ndate -d \"next week\"\n\
    ```\n\n## Chapter 3: SSH Client Commands\n\n- Identify SSH Client Version\n- Login\
    \ to Remote Host using SSH\n- Debug SSH Client Session\n- Toggle SSH Session using\
    \ SSH Escape Character\n- SSH Session Statistics using SSH Escape Character\n\n\
    ## 1. Identify SSH Client Version\n\nCheck the version of your installed SSH client.\n\
    \n```bash\nssh -V\n```\n\n## 2. Login to Remote Host using SSH\n\nStandard login\
    \ syntax.\n\n```bash\nssh user@remote_host\n```\n\n## 3. Debug SSH Client Session\n\
    \nUse verbose mode to see the handshake process.\n\n```bash\nssh -vvv user@remote_host\n\
    ```\n\n## 4. Toggle SSH Session using SSH Escape Character\n\nIf a session hangs,\
    \ press `~` followed by a character to execute an escape command (e.g., `.` to\
    \ disconnect, `i` for info).\n\n## 5. SSH Session Statistics using SSH Escape\
    \ Character\n\nTo see session statistics, press `~` followed by `$`.\n\n## Chapter\
    \ 4: Essential Linux Commands\n\n- Grep Command\n- Find Command\n- Suppress Standard\
    \ Output and Error Message\n- Join Command\n- Change the Case\n- Xargs Command\n\
    - Sort Command\n- Uniq Command\n- Cut Command\n- Stat Command\n- Diff Command\n\
    - Display total connect time of users\n\n## 1. Grep Command\n\nSearch for patterns\
    \ in files.\n\n```bash\ngrep \"pattern\" filename\n```\n\n## 2. Find Command\n\
    \nSearch for files based on attributes.\n\n```bash\nfind . -name \"filename.txt\"\
    \n```\n\n## 3. Suppress Standard Output and Error Message\n\nRedirect output to\
    \ `/dev/null`.\n\n```bash\ncommand > /dev/null 2>&1\n```\n\n## 4. Join Command\n\
    \nMerge lines of two files.\n\n```bash\njoin file1 file2\n```\n\n## 5. Change\
    \ the Case\n\nConvert text to uppercase or lowercase.\n\n```bash\necho \"hello\"\
    \ | tr '[:lower:]' '[:upper:]'\n```\n\n## 6. Xargs Command\n\nPass input as arguments\
    \ to another command.\n\n```bash\nfind . -name \"*.log\" | xargs rm\n```\n\n##\
    \ 7. Sort Command\n\nSort lines of files.\n\n```bash\nsort filename\n```\n\n##\
    \ 8. Uniq Command\n\nFilter out duplicate lines.\n\n```bash\nsort filename | uniq\n\
    ```\n\n## 9. Cut Command\n\nExtract columns from text.\n\n```bash\ncut -d: -f1\
    \ filename\n```\n\n## 10. Stat Command\n\nView file metadata.\n\n```bash\nstat\
    \ filename\n```\n\n## 11. Diff Command\n\nCompare files for changes.\n\n```bash\n\
    diff file1 file2\n```\n\n## 12. Display total connect time of users\n\nUse the\
    \ `w` command.\n\n```bash\nw\n```\n\n# Chapter 5: PS1, PS2, PS3, PS4 and PROMPT_COMMAND\n\
