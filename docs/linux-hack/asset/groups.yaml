    \ 0.0.0.0 LISTEN\ntcp0 0 0 0.0.0.0:4089 0.0.0.0 LISTEN\ntcp0 0 0 0.0.0.0:7621\
    \ 0.0.0.0 ESTABLISHED\n\n活动 UNIX 套接字\nProto Type RefCnt Size State Node\nunix\
    \ 2 0 STREAM /tmp/.font\nunix 2 0 STREAM /tmp/gdm_socket\nunix 2 0 STREAM /tmp/root\n\
    ```\n\n# 显示路由表\n\n```\n# netstat --route\n内核 IP 路由表\nDestination 目的 Gateway Iface\
    \ Genmask Flags\ndefault 192.168.1.1 0 eth0 255.255.255.0 U\n162.244.0.0 0 eth0\
    \ 255.255.255.0 UG\n192.168.1.0 0 eth0 255.255.255.0 U\n```\n\n# 显示 RAW 网络统计信息\n\
    \n```\n# netstat --statistics --raw\nIp:\n1108343 总接收包\n0 转发\n0 丢弃入站包\n1103744\
    \ 交付入站包\n1119763 发出请求包\nicmp:\n577135 接收 ICMP 消息\n64 ICMP 失败\nICMP 输入直方图:\n  不可达:\
    \ 537\n  超时: 65\n  源拥塞: 2\n  echo 请求: 576476\n  echo 回复: 12\n  timestamp 请求: 3\n\
    \  掩码请求: 3\n581558 接收 ICMP 消息\n0 ICMP 失败\nICMP 输出直方图:\n  不可达: 5079\n  echo 回复:\
    \ 576476\n  timestamp 回复: 3\n```\n\n# 其他 netstat 命令\n\n- netstat --tcp --numeric\
    \ 列出机器的 TCP 连接\n- netstat --tcp --programs 显示服务器监听的 TCP 端口以及监听该端口的程序\n- netstat\
    \ -rnC 显示路由缓存\n\n# 技巧 99. Sysctl 命令\n\n可以使用 `sysctl` 命令动态更改 Linux 内核参数。\n\n`sysctl`\
    \ 有助于在运行时配置 Linux 内核参数。\n\n```\n# sysctl -a\ndev.cdrom.autoclose = 1\nfs.quota.writes\
    \ = 0\nkernel.ctrl-alt-del = 0\nkernel.domainname = (none)\nkernel.exec-shield\
    \ = 1\nnet.core.somaxconn = 128\nnet.ipv4.tcp_window_scaling = 1\nnet.ipv4.tcp_wmem\
    \ = 409616384\nnet.ipv6.route.mtu expires = 600\nsunprpc.udp_slot_table_entries\
    \ = 16\nvm.block_dump = 0\n```\n\n# 修改 /etc/sysctl.conf 以实现永久更改\n\n在 `/etc/sysctl.conf`\
    \ 中修改内核参数后，执行 `sysctl -p` 来提交更改。重启后更改仍然有效。\n\n```\n# vi /etc/sysctl.conf\n# sysctl\
    \ -p\n```\n\n# 临时修改内核参数\n\n要临时修改内核参数，请执行以下命令。\n请注意，重启后这些更改将会丢失。\n\n```\n# sysctl\
    \ -w {variable-name=value}\n```\n\n# 技巧 100. Nice 命令\n\n内核根据 `nice` 值决定进程所需的处理器时间。`nice`\
    \ 取值范围为：-20 到 20。\n\n# 为脚本分配优先级（较高的 nice 值）\n\n在下面的示例中，当我在后台启动 `nice-test` 时，它取的\
    \ `nice` 值为 0。\n\n```\n$ ./nice-test &\n[1] 13009\n$ ps axl | grep nice-test\n\
    ```\n\n> 注意：6m 列的值 0 即为 nice 值。\n\n现在，让我们按照下所示所示执行具有不同 nice 值的相同脚本。\n\n```\n$\
    \ nice -10 ./nice-test &\n[1] 13016\n$ ps axl | grep nice-test\n```\n\n> 注意：6m\
    \ 列的值 10 即为该脚本的 nice 值。\n\n# 为脚本分配高优先级（较低的 nice 值）\n\n在以下示例中，我们为 `nice-test.sh`\
    \ 脚本分配了 -10（减 10）的 `nice` 值。\n\n注意：只有 root 用户才能设置负的 nice 值。请以 root 身份重试。请注意 nice\
    \ 命令中 10 前面有两个横杠。\n\n```\n$ nice --10 ./nice-test &\n[1] 13021\n$ nice: cannot\
    \ set priority: Permission denied\n```\n\n"
