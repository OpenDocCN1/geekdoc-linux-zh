    \ the PS1 variable.\n\n```bash\nramesh@dev-db ~ cat ~/bin/totalfilesize.sh\n```\n\
    \n```bash\nfor filesize in $(ls -l | grep \"^\\-\" | awk '{print $5}')\ndo\n \
    \ let totalsize=$totalsize+$filesize\ndone\necho -n \"$totalsize\"\n```\n\n```bash\n\
    ramesh@dev-db ~> export PATH=$PATH:~/bin\nramesh@dev-db ~> export PS1=\"\\u@\\\
    h\\n\\$(totalfiles.sh) bytes]\"\nramesh@dev-db [5534 bytes]> cd /etc/mail\nramesh@dev-db\
    \ [167997 bytes]>\n```\n\n[Note: This executes the totalfilesize.sh to display\
    \ the total file size of the current directory in the PS1 prompt]\n\n# Chapter\
