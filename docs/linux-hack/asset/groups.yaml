- md: "\n# View Processes Owned by a Particular User\n\nThe following command displays\
    \ all the process owned by Linux user-name:\n\n```\n$ ps U oracle\nPID TTY\n5014\
    \ ?\n7124 ?\n8206 ?\n8852 ?\n8854 ?\n8911 ?\nSTAT\nSs\nSs\nSs\nSs\nSs\nTIME COMMAND\n\
    0:01 /oracle/bin/tnlsnr\n0:00 ora_q002_med\n0:00 ora_cqj0_med\n0:01 ora_pmon_med\n\
    0:00 ora_psp0_med\n0:02 oracled (LOCAL=NO)\n```\n\n# View Processes Owned by Current\
    \ User\n\nFollowing command displays all the process owned by the current user.\n\
    \n```\n$ ps U $USER\nPID TTY\n10329 ?\n10330 pts/1\nSTAT\nS\nSs\n# TIME COMMAND\n\
    \n```\n0:00 sshd: ramesh@pts/1,pts/2\n```\n\n```\n0:00 -bash\n```\n\n10354 pts/2\n\
    10530 pts/1\nSs+\nR+\n0:00 -bash\n0:00 ps U Umesh\nAjay Kumar Tiwari\n\n# Hack\
    \ 92. Df Command\n\ndf command (disk free) displays the amount of total and free\
    \ disk space available on the mounted filesystems.\nSyntax: df [options] [name]\n\
    \n# How much GB of disk space is free on my system?\n\nUse df -h displays the\
    \ values in human readable format (for example: K for Kb, M for Mb and G for Gb).\
    \ In the same output below, / filesystem has 17GB of disk space available and\
    \ /home/user filesystem has 70GB available.\n\n```\n# df -h\n| Filesystem Size\
    \ Used Avail Use% Mounted |\n| --- --- --- --- --- --- |\n| /dev/sda1 | 64G |\
    \ 44G | 17G | 73% | / |\n| /dev/sdb1 | 137G | 67G | 0G | 49% | /home/user |\n\
    ```\n\n# What type of filesystem do I have on my system?\n\nOption -T will display\
    \ the information about the filesystem Type. In this example / and /home/user\
    \ filesystems are ext2. Option -a will display all the filesystems, including\
    \ the 0 size special filesystem used by the system.\n\n# df -Tha\n\n```\n| Filesystem\
    \ Type Size Used Avail Use% Mounted on |\n| --- --- --- --- --- --- |\n| /dev/sda1\
    \ | ext2 | 64G | 17G | 73% | / |\n| /dev/sdb1 | ext2 | 137G | 67G | 49% | /home/user\
    \ |\n| noneproproc00 | proc | | | | /proc |\n| noneysfs00 | sysfs | | | | /sys\
    \ |\n| nonedevpts00 | devpts | | | | /dev/pts |\n| nonetmpfs | tmpfs | 2.0G |\
    \ 2.0G | 0% | /dev/shm |\n```\n\n# Hack 93. Kill Command\n\nkill command can be\
    \ used to terminate a running process. Typically this command is used to kill\
    \ processes that are hanging and not responding.\nSyntax: kill [options] [pids][commands]\n\
    \n# How to kill a hanging process?\n\nFirst, identify the process id of the particular\
    \ process that you would like to kill using the ps command. Once you know the\
    \ process id, pass it as a parameter to the kill command. The example below shows\
    \ how to kill the hanging apache httpd process. Please note that typically you\
    \ should use \"apachectl stop\" to stop apache.\n\n```\n# ps aux | grep httpd\n\
    USERID %CPU %MEM VSZ RSS TTY STAT START TIME COMMAND\napache 31186 0.016 23736\
    \ 17556 ?S Jul26 0:40 /usr/local/apache2/bin/httpd\napache 31187 0.013 20640 14444\
    \ ?S Jul26 0:37 /usr/local/apache2/bin/httpd\n# kill 31186 31187\n```\n\n```\n\
    # kill -9 31186 31187\n```\n\nAnother way to kill multiple processes easily is\
    \ by adding the following two functions to .bash_profile.\n\n```bash\nfunction\
    \ psgrep ()\n  ps aux | grep \"$1\" | grep -v 'grep'\n}\nfunction pstern ()\n\
    \  [ $# -eq 0 ] && echo \"usage: $FUNCNAME STRING\" && return 0\n  local pid\n\
    \  pid=$(ps ax | grep \"$1\" | grep -v grep | awk '{ print $1 }')\n  echo -e \"\
    terminating '$1' / process(es):\\n$pid\"\n  kill -SIGTERM $pid\n}\n```\n\nNow\
    \ do to the following, to identify and kill all httpd processes.\n\n| USER COMMAND\
    \ |\n| --- --- |\n| apache | Jul26 |\n| apache | Jul26 |\n| PID %CPU %MEM |\n\
    | 31186 | 0:40 | 31187 | 0:37 |\n\n```\n| PID %CPU %MEM VSZ RSS TTY STAT START\
    \ TIME COMMAND |\n| --- --- --- --- --- --- --- --- --- |\n| 31186 0.016 23736\
    \ 17556 ?S Jul26 0:40 /usr/local/apache2/bin/httpd |\n| 31187 0.013 20640 14444\
    \ ?S Jul26 0:37 /usr/local/apache2/bin/httpd |\n```\n\n# pterm 'httpd' / process(es):\n\
    31186\n31187\n\n# Hack 94. Du Command\n\ndu command (disk usage) will print the\
    \ space usage for a particular directory and its subdirectories.\n\n# How much\
    \ space is taken by my home directory and all subdirectories?\n\nIn the following\
    \ example, option -s stands for summary it displays only the total size of /home/user\
    \ and not the individual sizes of all subdirectories. Option -h displays the information\
