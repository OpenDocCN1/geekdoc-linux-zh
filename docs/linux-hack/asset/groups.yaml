    # # Chapter 10: Apachectl and Httd Examples


    After you have installed Apache2, if you want to use apachectl and httpd to

    it''s maximum potential, you should go beyond using start, stop and restart.

    The 9 practical examples provided in this chapter will help you to use apachectl
    and httpd very effectively.

    Apachectl acts as SysV init script, taking arguments like start, stop, restart

    and status. It also acts as- front-end to httpd command, by simply passing the

    command line arguments to httpd. So, all the commands you execute using

    apachectl, can also be executed directly by calling httpd.

    If you do not have Apache, refer to the tutorials: install apache from source
    or

    install LAMP stack using yum.


    # Hack 76. Pass different httpd.conf filename to apachectl


    Typically you''ll modify the original httpd.conf to try out different Apache directives.
    If something doesn''t work, you''ll revert back the changes.

    Instead of playing around with the original httpd.conf, copy it to a new httpd.conf.debug
    and use this new httpd.conf.debug file with Apache for testing purpose as shown
    below option -f.


    ```

    # apachectl -f conf/httpd.conf.debug

    # httpd -k start -f conf/httpd.conf.debug

    ```


    [Note: you can use either apachectl or httpd as shown above]


    ```

    # ps -ef | grep httpd

    ```'
