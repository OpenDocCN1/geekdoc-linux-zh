- md: "\n# Linux Hack\n\nAjay Kumar Tiwari\n\ntput smso - Enter standout mode (bold\
    \ on rxvt)\ntput rmso - Exit standout mode\ntput sgr0 - Turn off all attributes\n\
    \nColor Code for tput:\n\n- 0 – Black\n- 1 – Red\n- 2 – Green\n- 3 – Yellow\n\
    - 4 – Blue\n- 5 – Magenta\n- 6 – Cyan\n- 7 – White\n\n# Hack 41. Create your own\
    \ prompt using the available codes for PS1 variable\n\nUse the following codes\
    \ and create your own personal PS1 Linux prompt that is functional and suites\
    \ your taste.\n\n- \\a an ASCII bell character (07)\n- \\d the date in \"Weekday\
    \ Month Date\" format (e.g., \"Tue May 26\")\n- \\D{format} - the format is passed\
    \ to str(3) and the result is inserted into the prompt string; an empty format\
    \ results in a locale-specific time representation. The braces are required \\\
    e an ASCII escape character (033)\n- \\h the hostname up to the first part\n-\
    \ \\H the hostname\n- \\j the current time of jobs currently managed by the shell\n\
    - \\t the basename of the shell's terminal device name\n- \\n newline\n- \\r carriage\
    \ return\n- \\s the name of the shell, the basename of $0 (the portion following\
    \ the final slash)\n- \\t the current time in 24-hour HH:MM:SS format\n- \\T the\
    \ current time in 12-hour HH:MM:SS format\n- \\@ the current time in 12-hour am/pm\
    \ format\n- \\A the current time in 24-hour HH:MM format\n- \\u the username of\
    \ the current user\n- \\v the version of bash (e.g., 2.00)\n- \\V the release\
    \ of bash, version + patch level (e.g., 2.00.0)\n- \\w the current working directory,\
    \ with $HOME abbreviated with a tilde\n- \\W the basename of the current working\
    \ directory, with $HOME abbreviated with a tilde\n- \\! the history number of\
    \ this command\n- # the command number of this command\n- \\$ if the effective\
    \ UID is 0, a #, otherwise a $\n- \\nnn the character corresponding to the octal\
    \ number\n- \\\\ a backslash\n- \\\\[ begin a sequence of non-printing characters,\
    \ which could be used to embed a terminal control sequence into the prompt\n-\
    \ \\] end a sequence of non-printing character\n\n# Hack 42. Use bash shell function\
    \ inside PS1 variable\n\nYou can also invoke a bash shell function in the PS1\
