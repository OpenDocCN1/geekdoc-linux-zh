    \ request: 3\naddress mask request: 3\n581558 ICMP messages received\n0 ICMP messages\
    \ failed\nICMP output histogram:\n  destination unreachable: 5079\n  echo replies:\
    \ 576476\n  timestamp replies: 3\n```\n\n# Misc Netstat Commands\n\n- netstat\
    \ --tcp --numeric List of TCP connection to and from the machine.\n- netstat --tcp\
    \ --programs Display TCP port that the server is listening on along with the program\
    \ that is listening on that particular port.\n- netstat -rnC Display the routing\
    \ cache\n\n# Hack 99. Sysctl Command\n\nLinux kernel parameter can be changed\
    \ on the fly using sysctl command.\n\nSysctl helps to configure the Linux kernel\
    \ parameters during runtime.\n\n```\n# sysctl -a\ndev.cdrom.autoclose = 1\nfs.quota.writes\
