  \ wa`。`ute(wa, b)`。\n最常用的属性是 `Qt.WA_DeleteOnClose`。\n\n`w.setContext`\n将 `QWidget`\
  \ `w` 的右菜单策略设置为 `policy p`。`MenuPolicy(p)` 包括 `Qt.NoContextMenu` 和 `Qt.ActionsContextMenu`。\n\
  \n`w.setCursor(c)`\n将 `QWidget` `w` 的光标设置为 `c`，一个 `QCursor` 或 `Qt.CursorShape`\n\
  \n`w.setEnabled(b)`\n根据 `b` 设置 `QWidget` `w` 为启用或禁用\n\n`w.setFocus()`\n赋予 `QWidget`\
  \ `w` 键盘焦点\n\n`w.setFont(f)`\n将 `QWidget` `w` 的字体设置为 `QFont f`\n\n`w.setLayout(l)`\n\
  将 `QWidget` `w` 的布局设置为 `QLayout l`\n\n`w.setSize`\n将 `QWidget` `w` 的水平和垂直 `QSizePolys`\
  \ 设置为 `hpPolicy(hp, vp)` 和 `vp`\n\n`w.setStyle`\n将 `QWidget` `w` 的样式表设置为字符串 `s`\
