  \ Qt Designer Plugins”章节。\n\n### 子类化 QWidget\n\n确保分子在范围内的代码以及设置实例变量的代码，与我们在鼠标点击事件处理程序中所做的代码完全相同。同样，我们将未处理的按键按下传递给基类实现——基类实现什么都不做，就像基类鼠标点击处理程序什么都不做一样。\n\
  \n```python\ndef sizeHint(self):\n    return self.minimumSizeHint()\n```\n\n我们决定小部件的首选尺寸是其最小尺寸。严格来说，我们没有必须重新实现此方法，但通过这样做我们使意图更加清晰。得益于我们在初始化器中设置的尺寸策略，小部件可以水平增长以占据尽可能可用的水平空间。\n\
  \n```python\ndef minimumSizeHint(self):\n    font = QFont(self.font())\n    font.setPointSize(font.pointSize()\
  \ - 1)\n    fm = QFontMetricsF(font)\n    return QSize(fm.width(FractionSlider.WSTRING)\
  \ * self.__denominator,\n                  (fm.height() * 4) + FractionSlider.YMARGIN)\n\
  ```\n\n`QFontMetricsF` 对象由 `QFont` 对象初始化，在本例中是部件的默认字体。该字体继承自小部件的父级，父级再次继承自其父级，以此此类推，顶层部件继承自\
  \ `QApplication` 对象（以及颜色方案和其他用户设置），而该对象本身从底层窗口系统报告的用户偏好中获取这些设置。当然，我们可以忽略用户的偏好，并在任何小部件中设置显式字体。\n\
  \n`QFontMetricsF` 对象提供了真实的指标，即实际使用的字体的指标——这可能与指定的字体不同。例如，如果使用了 Helvetica 字体，在 Linux\
  \ 或 Mac OS X 上几乎会被找到并使用，但在 Windows 上，`Ariel` 可能被用来代替。\n\n我们选择使用比用户首选字体大小小一的字号来显示分数，这就是为什么我们调用\
  \ `setPointSize()`。\n\n我们将小部件的最小宽度设置为显示所有分数的所需的宽度，假设每个分数有三个数字宽，即两个数字加上两边的某些空边距。总宽度实际上略小于此值，因为我们没有包含水平边距。我们将小部件的最小高度设置为单个字符高度的四倍，即足够的垂直空间留给分数“段”（表示每个分数的矩形）、垂直线、分子和分母。与宽度一样，实际高度略小于此值，因为我们只考虑了一半的垂直边距。\n\
