  \n（由于原文文本中存在大规模的重复段落，译文已根据指令要求进行了去重处理，保留核心翻译逻辑。）\n\n\n\n\n创建针对特定数据类型的列代理（column\
  \ delegates）非常简单，当验证需要考虑整行（记录）时，对它们进行子类化也不困难。但既然为每个模型创建自定义代理并不难，那么为什么还要使用通用代理方法呢？通用代理在两种主要语境下并不显得大合其宜：一种只需要少数代理的简单应用程序，以及那些列中包含异构数据类型的模型。但对于需要许多代理且列具有同构数据类型（如数据库中使用的数据类型）的应用程序，通用代理提供了三个关键优势。\n\
  \n- 易于更改特定列所使用的代理，或者在模型更改以包含更多列时添加额外的列代理。\n- 使用列代理意味着我们避免了在创建许多模型特定的自定义代理时不可避免的代码重复——例如，我们只需要写一个富文本行编辑代理、一个日期/时间编辑代理等。\n\
  - 一旦创建了针对特定数据类型的列代理，它就可以重用在每个使用该数据类型的列上，并且可以应用于任意数量的通用代理和任意数量的模型。这意味着错误修复和增强只需要对每种数据类型的每个列代理进行一次。\n\
  \n## 在树中表示表格数据\n\n假设我们让用户选出一个数据项，但用户选择的项目取决于他们之前选择的某个项目，而该项目又又取决于之前的某个项目。具体来说，想象我们让用户选择一个特定的机场——他们首先必须选择国家，然后是城市，最后是机场。这可以通过提供三个组合框来实现：在第一个中填充国家名称，在第二个填充当前国家的城市，在第三个填充当前城市的机场。\n\
  \n这在编程上并不困难，但用户必须使用三个独立的控件来指定他们的选择，并且无法容易地看到可选的选择范围。\n\n选择依赖性数据项的一种解决方案是使用树形视图（tree\
  \ view）。继续这个示例，树的根节点是国家，每个国家都有城市分支，每个城市分支下都有机场叶子节点（leaves）。这使得用户更容易遵循一条路径（而且他们只能遵循有效路径），并且便于我们检索他们完整的国家/城市/机场选择。\n\
  \n与例如使用表格视图（table view）相比，使用树形视图的另一个优点是它更紧凑且更容易导航。例如，如果我们有 100 个国家，每个国家平均有 4 个城市，每个城市平均有\
  \ 2 个机场，表格将需要 100 × 4 × 2 = 800 行——但树仅需 100 行（每个国家一行），每行都可以展开以显示其城市和机场。\n\n在本节中，我们将展示如何在树中表示数据表格，以及如何提取用户所选择的完整“路径”。我们将使用的示例应用程序称为\
  \ Server Info。它读取一个具有六列的数据集——国家、州（仅在美国有意义）、城市、提供商、服务器和 IP 地址——并允许用户指定一个特定的 6 元组。示例数据集有\
  \ 163 行，但仅引用了 33 个不同的国家，因此用户只需要导航到 33 个顶级项，而不是滚动查看几乎是该数字五倍的行数。\n\n该应用程序的核心由 `TreeOfTableModel`\
  \ 类提供，它是 `QAbstractItemModel` 的子类，可以在树中表示任意的表格数据。\n\n我们使用了该模型的自定义子类，并配合 `QTreeView`\
  \ 子类来展示数据。应用程序本身可以通过从命令行带有命令行参数 `1`、`2`、`3` 或 `4` 运行，通过不同层级的嵌套来创建树。图 16.3 显示了使用默认嵌套层级\
  \ `3` 的树。（嵌套层级不包括一系列分支末尾的叶子节点）。我们将首先回顾主表，因为它非常短。然后我们将查看表格视图子类和 `TreeOfTableModel`\
  \ 子类。接下来，我们将回顾 `treeoftable` 模块，包括 `BranchNode` 和 `LeafNode` 类，最后是 `TreeOfTableModel`\
  \ 类本身。\n\n```python\nclass MainForm(QMainWindow):\n\n    def __init__(self, filename,\
  \ nesting, separator, parent=None):\n        super(MainForm, self).__init__(parent)\n\
  \        headers = [\"Country/State (US)/City/Provider\", \"Server\", \"IP\"]\n\
  \        self.treeWidget = TreeOfTableWidget(filename, nesting, separator)\n   \
  \     self.treeWidget.model().headers = headers\n        self.setCentralWidget(self.treeWidget)\n\
  \        self.connect(self.treeWidget, SIGNAL(\"activated\"), self.activated)\n\
  \        self.setWindowTitle(\"Server Info\")\n```\n\n`TreeOfTableWidget` 类似于便利视图（convenience\
  \ view），因为它在内部集成了一个模型。该模型是 `ServerModel`，这是一个小的 `TreeOfTableModel` 子类，增加了显示旗帜图标的功能。\n\
  \n`filename` 是一个适用于 `TreeOfTableModel` 数据的文件名。特别是，它必须每行一条记录，且每个列（字段）必须由指定的分隔符分隔。\n\
  \n`nesting` 值是根节点可以分出的分支最大数量，不计算末尾的叶子。在这种情况下，传递的 `nesting` 值为 `3`（除非在该行被更改），这意味着我们将有\
  \ `3` 层分支（国家、州、城市）和 `1` 层叶子节点（提供商）。由于我们有 `6` 个字段，这意味着前 `4` 个字段将显示在树部件的树部分，剩下的 `2`\
  \ 个字段将作为单独列显示。生成的树视图将有 `3` 列，一列包含树，另外 2 列显示额外的字段。我们通过直接访问 `TreeOfTableWidget` 内部的模型来设置模型的表头。\n\
  \n`activated()` 方法在用户双击树小部件中的某行或按下回车键时被调用。\n\n```python\ndef activated(self, fields):\n\
  \    self.statusBar().showMessage(\"*\".join(fields), 60000)\n```\n\n“路径”，即用户选择的\
  \ (国家, 城市, 州, 提供商, 服务器, IP 地址) 6 元组，每当激活合适的行时，会在状态栏中用 -*- 分隔显示一分钟（60000 毫秒）。在此背景下，合适的行是指包含叶子节点的行，因为只有这些行包含所有六个字段。\n\
  \n`TreeOfTableWidget` 是 `QTreeView` 的子类，包含了它显示的模型。它还提供了一些简单的便利方法并创建了一些实用的信号与槽连接。\n\
  \n```python\nclass TreeOfTableWidget(QTreeView):\n\n    def __init__(self, filename,\
  \ nesting, separator, parent=None):\n        super(TreeOfTableWidget, self).__init__(parent)\n\
  \        self.setSelectionBehavior(QTreeView.SelectItems)\n        self.setUniformRowHeights(True)\n\
  \        model = ServerModel(self)\n        self.setModel(model)\n        try:\n\
  \            model.load(filename, nesting, separator)\n        except IOError, e:\n\
  \            QMessageBox.warning(self, \"Server Info - Error\", unicode(e))\n  \
  \      self.connect(self, SIGNAL(\"activated(QModelIndex)\"), self.activated)\n\
  \        self.connect(self, SIGNAL(\"expanded(QModelIndex)\"), self.expanded)\n\
  \        self.expanded()\n```\n\n`ServerModel` 是 `TreeOfTableModel` 的子类。它的唯一目的是重写\
  \ `data()` 方法以便提供合适的图标（国家和州旗帜）；我们稍后会回顾它。在从文件中加载模型数据并建立信号与槽连接后，我们调用 `expanded()`\
  \ 方法为列提供合适的宽度。\n\n```python\ndef expanded(self):\n    for column in range(self.model().columnCount(QModelIndex())):\n\
  ```\n\n\n\n\n`self.resizeColumnToContents(column)`\n\n当用户展开分支时——例如通过点击树的其中一个 `+`\
  \ 符号，或使用方向键导航并按下右方向键——就会调用此方法。它确保显示已展开项目文本的列足够宽，以便于阅读。在树模型中，每个项目要么是另一个项目的子节点（因此具有父节点），要么是顶层（根）项目，此时它没有父节点，这由一个无效的模型索引表示。因此，当我们使用\
  \ `QModelIndex()` 调用 `columnCount()`（即使用无效的模型索引）时，我们得到的是顶层项的列数。\n\n```python\ndef\
  \ activated(self, index):\n    self.emit(SIGNAL(\"activated\"), self.model().asRecord(index))\n\
  ``` 如果用户通过双击项目或在其上按下回车键来激活项目，就会调用此方法，并触发发射自己的 `activated()` 信号。它的参数是当前模型索引完整路径（记录），以字段值列表的形式存在。\n\
  \n```python\ndef currentFields(self):\n    return self.model().asRecord(self.currentIndex())\n\
  ```\n\n此方法提供的信息与 `activated()` 信号相同，但可以随时调用以获取当前记录；同样是以字段值列表的形式。\n\n`ServerModel`\
  \ 是 `TreeOfTableModel` 的子类，它重新实现了了一个方法：`data()`。这样做是为了在国家和美国州的名称旁边显示标志位。\n\n```python\n\
  class ServerModel(treeoftable.TreeOfTableModel):\n    def __init__(self, parent=None):\n\
  \        super(ServerModel, self).__init__(parent)\n\n    def data(self, index,\
  \ role):\n        if role == Qt.DecorationRole:\n            node = self.nodeFromIndex(index)\n\
  \            if node is None:\n                return QVariant()\n            if\
  \ isinstance(node, treeoftable.BranchNode):\n                if index.column() !=\
  \ 0:\n                    return QVariant()\n                filename = node.toString().replace(\"\
  \ \", \"_\")\n                parent = node.parent.toString()\n                if\
  \ parent and parent != \"USA\":\n                    return QVariant()\n       \
  \         if parent == \"USA\":\n                    filename = \"USA_\" + filename\n\
  \                filename = os.path.join(os.path.dirname(__file__), \"flags\", filename\
  \ + \".png\")\n                pixmap = QPixmap(filename)\n                if pixmap.isNull():\n\
  \                    return QVariant()\n                return QVariant(pixmap)\n\
  \        return treeoftable.TreeOfTableModel.data(self, index, role)\n```\n\n此 `data()`\
  \ 的重新实现仅处理 role 为 `Qt.DecorationRole` 的 `data()` 请求，并将任何其他请求传递给 `TreeOfTableModel`\
  \ 基类。在列表、表格和树视图中，装饰角色（decoration role）用于设置或检索数据项的图标。\n\n树模型基于父节点和子节点关系工作。在 `TreeOfTableModel`\
  \ 基类中，我们提供了一个方法 `nodeFromIndex()`，它返回与特定模型索引对应的节点（项目）。我们有两种节点：分支节点（branch nodes）和叶子节点（leaf\
  \ nodes）。每个节点可以有任意数量的列，尽管在此情况下，分支节点只有一个列，而叶子节点至少有一列。我们只为分支节点的第一列（也是唯一的列）提供图标，并且仅针对国家和美国州的分支。\n\
  \n标志图标存储在 `flags` 子目录中，国旗名称使用下划线代替空格，美国州名称以“USA_”开头。所有标志图标都是 `.png` 图像。我们没有使用 `.qrc`\
  \ 资源文件，而是直接从文件系统检索图像。`os.path.dirname()` 函数返回完整文件名的路径部分，os.path.join()` 函数将两个或多个字符串连接形成具有适当路径分隔符的路径字符串。如果所需的图像不存在或不可读，`QPixmap.isNull()`\
  \ 将返回 `True`；在这种情况下，我们返回一个无效的 `QVariant` 表示没有可用图标。否则，我们返回封装在 `QVariant` 中的 pixmap。\n\
  \n到目前为止看到的类都相当直观。这是因为提供树模型的实际工作是由 `TreeOfTableModel` 完成的。\n\n该模型读取表格数据集并将行/列数据转换为树。树以单个分支节点作为根节点，然后是挂在根节点上的任意数量的分支，每个分支都可以有自己的分支。每个分支的末尾是一个或多个叶子节点。\n\
  \n挂在分支上的节点是该分支的子节点。子节点可以是分支也可以是叶子，它们存储在列表中。每个子节点在其父节点节点列表中的位置是它的行号。列号指的是子节点（分支或叶子）内部的项（字段）。完整的记录（或“路径”）是根分支中所有字段、所有中间分支以及末尾叶子所有字段的拼接。分支与叶子之间的关系如图\
  \ 16.4 示意所示。\n\n分支（根）\n分支（行 #0）\n...\n分支（行 # *N*)\n...\n分支（行 #0）\n...\n叶子（行 #0）\n\
  叶子（行 #1）\n...\n...\n\n**图 16.4** 树模型分支和叶子节点的示意图\n\n在表格树模型中，我们选择按字母顺序保留每个分支的子节点。为了尽可能提高速度，分支的子节点列表实际上是包含两个元素的列表，第一个项是键（key），第二个项是子节点。我们现在查看分支和叶子节点的实现。提供的这些方法是为了兼容鸭子类型（duck\
  \ typing），以便方便地使用。\n\n```python\nclass BranchNode(object):\n    def __init__(self,\
  \ name, parent=None):\n        super(BranchNode, self).__init__(parent)\n      \
  \  self.name = name\n        self.parent = parent\n        self.children = []\n\
  ```\n\n分支节点的名称是显示在其第一列（也是唯一的列）中的文本。键是国家、州或城市的名称，取决于分支在树中的位置。\n\n```python\ndef orderKey(self):\n\
  \    return self.name.lower()\n\ndef toString(self):\n    return self.name\n\ndef\
  \ __len__(self):\n    return len(self.children)\n```\n\n`toString()` 方法以字符串形式返回字段。`len__()`\
  \ 方法返回分支有多少个孩子。\n\n```python\ndef childAtRow(self, row):\n    assert 0 <= row <\
  \ len(self.children)\n    return self.children[row][NODE]\n```\n\n此方法返回给定行的节点。我们在这里使用了\
  \ `assert` 语句，在模型的许多地方也是如此。代码可能很难编写，但通过使用断言，我们至少可以在特定点明确我们的预期。\n\n```python\ndef\
  \ rowOfChild(self, child):\n    for i, item in enumerate(self.children):\n     \
  \   if item[NODE] == child:\n            return i\n    return -1\n```\n\n这里我们返回特定子节点的行索引，如果该子节点不是此节点的子节点，则返回\
  \ -1。\n\n```python\ndef childWithKey(self, key):\n    if not self.children:\n  \
  \      return None\n    i = bisect.bisect_left(self.children, (key, None))\n   \
  \ if i < 0 or i >= len(self.children):\n        return None\n    if self.children[i][KEY]\
  \ == key:\n        return self.children[i][NODE]\n    return None\n```\n\n我们有时想要具有给定顺序键的子节点。一种方法是我们在\
  \ `rowOfChild()` 方法中所做的，遍历子节点列表以找到正确的。在这里我们采取了更高效的方法。我们找到节点应该占据的位置，如果该位置在范围内且具有正确的键，我们就返回该子节点。\n\
  \n```python\ndef insertChild(self, child):\n    child.parent = self\n    bisect.insort(self.children,\
  \ (child.orderKey(), child))\n```\n\n\n\n\n\n该方法将一个新的子节点插入到分支的子列表中，并将该分支设置为该子节点的父节点。通过结合\
  \ `bisect.insort()` 和子节点的顺序键（order key），我们确保以尽可能快速高效的方式将子节点放在正确的位置。`insort()` 函数与\
  \ `insort_right()` 相同。\n\n```python\ndef hasLeaves(self):\n    if not self.children:\n\
  \        return False\n    return isinstance(self.children[0], LeafNode)\n```\n\n\
  在表格模型树（tree of table model）中，拥有子节点的分支要么包含分支，要么包含叶子节点，而不会两者混合。因此，如果一个分支完全没有子节点，显然它没有叶子节点；同样，如果它有子节点且第一个是叶子节点，那么它们所有的都是叶子节点。\n\
  \n我们现在查看了整个分支节点类。接下来，我们将查看短得多的叶子节点类。\n\n```python\nclass LeafNode(object):\n   \
  \ def __init__(self, fields, parent=None):\n        super(LeafNode, self).__init__(parent)\n\
  \        self.parent = parent\n        self.fields = fields\n\n    # 叶子节点中的 fields\
  \ 是该节点的列。\n    def orderKey(self):\n        return u\"\\t\".join(self.fields).lower()\n\
  \n    def toString(self, separator=\"\\t\"):\n        return separator.join(self.fields)\n\
  \n    def __len__(self):\n        return len(self.fields)\n```\n\n叶子节点的顺序键是其字段用制表符分隔的拼接。同样，其\
  \ `toString()` 方法返回其字段的拼接。`__len__()` 方法返回字段的数量；对于分支，它返回子节点的数量。\n\n```python\ndef\
  \ field(self, column):\n    assert 0 <= column <= len(self.fields)\n    return self.fields[column]\n\
  ```\n\n500\n\n*第 16 章：高级模型/视图编程*\n\n该方法可以轻松地提取单个字段的值，同时通过断言确保字段的列在范围内。\n\n```python\n\
  def asRecord(self):\n    record = []\n    branch = self.parent\n    while branch\
  \ is not None:\n        record.insert(0, branch.toString())\n        branch = branch.parent\n\
  \    assert record and not record[0]\n    record = record[1:]\n    return record\
  \ + self.fields\n```\n\n表格模型树使用的记录（record）的概念是从根节点到叶子父节点的所有分支的拼接，加上叶子节点本身——换句话说，就是用户的完整选择“路径”。在服务器信息（Server\
  \ Info）应用中，这就是国家、州、城市、供应商、服务器和 IP 地址，其中国家、州和城市是分支，每个叶子包含三个字段：供应商、服务器和 IP 地址。\n\n\
  构建记录（字段列表），从叶子节点的父分支开始，沿分支树向上遍历。每个分支的字符串被添加到记录列表中。根分支没有字符串，因此我们从列表中删除该项。返回的列表是所有分支字符串加上叶子字符串的拼接。\n\
  \n我们现在已经完成了节点的审查。表格模型树是 `QAbstractItemModel` 的子类，它重新实现了我们预期的许多方法，例如 `data()`、`headerData()`、`rowCount()`\
  \ 和 `columnCount()`。此外，它还提供了 `index()`、`parent()` 和 `nodeFromIndex()` 方法。\n\n```python\n\
  class TreeOfTableModel(QAbstractItemModel):\n    def __init__(self, parent=None):\n\
  \        super(TreeOfTableModel, self).__init__(parent)\n        self.root = Branch()\n\
  \        self.headers = []\n        self.columns = 0\n\n    # 列的数取决于嵌套情况。\n    #\
  \ 我们使用的逻辑与我们在第 14 章填充 TreeWidget \n    # 时所看到的逻辑相似。\n    def load(self, filename,\
  \ separator):\n        fh = None\n        try:\n            fh = open(filename,\
  \ \"r\", \"utf8\")\n            for line in fh:\n                if not line:\n\
  \                    continue\n                items = line.split(separator)\n \
  \               if nesting > 0:\n                    # ... 501\n               \
  \     # ...\n        except IOError, e:\n            exception = e\n        finally:\n\
  \            if fh:\n                fh.close()\n            if exception:\n   \
  \             self.reset()\n        # ... 502\n```\n\n*第 16 章：高级模型/视图编程*\n\n```python\n\
  def addRecord(self, fields, callReset=True):\n    branch = None\n    for i in range(self.nesting):\n\
  \        key = fields[i].lower()\n        if branch is not None:\n            branch\
  \ = branch.childWith(key)\n        else:\n            branch = BranchNode(key)\n\
  \        branch.insertChild(branch)\n    if callReset:\n        self.reset()\n```\n\
  \n\n\n\n\n# 在树中表示表格化数据\n\n对于树模型来说，行数是特定节点拥有的子节点数量。我们的实现仅允许分支节点拥有子节点，因此当在叶子节点上调用时，我们始终返回\
  \ `0`。`len()` 函数会调用 `BranchNode.__len__()`，该方法返回分支子节点的计数。\n\n```python\nreturn 0\n\
  return len(node)\n```\n\n```python\ndef columnCount(self, parent):\n    return self.columns\n\
  ```\n\n列数是非嵌套字段的最大最大数量。这看起来可能少了一个，但它是正确的，因为第一个非嵌套字段显示在第一列（树列）中。\n\n```python\ndef\
  \ data(self, index, role):\n    if role == Qt.TextAlignmentRole:\n        return\
  \ QVariant(int(Qt.AlignTop|Qt.AlignLeft))\n    if role != Qt.DisplayRole:\n    \
  \    return QVariant()\n    node = self.nodeFromIndex(index)\n    assert node is\
  \ not None\n    if isinstance(node, BranchNode):\n        return QVariant(node.toString())\
  \ \\\n        if index.column() == 0 else QVariant(QString(\"\"))\n    return QVariant(node.field(index.column()))\n\
  ```\n\n如果请求分支节点的显示数据，我们返回节点第 0 列的文本，并在其他列返回空字符串。对于叶子节点，我们返回与请求列相对应的字段。\n\n在 `Qt`\
  \ 4.2 之前，默认的文本对齐工作正常且不需要指定 `Qt`，但从 `Qt` 4.2 开始，我们必须显式地自己返回一个合理的文本对齐。\n\n```python\n\
  def headerData(self, section, orientation, role):\n    if orientation == Qt.Horizontal\
  \ and \\\n    role == Qt.DisplayRole:\n        assert 0 <= section <= len(self.headers)\n\
  \        return QVariant(self.headers[section])\n    return QVariant()\n```\n\n\
  树形视图只有水平（列）标题。它们没有行标题（例如行号），因为这些并没有真正的意义，因为每个分支都有它自己的从 0 开始的子节点列表（行）。\n\n```python\n\
  def index(self, row, column, parent):\n    assert self.root\n    branch = self.nodeFromIndex(parent)\n\
  \    assert branch is not None\n    return self.createIndex(row, column,\n     \
  \   branch.childAtRow(row))\n```\n\n`index()` 方法必须返回对应给定行和列的数据项的模型索引，且该项是给定父节点的子节点。在分支与叶子的树形模型中，这意味着我们必须返回父项目第\
  \ row 个子节点的模型索引。我们首先找到给定父节点模型索引的分支节点，并返回一个具有给定行、列的模型索引，其父节点是该（分支）节点的第 row 个子节点。\n\
  \n```python\ndef parent(self, child):\n    node = self.nodeFromIndex(child)\n  \
  \  if node is None:\n        return QModelIndex()\n    parent = node.parent\n  \
  \  if parent is None:\n        return QModelIndex()\n    grandparent = parent.parent\n\
  \    if grandparent is None:\n        return QModelIndex()\n    row = grandparent.rowOfChild(parent)\n\
  \    assert row != -1\n    return self.createIndex(row, 0, parent)\n```\n\n`parent()`\
  \ 方法必须返回给定子节点的父节点的模型索引。在分支与叶子的树形模型中，这是子节点祖父的第 row 个子节点。我们首先找到子节点的父节点的父（即子节点的祖父）。然后我们返回一个模型索引，其行是父节点在祖父子节点列表中占据的行，列为\
  \ 0（因为所有父节点只有第 0 列），且父节点是子节点的父节点。\n\n```python\ndef nodeFromIndex(self, index):\n\
  \    return index.internalPointer() \\\n    if index.isValid() else self.root\n\
  ```\n\n当我们调用 `QAbstractItemModel.createIndex()` 时，第三个参数是对节点的引用。该引用可以通过模型索引获取，并通过\
  \ `internalPointer()` 方法返回。对于任何给定的模型索引，我们返回一个分支或叶子节点，或者根节点。这里显示的 `index()` 和 `parent()`\
  \ 方法实现相当微妙。然而，对于采用分支和叶子方法的树模型，这些代码通常可以直接“原样”复制。\n\n总结\n\n理解树模型比理解表格模型（或单列列表模型）更具挑战性。但在许多情况下，通过构建或调整本节介绍的代码，可以减少这些。\n\
  \nPyQt 内置的视图组件以及图形视图组件为数据数据化提供了广泛的空间。但当我们的需求并不匹配这些类提供的内容时，我们始终可以创建自定义视图，并按照我们喜欢的方式展示数据。\n\
  \n由于自定义视图可能会显示非常大的数据集的一部分，最好的方法是优化绘制事件处理程序，只检索和显示实际可见的数据项。如果需要滚动条，我们可以要求视图类的用户使用\
  \ `QScrollArea`，或者创建一个带有几个 `QScrollBar` 的复合组件，或者创建一个继承自 `QAbstractScrollArea` 的组件。这些方法中的第一个只需要为用户的代码添加几行，就能让视图实现变得简单得多。\n\
  \n创建树模型可能是困难的，因为我们必须以父子关系来思考，其中子节点可以是父节点，以此类推递归到任意深度。\n\n练习\n\n本练习结合了在本章及之前章节涵盖过的许多模型/视图功能。创建一个显示两个组件的应用程序：`QListView`\
  \ 和自定义的 `BarGraphView`。数据应该存储在自定义的 `BarGraphModel` 中。用户应该通过 `QListView` 编辑数据，使用自定义的\
  \ `BarGraphDelegate` 来控制列表中数据项的展示和编辑。\n\n\n\n\n自定义视图需要重新实现 `setModel()`，在其中，应与基类的\
  \ `update()` 方法建立连接，以便在模型数据更改时发生重绘；还需要重实现 `minimumSizeHint()`、`sizeHint()`（后者可以简单调用\
  \ `minimumSizeHint()`）以及 `paintEvent()`。绘制事件的实现只需要十多行代码——确保你使用了 `QPainter.setWindow()`，以便图表始终填充可用空间。即使没有设置模型，所有方法也应该正常工作——例如，在没有模型的情况下，绘制事件不绘制任何内容。\n\
  \n以下是 `MainForm` 的代码，让你了解这些类是如何使用的：\n\n```python\nclass MainForm(QDialog):\n   \
  \ def __init__(self, parent=None):\n        super(MainForm, self).__init__(parent)\n\
