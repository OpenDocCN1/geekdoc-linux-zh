  ![Image 95](img/index-590_2.png)\n\n## B. 部分 PyQt \n\n这里的截图是在 Linux 上使用 KDE 拍摄的，以提供视觉上的统一性。在书中，显示了\
  \ Windows、Linux 和 Mac OS X 的截图，通常随章节而变化。\n\n### QCalendarWidget\n此控件可以作为显示控件，尽管它主要被设计为输入控件，用户可以通过它选择特定日期。该控件的显示是高度可配置的；例如可以显示或隐藏周数，日期可以用单个字母、简写或全称表示，可以设置使用的颜色和字体，还可以设置哪一天为一周的第一天。也可以设置最小和最大允许日期。在\
  \ `QDateEdit` 或 `QDateTimeEdit` 上调用 `setCalendarPopup(True)` 会导致它们的旋钮被箭头按钮取代。如果用户点击按钮，将弹出一个\
  \ `QCalendarWidget`。\n\n### QCheckBox\n复选框可用于向用户提供简单的是/否选择。如果调用了 `QCheckBox.setState(True)`，复选框将有三种状态：用户勾选了、用户未勾选、或者用户没有更改其之前的状态。这种三状态方法对于表示允许\
  \ `IS NULL` 的布尔数据库字段可能有用。\n\n575\n![Image 96](img/index-591_1.png)\n![Image 97](img/index-591_2.png)\n\
  ![Image 98](img/index-591_3.png)\n![Image 99](img/index-591_4.png)\n![Image 100](img/index-591_5.png)\n\
  ![Image 101](img/index-591_6.png)\n576\n\n## 附录 B. 部分介绍 PyQt 控件\n\n### QComboBox\n\
  截图显示了一个弹出了列表的 `QComboBox`。组合框用于向用户提供项目列表，而当垂直空间不足以使用 `QListView` 时非常有用。调用 `QComboBox.setEditable(True)`\
  \ 允许用户选择列表中的项目之一，或者输入自己的文本。每个 `QComboBox` 组合框项都有文本、可选图标和可选数据。我们可以使用 `QComboBox.addItem()`\
  \ 或 `QComboBox.addItems()` 填充组合框，也可以使用自定义或内置的 `QAbstractItemModel` 子类配合 `QComboBox.setModel()`。\n\
  \n### QDateEdit, QDateTimeEdit, QTimeEdit\n`QDateEdit` 用于显示和输入日期，`QDateTimeEdit`\
  \ 用于日期和时间，`QTimeEdit` 用于时间。\n\n### QGroupBox\n组框可以仅作为视觉分组设备，也可以像这里这样设置为可勾选的。如果是可勾选的，只有在组框被勾选时，其中的的控件才能进行交互。\n\
  \n### QRadioButton\n当 `RadioButton` 放在组框中时，它们的行为是正确的，即用户只能选择其中一个。`ComboBoxes` 和\
  \ `ListViews` 通常比 `RadioButton` 更方便。\n\n### QGraphicsView\n此控件用于查看 `QGraphicsScene`\
  \ 中的项。任意数量的 `QGraphicsViews` 可以查看同一个场景，实际上每个视图都有自己的变换（例如缩放和旋转）。如果需要，滚动条会自动出现。每个\
  \ `QGraphicsView` 都可以提供自己的背景和前景，覆盖场景提供的内容。\n\n### QLabel\n`QLabel` 控件是一个显示控件，可以显示图像、纯文本字符串、`QTextDocument`\
  \ 或 HTML。带有加速键（单个带下划线的字符）的标签可以与“伙伴”控件关联，在按下加速键时将键盘焦点传递给伙伴。\n\n### QLineEdit\n此控件可以接受用户的一行文本。文本可以通过验证器（例如\
  \ `QIntValidator` 或 `QRegExpValidator`）或设置输入掩码（或两者都使用）来限制。回模式可以设置为显示“*”（或不显示）输入的文本。\n\
