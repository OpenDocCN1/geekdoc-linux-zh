  .join(errors))\n```\n\n为了方便起见，我们提供了一个“全部保存”动作。由于有很多窗口，如果保存其中一个时出现问题（例如磁盘空间不足），问题可能会影响许多窗口。因此，我们不是在每次\
  \ `save()` 失败时都给出错误消息，而是将错误积累在列表中并在最后如果有任何需要显示的错误则将其全部显示。\n\n```python\ndef editCopy(self):\n\
  \    textEdit = self.mdi.activeWindow()\n    if textEdit is None or not isinstance(textEdit,\
  \ QTextEdit):\n        return\n    cursor = textEdit.textCursor()\n    text = cursor.selectedText()\n\
  \    if not text.isEmpty():\n        clipboard = QApplication.clipboard()\n    \
  \    clipboard.setText(text)\n```\n\n该方法的启动方式与之前相同——这也是所有适用于特定窗口方法的启动方式——即通过获取用户正在操作的编辑器。`QTextEdit.textCursor()`\
  \ 返回的 `QTextCursor` 是用户使用的光标的程序等效物，但它独立于用户的光标；该类将在第 13 章进行详细讨论。如果有选中的文本，将其复制到系统的全局剪贴板。\n\
  \n```python\ndef editCut(self):\n    textEdit = self.mdi.activeWindow()\n    if\
  \ textEdit is None or not isinstance(textEdit, QTextEdit):\n        return\n   \
  \ cursor = textEdit.textCursor()\n    text = cursor.selectedText()\n    if not text.isEmpty():\n\
  \        cursor.removeSelectedText()\n        clipboard = QApplication.clipboard()\n\
  \        clipboard.setText(text)\n```\n\n该方法与复制方法几乎相同。唯一的区别是，如果有选中的文本，我们会从编辑器中将其移除。\n\
  \n```python\ndef editPaste(self):\n    textEdit = self.mdi.activeWindow()\n    if\
  \ textEdit is None or not isinstance(textEdit, QTextEdit):\n        return\n   \
  \ clipboard = QApplication.clipboard()\n    textEdit.insertPlainText(clipboard.text())\n\
  ```\n\n如果剪贴板中有文本（无论是来自此应用程序中的复制或剪切操作，还是来自另一个应用程序），我们将其插入到编辑器的当前光标位置。\n\n所有的基础 MDI\
  \ 窗口操作都由 `QWorkspace` 槽提供，因此我们不需要自己提供平铺、层叠或窗口导航。但我们必须提供用于最小化和恢复所有窗口的代码。\n\n```python\n\
  def windowRestoreAll(self):\n    for textEdit in self.mdi.windowList():\n      \
  \  textEdit.showNormal()\n```\n\n`windowMinimizeAll()` 方法（未显示）是相同的，只是我们调用的是 `showMinimized()`\
  \ 而不是 `showNormal()`。\n\n`QSignalMapper` 对象是一个每当 `map()` 槽被调用时就会发射 `mapped()` 信号的对象。它在\
  \ `mapped()` 信号中传递的参数是与调用 `map()` 槽的任何 `QObject` 对应的参数。我们使用信号映射器将窗口菜单中的动作与 `TextEdit`\
  \ 控件关联起来，这样当用户选择特定窗口时，适当的 `TextEdit` 将成为活动窗口。这在两个地方设置：初始化函数和 `updateWindowMenu()`\
  \ 方法，如图 9.9 所示。\n\n**图 9.9 SignalMapper** 的通用操作\n\n| 发送者 | 参数 |\n| :--- | :--- |\n\
  | (QObject, QObject) | SIGNAL(mapped(QObject)) SLOT(map()) |\n| (QObject, QWidget)\
  \ | SIGNAL(mapped(QWidget)) QObject |\n| (QObject, int) | SIGNAL(mapped(int)) |\n\
  | **…** | |\n\n在初始化函数中，我们从信号映射器的 `mapped(QWidget*)` 信号连接到 MDI 工作区的 `setActiveWindow(QWidget*)`\
  \ 槽。为了使用这一点，信号映射器必须发射用户从窗口菜单中选择的窗口对应的信号。MDI 编辑器的信号映射器如图 9.10 所示。\n\n```python\n\
  def updateWindowMenu(self):\n    self.windowMenu.clear()\n    self.addActions(self.windowMenu,\
  \ (self.windowNextAction,\n                               self.windowPrevAction,\
  \ self.windowCascadeAction,\n                               self.windowTileAction,\
  \ self.windowRestoreAction,\n                               self.windowMinimizeAction,\n\
  \                               self.ArrangeIconsAction, None,\n               \
  \                self.windowCloseAction))\n    textEdits = self.mdi.windowList()\n\
  \    if not textEdits:\n        return\n```\n\n首先清除窗口菜单中的动作，然后重新添加所有标准动作。接下来，获取\
  \ `TextEdit` 窗口列表；如果没有，则直接返回；否则，我们必须为每个窗口添加一个条目。\n\n```python\n    self.windowMenu.addSeparator()\n\
  \    i = 1\n    menu = self.windowMenu\n    for textEdit in textEdits:\n       \
  \ title = textEdit.windowTitle()\n        if i == 10:\n            self.windowMenu.addSeparator()\n\
  \            menu = menu.addMenu(\"&More\")\n        accel = \"\"\n        if i\
  \ < 10:\n            accel = \"&%d \" % i\n        elif i < 36:\n            accel\
  \ = \"&%c \" % chr(i + ord(\"@\") - 9)\n```\n\n\n\n\n对于我们未提供加速字符串的任何其他窗口，使用 `&A`、`&B`、`…`、`&Z;`。（使用\
  \ `%c` 格式字符串指定单个字符。）更多”（More）子菜单的加速键是针对英语的；其他语言可能需要不同的处理。\n\n```python\naction =\
  \ menu.addAction(\"%s%s\" % (accel, title))\n\nself.connect(action, SIGNAL(\"triggered()\"\
  ), self.windowMapper, SLOT(\"map()\"))\n\nself.windowMapper.setMapping(action, textEdit)\n\
  \ni += 1\n```\n\n我们使用（可能为空的）加速键文本和标题文本——窗口标题，即不带路径的文件名——创建一个新的动作（action）。然后，将动作的\
  \ `triggered()` 信号连接到信号映射器的 `map()` 槽。这意味着每当用户从“窗口”（Window）菜单中选择一个窗口时，信号映射器的 `map()`\
  \ 槽就会被调用。注意，信号和槽都没有参数；这取决于信号映射器来判断是哪一个动作触发了它——例如，它可以使用 `sender()`。在信号与槽连接之后，我们在信号映射器内部设置了从动作到对应\
  \ `TextEdit` 的映射。\n\n`action *N`\n`SLOT(map())`\n`(action1, textEdit1)`\n`(action2,\
  \ textEdit2)`\n`…`\n`windowMapper`\n`SIGNAL(mapped(textEdit *N))`\n`SLOT(mdi.activateWindow(textEdit\
  \ *N))`\n\n**图 9.10** *MDI 编辑器的信号映射器*\n\n当信号映射器的 `map()` 槽被调用时，信号映射器将发现是哪个动作调用它的，并使用映射来确定传递哪个\
  \ `TextEdit` 参数。然后，信号映射器将带有参数发射它自己的 `mapped(QWidget*)` 信号。我们将 `mapped()` 信号连接到 MDI\
  \ 工作区的 `setActiveWindow()` 槽，因此该槽会被调用，传递的 `TextEdit` 将成为活动窗口。\n\n我们对 MDI 文本编辑器的回顾到此。我们跳过了创建应用程序对象和主窗口的代码，因为这与我们在之前的示例中看到的许多代码相同。\n\
  \n## 总结\n\n当我们有有很多选项的对话框时，可以通过标签页控件（tab widgets）和堆叠窗口控件（stacked widgets）让用户操作更易于管理。标签页控件在我们希望用户能够查看和编辑所有可用选项时特别有用。堆叠窗口控件适用于我们希望用户只看到当前相关选项页的情况。对于堆叠窗口控件，我们必须提供一种让用户选择当前页的方法——例如，页面名称的\
  \ `combobox`（组合框）或 `list widget`（列表控件）。当对话框的某些选项是“高级”的或不经常需要时，我们可以使用扩展对话框，除非用户请求查看，否则就隐藏额外的选项。选中的组框框（Checked\
  \ group boxes）可以用于启用或禁用它们包含的控件；如果我们希望用户即使在控件禁用的情况下也能看到可用选项，这就会很有用。对于某些对话框，所有这些方法都可以结合使用，尽管在这些复杂的情况下，验证逻辑可能会变得相当复杂。\n\
  \n拆分器（Splitters）对于创建包含多个控件的主窗口非常有用，并允许用户控制控件的相对大小。另一种方法是使用一个单一的中央控件，并将其他控件放在停靠窗口（dock\
  \ windows）中。\n\n停靠窗口在停靠时会自动在它们与中央控件之间放置一个拆分器，并且可以从一个停靠区域拖到另一个区域或自由浮动。\n\nSDI（单文档界面）让用户轻松在同一个应用程序内打开多个文档。SDI\
  \ 还让跨窗口的某些交互成为可能，例如“保存所有”和“退出”动作以及窗口菜单，这些如果为每个文档使用一个独立的应用程序实例是很难实现的。SDI 方法非常流行，虽然它比\
  \ MDI 更消耗资源，但对于非常没有经验的用户来说，可能比 MDI 更容易理解。\n\nMDI（多文档界面）提供了与 SDI 相同的优点，只是文档窗口被限制在单个主窗口的中央区域内。这避免了菜单和工具栏的重复，并更容易安排窗口之间的关系。MDI\
  \ 的缺点之一是某些用户发现它比 SDI 更难理解，至少最初是这样。MDI 不限于仅具有一种控件类型的窗口，尽管大多数在主窗口中使用超过一种控件类型的现代 MDI\
  \ 对文档窗口有一种类型，而其他类型被放在停靠窗口中。\n\n在 SDI 和 MDI 示例应用程序中，所有动作始终处于启用状态。这不是一个问题，因为任何无意义的动作都会无害地什么都不做。然而，为了避免困扰某些用户，最好根据应用程序的状态来启用或禁用动作；13\
  \ 章中的侧栏显示了如何这样做。\n\n布局（Layouts）、拆分器、标签页控件、堆叠窗口控件、停靠窗口、SDI 和 MDI 动作提供了广泛的人机界面设计选项。此外，我们可以在代码中创建自己的布局，或者创建自己的布局管理器，因此这种可能性真的是无限的。\n\
  \n### 练习题\n\n修改 MDI 文本编辑器应用程序（`texteditor.pyw`），使其不再使用 MDI，而是使用 `QTabWidget` 并变成标签页编辑器。\n\
  \n不再需要“窗口”菜单，因此可以删除与它相关的所有代码。需要一个新的“关闭标签页”动作，以及相应的处理该动作的方法。不要使用 `QWorkspace.windowList()`，而是使用\
  \ `for` 循环从 0 迭代到 `QTabWidget.count()`，并使用 `QTabWidget.widget()` 遍历每个窗口。\n\n`closeEvent()`\
  \ 需要修改，这可能是最难实现的部分。修改 `loadFiles()` 以限制命令行加载的文件数量为 10 个。`fileNew()` 需要像以前一样创建一个\
  \ `TextEdit`，然后使用 `QTabWidget.addTab()` 将其添加到标签页控件中，并将控件和窗口标题作为参数。不要对控件调用 `show()`，而是使用\
  \ `QTabWidget.setCurrentWidget()`。`fileOpen()`、`loadFile()`、`fileSave()`、`fileSaveAs()`\
  \ 和 `fileSaveAll()` 方法需要进行更改。编辑方法只需要更改它们的第一行代码，使用 `QTabWidget.currentWidget()` 代替\
  \ `QWorkspace.activeWindow()`。\n\n一旦一切运行正常，添加两个快捷键，一个对应 `QKeySequence.PreviousChild`，另一个对应\
  \ `QKeySequence.NextChild`，以及相应的方法 `prevTab()` 和 `nextTab()` 来让它们工作。\n\n这些更改大约是十几行，加上快捷键及其方法大约二十行左右；如既往，重点在于思考和理解而不是打字。\n\
  \n模型解决方案在文件 `chap09/tabbededitor.pyw` 中提供。\n\n\n\n\n\n### 事件处理机制\n\nPyQt 提供了两种处理事件的机制：高层的信号与槽机制，以及低层的事件处理器。当我们关注用户想要执行什么操作，而不纠结于他们具体是如何请求的时，信号与槽的方法是理想的。信号与槽也可以用于自定义组件行为的某些方面。但当我们需要更深层次的操作时，特别是在创建自定义组件时，我们需要使用低层事件处理器。\n\
  \nPyQt 提供了丰富的事件处理器，某些与组件的行为有关（例如处理按键和鼠标事件的处理器），另一些与组件的外观有关（例如处理绘制事件和大小调整事件的处理器）。\n\
  \nPyQt 的事件处理机制按照我们预期的逻辑运行。例如，如果用户点击了具有键盘焦点的组件或在其上按下键，该组件将接收到事件。如果组件处理了该事件，故事就结束了。但如果组件没有处理该事件，事件将传递给组件的父级——这是\
  \ PyQt 父子层次结构的另一个优势。这种未处理事件的从子级到父级的传递一直持续到顶层组件，如果顶层组件也不处理该事件，事件将被简单地丢弃。\n\nPyQt\
  \ 提供了五种拦截和处理事件的不同方法。前两种方法使用最频繁，其他方法很少需要，甚至永远不需要。\n\n最简单的方法是重新实现特定的事件处理器。到目前，我们只看到了这方面的一个例子：重新实现组件的\
  \ `closeEvent()`。正如我们在本章及随后的章节中看到的，我们可以通过重新实现其他事件处理器来控制组件的行为——例如，`keyPressEvent()`、`mousePressEvent()`\
  \ 和 `mouseReleaseEvent()`。我们还可以通过重新实现 `resizeEvent()` 和 `paintEvent()` 来控制组件的外观。当我们重新实现这些事件时，通常不会调用基类的实现，因为我们希望只在事件处理器被调用作为结果时执行我们自己的代码。\n\
  \n在任何特定的事件处理器被调用之前，`event()` 事件处理器都会被被调用。重新实现此方法允许我们处理在特定事件处理器中无法妥善处理的事件（特别是覆盖 Tab\
  \ 键更改键盘焦点的行为），或者实现那些没有特定处理器的事件，例如 `QEvent.ToolBarChange`。当我们重新实现此处理器时，对于任何我们没有自己处理的事件，我们都会调用基类的实现。\n\
  \n第三和第四种方法使用事件过滤器。我们可以在任何 `QObject` 上调用 `installEventFilter()`。这意味着传递给 `QObject`\
  \ 的所有事件将首先传递给我们的事件过滤器：在到达目标对象之前，我们可以丢弃或修改任何事件。这种方法的更强大版本是在 `QApplication` 对象上安装事件过滤器，尽管其唯一的实际用途是调试以及处理发送到禁用组件的鼠标事件。可以在对象上或\
  \ `QApplication` 上安装多个事件过滤器，在这种情况下，它们将按照从最近安装到最早安装的顺序执行。\n\n事件过滤器提供了一种非常强大的事件处理手段，PyQt\
  \ 编程的新手往往容易使用它们。但我们建议避免使用事件过滤器，至少直到你拥有丰富的 PyQt 编程经验。如果安装了大量的事件过滤器，应用程序性能可能会受到影响；而且，与简单重新实现特定的事件处理器或\
  \ `event()` 处理器相比，它们会显著增加代码复杂性。我们不会查看任何事件过滤器的示例，因为在通用的 PyQt 编程中应该避免它们——它们只有在创建自定义组件时才真正相关——即使如此，它们也很少需要。\n\
  \n# 重新实现事件处理器\n\n图 10.1 中的截图显示了一个 `QWidget` 子类，它有一些重新实现的事件处理器。`chap10/events.pyw`\
  \ 中的 Events 应用程序报告某些事件和条件，我们将使用它来查看 PyQt 中是如何进行事件处理的。后续章节将使用在这里描述的相同技术来执行更复杂、更真实的事件处理。我们将从查看应用程序初始化函数的片段开始，以查看其实例数据。\n\
  \n```python\nclass Widget(QWidget):\n    def __init__(self, parent=None):\n    \
  \    super(Widget, self).__init__(parent)\n        self.justDoubleClicked = False\n\
  \        self.key = QString()\n        self.text = QString()\n        self.message\
  \ = QString()\n```\n\n我们将最近一次按键的文本存储在 `key` 中，要绘制的文本——例如“鼠标位于……”——存储在 `text` 中，并将消息文本存储在\
  \ `message` 中。我们还跟踪用户是否刚刚执行了双击。\n\n我们将考虑的第一个事件处理器是绘制事件。我们将关于绘制的适当讨论留到第 11 章。\n\n\
  ```python\ndef paintEvent(self, event):\n    text = self.text\n    i = text.indexOf(\"\
  \\n\\n\")\n    if i >= 0:\n        text = text.left(i)\n    if not self.key.isEmpty():\n\
  \        text += \"\\n\\nYou pressed: %s\" % self.key\n    painter = QPainter(self)\n\
  \    painter.setRenderHint(QPainter.TextAntialiasing)\n    painter.drawText(self.rect(),\
  \ Qt.AlignCenter, text)\n    if self.message:\n        painter.drawText(self.rect(),\
  \ Qt.AlignBottom|Qt.AlignHCenter, self.message)\n    QTimer.singleShot(5000, self.message.clear)\n\
  \    QTimer.singleShot(5000, self.update)\n```\n\n要显示的文本由两部分组成。第一部分通常包含鼠标坐标，第二部分（可能为空）包含用户按最后一个键。此外，消息文本可能会绘制在组件的底部，在这种情况下，单次计时器会在\
  \ 5 秒后清除消息文本，并调度一个绘制事件以重新绘制不带消息文本的组件。\n\n在绘制事件中，像这里这样忽略事件是非常常见的。（事件可以告诉我们需要重绘的精确区域，因此可以通过只绘制需要更新的区域来优化绘制，这种技术我们将在第\
  \ 16 章中使用。）`rect()` 方法返回一个带有组件尺寸的 `QRect`，因此我们简单地在给定的矩形中居中绘制文本。我们不调用基类的绘制事件；这是 PyQt\
  \ 绘制事件处理器中的标准做法，而且在任何情况下，`QWidget` 的绘制事件都不做操作。\n\n```python\ndef resizeEvent(self,\
  \ event):\n    self.text = QString(\"Resized to QSize(%d, %d)\" % (\n        event.size().width(),\n\
  \        event.size().height()))\n    self.update()\n```\n\n当组件调整大小时（例如，通过用户拖动角或边），会生成大小调整事件。我们设置实例文本以显示新大小，并调用\
  \ `update()` 来调度绘制事件。大小调整事件还具有之前的尺寸，可以通过 `QResizeEvent.oldSize()` 方法获取。我们不调用基类的大小调整事件，因为它什么都不做。\n\
  \n```python\ndef keyPressEvent(self, event):\n    self.key = QString()\n    if event.key()\
  \ == Qt.Key_Home:\n        self.key = \"Home\"\n    elif event.key() == Qt.Key_End:\n\
  \        self.key = \"End\"\n    elif event.key() == Qt.Key_PageUp:\n        if\
  \ event.modifiers() & Qt.ControlModifier:\n            self.key = \"Ctrl+PageUp\"\
  \n        else:\n            self.key = \"PageUp\"\n    elif event.key() == Qt.Key_PageDown:\n\
  \        if event.modifiers() & Qt.ControlModifier:\n            self.key = \"Ctrl+PageDown\"\
  \n```\n\n\n\n\n# 重写事件处理器\n\n```python\nelse:\n    self.key = \"PageDown\"\nelif\
  \ Qt.Key_A <= event.key() <= Qt.Key_Z:\n    if event.modifiers() & Qt.ShiftModifier:\n\
  \        self.key = \"Shift+\"\n    self.key += event.text()\n    if self.key:\n\
  \        self.key = QString(self.key)\n    self.update()\nelse:\n    QWidget.keyPressEvent(self,\
  \ event)\n```\n\n当用户按下按键时，我们会通过 `keyPressEvent()` 收到通知。同样有一个对应的 `keyReleaseEvent()`，但它很少被重写。\n\
  \n`QKeyEvent` 参数提供了几个实用的方法，包括 `key()`（它返回被按键的键码）以及 `modifiers()`（它返回一个指示 Shift、Ctrl\
  \ 和 Alt 键状态的位标志）。\n\n我们选择了处理 Home、End、PageUp、Ctrl+PageUp、PageDown 和 Ctrl+PageDown\
  \ 键序列，以及字母键 A…Z 以及 Shift+A…Shift+Z。我们将按键内容的文本表示存储在 `key` 变量中，并调用 `update()` 来调度一个重绘事件。如果用户按下了我们不处理的按键，我们将按键事件传递给基类实现，这在处理按键事件时是常见的做法。\n\
  \n```python\ndef contextMenuEvent(self, event):\n    menu = QMenu(self)\n    oneAction\
  \ = menu.addAction(\"&One\")\n    twoAction = menu.addAction(\"&Two\")\n    self.connect(oneAction,\
  \ SIGNAL(\"triggered()\"), self.one)\n    self.connect(twoAction, SIGNAL(\"triggered()\"\
  ), self.two)\n    if not self.message:\n        menu.addSeparator()\n        threeAction\
  \ = menu.addAction(\"Thre&e\")\n        self.connect(threeAction, SIGNAL(\"triggered()\"\
  ), self.three)\n    menu.exec_(event.globalPos())\n```\n\n创建右键菜单简单的方法是使用 `QWidget.addAction()`\
  \ 向小组件添加操作，并将小组件的右键菜单策略设置为 `Qt.ActionsContextMenu`；我们在第 6 章的第 180 页看到过这种操作方法。但如果我们想对右键菜单事件产生的结果进行精细控制——例如，根据应用程序的状态提供不同的选项——我们就可以像这里这样重写右键菜单事件处理器。\n\
  \n`globalPos()` 方法返回调用右键菜单时的鼠标全局位置；我们将该位置传递给 `QMenu.exec_()`，以确保菜单在用户预期的位置弹出。\n\n\
  ```python\ndef mouseDoubleClickEvent(self, event):\n    self.justDoubleClicked =\
  \ True\n    self.text = QString(\"Double-clicked.\")\n    self.update()\n```\n\n\
  如果用户双击，就会调用此事件处理器。在这个例中中，我们需要跟踪用户是否刚刚执行了双击，因为我们也在重写鼠标释放和鼠标移动事件。双击会导致鼠标释放事件发生，而且双击时几乎会发生鼠标移动事件，因为用户的鼠标不太可能完全稳定。\n\
  \n我们采取了与其他事件处理器中相同的方法：设置文本并调度重绘以显示它。对于我们自己处理的鼠标事件，不调用基类方法是非常常见的。\n\n```python\n\
  def mouseReleaseEvent(self, event):\n    if self.justDoubleClicked:\n        self.justDoubleClicked\
  \ = False\n    else:\n        self.setMouseTracking(not self.hasMouseTracking())\n\
  \    if self.hasMouseTracking():\n        self.text = QString(\"Mouse tracking is\
  \ on.\\n\"\n                           \"Try moving the mouse!\\n\"\n          \
  \                 \"Single click to switch it off\")\n    else:\n```\n\n\n\n\n\n\
  实际场景中的事件处理器通常比这里显示的要复杂，但我们目前的目的是仅仅是查看事件处理机制的工作原理。在接下来的章节和后续章节中，我们经常会在真实的上下文中重新实现事件处理器，包括\
  \ `paintEvent()` 和 `resizeEvent()`，以及 `contextMenuEvent()`、`wheelEvent()`、`keyPressEvent()`\
  \ 和 `mousePressEvent()`，这些都在真实的上下文中完成。在本章的最后一节中，我们将重新实现一些与拖放相关的事件。\n\n### 使用剪贴板\n\
  \nPyQt 为位于 `QTextEdit`、`QLineEdit`、`QTableWidget` 以及其他可以编辑文本数据的小控件提供了剪贴板支持。PyQt\
  \ 的剪贴板和拖放系统使用 `MIME`（多用途互联网邮件扩展）格式的数据，这种格式可以用于存储任何任意数据。\n\n偶尔，在代码中直接将数据传递到剪贴板或从剪贴板检索数据是非常方便的。PyQt\
  \ 让这变得简单。`QApplication` 类提供了一个静态方法，返回一个 `QClipboard` 对象，我们可以通过该对象向剪贴板设置或获取文本、图像或其他数据。\n\
  \n剪贴板一次只保存一个对象，因此如果我们设置了（例如）一个字符串，然后设置了一个图像，那么只有图像是可，因为字符串在设置图像时会被删除。\n\n以下是我们在剪贴板上设置文本的方法：\n\
  \n```python\nclipboard = QApplication.clipboard()\nclipboard.setText(\"I've been\
  \ clipped!\")\n```\n\n文本是以纯文本形式设置的；我们将很快看到如何处理 HTML。\n\n```python\nclipboard = QApplication.clipboard()\n\
  clipboard.setPixmap(QPixmap(os.path.join(\nos.path.dirname(__file__), \"images/gvim.png\"\
  )))\n```\n\n可以使用针对 `QImages` 的 `setImage()`，或者像我们这里这样针对 pixmaps 使用 `setPixmap()`\
  \ 来在剪贴板上设置图像数据。`QImage` 和 `QPixmap` 均能处理多种标准图像格式。\n\n从剪贴板检索数据同样简单：\n\n```python\n\
  clipboard = QApplication.clipboard()\nself.textLabel.setText(clipboard.text())\n\
  ```\n\n如果剪贴板没有文本——例如，如果它有一张图像或某些自定义数据类型——`QClipboard.text()` 将返回一个空字符串。\n\n```python\n\
  clipboard = QApplication.clipboard()\nself.imageLabel.setPixmap(clipboard.pixmap())\n\
  ```\n\n如果剪贴板没有图像——例如，如果它有文本或某些自定义数据类型——`QClipboard.pixmap()` 将返回一个空图像。\n\n除了处理纯文本和图像，我们还可以处理其他类型的数据。例如，这里是我们将\
  \ HTML 文本复制到剪贴板的方法：\n\n```python\nmimeData = QMimeData()\nmimeData.setHtml(\"<b>Bold\
  \ and <font color=red>Red</font></b>\")\nclipboard = QApplication.clipboard()\n\
  clipboard.setMimeData(mimeData)\n```\n\n如果想检索 HTML 文本，包括封装在 `QMimeData` 对象中的 HTML，可以使用\
  \ `QClipboard.text(\"html\")`。如果没有文本或文本不是 HTML 格式（例如，它是纯文本），它将返回一个空字符串。以下是检索封装在\
  \ `QMimeData` 对象中的数据的通用方法：\n\n```python\nclipboard = QApplication.clipboard()\n\
  mimeData = clipboard.mimeData()\n```\n\n```python\nif mimeData.hasHtml():\n    self.textLabel.setText(mimeData.html())\n\
  ```\n\n在某些情况下，我们想要在剪贴板中设置和获取自己的自定义数据格式。我们可以使用 `QMimeData` 类来实现此，正如我们在下一节中看到的。\n\n\
  设置在剪贴板上或从剪贴板检索的数据通常作用于操作系统的全局剪贴板。此外，通过指定剪贴板模式，可以使用选择剪贴板（Linux 和其他使用 `X Window System`\
  \ 的系统上的额外剪贴板）或 Mac OS X 上的查找板。\n\n## 拖放\n\n许多 `PyQt` 控件开箱支持拖放，只需要我们开启支持即可使其工作。例如，图\
  \ 10.2 所示的应用程序开始时左侧的 `QListWidget` 有项目，而中间的 `QListWidget` 或右侧的 `QTableWidget` 是空的。\n\
  \n截图显示了在某些项目被拖放后的应用程序。\n\n应用程序的源代码位于文件 `chap10/draganddrop.pyw` 中。\n\n**图 10.2**\
  \ *PyQt 的内置拖放功能*\n\n拖放功能完全通过设置所涉及控件的属性来实现。以下是创建左侧列表控件的代码：\n\n```python\nlistWidget\
  \ = QListWidget()\nlistWidget.setAcceptDrops(True)\nlistWidget.setDragEnabled(True)\n\
  ```\n\n中间的列表控件类似，不同在于我们设置为图标视图模式而不是列表视图模式：\n\n```python\niconListWidget = QListWidget()\n\
  iconListWidget.setAcceptDrops(True)\niconListWidget.setDragEnabled(True)\niconListWidget.setViewMode(QListWidget.IconMode)\n\
  ```\n\n让 `QTableWidget` 支持拖放的方法相同，只需调用 `setAcceptDrops(True)` 和 `setDragEnabled(True)`。\n\
  \n不需要其他代码；所示内容已足够允许用户进行操作。\n\n### 处理自定义数据\n\n在某些情况下，我们想要在剪贴板中设置和获取自己的自定义数据格式。我们可以使用\
  \ `QMimeData` 类来实现，正如我们在下一节中看到的。\n\n内置的拖放功能非常方便，但如果我们需要能够处理自定义数据，必须重新实现某些处理器。\n\n\
  图 10.3 所示的应用程序支持自定义数据的拖放，特别是图标和文本。处理自定义数据（源代码在 `chap10/customanddrop.pyw` 中）。图标和文本可以从左侧列表控件拖到右侧列表控件（处于图标模式），或拖到右下角的文本编辑框——尽管在这种情况下只使用了文本。\n\
  \n**图 10.3** *拖放自定义数据*\n\n对于放在剪贴板或被 `PyQt` 拖放系统使用的自定义数据，我们使用 `QMimeData` 对象以及自定义的\
  \ MIME 类型。MIME 数据具有类型和子类型——例如 `text/plain`、`text/html` 或 `image/png`。处理自定义 MIME\
  \ 数据我们需要选择自定义类型和子类型，并将数据封装在 `QMimeData` 对象中。\n\n对于此示例，我们创建了 MIME 类型 `application/x-icon-and-text`。子类型以\
  \ `x-` 开头是良好的做法。我们将数据存储在 `QByteArray` 中（可调整大小的字节数组），对于此示例包含一个 `QString` 和一个 `QIcon`，尽管它可以包含任意数据。\n\
  \n我们将首先查看如何创建一个可以接受 `application/x-icon-and-text` MIME 类型的 `QLineEdit` 子类，利用文本并忽略图标。\n\
  \n```python\nclass DropLineEdit(QLineEdit):\n    def __init__(self, parent=None):\n\
  \        super(DropLineEdit, self).__init__(parent)\n        self.setAcceptDrops(True)\n\
  \n    def dragEnterEvent(self, event):\n        if event.mimeData().hasFormat(\"\
  application/x-icon-and-text\"):\n            event.accept()\n        else:\n   \
  \         event.ignore()\n```\n\n当用户拖过文本编辑框时，如果拖拽的 MIME 数据是我们可以处理的类型，我们将显示一个图标；否则文本编辑框将显示“不可投放”图标。通过接受拖入事件，我们表示可以接受此类\
  \ MIME 数据的数据。用于接受数据的图标在拖放启动时设置，我们稍后可见。\n\n\n\n\n由于我们在初始化函数中设置了 `accept drops`，`PyQt`\
  \ 会在需要时自动调用拖拽相关的事件处理器。\n\n```python\ndef dragMoveEvent(self, event):\n    if event.mimeData().hasFormat(\"\
  application/x-icon-and-text\"): \n        event.setDropAction(Qt.CopyAction)\n \
  \       event.accept()\n    else:\n        event.ignore()\n```\n\n当用户在小部件上进行拖动时，会触发\
  \ `dragMoveEvent()`；我们希望数据被复制（而不是移动），因此我们相应地设置了落操作。\n\n```python\ndef dropEvent(self,\
  \ event):\n    if event.mimeData().hasFormat(\"application/x-icon-and-text\"): \n\
  \        data = event.mimeData().data(\"application/x-icon-and-text\")\n       \
  \ stream = QDataStream(data, QIODevice.ReadOnly)\n        text = QString()\n   \
  \     stream >> text\n        self.setText(text)\n        event.setDropAction(Qt.CopyAction)\n\
  \        event.accept()\n    else:\n        event.ignore()\n```\n\n# 拖放与 thả\n\n\
  如果用户将数据放到小部件上，我们必须处理它。我们通过让 `PyQt` 提取数据（一个 `QByteArray`），然后创建一个 `QDataStream` 来读取数据。`QDataStream`\
  \ 类可以对任何 `QIODevice` 流进行读写操作，包括文件、网络套接字、外部进程和字节数组。由于我们只对字符串感兴趣，因此我们只从字节数组中提取了它。请注意，为了能够向\
  \ `QDataStream` 写入或从其读取 `QIcons`，我们必须使用 `PyQt 4.1` 或更高版本。\n\n`DropLineEdit` 仅支持释放，因此在下一个示例中，我们将创建一个同时支持拖拽和释放的\
  \ `QListWidget` 子类。\n\n```python\nclass DnDListWidget(QListWidget):\n    def __init__(self,\
  \ parent=None):\n        super(DnDListWidget, self).__init__(parent)\n        self.setAcceptDrops(True)\n\
  \        self.setDragEnabled(True)\n```\n\n该初始化函数与我们之前使用的类似，不同之处在于我们启用了拖拽和释放。\n\n\
  ```python\ndef dragMoveEvent(self, event):\n    if event.mimeData().hasFormat(\"\
  application/x-icon-and-text\"): \n        event.setDropAction(Qt.MoveAction)\n \
  \       event.accept()\n    else:\n        event.ignore()\n```\n\n这与 `DropLineEdit`\
  \ 的 `dragMoveEvent()` 几乎相同；区别在于这里我们将落落操作设置为了 `Qt.MoveAction` 而不是 `Qt.CopyAction`。`dragEnterEvent()`\
  \ 的代码未显示：它与 `DropLineEdit` 相同。\n\n```python\ndef dropEvent(self, event):\n    if\
  \ event.mimeData().hasFormat(\"application/x-icon-and-text\"):\n        data = event.mimeData().data(\"\
  application/x-icon-and-text\")\n        stream = QDataStream(data, QIODevice.ReadOnly)\n\
  \        text = QString()\n        icon = QIcon()\n        stream >> text >> icon\n\
  \        item = QListWidgetItem(text, self)\n        item.setIcon(icon)\n      \
  \  event.setDropAction(Qt.MoveAction)\n        event.accept()\n    else:\n     \
  \   event.ignore()\n```\n\n这段代码再次与 `DropLineEdit` 类似，只是现在我们同时也想要图标和文本。要向 `QListWidget`\
  \ 添加一个项，我们必须创建一个新的 `QListWidgetItem` 并将列表部件（`self`）作为该项的父对象。\n\n```python\ndef startDrag(self,\
  \ dropActions):\n    item = self.currentItem()\n    icon = item.icon()\n    data\
  \ = QByteArray()\n    stream = QDataStream(data, QIODevice.WriteOnly)\n    stream\
  \ << item.text() << icon\n    mimeData = QMimeData()\n    mimeData.setData(\"application/x-icon-and-text\"\
  , data)\n    drag = QDrag(self)\n    drag.setMimeData(mimeData)\n    drag.setPixmap(icon.pixmap(64,\
  \ 64))\n    drag.setHotSpot(icon.pixmap(64, 64).rect().center())\n    return drag.exec_(dropActions)\n\
  ```\n\n\n\n\n标准 PyQt 控件提供的内置拖放支持非常易于设置和使用。然而，在某些情况下，我们需要拖放自定义的自定义数据类型。实现此点的代码并不难写，而且使用\
  \ `QByteArray` 可以确保我们能够拖放任何数量、任何 C++ 或 PyQt 数据类型的数据。但是，如果数据量非常大，传递一个代表数据的令牌（例如，数据结构中的索引位置）可能比传递数据本身更快且占用内存更少，并且仅在需要时才实际复制数据。\n\
  \n我们也可能完全跳过 PyQt 的拖放机制，通过重新实现鼠标事件处理器来构建自己的拖放系统。这听起来并不那么困难，但显然没有使用 PyQt 已经提供的功能那么方便。\n\
  \nPyQt 的事件处理系统非常强大，而且非常易于使用。在大多数情况下，使用高级别的信号与槽机制要简单得多，也合适。但当我们我们需要精细的控制和定制时，重新实现事件处理器将让我们获得所需的精确的外观和行为——我们将在下一章实现一些自定义控件时看到这一点的实际应用。\n\
  \n## 练习题\n\n修改 `DnDListWidget` 类，当用户释放鼠标时，在鼠标位置弹出一个包含两个选项：复制（Copy）和移动（Move）的菜单。修改\
  \ `dragMoveEvent()`，使其拖放动变为移动而不是复制。该菜单需要放在 `dropEvent()` 中，且在创建新列表项*之前*创建。\n\n`QMenu.exec_()`\
  \ 方法接收一个 `QPoint` 参数，告诉它弹出何处；`QCursor.pos()` 方法提供当前的鼠标位置。释放事件的拖放动作必须根据用户的选择设置为复制或移动。\n\
  \n`startDrag()` 方法需要稍作修改：必须向 `start()` 调用同时提供移动和复制操作作为可接受的操作，并且只有在用户选择移动时才删除该项。\n\
  \n最具有挑战性的部分是是决定如何响应菜单操作。例如，你可以使用 `functools.partial()` 或 `lambda` 函数。在模型解决方案中，我们仅使用一个存储拖放动作的实例变量，并编写两个方法：一个将拖放动作设置为移动，另一个设置为复制，然后简单地将菜单操作连接到这些方法上。\n\
  \n另一种微妙的方法也是可行的。与其使用弹出菜单，不如是在移动移动事件中检查键盘修饰符，默认将拖放动作设置为移动，或者在按下 Ctrl 键时设置为复制。同样，在释放事件中根据\
  \ Ctrl 键的状态设置拖放动作。这比弹出菜单侵入性小，但对于普通或新手用户来说也不那么直观。\n\n在解决方案中，我们创建了两个 `QListWidget`\
  \ 子类 `DnDMenuListWidget` 和 `DndCtrlListWidget`，以展示这两种方法。只需要添加或更改约 25 行代码（一旦你复制/粘贴了\
  \ `DndListWidget` 并重命名了两个版本），即可实现此处描述的两种方法。\n\n文件 `chap10/customdraganddrop_ans.pyw`\
  \ 提供了相应的模型解决方案。\n\n## 自定义控件\n\nPyQt 最伟大且最持久的优势之一就是创建自定义控件的便利性。我们使用 PyQt 创建的自定义控件与标准内置控件的制作相同，因此它们可以无缝集成，并且在外观或行为上没有任意的限制。\n\
  \n在 PyQt 中创建自定义控件并不是“一刀切”的问题。相反，我们可以从许多方法中选择，这些方法让我们对控件的行为和外观拥有日益增加的控制水平。\n\n最基础的定制级别只是简单地设置现有控件的一些属性。我们在前面的章节中已经这样做过多次。例如，在上一章中，我们通过在控件上调用\
  \ `setAcceptDrops(True)` 和 `setDragEnabled(True)` 启用了 PyQt 的默认拖放行为。对于数值框（spinboxes），我们可以限制它们的行为——例如通过调用\
  \ `setRange()` 设置最小值和最大值——并可以使用 `setPrefix()` 和 `setSuffix()` 来影响它们的外观。\n\n我们本章不会展示这种方法的示例，因为我们已经多次看到过它的应用。\n\
  \n如果设置现有控件的属性仍然不够，我们可以使用样式表（style sheet）来定制控件的外观某些行为方面。\n\n### Qt\n\n在控件上设置样式表的功能是从\
  \ Qt 4.2 开始引入的，我们将在本章看到一个简单的示例，以了解这种可能性。\n\n有时，我们需要的不仅仅是定制某个特定的控件，而是创建一个结合了两个或多个其他控件的复合控件。我们将查看如何实现此点的简单示例。\n\
  \n如果我们需要更改现有控件的行为，超了设置属性能实现的范围，我们可以对控件进行子类化，并重新实现所需的事件处理器以实现我们想要的控制。\n\n但在某些情况下，我们需要一个与任何标准内置控件都不同的控件。对于这些情况，我们可以直接对\
  \ `QWidget` 进行子类化，并完全定义控件的行为和外观。我们将展示这两个示例：第一个是一个可以在许多地方和应用程序中使用的“通用”控件，第二个是仅为一个程序创建的特定应用程序的控件。\n\
  \n## 使用控件样式表\n\n我们已经看到了许多通过更改属性来定制控件的示例。其中一些影响了控件的行为，例如设置 `QSpinBox` 的范围，另一些则影响了控件的外观，例如设置\
  \ `QLabel` 的边框。Qt 4.2 引入了一个新的控件属性：样式表属性。该属性持有一个 `QString` 并使用了借自 HTML 的 CSS（级联样式表）语法。\n\
  \n图 11.1 中的截图显示了一个设置了样式表的对话框。样式表适用于设置它的那个控件以及该控件的所有子控件。在这种情况下，我们将组合框（combobox）设置为深蓝色文本，将编辑框设置为深绿色文本。我们还为“强制”的编辑框设置了黄色背景。\n\
  \n### PyQt\n\nPyQt 控件没有“强制”属性，但从 Qt 4.2 开始，可以动态向 `QObject` 添加属性。注意，Qt 属性与 Python\
  \ 属性不同——例如，它们通过 `property()` 和 `setProperty()` 进行访问。从 PyQt 4.2 开始，`QtCore.pyqtProperty()`\
  \ 函数可以创建同时是 Python 和 Qt 属性属性。\n\n```python\nself.lineedits = (self.forenameEdit,\
  \ self.surnameEdit,\nself.companyEdit, self.phoneEdit,\nself.emailEdit)\n\nfor lineEdit\
  \ in self.lineedits:\n    lineEdit.setProperty(\"mandatory\", QVariant(True))\n\
  ```\n\n样式表在 Mac OS X 上不受正式支持，因此它们的行为可能不可预测。预计从 Qt 4.4 开始将获得支持。\n\n```python\nself.connect(lineEdit,\
  \ SIGNAL(\"textEdited(QString)\"),\nself.updateUi)\n```\n\n前面的代码来自表单的初始化函数。信号与槽连接将在稍后讨论。\n\
  \n\n\n\n我们将样式表作为类静态变量为小部件创建，并在构造函数的末尾将其设置在表单上。我们也可以同样地从文件中读取样式表（因为它仅仅是纯文本），或者从 PyQt\
  \ 资源文件中读取。\n\n```python\nStyleSheet = \"\"\"\nQComboBox { color: darkblue; }\nQLineEdit\
  \ { color: darkgreen; }\nQLineEdit[mandatory=\"true\"] {\nbackground-color: rgb(255,\
  \ 255, 127);\ncolor: darkblue;\n}\n\"\"\"\n```\n\n```python\nself.setStyleSheet(ContactDlg.StyleSheet)\n\
  ```\n\n样式表语法本质上由“选择器”和属性名：值对组成。在前面的代码段中，第一行有一个选择器为 `QComboBox`，这意味着它的属性值将应用于任何 `QComboBox`\
  \ 或作为设置了样表的部件子部件的 `QComboBox` 子类。在这种情况下，效果是将文本颜色设置为深蓝色。第二个选择器是 `QLineEdit`，其工作原理类似。\n\
  \n第三个选择器更为具体：它同时指定了一个类以及该类的一个必须匹配状态的属性。换句话说，这第三个选择器将仅适用于具有“mandatory”属性且该属性值为 True\
  \ 的 `QLineEdit` 及其 `QLineEdit` 子类。对于此类情况，背景颜色设置为黄色（指定为 RGB 三元组），文本颜色设置为深蓝色。\n\n\
  该对话框比初看起来要微妙一些。这是因为公司行编辑（company line edit）只有在类别组合框（category combobox）设置为“Business”时才是强制性的性的。为了实现这一点，我们需要之前显示的信号-槽连接，以及另一个连接：\n\
  \n```python\nself.connect(self.categoryComboBox, SIGNAL(\"activated(int)\"), self.updateUi)\n\
  ```\n\n所有连接都指向 `updateUi()` 方法：\n\n```python\ndef updateUi(self):\n    mandatory\
  \ = self.companyEdit.property(\"mandatory\").toBool() if self.categoryComboBox.currentText()\
  \ == \"Business\":\n    if not mandatory:\n        self.companyEdit.setProperty(\"\
  mandatory\", QVariant(True))\n    elif mandatory:\n        self.companyEdit.setProperty(\"\
  mandatory\", QVariant(False)) if mandatory != \\\n        self.companyEdit.property(\"\
  mandatory\").toBool():\n            self.setStyleSheet(ContactDlg.StyleSheet)\n\
  \    enable = True\n    for lineEdit in self.lineedits:\n        if lineEdit.property(\"\
  mandatory\").toBool() and \\\n            lineEdit.text().isEmpty():\n         \
  \   enable = False\n            break\n        self.buttonBox.button(QDialogButtonBox.Ok).setEnabled(enable)\n\
  ```\n\n如果用户更改了类别，我们必须重新应用样式表以强制小部件重新设置样式。这确保了公司行编辑的背景根据其是否为强制性正确设置为白色或黄色。遗憾的是，在较慢的机器上，重置样式表时会有轻微闪烁——因此我们使用了稍微冗长的代码来确保仅在需要时重新应用样式表。对于启用、选中和悬停等“伪状态”的更改，没有必要重新应用样式表。\n\
  \n样式表的语法比这个简单示例所暗示的丰富得多，也强大得多。例如，如果我们在选择器前加一个点，如 `.QLineEdit`，则该选择器将仅适用于指定的类，而不适用于其子类。如果我们想让一个选择器应用于某个特定的部件，可以在该部件上调用\
  \ `setObjectName()`，然后将该名称作为选择器的一部分。\n\n例如，如果我们有一个对象名为“findButton”的按钮，那么仅适用于该按钮的选择器将是\
  \ `QPushButton#findButton`。\n\n某些小部件具有“子控件”。例如，`QComboBox` 有一个箭头，用户可以点击它使其列表下拉。子控件可以作为选择器的一部分指定——例如\
  \ `QComboBox::drop-down`。可以使用单冒号指定伪状态——例如 `QCheckBox:checked`。\n\n除了设置颜色外，样式表还可以用于设置字体、边框、外边距、内边距和背景。实验简单样式表的一种快速方便的方法是运行\
  \ `Qt Designer`，创建一个新表单，将一些小部件拖到表单上，然后为表单输入并编辑样式表。\n\n样式表可以设置在表单的特定部件上，也可以设置在表单（`QDialog`\
  \ 或 `QMainWindow`）本身上。在两种情况下，样式表都将自动应用于任何子部件。为整个应用程序设置单个样式表也是可能的（而且常见），在这种情况下，我们在\
  \ `QApplication` 对象上设置它。\n\n## 创建复合小部件\n\n复合小部件是由两个或多个其他小部件组成的小部件。\n\n我们已经是复合小部件的创建者了：例如，我们创建的每个对话框都是复合小部件。我们为一个已经涵盖过的话题分配了一些空间，因为与我们之前创建的对话框（是\
  \ `QDialog` 子类）不同，我们想要创建不是对话框的复合小部件，而是可以使用对话框内部（或作为主窗口的中央部件）。\n\n我们想要的复合小部件类型与对话框非常相似：我们创建子部件，对它们进行布局，并进行所需的任何信号-槽连接。主要的区别是继承自\
  \ `QWidget` 而不是 `QDialog`。\n\n**图 11.2** 使用标签小部件的对话框\n\n图 11.2 中的截图看起来像是一个传统的对话框，但实际上我们只显式地创建了六个小部件，而不是十二个。\n\
  \n这是因为我们使用了四个自定义的 `LabelledEdit`、一个自定义的 `LabelledTextEdit` 以及一个 `QButtonBox`。\n\n\
  我们的标签编辑器在两个方面很特殊：首先，它们会自动设置伙伴关系（buddy relationships），其次它们可以将标签布局在编辑部件的左侧或上方。\n\n\
  ```python\nself.zipcode = LabelledLineEdit(\"&Zipcode:\")\nself.notes = LabelledTextEdit(\"\
  &Notes:\", ABOVE)\n```\n\n创建标签编辑器非常简单，正如这段表单初始化器的代码所示。`LabelledLineEdit` 将其部件暴露为实例变量，因此我们可以访问\
  \ `LabelledLineEdit.label`（`QLabel`）和 `LabelledLineEdit.lineEdit`（`QLineEdit`）。`LabelledTextEdit`\
  \ 具有相同的标签，并有一个用于其 `QTextEdit`。`ABOVE` 只是一个模块常量；还有一个对应的 `LEFT`。\n\n```python\nclass\
  \ LabelledLineEdit(QWidget):\n    def __init__(self, labelText=QString(), position=LEFT,\
  \ parent=None):\n        super(LabelledLineEdit, self).__init__(parent)\n      \
  \  self.label = QLabel(labelText)\n        self.lineEdit = QLineEdit()\n       \
  \ self.label.setBuddy(self.lineEdit)\n        layout = QBoxLayout(QBoxLayout.LeftToRight\
  \ if position == LEFT else QBoxLayout.TopToBottom)\n        layout.addWidget(self.label)\n\
  \        layout.addWidget(self.lineEdit)\n        self.setLayout(layout)\n```\n\n\
  前面的代码是完整的 `LabelledLineEdit` 类。如果我们想对其标签或行编辑连接信号和槽，我们可以通过直接访问来实现，因为它们被持有一个公共实例变量。我们没有使用\
  \ `QVBoxLayout` 或 `QHBoxLayout`，而是使用了它们的基类，以便在创建标签行编辑时设置布局方向。我们不会显示 `LabelledTextEdit`\
  \ 的代码，因为它唯一的区别在于我们创建的是 `QTextEdit` 而不是 `QLineEdit`，并将其称为 `textEdit` 而不是 `lineEdit`。\n\
  \n虽然我们完全通过代码创建了复合标签编辑部件，但可以使用 Qt Designer 创建复合小部件，并基于“Widget”模板。\n\n重复使用的复合小部件可以在大型项目中节省时间。当我们想要创建一个中央部件必须由两个或多个小部件组成的主窗口风格应用程序，且使用\
  \ MDI 工作空间、分割器或停靠窗口不是合适的解决方案时，它们也非常有用。\n\n\n\n\n有时，我们需要一个外观和行为上与现有部件相似的部件，但其所需的定制程度超过了使用样式表或设置其他部件属性所能实现的范围。在这种情况下，我们可以对相似的部件进行子类化并根据我们的需求进行定制。★\n\
  \n为了演示如何对现有部件进行子类，假设我们需要一个基于罗马数字而不是十进制的数值计数器（spinbox），如图 11.3 所示。只要我们知道如何将整数转换为罗马数字字符串并反之，那么为此目的对\
  \ `QSpinBox` 进行子类就很简单。\n\n★附录 B 提供了选定的 PyQt 部件截图和简要描述，附录 C 显示了选定的 PyQt 类层次结构。\n\n\
  ![Image 55](img/index-342_1.png)\n\n### 内置部件子类化\n\n327\n\n**图 11.3** *罗马计数器*\n\n\
  在对计数器进行子类时，我们需要重新实现三个方法：`validate()`，计数器用它防止输入无效数据；`valueFromText()`，用于将用户输入的文本转换为整数；以及\
  \ `textFromValue()`，用于将整数转换为其文本表示。我们还需要在初始化器中进行一些设置，因此从该方法开始。\n\n```python\nclass\
  \ RomanSpinBox(QSpinBox):\n    def __init__(self, parent=None):\n        super(RomanSpinBox,\
  \ self).__init__(parent)\n        regex = QRegExp(r\"^M?M?M?(?:CM|CD|D?C?C?C?)\"\
  \n                        r\"(?:XC|XL|L?X?X?X?)(?:IX|IV|V?I?I?I?)$\")\n        regex.setCaseSensitivity(Qt.CaseInsensitive)\n\
  \        self.validator = QRegExpValidator(regex, self)\n        self.setRange(1,\
  \ 3999)\n        self.connect(self.lineEdit(), SIGNAL(\"textEdited(QString)\"),\
  \ self.fixCase)\n```\n\nPyQt 提供了自己的正则表达式类，其语法与 Python 的 `re` 模块使用的语法非常相似。主要区别在于\
  \ `QRegExp` 不支持非贪婪量符，尽管它允许整个正则表达式是非贪婪的。正则表达式列出了哪些字母组合构成了 1–3999 范围内有效的罗马数字。★\n\n\
  我们让正则表达式不区分大小写，因为我们并不在乎用户输入的是大写还是小写字母——反正，我们会自己强制将输入转换为大写。验证器可以是 PyQt 预定义的验证器之一（用于整数和浮点数），也可以基于正则表达式（如我们在这里使用的这种）。信号与槽连接的设置方式使得，每当用户输入任何文本时，我们都可以将其强制转换为大写。\n\
  \n```python\ndef fixCase(self, text):\n    self.lineEdit().setText(text.toUpper())\n\
  ```\n\n`QSpinBox` 拥有一个 `QLineEdit` 组件，并提供了一个访问方法来获取它。我们利用它来将用户输入的任何内容转为大写。（用户无法输入如“A”、“B”、“1”或“2”之类的无效字符，因为验证器不会接受它们。）★该正则表达式改编自\
  \ Mark Pilgrim 所著的 *Dive into Python* 书中的一个示例。\n\n328\n\n*第 11 章 自定义部件*\n\n```python\n\
  def validate(self, text, pos):\n    return self.validator.validate(text, pos)\n\
  ```\n\n我们必须提供一个 `validate()` 方法。每当用户更改文本时，此方法都会被调用，因为这种行为是 `QSpinBox` API 的一部分。我们可以简单地将工作交给我们在初始化器中创建的验证器对象。\n\
  \n```python\ndef valueFromText(self, text):\n    return intFromRoman(unicode(text))\n\
  ```\n\n如果用户输入文本，计数器需要知道它所代表的整数值。我们只需将其传递给改编自 *Python Cookbook* 中“罗马数字”食谱的 `intFromRoman()`\
  \ 函数。\n\n```python\ndef textFromValue(self, value):\n    return romanFromInt(value)\n\
  ```\n\n计数器必须能够将整数转换为文本表示——例如，当调用 `setValue()` 或用户使用计数器按钮增加或减少值时。我们再次将工作交给，这次是交给一个\
  \ `romanFromInt()` 函数，该函数改编自 *Python Cookbook* 中对“十进制转罗马数字”食谱的反馈。\n\n`RomanSpinBox`\
  \ 可以用于任何使用传统 `QSpinBox` 的地方，唯一的限制是它能够处理的数字范围。对现有部件进行子类化的更复杂的示例请见第 13 章，其中使用 `QTextEdit`\
  \ 创建了 `RichTextLineEdit`。\n\n### QWidget 子类化\n\n当我们无法通过设置属性、使用样式表或对现有部件进行子类化来获取所需的自定义部件时，我们可以从零开始创建所需的部件。在实践中，我们总是通过子类化\
  \ `QWidget` 来创建自定义部件，因为这提供了许多我们不需要或不想担心的幕后便利，让我们能够自由专注于重要的事情：我们自定义部件的外观和行为。\n\n\
  在本节中，我们将查看两个不同的自定义部件。第一个 `FractionSlider` 是一个通用的“范围控制”类型部件，可能会被多次使用。第二个 `YPipeWidget`\
  \ 是一个特定应用程序部件，可能在一个特定的程序中需要。\n\n在进入这两个部件的细节之前，我们首先讨论 PyQt 中的绘画以及坐标系统。`QPainter`\
  \ 有两个独立的坐标系统：设备（物理）系统和逻辑系统。默认情况下，逻辑系统匹配部件的区域。事实上，物理坐标并不一定等于像素。在 PyQt 术语中，物理系统被称为“viewport”（Viewport）。\n\
  \n329\n\n*QWidget 子类化*\n\n对于大多数部件，矩形区域效果良好，但在某些情况下——例如如果我们真的希望逻辑窗口是正方形——我们可以更改视图，以便只操作部件区域的一部分。\n\
  \n![Image 55](img/index-342_1.png)\n\n**图 11.4** *Viewport 和窗口系统* 在图 11.4 中，我们有一个尺寸为\
  \ 800 ×600 的物理部件。通过调用 `setWindow(-60, -60, 120, 120)`，我们可以创建一个左上角为 (-60, -60)、宽度为\
  \ 120、高度为 120 且位于点 (0, 0) 的“窗口”。逻辑系统会被 QPainter 自动映射到底层设备。在调用 `setWindow()` 之后，所有的绘画都在逻辑系统中进行。在这种情况下，部件是矩形的，但我们的窗口宽高相等。\n\
  \n3\n\n这段代码在部件的 `paintEvent()` 中执行，会将部件的视图更改为最大的居中正方形区域。\n\n```python\nside = min(self.width(),\
  \ self.height())\npainter.setViewport((self.width() - side) / 2,\n             \
  \       (self.height() - side) / 2, side, side)\n```\n\n在之前的示例中，这将产生一个 600 × 600\
  \ 像素的视图，没有顶部或底部边距，但在左右各有一个 100 像素的边距。窗口现在将是一个精确的正方形，我们在其中绘制的任何内容的宽高比都将保持。\n\n330\n\
  \n*第 11 章 自定义部件*\n\n**表 11.1** *选定的 QWidget 方法*\n\n| 语法 |  |\n| :--- | :--- |\n\
  | `w.addAction(a)` | 将 `QAction` `a` 添加到 `QWidget` `w`；用于右键菜单 |\n| `w.close()` |\
  \ 隐藏 `QWidget` `w`；如果设置了 `Qt.WA_DeleteOnClose` 则删除它 |\n| `w.hasFocus()` | |\n\n\n\
  \n\n如果 `QWidget` `w` 拥有键盘焦点，则返回 True\n\n`w.height()`\n返回 `QWidget` `w` 的高度\n\n`w.hide()`\n\
