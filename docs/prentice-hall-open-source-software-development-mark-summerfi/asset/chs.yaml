  \ `fileSave()` 方法。\n\n我们必须考虑的最后一个文件操作是“文件打印”。当此操作被调用时，会执行 `filePrint()` 方法。该方法在打印机上绘制图像。由于该方法使用了我们尚未涵盖的技术，我们将推迟对其进行讨论。它所使用的技术显示在“打印\
  \ 打印图像”侧边栏中，而 `filePrint()` 方法本身的介绍在第 13 章（从第 400 页开始），在那里我们还会讨论普通文档打印的方法。\n\n我们还没有回顾唯一的文件操作是“文件退出”。该操作连接到主窗口的\
  \ `close()` 方法，该方法反过来导致一个关闭事件被放入事件队列。我们为 `closeEvent()` 处理器提供了 `Event()` 的重新实现，在该处理器中，我们通过调用\
  \ `okToContinue()` 确保用户有机会保存未保存的更改，并保存应用程序的设置。\n\n## 处理编辑操作\n\n文件操作的大部分功能由 `MainWindow`\
  \ 子类本身提供。唯一传递的工作是图像的加载和保存，这需要 `QImage` 实例变量完成。主窗口与持有数据的数据结构之间这种职责分工非常常见。主窗口处理高层文件新建、打开、保存和最近使用文件的功能，而数据结构处理加载和保存。\n\
  \n大多数、甚至所有的编辑功能由视图小部件或数据结构提供也是常见的。在 Image Changer 应用程序中，所有数据操作都由数据结构（图像 `QImage`）处理，而数据的呈现由数据查看器（图像标签\
  \ `imageLabel QLabel`）处理。再次，这是一种非常常见的职责分工。\n\n在本节中，我们将回顾大多数编辑操作，省略几个与显示的内容几乎相同的操作。我们将在这里写得非常简洁，因为这些功能特定于\
  \ Image Changer 应用程序。\n\n```python\ndef editInvert(self, on):\n    if self.image.isNull():\n\
  \        return\n    self.image.invertPixels()\n    self.showImage()\n    self.dirty\
  \ = True\n    self.updateStatus(\"Inverted\" if on else \"Uninverted\")\n```\n\n\
  如果用户调用“编辑反转”操作，它将被选中（或取消选中）。在任何情况下，我们都使用 `QImage` 提供的功能反转图像像素，显示更改后的图像，设置 `dirty`\
  \ 标记并调用 `updateStatus()`以便状态栏短暂显示执行的操作，并在日志中添加额外项目。\n\n`editSwapAndBlue()` 方法（未显示）与之相同，只是它使用了\
  \ `QImage.rgbSwapped()` 方法，并且有不同的状态文本。\n\n```python\ndef editMirrorHorizontal(self,\
  \ on):\n    if self.image.isNull():\n        return\n    self.image = self.image.mirrored(True,\
  \ False)\n    self.showImage()\n    self.mirroredhorizontally = not self.mirroredhorizontally\n\
  \    self.dirty = True\n    self.updateStatus(\"Mirrored Horizontally\" \\\n   \
  \ if on else \"Unmirrored Horizontally\")\n```\n\n该方法在结构上与 `editInvert()` 和 `editSwapAndBlue()`\
  \ 相同。`QImage.mirrored()` 方法两个两个尔标志，第一个用于水平镜像，第二个用于垂直镜像。在 Image Changer 应用程序中，我们刻意限制了允许的镜像，因此用户只能不镜像、垂直镜像或水平镜像，而不能同时进行水平垂直。我们还维护了一个跟踪图像是否水平镜像的实例变量。`editMirrorVertical()`\
  \ 方法（未显示）几乎相同。\n\n```python\ndef editUnMirror(self, on):\n    if self.image.isNull():\n\
  \        return\n    if self.mirroredhorizontally:\n            self.editMirrorHorizontal(False)\n\
  ```\n\n\n\n\n\n```python\nif self.mirroredvertically:\n    self.editMirrorVertical(False)\n\
  ```\n\n该方法会关闭正在生效的镜像设置，如果图像未镜像，则什么都不做。它不会设置脏标记（dirty flag）或更新状态：这些工作留给了 `editMirrorHorizontal()`\
  \ 或 `editMirrorVertical()`，如果它们调用了其中任何一个。\n\n应用程序提供了两种用户更改缩放因子的方法。用户可以与工具栏中的缩放数值框交互——它的\
  \ `valueChanged()` 信号连接到我们稍后将回顾的 `showImage()`槽——或者可以在“编辑”菜单中调用“编辑缩放”操作。如果使用了“编辑缩放”操作，就会调用\
  \ `editZoom()` 方法。\n\n```python\ndef editZoom(self):\n    if self.image.isNull():\n\
  \        return\n    percent, ok = QInputDialog.getInteger(self,\n        \"Image\
  \ Changer - Zoom\", \"Percent:\",\n        self.zoomSpinBox.value(), 1, 400)\n \
  \   if ok:\n        self.zoomSpinBox.setValue(percent)\n```\n\n## 处理用户操作\n\n我们首先使用\
  \ `QInputDialog` 类的静态方法之一来获取缩放因子。`getInteger()` 方法接收一个父对象（对话框将以此为中心对齐）、一个标题、描述所需数据的文本、一个初始值，以及可选的最小值和最大值。\n\
  \n`QInputDialog` 还提供了其他一些静态便利方法，包括用于获取浮点值的 `getDouble()`、用于从列表中选择字符串的 `getItem()`，以及用于获取字符串的\
  \ `getText()`。对于所有这些方法，返回值都是一个二元组，包含值和一个布尔标志，该标志指示用户是否输入并接受了有效值。\n\n如果用户点击了 OK，我们将缩放数值框的值设置为给定的整数。\n\
  \n如果此值与当前值不同，数值框将发射 `valueChanged()` 信号。该信号连接到 `showImage()` 槽，因此如果用户选择了新的缩放百分比值，该槽就会被调用。\n\
  \n```python\ndef showImage(self, percent=None):\n    if self.image.isNull():\n \
  \       return\n    if percent is None:\n        percent = self.zoomSpinBox.value()\n\
  \    factor = percent / 100.0\n    width = self.image.width() * factor\n    height\
  \ = self.image.height() * factor\n    image = self.image.scaled(width, height, Qt.KeepAspectRatio)\n\
  \    self.imageLabel.setPixmap(QPixmap.fromImage(image))\n```\n\n当创建或加载新图像时、每当应用变换时，以及响应缩放数值框的\
  \ `valueChanged()` 信号时，都会调用此槽。\n\n每当用户更改工具栏缩放数值框的值时都会发射此信号，无论是直接使用鼠标，还是通过之前描述的“编辑缩放”操作。\n\
  \n我们获取百分比并将其转换为可以用于生成图像新宽度和高度的缩放因子。然后，我们创建一个缩放到新尺寸并保持宽高比例的图像副本，并设置 `imageLabel`\
  \ 显示此图像。标签需要一个 `QPixmap` 图像，因此我们使用静态方法 `QPixmap.fromImage()` 将 `QImage` 转换为 `QPixmap`。\n\
  \n请注意，这种方式缩放图像对原始图像没有影响；它纯粹是视图的变化，而不是编辑。这就是为什么不需要设置脏标记的原因。\n\n根据 PyQt 的文档，`QPixmaps`\
  \ 针对屏幕显示进行了优化（因此绘制速度很快），而 `QImages` 则针对编辑进行了优化（这就是为什么我们使用它们来保存图像数据）。\n\n![Image\
  \ 24](img/index-215_1.png)\n\n## 第 6 章 主窗口\n\n### 处理帮助操作\n\n当我们创建主窗口的操作时，为每个操作都提供了帮助文本，并将其设置为它们的状态文本和工具提示文本。这意味着当用户浏览应用程序的菜单系统时，当前高亮菜单选项的状态文本将自动出现在状态栏中。\n\
  \n同样，如果用户将鼠标悬停在工具栏按钮上，相应的工具提示文本将显示在工具提示中。\n\n对于像 Image Changer 这样简单的小应用程序，状态提示和工具提示可能完全足够。尽管如此，我们仍然提供在线帮助系统来展示如何实现，尽管我们将内容推迟到第\
  \ 17 章（从第 510 页）。\n\n**图 6.10** 关于 Image Changer 的框\n\n无论是否提供在线帮助，提供一个“关于”框都是一个好主意。如图\
  \ 6.10 所示，它至少应该显示应用程序的版本号和版权声明。\n\n```python\ndef helpAbout(self):\n    QMessageBox.about(self,\
  \ \"About Image Changer\",\n    \"\"\"<b>Image Changer</b> v %s\n\n<p>Copyright\
  \ &copy; 2007 Qtrac Ltd.\n\nAll rights reserved.\n\n<p>This application can be used\
  \ to perform\n\nsimple image manipulations.\n\n<p>Python %s - Qt %s - PyQt %s on\
  \ %s\"\"\" % (\n    __version__, platform.python_version(),\n    QT_VERSION_STR,\
  \ PYQT_VERSION_STR, platform.system()))\n```\n\n`QMessageBox.about()` 静态便利方法会弹出一个带有给定标题和文本的模态\
  \ OK 样式消息框。文本可以是 HTML，如此处所示。如果应用程序有图标，消息框将使用该图标。\n\n我们显示了应用程序的版本以及 Python、Qt 和 PyQt\
  \ 库的版本信息，以及应用程序运行的平台。库的版本信息对用户来说可能没有直接用途，但对于被要求提供的支持人员来说可能非常有帮助。\n\n## 总结\n\n主窗口风格的应用程序是通过子类\
  \ `QMainWindow` 创建的。该窗口有一个小部件（可能是复合的，因此包含其他部件）作为其中心部件。\n\n操作用于表示应用程序向用户提供的功能。这些操作作为\
  \ `QAction` 对象持有，它们具有文本（用于菜单）、图标（同时用于菜单和工具栏）、工具提示和状态提示，并连接到槽，这些槽在被调用时将执行相应的操作。通常，所有操作都会添加到主窗口的菜单中，最常用的被添加到工具栏中。为了支持键盘用户，我们为频繁使用的操作提供了快捷键，并提供了菜单加速器以使菜单导航尽可能快速方便。\n\
  \n某些操作是可检查的，并且某些组可检查的操作可能是互斥的，也就是说在任何时候只有一个且仅有一个可以被选中。PyQt 通过设置单个属性来支持可检查操作，并通过\
  \ `QActionGroup` 对象支持互斥的操作组。\n\n停靠窗口（Dock windows）由停靠部件表示，易于创建和设置。任意小部件可以添加到停靠部件和工具栏中，尽管在实践中我们只向工具栏添加小型或长宽比形状的小部件。\n\
  \n操作、操作组和停靠窗口必须显式地赋予一个父对象——例如主窗口——以确保它们在正确的时间被删除。应用程序的其他小部件和 QObject 则不需要这样做，因为它们要么由主窗口拥有，要么由主窗口的某个子拥有。应用程序的非\
  \ QObject 对象可以留给 Python 的垃圾回收器删除。\n\n应用程序经常使用资源（小文件，如图标数据文件），PyQt 的资源机制使得访问和使用它们变得非常简单。尽管它们需要一个额外的构建步骤，即使用\
  \ PyQt 的 `pyrcc4` 控制台应用程序，或者使用书籍示例提供的 `mkpyqt.py` 或 Make PyQt 程序。\n\n对话框可以完全在代码中创建（正如我们在上一章中所做的那样），或者像我们在下一章看到的将使用\
  \ *Qt Designer*。如果我们需要在应用程序中整合 *Qt Designer* 用户界面文件，就像资源一样需要额外的构建步骤，即使用 PyQt 的 `pyuic4`\
  \ 控制台应用程序，或者再次使用 `mkpyqt.py` 或 Make PyQt。\n\n\n\n\n一旦通过设置中心部件以及创建菜单、工具栏以及可能的停靠窗口创建了主窗口的视觉外观，我们就可以考虑加载和保存应用程序设置了。许多设置会在主窗口的初始化函数中加载，而设置通常会在\
  \ `closeEvent()` 方法的重写中保存（并给用户提供保存未保存更改的机会）。\n\n![Image 25](img/index-217_1.png)\n\
  \n# 第 6 章. 主窗口\n\n如果我们想恢复用户的工作空间，即加载他们上一次运行程序时打开的文件，最好的方法是在主窗口初始化函数的末尾使用一个单次计时器（single-shot\
  \ timer）来加载文件。\n\n大多数应用程序通常有一个数据集以及一个或多个用于显示和编辑数据的部件。由于本章的重点是主窗口的用户界面基础设施，我们选择了最简单的数据和可视化部件，但在随后的章节中，重点将发生反转。\n\
  \n让主窗口处理层级文件操作和最近使用的文件列表，而让持有数据的对象负责加载、保存和编辑数据，这是非常常见的情况。\n\n在书的现在，你已经掌握了足够的 Python\
  \ 和 PyQt 来创建对话框风格和主窗口风格的 GUI 应用程序。在下一章中，我们将展示 `Qt Designer` 的用法，这是一个可以显著提高对话框开发和维护速度的应用程序。在第二部分的最后一个章节中，我们将结合使用\
  \ PyQt 和 Python 库来探索保存和加载自定义文件格式的一些关键方法。在第三和第四部分中，我们将更深入地探索 PyQt（例如查看事件处理和创建自定义部件），并广泛地学习\
  \ PyQt 的模型/视图架构和其他高级功能，包括线程。\n\n## 练习\n\n创建图 6.11 所示的对话框。它的类名应为 `ResizeDlg`，其初始化函数应接受初始宽度和高度。对话框应提供一个名为\
  \ `result()` 的方法，该方法必须返回用户选择的宽度和高度二元组。数值调节框（spinboxes）的最小值为 4，最大值为传入宽度（或高度）的倍。两者都应右对齐显示内容。\n\
  \n**图 6.11** Image Changer 调整大小对话框\n\n修改 Image Changer 应用程序，添加一个新的“编辑调整大小”（edit\
  \ resize）动作。\n\n该动作应该出现在编辑菜单中（在“编辑缩放”动作之后）。图像子目录下有一个名为 `editresize.png` 的图标，但需要将其添加到\
  \ `resources.qrc` 文件中。你还需要导入刚刚创建的调整大小对话框。\n\n调整大小对话框应该在一个 `editResize()` 槽中使用，“编辑调整大小”动作应该连接到该槽。对话框的使用方式如下：\n\
  \n```python\nform = resizedlg.ResizeDlg(self.image.width(),\n                  \
  \        self.image.height(), self)\nif form.exec_():\n    width, height = form.result()\n\
  ```\n\n与 `editZoom()` 槽不同，图像本身应该被更改，因此如果尺寸发生了，尺寸标签、状态栏和脏状态（dirty status）都必须更改。相反，如果“新”尺寸与原始尺寸相同，则不应进行调整大小。\n\
  \n调整大小对话框可以用少于 50 行编写，调整大小槽可以用少于 20 行编写，新动作只需在主窗口初始化函数的几处额外增加一两行。\n\n模型解决方案位于 `chap06/imagechanger_ans.pyw`\
  \ 和 `chap06/resizedlg.py` 文件中。\n\n![Image 26](img/index-220_1.jpg)\n\n# 7\n- 设计用户界面\n\
  - 实现对话框\n- 测试对话框\n\n# 第 7 章 简介\n\n## Qt Designer\n\n在第 5 章中，我们完全通过编写代码来创建对话框。在初始化函数中，我们创建了需要的部件并设置了它们的初始属性。然后我们创建了一个或多个布局管理器，向其中添加部件以获得想要的外观。在某些情况下，当处理垂直或水平布局时，我们添加了“拉伸”（stretch）来填充不需要的空间。\n\
  \n在布局好部件后，我们将感兴趣的信号连接到我们想要处理它们的方法上。\n\n**图 7.1** Qt Designer\n\n一些程序员倾向于在代码中完成一切，而另一些人则倾向于使用视觉设计工具来创建他们的对话框。使用\
  \ PyQt，我们可以任选其一，甚至兼顾。\n\n上一章的 Image Changer 应用程序有两个自定义对话框：完全通过代码创建（在练习中）的 `ResizeDlg`，以及使用\
  \ `Qt Designer` 创建的 `NewImageDlg`。我们首先展示了如何通过代码进行操作，这样你就能对布局管理器的工作原理有强烈的感受。但在本章中，我们将使用\
  \ `Qt Designer` 创建对话框，如图 7.1 所示。\n\n`Qt Designer` 可用于为对话框、自定义部件和主窗口创建用户界面。我们只涵盖对话框；自定义部件几乎相同，只是它们是基于“Widget”模板而不是“Dialog”模板之一。除了具有视觉化\
  \ `QAction` 编辑器的便利性外，为主窗口使用 `Qt Designer` 提供的优势较少。`Qt Designer` 还可以用于创建和编辑资源文件。\n\
  \n用户界面存储在 .ui 文件中，包含了表单部件和布局的细节。此外，`Qt Designer` 可用于将标签与其“伙伴”（buddies）关联，并设置标签顺序（tab-order），即用户按下\
  \ Tab 键时部件获取焦点的顺序。这也可以通过代码 `QWidget.setTabOrder()` 完成，但对于手动编写的表单很少需要，因为默认顺序通常我们想要的。`Qt\
  \ Designer` 还可以用于连接信号槽，但仅限于内置信号。\n\n一旦用户界面设计并保存为 .ui 文件，必须将其转换为代码才能使用。这是通过 `pyuic4`\
  \ 命令行完成的。例如：\n\n```bash\nC:\\pyqt\\chap07>pyuic4 -o ui_findandrelg.py findandrelg.ui\n\
  ```\n\n如上一章提到的，我们可以使用 `mkpyqt.py` 或 `Make PyQt` 来替我们运行 `pyuic4`。然而，从 .ui 文件生成 Python\
  \ 模块（.py 文件）并不足以让用户界面变得可用。注意，生成的代码（在 `ui_*.py` 文件中）绝不应手动编辑，因为下次运行 `pyuic4` 时任何更改都会被覆盖。\n\
  \n从最终用户的角度来看，对话框的用户界面是手动编写还是使用 `Qt Designer` 创建并没有区别。然而，对话框初始化函数的实现存在显著差异，因为手动编码时我们必须创建、布局并连接对话框部件，而使用\
  \ `Qt Designer` 用户界面的对话框只需调用特定方法即可实现相同效果。\n\n使用 `Qt Designer` 的一大优势（除了视觉化设计对话框之外之外），如果我们更改了设计，只需重新生成用户界面模块（直接使用\
  \ `pyuic4` 或通过 `mkpyqt.py` 或 `Make PyQt`），而不需要更改代码。唯一必须更改代码的情况是我们在代码中引用的部件被添加、删除或重命名时。\n\
  \n也可以可以使用 `PyQt4.uic.loadUi()` 直接加载和使用 .ui 文件，尽管这并不常见。\n\n![Image 27](img/index-222_1.png)\n\
  \n\n\n`mkpyqt.py` 控制台应用程序和 Make PyQt (`makepyqt.pyw`) GUI 应用程序都是构建程序，它们为我们运行 PyQt\
  \ 的 `pyuic4`、`pyrcc4`、`pylupdate4` 和 `lrelease` 程序。它们的作用完全相同，都会自动使用正确的命令行参数来运行 PyQt\
  \ 的辅助程序，并且都会检查时间戳以避免执行不需要的工作。\n\n构建程序会寻找 `.ui` 文件并在其上运行 `pyuic4`，生成文件名相同但前缀为 `ui_`\
  \ 且扩展名改为 `.py` 的文件。同样，它们会寻找 `.qrc` 文件并在其上运行 `pyrcc4`，生成文件名相同但前缀为 `qrc_` 且扩展名同样改为\
  \ `.py` 的文件。\n\n例如，如果我们在 `chap06` 目录下运行 `mkpyqt.py`，将得到：\n```\nC:\\pyqt\\chap06..\\\
  mkpyqt.py\n./newimagedlg.ui -> ./ui_newimagedlg.py\n./resources.qrc -> ./qrc_resources.py\n\
  ```\n通过运行 Make PyQt 实现相同的效果：点击 Path 按钮将路径设置为 `C:\\pyqt\\chap06`，然后点击 Build 按钮。如果我们进行了任何更改，只需再次运行\
  \ `mkpyqt.py`，或者在使用 Make PyQt 时点击 Build，就会进行任何必要的更新。\n\n这两个构建程序都可以删除已生成的文件以准备全新的构建，并且都可以通过\
  \ `mkpyqt.py` 的 `-r` 选项或在 Make PyQt 中勾选 Recurse（递归）复选框对整个目录树进行递归操作。在控制台中运行 `mkpyqt.py\
  \ -h` 可以查看其选项的摘要。Make PyQt 程序为它的复选框和按钮提供了工具提示。在某些情况下可能需要设置工具路径；首次使用时点击 `More→Tool\
  \ paths`。\n\n![Image 28](img/index-223_1.png)\n\n*第 7 章：使用 Qt Designer*\n\n意味着使用\
  \ `Qt Designer` 进行设计实验比编辑手动编写的布局要快且简单得多，并有助于在使用 `Qt Designer` 创建的视觉设计与代码中实现的行为之间保持分离。\n\
  \n在本章中，我们将创建一个示例对话框，并利用它学习如何使用 `Qt Designer` 创建和布局控件、设置伙伴（buddies）和标签顺序，以及建立信号槽连接。我们还将看到如何使用由\
  \ `pyuic4` 生成的用户界面模块，以及如何在无需在初始化中使用 `connect()` 用的情况下自动创建到自定义槽的连接。\n\n对于这些示例，我们使用了\
  \ Qt 4.2 自带的 `Qt Designer`。早期版本的 `Qt Designer` 不具备 `QFontComboBox` 或 `QCalendarWidget`\
  \ 控件，而且它们的“Dialog”模板使用的是 `QButtons` 而不是 `QDialogButtonBox`。\n\n## 设计界面\n\n在开始之前，我们必须启动\
  \ `Qt Designer`。在 Linux 上，在控制台中运行 `designer &`（假设它在你的路径中），或从菜单系统调用它。在 Windows XP\
  \ 上，点击 `Start→Qt by Trolltech→Designer`，在 Mac OS X 上使用 Finder 启动它。`Qt Designer`\
  \ 启动时会有一个 New Form 对框；点击 `Dialog with Buttons Bottom` 然后点击 `Create`。这将创建一个标题为“untitled”的新表单，并带有图\
  \ 7.2 所示的 `QDialogButtonBox`。\n\n**图 7.2** *带有底部按钮的对话框*\n\n当首次运行 `Qt Designer` 时，它默认处于“多个顶层窗口”模式——这可能会让人困惑，除非是\
  \ Mac OS X 用户（这种方法是他们）。要像图 7.1 所示将所有内容显示在一个窗口中，点击 `Edit→User Interface Mode→Docked\
  \ Window`。★ `Qt Designer` 会记住此设置，因此只需操作一次。\n\n`Qt Designer` 并不难使用，但确实需要一些初始练习。有帮助的一点是按照特定的顺序操作，如下步骤列表所示。对于第\
  \ 1 和 2 步，始终从“后”向“前”操作，即始终从容器（组框、标签页控件、框架）开始，然后到内部（即在它们上方）的普通控件。我们稍后将逐步通过一个示例，但首先这里有一个如何使用\
  \ `Qt Designer` 创建对话框的通用描述。\n\n1. 将控件拖到表单上并将其放置在大致正确的位置；不需要放置得完全精确，通常只需要调整容器控件的尺寸。\n\
  2. 如果必要，设置控件的属性；如果将在代码中引用该控件，至少要给它一个合理的名称。\n3. 重复步骤 1 和 2 步，直到所有所需的控件都在表单上。\n4.\
  \ 如果有较大的间隙，拖入水平或垂直间隙器（这些显示为蓝色弹簧）来填充它们；有时当间隙明显时，会在步骤 1 和 2 步中添加间隙器。\n5. 选择两个或多个控件（或间隙器或布局）进行布局（Shift+点击每一个），然后使用布局管理器或拆分器进行布局。\n\
  6. 重复步骤 5 直到所有控件和间隙器都在布局中。\n7. 点击表单（取消所有选择）并使用其中一个布局管理器对表单进行布局。\n8. 为表单标签创建伙伴（buddies）。\n\
  9. 如果顺序错误，设置表单的标签顺序。\n10. 在适当的地方创建信号槽连接。\n11. 预览表单并检查一切运行正常。\n12. 设置表单的对象的名称（这是它的类名），以及表单标题，并保存它。例如，如果对象名称是“Payment”，我们可能会给它标题为“Payment”的文件名为\
  \ `paymentdlg.ui`。如果布局是错误的，使用撤销回到你可以重新布局的地方，然后重做。\n\n通常，在更改表单内的布局（点击表单，然后 Break\
  \ Layout 按钮）之前需要打破表单布局；因此表单必须重新布局。\n\n★从 Qt 4.3 起，此选项可以通过 `Edit→Preferences` 使用。\n\
  \n![Image 29](img/index-225_1.png)\n\n*第 7 章：使用 Qt Designer*\n\n虽然可以将布局拖到表单上然后将控件拖入布局，但最佳实践是把所有控件和间隙器拖到表单上，然后反复选择某些控件和间隙器并应用布局。唯一合理将控件添加到现有布局的情况是我们想要将控件拖入间隙——例如，到网格布局的空单元格中。\n\
  \n现在我们有了这些整体原则，我们将逐步通过查找替换对话框的设计。\n\n***\n\n基于“Dialog”模板之一创建一个新表单。这将带我们一个带有按钮框的表单。该按钮框有两个按钮，OK\
  \ 和 Cancel，并设置了信号槽连接。\n\n点击按钮框然后点击 `Edit→Delete`。这将留下一个完全空白的表单。对于此示例我们将使用 `QPushButton`\
  \ 而不是 `QDialogButtonBox`。这将允许我们比在 `Qt Designer` 中使用 `QDialogButtonBox` 更精细的控制，并有机会进行信号槽连接。\n\
  \n默认情况下，`Qt Designer` 左侧有一个名为 `Widget Box` 的停靠窗口。\n\n这包含了 `Qt Designer` 可以处理的所有控件。控件被分组，在最后有一组叫做\
  \ `Display Widgets`；这包含了 `Label` 控件。（`Qt Designer` 不使用类名作为控件名称，至少在它呈现给我们的用户界面中不是，但在大多数情况下可以看出特定名称指的是哪个类。）\n\
  \n点击并将 `Label` 拖到表单上，位于左上角。我们不在乎这个标签被称为什么，因为我们不会在代码中引用它，但默认文本是\n\n\n\n`TextLabel`\
  \ 不是我们想要的。当一个小部件被首次拖动并释放时，它会被自动选中，被选中的部件始终是属性编辑器中显示的那一个。前往属性编辑器停靠窗口（通常在右侧），向下滚动到\
  \ `text` 属性。将其更改为 `Find &what:`。现在文本在表单上看起来被截断了，这没关系；一旦标签完成布局，布局管理器将确保文本完整显示。\n\n\
  ![Image 30](img/index-226_1.png)\n\n现在拖入一个 `Line Edit`（来自 `Input Widgets` 组），将其放置在\
  \ `Label` 的右侧。进入属性编辑器，并将 `Line Edit` 的 `objectName`（所有部件的第一个属性）更改为 `findLineEdit`。我们给它起了一个合理的名称，因为我们想在代码中引用这个行编辑框。\n\
  \n现在在头两个部件下方拖入另一个 `Label` 和另一个 `Line Edit`。第二个 `Label` 的文本应设为 `Replace w&ith`，第二个\
  \ `Line Edit` 的名称应为 `replaceLineEdit`。现在表单的外看起来应该与图 7.4 非常相似。\n\n**图 7.4** *两个标签和两个行编辑框*\n\
  \n我们随时可以通过按下 `Ctrl+S` 或 `File→Save` 来保存表单。我们保存时，将使用文件名 `findandreplacedlg.ui`。\n\
  \n每个可编辑属性（以及一些只读属性）都显示在属性编辑器中。但除此之外，`Qt Designer` 还提供了右键菜单。右键菜单中的第一个选项通常允许我们更改部件最“重要”的属性（例如\
  \ `Label` 或 `Line Edit` 的 `text` 属性），第二个选项允许我们更改部件的对象名称。如果我们使用右键菜单更改复选框、单选按钮或推按钮的文本，编辑将在原地完成，在这种情况下，我们必须按回车键来完成。我们总是习惯于在\
  \ `property_editor` 中更改属性，但当然，如果你愿意也可以使用右键菜单。\n\n我们现在来添加两个复选框。从 `Buttons` 组（位于 `Widget\
  \ Box` 顶部）拖入一个 `Check Box`，将其放置在第二个 `Label` 下方。\n\n使用属性编辑器或右键菜单将其对象名称更改为 `caseCheckBox`，并将文本更改为\
  \ `&Case sensitive`。在第一个复选框右侧拖入第二个 `Check Box`：将其对象名称更改为 `wholeCheckBox`，文本更改为 `Wh&ole\
  \ words`，并将其 `checked` 状态设为 `true`。现在表单应该类似于图 7.5 所示。\n\n![Image 31](img/index-227_1.png)\n\
  \n**图 7.5** *两个标签、两个行编辑框和两个复选框* 现在我们将添加语法标签和组合框。在大小写敏感复选框下方拖入一个 `Label`，将其文本设为 `&Syntax:`。现在将一个\
  \ `Combo Box`（来自 `Input Widgets` 组）拖到 `Syntax Label` 的右侧。将 `Combo Box` 的对象名称更改为\
  \ `syntaxComboBox`。右键点击 `Combo Box` 并选择菜单中的第一项 `Edit Items`。点击 `+` 图标并输入 `Literal\
  \ text`。\n\n重复此操作以添加 `Regular expression`。点击 `OK` 按钮完成。\n\n如果用户调整表单大小，我们希望部件整齐地聚集在一起，而不是散开，因此拖入一个\
  \ `Vertical Spacer`（位于 `Widget Box` 顶部的 `Spacers` 组），将其放置在 `Combo Box` 下方。我们使用代码设计表单时使用伸缩器（stretches），但在可视化设计时使用间隔器（spacers）：它们都会扩展以填充空白区域。在布局中添加伸缩器本质上向布局中插入\
  \ `QSpacerItem`，但输入更少。\n\n为了让按钮在视觉上与我们创建的部件分开，我们将在它们与其他部件之间放置一条垂直线。从 `Display Widgets`\
  \ 组（位于 `Widget Box` 底部）拖入一个 `Vertical Line`（实际上形状为 `QFrame.VLine` 的 `QFrame`），将其放置在表单所有部件的右侧，但在其右侧留出空间给按钮。现在表单看起来应该像图\
  \ 7.6。\n\n我们现在准备好创建按钮了。从 `Buttons` 组（位于 `Widget Box` 顶部）拖入一个 `Push Button` 到表单右上角。将其对象名称更改为\
  \ `findButton`，文本更改为 `&Find`。在 Find 按钮下方拖入另一个按钮，并赋予它对象名称 `replaceButton`，将其文本设为\
  \ `&Replace`。在 Replace 按钮下方创建第三个按钮。赋予它对象名称 `replaceAllButton` 并将文本更改为 `Replace &All`。\n\
  \n现在在 Replace All 按钮下方拖入一个 `Vertical Spacer`。最后，在间隔器下方拖入第四个按钮。给此按钮对象名称 `closeButton`\
  \ 并将文本更改为 `Close`。\n\n现在我们有了所有需要的部件和间隔器，并适当设置了它们的所有属性。表单看起来应该像图 7.7 所示。\n\n![Image\
  \ 32](img/index-228_1.png)\n![Image 33](img/index-228_2.png)\n\n**图 7.6** *没有按钮的查找和替换对话框*\n\
  \n**图 7.7** *未布局的查找和替换对话框* 布局此表单的最佳方法是什么？这个表单的最佳设计是什么？这些问题的取决于口味和实践。在这里我们仅展示机械操作，美学留给你。\n\
  \n我们首先从布局前两个 `Label` 及其 `Line Edit` 开始。点击表单取消选择，然后 `Shift+Click` `Find Label` 及其\
  \ `Line Edit`，以及 `Replace with Label` 及其 `Line Edit`。一旦这四个部件被选中，点击 `Form→Lay Out\
  \ in Grid`。布局由红线表示——布局线在运行时是不可见的。现在点击表单取消选择，选择两个 `Check Boxes`。点击 `Form→Lay Out\
  \ Horizontally`。再次点击表单取消选择，这次使用水平布局 `Syntax Label` 和 `Combo Box`。现在应该有三个布局——一个网格和两个水平布局，如图\
  \ 7.8 所示。\n\n我们现在可以布局表单左侧的布局。点击表单取消选择。选择布局（而不是部件）可能困难，因此我们不使用 `Shift+Click`，而是使用选择矩形。\n\
  \n点击表单左下角并拖动选择矩形：\n\n![Image 34](img/index-229_1.png)\n![Image 35](img/index-229_2.png)\n\
  \n**图 7.8** *带有某些布局的查找和替换对话框* 框只需要接触对象即可选择，因此向上向右拖动，使其接触左侧的 `Vertical Spacer` 和三个布局——不要接触其他的（例如\
  \ `Vertical Line`）。现在释放并点击 `Form→Lay Out Vertically`。\n\n我们可以使用相同的选择技术来布局按钮。点击表单取消选择。现在点击表单右下角并拖动，使选择矩形接触\
  \ `Close button`、右侧的 `Vertical Spacer` 以及其他三个按钮——不要接触其他的。现在释放并点击 `Form→Lay Out Vertically`。我们现在拥有一个所有部件都在左侧或右侧布局且中间有一个\
  \ `Vertical Line` 的表单，如图 7.9 所示。\n\n**图 7.9** *几乎完成布局的查找和替换对话框*\n\n我们现在准备好布局表单本身。点击表单取消所有选择。现在点击\
  \ `Form→Lay Out Horizontally`。表单现在看起来有点太高，只需向上拖动表单底部直到表单看起来更好。如果你拖动了很多，间隔器可能会“消失”；它们仍然在那里，只是小到不可见。\n\
  \n![Image 36](img/index-230_1.png)\n\n\n\n我们现在可以预览表单以查看布局的真实外观，在预览期间，我们可以拖动表单的角来将其缩小或放大，以检查其缩放行为是否合理。要进行预览，点击\
  \ `Form→Preview`（或按 `Ctrl+R`）。也可以通过菜单选项中的 `Form→Preview` 使用不同的样式进行预览。现在表单看起来应该像图\
  \ 7.10 所示。如果不是如此，请使用 `Edit→Undo` 撤销更改，然后重新布局。如果你必须重新进行布局，有时调整某些控件的大小并重新定位会有帮助，这可以让\
  \ `Qt Designer` 获得更多关于你想要布局的线索，特别是使用网格布局时。\n\n**图 7.10** 一个布局好的查找和替换对话框\n\n我们现在准备好设置标签的伙伴（buddies）、设置表单的选项顺序、进行任何所需的连接，并命名和保存表单。\n\
  \n我们将从伙伴开始。点击 `Edit→Edit Buddies` 开启伙伴模式。要设置伙伴关系，我们点击 `Label` 并拖动到想要作为其伙伴的控件上。因此在这个示例中，我们必须点击\
  \ `Find what Label` 并拖动到它的 `Line Edit`，然后对 `Replace with Label` 它的 `Line Edit` 执行同样的操作，然后对\
  \ `Syntax Label` 和 `Combo Box` 执行此。要退出伙伴模式，按 `F3`。现在，`Labels` 中不应再显示安培符（`&`）。\n\n\
  接下来我们将设置表单的选项顺序。点击 `Edit→Edit Tab Order`，然后按照你想要的顺序依次点击每个编号框。要退出选项顺序模式，按 `F3`。\n\
  \n`Find`、`Replace` 和 `Replace All` 按钮需要连接到我们自己的自定义方法；我们将在 `Qt Designer` 之外完成。但 `Close`\
  \ 按钮可以连接到对话框的 `reject()` 槽。要执行此操作，点击 `Edit→Edit Signals/Slots`，然后从 `Close` 按钮拖动到表单。当你释放时，会弹出\
  \ `Configure Connection` 对话框。从左侧信号列表中点击（无参数的）`clicked()` 信号，从右侧槽列表中点击 `reject()`\
  \ 槽，然后点击 `OK`。要退出信号槽模式，按 `F3`。\n\n点击表单以取消选择所有项。这同样具有让属性编辑器显示表单属性的效果。将对话框的对象名称（它将在其类名中使用）设置为\
  \ `FindAndReplaceDlg`，并将 `windowTitle` 属性设置为 `Find and Replace`。现在点击 `File→Save`\
  \ 保存用户界面，将其命名为 `findandreplacedlg.ui`。\n\n# 第 7 章：使用 Qt Designer\n\n在本节中，我们仅限于使用\
  \ `Qt Designer` 通过“对话框”（Dialog）模板之一来创建自定义对话框，因为这对于学习如何使用 `Qt Designer` 的基础已经足够。然而，`Qt\
  \ Designer` 可以创建比我们在这里创建的复杂得对话框，包括带有标签页控件和控件栈的对话框，这些通常用于具有几十甚至数百个选项的配置对话框。还可以使用包含自定义控件的插件扩展\
  \ `Qt Designer`。这些控件通常用 `C++` 编写，但从 `PyQt 4.2` 开始，也可以引入用 `Python` 编写的自定义控件。\n\n\
  Qt 文档包含了详尽的 `Qt Designer` 手册，它更深入并涵盖了更多可用功能。本节涵盖的内容足以入门，但正确学习 `Qt Designer` 的唯一方法是使用它。\n\
  \n设计好用户界面后，下一步是让它在我们的代码可用。\n\n## 实现对话框\n\n当我们使用 `Qt Designer` 创建用户界面时，我们使用多重继承创建一个子类，在其中放入所需的代码来为用户界面提供所需的行为。我们继承的第一个类是\
  \ `QDialog`。如果我们使用“控件”（Widget）模板，我们的第一个继承类将是 `QWidget`，如果我们使用“主窗口”（Main Window）模板，我们的第一个继承类将是\
  \ `QMainWindow`。我们继承的第二个类是表示我们使用 `Qt Designer` 设计的用户界面的类。\n\n在前节中，我们创建一个对象名为 `FindAndReplaceDlg`\
  \ 的用户界面，存储在文件 `findandreplacedlg.ui` 中。我们必须运行 `pyuic4`（直接运行或通过 `mkpyqt.py` 或 `Make\
  \ PyQt`）来生成 `ui_findandreplacedlg.py` 模块文件。该模块包含一个类，其名为带有 `Ui_` 前缀的表单对象名称，因此在这种情况下，类名为\
  \ `Ui_FindAndReplaceDlg`。\n\n我们将子类命名为 `FindAndReplaceDlg`，并将其放在 `findandreplacedlg.py`\
  \ 文件中。在查看类声明和初始化之前，我们先查看导入部分。\n\n```\nimport re\n\nfrom PyQt4.QtCore import *\n\n\
  from PyQt4.QtGui import *\n\nimport ui_findandreplacedlg\n```\n\n其他方法也是可能的，并在在线文档中有所介绍。尽管如此，没有一种像我们在这里使用的方法那样方便。\n\
  \n第一个导入是我们在代码中使用的正则表达式模块。第二个和第三个导入是 PyQt 编程常用的导入。最后一个导入是生成的用户界面模块。现在我们可以查看我们的子类了。\n\
  \n```python\nclass FindAndReplaceDlg(QDialog, ui_findandreplacedlg.Ui_FindAndReplaceDlg):\n\
  \    def __init__(self, text, parent=None):\n        super(FindAndReplaceDlg, self).__init__(parent)\n\
  \        self.__text = unicode(text)\n        self.__index = 0\n        self.setupUi(self)\n\
  \        if not MAC:\n            self.findButton.setFocusPolicy(Qt.NoFocus)\n \
  \           self.replaceButton.setFocusPolicy(Qt.NoFocus)\n            self.replaceAllButton.setFocusPolicy(Qt.NoFocus)\n\
  \            self.closeButton.setFocusPolicy(Qt.NoFocus)\n        self.updateUi()\n\
  ```\n\n我们既继承了 `QDialog` 也继承了 `Ui_FindAndReplaceDlg`。在 Python 编程中很少需要使用多重继承，但对于这种情况，它比其他方法要简单得多。我们的\
  \ `FindAndReplaceDlg` 子类实际上是它继承的两个类的并集，并且可以直接访问它们的属性（当然，带有 `self` 前缀）。\n\n我们设置了初始化器以接受作为对话框处理数据的文本，以及一个父控件。`super()`\
  \ 调用是在第一个继承类 `QDialog` 上进行的。我们保留了文本的副本，以及一个索引位置，以防用户多次点击查找以相同文本的后续出现。\n\n对 `setupUi()`\
  \ 方法的调用是我们之前从未过的。该方法由生成的模块提供。调用时，它会创建用户界面文件中指定的所有控件，根据我们的设计进行布局，设置它们的伙伴和选项顺序，并建立我们设置的连接。换句话说，它重建了我们在\
  \ `Qt Designer` 中设计的表单。\n\n此外，`setupUi()` 方法调用了 `QtCore.QMetaObject.connectSlotsByName()`，这是一个静态方法，在表单控件信号和子类中遵循特定命名规则的方法之间创建信号槽连接。任何名称符合\
  \ `on_widgetName_signalName*` 格式的方法与其命名的控件及其命名的信号连接。\n\n例如，我们的表单有一个类型为 `QLineEdit`\
  \ 名为 `findLineEdit` 的控件。`QLineEdit` 发出的信号之一是 `textEdited(QString)`。因此，如果我们想连接此信号而不初始化器中调用\
  \ `connect()` 方法，我们可以将这项工作交给 `setupUi()`。只要我们调用了想要让信号连接的槽 `on_findLineEdit_textEdited`，它就能工作。\n\
  \n\n\n对于 Windows 和 Linux 用户来说，将按钮的焦点策略设置为“无焦点”（No Focus）是非常方便的。这对鼠标用户没有影响，但通常对键盘用户很有帮助。这意味着按下\
  \ `Tab` 键时，键盘焦点只会在编辑控件之间移动——在本例中，包括查找编辑框、替换编辑框、复选框和组合框——这通常比需要通过 `Tab` 键遍历按钮要方便得多。键盘用户仍然可以使用按钮的快捷键按下任何按钮（例如关闭按钮使用\
  \ `Esc`）。\n\n遗憾的是，buddies 和按钮并没有为 Mac OS X 用户提供快捷键（除非他们开启对辅助设备的支持），因此这些用户需要能够 `Tab`\
  \ 到包括按钮在内的所有控件。为了适应所有平台，我们没有在 `Qt Designer` 中设置按钮的焦点策略，而是在 `setupUi()` 创建用户界面后手动设置它们。\n\
  \n如果底层窗口系统是 Mac OS X，则 `MAC` 布尔变量为 `True`。它是在文件开头、导入之后，使用以下相当晦涩的语句设置的：\n\n```python\n\
  MAC = \"qt_mac_set_native_menubar\" in dir()\n```\n\n更清晰的写法是：\n\n```python\nimport\
  \ PyQt4.QtGui\n\nMAC = hasattr(PyQt4.QtGui, \"qt_mac_set_native_menubar\")\n```\n\
  \n这些代码之所以有效，是因为 `PyQt4.QtGui.qt_mac_set_native_menubar()` 函数仅存在于 Mac OS X 系统上。我们将在第\
  \ 11 章中使用类似的技术来检测 X Window 系统。\n\n最后调用的 `updateUi()` 方法是我们自定义的方法；我们使用它来根据用户是否输入了任何查找文本来启用或禁用按钮。\n\
  \n```python\n@pyqtSignature(\"QString\")\ndef on_findLineEdit_textEdited(self, text):\n\
  \    self.__index = 0\n    self.updateUi()\n```\n\n得益于 `setupUi()`，该方法自动与 `findLineEdit`\
  \ 的 `textEdited()` 信号连接。每当我们想要自动连接时，都会使用 `@pyqtSignature` 装饰器来指定信号的参数。该装饰器的目的是区分名称相同但参数不同的信号。在特定情况下，只有一个\
  \ `textEdited()` 信号，因此装饰器并不是严格必须的；但出于良好的习惯，我们总是使用装饰器。例如，如果以后版本的 PyQt 引入了另一个同名但参数不同的信号，使用装饰器的代码将继续工作，而没有使用装饰器的代码则不会。\n\
  \n由于该槽在用户更改查找文本时被调用，我们将搜索的起始索引位置重置为 0（开头）。在这里以及在初始化函数中，我们都以调用 `updateUi()` 结束。\n\
  \n## 实现对话框\n\n```python\ndef updateUi(self):\n    enable = not self.findLineEdit.text().isEmpty()\n\
  \    self.findButton.setEnabled(enable)\n    self.replaceButton.setEnabled(enable)\n\
  \    self.replaceAllButton.setEnabled(enable)\n```\n\n我们已经见过许多此类方法的示例了。在这里，如果用户输入了查找文本，我们就启用“查找”、“替换”和“全部替换”按钮。无论是否有替换文本都无关，因为将某些内容替换为空是完全有效的，也就是说就是删除找到的文本。该方法就是表单在启动时除关闭按钮外，所有按钮都禁用的原因。\n\
  \n当用户关闭表单时，可以使用 `text()` 方法访问它持有的文本（如果用户使用了替换或全部替换，该文本可能与原始文本不同）。\n\n```python\n\
  def text(self):\n    return self.__text\n```\n\n一些 Python 程序员不会为此提供一个方法；相反地，他们会有一个\
  \ `self.text` 变量（而不是 `self.__text`），并直接访问该变量。\n\n对话框的其他功能实现在方法中，这些方法是在用户按下某个按钮（关闭按钮之外）后调用的加上辅助方法。它们的实现与使用\
  \ `Qt Designer` 无直接关系，但为了完整性，我们将简要回顾它们。\n\n```python\n@pyqtSignature(\"\")\ndef\
  \ on_findButton_clicked(self):\n    regex = self.makeRegex()\n    match = regex.search(self.__text,\
  \ self.__index)\n    if match is not None:\n        self.__index = match.end()\n\
  \        self.emit(SIGNAL(\"found\"), match.start())\n    else:\n        self.emit(SIGNAL(\"\
  notfound\"))\n```\n\n按钮的 `clicked()` 信号有一个可选的布尔参数，我们并不感兴趣，因此我们为 `@pyqtSignature`\
  \ 装饰器指定了一个空参数列表。相比之下，我们不能为 `on_findLineEdit_textEdited()` 槽的装饰器使用空参数列表，因为 `textEdited()`\
  \ 信号的参数不是可选的，所以必须包含。\n\n要执行搜索，我们创建一个正则表达式来指定查找文本以及搜索的一些特征。然后我们使用该正则表达式从当前索引位置搜索文本。如果找到了匹配项，我们更新索引位置到匹配项的结束，准备进行后续搜索，并发送一个包含文本中找到查找文本位置的信号。\n\
  \n```python\ndef makeRegex(self):\n    findText = unicode(self.findLineEdit.text())\n\
  \    if unicode(self.syntaxComboBox.currentText()) == \"Literal\":\n        findText\
  \ = re.escape(findText)\n    flags = re.MULTILINE|re.DOTALL|re.UNICODE\n    if not\
  \ self.caseCheckBox.isChecked():\n        flags |= re.IGNORECASE\n    if self.wholeCheckBox.isChecked():\n\
  \        findText = r\"\\b%s\\b\" % findText\n    return re.compile(findText, flags)\n\
  ```\n\n我们首先获取用户输入的查找文本。我们知道它不能为空，因为只有当存在查找文本时，按钮（关闭按钮除）才会启用。如果用户选择了字面搜索，我们使用 `re.escape()`\
  \ 函数来转义用户查找文本中可能存在的任何正则表达式元字符。然后我们初始化搜索标志。如果 `caseCheckBox` 未被勾选，我们为标志补充 `re.IGNORECASE`\
  \ 标志。如果用户要求搜索整个单词，我们会在查找文本前后加上 `\\b`：这是 Python（以及正则表达式语言）正则表达式中的一个标记，用于指定单词边界。字符串前面的\
  \ `r` 表示“原始”字符串，我们可以在其中编写像已转义的 `\\` 字符。最后，我们返回编译后的（可直接使用的）正则表达式形式。\n\n如果我们知道要搜索的文本通常是\
  \ `QString` 而不是 `unicode`，那么使用 PyQt 的 `QRegExp` 类可能比使用 Python 标准库的 `re` 类更好。\n\n\
  ```python\n@pyqtSignature(\"\")\ndef on_replaceButton_clicked(self):\n    regex\
  \ = self.makeRegex()\n    self.__text = regex.sub(unicode(self.replaceLineEdit.text())),\
  \ self.__text, 1)\n```\n\n此方法非常简单，因为它将准备工作交给了 `makeRegex()` 方法。我们使用 `sub` 方法（“替换”）将查找文本的第一次出现替换为替换文本。替换文本可以是空的。`1`\
  \ 是最大替换次数。\n\n```python\n@pyqtSignature(\"\")\ndef on_replaceAllButton_clicked(self):\n\
  \    regex = self.makeRegex()\n    self.__text = regex.sub(unicode(self.replaceLineEdit.text())),\
  \ self.__text)\n```\n\n此方法与之前的那个几乎相同。唯一的区别在于我们没有指定最大替换次数，因此 `sub()` 将替换它找到的所有（非重叠）查找文本出现处。\n\
  \n现在我们已经实现了 `FindAndReplaceDlg`。对话框方法的实现与我们之前所做的没有太大区别，只是我们使用了装饰器和 `setupUi()` 来提供自动连接。\n\
  \n要在应用程序中使用该对话框，我们必须确保\n\n\n\n\n`ui_findandreplacedlg.py` 模块文件已生成，我们必须导入刚刚编写的 `findandreplacedlg`\
  \ 模块。我们将在下一节介绍如何创建和使用表单。\n\n## 测试对话框\n\n由于任何 PyQt 小部件（包括任何对话框）都可以作为顶层窗口使用，因此通过实例化并启动事件循环来测试对话框是非常简单的。★\
