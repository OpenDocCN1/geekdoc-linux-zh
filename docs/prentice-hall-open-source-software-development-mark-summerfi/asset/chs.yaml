  \ |\n\n```python\ndef okToContinue(self):\n    if self.dirty:\n        reply = QMessageBox.question(self,\n\
  \        \"Image Changer - Unsaved Changes\",\n        \"Save unsaved changes?\"\
  ,\n        QMessageBox.Yes|QMessageBox.No|\n        QMessageBox.Cancel)\n      \
  \  if reply == QMessageBox.Cancel:\n            return False\n        elif reply\
  \ == QMessageBox.Yes:\n            self.fileSave()\n        return True\n```\n\n\
  此方法被 `closeEvent()` 以及“新建文件”和“打开文件”操作使用。如果图像是“脏”的（即如果它有未保存的更改），我们会弹出一个消息框并询问用户想做什么。如果他们点击是，我们将图像保存到磁盘并返回\
  \ True。如果他们点击否，我们只需返回 True，这样未保存的更改将丢失。如果他们点击取消，我们返回 False，这意味着未保存的更改仍然有效，稍后可以保存。\n\
  \n书中所有的示例都使用是/否或是/否/取消消息框来提供保存未保存更改的机会。一些开发者青睐的替代方案是使用保存和丢弃按钮（使用 `QMessageBox.Save`\
  \ 和 `QMessageBox.Discard` 标识）。\n\n最近使用的文件列表是应用程序状态的一部分，在应用程序终止时必须保存并恢复，并在运行时也保持。早些我们将\
  \ `fileMenu` 的 `aboutToShow()` 信号连接到自定义的 `updateFileMenu()` 槽。因此，当用户按下 Alt+F 或点击文件菜单时，该槽会在文件菜单显示*之前*被调用。\n\
  \n187\n\n```python\ndef updateFileMenu(self):\n    self.fileMenu.clear()\n    self.addActions(self.fileMenu,\
  \ self.fileMenuActions[:-1])\n    current = QString(self.filename) \\\n    if self.filename\
  \ is not None else None\n    recentFiles = []\n    for fname in self.recentFiles:\n\
  \        if fname != current and QFile.exists(fname):\n            recentFiles.append(fname)\n\
  \    if recentFiles:\n        self.fileMenu.addSeparator()\n        for i, fname\
  \ in enumerate(recentFiles):\n            action = QAction(QIcon(\":/icon.png\"\
  ), \"&%d %s\" % (\n            i + 1, QFileInfo(fname).fileName()), self)\n    \
  \        action.setData(QVariant(fname))\n            self.connect(action, SIGNAL(\"\
  triggered()\"),\n            self.loadFile)\n            self.fileMenu.addAction(action)\n\
  ```\n\n188\n\n# 静态 QMessageBox 方法\n\n`QMessageBox` 类提供了几个静态便利方法，可以弹出带有适当图标和按钮的模态对话框。它们对于向用户提供带有\
  \ OK 按钮、是/否按钮等的对话框非常有用。\n\n最常用的 QMessageBox 静态方法是 `critical()`、`information()`、`question()`\
  \ 和 `warning()`。这些方法接收一个父控件（它们以其为中心居中）、窗口标题文本、消息文本（可以是纯文本或 HTML）以及零或多个按钮规范。如果没有指定按钮，则提供一个的\
  \ OK 按钮。\n\n可以使用常量来指定按钮，或者我们可以提供自己的文本。\n\n\n\n\n在 Qt 4.0 和 Qt 4.1 中，将 `QMessageBox.Default`\
  \ 与 `OK` 或 `Yes` 按钮进行按位或操作是非常常见的做法——这意味着当用户按下 `Enter` 键时，该按钮会被按下；以及将 `QMessageBox.Escape`\
  \ 与 `Cancel` 或 `No` 按钮进行按位或操作，那么当用户按下 `Esc` 时，该按钮会被按下。例如：\n\n```\nreply = QMessageBox.question(self,\
  \ \"Image Changer - Unsaved Changes\", \"Save unsaved changes?\", QMessageBox.Yes|QMessageBox.Default,\
  \ QMessageBox.No|QMessageBox.Escape)\n```\n这些方法返回被按下按钮的常量。\n\n### Qt\n\n从 Qt 4.2\
  \ 开始，`QMessageBox` API 经过了简化，我们不再需要通过 `4.2` 指定按钮并使用按位或操作，而是直接使用按钮即可。例如，对于一个是/否/取消对话框，我们可以这样写：\n\
  \n```\nreply = QMessageBox.question(self, \"Image Changer - Unsaved Changes\", \"\
  Save unsaved changes?\", QMessageBox.Yes|QMessageBox.No|QMessageBox.Cancel)\n```\n\
  \n在这种情况下，PyQt 会自动将 `Yes`（接受）按钮设置为默认按钮（通过用户按下 `Enter` 激活），并将 `Cancel`（拒绝）按钮设置为转逸按钮（通过用户按下\
  \ `Esc` 激活）。`QMessageBox` 方法还确保按钮按照对应平台的正确顺序显示。我们在书中的示例中使用了 Qt 4.2 的语法。\n\n用户可以通过点击“接受”按钮（通常是\
  \ `Yes` 或 `OK`）或“拒绝”按钮（通常是 `No` 或 `Cancel`）来关闭消息框。用户也可以通过点击窗口的关闭按钮 `X` 或按下 `Esc`\
  \ 键来实际上点击了“拒绝”按钮。\n\n如果我们想创建一个自定义的消息框——例如，使用自定义的按钮文本和自定义图标——我们可以创建一个 `QMessageBox`\
  \ 实例。\n\n然后我们可以使用如 `QMessageBox.addButton()` 和 `QMessageBox.setIcon()` 等方法，并通过调用\
  \ `QMessageBox.exec_()` 来弹出消息框。\n\n### 创建主窗口\n\n```\nself.fileMenu.addSeparator()\n\
  self.fileMenu.addAction(self.fileMenuActions[-1])\n```\n我们首先清除“文件”菜单的所有动作。然后，我们重新添加原始的文件菜单动作列表，例如“新建文件”和“打开文件”，但排除了最后一个动作“退出程序”。接着，我们遍历最近使用的文件列表，创建一个只包含在文件系统中仍然存在的本地列表，并排除当前文件。虽然这看起来似乎意义不大，但许多应用程序都会包含当前文件，并且通常在列表最先显示它。\n\
  \n现在，如果我们的本地列表中有任何最近使用的文件，我们会在菜单中添加一个分隔符，然后为每个文件创建一个动作，其文本仅包含文件名（不包含路径），并在其前面带上一个数字编号的快捷键：`1,\
  \ 2, …, 9`。\n\nPyQt 的 `QFileInfo` 类提供了关于文件的信息，类似于 Python `os` 模块提供的某些函数。`QFileInfo.fileName()`\
  \ 方法等同于 `os.path.basename()`。对于每个动作，我们还存储了一项“用户数据”——在本例中，是文件的全名，包括其路径。最后，我们将每个最近使用的文件名动作的\
  \ `triggered()` 信号连接到 `loadFile()` 槽，并将该动作添加到菜单中。（我们将在下一节中介绍 `loadFile()`。）最后，我们添加另一个分隔符，以及文件菜单的最后一个动作“退出程序”。\n\
  \n但是，最近使用的文件列表是如何创建和维护的？我们在表单的初始化函数中看到，最初是从应用程序设置中填充 `recentFiles` 字符串列表。我们也看到该列表相应地保存在\
  \ `closeEvent()` 中。新文件通过 `addRecentFile()` 添加到列表中。\n\n```python\ndef addRecentFile(self,\
  \ fname):\n    if fname is None:\n        return\n    if not self.recentFiles.contains(fname):\n\
  \        self.recentFiles.prepend(QString(fname))\n    while self.recentFiles.count()\
  \ > 9:\n        self.recentFiles.takeLast()\n```\n该方法将给定的文件名插入开头，然后从末尾弹出任何多余的文件（最早添加的文件），这样列表中的文件名永远不会超过九个。我们将\
  \ `recentFiles` 变量保持为 `QStringList`，这就是为什么我们使用 `QStringList` 的方法而不是 Python 的列表方法来操作它。\n\
  \n`addRecentFile()` 方法本身在 `fileNew()`、`fileSaveAs()` 和 `loadFile()` 方法中被调用；；并间接地从\
  \ `loadInitialFile()`、`fileOpen()` 和 `updateFileMenu()` 中调用，所有这些方法要么调用或连接到 `loadFile()`。因此，当我们第一次保存图像、以新名称保存图像、创建一个新图像或打开一个现有图像时，文件名会被添加到最近使用的文件列表中。\n\
  \n然而，新添加的文件名不会出现在“文件”菜单中，除非我们随后创建或打开了另一个图像，因为我们的 `updateFileMenu()` 方法没有在最近使用的文件列表中显示当前图像的文件名。\n\
  \n![Image 2](img/index-205_1.png)\n\n### 第 6 章 主窗口\n\n**图 6.8** 带有最近使用文件的文件菜单 我们在这里采用处理最近使用文件的方法只是许多可能性之一。另一种方法是只创建一次“文件”菜单，并在最后设置一组用于最近使用的动作。当菜单更新时，而不是清除并重新创建，最近使用的动作只是被隐藏或显示。从用户的角度来看，无论我们采取哪种底层方法都没有区别，因此在这种情况下菜单看起来都与图\
  \ 6.8 所示。这两种方法都可以用于在文件菜单中实现最近使用的文件，正如我们在 Image Changer 应用程序中所做的那，位于“退出”选项之前。它们也可以用于实现“最近文件”选项，将所有最近文件作为子菜单，正如\
  \ OpenOffice 以及其他应用程序所使用的。使用独立的“最近文件”选项的处是文件菜单始终保持不变，并且可以在子菜单中显示完整路径——这是我们避免将最近文件直接放在文件菜单中的原因，以免变得极其宽（。\n\
  \n### 处理用户动作\n\n在前面的节中，我们创建了主窗口风格应用程序的外，并通过创建一组动作提供了其行为基础。我们也看到了如何保存和恢复应用程序设置，以及如何管理最近使用的文件列表。应用程序的一些行为由\
  \ PyQt 自动处理——例如窗口最小化、最大化和调整大小——所以我们不需要自己做。另一些行为可以通过信号和槽来实现。在本节中，我们关注用户直接控制的动作，这些动作可以查看、编辑和输出它们的数据。\n\
  \n![Image 3](img/index-206_1.png)\n\n### 处理文件动作\n\n文件可能是主窗口风格应用程序中最常见的菜单，在大多数情况下，它至少提供“新建”、“保存”和“退出”（或“离开”）选项。\n\
