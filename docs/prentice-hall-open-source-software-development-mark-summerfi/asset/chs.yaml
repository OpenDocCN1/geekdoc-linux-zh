  \ 类层次\n\n# 索引\n\n# 前言\n\n作为 PyQt 的创始人，我很高兴看到这本书的出版。尽管我担任了本书的技术评审员之一，但我很乐于承认，我也从中学习了一些东西。\n\
  \nPyQt 文档涵盖了所有 `PyQt` 类的 API。本书将向你展示如何使用这些类，如何将它们组合以创建对话框、主窗口以及整个应用程序——所有这些外观美观且运行良好，没有人为限制，并且使用了一种用起来非常愉快的编程语言。\n\
  \n我特别喜欢这本书的一点是，这些示例并不是为了说明简单观点而设计的平凡例子，而是本身就具有潜在的价值。对不同方法的考虑将回报那些想要深入理解如何将 `PyQt`\
  \ 应用于开发大规模、生产级应用的读者。\n\n我从 20 世纪 90 年代后期开始了 PyQt 的故事。我已经使用 `Tcl/Tk` 一段时间了，但我觉得 `Tk`\
  \ 应用程序看起来很丑，特别是当我看到 `KDE` 第一版本所取得的成就时。我一直切换到 `Python`，因此我想将语言的改变与 GUI 库的改变结合。\n\n\
  最初我使用了一些用 `SWIG` 编写的封装器，但我得出我可以自己制作一个更合适的封装工具。我开始创建 `SIP`，并在 1998 年 11 月发布了支持 `Qt`\
  \ 1.41 的 `PyQt` 0.1。\n\n从那时以后，开发一直在定期进行，以跟上 `Qt` 的新发布并扩展 `PyQt` 的范围，例如添加支持工具和改进文档。到\
  \ 2000 年，`PyQt` 2.0 在 Linux 和 Windows 上都支持 `Qt` 2.2。`Qt` 3 的支持出现在 2001 年，Mac OS\
  \ X 的支持出现在 2002 年。`PyQt4` 系列从 2006 年 6 月的 `PyQt` 4.0 开始，支持 `Qt` 4。\n\n我的首要目标一直是让\
  \ `Python` 和 `Qt` 以一种让 Python 程序员感到自然的方式协作，同时允许他们在 `Python` 中执行任何在 `C++` 中可以做的事情。实现这一点的关键是\
  \ `SIP` 的开发。它提供了一个我可以完全控制的专用代码生成器，并确保 `Python` 和 `Qt` 始终紧密结合。\n\n开发和维护 `PyQt` 的基本流程现在已经非常成熟。大部分工作现在都是自动化的，这意味着跟上\
  \ `Trolltech` 的 `Qt` 新版本不再是以前的问题了，并确保了 `PyQt` 在未来多年持续下去。\n\n多年来见证 `PyQt` 社区的增长是非常令人欣慰的。如果这本书是你接触\
  \ `PyQt` 的开始，欢迎！\n\n— Phil Thompson\n\n英国，多塞特郡，温姆伯\n2007 年 8 月 25 日\n\n# 引言\n\n\
  本书教你如何使用 `Python` 编程语言和 `Qt` 开发框架编写 GUI 应用程序。唯一的先决知识是你可以使用某种面向对象的语言编程，例如 `C++`、`C#`、`Java`\
  \ 或当然还有 `Python` 本身。对于富文本章节，假设对 `HTML` 和正则表达式有一定的了解，数据库和多线程章节假设对这些主题有一定的基础知识。不需要\
  \ GUI 编程知识，因为所有核心概念都已涵盖。\n\n本书对于职业工作内容需要编程的人来说将很有用，无论是全职软件开发人员，还是为了支持工作需要进行编程的其他学科人士（包括科学家和工程师）。练习（附答案）特别是为了帮助学生提供的。\n\
  \n`Python` 可能是广泛应用中最容易学习、最漂亮的脚本语言，而 `Qt` 可能是开发 GUI 应用程序最好的库。`Python` 和 `Qt` 的结合——“PyQt”，使得在任何支持的平台上开发应用程序并在所有平台上不更改运行成为可能——例如，所有现代版本的\
  \ Windows、Linux、Mac OS X 以及大多数基于 Unix 的系统。得益于 `Python` 是解释型的，不需要编译；得益于 `Qt` 抽象了特定平台的细节，不需要为了适应不同的操作系统而更改源代码。\n\
  \n如果你是 `Python` 新手：欢迎！你即将发现一种易于读写、简洁明了且不晦懂的语言。`Python` 是一种非常有表现力的语言，这意味着我们通常写的 `Python`\
  \ 代码行比用 `C++` 或 `Java` 编写的同类应用程序要少得多。这使得在全文中展示一些小但完整的示例成为可能，并使 `PyQt` 成为快速轻松开发 GUI\
  \ 应用程序的理想工具，无论是用于原型设计还是生产使用。\n\n**图 1 *Eric4 IDE——一个 PyQt4 应用程序***\n\n\n\n\n\n例如，当你创建一个对话框时，它应该是模态的还是非模态的？（关于此问题的解释和策略建议请参阅第\
  \ 5 章。）`PyQt` 用于编写各种 GUI 应用程序，从会计程序到科学家和工程师使用的可视化工具。例如，图 1 显示了 `Eric4`，这是一个用 `PyQt`\
  \ 编写的强大集成开发环境。编写只有几十行的 `PyQt` 应用程序是可能的，而 1,000 到 10,000 行的中等规模项目也非常常见。\n\n一些商业公司已经构建了\
  \ 100,000 行的 `PyQt` 应用程序，编程团队规模从一个人到十多人不等。许多内部工具是使用 `PyQt` 编写的，但由于这些工具是为了获得竞争优势，相关公司通常不允许公开其\
  \ `PyQt` 的使用。`PyQt` 在开源世界也被广泛使用，游戏、实用程序、可视化工具和 IDE 都是使用它编写的。\n\n本书专门介绍 `PyQt4`，它是\
  \ `Qt 4` C++ 应用开发框架的 Python 绑定。★ `PyQt4` 以十个 Python 模块的形式提供，这些模块共包含了约 400 个类和约 6000\
  \ 个方法和函数。所有的示例程序都在 Windows、Linux 和 Mac OS X 上通过测试，使用了 `Python 2.5`、`Qt 4.2` 和 `PyQt\
  \ 4.2`，此外还在 Windows 和 Linux 上使用了 `Qt 4.3` 和 `PyQt 4.3` 进行测试。在某些情况下可以移植到早期版本，但我们建议使用最新版本的\
  \ `Python`、`Qt` 和 `PyQt`。\n\n`Python`、`PyQt` 和 `Qt` 可以免费用于非商业目的，但 `Python` 使用的许可证与\
  \ `PyQt` 和 `Qt` 使用的许可证不同。\n\n`Python` 提供非常宽松的许可证，允许其用于开发商业和非商业应用程序。`PyQt` 和 `Qt`\
  \ 都是双重许可的：这本质上允许它们用于开发非商业应用程序——这些应用程序反过来必须使用接受的开源许可证（如 `GNU General Public License`\
  \ (`GPL`）进行进行许可；或者用于开发商业应用程序——在这种情况下，必须购买商业 `PyQt` 许可证*和*商业 `Qt` 许可证。\n\n# 本书结构\n\
  \n本书分为四个部分。第一部分主要是一个面向熟悉面向对象语言的非 Python 程序员的快速转换课程，尽管它也包含了一些（有明确标记的）`PyQt` 内容。由于核心\
  \ `Python` 语言大部分简单且非常精小，这些章节可以充分地教授 `Python` 的基础知识，以到能够编写真实的 `Python` 应用程序。\n\n\
  如果你认为可以通过阅读来简单地掌握 `Python` 语法，你可能会想跳过第一部分，直接进入从第二部分开始的 GUI 编程。第二部分的早期章节包含了对第一部分相关页面的反向引用，以支持选择这种方法的读者。然而，即使对于熟悉\
  \ `Python` 的读者，我们也建议阅读第 1 章中关于 `QString` 的内容。如果你不熟悉部分函数应用（柯里化），那么阅读第 2 章中涵盖此内容的章节是非常重要的，因为这种技术有时用于\
  \ GUI 编程。\n\n★ 还有针对旧版 `Qt 3` 库的 Python 绑定，但没有理由在新项目中使用该库，特别是 `Qt 4` 提供了多得的功能且更容易使用。\n\
  \n第二部分首先通过展示三个微小的 `PyQt` GUI 应用程序，让对 `PyQt` 编程给出一个初步印象。它还解释了涉及 GUI 编程的一些基本概念，包括\
  \ `PyQt` 的高级信号与槽通信机制。第 5 章展示了如何创建对话框，以及如何在对话框中创建和布局部件（Windows 术语中称为“控件”——构成用户界面的图形元素，如按钮、列表框等）。对话框是\
  \ GUI 编程的核心：大多数 GUI 应用程序都有一个主窗口和几十个甚至数百个对话框，因此这个主题被深入涵盖。\n\n对话框章节之后是第 6 章，该章节涵盖了主窗口，包括菜单、工具栏、停靠窗口和快捷键，以及加载和保存应用程序设置。第二部分的最后章节展示了如何使用\
  \ `Qt Designer`（`Qt` 的视觉设计工具）创建对话框，以及如何以二进制、文本和 XML 格式保存数据。\n\n第三部分对第二部分涵盖的一些主题进行了更深入的介绍，并引入了许多新主题。第\
  \ 9 章展示了如何以相当复杂的方式布局部件，以及如何处理多个文档。第 10 章涵盖了低级事件处理程序，以及如何使用剪贴板以及拖放、文本、HTML 和二进制数据。第\
  \ 11 章展示了如何修改和子类现有部件，以及如何从头创建全新的部件，并对其外观和行为进行完全控制。这一章还展示了如何进行基础图形处理。第 12 章展示了如何使用\
  \ `Qt 4.2` 新的图形视图架构，该架构特别适用于处理大量的独立图形对象。第 13 章了支持 HTML 的富文本引擎。这一章还涵盖了打印到纸和 PDF 文件。\n\
  \n第三部分以两个关于模型/视图编程的章节结束：第 14 章介绍了该主题并展示了如何使用 `Qt` 的内置视图以及如何创建自定义数据模型和自定义代理，第 15\
  \ 章展示了如何使用模型/视图架构进行数据库编程。\n\n第四部分继续模型/视图主题，在第 16 章涵盖了三个不同的高级模型/视图主题。第 17 章的第一部分描述了用于提供在线帮助的技术，第二部分解释了如何使应用程序国际化，包括如何使用\
  \ `Qt` 的翻译工具创建翻译文件。Python 标准库提供了自己的用于网络和线程的类，但在第四部分的最后两章中，我们展示了如何使用 `PyQt` 进行网络和线程。\n\
  \n附录 A 解释了从哪里获取 `Python`、`PyQt` 和 `Qt` 以及如何在 Windows、Mac OS X 和 Linux 上安装它们。如果你安装它们并尝试一些练习，并且检查一些示例代码，学习\
  \ `PyQt` 会容易得多。附录 B 展示了选取 `PyQt` 部件的截图和简要描述；这对于 GUI 编程的新手非常有帮助。\n\n附录 C 了部分 `PyQt`\
  \ 类层次结构的图；这有助于了解 `PyQt` 提供的类以及它们之间的关系。\n\n\n\n\n在本部分的第 9 章和第 14 章可以独立阅读，但第 15 章假设你已经读过第\
  \ 14 章。\n\n在第四部分，第 16 章假设你已经读过第 14 章和第 15 章，但其他章节可以独立阅读。\n\n如果你在文中或示例中发现错误，或有其他意见，请写邮件至\
  \ `mark@qtrac.eu` 并在主题行注明“PyQt book”。本书的主页将发布任何修正内容，并从那里下载示例和练习解答，地址为 [`www.qtrac.eu/`](http://www.qtrac.eu/pyqtbook.html)\n\
  \n[pyqtbook.html](http://www.qtrac.eu/pyqtbook.html)\n\n如果你想参与 PyQt 社区，加入邮件列表是值得的。访问\
  \ [`www.riverbankcomputing.com/mailman/listinfo/pyqt`](http://www.riverbankcomputing.com/mailman/listinfo/pyqt)\
  \ 存档链接，这样你就可以查看邮件列表的内容，并找到加入表格。Python 也有邮件列表和其他社区活动。访问这些内容请前往 [`www.python.org/community.`](http://www.python.org/community)\n\
