  \ `s` |\n(省略重复部分)\n\n\n\n\n`copy_reg` 模块用于指定如何读写非标准数据类型。这些信息通过调用 `copy_reg.pickle()`\
  \ 并传入两个参数提供。第一个参数是我们希望能够 pickle（序列化）的新样式类，第二个参数是一个函数。该函数必须接受一个参数，即我们想要 pickle 的类的实例，并应该返回一个二元组，二元组的第一个元素是类，第二个元素是一个标准\
  \ Python 类型的元组，这些类型可以传递给类的构造函数以创建一个与传入实例具有相同值的实例。\n\n有了这些信息，`pickle` 模块可以通过将类名存储为文本并将参数存储为标准\
  \ Python 类型的元组来存储我们类的实例。然后，当我们想要反序列化（加载）数据回来时，Python 使用 `eval()` 来重新创建我们的实例。\n\n\
  PyQt 4.3 包含了对基本 Qt 数据类型的序列化支持，包括 `QByteArray`、`QChar`、`QColor`、`QDate`、`QDateTime`、`QKeySequence`、`QLine`、`QLineF`、`QMatrix`、`QPoint`、`PyQt`、`QPointF`、`QPolygon`、`QRect`、`QRectF`、`QSize`、`QSizeF`、`QString`、`QTime`\
  \ 以及所有的 PyQt `4.3` 举。这意味着我们可以“pickle”任何这些类型，而无需编写和注册自己的序列化函数。\n\n```python\ndef\
  \ savePickle(self):\n    error = None\n    fh = None\n    try:\n        fh = gzip.open(unicode(self.__fname),\
  \ \"wb\")\n        cPickle.dump(self.__movies, fh, 2)\n    except (IOError, OSError),\
  \ e:\n        error = \"Failed to save: %s\" % e\n    finally:\n        if fh is\
  \ not None:\n            fh.close()\n    if error is not None:\n        return False,\
  \ error\n    self.__dirty = False\n    return True, \"Saved %d movie records to\
  \ %s\" % (\n        len(self.__movies),\n        QFileInfo(self.__fname).fileName())\n\
  ```\n\n我们可以轻松地将任何 Python 数据结构（包括递归数据结构）保存为 pickle。我们通过以二进制模式打开文件并使用 `dump()` 函数来实现。在例例中，我们选择保存压缩后的\
  \ pickle（这可能会减少约 50% 的文件大小），但我们也可以避免使用这种压缩：\n\n```python\nfh = open(unicode(self.__fname),\
  \ \"wb\")\n```\n\n### 第 8 章 数据处理与自定义文件格式\n\n我们必须将文件名转换为 unicode，因为它是作为 `QString`\
  \ 存储的。`open()` 的 `wb` 参数意味着“写入二进制”。`dump()` 函数接收一个 Python 数据结构（在本例中为我们的 `[key, movie]`\
  \ 列表）、一个文件句柄和一个格式代码。我们始终使用格式代码 `2`，这意味着 pickle 二进制格式。\n\n由于键是通过 `key()` 方法生成的，我们实际上只需要保存\
  \ `Movie` 实例，而不是 `[key, movie]` 列表。如果磁盘空间非常稀缺，我们可能会这样做，但这要求我们在加载数据时重新生成键，因此它代表了磁盘空间与保存及加载速度之间的权衡。为了\
  \ sake 于实现更快速、更方便的保存和加载，我们选择了牺牲磁盘空间。\n\n```python\ndef loadPickle(self):\n    error\
  \ = None\n    fh = None\n    try:\n        fh = gzip.open(unicode(self.__fname),\
  \ \"rb\")\n        self.clear(False)\n        self.__movies = cPickle.load(fh)\n\
  \        for key, movie in self.__movies:\n            self.__movieFromId[id(movie)]\
  \ = movie\n    except (IOError, OSError), e:\n        error = \"Failed to load:\
  \ %s\" % e\n    finally:\n        if fh is not None:\n            fh.close()\n \
  \   if error is not None:\n        return False, error\n    self.__dirty = False\n\
  \    return True, \"Loaded %d movie records from %s\" % (\n        len(self.__movies),\n\
  \        QFileInfo(self.__fname).fileName())\n```\n\n反序列化几乎和序列化一样简单。我们必须记住使用 `gzip`\
  \ 打开文件以便其被解压缩。`open()` 的 `rb` 参数意味着“读取二进制”。我们使用 `pickle load()` 函数来检索数据；它接收一个文件句柄并返回整个数据结构。我们将数据结构直接赋值给我们的\
  \ `__movies` 列表。然后我们遍历电影来填充 `__movieFromId` 字典：这不能被保存，因为它依赖于 `Movie` 的 `id()`，这些\
  \ 在每次应用程序运行时都会变化。\n\n序列化和反序列化是保存和加载二进制数据最简单的方法，对于数据存储在标准 Python 数据类型的情况是非常理想的。如果我们将数据存储为\
  \ `PyQt` 数据类型，通常是使用 `QDataStream`。该类比 `pickle` 模块在存储复杂的 PyQt 数据类型（如图像）方面更高效（因为没有序列化所需的转换开销），并且产生的文件比\
  \ `pickle` 模块产生的更紧凑（除非序列化数据经过了压缩）。它还便于与 C++/Qt 应用提供无缝的数据格式互操作性。\n\n### 保存和加载文本文件\n\
  \nPyQt 和 Python 标准库提供了读写文本文件的设施。PyQt 使用 `QTextStream` 类，而 Python 标准库使用 `codecs`\
  \ 模块。\n\n纯文本格式通常是人类可读的（例如，在文本编辑器中），并且通常很容易编写。任何类型的数据都可以以某种方式作为纯文本写入。数字和日期可以使用它们的字符串表示非常容易且紧凑地写入，而其他类型（如图像）可以用更冗长的形式写入——例如，使用\
  \ `.xpm` 格式。\n\n读取包含非文本数据或具有结构（例如，记录结构）的纯文本意味着我们必须编写一个解析器，这可能非常困难，特别是对于复杂数据或复杂的数据结构。\n\
  \n纯文本格式在保持与早期格式兼容的同时进行扩展也可能非常棘手，而且它们由于读取编码和写入编码之间的差异而极容易被误读，因为用户可能会使用假设编码与实际使用的编码不同的文本编辑器来编辑它们。这些格式对于存储简单数据类型的简单文件结构最有用。\n\
  \n| 格式 | 示例 |\n| :--- | :--- |\n| `{{MOVIE}}` | |\n| `*title*` ↵ | `{{MOVIE}} 12\
  \ Monkeys` |\n| `*year*`, `*minutes*`, `*acquired*` ↵ | `1995 129 2001-06-21` |\n\
  | `{NOTES}` ↵ | `{NOTES}` |\n| `*notes*` ↵ | `Based on Jetée` |\n| `{{ENDMOVIE}}`\
  \ ↵ | `{{ENDMOVIE}}` |\n\n**图 8.4** My Movies 文本格式\n\n我们需要的数据只包含简单类型：字符串、整数和日期。但我们仍然需要对文本进行结构以区分每个电影记录，并且必须考虑到注释可能跨行的事实。\n\
  \n我们选择的结构如图 8.4 所示。在左侧的格式列中，空格由空格表示，换行由 ↵ 表示。注释可以跨行，但我们假设没有注释行是以 `{{ENDMOVIE}}`\
  \ 开始的。\n\n如果格式非常简单，可能是使用 `QSettings` 对象并让它读写到指定的文件，而不是手动编码。\n\n### 第 8 章 数据处理与自定义文件格式（续）\n\
  \n#### 使用 QTextStream 读写\n\n使用 `QTextStream` 以文本格式写入的代码与我们使用 `QDataStream` 写入的代码非常相似。\n\
  \n```python\ndef saveQTextStream(self):\n    error = None\n    fh = None\n    try:\n\
  \        fh = QFile(self.__fname)\n        if not fh.open(QIODevice.WriteOnly):\n\
  \            raise IOError, unicode(fh.errorString())\n        stream = QTextStream(fh)\n\
  \        stream.setCodec(CODEC)\n        for key, movie in self.__movies:\n    \
  \        stream << \"{{MOVIE}} \" << movie.title << \"\\n\" \\\n            << movie.year\
  \ << \" \" << movie.minutes << \" \" \\\n            << movie.acquired.toString(Qt.ISODate)\
  \ \\\n            << \"\\n{NOTES}\"\n            if not movie.notes.isEmpty():\n\
  \                stream << \"\\n\" << movie.notes\n            stream << \"\\n{{ENDMOVIE}}\\\
  n\"\n```\n\n\n\n\n\n有两个关键点需要注意。首先，我们必须指定想要使用的编码。在所有情况下，我们都使用 UTF-8；（`CODEC` 存储文本\
  \ `UTF-8`）。如果不这样做，`PyQt` 将使用本地的 8 位编码，这在美国可能可能是 `ASCII`、`Latin-1` 或 `UTF-8`，在西欧可能是\
  \ `Latin-1` 或 `UTF-8`，而在日本则可能是 `EUC-JP`、`JIS`、`Shift-SIS` 或 `UTF-8`。通过指定编码，我们确保始终使用所指定的编码进行读写，以防字符被误读。遗憾的是，我们无法保证用户会使用正确的编码来编辑我们的文本文件。如果文件可能会被编辑，我们可以在第一行用\
