  \ `QTableView` 和 `QTableWidget.setItem()`。这两个部件都可以在单元格（包括头部单元格）中显示图标和文本。\n\n此部件用于空间有限的情况，或仅作为逻辑分组部件的手段。标签（Tabs）有两个形状设置，并可以在顶部、左侧、右侧或底部显示，当在左侧或右侧显示时`QTabWidget`\
