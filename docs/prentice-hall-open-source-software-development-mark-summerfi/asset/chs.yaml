  ![Image 112](img/index-593_6.png)\n578\n\n### QLCDNumber\n这是一个用于以七段 LCD 风格显示数字的显示控件。\n\
  \n### QButtonBox\n此控件用于创建一行或一列按钮。按钮将根据系统准则自动排列，使用原生字体。\n\n### QFont, QFontDatabase\n\
  `QFont` 提供弹出的字体对话框，例如，我们使用 `QFontDatabase.families()` 返回列表。\n\n### QListWidget\n\
  通过这些控件，用户可以选择一个项目，或者在合适的选择模式下选择多个项目。这些控件可以是列表模式（如图所示也可以也可以图标模式，在图标模式下图标会更大，文本显示在图标下方。\n\
