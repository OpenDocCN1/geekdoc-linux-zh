  \n表单对于具有许多字段的表格非常有用，特别是当根据字段间的依赖关系需要大量验证时。但对于字段较少的表格，或者用户希望看到多条记录的表格，我们需要使用表格视图。这是下一节的主题。\n\
  \n### 使用数据库表格视图\n\n展示数据库数据最自然且方便的方法是在 GUI 表格中显示数据库表和视图。这允许用户一次看到许多记录，对于显示主从详情关系（master–detail\
  \ relationships）特别为方便。\n\n在本节中，我们将检查资产管理器（Asset Manager）应用程序。代码位于 `chap15/assetmanager.pyw`。该应用程序有四个表，通过以下\
  \ SQL 语句创建：\n\n```python\nquery = QSqlQuery()\nquery.exec_(\"\"\"CREATE TABLE actions\
  \ (\n    id INTEGER PRIMARY KEY AUTOINCREMENT UNIQUE NOT NULL,\n    name VARCHAR(20)\
  \ NOT NULL,\n    description VARCHAR(40) NOT NULL)\"\"\")\n\nquery.exec_(\"\"\"\
  CREATE TABLE categories (\n    id INTEGER PRIMARY KEY AUTOINCREMENT UNIQUE NOT NULL,\n\
  \    name VARCHAR(20) NOT NULL,\n    description VARCHAR(40) NOT NULL)\"\"\")\n\n\
  query.exec_(\"\"\"CREATE TABLE assets (\n    id INTEGER PRIMARY KEY AUTOINCREMENT\
  \ UNIQUE NOT NULL,\n    name VARCHAR(40) NOT NULL,\n    categoryid INTEGER NOT NULL,\n\
  \    room VARCHAR(4) NOT NULL,\n    FOREIGN KEY (categoryid) REFERENCES categories)\"\
  \"\")\n\nquery.exec_(\"\"\"CREATE TABLE logs (\n    id INTEGER PRIMARY KEY AUTOINCREMENT\
  \ UNIQUE NOT NULL,\n    assetid INTEGER NOT NULL,\n    date DATE NOT NULL,\n   \
  \ actionid INTEGER NOT NULL,\n    FOREIGN KEY (assetid) REFERENCES assets,\n   \
  \ FOREIGN KEY (actionid) REFERENCES actions)\"\"\")\n```\n\nactions 和 categories\
  \ 表是典型的参考数据表，包含 ID、短描述（name）和长描述（description）。主表是 `assets`；它存储建筑中每个资产的名称、类别和位置。logs\
  \ 表用于跟踪资产在整个生命周期内发生的情况。图 15.4 显示了这些结构图。\n\n**categories**\n**assets**\n**logs**\n\
  **actions**\n\nid, id, id, id\nname, name, assetid, name\ndescription, categoryid,\
  \ date, description\nroom, actionid\n\n**图 15.4** *资产管理器数据库设计* 资产管理器应用程序有一个对话式的主窗口，包含两个处于主从关系的\
  \ `QTableViews`。如图 15.5 所示。顶部的表格显示 assets 表，底部的表格显示与当前资产记录对应的 logs 表记录。用户可以添加和删除资产以及日志记录，并在原地编辑两张表。用户还可以通过弹出合适的对话框来添加、删除和编辑\
