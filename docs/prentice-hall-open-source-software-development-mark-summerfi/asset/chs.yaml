  \ 方法可以在少于 50 行内写完。\n\n解决方案在 `chap14/ships_ans.py` 和 `chap14/ships-delegate-_ans.py`\
  \ 中提供。\n\n## 15. 连接数据库\n\n* 执行 SQL 查询\n* 使用数据库表单视图\n* 使用数据库表格视图\n\n## 数据库\n\nPyQt\
  \ 通过使用 `QtSql` 模块和 PyQt 的模型/视图架构提供了一致的跨平台数据库访问 API。Python 也有一套完全不同的数据库 API，称为 DB-API，但在\
  \ PyQt 中不需要它，且在这里不进行介绍。Qt 的商业版本带有许多数据库驱动程序，而 GPL 版本由于许可限制较少。可用的驱动包括适用于 IBM DB2、Borland\
  \ 的 Interbase、MySQL、Oracle、ODBC（用于 Microsoft SQL Server）、PostgreSQL、SQLite 和 Sybase。然而，像\
  \ PyQt 的任何方面一样，如果需要的驱动不存在，也可以创建额外的数据库驱动程序。\n\n\n\n\n\n但在对数据库进行任何操作之前，我们必须先与它建立连接。在许多数据库应用程序中，这是在创建\
  \ `QApplication` 对象之后、主表单创建或显示之前完成的。其他应用程序会在稍后建立连接——例如，仅在需要时才建立。\n\n要使用 PyQt 的 SQL\
  \ 类，我们必须导入 `QtSql` 模块：\n\n```python\nfrom PyQt4.QtSql import *\n```\n\n通过调用静态方法\
  \ `QSqlDatabase.addDatabase()` 可以建立数据库连接，并传入我们想要使用的驱动名称。然后，我们必须设置各种属性，例如数据库名称、`username`\
  \ 和 `password`。最后，我们必须调用 `open()`建立连接。\n\n```python\ndb = QSqlDatabase.addDatabase(\"\
  QSQLITE\")\ndb.setDatabaseName(filename)\nif not db.open():\n    QMessageBox.warning(None,\
  \ \"Phone Log\",\n    QString(\"Database Error: %1\").arg(db.lastError().text()))\n\
  \    sys.exit(1)\n```\n\n对于 SQLite，我们只需要指定数据库名称。这通常是一个 `filename`，但也可以是特殊名称 `:memory:`\
  \ 用于内存数据库。当我们使用 SQLite 驱动调用 `QSqlDatabase.open()` 时，如果文件不存在，它将会被创建，在这种情况下它不包含任何表或记录。\n\
  \n注意我们将 `None` 作为消息框的父对象：这是因为我们在创建主窗口之前就尝试建立连接，因此没有可能的父对象。由于此应用程序依赖于数据库，如果无法建立连接，它只会向用户显示收到的错误消息并终止应用程序。\n\
  \n如果数据库连接成功打开，从现在起，所有的数据库方法将适用于此连接。如果我们需要两个或多个独立的连接（无论是到同一个数据库还是不同的数据库），我们必须向 `addDatabase()`\
  \ 传递第二个参数，给出连接名称，然后可以使用该名称区分不同的连接。\n\n## 执行 SQL 查询\n\n现在我们已经有了连接，可以执行一些 SQL 语句了。\n\
  \n```python\nquery = QSqlQuery()\nquery.exec_(\"\"\"CREATE TABLE outcomes (\nid\
  \ INTEGER PRIMARY KEY AUTOINCREMENT UNIQUE NOT NULL,\nname VARCHAR(40) NOT NULL)\"\
