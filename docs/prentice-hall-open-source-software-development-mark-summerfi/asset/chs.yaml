  \n确保你使用了 `QTextCursor.beginEditBlock()` 和 `QTextCursor.endEditBlock()`，以便缩进或取消缩进可以作为一个操作进行撤销——QTextEdit\
  \ 支持 Ctrl+Z 撤销。这两个方法总共可以写大约 20 行。\n\n如果你想尝试更有野心的目标，尝试扩展这两个方法，使得如果存在选择，则将缩进或取消缩进应用到选择中的所有行。这会增加大约\
  \ 40 行，并且有点棘手。确保最后原始选择保持在原处。\n\n你需要阅读 `QTextCursor` 的文档，特别是 `anchor()`、`position()`、`setPosition()`\
  \ 和 `movePosition()` 方法。\n\n解决方案在 `chap13/pythoneditor_ans.pyw` 中提供。\n\n\n\n\n`controller`\
  \ 是 Smalltalk 编程语言中的一种范式。\n\n`model` 是一个提供统一接口的类，通过该接口可以访问数据项。`view` 是一个可以将模型中的数据项在屏幕上呈现给用户的类。`controller`\
  \ 是一个在用户界面（例如鼠标事件和按键按下）之间协调的类，为用户提供了操作数据项的方法。\n\n### 视图、控制器或代理、模型、数据集\n\n**图 14.1**\
  \ *模型/视图/控制器与模型/视图/代理*\n\nMVC 方法方法提供了许多用处。例如，它可以处理海量数据集，因为只有实际显示或编辑的数据才会被从数据源读取或写入数据源中。同一数据集的不同视图访问相同的底层数据，且不会产生数据重复：这对于使用两个或多个视图以不同方式查看相同数据，或者查看大型数据集的不同部分非常有用。此外，如果我们更改了数据集的存储方式（例如，从二进制文件更改为数据库），只需要调整\
  \ `model` 即可——`view` 和 `controller` 中的所有逻辑都将继续工作，因为 `model` 完全地将它们与数据隔离开来。\n\nPyQt\
  \ 使用了 MVC 的一种变体，称为 `model/view/delegate`，它提供了与 MVC 相同的所有优点。两者在图 14.1 中都有示意图。\n\n\
  关键区别在于，经典 MVC 留给 `controller` 的某些功能，在 `model/view/delegate` 方法中既可以在 `delegate` 中实现，也可以实现在\
  \ `model` 中。\n\n从概念上讲，`model/view/delegate` 方法的工作原理如下：由 `model` 从数据源读取和写入数据。`view`\
  \ 向 `model` 请求它想要显示的数据项，即在用户界面中可见的那些项。对于 `view` 显示的每一项，它会将该项和一个 `painter` 传递给 `delegate`，并请求\
  \ `delegate` 绘制该项。\n\n同样，如果用户发起了编辑，`view` 会请求 `delegate` 提供一个合适的编辑器，如果用户接受了编辑（即用户没有按\
  \ `Esc` 取消），则更新后的数据将传回 `model`。`editor` 可以是任何 `widget`，它会精确地在项上方原位绘制，给应用程序用户一种该项已变为可编辑的错觉。\n\
  \n`model` 中的每个数据项（因此隐含地包含 `dataset` 中的每个数据项）都可以通过唯一的 `QModelIndex` 来标识。每个 `model\
  \ index` 有三个重要的属性：`row`、`column` 和 `parent`。\n\n1. 对于一维模型（例如列表），只使用 `row`。\n2. 对于二维模型（例如表格，包括数据库表），只使用\
  \ `row` 和 `column`。\n3. 对于分级模型（例如树），所有三个属性都会被使用。\n\n尽管 `QModelIndexes` 可以引用任何 `model`\
  \ 中的任何数据项，但我们需要记住，从概念上讲实际上有两种模型。第一类是表格，它包括列表，因为列表只是单列表格。当我们处理表格时，是基于 `rows` 和 `columns`\
  \ 的概念来工作的。\n\n第二类是树。对于树，我们基于 `parents` 和 `children` 的概念来工作。\n\n（对树也可以采用行列方法，但这违背直觉，会导致代码运行缓慢且难以维护。）无论底层\
  \ `dataset` 是什么，无论数据是在内存中、数据库还是文件中，PyQt `models` 都为数据访问提供了相同的统一接口——特别是 `QAbstractItemModel.data()`\
  \ 和 `QAbstractItemModel.setData()` 方法。还可以创建将 `dataset` 包含在内部自定义自定义，例如对 `dictionary`\
  \ 或 `list` 进行封装的 `model`。\n\n`model` 中持有的所有数据都存储为 `QVariants`。这并不意味着 `dataset` 的所有数据都必须是\
  \ `QVariants`——`model` 是 `dataset` 的接口，在任何给定的会话中可能只访问整个 `dataset` 的一小部分，因此只有实际使用的数据项会被存储为\
  \ `QVariants`，并且只存储在 `model` 中。`model` 负责在底层 `dataset` 数据类型与 `model` 内部使用的 `QVariants`\
  \ 之间进行转换。\n\n某些 PyQt `widgets`，包括 `QListWidget`、`QTableWidget` 和 `QTreeWidget` 是聚合了\
  \ `models` 和 `delegates` 的 `views`。这些是便利项视图小部件，对于小型和临时的数据集特别有用。我们将在本章的第一节看到它们的使用。\n\
  \n![Image 68](img/index-430_1.jpg)\n*使用便利项小部件*\n\nPyQt 还提供了一些纯视图 `widgets`，包括 `QListView`、`QTableView`\
  \ 和 `QTreeView`。这些必须与外部 `models` 一起使用，无论是我们创建的还是内置模型之一（如 `QStringListModel`、`QDirModel`\
  \ 或 `QSqlTableModel`）。在第二节中，我们将学习创建一个可以与 `view` 小部件一起使用的自定义模型。\n\n所有便利视图和纯视图都使用默认的\
  \ `delegate`，它控制数据项的呈现和编辑方式。在本章的最后一节，我们将学习创建一个自定义的 `delegate`，以对数据项的编辑和呈现进行完全控制。自定义\
  \ `delegates` 可以用于任何 `view`，无论是便利视图还是纯视图。\n\n本章提供了使用 PyQt `model/view` 类的基础。在第 15\
  \ 章中，我们将看到如何使用 `model/view` 类来处理数据库，在第 16 章中，我们将涵盖更高级的用法，包括创建自定义 `views`、提高 `delegates`\
  \ 中的代码复用以及在树中呈现表格数据。\n\n本章所有的示例都使用相同的 `dataset`，以便更容易比较和对比所使用的技术。`dataset` 的项在第一节中进行了描述。\n\
  \n### 使用便利项小部件\n\n便利项小部件是内置了 `models` 的视图小部件。\n\n它们使用默认的 `delegate` 来呈现和编辑数据，但如果我们愿意，可以用自定义的\
  \ `delegate` 来替换它。\n\n图 14.2 中的截图显示了三个不同的便利视图 `widgets` 中相同的 `dataset`。这意味着数据被分别拷贝到每个\
  \ `widget` 中，因此存在大量的数据重复。另一个问题是，如果我们允许用户编辑数据，我们必须编写代码来确保所有视图保持同步。如果我们使用自定义的 `model`，这些问题就不会存在。\n\
  \n**图 14.2** *QListWidget、QTableWidget 和 QTreeWidget 的运行实例*\n\n我们使用的 `dataset` 是一组关于集装箱的信息。每艘船由一个\
  \ `Ship` 对象表示，定义在 `chap14/ships.py` 模块。\n\n```python\nclass Ship(object):\n    def\
  \ __init__(self, name, owner, country, teu=0, description=\"\"):\n        self.name\
  \ = QString(name)\n        self.owner = QString(owner)\n        self.country = QString(country)\n\
  \        self.teu = teu\n        self.description = QString(description)\n\n   \
  \ def __cmp__(self, other):\n        return QString.localeAwareCompare(self.name.toLower(),\n\
  other.name.toLower())\n```\n\n前面的代码是完整的 `Ship` 类。整数 `teu` 属性代表“二十英尺等效单位”，即该船可以容纳多少个二十英尺集装箱（现在大多数集装箱是\
  \ 40 英尺，因此每个算作 2 个 TEU）。`name`、`owner` 和 `country` 属性都是纯文本，但 `description` 属性包含了一行\
  \ HTML。\n\n`__cmp__` 特殊方法为排序提供了一种比较手段。`QString.localeAwareCompare()` 方法以感知区域敏感的方式进行字符串比较——例如，正确处理带重音的字符。\n\
  \n\n\n\n由于我们使用了没有自定义代理的便捷视图（convenience views），因此对数据项的编辑控制非常有限。例如，我们无法提供下拉组合框来编辑所有者和国家，也无法使用数值调节框（spinboxes）来编辑\
  \ `TEUs`。此外，描述文本是以原始格式显示的，而不是被解析为 HTML。当然，随着章节的进行，我们将解决所有这些问题，但目前我们只关注便捷视图的使用。\n\
