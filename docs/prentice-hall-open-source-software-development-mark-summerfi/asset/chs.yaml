  \ `PropertiesDlg`。）\n\n## 总结\n\n`Qt Designer` 提供了一种快速简便的方法来创建用户界面。使用视觉化设计工具可以更容易地判断设计是否“有效”。\n\
  \n`Qt Designer` 的另一个优点是，只要我们没有对代码中引用的小部件进行添加、删除或重命名，代码就完全不需要更改。即使我们添加、重命名或删除了小部件，代码的变化可能也很小，因为\
  \ `Qt Designer` 为我们处理了所有的小部件创建和布局。\n\n使用 `Qt Designer` 的基本原理始终相同：我们将小部件拖到表单上，首先是容器（如框架、组框和标签页），然后是普通小部件，并设置它们的属性。接着添加间距器来填充空隙。接下来我们选择特定的小部件、间距器和布局并对它们应用布局，重复此过程直到完成布局。然后我们布局表单本身。最后我们设置伙伴（buddies）、标签顺序和信号-槽连接。\n\
  \n使用 `Qt Designer` 创建的用户界面来实现对话框，与手动实现相似。最大的区别在于初始化器，其中我们只需调用 `setupUi()` 来创建和布局小部件，并创建信号-槽连接。我们实现的方法可以像以前一样（代码没有任何区别），但通常我们使用\
  \ `on_widgetName_signalName` 命名规范，配合 `@pyqtSignature` 装饰器，利用 `setupUi()` 自动创建连接的能力。\n\
  \n我们还没有涵盖的一个用例是使用“Widget”模板创建复合小部件（由两个或多个其他布局在一起的小部件组成）。在某些情况下，这些小部件的设计可以用于整个表单；而在其他情况下，它们可以作为表单的组件——例如为标签页或小部件堆提供页面。或者在表单中布局两个或多个复合小部件创建一个创建一个复杂的表单。通过使用\
  \ `Qt Designer` 并通常方式生成 Python 模块可以实现。然后我们可以导入生成的模块，并在表单类中调用每个自定义小部件的 `setupUi()`\
  \ 方法来创建用户界面。\n\n关于对话框有多智能、应该具有什么模态以及如何验证的问题，使用 `Qt Designer` 创建的对话框与手动创建的没有区别。唯一的例外是我们可以在\
  \ `Qt Designer` 中设置小部件属性——例如，我们可以设置数值框的范围和初始值。当然，我们可以在代码中做相同的事情，但对于只需要简单验证的小部件，在\
  \ `Qt Designer` 中完成这一切通常更方便。\n\n我们必须使用 `pyuic4` 从 `Qt Designer` 的 .ui 文件生成 Python\
  \ 模块，可以直接运行 `pyuic4`，或者使用 `mkpyqt.py` 或 `Make PyQt`，后者在存在 .qrc 文件时也会为资源文件生成 Python\
  \ 模块。\n\n![Image 37](img/index-239_1.png)\n\n![Image 38](img/index-239_2.png)\n\n\
  224\n\n*第 7 节. 使用 Qt Designer*\n\n如果没有使用测试工具，添加仅在单独单运行时执行的测试代码不会影响对话框的性能，在开发和维护对话框期间都非常方便。\n\
  \n如果对话框依赖的复杂对象可用，我们通常可以创建一个“伪”类，提供与复杂对象相同的方法，并传递该伪类的实例用于测试目的。\n\n\n\n\n所有的 PyQt\
  \ 程序都可以完全通过手工编写；永远不需要使用 `Qt Designer`。然而，使用视觉化设计工具设计对话框非常有帮助，因为结果可以立即看到，并且可以快速方便地对设计进行更改。使用\
  \ `Qt Designer` 的另一个优点是，它可以自动用于创建、布局和连接部件的许多重复性代码，而无需手写。在本章和前一章中，我们都使用了 `Qt Designer`\
