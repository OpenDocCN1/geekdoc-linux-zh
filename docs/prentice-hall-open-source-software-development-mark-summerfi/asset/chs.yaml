  \n### 创建主窗口\n\n185\n\n我们已经完成了对初始化主窗口代码的，现在可以开始查看提供应用程序功能必须实现的其他方法。虽然 Image Changer\
  \ 应用程序只是一个特定的示例，但我们尽可能地使代码变得通用化或易于调整，以便其可以作为其他主窗口风格应用程序的基础，即使是完全不同的应用程序也可以。\n\n\
  考虑到我们刚刚进行的讨论，从 `loadInitialFile()` 方法开始介绍似乎是合适的。\n\n```python\ndef loadInitialFile(self):\n\
  \    settings = QSettings()\n    fname = unicode(settings.value(\"LastFile\").toString())\
  \ if fname and QFile.exists(fname):\n    self.loadFile(fname)\n```\n\n该方法使用 `QSettings`\
  \ 对象来获取应用程序上次使用的图像。如果存在这样的图像且它仍然存在，程序将尝试加载它。我们将在介绍文件操作时回顾 `loadFile()`。\n\n我们同样可以写成\
  \ `if fname and os.access(fname, os.F_OK):`。在这里没有明显区别，但对于多人协作的项目，在这种情况下采取优先使用 PyQt\
  \ 而非标准 Python 库或或反之的策略可能是明智的，以保持尽可能的简单清晰。\n\n我们稍早时候讨论过恢复应用程序的状态，所以介绍关闭事件似乎是合适的，因为那是保存应用程序状态的地方。\n\
  \n```python\ndef closeEvent(self, event):\n    if self.okToContinue():\n       \
  \ settings = QSettings()\n        filename = QVariant(QString(self.filename)) \\\
  \n        if self.filename is not None else QVariant()\n        settings.setValue(\"\
  LastFile\", filename)\n        recentFiles = QVariant(self.recentFiles) \\\n   \
  \     if self.recentFiles else QVariant()\n        settings.setValue(\"RecentFiles\"\
  , recentFiles)\n        settings.setValue(\"MainWindow/Size\", QVariant(self.size()))\
  \ \n        settings.setValue(\"MainWindow/Position\", QVariant(self.pos()))\n \
  \       settings.setValue(\"MainWindow/State\", QVariant(self.saveState()))\n  \
  \  else:\n        event.ignore()\n```\n\n如果用户尝试通过任何方式（杀死或崩溃之外）关闭应用程序，就会调用 `closeEvent()`\
  \ 方法。我们首先调用自己自定义的 `okToContinue()` 方法；如果用户真的想关闭，则返回 True，否则返回 False。在 `okToContinue()`\
  \ 内部，我们给用户提供了保存未保存更改的机会。如果用户确实想关闭，我们会创建一个新的 `QSettings` 对象，并存储“上一个文件”（即用户打开的文件）、最近使用的文件以及主窗口的状态。`QSettings`\
  \ 类只读写 `QVariant` 对象，因此我们必须小心提供空 `QVariants`（通过 `QVariant()` 创建）或提供包含正确信息的 `QVariants`。\n\
  \n如果用户选择不关闭，我们在关闭事件上调用 `ignore()`。这将告诉 PyQt 地丢弃关闭事件并让应用程序继续运行。\n\n如果我们正在使用 Qt 4.3（例如使用\
  \ PyQt 4.3）并使用 `QWidget.restoreGeometry()` 恢复了主窗口的几何形状，我们可以这样保存几何形状：`settings.setValue(\"\
  Geometry\", QVariant(self.saveGeometry()))`。如果采用这种方法，就不需要单独保存主窗口的大小或位置。\n\n186\n\
  \n# 第 6 章 主窗口\n\n**表 6.2 精选 QMainWindow 方法**\n\n| 语法 | 描述 |\n| :--- | :--- |\n|\
