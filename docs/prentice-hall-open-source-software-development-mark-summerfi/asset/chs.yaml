  \n```python\ndef readItemFromStream(self, stream, offset=0):\n    type = QString()\n\
  \    position = QPointF()\n    matrix = QMatrix()\n    stream >> type >> matrix\n\
  \    if offset:\n        position += QPointF(offset)\n    if type == \"Text\":\n\
