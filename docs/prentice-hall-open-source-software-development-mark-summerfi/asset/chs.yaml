  \ | 返回封装在 `QByteArray` 中的 `QMainWindow` `m` 的位置和大小\n| `m.saveState()` | 返回封装在 `QByteArray`\
  \ 中的 `QMainWindow` `m` 的停靠窗口和工具栏的状态，即它们和位置 |\n| `m.setCentralWidget(w)` | 将 `QMainWindow`\
  \ `m` 的中心控件设置为 `QWidget` `w` |\n| `m.statusBar()` | 返回 `QMainWindow` `m` 的 `QStatusBar`（在第一次调用此方法时创建）\
