  ```\n\n如果这是用户第一次尝试打印图像，打印机实例变量将为 `None`，因此我们实例化它并为页面大小提供合理的默认值。（默认页面大小为 `QPrinter.A4`）。一旦我们有了打印机对象，就会创建并弹出一个模态\
  \ `QPrintDialog`；用户可以使用它选择他们想要打印的打印机以及各种打印相关的选项。\n\n此对话框因系统而异，因为 PyQt 使用系统的原生打印对话框。如果用户点击打印，我们就能打印图像。\n\
  \nPyQt 有“绘图设备”的概念，可以在上面绘制线条、文本、形状和图像。正如我们在前面的章节中看到的，小部件是一个绘图设备——其外观可以通过绘制阴影和高光来实现。`QImage`\
  \ 是绘图设备，`QPrinter` 也是。所有的绘图设备都可以使用 `QPainter` 进行绘制，因此我们创建一个准备绘制到 `QPrinter` 的新 `QPainter`。\n\
  \n我们获取表示绘图器视口的矩形。视口是绘图区域，对于连接到打印机的绘图器来说，这意味着可以实际绘制的页面区域（许多打印机无法绘制到纸张边缘）。然后我们获取图像尺寸坐标作为一个\
  \ `QSize` 对象，并在保持尺寸宽高比的情况下将其缩放以放入打印机的视口矩形内。如果图像已经足够小可以放入，则没有影响。接下来，我们更改打印机的视口矩形以匹配我们的缩放矩形，保留原始起点，但使用缩放后的宽度和高度。最后，我们在绘图起点绘制图像，就完成了。\n\
  \n如果用户想要 PDF 文件，他们可以调用“打印”操作并选择“打印到文件”选项。在某些平台上，通过将“打印到文件”的扩展名改为 `.ps` 也可以获得 PostScript\
  \ 输出。\n\n## 使用 HTML 和 QTextDocument 打印文档\n\n我们将展示的第一方法涉及创建一个包含 HTML 的字符串，并使用 `QTextDocument`\
  \ 将 HTML 渲染到 `QPrinter`。`printViaHtml()` 方法相当长，所以我们将分三部分来看。\n\n\n\n\n```python\n\
