  \ `s` 中的项数 |\n| `s.clear()` | 从集合 `s` 中删除所有项 |\n| `s.copy()` | 返回集合 `s` 的浅拷贝 |\n\
  | `s.add(x)` | 将项 `x` 添加到集合 `s` |\n| `s.remove(x)` | 从集合 `s` 中删除项 `x`；如果 `s` 中没有该项则抛出\
  \ `KeyError` |\n| `s.discard(x)` | 从集合 `s` 中删除项 `x`；如果 `s` 中没有该项则无操作 |\n| `s.issubset(t)`\
