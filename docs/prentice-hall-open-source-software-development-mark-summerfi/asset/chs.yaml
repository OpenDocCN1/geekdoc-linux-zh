  \ += 1\nblock = block.next()\nreturn html\n```\n\n\n\n如果字体族不为空，或者颜色不是黑色，我们必须使用一个带有\
  \ `face` 或 `color`（或两者都有）属性的 `<font>` 标签。在片段末尾，我们将代表该片段的文本附加到包含整行富文本的 html 字符串中。由于每个块可能包含一个或多个片段，我们增加迭代器的值，当它等于\
  \ `QTextBlock.end()` 时跳出内部 `while` 循环，也就是说在我们处理完该块中的最后一个片段之后。然后我们调用 `QTextBlock.next()`\
  \ 并处理下一个块的片段，最后在到达一个无效块时跳出外部 `while` 循环，这意味着所有块都已处理完毕。最后，我们返回包含表示富文本行编辑框行富文本所需的有效（但是最小的）HTML\
  \ 字符串。\n\n`RichTextLineEdit` 类到此结束。我们将在会在后面的几个章节中使用它。虽然这个子类只提供单行 HTML 编辑器，但我们所看到的技巧可以很容易地应用于用于编辑整个\
  \ HTML 文档的 `QTextEdit` 子类。在这种情况下，我们可能仍然会提供额外的键盘支持，例如用于加粗和斜体的 `Ctrl+B` 和 `Ctrl+I`，甚至可能是文本效果右菜单。但对于更大型文档（如列表和表格）的其他文本效果、颜色和格式，我们将像任何传统的\
  \ HTML 编辑器或文字处理器一样通过菜单选项和工具栏按钮提供。\n\n# 打印文档\n\n从 PyQt 获取打印输出可以通过多种方式。一种方法是产生另一种程序可以打印的形式的输出，例如为\
  \ Web 浏览器打印生成 HTML 或为精通 SVG 的绘图程序生成 SVG。\n\n从 Qt 4.1 开始，用户可以通过 `Qt` 检查“打印到文件”选项，通过打印对话框生成\
  \ PDF 文档。也可以通过程序生成 PDF 文档。例如，假设该文档是一个 `QTextDocument`：\n\n```python\nprinter = QPrinter()\n\
  printer.setPageSize(QPrinter.Letter)\nprinter.setOutputFormat(QPrinter.PdfFormat)\n\
  printer.setOutputFileName(filename)\ndocument.print_(printer)\n```\n\n这些方法对于用户来说没有在应用程序内部拥有打印设施那么方便，为了实现这一点，PyQt\
  \ 提供了三个主要选择：\n\n1. 我们可以生成 HTML，将其交给 `QTextDocument`，并使用 `QTextDocument.print_()`\
  \ 传入一个 `QPrinter`，或者使用 `QTextDocument.drawContents()` 传入一个 `QPainter` 来渲染文档。\n2.\
  \ 我们可以创建一个 `QTextDocument` 并从中获取一个 `QTextCursor`，通过它可以程序化生成文档，并再次使用 `print_()` 或\
  \ `drawContents()` 方法进行渲染。\n3. 我们可以创建一个 `QPainter` 直接绘制到 `QPrinter` 上，即绘制到打印的页面上。这是最费力的方法，但它提供了最大程度的控制。\n\
  \n本节涵盖的示例应用程序展示了所有三种技术。\n\n它打印客户账单，每个 `Statement` 对象持有公司名称、联系人姓名、地址和交易列表，每个交易都是一个\
  \ `(QDate, float)` 元组。`Statement` 类还提供了一个 `balance()` 方法，返回交易总和。我们想在右上角打印发行者的标志和地址，下方是日期，左侧是客户的地址，然后是一个格式化字母，其内容取决于客户是欠方还是贷方，然后是交易表格和结语段落。自然地，我们还希望每份账单都从新的一页开始。我们假设所有的账单都存储在一个名为\
  \ `self.statements` 的列表中，并且我们的打印是使用持有这些账单的表单的方法完成的。页面看起来如图 13.4 所示。但在查看这三种通用打印技术之前，我们将查看如何打印图像，特别是展示我们在第\
  \ 6 节介绍过的 Image Changer 应用程序使用的 `filePrint()` 方法的实现。\n\n## 打印图像\n\n在第 6 节中，我们有一个用于打印图像的\
  \ `MainWindow.filePrint()` 方法，但当时没有查看它的实现，因为我们还没有介绍 `QPainter`。现在我们已经在第 11 节中看到了\
  \ `QPainter`，并看到了通用的“打印图像”函数，现在我们可以查看 Image Changer 应用程序使用的 `filePrint()` 方法的实现。（源代码\
  \ `Images` 位于 `chap06/imagechanger.pyw`。）\n\n```python\ndef filePrint(self):\n \
