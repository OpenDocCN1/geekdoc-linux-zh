  \ `Qt` 分页符，这可以通过将 `page-break-after` 样式选项设置为 `always` 来实现。该样式选项是在 Qt 4.2 中引入的，在早期版本中会被忽略。\n\
  \n```python\ndialog = QPrintDialog(self.printer, self)\nif dialog.exec_():\n   \
