  \ << ship.name << ship.owner << ship.country \\\n    << ship.description\n    stream.writeInt32(ship.teu)\n\
  ```\n\n得益于使用 `QDataStream`，我们不需要担心字符串的长度或编码问题。船只以相应的方式加载的：这里是 `load()` 方法的一个摘录：\n\
