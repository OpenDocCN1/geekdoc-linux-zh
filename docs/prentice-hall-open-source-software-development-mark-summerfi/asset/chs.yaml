  \ HTML 字符进行转义。`address` 被存储为单行并用逗号分隔每个部分；我们将逗号替换为换行符。Logo 位于资源文件中，如 `:/` 前缀所示；它可以是文件系统中的任何文件，也可以是\
  \ PyQt 支持的任何图像格式。\n\n*第 13 章.富文本与打印*\n\n到目前为止，我们一直使用 Python 的 `%` 运算符对字符串进行格式化。但在某些情况下，使用\
  \ PyQt 的字符串格式化会更有优势。`QString` 类有一个 `arg()` 方法，可以接受一个对象（通常是字符串或数字）以及一些可选参数。每次调用 `arg()`\
  \ 将 `QString` 中最左侧的 `% *n` 项替换为相应的文本。例如：\n\n```\nQString(\"Copied %1 bytes to %2\"\
  ).arg(5387).arg(\"log.txt\")\n```\n生成的字符串为：\nCopied 5387 bytes to log.txt\n\n`%\
  \ *n` 项没有像 Python 的 `%` 运算符那样的格式化语法，但可以通过向 `arg()` 方法传递额外的参数来实现格式化。还可以通过 `%L *n`\
  \ 来本地化格式化。例如：`QString(\"Copied %L1 bytes to %2\").arg(5387).arg(\"log.txt\")` 生成的字符串为：\n\
  Copied 5,387 bytes to log.txt\n在美国和英国，而在某些其他国家，数字显示为 5.387。\n\n在我们的示例中，我们希望使用两位打印金额，并让整数部分的数字每三位分组。\n\
  \n这可以通过使用 `arg()` 并传入四个参数来实现：作为 `float` 类型的金额、数字占据的最小字符数、输出格式（普通浮点数使用 `\"f \"`，科学计数法使用\
  \ `\"e\"` 或 `\"E\"`）以及小数点后的位数。如果指定了最小字符数，还可以提供第五个参数，即填充字符。\n\n在示例中，我们使用了：\n```python\n\
  QString(\"$ %L1\").arg(float(balance), 0, \"f\", 2))\n```\n金额为 64 325.852 的余额在美国将将输出为字符串\
  \ $ 64,325.85。\n\n回到代码，我们添加了一些根据客户是欠方还是贷方而变化的文本。然后我们创建了一个三列的 HTML 表格头，第一行跨越所有列并包含标题“Transactions”（交易）。`&nbsp;`\
  \ 是一个 HTML 实体，表示不换行空格。\n\n```python\nfor date, amount in statement.transactions:\n\
