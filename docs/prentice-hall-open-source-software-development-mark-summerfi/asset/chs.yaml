  \    owner = QString()\n    country = QString()\n    description = QString()\n \
  \   stream >> name >> owner >> country >> description teu = stream.readInt32()\n\
  \    self.ships.append(Ship(name, owner, country, teu, description))\nself.owners.add(unicode(owner))\n\
  self.countries.add(unicode(country))\n```\n\n如前所述，我们保留了所有者和国家的集合，以便在添加自定义委托时可以在组合框中使用它们。\n\
  \n实现自定义模型（特别是列表模型和表格模型）非常简单。对于只读模型，我们只需要实现三个方法，尽管通常我们会实现四个。对于可编辑模型，我们通常总计要实现八个方法。一旦你创建了几模型，创建其他模型就会变得容易，因为所有列表和表格模型遵循相同的模式。实现树形模型更具挑战性；该主题在第\
  \ 16 章最后一节中介绍。\n\n![Image 70](img/index-451_1.png)\n\n*第 14 章. 模型/视图编程*\n\n### 创建自定义委托\n\
  \n如果我们想对数据项的显示和编辑进行完全控制，我们必须创建一个自定义委托。委托可以仅用于控制外观（例如，用于只读视图），也可以通过提供自定义编辑器来控制编辑，或者两者兼顾。\n\
  \n**图 14.4** 运行中的自定义委托\n\n图 14.4 看起来之前的截图相似，唯一的显著区别是描述文本经过了正确的格式化，而不是显示原始 HTML。然而，差异要深得多。例如，如果我们编辑所有者或国家字段，我们将获得填充有当前所有者和国家的组合框；如果我们编辑\
  \ TEU，我们将得到一个数字调节框（spinbox）。对外观和编辑的所有这些控制都是通过使用委托实现的——委托可以与便利视图或纯视图配合，尽管在本例中我们在纯视图中使用该委托。\n\
  \n本节我们使用 `chap14/ships-delegate.pyw` 应用程序。这与 `ships-model.pyw` 几乎相同，仅区别在于窗口标题、**PyQt**\
  \ 我们缩放了所有列而不是跳过描述列，以及 **4.1** 我们使用了自定义委托这一事实。委托类 `ShipDelegate` 位于 `chap14/ships.py`。注意，该类需要\
  \ `PyQt` 4.1 或更高版本。委托类继承自 `QItemDelegate`。注意该类需要 `PyQt` 4.1 或更高版本。与子类一样，委托遵循相同的模式。对于只读模型，唯一需要重新实现的是\
  \ `paint()`。对于可编辑模型，我们必须重新实现 `createEditor()`、`setEditorData()`、`setModelData()`\
  \ 以及 `commitCloseEditor()`。最后，有时需要重新实现 `sizeHint()`，如我们将看到的。\n\n*自定义委托*\n\n我们经常创建只处理某些列的委托，当涉及到绘图时，基类处理的默认行为已经足够了。我们将通过查看\
  \ `MainForm` 构造函数的一个小摘录开始：\n\n```python\nclass MainForm(QDialog):\n    def __init__(self,\
  \ parent=None):\n        super(MainForm, self).__init__(parent)\n        self.model\
  \ = QTableModel(QString(\"Table\"))\n        self.tableView1 = QTableView()\n  \
  \      self.tableView1.setModel(self.model)\n        self.tableView1.setItemDelegate(\n\
  ```\n\n委托必须接收表单作为父对象以保持存活。与前节的区别在于我们调用了 `setItemDelegate()`，传递了一个新构造的 `ShipDelegate`。现在工作将由委托处理。\n\
  \n```python\nclass ShipDelegate(QItemDelegate):\n    def __init__(self, parent=None):\n\
  \        super(ShipDelegate, self).__init__(parent)\n```\n\n通常，委托的构造函数除了初始化基类外不需要做任何事情。事实上，对于此类情况，我们可以省略\
  \ `__init__()`。\n\n```python\ndef paint(self, painter, option, index):\n    if index.column()\
  \ == DESCRIPTION:\n        text = index.model().data(index).toString()\n       \
  \ palette = QApplication.palette()\n        document = QTextDocument()\n       \
  \ document.setDefaultFont(option.font)\n        if option.state & QStyle.State_Selected:\n\
  \            document.setHtml(QString(\"<font color=%1>%2</font>\")\n          \
  \  .arg(palette.highlightedText().color().name())\n            .arg(text))\n   \
  \     else:\n            document.setHtml(text)\n        color = palette.highlight().color()\
  \ \\\n        if option.state & QStyle.State_Selected \\ else QColor(index.model().data(index,\
  \ Qt.BackgroundColorRole))\n        painter.save()\n        painter.fillRect(option.rect,\
  \ color)\n        painter.translate(option.rect.x(), option.rect.y())\n        document.drawContents(painter)\n\
  \        painter.restore()\n    else:\n        QItemDelegate.paint(self, painter,\
  \ option, index)\n```\n\n\n\n\n\n随后我们获取应用程序的调色板（palette）——这是基于用户的主题颜色偏好。如果选择了该项，我们将调色板的高亮文本颜色应用到\
  \ HTML；否则，我们保持原样使用 HTML。`QColor.name()` 方法将颜色以十六进制字符串的形式返回；例如，红色将返回为字符串 \"#FF0000\"\
  ，这与 HTML 颜色规范使用的格式相同。同样，如果选了该项，我们将使用调色板的高亮背景颜色；否则，我们将通过调用带有 `Qt.BackgroundColorRole`\
  \ 的 `data()` 方法来使用模型指定的背景颜色。\n\n`QTextDocument.drawContents()` 方法相对于绘制器（painter）的左上角坐标\
  \ (0, 0) 进行绘图。因此，我们将绘制器的左上角移动（平移）到样式选项矩形的 (`x`, `y`) 位置，然后告诉文档在绘制器上绘制其自身内容。\n\n\
  在很多情况下，我们不需要费心在绘图事件之间保存和恢复绘制器的状态，但在这种情况下我们必须这么做。一些 Qt 程序员认为，始终保存和恢复绘制器的状态是一种良好的习惯，而另一些人则倾向于仅在必要时才这样做，即只有当他们对绘制器的状态应用持久更改时（例如应用平移等变换）才这样做。\n\
  \n遗憾的是，绘制 HTML 的故事并没有就此结束。当视图请求 HTML 列的尺寸提示（size hint）时，默认行为将是返回一个基于视图字体和字符数量的尺寸提示。\n\
  \n### 创建自定义代理（Delegates）\n\n由于 HTML 相当冗长，计算中使用的字符数量可能远大于实际显示的数量。\n\n这个问题有两个解决方案，两种方案都要求我们自己为\
  \ HTML 文本计算尺寸提示。一种方案是修改 `QAbstractTableModel.data()` 方法，并在调用带有 `Qt.SizeHintRole`\
  \ 的 `data()` 时返回一个合适的尺寸提示。另一种方案是重新实现 `QItemDelegate.sizeHint()` 方法。我们更倾向于重新实现 `sizeHint()`，因为这样可以将问题及其解决方案保持在同一个类中。\n\
  \n```python\ndef sizeHint(self, option, index):\n    fm = option.fontMetrics\n \
  \   if index.column() == TEU:\n        return QSize(fm.width(\"9,999,999\"), fm.height())\n\
  \    if index.column() == DESCRIPTION:\n        text = index.model().data(index).toString()\n\
  \        document = QTextDocument()\n        document.setDefaultFont(option.font)\n\
  \        document.setHtml(text)\n        return QSize(document.idealWidth() + 5,\
  \ fm.height())\n    return QItemDelegate.sizeHint(self, option, index)\n```\n\n\
  `option` 参数是一个 `QStyleOptionViewItem`，它是 `QStyleOption` 的子类，具有多个有用属性。在这个方法中，我们实际上负责了两个列的尺寸提示。对于\
  \ `TEU`，我们返回一个宽度足够以容纳我们预期处理的最大 TEU 的尺寸提示。对于描述（description），我们使用 `QTextDocument()`\
  \ 根据其字体和字体属性计算文本的“理想”宽度，再加上 5 像素的微边距。对于其他列，我们将工作交给基类。\n\n通常情况下，代理完全不重新实现 `paint()`\
  \ 方法，而是依赖于完美的默认绘图行为，而仅为编辑数据项提供自定义方法。\n\n```python\ndef createEditor(self, parent,\
  \ option, index):\n    if index.column() == TEU:\n        spinbox = QSpinBox(parent)\n\
  \        spinbox.setRange(0, 200000)\n        spinbox.setSingleStep(1000)\n    \
  \    spinbox.setAlignment(Qt.AlignRight|Qt.AlignVCenter)\n        return spinbox\n\
  \    elif index.column() == OWNER:\n        combobox = QComboBox(parent)\n     \
  \   combobox.addItems(sorted(index.model().owners))\n        combobox.setEditable(True)\n\
  \        return combobox\n    elif index.column() == COUNTRY:\n        combobox\
  \ = QComboBox(parent)\n        combobox.addItems(sorted(index.model().countries))\n\
  \        combobox.setEditable(True)\n        return combobox\n    elif index.column()\
  \ == NAME:\n        editor = QLineEdit(parent)\n        self.connect(editor, SIGNAL(\"\
  returnPressed()\"),\n        self.commitAndCloseEditor)\n        return editor\n\
  \    elif index.column() == DESCRIPTION:\n        editor = richtextlineedit.RichTextLineEdit(parent)\n\
  \        self.connect(editor, SIGNAL(\"returnPressed()\"),\n        self.commitAndCloseEditor)\n\
  \        return editor\n    else:\n        return QItemDelegate.createEditor(self,\
  \ parent, option,\n        index)\n```\n\n当用户对数据项启动编辑时（通常通过按 F2 或双击），视图会请求代理为该项提供一个编辑器。\n\
  \n对于任何我们不想或不需要自己处理的项，我们可以直接将工作交给基类，但在该代理中，我们更倾向于自己处理每一列。\n\n对于 `TEU` 列，我们创建并返回一个数字调节框（spinbox）。我们可以使用任何控件，如内置文本的\
  \ `QSpinBox`，或者自定义编辑器，例如我们在上一章中创建的 `RichTextLineEdit`。在所有情况下，步骤都是相同的：使用给定的父对象创建编辑器，然后对其设置并返回。\n\
  \n我们让下拉框（combobox）可编辑，并将 `returnPressed()` 信号连接到 `commitAndCloseEditor`。\n\n```python\n\
  def commitAndCloseEditor(self):\n    editor = sender()\n    if isinstance(editor,\
  \ (QTextEdit, QLineEdit)):\n        emit(SIGNAL(\"data(QWidget*)\"), editor)\n \
  \   emit(SIGNAL(\"closeEditor(QWidget*)\"), editor)\n```\n\n对于 `TEU` 列，我们创建并返回一个数字调节框。我们可以使用任何控件，如内置文本的\
  \ `QSpinBox`，或者自定义编辑器，例如我们在上一章中创建的 `RichTextLineEdit`。在所有情况下，步骤都是相同的：使用给定的父对象创建编辑器，然后对其设置并返回。\n\
  \n我们让下拉框（combobox）可编辑，并将 `returnPressed()` 信号连接到 `commitAndCloseEditor`。\n\n```python\n\
  def commitAndCloseEditor(self):\n    editor = sender()\n    if isinstance(editor,\
  \ (QTextEdit, QLineEdit)):\n        emit(SIGNAL(\"data(QWidget*)\"), editor)\n \
  \   emit(SIGNAL(\"closeEditor(QWidget*)\"), editor)\n```\n\n一旦编辑器被创建并交给视图，视图就会调用\
  \ `setData()`。这让代理有机会根据数据填充编辑器，供用户编辑。\n\n### 自定义代理\n\n对于 `TEUs` 显示为包含空格、逗号或句号的文本，对于这些我们剔除不需要的字符，将值转换为整数并设置数字调节框的值。另一种方法是为该列设置独立的\
  \ `DisplayRole` 和 `EditRole` 值。\n\n如果编辑器是下拉框，我们将其当前索引设置为匹配的项。如果没有匹配项，则让第一项成为当前项。\n\
  \n```python\ndef setEditorData(self, editor, index):\n    text = index.model().data(index,\
  \ Qt.DisplayRole).toString()\n    if index.column() == TEU:\n        value = text.replace(QExpExp(\"\
  [., ]\"),toInt()[0]\n        editor.setValue(value)\n    elif index.column() in\
  \ (OWNER, COUNTRY):\n        i = editor.findText(text)\n        if i == -1:\n  \
  \          i = 0\n        editor.setCurrentIndex(i)\n    elif index.column() ==\
  \ NAME:\n        editor.setText(text)\n    elif index.column() == DESCRIPTION:\n\
  \        editor.setHtml(text)\n    else:\n        QItemDelegate.setEditorData(self,\
  \ editor, index)\n```\n\n通常，我们将未处理的情况交给基类，尽管在这里只是形式上的，因为我们自己处理了所有列。\n\n```python\n\
  def setModelData(self, editor, model, index):\n    if index.column() == TEU:\n \
  \       model.setData(index, QVariant(editor.value()))\n    elif index.column()\
  \ in (OWNER, COUNTRY):\n        model.setData(index, QVariant(editor.currentText()))\n\
  \    elif index.column() == NAME:\n        model.setData(index, QVariant(editor.text()))\n\
  \    elif index.column() == DESCRIPTION:\n        model.setData(index, QVariant(editor.toSimpleHtml()))\n\
  \    else:\n        QItemDelegate.setModelData(self, editor, model, index)\n```\n\
  \n\n\n\n如果用户确认了编辑，必须将编辑器器的数据写回模型。模型将通知视图项目已发生更改，那些显示该项的视图将请求刷新数据以显示。\n\n## 第 14\
  \ 章. 模型/视图编程\n\n在每种情况下，我们只需从适当的编辑器中检索值并调用 `setData()`，将值作为 `QVariants` 传递。\n\n我们现在已经完成了代理（delegate）。在下一章中将使用两个代理，它们都为某些字段提供了编辑器，并且都只实现了\
  \ `createEditor()`、`setEditorData()` 和 `setModelData()`。在本章和下一章中，自定义代理是针对特定模型的。但在第\
  \ 16 章中，我们有一个专门介绍“通用代理”（generic delegates）章节章节它们可以用于为任何模型创建代理，而无需拥有特定于模型的自定义代理——这可以减少代码重复并使维护变得更容易。\n\
  \n## 总结\n\nPyQt 的便利项视图控件（如 `QListWidget`、`QTableWidget` 和 `QTreeWidget`）对于查看和编辑小规模的临时数据集非常有用。\n\
  \n它们可以像我们在第一节中那样与外部数据集结合使用，也可以作为数据容器本身使用。添加、编辑和删除项目是简单的，但如果我们使用多个视图来显示同一个数据集，我们必须承担起保持视图和数据集同步的责任。如果我们使用带有自定义模型的模型/视图方法，这个问题就会消失。\n\
  \n便利视图不提供对其所处理的项进行编辑的任何控制。对于便利视图和纯视图（pure views），都可以通过设置我们自己的自定义项代理来纠正这一缺陷。\n\n\
  纯视图提供了与便利视图类似的功能，但没有提供排序或对数据项外观的直接控制。这些视图必须配合模型使用，无论是 PyQt 提供的预定义模型，还是更常见的我们自己的自定义模型。\n\
  \n要实现自定义表格模型，我们必须为只读模型和可编辑模型重新实现 `rowCount()`、`columnCount()` 和 `data()`；通常也会重新实现\
  \ `headerData()`。此外，我们必须实现 `flags()` 和 `setData()` 以使项可编辑，并实现 `insertRows()` 和 `removeRows()`\
  \ 以允许用户插入或删除数据行。如果我们希望用户能够对数据排序，可以添加额外的排序方法，尽管在数据库表的情况下，我们可以简单地添加 `ORDER BY` 子句。使用模型/视图架构使用数据库将在下一章中介绍。\n\
  \n创建自定义代理允许我们对数据项的外观和编辑进行完全控制。可以在模型和代理之间共享数据外观的责任，或者将所有责任交给其中任何一个。但只有自定义代理可以用于提供对编辑的控制。对于只读代理以及我们只关心数据外观的代理，我们通常只需要重新实现\
  \ `paint()` 方法，尽管在某些情况下我们还必须重新实现 `sizeHint()`（或在模型的 `data()` 重新实现中处理 `Qt.SizeHintRole`）。对于大多数代理，我们完全不需要重新实现\
  \ `paint()` 或 `sizeHint()`，只需要重新实现 `createEditor()`、`setEditorData()` 和 `setModelData()`。\n\
  \n在下一章中，我们将看到模型/视图架构的更多示例，包括纯视图、自定义代理和内置的 SQL 数据库模型。\n\n## 练习\n\n为 `ShipTableModel`\
