  \n### 子类 QWidget\n\n### 示例：流量混合小部件\n\n有时为特定的应用程序创建自定义小部件是合适的。在这个示例中，我们假设有一个应用程序，其中我们模拟流体通过“Y”型管道的流动，如图\
  \ 11.6 所示。\n\n**图 11.6** YPipe 小部件\n\n该小部件必须绘制三个渐变填充的多边形和三个黑色轮廓（以给管道形状提供清晰的边界），并且允许用户设置左右流量，同时显示合并后的流量。我们选择提供计数器（spinboxes）让用户设置流量，并使用标签（label）显示结果流量。使用这些内置小部件的优势在于我们只需要关注它们的位置，可以交给布局管理器处理剩下的。\n\
  \n```python\nclass YPipeWidget(QWidget):\n    def __init__(self, leftFlow=0, rightFlow=0,\
  \ maxFlow=100, parent=None):\n        super(YPipeWidget, self).__init__(parent)\n\
  \        self.leftSpinBox = QSpinBox(self)\n        self.leftSpinBox.setRange(0,\
  \ maxFlow)\n        self.leftSpinBox.setValue(leftFlow)\n        self.leftSpinBox.setSuffix(\"\
  \ l/s\")\n        self.leftSpinBox.setAlignment(Qt.AlignRight|Qt.VCenter)\n    \
  \    self.connect(self.leftSpinBox, SIGNAL(\"valueChanged(int)\"), self.valueChanged)\n\
  \n        self.label = QLabel(self)\n        self.label.setFrameStyle(QFrame.StyledPanel|QFrame.Sunken)\n\
  \        self.label.setAlignment(Qt.AlignCenter)\n        fm = QFontMetrics(self.font())\n\
  \        self.label.setMinimumWidth(fm.width(\" 999 l/s \"))\n\n        self.setSizePolicy(QSizePolicy(QSizePolicy.Expanding,\
  \ QSizePolicy.Expanding))\n        self.setMinimumSize(self.minimumSizeHint())\n\
  \        self.valueChanged()\n\n    def valueChanged(self):\n        a = self.leftSpinBox.value()\n\
  \        b = self.rightSpinBox.value()\n        self.label.setText(\"%d l/s\" %\
  \ (a + b))\n        self.emit(SIGNAL(\"valueChanged\"), a, b)\n        self.update()\n\
  \n    def values(self):\n        return self.leftSpinBox.value(), self.rightSpinBox.value()\n\
  ```\n\n\n\n该方法以二元组的形式提供流数值旋框的值。\n\n```python\ndef minimumSizeHint(self):\n    return\
  \ QSize(self.leftSpinBox.width() * 3,\n                 self.leftSpinBox.height()\
  \ * 5)\n```\n\n*子类 QWidget*\n\n341\n\n我们将小部件的最小宽度和高度与数值旋框成正比例。这确保了“Y”型形状不会小到无法辨认。\n\
  \n```python\ndef resizeEvent(self, event=None):\n    fm = QFontMetricsF(self.font())\n\
  \    x = (self.width() - self.label.width()) / 2\n    y = self.height() - (fm.height()\
  \ * 1.5)\n    self.label.move(x, y)\n    y = self.height() / 60.0\n    x = (self.width()\
  \ / 4.0) - self.leftSpinBox.width()\n    self.leftSpinBox.move(x, y)\n    x = self.width()\
  \ - (self.width() / 4.0)\n    self.rightSpinBox.move(x, y)\n```\n\n调整大小事件对于包含其他小部件且没有布局（layout）的小部件尤为重要。这是因为我们使用该事件来定位子小部件。在小部件首次显示之前总是会调用调整大小事件，因此我们有机会在用户第一次看到小部件之前自动对子小部件进行定位。\n\
  \n标签水平居中，并绘制在小部件的底部附近（`y` 坐标向下增加，因此 `self.height()` 返回的是最大——即最底部的——`y` 值）。两个数值旋框绘制在顶部，距离最小——即最顶部——`y`\
  \ 值高度的 1/60 处，距离左或右边缘宽度的 1/4 处。\n\n由于我们使用了 `QSpinBoxes` 和 `QLabel`，并配合了一些信号与槽连接，所有的用户交互都已处理完毕，因此我们只需要考虑调整大小和绘图。虽然让\
  \ PyQt 绘制数值旋框和标签简化了绘图，但它仍然有点复杂，因此我们将分段查看绘图事件。\n\n```python\ndef paintEvent(self,\
  \ event=None):\n    LogicalSize = 100.0\n    def logicalFromPhysical(length, side):\n\
  \        return (length / side) * LogicalSize\n\n    fm = QFontMetricsF(self.font())\n\
  \    ymargin = (LogicalSize / 30.0) + \\\n             logicalFromPhysical(self.leftSpinBox.height(),\n\
  \             self.height())\n    ymax = LogicalSize - \\\n           logicalFromPhysical(fm.height()\
  \ * 2, self.height())\n    width = LogicalSize / 4.0\n    cx, cy = LogicalSize /\
  \ 2.0, LogicalSize / 3.0\n\n    ax, ay = cx - (2 * width), ymargin\n    bx, by =\
  \ cx - width, ay\n    dx, dy = cx + width, ay\n    ex, ey = cx + (2 * width), ymargin\n\
  \    fx, fy = cx + (width / 2), cx + (LogicalSize / 24.0)\n    gx, gy = fx, ymax\n\
  \    hx, hy = cx - (width / 2), ymax\n    ix, iy = hx, fy\n```\n\n我们并没有在设备（物理）坐标中工作并被迫手动缩放所有坐标，而是创建了一个逻辑坐标系，其左上角为\
  \ (0, 0)，宽度和高度为 100（`LogicalSize`）。我们定义了一个微小的辅助函数，用于计算数值旋框绘制位置上方的 `y` 边距，以及标签绘制下方的最大\
  \ `y` 值。\n\n*a*\n*b*\n*d*\n*e*\n*c*\n*i*\n*f*\n*h*\n*g*\n\n**图 11.7** *YPipe 的坐标点*\n\
  \n如图 11.7 所示，所有的绘制都是基于绘制“Y”型形状所需的点。对于图中的每个点，我们都计算一个 `x` 坐标和一个 `y` 坐标。例如，左上点是 *a*，因此它在代码中的坐标是\
  \ `ax` 和 `ay`。大部分计算都是相对于点 *c*（`cx`, `cy`）完成的。\n\n```python\npainter = QPainter(self)\n\
  painter.setRenderHint(QPainter.Antialiasing)\nside = min(self.width(), self.height())\n\
