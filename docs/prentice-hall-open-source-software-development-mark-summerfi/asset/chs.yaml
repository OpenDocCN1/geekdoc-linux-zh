  \ 100 行代码，但它非常微妙且具有挑战性。\n\n\n\n我们已经到达本书的末尾，但绝不意味着 Python 或 PyQt 所提供的功能已经结束。Python\
  \ 的标准库非常庞大，由于我们专注于 PyQt，我们几乎没有使用过其中可用功能的一小部分。许多其他库也可以作为 Python 和 PyQt 的插件可用，因此在许多情况下，我们可以通过组合现有组件进行编程，而无需从自己从头开始构建一切。\n\
  \n寻找插件的一个良好起点是 Python 包索引（Python Package Index）：[`pypi.python.org/pypi`](http://pypi.python.org/pypi)；而寻找技巧、提示和主意的好地方则是位于\
  \ [`aspn.activestate.com/ASPN/Python/Cookbook.`](http://aspn.activestate.com/ASPN/Python/Cookbook.)\
  \ 的《Python 食 Cookbook》。\n\n我们对 PyQt 的介绍非常详尽，所有的主要功能都已展示并描述。但由于 PyQt 拥有数百个类，因此我们无法涵盖甚至无法提及所有的类。例如，PyQt\
  \ 包含的小部件比我们使用的要多，包括 `QCalendarWidget`、`QGroupBox`、`QProgressBar` 和 `QToolBox`。还有许多实用的非部件类，例如\
  \ `QCompleter`（文本补全）、`QFileSystemWatcher`（用于观察文件系统中文件或目录的变化）以及 `QSystemTrayIcon`（在系统托中放置带有弹出菜单的图标）。它还支持辅助功能和撤销/重做框架。\n\
  \n此外，PyQt 具有一些针对特定平台的特性，包括 Windows 上的 ActiveX 支持、X Window 系统上的会话管理，以及 Mac OS X 上的页和抽屉。所有这些在详尽的在线文档中都有描述。PyQt\
  \ 还提供了自己的示例——那些涵盖了你感兴趣的领域的示例非常值得一读。\n\n本书为使用 Python 和 PyQt 进行 GUI 编程奠定了坚实的基础。书中所展示的原理和实践应该让你能够轻松地从\
  \ PyQt 提供的文档和示例学习新的 PyQt 类，并能够成功地创建你自己的类。使用 PyQt 编程既高效又愉快，这让我们能够忽略无关的紧要细节。这意味着我们可以专注于构建既美观又运行良好的绝佳应用程序。\n\
