  \ HTML，并告诉文档在打印机上打印自身。\n\n使用 `QTextDocument` 创建 HTML 字符串并打印它可能是 PyQt 中产生打印输出最快、最简单的方法。唯一的缺点是进行精细控制可能很困难，尽管我们可以使用样式属性并设置样式表。\n\
