  \ QWidget\n\n使用窗口的主要好处是它允许我们使用逻辑坐标进行绘制。这非常方便，因为意味着所有需要的缩放（例如当用户调整控件大小时）都由 `PyQt`\
  \ 自动处理。这种好处也被证明有一个缺点：如果我们想绘制文本，文本将与其他所有内容一起被缩放。因此，对于绘制文本的自定义控件，通常在物理（视口）坐标下工作最为简单，而在其他情况下在逻辑（窗口）坐标下工作。我们展示了两种方法，`FractionSlider`\
  \ 使用视口坐标，而 `YPipeWidget` 使用窗口坐标。\n\n### 示例：分数滑动块\n\n`FractionSlider` 是一个允许用户选择 0\
