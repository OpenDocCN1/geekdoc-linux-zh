  一旦我们完成表格的填充并想在其之后添加项，我们必须将文本光标的位置重置为紧邻表格之后。如果不这样做，光标将直接插入到表格内部，导致第一页的剩余部分在表格内，而第二页在第一页内，以此此类推！为了避免这个问题，我们将文本光标设置在文档的最后一个位置，即我们插入的最后一项之后的位置，也就是紧邻表格之后的位置。\n\
  \n### 407 *打印文档*\n\n完成页面只需是插入带有适当格式的额外块，然后插入相关的文本。对于除最后一页以外的所有 `Qt` 页面，我们将上一个块的格式设置为\
  \ `lastParaBodyFormat`，这在 `4.2`（使用 Qt 4.2）中将确保后续内容将出现在新的一页上。\n\n```python\ndocument.print_(self.printer)\n\
  ```\n\n最后一条语句是在打印机上打印文档。此时文档已经完成，所以如果我们倾向于 HTML 格式，可以对其调用 `toHtml()` 来获取 HTML 格式。这也意味着如果我们想的话，可以结合\
  \ `QTextCursor` 和 `QTextDocument` 来程序化地创建 HTML 页面。\n\n使用 `QTextDocument` 的优势（无论是给它一个\
  \ HTML 字符串还是使用 `QTextCursor` 填充它）在于，我们可以避免大量的计算来确定文本应该放置在页面的什么位置。缺点是 `PyQt` 无论我们喜不喜欢都会在文档上加上页码，而且它没有给我们提供精细的位置控制。如果我们使用\
  \ `QPainter`，这两个问题都不会发生。\n\n### 使用 QPainter 打印\n\n我们将通过查看如何使用 `QPainter` 进行打印来结束本节。采用这种方法意味着我们要承担所有位置计算的繁琐工作，但好处是可以在页面的任何地方绘图，而不限于控件、图像或打印页面所能表示的内容。\n\
  \n```python\ndef printViaPainter(self):\n    logo = QPixmap(\":/logo.png\")\n  \
  \  painter = QPainter(self.printer)\n    pageRect = self.printer.pageRect()\n  \
  \  page = 1\n```\n\n\n\n在打印地址后，我们按照常例根据账户状态打印带有文本的正文信。\n\n```\npainter.setPen(Qt.black)\n\
