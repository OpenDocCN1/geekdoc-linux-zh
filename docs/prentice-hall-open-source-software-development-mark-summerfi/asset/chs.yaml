  \ 中有一个测试程序。\n\n# 8. 数据处理与自定义文件格式\n\n## 主窗口职责\n- 数据容器职责\n- 保存和加载二进制文件\n- 保存和加载文本文件\n\
  - 保存和加载 XML 文件\n\n## 格式\n\n大多数应用程序都需要加载和保存数据。通常，数据格式是预定义的，因为应用程序正在读取由其他应用程序产生的数据，我们对那些程序没有控制权。但对于我们创建自定义文件格式的应用程序，有很多选项。\n\
  \n在第 6 章中，我们创建了一个主窗口风格的应用程序，从中学习了如何创建菜单和工具栏，以及如何处理文件的加载和保存。在本章中，我们将处理另一个主窗口风格的应用程序，但这次我们的重点将放在应用程序的数据上。\n\
  \n**图 8.1** *My Movies 应用程序*\n\n我们将作为示例的应用程序称为 `My Movies`；如图 8.1 所示。它用于存储我们收藏中可能有的电影的一些基本信息。该应用程序将允许我们查看和编辑自定义\
  \ `Movie` 对象（或我们称之的电影*记录*）的集合，并以各种格式从磁盘加载和保存这些记录。\n\n如果你只想直接深入研究文件处理，可以跳到相关章节。保存和加载二进制文件的介绍从第\
  \ 240 页开始，文本文件从第 249 页开始，XML 文件从第 256 页开始。你可以随时回到前两个章节来涵盖 GUI 与文件处理之间的关系。\n\n在之前所有的的示例中，我们通常尽可能将数据保留在\
  \ Python 数据类型中，仅在需要时才与 PyQt 类型之间进行转换。\n\n### 字符串\n\n特别是对于字符串，我们提出了一项策略，即尽早将 `QString`\
  \ 转换为 unicode，并始终对 unicode 字符串进行操作。但在本章中，我们将采取相反的方法，将所有数据保留在 PyQt 类型中，仅在需要时才转换为\
  \ Python 类型。这样做的原因之一是 PyQt 为二进制数据提供了极佳的支持，并使用了与 C++/Qt 相同的二进制格式，这在处理必须被 C++ 和 Python\
  \ 程序共同访问的文件时非常有用。另一个原因是，这将提供一种对比，帮助我们理解每种方法的优缺点，以便我们在稍后编写的应用程序中做出正确的决策。\n\n在 PyQt\
  \ 类型中持有数据的一个直接益处是，我们不需要对给用于查看和编辑的部件提供或从中获取的数据进行不断转换。在处理大数据时，这可以显著减少处理开销。\n\n当我们有自定义数据需要加载和保存时，有五个选项可供选择。\n\
  \n我们可以使用二进制文件、纯文本文件或 XML 文件，或者使用带有显式文件名的 `QSettings` 对象，或者使用数据库。在本章中，我们将涵盖前三种，并在此要提到第四种\
  \ `QSettings`。我们将数据库的介绍推迟到第 15 章。\n\n除 `QSettings` 之外的所有选项都可以使用 Python 的标准库或 PyQt\
  \ 实现。在本章中，我们将使用这两个库来加载和保存二进制和文本格式，以便我们进行比较。对于 XML，我们将使用 PyQt 进行加载和解析，而由自己完成保存。Python\
  \ 的标准库也提供了大量的 XML 支持，但涵盖它并不能显示任何 PyQt 无法实现的功能。\n\n在第 6 章中，我们看到了如何使用 `QSettings`\
  \ 对象保存和加载用户设置，例如主窗口的大小和位置以及最近使用的文件列表。该类将所有数据存储为 `QVariants`，但对于少量数据来说这是完全可以接受的。我们可以通过创建一个带有文件名的\
  \ `QSettings` 实例来存储自定义数据——例如，`iniFile = QSettings(\"curvedata.ini\", QSettings.IniFormat)`。现在我们可以使用\
  \ `iniFile` 对象通过 `setValue()` 写入数据，并使用 `value()` 读取数据，在这两种情况下 `QVariant` 和相关类型之间进行转换。\n\
  \n在接下来的节中，我们将查看主窗口子类执行的高级文件处理和数据展示。\n\n在第二节中，我们将查看应用程序的数据模块，包括单个数据项的实现，以及存放应用程序数据的数据项容器。\n\
  \n\n\n\n\n在随后的章节中，我们将介绍如何以各种格式保存和加载数据。在二进制文件章节，我们将介绍如何使用 `PyQt` 的 `QDataStream`\
  \ 类以及 Python 标准库的 `cPickle` 模块来加载和保存电影记录集合。在文本文件章节，我们将看到如何使用 `PyQt` 的 `QTextStream`\
  \ 和 Python 标准库的 `codecs` 模块以纯文本格式加载和保存电影记录。在最后一个章节中，我们将编写代码将记录保存为 XML，并查看如何同时使用\
  \ `DOM` 和 `SAX` 解析器来读取 XML 数据。\n\n## 主窗口的职责\n\n主窗口通常负责为用户提供层级文件处理操作，并展示应用程序的数据。在本节中，我们将特别关注文件操作，因为它们与我们在第\
  \ 6 节 Image Changer 应用程序中所做的不同，并且更能代表大型应用程序中的情况。我们还将查看数据是如何呈现给用户的。在“我的电影”（My Movies）应用程序中，数据存储在一个“容器”（一个\
  \ `MovieContainer`）中，所有的保存、加载（以及导出和导入）工作都由主窗口传递给容器。我们将在下一节查看容器，并在随后的章节中查看容器的保存和加载代码。\n\
  \n源代码位于 `chap08` 目录，包含一个使用 `Qt Designer` 设计的用于添加和编辑电影记录的用户界面。图 8.2 显示了应用程序的 Python\
  \ 模块。\n\n我们选择区分“保存”与“导出”，以及“加载”与“导入”。当我们加载一个文件时，使用的文件名将成为应用程序保存时的当前文件名。如果我们保存文件，将使用应用程序的当前文件名，因此后续保存将针对同一个文件。我们可以通过“另存为”操作来更改当前文件名。\n\
  \n当我们导入文件时，我们会清除当前文件名；这意味着如果用户想保存数据，必须赋予它一个新的文件名。如果用户导出数据，系统会要求一个新的文件名，且不会影响当前文件名。\n\
  \n现在我们准备好查看主窗口的文件处理功能了。\n\n我们将从查看主窗口初始化函数的开始部分开始：\n\n### 图 8.2 结构\n- `mymovies.pyw`\n\
  - `MainWindow`\n- `main()`\n- `addeditmoviedlg.py`\n- `moviedata.py`\n- `AddEditMovieDlg`\n\
  - `Movie`\n- `MovieContainer`\n- `intFromQStr()`\n- `ui_addeditmoviedlg.py`\n- `qrc_resources.py`\n\
  - `encodedNewlines()` (用户界面模块)\n- `decodedNewlines()` (图标)\n\nMy Movie 应用程序的模块、类和函数创建了存储数据的电影容器以及展示数据的\
  \ `QTableWidget`。\n\n```python\nclass MainWindow(QMainWindow):\n    def __init__(self,\
  \ parent=None):\n        super(MainWindow, self).__init__(parent)\n        self.movies\
  \ = moviedata.MovieContainer()\n        self.table = QTableWidget()\n        self.setCentralWidget(self.table)\n\
  ```\n\n在调用 `super()` 后，我们创建了一个新的空容器。（稍后我们将查看 `Movie` 和 `MovieContainer` 类。）然后我们创建了一个\
  \ `QTableWidget`。\n\n该小组件用于展示并可选地编辑表格数据。表格在 `updateTable()` 中进行设置和填充。我们省略了初始化函数的其余部分，因为我们已经从第\
  \ 6 节知道如何设置状态栏、创建文件、编辑和帮助操作、填充菜单和工具栏，以及从上一次会话的设置中恢复应用程序状态。\n\n为了完整起见，我们现在将简要回顾 `updateTable()`，查看表格小组件是如何设置和填充的。（如果你倾向于纯关注文件处理，可以跳转到第\
  \ 232 页的 `fileNew()` 方法。）我们使用的方法非常简单直接。`PyQt` 还提供了一种更高级的方法来填充和编辑基于项目的组件（如列表、表格和树），使用\
  \ `PyQt` 的模型/视图架构——我们将在第 14 节学习这些。\n\n```python\ndef updateTable(self, current=None):\n\
  \    self.table.clear()\n    self.table.setRowCount(len(self.movies))\n    self.table.setColumnCount(5)\n\
  \    self.table.setHorizontalHeaderLabels([\"标题\", \"年份\", \"分钟\", \"获取\", \"备注\"\
