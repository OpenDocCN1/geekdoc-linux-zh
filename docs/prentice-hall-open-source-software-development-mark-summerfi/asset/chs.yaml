  \n# Implementing the Custom Model\n\nWe have now seen some of the `QAbstractTableModel`’s\
  \ API in use, along with some extensions of our own. The methods in a model subclass\
  \ can be divided into three categories:\n\n- Methods that are necessary for implementing\
  \ read-only models\n- Methods that are necessary for implementing editable models\n\
  - Methods that we need to extend the API for particular circumstances\n\nThe essential\
  \ methods for read-only table models are `data()`, `rowCount()`, and `columnCount()`,\
  \ although `headerData()` is almost always implemented too.\n\nEditable models require\
  \ reimplementations of the same methods as those needed for read-only models, and\
  \ in addition `flags()` and `setData()`. If the model is to support adding and removing\
  \ rows as well as editing existing data, `insertRows()` and `removeRows()` must\
  \ also be implemented.\n\nOther methods can be implemented as well, but those listed\
  \ in the two preceding paragraphs are the only essential ones.\n\nFor the ship model\
  \ we store the ships in a list in memory and in a binary file on disk. To support\
  \ this functionality we have extended the model API by adding `sortByName()`, `sortByCountryOwner()`,\
  \ `load()`, and `save()`.\n\nThe `ShipTableModel` is in `chap14/ships.py`.\n\n```python\n\
  class ShipTableModel(QAbstractTableModel):\n    def __init__(self, filename=QString()):\n\
  \        super(ShipTableModel, self).__init__()\n        self.filename = filename\n\
  \        self.dirty = False\n        self.ships = []\n        self.owners = set()\n\
  \        self.countries = set()\n```\n\nWe want to load and save the model’s data\
  \ from and to a binary file, so we keep an instance variable with the `filename`.\
  \ The ships themselves are stored in a list which is initially unordered. We also\
  \ keep two sets, one of owners and the other of countries: These will be used to\
  \ populate comboboxes when we create a custom delegate in the next section.\n\n\
  ```python\ndef rowCount(self, index=QModelIndex()):\n    return len(self.ships)\n\
  \ndef columnCount(self, index=QModelIndex()):\n    return 5\n```\n\nThe row and\
  \ column counts are easy to provide. It is very common for table models to have\
  \ a fixed column count.\n\n```python\ndef data(self, index, role=Qt.DisplayRole):\n\
  \    if not index.isValid() or \\\n        not (0 <= index.row() < len(self.ships)):\n\
  \        return QVariant()\n    ship = self.ships[index.row()]\n    column = index.column()\n\
  \    if role == Qt.DisplayRole:\n        if column == NAME:\n            return\
  \ QVariant(ship.name)\n        elif column == OWNER:\n            return QVariant(ship.owner)\n\
  \        elif column == COUNTRY:\n            return QVariant(ship.country)\n  \
  \      elif column == DESCRIPTION:\n            return QVariant(ship.description)\n\
  \        elif column == TEU:\n            return QVariant(QString(\"%L1\").arg(ship.teu))\n\
  ```\n\nThe `data()` method has one mandatory argument—the model index of the item\
  \ concerned—and one optional argument—the “role”. The role is used to indicate what\
  \ kind of information is required. The default role, `Qt.DisplayRole`, means that\
  \ the data as displayed is wanted.\n\n# Creating Custom Models\n\nIf the model index\
  \ is invalid or if the row is out of range we return an invalid `QVariant`. PyQt’s\
  \ model/view architecture does not raise exceptions or give error messages; it simply\
  \ uses invalid `QVariants`. If the index is valid we retrieve the ship at the row\
  \ corresponding to the index’s row. If the role is `Qt.DisplayRole` we return the\
