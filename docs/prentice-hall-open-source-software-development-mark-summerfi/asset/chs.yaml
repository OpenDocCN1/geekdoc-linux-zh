  \ `loadFile()`，而无必检查文件是否已在现有的编辑器中。\n\n```python\ndef fileSave(self):\n    textEdit\
  \ = self.mdi.activeWindow()\n    if textEdit is None or not isinstance(textEdit,\
  \ QTextEdit):\n        return\n    try:\n        textEdit.save()\n    except (IOError,\
