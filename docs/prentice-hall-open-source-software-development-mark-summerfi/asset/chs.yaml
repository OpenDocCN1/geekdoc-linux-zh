  \n# 第一部分\n## Python 编程\n\n*本页特意留空*\n\n![Image3](img/index-24_1.jpg)\n\n# 1\n\n●\
  \ 执行 Python 代码\n● 变量与对象\n● 数字与字符串\n● 集合\n● 内置函数\n\n# 数据类型与数据结构\n\n在本章中，我们将开始一个 Python\
  \ 转换课程，向非 Python 程序员展示如何使用 Python 进行编程。我们介绍了一些基础数据类型和数据结构，以及 Python 的一些过程语法。\n\n\
  贯穿始终的方法是强调实践中真实的代码，而不是提供 Python 附带文档以及在 [`www.python.org.`](http://www.python.org)\
  \ 在线提供的正式定义和解释。\n\n**图 1.1** *IDLE Python Shell 窗口*\n\n如果你还没有安装 Python 和 PyQt，最好安装它们：这样你就可以尝试本书随附的示例（可从\
  \ http://www.qtrac.eu/pyqtbook.html 下载）。安装细节请参阅 http://www.qtrac.eu/pyqtbook.html\
  \ 和附录 A。安装软件的一个优势是，会随 Python 一起安装 IDLE 开发环境。\n\n# 第 1 章。数据类型与结构\n\n## 引言\n\n###\
  \ IDLE 开发环境\n\nPython 的完整安装包含了 IDLE，这是一个基础但非常有实用的开发环境。当启动 IDLE 时（在 Windows 上点击开始→所有程序→Python\
  \ 2.x→IDLE，在 Mac X 上点击 访达→应用程序→MacPython 2.x→IDLE，或在 Linux 的控制台中运行 `idle`），它会显示\
  \ Python Shell（交互式外壳）。\n\n如图 1.1 所示截图所示，IDLE 具有相当复古的 Windows 95 风格。这是因为它是用 Tkinter\
  \ 而不是 PyQt 编写的。我们选择使用 IDLE 是因为它是 Python 标准配置，而且学习和使用非常简单。如果你想使用更强大、外观更现代的 IDE，你可能更倾向于用\
  \ PyQt 编写的 Eric 或其他可用的 Python IDE。然而，如果你是 Python 初手，我们建议你从简单的 IDLE 开始，一旦你对 PyQt\
  \ 更加熟悉，再尝试其他 IDE 看看你是否喜欢其中之一。当然，你也可以简单地使用纯文本编辑器并使用 print 语句进行调试，完全不使用 IDE。\n\nIDLE\
  \ 提供了三个关键功能：输入 Python 表达式和代码并直接在 Python Shell 中查看结果；提供 Python 特色语法高亮的代码编辑器；以及一个用于逐步执行代码以帮助识别和消除\
  \ bug 的调试器。Python Shell 特别适用于尝试简单的算法、代码片段和正则表达式，也可以作为一个非常强大且灵活的计算器。\n\n 执行 Python\
  \ 代码\n\n在真正探索 Python 语言之前，我们需要知道如何执行 Python 代码。我们将通过回顾一个只有一行的微型示例程序来展示这一点。\n\n处理\
  \ Python 文件时必须使用纯文本编辑器。在 Windows 上可以使用记事本，但 IDLE 包含了一个专为编辑 Python 代码设计的 Python 编辑器：只需启动\
  \ IDLE 然后点击文件→新建窗口。\n\n我们将名为 `hello.py` 的文件中输入以下行内容：\n\n```python\nprint \"Hello\
  \ World\"\n```\n\n\n\n\n请注意，不需要分号：在 Python 中，换行符充当语句分隔符。此外，我们不需要在字符串中包含 `\\n`，因为\
  \ `print` 会自动添加换行符，除非我们在末尾加逗号来抑制它。\n\n★ 本书程序使用 ASCII 字符编写，在需要 Unicode 的地方使用转义序列。正如文档中“编码声明”部分解释的那样，Python\
  \ 程序中的字符串和注释可以使用 Latin-1、UTF-8 或其他编码。\n\n## 执行 Python 代码\n\n假设我们已将代码保存在 `hello.py`\
  \ 文件中（如果使用 Windows，则在 `C:\\pyqt\\chap01` 目录下），我们可以启动控制台（在 Windows XP 上点击“开始”→所有程序→辅助工具→控制台——有时控制台被称为“命令提示符”；或者在\
  \ Mac OS X 上从 `/Applications/Utilities` 运行 `Terminal.app`），切换到该目录并按如下方式执行程序：\n\n\
  ```\nC:\\>cd c:\\pyqt\\chap01\nC:\\pyqt\\chap01>hello.py\n```\n\n只要 Python 安装正确，Windows\
  \ 就会识别 `.py` 文件扩展名并将文件交给 `python.exe` 执行。正如我们预期的那样，程序将在控制台上打印“Hello World”。★\n\n\
  在 Mac OS X 和 Linux 上，我们必须通过在控制台提示符输入解释器的名称和文件名来显式运行，如下：\n\n```\n% python hello.py\n\
  ```\n\n只要 Python 已安装并位于你的 `PATH` 中，这种方法就能生效。或者，对于 Linux 和 Mac OS X，我们可以添加一行额外的“shebang”（shell\
  \ 执行）注释行，它会告诉操作系统使用 Python 解释器，使得 `hello.py` 文件变为两行：\n\n```python\n#!/usr/bin/env\
  \ python\nprint \"Hello World\"\n```\n\n要让这在 Mac OS X 和 Linux 上正常工作，必须正确设置文件权限。例如，在文件所在目录的控制台提示符中，输入\
  \ `chmod +x hello.py` 使文件变为可执行。\n\nPython 注释以 `#` 开头并持续到行尾。这意味着在*所有* Python 程序中添加“shebang”行是完全安全的，因为该注释在\
  \ Windows 上会被忽略，但在 Linux 上，它告诉操作系统使用 Python 解释器执行该文件。附录 A 显示如何在 Mac OS X 上将 Python\
  \ 解释器与 `.py` 和 `.pyw` 文件关联。\n\n当我们执行一个 Python 程序时，后台发生的是 Python 将 `.py`（或 `.pyw`）文件读取到内存并进行解析，得到一个字节码程序然后进行执行。对于程序导入的每个模块，Python\
  \ 首先检查是否存在预编译的字节码版本（`.pyo` 或 `.pyc` 文件中），其时间戳与 `.py` 文件对应。如果有，Python 使用该字节码版本；否则，它解析模块的\
  \ `.py` 文件，将其保存为 `.pyc` 文件并使用刚刚生成的字节码。因此，与 Java 不同，我们不需要显式对任何模块进行字节码编译，无论它们是 Python\
  \ 提供的还是我们自己。在大多数 Python 安装中，提供的模块在安装过程中就已经编译好了，以避免每次运行使用它们的 Python 程序时都必须重新编译。\n\
  \n★ Mac OS X 用户注意，每当我们提到控制台时，它等同于 Mac Terminal。\n\n*第 1 章 数据类型与数据结构*\n\n## 变量与对象\n\
  \n在大多数编程语言（包括 C++ 和 Java）中，我们必须在使用每个变量之前声明它并指定其类型。这被称为*静态**类型*，因为编译器在编译时就知道了每个变量的类型。\n\
  \nPython 与大多数极高层语言一样，使用了不同的方法：变量没有类型限制（动态类型），且不需要声明。\n\n我们可以通过像上一节中处理 `hello.py`\
  \ 那样创建并执行文件来学习 Python 的变量和标识符。但尝试短小的代码段时，我们完全不需要创建文件。可以直接在 IDLE Python Shell 窗口的\
  \ `>>>` 提示符处直接输入行：\n\n```python\n>>> x = 71\n>>> y = \"Dove\"\n```\n\n赋值运算符 `=`\
  \ 周围的空格是可选的，但包含它们是为了让代码更易读。从风格上考虑，我们总会在二元运算符前后各放一个空格。另一方面，每个语句独占一行且没有多余的开头空格，这一点非常重要的。这是因为\
  \ Python 使用缩进和换行来表示其块结构，而不是使用许多其他编程语言所用的大括号和分号。\n\n现在我们准备好回顾这两行代码实际的作用了。第一行创建一个\
  \ `int` 类型的对象并将名称 `x` 绑定到它上。★ 第二行创建一个 `str` 类型的对象（8 位字符串类型）并将名称 `y` 绑定到它上。\n\n一些\
  \ Python 程序员将名称（如之前使用的 `x` 和 `y`）称为*对象引用*，因为它们指的是对象，而不是它们本身就是对象。对于 `int` 和 `str`\
  \ 等基本数据类型，将它们的变量视为“对象”还是“对象引用”并没有区别；它们的行为与在其他编程语言中的行为完全相同：\n\n```python\n>>> x =\
  \ 82\n>>> x += 7\n>>> x\n89\n```\n\n稍后我们将看到 Python 变量作为对象引用这一事实产生差异的情况。\n\n★ 这类似于\
  \ Java 中的赋值 `Integer x = new Integer(71);`，对于 C++ 来说相当于 `int x = 71;`。\n\n## 函数、方法与运算符术语\n\
  \n*函数*用于指代可以独立执行的子程序，而*方法*用于指代绑定到对象时执行的函数，即在实例上调用的函数。\n\n*运算符*可以是独立的，也可以绑定到对象，但与函数和方法不同，运算符不使用括号。表示运算符的符号如\
  \ `+`、`*` 和 `<` 显然是运算符，但名称如 `del` 和 `print` 的运算符通常被称为*语句*。\n\nPython 函数在数学意义上并不总是纯的：它们不需要返回值，并且可以修改参数。Python\
  \ 函数类似于 C 和 C++ 函数，类似于带有参数的 Pascal 函数。Python 方法类似于 C++ 或成员函数。\n\nPython 有两种比较方式：“身份”和“值”。对象的身份实际上是它们在内存中的地址，这正是对象引用所持。如果我们使用比较运算符如\
  \ `==` 和 `<`，我们得到值比较。例如，如果两个字符串的内容相同，则使用 `==` 时它们相等。如果我们使用 `is`，我们得到身份比较，这种比较很快，因为我们只需要比较地址而不需要查看对象本身。对象的身份可以通过对对象引用调用\
  \ `id()` 来。\n\nPython 有一个名为 `None` 的特殊对象。它可以赋值给任何变量并表示该变量没有值。`None` 对象只有一个实例，因此在测试它时始终可以使用快速的\
  \ `is` 和 `is not` 比较。\n\n注意我们在 `>>>` 提示符处单独写了 `x`。如果在 IDLE 中输入表达式或变量，其值会自动打印。在程序中，我们必须使用显\
  \ `print` 语句来打印。例如：`print x`\n\nPython 的 `print` 语句是一个运算符而不是函数，由于这个原因，调用它时不使用括号（正如我们使用\
  \ `+` 和其他运算符一样）。\n\n之前我们说 Python 使用动态类型。这涉及到两个因素。首先，我们可以将任何对象赋值给任何变量；例如：\n\n```python\n\
  x = 47\nx = \"Heron\"\n```\n\n\n\n\n在第一行之后 `x` 的类型是 `int`，在第二行之后 `x` 的类型变为 `str`，因此显然与名称\
  \ `x` 关联的类型取决于该名称绑定的内容，而不是取决于其自身的任何内在属性。因此，我们不需要将特定类型与特定名称关联。\n\nPython 动态类型的第二个方面是类型是强类型的：Python\
  \ 不允许在不兼容的类型之间进行操作，如下例在 IDLE 中输入的代码所示：\n\n```\n>>> x = 41\n>>> y = \"Flamingo\"\n\
  >>> x + y\nTraceback (most recent call last):\nFile <pyshell#2>, line 1, in <module>\n\
  x + y\nTypeError:\nunsupported operand type(s) for +: 'int' and 'str'\n```\n\n当我们尝试应用二元运算符\
  \ `+` 时，Python 抛出了 `TypeError` 异常并拒绝执行该操作。★（异常将在第 2 章中介绍。）\n\n如果我们给 `y` 赋值一个与 `x`\
  \ 类型兼容的类型，例如 `int` 或 `float`，那么加法就能正常工作：\n\n```\n>>> x = 41\n>>> y = 8.5\n>>> x\
  \ + y\n49.5\n```\n\n虽然 `x` 和 `y` 是不同的类型（`int` 和 `float`），但 Python 提供了其他语言使用的相同自动类型提升机制，因此\
  \ `x` 被转换为 `float`，实际执行的计算是 `41.0 + 8.5`。\n\n矩形代表对象，而\n\n```\na = 9\na\n9\n```\n\
  \n圆表示执行所示代码后产生的对象引用。\n\n```\nb = 8\nb\n8\nd = 7\nd\n7\nc = b\ne = d\nc\nd = \"A\
  \ sentence\"\ne\n\"A sentence\"\n```\n\n图 1.2 对象引用与对象\n\n给变量赋值称为*绑定*（binding），因为我们是将名称绑定到对象上。如果我们给现有变量赋值一个新对象，我们认为是对该名称进行了*重新绑定*（rebinding）。★\
  \ 回溯信息中的行内容（如 `File \"<pyshell#2>\"`）每次都会变化，因此你的行号可能与此处显示的不同。这在图 1.2 中有所体现。\n\n\
  ### 变量与对象\n15\n\n当我们这样做时，名称最初绑定的对象会发生什么？例如：\n\n```\n>>> x = \"Sparrow\"\n>>> x =\
  \ 9.8\n```\n\n持有文本“Sparrow”的 `str` 对象发生了什么？一旦一个对象没有名称绑定到它上，它就会被安排垃圾回收，并在适当的时候从内存中删除。这与\
  \ Java 中的工作原理非常相似。\n\nPython 变量名由 ASCII 字母、数字和下划线（`_`）组成。\n\n变量名应该以字母开头，并且区分大小写敏感（`rowan`、`Rowan`\
  \ 和 `roWan` 是三个不同的变量）。任何 Python 变量都不应该命名为 Python 的任何一个关键字（见表 1.1），也不应是 Python 的内置常量，如\
  \ `None`、`True` 或 `False`。\n\n### 数字与字符串\n\nPython 提供了几种数值类型和两种字符串类型。所有这些类型的共同点是它们是*不可变的*（immutable）。这意味着在\
  \ Python 中，数字和字符串是无法改变的。这听起来相当局限，但得益于 Python 的增强赋值运算符（`+=`、`*=` 等），这并不是一个问题。\n\n\
  在查看特定的数据类型之前，我们先来看不可变性的一个重要结果。让我们在 IDLE 中输入一些简单的表达式：\n\n```\n>>> x = 5\n>>> y =\
  \ x\n>>> x, y\n(5, 5)\n```\n\n在这里，我们创建了一个值为 `5` 的 `int` 类型对象，并将名称 `x` 绑定到它上。然后我们将\
  \ `x` 赋值给 `y`，其效果是将 `y` 绑定到与 `x` 绑定的同一个对象。因此，当我们在 IDLE 中打印它们时（在程序中我们需要写 `print x,\
  \ y`，但在 IDLE 中只需写表达式，IDLE 就会自动打印），IDLE 输出的值为一个元组（`tuple`）——本质上是一个只读的值列表。\n\n☞ 29\n\
  \n现在让我们增量 `y`：\n\n```\n>>> y += 1\n>>> x, y\n(5, 6)\n```\n\n我们可能预期 `x` 和 `y` 的值都是\
  \ `6`，因为它们都指向同一个整数对象。但因为 Python 的数字（以及字符串）是不可变的，这种情况并没有发生。当增强赋值运算符应用于不可变对象时，它们仅仅是语法糖：它们不会改变所应用的对象。所以实际发生的是：`y\
  \ = y + 1`，因此创建了一个*新的*整数对象（值为 `6`），并将 `y` 绑定到这个新对象。结果是当我们要求 IDLE 打印 `x` 和 `y` 时，它们指向不同的对象，每个对象都有不同的值。\n\
  \n我们需要记住`=` 运算符执行的是*绑定*操作，而不是赋值。左侧的名称被绑定到右侧的对象（如果名称已存在，则进行重新绑定）。\n\n第 1 章 数据类型与数据结构\n\
  \n**表 1.1 Python 关键字** ★\n\n| | | | | | | |\n| :--- | :--- | :--- | :--- | :---\
  \ | :--- |\n| as | break | class | def | if | yield |\n| assert | continue | continue\
  \ | from | in | with |\n| and | del | else | global | is | |\n| any | except | for\
  \ | lambda | not | or |\n| bool | | | | | |\n| True | | | | return | try |\n\n###\
  \ 整数与长整数\n\nPython 提供了整数类型：`bool`、`int` 和 `long`。`bool` 类型只能取 `True` 或 `False`。`int`\
  \ 类型是大多数编程语言提供的有符号整数类型；`long` 类型可以容纳仅受内存限制的整数。唯一的缺点是，如果对 `int` 类型应用的操作导致其值超出范围（例如，在某些机器上大于\
  \ $2^{31}-1$ 或小于 $-2^{31}$），`int` 类型会自动提升为 `long`。\n\nPython 使用后缀 `L` 表示长型。整数字面量假设为基\
  \ 10（十进制）数字，除非以 `0x` 开头的视为十六进制（基 16），例如 `0x3F` 是十进制 `63`，以 `0` 开头的视为八进制（基 8）。任何类型的整数字面量都可以附加\
  \ `L` 后缀使其成为长型。\n\nPython 支持我们预期的数字常用运算符，包括 `+`、`-`、`*`、`/`、`%` 以及它们的增强版本 `+=`、`-=`、`*=`、`/=`\
  \ 和 `%=`。Python 还提供了 `**` 用于幂运算。\n\n默认情况下，Python 的 `/` 除法运算符在两个操作数都是 `int` 类型时执行截断除。例如\
  \ `5 / 3` 产生 `1`。这是大多数编程语言的常态，但在 Python 中可能不方便，因为动态类型意味着变量在不同时间可能是 `int` 或 `float`。解决方案是告诉\
  \ Python*始终*执行“真除法”，在需要时产生浮点结果，并在我们确实需要截断时使用 `//` 运算符。我们将在第 4 章学习如何这样做。\n\n在实践中，数字和字符串的不可变性非常方便。例如：\n\
  \n```\n>>> s = \"Hat\"\n>>> t = \"Hat\"\n>>> u = s\n>>> s, t, u\n('Hat', 'Hat',\
  \ 'Hat')\n```\n\n注意 `s` 和 `u` 指向同一个字符串。我们的直觉是对的：对 `s` 应用 `+=` 将产生副作用，会创建一个新的字符串对象并绑定到\
  \ `s`，而 `u` 留为指向原始“Hat”的唯一字符串。\n\n\n\n\nPython 提供了三种浮点数类型：`float`、`Decimal` 和 `complex`。`float`\
  \ 类型存储双精度浮点数，其范围取决于构建 Python 时所使用的 C（或 Java）编译器；它们的精度有限，且无法可靠地进行等值性比较。`float` 类型的数字使用小数点书写，或使用科学计数法，例如：`0.0`、`5.7`、`8.9e-4`。在\
  \ IDLE 中输入这些类型是有益的：\n\n```python\n>>> 0.0, 5.7, 8.9e-4\n(0.0, 5.7000000000000002,\
  \ 0.00088999999999999995)\n```\n\n这种不准确性并不是 Python 特有的问题：计算机使用 2 进制表示浮点数，这可以精确地表示某些小数（如\
  \ `0.5`），但对其他小数只能近似表示（如 `0.1`）。此外，表示法使用了固的位数，因此能够存储的位数是的。\n\n# 第 1 章 数据类型与数据结构\n\
  \n在实践中，这很少是一个问题，因为大多数浮点数使用 64 位，这在大多数情况下绰绰有余。但如果我们需要高精度，可以使用 Python 来自 `decimal`\
  \ 模块的 `Decimal` 数字。这些数字执行的计算可以达到我们指定的精度水平（默认为 28 位小数），并能精确地表示像 `0.1` 这样的周期性数字；但处理速度比普通的\
  \ `float` 慢得多。由于它们的准确性，`Decimal` 数字适用于财务计算。\n\n在使用 `Decimal` 数字之前，必须先导入 `decimal`\
  \ 模块。无论我们是在 `.py` 文件中编写代码，还是像这里一样在 IDLE 中输入，其语法都是相同的：\n\n```python\n>>> import decimal\n\
  ```\n\n在这里，我们把 `decimal` 模块导入到 IDLE Shell 窗口中。（导入语义在“导入对象”侧边栏中解释）。整数字面量可以传递给 `Decimal`\
  \ 构造函数，但由于 `Decimals` 是高精度的而 `floats` 不是，因此我们不能传递 `floats`；相反，我们必须提供字符串形式的浮点值。例如：\n\
  \n```python\n>>> decimal.Decimal(19), decimal.Decimal(\"5.1\"), decimal.Decimal(\"\
  8.9e-4\")\n(Decimal(\"19\"), Decimal(\"5.1\"), Decimal(\"0.00089\"))\n```\n\n数字\
  \ `decimal.Decimal(\"5.1\")` 是精确存储的；作为 `float`，它可能类似于 `5.0999999999999996`。同样，`decimal.Decimal(\"\
  0.00089\")` 会类似于 `0.00088999999999999995`。我们可以轻松地从 `Decimal` 转换为 `float`，尽管这样做可能会丢失精度：\n\
  \n```python\n>>> d = decimal.Decimal(\"1.1\")\n>>> f = float(d)\n>>> f\n1.1000000000000001\n\
  ```\n\nPython 还提供了 `complex` 数字作为内置数据类型。这些数字由一个实部和一个虚部组成，后者由后缀 `j` 表示。例如：\n\n```python\n\
  >>> c = 5.4+0.8j\n>>> type(c)\n<type 'complex'>\n```\n\n在这里，我们输入了一个复数（语法为 `real_part`+`imagin-ary_part`\
  \ `j`），并使用 Python 的 `type()` 函数来查看 `c` 绑定的是什么类型。\n\n数学家使用 `i` 表示虚数，而工程师以及 Python\
  \ 使用 `j`。\n\n# 数字与字符串\n\n## 导入对象\n\nPython 拥有大量的模块，可以提供各种功能。为了使用这些模块，我们需要先导入它们。导入模块有多种方式，最常见的是使用\
  \ `import` 语句：\n\n```python\nimport math\n```\n\n或者，从模块中导入特定的函数、类或变量：\n\n```python\n\
  from math import sqrt\nsqrt(16)\n```\n\n你还可以使用 `as` 关键字为模块或导入成员重命名，这有助于避免命名冲突：\n\
  \n```python\nimport math as m\nm.sqrt(16)\n```\n\n你还可以导入模块中的所有内容：\n\n```python\n\
  from math import *\nprint(pi)\n```\n\n注意，通常不建议使用 `from module import *`，因为它会污染命名空间，并使得确定某个函数或变量的来源变得困难。\n\
  \n## 字符串\n\nPython 中的字符串是字符的序列。你可以使用单引号 `'` 或双引号 `\"` 来定义字符串，它们是等价的：\n\n```python\n\
  s1 = 'Hello'\ns2 = \"Hello\"\n```\n\n如果字符串内部包含一种引号，可以使用另一种引号来包裹，以避免转义：\n\n```python\n\
  s3 = \"It's a beautiful day\"\ns4 = 'He said, \"Hello!\"'\n```\n\n对于多行字符串，可以使用三引号（`'''`\
  \ 或 `\"\"\"`）：\n\n```python\ns5 = \"\"\"这是一个\n多行\n字符串示例。\"\"\"\n```\n\nPython 还允许你使用转义字符\
  \ `\\` 来在字符串中表示特殊字符。例如：\n\n- `\\n` 表示换行。\n- `\\t` 表示制表符。\n- `\\'` 表示单引号本身。\n- `\\\
  \"` 表示双引号本身。\n- `\\\\` 表示反斜杠本身。\n\n```python\ns6 = \"Line1\\nLine2\"\ns7 = \"Line1\\\
  tLine2\"\n```\n\n字符串是不可变的，这意味着一旦创建了字符串，就不能修改其内容。如果你想修改字符串，通常需要创建一个新的字符串：\n\n```python\n\
  s8 = \"Hello\"\ns9 = s8 + \" World\"\nprint(s9) # 输出: Hello World\n```\n\n你可以使用\
  \ `+` 运算符拼接字符串：\n\n```python\ns10 = \"Python\"\ns11 = \"3\"\nprint(s10 + s11) #\
  \ 输出: Python3\n```\n\n你还可以使用 `*` 运算符来重复字符串：\n\n```python\ns12 = \"Ha!\" * 3\nprint(s12)\
  \ # 输出: HaHaHa!\n```\n\n字符串可以通过索引进行访问。Python 的索引从 0 开始：\n\n```python\ns13 = \"Python\"\
  \nprint(s13[0]) # 输出: P\nprint(s13[3]) # 输出: h\n```\n\n你也可以使用负索引从字符串的末尾开始访问：\n\n\
  ```python\nprint(s13[-1]) # 输出: n\nprint(s13[-2]) # 输出: o\n```\n\n字符串切片（slicing）允许你提取字符串的一个部分：\n\
  \n```python\nprint(s13[0:2]) # 输出: Py\nprint(s13[2:])  # 输出: th\nprint(s13[:2])\
  \  # 输出: Py\nprint(s13[::-1]) # 输出: nohtyP (反转字符串)\n```\n\n字符串对象提供了许多内置方法来处理文本：\n\
  \n```python\ns14 = \"  hello world  \"\nprint(s14.strip()) # 输出: hello world\nprint(s14.upper())\
  \ # 输出:  HELLO WORLD  \nprint(s14.lower()) # 输出:  hello world  \nprint(s14.replace(\"\
  world\", \"Python\")) # 输出:  hello Python  \n```\n\n`split()` 方法可以将字符串分割成列表：\n\n\
  ```python\ns15 = \"apple,banana,cherry\"\nprint(s15.split(\",\")) # 输出: ['apple',\
  \ 'banana', 'cherry']\n```\n\n`join()` 方法可以将列表中的元素连接成字符串：\n\n```python\nlist16 =\
  \ [\"Python\", \"is\", \"fun\"]\nprint(\" \".join(list16)) # 输出: Python is fun\n\
  ```\n\n## 格式化字符串\n\nPython 提供了多种格式化字符串的方法：\n\n1. `%` 运算符（旧式）：\n```python\nprint(\"\
  Hello, %s, you are %d years old.\" % (\"Alice\", 25))\n```\n2. `.format()` 方法：\n\
  ```python\nprint(\"Hello, {}, you are {} years old.\".format(\"Bob\", 30))\n```\n\
  3. f-strings（Python 3.6+ 推荐方法）：\n```python\nname = \"Charlie\"\nage = 35\nprint(f\"\
  Hello, {name}, you are {age} years old.\")\n```\n\n## 字节串（Bytes）\n\n在 Python 3 中，字符串分为两种：`str`（文本）和\
  \ `bytes`（字节）。文本（str）存储的是 Unicode 字符，而字节串（bytes）存储的是 0-255 之间的整数，通常用于处理二进制数据。\n\n\
  ```python\nb1 = b\"hello\"\nb2 = bytes([104, 101, 108, 108, 111])\nprint(b1 == b2)\
  \ # 输出: True\n```\n\n你可以使用 `encode()` 将字符串转换为字节串，使用 `decode()` 将字节串转换为字符串：\n\n```python\n\
  s = \"你好\"\nb = s.encode(\"utf-8\")\nprint(b) # 输出: b'\\xe4\\xbd\\xa0\\xe5\\xa5\\\
  xbd'\ns2 = b.decode(\"utf-8\")\nprint(s2) # 输出: 你好\n```\n\n\n\n为什么我们使用 `print` 而不是让\
  \ IDLE 输出结果呢？因为 IDLE 使用十六进制转义字符来显示字符串中的非 ASCII 字符，所以如果不使用 `print`，IDLE 将输出 `u'\\\
  u20ac'`。\n\n我们也可以通过名称访问 Unicode 字符：\n\n```python\n>>> euro = u\"\\N{euro sign}\"\
  \n>>> print euro\n```\n\n如果我们需要在字符串中包含特殊字符，可以使用反斜杠（``\\```）对其进行转义。表 1.2 显示了可用的转义字符；Unicode\
  \ 转义字符仅在 unicode 字符串内部才有意义。\n\n这里有两个展示如何转义引号的示例：\n\n```python\n\"He said \\\"No\
  \ you don't!\\\" again.\"\n'What\\'s up with him?'\n```\n\n在双引号界定的字符串内部，我们不需要转义单引号；在单引号界定的字符串内部，也不需要转义双引号。\n\
  \n对于多行字符串，我们可以使用“三引号”：\n\n```python\n'''这个字符串有三行，其中包含一个 'quote',\n另一个 \"quote\"\
  ，并且只有一个嵌入的换行符 \\\n因为我们转义了其中一个。'''\n```\n\n这类字符串可以像普通字符串一样包含转义字符，并且可以像所示那样用三个单引号界定，也可以用三个双引号界定。三引号字符串以及\
  \ Python 代码中的换行符可以通过在前面加一个反斜杠来转义。（这在 Windows 上同样有效，尽管 Windows 在行尾使用两个字符而不是一个。）\n\
  \n★如果 Python 被配置为使用 UCS-4 表示，范围将扩展到 1 114 111。\n\n*第 1 章 数据类型与数据结构*\n\n**表 1.2 Python\
  \ 字符串转义字符**\n\n| 转义字符 | 含义 |\n| :--- | :--- |\n| `\\newline` | 转义（即忽略）换行符 |\n| `\\\
  \\` | 反斜杠 (`\\`) |\n| `\\'` | 单引号 (`’`) |\n| `\\\"` | 双引号 (`\"`) |\n| `\\a` | ASCII\
  \ 响响铃 (BEL) |\n| `\\b` | ASCII 退格符 (BS) |\n| `\\f` | ASCII 分页符 (FF) |\n| `\\n` |\
  \ ASCII 换行 (LF) |\n| `\\N{*name*}` | Unicode 字符名称 |\n| `\\r` | ASCII 回车符 (CR) |\n\
  | `\\t` | ASCII 制表符 (TAB) |\n| `\\u hhhh` | 具有给定 16 位十六进制值的 Unicode 字符 |\n| `\\\
  U hhhhhhhh` | 具有给定 32 位十六进制值的 Unicode 字符 |\n| `\\v` | ASCII 垂直制表符 (VT) |\n| `\\\
  ooooo` | 具有给定八进制值的字符 |\n| `\\x hh` | 具有给定十六进制值的字符 |\n\nPython 字符串是通过位置索引访问单个字符的序列，第一个字符位于\
  \ `0`。也可以从字符串末尾索引，最后一个字符的索引位置为 `-1`。例如：\n\n```python\n>>> phrase = \"The red balloon\"\
  \n>>> phrase[0], phrase[5], phrase[-1]\n('T', 'e', 'n')\n```\n\n负索引用于从右到左访问字符，最右边的字符位置为\
  \ `-1`，其左侧的一个是 `-2`，依此类推。\n\nPython 序列支持切片（slicing），这意味着我们可以从序列中拷贝子序列。切片由一个、两个或三个用冒号分隔的部分组成：起始位置（默认为索引\
  \ `0`）、结束位置（默认为序列长度）以及另一个我们将忽略的部分。切片的取值范围从起始索引开始，但不包含结束索引。这里是一些示例：\n\n```python\n\
  >>> phrase = \"The red balloon\"\n>>> phrase[:3]\n'The'\n>>> phrase[-3:]\n'oon'\n\
  >>> phrase[4:7]\n'red'\n```\n\n由于 Python 字符串是不可变对象，因此无法给字符串内部的字符或切片赋值：\n\n```python\n\
  >>> p = \"pad\"\n>>> p[1] = \"o\"\n# 错误示例\nTraceback (most recent call last):\n\
  File <pyshell#64>, line 1, in <module>\np[1] = o\nTypeError:\nobject does not support\
  \ item assignment\n```\n\n向字符串中插入字符最简单的方法是使用切片语法：\n\n```python\n>>> p = \"pad\"\n\
  >>> p = p[:1] + \"o\" + p[2:]\n>>> p\n'pod'\n```\n\n必须指定字面数字可能看起来很麻烦，但在实际编程中，我们通常通过方法调用来获取索引——例如使用\
  \ `find()` 方法。\n\n也可以采用其他方法。\n\n```python\n>>> p = \"pad\"\n>>> p = \"o\".join((p[:1],\
  \ p[2:]))\n>>> p\n'pod'\n```\n\n来自 Pascal 或 C++ 背景且习惯了可变字符串的程序员起可能会觉得字符串的不可变性很奇怪。当然，Python\
  \ 也提供了可变字符串；它们由 `StringIO` 模块和（更快的）cStringIO` 模块提供。PyQt 的 `QString` 类也是可变的。但通过练习，Python\
  \ 处理不可变字符串的方法，特别是上述所示使用 `join()` 方法进行拼接的惯用法，很快就会变成本能。稍后我们将查看另一个用于“组合”字符串的惯用法。\n\n\
  Python 字符串有很多实用的方法，但我们将关注最常用的几个。Python 字符串中的许多方法都是通过使用 `.` 运算符调用，并使用括号 `()` 调用方法，方法可以接受参数。★\n\
  \n前面提到，`find()` 方法返回其作为参数的字符串的位置索引。如果失败，则返回 `-1`。Python 还提供了 `index()` 方法，其用法相同，但在失败时会抛出\
  \ `ValueError`。\n\n```python\n>>> line = \"The quick fox.\"\n>>> line.find(\"q\"\
  )\n4\n```\n\n字符串方法可以应用于字符串对象和字符串字面量。\n\n`title()` 方法返回一个所应用的字符串的副本，但每个单词的首字母大写。\n\
  \n```python\n>>> \"althusian catastrophe\".title()\n'Malthusian Catastrophe'\n```\n\
  \nPython 提供了一种格式化语法，非常类似于 C 库的 `printf()` 函数。为了实现格式化，我们使用二进制 `%` 运算符，它接收一个格式化字符串参数和一个对象（通常是元组）进行格式化。例如：\n\
  \n```python\n>>> \"There are %i items\" % 5\n'There are 5 items'\n```\n\n字符串中的 `%i`\
  \ 被数字 `5` 替换。%% 后面的字母指定了期望的对象类型，`%i` 表示整数。这里有一个三个不同类型替换的示例，箭头显示哪个 `%` 项被元组中的哪个元素替换：\n\
  \n```python\n>>> \"The %i %s %f dollars\" % (3, \"fish\", 17.49)\n'The 3 fish cost\
  \ 17.490000 dollars'\n```\n\n*数字与字符串*\n\n**表 1.3 选定的字符串方法与函数**\n\n| 语法 | 描述 |\n\
  | :--- | :--- |\n| `x in s` | 如果字符串 x 是字符串 s 的子字符串，则返回 True |\n| `x not in s` |\
  \ 如果 x 不是字符串 s 的子字符串，则返回 True |\n| `x + s` | 返回字符串 x 和 s 的拼接 |\n| `s * i` | 返回由\
  \ i 次拼接 s 组成的字符串。例如，“Abc\" * 3 产生 \"AbcAbcAbc\"。\n| `len(s)` | 返回 s 的长度；如果 s 是 str\
  \ 类型，则是字节数；如果是 unicode 类型，则是字符数 |\n| `s.count(x)` | 返回字符串 x 在字符串 s 中出现的次数。此方法以及其他几个方法可以接收可选的起始和结束参数，以将搜索限制在调用方法的字符串切片内。\
  \ |\n| `s.endswith(x)` | 如果字符串 s 以字符串 x 结尾，则返回 True |\n\n\n\n\n\n`s.startswith(x)`\n\
  \n如果字符串 `s` 以字符串 `x` 开头，则返回 `True`\n\n`s.find(x)`\n\n返回 `x` 在 `s` 中从左侧首次出现的索引位置；如果未找到\
  \ `x`则返回 `-1`。\n\n`s.rfind(x)`\n\n类似于 `find()`，但从右侧向左搜索。\n\n`s.index(x)`\n\n返回 `x`\
  \ 在 `s` 中从左侧首次出现的索引位置；如果未找到 `x`则抛出 `ValueError` 异常。\n\n`s.rindex(x)`\n\n类似于 `index()`，但从右侧向左搜索。\n\
  \n`s.isdigit()`\n\n如果字符串不为空且包含的字符*全部*是数字，则返回 `True`。\n\n`s.isalpha()`\n\n类似于 `isdigit()`，但检查的是是否为字母。\n\
  \n`s.join((x,…))`\n\n返回一个字符串，该字符串是给定序列的连接，并使用调用该方法的字符串作为分隔符。例如，`\":\".join((\"A\"\
  , \"BB\", \"CCC\"))` 返回 `\"A:BB:CCC\"`。分隔符可以为空。\n\n`s.lower()`\n\n返回字符串 `s` 的小写拷贝。\n\
  \n`s.upper()`\n\n返回字符串 `s` 的大写拷贝。\n\n`s.replace(x, y)`\n\n返回字符串 `s` 的拷贝，其中字符串 `x`\
  \ 的所有出现之处都被替换为字符串 `y` 的拷贝。\n\n`s.split()`\n\n返回一个字符串列表，按空白字符进行分割。例如，`\"ab\\tc d\\\
  ne\".split()` 返回 `[\"ab\", \"c\", \"d\", \"e\"]`。该方法可以接受第一个参数（作为用于分割的字符串）以及第二个参数（允许的最大分割次数）。\n\
  \n`s.strip()`\n\n返回一个去除了开头结尾空白字符的字符串拷贝。接受一个可选的字符串参数，用于指定应该移除哪些字符。\n\n26\n\n*第 1\
  \ 章 数据类型与数据结构*\n\n`%` 项被称为格式化符，格式化字符串至少包含一个项。格式化符由一个百分号（`%`）符号后跟一个格式化字符组成。百分号本身通过使用\
  \ `%%` 来指定。在示例中，我们使用了 `%i`，它是 `int` 的格式化符；`%s` 是字符串的格式化符，而 `%f` 是 `float` 的格式化符。\n\
  \n之前我们查看了如何向字符串中插入子字符串。我们展示了如何使用切片来实现，以及使用更符合 Python 风格的方法——字符串 `join()` 方法。这里是第三种方法，使用格式化符：\n\
  \n```python\n>>> p = \"pad\"\n>>> p = \"%so%s\" % (p[:1], p[2:])\n>>> p\n'pod'\n\
  ```\n\n在这里，我们创建了一个新字符串，它由一个字符串（来自 `p` 的第一个切片）、`\"o\"` 和另一个字符串（来自 `p` 的第二个切片）组成。之前展示的\
  \ `join()` 方法用于拼接字符串；而这种方法则用于“组合”字符串。\n\n通过在 `%` 和和字母之间放置一些信息，我们可以对 `%` 项的格式化进行一些控制。例如，为了显示浮点数的小数后保留两位数字，可以使用格式化符\
  \ `%.2f`：\n\n```python\n>>> \"The length is %.2f meters\" % 72.8958\n'The length\
  \ is 72.90 meters'\n```\n\n这里是更多的示例，其中两个展示了 `%` 运算符与 `print` 语句结合使用：\n\n```python\n\
  >>> print \"An integer\", 5, \"and a float\", 65.3\nAn integer 5 and a float 65.3\n\
  >>> print \"An integer %i and a float %f\" % (5, 65.3)\nAn integer 5 and a float\
  \ 65.300000\n>>> print \"An integer %i and a float %.1f\" % (5, 65.3)\nAn integer\
  \ 5 and a float 65.3\n```\n\n在很多情况下，`%i`（及其同义词 `%d`）、`%f` 和 `%s` 就足够了。关于可用的格式化符以及如何修改它们以获得特定结果的完整细节可见\
  \ Python 文档；在这种情况下，请查找“String Formatting Operations”（字符串格式化操作）。Python 还有其他字符串格式化方法，例如\
  \ `string` 模块中的 `Template` 类提供了类 Perl 的插值功能。甚至可以使用类 C++ 的语法；参见《Python Cookbook》中的“Using\
  \ a C++-like iostream Syntax”食谱。（参见 Python 文档侧边栏。）\n\n注意，`print` 语句会自动在其打印的每个参数之间输出一个空格。可以使用\
  \ `sys.stdout.write()` 代替 `print` 来避免这一点；关于 `write()` 的更多内容将在第 6 章给出。\n\n*数字与字符串*\n\
  \n27\n\n**Python 文档**\n\nPython 提供了大量的文档。大多数文档的质量都很好，但在某些领域的覆盖范围相当薄弱。使用 HTML 版本导航文档需要练习，因为它的组织更像一本实体书而不是在线文档，且页面之间的交叉引用链接太稀少。\n\
  \nWindows 用户在这里是幸运的，因为对他们来说文档是以 Windows 帮助文件格式提供的。点击“开始→所有程序→Python 2.x→Python Manuals”来启动\
  \ Windows 帮助浏览器。该工具具有 `Index`（索引）和 `Search`（搜索）功能，使得查找文档变得简单。例如，要查找关于格式化符的信息，只需在索引编辑框中输入“formatting”，就会出现“formatting,\
  \ string (%)”条目。\n\n浏览文档是非常值得的。我们建议你查看“Library Reference”页面（`lib.html`）来看看 Python\
  \ 标准库提供了什么，并点击你感兴趣的话题的文档。这应该提供对可用内容的初步印象。\n\n28\n\n*第 1 章 数据类型与数据结构*\n\n当使用 PyQt\
  \ 时，我们可以访问额外的字符串类型 `QString`。与 Python 的 `str` 和 `unicode` 不同，`QString` 是可变的；这意味着我们可以原地修改\
  \ `QString`，插入和删除子字符串以及更改单个字符。\n\n**Qt**\n\n`QString` 的 API 与 `str` 和 `unicode`\
  \ 提供的大不同。（Qt 提供 `QString` 是因为 Qt 用 C++ 编写的，而 C++ 还没有内置的 Unicode 支持。）\n\n`QString`\
  \ 持 Unicode 字符，但取决于我们使用的 Python 版本，其内部表示可能与 Python 的 Unicode 表示不同；这并不重要，因为 PyQt\
  \ 可以轻松地在 `unicode` 和 `QString` 之间转换。例如：\n\n```python\n>>> from PyQt4.QtCore import\
  \ *\n>>> a = QString(\"apple\")\n>>> b = unicode(\"baker\")\n>>> print a + b\napplebaker\n\
  >>> type(a + b)\n<class 'PyQt4.QtCore.QString'>\n```\n\n\n\n\n在这里，我们从 `QtCore` 模块导入所有类，这些类通过\
  \ `PyQt4` 模块提供给我们。当我们执行涉及 `QString` 和 Python 字符串的操作时，结果字符串始终是 `QString`，正如 `type()`\
  \ 函数所揭示的那样。\n\n在使用 `PyQt` 时，接收字符串参数的 `Qt` 方法可以接受 `str`、`unicode` 或 `QString` 类型，`PyQt`\
  \ 会自动执行任何转换。返回字符串的 `Qt` 方法始终返回 `QString`。考虑到 Python 的动态类型特性，我们很容易变得困惑，不确定自己手里有的是\
  \ `QString` 还是 Python 字符串。因此，决定一个字符串使用策略是明智的，这样我们就能清楚地知道自己所处的状态。\n\n我们在 `PyQt` 中使用的策略如下：\n\
  \n-   仅在处理纯粹的 7 位 ASCII 字符串或原始 8 位数据（即原始字节）时使用 `str` 类型。\n-   对于仅供 `PyQt` 函数使用的字符串，例如仅由一个\
  \ `PyQt` 函数返回并在稍后将其传递给另一个 `PyQt` 函数的字符串——不要转换此类字符串。只需将它们保持为 `QString` 即可。\n-   在所有其他情况下，使用\
  \ `unicode` 字符串，尽快将 `QString` 转换为 `unicode`。换句话说，一旦从 `Qt` 函数返回了 `QString`，始终立即将其转换为\
  \ `unicode` 类型。\n\n此策略意味着我们避免了对 8 位字符串编码做出错误的假设（因为我们使用 Unicode）。它还确保了我们传递给 Python\
  \ 函数的字符串具有 Python 期望的方法：`QString` 拥的方法与 `str` 和 `unicode` 不同，因此将它们传递给 Python 函数可能会导致错误。`PyQt`\
  \ 使用 `QString` 而不是 `unicode`，是因为在 `PyQt` 最初创建时，Python 对 Unicode 的支持远不如现在。\n\n##\
  \ 集合 (Collections)\n\n一旦我们有了变量，即指向特定类型对象的单个命名对象引用，那么想要拥有整个对象引用集合就是自然而然的。Python 的标准集合类型持有对象引用，因此它们实际上可以持有任何类型对象的集合。集合使用对象引用的另一个结果是它们可以引用不同类型的对象：它们并不限于持有所有为同类型的项目。\n\
  \n内置集合类型有 `tuple`、`list`、`dict`（字典）、`set` 和 `frozenset`。\n\n除 `tuple` 和 `frozenset`\
  \ 之外的所有都是可变的，因此可以从列表、字典和集合中添加和删除项目。`collections` 模块提供了额外的可变集合类型。Python 标准库中有一个集合类型不持有对象引用；相反，它持有指定类型的数字。这就是\
  \ `array` 类型，它用于需要尽可能高效地存储和处理大量数字的情况。\n\n在本节中，我们将查看 Python 的内置集合类型。\n\n### 元组 (Tuples)\n\
  \n`tuple` 是一个包含零或多个对象引用的有序序列。类似于字符串切片（正如我们很快就会看到的，也列表一样），元组支持 `len()` 等序列函数，以及我们之前看到的相同切片语法。这使得从元组中提取项目变得非常容易。然而，元组是不可变的，因此我们不能替换或删除它们的任何项目。如果我们想要能够修改一个有序序列，只需使用\
  \ `list` 代替 `tuple`；或者如果我们已经有了一个 `tuple` 但想修改它，只需将其转换为 `list` 然后应用我们的更改。\n\n我们已经对元组有了一些非正式的接触；例如，我们在\
  \ IDLE 中的某些交互产生了被封装成元组的结果，我们还使用元组来为 `%` 运算符提供多个参数。\n\n以下是一些显示如何构造元组的示例：\n\n```python\n\
  >>> empty = ()\n>>> type(empty)\n<type 'tuple'>\n\n>>> one = (\"Canary\")\n>>> type(one)\n\
  <type 'str'>\n```\n\n`Qt` 库为 C++ 提供了自己的一套丰富的容器类，但这些类在 `PyQt` 中不可用，而且在任何情况下，Python\
  \ 自己的集合类也完全足够使用。\n\n```python\n>>> one = (\"Canary\",)\n>>> type(one)\n<type 'tuple'>\n\
  ```\n\n创建一个空元组很简单，但对于只有一个元素的元组，我们必须使用逗号来将其与括号表达式区分开来：\n\n```python\n>>> things =\
  \ (\"Parrot\", 3.5, u\"\\u20AC\")\n>>> type(things)\n<type 'tuple'>\n```\n\n元组可以持有任何类型的项目；这里我们有\
  \ `str`、`float` 和 `unicode` 项目。\n\n对于至少有两个项目且含义明确的元组，也可以省略括号：\n\n```python\n>>>\
  \ items = \"Dog\", 99, \"Cow\", 28\n>>> type(items)\n<type 'tuple'>\n```\n\n元组可以任意嵌套并可以进行切片，如这些示例所示：\n\
  \n```python\n>>> names = \"Albert\", \"Brenda\", \"Cecil\", \"Donna\"\n>>> names[:3]\n\
  ('Albert', 'Brenda', 'Cecil')\n>>> names[1]\n'Brenda'\n```\n\n我们创建了一个名字元组，然后取前三个项目的切片，然后查看索引位置\
  \ 1 的项目。和所有 Python 序列一样，第一个项目位于位置 0：\n\n```python\n>>> names = names[0], names[1],\
  \ \"Bernadette\", names[2], names[3]\n>>> names\n('Albert', 'Brenda', 'Bernadette',\
  \ 'Cecil', 'Donna')\n```\n\n现在我们更改了 `names` 元组，指向一个中间多了一个元素的新元组。我们可能想用 `names[:1]`\
  \ 代替 `names[0], names[1]`，同样地对最后两个名字使用 `names[2:]`，但如果我们这样做，最终会得到一个三项目的元组：\n\n```python\n\
  (('Albert', 'Brenda'), 'Bernadette', ('Cecil', 'Donna'))\n```\n\n这是因为当我们对元组使用切片时，切片本身始终也是元组。\n\
  \n```python\n>>> names\n('Albert', 'Brenda', 'Bernadette', 'Cecil', 'Donna')\n>>>\
  \ names = names[:4]\n>>> names\n('Albert', 'Brenda', 'Bernadette', 'Cecil')\n```\n\
  \n在这里，我们实际上通过获取前 4 个项目的元组删掉了最后一个名字，即索引位置为 0, 1, 2 和 3 的项目。在切片中，第一个数字是第一个索引，该项目*包含在*结果中，第二个数字是最后一个索引，该项目被*排除在*结果之外。\n\
  \n```python\n>>> names\n('Albert', 'Brenda', 'Bernadette', 'Cecil')\n>>> names =\
  \ names[:-1]\n>>> names\n('Albert', 'Brenda', 'Bernadette')\n```\n\n去掉最后一个项目的另一种方法是从末索引；通过这种方式我们不需要知道元组的长度。但如果我们想知道长度，可以使用\
  \ `len()` 函数：\n\n```python\n>>> pets = (\"Dog\", 2), (\"Cat\", 3), (\"Hamster\"\
  , 14))\n>>> len(pets)\n3\n>>> pets\n(('Dog', 2), ('Cat', 3), ('Hamster', 14))\n\
  >>> pets[2][1]\n14\n>>> pets[1][0:2]\n('Cat', 3)\n>>> pets[1]\n('Cat', 3)\n```\n\
  \n元组可以嵌套，并可以使用多个方括号访问项目。任何序列都可以传递给 `tuple` 构造函数来创建元组。例如：\n\n```python\n>>> tuple(\"\
  some text\")\n('s', 'o', 'm', 'e', ' ', 't', 'e', 'x', 't')\n```\n\n我们需要固定的对象集合时，元组非常有用。它们也被用作函数和方法的参数。例如，从\
  \ Python 2.5 开始，`str.endswith()` 方法接受单个字符串参数（例如 \".png\"）或字符串元组（例如 (\".png\", \"\
  .jpg\", \".jpeg\")）。\n\n### 列表 (Lists)\n\n`list` 类型是一种与 `tuple` 类型相似的有序序列类型。我们在字符串和元组上看到的所有序列函数和切片在列表上的工作方式完全相同。元组与列表的区别在于列表是可变的，并且拥有我们可以用来修改它们的方法。\n\
  \n```python\n>>> fruit = [\"Apple\", \"Hawthorn\", \"Loquat\", \"Medlar\", \"Pear\"\
  , \"Quince\"]\n>>> fruit[:2]\n['Apple', 'Hawthorn']\n>>> fruit[-1]\n'Quince'\n>>>\
  \ fruit[2:5]\n['Loquat', 'Medlar', 'Pear']\n```\n\n\n在这里，我们使用了已经在字符串和元组中使用过的熟悉的切片语法。\n\
  \n由于列表是可变的，因此我们可以插入和删除列表项。这可以通过调用方法来实现，也可以通过在赋值运算符的两侧都使用切片语法来实现。首先我们先看方法调用：\n\n\
  ```\n>>> fruit.insert(4, \"Rowan\")\n>>> fruit\n['Apple', 'Hawthorn', 'Loquat',\
  \ 'Medlar', 'Rowan', 'Pear',\n'Quince']\n>>> del fruit[4]\n>>> fruit\n['Apple',\
  \ 'Hawthorn', 'Loquat', 'Medlar', 'Pear', 'Quince']\n```\n\n我们使用方法调用和操作符插入了一个新项，然后将其删除。`del`\
  \ 语句用于删除特定索引位置的项，而 `remove()` 方法用于删除与 `remove()` 参数匹配的项。因此，在这个示例中，我们也可以使用效率较低的 `fruit.remove(\"\
  Rowan\")` 来删除。\n\n现在我们将使用切片来执行相同的操作：\n\n```\n>>> fruit[4:4] = [\"Rowan\"]\n>>> fruit\n\
  ['Apple', 'Hawthorn', 'Loquat', 'Medlar', 'Rowan', 'Pear',\n'Quince']\n>>> fruit[4:5]\
  \ = []\n>>> fruit\n['Apple', 'Hawthorn', 'Loquat', 'Medlar', 'Pear', 'Quince']\n\
  ```\n\n当我们分配“Rowan”时，我们使用了方括号，因为我们正在向一个列表切片插入一个列表切片（一个包含一个元素的列表）。如果我们省略了括号，Python\
  \ 将把“Rowan”单词本身视为一个列表，并将“R”、“o”等作为单独项进行插入。\n\n### 集合\n\n33\n\n#### 表 1.4 选定的列表方法和函数\n\
  \n| 语法 | 描述 |\n| :--- | :--- |\n| `x in L` | 如果项 `x` 在列表 `L` 中，返回 True |\n| `x not\
  \ in L` | 如果项 `x` 不在列表 `L` 中，返回 True |\n| `L + m` | 返回一个包含列表 `L` 和列表 `m` 中所有项的列表；`extend()`\
  \ 方法实现相同的功能但效率更高 |\n| `len(L)` | 返回列表 `L` 的长度 |\n| `L.count(x)` | 返回项 `x` 在列表 `L`\
  \ 中出现的次数 |\n| `L.index(x)` | 返回项 `x` 在列表 `L` 中从左侧首次索引位置，或抛出 `ValueError` 异常 |\n\
  | `L.append(x)` | 将项 `x` 添加到列表 `L` 的末尾 |\n| `L.extend(m)` | 将列表 `m` 的所有项添加到列表 `L`\
  \ 的末尾 |\n| `L.insert(i, x)` | 在索引位置 `i` 处列表 `L` 插入项 `x` |\n| `L.remove(x)` | 从列表\
  \ `L` 中删除项 `x` 的左侧首次出现，如果没有找到 `x` 则抛出 `ValueError` 异常 |\n| `L.pop()` | 返回并删除列表 `L`\
  \ 的右侧项 |\n| `L.pop(i)` | 返回并删除 `L` 中索引位置 `i` 处的项 |\n| `L.reverse()` | 原地反转列表 `L`\
  \ |\n| `L.sort()` | 原地排序列表 `L`；此方法接受可选参数，如比较函数或“key”，以方便 DSU（装饰、排序、取消装饰）排序 |\n\n\
  当使用切片进行插入时，源切片和目标切片的长度可以是不同的。如果目标切片的长度为 0（例如 `fruit[4:4]`），则只发生插入；但如果目标的长度大于 0，则目标切片中的项将被将被插入的切片中的项所替换。在这个示例中，我们用一个单项切片替换了一个零项切片，实际上是删除了该项。\n\
  \n这里是另外几个例子：\n\n```\n>>> fruit[2:3] = [\"Plum\", \"Peach\"]\n>>> fruit\n['Apple',\
  \ 'Hawthorn', 'Plum', 'Peach', 'Medlar', 'Quince']\n>>> fruit[4:4] = [\"Apricot\"\
  , \"Cherry\", \"Greengage\"]\n>>> fruit\n['Apple', 'Hawthorn', 'Plum', 'Peach',\
  \ 'Apricot', 'Cherry',\n'Greengage', 'Medlar', 'Quince']\n>>> bag = fruit[:]\n>>>\
  \ bag\n['Apple', 'Hawthorn', 'Plum', 'Peach', 'Apricot', 'Cherry',\n'Greengage',\
  \ 'Medlar', 'Quince']\n```\n\n34\n\n第 1 章 数据类型和数据结构\n\n#### 浅拷贝和深拷贝\n\n我们之前看到（第\
  \ 16 页），如果两个变量引用同一个字符串并且我们更改了其中一个（例如使用 `+=` 进行追加），Python 会创建一个新字符串。这是因为 Python 字符串是不可变的。对于列表（以及字典，稍后会介绍）等可变类型，情况有所不同。\n\
  \n例如，如果我们创建一个被两个变量引用的列表，并且通过其中一个变量更改列表，那么*两个*变量现在都指向*同一个*已更改的列表：\n\n```\n>>> seaweed\
  \ = [\"Aonori\", \"Carola\", \"Dulse\"]\n>>> macroalgae = seaweed\n>>> seaweed,\
  \ macroalgae\n(['Aonori', 'Carola', 'Dulse'], ['Aonori', 'Carola', 'Dulse'])\n```\n\
  \n\n\n\n如果 `x` 不在字典 `d` 中，则返回 True\n\n`len(d)`\n返回字典 `d` 中的项数\n\n`d.clear()`\n从字典\
  \ `d` 中删除所有项\n\n`d.copy()`\n返回字典 `d` 的浅拷贝\n\n`d.keys()`\n返回字典 `d` 中所有键的列表\n\n`d.values()`\n\
  返回字典 `d` 中所有值的列表\n\n`d.items()`\n返回字典 `d` 中所有（键，值）对的元组列表\n\n`d.get(k)`\n返回键 `k`\
  \ 对应的值，或 `None`\n\n`d.get(k, x)`\n如果 `k` 在字典 `d` 中，则返回键 `k` 的值；否则，返回 `x`\n\n`d.setdefault(k,\
  \ x)`\n与 `get()` 方法相同，不同在于：如果键不在字典 `d` 中，则会插入一个新项，其键为指定的键，值为 `None`（如果提供了 `x` 则值为\
  \ `x`）\n\n`d.pop(k)`\n返回并删除键为 `k` 的项；如果字典 `d` 中没有该键，则抛出 `KeyError` 异常\n\n`d.pop(k,\
  \ x)`\n如果 `k` 在字典 `d` 中，则返回并删除键为 `k` 的项；否则，返回 `x`\n\n可以使用 `dict()` 构造函数构建字典，如果键恰好是有效标识符（即以字母开头且不空格的字母数字），我们可以使用更方便的语法：\n\
  \n```python\n>>> vitamins = dict(B12=1000, B6=250, A=380, C=5000, D3=400)\n>>> vitamins\n\
  {'A': 380, 'C': 5000, 'B12': 1000, 'D3': 400, 'B6': 250}\n```\n\n我们之前提到过字典的键可以是元组；这里有最后一个示例来展示其用法：\n\
  \n```python\n>>> points3d = {(3, 7, -2): \"Green\", (4, -1, 11): \"Blue\", (8, 15,\
  \ 6): \"Yellow\"}\n>>> points3d\n{(4, -1, 11): 'Blue', (8, 15, 6): 'Yellow', (3,\
  \ 7, -2): 'Green'}\n>>> points3d[(8, 15, 6)]\n'Yellow'\n```\n\n在第 2 章中，我们将看到如何以“自然的”任意顺序遍历字典，以及按键顺序遍历。\n\
  \n## Collections\n\n### 集合\n\nPython 提供了两种集合类型：`set` 和 `frozenset`。两者都是无序的，因此都不是序列。集合是可变的，因此可以添加和删除项。\n\
  \n冻结集合（Frozensets）是不可变的且无法更改；但这意味着它们适合作为字典的键。\n\n集合中的每个项都是唯一的；如果我们尝试添加一个已经于集合中的项，`add()`\
  \ 调用将什么都不做。如果两个集合包含相同的项，则它们是相等的，无论这些项的插入顺序如何。集合类似于只有键没有值的字典。相比之下，列表按照插入顺序保留其项（除非经过排序），并允许重复项。\n\
  \n冻结集合通过单个序列参数构造——例如，元组或列表。集合也可以以此的方式构造。例如：\n\n```python\n>>> unicorns = set((\"\
  Narwhal\", \"Oryx\", \"Eland\"))\n>>> \"Mutant Goat\" in unicorns\nFalse\n>>> \"\
  Oryx\" in unicorns\nTrue\n```\n\n由于我们创建的是集合而非冻结集合，因此我们可以添加和删除项。例如：\n\n```python\n\
  >>> unicorns.add(\"Mutant Goat\")\n>>> unicorns\nset(['Oryx', 'Mutant Goat', 'Eland',\
  \ 'Narwhal'])\n>>> unicorns.add(\"Eland\")\n>>> unicorns\nset(['Oryx', 'Mutant Goat',\
  \ 'Eland', 'Narwhal'])\n>>> unicorns.remove(\"Narwhal\")\n>>> unicorns\nset(['Oryx',\
  \ 'Mutant Goat', 'Eland'])\n```\n\n集合类还支持标准的集合操作——例如并集、交集和差集——对于某些操作，提供了方法和运算符，如表\
  \ 1.6 所示。\n\n### 内置函数\n\n正如我们已经看到的，Python 许多许多内置函数和运算符：例如 `del`、`print`、`len()`\
  \ 和 `type()`。表 1.7–1.9 显示了其他一些用的函数，我们将在此讨论其中一些。\n\n在 IDLE 中或直接使用 Python 解释器时，可以使用\
  \ `help()` 函数来获取对象的信息，或进入 Python 的交互式帮助系统。例如：\n\n```python\n>>> help(str)\n```\n\
  \n**表 1.6 选定的集合方法和函数**\n\n| 语法 | 描述 |\n| :--- | :--- |\n| `x in s` | 如果项 `x` 在集合\
