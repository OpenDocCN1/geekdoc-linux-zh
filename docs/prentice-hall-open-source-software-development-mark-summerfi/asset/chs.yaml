  \n扩展 `ShipTableModel.data()` 方法以提供工具提示（tooltips）。提示应该应该是数据项的文本，但 TEU 除外，其文本应该是（本地化的）数字后跟“twenty\
  \ foot equivalents”。注意 HTML 在工具提示中是正确格式化的。这很容易，只需要十几行代码。\n\n修改 `ShipTableDelegate.setModelData()`，使其仅当新文本至少三个三个字符时更改名称、所有者或国家。扩展这些列的工具提示，添加文本“(minimum\
  \ of 3 characters)”。这可以在大约六行内完成。\n\n添加一个导出按钮，按下时会提示用户输入后缀为 `.txt` 的文件名，并使用 UTF-8\
