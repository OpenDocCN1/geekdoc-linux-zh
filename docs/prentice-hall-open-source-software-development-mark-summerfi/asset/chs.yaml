  \ offset）；当用户重复添加相同类型的项目时，会使用之前的点和添加偏移。在这两种情况下，新添加的项目都是在偏移位置添加的，而不是精确地覆盖在上一个项目之上。这使用户更容易看到自己所在的位置。\n\
