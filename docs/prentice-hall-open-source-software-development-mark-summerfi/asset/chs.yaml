  \n# 关于作者\n\n## Mark Summerfield\nMark 毕业于威尔士大学斯尼分，获得计算机科学一等荣誉学位。在进入行业之前，他进行了一年的研究生研究。在加入\
  \ Trolltech 之前，他曾在多家公司担任软件工程师多年。他在 Trolltech 作为文档经理工作了近三年，在此期间他创办并编辑了 Trolltech\
  \ 的技术期刊《Qt Quarterly》，并合著了《C++ GUI Programming with Qt 3》以及随后的《C++ GUI Programming\
  \ with Qt 4》。Mark 拥有 Qtrac Ltd.（[`www.qtrac.eu,](http://www.qtrac.eu)），在那里担任独立作者、编辑、培训师和顾问，专精\
  \ C++、Qt、Python 和 PyQt。\n\n## 制作\n本文使用 `gvim` 编写，并使用 Lout 排版语言进行标记。索引由作者编译，并得到了一个为此目的开发的\
  \ `PyQt` 程序的协助。所有图表均使用 Lout 生成。几乎所有的代码段都是直接通过 Lout 结合 `Python` 脚本从示例程序中提取的。示例程序中使用的图标大部分来自\
  \ KDE（“K”桌面环境），少数几个由作者创建。书页边栏使用的图像来自 Open Clip Art 库，另一些图像来自 Gutenberg 项目。SVG 图像使用\
  \ `Inkscape` 转换为 `EPS`。Linux 截图使用 `KSn` 拍摄，Windows 截图则使用一个微小的 `PyQt` 应用程序捕捉并保存；在两种情况下，`.png`\
  \ 图像都使用 `ImageMagick` 转换为 `.eps`。代码使用的等宽字体源自 `DejaVu Mono` 的压缩版本，并使用 `FontForge`\
  \ 进行修改。Wikipedia 在各个方面都被证明非常有用，包括作为标志图像的来源，并经常被用于获取创意、信息和示例数据。标记后的文本使用 `gv` 和 `evince`\
  \ 进行预览，并由 Lout 转换为 PostScript，然后由 `Ghostscript` 转换为 PDF。\n\n所有的编辑和处理都是在 Fedora 和\
  \ Kubuntu 系统上完成的。\n\n封面由出版商提供，考虑到 `Python` 用于校准和分析哈勃望远镜的数据，图片由作者建议。截图是在 Windows\
  \ XP、Mac OS X 和 Linux/KDE 上拍摄的。所有示例程序均在 Windows、Linux 和 Mac OS X 上经过测试，使用了 `Python\
  \ 2.5`、`Qt 4.2` 和 `PyQt 4.2`，并在 Windows 和 Linux 上使用 `Qt 4.3` 和 `PyQt 4.3` 额外测试。\n\
