  painter.setPen(self.palette().color(QPalette.Mid))\npainter.setBrush(self.palette().brush(QPalette.AlternateBase))\n\
  painter.drawRect(self.rect())\n```\n\n我们创建一个 `QPainter` 并设置渲染提示以获得抗齿绘制。然后我们设置笔（用于形状轮廓和绘制文本）和画刷（用于填充），并在整个小部件上绘制矩形。由于对笔和画刷使用了不同的颜色，这为小部件产生了一个边框和略微凹陷的效果。\n\
  \n\n\n\n`QApplication` 对象拥有一个 `QPalette`，它包含了各种用途的颜色，例如文本前景和背景颜色、按钮颜色等。这些颜色通过其角色（roles）来识别，例如\
  \ `QPalette.Text` 或 `QPalette.Highlight`，尽管在这个示例中使用了一些较为晦涩的角色。事实上，这些颜色分为三组，每组对应一种小部件状态：“激活（active）”、“禁用（disabled）和“非激活（inactive）”。每个\
