- "# Python 和 Qt 快速 GUI 编程\n\n\n\n![](img/cover.jpeg)\n\n![Image 1](img/index-1_1.jpg)\n\
  \n\n\n\n\n\n开源技术改变了计算世界。许多大型项目已在全球范围内投入生产，例如 `Apache`、`MySQL` 和 `Postgres`，程序员们使用多种语言（包括\
  \ `Perl`、`Python` 和 `PHP`）编写应用程序。这些技术被应用于许多不同的系统，从专有系统到 `Linux` 系统，再到传统的 `UNIX`\
  \ 系统以及大型机。\n\nPrentice Hall 开源软件开发系列旨在带带你领略这些开源技术的精髓。你不仅将学习如何将它们应用于你的项目，你还将*从它们中学习*。通过查看真实应用程序中的代码，你将学习到全球开源开发者的最佳实践。\n\
