  \        self.barGraphView.setModel(self.model)\n        self.listView = QListView()\n\
  \        self.listView.setModel(self.model)\n        self.listView.setItemDelegate(BarGraphDelegate(0,\
  \ 1000, self))\n        self.listView.setMaximumWidth(100)\n        self.listView.setEditTriggers(QListView.DoubleClicked|\n\
  \        QListView.EditKeyPressed)\n        layout = QHBoxLayout()\n        layout.addWidget(self.listView)\n\
  \        layout.addWidget(self.barGraphView, 1)\n        self.setLayout(layout)\n\
  \        self.setWindowTitle(\"Bar Grapher\")\n```\n\n在模型解决方案中，我们添加了一些额外的代码来创建 20\
  \ 个随机项目，以生成初始条形图。整个过程可以在 200 行代码内完成。\n\n解决方案位于 `chap16/bargrapher.pyw`。\n\n# 在线帮助与国际化\n\
  \n用户只需阅读菜单工具提示（Tooltips）、选项和按钮文本即可使用非常简单的应用程序。其他应用程序可能需要更多信息和状态提示，在这种情况下，工具提示和状态提示是一种易于编程的解决方案。\n\
  \n但某些应用程序非常复杂或高级，用户可能需要更广泛的帮助来理解可用功能以及如何使用这些应用程序。\n\n提供充分信息的解决方案是提供打印手册；另一种方法是提供帮助系统。可以使用几种可能的方法来创建合适的在线帮助系统；我们将提到所有方法，并展示其中一种。我们将回到第\
  \ 6 章介绍的 Image Changer 应用程序，在本章的节节中，我们将展示应用程序 `MainWindow.helpHelp()` 方法的实现，以及如何提供在线帮助系统。\n\
  \n在整书中，所示应用程序的菜单文本、按钮文本、标签、提示等都是用英文提供的。这对于世界上少数能读英语的人来说没有问题，但对于母语为世界通用语言——普通话，或其他主要语言（如西班牙语、阿拉伯语、印地语、葡萄牙语、孟加拉语、俄语或日语）的人来说意义不大。\n\
  \n为了让应用程序尽可能通用，它必须让非英语用户可以使用。PyQt 提供了一个工具链，用于识别用户可见的字符串，并将这些字符串提供易于使用的 `Qt Linguist`\
  \ GUI 应用程序，人类翻译人员可以使用它来提供适当翻译。在本章的第二节中，我们将讨论翻译工具并展示如何使用它们。我们还将展示一个全新的翻译感知版本的 Image\
  \ Changer 应用程序，适用于配合翻译工具。\n\n## 在线帮助\n\n提供在线帮助系统有三种常用方法。一种方法是以 HTML 文件的形式提供帮助，并启动设置了相关页面的\
  \ Web 浏览器。另一种方法是使用 Qt 提供的 `Qt Assistant` 应用程序。第三种方法是提供帮助表单，同样使用 HTML，但将图像和 HTML\
  \ 文件作为资源。\n\n**图 17.1** Image Changer 帮助表单\n\n第一种方法可以通过启动独立的浏览器进程来实现，使用 Python 的\
  \ `subprocess` 模块或 PyQt 的 `QProcess` 类。\n\nQt 4.2 引入了一个新类 `QDesktopServices`，它通过\
  \ `openUrl()` 静态便利方法可以非常容易以平台无关的方式启动浏览器。\n\n第二种方法更为复杂，因为它要求我们创建一个特殊格式的 XML 文件，并随应用程序分发\
  \ `Qt Assistant`。使用 `Qt Assistant` 的优势是它提供了自动索引。\n\n第三种方法使用自定义帮助表单并将 HTML 文件和图像作为资源，这是我们将要使用的方法。我们在第\
  \ 6 章查看资源文件时看到，可以包含任意文件（包括 HTML 文件），并且在我们的 `resources.qrc` 文件中整合了一些演示帮助文件。以下是 Image\
  \ Changer 的 `MainWindow.helpHelp()` 方法的代码：\n\n```python\ndef helpHelp(self):\n \
  \   form = helpform.HelpForm(\"index.html\", self)\n    form.show()\n```\n\n###\
  \ 在线帮助\n\n使用我们的帮助表单很容易：我们只需给它一个 HTML 文件，并让 self 决定表单居中的位置。注意我们使用的是 `show()` 而不是\
  \ `exec_`；这意味着显示的表单将设置删除关闭属性。\n\n到此时我们已经非常熟悉创建 PyQt 对话框了，因此我们将局限于展示与创建帮助系统相关的片段——具体来说是\
  \ `HelpForm` 初始化器的两个片段以及它的一个方法片段（代码位于 `chap17/helpform.py` 中）。\n\n```python\nclass\
  \ HelpForm(QDialog):\n    def __init__(self, page, parent=None):\n        super(HelpForm,\
  \ self).__init__(parent)\n        self.setAttribute(Qt.WA_DeleteOnClose)\n     \
  \   self.setAttribute(Qt.WA_GroupLeader)\n```\n\n`Qt.WA_GroupLeader` 属性确保如果帮助表单是从模态对话框调用的，用户将能够与模态对话框和帮助表单交互，这在其他情况下是不可能的。如果帮助表单是从非模对话框或主窗口调用的，该属性则不起作用，用户可以像常一样与两者交互。\n\
  \n`QTextBrowser` 类是 `QTextEdit` 的子类，可以显示大量的 HTML 标签，包括图像、列表和表格。我们已将其搜索路径设置为资源文件的根目录，并将其初始页面设置为传入的页面。由于我们设置了搜索路径，我们能够传递不带路径的页面（例如，简单的\
  \ `index.html` 或 `filemenu.html`）。`QTextBrowser` 识别资源路径，因此能够找到 `<img>` 标签中的图像资源，如\
  \ `<img src=\":/filenew.png\">`。\n\n```python\nself.textBrowser.setSearchPaths([\"\
  :/\"])\nself.textBrowser.setSource(QUrl(page))\n```\n\n页面跳转由 `QTextBrowser` 自动处理。\n\
  \n尽管如此，我们提供了两个工具栏按钮，“返回”和“首页”，并将它们连接到相应的 `QTextBrowser` 槽以获得我们想要的行为。\n\n```python\n\
  self.connect(backAction, SIGNAL(\"triggered()\"),\nself.textBrowser, SLOT(\"backward()\"\
  ))\nself.connect(homeAction, SIGNAL(\"triggered()\"),\nself.textBrowser, SLOT(\"\
  home()\"))\nself.connect(self.textBrowser, SIGNAL(\"sourceChanged(QUrl)\"), self.updatePageTitle)\n\
  ```\n\n\n\n\n如果 HTML 文档发生了变化——例如，用户点击了超链接——我们会调用自定义的 `updatePageTitle()` 槽（slot）。\n\
  \n```python\ndef updatePageTitle(self):\n    self.pageLabel.setText(self.textBrowser.documentTitle())\n\
  ```\n\n此槽只需将 HTML 页面的 `<title>` 文本置在工具栏中的 `QLabel` 中，位于工具栏按钮的右侧。\n\n一旦我们有了 `HelpForm`\
  \ 类，我们就可以完全使用 HTML 实现我们的在线帮助系统，可以将文件作为资源包含进来，或者将它们安装在文件系统中并使用如下代码找到它们：\n\n```python\n\
  helppath = os.path.join(os.path.dirname(__file__), \"help\")\n```\n\n这假设帮助文件位于名为\
  \ `help` 的目录中，该目录位于应用程序的 `.pyw` 文件所在的目录下。\n\n编写提供在线帮助系统的代码是直接的；但设计一个易于导航且易于理解的系统可能是一个巨大的挑战。\n\
  \n## 国际化\n\n在使应用程序适用于使用原始语言不同的语言的用户时，有几个问题需要考虑。最大且显而易见的问题是所有用户可见的字符串必须翻译成目标语言——这不仅包括用于菜单选项和对话框按钮的字符串，还包括工具提示、状态提示以及任何其他在线帮助。此外，我们必须执行其他本地化，例如确保数字使用适当的小数分隔符和千位分隔符，确保时间和日期格式正确，并且纸张尺寸和计量系统是正确的。例如，大多数美国和英国人说英语，但两种文化具有不同的日期格式规范、不同的货币、不同的标准纸张尺寸和不同的计量系统。\n\
  \n## Unicode\n\n得益于 `Unicode` 的使用，几乎任何人类语言使用的任何字符都可以显示。我们在书的开头看到，可以使用 unicode 转义字符和目标字符的十六进制代码点，或者使用\
  \ `unichr()` 函数，将任何 `unicode` 字符包含在 `unicode` 或 `QString` 字符串中。对于读写包含 `Unicode`\
  \ 的文本文件，我们可以使用 Python 的 `codecs.open()` 函数，或者像我们在前面的章节中看到的 PyQt 的 `QTextStream`。\n\
  \n## 国际化\n\n当涉及到本地化的某些方面时，我们可以使用 `QString`、`QDate` 和 `QDateTime`。例如，假设 `n` 是一个数字，`QString(\"\
  %L1\").arg(n)` 将产生一个带有适用于当前区域的千位和小数分隔符的 `QString`。`QDate` 和 `QDateTime` 都有 `toString()`\
  \ 方法，可以接受自定义格式，或预定义的格式，如 `Qt.SystemLocaleDate`（旧代码中的 `Qt.LocalDate`）或 `Qt.ISODate`，后者是“通用”的。此外，`QLocale`\
  \ 类提供了许多返回本地化 `QStrings` 的方法，以及少量从本地化 `QStrings` 中提取数字的方法。它还具有返回特定区域字符的方法，例如用作负号的字符、百分比符号等。\n\
  \n与应用程序国际化相关的大部分工作与翻译有关，因此在本部分的剩余内容中，我们将关注这个主题。\n\n为了帮助翻译应用程序，PyQt 提供了一个由三个工具组成的工具链：`pylupdate4`、`lrelease`\
  \ 和 `Qt Linguist`。为了让这些工具有用，每个用户可见的字符串必须经过特殊标记。通过使用 `QObject.tr()` 方法很容易实现，所有的 `QWidget`\
  \ 子类都继承了这个方法，包括所有的对话框和主窗口。例如，我们不写 `QString(\"&Save\")`，而是写 `self.tr(\"&Save\")`。传递给\
  \ `tr()` 的文本应该是 ASCII；如果需要 ASCII 范围之外的字符，请使用 `trUtf8()`。\n\n对于每个标记为翻译的字符串，翻译工具会提供一对字符串：一个“上下文”字符串（类名）和标记的字符串本身。上下文的目的是帮助人类翻译人员识别要翻译的字符串显示在哪个窗口中，因为在某些语言中，不同的窗口可能需要不同的翻译。\n\
  \n对于需要翻译但不在类内部的字符串，我们必须使用 `QApplication.translate()` 方法，并自己提供上下文字符串。例如，在 `main()`\
  \ 函数中，我们可能会这样翻译应用程序名称：`QApplication.translate(\"main\", \"Gradgrind\")`。在这里，上下文是\
  \ \"main\"，要翻译的字符串是 \"Gradgrind\"。\n\n遗憾的是，`self.tr()` 使用的上下文可能与 C++/Qt 的 `tr()`\
  \ 方法使用的上下文不同，因为 PyQt 动态确定上下文，而 C++ 在编译时确定。★ 如果翻译文件即在 C++/Qt 和 PyQt 应用程序之间共享，这一点可能很重要。如果对表单进行了子类化，也可能成为问题。如果发生此类问题，解决方案简单是将每个单参数的\
  \ `self.tr()` 调用替换为双参数的 `QApplication.translate()` 调用，显式地将正确的上下文作为第一个参数，将要翻译的字符串作为第二个参数。\n\
  \n一旦应用程序的所有用户可见字符串都经过了恰当的标记，我们必须稍微更改应用程序启动的方式，以便其读取运行区域的翻译后的字符串。\n\n请参 PyQt 的 `pyqt4ref.html`\
  \ 文档，位于“Differences Between PyQt and Qt”章节下。\n\n## 第 17 章 在线帮助与国际化\n\n以下是国际化应用程序的创建方法：\n\
  \n1. 使用 `QObject.tr()` 或 `QApplication.translate()` 为所有用户可见的字符串创建应用程序。\n2. 修改应用程序，在启动时读取其运行区域的特定本地化\
  \ `.qm`（消息）文件（如果可用）。\n3. 创建一个 `.pro` 文件，列出应用程序的 `.ui`（Qt Designer*）文件、其 `.py` 源文件和\
  \ `.pyw` 源文件，以及它将使用的 `.ts`（翻译源）文件。\n4. 运行 `pylupdate4` 创建 `.ts` 文件。\n5. 使用 `Qt Linguist`\
  \ 翻译 `.ts` 文件中的字符串。\n6. 运行 `lrelease` 将更新后的 `.ts` 文件（包含翻译）转换为 `.qm` 文件。\n\n以及维护此类应用程序的方法：\n\
  \n1. 更新应用程序，确保所有用户可见的字符串使用 `QObject.tr()` 或 `QApplication.translate()`。\n2. 有时更新\
  \ `.pro` 文件——例如，添加了新的 `.ui` 或 `.py` 文件。\n3. 运行 `pylupdate4` 用新字符串更新 `.ts` 文件。\n\
  4. 请求翻译人员翻译 `.ts` 文件中的任何新字符串。\n5. 运行 `lrelease` 将 `.ts` 文件转换为 `.qm` 文件。\n\n我们将涵盖上述所有步骤，从使用\
  \ `QObject.tr()` 开始，使用 chap17 目录中翻译版本的 Image Changer 应用程序。\n\n```python\nfileNewAction\
  \ = self.createAction(self.tr(\"&New...\"), self.fileNew, QKeySequence.New, \"filenew\"\
  , self.tr(\"Create an image file\"))\n```\n\n第一个标记为翻译的字符串是菜单选项字符串 New…，第二个是用于工具提示和状态提示的字符串。（\"\
  filenew\" 字符串是去掉 `.png` 后缀的文件名。）\n\n```python\nself.fileMenu = self.menuBar().addMenu(self.tr(\"\
  &File\"))\n```\n\n菜单字符串以及动作字符串都必须翻译。\n\n```python\nself.statusBar().showMessage(self.tr(\"\
  Ready\"), 5000)\n```\n\n在这里我们为用户提供了一个初始状态消息，我们再次必须使用 `tr()`。\n\n翻译作为 `QSettings`\
  \ 键的字符串通常是不合适的，特别是由于这些字符串通常对用户可见。\n\n```python\nreply = QMessageBox.question(self,\n\
  \    self.tr(\"Image Changer - Unsaved Changes\"),\n    self.tr(\"Save unsaved changes?\"\
  ),\n    QMessageBox.Yes|QMessageBox.No|\n    QMessageBox.Cancel)\n```\n\n\n\n\n\
  对于这个对话框，我们已经将窗口标题和消息文本都标记为需要翻译。在这种情况下，我们不需要担心翻译按钮，因为我们使用的是标准按钮，且 Qt 已经为这些按钮提供了翻译。★\
  \ 如果我们使用了自定义文本，我们就必须像处理其他用户可见的字符串一样，对它们使用 `tr()`。\n\n```python\nself.tr(\"Saved\
  \ %1 in file %2\").arg(self.dataname).arg(self.filename)\n```\n\n提供上述字符串的一种方法是编写：\n\
  \n```python\nself.tr(\"Saved %s in file %s\" % (self.dataname, self.filename)) #\
  \ 错误做法\n```\n\n不推荐这样做。请务必使用 `QStrings`，并始终使用 `QString.arg()`；这会让翻译人员的工作变得更容易。（`tr()`\
  \ 方法返回一个 `QString` 对象，因此我们可以在其返回值上调用任何 `QString` 方法，例如 `arg()`。）例如，在某些语言中，翻译将表述为“Saved\
  \ in file %2 the data %1”。\n\n使用带有 `arg()` 的 `QString` 这没有问题，因为翻译人员可以更改字符串中 `% *n`\
  \ 的顺序，`arg()` 方法会遵循这一顺序。但将一个 Python 字符串的 `%s` 替换为另一个也不会产生任何变化。\n\n在硬编码的 `.pyw` 和\
  \ `.py` 文件中，我们必须对每个用户可见的字符串使用 `tr()`。\n\n但对于通过 `pyuic4` 从 `.ui` 文件生成的 `.py` 文件，我们不需要做任何事情，因为\
  \ `pyuic4` 会自动对所有字符串使用 `QApplication.translate()`。\n\n即使对于未翻译的应用程序也有效，因为如果没有合适的翻译，将会使用原始语言——例如英语。\n\
  \nPyQt 通常会使用 PyQt 内置的对话框；例如，文件打开对话框或文件打印对话框。这些也必须经过翻译，尽管对于某些语言，Trolltech 提供的 `.qm`\
  \ 文件中已经有了翻译。\n\n在整个过程中使用了 `tr()`，并且找到了合适的 Qt 翻译后，我们已经准备好修改应用程序的启动代码，以便在存在相应的翻译文件时加载它们。\n\
  \n```python\napp = QApplication(sys.argv)\nlocale = QLocale.system().name()\nqtTranslator\
  \ = QTranslator()\nif qtTranslator.load(\"qt_\" + locale, \":/\"):\n    app.installTranslator(qtTranslator)\n\
  ```\n\n★Trolltech 为某些语言（如法语和德语）提供了翻译，并对其他各种语言提供了一些不支持的翻译。这些翻译位于 Qt（而非 PyQt）的翻译目录中；例如在文件系统中搜索\
  \ `qt_fr.qm` 即可找到法语翻译。\n\n*第 17 章 在线帮助与国际化*\n\n```python\nappTranslator = QTranslator()\n\
  if appTranslator.load(\"imagechanger_\" + locale, \":/\"):\n    app.installTranslator(appTranslator)\n\
  \napp.setOrganizationName(\"Qtrac Ltd.\")\napp.setOrganizationDomain(\"qtrac.eu\"\
  )\napp.setApplicationName(app.translate(\"main\", \"Image Changer\"))\napp.setWindowIcon(QIcon(\"\
  :/icon.png\"))\n\nform = MainWindow()\nform.show()\napp.exec_()\n```\n\n`QLocale.system().name()`\
  \ 调用将返回类似于“en_US”（英语，美国）或“fr_CA”（法语，加拿大）等字符串。`QTranslator.load()` 方法接收一个文件名主体和一个路径。在这种情况下，我们提供了路径\
  \ `:/`，它是应用程序的资源文件。如果 locale 为“fr_CA”，则文件名主体将是 `qt_fr_CA` 和 `imagechanger_fr_CA`。根据这些名称，PyQt\
  \ 将查找 `qt_fr_CA.qm`，如果找不到，则查找 `qt_fr.qm`，`imagechanger` 亦然。\n\n\n\n\n```\nC:\\>cd\
  \ c:\\pyqt\\chap17\nC:\\pyqt\\chap17>pylupdate4 *.py *.pyw -ts imagechanger_fr.ts\n\
  ```\n\n# 国际化\n\n从现在起，我们可以简单带有 `-t`（翻译）选项运行 `mkpyqt.py`，或者运行 `Make PyQt` 并勾选 `Translate`\
  \ 复选框。开启翻译后，这两个工具都会先运行 `pylupdate4`，然后运行 `lrelease`。\n\n剩下的主要工作就是翻译本身。为此，我们可以给翻译人员\
  \ `Qt Linguist` 应用程序——它用 `C++/Qt` 编写并运行在 Windows、Mac OS X 和 Linux 上——并提供 `.ts` 文件，让他们他们输入字符串的翻译。`Qt\
  \ Linguist` （如图 17.2 所示）非常易用，并通过建议以前翻译过的相似短语来帮助尽地减少重复。它根据上下文（通常是窗口类名）对翻译字符串分组。当一个字符串根据其出现的不同表单需要不同的翻译方式时，这非常有用。\n\
  \n要开始使用 `Qt Linguist`，运行它，点击 `File→Open` 并打开一个 `.ts` 文件。\n\n现在点击左侧 `Context` 停靠窗口中的一个\
  \ `+` 符号来显示上下文中的字符串，然后点击其中一个字符串。字符串将出现在右上面板“Source text”（源文本）标题下。点击“Translation”（翻译）标题下并输入翻译。要确认字符串翻译已完成，点击\
  \ `Context` 停靠窗口中相关字符串旁边的问号图标：点击该图标会在问号和勾钩之间切换。打上勾号的翻译被视为“已完成”的，并将由 `lrelease` 放入\
  \ `.qm` 文件中。\n\n## 总结\n\n使用 `QTextBrowser` 或 `QDesktopServices.openUrl()` 创建基于 HTML\
  \ 的在线帮助系统是直接的，而创建一个使用 `Qt Assistant` 的系统设置起来则更复杂。但无论我们采取哪种方法提供在线帮助，真正的挑战在于在线帮助文档本身的设计和内容。\n\
  \n设置一个用于翻译的应用程序非常简单。通常使用 `.pro` 文件来列出 `.ts` 文件以及包含用户可见字符串的 `.ui`、`.py` 和 `.pyw`\
  \ 文件，我们必须使用 `pylupdate4` 和 `lrelease` 来保持 `.ts` 文件为更新并生成 `.qm` 文件。我们可以通过生成初始 `.ts`\
  \ 文件然后使用 `mkpyqt.py` 或 `Make PyQt` 来避免使用 `.pro` 文件。\n\n在代码方面，我们必须确保每个用户可见字符串都使用\
  \ `QObject.tr()` 或 `QApplication.translate()`。具有可替换参数的字符串应始终使用带有编号 `% n` 参数的 `QString.arg()`，而不是\
  \ Python 的 `%` 运算符。\n\n对于数字我们可能需要使用 `%L n` 来获取正确的千分位和小进制分隔符。对于货币符号，我们可以使用一种技巧是这样的：\n\
  \n```python\ncurrency = QApplication.translate(\"Currency\", \"$\")\n```\n\n并将“$”翻译为“€”、“£”、“¥”或其他任何合适的符号。对于日期，我们可以使用\
  \ `QDate.toString(Qt.SystemLocaleDate)` 或 `QDate.toString(Qt.ISODate)`。\n\n对于测量单位，最好提供一个合理的默认值让用户可以通过配置对话框进行更改，或者设置一个“首次运行”对话框，让用户选择他们的单位、默认纸张大小等。\n\
  \n## 练习\n\n如果你精通多种语言，请选择示例或练习中的一个，或者你自己的一个 PyQt ，将其翻译成你的第二语言。\n\n如果你只精通一种语言，请选择示例或练习中的一个，或者你自己的一个\
  \ PyQt ，为其添加在线帮助，包括工具提示和状态提示，以及 HTML 帮助文件。\n\n不提供解决方案。\n\n---\n\n## 创建 TCPClient\n\
  \n创建 TCP 服务器\n\n# 网络编程\n\nPython 标准库有许多提供网络设施的模块。我们在第 4 章中看到过一个标准库网络函数的示例，当时我们使用\
  \ `urllib2.urlopen()` 为互联网上的文件提供了一个“文件句柄”，然后我们使用 `for line in fh:` 惯用法逐行读取该文件。\n\
  \n也可以直接从互联网上“抓取”整个文件：\n\n```python\nsource = \"http://www.amk.ca/files/python/crypto/\"\
  \ + \\\n\"pycrypto-2.0.1.tar.gz\"\ntarget = source[source.rfind(\"/\") + 1:]\nname,\
  \ message = urllib.urlretrieve(source, target)\n```\n\n`name` 保存源保存时的名称；在这种情况下它将与\
  \ `target` 相同，但如果没有指定 `target`，它将是一个生成的名称——例如 `/tmp/tmpX-R8z.tar.gz`。对于 HTTP 下载，`message`\
  \ 是一个 `httplib.HTTPMessage` 实例，包含了相关的 HTTP 请求头。\n\nPython 的 `urllib` 和 `urllib2`\
  \ 标准库模块非常通用。它们可以使用 `FTP` 和 `HTTP` 协议（后者使用 `GET` 或 `POST`），并且它们可以使用 HTTP 代理。`urllib2`\
  \ 模块支持基础认证并可用于设置 HTTP 请求头。如果安装 Python 时带有 SSL 支持，`urllib2` 模块就可以使用 `HTTPS` 协议。标准库还包括对许多其他协议的支持，包括\
  \ `IMAP`、`POP3` 以及用于邮件的 `SMTP`、`CGI` 和 `XML-RPC`。大部分网络支持基于 `socket` 模块，该模块可直接用于底层网络编程。除了标准库，PyQt\
  \ 提供了自己的 set 网络类，包括 `QFtp`（客户端 FTP 支持）和 `QHttp`（HTTP 支持）。底层网络可以使用 `QAbstractSocket`\
  \ 的子类：`QTcpSocket`、`QTcpServer` 和 `QUdpSocket`，以及从 Qt 4.3 开始的 `QSslSocket`。\n\n\
  ## 介绍\n\nPython 网络支持也可以在第三方库中找到，最著名的是 Twisted 网络框架；更多细节请参阅 [`twistedmatrix.com`](http://twistedmatrix.com)。\n\
  \n在本章中，我们只关注创建一个简单的客户端/服务器应用程序，我们将使用 PyQt 的两个类创建客户端和服务器：`QTcpSocket` 和 `QTcpServer`。在下一章中，我们将查看能够处理多个请求的多线程服务器。\n\
  \n客户端/服务器应用程序通常实现为两个程序：一个等待并响应请求的服务器，以及一个或多个发送请求并读取服务器响应的客户端。为了让其工作，客户端必须知道连接到哪里，即服务器的\
  \ IP 地址和端口号。此外，客户端和服务器必须使用约定的 socket 协议发送接收数据，并使用它们都能理解的数据格式。\n\nPyQt 提供两种不同的 socket。UDP（用户数据协议）由\
  \ `QUdpSocket` 类支持。UDP 轻量级但不可靠——不保证数据到达。UDP 是无连接的，因此数据作为离散的项目发送或接收。TCP（传输控制协议）由\
  \ `QTcpSocket` 类支持。TCP 是可靠的面向连接和面向流的协议；可以发送和接收任意的数据——socket 负责将数据拆分成足够发送的小块，并在另一端重组数据。\n\
  \nUDP 通常用于监控连续读数的仪器，且偶尔丢失一次读数并不重要。客户端/服务器应用程序通常使用 TCP，因为它们需要可靠性；这就是本章将使用的协议。\n\n\
  \n\n\n另一个必须做出的决定是以文本的形式发送和接收数据，还是以二进制数据块的形式。`PyQt` 的 TCP 套接可以使用这两种方法之一，但我们选择处理二进制数据，因为这样最通用且最易于处理。\n\
  \n我们将使用的示例是“建筑服务”（Building Services）应用程序。服务器持有建筑中房间的详细信息以及它们的预订日期。客户端用于为特定日期预订或取消特定房间。可以使用任意数量的客户端，但如果两个客户端的请求`exactly`\
  \ 同时到达，其中一个将会被阻塞，直到另一个请求被处理完毕。这个问题可以通过使用多线程服务器来缓解，正如我们在下一节中看到的。\n\n为了示例起见，我们将在同一台机器上运行服务器和客户端；这意味着我们可以使用“localhost”作为\
  \ IP 地址。图 18.1 显示了服务器和两个客户端。我们还选择了端口号 `9 407` ——这只是一个随机数字。端口号应该大于 `1 023`，通常在 `5\
  \ 001` 到 `32 767` 之间，尽管高达 `65 535` 的端口号也是有效的。\n\n![Image 82](img/index-538_1.jpg)\n\
  \n**图 18.1** 带有两个客户端的服务器\n\n服务器可以接受两种请求，“BOOK”和“UNBOOK”，并可以产生三种响应，“BOOK”、“UNBOOK”和“ERROR”。所有的请求和响应都以二进制数据的形式发送和接收；我们将在接后的章节中查看它们的格式。\n\
  \n除了 `PORT` 变量中持有的端口号外，我们还创建了 `SIZEOF_UINT16` 变量并将其设置为 `2`（意味着两个字节）。除了常规导入外，我们必须导入\
  \ `QtNetwork` 模块：\n\n```python\nfrom PyQt4.QtNetwork import *\n```\n\n相同的 `PORT`\
  \ 和 `SIZEOF_UINT16` 变量，以及相同的 `QtNetwork` 导入都被用于客户端和服务器应用程序中。在接下来的节中，我们将查看客户端的实现，在第二节中回顾服务器。\n\
  \n### 创建 TCP 客户端\n\n建筑服务客户端位于 `chap18/buildingservicesclient.pyw`。它允许用户输入房间号（仅接受有效的房间号）和日期，并请求在该日期预订（或取消预订）该房间。服务器对请求做出响应，客户端将响应显示在响应标签中供用户阅读。\n\
  \n我们将从查看初始化开始，但省略组件和布局的创建。我们将分三个部分来看它，然后查看客户端的方法。\n\n```python\nclass BuildingServicesClient(QWidget):\n\
  \    def __init__(self, parent=None):\n        super(BuildingServicesClient, self).__init__(parent)\n\
  \        self.socket = QTcpSocket()\n        self.nextBlockSize = 0\n        self.request\
  \ = None\n```\n\n我们继承了 `QWidget` 而不是 `QDialog` 或 `QMainWindow`。唯一的明显区别是，如果我们继承了\
  \ `QDialog`，按下 Esc 键将终止应用程序。\n\n我们有三个对象需要存储。第一个是客户端用于与服务器通信的 `socket`。第二个是“下一个块大小”（next\
  \ block size）；这是一个我们用来判断是否已收到足够的响应数据以处理响应的变量。第三个是 `request` 对象；这是一个包含请求数据的 `QByteArray`，如果没有数据要发送，则为\
  \ `None`。\n\n我们将跳过组件的创建、设置和布局，因为到目前为止这些内容应该大家都熟悉了，尽管我们在查看套接字连接后还会查看组件的连接。\n\n```python\n\
  self.connect(self.socket, SIGNAL(\"connected()\"), self.sendRequest)\nself.connect(self.socket,\
  \ SIGNAL(\"readyRead()\"), self.readResponse)\nself.connect(self.socket, SIGNAL(\"\
  disconnected()\"), self.serverHasStopped)\nself.connect(self.socket, SIGNAL(\"error(QAbstractSocket::SocketError)\"\
  ), self.serverHasError)\n```\n\n前四个信号与套接字有关。我们需要知道连接何时建立，因为在那个点我们就可以发送请求数据。\n\n\
  我们还需要知道套接字是否有数据可读，因为当有数据时，它将包含我们想要读取的服务器响应。如果连接终止——例如，因为服务器已关闭或发生了错误——我们希望知道，以便告知用户。\n\
  \n```python\nself.connect(self.roomEdit, SIGNAL(\"textEdited(QString)\"), self.updateUi)\n\
  self.connect(self.dateEdit, SIGNAL(\"dateChanged(QDate)\"), self.updateUi)\nself.connect(self.bookButton,\
  \ SIGNAL(\"clicked()\"), self.book)\nself.connect(self.unBookButton, SIGNAL(\"clicked()\"\
  ), self.unBook)\nself.connect(quitButton, SIGNAL(\"clicked()\"), self.close)\n```\n\
  \n其他连接与用户界面有关。和通常一样，我们有一个 `updateUi()` 方法来执行验证并根据情况启用/禁用按钮。我们还有预订、取消房间以及终止应用程序的连接。\n\
  \n```python\ndef updateUi(self):\n    enabled = False\n    if not self.roomEdit.text().isEmpty()\
  \ and \\\n    self.dateEdit.date() > QDate.currentDate():\n        enabled = True\n\
  \    if self.request is not None:\n        enabled = False\n    self.bookButton.setEnabled(enabled)\n\
  \    self.unBookButton.setEnabled(enabled)\n```\n\n如果用户点击 Book，就会调用 `book()` 方法。该方法简单地调用\
  \ `issueRequest()`，传入请求动作“BOOK”、房间号（作为 `QString`）和日期。`unBook()` 方法几乎相同，区别在于它的请求动作是“UNBOOK”。\n\
  \n```python\ndef book(self):\n    self.issueRequest(QString(\"BOOK\"), self.roomEdit.text(),\
  \ self.dateEdit.date())\n\ndef unBook(self):\n    self.issueRequest(QString(\"UNBOOK\"\
  ), self.roomEdit.text(), self.dateEdit.date())\n```\n\n此方法用于准备 `request` `QByteArray`\
  \ 并启动将请求发送到服务器的过程。\n\n```python\ndef issueRequest(self, action, room, date):\n \
  \   self.request = QByteArray()\n    stream = QDataStream(self.request, QIODevice.WriteOnly)\n\
  \    stream.setVersion(QDataStream.Qt_4_2)\n    stream.writeUInt16(0)\n    stream\
  \ << action << room << date\n    stream.device().seek(0)\n    stream.writeUInt16(self.request.size()\
  \ - SIZEOF_UINT16)\n```\n\n如果应用程序终止，我们确保关闭 `socket` 并接受关闭事件。我们并不真的必须做这些事情，但通过这样做这些，我们展示了已经考虑过终止时应该做什么。\n\
  \n```python\ndef closeEvent(self, event):\n    self.socket.close()\n    event.accept()\n\
  ```\n\n```python\nif self.socket.isOpen():\n    self.socket.close()\nself.responseLabel.setText(\"\
  Connecting to server...\")\nself.socket.connectToHost(\"localhost\", PORT)\n```\n\
  \n图 18.2 显示了写入 `request` `QByteArray` 的数据。`QByteArray` 可以像任何其他 `QIODevice` 一样被读取和写入。前两个字节包含一个无符号整数，初始值为\
  \ `0`。该整数用于存储请求占据的字节数（不包括整数本身的大小），即紧随其后的字节数。我们必须先将其设置为 `0`，因为我们不知道将使用多少字节。\n\n-\
  \ `uint`\n- `QString`\n- `QString`\n- `16`\n- `QDate`\n\n\n\n\n在写入整数大小后，我们写入数据。操作字符串是请求操作（“BOOK”或“UNBOOK”），房间字符串持有房间号（例如，“213”），而日期则包含一个\
  \ `QDate`。一旦数据被写入字节数组，我们就使用 `seek()` 将写入位置移动到开头，这样我们下次写入的内容将覆盖 `QByteArray` 的开头。（我们实际上是在\
  \ `QDataStream` 的底层 `QIODevice` 上执行 `seek` 操作，该设备是通过调用 `QDataStream.device()` 获取的。）我们写入一个无符号\
  \ 16 位整数，其值为 `QByteArray` 的长度减去初始整数的大小。请求字节数组现在已准备好发送了。\n\n我们更新用户界面——这将禁用 `Book`（预订）和\
  \ `Unbook`（取消预订）按钮，因为请求对象不为 `None`；这样做是为了防止用户在收到响应之前发出额外的请求。然后，我们确保套接字已关闭，因为它可能为了处理之前的请求而打开，并设置响应标签以告知用户我们正在尝试建立连接。\n\
  \n最后，我们调用 `connectToHost()`。IP 地址可以以点分字符串（例如，“82.94.237.218”）、主机名（例如，“www.python.org”）或\
  \ `QHostAddress` 对象的形式给出。得益于我们在初始化器中建立的信号与槽连接，我们知道一旦连接建立，我们的 `sendRequest()` 方法就会调用，除非连接失败，在这种情况下将改为调用\
  \ `serverHasStopped()` 或 `serverHasError()` 方法。\n\n```python\ndef sendRequest(self):\n\
  \    self.responseLabel.setText(\"Sending request...\")\n    self.nextBlockSize\
  \ = 0\n    self.socket.write(self.request)\n    self.request = None\n```\n\n一旦连接建立，该方法就会被调用。它更新响应标签告知用户请求已发送，并将下一个块大小设置为\
  \ 0。这与我们希望收到的响应有关；我们将在 `readResponse()` 方法中看到它。它将请求字节数组写入套接字。一旦写入完成，请求被设置为 `None`，准备好进行新的请求。\n\
  \n### 创建 TCP 客户端\n\n527\n\n如果没有发生错误且服务器没有终止，服务器将做出响应，此时会调用 `readResponse()` 方法。\n\
  \n（否则，将调用 `serverHasStopped()` 或 `serverHasError()` 方法。）\n\n`uint`\n`QString`\n\
  `QString`\n`16`\n`QDate`\n\n### 成功响应\n\n`uint`\n`QString`\n`QString`\n\n### 错误响应\n\
  \n`16`\n\n**图 18.3** 响应格式\n\n服务器有两种响应格式，如图 18.3 所示。收到响应时，我们必须从读取其大小开始。然后，一旦知道有足够的字节可以读取，我们就读取第一个\
  \ `QString`。如果它包含“ERROR”，我们就知道是一个错误响应，只需读取包含错误信息的第二个字符串；否则，文本将是“BOOK”或“UNBOOK”，即请求操作、第二个\
  \ `QString` 中的详情以及日期 `QDate`，确认请求操作成功。\n\n```python\ndef readResponse(self):\n \
  \   stream = QDataStream(self.socket)\n    stream.setVersion(QDataStream.Qt_4_2)\n\
  \    while True:\n        if self.nextBlockSize == 0:\n            if self.socket.bytesAvailable()\
  \ < SIZEOF_UINT16:\n                break\n            self.nextBlockSize = stream.readUInt16()\n\
  \        if self.socket.bytesAvailable() < self.nextBlockSize:\n            break\n\
  \        action = QString()\n        room = QString()\n        date = QDate()\n\
  \        stream >> action >> room\n        if action != \"ERROR\":\n           \
  \ stream >> date\n        if action == \"ERROR\":\n            msg = QString(\"\
  Error: %1\").arg(room)\n        elif action == \"BOOK\":\n            msg = QString(\"\
  Booked room %1 for %2\").arg(room) \\\n            .arg(date.toString(Qt.ISODate))\n\
  \        elif action == \"UNBOOK\":\n            msg = QString(\"Unbooked room %1\
  \ for %2\").arg(room) \\\n            .arg(date.toString(Qt.ISODate))\n```\n\n528\n\
  \n### 第 18 章 网络\n\n`self.responseLabel.setText(msg)`\n`self.updateUi()`\n`self.nextBlockSize\
  \ = 0`\n\n服务器的响应可能会分段返回。由于这个原因，我们使用无限循环，首先获取字节计数，然后确保有足够数量的字节可以读取。这把与服务器缓冲的责任留了下来，并且意味着当我们读取时，知道可以一次性读取完整的响应。\n\
  \n如果至少有两个字节可用，我们就将其作为无符号 16 位整数读取：这为我们提供了后续的字节数。然后我们测试是否有足够的字节可以读取：如果没有，我们就退出循环并等待另一个\
  \ `readyRead()` 信号导致 `readResponse()` 方法调用。如果有足够的字节，我们就读取操作以及随后的字符串——这是房间号或错误信息。如果操作不是“ERROR”，我们还会读取日期。然后，根据收到的操作，我们准备一个消息字符串并显示在响应标签中。\n\
  \n读取完整个响应后，我们重置块大小，因为可能还有响应，在这种情况下 `socket.bytesAvailable()` 将返回大于零的值。如果服务器终止或服务器响应网络错误，将调用相应的\
  \ `serverHas*()` 方法。\n\n```python\ndef serverHasStopped(self):\n    self.responseLabel.setText(\"\
  Connection closed by server\")\n    self.socket.close()\n\ndef serverHasError(self,\
  \ error):\n    self.responseLabel.setText(QString(\"Error: %1\") \\\n    .arg(self.socket.errorString()))\n\
  \    self.socket.close()\n```\n\n在两种情况下，我们都会向用户显示错误信息并关闭套接字。\n\n### 创建 TCP 服务器\n\
  \n529\n\n物业服务 TCP 服务器位于 `chap18/buildingservicerver.pyw` 中。它包含三个组件：一个持有服务器实例并为用户提供终止服务器简便方法的\
  \ GUI；一个实例化以提供服务器实例的 `TcpServer` 子类；以及一个用于处理传入连接的 `TcpSocket` 子类。我们将先查看前两个，因为它们很短，然后重点关注执行大部分工作的\
  \ `TcpSocket` 子类。\n\n```python\nclass BuildingServicesDlg(QPushButton):\n    def\
  \ __init__(self, parent=None):\n        super(BuildingServicesDlg, self).__init__(\n\
  \"&Close Server\", parent)\n        self.setWindowFlags(Qt.WindowStaysOnTopHint)\n\
  \        self.loadBookings()\n        self.tcpServer = TcpServer(self)\n       \
  \ if not self.tcpServer.listen(QHostAddress(\"0.0.0.0\"), PORT):\n            QMessageBox.critical(self,\
  \ \"Building Services Server\", QString(\"Failed to start server: %1\") \\\n.arg(self.tcpServer.errorString()))\n\
  \            self.close()\n            return\n        self.connect(self, SIGNAL(\"\
  clicked()\"), self.close)\n```\n\n为了换换口味，并提醒我们任何 PyQt 控件都可以是顶层窗口，我们将对话框变成了 `QPushButton`\
  \ 子类。我们还设置了 `Qt.WindowStaysOnTopHint`；大多数窗口系统都会尊重该提示，并将控件保持在所有其他窗口之上。\n\n我们不会涵盖\
  \ `loadBookings()` 方法；它被用于填充存储预订数据的内存数据结构，即 `Bookings` 默认字典。\n\n\n\n\n字典的键是存储为 `datetime.date`\
  \ 对象的日期，而值是存储为 unicode 字符串的房间号有序列表。默认的 `defaultdict`-Python 字典是在 Python 2.5 中引入的。它们与普通字典相似，不同之处在于\
  \ `2.5` 版本中当我们使用字典中不存在的键时，该键将以一个默认值插入。使用什么默认值取决于我们如何创建字典。在 Building Services 服务器中，我们是这样创建字典的：\n\
  \n```python\nBookings = collections.defaultdict(list)\n```\n\n在这里，我们规定任何新键的默认值是一个空列表；在其他情况下，我们可能会选择一个空集合。我们始终可以用普通字典替换默认字典——例如，在比\
  \ 2.5 旧的 Python 版本中——通过在访问可能不存在的键时使用 `dict.setdefault()` 方法，正如稍后会看到的。\n\n我们将很快回顾\
  \ `TcpServer` 类。一旦创建了服务器，我们就告诉它在给定的 IP 地址和端口号上监听传入的连接。IP 地址被指定为 `QHostAddress`，特殊地址为“0.0.0.0”，意味着“所有网络接口”；端口号与我们在客户端使用的任意端口\
  \ 9407 相同。\n\n连接确保了如果用户点击按钮，窗口将会关闭。\n\n我们没有对 TCP 服务器进行任何特殊的清理；当它被销毁时，任何连接的客户端将收到通知，它们的它们的\
  \ `disconnected()` 信号将发射。\n\n对话框部分没有内容了，我们现在可以查看继承 `QTcpServer` 的小型 `TcpServer`\
  \ 类。\n\n```python\nclass TcpServer(QTcpServer):\n    def __init__(self, parent=None):\n\
  \        super(TcpServer, self).__init__(parent)\n\n    def incomingConnection(self,\
  \ socketId):\n        socket = Socket(self)\n        socket.setSocketDescriptor(socketId)\n\
  ```\n\n这是 TCP 服务器的完整代码。每当发生传入的连接请求时，就会调用 `incomingConnection()` 方法并传入 `socketId`\
  \ 中的套接描述符。我们只需创建一个新的 `Socket`（我们将稍后回顾的 `QTcpSocket` 子类），并设置它使用服务器提供的套接描述符。\n\n此\
  \ TCP 服务器依赖于 PyQt 事件循环。如果我们想创建一个不带 GUI 的基于 `QTcpServer` 的服务器，有两种方法可以采用。一种方法是使用 `QEventLoop`\
  \ 在不需要 GUI 的情况下提供一个事件循环，并按照我们在这里所的方式编写代码。另一种方法是不使用事件循环，但在这种情况下我们必须稍微不同的方式处理。特别是，我们必须使用阻塞的\
  \ `QTcpServer.waitForNewConnection()` 方法，而不是重新实现 `incomingConnection()`。当然，如果服务器没有\
  \ GUI，可以完全使用 Python 的标准库来编写，而完全不需要 `QtNetwork` 模块。或者，可以使用 Twisted 编写服务器。\n\n一旦建立连接，所有工作都将交给\
  \ `Socket` 类，这是一个 `QTcpSocket` 子类，我们现在将回顾它。\n\n```python\nclass Socket(QTcpSocket):\n\
  \    def __init__(self, parent=None):\n        super(Socket, self).__init__(parent)\n\
  \        self.connect(self, SIGNAL(\"readyRead()\"), self.readRequest)\n       \
  \ self.connect(self, SIGNAL(\"disconnected()\"), self.deleteLater)\n        self.nextBlockSize\
  \ = 0\n```\n\n套接字将其 `readyRead()` 信号连接到我们自定义的 `readRequest()` 方法，将其 `disconnected()`\
  \ 信号连接到它的 `deleteLater()` 槽——这确保了在连接终止时套接字被干净地删除。`nextBlockSize` 变量的用途与客户端中相同且方式相同，以确保只有当可用读取的字节数至少等于请求中的字节数时，我们才读取请求。\n\
  \n一旦创建了套接字并设置了连接，它将一直等待 `readRequest()` 方法被调用。这个方法有点长，我们将分两部分回顾它。\n\n```python\n\
  def readRequest(self):\n    stream = QDataStream(self)\n    stream.setVersion(QDataStream.Qt_4_2)\n\
  \    if self.nextBlockSize == 0:\n        if self.bytesAvailable() < SIZEOF_UINT16:\n\
  \            return\n        self.nextBlockSize = stream.readUInt16()\n\n    if\
  \ self.bytesAvailable() < self.nextBlockSize:\n        return\n\n    action = QString()\n\
  \    room = QString()\n    date = QDate()\n```\n\n我们首先检查是否有至少两个字节可以读取：如果有，我们读取下一个块的大小。如果没有两个字节可以读取，或者虽然有两个字节但没有足够的字节来读取整个请求，我们就返回并等待\
  \ `readRequest()` 再次被调用，此时更多字节已经到达。\n\n一旦字节足够，我们就创建空的 `action` 和 `room` 字符串以及一个空的\
  \ `QDate`，准备好从传入的请求数据中填充它们。\n\n```python\n    stream >> action\n\n    if action\
  \ in (\"BOOK\", \"UNBOOK\"):\n        stream >> room >> date\n        bookings =\
  \ Bookings.get(date.toPyDate())\n        uroom = unicode(room)\n        if action\
  \ == \"BOOK\":\n            if bookings is None:\n                bookings = Bookings[date.toPyDate()]\n\
  \            if len(bookings) < MAX_BOOKINGS_PER_DAY:\n                if uroom\
  \ in bookings:\n                    self.sendError(\"duplicate booking\")\n    \
  \            else:\n                    bisect.insort(bookings, uroom)\n       \
  \     self.sendReply(action, date)\n            else:\n                self.sendError(QString(\"\
  %1 is fully booked\").arg(date.toString(Qt.ISODate)))\n        elif action == \"\
  UNBOOK\":\n            if bookings is None or uroom not in bookings:\n         \
  \       self.sendError(\"Cannot unbook booking\")\n            else:\n         \
  \       bookings.remove(uroom)\n                self.sendReply(action, date)\n \
  \       else:\n            self.sendError(\"Unrecognized request\")\n```\n\n服务器识别请求动作，“BOOK”和“UNBOOK”；如果获取到其中一个，它读取房间和日期，并获取该日期的（可能的）预订列表。它还存储了房间号的\
  \ unicode 拷贝，因为服务器使用的 `Bookings` 字典使用的是 Python 类型而非 PyQt 类型。\n\n接下来，服务器对给定日期预订或取消给定房间。\n\
  \n预订时，如果该日期没有预订，将为该日期创建一个空预订列表。这样做是因为我们使用了默认字典，所以当我们访问它不存在的键时，它会自动插入一个带有该键的默认值；在这种情况下是空列表。我们这样做是为了避免在取消预订时为该日期创建一个空列表。只有当我们知道动作是预订时，我们才想确保该日期有一个列表。\n\
  \n如果我们使用普通字典，我们必须使用 `dict.setdefault()` 来获取该日期的列表，如果键不存在，则创建一个以该日期为键、空列表为值的新项。\n\
  \n例如：\n\n```python\nbookings = Bookings.setdefault(date.toPyDate(), [])\n```\n\n\
  `QDate.toPyDate()` 方法是在 PyQt 4.1 中引入的；对于早期版本，我们必须通过编写 `datetime.date(date.year(),\
  \ date.month(), date.day())` 手动进行转换。\n\n一旦我们有了（可能的）预订列表，并且预订数量少于允许的最大数量（`MAX_BOOKINGS_PER_DAY`，其值为\
  \ 5），房间号字符串将按顺序插入列表，并向客户端发送回复，简单地回显请求数据。如果房间在给定日期已被预订，或者该日期已达到最大预订数，则向客户端发送错误回复。\n\
  \n如果动作是取消预订，则从该日期的预订中移除该房间并将动作回显给客户端；或者如果预订根本不存在，则给出错误回复。尽管房间是按顺序存储的，\n\n\n\n\n\
  我们简单地使用了 `not in` 和 `list.remove()`，它们都将执行线性搜索；对于更长的列表，我们会使用 `bisect.bisect_left()`\
  \ 通过二分查找来寻找房间，但在本示例中这似乎大材小用了。\n\n如果请求的操作无法被识别，我们只需回复一条错误消息。\n\n```python\ndef sendReply(self,\
  \ action, room, date):\n    reply = QByteArray()\n    stream = QDataStream(reply,\
  \ QIODevice.WriteOnly)\n    stream.setVersion(QDataStream.Qt_4_2)\n    stream.writeUInt16(0)\n\
  \    stream << action << room << date\n    stream.device().seek(0)\n    stream.writeUInt16(reply.size()\
  \ - SIZEOF_UINT16)\n    self.write(reply)\n```\n\n发送给客户端的回复创建方式与客户端请求创建的方式相同。我们使用\
  \ `QDataStream` 向 `QByteArray` 写入数据，首先写入一个无符号 16 位整数，最后用回复的大小覆盖该整数，然后将回复写入套接字。\n\
  \n```python\ndef sendError(self, msg):\n    reply = QByteArray()\n    stream = QDataStream(reply,\
  \ QIODevice.WriteOnly)\n    stream.setVersion(QDataStream.Qt_4_2)\n    stream.writeUInt16(0)\n\
  \    stream << QString(\"ERROR\") << QString(msg)\n    stream.device().seek(0)\n\
  \    stream.writeUInt16(reply.size() - SIZEOF_UINT16)\n    self.write(reply)\n```\n\
  \n发送错误回复的代码与发送成功回复的代码几乎相同，可以说我们本可以用一个方法处理这两种情况。\n\n通过向 `readRequest()` 中添加更多的 `if`\
  \ 语句，可以轻松扩展服务器以处理更多请求类型。例如，客户端可能想知道某一天哪些房间被预订，或者某个房间在哪些日期被预订。\n\n尽管我们使用了字典来存储服务器数据，但没有理由服务器不能将数据存储在进程内的\
  \ `SQLite` 数据库中、进程外数据库中或文件中。服务器也不需要 GUI；它可以不包含 `QWidgets`，只需作为 Linux 守护进程或 Windows\
  \ 服务在后台运行。\n\n534\n*第 18 章 网络*\n\n## 总结\n\nPython 标准库、`Twisted` 网络引擎以及 `PyQt` `QtNetwork`\
  \ 模块为网络提供了大量的支持，从底层套接字到包括 `FTP` 和 `HTTP` 在内的各种高层协议。\n\n编写客户端/服务器应用程序必须确保客户端和服务器程序能够通信。这意味着服务器必须运行在已知\
  \ IP 地址上并在特定的端口地址上监听。客户端和服务器必须使用约定的协议（如 `UDP` 或更常见的 `TCP`）进行通信。它们还必须约定如何传输数据，是文本行还是二进制数据块——在这两种情况下，它们都必须知道每个请求和响应遵循的格式。\n\
  \n本章展示的场景非常常见：服务器等待请求，客户端发送请求并读取服务器的响应。在客户端进行通信之前，它必须建立连接，一旦连接建立，它就可以发送数据。服务器可能会返回数据，也可能发生了某些问题。如果接收到数据，我们必须确保不会尝试读取超过可用字节数（或行）。\n\
  \n`PyQt` 的 `QTcpServer` 和 `QTcpSocket` 类使得实现服务器变得非常简单。虽然可以读写文本数据行，但使用二进制数据要通用得多，它允许我们发送和接收任何类型的数据，而无需编写解析器。\n\
  \n我们实现的 `TCP` 服务器存在一个理论问题：它是单线程的。这意味着如果多个请求同时到达，它可能必须阻塞以一次处理一个请求。这可以通过使用线程服务器来解决，正如我们在下一章中看到的。。\n\
  \n## 练习\n\n修改建筑服务（Building Services）服务器，使其接受一个新的请求操作 `BOOKINGSONDATE`。当接收到此类请求请求时，它应该忽略房间，转而检索给定日期的预订情况。如果没有预订，服务器应发送错误回复。否则，它的回复不应是单个房间字符串，而是一个包含逗号和空格分隔的房间号的字符串，如图\
  \ 18.4 所示。\n\n修改建筑服务客户端，使其有一个 `Bookings on Date?`（日期预订情况？）按钮，该按钮连接到一个发布合适请求的方法。客户端的\
  \ `readResponse()` 方法需要稍微修改，以便它可以读取服务器对新请求的响应。\n\n提供“按日期预订”所需的修改非常直接。为了增加挑战性，修改建筑服务服务器以接受另一个新请求操作\
  \ `BOOKINGSFORROOM`。当接收到这些请求之一时，它应该忽略日期，转而遍历所有预订，累加给定房间被预订的日期列表。如果没有预订，它应返回错误回复。否则，与其使用\
  \ `sendReply()` 方法，它应该发送自己的字节数组，包含长度、操作、房间字符串，以及一个包含列表日期数量的 32 位整数，随后是每个日期。由于日期是以\
  \ `datetime.date` 对象存储的，必须将其转换为 `QDates` 以便流写入 `QByteArray`。\n\n必须修改建筑服务客户端以提供 `Bookings\
  \ for Room?`（按房间预订？）按钮，连接到一个发布合适请求的方法。客户端的 `readResponse()` 方法需要修改，以便如果接收到 `BOOKINGSFORROOM`\
  \ 响应，它可以读取日期并创建一个用于客户端用户界面显示的合适字符串，如图 18.5 所示。\n\n服务器的修改可以通过添加约 30 行代码完成，客户端可以通过添加约\
  \ 40 行代码完成。然而，`BOOKINGSFORROOM` 请求/响应确实需要一些小心。\n\n解决方案位于 `chap18/buildingservicesserver_ans.pyw`\
  \ 和 `chap18/buildingservicesclient_ans.pyw` 中。\n\n### 19\n#### 创建线程服务器\n- 创建和管理辅助线程\n\
  - 实现辅助线程\n\n### 多线程\n\n传统上，应用程序有一个执行线程，并且一次执行一个操作。对于 GUI 程序，这有时是一个问题——例如，如果用户调用了一个长时间运行的操作，用户界面在操作执行期间可能会冻结。有几种可以尝试消除这个问题。\n\
  \n一种简单的解决方案（特别适用于长时间运行的循环）是调用 `QApplication.processEvents()`。该方法让事件循环有机会处理任何未处理的事件，例如绘制事件，以及鼠标和按键事件。另一种解决方案是使用零超时定时器。我们在多个示例中结合了这两种方法，通常在加载大量文件时——例如在第\
  \ 9 章文本编辑器的 `MainWindow.loadFiles()` 方法中。第三种解决方案是将工作完全交给另一个程序。可以使用 Python 标准库的 `subprocess`\
  \ 模块完成，也可以使用 `PyQt` 的 `QProcess` 类。示例提供的 `makepyqt.pyw` 使用 `QProcess` 执行 `PyQt`\
  \ 的命令行工具，如 `pyuic4` 和 `pyrcc4`。\n\n\n\n\n在某些情况下，我们真正需要的是应用程序内部一个独立的执行线程。拥有多一个执行线程的应用程序被称为多线程应用程序。例如，我们可能想要创建一个服务器，能够处理硬件所承受的尽可能多的并发连接，如果为每个连接分配一个新线程，这是相对容易实现的。在某些情况下，我们可能会有一个\
  \ GUI 应用程序，我们希望用户能够启动一个耗时进程，然后继续与应用程序交互；在这种情况下，最好的方法是将处理任务交给一个独立的辅助线程，让主线程（GUI）保持空闲以响应用户。\n\
  \n本章展示了多线程编程中用到常用技术。这些技术对于入门已经足够，但涵盖范围并不全面，因为那将超出本书的范围，并且需要专门写一本书。\n\n> *本章假设你已具备线程基础的知识。若需详尽但不浅的介绍，请参阅《Foundations\
  \ of Multithreaded, Parallel, and Distributed Programming》。*\n\n由于多个线程可能并发访问相同的数据，多线程应用程序通常比单线程应用程序更难编写、维护和调试。在单处理器机器上，多线程应用程序的运行速度有时比单线程应用程序慢（由于额外线程的额外开销），但用户通常认为它们运行得更快，因为它们不会冻结用户界面，并且能够更容易增量地向用户报告进度。\n\
  \n使用正确数量的线程会显著影响性能。例如，在章后面介绍的“页面索引器”示例中，我们有一个主线程（GUI）和一个辅助线程。该练习涉及将此示例更改为使用多个辅助线程。如果使用的过多，应用程序的运行速度会比单辅助线程的版本慢；但如果数量正确，我们可以启动单辅助线程的版本，然后启动多辅助线程的版本，并看到多辅助线程的版本在单辅助线程版本完成之前赶上、超越并完成。我们应该使用多少个辅助线程？答案取决于必须执行哪些处理，以及运行该应用程序的特定机器和操作系统。我们可以使用真实数据集进行实验以确定一个数值，或者根据情况让代码使用更多或更少的辅助线程。\n\
  \nPython 的标准库提供了底层的 `thread` 模块和高级的 `threading` 模块，但对于 PyQt 编程，我们建议使用 PyQt 的线程类。PyQt\
  \ 的线程类提供了高级 API，但在底层，它们的一些基础操作是用汇编语言实现的，以确保它们尽可能快速和精细，这在 Python 的 `threading` 模块中是没有这样做的。\n\
  \nPyQt 应用程序始终至少有一个执行线程，即主线程（初始线程）。此外，它们可以根据需要创建任意数量的辅助线程。然而，如果应用程序有 GUI，GUI 操作（如执行事件循环）可能发生在主线程中。新线程通过实例化重写了\
  \ `QThread.run()` 方法的 `QThread` 子类来创建。\n\n可以使用 `QCoreApplication` 代替 `QApplication`\
  \ 创建没有 GUI 的 PyQt 应用程序。就像 GUI PyQt 程序一样，它们有一个主线程，并可以有任意数量的辅助线程。\n\n辅助线程与主线程之间的通信通常是理想的——例如，让用户了解进度，允许用户在处理过程中进行干预，并让主线程知道处理何时完成。传统上，这种通信是通过使用共享变量结合资源保护机制来实现的。\n\
  \n## 创建线程服务器\n\nPyQt 拥有支持这种方法的类，包括 `QMutex`、`QReadWriteLock` 和 `QSemaphore`。此外，PyQt\
  \ 应用程序可以使用信号与槽机制在线程之间进行通信；这非常方便且有用。\n\n在本章的第一节中，我们将查看一个线程 TCP 服务器；它完成的工作与上一章最后一节描述的服务器相同，但由于它是线程的，它可以同时为多个客户端服务。在第二、第三节中，我们将查看一个具有某些可能非常耗时的处理的\
  \ GUI 应用程序，它将处理任务交给辅助线程。该应用程序使用信号和槽来保持用户界面的进度更新，并为用户提供对辅助线程的控制。此示例还使用了一些资源保护类，以便用户界面可以访问正在进行的工作。\n\
  \n与某些其他 GUI 库不同，PyQt 的网络套接类与事件循环集成。这意味着在网络处理期间，即使在单线程 PyQt 应用程序中，用户界面也能保持响应。但如果我们希望能够处理多个并发的传入连接，可能更倾向于使用多线程服务器。\n\
  \n制作多线程服务器并不比制作单线程服务器复杂——两者的区别在于，多线程服务器不是创建一个独立的套接来处理传入连接，而是为每个新连接创建一个新线程，并在新线程内部创建一个新套接。例如，这里有一个完整的线程服务器：\n\
  \n```python\nclass TcpServer(QTcpServer):\n    def __init__(self, parent=None):\n\
  \        super(TcpServer, self).__init__(parent)\n\n    def incomingConnection(self,\
  \ socketId):\n        thread = Thread(socketId, self)\n        self.connect(thread,\
  \ SIGNAL(\"finished()\"),\n                     thread, SLOT(\"deleteLater()\"))\n\
  \        thread.start()\n```\n\n`incomingConnection()` 方法是从 `QTcpServer` 基类重写的。每当有新的网络连接到服务器时，该方法就会被调用。\n\
  \n信号与槽连接是必要的，以确保线程在不需要时被删除，从而尽可能保持服务器的内存占用。虽然我们必须在 `QThread` 子类中重写 `QThread.run()`，但线程始终通过调用\
  \ `QThread.start()` 启动（而不是直接调用 `run()`）。\n\n`Thread` 子类有一个静态变量和四个方法。`sendReply()`\
  \ 和 `sendError()` 方法与上一节所示相同，因此我们将省略它们。\n\n```python\nclass Thread(QThread):\n \
  \   lock = QReadWriteLock()\n    def __init__(self, socketId, parent):\n       \
  \ super(Thread, self).__init__(parent)\n        self.socketId = socketId\n```\n\n\
  `Thread.lock` 变量是静态的，所有的 `Thread` 实例共享它。初始化函数只是记录了线程启动时就绪的套接符。`run()` 方法很长，所以我们将分部分查看。\n\
  \n```python\ndef run(self):\n    socket = QTcpSocket()\n    if not socket.setSocketDescriptor(self.socketId):\n\
  \        self.emit(SIGNAL(\"error(int)\"), socket.error())\n        return\n\n \
  \   while socket.state() == QAbstractSocket.ConnectedState:\n        nextBlockSize\
  \ = 0\n        stream = QDataStream(socket)\n        stream.setVersion(QDataStream.Qt_4_2)\n\
  \        while True:\n            socket.waitForRead(-1)\n            if socket.bytesAvailable()\
  \ >= SIZEOF_UINT16:\n                nextBlockSize = stream.readUInt16()\n     \
  \           break\n        if socket.bytesAvailable() < nextBlockSize:\n       \
  \     while True:\n                socket.waitForRead(-1)\n                if socket.bytesAvailable()\
  \ >= nextBlockSize:\n                    break\n```\n\n\n\n\n我们首先创建一个新的 socket，并将其套接字描述符设置为给定的那一个。我们采取了比之前稍微更健壮的方法，检查\
  \ `QTcpSocket.setSocketDescriptor()` 调用的返回值，并在失败时输出错误信息。一旦 `run()` 方法完成，就会发射 `finished()`\
  \ 信号，得益于我们之前的信号与槽连接，该线程将被删除。\n\n只要 socket 连接状态，我们就可以使用它接收请求并发送响应。与我们在上一章中创建的 TCP\
  \ 服务器不同，这里我们不是通过信号与槽连接异步运行并等待事件（如数据可用）发生，而是使用 `wait-ReadyRead()` 进行阻塞，直到有数据为止。（参数\
  \ `-1` 意味着“无限等待”）。阻塞并没有关系，因为我们处于一个独立的执行线程中，所以应用程序的其他部分（其主线程）以及任何其他处理连接的辅助线程都可以不受干扰地继续运行。\n\
  \n### 创建线程服务器\n\n一旦有两个字节可用，我们就会读取无符号 16 位字节计数，一旦至少有相应数量的字节可读，我们就可以继续操作。\n\n```\n\
  action = QString()\nroom = QString()\ndate = QDate()\nstream >> action\n\nif action\
  \ in (\"BOOK\", \"UNBOOK\"):\n    stream >> room >> date\n    try:\n        Thread.lock.lockForRead()\n\
  \        bookings = Bookings.get(date.toPyDate())\n    finally:\n        Thread.lock.unlock()\n\
  uroom = unicode(room)\n```\n\n我们读取请求动作，它本应该是“BOOK”或“UNBOOK”，如果是其中之一，我们接着会读取房间号字符串和日期。`Bookings`\
  \ 默认字典持有所有的预订数据，任何数量的线程都可能同时访问它。由于此原因，我们必须对每次访问进行保护。在这里，我们只需要读取，因此我们调用 `lockForRead()`，提取我们想要的数据，然后释放锁。我们使用\
  \ `try ... finally` 块来保证在完成访问共享数据后会释放锁。\n\nPython 2.6（以及带有适当 `from __future__` 语句的\
  \ 2.5）提供了一种更好、更紧凑的语法，可以替换 `try ... finally`，正如第 549 页的“使用上下文管理器进行解锁”侧边栏所示。\n\n一种广为人知的锁机制是互斥量（也称为二值信号量），由\
  \ PyQt 的 `QMutex` 类提供。互斥量仅允许锁定它的线程访问受保护的资源。PyQt 还提供了一种更细粒度的机制，即读/写锁，由我们在这里使用的 `QReadWriteLock`\
  \ 类提供。每当一个锁在一个线程中生效时，其他线程可能会被阻塞并等待访问。我们可以通过两种方式最大限度地减少这个问题。首先，我们可以尽可能使用读锁——如果唯一生效的锁是读锁，那么没有线程会被阻塞，因为在没有线程进行写入时，所有线程进行读取是安全的。其次，我们可以最大限度地减少在锁生效时执行的处理量。我们在\
  \ `run()` 重写中使用了这两种技术；缺点是代码比预期的要长得多。\n\n`QMutex`、`QReadWriteLock` 以及其他保护机制之所以有效，是因为它们都是“线程安全”的。任何数量的线程都可以同时调用线程安全对象的方法，并依赖底层系统（即\
  \ PyQt）自动对可能发生的任何共享数据访问进行序列化。这意味着，例如，如果两个或多个线程尝试锁定 `QReadWriteLock` 进行写入，则只有一个将成功，其他都将被阻塞。这允许获得锁的线程对共享数据执行更新，当它释放锁时，想要写入的其它线程之一将获得访问权限，以此此类推，直到没有更多线程需要写入访问为止。\n\
  \nPyQt 文档指出了哪些类或类中的哪些方法是线程安全的。它还指出了哪些方法是可重入（reentrant）的。重入方法比线程安全方法更受限制。这是因为只有当每次调用都只导致访问唯一的数据（例如局部变量）时，从多个线程同时调用重入方法才是安全的。通过对所有实例变量访问以及任何引用共享数据的变量访问使用锁，可以将重入方法变为线程安全。\n\
  \n```python\nif action == \"BOOK\":\n    newlist = False\n    try:\n        Thread.lock.lockForRead()\n\
  \        if bookings is None:\n            newlist = True\n    finally:\n      \
  \  Thread.lock.unlock()\n    if newlist:\n        try:\n            Thread.lock.lockForWrite()\n\
  \            bookings = Bookings[date.toPyDate()]\n        finally:\n          \
  \  Thread.lock.unlock()\n```\n\n如果请求是预订房间，我们首先检查 `bookings` 变量。它要么是 `None`，要么是共享\
  \ `Bookings` 默认字典持有的列表引用，因此在访问它时必须使用读锁。如果 `bookings` 是 `None`，我们向字典中插入给定日期为键插入一个新的空列表；这次我们必须使用写锁。\n\
  \n```python\nerror = None\ninsert = False\ntry:\n    Thread.lock.lockForRead()\n\
  \    if len(bookings) < MAX_BOOKINGS_PER_DAY:\n        if uroom in bookings:\n \
  \           error = \"Cannot accept duplicate booking\"\n        else:\n       \
  \     insert = True\n    else:\n        error = QString(\"%1 is fully booked\").arg(\n\
  \            date.toString(Qt.ISODate))\nfinally:\n    Thread.lock.unlock()\n\n\
  if insert:\n    try:\n        Thread.lock.lockForWrite()\n        bisect.insort(bookings,\
  \ uroom)\n    finally:\n        Thread.lock.unlock()\n    self.sendReply(socket,\
  \ action, date)\nelse:\n    self.sendError(socket, error)\n```\n\n如果房间在给定日期已预订，我们不会重复预订，而是发送错误响应。在非线程服务器中，我们在这种情况下直接调用了\
  \ `sendError()`，但在在这里我们只分配错误文本。这样做是为了保持在锁的上下文中执行的处理量尽可能最少。\n\n```python\nelif action\
  \ == \"UNBOOK\":\n    error = None\n    remove = False\n    try:\n        Thread.lock.lockForRead()\n\
  \        if bookings is None or uroom not in bookings:\n            error = \"Cannot\
  \ unbook nonexistent booking\"\n        else:\n            remove = True\n    finally:\n\
  \        Thread.lock.unlock()\n    if remove:\n        try:\n            Thread.lock.lockForWrite()\n\
  \            bookings.remove(uroom)\n        finally:\n            Thread.lock.unlock()\n\
  \        self.sendReply(socket, action, date)\n    else:\n        self.sendError(socket,\
  \ error)\nelse:\n    self.sendError(socket, \"Unrecognized request\")\n\nsocket.waitForDisconnected()\n\
  ```\n\n如果服务器收到的无法识别的请求，它只需发送错误响应。最后，我们调用 `QTcpSocket.waitForDisconnected()`；这会阻塞直到连接关闭，即在响应发送之后。\n\
  \n\n\n\nGUI 应用中线程的一个常见用例是将处理任务传递给次要线程，这样用户界面就可以保持响应状态，并显示次要线程的进度。在本节中，我们将查看图 19.1\
  \ 所示的页面索引器（Page Indexer）应用程序，它可以索引指定目录及其所有子目录中的 HTML 文件。索引工作被交给次要线程，该线程与主线程通信，以通知它已完成的进度以及索引何时完成。\n\
  \n**图 19.1** *页面索引器应用程序*\n\n我们将用于索引的算法如下：对于遇到的每个 HTML 文件，读取其文本，将实体转换为等效 Unicode\
  \ 字符，并剥离 HTML 标签。然后将文本拆分为单词，并将每个长度在 3~25 个字符之间（包含边界）且不在 `Default` 常用词集中的单词添加到 `filenamesForWords`\
  \ 默认字典中。字典的每个键（key）是一个唯一的单词，每个关联的值（value）是该单词出现的文件集。如果任何单词出现在超过 250 个文件中，则将其从字典中删除并添加到常用词集合中。这确保了字典的大小保持在合理范围内，并意味着对“and”和“the”等单词的搜索将无效——这是一件好事，因为此类单词可能在成千上万个文件中匹配，多到完全没用。\n\
  \n我们将首先查看应用程序主表单的两个片段，它位于 `chap19/pageindexer.pyw` 文件。\n\n```python\nclass Form(QDialog):\n\
  \    def __init__(self, parent=None):\n        super(Form, self).__init__(parent)\n\
  \        self.fileCount = 0\n        self.filenamesForWords = collections.defaultdict(set)\n\
  \        self.commonWords = set()\n        self.lock = QReadWriteLock()\n      \
  \  self.path = QDir.homePath()\n```\n\n`fileCount` 变量用于跟踪目前已索引了多少文件。`filenamesForWords`\
  \ 默认字典的键是单词，值是文件名集。`commonWords` 集合存储在至少 250 个文件中出现的单词。读/写锁用于确保对 `filenamesForWords`\
  \ 字典和 `commonWords` 集合的访问受到保护，因为它们会在主线程中被读取，并在次要线程中被读取和写入。`QDir.homePath()` 方法返回用户的家目录；我们用它来设置初始搜索路径。\n\
  \n```python\nself.walker = walker.Walker(self.lock, self)\nself.connect(self.walker,\
  \ SIGNAL(\"indexed(QString)\"), self.indexed)\nself.connect(self.walker, SIGNAL(\"\
  finished(bool)\"), self.finished)\nself.connect(self.pathButton, SIGNAL(\"clicked()\"\
  ), self.setPath)\nself.connect(self.findEdit, SIGNAL(\"returnPressed()\"), self.find)\n\
  ```\n\n次要线程位于 `walker` 模块中（之所以命名为此是因为它会遍历文件系统），该 `QThread` 子类名为 `Walker`。每当线程索引新文件时，它就会发射一个带有文件名的信号。当它完成了启动时给定的路径中所有文件的索引后，它也会发射一个\
  \ `finished()` 信号。\n\n在一个线程中发射的用于另一个线程的信号是异步工作的，也就是说，它们不会阻塞。但只有在接收端有事件循环时，它们才会起作用。这意味着次要线程可以通过信号向主线程传递信息，但反之则不行——除非我们在次要线程中运行单独的事件循环（这是可能的）。在后台，当发射跨线程信号时，PyQt\
  \ 不会像在同一线程中发射和接收信号那样直接调用相关方法，而是将带有任何传递数据的事件放入接收线程的事件队列中。当接收者的事件循环轮到读取该事件时，它通过调用带有任何传递数据的相关方法来响应它。\n\
  \n### 方法调用\n\n主线程\n*信号*\n*信号*\n次要线程\n锁 共享数据\n\n**图 19.2** *典型的 PyQt 线程间通信示意图* 如图\
  \ 19.2 所示，主线程通常使用方法调用将信息传递给次要线程，而次要线程使用信号向主线程传递信息。另一种主、次要线程都使用的通信机制是使用共享数据。此类数据必须受到访问保护——例如，通过互斥锁或读/写锁。\n\
  \n如果用户点击 Set Path 按钮，将调用 `setPath()` 方法；如果用户在查找行编辑框中按回车键，将调用 `find()` 方法。\n\n`Form`\
  \ 类是一个 `QDialog`，但我们将其设计为：如果用户在索引进行期间按下 Esc 键，索引将停止；如果用户在索引完成（或停止）后按下 Esc 键，应用程序将终止。我们在查看\
  \ `accept()` 和 `reject()` 的重写时将看到如何实现。\n\n```python\ndef setPath(self):\n    self.pathButton.setEnabled(False)\n\
  \    if self.walker.isRunning():\n        self.walker.stop()\n        self.walker.wait()\n\
  \    path = QFileDialog.getExistingDirectory(self, \"Choose a Path to Index\", self.path)\n\
  \    if path.isEmpty():\n        self.statusLabel.setText(\"Click the 'Set Path'\
  \ button to start indexing\")\n    self.pathButton.setEnabled(True)\n```\n\n###\
  \ 创建和管理次要线程\n\n```python\nreturn\nself.path = QDir.toNativeSeparators()\nself.findEdit.setFocus()\n\
  self.statusLabel.setText(self.path)\nself.statusLabel.clear()\nself.filesListWidget.clear()\n\
  self.fileCount = 0\nself.filenamesForWords = collections.defaultdict(set)\nself.commonWords\
  \ = set()\nself.walker.initialize(self.path, self.filenamesForWords, self.commonWords)\n\
  self.walker.start()\n```\n\n当用户点击 Set Path 时，我们通过禁用按钮并停止正在运行的线程开始。`wait()` 方法继承自\
  \ `QThread`；它会阻塞直到线程结束，直到 `run()` 方法返回。在 `stop()` 方法中，正如下一节所示。\n\n接下来我们获取用户选择的路径（如果他们取消了则返回）。我们使用了\
  \ `QDir.toNativeSeparators()`，因为 PyQt 内部始终使用 \"/\" 路径，但在 Windows 上我们希望显示 \"\\\"\
  。`NativeSeparators()` 方法在 Qt 4.2 中引入；早期版本使用 `QDir.convertSeparators()`。默认情况下，`getExistingDirectory()`\
  \ 只显示目录，因为第四个可选参数值为 `QFileDialog.ShowDirsOnly`；如果我们想要文件名，可以通过传递 `QFileDialog.Options()`\
  \ 来清除该标志。\n\n用户界面通过将焦点移动到查找编辑框、设置路径标签为选择的路径以及清除用于告知用户进度的状态标签来实现。文件列表列出了包含查找框中单词的文件。我们不需要保护对\
  \ `filenamesForWords` 默认字典或 `commonWords` 集合的访问，因为此时运行的线程只有主线程。\n\n我们最后通过初始化 `walker`\
  \ 线程并传入它需要填充的数据结构引用，然后调用 `start()` 开始其执行。\n\n\n\n\n\n```python\nwords = self.commonWords.copy()\n\
  \nfinally:\n\nself.lock.unlock()\n\nself.commonWordsListWidget.addItems(sorted(words))\n\
  ```\n\n每当遍历线程完成一个文件的索引时，它会发出一个带有文件名的 `indexed()` 信号；该信号连接到之前所示的 `Form.indexed()`\
  \ 方法。我们更新状态标签以显示刚刚索引的文件名，并且每隔 25 个文件，我们还会更新文件计数、已索引单词数以及常用词汇的 LCD 小部件。我们使用读锁（read\
  \ lock）来确保共享数据结构在读取时是安全的，并且在在锁的上下文中只执行最少的工作，仅在释放锁后才更新 LCD 小部件。\n\n对于每处理的第 101 个文件，我们会更新一次常用词汇列表小部件。我们再次使用了读锁，并使用\
  \ `set.copy()` 来确保在释放锁后我们不再引用共享数据。\n\n```python\ndef finished(self, completed):\n\
  \    self.statusLabel.setText(\"Indexing complete\" \\\n    if completed else \"\
  Stopped\")\n    self.finishedIndexing()\n```\n\n当线程停止或完成时，它会发出一个 `finished()` 信号，连接到该方法并传递一个布尔值以指示是否完成。我们更新状态标签并调用\
  \ `finishedIndexing()` 方法来更新用户界面。\n\n```python\ndef finishedIndexing(self):\n  \
  \  self.walker.wait()\n    self.filesIndexedLCD.display(self.fileCount)\n    self.wordsIndexedLCD.display(len(self.filenamesForWords))\n\
  \    self.commonWordsLCD.display(len(self.commonWords))\n    self.pathButton.setEnabled(True)\n\
  ```\n\n当索引完成后，我们调用 `QThread.wait()` 以确保线程的 `run()` 方法已经执行完毕。然后我们根据共享数据结构的当前值更新用户界面。我们不需要保护对字典或集合的访问，因为此时遍历线程没有运行。\n\
  \n创建和管理辅助线程\n\n### 使用上下文管理器进行锁\n\n在本章中，我们使用 `try … finally` 块来确保锁在使用后能被释放。Python\
  \ 2.6 提供了另一种替代方法，即使用新的 `with` 关键字结合上下文管理器（context manager）。上下文管理器在 `http://www.python.org/dev/peps/pep-0343/`\
  \ 中有解释；只需说我们可以通过创建一个包含两个特殊方法的类：`__enter__()` 和 `__exit__()` 来创建一个上下文管理器。然后，我们不需要编写这样的代码：\n\
  \n```python\ntry:\n    self.lock.lockForRead()\n    found = word in self.commonWords\n\
  finally:\n    self.lock.unlock()\n```\n\n而是写更简单更短的代码：\n\n```python\nwith ReadLocker(self.lock):\n\
  \    found = word in self.commonWords\n```\n\n这之所以有效，是因为传递给 `with` 语句的对象的语义（在最简单的情况下）是：\n\
  \n```python\nContextManager.__enter__()\ntry:\n    # 语句，例如 found = word in self.commonWords\n\
  finally:\n    ContextManager.__exit__()\n```\n\n`ReadLocker` 上文管理器类本身也容易实现，假设它接收了一个\
  \ `QReadWriteLock` 对象：\n\n```python\nclass ReadLocker:\n    def __init__(self, lock):\n\
  \        self.lock = lock\n    def __enter__(self):\n        self.lock.lockForRead()\n\
  \    def __exit__(self, type, value, tb):\n        self.lock.unlock()\n```\n\n事实上，自\
  \ PyQt 4.1 起，`QReadLocker` 和 `QWriteLocker` 可以作为上下文管理器使用，因此在 Python 2.6（或带有 `from\
  \ __future__ import 4.1` 的 Python 2.5）中，我们可以像这样写：\n\n```python\nwith ReadLocker(self.lock):\n\
  \    found = word in self.commonWords\n```\n\n\n\n\n\n页面索引器（Page Indexer）的辅助线程实现在\
  \ `chap19/walker.py` 文件中的 `Walker` 类。该类是 `QThread` 的子类，使用 `QMutex` 来保护对其私有数据的访问，并使用传递给它的\
  \ `QReadWriteLock` 来保护与主线程共享数据的访问。\n\n```python\nclass Walker(QThread):\n    COMMON_WORDS_THRESHOLD\
  \ = 250\n    MIN_WORD_LEN = 3\n    MAX_WORD_LEN = 25\n    INVALID_FIRST_OR_LAST\
  \ = frozenset(\"0123456789_\")\n    STRIPHTML_RE = re.compile(r\"<[^>]*?>\", re.IGNORECASE|re.MULTILINE)\n\
  \    ENTITY_RE = re.compile(r\"&(\\w+?);|&#(\\d+?);\")\n    SPLIT_RE = re.compile(r\"\
  \\W+\", re.IGNORECASE|re.MULTILINE)\n```\n\n该类开头了一些静态变量，用于控制一个单词在被视为常用词之前可以出现在多少个文件中、单词的最小和最大长度，以及单词不能以哪些字符开头或结尾。“strip\
  \ HTML”正则表达式用于剥离 HTML 标签，实体正则表达式用于提取要转换为 Unicode 字符的实体，而分割正则表达式则用于将文件文本拆分为其包含的单词。在更实际的应用中，可能会使用\
  \ HTML 解析器而不是正则表达式。\n\n```python\ndef __init__(self, lock, parent=None):\n    super(Walker,\
  \ self).__init__(parent)\n    self.lock = lock\n    self.stopped = False\n    self.mutex\
  \ = QMutex()\n    self.path = None\n    self.completed = False\n```\n\n应用程序创建了一个\
  \ walker 线程对象，但并没有立即启动它。`lock` 是与主线程相同的同一个 `QReadWriteLock`——walker 线程使用它来保护对共享的\
  \ `filenamesForWords` 默认字典以及 `commonWords` 集合的所有访问。`stopped` 变量用于类内部，用于判断线程是否被请求停止（通过调用\
  \ `stop()` 方法）。`mutex` 用于保护 walker 线程自身对 `stopped` 变量的访问。这是必要的，因为当 `run()` 方法执行时，可能会调用该线程的其他方法（例如\
  \ `stop()`）。`completed` 变量用于指示在线程停止时索引是否完成。\n\n```python\ndef initialize(self, path,\
  \ filenamesForWords, commonWords):\n    self.stopped = False\n    self.path = path\n\
  \    self.filenamesForWords = filenamesForWords\n    self.commonWords = commonWords\n\
  \    self.completed = False\n```\n\n该方法设计用于在调用 `QThread.start()` 之前调用，以便为线程索引做好准备。它不应该在线程运行时被调用。（如果我们足够多疑，可以在开头处放一个\
  \ `if not self.isStopped(): return`。）\n\n虽然使用 `mutex` 和 `lock` 没有无的，但它们都不是必须的。当调用此方法时，walker\
  \ 线程并未运行，因此给 `stopped` 赋值没有问题；对于传入的字典和集合，我们只是获取了它们的引用，并没有对其进行任何修改。\n\n```python\n\
  def run(self):\n    self.processFiles(self.path)\n    self.stop()\n    self.emit(finished(self.completed))\n\
  ```\n\n当调用者调用 `start()` 时，walker 线程会调用 `processFiles()`，该操作可能耗时很，因为它涉及递归读取所有文件。`processFiles()`\
  \ 方法对主线程是响应的，因为 `run()` 方法在自己的线程中运行，所以用户界面对主线程保持响应。在最后，`run()` 方法发射 `finished` 信号，并带有一个布尔标志，指示索引是否完成。\n\
  \n```python\ndef stop(self):\n    try:\n        self.mutex.lock()\n        self.stopped\
  \ = True\n    finally:\n        self.mutex.unlock()\n```\n\n```python\ndef processFiles(self,\
  \ path):\n    def unichrFromEntity(match):\n        text = match.group(1)\n    \
  \    if text.isdigit():\n            return unichr(int(text))\n        u = entitydefs.name2codoint.get(text)\n\
  \        return unichr(u) if u is not None else \"\"\n\n    for root, dirs, files\
  \ in os.walk(path):\n        if self.isStopped():\n            return\n        for\
  \ name in [name for name in files if name.endswith((\".htm\", \".html\"))]:\n  \
  \          fname = os.path.join(root, name)\n            if self.isStopped():\n\
  \                return\n            words = set()\n            fh = None\n    \
  \        try:\n                fh = codecs.open(fname, \"r\", \"UTF8\", \"ignore\"\
  )\n                text = fh.read()\n            except (IOError, OSError), e:\n\
  \                sys.stderr.write(\"Error: %s\\n\" % e)\n                continue\n\
  \            finally:\n                if fh is not None:\n                    fh.close()\n\
  \            if self.isStopped():\n                return\n            text = self.STRIPHTML_RE.sub(\"\
  \", text)\n            text = self.ENTITY_RE.sub(unichrFromEntity, text)\n     \
  \       text = text.lower()\n            # ... 处理单词的逻辑 ...\n```\n\n\n\n\n一旦我们获得了文件的文本并将其作为一个单一大字符串读取，我们就会剔除其\
  \ HTML 标签，将任何实体转换为相应的 Unicode 等效字符，并将剩余文本转为小写。\n\n# 第 19 章 多线程\n\n`re.sub()`（替换）方法将要处理的文本作为第二个参数；其第一个参数可以是用于替换每个匹配项的字面量字符串，也可以是一个要调用的函数。如果是函数，对于每个匹配项，都会将一个匹配对象传递给该函数，并且函数的返回值（应该是一个字符串）被用作替换字符串。\n\
  \n在几处，我们都会检查 `stopped` 变量是否为 `True`，如果调用了 `stop()` 方法，情况将是如此。如果发生这种情况，我们就不再进行后续索引，直接返回。如果检查得太少，用户可能会在请求停止索引和线程实际停止之间遇到延迟。但另一方面，检查得越多，线程运行得越慢。因此，我们检查的频率以及放置检查的位置，可能需要一些尝试才能达到理想效果。\n\
  \n```python\nfor word in self.SPLIT_RE.split(text):\n    if self.MIN_WORD_LEN <=\
  \ len(word) <= \\\n       self.MAX_WORD_LEN and \\\n       word[0] not in self.INVALID_FIRST_OR_LAST\
  \ and \\\n       word[-1] not in self.INVALID_FIRST_OR_LAST:\n        try:\n   \
  \         self.lock.lockForRead()\n            new = word not in self.commonWords\n\
  \        finally:\n            self.lock.unlock()\n        if new:\n           \
  \ words.add(word)\n        if self.isStopped():\n            return\n\n    for word\
  \ in words:\n        try:\n            self.lock.lockForWrite()\n            files\
  \ = self.filenamesForWords[word]\n            if len(files) > self.COMMON_WORDS_THRESHOLD:\n\
  \                del self.filenamesForWords[word]\n                self.commonWords.add(word)\n\
  \            else:\n                files.add(unicode(fname))\n        finally:\n\
  \            self.lock.unlock()\n        self.emit(SIGNAL(\"indexed(QString)\"),\
  \ fname)\n        self.completed = True\n```\n\n对于文件文本中每个不是太长太短且不以不可接受的字符开头的单词，我们首先查看它是否在常用词集中，如果不在，我们将其添加到本地单词集合中。\n\
  \n一旦我们在 `words` 集合中收集了文件中所有的非常用单词，我们就会对该集合进行迭代。新单词被添加到 `filenamesForWords` 默认字典中。如果字典中该单词的文件名集合过大，我们就删除该字典条目并将该单词添加到常用词集中；否则，我们将文件名添加到字典中当前单词的集合中。当然，我们必须使用写锁，以确保在更新期间，没有其他线程（例如主线程）可以访问字典或常用词集。\n\
