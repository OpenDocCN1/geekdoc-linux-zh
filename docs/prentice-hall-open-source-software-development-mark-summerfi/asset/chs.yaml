  \ C:\\pyqt`——这样控制台启动时就会进入方便的目录。如果你在非标准位置安装了 MinGW 或 Python，你仍然需要编辑此文件，以输入它们的正确路径。\n\
  \n现在你已经准备好在 Windows 机器上编写并运行 PyQt 程序了——它们在 Mac OS X 和 Linux 上也可以原样运行！\n\n## 在 Mac\
  \ OS X 上安装\n\n要在 Mac OS X 上安装 PyQt，你必须已经安装了 Xcode 工具。\n\n这是因为安装 PyQt 需要编译器和构建工具。Xcode\
  \ 是一个非常大的软件包，通常随机器附带的单独开发者光盘提供；你也可以从 `http://developer.apple.com/tools/xcode` 在线下载。以下指令假设你已经安装了\
  \ Xcode。\n\n虽然 Mac 通常预装了一个版本的 Python，但它可能是一个旧版本，在这种情况下，我们建议为 PyQt 开发安装一个最新的版本。要检查\
  \ Python 版本，启动 Terminal 并输入 `python -V`；如果打印出“Python 2.5”或更高版本号，则无需安装新版本的 Python。\n\
  \n安装 PyQt 需要的文件有 `qt-mac-opensource-4.2.3.dmg`、`python2.5.1-macosx.dmg`（除非你已安装 Python\
  \ 2.5 或更高版本）、`sip-4.6.tar.gz` 以及 `PyQt-mac-gpl-4.2.tar.gz`。书籍示例位于 `pyqtbook.tar.gz`\
  \ 文件中。\n\n首先获取 Qt。访问 `http://www.trolltech.com/developer/downloads/qt/index` 并点击\
  \ Qt/Mac Open Source Edition ，在页面底部下载 `qt-mac-opensource-4.2.3.dmg`。较后版本（例如 `4.3.1`）也可以的。\n\
  \n如果你需要安装最新版本的 Python，访问 `http://www.python.org/download` 并下载适用于 Macintosh OS X\
  \ 的 Python 2.5.1 版本——例如，`python-2.5.1-macosx.dmg`。较后的 `2.x` 系列版本（如 `2.5.2` 或 `2.6.0`）也可以，只要它们是正式发布版（而不是\
  \ alpha、beta 或发布候选版）。\n\n最后必须获取的两个工具是 SIP 和 PyQt。访问 `http://www.riverbankcomputing.co.uk/sip/download.php`\
  \ 并下载源码包 `sip-4.6.tar.gz`。\n\n### 在 Mac OS X 上安装 Qt\n\n首先通过双击 `qt-mac-opensource-4.2.3.dmg`\
  \ 或你下载的任何包并按照说明操作设置 Qt。安装程序的第一个界面如图 A.4 所示。我们假设你接受所有默认设置并安装在标准位置。旧版本的 Qt 使用了未优化的构建工具，这意味着设置可能花费意想不到的长长时间。较新的版本具有优化的构建工具，运行速度更快。\n\
  \n### 在 Mac OS X 上安装 Python\n\n一旦安装了 Qt，如果需要，就可以安装 Python 了。双击 `python-2.5.1-macosx.dmg`\
  \ 或你下载的包。安装程序的第一个界面如图 A.5 所示。与 Qt 一样，我们假设你接受默认设置并安装在标准位置。如果你已经有一个或多个旧版本的 Python，你会发现这些版本仍然完好无损，并在\
  \ `/usr/local/bin` 中添加了两个 Python 可执行文件及其名称——例如，`python2.5` 和 `pythonw2.5`。第一个可执行文件用于\
  \ Terminal 窗口，第二个用于运行 GUI 应用程序并避免在后台不必要地弹出 Terminal。\n\n安装应该使安装的 Python 版本生效。要检查，关闭所有现有的\
  \ Terminal 窗口，然后启动一个新的 Terminal 窗口并输入 `python -V`。如果版本不是安装的那个，则需要手动更改设置。关闭 Terminal，然后在\
  \ Finder 中进入 `Applications→MacPython 2.5` 并启动 Python Launcher。打开 Preferences 对话框（如图\
  \ A.6 所示），对于 Settings 文件类型组合框中的每项——针对 Python Scripts、Python GUI Scripts 和 Python\
  \ Bytecode Documents——更改 Python 版本。对于 Python Scripts 和 Python Bytecode 条目，更改为 `/usr/local/bin/python2.5`；对于\
  \ Python GUI Scripts 条目，更改为 `/usr/local/bin/pythonw2.5`（注意可执行文件名中的“w”）。这些值可能不在下拉列表中，如果是这样，必须手动输入。对于每个条目，还要确保取消勾选\
  \ `Run in a Terminal window` 复选框。\n\n### 安装 SIP 和 PyQt\n\n现在所有组件已就绪，且假设 Xcode 已经安装，你就可以进行\
  \ PyQt 安装。必须先安装 Qt 和 Python，然后是 SIP，最后是 PyQt 本身。我们将版本假设之前提到的那些，但显然应根据你下载的任何版本进行相应调整。所有文件都在桌面上。\n\
  \n必须先编译 SIP，在 Terminal 中输入以下内容：\n\n```bash\ncd $HOME/Desktop\ntar xvfz sip-4.6.tar.gz\n\
  cd sip-4.6\npython configure.py\nmake\nsudo make install\n```\n\n在执行最后的 `sudo` 命令时，系统会要求输入管理员密码（通常是你自己的密码）。现在可以安装\
  \ PyQt 了。\n\n```bash\ncd $HOME/Desktop\ntar xvfz PyQt-mac-gpl-4.2.tar.gz\ncd PyQt-mac-gpl-4.2\n\
  python configure.py\nmake\nsudo make install\n```\n\n同样，在执行 `sudo` 命令时会提示输入密码。编译\
  \ PyQt 可能需要很长时间，所以你需要耐心等待。\n\nSIP 和 PyQt 都必须在 Terminal 中编译。关闭所有已打开的 Terminal，然后启动一个新的。输入\
  \ `python -V` 以确保使用的是正确的 Python。\n\nQt 文档可以通过 `Qt Assistant` 获取，可以从 Finder 运行。PyQt\
  \ 的文档以 HTML 格式提供在 `$HOME/Desktop/PyQt-mac-gpl-4.2/doc` 目录下。值得将此移动到永久存放的地方并在浏览器中添加一个合适的书签。它还附带了许多示例；至少值得查看\
  \ PyQt 示例并运行演示。（例如，切换目录到 `$HOME/Desktop/PyQt-mac-gpl-4.2/examples/tools/qtdemo`\
  \ 并运行 `./qtdemo.py`。）\n\n\n\n\n将 `tar.gz` 解压到 `$HOME` 即可获得一个 `$HOME/pyqt` 目录，其中包含了书中所有的示例以及按章节分类的练习题答案。在\
  \ `$HOME/pyqt` 目录本身，你会发现 `mkpyqt.py` 和 `makepyqt.pyw`；你可能希望将它们移动（或创建软链接）到 `$PATH`\
  \ 中的某个目录——例如 `$HOME/bin`——以便更方便使用。某些示例依赖于 `Qt Designer` 的 `.ui` 文件或 `.qrc` 资源文件。如何将这些文件转换为\
  \ Python 模块请见第 207 页，但目前直接进行转换可能更方便：\n\n```\ncd $HOME/pyqt\n./mkpyqt.py -r\n```\n\
  \n此命令将转换 pyqt 目录及其子目录中找到的任何 `.ui` 和 `.qrc` 文件。★ 如果你倾向于使用 GUI 工具 `makepyqt.pyw`，你可能需要点击它的\
  \ More→Tool paths 选项，并将路径设置为 `pyuic4`。可能也需要设置其他工具的路径。\n\n这便完成了 Mac OS X 的安装。如果你解压了示例，可以去桌面点击\
  \ pyqt 目录，然后进入 chap12 目录，最后点击 `multipedes.pyw` 查看图形应用程序。如果弹出一个不需要的 Terminal 窗口，右键点击\
  \ `multipedes.pyw` 并点击 Info 对话框；将 Open with 设置为正确版本的 Python Launcher，并将更改应用到所有带有\
  \ `.pyw` 后缀的文件。\n\n你现在已经准备好在 Mac OS X 机器上编写并运行 PyQt 了——它们在 Windows 和 Linux 上也可以同样不变地运行！\n\
  \n##在 Linux 和 Unix 上安装](#index_split_000.html_p13)\n\n如果你运行的是 Kubuntu (7.04 Fiesty\
  \ Fawn 及更高版本)，你已经安装了 PyQt4！因此你只需要安装书中的示例（见第 573 页）以及文档包 `python-doc` 和 `python-qt4-doc`。\n\
  \n★ 如果 `mkpyqt.py` 不不起作用，你必须编辑 `mkpyqt.py` 文件，并至少硬编码 `pyuic4` 的路径。\n\n在 Linux 和\
  \ Unix 上安装 571\n\n对于 Linux 大多数未预装 PyQt4 的其他 Unix 系统，有四种工具需要安装：Qt C++ 开发框架、Python\
  \ 解释器及其配套库、SIP 绑定工具以及 PyQt4 本身。让这一切运行起来最方便的方法是使用对应 Linux 或 Unix 发行版的标准包来安装工具。\n\n\
  对于 ArchLinux、Debian、Fedora、Gentoo、Kubuntu、Pardus、Ubuntu 等许多系统，必要的组件以包的形式提供。可以使用\
  \ `Adept`、`Pirut`、`apt-get`、`yum` 或系统使用的任何包管理器安装。对于 PyQt4，包通常被称为 `pyqt4` 或 `PyQt4`\
  \ 或 `pyqt4-dev-tools`。PyQt4 的文档包通常称为 `pyqt4-doc` 或 `python-qt4-doc` 或 `PyQt4-examples`。Python\
  \ 的文档通常在名为 `python-doc` 或 `python-docs` 的包中。IDLE 通常作为 `idle` 或 `python-tools` 包的一部分单独提供。如果你想要一个更强大的\
  \ IDE，用 PyQt 编写的 `Eric4` 在许多流行发行版的包中可用。\n\n包管理器应该能够处理依赖关系，但如果不能，你可能还需要要求它安装 Python\
  \ 本身，甚至可能是 Qt 和 `g++` 编译器。`Qt Designer` 可视化工具和翻译支持工具通常单独打包——例如在名为 `qt4-designer`\
  \ 和 `qt4-dev-tools` 的包中。\n\n如果你幸运地可以使用标准包安装，一旦完成后你就可以编写 PyQt 程序了，并跳过第 573 页描述的示例安装。\n\
  \n对于旧版发行版的用户、没有可用包或只有部分组件的用户，以及想要手动构建最新版本的用户，手动编译和安装非常简单。然而，如果你从源码编译，我们有两个假设：首先，C++\
  \ 编译器和工具链（如 `make`）已安装并可用；其次，以 `root` 身份安装（使用 `su` 或 `sudo`），或者知道使用 `configure`\
  \ 的 `--prefix` 选项进行本地安装。安装所需的文件有 `qt-x11-opensource-src-4.2.3.tar.gz`、`Python-2.5.1.tgz`、`sip-4.6.tar.gz`\
  \ 以及 `PyQt-x11-gpl-4.2.tar.gz`。书中示例位于 `pyqtbook.tar.gz` 文件中。\n\n首先获取 Qt。访问 http://www.trolltech.com/developer/downloads/qt/\
  \ 并点击 Qt/11 Source Edition 链接，在页面底部下载 `qt-x11-opensource-src-4.2.3.tar.gz`。后续的版本（例如\
  \ 4.3.1）也可以。现在是获取 Python 的时候了。访问 http://www.python.org/download 并点击当前的版本链接。\n\n\
