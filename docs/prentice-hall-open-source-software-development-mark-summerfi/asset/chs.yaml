  \ index):\n    if index.isValid():\n        record = self.assetModel.record(index.row())\n\
  \        id = record.value(\"id\").toInt()[0]\n        self.logModel.setFilter(QString(\"\
  assetid = %1\").arg(id))\n    else:\n        self.logModel.setFilter(\"assetid =\
  \ -1\")\n    self.logModel.select()\n    self.logView.horizontalHeader().setVisible(self.logModel.rowCount()\
  \ > 0)\n```\n\n\n\n\n如果模型索引无效，我们将 ID 设置为一个我们已知的不存在的 ID，从而保证不会检索到任何行，并且日志视图将为空。最后，如果没有日志记录需要显示，我们将隐藏日志视图的列标题。\n\
  \n`record()` 方法是 `QSqlTableModel` 和 `QSqlRelationalTableModel` 类提供的扩展方法之一（除了它们从基类\
  \ `QAbstractItemModel` 继承的方法），其目的是使它们更容易与数据库配合使用。\n\n其他扩展包括 `setQuery()`，它允许我们使用\
  \ SQL 语法编写自己的 `SELECT` 语句，以及用于添加记录的 `insertRecord()`。\n\n连接到 `assetChanged()` 方法以及该方法的实现，就是我们建立两个模型之间（因此也是在它们的视图之间）主从关系时所需要做的所有工作。\n\
  \n```python\ndef done(self, result=1):\n    query = QSqlQuery()\n    query.exec_(\"\
  DELETE FROM logs WHERE logs.assetid NOT IN\"\n    \"(SELECT id FROM assets)\")\n\
  \    QDialog.done(self, 1)\n```\n\n当应用程序终止时，我们会执行最后一个查询，以删除任何针对不存在（已删除）资产的日志记录。从理论上说，这应该是需要的，因此应该什么都不做。这是因为对于支持事务的数据库，我们使用事务来确保如果资产被删除，其日志记录也会被删除。\n\
  \n```python\ndef addAction(self):\n    index = self.assetView.currentIndex()\n \
  \   if not index.isValid():\n        return\n    QSqlDatabase.database().transaction()\n\
  \    record = self.assetModel.record(index.row())\n    assetid = record.value(ID).toInt()[0]\n\
  \    row = self.logModel.rowCount()\n    self.logModel.insertRow(row)\n    self.logModel.setData(self.logModel.index(row,\
  \ ASSETID),\n    QVariant(assetid))\n    self.logModel.setData(self.logModel.index(row,\
  \ DATE),\n    QVariant(QDate.currentDate()))\n    QSqlDatabase.database().commit()\n\
  \    index = self.logModel.index(row, ACTIONID)\n    self.logView.setCurrentIndex(index)\n\
  \    self.logView.edit(index)\n```\n\n如果用户请求添加操作（一条新的日志记录），就会调用此方法。我们获取当前资产的 `assetid`，然后将新的日志记录作为日志表中的最后一条记录插入。然后我们将记录的\
  \ `assetid` 外键设置为我们获取的那个值，并提供一个初始的默认日期。最后，我们获取指向新日志记录操作组合框的模型索引，并启动编辑，以便用户选择合适的操作。\n\
  \n在获取获取 `assetid` 之前，我们开始执行一个事务。这样做是为了防止一种理论上的可能性：即在获取了 `assetid` 之后、在创建新日志记录之前，资产被删除了。如果发生这种情况，日志记录将引用一个不存在的资产，这在稍后可能会导致崩溃或更细微的问题。一旦我们调用\
  \ `commit()`，我们就知道资产和新的日志记录都存在。如果现在有人尝试删除该资产，他们可以这样做——但该资产的日志记录（包括此条）将随之被正确删除。\n\
  \n为了采取真正的防御性方法，我们可能会这样构建事务代码：\n\n```python\nclass DatabaseError(Exception): pass\n\
  \nrollback = False\ntry:\n    if not QSqlDatabase.database().transaction():\n  \
  \      raise DatabaseError\n    rollback = True\n    # 执行影响数据库的命令\n    if not QSqlDatabase.database().commit():\n\
  \        raise DatabaseError\n    rollback = False\nfinally:\n    if rollback:\n\
  \        if not QSqlDatabase.database().rollback():\n            raise DatabaseError\n\
  ```\n\n这尝试确保如果发生某些问题导致无法到达 commit，或者调用 commit 时无法成功执行，我们将回滚到之前的位置，从而保留数据库的关联完整性。不过，如果回滚失败，一切都将不可控。错误文本可以通过\
  \ `QSqlDatabase.database().lastError().text()` 获取，它返回一个 `QString`。\n\n事务的范围从调用 `transaction()`\
  \ 开始，直到事务被提交或回滚为止。无论是通过 `QSqlDatabase` 还是通过模型访问数据库，并不重要。事务的上下文适用于所有的 SQL 语句，包括由独立查询执行的语句和由不同模型执行的语句，只要它们应用于同一个事务上下文范围内的同一个数据库即可。\n\
  \n如果我们正在使用 Python 2.6，或者在 Python 2.5 中使用 `from __future__ import with_statement`，我们可以通过创建和使用上下文管理器（Context\
  \ manager）来简化之前所示的代码。\n\n以事务为导向的方法尝试安排安排使得问题无法发生。另一种方法是假设一切都将正常工作，并依赖数据库来维护外键关系和数据完整性的其他方面。这在\
  \ `SQLite 3` 中不起作用，因为它不强制关联完整性，但在其他某些数据库中可行。使用这种方法，我们通常可以在不使用事务的情况下编写代码。大多数情况下情况运行良好，而对于极少数发生问题的情况，我们依靠数据库拒绝执行任何破坏其规则的操作，并向我们提供一个可以报告给用户的错误消息。\n\
  \n注意，事务是设置在数据库上的，通过静态方法 `QSqlDatabase.database()` 访问。也可以通过调用模型上的 `database()` 方法访问数据库。每个数据库连接一次只能处理一个事务，因此如果我们想同时处理多个事务，必须为每个额外的事务建立一个连接。\n\
  \n```python\ndef deleteAction(self):\n    index = self.logView.currentIndex()\n\
  \    if not index.isValid():\n        return\n    record = self.logModel.record(index.row())\n\
  \    action = record.value(ACTIONID).toString()\n    if action == \"Acquired\":\n\
  \        QMessageBox.information(self, \"Delete Log\",\n        \"The 'Acquired'\
  \ log record cannot be deleted.<br>\"\n        \"You could delete the asset instead.\"\
  )\n        return\n    when = unicode(record.value(DATE).toString())\n    if QMessageBox.question(self,\
  \ \"Delete Log\",\n        \"Delete log<br>%s %s?\" % (when, action),\n        QMessageBox.Yes|QMessageBox.No)\
  \ == QMessageBox.No:\n        return\n    self.logModel.removeRow(index.row())\n\
  \    self.logModel.submitAll()\n```\n\n对于操作，我们实现的逻辑是用户不能删除“Acquired”日志记录，即第一条日志记录。（但他们可以删除资产，我们稍后会看到。）如果日志记录是允许删除的，且用户确认了删除，我们只需在模型上调用\
  \ `removeRow()`，然后调用 `submitAll()` 来更新底层数据库。\n\n```python\ndef editActions(self):\n\
  \    form = ReferenceDataDlg(\"actions\", \"Action\", self)\n    form.exec_()\n\n\
  def editCategories(self):\n    form = ReferenceDataDlg(\"categories\", \"Category\"\
  , self)\n    form.exec_()\n```\n\n由于操作和类别的参考表结构相同，因此当我们想要深入添加、编辑和删除它们的记录时，可以使用同一个智能对话框。我们向对话框提供数据库中的表名，以及在用户界面显示的参考数据名称（例如在对话框的标题栏中）。\n\
  \n**图 15.6** *资产管理器参考数据表*\n\n我们不会审查图 15.6 所示的 `ReferenceDataDlg` 代码，因为它没有能教给我们任何新东西。它使用一个\
  \ `QTableView` 配合 `QSqlTableModel`，后者被设置为构造函数传入的表。编辑是就地的并由表格视图和表格模型自动处理的。\n\n\n\n\
  \n对于参考数据的删除，我们会执行一个查询来检查特定的参考数据记录是否正被其他表使用，也就是说，某个操作是否被日志表中的任何记录使用，或者某个类别是否被资产表中的任何记录使用。如果该记录正在使用中，我们会弹出一个提示性的错误消息，并不允许删除发生。否则，我们在模型上对相关行调用\
  \ `removeRow()`，然后提交 `submitAll()` 将更改提交到数据库，就像我们在删除操作时做的那样。\n\n与参考数据不同，资产的添加和删除是由主表的方法处理的。\n\
  \n```python\ndef addAsset(self):\n    row = self.assetView.currentIndex().row()\
  \ \\\n    if self.assetView.currentIndex().isValid() else 0\n    QSqlDatabase.database().transaction()\n\
  \    self.assetModel.insertRow(row)\n    index = self.assetModel.index(row, NAME)\n\
  \    assetid = 1\n    query = QSqlQuery()\n    query.exec_(\"SELECT MAX(id) FROM\
  \ assets\")\n    if query.next():\n        assetid = query.value(0).toInt()[0]\n\
  \    query.prepare(\"INSERT INTO logs (assetid, date, actionid) \" \\\n        \
  \          \"VALUES (:assetid, :date, :actionid)\")\n    query.bindValue(\":assetid\"\
  , QVariant(assetid + 1))\n    query.bindValue(\":date\", QVariant(QDate.currentDate()))\
  \ \n    query.bindValue(\":actionid\", QVariant(ACQUIRED))\n    query.exec_()\n\
  \    QSqlDatabase.database().commit()\n    self.assetView.edit(index)\n```\n\n当用户添加新资产时，我们希望为该资产创建一个新的日志记录，并将其操作设置为“获取”（Acquired）。自然地，我们希望这两个记录都被创建，或者如果发生错误，两个都不创建，为了这一点，我们必须使用事务。\n\
  \n我们首先启动事务。然后插入新行，并将其设置为资产视图中的当前行。如果这是第一个资产，其 ID 将是 1，但如果有其他资产，其 ID 将比最高资产 ID 加\
  \ 1。我们执行查询来找到当前的最高资产 ID，然后使用预处理查询（这样我们就不需要担心引号问题）向日志表中插入一条新记录。一旦新记录进入日志表，我们就提交事务。现在，我们拥有一条操作为“获取”的新资产的日志记录，以及一个新的空白资产记录。最后，我们对新资产的名称字段启动编辑。\n\
  \n我们将通过查看 `deleteAsset()` 方法来完成对主窗的审查。\n\n该方法稍微复杂，我们将分三部分来查看。\n\n```python\ndef\
  \ deleteAsset(self):\n    index = self.assetView.currentIndex()\n    if not index.isValid():\n\
  \        return\n    QSqlDatabase.database().transaction()\n    record = self.assetModel.record(index.row())\n\
  \    assetid = record.value(ID).toInt()[0]\n    logrecords = 1\n    query = QSqlQuery(QString(\"\
  SELECT COUNT(*) FROM logs \" \\\n                      \"WHERE assetid = %1\").arg(assetid))\n\
  \    if query.next():\n        logrecords = query.value(0).toInt()[0]\n```\n\n我们首先启动事务。这是因为如果删除一个资产，其所有的日志记录也必须被删除，并且这两者必须同时发生，或者都不发生，以维护数据库的关联完整性。\n\
  \n我们知道至少有一条日志记录，即“获取”记录，但我们执行查询来查看日志记录的总数是多少。\n\n```python\nmsg = QString(\"<font\
  \ color=red>Delete</font><br><b>%1</b>\"\n          \"<br>from room %2\") \\\n \
  \     .arg(record.value(NAME).toString()) \\\n      .arg(record.value(ROOM).toString())\n\
  if logrecords > 1:\n    msg += QString(\", along with %1 log records\") \\\n   \
  \         .arg(logrecords)\nmsg += \"?\"\nif QMessageBox.question(self, \"Delete\
  \ Asset\", msg, \\\n    QMessageBox.Yes|QMessageBox.No) == QMessageBox.No:\n   \
  \ QSqlDatabase.database().rollback()\n    return\n```\n\n在这里我们给用户机会确认删除或取消。\n\n\
  如果他们取消，我们就回滚事务并返回。\n\n```python\nquery.exec_(QString(\"DELETE FROM logs WHERE assetid\
  \ = %1\") \\\n          .arg(assetid))\nself.assetModel.removeRow(index.row())\n\
  self.assetModel.submitAll()\nQSqlDatabase.database().commit()\nself.assetChanged(self.assetView.currentIndex())\n\
  ```\n\n我们已经使用 SQL 查询删除了日志记录，并使用模型 API 删除了资产记录。删除后，我们提交事务并调用 `assetChanged()` 以确保主从视图显示的是正确的日志记录。\n\
  \n我们也可以使用模型 API 来执行两个删除。例如：`self.logModel.setFilter(QString(\"assetid = %1\").arg(assetid))`\
  \ `self.logModel.select()`\nif self.logModel.rowCount() > 0:\n    self.logModel.removeRows(0,\
  \ self.logModel.rowCount())\n    self.logModel.submitAll()`\n\n这完成了我们对资产管理器应用程序的审查。在表之间创建主从关系非常简单，使用数据部件映射器（data\
  \ widget mapper）也可以在表和表之间完成同样的操作。\n\n## 使用数据库表视图\n\nSQL 模型非常容易使用，并且与 `TableView`\
  \ “开箱即用”。此外，我们还可以使用代理（delegates）对字段的外观和编辑进行完全控制。\n\n我们还没有担心过的问题之一是为新记录创建唯一键。我们通过在表中使用自动递增\
  \ ID 解决了这个问题。但有时自动递增并不合适——例如，当键比简单的整数更复杂时。还有一些我们可以连接的 SQL 特有信号——例如，`beforeDelete()`\
  \ 和 `beforeUpdate()`；如果我们想在单独的表中记录删除或更改，这些信号可能很有用。最后，还有 `beforeInsert()` 信号——它在创建新记录时发射，但在用户有机会编辑它之前发射。这就是我们可能为记录填充默认值的地方。然而，在本章的所有示例中，我们都是在用户点击“添加”按钮时设置默认值的。另请注意\
  \ `QRelationalTableModel` 是 `QSqlTableModel` 的子类，它也拥有这些信号。\n\n## 总结\n\nPyQt 通过 `QtSql`\
  \ 模块提供的统一 API 对 SQL 数据库提供了强大的支持。所有常用的数据库都提供了驱动，但由于许可证限制，某些驱动仅在商业版本中可用。\n\n如果我们建立了单一数据库连接，后续所有的数据库访问将默认使用该连接。但如果我们需要多个连接，只需为每个连接命名，并通过名称访问它们，以指定哪个特定操作使用哪一个。\n\
  \n`QSqlQuery` 类允许我们使用其 `exec_()` 方法执行任意 SQL 语句。这意味着例如，我们可以使用它来创建和删除表，以及插入、更新和删除记录。`QSqlQuery`\
  \ 对象提供了导航执行 SELECT 语句时产生的结果集的方法，并且还可以提供有关受查询影响的行数的信息——例如删除了或更新了多少行。\n\n\n\n\n\n\
  # 简介\n\n使用 `QDataWidgetMapper` 创建显示数据库表（或可编辑视图）的 GUI 表单是非常简单的。我们通常为每个外键字段使用 `QComboBox`，并赋予其相应的关系模型作为其内部模型。虽然可以设置\
  \ `QDataWidgetMapper` 自动提交更改，但这可能在用户导航时导致数据丢失，因此如果我们提供了导航方式，最好由我们自己来提交所有更改。\n\n\
  使用 `QTableView` 结合 `QSqlTableModel` 或 `QSqlRelationalTableModel` 显示数据库表和视图非常容易。这些类结合在一起提供了字段数据的就地编辑功能。通过从模型中插入或删除行可以轻松实现添加和删除记录，当我们需要原子操作时，可以使用事务。\n\
  \nPyQt 的模型/视图架构的所有功能对数据库程序员都是可用的。此外，SQL 表模型的 API 经过扩展，使得数据库编程变得更加简单。当我们需要执行原始 SQL\
  \ 时，可以使用 `QSqlQuery` 类轻松实现。\n\n现在我们已经达到了可以创建任何你喜欢的 GUI 程序的程度，限制你的仅有你的想象力和可用时间。在第四部分中，我们将介绍一些处理起来比较复杂的话题，从更高级的模型/视图编程开始，然后是国际化、网络，最后以多线程结束。\n\
  \n## 练习\n\n创建一个对话框风格的应用程序，用于在参考表中添加、编辑和删除记录，如图 15.7 所示。该应用程序在首次运行时应创建 `reference.db`\
  \ 数据库，其中包含一个空表：\n\n```sql\nCREATE TABLE reference (\nid INTEGER PRIMARY KEY AUTOINCREMENT\
  \ UNIQUE NOT NULL,\ncategory VARCHAR(30) NOT NULL,\nshortdesc VARCHAR(20) NOT NULL,\n\
  longdesc VARCHAR(80))\n```\n\n除了提供“添加”和“删除”按钮外，还要提供一个“排序”按钮，该按钮具有具有三个排序顺序选项的弹出菜单：按\
  \ ID、按类别和按短描述。这三个选项都可以使用 `lambda` 或 `functools.partial` 连接到同一个方法。要使任何新的排序（或过滤）生效，你必须在模型上调用\
  \ `select()`。所有按钮都使用 `QDialogButtonBox`。\n\n![Image 75](img/index-487_1.png)\n\n\
  **图 15.7** 参考数据对话框\n\n如果用户点击“删除”，则弹出一个是/否消息框，只有当他们点击“是”按钮时才删除。该应用程序类似于 Asset Manager\
  \ 应用程序中的 `ReferenceDataDlg`，可以使用大约 130 行代码编写。\n\n解决方案位于 `chap15/referencedata.pyw`\
  \ 中。\n\n# 第四部分：高级 GUI 编程\n\n- 16: 自定义视图\n- 通用代理\n- 在树形结构中表示表格数据\n\n## 高级模型/视图编程\n\
  \n### \n\n在之前的两个章节中，我们探索了 PyQt 模型/视图编程的基础。我们看到了如何创建自定义模型，以及如何使用预定义的 SQL 表模型。我们还学习了如何创建自定义代理来控制数据项的显示和编辑。在本章中，我们将深化对\
  \ PyQt 模型/视图编程的理解。\n\n本章涵盖的所有主题以及后续主题，在概念上都比我们之前看到的更高级。然而，在大多数情况下，代码的难度并不比我们已经过的。\n\
  \n在第一节中，我们将查看如何实现自定义视图，以便看到如何以我们想要的方式将数据可视化。这一节对于深入理解视图的工作原理很有帮助，并展示了实现自定义视图的一种直接方法。\n\
  \n第二节重新回顾了自定义代理的主题，展示了如何尽量减少代码重复以及如何为视图轻松创建任意代理。这一节对于那些需要创建许多代理的人来说应该特别有用，特别是对于\
  \ SQL 表这种每一列都有特定类型的数据集。\n\n在最后一节中，我们将看到如何将表格数据反射到树形视图中。这种用途之一是当前几列通常包含相同值时，我们将表表示为树——这可以减少用户查找所需项目必须导航的行数。另一个用途是让用户选择形成“路径”的特定值。例如，与其提供多个依赖之前值的组合框，我们只需提供一个树供用户导航和选择。\n\
  \n### 自定义视图\n\nPyQt 提供了几个开箱即用的视图类，包括 `QListView`、`QTableView` 和 `QTreeView`。这些视图的一个共同点是，它们通常用于文本形式呈现数据项——尽管如果需要，它们也可以显示图标和复选框。\n\
  \n数据文本表示的替代方案是视觉表示，对于这些我们可以使用第 12 章涵盖的图形类。然而，有时我们希望以不匹配任何类的方式呈现数据。在这种情况下，我们可以创建自己的视图子类并使用它来使模型可视化。\n\
  \n**图 16.1** 水质数据的两个视图\n\n图 16.1 显示了由两个视图呈现同一个数据集。左侧视图是标准的 `QTableView`，右侧视图是自定义的\
  \ `WaterQualityView`。两者都文本形式显示水质读取的时间戳，但 `WaterQualityView` 为关键指标显示彩色圆，并使用 Unicode\
  \ 箭头符号表示流量情况。显然，表格视图以清晰准确的方式呈现了事实，而水质视图让人更容易看到任何特定时间的状况，并且通过观察颜色就能更容易对任何重要趋势获得印象。\n\
  \n水质数据集涵盖了某一个水处理厂六个月的时间——但由于每 15 分钟读取一次数据，这总计略多于 17500 次读取。这意味着我们的视图将需要一个垂直滚动条。PyQt\
  \ 提供了三种获取滚动条的方法。一种方法是创建一个继承 `QAbstractScrollArea` 的控件；这种方法被 `QGraphicsView` 和 `QTextEdit`\
  \ 控件使用。另一种方法是创建一个包含几个 `QScrollBar` 的组合控件。但 PyQt 文档推荐第三种方法——使用简单得 `QScrollArea`。使用\
  \ `QScrollArea` 的缺点是它是 PyQt 类中少数几个并非设计为子类的类之一。相反，我们必须创建一个实例并向其添加我们想要滚动条的控件。为了方便理解，这里是水质数据应用程序的初始化：\n\
  \n```python\nclass MainForm(QDialog):\n    def __init__(self, parent=None):\n  \
  \      super(MainForm, self).__init__(parent)\n        self.model = WaterQualityModel(os.path.join(\n\
  \            os.path.dirname(__file__), \"waterdata.csv.gz\"))\n        self.tableView\
  \ = QTableView()\n        self.tableView.setAlternatingRowColors(True)\n       \
  \ self.tableView.setModel(self.model)\n        self.waterView = WaterQualityView()\n\
  \        self.waterView.setModel(self.model)\n        scrollArea = QScrollArea()\n\
  \        scrollArea.setBackgroundRole(QPalette.Light)\n        scrollArea.setWidget(self.waterView)\n\
  \        self.waterView.scrollarea = scrollArea\n        splitter = QSplitter(Qt.Horizontal)\n\
  \        splitter.addWidget(self.tableView)\n        splitter.addWidget(scrollArea)\n\
  \        splitter.setSizes([600, 250])\n        layout = QHBoxLayout()\n```\n\n\n\
  \n\n\n```python\nlayout.addWidget(splitter)\nself.setLayout(layout)\nself.setWindowTitle(\"\
  Water Quality Data\")\nQTimer.singleShot(0, self.initialLoad)\n```\n\n前面的代码就是全部内容。`WaterQualityModel`\
  \ 是 `QAbstractTableModel` 的子类，提供对水质数据文件的只读访问。\n\n`WaterQualityView` 是我们将在本节中开发的类。我们在这里做过的一项特殊操作是创建了一个\
  \ `QScrollArea` 控件并将水质视图添加到其中——这基本上意味着水质视图可以根据我们的意愿设置任意宽度和高度，而滚动区域将处理滚动问题。\n\n我们很快就会看到，键盘用户可以使用向上和向下方向键在水质视图中进行导航，为了确保选定的行始终可见，我们必须将滚动区域传递给水质视图，以便我们的按键处理程序可以与它进行交互。另一个特殊之处是，我们为水平拆拆分器（horizontal\
  \ splitter）的两个部分设置了初始大小，以便它们在启动时，对于它们所包含的控件来说比例大致正确。\n\n我们现在将审查 `WaterQualityView`，从一些静态数据和初始化函数开始。\n\
  \n```python\nclass WaterQualityView(QWidget):\n    FLOWCHARS = (unichr(0x21DC),\
  \ unichr(0x21DD), unichr(0x21C9))\n\n    def __init__(self, parent=None):\n    \
  \    super(WaterQualityView, self).__init__(parent)\n        self.scrollarea = None\n\
  \        self.model = None\n        self.setFocusPolicy(Qt.StrongFocus)\n      \
  \  self.selectedRow = -1\n        self.flowfont = self.font()\n        size = self.font().pointSize()\n\
  \        if platform.system() == \"Windows\":\n            fontDb = QFontDatabase()\n\
  \            for face in [face.toLower() for face in fontDb.families()]:\n     \
  \           if face.contains(\"unicode\"):\n                    self.flowfont =\
  \ QFont(face, size)\n                    break\n            else:\n            \
  \    self.flowfont = QFont(\"symbol\", size)\n        WaterQualityView.FLOWCHARS\
  \ = (chr(0xAC), chr(0xAE), chr(0xDE))\n```\n\n将焦点策略设置为任何值（`Qt.NoFocus` 除外）意味着该控件可以接受键盘焦点。我们将在本节末尾讨论为什么要这样做，以及\
  \ `selectedRow` 实例变量。\n\n当水流方向错误、速度太慢或太快时，我们希望用合适的字符来指示这种情况——例如 `→`、`∼`、`∼→` 和 `→→`。这些字符在\
  \ Unicode 中均可用，但 Windows 提供的大多数默认字体似乎没有包含整个 Unicode 字符集，因此所有的箭头都显示为字符。（在 Linux 上，如果当前字体没有某个\
  \ Unicode 字符，PyQt 通常可以在另一个字体中找到该字符，在这种情况下，它仅对该字符使用找到的字体。）为了解决 Windows 上的这个问题，我们遍历可用字体列表，直到找到一个名称中包含“Unicode”字样的字体（例如“Lucida\
  \ Sans Unicode”）。如果我们找到了这样的字体，就将其存储为流字符的字体；否则，我们将回退到标准的（但非 Unicode）`Symbol` 字体，并使用该字体中最接近的等效字符。\n\
  \n```python\ndef setModel(self, model):\n    self.model = model\n    self.connect(self.model,\
  \ SIGNAL(\"dataChanged(QModelIndex,QModelIndex)\"), self.setNewSize)\n    self.connect(self.model,\
  \ SIGNAL(\"modelReset()\"), self.setNewSize)\n    self.setNewSize()\n```\n\n一旦在视图上设置了模型，我们就连接到它的数据更改和重置信号，以便视图可以调整大小以匹配可用数据。\n\
  \n```python\ndef setNewSize(self):\n    self.resize(self.sizeHint())\n    self.update()\n\
  \    self.updateGeometry()\n```\n\n此方法将视图调整为其首选大小，并调用 `update()` 来调度重绘，调用 `updateGeometry()`\
  \ 通知任何负责该视图的布局管理器其尺寸已更改。由于我们将视图放在 `QScrollArea` 中，滚动区域将通过调整其提供的滚动条来响应大小变化。\n\n```python\n\
  def minimumSizeHint(self):\n    size = self.sizeHint()\n    fm = QFontMetrics(self.font())\n\
  \    size.setHeight(fm.height() * 3)\n    return size\n```\n\n我们计算视图的最小尺寸为其首选尺寸的宽度和三个字符的高度。在布局中这是合理的，但由于使用了\
  \ `QScrollArea`，实际上的最小尺寸将取决于滚动区域的决定。\n\n```python\ndef sizeHint(self):\n    fm =\
  \ QFontMetrics(self.font())\n    size = fm.height()\n    return QSize(fm.width(\"\
  9999-99-99 99:99 \") + (size * 4), (size / 4) + (size * self.model.rowCount()))\n\
  ```\n\n我们使用一个字符的高度（包括其行间距）作为垂直和水平测量的尺寸单位。视图的首选宽度足够显示一个时间戳加上四个单位的尺寸，以留出彩色圆形和流字符的空间；高度也足够容纳模型中的所有行加上四分之一的尺寸单位，以留出一点边距。\n\
  \n绘制事件（paint event）并不困难，但我们将分三个部分来看，并只显示彩色圆，因为所有部分的代码是相似的。\n\n```python\ndef paintEvent(self,\
  \ event):\n    if self.model is None:\n        return\n    fm = QFontMetrics(self.font())\n\
  \    timestampWidth = fm.width(\"9999-99-99 99:99 \")\n    size = fm.height()\n\
  \    indicatorSize = int(size * 0.8)\n    offset = int(1.5 * size)\n    minY = event.rect().y()\n\
  \    maxY = minY + event.rect().height()\n    minY -= size # 等待，根据提供的文本逻辑\n    painter\
  \ = QPainter(self)\n    painter.setRenderHint(QPainter.Antialiasing)\n    painter.setRenderHint(QPainter.TextAntialiasing)\n\
  \n    y = 0\n    for row in range(self.model.rowCount()):\n        x = 0\n     \
  \   if minY <= y <= maxY:\n            painter.save()\n            painter.setPen(self.palette().color(QPalette.Text))\n\
  \            if row == self.selectedRow:\n                painter.fillRect(x, y\
  \ + offset * 0.8, self.width(), size, self.palette().highlight())\n            painter.setPen(self.palette().color(QPalette.HighlightedText))\n\
  \            timestamp = self.model.data(self.model.index(row, TIMESTAMP)).toDateTime()\n\
  \            painter.drawText(x, y + size, timestamp.toString(TIMESTAMPFORMAT))\n\
  \            x += timestampWidth\n            temperature = self.model.data(self.model.index(row,\
  \ TEMPERATURE))\n            temperature = temperature.toDouble()[0]\n         \
  \   if temperature < 20:\n                color = QColor(0, 0, int(255 * (20 - temperature)\
  \ / 20))\n            elif temperature > 25:\n                color = QColor(int(255\
  \ * temperature / 100), 0, 0)\n            else:\n                color = QColor(0,\
  \ int(255 * temperature / 100), 0)\n            painter.setPen(Qt.NoPen)\n     \
  \       painter.setBrush(color)\n            painter.drawEllipse(x, y + offset,\
  \ indicatorSize, indicatorSize)\n            painter.restore()\n        x += size\n\
  \    y += size\n```\n\n\n\n\n我们遍历模型中的每一行，但只对那些 `y` 坐标在范围内的行进行绘制。一旦确定了要绘制的行，我们就将画笔（用于绘制文本）设置为调色板的文本颜色。如果该行被选中（我们将在介绍完\
  \ `paint` 事件后进行解释），我们就用调色板的高亮颜色绘制背景，并将画笔设置为调色板的高亮文本颜色。\n\n在设置好文本颜色并可能已经绘制了背景后，我们接着获取并绘制该行的时间戳。对于每一行，我们都保留一个\
  \ `x` 坐标，告诉我们向右移动了多远，并根据之前计算的字体度量时间戳宽度递增它。\n\n第一个彩色圆圈用于表示以 °C 为单位的水温。如果水太冷，我们使用带有蓝色调的颜色；如果水太热，我们使用带有红色调的颜色；否则，我们使用绿色调。然后我们关闭画笔，将画刷设置为我们设置的颜色，并在时间戳右侧绘制一个椭圆。`drawEllipse()`\
  \ 方法会绘制出一个圆，因为绘制椭圆的矩形宽度和高度是相同的。\n\n接着我们增加 `x` 坐标。现在我们对另外两个彩色圆圈指示器重复过程，使用与处理温度时相同的着色方法。我们省略了这些代码，因为它们在结构上与温度圆圈的代码完全相同。\n\
  \n```\nflow = self.model.data(\n    self.model.index(row, INLETFLOW))\n\nflow =\
  \ flow.toDouble()[0]\n\nchar = None\n\nif flow <= 0:\n    char = WaterQualityView.FLOWCHARS[0]\n\
  elif flow < 3:\n    char = WaterQualityView.FLOWCHARS[1]\nelif flow > 5.5:\n   \
  \ char = WaterQualityView.FLOWCHARS[2]\n\nif char is not None:\n    painter.setFont(self.flowfont)\n\
  \    painter.drawText(x, y + size, char)\n\npainter.restore()\ny += size\n\nif y\
  \ > maxY:\n    break\n```\n\n如果水流方向错误，或者速度过慢或过快，我们就使用初始化函数中设置的字体和字符绘制一个合适的字符。\n\n\
  最后，我们增加 `y` 坐标以准备处理下一行数据，但如果我们已经超过了视图中的最后一行，则停止。\n\n我们目前为止编写的代码已经足够为数据集提供只读视图。但用户通常想要高亮项目。实现这一点最简单的方法是添加一个鼠标点击事件处理器。\n\
  \n```python\ndef mousePressEvent(self, event):\n    fm = QFontMetrics(self.font())\n\
  \    self.selectedRow = event.y() // fm.height()\n    self.update()\n    self.emit(SIGNAL(\"\
  clicked(QModelIndex)\"),\n            self.model.index(self.selectedRow, 0))\n```\n\
  \n我们所有计算中使用的尺寸单位是字符的高度。我们将鼠标位置的 `y` 坐标（相对于小组件左上角）除以尺寸单位，以找到用户点击了哪一行。我们使用整数除法，因为行号是整数。然后我们调用\
  \ `update()` 来调度一个绘制事件。在见过的 `paintEvent()` 中，我们看到选中的行是使用高亮文本和背景颜色绘制的。我们还发射一个 `clicked()`\
  \ 信号，并带有被点击行第一列的模型索引。\n\n该应用程序没有使用该信号，但在实现自定义视图时，提供该信号是一个良好的习惯。\n\n键盘用户已经通过滚动区域得到了照顾：他们可以使用\
  \ Page Up 和 Page Down 键进行滚动。但我们应该为键盘用户提供一种选择项目的方法。要做到这一点，我们必须确保小组件具有合适的焦点策略——我们在初始化函数中已经做过了——并且必须提供一个按键事件处理器。\n\
  \n```python\ndef keyPressEvent(self, event):\n    if self.model is None:\n     \
  \   return\n    row = -1\n    if event.key() == Qt.Key_Up:\n        row = max(0,\
  \ self.selectedRow - 1)\n    elif event.key() == Qt.Key_Down:\n        row = min(self.selectedRow\
  \ + 1, self.model.rowCount() - 1)\n    if row != -1 and row != self.selectedRow:\n\
  \        self.selectedRow = row\n    if self.scrollarea is not None:\n        fm\
  \ = QFontMetrics(self.font())\n        y = fm.height() * self.selectedRow\n    \
  \    self.scrollarea.ensureVisible(0, y)\n        self.update()\n    self.emit(SIGNAL(\"\
  clicked(QModelIndex)\"),\n            self.model.index(self.selectedRow, 0))\n \
  \   else:\n        QWidget.keyPressEvent(self, event)\n```\n\n我们选择仅支持两个按键：向上箭头和向下箭头。如果用户按下其中任何一个键，我们就增加或减少选中的行，并确保选中的行在范围内，然后调度一个绘制事件。\n\
  \n如果用户导航到最顶部可见行之上或最底部可见行之下，我们告诉滚动区域确保滚动到的行是可见的——如果有必要，滚动区域将通过滚动来实现这一点。我们还会带有新选行的模型索引发射一个\
  \ `clicked()` 信号。\n\n在这种情况下使用 `clicked()` 信号是非常惯例的，因为实际上用户正在使用键盘进行“点击”——毕竟，信号槽机制关注的是用户想要什么，而不是如何请求，而这里他们只想选择一行。\n\
  \n如果我们不自己处理按键，即我们将其他按键传递给基类。\n\n水质量视图组件与旁边的表格视图在视觉上非常不同，但实现它并没有大量代码，编写也不困难。通过减少不必要的绘制，我们使组件相当高效。通过确保组件的大小恰好显示整个数据集，我们进一步简化了绘制代码。这种方法的缺点是将责任推给了使用我们组件的程序员去使用\
  \ `ScrollArea`，尽管这避免了我们自己实现滚动。\n\n水质量视图与模型数据是一一对应的可视化，但我们并不限于此。也可以创建显示聚合数据的自定义视图。例如，我们可以每天或每小时显示一个项目，通过平均每天或每小时的读取。\n\
  \n## 通用委托器\n\n正如我们在前面的章节中所看到的，自定义委托器允许我们对视图中数据项的外观和行为进行完全控制。显而易见，如果我们有很多模型，我们可能为它们的大部分甚至全部创建一个自定义委托器，但不明显的是这些自定义委托器之间会有大量的重复代码。\n\
  \n假设我们只有四个模型，每个模型都有一个整数 ID 列、一些存储纯文本的字符串列以及一个存储 HTML 文本的描述列，某些模型还有一或两个浮点列。所有模型都将\
  \ ID 作为第一列，但其他列并不匹配，因此每个模型都需要自己的自定义委托器。提供这些自定义委托器并不是一项大工程，但处理整数 ID 的代码在所有模型中可能是相同的；字符串、HTML\
  \ 字符串和浮点数也是如此。\n\n现在假设我们必须为另外六个新模型编写自定义委托器：大部分代码将再次重复——这可能会使维护变得更加困难。\n\n对于每列只有一种数据类型的模型（例如数据库表），更好的方法是，如果我们不是为每个模型创建一个自定义委托器，而是从一组通用组件中组合出一个委托器，就好了。这意味着维护工作将局限于通用组件，而且其中一个组件的错误修复将自动使所有使用它的视图受益。\n\
  \n\n\n在代码中，我们想要的效果如下：\n\n```python\nself.table1 = QTableView()\nself.table1.setModel(self.model1)\n\
  \ndelegate1 = GenericDelegate(self)\ndelegate1.insertColumnDelegate(1, PlainTextColumnDelegate())\n\
  delegate1.insertColumnDelegate(2, PlainTextColumnDelegate())\ndelegate1.insertColumnDelegate(3,\
  \ RichTextColumnDelegate())\ndelegate1.insertColumnDelegate(4, IntegerColumnDelegate())\n\
  self.table1.setItemDelegate(delegate1)\n\nself.table2 = QTableView()\nself.table2.setModel(self.model2)\n\
  delegate2 = GenericDelegate(self)\ndelegate2.insertColumnDelegate(1, PlainTextColumnDelegate())\n\
  delegate2.insertColumnDelegate(2, IntegerColumnDelegate())\ndelegate2.insertColumnDelegate(3,\
  \ FloatColumnDelegate())\ndelegate2.insertColumnDelegate(4, FloatColumnDelegate())\n\
  delegate2.insertColumnDelegate(5, RichTextColumnDelegate())\nself.table2.setItemDelegate(delegate2)\n\
  ```\n\n这里有两个独立的模型，但它们都使用了通用型代理（generic delegates），这些通用代理由针对特定数据类型的预定义列代理组成。\n\n\
  通过这种方法，对于我们需要处理的每个数据类型（如整数、浮点数、日期、时间以及日期/时间），我们只需要创建一个纯文本列代理、一个富文本列代理等，以此此类推。\n\n\
  此外，我们可能会创建一些项目特定的列代理来处理自定义类型，但对于任何给定的数据类型，只会有一个列代理，这极大地减少了代码重复，并确保任何模型都可以通过使用带有合适列代理的通用代理来拥有一个“自定义”代理。\n\
  \n在本节中，我们将看到如何创建一个 `GenericDelegate` 类以及几个示例列代理。然后，我们将看到它们在图 16.2 所示的应用程序上下文中是如何被使用的。\n\
  \n**图 16.2** 使用通用代理的表格视图\n\n`GenericDelegate` 类非常简单，因为它将几乎所有的工作都交给了其他类。\n\n```python\n\
  class GenericDelegate(QItemDelegate):\n    def __init__(self, parent=None):\n  \
  \      super(GenericDelegate, self).__init__(parent)\n        self.delegates = {}\n\
  ```\n\n初始化函数像往常一样调用 `super()` 并创建一个空字典。键将是列索引，值将是 `QItemDelegate` 子类的实例。\n\n```python\n\
  \    def insertColumnDelegate(self, column, delegate):\n        delegate.setParent(self)\n\
  \        self.delegates[column] = delegate\n```\n\n当一个新的列代理被插入通用代理时，通用代理会接管它的所有权并将其插入字典。\n\
  \n```python\n    def removeColumnDelegate(self, column):\n        if column in self.delegates:\n\
  \            del self.delegates[column]\n```\n\n包含此方法是为了完整性考虑，但它不太会被使用。如果删除了列代理，通用代理将简单地对该列使用\
  \ `QItemDelegate` 基类。\n\n```python\n    def paint(self, painter, option, index):\n\
  \        delegate = self.delegates.get(index.column())\n        if delegate is not\
  \ None_:\n            delegate.paint(painter, option, index)\n        else:\n  \
  \          QItemDelegate.paint(self, painter, option, index)\n```\n\n该方法的结构是 `GenericDelegate`\
  \ 类工作原理的关键。我们首先获取给定列的列代理。如果获取了代理，我们就将工作交给它；否则，我们将工作交给基类。\n\n```python\n    def createEditor(self,\
  \ parent, option, index):\n        delegate = self.delegates.get(index.column())\n\
  \        if delegate is not None:\n            return delegate.createEditor(parent,\
  \ option, index)\n        else:\n            return QItemDelegate.createEditor(self,\
  \ parent, option, index)\n```\n\n此方法遵循与 `paint()` 方法相同的模式，不同之处在于它返回一个值（为它创建的编辑器）。\n\
  \n```python\n    def setEditorData(self, editor, index):\n        delegate = self.delegates.get(index.column())\n\
  \        if delegate is not None:\n            delegate.setEditorData(editor, index)\n\
  \        else:\n            QItemDelegate.setEditorData(self, editor, index)\n\n\
  \    def setModelData(self, editor, model, index):\n        delegate = self.delegates.get(index.column())\n\
  \        if delegate is not None:\n            delegate.setModelData(editor, model,\
  \ index)\n        else:\n            QItemDelegate.setModelData(self, editor, model,\
  \ index)\n```\n\n最后两个 `GenericDelegate` 方法遵循与 `paint` 和 `createEditor()` 方法相同的模式：如果为给定列设置了列代理，则使用该列代理，否则使用\
  \ `QItemDelegate` 基类。\n\n现在我们已经看到了 `GenericDelegate` 的实现，可以将注意力转移到可以插入它的列代理上了。在\
  \ `chap16/genericdelegates.py` 中，我们提供了 `IntegerColumnDelegate`、`DateColumnDelegate`、`PlainTextColumnDelegate`\
  \ 和 `RichTextColumnDelegate` 类。它们具有相似的结构，因此我们将只查看其中两个的代码：`DateColumnDelegate` 和\
  \ `RichTextColumnDelegate`。一旦理解了这些实现（至少对于日期列代理来说很容易），创建额外的列代理（例如用于浮点数的代理）将是轻而易举的。\n\
  \n```python\nclass DateColumnDelegate(QItemDelegate):\n    def __init__(self, minimum=QDate(),\
  \ maximum=QDate(), format=\"yyyy-MM-dd\", parent=None):\n        super(DateColumnDelegate,\
  \ self).__init__(parent)\n        self.minimum = minimum\n        self.maximum =\
  \ maximum\n        self.format = QString(format)\n```\n\n对于日期，我们需要提供最小值、最大值以及显示格式。\n\
  \n```python\n    def createEditor(self, parent, option, index):\n        dateedit\
  \ = QDateEdit(parent)\n        dateedit.setDateRange(self.minimum, self.maximum)\n\
  \        dateedit.setAlignment(Qt.AlignRight)\n        dateedit.setDisplayFormat(self.format)\n\
  \        dateedit.setCalendarPopup(True)\n        return dateedit\n\n    def setEditorData(self,\
  \ editor, index):\n        value = index.model().data(index, Qt.DisplayRole).toDate()\n\
  \        editor.setDate(value)\n\n    def setModelData(self, editor, model, index):\n\
  \        model.setData(index, QVariant(editor.date()))\n```\n\n将编辑器数据写回模型，我们再次不需要检查列，因为这由\
  \ `GenericDelegate` 处理。这就是完整的 `DateColumnDelegate`。我们没有重写 `paint()` 方法，因为 `QItemDelegate`\
  \ 基类可以很好地绘制数据。`IntegerColumnDelegate` 和 `PlainTextColumnDelegate` 都与 `DateColumnDelegate`\
  \ 非常相似。`RichTextColumnDelegate` 同样相似，但它重写了 `paint()` 和 `sizeHint()` 方法。\n\n```python\n\
  class RichTextColumnDelegate(QItemDelegate):\n    def __init__(self, parent=None):\n\
  \        super(RichTextColumnDelegate, self).__init__(parent)\n```\n\n构造函数比其他列代理使用的更简单。我们甚至可以省略它，但我们倾向于显式表示。\n\
  \n```python\n    def createEditor(self, parent, option, index):\n        lineedit\
  \ = richtextlineedit.RichTextLineEdit(parent)\n        return lineedit\n```\n\n\
  我们使用了第 13 章中创建的 `RichTextLineEdit`。`RichTextLineEdit` 接受 HTML 文本，只要我们使用它的 `setHtml()`\
  \ 方法。（它也有一个 `setPlainText()` 方法。）\n\n```python\n    def setEditorData(self, editor,\
  \ index):\n        value = index.model().data(index, Qt.DisplayRole).toString()\n\
  \        editor.setHtml(value)\n\n    def setModelData(self, editor, model, index):\n\
  \        model.setData(index, QVariant(editor.toSimpleHtml()))\n```\n\n\n\n\n`RichTextLineEdit`\
  \ 有一个 `toHtml()` 方法，但我们使用了在第 13 章开发的 `toSimpleHtml()` 方法。这确保了我们存储的是能够有效表示文本的最短 HTML。这很重要，因为在\
  \ `paint()` 方法中，对于高亮（即被选中）的项，我们将通过将文本包裹在 `<font>` 标签来设置颜色——这对于使用简单 HTML 格式的文本有效（因为它只是\
  \ HTML 片段），但对于作为完整 HTML 文档的普通 HTML 格式无效。\n\n```python\ndef paint(self, painter,\
  \ option, index):\n    text = index.model().data(index, Qt.DisplayRole).toString()\n\
  \    palette = QApplication.palette()\n    document = QTextDocument()\n    document.setDefaultFont(option.font)\n\
  \    if option.state & QStyle.State_Selected:\n        document.setHtml(QString(\"\
  <font color=%1>%2</font>\") \\\n        .arg(palette.highlightedText().color().name())\
  \ \\\n        .arg(text))\n    else:\n        document.setHtml(text)\n    painter.save()\n\
  \    color = palette.highlight().color() \\\n    if option.state & QStyle.State_Selected\
  \ \\\n    else QColor(index.model().data(index, Qt.BackgroundColorRole))\n    painter.fillRect(option.rect,\
  \ color)\n    painter.translate(option.rect.x(), option.rect.y())\n    document.drawContents(painter)\n\
  \    painter.restore()\n```\n\n`paint()` 方法几乎与第 14 章描述的 `ShipDelegate` 绘图时使用的方法相同。唯一的区别是，我们不需要检查特定列中的富文本，因为我们知道列代理只只会在用户指定的列上被调用。\n\
  \n这种方法的一个局限性是高亮功能仅对 HTML 片段有效。如果我们想让代码同时处理片段和完整的 HTML 文档，我们可以使用如下所示的代码：\n\n```python\n\
  if option.state & QStyle.State_Selected:\n    if text.startsWith(\"<html>\"):\n\
  \        text = QString(text).replace(\"<body \",\n        QString(\"<body bgcolor=%1\
  \ \")\n        .arg(palette.highlightedText().color().name()))\n    else:\n    \
  \    text = QString(\"<font color=%1>%2</font>\")\\\n        .arg(palette.highlightedText().color().name())\\\
  \n        .arg(text))\ndocument.setHtml(text)\n```\n\n另一种方法是提取文本文档的样式表，更新背景颜色，并将更新后的样式表设置回文档。\n\
  \n```python\ndef sizeHint(self, option, index):\n    text = index.model().data(index).toString()\n\
  \    document = QTextDocument()\n    document.setDefaultFont(option.font)\n    document.setHtml(text)\n\
  \    return QSize(document.idealWidth() + 5, option.fontMetrics.height())\n```\n\
  \n### 尺寸 (Size)\n\n我们必须自己计算富文本列的尺寸提示（size hint），因为基于控件字体大小和字符数量计算的尺寸提示通常会给出一个宽得宽度。这是因为文本代理中的\
  \ HTML 文本包含的字符（如标签和实体）通常远于实际显示的字符数。使用 `QTextDocument` 可以很容易地解决这个问题。代码与 `ShipDelegate`\
  \ 的 `size hint` 方法中使用的代码几乎相同。我们可以轻松地创建其他列代理，并且可以让任何列代理提供比此处示例更多的功能。例如，对于 `IntegerColumnDelegate`，我们有最小值和最大值，但提供额外的选项（如前缀和后缀文本）非常简单。\n\
  \n### 第 16 章。高级模型/视图编程\n\n现在我们已经看到了 `GenericDelegate` 是如何工作的以及如何创建列代理，我们可以看到它们在实践中是如何被使用的。图\
