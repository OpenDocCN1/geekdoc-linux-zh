  \ `su` 或 `sudo`），或者知道使用 `configure` 的 `--prefix` 选项进行本地安装。\n\n安装所需的文件有 `qt-x11-opensource-src-4.2.3.tar.gz`、`Python-2.5.1.tgz`、`sip-4.6.tar.gz`\
  \ 以及 `PyQt-x11-gpl-4.2.tar.gz`。书中示例位于 `pyqtbook.tar.gz` 文件中。\n\n首先获取 Qt。访问 http://www.trolltech.com/developer/downloads/qt/index\
  \ 并点击 Qt/11 Source Edition 链接，在页面底部下载 `qt-x11-opensource-src-4.2.3.tar.gz`。后续的版本（例如\
  \ 4.3.1）也可以。现在是获取 Python 的时候了。访问 http://www.python.org/download 并点击当前的版本链接。\n\n\
  ##附录 A. 从源码编译（最后步骤）\n\n如果你从源码编译——首先，C++ 编译器和工具链（如 `make`）已安装并可用；其次，以 `root` 身份安装（使用\
  \ `su` 或 `sudo`）。\n\n首先你需要构建 Qt。如果你使用 `sudo`，最后一行应该是 `sudo make install`。\n\n```bash\n\
  cd $HOME/packages\ntar xvfz qt-x11-opensource-src-4.2.3.tar.gz\ncd qt-x11-opensource-src-4.2.3\n\
  ./configure -fast -qt-sql-sqlite -no-qt3support\nmake\nmake install\n```\n\n`-qt-sql-sqlite`\
  \ 选项将构建 SQLite 内数据库；这在第 15 章中用到，但如果需要可以省略。`-fast` 和 `-no-qt3support` 选项应该稍微缩短构建时间，但两者都可以安全省略。如果你想查看还有哪些可用选项，包括可以安装的数据库驱动程序，运行\
  \ `./configure -help`。构建 Qt 需要长时间（取决于处理器，从半小时到三个小时不等），因为它有超过 600,000 行 C++ 代码。\n\
  \nPython 和 SIP 没有那么慢。接下来你应该构建 Python，同样如果你使用 `sudo`，则使用 `sudo make install`。\n\n\
  ```bash\ncd $HOME/packages\ntar xvfz Python-2.5.1.tgz\ncd Python-2.5.1\n./configure\n\
  make\nmake install\n```\n\n完成后，你可以执行最后两个阶段，构建 SIP 然后 PyQt，方法与你构建 Qt 和 Python 的有不同。\n\
  \n```bash\ncd $HOME/packages\ntar xvfz sip-4.6.tar.gz\ncd sip-4.6\npython configure.py\n\
  make\nmake install\n```\n\n\n\n\n\n这假设（正确版本的）Python 已经在你的 `$PATH` 中。如果情况并非如此（例如，因为你安装了两个或多个版本的\
  \ Python），请提供适当 Python 可执行文件的完整路径——例如`$HOME/opt/python25/bin/python configure.py`。一旦安装了\
  \ SIP，就可以安装 PyQt。\n\n```bash\ncd $HOME/packages\ntar xvfz PyQt-x11-gpl-4.2.tar.gz\n\
  cd PyQt-x11-gpl-4.2\npython configure.py\nmake\nmake install\n```\n\n与安装 SIP 一样，这假设正确版本的\
  \ Python 已经在你的 `$PATH` 中。同样，如果情况并非如此，在运行 `configure.py` 时请提供适当 Python 可执行文件的完整路径。`make`阶段可能需要很长时间（但没有构建\
  \ Qt 那么长）。\n\nQt、Python 和 PyQt 都提供了 HTML 格式的文档。将这些文档移动到持久的地方并在浏览器中添加合适的书签是值得的。这三者还带有许多示例；至少值得查看\
  \ PyQt 示例并运行演示程序。（例如，切换目录到 `$HOME/PyQt-x11-gpl-4.2/examples/tools/qtdemo` 并运行 `./qtdemo.py`。）\n\
  \n如果你下载了书中的示例，你可能希望在 `$HOME` 中解压 pyqtbook.tar.gz，得到一个包含所有书籍示例和练习题答案（按章节分类）的 `$HOME/pyqt`\
  \ 目录。在 `$HOME/pyqt` 目录中你会发现 `mkpyqt.py` 和 `makepyqt.pyw`；你可能希望将它们移动（或软链接）到 `$PATH`\
  \ 中的某个目录——例如 `$HOME/bin` 以方便使用。某些示例依赖于 *Qt Designer*.ui 文件或 `.qrc` 资源文件。如何将这些转换为\
  \ Python 模块在第 207 页介绍，但目前只需执行转换可能更方便：★\n\n如果 `mkpyqt.py` 不起，你必须编辑 `mkpyqt.py` 文件，并至少硬编码\
  \ `pyuic4` 的路径。\n\n574\n\n## 附录 A 安装\n\n```bash\ncd $HOME/pyqt\n./mkpyqt.py -r\n\
