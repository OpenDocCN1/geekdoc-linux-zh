  \ 为具有规则语法的纯文本（如源代码）提供语法亮是非常简单的。处理多行结构也可以很容易完成。最困难的部分是处理歧义和某些特殊情况，例如引用字符串内部引号，或者位于引号或其他抵消其语法意义的结构中的注释开始符号。另一种方法是使用\
  \ `QScintilla` 编辑器。\n\n`QTextEdit` 类非常强大且多功能。开箱即可用于编辑纯文本和 HTML。创建 `QTextEdit` 子类以提供按键和键菜单事件处理器来给用户提供基本的格式选项并不困难，而且这些技术可以轻松扩展，以提供菜单和工具栏，用户可以通过这些工具添加、编辑和删除列表、表格和图像，并可以在字符级（如下划线和删除线）或段落级（如左对齐、右对齐、居中或对齐）应用格式。\n\
  \n`QTextEdit.toHtml()` 返回的 HTML 相当冗长，因为它必须支持广泛的 HTML 标签。我们可以提供自己的方法来遍历 `QTextDocument`\
  \ 的结构并输出自己的格式。在示例中，我们输出了简单得短的 HTML，但相同的方法也可以用于输出 XML 或其他类型的标记。\n\n将大多数简单格式应用到底层的\
  \ `QTextDocument`（`QTextEdit`、`QTextBrowser`、`QLabel` 和 `GraphicsTextItem` 使用）是非常简单的。应用高级格式（如表格）可能会更复杂，因为我们必须小心嵌套块。打印文档可以通过间接输出\
  \ HTML 或 SVG，也可以直接使用 `QPrinter` 来产生。在这两种情况下，`QTextDocument` 都可以被要求在打印机上打印，或在 `QPainter`\
  \ 上绘制。\n\n对于不熟悉样式表的人来说这也是容易的方法，通过样式属性可以实现大量的控制。\n\n412\n\n*第 13 章. 富文本与打印*\n\n使用\
  \ `QPainter` 绘制到任意设备（如小部件），并且可以打印。\n\n### **练习**\n\n添加两个新操作：缩进和取消缩进，快捷键为 `Ctrl]`\
