  `range()` 函数将在第 2 章学习循环时介绍，而 `open()` 函数将在第 6 章学习文件读写操作时介绍。`hasattr()` 和 `isinstance()`\
  \ 函数将在第 3 章介绍。\n\n对于序列相关的函数，`max()` 和 `min()` 适用于包含字符串和数字的序列，但可能会得出意料之外的结果：\n\n\
  ```python\n>>> x = \"Zebras don't sail\"\n>>> max(x), min(x)\n('t', ' ')\n```\n\n\
  排序是基于 `str` 字符串的字节值以及 unicode 字符串的代码点完成的。例如，`ord(\"Z\")` 是 90，而 `ord(\"t\")` 是 116。\n\
  \nPython 的一些内置数学函数如表 1.9 所示。\n\nPython 还提供了一个数学库，包含了我们预期的所有标准函数。我们可以通过导入 `math`\
  \ 模块并使用 `dir()` 来发现它们是什么：\n\n```python\n>>> import math\n>>> dir(math)\n['__doc__',\
  \ '__file__', '__name__', 'acos', 'asin', 'atan', 'atan2',\n'ceil', 'cos', 'cosh',\
  \ 'degrees', 'e', 'exp', 'fabs', 'floor', 'fmod',\n'frexp', 'hypot', 'ldexp', 'log',\
  \ 'log10', 'modf', 'pi', 'pow',\n'radians', 'sin', 'sinh', 'sqrt', 'tan', 'tanh']\n\
  ```\n\n### 内置函数\n\n前三个项是特殊方法（以前后双下划线表示）；我们将在第 3 章学习更多关于特殊方法的知识。\n\n其余所有的都是函数，`math.e`\
  \ 和 `math.pi` 是常量。\n\n我们可以交互式地查看某个项目的类型。例如：\n\n```python\n>>> import math\n>>> type(math.pi),\
  \ type(math.sin)\n(<type 'float'>, <type 'builtin_function_or_method'>)\n>>> math.pi,\
  \ math.sin\n(3.1415926535897931, <built-in function sin>)\n>>> math.sin(math.pi)\n\
  1.2246063538223773e-16\n```\n\n起初通过这种交互方式探索 Python 提供的功能是非常实用的，但阅读文档，特别是快速浏览“库引用”，将对\
  \ Python 标准库提供的功能有一个广泛的概述。\n\n## 总结\n\n在本章中，我们看到了使用赋值运算符 `=` 进行赋值、使用 `+` 进行数值加法（涉及\
  \ `int` 到 `float` 的类型提升）以及使用 `+=` 进行复合赋值。我们还看到了 `print` 运算符，并了解到由于 IDLE 会自动打印表达式，因此在用\
  \ IDLE 时我们很少使用 `print`。我们还看到注释是通过 `#` 引入的并持续到行尾。事实上，Python 可以用分号分隔语句，但这样做非常不常见：在\
  \ Python 中，一个语句占据一行；换行符是语句的分隔符。\n\n我们学习了如何使用引号创建 Python 字符串，以及如何使用 `[]` 和 `+` 运算符对字符串进行切片和拼接。我们还总结了\
  \ Python 字符串提供的一些关键方法：将在整书中看到这些方法的大量示例。我们看到 `QString` 是一个独特的 Unicode 字符串类型，在使用 PyQt\
  \ 编程时，我们需要一套策略来管理 `QString` 和 Python 字符串（通常为 unicode 字符串）的使用。\n\n本章介绍了 Python 的主要集合类型。元组提供了一种将项分组的好方法，并可以作为字典的键。列表是有序的且包含重复项。它们提供了快速的插入、删除以及基于索引的查找。字典无序且具有唯一的键。与列表一样，它们提供了快速的插入和删除，以及快速基于键的查找。集合可以被视为不值的字典。我们将在书剩余范围内充分利用所有这些类型。\n\
  \n值 `0.00000000000000012246063538223773` 如预期接近 `0`。\n\n### 第 1 章 数据类型和数据结构\n\n最后，我们快速了解了\
  \ Python 的一些内置功能及其其中一个数学模块。在第 3 章中，我们将学习如何创建自己的模块。但在那之前，我们需要学习 Python 的控制结构，以便能够进行分支、循环、调用自定义函数以及处理异常——这些都是下一章的主题。\n\
