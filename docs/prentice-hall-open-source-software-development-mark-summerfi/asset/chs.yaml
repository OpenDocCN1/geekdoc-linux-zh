  \ *第 15 章 数据库*\n\n### 表 15.1 选定的 QSqlQuery 方法\n\n| 语法 | 说明 |\n| :--- | :--- |\n\
  | `q.addBindValue(v)` | 在 `QSqlQuery q` 使用位置值绑定时，将 `QVariant v` 添加为下一个变量 |\n| `q.bindValue(p,\
  \ v)` | 在 `QSqlQuery q` 使用占位符值绑定时，将 `QVariant v` 设置为字符串 `p` 占位符的值 |\n| `q.boundValue(p)`\
  \ | 返回 `QSqlQuery q` 中字符串 `p` 占位符的 `QVariant` 值 |\n| `q.driver()` | 返回与 `QSqlQuery\
  \ q` 关联的 `QSqlDriver`。`QSqlDriver` 类提供了 `hasFeature()` 来报告底层数据库支持的功能 |\n| `q.exec_(s)`\
  \ | 在 `QSqlQuery q` 上执行字符串 `s` 中的 SQL 查询 |\n| `q.first()` | 在执行 `SELECT` 查询后，导航到\
  \ `QSqlQuery q` 结果集的第一条记录 |\n| `q.isActive()` | 如果查询处于“激活”状态则返回 True——例如在执行 `SELECT`\
  \ 查询后 |\n| `q.isValid()` | 如果查询位于有效记录上则返回 True；在执行 `SELECT` 查询后，只有当 `isActive()`\
  \ 为 True 且已导航到记录时，它才为 True |\n| `q.last()` | 在执行 `SELECT` 查询后，导航到 `QSqlQuery q`\
  \ 结果集的最后一条记录 |\n| `q.lastError()` | 返回 `QSqlError` 对象；该对象提供 `error()` 方法 |\n| `q.next()`\
  \ | 在执行 `SELECT` 查询后，导航到 `QSqlQuery q` 结果集的下一条记录。这是正向遍历结果集唯一需要的方法 |\n| `q.numRowsAffected()`\
  \ | 返回刚刚执行的 SQL 查询影响的行数，前提是它不是 `SELECT` 语句且底层数据库支持此功能 |\n| `q.prepare(s)` | 准备字符串\
  \ `s` 中的查询，以供 `q` 执行 |\n| `q.previous()` | 在执行 `SELECT` 查询后，导航到 `QSqlQuery q` 结果集的上一条记录\
  \ |\n| `q.record()` | 返回一个包含 `QSqlQuery q` 当前记录的 `QSqlRecord` 对象（如果有）；使用带字段索引参数的\
  \ `QSqlQuery.value()` 通常更方便 |\n| `q.size()` | 返回 `SELECT` 结果集中的行数，如果未执行 `SELECT`\
  \ 或底层数据库不支持此功能，则返回 -1 |\n| `q.value(i)` | 返回当前记录中字段索引 `int i` 的 `QVariant` 值（如果有）\
  \ |\n\n## 执行 SQL 查询\n\n451\n\n每个导航方法在查询的内部记录指针成功移动到有效记录上时，都会返回 True；这就是为什么我们在访问第一条记录之前要调用\
  \ `QSqlQuery.next()`。如果发生错误或越过了最后一条（或第一条）记录，它们将返回 False。\n\n在导航大型结果集时，只要我们只使用 `next()`\
  \ 或仅正向 `seek()`()`，就可以调用 `QSqlQuery.setForwardOnly(True)`。这对于某些数据库可以显著提高性能、减少内存开销或两者兼顾。\n\
  \n`QSqlQuery.value()` 方法接受一个索引位置参数，基于 `SELECT` 语句中给出的字段顺序。由于此原因，不建议使用 `SELECT *`，因为在这种情况下我们不知道字段的顺序。每个字段都作为\
  \ `QVariant` 返回，因此必须转换为正确的类型。在日期/时间的情况下，我们首先将它们从 `QVariant` 转换为 `QDateTime`，然后转换为\
  \ `QString`，最后转换为 `unicode`，准备在控制台上打印。\n\n我们使用了一个额外的查询来根据 ID 查找结果的名称，如果数据库没有关系完整性，则提供错误文本。对于大数据集，使用预处理查询进行子查询会更高效。\n\
