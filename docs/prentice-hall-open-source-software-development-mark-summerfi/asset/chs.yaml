  \n## 使用 codecs 模块进行写入和读取\n\n使用 PyQt 类的替代方案是使用 Python 内置的标准库类来读写文本文件。可以使用 `file`\
  \ 类直接读写文件，但如果我们想指定编码，则必须使用 `codecs` 模块。\n\n```python\ndef saveText(self):\n    error\
  \ = None\n    fh = None\n    try:\n        fh = codecs.open(unicode(self.__fname),\
  \ \"w\", CODEC)\n        for key, movie in self.__movies:\n            fh.write(u\"\
  {{MOVIE}} %s\\n\" % unicode(movie.title))\n            fh.write(u\"%d %d %s\\n\"\
  \ % (movie.year, movie.minutes,\n            movie.acquired.toString(Qt.ISODate)))\n\
  \            fh.write(u\"{NOTES}\")\n            if not movie.notes.isEmpty():\n\
  \                fh.write(u\"\\n%s\" % unicode(movie.notes))\n            fh.write(u\"\
  \\n{{ENDMOVIE}}\\n\")\n```\n\n我们使用了与使用 `QTextStream` 时完全相同的文本格式，因此代码与 `saveQTextStream()`\
  \ 非常相似。我们使用 `codecs.open()` 函数而不是 `open()` 函数打开文件；我们不需要指定“二进制”标记。我们省略了 `except`\
  \ 块到结尾的代码，因为它们与之前看到的一样。\n\n```python\ndef loadText(self):\n    error = None\n  \
  \  fh = None\n    try:\n        fh = codecs.open(unicode(self.__fname), \"rU\",\
  \ CODEC)\n        self.clear(False)\n        lino = 0\n        while True:\n   \
  \         title = year = minutes = acquired = notes = None\n            line = fh.readline()\n\
  \            if not line:\n                break\n            lino += 1\n      \
  \      if not line.startswith(\"{{MOVIE}}\"):\n                raise ValueError,\
  \ \"no movie record found\"\n            else:\n                title = QString(line[len(\"\
  {{MOVIE}}\"):].strip())\n```\n\n# 第 8 章 数据处理与自定义文件格式\n\n我们只展示了 `loadText()` 方法中与\
  \ `saveText()` 对应的前几行。这是因为该方法使用了与 `saveQTextStream()` 方法相同的算法和几乎相同的代码。唯一的显著区别在于读取的行是\
  \ Python Unicode 字符串，因此我们必须将标题和注释转换为 `QString`。此外，Python 保留了换行符而不是丢弃它们，并返回空字符串表示到达文件末尾，因此我们必须稍微修改代码以考虑到这一点。对于整数，我们可以使用\
  \ Python 的 `int()` 函数，而不是我们在处理 `QString` 时需要的 `intFromQStr()` 函数。\n\n我们选择以 `rU`\
  \ 模式读取，它代表“读取通用换行符”（read universal newlines），而不是普通的 `r` 模式（代表“读取”）。这意味着即使行是在 Linux\
  \ 上写入并在 Windows 上读取的，也能被正确读取，尽管这两个操作系统使用不同的行结束标记。\n\n## 保存 XML 文件\n\nPyQt 和 Python\
  \ 标准库都可以读写 XML 文件。\n\nPyQt 提供了两个用于的解析器，并可以使用其 `QDomDocument` 类写入 XML。PyQt 4.3 增加了两个新的\
  \ XML 类。`XmlStreamReader` 是轻量级的类似于 SAX，易于使用，而 `XmlStreamWriter` 用于写入 XML。Python\
  \ 标准库也提供了广泛的 XML 支持，但在本节中我们将专注于 PyQt 提供的功能。有两种非常不同且广泛使用的 XML 解析 API：DOM（文档模型），它将整个\
  \ XML 文档加载到内存中，适用于编辑结构；以及 SAX（简单 XML 接口），它是增量的，因此更节省资源，适用于处理 XML XML。我们将展示这两个解析器的用法。\n\
  \n### 写入 XML\n\n如果我们将 XML 文档读取到 `QDomDocument`，或者在代码中创建并填充了 `QDomDocument`，将其保存到磁盘的最简单方法是使用\
  \ `QDomDocument.toString()` 获取整个 XML 格式的 `QString`。但在实践中，我们通常只将 XML 作为数据交换格式，并将数据存储在自定义数据结构中。在这种情况下，我们需要自己编写\
  \ XML，这就是稍后我们要的内容。\n\n让我们先查看目标格式：\n\n```xml\n<?xml version='1.0' encoding='UTF-8'?>\n\
  \n<!DOCTYPE MOVIES>\n\n<MOVIES VERSION='1.0'>\n\n...\n\n<MOVIE YEAR='1951' MINUTES='100'\
  \ ACQUIRED='2002-02-07'>\n\n<TITLE>African Queen</TITLE>\n\n<NOTES>\n\nKatherine\
  \ Hepburn, Humphrey Bogart\n\n</NOTES>\n\n</MOVIE>\n\n...\n\n</MOVIES>\n```\n\n\
  在 XML 中，空白字符序列（如换行符、制表符和空格）通常被视为单个空格。这通常很方便，但在我们的电影注释情况下并非如此，因为对于注释，我们需要保留用户插入的换行符和段落符。\n\
  \n```python\ndef encodedNewlines(text):\n    return text.replace(\"\\n\\n\", NEWPARA).replace(\"\
  \\n\", NEWLINE)\n\ndef decodedNewlines(text):\n    return text.replace(NEWPARA,\
  \ \"\\n\\n\").replace(NEWLINE, \"\\n\")\n``` 前述两个函数可以保留用户的段落符和换行符。第一个函数将段落符和换行符编码为代表它们的\
  \ Unicode 字符，第二个函数将 Unicode 段落符和换行符解码回熟悉的 `\\n` 字符。\n\n\n\n\n省略号表示为了节省空间而省略的电影记录，它们不是格式的一部分。尽管我们总是按照相同的顺序编写\
  \ `<MOVIE>` 标签的属性，但对于 XML 解析器而言，属性顺序是任意的。属性值不应包含单引号、双引号，或者 XML 元字符 `<`、`>` 或 `&`。★\
  \ 这意味着对于属性值，我们要么要对其进行转义，要么确保我们只使用那些已知不包含这些字符的值——例如，ISO 格式的数字、日期时间以及布尔值。\n\n★ 要转义\
  \ XML 文本，我们必须将 `<` 转换为 `&lt;`，将 `>` 转换为 `&gt;`，将 `&` 转换为 `&amp;`。在属性值中，除了这些转换外，我们必须将\
  \ `'` 转换为 `&apos;` 将 `\"` 转换为 `&quot;`。对于标题和注释等字符数据，我们可以包含引号，因为只有元字符是不允许的。\n\n```python\n\
  def exportXml(self, fname):\n    error = None\n    fh = None\n    try:\n       \
  \ fh = QFile(fname)\n        if not fh.open(QIODevice.WriteOnly):\n            raise\
  \ IOError, unicode(fh.errorString())\n        stream = QTextStream(fh)\n       \
  \ stream.setCodec(CODEC)\n        stream << (\"<?xml version='1.0' encoding='%s'?>\\\
  n\"\n        \"<!DOCTYPE MOVIES>\\n\"\n        \"<MOVIES VERSION='1.0'>\\n\" % CODEC)\n\
  ```\n\n### PyQt\n\n我们选择使用 PyQt 的 `QTextStream` 来写入我们的 XML 文件；在 `4.1` 中我们同样很容易地使用\
  \ `codecs` 模块，尽管在这种情况下我们需要将 `QStrings` 转换为 unicode。该方法以现在已经熟悉的方式开始。一旦创建了 `QTextStream`，我们就会照常将其编码格式为\
  \ UTF-8，然后输出前三行——这些行总是相同的**。\n\n```python\nfor key, movie in self.__movies:\n  \
  \  stream << (\"<MOVIE YEAR='%d' MINUTES='%d' \"\n    \"ACQUIRED='%s'>\\n\" % (\n\
  \    movie.year, movie.minutes,\n    movie.acquired.toString(Qt.ISODate))) \\\n\
  \    << \"<TITLE>\" << Qt.escape(movie.title) \\\n    << \"</TITLE>\\n<NOTES>\"\n\
  \    if not movie.notes.isEmpty():\n        stream << \"\\n\" << Qt.escape(\n  \
  \      encodedNewlines(movie.notes))\n    stream << \"\\n</NOTES>\\n</MOVIE>\\n\"\
  \n    stream << \"</MOVIES>\\n\"\n```\n\n我们像之前那样遍历我们的电影数据。`Qt.escape()` 函数接收一个 `QString`\
  \ 并返回一个对任何 XML 元字符都已正确转义的字符串。我们使用自定义的 `encodedNewlines()` 函数将注释中的任何段落和换行符转换为相应的\
  \ Unicode 等效值。\n\n我们没有对属性进行任何转义，因为我们知道它们不会包含任何不可接受的字符。我们省略了方法的末部分，因为异常处理和返回部分的结构与我们之前看到的相同。\n\
  \n★PyQt 4.0 有一个 bug，会导致 `QTextStream` 无法正确写入，因此对于 PyQt 4.0 我们必须使用 `codecs` 模块。这个问题在\
  \ PyQt 4.1 及更高版本中并不存在。\n\n### 保存和加载 XML 文件\n\n#### 使用 PyQt 的 DOM 类读取和解析 XML\n\n\
  PyQt 的 `QDomDocument` 类可以一次性读取整个（格式良好的）XML 文档。但一旦我们拥有了 `QDomDocument`，就必须能够使用它。某些应用程序会将文档反映到小部件中（通常是\
  \ `QTreeWidget`），而其他像 My Movies 这样纯粹将 XML 作为数据交换格式的应用程序则会遍历文档，并在遍历的过程中填充它们的数据结构。\n\
  \n```python\ndef importDOM(self, fname):\n    dom = QDomDocument()\n    error =\
  \ None\n    fh = None\n    try:\n        fh = QFile(fname)\n        if not fh.open(QIODevice.ReadOnly):\n\
  \            raise IOError, unicode(fh.errorString())\n        if not dom.setContent(fh):\n\
  \            raise ValueError, \"could not parse XML\"\n    except (IOError, OSError,\
  \ ValueError), e:\n        error = \"Failed to import: %s\" % e\n    finally:\n\
  \        if fh is not None:\n            fh.close()\n    if error is not None:\n\
  \        return False, error\n    try:\n        self.populateFromDOM(dom)\n    except\
  \ ValueError, e:\n        return False, \"Failed to import: %s\" % e\n    self.__fname\
  \ = QString()\n    self.__dirty = True\n    return True, \"Imported %d movie records\
  \ from %s\" % (\n    len(self.__movies), QFileInfo(fname).fileName())\n```\n\n加载方法的第一部分看起来很熟悉，但请注意，当我们调用\
  \ `QDomDocument.setContent()` 时，整个文件会被读取。如果此方法成功（返回 `True`），我们就知道 XML 已成功解析。\n\n\
  一旦我们拥有了 `QDomDocument`，我们需要从中提取数据，这正是 `populateFromDOM()` 方法所的作用。该方法的结尾与我们之前看到的不同。我们清除了文件名并将脏标记设为\
  \ `True`。这将确保如果用户尝试保存他们刚刚导入的 XML 电影数据，或者他们尝试退出应用程序，他们将收到一个“另存为”对话框，以便他们有机会以应用程序的二进制或文本格式之一保存数据。\n\
  \n我们之前提到过 `QDomDocument` 可以很容易地写入文件。这里是实现方法，假设 `QDomDocument` 是一个有效的文件名，并且 `codecs.open(filename,\
  \ \"w\", \"utf-8\").write(unicode(dom.toString()))` 将产生一个与 `exportXml()` 产生的略有不同的\
  \ XML。一旦 `QDomDocument` 读取了 XML 文件，我们需要遍历其内容以填充数据结构，为了这一点，我们从调用 `populateFromDOM()`\
  \ 开始。\n\n```python\ndef populateFromDOM(self, dom):\n    root = dom.documentElement()\n\
  \    if root.tagName() != \"MOVIES\":\n        raise ValueError, \"not a Movies\
  \ file\"\n    self.clear(False)\n    node = root.firstChild()\n    while not node.isNull():\n\
  \        if node.toElement().tagName() == \"MOVIE\":\n            self.readMovieNode(node.toElement())\n\
  \        node = node.nextSibling()\n```\n\n我们首先检查读取的 XML 文件确实是电影文件。如果不是，我们就会抛出一个异常；如果是，我们就会清除数据结构，以便准备好填充。\n\
  \nDOM 文档由“节点”组成，每个节点代表一个 XML 标签或标签之间的文本。在电影格式中，我们有并列的 `<MOVIE>` 节点，它们拥有 `<TITLE>`\
  \ 和 `<NOTES>` 子节点，而这些子节点又有子文本节点。因此，为了提取我们的数据，我们遍历 `<MOVIE>` 节点，对于遇到的每一个节点，我们提取其属性和来自其子节点的数据。\n\
  \n```python\ndef readMovieNode(self, element):\n    def getText(node):\n       \
  \ child = node.firstChild()\n        text = QString()\n        while not child.isNull():\n\
  \            if child.nodeType() == QDomNode.TextNode:\n                text +=\
  \ child.toText().data()\n            child = child.nextSibling()\n        return\
  \ text.trimmed()\n```\n\n`readMovieNode()` 从一个嵌套函数定义开始。`getText()` 函数接收一个节点作为参数——例如\
  \ `<TITLE>` 或 `<NOTES>` 起始标签——并遍历其子文本节点，累计它们的文本。最后，它返回文本，并去除了两端的空格。正如之前提到的，`QString.trimmed()`\
  \ 方法完成了与 `unicode.strip()` 相同的工作。\n\n```python\nyear = intFromQStr(element.attribute(\"\
  YEAR\"))\nminutes = intFromQStr(element.attribute(\"MINUTES\"))\nymd = element.attribute(\"\
  ACQUIRED\").split(\"-\") if ymd.count() != 3:\n    raise ValueError, \"invalid acquired\
  \ date %s\" % \\\n    unicode(element.attribute(\"ACQUIRED\"))\nacquired = QDate(intFromQStr(ymd[0]),\
  \ intFromQStr(ymd[1]),\nintFromQStr(ymd[2]))\n```\n\n`readMovieNode()` 方法本身开始提取\
  \ `<MOVIE>` 标签的属性数据，将其从文本转换为年份和分钟的整数，以及转换为获取日期的 `QDate`。\n\n\n\n\n我们本可以避免自己处理获取日期的细节，而是将工作交给解析器。例如，与其使用单一的\
  \ `ACQUIRED` 属性，我们可以使用 `ACQUIREDYEAR`、`ACQUIREDMONTH` 和 `ACQUIREDDAY`，每个属性都有一个整数值。有了这三个属性，我们就不需要对连字符进行拆分，但格式会变得更加冗长。\n\
  \n```\ntitle = notes = None\n\nnode = element.firstChild()\n\nwhile title is None\
  \ or notes is None:\n    if node.isNull():\n        raise ValueError, \"missing\
  \ title or notes\"\n    if node.toElement().tagName() == \"TITLE\":\n        title\
  \ = getText(node)\n    elif node.toElement().tagName() == \"NOTES\":\n        notes\
  \ = getText(node)\n    node = node.nextSibling()\n\nif title.isEmpty():\n    raise\
  \ ValueError, \"missing title\"\n\nself.add(Movie(title, year, minutes, acquired,\n\
  \    decodedNewlines(notes)))\n```\n\n每个 `<MOVIE>` 节点有两个子节点：`<TITLE>` 和 `<NOTES>`。尽管我们在\
  \ `exportXml()` 方法中总是按照相同的顺序编写它们，但我们并不想强制子节点具有特定的顺序。出于这个原因，我们遍历子节点并使用嵌套的 `getText()`\
  \ 方法来收集遇到的任何子节点的文本。\n\n最后，只要电影有标题，我们就会创建一个新的 `Movie` 对象，并立即使用 `add()` 将其添加到我们的数据结构中。\n\
  \n# 第 8 章. 数据处理与自定义文件格式\n\n使用 DOM 解析器将 XML 导入到自定义数据结构中效果良好，尽管我们通常需要编写像 `getText()`\
  \ 这样的小辅助函数。DOM 最适用于我们希望在 `QDomDocument` 内部持有并操作 XML 数据的情况，而不是将其转换为其他数据结构。\n\n##\
  \ 使用 PyQt 的 SAX 类读取和解析 XML\n\n使用 SAX 解析器导入 XML 的工作方式与使用 DOM 解析器完全不同。在 SAX 中，我们定义一个处理处理器类，只实现我们感兴趣的方法，然后将处理器的实例传递给\
  \ SAX 解析器，供其在解析 XML 时使用。解析并不是像 DOM 那样一次性完成的，而是逐一部分进行的，当遇到处理器方法要处理的数据时，就会调用该方法。任何我们没有实现的方法都由基类提供，并且在所有情况下它们都会安全地什么都不做。\n\
  \n```python\ndef importSAX(self, fname):\n    error = None\n    fh = None\n    try:\n\
  \        handler = SaxMovieHandler(self)\n        parser = QXmlSimpleReader()\n\
  \        parser.setContentHandler(handler)\n        parser.setErrorHandler(handler)\n\
  \        fh = QFile(fname)\n        input = QXmlInputSource(fh)\n        self.clear(False)\n\
  \        if not parser.parse(input):\n            raise ValueError, handler.error\n\
  \    except (IOError, OSError, ValueError), e:\n        error = \"Failed to import:\
  \ %s\" % e\n    finally:\n        if fh is not None:\n            fh.close()\n \
  \   if error is not None:\n        return False, error\n\n    self.__fname = QString()\n\
  \    self.__dirty = True\n    return True, \"Imported %d movie records from %s\"\
  \ % (\n    len(self.__movies), QFileInfo(fname).fileName())\n```\n\n我们首先创建一个自定义的\
  \ `SaxMovieHandler` 实例和一个 SAX XML 解析器。解析器可以接收一个内容处理器、一个错误处理器以及其他一些处理器；我们选择只创建一个处理器，一个既能处理内容又能处理错误的处理器，因此我们为这两个目的设置了同一个同一个处理器。\n\
  \n## 保存和加载 XML 文件\n\n我们获取一个 `QFile` 文件句柄并将其转换为 XML “输入源”。此时，我们清空了数据结构（同样是尽可能晚地进行），然后告诉解析器解析\
  \ XML 文件。解析器在成功时返回 True，失败时返回 False。\n\n我们没有独立的填充数据结构阶段，因为在解析进行过程中，我们在 `SaxMovieHandler`\
  \ 类内部处理了所有这些。最后，我们清除文件名并将脏标记设为 True，就像我们在 `importDOM()` 方法结束时做的那样。\n\n`SaxMovieHandler`\
  \ 类是 `QXmlDefaultHandler` 的子类。对于内容处理，它通常至少要实现 `startElement()`、`endElement()` 和\
  \ `characters()` 来处理带有属性的起始标签、结束标签以及标签之间的文本。如果我们像这里这样使用同一个处理器来处理错误，我们必须至少也实现 `fatalError()`\
  \ 方法。\n\n```python\nclass SaxMovieHandler(QXmlDefaultHandler):\n    def __init__(self,\
  \ movies):\n        super(SaxMovieHandler, self).__init__()\n        self.movies\
  \ = movies\n        self.text = QString()\n        self.error = None\n```\n\n`super()`\
  \ 调用确保了基类被正确初始化。`movies` 参数是电影容器本身。`text` 实例变量用于持有标签之间的文本——例如标题或注释文本——如果发生错误，`error`\
  \ 变量将获得一条错误消息。\n\n```python\ndef clear(self):\n    self.year = None\n    self.minutes\
  \ = None\n    self.acquired = None\n    self.title = None\n    self.notes = None\n\
  ```\n\n该方法第一次被调用时，它会为电影的每个属性创建一个实例变量。每次被调用时，它都会将这些变量设置为 `None`；这将易于测试我们是否已经读取了电影的所有属性。\n\
  \n```python\ndef startElement(self, namespaceURI, localName, qName, attributes):\n\
  \    if qName == \"MOVIE\":\n        self.clear()\n        self.year = intFromQStr(attributes.value(\"\
  YEAR\"))\n        self.minutes = intFromQStr(attributes.value(\"MINUTES\"))\n  \
  \      ymd = attributes.value(\"ACQUIRED\").split(\"-\")\n        if ymd.count()\
  \ != 3:\n            raise ValueError, \"invalid acquired date %s\" % \\\n     \
  \       unicode(attributes.value(\"ACQUIRED\"))\n        self.acquired = QDate(intFromQStr(ymd[0]),\n\
  \            intFromQStr(ymd[1]),\n            intFromQStr(ymd[2]))\n    elif qName\
  \ in (\"TITLE\", \"NOTES\"):\n        self.text = QString()\n        return True\n\
  ```\n\n此方法是从基类重新实现的，因此我们必须使用相同的签名。我们只对最后两个参数感兴趣：持有标签名的 `qName`（限定名）和持有标签属性数据的 `attributes`。每当遇到新的起始标签时，就会调用此方法。\n\
  \n如果遇到一个新的 `<MOVIE>` 标签，我们会清除相应的实例变量，然后从标签的属性数据中填充年份、分钟数和获取日期。这留下了标题和注释变量，其值被设置为\
  \ `None`。\n\n如果标签是 `<TITLE>` 或 `<NOTES>` 标签，我们可以预期获取其对应的文本（如果有的话），因此我们将 `text` 变量设置为空字符串，准备进行追加。\n\
  \n每个重新实现的方法必须在成功时返回 True 或失败时返回 False；因此我们在结尾返回 True。\n\n```python\ndef characters(self,\
  \ text):\n    self.text += text\n    return True\n```\n\n每当在标签之间遇到文本时，就会调用 `characters()`\
  \ 方法。我们只需将文本追加到 `text` 变量中。结束标签将告诉我们正在累积标题文本还是注释文本。\n\n```python\ndef endElement(self,\
  \ namespaceURI, localName, qName):\n    if qName == \"MOVIE\":\n        if self.year\
  \ is None or self.minutes is None or \\\n            self.acquired is None or self.title\
  \ is None or \\\n            self.notes is None or self.title.isEmpty():\n     \
  \       raise ValueError, \"incomplete movie record\"\n        self.movies.add(Movie(self.title,\
  \ self.year,\n            self.minutes, self.acquired,\n            decodedNewlines(self.notes)))\n\
  \        self.clear()\n    elif qName == \"TITLE\":\n        self.title = self.text.trimmed()\n\
  \    elif qName == \"NOTES\":\n        self.notes = self.text.trimmed()\n    return\
  \ True\n```\n\n此方法在遇到任何结束标签时被调用。标签名存储在 `qName` 参数中。如果结束标签是 `</MOVIE>`，则所有的电影数据实例变量都不应该为\
  \ `None`（尽管标题或注释可以是空的 `QString`）。\n\n如果没有任何变量为 `None`，只要电影有标题，我们就会创建一个新的 `Movie`\
  \ 对象并立即将其添加到 `movies` 容器中。\n\n当我们遇到标题或注释结束标签时，我们就知道累积在 `text` QString 中的文本就是相应起始和结束标签之间的文本，因此我们对其进行相应的赋值。如果没有文本，赋值将是一个空\
  \ `QString`。\n\n```python\ndef fatalError(self, exception):\n    self.error = \"\
  parse error at line %d column %d: %s\" % (\n```\n\n\n\n\n\n```python\nexception.lineNumber(),\
  \ exception.columnNumber(),\nexception.message())\n\nreturn False\n```\n\n如果发生解析错误，将调用\
  \ `fatalError()` 方法。我们重新实现了它，用以填充处理程序的错误文本，并返回 `False` 表示失败。这将导致解析器完成解析并向其调用者返回\
  \ `False`。\n\n使用 PyQt 的 SAX 解析器要求我们至少创建一个单独的处理程序子类。这并不困难，特别是我们只需要重新实现想要用的方法。与使用\
  \ DOM 相比，使用 SAX 解析内存更节省内存，因为 SAX 是增量工作的，而且速度明显更快，特别是对于较大的文档。\n\n## 总结\n\n在所有可选择的方案中，哪种格式是最佳选择？我们应该使用\
  \ Python 类还是 PyQt 类？\n\n使用二进制格式对于性能和平台无关性是最好的，而且实现也最简单。使用纯文本格式适用于通常只包含字符串、数字和日期等简单值的小文件，并且这些文件旨在供手动编辑。尽管如此，仍然存在用户的文本编辑器假设的编码与我们使用的编码不同的风险。\n\
  \n我们建议对所有纯文本格式都使用 `UTF-8`，因为它正在成为事实上的标准编码。读取和写入 XML 的速度比读取和写入二进制文件慢得多（除非小于 ~1MB\
  \ 的小文件），但它是提供的，至少作为导出和导入格式。毕竟，如果我们的用户能够以 XML 格式导出和导入数据，他们就有了导出数据、使用其他工具处理然后再导入处理后的数据的能力，而无需了解或关心我们应用程序通常使用的二进制格式细节。\n\
  \n至于使用 Python 类还是 PyQt 类，对于包含简单数据类型的小文件，这可能完全无关。如果我们想尽量减少编程工作量，使用 `cPickle` 可能是可能是简单的方法。但如果我们有大文件（数兆字节）或者我们使用了复杂的\
  \ PyQt 类型如 `QBrush`、`QCursor`、`QFont`、`QIcon`、`QImage` 等，使用 `QDataStream` 是简单且高效的，因为它可以直接读取和写入所有类型。使用二进制格式的缺点是，如果我们想更改格式，必须至少更改加载方法，以便能够同时加载新格式和旧格式。这在实践中并不是问题，只要我们在数据的魔数（magic\
  \ number）之后包含一个文件版本号，因为我们可以利用它来决定使用哪种加载代码。\n\n到此阶段，我们已经涵盖了 GUI 编程的基础知识。我们可以创建带有菜单、工具栏和停靠窗口的主窗口应用程序，并创建和弹出任何喜欢的对话框。我们还学习了如何使用\
  \ `Qt Designer` 来简化和加速对话框设计，并看到了如何以各种格式加载和保存应用程序数据。在第三部分，我们将深化并扩展 GUI 编程知识，学习如何处理多个文档以及如何创建用户可管理的复杂对话框。我们还将探索\
  \ PyQt 的一些主要架构特性，从它的底层事件处理机制到自定义控件的创建（包括对 2D 图形的涵盖），以及高级特性，包括基于项的图形、富文本（HTML）处理和模型/视图编程。\n\
  \n## 练习\n\n修改 My Movies 应用程序，使每个 Movie 对象能够存储一个额外的额外信息：一个名为“location”的 `QString`，即电影所在的位置——例如房间和架子。仅提供保存和加载二进制\
  \ Qt 格式 `.mqb` 文件，以及 XML 文件的导出和导入，因此删除保存和加载 pickle 及文本文件的代码。确保你的新 My Movies 应用程序仍然读取原始应用程序的\
  \ `.mqb` 和 `.xml` 文件，即不包含位置数据的文件。\n\n`moviedata` 模块的 `Movie` 类需要一个额外的 `QString`\
  \ 属性，名为“location”。`MovieContainer` 类需要一些细小的更改。你需要同时拥有旧版本和当前的文件版本号，以便知道你正在处理的是哪种。`formats()`\
  \ 方法现在应该只返回字符串 `*.mqb`，或者可以完全消除。`save()` 和 `load()` 方法只需要处理 `.mqb` 文件，并且考虑到位置和不同的文件版本。同样，`exportXml()`\
  \ 方法和两个导入 XML 方法也必须考虑到可能的 `<LOCATION>` 标签。\n\n用户界面的更改应该是显而易见的，所以我们不再列出。这些更改都不涉及许多行代码，但有些非常微妙，需要花一点心思才能正确完成。确保你测试了你的更改。例如，加载一个旧的\
  \ `.mqb` 文件，在 `.mqb` 格式中并导入 `.xml` 文件以检查一切是否正常。\n\n\n\n\n时间，但该技术随平台而异，且超出了本书的范围。）这种方法非常流行，并且被苹果的交互界面指南（Apple\
  \ Human Interface Guidelines）推荐用于“文档风格”应用程序。我们将在第四节介绍它。\n\n第三种方法是使用 `MDI`（多文档界面）。同样，用户被期望只运行应用程序的一个实例，但在这里，所有文档都保留在一个单一的“工作区”内，即主窗口区域区域子窗口中。MDI\
  \ 没有 SDI 那么流行，而且消耗的资源也较少。对于 `MDI` 应用程序，无论正在处理多少个文档，都只有一个主窗口；而 SDI 则为每个文档都提供一个带有菜单栏、工具栏等内容的主窗口。本章的最后数节将展示如何实现一个\
  \ `MDI` 应用程序。\n\n第四种替代方案是使用标签页控件（tab widget），每个文档占据自己的标签页页。这种方法被许多现代网络浏览器使用。我们只会在对话框的上下文中介绍标签页控件，尽管在练习中你将有机会创建一个基于标签页控件的主窗口应用程序，而且可能让你惊讶的是，所需的代码与用于\
  \ `MDI` 应用程序的代码非常相似。\n\n但在查看对话框中的标签页控件和堆叠控件（stacked widgets）以及处理多个文档之前，我们将稍作中断，比第一次遇到它们时更深入地讨论布局。\n\
  \n## 布局策略 (Layout Policies)\n\n在前面的章节中，我们看到了许多 `PyQt` 布局管理器运行的示例。在 `PyQt` 中，可以为控件设置特定的固定大小和位置，或者通过重新实现每个控件的\
  \ `resizeEvent()` 处理器来手动处理布局。但目前为止，使用布局管理器是最简单的方法，与手动方法相比，它还提供了额外的优势。\n\n布局管理器允许控件增大和缩小，以最有效地利用其可用空间，动态地响应用户更改容器表单的大小。布局管理器根据所有控件的最小大小为表单提供一个最小尺寸。这确保了表单不会小到无法使用，而且它不是固定的，而是取决于控件的内容——例如，标签可能需要更多或更少的宽度，取决于它显示的文本是英语还是德语。\n\
  \n`QVBoxLayout`、`QHBoxLayout` 和 `QGridLayout` 布局管理器非常多功能。箱式布局可以包含“拉伸因子”（stretches），它们消耗控件之间的空间，防止控件变得过高或过宽。网格布局可以包含跨越多行和多列的控件。所有布局管理器都可以相互嵌套，因此可以创建非常复杂的布局。\n\
  \n尽管如此，有时仅靠布局管理器不足以实现我们想要的布局。帮助布局管理器的一种简单方法是`布局策略`（Layout Policies）。\n\n### 表 9.1\
  \ PyQt 的大小策略\n\n| 策略 | 效果 |\n| :--- | :--- |\n| Fixed (固定) | 控件具有其尺寸提示（size hint）指定的尺寸，且永远不改变\
  \ |\n| Minimum (最小) | 控件的尺寸提示是其最小大小；它不能缩小比此更小，但可以更大 |\n| Maximum (最大) | 控件的尺寸提示是其最大大小；它不能比此大，但可以缩小到其最小尺寸提示\
  \ |\n| Preferred (首选) | 控件的尺寸提示是其首选大小；它可以缩小到其最小尺寸提示，也可以比其尺寸提示更大 |\n| Expanding (扩展)\
  \ | 控件可以缩小到其最小尺寸提示，也可以比其尺寸提示更大，但它倾向于变得更大 |\n\n每个控件都有可以独立设置的垂直和水平大小策略。（每个控件也可以具有固定的最小和最大尺寸，但使用大小策略通常能提供更好的缩放行为。）此外，每个控件与两个尺寸相关：尺寸提示（size\
  \ hint）和最小尺寸提示（minimum size hint）。\n\n前者是控件的首选大小，后者是控件可以缩小的最小尺寸。这些尺寸被大小策略使用，如表 9.1\
  \ 所示。\n\n例如，`QLineEdit` 可能有一个默认的水平策略为 `Expanding`（扩展），垂直策略为 `Fixed`（固定）。这意味着该行编辑框将尽可能地占据水平空间，但始终保持相同的垂直尺寸。\n\
  \n每个内置的 `PyQt` 控件都已设置了合理的尺寸提示和大小策略，因此通常在调整布局时，我们只需要对一或两个控件进行更改。\n\n大小策略除了策略本身，还存储了一个“拉伸因子”（stretch\
  \ factor）。这被用于指示布局管理器如何在控件之间共享空间。例如，如果我们有一个包含两个 `QListWidgets` 的 `QVBoxLayout`，它们都将想要在两个方向上都增长。但如果我们想让底部的增长得比顶部的快，我们可以给顶部的拉伸因子设为\
  \ `1`，给底部的设为 `3`。这将确保如果用户调整窗口大小，额外的空间将按照 `1:3` 的比例分配在两个控件之间。\n\n如果设置大小策略和拉伸因子仍然不够，我们始终可以创建一个子类并重新实现\
  \ `sizeHint()` 和 `minimumSizeHint()` 方法来返回我们想要的大小。我们将在第 11 章中看到这些示例。\n\n![Image\
  \ 40](img/index-287_1.jpg)\n![Image 41](img/index-287_2.jpg)\n\n## 标签页控件和堆叠控件\n\n\
  某些对话框需要大量的控件来展示它们提供的所有选项，以至于用户难以理解。处理这种问题最明显的方法是创建两个或多个对话框，并将选项分配在它们之间。如果可能，这是一个很好的方法，因为它最小化了对用户的要求，而且从维护的角度来看，可能比单个复杂的对话框更容易。但通常我们往往需要使用单个对话框，因为我们提供给用户的选项是相关的，并且需要一起展示。\n\
  \n当我们必须使用单个对话框时，必须考虑两类选项组。一种仅仅是一组相关的选项。这通过使用 `QTabWidget` 处理最容易。标签页控件可以根据需要拥有任意数量的“页”（子控件和标签标题），每一页使用展示相关选项所需的控件进行布局。图\
  \ 9.1 显示了一个 `PaymentDlg`，这是一个使用 `Qt Designer` 创建的三页标签页控件的示例。\n\n**图 9.1 一个使用标签页控件选择支付方式的对话框**\
  \ 在 `Qt Designer` 控件框（Widget Box）的容器部分，有一个 `Tab Widget`。它可以像任何其他控件一样被拖到表单上。与大多数容器控件一样，与大多数其他控件不同，我们通常必须将其拖到表单上后手动调整标签页控件的大小，使其大致达到我们想要的大小。在\
  \ `Qt Designer` 中，标签页控件具有删除和添加页的右键选项。可以通过点击相关标签或设置 `currentIndex` 属性来设置当前页。当前页的标签文本可以通过设置\
  \ `currentTabText` 属性来设置。\n\n一旦标签页控件被拖到表单并调整了大小，我们就可以将其他拖到它的页面上。这些控件可以以正常方式布局，并且每个标签页都可以以类似于表单本身的方式进行布局：取消所有控件，然后点击该标签页，然后应用布局管理器。\n\
  \n\n\n\n虽然使用 `Qt Designer` 比手动创建对话框更快、更方便，但了解如何纯用代码实现相同的功能是非常有趣且实用的。我们不会展示普通控件的创建过程，因为我们已经看过很多次了；相反，我们将重点关注标签页控件（tab\
  \ widget）和表单的整体布局。以下摘录均取自 `chap09/paymentdlg.pyw` 中 `PaymentDlg` 类的初始化函数。（`Qt Designer`\
  \ 版本位于 `paymentdlg.ui` 和 `paymentdlg.py` 文件中）。\n\n```\ntabWidget = QTabWidget()\n\
  cashWidget = QWidget()\ncashLayout = QHBoxLayout()\ncashLayout.addWidget(self.paidCheckBox)\n\
  cashWidget.setLayout(cashLayout)\ntabWidget.addTab(cashWidget, \"Cas&h\")\n```\n\
  \n我们创建标签页控件就像创建任何其他控件一样。标签页控件中的每个页必须包含一个控件，因此我们创建了一个新控件 `cashWidget` 并为它创建一个布局。然后，我们将相关的控件——在这种情况下只有一个一个\
  \ `paidCheckBox`——添加到布局中，然后将布局设置在容器控件上。最后，我们将该容器控件作为新标签页添加到标签页控件中，并带上标签页的标签文本。★\n\
  \n```\ncheckWidget = QWidget()\ncheckLayout = QGridLayout()\ncheckLayout.addWidget(checkNumLabel,\
  \ 0, 0)\ncheckLayout.addWidget(self.checkNumLineEdit, 0, 1)\ncheckLayout.addWidget(bankLabel,\
  \ 0, 2)\ncheckLayout.addWidget(self.bankLineEdit, 0, 3)\ncheckLayout.addWidget(accountNumLabel,\
  \ 1, 0)\ncheckLayout.addWidget(self.accountNumLineEdit, 1, 1)\ncheckLayout.addWidget(sortCodeLabel,\
  \ 1, 2)\ncheckLayout.addWidget(self.sortCodeLineEdit, 1, 3)\ncheckWidget.setLayout(checkLayout)\n\
  tabWidget.addTab(checkWidget, \"Chec&k\")\n```\n\n这个标签页的创建方式与第一个完全相同。区别在于我们使用了网格布局（grid\
  \ layout），并且有更多控件需要放入布局中\n\n我们不会显示第三个标签页的代码，因为它在结构上与已经看到的那些相同。\n\n★ 在 PyQt 文档以及在某种程度上在\
  \ `QTabWidget` 的 API 中，“tab”一词既指单个标签页的标签，也同时指标签页的标签和页面。\n\n![Image 42](img/index-289_1.png)\n\
  ![Image 43](img/index-289_2.png)\n![Image 44](img/index-289_3.png)\n\n```\nlayout\
  \ = QVBoxLayout()\nlayout.addLayout(gridLayout)\nlayout.addWidget(tabWidget)\nlayout.addWidget(self.buttonBox)\n\
  self.setLayout(layout)\n```\n\n为了完整起见，我们展示了对话框布局的核心，仅省略了用于存放表单顶部标签、行编辑器和计数器的网格布局的创建。按钮由\
  \ `QDialogButtonBox` 提供，这种控件可以像任何其他控件一样进行布局。最后，我们在垂直框布局中布局整个表单：首先是顶部的网格，然后是中间的标签页控件，最后是按钮框。\n\
  \n另一种选项组仅适用于某些情况。在选项组适用或不适用的简单情况下，可以使用可勾选的 `QGroupBox`。如果用户取消勾选组框，其包含的所有控件都将被禁用。这意味着用户可以看到该组包含哪些选项，即使这些选项不可用，这通常很有帮助。在其他情况下，我们可能有两个或多个选项组，但时刻只有一个是有效的。对于这种情况，`QStackedWidget`（堆叠控件）提供了一个解决方案。从概念上说，堆叠控件是一个没有标签的标签页控件。因此，用户没有视觉提示显示存在堆叠控件，也没有方法在堆叠控件的页面之间导航。\n\
  \n设计时间 / 预览时间 / 运行时\n\n**图 9.2** 使用堆叠控件的对话框\n\n要使用堆叠控件，我们可以在 `Qt Designer` 中将 `Stacked\
  \ Widget` 拖到表单上，并以与标签页控件相同的方式对其调整大小。在 `Qt Designer` 中，堆叠控件通过右上角的两个微小箭头指示。\n\n这些箭头在预览表单时也存在，但在运行时不会出现——它们显示在图\
  \ 9.2 前两个截图中颜色组合框的右上角。控件可以被拖到堆叠控件页面上，并以与标签页控件完全相同的方式布局。堆叠控件具有上下文菜单，提供了添加和删除页面的选项，以及用于页面导航和更改页面顺序的额外选项。\n\
  \n### 标签页控件与堆叠控件\n\n由于堆叠控件没有标签，我们必须为用户提供一种页面间导航的方法。在图 9.2 所示 `VehicleRentalDlg`\
  \ 中，车辆类型组合框被用作页面选择器。为了实现这一功能，在 `Qt Designer` 中我们将组合框的 `currentIndexChanged(int)`\
  \ 信号连接到堆叠控件的 `setCurrentIndex(int)` 槽。另一种让用户看到所有可用页的方法是使用包含每个页面名称的 `QListWidget`，并以连接组合框信号的方式连接其\
  \ `currentRowChanged(int)` 信号。\n\n我们现在将看到如何在代码中创建堆叠控件。以下摘录取自 `chap09/vehiclerentaldlg.pyw`\
  \ 中 `VehicleRentalDlg` 类的初始化函数。（`Qt Designer` 版本位于 `vehiclerentaldlg.ui` 和 `vehiclerentaldlg.py`\
  \ 文件中）。\n\n```\nself.stackedWidget = QStackedWidget()\ncarWidget = QWidget()\ncarLayout\
  \ = QGridLayout()\ncarLayout.addWidget(colorLabel, 0, 0)\ncarLayout.addWidget(self.colorComboBox,\
  \ 0, 1)\ncarLayout.addWidget(seatsLabel, 1, 0)\ncarLayout.addWidget(self.seatsSpinBox,\
  \ 1, 1)\ncarWidget.setLayout(carLayout)\nself.stackedWidget.addWidget(carWidget)\n\
  ```\n\n向堆叠控件添加“页面”与向标签页控件添加标签页非常相似。我们首先创建一个普通控件，然后为它创建一个布局，并布局我们想要的控件。然后，我们将布局设置在普通控件上，并将此控件添加到控件堆栈中。我们没有显示\
  \ `vanWidget` 的代码，因为它在结构上是相同的。\n\n```\ntopLayout = QHBoxLayout()\ntopLayout.addWidget(vehicleLabel)\n\
  topLayout.addWidget(self.vehicleComboBox)\nbottomLayout = QHBoxLayout()\nbottomLayout.addWidget(mileageLabel)\n\
  bottomLayout.addWidget(self.mileageLabel)\nlayout = QVBoxLayout()\nlayout.addLayout(topLayout)\n\
  layout.addWidget(self.stackedWidget)\nlayout.addLayout(bottomLayout)\nlayout.addWidget(self.buttonBox)\n\
  self.setLayout(layout)\n```\n\n再次，为了完整起见，我们展示了整个对话框的布局。我们首先创建一个包含组合框的顶部布局，用于设置堆叠控件的当前页面。然后创建一个里程标签的底部布局，然后是按钮的布局。接下来，我们将这些布局以及堆叠控件本身添加到垂直框布局中。\n\
  \n```\nself.connect(self.buttonBox, SIGNAL(\"accepted()\"), self.accept) \nself.connect(self.buttonBox,\
  \ SIGNAL(\"rejected()\"), self.reject) \nself.connect(self.vehicleComboBox, SIGNAL(\"\
  currentIndexChanged(QString)\"), self.setWidgetStack)\nself.connect(self.weightSpinBox,\
  \ SIGNAL(\"valueChanged(int)\"), self.weightChanged)\n```\n\n我们必须为用户提供一种导航机制，我们通过将车辆组合框的\
  \ `currentIndexChanged()` 信号连接到自定义的 `setWidgetStack()`槽来实现。最后一个槽只是表单验证的一部分；用于设置最大里程，对于汽车是固定的，但对于面包车取决于重量。\n\
  \n```python\ndef setWidgetStack(self, text):\n    if text == \"Car\":\n        self.stackedWidget.setCurrentIndex(0)\n\
  \        self.mileageLabel.setText(\"1000 miles\")\n    else:\n        self.stackedWidget.setCurrentIndex(1)\n\
  \    self.weightChanged(self.weightSpinBox.value())\n\ndef weightChanged(self, amount):\n\
  \    self.mileageLabel.setText(\"%d miles\" % (8000 / amount))\n```\n\n`setWidgetStack()`\
  \ 槽使相应的控件可见，并处理部分里程的设置，因为这取决于车辆是汽车还是面包车。\n\n\n\n我们之前使用组合框（combobox）的当前文本来确定显示哪个组件。一种更健壮的方法是将数据项与每个组合框项关联（使用双参数的\
  \ `QComboBox.addItem()` 方法），并使用当前项目的数据项来选择显示哪种组件。\n\n## 扩展对话框（Extension Dialogs）\n\
  \n对于复杂的对话框，我们还可以采取另一种方法：扩展对话框。这些通常用于对话框具有“简单”和“高级”选项的情况。初始时对话框显示简单选项，但提供了一个切换按钮来显示或隐藏高级选项。\n\
  \n图 9.3 所示的扩展对话框在按下“更多（More）”切换按钮时，会显示出额外的复选框。通过对任何 `QPushButton` 运行 `setCheckable(True)`，或者在\
  \ `Qt Designer` 中将其“checkable”属性设置为 True，即可将其转换为切换按钮。\n\n![Image 45](img/index-292_1.png)\n\
  \n![Image 46](img/index-292_2.png)\n\n**图 9.3** *一个扩展对话框*\n\n为了让扩展对话框工作，我们使用了两个“技巧”。第一个技巧是将所有高级选项的组件放在一个\
  \ `QFrame` 中。这意味着我们只需要隐藏和显示该框架，因为 PyQt 会自动隐藏和显示框架内的所有组件，以反映框架的可见性状态。\n\n如果我们不希望用户在框架显示时看到它的轮廓线，可以简单地将它的“frameShape”属性设置为\
  \ `QFrame.NoFrame`。\n\n第二个技巧是将对话框设为固定大小。这将确保对话框收缩到最小（同时保留边距），并考虑到对话框的可见内容。这样做的效果是：当高级选项隐藏时，对话框很短；当它们显示时，高度足够显示高级选项。我们还必须在创建对话框时隐藏框架。以下是对话框初始化代码（来自\
  \ `chap09/findandreplacedlg.py`）：\n\n```python\nclass FindAndReplaceDlg(QDialog,\
  \ ui_findandreplacedlg.Ui_FindAndReplaceDlg):\n    def __init__(self, parent=None):\n\
  \        super(FindAndReplaceDlg, self).__init__(parent)\n        self.setupUi(self)\n\
  \        self.moreFrame.hide()\n        self.layout().setSizeConstraint(QLayout.SetFixedSize)\n\
  ```\n\n但我们如何将“更多”按钮与框架的显示/隐藏状态联系起来呢？\n\n只需将 `moreButton` 的 `toggled(bool)` 信号连接到\
  \ `moreFrame` 的 `setVisible(bool)`get 即可。注意，如果在 `Qt Designer` 中进行此连接，我们必须勾选连接对话框中的“显示所有信号和槽”复选框；否则\
  \ `setVisible()`get 不会出现。\n\n在本节的最后一个示例中，我们将再次查看如何在代码中实现布局。与之前两个显示新组件（`QTabWidget`\
  \ 和 `QStackedWidget`）的布局不同，此对话框的布局仅使用了我们之前见过的组件——但使用了新的方式。以下代码提取自 `chap09/findandreplacedlg.pyw`\
  \ 中 `FindAndReplaceDlg` 类的初始化。（`Qt Designer` 版本位于文件 `findandreplacedlg.ui` 和 `findandreplacedlg.py`\
  \ 中）。我们只显示与扩展对话框特别相关的表单组件创建。表单布局如图 9.4 所示。\n\n```python\nmoreFrame = QFrame()\n\
  moreFrame.setFrameStyle(QFrame.StyledPanel|QFrame.Sunken)\n```\n\n我们创建一个框架并在其中放入额外的复选框。如果我们没有调用\
  \ `setFrameStyle()`，框架将没有轮廓线。\n\n```python\nline = QFrame()\nline.setFrameStyle(QFrame.VLine|QFrame.Sunken)\n\
  ```\n\n我们“绘制”的用于视觉上分离左侧对话框主组件与右侧按钮的线也是一个框架。可以使用 `QFrame.HLine` 框架样式创建水平线。\n\n```python\n\
  moreButton = QPushButton(\"&More\")\nmoreButton.setCheckable(True)\n```\n\n“更多”按钮与其他按钮不同的一点在于：它是可检查的（checkable）。这意味着它的作用像一个切换按钮，第一次点击时保持按下状态，下一次点击时则弹起，以此此类推。\n\
  \n**图 9.4** *查找和替换对话框的布局*\n\n标签和行编辑框（line edits）布局在网格中；我们将不再显示代码，因为我们已经见过很多这种布局了。\n\
  \n```python\nframeLayout = QVBoxLayout()\nframeLayout.addWidget(self.backwardsCheckBox)\n\
  frameLayout.addWidget(self.regexCheckBox)\nframeLayout.addWidget(self.ignoreNotesCheckBox)\n\
  moreFrame.setLayout(frameLayout)\n```\n\n我们希望额外的复选框布局在 `moreFrame` 内部。为了做到这一点，我们创建一个布局（在这种情况下是垂直框布局），并将复选框添加到其中。然后将该布局设置到框架上。在之前的示例中，我们通过将布局添加到布局中来实现嵌套，但在这里我们通过向框架添加布局来实现嵌套。因此，除了可以在布局之间嵌套外，我们还可以在布局内部嵌套框架和组合框，这赋予了我们极大的灵活性。\n\
  \n```python\nleftLayout = QVBoxLayout()\nleftLayout.addLayout(gridLayout)\nleftLayout.addWidget(self.caseCheckBox)\n\
  leftLayout.addWidget(self.wholeCheckBox)\nleftLayout.addWidget(moreFrame)\n```\n\
  \n左侧布局是一个垂直框布局，我们在其中添加了网格布局（带有标签和行编辑框）、区分大小和全词匹配复选框，然后是 `moreFrame`（它包含位于垂直框布局中的额外复选框）。\n\
  \n```python\nbuttonLayout = QVBoxLayout()\nbuttonLayout.addWidget(self.findButton)\n\
  buttonLayout.addWidget(self.replaceButton)\nbuttonLayout.addWidget(closeButton)\n\
  buttonLayout.addWidget(moreButton)\nbuttonLayout.addStretch()\n```\n\n按钮布局与我们之前见过的非常相似，只不过这次使用的是垂直框布局而不是水平框布局。\n\
  \n```python\nmainLayout = QHBoxLayout()\nmainLayout.addLayout(leftLayout)\nmainLayout.addWidget(line)\n\
  mainLayout.addLayout(buttonLayout)\nself.setLayout(mainLayout)\n```\n\n对话框的主布局是一个水平框布局，左侧布局在左，然后是分割线，最后是按钮布局。该线会根据\
  \ `moreFrame` 是否可见（因此取决于对话框的高短）进行垂直伸缩。\n\n```python\nmoreFrame.hide()\nmainLayout.setSizeConstraint(QLayout.SetFixedSize)\n\
  ```\n\n我们最初隐藏 `moreFrame`（以及它包含的组件），并使用固定大小技巧来确保对话框根据 `moreFrame` 是否可见来调整自身大小。\n\
  \n```python\nself.connect(moreButton, SIGNAL(\"toggled(bool)\"), moreFrame, SLOT(\"\
  setVisible(bool)\"))\n```\n\n我们必须做的最后件事是将“更多”按钮的 `toggled()` 信号连接到 `moreFrame` 的\
  \ `setVisible()` 槽。当框架隐藏（或显示）时，它将反过来隐藏（或显示）布局在内部的所有组件，因为对组件调用 `show()` 或 `hide()`\
  \ 时，PyQt 会自动将这些调用传递给该组件的所有子组件。\n\n\n\n\n一些主窗口风格的应用程序需要在其中心区域使用多个部件。需要此类操作的常见应用程序类型是电子邮件客户端和网络新闻阅读器。我们可以采取三种方法来处理这种情况。一种方法是创建一个复合部件，即一个\
  \ `Composite` 由其他部件组成的部件（它们像对话框一样被创建和布局，但继承自 `QWidget` 而不是 `QDialog`），并使用该部件作为主窗口的中心部件。另一种方法是只设置一个中心部件，并将其他部件放在停靠窗口（dock\
  \ windows）中——我们已经在第 6 章见过这种做法。\n\n第三种方法是使用拆分器（splitters），这也是本节的主题。\n\n图 9.5 显示了一个新闻阅读器应用程序的草图，图\
  \ 9.6 释了表单拆分器与部件之间的关系。`Qt Designer` 完全支持拆分器，其用法与垂直和水平箱式布局非常相似：我们选择两个或多个部件，然后点击 `表单→在拆分器中水平布局`\
  \ 或 `表单→在拆分器中垂直布局`。\n\n在本节中，我们将展示如何在代码中创建拆分器，包括如何保存和恢复它们的相对位置。我们将从查看新闻阅读器草图初始化器的相关部分开始。\n\
  \n```python\nclass MainWindow(QMainWindow):\n\n  def __init__(self, parent=None):\n\
  \    super(MainWindow, self).__init__(parent)\n    self.groupsList = QListWidget()\n\
  \    self.messagesList = QListWidget()\n    self.messageView = QTextBrowser()\n\
  ```\n\n初始化器按照惯例从 `super()` 开始。接下来的三行略微不同，因为尽管这是一个主窗口，但我们创建了三个部件而不是一个。\n\n![Image\
  \ 47](img/index-296_1.jpg)\n\n**图 9.5** 新闻阅读器应用程序草图\n\n```python\nself.messageSplitter\
  \ = QSplitter(Qt.Vertical)\nself.messageSplitter.addWidget(self.messagesList)\n\
  self.messageSplitter.addWidget(self.messageView)\nself.mainSplitter = QSplitter(Qt.Horizontal)\n\
  self.mainSplitter.addWidget(self.groupsList)\nself.mainSplitter.addWidget(self.messageSplitter)\n\
  self.setCentralWidget(self.mainSplitter)\n```\n\n我们现在创建两个拆分器。第一个是 `messageSplitter`；它垂直地持有消息列表和消息视图部件，一个在上在上。第二个拆分器\
  \ `mainSplitter` 水平拆分，分组列表部件在左侧，消息拆分器在右侧。像箱式布局一样，拆分器可以包含两个以上的部件，它们会在每对部件之间放置拆分器。主拆分器持有一个部件和一个拆分器，而另一个拆分器又持有另外两个部件。因此，主拆分器最终包含了其他所有。由于拆分器是部件（与布局不同），拆分器可以作为主窗口的中心部件，正如我们在这里做的那样。\n\
  \n有些用户发现拆分器很烦人，因为他们只能通过鼠标调整大小。我们将通过保存和恢复用户的拆分器大小来减少这种困扰。这很有帮助，因为用户只需设置一次大小，从那时以后他们设置的大小就会被采纳。\n\
  \n**图 9.6** 新闻阅读器的拆分器和部件\n\n```python\nsettings = QSettings()\nsize = settings.value(\"\
  MainWindow/Size\",\nQVariant(QSize(600, 500))).toSize()\nself.resize(size)\nposition\
  \ = settings.value(\"MainWindow/Position\",\nQVariant(QPoint(0, 0))).toPoint()\n\
  self.move(position)\nself.restoreState(\n  settings.value(\"MainWindow/State\").toByteArray())\n\
  self.messageSplitter.restoreState(\n  settings.value(\"MessageSplitter\").toByteArray())\n\
  self.mainSplitter.restoreState(\n  settings.value(\"MainSplitter\").toByteArray())\n\
  ```\n\n保存用户的主窗口设置始于一些恢复窗口大小、位置以及可能存在的任何工具栏和停靠窗口状态的常见代码。拆分器也有状态，并且与主窗口状态相同的方式进行恢复和保存。\n\
  \n```python\ndef closeEvent(self, event):\n  if self.okToContinue():\n    settings\
  \ = QSettings()\n    settings.setValue(\"MainWindow/Size\", QVariant(self.size()))\n\
  \    settings.setValue(\"MainWindow/Position\",\n    QVariant(self.pos()))\n   \
  \ settings.setValue(\"MainWindow/State\",\n    QVariant(self.saveState()))\n   \
  \ settings.setValue(\"MessageSplitter\",\n    QVariant(self.messageSplitter.saveState()))\n\
  \    settings.setValue(\"MainSplitter\",\n    QVariant(self.mainSplitter.saveState()))\n\
  \  else:\n    event.ignore()\n```\n\n在主窗口的关闭事件中，代码再次以熟悉的方式开始，只是我们现在除了主窗口的大小、位置和状态外，还保存了拆分器的状态。\n\
  \n当第一次运行新闻阅读器应用程序时，默认主拆分器将其一半的宽度给分组列表部件，另一半给消息拆分器。同样，消息拆分器将其一半的高度给消息列表部件，另一半给消息视图部件。我们想要改变这些比例，让分组列表更窄，让消息查看器更高，我们可以通过应用伸缩因子（stretch\
  \ factors）来实现。例如：\n\n```python\nself.mainSplitter.setStretchFactor(0, 1)\nself.mainSplitter.setStretchFactor(1,\
  \ 3)\nself.messageSplitter.setStretchFactor(0, 1)\nself.messageSplitter.setStretchFactor(1,\
  \ 2)\n```\n\n`setStretchFactor()` 的第一个参数是部件的从 0 开始的索引位置（从左到右，或从上到下），第二个参数是要应用的伸缩因子。在这种情况下，我们设定第\
  \ 0 个部件（分组列表部件）的伸缩因子为 1，第 1 个部件（消息拆分器）的因子为 3，从而将水平空间按 1:3 划分。同样，对于消息拆分器，我们将垂直空间按\
  \ 1:2 划分，有利于视图部件。由于我们保存并恢复了拆分器的大小，伸缩因子仅在首次运行时生效。\n\n### 单文档界面 (SDI)\n\n对于某些应用程序，用户希望能够处理多个文档。这通常可以通过运行多个应用程序实例来实现，但这消耗大量资源。使用多个实例的另一个缺点是无法提供一个供用户在各种文档之间导航的公共窗口。\n\
  \n这个问题有三种常用的解决方案。一种是使用带标签部件的主窗口，每个标签持有一个文档。这种方法对于网络浏览器很流行，但在编辑文档时可能不方便，因为无法同时看到两个文档。我们不会介绍这种方法，因为本章第二节对标签部件的介绍已经足够，而且你将在练习中有机会尝试它。另外两种方法是\
  \ SDI（我们在本节介绍）和 MDI（将在下一节介绍）。\n\n创建 SDI 应用程序的关键创建一个窗口子类，由它自己处理一切，包括加载、保存和清理，使应用程序本质上成为一个或多个此类窗口的集合。\n\
  \n我们将从查看 SDI 编辑器初始化器的部分提取开始；应用程序本身如图 9.7 所示。\n\n```python\nclass MainWindow(QMainWindow):\n\
  \  NextId = 1\n\n  def __init__(self, filename=QString(), parent=None):\n    super(MainWindow,\
  \ self).__init__(parent)\n    self.setAttribute(Qt.WA_DeleteOnClose)\n    MainWindow.Instances.add(self)\n\
  ```\n\n\n\n\n`NextId` 静态变量用于为新的空窗口提供编号：“Unnamed-1.txt”、“Unnamed-2.txt”等。\n\n该应用程序由一个或多个\
  \ `MainWindow` 实例组成，每个实例都必须能够独立运行。然而，在三种常见情况下，我们需要从其中任何一个实例内部访问所有实例。其一种是提供“保存全部”选项，另一种是提供一个“窗口”菜单，用户可以通过它在不同的窗口实例之间切换，还有一种是提供一个“退出”选项，用户可以使用它来终止应用程序，且它必须隐式地关闭每一个窗口。我们使用\
  \ `Instances` 静态变量来跟踪所有的实例。\n\n当创建一个新的窗口实例时，我们将其设置为在关闭时自动销毁。\n\n这意味着窗口可以由用户直接关闭，也可以由其他实例间接关闭（例如，当应用程序终止时）。使用\
  \ `Qt.WA_DeleteOnClose` 的一个影响是，窗口应该负责保存未保存的更改，并清理自身。我们还将窗口添加到静态窗口实例集合中，这样任何窗口实例都可以访问所有其他窗口。我们将在以后进一步研究这些问题。\n\
  \n### 单文档界面 (SDI)\n\n```python\nself.editor = QTextEdit()\nself.setCentralWidget(self.editor)\n\
  ```\n\n`QTextEdit` 是我们中心部件的理想选择，某些创建动作可以直接传递给它，正如我们稍后将看到的。现在我们将通过 `Action()` 查看其中的几个动作，跳过我们之前看过的\
  \ `createAction()` 方法。\n\n```python\nfileSaveAllAction = self.createAction(\"Save\
  \ A&ll\", self.fileSaveAll, icon=\"filesave\", tip=\"Save all the files\")\n```\n\
  \n此动作与几乎所有其他文件动作类似，它连接到 `MainWindow` 子类的一个方法。\n\n```python\nfileCloseAction = self.createAction(\"\
  &Close\", self.close, QKeySequence.Close, \"fileclose\", \"Close this text editor\"\
  )\n```\n\n“关闭”动作与我们之前看到的那些相似。按照惯例，我们没有重新实现 `close()` 方法，而是重新实现 `closeEvent()` 处理器，以便我们可以拦截窗口的任何清理关闭。不同之处在于，此动作关闭的是当前的唯一窗口，而不是应用程序（除非这是应用程序唯一的窗口）。\n\
  \n```python\nfileQuitAction = self.createAction(\"&Quit\", self.fileQuit, \"Ctrl+Q\"\
  , \"filequit\", \"Close the application\")\n```\n\n“退出”动作会终止应用程序，通过关闭 SDI 文本编辑器的每个窗口来实现，正如我们在回顾\
  \ `fileQuit()` 方法时将看到的。\n\n```python\neditCopyAction = self.createAction(\"&Copy\"\
  , self.editor.copy, QKeySequence.Copy, \"editcopy\", \"Copy text to the clipboard\"\
  )\n```\n\n此动作连接到 `QTextEdit` 相关的槽函数。“剪切”和“粘贴”动作也是如此。\n\n菜单、工具栏和状态栏都是以我们之前看到的方式创建的，但窗口菜单除外，我们现在来查看窗口菜单。\n\
  \n```python\nself.windowMenu = self.menuBar().addMenu(\"&Window\")\nself.connect(self.windowMenu,\
  \ SIGNAL(\"aboutToShow()\"), self.updateWindowMenu)\n```\n\n我们完全没有向窗口菜单添加任何动作。相反，我们简单地将菜单的\
  \ `aboutToShow()` 方法连接到我们自定义的 `updateWindowMenu()` 方法，正如我们将看到的，该方法会用所有的 SDI 文本编辑器窗口填充菜单。\n\
  \n# 第 9 章：布局与多文档\n\n```python\nself.connect(self, SIGNAL(\"destroyed(QObject*)\"\
  ), MainWindow.updateInstances)\n```\n\n当用户关闭窗口时，得益于 `Qt.WA_DeleteOnClose` 标志，窗口将被删除。但由于我们在静态\
  \ `Instances` 集合中保留了窗口的引用，窗口无法被垃圾回收。因此，我们将窗口的 `destroyed()` 信号连接到一个槽函数，该函数通过移除任何已关闭的窗口来更新\
  \ `Instances`。我们在查看 `updateInstances()` 方法时将详细讨论这一点。\n\n由于每个窗口负责单个文件，我们可以为每个窗口关联一个文件名。文件名可以传递给窗口的初始化函数，默认值为空\
  \ `QString`。初始化函数的最后几行处理了文件名。\n\n```python\nself.filename = filename\nif self.filename.isEmpty():\n\
  \    self.filename = QString(\"Unnamed-%d.txt\" % MainWindow.NextId)\n    MainWindow.NextId\
  \ += 1\n    self.editor.document().setModified(False)\n    self.setWindowTitle(\"\
  SDI Text Editor - %s\" % self.filename)\nelse:\n    self.loadFile()\n```\n\n如果窗口没有文件名（是因为程序刚刚启动，或者是因为用户调用了“文件新建”动作），我们就创建一个合适的窗口标题；否则，我们加载给的文件。\n\
  \n`closeEvent()`、`loadFile()`、`fileSave()` 和 `fileSaveAs()` 方法与我们之前看到的那些非常相似，因此我们不会在这里描述它们。（当然，它们在\
  \ `chap09/sditexteditor.pyw` 的源代码中）。相反，我们将重点关注那些对于 SDI 应用程序来说特殊的事务。\n\n```python\n\
  def fileNew(self):\n    MainWindow().show()\n```\n\n当用户调用“文件新建”动作时，会调用此方法。会创建该类的另一个实例，并对其调用\
  \ `show()`（因此它以模态方式显示）。在方法结束时，我们预计窗口将超出作用域并被销毁，因为它没有 PyQt 父对象，也不是实例变量。但在主窗口的初始化函数内部，窗口将自己添加到静态\
  \ `Instances` 集合中，因此仍然存在窗口的对象的引用，因此窗口不会被销毁。\n\n```python\ndef fileOpen(self):\n\
  \    filename = QFileDialog.getOpenFileName(self, \"SDI Text Editor -- Open File\"\
  )\n    if not filename.isEmpty():\n        if not self.editor.document().isModified()\
  \ and self.filename.startsWith(\"Unnamed\"):\n            self.filename = filename\n\
  \            self.loadFile()\n        else:\n            MainWindow(filename).show()\n\
  ```\n\n此方法与我们之前看到的类似方法略有不同。如果用户提供了一个文件名，且当前文档既未修改也未命名（即一个新的空文档），我们将文件加载到现有窗口中；否则，我们创建一个新窗口，并传递它要加载的文件名。\n\
  \n```python\ndef fileSaveAll(self):\n    count = 0\n    for window in MainWindow.Instances:\n\
  \        if isAlive(window) and window.editor.document().isModified():\n       \
  \     if window.fileSave():\n                count += 1\n        self.statusBar().showMessage(\"\
  Saved %d of %d files\" % (count, len(MainWindow.Instances)), 5000)\n```\n\n为了用户，我们提供了一个保存全部菜单选项。当调用它时，我们会遍历\
  \ `Instances` 集合中的每个窗口，对于每个“活跃”且已修改的窗口，我们对其进行保存。\n\n\n\n\n\n# 第 9 章 布局与多文档\n\n```python\n\
  def isAlive(qobj):\n    import sip\n    try:\n        sip.unwrapinstance(qobj)\n\
  \    except RuntimeError:\n        return False\n    return True\n```\n\n`sip` 模块是\
  \ PyQt 的支持模块之一，我们通常不需要直接访问它。但在需要更深入研究的某些情况下，它是很有用的。在这里，该方法尝试访问变量底层的 PyQt 对象。\n\n\
  如果对象已经被删除，则会抛出 `RuntimeError` 异常，在这种情况下我们返回 `False`；否则，对象仍然存在，我们返回 `True`。★ 通过执行此检查，我们确保已关闭并删除的窗口不会被无意中访问，即使我们还没有删除引用该窗口的变量。\n\
  \n★ `isAlive()` 函数基于 Giovanni Bajo 在 PyQt（当时为 PyKDE）邮件列表上的帖子“如何检测一个对象是否已被删除”。该列表同时用于\
  \ PyQt 和 PyKDE。\n\n```python\n@staticmethod\ndef updateInstances(qobj):\n    MainWindow.Instances\
  \ = set([window for window \\\n    in MainWindow.Instances if isAlive(window)])\n\
  ```\n\n每当窗口被关闭（因此被删除）时，它都会发射一个 `destroyed()` 信号，我们在初始化器中将信号连接到 `updateInstances()`\
  \ 方法。该方法用 `Instances` 集合替换为仅包含仍然存活的窗口实例的集合。\n\n那么，为什么在遍历实例时（例如在 `fileSaveAll()`\
  \ 方法中）我们还需要检查存活状态呢？既然该方法已经确保了 `Instances` 集合保持更新并仅持有活跃的窗口？\n\n原因是，从理论上讲，在窗口关闭到 `Instances`\
  \ 集合更新之间，窗口可能会在其他方法中被遍历。\n\n每当用户点击任何 SDI 编辑器窗口中的 `Window` 菜单时，就会一个列出所有当前窗口的菜单。这是因为\
  \ `windowMenu` 的 `aboutToShow()` 信号连接到了填充菜单的 `updateWindowMenu()` 槽。\n\n```python\n\
  def updateWindowMenu(self):\n    self.windowMenu.clear()\n    for window in MainWindow.Instances:\n\
  \        if isAlive(window):\n            self.windowMenu.addAction(window.windowTitle(),\n\
  \            self.raiseWindow)\n```\n\n首先清除任何现有的菜单条目；始终至少有一个，即当前窗口。接下来，我们遍历所有窗口实例，并为任何存活的窗口添加动作。该动作的文本仅为窗口的标题（文件名），以及一个槽——`raiseWindow()`——当用户调用菜单选项时会被调用。\n\
  \n## 单文档界面 (SDI)\n\n★ 在 Mac OS X 上，只有一个菜单栏，位于屏幕顶端。它会发生变化以反映当前获得焦点的窗口。\n\n```python\n\
  def raiseWindow(self):\n    action = self.sender()\n    if not isinstance(action,\
  \ QAction):\n        return\n    for window in MainWindow.Instances:\n        if\
  \ isAlive(window) and \\\n            window.windowTitle() == action.text():\n \
  \           window.activateWindow()\n            window.raise_()\n            break\n\
  ```\n\n此方法可以由 `Window` 菜单的任何条目调用。我们首先进行合理性检查，然后遍历窗口实例，查看哪一个窗口的标题文本与动作文本匹配。如果找到匹配项，我们将该窗口设为“活动”窗口（具有键盘焦点的应用程序顶层窗口），并将其置于所有其他窗口之上，以便用户看到它。\n\
  \n在随后的 MDI 部分中，我们将看到如何创建一个更复杂的 `Window` 菜单，带有加速键和一些额外的菜单选项。\n\n```python\ndef fileQuit(self):\n\
  \    QApplication.closeAllWindows()\n```\n\nPyQt 提供了一个方便的方法来关闭应用程序的所有顶层窗口。该方法对所有窗口调用\
  \ `close()`，这反过来导致每个窗口获取一个 `closeEvent()`。在此事件（未显示）中，我们检查 `QTextEdit` 的文本是否有未保存的更改，如果有，我们就会弹出一个对话框询问用户是否保存。\n\
  \n```python\napp = QApplication(sys.argv)\napp.setWindowIcon(QIcon(\":/icon.png\"\
  ))\nMainWindow().show()\napp.exec_()\n```\n\n在 `sditexteditor.pyw` 文件的末尾，我们创建了一个\
  \ `QApplication` 实例和一个 `MainWindow` 实例，然后启动事件循环。\n\n使用 SDI 方法非常流行，但它也有一些缺点。由于每个主窗口都有自己的菜单栏、工具栏以及可能的停靠窗口，与单个主窗口相比，它的资源开销更大。★\
  \ 此外，虽然使用 `Window` 菜单在窗口之间切换很容易，但如果我们想对窗口的大小和位置有更多控制，就必须自己编写代码。这些问题可以通过我们在下一节中介绍的较不流行的\
  \ MDI 方法来解决。\n\n## 多文档界面 (MDI)\n\n与 SDI 或运行多个应用程序实例相比，MDI 具有许多优势。MDI 应用程序更节省资源，并且让用户能够更容易地布局文档窗口之间的相对关系。然而，一个缺点是，你无法使用\
  \ `Alt+Tab`（Mac OS X 上为 `Command+Tab`）切换 MDI 窗口，尽管在实践中这很少成为，因为对于 MDI 应用程序，程序员总是实现一个\
  \ `Window` 菜单用于在窗口之间导航。\n\n创建 MDI 应用程序的关键是创建一个部件子类，它自己处理一切，包括加载、保存和清理，由应用程序将这些部件保留在\
  \ MDI “工作空间”中，并将任何特定部件的操作传递给它们。\n\n在本节中，我们将创建一个文本编辑器，它提供与上一节 SDI 文本编辑器相同的功能，但这次我们将将其制成\
  \ MDI 应用程序。应用程序如图 9.8 所示。\n\n每个文档都使用自定义 `TextEdit` 部件实例（`QTextEdit` 子类）进行展示和编辑。该部件设置了\
  \ `Qt.WA_DeleteOnClose` 属性，有一个文件名实例变量，并加载和保存给它的文件名。如果部件被关闭（因此被删除），它的关闭事件处理程序将用户有机会保存任何未保存的更改。`TextEdit`\
  \ 的实现非常直观，与我们之前看到的代码非常相似，因此我们在这里不再复习它；其源代码在 `chap09/textedit.py` 模块中。\n\n应用程序本身的代码位于\
