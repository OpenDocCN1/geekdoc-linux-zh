  \ ay, ix, iy, hx, hy]))`\n`painter.drawPolyline(QPolygon([gx, gy, fx, fy, ex, ey]))`\n\
  `painter.drawPolyline(QPolygon([bx, by, cx, cy, dx, dy]))`\n\n最后我们绘制代表管道侧面的线条。第一条线从\
  \ `a` 到 `i` 再到 `h`，标记管道的左侧；第二条从 `g` 到 `f` 再到 `e`，标记管道的右侧；第三条从 `b` 到 `c` 再到 `d`，标记顶部的“V”型部分。\n\
  \n与内置的 PyQt 组件一样，`YPipeWidget` 和 `FractionSlider` 都可以作为顶级组件使用，这在开发和测试自定义组件时特别有用。`chap11/fractionslider.py`\
  \ 和 `chap11/ypipewidget.py` 都可以作为独立程序运行，因为它们在 `QWidget` 子类之后都有一个 `if __name__ ==\
  \ \"__main__\":` 语句，其代码创建了 `QApplication` 并创建并显示自定义组件。\n\n## 总结\n\nPyQt 提供了多种自定义组件外观和行为的方法。最简单且最常用的方法是将现有组件的属性设置为我们想要的值。从\
  \ Qt 4.2 开始，可以使用样式表（style sheet）属性，这允许我们仅通过使用 CSS 语法输入纯文本，就能对组件的外观产生巨大的影响。样式表的一个常见且简单的用法是设置强制组件的背景颜色。\n\
  \n复合组件（Composite widgets）允许我们将两个或多个组件组合在一起，然后将生成的组件视为单个组件。如果复合组件被频繁使用，这可以节省时间，并为主窗口风格应用程序的中心区域提供放置多个组件的方法。某些程序员会将组成组件设为私有并转发它们的信号和槽，但在许多情况下，最简单的方法是将组成组件保留为公共实例变量，并直接访问和连接它们。\n\
  \n通过子类化现有组件来适配其外观特别是行为，比创建一个 `QWidget` 子类并自己完成所有工作要容易得多。这种方法适用于几乎每个 PyQt 组件，因为大多数组件在设计时就是为了子类化。这种方法的唯一局限性是它只能应用于与我们想要的组件足够相似的组件，以使适配可行。\n\
  \n如果我们需要创建一个与其他任何组件都不同的组件，或者我们希望对自定义组件的外观和行为进行完全控制，我们可以子类化 `QWidget`。我们的子类必须重实现\
  \ `paintEvent()`、`sizeHint()` 和 `minimumSizeHint()`，并且几乎总是重实现 `keyPressEvent()`\
  \ 和一些鼠标事件处理器。大多数内置组件都是通过这种方式创建的，其余的则是其他内置组件的子类。\n\n我们在本章中（实际上是整本书中）所有自定义或创建的组件，在外观和行为上都是相当常规的。\n\
  \nPyQt 并不强制这种保守性，我们可以自由地创建任何想象任何外观和行为的组件。\n\n## 练习\n\n创建图 11.8 所示的 `Counters` 自定义组件。该组件应该显示一个\
  \ 3 × 3 的网格，每个方格可以是空白（仅显示背景颜色），也可以带有一个红色或黄色的椭圆。任何网格单元的状态应该在空白、红色、黄色和返回空白之间无限循环变化。\n\
  \n当用户点击方格或在方格上按下空格键时，状态应发生变化。键盘焦点应通过用粗蓝色笔绘制方格来显示，而不是使用其他方格使用的普通细黑笔。用户应该能够通过点击方格来更改聚焦的方格。\n\
  \n```python\nif __name__ == \"__main__\":\n    app = QApplication([])\n    counter\
  \ = Counters()\n    counter.show()\n    app.exec_()\n```\n\n图 11.8 *Counters 自定义组件*\n\
  \n\n\n\n\n# 第 12 章 简介\n\n## 基于项的图形 (Item-Based Graphics)\n\n图形视图类本质上是二维的；尽管如此，每个项都有一个\
  \ `z` 值，`z` 值较高的项绘制在 `z` 值的项之上。碰撞检测是基于项的 (`x`, `y`) 位置的。除了碰撞信息外，场景还可以告诉我们哪些项包含特定点、哪些项位于特定区域，以及哪些项被选中。场景有一个前景层（foreground\
  \ layer），例如用于绘制一个覆盖在场景中所有项之上的网格；它们还有一个背景层（background layer），绘制在所有项的下方，用于提供背景图像或颜色。\n\
  \n项要么是场景的子级（类似于 PyQt 正常的父子控件关系），要么是另一个项的子。当对某个项应用变换时，这些变换会自动应用到该项的所有子项，递归地应用到最远的孙子项。这意味着如果一个项被移动（例如被用户拖动），它所有的子项都会随之移动。也可以有一组同级项，即对组中的一个项进行变换只会影响该项的子项，而不会影响组中的其他成员。\n\
  \n(0, 0)\n项 #1\n项 #2\n场景\n(`width`, `height`)\n\n**图 12.1** 图形项使用本地逻辑坐标\n\n图形视图类使用了三种不同的坐标系统，尽管在实践中我们通常只关心其中两种。视图使用物理坐标系统。场景使用一个我们在创建它们时选择的逻辑坐标系统。PyQt\
  \ 会自动将场景坐标映射到视图视口（viewport）并对其进行对齐。本质上，场景使用“窗口”坐标，而视图使用“视口”窗口坐标。因此，当我们放置项时，是根据场景坐标来放置它们。第三种坐标系统是项（items）使用的坐标系统。这特别方便，因为它是一个以点\
  \ `(0, 0)` 为中心的逻辑坐标系统。每个项的 `(0, 0)` 实际上位于该项在场景中的位置。这意味着在实践中，我们始终相对于它们的中心点来绘制项——我们不需要担心父项对其应用了任何变换，因为场景会自动为我们处理这些问题。图\
  \ 12.1 展示了场景坐标和项坐标之间的关系。\n\n在本章中，我们将查看两个示例，它们共同展示了图形视图类的许多不同方面。第一个示例是典型的应用程序类型，用户逐个创建项，并单独或以选定组的形式操纵项。该应用程序还展示了用户交互，包括选择、移动和调整项的大小。第二个示例展示了具有复杂形状的动画复合项。它还展示了如何根据场景的细节水平（放大或放小的程度）来尽量减少绘制项的工作量。\n\
  \n## 自定义和交互式图形项\n\n预定义的图形项可以通过在它们上调用 `setFlags()` 并传入合适的常量，使其变为可移动的、可选的和可焦点的。用户可以使用鼠标拖动可移动的项，可以通过点击它们来选择可选的项，并使用\
  \ `Ctrl+Click` 选择多个项。可焦点项将接收按键事件，但除非我们创建一个带有按键事件处理程序的项子类，否则它们将忽略这些事件。同样，我们可以通过子类并实现相应的鼠标事件处理器，使项对鼠标事件产生响应。\n\
  \n在这一节中，我们将使用两个预定义的图形项，并创建两个自定义图形项子类，展示如何使用图形项，以及如何控制它们的行为和外观。我们还将看到如何加载和保存场景，以及如何打印它们。为了完成这些，我们将查看图\
  \ 12.2 所示的 Page Designer 应用程序。该程序允许用户创建一个包含文本、图像和框框的页面。用户还可以创建线条——这些只是宽度或高度为 1 像素的框框。用户创建的图像可以保存并加载为\
  \ `.pgd` 文件（这是该应用程序特有的自定义文件格式），并可以使用打印对话框进行打印（或保存为 PDF 文件）。\n\n对于文本项，使用了 `QGraphicsTextItem`\
  \ 子类，并进行了扩展以允许用户通过双击设置项的字体和文本。对于框框（以及线条）项，使用了 `QGraphicsItem` 子类。它具有右键菜单，以及用于调整大小的键盘支持，并处理所有的绘制工作。位图项直接使用内置的\
  \ `QGraphicsPixmapItem` 类，而页面和边距指南使用内置的 `QGraphicsRectItem` 类。显示场景的视图是一个 `QGraphicsView`\
  \ 子类，支持橡形框选择和鼠标轮缩放。\n\n我们将从查看 `QGraphicsView` 子类开始。然后我们将回顾主表，最后将回顾自定义的 `QGraphicsItem`\
  \ 子类。\n\n```python\nclass GraphicsView(QGraphicsView):\n    def __init__(self, parent=None):\n\
  \        super(GraphicsView, self).__init__(parent)\n        self.setDragMode(QGraphicsView.RubberBandDrag)\n\
  \        self.setRenderHint(QPainter.Antialiasing)\n        self.setRenderHint(QPainter.TextAntialiasing)\n\
  \n    def wheelEvent(self, event):\n        factor = 1.41 ** (-event.delta() / 240.0)\n\
  \        self.scale(factor, factor)\n```\n\n前面的代码是完整的 `GraphicsView` 子类。在初始化器中我们设置了拖动模式：这意味着在视图上拖动会导致\
  \ PyQt 为我们提供橡形框，每个被橡形框碰到的项都会被选中。渲染提示会传播到视图内部的任何项，因此我们不需要为每个图形项设置提示。\n\n当用户滚动鼠标轮时，都会调用轮事件，它会根据滚轮的方向使视图缩小或放大。这种效果是改变了页面的视觉大小——底层场景并没有改变。该事件处理器中使用的数学逻辑比较复杂，但并不是问题，因为该方法可以原样复制粘贴。\n\
  \n在 `chap12/pagedigner.py` 顶部我们定义了一些全局变量。\n\n```\nPageSize = (612, 792)\nPointSize\
  \ = 10\nMagicNumber = 0x70616765\nFileVersion = 1\nDirty = False\n```\n\n页面大小以磅为单位适用于\
  \ Letter Size。（源代码中也有注释掉的 A4 尺寸。）魔数和文件版本用于 `QDataStream`，正如我们在第 8 章和其他地方看到那样。我们还有一个全局脏标记。\n\
  \n我们没有显示导入部分，但它们包含了 `functools`。这是因为在右键菜单中，我们使用了 `functools.partial()` 函数来封装带适当参数的方法。\n\
  \n**图 12.2** Page Designer 应用程序\n\n主形式的初始化器非常长，所以我们将分部分查看，并省略与我们在其他地方看到的相似的代码——例如我们创建和布局表单按钮的地方。\n\
