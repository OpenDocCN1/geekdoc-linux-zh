  \ 扩展名，而不是我们在 Image Changer 中使用的 unicode 方法。\n\n## 数据容器的职责\n\n应用程序的数据容器负责持有所有数据（即电影记录）以及保存和加载它们。在在前一节中\
  \ `MainWindow.updateTable()` 时，我们看到容器如何使用 for 循环进行迭代以获取所有电影，以便它们能在应用程序的 QTableWidget\
  \ 中显示。在本节中，我们将查看由 `moviedata` 模块提供的功能，包括所使用的数据结构，但不包含实际的保存和加载代码。\n\n为什么要使用自定义容器呢？毕竟，我们可以简单地使用\
  \ Python 的内置数据结构，例如列表或字典。我们更倾向于采用将标准数据结构封装在自定义类中的方法。这确保了对数据的访问由我们的类控制，这有助于维护数据的完整性。它还使得扩展容器的功能变得更容易，并在未来替换底层数据结构时，不会影响现有代码。换句话说，这是一种面向对象的方法，避免了简单地使用（例如）列表配合一些全局泛的缺点。\n\
  \n我们将从 `moviedata` 模块的导入和常量开始。\n\n```python\nimport bisect\nimport codecs\nimport\
  \ copy_reg\nimport cPickle\nimport gzip\nfrom PyQt4.QtCore import *\nfrom PyQt4.QtXml\
  \ import *\n```\n\n我们将按照规范一化的标题顺序存储电影，忽略大小写，并忽略开头的“A”、“An”和“The”单词。为了最小化插入和查找时间，我们使用\
  \ `bisect` 模块维护顺序，使用了与我们在第 3 章中实现的 `OrderedDict` 相同的技术。\n\n`codecs` 模块对于使用特定的文本编码读写\
  \ Python 文本文件是必要的。`copy_reg` 和 `cPickle` 模块用于保存和加载 Python “pickles”—这些是包含 Python\
  \ 数据结构的文件。`gzip` 模块用于压缩数据；我们将使用它来压缩和解压我们的 pickle 数据。`PyQt4.QtCore` 的导入是熟悉的，但我们还必须导入\
  \ `PyQt4.QtXml` 模块，以便访问 PyQt 的 SAX 和 DOM 解析器。\n\n\n\n\n\n我们想对文本文件使用 UTF-8 编码。这是一种\
  \ 8 位的 Unicode 编码，每个 ASCII 字符使用一个字节，而任何其他字符使用两个或多个字节。它可能是文件中应用最广泛 Unicode 文本编码。通过使用\
  \ Unicode，我们可以存储今天使用的几乎任何人类语言编写的文本。\n\n尽管 `\\n` 是有效的 Unicode 字符，但在使用 XML 时，我们需要使用\
  \ Unicode 特定的段落符和换行符。这是因为 XML 解析器通常不区分一种 ASCII 空格字符（如换行符）和另一种空格字符（如空格），如果我们想保留用户的换行和段落分隔，这将会是不方便的。\n\
  \n```python\nclass Movie(object):\n    UNKNOWNYEAR = 1890\n    UNKNOWNMINUTES =\
  \ 0\n\n    def __init__(self, title=None, year=UNKNOWNYEAR,\n                 minutes=UNKNOWNMINUTES,\
  \ acquired=None, notes=None):\n        self.title = title\n        self.year = year\n\
  \        self.minutes = minutes\n        self.acquired = acquired \\\n        if\
  \ acquired is not None else QDate.currentDate()\n        self.notes = notes\n```\n\
  \n`Movie` 类用于存储有关一部电影的数据。我们直接使用实例变量，而不是提供简单的 getter 和 setter。标题和注释以 `QStrings` 形式存储，获取日期以\
  \ `QDate` 形式存储。电影的年份和以分钟为单位的时长以 `ints` 形式存储。我们提供了两个静态常量，表示我们不知道电影何时上映或时长有多长。\n\n\
  现在我们准备查看电影容器类了。该类持有一个有序的电影列表，并提供了以各种格式保存和加载（以及导出和导入）电影的功能。\n\n```python\nclass MovieContainer(object):\n\
  \    MAGIC_NUMBER = 0x3051E\n    FILE_VERSION = 100\n\n    def __init__(self):\n\
  \        self.__fname = QString()\n        self.__movies = []\n        self.__movieFromId\
  \ = {}\n        self.__dirty = False\n```\n\n## 数据容器的职责\n\n`MAGIC_NUMBER` 和 `FILE_VERSION`\
  \ 用于使用 PyQt 的 `QDataStream` 类保存和加载文件。\n\n文件名以 `QString` 存储。`__movies` 列表的每个元素本身是一个包含两个元素的列表，第一个元素是排序键，第二个元素是\
  \ `Movie`。这是该类主要的数据结构，用于按顺序存储电影。`__movieFromId` 字典的键是 `Movie` 对象的 `id()`，值是 `Movies`。正如我们在第\
  \ 1 章中看到的，每个 Python 对象都非常方便地有一个唯一 ID，可以通过对它调用 `id()` 来获取。该字典用于在已知电影 ID 时提供快速查找。例如，主窗口将电影\
  \ ID 作为“用户”数据存储在它的 `QTableWidgetItems` 的第一列中。当然，数据没有重复，因为这两个数据结构实际上持有的是 `Movie`\
  \ 对象的引用，而不是 `Movie` 对象本身。\n\n```python\n    def __iter__(self):\n        for pair\
  \ in iter(self.__movies):\n            yield pair[1]\n```\n\n当 `MainWindow.updateTable()`\
  \ 方法使用 `for` 循环遍历电影容器时，Python 使用了容器的 `__iter__()` 方法。在这里我们可以看到，我们遍历了有序的 `[key, movie]`\
  \ 列表，每次返回电影项。\n\n```python\n    def __len__(self):\n        return len(self.__movies)\n\
  ```\n\n此方法允许我们在电影容器上使用 `len()` 函数。在接下来的章节中，我们将看到以各种格式加载和保存电影容器中存储电影的代码。但首先，我们将查看容器是如何清空的，以及电影是如何被添加、删除和更新的，以便我们能够熟悉容器的工作原理，特别是关于排序的。\n\
  \n```python\n    def clear(self, clearFilename=True):\n        self.__movies = []\n\
  \        self.__movieFromId = {}\n        if clearFilename:\n            self.__fname\
  \ = QString()\n            self.__dirty = False\n```\n\n此方法用于清除所有数据，可能包括文件名。它从 `MainWindow.fileNew()`\
  \ 调用（该方法会清除文件名），以及各种保存和加载方法调用（这些方法保持文件名不变）。电影容器维护了一个脏标记（dirty flag），以便它始终知道是否有未保存的更改。\n\
  \n```python\n    def add(self, movie):\n        if id(movie) in self.__movieFromId:\n\
  \            return False\n        key = self.key(movie.title, movie.year)\n   \
  \     bisect.insort_left(self.__movies, [key, movie])\n        self.__movieFromId[id(movie)]\
  \ = movie\n        self.__dirty = True\n        return True\n```\n\n第一个 `if` 语句确保我们不会重复添加同一部电影。我们使用\
  \ `key()` 方法生成一个合适的排序键，然后使用 `bisect` 模块的 `insort_left()` 函数将包含两个元素的 `[key, movie]`\
  \ 列表插入到 `__movies` 列表中。这是非常快的，因为 `bisect` 模块使用了二分查找算法。我们还确保 `__movieFromId` 字典是最新的，并将容器标记为脏数据。\n\
  \n```python\n    def key(self, title, year):\n        text = unicode(title).lower()\n\
  \        if text.startswith(\"a \"):\n            text = text[2:]\n        elif\
  \ text.startswith(\"an \"):\n            text = text[3:]\n        elif text.startswith(\"\
  the \"):\n            text = text[4:]\n        parts = text.split(\" \", 1)\n  \
  \      if parts[0].isdigit():\n            text = \"%08d \" % int(parts[0])\n  \
  \      if len(parts) > 1:\n            text += parts[1]\n        return u\"%s\\\
  t%d\" % (text.replace(\" \", \"\"), year)\n```\n\n```python\n    def delete(self,\
  \ movie):\n        if id(movie) not in self.__movieFromId:\n            return False\n\
  \        key = self.key(movie.title, movie.year)\n        i = bisect.bisect_left(self.__movies,\
  \ [key, movie])\n        del self.__movies[i]\n        del self.__movieFromId[id(movie)]\n\
  \        self.__dirty = True\n        return True\n```\n\n## 数据容器的职责\n\n要删除一部电影，我们必须从两个数据结构中将其删除，并且在\
  \ `__movies` 列表中，我们必须找到电影的索引位置。\n\n```python\n    def updateMovie(self, movie, title,\
  \ year, minutes=None, notes=None):\n        if minutes is not None:\n          \
  \  movie.minutes = minutes\n        if notes is not None:\n            movie.notes\
  \ = notes\n        if title != movie.title or year != movie.year:\n            key\
  \ = self.key(movie.title, movie.year)\n            i = bisect.bisect_left(self.__movies,\
  \ [key, movie])\n            self.__movies[i][0] = self.key(title, year)\n     \
  \       movie.title = title\n            movie.year = year\n            self.__movies.sort()\n\
  \        self.__dirty = True\n```\n\n如果用户编辑了电影，应用程序总是带上用户的更改调用此方法。如果传递的 `minutes`\
  \ 或 `notes` 为 `None`，我们认为它们没有变化。如果电影的标题或年份发生了变化，该电影现在可能处于 `__movies` 列表的错误位置。在这种情况下，我们使用其原始标题和年份找到电影，设置新的标题和年份，然后重新排序列表。这在实践中的开销并不像初看起来看起来那么大。列表最多包含一个排序错误的项，而且\
  \ Python 的排序算法对部分排序的数据经过了高度优化。\n\n如果我们发现这里有性能问题，可以始终使用 `delete()` 和 `add()` 来重新实现\
  \ `updateMovie()`。\n\n```python\n    @staticmethod\n    def formats():\n       \
  \ return \"*.mqb *.mpb *.mqt *.mpt\"\n```\n\n通常情况下，我们会为应用程序提供一个或最多两个自定义数据格式，但为了演示目的，我们提供了使用四个扩展名的三种格式。`.mqb`\
  \ 是 Qt 二进制格式，它使用 `QDataStream` 类，而 `.mpb` 是 Python pickle 格式（使用 gzip 压缩）。`.mqt`\
  \ 是 Qt 文本格式，它使用 `QTextStream` 类，而扩展\n\n\n\n\n\n`.mpt` 是 Python 文本格式。两种文本格式的内容是相同的，但通过使用不同的扩展名，我们可以为了对比而使用不同的保存和加载代码。\n\
  \n```python\ndef save(self, fname=QString()):\n    if not fname.isEmpty():\n   \
  \     self.__fname = fname\n        if self.__fname.endsWith(\".mqb\"):\n      \
  \      return self.saveQDataStream()\n        elif self.__fname.endsWith(\".mpb\"\
  ):\n            return self.savePickle()\n        elif self.__fname.endsWith(\"\
  .mqt\"):\n            return self.saveQTextStream()\n        elif self.__fname.endsWith(\"\
  .mpt\"):\n            return self.saveText()\n    return False, \"Failed to save:\
  \ invalid file extension\"\n```\n\n当用户调用“保存文件”操作时，我们期望数据容器的 `save()` 方法被调用。这在 My\
  \ Movies 中确实是这样，而且也是标准做法。然而，在这里，`save()` 方法并没有执行保存操作，而是将工作交给了一个特定于文件名扩展名的方法。这纯粹是为了展示如何以不同的格式进行保存；在实际应用程序中，我们通常只使用一种格式。\n\
  \n有一个对应的 `load()` 方法，其逻辑与 `save()` 方法相同，并将工作传递给特定于扩展名的 `load` 方法。所有的 `load` 和 `save`\
  \ 方法都返回一个包含两个元素的元组，第一个元素是布尔值文件成功/失败标志，第二个元素是消息（可以是错误信息或成功发生事件的错误报告）。\n\n我们现在已经看到了应用程序处理文件的基础设施以及在内存中持有数据的侧边栏容器的数据结构。在接下来的章节中，我们将查看执行容器数据与磁盘之间保存和加载的代码。\n\
  \n# 保存和加载二进制文件\n\nPyQt 和 Python 标准库都提供了读写二进制文件的设施。PyQt 使用 `QDataStream` 类，而 Python\
  \ 标准库则直接或结合 `pickle` 模块使用 `file` 类。\n\n二进制格式不是人类可读的，但它们最容易编写代码，且读写磁盘的速度最快。不需要解析：数字、日期以及许多\
  \ PyQt 类型（包括图像）可以在不进行格式化的情况下进行读取和写入。PyQt 对二进制文件的支持非常强大：PyQt 确保了二进制文件是平台无关的，而且对二进制文件类型进行版本控制并不困难，这样我们就可以根据需要扩展我们的文件格式。Python\
  \ 标准库的 `pickle` 模块（及其更快的 `cPickle` 对应项）也提供了快速的平台无关加载和保存，但在处理图像等复杂的 PyQt 类型时，可能没有\
  \ PyQt 的 `QDataStream` 高效。\n\n## 使用 QDataStream 进行读写\n\n`QDataStream` 类可以以二进制格式读写\
  \ Python 布尔型、数值类型以及 PyQt 类型（包括图像）。由 `QDataStream` 写入的文件是平台无关的；该类会自动处理字节序（endian-ness）和字长。PyQt\
  \ 的几乎每个新版本都有一个使用新二进制格式进行数据存储 `QDataStream`——这样做是为了让 `QDataStream` 能够适应新的数据类型，并支持对现有数据类型的增强。这不是一个问题，因为每个版本的\
  \ `QDataStream` 都可以读取存储在所有以前版本使用的格式中的数据。此外，无论使用哪个版本的 `QDataStream`，`QDataStream`\
  \ 始终以相同的方式存储整数。\n\n```python\ndef saveQDataStream(self):\n    error = None\n   \
  \ fh = None\n    try:\n        fh = QFile(self.__fname)\n        if not fh.open(QIODevice.WriteOnly):\n\
  \            raise IOError, unicode(fh.errorString())\n        stream = QDataStream(fh)\n\
  \        stream.writeInt32(MovieContainer.MAGIC_NUMBER)\n        stream.writeInt32(MovieContainer.FILE_VERSION)\n\
  \        stream.setVersion(QDataStream.Qt_4_2)\n```\n\n由于 PyQt 使用返回值而不是异常，如果无法打开文件，我们会手动抛出异常，因为我们更倾向于基于异常的错误处理方法。打开文件后，我们创建一个\
  \ `QDataStream` 对象进行写入。\n\nPyQt 无法猜测我们想要用多大的整数来存储 `int` 和 `long` 整数，因此我们必须使用 `writeIntn()`\
  \ 和 `writeUIntn()` 方法来写入整数值，其中 `n` 是 8、16、32 或 64，即存储整数所需的位数。对于浮点数，`QDataStream`\
  \ 提供了 `writeDouble()` 和 `readDouble()` 方法。这些方法作用于 Python 浮点数（等同于 C 和 C++ 的 double），并以\
  \ IEEE-754 格式存储为 64 位值。\n\n我们写入的第一个整数是“魔数”（magic number）。这是一个我们用于识别 My Movies 数据文件的任意数字。这个数字永远不会改变。我们应该给任何自定义的二进制数据文件一个唯一的魔数，因为不能总是依赖文件名扩展名来正确识别文件类型。接下来，我们写入一个“文件版本”。这是我们文件格式的版本（我们将其设置为\
  \ 100）。如果我们以后决定更改文件格式，魔数将保持不变——毕竟，文件仍然持有电影数据——但文件格式将发生变化（例如改为 101），以便我们可以执行不同的代码来加载它，以处理格式的差异。\n\
  \n由于整数总是以相同的格式保存，我们可以安全地在设置版本之前写入它们。在设置 `QDataStream` 版本之前，我们可以安全地写入整数。一旦写入了魔数和文件版本，我们应该设置\
  \ `QDataStream` 版本，取决于我们的文件格式。如果我们想利用后续版本，可以使用 `Qt_4_2` 的原始文件格式。然后当我们加载数据时，我们需要设置\
  \ `QDataStream` 版本。\n\n设置 `QDataStream` 版本非常重要，因为它将确保任何 PyQt 数据类型都能正确保存和加载。只有在我们只保存和加载整数时，这种设置才不重要，因为它们的表示不会改变。\n\
  \n```python\nfor key, movie in self.__movies:\n    stream << movie.title\n    stream.writeInt16(movie.year)\n\
  \    stream.writeInt16(movie.minutes)\n    stream << movie.acquired << movie.notes\n\
  ```\n\n现在我们遍历电影数据，将每部电影的数据写入数据流。数据的格式如图 8.3 所示。`QDataStream` 类为许多类重载了 `<<` 运算符，例如\
  \ `QString`、`QDate` 和 `QImage`，因此我们必须使用类似 C++ 的流语法来写入数据。`<<` 运算符将其右侧的操作数写入左侧的数据流。它可以重复应用于同一个流，因为它返回了所应用的流，但对于整数，我们必须使用\
  \ `writeIntn()` 和 `writeUIntn()` 方法。\n\n**图 8.3** QDataStream My Movies 文件格式\n(电影\
  \ #1, 电影 #2, ... 电影 #n 包含 QString, int, int, QDate, QString)\n\n由于我们写入的是二进制数据，不需要进行任何格式化。我们只需要确保在回读数据时，使用相同的\
  \ `QDataStream` 版本，并按照保存时的顺序以相同的数据类型加载。\n\n因此在这种情况下，我们将加载两个整数（魔数和文件版本号），然后是任意数量的电影记录，每条记录由一个字符串、两个整数、一个日期和一个字符串组成。\n\
  \n```python\nexcept (IOError, OSError), e:\n    error = \"Failed to save: %s\" %\
  \ e\nfinally:\n    if fh is not None:\n        fh.close()\nif error is not None:\n\
  \    return False, error\nself.__dirty = False\nreturn True, \"Saved %d movie records\
  \ to %s\" % (\n    len(self.__movies),\n    QFileInfo(self.__fname).fileName())\n\
  ```\n\n\n\n如果发生任何错误，我们直接放弃并返回一个失败标记和错误消息。否则，我们清除脏标记并返回一个成功标记以及一条指示保存了多少记录的消息。\n\n\
  相应的加载方法同样简单直接，尽管它需要进行更多的错误处理。\n\n```python\ndef loadQDataStream(self):\n    error\
  \ = None\n    fh = None\n    try:\n        fh = QFile(self.__fname)\n        if\
  \ not fh.open(QIODevice.ReadOnly):\n            raise IOError, unicode(fh.errorString())\n\
  \        stream = QDataStream(fh)\n        magic = stream.readInt32()\n        if\
  \ magic != MovieContainer.MAGIC_NUMBER:\n            raise IOError, \"unrecognized\
  \ file type\"\n        version = stream.readInt32()\n        if version < MovieContainer.FILE_VERSION:\n\
  \            raise IOError, \"old and unreadable file format\"\n        elif version\
  \ > MovieContainer.FILE_VERSION:\n            raise IOError, \"new and unreadable\
  \ file format\"\n        stream.setVersion(QDataStream.Qt_4_2)\n        self.clear(False)\n\
  ```\n\n我们和之前一样创建 `QFile` 对象和 `QDataStream` 对象，只是这次使用的是 `ReadOnly` 模式而不是 `WriteOnly`\
  \ 模式。然后我们读取魔数。如果它不是唯一的 `My Movies` 数据文件数字，我们就会抛出一个异常。接下来我们读取文件版本，并确保它是我们可以处理的版本。在此时，如果我们正在使用这种文件格式的多个版本，我们就会根据文件版本进行分支处理。然后我们设置\
  \ `QDataStream` 的版本。\n\n下一步是清除电影数据结构。我们尽可能晚地执行此操作，这样如果早些抛出了异常，原始数据将完好无损。`False`\
  \ 参数告诉 `clear()` 方法清除 `__movies` 和 `__movieFromId`，但不清除文件名。\n\n```python\nwhile\
  \ not stream.atEnd():\n    title = QString()\n    acquired = QDate()\n    notes\
  \ = QString()\n    stream >> title\n    year = stream.readInt16()\n```\n\n第 8 章。数据处理与自定义文件格式\n\
  \n## 文件错误处理的方法\n\n本章中用于处理文件错误的方法使用了左侧所示结构。另一种同样有效的方法（例如在 `chap09/textedit.py` 和\
  \ `chap14/ships.py` 中使用）如右侧所示。\n\n```python\nerror = None\nexception = None\nfh\
  \ = None\ntry:\n    try:\n        # open file and read data\n    except (IOError,\
  \ OSError), e:\n        error = unicode(e)\n        exception = e\n    finally:\n\
  \        if fh is not None:\n            fh.close()\nif error is not None:\n   \
  \ if exception is not None:\n        return False, error\n    raise exception\n\
  return True, \"Success\"\n```\n\n在调用点，假设我们正在处理一个 `load()` 方法，对于左侧的方法我们可能会使用如下代码：\n\
  \n```python\nok, msg = load(args)\nif not ok:\n    QMessageBox.warning(self, \"\
  File Error\", msg)\n```\n\n对于右侧的方法，我们可以使用如下代码：\n\n```python\ntry:\n    load(args)\n\
  except (IOError, OSError), e:\n    QMessageBox.warning(self, \"File Error\", unicode(e))\n\
  ```\n\n另一种方法（在 `chap09/sditexteditor.pyw` 和 `chap12/pagedesigner.pyw` 中使用）是在文件处理方法内部进行所有的错误处理：\n\
  \n```python\nfh = None\ntry:\n    # open file and read data\nexcept (IOError, OSError),\
  \ e:\n    QMessageBox.warning(self, \"File Error\", unicode(e))\nfinally:\n    if\
  \ fh is not None:\n        fh.close()\n```\n\n在调用点，我们只需调用 `load(args)`，让 `load()`\
  \ 方法本身向用户报告任何问题。\n\n## 保存和加载二进制文件\n\n### 表 8.1：选定的 QDataStream 方法\n\n| 语法 | 描述 |\n\
