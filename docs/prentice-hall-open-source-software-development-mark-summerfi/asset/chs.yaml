  \n```python\nself.model = QSqlTableModel(self)\nself.model.setTable(\"calls\")\n\
  self.model.setSort(STARTTIME, Qt.AscendingOrder)\nself.model.select()\n```\n\n现在我们有了合适的控件和模型，但必须将它们连接起来。这是通过使用\
  \ `QDataWidgetMapper` 实现的。\n\n```python\nself.mapper = QDataWidgetMapper(self)\n\
  ```\n\n\n\n\n```\nself.mapper.setSubmitPolicy(QDataWidgetMapper.ManualSubmit)\n\n\
  self.mapper.setModel(self.model)\n\nself.mapper.addMapping(self.callerEdit, CALLER)\n\
  \nself.mapper.addMapping(self.startDateTime, STARTTIME)\n\nself.mapper.addMapping(self.endDateTime,\
  \ ENDTIME)\n\nself.mapper.addMapping(topicEdit, TOPIC)\n\nself.mapper.toFirst()\n\
  ```\n\n要让数据部件映射器工作，我们必须为它提供一个模型以及一组表单中的控件与模型对应列之间的映射。（变量、ID、`CALLER`、`STARTTIME`\
  \ 等在文件开始处被设置为 0、1、2 等。）映射器可以设置为自动提交更改，也可以仅在接到指令时提交。我们更倾向于后一种方法，因为它给我们提供了更细粒度的控制，并且意味着当用户导航到不同的记录时，我们可以确保任何未保存的更改都已保存。设置好映射后，我们需要映射器用记录填充控件；我们通过调用\
  \ `toFirst()` 这一点，这意味着启动时会显示第一条记录。\n\n```python\nself.connect(firstButton, SIGNAL(\"\
  clicked()\"),\n             lambda: self.saveRecord(PhoneLogDlg.FIRST))\n\nself.connect(prevButton,\
  \ SIGNAL(\"clicked()\"),\n             lambda: self.saveRecord(PhoneLogDlg.PREV))\n\
  \nself.connect(nextButton, SIGNAL(\"clicked()\"),\n             lambda: self.saveRecord(PhoneLogDlg.NEXT))\n\
  \nself.connect(lastButton, SIGNAL(\"clicked()\"),\n             lambda: self.saveRecord(PhoneLogDlg.LAST))\n\
  \nself.connect(addButton, SIGNAL(\"clicked()\"), self.addRecord)\nself.connect(deleteButton,\
  \ SIGNAL(\"clicked()\"),\n             self.deleteRecord)\n\nself.connect(quitButton,\
  \ SIGNAL(\"clicked()\"), self.accept)\nself.setWindowTitle(\"Phone Log\")\n```\n\
  \n前四个连接提供了导航功能。在每情况下，我们都调用 `saveRecord()`，它会保存任何未保存的更改，然后根据 lambda 语句封装的参数进行导航。这意味着\
  \ `PyQt` 支持我们只需要一个单一方法 `saveRecord()`，而不是为每个导航按钮编写一个方法。然而，这些连接仅在 `PyQt` 4.1.1 或更高版本中有效。对于较早版本，我们必须保留一个包含\
  \ lambda 函数引用的实例变量（例如列表），以防止它们被垃圾回收。\n\n```python\ndef accept(self):\n    self.mapper.submit()\n\
  \    QDialog.accept(self)\n```\n\n如果用户点击退出（Quit），我们调用 `QDataWidgetMapper.submit()`，这将当前记录写回底层模型，然后关闭窗口。\n\
  \n```python\ndef saveRecord(self, where):\n    row = self.mapper.currentIndex()\n\
  \    self.mapper.submit()\n    if where == PhoneLogDlg.FIRST:\n        row = 0\n\
  \    elif where == PhoneLogDlg.PREV:\n        row = 0 if row <= 1 else row - 1\n\
  \    elif where == PhoneLogDlg.NEXT:\n        row += 1\n    if row >= self.model.rowCount():\n\
  \        row = self.model.rowCount() - 1\n    elif where == PhoneLogDlg.LAST:\n\
  \        row = self.model.rowCount() - 1\n    self.mapper.setCurrentIndex(row)\n\
  ```\n\n如果用户进行导航，我们必须记住当前行，因为在调用 `submit()` 之后它会被忘记。然后，在保存当前记录后，我们将行设置为用户请求导航的相应行（但保持在范围内），然后使用\
  \ `setCurrentIndex()` 移动到相应的记录。\n\n```python\ndef addRecord(self):\n    row = self.model.rowCount()\n\
  \    self.mapper.submit()\n    self.model.insertRow(row)\n    self.mapper.setCurrentIndex(row)\n\
  \    now = QDateTime.currentDateTime()\n    self.startDateTime.setDateTime(now)\n\
  \    self.endDateTime.setDateTime(now)\n    self.callerEdit.setFocus()\n```\n\n\
  我们选择始终在末尾添加新记录。为了做到这一点，我们找到最后之后的行，保存当前记录，然后在模型的最后一行插入一条新记录。然后，我们将映射器的当前索引设置为新行，初始化几个字段，并将焦点交给调用者字段，准备让用户开始输入。\n\
  \n```python\ndef deleteRecord(self):\n    caller = self.callerEdit.text()\n    starttime\
  \ = self.startDateTime.dateTime().toString(DATETIME_FORMAT)\n    if QMessageBox.question(self,\n\
  \                           QString(\"Delete\"),\n                           QString(\"\
  Delete call made by<br>%1 on %2?\")\n                           .arg(caller).arg(starttime),\n\
  \                           QMessageBox.Yes|QMessageBox.No) == QMessageBox.No:\n\
  \        return\n    row = self.mapper.currentIndex()\n    self.model.removeRow(row)\n\
  \    self.model.submitAll()\n    if row + 1 >= self.model.rowCount():\n        row\
  \ = self.model.rowCount() - 1\n    self.mapper.setCurrentIndex(row)\n```\n\n如果用户点击删除（Delete），我们从当前记录中提取一些信息，并在要求用户确认删除时使用。如果他们确认了，我们就获取当前行，从模型中删除该行，并调用\
  \ `submitAll()` 强制模型将更改写回底层数据源（在此例中为数据库）。然后通过导航到下一条记录完成操作。\n\n\n\n\n这段代码与我们之前的代码相似。设置关系代理非常简单，但设置组合框（combobox）则稍微微妙。首先，我们必须获取模型（calls\
  \ table/调用表）用于处理外键的关系模型（outcomes table/结果表）。`QComboBox` 实际上是一个带有内置模型的便利视图小部件，就像\
  \ `QListWidget`；但我们可以替换为自己的模型，这正是我们在这里所做的。然而，组合框只显示一列，而我们的关系模型有两个列（id, name），因此我们必须指定显示哪一列。我们无法确定关系模型所使用的列索引（因为它是为我们创建的，而不是由我们创建的），所以我们使用带有字段名的\
  \ `fieldIndex()` 方法来指定正确的列索引。一旦设置好组合框，我们像添加其他小部件一样将其添加到映射器（mapper）中。\n\n## 使用数据库表单视图\n\
  \n457 这完成了处理外键的更改。此外，我们还借此对应用程序进行了其他几处微调。\n\n在简化版本中，我们将退出按钮连接到了自定义的 `accept()` 方法，并以一种不符合直觉的方式从\
  \ `reject()` 方法中调用了 `accept()`。这样做是为了确保应用程序在终止之前始终保存当前记录的更改。在外键版本中，我们采取了不同的方法，将退出按钮连接到了\
  \ `done()` 方法。\n\n```python\ndef done(self, result=None):\n    self.mapper.submit()\n\
  \    QDialog.done(self, True)\n```\n\n该方法会在退出按钮连接触发时，或者当用户通过点击 X 关闭按钮或按下 Esc 键关闭窗口时被调用。我们保存当前记录并调用基类的\
  \ `done()` 方法。第二个参数是强制性的，但在这种情况下它持有什么值并不重要：`True` 值表示 `accept()`，`False` 值表示 `reject()`，无论如何，窗口都会关闭。\n\
