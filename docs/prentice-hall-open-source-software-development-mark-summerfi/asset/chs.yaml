  \n\n\n\n\n```python\ntextEdit = textedit.TextEdit(filename)\n\ntry:\n    textEdit.load()\n\
  except (IOError, OSError), e:\n    QMessageBox.warning(self, \"Text Editor -- Load\
  \ Error\",\n                        \"Failed to load %s: %s\" % (filename, e))\n\
  \    textEdit.close()\n    del textEdit\nelse:\n    self.mdi.addWindow(textEdit)\n\
  \    textEdit.show()\n```\n\n当文件被加载时（通过 `loadFiles()` 或 `fileOpen()`），它会创建一个带有给定\
  \ `filename` 的新 `TextEdit` 实例，并告诉编辑器加载该文件。如果加载失败，将通过消息框通知用户，并关闭且删除编辑器。如果加载成功，则会将编辑器添加到工作区并显示。\n\
  \n我们不需要静态实例变量来保持 `TextEdit` 实例的存活，因为 `QWorkspace` 会自动为我们处理这一点。\n\n```python\ndef\
  \ fileNew(self):\n    textEdit = textedit.TextEdit()\n    self.mdi.addWindow(textEdit)\n\
  \    textEdit.show()\n```\n\n该方法简单地创建一个新编辑器，将其添加到工作区并显示它。\n\n编辑器的窗口标题将为“Unnamed-\
  \ *n*.txt”，其中 *n* 是从 1 开始递增的整数。如果用户输入了任何文本并尝试关闭或保存编辑器，将会被提示选择一个合适的文件名。\n\n```python\n\
  def fileOpen(self):\n    filename = QFileDialog.getOpenFileName(self,\n        \
  \                        \"Text Editor -- Open File\")\n    if not filename.isEmpty():\n\
