  \ `QPrinter` 对象，但通过创建一个并将其保持为实例变量，我们可以确保用户的设置（如页面大小）在同一会话的使用之间得以保留。\n\n```python\n\
  self.view = GraphicsView()\nself.scene = QGraphicsScene(self)\nself.scene.setSceneRect(0,\
