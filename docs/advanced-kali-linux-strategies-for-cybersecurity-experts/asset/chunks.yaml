    - 目的：捕获凭据，进行中间人攻击。


    ### 1.3.2 恶性节点攻击

    创建与合法网络相同 `SSID` 的恶意 `APs` 以诱骗用户连接：


    - 目标：拦截流量，执行会话劫持。


    ### 1.3.3 取消认证和取消关联

    发送取消认证或取消关联帧以破坏合法的客户端连接：


    - 影响：拒绝服务 (`DoS`) 攻击，强制客户端重新连接并暴露漏洞。


    ### 1.3.4 WPA/WPA2 握手捕获

    在 `WPA/WPA2` 保护的网络中捕获四路握手以便离破解密码：


    - 工具：`aircrack-ng`、`Hashcat` 用于密码破解。


    ### 1.3.5 干扰攻击

    干扰无线信号以破坏网络通信并制造混乱：


    - 工具：`mdk3`、`jammer` 用于创建干扰。


