    一种用于 `LLMNR`、`NBT-NS` 和 `MDNS` 毒投和密码捕取的工具：


    - 用：拦截身份验证请求以从网络用户处收集凭据。


    ### 3.3.3 Metasploit Framework

    包含用于利用网络服务漏洞和执行后渗透活动的模块和有效载荷：


    - 用：搜索并利用网络协议、服务和配置中的弱点。


    ### 3.3.4 Mimikatz

