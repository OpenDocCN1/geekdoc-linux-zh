    # CHAPTER 4: WIRELESS SECURITY AND EXPLOITATION

    ## SECTION 2: BYPASSING WIRELESS SECURITY MEASURES


    ### Introduction


    Bypassing wireless security measures involves circumventing authentication, encryption,
    and access controls to gain unauthorized access to wireless networks. This section
    explores various techniques, tools, and considerations for bypassing wireless
    security measures using Kali Linux.


    ### 2.1 Understanding Wireless Security Measures


    Wireless networks implement several security measures to protect against unauthorized
    access and attacks:


    • Authentication: `WEP`, `WPA`, `WPA2`, `WPA3`.

    • Encryption: `AES`, `TKIP`, `CCMP`.

    • Access Controls: `MAC filtering`, `SSID hiding`, and network segmentation.


    ### 2.2 Techniques for Bypassing Wireless Security


    Attackers use various techniques to bypass wireless security measures and gain
    access to protected networks:


    #### 2.2.1 Cracking WEP Encryption


    `WEP` (Wired Equivalent Privacy) is vulnerable to cracking due to weak key management
    and initialization vectors:


    • Tools: `aircrack-ng`, `packetforge-ng` for capturing and cracking- `WEP` keys.


    #### 2.2.2 Cracking WPA/WPA2 PSKs


    `WPA/WPA2` (Wi-Fi Protected Access) with Pre-Shared Keys (`PSKs`) can be cracked
    using brute-force attacks or dictionary attacks:

    • Tools: `aircrack-ng`, `Hashcat` for capturing handshakes and cracking passwords.


    #### 2.2.3 Rogue Access Points (APs)


    Setting up rogue `APs` with common `SSIDs` to trick users into connecting and
    revealing credentials:


    • Tools: `hostapd`, `airbase-ng` for creating rogue `APs` and capturing authentication
    data.


    #### 2.2.4 MAC Address Spoofing


    Spoofing `MAC` addresses to impersonate authorized devices and bypass `MAC filtering`:


    • Tools: `macchanger` for changing `MAC` addresses to match authorized devices.


    #### 2.2.5 SSID Enumeration


    Enumerating hidden `SSIDs` by capturing probe requests and responses:


    • Tools: `airodump-ng`, `Kismet` for monitoring and capturing `SSID` information.


    ### 2.3 Tools for Bypassing Wireless Security


    Kali Linux provides specialized tools for bypassing wireless security measures:


    #### 2.3.1 aircrack-ng Suite


    A comprehensive suite of tools for capturing packets, cracking encryption keys,
    and performing replay attacks:


    • Usage: Capture handshakes, crack `WEP/WPA` keys, and inject packets for authentication.


    #### 2.3.2 Hashcat


    A powerful password cracking tool that supports various algorithms, including
    those used for `WPA/WPA2` `PSKs`:


    • Usage: Load captured handshakes and perform offline password cracking.


    #### 2.3.3 hostapd and airbase-ng


    Tools for creating rogue `APs` and conducting man-in-the-middle attacks to capture
    authentication credentials:


    • Usage: Configure and deploy rogue `APs` to intercept and manipulate wireless
    traffic.


    #### 2.3.4 macchanger


    A tool for changing `MAC` addresses to evade `MAC filtering` and impersonate authorized
    devices:


