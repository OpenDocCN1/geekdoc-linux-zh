    生成改变代码结构或行为的多态变体，以规避基于特征的检测：


    • 方法：代码混淆、加密、动态代码生成。


    #### 3.2.2 反分析检测

    实施检查以检测用于恶意软件分析的虚拟化环境、沙箱或调试工具：


    • 技术：检查注册表键、系统产物、CPU 指令。


    #### 3.2.3 无文件恶意软件技术

    直接在内存中执行恶意活动而不在磁盘上留下痕迹，以规避基于文件的检测：


    • 方法：使用 `PowerShell` 脚本、滥用合法进程（离地攻击二进制文件）。


    ### 3.3 检测规避型恶意软件的工具与技术

