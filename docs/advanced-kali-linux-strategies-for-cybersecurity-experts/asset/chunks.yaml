    \ -i eth0 -f hosts.txt\n```\n* Hosts File:\n```text\n192.168.1.100 www.example.com\n\
    ```\n\n### 3.3.3 Packet Injection\n\nPacket injection involves sending custom\
    \ packets into an existing network communication to test responses and identify\
    \ vulnerabilities. Tools like `aireplay-ng` facilitate packet injection in wireless\
    \ networks.\n\n#### Using aireplay-ng\n\n* Deauthentication Attack:\n```bash\n\
