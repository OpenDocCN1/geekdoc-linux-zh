    # 第一章：高级 Kali Linux 简介


    ## 第一章：高级 Kali Linux 简介

    ### 第一节：KALI LINUX 概述


    #### 导言

    `Kali Linux` 是一个基于 Debian 的 `Linux` 发行版，专门为高级渗透测试和安全审计设计。由 `Offensive Security`
    开发和维护，`Kali Linux` 配备了多种安全专业人士、伦理黑客和网络安全专家所需的工具。本节将深入概述 `Kali Linux`，包括其历史、特性和重要性。


    #### 1.1 Kali Linux 的历史

    `Kali Linux` 源自 `BackTrack`，这是一种在渗透测试和数字取证领域流行的 `Linux` 发行版。`BackTrack` 最初于 2006
    发布，因其全面的工具包而迅速流行。然而，到 2013 年，`Offensive Security` 的开发者意识到 `BackTrack` 需要进行重构，以引入更现代的功能、更好的硬件支持和易用性。因此，他们开发了
    `Kali Linux`，并于 2013 年 3 月发布。


    `Kali Linux` 的设计旨在解决 `BackTrack` 的缺陷，同时提供一个更强大的安全的平台。它整合了许多改进，例如遵循文件层次结构 (`FHS`)、完全自定义且开源，以及对各种硬件和无线设备的支持。多年来，`Kali
    Linux` 持续进化，通过定期更新和新版本确保其处于网络安全工具的前沿。


    #### 1.2 Kali Linux 的主要特性

    `Kali Linux` 拥有众多特性，使其成为网络安全专家的首选。其中一些关键特性包括：


    ##### 1.2.1 全面的工具包

    `Kali Linux` 预装了超过 600 渗透测试工具，包括 `Nmap`、`Wireshark`、`Metasploit Framework` 和 `Burp
    Suite` 等流行工具。这些工具涵盖了安全的各个方面，如网络扫描、漏洞评估、利用、取证和反向工程。这个全面的工具包允许用户无需安装额外软件即可执行广泛的安全任务。


    ##### 1.2.2 可定制性


    '
