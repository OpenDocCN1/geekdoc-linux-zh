    ## 3.3 后渗透工具

    Kali Linux 提供了专门用于在无线网络中进行后渗透活动的专用工具：


    ### 3.3.1 Wireshark

    一种强大的网络协议分析器，用于捕获、分析和解密数据包：


    - 用：检查网络流量中的敏感信息、凭据和通信模式。


