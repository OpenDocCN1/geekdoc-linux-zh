    \ and Automation\n\n#### 1. Bash Scripting\n* **Creating a Script**:\n```bash\n\
    #!/bin/bash\necho \"Hello, Kali Linux\"\n```\n* **Running a Script**:\n```bash\n\
    chmod +x script.sh\n./script.sh\n```\n\n#### 2. Python Scripting\n* **Creating\
    \ a Script**:\n```python\n#!/usr/bin/python\nprint(\"Hello, Kali Linux\")\n```\n\
    * **Running a Script**:\n```bash\nchmod +x script.py\n./script.py\n```\n\n###\
    \ Common Usage Scenarios\n\n#### 1. Port Scanning with Nmap\n* **Objective**:\
    \ Identify open ports.\n* **Command**:\n```css\nnmap -sV -p 1-65535 target_ip\n\
    ```\n\n#### 2. Password Cracking with Hydra\n* **Objective**: Brute-force attack\
