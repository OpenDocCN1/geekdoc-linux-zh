    \ usage.\n```bash\nfree -m\n```\n\n#### 3. Networking Commands\n* `ifconfig`:\
    \ Configure network interfaces.\n```bash\nifconfig\nping google.com\n```\n* `ping`:\
    \ Send ICMP ECHO_REQUEST to network hosts.\n* `netstat`: Print network connections,\
