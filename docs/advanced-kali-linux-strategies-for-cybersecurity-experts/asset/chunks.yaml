    • 用：监控系统调用、分析进程活动、检测恶意软件行为。


    #### 3.3.3 Volatility

    一个分析内存转储的框架，用于提取运行进程信息并揭示隐性恶意软件操作：


    • 用：分析内存产物、检测进程注入技术、识别恶意线程。


    #### 3.3.4 Cuckoo Sandbox

    一种自动恶意软件分析沙箱，用于在受控环境中执行和分析恶意软件样本：


    • 用：执行恶意软件、监控行为、捕获网络活动和系统变化。


