  \ 打开后的界面\n\n### 通过 Steam 玩游戏\n\n包名：`steam`\n\nWindows 对应软件：`Steam`\n\n如果你习惯在 Windows\
  \ 或 Macintosh 电脑上玩游戏，那么无需远找了：在 Ubuntu 中，你可以使用 Steam 许多许多 Windows 和 OS X 支持的游戏。Steam\
  \ 可以从 GNOME 软件中心获取。\n\n\n\nSteam 有某些系统要求，并不是每台计算机都能满足，因此在尝试下载和安装之前，检查 Steam 是否可以在你的系统上运行至关重要。可以在\
  \ [`github.com/ValveSoftware/steam-for-linux`](https://github.com/ValveSoftware/steam-for-linux)\
  \ 找到系统要求。\n\n***\n\n打开 `Dash` 并搜索 `Steam`。一旦 `Steam` 打开，它看起来应该像图 4-26，有一个要求你登录的框。\n\
  \n![Image](img/00064.jpeg)\n\n**图 4-26** STEAM 登录框示例\n\n现在你可以使用你的 Steam 凭据登录。如果你没有账号，可以点击\
  \ `Create New Account` 免费创建一个。从这里，你可以按照说明设置 Steam 并玩游戏。Steam 提供了如 `Portal` 和 `Team\
  \ Fortress 2` 等游戏。某些游戏需要付费，而另一些则免费。图 4-27 显示了 Steam 完全打开并准备好使用的界面。\n![Image](img/00065.jpeg)\n\
  \n**图 4-27** 一旦你登录 STEAM，就可以浏览想要玩的游戏，或者玩你已拥有的游戏。\n\n### 使用教育程序寓玩于乐\n\nUbuntu 上有很多不同的教育应用程序。让我们来看看\
  \ `GNOME Software Center` 中的其中几个。这些大部分以及其他程序都可以在中心的 `Education`（教育）类别下找到。\n\n***\n\
  \n#### Note\n\n有一种简单的方法，可以通过针对不同年龄段的预选软件包包来安装许多教育软件，无论是幼儿园、小学、中学还是高等教育。要安装这些包，请安装\
  \ `ubuntu-edu-preschool`、`-primary`、`-secondary` 或 `-tertiary` 软件包。\n\n***\n\n###\
  \ Stellarium\n\n`Stellarium` 拥有超过 600,000 恒星默认目录，是一个强大的天文馆，旨在向你精确展示通过肉眼、双远镜或望远镜所看到的景象。\n\
  \n与 Ubuntu 和开源世界的多元文化性质相一致，`Stellarium` 不仅可以显示希腊和罗马传统的星座（图 4-28），还可以显示 `Stellarium`\
  \ 所描述的其他“天空文化”，例如各种中国、古埃及和波利尼尼亚的传统。\n\n![Image](img/00066.jpeg)\n\n**图 4-28** Stellarium\n\
  \n`Stellarium` 甚至能够驱动圆顶投影仪（就像你在大型专用天文馆中看到的那样），并直接控制各种望远镜。\n\n### Marble\n\n`Marble`\
  \ 是桌面地球仪，是一个虚拟地球仪和世界地图，可用于学习更多关于地球的知识。它具有平移和缩放、点击标签打开相应的 `Wikipedia` 文章，以及通过各种投影查看地球和地图的能力，`Marble`\
  \ 是 Edubuntu 教育软件包中非常受欢迎的补充。\n\n### Parley\n\n`Parley` 是一个数字闪卡，允许你利用间隔重复学习法（又名闪卡）来轻松记住事物。其功能包括不同的测试类型、快速易易的设置、多语言以及……的能力。\n\
  \n### Step\n`Step` 甚至能够驱动圆顶投影仪（就像你在大型专用天文馆中看到的那样），并直接控制各种望远镜。\n\n### Blinken\n\n\
  `Parley` 是一个数字闪卡，允许你利用间隔重复学习法（又名闪卡）来轻松记住事物。其功能包括不同的测试类型、快速易易的设置、多语言以及……的能力。\n\n\
  ### Parley\n\n`Marble` 是桌面地球仪，是一个虚拟地球仪和世界地图，可用于学习更多关于地球的知识。它具有平移和缩放、点击标签打开相应的 `Wikipedia`\
  \ 文章，以及通过各种投影查看地球和地图的能力，`Marble` 是 Edubuntu 教育软件包中非常受欢迎的补充。\n\n\n\n虽然调整桌面是个性化桌面体验的一种趣味方式，但我们也想提醒你，不要在不了解这些更改会产生什么影响的情况下进行修改。如果你不确定是否要进行这些更改，请花些时间研究它们。在本章的最后，我们将列出更多资源，以进一步加深对\
  \ Unity 桌面的理解。\n\n在本章中，我们将向你展示一些可用的 `Lenses`（透镜），并解释如何安装它们。最后，我们将指出在 particular\
  \ 从初学者转变为超级用户的过程中，可以帮助你开始编写这些 `Lenses` 的资源。让我们准备好强化你的 Unity 桌面吧！\n\n## Unity 术语\n\
  \n当 `Unity Launcher`（启动器）在 `Ubuntu 11.04` 版本发布时，确定了一系列设计目标。具体来说，图标需要易于找到，运行中的应用程序需要始终可见，聚焦的应用程序需要易于访问，界面需要对触摸友好。Unity\
  \ 桌面无疑引起了早期采用者复杂且强烈的情感波动，由于他们的热情和反馈，桌面及其功能已经得到了改进。提供用户反馈是 Ubuntu 用户为该项目能做的最重要的事情之一。在本章最后，你将获得一份资源列表，帮助你开始向开发者提供反馈。\n\
  \n在 `Ubuntu 16.04` Unity 桌面，默认安装了许多新的 `Unity Scopes`（范围）。这些新的 `Scopes` 允许 `Dash`\
  \ 在更多更多位置中进行搜索，并为你提供来自各种来源的结果。\n\nUnity 还具有 `HUD`（抬头显示器），用户可以使用它来搜索聚焦（活动）窗口或整个应用程序的菜单。`HUD`\
  \ 并不会替换你的全局菜单，而是通过按下 `Alt` 键访问的功能。\n\n当我们观察组成 Unity 桌面的部分时，还将探索 `Unity Tweak Tool`（Unity\
  \ 调整工具）（图 5-1）。`Unity Tweak Tool` 是第三方工具，允许用户配置和调整他们的 Unity 桌面。它还允许用户返回默认桌面设置，从而撤销早先进行的更改。要通过\
  \ `GNOME Software Center`（GNOME 软件中心）安装 `Unity Tweak Tool`，请点击 `Launcher` 中的 `Software`\
  \ 图标。一旦软件中心打开，在搜索框中输入 `Unity Tweak Tool` 并点击 `Install`（图 5-2）。\n\n![Image](img/00068.jpeg)\n\
  \n**图 5-1** Unity Tweak Tool\n\n![Image](img/00069.jpeg)\n\n**图 5-2** 从 GNOME Software\
  \ Center 安装 Unity Tweak Tool\n你也可以通过命令 `sudo apt-get install unity-tweak-tool` 从命令行安装\
  \ `Unity Tweak Tool`。\n\n以下是你的 Unity 桌面部分的用户界面（UI）术语列表；数字 1 到 7 对应 图 5-3 中的数字以及\
  \ 图 5-4 中的词汇。最后，图 5-5 显示了 `HUD`。\n\n![Image](img/00070.jpeg)\n\n**图 5-3** Unity\
  \ 桌面结构图\n\n![Image](img/00071.jpeg)\n\n**图 5-4** Dash 结构图\n\n![Image](img/00072.jpeg)\n\
  \n**图 5-5** HUD 结构图\n\n1. 窗口平格 (Windows Tile)\n2. 菜单\n3. Dash 图标，打开 图 5-4 中显示的内容，包括：\n\
  \   a. 应用 Lens\n   b. 文件和文件夹 Lens\n   c. 视频 Lens\n   d. 音乐 Lens\n   e. 照片 Lens\n\
  \   f. 社交网络消息 Lens\n4. 启动器图标\n5. 启动器 (Launcher)\n6. 垃圾箱 (Trash)\n7. 指示 (Indicators)\n\
  8. HUD\n\n现在我们已经回顾了桌面的术语，让我们来看看这些默认设置。\n\n`Ubuntu 16.04` 版本使用 `4.4 Linux kernel`，基于\
  \ `4.4` 游离稳定内核。\n\n此版本中默认包含的应用程序（但不一定锁定在 `Launcher` 中）有 `Nautilus`、`GNOME Software\
  \ Center`、`Firefox`、`Thunderbird`、`LibreOffice`、`Rhythmbox`、`Deja Dup Backup Tool`、`Shotwell`、`Transmission`、`Remmina`（远程桌面客户端）、`GNOME\
  \ Control Center`（系统设置）、`Gedit` 和 `Totem`。\n\n如前所述，调整你的 Unity 桌面可以通过 `Unity Tweak\
  \ Tool` 等工具轻松完成，某些调整可以使用 `Appearance`（外观）工具进行。要进入 `Appearance` 工具，点击一下 `Super` 键，`Dash`\
  \ 就会打开。在搜索框中输入“Appearance”，然后点击 `Appearance` 图标打开此工具（图 5-6）。\n\n![Image](img/00073.jpeg)\n\
  \n**图 5-6** 从 Dash 定位 Appearance 图标\n\n## Appearance Tool\n\n`Appearance` 工具默认可用，允许用户更改其\
  \ Unity 桌面的外观和行为。它打开后处于 `Look`（外观）选项卡（图 5-7），允许用户更改 Unity 桌面的主题。`Behavior`（行为）选项卡（图\
  \ 5-8）允许更改桌面隐藏设置。\n\n![Image](img/00074.jpeg)\n\n**图 5-7** Appearance 工具的 Look 选项卡\n\
  \n![Image](img/00075.jpeg)\n\n**图 5-8** Appearance 工具的 Behavior 选项卡\n\n## Unity\
  \ Tweak Tool\n\n如前所述，`Unity Tweak Tool` 是由 Freyja 开发团队开发的第三方工具。要了解更多关于该团队的信息，请访问\
  \ [`launchpad.org/freyja-dev`](https://launchpad.org/freyja-dev)。\n\n该工具允许用户调整桌面的四个不同区域。\n\
  \n### Unity Launcher\n\n`Launcher` 选项卡（图 5-9）允许更改颜色、透明度、图标大小、动画以及更多。\n\n![Image](img/00076.jpeg)\n\
  \n**图 5-9** Unity Tweak Tool 的 Launcher 选项卡\n\n### Search\n\n`Search` 选项卡（图 5-10）允许更改\
  \ `Dash` 的模糊效果以及其他功能，如最近使用的应用程序。\n\n![Image](img/00077.jpeg)\n\n**图 5-10** Unity\
  \ Tweak Tool 的 Search 选项卡\n\n### Panel\n\n`Panel` 选项卡（图 5-11）允许更改顶部面板的设置。它包括透明度和系统指示器的显示。\n\
  \n![Image](img/00078.jpeg)\n\n**图 5-11** Unity Tweak Tool 的 Panel 选项卡\n\n### Switcher\n\
  \n`Shifter` 选项卡（图 5-12）允许为应用程序切换器指定设置和快捷键。\n\n![Image](img/00079.jpeg)\n\n**图 5-12**\
  \ Unity Tweak Tool 的 Shifter 选项卡\n\n### Apps\n\n在 `Web Apps`（网络应用）选项卡（图 5-13）上，你可以决定是否启用\
  \ `Web Apps` 提示并指定预授权域名。\n\n![Image](img/00080.jpeg)\n\n**图 5-13** Unity Tweak Tool\
  \ 的 Web Apps 选项卡\n\n### Additional\n\n`Additional` 选项卡（图 5-14）允许更改快捷键，并启用 `HUD`\
  \ 记住之前的命令。\n\n![Image](img/00081.jpeg)\n\n**图 5-14** Unity Tweak Tool 的 Additional\
  \ 选项卡\n\n\n\n尝试所有这些设置。Unity Tweak Tool 是一个非常宽容的工具。如果你不喜欢你正在做的修改，只需点击每个标签页上的“恢复默认设置”（Restore\
  \ Defaults）按钮，你就可以重新开始你的调优之旅了。\n\n### Compiz 配置管理器 (Compiz Config Settings Manager)\n\
  \nCompiz Config Settings Manager 是一个 Compiz 的配置工具，你可能需要熟悉它。要开始使用 Compiz Config Settings\
  \ Manager，你需要从 GNOME 软件中心安装它，通过启动器点击 Super 键调出 Dash，然后输入“Compiz”。点击 Compiz Config\
  \ Settings Manager 图标启动该工具。第一次打开管理器时，你会收到一个警告（图 5-15）。尽管它是一个非常强大的工具，但 Compiz Config\
  \ Settings Manager 并不像 Appearance 和 Unity Tweak 工具那样宽容。警告用户要谨慎使用 Compiz（图 5-16），因为如果你犯了太多错误，可能会导致桌面无法使用。\n\
  \n![Image](img/00082.jpeg)\n\n**图 5-15** Compiz Config Settings Manager 警告\n\n![Image](img/00083.jpeg)\n\
  \n**图 5-16** Compiz Config Settings Manager 主视图\n\n打开 Compiz Config Settings Manager\
  \ 时，你会发现某些类别旁边的框被勾选了。这是因为这些区域已经与 Unity 桌面集成。\n\n让我们仔细查看 Compiz Config Settings Manager\
  \ 提供的功能。\n\n在主视图的左上角，你会看到一个搜索框（图 5-17）。它可以使用你在搜索框中输入的文本来快速方便地过滤插件列表。搜索框还可以作为各种插件页面选项的过滤器。\n\
  \n![Image](img/00084.jpeg)\n\n**图 5-17** Compiz Config Settings Manager 搜索框\n\n\
  主视图左下角的“高级搜索”（Advanced Search）按钮（如图 5-18 所示）允许你过滤所有插件的所有选项。请注意，这可能需要一些时间来加载。高级搜索允许你通过名称、详细描述以及你设置的值进行搜索。一旦获得列表，你可以点击插件并查看哪些组包含你搜索的选项。\n\
  \n![Image](img/00085.jpeg)\n\n**图 5-18** Compiz Config Settings Manager 通用类别\n\n\
  Compiz Config Settings Manager 的插件分为八大类：\n\n1. **通用 (General):** 包含核心插件（图 5-18）。\n\
  2. **辅助功能 (Accessibility):** 包含让桌面更易于使用的插件，特别是对于那些有阅读或视觉障碍的人士（图 5-19）。增强缩放（Enhanced\
  \ Zoom）插件可以需要放大整个屏幕。\n\n![Image](img/00086.jpeg)\n\n**图 5-19** Compiz Config Settings\
  \ Manager 辅助功能类别\n3. **桌面 (Desktop):** 包含配置桌面行为的插件（图 5-20）。\n\n![Image](img/00087.jpeg)\n\
  \n**图 5-20** Compiz Config Settings Manager 桌面类别\n4. **特效 (Effects):** 包含配置各种动画和效果的插件，例如窗口淡入（Fading\
  \ Windows）（图 5-21）。\n\n![Image](img/00088.jpeg)\n\n**图 5-21** Compiz Config Settings\
  \ Manager 特效类别\n5. **额外 (Extras):** 包含具有微小或氛围用途的插件，如注释（annotate）。\n6. **图像加载 (Image\
  \ Loading):** 包含允许加载各种图像格式的插件（图 5-22）。\n\n![Image](img/00089.jpeg)\n\n**图 5-22**\
  \ Compiz Config Settings Manager 图像加载类别\n7. **实用 (Utility):** 包含提供内部功能的插件，如正则匹配（Regex\
  \ Matching）（图 5-23）。\n\n![Image](img/00090.jpeg)\n\n**图 5-23** Compiz Config Settings\
  \ Manager 实用类别\n8. **窗口管理 (Window Management):** 包含提供基础到高级窗口处理功能的插件，如移动窗口（图 5-24）。\n\
  \n![Image](img/00091.jpeg)\n\n**图 5-24** Compiz Config Settings Manager 窗口管理类别\n\
  \n***\n\n注意\n在使用 Compiz Config Settings Manager 时要谨慎，因为你可能会导致你的桌面无法使用。请确保你熟悉如何从命令行恢复桌面。\n\
  \n***\n\n要更熟悉熟悉 Compiz 和 Compiz Config Settings Manager，请访问 [www.compiz.org](http://www.compiz.org)。\n\
  \n### Unity 镜 (Lenses) 和 范围 (Scopes)\n\nDash 是 Unity 的主要功能之一。它允许用户在本地和远程进行搜索。当你打开\
  \ Compiz Config Settings Manager 时，你会发现某些类别旁边的框被勾选了。这是因为这些区域已经与 Unity 桌面集成。Dash\
  \ 本身并不十分有用，它依赖于一个或多个范围（scopes）。\n\n要更熟悉 Compiz 和 Compiz Config Settings Manager，请访问\
  \ [www.compiz.org](http://www.compiz.org)。似乎每个人都有喜欢的镜。默认情况下，Unity 带有应用程序、文件、音乐和视频。\n\
  \n***\n\n注意关于镜如何工作和创建的更多信息，请参阅 `https://wiki.ubuntu.com/Unity/Lenses`。\n\n***\n\n\
  ### 其他资源\n\n在本章中，我们查看了三个调整桌面的工具：Appearance、Unity Tweak Tool 和 Compiz Config Settings\
  \ Manager。其他资源也可以帮助你个性化桌面。如果你遇到困难，可以查看 Ubuntu 网站 [www.ubuntu.com](http://www.ubuntu.com)\
  \ 或 Ubuntu 文档 [`help.ubuntu.com`](https://help.ubuntu.com)，并利用 Ask Ubuntu、论坛、邮件列表和\
  \ IRC 频道。\n\n### 总结\n\n在本章中，我们概述了自定义 Ubuntu 的方法。更改 Unity 设置并不是每个人想要或需要的，但学会这样做是有用的，而且有时是必要的。\n\
  \n\n\n\n# 引言\n对于日常常用任务，Ubuntu 的安装和使用相对简单。然而，随着时间的推移，大多数用户都希望学习如何更高效地在计算机上执行任务。这种效率——这种执行任务方式的优雅性——正是初学者与高级用户之间分水的基础。如果你满足于仅学习完成任务所需的知识，则无需阅读本章。而那些希望更轻松、更快、更流畅地执行这些任务，并对自己的操作内容及原因有更深层理解的人，才是这里的目标受众。本章不是关于定制的；关于定制，请参阅第\
  \ 5 章。本章旨在让你理解并学习如何充分利用你已有的资源。\n\n## 管理系统和用户设置\n\n首先，在 Dash 启动器中搜索 `Settings` 并打开\
  \ `System Settings`（系统设置）（图 6-1）。\n\n![Image](img/00092.jpeg)\n\n**图 6-1** 点击`System\
  \ Settings`开始。\n\n从这里，你可以调整系统的许多方面，如图 6-2 所示。\n\n![Image](img/00093.jpeg)\n\n**图\
  \ 6-2** 在`System Settings`窗口中从许多选项中选择。\n\n点击某项以选择它并修改其设置。完成后，你可以关闭窗口或点击左上角的 `All\
  \ Settings`（所有设置）返回菜单。某些设置需要你点击右上角的 `Unlock`（解锁）按钮并输入密码来解锁后才能修改（图 6-3）。你必须拥有管理员权限执行此操作。\n\
  \n![Image](img/00094.jpeg)\n\n**图 6-3** 点击`All Settings`返回主菜单，或点击`Unlock`继续。\n\n\
  ### 用户设置\n让我们先来看可用的用户设置。一旦解锁了图 6-3 所示的窗口，你可以点击左下角的 `+` 符号添加新用户，点击 `–` 符号删除用户，或点击用户账户以修改其设置。点击右侧所示的任意项以修改其设置，如图\
  \ 6-4 所示。\n\n![Image](img/00095.jpeg)\n\n**图 6-4** 项目要么有菜单，要么有自己的弹出窗口。\n\n### 安全与隐私设置\n\
  `Security & Privacy`（安全与隐私）菜单允许你仔细管理在使用 Ubuntu 时记录的关于你的信息（图 6-5）。例如，当你打开程序时，Ubuntu\
  \ 会记录你最常用的程序，并在 Dash 搜索时将其列在首位。大多数用户喜欢这个功能。但在某些情况下，它可能不安全或不受欢迎。你可以在这里管理历史、文件、应用程序和其他隐私功能。你甚至可以关闭整个功能。\n\
  \n![Image](img/00096.jpeg)\n\n**图 6-5** 想删除过去一小时内记录的信息？很简单。\n\n在此菜单的搜索选项卡中，你还会找到切换\
  \ Dash 中是否包含在线搜索结果（包括可购买的音乐、产品等）的选项。默认情况下，此选项在 16.04 中是关闭的；相反，搜索仅将在你的计算机上本地进行。\n\
  \n### 默认设置\n默认设置对大多数用户来说都是合理的。但如果你在尝试播放某个媒体文件时想用不同的程序打开它怎么办？点击`System Settings`菜单中的\
  \ `Details` 图标更改默认设置，如图 6-6 所示。从左侧菜单中选择不同项目进行其他选项。\n\n![Image](img/00097.jpeg)\n\
  \n**图 6-6** 更改默认应用程序非常简单：只需在尝试让 Ubuntu 使用它之前，确保你已经安装了想要使用的程序。\n\n> **提示**\n> 有许多可用设置。可以随时更改其中任何一项以适应你的需求或偏好。在做出更改之前，你可能想记录当前设置，以防改变主意并想要恢复原始设置。\n\
  \n## 理解 Linux 如何存储和组织文件\n\n如果你以前没有用过 Linux，Linux 存储和组织的方式对你来说可能是全新的，因为其布局与 Windows\
  \ 和 Mac OS X 非常不同。\n\n> **提示：文件夹与目录**\n> 在阅读文件管理时，不要被*folders*（文件夹）和*directories*（目录）这两个术语搞混——这两个词描述的是同一事物。\n\
  \n在 Windows 世界中，每个磁盘驱动器都有标识字母，例如硬盘的 `C:` 和 CD/DVD 驱动器的 `D:`。但在 Linux 世界中，一切都是同一个文件系统结构的一部分。因此，如果你插了两个或三个硬盘、一个\
  \ CD 驱动和一个 USB 闪盘，它们都将是同一个文件夹结构的一部分。\n\n图 6-7 所示的图表应该让你了解是如何是如何结合的。\n\n![Image](img/00098.jpeg)\n\
  \n**图 6-7** Linux 文件系统结构\n\n树的最顶端是根目录，称为 `/`。在该文件夹内部有许多系统文件夹，每个都有特定的用途。因此，`/home`\
  \ 文件夹包含许多目录。\n\n### 文件夹的作用是什么？\n在表 6-1 中，`/etc` 被描述为存储计算机的系统级配置文件。除了这些影响所有人的文件外，还有每个特定用户的配置文件。早些时候，当你自定义\
  \ Ubuntu 的外观时，设置仅适用于你的用户账户。那么，这些设置存储在哪里呢？\n\n在你的主目录下有许多以点（`.`）开头文件夹，例如 `.config`\
  \ 和 `.mozilla`。这些文件夹包含特定应用程序的配置。默认情况下，这些文件夹在文件查看器中是隐藏的。当你查看主目录时，可以通过点击菜单中的 `View\
  \ > Show Hidden Files` 或按下 `Ctrl+H` 来查看这些隐藏文件和文件夹。\n\n### 在另一个分区上使用 Windows 文件\n\
  对于那些在 Windows 分区上花费大量时间的人，你可能希望在 Ubuntu 中访问这些分区。这不是问题，尽管你需要编辑一个特殊的配置文件来实现。幸运的是，你只需要编辑一次该文件，之后一切都会设置好。\n\
  \nUbuntu 应该自动识别你计算机上的任何 Windows 分区并在文件管理器中为你设置；但是，你可能需要修改它们或添加自己的。在 Dash 中搜索 `Disks`（磁盘）并记录你\
  \ Windows 分区的分区编号和文件系统。分区编号类似于 `/dev/hdb1` 或 `/dev/sdb1`，文件系统将是 `FAT`、`VFAT` 或 `NTFS`。\n\
  \n下一步是创建一些挂载点。当你的 Windows 分区启用时，将通过 Ubuntu 中的特定文件夹进行访问。这被称为挂载点。例如，如果你有一个挂载点 `/media/win1`，并且在\
  \ Windows 分区上想访问 `Work` 文件夹，那么你从 Ubuntu 访问的路径为 `/media/win1/work`。\n\n\n\n\n\n挂载点通常位于\
  \ `/media` 文件夹中。你可以为每个 Windows 分区创建一个不同的挂载点。例如，如果你有三个 Windows 分区，请运行以下命令：\n\n点击此处查看代码\n\
  \n```bash\nfoo@bar:~$ sudo mkdir /media/win1\nfoo@bar:~$ sudo mkdir /media/win2\n\
  foo@bar:~$ sudo mkdir /media/win3\n```\n\n现在，打开以下配置文件：\n\n点击此处查看代码\n\n```bash\n\
  foo@bar:~$ sudo gedit /etc/fstab\n```\n\n`/etc/fstab` 文件将分区号映射到挂载点。在文件的底部，为每个挂载点添加如下所示的一行：\n\
  \n点击此处查看代码\n\n```text\n/dev/hdb1 media/win1 vfat users,rw,owner,umask=000 0 0\n\
  ```\n\n你需要为相关分区更改分区号（第一列）、挂载点（第二列）和文件系统（第三列）。\n\n现在重新加载 `/etc/fstab` 以启用这些分区：\n\n\
  ```bash\nfoo@bar:~$ sudo mount -a\n```\n\n现在会出现新分区的某些硬盘图标。\n\n* * *\n\n提示\n\n你可以在\
  \ [`help.ubuntu.com/community/Fstab`](https://help.ubuntu.com/community/Fstab) 更多关于\
  \ `fstab` 的信息。\n\n* * *\n\n### 学习 Unity 快捷键\n\n使用鼠标或触摸屏由于手部、眼睛和光标之间的直接交互而是直观的，但对于重复操作，键盘快捷键可以让你工作（以及游戏）得更快。你不需要花时间把手移到桌面或屏幕上的不同位置、点击或触摸某些东西、移回键盘输入几个字母、然后回到鼠标或屏幕，以此类推。你在同一个地方可以的操作越多，你的操作效率就越高。以下是你可以在不离开键盘的情况下使用\
  \ Unity 完成的操作列表。当然，你不必以这种方式做事，但高级用户喜欢节省时间和精力，即使这意味着要在前期花一点时间学习方法；从长远来看，这种节省是积累的。\n\
  \nSuper 键用于几个快捷键。它有时被称为 Windows 键。在下表中，它被简单称为 Super。\n\n#### 启动器 (Launcher)\n\n\
  表 6-2 列出了与使用启动器相关的键盘快捷键。\n\n![Image](img/00100.jpeg)\n\n表 6-2 启动器快捷键\n\n#### 搜索\
  \ (Dash)\n\n表 6-3 列出了与使用搜索相关的键盘快捷键。\n\n![Image](img/00101.jpeg)\n\n表 6-3 搜索快捷键\n\
  \n#### 切换 (Switching)\n\n表 6-4 列出了与切换应用程序相关的键盘快捷键。\n\n![Image](img/00102.jpeg)\n\
  \n表 6-4 切换快捷键\n\n#### 窗口 (Windows)\n\n表 6-5 列出了与窗口及其管理相关的键盘快捷键。\n\n![Image](img/00103.jpeg)![Image](img/00104.jpeg)\n\
  \n表 6-5 窗口管理快捷键\n\n#### 工作区 (Workspaces)\n\n工作区——即一个会话中的多个“桌面”——在 13.04 及更高版本中默认被禁用。要恢复它们，你必须进入系统设置菜单并选择“外观\
  \ (Appearance) > 行为 (Behavior)”。选择“启用工作区”选项来显示四个工作区并将区切换器插入启动器。\n\n表 6-6 列出了与使用工作区相关的键盘快捷键。\n\
  \n![Image](img/00105.jpeg)\n\n表 6-6 工作区快捷键\n\n#### 其他 (Other)\n\n你可以通过打开设置菜单并选择“键盘\
  \ (Keyboard) > 快捷键 (Shortcuts)”来添加自己的快捷键。\n\n表 6-7 列出了不属于上述任何类别的键盘快捷键。\n\n![Image](img/00106.jpeg)\n\
  \n表 6-7 其他快捷键\n\n### 使用终端\n\n尽管 Ubuntu 是一个由桌面驱动的操作系统，但该系统运行在一个强大且极其灵活的命令行内核上。受 30\
  \ 多年 UNIX 遗产的启发，Linux 系统上的命令行环境允许你通过以不同的方式组合不同的命令来执行某些极其强大的任务。\n\nUNIX 背后的哲学是创建大量的小工具，每个工具都设计用于执行一项任务，但做得非常好。作为一个快速开胃的示例，有一个名为\
  \ `ls` 的命令，它除了列出文件夹中的文件外什么都不做。尽管列出文件是它唯一的功能，但它拥有所有可以想象的列文件选项。\n\n现在，`ls` 受限于自身，但它可以与其他具有同等灵活性的命令结合，以创建令人惊叹的强大组合。为了实现这一点，使用\
  \ `|` 符号创建一个*管道 (pipeline)*，以连接这些不同的命令。管道可以以任何方式构建。必须百分之百明确的是，使用命令行并不是使用 Ubuntu\
  \ 的必备技能，但我们在第 7 章中包含了对它的一个出色的介绍。\n\n\n\n\n\n有时 Ubuntu 软件库中可能没有某些软件；也许是因为它们太新了，也许是因为有新版本可用，又可能这些软件还没有机会被构建并被批准纳入\
  \ Ubuntu 软件库中。你通常可以在个人包存档（PPA）中找到这些软件。PPA 的 Launchpad 主页写道：“个人包存档（PPA）允许你上传 Ubuntu\
  \ 源软件包，以便由 Launchpad 构建并作为 apt 存储库进行发布”（请参阅 [`launchpad.net/ubuntu/+ppas`](https://launchpad.net/ubuntu/+ppas)）。\n\
  \n简而言之，PPA 是一个小型存储库，包含了 Ubuntu 主软件库中未找到的软件，可能是出于上述列出的原因之一或其他原因。如果你想要安装的软件包或版本在 Ubuntu\
  \ 主软件库中不可用，请使用你的网络浏览器在 Launchpad 主站搜索该软件，并查看是否存在 PPA。\n\n***\n\n**提示：小心操作！**\n\n\
  某些 PPA 是为了开发或 beta 甚至 alpha 测试创建的。它们不保证包含稳定或经过良好测试的软件。任何人都可以创建 PPA 且没有审核程序，因此你只想安装来自你信任源的\
  \ PPA。请自担风险。\n\n***\n\n在我们的示例中，我们安装了 LibreOffice 的前沿测试版本。除非你绝对需要 PPA 提供的内容，否则我们建议坚持使用\
  \ Ubuntu 软件库中的软件包。\n\n要将 PPA 添加到系统，请从 Launchpad 中特定 PPA 的网页上记录其位置。在这种情况下，PPA 位于\
  \ `ppa:libreoffice/ppa`，如图 6-8 所示。\n\n![Image](img/00107.jpeg)\n\n**图 6-8** 你可以在所有\
  \ PPA 页面上找到技术细节和安装说明。\n\n添加 PPA 最简单的方法是使用终端。在命令行中输入以下命令来添加 LibreOffice PPA 并更新你的包管理器列表：\n\
  \n```\n$ sudo add-apt-repository ppa:libreoffice/ppa\n$ sudo apt-get update\n```\n\
  \n然后，你就可以通过偏好的包管理器（GNOME 软件中心、Synaptic、命令行等）访问 PPA 的内容。\n\n如果你以后想删除该 PPA，可以再次使用此工具，但要加上\
  \ `--remove` 。\n\n```\n$ sudo add-apt-repository --remove ppa:libreoffice/ppa\n\
  $ sudo apt-get update\n```\n\n最后，如果你想删除 PPA 并降级回使用 PPA 之前的软件版本，可以安装并使用 `ppa-purge`\
  \ 工具。\n\n```\n$ sudo apt-get install ppa-purge\n$ sudo ppa-purge ppa:libreoffice/ppa\n\
  ```\n\n### 从源码编译软件\n\n某些软件在任何存储库中都找不到。在 Linux 上安装软件的传统方法在 Ubuntu 上同样适用。下载你的软件并将其放入一个空目录中。有时，它会包含安装说明。如果是这样，请按照说明操作。大多数说明与这里列出的相同。\n\
  \n在安装源码包之前，必须将其编译成你的计算机可以运行的二进制文件。为了这一点，你需要安装一些默认未包含的软件包。你所需要的通常都会作为某个软件包的依赖项包含。安装它，你就大功告成了。\n\
  \n```\n$ sudo apt-get install build-essential\n```\n\n接下来，浏览到你放置下载源码的目录。它通常是以压缩包的形式提供的，文件名扩展名如\
  \ `tar.gz` 或 `tar.bz2`。根据文件名扩展名使用相应的命令解压存档：\n\n```\n$ tar -zxvf file.tar.gz\n$ tar\
  \ -xvjf file.tar.bz2\n```\n\n接下来，构建软件包。这一步会检查你是否已经安装了所需的依赖项，如果没有安装，它会提示你——如果没有，你需要使用\
  \ Synaptic 或通过命令行使用 `apt` 分别安装它们。这一步还将把软件包从源码构建为可安装的内容。\n\n```\n$ make\n```\n\n\
  接下来，安装软件包。传统方法是使用此命令：\n\n```\n$ sudo make install\n```\n\n虽然这种技术可行，但有一种更好的方法。使用\
  \ `make -install` 会安装软件包，但它不会使用你的包管理器来执行。如果你以后想从系统中删除该软件包，弄清楚如何操作可能会是一件麻烦事。相反，使用以下命令安装软件：\n\
  \n```\n$ sudo apt-get install checkinstall\n```\n\n像从官方存储库安装的任何软件一样，可以使用你的包管理器将其删除：\n\
  \n```\n$ sudo checkinstall\n```\n\n### 总结\n\n在本章中，我们查看了与运行和管理 Ubuntu 系统相关的各种高级主题。我们提到了桌面设置的更改（包括添加用户），涉及了来自\
  \ PPA 的软件（包括更新版本）以及其他 Ubuntu 未附带的软件。最后，我们查看了从源码运行软件的可能性。\n\n\n\n\n\n可以通过点击工具提示或\
  \ Dash 图标(图 7-1)来找到终端——它上面有 Ubuntu 符号，应该是你启动器（Launcher）顶部的第一个图标。这会打开 Dash。在 Dash\
  \ 中，输入 `terminal` 即可找到终端(图 7-2)）。当它首次启动时，你会看到类似于图 7-3 所示的内容。\n\n![Image](img/00108.jpeg)\n\
  \n**图 7-1** Dash 图标\n\n![Image](img/00109.jpeg)\n\n**图 7-2** 带有终端搜索的 Dash\n\n![Image](img/00110.jpeg)\n\
  \n**图 7-3** 终端窗口\n\n你会看到一个闪烁的光标，其前面紧跟是一些字母、可能还有数字和符号，并以 `$` 结尾。该字符字符串中的第一个单词是你的用户名，后面是\
  \ `@` 符号。在 `@` 之后，列出了你计算机的主机，接着是冒号以及你当前所在的目录名称（你始终从主目录开始，它由 `~` 符号表示）。\n\n有几十个命令。本章将以叙述风格介绍几个实用的命令以帮助你入门，然后按类别列出更多带有基础描述的命令。\n\
  \n### 入门指南\n\n首先，通过运行以下命令查看你主目录中的文件：\n\n```\nusername@computer:~$ ls\n```\n\n`ls`\
  \ 命令列出你当前文件夹中的文件。默认命令仅显示当前目录（即你在文件系统中的位置）中的项目集合。为了让 `ls` 变得更有用，你可以在带上选项时输入它：\n\n\
  ```bash\nusername@computer:~$ ls -al\n```\n\n`-al` 部分是可以传递给命令的选项。在示例中，`ls` 使用了两个选项：`a`（列出所有文件）和\
  \ `l`（使用长显示格式来显示文件权限、日期、大小等），用于显示所有文件（包括隐藏文件）及其详细信息。\n\n***\n\n**提示：** 要 Dash 还是不要\
  \ Dash？\n\n在许多命令行工具中，选项是在横杠（-）之后添加的。然而，某些工具不需要横杠。横杠的使用在各种工具之间并不特别一致，因此在学习新命令时你必须注意。\n\
  \n***\n\n现在移动到不同的目录：\n\n点击此处查看代码图像\n\n```\nusername@computer:~$ cd Desktop\n```\n\
  \n`cd` 命令将目录更改到你在命令后指定的地点（在本例中为桌面目录）。在输入文件和文件夹时，可以使用一个非常方便的快捷键：输入前几个字母，然后按 Tab 键来补全文件/文件夹名称的剩余部分。例如，在在上一个命令中，你可以输入\
  \ `cd Des` 并按 Tab 键来补全 `Desktop` 的剩余部分（因为是一个目录，系统会自动添加 `/`）。\n\n当在目录内部时，你可能想快速查看一个文本文件的内容。要实现此操作，请使用\
  \ `cat` 命令：\n\n点击此处查看代码图像\n\n```\nusername@computer:~$ cat myfile.txt\n```\n\n此命令将文件内容打印到屏幕上（在计算机极客术语中，更准确的说法是“输出到屏幕”）。\n\
  \n### 构建流水线\n\n当你开始将一个命令的输出作为下一个命令的输入时，通过使用管道（pipelines）组合命令，命令行的威力才真正显现出来。管道使用管道符号（`|`）将多个命令连接起来以执行特定任务。例如，如果你使用\
  \ `cat` 命令将文件内容显示在屏幕上，但文件滚动太快，可以创建一个管道并使用 `less` 命令，这样你就可以浏览文件：\n\n点击此处查看代码图像\n\n\
  ```\nusername@computer:~$ cat foo.txt | less\n```\n\n要了解它是如何工作的，可以将命令拆分成部分，每个部分之间用管道分隔。左侧部分的输出（`cat`\
  \ 文件）被输入到右侧的 `less` 命令，这允许你使用方向键浏览文件。\n\n管道对于在系统中查找特定信息非常有用。例如，如果你想知道正在运行多少个特定的进程，可以运行这样的命令：\n\
  \n点击此处查看代码图像\n\n```\nusername@computer:~$ ps ax | grep getty | wc -l\n```\n\n在这里你统计正在运行多少个\
  \ `getty` 进程（`getty` 是运行控制会话的软件）。左侧的 `ps ax` 命令列出系统的进程，然后 `grep` 命令搜索进程列表并仅返回包含“getty”文本的行。最后，这些行被输入到\
  \ `wc`，这是一个统计单词数或行数的小工具。`-l` 选项指定要统计行数。很酷，对吧？\n\n### 以超级用户身份运行命令\n\n当你登录时，你使用的账户是受限的。Ubuntu\
  \ 背后的安全模型让你始终作为普通用户运行。当需要切换到系统管理员账户时，请在命令前加上 `sudo`。例如，如果你想从命令行重启网络系统，请执行此命令：\n\n\
  点击此处查看代码图像\n\n```\nusername@computer:~$ sudo apt-get install byobu\n```\n\n`sudo`\
  \ 右侧的命令应该是以管理员身份运行的命令，但 `sudo` 让你以当前用户的身份运行。当你运行此命令时，系统会要求输入管理员密码。在这种情况下，你正在安装 byobu，它可以让你的生活变得更轻松。\n\
  \n***\n\n**提示：** Byobu\n\nByobu 是一个日语，指的是作为房间隔断的多面板屏。作为一个开源项目，byobu 是对原本功能简单、实用的\
  \ GNU screen 的优雅增强，包含了针对 GNU screen 窗口管理器增强的配置文件和配置工具，例如可切换系统状态通知。关于 byobu 的更多信息可以在\
  \ [`manpages.ubuntu.com/manpages/xenial/man1/byobu.1.html`](http://manpages.ubuntu.com/manpages/xenial/man1/byobu.1.html)找到。\n\
  \n***\n\n当你在终端中使用 `sudo` 验证身份后，在接下来的 15 分钟内不再需要密码。\n\n### 查找帮助\n\n你计算机上的每个命令都包含一个手册页（或\
  \ man page），其中列出了可用选项。手册页传统非常简练，仅用于参考命令的使用不同方式。对于使用命令更友好的介绍，我们推荐使用 Google 搜索。\n\n\
  要查看手册页（例如 `ls` 的手册页），运行此命令：\n\n```\nusername@computer~$ man ls\n```\n\n`man` 命令本身有很多选项（运行\
  \ `man man` 查看它们），其中最有用的之一是 `-k`。该选项允许你在手册页中搜索特定单词。当你忘记命令时这非常有用。例如，你可以通过执行此命令找到所有与进程相关的命令：\n\
  \n点击此处查看代码图像\n\n```\nusername@computer:~$ man -k processes\n```\n\n***\n\n**提示：**\
  \ Ubuntu 手页库\n\n\n\n\n\n此站点包含了来自每个支持的 Ubuntu 版本的包的数十万动态生成的手册，并每天进行更新。如前所述，手册页（Manpages）传统上是通过命令行查看的，但感谢于\
  \ Dustin Kirkland 的贡献，Ubuntu 用户现在可以通过 HTML 网页浏览格式查看 Ubuntu 中包含的所有手册。你可以在 [`manpages.ubuntu.com`](http://manpages.ubuntu.com)\
  \ 找到该仓库。\n\n***\n\n本章的剩余部分将简要介绍可能会遇到并想要学习的一些常用且实用的命令，并根据用途对其进行分类。最后，我们将列出其他用于进一步研究的资源短列表。\n\
  \n## 在文件系统中跳转\n\n用于在文件系统中导航的命令包括：\n\n![Image](img/00002.jpeg) **pwd:** `pwd` 命令允许你了解当前所在的目录（`pwd`\
  \ 代表“print working directory”，即打印工作目录）。例如，在桌面目录下运行 `pwd` 将显示 `~/Desktop`。注意，GNOME\
  \ 终端在其窗口的标题栏中显示此信息。\n\n![Image](img/00002.jpeg) **cd:** `cd` 命令允许你切换目录。当你打开终端时，你处于主目录。若要在文件系统中跳转，请使用\
  \ `cd`。\n\n![Image](img/00002.jpeg) 使用 `cd ~/Desktop` 导航到你的桌面目录。\n\n![Image](img/00002.jpeg)\
  \ 使用 `cd /` 进入根目录。\n\n![Image](img/00002.jpeg) 使用 `cd` 回到你的主目录。\n\n![Image](img/00002.jpeg)\
  \ 使用 `cd ..` 向上移动一个目录级。\n\n![Image](img/00002.jpeg) 使用 `cd -` 回到上一个目录（或返回）。\n\n\
  ![Image](img/00002.jpeg) 如果你想直接跳转到一个特定的已知目录位置，请使用 `cd /directory/otherdirectory`。例如，`cd\
  \ /var/www` 将直接带你进入 `/var` 下的 `/www` 子目录。\n\n### 操作文件和文件夹\n\n你可以使用以下命令操作文件和文件夹。\n\
  \n![Image](img/00002.jpeg) **cp:** `cp` 命令为你创建一个文件的副本。例如，`cp file foo` 会为你输入的文件创建一个精确副本，并将其命名为\
  \ `foo`，但原始文件仍然存在。\n\n![Image](img/00002.jpeg) **mv:** `mv` 命令将文件移动到不同的位置或重命名文件。示例：`mv\
  \ file foo` 将原始文件重命名为 `foo`。`mv foo ~/Desktop` 将文件 `foo` 移动到你的桌面目录但不对其进行重命名。重命名文件时必须指定一个新文件名。在使用\
  \ `mv` 之后，原始文件不再存在；但如前所述，在使用 `cp` 之后，该文件继续存在并创建一个新副本。\n\n![Image](img/00002.jpeg)\
  \ 为了节省输入量，你可以用 `~` 代替主目录，因此 `/home/username/pictures` 与 `~/pictures` 等同。\n\n***\n\
  \n### 注意事项\n\n如果你在配合 `sudo` 时使用 `mv`（这在主目录之外通常是必要的），你将无法使用 `~` 快捷方式。相反，你必须使用文件的完整路径。\n\
  \n***\n\n![Image](img/00002.jpeg) **rm:** 使用此命令删除目录中的文件，例如 `rm file.txt`。它对包含文件的目录无效，这些目录必须先清空，然后可以使用\
  \ `rmdir` 命令删除。在某些高级情况下，你可以使用 `rm` 来删除目录，但讨论这些内容超出了本章的意图。\n\n![Image](img/00002.jpeg)\
  \ **ls:** `ls` 命令显示你当前目录下的文件。配合某些选项使用，它可以查看文件大小、创建时间以及文件权限。例如，`ls ~` 显示你主目录中的文件。\n\
  \n![Image](img/00002.jpeg) **mkdir:** `mkdir` 命令允许你创建目录。例如，`mkdir music` 会创建一个名为音乐目录。\n\
  \n![Image](img/00002.jpeg) **chmod:** `chmod` 命令更改列出文件的权限。权限基于一个相当简单的模型。你可以为用户、组和其他人设置权限，并指定每个角色是否可以读取、写入和/或执行文件。例如，如果允许所有人读取文件，但只有用户可以写入该文件，权限将显示为\
  \ `rwxr—r—`。要添加或删除权限，可以在特定权限前加上加号（`+`）或减号（`-`）。例如，为了允许组编辑上例中的文件，你可以输入 `chmod g+w\
  \ file`。\n\n![Image](img/00002.jpeg) **chown:** `chown` 命令允许用户更改文件的用户和组所有权。例如，`sudo\
  \ chown jim file` 将文件的所有者改为 Jim。\n\n### 系统信息命令\n\n系统信息命令包括：\n\n![Image](img/00002.jpeg)\
  \ **df:** `df` 命令显示所有分区的磁盘使用情况。`-h` 选项“人类可读”，以兆字节（M）或吉字节（G）为单位。\n\n![Image](img/00002.jpeg)\
  \ **free:** `free` 命令显示空闲内存内存。例如，`free -m` 以兆字节为单位显示。\n\n![Image](img/00002.jpeg)\
  \ **top:** `top` 命令显示系统信息，包括 CPU、内存和任务总数。退出 `top` 请按 `Q`。\n\n![Image](img/00002.jpeg)\
  \ **uname -a:** `uname` 命令配合 `-a` 选项打印所有系统信息，包括机器名称、内核名称、版本以及其他细节。\n\n```\nusername@computer~$\
  \ lsb_release -a\nNo LSB modules are available.\nDistributor ID: Ubuntu\nDescription:\
  \ Ubuntu 16.04 LTS\nRelease: 16.04\nCodename: xenial\n```\n\n![Image](img/00002.jpeg)\
  \ **ifconfig:** `ifconfig` 命令报告系统的网络接口。\n\n![Image](img/00002.jpeg) **iwconfig:**\
  \ `iwconfig` 命令显示网络适配器及其特定的无线信息，如速度和连接状态。\n\n![Image](img/00002.jpeg) **ps:** `ps`\
  \ 命令允许查看机器运行的所有进程。\n\n以下命令列出计算机上的硬件，按特定类型或特定方法列。它们在硬件无法正常工作时的调试最为有用。\n\n![Image](img/00002.jpeg)\
  \ **lspci:** `lspci` 命令列出所有 PCI 总以及连接到上面的设备。这通常包括网卡和声卡。\n\n![Image](img/00002.jpeg)\
  \ **lsusb:** `lsusb` 命令列出所有 USB 总线以及连接的 USB 设备，如打印机和优 盘。\n\n![Image](img/00002.jpeg)\
  \ **lshal:** `lshal` 命令列出硬件抽象层（HAL）感知的所有设备，这应该是系统中的大部分硬件。\n\n### 搜索和编辑文本文件\n\n使用以下命令搜索和编辑文本文件。\n\
  \n![Image](img/00002.jpeg) **grep:** `grep` 命令允许你在多个文件中搜索特定的搜索模式并打印匹配的行。例如，`grep\
  \ blah file` 将在文件中搜索“blah”文本并打印任何匹配的行。\n\n\n\n\n\n![Image](img/00002.jpeg)\n# `sed`\n\
  \n`sed`（或 Stream EDitor）命令允许你在文件中搜索并替换特定字符串。例如，如果你想在名为 `pets` 的文件中找到字符串“cat”并将其所有实例替换为“dog”，只需输入\
  \ `sed s/cat/dog/g pets`。相比之下，输入 `sed s/cat/dog/ pets`（在最后一个斜杠后不加“g”）将只会替换 `pets`\
  \ 文件中第一个出现的“cat”单词。\n\n`grep` 和 `sed` 都是非常强大的程序。市上有有很多优秀的教程解释了如何使用它们，但这里有两个不错的网站，可以帮助你入门：\n\
  \n![Image](img/00002.jpeg) [Ubuntu 帮助社区](https://help.ubuntu.com/community/grep)](https://help.ubuntu.com/community/grep)\n\
  \n![Image](img/00002.jpeg) [Ubuntu 手册页](http://manpages.ubuntu.com/manpages/xenial/man1/9base-sed.1.html)(http://manpages.ubuntu.com/manpages/xenial/man1/9base-sed.1.html)\n\
  \n另外五个命令对于处理文本也有用。\n\n![Image](img/00002.jpeg)\n## `cat`\n\n`cat` 命令是“concatenate”（连接）的缩写，用于查看和向文本文件添加内容。简单的命令\
  \ `cat filename` 会显示文件内容。使用 `cat filename file` 会将第一个文件的内容添加到第二个文件中，并在屏幕上按顺序显示两个文件的全部内容。你还可以使用\
  \ `cat file1 >> file2` 将 `file1` 的内容追加到 `file2` 的末尾。\n\n![Image](img/00002.jpeg)\n\
  ## `nano`\n\n`nano` 是一个简单的命令行文本编辑器。要打开一个文件，请使用 `nano filename`。屏幕底部列出的命令可以通过按 Ctrl\
  \ 键后跟字母来访问。要关闭并保存正在编辑的文件，请使用 Ctrl-X。\n\n![Image](img/00002.jpeg)\n## `less`\n\n\
  `less` 命令用于查看文本文件以及标准输出。常见的用法是将另一个命令通过管道传递给 `less`，以便查看所有输出，例如 `ls | less`。\n\n\
  ![Image](img/00002.jpeg)\n## `head`\n\n`head` 命令用于查看文本文件的前 10 行以及标准输出。常见的用法是将另一个命令通过管道传递给\
  \ `head`，以便查看不同行的输出，例如 `ls | head`。\n\n![Image](img/00002.jpeg)\n## `tail`\n\n`tail`\
  \ 命令用于查看文本文件的最后 10 行以及标准输出。常见的用法是将另一个命令通过管道传递给 `tail`，以便查看不同行的输出，例如 `ls | tail`。\n\
  \n## 管理用户和用户组\n\n你可以使用以下命令来管理用户和组。\n\n![Image](img/00002.jpeg)\n### `adduser`\n\n\
  `adduser` 命令创建一个新用户。要创建新用户，只需输入 `sudo adduser loginname`。这会创建用户的家目录和默认组。它会提示输入密码，然后是关于用户的更多详细信息。\n\
  \n![Image](img/00002.jpeg)\n### `passwd`\n\n`passwd` 命令更改用户的密码。如果由普通用户运行，它将更改其自身的密码。如果使用\
  \ `sudo` 运行，它可以更改任何用户的密码。例如，`sudo passwd joe` 会更改 Joe 的密码。\n\n![Image](img/00002.jpeg)\n\
  ### `who`\n\n`who` 命令告诉你你当前正在登录机器的用户。\n\n![Image](img/00002.jpeg)\n### `addgroup`\n\
  \n`addgroup` 命令添加新组。要创建一个新组，输入 `sudo addgroup groupname`。\n\n![Image](img/00002.jpeg)\n\
  ### `deluser`\n\n`deluser` 命令从系统中删除用户。若要删除用户的文件和家目录，你需要添加 `-remove-home` 选项。\n\n\
  ![Image](img/00002.jpeg)\n### `delgroup`\n\n`delgroup` 命令从系统中删除一个用户组。你不能删除作为任何用户主组的组。\n\
  \n![Image](img/00002.jpeg)\n### `chgrp`\n\n`chgrp` 命令更改文件和目录的组所有权。\n\n## 在命令行中获取帮助\n\
  \n本节提供了一些在命令行获取帮助的技巧。`--help` 和 `man` 是命令行中最重要的两个工具。\n\n几乎所有命令都理解 `-h`（或 `--help`）选项，该选项会生成命令及其选项的短用法说明，然后返回命令行提示符。尝试\
  \ `man -h` 或 `man --help` 来查看其实效果。\n\nLinux 中的每个命令和几乎每个应用程序都有一个 man（手册）文件，因此找到此类文件只需输入\
  \ `man command` 即可调指定命令的更详细手册条目。例如，`man mv` 会调出 `mv`（移动）手册。\n\n使用 `man` 命令的一些有用提示如下：\n\
  \n![Image](img/00002.jpeg)\n### **方向键**：使用方向键上下翻阅 man 文件。\n\n![Image](img/00002.jpeg)\n\
  ### **q**：输入 `q` 退出回到命令行提示符。\n\n![Image](img/00002.jpeg)\n### **man man**：`man man`\
  \ 会调出 `man` 命令的手册条目，这是一个很好的开始！\n\n![Image](img/00002.jpeg)\n### **man intro**：`man\
  \ intro` 特别有用。它会显示《用户命令简介》，这是一份关于 Linux 命令行编写良好且相当简洁的介绍。\n\n还有 info 页面，它们通常比 man\
  \ 页提供更深入的信息。尝试 `info info` 查看 info 页面的介绍。\n\n## 搜索手册文件\n\n如果你不确定需要使用哪个命令或应用程序，可以尝试搜索手册文件。\n\
  \n![Image](img/00002.jpeg)\n### `man -k foo`：这会在手册文件中文件中搜索 `foo`。尝试 `man -k nautilus`\
  \ 看看它是如何工作的。\n\n\n\n\n使用终端的挑战之一是管理多个屏幕非常困难。如果你在桌面环境中，可以启动另一个终端窗口或使用 `GNOME` 终端的标签，但如果你在一个没有安装桌面环境的服务器或其他机器上，这种策略将行不起通。\n\
  \n幸运的是，确实有这样一个工具可以帮助你：`byobu`。`byobu` 在日语中意为“屏幕”，它是 `GNU screen` 命令的一组默认配置。本质上，`screen`\
  \ 是一个命令行行的窗口管理器。要安装 `byobu`，请输入 `sudo apt-get install byobu`。\n\n启动 `byobu` 后，你会发现自己回到了终端提示符，但有几处不同。底部有两行信息。从左到右，底行显示了你当前运行的\
  \ `Ubuntu` 版本、需要更新的软件包数量（如果没有，则不会显示）、系统运行时间、系统负载、CPU 速度、当前内存使用情况以及当前的日期和时间。顶部栏显示已打开窗口列表、当前登录用户、系统名称以及菜单选项（图\
  \ 7-4）。\n\n![Image](img/00111.jpeg)\n\n**图 7-4** `GNOME` 终端中的 Byobu\n\n你现在可以像平时一样使用终端，只是额外了一些信息。`byobu`（以及\
  \ `screen`）的高级用法在本章无法涵盖的话题，但这里描述了一些命令来帮助你入门：\n\n![Image](img/00002.jpeg) **F2**:\
  \ 打开新终端窗口。\n\n![Image](img/00002.jpeg) **F3/F4**: 在窗口列表中向后/向前移动。\n\n![Image](img/00002.jpeg)\
  \ **F6**: 脱离当前的 `byobu` 会话。要重新连接，请使用 `byobu -x`。\n\n![Image](img/00002.jpeg) **F7**:\
  \ 向上滚动输出内容。按 `Esc` 退出此模式并返回命令提示符。\n\n![Image](img/00002.jpeg) **F8**: 将窗口标题设置为自定义标题。\n\
  \n![Image](img/00002.jpeg) **F9**: 启动菜单。\n\n### 在 GNOME Terminal 中默认使用 Byobu\n\n\
  要让 `GNOME` 终端在启动时默认启动 `byobu`，你需要编辑设置，可以在“编辑 > 配置文件首好”下的“标题和命令”选项卡中找到。勾选“运行自定义命令代替\
  \ Shell”框，并在下方行输入 `byobu`。现在，当你启动 `GNOME` 终端时，`byobu` 会随之启动，关闭 `byobu` 也会关闭 `GNOME`\
  \ 终端。\n\n### 转向更高级的命令行\n\n有很多关于操作命令行的优秀书籍。此外，由于大部分命令行多年没有变化，互联网上有大量的可用信息。如果你在某些方面需要帮助，通常只需搜索该命令就能找到你需要的内容。\n\
  \n正如你可以想象的，系统上有成百上千种不同的命令可用，我们没有空间在这里介绍它们。许多优秀的网站和书籍可以帮助你了解许多不同的命令。\n\n为了帮助你入门，这里是一些建议。\n\
  \n![Image](img/00002.jpeg) Kyle Rankin 和 Benjamin Mako Hill 著的 *The Official Ubuntu\
  \ Server Book, third edition*（Prentice Hall, 2013）是学习所有与服务器相关内容的极佳资源，包括如何有效使用命令行完成管理任务。\n\
  \n![Image](img/00002.jpeg) Mark G. Sobell 著的 *A Practical Guide to Linux® Commands,\
  \ Editors, and Shell Programming, third edition*（Prentice Hall, 2012）是任何 `Linux`\
  \ Shell 用户都值得放在书架上的优秀书籍。\n\n![Image](img/00002.jpeg) Matthew Helmke 著的 *Ubuntu Unleashed\
  \ 2016*（SAMS 2015），他也是本书的主作者，这本书是面向中高级用户或想要成为此类用户者的顶尖的、广泛且专注于 Ubuntu 的书籍。\n\n![Image](img/00002.jpeg)\
  \ **LinuxCommand.org**，访问 [`linuxcommand.org`](http://linuxcommand.org)，是一个实用的网站，旨在帮助初接触命令行的人。\n\
  \n![Image](img/00002.jpeg) **The Linux Documentation Project**，访问 [www.tdlp.org](http://www.tdlp.org)，是另一个高质量的免费资源。\n\
  \n### 总结\n\n命令行对于初学者来说可能有点令畏惧，但其实并不必如此。当你花时间理解它的力量以及你可用命令背后的逻辑时，你开始发现 `Linux` 的真正力量。优雅、高效以及以新方式组合命令的能力，使得命令行成为一种一旦你学会了基础就会发现必不可缺的东西。\n\
  \n## 第 8 章. Ubuntu Server\n\n* * *\n\n![Image](img/00003.jpeg) **什么是 Ubuntu Server?**\n\
  \n![Image](img/00003.jpeg) **安装 Ubuntu Server**\n\n![Image](img/00003.jpeg) **Ubuntu\
  \ 软件包管理**\n\n![Image](img/00003.jpeg) **Ubuntu Server 安全**\n\n![Image](img/00003.jpeg)\
  \ **高级主题**\n\n![Image](img/00003.jpeg) **总结**\n\n\n\n\nUbuntu Server 也不例外。它依赖与标准\
  \ Ubuntu 发行版完全相同的归库，但安装了一套独特的默认软件包。值得注意的是，构成 Ubuntu Server 的软件包集合非常小。安装程序默认不会安装图形环境或许多用户程序。但由于\
  \ Ubuntu Server 的所有包都来自同一个官方 Ubuntu 归库，你以后可以安装任何你需要的包。在理论上，没有什么能阻止你将一个 Ubuntu Server\
  \ 安装转换为普通的 Ubuntu 桌面安装，反之亦然（在实践中，这很棘手，我们不建议你尝试）。你甚至可以从运行 Kubuntu 切换到运行 Ubuntu Server。这种归库模式赋予了你最大的灵活性。\n\
  \n我们已经确定了 Ubuntu Server 提供的默认软件包组与 Ubuntu 不同。但这组不同的包有什么重要之处呢？是什么让 Ubuntu Server\
  \ 成为一个服务器平台？\n\n最显著的区别在于自定义的服务器内核。该内核使用的内部定时器频率为 100Hz，而不是桌面默认的 250Hz；使用 `deadline`\
  \ I/O 调度器而不是桌面的 `CFQ` 调度器，并包含了一系列针对虚拟化、内存支持和路由的其他微调。我们就不再向你赘述操作系统理论了：其核心目的是为服务器应用程序提供额外的性能和吞吐量。此外，服务器内核支持基本的\
  \ `NUMA`，这是一种用于某些多处理器系统中的内存设计，可以极大提高多处理性能。\n\n那么 Ubuntu Server 还有什么不同之处？除了服务器内核和一组最小化的软件包之外，并没有太多了。尽管\
  \ Ubuntu 在多个发行版本中都支持最小化安装模式，但将 Ubuntu Server 拆分出一个真正独立的独立产品仍然是一项年轻的尝试，不过这项工作进展非常快。\n\
  \n从 Ubuntu Server 6.06 LTS 开始，Ubuntu Server 官方提供了针对 Red Hat Cluster Suite 的软件包、Red\
  \ Hat 的全局文件系统 (`GFS`)、Oracle 的 `OCFS2` 文件系统以及 Linux 虚拟服务器实用程序：`keepalived` 和 `ipvsadm`。结合专门的服务器内核，这些组件已经让你能够使用\
  \ Ubuntu Server 处理一些繁重任务了。而且，吸引人的功能也在不断增加，包括内置虚拟化、通过 `Samba` 与网络上的 Windows 机器互操作性、配置文件的自动版本控制、对\
  \ LDAP 目录服务的支持、网络硬盘复制，甚至还包含了大量的最新热词——云计算。\n\n## 安装 Ubuntu Server\n\n现在你已经从 `http://releases.ubuntu.com/16.04/`\
  \ 下载了服务器包并将其刻录，急切地放入 CD 驱动器，并重启机器，迎接你的是友好的 Ubuntu 菜单。第一个选项“Install Ubuntu Server”标志着通往你自己的系统管理员洞穴之旅的开始。\n\
  \n不久前，安装 Ubuntu Server 的过程与安装桌面版相同。两种安装都是通过文本安装程序进行的，那是一种由布满文字的红蓝屏幕组成的迷人的古老组合。从那时起，桌面版本的安装程序被精美的图形环境所取代，让你直接从安装\
  \ CD 就可以玩一个完全可用的 Ubuntu 设置。但服务器 CD 保留了它的红蓝配色；因为文本安装程序不依赖于自动检测挑剔的显卡，它几乎可以肯定在你能拿到的的任何硬件上运行。而当你安装服务器时，这比世界上所有的视觉点缀都更有价值。\n\
  \n在这里，我们查看一些特别针对服务器用户的高级文本安装程序小技巧。\n\n当你到达安装程序的分区部分时，精彩的内容就开始了。对于桌面机器，你可能会让安装程序自己配置一套基础分区并继续它自己的工作。但对于服务器来说，情况变得稍微复杂了一些。\n\
  \n#### 两个安装技巧\n\n正如我们在下面将探索的那样，在分区和存储方面，服务器安装可能比桌面安装复杂得多。安装程序自带了一小包实用的技巧，在情况棘手时可以提供帮助。\n\
  \n安装程序本身运行在虚拟控制台 1 上。如果你通过 `Alt-F2` 切换到控制台 2，你将能够按下 `Enter` 激活控制台并进入一个极简的 (`busybox`)\
  \ shell。这将让你探索整个安装环境，并在必要时亲手处理某些事务。你可以按下 `Alt-F1` 回到安装程序控制台。控制台 4 包含一个运行中的非交互式安装日志文件，你可以通过\
  \ `Alt-F4` 检查它。最后，在安装期间能够连接到另一个服务器有时是有用的，也许是为了上传日志文件或访问你的邮箱或其他通信。默认情况下，控制台 2 上的\
  \ shell 不会提供 `ssh` 客户端，但在安装程序配置网络后，你可以运行 `anna-install openssh-client-udeb` 来安装一个。现在，你可以使用\
  \ `ssh` 和 `scp` 二进制文件登录或向你选择的服务器拷贝数据。\n\n### 分区你的 Ubuntu Server\n\n决定如何对服务器进行分区是一件棘手的事情，也绝不是什么精确的科学。通常，拥有三个与系统其余部分分开的分区是个好主意：\n\
  \n![Image](img/00002.jpeg) `/home`: 所有用户文件存放的地方\n\n![Image](img/00002.jpeg) `/tmp`:\
  \ 运行程序的临时空间\n\n![Image](img/00002.jpeg) `/var`: 邮件池和日志文件\n\n***\n\n**提示：分区安全以及分离日志与池**\n\
  \n你可以为特定分区开启几个选项，这些选项为你提供了额外的安全性。我们将在本章稍后的安全章节中解释它们。\n\n顺便提一下，如果你的服务器会保留大量的邮件和新闻池，你可能希望将\
  \ `/var` 进一步划分为 `/var/log` 和 `/var/spool` 分区。如果它们都在同一个分区上，在负载负载时会导致严重的 I/O 拥塞。\n\
  \n***\n\n将数据存放在不同的分区上让你管理员对特定用途有广泛的文件系统选择。例如，你可能会选择将 `/tmp` 放在 `iserFS` 上，利用其对大量文件的卓越处理和对小文件的出色性能，但你可能会将\
  \ `/home` 和 `/var` 放在 `ext3` 上以利用其坚不可的棒性，或者放在默认的 `ext4` 文件系统作为折中。\n\n此外，独立的 `/home`\
  \ 分区允许你在挂载时使用特殊选项，例如实施磁盘配额或对用户数据启用扩展安全。将 `/tmp` 和 `/var` 与系统其他部分分离的原因简单得多：这些目录很容易填满。`/tmp`\
  \ 的情况如此是因为它是一个临时区，管理员通常在那里给用户非常慷慨的配额（例如，每天清理 `/tmp` 中超过两天的用户数据），这意味着 `/tmp` 很容易被阻塞。相比之下，`/var`\
  \ 存储日志文件和邮件池，这两者都会因为恶意活动或正常系统用量的激增而占用大量的磁盘空间。\n\n# RAID 的故事\n\n\n\n如果你的服务器上只有一个硬盘，请尽管跳过此部分。否则，让我们来谈谈如何利用那些额外的硬盘。`RAID`\
  \ 的缩写代表“廉价磁盘冗余阵列”（redundant array of inexpensive disks），尽管如果你是个商人，可以用“独立”（independent）代替“廉价”（ineexpensive），我们原谅你。如果你在法国，`RAID`\
  \ 是“搜索、援助、拦截、威慑”（recherche assistance intervention dissuasion）的缩写，国家警察的一支精英特种部队——但如果你需要帮助的是那支\
  \ `RAID`，那么你读错书了。我们认为 `RAID` 是数据的一个非常棒的主意：在处理你的信息时，它可以提供额外的速度、容错能力，或两者兼顾。\n\n`RAID`\
  \ 的核心仅仅是在多个物理驱动器上复制相同的信息。该过程可以通过多种方式设置，特定的驱动器配置类型被称为 `RAID` 级别。如今，即使是中端服务器也配备了集成的硬件\
  \ `RAID` 控制器，它们在无需任何操作系统支持的情况下运行。如果你的新服务器没有自带 `RAID` 控制器，你可以使用 Ubuntu 内核中的软件 `RAID`\
  \ 功能来实现相同的目标。\n\n在安装 Linux 系统时设置软件 `RAID` 在不久前还非常困难且笨拙，但现在已是轻而易举。Ubuntu 安装程序为此提供了一个美观、方便的界面，并处理了所有必要的后台魔法。你可以从三个\
  \ `RAID` 级别中选择：`0`、`1` 和 `5`。\n\n### `RAID 0`\n所谓的条带集（striped set），`RAID 0` 允许你将多个独立驱动器的存储空间合并成一个大型虚拟驱动器。需要记住的是，`RAID\
  \ 0` 并没有实际上连接物理驱动器——相反，它将数据均匀地分布在这些驱动器上，这意味着每个物理驱动器使用的空间不会超过最小那个驱动器能容纳的空间。在实际操作中，如果你有两个\
  \ 250GB 的硬盘和一个 200GB 的硬盘，那么你的虚拟驱动器总空间将等于 600GB；两个较大硬盘中的每个会有 50GB 的空间未被使用。以这种方式分布数据提供了惊人的性能，但也显著降低了可靠性。如果你的\
  \ `RAID 0` 阵列中的任何一个驱动器故障，整个阵列将会崩溃，并带走你的数据。\n\n### `RAID 1`\n此级别提供了非常直接的数据复制。它将取一个物理驱动器的内容并将其复用到你喜欢的任意其他驱动器上。`RAID\
  \ 1` 阵列的大小不会随着额外驱动器的增加而增长；相反，它的可靠性和读取性能会提高。整个阵列的大小受限于其最小组成驱动器的大小。\n\n### `RAID 5`\n\
  当你的存储的首要目标是容错，并且你想要使用比 `RAID 1` 中单个物理驱动器提供的更多的空间，那么这就是你想要使用的级别。`RAID 5` 允许你使用相同大小物理驱动器（如果存在不同大小的驱动器，每个驱动器使用的空间不会超过最小驱动器的大小）来构建一个阵列，其总可用空间为\
  \ `n – 1` 个驱动器的空间，且该阵列容忍任何一个（但不过于一个）驱动器的故障而不会丢失数据。\n\n**提示：神话中的校验盘**\n如果你将五个 200GB\
  \ 的硬盘丢进 `RAID 5` 阵列，阵列的总可用尺寸将是 800GB，即四个硬盘的大小。这很容易让人误认为 `RAID 5` 阵列为了维护冗余和校验而“牺牲”了一个硬盘，但事实并非如此。通过基于伽罗瓦域多项式系数的一些巧妙数学方法，实际的校验信息被均匀地分布在所有驱动器上，允许任何单个驱动器故障而不损害数据。不过别担心，我们不会考你数学数学。\n\
  \n### 选择哪种 RAID？\n如果你天生就犹豫不决，过去的这几段可能让你局促地缩在椅子上，无情地咬着 2 号铅笔，双脚紧张地敲着地板。幸运的是，`RAID`\
  \ 级别的初始选择通常是不费脑筋的，所以你必须把犹豫不决留在别处。如果你只有一个硬盘，那没你的 `RAID` 事。不要经过起点，不要领取 200 美元。两个硬盘？把它们丢进\
  \ `RAID 1`，晚上就能睡得好一点。三个或更多？`RAID 5`。除非你真的知道自己在做什么，否则要像避开瘟疫一样避开 `RAID 0`。如果你不是主要提供只读数据且不在乎冗余，`RAID\
  \ 0` 并不是你想要的。\n\n**提示：其他 RAID 模式**\n虽然安装程序只提供最常见的 `RAID` 模式——0、1 和 5，但还有许多其他 `RAID`\
  \ 模式可以在安装后进行配置。查看 [`en.wikipedia.org/wiki/RAID`](http://en.wikipedia.org/wiki/RAID)\
  \ 以获取所有模式的详细解释。\n\n## 设置 RAID\n在仔细研究了最后一段之后，可能又读了几本关于抽象代数的书和几本关于有限域理论的书，你终于决定了一个适合你的\
  \ `RAID` 级别。由于书籍还无法读取你的心思，我们假设你选择了 `RAID 1`。那么，你如何设置它呢？\n\n回到安装程序。在提示分区磁盘时，你想要选择最后一个选项：手动编辑分区表。\n\
  \n在屏幕上方两个选项（引导分区和帮助）下方，你会发现检测到的物理驱动器。\n\n**提示：避免“噢不”时刻**\n我们之前说过过，现在还会说一遍：在分区系统时，很容易误删重要数据。因为你正在安装服务器，我们假设你愿意删除可能存在的数据。如果不是这样，现在备份你关心的数据！\n\
  \n在每个驱动器的缩进下方，你会发现分区列表，以及它们的磁盘编号、大小、引导状态、文件系统类型以及可能的挂载点。使用方向键高亮物理（不是其任何分区）行并按回车。将要求你确认替换任何分区表。选择是，驱动器下方唯一的条目将是\
  \ FREE SPACE。在我们的虚拟服务器中，有两个 80GB 的硬盘——`hda` 和 `hdb`——所以我们将对两个硬盘遵循此过程，为每个创建一个新的分区表。假设我们决定建立一个\
  \ 20GB 的 /home 分区。指向 FREE SPACE，按回车并创建分区。一旦你输入了新分区的大小，你将被带到一个可以选择文件系统和挂载选项的对话框。然而，与其在原始分区上放置文件系统，你需要进入用途对话框并将新分区设置为\
  \ RAID 卷。\n\n还在跟我们我们吗？现在在另一个硬盘上重复操作：创建一个完全相同、大小的分区，并将其设置为 RAID 卷。完成后，你应该回到初始分区界面，并且每个驱动器下应该有一个大小相同的分区。此时，点击屏幕顶部的配置软件\
  \ RAID，如果有需要，同意将更改写入存储设备，然后选择创建 MD（多磁盘）设备。现在只需在你创建的两个分区（`hda1` 和 `hdb1`）旁边使用空格键进行勾选，然后在多磁盘对话框中点击完成以返回基础分区程序。\n\
  \n\n\n\n如果你查看之前使用的那两个物理硬盘下方，你会注意到一个全新的驱动器，这是一个软件 RAID 设备，其下方有一个分区。这就是你未来的 `/home`\
  \ 分区，它正愉快地运行在 RAID 阵列上。如果你将方向键移动到它上面并按回车键，现在就可以像配置真实分区一样对其进行配置了。\n\n对于你任何想要放入 RAID\
  \ 的其他分区，该过程都是相同的：在所有参与的物理硬盘上创建大小相同的分区，选择将它们作为 RAID 空间，进入多磁盘配置器（软件 RAID），最后创建一个使用这些真实分区的阵列。然后，在新创建的阵列上创建文件系统。\n\
  \n### 提示：阵列故障与备用设备\n\n在提供冗余运行的 RAID 阵列（例如 RAID 1 或 RAID 5）中，当某个物理硬盘发生故障时，阵列会进入所谓的“降级模式”（千万不要对你的\
  \ RAID 阵列言语攻击或残忍！）。取决于阵列中设备的数量，运行降级模式可能只是性能上的影响，但也可能意味着另一块物理硬盘的故障会导致整个阵列崩溃并导致数据完全丢失。要将阵列从降级模式中恢复，你需要向系统添加一块运行良好的物理硬盘（旧的硬盘可以移除），并指令阵列使用新设备进行“重建”。\n\
  \n为了尽可能的减少阵列处于降级模式的时间，并防止在服务器不支持热插拔的情况下必须关闭机器以插入新的物理硬盘，你可以将额外的物理硬盘放入机器并将它们标记为“热备用”（hot\
  \ spares），这意味着系统将保持它们激活状态但暂未使用，直到发生硬盘故障。而“冷备用”（cold spares）顾名思义，只是你存放在架子上的额外硬盘，直到发生故障时，到那时你再手动将它们添加到阵列中。\n\
  \n就是这样！Ubuntu 安装程序将处理好所有烦人的细节，负责配置系统在正确的时间启动并使用 RAID 阵列，即使你选择将根分区也保留在阵列上。现在，让我们来看看\
  \ Ubuntu 安装程序的另一个很棒的功能：逻辑卷管理（LVM）。\n\n# 逻辑卷管理器的故事\n\n让我们暂时放开 RAID 冒险，看看数据存储更宏观的图景。整个局面并不令人愉快。硬盘速度慢且经常故障，尽管固定大小分区在很久以前就被废用于工作内存，但它们仍然是存储空间分配的主流模式。似乎仅仅担心速度和数据丢失还不够，你还必须担心在安装服务器时分区大小计算是否恰恰合适，或者是否会陷入一种令人尴尬的境地：某个分区空间耗尽，而另一个分区可能大部分是空闲的。如果你可能需要在运行中的系统上跨物理卷边界移动分区，那么，你就完蛋了。\n\
  \nRAID 在某种程度上有所帮助。它对你关于性能和容错的担忧会有奇效，但它的操作层次太低，无法解决分区大小或灵活性问题。我们真正想要的是将分区概念向上抽象一个层次，使其不再直接运行在底层物理介质上。这样，我们就可以拥有轻松调整大小或跨多个硬盘的分区，我们可以轻松地从一个分区获取一些空间并添加到另一个分区，并且可以在运行的服务器的物理硬盘上调整分区。听起来很酷，对吧？\n\
  \n非常酷，而且通过 LVM 可以完美实现。LVM 将存储的基本单位从物理硬盘转移到虚拟或逻辑硬盘（尽管我们怀疑“逻辑”一词是对当前存储现状的讽刺，尽管现状远非如此）。LVM\
  \ 传统上是昂贵的企业级 UNIX 操作系统的特性，或者从第三方供应商处购买。通过自由软件的魔法，一位名为 Heinz Mauelshagen 的家伙在 1998\
  \ 年为 Linux 编写了一个逻辑卷管理器的实现。从那时起 LVM 经历了巨大的改进，并在现在的生产环境中被广泛使用，正如你所预期的，Ubuntu 安装程序让你在安装期间轻松地在服务器上配置它。\n\
  \n#### LVM 理论与术语\n\n理解 LVM 比理解 RAID 稍微困难，因为 LVM 重新思考了处理存储的整个方式，这意料之中地引入了一些你需要学习的术语。在\
  \ LVM 下，物理卷（`PVs`）仅被视为磁盘空间的提供者，没有任何固有的组织结构（例如映射到操作系统中挂载点的分区）。我们将 `PVs` 分组为卷组（`VGs`），这些是虚拟存储池，看起来就像老式的饼干切割机式硬盘。我们将这些划分成逻辑卷（`LVs`），它们的作用就像我们习惯处理的普通分区。我们在这些\
  \ `LVs` 上创建文件系统并将它们挂载到我们的目录树中。在后台，LVM 将物理卷拆成微小的字节块（默认 4MB），每个块被称为物理扩展区（`PE`）。\n\n\
  好了，那是一连串缩写，但只要你理解了这个演进过程，你就没问题了。你拿出一块物理硬盘，并在上面设置一个或多个用于 LVM 的分区。这些分区现在是物理卷，它们被拆分为物理扩展区，然后分组在卷组中，在卷组之上你最终创建逻辑卷。是\
  \ `LVs`——这些虚拟分区，而不是物理硬盘上的分区——承载了文件系统并被映射和挂载到操作系统中。如果你真的很困惑增加这么多复杂性最终却只得到相同的固定大小分区的能获得什么益处，请坚持住。这很快就会变得有意义。\n\
  \nLVM 将物理卷拆分为小的、等大的扩展区是因为，这样卷组（将要划分成逻辑卷的空间）的定义就变成了“扩展区的集合”，而不是像旧式分区那样的“物理区域”。注意，“扩展区的集合”并没有说明这些扩展区来自哪里，也并没有对卷组的大小施加固定限制。我们可以从多个不同的硬盘获取扩展区并将它们投入一个卷组，这解决了我们对分区从物理硬盘抽象化的需求。我们可以通过向\
  \ `VG` 添加一些扩展区来变大，可能是从另一个 `VG` 获取，也可能是通过投入一个新的物理卷并使用那里的扩展区。而且我们还可以通过让它移动到不同的扩展区集合来移动\
  \ `VG`。最棒的是，我们可以在运行阶段完成这一切，而无需停机维护。\n\n你闻到那个味道了吗？那是存储革命的新鲜气息。\n\n## 设置 LVM\n\n到目前，你一定已经相信\
  \ LVM 是划时代的发明了。事实确实如此——而且令人惊讶的是，在安装期间设置它并不比设置 RAID 难。在你想要用于 LVM 的每个物理硬盘上像之前配置 RAID\
  \ 那样创建分区，但告诉安装程序将它们作为 LVM 的物理空间。注意，在这种语境下，`PVs` 不是真正的物理硬盘；它们是你创建的分区。\n\n你不需要将整个硬盘都分配给\
  \ LVM 分区。如果你愿意，你可以在用于 LVM 的存储分区旁边创建实际包含文件系统的分区，但在继续之前，请确保你对自己的分区选择满意。一旦你进入安装程序中的\
  \ LVM 配置器，所有包含 LVM 分区的硬盘上的分区布局都将锁定。\n\n\n\n\n让我们回到我们的虚构服务器，但这次给它配备四块硬盘，大小分别为 10GB、20GB、80GB\
  \ 和 120GB。假设我们想使用每块硬盘上的所有可用空间创建一个 LVM 分区（即 `PV`），然后将前两个 `PV` 合并成一个 30GB 的卷组（`VG`），并将后两个合并成一个\
  \ 200GB 的卷组。每个 `VG` 都将像一个大型虚拟硬盘一样，在其之上我们可以创建普通分区一样创建逻辑卷。\n\n和 RAID 类似，移动到每块硬盘的名称上并按回车即可擦除分区表。然后在\
  \ `FREE SPACE`（空闲空间）条目上按回车即可创建一个物理卷——这是一个被设置为用作 LVM 物理空间的分区。一旦所有三个 LVM 分区都就绪，我们就在分区菜单中选择“配置逻辑卷管理器”（Configure\
  \ the Logical Volume Manager）。\n\n在看到关于分区布局的警告后，我们会进入一个相当简陋的 LVM 对话框，允许我们修改 `VGs`\
  \ 和 `LVs`。根据我们的计划，我们选择第一个选项并创建两个所需的 `VGs`，选择合适的 `PVs`。然后我们选择“修改逻辑卷”（Modify Logical\
  \ Volumes），并创建与我们要放在系统上的普通分区对应的 `LVs`——例如，为 `/`、`/var`、`/home` 和 `/tmp` 各自创建一个。\n\
  \n你已经可以看到 LVM 带来的某些分区灵活性了。如果你决定为 `/var` 需要一个 25GB 的逻辑卷，你可以从创建的第一个 `VG` 中划分出它，而 `/var`\
  \ 就会神奇地跨越那两块较小的硬盘。如果你以后觉得给 `/var` 分配了太多空间，你可以缩小文件系统，然后简单地将部分存储空间从第一个 `VG` 移动到第二个\
  \ `VG`。可能性是无限的。\n\n最后但同样重要的是，最近的 Ubuntu 版本支持在安装程序中直接加密你的 LVM 卷，这对于偏执的人来说简直是福音：这意味着从你安装机器的那刻起，你就可以拥有全盘加密。加密\
  \ LVM 作为分区菜单中的“引导”选项之一提供，但你也可以手动实现相同的结果。\n\n***\n\n***\n\n### 提示：LVM 不提供冗余\n\nLVM\
  \ 的重点是存储灵活性，而不是容错性。在我们的示例中，包含 `/var` 文件系统的逻辑卷位于跨越两块硬盘的卷组上。不幸的是，这意味着任何一块硬盘故障都会损坏整个文件系统，而\
  \ LVM 故意不包含防止此类问题的功能。\n\n相反，当你需要容错性时，请从位于 RAID 之上的物理卷构建你的卷组！在我们的示例中，我们可以创建一个跨越整个\
  \ 10GB 硬盘大小的分区，并将其分配给 RAID 卷的物理空间。然后，我们可以在 20GB 硬盘上创建两个 10GB 分区，并将第一个也设为 RAID 的物理空间。进入\
  \ RAID 配置器，我们将从两块硬盘上的 10GB RAID 分区创建一个 `RAID 1` 阵列，但我们不再像以前那样在 RAID 阵列上放置普通文件系统，而是将\
  \ RAID 阵列指定为用作 LVM 的物理空间。当我们进入 LVM 配置时，该 RAID 阵列将像其他物理卷一样出现，但我们知道这个物理卷是冗余的。如果它下方的物理硬盘发生故障，LVM\
  \ 永远不会知道，也不会发生数据丢失。当然，标准的 RAID 阵列限制仍然适用，所以如果足够多的硬盘故障并关闭了阵列，LVM 仍然会痛苦地崩溃。\n\n***\n\
  \n***\n\n### 加密家目录和软件选择\n\n在完成磁盘分区后，安装程序将安装基础系统并要求你提供用户信息，就像桌面安装一样。然后你会被问一个你可能没见过的问题：你是否想要加密你的家目录？\n\
  \n如果你回答的是肯定的，你的账户密码将承担第二个用途。它不仅允许你登录，还将被用于透明地加密加密你家目录中的每一个文件，使其对任何没有密码的人来说变成一堆乱码。这意味着如果你的电脑被盗了，只要你的密码不是容易猜到，你的数据就是安全的，不受窥探之苦。如果这听起来很熟悉，是因为相同的功能在\
  \ Apple 的 Mac OS X 上被称为 `FileVault`，并且也是 Windows Vista 引入的 `BitLocker` 系统的子集。（Ubuntu\
  \ 使用的目录加密系统被称为 `ecryptfs`，这个名字显然没那么响亮。我们正在改进。）\n\n***\n\n***\n\n### 提示：加密交换分区和远程登录\n\
  \n如果你使用交换分区，保护家目录是不够的；敏感数据可能会以明文形式交换到磁盘。解决方案是使用加密交换，你可以通过 `ecryptfs-setup-swap`\
  \ 命令手动启用它，但这目前会夺你计算机进入睡眠（hibernate）节能模式的能力。挂起（Suspend）模式不受影响。\n\n另外注意，加密家目录会使其中所有数据（包括如\
  \ `.ssh` 等特殊目录）在登录之前都是不可用的。如果你正在登录一台家目录已加密且尚未解锁的机器，而该机器仅允许 SSH 公钥认证，那么系统没有方法查询你的\
  \ `authorized_keys` 文件，你会被锁在外面。你可以通过物理登录、使用 `ecryptfs-umount-private` 卸载你的加密家目录，然后在由\
  \ `ecryptfs` 留下的“底层”家目录中创建 `.ssh` 目录来修复这个问题。在登录后可以使用 `ecryptfs-mount-private` 解密家目录。\n\
  \n***\n\n***\n\n在安装程序下载更新软件源之后，你会看到一个列出常见服务器类型的菜单，包括 `DNS`、`LAMP`、`Mail`、`OpenSSH`、`PostgreSQL`、`Print`\
  \ 和 `Samba` 服务器。选择这些选项中的一个或多个，安装程序将自动下载你所需的标准软件包并对这些服务进行基础配置。例如，如果你想安装 `LAMP` 环境，但又想确保可以从另一台电脑\
  \ ssh 到该机器，你可以同时选择 `LAMP` 和 `OpenSSH`。\n\n***\n\n***\n\n### 提示：软件安装提示\n\n根据你选择的服务器，在软件包安装期间可能会被问很多问题。例如，当你选择\
  \ `LAMP` 环境时，安装程序会建议你为 root `MySQL` 用户选择密码。\n\n***\n\n***\n\n#### 你完成了：现在注意 root！\n\
  \n呼。在解决了存储和软件问题后，服务器安装的其余部分应该与安装普通的 Ubuntu 工作站没有异。现在你的服务器已经安装完毕，我们可以开始有趣的环节了。从现在开始，我们所做的一切都在\
  \ shell 中进行。\n\n当你的 Ubuntu 服务器首次启动时，你必须使用安装期间创建的用户登录。这里有一点让 Ubuntu 新手困扰：与大多数发行版不同，Ubuntu\
  \ 在安装期间不会启用 root 账户！相反，安装程序会将你创建的用户添加到 `sudo` 组，这允许你使用称为 `sudo` 的机制来执行管理任务。我们稍后会教你如何使用\
  \ `sudo`。在此期间，如果你对禁用直接使用 root 账户的原因感兴趣，登录后运行 `man sudo_root` 即可。\n\n***\n\n***\n\
  \n### RAID 和 LVM 阵列的维护\n\n\n\n\n如果你在安装过程中设置了其中一些数组，那么你可能想学习如何在服务器安装后管理它们。我们推荐参考\
  \ Linux 文档项目（The Linux Documentation Project）提供的相应指南，地址位于 [www.tldp.org/HOWTO/Software-RAID-HOWTO.html](http://www.tldp.org/HOWTO/Software-RAID-HOWTO.html)\
  \ 和 [www.tldp.org/HOWTO/LVM-HOWTO](http://www.tldp.org/HOWTO/LVM-HOWTO)。\n\n这些指南有时会非常技术化，但如果你已经理解了在本章中对该主题的介绍，大部分细节听起来应该很熟悉。\n\
  \n# Ubuntu 软件包管理\n\n一旦服务器安装完成，它仅包含为了启动和正常运行所需的少数软件包，以及你在软件选择界面上选择的任何软件。在 Ubuntu\
  \ 桌面舒适的 GNOME 图形环境中，我们可以启动 Synaptic，通过指向和点击的方式来发现并安装应用程序。但在服务器上，我们必须成为“命令行樱武士”（shell\
  \ samurai）。\n\n## Ubuntu 存档库\n\n在我们深入包管理的细节之前，让我们简要概述一下 Ubuntu 主软件包存档库的结构，我们在本章的介绍中提到过它。每个新版本在存档中有五个仓库，称为\
  \ `main`、`restricted`、`backports`、`universe` 和 `multiverse`。新安装的系统仅启用了前两个加上安全更新仓库。以下是仓库的说明。\n\
  \n![Image](img/00002.jpeg) **Main：** 这包含了所有默认安装的软件包；这些软件包具有官方支持。\n\n![Image](img/00002.jpeg)\
  \ **Restricted：** 这些是版权受限的软件包，通常是硬件驱动程序。\n\n![Image](img/00002.jpeg) **Backports：**\
  \ 这些是存档中较版本的软件包，由社区提供。\n\n![Image](img/00002.jpeg) **Universe：** 宇宙包含由 Ubuntu 社区维护的软件包。\n\
  \n![Image](img/00002.jpeg) **Multiverse：** 多宇宙包含非自由（从自由意义上来说）软件包。\n\n`official support`（官方支持）这个术语有点误导，因为它指不是人们购买或获取的技术支持，而是指\
  \ Ubuntu 版本发布后安全更新的可用性。标准 Ubuntu 版本的支持为九个月，这意味着 Ubuntu 的母公司 Canonical, Ltd. 保证在版本发布后的九个月内，为\
  \ `main` 仓库中软件中发现的任何漏洞提供免费的安全更新。其他仓库中的软件不提供此类保证。\n\n特别值得注意的是，某些 Ubuntu 版本具有更长的支持周期。这些版本在其版本号中用缩写\
  \ `LTS`（长期支持）表示。最新的 Ubuntu LTS 版本 16.04 将获得五年的支持。\n\n## APT 源与仓库\n\n你现在已经了解了 Ubuntu\
  \ 存档库的结构，但我们还没有解释如何实际修改你在你的系统上想要使用的仓库列表。在 Debian 软件包管理术语中，仓库列表是高级软件包工具（APT）源列表的一部分。（请留心：我们下面将讨论的许多软件包工具都以\
  \ `apt.` 为前缀。）这些源告诉 `APT` 在哪里寻找可用软件包：在互联网上的 Ubuntu 存档库中、在你的 CD-ROM 上或在第三方存档库中。\n\
  \nAPT 源定义在 `/etc/apt/sources.list` 文件中。让我们用编辑器打开这个文件。（如果你不习惯 `vim`，请用 `nano` 替换它，它是一个更易用、对新手友好的编辑器。）\n\
  \n```\n$ vim /etc/apt/sources.list\n```\n\n以井号或 `#` 开头的行表示注释行，会被 `APT` 跳过。在顶部，你会看到安装程序添加的\
  \ CD-ROM 源，随其后的是这两行（或非常相似的内容）：\n\n```text\ndeb http://us.archive.ubuntu.com/ubuntu/\
  \ xenial main restricted\ndeb-src http://us.archive.ubuntu.com/ubuntu/ xenial main\
  \ restricted\n```\n\n我们可以通过观察这些行推出 APT 源列表的一般格式。该文件由各个源组成，每行一个，每行包含几个用空格分隔的字段。第一个字段告诉我们该行描述的是什么类型的源，例如二进制软件包源（`deb`）或源代码包（`deb-src`）。第二个字段是软件包源的实际\
  \ URI，第三字段指定了我们想要的软件包发行版（`xenial`），其余字段告诉 `APT` 使用我们正在描述的源中的哪些组件——默认情况下是 `main`\
  \ 和 `restricted`。\n\n如果你查看文件的其余部分，你会发现它有良好的注释，可以让你轻松地启用两个额外的仓库：非常有用的 `universe`\
  \ 和前沿的 `backports`。通常情况下，既然你理解了每行源的格式，你就对所使用的仓库具有完全的控制权，虽然我们强烈建议不要在服务器上使用 `backports`\
  \ 仓库，但启用 `universe` 通常是一个好主意。\n\n还有一个名为 `/etc/apt/sources.list.d/` 的目录，可以在那里找到更多源。这通常是你找到第三方软件（例如\
  \ Google Chrome）列表或你安装的 PPA 列表的地方。\n\n考虑到这些，让我们熟悉一下 Ubuntu 系统上一些基本的命令行软件包管理工具。Ubuntu\
  \ 继承了 Debian 的软件包管理机制，所以如果你熟悉 Debian，我们将讨论的工具都是老朋友了。\n\n### dpkg\n\n我们的第一站是 Debian\
  \ 软件包管理器 `dpkg`，它位于软件包管理栈的最底层。通过一个名为 `dpkg-deb` 的工具，`dpkg` 处理单个 Debian 软件包文件，由于其\
  \ .deb 文件扩展名，被称为 `debs`。\n\n`dpkg` 在系统手册页中有详尽的文档，因此你可以在 shell 中输入 `man dpkg` 来阅读它支持的各种选项。我们将指出最常见的\
  \ `dpkg` 操作：列出和安装软件包。当然，`dpkg` 也可以删除软件包，但我们将向你展示如何使用更高级工具 `apt-get` 来完成。\n\n***列出软件包***\
  \ 在 shell 中运行 `dpkg -l | less` 将列出系统中所有由 `dpkg` 跟踪的软件包，采用六列格式。前三列每列一个字符，分别表示预期的软件包状态、当前软件包状态和错误状态。大多数情况下，错误状态列是空的。\n\
  \n`dpkg` 输出的前三行充当图例，解释你在前三列中可以找到字母。这让你能够使用 `grep` 工具搜索软件包列表，例如只查看已删除的软件包或配置失败的软件包。\n\
  \n### 手动安装软件包\n\n在每个版本中，Ubuntu 存档库都有超过 17,000 个软件包。其中只有一小部分由官方支持，但所有其他软件包仍然遵循着相当严格的收录要求。因此，Ubuntu\
  \ 存档库中的软件包几乎都是高质量的，并且已知在你的 Ubuntu 系统上运行良好。\n\n因此，当你选择安装新软件时，存档应该是你首先要查找的地方。然而，在少数情况下，你想要的软件在存档中不可用，是因为它是新的，或者因为分发限制阻止了包含。在这些情况下，你可能必须从源代码构建软件、运行供应商提供的二进制文件，或者寻找第三方的\
  \ Ubuntu 或 Debian 软件包进行安装。\n\n\n\n这是一个糟糕的双关。我们深表歉意。但它可能引起了你的注意，所以请仔细听：在处理第三方软件包时要非常、非常小心。Ubuntu\
  \ 存档库中的软件包经过了广泛的质量保证，几乎可以确定没有病毒、蠕虫、特洛马或其他计算机毒虫。如果你只从存档库安装软件，你将再也不用担心病毒了。\n\n对于第三方软件包，你不知道自己正在安装什么。如果你安装了一个恶意软件包，你就将系统的完全控制权交给了软件包的创建者。因此，理想情况下，根本不要安装第三方软件包。如果你必须安装，请务必确保你信任软件包的来源！\n\
  \n***\n\n### 安装软件包\n\n急躁是程序员和系统管理员共同的标志性美德，所以如果你太急躁而没读警告说明，请现在去读。这是一件严肃的事情。让我们继续。假设你下载了一个名为\
  \ `myspecial-server.deb` 的软件包。你只需通过运行此命令即可安装它：\n\n点击此处查看代码图像\n\n```\n$ sudo dpkg\
  \ -i myspecial-server.deb\n```\n\n`dpkg` 将解压 deb 文件，确保其依赖项已满足，并安装软件包。记得我们提到过 root\
  \ 账户默认是不可用的吗？安装软件包需要管理员权限，我们通过在要执行的命令前加上 `sudo`get `sudo` 提示处输入用户密码来获取权限。\n\n***\n\
  \n### 提示：关于 Shell 示例的快速说明\n\n在 `dpkg` 示例中，美元符号是标准的 UNIX shell 符号，因此你不需要实际输入它。我们将在本章中使用它来表示需要在\
  \ shell 中输入的内容。在你的 Ubuntu 系统上，shell 提示符不仅仅是一个美元符号，而是像这样：\n\n`user@server:~$`\n\n\
  `user` 和 `server` 将分别替换为你的用户名和安装时赋予服务器的主机名，冒号和美元符号之间的部分将显示你的工作目录。波浪号 `~` 是 UNIX\
  \ 家目录的缩写。\n\n***\n\n## apt-get 和 apt-cache\n\n现在让我们跳到栈更高的地方。`dpkg` 主要处理软件包文件，而 `apt-get`\
  \ 知道如何从 Ubuntu 存档库下载软件包或从你的 Ubuntu CD 中获取它们。它提供了一个方便、简洁的界面，因此它是大多数系统管理员在 Ubuntu\
  \ 服务器上进行软件包管理的工具也并不意外。\n\n虽然 `apt-get` 处理高层软件包操作，但它不会告诉你哪些软件包实际上位于存档库并可以安装。它知道如何从软件包缓存中中获取这些信息，你可以通过一个名为\
  \ `apt-cache` 的简单工具对其进行操作。让我们通过示例来看看这两个命令是如何协同工作的。假设我们正尝试寻找并安装允许我们处理扩展文件系统属性的软件。\n\
  \n### 搜索软件包缓存并显示软件包信息\n\n我们首先告诉 `apt-cache` 搜索短语“extended attributes”。\n\n点击此处查看代码图像\n\
  \n```\n$ apt-cache search \"extended attributes\"\n```\n\nattr - Utilities for manipulating\
  \ filesystem extended attributes\n\nlibattr1 - Extended attribute shared library\n\
  \nlibattr1-dev - Extended attribute static libraries and headers\n\npython-pyxattr\
  \ - module for manipulating filesystem extended\n      attributes\n\npython2.4-pyxattr\
  \ - module for manipulating filesystem extended\n      attributes\n\nrdiff-backup\
  \ - remote incremental backup\n\nxfsdump - Administrative utilities for the XFS\
  \ filesystem\n\nxfsprogs - Utilities for managing the XFS filesystem\n\n`apt-cache\
  \ search` 的参数可以是软件包名，也可以是描述软件包的短语（如我们的示例）。调用之后的行是是我们收到的输出，左侧是软件包名，右侧是单行描述。看起来 `attr`\
  \ 软件包就是我们想要的，让我们来看看关于它的一些细节。\n\n点击此处查看代码图像\n\n```\n$ apt-cache show attr\n```\n\n\
  Package: attr\nPriority: optional\nSection: utils\nInstalled-Size: 240\nMaintainer:\
  \ Ubuntu Core Developers <ubuntu-deel-discuss@lists.ubuntu.com>\nOriginal-Maintainer:\
  \ Nathan Scott <nathans@debian.org>\nArchitecture: i386\nVersion: 1:2.4.39-1\nDepends:\
  \ libattr1 (>= 2.4.4-1), libc6 (>= 2.6.1-1)\nConflicts: xfsdump (<< 2.0.0)\nFilename:\
  \ pool/main/a/attr/attr_2.4.39-1_i386.deb\nSize: 31098\nMD5sum: 84457d6edd44983bba3dcb50495359fd\n\
  SHA1: 8ae3562e0a8e8a314c4c6997ca9aced0fb3bea46\nSHA256: f566a9a57135754f0a...\n\
  Description: Utilities for manipulating extended attributes\nA set of tools for\
  \ manipulating extended attributes on filesystem\nHomepage: http://sgi.com/projects/xfs/\n\
  Bugs: mail:ubuntu-users@ubuntu.com\nOrigin: Ubuntu\n\n不要被冗长的输出吓倒。提取有用信息其实非常简单。我们已经从描述中可以看到，这确实是我们想要的软件包。但查看文件名字段，`pool/main`\
  \ 告诉我们这是主仓库中的一个软件包。\n\n\n\n之后，`apt-get` 会告诉你你的系统已经是最新版本，或者它正计划升级哪些内容，并且它会自动为你处理升级。这难道不酷吗？\n\
  \n### 运行发行版升级\n\n当新的 Ubuntu 版本发布且你想将服务器升级到该版本时，你将使用一个新工具 `do-release-upgrade`。该升级工具会将你的\
  \ `sources.list` 切换到新的发行版，并确定需要哪些软件包以及它们是否存在已知问题。完成后，它会要求你通过按 `y` 确认更新，或通过按 `d`\
  \ 查看已更新的软件包。如果你选择查看更新，只需输入 `y` 即可继续更新，因为该工具不会再次提示你。\n\n**注意**\n更新过程可能需要几个小时，在此期间不应中断操作。\n\
  \n### 从源码构建软件包\n\nUbuntu 存储库与 Debian 不同，它不允许直接上传二进制文件。当 Ubuntu 开发者想要向存储库添加某个软件时，他们会以特定的方式准备其源代码并将其放入构建队列。从那里，代码将经过编译、自动构建，并且——如果这些步骤成功——就会推送到存储库中。\n\
  \n为什么要费这么多周？为什么不直接让开发者在自己的机器上构建软件呢？他们可以直接将二进制文件上传到存储库，跳过构建队列（构建软件可能需要数小时）。但问题在于：Ubuntu\
  \ 官方支持三个硬件平台（Intel x86、AMD64 和 ARMHF）。如果没有构建队列，开发者必须为每个平台为他们的软件构建独立的二进制文件，这需要他们拥有一运行在每个平台上的计算机（非常昂贵！）或者创建复杂的交叉编译工具链。即便如此，坐等完成三次软件构建也是对开发者宝贵时间的极大浪费。\n\
  \n构建队列的方法解决了这个问题，因为自动构建系统会获取单个源码包，并为所有必要的平台进行构建。事实证明，这种方法为你（系统管理员）提供了一个非常棒的用处：它让你能够利用\
  \ `apt-get` 解决依赖关系的能力和易用性，并将其应用于从源码构建软件包！\n\n既然你现在很兴奋了，让我们稍微回溯一下。从源码构建软件包主要令开发者感兴趣，而不是系统管理员。事实上，作为系统管理员，你应该尽可能避免手动构建软件包，而是从\
  \ Ubuntu 存储库中软件包所获得的质量保证中受益。尽管如此，有时你可能必须在安装某个软件之前对其应用一个自定义补丁。我们将像之前一样使用 `attr` 软件包示例。以下内容是从源码构建\
  \ `attr` 并安装新软件包的可能可能像——如果你想尝试，请确保已安装 `dpkg-dev`、`devscripts` 和 `fakeroot` 软件包。\n\
  \n点击此处查看代码图片\n\n```bash\n$ mkdir attr-build\n$ cd attr-build\n$ apt-get source attr\n\
  $ sudo apt-get build-dep attr\n$ cd attr-2.4.39\n<应用补丁或编辑源代码>\n$ dch -i\n$ dpkg-buildpackage\
  \ -rfakeroot\n$ cd ..\n$ sudo dpkg -i *.deb\n```\n\n我们调用的所有命令在系统帮助页（man pages）中都有详细记录，详细介绍它们超出了本章的范围。不过，为了简要地说明我们做了什么，这里有一个快速描述。\n\
  \n1. 我们创建了一个名为 `attr-build` 的临时目录并进入其中。\n2. `apt-get source attr` 获取 `attr` 软件包的源码并解压到当前目录。\n\
  3. `apt-get build-dep attr` 安装了从源码构建 `attr` 软件包所需的所有软件包。\n4. 我们解压后的 `attr-2.4.39`\
  \ 目录，应用了补丁，并使用 `dch` 编辑了软件包日志以描述我们对源码的更改。\n5. `dpkg-buildpackage -rfakeroot` 从我们的软件包构建了一个或多个可安装的\
  \ deb 包。\n6. 我们返回文件系统的上一级目录，并安装了刚刚构建的所有 deb 包。\n\n这是一个关于一个需要长时间掌握的主题的超压缩版速查表。我们省略了很多内容，所以如果你需要为生产环境的软件包打补丁，请先去阅读我们提到的工具的帮助页，以更好地了解发生了什么！两个很好的起点是\
  \ Ubuntu 的软件包指南 [`packaging.ubuntu.com/html/`](http://packaging.ubuntu.com/html/)\
  \ 和 Debian 的软件包指南 [`debian-handbook.info/browse/stable/debian-packaging.html`](https://debian-handbook.info/browse/stable/debian-packaging.html)。\n\
  \n### aptitude\n\n在软件包管理栈的最顶层悬挂着 `aptitude`，这是一个整洁、色彩丰富的文本化界面，可以与 `apt-get` 互换使用。在这里我们不会详细介绍\
  \ `aptitude` 的用法；系统帮助页和在线 `aptitude` 帮助系统（如果你在 shell 中输入 `aptitude` ）提供了大量信息。不过，值得提到，某些系统管理员倾向于使用\
  \ `aptitude` 而不是 `apt-get` 的主要原因之一是对应对所谓的“孤立软件包”（orphan packages）的处理更好。孤立软件包是指作为另一个软件包的依赖被安装，但随后已被删除，导致孤立包无缘无留在那里。`apt-get`\
  \ 没有自动处理孤立包的方法，而是将任务交给从存储库安装的 `deborphan` 工具。相比之下，`aptitude` 会自动删除孤立软件包。\n\n###\
  \ 技巧\n\n恭喜你。如果你已经到了这里，说明你已经熟悉有效处理软件包的大多数方面。在进入其他主题之前，我们想介绍几个可能在某时刻对你有用的零散知识。\n\n\
  **列出软件包拥有的文件**\n有时查看系统上的哪些文件属于特定软件包（例如 `cron`）非常有用。`dpkg` 来救场了：\n\n```bash\n$ dpkg\
  \ -L cron\n```\n但要小心，`dpkg -L` 的输出可能包含并非由该软件包独占、而是与其他软件包共享的目录。\n\n**查找哪个软件包拥有文件**\n\
  上一个操作的反向同样简单：\n\n```bash\n$ dpkg -S /etc/crontab\ncron: /etc/crontab\n```\n单行输出告诉我们左侧的所有者软件包名称。\n\
  \n**查找哪个软件包提供文件**\n`dpkg -S` 和 `dpkg -L` 均作用于已安装软件包的数据库。有时，你可能需要确定哪个（可能尚未安装的）软件包提供了某个文件。我们可能在寻找提供\
  \ `bzr` 二进制文件或 `/usr/bin/bzr` 的软件包。要实现这一点，首先安装 `apt-file` 软件包（需要 universe 仓库），然后执行：\n\
  \n点击此处查看代码图片\n\n```bash\n$ apt-file update\n$ apt-file search /usr/bin/bzr\n```\n\
  漂亮漂亮！`apt-file` 会告诉你你想要的软件包是 bzr，输出格式与 `dpkg -S` 相同。\n\n我们的软件包管理技巧到此结束——现在是时候谈谈安全了。\n\
  \n### Ubuntu 服务器安全\n\n作为系统管理员，你的主要任务之一是处理服务器安全。如果你的服务器连接到互联网，从安全角度考虑，它处于战区。如果它只是一个内部服务器，你仍然需要处理（无意的）恶意用户、不满的员工，以及那个*真的*想看老板秘书邮箱的财务人员。\n\
  \n\n\n\n总来说，Ubuntu Server 是一个非常安全的平台。Ubuntu 安全团队（产生所有官方安全更新的团队）拥有行业内最快的响应速度之一。Ubuntu\
  \ 采用“无开放端口”策略，这意味着在您在机器上安装 Ubuntu 之后——无论是 Ubuntu 桌面版还是服务器版——默认情况下，没有任何应用程序会接受来自互联网的连接。与\
  \ Ubuntu 桌面版一样，Ubuntu Server 使用 `sudo` 机制进行系统管理，避免使用 root 账户。最后，对于推荐的 LTS（长期支持）版本，保证至少五年的安全更新且是免费的。\n\
  \n在本节中，我们想要查看用户账户管理、文件系统安全、系统资源限制、日志，最后是一些网络安全。但 Linux 安全是一个困难且广泛的话题；请记住，我们在这里提供的的是一门速成课程，省略了很多内容。要成为一名优秀的管理员，你将需要学习更多知识。\n\
  \n## 用户账户管理\n\nLinux 系统中用户管理的许多方面在不同发行版之间是一致的。Debian 提供了一些方便的工具，例如 `useradd` 命令，以让你的工作变得更轻松。但由于\
  \ Ubuntu 完全继承了 Debian 的用户管理模型，我们在这里不会详细介绍它。相反，请参阅 [www.oreilly.com/catalog/debian/chapter/book/ch07_01.html](http://www.oreilly.com/catalog/debian/chapter/book/ch07_01.html)\
  \ 获取基础知识。阅读该页面后，你将对标准模型有充分了解，我们可以简要讨论 Ubuntu 的不同之处：`sudo`。\n\n正如我们在安装章节最后提到的（“你已完成：现在请注意\
  \ Root！”），Ubuntu 默认不启用 root 或管理员账户。这种方法具有巨大的安全益处，且缺点极少，所有这些要点都记录在 `sudo_root` 的\
  \ man 页面中。\n\n您在安装期间添加的用户默认会被置于 sudo 组，并可以使用 `sudo` 执行系统管理任务。在向系统添加新用户后，您可以像这样将他们添加到\
  \ sudo 组：\n\n```bash\n$ sudo adduser username sudo\n```\n\n在上述命令中简单地用 `deluser`\
  \ 替换 `adduser` 即可将用户从该组中移除。（在 `adduser` 中添加 `--encrypt-home` 选项将自动为新用户设置家目录加密。）\n\
  \n需要记住的一点是，`sudo` 不仅仅是赋予人们 root 权限的变。`sudo` 还可以处理细粒度的权限，例如，“允许此用户以超级用户权限执行这三个命令。”\n\
  \n关于指定这些权限的文档可以在 sudoers man 页面中找到，它看起来可能有点令人生畏——你可以直接跳到末尾，直到到达 EXAMPLES 部分。学习它可能只需要\
  \ 10 或 15 分钟，而且示例涵盖了你可能想要使用 `sudo` 的绝大多数情况。当你准备好运用你的新知识时，只需运行此命令：\n\n```bash\n$\
  \ visudo\n```\n\n在这里要加小心——位于 `/etc/sudoers` 的 sudoers 数据库并不是为了让你直接用编辑器打开的，因为编辑器不会为你你检查语法语法！如果你搞乱了\
  \ sudoers 数据库，你可能会发现自己没有办法在机器上成为管理员。\n\n## 文件系统安全\n\n文件的安全模型在大多数类 Unix 操作系统中都是标准化的，被称为\
  \ POSIX 模型。该模型要求每个文件和目录都有三种广泛的访问权限：所有者（owner）、组（group）和其他人（other）。它在任何 Linux 发行版上的工作方式完全相同，这就是为什么我们在这里不重点介绍它。作为复习，请查阅\
  \ `chmod` 和 `chown` 的 man 页面，或者浏览互联网。\n\n相反，我们想要通过挂载选项（mount options）来保护分区安全，这是处理系统安全时经常被忽视的一个方面，但在恰恰当的情况下非常强大。在解释如何划分你的系统时，我们赞扬了至少为\
  \ `/home`、`/tmp` 和 `/var` 目录分配独立分区的优点，并提到了在将这些目录挂载到文件系统时可以使用特殊选项。\n\n许多特殊的挂载选项取决于文件系统，但我们要考虑的那些并不依赖。以下是我们感兴趣的：\n\
  \n- `nodev`：使用 `nodev` 选项挂载的文件系统将不允许使用或创建特殊的“设备”文件。通常没有正当允许大多数文件系统解释块设备或字符特殊设备，且允许它们会带来潜在的安全风险。\n\
  - `nosuid`：如果你阅读过 UNIX 文件权限，你就知道某些文件可以被标记，允许任何人以另一个用户或组（通常是系统管理员）的权限执行它们。这种标记分别称为\
  \ setuid (`suid`) 位或 setgid 位，在存放系统二进制文件的目录之外允许这种行为通常是没有必要的，并且会降低安全性。如果用户能够任何方式创建或获取他自己选择的\
  \ setuid 二进制文件，那么该用户实际上已经破坏了系统。\n- `noexec`：如果文件系统被标记为 `noexec`，用户将无法运行其上的任何执行文件。\n\
  - `noatime`：此标记告诉文件系统不要记录文件最后被访问的时间。如果不加区分地使用，会限制安全事件发生时可获得的信息，从而降低安全性，特别是在进行计算机取证时。然而，该标记对于某些使用模式提供了性能优势，因此它是一个很好的使用选项。\n\
  \n决定在分区上使用哪些挂载选项是另一门科学，随着你习惯管理，你通常会形成自己的偏好。这里有一个基础建议，尽管这应该只是起点：\n\n- `/home`: `nosuid`,\
  \ `nodev`\n- `/tmp`: `noatime`, `noexec`, `nodev`, `nosuid`\n- `/var`: `noexec`,\
  \ `nodev`, `nosuid`\n\n## 系统资源限制\n\n默认情况下，Linux 不对用户进程实施任何资源限制。这意味着任何用户都可以用尽机器上的所有工作内存，或无限生成进程，导致系统无法使用。解决方案是通过编辑\
  \ `/etc/security/limits.conf` 文件设置你自己的一些资源限制：\n\n```bash\n$ sudoedit /etc/security/limits.conf\n\
  ```\n\n所有可能的设置在文件注释中都有解释，没有推荐的万灵药值，但我们建议你至少设置 `nproc` 限制，以及可能的 as/data/memlock 设置。\n\
  \n### 提示：真实的限制示例\n\n为了让你了解这些在生产服务器上的样子，这里是哈佛大学通用登录服务器的配置：\n\n```\n- as 2097152\n\
  - data 131072\n- memlock 131072\n- rss 1013352\nhard nproc 128\n```\n\n这限制了普通用户\
  \ 128 个进程，最大地址空间为 2GB，最大数据大小和锁定内存空间为 128MB，最大驻留集合大小为 1GB。\n\n## 系统日志文件\n\n\n\n\n\
  作为一名系统管理员，系统日志文件是你最好的朋友之一。如果你能仔细观察它们，你通常能预先知道系统何时出了问题，并能够在问题升级之前解决大部分困扰。\n\n不幸的是，随着你负责管理的服务器不断增加，你密切关注日志文件的能力也会随之减弱，因此，管理员经常会使用日志处理软件，这些软件可以配置为在某些发生发生向他们发出警报，或者用\
  \ `Perl` 和 `Python` 等语言编写自己的工具。\n\n日志通常存储在 `/var/log` 中。在你的服务器运行一段时间后，你会发现该目录下有许多版本越旧越的日志文件，其中许多已用\
  \ `gzip` 压缩（以 `.gz` 文件扩展名结尾）。\n\n以下是一些常见的日志文件：\n\n-   syslog：系统日志。\n-   auth.log：身份验证日志，记录登录尝试、安全事件和\
  \ sudo 使用情况。\n-   mail.log：邮件日志，记录邮件传输活动。\n-   messages：通用消息日志，记录大多数系统级消息。\n-  \
  \ dmesg：内核日志，记录内核启动和硬件检测信息。\n\n### 你的工具箱\n\n在处理日志时，你应该熟悉一些工具。`tail` 命令默认打印文件的最后\
  \ 10 行：\n\n```bash\ntail /var/log/syslog\n```\n\n带有 `-f` 参数，`tail` 会进入跟踪模式，当文件发生变化时会在屏幕上更新。如果你想在日志中搜索特定字符串，可以使用\
  \ `grep`：\n\n```bash\ngrep \"error\" /var/log/syslog\n```\n\n对于压缩过的日志文件，可以使用 `zgrep`、`zcat`\
  \ 或 `zless` 等工具无需解压直接查看：\n\n```bash\nzgrep \"error\" /var/log/syslog.gz\n```\n\n\
  如果你想从日志的某一行开始查看，可以使用 `tail` 的 `-n` 参数：\n\n```bash\ntail -n 100 /var/log/syslog\n\
  ```\n\n\n\n回到 20 世纪 60 年代，服务器庞大且极其昂贵，没有人想要购买超出绝对必要的额外服务器。很快人们就会发现，一台能够同时运行不同操作系统的单一服务器可以允许具有不同需求的人使用同一台硬件，这意味着硬件采购的减少，也意味着客户的预算不再那么惨不忍睹。`IBM`\
  \ 是首个将此作为销售卖点的公司，在它的 `IBM 7044` 和 `IBM 704` 型号中引入了虚拟化，随后在它的 `Model 67` 主机硬件中也引入了该技术。后来，业界很大程度上放弃了大型机，转向了小型廉价的架式服务器，这意味着虚拟化的需求大部分都消失了：如果你需要并行运行不同的操作系统，只需买两台服务器即可。但最终，摩尔定律追上了我们的脚步，即使是小型架式机器也变得如此强大，以至于机构发现许多机器的利用率不足，而购买更多服务器（这本身是一种相对廉价的策略）意味着巨额的冷却和电力成本。这为虚拟化的再次流行铺平了道路。也许你想在同一台机器上运行不同的\
  \ `Linux` 发行版。也许你需要在 Windows 旁边运行一个 `Linux` 服务器。虚拟化可以实现这些。\n\n## 虚拟化类型\n\n虚拟化有四种主要类型。从底层到高层，它们分别是硬件仿真、全虚拟化、半虚拟化和操作系统虚拟化。\n\
  \n- **硬件仿真**意味着通过在软件中模拟每台计算机的所有硬件来运行不同的操作系统。这种方法非常强大，但速度慢得令人痛苦。\n- **全虚拟化**则使用一种称为\
  \ `hypervisor`（虚拟机监控器）的特权软件作为操作系统与底层硬件之间的代理，它提供了良好的性能，但需要处理器对如无处不在的 `x86` 等指令集提供特殊支持。\n\
  - **半虚拟化**同样使用 `hypervisor`，但仅支持执行经过特殊修改的操作系统，以此换取高性能。\n- **操作系统虚拟化**更准确的术语是“容器化”或“分区”，指的是支持在单个运行内核上利用多个用户空间的操作系统。容器化提供了接近原生的性能，但与其他虚拟化方法并没有可比性，因为它的重点不是并行运行多个操作系统，而是将一个系统分割成隔离的部分。\n\
  \n## 工具与推荐\n\n`Linux` 上最广泛使用的硬件仿真器是 `QEMU` 和 `Bochs`，分别在 `Ubuntu` 中通过软件包 `qemu`\
  \ 和 `bochs` 提供。`Linux` 上全虚拟化领域的巨头有 `VMware` 的商业化产品、`IBM` 的 `z/VM`，以及最近的名为 `KVM`\
  \ 的技术，它已成为 `Linux` 内核的一部分。在半虚拟化方面，主要的竞争者是 `Xen`；`Linux` 操作系统虚拟化领域由 `OpenVZ` 和 `Linux-VServer`\
  \ 项目主，尽管许多操作系统虚拟化所需的接口已逐渐进入了 `Linux` 内核本身。\n\n如果你是 `Ubuntu` 桌面用户，并想要一种安全的方法来运行一个或多个其他\
  \ `Linux` 发行版（包括不同版本的 `Ubuntu`！）或操作系统（`BSD`、Windows、`Solaris` 等）用于测试或开发，且所有这些都封装在一个良好的界面中，那么首选推荐是来自\
  \ `Sun Microsystems` 的开源项目 `VirtualBox`。它在 `Ubuntu` 中通过软件包 `virtualbox-ose` 提供，其主页为\
  \ [www.virtualbox.org](http://www.virtualbox.org)。\n\n如果你想虚拟化你的服务器，`Ubuntu` 中的优选解决方案是\
  \ `KVM`，这是一个快速的全虚拟化器，可以将运行的内核转换为 `hypervisor`。然而，由于 `x86` 指令集的特殊性，全虚拟化器只有在处理器的帮助下才能工作，`KVM`\
  \ 例外。要测试你的处理器是否有相应的支持，请尝试：\n\n```bash\negrep '(vmx|svm)' /proc/cpuinfo\n```\n\n\
  如果该行产生了输出，你就成功了。前往 [`help.ubuntu.com/community/KVM`](https://help.ubuntu.com/community/KVM)\
  \ 查看安装和配置 `KVM` 及其客户操作系统的说明。\n\n### 提示：点点式 Xen\n\n值得提的一个 `Xen` 相关项目是 `MIT` 的开源 `XVM`（不要与\
  \ `Sun Microsystems` 的 `xVM` 混淆），它是一套构建在 `Debian` 之上的工具，允许用户通过 Web 浏览器创建并启动 `Xen`\
  \ 虚拟机，并带有串口控制台重定向、`ssh access` 以及各种其他功能。`MIT` 使用该系统为任何 `MIT` 关联人员提供点点式的虚拟机；项目主页为\
  \ [`xvm.mit.edu`](http://xvm.mit.edu)。\n\n## 磁盘复制\n\n我们讨论了 `RAID` 在磁盘故障时保护数据完整性方面的作用，但我们没有回答后续跟进问题：当整台机器故障时会发生什么？答案完全取决于你的用例，给出通用的处方并没有意义。例如，如果你是\
  \ `Google`，你拥有自动化集群管理工具，可以检测到机器宕机，并在技术人员派去修复之前不再向其分配工作。但这是因为 `Google` 的基础设施确保了（极端情况除外）没有任何机器持有未在其他地方被复制的数据，因此任何一台机器的故障最终都是无关紧要。\n\
  \n如果你没有 `Google` 那样拥有成千上万服务器的高度冗余基础设施，你可以考虑一种更简单的方法：将整个硬盘复制到另一台计算机，实时同步更改，就像网络上的\
  \ `RAID`。\n\n这种功能被称为分布式复制块设备（`DRBD`），它不仅限于硬盘：它可以复制你喜欢的任何块设备。`Ubuntu 9.04` 及更高版本自带\
  \ `DRBD`，你需要的用户空间工具位于 `drbd8-utils` 软件包中。完整文档请访问 `DRBD` 网站 [www.drbd.org](http://www.drbd.org)。\n\
  \n## 云计算\n\n云计算建立在虚拟化最有趣的特性之上：你可以轻松地创建、暂停和销毁多个虚拟机，它们都运行在一台物理机器上。对于用户来说，这些虚拟机的行为就像真实的计算机一样。\n\
  \n有了云计算，计算能力变成了一种商品。你不再需要提前几个月进行计划、预算和安装新设备。相反，向云请求一台机器，它就会出现。用完后，把它扔掉即可。\n\n这就像是挖井和打开水龙头的区别。如果你从水龙头获得来水，水仍然是宝贵的资源，但它不再是你需要投入时间去获取的东西。如果你拥有云计算，计算能力可能仍然有限，但它变得更容易获取、共享和重新利用。\n\
  \n`Ubuntu` 是云计算革命的核心。它既作为运行云计算集群（为云提供计算能力的机器）的基础操作系统运行，也作为人们在云中运行的虚拟机时所选择的操作系统。\n\
  \n\n\n由于云计算非常新，它的发展速度极快，但目前已经出现了两种主流的云平台运行方法：亚马逊的 `EC2` 和开源项目 `OpenStack`。Ubuntu\
  \ 处于这两者的核心位置。如果你想进行实验，这将是一个极好的消息，因为 Ubuntu 为你提供了系列工具，用于设置和管理你自己的云。\n\n你会遇到的两个主要工具是\
  \ `MAAS`（也称为 Metal as a Service，即服务）和 `Juju`。`MAAS` 帮助你设置和管理服务器集群，而 `Juju` 则让你能够轻松地直接在裸机服务器或云中运行服务。\n\
  \n通过 `MAAS`，你可以将一组裸机服务器视为云：你不再拥有一堆孤立的服务器，而是拥有一个可以在其上部署不同服务的计算资源。通过 `MAAS` 的 Web\
  \ UI，你可以快速概览计算集群的使用情况以及可用资源。即使只有几台服务器，`MAAS` 也是一种开始以类似于云的方式来对待真实机器的绝佳方法。\n\n你可以将\
  \ `Juju` 认为类似于运行在服务器上的服务的 `apt-get`。`Juju` 使用名为 `charms` 的脚本，这些脚本负责完成运行特定服务所需的所有设置工作。假设你想运行一个\
  \ WordPress 服务器。你只需要在服务器上部署正确的 `Juju` charm，一切就都会被正确地设置好。\n\n通过结合 `MAAS` 和 `Juju`，你可以相对容易地搭建起自己的私有云。`MAAS`\
  \ 帮助你管理真实机器，而 `Juju` 帮助你设置运行该云所需的服务。\n\n假设你想使用 `Juju` 向云上部署一个特定服务。我们在示例中使用了 `Zookeeper`。部署服务的正常流程如下所示：\n\
  \n```\n$ juju bootstrap\n$ juju deploy zookeeper\n$ juju expose zookeeper\n```\n\
  \n此时，`Juju` 会创建一个虚拟机实例，安装 `Zookeeper` 并对其进行配置。使用以下命令可以确定实例的状态：\n\n```\n$ juju status\n\
  ```\n\n当你收到实例已启动并运行的通知时，你将获知其 IP 地址并开始使用它。这个过程异常地快速且简单！\n\n对于 12.04 版本来说，一个非常有用的工具是\
  \ `Juju charm store`。在 `Juju` 刚运行时，使用 `charms` 寻找和部署服务要困难得多，但有了作为中央仓库的 charm store，这一过程变得更加优雅。正如\
  \ `APT` 和相关的软件库让查找和安装软件变得简单一样，`Juju` charm store 的设计也是为了让在云中启动和配置服务器变得简单。`APT` 和\
  \ `Juju` 的工作方式之间存在着有趣的区别。\n\n在 `APT` 仓库中，软件通常是冻结的——也就是说，在一个特定的发布周期内，它不会收到更新，除非是安全更新或微小的错误修复更新，即使如此，这些更新通常也存储在另一个仓库中（例如\
  \ `precise-main` 或 `precise-security`）。而在 `Juju` 中，`charms` 可以由任何人编写，并在 charm store\
  \ 的发布周期内进行更新。charm store 并会像 `APT` 仓库那样被冻结。这非常重要，特别是对于那些（明智地）选择为服务器运行 Ubuntu LTS\
  \ 版本的用户，否则他们可能需要等待好几年才能安装心仪软件的新版本，或者等到将他们的 Ubuntu 版本升级到下一个 LTS 或找到包含该软件的 `PPA`。\n\
  \n所以，假设你正在开发 `Zookeeper` 的开发版本，并希望快速创建一个部署了开发版本而非稳定版本的云服务器实例。你可以直接使用以下系列命令来代替之前的组命令：\n\
  \n```\n$ juju bootstrap\n$ juju deploy zookeeper\n$ juju set zookeeper source=dev\n\
  $ juju expose zookeeper\n```\n\n只需添加一行，你就在部署开发版本了！这种能够轻松指定部署源的能力是非常实用的。\n\nCharm\
  \ 作者被赋予了将这些细节写入其 `charms` 的权限。版本、来源等特定细节都在里面。如果你想安装 `nodejs`，就没必要到处搜寻某人在博客文章或 pastebin\
  \ 代码段中编写的安装脚本；相反，你只需要使用那个人的 `Juju` charm 即可。非常简单。该 charm 包含了诸如使用哪个 `PPA` 以及必要的安装脚本等信息。\n\
  \n允许任何人给你提供安装软件的 charm 可能是危险的，因此内置了一些安全和防护机制。这是设立商店的第二个原因（在考虑了终端用户的便利性之后）。`Juju`\
  \ 存储中的 `Charms` 会经过社区同行评审过程和自动化构建过程以测试失败情况。任何人都可以为自己的使用或直接与他人分享编写 `charms`，但在 charm\
  \ 被包含在商店之前，需要更多的努力和审查。\n\n关于 `Juju`、`MAAS` 和 `charms` 还有很多话超出了本书的范围。如果你感兴趣，请参阅 [jujucharms.com](http://jujucharms.com)\
  \ 或由 Prentice-Hall 出版的 *The Official Ubuntu Server Book*, *third edition*。\n\n###\
  \ 总结\n\n如果你从未管理过系统，那么无论你选择学习管理哪种操作系统，从普通用户的转变将是困难的。这种困难源于所要求的更广泛的思维转变。你不再仅仅是确保房间整洁，现在你必须运行并保护整栋公寓楼。但这种困难具有教育意义且富有回报的。（我们意识到大学的理论物理课上老师也告诉过你这些，但我们没有撒谎。）学习维护\
  \ Ubuntu 服务器对你来说是一个很选择，因为你将受益于活力且乐于助人的社区，而且你在每一步中都在与顶级的操作系统打交道。\n\n如果你是一位想来看看 Ubuntu\
  \ Server 到底怎么的资深管理员，请请关注。该项目在稳定性方面固如磐石，但在功能上仍处于幼年期，服务器团队正在非常努力使其成为市面上最好的服务器平台。我们正在强调高级功能，并对所有小细节的完美做到非常挑剔。\n\
  \n在两种情况下，如果你正在安装一台新服务器，请尝试 Ubuntu Server。它是一个先进的系统，我们确信你会喜欢使用它。联系我们，告诉我们该如何改进它，并伸出援手。帮助我们让\
  \ Ubuntu 在大型硬件上变得更加硬核！\n\n## 第 9 章 Ubuntu 相关项目和衍生版本\n\n* *\n\nUbuntu 不仅仅是一个完整的操作系统；它还是不断增长的发行版生态系统的中心。有些被称为合作伙伴项目，它们与\
  \ Ubuntu 内部紧密合作。另一些则倾向于在 Ubuntu 项目的边缘开发官方 Flavor（变体），这些变体共享 Ubuntu 的软件源，但其创建是为了突出特定的软件选择或使用场景，例如专注于多媒体创作和编辑的\
  \ Ubuntu Studio 项目。另一些如 Lubuntu 项目是由具有特定愿望的用户社区创建的。\n\n\n\n\n\n还有一些发行版的创建与 Linux\
  \ 和开源软件的国际化特性有关。虽然大多数 Ubuntu 开发是使用英语进行的，但在其他语言和国家也存在大型的开发者和用户社区。因此，为了满足这些需求，可能会出现衍生发行版。有些衍生发行版专门针对基督徒、儿童、电脑配置较低的用户，以及希望系统针对几种替代用户界面之一进行优化的，或供全球范围内不同学校和政府机构使用的\
  \ Ubuntu 系统。你应该使用这些版本之一而不是原生 Ubuntu 吗？我们无法为你回答这个问题。其中某些项目完全包含在 Ubuntu 内，因此与 Ubuntu\
  \ 互不排斥；另一些基于 Ubuntu，但是独立的项目。根据您的偏好或情况，某一个可能比另一个更合适。您可以混合、匹配并尝试这些发行版，直到找到一个适合您自己的。正如我们在第\
  \ 1 章中提到的，Ubuntu 将这些衍生版本视为社区健康且充满活力的标志。该项目的目标之一就是让这类发行版的出现更容易。我们可以期待未来会看到更多此类版本。\n\
  \n### 认可的版本 (Recognized Flavors)\n\n认可的版本（图 9-1）按照相同的进度发布，共享共同软件包仓库，并与 Ubuntu 保持紧密联系。在本书出版时，官方共有九个受认可的版本——Xubuntu、Ubuntu\
  \ Studio、Mythbuntu、Kubuntu、Edubuntu、Lubuntu、Ubuntu Kylin、Ubuntu GNOME 和 Ubuntu MATE——它们将在本章稍后的部分进行深入讨论。Canonical\
  \ 为这些认可的版本提供基础设施支持、每日 ISO 构建和发布资源、与 Ubuntu 发布的协调，以及发布后的支持。然而，Canonical 也不再为这些认可的版本提供某些服务：自动化\
  \ ISO 或升级测试、修复 Ubuntu 桌面或服务器镜像中未包含的软件包、主仓库未包含软件包的安全更新、在 [`releases.ubuntu.com`](http://releases.ubuntu.com)\
  \ 上发布以及 CD 或 USB 镜像的制作。现在，每个认可版本的社区都负责承担这些服务。\n\n![Image](img/00112.jpeg)\n\n**图\
  \ 9-1** Ubuntu.com 版本下载页面\n\n与 Ubuntu 一样，这些认可的版本每一个都拥有充满活力的社区，帮助其开发、维护、测试、支持、倡导等。每个版本在\
  \ freenode.net 上都有 IRC（互联网聊天记录）频道、邮件列表、Launchpad 团队、论坛、wiki 页面和供用户参与的网站。每个认可版本章节下列出了这些资源的更多信息，更多通用信息可以在\
  \ [`wiki.ubuntu.com/RecognizedFlavors`](https://wiki.ubuntu.com/RecognizedFlavors)\
  \ 找到。\n\n### Kubuntu\n\nKubuntu（图 9-2）是所有合作伙伴项目中最早且最老的。它首次随 Ubuntu 5.04 一起发布，Kubuntu\
  \ 在 Bem 巴语中意为“走向人性”，它基于 K 桌面环境 (KDE) 的优势，而不是像 Ubuntu 那样基于 Unity。它力求结合 Ubuntu 和 KDE\
  \ 的优点，产生一个出色的 Linux 发行版。\n\n![Image](img/00113.jpeg)\n\n**图 9-2** Kubuntu 16.04\
  \ 桌面\n\n与 Ubuntu 一样，这些认可的版本每一个都拥有充满活力的社区，帮助其开发、维护、测试、支持、倡导等。每个版本在 freenode.net 上都有\
  \ IRC 频道、邮件列表、Launchpad 团队、论坛、wiki 页面和供用户参与的网站。\n\n### Edubuntu\n\nEdubuntu（图 9-3）是一个面向学校的\
  \ Ubuntu 版本。\n\n![Image](img/00114.jpeg)\n\n**图 9-3** Edubuntu 14.04 桌面 \n\n与 Ubuntu\
  \ 一样，这些认可的版本每一个都拥有充满活力的社区，帮助其开发、维护、测试、支持、倡导等。每个版本在 freenode.net 上都有 IRC 频道、邮件列表、Launchpad\
  \ 团队、论坛、wiki 页面和供用户参与的网站。\n\n### Lubuntu\n\nLubuntu（图 9-4）在 11.10 发布周期期间获得了官方认可的版本地位，并通过默认使用轻量级\
  \ X11 桌面环境 (LXDE) 代 GNOME、KDE 或 Xfce，以提供一个更轻量、更快速的桌面\n\n![Image](img/00115.jpeg)\n\
  \n**图 9-4** Lubuntu 16.04 桌面 \n\nLubuntu 专注于低配置硬件。每个版本在 freenode.net 上都有 IRC 频道、邮件列表、Launchpad\
  \ 团队、论坛、wiki 页面和供用户参与的网站。\n\n\n\n\n\n论坛：[`ubuntuforums.org/tags.php?tag=lubuntu`](http://ubuntuforums.org/tags.php?tag=lubuntu)\n\
  \nWiki 页面：[`wiki.ubuntu.com/Lubuntu`](https://wiki.ubuntu.com/Lubuntu)\n\n***\n\n\
  ### 提示：Lubuntu\n\nLubuntu 可以 [`lubuntu.net`](http://lubuntu.net) 找到。\n\n***\n\n\
  ### Xubuntu\n\nXubuntu (图 9-5) 是基于 `Xce` 桌面环境构建的 Ubuntu 版本。在 Xubuntu 中，`Xfce` 及其相关应用程序的作用类似于\
  \ Kubuntu 语境下的 `KDE`。与远比华美的 Unity、GNOME 和 `KDE` 相比，`Xfce` 更加小巧且轻量。在普通配置下，它比任何替代方案都占用内存更少，CPU\
  \ 周期更低。虽然这意味着 Xubuntu 通常被认为比 Ubuntu 或 Kubuntu 功能更少或不那么用户友好，但也意味着它运行更快、响应更迅速，并且在旧或性能较弱的电脑上往往运行得非常快。Xubuntu\
  \ 在桌面完全自定义方面也更加灵活，从菜单和面板的位置到各种面板小程序的包含。因此，Xubuntu 经常被电脑回收人员、旧电脑所有者以及那些只想通过更高效的界面从硬件中榨取更好性能的人使用。\n\
  \n![图像](img/00116.jpeg)\n\n**图 9-5** Xubuntu 16.04 桌面\n\n像 Kubuntu 一样，Xubuntu 是社区驱动的，起源于\
  \ Ubuntu 项目之外宇宙宇宙（universe repository）。在 5.04 和 5.10 版本中，Ubuntu 的一个特殊的 `Xfce Team`\
  \ 支持了 `Xfce` 4。由于对 `Xfce` 所做的巨大工作，Xubuntu 被纳入其中，成为 Ubuntu 的第三个合作伙伴项目并成为 Ubuntu 主仓库的一部分，并自\
  \ 6.10 版本发布以来一直留在那里。\n\n***\n\n### 提示：Xubuntu 资源可以在此处找到：\n\nIRC：`#xubuntu`\n\n邮件列表：[`lists.ubuntu.com/mailman/listinfo/xubuntu-users`](https://lists.ubuntu.com/mailman/listinfo/xubuntu-users)\n\
  \nLaunchpad ：[`launchpad.net/xubuntu-desktop`](https://launchpad.net/xubuntu-desktop)\n\
  \n论坛：[www.ubuntuforums.org/tags.php?tag=xubuntu](http://www.ubuntuforums.org/tags.php?tag=xubuntu)\n\
  \nWiki 页面：[`wiki.ubuntu.com/Xubuntu`](http://wiki.ubuntu.com/Xubuntu)\n\n***\n\n\
  ***\n\n### 提示：Xubuntu\n\nXubuntu 可以在 [www.xubuntu.org](http://www.xubuntu.org) 找到。\n\
  \n***\n\n### Ubuntu Studio\n\nUbuntu Studio (图 9-6) 是 Ubuntu 的一个变体，专为多媒体制作设计和优化。该系统包含了大量适用于音频视频录制、混音、编辑、合成和制作，以及图形制作和处理的人的应用程序。它包含一个修改过的内核，允许系统降低音频延迟，从而大幅提高专业音频录制和处理的性能，但该内核在其他环境中可能并不合适。它的首次发布基于\
  \ Ubuntu 7.04。Studio 团队关注 LTS（长期支持）版本。\n\n![图像](img/00117.jpeg)\n\n**图 9-6** Ubuntu\
  \ Studio 16.04 桌面 \n\n***\n\n### 提示：Kubuntu Ubuntu Studio 资源\n\nIRC：`#ubuntustudio`\n\
  \n邮件列表：[`lists.ubuntu.com/mailman/listinfo/ubuntu-studio-users`](https://lists.ubuntu.com/mailman/listinfo/ubuntu-studio-users)\n\
  \nLaunchpad ：[`launchpad.net/~ubuntustudio`](https://launchpad.net/~ubuntustudio)\n\
  \nWiki 页面：[`wiki.ubuntu.com/UbuntuStudio`](https://wiki.ubuntu.com/UbuntuStudio)\n\
  \n***\n\n***\n\n### 提示：Ubuntu Studio\n\nUbuntu Studio 可以在 [www.ubuntustudio.org](http://www.ubuntustudio.org)\
  \ 找到。\n\n***\n\n### Mythbuntu\n\nMythTV 是最流行的家庭影院免费软件之一，但它有一定的“设置困难”的名声。Mythbuntu\
  \ (图 9-7) 旨在让这种设置变得简单。像 Xubuntu 和 Studio 一样，Mythbuntu 使用 `Xfce` 作为桌面环境，拥有自定义的 `Mythbuntu\
  \ Control Center`，并有一个方便测试的 LiveCD。Mythbuntu 的首次发布基于 Ubuntu 7.10。今天，Mythbuntu 只提供\
  \ LTS 版本。\n\n![图像](img/00118.jpeg)\n\n**图 9-7** Mythbuntu 16.04 桌面 \n\n***\n\n###\
  \ 提示：Mythbuntu 资源\n\nIRC：`#mythbuntu`\n\n邮件列表：[`lists.ubuntu.com/mailman/listinfo/Ubuntu-mythtv`](https://lists.ubuntu.com/mailman/listinfo/Ubuntu-mythtv)\n\
  \nLaunchpad ：[`launchpad.net/mythbuntu`](https://launchpad.net/mythbuntu)\n\n论坛：[www.ubuntuforums.org/tags.php?tag=xubuntu](http://www.ubuntuforums.org/tags.php?tag=xubuntu)\n\
  \n### Ubuntu Kylin\n\nUbuntu 增长最快的市场之一是中国。这个变体 (图 9-8) 试图通过提供原生中文界面来满足中国用户的需求。Ubuntu\
  \ Kylin 的首次正式发布是 2013 年 4 月 25 日，带有用户默认安装的各种应用程序。\n\n![图像](img/00119.jpeg)\n\n**图\
  \ 9-8** Ubuntu Kylin \n\n***\n\n### 提示：Ubuntu Kylin\n\nUbuntu Kylin 可以在 [www.kylin.cn](http://www.kylin.cn)\
  \ 找到。\n\n***\n\n### Ubuntu GNOME\n\n随着 Unity 成为默认，GNOME 社区发现自己没有一个专注于桌面的变体。2013\
  \ 年 4 月 25 日，团队发布了 Ubuntu GNOME 的第一个版本。这个变体 (图 9-9) 试图在发布时提供尽可能最新的 GNOME 版本，并保持其上游的“相对纯净”。\n\
  \n![图像](img/00120.jpeg)\n\n**图 9-9** Ubuntu GNOME \n\n***\n\n### Ubuntu MATE\n\n\
  Ubuntu MATE 变体 (图 9-10) 迎了想要通过 MATE 桌面环境保留熟悉的 GNOME 2 桌面的用户。MATE 自称为 GNOME 2 的延续——即它是\
  \ GNOME 2 代码的一个分支，但现在为了持续使用而进行了现代化处理。\n\n\n\n\n\nLaunchpad 项目：[`launchpad.net/ubuntu-mate`](https://launchpad.net/ubuntu-mate)\n\
  \n提示：Ubuntu MATE\nUbuntu MATE 可以在 [`ubuntu-mate.org/`](https://ubuntu-mate.org/)\
  \ 找到\n\n### 版本\n\n官方 Ubuntu 版本包括 Ubuntu 桌面版、服务器版、手机版和核心版。它们得到了 Canonical 的完全支持。\n\
  \n### Ubuntu Server\n创建 Ubuntu Server 的目的是让 Ubuntu 在服务器上易于安装和使用。服务器版随 Ubuntu 5.04\
  \ 正式发布，最初侧重于确保提供高质量的服务器应用程序以便易于安装和配置，包括 `MySQL`、`Apache` 等。\n\n最近的工作涉及改进 Ubuntu\
  \ Server 的云计算能力。Ubuntu Server 的 Ubuntu Cloud 功能旨在为您提供使用 Ubuntu 构建自己的云基础设施所需的所有工具和服务（参阅图\
  \ 9-11）。无论是在企业层面还是个人层面，它都允许您在自己的服务器上管理云工作负载，并在需要额外容量时将相同的工作负载发送到公云。\n\n![Image](img/00122.jpeg)\n\
  \n**图 9-11** Ubuntu Cloud。系统管理员、运维 工程师和用户可以使用 `Juju`——DevOps Distilled——charm 在公云、私有云或混合云中部署、编排和扩展服务。\n\
  \n要了解更多关于 Ubuntu Server 版的信息，我们推荐阅读 Prentice Hall 出版的《官方 Ubuntu 服务器书籍》（The Official\
  \ Ubuntu Server Book）。\n\n提示：Ubuntu Server 版\nUbuntu Server 版可以在 [www.ubuntu.com/server](http://www.ubuntu.com/server)\
  \ 找到，更多信息可以通过 [www.ubuntu.com/cloud](http://www.ubuntu.com/cloud)、[`cloud.ubuntu.com`](http://cloud.ubuntu.com)\
  \ 以及 [`juju.ubuntu.com`](https://juju.ubuntu.com)。\n\nUbuntu Server 还提供预装云镜像，可定制在\
  \ Amazon EC2、`OpenStack` 和 `LXC` 等云平台上运行。当您使用 Ubuntu 设置部署时，许多服务也会在其默认控制台中提供这些镜像。\n\
  \n提示：Ubuntu 云镜像\nUbuntu 云镜像可以在 [`cloud-images.ubuntu.com/`](http://cloud-images.ubuntu.com/)\
  \ 找到，包括指向这些镜像更多信息的链接。\n\n### Ubuntu Phone\nUbuntu 版本中较新的成员之一是为手机和平板电脑开发并设计的 Ubuntu\
  \ 版本，最初被称为 `Ubuntu Touch`，现在称为 Ubuntu Phone。该项目的默认应用程序开发投入了大量精力。开发出了一种创新的滑动驱动界面，专门为较小尺寸触摸屏设备定制。\n\
  \n在编写本文时，这是一个与 Ubuntu 桌面版的独立项目。然而，随着 `Mir` 在 `Unity 8` 中的引入，团队引入了一个基于 `Mir` 和 `Unity\
  \ 8` 的桌面版本，供用户在 16.04 中尝试。第 10 章 提供了关于 Ubuntu Phone、`Mir` 和 `Unity 8` 的更多信息。\n\n\
  提示：Ubuntu Phone\nUbuntu Phone 的最新消息、进展和版本可以在 [www.ubuntu.com/phone](http://www.ubuntu.com/phone)\
  \ 找到。\n\n### Ubuntu Core\nUbuntu 版本系列中的最新新增是 Ubuntu Core。在第 10 章中有更深入的探讨，它旨在成为一个非常小的服务器镜像，非常适合物联网（IoT）设备和容器。Ubuntu\
  \ Core 依赖事务性更新和应用隔离，这允许易于更新和回滚。为此，它使用了新的 `Snappy` 包管理系统，该系统比标准 Ubuntu 桌面版和服务器版使用的传统\
  \ `Debian` 包更便于打包。\n\n提示\nUbuntu Core 正在开发中。可以在 [`developer.ubuntu.com/en/snappy/`](http://developer.ubuntu.com/en/snappy/)\
  \ 找到该版本的最新信息。\n\n## 其他 发行版\n某些发行版通常运行在 Ubuntu 社区之外，并且通常有自己的软件包仓库。它们的发布时间可能与 Ubuntu\
  \ 不同。过去，这些派生发行中有几个是直接构建在其他发行版之上的，例如 `Debian`（后者也是 Ubuntu 的基础）。Ubuntu 开发者在创建发行版过程中所做的更改被认为是积极且有用的，为其他有自定义需求或想法的人提供了基础。派生发行版的列表增长迅速，随着发行版的更替，该列表处于变动中。在本书的第一版中，我们的列表几乎是完整的；从那以后，派生发行版社区的规模增长得如此，以至于在第九版中编制一个完整的列表已不再可能。相反，我们通过一些最老且最著名的派生发行版示例，提供派生发行版多样性的氛围，让您对该社区的范围有个了解。\n\
  \n### Guadalinex\nGuadalinex 是由安达卢西亚（Andalusia）地区政府开发并推广的 `GNU/Linux` 发行版，西班牙人口最多的自治区，拥有近\
  \ 800 万居民。它目前是全球最大的自由软件实现之一，拥有超过 200,000 台桌面且数量在不断增加。该项目是安达卢西亚议会会对 2002 年和 2003\
  \ 年批准的信息社会和创新政策通过一致支持产生的结果，敦促所有地区机构推广和使用自由软件及开源许可。\n\nGuadalinex 最初于 2003 年发布，前两个版本基于\
  \ `Debian`。2005 年，Guadalinex 项目决定开发基于 Ubuntu 的第三版本。Guadalinex 版本 3 于 2006 年 1 月发布，基于\
  \ Ubuntu 5.10，成为第一个 Ubuntu 派生版。该项目是政府在公立学校默认实施自由软件计划的一部分。到 2006 年，该项目涉及 500 所学校和约\
  \ 200,000 台配备 Guadalinex 和自由软件的电脑。随着每年 9 月新课程的开始和新电脑的购买，这些数字每年增加（2006 年增加了 40,000\
  \ 台）。此举让 Guadalinex 位居全球最大的自由软件实现。此外，该软件还用于公共互联网接入中心、老年中心、图书馆、妇女协会以及家庭。Guadalinex\
  \ 只是由政府创建或与其合作并在学校和机构使用的许多 Ubuntu 派生版之一。它现在是这些环境中大量部署 Ubuntu 之一。\n\n提示：Guadalinex\n\
  Guadalinex 可以在 [www.guadalinex.org](http://www.guadalinex.org) 找到。\n\n### Linux\
  \ Mint\n由于 Ubuntu 致力于尽可能默认使用自由软件，因此它没有预装专有媒体解码器。这就是 Linux Mint 最初创建的原因。随着时间的推移，它发展了一个社区，致力于创建一个易于使用和安装、外观良好的\
  \ Linux 桌面，重点是让一切尽可能简单愉快，特别是对于新用户来说。该发行版完全兼容并使用 Ubuntu 软件包仓库。主要区别在于外观和感受，以及默认安装软件的选择。Linux\
  \ Mint 还提供一个基于 `Debian` 的版本。\n\n提示：Linux Mint\nLinux Mint 可以在 [linuxmint.com](http://linuxmint.com)\
  \ 找到。\n\n\n\n\n\n官方和认可的发行版列表维护在 [www.ubuntu.com/about/about-ubuntu/derivatives](http://www.ubuntu.com/about/about-ubuntu/derivatives)。更多发行版列在\
  \ [`wiki.ubuntu.com/DerivativeTeam/Derivatives`](https://wiki.ubuntu.com/DerivativeTeam/Derivatives)\
  \ 中。\n\n### Launchpad\n\n正如我们在第 1 章中提到的，Canonical 的大多数技术员工并不是为 Ubuntu 工作的。相反，他们从事的是基础设施工作。这些基础设施的大部分由大量的服务组成，这些服务共同工作，以提供构建\
  \ Ubuntu 的框架。这种由相关应用程序组成的超结构统称为 `Launchpad`。虽然它有几个非 Web 的系统，但几乎完全可以通过 Web 访问。\n\n\
  虽然 `Launchpad`（图 9-12）主要用于开发 Ubuntu，但其开源 (AGPLv3) 基础设施的设计旨在对任何自由软件项目都有用，并且正变得越来越流行，现在有多个非\
  \ Ubuntu 项目托管在 `Launchpad` 上。它的目标为这些项目提供代码跟踪、错误跟踪和翻译跟踪软件，以便能够更方便、更有力地与他人协作，并开发自由开源软件。这些功能（代码、错误和翻译跟踪）中的每一个都是高度集成的，使其比具有相似目标的传统\
  \ Web 解决方案更具野心，也可能强大得多。在早期，`Launchpad` 网页页对该项目的描述如下：\n\n![Image](img/00123.jpeg)\n\
  \n**图 9-12** Launchpad 中的 Ubuntu 项目\n\n一个为开源世界项目提供的服务集合。你可以注册你的项目，然后与开源社区就翻译、错误跟踪和代码方面进行协作。\n\
  \n即使项目随着支持模块和规范模块的扩展而扩大，该描述仍然有效。除了代码、错误和翻译跟踪之外，`Launchpad` 还提供了处理代码的能力，不仅是在单个包或单个项目层面，而且在发行版层面也是。如果\
  \ Ubuntu 中的某件软件报告了错误，那么上游和下游项目都能看到该错误。项目可以跟踪软件随时间推移的演变，并一眼看出错误是否适用。开发者也可以以类似的方式跟踪翻译。\n\
  \n理解 `Launchpad` 的最好方法是看它的运行。本节将深入深入介绍 `Launchpad` 的各个部分。Ubuntu 的大部分基础设施都高度集成在 `Launchpad`\
  \ 中。如果你已经为报告错误或加入 Ubuntu 团队创建了账户，你就已经有一个 `Launchpad` 账户。\n\n### 提示：Launchpad\n\n\
  `Launchpad` 可以在 [www.launchpad.net](http://www.launchpad.net)找到。\n\n### Soyuz\n\n\
  `Soyuz` 是集成到 `Launchpad` 中的发行和存档管理软件。它处理 Ubuntu 在每种架构上所有的软件自动构建，并将成功构建的软件集成到存档中。`Soyuz`\
  \ 在俄语中意为“联盟”，也是 Mark Shuttleworth 在太空旅行期间乘坐的飞天器的名称。\n\n`Soyuz` 几乎完全在后台运行。它于 2006\
  \ 年 2 月初首次激活，但最初对 Ubuntu 中软件上传或下载的方式没有产生任何影响。`Soyuz` 的作用是整合软件构建并插入 Ubuntu 存档不同部分的过程。软件的构建无法通过\
  \ `Launchpad` Web 基础设施进行跟踪。\n\n### 提示：最近构建\n\nUbuntu 中最近构建的状态可以在 [`launchpad.net/distros/ubuntu/+builds`](https://launchpad.net/distros/ubuntu/+builds)\
  \ 找到。\n\n## Launchpad 翻译\n\n`Translations` 是集成到 `Launchpad` 中的 Web 翻译系统（图 9-13）。它是\
  \ `Launchpad` 第一个公发布的组件。它的代名为 `Rosetta`，源自罗塞塔石——那块著名的深灰色花岗岩，上面有三种文字的相同文本，破解了埃及象形文字密码。\n\
  \n![Image](img/00124.jpeg)\n\n**图 9-13** Launchpad 中的 Ubuntu 翻译\n\n`Rosetta` 是“PO”文件编辑器的\
  \ Web 版本。换句话说，它提供了一种简单的机制，翻译人员可以查看未翻译的短语或字符串列表，然后将每一个都翻译成自己的语言。目前，该系统仅适用于*来自*英语的翻译。`Rosetta`\
  \ 的非 Web 前身包括 `Kbabel` 和 `Gtranslate`，它们都可以在 Ubuntu 上下载并安装。通过将此功能置于 Web 端并集成到存档管理脚本中，`Rosetta`\
  \ 降低了翻译的门槛，增加了翻译进入发行版的概率。\n\n`Rosetta` 包含了 Ubuntu 中每个应用程序包含的每个可翻译字符串。当新软件上传到 Ubuntu\
  \ 时，`Rosetta` 将检查是否有任何字符串发生了更改或被添加。之前翻译过的字符串的更改会导致该翻译被标记为“模糊”（fuzzy），直到翻译人员检查翻译和新字符串，进行任何更改，然后将翻译标记为不再模糊。通过跟踪新字符串，`Rosetta`\
  \ 可以在新字符串出现时轻松地提示翻译人员进行翻译，并提供特定应用程序或整个 Ubuntu 中已翻译成特定语言的字符串百分比统计。\n\n当用户翻译字符串时，他们在系统内部积累了正向的“业力”（karma）——这种创新已部署到\
  \ `Launchpad` 的许多其他部分。用户还可以本地化团队（称为 l10n teams，因为 *localization* 一词的首尾之间有 10 个字母）。`Rosetta`\
  \ 为 Ubuntu 用户参与提供了绝佳方式。任何懂英语和另一种语言的人都可以开始贡献。由于系统集成了 `Launchpad`，用户无需再次提交他们的翻译即可将其包含在\
  \ Ubuntu 中——项目已经拥有了它们。在 `Rosetta` 中提交并批准后，新翻译会自动推送到使用相应语言的 Ubuntu 用户。\n\n### 提示：翻译\n\
  \n翻译可以在 [`translations.launchpad.net`](https://translations.launchpad.net)找到。\n\n\
  ## Launchpad 错误\n\n`Launchpad Bugs`（图 9-14）是一个基于 Web 的错误系统，类似于 Mozilla 项目的 `Bugzilla`，某些用户可能熟悉它。它提供了一个位置，让用户可以通过易于使用的软件（如\
  \ `Apport`）、使用命令行工具 `ubuntu-bug` 或通过 Web 报告他们在 Ubuntu 环境中发现的错误。\n\n![Image](img/00125.jpeg)\n\
  \n**图 9-14** Launchpad 中的 Ubuntu 错误\n\n`Launchpad Bugs` 的第一个角色是为用户提供提交错误的地方。不过，`Launchpad\
  \ Bugs` 不仅仅是收集投诉的方式。它的工作是跟踪并记录错误越整个生命周期，从报告到关闭。错误可以分配给特定的开发者或重新分配。如果该错误实际上是另一个应用程序的结果，则可以重新分配给另一个包。错误可以根据严重程度进行评分，或以任何有用的方式进行标记和分类。修复错误的信息、文件和补丁可以上传到\
  \ `Launchpad Bugs`。当错误解决后，可以将其关闭。错误报告提供单一场所，用于从错误提交者、错误修复者、必要时的上游维护者以及任何其他参与方那里收集信息。\n\
  \n\n\n\n\n当然，这一切正是你对任何实用的现代 bug 跟踪系统的预期。而 Launchpad Bugs 与其竞争对手的区别之处，在于它与 Launchpad\
  \ 的集成，以及通过单个 bug 报告跟踪多个软件的能力。首先，最重要的是，这意味着 Launchpad Bugs 的用户可以跟踪 bug 与特定补丁或特定代码相关的状态。由于\
  \ Ubuntu 对*每一个*版本都提供期九个月的支持，而某些版本（如 Ubuntu 16.04 LTS）支持时间更长，因此 Ubuntu 能够追踪哪些 bug\
  \ 出现在哪些版本中至关重要。由于 Ubuntu 的衍生版本是在 Launchpad 中创建的，Launchpad Bugs 还允许这些衍生版本使用 Launchpad\
  \ Bugs 来查看提交给 Ubuntu 或其他发行版的 bug 是否适用于它们的代码，如果是，则可以快速获取修复。\n\n与 Rosetta 一样，Launchpad\
  \ 声誉（karma）可以通过随着时间的修复、报告和与 bug 的交互来积累。关闭无法复现的 bug 和合并重复 bug 的 bug 分类是用户积累声誉的一种方式。当然，仅仅运行开发者版本并提交新\
  \ bug 是另一种积累良好声誉极极方法。\n\n***\n\n**提示：Bug**\n\n可以在 [`bugs.launchpad.net/ubuntu`](https://bugs.launchpad.net/ubuntu)\
  \ 找到 Bug。\n\n***\n\n### Launchpad Blueprint 跟踪器\n\nLaunchpad Blueprint Tracker (图\
  \ 9-15)，或 Blueprints，是 Ubuntu 的自定义规范和特性跟踪系统。Blueprints 提供了一种方法，让用户为其希望 Ubuntu 中看到的功能创建规范页面，并将其链接到现有的\
  \ Ubuntu wiki 中。其他相关方可以使用 Blueprints 订阅他们感兴趣的规范或提案，以协作进行规范的开发并跟踪进度。随着时间的推移，在 wiki\
  \ 和 Blueprints 中工作的用户通过一个过程帮助新想法——这个过程从“头脑风暴”（对想法和脑暴的非常粗略收集）开始，结束于功能的实现。在 Ubuntu\
  \ 中，这一过程涉及 (1) 社区和信任成员的审查，以及 (2) 决策者和 Ubuntu 技术委员会，或适当的团队负责人和委员会的批准。Blueprint 提供了技术来支持这一过程，并确保任何重要内容都不会丢失。\n\
  \n![Image](img/00126.jpeg)\n\n**图 9-15** Launchpad Blueprint 跟踪器\n\n特别地，Blueprints\
  \ 帮助 Ubuntu 的领导者决策者优先考虑特性和规范，并确保必要特性的工作正在进行，以按时完成发布。因此，Blueprint 被用作 Ubuntu 主要规范跟踪器和主要的发布管理工具。\n\
  \n虽然 Blueprints 对技术规范非常有用，但它也被广泛用于开发和跟踪社区相关的提案，以及从脑暴阶段到实现。Blueprints 还针对冲刺和会议设计的功能，有助于组织会议并协调小组以推进规范。作为最后的小知识，有趣的是，Blueprints\
  \ 很大程度上是由 Ubuntu 创始人兼金融家 Mark Shuttleworth 本人写的！\n\n***\n\n**提示：Blueprints**\n\n\
  可以在 [`blueprints.launchpad.net`](https://blueprints.launchpad.net) 找到 Blueprints。\n\
  \n***\n\n### 其他功能\n\n除了讨论的 Launchpad 内可见旗舰产品外，Launchpad 还有许多其他重要用途。Launchpad 与 Ubuntu\
  \ One 集成，存储用户名以及对参与社区有价值的重要信息，包括 GNU Privacy Guard 加密密钥、联系信息等。更重要的是，Launchpad 包含了\
  \ Ubuntu 内部每个团队和小组的表示，并处理整个 Ubuntu 世界的权限。例如，仅允许向 Ubuntu 上传核心包的人是 Launchpad 中 Ubuntu\
  \ 核心开发者团队的成员。\n\n### Bazaar\n\nBazaar (图 9-16) 是一个分布式版本控制系统。这到底意味着什么？首先，版本控制系统是一个跟踪程序源代码如何变化的程序。它跟踪每个特定更改（例如添加了一段新代码）以及是谁进行了该更改。它还允许开发者回滚到之前的版本，或者创建一个分支（即一个独立的并行的代码版本），以尝试新想法，而不强制将更改引入到主代码中。\n\
  \n![Image](img/00127.jpeg)\n\n**图 9-16** Bazaar 浏览器（可以从 GNOME 软件中心安装）\n\n关于 Bazaar\
  \ 的第二个关键点是它是*分布式的*，就像流行的版本控制软件 Git 一样。传统的版本控制系统有一个存储代码的地方。只有某些人可以访问该地方并更改那里的代码。分布式版本控制系统的不同之处在于，没有单一的代码存储地。开发者工作的每个分支都被认为是平等的，并且它们相互获取代码。这个系统非常像巴集（bazaar）中的许多平等商人——因此得名。\n\
  \nBazaar 起始是 Arch 分布式版本控制系统的分支（fork）。（分支意味着开发者对程序的未来去向产生分歧，他们分成不同的小组以实现各自小组不同的目标。）然而，Bazaar\
  \ 2 被完全重写了，因为发现当时的代码在长期来看无法运行。\n\n***\n\n**提示：Bazaar**\n\n可以在 [`bazaar.canonical.com`](http://bazaar.canonical.com)\
  \ 找到 Bazaar。\n\n***\n\n### Ubuntu One\n\nUbuntu One 是单点登录服务。Ubuntu One 账户用于处理整个\
  \ Ubuntu 社区服务的身份验证，包括 wiki 和 Launchpad。\n\n### 总结\n\n除了构建一个许多人使用的优秀操作系统外，Ubuntu\
  \ 项目还开发了一个构建操作系统的人用来作为基础的操作系统。这以内部项目和外部发行版的形式出现。这些跨越了语言和大陆。此外，Ubuntu 与 Canonical\
  \ 的其他项目紧密相连：Launchpad 和 Bazaar。Bazaar 提供了一个控制系统，而 Launchpad 则提供了 bug、翻译等的一站式平台。\n\
  \n## 第 10 章：Ubuntu、融合与未来的设备\n\n***\n\n![Image](img/00003.jpeg) 融合愿景\n\n![Image](img/00003.jpeg)\
  \ Unity\n\n![Image](img/00003.jpeg) Ubuntu 设备\n\n![Image](img/00003.jpeg) 物联网及以后\n\
  \n![Image](img/00003.jpeg) Ubuntu 桌面的未来\n\n![Image](img/00003.jpeg) 总结\n\n***\n\n\
  Ubuntu 是一个快速演进的平台。一切始于桌面版。正如我们在第 8 章 中学到的，从 Ubuntu 的第二个版本开始，发布了一个精简的 Ubuntu 版本可以作为服务器使用。随后的几年带来了\
  \ Netbook Remix，让用户首次体验了现在广泛分发为 Unity 的早期版本软件。今天，Ubuntu 生态系统令人兴奋的进展之一是移动设备。手机、平板以及从冰箱到无人机的各种物联网（IoT）设备开始在\
  \ Ubuntu 生态系统中出现。\n\n\n\n\n这些设备由 Ubuntu 软件社区内部的创新驱动，其形式为更先进的包管理器，这些包管理器适用于更小的设备和低功耗格式。该市场的用户他们的期望已经超越了通过\
  \ Linux 软件中心安装软件，这种期望也激发了 Ubuntu 社区内应用商店的发展。引领 Ubuntu 社区走向这一道路的愿景和软件正在快速变化，并正在开辟一个令人兴奋的、由\
  \ Ubuntu 驱动的未来。\n\n## 融合愿景\n\n想象这样一个世界：你的中心化设备就是一部智能手机。不仅如此，你在手机上运行的完全相同的应用程序也可以在冰箱屏幕上运行，并可以加载到你的无人机中。没有由于开发者尚未更新而导致落后的不同设备特殊版本；相反，所有的设备上都使用同一个应用程序。现在，想象一下这个系统是完全开源的，并以\
  \ Ubuntu 为内核运行。\n\n如今，我们的移动设备内部已经非常强大。例如，考虑 2015 年底推出的 `Nexus 5x`。这台 5 英手持智能手机拥有\
  \ `2GB` 的 `RAM` 和四核处理器。许多笔记本电脑的配置与之相似甚至更低。此外，人们越来越普遍地依赖智能手机作为唯一的计算设备，使用手机相对较小的界面处理电子邮件、在社交媒体上与朋友保持联系并阅读最新新闻。我们的手机正在成为电脑的替代品，Ubuntu\
  \ 社区认为我们应该努力充分发挥它们的潜力。\n\n考虑到这一点，手机和平板电脑的最终概念寻求提供一种既能真正利用手机力量，又能为我们提供桌面级计算的屏幕和输入设备的设备。这种将两种形式融合的理念被称为“融合”（convergence）。通过融合，你可以将设备连接到显示器、键盘和鼠标，并获得由手机驱动的完整\
  \ Ubuntu 桌面体验。开会迟到了？摆脱所有这些电缆的束缚，在移动中继续编辑你的文档。更进一步，你可能会想象将相同的应用程序放置在物联网设备上，这样你就可以将应用程序扩展到传统计算环境之外。\n\
  \n### Unity\n\nUnity 既是一个图形外壳，也是一个吸引人的想法。正如 Ubuntu 在手机和平板电脑上的前景一样，你可能会开始好奇我们称称为\
  \ Ubuntu 的东西是否真的可以用于从桌面电脑、服务器到手机、平板电脑、家电器、无人机等所有设备。设备本身只是我们在桌面上已经享有的内容的演变，但它们的代码库在许多方面已经进化变得非常不同。智能手机和平板电脑使用\
  \ Canonical 开发的名为 `Mir` 的新显示管理器，而桌面上的 `16.04` Ubuntu 版本继续使用 `Xorg`。Unity 的版本也不同，`16.04`\
  \ 运行被称为 `Unity 7` 的版本，而手机和平板电脑则使用 `Unity 8`，它需要 `Mir` 显示管理器。\n\n操作系统本身以及这些设备上的应用程序处理方式也不同。Ubuntu\
  \ 手机和平板电脑的早期版本是用 `Click` 包构建的，这是 Debian 包的简化版本，专门用于手机并通过应用商店可用。正如本章稍后描述的，这些包很快将由\
  \ `Snaps` 带来的创新所取代。\n\n为这些版本的 Unity 带来统一，并为所有计算机和设备提供一个整合平台，是一项正在进行的努力。目前，人们正在推动\
  \ Ubuntu 桌面默认配备 `Mir` 和 `Unity 8`。目前，`16.04` 是第一个让我们能看到 `Snaps` 在 Ubuntu 桌面上如何工作的\
  \ Ubuntu 版本。\n\n### Ubuntu 设备\n\n个人电脑和服务器并不是运行 Ubuntu 的唯一设备。在 `2013` 年，第一手机 Ubuntu\
  \ 手机发布；从那时起，引入了各种运行 Ubuntu 的设备。这些基于 Ubuntu 的设备范围涵盖从最近在物联网会议上展示的智能冰箱，到一种帮助将你的房子变成“智能家居”的人工智能设备。\n\
  \n### 第一代 Ubuntu 手机和平板电脑\n\n在 `2013` 年初，宣布 Ubuntu 将为智能手机提供一种操作系统。最初，支持三款设备：`Galaxy\
  \ Nexus`、`Nexus 4` 和 `Nexus 7` (2012)。所有这些设备出厂时都预装了 Android 操作系统，因此当时被称为 `Ubuntu\
  \ Touch` 的软件可供下载并刷入这些设备中。\n\n该软件提供的重大创新是，它能够使用标准的 Ubuntu 工具解决更新数以万台移动设备的问题，否则将需要使用\
  \ `apt` 逐个更新设备。Ubuntu 开发者为 Ubuntu 创建了一个使用只读系统快照镜像的框架，这些镜像由于在测试时是经过测试的，因此在发货之前可以进行验证。然后可以使用\
  \ `Click` 包格式进行原子化更新，该格式为应用程序提供了沙箱机制，并与只读基础系统协同工作。这一过程导致了在测试硬件上实现了不可破坏的更新、更小的更新、更好的安全性，以及由于隔离性为单个应用程序提供了更多自由。这种从\
  \ `Clicks` 到 `Snappy` 的打包方式演变将在本章稍后部分详细讨论。\n\n自从这些第一个镜像发布以来，Ubuntu 社区一直致力于为其他设备提供镜像，例如\
  \ `Nexus 5` 和 `OnePlus One`。自然，由 Canonical 维护、构建和托管镜像的“官方支持”设备列表随着时间的推移发生了变化。第三方也提供了越来越多的镜像；这些“社区镜像”通常由那些希望看到市场上能够支持更多设备的各方所托管和开发。社区镜像可以由任何人制作——从制造商到社区成员。但是，请注意，这些社区镜像可能无法在设备上提供所有的\
  \ Ubuntu 功能。移植工作需要时间和精力，因此开发者可能一次只处理一小功能集。\n\n### Ubuntu Edge\n\n众筹是一种世界各地的人通过向某个项目捐赠一定金额来支持它的现象。诸如\
  \ `Kickstarter` 和 `Indiegogo` 等网站是众筹的论坛，允许申请者设定资金目标，然后根据捐赠金额对慷慨的捐赠者进行奖励。\n\n在 Ubuntu\
  \ 移动操作系统发布后不久，Canonical 启动了一个众筹项目，制造一个超越当时行业标准的设备：`Ubuntu Edge`。这手机手机预计拥有最快的多核处理器、`4GB`\
  \ 的 `RAM`、128GB 的存储、`Sapphire` 水晶屏以及启动 `Ubuntu` 和 `Android` 的能力。当人们打开 `Indiegogo`\
  \ 页面查看并向该项目捐赠时，他们被一个有趣的事实震惊了：为了活动成功并生产设备，爱好者必须在一个月内筹集 3200 万美元。`Ubuntu Edge` 的单价为\
  \ 695 美元，它有望成为改变移动行业的手机。\n\n\n\n\n最终，Ubuntu Edge 项目未能实现其筹款目标，仅收集了 1280 万美元的承诺。尽管这一金额令人印象深刻（也是众筹的纪录），但不足以启动该项目。最终，所有捐款都退还给了捐赠者。尽管失败了，但这次令人兴奋的活动为即将推出的手持设备设定了极高的标杆，并为\
  \ Ubuntu 社区带来了真实的兴奋。显而易见，市场对像 Ubuntu Edge 这样的设备存在强烈需求。\n\n## 商用手机和平板电脑\n\n尽管 Ubuntu\
  \ Edge 活动未能获得足够的资金，但这一尝试产生的热度以及概述的先进规格吸引了供应商的兴趣。随着移动设备竞争的白热化，Ubuntu 显然已准备成为该市场的关键参与。人们继续询问何时能买到预装\
  \ Ubuntu 的设备。在幕后，Canonical 正与设备制造商合作将产品推向市场。很快，传言开始流出两家公司将生产这些手机：`BQ`（总部位于西班牙）和\
  \ `Meizu`（位于中国）。\n\nUbuntu 手机旅程的下一步发生在 Ubuntu 社区的一小小组被邀请加入一个名为 `Ubuntu Insiders`\
  \ 的封闭社区，其成员将首获 Ubuntu 手机的动态。2015 年 2 月，在伦敦举行的一场仅限 Insiders 的活动上，发布了第一款 Ubuntu 设备：`Aquaris\
  \ E4.5 Ubuntu Edition`。随后，`Meizu MX4 Ubuntu Edition` 也发布了。这两个设备都预装了 Ubuntu，且硬件开箱即用。2015\
  \ 年晚些时候，发布了 `Aquarius E5 Ubuntu Edition` `图 10-1`。所有早期商业设备在网络支持方面都有一些限制，因为这些手机最初设计仅在特定地区运行。\n\
  \n![Image](img/00128.jpeg)\n\n**图 10-1** Aquaris E5 Ubuntu Edition\n\n2016 年，发布公告持续不断。2016\
  \ 年初发布的 `Meizu Pro 5` 提供了当时迄为止屏幕最大、内存最多的 Ubuntu 手机，并具备全球覆盖能力。\n\n最后，第一款 Ubuntu 平板电脑宣布：`Aquaris\
  \ M10 Ubuntu Edition` `图 10-2`。除了是一个平板电脑，这台 10.1 英角的 `BQ` 设备还实现了一个重要的里程碑：它是首个开箱即用全融合功能的商业\
  \ Ubuntu 设备。你可以将 `Aquaris M10` 连接到蓝牙鼠标键盘以及显示器，以实现完整的桌面体验。与 2016 年之前其他设备提供的某些融合预览相比，`Aquaris\
  \ M10` 在你首次开启时就能提供融合功能——这是此前任何商业设备都未实现的成就。\n\n![Image](img/00129.jpeg)\n\n**图 10-2**\
  \ Aquaris M10 Ubuntu Edition，与蓝牙键盘和鼠标融合\n\n近未来无疑将带来更多围绕手机、平板电脑及其向融合转型的创新。要获取最新消息并了解当前设备，请访问\
  \ [www.ubuntu.com/phone](http://www.ubuntu.com/phone) 和 [www.ubuntu.com/tablet](http://www.ubuntu.com/tablet)。\n\
  \n## 物联网及以后\n\n如今在我们的生活中无处不在的技术已经迅速演进。智能手表追踪我们的步数和心率并与朋友分享，智能灯泡可以通过手机控制开启、关闭或调光，智能恒温器可以从居民的典型行为中学习，以及许多其他创新丰富了我们的生活。我们不断被技术包围，并且对这种技术与我们的生活方式连接的渴望日益增长。我们希望灯泡在我们进入房子时亮起，恒温器在无人在家时节省能量。我们设想这样一个世界：家电之间共享信息，以学习用户如何与它们交互。\n\
  \n使用 Ubuntu 实现这一愿景的第一步是开发一个非常轻量化的版本，尽管体积很小，但仍然提供与普通镜像相同的强大。`Ubuntu Core` 是一个仅安装系统运行所需组件的极简版本，是进入该领域的首次尝试。如今支持这种精简镜像的技术由\
  \ `Snaps` 驱动。`Snaps` 可以被看作如今运行在手机和平板上的 Ubuntu 版本上使用的 `Click` 包的下一次演进。\n\n`Snaps`\
  \ 的行为与自项目开始以来用于构建 Ubuntu 的传统 Debian 包不同。它不是一组解压后安装的包文件文件，而是 `Snap` 包本质上是挂载到文件系统上的。然后\
  \ `Snaps` 拥有一个用于用户数据的可写空间，该空间通过应用安全配置文件进行限制。`Snaps` 还自带运行所需的所有内容，而不是调用外部库来获取资源。应用程序的独立\
  \ `Snaps` 不会操作 `Snappy Ubuntu Core` 操作系统——值得说明的是，它本身也是一个 `Snap`！通过这种隔离以及逻辑分离、`AppArmor`\
  \ 配置文件、`seccomp` 和内核命名空间（kernel namespaces）的结合，这种安排在操作系统和应用程序之间建立了安全的屏障。尽管如此，`Snaps`\
  \ 完全隔离；一系列接口允许它们通信、共享特定定义的资源并访问特定的硬件。在所得生态系统中，为 `Snappy Ubuntu Core`制作包比创建传统的 Debian\
  \ 包要容易得多。事实上，使用名为 `Snapcraft` 的工具，可以在几分钟内从现有软件制作包。因此，现在创建以 Ubuntu 为核心的家电和设备变得容易得多。\n\
  \n### 主要设备\n\n在 `Snappy Ubuntu Core` 仍在积极开发的同时，Ubuntu 社区的许多成员开始对最基础的精简 Ubuntu 安装进行创作。到为止，依赖这些轻量化版本的设备已经无人机、机器人、玩具和家电。\n\
  \n无人机近年来变得非常流行。无论用户是美国的执法机构在无人机安装摄像头以判断何时介入人群控制，还是东南亚的邮政部门尝试将包裹递送到附近的岛屿，无人机的各种用途在全球范围内出现。爱好者的使用也在增加，以各种方式利用这种技术，从以前无法到达的角度录制视频，到向邻居传递信息。\n\
  \nUbuntu 无人机正跟上这一演进。西班牙的 `Erle Robotics` 首次宣布基于 `Ubuntu Core` 的商业无人机（需要用户组装）。中国公司\
  \ `DJI` 推出了 `Manifold`，这是一个基于 Ubuntu 的平台，用户可以在 `DJI` 的开发者无人机平台的基础上构建自己的应用程序。法国公司\
  \ `UAVIA` 展示了遥控 Ubuntu 无人机，用于检查和监控。\n\n\n\n\n# 冰箱及其他\n\n在家庭领域，家电器已迅速拥抱了 Ubuntu。通用电气电器（GE\
  \ Appliances）的一个部门开发了 `ChillHub`，这是一种运行在 Ubuntu 上的智能冰箱。对于来自大公司的此类产品，其开发过程相当开放，因此甚至可以通过\
  \ `USB` 对该设备的功能进行修改和扩展。例如，你可能想构建一个牛奶瓶称重传感器的扩展程序。当该传感器激活时，你的冰箱可以在牛奶不足时向你发出警告。\n\n\
  配备 Ubuntu 的冰箱在商业上的可用性为扩展此类家电器的功能开启了大量机会。这仅仅是一个开始——想象一下接下来还会出现什么！\n\n# 机器人\n\n当你听到“机器人”这个词时，你可能会想象一个小型的人形机器，或者是一条机械化的装配线。更通俗地说，如今在许多场所都能找到机器人。从手术、采矿到军事行动，机器人正越来越多地承担着人类执行起来既不如人意又危险的工作。\n\
  \n自然地，机器人必须运行软件——而这正是 Ubuntu 发挥用场的地方。2015 年发布的首个公开展示的基于 Ubuntu 的机器人是 `Erle Spider`。这种步行玩具运行在带有\
  \ `Snappy Ubuntu Core` 的 `ARM-based` 硬件板上，并由摇杆控制。该玩具是开源的，因此你可以为它构建自己的应用程序。未来，也许我们能看到它产生一些有趣的成果。\n\
  \n### 提示\n\n最初，`Erle Spider` 设计为有八条腿——这就是它名字的来源。由于技术限制，腿的数量最终被减少到六条，但名字已经定下了。所以，如果你在野外看到一只六条腿的蜘蛛，你可以放心它是\
  \ Ubuntu 蜘蛛。\n\n另一个早期设备是 `Mycroft`（图 10-3），这是一个人工智能设备，旨在连接到你所有的其他电器并让你的生活更轻松。它从简单的报告任务开始，如提供天气、提醒或闹钟，也可以将你的恒温器设置为特定温度或调暗灯光。`Mycroft`\
  \ 项目是通过众筹的（就像 `Ubuntu Edge` 一样），但实现了目标（不像那个命运不幸的 `Ubuntu Edge`）。基于 `Snappy Ubuntu\
  \ Core`，`Mycroft` 展示了我们希望看到的物联网工作方式——即一个设备通过互联网连接到其他设备，帮助你处理日常事务。\n\n![图像](img/00130.jpeg)\n\
  \n**图 10-3** 基于 `Snappy Ubuntu Core` 的 `Mycroft` 设备\n\n随着这类基于 Ubuntu 的设备继续进入市场，且开发者考虑将\
  \ `Snappy Ubuntu Core` 作为基础时，值得注意的是，使用 `Snappy Ubuntu Core` 的设备主要优势之一是所有设备都使用相同的操作系统镜像。每当\
  \ Canonical 发布新版本的操作系统时，这些设备中的任何一个都可以更新以使用它。鉴于近期关于安全漏洞的新闻，以及在野外泛滥的过时且不安全的 IoT 设备，这种一致性对于任何寻求安全开发和运行设备的人来说都是一项宝贵的资产。\n\
  \n### 云端\n\n`Snappy Ubuntu Core` 也适用于运行在云端的服务器。它专注于容器，其精简的初始镜像和事务性更新（transactional\
  \ updates）为这些非本地资源提供了补充解决方案。云服务器往往是瞬态的，很容易被相同的服务器替换，并根据需要随时扩展或缩小。`Snappy Ubuntu\
  \ Core` 的小体积非常适合这种环境，并有可能让基于这些云镜像的自动化变得更加简单。差异风格（diff-style）方法依赖于包的增量更新而不是完整下载包，也有助于提高部署更新的速度。\n\
  \n安全在云端也起着重要作用。鉴于创建 `Snaps` 非常简单，第三方可以轻松地自己制作包并及时更新这些包。因此，他们不需要依赖雇佣或在社区中找到的熟练 `Debian`\
  \ 打包员来为他们工作；相反，第三方可以自己处理这些任务。由于主存储库是唯一受到 `Ubuntu Security Team` 正式支持的，我们展望一个未来：用户不太可能使用\
  \ `Universe` 仓库及其他包含的旧版本软件，而除此之外，由于提供该包变得太困难，这些软件可能没有安全修复。如果 `Snaps` 的实现按照目前的路线继续，那么就可以确保应用程序之间实现重大的隔离，从而避免出现操作系统的问题。然而，这种保护是以包体积变大为代价的：库不是共享的，而是捆绑在一起。此外，这意味着应用程序不再需要使用仓库中的库版本。最后，`Snaps`\
  \ 体现了“已知状态”的概念，因为它们很大程度上是只读的。反之，很容易判断你的系统是否被篡改。毫无疑问，审计工具将在不久后开始出现，以协助做出判断。\n\n##\
  \ Ubuntu 桌面的未来\n\n鉴于使用 `Snaps` 而非 `Debian` 包的设备泛滥，你可能会好奇 `Snaps` 何时以及是否会来到你的桌面。正如本章节之前提到的，16.04\
  \ 版本是第一个提供这种收敛如何运作的预览的版本。16.04 Ubuntu 版本继续支持在基于 `Debian-based` 包构建的桌面和服务器上运行 Ubuntu，但也专门为系统预留了部分（“维度”）用于\
  \ `Snaps`。因此，在本文讨论的设备中看到的相同安全性，以只读系统镜像和沙箱化 `Snaps` 应用的形式出现在桌面上。这些 `Snaps`可以通过 `GNOME\
  \ 软件中心进行安装，该中心已经为了支持它们进行了配置。`Snaps` 目前尚未成为 Ubuntu 桌面操作的核心，但对于那些频繁更新且打包耗费大量时间的应用程序来说，它们可能是一个很好的解决方案。时间将证明哪些类型的应用程序将成为\
  \ `Snaps`，哪些将留在传统的 `Debian` 仓库中。展望未来，愿景是拥有一个类似于 `Snappy Ubuntu` 的版本，其构建重点是在整个系统范围内使用\
  \ `Snaps`。\n\n### 注意\n\n对于那些对围绕 `Snaps` 的这些创新感到担忧的人来说，请放心：我们没有停止提供传统的 `Debian-based`\
  \ Ubuntu 桌面。\n\n### 总结\n\nUbuntu 不再局限于桌面、笔记本电脑和服务器的范围：Ubuntu 驱动的设备开始进入我们生活的每一个角落。智能手机是我们每天做的许多事情的核心，基于\
  \ Ubuntu 的手机多次受成功的商业发布证明了基于 Ubuntu 的手机取得了巨大的进展。\n\n\n\n\n\n`Community`（社区）是讨论 Ubuntu\
  \ 时经常使用的一个词。早期关于 Ubuntu 的文章带有这样一个副标题：“在使用系统时，想要一些社区支持吗？”该项目最早的发布稿和公报强调了操作系统开发和分发中的“社区驱动方法”。事实上，Ubuntu\
  \ 最高层级的治理委员会被称为 `Community Council`（社区委员会）和 `Canonical, Ltd.`，并且他们聘佣了一支全职的社区团队。正为了这一目标，我们做出了一个非常有意识的决定，用书中的一整章节来描述\
  \ Ubuntu 社区。事实上，每一个版本都专门介绍过 Ubuntu 社区！\n\n尽管如此，虽然 Ubuntu 社区很重要，但并不总是易于简洁地描述它。Ubuntu\
  \ 在很大程度上是由 `Canonical` 开发和资助的。从定义上说，社区的范围远超 `Canonical`。Ubuntu 项目拥有 `Members`（成员）和自封的活动分子，但\
  \ Ubuntu 社区甚至超过了那些具有明确声明关系的人。该项目包含了多种参与场所。但虽然社区在这些每个领域都是活跃的，但它的范围更为广阔。\n\nUbuntu\
  \ 社区是由许多个人组成的，他们以万种方式和在各种场所构建、推广、分发、支持、文档、翻译和倡导 Ubuntu。Ubuntu 社区的大多数人从未见过、交过或听过彼此。社区成员通过他们的贡献（包括技术和非技术）以及\
  \ Ubuntu 本身联系在一起。这些贡献将 Ubuntu 造成了一个发行版、一场社会运动、一套支持基础设施以及一个项目。简而言之，他们*作为一个社区*构建了\
  \ Ubuntu。虽然任何活跃的软件开发项目都有许多人做出贡献，但并非每个项目都有社区。\n\n`Community` 也是一个代表 Ubuntu 项目保持包容承诺的术语。对社区的关注意味着志愿者不仅受到欢迎，而且是必不可少的。这意味着\
  \ Ubuntu 是一个“地方”，个人可以在这里聚集在一起，创造出比部分之和伟大的东西。`community` 这个词暗示了一个事实：尽管许多开发工作由 `Canonical`\
  \ 付费，尽管某些人比其他人投入了更多的时间、精力、代码、翻译、文档或倡导工作到 Ubuntu，但没有任何个人或子小组可以对 Ubuntu 所取得的所有成就占据功劳。在\
  \ Ubuntu 中，没有任何一项贡献是可以被弃的。拥有社区也反映了 Ubuntu 的目标，即为这些贡献提供低门槛。任何关心 Ubuntu 的人都可以为项目做出贡献，并可以以任何最合适的方式成为\
  \ Ubuntu 社区的参与者。\n\n本章提供了 Ubuntu 社区活跃的场所和流程的概述。首先，它将了 Ubuntu 社区既消费又交流信息的场所。接着介绍了社区的组织方式以及该组织运作的过程。最后，它将向你介绍*你*可以参与\
  \ Ubuntu 社区并对其成功做出贡献的方法。\n\n### 场所与活动\n\n正如我们在第 1 章中所描述的，透明公开的沟通是 Ubuntu 项目的早期目标。技术和社区决策都是公开做出的，所有利益方都可以访问。当这不可能时（例如，当面对面会议且*所有*相关人员无法出席时），社区会尝试发布摘要和纪要，并提供反馈渠道。Ubuntu\
  \ 社区不包含任何除个人隐私或安全之外的“仅限成员”、“仅限开发者”或“仅限决策者”的私下通道。Ubuntu 中的所有工作都发生在*每个人*都可以查看工作的地方，任何同意以建设性和尊重的方式参与的人都可以加入。\n\
  \n当然，这种活动仅对那些知道去哪里寻找它的人公开。本节试图尽可能完整地记录 Ubuntu 中的通信场所。它描述了进行开发、支持和倡导讨论的地点。虽然没有人能参与在所描述的*所有*场所中进行交流，但了解存在哪些场所可以让参与者在需要选择合适的地点提问或提出建议时，拥有更充分的信息。\n\
  \n### Ubuntu 社区网站\n\nUbuntu 社区网站（[`community.ubuntu.com`](http://community.ubuntu.com)）是学习\
  \ Ubuntu 社区的主要门户。该网站提供了链接，解释了你可以如何为项目的各个部分做出贡献。协作领域包括社区正在参与的当前计划，例如 `Google Summer\
  \ of Code`。该网站共享了你可以参与的特定领域的细节，如 `Documentation`（文档）和 `Translations`（翻译）。\n\n该网站还提供了社区结构的概述，解释了治理结构以及委员会和董事会。最后，该网站为\
  \ Ubuntu 用户提供了支持和文档选项的概述。\n\n### 邮件列表\n\nUbuntu 中唯一最重要的沟通场所是 Ubuntu 邮件列表。这些列表提供了发布所有重要公告和进行开发讨论的空间。在本书时，已有\
  \ 300 多个活跃的公共邮件列表。这个数字正在不断增长。然而，`Ubuntu Community Council` 采取了非常小心的态度，以确保列表在社区持续增长的同时保持更新。\n\
  \n最新的 Ubuntu 完整邮件列表页面可以在 [`lists.ubuntu.com`](https://lists.ubuntu.com) 找到，用户可以在那里查看可用邮件列表列表、查看存档讨论并通过\
  \ Web 界面订阅列表。\n\n列表是电子邮件通信的最古老形式之一。邮件列表提供单一电子邮件地址，当向该地址发送邮件时，它会将收到的消息转发给许多人。在 Ubuntu\
  \ 中，列表是按主题划分的，个人如果想接收列表主题的信息，可以订阅邮件列表。Ubuntu 的邮件列表都托管在 [`lists.ubuntu.com`](http://lists.ubuntu.com)。\n\
  \n除少数例外外（例如，`Community Council` 的邮件列表），*任何人*都可以订阅任何 Ubuntu 列表。在大多数情况下，向列表发送电子邮件的能力仅限于列表成员（当然，列表成员对任何人开放）。这意味着所有从非列表成员发送到列表的电子邮件都将进入队列，由人工审核员进行审核，然后广播给列表成员。这是一种反垃圾邮件的措施。用户可以订阅列表，然后配置系统不发送电子邮件。对于几个邮件列表，*所有*消息都经过审核。这在很大程度上是为了确保列表保持“低容量”或“仅公告”。\n\
  \nUbuntu 的邮件列表由流行的 `Mailman` 软件运行，某些用户可能对其熟悉。`Mailman` 使用户能够简单地订阅列表、退订并配置有关邮件交付的任何选项。一个受欢迎的选项是接收信息的每日摘要，而不是在每次发送新消息时都接收一封单独的电子邮件。这些可以通过\
  \ [`lists.ubuntu.com`](https://lists.ubuntu.com) 的 Web 界面实现。用户也可以通过通过发送主题包含“subscribe”字样的电子邮件到\
  \ `<邮件列表名称>*-REQUEST@lists.ubuntu.com 来订阅列表。\n\n\n\n\n\n虽然每个列表在 Ubuntu 社区中都发挥着重要作用，但以下核心列表值得详细介绍。你可能会发现订阅这些列表是一个好主意。\n\
  \n`ubuntu-announce` 这是一个完全人工审核的列表，用于转发 Ubuntu 项目的所有重要公告，通常每周少于一封邮件。它是发布新版本的地方，也是最早获取其他重要信息的地方。如果你使用\
  \ Ubuntu，可能想要订阅此列表。如果你只订阅一个列表，那应该是这一个。\n\n`community-announce` 这是一个完全人工审核的列表，提供普通社区可能认为有价值的公告。公告可能包括关于下一次\
  \ Ubuntu 开发者峰会（Developer Summit）何时举行的细节、如何参与，或即将举行的社区选举详情（例如 Ubuntu 社区委员会选举）。阅读此列表不需要任何技术知识，建议你订阅以跟踪社区活动动态。\n\
  \n`ubuntu-devel-announce` 这是一个完全人工审核的列表，包含与 Ubuntu 开发相关的公告。该列表邮件量较低，每周包含一到三封邮件。如果你在\
  \ Ubuntu 中处理代码、使用开发发行版，或在任何技术层面上做出贡献，你就应该在这个列表中。这是所有参与 Ubuntu 开发的人都应该阅读的列表。\n\n\
  `ubuntu-devel-discuss` 这是一个用于 Ubuntu 开发通用讨论的主要开放列表。如果你正寻求以任何技术方式为 Ubuntu 做出贡献，你应该订阅此列表并开始关注讨论。该列表的邮件量相对较高。\n\
  \n`ubuntu-devel` 这是一个用于 Ubuntu 讨论的人工审核列表。虽然订阅仍然免费，但在列表中发帖的权限限于 Ubuntu 开发者或受选的其他开发者。其他人也可以发布，但所有帖子都会经过审核团队的检查。\n\
  \n## 互联网时接聊天 (IRC)\n\n虽然邮件列表提供了异步通信（即不同同时进行）的主要场所，但对同步（或实时）协作仍有重要需求。互联网时接聊天（IRC）填补了这一空白。虽然它初初主要是为频道中的群组（即多对多）通信设计的，但它也配备了私信功能，可以方便一对一的通信——且都是瞬时完成。IRC\
  \ 与即时消息或聊天室通信非常相似。虽然时差和全球分布使得全球 Ubuntu 社区很难在同一时间聚会，但许多用户和开发者利用 IRC 的功能，让任何人都能实时讨论问题，或提问并立即得到回答。\n\
  \n与邮件列表一样，IRC 频道为 Ubuntu 中许多不同子社区的许多类型通信提供了场所。有许多不同的频道，包括各种语言的频道。\n\n所有的官方 Ubuntu\
  \ IRC 频道都位于 freenode IRC 网络，该网络还托管了一系列其他免费开源软件项目。用户可以使用 Ubuntu 中的几个软件连接到 IRC，包括\
  \ `Empathy`、`Hexchat`（`XChat` 的继任者；图 11-1）、`Irssi`，并且对于不想在机器上使用本地运行 IRC 但想偶尔加入频道的用户，可以使用\
  \ freenode 网页客户端（图 11-2）。如 `ubuntu-users@lists.ubuntu.com` 等邮件列表将帮助用户找到正确的帮助和支持；`#ubuntu`\
  \ 是为帮助和支持设计的。在加入任何频道时，用户应仔细阅读主题（topic），因为那里回答了许多常见问题，频道的管理员可能会对询问管理员已经花时间在频道主题中回答过的问题的用户感到困扰。\n\
  \n![Image](img/00131.jpeg)\n\n**图 11-1** `Hexchat` 是一个 IRC 客户端，允许 Ubuntu 用户连接到 Ubuntu\
  \ IRC 频道。\n\n![Image](img/00132.jpeg)\n\n**图 11-2** freenode 网页客户端的登录界面以及 `freenode.net`\
  \ 上 `#ubuntu-community-team` IRC 频道的视图\n\n目前，`#ubuntu` 频道通常是 freenode 网络上最大的频道，大多数时候有超过\
  \ 1,500 名同时用户，并且仍在持续增长——特别是在发布期间。另一个重要频道是 `#ubuntu-devel`，专门用于讨论 Ubuntu 开发。对开发发行版的支持已移动到\
  \ `#ubuntu+1`。维护具有特定目的频道让支持社区能够保持专注并帮助尽可能的人。完整的频道列表可以在 `https://wiki.ubuntu.com/IRC/ChannelList`找到。\n\
  \n## Web 论坛\n\n官方 Ubuntu 论坛是 Ubuntu 中最频繁使用的通信场所。由于许多原因，许多用户更倾向于通过基于 Web 的论坛或公告板进行通信，而不是邮件列表。Ubuntu\
  \ 论坛创建是为了满足这一群体的需求，并取得了巨大的成功。\n\n论坛可以在 `http://ubuntuforums.org` 在线访问，并显示出惊人的使用量。论坛拥有超过\
  \ 200 万注册用户，在任何时刻约有 5,000 人在线。论坛中讨论的话题涵盖了以下类别：\n\n![Image](img/00002.jpeg) 支持讨论，包括关于特定硬件（例如预装\
  \ Ubuntu 的电脑，或网络卡和多媒体卡）和特定使用用例（例如桌面或服务器用户）提问题的空间。\n\n![Image](img/00002.jpeg) Ubuntu\
  \ 社区讨论，包括为 Ubuntu 艺术工作的人、在科学和教育领域工作的人，以及正在开发新文档和教程的人的空间。\n\n![Image](img/00002.jpeg)\
  \ 论坛特定的社区讨论空间，包括多个社交空间以及行政和社区治理讨论的地方。\n\n通过涵盖这些领域，Ubuntu 论坛提供了令人印象深刻的支持资源。它们为提问和回答问题提供了极佳的场所，也为了获得帮助和为\
  \ Ubuntu 社区做出重要贡献。如果你对其中任何内容感兴趣，论坛是一个很好的起点。\n\n关于论坛唯一值得提到的警告是，它们并不经常被开发 Ubuntu 的人员使用——尽管该规则也有例外。如果用户想参与项目的技术贡献，他们可能需要通过使用邮件列表或\
  \ `Launchpad` 来补充他们在论坛的支持。\n\n论坛完全由志愿者创立、并由他们审核和维护，并由论坛委员会（在本章稍后部分讨论）治理。\n\n###\
  \ Wiki\n\n从几乎第一天起，Ubuntu 的大部分文档和支持都在官方 Ubuntu wiki 中进行。如果你还不知道，`wiki`（发音为“wik-ee”）——一个任何查看者都可以添加、删除或编辑内容的网站。\n\
  \n\n\n\n有几个 Ubuntu wiki，但其中两个对社区至关重要。第一个位于 [`help.ubuntu.com/community`](https://help.ubuntu.com/community)\
  \ 的社区帮助 wiki（图 11-3）。它由 Ubuntu 文档团队编辑和指导，专注于 Ubuntu 社区产出的技术文档问题。第二个 wiki 位于 [`wiki.ubuntu.com`](https://wiki.ubuntu.com)，用于处理其他所有事务。社区帮助\
  \ wiki 可以被视为一个通过社区贡献和编辑来构建详尽手册的项目。通用型 wiki 则用于规范编写、流量记录、会议组织、线下聚会、参与 Ubuntu 的团队和个人的页面，以及任何其他与\
  \ Ubuntu 社区相关的、以书面形式呈现的内容。这两个 wiki 都可以由社区中任何创建账户的成员进行编辑、添加内容或重新组织，且编辑不受限制。由于需要注册，因此每项更改均可以追溯到特定的用户。\n\
  \n![Image](img/00133.jpeg)\n\n**图 11-3** Ubuntu 社区支持与文档 wiki 首页\n\n与随 Ubuntu 附带的其他文档不同，任何人都可以修复\
  \ wiki 中的错误、不准确之处或过时事实。因此，没有一种可靠的方法来确定 wiki 中的信息是否正确。它无法像像本书这样的文档那样经过同样的质量保证工作流。然而，在变化快速的\
  \ Ubuntu 开发世界中（每六个月发布一个新版本），它*更有可能*保持更新。wiki 为这种水平的实时信息提供了一个准入门槛很低的平台，因此成为社区无足珍贵的资源。\n\
  \n## The Fridge（冰箱社区）\n\nThe Fridge ([`fridge.ubuntu.com`](https://fridge.ubuntu.com))\
  \ 是 Ubuntu 一个别奇特的社区门户网站。在许多西方文化中，冰箱是家庭中一种类似“公告板”的中心。因为冰箱具有磁性，孩子和父母可以使用磁铁贴上纸条，与接触到这台冰箱的人群分享信息。对于孩子们来说，这通常包括好成绩、新闻报道或其他让他们感到自豪或想分享的信息。The\
  \ Fridge 试图在 Ubuntu 社区内部创建这样一个共享资源。The Fridge 首页如 图 11-4 所示。\n\n![Image](img/00134.jpeg)\n\
  \n**图 11-4** The Fridge 首页\n\nThe Fridge 最好的描述可能是 Ubuntu 的社区门户网站。它既是新闻网站，也是草根营销和倡导网站。它托管新闻、采访、带有活动列表的日历、投票等。网站的核心内容以博客（Weblog）形式排列。用户经常将\
  \ The Fridge 设置为首页或通过其 RSS 馈订阅该网站。The Fridge 在社区中的独特之处在于，它吸引了各种 Ubuntu 参与者——开发者、倡导者、翻译人员、用户——并提供了一个每个小组都可以与其他分享信息的平台。The\
  \ Fridge 每两到三天就会有一个故事。用户可以在 The Fridge 的评论区对每个故事进行评论和讨论。\n\n任何人都可以向 The Fridge 贡献内容。如果您想贡献，可以将功能建议、文章甚至一件原创作品（如文章、照片或活动评论）发送至\
  \ editor.ubuntu.news@ubuntu.com，或者通过遵循 [`wiki.ubuntu.com/Fridge/Submit`](https://wiki.ubuntu.com/Fridge/Submit)\
  \ 上的任何建议方式进行提交。\n\n### AskUbuntu.com\n\n位于 [`askubuntu.com`](http://askubuntu.com)\
  \ 的 Ask Ubuntu 是一个免费的社区驱动问答网站，旨在让用户能够轻松获取 Ubuntu 相关问题的答案。它也是用户分享 Ubuntu 平台知识的地方。\n\
  \n该网站侧重于由社区投票并由网站其他成员同行评审的答案，这可以保持信息的更新和时效性。\n\nAsk Ubuntu 网站允许用户提问和回答问题，并通过成员身份和积极参与，对问题和答案进行赞成或反对投票，并以\
  \ wiki 的方式编辑问题和答案。\n\n### 社交媒体\n\nFacebook、Twitter 和 Google+ 等社交媒体网站也用于向社区传播信息。\n\
  \nFacebook: [`facebook.com/ubuntux`](http://facebook.com/ubuntux)\n\nTwitter: [`twitter.com/ubuntu`](http://twitter.com/ubuntu)\n\
  \nGoogle+: [`google.com/+Ubuntu`](https://google.com/+Ubuntu)\n\n## 在线峰会与冲刺活动\n\n\
  自 Ubuntu 首次发布以来，Canonical 组织并资助了多次公开开发者峰会和冲刺活动。亮点包括：\n\n![Image](img/00002.jpeg)\
  \ 2004 年 12 月在西班牙加泰罗尼亚的马塔罗举行的 Mataró 会议——首次 Ubuntu 开发峰会\n\n![Image](img/00002.jpeg)\
  \ 2005 年的两场命名的 Ubuntu 会议：4 月在澳大利亚悉尼的 Ubuntu Down Under 和 11 月在加拿大蒙特利尔的 Ubuntu Below\
  \ Zero\n\n![Image](img/00002.jpeg) 2006 年 11 月在加利福尼亚州山景城的 Google 总部举行的 Ubuntu  开发者峰会\n\
  \n![Image](img/00002.jpeg) 2012 年 10 月在丹麦哥本哈根举行的 Ubuntu 开发者峰会 R\n\n随着社区的发展，Ubuntu\
  \ 开发者峰会（UDS）活动越来越难以接待所有想要现场参加的人。2013 年，Ubuntu 开发者峰会转为仅在线活动，通过视频聊天举行。这些新活动被称为 Ubuntu\
  \ 在线峰会（UOS）。\n\n在 Canonical 的支持下，Ubuntu 尝试组织 Ubuntu 在线峰会，使其每个发布周期发生两次。通常第一次发生在发布周期的非常开始，以便讨论、商讨并决定即将发布的规范和目标。第二个\
  \ UOS 则在周期中期举行，以便在发布前对任务进行正式评审并根据需要调整计划。虽然格式每次略有不同，但这些会议持续持续从三天到两周不等。\n\n\n\n\n\n\
  在 UOS（用户运营会议）上，参与者会描述他们希望在下一个 Ubuntu 版本中看到的特性。在安排好的时间或系列会议中，一小组感兴趣的社区贡献者和开发者共同起草一份书面规范。这一起草过程涉及头脑风暴，最终形成一份正式的、经过批准的规范，该规范描述了某个问题或需求，并对如何修复或实现提供了详细说明。虽然这些规范通常具有技术性质，但它们也被用于描述可能与本地化、文档或社区建设有关的目标。例如，“The\
  \ Fridge”以及每届峰会的规划都始于一份规范。随着时间的推移，这些规范将根据即将发布的版本的优先级进行分类。随后，个人将认领或被分配其中的某些规范。每份规范都会作为蓝图在\
  \ `Launchpad` 上进行编写和改进，以便无法参加峰会的 Ubuntu 开发者和贡献者仍能能够地参与其中。\n\n这些峰会还会解决社区内部的问题。例如，许多\
  \ Ubuntu 领导参与其中，讨论如何不仅帮助提升自己的领导能力，还能帮助 Ubuntu 社区的成长。\n\n除了这些峰会，Canonical 每年还会组织多次仅限邀请的面对面冲刺（sprints）。这些冲刺通常是为期一到三周的密集协作工作会议，涉及一个负责明确定义目标的团队或子团队。它们为团队成员提供了时间来编写代码、编写文档、制定计划或完成实现该目标所需的任何工作。冲刺通常参与人数少于\
  \ 100 人，他们试图短时间内挤入大量工作的尝试让他们赢得了精疲力竭、充实、惊人地高效且有趣的体验的声誉。这些冲刺是工作会议，通常仅限于 Canonical\
  \ 员工群体；但有时，它们也可能包括志愿者参与者。\n\n### UbuCons\n\n在线峰会和冲刺是有效的，但主要引起具有技术背景的人士或已经非常活跃于 Ubuntu\
  \ 社区的人的兴趣。他们的目标是通过现有团队之间的高带宽互动来完成工作。被称为 `UbuCons` 的用户会议试图为尚未积极参与社区的用户提供一个替代性空间。这些会议尝试让人们快速跟上\
  \ Ubuntu 的进度，并为社区建设、支持和人脉建立提供空间。\n\n虽然许多本地社区团队有定期会议和他们自己的 Ubuntu 活动，但到目前为止已经举办了几场较大的\
  \ `UbuCons`，并且目前正在计划中还有更多。前两场 `UbuCons` 分别在山景城的 Google 总部纽约市举行，另一些则设计与许多其他 Ubuntu\
  \ 用户参加的大规模 Linux World 大会重合。`UbuCons` 由数百名用户和少数开发者参加，为用户之间彼此联系提供了一种简便的方式。此外，一些 `UbuCons`\
  \ 还为“安装派对”（installfests）提供了空间，用户可以带上电脑，并由其他 Ubuntu 用户、开发者和发烧友在他们的机器上安装 Ubuntu。\n\
  \n任何活跃的 Ubuntu 用户小组都可以计划一次 `UbuCon`，且 `UbuCons` 已在世界各地举行。例如，`UbuCons` 现在与南加利福尼亚\
  \ Linux Expo、俄亥俄 Linux Fest、东南亚 Linux Fest 等活动共同举办。这种依附于大型活动的做法的效果非常好，以至于在 2010\
  \ 年，其他几个组织允许将 `UbuCon` 作为其大型活动的一个较小部分进行组织，这种做法预计在未来将继续。当这些 `UbuCons` 与会议同期举行时，它们的参与度很高，因为\
  \ Ubuntu 用户已经在参加更大的活动了。本地社区团队（`LoCos`，本章稍后介绍）可以负担得组织这些 `UbuCons`，因为场地费用非常低，通常只需要一个赞助商即可涵盖。此类聚会是免费活动，受欢迎的\
  \ Ubuntu 演讲者通常已经参加了较大的活动，并愿意且乐意在日程中加入一些对 `UbuCon` 的参与。\n\n随着向全在线峰会的转型，社区组织的 `UbuCons`\
  \ 变得更加流行了。2016 年，首届 `UbuCon Summit` 在加利福尼亚州帕萨迪纳举行。`UbuCon Summit` 是 `LoCo` 与 Canonical\
  \ 合作的产物，源于过去由加利福尼亚 `LoCo` 举办的现有 `UbuCon`。`UbuCon Summit` 在第一天设有用户轨道和开发者轨道，并在第二天为开发者和其他\
  \ Ubuntu 贡献者举办了一场“无议会议”（unconference）。这是首个在 Canonical 和社区之间拥有强大资金、规划和协作的峰会类型活动，并且拥有了外部赞助商，包括\
  \ `GitHub`、`Dell` 和 `Hewlett-Packard Enterprise`。\n\n虽然会议和峰会是重大技术进展头脑风暴和开发的场所，但它们也是有趣且愉快的体验。它们为用户将名字、IRC\
  \ 昵称和电子邮件地址对应起来提供了场所，并提供了愉快、幽默且高效的互动。\n\n### Planet Ubuntu\n\n想要了解让 Ubuntu 成为如今模样的人团队，博客聚合器\
  \ `Planet Ubuntu` (`http://planet.ubuntu.com`) 是一个极好的起点（`图 11-5`）。博客聚合器本质上是一个博客合集，它从选择将自己的博客添加到系统的\
  \ Ubuntu 成员那里检索最新文章，然后按时间倒序发布单篇博客。尽管 `Planet Ubuntu` 中的大部分内容关于 Ubuntu，但作为通往 Ubuntu\
  \ 成员的窗口，`Planet Ubuntu` 也包含了社区成员个人生活的信息。通过这种方式，`Planet Ubuntu` 为参与者提供了一种在 Ubuntu\
  \ 社区留下印记的好方法，让其他人看到 Ubuntu 社区正在做的事情。\n\n![Image](img/00135.jpeg)\n\n**图 11-5** Planet\
  \ Ubuntu\n\n### 团队、流程与社区治理\n\nUbuntu 著名的黑客格言“粗略共识与运行代码”下运行。该项目试图达成共识、做出良好的技术决策并向前发展。它尝试尽可能减少政治化，并将权力分配给那些最擅长完成工作的人。马克·沙特沃斯（Mark\
  \ Shuttleworth）解释道：“这不是民主，而是精英治国。我们尝试更多地基于共识而非投票来运作。”\n\nUbuntu 网站将其社区治理目标描述为三个：\n\
  \n1. 确保定义了一个流程，允许人们对有关 Ubuntu 社区的决策做出贡献。\n2. 确保关于 Ubuntu 发行版和社区的决策是以公平的方式做出的。\n\
  3. 确保必要的决策被做出，即使社区中没有明确的共识。\n\n\n\n\n\n本着这些目标，Ubuntu 的系统基于将决策权下放到中小型团队。当产生分歧时，这些分歧会在相关团队内部处理。在某些较大的团队中，团队委员会（team\
  \ councils）会以非常结构化的方式处理各种争议解决。当团队无法解决自己的分歧，或者团队之间发生分歧时，问题将提交给管理该社区领域的委员会或董事会，有时根据问题是否具有技术性质，问题可以并可能被升级到`社区委员会`（Community\
  \ Council）或`技术委员会`（Technical Board）。作为项目的资助者和创始人，Shuttleworth 担任`社区委员会`成员，并占据着自封的“终身仁慈独裁者”（SABDFL）的特殊地位。用户可以通过参与团队工作来参与\
  \ Ubuntu 的治理结构，并且作为 Ubuntu 成员和维护者，他们在批准`社区委员会`和`技术委员会`成员方面拥有发言权。\n\n## 团队 (Teams)\n\
  \nUbuntu 的大部分工作委托给一组团队，每个团队负责 Ubuntu 的特定工作领域。重要团队的示例（绝非完整）可能包括论坛、新闻、文档、内核、服务器、笔记本电脑和翻译团队。任何对\
  \ Ubuntu 项目特定方面感兴趣的人都可以加入团队讨论并对其决策做出贡献。\n\n当参与者认为某个领域未得到充分服务时，他们可以在 Ubuntu wiki\
  \ 中起草团队细节来建立一个新团队，并招募贡献者来帮助他们工作。团队应该始终包含多个人的参与。Ubuntu 中没有单人男性或单女性团队。\n\n几个团队规模庞大且重要，以至于他们以团队委员会的形式建立了自己更先进的治理结构。这些委员会要么由`社区委员会`从团队内的活跃成员和领袖中任命，作为`社区委员会`在该团队及其在项目中的领域的代表；要么是完全自律运行的。这些团队委员会定期举行会议，解决冲突，并在每个周期向`社区委员会`报告，在某些情况下甚至代表`社区委员会`授予成员资格。\n\
  \n## Canonical 的 Ubuntu 社区团队 (The Ubuntu Community Team at Canonical)\n\n正如本章开头提到的，Canonical\
  \ 理解并重视 Ubuntu 社区对每个 Ubuntu 版本的成功和增长所起的重要作用。Canonical 的 Ubuntu 社区团队由几位受 Canonical\
  \ 的 Ubuntu 社区经理组成，他们直接负责 Ubuntu 社区的各个领域，包括开发者关系、质量保证和云。\n\n社区团队成员各专注于他们所属的社区领域并与其合作，以帮助教育、鼓励和激发更广泛的参与。这有助于与\
  \ Canonical、上游软件项目、新闻和博客作者以及更广泛的社区建立信任关系，有助于维护一个健康且包容的社区，使其有能力开发、设计并影响 Ubuntu 项目的方向和增长。\n\
  \nUbuntu 社区团队实施了以下参与 Ubuntu 社区的新机会：\n\n### 针对 Ubuntu 开发者社区 (For the Ubuntu Developer\
  \ Community)\n\nUbuntu 打包指南：[`packaging.ubuntu.com/`](http://packaging.ubuntu.com/)\n\
  \nUbuntu 应用开发者网站：[`developer.ubuntu.com`](http://developer.ubuntu.com)\n\nFacebook：[www.facebook.com/ubuntudev](http://www.facebook.com/ubuntudev)\n\
  \nTwitter：[www.twitter.com/ubuntudev](http://www.twitter.com/ubuntudev)\n\nGoogle\
  \ +：[`plus.google.com/u/1/107265043789873157543/posts`](https://plus.google.com/u/1/107265043789873157543/posts)\n\
  \n### 针对云社区 (For the Cloud Community)\n\nUbuntu 云官方网站：[www.ubuntu.com/cloud](http://www.ubuntu.com/cloud)\n\
  \nJuju Charms：[`jujucharms.com/`](https://jujucharms.com/)\n\nTwitter：[www.twitter.com/ubuntucloud](http://www.twitter.com/ubuntucloud)\n\
  \n## 本地社区团队 (Local Community Teams)\n\n本地社区团队在社区中被亲切地称为 `LoCos`，是非常重要的团队类型。每个 `LoCo`\
  \ 负责在特定的地区推广、支持和代表 Ubuntu。这些地区通常是地理性的，并且通常是全国性的，但在某些情况下它们在地理上可能会重叠。Ubuntu 尽可能鼓励\
  \ `LoCos` 合作工作。\n\n`LoCos` 类似于 Linux 用户组 (`LUGs`)，并且经常与 `LUG` 紧密合作或与之相关。`LoCos`\
  \ 经常参与 Ubuntu 地语言的本地化或翻译，并在当地学校、公共管理机构和社区中进行倡导。最好的 `LoCos` 定期举行社交活动、讲座和讨论。通常，他们会举办安装派对（installfests），团队成员帮助新用户在电脑上安装\
  \ Ubuntu。`LoCos` 的代表被要求协助本地化事务，在当地会议和贸易展会上代表 Ubuntu 项目发言，并在此类活动中组织展位或参与。\n\nCanonical\
  \ 有限公司为每个团队提供邮件列表和一个域名（通常格式为 `ubuntu-<CC>.org`，其中 `CC` 是该国家的双字母国家代码）。Canonical 还愿意托管\
  \ `LoCo` 网页、wiki、论坛、博客、下载区域和额外的邮件列表。`LoCos` 欢迎任何人参与。\n\n想寻找你附近的本地社区团队吗？你只需要访问 Ubuntu\
  \ 本地社区团队门户 [`loco.ubuntu.com/`](http://loco.ubuntu.com/)，并从在地图上选择你所在的地区或点击页面顶部的团队标签页开始。任何一种操作都会显示当前的团队列表。\n\
  \n## MOTUs\n\n另一种值得在书中深入描述的特殊类型团队是 `MOTU`。`MOTUs` 是 Ubuntu Universe（宇宙）软件包库的维护者，该缩写幽默地代表“宇宙之主”（Masters\
  \ of the Universe）。`MOTUs` 自称为“努力保持 Ubuntu Universe 部分完良好的勇敢灵魂”。他们是社区成员，投入时间尽可能地维护和支持位于\
  \ Universe 中的软件。\n\n`MOTUs` 是软件包维护者。他们集体维护着归档中的绝大多数软件包。一些由 `MOTUs` 维护良好的软件包随着时间的推移迁移到了主组件，并成为\
  \ Ubuntu 发行版的正式部分。由于 Ubuntu 对 universe 中的软件包不提供支持或质量保证，`MOTU` 团队为维护者提供了一个磨练机会，让他们在进入责任更高的\
  \ main 组件软件包之前（由于错误有时不可避免）犯错。\n\n`MOTUs` 的角色和职责有很多。一些重要的职责是 `MOTUs`\n\n- 理解打包概念并具有丰富的通过维护人上传软件包的经验。\n\
  - 通过上传新软件包和更新 universe 中的现有软件包来应用这些知识。\n- 可以与核心开发者协作进入主组件。\n- 回答其他开发者的问题以扩展他们对打包工作的理解。\n\
  - 为潜在的 Ubuntu 开发者提供技术问题指导。\n\n\n\n\nMOTU 贡献者是那些有兴趣为 Ubuntu 做出贡献，并学习如何打包以及如何在 Ubuntu\
  \ 开发社区中工作的人。他们主要通过将 MOTU 作为其工作的赞助来进行。成为 MOTU 贡献者不需要通过任何要求或考试，只需有学习意愿并遵守《Ubuntu 行为准则》。这些贡献者中的许多人成长为正式的\
  \ MOTU，而许多 MOTU 最终被授予全核心开发者身份。这三步走系统是几乎所有新维护者学习在 Ubuntu 中维护包的过程。\n\n## 社区委员会 (The\
  \ Community Council)\n\n社区委员会（Community Council）和技术委员会（Technical Board）是 Ubuntu\
  \ 内部最高级别的治理结构。社区委员会涉及所有 Ubuntu 成员和活动，可以说它是 Ubuntu 项目中权力最强的团队。社区委员会负责监督项目的社会结构、场所和流程。\n\
  \n社区委员会的日常工作涉及 Ubuntu 的五个主要领域。第一，也是最简单的一点，是维护《Ubuntu 行为准则》。社区委员会是唯一能够批准对准则进行修订的机构。由于社区委员会不会在准则变更时要求每位成员“重新同意”该准则，因此这些修订必须完全符合之前草案的精神。\n\
  \n社区委员会的第二项职责是仲裁无法在特定团队内处理或团队之间产生的纠纷。这些通常是关于《行为准则》的纠纷，可能需要对准则的某部分进行澄清，或者描述某特定行动或行为是否实际上违反了准则的某项。然而，社区委员会的职权范围不仅限于违反行为准则，社区委员会还负责处理任何非技术情况下的纠纷。在大多数情况下，社区委员会不会针对个人采取行动，而是帮助小组成员之间达成一致或共识。如果失败了，社区委员会可以要求维护者或其他社区成员道歉并克制特定行为，或离开社区。委员会承诺，在没有经过实质性审查并给予其辩护机会的情况下，不会要求任何人离开。\n\
  \n委员会工作的第三个领域是协助团队解决在运行过程中可能遇到的任何阻碍（blockers）。这可能包括但不限于：协助获取因贡献者离开而丢失的资源访问权限、消除团队在社区中可能障碍，以及在需要时协助任命新的领导层。为此，社区委员会在每个周期的定期会议期间与社区中的关键团队会，以查看是否能以任何方式为团队提供帮助。\n\
  \n第四，社区委员会最终负责批准和欢迎新成员加入项目，这将在接下来的关于成员身份的小节中进行更详细的描述。\n\n最后，社区委员会负责所有与社区相关的结构和流程。新类型的团队、成员身份要求和核心哲学文档应首先获得社区委员会的批准。希望建议新结构或流程的社区成员向社区委员会提交提议进行讨论和批准。\n\
  \n社区委员会每月在 IRC 上举行两次会议。任何社区参与者都可以提交议题或提议供社区委员会讨论。会议对社区开放，但委员会仅寻求委员会成员的共识或投票——尽管它会咨询提交提议的团队代表和其他社区成员。如果开放会议变得过于嘈杂，委员会保留对频道进行管理的权限，以恢复秩序。社区委员会会议后将发布会议的完整记录。社区委员会的现成员随时可以在\
  \ [`launchpad.net/~communitycouncil`](https://launchpad.net/~communitycouncil) 找到。委员会的任命由\
  \ Shuttleworth 监督，并在所有 Ubuntu 成员中进行最终投票，以从列表中选出候选人。任期为两年。\n\n## 技术委员会 (The Technical\
  \ Board)\n\nUbuntu 技术委员会负责 Ubuntu 项目的技术方向。通过处理所有技术事务，技术委员会作为 Ubuntu 项目治理的最高层级与社区委员会形成互补。特别是，技术委员会负责\
  \ Ubuntu 策略的三个主要领域：包策略、发布功能目标和包选择。此外，技术委员会还可以根据类似于前面描述的社区委员会的方式，仲裁团队内部或团队之间的任何技术分歧或问题。\n\
  \n技术委员会的首要责任是 Ubuntu 的包策略。技术委员会维护策略文档，该文档描述了所有 Ubuntu 包必须遵循的流程和标准。由于策略在不断演变，每个 Ubuntu\
  \ 版本都与技术委员会确定的特定版本的 Ubuntu 包策略相关。任何关于策略的建议或提议都会提交给技术委员会并由其考虑。\n\n此外，技术委员会负责维护 Ubuntu\
  \ 每个发布版本的功能目标。在每个发布周期中，都有一个定义为 `Feature Freeze`（功能冻结）的日期，此之后不再添加任何新功能。技术委员会设定这些日期，并决定何时以及是否可以针对特定功能或软件通融规则。\n\
  \n最后，技术委员会负责维护 Ubuntu 中软件（即包）的 `list`（列表）。在此职能上，技术委员会决定哪些软件安装在默认桌面安装中，以及哪些包有资格作为\
  \ Ubuntu 核心组件获得完全支持。用户和开发者可以提议将特定软件包含在 main 组件、基础安装或桌面安装中。在所有情况下，最终决定将由技术委员会做出。\n\
  \n与社区委员会一样，技术委员会每月在 IRC 上至少召开两次。与社区委员会一样，任何用户都可以在预定会议之前提交议题或提议供技术委员会讨论。会议对所有利益方开放，尽管决策和投票仅限于技术委员会成员。适用于社区委员会的完整记录和关于噪音规则也适用于技术委员会。你随时可以在\
  \ [`launchpad.net/~techboard`](https://launchpad.net/~techboard) 找到技术委员会成员的现名单。任命由\
  \ Shuttleworth 进行，但须通过维护者之间的投票进行确认，而非所有成员。任期为两年。\n\n## 其他委员会和小组\n\n### Ubuntu 论坛委员会\
  \ (Ubuntu Forum Council) Ubuntu 论坛 ([`ubuntuforums.org`](http://ubuntuforums.org))\
  \ 由论坛委员会领导，该委员会制定规则、管理版主和管理员，并可以授予关键贡献者 Ubuntu 成员身份。\n\nLaunchpad 团队：[`launchpad.net/~forum-council`](https://launchpad.net/~forum-council)\n\
  \n维基页面：[`wiki.ubuntu.com/ForumCouncil`](https://wiki.ubuntu.com/ForumCouncil)\n\n\
  邮件列表：ubuntu-forums-council@lists.ubuntu.com\n\n\n\n\n\n# Ubuntu IRC 委员会\nIRC 委员会是负责管理\
  \ IRC 频道，以及在 IRC 与 Ubuntu 社区其他部分及治理系统之间接口的最终小组。IRC 委员会还有权向关键贡献者授予 Ubuntu 成员。\n\n\
  - Launchpad 团队：[`launchpad.net/~ubuntu-irc-council`](https://launchpad.net/~ubuntu-irc-council)\n\
  - Wiki 页面：[`wiki.ubuntu.com/IrcTeam/IrcCouncil`](https://wiki.ubuntu.com/IrcTeam/IrcCouncil)\n\
  - 邮件列表：irc-council@lists.ubuntu.com\n\n# Ubuntu LoCo 委员会\nLoCo 委员会负责管理 LoCo 社区，对资源分配做出决策，处理冲突解决，并对项目的发展方向做出决策。\n\
  \n- Launchpad 团队：[`launchpad.net/~ubuntu-lococouncil`](https://launchpad.net/~ubuntu-lococouncil)\n\
  - Wiki 页面：[`loco.ubuntu.com/loco-council/`](http://loco.ubuntu.com/loco-council/)\n\
  - 邮件列表：loco-council@lists.ubuntu.com\n\n# Ubuntu 开发者成员委员会\nUbuntu 开发者成员委员会是负责考虑并批准成为\
  \ Ubuntu Core 开发者团队成员的小组。\n\n- Launchpad 团队：[`launchpad.net/~developer-membership-board`](https://launchpad.net/~developer-membership-board)\n\
  - Wiki 页面：[`wiki.ubuntu.com/DeveloperMembershipBoard`](https://wiki.ubuntu.com/DeveloperMembershipBoard)\n\
  - 邮件列表：developer-membership-board@lists.ubuntu.com\n\n# Ubuntu 成员审批委员会\nUbuntu 成员审批委员会由一个地理分布的团队组成，负责考虑\
  \ Ubuntu 成员申请。\n\n- Launchpad 团队：[`launchpad.net/~ubuntu-membership-board`](https://launchpad.net/~ubuntu-membership-board)\n\
  - Wiki 页面：[`wiki.ubuntu.com/Membership/Boards`](https://wiki.ubuntu.com/Membership/Boards)\n\
  - 邮件列表：ubuntu-membership-boards@lists.ubuntu.com\n\nUbuntu 变体（例如 Kubuntu、Edubuntu）也可能由委员会管理，但这由每个项目决定，并可能随着项目的变化和演变随时间改变。\n\
  \n### SABDFL\nMark Shuttleworth 幽默地自称为 Ubuntu 的 SABDFL——即自封的终身仁独裁者（self-appointed\
  \ benevolent dictator for life）。作为 Ubuntu 项目的赞助人和 Canonical 有限限公司的创始人，他扮演着一个公认的非民主的角色。在\
  \ Canonical 员工方面，Shuttleworth 有权要求人员从事特定的项目、功能目标和修复漏洞。他正是这样做的。\n\nShuttleworth 在社区委员会中还拥有一个平局票，并曾公开表示他不会轻率使用该票权。在委员会出现分歧且没有“正确”答案的情况下，SABDFL\
  \ 将提供决策而不是更多的辩论。SABDFL 的存在是为了对困难问题提供明确的领导，并为项目设定节奏和方向。作为这种权力的交换，他有责任听取社区意见，并理解使用其\
  \ SABDFL 权威可能会削弱项目。\n\n## Ubuntu 成员\n成为 Ubuntu 项目成员是项目认可持续且重大贡献的官方方式之一。任何签署了《Ubuntu\
  \ 行为准则》并证明其对 Ubuntu 社区做出了重大且持续贡献的人，都可以获得官方成员身份。这些贡献可以是任何形式的——技术性的或非技术性的——但需要以在社区委员会授权下可以提交给\
  \ Ubuntu 成员委员会的形式呈现。候选人所面前的成员委员会将逐一考虑每份申请。下文关于“如何参与”的章节中列出了部分符合条件的贡献类型列表（非详尽）。成员委员会在考虑成员身份时，会尝试对接受的各种贡献类型保持灵活性。\n\
  \nUbuntu 成员负责通过投票对所有 Ubuntu 社区委员会的提名进行确认。社区委员会还可能要求他们对提交给全体成员的决议进行投票。作为交换，成员将获得一个\
  \ `@ubuntu.com` 电子邮箱地址以及携带 Ubuntu 商务名片的权利。成员身份有效期为两年，并可以自动续期。未能续签成员的成员将被标记为非活跃，但通过恢复活动并经过涉及成员委员会批准的简单程序，可以轻松重新激活。\n\
  \n成为成员的过程相对简单，且在 [`wiki.ubuntu.com/Membership`](https://wiki.ubuntu.com/Membership)\
  \ 中有详细记录。最重要的是，它要求用户在 Wiki 页面上记录他们的贡献，页面中应包含代码链接、邮件列表信息、能够清楚证明其参与的特定形式文档，以及/或其他相关材料。成员申请还需要包括关于\
  \ Ubuntu 工作和参与情况的证言。\n\n## 如何参与\n用户可以通过不同的层次和多种方式参与 Ubuntu 社区。以下子章节很大程度上改编自 Ubuntu\
  \ 网站上相关在线资源链接页面（[`community.ubuntu.com/contribute`](http://community.ubuntu.com/contribute)），提供了一份人们可以快速上手\
  \ Ubuntu 社区的良好列表。\n\n### Ubuntu 在线活动\nUbuntu On Air! 团队定期组织一系列视频活动，其中通常包括与社区关键成员的采访和问答环节。有关当前和即将进行的\
  \ Ubuntu on Air! 活动的详情可以在 `http://ubuntuair.com/` 查询。\n\n### 倡导\n个人为 Ubuntu 社区贡献的最简单方法就是告诉其他人\
  \ Ubuntu。倡导通常通过多种方式发生。一种很好的方法是加入或启动 LoCo 团队。本章稍早描述的 LoCo 提供了一种参与 Ubuntu 活动的方法。如果用户没有\
  \ LoCo，或者没有足够的用户规模来启动一个团队，他们可以通过向本地 Linux 用户小组或其他技术小组进行关于 Ubuntu 的演讲来帮助建立支持。通过这些或其他手段，倡导为推广\
  \ Ubuntu 提供了绝佳途径，并为社区贡献提供了低门槛的机会。许多社区成员在 Spread Ubuntu 网站（[`spreadubuntu.org`](http://spreadubuntu.org)）上分享传单、海报、CD\
  \ 封面和横幅等资源。Spread Ubuntu 是一个社区驱动的官方 Ubuntu ，致力于为用户、团队和社区成员提供各种工具和资源协助倡导工作。\n\n###\
  \ 想法与反馈\n\n\n\n\n\n向 Ubuntu 贡献的另一种方式是通过描述愿景或提供想法来帮助引导项目方向。这可以通过参加会议上的讨论和头脑风暴会议，以及在\
  \ Ubuntu wiki 上参与来实现。通过监控规范的编写并创建反馈（特别是在早期阶段），用户可以做出有意义的贡献。然而，贡献想法的用户应该记住，口说容易是廉价的。明智的用户会与其他合作，帮助将他们的愿景变为现实。\n\
  \n### 文档\n\n当用户被某个问题困住时，其他用户很可能也会对该问题感到困扰。如果用户无法通过编写代码来改变局面，他们可能可以通过编写自己的经验并记录解决方案来帮助他人。Ubuntu\
  \ 拥有一个充满活力的文档团队和社区，编写文档是向 Ubuntu 社区做出意义贡献的一种极低门槛的方式。\n\n旨在为 Ubuntu 文档做贡献的用户被建议在钻研问题时做笔记，并在找到解决方案时将其记录。在编写之前，用户还应该检查是否已经存在针对特定问题的文档。如果存在，用户明智的做法是选择改进或补充现有文档，而不是编写新文档。同样，用户也可以通过阅读现有文档并修复事实、技术、风格、拼写和语法错误来做出有意义的贡献。花费大量时间编写文档的用户随着时间的推移，可能还想加入\
  \ Ubuntu 文档团队，该团队可以根据 Ubuntu 文档目标组织并协调这些工作。\n\n## 翻译与本地化\n\n对 LoCos 的讨论应该已经清楚，翻译是任何熟练掌握英语和另一种语言的人向\
  \ Ubuntu 社区贡献的极佳方式。翻译工具（在第 9 章 中描述）允许用户翻译最少单个字符串或最多整个应用程序。通过其易用的界面和基于 Web 的特性，翻译提供了一条条低门槛的贡献途径。严肃的翻译者应该加入本地社区团队和\
  \ `ubuntu-translators` 邮件列表，以便与其他 Ubuntu 翻译者保持联系。\n\n## 质量保证与 Bug\n\n质量保证（QA）是许多公司聘请专门工程师的工作。在\
  \ Ubuntu 中，开发团队依靠 Canonical QA 团队和社区在软件发布前进行测试，以让开发者了解问题，以便在绝大多数用户看到它之前修复 Bug。用户可以通过多种方式对软件测试做出贡献，从测试即将发布的最新\
  \ ISO 构建，到在更新发布给更广泛社区之前单独测试包。\n\nISO 和包的跟踪器可以通过 Ubuntu 质量团队获取。当用户帮助进行 QA 并发现 Bug\
  \ 时，他们应该在 Ubuntu Bug 跟踪系统中报告它们。他们还可以通过“分拣”（triaging）Bug、关闭或合并重复、验证 Bug 以及在 Bug 描述中添加信息来提供帮助。如果你打算参与\
  \ QA，你应该订阅 `ubuntu-devel-announce` 邮件列表和 `ubuntu-quality` 邮件列表，考虑监控 `ubuntu-devel`，并在\
  \ [irc.freenode.net](http://irc.freenode.net) 加入 `#ubuntu-quality` IRC 频道。\n\n##\
  \ 编程与打包\n\n用户向 Ubuntu 社区贡献的最后方式是通过生产代码。由于 Ubuntu 是免费开源软件，用户可以访问 Ubuntu 支持的所有软件。这允许用户打包额外的软件以包含在\
  \ Ubuntu 中、修复 Bug 并添加功能。开发者和测试软件的人一样，应该订阅 `ubuntu-devel-announce` 邮件列表，并也考虑监控 `ubuntu-devel`。开始贡献的最佳方法是如前所述，作为\
  \ MOTU 候选者加入 MOTU 团队。用户还可以查看规范列表，找到他们个人感兴趣的项目。\n\n随着云端软件的兴起，基础设施打包以 Juju Charms\
  \ 的形式可用（[`jujucharms.com/`](https://jujucharms.com/)）。Juju Charms 使用 `Juju` 服务来指定和协调运行在服务器上的特定服务之间的依赖和关系。例如，一个博客软件可能需要\
  \ Web 服务器和数据库；这些可以在 `Juju` 中定义并在单独的服务器上或带有额外功能启动，从而实现高可用。\n\n### 总结\n\nUbuntu 是一个活力且多样化的社区，在全球范围内和多种语言中保持活跃。其活动主要在线上的各种虚拟场所进行，包括邮件列表、IRC、Web\
  \ 论坛、wiki、社交媒体、上游视频播客、开发者和云门户，以及两个名为 The Fridge 和 Planet Ubuntu 的特殊 Web 社区门户。Ubuntu\
  \ 通过现实生活中的会议和活动会补充了这些虚拟活动。Ubuntu 社区被分为各种团队和流程。在这个政府结构的顶端是 Ubuntu 社区委员会、技术委员会以及 SABDFL\
  \ 的 Mark Shuttleworth。通过多种方式，该社区旨在设计让人们轻松地做出贡献。最终，这些贡献通过一个最终导致官方项目成员和投票权的过程获得认可。\n\
