  \n\n\n\n\n\n\n## 对《Ubuntu 官方指南》之前版本的赞誉\n\n“《Ubuntu 官方指南》是你上手 Ubuntu 的绝佳方式，它提供了足够让你高效工作的信息，而不会让你负担过度。”\n\
  —John Stevenson，DZone 图书评论员\n\n“OUB 是我过的最好的入门书籍之一。”\n—Bill Blinn, TechByter Worldwide\n\
  \n“这本书是 Linux 和 Ubuntu 新手的用户的完美伴侣。它以简洁且组织良好的方式涵盖了基础知识。通用用途与故障排除和错误处理分开阐述，使本书既适合学者，也适合需要额外帮助的用户。”\n\
  —Thomas Petrucha，奥地利 Ubuntu 用户组\n\n“我向经常指导使用 Ubuntu 的几位用户推荐了这本书。他们都对购买结果感到非常满意，甚至能够利用它在他们的学习之旅中提供帮助。”\n\
  —Chris Crisafulli，佛罗里达地方社区团队 Ubuntu LoCo 委员会\n\n“这段文字揭秘了一个非常强大的 Linux 操作系统……在拥有它后的短短几周内，我已作为快速参考使用了六次左右，这节省了我原本在网上搜索\
  \ Ubuntu 论坛要花费的时间。”\n—Darren Frey，休斯顿地方用户组成员\n\n“这本书对于新 Ubuntu 用户来说在入门方面非常有帮助，而对于经验丰富的计算机用户来说，它的信息量也足以作为参考手册。我也喜欢其中的计算机幽默。”\n\
