  \ 团队的工作，包括 Debra Williams Cauley、Kim Boedigheimer、Julie Nahil 和 Mark Taub。\n\n##\
  \ 关于作者\n\n`Matthew Helmke` 自 2005 年 4 月起担任 Ubuntu 用户，自 2006 年 8 月起成为 Ubuntu 成员。他于\
  \ 2006 年至 2011 年担任 Ubuntu 论坛委员会，提供 Ubuntu 论坛的领导和监督，并在欧洲、中东和非洲的区域成员批准委员会工作了两年。他曾为杂志和网站写过关于\
  \ Ubuntu 的文章，是《Ubuntu Unleashed》的主作者，并写过几本其他主题的书。\n\n`Elizabeth K. Joseph` 是一位职业\
  \ Linux 系统管理员，目前就职于惠普，负责管理 OpenStack 项目的基础。她自 2002 年就开始从事 Linux 和相关社区的工作。Elizabeth\
  \ 从 2006 年开始贡献 Ubuntu，目前活跃多个团队，包括文档、新闻、质量保证和课堂。多年来，她曾担任 Ubuntu 成员委员会，现在担任第三届社区委员会成员。她住在旧金山，担任\
  \ Ubuntu 加州小组的负责人之一，并在一家为需要的学校提供 Ubuntu 电脑的非营利组织担任董事。\n\n\n`Benjamin Mako Hill`\
  \ 是一位长期的自由软件开发者和倡导者。他是 Ubuntu 创始团队成员，他在 Canonical 的任务是在项目第一年帮助扩大 Ubuntu 的开发和用户社区。Mako\
  \ 是华盛顿大学的助理教授，哈佛大学伯肯互联网与社会中心的研究员。他在麻省理工学院管理学院获得了博士学位。\n\n\n\n\n\n近年来，Ubuntu 操作系统在开源和\
  \ IT 领域席卷了一场风暴。这个“不可能的小型操作系统”从横空出现起，已发展成为一个功能齐全的桌面和服务器解决方案，赢得了全球用户的青睐。除了强大的技术平台和对质量的卓越追求，Ubuntu\
  \ 的成功还得益于其庞大且热情的用户社区，他们为 Ubuntu 版图的每一个角落提供了支持、文档编写和测试。\n\n你手中拿着的是这个令人惊叹的操作系统的官方授权指南。参与本书编写的每位作者都展现了高水平的技术能力、对\
  \ Ubuntu 无保留的投入，以及以简单明了的方式分享这些知识的能力。这些作者汇聚在一起编写了这本书，旨在为 Ubuntu 提供坚实的基础，并解释 Ubuntu\
  \ 许多方面面和功能的工作原理。\n\n# 关于本书\n\n在每本书的开头、每个书架、每家商店里，都会有一段总结全书意图和目标的文字。我们有一个非常简单且务实的目标：让\
  \ Ubuntu 体验变得更加愉快。Ubuntu 开发者和社区付出了巨大努力，制作出一个易用、功能强大且灵活的操作系统，用于执行、浏览和创建各种有趣的事情。本书是对这一努力的补充。凭借这样一个集成且灵活的操作系统，本指南将成为你利用\
  \ Ubuntu 完成许多工作的杰力之作。\n\n## 本书的范围\n\n由于涵盖的内容非常多，编写一本能够详尽描述该系统的书籍是一项艰巨的任务。然而，如果我们深入撰写\
  \ Ubuntu 中每一个可能的特性，你可能需要买一个新书架才能存放这些海量内容。\n\n创建《Ubuntu 官方指南》（The Official Ubuntu\
  \ Book）面临的挑战之一，是在合理的书籍篇幅内选择可以涵盖的主题和内容。我们识别了最核心的内容并仅对其进行编写。这些选定的主题不仅涵盖了安装、桌面使用、应用程序、多媒体、系统管理和软件管理，还包含了对社区、在线资源以及\
  \ Ubuntu 和开源软件背后哲学的讨论。作为额外，我们扩展了对你可能的 Ubuntu 相关项目的讨论。我们相信这本书为入门 Ubuntu 提供了理想的一站式指南。\n\
  \n\n以下是各章节简要介绍及其涵盖的内容。\n\n![Image](img/00002.jpeg) **第 1 章：Ubuntu 故事。** 这部分充满活力的介绍描述了\
  \ Ubuntu 项目、其发行版、其开发过程以及让这一切成为可能的历史。\n\n![Image](img/00002.jpeg) **第 2 章：安装 Ubuntu。**\
  \ 我们将一步步演示安装过程，清晰地描述感兴趣的人士如何在自己的电脑上开始使用 Ubuntu。\n\n![Image](img/00002.jpeg) **第\
  \ 3 章：开始使用 Ubuntu。** 这是一次信息量丰富且趣味性的 Ubuntu 导览之旅，也是读者首次接触书中更具实践性的内容。\n\n![Image](img/00002.jpeg)\
  \ **第 4 章：查找并安装 Ubuntu 应用程序。** 在这里你将学习 Ubuntu 软件仓库的丰富内容，并发现如何利用它们。书中重点介绍了几个默认未安装的实用软件示例。\n\
