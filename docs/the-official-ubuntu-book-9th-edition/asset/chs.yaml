  ### 文档\n### 翻译与本地化\n### 质量保证与 Bug\n### 编程与打包\n### 总结\n\n# 索引\n\n## 六版前言\n《官方 Ubuntu\
  \ 书》捕捉了 Ubuntu 本身精神与严谨。正如 Ubuntu 一样，它在定期发布的稳定节奏中不断进化，而第六版反映了从之前版本中积累的见解，以及驱动 Ubuntu\
  \ 前进的一些最新创新。\n\n2011 年是 Ubuntu 变化的关键之年，因为我们正走向名为 `Unity` 的新统一界面。我们的目标是交付人们长期渴望的：作为自由软件的世界上最简洁、最优雅的桌面体验。`11.04`\
  \ 是这一过程中的第一个大步，我们在桌面上默认引入 `Unity`，同时为那些尚未跃迁到 `Unity` 的用户保留了 `GNOME` 。\n\n我们更广泛的目标是挑战自由软件生态系统，使其在设计上投入与工程领域等量的创意和能量。我们知道，自由软件在性能、可靠性和安全性方面可以是世界上最好的；现在是时候将易用性和时尚感也引入其中了。\n\
  2011 年 4 月\n\n## 第一版前言\n对我来说，写这篇前言是一个小小的庆祝——这距离那群自由软件专业人士首次聚会并演变成 Ubuntu 项目几乎恰好两年。之所以说是庆祝，是因为两年前我们没有人能预料到我们的梦想会产生数百万张光盘、三四百万名狂热用户、来自大小各公司的数百份支持承诺、一次次要的黄金时段电视提及，以及现在这本《官方\
  \ Ubuntu 书》。\n\n把我们在一起的梦想可以简单表述：\n\n为普通桌面电脑用户构建一个世界级的操作系统，它是真正的自由且免费提供的，它是立刻可用的，并代表了当今自由软件世界所实现的最高成就。\n\
  \n在着为“普通桌面电脑用户”构建平台时，我完全不知道自己会有幸遇到并与这么多普通的桌面电脑用户合作。在这些非凡的个人中，有些人是本书的作者，他们既理解自由软件运动的重要性，又有才成为其成功的真正贡献者。另一些人是\
  \ Ubuntu 社区的骨干——这是一支由数百人组成的规模小但专注的军队，每六个月制作一个新的 Ubuntu 版本。他们是一个网络的核心，这个网络遍布全球自由软件社区——通过\
  \ `Debian` 世界（这本身就是一个极其非凡的项目，没有它 Ubuntu 就不复存在），并向外延伸成千上万个大小不同的项目，这些项目产生了我们汇总并统称为\
  \ Ubuntu 的代码和文档。\n\n虽然这个庞大的扩展社区往往会因极微小的意识形态差异而显得破碎和分裂，但我们对四个核心观点大体达了共识，而这些观点正是 Ubuntu\
  \ 承诺的核心：\n\n\n\n\n\n\n![Image](img/00002.jpeg) 这种免费软件应该是现有的最佳版本，包括定期的安全更新，而不是对某个更好的商业产品的诱饵。\n\
  \n![Image](img/00002.jpeg) 这一免费平台应该拥有来自本地和全球公司的全方位、高质量的商业支持。\n\n![Image](img/00002.jpeg)\
  \ 这种软件应该能够尽可能多语言使用，并且无论是否有残障，都能被尽可能多的人使用。\n\n两年前在伦敦会面的我们 17 个人来自非常不同的国家和背景，但我们都一致认为，创建一个能够兑现这一承诺的平台是一个值得努力的目标，我们将全心全意地投入其中。\n\
  \n在几个月的时间里，我们静静地工作。我们希望带给世界的不仅是一份宣言，还有一份我们为实现目标所做工作成果的清晰展示，一些让人们可以进行测试并提供意见的东西。我们当时还没有名字（尽管业内人士称我们为“超级秘密\
  \ Debian 启动项目”），因此，我们将大部分工作都托管在了 `www.no-name-yet.com` 上。我们正在寻找一个能够表达自由软件社区开发过程之美的名字——协作、相互依赖、共享、站在巨人的肩膀上，并追求高远目标。我所知道的唯一接近这种描述的词是非洲单词\
  \ `ubuntu`。它在许多不同的非洲语言中以多种形式存在。因此，我们将其采纳为项目的名称。\n\n我们知道第一个版本会有瑕疵——小缺陷——并给它起了代号“疣疣野猪”（The\
  \ Warty Warthog）。我们自称为“野猪”，并在 `#warthogs` IRC 频道上协调我们的工作。今天，无论好坏，这已经变成了一种代号传统，例如“吹微风的松鼬”（Breezy\
  \ Badger）和“帅气的水鸭”（Dapper Drake）。尽管这些代号听起来很轻松，但它们体现了我们社区在朝着特定发布版本努力的精神。下一个代号——“帅气的”（Dapper）——正是如此：一个从青少年走向成熟、专业、大胆、自信且充满活力的男人。这是我们的第一个版本，不仅满足开发者和工程师的需求，也同样满足大型组织的需求。同样，Ubuntu\
  \ 社区已经从某种对“Linux 主流派”的反抗转变为了一个强大且组织严密的专业群体。\n\n### 为什么 Ubuntu 如此流行？\n\n首先，现在是自由软件走向前的时刻，而\
  \ Ubuntu 受益于构建 GNU/Linux 世界中庞大工作量所付出的巨大努力。这些工作以某种形式已经持续了近 30 年，但 Ubuntu 是这些工作突然对非专业计算机用户变得“可见”的一种方式。我们正处于行业现状发生巨大变革的中间。上一次发生这种情况是在\
  \ 20 世纪 90 年代中期，当时世界突然发现通过互联网连接在了一起。每家大公司，尤其是技术领域的公司，都必须审视自己并问一个问题：“我们如何适应互联网世界？”今天，每家大型科技公司都必须问自己：“我们如何适应自由软件世界？”\n\
  \n我推测并认为，Ubuntu 代表了一个时机已到的理念。我们并没有发明自由软件运动——这份荣誉属于理查德·斯托曼（Richard Stallman）和许多其他人，在一个难以预见愿景如何成为现实的时代，他们拥有远深远的远见。但\
  \ Ubuntu 也许有幸以一种我们所有人都能欣赏的形式，将这一愿景带给非常广泛的观众。我希望真正的愿景家——那些引领道路的人们——能欣赏我们在向你们呈现这个项目时所做的决策和选择。有些人会持异议——例如我知道\
  \ Linus 偏好 `KDE` 而不是 `GNOME`，所以他更有可能是 `Kubuntu` 的粉丝而不是 Ubuntu 的粉丝。但总来说，他人的想法、自由软件运动的原则在\
  \ Ubuntu 中得到了很好的体现。\n\n其次，Ubuntu 是一个 `你` 可以产生产生真实影响的项目。它拥有深厚且可靠的资金支持，以及一个企业团队来提供动力，但它在各个方面上都是一个开放项目，由真正的志愿者在最高水平上参与。我们在一个“鱼缸”环境里工作——我们的会议在网上举行，在公共论坛中进行。这可能会很棘手。构建操作系统是一项节奏很快的业务，在信息匮乏的情况下充满了妥协和艰难的决策。这里有分歧，也有不光光之面（内部琐事），而且也会犯错。（我应该很清楚这一点；其中一些错是我犯的错。你们应该听听关于\
  \ Warty Warthog 桌面艺术品的故事。）然而，我们环境的透明度意味着我们可以对所有选项进行稳健的讨论——所有的选项，甚至是核心团队从未梦过的选项。这也意味着错误被识别、讨论并最终解决的速度，比我们关起门来生活和工作快得多。结果就是你获得了一个更好的平台。\n\
  \n我们作为一个社区，努力工作以认可各种人士的贡献——倡导者、艺术家、Web 论坛管理员、频道管理员、社区活动组织者、作家、翻译人员、提交和分拣 Bug 的人员……无论你的特定兴趣或天赋是什么，我们都会找到方法来整合你的贡献。\n\
  \n也许最重要的是我们处理社区的方式将 Ubuntu 与具有相似愿景的其他自由软件项目区分开来。我们尝试以一种方式完成这一切，承认分歧是重要的，但防止这些分歧在我们的社区中产生深层隔阂。我们的行为准则并不完美，但它提醒我们每一个人记住\
  \ `ubuntu` 的意义——我们每个人都通过彼此之间的关系产生最大的影响。我们的治理结构——我们的技术委员会和社区委员会——是为了确保辩论不会变成人身攻击，并在听取了所有意见后做出决策。\n\
  \n如果你是软件专业人员或对 Linux 感奇，这本书和这个平台都是极佳的选择。你将了解到 Ubuntu 的世界，间接了解 Debian 和 GNU/Linux。这些工具将成为我认为的定义我们家和办公室的“标准”以及日常计算基础的伟大基石。\n\
  \n我曾听过一家封闭软件供应商说：“Linux 更昂贵，因为熟练的 Linux 专业人员成本更高。”这是事实。当然，这意味着 Linux 技能更有价值！这不会永远如此，因为\
  \ Linux 世界发展得如此之快，早晚我们必须接受其主流地位，这会消除一些与作为“技术未来”相关的“极客加分”。但现在，毫无疑问，在 Linux 和 Ubuntu\
  \ 方面走在潮流之前是正确的选择。如果你已经读到了序言的这里，你显然会坚持下去。 ;-)\n\n\n\n\n\n\n我们希望你喜欢《Ubuntu 官方指南》。对于这一版，我们做了许多改进，我们相信这些改进让这本已经很优秀的书提升到了新的高度。\n\
  \n由于 Ubuntu 的普及程度提高并变得广为人知，我们将目标受众从纯初学者扩大到那些对 Ubuntu 有一定了解但希望提高技能并成为高级用户的人群。这些人并不一定专注于成为程序员或系统管理员，而是那些希望让日常的\
  \ Ubuntu 使用更加高效，或者希望能够更好地利用 Ubuntu 潜力的普通人。\n\n本书的很大一部分都经过了重写——这并不是因为早期的版本写得不好，而是因为自上一个版本发布以来，发生了太多的变化。本书记录了影响典型用户的主要变化，并将帮助任何人学习\
  \ Ubuntu 的基础知识、历史，以及如何利用 Ubuntu 中自由软件的潜力。\n\n在我们写下这些文字时，距离我们写下《Ubuntu 官方指南》第一版已经过去好几年了。在过去的段时间里，我们见证了\
  \ Ubuntu 持续的爆发式增长。更新这本书以一种引人注目的方式印证了这一事实。例如，Ubuntu 论坛（Ubuntu Forums）和 Ask Ubuntu\
  \ 网站的用户数量和帖子数量仍在不断上升。\n\n再次，我们感到非常庆幸，《Ubuntu 官方指南》能够受益于这种成功，或许在某种程度上也为此做出了*贡献*。最终，这种成功为随后的几个版本以及你现在正在阅读的第九版铺平了道路。\n\
  \n在此过程中，这本书就像 Ubuntu 一样不断成熟。作为作者，我们的工作与 Ubuntu 开发人员的工作一样，现在比以前需要更多的更新和润色。在免费许可下分发，一本关于曾经具有风险的操作系统、曾经曾经具有风险的书，在短短几年后，已经非常接近作者、出版商以及（如果我们工作得当的话）读者所能期待的稳妥之作。\n\
  \n然而，成功也伴随着对读者和对有高期望的用户的责任。Ubuntu 的成功部分建立在成熟和卓越之上，如果它想要成功，就不能牺牲这些特质。我们同样不能。作为作者，我们的工作是复杂的，因为我们需要准确地反映和代表这两种特质，同时还要日益增长且日益多样化的用户群体。\n\
  \n正如我们在本书之前几个版本的序言中所提到的，拥有*官方（Official）*的身份意味着一系列权利和责任。我们书的标题意味着我们必须尝试反映和代表整个 Ubuntu\
  \ 社区。虽然我们作为作者被要求将自己投入书中，但大家都理解，这绝不能损害 Ubuntu 社区的价值观、原则、技术或结构。\n\n随着 Ubuntu 的增长，做这件事变得越来越复杂。在每一个版本中，我们都增加了新信息，因为\
  \ Ubuntu 社区的增长已经包含了新的项目。在本书的每一次修订中，我们都需要增加相关项目、工具和社区倡议的列表。随着 Ubuntu 社区的增长，不可能对 Ubuntu\
  \ 的提供给出完整的清单。创建一个摘要需要一些艰难的决定。归结底，我们受限于页数和自己有限的时间表。\n\n同时，与早期的版本一样，我们需要在 Ubuntu 新版本发布期间编写这本书，而该版本正处于活跃开发中，并被重新设计、重新思考和重建。Ubuntu\
  \ 每天以不同、不可预测的方式增长，这种增长随着社区规模和用户群多样性的增加而呈指数级增长。我们书的开发过程必须匹配并追踪这一过程，因为我们的内容是在构思、重写、调整并让其`自身`成熟的过程中。\n\
  \n与上一版一样，本书的贡献者远不止封列出的人。对于大多数读者来说是不可见的，社区的数十名成员在本书的不同部分留下了他们的印记。尽管这种程度的参与导致写作过程像构建\
  \ Ubuntu 的过程一样忙碌，且时而令人沮丧，但我们希望能够提醒读者，这种过程在我们书的主题上所激发的质量水平。在我们实现这一目标的地方，我们赢得了书的称号。以这一目标为指导，我们期待未来\
  \ Ubuntu 的版本以及通过通过相同的社区驱动过程产生的本书的其他版本。\n\n### 致谢\n\n特别感谢 Mark Shuttleworth、Jane\
  \ Silber 和 Lara Pinto，他们付出的所有努力让这本书能够面向新老和老 Ubuntu 用户问世。感谢来自 Canonical 的 Marcus\
  \ Haslam、Wunmi Solaja、David Planella 和 Tom Callway 对本版本的慷心帮助。\n\n我们还要感谢这组评审人员和信息来源对之前版本所提供的帮助：Philip\
