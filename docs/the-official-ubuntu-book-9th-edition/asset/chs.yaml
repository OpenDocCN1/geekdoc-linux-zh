  \n![Image](img/00002.jpeg) **第 11 章：Ubuntu 社区。** Ubuntu 社区比很多人想象的要庞大且活跃得多。\n\n\n\
  \n\n本章将 Ubuntu 项目的历史生动呈现，探讨了这段历史并展望了它的未来。如果你想立即上手开始使用 Ubuntu，可以跳过此部分直接进入第 2 章：安装\
  \ Ubuntu。如果你感兴趣先了解 Ubuntu 的起源以及它将走向何方，本章将提供一个很好的介绍。\n\n## 愿景\n\n2004 年 4 月，马克·沙特沃（Mark\
  \ Shuttleworth）聚集了来自 `Debian`、`GNOME` 和 `GNU Arch` 项目的十几个开发者进行头脑风暴。沙特沃询问开发者们是否可能存在更好的操作系统（OS）。他们的回答是“肯定的”。他接着询问他们这种操作系统看起来应该什么样。最后，他要求他们描述构建这样一个操作系统的社区。该小组与沙特沃合作得出了这些问题的答案，然后他们决定尝试让这些答案变成现实。该小组自命名为\
  \ `Warthogs`（疣猪小组），并给自己设定了六个月的期限来构建一个概念验证的操作系统。开发者们将他们的第一个版本命名为 `Warty Warthog`（疣脸疣猪），这基于一个合理的假设：他们的第一个产品必然会有一些瑕疵（warts）。然后，他们开始投入工作。\n\
  \n对于我们这些有幸成为早期“疣猪”成员的人来说，看到这个项目多年来的进展是非常有成就感的。我们有一个强有力的开头，`Warty Warthog` 远非满是，而是超过了我们最乐观的预期和所有人的预测。在六个月内，Ubuntu\
  \ 在多个 `GNU/Linux` 发行版的受欢迎排名中位居首。Ubuntu 展示了近期记忆中任何 `GNU/Linux` 发行版中最具爆发性的增长，并拥有历史上任何自由或开源软件项目中最令人深刻的第一年以及持续的增长。\n\
  \n想到在短短几年后，就有数百万个人在使用 Ubuntu，这令人震惊。随着数千万用户通过开发文档、翻译和代码来回馈 Ubuntu 社区，Ubuntu 每天都在改进。随着数千万用户为活跃的倡导和支持社区（包括在线和本地社区）做出贡献，Ubuntu\
  \ 的增长依然不可挡。Ubuntu 子项目（包括 `Kubuntu` 和 `Ubuntu Studio` 在内的努力列表）以及手机版 Ubuntu 等其他项目，正在将\
  \ Ubuntu 项目的影响力和目标扩展到新的领域。\n\n与此同时，数百万次 Ubuntu 安装已在全球大学、网吧、电脑店和社区中心发生并持续进行。你几乎可以在人们使用电脑的任何地方找到\
  \ Ubuntu。作者们亲眼看到过陌生人在西班牙的火车上、波士顿的图书馆、克罗地亚的博物馆、墨西哥的高中、北非的摩洛哥和突尼斯的，以及许多在此处列举不尽的地方运行\
  \ Ubuntu。\n\n多年来，Ubuntu 继续不断成熟。从 `Ubuntu 6.06 LTS` 发布开始，公众对 Ubuntu 投入了更多的关注，这是第一个对桌面版和服务器端提供长期支持的精简版本；随后是每六月发布一个新版本，每两年发布一个新的\
  \ LTS 版本，直到目前的 `16.04 LTS`。通过这些发布，Ubuntu 证明了它意图长期留存，同时在可预测的时间表中持续改进。尽管有了这种成熟，该项目仍保持着年轻的活力、雄心勃勃的态度、对原则的承诺以及社区驱动的方法。随着项目的发展，它正在证明自己不仅可以从失败也可以从成功中学习，并且可以在不牺牲稳定性的情况下保持增长。\n\
  \n我们已经走了很长的一路——而我们才刚刚刚刚开始。\n\n## 自由软件、开源与 GNU/Linux\n\n虽然数千个人以各种形式对 Ubuntu 做出了贡献，但该项目的成功仅源于更多数千万人的努力，他们间接地为\
  \ Ubuntu 的成功奠定了技术、社会和经济基础。虽然关于自由软件、开源和 `GNU/Linux` 的介绍可以在其他地方找到，但如果不对这些概念以及其背后的人物和历史进行简短讨论，关于\
  \ Ubuntu 的介绍就是不。Ubuntu 正是因为这些理念以及这些社区产生了动力并诞生。最终，它通过这些思想得以延续。\n\n### 自由软件与 GNU\n\
  \n在一系列通过不断重复几乎成为传奇的事件中，理查德·斯斯尔曼（Richard M. Stallman）于 1983 年创造了自由软件的概念。斯尔曼成长于 20\
  \ 世纪 660 年代和 70 年代，当时计算机用户购买的是巨大且极其昂贵的主机，这些机器在大量程序员之间共享。软件在很大程度上被视为硬件的附加物，每个用户都有能力和权利修改或重写自己电脑上的软件，并自由地分享这些软件。随着\
  \ 70 年代后期计算机变得廉价且数量增加，软件生产者开始看到软件本身的价值。计算机生产者开始争辩说他们的软件可以拥有版权，并且是一种知识产权，就像音乐录音、电影或书籍文本一样。他们开始以许可协议和形式分发软件，这些形式限制了用户使用、重新分发或修改代码的能力。到\
  \ 80 年代初，限制性软件许可协议已成为常态。\n\n斯尔曼当时是 `MIT 人工智能实验室` 的一名程序员，他日益担心他所看到的软件用户和开发者此前享有的自由正面临危险的流。他担心计算机用户无法成为良好邻居，以及他所认为的伦理且高效的计算机用户社区的成员。为了对抗这种负面态势，斯尔曼阐述了一个开发被解放代码的社区愿景——用他的话说，“自由软件”。他将自由软件定义为具有以下四个特征的软件——标记为自由\
  \ 0 到 3 而不是 1 到 4，这是对计算机编程传统的致敬，也是一个小内部笑话：\n\n![Image](img/00002.jpeg) 为任何目的运行程序的自由（自由\
  \ 0）\n\n![Image](img/00002.jpeg) 研究程序如何工作并根据需要调整它的自由（自由 1）\n\n![Image](img/00002.jpeg)\
  \ 重新分发副本以帮助邻居的自由（自由 2）\n\n![Image](img/00002.jpeg) 改进程序并向公众发布改进以便整个社区受益的自由（自由 3）\n\
  \n访问源代码——任何软件人类可读且可修改的蓝图，这与大多数软件分发的机器可读代码版本区别来——是自由 1 和自由 3 的前提。在发布这一自由软件定义的同时，斯尔曼创建了一个项目，目标是创建一个完全自由的操作系统来替换当时流行的\
  \ `UNIX`。1984 年，斯尔曼宣布了该项目并将其命名为 `GNU`——同样采用了常见的程序员幽默形式，一个递归缩写，意思是“GNU 不是 UNIX”。\n\
  \n### Linux\n\n\n\n\n\n到 20 世纪 90 年代初，斯尔曼和其他致力于 GNU 的程序员已经开发出一个近乎完整的、可以自由共享的操作系统。然而，他们还缺少最后的一个关键部分，即内核——一个位于任何操作系统中心的复杂系统命令处理器。1991\
  \ 年，莱纳斯·托瓦尔斯（Linus Torvalds）编写了这样一个内核的早期版本，并在自由许可下发布，将其命名为 Linux。托瓦尔斯的内核与 GNU 项目的开发工具、操作系统以及名为\
  \ X 的图形化窗口系统相结合。通过这种耦合，一个完全自由的操作系统诞生了——在价格上是免费的，在斯尔曼所说的自由意义上也是自由的。\n\n今天所有被称为 `Linux`\
  \ 的系统实际上都是基于这一合作成果构建的。从技术上讲，`Linux` 一词仅指代内核。许多 GNU 的程序员和贡献者（包括斯尔曼在内）强调认为，整个操作系统应该被称为\
  \ `GNU/Linux`，以不仅给 `Linux` 且给 GNU 项目以荣誉，并强调 GNU 传播软件自由的目标——这些目标莱纳斯·托瓦尔斯并不一定认同。许多其他人认为这个名字很繁琐，倾向于简单地称该系统为\
  \ `Linux`。另一些人，例如 Ubuntu 项目的工作人员，则试图通过使用自己的项目名称来代替 `GNU/Linux` 来完全避免这种争议。\n\n\n\
  关于标签的争议并没有结束于对 GNU 和 Linux 组合的讨论。事实上，随着 GNU 和 Linux 贡献者列表的扩大，一个充满活力的新自由软件项目世界蓬颖而出，这在一定程度上得益于互联网访问的增长。随着社区的增长和多样化，许多人开始注意到斯尔曼自由软件的一个无意副作用。由于自由软件是以开放的方式构建的，`anyone`都可以通过查看代码、发现并修复漏洞来为软件做贡献。由于软件受到了更多程序员的审查，自由软件的质量更高、性能更好，并且提供的功能比通过专有开发机制开发的类似软件更多。事实证明在许多情况下，自由软件背后的开发模型所产生的软件比专有替代品`本质上更优`。\n\
  \n当计算机和信息技术行业开始进入互联网热潮，由两位自由软件开发者和倡导者——埃里克·S·雷蒙德（Eric S. Raymond）和布鲁斯·珀恩斯（Bruce\
  \ Perens）领导的一群自由软件开发者和领导者看到了这种模型提供的重要商业价值：这种模型可以利用志愿者劳动或企业间协作来创建出内在更好的软件。然而，他们担心“free\
  \ software”（自由软件）一词至少在两个方面存在问题。首先，它具有高度的歧义——英语单词 `free` 既意味着免费（无成本，例如像免费啤酒一样 free），也意味着自由意义上的解放（例如言论自由中的\
  \ free）。其次，存在一种感觉（雷蒙德最著名的表述了这一点），所有关于自由的谈论正在吓走那些自由软件运动为了成功就必须印象深刻的企业高管和决策者。\n\n\
  为了解决这两个问题，该小组创造了一个新术语——开源（open source），并创建了一个名为开源倡议组织（Open Source Initiative）的新机构。该小组在其核心设定了开源软件的定义，该定义与斯尔曼的自由软件四部分定义以及其他同样基于斯尔曼定义的社区定义完全重叠且互不排斥。\n\
  \n理解自由软件运动和开源运动之间分歧的一种有效方法，是将其视为宗教分裂的对立面。在宗教分裂中，教会因为信仰、解释或动机上的相对微小差异而分离，不再共同工作或崇拜。例如，大多数现代新教形式对`几乎`所有事情都达成一致，但由于一些微小但不可调和的差异而分离。然而，在自由软件和开源运动的案例中，这两个小组在动机和信仰上存在根本性的分歧。一组关注自由，而另一组则关注务实。自由软件最准确的描述是一种社会运动，而开源是一种开发方法论。然而，这两个小组在手手协作合作开展项目方面并没有困难。\n\
  \n在动机和目标方面，开源和自由软件分歧很大。但在软件、项目以及它们使用的许可证方面，它们是完全同义的。虽然认同其中任何一组的人认为这两种运动是相互对立的，但\
  \ Ubuntu 项目认为这两种意识形态之间没有冲突。Ubuntu 项目的人认同任何一组，而且往往同时认同两者。在本书中，我们可能会根据不同的项目在这些术语之间来回切换，Ubuntu\
  \ 社区的许多人对其中一个术语或另一个有更强的认同感。但对于本书而言，除非另有说明，否则任何术语都应该隐含另一个。\n\n### 愿景如何变为 Ubuntu\n\
  \n曾几何编写 Ubuntu 历史可能被认为为时过早；但现在已不再如此，因为过去几年对 Ubuntu 来说是非常繁忙的。随着其爆炸性的增长，即使是与该项目接触最密切的人也难以追踪和记录一些高光时刻。重要的是，有一些关键人物，必须了解他们自己的历史才能完全理解\
  \ Ubuntu。这份简要概述提供了 Ubuntu 至今历史的一些亮点，以及理解 Ubuntu 从何而来的背景知识。\n\n### 马克·舒特沃（Mark Shuttleworth）\n\
  \n如果没有马克·舒特沃的历史，任何 Ubuntu 历史都不称完整。毫无疑问，舒特沃是 Ubuntu 世界中最可见、最重要的人物。从历史的角度来看更重要的是，舒特沃还是项目的起源和发起者；他制造了那个最终滚动并成长为\
  \ Ubuntu 项目的雪球。\n\n舒特沃于 1973 出于南非自由省的韦尔姆（Welkom）。他在教区学院（Diocesan College）就读，并在开普敦大学获得了财务和信息系统的商业科学学位。在此期间，他是一个热心的计算机爱好者，并参与了自由和开源社区。他至少边缘参与了\
  \ `Apache` 项目和 `Debian` 项目，并是第一个将可能是 `GNU/Linux` 平台上最重要单项服务器软件的 `Apache` Web 服务器上传到\
  \ `Debian` 项目存档中的人。\n\n在 Web 早期看到了一个机遇，舒特沃在自己的车库里创立了一家名为 `Thawte` 的证书当局和互联网安全公司。在过去的几年里，他将\
  \ `Thawte` 成了互联网上第二大的证书当局，仅次于安全巨头 `VeriSign`。在整个期间，`Thawte` 的产品和服务几乎完全基于自由和开源软件构建和提供。1999\
  \ 年 12 月，舒特沃以未披露的数亿美元价格将 `Thawte` 卖给了 `VeriSign`。\n\n\n\n舒特沃斯（Shuttleworth）年轻时就积累了财富，本可以过上悠闲的生活——他也可能考虑过这一点。但他决定追求他一生的太空旅行梦想。在向俄罗斯航天计划支付了约\
  \ 2000 万美元并花费了近一年时间进行准备（包括学习俄语以及在俄罗斯星城接受了七个月的训练）后，舒特沃斯作为俄罗斯 `Soyuz TM-34` 任务的民用航天员实现了了他的梦想。在这次任务中，舒特沃斯在\
  \ `Soyuz` 火箭火箭上呆了两天，在国际空间站呆了八天，并在那里参与了与艾滋病和基因研究相关的实验。2002 年 5 月初，舒特沃斯返回了地球。\n\n\
  除了参与太空探索和一次仅略逊于一色的南极之旅外，舒特沃斯还以慈善家和风险投资者的身份发挥了积极作用。2001 年，舒特沃斯创立了舒特沃斯基金会（`TSF`），这是一家总部位于南非的非营利组织。该基金会的宗旨是资助、开发并推动教育领域的社会创新。当然，`TSF`\
  \ 尝试实现这些目标的手段经常涉及自由软件。通过这些项目，该组织一直是南非乃至全球自由开源软件最活跃的倡导者之一。在风险投资领域，舒特沃斯通过一家名为 `HBD`（“Here\
  \ Be Dragons”，意为“此处有巨龙”）的新型风险投资公司，向初创企业进行战略性资金注入，以促进南非的研究、开发和创业。在此期间，舒特沃斯忙于构思他的下一个大项目——这个项目最终演变成了\
  \ `Ubuntu`。\n\n## 疣野猪团队 (The Warthogs)\n\n市场上并不缺少尝试将 `GNU`、`Linux` 以及其他自由开源软件封装成一个整洁、可用且用户友好的包的项目。马克·舒特沃斯（Mark\
  \ Shuttleworth）像许多其他人一样，认为自由软件所提供的哲学和务实利益使其处于一条注定会取得广泛成功的道路。虽然每个产品都有其优处，但作为一个整体，没有哪一个产品特别令人印象深刻。每个版本都缺少了某些东西。舒特沃斯认为这是一个机会。如果有人能构建出一个伟大的自由软件发行版，帮助\
  \ `GNU/Linux` 推入主流，他将占据一个具有战略意义的位置。\n\n舒特沃斯像许多其他对技术感兴趣的人一样，是 `Debian` 项目的忠实粉丝（本章后部分将深入讨论）。然而，`Debian`\
  \ 的许多方面并不符合舒特沃斯对理想操作系统的愿景。在一段时间内，舒特沃斯考虑过通过竞选 `Debian` 项目领导人来从内部改革 `Debian` 项目。但随着时间的推移，事实证明表明，将\
  \ `GNU/Linux` 推入主流的最佳方式不是 `Debian` 项目内部，因为 `Debian` 在很多情况下保持现状有充分的理由。相反，舒特沃斯将创建一个新项目，与\
  \ `Debian` 共生工作，以构建一个全新的、更好的 `GNU/Linux` 系统。\n\n为了启动这个项目，舒特沃斯在 2004 年 4 月邀请了他认识并尊敬的十余名自由开源软件开发者来到他在伦敦的公寓。正是在这次会议上（引言前几段提到过），`Ubuntu`\
  \ 项目的基础奠定了。那时，许多参与其中的个人对该项目的可能性感到非常兴奋。在伦敦会议期间，团队成员们（他们最终将成长为核心 `Ubuntu` 团队）脑风暴出了一份他们希望在理想操作系统看到的各种功能清单。这份清单现在对大多数\
  \ `Ubuntu` 用户来说是一份熟悉的特性列表。其中许多特征将在本章后部分进行更深入的介绍。该小组想要：\n\n![Image](img/00002.jpeg)\
  \ 可预测且频繁的发布周期\n\n![Image](img/00002.jpeg) 高关注本地化和无障碍访问\n\n![Image](img/00002.jpeg)\
  \ 高关注桌面操作的易用性和用户友好性\n\n![Image](img/00002.jpeg) 高关注将 `Python` 作为单一编程语言，通过它来构建和扩展整个系统\n\
  \n![Image](img/00002.jpeg) 一种由社区驱动的方法，与现有的自由软件项目合作，并让小组在进行过程中不断回馈，而不仅仅是在发布时\n\n\
  ![Image](img/00002.jpeg) 一套围绕发行版构建过程而设计的全新工具，允许开发者在不同项目的生态系统中工作，并允许用户以他们任何的方式进行回馈\n\
  \n小组内达成共识，认为行动胜于言语，因此没有公开的公告或新闻稿。相反，小组为自己设定了一个截止日期——就在不久后的六个月后。舒特沃斯同意资助这项工作，并为开发者支付全职薪水来开发该项目。六个月后，他们将共同宣布他们的项目并展示他们工作的首个产品。他们列了一份在截止日期前想要实现的目标，在场的人员承担了各项任务。他们集体自称为“疣野猪”（Warthogs）。\n\
  \n\n此时，疣野猪团队已经拥有了一支出色的团队、一套目标以及一个如何实现大部分目标的尚可行想法。然而，团队还没有给这个项目命名。舒特沃斯极力主张他们应该将项目命名为\
  \ `Ubuntu`。\n\n`Ubuntu` 是来自几种南非语言（包括祖鲁语 `Zulu` 和科霍萨语 `Xhosa`）的概念和术语。它指的是一种南非意识形态或伦理标准，虽然用英语很难表达，但大致可以翻译为“对他人的仁爱”或“因为了我们，我才是我”。其他人将\
  \ `Ubuntu` 描述为“对连接全人类的普遍共享纽带的信念”。著名的南非人权领袖德斯蒙德·图图主教（Desmond Tutu）曾这样解释 `Ubuntu`：\n\
  \n拥有 `Ubuntu` 精神的人对他是开放且乐于助人的，肯定他人，不会因他人能力或优秀而感到威胁，因为他拥有一种正确的自信，这种自信源于知道自己是一个更大整体的一部分，当他人受到侮辱或削弱、当他人遭受酷刑或压迫时，他随之萎缩。\n\
  \n`Ubuntu` 在种族隔离后的南非作为创始原则发挥了重要作用，直到今天它仍然是大多数南非人熟悉的概念。\n\n舒特沃斯喜欢 `Ubuntu` 作为新项目的名称，有几个原因。首先，它是一个南非概念。虽然大多数参与\
  \ `Ubuntu` 工作的人并非来自南非，但该项目的根源确实如此，舒特沃斯希望选择一个代表这种起源的名字。其次，该项目强调与人的关系，并为深层次社区和共享提供了一个框架——这正是自由软件核心的共享、社区和协作态度。这个术语代表了团队想要与世界分享的自由软件的一面。第三，基于相互尊重和联系的个人关系理念，描述了\
  \ `Ubuntu` 团队想要构建的高功能社区的基本准则。`Ubuntu` 是一个汇聚了项目源于哪里、要去向哪里以及项目计划如何到达那里的术语。\n\n\n\n\
  为了支付工资让开发者全职开发 Ubuntu，Shuttleworth 需要一家公司来雇佣他们。他希望从全球自由开源社区中选拔出最优秀的人来担任这些工作。对于 Shuttleworth\
  \ 来说，不方便的是，这些社区没有国界和地理限制。Shuttleworth 并没有将所有人搬到一个特定的地点和办公室，而是决定通过一家虚拟公司来雇佣这些开发者。虽然这存在高延迟、低带宽连接、不同时区等许多明显的缺点，但在该项目的特定背景下，它也带来了一些巨大的益处。首先，员工的分布式特性意味着新公司可以招聘个人，而无需要求他们收拾行李并搬到另一个国家。更重要的是，这意味着公司里的`每个人`都依赖`IRC`、`邮件列表`和在线通信机制来完成工作。这在无意中自动地解决了困扰许多其他企业资助的自由软件项目的“饮水机问题”——即开发者会在面对面时随口谈论他们的工作，并从而将社区以及任何不在办公室工作的人完全排除在谈话之外。在第一年里，`Canonical`\
  \ 最接近办公室的地方就是 Shuttleworth 在伦敦的公寓。虽然公司已经不断成长，现在在世界各地设有几个办公室，但它仍然保持着分布式的模式，大量的工程师在家里工作。该团队仍然高度依赖互联网协作。\n\
  \n随着时间的推移，公司被命名为 `Canonical`。这个名字呼应了该项目的乐观目标，即成为自由开源软件、特别是 Ubuntu 服务和支持的“官方（canonical）”之地。当然，`Canonical`\
  \ 指的是被接受为权威的事物。它是计算机程序员词汇表中的一个常用词。需要注意的是，成为“官方的”就像成为“标准的的”一样；它并不具有强制性。与拥有垄断不同，成为某事的“官方所在地”意味着类似的成功——但这种成功`绝不是`无法撤销的，也`绝不是`排他性的。其他公司支持\
  \ Ubuntu 并基于它构建操作系统，但只要 `Canonical` 表现良好，它的地位将保持核心地位。\n\n## 什么是 Ubuntu？\n\nWarthogs\
  \ 版本的目标以及 `Canonical` 的旗舰项目是 Ubuntu。Ubuntu 是一个自由开源的 `GNU/Linux` 发行版和操作系统。\n### 什么是发行版？\n\
  \n对于大多数人来说，Ubuntu 是一个操作系统是非常清楚的。但完整的故事要复杂得多。Ubuntu 是所谓的 `GNU/Linux` 发行版——简称为 `distro`。要准确理解这意味着什么，再次需要回顾一点历史。在\
  \ `GNU` 和 `Linux` 的早期，用户需要大量的技术知识；只有极客才需要应用。当时还没有我们通常所说的术语意义上的 Linux 操作系统；没有单一的光盘或一组光片让人们可以使用它来安装\
  \ Ubuntu。相反，软件由几十个甚至上百个独立的程序组成，每个程序由不同的人以不同的方式构建，并分别分发。在最理想的情况下，安装每个必要的应用程序都会耗费大量时间。在许多情况下，不兼容性以及安装软件所需的技巧性技术手段，使得在硬盘上获取一个\
  \ `GNU/Linux` 系统变得困难得令人望步。仅仅为了让系统运行起来，就需要大量的配置和编程知识。结果是，极少数非程序员的人使用过早期的 `GNU/Linux`\
  \ 系统。\n\n早期的发行版是一些项目，它们从所有不同的地方收集所有必要的软件部分，并将它们组合成一种更容易安装的形式，并完成了最基础的配置。这些发行版旨在让使用\
  \ `GNU/Linux` 更加方便，并将其带给更大的用户群体。今天，几乎没有人在不使用发行版的情况下使用 `GNU/Linux`。因此，发行版的名称广为人知。Ubuntu\
  \ 就是这样的项目之一；其他流行的发行版还包括 Red Hat、Fedora、`SUSE`、`Gentoo`，当然还有 `Debian`。\n\n大多数发行版包含相似的软件集合。例如，它们都包含了\
  \ `GNU` 和 `Linux` 内核的大部分核心部分。几乎所有的发行版都包含 `X Window System` 以及在其之上的一个应用程序，可能包括 Web\
  \ 浏览器、桌面环境和办公套件。虽然发行版最初只分发操作系统的核心部分，但它们已经发展到包含了日益广泛的应用程序。现代发行版包含了所有“随操作系统附带”的软件——即几张光盘或\
  \ DVD，其中包含了大多数用户可能需要的且该发行版法律允许分发的任何内容。\n\nUbuntu 与其他当代的发行版一样，提供了自定义安装程序、一个用于在系统安装后安装新软件的软件和服务器的框架、一种可以配置许多程序的标准配置方法、一种用户报告软件\
  \ Bug 的标准方法以及更多功能。经常，发行版还包含可以通过互联网访问的服务器上的大型软件仓库。为了感受其规模，Ubuntu 在其中央服务器上包含了 40,000\
  \ 多件软件；每件软件都经过了微调和测试，以确保与系统上的所有其他软件良好协作。软件片段的数量每天都在增长。\n\n重要的是，发行版的创建者在大多数时候并没有编写或创建你所使用的应用程序。Ubuntu\
  \ 团队没有编写 `Linux`，也没有编写 `GNU`——尽管团队中的个人对这两个项目都做过贡献。相反，Ubuntu 团队获取 `GNU`、`Linux` 以及数千个其他应用程序，然后对它们进行测试和集成，以便在单一安装程序下访问。Ubuntu\
  \ 是胶水，让你能够通过单张光盘安装数百个独立的软件部分，并让这些片段作为一个单一的、集成的桌面系统协同工作。如果你拿起另一另一个发行版的光盘（如 `Debian`、`Red\
  \ Hat` 或 `Novell`），安装的软件与 Ubuntu 的软件几乎相同。区别在于软件安装、服务、升级和呈现的方式，以及它与系统中其他软件的方式。\n\n\
  ### 发行版生态系统\n\n今天，有数百个 `GNU/Linux` 发行版正在活跃使用。查看 Distrowatch 的数据库（`distrowatch.com`）就可以看到惊人的数量和增长。最早的\
  \ `GNU/Linux` 发行版之一被称为 `Softlanding Linux System` (`SLS`)。由于许多原因，名为 Patrick Volkerding\
  \ 的程序员认为他可以改进 `SLS`。由于 `SLS` 是自由软件，Volkerding 有权制作 `SLS` 的衍生版本并进行分发。Volkerding 正是这样做，他获取\
  \ `SLS` 的代码并将其作为框架或模型，创建了自己的名为 `Slackware` 的变体。随后，`Slackware` 成为第一个广泛成功的 `GNU/Linux`\
  \ 发行版，并维护至今。\n\n\n\n\n尽管存在这种多样性，但大多数衍生发行版都可以追溯到两个母发行版之一：Red Hat（红帽）或 Debian。虽然没有必要理解这些项目差异的细节，但了解\
  \ Red Hat 和 Debian 提供了两个具有吸引力但经常不同的平台是非常有用的。每个项目都有其优缺点。对于几乎每个创建基于 Linux 的操作系统的团体来说，这些项目中的某一个都当了起点（有少数显著的例外，例如\
  \ Gentoo 项目）。\n\n然而，尽管派生发行版的过程允许了满足多样化需求的 OS 平台层出不穷，但从历史角度看，这种派生过程在很大程度上是一个单向过程。基于\
  \ Red Hat 的新发行版——例如 `CentOS` 和 `SUSE`——从 Red Hat 或 Red Hat 子集开始，然后从那里进行定制和分化。这些变化中极少能回馈\
  \ Red Hat，随着时间的推移，各个发行版往往会分化到产生无法调和的冲突兼容性程度。虽然每个系统包含的软件在所有发行版中保持基本一致，但软件的打包、呈现、安装和配置方式变得日益差异化。这一过程的结果是，发行版之间的共享与协作变得越来越困难。\n\
  \n这种日益增长的分化表明，发行版团队在将更改推送到上游时面临着更普遍的问题。`GNU/Linux` 发行版的用户经常发现并报告软件中的问题。发行版团队也经常修复这些错误。虽然这些错误有时源于发行版引入的更改，但它们通常存在于软件的上游版本中，且修复适用于所有发行版。并不罕见（但不幸的是频率少得多）的情况是将这些错误修复推送到上游，以便所有发行版和用户都能使用。这种协作的缺乏很少是由于恶意、无能，或开发者或其雇主做出的任何战术或战略决策。相反，跨发行版以及与上游开发者相关的更改跟踪和监控是复杂且困难的。生活事实是，有时更改会落空。这些失败仅仅是发行版构建过程、政策和工具的产物，这些工具将发行版视为产品，而不是生态系统中的过程。\n\
  \n与许多其他发行版一样，`Ubuntu` 是 `Debian` 的衍生版。与许多衍生版的创建者不同，`Ubuntu` 社区已将其一个首要目标设定为探索与 Debian、Debian\
  \ 和 Ubuntu 的共同上游（例如 `Linux` 或 `GNU` 等项目）以及 Ubuntu 自身的衍生版之间建立更好派生过程的可能性。对 Debian\
  \ 进行更深入的讨论有助于解释 Ubuntu 在自由软件世界中是如何定位自己的。\n\n\nDebian 是一个由数百名官方成员以及更多志愿者工作者和贡献者组成的志愿者项目支持的发行版。它已经扩展到包含超过\
  \ 45,000 个自由和开源应用程序软件包及文档。Debian 的历史和结构使其非常擅长某些领域。例如，Debian 在集成包管理和访问大量自由软件应用程序方面拥有实至名归的。然而，作为一个志愿者且在很大程度上是非层级的组织，Debian\
  \ 在提供频繁且可靠的发布、企业支持与责任以及自上而下的一致性方面面临着挑战。\n\n每个新发行版的存在都有其原因。创建一个新的发行版，即使是衍生版，也非易事。在很大程度上，Ubuntu\
  \ 的存在是为了基于 Debian 项目的许多成功，同时解决它苦恼的一些问题。其目标是创建一个整体，吸引那些此前无法或不愿使用 Debian 的用户。\n\n\
  在基于 Debian 项目以及 `GNU`、`Linux` 以及 Debian 构建在其的其他项目的伟大工作的基础上，Ubuntu 团队希望探索一种新的派生风格，重点关注不同开发者组成的生态系统内部更紧密的项目间关系。虽然\
  \ Ubuntu 试图改进并基于 Debian 的成功进行构建，但该项目完全没有试图取代 Debian。相反，如果没有 Debian 项目及其庞大的志愿者和软件基础，以及\
  \ Debian 持续提供的高质量，Ubuntu 将无法存在。Ubuntu 和 Debian 之间的这种共生关系体现在 Ubuntu 和 Debian 都高度依赖\
  \ `GNU` 和 `Linux` 等项目来产生优秀的软件的方式上，它们都可以对这些软件进行打包和分发。Ubuntu 项目明确提出要与 Debian 及其共同的“上游”建立共生关系。\n\
  \nUbuntu 和 Debian 之间的关系并不简单、直接或无痛，而是涉及到双方的耐心和学习。虽然这种关系尚未完美，但随着时间的推移，它一直在不断改进，两个小组都找到了合作的方法，这些方法似乎比传统的“派生并遗忘”模型提供了重大的利益。正是通过一系列复杂的技术、社会甚至政治过程——其中许多过程在本章的其余部分中进行了描述——Ubuntu\
  \ 试图创建一种构建自由软件发行版的更好方法。\n\n## Ubuntu 社区\n\n如果没有 Ubuntu 社区，Ubuntu 就不会今天的模样。即使 `Ubuntu`\
  \ 这个词的定义也是围绕社区中人的互动展开的。Ubuntu 社区及其组织方式，以及选择加入的人如何参与，在第 11 章中进行了详细讨论。\n\n## Ubuntu\
  \ 的承诺与目标\n\n到目前为止，本节研究了 Ubuntu 项目的前史、历史和背景。在本章之后，本书将重点关注发行版本身。在继续之前，理解激励该项目的目标至关重要。\n\
  \n### 哲学目标\n\nUbuntu 项目最重要的目标在本质上是哲学性的。Ubuntu 项目在其网站的一系列文件中列出了其哲学。在这些核心文档中，团队总结了章程以及主要的哲学目标和基础。\n\
  \n![Image](img/00002.jpeg) **我们的哲学**\n\n我们的工作受软件自由哲学的驱动，旨在将软件的好处带到世界的每一个角落。Ubuntu\
  \ 哲学的核心是这些核心理念：\n\n1. 每个计算机用户都应该有自由下载、运行、复制、分发、学习、共享、更改和改进软件，而无需支付许可费。\n2. 每个计算机用户都应该能够以他们选择的语言使用软件。\n\
  3. 每个计算机用户都应该被给予使用软件的机会，即使他们面临残疾。\n我们的哲学反映在我们生产并包含在发行版中的软件中。因此，我们分发的软件的许可条款是根据我们的哲学进行衡量的。\n\
  \n当你安装 Ubuntu 时，几乎所有安装的软件已经符合了这些理念，我们正努力你需要的每种软件都能以提供相应自由的许可可用。\n\n目前，我们对某些仅以二进制形式提供的“驱动程序”做了特殊例外，如果没有它们，许多计算机将无法完成\
  \ Ubuntu 安装。我们将这些驱动程序放在系统的受限区域，这样如果你不需要它们，就可以很容易地删除。\n\n\n\n\n\n对于 Ubuntu 而言，自由软件中的“free”（自由）主要指的是自由，而不是价格——尽管我们致力于不向\
  \ Ubuntu 收费。Ubuntu 最重要的一点是，它赋予了安装和使用它的人软件自由权。这些自由让 Ubuntu 社区能够成长，并继续共享他们的集体经验和专业知识，以改进\
  \ Ubuntu 并使其适用于新的国家和新的行业。\n\n## 自由软件与开源\n\n援用自由软件基金会的“什么是自由软件？”，自由软件的核心自由被定义为：\n\
  \n![Image](img/00002.jpeg) 为任何目的运行程序的自由\n\n![Image](img/00002.jpeg) 研究程序如何工作并根据你的需求对其修改的自由\n\
  \n![Image](img/00002.jpeg) 重新传播副本的自由，以便你可以帮助他人\n\n![Image](img/00002.jpeg) 改进程序并将你的改进发布给公众以使所有人受益的自由\n\
  \n![Image](img/00002.jpeg) `Open source`\n\n“开源”是一个 1998 年提出的术语，旨在消除英语单词 *free*\
  \ 的歧义。开源倡议在《开源定义》中描述了开源软件。开源继续享有增长的成功和广泛的认可。\n\nUbuntu 乐意自称为开源的。虽然有些人将自由和开源视为具有不同目的的竞争运动，但我们并不认为自由软件和开源软件是相互独立或不兼容的。Ubuntu\
  \ 自豪地包含了认同这两种运动的成员。\n\n\n在这里，Ubuntu 项目明确了其目标：每个软件用户都应该拥有自由软件所需的自由。这在许多原因上非常重要。首先，它为用户提供了运行更好、更快、更灵活的软件的所有实际利益。更重要的是，它赋予了每个用户超越其软件用户和消费者角色的能力。Ubuntu\
  \ 希望软件是赋性的，并按照用户希望的方式运行。Ubuntu 希望所有用户都有能力确保它为他们服务。为了做到这一点，软件*必须*是自由的，因此 Ubuntu 将此视为一项要求和一个哲学承诺。\n\
  \n当然，Ubuntu 的核心目标并不止于自由软件的定义。相反，项目阐述了两个新但同样重要的目标。第一个是所有计算机用户都应该能够他们选择的语言使用计算机，这是为了回应这样一个事实：世界上大多数人口不说英语，而绝大多数软件只用这种语言进行交互。为了有用，源代码注释、编程语言、文档以及计算机程序中的文本和菜单必须用*某种*语言编写。可以争论的是，世界上最国际化的语言是一个相当好的选择。然而，没有一种语言是所有人都会说的，英语对于世界上大多数不说英语的人来说是没有用用的。计算机可以成为赋能和教育的伟大工具，但*仅当*用户能够理解计算机界面上的词汇时如此。因此，Ubuntu\
  \ 认为项目以及社区的责任是确保*每*一个用户都能轻松使用 Ubuntu 用他们最擅长的语言进行读和写。\n\n进行修改的能力——自由软件以及 Ubuntu 第一个哲学观点的要求——使得这种翻译成为可能。这本书就是一个很好的例证。虽然它只帮助向世界上已经说英语的相对较小部分的人解释\
  \ Ubuntu，但选择用英语写这本书是为了让它产生最广泛的影响。更重要的是，它是根据知识共享许可协议分发的，该协议允许翻译、修改和重新传播。这本书的作者无法用世界上所有的语言来写这本书——甚至无法用其中多一种语言来写。相反，我们试图消除不必要的法律限制和其他可能阻碍社区承担翻译工作的障碍。结果，几个版本的完整文本已翻译成德语、日语、波兰语和西班牙语等语言。\n\
  \n最后，就像没有人应该仅仅因为不认识某种语言而被阻止使用计算机一样，任何用户也不应该因为残障而被阻止使用计算机。Ubuntu 必须让有运动障碍、视觉障碍和听力障碍的用户能够使用。它应该提供各种形式的输入和输出，以考虑到每种情况和其他情况。世界上最聪明、最有创造力的人中，也有很大比例的人患残障。当\
  \ Ubuntu 具有包容性时，它的实用性不应受到限制。更重要的是，Ubuntu 希望欢迎并利用这些个人作为社区成员的能力，建立一个更好、更高效的社区。\n\n\
  ### 行为目标与行为准则\n\n如果说 Ubuntu 的哲学承诺描述了 Ubuntu 项目的“为什么”，那么行为准则（CoC）描述了 Ubuntu 的“如何做”。Ubuntu\
  \ 的 `CoC` 疑是 Ubuntu 社区日常运营中最重要的文档，它为项目内部的工作和合作制定了基本规则。对该文档的明确同意是成为官方认可的 Ubuntu 活动者的唯一标准，也是成为项目成员的必要步骤。签署\
  \ Ubuntu 行为准则并成为 Ubuntu 成员在第 11 章中有更深入的描述。\n\n`CoC` 涵盖了“当项目根据我们的行为进行判断时，在公共或私下的行为”。`CoC`\
  \ 对以下标题下的系列观点进行了一定程度的探讨：\n\n![Image](img/00002.jpeg) 体贴他人。\n\n![Image](img/00002.jpeg)\
  \ 尊重他人。\n\n![Image](img/00002.jpeg) 协作。\n\n![Image](img/00002.jpeg) 当你意见不同时，咨询他人。\n\
  \n![Image](img/00002.jpeg) 当你不确定时，寻求帮助。\n\n\n这些标题中的许多内容对许多人来说是常识或基本的礼貌，这正是设计的初衷。`CoC`\
  \ 中没有任何内容是具有争议或激进的，它从未被设计成那样。\n\n更困难的是这些事情很难执行或决定，因为体贴、尊重和协作的行为往往是主观的。对于诚实的分歧和偶尔的情感伤害是有空间的。这些是可以接受的缺陷。`CoC`\
  \ 设计并不是成为一部对短语、语言或行为有明确禁止的法律。相反，它旨在提供一份宪法，并提醒人们体贴和尊重的讨论对于项目的健康和活力*至关重要*。在对于社区成员是否违反或正在违反准则存在严重分歧的情况下，社区委员会（在第\
  \ 11 章中有深入讨论的机构）可以调解争议并决定应该采取什么行动（如果有）。\n\n参与 Ubuntu 项目的任何人，包括 Mark Shuttleworth\
  \ 和社区委员会的其他成员，都不高于 `CoC`。`CoC` *从不*是可选的，也*从不*被豁免。当然，行为准则的设计绝不是为了消除冲突或分歧。争论在 Ubuntu\
  \ 中与其他项目和在线社区中一样常见。然而，项目内部有一个共识，争论应该在协作和相互尊重的环境中进行。这使得*更好*的争论产生*更好*的结果，并且减少了的伤害和自尊心的受损。\n\
  \n\n\n\n\n# 虽然行为准则（CoC）有时会被误用，但它并不是在争论中用来攻击对手的武器。相反，它提供了实用的参考点，让我们可以在 Ubuntu 社区内达成共识。更常见的情况下，如果社区中的某个小组认为某个成员的行为违反了准则，该小组会温和地提醒该成员（通常是私下）行为准则正在生效。在几乎所有情况下，这足以避免任何进一步的行动或冲突。极少数违反行为准则的行为会提交给社区委员会。\n\
  \n## 技术目标\n\n虽然尊重的社区和对一系列哲学目标的遵循为 Ubuntu 项目的运作提供了重要框架，但 Ubuntu 根本上是一个技术项目。因此，除了哲学目标和项目章程外，Ubuntu\
  \ 拥有一套技术目标也是合理的。\n\n项目的第一个技术目标，可能也是最重要的一个目标，是协调定期且可预测的发布。2004 年 4 月，在 Warthogs 会上，该项目为六个月后的初始概念验证发布设定了目标。部分归功于该项目的巨大成功，很大程度上归功于\
  \ GNOME 的发布计划，团队一直坚持定期且可预测的六个月发布周期，且仅有一次选择延长发布计划——为了确保第一个 LTS 版本万无一失而延长了六周——而且是在获得社区对该决定的共识后才这样做。随后团队加倍了努力，仅用四半个月就完成了下一次发布，使发布计划重回正轨。频繁发布非常重要，因为用户因此可以使用最新、最强大的免费软件——这对于像自由软件社区这样充满活力、快速变化且不断改进的开发环境来说是必要的。可预测的发布很重要，特别是对于企业而言，因为这意味着它们可以围绕\
  \ Ubuntu 组织业务计划。通过持续的发布，Ubuntu 可以提供一个企业和派生发行版可以赖以增长和构建的平台。\n\n虽然频繁且可靠地发布很重要，但发布的软件必须得到支持。Ubuntu\
  \ 与所有发行版一样，必须面对所有软件都存在漏洞的事实。大多数漏洞是微小的，但修复它们可能会引入更糟糕的问题。因此，发布后的漏洞修复必须谨慎进行，或者根本不修复。Ubuntu\
  \ 项目仅在更改可以经过广泛测试时，在发布之间进行包括修复修复在内的重大变更。然而，某些漏洞存在丢失用户信息的风险，或构成严重的安全漏洞。这些漏洞会被立即修复，并作为更新提供给已发布的发行版。Ubuntu\
  \ 社区努力在发布前发现并尽量减少所有类型的漏洞，并在消灭最严重的漏洞方面取得了巨大成功。然而，由于始终可能发现更多此类漏洞，Ubuntu 承诺在每个版本发布后的九个月内对其提供支持。对于\
  \ LTS 版本，例如最初的 LTS（Ubuntu 6.06 LTS，于 2006 年发布），项目远超了这一标准，承诺在桌面电脑上支持整整三年，在服务器配置上支持五年。这项政策深受企业、机构和\
  \ Ubuntu 服务器用户的青睐，以至于在 2008 年和 2010 年，Ubuntu 8.04 LTS 和 10.04 LTS 发布时也包含了类似的三年和五年桌面及服务器扩展支持承诺。从\
  \ 12.04 LTS 版本开始并持续到 16.04 LTS 版本，桌面和服务器版本现在都获得自发布之日起五年的支持。\n\n这种针对服务器和桌面的二分法方法意味着\
  \ Ubuntu 项目的第三大主要技术承诺：以独立但同等重视的模式支持服务器和桌面电脑。虽然 Ubuntu 在桌面配置中继续广为人知且可能更受欢迎，但确实存在专注于服务器和桌面用户的\
  \ Ubuntu 开发者团队。Ubuntu 项目认为桌面和服务器都是至关重要的，因此它在每个桌面发布版的 DVD 上都提供了安装方法，在每个服务器发布版的 CD\
  \ 上也同样提供。Ubuntu 提供了适用于两种环境中最常见操作的经过测试和支持的软件，并为每种环境提供了文档。本书包含了在桌面和服务器上运行 Ubuntu 的信息。带有长期支持的\
  \ 6.06 LTS 发布成功地为 Ubuntu 可的长期服务器支持铺平了道路，并帮助了现在充满活力的 Ubuntu 服务器社区。8.04 LTS 发布通过更更新的平台重复了这一成功，随后是\
  \ 10.04 LTS，直到现在的 16.04 LTS。\n\n\n## Bug #1\n\n当然，Ubuntu 的目标不仅仅是构建一个符合我们哲学或技术目标的操作系统，并按照我们的方式来实现——尽管如果我们只实现了这一结果，我们也可能很乐意。我们的最终目标，一个凌于所有其他目标并影响它们的目标，是将我们伟大的软件、频繁的发布以及我们哲学中所载的自由传播到尽可能多的计算机用户手中。Ubuntu\
  \ 的最终目标不是成为世界上最使用的 GNU/Linux 发行版；而是成为世界上最广泛使用的操作系统。\n\n为 Ubuntu 记录的第一个 bug 说明了这一事实。该\
  \ bug 由 Shuttleworth 提交并标记为严重（critical），至今仍处于开启状态，可以在 `https://launchpad.net/ubuntu/+bug/1`\
  \ 在线查看。bug 的文本如下：\n\n```\n微软占据了大部分市场份额 | 非自由软件阻碍 IT 行业的创新，限制了全球一小部分对 IT 的访问，并限制了软件开发者在全球范围内充分发挥其潜力。这个\
  \ bug 在 PC 行业中显而易见。\n```\n\n复现步骤：\n\n1. 访问本地 PC 商店。\n\n发生的情况：\n\n2. 观察到销售的大多数 PC\
  \ 都预装了非自由软件。\n3. 观察到极少预装了 Ubuntu 和自由软件的 PC。\n\n应该发生的情况：\n1. 大多数销售的 PC 应该包含 Ubuntu\
  \ 等自由软件。\n2. Ubuntu 应该以某种方式进行营销，使其惊人的功能和优点对所有人周知。\n3. 系统随着时间的推移应该变得越来越易用。\n\n\n\n\
  \n许多人将 Ubuntu 在过去几年中的成功描述为不可思议。对于一个新的 `GNU/Linux` 发行版来说，这种成功的程度和速度是前所未有的。在此期间，Ubuntu\
  \ 恰充分履行了其在哲学和技术上的承诺，实现了许多目标，并建立了一个充满活力的用户和贡献者社区。他们在尊重和理解的文化中进行协作，完全符合《Ubuntu 行为准则》，并取得了丰碑式的成就。然而，`Bug\
  \ #1` 表明只有当 Ubuntu 的自由、技术卓越和行为标准成为软件世界`处处`的常态时，Ubuntu 项目才会被宣布为完全成功。\n\n2013 年 5\
  \ 月 30 日，Mark Shuttleworth 用这段话正式关闭了 `Bug #1`，这也结束了本节的讨论：\n\n如今的个人计算比 2004 年是一个更广泛的话题：手机、平板电脑、可穿戴设备和其他设备都是我们数字生活的一部分。从竞争的角度来看，这个更广阔的市场有着健康的竞争，`IOS`\
  \ 和 `Android` 占据了相当的份额（参见 [www.zdnet.com/windows-has-fallen-behind-apple-ios-and-google-android-7000008699/](http://www.zdnet.com/windows-has-fallen-behind-apple-ios-and-google-android-7000008699/)\
  \ 以及特别是 [`cdn-static.zdnet.com/i/r/story/70/00/008699/meeker620-620x466-620x466.jpg?hash=ZQxmZmDjAz&upscale=1`](http://cdn-static.zdnet.com/i/r/story/70/00/008699/meeker620-620x466-620x466.jpg?hash=ZQxmZmDjAz&upscale=1)）。\n\
  \n`Android` 可能不是你或我的首选 Linux 系统，但它无疑是一个开源平台，为用户和行业提供了实用的和经济上的利益。因此，在个人计算领域，我们既有竞争，也有开源的良好代表。\n\
  \n尽管我们在这一转变中只起了很小的作用，但我认为意识到这种转变已经发生是很重要的。因此，从 Ubuntu 的角度来看，这个 bug 现在已经关闭。\n\n当然，这个\
  \ bug 报告也包含社会因素。对许多人来说，它是某种意图的宣言。但我们最好将意图集中在自身的卓越上，而不是对他人产品的影响上。自这个 bug 提交以来的多年里，我们已经弄清楚了如何在云端做到卓越，我希望很快也能学会如何在开发者的桌面端做到卓越，也许甚至能为跨越这一全范围设备的日常用户做到卓越。我更宁愿我们能找到一个赞扬这些见解和领导力的号召。\n\
  \n值得注意的是，如今，如果你热衷云计算，微软的 `IAAS` 团队在技术上非常卓越，而且非常致力于让包括 Ubuntu 等 Linux 客在内的所有操作系统在\
  \ `Azure` 上运行得非常出色，这使得与他们合作成为了一件愉快的事。也许市场的转变在其中起了作用。情况已经发生了，机构已经适应了；我们理应该如此。\n\n\
  沿着这条思路，反思自 2004 年以来发生了多少变化，以及变化有多快，是有意义的。对于 Ubuntu 来说，我们的目标仍然是提供极佳体验：针对开发者、针对构建生产基础设施的人、以及针对各种设备上的终端用户。我们正处于每十年完全改变一次的环境中做这一切。因此，我们必须愿意自己做出巨大的改变——在我们的流程、实践、工具和人关系中。改变这个\
  \ bug 的状态只是一个微小的例子。\n\n\n虽然 Ubuntu 是由社区驱动的，但有几个团体在它的结构和组织中发挥着重要作用。其中最领先的是 `Canonical,\
  \ Ltd.`，这是一个作为 Ubuntu 历史描述的一部分引入的营利公司；以及在本节后面介绍的 `Ubuntu Foundation`（Ubuntu 基金会）。\n\
  \n### Canonical, Ltd\n\n`Canonical, Ltd.` 是 Mark Shuttleworth 的公司，主要目标是开发和支持 Ubuntu\
  \ 发行版。Ubuntu 的许多核心开发者——尽管他们不再占多数——作为 `Canonical, Ltd.` 的员工全职或兼职工作。这种来自 `Canonical`\
  \ 的资金支持让 Ubuntu 能够做出它所承担的支持承诺。Ubuntu 可以声称将在六个月内发布，因为以某种形式发布是 `Canonical` 的薪资员工可以确保的。作为一个完全由志愿者组成的组织，`Debian`\
  \ 面临无法设定和满足截止日的困扰——志愿者可能会变得忙，或者在他们的全职工作中有其他优先的截止日期。通过为部分开发者提供付费工作，`Canonical` 可以设定支持和发布截止日期，并确保它们的实现。\n\
  \n通过这种方式，`Canonical` 确保了 Ubuntu 底线承诺的履行。当然，`Canonical` 没有资助所有的 Ubuntu 工作，也无法做到。`Canonical`\
  \ 可以每个月发布`一个发行版`，但该发行版将通过用户社区的贡献变得`好得多`且更好用。大多数功能、大多数新软件、几乎所有翻译、几乎所有文档以及更多都是在 `Canonical`\
  \ 之外创建的。相反，`Canonical` 确保截止期的达成，并确保核心工作（无论是否有趣）得以完成。\n\n`Canonical, Ltd.` 在曼恩岛（Isle\
  \ of Man）注册——这是一个位于威尔士和爱尔兰之间的小岛国，主要作为国际企业的避风港而闻名。由于 `Canonical` 的大部分员工遍布全球，不需要正式办公室，曼恩岛似乎是公司挂牌的好地方之一。\n\
  \n2010 年初，`Canonical` 的首任 CEO Mark Shuttleworth 辞职，公司的长期首席运营官 Jane Silber 成为新 CEO。Shuttleworth\
  \ 保留了其 Ubuntu 社区委员会主席的职位。他将精力放在产品设计以及与企业客户和合作伙伴合作，并将 `Canonical` 的日常运营交给 Silber。Silber\
  \ 在第一个版本发布之前就在 `Canonical` 工作，预计该公司将继续按照目前的路径扩张和运营。\n\n### Canonical 的服务与支持\n\n\
  虽然许多用户对此感到惊讶，但 `Canonical` 的员工中只有一半在负责 Ubuntu 项目。其余员工分为几类：业务开发、支持与管理，以及其他项目的开发。\n\
  \n参与业务开发的人员帮助与其他公司建立战略性交易和认证计划——主要围绕 Ubuntu。在很大程度上，这些是社区不擅长处理或作为一个整体他们不感兴趣的事情。业务开发工作的一个例子是与公司合作，确保他们的软件（通常是专有的）可以在\
  \ Ubuntu 上进行构建并通过认证。例如，`Canonical` 与 `IBM` 合作，确保其流行的 `DB2` 数据库可以在 Ubuntu 上运行，并在实现这一点后，致力于将\
  \ Ubuntu 认证为运行 `DB2` 的平台。同样，`Canonical` 与 `Dell` 合作，确保 Ubuntu 可以作为客户的选择安装并支持在 `Dell`\
  \ 笔记本电脑和台式机上。第三例子是这本书的制作，虽然它是由 Pearson 的 Prentice Hall 出版的，但它是与 `Canonical` 合作的产物。\n\
  \n\n\n\nCanonical 通过三种方式在 Ubuntu 项目中发挥着重要的支持作用。首先，它支持 Ubuntu 项目的发展。例如，Canonical\
  \ 的系统管理员维护着支持 Ubuntu 开发和分发的服务器。其次，Canonical 通过提供电话和电子邮件支持，直接帮助 Ubuntu 用户和企业。此外，Canonical\
  \ 还通过与大型公司和组织安排支持合同，帮助建立了一个庞大的商业 Ubuntu 支持运营体系。这种支持是在社区提供的免费（即 *gratis*）支持之外的额外；这种商业支持是收费的，既可以是长期固定费用支持合同的一部分，也可以按实例付费的方式交付。通过以多种方式为\
  \ Ubuntu 提供商业支持，Canonical 为自己开辟了一项业务，并帮助 Ubuntu 成为中小型企业更具吸引力的选择，这些企业正在寻找像其他商业 GNU/Linux\
  \ 发行版那样提供支持合同的企业或企业级 GNU/Linux 产品。\n\n最后，Ubuntu 还支持其他支持组织。Canonical 并不寻求或试图强制对 Ubuntu\
  \ 支持进行垄断；它在 Ubuntu 网页上自豪地列出了数百个其他提供 Ubuntu 支持的组织。相反，Canonical 向这些组织提供所谓的“二级支持”。由于\
  \ Canonical 雇用了许多 Ubuntu 核心开发者，该公司非常适合处理这些支持组织可能遇到的许多困难问题。凭借其集中的专业知识，Canonical 可以为这些组织提供这种备份或次级支持。\n\
  ### Bazaar 和 Launchpad\n\n除了对 Ubuntu 的支持和开发外，Canonical 有限还资助了分布式版本控制工具 `Bazaar`\
  \ 的开发以及 `Launchpad` 项目。`Bazaar` 是一种用于软件开发的工具，它在 Ubuntu 中被广泛使用，并在塑造 Ubuntu 的技术过程中起着重要作用。然而，尽管该软件的功能与\
  \ `CVS`、`Subversion` 或 `BitKeeper` 等其他版本控制系统相似，但在其他许多项目中也有用。更重要的是，`Bazaar` 是 `Launchpad`\
  \ 背后的骨干。\n\nCanonical 一半以上的技术员工致力于 `Launchpad` 项目。`Launchpad` 是一个雄勃的基于 Web 的超结构应用程序，由几个高度集成的工具组成。该软件在\
  \ Ubuntu 开发中起着核心作用，也被用于其他发行版的开发，特别是基于 Ubuntu 的发行版。\n\n`Launchpad` 及其组件在第 9 章中进行了更深入的讨论。`Launchpad`\
  \ 在 Ubuntu 项目中的重要性怎么强调都不为过。除了处理错误、翻译和发行版构建外，`Launchpad` 还处理网站身份验证，并将 Ubuntu 项目中的团队成员关系编码。它是所有\
  \ Ubuntu 工作被跟踪和记录的地方。Ubuntu 社区的任何成员以及以几乎任何方式为 Ubuntu 贡献的任何人都会在适当在 `Launchpad` 创建账户。\n\
  \n## Ubuntu 基金会\n\n最后，除了 Canonical 和整个 Ubuntu 社区外，Ubuntu 项目还得到了 `Ubuntu Foundation`（Ubuntu\
  \ 基金会）的支持，该基金由 Shuttleworth 宣布，承诺初始资金 1000 万美元。该基金与 Canonical 一样，位于曼恩岛。该组织受 `Ubuntu\
  \ Community Council`（Ubuntu 社区委员会）的建议。\n\n与 Canonical 不同，`Ubuntu Foundation` 在 Ubuntu\
  \ 的日常生活中并不发挥活跃作用。目前，该基金会仅仅是一笔用于捐赠和确保 Ubuntu 未来的资金。由于 Canonical 是一家年轻的公司，某些公司和个人早期很难信任\
  \ Canonical 能够在其声称的时间范围内（例如三到五年）为 Ubuntu 提供支持。`Ubuntu Foundation` 的存在是为了消除这些恐惧。时间和一致性也极大地建立了公司和个人对\
  \ Ubuntu 的信心，基金将一直存在以确保未来的一致性。\n\n如果 Shuttleworth 或 Canonical 发生了任何意外，导致其中一方无法支持\
  \ Ubuntu 开发和维护发行版，`Ubuntu Foundation` 的存在是为了在很远的未来继续开展 Canonical 的许多核心活动。通过基金的存在，Ubuntu\
  \ 项目可以做出它所做的那些长期承诺和保证。\n\n基金会可以且确实进行的唯一活动是代表 Ubuntu 项目接收捐赠。这些捐赠（仅限这些捐赠）将根据开发团队和\
  \ `Technical Board`（技术委员会）的意愿代表 Ubuntu 诸。在大多数情况下，这些贡献被用于向为 Ubuntu 项目实现重要功能目标的社区成员发放“赏金”。\n\
  \n## 愿景之外：Ubuntu 子项目、变体和衍生版\n\n如果不对不断增长的 Ubuntu 子项目和变体（Flavors）表示认可，那么对 Ubuntu 的介绍就是不完整的。虽然\
  \ Ubuntu 源自 `Debian`，但该项目也开发了许多自己的变体。\n\n其中第一个是 `Kubuntu`——这是一个使用 `KDE` 而非 `Unity`\
  \ 作为默认环境的 Ubuntu 版本。作为一种变体而非衍生版，`Kubuntu` 与 Ubuntu 的关系与 Ubuntu 与 `Debian` 之间的关系不同。从技术角度来看，`Kubuntu`\
  \ 完全存在于发行版内部。在组织上，`Kubuntu` 团队也完全在 Ubuntu 内部工作。\n`Edubuntu` 项目也有类似的组织，旨在帮助开发 Ubuntu，以便发行版的配置能够轻松且有效地在学校中使用。尽管该项目在最近经历了一些变化，但它仍然专注于教育和学校相关的软件，以及\
  \ Linux 终端服务器项目 (`LTSP`) 的设置，该设置允许学校使用一个或多个强大的服务器以及许多连接到服务器并从其运行软件的“哑终端”（终端）来运行许多学生的计算机。这种相对简单的技术手段在教育环境中转化为巨大的成本节约。\n\
  \n`Xubuntu` 项目基于轻量级窗口管理器 `Xfce`。`Xubuntu` 设计用于适用于内存较少或处理器较慢的旧电脑或性能较低的电脑——或者仅供那些喜欢更快速响应和更精简的功能集的人。虽然最初是一个非官方项目，但\
  \ `Xubuntu` 广受欢迎，并作为核心发行版的官方部分被集成。\n\n这些或其他变体在第 9 章中得到了讨论。\n\n在某种程度上，正是通过这些变体，Ubuntu\
  \ 项目的工作和目标才汇聚并结晶化。只有通过自由开源运动对自由访问源代码的承诺，Ubuntu 才能被构建出来。同样，只有通过 Ubuntu 对这些理想的持续承诺，衍生版才能从\
  \ Ubuntu 中产生。\n\n\n\n\n在 Ubuntu 之外，Canonical 的工作很大程度上基于 `Launchpad` 和 `Bazaar` 等软件项目，这些项目旨在精确地促进这种派生过程。这种过程如果操作得当，它描述了一个让*每个人*都能受益的开发生态系统——包括派生版本、Ubuntu\
  \ 以及 Ubuntu 的上游项目。只有通过这种变体（flavors）的创建过程，每个人才能得到他们想要的东西。变体的创建如果执行正确，可以允许群体在需要时进行分化，而在可能的情况下进行协作。最终，这将带来更多工作的完成、更多快乐的用户以及更广泛的协作。通过这种增强的协作，Ubuntu\
  \ 的哲学和技术目标将得以实现。通过这种有意义的合作（包括项目内部和外部），Ubuntu 惊人的增长将持续到未来。\n\n### 总结\n\n本章探讨了更好的发行版和操作系统的愿景是如何演变为\
  \ Ubuntu 这一现象的。它涵盖了 Ubuntu 与 Canonical 有限公司以及 Ubuntu 基金会之间的关系，并讨论了超出原始愿景的各种 Ubuntu\
  \ 子项目、变体和衍生版本。\n## 第 2 章：安装 Ubuntu\n\n* * *\n\n![Image](img/00003.jpeg) 选择您的 Ubuntu\
  \ 版本\n\n![Image](img/00003.jpeg) 获取 Ubuntu\n\n![Image](img/00003.jpeg) 启动与安装\n\n\
  ![Image](img/00003.jpeg) 从极简 CD 安装\n\n![Image](img/00003.jpeg) 总结\n\n* * *\n\n###\
  \ Ubuntu 简介\n\n如果你正在阅读这里，可能可以假设你已经决定尝试一下 Ubuntu。你会发现，Ubuntu 不仅作为一个操作系统来说是灵活且强大的，在评估和安装它的方式上也是如此。\n\
  \n尝试 Ubuntu 非常简单。Ubuntu 桌面 DVD 是一张特殊的“实况”（live）光盘。你可以使用这张光盘直接从 DVD 运行 Ubuntu，而 Ubuntu\
  \ 不会移除甚至与你的硬盘产生交互。如果你已经在使用 Windows 或 Mac OS X 等其他操作系统，这种方法是理想的；你可以通过运行 DVD 来尝试 Ubuntu，而不必担心它会覆盖硬盘上的数据或更改你当前操作系统的任何部分，除非你故意选择这样做。\n\
  \n### 选择您的 Ubuntu 版本\n\nUbuntu 背后的开发者一直努力让软件的安装尽可能简单和灵活。他们理解，人们会在不同用途的电脑（桌面电脑、服务器、笔记本电脑等）上安装\
  \ Ubuntu，并使用不同类型的电脑（PC 和 Mac、32 位和 64 位电脑等）。为了尽可能服务很多人，可以使用两种不同的 Ubuntu DVD。随书附的\
  \ DVD 等同于可下载的桌面 DVD，但为了方便起见包含了额外的软件包。\n\n![Image](img/00002.jpeg) **桌面版：** 桌面 DVD\
  \ 是推荐给*桌面电脑*和*笔记本电脑*的。通过这张 DVD，你可以从 DVD 启动 Ubuntu，如果你喜欢，还可以选择将其安装到硬盘中。请注意，直接从磁盘运行而不直接安装到硬盘是默认选项，有助于防止意外的数据丢失，而且你在磁盘会话期间进行的任何操作都将不会被保存（除非你知道自己在做什么以及如何实现它）。这使得桌面安装成为在不进行任何永久性操作的情况下在你的机器上测试\
  \ Ubuntu 的绝方法。\n![Image](img/00002.jpeg) **极简 CD：** 极简安装 CD 适用于任何桌面版本不可用的场景（例如，内存不足），或适用于有更高级需求的人员（例如，自动化部署或特殊的分区要求）。通过这张\
  \ CD，你将进入安装程序，该程序将在你安装操作系统时下载软件包，并在安装完成后运行 Ubuntu。由于软件包是下载的，如果你使用这种方法，在安装期间将需要连接到网络。\n\
  \n对于标准用户来说，知道 Ubuntu 16.04 正式支持两种主要的桌面电脑类型或架构是非常有价值的。\n\n![Image](img/00002.jpeg)\
  \ **i386：** 这支持除需要 AMD64 的处理器以外的所有 Intel 或兼容处理器；它包含了目前的 Apple 硬件。如果你不确定需要哪个版本，请使用这个。它可以在\
  \ 32 位或 64 位系统上运行，因此是默认选择。\n\n![Image](img/00002.jpeg) **AMD64：** 如果你确定自己在使用基于 AMD64\
  \ 或 EM64T 架构的处理器（例如 Athlon64、Opteron、EM64T Xeon 或 Core2），你应该选择这个版本，因为它在你的硬件上运行效率会更高一点。\n\
  \n* * *\n\n### 提示：在哪里下载\n\n如果你丢失了随书附的安装光盘，或者你想使用其他可用选项（例如从 USB 驱动器安装，将在章节稍后部分讨论），你可以在\
  \ [`help.ubuntu.com/community/GettingUbuntu`](http://help.ubuntu.com/community/GettingUbuntu)\
  \ 找到你需要的内容。\n\n* * *\n\n### 其他 Ubuntu 变体\n\n除了官方发布的 Ubuntu 版本外，一些变体和版本也基于 Ubuntu\
  \ 但略有不同。以下是一些示例。\n\n![Image](img/00002.jpeg) **Kubuntu：** Kubuntu 是 Ubuntu，但它没有使用默认界面，而是使用\
  \ KDE 桌面。访问 [`kubuntu.org`](http://kubuntu.org) 或参考第 9 章](#part0021.html_ch09) 获取更多信息。\n\
  \n![Image](img/00002.jpeg) **Ubuntu Server 版：** Ubuntu Server 使 Ubuntu 在服务器上的安装和使用变得简单。它最初专注于提供某些应用程序的便捷安装和配置，包括\
  \ MySQL、Apache 等。最近的工作通过云改进了 Ubuntu Server 的能力。参考第 8 章](#part0020.html_ch08)。\n\n\
  ![Image](img/00002.jpeg) **Xubuntu：** Xubuntu 发行版使用 Xfce 4 环境替换了默认界面。Xubuntu 对于那些要在旧硬件上运行\
  \ Ubuntu 的用户特别有用，因为它的系统要求较低。访问 [`xubuntu.org`](http://xubuntu.org) 或参考第 9 章](#part0021.html_ch09)\
  \ 获取更多信息。\n\n由于提供了多种变体和选项，Ubuntu 的灵活性足以应对所有情况。\n\n\n你们中有些人可能正在阅读 Kubuntu、Ubuntu\
  \ Server 和 Xubuntu，并好奇它们与普通 Ubuntu 版本有什么不同。这些变体的主要区别在于包含了哪些应用程序和用户界面。因此，它们在用户界面的视觉和感受上可能很大，但底层的操作系统和软件安装系统是相同的。\n\
  \n\n\n\n\n# 当你下载 Ubuntu DVD 时，你下载的是一个特殊的 `.iso` 文件。该文件是安装 DVD 的“镜像”。当你将 `.iso` 文件刻录到\
  \ DVD-ROM 时，你就拥有了一个完整的随插即用安装 DVD。\n\n### 提示：这是哪种镜像？\n\n当你阅读关于 `.iso` 文件的内容时，经常会看到它们被称为\
  \ DVD 镜像。这里的 *image*（镜像）一词指的不是像照片或图片那样的视觉图像，而是 DVD 内容的精确数字副本。\n\n你需要使用 DVD 刻录软件（应用程序）将你的\
  \ `.iso` 文件正确地刻录到 DVD 中。应用程序内部应该有一个名为 `Burn from Disk Image`（从磁盘镜像刻录）或类似的菜单选项。措辞和细节取决于你用于刻录镜像所使用的程序。你应该选择\
  \ `.iso` 文件并插入一张空白 DVD；几分钟后，一张全新的 Ubuntu 安装 DVD 就会制作好了。\n\n为了让你尽早开始，接下来的几个小节介绍了如何在某些常用工具中刻录\
  \ DVD 的指令。\n\n### 在 Windows 7、8 或 10 中\n要使用 Windows 7、8 或 10 刻录你的镜像，请按照以下步骤操作。\n\
  \n1. 右键点击下载的 `.iso` 镜像图标，然后选择 `Burn Disk Image`（刻录磁盘映像）、`Open with > Windows Disc\
  \ Image Burner`（打开方式 > Windows 磁盘刻录机）或 `Burn disc image`（刻录磁盘映像）（取决于你的 Windows 版本）。\n\
  2. 从下拉框中选择可写的 DVD/DVD 驱动器。\n3. 点击 `Burn`（刻录）。\n\n#### 在带有 ISO Recorder 的旧版本 Windows\
  \ 中\n要使用免费的 ISO Recorder 刻录 `.iso` 文件，首先访问 [`isorecorder.alexfeinman.com`](http://isorecorder.alexfeinman.com)，然后下载并安装\
  \ ISO Recorder。按照以下步骤刻录镜像。\n\n1. 将空白 DVD 插入 DVD 刻录机。\n3. 点击 `Next`（下一步），开始记录过程。\n\
  4. 镜像写入完成后，点击 `Finish`（完成）退出 ISO Recorder。\n\n### 在 Mac OS X 中\n要使用 Mac OS X 刻录镜像，请按照以下步骤操作。\n\
  \n1. 加载 `Disk Utility`（磁盘 Utility）应用程序（在你的 `Utilities` 文件夹中）。\n2. 插入空白 DVD，然后选择\
  \ `Images > Burn`（映像 > 刻）并选择 `.iso` 文件。\n\n### 在 Ubuntu 中\n要使用 Ubuntu 刻录镜像，请按照以下步骤操作。\n\
  \n1. 将空白 DVD 插入 DVD 刻录机。\n2. 在 `File Browser`（文件浏览器）中，右键点击刚下载的文件，选择 `Write to Disk`（写入磁盘）。打开\
  \ `Write to Disk` 对话框。\n3. 在对话框中选择你的 DVD 刻录机和速度，然后点击 `Write`（写入）。打开 `Writing Files\
  \ to Disk Progress`（写入磁盘文件进度）对话框，`File Browser` 开始写入磁盘。\n\n### 提示：使用正确的选项\n\n请务必使用\
  \ `Burn from Disk Image`（从磁盘镜像刻录）或类似的选项，而不是直接将 `.iso` 镜像拷贝到要刻录的 DVD 上。如果你直接刻录文件，你将得到一个只包含单个\
  \ `.iso` 文件的 DVD。这是不起作用的。\n\n`Burn from Disk Image` 函数会获取 `.iso` 文件并将安装 DVD 中的所有原始文件还原到磁盘上。这确保了你拥有一个正确的安装\
  \ DVD。\n\n\n要创建可启动的 USB 盘，请根据你当前的操作系统遵循以下说明。\n\n### 提示：使用大小合适的 USB 盘\n\n请使用至少有 2GB\
  \ 空闲空间的 USB 盘。\n\n### 在 Windows 中\n要使用 Windows 创建可启动 USB 盘，请按照以下步骤操作。\n\n1. 从 [`rufus.akeo.ie/`](https://rufus.akeo.ie/)\
  \ 下载 `Rufus` 可启动 USB 盘创建器。注意这是一个 `.exe` 文件，不需要额外的安装步骤即可运行。\n2. 将 USB 盘插入电脑并启动 `Rufus`。\n\
  3. 点击光驱驱动按钮并选择你下载的 Ubuntu `.iso` 镜像。\n4. 点击 `Start`（开始）按钮，当系统提示 USB 盘上的数据将被删除时，点击\
  \ `OK`。\n\n### 在 Mac OS X 中\nUbuntu 下载页面建议 Mac 用户使用 DVD 安装操作系统，因为在 OS X 上创建可启动 USB\
  \ 盘所需的变通方法非常复杂。\n\n### 在 Ubuntu 中\n要使用 Ubuntu 创建可启动 USB 盘，请按照以下步骤操作。\n\n1. 将 USB\
  \ 盘插入电脑。\n2. 打开 `Dash`（如果你还不知道 `Dash` 是什么，请参见第 3 章）并搜索 `Startup Disk Creator`。点击\
  \ `Startup Disk Creator` 图标运行程序。\n3. 选择你下载的 Ubuntu `.iso` 镜像。如果下载的 `.iso` 镜像没有自动出现在\
  \ `Startup Disk Creator` 的列表中，点击 `Other`（其他）进行选择。\n4. 在底部的框中选择 USB 盘。\n5. 点击 `Make\
  \ Startup Disk`（制作启动盘）。\n\n### 注意\n\n你需要电脑的管理员权限才能使用 `USB Startup Disk Creator`。\n\
  \n## 启动与安装\n\n\n### 提示：先试后买\n\n在做出删除硬盘的永久决定之前，花些时间测试新操作系统。如果你不喜欢，重启电脑并移除 DVD/USB\
  \ 盘即可回到你已有的内容。\n\n\n\n\n\n# 语言\n\n启动电脑时你看到的第一个屏幕将向你介绍安装程序，并要求你选择语言，如图 2-1 所示，并询问你是想“尝试\
  \ Ubuntu”（从 DVD 运行操作系统而不更改硬盘驱动上的任何内容，我们建议初次用户在正式安装前这样做）还是“安装 Ubuntu”。\n\n![Image](img/00004.jpeg)\n\
  \n**图 2-1** 选择你的语言。\n\nUbuntu 支持多种语言。从列表中选择你的语言，然后点击“安装”继续安装。\n\n## 准备安装 Ubuntu\n\
  \n你将被告知安装要求，如图 2-2 所示。我们强烈建议选择“在安装时下载更新”选项，这将使你的安装包含最新的安全更新或错误修复。一个很棒的功能是，这些更新将在安装过程中并行下载，从而提高更新效率。\n\
  \n![Image](img/00005.jpeg)\n\n\n你也可以选择安装第三方软件，以便计算机在安装后立即播放某些媒体文件。这将节省你之后的时间，尽管某些用户可能不想安装源软件并选择不启用此选项。做出选择后点击“继续”。\n\
  \n## 分配空间\n\n为了准备存储 Ubuntu 系统和文件的硬盘，硬盘被划分为分区。每个分区为特定的操作系统保留硬盘的一部分。例如，你可以将整个硬盘用于新的\
  \ Ubuntu 系统，也可以共享硬盘以便同时安装 Windows 和 Ubuntu。这种共享场景被称为“双启动”。在双启动情况下，你的硬盘通常包含 Windows\
  \ 分区和 Linux 分区，启动时它会给出一个菜单，让你选择启动 Windows 还是 Linux。\n\n在安装程序的这一部分，你为新系统创建分区。这可能是安装中最复杂也最危险的部分。如果磁盘上已有分区（例如\
  \ Windows 安装），强烈建议你备份你的重要文件。\n\n> 提示：我是认真的\n\n真的，请务必备份任何重要文件。如果你在安装的这一部分出错，可能会丢失文件并导致系统无法启动。\n\
  \n### 在创建分区之前决定如何设置\n\n如果你对硬盘应该如何分区有清晰的想法，那么快速运行一切会变得简单。\n\n有两种特别常用的分区方法：\n\n![Image](img/00002.jpeg)\
  \ **磁盘上仅 Ubuntu：** 如果你要在磁盘上只安装 Ubuntu 并乐意擦除整个硬盘，你的操作将非常简单。Ubuntu 可以为你完成所有工作。\n\n\
  ![Image](img/00002.jpeg) **双启动：** 如果你向具有多个操作系统选项的计算机安装，你会对硬盘分区并将每个操作系统安装到自己的分区中。\n\
  \n无论是在磁盘上只安装 Ubuntu 还是双启动，你都需要确认 Ubuntu 是否可以使用整个硬盘，或者输入你的分区方案，如图 2-3 所示。\n\n![Image](img/00006.jpeg)\n\
  \n\n**仅 Ubuntu** 如果你乐意擦除整个硬盘，选择“擦除磁盘并安装 Ubuntu”并点击“现在安装”。可能会弹对话框询问你是否将更改写入磁盘；如果没有发现问题，可以点击“继续”。如果你选择此选项，请跳到书的下一个章节：“开始安装”。\n\
  \n**加密** 你还可以选择加密新的 Ubuntu 安装以确保安全，这将要求你设置安全密钥（图 2-4）。此选项对你的整个 Ubuntu 安装配置加密，并在启动解锁系统时需要密码或“密钥”。使用加密需要设置\
  \ `LVM`（逻辑卷管理器），安装程序会自动选择它。\n\n![Image](img/00007.jpeg)\n\n**图 2-4** 选择安全密钥。\n\n\
  **逻辑卷管理 (LVM)** 如果你对安装后拍摄快照或调整分区大小感兴趣，可以在安装程序内部通过选择“在新的 Ubuntu 安装时使用 LVM”选项来设置 `LVM`。\n\
  \n**手动分区** 如果你只安装 Ubuntu 或将与现有操作系统双启动，但希望对过程有更多控制，你必须手动设置分区。要执行此操作，选择“其他”并点击“继续”。你将看到图\
  \ 2-5 所示的屏幕。\n\n![Image](img/00008.jpeg)\n\n**图 2-5** 手动创建分区。\n\n此屏幕的主要部分显示可用驱动器和配置的分区。点击驱动器或分区将更改列表下方可供你操作。选择你想要添加分区的相关磁盘。磁盘按照连接顺序按设备名称列出。\n\
  \n在开始之前，你应该准备磁盘。如果你想完全擦除磁盘，请点击设备名称（图 2-6 中的 `/dev/sda`），并点击“分区表”。如果你确定，点击继续。磁盘现在充满了未分配数据，你可以添加你的分区。\n\
  \n![Image](img/00009.jpeg)\n\n**图 2-6** 配置分区。\n\n要添加分区，点击列表中的空空间项然后点击 `+` 按钮。会出现如图\
  \ 2-7 所示的新窗口。\n\n![Image](img/00010.jpeg)\n\n**图 2-7** 创建分区。\n\n根据你的要求设置值。类型组合框让你选择分区使用的多种文件系统类型。Ubuntu\
  \ 包含默认文件系统是 `ext4`，建议任何 Ubuntu 分区使用 `ext4`。\n\n使用挂载点组合框选择不同的挂载点之一，这告诉 Ubuntu 该分区应该在哪里。你需要一个根分区，其挂载点为\
  \ `/`。点击确定完成此分区。你还应该设置交换分区；如果没有，安装程序会警告你。\n\n当你完成所有分区的配置后，点击“下一步”继续安装。\n\n\n此时，安装开始。在进行过程中，你会被问一些问题以适当自定义你的安装。在安装时自定义操作系统可以节省时间。\n\
  \n告诉安装程序你住在世界的哪里（图 2-8）。\n\n![Image](img/00011.jpeg)\n\n**图 2-8** 点击地图选择位置。\n\n\
  你可以通过几种方式选择你的位置。首先，你可以将鼠标悬停在世界地图对应区域的时区上来选择你的位置。当你对时区选择满意时，点击它，并选择离你最近的城市。或者，使用选定城市列表找到你最近的城市。\n\
  \n完成后，点击继续。\n\n## 配置你的键盘\n\n\n\n\n\n下一个屏幕（见图 2-9）将用于配置您的键盘。\n\n![Image](img/00012.jpeg)\n\
  \n**图 2-9** 选择正确的键盘以确保按键上的符号能够正常工作。\n\n安装程序将根据你选择的地理位置为你建议一个键盘选项，但如果你有需要，也可以选择其他的。你还可以使用窗口底部的文本框来测试你的键盘布局是否正常。尝试输入键盘上的一些符号（如\
  \ `“`、`/`、`|`）以确保它们可以正常工作。如果你按下一个符号键，屏幕上出现了另一个符号，说明你选择了错误的键盘布局。\n\n\n下一步是输入一些关于您的个人详细信息，这些信息将用于在计算机上创建用户账户（图\
  \ 2-10）。\n\n![Image](img/00013.jpeg)\n\n**图 2-10** 输入您的个人信息以创建用户账户。\n\n在第一个框中，输入您的全名。该框中的信息将用于系统的不同部分，以指示账户背后的用户是谁。\n\
  \n在最后一个框中输入计算机名称。这也被称为“主机名”（hostname），是一个标识你当前机器的单词。它被用于局域网，以便你可以识别哪台机器。\n\n主机名可以很有趣。许多人会为主机名选择主题，例如超级英雄，并根据网络上的每台计算机用超级英雄命名（如超级人、蝙蝠侠、蜘蛛侠等）。想一个你可以使用的趣味主机名主题。对许多人来说，这往往是安装过程中最困难的部分！\n\
  \n在下一个框中，为自己设置一个用户名（安装程序将根据你的全名提供建议）。你的用户名应该是易记的。许多人会使用自己的名字，或者在姓或名末尾添加一个首字母（例如\
  \ `jbacon` 或 `jonob`）。你计算机上的每个用户名必须是唯一的——你不能拥有两个相同相同的账户。用户名必须以小写字母开头——之后仅允许小写字母和数字。\n\
  \n在接下来的两个框中，添加密码并进行确认。当你使用刚刚创建的用户名登录计算机时，将使用此密码。在选择密码时，请遵循这些简单的指南。\n\n![Image](img/00002.jpeg)\
  \ 确保你能记住密码。如果你需要将其写下来，请将其放在安全的地方。不要犯错，将密码放在他人容易获取且知晓的地方。\n\n![Image](img/00002.jpeg)\
  \ 选择密码时避免使用字典单词（“真实单词”），如“chicken”或“beard”，并尝试输入数字和标点符号。\n\n![Image](img/00002.jpeg)\
  \ 你的密码最好长于六个字母，并包含字母、符号和数字的组合。密码越长，大小写字母、数字和符号的混合程度越高，越安全。\n\n在这里你还有其他几个选项。第一个决定是你希望自动登录，还是在每次启动计算机时都需要密码登录。默认情况下，建议需要密码，因此选中了该选项。你还有加密家目录的选项。选择此选项可以使内容在没有密码的情况下无法读取。此选项可以提高你系统的安全性，但请注意，如果你丢失了密码，数据将无法恢复。\n\
  \n当你添加完所有信息后，点击 `Continue`。\n\n要了解更多关于你新操作系统的酷功能，请查看安装结束时出现的幻灯片（图 2-11）。\n\n![Image](img/00014.jpeg)\n\
  \n**图 2-11** 用户可以在安装结束时观看幻灯片，以获取更多关于 Ubuntu 的信息。\n\n\n从这里开始，随着 Ubuntu 继续在你的计算机上安装，你将看到一个包含操作系统有用且有趣信息的幻灯片。在该过程结束时，你会被要求重启计算机。现在你已经完成了工作，可以跳到第\
  \ 3 章开始使用 Ubuntu。\n\n***\n\n提示：更好地利用你宝贵的时间\n\n桌面版实时 DVD 安装程序的一个巨大优势是，当文件从磁盘复制时，你仍然可以使用该系统。与其坐在电脑前盯着进度条，你可以玩几个游戏来打发时间。\n\
  \n***\n\n## 从最小 CD 安装\n\n尽管桌面 DVD 是安装 Ubuntu 的理想选择，但你可能想使用传统的安装方法来安装系统。此 `.iso`\
  \ 文件较小（通常为 40–50MB），并在安装期间下载 Ubuntu 所需的组件。\n\n你可以通过访问 [help.ubuntu.com/community/Installation/MinimalCD](http://help.ubuntu.com/community/Installation/MinimalCD)\
  \ 找到最新最小 CD 的下载链接。\n\n这种方法涉及引导最小 CD、运行安装程序、选择想要安装的内容（即 Ubuntu 桌面），然后启动系统。这种安装程序非常适合在旧硬件上安装\
  \ Ubuntu 操作系统。\n\n要开始，请将 CD 放入驱动器并重启计算机。\n\n使用方向键选择 `Install` 选项并按 `Enter`。几刻之后，安装过程开始，要求你选择一种语言。通过上下方向键从不同的语言中选择，然后使用\
  \ `Tab` 键继续。\n\n***\n\n提示：安装服务器\n\n\n***\n\n## 选择地理位置\n\n接下来你需要选择你所在的国家，再次按下 `Enter`\
  \ 确认你的选择。\n\n现在你需要选择键盘布局。键盘布局在世界范围内各不相同，以考虑不同国家使用的多种符号和字母。即使你使用的是典型的拉丁字母集（大多数欧洲国家、美国、非洲和澳大利亚），也有变化和补充（例如德语变音）。你可以让\
  \ Ubuntu 为你检测布局，也可以从选项列表中选择。如果你想检测布局，将回答一系列问题直到做出判断。如果判断错误，你可以重复过程。否则，从可用选项中选择你的键盘布局。\n\
  \n## 硬件\n\n接下来，系统将尝试加载安装程序的其余部分并检测硬件。大多数情况下，这不需要提示的情况下完成，但有时你可能需要输入，例如选择主网络设备。设置完成后，你的计算机还将配置局域网——如果可能的话。如果它无法配置局域网，它将通知你失败信息，你可以选择手动配置网络连接或选择此时不配置。完成此安装需要网络连接，但一旦安装完成，你可以随时回来更改网络配置。\n\
  \n\n\n\n\n选择主机名后，系统将要求你选择 Ubuntu 镜像并定义你的 HTTP 代理信息——如果你不知道那是什么，那么你可能没有使用代理。完成此步骤后，安装程序将下载继续安装所需的某些组件。\n\
  \n## 配置用户\n\n安装程序的的下一部分是为计算机配置用户。该用户角色非常重要，因为他不仅可以作为普通用户使用，还能够使用 `sudo` 执行系统管理员任务。\n\
  \n系统首先会要求你为用户输入一个全名（例如 `Elizabeth K. Joseph`）。接下来，系统会要求你输入用户名，或者从你的全名中为你自动选择一个（例如\
  \ `elizabeth`）。如果你想要另一个用户名，请在此输入。最后，系统会要求你为用户输入密码，并要求重复密码以进行验证。\n\n### 小贴\n\n\n\
  下一个屏幕将提供加密主目录的选项。输入“yes”可以让该文件夹的内容在没有密码的情况下不可读。注意，如果你丢失了密码，你的数据将无法恢复。\n\n## 时区\n\
  \n安装程序将尝试通过网络检测你的时区。如果显示正确，请选择 Yes；或者选择 No 从你时区所在的列表中手动选择一个城市。\n\n## 创建分区\n\n系统随后将读取你的磁盘以获取当前的分区信息。你将被要求为\
  \ Ubuntu 创建或选择一个用于安装在其上的分区。创建分区是安装过程中中最具挑战性的部分。在对磁盘进行分区之前，请考虑你的分区应该如何组织。\n\n你有几个分区选项可供选择\n\
  \n![Image](img/00002.jpeg) 引导式—使用整个磁盘\n\n![Image](img/00002.jpeg) 引导式—使用整个磁盘并设置\
  \ LVM\n\n![Image](img/00002.jpeg) 引导式—使用整个磁盘并设置加密 LVM\n\n![Image](img/00002.jpeg)\
  \ 手动\n\n在大多数情况下，你可能想使用 `Guided—Use Entire Disk` 选项。这将擦除计算机硬盘上的所有内容并为你设置好一切。第二个选项\
  \ `Guided—Use Entire Disk and Set Up LVM` 允许你使用逻辑卷管理器（LVM）。第三个选项与第二个选项相同，但采用了磁盘加密，这在某些情况下会让你的数据更安全、更有保障。最后，如果你想设置特定的分区，请使用\
  \ `Manual` 选项。\n\n让我们逐一查看这些选项及其使用方法。\n\n**Guided—Use Entire Disk**: 当你选择此选项时，整个磁盘将自动分区。安装程序会这将创建一个主分区和一个逻辑分区，然后询问你是否继续创建这些分区。点击\
  \ Yes 即可完成。\n\n**Guided—Use Entire Disk and Set Up LVM**: 配置 LVM 请参阅 第 8 章。\n\n\
  **Guided—Use Entire Disk and Set Up Encrypted LVM**: 配置 LVM 与上一个选项相同，不同之处它还使用安全加密层为你的数据提供额外的安全和保护。如果你选择此选项，在过程中系统会要求你提供一个通行密码。请务必选择一个他人无法猜测但你自己能记住的密码。你每次启动计算机时都需要使用此通行密码来访问数据；如果你丢失或忘记了该密码，所有数据将永久无法访问。没有方法可以恢复丢失或遗忘的加密通行密码。\n\
  \n\n你也可以决定手动加密特定分区。只需在“用作”（Use As:）选项中选择“使用物理卷进行加密”。注意：你永远不要加密启动分区。\n\n**Manual**:\
  \ 如果你想手动创建自己的分区，请选择此选项。在这里，你可以创建多个不同类型的分区，设置它们的大小并配置它们的属性。创建这些分区的界面与 Live CD 安装程序的图形化方式不同，因此稍微复杂一些。然而，这样做在很大程度上仍然是一个选择内容并按回车的过程。\n\
  \n根据你的配置（以及你选择的选项），你会有若干选项可以选择：\n\n![Image](img/00002.jpeg) 配置软件 RAID\n\n![Image](img/00002.jpeg)\
  \ 配置逻辑卷管理器\n\n![Image](img/00002.jpeg) 配置加密卷\n\n![Image](img/00002.jpeg) 配置 ISCSI\
  \ 卷\n\n![Image](img/00002.jpeg) 引导分区\n\n### 小贴\n\n软件 RAID 和逻辑卷管理器包含在 第 8 章中。\n\n\
  你的磁盘列这些选项下方，可能会显示几个现有的分区。如果你想删除现有分区，请选择每个分区，按回车并选择“删除分区”（Delete the Partition）。当你删除了一些分区后，你应该看到一条\
  \ `FREE SPACE` 行。`FREE SPACE` 行用于创建新分区。\n\n\n\n\n现在你将看到“软件选择”界面，该界面将决定你想要安装的内容。要安装标准的\
  \ Ubuntu 操作系统，请向下滚动列表并选择“Ubuntu 桌面（Ubuntu desktop）”。如果你更想安装 Ubuntu 服务器版本，或者像 Xubuntu\
  \ 这样的变体版本，也可以从此界面进行。\n\n### 完成安装\n安装程序现在将下载你选择所需的所有包并对其进行安装。根据你的网络速度、计算机性能和硬盘驱动器的速度，安装过程可能需要一些时间。\n\
  \n一旦此过程完成，系统将提示你安装 `GRUB` 引导加载程序，并决定系统时钟是否设置为 `UTC`。通常情况下，直接接受这两个选项而不进行任何更改是没问题的。此时，安装已经完成，你可以按照指示移除\
  \ CD 光盘并重启电脑。\n\n在本章中，我们概述了安装 Ubuntu 的几种方法。一旦完成此任务，你就可以进入更多更有趣的话题了。下一章将帮助你入门。\n\n\
  # 第 3 章 开启使用 Ubuntu\n\n* * *\n\n![Image](img/00003.jpeg) 了解 Unity\n\n![Image](img/00003.jpeg)\
  \ 使用应用程序\n\n![Image](img/00003.jpeg) 使用你的语言使用 Ubuntu\n\n![Image](img/00003.jpeg)\
  \ 配置打印机\n\n![Image](img/00003.jpeg) 保持电脑更新\n\n![Image](img/00003.jpeg) 添加和删除程序及包\n\
  \n![Image](img/00003.jpeg) 升级到下一个 Ubuntu 版本\n\n![Image](img/00003.jpeg) Ubuntu 与多媒体\n\
  \n![Image](img/00003.jpeg) 备份\n\n![Image](img/00003.jpeg) 自定义 Ubuntu 的外观和感受\n\n\
  ![Image](img/00003.jpeg) 在其他设备上的 Unity\n![Image](img/00003.jpeg) 总结\n\n* * *\n\n\
  当 Ubuntu 安装完成并准备就绪后，是时候开始使用你的新操作系统了。与 Microsoft Windows 或 Mac OS X 等操作系统不同，Ubuntu\
  \ 包含了你所需的所有内容：办公套件、媒体工具、一个 浏览器、一个电子邮件客户端等。现在安装已经完成，你无需安装任何额外软件即可开始运行。\n\n不同的人使用电脑的方式各不相同，每个用户对外观和感受都有其自己的个人偏好。为了满足这一需求，Linux\
  \ 能够使用多种不同的图形界面之一。这种灵活性，结合 Linux 和 开源软件日益增长的普及，导致了数以百计的不同图形环境应运而出，每种环境都涵盖了不同类型的用户和工作方式。\n\
  \n尽管有大量的环境可用，但有两个明显的领导者：KDE 和 GNOME。这两个环境都提供美观、全面且易于使用的桌面，但它们在桌面的使用方式以及如何进行进一步的个性化方面有所不同。\n\
  \nKDE 系统旨在实现桌面的完全控制和可配置。任何存在的桌面配置选项对用户都可用，用户可以轻松访问并更改几乎所有内容的行为和外观。\n\n与之竞争的 GNOME\
  \ 桌面则灵感源于 Windows 和 Mac OS X，并将简单易用放在首要位置。GNOME 也很容易自定义，但那些不常用的选项要么被消除要么被深度隐藏，以防止用户信息过载。\n\
  \nUbuntu 用户非常幸运可以选择其中任何一种桌面，以及其他几种选项。这些环境中的许多在 第 9 章 中都会提到。\n\n* * *\n\n**提示：Ubuntu\
  \ 桌面就是 Unity**\n\n在阅读关于 Ubuntu 的时，你可能会看到 Unity 和 Ubuntu desktop 等术语交叉使用。在 Canonical\
  \ 的赞助下，Ubuntu 社区创建了 Unity 桌面作为图形界面演变的下一个阶段。时间将证明其他 Linux 发行版是否会效仿，还是它们会选择现有的其他选项之一。\n\
  \n* * *\n\nUbuntu 桌面被称为 Unity。Unity 的意图是创建一个在设计术语上不同设备相似的用户界面：桌面、手机、平板电脑和电视。这将有助于实现\
  \ Ubuntu 的最终目标——即实现所有设备之间的融合。\n\n在本章中，我们将帮助你开始使用 Unity（Ubuntu 的默认桌面），并展示你如何使用它来处理每天面对电脑的日常事务，以及一些不寻常的任务。这包括打开和运行应用程序、管理文件、调整外观和感受、使用应用程序、管理媒体等。\n\
  \n### 了解 Unity\n当你启动 Ubuntu 系统时，你会看到一个用户列表。一旦从列表中选择你的名字，系统会要求你输入密码进行登录。在上一章中，你在安装系统时指定了用户账户，现在请先选择你的名字，然后输入密码并按回车。密码将以星号（`*`）显示。这是一个安全功能。几秒钟后，Ubuntu\
  \ 桌面就会出现，如图 3-1 所示。\n\n\n**图 3-1** Ubuntu\n\n你可能注意到，与其他操作系统不同，Unity 桌面上没有图标。这是因为桌面图标通常是以应用程序的形式呈现的。\n\
  \n### 使用启动器 查找和运行应用程序\n要查找或运行应用程序，你需要使用启动器（Launcher）。启动器位于屏幕左侧。这个图标栏显示了应用程序链接，并通过一个小箭头指示哪些应用程序已打开。启动器还有一些其他方便的功能。\n\
  \n要在 Unity 中查找应用程序，点击启动器顶部的 Ubuntu 图标（如图 3-2 所示），或按下 `Super` 键。\n\n![Image](img/00017.jpeg)\n\
  \n**图 3-2** 带有 Ubuntu 图标的 Unity 启动器\n\n这将打开搜索界面，它是查找电脑上的程序、文件夹和文件的主要方法，以及许多其他内容，如音乐文件、视频、维基百科文章或其他在线资源。搜索底部有一行图标，称为透镜（Lenses）。每个透镜都帮助你以不同的搜索方式，你就可以输入程序、文件夹或文件的名称，它会根据你的输入自动搜索匹配项（如图\
  \ 3-3 所示）。你甚至不需要知道确切名称，因为搜索还会查找近似匹配和相似名称；它甚至通过搜索程序描述和某些文件内容来进行语义匹配。\n\n![Image](img/00018.jpeg)\n\
  \n**图 3-3** 根据部分搜索结果排序的搜索界面\n\n某些搜索透镜包含预定义的过滤器，用以进一步缩小搜索范围（如图 3-4 所示）。点击搜索透镜右上角的“过滤结果”以查看可用过滤器。\n\
  \n![Image](img/00019.jpeg)\n\n**图 3-4** 显示过滤结果的 Dash 应用程序透镜\n\n除了默认安装的透镜外，还有其他透镜可用。在本章稍后的部分，你将学习如何使用\
  \ Ubuntu 软件中心。你可以在那里搜索术语 `unity lens` 来找到额外的透镜。\n\n### 启动器的其他图标\n\n\n\n\n除了前面描述的\
  \ Ubuntu 图标外，启动器（Launcher）默认还包含几个实用的条目。大多数的意图和用途都显而易见。尽管如此，它们仍然值得简单介绍一下。这里按照它们在启动器中从上到下的顺序列出，尽管跳跳了一些更明显的条目。\n\
  \n![Image](img/00002.jpeg) **主文件夹 (Home Folder):** 此图标将使用文件管理器打开你的主文件夹，文件管理器将在下文中介绍。你的主文件夹是你存放所有个人文件和文件夹的地方。\n\
  \n![Image](img/00002.jpeg) **GNOME 软件中心 (GNOME Software Center):** 此图标将打开你用于 Ubuntu\
  \ 的主要软件管理系统，将在章节稍后部分介绍。\n\n![Image](img/00002.jpeg) **工作区切换器 (Workplace Switcher):**\
  \ 启用后，此工具允许你在桌面上打开四个不同的屏幕，每个屏幕上运行不同的程序，并可以在它们之间切换。如果你倾向于同时打开很多东西并导致屏幕空间不足，此功能将非常有帮助。点击它可以显示所有的桌面工作区（它还会显示每个工作区中打开的内容，非常方便）。例如，你可能可以在第一个桌面上使用浏览器和电子邮件客户端与朋友聊天，同时在第二个桌面上处理文档。你只需点击每个虚拟桌面即可切换到该桌面以访问不同的应用程序。点击你想使用的桌面。本质上，这扩展了你可用的屏幕空间，并创建了一种保持许多程序打开而不阻塞另一个程序的简单方法。要在你的系统中启用工作区，请前往\
  \ Dash（启动）并搜索 `Appearance`（外观）。在 Behavior（行为）选项卡上，勾选 Workspaces（工作区）复框。\n\n![Image](img/00002.jpeg)\
  \ **垃圾箱 (Trash):** 丢弃的文件所在地，直到你清空垃圾箱将其永久删除。拖到此图标或右键移动到垃圾箱的文件都将被删除。要完全删除这些文件，右键点击垃圾箱并选择“清空”。\n\
  \n提示：你可以像在 Windows 中一样通过按下 `Alt-Tab` 在 Ubuntu 中切换多个应用程序。当你按下此组合键时，会出现一个小窗口，用于切换当前工作区上的活动应用程序。你还可以使用\
  \ `Alt+Tilde` (`~`) 在不同的窗口之间切换。\n\n## 使用应用程序\n当应用程序加载时，窗口左上角有三个按钮：\n\n![Image](img/00002.jpeg)\
  \ **带有黑色 X 的橙色按钮:** 此按钮用于关闭应用程序。\n\n![Image](img/00002.jpeg) **带有黑色 – 的灰色按钮:** 此按钮将最小化应用程序，将其从屏幕上移除并放入启动器中，以便在再次需要时方便地访问。\n\
  \n![Image](img/00002.jpeg) **带有黑色正方形的灰色按钮:** 此按钮用于最大化窗口，使其占据整个桌面区域。并不是所有的窗口都使用此按钮，所以如果你发现某个窗口较小的应用程序没有显示它，请不要惊讶。\n\
  \n每个当前正在使用的应用程序在桌面左侧的启动器中都有一个条目。你可以点击这些条目来最小化或恢复应用程序，并可以右键查看其他选项，例如始终在启动器列表中保留图标。提供此功能是为了让你只需只需点击图标即可启动程序，而无需在\
  \ Dash 中搜索它，这对于经常使用的程序非常方便。\n\n任何当前在前台运行的程序具有选项的菜单都会出现在桌面的顶部面板。当你切换程序时，顶部面板的内容将发生变化。鼠标悬停在屏幕顶部程序名称上，等待菜单列表出现。点击任何一个即可查看下拉选项列表。\n\
  \n提示：你可以更改菜单设置，使得只有最大化的应用程序出现在各自窗口的顶部边界上。要修改这些设置，请在 Dash 中搜索 `Appearance`。在 Behavior（行为）选项卡上，将选中的选项从“In\
  \ top bar”（在顶部栏中）更改为“In window bars”（窗口栏中）。\n\n### 管理文件和文件夹\n使用电脑时，你通常需要打开和保存文件及文件夹、移动它们并执行其他任务。点击启动器上的主文件夹图标打开文件管理器。以下是你主文件夹中默认包含的一些主要文件夹（图\
  \ 3-5）：\n\n![Image](img/00020.jpeg)\n**图 3-5** 主文件管理器窗口，已打开到主文件夹\n\n\n![Image](img/00002.jpeg)\
  \ **文档 (Documents):** 此文件夹旨在包含你创建的文字处理文件和其他文档。\n\n![Image](img/00002.jpeg) **下载\
  \ (Downloads):** 此文件夹旨在包含你从互联网下载的项目。\n\n![Image](img/00002.jpeg) **音乐 (Music):**\
  \ 此文件夹旨在包含音乐文件。\n\n![Image](img/00002.jpeg) **图片 (Pictures):** 此文件夹旨在包含图像文件。\n\n\
  ![Image](img/00002.jpeg) **公共 (Public):** 此文件夹存放了你希望系统或网络上的其他用户访问的文件。此文件夹的权限设置不同，因为默认情况下，所有其他文件夹及其内容仅供你访问和打开。\n\
  \n![Image](img/00002.jpeg) **模板 (Templates):** 此文件夹旨在包含用于文字处理器等应用程序的模板。\n\n![Image](img/00002.jpeg)\
  \ **视频 (Videos):** 此文件夹旨在包含视觉媒体文件。\n\n文件管理器的左侧有一个包含多个选项的菜单。大多数是之前列出的常用文件夹的重复。值得进一步介绍：\n\
  \n![Image](img/00002.jpeg) **计算机 (Computer):** 允许你浏览系统上未包含在主文件夹中你有权限查看的其他文件和文件夹。\n\
  \n![Image](img/00002.jpeg) **垃圾箱 (Trash):** 丢弃的文件所在地，直到你清空垃圾箱将其永久删除。\n\n![Image](img/00002.jpeg)\
  \ **连接服务器 (Connect to Server):** 运行向导以与网络服务器建立连接；你需要想要连接的服务器名称以及关于它的详细信息（如使用的端口）。使用此功能可以在桌面上创建一个图标，点击后将在桌面文件管理器中提供远程文件列表。然后你可以像处理其他文件管理器窗口一样处理它并拖放文件。这对于在计算机之间复制文件非常有用。\n\
  \n提示：Ubuntu 桌面的可用性\n在 Ubuntu 桌面的开发过程中，投入了大量心力和精力以确保可用性。例如，屏幕角落被设定为易于访问的区域——你不需要仔细地鼠标悬停在某个区域，只需将鼠标甩到相应的角落即可。这就是为什么重要功能位于角落的原因；这种方法让访问每个功能都变得容易一点。\n\
  \nUbuntu 充满了许多此类微小的可用性改进，有助于它变得尽可能直观和强大。Canonical 创建了一个名为 Ayatana 的集体项目来领导这一开发。关于\
  \ Ayatana 的更多信息可以在 `https://wiki.ubuntu.com/Ayatana` 找到。\n\n### 添加额外用户\n\n\n\n\n\
  如今，许多计算机由多个人共同使用。与其强制每个人都使用相同的桌面设置，或者通过允许所有使用者访问管理功能来降低计算机的安全性，不如为每个使用计算机的人都创建一个账户，这是既简单又推荐的做法。这允许每个用户自定义计算机的工作方式和外观，而不会干扰他人的喜好，同时也允许你仅向特定用户授予管理员权限，以防止他人访问可能影响所有人甚至在在使用不当时损坏系统安装的功能。\n\
  \n打开 Dash 并搜索 `User Accounts`。出现的对话框包含当前当前用户列表。点击窗口右上角的 `Unlock` 以进行更改。接下来，点击用户列表底部的\
  \ `+` 符号或 `Add` 来创建新账户，如图 3-6 所示。\n\n![Image](img/00021.jpeg)\n\n**图 3-6** 用户设置对话框\n\
  \n* * *\n\n提示\n更改用户和组需要密码，只有具有管理员权限的用户才能执行此操作。点击 `Lock/Unlock` 按钮输入密码并进行更改。\n\n\
  * * *\n\n现在你必须为新用户提供全名和一个该用户登录时使用的短用户名。点击 `OK`，在下一个对话框中为该用户输入密码，再次输入密码以确认，然后再次点击\
  \ `OK`。\n\n一旦创建了用户账户，你就可以自定义你的登录选项，并点击 `Password` 字段来设置密码、允许用户无密码登录，或在不设置密码的情况下启用账户。允许用户无密码登录或自动登录通常不是一个好主意，但在某些情况下非常有用。例如，如果用户是不被要求执行管理任务的小孩子，孩子们可以拥有一个在启动时自动登录的账户，而管理员将拥有一个需要密码的额外账户，以便在时执行更改和更新。\n\
  \n最后，既然账户已经创建，你就可以自定义它的设置。要这样做，请在列表中突出账户名称，并点击 `Account Type` 右侧的字段。\n\n如果你喜欢在终端中执行此操作，请在登录具有管理员权限的账户时使用\
  \ `adduser` 命令：\n\n点击此处查看代码图像\n\n```\nmatt@laptop:~$ sudo adduser corey\n```\n\n\
  输入密码后，此命令将添加一个名为 `corey` 的新用户。在此过程中，你会被问几个问题。回答它们，最后，账户就会被创建。\n\n要从命令行删除用户，请在上述示例中用\
  \ `deluser` 命令代替 `adduser`。你将在第 7 章中学习更多关于从命令行处理用户的知识。\n\n\n桌面顶部的右侧是通知区域和时钟。通知区域与\
  \ Windows 系统托盘类似，它提供了一系列指示特定内容的小图标。一个很好的例子是 `Network Manager`，它会为你管理网络连接——包括有线和无线网络。\n\
  \n你可以通过右键点击通知区域项目来查看上下文菜单，从而调整这些项目项。某些图标（如音量控制）允许你左键点击它们来查看状态。例如，尝试点击小扬声器图标并调整滑块。\n\
  \n* * *\n\n提示\n选择 `Sound Settings` 以访问大量的声音设置。这些设置配置了扬声器、麦克风、线路输入、其他声卡输入或输出等。\n\n\
  * * *\n\n### 网络管理器 `Network Manager` 是一个网络接口，帮助你管理网络设备和连接；它通过网络管理器小工具访问。其目标是让网络“即插即用”，而不需要用户了解如何手动配置设置（尽管对于想要这样做的人来说，该功能仍然可用）。在小工具上左键单击鼠标显示对话框，并允许在网络类型之间快速切换。它还提供了一种通过虚拟专用网络（VPN）设置访问的简单方法，正如我们许多人需要它来安全地访问工作或学校的文件。你还可以启用或禁用有线和无线网络，查看当前连接的信息，并快速方便地编辑连接（图\
  \ 3-7）。\n\n![Image](img/00022.jpeg)\n\n**图 3-7** 网络管理器图标，左键点击显示连接菜单\n\n### 时钟 通知区域旁边是时钟。点击时钟可以查看日历。\n\
  \n* * *\n\n提示\n点击时钟并选择 `Time & Date Settings` 来自定义你的时钟。\n\n* * *\n\n### 齿轮菜单 点击屏幕右上角的\
  \ `Gear` 访问这些选项（图 3-8）：\n\n![Image](img/00023.jpeg)\n\n**图 3-8** 哦，无限可能……\n\n\n\
  ![Image](img/00002.jpeg) **Ubuntu 帮助：** 在这里你可以找到 Ubuntu 桌面指南，它为大多数系统应用程序提供了帮助指南。\n\
  \n![Image](img/00002.jpeg) **系统设置：** 此选项打开一个窗口，你可以根据需要调整计算机。选项包括键盘布局、屏幕显示、打印机、电源、声音等。\n\
  \n![Image](img/00002.jpeg) **注销：** 此选项允许你注销会话并返回主界面。\n\n![Image](img/00002.jpeg)\
  \ **挂起：** 如果你的计算机支持，此选项将列表中，你可以点击它将系统状态保存到内存中。这样当你下次打开计算机时，桌面会话将从离开的地方恢复。此选项会继续消耗电量，但量极小。\n\
  \n![Image](img/00002.jpeg) **重启：** 点击此项重启计算机。\n\n![Image](img/00002.jpeg) **关机：**\
  \ 点击此项关闭计算机。\n\n## 使用应用程序\n\n现在你已经熟悉了桌面，让我们探索一下新系统中包含的许多应用程序。默认情况下，Ubuntu 自带了一系列流行且成熟的应用程序，用于听音乐、看视频、创建文档、浏览网页、管理日程、阅读电子邮件、创建图像等。这些应用程序都经过开发者的审核，确保它们是目前最好的\
  \ Linux 应用程序。\n\n尽管 Ubuntu 包含了一些软件应用程序，但你可能还会安装额外的应用程序并探索其他软件。坦率来说，Ubuntu 构建在一个强大的基础之上，使得软件安装像在\
  \ Ubuntu 软件中心中点点一样简单。\n\n* * *\n\n提示：运行应用程序的另一种方法\n\n虽然你通常通过从应用程序菜单选择来启动应用程序，也可以按下\
  \ `Alt-F2`（在 Mac 硬件上按下 `Fn-Alt-F2`）打开“运行命令”框，并在其中输入应用程序名称并运行。\n\n* * *\n\n### 使用\
  \ Firefox 浏览网页 Firefox 是 Ubuntu 默认的网络浏览器，为你提供简单、安全且强大的浏览体验。Firefox 由 Mozilla 开发，已成为全球最成功的开源项目之一；它持续获得巨大的关注。凭借数亿次的下载量和不断增长的浏览器份额，Firefox\
  \ 取得了前所未有的成功。\n\n\n\n\n\n\n点击启动器中的 Firefox 图标，或打开 Dash 并搜索 `Firefox` 即可开始。这将打开 Firefox\
  \ 的主窗口（图 3-9）。\n\n![Image](img/00024.jpeg)\n\n**图 3-9** Firefox 界面既简洁又具有扩展性。\n\n\
  Firefox 看起来与大多数 Web 浏览器相似，包含了常用的后退、前进、重新加载和停止按钮；地址栏以及一些菜单。这些看起来熟悉的元素将帮助你熟悉 Firefox。如果你以前用过\
  \ Internet Explorer、Opera、Chrome 或 Safari，那么使用 Firefox 将不会有任何问题。\n\n在 Firefox 中浏览互联网与任何其他浏览器并无区别：只需在地址栏中输入\
  \ Web 地址并按 `Enter` 即可。Firefox 还具有一些非常实用的功能，让你轻松访问你喜爱的网站。例如，如果你想访问 Ubuntu 网站，只需输入\
  \ [www.ubuntu.com](http://www.ubuntu.com)（你可以省略 http://）。或者，你只需输入 Ubuntu，Firefox\
  \ 将就会等同于访问 Google 网站、输入 `Ubuntu` 作为搜索词，并带你进入搜索结果的第一页。此功能对于可能出现在搜索结果页面顶部的热门网站来说非常方便。\n\
  \n### 提示\n地址栏旁边的搜索框可用于进行搜索。默认情况下，这些搜索在 Google 上进行。要进行 Google 搜索，只需输入你的搜索词并按 `Enter`。你也可以点击地址栏旁\
  \ Google 框中的向下箭头，从各种其他站点中选择进行搜索，包括 [Amazon.com](http://Amazon.com) 和 Wikipedia 等站点。\n\
  \n此搜索框可以搜索几乎任何内容。要添加更多搜索引擎，请点击小图标，然后选择“管理搜索引擎”。\n\n### 书签你喜爱的网站\n要书签你正在查看的页面，将鼠标悬停在\
  \ Firefox 浏览器上显示菜单。点击 `书签 > 书签此页` 或按 `Ctrl-D`。在弹出的下拉框中，使用组合框选择存储书签的文件夹。你还可以为书签添加“标签”，这些标签就像关键词，将来可用于排序和搜索你的书签。当你完成书签的命名和标记后，点击\
  \ `完成` 来保存书签。\n\n### 提示：使用活动书签节省时间\nFirefox 还包含一个名为“活动书签”（live bookmarks）的特殊功能，它可以在你无需访问网站的情况下自动获取网站内容。例如，访问\
  \ [`fridge.ubuntu.com`](http://fridge.ubuntu.com)一个流行的 Ubuntu 新闻网站），选择书签菜单、`订阅此页`，以及\
  \ `订阅 Ubuntu Fridge >> 订阅`。你将被带到一个新页面，预览馈流并让你选择想要订阅的内容。使用默认选项（`活动书签`），并点击 `立即订阅`。会弹出一个对话框。使用提供的默认值并点击\
  \ `确定`。如果你启用了书签工具栏，你会看到增加了一个工具栏按钮；当你点击它时，将显示该网站的项目列表。每当你启动 Firefox 时，它都会静静地更新此列表，因此你不需要亲自访问该网站。“最新头条”工具栏条目就是此功能的示例。\n\
  \n### 提示：如果你喜欢 Fridge\n你可能还会喜欢 [`planet.ubuntu.com`](http://planet.ubuntu.com)上的\
  \ Planet Ubuntu。该网站收集了许多不同 Ubuntu 开发者和其他社区成员的个人博客。Planet Ubuntu 让你对开发者们正在工作和/或感兴趣的内容有独特的见解。\n\
  \n### 扩展它，让它更酷\n尽管 Firefox 已经是一个强大且灵活的 Web 浏览器，但它可以使用特殊的插件扩展进行进一步扩展。这些扩展不仅涵盖了典型的浏览需求，还涵盖了扩展浏览器本身的更专业的附加功能。\n\
  \n如果你访问需要普通 Web 插件的网站，将弹出一个窗口，指示你缺少充分利用所访问页面所需的插件。点击 `安装缺失的插件` 按钮来获取所需的插件。例如，Ubuntu\
  \ 并不带 Adobe Flash 插件，因为它不符合 Ubuntu 的软件自由要求。因此，如果你想使用 Flash，你将安装 Adobe Flash 或免费软件版本\
  \ `Gnash` 的选项。\n\n要使用附加功能扩展浏览器本身，请访问 [`addons.mozilla.org`](https://addons.mozilla.org)\
  \ 并浏览你感兴趣的扩展。当你找到想要安装的内容时，选择 `添加到 Firefox`，然后点击 `立即安装` 按钮。会弹出一个对话框请求你确认安装。点击 `立即安装`。你的新扩展将自动下载并安装。通常，在重启\
  \ Firefox 后，你的新扩展即可可用。\n\n### 提示：从哪些网站下载扩展时要小心\n建议你仅从 [`addons.mozilla.org`](http://addons.mozilla.org)\
  \ 下载扩展。如果你确实需要从其他站点安装扩展，请确保它是你信任的站点。否则，扩展可能包含不安全的软件、病毒或间谍软件。\n\n### 使用 LibreOffice\
  \ 创建文档\nUbuntu 自带了一套名为 LibreOffice 的全办公套件。这个综合集合默认安装了用于创建文字处理文档、电子表格和演示文稿的应用程序，能够轻松操作和创建数据库、绘图和数学公式——这一切触手可及。该套件提供了广泛的功能，包括读取和写入\
  \ Microsoft Office 文件格式，并可以将文档导出为 Web 页面、PDF 文件甚至动画。\n### 提示：LibreOffice 的历史\n年前，一家名为\
  \ Sun Microsystems 的公司在购买开发它的 StarDivision 公司时收购了一个名为 StarOffice 的办公套件。Sun Microsystems\
  \ 继续开发 StarOffice 作为专有办公套件，但几年后发布了开源版本 [OpenOffice.org](http://OpenOffice.org)。[OpenOffice.org](http://OpenOffice.org)\
  \ 的功能稍少，但仍然非常成熟并聚集了大量粉丝。当 Sun Microsystems 被 Oracle 收购时，一些开发者对新公司的发展方向感到不满。由于代码是开源的，这些开发者能够创建一个所谓的“分支”（fork）——该项目基于直到该点的相同开源代码，但从此后的所有开发发生了歧。这个新的办公套件被称为\
  \ LibreOffice。\n\n让我们通过用它写一封信来尝试 LibreOffice。通过点击启动器中的 Dash 主页并搜索 `LibreOffice`\
  \ 来启动 LibreOffice 的文字处理器 LibreOffice Writer。加载完成后，你将看到如图 3-10 所示的界面。\n\n\n\n\n\n\
  如果你以前用过文字处理程序，你会发现许多界面元素（例如设置字体类型和大小、**粗体**、*斜体*、下划线和对齐的按钮）其外观和行为与其他程序相同。LibreOffice\
  \ 开发者设计了该套件，使得如果你过去用过类似 `Microsoft Office` 的程序，可以很容易地迁移。在花几分钟熟悉 LibreOffice 后，你就会确信自己能够找到所需的函数。\n\
  \n在开始写信之前，首先选择一种漂亮的字体。在字体组合框中，你应该能看到默认选中了 `Liberation Serif`（这是一种与 `Times` 类似的自由字体）。如果你有其他偏好，可以点击该框并选择其他字体，例如可爱的\
  \ `DejaVu Sans` 或 `Ubuntu` 字体。点击字体框右侧的组合框并选择 `10`（磅）作为大小来更改字体大小。将光标置在页面左侧，在信中添加你的家庭地址。\n\
  \n现在按 `Enter` 键，在地址下方留留一个空行，然后点击工具栏上的“右对齐”按钮（图标看起来像几行右对齐的线条）。如果你不确定某个按钮的作用，可以将鼠标悬停在上面以弹出工具提示。现在在你的信中添加收件人的地址。\n\
  \n再次按 `Enter` 键留留一个空行，然后输入信件的正文。可以随时使用**粗体**、*斜体*和**下划线**按钮来强调你的文字。你还可以使用其他工具栏按钮来添加项目符号列表和编号列表，并更改字体颜色。如果你想添加图形、表格、特殊字符和框架等功能，点击\
  \ `插入` 菜单并选择相关项目。你可以通过右键点击页面上的每个项目并使用上下文菜单中显示的选项对所添加的项目进行自定义。\n\n当你的信写完成后，你可以通过选择\
  \ `文件 > 保存`、点击磁盘图标工具栏按钮或按 `Ctrl-S` 来保存它。LibreOffice 使用的默认文件格式是 `OpenDocument Format`（开放文档格式）。这种文件格式是一种全球通官方开放标准。不同类型的应用程序文件格式略有不同（文字处理器\
  \ `[Writer]` 文件使用 `.odt`，电子表格 `[Calc]` 使用 `.ods` 等），但每种格式都提供了不受供应商锁定的开放标准。你还可以以许多其他格式保存文件，包括\
  \ `Microsoft Office` 的默认格式。\n\n* *\n\n### 提示：供应商锁定？\n\n在专有软件世界中，每个应用程序都有其特定的封闭文件格式，只有供应商知道如何实现。当人们使用该软件创建文档时，封闭格式意味着只有该特定工具才能读写该格式。只要你想访问自己的文档，就需要那个工具。这被称为“供应商锁定”。\n\
  \n为了解决这个问题，LibreOffice 套件（以及绝大多数其他开源应用程序）使用了经过公开记录的开放文件格式。事实上，该格式是 `ISO/IEC 26300:3006`\
  \ 标准下的一个发布标准。因此，其他应用程序可以实现 `OpenDocument` 文件格式，你可以放心地知道你的文档始终可用，并且不会被锁定在任何特定工具上。\n\
  \n* *\n\nLibreOffice 中集成的另一个实用功能是能够以 `Adobe PDF` 格式保存文档。PDF 文件在过去几年中使用得越来越多，对于发送给人们那些不应该修改的文档（如发票）非常有用。PDF\
  \ 文件提供了文档的高质量副本，并在所有操作系统上都良好支持。这使得 PDF 成为创建目录、手册和传单的理想选择。要将文档另存为 PDF 文件，点击主工具栏上的\
  \ `PDF` 按钮（打印机图标旁边）。点击按钮，输入文件名，大功告成。简单。\n\n### 使用 Thunderbird 管理电子邮件\n\nThunderbird\
  \ 是一个由 `Mozilla` 创建的传统桌面电子邮件客户端，Mozilla 也是负责 `Firefox` Web 浏览器的团队。它是 Ubuntu 的默认选择，且工作方式与其他操作系统的\
  \ Thunderbird 版本相同。以下是设置方法。\n\n打开启动器（Dash）并搜索 `Thunderbird` 开始。当它第一次打开时，你将获得使用特定服务创建新电子邮件地址的机会。如果你已经有一个想要使用的电子邮件账户，请选择\
  \ `跳过此项`。向向出一个帮助你配置 `Thunderbird`（图 3-11`）。\n\n\n**图 3-11** Thunderbird 启动向导\n\n\
  输入你的姓名、电子邮件地址和密码开始。`Thunderbird` 对 `Mozilla` 的互联网服务提供商（ISP）数据库进行搜索，并尝试为你设置技术方面的内容（图\
  \ 3-12`）。点击 `创建账户`。\n\n![Image](img/00027.jpeg)\n\n**图 3-12** Thunderbird 找到了我的域名详细信息。\n\
  \n如果一切顺利，你不需要做任何其他操作。如果 `Thunderbird` 没有找到你的 `ISP`，你需要知道从服务提供商处获取的服务器信息，以便手动配置 `Thunderbird`。\n\
  \n从这里开始，`Thunderbird` 的工作就像电子邮件客户端在过去 15 年左右的工作方式一样。你可以下载电子邮件、回复或发送新邮件、整理文件夹、配置多个账户等，一切都使用清晰的界面（图\
  \ 3-13`）。\n\n![Image](img/00028.jpeg)\n\n**图 3-13** Thunderbird 界面易于使用\n\n### 使用你的语言使用\
  \ Ubuntu\n\n当你安装 Ubuntu 时，系统会询问应该使用哪种语言。虽然这设置了初始语言，但你可能在以后更改语言。要这样做，请在 Dash 中搜索“语言支持”。Ubuntu\
  \ 支持大量的语言，许多应用程序都包含“翻译此应用程序”菜单选项，以便所有 Ubuntu 用户都能贡献翻译。如果你愿意尽一份力，这是对 Ubuntu 项目的巨大贡献。\n\
  \n当语言选择器首次加载时，可能会要求你更新语言包。只需点击“是”继续。在对话框中，你会看到已安装语言包的列表。此外，许多语言可以安装。要安装/删除语言包，点击“安装/删除语言”按钮。你将看到语言列表，每个语言旁边都有一个“支持”复选框。对于你想在系统中安装/删除的每种语言，勾选相应的框。\n\
  \n当你选择完毕，点击“应用”按钮，相应的语言包将下载并安装。现在，从列表中选择你想作为默认的语言，并点击“应用于范围”。你需要注销并重新登录更改才会生效。\n\
  \n* *\n\n### 提示：选择新语言\n\n当你看到登录界面时，可以使用“语言”按钮为特定的登录会话选择语言。当你选择语言时，系统会询问你是想将其设置为默认语言还是仅用于该特定会话。\n\
  \n### 配置打印机\n\n\n\n\n\n大多数情况下，你可以轻松快速地添加或配置打印机。更棒的是，打印机在插入系统时，有时会自动进行配置。唯一的注意事项是，并不是所有的打印机制造商都为他们的设备提供\
  \ Linux 驱动程序。虽然 Linux 社区在编写驱动程序方面非常努力，但最新的打印机型号通常没有足够的软件与 Linux 交互。不过，大多数比 6 或 9\
  \ 个月旧的打印机型号似乎运行得非常良好。\n\n### 提示\n\n在购买打印机之前，你可以查看 [www.openprinting.org/printers](http://www.openprinting.org/printers)\
  \ 上的型号列表及其驱动状态，了解其他人的使用体验。Linux 基金会（Linux Foundation）维护着该列表，它是判断你的型号在 Ubuntu 上开箱即用效果好坏的一个很好的指标，这使其成为购买新硬件时的极佳资源，并在遇到问题时进行故障排除时也非常有用。\n\
  \n### 要开始安装打印机，请点击 Dash（活动栏）并搜索 `Printers`。此选项将打开打印机窗口，如图 3-14 所示。\n\n![Image](img/00029.jpeg)\n\
  \n**图 3-14** 打印机窗口\n\n打印机配置窗口允许你添加打印机并修改其设置。在接下来的示例中，你将添加一个新的打印机并查看其设置。\n\n### 收集信息\n\
  \n配置打印机时最重要的一点是不要操之。在开始点击图标和运行任何程序之前，请确保你已完成以下步骤。\n\n1. 记录打印机的品牌和型号。这些信息通常清晰地打印在硬件本身上。在示例中，我们添加了一个\
  \ HP Photosmart C4700。\n2. 将打印机连接到计算机或网络并将其开启。\n\n#### 启动向导\n\n一旦你为安装打印机准备就，点击 `Add`\
  \ 弹出“新打印机”窗口。系统会自动搜索任何新连接的打印机并启动“新打印机”向导，如图 3-15 所示。\n\n![Image](img/00030.jpeg)\n\
  \n**图 3-15** 选择打印机\n\n\n选择带有你打印机名称的设备，然后点击 `Forward`。\n\n此时，你必须选择一个打印机制造商。如果你的打印机已自动检测，向导将选择一个制造商。点击\
  \ `Forward`。\n\n在下一个屏幕中，你被要求同时选择型号和驱动程序。对于自动检测的打印机，这两者都应该被自动选择，且默认驱动程序应该工作。你以后可以更改这些选择。如果没有选择任何驱动程序，请滚动查看按制造商组织的选项列表。\n\
  \n有时你可能找不到适用于你特定打印机的确切型号或驱动程序。通常，如果没有你的确切型号的驱动程序，请选择最接近的一个然后进行测试。如果不起作用，你可以尝试其他专为同一制造商的打印机设计的驱动程序。\n\
  \n点击 `Forward` 继续安装。如果你需要安装自定义驱动程序，请点击 `Install Driver` 按钮。\n\n最后，你可以为打印机输入描述和位置，如图\
  \ 3-16 所示。点击 `Apply` 完成过程并设置你的打印机。\n\n![Image](img/00031.jpeg)\n\n**图 3-16** 输入打印机位置和描述\n\
  \n### 任务完成！\n\n点击 `Apply` 后，你将在 `Local Printers`（本地打印机）下看到你的打印机名称。你可以点击它并打印一张测试页。这样做并确保页面打印正确。如果你发现页面打印良好，你就完成了。你现在可以从已安装的应用程序（如\
  \ LibreOffice）中进行打印了。\n\n### 远程打印\n\n你还可以配置 Ubuntu 系统将打印作业发送到远程打印服务器。例如，如果你网络上有一台连接了打印机的\
  \ Windows 系统，只需在配置期间选择 `Network Printer` 单选按钮，并指定 Windows 系统的主机名或 IP 地址即可。然后你将必须指定一种连接协议。\n\
  \n如果你的 Windows 系统正在共享打印机，你将不得不指定 `Samba`，这是 Linux 和 Windows 系统相互通信的标准方式。你仍然需要像之前描述的那样指定打印驱动程序。\n\
  \n### 保持计算机更新\n\n虽然 Ubuntu 已经包含了大多数人需要的内容，但有时你可能想要或需要额外的东西，例如用于学校的桌面出版应用或消磨时间的游戏。添加这些应用程序最简单的方法是使用\
  \ `GNOME Software Center`，它极其易用，但也有一些局限性。本节还强调了其他几个选项。使用一种工具添加或删除软件的工作会被相关工具识别，因此混合使用你喜欢的哪些工具是可以接受的。\n\
  \n## 使用 GNOME 软件中心\n\n\n要启动 GNOME 软件中心，点击启动器中的 `Ubuntu Software Center` 图标。当它第一次运行以及此后的偶尔运行时，它将需要一些时间来初始化自身以及可用和已安装应用程序列表。一旦完成，你将看到主界面，如图\
  \ 3-17 所示。\n\n![Image](img/00032.jpeg)\n\n**图 3-17** GNOME 软件主界面\n\n滚动并点击类别可以帮助你筛选特定应用程序的可用列表，或者使用顶部的搜索框通过关键词或程序名称查找。\n\
  \n窗口顶部的图标允许你访问其他功能或信息。你可以通过将 `All Software` 更改其他选项来按源排序软件。点击 `Installed` 列出已安装软件。\n\
  \n你可以通过顶部面板菜单中的 `Software > Software Sources` 更改软件源。\n\n默认情况下，GNOME 软件中心显示所有受 Ubuntu\
  \ 支持的应用程序，包括由社区志愿者支持的 MOTU——Masters of the Universe 的简称（在第 11 章中会有更多介绍）。虽然使用 GNOME\
  \ 软件中心从 Ubuntu 官方软件源和社区源安装新应用程序对大多数用户来说是完美的，但有时更保守的软件选择可能更为。在这种情况下，你可以通过 `View`\
  \ 菜单选择 `Canonical-Maintained Applications` 来限制显示的应用程序数量，仅查看由 Canonical（Ubuntu 背后的公司）积极维护和更新的软件。这种限制在希望或需要更强保证的企业环境中有时更受欢迎。\n\
  \n### 添加和删除程序和包\n\n没有任何操作系统或软件是完美的。此外，可能会添加用户想要或需要的新功能。正因如此，Ubuntu 开发者定期发布软件的安全和其他更新。这些更新被放置在\
  \ Ubuntu 软件源中，并且易于安装。\n\n\n\n\n你机器的大部分更新都与安全有关。换句话说，开发者在 Ubuntu 的某个特定程序中发现了漏洞，并为其发布了修复程序。极少数更新是为了修复某些关键错误而发布的。对于家庭用户来说，通常没有理由不立即安装更新，因为不安装可能会导致你的计算机暴露在安全漏洞之之中。\n\
  \n**提示**\n尽管 Ubuntu 在某些操作系统主要关注的问题（如对病毒和间谍软件的恐惧）方面比其他操作系统要安全得多，但没有任何计算机是绝对安全的，因为没有任何软件是完美的。\n\
  \n当发现可能导致安全问题的问题（如缓冲区溢出或远程利用）时，它们会得到修复并尽快发布更新，尽管这些危险通常是远期的。Ubuntu 开发者还有一项非常严格的策略，即不将具有重大且未经测试的功能变更或新特性的新发布程序放入\
  \ Ubuntu 的稳定版本中。这种做法通过不引入新问题来保持你的系统更加稳定。\n\n### 安装更新\n\n\nUbuntu 16.04 通过启动 `Software\
  \ Updater` 来处理包更新。用户每天都会收到安全更新，并在新 Ubuntu 版本发布时收到通知。由于 16.04 是长期支持（LTS）版本，默认情况下，它只会通知用户新的\
  \ LTS 发布，这意味着它在 2018 年 4 月之前可能一直保持沉默。可以通过点击 `Software Updater` 窗口左下角的 `Settings`\
  \ 来更改此行为。\n\n**注意**\nLTS 代表长期支持（Long-Term Support），该标签指定了特定的 Ubuntu 版本，旨在比每半年一次的常规发布提供更长时间的极性和完整支持。关于\
  \ Ubuntu 版本的更多信息将在本章后面介绍。\n\n## 了解更新了什么\n\n更新窗口（图 3-18）向你展示将发生的变化。在详情面板中，它指出了修复了什么以及如何修复。它还可能列出常见漏洞和披露（CVE）编号。CVE\
  \ 编号是安全漏洞的唯一标识符。你可以在 [`cve.mitre.org`](http://cve.mitre.org) 上查询查看具体的缺陷是什么。然而，大多数人不需要担心（实际上也不乎）这些细节。\n\
  \n![Image](img/00033.jpeg)\n\n**图 3-18** 更新窗口\n\n## 安装不在存储库中的应用程序\n\n尽管存储库包含了大量的软件包，但有时你需要的包并不在那里。你首先应该检查的是是否已经启用了额外的存储库，例如\
  \ `universe` 和 `multiverse`。你可以通过在 Dash 上搜索这些存储库并在 `Software Updater` 中进行。悬停在 `GNOME\
  \ Software Center` 上查看其菜单。在 `Software` 下，选择 `Software Sources` 以确保 `main`、`universe`、`restricted`\
  \ 和 `multiverse` 复选框已勾选。（详情请参阅 [help.ubuntu.com/community/Repositories/Ubuntu](http://help.ubuntu.com/community/Repositories/Ubuntu)）。\n\
  \n**提示：存储库详解**\n`universe` 存储库包含了数千个作为 Ubuntu 基础的 Debian 发行版一部分的软件包。所有这些软件包都是完全免费并由\
  \ Ubuntu 贡献者社区支持。\n\n`multiverse` 存储库包含了一些可以免费下载但并非完全开源的软件包。如果你只想运行开源软件，你可能不想使用这个存储库。\n\
  \n如果你已经启用了这些额外存储库，但你的包仍然不在那里，请使用搜索引擎进行快速查找，看看是否能找到该包的存储库（称为 Debian 或 APT 存储库）。如果你找到了，使用你刚刚操作过的\
  \ `Repositories` 对话框添加新存储库，然后使用 `Synaptic` 安装包。\n\n你可能会遇到的一种常见的额外存储库类型称为个人包存档（PPA）。关于使用\
  \ `PPAs` 的良好信息可以访问 [`help.launchpad.net/Packaging/PPA/InstallingSoftware`](https://help.launchpad.net/Packaging/PPA/InstallingSoftware)。\n\
  \n如果没有可用的存储库，请寻找该应用程序的 Debian 软件包（`.deb`），这最可能从软件公司的网站获取。例如，Adobe 在其网站上为其 Reader\
  \ 软件提供了 Debian 包，Skype 也为其 VOIP 软件提供了同样的包。如果你找到了这样的 `.deb` 包，下载并双击它进行安装。\n\n最后，如果其他方法都失败了，你可能需要下载源代码并在\
  \ [`help.ubuntu.com/community/CompilingSoftware`](https://help.ubuntu.com/community/CompilingSoftware)\
  \ 上的说明进行编译。\n\n### 升级到下一个 Ubuntu 版本\n\n\n本书已修订以匹配最新版本——16.04，但另一个版本很快就会发布。16.04\
  \ 版本与早期的 14.04、12.04、10.04、8.04 和 6.06 一样都是 LTS 版本；它在桌面和服务器上将获得五年的支持。所有其他版本（如 15.10）支持九个月，但每六个月就会被一个新版本取代。基本上，如果你运行的是\
  \ LTS 版本，在下一个 LTS 版本发布之前，你可能对移动到最新最强大的版本不感兴趣。相反，如果你运行的是常规版本，你可能是那种对最新最强大的软件更新感兴趣的人。无论哪种情况，这就是执行升级的方法。\n\
  \n**提示**\n所有的 Ubuntu 版本都旨在保持稳定。LTS 版本旨在额外稳定，因为它们代表了两年规划和功能变更的结晶。中间版本包含了增量变化，这些变化是稳定的但功能可能尚未完整。例如，Unity\
  \ 桌面首次发布于 10.10（这是 10.04 LTS 之后的第一个版本），但它的功能在 12.04 LTS 中变得更加完整，开发更加成熟。\n\n## 执行实际升级\n\
  \n一个名为 `Software Updater` 的图形化工具会在新版本的 Ubuntu 可用时并引导你完成升级过程。请注意，如果你已经知道或想学习手动方法，也可以。两种方法都会产生相同的结果。\n\
  \n当有新版本发布时，`Software Updater` 会提醒你，如图 3-19 所示。你只需要点击升级按钮开始过程。你首先看到的是发布说明，其中提到了新功能或任何待解决的错误。点击此屏幕上的升级按钮后，会对你的软件存储库进行必要的更改，然后程序将下载并安装新的发行版。如果你更改了任何配置文件，可能会收到提示。在实际安装完成后，系统会告诉你哪些（如果有）包不再受\
  \ Ubuntu 官方支持（即已移动到 `universe` 存储库）。你只需要在提示时重启计算机，即可开始使用新版本。\n\n\n\n\n\n![Image](img/00034.jpeg)\n\
  \n**图 3-19** 使用软件更新器和互联网连接从 Ubuntu 15.10 升级\n\n### Ubuntu 与多媒体\n\n近年来，多媒体功能已成为计算不可或缺的一部分。观看\
  \ DVD、网络视频和收听音乐已成为现代计算机使用的不可或缺部分。随着合法音乐下载的极大普及，这些多媒体功能得到了进一步增强。由于有各种音乐的在线商店，在从未见过小巧的银色光盘的情况下收听大部分音乐已不再是常事。\n\
  \n### 安装解码器\n\n多媒体文件和光盘有多种类型，每种类型都使用特殊的解码器（或称编码器/解码器软件）在保持特定质量水平的同时将内容压缩为较小的尺寸。要播放此类媒体，你需要确保已安装了相关的解码器。Ubuntu\
  \ 现在让这变得更加简单：当你打开一个当前安装的解码器不支持的文件时，它会建议提供合适解码器的软件包。只需双击想要打开的文件，系统就会为你提供一个可以安装的软件包列表，以启用对你尝试打开的文件的支持。选择合适的软件包并点击“安装”。\n\
  \n> 提示  \n> 如果你双击文件但没有建议任何软件包，你可能需要将右上角的软件包过滤器更改为`所有可用应用程序`。\n\n由于对解码器施加的法律限制，解码器对于开源软件仍然是一个问题。某些解码器（包括\
  \ MP3、Windows Media Format、QuickTime 和 RealMedia）是专有的，因此在在使用、分发和许可方面受到限制。\n\n\n\
  > 提示  \n> 如果你想了解更多关于安装这些解码器的信息，请参阅 [`help.ubuntu.com/community/RestrictedFormats`](https://help.ubuntu.com/community/RestrictedFormats)。\n\
  \n为了解决这些问题，许多开发者正在致力于免费解码器，例如 Ogg Vorbis 和 Ogg Theora，这些解码器提供了高质量的结果和开放许可。Ogg Vorbis\
  \ 解码器用于音频文件，在较小的文件下可以提供比 MP3 更好的结果。Ogg Theora 解码器用于视频文件，与 MPEG-4 解码器竞争。Ubuntu 默认包含\
  \ Ogg Vorbis 和 Ogg Theora 解码器，你可以开箱编码并播放使用这些解码器的任何媒体。\n\n尽管如果所有解码器都是免费的，世界将会变得更美好，但现实并非如此，许多\
  \ Ubuntu 用户仍然想播放用专有解码器压缩的媒体。表 3-1 显示了用于编码和播放媒体的最典型解码器，并列出了在 Ubuntu 中的支持情况。\n\n![Image](img/00035.jpeg)\n\
  \n**表 3-1** 解码器支持\n\n### 收听音频文件\n\nUbuntu 包含了名为 `Rhythmbox Music Player` 的强大音乐播放器，用于组织和播放你的音乐收藏。默认情况下，Ubuntu\
  \ 将会在“位置”菜单访问的 `Music` 目录查找音乐。\n\n***使用 Rhythmbox*** 通过在 Dash 中搜索 `Rhythmbox Music\
  \ Player` 来加载 `Rhythmbox`（图 3-20）。你也可以使用顶部面板右侧通知区域的 `Sound` 图标快速访问 `Rhythmbox`。点击图标快速打开或最小化\
  \ `Rhythmbox` 窗口，你可以在那里找到音量控制、播放列表和`Sound Settings`菜单。\n\n![Image](img/00036.jpeg)\n\
  \n**图 3-20** Rhythmbox 是管理音乐收藏的好地方。\n\n`Rhythmbox` 窗口被分为若干个不同的面板，每个面板显示关于你音乐收藏的不同细节。左侧面板（`Source`）允许你选择音乐来源，例如你的媒体库、播客和网络电台。这些选项中的每一个都有一个浏览器面板显示内容的来源。\n\
  \n***收听播客*** 播客是可以订阅的音频节目，它们正日益成为收听音频文件和音乐的新方式。当你订阅一个播客时，每个新发布的内容都会自动为你下载。这使得定期收听音频节目变得极其方便。\n\
  \nRhythmbox 对播客源有很好的支持，订阅源非常简单。在侧边栏中，右键点击 `Podcasts` 条目并点击 `New Podcast Feed`。右键点击输入框并选择\
  \ `Paste` 粘贴源地址。文件会自动下载，你可以通过双击它们来收听。每次你启动 `Rhythmbox` 时，系统都会检查是否有新的剧集；如果有，这些播客就会下载。\n\
  \n> 注意：Rhythmbox 与 iPod 及其他媒体播放器  \n> `Rhythmbox` 还可以从你的 `iPod` 读取歌曲：只需插入 `iPod`，设备信息就会显示在\
  \ `Rhythmbox` 中。`Rhythmbox` 可以从 `iPod` 读取，但可能无法写入所有 `iPods`。对大多数其他媒体播放器的支持得非常好，包括作者基于\
  \ Android 的手机。\n\n### 播放和刻录 CD\n\n\n### 与照片交互\n\n`Shotwell` 是一款照片管理程序，你可以用它导入照片、组织它们并进行基础处理，如消除红眼、裁剪或简单的色彩调整。当\
  \ `Shotwell` 导入照片时，它会读取图像文件中的元数据，然后按日期排序。完成后，它会创建一个时间线，允许你以组、单独甚至全屏幻灯片的形式查看。你可以直接从\
  \ `Shotwell` 将照片单独或批量导出到 `Flickr` 或 Google `Piasa` 等知名 Web 服务、文件夹，甚至是一张送给朋友或家人的\
  \ CD。\n\n### 观看视频\n\n在 Ubuntu 中观看视频，你需要确保已安装了正确的解码器。如前所述，由于包含在 Ubuntu 系统中的法律影响，某些解码器是单独提供的。虽然新的建议和安装解码器的流程涵盖了最常见的文件类型，但你应该参考\
  \ Ubuntu Wiki [`wiki.ubuntu.com`](http://wiki.ubuntu.com) 获取安装未包含解码器的详情。\n\n***使用\
  \ Videos*** 在 Ubuntu 中观看视频，你使用 `Videos`（图 3-21）。通过点击启动器中的 Dash Home 并搜索 `Videos`\
  \ 来加载它。\n\n![Image](img/00037.jpeg)\n\n**图 3-21** Videos 是一个简单且灵活的媒体播放器。\n\n要观看硬盘上的视频，点击\
  \ `Movie > Open` 并从磁盘中选择文件。\n\n> 提示：加载文件到 Videos 的另一种方法  \n> 你也可以通过双击桌面或文件管理器中的多媒体文件将它们加载到\
  \ `Videos` 中。\n\n\n\n\n\n# 让 DVD 正常工作\n\nUbuntu 自带对未加密 DVD 的支持。由于 DVD 行业的现状，大多数\
  \ DVD 都是加密的。如果你想观看这些 DVD，需要确保安装了可以解密这些 DVD 的软件库。遗憾的是，该软件库需要单独安装，并且不包含在 Ubuntu 中。详情请参阅\
  \ Ubuntu 的受限格式页面：[`help.ubuntu.com/community/RestrictedFormats`](https://help.ubuntu.com/community/RestrictedFormats)。\n\
  \n安装好库后，将光盘插入电脑，Ubuntu 将自动启动电影播放器（Movie Player）来查看光盘。或者，也可以启动电影播放器，然后点击 `View >\
  \ Play Disk` 来播放 DVD。电影播放器不支持 DVD 菜单，但你仍然可以使用它来播放 DVD。\n\n当你准备好看电影时，你可能想要配置一些其他设置。首先点击\
  \ `View > Aspect Ratio` 为你的屏幕选择正确的宽高比例，然后选择 `View > Fullscreen` 切换到全屏模式。要退出全屏模式，只需移动鼠标，屏幕上就会出现一些控制控件。\n\
  \n### 备份\n任何使用过一段时间电脑的人都听过这样的建议：“备份，经常备份，测试备份，反复如此。”很少有人能真正遵循这条建议，但忽视它是危险的，可能会导致重要文档、文件、图片等的丢失。\n\
  \n为了防止这种损失，审慎的计算机用户无论使用何种操作系统，都会选择一种方法将他们的文件复制到安全位置进行存储，并定期使用该方法。为了帮助你制定最适合自己的策略，我们想了一些可以供考虑的选项。这个话题很大，你如何处理它是一个非常个人化的决定。我们并没有提供分步操作说明，而是提到了几个供考虑的选项，留给你去进一步研究并决定一个看起来合适且吸引人的方案。\n\
  \n有些用户发现对他们来说简单的方法是买一个外部硬盘，每隔一两周将所有文件复制到里面。另一些看到之后会心想：“一定有更好的方法。”也许他们注意到这些方法每次都要复制每一个文件，即使该文件已经很多年没有变化了。在这种情况下，增量备份是理想的，让电脑比较原始位置的文件与备份位置（如外部硬盘）中的存储文件，并只复制新的或更改的文件。\n\
  \nUbuntu 存储库中提供了几个用于备份的 GUI 程序。每个程序都带有一个基础且实用的图形界面，易于理解和使用，并且每个程序都可以配置为允许全量或增量备份。默认安装了一个备份程序，可以通过\
  \ Dash 搜索 `backups` 找到。该程序允许你配置自动或手动备份、指定备份位置、指定要备份的内容、设置自动备份计划、从备份中恢复文件等（图 3-22）。\n\
  \n![Image](img/00038.jpeg)\n\n**图 3-22** 备份设置主窗口\n\n对于那些稍微进阶（或更勇敢一点）并且热爱命令行程序原始力量的用户来说，用于备份最好的两个程序是\
  \ `rar` 和 `rsync`，它们都可以在 Ubuntu 存储库中获得。安装完成后，你可以在终端中输入 `man rar` 或 `man rsync` 阅读手册页并学习如何使用它们。虽然\
  \ `rar` 和 `rsync` 很复杂，但它们在制作备份和恢复备份方面既快速又效果惊人。\n\n***\n\n### 提示：手册页 (Manpages)\n\
  \n手册页（简称为 manpages）是关于如何使用某件软件的说明。它们包含了关于从命令行使用软件的信息、选项以及一些提示。要访问它们，打开终端（Terminal）并输入\
  \ `man command`，其中 `command` 是你通常运行该软件时执行的命令。\n\n***\n\n遗憾的是，在这个内容丰富的章节中的一个小节中进行这种简要提到，只能让你意识到良好备份的必要性，并引导你寻找最适合自己的完美方法。无论你决定如何备份数据，我们都强烈建议不要忽视备份的需要，而是要找到一种适合你的方法。如果你对此或其他主题有任何问题，Ubuntu\
  \ 社区有大量非常有帮助的人可以向他们寻求建议，我们建议你从在 Ask Ubuntu [`askubuntu.com`](http://askubuntu.com)\
  \ 搜索或提问开始。\n\n## 定制 Ubuntu 的外观和感觉\n\n点击顶部面板右侧的齿轮图标并选择 `System Settings`（系统设置）来配置和自定义你的系统。你可以在\
  \ Dash 的应用程序视图（Applications Lens）和系统过滤器（System filter）找到其他设置。可以随意自定义你喜欢的任何内容，但请注意你正在操作，以便在你不喜欢结果时将其改回来。第\
  \ 5 章 有关于定制 Ubuntu 的更多信息。\n\n***\n\n### 提示：感受力量\n\n当你安装 Ubuntu 时，系统会要求你一个用户名和密码。第一个用户账户（及其密码）不仅可以访问你的普通用户账户，还可以访问功能强大的管理功能。因此，当你使用此账户访问菜单选项并被要求输入密码时，只需输入该用户账户的密码即可使用这些功能。\n\
  此功能仅适用于安装期间创建的用户账户。如果你添加了其他用户，需要显式允许他们访问管理选项。\n\n***\n\n### 其他设备上的 Unity\n\n正如本章前面提到的，Unity\
  \ 的主要设计目标之一是拥有一个跨设备相似的用户界面。\n\nUnity 目前跨多个设备。它的形式在每个设备上会变化，但视觉概念是相同的。Unity 同样具有\
  \ Dash、视图（Lenses）和范围（Scopes）。\n\n使用 Unity 的其他设备可以在此处找到：\n\n![Image](img/00002.jpeg)\
  \ **手机：** [www.ubuntu.com/phone](http://www.ubuntu.com/phone)\n\n![Image](img/00002.jpeg)\
  \ **平板电脑：** [www.ubuntu.com/tablet](http://www.ubuntu.com/tablet)\n\n![Image](img/00002.jpeg)\
  \ **电视：** [www.ubuntu.com/tv](http://www.ubuntu.com/tv)\n\n### 总结\n\n在本章中，你学习了如何开始使用桌面的核心功能。这些概念让你能够执行计算机的大部分日常任务，并为你探索本书的其他部分提供基础，学习系统的更高级用法并探索\
  \ Ubuntu 提供的巨大灵活性。\n\n网上上有丰富的帮助和文档。如果你发现自己被难住了，可以查看 Ubuntu 网站 [www.ubuntu.com](http://www.ubuntu.com)\
  \ 或 Ubuntu 文档 [`help.ubuntu.com`](http://help.ubuntu.com)，并利用可获得的社区协助，如 第 11 章 所示。\n\
  \n\n\n\n\n![Image](img/00003.jpeg) 摘要\n\n除了默认安装的那些应用程序外，Ubuntu 还提供了丰富的其他应用程序，帮助你充分利用计算机。不同的人使用机器的方式各异，正因于此，我们希望帮助你发现如何让你的\
  \ Ubuntu 计算机发挥更多功能。\n\n第 3 章 简要介绍了 GNOME 软件中心，作为安装或删除软件的一种方法。在本章中，我们将涵盖这种方法以及其他方法。使用某一个工具完成的添加或删除软件的操作会被相关工具识别，因此，混合使用这些工具是没问题的。\n\
  此外，我们还将向你展示可以在 Ubuntu 系统上安装的成千上万个额外应用程序中的几个。每个章节都展示一个应用程序，首先是你需要安装的包名称，以及可能存在的各种\
  \ Windows/OS X 对应软件。\n\n## 使用 GNOME 软件中心\n\n与本章后面讨论的其他工具一样，GNOME 软件中心从 Ubuntu 在线软件仓库中安装程序。\n\
  \n提示：GNOME 软件中心 vs. Ubuntu 软件或 Ubuntu 软件商店？\n\n尽管该程序被称为 GNOME 软件中心，但在启动（Dash）和其他各种菜单中，它可能被称为“Ubuntu\
  \ 软件”或“Ubuntu 软件商店”。但不必担心，它们都是同一个程序。\n\n要启动 GNOME 软件中心，点击桌面左侧启动器中的 Dash 图标。在出现菜单顶部的搜索框中，输入\
  \ `Software`，搜索将自动开始。点击框中出现的 Software 图标。当它第一次运行时（以及之后偶尔运行时），它将需要一些时间来初始化自身以及可用和已安装应用程序列表。一旦完成，你将看到如图\
  \ 4-1 所示的主界面。\n\n![Image](img/00039.jpeg)\n\n**图 4-1** GNOME 软件中心主界面\n\n我们之前在第 3\
  \ 章中介绍过 GNOME 软件中心的基础知识。现在让我们来看看其他一些方面。\n\n### 排序\n\n点击 GNOME 软件中心窗口底部的类别名称可以按类别对列出的包进行排序。其中某些包进一步细分为更小的子类别，例如图\
  \ 4-2 所示的游戏列表。请注意，书籍和杂志现在可以通过该应用程序立即以数字格式获取。\n\n![Image](img/00040.jpeg)\n\n**图\
  \ 4-2** 有多种游戏可用。\n\n### 搜索\n\n在窗口顶部中央的搜索框输入搜索词以查找相关软件。执行的的是实时搜索，这意味着结果随着你的输入而更新；你不需要先按\
  \ `Enter`，可以更改词并在结果加载时获取新结果，如图 4-3 所示。\n\n![Image](img/00041.jpeg)\n\n**图 4-3**\
  \ 不需要输入完“word processing”即可获得结果。\n### 了解更多包信息并安装\n\n点击包名称、图标或描述可以了解更多关于该包的信息。你可以点击安装安装软件。还有一个网站按钮，它可以打开软件开发者的网站，方便你轻松获取更多信息以帮助你决策。关于包的进一步信息——包的具体版本、大小和许可等——包含在下方、评论（Reviews）部分正上方。\n\
  \n向下滚动阅读评论和评分，如果该包发布了评论的话（图 4-4）。你可以通过点击标记为“写评论”（Write a Review）的按钮来编写自己的评论。\n\n\
  ![Image](img/00042.jpeg)\n\n**图 4-4** 用户在软件评论中往往很诚实。\n\n### 从 GNOME 软件中心删除包\n\n\
  如果你决定不再需要某个已安装的包，只需使用搜索栏搜索它。一旦找到列表，点击位于包描述旁边的删除（Remove）按钮，从你的计算机中移除该包。\n\n### 免费软件\n\
  \n从 GNOME 软件中心提供的软件在成本以及供人们查看、修改和编辑的代码方面都是免费的。你不需要为这些软件支付任何费用，复制、使用、共享它们等都是完全合法的。\n\
  \n## 学习术语和基础知识\n\n学习几个术语的含义有助于你更好地理解软件是如何安装到你的机器上的，以及系统是如何工作的。\n\n![Image](img/00002.jpeg)\
  \ **APT:** 高级包工具（APT）描述了整个在线仓库系统以及下载和安装这些仓库的部分。在使用像 GNOME 软件中心这样的基于图形界面的系统时，APT\
  \ 并不明显，但当你使用如 `apt-get` 的命令行工具时（在第 8 章中有详细描述），它非常明显。无论你使用图形界面还是命令行处理 Ubuntu 软件包，APT\
  \ 都在工作。\n\n![Image](img/00002.jpeg) **仓库或软件通道：** 在 Ubuntu 世界中，这些巨大的在线软件仓库分为官方 Ubuntu\
  \ 仓库和非官方仓库。\n\n![Image](img/00002.jpeg) **包：** 应用程序存储在包中，这些包不仅描述了你想要安装的程序，还告诉包管理器程序运行需要什么以及如何安全地安装和卸载它。这使得处理软件依赖的过程对终端用户变得流畅且简单。\n\
  \n![Image](img/00002.jpeg) **依赖：** 依赖包含了作为其他软件运行基础的软件。例如，GNOME 软件中心的运行需要 APT，因为\
  \ APT 负责处理许多许多细节。\n\n### 使用 Synaptic\n\nSynaptic 是一个强大的包管理图形化工具。它不是默认安装的。虽然 GNOME\
  \ 软件中心处理包含应用程序的包，但 Synaptic 处理所有包，包括应用程序、系统库和其他软件。在这一层上更改系统更为复杂，但也允许你进行更详细的控制。例如，如果某个不在包中的程序需要某个特定的库，你可以选择安装该库。\n\
  提示：什么是库（Library）？\n\n在这种语境下，库是一个可能对多个程序有用的软件函数集合。这个集合被放在一个单独包中，通过不强制多个程序包含相同的代码来节省空间，而是在需要该库包含的特定功能时引用它。这也使得更新变得更容易，例如当修复安全问题时，因为程序代码可以在一处更改，同时有利于所有使用该函数的程序。库简化软件支持使其更加高效。但要小心：安装不需要的库可能会导致软件故障。\n\
  \n你可以从 GNOME 软件中心安装 Synaptic，然后在 Dash 中搜索 *Synaptic Package Manager* 来找到它。启动它，你将看到主窗口，如图\
  \ 4-5 所示。\n\n![Image](img/00043.jpeg)\n\n**图 4-5** Synaptic 主窗口\n\n提示：名字的含义？\n\n\
  为什么叫 Synaptic？*Synaptic* 是基于你的大脑突触和 APT 词的双关语。\n\n### 安装包\n\n\n\n\n\n与使用 GNOME 软件中心一样，使用\
  \ Synaptic 安装软件包也相当简单。你可以浏览软件包列表并点击包名称以展开其描述。你将在 Synaptic 窗口底部的框中看到它。找到想要安装的软件包后，点击包名称右侧的复选框并选择\
  \ `Mark for Installation`（标记安装）。可能会弹出一个对话框（图 4-6），显示需要安装哪些依赖项（如果有）；你可以通过点击 `Mark`（标记）按钮接受这些依赖项。选好所有需要的软件包后，点击\
  \ Synaptic 工具栏上的 `Apply`（应用）开始安装。\n\n![Image](img/00044.jpeg)\n\n**图 4-6** “标记安装”时的弹出窗口\n\
  \n 移除软件包\n\n要移除软件包，请点击已安装包名称旁边的框，并选择 `Mark for Removal`（标记移除）。与安装软件包一样，你可能会被要求标记额外的软件包进行移除（图\
  \ 4-7）。这些通常是依赖于你标记移除的主软件包而存在的包。如果你也想删除所有配置文件，请选择 `Mark for Complete Removal`（标记完全移除）。请记住，如果你决定在稍后重新安装该软件包，你的设置将不会保存，因为所有配置文件都将被重置。在选好想要移除的软件包后，点击工具栏上的\
  \ `Apply` 开始移除软件包的过程。\n\n![Image](img/00045.jpeg)\n\n**图 4-7** “标记移除”时的弹出窗口\n 查找该软件包\n\
  \n所以你正在寻找某个软件包但不知道从何开始？只需点击工具栏上的 `Search`（搜索）按钮并输入搜索词。默认情况下，普通搜索会同时查看名称和描述，但也可以仅通过名称或其他许多字段进行搜索。\n\
  \n如果你知道软件包所在的分类，可以在左侧窗格中选择它（你可能需要返回 `Sections` 窗格）。选择左下角标记为 `Sections` 的按钮，浏览该部分中的软件包。\n\
  \n除了“部分”之外，其他的软件包列表和排序选项也值得探索。你可以使用 Synaptic 窗口左下角的按钮访问它们。`Status`（状态）让你根据安装状态进行排序。`Origin`（来源）根据安装软件的仓库进行排序（对于手动安装的软件则无仓库；参见本章稍后关于安装不在仓库中的软件的章节）。你甚至可以创建自定义过滤器来帮助搜索。\n\
  \n***\n\n注意\n\n如果你想学习如何从命令行安装软件，请参见第 8 章。\n\n***\n\n### 值得探索的实用软件包\n\n本章此节讨论的软件默认不安装，但被认为非常实用且受推崇。这些软件包在这里被标识为推荐，帮助那些有特定需求的用户缩小搜索范围，找到符合其要求的程序。\n\
  \n### 使用 GIMP 和 Inkscape 创建图形\n\n##### GIMP\n\n包名称：`gimp`\n\nWindows 等效软件：Adobe\
  \ Photoshop 或 `GIMP`\n\nGNU 图像处理程序（GNU Image Manipulation Program），被朋友亲切地称为 `GIMP`，是一个强大的图形软件包。`GIMP`\
  \ 为创建不同类型的图形提供了全面的功能。它包含了用于选择、绘制、路径、掩罩、过滤器、效果等的工具。它还包含了一系列用于不同媒体类型的模板，例如 Web 横幅、不同纸张尺寸、视频帧、CD\
  \ 封面、软磁盘标签，甚至是卫生纸。\n\n***\n\n注意\n\n在 Ubuntu 的早期版本中，`GIMP` 是默认安装的，但多年来不再以这种方式安装，主要是因为它是一个特定受众的大型软件包，且希望为更通用的软件包留出空间。\n\
  \n***\n当打开 `GIMP` 时，有一套独立的工具栏出现在应用程序工作区上方。这对于新用户来说起初可能会有些困——尤其是那些习惯了 Photoshop 的用户。如果你想让工具栏停靠在工作区，可以前往\
  \ `Windows > Single Window Mode`（单窗口模式）。这种模式可以帮助你更熟悉 `GIMP` 工具。为了让你开始，让我们在 `GIMP`\
  \ 中运行一个简单的会话。\n\n**示例** 在 Dash（启动器）中搜索并启动 `GIMP`。\n\n当 `GIMP` 加载时，你将看到一组不同的窗口，如图\
  \ 4-8 所示。\n\n![Image](img/00046.jpeg)\n\n**图 4-8** `GIMP` 不像 Adobe Photoshop 那样将所有内容放在一个窗口中。\n\
  \n你现在有两个窗口。图 4-8 中左侧的窗口是主工具面板。该窗口提供了各种可用于创建图像的工具。右侧的窗口提供了图层、笔刷和其他信息的细节。`GIMP`提供了大量用于不同用途的窗口，而这些只是默认显示的两个。\n\
  \n要创建一个新图像，点击 `File > New`（文件 > 新建）。将出现图 4-9 所示的窗口。\n\n![Image](img/00047.jpeg)\n\
  \n**图 4-9** 有很多模板可用，甚至用于卫生纸的！\n\n最简单的开始方法是选择许多模板之一。点击 `Template`（模板）来选择许多模板中的一个。点击\
  \ `Template` 框并选择 `640 × 480`。如果你点击 `Advanced`（高级）展开器，还可以在 `Colorspace`（色彩空间）框中选择\
  \ `RGB` 或 `grayscale`（灰度）。你还可以选择透明背景。点击 `OK`（确定），背景就会应用到你的图像上。\n\n![Image](img/00048.jpeg)\n\
  \n**图 10** 使用右键访问 GIMP 选项。要处理你的图像，使用调色板选择你想使用的工具。每当你点击调色板上的工具时，该工具的选项就会出现在窗口底部。当你点击工具箱中看起来像\
  \ `A` 的按钮时，它会选中文本工具。在工具箱底部，你会看到不同的选项。点击看起来像大写和小字母 `A`（如 `Aa`）的 `Font`（字体）按钮，并选择\
  \ `Sans Bold` 字体。现在点击 `Size`（大小）框上的向上箭头，并将尺寸选择为 `60 px`。将鼠标悬停在空图像窗口上，你会看到鼠标指针变为文本光标。点击图像，弹出一个框，你可以在其中输入要添加到图像的文本。输入\
  \ `Ubuntu`。在文本框打开的情况下，点击 `Size` 框上的向上箭头使文字填充大部分窗口。当你对格式满意后，点击文本输入框上的 `Close`（关闭）。你的图像应该类似于图\
  \ 4-11。\n\n![Image](img/00049.jpeg)\n\n**图 4-11** Ubuntu 自带了一系列字体供图像使用。\n\n现在，在工具箱中，点击末端带有箭头的交叉按钮。你可以使用此工具移动文本。点击黑色文本，并移动鼠标。让我们添加一个效果过滤器。`GIMP`\
  \ 自带多种过滤器。你可以通过右键点击图像并选择 `Filters`（过滤器）子菜单来访问它们。\n\n对于我们的图像，右键点击图像并选择 `Filters >\
  \ Blur > Gaussian Blur`（过滤器 > 模糊 > 高斯模糊）。在 `Horizontal`（水平）和 `Vertical`（垂直）框中，选择数值\
  \ `5`。点击 `OK`，模糊就会应用到你的文本上。（`GIMP` 中的任何操作都可以通过点击 `Edit > Undo`（编辑 > 撤销）或输入 `Ctrl-Z`\
  \ 来撤。）你的图像现在看起来图 4-12。\n\n![Image](img/00050.jpeg)\n**图 4-12** Ubuntu 中的 GIMP 封装了许多过滤器和效果。\n\
  \n\n\n\n现在我们将创建另一个层，并在模糊的文本上方放置一些文本，以创建一个有趣的效果。如果 `Layers`（图层）窗口尚未打开，请通过 `Windows\
  \ > Dockable Dialogues > Layers` 打开它。`Layers` 窗口将会出现。\n\n图层就像透明的塑料片，可以相互堆叠。它们允许你在其中一个层上创建某些图像，然后在上方创建另一个带有其他图像的层。通过组合使用，图层可以创建看起来复杂的图像，而且易于修改，因为你可以单独编辑每个层。目前，我们的模糊文本是一个层。我们可以点击\
  \ `Layers` 对话框中的纸张图标来添加新层。会弹出另一个窗口，你可以在其中配置新层。默认设置是可以的（它们会创建一个与你的图像大小匹配的透明层），因此点击\
  \ `OK`。接下来，双击工具箱窗口中的黑色色块，并选择一种浅色。你可以通过在颜色范围内移动鼠标，并在找到喜欢的颜色后点击 `OK` 来完成此操作。从调色板点击文本按钮，再次添加“Ubuntu”文本。文本添加后，它的大小将与之前相同。使用\
  \ `move tool`（移动工具）将其置于模糊文本上方。现在，你拥有了带有健康光亮的“Ubuntu”字样，如图图 4-13 所示。\n\n![Image](img/00051.jpeg)\n\
  \n**图 4-13** 组合可以产生有趣的效果。\n\n最后一步是裁剪图像以移除未使用的空间。点击 `Tools > Transform Tools > Crop`，并使用鼠标在“Ubuntu”字样周围画框。你可以点击选择区域附近的边缘来更精确地调整选择。点击选择区域内部，图像将被裁剪。\n\
  \n要保存工作，请点击 `File > Save` 并输入文件名。你可以使用 `Select File Type`（选择文件类型）展开器从许多不同的文件格式中进行选择。\n\
  \n***\n\n提示：如何在 GIMP 中保存文件？\n\nGIMP 的变化修改了保存文件的过程。你的选项是将文件以原生 `.xcf` 格式保存，或者将文件导出并以更通俗的格式保存，如\
  \ `.jpg` 或 `.png`。\n\n***\n\n**更多资源** 如果你想研究 GIMP 中的其他功能，一个极好的起点是 GIMP 自己的帮助函数。它默认没有安装，但如果你连接了互联网，帮助查看器会自动下载它。你也可以通过\
  \ GNOME 软件中心搜索 `gimp help` 来安装它。GIMP 官方网站（[www.gimp.org](http://www.gimp.org)）拥有所有帮助信息以及教程等内容。\n\
  \n### Inkscape\n\n包名：`inkscape`\n\nWindows/OS X 对应软件：Adobe Illustrator, Adobe Freehand,\
  \ Inkscape\n\nInkscape 也是一个绘图和图形创建工具，与 GIMP 类似，但重点略有不同。与处理位图的 GIMP 不同，Inkscape 是一个矢量绘图工具。这意味着它不是使用分配了颜色的像素网格，而是使用角度和任意单位对图形进行数学描述。\n\
  \n要开始使用 Inkscape，请在 Dash 中搜索并启动它。很快，你将看到默认窗口，其中带有 Letter 或 A4 的基础画布，默认设置取决于你居住在世界的哪个位置。在屏幕顶部、菜单下方，有三组工具栏。最上方的一组包含保存和缩放等常用工具，第二组提供了一系列吸附选项，第三组的内容根据所选工具而改变。\n\
  \n\n![Image](img/00052.jpeg)\n\n**图 4-14** Inkscape 的工具栏\n\n首先，选择左侧缩放图标下方的 `rectangle\
  \ tool`（矩形工具）。在屏幕任意位置画一个矩形。现在让我们更改填充颜色和外线条的颜色。\n\n***\n\n**注意**\n\n在使用任何绘图工具时，按下\
  \ `Shift` 键会导致对象从点击的中心向外生长，按下 `Ctrl` 则允许你限制尺寸和旋转。\n\n***\n\n在矩形仍被选的情况下，右键点击并选择 `Fill\
  \ and Stroke`（填充和描边）。在右侧，你会看到窗口出现，带有三个不同的标签：`Fill`（填充）、`Stroke Paint`（描边绘制）和 `Stroke\
  \ Style`（描边样式）。让我们用从橙色到白色的渐变填充该矩形。在 `Fill` 标签正下方，将 `Flat color`（纯色）改为 `Linear Gradient`（线性渐变）（图\
  \ 4-15）。\n\n![Image](img/00053.jpeg)\n\n**图 4-15** 你的矩形，现在有了漂亮的渐变填充\n\n回矩形，可以看到渐变以及一条横跨矩形的新线。移动正方形或圆形都可以定义渐变的开始和结束位置。要更改颜色，点击\
  \ `Edit...` 按钮。一旦 `Edit` 对话框出现，渐变的每个端都被称为 `stop`（停止点），并可以单独编辑（图 4-16）。\n\n![Image](img/00054.jpeg)\n\
  \n**图 4-16** 渐变编辑对话框\n\n现在我们有了矩形，让我们为图像添加一些文本。选择 `Text` 工具，它位于左侧底部，并点击任意位置。会出现一个光标，你可以开始输入“Ubuntu。”接下来我们将更改文本的颜色和大小。我们将字体设置为\
  \ 56 点；此大小可以在右侧 `Font` 旁边选择。\n\n`Fill and Stroke` 对话框应该仍在右侧打开，如果没有，请重新打开它。将文本颜色改为红色，然后选择\
  \ `selection tool`（选择工具）。在文本和矩形周围画一个框，你应该看到两者都被选中（图 4-17）。\n\n![Image](img/00055.jpeg)\n\
  \n\n接下来打开 `Alignment`（对齐）对话框，它位于 `Object` 菜单底部。像 `Fill and Stroke` 对话框一样，它出现在右侧。要让框居中，找到带有蓝线的中间图标。点击\
  \ `Horizontal`（水平）和 `Vertical`（垂直）对齐选项，文本和图像将在页面上居中（图 4-18）。\n\n![Image](img/00056.jpeg)\n\
  \n**图 4-18** 你的最终绘图\n\n现在你已经创建了图像，你可以用它做什么？默认情况下，Inkscape 以 `SVG`（可缩放矢量图形）格式保存文件，这是一种开放的标准。如果你想将作品带到其他地方并在计算机上显示或打印，Inkscape\
  \ 也可以以 `PDF` 格式保存文件。如果你选择将图像转换为 `PDF` 文件，请确保也保存一份 `SVG` 副本，以便以后需要时编辑。`SVG` 和 `PDF`\
  \ 都是 `Save` 对话框中的选项。使用 `PDF` 格式的一个关键优势是嵌入字体和图形，这意味着你的图像在几乎任何计算机上看起来都一样。你还可以将图像导出为\
  \ `PNG` 文件，以便嵌入文本文档或上传到网络。许多现代浏览器（如 `Firefox` 和 `Chrome`）也可以直接显示 `SVG` 文件，尽管大多数不支持完整的\
  \ `SVG` 标准。要导出图像，选择 `File > Export`，这允许你决定仅导出选中的对象、整个文档或它的部分内容。到此，你已经看到 Inkscape\
  \ 有多强大。在 Inkscape 中还有很多可以做的事，所以请尝试各种选项、对话框和形状。\n\n\n\n\n\n## 更多资源\n如果你想研究 Inkscape\
  \ 中发现的其他功能，一个极好的起点始终是 Inkscape 自己的帮助文档，它是 SVG 格式的，因此你可以看到原始作者是如何创建教程的。Inkscape 网站（[`inkscape.org`](http://inkscape.org)）包含一些很棒教程和文章。如果你想看书，Tav\
  \ Bah 的《*Inkscape：矢量绘图程序指南*》（Inkscape: Guide to Vector Drawing Program）第三版是一个很好的起点。\n\
  \n### 使用 Scribus 进行桌面出版\n\n包名：`scribus`\n\nWindows 对应软件：`Adobe InDesign`, `Scribus`\n\
  \n如果你想进行比 LibreOffice 更强大的文档创建，Scribus 是你的理想之选。Scribus 是一款桌面出版应用，专为设计和布局各种尺寸和类型的文档而构建的。因此，它包含了一些不同的假设，如果你习惯使用\
  \ LibreOffice 创建文档，这些假设可能会让你措手不及。\n\n当你首次启动 Scribus 时，它会询问你想创建什么种类型的文档，或者是否想打开现有文档。让我们创建一个单页文档并体验一下\
  \ Scribus（图 4-19）。\n\n![Image](img/00057.jpeg)\n\n**图 4-19** Scribus 的打开对话框，包含许多选项\n\
  \n关于 Scribus 的第一点是它是一个桌面出版程序——这意味着它并不是为直接编辑图像和文本设计的。理想情况下，你会在 `GIMP` 或 `Inkscape`\
  \ 等应用程序中编辑并创建图像，并在 `LibreOffice` 等文字处理器中处理文本，然后将它们导入 Scribus。\n\n首先，让我们创建一对文本框。在示例中，我们将使用位于\
  \ `Welcome_to_Ubuntu.odt` 文件中的文档。要创建文本框，你需要使用“插入文本框”（Insert Text Frame）工具，该工具位于工具栏的中间部分。画好文本框后，你需要向其中添加文本。右键点击该框并选择“获取文本”（Get\
  \ Text）。会弹出一个与“打开”对话框非常类似的对话框。选择 `Welcome_to_Ubuntu.odt` 文件，然后选择“确定”。系统会询问你几个选项；现在，接受默认设置即可。你应该能看到文本出现在屏幕上（图\
  \ 4-20）。\n![Image](img/00058.jpeg)\n\n**图 4-20** 框中导入的文本\n\n注意\nScribus 目前无法导入 Microsoft\
  \ Word 文档，因此你需要在 `LibreOffice` 中打开它们并转换为 `.odt` 文件，以便 Scribus 能够导入。\n\n如你所见，文本溢出了框。为了确保其余文本可见，你需要创建另一个文本框，并将这两个文本框链接，允许溢出部分出现在第二个框中。再次回到工具栏，选择“插入文本框”，并在页面底部大约画另一个框。然后选择第一个框，并选择工具栏上的“链接文本框”（Link\
  \ Text Frames）图标；该图标看起来像两列之间带有一个箭头。接下来点击第二个文本框。此时应该会出现一个箭头，更重要的是，你的文本现在应该从一个框流向另一个框（图\
  \ 4-21）。\n\n![Image](img/00059.jpeg)\n\n**图 4-21** 文本现在在框之间流转。\n\n接下来，让我们在屏幕底部插入一张图像。和文本一样，你需要创建一个图像框，然后将图像添加到该框中。在两个文本框下方画图像框，然后右键点击并选择“获取图像”（Get\
  \ Image）。与文本导入步骤一样，在“打开”对话框中选择你的文件——这次是一个图像文件——它就会出现在框中。让我们选择 Ubuntu 标志，它位于 `Example\
  \ Content` 下的 `Logo` 文件夹中。它将出现在你的图像框中（图 4-22）。\n\n![Image](img/00060.jpeg)\n\n**图\
  \ 4-22** 添加了图像的文档\n\n注意\nScribus 可以导入 `gif`、`jpg`、`png`、`xpm`、`psd`、`tiff`、`eps`\
  \ 和 `pdf` 文件。它还无法导入 `GIMP` 的 `XCF` 格式文件，因此你需要将将在 `GIMP` 中创建的任何图像导出为支持的格式。\n\n现在你添加了一些文本和图像，让我们将你的作品导出为\
