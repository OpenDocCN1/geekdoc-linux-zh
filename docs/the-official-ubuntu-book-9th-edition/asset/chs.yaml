  \ RAID）。\n\n![Image](img/00002.jpeg) **第 9 章：Ubuntu 相关项目及衍生版。** 将有许多基于 Ubuntu 的\
  \ Linux 发行版会让你觉得有趣且可能有用。我们讨论了其中一些项目，以及对 Ubuntu 创建至关重要的项目，例如 `Launchpad` 和 `Bazaar`。\n\
