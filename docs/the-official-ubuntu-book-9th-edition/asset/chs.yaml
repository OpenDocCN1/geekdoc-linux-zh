- "# Ubuntu 官方指南（第9版）\n\n\n\n![](img/00168.jpeg)\n\n## 关于本电子书\n\nEPUB 是一种开放的行业标准电子书格式。然而，不同阅读设备和应用程序对\
  \ EPUB 许多功能的支持程度不同。请使用您的设备或应用设置来自定义符合您喜好的显示。您可以自定义的设置通常包括字体、字体大小、单栏或双栏、横屏或竖屏模式，以及可以点击或触摸放大的图片。有关您的阅读设备或应用上关于设置和功能的更多信息，请访问设备制造商的网站。\n\
  \n许多书籍包含编程代码或配置示例。为了优化这些元素的显示效果，请在单栏横屏模式下查看电子书并将字体大小调整为最小。除了以重流文本格式呈现代码和配置外，我们还包含了模拟印刷版显示效果的代码图像；因此，当重流格式可能会影响代码列表的显示时，您将看到“点击此处查看代码图像”链接。点击该链接查看高保真代码图像。要返回之前查看的页面，请点击设备或应用上的“返回”按钮。\n\
