  - 使用 Firefox 浏览网页 Firefox 是 Ubuntu 默认的网络浏览器，为你提供简单、安全且强大的浏览体验。Firefox 由 Mozilla
    开发，已成为全球最成功的开源项目之一；它持续获得巨大的关注。凭借亿次的下载量和不断增长的浏览器份额，Firefox 取得了前所未有的成功。
