  - 网络管理器 Network Manager 是一个接口，帮助你管理网络设备和连接；它通过网络管理器小工具访问。其目标是让网络“即插用”，而不需要用户了解如何手动配置设置（对于想要这样做的人来说，该功能仍然可用）。在小工具上左单击鼠标显示对话框，并允许在网络类型之间快速切换。它还提供了一种虚拟专用网络（VPN）设置访问的简单方法，正如我们许多人需要它来安全地访问工作或学校的文件。你还可以启用或禁用有线和无线网络，查看当前连接的信息，并快速方便地编辑连接（图
    3-7）。
- - '###'
