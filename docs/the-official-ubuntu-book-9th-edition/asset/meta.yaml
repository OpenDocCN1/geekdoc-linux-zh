- - '###'
  - 行为准则（CoC）有时会被误用，但它并不是在攻击中。相反，它提供了实用的参考，让我们可以在 Ubuntu 社区内达成共识。如果社区中的某个成员违反了准则，行为准则生效。在几乎所有情况下足以避免进一步的行动或冲突。少数违反准则的行为，行为准则会提交给委员会。
