    \ tab (refer to Figure 10-14) before I can make any calls.\n\n![](img/b7e91b81e0d84c8a5261ee14a48991b2_183_0.png)\n\
    \n+   3. I click the check box labeled Automatically guess a valid hostname and\
    \ make sure that there is no checkmark.\n+   \n+      I can now enter my SIP URL\
    \ in the Your sip address textbox."
