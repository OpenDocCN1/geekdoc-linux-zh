- pgno: 25
  md: '# Chapter 1


    # # What Is SUSE Linux?


    # *In This Chapter*


    +   - Explaining what Linux is

    +   - Going over what SUSE Linux includes

    +   - Introducing you to what SUSE Linux helps you do

    +   - Getting started with SUSE Linux


    I bet you’ve heard about Linux, even if you may not know much about SUSE (pronounced
    soo-za) Linux. Even if you haven’t, don’t worry: I’ll explain everything about
    Linux, what the different names like SUSE and Red Hat mean, what SUSE Linux includes,
    and how to get started with SUSE Linux.


    By the way, SUSE Linux runs on computers with Intel 80x86 and Pentium processors
    (basically any PC that can run any flavor of Windows). If you have a PC, you can
    install SUSE Linux on it and experience firsthand what the fuss is all about.


    # ## Getting a Handle on Linux


    You know that your PC is a bunch of hardware — things you can touch, like the
    system box, monitor, keyboard, and mouse, as shown in Figure 1-1. The system box
    contains the most important hardware of all — the central processing unit (CPU),
    the microchip that runs the software (any program that tells the computer how
    to do your bidding), which you actually can’t touch. In a typical Pentium 4 PC,
    the Pentium 4 microprocessor is the CPU. Other important hardware in the system
    box includes the memory (RAM chips) and the hard drive — and one program has to
    run all this stuff and get it to play nice: the operating system.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_26_0.png)


    **Figure 1-1:** A simplified view of a computer and how it runs computer programs.


    The *operating system* is software that manages all the hardware and runs other
    software at your command. You, the user, communicate those commands by clicking
    menus and icons or by typing some cryptic text. Linux is an operating system —
    as are UNIX, Windows 98, Windows 2000, and Windows XP. The Linux operating system
    — also called the *Linux kernel* — is modeled after UNIX.


    The operating system is what gives a computer — any computer — its personality.
    For example, you can run Windows 98 or Windows XP on a PC — and on that same PC,
    you can also install and run Linux. That means, depending on which operating system
    is installed and running at any particular time, *the same PC* can be a Windows
    98, Windows XP, or Linux system.


    The primary job of an operating system is to load software (computer programs)
    from the hard drive (or other permanent storage) into the memory and get the CPU
    to run those programs. Everything you do with your computer is possible because
    of the operating system — so if the operating system somehow messes up, the whole
    system freezes up. You know how infuriating it is when your favorite operating
    system — maybe even the one that came with your PC — suddenly calls it quits just
    as you were about to click the Send button after composing that long e-mail to
    your friend. You try the three-finger salute (pressing Ctrl+Alt+Del), but nothing
    happens. Then it’s time to try the Reset button (provided your computer’s builders
    were wise enough to include one). Luckily, that sort of thing almost never happens
    with Linux — it has a reputation for being a very reliable operating system.


    In technical mumbo jumbo, Linux is a *multiuser, multitasking operating system*.
    This means that Linux enables multiple users to log in, and Linux can run more
    than one program at the same time. Nearly all operating systems are


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_26_1.png)'
  merge: -1
  img_proc: true
- pgno: 27
  md: "# Does Linux really run on any computer?\n\nWell, it runs on almost any computer.\
    \ Let’s see. . . . Nowadays, you can get versions of Linux for systems based on\
    \ Intel 80x86, Pentium, and other Intel compatible processors, AMD’s 64-bit AMD64\
    \ processors; the Motorola 68000 family; Alpha AXPs; Sun SPARCs and UltraSPARCs;\
    \ Hewlett-Packard’s HP PA-RISC; the PowerPC and PowerPC64 processors; the MIPS\
    \ R4000 and R5000; even IBM mainframes.\n\nmultiuser and multitasking these days,\
    \ but when Linux first started in 1994, *multiuser* and *multitasking* were big\
    \ selling points.\n\nAll the different names that you hear for Linux — SUSE, Red\
    \ Hat, Debian, Fedora, Knoppix, MEPIS, Ubuntu, Xandros, you name it — are actually\
    \ the names of different Linux distributions.\n\nA *Linux distribution* is basically\
    \ the Linux *kernel* (the operating system) together with a huge collection of\
    \ applications, along with an easy-to-use installation program. By the way, most\
    \ people just say *Linux* to refer to a specific Linux distribution.\n\nMany different\
    \ Linux distributions exist, and each includes the standard Linux operating system\
    \ and the following major packages:\n\n+   - **The X Window System:** The graphical\
    \ user interface.\n+   - **One or more graphical desktops:** Among the most popular\
    \ are GNOME and KDE.\n+   - **A collection of applications:** Linux programs come\
    \ in the form of ready-to-run software, but the *source code* (the commands humans\
    \ use to tell the computer what to do) is included (or easily available), as is\
    \ its documentation.\n+   \n+   Current Linux distributions include a huge selection\
    \ of software — so much that it usually requires multiple CD-ROMs or a single\
    \ DVD-ROM (which this book includes).\n\n![](img/b7e91b81e0d84c8a5261ee14a48991b2_27_0.png)\n\
    \nThe development and maintenance of the Linux kernel, software packages in a\
    \ Linux distribution, and the Linux distributions themselves are organized as\
    \ open source projects. In a nutshell, *open source* means you have access to\
    \ the source code and the right to freely redistribute the software without any\
    \ restrictions. My succinct definition is pretty basic, so to find out more details\
    \ of what *open source* means and to see some acceptable open source licenses,\
    \ please visit the Open Source Initiative Web site at www.opensource.org."
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Discovering SUSE Linux


    SUSE Linux is a commercial distribution that focuses on the desktop and includes
    some proprietary components that prevent its redistribution. You can buy SUSE
    Linux online or in computer stores and bookstores. If you have heard about *open
    source* and the *GNU (GNU''s not UNIX)* issue, you may think that no one can sell
    Linux for a profit. Luckily for companies that sell Linux distributions, the GNU
    (pronounced *gah-nu*) license — also called the GNU General Public License (GPL)
    — does allow commercial, for-profit distribution, but requires that the software
    be distributed in source-code form, and stipulates that anyone may copy and distribute
    the software in source-code form to anyone else. Several Linux distributions are
    available free of charge under the GPL.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_28_0.png)


    In August 2005, Novell sponsored and established the openSUSE project — a worldwide
    community program for promoting the use of Linux everywhere. Specifically, at
    www.opensuse.org developers, end users, and other open source enthusiasts can
    collaborate to evolve a freely available SUSE Linux Open Source Software (OSS).
    Novell’s commercial SUSE Linux retail product is based on SUSE Linux OSS. The
    retail SUSE Linux is similar to SUSE Linux OSS except that the commercial version
    includes some packages that are not open source or cannot be distributed freely.
    This book includes SUSE Linux 10.0 OSS from the openSUSE project.


    I tell you a lot more about SUSE in this book, but you can also visit www.suse.com
    for more information (especially the latest news) about SUSE Linux.


    # Making sense of Linux version numbers


    Both the Linux kernel and a Linux distribution such as SUSE Linux have their own
    version numbers, not to mention the many other software programs (such as GNOME
    and KDE) that come with the Linux distribution. The version numbers for the Linux
    kernel and the Linux distribution are unrelated, but each has particular significance.


    # Linux kernel version numbers


    After Linux kernel version 1.0 was released on March 14, 1994, the loose-knit
    Linux development community adopted a version-numbering scheme. Version numbers
    such as 1.X.Y and 2.X.Y, where X is an even number, are considered the stable
    versions. The last number, Y, is the patch level, which is incremented as problems
    are fixed. For example, 2.6.13 is a typical, stable version of the Linux kernel.
    Notice that these version numbers are in the form of three integers separated
    by periods — *Major.Minor.Patch* — where *Major* and *Minor* are numbers denoting
    the major and minor version numbers, and *Patch* is another number representing
    the patch level.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'Version numbers of the form 2.X.Y with an odd X number are beta releases for
    developers only; they may be unstable, so you should not adopt such versions for
    day-to-day use. For example, when you look at version 2.7.5 of the Linux kernel,
    the 7 in the minor version number tells you it’s a beta release. Developers add
    new features to these odd-numbered versions of Linux.


    You can find out about the latest version of the Linux kernel online at www.kernel.org.


    # *SUSE Linux version numbers*


    Each Linux distribution has a version number as well, and SUSE Linux is no exception.
    These version numbers are usually of the form X.Y, where X is the major version
    and Y the minor version. Unlike with the Linux kernel version numbers, no special
    meaning is associated with odd and even minor versions. Each version of a SUSE
    Linux includes specific versions of the Linux kernel and other major components,
    such as GNOME, KDE, and various applications.


    SUSE usually releases new versions of SUSE Linux on a regular basis — every six
    months or so. For example, SUSE Linux 9.0 was released in October 2003, 9.1 was
    released in April 2004, 9.2 came out in October 2004, and 9.3 in April 2005. The
    current version of SUSE Linux is 10.0. Typically, each new major version of SUSE
    Linux provides significant new features.


    # # What’s in SUSE Linux?


    A Linux distribution comes with the Linux kernel and a whole lot of software.
    These software packages include everything from the graphical desktops to Internet
    servers to programming tools to create new software. In this section, I briefly
    describe some major software packages that come bundled with SUSE Linux. Without
    this bundled software, SUSE Linux wouldn’t be as popular as it is today.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_29_0.png)


    When you install SUSE Linux, not all software packages are installed by default.
    This book’s companion DVD, however, includes most of the packages I describe in
    the following sections.


    # ## GNU software


    At the heart of SUSE Linux is a collection of software that came from the GNU
    Project. You get to know these GNU utilities only if you use your Linux system
    through a text terminal (or a graphical window that mimics one) — a basic command
    line interface that puts nothing much on-screen but a prompt that enables you
    to type in your commands. The GNU software is one of the basic parts of any Linux
    distribution.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# The GNU Project


    GNU is a recursive acronym that stands for *GNU''s not UNIX*. The GNU Project
    was launched in 1984 by Richard Stallman to develop a complete UNIX-like operating
    system. The GNU Project developed nearly everything needed for a complete operating
    system except for the operating system kernel. All GNU software was distributed
    under the GNU General Public License (GPL), essentially requires that the software
    is distributed in source-code form and stipulates that any user may copy, modify,
    and distribute the software to anyone


    else in source-code form. Users may, however, have to pay for their individual
    copies of GNU software.


    The Free Software Foundation (FSF) is a tax-exempt charity that raises funds for
    work on the GNU Project. To find out more about the GNU Project, visit its home
    page at www.gnu.org. You can find information about how to contact the Free Software
    Foundation and how to help the GNU Project.


    As a Linux user, you may not realize the extent to which all Linux distributions
    rely on GNU software. Nearly all the tasks you perform in a Linux system involve
    one or more GNU software packages. For example, the GNOME graphical user interface
    (GUI) and the command interpreter (that is, the bash shell) are both GNU software
    programs. By the way, the *shell* is the command-interpreter application that
    accepts the commands you type and then runs programs in response to those commands.
    If you rebuild the kernel or develop software, you do so with the GNU C and C++
    compiler (which is part of the GNU software that accompanies Linux). If you edit
    text files with the emacs editor, you again use a GNU software package. The list
    goes on and on.


    # GUIs and applications


    Face it — typing cryptic Linux commands on a terminal is boring. For average users,
    using the system through a *graphical user interface* (GUI, pronounced “gooey”)
    — one that gives you pictures to click and windows (with a small *w*) to open
    — is much easier. This is where the X Window System, or X, comes to the rescue.


    X is kind of like Microsoft Windows, but the underlying details of how X works
    are completely different from Windows. Unlike Windows, X provides the basic features
    of displaying windows on-screen, but it does not come with any specific look or
    feel for graphical applications. That look and feel comes from GUIs, such as GNOME
    and KDE, which make use of the X Window System.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_31_0.png)


    SUSE Linux comes with the X Window System in the form of X.Org X11 — an implementation
    of the X Window System for 80x86 systems. X.Org X11 works with a wide variety
    of video cards used in today''s PCs.


    As for the GUI, SUSE Linux includes a choice of two powerful GUI desktops: KDE
    (K Desktop Environment) and GNOME (GNU Network Model Environment). You can choose
    to install either KDE or GNOME on your system. KDE and GNOME provide desktops
    similar to those of Microsoft Windows and Apple Mac OS. With GNOME or KDE, you
    can begin using your SUSE Linux system without having to know cryptic Linux commands.
    However, if you ever need to use those commands directly (or when you become a
    Linux expert and want to use commands), all you have to do is open a terminal
    window and type them at the prompt.


    SUSE Linux also comes with many graphical applications. The most noteworthy program
    is The GIMP (GNU Image Manipulation Program), a program for working with photos
    and other images. The GIMP''s capabilities are on a par with Adobe Photoshop.


    Providing common productivity software — such as word processing, spreadsheet,
    and database applications — is an area in which Linux used to be lacking. This
    situation has changed, however. SUSE Linux comes with the OpenOffice.org office
    productivity applications. In addition, you may want to check out these prominent,
    commercially available office productivity applications for Linux that are not
    included on the companion DVD-ROM:


    +   - **Applixware Office:** This office package is a good example of productivity
    software for Linux. You can find it at `www.vistasource.com`.

    +   - **StarOffice:** From Sun Microsystems (`www.sun.com/staroffice`), StarOffice
    is another well-known productivity software package.

    +   - **CrossOver Office:** From CodeWeavers (`www.codeweavers.com/site/products`),
    you can use CrossOver Office to install your Microsoft Office applications (Office
    97, Office 2000, and Office XP) in Linux.


    As you can see, plenty of Linux office applications are compatible with Microsoft
    Office.


    # ## Networks


    SUSE Linux comes with everything you need to use the system on a network so that
    the system can exchange data with other systems. On networks, computers that exchange
    data use to follow well-defined rules or protocols. A'
  merge: -1
  img_proc: true
- pgno: 32
  md: '_network protocol_ is a method that the sender and receiver agree upon for
    exchanging data across a network. Such a protocol is similar to the rules you
    might follow when you’re having a polite conversation with someone at a party.
    You typically start by saying hello, exchanging names, and then taking turns talking.
    That’s about the same way network protocols work. The two computers use the protocol
    to send bits and bytes back and forth across the network.


    One of the most well-known and popular network protocols is Transmission Control
    Protocol/Internet Protocol (TCP/IP). TCP/IP is the protocol of choice on the Internet
    — the “network of networks” that now spans the globe. Linux supports the TCP/IP
    protocol and any network applications that make use of TCP/IP.


    # Internet servers


    Some popular network applications are specifically designed to deliver information
    from one system to another. When you send electronic mail (e-mail) or visit Web
    sites using a Web browser, you use these network applications (also called Internet
    services). Here are some common Internet services:


    +   - Electronic mail (e-mail) that you use to send messages to any other person
    on the Internet using addresses like joe@example.com.

    +   - World Wide Web (or simply, Web) that you browse using a Web browser.

    +   - News services, where you can read newsgroups and post news items to newsgroups
    with names such as `comp.os.linux.networking` or `comp.os.linux.sux`.

    +   - File-transfer utilities that you can use to upload and download files.

    +   - Remote login that you can use to connect to and work with another computer
    (the remote computer) on the Internet — assuming you have the required username
    and password to access that remote computer.


    A SUSE Linux PC can offer these Internet services. To do so, the PC must be connected
    to the Internet, and it must run special server software called _Internet servers_.
    Each of the servers uses a specific protocol for transferring information. For
    example, here are some common Internet servers that you find in SUSE Linux:


    +   - Sendmail: Mail server for exchanging e-mail messages between systems using
    SMTP (Simple Mail Transfer Protocol).

    +   - Apache Web server: For sending documents from one system to another using
    HTTP (Hypertext Transfer Protocol).'
  merge: -1
  img_proc: true
- pgno: 33
  md: '+   - **vsftpd:** FTP server for transferring files between computers on the
    Internet using FTP (File Transfer Protocol).

    +   - **innd:** News server for distribution of news articles in a store-and-forward
    fashion across the Internet using NNTP (Network News Transfer Protocol).

    +   - **sshd:** For securely logging in to the system using the SSH (Secure Shell)
    protocol.


    # Software development


    SUSE Linux is particularly well-suited to software development. Straight out of
    the box, it’s not configured for software development, but you can easily install
    all the necessary software-development tools such as the compiler and libraries
    of code needed to build programs. If you happen to know UNIX and the C programming
    language, you will feel right at home programming in Linux.


    As far as the development environment in SUSE Linux goes, you can use the same
    basic tools (such as an editor, a compiler, and a debugger) that you might use
    on other UNIX workstations, such as those from IBM, Sun Microsystems, and Hewlett-Packard
    (HP). What this means is that if you work by day on one of these UNIX workstations,
    you can use a Linux PC in the evening at home to duplicate that development environment
    at a fraction of the cost. Then you can either complete work projects at home
    or devote your time to writing software for fun and to share on the Internet.


    # Online documentation


    As you become more adept at using Linux, you may want to look up information quickly
    — without having to turn the pages of (ahem) this great book, for example. Luckily,
    Linux comes with enough online information to jog your memory in those situations
    when you vaguely recall a command’s name, but can’t remember the exact syntax
    of what you’re supposed to type.


    If you use Linux commands, you can view the manual page — commonly referred to
    as the man page — for a command by using the man command. (You do have to remember
    that command in order to access online help.)


    You can also get help from the GUI desktops. Both GNOME and KDE desktops come
    with Help viewers to view online help information. In KDE, choose Main Menu>SUSE
    Help Center and in GNOME choose Help>User’s Manual from the top panel (you learn
    the details in Chapter 3). You can then browse the help information by clicking
    the links on the initial Help window. Figure 1-2 shows a typical Help window —
    this one from the KDE desktop.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_34_0.png)


    # Figuring Out What You Can Do with SUSE Linux


    As an operating system, SUSE Linux acts as the intermediary through which you,
    the “lord of the system,” control all the hardware and software in your PC. The
    hardware includes the system box, the monitor, the keyboard, the mouse, and anything
    else connected to the system box. The catchall term *peripheral* refers to any
    equipment attached to the system. If you use a laptop computer, all your hardware
    is packaged into the laptop.


    Inside that system box is the system’s brain — the microprocessor (Intel Pentium
    4, for example) or the central processing unit (CPU) — that performs the instructions
    contained in a computer program. When the microprocessor is running a computer
    program, that program’s instructions are stored in the memory or RAM. RAM stands
    for *Random Access Memory* (that means any part of the memory can be accessed
    randomly — in arbitrary order).


    The system box has another crucial component — the hard drive (or hard disk, as
    it is sometimes called). The hard drive is the permanent storage space for computer
    programs and data. It’s permanent in the sense that the contents don’t disappear
    when you power off the PC. The hard drive is organized into files, which are in
    turn organized in a hierarchical fashion into directories and subdirectories (somewhat
    like organizing papers in folders inside the drawers of a file cabinet).


    To keep a Linux system running properly, you or someone else has to make sure
    that the hardware is working properly and that the files are backed up regularly.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'There is also the matter of security — making sure that only legitimate people
    can access and use the system. These tasks are called *system administration*.


    If you are using SUSE Linux at a big facility with many computers, a full-time
    system administrator probably takes care of all system administration tasks. On
    the other hand, if you are running SUSE Linux on a home PC, you are the system
    administrator. Don’t let the thought frighten you. You don’t have to know any
    magic incantations or prepare cryptic configuration files to be a system administrator.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_35_0.png)


    SUSE Linux includes a graphical configuration and setup tool called YaST that
    makes system administration a “point-and-click” job, just like running any other
    application. Fortunately, you first encounter YaST when you install SUSE Linux
    following the directions in Chapter 2.


    # Disks, CD-ROMs, and DVD-ROMs


    SUSE Linux typically comes on a single DVD-ROM or several CD-ROMs. After installation,
    the Linux kernel and all the applications are stored on your hard drive — which
    is where your PC looks first when you tell it to do something.


    Typically, the hard drive is prepared to use SUSE Linux during the installation
    process. After that, you usually leave the hard drive alone except to back up
    the data stored there or (occasionally) to install new applications.


    Using CD-ROMs or DVD-ROMs in SUSE Linux is easy. While you are logged in at the
    GNOME or KDE desktop, just pop a CD or DVD in the drive, and the system should
    automatically eject the DVD/CD-ROM. A graphical file manager automatically opens
    and displays the contents of the DVD/CD-ROM. If all else fails, you can type a
    simple mount command in a terminal window and associate the DVD/CD-ROM with a
    directory on your system. This whole process of accessing the files on a CD or
    a DVD from Linux is called *mounting the CD or the DVD*.


    Besides the hard drive and DVD/CD-ROM drive, of course, your PC may have other
    drives, such as a floppy disk or Zip drive, and using those disks in Linux is
    also simple: You insert a disk and double-click the icon that represents the disk
    drive on the GUI desktop. Doing so mounts the disk so that you can begin using
    it.


    # Peripheral devices


    Anything connected to your PC is a peripheral device, and so are some components
    like sound cards that are installed inside the system box. You can configure and
    manage these peripheral devices in SUSE Linux with YaST.'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'One of the common peripherals is a printer, typically hooked up to the parallel
    port of your PC. YaST includes a graphical printer configuration tool that you
    can use to configure the printer.


    Another peripheral device that needs configuration is the sound card. SUSE Linux
    can detect and configure the sound card during installation, just as Windows does.
    However, if SUSE Linux cannot detect the sound card correctly, you can use YaST
    to configure the sound card.


    SUSE Linux configures other peripheral devices such as the mouse and keyboard
    at the time of installation. You can pretty much leave them alone after installation.


    Nowadays, PCs come with the USB (Universal Serial Bus) interface; many devices,
    including printers and scanners, plug into a PC’s USB port. One nice feature of
    USB devices is that you can plug them into the USB port and unplug them at any
    time—the device does not have to be connected when you power up the system. These
    devices are called *hot plugs* because you can plug in a device when the system
    is hot, meaning while it’s running. SUSE Linux supports many hot plug USB devices.
    When you plug a device into the USB port, SUSE Linux loads the correct driver
    and makes the device available to applications.


    SUSE Linux also supports Bluetooth, which is a low-power, short-range wireless
    technology for connecting devices to your PC. Devices that use Bluetooth can usually
    connect when they are within 10 meters of one another. (To find out more about
    Bluetooth, visit www.bluetooth.com.) If your PC includes Bluetooth capability,
    you could use a wireless keyboard and mouse that connect to the PC using Bluetooth.
    SUSE Linux supports such Bluetooth devices.


    # File systems and sharing


    The whole organization of directories and files is called the *file system*. You
    can, of course, manage the file system using Linux. When you browse the files
    from the GNOME or KDE graphical desktop, you work with the familiar folder icons.


    A key task in caring for a file system is to back up important files. In SUSE
    Linux, you can use the tar program to archive one or more directories on a floppy
    or a Zip drive. You can even back up files on a tape (if you have a tape drive).
    If you have a CD/DVD burner, you can also burn a CD or a DVD with the files you
    want to back up or save for posterity.


    SUSE Linux can also share parts of the file system with other systems on a network.
    For example, you can use the Network File System (NFS) to share files with other
    systems on the network. To a user on the system, the remote system’s files appear
    to be in a directory on the local system.


    SUSE Linux also comes with the Samba package, which supports file sharing with
    Microsoft Windows systems. Samba makes a Linux system work just like


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_36_0.png)'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'a Windows file or print server. You can also access shared folders on other
    Windows systems on your network.


    # Networking


    Now that most PCs are either in a local area network or connected to the Internet,
    you need to manage the network as well. You set up the local area network when
    you install SUSE Linux. For connecting to the Internet using a modem, you can
    use YaST.


    If you connect to the Internet using DSL (that’s the fast Internet connection
    from the phone company) or a cable modem, you need a PC with an Ethernet card
    that connects to the cable or DSL modem. It also means that you have to set up
    a local area network and configure the Ethernet card. But fortunately, these steps
    are typically a part of the SUSE Linux installation. If you want to do the configurations
    later, you can — by using a GUI network configuration tool accessible from YaST.


    SUSE Linux also includes tools for configuring a firewall, a protective buffer
    that helps keep your system relatively secure from anyone trying to snoop over
    your Internet connection. You can configure the firewall by running a GUI firewall
    configuration tool accessible from YaST.


    # Getting Started with SUSE Linux


    Based on my personal experience in learning new subjects, I recommend a three-step
    process to get started with SUSE Linux:


    +   1. Install and configure SUSE Linux on your PC.

    +   2. Explore SUSE Linux — the GUI desktop and the applications.

    +   3. Use SUSE Linux for your day-to-day work.


    In the following sections, I explain this prescription a bit more.


    # Install and configure SUSE Linux


    Your PC probably came with some flavor of Microsoft Windows. So the first step
    is to get SUSE Linux onto your PC. This book comes with SUSE Linux — all you have
    to do is follow the instructions in Chapter 2 to install it.


    Just to pique your curiosity, you can keep both Windows and SUSE Linux on the
    PC; the SUSE Linux installer can split up the space on the hard drive into'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'two parts — one part for Windows and the other for installing SUSE Linux. During
    the SUSE Linux installation, you configure many items — from the network card
    (if any) to the X Window System.


    As you’ll find out for yourself, SUSE Linux installation is very easy, especially
    with the graphical YaST installer.


    After you install SUSE Linux, you can configure individual system components (for
    example, the printer) and tweak any needed settings that aren’t configured during
    installation.


    You also can configure your GUI desktop of choice — GNOME or KDE. Each has configuration
    tools. You can use these tools to adjust the look and feel of the desktop (background,
    fonts, screen saver, and even the entire color scheme).


    After you’re through with the configuration step, all the hardware on your system
    and the applications should run to your liking.


    # ## Explore SUSE Linux


    With a properly configured SUSE Linux PC at your disposal, you can start exploring
    SUSE Linux. You can begin the exploration from the GUI desktop that you get after
    logging in.


    Explore the GUI desktops — GNOME and KDE — and the folders and files that make
    up the Linux file system. You can also try out the applications from the desktop.
    SUSE Linux comes with office and multimedia applications and databases that you
    can begin using.


    Also try out the shell — open up a terminal window and type some Linux commands
    in that window. You can also explore the text editors that work in text mode.
    Knowing how to edit text files without the GUI is a good idea. At least you won’t
    be helpless if the GUI is unavailable for some reason.


    # ## Use SUSE Linux


    After you explore the SUSE Linux landscape and know what is what, you can then
    start using SUSE Linux for your day-to-day work — browsing the Web, using Office
    applications such as a word processor and spreadsheet, listen to music, burn a
    music CD, and anything else you want.


    Of course, you can expect to become increasingly proficient in SUSE Linux as time
    goes on. After all, learning is a lifelong journey.


    Bon voyage!'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Chapter 2


    # Installing SUSE Linux


    # *In This Chapter*


    +   - Understanding the installation steps

    +   - Checking your PC’s hardware

    +   - Installing SUSE Linux

    +   - Configuring SUSE Linux


    Most PCs come with Microsoft Windows preinstalled, so you typically never have
    to go through the Windows installation (except when something goes wrong, of course).
    To run SUSE Linux, however, you first have to install it on your PC. All you have
    to do to install SUSE Linux is take out the DVD that comes with this book and
    follow the steps in this chapter.


    You can install SUSE Linux in addition to Microsoft Windows and simply select
    one or the other operating system after you power up the PC. The SUSE Linux installer
    can shrink the disk space used by Windows and create a new *disk partition* —
    basically set aside a part of the hard drive for SUSE Linux.


    Before you get started, just take a deep breath and exhale sloooowly. You have
    nothing to worry about because I explain everything in this chapter.


    # Introducing the Installation Steps


    Before getting started with the installation, I find it helpful to go over the
    entire sequence of installation steps, without the gory details. In this section,
    I show you the road map for the installation process. Then you can follow the
    detailed steps and install SUSE Linux from this book’s companion DVD.'
  merge: -1
  img_proc: true
- pgno: 40
  md: "Here are the general steps for installing SUSE Linux:\n\n+   1. **Check your\
    \ PC’s hardware to make sure everything works with SUSE Linux.**\n\n+   2. **Make\
    \ sure that your PC can boot from the DVD/CD-ROM drive.**\n+   \n+   You may have\
    \ to get into SETUP and change the order of boot devices.\n\n+   3. **Boot your\
    \ PC from the DVD.**\n+   \n+   At the initial boot screen, use the arrow keys\
    \ to select Installation and press Enter. This starts SUSE’s graphical installer\
    \ — YaST — that you use to complete the installation.\n\n+   4. **Select the installation\
    \ language and then select New Installation.**\n+   \n+   YaST then gathers information\
    \ about your PC and displays a set of installation settings.\n\n+   5. **If you\
    \ are going to add SUSE Linux to a PC that already has any version of Microsoft\
    \ Windows on the hard drive, edit the Partitioning setting and select the hard\
    \ drive as the location where you want to install SUSE Linux.**\n+   \n+   Then\
    \ YaST gives you the option to shrink the Windows partition. In particular, YaST\
    \ can resize Windows XP partitions that use the NTFS file system. When you resize\
    \ the Windows partition, everything is safe until you confirm that installation\
    \ should begin.\n\n+   6. **Edit any other installation settings.**\n+   \n+ \
    \  In particular, you probably have to edit the time zone to suit your geographic\
    \ location. You have to edit the software selection if you want a GNOME desktop\
    \ instead of the default KDE desktop.\n\n+   7. **After you have finished editing\
    \ the installation settings, accept the selections and confirm that YaST should\
    \ begin installing.**\n+   \n+   This is the point of no return. YaST formats\
    \ the selected disk partition and begins copying files from the DVD onto the hard\
    \ drive.\n\n+   8. **After installing a minimal SUSE Linux system, YaST reboots\
    \ the PC.**\n+   \n+   After the initial version of SUSE Linux starts again, YaST\
    \ guides you through a number of configuration steps that include setting the\
    \ root (superuser) password; configuring the network and firewall; setting up\
    \ online updates of SUSE Linux; creating a normal user account; and configuring\
    \ hardware such as a graphics card, printer, and sound card.\n\n+   9. **At the\
    \ end of the installation, YaST reboots the PC. When SUSE Linux runs again, you\
    \ should get the GUI desktop.**"
  merge: -1
  img_proc: true
- pgno: 41
  md: '# # Checking Your PC’s Hardware


    If you are concerned that your PC may not be able to run SUSE Linux, here are
    some of the key components in your PC that you need to consider before you start
    the SUSE Linux installation.


    +   - **Processor:** A 400 MHz Pentium II or better is best. The processor speed,
    expressed in MHz (megahertz) or GHz (gigahertz), is not that important as long
    as it’s over 400 MHz, but the faster the better. Linux can run on other Intel-compatible
    processors such as AMD, Cyrix, and VIA processors.

    +   - **RAM:** RAM is the amount of memory your system has. As with processing
    speed, the more RAM, the better. You need 256MB to install both SUSE Linux and
    to comfortably run a GUI desktop.

    +   - **DVD/CD-ROM:** You must have a DVD/CD-ROM drive, and the PC must be able
    to boot from that drive. The exact model doesn’t matter. What matters is how the
    DVD/CD-ROM drive connects to the PC. Most new PCs have DVD/CD-ROM drives that
    connect to the hard drive controller (called IDE for Integrated Drive Electronics
    or ATA for AT Attachment). If you add an external DVD/CD drive, it most likely
    connects to the USB port. Any IDE/ATA or USB DVD/CD-ROM works in SUSE Linux.

    +   - **Hard drives:** Any IDE disk drive works in SUSE Linux. Another type of
    hard drive controller is SCSI (Small Computer System Interface), which SUSE Linux
    also supports. To comfortably install and play with SUSE Linux, you need about
    5GB of hard drive space.

    +   - **Keyboard:** All keyboards work with SUSE Linux and the X Window System.

    +   - **Mouse:** The installation program can detect the mouse. All types of mice
    (such as PS/2 or USB) work with SUSE Linux and the X Window System.

    +   - **Video card:** SUSE Linux works fine with all video cards (also known as
    *display adapters*) in text modes, but if you want the GUI desktop, you need a
    video card that works with the X Window System. The installer can detect a supported
    video card and configure the X Window System correctly. However, if the installer
    cannot detect the video card, it helps if you know the make and model of your
    video card.

    +   - **Monitor:** The kind of monitor is not particularly critical except that
    it must be capable of displaying the screen resolutions that the video card uses.
    The screen resolution is expressed in terms of the number of picture elements
    (pixels), horizontally and vertically (for example, 1024 x 768). The installer
    can detect most modern monitors. If it does not detect your monitor, you can select
    a generic monitor type with a specific'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'resolution such as 1024 x 768. You can also specify the monitor by its make
    and model (which you can find on the back of the monitor).


    +   - **Network interface card (NIC):** Not all PCs have network interface cards,
    but if yours does, the installer can probably detect and use it. If you have problems,
    try to find the make and model (such as *Linksys LNE100TX Fast Ethernet Adapter*)
    so that you can search for information on whether SUSE Linux supports that card
    or not.

    +   - **SCSI controller:** Some high-performance PCs have SCSI controllers that
    connect disk drives and other peripherals to a PC. If your PC happens to have
    a SCSI controller, you might want to find out the make and model of the controller.

    +   - **Sound card:** If your PC has a sound card and you want to have sound in
    SUSE Linux, you have to make sure it’s compatible. You can configure the sound
    card after successfully installing SUSE Linux.

    +   - **Modem:** If you plan to dial out to the Internet, you need a modem that
    Linux supports. For software-based modems, called *soft modems* or *win-modems*,
    you may have to download a driver from the manufacturer (it may or may not be
    freely available).


    In addition to this hardware, you also need to find out the make and model of
    any printer you plan to use in SUSE Linux.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_42_0.png)


    To check whether your PC’s hardware is compatible with SUSE Linux, visit the SUSE
    Linux Hardware Database at hardwaredb.suse.de.


    # Installing SUSE Linux


    The companion DVD includes SUSE Linux 10.0 Open Source Software (OSS) from the
    opensuse project. In this section, I describe the installation process for the
    companion DVD, but the steps are similar if you were to install the commercial
    version of SUSE Linux.


    # Booting your PC from the DVD/CD-ROM drive


    Most new PCs can boot directly from the DVD/CD-ROM drive, but some PCs may require
    intervention from you. Typically, the PC may be set to boot from the hard drive
    before the DVD/CD drive, and you have to get into SETUP to change the order of
    boot devices. To set up a PC to boot from the DVD drive, you have to go into SETUP
    as the PC powers up. The exact steps for entering SETUP and setting the boot device
    vary from one PC to the next, but typically they involve pressing a key such as
    F2. As the PC powers up, a brief message'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'tells you what key to press to enter SETUP. When you''re in SETUP, you can
    designate the DVD/CD drive as the boot device. After your PC is set up to boot
    from the DVD/CD drive, simply put the DVD in the DVD/CD drive and restart your
    PC.


    # Installing SUSE Linux from CDs or DVD


    To install SUSE Linux from CDs or a DVD, simply insert the first CD or the DVD
    into your PC’s CD/DVD drive and restart your PC (in Windows, choose Start»Shutdown
    and then select Restart from the dialog box). If you are using CDs, the installation
    steps are the same as that for the DVD except that you have to swap CDs when prompted
    by the installation program.


    After your PC powers up, a boot loader starts and displays an initial boot screen
    with a menu of items. Table 2-1 lists these boot menu items and their meaning.
    As you can see, you can perform a number of tasks from the boot screen, including
    booting an existing installation from the hard drive and starting a rescue system.


    | Table 2-1 | SUSE Installer Boot Menu Items |

    |---|---|

    | **Select This Item** | **To Do This** |

    | Boot from Hard Disk | Boot the PC from a previously installed operating system
    from the hard drive. |

    | Installation | Automatically detect hardware and then begin installing SUSE
    Linux. |

    | Installation — ACPI Disabled | Disable support for ACPI (Advanced Configuration
    and Power Interface), but otherwise detect hardware and start SUSE installation.
    |

    | Installation — Safe Settings | Disable potentially troublesome features such
    as ACPI, APIC (Advanced Power Management), and DMA (direct memory access) for
    IDE interface and start installing SUSE. Select this option if the installation
    hangs with any of the other options. |

    | Rescue System | Start a small Linux system in memory so that you can troubleshoot
    by logging in as root. |

    | Memory Test | Check to see if the PC’s memory has any problems. |


    Along the bottom of the SUSE installer boot screen, you see some information about
    using the function keys F1 through F5. Table 2-2 explains what each of these functions
    does.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_44_0.png)


    Initially the installer boot screen shows only F1, F2, and F3 as options along
    the bottom of the screen. Press F3 to view all the function key shortcuts from
    F1 through F5. A Boot Options text box also appears after you press F3. After
    you press a function key, a menu pops up; use arrow keys and press Enter to select
    an option. Press Escape to get rid of the menu without selecting anything.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_44_1.png)


    You can also provide other installer options — as well as Linux kernel options
    — at the Boot Options text box below the boot menu. The installer options control
    some aspects of the installer’s behavior, whereas the kernel options are passed
    to the Linux kernel that starts when you start the installation. Typically you
    don’t have to provide any of these options to install SUSE Linux.


    **Table 2-2 — Using Function Keys at the SUSE Installer Boot Screen**


    | Press This Function Key | To Do This |

    |---|---|

    | F1 | Get *context-sensitive* help — help information that depends on the currently
    selected item. Use the up and down-arrow keys to read the Help screen and the
    left- and right-arrow keys to jump between topics. You can dismiss the Help screen
    by pressing Escape. |

    | F2 | Select the language and keyboard mapping to be used by the boot loader.
    |

    | F3 | Select a screen resolution that you want the YaST installer to use for
    its GUI. If the GUI screen fails to appear, you can select Text Mode for a text
    mode interface. |

    | F4 | Select the source from where you want to install. The choices are CD or
    DVD, network sources with different protocols such as FTP, HTTP, NFS, and SLP
    (Service Location Protocol). Typically you can leave this at its default choice
    of CD or DVD. |

    | F5 | Update a driver module for new hardware for which drivers may not be on
    the CD or DVD. You will be prompted to insert the updated driver module on a floppy
    or CD-ROM after you start the installation. |


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_44_2.png)


    The installer initially picks a rather high screen resolution for the GUI screen
    (typically, 1280 x 1024 pixels). To change the resolution, press F3, which brings
    up a menu from which you can select other screen resolutions, such as 1024 x 768
    pixels.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'After setting the screen resolution by pressing F2, select Installation from
    the boot menu and press Enter. This loads the Linux kernel from the DVD or CD.
    The Linux kernel starts running the YaST installation program. For the rest of
    the installation, you work with YaST''s GUI screens.


    # *Starting the SUSE install in YaST*


    YaST — the SUSE installer — displays a GUI screen (see Figure 2-1) from which
    you install SUSE Linux on your PC''s hard drive and configure it.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_45_0.png)


    **Figure 2-1:** The YaST installer''s main GUI screen.


    The left-hand side of the YaST screen shows the list of installation steps, organized
    into three broad categories of tasks — Preparation, Installation, and Configuration.
    An arrow marks the current step. For example, in Figure 2-1, the arrow marks the
    language selection step. After the step is complete, YaST displays a check mark
    next to the step.


    On the right-hand side of the YaST screen (see Figure 2-1), you see the options
    for the current step. You have to select options and then click Next to proceed
    to the next installation step. Click Back to return to the previous step. You
    can abort the installation at any time by pressing the Abort key, up until you
    confirm that you want to really proceed with the installation.'
  merge: -1
  img_proc: true
- pgno: 46
  md: "![](img/b7e91b81e0d84c8a5261ee14a48991b2_46_0.png)\n\nAt any installation step,\
    \ click Help at the lower-left corner of the YaST screen (refer to Figure 2-1)\
    \ to view context-sensitive help information for the current step. The help appears\
    \ on the left-hand side of the YaST screen. Press the button again to return to\
    \ view the list of installation steps.\n\nFollow these steps to complete the initial\
    \ installation steps in the YaST installer:\n\n+   1. **Select the language to\
    \ be used in the installed SUSE Linux system. Then click Next.**\n+   \n+    \
    \  YaST probes the hardware and loads driver modules. YaST may prompt you to confirm\
    \ that it should load some driver modules. Then YaST displays a Media Check screen\
    \ that gives you a chance to check the installation media. Click Start Check to\
    \ perform the check and click Next when done. YaST displays the license agreement.\n\
    \n+   2. **Read the license agreement and click the Yes button if you agree. Then\
    \ click Next to continue.**\n+   \n+      YaST prompts you to indicate if this\
    \ is a new installation or an update.\n\n+   3. **Assuming that you are installing\
    \ SUSE for the first time, select New Installation and click Next.**\n+   \n+\
    \      YaST prompts you for the timezone (see Figure 2-2).\n\n![](img/b7e91b81e0d84c8a5261ee14a48991b2_46_1.png)"
  merge: -1
  img_proc: true
- pgno: 47
  md: '# 4. Select your time zone and click Next.


    You can also click Change to change the current time and date, but these are usually
    correct. After this step, YaST prompts you (see Figure 2-3) to select a GUI desktop
    environment — GNOME or KDE, or some other options such as a minimal graphics environment
    or a text-mode system that does not use GUI desktop. Your selection of the desktop
    environment determines what software packages YaST installs.


    # 5. Select the desktop you want and click Next.


    YaST gathers information about the system and prepares a list of all the installation
    settings, organized by category, and displays it in the Installation Settings
    screen, initially in an Overview tab. Click the Expert tab to see a complete listing
    of the settings (see Figure 2-2). Table 2-3 summarizes the installation settings
    categories as they appear in the Expert tab. Remember to scroll down to see all
    the installation settings in the screen shown in Figure 2-4. Note that YaST also
    displays a disk partitioning setting.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_47_0.png)'
  merge: -1
  img_proc: true
- pgno: 48
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_48_0.png)


    **Figure 2-4:** Click a heading to make changes to that category of settings.


    **Table 2-3. Installation Settings Categories**


    | Category | What These Settings Specify |

    |---|---|

    | System | Information about the PC’s hardware, including the processor type and
    amount of memory. |

    | Keyboard Layout | Language and layout of the keyboard. |

    | Mouse | Type of mouse (for example, PS/2 mouse). |

    | Partitioning | Information about the hard drive partitions that will be formatted
    and any partitions that would be mounted on the Linux file system. If your hard
    drive has only Microsoft Windows installed, YaST offers to shrink the Windows
    partition and create other required partitions to install SUSE Linux. If you already
    have other partitions besides the Windows partition, YaST selects appropriate
    partitions to use for SUSE Linux. You can then click the Partitioning heading
    and from subsequent steps accept the proposal or create a custom partition setup.
    |

    | Software | What software YaST will install. This depends on what GUI desktop
    — KDE or GNOME — you select at an earlier installation step. |'
  merge: -1
  img_proc: true
- pgno: 49
  md: '| Category | What These Settings Specify |

    |---|---|

    | Booting | Information about the boot loader that takes care of starting Linux
    (as well as the other operating systems, such as Windows XP, that may be on the
    hard drive) when you reboot the PC. The default is the GRUB boot loader, installed
    on the hard drive’s master boot record (MBR). |

    | Time Zone | Current time zone and date and time based on the selection you made
    at an earlier installation step. |

    | Language | The language to be used by the installed SUSE Linux system. |

    | Default Runlevel | What processes Linux starts after booting. The default runlevel
    is 5, which gives you a full multiuser system with networks enabled and a graphical
    login screen. |


    +   6. **Scroll down the list of installation settings and click a heading to
    view the settings and make any changes.**


    If you are installing on a PC that had only Windows installed, the Partitioning
    settings would suggest shrinking the Windows partition and creating other partitions
    for SUSE Linux. You can usually accept the suggested partitioning setup as is.
    To create your custom setup, click the Partitioning section heading. YaST then
    displays the suggested partitioning, as shown in Figure 2-5.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_49_0.png)


    **Figure 2-5:** YaST displays the suggested partitioning that you can accept or
    modify.'
  merge: -1
  img_proc: true
- pgno: 50
  md: "To create your own partition setup or modify the proposed partitions, click\
    \ the Create Custom Partition Setup radio button and click Next. YaST displays\
    \ a screen where you can select a hard drive to use for SUSE Linux or select Custom\
    \ Partitioning for complete freedom in specifying the partitions. After you select\
    \ Custom Partitioning and click Next, YaST displays the Expert Partitioner screen\
    \ (see Figure 2-6) where you can edit the existing disk partitions any way you\
    \ want. As the help text emphasizes, this type of partitioning is intended for\
    \ experts who know what they are doing. There is, however, no harm in looking\
    \ at the partitioning information with the Expert Partitioner because nothing\
    \ happens to the hard drive partitions until you confirm that you really want\
    \ YaST to proceed with the SUSE Linux installation.\n\n![](img/b7e91b81e0d84c8a5261ee14a48991b2_50_0.png)\n\
    \n**Figure 2-6:** You can use the Expert Partitioner to customize the hard drive\
    \ partitions.\n\n+   7. **After you have checked all installation settings, click\
    \ Next.**\n+   \n+      YaST displays a warning dialog box that tells you that\
    \ this is the point of no return and you can commit to the installation by clicking\
    \ Install or return to the installation settings by clicking Back.\n\n+   8. **If\
    \ you are certain that you want to continue with the installation, click the Install\
    \ button.**\n+   \n+      YaST then begins the installation, which includes formatting\
    \ and preparing the hard drive partitions and copying SUSE Linux files to the\
