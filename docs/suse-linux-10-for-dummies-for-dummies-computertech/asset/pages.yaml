- pgno: 216
  md: '# Using fields


    Think of fields as bits of information that might change, but you want to call
    them by a name and use them in your document. For example, you might want to insert
    the current date and the page numbers into the header of a document. You can do
    so by inserting fields that refer to the date and page numbers. Some of the predefined
    fields (such as date and page numbers) are easy to use. Simply choose Insert➜Fields
    and then select the field you want to insert.


    In addition to the fields you see in the Insert menu, you can pick from many more
    fields. Choose Insert➜Fields➜Other to open the Fields dialog box (Figure 12-9)
    where you can browse and pick other fields to use in your document. From the Fields
    dialog box, you can also change the format for a field. For example, you can select
    how the date field is shown in the document.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_216_0.png)


    Another type of useful field is a *reference* or a *bookmark*. The idea is to
    mark a location in the document by a name and then refer to that location elsewhere
    by that assigned name. For example, you can insert a cross-reference to the page
    where that location occurs.


    # Working with large documents


    What’s a large document? Well, I consider a large document any document over a
    hundred pages or so. Anything that might have a couple of chapters and need a
    table of contents and an index definitely qualifies as a large document — for
    example, a book. Writer includes features to do the “usual things” you’d want
    to do when working with these larger, more cumbersome documents, such as creating
    tables of content, inserting indexes, and adding entries to indexes.'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'Writer also enables you to tie together several Writer files into a single
    large document — what Writer refers to as a *master document*. Master documents
    are ideal for books, for example. You can keep the chapters in separate files
    and then organize these files into a book by using the master document feature.
    For a large project involving a master document, you have to plan a little and
    take care of the following key steps:


    +   1. **Create a template with the styles you need as well as any fields you
    plan to use.**

    +   2. **Create the individual files and the master document by using the same
    template.**

    +   3. **Insert the files into the master document — that’s how you combine all
    the individual parts into the final product.**

    +   4. **Add a table of contents and index and a bibliography, if needed.**

    +   5. **Work on the component files.**

    +   6. **Update the table of contents and index.**


    For more about styles and templates, see the appropriately named section “Using
    styles and templates,” earlier in this chapter.


    # Preparing Spreadsheets with OpenOffice.org Calc


    Does the name VisiCalc mean anything to you? What about Lotus 1-2-3? I’m sure
    you have heard of Lotus 1-2-3, but maybe not VisiCalc — the first spreadsheet
    program that turned the IBM PC into a business tool. (Believe it or not, you can
    download and run VisiCalc even on today’s PCs. Curious? For more information,
    visit Dan Bricklin’s Web site at www.bricklin.com/history/vcexecutable.htm.)


    Spreadsheet programs continue to be a staple of the office suite, and the OpenOffice.org
    suite is no exception. OpenOffice.org Calc, or just Calc for short, is the spreadsheet
    program in the OpenOffice.org suite.


    All the spreadsheet programs that came after VisiCalc — from Lotus 1-2-3 to Microsoft
    Excel and Calc — still follow that visual model of a spreadsheet laid out in rows
    and columns. Of course, the newer spreadsheets (such as Excel and Calc) have many
    more bells and whistles, including fancy GUIs.


    If you have used any other spreadsheet program, such as Microsoft Excel, you’ll
    be right at home when you start using Calc. Therefore, I don’t try to give you
    detailed instructions on how to use Calc; instead, I provide a quick overview
    and some tips on how to perform some common tasks in Calc.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# Taking stock of OpenOffice.org Calc


    Before describing the types of tasks you can perform in Calc, I want to highlight
    the key features of Calc. Calc can do all the basic spreadsheet functions you
    expect in a spreadsheet program. Here are some things you can do with Calc:


    +   - Open and edit Microsoft Excel files or convert Microsoft Excel files into
    Calc format. Calc uses an XML format and saves files with the .SXC extension.

    +   - Save documents in many different formats including Microsoft Excel 97/2000/XP,
    Excel 95, Excel 5.0, dBASE, StarCalc 5.0 (as well as 4.0 and 3.0), SYLK (an old
    Microsoft format), comma-separated values (CSV), and Web page (HTML).

    +   - Use charting tools to visualize data in 2D or 3D plots.

    +   - Insert graphics files of many different formats, including JPEG, GIF, ZSoft
    Paintbrush (PCX), TIFF, Windows BMP, Macintosh PICT, Encapsulated PostScript (EPS),
    Adobe Photoshop (PSD), AutoCAD DXF, and many more.

    +   - Save versions of a spreadsheet as you continue to change it, allowing you
    to revert to an older version if necessary.

    +   - Use styles and templates to format your spreadsheet.

    +   - Define cells to dynamically change format depending on the value in the
    cell.

    +   - Easily exchange — import and export — data with existing databases by using
    the DataPilot.

    +   - Set up cells to accept values from a set of specific values or ranges of
    valid values.

    +   - Lock cells so data cannot be changed inadvertently.

    +   - Perform scenario analysis by storing multiple values in the same block of
    cells — and define scenarios so you can select a set of values for a specific
    scenario.

    +   - Use the Goal Seek feature to determine the value of a cell that would give
    you a result you want from a formula.


    # Getting started with Calc


    The best way to learn to use Calc is to simply start using it. To start Calc,
    choose Main Menu➪Office➪Spreadsheet in KDE (in GNOME, choose Main Menu➪Office➪Spreadsheet➪OpenOffice.org
    Calc). The Calc window opens with a blank spreadsheet. You can then begin typing
    text and numbers into the cells and use formulas to calculate whatever you want.


    To familiarize yourself with Calc, take a moment to examine the tools and icons
    packed into Calc’s main window (shown in Figure 12-10).'
  merge: -1
  img_proc: true
- pgno: 219
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_219_0.png)


    **Figure 12-10:** You can control Calc through its tool and icon bars.


    Notice the following major parts in the main Calc window (refer to Figure 12-10):


    +   - **Menu bar:** Provides the standard pull-down menus: File, Edit, Help, and
