- pgno: 59
  md: 'Applications menu, and some of these options are in separate menus — the Places
    menu and the Desktop menu.


    +   - **Desktop Icons:** The desktops display the usual desktop icons — a My Computer
    icon for browsing the contents of the computer, a Trash icon, and icons for accessing
    devices such as a floppy drive and a CD/DVD drive or CD writer. The KDE desktop
    also has an icon for browsing the local Windows network, as well as icons for
    support, Print Manager, and the OpenOffice.org office suite.

    +   - **Home Folder:** Opens your home directory in a graphical file manager.

    +   - **Terminal Program:** Runs a program that provides a terminal window where
    you can type Linux commands.

    +   - **SUSE Help Center:** Starts the SUSE Help Center, where you can get help
    on various aspects of SUSE Linux.

    +   - **Web Browser:** Runs the Web browser.

    +   - **Personal Information Manager:** Starts a mail, calendar, and contact manager.
    GNOME desktop provides Evolution as the personal information manager.

    +   - **Desktop Pager or Workspace Switcher:** Click on a square to bring up a
    different desktop.

    +   - **Clipboard Tool:** Click to see what has been cut and what you can paste
    elsewhere.

    +   - **Power Management Tool:** Right-click to view a menu that you can use to
    start the YaST Power Management module that enables you to edit power-saver settings.

    +   - **Volume Control:** Click to change the sound volume.

    +   - **SUSE Hardware Tool:** Click to view information about devices in the PC
    and configure them.

    +   - **SUSE Watcher:** Click to open a window you can use to both check for online
    updates as well as start online updates.

    +   - **Clock:** Displays the current time. Clicking it brings up a calendar showing
    the current date.

    +   - **Hide Panel:** Available in KDE, the end-point of the panel serves as a
    “hide panel” button, which means that if you click this icon, the panel slides
    to the right and disappears. Click again, and the panel reappears. You can hide
    the panel to create more room for other windows.


    In addition to what you see on the KDE and GNOME desktops, you have many more
    choices in the main menu that appears when you click Main Menu on the panel. (See
    Figure 3-3.) Similar to the Windows Start button, the Main Menu is where you start
    when you want to run an application.'
