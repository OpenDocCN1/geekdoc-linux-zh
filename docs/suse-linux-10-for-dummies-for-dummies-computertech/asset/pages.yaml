- pgno: 163
  md: 'When Firefox starts, it displays a browser window with a default home page.
    (The **home page** is a Web page that a Web browser loads when you first start
    it.) You can configure Firefox to use a different Web page as the default home
    page.


    Figure 9-5 shows a Web page from a U.S. government Web site (www.gao.gov), as
    well as the main elements of the Firefox browser window. Note that Firefox supports
    tabbed browsing, which means that you can open a new tab (by pressing Ctrl+T or
    by selecting File>New Tab) and view a Web page in that tab. That way, you can
    view multiple Web pages in a single window.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_163_0.png)


    **Figure 9-5:** The Firefox Web browser in action.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# # Getting familiar with Firefox


    The Firefox Web browser includes lots of features in its user interface, but you
    can master it easily. You can turn off some of the items that make it look busy.
    You can also start with just the basics to get going with Firefox and then gradually
    expand to areas that you haven’t yet explored.


    # ## Firefox toolbars


    Starting from the top of the window, you see a menu bar with the standard menus
    (File, Edit, and so forth), followed by the two toolbars — the Navigation toolbar
    and the Bookmarks toolbar. The area underneath the Bookmarks toolbar is where
    the current Web page appears.


    Here’s what you can do with the buttons on the Navigation toolbar that appear
    just below the menu bar, from left to right:


    +   - **Back:** Move to the previous Web page.

    +   - **Forward:** Move to the page from which you may have gone backward.

    +   - **Reload:** Reload the current Web page.

    +   - **Stop:** Stop loading the current page.

    +   - **Home Page:** Open the home page (you can change the home page from the
    Edit➪Preferences menu).

    +   - **Location text box:** Show the URL of the current Web page. (Type a URL
    in this box to view that Web page.)

    +   - **Go:** Go to the URL typed in the Location text box.

    +   - **Google Search:** Click to display search engines; type text and press
    Enter to search using currently selected search engine (default search engine
    is Google).


    Immediately below the Navigation toolbar is the Bookmarks toolbar with buttons
    that take you to specific Web pages.


    # ## Status bar


    You can think of the bar along the bottom edge of the Firefox window as the status
    bar because the left part of that area displays status information as Firefox
    loads a Web page.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_164_0.png)


    In the right corner of Firefox’s status bar, a security padlock icon appears when
    you access a secure Web site. Firefox supports a secure version of HTTP that uses
    a protocol called **Secure Sockets Layer** (SSL) to transfer encrypted data between
    the browser and the Web server. When Firefox connects to a Web server that supports
    secure HTTP, a locked security padlock icon appears on the right edge of the status
    bar. Otherwise the security padlock is open, signifying an insecure connection.
    The URL for secure HTTP transfers begins with `https://` instead of the usual
    `http://`. (Note the extra s in https.)'
  merge: -1
  img_proc: true
- pgno: 165
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_165_0.png)


    Firefox displays status messages in the left part of the status bar. You can watch
    the messages in this area to see what’s going on. If you mouse over a link on
    the Web page, the status bar displays the URL for that link.


    # Firefox menus


    I haven’t mentioned the Firefox menus much. That’s because you can usually get
    by without having to go to them. Nevertheless, taking a quick look through the
    Firefox menus is worthwhile so you know what each one offers. In particular, you
    can use the Edit>Preferences menu to change settings such as your home page.


    # Changing your home page


    Your *home page* is the Web page that Firefox loads when you start it. By default,
    Firefox displays a blank page. Changing the home page is easy.


    First locate the page on the Web that you want to be the home page. You can get
    to that page any way you want. You can search with a search engine to find the
    page you want, you can type the URL in the Location text box, or you may even
    accidentally end up on a page that you want to make your home page. It doesn’t
    matter.


    When you’re viewing the Web page that you want to make your home page in Firefox,
    choose Edit>Preferences from the Firefox menu. The Preferences dialog box appears,
    as shown in Figure 9-6.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_165_1.png)


    **Figure 9-6:** Click the Use Current Page button to make the current Web page
    your home page.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'On the right side of Figure 9-6, notice the Home Page section of preferences.
    There you see a Location text box for the home page, and underneath the address
    is a Use Current Page button. Click that button to make the current page your
    home page.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_166_0.png)


    You can set a lot of other options using the Preferences window. Although I don’t
    explain all the options, you can click around to explore everything that you can
    do from this window. For example, you can click the Use Bookmark button to select
    a saved URL bookmark as the home page (you have to select the bookmark from a
    dialog box).'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Chapter 10


    # E-Mailing, IM-ing, and Using

    IP Phone in SUSE


    # In This Chapter


    +   - Understanding electronic mail

    +   - Taking stock of mail readers and IM (instant messaging) clients

    +   - Introducing KMail

    +   - Introducing Evolution

    +   - Instant messaging with Kopete and GAIM

    +   - Making IP telephone calls


    Electronic mail (e-mail) is a mainstay of the Internet. E-mail is great because
    you can exchange messages and documents with anyone on the Internet. You can send
    messages anywhere in the world, and that message typically makes its way to its
    destination within minutes, if not seconds — something you cannot do with paper
    mail (also appropriately known as snail mail). I love e-mail because I can communicate
    without having to play “phone tag,” in which two people can leave telephone messages
    for each other without ever successfully making contact.


    SUSE Linux comes with several mail clients — also called mail readers — that can
    download mail from your Internet service provider (ISP). You can also read and
    send e-mail using these mail clients. In this chapter, I introduce you to the
    primary mail clients for the KDE and GNOME desktops. When you know one of these
    mail clients, you can easily use any of the mail readers.


    There is another type of “keeping in touch” that’s more in line with the twenty-first
    century. I’m talking about IM — instant messaging. IM is basically one-to-one
    chat, and SUSE Linux includes IM clients that can work with many instant messaging
    protocols such as AOL Instant Messenger (or AIM), MSN Messenger, ICQ, Jabber,
    Yahoo!, Gadu-Gadu, IRC (Internet Relay Chat), and SMS (Short Message Service or
    text messaging). I briefly describe the primary IM clients for KDE and GNOME desktops
    in this chapter.'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'IP telephony is yet another method of communicating with others. SUSE Linux
    comes with IP telephony applications such as KPhone and Linphone. This chapter
    briefly introduces you to IP telephony and how to use Linphone and KPhone to make
    voice phone calls over the Internet.


    # Understanding E-Mail


    E-mail messages are addressed to a username at a host (_host_ is just a fancy
    name for an online computer). That means if John Doe logs in with the _username_
    `jdoe`, e-mail to him is addressed to `jdoe`. The only other piece of information
    needed to identify the recipient uniquely is the fully qualified _domain name_
    of the recipient’s system. Thus, if John Doe’s system is named `someplace.com`,
    his complete e-mail address becomes `jdoe@someplace.com`. Given that address,
    anyone on the Internet can send e-mail to John Doe.


    # How MUA and MTA work


    The two types of mail software are


    +   - **Mail-user agent (MUA)** is the fancy name for a mail reader — a client
    that you use to read your mail messages, write replies, and compose new messages.
    Typically, the mail-user agent retrieves messages from the mail server by using
    the POP3 or IMAP4 protocol. POP3 is the _Post Office Protocol Version 3_, and
    IMAP4 is the _Internet Message Access Protocol Version 4_. In SUSE Linux, the
    KDE desktop uses KMail as the mail-user agent, and GNOME provides Evolution.

    +   - **Mail-transfer agent (MTA)** is the fancy name for a mail server that actually
    sends and receives mail-message text. The exact method used for mail transport
    depends on the underlying network. In TCP/IP networks, the mail-transport agent
    delivers mail using the _Simple Mail-Transfer Protocol_ (SMTP). You need an MTA
    only if your system is going to be a mail server. Specifically, you do not need
    an MTA if all you want to do is read and send mail via your ISP’s mail server.


    Figure 10-1 shows how the MUAs and MTAs work with one another when Alice sends
    an e-mail message to Bob. (In case you didn’t know, using Alice and Bob to explain
    e-mail and cryptography is customary — just pick up any book on cryptography and
    you’ll see what I mean.) And you may already know this, but the Internet is always
    diagrammed as a cloud — the boundaries of'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'the Internet are so fuzzy that a cloud seems just right to represent it. (Or
    is it because no one knows where it starts and where it ends?)


    The scenario in Figure 10-1 is typical of most people. Alice and Bob both connect
    to the Internet through an ISP and get and send their e-mail through their ISPs.
    When Alice types a message and sends it, her mail-user agent (MUA) sends the message
    to her ISP’s mail-transfer agent (MTA) using the Simple Mail-Transfer Protocol
    (SMTP). The sending MTA then sends that message to the receiving MTA—Bob’s ISP’s
    MTA—using SMTP. When Bob connects to the Internet, his MUA downloads the message
    from his ISP’s MTA using the POP3 (or IMAP4) protocol. That’s the way mail moves
    around the Internet—from sending MUA to sending MTA to receiving MTA to receiving
    MUA.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_169_0.png)'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# # Mail message enhancements


    Mail messages used to be plain text (and most still are), but many messages today
    have much more than text. Two typical new features of today’s mail are


    +   - **HTML messages:** Mail messages can be in *HTML* (Hypertext Markup Language),
    the language used to lay out Web pages. When you read an HTML message on a capable
    mail reader, the message appears in its full glory with nice fonts and embedded
    graphics.

    +   - **Attachments:** Many messages today include attached files, which can be
    anything from documents to images. The recipient can save the attachment on disk
    or open it directly from the mail reader. Unfortunately, attachments are one way
    hackers try to get viruses and worms into your PC. (If it’s any consolation, most
    Windows-based viruses and worms do not work in Linux.)


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_170_0.png)


    While HTML messages are nice, they are a perfect tool for hackers phishing for
    information. As you might know, *phishing* is a new term for hackers trying to
    coax personal information out of people. Often hackers send professional-looking
    HTML messages that might claim to be from your bank, credit card company, or eBay
    and ask you to click what looks like an authentic link to update your personal
    information. If you click the link, you typically end up at a Web site that’s
    a sophisticated fake of a bank or a credit card site that then prompts you for
    information such as name, date of birth, address, bank account number, credit
    card number, and so on. If you are reading HTML mail, be careful of any messages
    that urge you to update personal information. More than likely, it’s from a hacker
    on a phishing trip.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_170_1.png)


    If you have an ISP account, all you need is a *mail client* (mail reader) to access
    your e-mail. In this case, your e-mail resides on your ISP’s server, and the mail
    reader downloads mail when you run it. You have to do some setup before you can
    start reading mail from your ISP’s mail server. The setup essentially requires
    you to enter information that you get from your ISP — the mail server’s name,
    server type (POP3, for example), your username, and your password.


    # # E-Mailing in SUSE Linux


    Each GUI desktop has a default e-mail client. The KDE desktop uses KMail, and
    the GNOME desktop offers Evolution. In the following sections, I briefly introduce
    you to KMail and Evolution. All mail clients are intuitive to use, so you don’t
    need much more than an introduction to start using them effectively.'
  merge: -1
  img_proc: true
- pgno: 171
