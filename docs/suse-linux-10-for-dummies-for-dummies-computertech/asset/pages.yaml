- pgno: 248
  md: 'To view your photo album in Digikam, click My Albums on the left-hand side
    of the Digikam main window, and it displays thumbnail images of the photos on
    the right-hand window (see Figure 15-3).


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_248_0.png)


    **Figure 15-3:** You can view your photo album in Digikam.


    Digikam also includes an image editor. If you double-click a thumbnail in the
    photo album, Digikam opens that photo in the Digikam Image Editor, as shown in
    Figure 15-4. In the Digikam Image Editor, you can perform some limited image-editing
    tasks such as rotating images or converting them to black and white or sepia.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_248_1.png)


    Don’t despair if Digikam doesn’t recognize your digital camera or if you are using
    the GNOME desktop and Digikam is not installed by default. You can still access
    the digital camera’s storage media (compact flash card, for example) as a USB
    mass storage device, provided that your camera supports USB mass storage. To access
    the images on your USB digital camera, use the following steps (by the way, I
    prefer transferring photos this way because I don’t have to run any camera application
    such as Digikam):


    +   1. **Read the camera manual and use the menu options of the camera to set
    the USB mode to Mass Storage.**


    If the camera doesn’t support USB Mass Storage, you cannot use this procedure
    to access the photos. If the camera supports the Picture Transfer Protocol mode,
    you can use Digikam to download the pictures.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_249_0.png)


    **Figure 15-4:** You can touch up photos in the Digikam Image Editor.


    +   2. **Connect your digital camera to the USB port by using the cable that came
    with the camera, and then turn on the camera.**


    This causes SUSE Linux to detect the camera. If you are using KDE, the Konqueror
    file manager opens the contents of the camera in a window. In GNOME, the F-Spot
    application displays a dialog box that asks whether you want to import the photos.
    In either desktop, you end up accessing the folders in your digital camera’s memory
    card. The names of the folders depend on your camera model. For example, in Nikon
    Coolpix cameras, the photos are in folders named `100nikon`, `101nikon`, `102nikon`,
    and so on, but these folders reside in another folder named `dcim`. Open the photo
    folder and you can see the thumbnail of the photos, as shown in Figure 15-5.


    +   3. **Click to select photos you want and copy them to your hard drive by dragging
    and dropping them into a selected folder.**


    +   4. **Close the file manager windows, turn off the camera, and disconnect the
    USB cable from the PC.**


    Who needs a digital camera application when you can access the camera just like
    any other storage device?'
  merge: -1
  img_proc: true
- pgno: 250
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_250_0.png)


    **Figure 15-5:** You can access your camera as a USB mass storage device.


    # Scanning Photos and Documents


    If you have a scanner — a hardware device that enables you to obtain a digital
    image of any photo or document — you can use it with SUSE Linux. Typically, scanners
    plug into a PC''s USB port. Here are the steps to follow to set up your scanner
    in SUSE Linux (I describe the procedures for the KDE desktop, but the steps are
    similar in GNOME):


    +   1. **Plug a scanner into the SUSE Linux PC''s USB port.** SUSE Linux detects
    the scanner and displays the dialog box shown in Figure 15-6. The dialog box prompts
    you if you want to configure the scanner. Click **Yes**.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_250_1.png)


    **Figure 15-6:** SUSE Linux detects the scanner when you connect it to the PC.


    The SUSE configuration program, YaST, starts and prompts you for the root password.
    Type the root password and click OK.


    +   2. **YaST displays another dialog box that informs you that you can install
    a scanning application called Kooka.** Click **Yes** to install the package.


    YaST skips this step if Kooka is already installed on your system.'
  merge: -1
  img_proc: true
- pgno: 251
  md: "+   3. **YaST then asks you for the CD (or DVD, if you have SUSE Linux on a\
    \ DVD) that contains the needed package. Insert the requested CD or DVD and click\
    \ OK.**\n+   \n+      YaST installs the software package that provides the Kooka\
    \ application and then prompts you for the scanner model.\n+   \n+   4. **Select\
    \ the scanner make and model from the list and click Next.**\n+   \n+   5. **YaST\
    \ displays your selection and asks for confirmation. Check that the scanner make\
    \ and model are correct and click Next.**\n+   \n+   6. **YaST displays a dialog\
    \ box telling you that users logged in at the graphical desktop will be granted\
    \ access to the scanner and asks you to disconnect and reconnect the scanner.\
    \ Read the information and click OK.**\n+   \n+   7. **YaST displays a scanner\
    \ test screen. Click Next to continue.**\n+   \n+   8. **YaST provides an overview\
    \ of the scanner. Click Finish to complete installing the scanner.**\n+   \n+\
    \   9. **A dialog box asks if you want YaST to save all settings and exit. Click\
    \ Yes.**\n+   \n+   10. **Disconnect the scanner from the USB port and reconnect\
    \ it again.**\n\n![](img/b7e91b81e0d84c8a5261ee14a48991b2_251_0.png)\n\nIn GNOME,\
    \ the steps for installing a scanner are similar except that you will be prompted\
    \ to install the SANE (Scanner Access Now Easy) library — something that applications\
    \ need to access the scanner. You will, of course, also have to install Kooka\
    \ as well.\n\nAfter you have installed the scanner, follow these steps to scan\
    \ a photo (or any document) using the Kooka scanning application:\n\n+   1. **Choose\
    \ Main Menu➪Graphics➪Scanning from the KDE desktop (in GNOME, open a terminal\
    \ window and type kooka).**\n\nThe scanner application called Kooka starts and\
    \ displays a dialog box (Figure 15-7) showing the installed scanners and asks\
    \ you to select the scanner you want to use.\n\n![](img/b7e91b81e0d84c8a5261ee14a48991b2_251_1.png)"
  merge: -1
  img_proc: true
- pgno: 252
  md: "![](img/b7e91b81e0d84c8a5261ee14a48991b2_252_0.png)\n\n+   2. **Select the\
    \ scanner you want to use and click OK.**\n+   \n+   If this is the only scanner,\
    \ click the check box that says `Do not ask on startup again, always use this\
    \ device.` The Kooka main window appears.\n+   \n+   If you don’t see the Preview\
    \ Scan and Final Scan buttons in the lower-left corner of the Kooka window, quit\
    \ the application (choose File➪Quit). Next open a terminal window, type `su -`\
    \ and enter the root password. Then type `kooka`.\n\n+   3. **Place the photo\
    \ in the scanner.**\n+   \n+   Position it the way you want and close the scanner\
    \ cover.\n\n+   4. **Select the scan mode from the drop-down list in the scanner\
    \ settings section (see Figure 15-8).**\n+   \n+   The scan mode depends on the\
    \ document you are scanning. For color photos, select Color. Other choices include\
    \ Greyscale, Halftone (for black-and-white images made up of dots, as in older\
    \ newspaper photos), and Line Art (for black and white documents with text or\
    \ line drawings).\n\n+   5. **Select the resolution (expressed in terms dots-per-inch\
    \ or dpi) from the scanner settings.** You can type the resolution in the text\
    \ box next to the scale or click the up and down arrows to adjust the resolution.\n\
    \n![](img/b7e91b81e0d84c8a5261ee14a48991b2_252_1.png)\n\n**Figure 15-8:** Preview\
    \ results of scanning in Kooka."
  merge: -1
  img_proc: true
- pgno: 253
  md: 'Typically scanners can scan at resolutions such as 1200 dpi, but you can scan
    at a low resolution such as 72 dpi if you want to use the image on a Web page.
    For printing, the resolution should be higher — typically higher than 200 dpi.


    +   6. **Click the Preview tab (the tab with the magnifying glass icon).**


    +   7. **Click Preview Scan.**


    You can see the results in the Preview Scan tab (see Figure 15-8). Use the selection
    tool to select the part of the image you want to scan during the final scan.


    +   8. **Click Final Scan.**


    Kooka scans the part you selected in the Preview Scan tab and displays a dialog
    box (see Figure 15-9), prompting you for the format in which you want to save
    the scanned image.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_253_0.png)


    **Figure 15-9:** Select the image format in which you want Kooka to save the image.


    +   9. **Select the format (such as JPEG for photos) and click OK.**


    +   10. **Click the Gallery tab (the tab with the folder icon).**


    Kooka displays the final scanned image, as shown in Figure 15-10.


    +   11. **Choose File➜Save Image to save scanned images to folders.**


    Kooka displays a Save As dialog box from which you can select the folder where
    you want Kooka to save the scanned images.


    +   12. **Choose File➜Quit when you’re done using Kooka.**'
  merge: -1
  img_proc: true
- pgno: 254
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_254_0.png)


    **Figure 15-10:** A typical view of a final scanned image in Kooka.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_254_1.png)


    For help on Kooka, choose Help➔Kooka Handbook. This action opens the Kooka Manual
    in a new window.


    Now you can use the scanned images just like other digital photos. You can also
    touch up the images in an image-processing application such as The GIMP, which
    I describe next.


    # Editing Images with The GIMP


    The GIMP is an image-manipulation program written by Peter Mattis and Spencer
    Kimball and released under the GNU General Public License (GPL). SUSE Linux comes
    with this program, although you may have to specifically select a package to install
    it. The GIMP is comparable to other image-manipulation programs such as Adobe
    Photoshop or Corel PHOTO-PAINT.


    To try out the GIMP, choose Main Menu➔Graphics➔Image Editing in KDE or Main Menu➔Graphics➔Image
    Editing➔The GIMP in GNOME.


    When you start it for the first time, The GIMP displays a window with copyright
    and license information. Click the Continue button to proceed with the'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'installation. The next screen shows the directories to be created when you
    proceed with a personal installation of The GIMP.


    The GIMP installation involves creating a directory in your home directory and
    placing a number of files in that directory. This directory essentially holds
    information about any changes to user preferences you may make to The GIMP. Go
    ahead and click the Continue button at the bottom of the window. The GIMP creates
    the necessary directories, copies the necessary files to those directories, and
    guides you through a series of dialog boxes to complete the installation.


    After the installation is done, click the Continue button. From now on, you don’t
    see the installation window anymore; you have to deal with installation only when
    you run The GIMP for the first time.


    The GIMP then loads a set of plugins — external modules that enhance its functionality.
    It displays a startup window that shows a message about each plugin as it loads.
    After finishing the startup, The GIMP displays a tip of the day in a window. You
    can browse the tips and click the Close button to close the Tip window. At the
    same time, The GIMP displays a number of windows, as shown in Figure 15-11.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_255_0.png)'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'These windows include a main toolbox window titled The GIMP, a Tool Options
    window, a Brush Selection window, and a Layers, Channels, Paths window. Of these,
    the main toolbox window is the most important — in fact, you can close the other
    windows and work by using the menus and buttons in the toolbox.


    The toolbox has three menus on the menu bar:


    +   - **The File menu** has options to create a new image, open an existing image,
    save and print an image, mail an image, and quit The GIMP.

    +   - **The Xtns menu** gives you access to numerous extensions to The GIMP. The
    exact content of the Xtns menu depends on which extensions are installed on your
    system.

    +   - **The Help menu** is where you can get help and view tips. For example,
    choose Help➔Help to bring up the GIMP Help Browser with online information about
    The GIMP.


    To open an image file in The GIMP, choose File➔Open. The Open Image dialog box
    comes up, which you can then use to select an image file. You can change directories
    and select the image file that you want to open. The GIMP can read all common
    image-file formats, such as GIF, JPEG, TIFF, PCX, BMP, PNG, and PostScript. After
    you select the file and click OK, The GIMP loads the image into a new window.
    (Refer to Figure 15-11 to see an image after it’s loaded in The GIMP, along with
    all the other The GIMP windows.)


    The toolbox also has many buttons that represent the tools you use to edit the
    image and apply special effects. You can get pop-up help on each tool button by
    hovering the mouse pointer over the button. You can select a tool by clicking
    the tool button, and you can apply that tool’s effects to the image.


    For your convenience, The GIMP displays a pop-up menu when you right-click the
    image window. The pop-up menu has most of the options from the File and Xtns menus
    in the toolbox. You can then select specific actions from these menus.


    You can do much more than just load and view images with The GIMP, but a complete
    discussion of all its features is beyond the scope of this book. If you want to
    try the other features of The GIMP, consult The GIMP User Manual, available online
    at www.gimp.org/docs/.


    # Viewing Images


    If all you want is to view your photos and other image files, you don’t have to
    use something as powerful as The GIMP. Both KDE and GNOME come with image viewing
    applications.'
