    \ bottom of the right pane.**\n+      A dialog box prompts you for the root password.\n\
    +   \n+   5. **Type the root password and click OK.**\n+      Login Manager options\
    \ reappear with everything enabled (because you have entered administrator mode).\n\
    +   \n+   6. **Click the Convenience tab.**\n+      The Convenience tab’s options\
    \ appear, as shown in Figure 20-1. The Enable Auto-Login box is checked, and you\
