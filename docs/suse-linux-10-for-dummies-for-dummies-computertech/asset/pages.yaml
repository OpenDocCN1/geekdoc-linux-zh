- pgno: 119
  md: '# Chapter 7


    # I Want My Internet, Now!


    # In This Chapter


    +   - Understanding the Internet

    +   - Deciding how to connect to the Internet

    +   - Connecting to the Internet with DSL

    +   - Connecting to the Internet with a cable modem

    +   - Setting up a dialup link


    Having Internet access is almost a necessity nowadays. For example, if you want
    to access your e-mail, browse the Web, or get online updates for SUSE Linux from
    an Internet server, you need your PC connected to the Internet.


    If your PC is not already connected to the Internet, it’s a pretty safe bet for
    me to assume that you want to set up the Internet connection as soon as possible.
    In this chapter, I show you how to connect to the Internet in several different
    ways — depending on whether you have a DSL, cable modem, or dialup network connection.


    Two of the options for connecting to the Internet — DSL and cable modem — involve
    connecting a special modem to an Ethernet card on your Linux system. In this chapter,
    I show you how to set up a DSL or a cable modem connection. I also show you another
    option — dialup networking — for connecting to the Internet that involves dialing
    up an Internet service provider (ISP) from your SUSE Linux system.


    You have to turn to Chapter 8 to learn how to connect your PC to an Ethernet local
    area network (LAN) and add wireless capability to your LAN.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# # What Is the Internet?


    How you view the Internet depends on your perspective. Regular folks see the Internet
    in terms of the services they use. For example, as a user, you might think of
    the Internet as an information-exchange medium with features such as


    +   - **E-mail:** Send e-mail to any other user on the Internet, using addresses
    such as `mom@home.net`.

    +   - **Web:** Download documents and images from millions of servers throughout
    the Internet.

    +   - **Newsgroups:** Read newsgroups and post news items to newsgroups with names
    such as `comp.os.linux.networking` or `comp.os.linux.setup`.

    +   - **Information sharing:** Download software, music files, videos, and so
    on. Reciprocally, you may provide files that users on other systems can download.

    +   - **Remote access:** Log on to another computer on the Internet, assuming
    that you have access to that remote computer.


    The techies say that the Internet is a worldwide *network of networks*. The term
    *internet* (without capitalization) is a shortened form of *internetworking* —
    the interconnection of networks. The Internet Protocol (IP) was designed with
    the idea of connecting many separate networks.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_120_0.png)


    In terms of physical connections, the Internet is similar to a network of highways
    and roads. This similarity is what has prompted the popular press to dub the Internet
    “the Information Superhighway.” Just as the network of highways and roads includes
    some interstate highways, many state roads, and many more residential streets,
    the Internet has some very high-capacity networks (for example, a 10 Gbps backbone
    can handle 10 billion bits per second) and a large number of lower-capacity networks
    ranging from 56 Kbps dialup connections to 45 Mbps T3 links. (Kbps is thousand-bits-per-second,
    and Mbps is million bits per second.) The high-capacity network is the backbone
    of the Internet.


    In terms of management, the Internet is not run by a single organization, nor
    is it managed by any central computer. You can view the physical Internet as a
    “network of networks” managed collectively by thousands of cooperating organizations.
    Yes, a collection of networks managed by *thousands* of organizations — sounds
    amazing, but it works!'
  merge: -1
  img_proc: true
- pgno: 121
  md: "# # Deciding How to Connect to the Internet\n\nSo you want to connect to the\
    \ Internet, but you don’t know how? Let me count the ways. Nowadays you have three\
    \ popular options for connecting home offices and small offices to the Internet\
    \ (of course, huge corporations and governments have many other ways to connect):\n\
    \n+   - **Digital Subscriber Line (DSL):** Your local telephone company, as well\
    \ as other telecommunications companies, may offer DSL. DSL provides a way to\
    \ send high-speed digital data over a regular phone line. Typically, DSL offers\
    \ data-transfer rates of between 128 Kbps and 1.5 Mbps. You can download from\
    \ the Internet at much higher rates than when you send data from your PC to the\
    \ Internet (*upload*). One caveat with DSL is that your house must be between\
    \ 12,000 and 15,000 feet from your local central office (the phone-company facility\
    \ where your phone lines end up). The distance limitation varies from provider\
    \ to provider. In the United States, you can check out the distance limits for\
    \ many providers at www.dslreports.com/distance.\n+   \n+   - **Cable modem:**\
    \ If the cable television company in your area offers Internet access over cable,\
    \ you can use that service to hook up your Linux system to the Internet. Typically,\
    \ cable modems offer higher data-transfer rates than DSL — for about the same\
    \ cost. Downloading data from the Internet via cable modem is much faster than\
    \ sending data from your PC to the Internet. You can expect routine download speeds\
    \ of 1.5 Mbps and upload speeds of around 128 Kbps, but sometimes you may get\
    \ even higher speeds than these.\n+   \n+   - **Dialup networking:** A dialup\
    \ connection is what most folks were using before DSL and cable modems came along.\
    \ You hook up your PC to a modem that’s connected to the phone line. Then you\
    \ dial up an ISP to connect to the Internet. That’s why it’s called *dialup networking*\
    \ — establishing a network connection between your Linux PC and another network\
    \ (the Internet) through a dialup modem. In this case, the maximum data-transfer\
    \ rate is 56 Kbps.\n\nDSL and cable modem services connect you to the Internet\
    \ and also act as your Internet service provider (ISP); in addition to improved\
    \ speed, you pay for an IP address and your e-mail accounts. If you use a dialup\
    \ modem to connect to the Internet, first you have to connect to the phone line\
    \ (for which you pay the phone company) and then select and pay a separate ISP\
    \ — which gives you a phone number to dial and all the other necessary goodies\
    \ (such as an IP address and e-mail accounts).\n\nTable 7-1 summarizes all these\
    \ options. You can consult that table and select the type of Internet connection\
    \ that’s available to you and that best suits your needs."
  merge: -1
  img_proc: true
- pgno: 122
  md: '| Feature | Dialup | DSL | Cable |

    |---|---|---|---|

    | Equipment | Modem | DSL modem, Ethernet card | Cable modem, Ethernet card |

    | Also requires | Phone service and an Internet service provider (ISP) | Phone
    service and location within 12,000 to 15,000 feet of central office | Cable TV
    connection |

    | Connection type | Dial to connect | Always on, dedicated | Always on, shared
    |

    | Typical speed | 56 Kbps maximum | 640 Kbps download, 128 Kbps upload (higher
    speeds cost more) | 1.5 Mbps or higher download, 128 Kbps upload |

    | One-time costs (estimate) | None | Install = $100–$200 (none for self install);
    Equipment = $50–$100 (may be leased and may require activation cost) | Install
    = $100–$200 (none for self install); Equipment = $50–$100 (may be leased) |

    | Typical monthly cost (2005) | Phone charges = $20/month; ISP charges = $15–$30/month
    | $40–$50/month; may require monthly modem lease | $40–$50/month; may require
    monthly modem lease |


    *Note: Costs vary by region and provider. Costs shown are typical ones for U.S.
    metropolitan areas.*


    # Connecting to the Internet with DSL


    DSL (Digital Subscriber Line) uses your existing phone line to send digital data
    in addition to the normal analog voice signals (analog means continuously varying,
    whereas digital data is represented by 1s and 0s). The phone line goes from your
    home to a central office where the line connects to the phone company''s network
    — by the way, the connection from your home to the central office is called the
    local loop. When you sign up for DSL service, the phone company hooks up your
    phone line to some special equipment at the central office. That equipment can
    separate the digital data from voice. From then on, your phone line can carry
    digital data that is then directly sent to an Internet connection at the central
    office.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# How DSL works


    A special box called a DSL modem takes care of sending digital data from your
    PC to the phone company’s central office over your phone line. Your PC can connect
    to the Internet with the same phone line that you use for your normal telephone
    calls — you can make voice calls even as the line is being used for DSL. Figure
    7-1 shows a typical DSL connection to the Internet.


    Your PC talks to the DSL modem through an Ethernet connection, which means that
    you need an Ethernet card in your Linux system.


    Your PC sends digital data over the Ethernet connection to the DSL modem. The
    DSL modem sends the digital data at different frequencies than those used by the
    analog voice signals. The voice signals occupy a small portion of all the frequencies
    that the phone line can carry. DSL uses the higher frequencies to transfer digital
    data, so both voice and data can travel on the same phone line.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_123_0.png)


    **Figure 7-1:** DSL provides high-speed connection to the Internet over a regular
    phone line.'
  merge: -1
  img_proc: true
- pgno: 124
  md: "![](img/b7e91b81e0d84c8a5261ee14a48991b2_124_0.png)\n\nThe distance between\
    \ your home and the central office — the *loop length* — is a factor in DSL’s\
    \ performance. Unfortunately, the phone line can reliably carry the DSL signals\
    \ over only a limited distance — typically 3 miles or less, which means that you\
    \ can get DSL service only if your home (or office) is located within about 3\
    \ miles of your phone company’s central office. Your phone company can tell you\
    \ whether your location can get DSL or not. Often, it has a Web site where you\
    \ can type in your phone number and get a response about DSL availability. For\
    \ example, try www.dslavailability.com for U.S. locations.\n\n# Stirring the DSL\
    \ alphabet soup:\nADSL, IDSL, SDSL\n\nI have been using the term *DSL* as if there\
    \ was only one kind of DSL. As you may imagine, nothing is ever that simple. DSL\
    \ has in fact three variants, each with different features. Take a look.\n\n+\
    \   - **ADSL:** Asymmetric DSL, the most common form of DSL, has much higher download\
    \ speeds (from the Internet to your PC) than upload speeds (from your PC to the\
    \ Internet). ADSL can have download speeds of up to 8 Mbps and upload speeds of\
    \ up to 1 Mbps. ADSL works best when your location is within about 2½ miles (12,000\
    \ feet) of your central office. ADSL service is priced according to the download\
    \ and upload speeds you want. A popular form of ADSL, called G.lite, is specifically\
    \ designed to work on the same line you use for voice calls. G.lite has a maximum\
    \ download speed of 1.5 Mbps and a maximum upload speed of 512 Kbps.\n+   \n+\
    \   - **IDSL:** ISDN DSL (ISDN is an older technology called *Integrated Services\
    \ Digital Network*) is a special type of DSL that works at distances of up to\
    \ 5 miles between your phone and the central office. The downside is that IDSL\
    \ only offers downstream (from the Internet to your PC) and upstream (from your\
    \ PC to the Internet) speeds of up to 144 Kbps.\n+   \n+   - **SDSL:** Symmetric\
    \ DSL provides equal download and upload speeds of up to 1.5 Mbps. SDSL is priced\
    \ according to the speed you want, with the higher speeds costing more. The closer\
    \ your location is to the phone company’s central office, the faster the connection\
    \ you can get.\n\n![](img/b7e91b81e0d84c8a5261ee14a48991b2_124_1.png)\n\nDSL speeds\
    \ are typically specified by two numbers separated by a slash, like this: 1500/384.\
    \ The numbers refer to data-transfer speeds in kilobits per second (that is, thousands-of-bits\
    \ per second, abbreviated as Kbps). The first number is the download speed; the\
    \ second the upload. Thus 1500/384 means you can expect to download from the Internet\
    \ at a maximum rate of 1,500 Kbps (or 1.5 Mbps) and upload to the Internet at\
    \ 384 Kbps. If your phone"
  merge: -1
  img_proc: true
- pgno: 125
  md: 'line’s condition is not perfect, you may not get these maximum rates — both
    ADSL and SDSL adjust the speeds to suit existing line conditions.


    The price of DSL service depends on which variant — ADSL, IDSL, or SDSL — you
    select. For most home users, the primary choice is ADSL (or, more accurately,
    the G.lite form of ADSL) with transfer speed ratings of 1500/128.


    # Typical DSL setup


    To get DSL for your home or business, you have to contact a DSL provider. In addition
    to your phone company, you can find many other DSL providers. No matter who provides
    the DSL service, some work has to be done at your central office — the place where
    your phone lines connect to the rest of the phone network. The work involves connecting
    your phone line to equipment that can work with the DSL modem at your home or
    office. The central office equipment and the DSL modem at your location can then
    do whatever magic is needed to send and receive digital data over your phone line.


    Because of the need to set up your line at the central office, it takes some time
    after you place an order to get your line ready for DSL.


    The first step for you is to check out the DSL providers and see if you can actually
    get the service. Because DSL can work only over certain distances — typically
    less than 2½ miles between your location and the central office — you have to
    check to see if you are within that distance limit. Contact your phone company
    to verify. You may be able to check this availability on the Web. Try typing into
    Google (www.google.com) the words **DSL, availability**, and your local phone
    company’s name. The search results will probably include a Web site where you
    can type in your phone number to find out if DSL is available for your home or
    office.


    If DSL is available, you can look for the types of service — ADSL versus SDSL
    — and the pricing. The price depends on the download and upload speeds you want.
    Sometimes, phone companies offer a simple residential DSL (basically the G.lite
    form of ADSL) with a 1500/128 speed rating — meaning you can download at up to
    1,500 Kbps and upload at 128 Kbps. Of course, these are the *maximums*, and your
    mileage may vary.


    After selecting the type of DSL service and provider you want, you can place an
    order and have the provider install the necessary equipment at your home or office.
    Figure 7-2 shows a sample connection diagram for typical residential DSL service.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_126_0.png)


    **Figure 7-2:** You can connect a PC''s Ethernet card directly to the DSL modem.


    Here are some key points to note in Figure 7-2:


    +   - Connect your DSL modem’s data connection to the phone jack on a wall plate.

    +   - Connect the DSL modem’s Ethernet connection to the Ethernet card on your
    PC.

    +   - When you connect other telephones or fax machines on the same phone line,
    install a *microfilter* between the wall plate and each of these devices.


    Because the same phone line carries both voice signals and DSL data, you need
    a microfilter to protect the DSL data from possible interference. You can buy
    one at an electronics store or from the DSL provider.


    When you connect your Linux PC to the Internet using DSL, the connection is always
    on — which means a greater potential for outsiders to break into the PC.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_126_1.png)


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_126_2.png)'
  merge: -1
  img_proc: true
- pgno: 127
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_127_0.png)


    You can protect your Linux system from intruders and, as an added bonus, share
    the high-speed connection with other PCs in a local area network (LAN) by using
    a router that can perform Network Address Translation (NAT). Such a NAT router
    translates multiple private Internet Protocol (IP) addresses from an internal
    LAN into a single public IP address, which allows all the internal PCs to access
    the Internet. The NAT router acts as a gateway between your LAN and the Internet,
    and it isolates your LAN from the Internet — making it harder for intruders to
    reach the systems on your LAN.


    If you also want to set up a local area network, you need an Ethernet hub to connect
    the other PCs to the network. Figure 7-3 shows a typical setup that connects a
    LAN to the Internet through a NAT router and a DSL modem.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_127_1.png)


    Here are the points to note when setting up a connection like the one shown in
    Figure 7-3:


    +   - You need a NAT router with two 10BaseT Ethernet ports (the 10BaseT port
    looks like a large phone jack, also known as an RJ-45 jack). Typically, one Ethernet
    port is labeled Internet (or External or WAN for wide'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'area network), and the other one is labeled **Local** or **LAN** (for *local
    area network*).


    +   - You also need an Ethernet hub. For a small home network, you can buy a 4-
    or 8-port Ethernet hub. Basically, you want a hub with as many ports as the number
    of PCs you intend to connect to your local area network.

    +   - Connect the Ethernet port of the DSL modem to the Internet port of the NAT
    router using a 10BaseT Ethernet cable. (The look like phone wires with bigger
    RJ-45 jacks and are often labeled Category 5 or Cat 5 wire.)

    +   - Connect the Local Ethernet port of the NAT router to one of the ports on
    the Ethernet hub, using a 10BaseT Ethernet cable.

    +   - Now connect each of the PCs to the Ethernet hub. (Of course, to do so, you
    must first have an Ethernet card installed and configured in each PC.)


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_128_0.png)


    You can also buy a NAT router with a built-in 4- or 8-port Ethernet hub. With
    such a combined router/hub, you need only one box to set up a LAN and connect
    it to the Internet via a DSL modem. These boxes are typically sold under the name
    Cable/DSL router because they work with both DSL and a cable modem.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_128_1.png)


    DSL providers typically use a protocol known as PPP over Ethernet (PPPoE) to establish
    a connection between your PC and the equipment at the provider’s central office.
    PPPoE requires you to provide a username and password to establish the network
    connection over Ethernet. To set up your system for a PPPoE DSL connection, all
    you have to do is run YaST. (Choose Main Menu→System→YaST, click Network Devices
    on the left-hand window, and click DSL from the different network devices shown
    on the right-hand window.) YaST automatically detects the DSL modem and guides
    you through the configuration process.


    # Connecting to the Internet

    with a Cable Modem


    Cable TV companies also offer high-speed Internet access over the same coaxial
    cable that carries television signals to your home. After the cable company installs
    the necessary equipment at its facility to send and receive digital data over
    the coaxial cables, customers can sign up for cable Internet service. You can
    then get high-speed Internet access over the same cable that delivers cable TV
    signals to your home.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# # How cable modems work


    A box called a *cable modem* is at the heart of Internet access over the cable
    TV network. (See Figure 7-4.) The cable modem takes digital data from your PC’s
    Ethernet card and puts it in an unused block of frequency. (Think of it as another
    TV channel, but instead of pictures and sound, which the channel carries digital
    data.)


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_129_0.png)'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'The cable modem places *upstream data* — data that’s being sent from your PC
    to the Internet — in a different channel than the *downstream data* that’s coming
    from the Internet to your PC. By design, the speed of downstream data transfers
    is much higher than that of upstream transfers. The assumption is that people
    download far more stuff from the Internet than they upload. (Probably true for
    most of us.)


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_130_0.png)


    The coaxial cable that carries all those hundreds of cable TV channels to your
    home is a very capable signal carrier. In particular, the coaxial cable can carry
    signals covering a huge range of frequencies — hundreds of megahertz (MHz). Each
    TV channel requires 6 MHz — and the coaxial cable can carry hundreds of such channels.
    The cable modem places the upstream data in a small frequency band and expects
    to receive the downstream data in a whole other frequency band.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_130_1.png)


    At the other end of your cable connection to the Internet is the *Cable Modem
    Termination System* (CMTS) — also known as the *head end* — that your cable company
    installs at its central facility. (Refer to Figure 7-4.) The CMTS connects the
    cable TV network to the Internet. It also extracts the upstream digital data sent
    by your cable modem (and by those of your neighbors as well) and sends all of
    it to the Internet. The CMTS also puts digital data into the upstream channels
    so that your cable modem can extract that data and provide it to your PC via the
    Ethernet cable.


    Cable modems can receive downstream data at the rate of about 30 Mbps and send
    data upstream at around 3 Mbps. However, all the cable modems in a neighborhood
    share the same downstream capacity. Each cable modem filters out — separates —
    the data it needs from the stream of data that the CMTS sends out. Cable modems
    follow a modem standard called DOCSIS, which stands for Data Over Cable Service
    Interface Specification. You can buy any DOCSIS-compliant modem and use it with
    your cable Internet service; all you have to do is call the cable company and
    give them the modem’s identifying information so that the CMTS can recognize and
    initialize the modem.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_130_2.png)


    In practice, with a cable modem you can get downstream transfer rates of around
    1.5 Mbps and upstream rates of 128 Kbps. These are maximum rates, and your transfer
    rate is typically lower, depending on how many users in your neighborhood are
    using cable modems at the same time.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_130_3.png)


    If you want to check your downstream transfer speed, go to `bandwidthplace.com/speedtest`
    and click the link to start the test. For my cable modem connection (for example),
    the tests reported a downstream transfer rate of about 1.4 Mbps.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Typical cable modem setup


    To set up cable modem access, your cable TV provider must offer high-speed Internet
    access. If the service is available, you can call to sign up. The cable companies
    often have promotional offers such as no installation fee or a reduced rate for
    three months. Look for these offers. If you are lucky, a local cable company may
    have a promotion going on just when you want to sign up.


    The installation is typically done by a technician, who splits your incoming cable
    into two — one side goes to the TV and the other to the cable modem. The technician
    provides information about the cable modem to the cable company’s head end for
    setup at its end. When all that is done, you can plug in your PC’s Ethernet card
    to the cable modem and you’re all set to enjoy high-speed Internet access. Figure
    7-5 shows a typical cable-modem hookup.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_131_0.png)


    **Figure 7-5:** The cable TV signal is split between the TV and the cable modem.'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'The cable modem connects to an Ethernet card in your PC. If you don’t have
    an Ethernet card in your PC, the cable company technician often provides one.


    Here are some key points to note about the cable modem setup in Figure 7-5:


    +   - Split the incoming cable TV signal into two parts by using a two-way splitter.
    (The cable company technician installs the splitter.) By the way, the two-way
    splitter needs to be rated for 1 GHz; otherwise, it may not let the frequencies
    that contain the downstream data from the Internet pass through.

    +   - Connect one of the video outputs from the splitter to your cable modem’s
    F-type video connector using a coaxial cable.

    +   - Connect the cable modem’s 10BaseT Ethernet connection to the Ethernet card
    on your PC.

    +   - Connect your TV to the other video output from the two-way splitter.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_132_0.png)


    When you use a cable modem to directly connect your SUSE Linux PC to the Internet,
    the connection is always on, so you run a greater risk that someone may try to
    break into the PC than do dialup users. SUSE Linux includes a firewall, which
    you may want to use to protect your PC from unwanted Internet connections. See
    Chapter 19 for more information on how to enable the firewall.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_132_1.png)


    To isolate your SUSE Linux PC or local area network from the public Internet,
    you may want to add a NAT (Network Address Translation) router between your PC
    and the cable modem. One of the NAT router’s network interfaces connects to the
    Internet and the other connects to your LAN — the router then acts as a gateway
    between your LAN and the Internet. As an added bonus, you can even share a cable
    modem connection with all the PCs in your own local area network (LAN) by adding
    an Ethernet hub. Better yet, buy a combination NAT-router-and-hub so you have
    only one box do the whole job. By the way, the NAT router/hubs are typically sold
    under the name Cable/DSL router because they work with both DSL and a cable modem.


    The NAT router translates private Internet Protocol (IP) addresses into a public
    IP address. When connected through a NAT router, any PC in the internal LAN can
    access the Internet as if it had its own unique IP address. Result: You can share
    a single Internet connection among many PCs. (An ideal solution for an entire
    family of Net surfers!)


    Figure 7-6 shows a typical setup with a cable modem connection being shared by
    a number of PCs in a LAN.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_133_0.png)


    **Figure 7-6:** A NAT router isolates your PC from the Internet and also lets
    you share a cable modem connection with other PCs in a local area network.


    Here are the points to note when setting up a connection like the one shown in
    Figure 7-6:


    +   - You need a Cable/DSL NAT router with two 10BaseT Ethernet ports (the 10BaseT
    port — also known as an RJ-45 jack — looks like a large phone jack). Typically,
    one Ethernet port is labeled *Internet* (or *External* or *WAN for wide area network*),
    and the other one is labeled *Local*.

    +   - If you plan to set up a LAN, you also need an Ethernet hub. For a small
    home network, you can buy a 4- or 8-port Ethernet hub. Basically, you want a hub
    with as many ports as the number of PCs you intend to connect to your local area
    network.

    +   - Consider buying a single box that acts as both a NAT router and a hub with
    a number of Ethernet ports.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '+   - Connect the video cable to the video input port of the cable modem.

    +   - Connect the Ethernet port of the cable modem to the Internet port of the
    NAT router using a 10BaseT Ethernet cable. (These look like phone wires, except
    that the Ethernet cables are bigger RJ-45 jacks and are often labeled Category
    5 or Cat 5 wire.)

    +   - Connect the Local Ethernet port of the NAT router to one of the ports on
    the Ethernet hub using a 10BaseT Ethernet cable.

    +   - Now connect each of the PCs to the Ethernet hub. Of course, each PC must
    have an Ethernet card.


    In the next section, I explain how to configure the PCs in such a LAN so that
    they can all access the Internet through the router.


    # Dialing Up the Internet


    If you don’t have DSL or a cable modem, you can always reach the Internet the
    old-fashioned way — you can just dial up your ISP using your PC’s modem (you need
    a modem and a phone line for this to work). Connecting your PC to the Internet
    through a dialup modem is called dialup networking. In the following sections,
    I show you how to set up a dialup network connection to your ISP.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_134_0.png)


    To use a modem to dial up and connect to the Internet, you have to first get an
    account with an ISP. Every ISP provides you a phone number to dial, a username,
    and a password. Additionally, the ISP gives you the full names of servers for
    e-mail and news. Typically, your system automatically gets an IP address by using
    a protocol known as DHCP.


    # Connecting the modem


    Modem is a contraction of modulator/demodulator — a device that converts digital
    signals (string of 1s and 0s) into continuously varying analog signals that transmit
    over telephone lines and radio waves. Thus, the modem is the intermediary between
    the digital world of the PC and the analog world of telephones. Figure 7-7 illustrates
    the concept of a modem.


    Inside the PC, 1s and 0s are represented with voltage levels, but signals carried
    over telephone lines are usually tones of different frequencies. The modem sits
    between the PC and the telephone lines and makes data communication possible over
    the phone lines. The modem converts information back and forth between the voltage/no
    voltage representation of digital circuits and different frequency tones that
    are appropriate for transmission over phone lines.'
  merge: -1
  img_proc: true
