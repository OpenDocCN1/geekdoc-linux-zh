  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_206_0.png)


    **Figure 12-1:** You can start typing your document in Writer’s main window.


    Using Writer is simple because it’s so similar to other word processors that you’ve
    probably used, such as Microsoft Word. For example, you can type text into the
    blank document, format it, and save it when you’re done. If you want to work on
