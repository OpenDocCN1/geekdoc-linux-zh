- pgno: 203
  md: '# Chapter 12


    # Preparing Documents

    and Spreadsheets

    in SUSE Linux


    # In This Chapter


    +   - Preparing documents in OpenOffice.org Writer

    +   - Working with spreadsheets in OpenOffice.org Calc


    Preparing documents and spreadsheets are the staples of the modern office. SUSE
    Linux comes with the OpenOffice.org (often shortened as OOo or OOo) suite of office
    applications that includes very capable word processing and spreadsheet software
    to help you with these tasks. Both KDE and GNOME desktops use OpenOffice.org as
    the primary office application suite.


    In this chapter, I describe two OpenOffice.org applications — Writer for preparing
    documents and Calc for working with spreadsheets — in considerable detail. Writer
    is similar to Microsoft Word, and Calc is like Microsoft Excel.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_203_0.png)


    Besides Writer and Calc, OpenOffice.org also includes Impress, a presentation
    software package that’s similar to Microsoft PowerPoint. I describe Impress in
    Chapter 13.


    # Writing with OpenOffice.org Writer


    Face it: The whole world, or so it seems, uses Microsoft Office, especially Microsoft
    Word, to write stuff. You have to work with the world to get your job done. Until
    recently, the lack of a freely available and good Microsoft Office-compatible
    office suite may have been holding you back from using SUSE Linux as your primary
    desktop operating system. Well, your troubles are over. SUSE Linux comes with
    the OpenOffice.org office suite — a set of office productivity applications comparable
    to Microsoft Office and compatible with'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'Microsoft Office as well. OpenOffice.org is installed on your system when you
    installed SUSE Linux.


    OpenOffice.org Writer, or *Writer* for short, is at the heart of the OpenOffice.org
    office suite. Writer is a word processor that makes it easy for you to prepare
    many different types of documents on your SUSE Linux system and, best of all,
    share files with others who use Microsoft Word.


    Typically you might work with Microsoft Word files that your coworkers and friends
    (and maybe even family) send you. All you have to do is save the file in a folder
    and open it in Writer. I provide an overview of how to open a document, work on
    it, and save it to a folder. Along the way, I summarize how to perform common
    word processing tasks with Writer.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_204_0.png)


    Before your expectations go sky-high, let me caution you that if you share files
    between Microsoft Word and Writer, you may run into some conversion problems;
    some Word features may not convert fully into equivalent Writer features. However,
    if you share only simple documents with Microsoft Word users (or if you simply
    want to prepare your own nicely formatted documents), Writer should work well
    for you.


    By the way, if you’re already a proficient Microsoft Word user, you should be
    able to start using Writer without much trouble because much of Writer works very
    much like Word.


    # Taking stock of OpenOffice.org Writer


    Before you begin using Writer, I want to give you a quick overview of its major
    features. When you know what you can do with Writer, you can read the subsequent
    sections to find out how to perform specific tasks in Writer, such as formatting
    tables, printing documents, and tracking changes.


    You can do the following with Writer:


    +   - Open and edit Microsoft Word files or convert Microsoft Word files to Writer
    format. One advantage of converting to Writer format is that Writer files are
    much smaller in size than corresponding Microsoft Word files.

    +   - Save documents in many different formats including Microsoft Word 97/2000/XP,
    Word 95, Word 6.0, Rich Text Format (RTF), StarWriter 5.0 (as well as 4.0 and
    3.0), plain text, Adobe PDF, and Web page (HTML).

    +   - Insert graphics files of many different formats, including JPEG, GIF, ZSoft
    Paintbrush (PCX), TIFF, Windows BMP, Macintosh PICT, Encapsulated PostScript (EPS),
    Adobe Photoshop (PSD), AutoCAD DXF, and many more.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '+   - Create tables that can include calculations and add charts that update
    when the table contents change.

    +   - Perform complex page layouts with desktop publishing features such as text
    frames and floating frames.

    +   - Easily create and organize multiple files that make up a large project such
    as a book or a large report.

    +   - Create a *mail merge* where you write a single document with generic fields
    and have Writer automatically create many different customized documents by filling
    in the specific fields (such as name, address, and phone number) from a database.

    +   - Save versions of a document as you continue to change it, and revert to
    an older version if necessary.

    +   - Compare changes and work collaboratively using the Versions system. Not
    only can you see what has changed and who changed it, but you can also accept
    or reject those changes individually (or in groups) according to certain criteria.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_205_0.png)


    A note of caution here: The versioning information doesn’t export perfectly to
    some other formats, in particular, Microsoft Word.


    +   - E-mail your documents directly from Writer.

    +   - If you like, Writer can automatically complete the word you’re typing by
    making a best guess, and you can accept the choice by pressing Enter. (If this
    feature drives you crazy, you can simply turn it off, just as you can configure
    many other features in Writer.)


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_205_1.png)


    Writer enables you to print a Writer document directly to an Adobe Portable Document
    Format (PDF) file. To electronically share a document in its final form, you can
    print the document to a PDF file and distribute that file. Anyone can easily view
    and print PDF files by using the free Adobe Reader (available at www.adobe.com/products/acrobat/readstep2.html).


    # Getting started with Writer


    The best way to learn to use Writer is to simply start using it. To start Writer,
    click the Writer icon on the panel (the icon showing some pieces of paper with
    a pen) or choose Main Menu➜Office➜Word Processor in KDE or GNOME (if you have
    more than one word processing application installed, you have to select OpenOffice.org
    Writer from a submenu).


    Writer displays its main window (Figure 12-1) with an empty document.'
