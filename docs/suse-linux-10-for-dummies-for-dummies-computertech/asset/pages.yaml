- pgno: 159
  md: 'In a typical scenario, the user sits in front of a computer that''s connected
    to the Internet and runs a Web browser. When the user clicks a link or types a
    URL into the Web browser, the browser connects to the Web server and requests
    a document from the server. The Web server sends the document (usually in HTML
    format) and ends the connection. The Web browser interprets and displays the HTML
    document with text, graphics, and multimedia (if applicable). Figure 9-2 illustrates
    this typical scenario of a user browsing the Web.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_159_0.png)


    **Figure 9-2.** The Web browser requests documents, and the Web server sends them.


    The Web browser''s connection to the Web server ends after the server sends the
    document. When the user browses through the downloaded document and clicks another
    hypertext link, the Web browser again connects to the Web server named in the
    hypertext link, downloads the document, ends the connection, and displays the
    new document. That''s how the user can move from one document to another with
    ease.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_159_1.png)


    A Web browser can do more than simply “talk” HTTP with the Web server — in fact,
    Web browsers can also download documents using FTP, and many have integrated mail
    and newsreaders as well.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# # Web Browsing in SUSE Linux


    Web browsing is fun because so many of today’s Web pages are so full of graphics
    and multimedia. Then there’s the element of surprise — you can click a link and
    end up at an unexpected Web page. Links are the most curious (and useful) aspect
    of the Web. You can start at a page that shows today’s weather and a click later,
    you can be reading this week’s issue of Time magazine.


    To browse the Web, all you need is a Web browser and an Internet connection. I
    assume that you’ve already taken care of the Internet connection (see Chapter
    7 if you haven’t yet set up your Internet connection), so all you need to know
    are the Web browsers in SUSE Linux.


    SUSE Linux comes with the Firefox Web browser. Firefox is Mozilla’s next-generation
    browser that blocks popup ads, provides tabs for easily viewing multiple Web pages
    in a single window, and includes a set of privacy tools. On KDE desktops you can
    also use the Konqueror file manager as a Web browser. Both Firefox and Konqueror
    are intuitive to use. I introduce them in the next few sections.


    # ## Web Browsing with Konqueror


    Konqueror is not only a file manager, but also a Web browser. Konqueror starts
    with a Web browser view if you start Konqueror by clicking the Web browser icon
    on the KDE panel (mouse over and read the help balloon to find it). On the other
    hand, if you start Konqueror by clicking the home folder icon (the second icon
    from left on the KDE panel), you can switch to a Web browser view by choosing
    Settings»Load View Profile»Web Browsing from Konqueror’s menu. Yet another way
    to start the Konqueror Web browser is to select Main Menu»Internet»Web Browser»Web
    Browser (Konqueror) from the KDE desktop.


    To browse the Web using Konqueror, click the Web browser button on the KDE panel.
    Konqueror starts with the initial Web browser view that shows Konqueror’s About
    page — a Web page with information about Konqueror itself, as shown in Figure
    9-3.


    To visit a specific Web page, simply enter the URL (the “link”) in the Location
    bar (refer to Figure 9-3). You can type the URL without the http:// prefix. For
    example, if the URL is http://www.irs.gov, you can simply type www.irs.gov in
    the Location bar and then press Enter. Konqueror opens the new Web page in a new
    tab.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_161_0.png)


    **Figure 9-3:** Konqueror starts with its initial Web browser view.


    To open another tab to load a new Web page, choose Location➜New Tab from the Konqueror
    menu. You can then type a new URL in the Location box, and that Web page appears
    in the new tab. Figure 9-4 shows Konqueror’s Web browser view with a few Web pages
    loaded in different tabs (notice the tabs just below the Location field). This
    style of browsing is called tabbed Web browsing and, as you can see, Konqueror
    can do tabs. By the way, you can switch between Web pages by clicking the tabs.


    Figure 9-4 shows the key parts of the Konqueror Web browser’s window. Here is
    a quick rundown of some of the features:


    +   - **Search:** You can perform a Google search by typing search words in the
    text field on the right end of the Location bar.

    +   - **Font size:** Click the magnifying glass icon to increase or decrease the
    font size.

    +   - **Tabs:** Click the button on the left end of the tabs to open a new tab,
    and the one on the rightmost edge to close the current tab.

    +   - **Clone window:** Click the K button on the top right to clone the current
    Konqueror window, including all the tabs.

    +   - **Location:** Type the URL in the Location bar and press Enter or click
    the Go button (on the right end of the Location bar) to load that URL. To clear
    the Location bar, click the button with an X at the left end of the Location bar.


    Play around with Konqueror and you will realize that it’s more powerful than it
    first appears.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_162_0.png)


    Figure 9-4: Konqueror supports tabbed Web browsing.


    # Web Browsing with Firefox


    You can start Firefox by choosing Main Menu→Internet→Web Browser→ Web Browser
    (Firefox) from the GUI desktop.'
