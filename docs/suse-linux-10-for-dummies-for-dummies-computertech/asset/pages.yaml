    # Using Skype


    Skype is another popular IP telephony application that uses proprietary peer-to-peer
    (P2P) protocol and has a large number of users. You can download Skype for SUSE
    Linux from `www.skype.com/products/skype/linux/`. What you download is an RPM
    file that you can install by typing **rpm -ivh skype-*.suse.i586.rpm** in a terminal
    window (after typing **su -** to become root). After that, you can start Skype
    by selecting Main Menu▸Internet▸More Programs▸Skype from the GUI desktop.


    When you start Skype, Skype displays a dialog box that prompts you to log in.
    If you don’t have a Skype account yet, click the New Users tab (see Figure 10-17),
    fill in the required information, and click Next.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_185_1.png)


    **Figure 10-17:** You can register with the Skype service from this dialog box
    that appears when you run Skype.'
