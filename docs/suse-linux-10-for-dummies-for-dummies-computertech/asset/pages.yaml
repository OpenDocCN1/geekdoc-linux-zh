    \ numbers by dialing the number this way: *1(8xx) xxx xxxx. For example, to dial\
    \ 1-800-123-4567, enter *1(800) 123 4567 in KPhone or Linphone.\n\nAs a concrete\
    \ example, here is how I configure and use Linphone to make IP telephone calls\
