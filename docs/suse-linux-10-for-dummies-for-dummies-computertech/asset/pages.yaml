- pgno: 279
  md: "# # Starting and Stopping Services\n\nKnowing the sequence in which Linux starts\
    \ processes as it boots is important. You can use this knowledge to start and\
    \ stop services, such as the Web server and Network File System (NFS). The next\
    \ few sections provide you with an overview of how Linux boots and starts the\
    \ initial set of processes. These sections also familiarize you with the shell\
    \ scripts that start various services on a Linux system.\n\n# ## Understanding\
    \ how Linux boots\n\nWhen Linux boots, it loads and runs the core operating system\
    \ program from the hard drive. The core operating system is designed to run other\
    \ programs. A process named *init* starts the initial set of processes on your\
    \ Linux system.\n\nTo see the processes currently running on the system, type\n\
    \n```\n```bash\nps ax | more\n```\n```\n\nYou get an output listing that starts\
    \ off like this:\n\n```\n```\nPID TTY       STAT    TIME COMMAND\n  1   ?    \
    \     S      0:01 init [5]\n```\n```\n\nThe first column, with the heading PID,\
    \ shows a number for each process. PID stands for *process ID* (identifier) —\
    \ a sequential number assigned by the Linux kernel. The first entry in the process\
    \ list, with a *process ID* (PID) of 1, is the init process. It’s the first process,\
    \ and it starts all other processes in your Linux system. That’s why init is sometimes\
    \ referred to as the “mother of all processes.”\n\nWhat the init process starts\
    \ depends on the following:\n\n+   - The *run level*, an identifier that identifies\
    \ a system configuration in which only a selected group of processes are started.\n\
    +   - The contents of the `/etc/inittab` file, a text file that specifies which\
    \ processes to start at different run levels.\n+   - A number of shell scripts\
    \ — sequence of Linux commands — that are executed at specific run levels.\n\n\
    SUSE Linux uses seven run levels — 0 through 6. Table 17-2 shows the meanings\
    \ of the different run levels in SUSE Linux."
  merge: -1
  img_proc: true
- pgno: 280
  md: '| Run Level | Meaning |

    |---|---|

    | 0 | Shuts down the system |

    | 1 | Runs in single-user stand-alone mode (no one else can log in; you work at
    the text console) |

    | 2 | Runs in multiuser mode without network |

    | 3 | Runs in full multiuser mode with network and text-mode login |

    | 4 | Unused |

    | 5 | Runs in full multiuser mode with graphical login (default run level) |

    | 6 | Reboots the system |


    The current run level, together with the contents of the `/etc/inittab` file,
    control which processes `init` starts in Linux. In SUSE, run level 3 is used for
    text-mode login screens and 5 for the graphical login screen. You can change the
    default run level by editing a line in the `/etc/inittab` file.


    To check the current run level, type the following command in a terminal window:


    ```

    ```sh

    /sbin/runlevel

    ```

    ```


    This runlevel command prints an output like this:


    ```

    ```text

    N 5

    ```

    ```


    The first character of the output shows the previous run level (N means no previous
    run level), and the second character shows the current run level (5). In this
    case, the system started at run level 5.


    # Trying a new run level with

    the init command


    To try a new run level, you don’t have to change the default run level in the
    `/etc/inittab` file. Type `su -` at a terminal window to become root, and then
    you can change the run level (and, consequently, the processes that run in Linux)
    by typing `init` followed by the run level.


    For example, to put the system in single-user mode, type the following:


    ```

    ```sh

    init 1

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'If you have never seen the single-user mode, be prepared for a surprise. It
    looks very similar to a system reboot, and there is no GUI. All you get is a text
    prompt where you can type Linux commands.


    If you want to try run level 3 without changing the default run level in the `/etc/inittab`
    file, enter the following command at the shell prompt:


    ```

    ```bash

    init 3

    ```

    ```


    The system ends all current processes and enters run level 3. By default, the
    `init` command waits 20 seconds before stopping all current processes and starting
    the new processes for run level 3.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_281_0.png)


    To switch to run level 3 immediately, type the command **init -t 3**. The number
    after the `-t` option indicates the number of seconds `init` waits before changing
    the run level.


    You can also use the `telinit` command, which is simply a symbolic link (a shortcut)
    to `init`. If you make changes to the `/etc/inittab` file and want `init` to reload
    its configuration file, use the command `telinit q`.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_281_1.png)


    To use the GUI desktop and any tools such as YaST, which you use for system administration
    tasks, your SUSE Linux system must be at run level 5. If you switch to a single-user
    mode or run level 3, you can switch to run level 5 by typing **init 5**.


    # Using YaST to start and stop services


    To start and stop services using YaST, choose YaST Control Center➪System➪System
    Services (Runlevel). YaST displays the System Services (Runlevel) window, as shown
    in Figure 17-3.


    The System Services window shows the list of services along with a brief description
    of the service and whether the service is enabled or not. You can select a service
    and either enable or disable it by clicking the Enable or Disable button.


    If a service is enabled, clicking Disable causes YaST to stop it immediately and
    also change the settings so that the service is not restarted when you reboot
    the system. Conversely, for a currently disabled service, clicking Enable causes
    YaST to start it as well as ensure that the service starts when the system reboots.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_282_0.png)


    # Manually starting and stopping services


    If YaST is not available to start and stop services, you can manually type commands
    in a terminal window to start and stop any service (you have to first type `su
    -` to become root). The only catch is that you have to know the name of the script
    that starts and stops a service. Typically, these scripts have the same name as
    the service and these script files are located in the `/etc/init.d` directory.
    For example, the script `/etc/init.d/xinetd` starts and stops the xinetd service.
    To restart this service manually, you would type **/etc/init.d/xinetd restart**
    in a terminal window.


    You can enhance your system administration skills by familiarizing yourself with
    the scripts in the `/etc/init.d` directory. To see its listing, type the following
    command:


    ```

    ```bash

    ls /etc/init.d

    ```

    ```


    The script names give you some clue about which server the script can start and
    stop. For example, the bluetooth script starts and stops the processes required
    for Bluetooth networking services.'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# Checking Your System’s Performance


    When you’re the system administrator, you must keep an eye on how well your SUSE
    Linux system is performing. You can monitor the overall performance of your system
    by looking at information such as


    +   - Central Processing Unit (CPU) usage

    +   - Physical memory usage

    +   - Virtual memory (swap-space) usage

    +   - Hard drive usage


    SUSE Linux comes with a number of utilities that you can use to monitor one or
    more of these performance parameters. Here I introduce a few of these utilities
    and show you how to understand the information presented by these utilities.


    # Using the top utility


    To view the top CPU processes — the ones that are using most of the CPU time —
    you can use the text mode top utility. To start that utility, type **top** in
    a terminal window (or text console). The top utility then displays a text screen
    listing the current processes, arranged in the order of CPU usage, along with
    various other information, such as memory and swap-space usage. Figure 17-4 shows
    a typical output from the top utility.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_283_0.png)


    **Figure 17-4:** You can see the top CPU processes by using the top utility.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_284_0.png)


    The top utility updates the display every five seconds. If you keep top running
    in a window, you can continually monitor the status of your SUSE Linux system.
    To quit top, press Q or Ctrl+C or close the terminal window.


    The first five lines of the output screen (refer to Figure 17-4) provide summary
    information about the system. Here is what these five lines show:


    +   - The first line shows the current time, how long the system has been up,
    how many users are logged in, and three load averages — the average number of
    processes ready to run during the last 1, 5, and 15 minutes.

    +   - The second line lists the total number of processes and the status of these
    processes.

    +   - The third line shows CPU usage — what percentage of CPU time is used by
    user processes, what percentage by system (kernel) processes, and during what
    percentage of time the CPU is idle.

    +   - The fourth line shows how the physical memory is being used — the total
    amount, how much is used, how much is free, and how much is allocated to buffers
    (for reading from the hard drive, for example).

    +   - The fifth line shows how the virtual memory (or swap space) is being used
    — the total amount of swap space, how much is used, how much is free, and how
    much is being cached.


    The table that appears below the summary information (refer to Figure 17-4) lists
    information about the current processes, arranged in decreasing order by amount
    of CPU time used. Table 17-3 summarizes the meanings of the column headings in
    the table that top displays.


    **Table 17-3 — Meanings of Column Headings in top Utility’s Output**


    | Heading | Meaning |

    |---|---|

    | PID | The process ID of the process |

    | USER | Username under which the process is running |

    | PR | Priority of the process |

    | NI | *Nice* value of the process — the value ranges from -20 (highest priority)
    to 19 (lowest priority) and the default is 0 (the *nice* value represents the
    relative priority of the process, the higher the value the lower the priority
    and the nicer the process — because it yields to other processes) |

    | VIRT | The total amount of virtual memory used by the process, in kilobytes
    |

    | RES | Total physical memory used by a task (typically shown in kilobytes, but
    an m suffix indicates megabytes) |'
  merge: -1
  img_proc: true
- pgno: 285
  md: "| Heading | Meaning |\n|---|---|\n| SHR | Amount of shared memory used by the\
    \ process |\n| S | State of the process (R for sleeping, D for uninterruptible\
    \ sleep, R for running, Z for zombies—processes that should be dead, but are still\
    \ running—or T for stopped) |\n| %CPU | Percentage of CPU time used since last\
    \ screen update |\n| %MEM | Percentage of physical memory used by the process\
    \ |\n| TIME+ | Total CPU time the process has used since it started |\n| COMMAND\
    \ | Shortened form of the command that started the process |\n\n# Using the uptime\
    \ command\n\nYou can use the `uptime` command to get a summary of the system’s\
    \ state. Just type the command like this:\n\n```\nuptime\n```\n\nIt displays output\
    \ similar to the following:\n\n```\n4:19pm  up 32 days, 2:52, 3 users, load average:\
    \ 0.13,\n           0.23, 0.27\n```\n\nThis output shows the current time, how\
    \ long the system has been up, the number of users, and (finally) the three load\
    \ averages — the average number of processes that were ready to run in the past\
    \ 1, 5, and 15 minutes. Load averages greater than 1 imply that many processes\
    \ are competing for CPU time simultaneously.\n\nThe load averages give you an\
    \ indication of how busy the system is.\n\n# Checking disk performance and disk\
    \ usage\n\nLinux comes with the `/sbin/hdparm` program that you can use to control\
    \ IDE or ATAPI hard drives that are common on most PCs. One feature of the `hdparm`\
    \ program is that you can use the `-t` option to determine the rate at which data\
    \ is read from the disk into a buffer in memory. For example, here’s the result\
    \ of typing `/sbin/hdparm -t /dev/hda` on my system:\n\n```\n/dev/hda:\n Timing\
    \ buffered disk reads: 178 MB in 3.03 seconds = 58.81 MB/sec\n```"
  merge: -1
  img_proc: true
- pgno: 286
  md: 'The command requires the IDE drive’s device name (/dev/hda) as an argument.
    If you have an IDE hard drive, you can try this command to see how fast data is
    read from your system’s disk drive.


    To display the space available in the currently mounted file systems, use the
    df command. If you want a more human-readable output from df, type the following
    command:


    ```

    ```bash

    df -h

    ```

    ```


    Here’s a typical output from this command:


    ```

    ```

    Filesystem          Size  Used Avail Use% Mounted on

    /dev/hda11          6.1G  2.7G  3.5G  44%  /

    tmpfs               122M  3.6K  122M   1%  /dev/shm

    /dev/hda7            43M  9.6M   32M  24%  /boot

    ```

    ```


    As this example shows, the -h option causes the df command to show the sizes in
    gigabytes (G) and megabytes (M).


    To check the disk space being used by a specific directory, use the du command
    — you can specify the -h option to view the output in kilobytes (K) and megabytes
    (M), as shown in the following example:


    ```

    ```bash

    du -h /var/log

    ```

    ```


    Here’s a typical output of that command:


    ```

    ```

    24K      /var/log/cups

    0        /var/log/news

    3.3M     /var/log/YaST2

    0        /var/log/samba

    0        /var/log/smpppd

    8.3M     /var/log

    ```

    ```


    The du command displays the disk space used by each directory, and the last line
    shows the total disk space used by that directory. If you want to see only the
    total space used by a directory, use the -s option, like this:


    ```

    ```bash

    du -sh /home

    751M     /home

    ```

    ```


    # Managing Hardware Devices


    Use the YaST Control Center’s Hardware category to access GUI tools that enable
    you to control various devices. Figure 17-5 shows the different types of devices
    you can manage from YaST Control Center➪Hardware.'
