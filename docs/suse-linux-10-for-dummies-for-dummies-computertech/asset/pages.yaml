    # # Practicing Good Host Security


    *Host* is the techie term for your Linux system — especially when you use it to
    provide services on a network. But the term makes sense even when you think of
    the computer by itself; it’s the host for everything that runs on it — the operating
    system and all the applications. A key aspect of computer security is to secure
    the host.


    In this section, I take you through a few key steps to follow in securing your
    SUSE Linux host. These steps include installing operating system updates (following
    steps that I outline in Chapter 18), protecting passwords, and protecting the
    files and directories.


    # ## Making passwords expire


    Obviously, leaving passwords lying around where anyone can get at them — even
    if they’re encrypted — is bad security. So instead of storing passwords in the
    `/etc/passwd` file (which anyone can user can read), Linux now stores them in
    a shadow password file, `/etc/shadow`. Only the superuser (root) can read this
    file.


    The `/etc/shadow` file also includes fields that control when each password expires.
    You can use the `chage` command to change the password-expiration information.
    For starters, you can check a user’s password-expiration information by using
    the `chage` command with the `-l` option, as follows (in this case, you have to
    be logged in as root):


    ```

    chage -l root

    ```


    This command displays expiration information, including how long the password
    lasts and how often you can change the password.'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'If you want to ensure that the user is forced to change a password every 90
    days, you can use the **-M** option to set the maximum number of days that a password
    stays valid. For example, to make sure that user `naba` is prompted to change
    the password in 90 days, I log in as root and type the following command:


    ```

    chage -M 90 naba

    ```


    You can use the command for each user account to ensure that all passwords expire
    when appropriate, and that all users must pick new passwords.


    # Protecting files and directories


    One important aspect of securing the host is to protect important system files
    — and the directories that contain these files. You can protect the files through
    the file ownership and through the permission settings that control who can read,
    write, or (in case of executable programs) execute the files.


    The default Linux file security is controlled through the following settings for
    each file or directory:


    +   - User ownership

    +   - Group ownership

    +   - Read, write, execute permissions for the owner

    +   - Read, write, execute permissions for the group

    +   - Read, write, execute permissions for others (everyone else)


    # Viewing ownerships and permissions


    You can see these settings for a file when you look at the detailed listing with
    the `ls -l` command. For example, type the following command to see the detailed
    listing of the `/etc/inittab` file:


    ```

    ls -l /etc/inittab

    ```


    The resulting listing looks something like this:


    ```

    -rw-r--r--  1 root root 2926 Nov 12 20:11 /etc/inittab

    ```


    In Chapter 6, I explain how to interpret the first ten characters on that line.
    For now, you should know that the set of nine characters, starting with the second
    one, describes the file permissions for user, group, and others. The third and
    fourth fields show the user and group that own this file. In this case, both user
    and group names are the same: root.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# Changing file ownerships


    You can set the user and group ownerships with the chown command. For example,
    if the file /dev/hda should be owned by the user root and the group disk, type
    the following command as root to set up this ownership:


    ```

    chown root.disk /dev/hda

    ```


    To change the group ownership alone, use the chgrp command. For example, here''s
    how you can change the group ownership of the file ledger.out from whatever it
    was earlier to the group named accounting:


    ```

    chgrp accounting ledger.out

    ```


    # Changing file permissions


    You may need to change a file''s permission settings to protect it from others.
    Use the chmod command to change the permission settings of a file or a directory.


    To use chmod effectively, you have to specify the permission settings. A good
    way is to concatenate one or more letters from each column of Table 19-2, in the
    order shown (Who/Action/Permission).


    | Table 19-2 | File Permission Codes |

    |---|---|

    | *Who* | *Action* | *Permission* |

    | u user | + add | r read |

    | g group | - remove | w write |

    | o others | = assign | x execute |

    | a all | s set user ID | |


    For example, to give everyone read access to all files in a directory, pick a
    (for all) from the first column, + (for add) from the second column, and r (for
    read) from the third column to come up with the permission settings a+r. Then
    use the whole set of options with chmod, like this:


    ```

    chmod a+r *

    ```


    On the other hand, to permit everyone to read and execute one specific file, type


    ```

    chmod a+rx filename

    ```'
  merge: -1
  img_proc: true
- pgno: 316
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_316_0.png)


    Suppose you have a file named mystuff that you want to protect. You can make it
    accessible to no one but you if you type the following commands, in this order:


    ```

    chmod a-rwx mystuff

    chmod u+rwx mystuff

    ```


    The first command turns off all permissions for everyone, and the second command
    turns on the read and write permissions for the owner (you). Type **ls -l** to
    verify that the change took place. (You see a permission setting of `-rw-------`.)


    Another way to specify a permission setting is to use a three-digit sequence of
    numbers. In a detailed listing, the read, write, and execute permission settings
    for the user, group, and others appear as the sequence


    ```

    rwxrwxrwx

    ```


    with dashes in place of letters for disallowed operations. Think of rwx rwx rwx
    as three occurrences of the string rwx. Now assign the values r=4, w=2, and x=1
    (use zero for a missing letter — one that appears as a dash). To get the value
    of the sequence rwx, simply add the values of r, w, and x. Thus, rwx = 7 (4+2+1).
    Using this formula, you can assign a three-digit value to any permission setting.
    For example, if the user can read and write the file but everyone else can only
    read the file, the permission setting is rw-r--r-- (that’s how it appears in the
    listing), and the value is 644 because rw- is 4+2, which is 6 and r-- is just
    4 (for r alone). Thus, if you want all files in a directory to be readable by
    everyone but writable only by the user, use the following command:


    ```

    chmod 644 *

    ```


    # Setting default permission


    What permission setting does a file get when you (or a program) create a new file?
    The answer is in what is known as the user file-creation mask that you can see
    and set using the umask command.


    Type **umask**, and it prints out a number showing the current file-creation mask.
    The default setting is different for the root user and other normal users. For
    the root user, the mask is set to 022, whereas the mask for normal users is 002.
    To see the effect of this file-creation mask and to interpret the meaning of the
    mask, follow these steps:


    +   1. **Log in as root and type the following command:**


    ```

    touch junkfile

    ```


    This command creates a file named junkfile with nothing in it.'
  merge: -1
  img_proc: true
