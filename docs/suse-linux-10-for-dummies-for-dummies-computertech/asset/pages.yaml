- pgno: 84
  md: 'The panel is a parking place for icons. Some icons open up menus from which
    you can select applications to run and some icons start applications when you
    click them. Some show the status (such as what programs are currently running)
    as well as other useful information such as the date and time.


    Starting at the left, the first icon (regardless of what it shows) in the KDE
    panel and GNOME top panel is the Main Menu button — it’s like the Start button
    in Microsoft Windows. Then come a few icons that start various programs. In GNOME,
    you have more menu buttons — System Menu for system tasks such as configuring
    the system or logging out and Help Menu for accessing online help. The date and
    time icon appears at the far-right edge of the panel.


    By the way, if you move the mouse pointer on top of an icon, a small Help balloon
    pops up and gives you a helpful hint about the icon.


    Now for a little bit of technical detail about these icons on the panel. The panel
    itself is a separate application; each icon is a button or a program called an
    *applet*. The applets are little applications (also called plugins). These panel
    applets can do things such as launch other programs or display the date and time.
    To add an applet to the panel, right-click an empty area of the panel and select
    the appropriate menu item to add an applet to the panel. After adding the applet,
    you can right-click the applet’s icon to configure it or perform some task that
    the applet supports.


    If you right-click any icon — or right-click anywhere on the panel — you get a
    context menu where you can do something relevant to that icon (such as move it
    or remove it entirely). You can also set some preferences and add more buttons
    and applets to the panel.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_84_0.png)


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_84_1.png)


    # The Main Menu or Applications Menu


    The leftmost icon on the KDE panel and the GNOME desktop’s top panel is the *Main
    Menu* button. On the GNOME top panel, the button is labeled Applications.


    The Main Menu is where you typically find all the applications, organized into
    submenus. I provide an overview of the Main Menu and point out some interesting
    items. You can then further explore the menus yourself.


    Click the Main Menu button to bring up the first-level menu. Then mouse over any
    menu item with an arrow to bring up the next level’s menu and so on. You can go
    through a menu hierarchy and make selections from the final menu. Figures 5-9
    and 5-10, respectively, show the Main Menu hierarchies in typical KDE and GNOME
    desktops.'
