- pgno: 334
  md: "From this point on, the installation steps are the same as the ones for a CD/DVD\
    \ install, which I explain in Chapter 2. You should jump to the point where the\
    \ YaST installer displays its initial GUI screen.\n\n# How Can I Auto-Login into\
    \ the KDE Desktop as Another User?\n\nIf yours is the only user account on your\
