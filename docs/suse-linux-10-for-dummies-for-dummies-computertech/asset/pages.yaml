  md: '| **Table 11-1** | **Major Newsgroup Categories** |

    |---|---|

    | *Category* | *Subject* |

    | `alt` | “Alternative” newsgroups (not subject to any rules), which run the gamut
    from the mundane to the bizarre |

    | `bionet` | Biology newsgroups |

    | `bit` | Bitnet newsgroups |

    | `biz` | Business newsgroups |

    | `clari` | Clarinet news service (daily news) |

    | `comp` | Computer hardware and software newsgroups (includes operating systems
    such as Linux and Microsoft Windows) |

    | `ieee` | Newsgroups for the Institute of Electrical and Electronics Engineers
    (IEEE) |

    | `k12` | Newsgroups devoted to elementary and secondary education |

    | `linux` | Newsgroups devoted to Linux |

    | `misc` | Miscellaneous newsgroups |

    | `news` | Newsgroups about Internet news administration |

    | `rec` | Recreational and art newsgroups |

    | `sci` | Science and engineering newsgroups |

    | `soc` | Newsgroups for discussing social issues and various cultures |

    | `talk` | Discussions of current issues (think “talk radio”) |


    This short list of categories is deceptive because it doesn’t really tell you
    about the wide-ranging variety of newsgroups available in each category. The top-level
    categories alone number close to a thousand, but many top-level categories are
    distributed only in specific regions of the world. Because each newsgroup category
    contains several levels of subcategories, the overall count of newsgroups runs
    over 50,000! The comp category alone has more than 1,200 newsgroups.


    Unfortunately, many newsgroups are flooded with spam, just like your e-mail Inbox,
    only worse because anyone can post anything on a newsgroup. Some'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'newsgroups, called *moderated newsgroups*, offer some relief. Anyone who wants
    to post on a moderated newsgroup must first submit the article to a moderator—a
    human being—who can then decide whether to post the article or reject it. You
    can reduce the spam overload by browsing moderated newsgroups whenever possible.


    # Some Linux-related newsgroups


    Typically, you have to narrow your choice of newsgroups according to your interests.
    If you’re interested in Linux, for example, you can pick one or more of these
    newsgroups:


    +   - `comp.os.linux.admin`: Information about Linux system administration.

    +   - `comp.os.linux.advocacy`: Discussions about promoting Linux.

    +   - `comp.os.linux.announce`: Important announcements about Linux. This newsgroup
    is moderated, which means you must mail the article to a moderator, who then posts
    it to the newsgroup if the article is appropriate for the newsgroup. (This method
    keeps the riff-raff from clogging up the newsgroup with marketing pitches.)

    +   - `comp.os.linux.answers`: Questions and answers about Linux. All the Linux
    HOWTOs are posted in this moderated newsgroup.

    +   - `comp.os.linux.development`: Current Linux development work.

    +   - `comp.os.linux.development.apps`: Linux application development.

    +   - `comp.os.linux.development.system`: Linux operating system development.

    +   - `comp.os.linux.hardware`: Discussions about Linux and various types of hardware.

    +   - `comp.os.linux.help`: Help with various aspects of Linux.

    +   - `comp.os.linux.misc`: Miscellaneous Linux-related topics.

    +   - `comp.os.linux.networking`: Networking under Linux.

    +   - `comp.os.linux.setup`: Linux setup and installation.

    +   - `comp.os.linux.X`: Discussions about setting up and running the X Window
    System under Linux.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_191_0.png)


    You have to be selective about what newsgroups you read because keeping up with
    all the news is impossible, even in a specific area such as Linux. When you first
    install and set up Linux, you might read newsgroups such as `comp.os.linux.help`,
    `comp.os.linux.x`, `comp.os.linux.hardware`, and `comp.os.linux.x` (especially
    if you run X). After you have Linux up and running, you may want to find out about
    only new things happening in Linux. For such information, read the `comp.os.linux.announce`
    newsgroup.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# # Reading Newsgroups from Your ISP


    If you sign up with an ISP for Internet access, it can provide you with access
    to a news server. Such Internet news servers communicate by using the Network
    News Transfer Protocol (NNTP). You can use an NNTP-capable newsreader, such as
    KNode or Pan, to access the news server and read selected newsgroups. Using a
    newsreader is the easiest way to access news from your ISP’s news server.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_192_0.png)


    My discussion of reading newsgroups assumes that you obtained access to a news
    server from your ISP. The ISP provides you the name of the news server and any
    username and password needed to set up your news account on the newsreader you
    use.


    To read news, you need a *newsreader* — a program that enables you to select a
    newsgroup and view the items in that newsgroup. You also have to understand the
    newsgroup hierarchy and naming conventions (which I describe in the “Newsgroup
    hierarchy” section, earlier in this chapter). Now I show you how to read news
    from a news server.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_192_1.png)


    If you don’t have access to newsgroups through your ISP, you can try using one
    of the many public news servers out there. For a list of public news servers,
    visit NewzBot at `www.newzbot.com`. At this Web site, you can search for news
    servers that carry specific newsgroups.


    # ## Taking stock of newsreaders in SUSE Linux


    Depending on the desktop — KDE or GNOME — that you run, you get a different default
    newsreader. Here are the two newsreaders you’d be using in SUSE Linux:


    +   - **KNode:** A GUI newsreader that the KDE desktop offers as the default newsreader.

    +   - **Pan:** A GUI newsreader that, according to the developer’s Web site (`pan.rebelbase.com`),
    . . . attempts to be pleasing to both new and experienced users.” Pan is the default
    newsreader on the GNOME desktop.


    # ## Introducing KNode


    The KDE desktop in SUSE uses KNode as its default newsreader. In SUSE, choose
    Main Menu➪Internet➪Usenet News Reader (if you have more than one news reader installed,
    you have to select KNode from a next-level menu).'
  merge: -1
  img_proc: true
