- pgno: 225
  md: '# Chapter 13


    # Doing Even More Office Stuff

    in SUSE Linux


    # In This Chapter


    +   - Keeping track of appointments and tasks

    +   - Making calculations

    +   - Preparing presentations in OpenOffice.org Impress


    Besides word processing and spreadsheets that I cover in Chapter 12, what else
    do you do in an office? Hmmm . . . let me see. How about keeping track of appointments
    and tasks? Calculating how much profit you made? And making sales pitches or some
    sort of presentation? In this chapter, I cover SUSE Linux applications for some
    of these other office tasks. The chapter begins with a quick summary of the calendar
    applications in KDE and GNOME. Then I describe OpenOffice.org Impress — a Microsoft
    PowerPoint-like presentation software package.


    # Keeping Track of Appointments

    and Tasks


    If you installed KDE as your desktop, you can use Kontact — a new KDE application
    that integrates existing KDE applications such as the KMail mail reader and the
    KOrganizer calendar program into a single graphical personal information manager.
    To start Kontact, click the Personal Information Manager icon on the KDE panel
    (see Figure 13-1) or choose Main Menu➪Office➪Personal Information Manager (Kontact).'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'Click this icon to start KDE Kontact


    **Figure 13-1:** Start KDE Kontact by clicking the icon on the KDE panel.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_226_0.png)


    When Kontact starts, it usually displays the Summary view. You can, however, switch
    to other views by clicking the icons on the left pane of the Kontact window (refer
    to Figure 13-2). For example, Figure 13-2 shows Kontact after you click the Calendar
    icon. In this case, Kontact displays the output of KOrganizer — the KDE calendar
    program. The KOrganizer program displays a calendar view where you can click a
    date to set or view that day’s schedule. Figure 13-2 shows a typical calendar.


    **Figure 13-2:** On the KDE desktop, use Kontact to store your appointments and
    view your calendar.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_226_1.png)


    You can go to a different month or year by clicking the arrows next to the month
    and the year. To add a to-do item for a specific date, select the date from the
    calendar, click the To-do Items text box, and type the description of the task.


    To add appointments for a specific time, double-click the time and type a brief
    description of the appointment in the dialog box that appears. Click OK when you’re
    done. After you finish adding events and appointments, choose File➪Save to save
    the calendar.


    If you installed the GNOME desktop, you can use Evolution to keep track of your
    calendar and tasks. Start Evolution by clicking its icon on the GNOME'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'desktop’s top panel (or choose Main Menu➔Office➔Evolution). After the Evolution
    window appears, click Calendars on the left pane to use the calendar. Evolution’s
    calendar is intuitive to use. Simply select a date and double-click a time to
    open the Appointment dialog box where you can type in the details of the appointment.


    # Making Calculations


    You have a choice of the KDE calculator or the GNOME calculator, depending on
    which desktop you installed. Both are scientific calculators, and you can do the
    typical scientific calculations, such as square root and inverse, as well as trigonometric
    functions, such as sine, cosine, and tangent.


    To use the calculator on a KDE desktop, choose Main Menu➔Utilities➔Calculator➔KCalc.
    Figure 13-3 shows the KDE calculator in SUSE Linux.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_227_0.png)


    Figure 13-3: Do your calculations in the KDE calculator.


    You can display additional buttons by selecting options from the Settings menu.
    For example, choose Settings➔Trigonometric Buttons to show buttons that enable
    you to perform trigonometric calculations with the calculator.


    If you installed the GNOME desktop, choose Main Menu➔Utilities➔Calculator➔Calculator
    to get a calculator.


    # Making Presentations with OpenOffice.org Impress


    It seems the business world, or should I say the whole world, is full of PowerPoint
    rangers — those dedicated souls who live by their PowerPoint briefing packages
    (slide presentations). It’s hard to imagine a meeting or a'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'conference where someone isn’t vigorously making points on-screen with PowerPoint.
    Face it: Slide presentations are here to stay. Making presentations is a fact
    of life, businesspeople have come to expect office-application suites to include
    some sort of presentation software.


    Like Microsoft Office, the OpenOffice.org office application suite comes with
    its own PowerPoint-like presentation software — OpenOffice.org Impress (or Impress
    for short). If you have used Microsoft PowerPoint and you’re already familiar
    with its nuts and bolts — the concept of a slide, how to add text and graphics
    to a slide, how to organize the slides, and how to run a slide show — then you’ll
    find it easy to get started with Impress. Because some details of how you perform
    basic Impress tasks may differ from the way they’re done in PowerPoint, I provide
    some quick tips to point you in the right direction. I start with an overview
    of Impress and then cover some categories of common tasks that you’ll likely perform
    in Impress.


    # # Taking stock of OpenOffice.org Impress


    You’ll find that Impress can do all the usual things that presentation software
    such as Microsoft PowerPoint can do. For example, you can create professional-looking
    slide shows in Impress, using capabilities like these:


    +   - Open and edit Microsoft PowerPoint files or convert Microsoft PowerPoint
    files to Impress format. One advantage of converting to Impress format is that
    Impress files are smaller in size than corresponding Microsoft PowerPoint files.
    Presentation files stored in Impress format are assigned filenames with the `.sxi`
    extension.

    +   - Save documents in many different formats, including Microsoft PowerPoint
    97/2000/XP, StarDraw 5.0 and 3.0, and StarImpress 5.0 and 4.0.

    +   - Insert graphics and clip art from files of many different formats, including
    JPEG, GIF, ZSoft Paintbrush (PCX), TIFF, Windows BMP, Macintosh PICT, Encapsulated
    PostScript (EPS), Adobe Photoshop (PSD), AutoCAD DXF, and many more.

    +   - Insert other OpenOffice.org documents (from programs such as Writer, Calc,
    and Draw) into a presentation.

    +   - Use Presentation Wizard to quickly create a presentation.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '+   - Use all the drawing tools from OpenOffice.org Draw to add drawings to
    the slides.

    +   - Export a presentation to a Web Page (HTML) with or without frames. You can
    also export the slides in any of the supported graphics file formats.

    +   - Use layers to separate parts of the slide so that each part can be edited
    or viewed separately.

    +   - Use special effects such as animated text and graphics, sound, and slide
    transition effects.

    +   - Use FontWork (Format➜FontWork) to create various text effects such as aligning
    text along a curve.

    +   - Render text in 3D.

    +   - Save versions of a presentation as you continue to change it and revert
    back to an older version, if necessary.

    +   - Add speaker’s notes to each slide and create handouts.


    # ## Getting started with Impress


    The best way to get comfortable using Impress is simply to start using it. To
    start Impress, choose Main Menu➜Office➜Presentation➜OpenOffice.org Impress in
    KDE or GNOME.


    The Presentation Wizard dialog box appears and guides you through the steps of
    starting a new presentation. From the Presentation Wizard dialog box, you can
    create an empty presentation, create a presentation from a template, or open an
    existing presentation. If you select an empty presentation and click Next, the
    Presentation Wizard asks you to select the slide design. Then you can click Create
    to open the Impress window, where you can select the layout of your first slide.
    After you finish laying out a slide, you can proceed to insert new slides. For
    each slide, you can select the layout you want.


    You can open and edit Microsoft PowerPoint files in Impress. To open an existing
    file, choose File➜Open and then select the file to open.


    Before you start creating slides with Impress, take a moment to examine the Impress
    window (shown in Figure 13-4).'
  merge: -1
  img_proc: true
- pgno: 230
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_230_0.png)


    **Figure 13-4.** Create slide presentations by using the menus and toolbars in
    Impress.


    In Figure 13-4, note the major parts of the Impress window:


    +   - **Menu bar:** Provides the standard pull-down menus such as File, Edit,
    and Help for performing all the tasks that Impress can do.

    +   - **Function bar:** Shows the full pathname or the URL of the currently open
    file and also provides buttons for performing tasks such as opening, saving, and
    printing a document. You can also click icons on the function bar to open the
    Stylist, the Navigator, and the Gallery.

    +   - **Object bar:** Enables you to format the document by applying styles, selecting
    fonts, or changing text attributes such as bold, italic, and underline. This bar
    changes according to the type of object you’ve clicked (for example, plain text
    or graphic image).

    +   - **Drawing toolbar:** Located along the bottom of the window, it provides
    buttons that you can use to perform drawing tasks, such as inserting graphics,
    drawing lines and curves, and inserting text.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '**Status bar:** Displays information about the current slide such as the current
    slide number and the total count of slides. You can also click elements in the
    status bar and change settings such as the zoom factor for viewing the slide.


    In addition to these tool and icon bars, you can turn on many more toolbars from
    the View➔Toolbars menu.


    The largest part of the Impress window is the work area where you work on the
    current slide and where you focus most of your attention.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_231_0.png)


    Use the tooltips to find out what an icon or menu option does. Hover the mouse
    cursor over a toolbar icon or a menu item, and Impress displays a small tooltip
    window with a brief help message.


    You don’t have to set up anything to start using Impress. However, if you ever
    need to configure some aspects of Impress, you can do so through the Tools➔Options
    and Tools➔Configure menus. In particular, the Presentation category of the Tools➔Options
    window contains the options for Impress (Figure 13-5). You should go through each
    of the Presentation options to see what you can configure from this window.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_231_1.png)


    **Figure 13-5:** Set up through the options in the Presentation category.


    # Using Impress


    When you start Impress, the Presentation Wizard prompts you for the type of presentation
    you want. If Impress is already running, you get the Presentation Wizard when
    you choose File➔New➔Presentation. If you want a blank presentation, simply click
    Create in the first step of the Presentation Wizard (as in Figure 13-6). Impress
    then displays an empty slide along with a gallery of slide layouts from which
    you can change the slide’s layout.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_232_0.png)


    **Figure 13-6:** Click Create in the Presentation Wizard.


    Typically, a slide layout might have a title area and some text bullets. You can
    click and add the text to each of these areas. To insert any graphic image, choose
    Insert➪Graphics and pick the graphics file you want to insert. You can draw directly
    on the slide by using the drawing tools from the vertical toolbar along the left
    side of the Impress window. To see which tool does what, move the mouse over any
    icon, and a tooltip gives you a hint.


    After you finish working on a slide, you can insert another slide by choosing
    Insert➪Slide. Impress displays an Insert Slide dialog box (similar to the Modify
    Slide dialog box shown in Figure 13-6), and you can select the layout for the
    next slide.


    To save a presentation, choose File➪Save from the menu. For new documents, you
    have to provide a filename and select the directory to save the file.


    That, in a nutshell, is how you create presentations in PowerPoint. In the following
    sections, I provide some quick tips for performing the following tasks with Impress:


    +   - Preparing presentations

    +   - Adding graphics and special effects

    +   - Delivering presentations


    # Preparing presentations


    Typically, you start with a blank slide with a specific layout. For example, the
    slide has a title area and a bulleted list for the points you want to make with'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'the slide. You can click the title area, type the title, and then click the
    bulleted text area to start entering text. Then you add another slide and continue
    with the process until you finish the presentation.


    If you’re going to present information that’s already in a Writer document, you
    can use the outline of that Writer document to start a presentation. The Writer
    document does have to follow one rule — it must use the heading styles Heading
    1, Heading 2, and so on for the major sections in the document.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_233_0.png)


    To create a presentation from the outline of a Writer document that uses the heading
    styles, open the document in Writer and choose SlideShow > Outline to Presentation
    from the Writer menu. You should see an Impress window open up with a new presentation
    that has slides based on the headings in the Writer document. Each Heading 1 style
    becomes a new slide, and the Heading 2 and Heading 3 styles appear as bulleted
    text in the slides.


    After working on the set of slides, you may want to rearrange the slides. To rearrange
    slides in a different order, choose View > Slide Sorter. Impress displays an array
    of miniature-sized slides, arranged in a rectangular grid in the work area (as
    in Figure 13-7). Think of this as the slide sorter view because you can move the
    slides around and sort them in this view.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_233_1.png)


    **Figure 13-7:** Arrange slides in this slide sorter view in Impress.'
  merge: -1
  img_proc: true
- pgno: 234
  md: "In the slide sorter view shown in Figure 13-7, you can drag and drop slides\
    \ into different positions and rearrange them in the order you want. To delete\
    \ a slide in this view, click the slide to select it and press Delete (or choose\
    \ Edit→Delete). When prompted to confirm the deletion, you can click Yes if you\
    \ really want to delete the slide. Double-click a slide to return to the usual\
    \ single-slide view.\n\nAs you work on the presentation, keep in mind these concepts:\n\
    \n+   - **Master slide:** You can think of the *master slide* as the background\
    \ of every slide. If you put text or other fields (such as date and page number)\
    \ on the master slide, those elements appear on every slide in the presentation.\n\
    +   - **Master notes:** The idea is the same as that for the master slide. You\
    \ can define some fields and text on the master notes; these become part of the\
    \ background for your notes. The *notes* refer to the explanatory text you add\
    \ to the bottom of each slide.\n\nWell, I could go on and on, but you can discover\
    \ its capabilities best by simply starting to use Impress.\n\n# Adding graphics\
    \ and special effects\n\nTo jazz up your presentation, you might want to add graphics,\
    \ charts, and other special effects to the slides. With Impress, you can do nearly\
    \ everything you can think of—all you have to decide is how many bells and whistles\
    \ your presentation needs. It’s your call, but I recommend using these features\
    \ judiciously lest they detract from your presentation’s main message.\n\nIf you\
    \ want to add some simple drawings to the slide, you can pick from the drawing\
    \ tools on the drawing toolbar on the bottom of the Impress window (refer to Figure\
    \ 13-4) and start drawing on the slide. To insert an image into the slide, choose\
    \ Insert→Graphics and then select the image file you want to insert.\n\nYou can\
    \ also insert charts to graphically depict data. You start by inserting a chart\
    \ with dummy data, and then you edit the data as well as other features of the\
    \ chart. To add a chart and edit the data, follow these steps:\n\n+   1. **Choose\
    \ Insert→Chart.**\n+   \n+      A chart with the default chart type and dummy\
    \ data appears."
  merge: -1
  img_proc: true
- pgno: 235
  md: '+   2. **Resize the chart by dragging the handles around the border of the
