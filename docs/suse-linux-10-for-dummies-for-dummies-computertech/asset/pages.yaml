    In addition to these parts, the largest part of the Writer window is the work
    area where your document appears. That’s where you focus most of your attention.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_207_0.png)


    Use tooltips to get a clue about what a particular field or button does. Hover
    the mouse cursor over a field or a button, and Writer displays a small tooltip
    window with a brief help message. If you want more information in the tooltips,
    turn on extended tooltips by choosing Tools▸Options▸OpenOffice.org▸General▸Help▸Extended
    tips (when the check shows, the option is turned on).


    If you need it, help is available in Writer. Choose Help▸OpenOffice.org Help from
    the Writer menu. This action brings up the OpenOffice.org Help window with help
    information about Writer. Click the links to view specific help information.


    # Setting up Writer


    You don’t really have to do any special setups to start using Writer. Even tasks
    such as printing should work right away provided you have set up a printer using
    the procedure described in Chapter 3. You may want to tinker with some settings,
    however, so that Writer works to your liking. For example, you might want to turn
    off AutoCorrect so that it doesn’t suggest word completion, or you might want
    to hide some toolbars to get more workspace. You can set up most of these options
    from the View and Tools menus, which are located on the Menu bar (refer to Figure
    12-1). In particular, you perform many of the setup tasks from the dialog box
    (Figure 12-2) that appears when you choose Tools▸Options.'
