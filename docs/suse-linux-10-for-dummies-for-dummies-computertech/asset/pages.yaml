- pgno: 291
  md: '# Chapter 18


    # Updating SUSE and Adding

    New Software


    # In This Chapter


    +   - Updating SUSE Linux online with YaST Online Update (YOU)

    +   - Locating and installing new software using YaST

    +   - Working with RPM files with the rpm command


    Be it a bug fix or an enhancement, SUSE Linux often has updates that you need
    to install. Additionally, you may sometimes download new software. The updates
    come in the form of software patches, which refer to changes to existing software
    packages. The new software usually comes in the form of *Red Hat Package Manager*
    (RPM) files. Both patches and RPM files have to be installed — installing patches
    updates existing software and installing RPM files usually installs new software.


    You can use the GUI YaST Online Update (YOU) to keep SUSE Linux updated by downloading
    and installing patches. On the other hand, you can use YaST Control Center▸Software▸Software
    Management to install new software (and also remove unneeded software). In case
    the GUI tool is not available, you can also use the rpm commands to install or
    remove software packages that come in the form of RPM files.


    In this chapter, I show you how to update SUSE Linux online and how to locate
    and install new software using YaST. I also introduce you to the rpm commands
    that enable you to install or remove RPM software packages directly from a text
    console or a terminal window.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_291_0.png)


    You need a fast Internet connection (such as a DSL or cable modem) to easily update
    your SUSE Linux applications or download new software packages. Make sure that
    your Internet connection is up and running before you attempt to update your SUSE
    Linux system online.'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# # Updating SUSE Linux Online


    SUSE Linux comes with YOU — YaST Online Update — for online software updates.
    To access YOU, start YaST Control Center\>Software\>Online Update. This brings
    up the YaST Online Update window, as shown in Figure 18-1.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_292_0.png)


    **Figure 18-1:** You can keep your SUSE system updated with YaST Online Update
    (YOU).


    To set up YOU automatic updates, click the Configure Fully Automatic Update button.
    This brings up the YOU Automatic Mode Setup dialog box, as shown in Figure 18-2.


    You can then enable automatic updates by checking the Enable Automatic Update
    box. If you enable automatic updates, you have to specify a time of the day and
    frequency (daily or weekly) when you want YOU to check for any available patches
    and download and install them, if available. If you do not want to install the
    patches automatically, you can specify that YOU only download the patches and
    not install them. After setting the automatic update options, click OK to close
    the dialog box.


    The next important setting for YOU is the online server from which to download
    the patches. To select the location, click the Installation Source drop-down menu
    in the YOU window (refer to Figure 18-1) and select an online server from where
    YOU should download the software updates. When you select a location, the full
    URL for the location appears in the Location text box. If you know of a new server,
    you can click New Server and enter the information about the new server. Typically,
    you can get by with the predefined set of servers that SUSE Linux provides.'
