    You can then click a newsgroup to download the headers from that group. Pan displays
    the headers in the upper-right side of the window. You can click a header, and
    Pan displays the contents of that news item in the lower-right part of the window.
    (Refer to Figure 11-7.)


    # Newsgroup subscriptions


    Unlike magazines or newspapers, newsgroups don’t require that you subscribe to
    them; you can read any available newsgroup on the news server. The news server’s
    administrator may decide to exclude certain newsgroups, however; if they aren’t
    included, you cannot read them.


    The only thing that can be called “subscribing” is when you indicate the newsgroups
    you routinely want to read. The news server does not receive any of this subscription
    information — the information is used only by the newsreader to determine what
    to download from the news server.


    # Posting news


    You can use any newsreader to post a news article (a new item or a reply to an
    old posting) to one or more newsgroups. The exact steps for posting a news item
    depend on the newsreader, but posting to a newsgroup is similar'
