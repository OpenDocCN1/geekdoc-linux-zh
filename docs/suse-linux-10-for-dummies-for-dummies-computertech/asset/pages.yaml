- pgno: 63
  md: '# # Managing DVDs and CD-ROMs


    The KDE and GNOME GUI desktops make using DVDs and CD-ROMs in SUSE Linux easy.
    Just place a DVD or a CD-ROM in the drive (I am assuming it’s a data disc), click
    the My Computer icon on your desktop, and then click the icon for the DVD/CD drive.
    The contents of the CD or DVD data disc then appear in a GUI file manager window.
    If you insert a DVD movie into the DVD drive, an appropriate multimedia program
    opens the DVD.


    If you see a DVD/CD-ROM icon on the desktop, right-click that icon for a context
    menu. From that menu, you can eject the CD or DVD when you are done.


    # ## Playing with the Shell


    Linux is basically UNIX, and UNIX just doesn’t feel like UNIX unless you can type
    cryptic commands in a text terminal. Although GNOME and KDE have done a lot to
    bring us into the world of windows, icons, mouse, and pointer (affectionately
    known as WIMP), sometimes you’re stuck with nothing but a plain text screen with
    a prompt that looks something like this (when I log in with the username naba):


    ```

    ```text

    naba@linux:~>

    ```

    ```


    You see the text screen most often when something is wrong with the X Window System,
    which is essentially the machinery that runs the windows and menus that you normally
    see. In those cases, your first reaction might be, “What do I do now?” And the
    answer is that you have to work with the shell and know some of the cryptic Linux
    commands.


    You can prepare for unexpected encounters with the shell by trying out some Linux
    commands in a terminal window while you’re in the GNOME or KDE GUI. After you
    get the hang of it, you might even keep a terminal window open, just so you can
    use one of those cryptic commands simply because it’s faster than pointing and
    clicking. (Those two-letter commands do pack some punch!)


    # ### Starting the bash shell


    Simply put, the shell is the Linux command interpreter — a program that reads
    what you type, interprets that text as a command, and does what the command is
    supposed to do.


    Before you start playing with the shell, open a terminal window. In KDE, the panel
    includes an icon that looks like a monitor covered by a sea shell (for a shell,
    get it?). When you click that icon, a window with a prompt appears, like'
