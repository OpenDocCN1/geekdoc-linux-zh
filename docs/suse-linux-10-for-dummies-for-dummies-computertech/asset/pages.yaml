- pgno: 221
  md: 'Preparing spreadsheets with Calc is a straightforward affair. Typically, you
    can enter text and numbers into the cells, resize the columns by dragging the
    vertical lines, and enter formulas to calculate the answers you need. To help
    you perform some common tasks in Calc, I provide some quick tips for two broad
    categories of tasks:


    +   - Entering and formatting data

    +   - Calculating and charting data


    # Entering and formatting data


    When entering and formatting data, use Calc in the same way you use Microsoft
    Excel. You can type entries in cells, use formulas, and format the cells (such
    as specifying the type of value and the number of digits after the decimal point).
    The Format menu contains many of the options for formatting the spreadsheet.


    After you’re done entering data into a spreadsheet, save it by choosing File→Save
    As. A dialog box appears, from which you can specify the file format, the directory
    location, and the name of the file. You’ve seen similar Save As dialog boxes a
    thousand times before. OpenOffice.org Calc can save the file in a number of formats,
    including Microsoft Excel 97/2000/XP, Microsoft Excel 95, Microsoft Excel 5.0,
    and text file with comma-separated values (CSV).


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_221_0.png)


    If you want to exchange files with Microsoft Excel, save the spreadsheet in Microsoft
    Excel format (choose an appropriate version of Excel). Then you can transfer that
    file to a Windows system and open it in Microsoft Excel.


    After you’ve saved the spreadsheet once, you can also save intermediate versions
    of a spreadsheet. To save a new version, choose File→Versions and then click Save
    New Version in the next dialog box.


    To share a spreadsheet with people who don’t use Calc or Excel, you can print
    the spreadsheet to a PDF file and then send that to others because anyone can
    easily view and print PDF files by using the free Adobe Reader (see www.adobe.com/products/acrobat/readstep2.html).


    # Calculating and charting data


    To perform calculations, use formulas you normally use in Microsoft Excel. For
    example, use the formula SUM(D2:D6) to add up the entries from cell D2 to D6.
    To set cell D2 as the product of the entries A2 and C2, type =A2*C2 in cell D2.'
  merge: -1
  img_proc: true
- pgno: 222
  md: "![](img/b7e91b81e0d84c8a5261ee14a48991b2_222_0.png)\n\nTo learn more about\
    \ the functions available in OpenOffice.org Calc, choose Help➪OpenOffice.org Help.\
    \ This opens the OpenOffice.org Help window, from which you can browse the functions\
    \ by category and click a function to read more about it.\n\nOne interesting feature\
    \ of Calc is the support for scenarios. A scenario is simply a collection of values\
    \ for one or more cells. Scenarios are useful when you compare the effect of some\
    \ cells on other calculations in the spreadsheet. For example, the monthly payment\
    \ on a loan would depend on the principal, the interest rate, and the duration\
    \ of the loan. You can use Calc’s scenario feature to compare the monthly payments\
    \ for a number of different scenarios where each scenario has a certain combination\
    \ of interest rate and loan duration in months. To use scenario for this comparison,\
    \ follow these steps:\n\n+   1. **Set up the spreadsheet cells with labels and\
    \ values for the principal, annual interest rate in percentage, and loan duration\
    \ in months (refer to Figure 12-12). Calculate the monthly payment using this\
    \ formula:**\n+   \n+   ```text\n+   =PMT (MONTHLY_RATE; MONTHS; PRINCIPAL)\n\
    +   ```\n+   \n+   Figure 12-12 illustrates this example. The cells in the range\
    \ B5:C7 specify the principal, annual rate, and the number of months. Cell C6,\
    \ with the annual interest rate, is formatted to show a percentage. Cell C11 computes\
    \ the payment using the formula that you see in the formula bar. Notice that the\
    \ annual rate in cell C6 has to be divided by 12 to get the monthly rate.\n\n\
    +   2. **Select the cells that you want to include in the scenario and choose\
    \ Tools➪Scenarios.** For example, in Figure 12-12, select the cells in the range\
    \ B5:C7.\n+   \n+   The Create Scenario dialog box appears.\n\n+   3. **Fill in\
    \ the scenario name, and then click OK.**\n+   \n+   For example, the scenario\
    \ shown in Figure 12-12 is named `Rate 6.5 PCT` (that’s my name for the 6.5% rate\
    \ scenario).\n\n+   4. **Enter values into the cells — principal, interest rate,\
    \ and months to repay loan.**\n+   \n+   The scenario name appears in a drop-down\
    \ list above the cells that constitute the scenario (as shown in Figure 12-12).\
    \ The cell values define what that scenario means."
  merge: -1
  img_proc: true
- pgno: 223
  md: "![](img/b7e91b81e0d84c8a5261ee14a48991b2_223_0.png)\n\n**Figure 12-12—** Use\
    \ scenarios to compare the effect of different sets of values on a calculation.\n\
    \n+   5. **Repeat Steps 2, 3, and 4 for other scenarios where each scenario has\
    \ a combination of principal amount, rate, and loan duration in months.**\n\n\
    +   6. **Select a scenario from the drop-down list (refer to Figure 12-12) to\
    \ see the monthly payment for that scenario.**\n\n![](img/b7e91b81e0d84c8a5261ee14a48991b2_223_1.png)\n\
    \nTo figure out where a particular cell is being used in some calculation, click\
    \ the cell and then choose Tools>Detective>Trace Dependents. Calc draws arrows\
    \ to show where that cell is being used.\n\nIf you cannot remember a function,\
    \ use the Function Wizard to build the formula in a cell. To use the Function\
    \ Wizard, follow these steps:\n\n+   1. **Click the Function Wizard icon (refer\
    \ to Figure 12-10) on the Formula bar.**\n+   \n+      The Function Wizard dialog\
    \ box appears.\n\n+   2. **Scroll down the list of functions and double-click\
    \ the function you want.**\n+   \n+      Doing so causes the formula and its arguments\
    \ to appear (see Figure 12-13), waiting for you to specify the values to be used\
    \ as arguments."
  merge: -1
  img_proc: true
