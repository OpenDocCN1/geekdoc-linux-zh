- pgno: 288
  md: '+   - **Scanner:** Configure any scanner connected to the PC.

    +   - **Sound:** Add a sound card or view details about a detected sound card.

    +   - **TV Card:** Configure a TV or radio card. (These are plug-in cards capable
    of receiving TV or radio signals.)


    # Managing User Accounts


    SUSE Linux is a multiuser system, so it has many user accounts. Even if you are
    the only user on your system, many servers require a unique username and group
    name. Take, for example, the FTP server. It runs under the username ftp. A whole
    host of system usernames are not for people, but just for running specific programs.


    Also, users can belong to one or more groups. Typically, each username has a corresponding
    private group name. By default, each user belongs to that corresponding private
    group. However, you can define other groups so that everyone belonging to a group
    can access a specific set of files and directories.


    To create a user account in SUSE Linux, use YaST Control Center→Security and Users→User
    Management. YaST then brings up the User and Group Administration pane, shown
    in Figure 17-6, where you can define new user accounts.


    Notice that the pane has two radio buttons: Users and Groups (as shown in Figure
    17-6). Selecting the Users radio button displays the current list of user accounts.
    Selecting the Groups radio button lists the names of groups. Initially, the User
    and Group Administration tool filters out any system users and groups. However,
    you can view the system users by clicking Set Filter and selecting System Users
    from the drop-down menu. *(System users refer to user accounts that are not assigned
    to human users; rather, these user accounts are used to run various services.)*


    You can add new users and groups or edit existing users and groups from the pane
    shown in Figure 17-6.


    To add a new user account, make sure that the Users radio button is selected and
    click the Add button. Then enter the information requested in the Add a New Local
    User window, as shown in Figure 17-7.


    Fill in the requested information in the window (refer to Figure 17-7), and click
    the Create button. The new user now appears in the list of users in the User and
    Group Administration pane.'
