  md: '# Appendix


    # About the DVD-ROM


    # In This Appendix


    +   - System requirements

    +   - DVD installation instructions

    +   - What you’ll find on the DVD

    +   - Troubleshooting


    This book’s companion DVD includes a Special Edition of SUSE Linux 10.0 to get
    you started on your Linux journey. This version of SUSE Linux 10.0 includes the
    SUSE Linux 10.0 Open Source Software (OSS) from the openSUSE project plus a few
    additional goodies such as Acrobat Reader, RealPlayer 10, and Macromedia Flash
    plug-in for the Web browser. You can either run SUSE Linux directly from the DVD
    or install SUSE Linux on your PC. This appendix briefly describes the DVD and
    tells you how to get started with the installation.


    # System Requirements


    Make sure that your computer meets the minimum system requirements shown in the
    following list. If your computer doesn’t match up to most of these requirements,
    you may have problems using the software and files on the DVD:


    +   - A PC with an Intel Pentium or compatible processor running at 400 MHz or
    faster for graphical installation

    +   - At least 256MB of total RAM installed on your computer for graphical installation
    (512MB recommended)

    +   - At least 520MB free space on your hard drive for a minimal installation;
    5GB of free space recommended if you plan to install most packages, so that you
    can try out everything covered in this book

    +   - A DVD-ROM drive'
  merge: -1
  img_proc: true
- pgno: 358
  md: '# # DVD Installation Instructions


    To install SUSE Linux from the companion DVD, follow these steps (consult Chapter
    2 for details.):


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_358_0.png)


    +   1. **Check whether your PC’s hardware, such as graphics card, network card,
    and SCSI card, work in SUSE Linux. If not, try to find Linux drivers for the device.**


    To check if your PC’s hardware is compatible with SUSE Linux, visit the SUSE Linux
    Hardware Database at hardwaredb.suse.de. If you download any Linux drivers for
    any device, you should burn them onto a CD for safekeeping.


    +   2. **Set up your PC to boot from the CD/DVD drive (to do this, you have to
    enter SETUP as your PC powers up).**


    +   3. **Boot your PC with the DVD.**


    +   4. **Select Installation from the initial boot screen and press Enter.**


    The SUSE Linux installer — YaST — runs and displays graphical screens through
    which you perform the installation steps. Respond to the questions and choices
    as the installation program takes you through the initial installation steps.
    Here are some key steps:


    +   - Review the hard drive partitioning that YaST recommends. If you have Microsoft
    Windows (any version) installed on your hard drive, YaST can reduce the size of
    the Windows partition and make space for SUSE Linux. You don’t need any other
    partitioning software.

    +   - Set the local time zone.

    +   - Select the GUI desktop — KDE or GNOME.


    +   5. **YaST reboots the system after the initial installation and continues
    with further installation and configuration of SUSE Linux.**


    After installing more packages, YaST continues with configuration of the system.
    Here are a few key configuration steps that you have to go through:


    +   - Configure the Ethernet network, if any. Typically, you configure the network
    automatically by using DHCP.

    +   - Set the root password.

    +   - Add a user account (you would typically log in using this account).

    +   - Configure hardware such as a graphics card, sound card, and printers.'
  merge: -1
  img_proc: true
- pgno: 359
  md: '# What You’ll Find on the DVD


    This section provides a summary of the software and other goodies you can find
    on the DVD. If you need help installing the items provided on the DVD, refer back
    to the installation instructions in the preceding section.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_359_0.png)


    GNU software is governed by its own license, which is included in the folder of
    the GNU software. There are no restrictions on the distribution of GNU software.
    See the GNU license at the root of the DVD or at the back of this book for details.
    As required by the GNU license, Novell makes the SUSE Linux source code available.
    You can download the source code for SUSE Linux from the following URL:


    ```

    http://ftp.opensuse.org/pub/opensuse/distribution/SL-OSS-stable/inst-source/suse/src/

    ```


    The DVD includes a Special Edition of SUSE Linux 10.0. The version of SUSE Linux
    on the companion DVD includes all the basics that come with SUSE Linux 10.0 OSS
    from the openSUSE project and a few extras:


    +   - Your choice of KDE or GNOME graphical desktop environments

    +   - Konqueror Web browser and file manager

    +   - Multimedia tools for playing CDs and DVDs, burning CDs, and ripping audio
    CDs

    +   - Office software in the form of the much-acclaimed OpenOffice.org suite

    +   - Photo and graphics editing software such as The GIMP, and much more

    +   - Extra goodies such as Acrobat Reader, RealPlayer 10, and Macromedia Flash
    plug-in for the Web browser


    In short, the version of SUSE Linux that accompanies this book gives you everything
    you need for a typical home- or small-office computer.


    SUSE does offer a commercial version of SUSE Linux that includes many servers;
    software development tools; additional word processing, database, and spreadsheet
    programs; and many more extra programs.


    If you want the source code sent to you, please complete the online coupon at
    www.dummies.com/go/linux3sourcecoupon.'
  merge: -1
  img_proc: true
