    |---|---|---|

    | Vector drawing | Dia, Inkscape,<br>OpenOffice.org Draw | OpenOffice.org Draw
    |

    | Image viewer | Eye of Gnome | Gwenview |

    | Fax viewer |  | Kfax |

    | PDF viewer | Acrobat Reader,<br>GNOME PDF Viewer | Acrobat Reader,<br>Kghostview
    |

    | PostScript viewer | GGV PostScript Viewer | KGhostview |


    Here’s what the image and graphics applications enable you to do:


    +   - **Photo or image editor** applications are for touching up photos as well
