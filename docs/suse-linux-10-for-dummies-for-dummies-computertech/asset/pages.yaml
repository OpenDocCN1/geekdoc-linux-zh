    \ you if you want to use a username and password to connect to the FTP server.\
    \ Because the FTP servers support anonymous FTP — which means anyone can log in\
    \ with the username anonymous — select No and press Enter. The installer also\
    \ prompts if you want to use an HTTP proxy. Unless your PC is behind a proxy (which\
    \ may be the case at some organizations), select No and press Enter. The installer\
    \ then prompts for the name of the directory where the SUSE files are located.\n\
    \n+   13. **Enter the name of the directory on the FTP server where the SUSE Linux\
    \ files are located and press Enter.**\n+   \n+      The directory name would\
    \ be the parent directory of the location where you found the `boot.iso` file\
