    # Exploring KDE


    KDE (pronounced *Kay-dee-ee*) is the default GUI for SUSE Linux. KDE stands for
    the *K Desktop Environment*. From your perspective as a user, KDE provides a graphical
    desktop environment that includes the Konqueror Web browser and file manager,
    a panel with menus for starting applications, a help system, configuration tools,
    and many applications, including the OpenOffice.org office suite, image viewer,
    PostScript viewer, and mail and news reader programs.'
