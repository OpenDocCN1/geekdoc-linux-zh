  md: '# Using GUI File Managers


    Both GNOME and KDE desktops come with GUI file managers that enable you to easily
    browse the file system and perform tasks such as copying or moving files. The
    GNOME file manager is called Nautilus, and the KDE file manager is Konqueror.
    I briefly introduce these GUI file managers in the following sections.


    # Conquering the file system with Konqueror


    Konqueror is a file manager and Web browser that comes with KDE. It''s intuitive
    to use — somewhat similar to the Windows Active Desktop. You can manage files
    and folders (and also view Web pages) with Konqueror.


    # Viewing files and folders


    When you double-click a folder icon on the desktop, Konqueror starts automatically.
    For example, click the Home Folder icon on the KDE panel. Konqueror runs and displays
    the contents of your home directory (think of a directory as a folder that can
    contain other files and folders). Figure 6-3 shows a typical user''s home directory
    in Konqueror.


    If you''ve used Windows Explorer, you can use Konqueror in a similar manner.


    The Konqueror window is vertically divided into two panes:


    +   - A narrow left pane shows icons you can click to perform various tasks as
