    Writer also enables you to perform many other tasks related to styles and templates.\
    \ For example, you can create a style, apply a style to text, copy styles from\
    \ one template to another, and so on.\n\n# # Doing page layout\n\nIn Writer, page\
    \ styles control the page layout, and each page can have its own style. The usual\
    \ approach is to define three page styles: First Page, Left Page, and Right Page.\
    \ Define the First Page style with whatever applies to the first page such as\
    \ a special header and no page number. The Left Page style is the style for the\
    \ even-numbered pages, and the Right Page style is for odd-numbered pages. For\
    \ each page style, you can also define the page style that applies to the following\
    \ page. The idea would be to define Left Page as the next page style for First\
    \ Page and Right Page as the style of the page that follows the Left Page style.\
    \ That way, the page styles are correct for all the pages as long as you start\
    \ with the First Page style. You may also want to define a Landscape page style\
    \ so you can use it for pages that have to be in landscape orientation."
