- pgno: 187
  md: '# Chapter 11


    # Reading Newsgroups

    and RSS Feeds


    # In This Chapter


    +   - Understanding newsgroups

    +   - Reading newsgroups from your ISP using KNode and Pan

    +   - Reading and searching newsgroups at some Web sites

    +   - Reading RSS feeds


    Internet newsgroups are like the bulletin board systems (BBSs) of the pre-Web
    age or the forums offered on online systems such as AOL and MSN. Essentially,
    newsgroups provide a distributed conferencing system that spans the globe. You
    can post articles — essentially e-mail messages to a whole group of people — and
    respond to articles others have posted.


    Think of an Internet newsgroup as a gathering place — a virtual meeting place
    where you can ask questions and discuss various issues (and best of all, everything
    you discuss gets archived for posterity).


    To participate in newsgroups, you need access to a news server — your Internet
    service provider (ISP) can give you this access. You also need a newsreader. SUSE
    Linux comes with software that you can use to read newsgroups. In this chapter,
    I introduce you to newsgroups and show you how to read newsgroups with KNode and
    Pan newsreaders. I also briefly explain how you can read and search newsgroups
    for free at a few Web sites.


    Nowadays, another popular way to read summaries of Web sites and weblogs is to
    use a program that can accept RSS feeds. At the end of this chapter, I briefly
    describe what an RSS feed is and how you can use a program such as the KDE Akregator
    to subscribe to RSS feeds and read them on your SUSE Linux system.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# # Understanding Newsgroups


    Newsgroups originated in Usenet — a store-and-forward messaging network that was
    widely used for exchanging e-mail and news items. Usenet works like a telegraph
    in that news and mail are relayed from one system to another. In Usenet, the systems
    are not on any network; the systems simply dial up one another and use the UNIX-to-UNIX
    Copy Protocol (UUCP) to transfer text messages.


    Although it’s a very loosely connected collection of computers, Usenet works well
    and continues to be used because very little expense is involved in connecting
    to it. All you need is a modem and a site willing to store and forward your mail
    and news. You have to set up UUCP on your system, but you don’t need a sustained
    network connection; just a few phone calls are all you need to keep the e-mail
    and news flowing. The downside of Usenet is that you cannot use TCP/IP services
    such as the Web, TELNET, or FTP with UUCP.


    From their Usenet origins, the newsgroups have now migrated to the Internet (even
    though the newsgroups are still called *Usenet newsgroups*). Instead of UUCP,
    the Network News Transfer Protocol (NNTP) now transports the news.


    Although (for most of the online world) the news transport protocol has changed
    from UUCP to NNTP, the store-and-forward concept of news transfer remains. Thus,
    if you want to get news on your SUSE Linux system, you have to find a news server
    from which your system can download news. Typically, you can use your ISP’s news
    server.


    # ## Newsgroup hierarchy


    The Internet newsgroups are organized in a hierarchy for ease of maintenance as
    well as ease of use. The newsgroup names help keep things straight by showing
    the hierarchy.


    Admittedly, these newsgroup names are written in Internet-speak, which can seem
    rather obscure at first. But the language is pretty easy to pick up with a little
    bit of explanation. For example, a typical newsgroup name looks like this:


    ```

    comp.os.linux.announce

    ```


    This name says that `comp.os.linux.announce` is a newsgroup for announcements
    (`announce`) about the Linux operating system (`os.linux`) and that these subjects
    fall under the broad category of computers (`comp`).'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'As you can see, the format of a newsgroup name is a sequence of words separated
    by periods. These words denote the hierarchy of the newsgroup. Figure 11-1 illustrates
    the concept of hierarchical organization of newsgroups.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_189_0.png)


    **Figure 11-1:** Newsgroups are organized in a hierarchy with many top-level categories.


    To understand the newsgroup hierarchy, compare the newsgroup name with the pathname
    of a file (for example, `/usr/lib/X11/xinit/Xclients`) in Linux. Just as a file’s
    pathname shows the directory hierarchy of the file, the newsgroup name shows the
    newsgroup hierarchy. In filenames, a slash (`/`) separates the names of directories;
    in a newsgroup’s name, a period (`.`) separates the different levels in the newsgroup
    hierarchy.


    In a newsgroup name, the first word represents the newsgroup *category*. The `comp.os.linux.announce`
    newsgroup, for example, is in the `comp` category, whereas `alt.books.technical`
    is in the `alt` category.


    # Top-level newsgroup categories


    Table 11-1 lists some of the major newsgroup categories. You find a wide variety
    of newsgroups covering subjects ranging from politics to computers. The Linux-related
    newsgroups are in the `comp.os.linux` hierarchy.'
