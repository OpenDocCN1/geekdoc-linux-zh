- pgno: 176
  md: '# # Instant Messaging in SUSE Linux


    Instant messaging (IM) is kind of like a phone call in that you can communicate
    with others in real time. The difference is that instead of talking, you type
    your messages in an IM client application. Both you and the person you are communicating
    with see each line of text right after you type it and press Enter. The IM client
    also enables you to post an Away message that lets others know that you are online
    but not available for conversation. Behind the scenes, instant messaging needs
    a central server that keeps track of all the online users and that facilitates
    sending the typed text between the parties engaged in messaging. That central
    server comes from an IM service. Some popular IM services include IRC, AIM, Yahoo!
    Messenger, MSN Messenger, and ICQ. You have to get an account with one of these
    IM services and sign in before you can exchange instant messages with others on
    that service. After you sign in, you can find out if your friends are online and
    send messages via the IM client.


    There are two major IM clients in SUSE Linux. In KDE desktops, you can use Kopete,
    whereas Gaim is a commonly used IM client for the GNOME desktop. I briefly describe
    both IM clients in the following sections.


    # ## Using Kopete


    Kopete — the KDE IM client — enables you to connect to many messaging services
    including AIM, IRC, MSN Messenger, Yahoo!, Gadu-Gadu, and SMS.


    To start Kopete, choose Main Menu▸Internet▸Chat from the KDE desktop (if you have
    more than one messaging program installed, you have to select Kopete from a next-level
    menu). When you first run Kopete, you get the Configure Kopete window (see Figure
    10-6), where you can enter information about your IM and other messaging service
    accounts.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_176_0.png)'
  merge: -1
  img_proc: true
