- pgno: 347
  md: '# Chapter 23


    # Ten Most Commonly Used

    SUSE Linux Commands


    # In This Chapter


    +   - apropos

    +   - man

    +   - ls

    +   - cat

    +   - grep

    +   - locate

    +   - chmod

    +   - rpm

    +   - tar

    +   - pico


    One of these days, you’ll become a SUSE Linux expert, and then you’ll want to
    use cryptic commands for everything. Yeah, right! Seriously: Sometimes you do
    end up having to use some Linux commands either because you are stuck at a text
    console (X is on the fritz) or there’s no quick way in a GUI to do what you want.
    I’m going to show you the ten most commonly used SUSE Linux commands. (I didn’t
    do a survey to find the ten most-used commands — these are simply the ones I use
    most often.)


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_347_0.png)


    Linux commands are case-sensitive, and all commands are in lowercase. Of course,
    directory and filenames can be in mixed case.


    Before I forget . . . if you are wondering where you use these commands, you type
    these commands at a shell prompt in a text console or in a terminal window, which
