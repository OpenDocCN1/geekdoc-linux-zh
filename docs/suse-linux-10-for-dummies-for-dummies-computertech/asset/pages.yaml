- pgno: 299
  md: '# # Using RPM Commands to

    # Work with RPM Files


    RPM — Red Hat Package Manager — is a format for packaging all the necessary files
    for a software product in a single file — called an *RPM file* or simply an *RPM*.
    In fact, the SUSE Linux distribution is made up of a whole lot of RPMs. If you
    do not have a GUI tool like the YaST Control Center handy, you can still work
    with RPMs through the RPM commands. You have to type these commands at the shell
    prompt in a terminal window or a text console. Even if you don’t use the RPM commands
    to install or remove a package in SUSE Linux, you can still use the RPM commands
    to find out information about packages.


    # ## Using the RPM commands


    When you install an RPM-based distribution such as SUSE Linux, the installer uses
    the rpm command to unpack the packages (RPM files) and to copy the contents to
    your hard drive.


    You don’t have to understand the internal structure of an RPM file, but you need
    to know how to use the rpm command to work with RPM files. Here are some of the
    things you can do with the rpm command:


    +   - Find out the version numbers and other information about the RPMs installed
    on your system.

    +   - Install a new software package from an RPM. For example, you may install
    a package you skipped during the initial installation. You can do that with the
    rpm command.

    +   - Remove (uninstall) unneeded software you previously installed from an RPM.
    You may uninstall a package to reclaim the disk space, if you find that you rarely
    (or never) use the package.

    +   - Upgrade an older version of an RPM with a new one.

    +   - Verify that an RPM is in working order. You can verify a package to check
    that all necessary files are in the correct locations.


    As you can see, the rpm command is versatile — it can do a lot of different things,
    depending on the options you use.


    If you ever forget the rpm options, type the following command to see a list:


    ```

    ```bash

    rpm --help | more

    ```

    ```


    The number of rpm options will amaze you!'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Understanding RPM filenames


    An RPM contains a number of files, but it appears as a single file on your Linux
    system. By convention, the RPM filename has a specific format. A typical RPM filename
    looks like this:


    ```

    samba-3.0.20-3.i586.rpm

    ```


    This filename has the following parts, the first three of which are separated
    by dashes (-):


    +   - **Package name:** `samba`

    +   - **Version number:** `3.0.20`

    +   - **Release number:** `3`

    +   - **Architecture:** `i586` (this package is for Intel 80586 or Pentium-compatible
    processors)


    Usually, the package name is descriptive enough for you to guess what the RPM
    may contain. The version number is the same as that of the software package’s
    current version number. Developers assign the release number to keep track of
    changes. The architecture is i586 or noarch for the RPMs you want to install on
    a PC with an Intel Pentium or compatible processor.


    # Querying RPMs


    As it installs packages, the rpm command builds a database of installed RPMs.
    You can use the `rpm -q` command to query this database to find out information
    about packages installed on your system.


    For example, to find out the version number of an RPM installed on your system,
    type the following `rpm -q` command:


    ```

    rpm -q cups

    ```


    You see a response similar to the following:


    ```

    cups-1.1.23-16

    ```


    The response is the name of the RPM package. The name is the same as the RPM filename,
    except that the last part — `.i586.rpm` — isn’t shown. In this case, the version
    part of the RPM tells you that you have cups (the Common UNIX Printing System)
    version 1.1.21 installed.


    You can see a list of all installed RPMs by using the following command:


    ```

    rpm -qa

    ```'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'You see a long list of RPMs scroll by your screen. To view the list one screen
    at a time, type


    ```

    rpm -qa | more

    ```


    If you want to search for a specific package, feed the output of `rpm -qa` to
    the `grep` command. For example, to see all packages with `kernel` in their names,
    type


    ```

    rpm -qa | grep kernel

    ```


    The result depends on what parts of the kernel RPMs are installed on a system.


    You can query much more than a package’s version number with the `rpm -q` command.
    By adding single-letter options, you can find out other useful information. For
    example, try the following command to see the files in the `cups` package:


    ```

    rpm -ql cups

    ```


    Here are a few more useful forms of the `rpm -q` commands to query information
    about a package (to use any of these `rpm -q` commands, type the command, followed
    by the package name):


    +   - `rpm -qc`: Lists all configuration files in a package.

    +   - `rpm -qd`: Lists all documentation files in a package. These are usually
    the online manual pages (also known as *man pages*).

    +   - `rpm -qf`: Displays the name of the package (if any) to which a specified
    file belongs.

    +   - `rpm -qi`: Displays detailed information about a package, including version
    number, size, installation date, and a brief description.

    +   - `rpm -ql`: Lists all the files in a package. For some packages, you see
    a very long list.

    +   - `rpm -qs`: Lists the state of all files in a package (the state of a file
    can be one of the following: normal, not installed, or replaced).


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_301_0.png)


    These rpm commands provide information about installed packages only. If you want
    to find information about an uninstalled RPM file, add the letter `p` to the command
    line option of each command. For example, to view the list of files in the RPM
    file named `samba-3.0.20-3.i586.rpm`, go to the directory where that file is located
    and then type the following command:


    ```

    rpm -qpl samba-*.rpm

    ```


    Of course, this command works only if the current directory contains that RPM
    file.'
  merge: -1
  img_proc: true
- pgno: 302
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_302_0.png)


    Two handy rpm -q commands enable you to find out which RPM file provides a specific
    file and which RPMs need a specified package. To find out the name of the RPM
    that provides a file, use the following command:


    ```

    ```bash

    rpm -q --whatprovides filename

    ```

    ```


    For example, to see which RPM provides the file /etc/vsftpd.conf, type


    ```

    ```bash

    rpm -q --whatprovides /etc/vsftpd.conf

    ```

    ```


    RPM then prints the name of the package that provides the file, like this:


    ```

    ```text

    vsftpd-2.0.3-6

    ```

    ```


    If you provide the name of a package instead of a filename, RPM displays the name
    of the RPM package that contains the specified package.


    On the other hand, to find the names of RPMs that need a specific package, use
    the following command:


    ```

    ```bash

    rpm -q --whatrequires packagename

    ```

    ```


    For example, to see which packages need the openssl package, type


    ```

    ```bash

    rpm -q --whatrequires openssl

    ```

    ```


    The output from this command shows all the RPM packages that need the openssl
    package.


    # Installing an RPM


    To install an RPM, use the rpm -i command. You have to provide the name of the
    RPM file as the argument. If you want to view the progress of the RPM installation,
    use rpm -ivh. A series of hash marks (#) display as the package is unpacked. For
    example, to install an RPM file named samba-3.0.20-3.1586.rpm, go the directory
    where the file is located and then type the following command to install it:


    ```

    ```bash

    rpm -ivh samba-*.rpm

    ```

    ```


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_302_1.png)


    You don’t have to type the full RPM filename — you can use a few characters from
    the beginning of the name followed by an asterisk (*). Make sure you type enough
    of the name to identify the RPM file uniquely.


    If you try to install an RPM that’s already installed, the rpm -i command displays
    an error message.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# # Removing an RPM


    You may want to remove — uninstall — a package if you realize you don’t really
    need the software. For example, if you have installed the X Window System development
    package but discover you’re not interested in writing GUI applications, you can
    easily remove the package by using the `rpm -e` command.


    You have to know the name of the package before you can remove it. One good way
    to find the name is to use `rpm -qa` in conjunction with `grep` to search for
    the appropriate RPM file.


    For example, to remove the package named qt3-devel, type


    ```

    rpm -e qt3-devel

    ```


    To remove an RPM, you don’t need the full RPM filename; all you need is the package
    name — the first part of the filename up to the dash (`-`) before the version
    number.


    The `rpm -e` command does not remove a package that other packages need.


    # # Upgrading an RPM


    Use the `rpm -U` command to upgrade an RPM. You must provide the name of the RPM
    file that contains the new software. For example, if I have version 1.1.20 of
    cups (printing system) installed on my system but I want to upgrade to version
    1.1.21, I download the RPM file `cups-1.1.23-16.i586.rpm` from a repository and
    use the following command:


    ```

    rpm -U cups-1.1.23-16.i586.rpm

    ```


    The rpm command performs the upgrade by removing the old version of the cups package
    and installing the new RPM.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_303_0.png)


    Whenever possible, upgrade rather than remove the old package and install a new
    one. Upgrading automatically saves your old configuration files, which saves you
    the hassle of reconfiguring the software after a fresh installation.'
  merge: -1
  img_proc: true
