- pgno: 5
  md: '# Dedication


    I would like to dedicate this book to my wife, Leha, and daughters Ivy, Emily,
    and Ashley.


    # Author’s Acknowledgments


    I am grateful to Terri Varveris for getting me started on this book — a *For Dummies*
    guide about the up and coming SUSE Linux. As the project editor, Susan Christophersen
    guided me through the manuscript submission process and kept everything moving.
    Tiffany Franklin took care of the project while Terri was away on maternity leave.
    I appreciate the guidance and support that Terri, Tiffany, and Susan gave me during
    this project.


    I would like to thank Susan Douglas for reviewing the manuscript for technical
    accuracy and providing many useful suggestions for improving the book’s content.


    Thanks to everyone at Wiley Publishing for transforming my raw manuscript into
    this well-edited and beautifully packaged book.


    Of course, there would be no reason for this book if it were not for Linux. For
    this, we have Linus Torvalds and the legions of Linux developers around the world
    to thank. Thanks to Christian Egle, Andreas Jaeger, and others at Novell for helping
    me with information about SUSE Linux. Thanks to the openSUSE project for continuing
    to develop and enhance the SUSE Linux distribution and for making publicly available
    the ISO image used to create the DVD-ROM bundled with this book.


    Finally, and as always, my greatest thanks go to my wife, Leha, and our daughters,
    Ivy, Emily, and Ashley — it is their love and support that keeps me going. Thanks
    for being there!'
  merge: -1
  img_proc: true
