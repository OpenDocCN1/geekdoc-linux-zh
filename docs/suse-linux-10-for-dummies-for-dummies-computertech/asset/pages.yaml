    \ displays a list of keyboard maps — the language-dependent layouts for the keyboard.\n\
    \n+   8. **Select the keyboard language and press Enter.**\n+   \n+      The installer\
    \ displays the Main menu.\n\n+   9. **Use arrow keys to select Start Installation/System\
    \ and press Enter. On the next screen, select Start Installation/Update and press\
