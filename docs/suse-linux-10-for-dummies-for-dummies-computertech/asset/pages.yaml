- pgno: 111
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_111_0.png)


    After that first letter, the leftmost column shows a sequence of nine characters,
    which appear as rwxrwxrwx when each letter is present. Each letter indicates a
    specific permission. A hyphen (-) in place of a letter indicates no permission
    for a specific operation on the file. Think of these nine letters as three groups
    of three letters (rwx), interpreted as follows:


    +   - The leftmost group of rwx controls the *read*, *write*, and *execute* permissions
    of the file’s owner. In other words, if you see rwx in this position, the file’s
    owner can read (r), write (w), and execute (x) the file. A hyphen in the place
    of a letter indicates no permission. Thus the string rw-- means the owner has
    read and write permissions but no execute permission. Although executable programs
    (including shell programs) typically have execute permission, directories treat
    execute permission as equivalent to *use* permission — a user must have execute
    permission on a directory before he or she can open and read the contents of the
    directory.

    +   - The middle three rwx letters control the read, write, and execute permissions
    of any user belonging to that file’s group.

    +   - The rightmost group of rwx letters controls the read, write, and execute
    permissions of all other users (collectively referred to as the *world*).


    Thus, a file with the permission setting rwx------ is accessible only to the file’s
    owner, whereas the permission setting rwxr--r-- makes the file readable by the
    world.


    An interesting feature of the ls command is that it doesn’t list any file whose
    name begins with a period. To see these files, you must use the ls command with
    the -a option, as follows:


    ```

    ```bash

    ls -a

    ```

    ```


    Try this command in your home directory (and then compare the result with what
    you see when you don’t use the -a option):


    +   1. Type **cd** to change to your home directory.

    +   2. Type **ls -F** to see the files and directories in your home directory.

    +   3. Type **ls -aF** to see everything, including the hidden files.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_111_1.png)


    Most Linux commands take single-character options, each with a minus sign (think
    of this sign as a hyphen) as a prefix. When you want to use several options, type
    a hyphen and *concatenate* (string together) the option letters, one after another.
    Thus, ls -al is equivalent to ls -a -l as well as ls -l -a.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# Commands for working with files


    To copy files from one directory to another, use the cp command. For example,
    to copy the file /usr/X11R6/lib/X11/xinit/Xclients to the Xclients.sample file
    in the current directory (such as your home directory), type the following command:


    ```

    cp /usr/X11R6/lib/X11/xinit/xinitrc xinitrc.sample

    ```


    If you want to copy a file to the current directory but retain the original name,
    use a period (.) as the second argument of the cp command. Thus, the following
    command copies the Xresources file from the /etc/X11 directory to the current
    directory (denoted by a single period):


    ```

    cp /etc/X11/Xresources .

    ```


    The cp command makes a new copy of a file and leaves the original intact.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_112_0.png)


    If you want to copy the entire contents of a directory — including all subdirectories
    and their contents — to another directory, use the command cp -ar sourcdir destdir.
    (This command copies everything in the sourcdir directory to destdir.) For example,
    to copy all files from the /etc/X11 directory to the current directory, type the
    following command:


    ```

    cp -ar /etc/X11 .

    ```


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_112_1.png)


    To move a file to a new location, use the mv command. The original copy is gone,
    and a new copy appears at the destination. You can use mv to rename a file. If
    you want to change the name of today.list to old.list, use the mv command, as
    follows:


    ```

    mv today.list old.list

    ```


    On the other hand, if you want to move the today.list file to a subdirectory named
    saved, use this command:


    ```

    mv today.list saved

    ```


    An interesting feature of mv is that you can use it to move entire directories
    — with all their subdirectories and files — to a new location. If you have a directory
    named data that contains many files and subdirectories, you can move that entire
    directory structure to old_data by using the following command:


    ```

    mv data old_data

    ```


    To delete files, use the rm command. For example, to delete a file named old.list,
    type the following command:


    ```

    rm old.list

    ```'
  merge: -1
  img_proc: true
- pgno: 113
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_113_0.png)


    Be careful with the `rm` command — especially when you log in as `root`. You can
    inadvertently delete important files with `rm`.


    # Commands for working with directories


    To organize files in your home directory, you have to create new directories.
    Use the `mkdir` command to create a directory. For example, to create a directory
    named `Photos` in the current directory, type the following:


    ```

    mkdir Photos

    ```


    After you create the directory, you can use the `cd Photos` command to change
    to that directory.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_113_1.png)


    You can create an entire directory tree by using the `-p` option with the `mkdir`
    command. For example, suppose your system has a `/usr/src` directory and you want
    to create the directory tree `/usr/src/book/java/examples/applets`. To create
    this directory hierarchy, type the following command:


    ```

    mkdir -p /usr/src/book/java/examples/applets

    ```


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_113_2.png)


    When you no longer need a directory, use the `rmdir` command to delete it.


    You can delete a directory only when the directory is empty.


    To remove an empty directory tree, you can use the `-p` option, like this:


    ```

    rmdir -p /usr/src/book/java/examples/applets

    ```


    This command removes the empty parent directories of `applets`. The command stops
    when it encounters a directory that’s not empty.


    # Commands for finding files


    The `find` command is very useful for locating files (and directories) that meet
    your search criteria.


    When I began using UNIX many years ago (Berkeley UNIX in the early 1980s), I was
    confounded by the `find` command. I stayed with one basic syntax of `find` for
    a long time before graduating to more complex forms. The basic syntax that I discovered
    first was for finding a file anywhere in the file system. Here’s how it goes:
    Suppose you want to find any file or directory with a name that starts with `gnome`.
    Type the following `find` command to find these files:


    ```

    find / -name "gnome*" -print

    ```'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'If you’re not logged in as root, you may get a bunch of error messages. If
    these error messages annoy you, just modify the command as follows and the error
    messages are history (or, as UNIX aficionados say, “Send ’em to the bit bucket”):


    ```

    find / -name "gnome*" -print 2> /dev/null

    ```


    This command tells find to start looking at the root directory (/) for files that
    match that gnome*, and to display the full pathname of any matching file. The
    last part (2 > /dev/null) simply sends the error messages to a special file that’s
    the equivalent of simply ignoring them.


    You can use variations of this simple form of find to locate a file in any directory
    (as well as any subdirectories contained in the directory). If you forget where
    in your home directory you’ve stored all files named report* (names that start
    with report), you can search for the files by using the following command:


    ```

    find ~ -name "report*" -print

    ```


    When you become comfortable with this syntax of find, you can use other options
    of find. For example, to find only specific types of files (such as directories),
    use the type option. The following command displays all top-level directory names
    in your Linux system:


    ```

    find / -type d -maxdepth 1 -print

    ```


    You probably don’t have to use the complex forms of find in a typical Linux system
    — but if you ever need to, you can look up the rest of the find options by using
    the following command:


    ```

    man find

    ```


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_114_0.png)


    An easy way to find all files that match a name is to use the locate command that
    searches a periodically updated database of files on your system. For example,
    here’s a typical output I get when I type **locate Xresources** on a SUSE Linux
    system:


    ```

    /etc/X11/xdm/Xresources

    /etc/X11/Xresources

    /opt/kde3/share/config/kdm/Xresources

    /usr/X11R6/lib/X11/Xresources

    ```


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_114_1.png)


    The locate command isn’t installed by default in SUSE Linux, but it’s very easy
    to install. See Chapter 23 for information on how to use it.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# Commands for mounting and unmounting


    Suppose you want to access the files on this book’s companion DVD-ROM when you
    are logged in at a text console (with no GUI to help you). To do so, you have
    to first mount the DVD-ROM drive’s file system on a specific directory in the
    Linux file system.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_115_0.png)


    Type `more /etc/fstab` in a terminal window to look at the `/etc/fstab` file for
    clues to the names of devices such as a floppy drive and DVD/CD drive. SUSE Linux
    distributions use the device name `/dev/dvd/cdrom` to refer to DVD/CD-ROM drives,
    whereas for a DVD/CD-R drive (a CD or DVD burner), the device name is `/dev/cdrecorder`.
    The entry in the `/etc/fstab` file also tells you the directory where SUSE Linux
    mounts the DVD/CD drive. For a read-only DVD/CD-ROM drive, SUSE Linux uses `/media/cdrom`
    as the mount point, whereas for a DVD/CD-R drive, the mount point is `/media/cdrecorder`.


    Type **su -** to become root, insert the DVD-ROM in the DVD drive, and then type
    the following command in a text console or a terminal window:


    ```

    mount /dev/cdrom /media/cdrom

    ```


    This command mounts the file system on the device named `/dev/cdrom` on the `/media/cdrom`
    directory (which is also called the *mount point*) in the Linux file system.


    After the mount command successfully completes its task, you can access the files
    on the DVD-ROM by referring to the `/media/cdrom` directory as the top-level directory
    of the disc. In other words, to see the contents of the DVD-ROM, type


    ```

    ls -F /media/cdrom

    ```


    When you’re done using the DVD-ROM — and before you eject it from the drive —
    you have to unmount the disc drive with the following umount command:


    ```

    umount /dev/cdrom

    ```


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_115_1.png)


    You can mount devices on any empty directory on the file system. However, SUSE
    Linux has customary locations such as `/media/cdrom` and `/media/cdrecorder` for
    mounting DVD/CD drives.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Commands for checking disk-space usage


    I want to tell you about two commands — `df` and `du` — that you can use to check
    the disk-space usage on your system. These commands are simple to use. The `df`
    command shows you a summary of disk-space usage for all mounted devices. For example,
    here’s the result of typing `df` on one of my PCs running SUSE Linux:


    ```

    Filesystem             1K-blocks       Used Available Use% Mounted on

    /dev/hda11             6357688     1994348  4363340  32% /

    tmpfs                  124004          36   123968   1% /dev/shm

    /dev/hda7                43885       69749    31870  24% /boot

    /dev/hdc               6464234      664234        0 100% /media/cdrecorder

    ```


    The output is a table that lists the device, the total kilobytes of storage, how
    much is in use, how much is available, the percentage being used, and the mount
    point.


    To see the output of `df` in a more human-readable format, type **df -h**. Here
    is the output of the `df -h` command:


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_116_0.png)


    ```

    Filesystem             Size  Used Avail Use% Mounted on

    /dev/hda11             6.1G  2.0G  4.2G  32% /

    tmpfs                  122M  3.6K   122M   1% /dev/shm

    /dev/hda7              43M   9.6M    32M  24% /boot

    /dev/hdc              649M   649M     0  100% /media/cdrecorder

    ```


    If you compare this output with the output of plain `df` (see previous listing),
    you see that `df -h` prints the sizes with terms like M for megabytes and G for
    gigabytes. These are clearly easier to understand than 1K-blocks.


    The other command — `du` — is useful for finding out how much space a directory
    takes up. For example, type **du /etc/X11** to view the contents of all the directories
    in the `/etc/X11` directory. (This directory contains X Window System configuration
    files.) You end up with a list that looks similar to the following:


    ```

    4          /etc/X11/fs

    4          /etc/X11/twm

    84         /etc/X11/xdm/pixmaps

    153        /etc/X11/xdm

    372        /etc/X11/xkb/rules

    44         /etc/X11/xkb/types

    ... lines deleted ...

    40         /etc/X11/xstart

    4          /etc/X11/proxymngr

    2920       /etc/X11

    ```'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'Each directory name is preceded by a number — which tells you the number of
    kilobytes of disk space used by that directory. Thus the /etc/X11 directory, as
    a whole, uses 2920KB (or about 2.9MB) of disk space. If you simply want the total
    disk space used by a directory (including all the files and sub-directories contained
    in that directory), use the -s option and type du -s /etc/X11. The resulting output
    is as follows:


    ```

    ```text

    2920    /etc/X11

    ```

    ```


    The -s option causes du to print just the summary information for the entire directory.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_117_0.png)


    Just as df -h prints the disk-space information in megabytes and gigabytes, you
    can use the du -h command to view the output of du in a more human-readable form.
    For example, to see the space that I’m using in my home directory (/home/naba),
    I type du -sh /home/naba. Here’s a sample output from that command that tells
    me that I am using 44GB of space:


    ```

    ```text

    44G    /home/naba

    ```

    ```'
  merge: -1
  img_proc: true
