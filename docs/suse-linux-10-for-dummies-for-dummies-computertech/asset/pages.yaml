- pgno: 339
  md: '# Chapter 21


    # The Ten Best Things about SUSE


    # *In This Chapter*


    +   - YaST

    +   - Great hardware detection

    +   - Easy installation

    +   - YaST Online Update (YOU)

    +   - Automatic mounting of Windows partition and USB memory stick

    +   - Auto-login at the KDE desktop

    +   - Support for laptops (power management)

    +   - Easy access to Windows shares

    +   - Cute gecko mascot

    +   - SUSE’s increasing popularity


    I am often asked by friends and acquaintances what’s so great about SUSE Linux
    and why should they consider using it (or perhaps switch to it from another Linux
    distribution). I have gotten into the habit of listing what you might call the
    selling points of SUSE Linux. When I began writing this book, I decided to list
    some of these points in a chapter in the obligatory Parts of Them that adorns
    every For Dummies book. This is that chapter — with a list of what I think are
    the ten best things about SUSE.


    # YaST — The Super Sysadmin Tool


    One of the best things about SuSE Linux is YaST — Yet Another Setup Tool — the
    system setup and configuration tool that makes SUSE Linux easy to install and
    maintain. If you have installed SUSE Linux, you have already used YaST. For any
    sysadmin task from configuring hardware to installing new software, YaST is the
    tool you use.


    You typically encounter YaST in the form of the YaST Control Center — a GUI tool
    from which you can launch various other YaST modules that are meant for specific
    tasks such as installing software, configuring hardware, managing'
  merge: -1
  img_proc: true
- pgno: 340
  md: 'a network, or setting up security. In Chapter 17, I introduce the YaST Control
    Center and the various sysadmin tasks you can perform through the control center.


    If you are at a text console, you can still use YaST — through its command line.
    For example, to install an RPM from a command-line, type **/sbin/yast -i** followed
    by the name of an RPM package.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_340_0.png)


    YaST used to be proprietary software, but in 2004, Novell released YaST under
    the GNU General Public License (GPL) — the same open source license that governs
    Linux itself.


    # Detects All Hardware

    (Well, Nearly All!)


    One of the best things about SUSE Linux is that it detects nearly all hardware
    during installation and setup. For all detected hardware, SUSE Linux loads any
    drivers needed to access the hardware and takes care of any configuration steps
    such as adding entries in the `/etc/fstab` configuration file and creating subdirectories
    in the `/media` directory where a storage device could be mounted. The excellent
    hardware detection means that you can usually install SUSE Linux on most PCs without
    any trouble.


    If you add hardware after you install SUSE Linux, you can connect the hardware
    to the PC, power it on, and then run the appropriate hardware configuration module
    from the YaST Control Center (see Chapter 17 for more on the YaST Control Center).


    # Smooth and Easy Installation


    SUSE Linux installation is neither oversimplified nor unnecessarily complex —
    it’s just right. With its hardware detection capabilities and the YaST GUI tool,
    an average user can easily handle the SUSE Linux installation. The installer makes
    easy even a potentially complex step such as resizing the Windows partition on
    the hard drive to make room for SUSE Linux. All you have to do is indicate the
    size of the Windows partition, and the installer takes care of shrinking the size
    of the partition.


    Instead of guiding the user through a set sequence of installation screens, the
    installer presents all the options in a single screen. Then all you need to change
    are the items that need changing such as the time zone and maybe the software
    selection between the KDE or GNOME desktop. The installer handles all other configurations
    after installing the minimal system and rebooting. All in all, SUSE Linux installation
    is smooth and easy.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# # I Love YOU — YaST Online Update


    YaST Online Update, or YOU for short, makes it easy to keep your SUSE Linux system
    updated. All you need is a high-speed Internet connection. You can then download
    the latest software updates from an online server of your choice. You can set
    it up to automatically download and install updates or just download and then
    you can manually install the updates. I describe YOU in Chapter 18.


    # ## Automatic Mounting of My Windows Partitions and USB Memory Stick


    If you have Windows partitions, SUSE Linux automatically mounts them so you can
    easily access files in your Windows partition. For example, in a dual boot Windows
    XP/SUSE Linux system, you probably find the Windows XP partition mounted at /windows
    directory in the Linux file system. If for some reason Linux does not mount the
    Windows XP partition automatically, you can become root by typing su - and then
    mount it by typing mount /dev/hda2 /windows because the Windows XP partition is
    usually the second partition on the hard drive (of course, this applies only if
    your PC has Windows XP installed).


    When you plug in a USB memory stick into a USB port, SUSE Linux detects it and
    mounts it in a directory in the /media directory. After plugging in, you can access
    a USB memory stick by clicking the My Computer icon on the desktop and then clicking
    the hard drive icon labeled /dev/sda1 — that’s the device name assigned to the
    USB memory stick.


    # ## Automatic Login at the KDE Desktop


    Automatically logging in to the KDE desktop is not good for security, but it’s
    convenient when your SUSE Linux system is in a secure environment such as your
    home. After you boot the system, SUSE Linux automatically logs you in, and you
    can start at the KDE desktop.


    By the way, if you are in an office with other people and want to turn this feature
    off, choose Main Menu➜Control Center from the KDE desktop. Then choose System
    Administration➜Login Manager. Click Administrator Mode and enter the root password.
    Then click the Convenience tab and click to turn off the Enable Auto-Login check
    box.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# Good Support for Laptops


    SUSE Linux continues to improve upon some features that are important to laptop
    users. When you run your laptop on its battery, you want to conserve power by
    shutting down various parts of the system when you are not doing work. SUSE Linux
    can do this through its support for ACPI (Advanced Configuration and Power Interface).
    You can access the power management module from an icon on the panel (it’s the
    icon that looks like an electrical plug). From this module’s menu, you can see
    how much battery life is remaining and suspend the system to the disk so that
    you can resume later without having to go through a lengthy system reboot.


    # Easy Browsing of Windows Shares


    Click Network Browsing on the KDE desktop in your SUSE Linux system and the network
    browser automatically detects and shows you the Windows workgroups in your local
    area network. You can then browse the shared folders by clicking on a workgroup
    and then on icons for specific Windows PCs. You can easily copy documents from
    the Windows shares to your SUSE Linux system or open them using Linux software
    such as OpenOffice.org Writer.


    # That Cute Gecko Mascot


    You know what I mean. Take a look at the KDE or GNOME desktop (or go to `www.suse.com`)
    and you can see the cute gecko mascot that has come to represent SUSE Linux the
    world over. Good thing Novell didn’t do anything to the mascot after acquiring
    SUSE. You have to agree — it’s a cute mascot.


    # SUSE’s Increasing Popularity


    Don’t you just love to be part of a trend? I do. SUSE is on the rise, and we can
    ride high — at least, while the ride lasts. SUSE Linux is already popular in Europe
    and is continuing to improve. SUSE Linux’s fortunes are on the rise following
    Novell’s acquisition of Germany’s SUSE Linux AG and the creation of the openSUSE
    project (`www.opensuse.org`) — an open source project sponsored by Novell in which
    a community of developers, end users, and other open source enthusiasts can participate
    and continue to evolve SUSE Linux. All these recent developments have generated
    a distinct “buzz” around SUSE Linux as the up-and-coming Linux distribution for
    everyone from home users to enterprise servers. And the nice thing is that you
    and I — we — are part of the crowd that’s contributing to SUSE’s popularity.'
  merge: -1
  img_proc: true
