- pgno: 73
  md: 'digital files or some media such as CD or DVD. I also include in the multimedia
    category those applications related to creating multimedia, such as video editors
    or CD/DVD burners. SUSE Linux comes with a good complement of multimedia applications.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_73_0.png)


    When it comes to playing multimedia — audio and video in various formats such
    as MP3, MPEG, and QuickTime — freely available Linux distributions (including
    SUSE Linux on this book’s companion DVD) rarely come with the appropriate decoders
    because of licensing restrictions on some of these decoders. The end result is
    that the multimedia application runs, but it can’t play the MP3 file or the DVD
    movie because it lacks a decoder. Commercial versions of SUSE Linux usually come
    with some of these decoders.


    Table 4-3 summarizes typical multimedia applications in SUSE. I describe some
    of these multimedia applications in detail in Chapter 14.


    | Table 4-3 | Typical Multimedia Applications on GNOME and KDE Desktops | |

    |---|---|---|

    | **Application Category** | **GNOME Desktop** | **KDE Desktop** |

    | CD player | GNOME CD Player | KsCD |

    | CD ripper | Grip | |

    | Audio player | Rhythmbox | amarok, juK |

    | CD/DVD burner | Gnome CD/DVD Creator | K3b |

    | Video player (needs separate decoders) | Totem Movie Player | Kaffeine |

    | Video editor | Kino | |

    | TV player (needs TV card) | kdetv | kdetv |


    Here is a summary of what you can do with these multimedia applications:


    +   - **CD player** applications enable you to play audio CDs on your SUSE Linux
    system. All you have to do is pop an audio CD into the CD/DVD drive and use one
    of these applications to play songs from the CD.

    +   - **CD ripper** applications are for ripping (extracting) songs from audio
    CDs and converting them to a digital format such as MP3. You can rip songs from
    CDs and organize a digitized version of your CD collection. You can play the MP3
    files using an audio player application or by downloading them into a portable
    MP3 player such as Apple iPod or other similar products. To convert ripped songs
    into MP3 format, you need an MP3 encoder that is not included with SUSE Linux.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '+   - **Audio player** applications are used to play digital music stored in
    files in various formats such as MP3 or Ogg Vorbis (a patent- and royalty-free
    compressed audio file format). You can use amaroK as the audio player in KDE and
    Rhythmbox in GNOME.

    +   - **CD/DVD burner** applications enable you to use your CD/DVD-R (recordable)
    drive to burn CDs or DVDs. With these applications you can typically burn audio
    CDs, data CDs and DVDs, as well as CDs or DVDs from ISO image files. The GNOME
    desktop’s Nautilus file manager is capable of burning CDs and DVDs.

    +   - **Video player** applications are for playing movies stored in MPEG files
    as well as playing DVD movies. Unfortunately, these applications need video decoders
    to decode the data from DVD movies or different format video files. Such decoders
    for DVDs are not available for Linux.

    +   - **Video editors** enable you to edit digital video files. The GNOME desktop
    comes with the kino video editor, which can capture video over a Firewire interface
    and provide the ability to edit the video.

    +   - **TV player** applications enable you to watch a TV program on your SUSE
    Linux desktop, provided your PC has a TV card (a hardware device capable of receiving
    TV signals) installed. Both KDE and GNOME desktops offer the kdetv application
    as the TV player.


    # Cataloging the Image and

    Graphics Applications


    When I talk about images and graphics, I mean applications that are meant to work
    with photographs or other images and those that enable you to prepare vector drawings
    — drawings consisting of lines and shapes — for use in various types of documents.
    SUSE Linux includes a number of such image and graphics applications. You can
    find these applications in the Main Menu > Graphics menu.


    Table 4-4 summarizes the image and graphics applications in GNOME and KDE desktops.
    I describe these applications in detail in Chapter 15.


    | Application Category | GNOME Desktop | KDE Desktop |

    |---|---|---|

    | Photo or image editor | The GIMP | The GIMP |

    | Digital camera interface |  | digikam |'
  merge: -1
