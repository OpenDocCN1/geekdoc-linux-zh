- pgno: 245
  md: '# Chapter 15


    # Working with Photos and Images


    # In This Chapter


    +   - Downloading photos from a digital camera

    +   - Scanning photos and documents

    +   - Manipulating images

    +   - Viewing images

    +   - Viewing PDF and PostScript files


    Digital cameras are all the rage nowadays. Your SUSE Linux system is the perfect
    place to download the photos, view them, and, if necessary, touch up the photos.
    You can also scan photographs or documents, provided you have a scanner attached
    to your PC (typically through the USB port).


    SUSE Linux includes applications for working with digital cameras and scanners
    as well as editing images. You can use a camera application to download photos
    from your digital camera or simply access the camera as a USB mass storage device
    (just like another hard drive). The scanner application called Kooka enables you
    to easily scan hardcopy photos or documents and then use the images just like
    your digital photos.


    Both KDE and GNOME desktops come with The GIMP (GNU Image Manipulation Program)
    — an application that enables you to view and perform image-manipulation tasks,
    such as photo retouching, image composition, and image creation.


    For simply viewing your digital photos, you can use image viewers such as Gwenview
    in KDE and Eye of Gnome in GNOME. For reading PDF files or PostScript files, you
    can use KGhostview in KDE and GNOME PDF viewer and GGV PostScript viewer in GNOME.
    Both KDE and GNOME also include the well-known Adobe Acrobat Reader.


    As you can see, SUSE Linux is no slouch when it comes to working with digital
    photos and image files of all kinds. In this chapter, I introduce you to many
    of the image-processing applications in SUSE Linux.'
  merge: -1
  img_proc: true
- pgno: 246
  md: "# Downloading Photos from  \na Digital Camera\n\nThe KDE desktop comes with\
    \ a digital camera application called Digikam that you can use to download pictures\
    \ from digital cameras as well as organize your photos in albums for easy viewing.\
    \ Digikam works with many different makes and models of digital cameras. Depending\
    \ on the model, the cameras can connect to the serial port or the Universal Serial\
    \ Bus (USB) port.\n\nTo use Digikam with your digital camera, follow these steps:\n\
    \n+   1. **Connect your digital camera to the serial port or USB port (whichever\
    \ interface the camera supports) and turn on the camera.**\n\n+   2. **Start Digikam\
    \ by choosing Main Menu→Graphics→Photograph from the KDE desktop.**\n\nDigikam’s\
    \ main window appears. If this is the first time, Digikam prompts you for a location\
    \ where you want to keep your photos. Select a folder in your home directory and\
    \ click OK. (Note that if your digital camera is configured as a USB mass storage\
    \ device, a dialog box asks whether you want to access it with the Konqueror file\
    \ manager.)\n\n+   3. **From the Digikam menu, choose Settings→Configure Digikam.**\n\
    \nA configuration dialog box appears.\n\n+   4. **Click the Cameras icon in the\
    \ dialog box and click Auto-Detect. After the camera is detected, click OK.**\n\
    \nIf your camera is supported and the camera is configured to be in PTP (Picture\
    \ Transfer Protocol) mode, the camera is detected (see Figure 15-1 for an example).\
    \ If not, you can get the photos from your camera by using an alternate method\
    \ that I describe after these steps.\n\n+   5. **Select your camera model from\
    \ the Camera menu.**\n\nA new window appears and, after a short while, displays\
    \ thumbnails of the photos in the camera, as shown in Figure 15-2.\n\n+   6. **Click\
    \ the thumbnails to select the images you want to download; then choose Download→Download\
    \ Selected to download the images. To download all images, choose Download→Download\
    \ All.**\n\nDigikam then downloads the images to an album (you have to select\
    \ an existing album or create a new one). You can view the photos in Digikam and\
    \ edit the photos in the GIMP or your favorite photo editor."
  merge: -1
  img_proc: true
- pgno: 247
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_247_0.png)


    **Figure 15-1:** After connecting your digital camera, click Auto-Detect in this
    dialog box.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_247_1.png)


    **Figure 15-2:** Digikam displays the thumbnails of the photos in the camera.'
  merge: -1
