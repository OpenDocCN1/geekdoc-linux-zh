  md: "![](img/b7e91b81e0d84c8a5261ee14a48991b2_157_0.png)\n\nAs Figure 9-1 shows,\
    \ a URL has the following parts:\n\n+   ✓ **Protocol:** Name of the protocol that\
    \ the Web browser uses to access the data from the file URL specifies. In Figure\
    \ 9-1, the protocol is `http://`, which means that the URL specifies the location\
    \ of a Web page. Here are some of the common protocol types and their meanings:\n\
    +   \n+   - `file://` means the URL is pointing to a local file. You can use this\
    \ URL to view HTML files without having to connect to the Internet. For example,\
    \ `file:///srv/www/html/index.html` opens the file `/srv/www/html/index.html`\
    \ from your Linux system.\n+   \n+   - `ftp://` means that you can download a\
    \ file using the File Transfer Protocol (FTP). For example, `ftp://ftp.purdue.edu/pub/uns/NASA/nasa.jpg`\
    \ refers to the image file `nasa.jpg` from the `/pub/uns/NASA` directory of the\
    \ FTP server `ftp.purdue.edu`. If you want to access a specific user account via\
    \ FTP, use a URL in the following form:\n+   \n+     `ftp://username:password@ftp.somesite.com/`\n\
    +   \n+     with the username and password embedded in the URL. (Note that the\
    \ password is in plain text and not secure.)\n+   \n+   - `http://` means that\
    \ the file is downloaded using the Hypertext Transfer Protocol (HTTP). This protocol\
    \ is the well-known format of URLs for all Web sites, such as `http://www.novell.com`\
    \ for Novell’s home page. If the URL does not have a filename, the Web server\
    \ sends a default HTML file named `index.html`. (That’s the default filename for\
    \ the popular UNIX-based Apache Web servers; Microsoft Windows Web servers use\
    \ a different default filename.)\n+   \n+   - `https://` specifies that the file\
    \ is accessed through a Secure Sockets Layer (SSL) connection—a protocol designed\
    \ by Netscape Communications for encrypted data transfers across the Internet.\
    \ This form of URL is typically used when the Web browser sends sensitive information\
    \ (such as a credit card number, user-name, and password) to a Web server. For\
    \ example, a URL such as\n+   \n+     `https://some.site.com/secure/takeorder.html`"
  merge: -1
  img_proc: true
- pgno: 158
  md: "may display an HTML form that requests credit card information and other personal\
    \ information (such as name, address, and phone number).\n\n+   - **mailto://**\
    \ specifies an e-mail address that you can use to send an e-mail message. This\
    \ URL opens your e-mail program from where you can send the message. For example,\
    \ `mailto:webmaster@someplace.com` refers to the Webmaster at the host `someplace.com`.\n\
    +   \n+   - **news://** specifies a newsgroup that you can read by means of the\
    \ Network News Transfer Protocol (NNTP). For example,\n+   \n+     `news://newsgroups.comcast.net/comp.os.linux.setup`\n\
    +   \n+     accesses the `comp.os.linux.setup` newsgroup at the news server `newsgroups.comcast.net`.\
    \ If you have a default news server configured for the Web browser, you can omit\
    \ the news server’s name and use the URL `news:comp.os.linux.setup` to access\
    \ the newsgroup.\n\n+   - **Domain name:** Contains the fully qualified domain\
    \ name of the computer that has the file this URL specifies. You can also provide\
    \ an IP address in this field. The domain name is not case-sensitive.\n+   \n\
    +   - **Port:** Port number that is being used by the protocol listed in the first\
    \ part of the URL. This part of the URL is optional; all protocols have default\
    \ ports. The default port for HTTP, for example, is 80. If a site configures the\
    \ Web server to listen to a different port, the URL has to include the port number.\n\
    +   \n+   - **Directory path:** Directory path of the file being referred to in\
    \ the URL. For Web pages, this field is the directory path of the HTML file. The\
    \ directory path is case-sensitive.\n+   \n+   - **Filename:** Name of the file.\
    \ For Web pages, the filename typically ends with `.htm` or `.html`. If you omit\
    \ the filename, the Web server returns a default file (often named `index.html`).\
    \ The filename is case-sensitive.\n+   \n+   - **HTML anchor:** Optional part\
    \ of the URL that makes the Web browser jump to a specific location in the file.\
    \ If this part starts with a question mark (?) instead of a hash mark (#), the\
    \ browser takes the text following the question mark as a query. The Web server\
    \ returns information based on such queries.\n\n# Web servers and Web browsers\n\
    \nThe Web server serves up the Web pages, and the Web browser downloads them and\
    \ displays them to the user. That’s pretty much the story with these two cooperating\
    \ software packages that make the Web work."
