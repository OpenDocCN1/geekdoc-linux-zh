- pgno: 95
  md: '# Chapter 6


    # # Finding and Organizing Files


    # _In This Chapter_


    +   - Understanding how Linux organizes files

    +   - Navigating the file system with Linux commands

    +   - Understanding file permissions

    +   - Manipulating files and directories with Linux commands


    To use files and directories well, you need to understand the concept of a hierarchical
    file system. Even if you use the GUI file managers to access files and folders
    (folders are also called _directories_), you can benefit from a file system that
    gives you the lay of the land.


    In this chapter, I introduce you to the Linux file system, and you discover how
    to work with files and directories with several Linux commands.


    # ## Figuring Out the Linux File System


    As with any other operating system, Linux organizes information in files and directories.
    Directories, in turn, hold the files. A _directory_ is a special file that can
    contain other files and directories. Because a directory can contain other directories,
    this method of organizing files gives rise to a hierarchical structure. This hierarchical
    organization of files is called the _file system_.


    The Linux file system gives you a unified view of all storage in your PC. The
    file system has a single root directory, indicated by a forward slash (/). Within
    the root directory is a hierarchy of files and directories. Parts of the file
    system can reside in different physical media, such as a hard drive, floppy disk,
    and CD-ROM. Figure 6-1 illustrates the concept of the Linux file system (which
    is the same in any Linux system whether it’s SUSE, Red Hat, or what have you)
    and how it spans multiple physical devices.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_96_0.png)


    **Figure 6-1:** The Linux file system provides a unified view of your storage
    that may span multiple storage devices.


    If you’re familiar with MS-DOS or Windows, you may find something missing in the
    Linux file system: You don’t find drive letters such as C: and D: in Linux. All
    disk drives and CD-ROM drives are part of a single file system.


    In Linux, filenames can be long (up to 256 characters) and are case-sensitive.
    Often these filenames have multiple extensions, such as `sample.tar.Z`. UNIX filenames
    can take many forms, such as the following: `index.html`, `Makefile`, `XF86Config.install.old`,
    `vsftpd-2.0.1-2.i386.rpm`, `.bash_profile`, and `apache2_src.tar.gz`.


    To locate a file, you need more than just the filename. You also need information
    about the directory hierarchy. The extended filename, showing the full hierarchy
    of directories leading to the file, is called the pathname. As the name implies,
    it’s the path to the file through the maze of the file system. Figure 6-2 shows
    a typical pathname for a file in Linux.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_97_0.png)


    As Figure 6-2 shows, the pathname has the following parts:


    +   - The root directory, indicated by a forward slash (`/`) character.

    +   - The directory hierarchy, with each directory name separated from the previous
    one by a forward slash (`/`) character. A `/` appears after the last directory
    name.

    +   - The filename, with a name and one or more optional extensions. (A period
    appears before each extension.)


    The Linux file system has a well-defined set of top-level directories, and some
    of these directories have specific purposes. Finding your way around the file
    system is easier if you know the purpose of these directories. You also become
    adept at guessing where to look for specific types of files when you face a new
    situation. Consult Table 6-1 for a brief description of the top-level directories
    in the Linux file system.


    **Table 6-1 — Top-level Directories in the SUSE Linux File System**


    | Directory | Description |

    |---|---|

    | `/` | This root directory forms the base of the file system. All files and directories
    are contained logically in the root directory, regardless of their physical locations.
    |

    | `/bin` | Contains the executable programs that are part of the Linux operating
    system. Many Linux commands, such as `cat`, `cp`, `ls`, `more`, and `tar`, are
    located in `/bin`. |

    | `/boot` | Contains the Linux kernel and other files that the GRUB boot manager
    needs. (The kernel and other files can be anywhere, but placing them in the `/boot`
    directory is customary.) |

    | `/dev` | Contains special files that represent devices attached to the system.
    |'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Table 6-1 *(continued)*


    | Directory | Description |

    |---|---|

    | `/etc` | Contains most system configuration files and the initialization scripts
    (in the `/etc/rc.d` subdirectory). |

    | `/home` | Conventional location of the home directories of all users. User naba’s
    home directory, for example, is `/home/naba`. |

    | `/lib` | Contains library files for all programs stored in `/sbin` and `/bin`
    directories (including the loadable driver modules) needed to start Linux. |

    | `/media` | A directory for mounting file systems on removable media, such as
    CD-ROM drives, floppy disks, and Zip drives. Contains the `/media/floppy` directory
    for mounting floppy disks and the `/media/cdrom` directory for mounting the CD-ROM
    drive. If you have a CD recorder, you’ll find a `/media/cdrecorder` directory
    instead of `/media/cdrom`. |

    | `/mnt` | A directory for temporarily mounted file systems. |

    | `/opt` | Provides a storage area for large application software packages. For
    example, GNOME and KDE applications are installed in the `/opt` directory. |

    | `/proc` | A special memory-resident directory that contains various information
    about the processes running in the Linux system. |

    | `/root` | The home directory for the root user. |

    | `/sbin` | Contains executable files representing commands typically used for
    system-administration tasks and used by the root user. Commands such as `halt`
    and `shutdown` reside in the `/sbin` directory. |

    | `/srv` | Contains data for services (such as Web and FTP) offered by this system.
    |

    | `/sys` | A special directory that contains information about the devices, as
    seen by the Linux kernel. |

    | `/tmp` | A temporary directory that any user can use as a *scratch* directory,
    meaning that the contents of this directory are considered unimportant and usually
    are deleted every time the system boots. |

    | `/usr` | Contains the subdirectories for many important programs, such as the
    X Window System (in the `/usr/X11R6` directory) and the online manual. |

    | `/var` | Contains various system files (such as logs), as well as directories
    for holding other information, such as files for printers and mail messages. |'
  merge: -1
  img_proc: true
