- pgno: 208
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_208_0.png)


    # Preparing documents in Writer


    You’ll have no problem preparing documents using Writer. Typically, you can simply
    click to position a cursor and then type your text. To format text, select a style
    for the paragraph or select text and then apply formatting such as boldface or
    italics. In the following sections, I provide some quick tips on how to perform
    specific document-preparation tasks in Writer. I organize the tips into the following
    categories of tasks:


    +   - ✓ Editing and reviewing documents

    +   - ✓ Using styles and templates

    +   - ✓ Performing page layout

    +   - ✓ Creating and inserting graphics

    +   - ✓ Using fields

    +   - ✓ Working with large documents


    # Editing and reviewing documents


    To edit a document, you have to open the file, move around within the document,
    insert and delete text, and save the file. You can perform most of these tasks
    intuitively because these steps are similar in most word processors. For that
    reason, I don’t discuss in detail how to perform each of these tasks. Instead,
    in the following paragraphs, I highlight just a couple of features that you’ll
    find particularly useful in your work.'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'Typically, you review changes when you collaborate with others on a document
    and several of you make revisions to the document. To review changes, the changes
    have to be tracked. Writer has features to enable change tracking (or redlining,
    as it’s commonly called). With Writer, you can examine the changes, accept or
    reject each change, and make more editing changes — even adding comments to explain
    why you made a change.


    Writer has other features for easily editing a document. For example, you can
    search and replace text — even find all occurrences of text with a specific formatting
    style and change each occurrence.


    Most of Writer’s editing and change-tracking functions are in the Edit menu (shown
    in Figure 12-3). Some toolbar icons provide shortcuts to the menu.


    You can perform many editing tasks by clicking the toolbar icons. Just mouse over
    each icon and read the tooltips to see which ones enable you to make specific
    editing and reviewing changes.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_209_0.png)


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_209_1.png)


    **Figure 12-3:** Perform most editing and reviewing tasks from the Edit menu and
    its submenus.'
