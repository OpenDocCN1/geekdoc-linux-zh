- pgno: 55
  md: "# Chapter 3\n\n# Starting SUSE for the First Time\n\n+   _In This Chapter_\n\
    +   \n+   - Powering up SUSE Linux\n+   - Logging in\n+   - Checking out the GUI\
    \ desktops\n+   - Playing with the shell\n+   - Shutting down\n\nYou’re sitting\
    \ in front of your PC about to turn it on. You know that the PC has SUSE Linux\
    \ installed. You’re wondering what to expect when you turn it on and what you\
    \ do afterward. Not to worry. If you’re using SUSE Linux for the first time, this\
    \ chapter shows you how to log in, check out the graphical desktops, try out some\
    \ cryptic Linux commands, and finally, shut down the PC.\n\nIf this quick tour\
    \ of SUSE Linux seems hurried, don’t worry; I cover everything at a slower pace\
    \ and with more details in later chapters.\n\nFor those of you who already know\
    \ something about SUSE Linux, flip through this chapter to see if anything looks\
    \ new. You never know what you may not know!\n\n# Powering Up SUSE Linux\n\nWhen\
    \ you power up the PC, it goes through the normal power-up sequence and loads\
    \ the boot loader — called GRUB. The boot loader is a tiny computer program that\
    \ loads the rest of the operating system from the hard drive into the computer’s\
    \ memory. The whole process of starting up a computer is called _booting_.\n\n\
    The GRUB boot loader displays a graphical screen with the names of the operating\
    \ systems that the boot loader can load. For example, if your PC has"
  merge: -1
  img_proc: true
- pgno: 56
  md: 'both Microsoft Windows and SUSE Linux installed on the hard drive, you see
    both names listed. Use the up- and down-arrow keys to select the operating system
    you want to use and press Enter. If the PC is set up to load SUSE Linux by default,
    you don’t have to do anything — after a few seconds the boot loader starts SUSE
    Linux.


    You see a graphical boot screen that shows information about the progress of the
    system startup. If you selected KDE as your desktop and enabled automatic login
    during installation, you are automatically logged in and you get a KDE desktop
    similar to the one shown in Figure 3-1. By the way, SUSE Linux logs you in using
    the normal user account that you set up during installation. If you selected GNOME
    as your desktop, then you are logged in to a GNOME desktop.


    If Automatic Login is not enabled for any user, you get a graphical login screen.
    You can log in using the account you defined during the installation. Type the
    username and press Enter. When prompted for it, type the password and press Enter.
    You then see the initial GNOME graphical user interface (GUI — pronounced *gooey*
    for short) appear.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_56_0.png)


    You should not normally log in as `root`. When you log in as `root`, you could
    accidentally damage your system because you can do anything when you’re `root`.
    Always log in as a normal user. When you need to perform any task as `root`, type
    `su -` in a terminal window and enter the root password. Graphical system administration
    tools such as YaST prompt for the `root` password when needed.


    # ## Getting GUI


    When you install SUSE Linux, you can install one of two GUI desktops — GNOME or
    KDE. I provide a quick look at both KDE and GNOME desktops in this section.


    Figures 3-1 and 3-2 provide a snapshot of KDE and GNOME desktops, respectively.
    In these figures, I point out the major components of each desktop.'
  merge: -1
  img_proc: true
