- pgno: 51
  md: "As YaST installs the software packages, it displays a slide that introduces\
    \ various features of SUSE Linux. After the base installation is complete, YaST\
    \ installs the boot loader and reboots the system.\n\n# Completing the SUSE Linux\
    \ configuration\n\nAfter the initial SUSE Linux system boots, YaST starts again\
    \ and guides you through the remaining SUSE Linux installation and configuration\
    \ steps, as follows:\n\n+   1. **Enter the password for the root user and click\
    \ Next.**\n+   \n+      The root user is the administrator account that you can\
    \ use to do anything on the SUSE Linux system — from installing software to adding\
    \ new user accounts.\n+   \n+   2. **Accept or change the network configuration.**\n\
    +   \n+      YaST displays the current network settings (see the example in Figure\
    \ 2-7). If the settings are correct (usually it's safe to assume that they are\
    \ correct), you can simply click Next to continue.\n+   \n+   3. **Test the Internet\
    \ connection and update the system with the YaST Online Update (YOU) service.\
    \ Then click Next.**\n\n![](img/b7e91b81e0d84c8a5261ee14a48991b2_51_0.png)"
  merge: -1
  img_proc: true
- pgno: 52
  md: '# **4. Select the user authentication method and click Next.**


    You can select local authentication based on passwords or network authentication.
    For network authentication methods, you have to select one of three network authentication
    methods — NIS (Network Information System), LDAP (Lightweight Directory Access
    Protocol), or Samba (Windows network). Typically, most PCs use local authentication
    method. (Using this method simply means that the user accounts are authenticated
    on the PC and not by checking with another server on the network.)


    # **5. Add a new local user by entering the username, password, and other settings
    (Figure 2-8). Click Next to continue.**


    The Automatic Login check box is active if you are the only user on the system
    and if you use KDE as the default desktop. If you mark the Automatic Login check
    box (when it''s not grayed out), SUSE Linux automatically logs in this user when
    it starts. Also, if you are the only user of this system, mark the Receive System
    Mail check box. That way mail intended for the root user would be delivered to
    your user account. Some programs send mail to root with information about any
    errors or problems. By receiving the system mail, you will be in the loop when
    it comes to any important system messages.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_52_0.png)


    **Figure 2-8:** Enter information for a local user account and click Next.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '+   6. **Read the release notes and click Next.**


    The release notes contain last-minute information about the SUSE Linux distribution,
    including any known problems and workarounds. It’s worth glancing through so that
    you know about anything that might apply to your PC’s hardware configuration.
    When you click Next, YaST detects all of your PC’s hardware and displays a summary
    (Figure 2-9).


    +   7. **Accept or change the displayed hardware configuration for your PC (Figure
    2-9) and click Next.**


    The hardware configuration includes information about specific hardware such as
    your graphics card, monitor, sound card, printing system, and so on. Typically,
    the displayed configuration should be acceptable, but you should check each of
    the items. In particular, check the graphics card configuration to see if YaST
    correctly detected the monitor and graphics card. If not, you can make changes
    by clicking Graphics Cards (see Figure 2-9) and changing the information in a
    subsequent window. After the configuration steps are complete, YaST informs you
    that the installation is complete, as shown in Figure 2-10.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_53_0.png)


    **Figure 2-9:** Accept or change hardware configuration and click Next.'
  merge: -1
  img_proc: true
