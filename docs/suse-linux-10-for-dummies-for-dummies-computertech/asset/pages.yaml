- pgno: 210
  md: '# Using styles and templates


    In Writer, you can format pages, paragraphs, and blocks of text manually. For
    example, you can place the cursor on a paragraph, choose Format»Paragraph, and
    then format various characteristics of the paragraph (such as indentation, spacing,
    and borders). This paragraph-by-paragraph formatting is okay for a short document,
    but it can be tedious and time-consuming if you have to format hundreds of paragraphs
    one by one. A better approach is to define a *style* — a collection of formatting
    characteristics stored under a particular, usually descriptive, name. Then you
    can simply apply that style to all paragraphs. If you need to change any aspect
    of the paragraphs, simply edit the style and voilà — all paragraphs with that
    style get the new formatting.


    You may be familiar with paragraph and character styles in Microsoft Word, but
    Writer relies more on styles than Microsoft Word. Writer supports five types of
    styles:


    +   - **Paragraph style:** Controls the look of a paragraph, such as the font,
    paragraph spacing, borders, bullets, numbering, and the style of the following
    paragraph.

    +   - **Character style:** Controls the font style of selected text in a paragraph.

    +   - **Frame style:** Controls the size and position of the frame and the text-wrapping
    options.

    +   - **Page style:** Controls the page layout, including the margins, number
    of columns, headers, and footers.

    +   - **Numbering style:** Controls the number or bullet character and spacing
    that are used for numbered or bulleted lists.


    You can conveniently access and use all the document’s styles in a floating window
    called the Stylist (Figure 12-4). Writer displays the Stylist by default, but
    you can show and hide it by pressing F11 (or choosing Format»Stylist).


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_210_0.png)'
  merge: -1
  img_proc: true
- pgno: 211
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_211_0.png)


    The Stylist makes it very easy to organize and use the styles. The five icons
    along the top part of the Stylist refer to the five types of styles — paragraph,
    character, frame, page, and numbering — from left to the right. You can click
    an icon to see all styles of that type. To apply a style, position the cursor
    where you want to apply the style and double-click the style from the Stylist.
    For character styles, select the text and then double-click the character style.


    Writer also supports templates, just as Microsoft Word does. A template is a special
    document with a collection of styles for the kinds of layouts that the document
    needs. You can think of a template as a model for a specific type of document.
    For example, you might have templates for documents such as memos, letters, fax
    cover sheets, envelopes, and many more.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_211_1.png)


    Writer does not come with any templates, but you can create or download templates
    from Web sites. A Writer template for writing manuscripts using the Modern Language
    Association (MLA) style (see `owl.english.purdue.edu/handouts/research/r_mla.html`
    for more information on the MLA style), for example, is available from `www.cc.mie-u.ac.jp/~lq20106/eg5000/templates/dl/MLA-Template.stw`.
    You have to install the template file — `MLA-Template.stw` — before you can create
    documents using that template. Note that the `.stw` extension is used for OpenOffice.org
    template files.


    To install a template file to use in Writer, follow these steps:


    +   1. **Choose File▸Template▸Organize.**


    The Template Management dialog box (shown in Figure 12-5) appears with the Default
    folder of templates on the left side and the current list of documents on the
    right.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_211_2.png)


    +   2. **Right-click the My Templates folder icon and select Import Template from
    the pop-up menu, as shown in Figure 12-5.**


    The Open dialog box appears.'
  merge: -1
  img_proc: true
