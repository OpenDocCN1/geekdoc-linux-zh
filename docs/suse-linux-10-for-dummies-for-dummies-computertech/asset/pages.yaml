- pgno: 273
  md: "# Chapter 17\n\n# Look, Ma, I’m a Sysadmin!\n\n+   **In This Chapter**\n+ \
    \  \n+   - Introducing the sysadmin role\n+   - Becoming root\n+   - Introducing\
    \ the YaST Control Center\n+   - Starting and stopping services\n+   - Managing\
    \ devices\n+   - Managing user accounts\n\nSystem administration, or sysadmin\
    \ for short, refers to whatever has to be done to keep a computer system up and\
    \ running; the system administrator (also called the sysadmin) is whoever is in\
    \ charge of taking care of these tasks.\n\nIf you’re running Linux at home or\
    \ in a small office, you’re most likely the system administrator for your systems.\
    \ Or maybe you’re the system administrator for a whole LAN full of Linux systems.\
    \ No matter. In this chapter, I introduce you to basic system administration procedures\
    \ and show you how to perform some common tasks. As you’ll see, in SUSE Linux,\
    \ you can perform most sysadmin tasks through a graphical tool called YaST. I\
    \ also discuss some command line tools that can be handy if, for some reason,\
    \ the GUI desktop does not start.\n\n# What Does a Sysadmin Do?\n\nSo what are\
    \ system administration tasks? My off-the-cuff reply is, “Anything you have to\
    \ do to keep the system running well.” More accurately, though, a system administrator’s\
    \ duties include the following.\n\n+   - **Adding and removing user accounts.**\
    \ You have to add new user accounts and remove unnecessary user accounts. If a\
    \ user forgets the password, you have to change the password.\n+   - **Managing\
    \ the printing system.** You have to turn the print queue on or off, check the\
    \ print queue’s status, and delete print jobs if necessary."
  merge: -1
  img_proc: true
- pgno: 274
  md: '+   - **Installing, configuring, and upgrading the operating system and various
    utilities.** You have to install or upgrade parts of the Linux operating system
    and other software that are part of the operating system.

    +   - **Installing new software.** You have to install software that comes in
    a package format such as RPM. You also may have to download and unpack software
    that comes in source-code form — and then build executable programs from the source
    code.

    +   - **Managing hardware.** Sometimes, you have to add new hardware and install
    drivers so the devices work properly.

    +   - **Making backups.** You have to back up files, either in a Zip drive or
    on tape (if you have a tape drive) or you can burn a recordable CD or DVD with
    the files.

    +   - **Mounting and unmounting file systems.** When you want to access the files
    on a CD/DVD-ROM, for example, you have to mount that CD/DVD-ROM’s file system
    on one of the directories in your Linux file system. If you use floppy disks,
    you also have to mount floppy disks, in both Linux format and DOS format.

    +   - **Automating tasks.** You may have to schedule Linux tasks to take place
    automatically (at specific times) or periodically (at regular intervals).

    +   - **Monitoring the system’s performance.** You may want to keep an eye on
    system performance to see where the processor is spending most of its time, and
    to see the amount of free and used memory in the system.

    +   - **Starting and shutting down the system.** Although starting the system
    typically involves nothing more than powering up the PC, you do have to take some
    care when you want to shut down your Linux system. Typically you can perform the
    shutdown operation by selecting a menu item from the graphical login screen. Otherwise,
    use the shutdown command to stop all programs before turning off your PC’s power
    switch.

    +   - **Monitoring network status.** If you have a network presence (whether a
    LAN, a DSL line, or cable modem connection), you may want to check the status
    of various network interfaces and make sure your network connection is up and
    running.

    +   - **Setting up host and network security.** You have to make sure that system
    files are protected and that your system can defend itself against attacks over
    the network.

    +   - **Monitoring security.** You have to keep an eye on any intrusions, usually
    by checking the log files.


    That’s a long list of tasks! I don’t cover all of them in this chapter, but this
    and the next three chapters describe most of these tasks. In this chapter, I focus
    on some of the basics by introducing you to some GUI tools, explaining how to
    become root (the superuser), and showing you how to monitor system performance,
    manage devices, and set up user accounts.'
  merge: -1
  img_proc: true
- pgno: 275
  md: "# Becoming root, When You Must\n\nYou have to log in as `root` to perform the\
    \ system administration tasks. The `root` user is the superuser and the only account\
    \ with all the privileges needed to do anything in the system.\n\nCommon wisdom\
    \ says you should **not** normally log in as root. When you’re root, all it takes\
    \ is one misstep, and you can easily delete all the files — especially when you’re\
    \ typing commands. Take, for example, the command `rm *.html` that you’re typing\
    \ to delete all files that have the `.html` extension. What if you accidentally\
    \ press the spacebar after the asterisk (*)? The shell takes the command to be\
    \ `rm * .html` and — because * matches any filename — deletes everything in the\
    \ current directory. Seems implausible until it happens to you!\n\nIf you’re logged\
    \ in as a normal user, how do you do any system administration chores? Well, you\
    \ become root for the time being. If you’re working at a terminal window or text-mode\
    \ console, type\n\n```\nsu -\n```\n\nThen enter the root password in response\
    \ to the prompt. From this point on, you’re root. Do whatever you have to do.\
    \ To return to your usual self, type\n\n```\nexit\n```\n\nThat’s it! It’s that\
    \ easy.\n\n# Resetting a Forgotten root Password\n\nTo perform system administration\
    \ tasks, you have to know the root password. What happens if you forget the root\
    \ password? Not to worry: Just reboot the PC and you can reset the root password\
    \ by following these steps:\n\n+   1. **Reboot the PC** (select Reboot as you\
    \ log out of the GUI screen) or power up as usual.\n+   \n+      If you have more\
    \ than one operating system installed, use the arrow key to select SUSE Linux\
    \ as your operating system. Soon you see the graphical boot screen that shows\
    \ the names of the operating systems you can boot.\n+   \n+   2. **Press E twice.**\n\
    +   \n+      You’ll see a text line showing the GRUB command line for the booting\
    \ the Linux kernel."
  merge: -1
  img_proc: true
