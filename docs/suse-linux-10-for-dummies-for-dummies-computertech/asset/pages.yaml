- pgno: 213
  md: "![](img/b7e91b81e0d84c8a5261ee14a48991b2_213_0.png)\n\nIf you are familiar\
    \ with Microsoft Word, you know that the page setup — paper size, orientation,\
    \ margins, and so on — applies to all pages in the document. In Writer, a page\
    \ style does not automatically apply to the entire document. Instead, each page\
    \ has its own page style. Of course, you can choose to apply the same page style\
    \ to all the pages. Essentially, you have more fine-grained control over page\
    \ layouts in Writer.\n\nA typical page layout task is to insert objects created\
    \ in other OpenOffice.org applications, such as a Calc spreadsheet, an Impress\
    \ slide, or a Draw drawing. You can insert such objects by choosing Insert»Object»OLE\
    \ Object. Incidentally, OLE stands for Object Linking and Embedding, which is\
    \ just a fancy term for the ability to create a document by adding objects like\
    \ charts and drawings that are created in different applications.\n\n![](img/b7e91b81e0d84c8a5261ee14a48991b2_213_1.png)\n\
    \nWhen you add objects to a document, keep this caveat in mind: You can edit an\
    \ object directly in the document only by using the application that originally\
    \ created the object.\n\nOne object that you can insert into a Writer document\
    \ is a mathematical formula, and I mean serious formulas with integral signs and\
    \ Greek letters like alpha and sigma. If you’re writing a scientific paper with\
    \ complex equations, you’ll really appreciate this feature of OpenOffice.org.\
    \ Here’s a typical sequence of steps to insert a formula into a Writer document\
    \ (this process is similar for inserting other objects):\n\n+   1. **Position\
    \ the cursor and choose Insert»Object»Formula.**\n+   \n+      The user interface\
