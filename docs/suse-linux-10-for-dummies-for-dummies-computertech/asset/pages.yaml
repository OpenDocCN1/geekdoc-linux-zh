  md: 'A practical solution to this problem is to set up an Internet firewall and
    to put the Web server on a highly secured host outside the firewall.


    In addition to using a firewall, here are some of the other steps to take to address
    network security (I explain these further, later in this chapter):


    +   - Enable only those Internet services you need on a system. In particular,
