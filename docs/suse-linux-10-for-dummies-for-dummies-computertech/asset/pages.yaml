    # Manipulating files and directories in Konqueror


    Not only can you move around different folders by using Konqueror, but you can
    also do things such as move a file from one folder to another or delete a file.
    I don’t outline each step here because the steps are intuitive and similar to
    what you do in any GUI (such as Windows or the Mac interface). Here are some things
    you can do in Konqueror:


    +   - **View a text file:** Click the filename, and Konqueror displays the contents
    of the file in the right pane.

    +   - **Copy or move a file to a different folder:** Drag and drop the file’s
    icon on the folder where you want the file to go. A menu pops up and asks you
    whether you want to copy or simply link the file to that directory.

    +   - **Delete a file or directory:** Right-click the icon and choose Move to
    Trash from the context menu. To permanently delete the file, right-click the Trash
    icon on the desktop and choose Empty Trash from the context menu. Of course, do
    this only if you really want to delete the file. When you choose Empty Trash,
    the deleted files are really gone forever. If you want to recover a file from
    the trash, double-click the Trash icon on the desktop. From that window, drag
    and drop the file icon into the folder where you want to save the file. When asked
    whether you want to copy or move, select Move. You can recover files from the
    trash until the moment you empty the trash.

    +   - **Rename a file or a directory:** Right-click the icon and choose Rename
    from the context menu. Then you can type the new name (or edit the old name) in
    the text box that appears.

    +   - **Create a new folder:** Choose View↔View Mode↔Icon View. Then right-click
    an empty area of the rightmost pane and choose Create New↔Folder from the context
    menu. Then type the name of the new directory and click OK. (If you don’t have
    permission to create a directory, you get an error message.)'
