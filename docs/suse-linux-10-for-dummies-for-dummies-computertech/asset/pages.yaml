- pgno: 318
  md: '# Checking for setuid permission


    Another popular setting called setuid ID (or setuid for short) can be a security
    hazard. When the setuid permission is enabled, the file executes under the user
    ID of the file’s owner. In other words, if an executable program is owned by root
    and the setuid permission is set, no matter who executes that program, it runs
    as if root is executing it. This permission means that the program can do a lot
    more (for example, read all files, create new files, and delete files) than what
    a normal user program can do. Another risk is that if a setuid program file has
    some security hole, crackers can do a lot more damage through such programs than
    through other vulnerabilities.


    You can find all setuid programs with a simple find command (remember to type
    **su -** to become root):


    ```

    find / -type f -perm +4000 -print

    ```


    You see a list of files such as the following:


    ```

    /bin/su

    /bin/ping

    /bin/eject

    /bin/mount

    ... lines deleted ...

    ```


    Many of the programs have the setuid permission because they need it, but check
    the complete list and make sure that there are no strange setuid programs (for
    example, setuid programs in a user’s home directory).


    If you want to see how these permissions are listed by the ls command, type **ls
    -l /usr/bin/passwd** and you see the permission settings:


    ```

    -rwsr-xr-x 1 root shadow 74952 Aug 29 14:52 /usr/bin/passwd

    ```


    The s in the owner’s permission setting (rws) tells you that the setuid permission
    is set.


    # Securing the Network


    To secure your SUSE Linux system, you have to pay attention to both host security
    and network security. The distinction between the two types of security is somewhat
    arbitrary because securing the network involves fixing up things on the host that
    relate to what Internet services your system offers. In this section, I explain
    how you can secure the Internet services (mostly by'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'not offering unnecessary services), how you can use a firewall to stop unwanted
    network packets from reaching your network, and how to use Secure Shell for secure
    remote logins.


    # Securing Internet services


    For an Internet-connected Linux system (or even one on a LAN that’s not connected
    to the Internet), a significant threat is the possibility that someone could use
    one of many Internet services to gain access to your system. Each service — such
    as mail, Web, or FTP — requires running a server program that responds to client
    requests arriving over the TCP/IP network. Some of these server programs have
    weaknesses that can allow an outsider to log in to your system — maybe with root
    privileges. Luckily, Linux comes with some facilities that you can use to make
    the Internet services more secure.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_319_0.png)


    Potential intruders can employ a *port-scanning tool* — a program that attempts
    to establish a TCP/IP connection at a port and to look for a response — to check
    which Internet servers are running on your system. Then, to gain access to your
    system, the intruders can potentially exploit any known weaknesses of one or more
    services.


    # Turning off stand-alone services


    To provide Internet services such as Web, mail, and FTP, your Linux system has
    to run server programs that listen to incoming TCP/IP network requests. Some of
    these servers are started when you start your system boots, and they run all the
    time. Such servers are called *stand-alone* servers. The Web server and mail server
    are examples of stand-alone servers.


    Another server, called xinetd, starts other servers that are configured to work
    under xinetd. Some servers can be configured to run stand-alone or under a superserver
    such as xinetd. For example, the vsftpd FTP server can be configured to run stand-alone
    or to run under the control of xinetd.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_319_1.png)


    You can turn the servers on or off by using the chkconfig command. For example,
    to turn off the FTP service, type **chkconfig vsftpd off**.


    # Configuring the Internet superserver


    In addition to stand-alone servers such as a Web server or mail server, there
    is another server — xinetd — that you have to configure separately. The xinetd
    server is called *Internet superserver* because it can start other servers on
    demand.'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'The xinetd server reads a configuration file named `/etc/xinetd.conf` at startup.
    This file, in turn, refers to configuration files stored in the `/etc/xinetd.d`
    directory. The configuration files in `/etc/xinetd.d` tell xinetd which ports
    to listen to and which server to start for each port. Type `ls /etc/xinetd.d`
    to see a list of the files in the `/etc/xinetd.d` directory on your system. Each
    file represents a service that xinetd can start. To turn off any of these services,
    type `chkconfig filename off` where *filename* is the name of the configuration
    file in the `/etc/xinetd.d` directory. After you turn any of these services on
    or off, you must restart the xinetd server; otherwise, the changes don’t take
    effect. To restart the xinetd server, type `/etc/init.d/xinetd restart`. This
    command stops the xinetd server and then starts it again. When it restarts, it
    reads the configuration files, and the changes take effect.


    # Configuring TCP wrapper security


    A security feature of xinetd is its use of a feature called *TCP wrapper* to start
    various services. The *TCP wrapper* is a block of code that provides an access-control
    facility for Internet services, acting like a protective package for your message.
    The TCP wrapper can start other services, such as FTP and vnc (a server that enables
    other computers to view and interact with your computer’s graphical desktop);
    but before starting a service, it consults the `/etc/hosts.allow` file to see
    whether the host requesting service is allowed that service. If nothing appears
    in `/etc/hosts.allow` about that host, the TCP wrapper checks the `/etc/hosts.deny`
    file to see if it denies the service. If both files are empty, the TCP wrapper
    provides access to the requested service.


    Here are the steps to follow to tighten the access to the services that `inted`
    or `xinetd` are configured to start:


    +   1. **Use a text editor to edit the `/etc/hosts.deny` file, adding the following
    line into that file:**


    ```

    ALL:ALL

    ```


    This setting denies all hosts access to any Internet services on your system.


    +   2. **Edit the `/etc/hosts.allow` file and add to it the names of hosts that
    can access services on your system.**


    For example, to enable only hosts from the 192.168.1.0 network and the `localhost`
    (IP address 127.0.0.1) to access the services on your system, place the following
    line in the `/etc/hosts.allow` file:


    ```

    ALL: 192.168.1.0/255.255.255.0 127.0.0.1

    ```'
  merge: -1
  img_proc: true
- pgno: 321
  md: "+   3. If you want to permit access to a specific Internet service to a specific\
    \ remote host, you can do so by using the following syntax for a line in `/etc/hosts.allow`:\n\
    \n```\nserver_program_name: hosts\n```\n\nHere `server_program_name` is the name\
    \ of the server program, and `hosts` is a comma-separated list of hosts that can\
    \ access the service. You may also write `hosts` as a network address or an entire\
    \ domain name, such as `.mycompany.com`.\n\n# Using Secure Shell (SSH)  \nfor\
    \ remote logins\n\nSUSE Linux comes with the *Open Secure Shell* (OpenSSH) software\
    \ that uses public-key cryptography to authenticate users and to encrypt the communication\
    \ between two hosts, so users can securely log in from remote systems and copy\
    \ files securely.\n\nIn this section, I briefly describe how to use the OpenSSH\
    \ software in SUSE Linux. The OpenSSH software is installed during SUSE Linux\
    \ installation. OpenSSH uses public-key encryption where the sender and receiver\
    \ both have a pair of keys — a public key and a private key. The public keys are\
    \ freely distributed, and each party knows the other’s public key. The sender\
    \ encrypts data by using the recipient’s public key. Only the recipient’s private\
    \ key can then decrypt the data.\n\nTo use OpenSSH, you first need to start the\
    \ `sshd` server and then generate the host keys. Here’s how:\n\n+   If you want\
    \ to support SSH-based remote logins on a host, start the `sshd` server on your\
    \ system. Type `ps ax | grep sshd` to see if the server is already running. If\
    \ not, in a terminal window type `su -` to become root, and turn on the SSH service.\n\
    +   \n+   Type `/etc/init.d/sshd start` to start the `sshd` server immediately.\
    \ To ensure that the server starts the next time you reboot the system, type `chkconfig\
    \ sshd on`.\n\n+   Generate the host keys with the following command:\n\n```\n\
    ssh-keygen -d -f /etc/ssh/ssh_host_key -N ''\n```\n\nThe `-d` flag causes the\
    \ `ssh-keygen` program to generate DSA keys, which the SSH2 protocol uses. If\
    \ you see a message saying that the file `/etc/ssh/ssh_host_key` already exists,\
    \ that means that the key pairs were generated during SUSE Linux installation.\
    \ In that case, press `n` to avoid overwriting the keys and continue to use the\
    \ existing file.\n\n![](img/b7e91b81e0d84c8a5261ee14a48991b2_321_0.png)"
  merge: -1
  img_proc: true
- pgno: 322
  md: 'A user can now log in from a remote system using the ssh command (assuming
    that the remote system also runs Linux). From a Windows system, a user can run
    a program such as putty that supports SSH.


    For example, to log in to my account on a SUSE Linux system from another Linux
    system on the network, I type


    ```

    ssh 192.168.0.6 -l naba

    ```


    Here I identify the remote host by its IP address (192.168.0.6). When prompted
    for the password, I enter the password. After that, I can have a secure login
    session with the remote host. (The information sent between the two systems is
    encrypted.)


    # Setting up a simple firewall


    A firewall is a network device or host with two or more network interfaces — one
    connected to the protected internal network and the other connected to unprotected
    networks, such as the Internet. The firewall controls access to and from the protected
    internal network.


    If you connect an internal network directly to the Internet, you have to make
    sure that every system on the internal network is properly secured — which can
    be nearly impossible because just one careless user can render the entire internal
    network vulnerable. A firewall is a single point of connection to the Internet:
    You can direct all your efforts toward making that firewall system a daunting
    barrier to unauthorized external users. Essentially, a firewall is like a protective
    fence that keeps unwanted external data and software out and sensitive internal
    data and software in. (See Figure 19-1.)


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_322_0.png)'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'The firewall runs software that examines the network packets arriving at its
    network interfaces and takes appropriate actions based on a set of rules. The
    idea is to define these rules so that they allow only authorized network traffic
    to flow between the two interfaces. Configuring the firewall involves setting
    up the rules properly. A configuration strategy is to reject all network traffic
    and then enable only a limited set of network packets to go through the firewall.
    The authorized network traffic would include the connections necessary to enable
    internal users to do things such as visiting Web sites and receiving electronic
    mail.


    Your SUSE Linux system comes with built-in packet-filtering capability that provides
    a simple firewall. The Linux kernel’s built-in packet-filtering capability is
    handy when you don’t have a dedicated firewall between your Linux system and the
    Internet. This is the case, for example, when you connect your Linux system to
    the Internet through a DSL or cable modem. You can essentially have a packet-filtering
    firewall inside your Linux system, sitting between the kernel and the applications.


    SUSE Linux includes a GUI tool to turn on a packet filtering firewall. To set
    up a firewall, select Main Menu > System > Control Center (YaST). In the YaST
    Control Center window that appears, click Security and Users on the left side
    of the window and then click Firewall on the right side. YaST opens a window (see
    Figure 19-2) that you can use to configure the firewall.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_323_0.png)'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'From the first screen (refer to Figure 19-2), you can specify whether the firewall
    should start when the system boots; you can also start, stop, or restart the firewall.
    To configure other aspects of the firewall, such as what services to allow through
    the firewall, click the categories on the left side and then specify whatever
    that category requires. You can designate network interfaces (by device name,
    such as eth0, ppp0, and so on) to one of three zones: internal, external, or demilitarized
    zone. Then for that zone you can specify what services (such as HTTP, FTP, and
    SSH) are allowed. If you have two or more network interfaces and you use the Linux
    system as a gateway (a router), you can enable forwarding packets between network
    interfaces (a feature called masquerading). You can also turn on different levels
    of logging. (For example, logging all dropped packets that attempted connection
    at specific ports.) If you make changes to firewall settings, click the Startup
    category and then click Save Settings and Restart Firewall Now (refer to Figure
    19-2).


    # Using NATs


    Network Address Translation (NAT) is an effective tool that enables you to “hide”
    the network addresses of an internal network behind a firewall. In essence, NAT
    allows an organization to use private network addresses behind a firewall while
    still maintaining the ability to connect to external systems through the firewall.


    You can implement NAT by purchasing a NAT router that can connect your internal
    network to a DSL or cable modem. I describe NAT routers in Chapter 7.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_324_0.png)


    # Keeping Up with Security

    News and Updates


    To keep up with the latest security alerts, you may want to visit one or more
    of the following sites on a daily basis:


    +   - Novell’s online Linux security support Web site at `www.novell.com/linux/security/securitysupport.html`

    +   - CERT Coordination Center (CERT/CC) at `www.cert.org`

    +   - Computer Incident Advisory Capability (CIAC) at `www.ciac.org/ciac`

    +   - United States Computer Emergency Readiness Team (US-CERT) at `www.us-cert.gov`'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'If you have access to Internet newsgroups, you can periodically browse the
    following:


    +   - **comp.security.announce:** A moderated newsgroup that includes announcements
    from CERT about security.

    +   - **comp.security.linux:** A newsgroup that includes discussions of Linux
    security issues.

    +   - **comp.security.unix:** A newsgroup that includes discussions of UNIX security
    issues, including items related to Linux.


    If you prefer to receive regular security updates through e-mail, you can also
    sign up for (subscribe to) various mailing lists:


    +   - **FOCUS-LINUX:** Fill out the form at `www.securityfocus.com/subscribe`
    to subscribe to this mailing list focused on Linux security issues.

    +   - **US-CERT National Cyber Alert System:** Follow the directions at `www.us-cert.gov`
    to subscribe to this mailing list. The Cyber Alert System features four categories
    of security information through its mailing lists:

    +     - Technical Cyber Security Alerts provide technical information about vulnerabilities
    in various common software products.

    +     - Cyber Security Alerts are sent when vulnerabilities affect the general
    public. They outline the steps and actions that nontechnical home and corporate
    computer users can take to protect themselves from attacks.

    +     - Cyber Security Bulletins are biweekly summaries of security issues and
    new vulnerabilities along with patches, workarounds, and other actions that users
    can take to help reduce the risk.

    +     - Cyber Security Tips offer advice on common security issues for nontechnical
    computer users.'
  merge: -1
  img_proc: true
