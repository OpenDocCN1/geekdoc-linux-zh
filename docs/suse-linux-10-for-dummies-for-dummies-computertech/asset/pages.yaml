  img_proc: true
- pgno: 307
  md: '+   - Set file ownerships and permissions to protect important files and directories.

    +   - Use the GNU Privacy Guard (GnuPG) to encrypt or decrypt files with sensitive
    information and to authenticate files that you download from the Internet. GnuPG
    comes with SUSE Linux, and you can use the `gpg` command to perform the tasks
    such as encrypting or decrypting a file.

    +   - Use file integrity-checking tools, such as Tripwire, to monitor any changes
    to crucial system files and directories. Visit `www.tripwire.com` for this commercial
    tool.

    +   - Periodically check various log files for signs of any break-ins or attempted
    break-ins. These log files are in the `/var/log` directory of your system.

    +   - Install security updates to SUSE Linux as soon as they become available.
    These security updates fix known vulnerabilities in SUSE Linux. You can get these
    updates by using the YaST Online Update that I describe in Chapter 18.


    # Understanding network security issues


    The issue of network security comes up as soon as you connect your organization’s
    internal network to the Internet. You need to think of network security even if
    you connect a single computer to the Internet, but security concerns are more
    pressing when an entire internal network is opened to the world.


    If you’re an experienced system administrator, you already know that the cost
    of managing an Internet presence doesn’t worry corporate management; their main
    concern is security. To get your management’s backing for the Web site, you have
    to lay out a plan to keep the corporate network secure from intruders.


    You may think that you can avoid jeopardizing the internal network by connecting
    only the external servers, such as Web and FTP servers, to the Internet. However,
    employing this simplistic approach isn’t wise. It’s like deciding not to drive
    because you may have an accident. Not having a network connection between your
    Web server and your internal network also has the following drawbacks:


    +   - You cannot use network file transfers, such as FTP, to copy documents and
    data from your internal network to the Web server.

    +   - Users on the internal network cannot access the corporate Web server.

    +   - Users on the internal network don’t have access to Web servers on the Internet.
    Such a restriction makes a valuable resource — the Web — inaccessible to the users
    in your organization.'
