    # Reading RSS Feeds


    RSS stands for Really Simple Syndication. RSS is a format for syndicating — gathering
    and making available — content of Web sites, primarily news-oriented sites and
    blogs. A blog is short for weblog — a frequently updated journal with thoughts,
    comments, and opinions of the blog’s creator. RSS can be used to provide any kind
    of information that can be broken down into discrete items and put into RSS format.
    Such RSS-formatted content is called an **RSS feed**, and an RSS-aware program
    can check the feed periodically for changes, download new items, and make them
    available to the user.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_199_0.png)


    Nowadays, RSS feeds are also known as *web feeds* or simply *feeds*.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_199_1.png)


    The RSS format is a dialect of XML (extensible markup language). All RSS files
    conform to XML 1.0 specification. There are many versions of RSS, but three versions
    — 0.91, 1.0, and 2.0 — are in widespread use. RSS version 0.90 was designed by
    Netscape for gathering and displaying headlines from news sites. A simpler version,
    0.91, was proposed, and UserLand Software picked up that version to use it for
    its blogging product. At the same time, another noncommercial group had evolved
    RSS 0.90 into RSS 1.0, which is based on resource'
  merge: -1
  img_proc: true
- pgno: 200
  md: "description format, or RDF (see www.w3.org/RDF/). UserLand did not accept RSS\
    \ 1.0 but instead continued evolving RSS 0.91 through versions 0.92, 0.93, 0.94,\
    \ finally settling on RSS 2.0 (skipping 1.0 because that version number was already\
    \ taken). Currently, many blogs and Web sites use RSS 0.91 for basic syndication\
    \ (title, URL, and description), RSS 1.0 for readers who use RDF, and RSS 2.0\
    \ for advanced syndication with more metadata. (Think of metadata as “data about\
    \ data,” which is what the RSS format provides — data about other information\
    \ such as blogs and news.) RSS 1.0 files have an .rdf extension, whereas RSS 0.91\
    \ and 2.0 files have .xml extension. However, all RSS files are text files that\
    \ use XML tags.\n\n# Examining an RSS feed\n\nAn RSS feed is a text file with\
    \ XML tags that describe a Web site’s content. You typically use an automated\
    \ program to periodically generate the RSS feed file, but you can prepare the\
    \ RSS feed file using a text editor. It’s good to know what an RSS feed looks\
    \ like so that you can debug problems with the feed.\n\nThe specific details of\
    \ an RSS feed depend on the version of RSS. The simplest feed is RSS 0.91; here’s\
    \ a typical RSS 0.91 feed:\n\n```\n<?xml version=\"1.0\" ?>\n<!-- A comment line\
    \ -->\n<rss version=\"0.91\">\n  <channel> <!-- This feed specifies general information\
    \ about the feed-->\n    <title>Title of this feed</title>\n    <link>URL of this\
    \ feed, for example, http://naba.typepad.com/</link>\n    <description>Brief description\
    \ of feed</description>\n    <language>en-us</language>\n    <item>\n      <title>Title\
    \ of this item</title>\n      <link>URL for this item</link>\n      <description>Description\
    \ of this item</description>\n    </item>\n  ... more items ...\n  </channel>\n\
    </rss>\n```\n\nAs you can see from this listing, an RSS feed includes a channel\
    \ with a title, link, description, and language, followed by a series of items,\
    \ each of which has a title, link, and description."
  merge: -1
  img_proc: true
- pgno: 201
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_201_0.png)


    The format is more verbose for RSS 1.0, which uses the RDF format. RSS 1.0 essentially
    provides the basic information that’s in RSS 0.91 and adds more details such as
    item-level authors, subject, and publishing dates, which RSS 0.91 does not support.


    # Reading RSS feeds


    There are many GUI programs available for subscribing to RSS feeds and reading
    items from a feed. These programs are called RSS aggregators because they can
    gather information from many RSS feeds and make everything available in a single
    place.


    There are two types of RSS aggregators — Web browser plugins and stand-alone programs.
    Browser plugins such as NewsMonster (www.newmonster.org/) run in a Web browser
    so that the feeds appear in the Web browser. Stand-alone programs such as Imendio
    Blam (developer.imendio.com/wiki/Blam) and KDE Aggregator (aggregator.sourceforge.net/)
    are complete GUI applications and usually look similar to other mail and newsreader
    programs.


    In SUSE Linux, the KDE desktop uses Akregator as the RSS reader, whereas GNOME
    provides Imendio Blam. You can find them in the Internet applications category
    in the menu. I briefly describe how Akregator works; you can use Blam in a similar
    way.


    To start Akregator, select Main Menu➔Internet➔RSS Reader➔Akregator. When Akregator
    first runs, it displays its main window without any RSS feeds. To subscribe to
    a feed, select Feed➔Add Feed from the menu or right-click All Feeds in the left
    pane of the window (see Figure 11-8) and select Add Feed from the pop-up menu.
    Then type the URL for the feed in the Add Feed dialog box and click OK. For example,
    to read Slashdot’s RSS feed, I type http://slashdot.org/index.rss. The feed’s
    title then appears on the left pane of the window. Click the feed title to view
    the items in this feed. Then you can click an item in the upper-right pane, and
    that item appears in the lower-right pane, as shown in Figure 11-8. You can add
    many different RSS feeds, organize them into folders, and browse them in Akregator.'
  merge: -1
  img_proc: true
