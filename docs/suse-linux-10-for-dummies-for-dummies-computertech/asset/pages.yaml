  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_54_0.png)


    **Figure 2-10:** Click Finish to reboot and begin using your SUSE system.


    # 8. **Click Finish to complete the installation.**


    The installer then reboots the system. If you are using the KDE desktop, the system
    automatically logs you in using the local user account you defined during installation.
    Otherwise, you see the graphical login screen where you can log in to the system
    and start using it.


    Congratulations! You can now start using SUSE Linux.'
