- pgno: 64
  md: 'the one shown in Figure 3-7. That’s a terminal window, and it works just like
    an old-fashioned terminal. A shell program is running and ready to accept any
    text that you type. You type text, press Enter, and something happens (depending
    on what you type).


    In GNOME, choose Applications→System→Terminal→Gnome Terminal. That should then
    open up a terminal window.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_64_0.png)


    The prompt that you see depends on the shell that runs in that terminal window.
    The default Linux shell is called bash.


    Bash understands a whole host of standard Linux commands, which you can use to
    look at files, go from one directory to another, see what programs are running
    (and who else is logged in), and a whole lot more.


    In addition to the Linux commands, bash can run any program stored in an executable
    file. Bash can also execute *shell scripts* — text files that contain Linux commands.


    # Understanding shell commands


    Because a shell interprets what you type, knowing how the shell figures out the
    text that you enter is important. All shell commands have this general format:


    ```

    ```text

    command option1 option2 ... optionN

    ```

    ```


    Such a single line of commands is commonly called a *command line*. On a command
    line, you enter a command followed by one or more optional parameters'
  merge: -1
  img_proc: true
- pgno: 65
  md: "(or *arguments*). Such *command line options* (or command line arguments) help\
    \ you specify what you want the command to do.\n\nOne basic rule is that you have\
    \ to use a space or a tab to separate the command from the options. You also must\
    \ separate options with a space or a tab. If you want to use an option that contains\
    \ embedded spaces, you have to put that option inside quotation marks. For example,\
    \ to search for two words of text in the password file, I enter the following\
    \ grep command (grep is one of those trippy commands used to search for text in\
    \ files):\n\n```\ngrep \"SSH daemon\" /etc/passwd\n```\n\nWhen grep prints the\
    \ line with those words, it looks like this:\n\n```\nsshd:x:71:65:SSH daemon:/var/lib/sshd:/bin/false\n\
    ```\n\nIf you created a user account in your name, go ahead and type the grep\
    \ command with your name as an argument, but remember to enclose the name in quotes.\
    \ For example, here is how I search for my name in the /etc/passwd file:\n\n```\n\
    grep \"Naba Barkakati\" /etc/passwd\n```\n\n# Trying a few Linux commands\n\n\
    While you have the terminal window open, try a few Linux commands just for fun.\
    \ I guide you through some random examples to give you a feel for what you can\
    \ do at the shell prompt.\n\nTo see how long the Linux PC has been up since you\
    \ last powered it up, type the following (*Note:* I show the typed command in\
    \ bold, followed by the output from that command.):\n\n```\n**uptime**\n\n   \
    \ 3:52am  up 29 days 55:53,  5 users,  load average: 0.04,\n                 \
    \        0.32, 0.38\n```\n\nThe part up 29 days, 55:53 tells you that this particular\
    \ PC has been up for nearly a month. Hmmm . . . can Windows do that?\n\nTo see\
    \ what version of Linux kernel your system is running, use the uname command like\
    \ this:\n\n```\nuname -srv\n```"
  merge: -1
  img_proc: true
- pgno: 66
  md: "This runs the uname command with three options -s, -r, and -v (these can be\
    \ combined as -srv, as this example shows). The -s option causes uname to print\
    \ the name of the kernel, -r prints the kernel release number, and -v prints the\
    \ kernel version number. The command generates the following output on one of\
    \ my Linux systems:\n\n```\n```text\nLinux 2.6.13-8-default #1 Tue Sep 6 12:59:22\
    \ UTC 2005\n```\n```\n\nIn this case, the system is running Linux kernel version\
    \ 2.6.13.\n\nTo read a file, use the more command. Here’s an example that displays\
    \ the contents of the /etc/passwd file:\n\n```\n```text\nmore /etc/passwd\n\n\
    root:x:0:0:root:/root:/bin/bash\nbin:x:1:1:bin:/bin:/bin/bash\ndaemon:x:2:2:Daemon:/sbin:/bin/bash\n\
    lp:x:4:7:Printing daemon:/var/spool/lpd:/bin/bash\n... lines deleted ...\n```\n\
    ```\n\nTo see a list of all the programs currently running on the system, use\
    \ the ps command, like this:\n\n```\n```text\nps ax\n```\n```\n\nThe ps command\
    \ takes many options, and you can provide these options without the usual dash\
    \ (-) prefix. This example uses the a and x options — the a option lists all processes\
    \ that you are running, and the x option displays all the rest of the processes.\
    \ The net result is that ps ax prints a list of all processes running on the system,\
    \ as shown in the following sample output:\n\n```\n```text\n  PID TTY        \
    \  STAT     TIME COMMAND\n    1 ?             S       0:01 init [5]\n    2 ? \
    \            SN      0:10 [ksoftirqd/0]\n    3 ?             S<      0:00 [events/0]\n\
    \    4 ?             S<      0:00 [khelper]\n    9 ?             S<      0:00\
    \ [kthread]\n   19 ?             S<      0:00 [kacpid]\n   75 ?             S<\
    \      0:02 [kblockd/0]\n... lines deleted ...\n```\n```\n\nAmazing how many programs\
    \ can run on a system even when only you are logged in as a user, isn’t it?\n\n\
    As you can guess, you can do everything from a shell prompt, but it does take\
    \ some getting used to."
