    # Using Linux Commands to Manipulate Files and Directories


    Although GUI file managers such as Konqueror (in KDE) and Nautilus (in GNOME)
    are easy to use, you can use them only if you have a working GUI desktop. Sometimes,
    you may not have a graphical environment to run a graphical file manager. For
    example, you may be logged in through a text terminal, or the X Window System
    may not be working on your system. In those situations, you have to rely on Linux
    commands to work with files and directories. Of course, you can always use Linux
    commands, even in the graphical environment — all you have to do is open a terminal
    window and type the Linux commands.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_107_0.png)


    To open a terminal window in KDE, click the terminal icon on the panel. In GNOME,
    choose Applications→System→Terminal→Gnome Terminal.


    In the sections that follow, I briefly show some Linux commands for working with
    the files and directories.


    # Commands for directory navigation


    In Linux, when you log in as root, your home directory is /root. For other users,
    the home directory is usually in the /home directory. My home directory (when
    I log in as naba) is /home/naba. This information is stored in the /etc/passwd
    file. By default, only you have permission to save files in your home directory,
    and only you can create subdirectories in your home directory to further organize
    your files.'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'Linux supports the concept of a current directory, which is the directory on
    which all file and directory commands operate. After you log in, for example,
    your current directory is the home directory. To see the current directory, type
    the `pwd` command.


    To change the current directory, use the `cd` command. To change the current directory
    to `/usr/lib`, type the following:


    ```

    ```bash

    cd /usr/lib

    ```

    ```


    Then, to change the directory to the cups subdirectory in `/usr/lib`, type this
    command:


    ```

    ```bash

    cd cups

    ```

    ```


    Now, if you use the `pwd` command, that command shows `/usr/lib/cups` as the current
    directory.


    These two examples show that you can refer to a directory’s name in two ways:


    +   - **An absolute pathname** (such as `/usr/lib`) that specifies the exact directory
    in the directory tree

    +   - **A relative directory name** (such as `cups`, which represents the cups
    subdirectory of the current directory, whatever that may be)


    If you type `cd cups` in `/usr/lib`, the current directory changes to `/usr/lib/cups`.
    However, if you type the same command in `/home/naba`, the shell tries to change
    the current directory to `/home/naba/cups`.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_108_0.png)


    Use the `cd` command without any arguments to change the current directory back
    to your home directory. No matter where you are, typing **cd** at the shell prompt
    brings you back home!


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_108_1.png)


    By the way, the tilde character (`~`) refers to your home directory. Thus the
    command `cd ~` also changes the current directory to your home directory. You
    can also refer to another user’s home directory by appending that user’s name
    to the tilde. Thus, `cd ~spiderman` changes the current directory to the home
    directory of spiderman.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_108_2.png)


    Wait, there’s more. A single dot (`.`) and two dots (`..`) — often referred to
    as dot-dot — (clever, huh!) also have special meanings. A single dot (`.`) indicates
    the current directory, whereas two dots (`..`) indicate the parent directory.
    For example, if the current directory is `/usr/share`, you go one level up to
    `/usr` by typing


    ```

    ```bash

    cd ..

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 109
  md: "# Commands for directory listings\nand permissions\n\nYou can get a directory\
    \ listing by using the ls command. By default, the ls command — without any options\
    \ — displays the contents of the current directory in a compact, multicolumn format.\
    \ For example, type the next two commands to see the contents of the /etc/X11\
    \ directory:\n\n```\ncd /etc/X11\nls\n```\n\nThe output looks like this (on the\
    \ console, you see some items in different colors):\n\n```\nfs             qt_gtk_font2fntrc\
    \  WindowMaker    xkb             xorg.conf.md5\nfwm2           qt_plugins_3.3rc\
    \   xim            Xmodmap         xorg.conf.saxsave\nkstylerc       qtrc    \
    \           Xmodmap.remote Xresources\nlbproxy        rstart             xim.d\
    \          xorg.conf       xserver\nproxymngr      twm                xinit  \
    \        xorg.conf.install xsm\n```\n\nFrom this listing (without the colors),\
    \ you cannot tell whether an entry is a file or a directory. To tell the directories\
    \ and files apart, use the -F option with ls like this:\n\n```\nls -F\n```\n\n\
    This time, the output gives you some more clues about the file types:\n\n```\n\
    fs/             qtrc             xinit/           xorg.conf.saxsave\nfwm2/   \
    \        rstart/           xkb/             Xresources\nkstylerc        twm/ \
    \             Xmodmap          xserver/\nlbproxy/        WindowMaker/      Xmodmap.remote\
    \   xsm/\nproxymngr/      xim/              xorg.conf        \nqt_gtk_font2fntrc\
    \  xim.d/         xorg.conf.install\nqt_plugins_3.3rc  xim             xorg.conf.md5\n\
    ```\n\nThe output from ls -F shows the directory names with a slash (/) appended\
    \ to them. Plain filenames appear as is. The at sign (@) appended to a file’s\
    \ name (for example, notice the file named xorg.conf) indicates that this file\
    \ is a link to another file. (In other words, this filename simply refers to another\
    \ file; it’s a shortcut.) An asterisk (*) is appended to executable files. (xim,\
    \ for example, is an executable file.) The shell can run any executable file.\n\
    \nYou can see even more detailed information about the files and directories with\
    \ the -l option:\n\n```\nls -l\n```"
  merge: -1
  img_proc: true
