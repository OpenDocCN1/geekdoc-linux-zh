- pgno: 79
  md: '# Chapter 5


    # Exploring the SUSE Desktops


    # In This Chapter


    +   - Discovering the common features of the GNOME and KDE GUIs

    +   - Introducing the KDE desktop

    +   - Getting familiar with the GNOME desktop


    When you install SUSE Linux following the steps I describe in Chapter 2, you can
    choose to install one of two popular graphical desktops — GNOME or KDE. GNOME
    and KDE are similar to Microsoft Windows, but they are unique in one respect.
    Unlike Microsoft Windows, you can pick your desktop in SUSE Linux.


    You can best figure out the KDE and GNOME desktops by simply starting to use them.
    In this chapter, I help you get familiar with key features of the desktops. I
    start by introducing the common features of the two desktops and then I briefly
    describe each desktop individually.


    # Discovering the Common Features

    of the Desktops


    From your perspective as a user, both KDE and GNOME probably seem similar because
    many features work similarly. Becoming familiar with these common features is
    helpful so that you can rely on them no matter which desktop you choose to use
    for your daily work.


    For starters, the initial desktop for both KDE and GNOME looks like any other
    popular GUI desktop, such as Microsoft Windows or Apple’s Mac OS desktop. For
    example, Figure 5-1 and Figure 5-2, respectively, show typical KDE and GNOME desktops.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_80_0.png)


    **Figure 5-1:** A typical KDE desktop with several applications.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_80_1.png)


    **Figure 5-2:** A typical GNOME desktop.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'Both desktops (Figures 5-1 and 5-2) show icons for your computer, your home
    folder, and the trash can for deleted files. Both desktops have something similar
    to the Windows taskbar. On the KDE desktop, the taskbar, called the *panel*, appears
    along the bottom of the screen. GNOME has two such panels — one on the top and
    the other on the bottom of the screen. Even though the appearance may look slightly
    different, the panels serve the same purpose on both KDE and GNOME desktops —
    they provide buttons for accessing menus and starting applications, and they show
    buttons for any applications you’ve started (or were automatically started for
    you).


    In the case of the KDE desktop, both the menu buttons and information about running
    applications appear on the same panel. On the GNOME desktop, the top panel provides
    menus and buttons for starting applications, whereas the bottom panel displays
    information about running applications.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_81_0.png)


    Move the mouse over any icon on a panel, and a small pop-up window gives a helpful
    hint about what you can do with that icon.


    # Desktop context menus


    Both GNOME and KDE desktops display a context menu when you right-click a clear
    area on the desktop. The exact contents of that menu depends on the desktop, but
    it typically offers menu options that enable you to perform the following types
    of tasks:


    +   - Run a command

    +   - Create a new folder

    +   - Create a new document

    +   - Configure the desktop background

    +   - Rearrange the icons on the desktop

    +   - Lock the screen (enter your password to unlock)

    +   - Log out


    The last two options are only available on the KDE desktop’s context menu.


    For example, Figures 5-3 and 5-4, respectively, show the desktop context menus
    in typical KDE and GNOME desktops. Desktop menu options with a right-pointing
    arrow have other menus that appear when you put the mouse pointer over the arrow.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_82_0.png)


    **Figure 5-3:** Typical right-click menu for a KDE desktop.


