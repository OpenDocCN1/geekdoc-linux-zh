- pgno: 236
  md: '# Delivering presentations


    After you prepare a spectacular set of slides, you have to deliver it to your
    audience. This typically involves tasks such as preparing speaker’s notes, running
    a slide show, converting the presentation into HTML for delivery via the Web,
    and printing handouts.


    You can also print an Impress presentation directly to an Adobe Portable Document
    Format (.pdf) file. This feature makes it easy to electronically share a presentation
    with everyone because anyone can easily view and print .pdf files by using the
    free Adobe Reader.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_236_0.png)'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# Chapter 14


    # Playing Music and Burning CDs


    # In This Chapter


    +   - Playing audio CDs

    +   - Playing digital music

    +   - Burning CDs and DVDs


    SUSE Linux comes with several audio and video applications. You can listen to
    audio CDs, MP3 music (as well as other digital music files), and watch MPEG video
    (provided you have the decoders installed). You can also rip audio CDs and burn
    new CDs—both audio and data CDs. In this chapter, I introduce some of the audio
    applications that you can find in either KDE or GNOME desktops.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_237_0.png)


    The video applications lack the decoders necessary to play video such as MPEG
    or DVD. In particular, commercial DVDs use an encryption method called Content
    Scrambling System (CSS) to prevent the DVD data from being copied. The open source
    Linux video players do not include the software to decrypt CSS and therefore cannot
    play DVDs. On source SUSE Linux also does not include the MP3 decoders needed
    to play MP3 music files. You can, however, use YaST to download the MP3 decoders
    from an online repository.


    # Playing Audio CDs


    SUSE Linux comes with both the GNOME or KDE CD player applications. To play an
    audio CD, you need a sound card, and that sound card must be configured to work
    in SUSE Linux. All of that should happen when you install SUSE Linux following
    the steps outlined in Chapter 2.


    In KDE, if you insert an audio CD into the drive, a dialog box appears (see Figure
    14-1) and asks whether you want to play the CD with the CD player. Click Yes.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_238_0.png)


    The KDE CD Player (KsCD) starts and displays the title of the CD and the name
    of the current track. The CD Player gets the song titles from http://freedb.freedb.org
    — a free, open source CD database on the Internet. You need an active Internet
    connection for the CD Player to download song information from the CD database.
    After the CD Player downloads information about a particular CD, it caches that
    information in a local database for future use. The CD Player user interface is
    intuitive, and you can figure it out easily. One nice feature is that you can
    select a track by title. Figure 14-2 shows the KDE CD Player (KsCD) playing a
    track from an audio CD. To select a track by title, click the track title at the
    top edge of the KDE CD Player. Then select the track from the drop-down list that
    appears.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_238_1.png)


    Playing audio CDs is simple in GNOME as well. Insert the audio CD into the drive,
    and the GNOME CD Player should start automatically. If it does not, choose Main
    Menu➪Multimedia➪CD Player➪CD Player. Click the Play/Pause button in the toolbar
    along the bottom (see Figure 14-3) and you should be off and running. Figure 14-3
    shows the GNOME CD player in action. As with the KDE CD Player, you can click
    the track title for a drop-down list of all the tracks and select one that you
    want to play.'
  merge: -1
  img_proc: true
- pgno: 239
  md: "![](img/b7e91b81e0d84c8a5261ee14a48991b2_239_0.png)\n\n# Playing Music Files\n\
    \nTypically, digital music files are stored in MP3 format, and the filenames have\
    \ an .mp3 extension. Both KDE and GNOME desktops include several applications\
    \ for playing digital music.\n\n![](img/b7e91b81e0d84c8a5261ee14a48991b2_239_1.png)\n\
    \nThe music players can also play digital music in other formats besides MP3 such\
    \ as Ogg Vorbis, FLAC (Free Lossless Audio Codec, an audio file format that is\
    \ similar to MP3), and Windows WAV. Unfortunately, the versions of music players\
    \ included with SUSE Linux on the companion DVD do not include the MP3 decoders.\
    \ If you want to play MP3 music files, you have to install the MP3 decoders from\
    \ an online repository such as packman. To perform that task, follow the steps\
    \ outlined in the “Adding a Software Source to YaST” section in Chapter 18 to\
    \ add packman as a software source in YaST. After that, you can install the MP3\
    \ support by following these steps:\n\n+   1. **Select Main Menu→System→Control\
    \ Center (YaST).**\n+   \n+      If you are not logged in as root, YaST prompts\
    \ you for the root password, and then the YaST Control Center starts.\n+   \n\
    +   2. **Click Software on the left side and then click Software Management on\
    \ the right.**\n+   \n+      The YaST package manager window appears.\n+   \n\
    +   3. **Type mad in the Search box and click Search.**\n+   \n+      The packages\
    \ with mad in the package name appear in the search results on the right side.\n\
    +   \n+   4. **Select the mad, kdemultimedia3-mad, and kdemultimedia3-arts-mad\
    \ packages. Then click Accept.**\n+   \n+      YaST downloads and installs the\
    \ packages.\n\nNow you should be able to play MP3 music files in the music players."
  merge: -1
  img_proc: true
- pgno: 240
  md: 'In KDE, you can use amarok to play music. To start amarok, choose Main Menu➜Multimedia➜Audio
    Player in KDE. You can create a playlist in amarok by searching music files on
    your hard drive. To play music, you can double-click a music file in the playlist.


    # Burning a CD/DVD


    Nowadays, GUI file managers often have the capability to burn CDs. For example,
    GNOME’s Nautilus File Manager has built-in features to burn CDs. The KDE desktop
    comes with K3b, which is a popular CD/DVD burning application.


    Most CD burning applications are simple to use. You basically gather up the files
    that you want to burn to the CD or DVD and then start the burning process. Of
    course, for this to work, your PC must have a CD or DVD burner installed.


    # Burning CD/DVDs with K3b


    Figure 14-4 shows the initial window of the K3b CD/DVD burning application in
    SUSE Linux. The upper part of the K3b window is for browsing the file system to
    select what you want to burn onto a CD or DVD. The upper-left corner shows the
    CD writer device installed; in this example, it’s a CD-RW/DVD drive so that the
    drive can read DVDs and CDs, but burn CDs only.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_240_0.png)


    Figure 14-4: You can burn CDs and DVDs with the K3b application.'
  merge: -1
  img_proc: true
- pgno: 241
  md: "To burn a CD or DVD using K3b, you follow these high-level steps:\n\n+   1.\
    \ Start K3b by choosing Main Menu→Multimedia→CD/DVD Burning.\n+   2. Start a new\
    \ project by clicking one of the project icons shown in the lower part of the\
    \ K3b window — New Audio CD Project, for example, or New Data DVD Project.\n+\
    \   3. Add files to the project. For an audio CD, you can drag and drop MP3 files\
    \ as well as audio tracks.\n+   4. Burn the project to the CD or DVD by choosing\
    \ Project→Burn or pressing Ctrl+B (or by clicking the Burn button in the project\
    \ pane of the K3b window). Doing so opens a dialog box in which you can set some\
    \ more options and click Burn to start burning the CD or DVD.\n\nAs a specific\
    \ example, here is how you can burn an audio CD using K3b:\n\n+   1. **Click the\
    \ New Audio CD Project icon on the lower pane of the K3b window — that’s the project\
    \ pane of K3b.**\n+   \n+      A project tab appears in the lower pane of the\
    \ K3b window, and a message tells you to drag and drop files and then click the\
    \ Burn button (the leftmost button on the project toolbar located near the middle\
    \ of the window, as you can see in Figure 14-5).\n+   \n+   2. **If you want to\
    \ copy tracks from an audio CD, put the CD in the drive and select the CD drive\
    \ from the drop-down list on the toolbar (see Figure 14-5).**\n+   \n+      K3b\
    \ displays the titles of the tracks from the audio CD.\n\n![](img/b7e91b81e0d84c8a5261ee14a48991b2_241_0.png)"
  merge: -1
  img_proc: true
- pgno: 242
  md: '+   3. **Select the tracks you want and click the Start Ripping button — the
    leftmost button on the toolbar above the list of tracks (see Figure 14-5).**


    K3b then displays a CD Ripping dialog box.


    +   4. **Click Start Ripping in the CD Ripping dialog box. When finished, click
    Close and eject the audio CD.**


    K3b extracts the tracks into separate files and stores them in a folder in your
    home directory. The folder name is based on the title of the audio CD album.


    +   5. **Click the Home folder on the top-left pane and click the folder with
    the ripped audio files (look for the audio CD album’s name). Select the files
    (they appear in the top-right pane) and drag and drop them in the lower pane.**


    +   6. **Repeat Steps 2 through 5 with other audio CD tracks. To add MP3 files,
    go to the folder with the MP3 files and drag and drop them in the lower pane of
    K3b.**


    Figure 14-6 shows a typical audio CD project with two ripped tracks and an MP3
    file.


    +   7. **When you are ready to burn the audio CD, insert a blank CD-R into the
    CD burner and click the Burn button.**


    K3b displays the Audio Project dialog box.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_242_0.png)'
  merge: -1
  img_proc: true
- pgno: 243
  md: '+   8. **Click Burn in the Audio Project dialog box.**


    K3b displays the Audio Project dialog box, in which you can set further options
    for the CD and then click Burn to start burning the audio CD. When everything
    is done, click Close to dismiss the dialog box.


    +   9. **You can burn more copies of the same audio CD project and when you''re
    done, choose File→Quit.**


    To burn a CD image (ISO file) onto a blank CD-R, choose Tools→Burn CD Image.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_243_0.png)


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_243_1.png)


    K3b needs the external command line programs `cdrecord` and `cdrdao` to burn CDs.
    K3b also needs the `growisofs` program to burn DVDs. These external programs should
    already be installed when you elect to install the KDE desktop during SUSE Linux
    installation following the steps outlined in Chapter 2.


    # Burning data CDs in Nautilus


    If you have a CD recorder attached to your system (it can be a built-in ATAPI
    CD recorder or an external one attached to the USB port), you can use Nautilus
    from the GNOME desktop to burn data CDs. From a Nautilus object window, you can
    access the CD Creator built in to Nautilus. Just follow these simple steps:


    +   1. **In any Nautilus object window, choose Places→CD/DVD Creator.**


    Nautilus opens a CD Creator object window.


    *Note:* If you don''t have any Nautilus object windows open, just double-click
    the Computer icon on the desktop.


    +   2. **From other Nautilus windows, drag and drop into the CD Creator window
    whatever files and folders you want to put on the CD.**


    To get to files on your computer, double-click the Computer icon to open it in
    Nautilus and find the files you want. Then drag and drop those file or folder
    icons into the CD Creator window.


    +   3. **From the CD Creator window, choose File→Write to Disc.**


    Nautilus displays a dialog box in which you can select the CD recorder, the write
    speed, and several other options, such as whether to eject the CD when done. You
    can also specify the CD title.


    +   4. **Click the Write button.**


    Nautilus burns the CD.'
  merge: -1
  img_proc: true
