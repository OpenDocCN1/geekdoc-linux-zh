- pgno: 287
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_287_0.png)


    For example, if you are connecting a scanner to your SUSE Linux PC, you would
    use YaST Control Center➜Hardware➜Scanner to set up the scanner.


    As the right pane in Figure 17-5 shows, the YaST Control Center’s Hardware category
    provides access to the following device configuration tools:


    +   - **Bluetooth:** Enable or disable Bluetooth services and configure Bluetooth
    when enabled (for example, configure Bluetooth security settings).

    +   - **CD-ROM Drives:** Mount all detected CD/DVD drives on the Linux file system.

    +   - **Disk Controller:** Configure any configurable disk controller in the PC.

    +   - **Graphics Card and Monitor:** Change to text-mode display or configure
    the X Window System. (For example, specify the graphics card and monitor type
    and change the display resolution and number of colors.)

    +   - **Hardware Information:** Detect all hardware and display information about
    each hardware device in the system.

    +   - **IDE DMA Mode:** Change the direct memory access (DMA) settings for disk
    drives and CD/DVD drives connected to the PC’s IDE controller.

    +   - **Infrared Device:** Configure any infrared link on the PC.

    +   - **Joystick:** Configure a joystick connected to the sound card’s joystick
    port. (You do not need to configure a USB joystick; just plug the joystick into
    the USB port and start using it.)

    +   - **Keyboard Layout:** Specify the keyboard layout (based on the language
    such as UK English, US English, French, and so on).

    +   - **Mouse Model:** Specify the type of mouse (should be detected automatically,
    otherwise you would have trouble getting the graphical desktop to start).

    +   - **Printer:** Configure a printer.'
  merge: -1
