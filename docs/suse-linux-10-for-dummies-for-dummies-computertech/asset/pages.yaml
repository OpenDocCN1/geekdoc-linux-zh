- pgno: 220
  md: '+   - **Formula bar:** Provides a field where you can enter formulas, create
    sums, and launch the Function Wizard.

    +   - **Toolbar:** Located along the left side of the window, it provides buttons
    that you can use to perform common tasks, such as inserting graphics, sorting
    cells, checking spelling, and grouping cells.

    +   - **Tabs:** Located along the bottom of the spreadsheet, they enable you to
    work with different sheets in the same file.

    +   - **Status bar:** Displays information about the current sheet (the current
    sheet number, the page style, and so on). You can also click various elements
    in the status bar to change settings, such as the text selection mode and the
    zoom factor for viewing the spreadsheet.


    In addition to these tool and icon bars, the largest part of the Calc window is
    the work area where your spreadsheet appears and where you focus most of your
    attention.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_220_0.png)


    Use the tooltips to find out what an icon or menu option does. Mouse over a toolbar
    icon or a menu item, and Calc displays a small tooltip window with a brief help
    message.


    **Note:** Curious about that Function Wizard icon that''s pointed out in Figure
    12-10? Check out the section “Calculating and charting data,” later in this chapter,
    where I show you how to use that handy little feature.


    You can configure Calc through the Tools➪Options dialog box. On the left side
    of the dialog box, click the plus sign (+) next to Spreadsheet. The plus sign
    turns to a minus sign (−), and a number of different categories of options appear
    (as shown in Figure 12-11). You can then click each category to configure various
    aspects of Calc.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_220_1.png)


    **Figure 12-11:** Set up Calc from the Spreadsheet category in the Tools➪Options
    dialog box.'
