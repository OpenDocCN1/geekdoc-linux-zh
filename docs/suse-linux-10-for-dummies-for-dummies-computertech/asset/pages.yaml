    \ formulas — and a small frame for the formula appears in the document. The formula\
    \ is typсет in that frame.\n+   \n+   2. **Select a formula type from the top\
    \ two rows of the Selection window.**\n+   \n+      The lower rows in the Selection\
    \ window show available formulas of that type. For example, the summation category\
    \ (denoted by an uppercase Greek letter sigma) includes integral signs.\n+   \n\
    +   3. **Click a specific formula, such as an integral.**\n+   \n+      The Math\
