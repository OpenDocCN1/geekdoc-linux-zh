- pgno: 155
  md: '# Chapter 9


    # # Browsing the Web


    # *In This Chapter*


    +   - Discovering the World Wide Web

    +   - Understanding a URL

    +   - Taking stock of Web browsers in SUSE Linux

    +   - Web browsing with Konqueror in KDE

    +   - Web browsing with Mozilla in GNOME

    +   - Introducing Epiphany and Firefox in GNOME


    You probably already know about the Web, but did you know that the Web, or more
    formally the World Wide Web, made the Internet what it is today? The Internet
    has been around for quite a while, but it did not reach a mass audience until
    the Web came along in 1993.


    Before the Web came along, you had to use ancient UNIX commands to download and
    use files, which were simply too complicated for most of us. With the Web, however,
    anyone can enjoy the benefits of the Internet by using a _Web browser_ — a graphical
    application that downloads and displays Web documents. A click of the mouse is
    all you need to go from reading a document from your company Web site to downloading
    a video clip from across the country.


    In this chapter, I briefly describe the Web and introduce you to the Web browsers
    in KDE and GNOME. In KDE, the primary Web browser is Konqueror, which also doubles
    as a file manager. In GNOME, you have a choice of three Web browsers — Mozilla,
    Firefox, and Epiphany. I introduce you to all of these Web browsers in this chapter,
    but after you have used one Web browser, you can easily use any other Web browser.


    # ## Understanding the World Wide Web


    If you have used a file server at work, you know the convenience of sharing files.
    You can use the word processor on your desktop to get to any document on the shared
    server.'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'Now imagine a word processor that enables you to open and view a document that
    resides on any computer on the Internet. You can view the document in its full
    glory, with formatted text and graphics. If the document makes a reference to
    another document (possibly residing on yet another computer), you can open that
    linked document by clicking the reference. That kind of easy access to distributed
    documents is essentially what the World Wide Web provides.


    Of course, the documents have to be in a standard format, so that any computer
    (with the appropriate Web browser software) can access and interpret the document.
    And a standard protocol is necessary for transferring Web documents from one system
    to another.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_156_0.png)


    The standard Web document format is *Hypertext Markup Language* (HTML), and the
    standard protocol for exchanging Web documents is *Hypertext Transfer Protocol*
    (HTTP). HTML documents are text files and don’t depend on any specific operating
    system, so they work on any system from Windows and Mac to any type of UNIX and
    Linux.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_156_1.png)


    A *Web server* is software that provides HTML documents to any client that makes
    the appropriate HTTP requests. A *Web browser* is the client software that actually
    downloads an HTML document from a Web server and displays the contents graphically.


    # ## Links and URLs


    Like the pages of real books, Web pages contain text and graphics. Unlike real
    books, however, Web pages can include multimedia, such as video clips, sound,
    and links to other Web pages that can actually take you to those Web pages.


    The links in a Web page are references to other Web pages that you can follow
    to go from one page to another. The Web browser typically displays these links
    as underlined text (in a different color) or as images. Each link is like an instruction
    to you — something like, “For more information, please consult Chapter 4,” that
    you might find in a real book. In a Web page, all you have to do is click the
    link; the Web browser brings up the referenced page, even though that document
    may actually reside on a faraway computer somewhere on the Internet.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_156_2.png)


    The links in a Web page are referred to as *hypertext links* because when you
    click a link, the Web browser jumps to the Web page referenced by that link.


    This arrangement brings up a question. In a real book, you might refer the reader
    to a specific chapter or page in the book. How does a hypertext link indicate
    the location of the referenced Web page? In the World Wide Web, each Web page
    has a special name, called a *Uniform Resource Locator* (URL). A URL uniquely
    specifies the location of a file on a computer. Figure 9-1 shows the parts of
    a URL.'
