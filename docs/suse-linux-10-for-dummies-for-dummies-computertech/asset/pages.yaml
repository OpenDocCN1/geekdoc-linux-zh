- pgno: 335
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_335_0.png)


    Figure 20-1: From KDE Center’s Login Manager, you can enable auto-login for a
    user.


    +   7. Click the User drop-down menu and select the user account that you want
    to use for auto-login. Then click Apply.


    If the Enable Auto-Login box is not checked, click on it until it shows a checkmark.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_335_1.png)


    Although auto-login is convenient, it’s definitely not good for security. You
    should enable auto-login only if you are using the SUSE Linux system in a safe
    environment such as your home. Otherwise, turn auto-login off from the Convenience
    tab mentioned in Step 6.


    # If My System Crashes, Can I Press the Reset Button to Reboot?


    Even though your mouse or keyboard seems to be dead, this does not necessarily
    mean that everything in your system has crashed. Therefore, you should not immediately
    reach for the reset button.


    In case it’s the GUI desktop that’s hung, press Ctrl+Alt+Backspace to kill the
    X server and restart it. If this works, you should see a graphical login screen
    from which you can log in again.'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'If restarting X does not help, press **Ctrl+Alt+F2** and see if you can get
    a text console with a login prompt. If you see the login prompt, login with your
    username and password. Then type **su -** and type the root password to become
    root. After that, type **reboot** to safely reboot the PC.


    If you don’t get a text console by pressing Ctrl+Alt+F2, try to log in to the
    system from another machine on the network (type **ssh** followed by your SUSE
    Linux system’s IP address). You can become root by typing **su -** and then type
    **reboot** to reboot the PC. Of course, this last option works only if you have
    multiple PCs in a local area network.


    If nothing works, just wait some time, make sure that there is no hard drive activity
    (many PCs have a light that blinks when the hard drive is active; the hard drive
    also makes noise that you may be able to hear), and then press the reset button.


    # How Can I Schedule a Command to Run Every 30 Minutes?


    You can run a command or a script (which is a file containing other commands)
    every so often by using crontab. You schedule recurring jobs by placing job information
    in a file with a specific format and submitting this file with the crontab command.
    A program called crond checks the job information every minute and executes the
    recurring jobs at the specified times. Because the crond runs recurring jobs,
    such jobs are also referred to as cron jobs.


    To submit a cron job, follow these steps:


    +   1. **Prepare a shell script (or an executable program in any programming language)
    that can perform the recurring task you want to perform.**


    You can skip this step if you want to execute an existing program periodically.


    +   2. **Prepare a text file with information about the times when you want the
    shell script or program (from Step 1) to execute, and then submit this file by
    using crontab.**


    You can submit several recurring jobs with a single file. Each line with timing
    information about a job has a standard format with six fields — the first five
    specify when the job runs, and the sixth and subsequent fields constitute the
    actual command that runs. For example, here is a'
  merge: -1
  img_proc: true
- pgno: 337
  md: 'line that executes the myjob shell script in a user’s home directory every
    30 minutes:


    ```

    ```text

    0,30 * * * * $HOME/myjob

    ```

    ```


    **3. Suppose the text file jobinfo (in the current directory) contains the job
    information. Submit this information to crontab with the following command:**


    ```

    ```text

    crontab jobinfo

    ```

    ```


    That’s it! You are set with the cron job. From now on, the cron job runs at regular
    intervals (as specified in the job information file), and you receive mail messages
    with the output from the job.


    To verify that the job is indeed scheduled, type the following command:


    ```

    ```text

    crontab -l

    ```

    ```


    The output of the crontab -l command shows the cron jobs currently installed in
    your name. To remove your cron jobs, type **crontab -r**.


    # How Can I Find All the Huge Files on My SUSE Linux System?


    You can type a one-line incantation to do this job for you. Here are the steps:


    +   1. If you are at a graphical desktop such as KDE or GNOME, open a terminal
    window.

    +   2. Type `su -` and then enter the root password to become root.

    +   3. Now type the following command (change 50000k, which stands for 50,000KB
    or about 50MB, to whatever you consider to be a large file):


    ```

    ```text

    find / -xdev -type f -size +50000k -ls | sort -n -k 7,7 > bigfiles

    ```

    ```


    This command line starts with the `find` command to find the files whose size
    exceeds 50,000KB (that’s what the option `-size +50000k` means). The part after
    the vertical bar (`|`) sorts the files by size, and `> bigfiles` means the output
    is saved in a file named bigfiles in the current directory. The end result is
    that the list of large files, sorted by size, would be in a file named bigfiles
    in the current directory. To view the list, type **more bigfiles**.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Where Can I Find More SUSE RPMs?


    Software for SUSE Linux is usually distributed in the form of RPM files. That’s
    why it’s common to refer to the software as RPM. You would want to find RPMs that
    are meant for SUSE Linux (as opposed to RPMs meant for Red Hat or Fedora). One
    good place to look for SUSE RPMs is the Packman site at the following URL:


    ```

