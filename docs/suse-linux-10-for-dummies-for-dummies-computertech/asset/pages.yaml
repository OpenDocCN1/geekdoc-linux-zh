- pgno: 137
  md: '# Chapter 8


    # Setting Up an Ethernet LAN

    with Wireless Access


    # In This Chapter


    +   - Setting up an Ethernet LAN

    +   - Connecting your LAN to the Internet

    +   - Extending your network’s reach with wireless

    +   - Checking whether your network is up and running


    You might use an Ethernet network for your local area network (LAN) — at your
    office or even your home (if you happen to have several systems at home). Even
    if you have a single PC, you may need to set up an Ethernet network interface
    so that you can connect your PC to high-speed Internet access that uses a DSL
    or cable modem. (I cover DSL and cable modems in Chapter 7.) In this chapter,
    I explain how to set up an Ethernet network.


    If you want to surf the Internet from anywhere in your home with your laptop PC,
    you can do so by adding wireless to your network. In the last part of this chapter,
    I show you how to set up wireless networking for connecting to an Ethernet LAN
    and accessing the Internet.


    # Getting a Handle on Ethernet


    Ethernet is a standard way to move packets of data between two or more computers
    connected to a single hub. (You can create larger networks by connecting multiple
    Ethernet segments with gateways.) To set up an Ethernet local area network (LAN),
    you need an Ethernet card for each PC. Linux supports a wide variety of Ethernet
    cards for the PC.'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'Ethernet is a good choice for the physical data-transport mechanism for the
    following reasons:


    +   - Ethernet is a proven technology that has been in use since the early 1980s.

    +   - Ethernet provides good data-transfer rates: Typically 10 million bits per
    second (10 Mbps), although 100-Mbps Ethernet and Gigabit Ethernet (1,000 Mbps)
    are now available.

    +   - Ethernet hardware is often built in to the PC or can be installed at a relatively
    low cost. (PC Ethernet cards cost about $10 to $20 U.S.)

    +   - With wireless Ethernet, you can easily connect laptop PCs to your Ethernet
    LAN — without having to run wires all over the place. I explain wireless Ethernet
    later in this chapter.


    # Connecting PCs to an Ethernet LAN


    Any time you hear experts talking about Ethernet, you’re also going to hear some
    bewildering terms used for the cables that carry the data. Here’s a quick rundown.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_138_0.png)


    Nowadays, the most popular form of Ethernet cabling is unshielded twisted-pair
    cable (UTP), known as 10BaseT or 100BaseT (because it can support data rates up
    to 100 megabits per second). Other Ethernet cabling options include 100BaseT4,
    100BaseT2, and 100BaseTX for 100 Mbps Ethernet and 1000BaseT for Gigabit Ethernet.
    The Electronic Industries Association/Telecommunications Industries Association
    (EIA/TIA) defines the following categories of shielded and unshielded twisted-pair
    cables:


    +   - Category 1 (Cat 1): Traditional telephone cable.

    +   - Category 2 (Cat 2): Cable certified for data transmissions up to 4 Mbps.

    +   - Category 3 (Cat 3): Cable that can carry signals up to a frequency of 16
    MHz. Cat 3 is the most common type of wiring in old corporate networks and it
    normally contains four pairs of wire. Considered obsolete nowadays.

    +   - Category 4 (Cat 4): Cable that can carry signals up to a frequency of 20
    MHz. Cat 4 wires are not that common. Considered obsolete nowadays.

    +   - Category 5 (Cat 5): Cable that can carry signals up to a frequency of 100
    MHz. Cat 5 cables normally have four pairs of copper wire. Cat 5 UTP is the most
    popular cable used in new installations today. This category of cable is being
    replaced by Category 5e (enhanced Cat 5).'
  merge: -1
  img_proc: true
- pgno: 139
  md: '+   - **Category 5e (Cat 5e):** Similar to Cat 5, but with improved technical
    parameters such as near-end cross talk and attenuation. Cat 5e cables support
    10BaseT, 100BaseT4, 100BaseT, 100BaseTX, and 1000BaseT Ethernet. Nowadays Cat
    5e is the minimum acceptable wiring.

    +   - **Category 6 (Cat 6):** Similar to Cat 5e, but capable of carrying signals
    up to a frequency of 250 MHz. Cat 6 cables can support all existing Ethernet standards
    and are expected to support Gigabit Ethernet standard 1000BaseTX that will use
    two pairs of wires in each direction as opposed to all four pairs for 1000BaseT
    Ethernet over Cat 5e cables.


    To set up a 10BaseT or 100BaseT Ethernet network, you need an Ethernet hub — a
    hardware box with RJ-45 jacks. (These look like telephone jacks.) You build the
    network by running twisted-pair wires (usually, Category 5, or Cat5, cables) from
    each PC’s Ethernet card to this hub. You can get a 4-port 10/100BaseT hub for
    about $40 U.S. Figure 8-1 shows a typical small 10BaseT or 100BaseT Ethernet LAN
    that you may set up at a small office or your home.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_139_0.png)


    When you install SUSE Linux from this book’s companion DVD on a PC that has an
    Ethernet card, the Linux kernel automatically detects the Ethernet card and installs
    the appropriate drivers. The SUSE Linux installer, YaST, also lets you set up
    TCP/IP networking.'
  merge: -1
  img_proc: true
- pgno: 140
  md: "![](img/b7e91b81e0d84c8a5261ee14a48991b2_140_0.png)\n\nThe Linux kernel loads\
    \ the driver for the Ethernet card every time it boots.\nTo verify that the Ethernet\
    \ driver is loaded, type the following command in a\nterminal window:\n\n```\n\
    dmesg | grep eth0\n```\n\nOn one of my PCs, I get the following output when I\
    \ type that command:\n\n```\neth0: RealTek RTL8139 at 0xf0d16000, 00:0c:76:f4:38:b3,\
    \ IRQ 161\neth0: Identified 8139 chip type 'RTL-8101'\neth0: link up, 100Mbps,\
    \ full-duplex, lpa 0x45E1\neth0: no IPv6 routers present\n```\n\nYou should see\
    \ something similar, showing the name of your Ethernet card\nand other related\
    \ information.\n\n# Configuring the Ethernet Network\n\nWhen you set up the network\
    \ during SUSE Linux installation, the installation\nprogram prepares all appropriate\
    \ configuration files using the information\nyou provide. You therefore typically\
    \ never have to manually configure the\nnetwork. However, SUSE Linux comes with\
    \ GUI tools to configure the network\ndevices, just in case something needs changing.\n\
    \nTo configure the Ethernet network interface, follow these steps:\n\n+   1. **Choose\
    \ Main Menu→System→YaST from the KDE desktop (choose Desktop Menu→YaST from the\
    \ GNOME desktop).**\n+   \n+      This opens the YaST Control Center.\n+   \n\
    +   2. **Select Network Devices on the left-hand pane of the YaST Control Center\
    \ window and Network Card on the right-hand pane.**\n+   \n+      YaST then brings\
    \ up a window (shown in Figure 8-2) with information about the already configured\
    \ network card and any new network cards that it detects.\n+   \n+   3. **Select\
    \ your network card (assuming it’s not yet configured) and click Configure. To\
    \ change an already configured card, click Change.**\n+   \n+      Provide the\
    \ requested information such as how the IP address is obtained (typically, the\
    \ answer is DHCP or dynamic)."
  merge: -1
  img_proc: true
- pgno: 141
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_141_0.png)


    **Figure 8-2:** Configure the Ethernet network card with YaST.


    # Connecting Your LAN to the Internet


    If you have a LAN with several PCs, you can connect the entire LAN to the Internet
    by using DSL or a cable modem. Basically, you can share the high-speed DSL or
    cable modem connection with all the PCs in the LAN.


    In Chapter 7, I explain how to set up a DSL or cable modem. In this section, I
    briefly explain how to connect a LAN to the Internet so that all the PCs can access
    the Internet.


    The most convenient way to connect a LAN to the Internet via DSL or cable modem
    is to buy a hardware device called DSL/Cable Modem/NAT Router with a 4- or 8-port
    Ethernet hub. NAT stands for *Network Address Translation*, and the NAT router
    can translate many private IP addresses into a single externally known IP address.
    The Ethernet hub part appears to you as a number of RJ-45 Ethernet ports where
    you can connect the PCs to set up a LAN. In other words, you need only one extra
    box besides the DSL or cable modem.


    Figure 8-3 shows how you might connect your LAN to the Internet through a NAT
    router with a built-in Ethernet hub. Of course, you need a DSL or cable modem
    hookup for this scenario to work (and you have to sign up with the phone company
    for DSL service or with the cable provider for cable Internet service).'
  merge: -1
  img_proc: true
- pgno: 142
  md: '![](img/b7e91b81e0d84c8a5261ee14a48991b2_142_0.png)


    **Figure 8-3:** Connect your LAN to the Internet through a NAT router with a built-in
    Ethernet hub.


    When you connect a LAN to the Internet, the NAT router acts as a gateway for your
    LAN. The NAT router also dynamically provides IP addresses to the PCs in your
    LAN. Therefore, on each PC, you have to set up the networking options to obtain
    the IP address dynamically.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_142_1.png)


    Your LAN can mix and match all kinds of computers — some may be running Linux
    and some may be running Microsoft Windows or any other operating system that supports
    TCP/IP. When configuring the network settings, remember to select the option that
    enables Linux to automatically obtain IP address settings and DNS information
    with DHCP.


    # ## Extending Your LAN with a Wireless Network


    If you have a laptop computer that you want to connect to your LAN — or if you
    don’t want to run a rest of wires to connect a PC to the LAN — you have the option
    of using a wireless Ethernet network. In a typical scenario, you have a cable
    modem or DSL connection to the Internet, and you want to connect one or more laptops
    with wireless network cards to access the Internet through the cable or DSL modem.
    In the following sections, I explain wireless networking and how to set it up
    on your network.'
