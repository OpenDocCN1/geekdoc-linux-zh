    +   - **Contacts:** Opens your contact list, where you can add new contacts or
    look up someone from your current list.

    +   - **Calendars:** Opens your calendar, where you can look up and add appointments.

    +   - **Tasks:** Shows your task (“to do”) list, where you can add new tasks and
    check what’s due when.


    As this icon summary shows, Evolution has all the necessary components of a PIM
    — e-mail, contacts, calendar, and task lists.


    To access your e-mail, click the Mail icon and then click Inbox on the left pane.
    Evolution opens your inbox, as shown in Figure 10-5. If you turn on the feature
    to automatically check for mail every 50, Evolution prompts you for your mail
    password and downloads your mail. To manually download mail, just click the Send/Receive
    button on the toolbar (if you haven’t asked Evolution to store your password,
    it prompts you for your mail password).


    The e-mail Inbox looks very much like any other mail reader’s inbox, such as the
    Outlook Express Inbox. Most of the time, you can click the toolbar buttons to
    do most anything you want to do with the e-mail messages. If you have used any
    GUI mail reader — from Microsoft Outlook Express to Novell GroupWise — you find
    Evolution’s toolbar buttons familiar.


    To read a message, click the message in the upper window of the Inbox and the
    message text appears in the lower window.


    To reply to the current message, click the Reply button on the toolbar (or click
    Reply to All to send a reply to all the addressees). A message composition window
    pops up. You can write your reply and then click the Send button on the message
    composition window’s toolbar to send the reply. Simple, isn’t it?


    To send a new e-mail, select New↔Mail Message on the Evolution toolbar. A new
    message composition window appears; you can type your message in that window,
    and when you’re finished composing the message, click Send.


