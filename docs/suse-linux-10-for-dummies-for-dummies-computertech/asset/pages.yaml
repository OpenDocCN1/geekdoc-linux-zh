    drwxr-xr-x  3 root root  136 2005-08-10 17:47 xinit

    total 77

    ... lines deleted ...

    ```


    This listing shows considerable information about every directory entry — each
    of which can be a file or another directory. Looking at a line from the right
    column to the left, you see that the rightmost column shows the name of the directory
    entry. The date and time before the name show when the last modifications to that
    file were made. To the left of the date and time is the size of the file in bytes.


    The file’s group and owner appear to the left of the column that shows the file
    size. The next number to the left indicates the number of links to the file. (A
    link is like a shortcut in Windows.) Finally, the leftmost column shows the file’s
    permission settings, which determine who can read, write, or execute the file.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_110_0.png)


    The first letter of the leftmost column has a special meaning, as the following
    list shows:


    +   - If the first letter is `l`, the file is a **symbolic link** (a shortcut)
    to another file.

    +   - If the first letter is `d`, the file is a directory.

    +   - If the first letter is a dash (`-`), the file is normal.

    +   - If the first letter is `b`, the file represents a block device, such as
    a disk drive.

    +   - If the first letter is `c`, the file represents a character device, such
    as a serial port or a terminal.'
