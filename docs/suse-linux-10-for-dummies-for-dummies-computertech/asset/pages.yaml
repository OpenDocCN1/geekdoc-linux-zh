- pgno: 329
  md: '# Chapter 20


    # Ten Frequently Asked

    Questions about SUSE


    # In This Chapter


    +   - What does SUSE stand for?

    +   - Where can I find answers to SUSE Linux questions?

    +   - When is the next SUSE release?

    +   - Can I get ISO files for SUSE Linux from the Internet?

    +   - How do I do an FTP install of SUSE Linux?

    +   - How can I auto-login to KDE as another user?

    +   - How can I reboot after an apparent crash?

    +   - How do I schedule a command to run every 30 minutes?

    +   - How can I find all the huge files on my system?

    +   - Where can I find SUSE RPMs?


    If you are new to SUSE Linux, you probably have lots of questions about SUSE (even
    if you already know Linux). I had questions when I first started using SUSE Linux,
    and I have been using Linux since 1991. Frequently Asked Questions — FAQs — are
    the time-honored solutions to providing answers to common questions about a specific
    subject. In this chapter, I present ten such frequently asked questions about
    SUSE Linux. These are the questions that, in my opinion, are likely to be asked
    by beginners and experienced Linux users alike. I hope you find an answer or two
    that help you do your job with SUSE Linux.


    # What Does SUSE Stand for and

    How Do You Pronounce It?


    The acronym SUSE came from the German name *Software und System Entwicklung* (Software
    and System Development). SUSE is pronounced *soo-suh*.'
  merge: -1
  img_proc: true
- pgno: 330
  md: 'The distribution was originally referred to by a mixed-case name: SuSE. Now,
    however, the distribution’s name is written in all uppercase: SUSE. Eventually,
    SUSE’s origins as an acronym will probably be forgotten, and it will be thought
    of as a name that doesn’t stand for anything at all.


    # How Can I Find Answers to

    My SUSE Linux Questions?


    You can find helpful information about SUSE Linux at many online resources. Start
    with www.suse.com. Choose Support➪knowledgebase from that Web page’s menu. Then
    select SUSE as the product, type in one or more keywords, and click Search Now.


    If you don’t find the answer at www.suse.com, try searching newsgroups through
    the Advanced Groups Search on Google Groups:


    ```

    http://groups.google.com/advanced_group_search?hl=en

    ```


    Type the search terms you prefer. You can even set the date ranges for the articles
    to search.


    If the newsgroup search does not give you the answer, do a Linux search on Google
    by visiting the search page at


    ```

    http://www.google.com/linux

    ```


    Type the search words and press Enter or click Google Search. For SUSE-specific
    answers, type **SUSE** in addition to the search words.


    If you also want to search the SUSE mailing lists, visit www.google.com and type
    **lists:suse:lists.suse.com** followed by the search words. For example, to search
    for DVD movie player you would type **lists:suse:lists.suse.com DVD movie player**
    into the search field.


    One of these online searches should get you the answer to your question. If not,
    you can post a question at one of the forums such as www.suseforums.com that are
    listed in Chapter 22.


    # When Is the Next SUSE Linux Release?


    Everyone wants to know the answer to this question, including myself! Of course,
    the correct answer is, “Whenever Novell decides to release it.” Based on past
    history, however, a new SUSE release seems to appear about every'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'six months. And now that SUSE is being developed through the Novell-sponsored
    openSUSE project, you can find the latest SUSE milestones at www.opensuse.org/index.php/Roadmap.


    # Can I Get ISO Files for SUSE Linux from the Internet?


    Prior to version 10.0, you used to have to wait for several weeks after the release
    of a new version of SUSE Linux before Novell made available for free the ISO image
    files for that version. With Novell having sponsored and established the openSUSE
    project in August 2005, the ISO files for the latest version of SUSE Linux are
    always available from www.opensuse.org/index.php/Download and from many mirror
    sites on the Internet.


    # How Do I Do an FTP Install of SUSE Linux?


    Say that you have this book in hand, but a later version of SUSE Linux is now
    available for FTP install. Instead of installing the version on the companion
    CD or DVD, you can easily do an FTP install.


    To install SUSE Linux from one of many FTP servers that mirror the latest SUSE
    distribution, you have to perform the following major steps:


    +   1. Download the SUSE boot image from the FTP server and burn a CD with that
    image.

    +   2. Make a note of the FTP server’s IP address and the directory where the
    SUSE distribution’s files are located.

    +   3. Boot the PC with the boot CD and then type a command at the boot prompt
    to begin an FTP install from the FTP server that you identify by its IP address.


    If you have a PC that runs Windows and has a high-speed Internet connection, you
    can use that PC to download the boot image and burn the boot CD. You can also
    use the PC to look up the IP address of the FTP server.


    You also need to know the name of the network card installed in your PC because
    you have to manually load the driver before you can start the SUSE FTP install.
    You can find the FTP server’s IP address when you download the SUSE installer’s
    boot image. I explain the steps in this section.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_331_0.png)'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'Installing SUSE from an FTP server can take two hours or more over a typical
    broadband DSL or cable modem connection to the Internet. Follow these steps to
    do an FTP install from an FTP server over the Internet.


    +   1. **Use a Web browser to open the list of FTP servers at www.suse.com/us/private/download/ftp/intl_mirrors.html
    and find an FTP server near you that’s marked complete (that means the server
    has the complete SUSE distribution and all updates).**


    The list of servers is organized by country, and it includes both FTP and HTTP
    (Web) servers. Go to the country nearest yours and pick the nearest server that’s
    marked complete.


    ![](img/b7e91b81e0d84c8a5261ee14a48991b2_332_0.png)


    In a terminal window, type **ping** followed by the name of the FTP server (for
    example, **mirror.mcs.anl.gov**). You’ll then see the IP address of the FTP server
    on the next line (for example, 140.221.37.130). Write down that IP address for
    use later on. If you are performing this step in Microsoft Windows, you also use
    the ping command, but type the command in a Command Prompt window (choose Start➔Run
    and type **cmd** and press Enter).


    +   2. **Click your FTP server link and find the directory that contains the boot.iso
    file — that’s the SUSE installer’s boot image.**


    The directory depends on the version of SUSE. For example, for version 10.0, the
    **boot.iso** file is in the FTP server’s **pub/suse/i386/10.0/boot/** directory.
    The file is several tens of megabytes in size.


    +   3. **Download the boot.iso file and save it.**


    +   4. **Burn the boot.iso image onto a CD.**


    Use your PC’s CD burner application to burn the ISO image named **boot.iso**.


    +   5. **Go to the PC on which you want to do the SUSE FTP install, insert the
    boot CD, and restart the PC.**


    If your PC isn’t set up to boot from the CD/DVD drive, you have to enter SETUP
    (by pressing a key such as F2 as the PC powers up) and change the order of the
    boot devices.


    The PC reboots and, after a few moments, a text screen displays a screen with
    a number of options. Use the arrow keys to move between list items and the buttons
    on the screen.


    +   6. **Use the arrow keys to select the Installation option and press Enter.**


    This step loads a Linux kernel and runs the installer. After detecting and initializing
    the hardware, the installer displays a message saying that it cannot find the
    SUSE Linux installation source and is activating a manual setup program. This
    result is normal, and you should press Enter to continue. The installer shows
    a list of languages.'
  merge: -1
  img_proc: true
