  md: 'If you want to change the background of a specific desktop, click the Setting
    for Desktop drop-down list. From the list of desktops, you can select the desktop
    whose background you want to change.


    For a colored background, select the No Picture radio button. From the Colors
    drop-down list, you can select either a single color background or a variety of
    color gradients (meaning the color changes gradually from one color to another)
    or a picture (an image used as a background). You can then pick the two colors
    by clicking the color buttons that appear under the Colors drop-down list. After
    making your selections, click Apply to try out the background. (If you don’t like
    what you get, click Reset to revert back to the previous background.)


    The default KDE desktop uses a picture as the background. If you want to use a
    different picture as background, select the Picture radio button and then click
    the folder icon next to that radio button. A dialog box comes up, showing the
    JPEG images in the /usr/share/wallpaper directory. You can select any one of these
    images or pick an image from another directory and click OK. Then click the Apply
    button in the KDE Control Center to apply this wallpaper to the desktop. If you
    don’t like the appearance, click Reset.


    # Getting to Know GNOME


    GNOME (pronounced *Guh-NOME*) is another GUI for SUSE Linux. The acronym GNOME
    stands for *GNU Network Object Model Environment* (and GNU, as you probably know,
    stands for *GNU’s not UNIX*). GNOME is a graphical user interface (GUI) and a
    programming environment. From the user’s perspective, GNOME is like Microsoft
    Windows. Behind the scenes, GNOME has many features that allow programmers to
    write graphical applications that can work together well. In this chapter, I point
    out only some key features of the GNOME GUI, leaving the details for you to explore
    on your own at your leisure.


    If you’re curious, you can always find out the latest information about GNOME
    by visiting the GNOME home page at www.gnome.org.


    If you installed GNOME as your desktop, you see the GNOME GUI desktop (refer to
    Figure 5-2) after you log in. The GNOME desktop is very similar to the Windows
    desktop albeit with two taskbars — one at the top and the other at the bottom
    of the screen, and icons for folders and applications appear directly on the desktop.'
