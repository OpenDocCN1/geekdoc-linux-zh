- pgno: 305
  md: '# Chapter 19


    # Securing SUSE Linux


    # In This Chapter


    +   - Understanding host and network security issues

    +   - Getting familiar with computer security terminology

    +   - Practicing good host security

    +   - Securing the network

    +   - Keeping up with security news and updates


    In this chapter, I explain why you need to worry about security and give you a
    high-level view of how to get a handle on security. I explain the two key aspects
    of security — host security and network security — and introduce you to the terminology
    used in discussing computer security. Then I provide an overview of how to secure
    the host (the stand-alone PC) and the network. Finally, I end by pointing out
    a few resources that can help you keep up with security news and updates.


    # Why Worry about Security?


    In today’s networked world, you have to worry about your SUSE Linux system’s security.
    For a stand-alone system, or a system used in an isolated local area network (LAN),
    you have to focus on protecting the system from the users and the users from one
    another. In other words, you don’t want a user to modify or delete system files,
    whether intentionally or unintentionally. Also, you don’t want a user destroying
    another user’s files.


    If your SUSE Linux system is connected to the Internet, you have to secure the
    system from unwanted accesses over the Internet. These intruders — or crackers,
    as they are commonly known — typically impersonate a user, steal or destroy information,
    and even deny you access to your own system (known as a Denial of Service or DoS
    attack).


    By its very nature, an Internet connection makes your system accessible to any
    other system on the Internet. After all, the Internet connects a huge number of
    networks across the globe. In fact, the client/server architecture of'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'Internet services, such as HTTP (web) and FTP, rely on the wide-open network
    access the Internet provides. Unfortunately, the easy accessibility to Internet
    services running on your system also means that anyone on the Net can easily access
    your system.


    If you operate an Internet host that provides information to others, you certainly
    want everyone to access your system’s Internet services, such as FTP and Web servers.
    However, these servers often have vulnerabilities that crackers may exploit in
    order to cause harm to your system. You need to know about the potential security
    risks of Internet services — and the precautions you can take to minimize the
    risk of someone exploiting the weaknesses of your FTP or Web server.


    You also want to protect your company’s internal network from outsiders, even
    though your goal is to provide information to the outside world through a Web
    or FTP server. You can protect your internal network by setting up an Internet
    firewall — a controlled access point to the internal network — and placing the
    Web and FTP servers on a host outside the firewall.


    # Understanding Linux Security


    To secure a Linux system, you have to tackle two broad categories of security
    issues:


    +   - **Host security issues** that relate to securing the operating system and
    the files and directories on the system

    +   - **Network security issues** that refer to the threat of attacks over the
    network connection


    # Understanding the host security issues


    Here are some high-level guidelines to address host security (I cover some of
    these topics in detail later in this chapter):


    +   - When installing SUSE Linux, select only the package groups that you need
    for your system. Don’t install unnecessary software. For example, if your system
    is used as a workstation, you don’t have to install most of the servers (Web server,
    news server, and so on).

    +   - Create initial user accounts and make sure all passwords are strong enough
    that password-cracking programs can’t “guess” them. SUSE Linux includes tools
    to enforce strong passwords.'
