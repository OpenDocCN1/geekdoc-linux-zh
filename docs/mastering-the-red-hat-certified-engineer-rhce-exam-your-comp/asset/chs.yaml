  \n# 第 10 章现实世界的应用\n\n## 引言\n\n获得 RHCE 认证是 Linux 职业生涯中的一个重要里程碑。这段旅程并未结束于认证，而是始于此。本章将通过探索有效利用认证并持续职业成长的核心策略和见解，帮助你为成为认证工程师的成功职业做好准备。我们将探索技能发展、职业规划、人脉建立，以及作为未来的专业人士如何跟进行业趋势。\n\
  \n## 结构\n\n本章涵盖了以下主题：\n\n* 现实世界中的 RHCE\n* 现实世界的客户\n* 服务器用例\n* 高性能计算\n* 混合云\n* RHEL\
  \ 人工智能\n* Ansible AI 加速\n\n## 目标\n\n通过本章的学习，读者将了解在获得 RHCE 认证之外持续学习的重要性，强调了跟进不断演变的技术和行业趋势的必要性。它强调了制定清晰职业路线图、设定可实现目标以及建立强大的专业网络以利用新机会的必要性。此外，本章还强调了通过精心设计的专业作品集和简历展示技能的重要性，理解雇主对\
  \ RHCE 认证人士的期望，以及通过持续教育和职业发展在就业市场上保持竞争竞争力。\n\n## 现实世界中的 RHCE\n\n虽然获得 RHCE 认证是我们\
  \ Linux 职业生涯中的一项重要成就，但它标志着一个新阶段的开始。本章探索了有效利用认证实现持续职业成长的策略。为了帮助我们为成为认证工程师的成功职业做好准备，我们将探索核心策略和见解，以确保我们能有效利用认证并持续专业成长。本指南将涵盖技能发展、职业规划、人脉建立以及跟进行业趋势。\n\
  \n## 掌握基础及超越\n\n虽然 RHCE 认证验证了我们在管理和自动化 RHEL 环境方面的专业知识，但 IT 领域在不断演进。要与 Linux、自动化工具及相关领域的最新技术和进展同步。在云计算、容器化（`Docker`、`Kubernetes`）、DevOps\
  \ 实践以及人工智能或机器学习等高级主题上变得精通。这些领域广受青，可以显著提升我们的职业前景。实践经验是无价的。参与现实项目、为开源计划做出贡献，或建立家庭实验室来实验新技术和工具。这种实操方法可以巩固我们的知识并提高我们解决问题的能力。\n\
  \n## 制定职业路线图\n\n通过定义短期和长期职业目标设定明确的目标。确定我们向往的角色，如系统管理员、DevOps 工程师或云架构师，并识别实现这些目标所需的技能和经验。根据职业目标制定学习计划并创建一个结构化的学习计划。分配时间学习新技术、获取额外的认证（例如\
  \ `RHCA`、`AWS Certified Solutions Architect`）以及参加相关的研讨会和会议。理解 IT 行业典型的职业发展。例如，从初级\
  \ Linux 管理员开始，转向高级管理员或工程师，最终转向领导或专业技术职位。\n\n## 建立专业网络\n\n参与与 Linux 和开源技术相关的专业协会和小组。如\
  \ `Linux Foundation`、本地 Linux 用户组（`LUGs`）和红帽用户组提供了价值的人脉机会。在在线论坛、社交媒体小组以及 `GitHub`\
  \ 和 `Stack Overflow` 等平台上保持活跃。分享知识、提问和参与讨论可以帮助我们建立声誉并与其他专业人士建立联系。参加行业会议、研讨会和聚会。如\
  \ `Red Hat Summit`、`LinuxCon`、`KubeConf` 以及各种 DevOps 会议提供了从专家那里学习、与同行建立联系以及了解行业趋势的机会。\n\
  \n## 展示我们的技能\n\n创建一个专业的作品集，突出你的项目、认证和成就，使你的简历在众多简历中脱颖而出。详细描述所解决的问题、使用的技术以及你对工作场所最终对整个世界的影响。撰写一份引人的简历和\
  \ LinkedIn 简介，传达我们的技能、经验和职业目标。强调我们的 RHCE 认证以及任何相关的项目或贡献。考虑撰写技术博客或在会议和聚会上进行演讲。分享知识使我们成为所在领域的专家，并增强我们的沟通能力。\n\
  \n## 理解雇主的期望\n\n雇主期望 RHCE 认证人士具备深厚的技术知识以及有效管理和自动化 RHEL 环境的能力。证明在脚本、配置管理和故障排除方面的精通至关重要。培养基本的软技能，如沟通、团队合作和解决问题。向非技术相关者解释技术概念并在多样化的团队中协作是非常受重视的。适应新技术和新方法的能力是根本。雇主重视那些快速学习并将新工具和实践整合到工作流中的专业。\n\
  \n## 跟进行业趋势\n\n利用在线课程、网络研讨会和认证计划等持续教育资源。`Red Hat Learning Subscription`、`Coursera`、`Pluralsight`\
  \ 和 `Udemy` 等平台提供了丰富的知识。定期阅读行业出版物、博客和新闻网站，了解 Linux、云计算、DevOps 以及其他领域的最新进展。寻求同事、导师和主管的反馈以识别需要改进的。建设性反馈帮助我们完善技能并保持与行业标准的一致。\n\
  \n为认证工程师的职业做准备不仅仅是获得 RHCE 认证。它涉及持续学习、战略性职业规划、积极的人脉建立、技能展示、理解雇主期望以及跟进行业趋势。通过遵循这些策略，我们可以最大化\
  \ RHCE 认证的价值，推进职业发展，并在 IT 行业中产生重大影响。\n\n\n\n\nRHCE 认证是一项声誉的证书，证明了我们管理和自动化 RHEL 环境的能力。获得此认证是一项重大的里程碑，但其真实价值在于在现实工作中有效地应用这些知识。\n\
  \n以下前五大 Linux 管理与工程职业职位展示了如何使用通过 RHCE 获得的能力，这些能力也是雇主对 RHCE 认证专业人士的期望：\n\n*   **系统管理员**：系统管理员负责\
  \ Linux 服务器的安装、配置和维护。他们确保系统运行顺、定期更新、管理用户账户并监控系统性能。我们需要文件系统知识、进程管理、用户和用户组管理以及系统监控工具等技能。\n\
  *   **系统工程师**：系统工程师设计、实施和管理复杂的 IT 系统。他们专注于确保所有组件无缝协作，通常涉及脚本编写、自动化和性能调优。最需求的技能包括对网络、脚本语言（例如\
  \ `Bash`、`Python`）以及 `Ansible` 等配置管理工具的高级理解。\n*   **DevOps 工程师**：DevOps 工程师工作在开发与运维的交叉领域。他们自动化部署过程，管理\
  \ `CI` 或 `CD` 流水线，并确保应用程序的可靠性和扩展性。雇主通常要求精通自动化工具、容器化技术（例如 `Docker`、`Kubernetes`）以及\
  \ `CI` 或 `CD` 实践。\n*   **云工程师**：云工程师专门负责设计和管理云基础设施。他们使用 `AWS`、`Azure` 和 `OpenStack`\
  \ 等平台部署可扩展且安全的云环境。需要以下技能：\n    *   云架构的理解\n    *   编排工具\n    *   云安全最佳实践\n*   **安全工程师**：安全工程师专注于保护系统和数据免受威胁。他们实施安全策略、管理防火墙并进行定期的安全审计。所需的技能包括安全协议知识、漏洞评估工具以及系统加固的最佳实践。\n\
  \n### RHCE 能力与前五大职位职责的映射如下：\n\n*   **系统监控与性能调优**：\n    *   **能力**：RHCE 认证确保我们可以使用\
  \ `top`、`htop` 和 `vmstat` 等工具监控系统性能。我们还学习了如何调整系统参数以获得最佳性能。\n    *   **应用**：这些技能对于需要确保系统高效运行的系统管理员以及设计性能优化环境的系统工程师至关重要。\n\
  *   **用户和用户组管理**：\n    *   **能力**：RHCE 涵盖了创建、修改和删除用户及组、设置权限以及管理用户策略。\n    *   **应用**：对于管理多用户环境的系统管理员和确保适当访问控制的安全工程师来说是重要的。\n\
  *   **网络配置与故障排除**：\n    *   **能力**：我们在配置网络接口、管理防火墙规则和排除网络问题方面获得了了专业知识。\n    *  \
  \ **应用**：对于设计网络架构的系统工程师和确保应用程序无缝网络连接的 DevOps 工程师非常重要。\n*   **自动化与脚本编写**：\n    *\
  \   **能力**：RHCE 培训包括在 `Bash` 中编写和调试脚本，以及使用 `Ansible` 进行配置管理。\n    *   **应用**：对于自动化部署过程的\
  \ DevOps 工程师和管理代码基础设施的云工程师至关重要。\n*   **安全实施**：\n    *   **能力**：RHCE 涵盖了 `SELinux`、防火墙以及系统安全的最佳实践。\n\
  \    *   **应用**：对于实施稳健安全措施的安全工程师和维护合规性的系统管理员是关键。\n\n雇主非常看重 RHCE 认证专业人士的其经过验证的专业知识和实践技能。以下是典型的雇主期望：\n\
  \n### 雇主期望\n\n*   **技术熟练度**：\n    *   雇主期望 RHCE 认证的人员深度理解 `RHEL` 及相关技术。\n    * \
  \  我们高效管理、故障排除和优化 Linux 系统的能力使我们成为任何 IT 团队的关键资产。\n*   **解决问题的能力**：\n    *   雇主寻找能够快速诊断并解决复杂技术问题的专业人士。\n\
  \    *   RHCE 培训的实操性质确保我们有充分准备应对现实世界的挑战。\n*   **自动化与效率**：\n    *   自动化是现代 IT 环境的重点。雇主期望我们利用脚本和配置管理工具来简化操作。\n\
  \    *   我们自动化重复性任务和管理代码基础设施的技能提高了运营效率并减少了停机时间。\n*   **安全意识**：\n    *   随着网络安全威胁的增加，雇主期望我们实施并维护稳健的安全实践。\n\
  \    *   我们对 `SELinux`、防火墙管理和安全策略的知识有助于保护组织的数据和系统。\n*   **持续学习**：\n    *   技术演进迅速，雇主重视致力于持续改进和关注行业趋势的专业人士。\n\
  \    *   我们对新工具和新方法的持续学习和适应确保了我们在 IT 领域仍然是宝贵的资源。\n\nRHCE 认证为 Linux 管理和工程奠定了坚实的基础。通过理解这些能力如何转化为现实角色并与雇主的期望保持一致，我们可以有效地利用\
  \ RHCE 知识促进职业发展并对 IT 行业产生重大影响。无论我们的目标是成为系统管理员、DevOps 工程师还是安全专家，通过 RHCE 认证获得的技能和见解将成为通往成功的有力阶石。\n\
  \n### 红帽认证架构师 (RHCA)\n\n从 RHCE 到 RHCA 的职业路径是一个进步的过程，标志着红帽认证计划内知识的巅峰。从 RHCE 开始，专业人士展示了管理和自动化\
  \ `RHEL` 环境的熟练技能。这项基础认证是通往高级角色和职责的大门。要晋升 RHCA，RHCE 必须完成一系列专项认证，每种认证都专注于 DevOps、云计算、性能调优和安全等关键领域。这种进步涉及严格的培训和实操经验，确保专业人士能够设计复杂的、可扩展且安全的\
  \ IT 解决方案。获得 RHCA 状态验证了个人在多个领域的技术实力，并将其定位为能够设计和实施复杂的企业级系统的领导者。这项受崇的认证开启了高级职位的大门，标志着\
  \ Linux 专业人士职业生涯的重大里程碑。\n\n### 职业目录\n\nRHCE 因其在管理和自动化 `RHEL` 环境方面的专业知识而备受青。为了有效地应对就业市场，RHCE\
  \ 可以利用各种职业招聘网站。本分析重点关注三个知名平台：Glassdoor、Jooble 和 Indeed，重点介绍每个平台如何为 RHCE 工程师的求职提供帮助。\n\
  \n### Glassdoor\n\nGlassdoor 是一个结合职位列表与公司评论、薪资报告和面试见解的综合平台。这些功能的独特融合为 RHCE 工程师提供了有关潜在雇主的价值背景，帮助他们做出明智的决策。\n\
  \n以下是 Glassdoor 的优势：\n\n\n\n\n## Glassdoor\n\n* **公司洞察**：Glassdoor 详细的公司评论让 RHCE\
  \ 工程师能够一览职场文化、管理风格和员工满意度。这对于理解他们可能工作的环境至关重要。\n* **薪资信息**：Glassdoor 提供了丰富的薪资数据，让\
  \ RHCE 工程师根据其技能和经验水平评估具有竞争力的薪酬方案。\n* **面试评论**：对面试流程的见解可以帮助 RHCE 工程师做好有效准备，让他们知道会遇到什么，以及哪些特定的技能或问题可能会被强调。\n\
  \n以下是 Glassdoor 的劣势：\n\n* **职位列表**：虽然 Glassdoor 拥有强大的数据库，但它对详尽公司简介的关注可能意味着其职位列表少于更专业的职位搜索搜索引擎。\n\
  * **导航**：信息的深度可能会让人目不暇接，需要用户在不同板块之间进行筛选以找到相关的职位列表。\n\nGlassdoor 对于那些重视深度公司研究并希望了解潜在雇主广泛背景的\
  \ RHCE 工程师来说是理想的。在考虑公司文化和匹配度至关重要的长期职业转型时，它是非常有益的。\n\n## Jooble\n\nJooble 是一个职位搜索聚合器，它汇了来自各种招聘网站和公司网站的列表，为求职者提供广泛的搜索引擎。它的主要优势在于其能够访问的职位列表数量巨大。\n\
  \n以下是 Jooble 的优势：\n\n* **聚合列表**：Jooble 的优势在于它能够从多个源抓取职位列表，让 RHCE 工程师能够通过单一平台接触许多机会。\n\
  * **简单性**：直观的界面使其能够快速找到相关的职位招聘信息，而不会受到额外内容的干扰。\n\n以下是 Jooble 的劣势：\n\n* **背景有限**：与\
  \ Glassdoor 不同，Jooble 不提供公司评论、薪资见解或面试技巧，这可能会限制求职者可获取的信息深度。\n* **重复性**：由于 Jooble\
  \ 聚合了来自各种来源的列表，用户可能会遇到重复的帖子。\n\nJooble 最适合那些希望在求职时进行大撒网式搜索的 RHCE 工程师。它对于快速识别广泛的机会特别有用，特别是对于那些对各种地点或类型的雇主持开放态度的人。\n\
  \n## Indeed\n\nIndeed 是全球最流行的职位搜索引擎之一，以其海量的职位列表、公司评论和薪资信息而闻名。它提供了一种平衡的方法，结合了 Glassdoor\
  \ 和 Jooble 的功能。\n\n以下是 Indeed 的优势：\n\n* **全面的列表**：Indeed 拥有海量的职位公告，使其成为寻求多样化机会的\
  \ RHCE 工程师的首选资源。\n* **用户评论和薪资**：与 Glassdoor 类似，Indeed 提供公司评论和薪资见解，虽然没有那么详尽，但有助于求职者更好地了解他们的潜在雇主。\n\
  * **职位提醒**：Indeed 的职位提醒功能确保 RHCE 工程师能够随时获取符合其标准的最新机会。\n\n以下是 Indeed 的劣势：\n\n* **广告过载**：该平台有时会充斥着广告，影响用户体验。\n\
  * **质量控制**：鉴于其规模，某些职位公告可能过时或相关性较低。\n\nIndeed 平台对于那些希望有一个全面的职位搜索工具、并平衡海量职位列表与有用公司信息的\
  \ RHCE 工程师来说是理想的。对于那些重视新机会定期更新和提醒的人来说，它特别有效。\n\nRHCE 工程师可以利用 Glassdoor、Jooble 和\
  \ Indeed 等职位目录来显著增强他们的求职能力。Glassdoor 擅长提供详细的公司洞察。Jooble 提供广泛的聚合列表。Indeed 则提供了两者的平衡。通过策略性地使用这些平台，RHCE\
  \ 工程师可以更有效地应对职场市场，找到与他们的技能、偏好和职业目标相匹配的机会。\n\n## 真实世界客户\n\n组织使用 RHEL 创建混合云环境，将本地基础设施与公共云资源相结合。这种设置在保持对关键数据和应用程序控制的同时，提供了灵活性和扩展性。\n\
  \n以下是一个示例：\n\n一家金融服务公司在其数据中心部署了 `RHEL`，并将其与 `AWS` 集成，以便在处理高峰期获得额外的计算能力，确保了合性和安全性。\n\
  \n`RHEL` 是现代化和自动化项目的基础，使企业能够更新旧系统并实现工作流自动化。\n\n以下是一个示例：\n\n一家制造公司使用 `RHEL` 和 `Red\
  \ Hat Ansible Automation Platform` 来自动化其供应链流程，减少人工干预并提高效率。\n\n凭借其集成容器工具，`RHEL` 支持现代应用程序开发实践，包括使用容器进行微服务架构。\n\
  \n以下是一个示例：\n\n一家科技初创公司利用 `RHEL` 和 `Kubernetes OpenShift` 在容器化环境中开发、测试和部署其应用程序，加速了开发周期并确保了不同阶段的一致性。\n\
  \n`RHEL` 合作伙伴提供托管服务来监控和维护客户环境，提供补丁更新、性能优化和安全管理支持。\n\n以下是一个示例：\n\n一家 IT 服务公司为运行 `RHEL`\
  \ 的客户提供托管服务，确保他们的系统始终保持更新和安全，让客户专注于其核心业务运营。\n\n`RHEL` 通常用于将现有应用程序迁移到云端，在迁移期间和之后提供稳定且安全的平台。\n\
  \n以下是一个示例：\n\n一家医疗服务提供商使用 `RHEL` 将患者管理系统迁移到 `Azure`，确保在整个迁移过程中机时间最少并维护数据完整性。\n\n\
  `RHEL` 的灵活性延伸到边缘计算，可以部署在偏远地区以更接近数据源的地方处理数据。\n\n以下是一个示例：\n\n一家能源公司在其偏远油井部署了 `RHEL`\
  \ 以收集和处理实时传感器数据，减少了延迟并改进了决策。\n\n## 分析\n\n混合云环境的复杂格局需要一个稳定、安全且灵活的基础，以持续满足业务和客户需求。`RHEL`\
  \ 作为一种解决这些要求的稳健解决方案脱颖而出，为合作伙伴通过转售、部署和提供服务提供了巨大的增长机会。`Forrester` 和国际数据公司 (IDC)（全球信息技术、电信和消费技术市场的市场情报、咨询服务和活动全球提供商）最近的研究为与\
  \ `RHEL` 相关的价值主张和业务潜力提供了深入见解。\n\n## Forrester\n\n`Forrester` 受红帽委托的总体经济影响（TEI）研究关注\
  \ `RHEL` 的合作伙伴机会。该研究强调了合作伙伴如何通过转售 `RHEL` 订阅、参与部署和迁移等项目工作以及提供托管服务来产生多种收入流。根据研究，`RHEL`\
  \ 的稳定性和活性使用户能够在数据中心、云和边缘环境中以一致体验部署应用程序和工作负载。\n\n以下是 Forrester 的主要发现：\n\n* **收入机会**：合作伙伴可以通过以下三个主要流向扩大收入：\n\
  \n    * **RHEL 订阅**：合作伙伴销售期为一至三年的 `RHEL` 订阅，保留年度订阅总收入的 5% 到 12%。\n\n\n\n\n\n## 合作伙伴收益与盈利能力增强\n\
  \n* **项目工作**：合作伙伴帮助客户部署和迁移 RHEL，按周收取这些咨询服务的费用。此类工作通常可以增加订阅收入的 60% 到 100%。\n* **托管服务**：除了初始部署外，合作伙伴还提供持续管理服务，这可以增加显著的收入流。\n\
  * **增强的合作伙伴盈利能力**：该研究根据合作伙伴客户消耗 RHEL 订阅预计总价值对财务结果进行了归一化处理。例如，如果客户在 RHEL 上的年度支出为\
  \ 75,000 美元，则额外的项目工作机会预计为 54,750 美元（订阅收入的 73%）。\n* **全面的支持与培训**：红帽为合作伙伴提供必要的工具、培训和支持，以便在企业范围内部署并构建\
  \ RHEL 环境。与红帽客户经理的定期互动显著提升了合作伙伴的实践。\n\n## 国际数据公司 (IDC)\n\nIDC 是全球领先的技术市场情报、数据和活动提供商。IDC\
  \ 的研究强调了使用付费红帽解决方案相比非付费开源替代方案的商业价值。研究指出，RHEL 和其他红帽解决方案提供了非付费替代方案无法提供的关键功能、性能和支持。投资红帽解决方案的组织能够获得更高的\
  \ IT 员工效率、开发能力和更好的业务成果。\n\n以下是 IDC 强调的优势：\n\n* **赋能开发团队**：红帽解决方案使开发团队能够有效满足新应用程序和功能的业务需求。这带来了更高的生产力并缩短了上市时间。\n\
  * **增强的安全性和性能**：RHEL 有助于确保关键应用程序和负载的安全性能，从而限制风险和相关的业务成本。与非付费开源解决方案相比，检测和响应安全漏洞的时间显著缩短。\n\
  * **成本效益**：虽然红帽解决方案涉及订阅成本，但实现的运营效率和 IT 成本节省超过了这些费用。在三年内，使用红帽解决方案的组织的 IT 基础设施成本和人员时间低于非付费开源替代方案。\n\
  \nForrester 和 IDC 的研究证实，RHEL 为合作伙伴及其客户带来了巨大的收益。合作伙伴可以通过订阅销售、项目工作和托管服务驱动大量的收入和盈利能力。此外，利用\
  \ RHEL 的组织享受着更高的开发生产力、增强的安全性和整体成本效益。这些见解强调了在混合云时代采用并与红帽合作以实现长期业务增长创新的战略优势。对于考虑转向\
  \ RHEL 或扩展 RHEL 的合作伙伴和组织，这些研究提供了一个评估潜在业务影响和战略收益的全面框架。随着 IT 环境变得日益复杂，红帽解决方案提供的稳定性、灵活性广泛支持使其成为现代企业极具吸引力的选择。\n\
  \n## 服务器用例\n\n由于稳定性至关重要，RHEL 是服务器使用的极佳选择。以下六种服务器提供了如何针对不同类型的负载优化电源管理和性能的见解：\n\n\
  ### Web 服务器\n\nApache HTTP 服务器是最流行的 Web 服务器之一。以下步骤将系统配置为 Web 服务器：\n\n1. **安装 Apache**:\n\
  ```bash\ndnf install httpd -y\n```\n\n2. **启动并启用 Apache 开机自启**:\n```bash\nsystemctl\
  \ start httpd\nsystemctl enable httpd\n```\n\n3. **配置防火墙允许 HTTP 和 HTTPS 流量**:\n\
  ```bash\nfirewall-cmd --permanent --add-service=http\nfirewall-cmd --permanent --add-service=https\n\
  firewall-cmd –reload\n```\n\n4. **创建一个简单的 HTML 文件**:\n```bash\necho \"<html><body><h1>Welcome\
  \ to RHEL Web Server!</h1></</body>></html>\" |\n```\n\n5. **验证安装**:\n打开浏览器并导航到\
  \ `http://<our-server-ip>`。我们应该看到欢迎消息。\n\nWeb 服务器需要高效的网络和磁盘 I/O。我们可以按照以下方式优化 Web\
  \ 服务器以节能：\n\n* **网络配置**：如果外部连接速度足够，将网卡限制为 100 Mbit/s。这对于主要提供静态页面的服务器通常适用。\n* **磁盘\
  \ I/O**：如果磁盘 I/O 极小，禁用 tuned 的磁盘插件。\n* **CPU 性能**：启用按需调度器（on-demand governor）以平衡性能和节能。\n\
  * **额外提示**：确保开启 GPU 节能模式，因为 Web 服务器通常不需要图形性能。\n\n### 计算服务器\n\nOpen MPI 是并行计算消息传递接口\
  \ (MPI) 标准的流行实现。要使用 Open MPI 设置并运行一个简单的 MPI 程序，以下是安装所需包、配置环境变量和编译程程步骤：\n\n1. **安装\
  \ Open MPI**:\n```bash\ndnf install openmpi openmpi-devel -y\n```\n\n2. **设置环境变量**:\n\
  将以下行添加到我们的 `.bashrc` 或 `.bash_profile` 中：\n```bash\nexport PATH=$PATH:/usr/lib64/openmpi/bin\n\
  export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/lib64/openmpi/lib\n```\n\n3. **编译并运行简单的\
  \ MPI 程序**:\n创建一个名为 `hello_mpi.c` 的文件：\n```c\n#include <mpi.h>\n#include <stdio.h>\n\
  \nint  main(int argc, char** argv) {\n    MPI_Init(NULL, NULL);\n    int world_size;\n\
  \    MPI_Comm_size(MPI_COMM_WORLD, &world_size);\n    int world_rank;\n    MPI_Comm_rank(MPI_COMM_WORLD,\
  \ &world_rank);\n    printf(\"Hello world from rank %d out of %d processors\\n\"\
  , world_rank, world_size);\n    MPI_Finalize();\n    return  0;\n}\n```\n\n4. **编译并运行程序**:\n\
  ```bash\nmpicc hello_mpi.c -o hello_mpi\nmpirun -np 4 ./hello_mpi\n```\n\n计算机服务器主要关注\
  \ CPU 性能。优化策略包括：\n\n* **磁盘和网络 I/O**：根据计算任务的性质，我们可能需要保持 tuned 的磁盘或网络插件处于状态。对于批模式系统，考虑完全激活的\
  \ tuned 配置。\n* **CPU 性能**：如果服务器处理密集计算任务，请使用性能调度器（performance governor）。\n* **电源管理**：评估利用率以确定合适的电源管理设置。\n\
  \n### 邮件服务器\n\nPostfix 是流行的邮件传输代理 (MTA)。要设置和优化 Postfix 邮件服务器，以下是安装、配置和性能调优步骤：\n\n\
  ```bash\ndnf install postfix -y\n```\n\n1. **启动并启用 Postfix**:\n```bash\nsystemctl\
  \ start postfix\nsystemctl enable postfix\n```\n\n2. **配置 Postfix**:\n编辑 `/etc/postfix/main.cf`\
  \ 并设置以下参数：\n```conf\nmyhostname = mail.example.com\nmydomain = example.com\nmyorigin\
  \ = $mydomain\ninet_interfaces = all\nmydestination = $myhostname, localhost.$mydomain,\
  \ localhost, $mydomain\nrelayhost =\nmynetworks = 127.0.0.0/8, [::1]/128\nhome_mailbox\
  \ = Maildir/\n```\n\n3. **重启 Postfix**:\n```bash\nsystemctl restart postfix\n```\n\
  \n邮件服务器需要高效的磁盘 I/O 和 CPU 利用率。以下是优化方法：\n\n* **CPU 性能**：启用按需调度器，因为最后几个百分点的 CPU 性能通常并不关键。\n\
  * **网络速度**：不要限制网络速度。内部邮件操作可以从千兆或十兆等更高的链路速度中获益。\n* **磁盘 I/O**：除非有特定的磁盘优化需求，否则禁用 tuned\
  \ 插件。\n\n### 文件服务器\n\nSamba 允许在 Linux、macOS 和 Windows 系统之间进行文件共享：\n\n1. **安装 Samba**:\n\
  ```bash\ndnf install samba samba-client -y\n```\n\n2. **配置 Samba**:\n\n\n\n\n\n\
  编辑 `/etc/samba/smb.conf` 以定义如下共享目录：\n\n```ini\n[global]\nworkgroup = WORKGROUP\n\
  security = user\n\n[shared]\npath = /srv/samba/shared\nvalid users = @smbgroup\n\
  guest ok = no\nwritable = yes\nbrowsable = yes\n```\n\n3. 创建共享目录并设置权限：\n\n```bash\n\
  mkdir -p /srv/samba/shared\nchown -R root:smbgroup /srv/samba/shared\nchmod 2770\
  \ /srv/samba/shared\n```\n\n4. 创建一个 Samba 用户：\n\n```bash\ngroupadd smbgroup\nuseradd\
  \ -M -d /srv/samba/shared -s /sbin/nologin smbuser\nsmbpasswd -a smbuser\nusermod\
  \ -aG smbgroup smbuser\n```\n\n5. 启动并启用 Samba：\n\n```bash\nsystemctl start smb\n\
  systemctl enable smb\n```\n\n文件服务器与邮件服务器有类似的要求，但根据使用的协议，可能需要更多的 CPU 性能，如下：\n\n-\
  \ CPU 性能：使用按需调度器（on-demand governor）。基于 Samba 的服务器通常比网络文件系统（NFS）需要更多 CPU，而 NFS 通常比\
  \ iSCSI（互联网小型计算机系统接口）需要更多。\n- 网络配置：确保网络速度足以满足文件传输负载。对于内部操作，可能需要一 Gbit/s 或十 Gbit/s\
  \ 等更高的速度。\n- 磁盘 I/O：根据协议和使用模式优化磁盘 I/O。\n\n## 目录服务器\n\nOpenLDAP 是一个开源 LDAP 实现。要设置和配置\
  \ OpenLDAP，请参考以下步骤安装、启动和配置服务，设置根密码，并添加基础域信息和用户：\n\n1. 安装 OpenLDAP：\n\n```bash\n\
  dnf install openldap openldap-servers openldap-clients -y\n```\n\n2. 启动并启用 OpenLDAP：\n\
  \n```bash\nsystemctl start slapd\nsystemctl enable slapd\n```\n\n3. 设置 OpenLDAP\
  \ 根密码：\n\n如下如下生成密码哈希：\n\n```bash\nslappasswd\n```\n\n输出将类似于 `{SSHA}5c4fa38b3e....`。\n\
  \n编辑 `/etc/openldap/slapd.d/cn=config/olcDatabase={2}hdb.ldif` 并设置根密码如下：\n\n```ini\n\
  olcRootPW: {SSHA}5c4fa38b3e...\n```\n\n4. 添加基础域和用户：\n\n如下创建一个名为 `base.ldif` 的文件：\n\
  \n```ini\ndn: dc=example,dc=com\nobjectClass: top\nobjectClass: dcObject\nobjectClass:\
  \ organization\no: Example Organization\ndc: example\ndn: cn=Manager,dc=example,dc=com\n\
  objectClass: organizationalRole\ncn: Manager\ndescription: Directory Manager\n```\n\
  \n如下将条目添加到 LDAP 目录中：\n\n```bash\nldapadd -x -D \"cn=Manager,dc=example,dc=com\"\
  \ -W -f base.ldif\n```\n\n目录服务器通常具有较低磁盘 I/O 要求，但更强调网络延迟。优化考虑因素包括：\n\n- 磁盘 I/O：根据协议和使用模式优化磁盘\
  \ I/O。\n- 网络延迟：确保网络速度足以满足文件传输负载。对于内部操作，可能需要一 Gbit/s 或十 Gbit/s 等更高的速度。\n- CPU 性能：使用按需调度器。基于\
  \ Samba 的服务器通常比网络文件系统（NFS）需要更多 CPU，而 NFS 通常比 iSCSI 需要更多。\n\n## 高性能计算\n\n高性能计算（HPC）是聚合计算能力以解决复杂问题并执行大型分析任务的实践。RHEL\
  \ 为高性能计算提供了强大、灵活且安全的底基础，支持现代 HPC 环境的多样化需求。\n\nRHEL 针对高性能图形、动画和科学活动进行了优化。例如，在通过 Amazon\
  \ Desktop Visualization (DCV)（一种高性能远程显示协议）交付的 AWS 云上。\n\n红帽与各种合作伙伴合作，为 HPC 环境提供如下全面的解决方案：\n\
  \n- CrowdStrike：通过云交付平台提供经过验证的端点安全。\n- NGINX plus：提供具有联邦信息处理标准 (FIPS) 和支付卡行业标准 (PCI)\
  \ 合规性的轻量级架构、高可用性和实时监控。\n- SAP HANA：在单一系统中提供高级分析和高速交易。\n- Microsoft SQL server：作为\
  \ RHEL 上的官方容器镜像可用。\n\n## 混合云\n\n\n\n\n\n公云基础设施提供了许多优势，包括灵活的定价、访问最新的硬件进展，以及无需构建和维护基础设施即可运行工作负载。`RHEL`\
  \ 是公云中部署最多的商业 Linux 发行版，已通过所有主流云提供商和云市场（如 `Microsoft Azure`、`AWS`、`Google Cloud`、`IBM\
  \ Cloud` 和阿里云）的使用认证。这种认证确保了在各种云环境中获得优的用户体验，提供了多种购买和管理选项。维护混合环境增加了整体 IT 的复杂性，并引入了独特的挑战，包括：\n\
  \n*   管理订阅：采购、跟踪和管理订阅变得复杂。\n*   部署环境不一致：新环境可能会产生迁移障碍并增加部署复杂性。\n*   开发者体验中的摩擦：开发者需要快速访问可靠的\
  \ OS 镜像以及熟悉的工具链、库、容器工具和运行时。\n\n`RHEL` 的设计旨在降低 IT 复杂性并支持跨不同云环境的应用迁移。`RHEL` 提供带有最佳实践和专家指导的工具，以实现无缝管理。它支持跨混合云的一致部署，消除了对不同环境额外技能的需求。与开发生命周无缝集成允许团队成员快速访问所需资源，从而通向生产的顺畅路径，同时避免创新锁定。云开发\
  \ `RHEL` 提供了便捷的云端可靠 OS 镜像以及必要的工具链、库、容器工具和运行时。这确保了从开发到生产的简化路径。通过应用流（application streams）进行更新允许开发者和\
  \ IT 架构师在尝试最新工具的同时，维护早期版本的生产应用。\n\n`RHEL` 支持容器技术，带有 `Podman`、`Buildah` 和 `Skopeo`\
  \ 等集成工具以及安全的基础镜像。它是跨各种部署环境中采用容器的一致且灵活的宿主机。经过认证的语言运行时容器进一步支持了不断演变的开发需求。\n\n在 IT 基础设施中标准化\
  \ `RHEL` 可以提高安全性、减轻运营负担并降低成本。`RHEL` 通过自动化、可重复的工作流、直观的基于 Web 的管理以及跨基础设施类型的一致 OS 管理，提供了简化的\
  \ OS 管理。\n\n`RHEL` 的镜像构建器（image builder）是一组 `CLI` 插件，用于协助配置和创建用于云部署的自定义镜像。“推送到云”（`Push-to-cloud`）功能允许将自定义镜像直接推送到云提供商的库，解决了离线环境中的配置和迁移挑战，并使运维团队能够云原生基础设施进行扩展。\n\
  \n`Red Hat Insights` 提供了单一视图，显示订阅在混合云环境中的部署情况。它为管理员和采购团队提供相对于容量的使用情况报告，并对虚拟机拓扑提供可见性，以识别正在哪里运行哪些虚拟机。\n\
  \n`RHEL` 在云端交付可靠的 OS 镜像、工具链、库、容器工具和运行时，简化了从开发到生产的路径。与主流云提供商的合作确保了在坚实基础上支持面向未来的部署。`RHEL`\
  \ 集成的容器工具和安全的基础镜像支持云迁移和应用开发，为跨各种环境采用容器提供了灵活性。在 IT 基础设施中标准化 `RHEL` 通过简化的 OS 管理增强了安全性、减轻了运营负担并降低了成本。`RHEL`\
  \ 的镜像构建器允许创建并直接部署到云提供商，简化了混合环境中的配置和迁移。`Red Hat Insights` 为混合云部署提供了全面的可见性和报告，帮助优化资源利用和基础设施管理。\n\
  \n`RHEL` 为混合云环境提供了稳健、灵活的基础，简化了管理，增强了开发并支持跨多种云基础设施无缝集成。凭借旨在降低复杂性和提高效率的特性，`RHEL` 是企业利用混合云优势的理想选择。通过\
  \ `AWS Marketplace`、`Azure Marketplace` 和 `Google Cloud Marketplace` 探索更多关于云端 `RHEL`，利用\
  \ `Red Hat` 与其合作伙伴之间的紧密合作解决我们的业务挑战。\n\n`UBI` 是由 `Red Hat` 提供的一组容器镜像，作为构建和部署容器化应用的可靠基础。`UBIs`\
  \ 设计旨在提供 `RHEL` 的一致性和安全性，同时提供在任何容器宿主机或平台运行的灵活性，无论订阅状态如何。`UBIs` 包含了基本的工具和库，允许开发者放心地构建和分发应用程序。例如，`UBI\
  \ minimal` 是一个轻量级镜像，仅包含核心运行时依赖项，非常适合微服务。`UBI standard` 包含了适用于更广泛应用程序的额外包。`UBI multi-language`\
  \ 是为需要多种语言运行环境定制的。这些镜像可以自由重新分发并用于创建自定义容器镜像，提供遵循 `RHEL` 标准的稳健且安全的基础。\n\n## RHEL 人工智能\n\
  \n最近，人工智能、机器学习和生成式 AI 已成为我们词典中的常用词汇。世界需要更多的 AI 用例，Red Hat 提出了 `RHEL AI` 作为一个开源平台来开发我们的模型。`RHEL\
  \ AI` 为企业环境中开发、部署和管理生成式 AI 模型提供了一个稳健且易于使用的平台。它在 2024 年 Red Hat Summit 上发布。利用开源工具，`RHEL\
  \ AI` 集成了 `InstructLab` 项目、`granite` 语言模型以及可启动的 `RHEL` 镜像，为企业 AI 应用创建了多功能基础。\n\n\
  以下是 `RHEL AI` 的组件：\n\n*   Granite 语言模型：`Granite` 模型是开源的、采用 `Apache-2` 许可的基础模型，由\
  \ Red Hat 和 IBM 支持并提供企业级使用的保障。这些模型促进了生成式 AI 应用开发，确保了企业环境内的可靠性和合规性。\n*   InstructLab：`InstructLab`\
  \ 提供了一个 `CLI` 和后端，用于通过额外的技能和数据调优和增强大语言模型 (`LLMs`)。它提供了一个可扩展、具有成本效益的解决方案来增强 `LLM`\
  \ 能力，使组织贡献知识和技能变得更容易。\n*   RHEL 镜像模式：`RHEL AI` 使用可启动容器镜像方法，实现了无缝管理和扩展性。`RHEL image\
  \ mode` 集成了 `granite` 模型和 `InstructLab` 工具包，包括针对 `NVIDIA`、`Intel` 和 Advanced Micro\
  \ Devices (AMD) 的核心库和硬件加速器。\n\n## 云原生可扩展性和可移植性\n\n`RHEL AI` 为云原生可扩展性设计，支持跨混合云环境的部署。它通过基于\
  \ `Kubernetes` 的 `Red Hat OpenShift AI` 提供了大规模 AI 的入口，并通过 `IBM watsonx.ai` 提供了额外功能。这种移植性确保了企业能够高效地管理和扩展其\
  \ AI 工作负载。\n\n以下是部署方法：\n\n*   可启动容器镜像：`RHEL AI` 以可启动容器镜像的形式分发，能够在裸机和云实例上均易于配置。这种方法确保了运行\
  \ AI 模型的一致且可重复的环境。\n\n\n\n\n\n- 自动化部署启动器：通过使用 Kickstart（一个集成在 RHEL 安装程序 Anaconda\
  \ 中的自动化工具），各组织可以实现 RHEL AI 的自动化部署。RHEL 中最近新增的 `ostreecontainer` 命令简化了通过网络提供可启动容器镜像的流程。\n\
  \n以下是一个 kickstart 文件的示例：\n\n```bash\n# Basic configuration\nnetwork --bootproto=dhcp\
  \ --device=link --activate\nclearpart --all --initlabel --disklabel=gpt\nreqpart\
  \ --add-boot\npart / --grow --fstype xfs\n\n# Provisioning the bootable container\n\
  ostreecontainer --url quay.io/<our-user-name>/nvidia-bootc:latest\n\n# Additional\
  \ configurations\nfirewall --disabled\nservices --enabled=sshd\nuser --name=cloud-user\
  \ --groups=wheel --plaintext --password\nsshkey --username cloud-user \"ssh-ed25519\
  \ AAAAC3Nza.....\"\nrootpw --iscrypted locked\nsshkey --username root \"ssh-ed25519\
  \ AAAAC3Nza...\"\nreboot\n```\n\n此 kickstart 文件自动化了 RHEL AI 的安装，包括网络设置、磁盘分区以及可启动容器镜像的配置。\n\
  \n## 硬件与性能预期\n\nRHEL AI 已在 Dell、IBM、Lenovo 和 AWS 实例等各种服务器平台上通过验证。\n\n最低硬件要求如下：\n\
  \n- 总 GPU 内存：320GB（例如 4 块每块 80GB 的 GPU）\n- 磁盘空间：200GB 用于模型存储\n\n训练性能取决于硬件配置。例如，单个\
  \ GPU 每分钟大约可以训练 250 个样本。使用 8 块 GPU 时，在 10 个 epoch 上训练 10,000 个样本大约需要 50 分钟。\n\n\
  以下是 RHEL AI 和 InstructLab 初始设置的步骤：\n\n1. 创建工作目录：\n   ```bash\n   mkdir my-project\n\
  \   cd my-project\n   ```\n2. 初始化项目：\n   ```bash\n   ilab init\n   ```\n3. 设置 hugging\
  \ face token：\n   ```bash\n   export HF_TOKEN=<our-token-value>\n   ```\n4. 下载 granite\
  \ 和 Mixtral 模型：\n   ```bash\n   ilab download --repository ibm/granite-7b-base\n\
  \   ilab download --repository mistralai/Mixtral-8x7B-Instruct-v0.1\n   ```\n\n\
  以下是训练和提供模型所需的步骤：\n\n1. 生成合成数据：\n   ```bash\n   ilab generate\n   ```\n2. 开始训练：\n\
  \   ```bash\n   ilab train --num-epochs 9\n   ```\n3. 提供新模型：\n   ```bash\n   ilab\
  \ serve --model tuned-0504-0051/samples_49920\n   ```\n4. 与模型交互：\n   ```bash\n \
  \  ilab chat --model tuned-0504-0051/samples_49920\n   ```\n\nRHEL AI 为企业环境下的开发和部署\
  \ AI 模型提供了一个全面且可扩展的平台。通过利用开源技术并提供稳健的部署方法，RHEL AI 赋能组织利用生成式 AI 的。凭借其云原生扩展性、经过验证的硬件支持以及与\
  \ Red Hat OpenShift AI 的集成，RHEL AI 非常适合满足现代企业对 AI 驱动应用日益增长的需求。欲获取更多信息、资源和社区支持，请访问\
  \ GitHub 上的官方 RHEL AI 开发者预览版仓库。\n\n## Ansible AI lightspeed\n\nAnsible AI lightspeed\
  \ 正在利用 AI 增强 Ansible playbook 的创建、优化和维护，从而彻底变革 IT 自动化。这一创新功能将 AI 驱动的见解和建议集成到 Ansible\
  \ 开发工作流中，能够更快、更高效地生成高质量自动化代码。主要优势包括：AI 驱动的代码生成完美集成在 Visual Studio 等开发软件中，减少了编写和维护脚本所需的时间和精力；以及提供实时协助和性能增强的智能建议。\n\
  \nAI lightspeed 充当新者的导师，引导他们完成编写 playbook 的过程并解释建议背后的原理，而资深用户则可以从持续学习和最佳实践见解中受益。它与现有的\
  \ Ansible 工具和工作流无缝集成，使其在不大幅改变现有流程的情况下易于采纳。实际应用包括基础设施配置、配置管理、应用程序部署以及安全与合规，在这些领域，AI\
  \ 生成的 playbook 确保了一致性，减少了停机时间并增强了安全态。\n\nAnsible AI lightspeed 代表了 IT 自动化的巨大飞跃，它将\
  \ Ansible 的强大能力与 AI 的变革性力量相结合，实现了效率和生产力的新高度，使其成为任何希望在快速发展的 IT 基础设施管理世界中保持领先的组织的不可或缺的工具。通过\
  \ Ansible AI lightspeed 拥抱 IT 自动化的未来，改变今天管理基础设施的方式。\n\n## 结论\n\n为认证工程师的职业准备不仅是为了获得\
  \ RHCE 认证。它涉及持续学习、战略性职业规划、活跃的人际网络、技能展示、理解雇主期望以及紧跟行业趋势。通过遵循这些策略，可以最大化 RHCE 认证的价值，推进职业发展，并在\
  \ IT 行业产生深远影响。祝你 RHCE 考试和未来的职业活动顺利！\n\n## 记忆的点\n\n- 在不断演变的 IT 领域，持续学习至关重要。\n- 设定明确的职业目标有助于实现长期成功。\n\
  - 人际网络可以为新的机会和合作开启大门。\n- 专业作品集和简历是展示技能的必备工具。\n- 雇主重视技术技能以及沟通、团队合作等软技能。\n- 紧跟行业趋势确保了在就业市场中的相关性和竞争力。\n\
  \n## 多选题\n\n1. 我们可以使用哪个命令来检查 Ansible playbook 的语法？\n   1. `ansible-playbook --syntax-check`\n\
  \   2. `ansible-playbook --check`\n   3. `ansible-playbook --validate`\n   4. `ansible-playbook\
  \ –verify`\n\n2. 哪个模块用于管理 RHEL 系统上的软件包？\n   1. `ansible.builtin.apt`\n   2. `ansible.builtin.package`\n\
  \   3. `ansible.builtin.dnf`\n   4. `ansible.builtin.yum`\n\n3. `ansible.builtin.lineinfile`\
  \ 模块的目的是？\n   1. 从控制节点复制文件到管理节点\n   2. 确保文件中某行是否存在\n   3. 管理 SELinux 策略\n   4. 安装软件包\n\
  \n4. 我们应该使用哪个模块在 Ansible 中创建新用户？\n   1. `ansible.builtin.group`\n   2. `ansible.builtin.acl`\n\
  \   3. `ansible.builtin.user`\n   4. `ansible.builtin.sudo`\n\n## 答案\n\n1 a.\n2\
  \ d.\n3 b.\n4 c.\n\n## \n\n1. 解释在 RHCE 认证之外持续学习的重要性。\n2. RHCE 认证人士的专业作品集包含哪些核心部分？\n\
  3. 人际网络如何帮助 Linux 专业人士推进职业发展？\n4. 描述自动化和脚本如何增强 RHCE 认证人士的工作表现。\n5. 雇主对 RHCE 认证人士有哪些主要预期？\n\
  6. RHCE 认证人士如何保持与行业趋势和技术的同步？\n\n## 关键术语\n\n- **持续学习 (Continuous learning)**：在不断发展的领域不断学习新技能和技术的持续。\n\
  - **职业路线图 (Career roadmap)**：概述短期和长期职业目标以及实现目标所需步骤的结构化计划。\n- **专业网络 (Professional\
  \ network)**：一组提供支持、信息和机会的专业联系。\n- **作品集 (Portfolio)**：展示个人技能、成就和经验的文档和项目集合。\n\n\
  \n\n\n\n- **自动化 (Automation)**：利用技术在无需人工干预的情况下执行任务。\n- **脚本化 (Scripting)**：编写脚本以自动化重复的任务和流程。\n\
  - **配置管理 (Configuration management)**：以一致且自动的方式维护系统设置和配置的过程。\n- **SELinux**：集成到\
  \ `Linux` 内核中的安全架构，为提供支持访问控制安全策略的机制。\n- **持续集成或持续部署 (CI or CD)**：一种通过在应用开发阶段中引入自动化，从而频繁地向客户交付应用程序的方法。\n\
  - **云计算 (Cloud computing)**：通过互联网提供的计算服务，包括存储、处理能力和应用程序。\n- **容器化 (Containerization)**：将应用程序及其依赖项封装在并在容器中，该容器可以运行在任何计算环境中。\n\
  - **DevOps**：一组结合软件开发（Dev）和 IT 运维（Ops）的实践，旨在缩短开发周期并持续交付高质量的软件。\n- **防火墙 (Firewall)**：一种网络安全设备，根据预定义的安全规则监控并控制入站和出站网络流量。\n\
  - 轻量级目录访问协议 (LDAP)：一种开放、厂商中立、行业标准的应用程序协议，用于在 IP 网络上访问和维护分布式目录信息服务。\n- **开源 (Open\
  \ source)**：原始源代码免费公开，并可能重新分发和修改的软件。\n- **混合云 (Hybrid cloud)**：一种使用本地、私有云和公有云服务混合计算环境，并在这些平台之间进行编排。\n\
  - **Red Hat Insights**：一种预测性分析工具，帮助识别并修复 `Red Hat Enterprise Linux` 环境中的安全和性能问题。\n\
