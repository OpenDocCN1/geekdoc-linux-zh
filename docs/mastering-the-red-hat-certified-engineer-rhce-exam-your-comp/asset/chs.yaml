  \ 关键术语\n\n*   **内容分发网络**：对于 RHEL，`CDN` 通过使用策略性位置的服务器来高效分发软件更新和包，优化下载速度并增强软件部署的整体性能。\n\
  *   **Kickstart**：这是一种基于红帽的 Linux 发行版中的系统配置自动化工具，允许管理员通过创建一个指定配置设置、软件包和安装后任务的脚本（`Kickstart\
  \ 文件`）来自动化安装过程，从而简化具有一致配置的多个系统的部署。\n*   **虚拟网络计算**：这是一种图形化桌面共享系统，允许我们远程控制和交互另一机器上的图形化桌面环境。在安装\
  \ RHEL 的背景下，使用 `VNC` 可以在无需物理接触机器的情况下执行安装过程方便方法。\n*   **Anaconda**：这是 RHEL 使用的安装程序，具有独特的并行安装方法，允许用户在选择语言和区域后按任何顺序配置大部分方面，为安装过程提供了灵活性。\n\
  *   **镜像构建器**：这是 RHEL 中一个强大的工具，可自动创建部署就绪的自定义系统镜像，包括安装盘、虚拟机和云特定镜像，通过消除手动配置的复杂性并利用\
  \ `RPM-DNF` 提供了效率。\n*   **Systemd**：它是 Linux 的一个系统和服务管理器，用于初始化和管理系统进程，提供高级功能，如并行启动、按需激活服务和依赖跟踪。\n\
  *   **Red Hat Insights**：这是一种主动的 IT 管理服务，使用预测分析在问题影响系统性能或安全性之前，识别并修复 RHEL 环境中的潜在问题。\n\
  *   **软件即服务**：`SaaS` 是一种云计算模型，通过互联网提供服务形式的软件应用程序，允许无需在本地设备上进行安装或维护即可访问和使用该软件。\n\
  *   **统一扩展固件接口**：`UEFI` 是一种现代固件标准，取代了传统的 `BIOS`，提供了先进的启动和系统初始化过程，支持更大的存储容量、更快的启动速度和改进的安全功能。\n\
  *   **PID**：进程标识符是分配给计算机操作系统中特定进程的数字标识符，便于对活动进程的管理和跟踪。\n\n\n\n*   `Cockpit`: 它是一个基于\
  \ Web 的系统管理工具，为管理员提供了一个友好的界面，用于监控、管理和配置 Red Hat Enterprise Linux 服务器。\n*   `Secure\
  \ Shell`: `SSH` 是一种加密网络协议，允许两个设备之间进行安全加密的通信，通常用于远程命令行登录、文件传输和隧道技术。\n*   `ECDSA`:\
  \ 椭圆曲线数字签名算法利用椭圆曲线的数学属性，提供了一种用于创建和验证数字签名的安全方法。\n*   `Master Boot Record`: `MBR`\
  \ 是一种旧的分区方案，存储在存储设备的开头，包含了系统定位和启动操作系统所需的信息。\n*   `GUID partition table`: `GPT` 是一种现代磁盘分区方案，它使用\
  \ `GUIDs` 定义存储设备上的分区，与 `MBR` 方案相比，它支持更大的磁盘容量并改进了数据完整性功能。\n\n加入我们书籍的 Discord 空间\n\
