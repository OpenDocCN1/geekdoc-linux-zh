  \n\n![](img/fm1.png)\n\n\n### 简介 (contents.xhtml_sc2_1a)\n\n欢迎来到红帽认证工程师 (RHCE) 认证之旅。本章为理解\
  \ RHCE 在 IT 行业中的重要性提供了至关的基础。读者将深入了解 RHCE 所验证的特定技能集，以及为什么它受到全球雇主的高度推崇。我们将为读者通往认证工程师的个人旅程铺平道路，强调这一成就的价值，以及它将如何推动个人的\
  \ IT 职业发展。\n\n\n本章涵盖了以下主题：\n\n*   RHCE 认证概述\n*   RHCE 与 RHCSA\n*   获取认证\n*   RHCA\n\
  *   考试蓝图\n*   核心工具\n*   认证之后\n\n\n在本章结束时，读者将学习 RHCE 的内容、考试蓝图以及为什么它在当今的 IT 行业中如此重要。读者将清晰地理解对\
  \ RHCE 认证的预期，以及为什么它是一个值得追求的目标。\n\n\n\n\n\n\n\n![](img/Figure_1.1.png)\n\n图 1.1：引用\
  \ RHCE 的职位占所有广告 IT 工作的比例，来源：IT Jobs Watch Ltd\n\n\n对于寻求验证技能并提升职业生涯的 IT 专业人士来说，成为\
  \ RHCE 是一段令人兴奋的旅程。本章探讨了这一过程的关键步骤，从基础红帽认证系统管理员（RHCSA）认证到 RHCE 考试大纲的深度分析。它深入了成功通过这些认证所需的理论概念和实践技能。RHCE\
  \ 认证是当全球最受认可的 Linux 认证。本书提供了关于成功管理红帽企业 Linux 系统的准备技能和能力指南。本书解释了获取解决方案的过程，因为考试是一场实操性环节。通过这种方式，我们确保了面向未来，因为考试内容可能会变化，但必要的知识大体相同。本书是一个坚实的基础，但我们鼓励你尽可能地获得实践经验，因为这会有回报，特别是在工作环境中。这一过程涉及系统的通用知识和实践经验。考试题目和答案由红帽认证中心严格保留，不鼓励候选人分享。始终记住，RHCE\
  \ 认证的最终目标是展示在 Linux 操作系统中的实践技能。\n\n在本书编写时，英国职位招聘中通常相关的技能和能力包括：Linux (100%)、Red Hat\
  \ (95%)、Ansible (64%)、Docker (64%)、Unix (59%)、Puppet (59%)、Python (54%)、配置管理 (55%)、敏捷\
  \ (55%)、DevOps (55%)、Kubernetes (55%) 以及任务自动化 (55%)。由于 RHCE 基于红帽企业 Linux，且它使用 `Ansible`\
  \ 技术进行配置和任务自动化，并理解容器编排。使用 `Python` 编程语言的人是一个加分项。RHCE 为 DevOps 工程师、数据中心、云、DevOps、应用开发和应用平台在\
  \ IT 行业中提供了无限机遇。\n\n\n![](img/Figure_1.2.png)\n\n图 1.2：来源 IT Jobs Watch Ltd：引用 RHCE\
  \ 的职位中 3 个月移动平均薪资\n\n\n![](img/Figure_1.3.png)\n\n图 1.3：服务器操作系统市场规模\n\n\n红帽企业 Linux\
  \ 订阅在 2018 年增长了 14% 以上，占总付费企业操作系统环境的 33% 以上。这与 IDC 赞助的研究一致，该研究显示了红帽企业 Linux 如何影响全球超过\
  \ 10 万亿美元的业务经济。\n\n![](img/Figure_1.4.png)\n\n\n## RHCE 和 RHCSA\n\n\n| 认证 | 标准学习路径\
  \ | 快速学习路径 |\n| :--- | :--- | :--- |\n| RHCSA | 红帽系统管理 I (RH124) | RHCSA 快速通道课程\
  \ (RH199) |\n| | 红帽系统管理 II (RH134) | |\n| 红帽认证架构师 (RHCA) | 许多选项 | 无 |\n\n表 1.1：RHCSA\
  \ 和 RHCE 学习路径\n\n参考以下图 1.5 查看 RHCSA 徽章：\n![](img/Figure_1.5.png)\n\n图 1.5：RHCSA\
  \ 徽章\n\n表 1.1 显示了通过红帽培训两种红帽学习路径。标准技能路径包括红帽课程红帽系统管理 I (RH124) 和红帽系统管理 II (RH134)，而快速技能路径仅包含\
  \ RHCSA 快速通道课程 (RH199)。两条路径都以 RHCSA 考试结束，这是进入 RHCE 技能路径的先条件。如果我们选择官方的红帽学习路径进行 RHCE，请参考表\
  \ 1.1。\n参考以下图 1.6 查看 RHCE 徽章：\n\n![](img/Figure_1.6.png)\n\n图 1.6：RHCE 徽章\n\n\n\n\
  \n一旦获得 RHCSA，红帽学习中心建议个人通过“红帽系统管理 III：基于 Ansible 的 Linux 自动化”（RH294）课程来提升技能，如表 1.2\
  \ 所示，为 RHCE 考试(`EX294`) 做好准备。在编写本书时，该课程基于红帽企业 Linux 和红帽 Ansible 自动化平台。该培训以远程培训或现场培训的形式提供。时长为五个整天，费用接近\
  \ 4,000 美元。大型组织利用红帽学习订阅为员工提供了极具成本效益且灵活的选择。本书是这些技能路径的替代方案，提供了来自真实世界用例的基础和经验。它不仅验证了对\
  \ Linux 自动化的熟练程度，还让个人在不断演变的技术环境中处于 IT 能力的最前沿。\nRHCSA 是旨在证明其管理红帽企业 Linux 系统熟练程度的人的起点。该认证验证了基础技能，例如理解基本工具、操作运行中的系统、配置本地存储以及管理用户和组。获得\
  \ RHCSA 认证是那些渴望成为 RHCE 的人的先决条件，为深入探索高级概念奠定了基础。\n\n准备 RHCSA 和 RHCE 认证的时间因个人学习速度、先前的经验以及对\
  \ Linux 系统的熟悉程度而异。鉴于这些认证的挑战性，勤奋的学习计划加上大量的动手实践对于成功至关重要。作为一个一般指南，许多候选人在尝试 RHCSA 和\
  \ RHCE 考试之前，会分配几周到几个月的时间进行专注准备。在此期间，沉浸在实时问题解决场景中并培养风险管理技能至关重要，因为这些认证旨在评估候选人在红帽企业\
  \ Linux 环境处理复杂系统管理任务的能力。为了准备 RHCSA 考试，候选人应该参与涵盖文件和目录处理、分区管理、用户和组管理、SELinux 配置和系统部署等任务的动手实践。在尝试\
  \ RHCSA 认证之前，充分理解这些任务至关重要。\n\n一旦获得 RHCSA，候选人可以通过进一步完善配置网络服务、远程日志、内核参数设置和 Ansible\
  \ 自动化方面的技能来晋升 RHCE。这一阶段需要额外的学习和实践经验，建立在 RHCSA 准备期间的基础之上。\n学习资源包括各种书籍、在线材料（如电子书和视频）以及红帽学习订阅等专业培训计划。还建议加入红帽培训机构，在认证工程师的指导下为候选人提供动手经验，并接触真实的问题解决场景。\n\
  \n通过 RHCSA 和 RHCE 认证成功的关键在于良好的学习计划、动手实践以及对持续学习的承诺。这些认证不仅验证了我们作为系统管理员的技能，还为该领域的高级职业机会开启了大门。\n\
  \n## 获取认证\n有志的 IT 专业人士开启迈 RHCE 认证的结构化旅程，通常从基础课程开始，例如“红帽系统管理 I(`RH124`) 和“红帽系统管理\
  \ II(`RH134`)”，如表 1.1 所示。这些课程为 RHCSA 认证奠定了基础，涵盖了有效系统管理所需的关键技能和知识。随后，RHCSA 快速通道课程(`RH199`)（如表\
  \ 1.1 所示）为具有相当工作经验的人提供了一条加速路径。\n\n为了进一步增强能力，候选人通常会追求“红帽系统管理 III：基于 Ansible 的 Linux\
  \ 自动化(`RH294`)”，如表 1.1 所示，该课程介绍了使用 Ansible 进行自动化，这是 RHCE 考试的关键组成部分。本书为候选人提供了自动化任务所需的技能，为\
  \ RHCE 考试中提出的更高级挑战奠定了基础。\n\n## 已认证\n对于在红帽企业 Linux 7 或更早版本获得认证的现有 RHCE，提升技能集的机会在于通过\
  \ RHCE 考试(`EX294`)进行重新认证。这种重新认证允许我们能够在基于容器的基础设施中增强自动化技能，这是现代 IT 环境的一个关键方面。虽然不是强制性的，但重新认证允许我们熟悉\
  \ RHCE 证书的最新进展和变化，为扩展我们的知识提供了独特机会。通过 RHCE 获得的自动化技能是跨整个组织实现自动化的基础，使其对于扩展各种红帽技术至关重要。此外，持有\
  \ RHCE 证书有助于追求成为基础设施领域的 RHCA，如表 1.1 所示，为职业晋升提供了清晰的路径。我们还可以通过申请额外的考试来进一步专精，例如申请“红帽认证\
  \ Ansible 自动化平台开发自动化专家认证(`EX374`)”和“红帽认证 Ansible 自动化平台管理自动化专家认证(`EX467`)”来获得我们的\
  \ RHCA 证书。对于与认证续期相关的任何查询或有关 RHCA 和其他 RHCE 相关路径的信息，常见问题部分是一个非常有价值的资源。\n\n要验证 RHCE\
  \ 认证，我们可以使用红帽认证中心验证服务。按照以下步骤验证 RHCE 认证：\n\n1. 访问红帽认证中心：访问红帽认证中心网站，这是管理和验证红帽认证的官方平台。URL\
  \ 为 `[`www.redhat.com/rhtapps/certification/verify`](https://www.redhat.com/rhtapps/certification/verify)`。\n\
  3. 输入认证 ID：在提供的字段中，输入我们想要验证的 RHCE 候选人的认证 ID。认证 ID 的格式通常为 `###-###-###`。\n4. 提交表单：输入认证\
  \ ID 后，提交表单或点击验证按钮以启动验证过程。\n5. 检查结果：系统将根据输入的认证 ID 与其认证专业人员数据库进行比对。如果认证 ID 有效且对应于\
  \ RHCE 认证，我们将收到认证状态的确认。\n6. 检查认证有效期：请记住红帽认证有有效期。确保该认证仍处于有效期状态。如果它已过期，它可能不会出现在验证结果中。\n\
  \n\n## RHCA\n\n\n\n成为 RHCE 是一项令人印象深刻的成就，但对于那些寻求进一步提升其 Red Hat 技术专业知识的人来说，获得 `RHCA`\
  \ 认证可能是下一步。`RHCA` 认证允许 `RHCEs` 展示更广泛的技能集，以及涵盖 Red Hat Enterprise Linux 和 Red Hat\
  \ 生态系统中其他关键产品的深度知识。请参考以下 图 1.7 查看 RHCA 徽章：\n\n![](img/Figure_1.7.png)\n\n图 1.7：RHCA\
  \ 徽章\nRHCE 可以通过选择 `RHCA` 基础设施列表中的认证来灵活定制自己的认证之旅。在 `Skills` 选项卡中的系统管理员列表中获得五项或更多认证，即可获得梦寐以求的认证基础设施架构师（Red\
  \ Hat Certified Architect in Infrastructure）称号。\n\n对于渴望获得更高水平认可的人，在基础认证之外获得五个以上的证书将使候选人进入\
  \ `RHCA Level II`。要获得 `RHCA Level II` 称号，保持所有六项认证的有效至关重要。如果其中一项认证失效，状态将恢复到 `Level\
  \ I`。两项认证失效则会取消 `RHCA` 称号。\n\n## 开放混合云计划\n拥抱开放混合云是现代企业计算不可或的一部分。开放混合云计划使专业人员能够引导组织无缝进入云端，符合业务需求。从以下列表中获得五项认证，将为个人完成这段转型之旅做好准备：\n\
  \n*   Red Hat 认证虚拟化专家\n*   Red Hat 认证 OpenShift 管理专家\n*   Red Hat 认证云基础设施专家\n* \
  \  Red Hat 认证 Ansible 网络自动化专家\n*   Red Hat 认证 Ceph 云存储专家\n*   Red Hat 认证 OpenShift\
  \ 自动化与集成专家\n*   Red Hat 认证 OpenShift 虚拟化专家\n*   Red Hat 认证容器专家\n## DevOps、容器与 OpenShift\
  \ 计划\n\n容器正在彻底改变应用开发，而 Red Hat OpenShift Container Platform 正处于这一演变的前沿。DevOps 实践、容器和\
  \ OpenShift 为更快的应用开发周期铺平了道路。获得以下认证，加上系统管理员列表中的一项，将使专业人员能够重塑应用交付格局：\n\n*   Red Hat\
  \ 认证 OpenShift 管理专家\n*   Red Hat 认证高级自动化专家：Ansible 最佳实践\n*   Red Hat 认证 OpenShift\
  \ 自动化与集成专家\n*   Red Hat 认证 OpenShift 虚拟化专家\n*   Red Hat 认证容器专家\n*   Red Hat 认证 OpenShift\
  \ 基础数据服务专家\n\n## 电信云计划\n\n电信行业正在向软件定义网络（SDN）和网络函数虚拟化（NFV）转型。Red Hat 技术（包括 OpenStack\
  \ 平台）在这种演变中至关重要。电信 IT 专业人员可以通过获得以下认证来验证他们的技能：\n\n*   Red Hat 认证 Ansible 网络自动化专家\n\
  *   Red Hat 认证 Ceph 云存储专家\n*   Red Hat 认证容器专家\n*   Red Hat 认证 OpenShift 虚拟化专家\n\
  *   Red Hat 认证多集群管理专家\n## Linux 精通计划\n\nRed Hat 技术的基础实力在于 Red Hat Enterprise Linux。对于那些寻求深入研究\
  \ Linux 精通的人，从以下选项中选择五项认证是关键：\n\n*   Red Hat 认证 Linux 诊断与故障排除专家\n*   Red Hat 认证身份管理专家\n\
  *   Red Hat 认证高可用性集群专家\n*   Red Hat 认证部署与系统管理专家\n*   Red Hat 认证高级自动化专家：Ansible 最佳实践\n\
  *   Red Hat 认证安全专家：Linux\n从 `RHCE` 到 `RHCA` 的之旅证明了 IT 专业人员对持续学习和精通 Red Hat 技术的承诺。无论是深入\
  \ Linux 的细节、拥抱开放混合云、在 DevOps 实践中处于领先，还是应对电信云转型，`RHCA` 认证都开启了新机遇和挑战的大门。根据您的热情和组织需求定制您的路径，拥抱不断演变的\
  \ IT 专业知识图谱。`RHCA` 等候着准备好在 Red Hat 之旅中攀登新高度的人。\n\n## 考试大纲\n\n`RHCE` 考试是一项基于性能评估，旨在评估候选人使用\
  \ Red Hat Ansible 管理多个系统的能力。官方考试由 Red Hat 培训与认证部门提供。`RHCE` 考试在理论理解和实践经验之间取得了平衡。候选人不仅必须掌握\
  \ `Ansible` 的理论概念，还要将它们应用到现实场景中。这种双重重点确保了认证工程师不仅精通自动化原理，还能够在各种环境中有效地实施它们。考试大纲涵盖了理论概念和实践技能，反映了\
  \ `RHCE` 的多样化职责，如下：\n*   **理论概念**：预计候选人将对 `Ansible` 核心组件的理解，包括 `inventories`（清单）、`modules`（模块）、`variables`（变量）、`facts`（事实）、`loops`（循环）、`conditional\
  \ tasks`（条件任务）、`plays`、`handling task failure`（处理任务失败）、`playbooks`（剧本）、`configuration\
  \ files`（配置文件）和 `roles`（角色）。理论知识对于有效使用 `Ansible` 自动化系统管理任务并集成新兴 Red Hat 技术至关重要。\n\
  *   **实践技能**：考试的实践部分要求候选人在多个系统上安装和配置 `Ansible Core`。然后他们必须创建 `Ansible Playbooks`，通过将它们应用于新安装的系统来进行评估。任务涉及为特定的角色和行为配置系统，例如管理软件包、`services`（服务）、`firewall\
  \ rules`（防火墙规则）、`file systems`（文件系统）、存储设备等。\n\n虽然在技术上可以在没有先获得 `RHCSA` 认证的情况下参加 `RHCE`\
  \ 考试，但点是，获得 `RHCSA` 认证是获得 `RHCE` 认证的先决条件。`RHCE` 考试是一项实操性的实践测试，用于评估 Linux 系统管理的高级技能，它是建立在\
  \ `RHCSA` 考试中测试的基础知识之上的。因此，虽然我们可以在没有 `RHCSA` 认证的情况下尝试 `RHCE` 考试，但在获得两项认证之前，我们不会授予\
  \ `RHCE` 认证。`RHCSA` 认证是关重要的一步，确保候选人拥有处理 `RHCE` 考试涵盖的更高级主题所需的基础技能和知识。强烈建议按照正确的顺序，在追求\
  \ `RHCE` 认证之前获得 `RHCSA` 认证，以确保对 Red Hat Enterprise Linux 系统管理的全面理解。\n\n\n\n在本书编写时，RHCE\
  \ 考试费用为 500 美元，这仅包含考试费用，不包括任何相关的培训费用。我们可以直接从 Red Hat Learning 网站（[`www.redhat.com/en/services/certification/individual-exams`](https://www.redhat.com/en/services/certification/individual-exams））购买考试，如图\
  \ 1.8 所示：\n\n![](img/1.png)\n图 1.8：红帽学习考试\n\n对于在参加考试前选择参加 RHCE 培训课程的候选人，需要在培训部分进行额外投入。这项培训为候选人应对\
  \ RHCE 考试中的挑战做了充分准备，确保他们对红帽企业 Linux 系统管理相关的所需的知识和技能有全面的理解。虽然考试费是固定成本，但培训投入为候选人提供了宝贵的见解和实践经验，可能会增加他们获得\
  \ RHCE 认证的几率。考试和培训的成本反映了在 IT 行业脱颖而出并利用这一受崇认证的优势所需的投入。根据最新信息，包括 RHCE 在内的红帽认证有效期为三年。在此期限之后，认证不会过期或终止，但会变为“非当前状态”。为了保持认证的当前有效状态，鼓励个人参加红帽认证计划的持续教育要求，这涉及获得并提交某些凭证以延长认证的有效期。这种做法确保了认证的专业人士能够在快速变化的信息技术领域与不断演进的技术和行业标准保持同步。\n\
  \n### 关于 RHCE 考试的关键细节\n* 考试代码：`EX294`\n* 持续时间：4 小时（240 分钟）\n* 类型：基于性能的（实操）\n* 题目：20\
  \ 道题，无多选题\n* 限制：禁止访问互联网，持续视频录像\n* 及格分数：总分 300 分中获得 210 分，仅由红帽认证中心发布，并在 3 个美国工作日内传达。\n\
  * 重考政策：如果候选人在第一次尝试中未通过，则获得一次重考的机会。\n\nRHCE 考试测试我们在以下领域的能力，这些能力对于各种红帽产品的系统管理至关重要。\n\
  \n\n### 远程考试的要求\n\n* 计算机：兼容 Intel 的 `X86_64-bit` 架构，配备单个活动显示器。\n* 内存（RAM）：至少 4GB。\n\
  * 摄像头：一个外接摄像头，即使你的笔记本电脑内置了摄像头，线缆至少 1 米。\n* 键盘：考试仅允许一个键盘。如果使用外接键盘，必须关闭笔记本盖。\n* 音频和麦克风：需要一个工作的麦克风。\n\
  * 电源：计算机需要不间断电源（`UPS`），或笔记本连接电源且电池充满。\n* USB 盘：一个存储空间至少 8 GB 的 USB 盘，`USB 2.0` 或更高版本。\n\
  * 食物和零食：允许携带，但在开始时需要向监官展示。\n\n我们的考试会在预订系统计划时间前的一小时出现在 Live USB 系统中。考试在课程开始前大约半小时可用，监官在考试期间可以通过聊天提供服务。他/她将协助所有的考试需求。\n\
  \n### 考试成功的最佳建议\n* 健康与福祉：确保在考试前得到充分休息。在学习和个人健康之间保持健康的平衡。\n* 准备是关键：充分的准备对于任何事业的成功至关重要。规划你的方法和学习计划以涵盖所有必要的话。\n\
  * 文档很有帮助：熟悉操作系统中提供的相关文档和帮助页面。知道在考试期间如何快速找到信息。\n* 理解考试目标：彻底复习考试蓝图或目标。关注关键领域并确保全面理解。\n\
  * 社区支持：加入与认证相关的论坛或社区。讨论话题、提问，并从他人的经验中学习。\n* 技术故障排除：准备好在考试期间排除技术问题。熟悉常见问题及其解决方案。\n\
  * 建立信心：相信自己的准备和能力。以自信和积极的心态对待考试。\n* 仔细阅读说明：花时间仔细阅读所有说明。理解每个考试部分的格式和要求。\n* 时间管理：在考试期间明智分配时间。在准备期间练习时间管理以提高效率。\n\
  * 压力下保持冷静：考试期间保持冷静。如果遇到挑战性问题，先跳过稍后回来。\n* 持续学习：认证是一个脚石；拥抱持续学习。保持好奇心并探索新的技术和进展。\n\n\
  这些点作为通用指南，具体可能会根据你所准备的认证类型或考试而有所不同。\n\n基本工具\n\n\n\n在 Linux 系统管理领域，精通核心工具对于高效地管理和维护系统至关重要。这些工具是管理员的枢纽，使他们能够无缝执行各种任务。命令行界面（CLI）成为主要的工作空间，其中如\
  \ `ls`（列出目录内容）、`cp`（复制文件）和 `mv`（移动或重命名文件）等实用程序为基础文件和目录操作奠定了基础`ping` 和 `traceroute`\
  \ 等网络工具便于网络诊断，确保连接性并准确定问题。`vim` 或 `nano` 等文本编辑器允许管理员修改配置文件和脚本。包括 `yum`、`dnf` 或 `apt`\
  \ 在内的包管理工具简化了软件的安装和更新。此外，`top` 或 `htop` 等监控和故障排除工具提供了对系统性能的实时洞察。这些本质工具构成了 Linux\
  \ 管理员技能的核心，使他们能够高效地在操作系统中导航并协调各项任务。RHCE 考试要求候选人具备使用以下工具的能力：\n\n*   运行中的系统\n*   配置本地存储\n\
  *   创建和配置文件系统\n*   管理用户和组\n*   管理安全\n*   理解 Ansible 的核心组件，例如清单 (inventories)、模块\
  \ (modules)、`variables`、`facts`、循环 (loops)、条件任务、plays、处理任务失败、playbooks、配置文件和角色 (roles)\n\
  *   使用 Ansible 文档查找有关 Ansible 模块和命令的特定信息\n*   与角色和 Ansible 内容集 (Content Collections)\
  \ 一起工作\n*   配置 Ansible 管理的节点\n*   分析并将简单的 shell 脚本转换为 Ansible playbooks\n*   使用自动化内容导航运行\
  \ playbooks\n*   创建 Ansible plays 和 playbooks\n*   使用 Ansible 模块对软件包、服务、防火墙规则、文件系统、存储设备、文件内容、归档、任务调度、安全以及用户/组的标准\
  \ RHCSA 任务\n\n我们将学习尽可能多的术语和概念，但建议为了充分利用本书，具备 Linux 操作系统的基础知识和术语。\n\n### 认证后\n\n\n\
  ### 结论](#contents.xhtml_sc2_17a)\n\n在本章中，我们涵盖了 RHCE 及其重要性和职业机会。在下一章中，我们将学习 Linux\
  \ 内部原理。\n\n\n*   自 2006 年以来，RHCE 认证在 IT 行业中具有重要意义，受到了广泛认可和需求。\n*   RHCSA 是一种验证基本系统管理技能的入门级认证，而\
  \ RHCE 是一种高级认证，证明了在管理红帽 Linux 系统方面的深入知识和实践经验。\n*   获得 RHCE 认证的工程师为高级系统管理职位做好了充分准备，这导致了它的受欢迎程度和竞争性的平均薪资。\n\
  *   该认证全面的课程以及对于在动态的企业级 Linux 服务器领域寻求职业发展的 IT 专业人士，在招聘公告中具有高需求。\n### 多选题](#contents.xhtml_sc2_19a)\n\
