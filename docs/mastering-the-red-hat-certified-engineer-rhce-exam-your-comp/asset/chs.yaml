  \ RHCE 认证做好准备。\n\n## 网络设置\n\n\n### 主机名\n\n主机名用于标识每个系统。在 Red Hat Enterprise Linux\
  \ (RHEL) 中更改系统主机名涉及使用 `hostname` 命令来显示或临时修改完全主机名。静态主机名可以在 `/etc/hostname` 文件中指定，并使用\
  \ `hostnamectl` 命令修改此文件并查看系统主机名状态。如果不存在 `/etc/hostname` 文件，则在接口分配 IP 地址后通过反向 DNS\
  \ 查询设置主机名。在 RHEL 6 及更版本中，使用的是 `/etc/sysconfig/network` 文件。\n\n\n存解析器将主机名转换为 IP 地址并在系统中反向解析。`/etc/nsswitch.conf`\
  \ 文件决定查找顺序。默认情况下，首先检查包含静态主机解析的 `/etc/hosts` 文件。\n\n我们可以使用以下命令测试静态主机解析：\n\ngetent\
  \ hosts demo.example.com\n```\n\n如果静态解析失败，系统将尝试联系 `/etc/resolv.conf` 文件中定义的 DNS。NetworkManager\
  \ 生成的典型文件如下：\n\ndomain example.com\nsearch example.com\nnameserver 192.168.1.254\n\
  ```\n\n\n### 网络接口\n\n在 RHEL 中，确保网络配置的准确性和性能至关重要。我们将探索如何修改配置文件，并利用命令行工具来验证和排除 RHEL\
  \ 系统上网络设置的故障。在 RHEL 中，网络设置由 `NetworkManager` 工具管理。我们将使用 NetworkManager 的 `nmcli`\
  \ 命令来配置我们的网络接口。\n\n\n```bash\n## nmcli con mod ID ipv4.dns 192.168.1.254\n## nmcli\
  \ con down ID\n## nmcli con up ID\n\nRHEL 上的网络配置存储在 `/etc/sysconfig` 目录下的网络接口配置文件。第一个有线连接配置存储在\
  \ `/etc/sysconfig/network-scripts/ifcfg-Wired_connection_1` 文件中。\n\n配置文件如下：\n\n\
  ONBOOT=yes\nIPADDR=192.168.1.1\nPREFIX=24\nGATEWAY=192.168.1.254\nDNS1=8.8.8.8\n\
  \n我们可以使用 `nmcli` 命令执行文件并激活更改：\n\n```\nnmcli reload\n```\n\n我们可以使用 `ip`、`ping`、`tracepath`\
  \ 和 `ss` 命令收集网络接口信息。这些命令提供了网络配置、性能指标、连接状态和路由信息的详细见解。\n\n让我们探索几个关键命令及其应用：\n*   **识别网络接口**：`ip\
  \ link` 命令列出所有网络接口：\n    ```\n    ip link\n    ```\n    在示例中，服务器有两个网络接口：`lo`（回环）和\
  \ `ens3`。我们可以使用 `link/ether` 之后的 MAC 地址来确定连接的网络。例如，MAC 地址为 `94:36:CC:00:00:0a` 的网卡对应接口\
  \ `ens3`。\n*   **显示 IP 地址**：使用 `ip addr` 命令查看特定接口（如 `ens3`）的设备和地址信息：\n    ```\n\
  \    ip addr ens3\n    ```\n    该命令提供了接口详细信息，包括 IPv4 和 IPv6 地址。\n*   **显示性能统计**：可以使用\
  \ `ip -s link` 显示网络性能统计，包括接收和发送的数据包、错误和丢弃：\n    ```\n    ip -s link ens3\n    ```\n\
  \    这些统计数据有助于识别潜在的网络问题。\n*   **检查主机间的连接性**：`ping` 命令是测试连接性的基础工具。例如，测试 IP 地址 `192.168.250.251`：\n\
  \    ```\n    ping -c3 192.168.250.251\n    ```\n    `ping6` 命令是 IPv6 版本，工作方式类似：\n\
  \    ping6 2001:db8:0:1::1\n    ```\n确保在 ping 本地地址和多播组时，我们显式指定网络接口范围标识符。\n\n*  \
  \ **显示路由表**：使用 `ip route` 命令显示 IPv4 路由表。添加 `-6` 选项显示 IPv6 路由表：\n    ip route\n \
  \   ip -6 route\n    ```\n\n\n\n\n这提供了关于数据包如何根据其目的地进行路由的信息。\n\n*   追踪流量经过的路由：使用\
  \ `traceroute` 或 `tracepath` 命令跟踪网络流量通过路由器的路径：\n    ```\n    tracepath access.redhat.com\n\
  \    ```\n\n    这些命令有助于识别访问远程主机时涉及的路由器。\n*   排查端口和服务：使用`ss` 命令取代了旧的 `netstat` 工具并显示\
  \ socket 统计信息：\n\n    ```\n    ss -ta\n    ```\n    `ss` 命令显示有关监听和已建立的 socket 的信息，包括本地和对端地址及端口。\n\
  \n上述讨论的命令和技术为排查故障和确保最佳网络性能提供了坚实的基础。如需更多详细信息，请参考官方的网络配置和管理指南。\n\n## 日期和时间\n使用 `NTP`\
  \ 维护准确的时间同步并配置正确的时区，对于确保系统日志和日志记录的事件具有准确的时间戳至关重要。\n\n以下是实现这一点的分步骤指南：\n\n1.  验证当前时间设置：使用\
  \ `timedatectl` 查看当前时间设置、时区和 `NTP` 同步状态：\n    ```\n    timedatectl\n    ```\n\n\
  2.  列出可用时区：为了恰地配置系统时区，了解可用选项至关重要。\n    ```\n    timedatectl list-timezones\n   \
  \ ```\n\n3.  设置正确的时区：使用 `timedatectl set-timezone` 后面跟所需的时区。例如：\n    ```\n    timedatectl\
  \ set-timezone Europe/Paris\n    ```\n\n4.  验证更改：再次运行 `timedatectl` 以验证更改。\n5. \
  \ 配置 `NTP` 同步：为了确保准确的计时，启用 `NTP` 同步可以使系统时钟与网络时间服务器同步。\n\n    ```\n    timedatectl\
  \ set-ntp true\n    ```\n    在 RHEL 中，此命令会调整 `chronyd` `NTP` 服务。\n\n6.  配置 `chrony`\
  \ (`chronyd`)：默认情况下，`chronyd` 使用 `NTP` 池项目服务器。如果需要更改 `NTP` 服务器（特别是对于隔离网络），请修改 `/etc/chrony.conf`。\n\
  \n    在 `/etc/chrony.conf` 中添加 `NTP` 服务器或节点。例如：\n    ```\n    server 0.pool.ntp.org\
  \ iburst\n    ```\n\n    推荐使用 `iburst` 选项进行更快的初始同步。\n7.  重启 `chronyd` 服务：修改 `chrony.conf`\
  \ 文件后，重启 `chronyd` 服务：\n\n    ```\n    systemctl restart chronyd\n    ```\n8.  验证\
  \ `NTP` 同步：使用 `chronyd` 的客户端 `chronyc` 验证 `NTP` 同步：\n\n    ```\n    chronyc sources\
  \ -v\n    ```\n    寻找服务器名称旁的 `*`，表示它是当前的同步源。\n\n以下是供您参考的一些额外说明：\n\n*   UTC 时区：如果你需要\
  \ `UTC`，请使用 `timedatectl set-timezone UTC` 将时区设置为 `UTC`。\n*   持久化配置：确保 `chrony.conf`\
  \ 的更改在重启后保持一致并维护，以实现持久化的时间配置。\n*   `Chrony` vs. `NTPd`：在 RHEL 中，时间同步优选使用 `chronyd`\
  \ 而非旧的 `NTPd`。\n\n## 调度未来任务\n\n\n## Cron\n\n从系统账户而非用户账户调度任务的最佳方法是使用 `crontab` 命令。系统级\
  \ crontab 文件位于 `/etc/crontab` 和 `/etc/cron.d`（推荐方式）。用户也可以通过 `crontab` 命令在自己的账户中调度任务。`crontab`\
  \ 文件具有位置语法，如下：\n\n*   每天的小时 (0 - 23)\n*   每月的日期 (1 - 31)\n*   月份 (1 - 12) 或 jan,\
  \ feb, mar, apr ...\n*   每周的几 (0 - 6)（星期日=0 或 7）或 sun, mon, tue ...\n*   执行命令的用户名\n\
  \n此外，特殊目录 `/etc/cron.hourly`、`/etc/cron.daily`、`/etc/cron.weekly` 和 `/etc/cron.monthly`\
  \ 包含可执行的 shell 脚本，每小时、每天、每周或每月执行一次。\n\nLinux 中的 `cron` 服务允许按指定的自动调度任务。这些调度任务被称为\
  \ `cron jobs`（cron 任务）。\n\n\n1.  理解 `cron` 语法：使用以下格式指定 `cron job`：\n\n    `* * *\
  \ * * command`\n    | | | | | |\n    | | | | | 日期\n    | | | | 月份\n    | | | 小时\n\
  \    | 分钟\n\n    *   使用 `crontab -e` 编辑。\n    *   使用 `crontab -l` 查看。\n    *   使用\
  \ `crontab -r` 删除。\n\n3.  常用示例：\n    *   每天凌晨 2 点运行脚本：`0 2 * * * /path/to/script.sh`\n\
  \    *   每周一凌晨 3 点运行备份：`0 3 * * 0 /path/to/backup.sh`\n    *   每 6 小时清理临时文件：`0 */6\
  \ * * /usr/bin/clear_files.sh`\n    *   每周一下午 5 点检查磁盘使用并记录：`0 17 * * 1 df -h > /var/log/usage.log`\n\
  \n\n    *   `@reboot`：启动时运行。\n    *   `@yearly`：每年一次。\n    *   `@monthly`：每月一次。\n\
  \    *   `@weekly`：每周一次。\n    *   `@hourly`：每小时一次。\n\n5.  系统级任务：系统级 cron 存储在 `/etc/crontab`\
  \ 和 `/etc/cron.d/` 目录。`/etc/crontab` 文件有一个额外的字段用于指定运行命令的用户。\n\n6.  日志记录：默认情况下，`cron`\
  \ 将其活动记录在 `/var/log/cron`。我们可以查看这些日志来检查 cron 任务是否正在运行。\n## 自动化备份\n\n以下步骤是关于使用 `cron`\
  \ 每天凌晨 1 点对某些数据目录进行 tarball 备份的示例：\n\n1.  创建备份脚本：\n    vim /usr/local/bin/backup.sh\n\
  \    ```\n    向脚本中添加以下行：\n    ```bash\n    #!/bin/bash\n    ```\n\n2.  赋予脚本可执行权限：\n\
  \    ```\n    chmod +x /usr/local/bin/backup.sh\n\n3.  调度脚本在每天凌晨 1 点运行：\n    ```\n\
  \    crontab -e\n    ```\n    ```\n    0 1 * * * /usr/local/bin/backup.sh\n    ```\n\
  \n4.  验证 `cron job`：\n    crontab -l\n    ```\n\n通过设置 `cron jobs`，我们可以自动化常规任务如备份、系统维护和监控，确保它们在无需人工干预的情况下持续运行。\n\
  \n\n\n\n\n\n\n`anacrontab` 文件的语法如下：\n\n*   以天为单位的周期。例如宏 `@daily` 等同于整数 `1`，`@weekly`\
  \ 等同于 `7`。\n*   启动作业前的延迟时间（分钟）。\n*   要执行的命令。\n\n## Systemd timer](#contents.xhtml_sc3_82a)\n\
  \n`systemd` 定器单元允许基于时间的激活来激活其他 `systemd` 单元。它激活另一个不同类型的单元，通常是一个与定时器单元名称匹配的服务。以下配置位于\
  \ `/usr/lib/systemd/system/sysstat-collect.timer` 文件中，每十分分钟为 `sysstat` 服务收集一次系统统计：\n\
  ```\n[Timer]\nOnCalendar=*:00/10\n\n[Install]\n```\n\n`OnCalendar` 参数设置定时器每 10 分钟运行一次。我们可以指定更复杂的定时器表达式，或者改用\
  \ `OnUnitActiveSec` 参数。`OnUnitActiveSec=10min` 会在定时器单元上次激活后触发该单元。\n\n> **注意：** 通过将配置文件从\
  \ `/usr/lib/systemd` 目录复制到 `/etc/systemd/system` 来自定义 `systemd` 定器单元。这可以防止在更新过程中发生配置被覆盖。\n\
  ## 管理本地用户和组](#contents.xhtml_sc2_83a)\n\n在 RHEL 中管理本地用户和组对于维护安全性、访问控制和资源共享至关重要。这涉及创建带有家目录的新用户并设置密码（例如使用\
  \ `useradd johndoe`），以及将他们加入 `wheel` 等组以获得管理员权限。它还包括创建新组（如 `projectteam`）并将 `johndoe`\
  \ 和 `janedoe` 等用户加入以促进协作。此外，修改目录所有权权限可以确保只有指定的用户和组才能访问和管理资源，例如将所有权更改为 `johndoe:projectteam`\
  \ 并对 `/project` 目录设置适当权限。\n\n## 用户](#contents.xhtml_sc3_84a)\nLinux 用户账户的作用是在个人与执行命令的程序之间建立安全边界。用户通过其用户名识别，在内部则通过一个称为用户\
  \ ID (`UID`) 的唯一标识数字来识别。系统根据文件所有权执行访问控制，每个进程和文件都关联到一个特定的用户。\n\n主要有三种类型的用户账户，如下：\n\
  \n*   **超级用户**：`root` 账户，`UID` 为 0，留用于系统管理，提供对整个系统的无限制访问。\n*   **普通用户 UID 1000+**：大多数用户属于此类，使用其账户执行具有有限系统访问权限的日常任务。\n\
  \n要查看当前登录用户或其他用户的信息，使用 `id` 命令。显示如下：\n\n```bash\nuid=1000(devops) gid=1000(devops)\
  \ groups=1000(devops),10(wheel) context=unconfined_u:unconfined_r:unconfined_t:s0-s0:c0.c1023\n\
  ```\n\n`/etc/passwd` 文件存储用户账户详情，如用户名、`UID`、`GID`、GECOS、家目录和 shell。示例：\n\ndevops:x:1000:1000:devops:/home/devops:/bin/bash\n\
  ```\n\n*   **用户名**：`devops`\n*   **密码**：`x`\n*   **GID**：`1000`\n*   **GECOS**：`devops`\n\
  *   **家目录**：`/home/devops`\n*   **Shell**：`/bin/bash`\n\n\n特殊变量 `$HOME` 包含当前目录，而\
  \ `$PATH` 是搜索可执行命令的路径。\n\n```bash\n$ echo $HOME\n\n$ echo $PATH\n```\n\n系统的 Bash\
  \ 变量定义在 `/etc/profile` 和 `/etc/bashrc`。用户可以通过家目录下的 `.bash_profile` 和 `.bashrc` 进行自定义。这些文件在用户登录或使用\
  \ `source` 命令时加载，如下：\n```bash\n$ source ~/.bash_profile\n```\n\n## 密码](#contents.xhtml_sc3_86a)\n\
  影子密码文件仅供 root 用户访问，位于 `/etc/shadow`，是 Linux 中存储加密密码的系统文件。`devops` 用户的行如下：\n\n```\n\
  devops:$6$j0BdSRjg7eEj14Z3$6fAkEz6K.1cj/jc8GL4NdqV0VdPVApUAxhtB6q8ZCCDjiywfYQ5xWZR2HONYd::0:9999:7:::\n\
  ```\n文件的格式如下，部分之间用 `$` 分隔：\n\n*   **哈希算法**：第一段指示用于密码的哈希算法。例如：`$6$` 表示使用 SHA-512\
  \ 哈希。其他可能性包括 MD5 的 `$1$` 和 SHA-256 的 `$5$`。\n*   **盐**：第二段加密加密使用的随机盐。\n*   **加密哈希**：第三段组成用户密码的加密哈希。\n\
  我们可以使用 `chage` 命令及其选项配置密码过期，如 图 3.1 所示：\n\n![图 3.1: 密码过期](img/Figure_3.1.png)\n\n\
  以下是最常用的用例：\n*   列出 `devops` 用户的密码过期设置：\n    `# chage -l devops`\n*   为 `devops`\
  \ 用户设置密码：\n    `# sudo passwd devops`\n\n\n\n\n*   将最小天数设置为 0，最大 90 天，警告期 7 天，以及空闲\
  \ 14 天：\n    ```bash\n    ```\n\n*   强制用户在下次登录时更新密码\n    ```bash\n    chage -d 0\
  \ devops\n\n## 超级用户 (Superuser)\n\n系统管理任务通常需要超级用户权限。通过使用 `su` 或 `sudo` 命令授予。这些命令允许授权的用户以提升权限执行命令，通过减少对持续超级用户会话的需求来增强安全性。\n\
  \n```bash\n%users localhost=/sbin/shutdown -h now\n```\n\n另一种典型的设置是允许 `users` 组挂载\
  \ CDROM 驱动器：\n%users ALL=/sbin/mount /mnt/cdrom, /sbin/umount /mnt/cdrom\n```\n\n\
  `/etc/sudoers` 中的以下行行允许 `wheel` 组的所有用户在指定用户密码的情况下执行超级用户命令：\n```bash\n```\n\n以下行与之相同，但不需要请求密码：\n\
  ```bash\n%wheel ALL=(ALL) NOPASSWD: ALL\n\n## 组 (Group)\n\n组是用户的逻辑集合，共享对文件和系统资源的访问。与用户一样，组拥有名称、唯一标识符和\
  \ GID。系统组的 GID 为 0-999，而自定义组的 GID 为 1000+。组通过同时向多个用户授予权限，方便了文件访问控制。`/etc/group`\
  \ 文件存储了本地组的信息，包括组名、GID 和组成员列表。\n\nusers:x:100:\n```\n\n每个用户都有一个主组，列在 `/etc/passwd`\
  \ 文件中，并可能属于 `/etc/group` 中定义的补充组。在 `/etc/group` 文件中定义的本地组可以使用 `groupadd`、`groupmod`\
  \ 和 `groupdel` 等命令进行创建、修改和删除。组对于简化用户之间的访问控制和资源共享起着关键作用。以下是最常用的命令用例：\n\n    ```bash\n\
  \    groups devops\n    ```\n    `devops : devops wheel users`\n\n    ```bash\n\
  \    groupadd group1\n    ```\n\n*   删除一个组：\n    groupdel group1\n    ```\n\n* \
  \  将现有用户添加到组中：\n    ```bash\n    ```\n\n*   更改用户的初始组：\n    ```bash\n    usermod\
  \ -g groupname username\n\n*   在一条命令中将现有用户添加到多个组：\n    ```bash\n    usermod -aG\
  \ group1,group2 username\n    ```\n*   从组中移除用户：\n    ```bash\n    gpasswd -d username\
  \ group1\n    ```\n\n\n## 文件访问控制 (Files access control)\n\n更改权限的基础命令是 `chmod`，它是\
  \ change mode 的缩写。`chmod` 支持两种方法：符号法和数字法。\n\n\n它利用字母来表示不同的权限组：`u` 代表用户，`g` 代表组，`o`\
  \ 代表其他，`a` 代表所有（用户、组和其他人）。它结合了权限动作和权限。权限动作包括：`+` 添加权限，`-` 移除权限，`=` 设置精确的权限。权限由字母表示：`r`\
  \ 表示读，`w` 表示写，`x` 表示执行。在 RHEL 系统上修改文件权限，我们可以使用 `chmod` 命令设置所需的访问权限。\n\n以下是调整特定文件权限的两个示例：\n\
  \n    ```bash\n    chmod go-rw file1\n    ```\n\n*   为所有人为 file2 添加执行权限：\n    chmod\
  \ a+x file2\n    ```\n\n### 数字法 (Numeric method)\n\n\n*   为 samplefile 设置用户读写权限，为组和其他人设置读权限：\n\
  \    ```bash\n    chmod 644 samplefile\n    ```\n*   为用户设置读、写、执行权限，为组和其他人设置读执行权限：\n\
  \    ```bash\n    chmod 750 sampledir\n    ```\n\n\n\n\n精通文件系统权限对于 Linux 管理员确保适当的访问控制至关重要。理解\
  \ `chmod` 和 `chown` 命令以及符号模式和数字方法，能够使用户高效地管理文件权限和所有权，从而构建安全且有序的 Linux 环境。\n\n\n\
  在 RHEL 中，访问控制列表 (ACL) 提供了一种强大的机制，可以在传统的 Unix 权限之外对文件和目录访问进行细粒度控制。ACL 允许管理员为特定用户和组定义访问权限，从而实现更精细的安全配置。通过使用\
  \ `setfacl` 和 `getfacl` 命令，管理员可以对单个文件和目录授予或撤销权限（如读、写和执行）。这种粒粒度控制在不同用户或组对共享资源需要不同访问级别的环境中特别有用。ACL\
  \ 补充了 RHEL 中的标准文件权限，提供了额外的控制层，增强了安全性并促进了更灵活、更具定制性的访问管理系统。利用 ACL 可以让管理员在 RHEL 环境中实施稳健且自定义的文件访问策略。\n\
  \nLinux 文件系统权限传统上围绕三类展开：用户所有者、所有者组和其他人。访问级别（如读、写、执行）是根据这些类别授予的。例如，财务部门的目录权限可能设置为\
  \ `drwxrwxr-x`，允许用户所有者读写，所有者组读写，其他人查看和执行。\n\n$ getfacl /accounting\n\n# file: accounting\n\
  \n# owner: accounting\n# group: accounting\n\nuser::rwx\ngroup::rwx\nother::---\n\
  default:user::rwx\ndefault:user:accounting:rwx\ndefault:group::rwx\ndefault:mask::rwx\n\
  default:other::---\n\n设置 ACL 的过程涉及使用 `setfacl` 命令并配合 `-m`（修改）或 `-x`（移除）等选项。例如，要授予\
  \ Alice 访问 accounting 目录的权限可以使用以下命令：\n\n```bash\n$ setfacl -m alice:rwx /accounting\n\
  \n# file: example.txt\n\n# owner: accounting\n\n\nuser::rwx\nuser:alice:rwx\n```\n\
  \n\n## Linux 进程\n\n在 Linux 中，有效的进程调度对于优化系统性能至关重要。Linux 进程调度器嵌入在内核中，采用时间片或多任务处理来管理单核上大量进程的执行，每个进程被分配一个相对优先级，即\
  \ `nice` 值。在普通系统中，大多数进程使用的调度策略称为 `SCHED_OTHER` 或 `SCHED_NORMAL`，但也存在针对各种工作负载需求的策略。`nice`\
  \ 和 `renice` 命令是影响进程优先级的关键。用户可以使用 `nice` 命令以特定的 nice 级别启动进程，从而确定其优先级。`renice` 命令允许动态调整现有进程的\
  \ nice 级别。虽然无权限用户可以将 nice 值增加到最大 19，但只有 root 用户可以将其降低到 `-20`。这些命令提供了精调进程优先级的手段，有助于构建响应迅速且高效的\
  \ Linux 系统，而 `top` 和 `ps` 等工具提供了进程优先级实时状态的洞察。\n\n\n负载平均是 Linux 内核提供的一个指标，直观地表示随时间变化的系统负载。它指示等待处理的系统资源请求数量，帮助管理员评估系统状况和性能趋势。内核每五秒根据处于可运行和不可中断状态的进程数计算一次负载值。该计算得出了最近\
  \ 1、5 和 15 分钟的指数移动平均值。Linux 通过考虑 CPU 和 I/O 相关的进程来计算负载平均值。它代表了准备就绪或等待磁盘/网络 I/O 完成的进程数。与某些只关注\
  \ CPU 利用率的 UNIX 系统不同，Linux 的负载平均结合了磁盘和网络利用率，承认了它们对整体系统性能的影响。负载平均反映了当前等待请求完成的进程数，无论是\
  \ CPU 时间还是关键的磁盘 I/O 操作。当负载平均值高但 CPU 活动极少时，建议调查磁盘和网络活动以寻找潜在的瓶颈。`uptime` 命令是显示当前负载平均值的快捷方法。这些值代表了过去\
  \ 1、5 和 15 分钟的负载。\n\n以下是一个示例：\n\n$ uptime\n05:44:08 up 0 min, 1 user, load average:\
  \ 0.27, 0.06, 0.02\n```\n\n要评估负载平均值的影响，请考虑系统上的逻辑 CPU 。使用 `lscpu` 命令有助于确定 CPU 配置。以下是一个示例：\n\
  ```bash\n$ lscpu\nOn-line CPU(s) list: 0-3\nThread(s) per core: 2\nCore(s) per socket:\
  \ 4\n```\n\n如果负载平均主要是由于进程需要 CPU 时间，将负载平均值除以逻辑 CPU 数量。值低于 1 表示利用率良好，而高于 1 则意味着已饱和。\n\
  \n## 实时进程监控\n理解负载平均值至关重要，但实时监控工具提供了更深层次的洞察。`top` 程序是此类工具之一，提供了进程视图。它持续刷新，允许管理员识别资源密集型进程。`top`\
  \ 中的关键功能和快捷键如下：\n\n*   交互快捷键帮助：`?` 或 `h`\n*   切换负载、线程和内存页头：`l`, `t`\n*   切换显示单个\
  \ CPU 或摘要：`1`\n*   杀死进程：`k`\n*   调整进程优先级：`r`\n*   按内存或 CPU 使用率对进程列表：`Shift+m`, `Shift+p`\n\
  *   退出：`q`\n\n\n```\ntop - 05:46:10 up 2 min, 1 user, load average: 0.11, 0.06,\
  \ 0.02\nTasks: 319 total, 1 running, 318 sleeping, 0 stopped, 0 zombie\n%Cpu(s):\
  \ 0.2 us, 0.5 sy, 0.0 ni, 99.2 id, 0.0 wa, 0.0 hi, 0.1 si, 0.0 st\nMiB Swap : 2048.0\
  \ total, 2048.0 free, 0.0 used\n```\n\n\n\nMiB Swap: 2048.0 total, 2048.0 free,\
  \ 0.0 used. 2852.3 avail Mem\n\n## 进程信号\n\n理解 Linux 中进程控制的技术和命令，对于适地使用不同类型的信号进行有效的系统管理至关重要。最重要的信号列如下：\n\
  - **信号特性**：每个信号都有一个默认操作（例如终止或挂起程序），程序可以被设计为以特定方式处理信号。\n- **理解信号**：信号是发送给进程的软件中断，用于通信各种事件，例如错误、外部事件或明确命令。示例包括\
  \ `SIGHUP`（挂断）、`SIGINT`（键盘中断）、`SIGQUIT`（键盘退出）、`SIGKILL`（杀死，不可阻塞）和 `SIGTERM`（终止）。\n\
  - **发送信号**：可以使用键盘序列（例如通过 Ctrl+C 发送 `SIGINT`）或命令（`kill`、`killall`、`pkill`）向进程发送信号。`kill`\
  \ 命令名为 kill，但它用于发送任何信号，而不仅仅是终止进程。`killall` 命令通过命令名针对多个进程，而 `pkill` 允许根据命令名或用户 ID\
  \ 等各种标准发送信号。\n- **选择性终止进程**：可以根据各种标准（如控制终端或父子关系）选择性地终止进程。`pstree` 命令可以帮助可视化进程关系，有助于针对性的进程管理。\n\
  - **进程管理命令**：各种命令包括 `kill`、`killall`、`pkill`、`pgrep` 和 `pstree` 用于管理和终止进程。这些命令允许根据进程\
  \ ID、用户 ID 或父子关系等标准针对特定的进程或进程组。\n\n## 服务与守护进程\n\n在 RHEL 中，高效管理服务、守护进程和启动过程对于系统管理员至关重要。RHEL\
  \ 服务和启动过程管理的基石是 `systemd`。作为系统启动期间启动的第一个进程，`systemd` 协调系统资源、服务器守护进程和其他进程的激活。其丰富的特性集包括用于加快启动速度的并行化、按需启动守护进程以及自动服务依赖管理。`systemd`\
  \ 利用单元（units）来管理各种对象。特别，服务单元（以 `.service` 结尾）代表系统服务，套字单元（以 `.socket` 结尾）处理进程间通信，路径单元（以\
  \ `.path` 结尾）延迟服务激活直到发生特定的文件系统变化。\n\n\n`systemctl` 命令成为了管理员的“瑞士军刀”，提供了系统状态的洞察。用户可以使用\
  \ `list units` 和 `status` 等选项轻松探索已加载的单元，检查它们的激活状态并查看特定服务的详细信息。系统管理员可以使用 `systemctl`\
  \ 验证服务的特定状态。`loaded`、`active (running)` 和 `inactive` 等关键词提供了服务状态的快速概述。此外，`is-active`、`is-enabled`\
  \ 和 `is-failed` 选项允许用户检查服务的运行、启动启用和失败状态。我们可以使用以下命令测试服务何时被启用或激活：\n\n```bash\n$ systemctl\
  \ is-enabled sshd\n\n$ systemctl is-active sshd\nactive\n```\n\n\n```bash\n$ systemctl\
  \ status sshd\n● sshd.service - OpenSSH server daemon\nLoaded: loaded (/usr/lib/systemd/system/sshd.service;\
  \ enabled; preset: enabled)\nDocs: man:sshd(8)\nman:sshd_config(5)\nMain PID: 1076\
  \ (sshd)\nTasks: 1 (limit: 22573)\nMemory: 5.3M\nCGroup: /system.slice/sshd.service\n\
  └─1076 \"sshd: /usr/sbin/sshd -D [listener] 0 of 10-100 startups\"\nDec 31 10:45:27\
  \ localhost.localdomain systemd[1]: Starting OpenSSH server daemon...\n```\n\n\n\
  ## 启动和停止服务\n\n在 RHEL 复杂的生态系统中，有效管理系统服务是系统管理员使用强大的 `systemctl` 工具控制系统守护进程和网络服务的关键任务。\n\
  \n\n```bash\n# systemctl start sshd.service\n```\n\n\n确保服务在系统启动期间自动启动或停止是一常见的管理任务。使用\
  \ `systemctl enable` 和 `systemctl disable` 命令创建或删除符号链接，以控制启动时服务的自动启动。以下命令在机机上启用了\
  \ `sshd.service`：\n\n```bash\n# systemctl enable sshd.service\n\n## 依赖与冲突\n\n服务之间的依赖关系在复杂系统中很常见。`systemd`\
  \ 配合 `systemctl` 工具动态管理服务依赖。`systemctl list-dependencies` 命令显示了给定服务单元的依赖层次。理解依赖关系对于维持稳定响应良好的系统至关重要。\n\
  \n\n```bash\n## systemctl mask httpd.service\nCreated symlink /etc/systemd/system/httpd.service\
  \ → /dev/null\n```\n精通系统服务的控制是维护健壮高效 RHEL 系统的基础。\n\n## 启动过程\n\n\n\n在 RHEL 中控制启动过程是系统管理的一个关键方面，允许对系统的启动序列进行高效管理和定制。启动过程是系统上电或重启时引发的一系列事件，涵盖硬件初始化、加载内核以及启动基本服务。在\
  \ RHEL 中，管理员可以通过配置各种参数、设置服务依赖关系以及使用通用统一引导加载程序 (GRUB) 等工具来管理引导加载程序，从而影响这一过程。理解并掌握启动过程的复杂之处将使管理员能够优化系统性能、排除故障并根据特定的操作需求定制启动序列。关于启动的更多详细信息将在第\
  \ 8 章 性能优化与故障排除中进行详细说明。\n\n## 日志文件\n\n\n* `/var/log/messages`: 通用事件\n* `/var/log/secure`:\
  \ 安全与认证事件\n* `/var/log/maillog`: 邮件服务器事件\n* `/var/log/cron`: 定时作业执行事件\n* `/var/log/audit/audit.log`:\
  \ SELinux 审计事件日志\n* `/var/log/dnf.rpm.log`: 所有的 DNF 安装和删除事务日志\n\n特定的进程或服务可以创建额外的文件。\n\
  \n\nDNF 是 RHEL 中使用的包管理系统。它为在系统中安装和更新软件包提供了一种强大且高效的方法。使用 DNF 安装软件是一个简单的过程，通常涉及单个命令，例如\
  \ `dnf install [package_name]`。该命令会自动解析依赖关系并从仓库获取所需的包，简化了安装过程。同样，更新已安装的软件也如运行 `dnf\
  \ update` 般简单，确保系统保持最新版本和安全补丁。DNF 用户友好的语法和健壮的依赖管理使其成为系统管理员和用户可靠的工具，为在基于 Linux 的系统上管理软件提供了无缝体验。\n\
  \n在 RHEL 系统中，以下组件对于我们的系统是必需的：\n\n\n* **权限证书**: 这些数字证书表示附加到系统上的订阅，存储在 `/etc/pki`\
  \ 及其子目录中。它们对于管理系统更新和软件安装权限至关重要。\n\n* **DNF 命令**: 使用 `dnf` 命令查找、安装和更新软件包。`DNF` 与通过订阅管理过程启用的仓库交互，以安装和更新包。\n\
  \n\n```bash\nsubscription-manager repos --enable=rhel-9-for-$(uname -m)-baseos-debug-rpms\n\
  ```\n\n\n## Linux 中的存储\n\nLinux 存储是系统管理的关键方面，涵盖了处理数据的各种技术和工具。Linux 提供了灵活且健壮的存储基础设施，允许管理员采用多种文件系统、存储设备和卷管理解决方案。无论是利用传统的硬盘还是现代的固态硬盘，Linux\
  \ 管理员都可以利用大量的存储选项，确保高效的数据组织和访问，以获得最佳的系统性能。每当我们修改物理分区时，`udevadm settle` 命令都会等待系统重新加载最新的磁盘几何结构。\n\
  \n\nLVM 为 RHEL 中的磁盘空间管理提供了一种动态且灵活的方法。通过 LVM，管理员可以创建跨越多个物理卷 (PV) 的逻辑卷 (LV)，从而轻松地调整存储空间的大小、移动和合并。这种动态存储分配有助于完成无需停机调整文件系统等任务，并简化了复杂存储环境下的磁盘空间管理。LVM\
  \ 还引入了卷组 (VG) 和 PV 等概念，在物理磁盘和逻辑卷之间提供了一层抽象。\n\n以下步骤是创建、扩展、缩小和删除逻辑卷的最常见 LVM 操作：\n\n\
  ```bash\nvgdisplay\n```\n\n2. **创建 LV**: 在卷组 `myvg` 中创建一个名为 `mylv` 大小为 10 GB 的逻辑卷：\n\
  lvcreate -n mylv -L 10G myvg\n```\n\n3. **显示 LV 信息**: 查看逻辑卷的信息：\n```bash\n```\n\n\
  4. **格式化 LV**: 使用文件系统格式化逻辑卷，例如 `ext4`：\n```bash\nmkfs.ext4 /dev/myvg/mylv\n\n5.\
  \ **挂载 LV**: 创建挂载点并挂载逻辑卷：\n```bash\nmkdir /mnt/mylv\nmount /dev/myvg/mylv /mnt/mylv\n\
  \n6. **扩展 LV**: 将逻辑卷 `mylv` 扩展 5 GB：\n```bash\nlvextend -L +5G /dev/myvg/mylv\n\
  ```\n7. **调整文件系统大小**: 调整文件系统大小以反映新尺寸：\n```bash\nresize2fs /dev/myvg/mylv\n```\n\n\
  ```bash\nlvreduce -L -2G /dev/myvg/mylv\n```\n\n9. **卸载并移除 LV**: 卸载逻辑卷并将其移除：\numount\
  \ /mnt/mylv\nlvremove /dev/myvg/mylv\n```\n\n10. **显示空空间**: 查看卷组中的空空间：\nvgs\n```\n\
  \n我们应该将 `myvg`、`mylv` 和大小替换为实际的卷组、逻辑卷和大小。在执行缩小逻辑卷等操作时应格外小心，因为如果操作不当，可能会发生数据丢失。在对存储配置进行重大更改之前，务必确保已进行备份。\n\
  \n\nRHEL 中的 RAID 配置涉及将多个物理磁盘组合成单个逻辑单元，以提高数据冗余、性能或两者兼顾。不同的 RAID 级别提供了不同程度的冗余性能优化。例如，RAID\
  \ 1 在多个磁盘上镜像数据以实现冗余，而 RAID 0 通过对数据进行条带来提高性能。RHEL 支持各种 RAID 级别，管理员可以根据数据保护和性能之间的所需平衡选择最合适的配置。\n\
  \n`mdadm` 工具通常用于管理 RHEL 中的软件 RAID 配置。以下是步骤：\n\n\n\n\n\n\nmdadm --create --verbose\
  \ /dev/md0 --level=1 --raid-devices=2 /dev/sdb1 /dev/sdc1\n```\n\n### 2. RAID 0\
  \ (条带)：创建一个名为 `md1` 的 RAID 0 阵列，使用两个磁盘 `/dev/sdb1` 和 `/dev/sdc1`：\n\nmdadm --create\
  \ --verbose /dev/md1 --level=0 --raid-devices=2 /dev/sdb1 /dev/sdc1\n```\n\n###\
  \ 3. RAID 5 (带校验的条带)：创建一个名为 `md2` 的 RAID 5 阵列，使用三个磁盘 `/dev/sdb1`、`/dev/sdc1` 和 `/dev/sdd1`：\n\
  \nmdadm --create --verbose /dev/md2 --level=5 --raid-devices=3 /dev/sdb1 /dev/sdc1\
  \ /dev/sdd1\n```\n\n### 4. RAID 10 (镜像条带)：创建一个名为 `md3` 的 RAID 10 阵列，使用四个磁盘 `/dev/sdb1`、`/dev/sdc1`、`/dev/sdd1`\
  \ 和 `/dev/sde1`：\n\nmdadm --create --verbose /dev/md3 --level=10 --raid-devices=4\
  \ /dev/sdb1 /dev/sdc1 /dev/sdd1 /dev/sde1\n```\n\n### 5. 显示 RAID 信息：显示已创建 RAID 阵列的信息：\n\
  \ncat /proc/mdstat\n```\n\n### 6. 监控 RAID 阵列：监控 RAID 阵列的状态：\n\nmdadm --detail /dev/md0\n\
  ```\n\n### 7. 停止并移除 RAID 阵列：停止并移除 RAID 阵列（将 `/dev/md0` 替换为相应的 RAID 设备）：\n\nmdadm\
  \ --stop /dev/md0\nmdadm --remove /dev/md0\n```\n\n这些示例假设我们有可用的磁盘（如 `/dev/sdb1`、`/dev/sdc1`\
  \ 等）来创建 RAID 阵列。请根据我们的特定配置调整磁盘名称和 RAID 设备名称。在处理 RAID 配置时请务必小心，因为不当的操作可能会导致数据丢失。此外，建议定期检查\
  \ RAID 阵列的状态，以发现任何问题或磁盘故障。\n## 文件系统\n\n在 RHEL 中，文件系统在组织和管理存储设备上的数据方面起着至关重要的作用。RHEL\
  \ 支持多种文件系统，其中 `.ext4` 文件系统因其可靠性、性能以及日志功能成为默认选择。`.ext4` 能够高效处理元数据日志等任务，确保系统崩溃期间数据的一致性。此外，RHEL\
  \ 还采用了 `XFS` 文件系统，该系统以可扩展性、高性能以及适用于处理大文件和大卷的能力而闻名。RHEL 的文件系统选择还扩展到 `Btrfs`，提供了快照和校验和等高级功能以增强数据完整性。通过\
  \ `LVM` 和 `RAID` 配置等选项，RHEL 管理员拥有了一个多功能工具箱来管理存储资源、确保数据安全并在各种企业环境中优化系统性能。\n\n文件系统层级结构标准\
  \ (`FHS`) 是一套用于组织类 Unix 操作系统（包括 Linux）文件系统的指南和规范。`FHS` 定义了目录结构以及每个目录的用途，确保了不同 Linux\
  \ 发行版之间的一致性和兼容性。它建立了一个标准的层级结构，例如将系统文件与用户文件分离，定义了 `/bin` 用于基本命令二进制文件、`/etc` 用于配置文件、`/home`\
  \ 用于用户家目录以及 `/var` 用于可变数据文件。遵循 `FHS` 有助于维护结构化且可预测的文件系统布局，便于软件安装、系统管理以及不同 Linux 发行版之间的互操作。\n\
  文件系统中的配额（quota）是一种用于限制和管理用户及组磁盘使用的机制，确保存储资源的公平分配，并防止任何单个用户或组过度消耗。配额可以对磁盘空间和 inode\
  \ 实施软限制（允许临时过度使用）和硬限制（严格上限）。它们通常实现在 `XFS` 和 `ext4` 等文件系统上，并使用 `xfs_quota` 或 `quota`\
  \ 等工具进行配置。挂载配置中的 `usrquota` 和 `grpquota` 选项分别用于为用户和组启用配额。这确保了多用户环境中对资源使用的精确控制，维护了系统性能和稳定性。\n\
  \n## 交换空间 (Swap)\n\n在 Linux 中管理交换空间（swap）对于优化系统性能以及创建和管理补充物理内存的交换空间关重要。交换空间由 Linux\
  \ 内核内存管理子系统控制，当系统 RAM 使用超过定义的限制时，用于存储不活跃的内存页，形成虚拟内存。交换空间的大小取决于系统的内存负载，根据总物理内存提供了建议，如表\
  \ 3.2 所示：\n| RAM 大小 | Swap 大小 | 启用休眠 |\n| :--- | :--- | :--- |\n| 少于 2 GiB | 2x\
  \ RAM | 3x RAM |\n| 2 GiB 到 8 GiB | 与 RAM 相同 | 2x RAM |\n| 8 GiB 到 64 GiB | >4 GiB\
  \ | 1.5 x RAM |\n\n表 3.2：根据 RAM 的建议交换空间\n\n我们可以使用 `parted` 和 `mkswap` 工具创建交换分区，并将文件系统类型设置为\
  \ `linux-swap` 以保持清晰。详细介绍了如何使用 `swapon` 和 `swapoff` 命令激活和禁用交换空间，并讨论了通过 `/etc/fstab`\
  \ 文件实现交换空间激活的持久化。此外，本节还涵盖了在定义多个交换空间时设置交换空间优先级以优化内核利用的方法。总体而言，它提供了对交换空间的全面理解。\n\n\
  \n在 Linux 中可以使用硬链接和软链接（符号链接）创建指向同一文件的多个名称。它们各有优势和局限性。硬链接限制于普通文件且仅限同一个文件系统。使用 `ln`\
  \ 命令创建的软链接可以跨不同的文件系统，并链接到目录或特殊文件。\n\n以下命令将 `newfile.txt` 创建为 `original.txt` 的硬链接：\n\
  \nln original.txt\n```\n`-rw-r--r-- 2 devops 0 Dec 31 10:53 original.txt`\n\n然而，硬链接限制于普通文件且仅限同一个文件系统。使用\
  \ `ln -s` 命令创建的软链接可以跨不同的文件系统。\n以下命令创建软链接 `newfile.txt`：\n\n```bash\nln -s original.txt\n\
  ```\n\n日常管理包括创建和管理链接、识别链接关系以及处理悬空软链接（dangling soft links）。当尝试访问链接的文件时，悬空软链接会产生以下消息：\n\
  \n```bash\ncat soft.txt\n`cat: soft.txt: No such file or directory`\n\n## SMB 存储\n\
  \n使用服务器消息块 (`SMB`) 和网络文件系统 (`NFS`) 等协议访问网络附属存储 (NAS)，允许用户跨网络共享和管理文件。以下是使用 Windows\
  \ 环境中常用的 SMB/CIFS 协议访问 NAS 的基本步骤：\n1. **安装必要的包**：确保已安装了必要的 SMB 客户端包。在 RHEL 中我们可以使用：\n\
  \n   ```bash\n   sudo dnf install cifs-utils\n   ```\n2. **创建挂载点**：创建一个我们想要挂载 SMB\
  \ 共享的目录。例如：\n\n   ```bash\n   mkdir /mnt/smbshare\n   ```\n3. **挂载 SMB 共享**：使用 `mount.cifs`\
  \ 命令挂载 SMB 共享。将 `//server/share` 替换为实际的 SMB 共享路径，并在提示时提供用户名和密码：\n\n   ```bash\n\
  \   mount.cifs //server/share /mnt/smbshare -o username=nas_username,password=nas_password\n\
  \   ```\n   我们也可以将凭据添加到密码文件中并在挂载时使用：\n\n   ```bash\n   echo \"username=nas_username\"\
  \ > ~/.smbcredentials\n   echo \"password=nas_password\" >> ~/.smbcredentials\n\
  \   mount.cifs //server/share /mnt/smbshare -o credentials=~/.smbcredentials\n \
  \  ```\n\n4. **访问 SMB 共享**：导航到挂载点（在此例中为 `/mnt/smbshare`）以访问 SMB 共享的内容。\n\n\n\n\n\
  # NFS 存储\n\n\n`NFSv4` 仅使用 `TCP` 协议，而早期版本可以使用 `TCP` 或 `UDP` 进行通信。\n\n## 挂载\n\n\n\
  1. **识别**：确定可用的 NFS 共享。我们可以从 NFS 服务器管理员处获取这些信息，也可以以 root 用户身份探索服务器的根目录。访问具有 Kerberos\
  \ 安全性的共享可能会被拒绝，但共享名称仍然可见。\n\n2. **挂载点**：创建一个目录作为挂载点。使用 `mkdir` 命令创建它。\n\n\n    *\
  \ **临时挂载**：使用 `mount` 命令，例如：\n\n      ```\n      $ sudo mount -t nfs -o rw,sync\
  \ server:/share /mnt/nfs\n      这将临时挂载共享，适用于一次性访问或测试。\n\n    * **持久挂载**：在 `/etc/fstab`\
  \ 文件中添加条目以确保 NFS 共享在启动时挂载。然后，使用以下命令进行挂载：\n\n      ```bash\n      ```\n      NFS\
  \ 客户端服务从 `/etc/fstab` 读取服务器和挂载选项，因此我们不需要在命令行中指定它们。\n\n4. **卸载**：作为 root 用户或使用 `sudo`，使用\
  \ `umount` 命令卸载 NFS 共享，例如：\n\n      $ sudo umount /mnt/nfs\n      ```\n\n> 注意：卸载共享不会删除其在\
  \ `/etc/fstab` 中的条目。\n\n\n使用直接映射和间接映射（包括通配符）自动挂载 NFS 共享。\n\n自动挂载器（`autofs`）是一个根据需要自动挂载\
  \ NFS 共享并在不再使用时将其卸载的服务。它提供了以下几点优势：\n\n* NFS 共享对所有用户可用，但取决于访问权限。\n* 共享不会永久连接，从而节省了资源。\n\
  * 配置在客户端完成；不需要对服务器进行更改。\n* 它支持各种挂载选项和网络文件系统。\n* 映射可以是直接的或间接的，为挂载点提供了灵活性。\n配置自动挂载涉及几个步骤，具体如下：\n\
  \n1. **安装 autofs**：使用我们的包管理器在系统上安装 `autofs` 软件包。\n\n   ```bash\n   ```\n\n2. **创建主映射**：添加主映射文件（例如\
  \ `/etc/auto.master.d/demo.autofs`）以识别挂载点的基目录并指定映射文件。使用绝对文件名并确保它具有 `.autofs` 扩展名。\n\
  \n   ```\n   ```\n\n3. **创建映射文件**：创建映射文件（例如 `/etc/auto.demo`）来定义自动挂载的挂载点、选项和源位置。\n\
  \n   ```\n   ```\n\n4. **启动 autofs**：使用 `systemctl` 启动并启用 `autofs` 服务。\n\n   ```bash\n\
  \   ```\n\n## 直接映射和间接映射\n\n通过自动挂载器，我们可以如下所示配置两种类型的映射。\n* **直接映射**：这些映射将 NFS 共享映射到现有绝对路径挂载点。在主映射文件中，使用\
  \ `/-` 作为基目录。在映射文件中，指定挂载点和选项。\n\n  ```\n  /- /etc/auto.direct\n  /mnt/docs -rw,sync\
  \ server:/nfs/docs\n  *(注：此处原文示例中为 docs，为保持一致性保持原样)*\n\n* **间接映射**：当 NFS 服务器导出一个目录内的多个子目录时，我们可以配置自动挂载器使用单个映射条目访问这些子目录中的任何一个。使用\
  \ `*` 作为键，并在源位置使用 `&`。\n\n  ```\n  ```\n\n在 Linux 环境中访问 NAS 对于高效管理共享资源至关重要。NFS 协议和自动挂载器提供了实现这一点的强大工具。通过理解这些概念并练习指导练习，我们将完全有能力管理自己\
  \ Linux 系统中的网络附加存储。\n\n## 结论\n本章对红帽系统管理（Red Hat System Administration）进行了全面探索，重点关注有效系统管理所需的必备技能和工具。从网络配置、用户和组管理、任务调度、存储解决方案和服务控制开始，这为实践系统管理和\
  \ RHCE 认证准备奠定了坚实的基础。关键亮点包括对网络管理的深入讨论，涵盖了主机名设置、DNS 解析以及使用 `nmcli` 和 `ip` 等命令进行网络接口故障排除。关于用户和组管理的实用指导强调了安全的账户创建，以及使用\
  \ `chmod`、`chown` 和 `ACLs` 等工具对权限和访问控制的管理。本章还涵盖了使用 `cron`、`anacron` 和 `systemd`\
  \ 定时进行任务调度，说明了 Linux 在自动化常规流程方面的灵活性。对文件系统管理的见解包括 `LVM` 和 `RAID` 配置，展示了 Linux 存储解决方案的稳健性。此外，通过\
  \ `top` 和 `uptime` 进行进程管理和实时监控展示了优化技术。最后，将 `systemd` 作为服务管理的基石强调了它在现代 RHEL 系统中的关键作用。`systemctl`\
  \ 工具提供了控制、启用和调试服务及守护程序的实用知识。\n\n在下一章中，重点将转向使用 `Ansible` 这种简化并提升系统管理效率的强大工具。读者将探索\
  \ `Ansible` 的架构、临时命令、脚本（playbooks）和高级功能，为精简 IT 运营和深层次自动化知识奠定基础。\n\n## 重点回顾\n* 在\
  \ RHEL 中，使用 `hostname` 和 `hostnamectl` 命令、存根解析器以及 `nmcli`、`ip`、`ping`、`tracepath`\
  \ 和 `ss` 等工具完成主机名管理、DNS 配置和网络接口故障排除，确保系统管理和网络功能。\n* 为了在系统上调度未来的任务，管理员可以使用 `crond`\
  \ 执行特定时间的循环命令，使用 `anacron` 确保即使系统关闭重要任务也能运行，以及使用 `systemd` 定时器基于时间激活其他 systemd 单元，每种工具都有自己的配置和语法。\n\
  * 管理本地用户和组是 Linux 系统管理的一个关键方面，涉及用户和组管理、密码配置、超级用户访问以及使用 `useradd`、`usermod`、`userdel`、`groupadd`、`groupmod`\
  \ 和 `groupdel` 命令来创建、修改和删除用户和组账户。\n* Linux 管理员可以使用 `chmod` 和 `chown` 等命令有效地管理文件访问控制，理解设置权限的符号和数字方法，处理\
  \ `setuid`、`setgid` 和粘位等特殊权限，并利用默认权限和 `umask` 设置，同时还可以采用 ACL 为传统的 Unix 权限之外的文件和目录访问提供更细粒度的控制。\n\
  \n\n\n\n*   Linux 中有效的进程调度涉及时间分片、相对优先级（nice 值）以及使用 `nice` 和 `renice` 等命令来管理进程优先级；负载平均值（load\
  \ average）根据等待的资源请求提供了系统健康状况和性能趋势的洞察，而 `uptime` 命令则显示当前的负载平均值；实时进程监控通过如 `top` 等工具实现，其交互式功能便于识别和管理资源密集型进程。\n\
  \n\n*   Linux 存储包含了用于数据管理的各种技术和工具，包括用于动态磁盘空间分配的 `LVM`、用于数据冗和性能优化的 `RAID` 配置、多种文件系统（如\
  \ `.ext4`、`XFS` 和 `Btrfs`）、`swap` 空间管理以及硬软链接的使用；可以通过安装所需的软件包、创建挂载点并使用相应的命令，通过 `SMB`\
