  \n![](img/fm1.png)\n\n# 第 5 章 Ansible 企业\n\n## 引言\n\n在本章中，我们将学习最常用的 Ansible 模块和技术，将\
  \ Ansible 应用于每个组织，以及如何利用 Ansible 内容（如角色和集合）的代码复用来推动发展。\n\n## 结构\n\n本章涵盖了以下主题：\n\n\
  *   Ansible 安装\n*   Ansible navigator\n*   Linux 版 Ansible\n*   Ansible vault\n\
  *   配置文件\n*   角色 (Roles)\n*   集合 (Collections)\n*   测试\n*   Ansible Automation Platform\n\
  \n## 目标\n\n本章提供了一份全面指南，指导未来如何有效利用 Ansible 进行组织的 IT 自动化，从基础概念到高级技术。读者将获得使用 Ansible\
  \ 设置、配置和管理 IT 基础设施的实用技能。这包括理解如何安装和配置 Ansible 控制节点、管理托管节点、使用自动化内容导航器执行 playbook、管理自动化内容以及使用\
  \ Ansible vault 实施安全措施。本章为我们提供了自动化标准 RHCSA 任务、协调滚动更新以及理解 RHCSA 全能力所需的知识。\n\n## Ansible\
  \ 安装\n\n在控制节点上安装 Ansible 非常顺滑，因为 `ansible-core` 包直接包含在 RHEL 中。在目标节点上，不需要安装任何代理或类似软件，因为它使用\
  \ SSH 或 WinRM 连接。\n\nAnsible 控制节点是安装 Ansible 并运行所有任务和 playbook 的机器。控制节点必须具有访问所有托管节点（主机）的\
  \ SSH 和 WinRM 通信的网络权限。\n\n要设置控制节点，请遵循以下步骤：\n\n1. 安装所需的包：\n    1. 在 Linux 系统上：我们可以使用发行版的包管理器安装\
  \ Ansible。例如，在 RHEL 上，我们可以使用如下 `dnf` 命令：\n\n```\ndnf install ansible-core\n```\n\
  \n\n\n\n由于该包是 RHEL 应用流 (AppStream) 仓库的一部分，因此在整个 RHEL 生命周期内都受支持。与该发行版中的任何其他包一样，我们可以按照以下方式检查是否有更新（`check-update`）、查看更多信息（`info`）或使用\
  \ `upgrade` 升级到最新版本：\n\n```bash\ndnf upgrade ansible-core\n```\n\n2. 在基于 macOS 的系统上：`Homebrew`\
  \ 包管理器是安装和维护最新版本 Ansible 的首选方式。我们可以使用 `brew` 命令安装 `ansible-core` 或完整的 `ansible`\
  \ 社区包，如下：\n\n```bash\nbrew install ansible\n```\n\n3. 在 Windows 系统上：虽然 Ansible 不直接支持\
  \ Windows，但我们可以使用适用于 Linux 的 Windows 子系统 (`WSL`) 来安装 Linux 发行版，然后按照 Linux 的安装步骤进行操作。\n\
  \n4. 使用 Python 包管理器（`pip`）：我们可以通过 `pip` 获取最新版本的 Ansible。我们可以使用 `pip` 命令，如如下所示：\n\
  \n```bash\npip install ansible-core\n```\n\n| 请注意，某些 Linux 发行版需要额外的 `python-pip`\
  \ 或 `python3-pip` 包。`pip` 命令可能有变体，例如用于 Python 3 的 `pip3` 或针对特定版本的 `pip3.12`。 |\n\
  \n## 2. 创建静态主机清单文件\n\n主机清单文件包含了我们想要管理的主机的信息。在我们的项目目录下创建一个名为 `inventory` 的文件，使用简单的文本\
  \ INI 格式（initialization 的缩写）。在文件中，我们可以按照相应的组添加我们的主机，如下：\n\n```ini\n[webservers]\n\
  webserver1.example.com\nwebserver2.example.com\n\n[dbservers]\ndbserver1.example.com\n\
  ```\n\n这种结构允许我们把主机组织成组，以便执行特定的自动化任务。设置好清单文件后，我们就可以开始针对主机组或单个主机运行即时命令或剧本（playbooks）。例如，要\
  \ ping `webservers` 组中的主机，我们将使用以下命令：\n\n```bash\nansible webservers -m ping\n```\n\
  \n此命令检查我们 Web 服务器的连接性和响应情况。\n\n## 3. 创建配置文件（可选）\n\nAnsible 会在多个位置查找配置文件，并使用找到找到的一个。默认位置是\
  \ `/etc/ansible/ansible.cfg`。我们可以在项目目录下创建自定义的 `ansible.cfg` 来覆盖默认设置。需要包含的关键配置如下：\n\
  \n```ini\n[defaults]\ninventory = ./inventory\nremote_user = ansibleuser\nhost_key_checking\
  \ = False\n```\n\n此配置指定了清单文件的位置、默认远程用户，并禁用了新主机的 SSH 主机密钥检查。\n\n## 最佳实践与提示\n\n以下是在使用\
  \ Ansible 工作时提高效率和安全性的一些最佳实践和提示：\n\n- **版本控制**：将我们的清单文件、配置和剧本保留在版本控制下，以跟踪更改并与团队进行协作。\n\
  - **自定义模块和插件**：探索 Ansible 庞大的模块和插件生态系统，以扩展符合我们需求的功能。\n- **安全性**：使用 `Ansible vault`\
  \ 加密剧本或清单文件中的密码或密钥等敏感数据。\n\n## Linux 受管节点\n\n配置 Ansible 受管节点是为我们的 IT 基础设施建立自动化环境的关键步骤。本章的这一节深入探讨了许多要任务，例如通过\
  \ SSH 密钥建立安全通信、设置权限提升、部署文件以及将 shell 脚本转换为 Ansible 剧本。这些任务中的每一个旨在确保我们的受管节点已正确配置，以便高效、安全地执行自动化任务。\n\
  \n配置 Linux 受管节点是建立安全高效的自动化环境的关键步骤。以下是必须完成的关键任务，以确保 Ansible 控制节点与受管节点之间正确的通信和设置：\n\
  \n1. **生成 SSH 密钥**：在 Ansible 控制节点上，如果我们尚未生成，请使用 `ssh-keygen` 命令生成新的 SSH 密钥对。如果密钥将用于自动化任务，请保持密码为空。\n\
  \n   ```bash\n   ssh-keygen -t rsa -b 4096\n   ```\n\n2. **复制 SSH 公钥**：使用 `ssh-copy-id`\
  \ 命令将 SSH 公钥复制到每个受管节点。此步骤需要远程用户账户的密码，并可以实现免密 SSH 访问。\n\n   ```bash\n   ssh-copy-id\
  \ user@managed_node_address\n   ```\n\n## 在受管节点上配置权限提升\n\n在受管节点上配置权限提升是允许 Ansible\
  \ 在无需人工干预的情况下执行管理任务的重要步骤。按照以下步骤操作确保权限设置正确：\n\n1. **编辑 sudoers 文件**：在受管节点上使用 `visudo`\
  \ 命令安全地编辑 sudoers 文件。此步骤对于指定哪些用户可以提升权限以及在什么条件下至关重要，如下：\n\n   ```bash\n   visudo\n\
  \   ```\n\n2. **配置免密 sudo**：添加一行允许 Ansible 用户（或我们控制节点使用的任何用户）在无密码提示的情况下执行 `sudo`\
  \ 命令。\n\n   ```bash\n   ansible ALL=(ALL) NOPASSWD: ALL\n   ```\n\n## 将文件部署到受管节点\n\
  \n使用 Ansible 的 `copy` 模块将文件从控制节点部署到受管节点。示例剧本将配置文件复制到受管节点上的特定目录：\n\n```yaml\n---\n\
  - name: Deploy Configuration File\n  hosts: all\n  tasks:\n    - name: Copy configuration\
  \ file to managed node\n      ansible.builtin.copy:\n        src: /path/to/local/config.file\n\
  \        dest: /path/to/remote/config.file\n        owner: root\n        group:\
  \ root\n        mode: '0644'\n```\n\n## 分析 shell 脚本并将其转换为剧本\n\n将 shell 脚本转换为剧本是利用\
  \ Ansible 自动化能力的强大方法，同时确保任务以重复且幂等的方式执行。按照以下步骤将 shell 脚本转换为剧本：\n\n1. **识别脚本操作**：检查\
  \ shell 脚本以理解它执行的操作，例如安装包、编辑文件或启动服务。\n2. **脚本转剧本**：对于脚本识别出的每个操作，找到对应的 Ansible 模块并在剧本中创建任务。以下是将安装\
  \ nginx 的脚本转换为使用 `yum` 模块 任务的示例：\n\n```yaml\n---\n- name: Install nginx\n  hosts:\
  \ web_servers\n  become: true\n  tasks:\n    - name: Ensure nginx is installed\n\
  \      ansible.builtin.yum:\n        name: nginx\n        state: present\n```\n\n\
  ## Windows 受管节点\n\n了解前提并设置环境对于使用 Ansible 管理 Windows 节点并确保自动化工作流畅至关重要。如所述，Windows\
  \ 受管节点与 Ansible 工作的最低要求包括 `PowerShell` 3.0 和至少的 `.NET` 4.0。\n\n本节提供了使用 Ansible 设置和管理\
  \ Windows 节点的简要概述和补充说明。这通常包括 Windows Server 2008 R2 及更高版本，以及 Windows 7 及更高版本。\n\n\
  ## 设置 Windows 受管节点\n\n为了准备 Windows 机器以便 Ansible 管理，请按照以下步骤操作：\n\n\n\n\n\n1. **PowerShell\
  \ 和 .NET Framework**: 确保已安装 `PowerShell 3.0`（或更高版本）和 `.NET Framework 4.0`（或更高版本）。较版本的\
  \ Windows 默认包含这些内容。\n\n2. **WinRM**: Ansible 通过 `WinRM` 与 Windows 机器通信。我们需要在 Windows\
  \ 主机上配置 `WinRM`。微软提供了一个脚本来方便此配置，可以在 Windows 主机上下载并运行，如下所示：\n\n`ConfigureRemotingForAnsible.ps1`\n\
  \n该脚本根据我们的偏好设置 `WinRM` 使用 `HTTP`（不安全）或 `HTTPS`（安全）。生产环境推荐 `HTTPS`。\n\n3. **防火墙规则**:\
  \ 确保 Windows 机器上的防火墙允许通过 `WinRM` 端口连接（`HTTP` 默认为 `5985`，`HTTPS` 为 `5986`）。\n\n4.\
  \ **清单配置**: 将 Windows 主机添加到我们的 Ansible 清单中，指定连接变量，如下：\n\n```ini\n[windows]\nwindows1.example.com\n\
  windows2.example.com\n\n[windows:vars]\nansible_user=ansible\nansible_password=YourPassword\n\
  ansible_connection=winrm\nansible_winrm_transport=basic # 或其他支持的传输方法\nansible_winrm_server_cert_validation=ignore\
  \ # 对于 HTTPS，考虑配置适当的验证\n```\n\n5. **执行 playbook**: 对 Windows 主机运行 playbook 时，确保我们的任务使用\
  \ Windows 兼容的模块，例如 `win_command`、`win_copy`、`win_feature` 等。\n\n以下是一个 Ansible playbook\
  \ 示例，用于确保 Windows 服务器上安装了 Windows 功能 `telnet client`：\n\n```yaml\n---\n- name: Ensure\
  \ Telnet Client feature is installed on Windows Servers\nhosts: windows\ntasks:\n\
  \  - name: Install Telnet Client\n    win_feature:\n      name: \"Telnet-Client\"\
  \n      state: present\n```\n\n# 权限提升\n\n权限提升是计算机安全和系统管理背景下的一个关键概念，特别是在由 Ansible\
  \ 等自动化工具管理的环境中。它指的是用户获得对通常受入门账户保护的资源的高级访问权限。这通常发生在以下两种范围内：\n\n- **垂直权限提升**: 涉及获得比最初分配更高的权限或访问权限，通常这些权限是为系统管理员或服务保留的（例如，`root`\
  \ 权限）。这通常是攻击者的目标，他们以低权限用户身份获得系统脚点，但需要更多控制权来实现目标。\n- **水平权限提升**: 当用户获取另一个用户的权限时发生，该用户具有相同级别的特权访问，但在该级别内具有不同的权限或能力（例如，访问另一个普通用户的机密文档）。\n\
  \n## 安全中的重要性\n\n恶意者经常利用权限提升来利用软件漏洞或系统配置错误以获取扩展的权限。有了这些权限，攻击者可以安装持久性威胁、访问敏感数据，甚至完全控制系统。从防御的角度来看，理解权限提升对于保护系统免受此类攻击至关重要。\n\
  \n# Ansible 中的权限提升\n\n在 Ansible 的语文中，权限提升是负责任且符合设计初的。Ansible 可以为合法目的自动化权限提升过程，例如管理配置和安装软件，这些操作通常需要比授予普通用户更高的权限。\n\
  \n以下是 Ansible 处理权限提升的方式：\n\n- **become 参数**: Ansible 中处理权限提升最常见的方法是通过 `become` 关键字，它允许\
  \ Ansible 任务以另一个用户（通常是超级用户 `root`）的权限执行。该关键字可以在任务级、play 级甚至在 playbook 的全局范围内进行设置。\n\
  \n以下是在 playbook 中使用 `become` 的示例：\n\n```yaml\n---\n- name: Install package as root\n\
  hosts: all\nbecome: true\ntasks:\n  - name: Install a package\n    Ansible.builtin.dnf:\n\
  \      name: vim\n      state: latest\n```\n\n- **become_method**: 虽然权限提升的默认方法是\
  \ `sudo`，但 Ansible 支持其他方法，如 `su`、`pbrun`、`pfexec` 等。这通过使用 `become_method` 关键字指定。\n\
  - **become_user**: 指定你想要提升权限的用户。默认用户是 `root`，但你可以指定任何用户。\n\n以下是指定方法和用户的示例：\n\n```yaml\n\
  ---\n- name: Run script as some_user\nhosts: all\nbecome: true\nbecome_method: su\n\
  become_user: some_user\ntasks:\n  - name: Run a script\n    ansible.builtin.script:\
  \ /usr/local/bin/somescript.sh\n```\n\n# 权限提升的安全最佳实践\n\n在配置权限提升时，遵循安全最佳实践以降低风险并确保负责任地使用高级访问权限。\n\
  \n以下是需要考虑的关键实践：\n\n- **最小权限原则**: 确保用户和进程使用完成工作所需的最小权限运行。这可以最大限度地减少潜在破坏的影响。\n- **审计与监控**:\
  \ 详细记录何时由谁使用了权限提升。监控这些日志有助于检测未经授权的高级访问尝试。\n- **安全凭据管理**: 使用密钥管理工具安全地存储和管理权限提升所需的密码和密钥。\n\
  - **定期更新和补丁**: 保持系统和应用程序更新，以减少可能被用于权限提升的漏洞。\n- **使用强身份验证机制**: 对于具有执行权限提升能力的账户采用强身份验证机制（例如双因子身份验证）。\n\
  \n## Ansible navigator\n\n`Ansible navigator` 是自动化内容导航器的简称，用于扩展原始 `ansible-playbook`\
  \ 命令的功能。该工具可以运行 playbook 并管理 Ansible 内容集合，应用提高 IT 自动化策略效率和可扩展性的先进实践。自动化内容导航器是 Ansible\
  \ 生态系统一个概念工具，旨在简化自动化内容的发现、管理和实现。自动化内容导航器是一个带有文本用户界面的命令行工具，为内容创建者量身定制。其核心能力如下：\n\n\
  - 启动和监控作业以及 playbook 执行。\n- 以 JSON 格式共享存储的、完成的 playbook 和作业运行制品。\n- 浏览和检查自动化执行环境以及基于文件的清单。\n\
  - 渲染 Ansible 模块文档并提取 playbook 可用的示例。\n- 通过用户界面提供详细的命令输出。\n\n## 安装\n\n按照以下简化步骤在通过\
  \ Red Hat Subscription Manager 注册的 RHEL 上安装内容导航器：\n\n1. **安装程序**:\n   - 挂载库存单元 (SKU)：首先，使用命令将我们的\
  \ RHEL 挂载到 Red Hat Ansible Automation Platform SKU：\n     `subscriptionmanager attach\
  \ --pool=<sku-pool-id>`\n\n2. **启用仓库**:\n   - 为 RHEL 9 启用 Ansible Automation Platform\
  \ (AAP) 2.5（根据我们的当前版本调整）仓库，如下：\n     `subscription-manager repos --enable ansible-automation-platform-2.5-for-rhel-9-x86_64-rpms`\n\
  \n3. **安装自动化内容导航器**。\n\n\n\n\n\n- 执行以下命令继续安装：\n\n```bash\ndnf install ansible-navigator\n\
  ```\n\n## 4. 验证\n\n- 通过检查其帮助部分来确认自动化内容导航器已安装：\n\n```bash\nansible-navigator --help\n\
  ```\n\n此命令应显示帮助信息，表示安装成功。\n\n通过遵循这些步骤，我们已经在 RHEL 系统上安装了自动化内容导航器，准备简化我们的 Ansible\
  \ playbook 的创建和管理流程。\n\n## 命令行界面\n\n`Ansible CLI` 提供了一系列命令，用于直接从终端管理自动化任务。随着 `Ansible\
  \ navigator` 的引入，许多熟悉的 CLI 命令都得到了扩展，在本地和执行环境中提供了更增强的功能和灵活性。\n\n`ansible-navigator\
  \ stdout` 模式支持直接从命令行执行熟悉的 Ansible 命令和扩展，便于快速执行以下任务：\n\n- 使用方法：我们可以使用 `-m stdout`\
  \ 子命令在自动化执行环境或本地机器上执行标准的 Ansible 命令。\n- 帮助选项：`--help` 命令或任何子命令（例如 `ansible-navigator\
  \ config --help`）提供了有关支持的参数及其配置的详细信息。\n\n以下是标准 Ansible CLI 命令与其对应的 Ansible navigator\
  \ 命令的对比：\n\n| Ansible 命令行界面 | Ansible navigator |\n| :--- | :--- |\n| `ansible-galaxy\
  \ collection` | `ansible-navigator collections` |\n| `ansible-config` | `ansible-navigator\
  \ config` |\n| `ansible-doc` | `ansible-navigator doc` |\n| `ansible-inventory`\
  \ | `ansible-navigator inventory` |\n| `ansible-playbook` | `ansible-navigator run`\
  \ |\n\n表 5.1: Ansible navigator 命令\n\n## 文本界面\n\nAnsible 命令的文本界面提供了一种交互模式，适用于内容评估、playbook\
  \ 执行以及使用制品文件进行运行后故障排除。\n\n此模式增强了与自动化内容的交互，功能如下：\n\n- 冒号命令：使用冒号前缀访问所有自动化内容导航器命令，例如\
  \ `:run` 或 `:collections`。\n- 导航：显示分页、滚动和访问帮助的说明，同时带有颜色编码的输出，以便于解释弃用模块等信息。\n\n通过理解如何导航和利用抽象的自动化内容导航器概念，用户可以有效地管理\
  \ playbooks 和清单，并使用内容集合和执行环境增强其 Ansible 环境。这些实践不仅简化了运行 playbooks 的过程，还鼓励了社区内或组织不同项目之间自动化内容的复用和共享。\n\
  \n## 用于 Linux 的 Ansible\n\n这些是我们在 Ansible playbook 或角色中常用的代码片段。文件、软件包和服务的管理非常有用。正如我们在上一节中讨论的，对于每个简单的\
  \ shell 脚本，我们都能将其转换为系统的 playbook。为了有效利用 Ansible 处理 IT 基础设施中的常见自动化任务，让我们探索如何编写涉及文件、软件包和服务管理以及执行滚动更新常用的\
  \ Ansible playbook。这些任务构成了许多自动化脚本的骨干，为系统管理提供了稳健的基础。\n\n## 文件管理\n\n文件文件是系统管理的关键方面。它涉及创建、复制、移动和删除文件或目录等任务。\n\
  \n### 确保目录存在\n\n为了确保目录存在并具有正确的权限，我们可以使用 `ansible.builtin.file` 模块，如下：\n\n```yaml\n\
  - name: Ensure directory /example exists\nansible.builtin.file:\n  path: /example\n\
  \  state: directory\n  mode: '0755'\n```\n\n### 复制文件\n\n要将本地文件复制到远程系统，使用 `ansible.builtin.copy`\
  \ 模块，如下：\n\n```yaml\n- name: Copy file to remote system\nansible.builtin.copy:\n\
  \  src: /local/path/to/file.txt\n  dest: /remote/path/to/file.txt\n```\n\n### 删除文件\n\
  \n`ansible.builtin.file` 模块允许你管理远程主机上的文件和符号链接。以下是使用该模块删除文件和创建符号链接的示例：\n\n```yaml\n\
  - name: Remove a file\nansible.builtin.file:\n  path: /path/to/file\n  state: absent\n\
  ```\n\n创建符号链接：\n\n```yaml\n- name: Create a symbolic link\nansible.builtin.file:\n\
  \  src: /path/to/original\n  dest: /path/to/link\n  state: link\n```\n\n## 服务管理\n\
  \n服务管理涉及启动、停止以及确保系统服务的启用或禁用状态。\n\n以下是一个示例：\n\n- 启动服务：\n```yaml\n- name: Start nginx\
  \ service\nansible.builtin.service:\n  name: nginx\n  state: started\n  enabled:\
  \ true\n```\n\n- 重启服务：\n```yaml\n- name: Restart nginx\nansible.builtin.service:\n\
  \  name: nginx\n  state: restarted\n```\n\n- 停止服务：\n```yaml\n- name: Stop nginx\n\
  ansible.builtin.service:\n  name: nginx\n  state: stopped\n```\n\n## 滚动更新\n\n滚动更新对于在应用程序更新或配置更改期间尽量减少停机时间至关重要。在\
  \ Ansible 中，可以使用动态清单和针对特定主机组的 playbook 实现滚动更新，如下：\n\n```yaml\n- name: Rolling update\
  \ for web servers\nhosts: webservers\nserial: 1 # 一次更新一台服务器\ntasks:\n  - name: Pull\
  \ latest code\n    ansible.builtin.git:\n      repo: 'https://example.com/repo.git'\n\
  \      dest: /path/to/destination\n      version: master\n  - name: Restart web\
  \ service\n    ansible.builtin.service:\n      name: nginx\n      state: restarted\n\
  ```\n\n此 playbook 对清单中定义的 Web 服务器组执行滚动更新。它一次更新一台服务器，从 Git 仓库拉取最新代码并重启 NGINX 服务。\n\
  \n## Jinja2 模板\n\nJinja2 是一种在 Python 中流行的现代且对设计人员友好的模板语言。它快速、广泛使用、安全并集成在 Ansible\
  \ 中。在 Ansible 的语文中，Jinja2 模板是一个强大的功能，允许动态表达式和变量访问。模板通常用于自动化配置文件，因为它们可以使用变量进行自定义。Jinja2\
  \ 模板允许我们使用占位符来代表在运行时求值的变量和表达式。这使得能够从静态文件创建动态内容，这对于某些值可能会根据环境、主机或任何其他特定上下文数据而变化的配置特别有用。\n\
  \n### 基础语法\n\n理解 Jinja2 的基础语法对于在 Ansible 中处理模板至关重要。以下是开发 playbooks 和模板时经常使用的 Jinja2\
  \ 语法的一些关键元素：\n\n- 变量：我们可以使用 `{{ variable_name }}` 来插入变量的值。\n- 控制结构：Jinja2 支持循环和条件等控制结构。以下是遍历列表的示例：\n\
  \n```twig\n{% for item in my_list %}\n- {{ item }}\n{% endfor %}\n```\n- 过滤器：过滤器用于修改变量。它们使用管道符号\
  \ (`|`) 应用到变量上。例如，将字符串首字母大写：`{{ \"hello world\" | capitalize }}` 在屏幕上产生 Hello World。\n\
  \n### 在 Ansible 中使用 Jinja2 模板\n\n在 Ansible 中，Jinja2 模板通常有两种使用方式，如下：\n\n- 直接在 playbook\
  \ 中：用于内联动态内容生成。\n- 模板文件：从模板生成文件。这是通过 `template` 模块实现的。\n\n示例：生成配置文件。\n\n\n\n\n\n\
  假设我们有一个用于应用程序配置文件的 Jinja2 模板 `app.conf.j2`：\n\n```ini\n[server]\naddress = {{ server_address\
  \ }}\nport = {{ server_port | default('80') }}\n\n[database]\nname = {{ database_name\
  \ }}\n```\n\n我们可以使用 Ansible 的 `template` 模块从此模板生成配置文件，如下：\n\n```yaml\n- name: Generate\
  \ configuration file from template\n  ansible.builtin.template:\n    src: app.conf.j2\n\
  \    dest: /etc/myapp/app.conf\n  vars:\n    server_address: '192.168.1.10'\n  \
  \  database_name: 'mydatabase'\n```\n\n此 playbook 代码段使用 `template` 模块将 `app.conf.j2`\
  \ 作为源文件并将其渲染到 `/etc/myapp/app.conf`，同时将 `server_address` 和 `database_name` 变量替换为给的值。\n\
  \n## Ansible 中的高级 Jinja2 特性\n\n*   **访问 Ansible facts**：我们可以在模板中使用 Ansible facts，这些是\
  \ Ansible 自动从主机系统中发现的变量。例如，`{{ ansible_facts[hostname] }}`。\n*   **条件表达式**：Jinja2\
  \ 允许在模板中使用条件表达式，从而创建高度定制的配置。例如：\n\n    ```jinja2\n    {% if enable_feature %}\n\
  \    feature_flag = true\n    {% endif %}\n    ```\n\n## Ansible 中 Jinja2 模板的最佳实践\n\
  \n在 Ansible 中处理 Jinja2 模板时，遵循最佳实践可以确保你的模板具有可维护性、安全性且无错误。以下是一些关键建议：\n\n*   保持可读性：虽然\
  \ Jinja2 模板非常强大，但要避免使用会让模板难以阅读和维护的过度表达式。\n*   **模板检查 (Template linting)**：使用 lint\
  \ 工具来检查我们的 Jinja2 语法并遵循最佳实践。\n*   **安全模板处理**：注意模板中处理的数据，特别是在处理用户输入时，以避免注入漏洞。\n\n\
  Ansible 中的 Jinja2 模板为创建动态的、数据驱动的配置提供了一种强大的方法。通过利用这些模板，我们可以简化配置管理流程，使其更加高效并能够适应环境的变化。\n\
  \n## 用户管理\n\n在任何类 Unix 操作系统中，用户和组管理对于保护资源访问至关重要。用户代表可以向系统请求资源的个人或服务，而组则帮助定义具有共同权限集的用户集合。手动管理这些实体可能会出错且效率低下，特别是在规模化的情况下。Ansible\
  \ 自动化了多个系统中用户账户和组的配置、设置和管理，在确保一致性和可靠性的同时，减少了手动开销和潜在错误。它使用了如 `user` 和 `group` 等模块，这些模块是等等的（idempotent），这意味着重复执行\
  \ playbook 会产生相同的系统状态，而不会产生副作用。\n\n## 管理用户的 Ansible playbook\n\n以下是一个演示创建用户并将用户添加到组的简单\
  \ playbook：\n\n```yaml\n- name: Manage Users and Groups\n  hosts: all\n  become:\
  \ true\n  tasks:\n    - name: Ensure group \"webadmin\" exists\n      ansible.builtin.group:\n\
  \        name: webadmin\n        state: present\n\n    - name: Create user \"john\"\
  \n      ansible.builtin.user:\n        name: john\n        group: webadmin\n   \
  \     createhome: yes\n        shell: /bin/bash\n        state: present\n\n    -\
  \ name: Ensure user \"john\" has sudo privileges\n      ansible.builtin.copy:\n\
  \        dest: /etc/sudoers.d/john\n        content: \"john ALL=(ALL) NOPASSWD:\
  \ ALL\"\n        validate: 'visudo -cf %s'\n```\n\n以下是对上述代码的解释：\n\n*   **Group 模块**：确保\
  \ `webadmin` 组存在。\n*   **User 模块**：确保用户 `john` 存在，将其加入 `webadmin` 组并设置默认 shell 和家目录。\n\
  *   **Copy 模块**：添加一个 `sudoers` 文件允许 `john` 进行免密 sudo 访问，并带有语法验证。\n\n## 高级用法：管理多个用户\n\
  \n为了管理多个用户，Ansible 支持遍历在 playbook 内部或外部变量文件中定义的用户列表，如下：\n\n```yaml\n- name: Manage\
  \ Multiple Users\n  hosts: all\n  become: true\n  vars:\n    users:\n      - name:\
  \ john\n        shell: /bin/bash\n      - name: jane\n        shell: /bin/zsh\n\
  \  tasks:\n    - name: Ensure user exists\n      ansible.builtin.user:\n       \
  \ name: \"{{ item.name }}\"\n        shell: \"{{ item.shell }}\"\n        state:\
  \ present\n      loop: \"{{ users }}\"\n```\n\n## 处理用户删除\n\n要删除用户，只需将 `state` 参数更改为\
  \ `absent`。这对于注销操作非常有用，如下：\n\n```yaml\n- name: Remove user \"john\"\n  ansible.builtin.user:\n\
  \    name: john\n    state: absent\n```\n\nAnsible 提供了一个跨不同环境管理用户和组的健壮框架，利用简单易读的语法和等等操作。无论我们管理的是一小组服务器还是整个数据中心，Ansible\
  \ 的用户和组管理功能都能帮助简化流程并确保符合我们的访问策略。随着我们扩展 Ansible 的使用，请考虑集成其他模块和插件来处理更复杂的任务和工作流，增强基础设施的安全性和管理性。\n\
  \n## Ansible vault\n\n随着我们对自动化的需求增长，特别是在企业环境中，我们需要找到一种安全存储敏感信息的最佳方法。Ansible vault\
  \ 是集成在 Ansible 中的工具。\n\n### 创建加密文件\n\n要创建加密文件可以使用 `ansible-vault` 命令。它会在打开文件前提示我们输入新密码：\n\
  \n```bash\nansible-vault create secret.yml\n```\n\n或者，如果我们不想交互式输入密码，可以指定包含 vault\
  \ 密码的文件：\n\n```bash\nansible-vault create --password-file=password.txt secret.yml\n\
  ```\n\n一旦文件加密，它看起来像这样：\n\n```yaml\n---\n$ANSIBLE_VAULT;1.1$AES256\n...\n```\n\n\
  ### 使用加密变量\n\n我们现在可以将输出粘贴到你的 Ansible playbook 中。你可以这样构建 playbook：\n\n```yaml\n-\
  \ name: Use Encrypted Variable\n  hosts: all\n  vars:\n    variable_name: !vault\n\
  \      $ANSIBLE_VAULT;1.1$AES256\n      ...\n  tasks:\n    - name: Print the secret\
  \ data\n      debug:\n        msg: \"{{ variable_name }}\"\n```\n\n在此 playbook 中，`debug`\
  \ 模块打印 `variable_name` 的解密值，展示了 Ansible 在使用正确的 vault 密码运行时如何解密加密内容。\n\n## 运行 playbook\n\
  \n要执行此 playbook，你必须提供 vault 密码。这可以通过 `--ask-vault-pass` 标志手动输入，或通过引用包含 vault 密码的文件\
  \ `--vault-password-file` 来实现：\n\n```bash\nansible-playbook playbook.yml --ask-vault-pass\n\
  ```\n\n或者\n\n```bash\nansible-playbook playbook.yml --vault-password-file=path/to/vault-password.txt\n\
  ```\n\n\n\n\n\n为了确保 `Ansible vault` 用于敏感数据的安全和正确使用，遵循最佳实践非常重要。以下是需要记住的关键指南：\n\n\
  - **安全 vault 密码**：安全地存储 vault 密码并限制对其的访问。避免直接在脚本或共享文档中硬编码密码。\n- **最小化使用**：仅对必须保护的敏感数据使用加密变量。将\
  \ vault 加密项的使用控制在必要范围内，以便于维护。\n- **版本控制**：避免将 vault 密码文件提交到版本控制。仅提交加密文件或变量，确保明文敏感信息永不泄露。\n\
  - **定期轮换**：定期轮换密钥和 vault 密码以增强安全性，特别是拥有访问权限的团队成员离开项目时。\n\n## 编辑加密文件\n\n当我们我们需要修改加密文件时，`ansible-vault\
  \ edit` 命令允许我们安全地执行操作。它会请求 vault 密码以解密文件。让我们按照以下方式进行更改并在保存时重新加密文件：\n\n```bash\n\
  $ ansible-vault edit secret.yml\n```\n\n## 在 playbook 中使用加密文件\n\n要在 playbook 中使用加密变量，请将加密文件包含在\
  \ playbook 的 `vars_files` 部分中。然后使用 `--vault-password-file` 选项运行 playbook 以提供必要的\
  \ vault 密码。\n\n这是一个 playbook 示例：\n\n```yaml\n---\n- name: Secure Playbook\n  hosts:\
  \ all\n  vars_files:\n    - secret.yml\n  tasks:\n    - name: Ensure sensitive data\
  \ is protected\n      debug:\n        msg: \"{{ sensitive_data }}\"\n```\n\n安全地运行\
  \ playbook，如下：\n\n```bash\n$ ansible-playbook --vault-password-file=vault-password.txt\
  \ secure_playbook.yml\n```\n\n## 配置文件\n\n在 Ansible 中，配置文件对于定义 Ansible 本身、管理节点以及任务和\
  \ playbook 的执行至关重要。这些配置文件允许我们定制 Ansible 的设置以满足我们的特定需求和基础设施环境。以下是 Ansible 中主要配置文件及其用途的概述：\n\
  \n`ansible.cfg` 是 Ansible 的主配置文件。它定义了影响所有 playbook 和角色的全局设置。它可以位于多个位置，Ansible 将按照以下顺序使用找到的第一个：`ANSIBLE_CONFIG`（指向文件的环境变量）、`ansible.cfg`（在当前目录下）、`.ansible.cfg`（在用户主目录下）和\
  \ `/etc/ansible/ansible.cfg`。\n\n此文件控制 Ansible 行为的许多方面，包括默认模块路径、清单位置、权限提升设置等。\n\n\
  清单文件（Inventory）用于列出和分组我们的管理节点。这些可以是 `INI`（初始化的缩写）、`YAML` 格式的静态文件，从外部源拉取清单的动态脚本。清单文件指定了\
  \ playbook 中的命令、模块和任务运行的主机和主机组。\n\n虽然 playbook 不是传统意义上的配置文件，但它们是 `YAML` 文件，描述了要在管理节点上执行的任务。它们可以包含变量、任务、处理器和其他元素，用以自动化复杂的多层\
  \ IT 应用环境。\n\n角色（Roles）是任务集以及用于变量定义、模板和处理器的额外文件，它们按照标准的目录结构组织。每个角色都设计用于完成一个特定的任务或一组任务，并可以以重用和模块化的方式来组织任务。以下是主要配置文件及其用途的概述：\n\
  \n- `hosts`：虽然技术上属于清单的一部分，但值得单独提及，因为它经常被视为配置文件。主机文件包含管理节点列表，并可以定义这些节点的组和子组。\n- 组变量和主机变量目录（`group_vars`\
  \ 和 `host_vars`）包含定义应用于主机组或单个主机的变量的文件。这些对于设置清单中不同组或特定主机之间不同的变量非常有用。\n\n虽然 `ansible-vault`\
  \ 本身不是配置文件，但它用于加密 Ansible 中的敏感数据，如密码或密钥。只要提供正确的密码，`ansible-vault` 加密的文件可以在 Ansible\
  \ 运行时无缝解密。因此，我们可以安全地在 Ansible 配置文件中存储敏感信息。\n\n理解并正确配置这些文件是充分利用 Ansible 在自动化基础设施方面潜能的关键。\n\
  \n## 角色\n\n我们可以使用角色（roles）和集合（collections）简化 playbook 以利用代码复用。角色提供了一种组织 playbook\
  \ 的结构化方法，使其更加模块且易于维护。它们允许我们为特定任务（例如 Web 服务器设置和数据库配置）创建角色并在不同的 playbook 中复用。\n\n\
  角色的目录结构如下：\n\n- `tasks`：要执行的主要操作。\n- `handlers`：由特定条件触发的任务。\n- `templates`：用于生成文件的\
  \ Jinja2 模板。\n- `files`：部署到目标主机的静态文件。\n- `vars`：角色特定变量。\n- `defaults`：优先级较低的默认变量。\n\
  - `meta`：角色依赖和其他额外信息。\n- `tests`：包含测试清单和测试 playbook。\n\n利用角色有助于代码复用，并确保我们的自动化脚本组织良好且于维护。\n\
  \n## 使用角色\n\n与 Ansible 角色交互常用的方式是从仓库下载并在 playbook 中使用。`Ansible Galaxy` 是 Ansible\
  \ 角色和集合的公共存档。我们可以通过网络浏览器浏览巨大的库，搜索与我们的用例最相关的资源，并通过 `ansible-galaxy` 命令行工具下载它。\n\n\
  在项目目录根目录下创建一个 playbook（`production.yml`），如下：\n\n```yaml\n---\n- name: Use the webserver\
  \ role\n  hosts: all\n  become: true\n  roles:\n    - webserver\n```\n\n## 创建角色\n\
  \nAnsible 提供了创建角色以简化自动化任务并提高可复用的能力。角色是组织 playbook、任务和相关文件的结构化方法，如下：使用 `ansible-galaxy`\
  \ 命令管理 Ansible 角色。要创建一个新的 `my_role` 角色结构，请使用以下命令：\n\n```bash\nansible-galaxy init\
  \ my_role\n```\n\n此命令会在当前目录下创建 `my_role` 的目录结构。\n\n## 与角色进行工作\n\n在 Ansible 中使用角色时，有效地组织任务、模板、变量和处理器对于保持模块化和可复用性非常重要。在\
  \ `tasks/main.yml` 文件中，定义我们希望角色执行的任务。例如，要安装并启动 nginx，使用以下内容：\n\n```yaml\n---\n-\
  \ name: Package nginx installed\n  ansible.builtin.yum:\n    name: nginx\n    state:\
  \ present\n\n- name: Deploy Nginx configuration\n  ansible.builtin.template:\n \
  \   src: nginx.conf.j2\n    dest: /etc/nginx/nginx.conf\n\n- name: Service nginx\
  \ started and enabled on boot\n  ansible.builtin.service:\n    name: nginx\n   \
  \ state: started\n    enabled: true\n```\n\n以下是后续步骤：\n\n- 添加模板和文件：如果我们的角色需要部署自定义配置文件，请使用\
  \ `templates/` 目录存放 Jinja2 模板。对于静态文件，使用 `files/` 目录。以下文件 `nginx.conf.j2` 存储在我们角色的\
  \ `templates/` 目录下，如下：\n\n```jinja2\nserver {\n    listen 80;\n    server_name {{\
  \ ansible_facts['hostname'] }}; # 动态设置服务器名称\n\n    location / {\n    root /usr/share/nginx/html;\n\
  \    index index.html index.htm;\n    }\n}\n```\n\n\n\n\n\n- **声明变量**：使用 `vars/main.yml`\
  \ 或 `defaults/main.yml` 来定义角色中使用的变量。`defaults/` 中的变量优先级最低，易于被覆盖。\n- **使用处理器（handlers）**：如果我们需要在文件更改时重启服务，请在\
  \ `handlers/main.yml` 中定义一个处理器，并在任务中通知该处理器。\n- **定义角色依赖项**：如果我们的角色依赖于其他角色，请在 `meta/main.yml`\
  \ 中指定这些依赖项。\n\n## 在 playbook 中使用角色\n\n创建一个包含该角色的 playbook。例如，将 `my_role` 应用到我们的主机，可以使用以下内容：\n\
  \n```yaml\n---\n- hosts: all\nroles:\n- my_role\n```\n\n## 系统角色\n\n系统角色通过利用 Ansible\
  \ 和代码复用，简化了常规 Linux 管理任务的自动化，增强了系统一致性并减少了人为错误的潜在风险。它们基于作为 `fedora.linux_system_roles`\
  \ 集合分发的开源 Linux 系统角色。\n\nRHEL 系统角色是一组 Ansible 角色和模块，提供了一致的配置接口来自动管理 RHEL 系统的配置。它们封装了最佳实践，并为\
  \ RHEL 配置任务（如网络设置、SELinux 管理、时间同步等）提供了高层抽象。通过抽象系统配置的复杂性，RHEL 系统角色允许管理员专注于更高层次的基础设施策略，而不是陷于单个配置文件和命令的细节中。\n\
  \n以下是 RHEL 系统角色的主要优势：\n\n- **一致性与标准化**：RHEL 系统角色确保配置更改在整个基础设施中统一应用，缓解了配置漂移并增强了系统稳定性。\n\
  - **简化管理**：管理员可以使用单一统一的方法管理不同的系统，显著降低了学习曲线并简化了系统管理。\n- **最佳实践**：Red Hat 开发并维护 RHEL\
  \ 系统角色，将 Red Hat 的良好实践、对 RHEL 最佳实践的深刻见解以及安全配置指南纳入其中。\n- **可扩展性**：使用 RHEL 系统角色进行自动化可以轻松地从管理几个系统扩展到处理数千个系统，使其既适用于小型企业，也适用于大型数据中心。\n\
  \n要使用 RHEL 系统角色，请确保控制节点上已安装 Ansible 和 `rhel-system-roles` 软件包。该包可在 RHEL 存储库中找到，并可以使用包管理器\
  \ `dnf` 安装如下：\n\n```bashdnf install rhel-system-roles\n```\n\n一旦安装，系统角色即可供 Ansible\
  \ playbooks 使用，允许管理员利用它们来管理 RHEL 配置。以下是一个使用 `timesync` 角色配置时间同步的简单示例 playbook：\n\
  \n```yaml\n- hosts: all\nroles:\n- rhel-system-roles.timesync\nvars:\n  timesync_ntp_servers:\n\
  \    - hostname: time.example.com\n      iburst: true\n```\n\n此 playbook 确保所有目标系统都与\
  \ `time.example.com` 同步时间，使用网络时间协议 (NTP) 协议并配合 `iburst` 选项以便在启动时更快地同步。\n\nRHEL 系统角色涵盖了广泛的\
  \ Linux 管理任务。其中一些著名的角色包括：\n\n- **network**：配置网络接口、连接和设置。\n- **selinux**：管理 SELinux\
  \ 策略和设置。\n- **firewall**：配置防火墙规则和策略。\n- **storage**：管理磁盘分区、卷组和文件系统。\n- **timesync**：使用\
  \ NTP 或 chrony 配置时间同步。\n\n每个角色都带有一变量，管理员可以自定义这些变量以满足特定需求，为系统配置提供灵活性和控制。\n\n通过利用系统角色，系统管理员可以确保配置的一致性，实施最佳实践并在整个基础设施中扩展自动化工作。随着自动化在\
  \ IT 操作中继续发挥关键作用，RHEL 系统角色是管理员工具箱中的重要工具，能够将更多时间花在战略性任务而非日常维护上。\n\n## 集合 (Collections)\n\
  \n集合推进了额外的 Ansible 资源的集成。这种包格式可能在共享命名空间下包含 playbook、角色、模块和插件。它们的引入是为了更高效地组织和发布 Ansible\
  \ 内容，特别是在 2.9 版本之后。可以从 automation hub、Ansible galaxy 或其他源安装集合，使得跨项目的共享、更新和管理 Ansible\
  \ 内容变得更容易。常用集合示例包括 `ansible.builtin`、`community.general`、`amazon.aws`、`azure.azcollection`\
  \ 和 `google.cloud`，每个都满足特定的自动化需求。\n\n## 简化 playbook\n\n为了让 Ansible playbook 更易于管理和扩展，通过使用角色和集合来简化它们非常重要。以下是简化\
  \ playbook 的一些关键策略：\n\n- 要通过角色和集合简化 playbook，首先识别可以抽象为角色的重复任务和配置。\n- 根据功能将任务分离到角色中，以此组织我们的\
  \ playbook。例如，为设置数据库、配置 Web 服务器和部署应用程序创建单独的角色。\n- 利用集合来利用预构建的角色和模块。这不仅节省了时间，还确保我们在使用经过良好测试和社区支持的解决方案。\n\
  - 保持 playbook 专注于编排角色和定义自动化任务的流，而不是在 playbook 内部详细描述每一个步骤。\n\n通过遵循这些指南，我们可以显著简化\
  \ Ansible playbook，使其更易读、维护和扩展。这种方法不仅增强了代码的可用性，还促进了 Ansible 自动化的最佳实践。\n\n## 安装内容集合\n\
  \n安装 Ansible 内容集合并在 playbook 中使用它们可以显著扩展自动化工作流的功能和效率。Ansible 集合是 Ansible 内容的发布格式，可以包含\
  \ playbook、角色、模块和插件。以下是如何安装集合并在 Ansible playbook 中使用它们：\n\n**安装 ansible collections**：我们可以从\
  \ Ansible Galaxy、Ansible automation hub 或 Git 仓库安装集合。最常用的源是 Ansible Galaxy，它是共享\
  \ Ansible 内容的社区枢纽。\n\n要从 Ansible Galaxy 或 automation hub 安装集合，请使用 `ansible-galaxy`\
  \ 命令，后跟集合命名空间和集合名称。例如，要安装 `amazon.aws` 集合，我们将运行以下：\n\n```bash\nansible-galaxy collection\
  \ install amazon.aws\n```\n\n如果我们在没有直接访问互联网的环境中工作，可以使用以下从具有互联网访问能力的机器上下载集合的 tar\
  \ 包：\n\n```bash\nansible-galaxy collection download amazon.aws\n```\n\n然后，可以将 `.tar.gz`\
  \ 文件传输到目标机器并使用以下命令进行安装：\n\n```bash\nansible-galaxy collection install amazon.aws-*.tar.gz\n\
  ```\n\n## 在 playbook 中使用集合\n\nAnsible 集合提供了一种跨项目使用角色、模块和插件的模块化且灵活的方法。通过将集合整合到您的\
  \ playbook 中，可以使用复用且维护良好的内容来增强自动化任务。以下是在 playbook 中指定和使用集合的各种方式：\n\n\n\n\n\n## 在\
  \ Playbook 中指定集合 (Collections)\n\n一旦安装了集合，我们就可以在 playbook 中使用其内容（例如角色和模块）。要指定 playbook\
  \ 使用特定的集合，我们可以在 play 级（play level）或特定任务内使用 `collections` 关键字。\n\n### 在 play 级使用\
  \ collections\n\n在 play 级别指定集合允许该 play 中的所有任务访问该集合中的角色和模块，而无需使用完全限定名称。以下是一个示例：\n\
  \n```yaml\n---\n- name: Create EC2 instance\n  hosts: all\n  collections: amazon.aws\n\
  \  tasks:\n    - name: Start an instance with a public IP address\n      amazon.aws.ec2_instance:\n\
  \        name: \"public-compute-instance\"\n        key_name: \"prod-ssh-key\"\n\
  \        vpc_subnet_id: subnet-abcdefghi\n        instance_type: t3.micro\n    \
  \    security_group: default\n        network:\n          assign_public_ip: true\n\
  \        image_id: ami-123456\n```\n\n### 在任务中使用 collections\n\n我们 se 也可以通过使用完全限定的集合名称在单个任务中指定集合。如果我们只需要使用集合中的几个模块，且不想将集合应用于整个\
  \ play，则这种方法非常有用，如下所示：\n\n```yaml\n- name: Start virtual machine\n  azure_rm_virtualmachine:\n\
  \    resource_group: {{ resource_group_name }}\n    name: {{ vm_name }}\n    started:\
  \ yes\n```\n\nAnsible 集合提供了一种可扩展且灵活的方式来管理和使用 Ansible 内容，允许我们跨项目轻松地共享和复用 Ansible\
  \ 角色、模块和其他组件。通过安装集合并在 playbook 中引用它们，我们可以利用 Ansible 社区和其他来源提供的广泛功能来增强我们的自动化任务和工作流。\n\
  \n### 在 playbook 中 collections\n\n安装完成后，我们可以通过在 playbook 中指定它们来使用集合中所包含的角色和模块。以下是一个示例\
  \ playbook，演示了如何使用集合中的角色来安装和配置 NGINX：\n\n```yaml\n---\n- name: Configure Web Server\
  \ with NGINX\n  hosts: web_servers\n  collections:\n    - community.nginx\n  tasks:\n\
  \    - name: Include NGINX role from community collection\n      ansible.builtin.include_role:\n\
  \        name: nginx\n      vars:\n        nginx_http_params:\n          - name:\
  \ client_max_body_size\n            value: '10M'\n```\n\n## requirements.yml 文件\n\
  \n使用 `requirements.yml` 文件是一种结构化且高效的管理和安装项目所需的 Ansible 集合和角色的方法。这种方法不仅允许我们轻松地复制环境，还有助于维护不同设置之间的一致性。以下是在\
  \ Ansible 环境中使用 `requirements.yml` 文件的步骤：\n\n1. **创建 `requirements.yml` 文件**：\n\
  \   该文件将包含我们需要的所有集合和角色。以下是该文件的格式示例：\n\n```yaml\n---\ncollections:\n  - name: ansible.builtin\n\
  \  - name: community.mysql\n    version: \"1.3.0\"\n  - name: community.kubernetes\n\
  \    source: https://galaxy.ansible.com\nroles:\n  - name: geerlingguy.nginx\n \
  \   version: \"2.7.0\"\n    source: https://galaxy.ansible.com\n```\n\n   以下是详情：\n\
  \   * **Collections**：此部分列出了我们想要安装的所有集合。我们可以指定版本和来源。省略版本将安装最新可用版本。\n   * **Roles**：与集合类似，我们可以列出带有可选版本和来源指定的的角色。\n\
  \n2. **安装集合和角色**：\n   要安装 `requirements.yml` 中指定的集合和角色，请使用以下命令：\n\n```bash\nansible-galaxy\
  \ install -r requirements.yml\n```\n\n此命令将安装 `requirements.yml` 文件中列出的集合和角色。\n\n\
  3. **在 playbook 中使用集合和角色**：\n   一旦安装了所需的集合和角色，我们就可以在 playbook 中使用它们。以下是我们构建 playbook\
  \ 的方式：\n\n```yaml\n---\n- name: Deploy Web Application\n  hosts: web_servers\n \
  \ gather_facts: yes\n  roles:\n    - role: geerlingguy.nginx\n      vars:\n    \
  \    nginx_vhosts:\n          - server_name: \"example.com\"\n          root: \"\
  /var/www/html/example\"\n  tasks:\n    - name: Ensure database is present\n    \
  \  community.mysql.mysql_db:\n        name: mydb\n        state: present\n     \
  \ collections:\n        - community.mysql\n```\n\n## 关键提示\n\n在处理 Ansible 集合和依赖项时，遵循关键最佳实践可以帮助确保在\
  \ playbook 中平畅管理和集成。以下是一些需要记住的关键提示：\n\n* **版本控制**：将我们的 `requirements.yml` 包含在版本控制中以跟踪依赖关系。\n\
  * **私有仓库**：如果我们使用私有仓库或需要访问控制，请配置相应的密钥或令牌。\n\n```ini\n[galaxy]\nserver_list = automation_hub\n\
  [automation_hub]\nurl = https://automation-hub.example.com/api/\ntoken = YOUR_API_TOKEN_HERE\n\
  ```\n\n* **定期更新**：定期更新 `requirements.yml` 中的版本，以利用依赖的新功能或补丁。\n\n## 故障排除\n\n在 Ansible\
  \ 中管理集合和依赖项时，安装过程中可能会出现错误，或者版本之间可能会冲突。以下是一些帮助解决常见问题的故障排除提示：\n\n* **安装期间错误**：检查 `requirements.yml`\
  \ 文件的语法和有效性。确保所有来源都是可用的且版本存在。\n* **依赖冲突**：有时集合或角色可能依赖于其他集合或角色的特定版本，导致冲突。仔细阅读错误信息并相应调整我们的版本。\n\
  \n通过遵循这些步骤，我们可以简化 Ansible 设置过程，确保跨环境的一致性，并轻松地管理自动化脚本的更新。\n\n## 测试\n\n在 Ansible 中编写测试对于确保我们的自动化可靠并按预期工作至关重要。它涉及多个层级的测试，包括单元测试、集成测试、功能测试等。以下是我们可以在\
  \ Ansible 中实施的测试类型：\n\n* **单元测试**：Ansible 中的单元测试通常适用于单个 playbook。虽然在隔离环境中运行单个 playbook\
  \ 有时并不可行，但检查 playbook 语法以确保部署不会因为微小错误而中断是至关重要的。这可以使用 `ansible-playbook --syntax-check`\
  \ 命令完成。\n* **集成测试**：集成测试在 Ansible 中更有价值。它涉及对单个代码单元（如角色和任务）的小组进行测试，以确保它们能够正确协同工作。这可以通过通过限制依赖来构建我们的\
  \ playbook，并在作为完整基础设施部署之前，在新的虚拟机中单独测试每个角色来实现。\n* **功能测试**：功能测试涉及建立完整的基础设施环境并对其运行测试，以确保所有内容都已正确安装、部署和配置。可以使用\
  \ Ansible 自身的报告功能和外部工具对基础设施进行深层测试。\n\n## 调试和断言\n\n对于大多数 playbook，在执行过程中测试配置更改和命令结果就足够了。Ansible\
  \ 拥有内置模块如 `debug`、`fail` 和 `assert`，有助于测试条件并确保系统处于正确状态。\n\n* `debug` 模块可以在 playbook\
  \ 执行期间打印变量值或消息，辅助开发和故障排除。\n* `fail` 和 `assert` 模块允许我们显式地测试条件，并在时根据测试结果中止 playbook\
  \ 运行。\n\n\n\n\n\n`fail` 模块用于在满足特定条件时强制失败并停止 playbook 的执行。它对于我们希望在继续后续任务之前确保满足先决条件的场景特别有用。\n\
  \n```yaml\n- name: Example playbook using the fail module\nhosts: all\n\ntasks:\n\
  \  - name: Check if custom configuration file exists\n    ansible.builtin.stat:\n\
  \      path: \"/path/to/my/custom.config\"\n    register: custom_config_stat\n\n\
  \  - name: Fail if the file does not exist\n    ansible.builtin.fail:\n      msg:\
  \ \"The custom configuration file is missing. Please ensure /path/to/my/custom.config\
  \ exists.\"\n    when: not custom_config_stat.stat.exists\n```\n\n在这个示例中，playbook\
  \ 检查指定路径下是否存在自定义配置文件。如果文件不存在，则调用 `fail` 模块来停止 playbook 的执行，并提供关于缺失文件的清晰提示信息。\n\n\
  `assert` 模块用于断言某些条件是否为真，并可以在一个任务中执行多个检查。如果任何断言失败，playbook 的执行将停止，如下：\n\n```yaml\n\
  - name: Example playbook using the assert module\nhosts: all\ngather_facts: true\n\
  \ntasks:\n  - name: Collect the system's distribution information\n    ansible.builtin.setup:\n\
  \      filter: ansible_distribution\n\n  - name: Assert multiple conditions\n  \
  \  ansible.builtin.assert:\n      that:\n        - ansible_distribution == \"Ubuntu\"\
  \n        - ansible_distribution_version is version('24.04', '>=')\n      fail_msg:\
  \ \"This playbook can only be run on Ubuntu 24.04 or newer.\"\n      success_msg:\
  \ \"Distribution check passed.\"\n```\n\n在该示例中，playbook 首先使用 `setup` 模块收集系统的发行版信息。然后，它使用\
  \ `assert` 模块检查以下两个条件：\n\n*   系统必须运行 Ubuntu\n*   版本必须是 24.04 或更高\n\n如果两个条件都不满足，playbook\
  \ 的执行将停止并显示失败消息。如果两个条件都满足，则显示成功消息。或者，我们可以使用 `ansible_facts['lsb']['release'] ==\
  \ \"24.04\"` 来测试特定版本。\n\n## Linting（代码检查）\n\nLinting 是确保你的 Ansible 内容和 YAML 文件准确性和质量的关键步骤。通过执行\
  \ linting，你可以尽早发现语法错误，并确保遵循最佳实践。以下工具可以协助代码检查：\n\n*   `ansible-playbook --syntax-check`：该工具用于检查基本语法。\n\
  *   `yamllint`：该工具用于检查 Ansible playbooks 中常见的错误，如缩进和格式问题。\n*   `ansible-lint`：该工具扩展了对\
  \ YAML 语法的检查，检查 Ansible 任务和 playbook 是否偏离了 Ansible 的最佳实践。\n*   `spotter`：这是由 XLAB\
  \ Steampunk 创建的一项商业产品，用于扩展 `ansible-lint`，并记录每个模块更改的历史，以及名称更改或安全设置变更带来的安全影响。\n\n\
  ## Molecule\n\nMolecule 是一个用于开发和测试 Ansible 角色、playbook 和集合（collections）的强大框架。它自动化了设置测试环境、运行\
  \ playbook 以及在测试后拆毁环境的过程。Molecule 支持多种场景和后端，使其在跨平台和跨配置测试中具有极高的通用性。\n\nMolecule 工作流通常涉及以下内容：\n\
  \n*   使用 `molecule init` 创建一个新的角色或场景。\n*   开发我们的自动化脚本并使用 `molecule convergence`\
  \ 将其应用到测试环境。\n*   必要时通过 `molecule login` 与测试环境进行交互。\n*   运行 `molecule tests` 以通过完整的测试周期，确保我们的自动化工作无无运行且具有幂等性（idempotence）。\n\
  \n在部署之前彻底测试我们的 Ansible 内容对于维护可靠高效的自动化至关重要。通过将这些测试策略和工具整合到开发工作流中，我们可以确保我们的 Ansible\
  \ playbook、角色和集合是健壮、可靠且准备好投入的。\n\n首先，确保我们已安装 Ansible、Docker 和 Molecule。我们可以通过 Python\
  \ 包安装器 (PIP) 安装 Molecule 和 Docker 作为依赖，如下：\n\n```bash\npip install molecule[docker]\n\
  ```\n\n一旦满足这些前提条件，按照以下步骤创建并测试新的 Ansible 角色：\n\n1.  **使用 Molecule 初始化新角色**：为我们的角色创建一个新目录并进入该目录，如下：\n\
  \n    ```bash\n    mkdir nginx_role && cd nginx_role\n    ```\n    使用 Molecule 初始化一个新的角色和场景，如下：\n\
  \n    ```bash\n    molecule init role --driver-name docker my_namespace.nginx_role\n\
  \    ```\n    将 `my_namespace` 替换为实际的命名空间或用户名。此命令在名为 `nginx_role` 的目录中生成一个新角色，并配置\
  \ Molecule 使用 Docker。\n\n2.  **定义我们的 Molecule 场景**：进入我们的角色目录并打开 `molecule/default/molecule.yml`\
  \ 文件来配置我们的测试环境。确保 `platforms` 部分已配置为 Ubuntu 容器，如下：\n\n    ```yaml\n    platforms:\n\
  \      - name: instance\n        image: \"ubuntu:22.04\"\n        pre_build_image:\
  \ true\n    ```\n    此配置告诉 Molecule 使用 `ubuntu:20.04` Docker 镜像进行测试。\n\n3.  **编写安装\
  \ NGINX 的任务**：编辑角色目录 `nginx_role/tasks/main.yml` 中的文件，添加一个安装 NGINX 的任务，如下：\n\n \
  \   ```yaml\n    - name: Install Nginx\n      ansible.builtin.apt:\n        name:\
  \ nginx\n        state: present\n      become: true\n    ```\n    此任务使用 Ansible\
  \ 的 `apt` 模块来确保安装了 NGINX。\n\n4.  **创建测试断言**：编辑 `molecule/default/verify.yml` 文件，添加一个验证\
  \ NGINX 是否安装的测试。我们可以添加如下内容：\n\n    ```yaml\n    - name: Verify\n      hosts: all\n\
  \      gather_facts: false\n      tasks:\n        - name: Check if Nginx is installed\n\
  \          command: nginx -v\n          register: nginx_version\n          failed_when:\
  \ nginx_version.stderr is search(\"command not found\")\n\n        - name: Ensure\
  \ Nginx is running\n          ansible.builtin.service:\n            name: nginx\n\
  \            state: started\n    ```\n    此 playbook 检查 NGINX 是否安装。\n\n5.  **运行\
  \ molecule 测试我们的角色**：从角色目录运行以下命令：\n\n    ```bash\n    molecule test\n    ```\n \
  \   该命令将执行 Molecule 定义的每个步骤：对代码进行 lint 检查、使用 Docker 创建测试实例、将我们的角色应用到该实例、运行验证 playbook，最后清理实例。\n\
  \n遵循这些步骤，我们可以创建一个基础的 Molecule 场景来测试在 Ubuntu 容器上部署 NGINX。根据我们角色的具体情况和需要验证的内容调整我们的任务和测试。\n\
  \n## Ansible 自动化平台 (Ansible Automation Platform)\n\n在 Ansible 自动化平台 (AAP) 中管理大型项目、内容集合和执行环境需要全面了解其架构和组件，包括自动化控制器、自动化枢纽和执行环境。\n\
  \n| Ansible community | Ansible Automation Platform |\n| :--- | :--- |\n| Controller\
  \ | Automation controller |\n| Galaxy | Automation hub |\n| Receptor | Automation\
  \ mesh |\n| Event driven Ansible | Event driver controller |\n\n表 5.2：Ansible 社区与\
  \ Ansible 自动化平台的对比\n\n\n\n\n\n- **自动化中心 (Automation hub)**：在组织内管理和共享 Ansible 内容的集中位置。它提供了一个用于共享、发现和协作\
  \ Ansible roles、playbooks 和 collections 的存储库。\n- **执行环境 (Execution environments)**：包含系统级依赖和基于集合内容的容器镜像，确保不同节点之间的一致性，并简化了自动化任务中\
  \ Python 环境的管理。\n- **基于角色的访问控制 (Role-based access control)**：通过细粒度的权限，我们可以确保用户对自动化资源拥有适当的访问，增强安全性和控制。\n\
  - **自动化分析 (Automation analytics)**：用于评估自动化对组织内集群和实例影响的云端组件。\n- **与 Red Hat 产品集成**：与\
  \ `Red Hat Insights` 和 `Red Hat Satellite` 深度集成。\n\n对于大型项目，`AAP` 简化了清单（inventories）和\
  \ playbook 项目的管理。自动化控制器中的项目是指 Ansible playbooks、roles 和其他相关文件的逻辑分组，用于自动化任务和管理基础设施。这些可以通过手动将它们放置在项目基根路径下，或者利用源代码管理（SCM）系统（如\
  \ `Git`、`Subversion` 或 `Red Hat Insights`）在项目内部进行。\n\n`AAP` 中的内容 collections 对于在组织内分发内容至关重要。Collections\
  \ 封装并分发 Ansible 内容，包括 roles、模块、插件和其他自动化制品。它们提供了一种集中且标准的 Ansible 内容管理和共享方法，促进了团队和组织之间的协作。\n\
  \n执行环境是 `AAP` 的关键特性，为运行自动化任务提供了隔离的环境。它们使用 `ansible-builder` 命令行工具构建，可以包含 collections、Python\
  \ 需求、系统级软件包和自定义依赖。执行环境允许在作业模板中指定环境，确保自动化任务以一致且受控的方式执行。\n\n## 最佳实践\n\n为了确保在 `Ansible\
  \ Automation Platform` 内高效地管理自动化流程，遵循促进模块化、一致性和组织性的最佳实践至关重要。这些实践有助于简化大型项目，并确保跨环境的可靠执行，如下：\n\
  \n- **组织化并模块化代码**：使用 `roles` 和 `collections` 将自动化内容组织并封装成可重用的单元，促进模块化并减少重复。\n- **自定义执行环境**：构建自定义执行环境以包含所有必要的依赖项和集合，确保我们的自动化任务在不同环境中一致运行。\n\
  - **自动化中心**：利用 `Red Hat` 认证的中心来管理和共享 Ansible 内容，确保访问经过认证、验证和支持的内容。\n- **优化项目和清单管理**：利用软件配置管理（SCM）系统对项目和\
  \ playbooks 进行版本控制，确保自动化内容易于更新和管理。\n\n通过遵循这些指南并利用 `Ansible automation platform`\
  \ 的组件和功能，组织可以有效地管理大型项目、内容集合和执行环境，简化其自动化流程并提高整个 IT 基础设施的效率。\n\n## 结论\n\n本章旨在为寻求通过自动化（特别是使用\
  \ `Ansible`）提升 Linux 系统管理技能的人提供宝贵的资源，它是迈向 `RHCE` 认证的重要跳板。\n\n## 记忆点\n\n- **Ansible\
  \ 的安装与设置**：在控制节点上使用 `dnf` 或 `brew` 等包管理器顺利安装 `Ansible`，并为托管节点配置 `SSH` 或 `WinRM`，无需任何代理程序。\n\
  - **权限提升技术**：利用 `Ansible` 的 `become` 功能为需要 root 权限的任务安全地提升权限，确保脚本在受控权限下有效运行。\n-\
  \ **Ansible roles 和 collections**：利用 `roles` 复用代码，并利用 `Ansible galaxy` 中的 `collections`\
  \ 引入社区驱动的内容。\n- **安全数据**：使用 `Ansible vault` 加密敏感信息。\n- **测试与静态检查**：使用 `Molecule`\
  \ 实现测试以实现高质量的自动化。\n\n## 单选题\n\n1. 如何打印当前配置？\nA. `ansible-navigator config`\nB. `ansible-cfg`\n\
  C. `ansible config --dump`\nD. `ansible-navigator settings`\n\n2. 如何使用 Ansible 存储敏感信息？\n\
  A. `ansible-galaxy`\nB. `ansible inventory`\nC. `ansible-vault`\nD. `ansible role`\n\
  \n3. Ansible 中管理权限提升的首要方法是什么？\nA. `ansible-galaxy`\nB. `become`\nC. `ansible.cfg`\n\
  D. `ansible-core`\n\n4. collections 的主要用途是什么？\nA. `ansible-galaxy create-role`\n\
  B. `ansible-galaxy init`\nC. `ansible-role new`\nD. `ansible-init`\n\n答案：\n1. a\n\
  2. c\n3. b\n4. b\n\n### 思考题\n\n1. 在 Linux 系统上安装 `Ansible` 需要哪些步骤？使用 Windows 系统进行设置有何不同？\n\
  2. 描述在 `Ansible` 中管理清单文件的过程。对于可扩展自动化策略，构建这些文件的最佳实践是什么？\n3. 解释 `Ansible` 如何使用 `ansible.cfg`\
  \ 文件。你可能会文件中定义哪些关键设置？为什么？\n4. 讨论 `Ansible vault` 在管理 playbook 内敏感数据方面的作用。加密数据如何增强自动化过程中的安全性？\n\
  5. `Ansible` 如何在托管节点上管理权限提升？解释 `become` 关键字的作用和功能。\n6. 阐述你如何将 shell 脚本转换为 Ansible\
  \ playbook。在自动化环境中使用 playbook 相比脚本有什么优优势？\n7. 什么是 `Ansible` roles 和 `collections`？它们如何促进代码复用和自动化可扩展性？\n\
  8. 描述 `Molecule` 工具在 Ansible role 开发和测试中的目的和用途。`Molecule` 为开发者提供了哪些具体优势？\n9. 解释\
  \ `Ansible automation platform` 中执行环境的概念。这些环境如何标准化并简化了跨不同节点的自动化任务的管理？\n10. 详细说明在\
  \ `Ansible` 中设置 Windows 托管节点的过程和考虑因素。为了确保无缝自动化，需要哪些必要的配置和组件？\n\n\n\n\n\n- `ansible-navigator`:\
  \ 这是一个命令行界面工具，旨在帮助用户和开发者高效地运行、探索和管理 Ansible 自动化内容，包括 playbook（playbooks）、清单（inventories）和集合（collections）。\n\
  - `System role`: 系统角色是预封装的 Ansible 角色，用于自动化和标准化 RHEL 软件及系统设置的安装与配置。\n- `Ansible\
  \ vault`: 这是 Ansible 的一项功能，允许用户对密码和密钥等敏感数据进行加密，确保信息在 Ansible playbook、角色和清单文件中安全存储和管理。\n\
  - `Ansible Galaxy`: Ansible Galaxy 是一个用于共享和管理 Ansible 角色和集合的仓库，允许用户下载预制配置并将其集成到自己的\
  \ Ansible 中 中，用以简化自动化任务。\n- `Ansible role`: 它是一种结构化的方式，用于将任务、变量、文件和模板组合在一起，这些内容设计用于配置特定的服务或功能，使其具有重用性并易于在不同的\
  \ playbook 之间分发。\n- `Ansible collection`: 它是一种分发 Ansible 内容（包括角色、插件和模块）的包格式，允许对复杂的\
  \ Ansible 解决方案进行分共享、版本控制和使用。\n- `Automation hub`: 这是 Red Hat 提供的中心平台，允许用户访问、管理和共享经过认证的\
  \ Ansible 内容（包括集合和角色），以标准化整个组织内的自动化实践。\n\n***\n\n1 [`brew.sh/`](https://brew.sh/)\n\
