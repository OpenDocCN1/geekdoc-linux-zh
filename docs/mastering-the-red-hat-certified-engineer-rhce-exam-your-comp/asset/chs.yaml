  3 [`www.redhat.com/en/blog/setting-your-red-hat-remote-exam-things-you-need-do-first`](https://www.redhat.com/en/blog/setting-your-red-hat-remote-exam-things-you-need-do-first)\n\
  # 第 2 章 Red Hat Enterprise Linux (#contents.xhtml_ch02a)\n\n## 引言 (#contents.xhtml_sc2_23a)\n\
  \n本章介绍了基本的 Linux 管理技能，涵盖了以下主题：开始使用 Red Hat Enterprise Linux (`RHEL`)、操作系统、配置存储、创建文件系统、访问\
  \ Linux 文件系统、在服务器和虚拟机上安装、部署和维护系统、配置远程访问、管理用户和组、配置网络接口以及通过命令行处理文件。\n## 结构 (#contents.xhtml_sc2_24a)\n\
  \n本章涵盖了以下主题：\n\n- 开始\n- 运行系统\n- 安装后获取帮助\n- 用户和组\n- 存储\n- 配置和维护系统\n- 网络接口和设置\n- 管理文件\n\
  \n## 目标 (#contents.xhtml_sc2_25a)\n\n\n## 开始 (#contents.xhtml_sc2_26a)\n\n对于任何希望建立\
  \ Linux 系统管理强大基础的人来说，`RHEL` 都是一项令人兴奋且重要的工作。本章为我们进入 `RHEL` 之奠定了基础，提供了自信地导航和管理 Linux\
  \ 系统所需的知识和技能。无论我们是新手还是丰富的 IT 专业人士，掌握这些基础概念对于构建强大可靠的 Linux 基础设施都至关重要。`RHEL` 是企业 IT\
  \ 领域的坚砥，为从公有云到边缘的新沿领域提供了灵活性和可靠性。这一强大的操作系统是无数创新的稳定基石，为全球企业提供了骨干。`RHEL` 是全球领先的企业级\
  \ Linux 平台，在数百个云平台上通过认证，并与数千家硬件和软件供应商合作。除了作为一个操作系统，它还将用户连接到红帽广泛的生态系统，提供 24/7 支持和十年的生命周期。通过最新的发布，用户可以访问所有支持的版本，确保按照自己的计划无缝升级并采用新功能。\n\
  \n\n![](img/Figure_2.1.png)\n\n图 2.1：RHEL 生命周期\n\n\n- **完全支持阶段 (Full Support Phase)**：在初始阶段，红帽为\
  \ RHEL 提供全面的支持。这包括定期更新、补丁和安全修复，以确保环境稳健可靠。`RHEL` 版本 8 的完全支持阶段持续五年，为客户的企业系统提供了稳定的基础。\n\
  - **维护支持阶段 (Maintenance Support Phase)**：在完全支持阶段之后，`RHEL` 版本 8 无缝过渡到维护支持阶段。在此期间，客户继续接收关键的安全更新和选定的紧急修复。维护支持阶段额外延长五年，为版本\
  \ 8 提供总计十年的支持。\n- **扩展生命阶段 (Extended Life Phase)**：考虑到组织的多样化，红帽引入了扩展生命阶段，允许客户通过年度附加订阅选择扩展生命支持\
  \ (`ELS`)。通过 `ELS`，用户可以将有限的订阅服务扩展到维护支持阶段之外，提供满足特定业务要求的的定制化支持。\n\n\n- `RHEL` 支持多种\
  \ CPU 架构：x86、ARM、IBM Power、IBM Z 和 IBM LinuxONE。\n- `RHEL` 包含了 Ansible 自动化技术，确保了稳定的管理体验，能够专注于创新而非重复性任务。\n\
  - Red Hat Insights 是一项用于分析和修复的托管服务，使组织能够接收持续的漏洞告警和目标指导，最大限度地减少机时间并避免紧急情况。从初始安装到部署到多个云，红帽都提供了简化该过程的工具。\n\
  - 迁移工具简化了从其他发行版的过渡，而 `RHEL image builder` 等工具可以创建优化的操作系统镜像，以实现高效的云部署。`RHEL` 具有内置的安全和合规功能，包括实时内核补丁、安全配置文件和可信任的软件供应链，简化了风险缓解，自动化了安全流程，并确保符合高安全标准。\n\
  \n\n\n\n\n*   RHEL 满足各种用例，包括边缘计算、混合云部署、SAP 工作负载、SQL Server 托管、应用程序开发以及高性能计算 (`HPC`)。它的适应性延伸到边缘，可以在全球众多节点上进行扩展，提供优化的操作系统镜像，并促进高效的系统更新。作为混合云环境中的关键角色，RHEL\
  \ 能够在物理、虚拟、私有云和公有云之间无缝部署和运行应用程序。\n*   与 `Google Cloud`、`AWS`、`Microsoft Azure` 和\
  \ `Oracle Cloud Infrastructure` 等主流云提供者的合作确保了对未来部署的有力支持。`Salesforce`、`UPS`、`Lufthansa\
  \ Technik` 和 `Tomago Aluminium` 等机构利用 RHEL 的力量简化了 IT 运营，增强了客户体验并提高了开发效率。\n\n在企业\
  \ IT 中，RHEL 不仅仅是一个操作系统，更是一个技术基石，连接了现代 IT 栈中的各种元素。它基于 Linux、容器和自动化的开放混合云策略提供了在任何需要的地方运行应用程序所需的灵活性。无论我们是开发者、系统管理员还是大型企业的一员，RHEL\
  \ 都是经过验证的、可靠且灵活的解决方案，为不断演变的 IT 领域图中的创新和成功奠定了基础。\n\n\n最新的 RHEL 提供了多种安装方法以满足不同的用户需求。请参考\
  \ Red Hat 客户门户官方网站，并将 RHEL 指定为产品，如图[图 2.2]所示。\n\n![](img/Figure_2.2.png)\n\n\n下一节提供了可用方法的概述，引导用户根据其需求选择最合适的方法：\n\
  \n*   ISO 安装方法：用户可以通过 Red Hat 客户门户下载 DVD `ISO` 镜像来安装 RHEL。此方法支持 `GUI` 和 `Kickstart`，并在安装完成后完成注册。启动菜单\
  \ (`GRUB`) 提供了安装 RHEL、测试介质以及安装或排除已安装系统的选项，如图[图 2.3]所示：\n\n\n图 2.3: 启动菜单\n*   内容交付网络\
  \ (`CDN`) 方法：通过 `CDN` 方法注册并安装 RHEL，这涉及系统注册、订阅附加以及从 `CDN` 安装。用户可以选择启动 `ISO` 或 DVD\
  \ `ISO` 镜像文件。推荐使用启动 `ISO`，并将 `CDN` 作为默认安装源。\n*   使用虚拟网络计算 (`VNC`) 远程安装 RHEL：RHEL\
  \ 安装程序提供两种 `VNC` 模式（直接和连接），以适应不同的环境。\n*   使用 `PXE` 从网络安装 RHEL：这种网络安装方法需要访问运行 `PXE`\
  \ 过程的安装服务器、所有的安装资源以及至少两个系统。\n*   高级安装：使用 `Kickstart` 执行自动化 RHEL 安装。`Kickstart` 通过自动化用户指定的配置来简化操作系统的安装，非常适合大规模部署。大型企业通过\
  \ Red Hat Satellite 管理其设备集群。\n\nRHEL 支持各种架构，包括超威微（`AMD`）和英特尔 (Intel) 64 位、64 位 ARM、IBM\
  \ Power Systems（小端序）以及 64 位 IBM Z。RHEL 的稳定性和安全性扩展到混合云部署，支持在虚拟机管理器和云提供商上进行客机安装。有关支持的架构的详细信息（包括\
  \ IBM Power 服务器的安装说明）可以在 Red Hat 官方目录和文档中找到。RHEL 安装要求涵盖了各种系统、硬件、安全、内存和存储选项。还支持对虚拟化主机的特定硬件要求。\n\
  \n### Anaconda\nRHEL 安装程序被称为 `Anaconda`，`CentOS` 和 `Fedora` 等其他 Linux 发行版也是如此。在操作系统中，`Anaconda`\
  \ 是负责引导用户在计算机上安装 Linux 发行版的软件。`Anaconda` 因其独特的并行安装方法而脱颖而出。与许多遵循严格线性步骤顺序的其他操作系统安装程序不同，`Anaconda`\
  \ 为用户提供了更大的灵活性。以下是单节点的安装过程：\n\n1.  用户选择其语言和区域偏好（默认选择是英语和美国），如图[图 2.4]所示：`Anaconda`\
  \  {帽企业级 Linux 安装程序图形用户界面 (`GUI`)。\n\n    ![](img/Figure_2.4.png)\n    图 2.4: 安装本地化\n\
  \n2.  安装摘要界面允许用户配置四个区域，如图[图 2.5]所示：\n\n    *   本地化（键盘、语言、时区）\n    *   用户设置（root\
  \ 和用户）\n    *   软件（注册、安装源和软件选择）\n\n安装摘要在开始安装过程之前显示总体选项。最常用的选项已经预先选择。用户必须为红色文本突出显示的安装目标、root\
  \ 用户密码和用户账户创建提供选择。\n\n\n图 2.5: 安装摘要\n\n一个关键区域是软件部分，它允许用户选择基础环境的安装样式以及每个环境的附加软件：\n\
  \n*   服务器：已安装基础服务的仅终端服务器安装。\n*   最小化安装：带有最小化安装的仅终端服务器。\n*   自定义操作系统：带有软件选择的完全自定义安装。\n\
  \n某些架构（64 位 ARM）提供了内核页大小为 4KB (`4k`) 或 64KB (`64k`) 的选项。这些选项了操作系统内核用于各种操作的虚拟内存页的大小，影响内存管理和系统性能。在\
  \ `4k` 和 `64k` 页大小之间选择涉及效率、内存利用和整体系统行为的权衡，选择通常取决于系统上运行的工作负载或应用程序的具体需求和特性。`kernel-64k`\
  \ 选项仅适用于连续内存工作集的大型工作负载 [大型数据库、HPC 等]。\n服务器软件选项显示在[图 2.6]中：\n\n![](img/Figure_2.6.png)\n\
  \n图 2.6: 安装软件选择\n\n\n\n然而，需要注意的是，安装过程并非所有部分都遵循这种并行模式。例如，当从网络位置安装时，用户必须在选择特定安装包之前配置网络。此外，Anaconda\
  \ 会根据硬件和安装媒体自动配置某些界面，为该过程提供某种程度的自动化。Anaconda 的设计旨在简化安装过程并使其更以用户为中心。尽管具有并行性，但仍有一些特定的界面需要按顺序关注，这些界面用感叹号标记。用户在启动实际的安装过程之前必须处理这些设置，随后安装过程将在无需用户干预的情况下继续在系统中安装所需的软件。\n\
  \n\n### 订阅管理器 (Subscription manager)\n\n在不使用图形化环境的情况下注册系统，可以在命令行使用 `subscription-manager`\
  \ 命令。该命令有助于注册过程，并将系统自动附加到最合适且兼容的订阅上。后续步骤包括将系统注册到 Red Hat 账户：\n\nsubscription-manager\
  \ register --username=RHusername --password=RHpassword\n```\n\n我们需要指定 Red Hat 客户控制台用户名和密码，使用以下命令查看可用订阅：\n\
  \nsubscription-manager list --available | less\n```\n\n我们可以通过以下命令自动附加订阅：\n\nsubscription-manager\
  \ attach –auto\n```\n\n或者，用户可以通过指定池 ID 从特定池中手动附加订阅。要检查已消耗的订阅，请使用命令：\n\nsubscription-manager\
  \ list –consumed\n```\n\n要注销系统注册，请使用命令：\n\nsubscription-manager unregister\n```\n\
  \n这些命令行操作简化了 Red Hat 系统的注册和订阅管理流程。\n\n\n在计算机操作中，很少有操作像开关系统那样基础。这些过程的意义超出了常规操作；它们在故障排除和完成安装任务中起着至关重要的作用。本节探讨了从命令行启动、关机和挂起\
  \ Linux 系统的细节。\n\n### 登录 (Login)\n\n\n| 注意：许多系统管理员会禁用 GUI 以为服务器服务节省资源。 |\n\n无头服务器（Headless\
  \ servers）通常位于数据中心的机架上，没有永久连接的物理键盘。操作人员通过串口控制台、键盘、视频和鼠标 (KVM) 或网络登录与系统交互。在现代计算环境中，许多无头服务器是运行在本地或公共/私有云实例上的虚拟机或容器。\n\
  \n\n命令行是基于文本的，类似于聊天机器人风格界面，用于向计算机系统输入指令。Linux 命令行由一个名为 `shell` 的程序提供。对于 `shell`\
  \ 程序有各种实现，并且可以配置不同的用户使用不同的 shell。RHEL 用户默认的交互式 shell 是 `Bash` (GNU Bourne Again\
  \ SHell)。`Bash` 是类 Unix 系统上使用的最成功 shell 之一 —— Bourne shell (`sh`) 的改进版本。此外，通过 GUI\
  \ 或 Web 控制台连接的用户可以通过终端应用程序或类似工具使用 `bash`。\n\n当交互式使用 `shell` 时，它会显示一个带有主机名和闪烁行的字符串字符串，称为\
  \ `prompt`（提示符），它表示系统正在等待用户命令。当普通用户访问系统时，默认提示符以 `$` 符号（美元字符）结尾，如下两个示例所示：\n\ndevops@demo.example.com\
  \ ~] $\ndevops@demo.example.com:~$\n```\n\n而当超级用户 `root` 连接时，提示符以 `#` 符号（哈希字符）结尾，如下：\n\
  ```\nroot@demo.example.com:~#\n```\n\n前缀字符串表示当前用户 `root`、主机 `demo.example.com` 以及文件系统中的当前目录（`~`\
  \ 表示用户目录）。我们可以使用 `PS1` 环境变量自定义该字符串。从现在起，我们将省略前缀字符串。\n| 注意：Microsoft Windows 使用 `cmd.exe`\
  \ 或 `PowerShell` 作为命令行解释器。Apple Mac 在 macOS 中使用 `bash` 作为默认 shell。 |\n\n用户通过命令与\
  \ `shell` 交互。每个命令由三部分组成，如下：\n\n*   要运行的命令（例如 `echo`）\n*   通常指示命令目标的参数（`hello world`）\n\
  \n以下命令在屏幕上（也称为标准输出）打印输入参数 `Hello world`。\n\n```\nHello world\n```\n\n任何错误也会打印在屏幕上，但我们将其引用为标准错误。\n\
  \n\n```\n$ ansible\nbash: ansible: command not found…\n```\n标准用户通常无法在系统中安装额外程序，因为这可能对系统和其他用户是危险的。\n\
  \n### 注销 (Logout)\n\n我们可以在终端中输入 `exit` 命令（不带任何参数）来断开系统连接，或者按下 `Ctrl+D` 完成会话。\n###\
  \ 关机 (Shutting down)\n\n随着 RHEL 采用 systemd，传统的关机命令已经进化。Linux `shutdown` 命令现在映射到\
  \ systemd 函数，引入了 `--halt` 和 `--poweroff` 等选项。\n\n| 注意：请注意，`--halt` 选项仅停止操作系统，而 `--poweroff`\
  \ 选项关闭系统，通常使用 ACPI 硬件命令。 |\n`shutdown` 命令还具有调度定时关机的功能，允许用户定义关机延迟。`shutdown` 命令需要\
  \ `sudo` 命令授予的特殊权限。提供的示例说明了如何有效利用此功能。\n\n要立即关闭系统，请使用 `now` 选项，如下：\n\n```\n```\n\n\
  要在特定时间启动系统停机，请使用以下命令：\n\n```\n```\n\n如果我们希望在当前时间几分钟后挂起操作系统，请指定两分钟的延迟，如下：\n\n```\n\
  $ sudo shutdown --halt +2\n```\n\n我们可以在关机前为所有用户包含一条包含时间的消息，如下：\n\n$ sudo shutdown\
  \ --halt +2 “URGENT. Shut down in TWO minutes.”\n```\n\n要取消已计划的关机，请使用 `-c` 选项，如下：\n\
  \n$ sudo shutdown -c\n```\n\n## 重启 (Reboot)\n\n\n\n[content]\n虽然重启系统可以解决各种问题，但请限制不必要的重启，特别是服务器上，因为应该尽可能将停机时间至最低。在许多情况下，重启服务是重启整个系统的替代方案。`systemctl`\
  \ 命令需要通过 `sudo` 命令授予的特殊权限。以下命令用于重启单个服务：\n\nsudo systemctl restart {service-name}\n\
  ```\n\n在某些情况下，系统重启是不可避免的。要使用 `shutdown` 命令快速重启系统，请按如下方式使用 `-r` 选项：\n\nsudo shutdown\
  \ -r now\n```\n\n如果倾向于延迟重启，请遵循 `hh:mm` 格式。或者，我们可以利用 `systemctl` 命令重启设备：\n\nsudo\
  \ systemctl reboot\n```\n\n需要注意的是，`systemctl` 的一个局限性是它无法实现延迟重启。\n\n\n电源管理是系统控制的一个关键方面。用于这些操作的\
  \ `systemctl` 命令为用户根据需要灵活管理功耗提供了便利。表 2.1 总结了挂起和休眠之间的主要区别：\n\n| 挂起 (Suspension) |\
  \ 休眠 (Hibernation) |\n| :--- | :--- |\n| 内存内容移动到交换分区位置。通电后，系统从交换分区重新加载。 | 应用程序停止。\
  \ |\n| 引导加载程序配置为直接引导到当前内核。 | 系统状态移动到内存 (RAM)。 |\n\n表 2.1: 挂起与休眠对比\n\n\n```bash\n\
  sudo systemctl suspend\nsudo systemctl hibernate\n```\n`hybrid-sleep` 命令结合了挂起和休眠。\n\
  \n```bash\nsudo systemctl hybrid-sleep\n```\nLinux 系统控制的格局正在不断演变，传统的命令现在已与 systemd\
  \ 功能接轨。无论是调度关机、重启服务还是有效管理电源，用户都配备了一套全面的工具。最现代的系统控制方法提倡通过计划操作来最大限度地减少干扰，同时也承认有时关闭系统是不可避免的。作为\
  \ Linux 员员，精通这些命令可以确保自信且高效地进行系统管理。\n\n## 图形用户界面\n\nRHEL 以平衡便利性和控制的替代方案而闻名。RHEL 中的\
  \ GUI 源于对用户偏好多样性的认可。可以通过 GUI 界面初始化重启或关机。有很多 GUI 界面选项，但 RHEL 默认是 GNOME 环境。虽然命令行操作提供了无与伦比的控制，但\
  \ GUI 选项为那些不习惯使用终端命令的用户提供了方便的替代方案。\n图 2.7 显示如何从 GNOME 用户界面（左上角）初始化重启或关机。其他 GUI 提供了类似的选项。\n\
  \n![](img/Figure_2.7.png)\n\n图 2.7: 通过 GUI 界面重启\n我们可以使用 GUI 中的终端与控制命令交互，如图 2.8 所示：\n\
  \n![](img/Figure_2.8.png)\n\n图 2.8: GUI 中的终端\n## Bash 脚本\n\nBash 脚本提供了一种利用 Shell\
  \ 力的精简方法，允许用户以系统的方式执行一系列命令。用户无需手动输入单个命令，而是创建脚本来自动化任务，提高效率并减少错误风险。这种脚本方法对于重复或复杂的任务特别有价值，因为它允许在连贯的序列中组织和执行多条命令。Bash\
  \ 脚本增强了命令行环境的整体用户体验，使得更容易精确、一致地管理和执行各种任务。\n\n这是一个简单但有效的 Hello World Bash 脚本：\n```bash\n\
  #!/bin/bash\n\n## Usage: Hello World Bash Shell Script\n\n\n# -------------------------------------------------\n\
  \necho \"Hello World\"\n```\n让我们拆解这些不同的组件：\n\n*   `#!/bin/bash`: 这一行被称为 shebang，它告诉系统使用\
  \ Bash 解释器来执行脚本。\n*   `#`: 所有这些行都是注释，提供了脚本的简要描述或目的、脚本作者以及分隔符。\n*   `echo \"Hello\
  \ World\"`: 这一行是脚本的核心。它使用 `echo` 命令向终端打印 Hello World 文本。\n要运行此脚本，我们需要通过以下命令使其具有可执行权限：\n\
  \n```bash\nchmod +x hello_world.sh\n```\n在变为可执行后，我们可以使用以下命令运行脚本：\n\n```bash\n./hello_world.sh\n\
  ```\n执行时，它将在终端上打印 Hello World。\n\n## 安装后获取帮助\n\n在海量信息中搜索帮助对于系统管理员来说是一个无价的工具，但知道如何在没有互联网连接的情况下找到答案（例如在物理隔离环境中或考试期间）至关重要。系统管理员的\
  \ `man` 命令提供了其在解决问题中重要性的见解，随后提到了用于参考的 man 页章节，并承诺在接篇文章中讨论前五个选项。\n以下是 `man` 命令的前五个选项：\n\
  \n*   使用 `man -k` 带有短描述列出所有可用的 man 页\n*   使用 `man -f <keyword>` 获取特定 man 页的简短描述\n\
  *   使用正则表达式搜索所有 man 页并使用 `man --regex <keyword>` 打开匹配的项\n*   使用 `man -wK <keyword>`\
  \ 在所有 man 页中搜索关键词并输出其位置\n\n## Red Hat 支持工具\n\n包含在 RHEL 中的 `redhat-support-tool`\
  \ 命令是 Red Hat 支持工具实用程序，它提供了一个基于文本的界面，用于通过命令行在知识库文章内部搜索并在客户门户提交支持工单。\n```bash\nredhat-support-tool\n\
  ```\n\n欢迎使用 Red Hat 支持工具。\n命令 (? 获取帮助):\n\n该实用程序以如下交互方式呈现：\n\n*   `search` 选项：在\
  \ Red Hat 文章之间搜索\n*   `addattachment` 选项：附加诊断系统信息 (sosreport)\n*   `listcases`:\
  \ 列出我们 Red Hat 客户帐户的支持工单。\n\n## Red Hat Developer\n\n\n![](img/Figure_2.9.png)\n\
  \n图 2.9: Red Hat Developer 续\n\n\nRed Hat Insights 是一种软件即服务 (SaaS) 分析工具，帮助客户识别并修复运行\
  \ Red Hat 产品的系统或基础设施在安全、性能和稳定性方面的威胁。这是一个可选选择，需要运行代理程序来获取系统信息并发送到 Red Hat 云系统。当检测到安全威胁并有修复问题的解决方案时，它会提供逐步说明或\
  \ Ansible Playbook 以应用于我们的基础设施。其架构设计如下：\n\n![](img/Figure_2.10.png)\n\n\nInsight\
  \ 代理已安装在 RHEL8+ 操作系统中。我们可以从具有有效软件权限的系统通过超级用户 (root) 使用以下命令激活 Insight：\n\n```bash\n\
  insights-client --register\n\n\n\n一旦数据从我们的系统流到洞察服务，我们就能进行分析。例如，我们可以使用 OpenSCAP 策略框架项目对系统进行合规性审计，比如针对支付卡行业数据安全标准\
  \ (PCI DSS) 策略进行审计。我们还可以将系统与参考配置进行比较，并评估任何偏差和修复措施。\n\n\n管理用户和组是 Linux 系统的一个关键方面，对于实施安全和访问控制至关重要。\n\
  \n在多用户环境中，`su` 和 `sudo` 命令可以在终端中有效地进行用户切换。\n\n\nLinux 是一个多用户系统，利用了多个具有特定权限的用户。我们使用使用\
  \ `su` 命令在终端中切换用户。具体来说，以下 `su` 命令在学生和管理员命令之间进行切换：\n\n```\nstudent@demo.example.com:~$\
  \ su - admin\nadmin@demo.example.com:~$\n```\n\n用户需要输入目标用户的密码以授予访问权限。`su` 命令指定了可选的\
  \ `-`（连字符）参数，这意味着切换到目标用户的家目录和设置。如果我们没有指定任何目标用户，`su` 命令将使用 root 超用户。\n\n\n某些系统为超级用户（root）配置了无效密码，以提高安全性，并禁用直接连接该用户的能力。通过使用\
  \ `sudo` 命令，组内的用户可以以超级用户权限执行命令。\n\n在下面的示例中，用户 `devops` 能够访问通常只允许超级用户（root）访问的系统日志文件，这需要输入他们的密码：\n\
  \ndevops@demo.example.com $ sudo tail /var/log/secure\n[sudo] password for devops:\
  \ ********\n```\n\n此过程被称为权限提升，只有当用户位于某些特殊系统组时才被允许。通常，`wheel` 系统组允许用户执行超级用户（root）允许的任何命令。\n\
  当用户没有权限时，屏幕上会显示以下消息：\n\n```\ndevops is not in the sudoers file. This incident will\
  \ be reported.\n```\n## 存储\n\n在 Linux 中，所有文件都存储在文件系统中，以倒置目录树的形式组织，形成文件系统层次结构。这种倒置树结构根节点位于顶部，目录和子目录的分支从根向下延伸。请参考[图\
  \ 2.11]了解重要的 RHEL 文件系统目录：\n\n![](img/Figure_2.11.png)\n图 2.11：RHEL 中重要的文件系统目录\n\n\
  `/` 目录是文件系统层次结构顶部的根目录。`/` 字符在文件名中也作为目录分隔符。例如，如果 `etc` 是 `/` 目录的子目录，我们将其记为 `/etc`。同样，如果\
  \ `/etc` 目录包含一个名为 `issue` 的文件，我们引用为 `/etc/issue`。\n\n> | 注意：`/etc/issue` 文本文件显示在登录提示之前打印的登录消息或横幅。相比之下，`/etc/motd`\
  \ 文本文件通常显示问题、安全策略或消息。 |\n源自 `/` 的子目录具有标准的用途，用于根据类型和功能组织文件。这种系统的安排简化了文件的检索。\n\n以下是\
  \ RHEL 系统的关键位置和用途：\n\n* `/boot`: 系统引导所需的文件。\n* `/dev`: 包含访问硬件的特殊设备文件。\n* `/home`:\
  \ 普通用户存储个人数据和配置文件的家目录。\n* `/root`: 管理级超级用户 root 的家目录。\n* `/usr`: 安装的软件、共享库、包含文件和只读程序数据。关键子目录包括：\n\
  \    * `/usr/bin`: 用户命令。\n    * `/usr/local`: 本地自定义软件。\n* `/var`: 此系统特定的可变数据，在多次启动之间之间持久存在。它包含动态变化的文件，如数据库、缓存目录、日志文件、打印队列文档和网站内容。\n\
  * `/run`: 自上次启动以来启动的进程的运行时数据。包括进程 ID 文件和锁文件。内容在重启时会重建。在之前的 RHEL 版本中，使用了 `/var/run`\
  \ 和 `/var/lock`。\n* `/tmp`: 临时文件的全局可写空间。十天未访问、更改或修改的文件将被自动删除。另一个临时目录 `/var/tmp`\
  \ 会自动删除超过 30 天未访问、更改或修改的文件。\n\n\n对磁盘分区是系统管理的一个关键方面，允许将硬盘划分为称为分区的逻辑存储单元。这种做法允许系统管理员为不同的分区分配不同的功能。它有助于限制应用程序或用户的可用空间，将操作系统和程序文件与用户文件分离，为内存交换创建专用区域，并通过控制磁盘空间利用率提高诊断工具和备份镜像的性能。自\
  \ 1982 年以来使用的主引导记录（MBR）分区方案管理着基本输入/输出系统（BIOS）固件系统上的磁盘分区，支持多四个主分区。然而，由于物理磁盘和 SAN\
  \ 卷的大小增大，MBR 的 2 TiB 限制已成为现实世界的挑战。GUID 分区表（GPT）已成为 MBR 的继任者，提供了增强的功能，包括支持 128 个分区、更大的磁盘容量、通过主\
  \ GPT 提供冗余以及使用校验和进行错误检测。GPT 是物理磁盘上布局分区的标准，特别是在统一可扩展接口（UEFI）固件系统上。Parted 软件是一种多功能分区编辑器，通过提供创建、删除和修改分区的命令来辅助这一过程。当提供整个磁盘的设备名称时，`parted`\
  \ 命令允许管理员交互式管理分区。以下命令打印磁盘的分区表：\n\n```\n# parted /dev/nvme0n1\nModel: VMware Virtual\
  \ NVMe Disk (nvme)\nDisk /dev/nvme0n1: 21.5GB\nSector size (logical/physical): 512B/512B\n\
  Partition Table: gpt\nDisk Flags:\nNumber Start End Size File Name Flags\n2 630MB\
  \ 1704MB 1074MB xfs\n3 1704MB 21.5GB 19.8GB lvm (parted)\n```\n\n\n```\n# mkfs.xfs\
  \ /dev/sdb1\n```\n\n\n输出显示元数据详情，包括版本、日志配置以及块大小、扇区大小和文件系统属性等各种设置。注意的是，如果是首选的文件系统类型，可以使用\
  \ `mkfs.ext4` 命令在块设备上创建 `.ext4` 文件系统。\n\n## 手动挂载\n\n\n### mount /dev/sda1 /mnt/data\n\
  \n`mount` 命令通常采用两种常用方法来识别磁盘分区上的文件系统：使用 `/dev` 中包含该文件系统的设备文件名，或者使用写入文件系统的全局唯一标识符\
  \ (UUID)。要手动挂载设备，必须识别出特定设备，确保挂载点存在，并执行 `mount` 命令：\n\n\n```\nNAME MAJ:MIN RM SIZE\
  \ RO TYPE MOUNTPOINTS\nnvme0n1 259:0 0 20G 0 disk\n├─nvme0n1p1 259:1 0 600M 0 part\
  \ /boot/efi\n└─nvme0n1p3 259:3 0 18.4G 0 part\n├─rhel-root 253:0 0 16.4G 0 lvm /\n\
  └─rhel-swap 253:1 0 2G 0 lvm [SWAP]\n```\n\n\n### mount UUID=\"994b1923-381f-4d39-88e3-180bda039752\"\
  \ /mnt/data\n\n卸载文件系统是通常在关机和重启过程中执行的关键步骤，因为它可以确保存储设备安全断开，同时防止数据损坏。我们可以使用 `umount`\
  \ 命令断开未使用的文件系统。它需要将挂载点作为参数：\n\n\n然而，如果文件系统正在被活动使用，则无法卸载，这需要停止所有访问指定挂载点下数据的进程，`umount`\
  \ 命令才能执行成功。`lsof` 命令提供了每个文件系统活跃的资源列表，有助于解决卸载时遇到的挑战。\n\n| 注意：在拔掉插头之前，我们需要将内存中的数据缓存同步到文件系统，以确保磁盘上数据的完整性。\
  \ |\n\n\n`/etc/fstab` 文件（见图 2.13）是 RHEL 中一个关键的配置文件，用于确保文件系统在系统启动期间自动挂载，防止用户在重启后失去对数据的访问。该文件每行由六个空格分隔的字段组成，指定了设备信息、挂载点、文件系统类型（例如\
  \ `.xfs` 或 `.ext4`）、挂载选项、dump 备份设置以及文件系统校验的 `fsck` 顺序。使用设备 UUID 对于避免与块设备标识符更改相关的潜在问题至关重要。在修改\
  \ `/etc/fstab` 文件后，我们需要执行以下命令来更新 systemd 单元：\n\n```\nsystemctl daemon-reload\n\n\
  管理员必须格外小心，确保 `/etc/fstab` 中的条目准确，以防止出现无法启动的情况；可以通过 `umount` 和 `mount` 命令进行验证，或者使用\
  \ `findmnt --verify` 命令来验证语法是否正确。\n\n## 配置与维护系统\n\n\n### 附加软件\n\n安装附加软件允许用户执行更多活动，或使我们的系统能够为其他主机提供服务。超级用户\
  \ `root` 可以通过 RHEL 包管理器在系统中安装附加软件。RHEL 的包管理器是 `DNF` 程序。旧版本的包管理器被称为 `YUM`。软件通过使用\
  \ `RPM` 包格式的包进行发布。这种标准格式包含了软件二进制文件（计算机执行的代码）以及一些描述包内容的元数据，最终还包含必须或可能在系统中安装的其他包的依赖项。一个典型的例子是\
  \ Firefox 浏览器软件，它要求系统中安装了 GUI 才能运行。每个支持的 RHEL 架构都有相应的仓库标识符。\n\n\n*   64 位 Intel\
  \ 和 AMD - `x86_64`\n*   64 位 ARM - `aarch64`\n*   IBM Power（小端序） - `ppc64le`\n*\
  \   IBM Z - `s390x`\n与缺乏仓库支持和自动化依赖解析的低级 `RPM` 命令不同，`DNF` 简化了基于 `RPM` 的软件安装和更新。该命令允许用户执行各种操作，包括安装、更新、删除以及获取软件包及其依赖项的信息。通过与多个\
  \ Red Hat 和第三方软件仓库无缝协作，`DNF` 增强了整体包管理体验。要查找软件包，用户可以利用 `dnf list` 等命令显示已安装和可用的包，或使用\
  \ `dnf search` 列出匹配特定关键词的包。使用 `DNF` 了软件的安装和删除。例如，考虑以下命令：\n\n```\ndnf install apache2\n\
  ```\n它会安装指定的包并处理其依赖项。我们还可以使用 `DNF` 安装软件组，组代表为了特定目的而安装的相关软件集合。\n\n### 更新\n\n`DNF`\
  \ 确保了软件管理过程的顺畅高效，并提供了维护系统更新的简单方法。`dnf update` 命令是 RHEL 中维护已安装软件包时性和安全性的基础工具。在更新包时，`dnf`\
  \ 通常尝试保留现有的配置文件。然而，如果更新检测到潜在冲突，可能会重命名旧配置文件。例如，旧配置可能会被重命名为 `.rpmsave`，并安装新的配置文件。我们可以手动检查并合并更改。\n\
  ### 更新所有包\n\n为了确保我们的整个系统保持更新，我们可以在不指定任何包的情况下使用 `dnf update` 命令。这将查找所有安装包的更新并相应应用：\n\
  \n```\n```\n\n此命令对于通过应用已安装包的所有可用更新（包括内核更新）来维护系统安全性至关重要。建议在内核更新后重启系统以应用更改。\n\n###\
  \ 更新特定包\n当我们想使用 `dnf` 更新特定包时，可以直接指定包名。这将确保只有该包及其依赖项得到更新，而让系统的其他部分保持不变。\n\n```\n\
  dnf update httpd\n```\n此命令将检查为 `httpd` 包是否有可用更新，并安装最新版本。\n\n## 内核管理\n\n\n\n\n值得注意的是，`dnf\
  \ update` 命令对于管理系统和内核更新至关重要，它允许管理员同时维护多个内核版本以供测试。在 RHEL 中，我们可以保留多个内核版本用于测试。内核更新后，RHEL\
  \ 不会自动删除之前的内核版本，这允许我们在需要时启动旧版本。\n\n要检查已安装的内核，请使用：\n```bash\nrpm -q kernel\n```\n\
  \n这将列出所有已安装的内核版本。要删除旧内核版本：\n```bash\ndnf remove kernel-<version>\n```\n\n将 `<version>`\
  \ 替换为想要删除的特定内核版本。\n### 移除软件包\n\n此外，我们使用 `dnf remove` 命令来卸载软件包。\n该命令将卸载 `httpd` 包及其不再需要的依赖项：\n\
  \ndnf remove httpd\n```\n\n在确认之前，务必检查要删除的软件包列表。\n\n\nRHEL 将 DNF 软件包事务历史保存在 `/var/log/dnf.rpm.log`\
  \ 文件中，它记录了所有安装和删除的事务，允许用户跟踪对系统的更改。使用以下命令访问 DNF 事务历史：\n\n```bash\ndnf history\n\n\
  此命令提供了这些事务的简要摘要，显示相关信息，如使用的命令行、操作的日期和时间以及受影响的软件包或组。例如，输出可能会显示软件包的安装、内核更新或特定组件的删除。此外，管理员可以使用\
  \ `dnf history undo` 撤销特定事务，有效地将系统恢复到所选操作之前的状态。此功能确保了管理系统更改的灵活性和控制力，允许纠正意外的修改。\n\
  \n### 远程访问\n\n\n此外，SSH 为远程配置提供了命令行界面。打开终端并使用 `ssh` 命令连接到服务器，指定用户名和服务器地址。一旦登录，我们就可以像物理现场一样执行命令、编辑配置文件并管理系统。无论是通过用户\
  \  Web 控制台还是强大的 `SSH` 命令行，RHEL 都为管理员提供了多功能选项，以实现无缝高效的配置。\n\n## Web 控制台\n\n\n```bash\n\
  systemctl status cockpit.socket\n```\n\n\n我们可以使用以下命令执行 cockpit 服务：\n\n```bash\n\
  systemctl start cockpit\n\n请注意，我们可能需要使用 SELinux 和 firewalld 启用外部连接：\n\n```bash\n\
  sudo semanage port -a -t websm_port_t -p tcp 9090\n```\n\n此命令在系统上启动 `cockpit` 服务，允许管理员通过\
  \ Web 界面连接并管理服务器。假设服务已激活并接受连接。在这种情况下，管理员可以通过浏览器输入 `TCP 端口 9090` 的指定地址来访问 Web 界面，如图\
  \ 2.12 所示。\n\n![](img/Figure_2.12.png)\n图 2.12：Web 控制台仪表板\n\n### SSH 网络登录\n\n可以使用\
  \ `ssh` 命令通过 SSH 访问远程系统。它通过提供安全加密的替代方案用于网络设备之间的远程访问和通信，取代了不安全的 `telnet` 协议。许多 Linux\
  \ 发行版和 macOS 已经预装了 `OpenSSH` 工具。\n以下命令使用 `remoteuser` 用户名连接到 `remotehost.example.com`\
  \ 系统：\n\n```bash\nssh remoteuser@remotehost.example.com\nremoteuser@remotehost.example.com's\
  \ password: ********\n```\n\n我们可以看到，远程系统要求输入 `remoteuser` 用户名的密码以授予交互式 shell 的访问。我们可以像在本地一样在远程系统上执行命令。命令执行过程中存在一些网络延迟是正常的。作为主机名的替代方案，我们可以指定\
  \ IP 地址。连接中的通信由 `ssh` 命令加密，以防止密码和内容被窃听或劫持（中间人攻击）。现代云实例倾向于仅使用公钥和匹配的私钥进行认证，而不输入密码。例如，亚马逊云服务（AWS）使用密钥认证进行远程连接。这种认证方法要求在远程服务器上共享并存储与用户关联公钥。在连接期间，`ssh`\
  \ 命令提供私钥，如果与公钥匹配，则授予访问权限。\n\n以下命令使用私钥 `mykey.pem` 通过 `remoteuser` 用户名连接到 `remotehost.example.com`\
  \ 主机：\n```bash\nssh -i mykey.pem remoteuser@remotehost.example.com\n[remoteuser@remoteuser@remotehost.example.com\
  \ ~]$\n```\n\n\nAnsible 作为 Red Hat 的自动化工具使用 `ssh` 命令连接到远程主机并执行命令。\n\n与本地系统一样，我们可以输入\
  \ `exit` 命令或通过 `Ctrl+D` 结束会话来断开远程系统的连接。以下输出消息告知 SSH 会话已终止：\n\nConnection to remotehost.example.com\
  \ closed.\n```\n\n当我们仅需要在远程命令行上执行单个命令时，可以通过 `ssh` 命令直接指定该命令。在接下来的示例中，我们将执行 `hostname`\
  \ 命令：\n\nssh -i mykey.pem remoteuser@remotehost.example.com hostname\nremotehost.example.com\n\
  ```\n\n### SSH 密钥认证\n\n\n\n\n密钥认证是连接到远程系统的首选方式，比密码认证更安全，因为它们使用多种加密算法（`RSA`、`DSA`、`Blowfish`、`AES`、`ECDSA`、`ed25519`等）来存储信息，并具有有效期。远程服务器还有一个安全指纹，每次我们登录时都会保存并检查它，以确保没有人冒充另一个主机或劫持连接。远程主机指纹存储在\
  \ `~/.ssh/known_hosts` 文件中。如果本地机器保存的主机密钥与远程主机发送的不匹配，连接将自动关闭并显示警告信息。我们可以使用 `ssh-keygen`\
  \ 命令生成用于密钥认证的 SSH 密钥。默认情况下，它使用 `RSA` 2048 位加密，公钥保存在 `~/.ssh/id_rsa.pub` 中，私钥保存在\
  \ `~/.ssh/id_rsa` 中，并在屏幕上生成 `SHA 256` 指纹哈希值。我们可以通过指定 `-t` 选项自定义加密算法，通过 `-b` 选项指定密钥位数，并通过\
  \ `-f` 选项指定文件名。我们可以通过指定类似于密码的短语来保护 SSH 密钥，每次在使用时打开私钥，或者使用 `ssh-agent` 软件。\n| 注意：对于\
  \ FIPS 186-2，`DSA` 密钥恰好为 1024 位。 |\n\n在能够连接远程主机之前，我们需要与系统共享公钥。`ssh-copy-id` 命令将\
  \ SSH 公钥的密钥复制到远程系统。以下命令将我们的公钥复制到使用用户 `username` 连接的远程系统：\n\n```\n```\n\n`ssh-copy-id`\
  \ 程序连接到远程主机并将我们指定的公钥复制到 `~/.ssh/authorized_keys` 文件中，使我们能够使用 SSH 密钥连接到目标系统。\n\n\
  我们可以使用 `ssh-agent` 程序在会话开始或期间将 SSH 私钥缓存到内存中，以实现无密码认证。GNOME 图形桌面环境可以自动启动 `ssh-agent`。我们始终可以在终端中通过以下命令手动启动\
  \ `ssh-agent`：\n```\neval $(ssh-agent)\n```\n\nAgent pid 9949\n代理在我们的系统中显示进程标识符（PID）（在此情况下为\
  \ 9949）。一旦 `ssh-agent` 程序运行，当我们下次使用 `ssh` 命令使用密钥时，它会将我们的密钥认证缓存到内存中，并能够重用于无密码认证。\n\
  \n## 网络接口与设置\n\n网络接口和设置是系统连接的基础性组件，能够通过网络进行通信。本文参考了各种权威来源（包括 RHEL 的文档和学习材料），提供了在\
  \ RHEL 上管理网络接口和设置的全面概述。\n网络接口可以是允许计算机连接和通信的任何硬件或软件设置。Linux 系统（包括 RHEL）使用唯一名称识别每个网络接口，例如，第一个以太网接口使用\
  \ `eth0`，第一个无线接口使用 `wlan0` 等。\n\nRHEL 利用 `ip` 命令进行网络接口管理，提供了显示、启用、禁用和配置网络接口的功能，如下所示：\n\
  \n*   **显示网络接口**：命令 `ip addr` 或 `ip link show` 显示系统上的所有网络接口，包括它们的当前状态（启动/关闭）、IP\
  \ 地址和其他相关相关信息。\n*   **配置网络设置**：RHEL 网络设置可以通过编辑配置文件或使用 `nmcli`（网络管理器命令行界面）或 `nmtui`（网络管理器文本用户界面）等命令行进行手动管理。\n\
  *   **手动配置**：网络配置存储在 `/etc/sysconfig/network-scripts/ifcfg-<interface>` 文件中。编辑这些文件允许手动设置\
  \ IP 地址、子掩码、网关和其他网络参数。更改需要重启网络服务或接口才能生效。\n*   **使用 nmcli 和 nmtui**：`nmcli` 是管理网络设置的强大命令行工具，允许我们配置、管理和排除网络故障。另一方面，`nmtui`\
  \ 为那些倾向于不直接使用命令行工具的用户提供了基于文本的用户界面。\n*   **持久性网络配置**：为了让网络设置更改在重启后仍然存在，必须将其正确保存到系统配置文件中，或者通过\
  \ `nmcli` 或图形界面通过网络管理器进行管理。\n*   **网络故障排除**：RHEL 中常见的网络诊断命令包括 `ping`、`traceroute`、`netstat`\
  \ 和 `ip route`。这些工具可以帮助诊断连接问题、路由问题并监控活动连接。\n\n有效管理网络接口和设置对于管理 RHEL 系统非常重要。通过掌握命令行工具和手动配置文件，并理解连接背后的原理，管理员可以确保他们的系统在网络环境中保持连接并高效运行。有关详细示例和进一步阅读，请参考\
  \ Red Hat 官方文档、手册（`man ip`、`man nmcli`、`man nmtui`）以及 RHEL 特定资源。\n\n## 管理文件\n\n\n\
  ```\nvim /etc/fstab\n```\n\n\n\n它在全球范围内的广泛存在使其与众不同，而且其高度的可定制性允许用户根据自己的编码偏好对其进行定制。`Vim`\
  \ 命令实现了闪电般的编码速度，例如光标移动 (`hjkl`)、单词导航 (`w`) 以及强强大的删除和复制操作。该编辑器在精通后，能够让程序员无缝地操作文本，这体现了\
  \ `Vim` 适用于那些渴望提升编码技能的人士，他们能够以思维的速度毫不力地处理文本。在 `Vim` 中保存并退出，首先按 `Escape` 退出插入模式。然后，输入\
  \ `:` 在屏幕底部启动命令行。要保存已编辑的文件，输入 `w` (`:w` )，如果需要，使用 `:w filename` 指定新文件名。要退出 `Vim`，按\
  \ `:q`。如果存在未保存的更改，`Vim` 会提示警告，建议添加 `!` 来覆盖。若要无提示退出，请使用 `:q!`。或者，可以使用 `ZZ` 来保存并退出。尽管这些命令初看起来可能很复杂，但它们共同构成了一个强大的工具箱。\n\
  \n## 结论\n对 RHEL 管理基础方面的探索之旅为 IT 专业人员和系统管理员应对现代计算环境的复杂格局做好准备。通过对系统操作、存储配置、文件系统管理和高级系统部署技术的全面探索，学习者获得了一个强大的工具箱。这个工具箱对于构建和管理能够满足并超越当代组织基础设施动态需求的韧性系统至关重要。在快速发展的数字生态系统中，适应和应对新挑战的能力是至关重要的。掌握\
  \ RHEL 获得的洞解使专业人士能够构建安全、可扩展和高可用的系统。当管理员熟练配置远程访问、管理用户和组权限以及利用命令行进行高效系统操作时，他们就让自己处于了技术进步的前沿。它邀请专业人士深入研究\
  \ Linux、网络配置和安全管理，进一步扩展他们的能力。\n\n下一章将基于所获得的基础知识，引入更复杂的场景和高级技术。通过这种方式，我们能够利用驱动我们世界的操作系统。\n\
  \n## 记忆点\n*   `Anaconda` 是 RHEL 的安装程序，以其独特的并行安装方法脱颖而出，为用户提供了配置安装选项的灵活性，并允许根据硬件和安装媒体进行自动配置。\n\
  *   Linux 命令行由 shell（在 RHEL 中通常为 `Bash`）提供，提供了一个用户可以在其中输入指令的文本界面。提示符对于普通用户显示美元符号\
  \ `$`，对于超级用户 root 显示井号 `#`。\n*   `systemd` 软件控制 RHEL 中的启动、关机和服务层管理。传统的关机和重启命令已经发生转换，以适应\
  \ `systemd` 的功能。\n*   `su` 命令便于在终端中切换用户，而 `sudo` 命令启用权限提升。\n*   在 RHEL 中，文件存储在分级文件系统结构中，根目录\
  \ `/` 位于顶部，作为倒置树的根，子目录如 `/etc`、`/usr` 和 `/var` 为特定用途而组织，例如配置文件、已安装软件和可变数据，为高效的文件检索和管理提供了系统化的安排。\n\
  *   远程访问允许管理员通过用户友好的 Web 控制台 (`Cockpit`) 或通过 `OpenSSH` 提供的命令行界面，为远程管理和配置提供多种选择。\n\
