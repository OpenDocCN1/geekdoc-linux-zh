  \ Ansible Vault。\n## 结构](#contents.xhtml_sc2_124a)\n\n本章涵盖以下主题：\n\n*   Bash 脚本与\
  \ Ansible\n*   Ansible 语言\n*   创建 Ansible Play 和 Playbook\n\n## 目标](#contents.xhtml_sc2_125a)\n\
  \n\n## Bash 脚本与 Ansible](#contents.xhtml_sc2_126a)\n\nAnsible 的出现标志着 IT 自动化领域相对于传统\
  \ Bash 脚本的重大转变。最初，Bash 脚本对于 Unix 和 Linux 系统的系统管理至关重要，提供了灵活性，但复杂的脚本难以维护和扩展。相比之下，Ansible\
  \ 于 2012 年引入，其简单性和无代理的方法彻底改变了自动化，消除了在被管理节点上安装软件的需求。其用户友好的 YAML Playbook 使基础设施自动化民主化，使其比复杂的\
  \ Bash 脚本更易于上手。\n\n\n\n\nAnsible 相比于 Bash 脚本的主要优势包括其幂等性（确保结果的一致性且不会产生意外的副作用）、卓越的可扩展性，以及能够从单点管理大量机器。Ansible\
  \ 的模块化设计提供了极大的活性和可重用性，能够与云服务和平台无缝集成，并符合混合云和云原生环境的趋势。\n\n\n在 IT 自动化中 Ansible 相比 Bash\
  \ 脚本崛起的背景下，另一个关键区别在于它们所代表的编程范式：Ansible 主要是声明式的，而 Bash 脚本是命令式的。在声明式编程中（如 Ansible\
  \ 基于 YAML 的 Playbook 所示），我们指定系统的预期状态或最终目标，由 Ansible 确定如何实现该状态。这与 Bash 脚本的命令式本质形成对比，在命令式中，我们按特定顺序提供显命令来实现预期结果。这种从命令式脚本的步进方法到\
  \ Ansible 以结果为导向的声明式模型的转变，极大简化了复杂系统的自动化，使其更易访问和维护。\n\n## Ansible 架构\n\n\n![](img/Figure_4.1.png)\n\
  \n图 4.1：Ansible 架构\n\n*   **受管理节点 (Managed nodes)**：受管理或目标节点是用 Ansible 管理的节点。可以是\
  \ Linux、Windows、macOS 或任何支持的系统。Ansible 不需要向目标节点安装任何代理软件。相反，它通过 Linux/macOS 系统的 `SSH`\
  \ 或 Windows 系统的 `Windows Remote Management (WinRM)` 连接这些节点。\n\nAnsible 与以下内容通信：\n\
  \n*   **Linux**：Linux 系统通常易于用 Ansible 管理，因为它们原生支持 `SSH` 或通过 `Python Paramiko` 库。\n\
  *   **macOS**：与 Linux 类似，macOS 使用 `SSH` 连接。然而，我们在 macOS 上可能自动化的任务可能不同，更多侧重于开发者环境和\
  \ macOS 特有的应用程序。\n\n在 Ansible 中，模块、任务、Playbooks 和资产文件构成了 IT 环境自动化的基础：\n\n*   **模块与任务\
  \ (Modules and tasks)**：\n    *   Playbook 中的每个任务都会调用模块列表。当运行 Playbook 时，Ansible\
  \ 将这些模块复制到目标节点，执行它们，并在完成后删除它们。\n*   **Playbooks**：\n    *   Playbooks 是 Ansible\
  \ 自动化的核心组件。它们用 `YAML` 编写，并定义了在目标节点上按顺序执行的任务。\n    *   Playbooks 可以包含变量、条件、循环等，使得它们在处理复杂的自动化任务时非常强大且灵活。\n\
  *   **资产清单 (Inventory)**：\n    *   资产清单可以是简单的静态文件，也可以是从云提供商或其他服务拉取节点信息的动态源。\n\n\
  ## 快速上手\n\n在 IT 环境中引入和部署 Ansible 涉及几个关键步骤，从理解其基础知识到实际实现和使用。\n开始使用 Ansible 涉及简单直接的步骤，包括安装、配置资产文件以及创建\
  \ Playbook 来自动化整个 IT 基础设施的任务如下：\n\n*   **安装 (Installation)**：Ansible 可以轻松安装在运行 Playbooks\
  \ 的 RHEL 控制机上。可以通过 `dnf`、`yum`、`apt` 或 `pip` 等包管理器安装。\n\n```bash\n```\n\n*   **配置资产清单\
  \ (Configuring inventory)**：资产文件（通常为 `/etc/ansible/hosts`）用于定义 Playbook 中命令、模块和任务操作的主机和主机组。我们可以通过在括号中指定名称指定组名\
  \ `[group_name]`，并在每个组下列出主机名或 IP 地址。\n*   **创建 Playbook (Creating a playbook)**：Playbook\
  \ 是一个 `YAML` 文件，我们在其中定义需要执行的任务任务。它以主机列表开头，然后是任务列表。Playbooks 可以包含变量、任务和处理程序（handlers）。\n\
  \n\nAnsible 中的即时命令是一种根据需要对资产清单中的一组主机执行简单任务的方法，而无需编写完整的 Playbook。这些命令非常适合那些小到不值得编写完整\
  \ Playbook 的任务。它们通过 `ansible` 命令后跟主机组、模块名和任何适当参数来执行。以下是一些即时命令的基本示例：\n\n*   **使用\
  \ ping 模块检查连通性**：\n\nansible localhost -m ping\n```\n\n此命令利用 `ping` 模块检查资产清单中的所有主机是否已准备好由\
  \ Ansible 管理。\n\nlocalhost | SUCCESS => {\n    \"changed\": false,\n    \"ping\"\
  : \"pong\"\n}\n```\n*   **在主机组上运行命令**：\n\n```bash\nansible web -m command -a “uptime”\n\
  ```\n此命令在 `web` 组的所有主机上运行 `uptime` 命令。\n\n```\nweb.example.com | CHANGED | rc00\
  \ >>\n17:17:56 up 9:01, 2 users, load average: 0.93, 0.85, 0.78\n\n*   **收集事实 (Gathering\
  \ facts)**：\n\n```bash\nansible localhost -m setup\n\n此命令收集并显示 localhost 发现的事实。我们也可以对任何主机执行相同操作。这些即时命令是在我们的受管理主机上执行快速任务的强大功能，并为我们在探索更复杂的\
  \ Playbook 之前熟悉 Ansible 能力提供了一种良好方法。\n\n\n\n\n```json\nlocalhost | SUCCESS => {\n\
  \  \"ansible_facts\": {\n    \"ansible_all_ipv4_addresses\": [\n      [REDUCTED]\n\
  \    ]\n}\n```\n\n\n在 Ansible 中，清单（inventory）是用于启动作业的主机集合，也是这些主机特征的描述。清单对于定义应该管理哪些服务器或系统以及如何触达它们至关重要。\n\
  \n以下是对 Ansible 清单的详细介绍：\n\n    - **主机 (Hosts)**：Ansible 可以管理的单个机器或服务器。\n    - **组\
  \ (Groups)**：可以一起被作为目标的主机集合。组可以包含其他组，允许我们轻松地对基础设施建模。\n\n默认清单文件为 `/etc/ansible/hosts`，但只要在命令或配置中指定，我们可以使用任何文件作为清单文件。它可以是\
  \ INI 或 YAML 格式。\n\n```ini\n[web]\nwebserver1.example.com\n[db]\ndbserver1.example.com\n\
  这里，`web` 和 `db` 是各包含一个主机的组。\n\nYAML 格式示例：\n```yaml\nall:\n    web:\n      hosts:\n\
  \        webserver2.example.com:\n    db:\n      hosts:\n```\n这是上面所示 INI 清单格式的 YAML\
  \ 等效表示。\n\n- **动态清单 (Dynamic inventory)**：Ansible 不使用静态文件，而是可以使用源自外部系统的动态清单。这在云服务等环境中特别有用，因为机器及其\
  \ IP 地址可能会频繁变化。Ansible 会调用一个脚本（通常是 Python），该脚本与平台 API 交互并返回 JSON。\n\n```ini\n[db:vars]\n\
  ntp_server=pool.ntp.org\nproxy=proxy.example.com\n```\n- **别名 (Aliases)**：我们可以为主机定义别名，并在\
  \ playbook 中使用它代替实际主机名。\n\n- **清单参数 (Inventory parameters)**：Ansible 允许我们在清单文件中指定连接参数（如\
  \ `ansible_ssh_user`、`ansible_ssh_pass` 等）。\n\n- **最佳实践**：\n    - **使用版本控制**：使用版本控制系统跟踪清单的更改。\n\
  \    - **与 CMDB/云集成**：使用动态清单与我们的配置管理数据库 (CMDB) 或云提供商集成，以实现实时更新。\n\n- **利用清单**：在运行即时命令或\
  \ playbook 时，我们可以使用 `-i /path/to/inventory` 指定清单文件。\n\n\n总之，清单是 Ansible 的核心组件，定义了我们的自动化作业运行的位置和方式。理解并有效组织清单是实现高效且可扩展的\
  \ Ansible 部署的关键。\n\n## 模块 (Modules)\n\n\nAnsible 模块的关键方面如下：\n\n- **功能 (Functionality)**：每个模块设计用于处理特定任务。例如，`file`\
  \ 模块可以更改文件属性，`yum` 模块可以使用 `YUM` 管理包，而 `git` 模块可以管理 Git 仓库。\n- **幂等性 (Idempotency)**：Ansible\
  \ 模块的定义特性之一是幂等性，这意味着它们仅在达到所需状态需要更改时才会进行更改。这确保了顺序多次运行相同的 playbook 将产生相同的结果，如果状态已经符合预期，则不会更改状态。\n\
  - **扩展性 (Extensibility)**：Ansible 设计为易于通过自定义模块扩展。这允许用户根据其特定需求定制 Ansible，为其环境特有的任务或集成添加模块。\n\
  - **集成 (Integration)**：模块可以与各种服务和工具集成，从 AWS 和 Azure 等云提供商到网络设备、数据库等。\n\n# 在 playbook\
  \ 中使用模块\n\n\n```yaml\n- name: Web server installed\n  ansible.builtin.dnf:\n   \
  \ name: httpd\n```\n\n在此示例中，`dnf` 模块确保安装了 Apache (`httpd`) 软件包。同样地，我们可以使用 `yum`\
  \ 模块。\n\nAnsible 是一个开源自动化工具，提供了大量的模块，使用户能够高效地管理和自动化其 IT 环境的各个方面。这些模块本质上是预写的脚本，Ansible\
  \ playbook 可以调用这些脚本在被管理的节点上执行特定任务。\n在这里，我们将探索一些最常用的 Ansible 模块，突出它们的用途，并提供如何利用它们来简化自动化工作流的示例：\n\
  \n- **文件模块 (File modules)**：\n    - **copy**：将文件从本地机器复制到远程位置。它对于部署配置文件或脚本非常有用。\n\
  ```yaml\n  ansible.builtin.copy:\n    src: /local/to/file.conf\n    dest: /remote/to/file.conf\n\
  ```\n    - **fetch**：从远程节点检索文件并存储在本地，允许对远程数据进行备份或分析。\n- name: Fetch a file from\
  \ remote nodes\n  ansible.builtin.fetch:\n    src: /remote/to/file.conf\n    dest:\
  \ /local/to/store/file.conf\n```\n```yaml\n- name: Ensure a directory exists\n \
  \ ansible.builtin.file:\n    path: /path/to/directory\n    state: directory\n```\n\
  \    - **lineinfile**：确保文件中存在特定行，这对于更新配置文件有用。\n```yaml\n- name: Ensure line is present\
  \ in configuration file\n  ansible.builtin.lineinfile:\n    line: 'Configuration\
  \ line to be added'\n    state: present\n```\n\n- **软件软件包模块 (Software package modules)**：\n\
  ```yaml\n- name: Install a package using the system's package manager\n  ansible.builtin.package:\n\
  \    name: nginx\n    state: present\n    - **yum/apt/dnf**：这些模块分别使用 `YUM`（Red Hat\
  \ 系统）、`APT`（Deb 系统）和 `DNF`（较新的 Red Hat 系统）管理包。\n```yaml\n- name: Install a package\
  \ with YUM\n  ansible.builtin.yum:\n    name: httpd\n```\n- **系统模块 (System modules)**：\n\
  \    - **user**：管理用户账户。\n```yaml\n- name: Add a new user\n    name: username\n \
  \   state: present\n```\n    - **service**：管理服务，确保它们运行或停止。\n```yaml\n  ansible.builtin.service:\n\
  \    name: nginx\n    state: started\n```\n\n\n\n```yaml\nname: nginx\nstate: started\n\
  ```\n\n## 网络工具模块\n\n- `get_url`: 从 HTTP、HTTPS 或 FTP 下载文件到远程节点。\n    ```yaml\n  \
  \  ansible.builtin.get_url:\n      url: http://example.com/path/to/file\n      dest:\
  \ /path/to/destination\n    ```\n  - name: 向 API 发 GET 请求\n    ```yaml\n    ansible.builtin.uri:\n\
  \      url: http://api.example.com/get/data\n      method: GET\n    ```\n\n通过理解和利用这些常用模块，我们可以自动化各种任务，从简单的文件复制到复杂的部署和配置，从而提高我们\
  \ IT 运营的效率和扩展性。\n\n## 文档\nAnsible 拥有广泛的内置模块，通过 Ansible Galaxy 或自定义开发可以获取更多模块。每个模块的详细文档（包括参数和用法示例）可以在\
  \ Ansible 文档中查找到。模块是 Ansible 自动化的构建块，对于任何希望使用 Ansible 进行 IT 基础设施管理和自动化需求的人来说都是关重要的。通过利用模块，用户可以创建强大、可扩展且高效的自动化解决方案。我们可以使用\
  \ `ansible-doc` 命令访问这些文档，如[图 4.2]或 [https://docs.ansible.com/] 网站所示：\n\n![](img/Figure_4.2.png)\n\
  \n图 4.2：命令 `ansible-doc debug` 的输出\n提供的文档涵盖了 Ansible 如何工作的本质方面，以及使其成为优秀自动化工具的特性。\n\
  \n该文档强调了使用 Ansible 的多个优势，包括其易读的语法、无代理架构（在托管节点上仅需要 SSH 和 Python）、基于推送的模型（相对于基于拉取的）、可扩展性、针对各种任务的内置模块以及等幂性，等幂性确保操作执行一次且仅执行一次，防止在托管节点上发生冗余更改。`more`\
  \ 模块说明了每个可能的参数及其数据类型、是否必填，以及作为最常用用例示例的代码片段。\n\nAnsible 官方文档和模块索引提供了关于可用 200 多个集成模块的详细信息，并由\
  \ Ansible 工程团队直接维护了如何使用 Ansible 执行不同自动化任务的说明。每一个额外的 Ansible 资源都包含在文档中并采用相同的结构。\n\
  ## 命令行界面\n\nAnsible 操作通过各种命令行工具执行，这些工具使得 Ansible 在自动化任务中既灵活又高效。以下是关键的 Ansible 命令行工具，探索了它们的功能以及它们对整体自动化体验的贡献：\n\
  \n- `ansible`: `ansible` 命令是 Ansible 自动化平台的基石，允许用户跨清单中执行即时命令。它非常适合不需要完整 playbook\
  \ 的任务，例如从主机组中快速收集信息，或在多台机器上执行单个命令。例如，检查运行时间或重启服务器可以通过 `ansible` 命令轻松完成。\n- `ansible-doc`:\
  \ `ansible-doc` 命令是 Ansible 自带的 CLI 工具，为 Ansible 模块提供文档。我们可以将其视为 Ansible 模块的手页（man\
  \ pages），它向我们展示如何使用它们、参数、示例等更多内容。要查看特定模块的文档，我们将使用以下格式的命令：\n\n```\nansible-doc <module_name>\n\
  ```\n例如，要查看服务模块的文档，我们将运行：\n\n```bash\nansible-doc service\n```\n此命令对于理解模块的功能以及如何在我们的\
  \ Ansible playbooks 中正确利用它们极其有用。\n\n- `ansible-playbook`: `ansible-playbook` 命令无疑是用于运行\
  \ Ansible playbooks 最频繁使用的工具。Playbooks 是 YAML 文件，包含自动化引擎执行的一系列指令或剧本（plays）。它们可以执行从软件安装和更新到复杂的多层部署和配置管理等各种任务。该工具提供了许多选项来定制执行过程，包括限制主机范围、选择特定任务以及设置运行时变量。\n\
  \n- `ansible-inventory`: `ansible-inventory` 工具管理清单，清单可以是静态的也可以是动态的，允许进行自省和操作。它用于列出、创建或修改清单详情，使得管理我们的\
  \ playbooks 目标主机组变得更容易。此命令对于理解清单的当前状态以及调试复杂的清单设置至关重要。\n- `ansible-console`: `ansible-console`\
  \ 命令提供了一个交互式的读取-评估-打印循环（REPL）环境，用于运行即时 Ansible 命令。它对于探索和快速任务特别有用，提供了制表符补全和历史记录功能。这种交互式\
  \ shell 允许用户在其清单中的主机上执行命令并获得即时反馈，简化了即时任务的执行过程。\n\n- `ansible-connection`: `ansible-connection`\
  \ 命令稍微特殊一些；它被 Ansible 内部用于管理到设备的持久连接。虽然大多数用户不直接使用它，但理解 Ansible 如何与远程节点通信至关重要，特别是在排查连接问题或自定义连接行为时。\n\
  \n- `ansible-config`: 使用 `ansible-config` 工具管理 Ansible 配置非常简单。它允许用户查看、编辑或创建新的 Ansible\
  \ 配置文件。这对于根据特定环境或需求量身定制 Ansible 的行为特别有帮助，例如调整超时设置、指定清单路径或启用额外的调试输出。\n- `ansible-test`:\
  \ 确保我们的 Ansible 代码可靠并按预期执行是 `ansible-test` 发挥用场的地方。该工具帮助测试 Ansible roles 和 collections，提供了一种执行完整性、单元、集成和其他测试的方法。它是开发和持续集成工作流必不可少的工具，有助于维护高质量的\
  \ Ansible 内容。\n\n- `ansible-galaxy`: `ansible-galaxy` 命令是共享和重用 Ansible 内容的门户。它允许用户从\
  \ Ansible Galaxy 安装 roles 和 collections，Ansible Galaxy 是共享 roles 和 collections 的官方社区枢纽。该工具促进了协作和代码重用，使得发现、共享和将社区解决方案整合到我们的项目中变得更容易。\n\
  \n- `ansible-vault`: 安全是自动化中首要的问题，`ansible-vault` 通过加密 Ansible 项目中的敏感数据来解决这个问题。它可以加密整个文件（例如清单文件特定变量），确保密码或密钥等敏感数据得到安全管理。`ansible-vault`\
  \ 支持创建、编辑和查看加密内容，是安全自动化实践至关重要的工具。\n- `ansible-sign` 和 `ansible-verify`: 这些工具是 Ansible\
  \ 安全机制的一部分，允许用户对 roles 进行签名并验证其真实性。签名 roles 有助于确保 Ansible 内容的完整性和来源，在分发和消费自动化资源时提供了额外的安全保障。\n\
  \n\n\n\n\n## Ansible 语言\n\n在 IT 自动化领域，Ansible 已成为规则改变者，提供了强大、简单且高效的方法来自动化各种 IT 任务。Ansible\
  \ 自动化能力的核心是它的 playbooks（剧本），它们是自动化环境和流程的蓝图。\n\n\nAnsible playbooks 的关键特性如下：\n\n\
  * 易读的格式：Playbooks 使用 `YAML` 编写，即使对于编程初学者来说，这种格式也易于编写和理解。\n* 任务管理：它们定义了任务以及执行任务的顺序。\n\
  * 等幂性：playbooks 中的任务是等幂的，确保无论 playbook 运行多少次，都能相同的结果。\n* 错误处理：Playbooks 可以包含错误处理，以确保自动化过程不会因意外问题而中断。\n\
  \n创建一个有效的 playbook 涉及理解我们的自动化目标并将其转换为结构化格式。\n\n\n* 定义主机和组：指定 playbook 应该在哪些主机或主机组上运行。\n\
  * 设置变量：定义任务中将使用的任何必要变量。\n* 列出任务：概述每个需要执行的任务，并在适当的情况下使用 Ansible 模块。\n* 错误处理：实施错误处理策略以管理任务中任何可能的失败。\n\
  \n考虑以下示例：\n\n```yaml\n- name: Ensure web server is installed and running\nhosts:\
  \ web\nbecome: true\ntasks:\n  - name: Install web server\n    ansible.builtin.yum:\n\
  \      name: httpd\n      state: present\n  - name: Start Apache\n    ansible.builtin.service:\n\
  \      name: httpd\n      state: started\n      enabled: true\n```\n\n此示例 playbook\
  \ 设计用于自动在一组 Web 服务器上安装和启动 Apache。\n\n## 高级 playbook 技术\n\n随着我们对基础 playbook 越来越熟悉，我们可能会探索以下高级技术：\n\
  \n* Roles（角色）和 includes（包含）：将复杂的 playbook 拆分为可复用的角色或包含其他 playbook 或任务。\n* 模板和文件：使用\
  \ `Jinja2` 模板生成动态配置文件。\n* Handlers（处理器）：根据任务执行的结果管理服务和进程。\n* 循环和条件语句：根据某些标准重复任务或根据条件执行任务。\n\
  * 测试和部署：测试是 playbook 实施中的关键步骤。使用 Ansible 的 `--check` 模式以干运行模式运行 playbooks，在不进行实际更改的情况下模拟更改。此外，可以使用\
  \ `ansible-lint` 检查 playbook 中的最佳实践和潜在错误。\n\n在 Ansible 中实现 playbooks 是一项技能，可以彻底\
  \ IT 专业人士管理和自动化其基础设施的方式。凭借其易于理解的语法和强大的功能，playbooks 让自动化变得易于访问、可扩展且可维护。无论是部署应用程序、管理配置还是自动化网络设置，精通\
  \ playbooks 都是迈向高效无误 IT 化的关键一步。\n\n## Plays\n\n凭借简单而强大的自动化引擎，Ansible 通过 plays 的概念提供了这种能力。Ansible\
  \ 中的一个 play 是一组旨在在 playbook 中定义的指定主机上运行的任务。这种方法增强了组织性和可读性，还通过允许对各种主机执行有针对性的操作，放大了自动化的力量。\n\
  \n在本节中，让我们探索 Ansible plays 结构化、多功能且可扩展的理念。\n\n## 多个 plays 的威力\n\n在单个 Ansible playbook\
  \ 中利用多个 plays 有助于实现更有组织、模块化且多功能的自动化策略。这种技术允许在同一个 playbook 中执行针对特定主机或组定制的差异化任务。例如，考虑我们需要不同地管理\
  \ Web 服务器和数据库服务器的场景。\n\n以下是多 play playbook 的可能外观：\n\n```yaml\n- name: First play\n\
  hosts: web\ntasks:\n  - name: Apache installed\n    ansible.builtin.yum:\n     \
  \ name: httpd\n      state: present\n  - name: Apache service enabled\n    ansible.builtin.service:\n\
  \      name: httpd\n      enabled: true\n\n- name: Second play\nhosts: database\n\
  tasks:\n  - name: MariaDB service enabled\n    ansible.builtin.service:\n      name:\
  \ mariadb\n      enabled: true\n```\n\n在 `multipleplays.yml` 示例中，第一个 play 针对 Web\
  \ 服务器以安装并启用 Apache，而第二个 play 专注于数据库服务器，确保 MariaDB 服务已启用。这种划分不同 plays 的结构化组织提供了清晰的焦点，使\
  \ playbook 易于理解和维护。\n\n## 结构化组织和任务执行\n\nplaybook 中的每个 play 都通过独特的名称、目标主机和一系列任务进行定义，提供了\
  \ playbook 目的和范围的清晰概述如下：\n\n* Web 服务器 play：针对 `web.example.com`，带有安装和启用 Apache 服务的任务。\n\
  * 数据库 play：专注于 `database.example.com`，具有单个任务以确保 MariaDB 服务已启用。\n\n这种级别的组织确保任务精确地执行在需要的地方，增强了\
  \ playbook 的效率和有效性。\n\n在 playbook 中使用多个 plays 为 Ansible 的自动化能力引入了无与伦比的多功能和可扩展性，如下：\n\
  \n* 多功能：通过为不同的主机或组定义不同的任务，Ansible 在单个 playbook 内适应了多样的自动化需求。这种灵活性允许跨我们的基础设施进行有针对性的配置、安装和更新。\n\
  * 可扩展性：随着我们自动化需求的演变，额外的 plays 可以无缝集成到 playbook 中。这种模块化方法支持我们基础设施的增长，而不会损害可维护性或可读性。\n\
  \nPlays 是 Ansible 自动化实力的基础组件，能够在跨主机上实现精确、有组织且高效的任务执行。通过利用 playbook 中的多个 plays，我们可以编排既多功能又扩展的复杂自动化工作流，以适应我们基础设施的的需求。无论是管理\
  \ Web 服务器、数据库服务器还是不同技术的混合，Ansible plays 都提供了实现卓越自动化的结构化路径。\n\n## 变量\n\nAnsible 变量是存储值的实体，这些值可以在整个\
  \ Ansible playbook 中使用。它们可以代表从字符串、数字、列表到更复杂的数据结构（如字典）。\n\n在 Ansible 中，变量名称必须符合某些规则才能有效。这些规则主要源于底层\
  \ Python 的变量命名规范，因为在 playbook 执行期间，Ansible 变量直接映射到 Python 变量。\n\n以下是一个说明无效的 Ansible\
  \ 变量名及其被视为无效原因的示例表：\n\n\n\n\n| 无效变量名 | 无效原因 |\n| --- | --- |\n| `9variable` | 不能以数字开头\
  \ |\n| `variable-name` | 不允许使用连字符；请使用下划线 (`_`) 代替 |\n| `variable name` | 不允许空格 |\n\
  | `variable.name` | 不允许点 |\n| `import` | 不能使用 Python 的保留字 |\n| `def` | 不能使用 Python\
  \ 的保留字 |\n| `variable(name)` | 不允许使用括号等特殊字符 |\n| `variable&name` | 不允许使用符号等特殊字符\
  \ |\n| `variable*name` | 不允许使用星号等特殊字符 |\n| `True` | 布尔值 `True` 和 `False` 是 Python\
  \ 的保留字，不应使用 |\n| `None` | `None` 是 Python 的保留字，不应作为变量名 |\n| `variable-name- with--doublehyphen`\
  \ | 不允许双连字符；请使用单个下划线 (`_`) 代替 |\n\n表 4.1：无效变量名\n\n请记住，Ansible 和 Python 中的有效变量名必须以字母\
  \ (`a-z`, `A-Z`) 或下划线 (`_`) 开始，后跟字母、下划线或数字 (`0-9`)。避免使用 Python 关键字和特殊字符，以确保我们的 Ansible\
  \ 变量有效且不会引起语法或运行时错误。\n\nAnsible 变量可以在多个定义，包括清单文件（inventory files）、playbooks、包含的文件和角色（roles）。它们可用于任务、模板和角色参数化，使我们的自动化更加动态且可重用。\n\
  \n了解不同类型的变量、声明方式以及冲突时的优先级，对于在 Ansible 中进行有效的变量管理非常重要，如下：\n\n### Ansible 中的变量类型\n\
  - **内置变量 (facts)**：在执行时自动发现有关远程系统的信息。\n- **用户定义变量**：由用户在 playbooks、清单、角色等多个地方定义。\n\
  - **特殊变量**：由 Ansible 预定义并具有特殊含义，例如 `inventory_hostname`，它代表 Ansible 正在操作的当前主机。\n\
  \n### 声明变量\n变量可以在多个地方声明，例如：\n- **清单文件 (Inventory file)**：通常用于特定于主机或主机组的变量。\n- **Playbooks**：在\
  \ play 级别，变量可以应用于 play 内的任务。\n- **角色 (Roles)**：在角色内部，以便在不同的 playbook 中进行封装和重用。\n\
  - **变量文件 (Variable files)**：独立的 YAML 文件，可以根据需要加载到 playbook 或角色中。\n\n在 playbook 中声明变量的示例如下：\n\
  \n```yaml\n- name: Configure web server\n  hosts: all\n  vars:\n    http_port: 80\n\
  \    max_clients: 200\n  tasks:\n    - name: Start a web server\n      ansible.builtin.yum:\n\
  \        name: httpd\n        state: present\n```\n\n### 变量优先级\nAnsible 通过考虑优先级来解析变量。高优先级的变量会覆盖低优先级的变量。从低到高的顺序如下：\n\
  - 在清单中定义的变量\n- 在 playbooks 中定义的变量\n- 通过命令行传递的变量\n- 在角色中定义的变量\n- 在块 (blocks) 中定义的变量\n\
  \n## 最佳实践\n- **命名规范**：使用有意义的变量名并坚持一致的命名规范，使我们的 playbook 更具可读性。\n- **变量作用域**：在适当的作用域（全局、play、主机、角色）内定义变量，以避免意外行为。\n\
  - **避免硬编码**：使用变量代替硬编码的值，特别是对于可能会更改的数据（例如 IP 地址、端口号、文件路径）。\n- **谨慎使用 facts**：收集 facts\
  \ 功能强大，但会减慢 playbook 的执行速度。如果不需要，请禁用 fact 收集，或使用 `gather_subset` 选项来限制收集的数据。\n-\
  \ **变量文档**：对 playbook 和角色中使用的变量进行记录，特别是当我们创建供他人使用的角色时。\n\n变量是 Ansible 自动化能力不可或缺的一部分，提供了灵活性，让我们根据所管理的系统的独特特性来定制自动化。通过理解并有效利用变量，结合\
  \ Ansible 的优先级规则和最佳实践，我们可以创建更动态、高效且易于维护的 Ansible playbook 和角色。变量允许用户抽象某些值并在多个 playbook\
  \ 中使用，使脚本具有可重用性并适应不同的环境。Ansible 从目标系统收集的 facts 提供了系统属性的动态清单，可以利用它根据每个主机的特定特性来定制任务。\n\
  \nAnsible 的转换能力通过过滤器（filters）和插件（plugins）得到了进一步增强。过滤器用于操作模板中的数据，允许无缝执行复杂的数据转换和逻辑操作。插件扩展了\
  \ Ansible 的功能，涵盖了从收集额外 facts 到提供新过滤器、查找能力等广泛用途。\n\n### Facts\nAnsible 力量的一个关键方面在于它对\
  \ facts 的处理，这是一种从目标主机检索系统信息的方法。facts 允许利用一个系统的状态或行为影响其他系统的配置。以下是一个示例：\n\n```yaml\n\
  - name: Print all facts\n  hosts: all\n  gather_facts: true\n  tasks:\n    - name:\
  \ Display all facts from the host\n      ansible.builtin.debug:\n        var: ansible_facts\n\
  ```\n\n在这个示例中，使用 `ansible.builtin.debug` 模块打印收集到的关于主机的所有 facts，这些信息可以用于我们基础设施中的各种自动化任务。我们可以通过设置布尔值\
  \ `gather_facts`（默认为 `true`）来决定启用或禁用 facts 获取。良好的做法是在不需要时禁用 fact 收集以提升性能。\n\nAnsible\
  \ 已成为 IT 专业人士手中不可或缺的工具，帮助他们优雅且高效地应对复杂基础设施。通过将易用性与管理变量、facts、过滤器和插件的强大功能相结合，Ansible\
  \ 赋予了组织自动化 IT 操作的能力。展望未来，Ansible 的持续演进和社区驱动的增强将使其一直处于自动化解决方案的前沿。\n\n### 过滤器 (Filters)\n\
  Ansible 过滤器是强大的工具，允许我们转换 Ansible playbook 内部的数据。它们允许通过将变量通过过滤器并以多种方式对其修改来操作变量及其内容。本节将探讨\
  \ Ansible 过滤器的概念、常见用例以及如何有效利用它们来简化自动化任务。\n\nAnsible 过滤器是 Jinja2 表达式，其工作原理是将变量作为输入，并通过过滤过程转换为不同的格式或结构。它们使用管道符号\
  \ (`|`) 后跟过滤器名称的应用。过滤器可以执行以下任务：\n\n- **格式化日期**：将 UNIX 时间戳转换为人类可读的日期格式。\n- **数据转换**：更改数据的结构或格式以匹配所需的输出。\n\
  - **数学运算**：对变量进行计算，如加法、减法或生成哈希值。\n- **字符串操作**：通过大写、替换文本、转换为 JSON 或 YAML 等方式操作字符串。\n\
  - **列表操作**：过滤、映射或减少列表以获得特定输出。\n- **网络数据处理**：为了网络配置操作 IP 地址和子网掩。\n\n\n\n\n\n## 格式化日期\n\
  \n- name: 显示特定格式当前日期\n```yaml\nansible.builtin.debug:\n  msg: \"{{ ansible_date_time.epoch\
  \ | timestamp_custom('%Y-%m-%d %H:%M:%S') }}\"\n```\n\n- 将列表转换为逗号分隔的字符串\n```yaml\n\
  vars:\n  list_variable: ['item1', 'item2', 'item3']\ntasks:\n  - name: 将列表转换为逗号分隔的字符串\n\
  \    debug:\n      msg: \"{{ list_variable | join(',') }}\"\n```\n\n- 计算字符串的哈希\n\
  ```yaml\nvars:\n  password: 'secretPassword'\ntasks:\n  - name: 输出密码的 SHA256 哈希\n\
  \    debug:\n      msg: \"{{ password | hash('sha256') }}\"\n```\n\n- 过滤字典列表\n```yaml\n\
  vars:\n  users:\n    - name: John\n      age: 25\n    - name: Jane\n      age: 22\n\
  \    - name: Doe\n      age: 30\ntasks:\n  - name: 获取年龄大于等于 25 的用户的名称\n    debug:\n\
  \      msg: \"{{ users | selectattr('age', '>=', 25) | map(attribute='name') | list\
  \ }}\"\n```\n\n## 最佳实践\n\n- **理解输入和输出**：了解我们正在处理的数据类型以及我们想要实现的目标，有助于选择正确的过滤器。\n\
  - **慎用过滤器链链**：虽然可以链用多个过滤器，但这样做会使我们的 playbook 更难阅读和调试。请审慎使用此功能。\n- **自定义过滤器**：对于现有过滤器未涵盖的复杂数据转换，可以考虑用\
  \ Python 编写自定义过滤器。这需要对 Ansible 和 Python 有深入的理解，但提供了无限的活性。\n- **文档**：参考 Ansible 和\
  \ Jinja2 的官方文档，探索可用过滤器的范围及其用法。\n\nAnsible 过滤器是一个多功能特性，通过允许我们内联执行复杂的数据操作，可以显著增强 playbook\
  \ 的功能和可读性。通过掌握过滤器，我们可以简化任务，避免为了数据转换而额外使用不任务或模块，并使我们的 playbook 更高效、更易维护。\n\n## 获取结果\n\
  \n在 Ansible 中使用变量获取运行命令的结果是一项强大的技术，用于捕获和利用 playbook 中任务的输出。通过使用 `register` 关键字，将命令执行的结果存储在变量中，然后在后续任务中使用该变量进行条件执行、调试或任何需要访问任务输出的用途。\n\
  \n### 捕获命令输出\n\n为了捕获命令的输出，我们使用 `command` 模块结合 `register` 关键字将命令输出存储在变量中。该变量包含一个带有多个键的字典，包括用于标准输出的\
  \ `stdout`、标准错误的 `stderr` 以及命令返回码的 `rc`。\n\n示例：捕获 whoami 命令输出\n\n```yaml\n- name:\
  \ 捕获 whoami 命令的输出\n  ansible.builtin.command: whoami\n  register: login\n```\n\n\
  在此示例中，`whoami` 命令的输出被注册到名为 `login` 的变量中。我们可以在后续任务中使用该变量来访问命令输出。\n\n### 使用注册的变量\n\
  \n一旦注册了变量，可以使用变量名和字典中的键来访问其内容。例如，为了显示之前捕获命令的标准输出，我们可以使用 `debug` 模块。\n\n示例：显示注册的变量\n\
  \n```yaml\n- name: 打印 login 变量\n  ansible.builtin.debug:\n    var: login\n```\n\n\
  此任务将显示存储在 `login` 中的整个字典，包括命令输出、返回码和任何错误。\n\n对于更具针对性的方法，特别是如果我们只对命令的输出感兴趣，可以直接引用\
  \ `stdout` 键：\n\n```yaml\n- name: 打印 login 变量\n  ansible.builtin.debug:\n    msg:\
  \ \"Logged in as user {{ login.stdout }}\"\n```\n\n此任务构建了一个包含 `whoami` 命令标准输出的消息，有效地显示了登录用户的名称。\n\
  \n### 实际用例\n\n捕获命令输出并在后续任务中使用它可以实现广泛的实际应用，如下：\n\n- **条件执行**：根据上一个命令的输出执行某些任务。\n\
  - **调试**：为了故障排除之目的显示命令输出。\n- **动态配置**：使用命令输出动态配置其他任务或模板。\n\n通过利用 Ansible 注册变量和利用命令输出的能力，我们可以显著增强自动化工作流的活性和智能化。\n\
  \n## 循环\n\n循环允许我们对列表或范围内的项重复任务。在多个元素上应用一致的一系列操作时（例如在多个主机上安装软件包、创建用户或管理服务），此功能是无价的。通过在\
  \ playbook 中引入循环，我们可以显著减少代码冗余，增强 playbook 的可读性，并确保跨基础设施的任务执行的一致性。\n\n## LAMP 示例\n\
  \nLinux、Apache、MySQL 和 PHP/Perl/Python (LAMP) 被认为一个需要确保多个服务（例如 `httpd` (Apache)\
  \ Web 服务器和 MariaDB 或 MySQL）运行在我们的服务器上的场景。我们不需要为每个服务编写单独的任务，而是可以使用循环来简化我们的 playbook。以下是一个简化的示例，展示了如何使用循环检查并确保服务正在运行：\n\
  \n```yaml\n- name: 确保关键服务正在运行\n  hosts: all\n  tasks:\n    - name: 确保服务启动\n    \
  \  ansible.builtin.service:\n        name: \"{{ item }}\"\n        state: started\n\
  \      loop:\n        - httpd\n        - mariadb\n```\n\n在此示例中，循环遍历 `loop` 指令下定义的服务列表。对于列表中的每个项（`httpd`\
  \ 和 `mariadb`），任务使用 `ansible.builtin.service` 模块来确保服务处于启动状态。`{{ item }}` 占位符代表循环中的当前项，随着每次迭代动态变化，以反映正在管理的服务。\n\
  \n### 执行和输出\n\n执行时，该 playbook 会收集要素信息，然后继续确保每个指定的服务正在运行。如果某个服务未运行，Ansible 将启动它；如果其等等等等性，Ansible\
  \ 将移动到下一个项而不进行任何更改。输出将指示每个服务的任务结果，为所执行的操作提供清晰的反馈。\n\nAnsible 循环提供了一种稳健的机制，可以高效地自动化重复任务，减少潜在错误和代码重复。通过理解和利用循环，我们可以增强\
  \ playbook 的有效性，确保跨 IT 环境的一致可靠的自动化。无论是管理服务、用户、软件包还是配置，Ansible 循环都是任何旨在精简操作和卓越自动化的\
  \ IT 专业人员工具箱必不可少的工具。\n\n## 条件\n\n条件（特别是 `when` 语句）对于使用 Ansible 创建响应式和智能自动化是必不可少的。通过条件地执行任务，我们可以确保我们的\
  \ playbook 不仅更高效，而且更能适应基础设施的多样化需求。\n\n### when 语句\n\n在 Ansible 中实现条件的主要方法是通过 `when`\
  \ 语句。这一强大功能允许任务根据条件执行，增强了 playbook 的灵活性并确保任务仅在需要运行时运行。`when` 语句中的条件利用 Jinja2 测试和过滤器来评估任务是否应该继续。\n\
  \n示例：基本条件执行\n\n\n\n\n考虑一个名为 `configure_nginx` 的变量场景，它决定了 NGINX 是否应该重载。重载 NGINX 的任务执行可以根据\
  \ `configure_nginx` 的真值进行条件控制。\n\n```yaml\n- name: Conditional execution example\n\
  \  hosts: all\n  vars:\n    configure_nginx: false\n  tasks:\n    - name: Reload\
  \ nginx\n      ansible.builtin.service:\n        name: nginx\n        state: reloaded\n\
  \      when: configure_nginx\n```\n\n在这个示例中，只有当 `configure_nginx` 设置为 `true` 时，重载\
  \ NGINX 的任务才会执行。如果 `configure_nginx` 为 `false`（如上所示），该任务将被跳过。\n\n## 基于变量值的条件执行\n\
  \n通过切换 `configure_nginx` 变量的值，可以进一步说明 `when` 语句的威力：\n\n```yaml\n- name: Basic conditional\n\
  \  hosts: all\n  vars:\n    configure_nginx: true\n  tasks:\n    - name: Reload\
  \ nginx\n      ansible.builtin.service:\n        name: nginx\n        state: reloaded\n\
  \      when: configure_nginx\n```\n\n当 `configure_nginx` 设置为 `true` 时，重载 NGINX 的任务将执行，这展示了如何基于变量值的条件判断轻松更改\
  \ playbook 的行为。\n\n## 处理器 (Handlers)\n\nAnsible handlers 是一个强大的功能，允许我们根据其他任务的结果来触发任务。它们对于管理在配置更改时需要重启或重载的服务和应用程序特别有用。在本节中，我们将探索\
  \ Ansible handlers 是什么、它们如何工作，并提供示例来演示它们在基础设施自动化中的用处，如下：\n\n- **理解 Ansible handlers**：核心上，Ansible\
  \ handler 是一种特定类型的任务，只有在被另一个任务通知时才会运行。这种通知机制是条件性的，取决于通知任务是否对系统进行了更改。handlers 的定义与任务使用相同的语法，但被放置在\
  \ Ansible playbook 中名为 `handlers` 的独立部分。\n- **使用 handlers**：对于不希望不必要的重启或重载服务的场景，handlers\
  \ 是理想选择。例如，如果我们有一个更新配置文件的任务，我们可能只想在文件实际发生变化时才重启关联的服务。handlers 确保这些服务管理任务仅在需要时执行，使我们的自动化更高效并减少了服务中断的可能。\n\
  - **handlers 的工作**：\n    - **通知**：任务通过包含 handler 名称的 `notify` 指令来触发（通知）handler。该指令仅在任务导致更改时才会激活。例如，修改配置文件或安装新软件包。\n\
  \    - **幂等性**：handlers 维持了 Ansible 的幂等性，仅在需要时运行，并且在没有更改时不会影响系统状态。\n    - **执行顺序**：handlers\
  \ 在 playbook 中所有任务完成后运行，而不是在通知任务之后后立即运行。如果多个任务通知了同一个 handler，或者一个任务通知了多个 handler，Ansible\
  \ 确保每个 handler 在 playbook 结束时只运行一次。\n\n## 定义和使用 handlers\n\n以下是一个简单的示例，说明了如何在 Ansible\
  \ playbook 中定义和使用 handlers：\n\n```yaml\n- name: Example playbook with handlers\n\
  \  hosts: web_servers\n  tasks:\n    - name: Update web server configuration\n \
  \     ansible.builin.template:\n        src: templates/nginx.conf.j2\n        dest:\
  \ /etc/nginx/nginx.conf\n      notify: Restart nginx\n  handlers:\n    - name: Restart\
  \ nginx\n      service:\n        name: nginx\n        state: restarted\n```\n\n\
  在示例中，一个任务使用 `template` 模块更新 NGINX 配置文件。如果任务导致文件更改（例如，如果自上次运行以来模板内容已更新），它会通知 `Restart\
  \ nginx` handler。该 handler 定义在 `handlers` 部分下，然后重启 NGINX 服务。\n\n## 多个 handlers\n\
  \n单个任务或 playbook 中的多个任务可以触发多个 handlers。handlers 在 playbook 执行的末尾执行，执行顺序源于它们被通知的顺序，但即使被通知了多次，每个\
  \ handler 也只运行一次。\n\n以下是如何在 Ansible playbook 中触发多个 handlers 的方法：\n\n在 playbook 的\
  \ `handlers` 部分中定义 handlers。在任务中使用 `notify` 指令来触发一个或多个 handler。\n\n以下示例 playbook\
  \ 显示了如何触发多个 handlers：\n\n```yaml\n- name: Example playbook to trigger multiple handlers\n\
  \  hosts: all\n  become: true\n  tasks:\n    - name: Install nginx\n      ansible.builtin.yum:\n\
  \        name: nginx\n        state: latest\n      notify:\n        - Start nginx\n\
  \        - Enable nginx\n    - name: Update nginx configuration\n      ansible.builtin.copy:\n\
  \        src: /path/to/new/nginx.conf\n        dest: /etc/nginx/nginx.conf\n   \
  \     owner: root\n        group: root\n        mode: '0644'\n      notify:\n  \
  \      - Reload nginx\n  handlers:\n    - name: Start nginx\n      ansible.builtin.service:\n\
  \        name: nginx\n        state: started\n    - name: Enable nginx\n      ansible.builtin.service:\n\
  \        name: nginx\n        enabled: yes\n    - name: Reload nginx\n      ansible.builtin.service:\n\
  \        name: nginx\n        state: reloaded\n```\n\nhandlers 的最佳实践如下：\n\n- **描述性的\
  \ handler 名称**：为我们的 handlers 使用清晰且描述性的名称，使我们的 playbook 更于理解和维护。\n- **谨慎使用 handlers**：虽然\
  \ handlers 很有用，但应该谨慎使用。过度使用 handlers 会让我们的 playbook 更难调试和理解。\n- **Handler 的粒度**：设计我们的\
  \ handlers 尽可能细粒。例如，一个重启多个服务的单体 handler 比每个服务的服务的独立 handler 效率更低且影响更大。\n\nAnsible\
  \ handlers 是一种高级功能，使用正确时可以显著增强我们自动化任务的效率和可靠性。它们提供了一种响应配置更新来管理服务状态的方法，通过将 handlers\
  \ 集成到 Ansible playbook 中，我们可以对受管理的环境实现更精细的控制，使我们的基础设施自动化既强大又精准。\n\n\n\n\n# 在此剧本中：\n\
  \n第一个任务使用 `ansible.builtin.command` 模块检查是否已安装所需版本的软件包，并将结果注册到 `package_check` 变量中。该任务配置为忽略错误（ignore_errors），这确保了即使未找到软件包，\
  \ playbook 也会继续执行。\n\n第二个任务负责安装指定版本的软件包。然而，它仅在满足 `when` 条件时才会执行，即当第一个任务的返回码（`rc`）指示系统中未找到该软件包版本（`package_check.rc\
  \ != 0`）。\n\n条件任务具有以下几个关键优势：\n\n- **高效率**：通过仅在需要时执行任务，Ansible 可以减少运行时间并避免对系统进行不必要的更改，从而保持其稳定性。\n\
  - **灵活性**：条件判断允许单个 playbook 处理广泛的场景，根据目标系统的状态或外部输入调整其行为。\n- **幂等性**：使用条件任务可以更容易确保\
  \ playbook 具有幂等性，即可以运行多次而不会产生意外影响。它们有助于防止执行不必要的更改系统状态的操作。\n\n条件任务是 Ansible 中的一项强大功能，显著增强了自动化工作流的智能性和适应性。通过根据动态条件做出决策，Ansible\
  \ playbook 能够轻松管理复杂的部署和配置，确保操作根据上下文高效且恰当地执行。无论我们是经验丰富的系统管理员还是 DevOps 新手，掌握 Ansible\
  \ 中的条件任务都是一项极具价值的技能，将帮助我们从 IT 环境中充分利用自动化的全部潜力。\n\n## 处理任务失败\n\nAnsible 中的 `ignore_errors`\
  \ 指令是一把双刃剑。虽然它允许 playbook 在任务失败后继续执行，但过度使用或误用可能会掩盖关键失败，导致意想不到的后果，并可能掩盖我们基础设施中的重大问题。应当审慎使用该指令，并对其影响有清晰的理解。\n\
  \n处理处理实用策略如下：\n\n- **选择性使用 `ignore_errors`**：不应一律应用，而应有选择地使用 `ignore_errors`，即在特定任务的失败不会严重影响\
  \ playbook 整体成功的情况下。这种方法在保持 playbook 韧性的同时，确保只忽略非关键错误。以下是一个示例：\n\n```yaml\n- name:\
  \ Run dnf update\n  ansible.builtin.command: dnf update\n  ignore_errors: true\n\
  ```\n\n- **使用 `ansible_check_mode` 进行条件忽略**：一种更细致的方法结合 `ansible_check_mode` 使用 `ignore_errors`。这允许仅在\
  \ playbook 检查期间忽略错误，从而在不执行更改的情况下对潜在问题进行更安全的评估。以下是一个示例：\n\n```yaml\n- name: Run dnf\
  \ update in check mode\n  ansible.builtin.command: dnf update\n  ignore_errors:\
  \ \"{{ ansible_check_mode }}\"\n```\n\n- **注册错误以便后续评估**：通过使用 `register` 指令配合 `ignore_errors`，我们可以捕捉任务输出，包括任何错误或失败。这些信息稍后可以分析，以理解错误的性质并决定适当的纠正措施。以下是一个示例：\n\
  \n```yaml\n- name: Run dnf update and register output\n  ansible.builtin.command:\
  \ dnf update\n  ignore_errors: true\n  register: ignore_errors_register\n```\n\n\
  - **使用 `failed_when` 定义特定条件**：对于什么构成失败有更细粒度的控制，可以使用 `failed_when` 来定义特定条件。这种方法允许对错误进行精确处理，确保只有某些条件被视为失败，从而避免无意义的\
  \ playbook 执行。以下是一个示例：\n\n```yaml\n- name: Disable apport\n  become: true\n  ansible.builtin.lineinfile:\n\
  \    line: \"enabled=0\"\n    dest: /etc/default/apport\n    mode: 0644\n    state:\
  \ present\n  register: default_apport\n  failed_when: default_apport.rc != 0 and\
  \ not default_apport.rc == 257\n```\n\n错误管理的最佳实践如下：\n\n- **选择性应用**：有选择地使用 `ignore_errors`，专注于失败不影响\
  \ playbook 整体执行的任务。\n- **错误评估**：利用 `register` 捕捉任务输出以便后续评估，实现可且可预测的错误处理。\n- **条件定义**：使用\
  \ `failed_when` 指定精确的错误条件，对 playbook 执行提供细粒度的控制。\n- **考虑检查模式**：利用 `ansible_check_mode`\
  \ 条件地忽略错误，在不冒实际执行风险的情况下增强 playbook 测试。\n- **持续审查**：定期审查并更新我们的 playbook 和错误处理策略，以适应不断的基础设施和需求。\n\
  \n有效的错误处理在 Ansible 自动化中至关重要，可确保任务可靠执行并有效管理基础设施。通过采用这些策略，我们可以增强自动化工作流的健壮性，确保它们在面对错误时具有弹性，并维护\
  \ IT 环境的完整性。\n\n## 创建 Ansible plays 和 playbooks\n\n创建 Ansible plays 和 playbooks\
  \ 是自动化各种 IT 基础设施任务的必备技能。Ansible plays 是针对清单中选定主机执行的有序任务集，旨在配置系统、部署软件和编排更复杂的 IT 流程。playbook\
  \ 是一个包含一个或多个 plays 的文件，为跨整个网络的自动化提供了蓝图。\n\n一个 Ansible play 是在从清单的一组主机上按顺序运行的任务集合。每个\
  \ play 指定了目标主机或主机组，以及一个要执行的任务列表。plays 允许我们将相关任务组合在一起，使我们的自动化更有组织、更易于管理。\n\n## 编写我们的第一个\
  \ playbook\n\nplaybook 是一个 YAML 文件，Ansible 通过解析它来应用配置、部署应用程序或编排跨不同系统的工作流步骤。\n\n\
  以下是一个包含单个 play 的 playbook 示例：\n\n```yaml\n---\n- name: Apache Web Server installed\
  \ and running\n  hosts: web\n  tasks:\n    - name: Apache installed\n      ansible.builtin.yum:\n\
  \        name: httpd\n        state: present\n    - name: Apache running\n     \
  \ ansible.builtin.service:\n        name: httpd\n        state: started\n      \
  \  enabled: true\n```\n\n在此 playbook 中：\n\n- `hosts`: 指定了 play 目标主机组（web）。\n- `tasks`:\
  \ 列出了 play 在目标主机上执行的操作。示例中它使用 `yum` 模块安装 Apache 并确保 Apache 服务启动且开机自启。\n\n创建 playbook\
  \ 的最佳实践包括：\n\n- **使用描述性名称**：对描述进行任务性命名使我们的 playbook 更于理解和维护。\n- **模块化设计**：将复杂的程序拆分为一个\
  \ playbook 中的多个 plays，或将其分成不同的 playbook，以增强可读性和重用性。\n- **版本控制**：将我们的 playbook 存储在版本控制系统中以跟踪更改并与他人协作。\n\
  - **幂等性**：编写任务使其能够安全地运行多次，而不会对系统状态产生预期之外的影响。\n- **错误处理**：实现错误处理并使用条件判断，使我们的 playbook\
  \ 更加健壮且具有容错能力。\n\n通过遵循这些指南并将提供的示例作为模板，我们可以开始构建自己的 Ansible plays 和 playbooks，以自动化整个\
  \ IT 环境中的任务，提高效率和可靠性。\n\n## 错误处理\n\n\n\n\n\n在 Ansible 中配置错误处理对于创建健壮且容错的自动化工作流至关重要。Ansible\
  \ 提供了多种机制来有效管理任务失败，确保我们的 playbook（剧本）能够优雅地处理错误，并根据需要执行恢复或清理任务。\n\n## Blocks, rescue\
  \ 和 always\n\nAnsible 允许我们使用 `blocks` 将任务进行分组，并在这些块中，我们可以指定 `rescue` 和 `always`\
  \ 部分来管理错误。这种结构类似于许多编程语言中的 `try-catch-finally`，如下所示：\n\n- `block`: 定义要执行的主任务。\n-\
  \ `rescue`: 指定当块中的任何任务失败时，应该运行的任务。\n- `always`: 包含无论块中的任务成功与否都会运行的任务。\n\n考虑以下示例：\n\
  \n```yaml\n- name: Demonstrating error handling\nhosts: all\ntasks:\n  - block:\n\
  \      - name: Attempt to execute a task\n        ansible.builtin.command: /path/to/successful/command\n\
  \      - name: Another task that depends on the success of the previous task\n \
  \       ansible.builtin.command: /path/to/another/successful/command\n  rescue:\n\
  \      - name: This task runs if any task in the block fails\n        ansible.builtin.command:\
  \ /path/to/rescue/command\n  always:\n      - name: This task always runs, regardless\
  \ of previous successes or failures\n        ansible.builtin.debug:\n          msg:\
  \ \"This is the cleanup or logging task.\"\n```\n\n在示例示例中：\n- 首先尝试执行 `block` 下的任务。如果两个命令都执行成功，Ansible\
  \ 将移动到 `always` 部分。\n- 如果 `block` 中的任何任务失败，Ansible 将不会执行该块中的剩余任务，而是将移动到 `rescue`\
  \ 部分执行那些任务。\n- 在执行完 `rescue` 部分（如果需要）或如果块中没有失败后，Ansible 将执行 `always` 部分中的任务。\n\n\
  这种结构对于复杂的部署或更新特别有用，在这些情况下，我们需要确保要么所有任务都成功完成，要么在发生失败时执行适当的补救措施，并且在种情况下发生清理操作或日志记录，如下：\n\
  \n- **处理不可达的主机**：Ansible 2.7 引入了 `ignore_unreachable` 关键字，允许我们忽略由不可达主机引起的失败。这在我们希望即使某些主机不可达，playbook\
  \ 也能继续在其他主机上运行任务的场景中非常之用。\n- **使用 ignore_errors**：可以使用 `ignore_errors` 指令在发生失败的情况下继续执行。当预期的某个任务在某些条件下会失败，或者我们希望手动处理失败而不停止\
  \ playbook 执行时，这特别有用。\n\n## 高级错误处理策略\n\n对于一个更复杂且更真实的示例，Red Hat 的 Enable Sysadmin\
  \ 提供了一个 playbook，它通过 `block`、`rescue` 和 `always` 部分说明了高级错误处理。该 playbook 在主块中包含了角色角色和任务，并使用\
  \ `rescue` 部分来累积失败。`always` 部分收集并分类结果，允许对所有节点的任务执行结果进行详细报告。这种方法确保了全面的错误处理策略，不仅能够实现错误恢复，还能进行详细的状态报告。\n\
  \n通过利用这些错误处理功能，我们可以让 Ansible playbook 更加健壮，并能够适应各种失败场景，增强我们自动化工作的可靠性。有关更多详尽信息和示例，请参阅\
  \ Ansible 关于 blocks 和 playbook 错误处理的文档。\n\n## 测试 playbook\n\n测试 playbook 通常涉及验证在目标主机上是否实现了\
  \ playbook 中定义的预期状态。这可以通过断言（assertions）甚至通过设计一个二级 playbook 来检查第一个 playbook 的结果来实现。为了说明这一点，考虑有一个安装并启动\
  \ Web 服务器的 playbook。要测试这个 playbook，你可以编写一个二级 playbook 向 Web 服务器发送请求，或者检查服务是否在目标主机上运行。\n\
  \n以下是一个简单的示例：\n\n- **主 playbook (webserver-setup.yml)**：此 playbook 在目标主机上安装并启动 Apache。\n\
  \n  ```yaml\n  - name: Install and start Apache\n    hosts: web_servers\n    become:\
  \ true\n    tasks:\n      - name: Install Apache\n        ansible.builtin.yum:\n\
  \          name: httpd\n          state: present\n      - name: Start Apache\n \
  \       ansible.builtin.service:\n          name: httpd\n          state: started\n\
  \        notify: restart apache\n    handlers:\n      - name: restart apache\n \
  \       ansible.builtin.service:\n          name: httpd\n          state: restarted\n\
  \  ```\n\n- **测试 playbook (test-webserver.yml)**：此 playbook 检查 Apache 是否已安装并运行。\n\
  \n  ```yaml\n  - name: Test Apache Installation and Running Status\n    hosts: web_servers\n\
  \    become: true\n    gather_facts: false\n    tasks:\n      - name: Check if Apache\
  \ is installed\n        ansible.builtin.command: rpm -q httpd\n        register:\
  \ rpm_query\n        failed_when: rpm_query.rc != 0\n      - name: Ensure Apache\
  \ is running\n        ansible.builtin.service:\n          name: httpd\n        \
  \  state: started\n  ```\n\n\n\n\n\n`vlan_id`: \"{{ vlan_id }}\"\n\n`name`: \"{{\
  \ vlan_name }}\"\n\n此 playbook 将针对分组在交换机下的主机，通过跳过事实收集来加快执行速度，并根据提供的变量 `vlan_id`\
  \ 和 `vlan_name` 配置 VLAN。\n\n## 最佳实践\n\n*   幂等性（Idempotency）：编写任务时使其能够安全地多次运行，而不会在预期结果之外更改系统状态。\n\
  *   变量使用：对于可能在环境之间或随时间变化的值使用变量，例如包名、版本或网络配置。\n*   错误处理：使用 `block`、`rescue` 和 `always`\
  \ 结构包含错误处理，以优雅地管理失败。\n*   任务模块化：将复杂的配置拆分为更较小的任务，并使用角色（roles）在不同的 playbook 中实现可复用。\n\
  \n通过遵循这些指南并利用 Ansible 丰富的模块库，我们可以高效地开发 playbook，确保我们的系统按照需要精确配置，从而维护整个基础设施的一致性和可靠性。\n\
  \n## 结论\n\n本章旨在为寻求通过自动化（特别是使用 Ansible）来提升 Linux 系统管理技能的人士提供宝贵的资源。它是通向 RHCE 认证的重要跳石。\n\
  \n下一章将重点关注利用 Ansible 模块以及通过角色和集合进行代码复用以自动化 IT 运营。学习 Ansible 的安装和配置、管理 Linux 和 Windows\
  \ 节点、利用 Ansible vault 进行安全自动化、使用 Ansible Navigator 工具以及企业级 Ansible Automation Platform，为实施更高级的自动化策略奠定基础。\n\
  \n## 知识点回顾\n\n*   幂等性：确保 Ansible 中的任务编写为幂等的，这意味着它们可以多次运行而不会对系统状态引起意外的更改。这有助于维护环境间的一致性。\n\
  *   变量管理：在 playbook 和角色中有效使用变量。在适当的范围内定义变量并遵循命名规范以避免冲突并提高可读性。\n*   错误处理：使用 `blocks`、`rescue`\
  \ 和 `always` 部分实现健壮的错误处理。这种方法确保错误得到优雅地管理，允许恢复操作并维持 playbook 的执行流。\n*   模块化 playbook\
  \ 设计：将复杂的配置拆分为更较小的、可复用的任务和角色。这种模块化方法改进了 playbook 的维护性并允许更好的组织。\n*   循环和条件语句的使用：利用循环遍历项目以减少代码冗余，并使用条件语句（使用\
  \ `when` 语句）仅在满足特定条件时执行任务，增强 playbook 的效率和灵活性。\n*   处理器（Handler）的利用：应谨慎使用处理器并将其设计得尽可能细化，确保仅在需要时重启或重载服务，从而最大限度地减少干扰。\n\
  \n## 单选题\n\n1. 我们如何对一组主机执行简单任务？\n    1. Ansible ad hoc\n    2. Ansible playbook\n\
  \    3. Ansible inventory\n    4. Ansible conditional\n2. 连接 Windows 目标的优选方式是什么？\n\
  \    1. OpenSSH\n    2. Python Paramiko\n    3. WinRM\n    4. 远程桌面\n3. 哪个语句可以将执行结果保存到变量中？\n\
  \    1. `vars`\n    2. `register`\n    3. `when`\n    4. `notify`\n4. 我们如何实现 try-catch-finally\
  \ 块？\n    1. `ignore_errors`\n    2. `ansible_check_mode`\n    3. `failed_when`\n\
  \    4. `blocks-rescue-always`\n\n## 答案\n\n1. a\n2. c\n3. b\n4. d\n\n## 思考\n\n1.\
  \ 如何增加 Ansible playbook 执行期间打印的调试信息？\n2. Ansible 中不允许使用哪些变量名？\n3. 测试 playbook 最简单的方法是什么？\n\
  4. 如何在 Ansible 中实现错误处理？\n\n## 核心术语\n\n*   `WinRM`：此协议用于 Windows 服务器和桌面的远程管理，实现安全的通信和命令执行。\n\
  *   `Agentless`（无代理）：在 Ansible 中，无代理是指无需在远程系统上安装任何额外软件即可管理这些系统的能力。\n*   `Controller\
  \ node`（控制节点）：安装 Ansible 的中心机器，从中编排其他系统上的自动化任务。\n*   `Target nodes`（目标节点）：称为托管节点，是\
  \ Ansible 从控制节点配置和管理的远程系统。\n*   `Idempotency`（幂等性）：确保在托管节点上多次运行同一个 playbook 会产生相同的结果，避免意外更改。\n\
  *   `Ansible playbook`：YAML 文件，使用 Ansible 任务描述系统的预期状态。\n*   `Module`（模块）：Ansible\
  \ 中离散的代码单元，由 playbook 任务调用。\n*   `Inventory`（清单）：Ansible 中主机和组的集合，在其中执行配置任务。\n*\
  \   `Task`（任务）：定义要执行的单一程序的块，例如安装包。\n*   `Role`（角色）：一种封装自动化内容并使其可复用的方法。\n\n加入我们书籍的\
