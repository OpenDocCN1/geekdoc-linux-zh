  3. RHCSA 认证有哪些职业机会？\n4. RHCE 认证有哪些职业机会？\n5. 如何验证 RHCE 认证？\n6. 对于希望在 RHCE 之外提升红帽技术专业水平的专业人士，未来的路径是什么？\n\
  ### 关键术语](#contents.xhtml_sc2_22a)\n\n\n\n\n- `RHCSA`: RHCSA 认证验证了在 Red Hat Enterprise\
  \ Linux 环境中熟练执行系统管理任务的核心技能和知识。\n- `RHCE`: RHCE 认证证明了使用 Red Hat Ansible 管理多个系统的高级熟练程度，具备在不同系统中执行常见系统管理任务的能力，并是通往成为\
  \ `RHCA` 的基础步骤。\n- `RHCA`: RHCA 证书代表了红帽技术专家水平的巅峰，展示了对从 Linux 管理、开放混合云解决方案到 DevOps\
  \ 实践和电信云转型的等多个领域的全面掌握。\n- `KIOSK`: Red Hat KIOSK 是一个完全合格的红帽测试中心地点，可以在此处进行线下考试，包括\
  \ `RHCE` 考试在内。\n- `Remote exam`: 红帽远程考试允许候选人在遵守特定要求和协议的前提下，使用安全的在线平台从其所在地远程参加考试（例如\
  \ `RHCE` 考试）。\n***\n\n1 [`www.itjobswatch.co.uk/jobs/uk/rhce.do`](https://www.itjobswatch.co.uk/jobs/uk/rhce.do)\n\
