    ## 4.7. KDE 的高级用法


    ### 查看网页、下载文件


    要查看网页，只需在 KFM 的栏中输入该页面的 URL 即可！


    同样，你可以通过输入 `ftp://ftp.linux-mandrake.com` 来访问 MandrakeSoft FTP 站点。默认情况下，KFM 会与该站点建立匿名连接。如果你在
    FTP 站点上有一个有效账户，可以通过输入如下格式的地址 `ftp://username@ftp.domaine.extension` 来使用你的登录。KFM
    将提示你输入密码。


    ### 在启动时启动程序


    有一种启动启动程序的通用方法：修改 `~/.bash_profile` 和 `~/.xinitrc` 文件。幸运的是，在 KDE 下，你只需要将想要启动的程序链接放置在桌面上显示的
    StartUp 目录中。


    ### 挂载磁盘驱动器或 CD-ROM 驱动器


    桌面上两个快捷方式，一个指向磁盘，另一个指向 CD-ROM 驱动器。


    通常，为了访问格式化为 ext2（Linux 的标准文件格式）或 CD-ROM 的磁盘信息，你必须挂载相应的驱动器。


    如果磁盘是 DOS 格式，请使用 mtools。输入 `man mtools` 获取有关该主题的更多详情。众所周知 DOS 命令前带有字母 m。简而言之，你应该输入
    `mdir a:` 来显示磁盘内容。一些相关命令包括：`mdir`、`mformat`、`mcopy`、`mdel`。


    挂载磁盘（或 CD-ROM），输入命令 `mount /mnt/floppy`（或 `mount /mnt/cdrom`）。如果你像通常那样频繁更换磁盘或
    CD-ROM，这会相当繁琐。实际上，如果驱动器未卸载，你就无法移除 CD-ROM。


    在 Linux-Mandrake 中，默认情况下，这两个快捷方式让生活变得简单。只需单击，即可挂载磁盘或 CD-ROM。相应的图标上会出现一个绿色小方块，提醒你驱动器已挂载。要卸载驱动器，用鼠标右键点击并选择“unmount”（卸载）。操作如此简单！


    ## 第 5 章


    ## KDE 程序


    ### 5.1 文本编辑器


    KDE 标准配备了 2 个文本编辑器：kedit 和 kwrite。你可以在 K 菜单的“应用程序”下找到它们。


    kedit 是一个小型文本编辑器，允许你以简单的方式输入短文本或编辑配置文件。你可以直接在 FTP 服务器或 Web 上编辑消息。只需在“打开”（Open）菜单的放置提示符处指定对应的
    Internet 站点和文件名（例如：`ftp://ftp.linux-mandrake.com/Welcome.msg`）。


    kwrite 是一个与上一个相似的编辑器，但功能更强大。特别是，它允许你根据文档类型修改文本使用的颜色。例如，打开文档 `/.bash_profile`。它以统一样式显示。在“选项”（Options）菜单中，选择“激活高亮”（Activate
    highlighting）然后选择 Bash（.bash_profile 文件是用 Bourne-shell 编写的）。文本样式会立即更改：


    注释为*斜体*，函数以**粗体**显示。还有其他各种有趣的模式，如 HTML 或 C。当你编辑长文件时，还有另一个有趣的功能，它允许你在文件的某些行上放置标记。要进行此操作，请选择“添加标记”（Add
    in the Markers）菜单。虽然它提供的功能没有 Emacs 那么多，但 `kwrite` 对你可能非常有用；因此，请不要犹豫使用它！


    ### 5.2 图像编辑程序


    KDE 提供了若干图形工具，补充了你在 *Linux-Mandrake* 发行版其他地方找到的工具。


    名为 KSnapShot 的屏幕捕捉工具允许你进行截屏！它允许你对整个屏幕或仅对光标所在的窗口进行复制。


    如果你在 KDE 提供的图标集中找不到想要的图标，图标编辑器将让你创建自己的图标。该程序看起来像一个经典的绘画工具。背景是网格。实际上，图标通常是尺寸严格定义的（32×32
    像素）绘画。网格的存在是为了帮助你保持这个尺寸。


    Paint 程序是一个比任何其他程序都简单的绘画程序。释放你的想象力吧！


    ### 5.3 使用互联网！


    Linux 是在互联网上产生的，*KDE* 也是。因此，它包含了连接世界维网所需的工具。在“互联网”（Internet）菜单中，你将找到一个邮件查看器、一个新闻查看器、一个用于连接自己的拨号器以及用于其他互联网服务的工具（IRC,
    telnet, archie）。


    ### 使用 kppp 拨号器


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_60_0.png)


    在连接互联网之前，你必须设置你的连接1。启动拨号器，然后选择“配置”（Configuration）。在第一个选项卡中点击“新建”（New）。为你的连接命名，然后填写电话号码。如果你不想每次输入密码，可以勾选“保存密码”（Save
    password）。不要修改其他内容，转到 IP 选项卡，在 DNS 选项卡的“域”（Domain）部分，输入你的 ISP 地址（例如：aol.com）。点击“添加”（Add）。如果你想利用
    kppp 管理功能，点击 PPP 选项卡并选择你的国家。退出时，点击“确定”。在调制器窗口中，你可以设置你的调制器。如果是外部调制器，请选择 `/dev/cux`（x
    代表串口端口）。例如，如果你的调制器连接到 COM1，选择 `/dev/cu0`。反之，如果你的调制器是内置的，选择 `/dev/ttyS0`。不要更改其他参数。点击调制器选项卡后，调制器和
    PPP 选项卡可以验证设置是否正确。调制器和 PPP 选项卡通常不需要修改。图表（Graph）选项卡允许你查看输入和输出速率，供你上网！


    这一切假设你有一个互联网服务提供商（ISP）的账户！此外，你的调制器不能是为 Windows 设计的。如果是，它在 Linux 下将无法工作。如有任何问题，请咨询你的服务提供者获取更多信息。


    ## 5.4 管理系统


    ### 邮件查看器 Kmail


    Kmail 是一个高性能、易于使用的邮件查看器。当你首次启动它时，将打开一个窗口允许你输入账户的各种参数：名称、电子地址、签名文件。“网络”（Network）选项卡允许你选择用于收发邮件的连接类型。对于初学者，不建议使用
    Sendmail。点击 SMTP 并指定你邮件服务器的地址。如果你使用 Sendmail，你需要设置一个本地箱；否则使用 POP3 邮箱。对于后者，你只需要填写由
    ISP 提供的详情即可。设置过程中最重要的部分已经完成。剩余的选项卡涉及你邮件查看器的工程学。Kmail 拥有现代邮件查看器的所有功能：地址录、过滤器等……简单易用，它让你发现电子邮件的巨大益处！


    '
