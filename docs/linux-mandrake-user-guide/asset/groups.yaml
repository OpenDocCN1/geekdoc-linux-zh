    # 10 CHAPTER 2. INSTALLING LINUX-MANDRAKE


    with: base address= 0x340 irq=7, you won''t complete the installation successfully
    if you are unsure of these values.


    No Linux-Mandrake system is detected (CD-ROM, FTP, NFS, hard disk or SMB installation)


    This won''t happen with the PowerPack version of the CD-ROM. It may be the case
    that your CD-ROM, remote site (LAN or WAN) or Mandrake image is not expected by
    the installation procedure.


    The procedure stops during the installation of packages


    Check that the size of the partition you''re using is bigger than the required
    size. It is not recommended to install Linux-Mandrake on a partition smaller than
    300 MB (unless you are not installing X Window).


    # You are unable to set up your video card


    This is a common problem (becoming less and less common!). Don''t panic, this
    will not (normally) prevent your Linux system from running. You will be able to
    set up the card configuration later, after the installation has been completed.


    # You are unable to set up your network card (it is not recognized by the system)


    This will not (normally) prevent your Linux system from running. You will be able
    to set up the card configuration later, after the installation has been completed.


    # 2.4. PROBLEMS—WHO TO CONTACT?


    # You are unable to set up your printer


    This will not prevent Linux system from running. You will be able to set up the
    card configuration later, after the installation has been completed.


    # You are unable to create your LILO boot floppy


    This is an annoying problem which should not occur with current Linux-Mandrake
    distributions. Pick up a new floppy and try again. In case of repeated failures,
    contact installation support.


    # You are unable to install LILO


    This is usually due to a detection problem with the hard disk structure. This
    should not happen with the latest BIOS releases. If it does, make a LILO boot
    floppy (as instructed) and use it to boot your Linux system. Then edit the file
    /etc/lilo.conf and insert the line "linear".


    For example, if your Linux partition is mounted on /dev/hda, you should have something
    like this:


    ```

    (...)

    boot=/dev/hda

    linear

    (...)

    ```


    Finally, reinstall LILO with the command /sbin/lilo.


    # You are not able to boot your old operating system


    This may occur if you didn''t manage to install LILO correctly. Try to reinstall
    LILO from a Linux system (see relevant sections in this manual). If you have Windows,
    use a DOS boot disk then type fdisk /mbr to use Windows.


    # 12 CHAPTER 2. INSTALLING LINUX-MANDRAKE


    You probably have a hardware problem (cpu, cache memory, memory, ...) or overheating.
    Deactivate your cache memory, ventilate your machine, move your memory to another
    slot. The last thing you can do is contact your retailer.


    # What can you do in case of a persistent problem?


    If you think you have tried all the above solutions, or if your problem is not
    listed, first consult the extensive documentation available on the Web (FAQ, archives
    of newsgroups with Dejanews...). The Mandrake site contains a large number of
    links to these documents as well as a general errata. Also consult the references
    listed at the end of this manual.


    You are invited to join the Linux-Mandrake mailing lists, where you can exchange
    views and discuss your problems. To subscribe, go to the Linux-Mandrake web site:
    http://www.linux-mandrake.com/.


    If this does not help either, it is perhaps time to use Mandrake installation
    support (fax or e-mail). Here are the steps to take:


    # Detailing the problem


    It is important to describe precisely the problem: when did the problem occur?
    can you reproduce it? what exactly is happening?


    > http://www.dejanews.com/


    # 2.4. PROBLEMS WHO TO CONTACT?


    It may be useful to swap between the "log consoles" in order to pick up additional
    information on the problem. You can swap between the consoles with the Alt+F3,
    and alt+F4 key combinations. Write down the last 4 lines.


    Then state your problem, in a clear and precise way, using the above information.


    # Contacting the Mandrake installation technical support


    First of all, you need to register. Follow exactly the instructions written on
    the registration card, included in Mandrake PowerPack box. You will receive a
    registration confirmation containing necessary instructions for getting in touch
    with technical support.


    Be aware that the quality of the answer from technical support is linked to the
    accuracy of your problem. If you wish to have more support, you will have to subscribe
    to an additional support contract.


    Then wait...


    The delay could be 20 minutes or 24 hours, depending on the workload and on the
    complexity of your problem. To benefit from such support, connect to the site
    http://www.linux-mandrake.com/index.html and read the information in the "extended
    support"


    # Chapter 3 Setting up Linux


    Once you have installed your Linux system, you may need to carry out a bit of
    fine tuning: for example, if you didn''t manage to install your video card or
    printer... You can also configure the services ("daemons") which run on your system.
    You have all the time to make these changes, once Linux has been installed.


    # 3.1 Reinstallation/configuration of LILO (Loader)


    If you have to reinstall LILO for reason or other, you need the /etc/lilo.conf
    file which describes the parameters of all the disks on your system that are recognized
    by Linux. If the installation of LILO failed during installation, you will need
    to recreate this file. To do this, whilst root user, use an editor (kedit, sed,
    emacs, vi...) and edit /etc/lilo.conf. For example, with kedit, type kedit /etc/lilo.conf.


    Let''s look at an example: your system contains a Linux and DOS system on two
    partitions of your principal disk (/dev/hda). Here is the configuration file /etc/lilo.conf
    to create (for kernel 2.0.36):


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=50

    image=/boot/mlinuz

    label=linux

    root=/dev/h1

    read-only

    other=/dev/hda

    label=dos

    ```


    Of course, you can modify these parameters according to your disk configuration
    (SCSI disks, several disks, etc.). To reinstall LILO from your new file /etc/lilo.conf,
    simply type /sbin/lilo. You will have a message similar to:


    Added linux (this will be the system loaded by default)

    Added dos


    If you are not sure whether you are in "root", type su. A root generally starts
    with the # character.


    # 16 CHAPTER 3. SETTING UP LINUX-MANDRAKE


    # 3.2 Installing your mouse


    If you need to reinstall your mouse once the installation is finished, use the
    mouseconfig utility in text mode. To do this, type mouseconfig in a "shell" (terminal
    emulator: kvt or xterm). If your mouse has only two buttons, use the third button.
    In effect, this third button (actually the middle button) enables to paste text
    between applications in X (having preselected the relevant part of the text with
    the left button).


    # 3.3 Installing your video card


    Under Linux, installing a video card has for long time been a perilous exercise
    as you have to edit a configuration file manually according to the parameters
    of the card concerned! Now this has been made much easier due several programs
    which enable you to create this file automatically: xf86config and Xconfigurator.


    In the majority of cases, using Xconfigurator is adequate but you may need to
    resort to xf86config, which is not as user-friendly.


    To start, you need to know:


    - 1. the type of card you''re using (for example: S3, i740, Matrox, etc.)

    - 2. if your card is compatible with Linux-Mandrake,

    - 3. the (approximate) characteristics of your monitor.


    # 18 CHAPTER 3. SETTING UP LINUX-MANDRAKE


    Any computer-hardware retailer can help you with the first question. For the second
    point, simply check the Linux-Mandrake site to see whether your card is compatible
    or not (the list is constantly updated). The third question is not necessarily
    essential: a modern screen can easily support 1024x768 @60Hz resolution or more
    in non-interlaced mode. Therefore you can enter the characteristics that are closest
    to those of your monitor.


    Now use Xconfigurator (type: Xconfigurator) and follow the instructions carefully.
    At worst, you will have to choose a VGA16 server which works with almost any card
    but at a very poor resolution.


    # 3.4 Setting up your network


    First of all, check if your network card is recognized by Linux. When you boot
    the system, one or more lines mentioning eth0 (for "Ethernet") should appear according
    to the hardware installed on your PC. Then, to configure your network, you can
    choose between linuxconf (under console or X Window) and netcfg (only under X
    Window).


    To run these programs, type linuxconf or netcfg in a shell (or right mouse→Execute
    a command). Both programs can also be launched in the K→non KDE Applications→System
    menu.


    The installation of an Ethernet card and setting up the network requires some
    specific knowledge: consult the comprehensive "HOWTOs" which cover this subject
    (all those HOWTOs are available on the Mandrake CD-ROM, in the /doc directory)
    and/or buy a book such as Linux Network

