    emulator: kvt or xterm).


    If your mouse has only two buttons, use Emulate the third button. In effect, this
    third button (actually the middle button) enables you to paste text between applications
    in X (having preselected the relevant part of the text with the left button).


    # 3.3 Installing your video card


    Under Linux, installing a video card has for a long time been a perilous exercise
    as you have to edit a configuration file manually according to the parameters
    of the card concerned! Now this has been made much easier due to several programs
    which enable you to create this file automatically: xf86config and Xconfigurator.


    In the majority of cases, using Xconfigurator is adequate but you may need to
    resort to xf86config, which is not as user-friendly.


    To start, you need to know:


    +   1. the type of card you''re using (for example: S3, i740, Matrox, etc.)


    +   2. if your card is compatible with Linux-Mandrake,


