    # 第 8 章

    # 系统管理


    ## 8.1 用户与组


    与其他操作系统不同，Linux 管理了安全问题，特别是用户组问题。


    在 Linux 中，有三类型的用户：你自己、你所属的组以及其他用户。机器上的每个用户都有自己的个人目录，该目录是 /home 的子目录。例如，如果你的登录名是
    fred，那么你的个人目录将是 /home/fred（你经常会看到缩写 ~ 表示你的个人目录）。这个符号会被 bash shell 识别。。唯一的例外是 root
    账户，它的目录是 /root。这种用户目录的概念允许你保护机密文件不被其他用户读取（只有超级用户可以访问所有个人目录）。


    然而，你肯定想与其他用户共享文档。这就是为什么 Linux 支持组。一组是一组用户。一个用户默认属于一个组，但也可以属于多个组。管理员必须使用相关软件组织这些组。通常，组是按功能创建的：一个用于会计服务的组，一个开发者的组等……


    ## 2.2 管理用户


    ### 创建账户


    由于你绝不能在 root 账户下工作，即使你的机器上只有你一个人，也应该至少创建一个用户。


    我们已经见过 adduser 命令，但幸运的是有图形化工具，特别是 linuxconf，我们将在此处对其进行概述。


    linuxconf 是一个非常完善的工具，允许你处理 Linux-Mandrake 配置文件。得于这个工具，用户账户的管理非常简单。作为超级用户，启动 linuxconf。左侧显示不同的模块，右侧显示当前模块。进入用户管理，然后进入用户账户。将显示当前用户列表。选择
    add（添加），然后填写各种字段（对于组，你可以选择用户、当前用户的默认组）。确认，就完成了！


    ### 特殊账户


    如果你编辑 /etc/passwd 文件（其中包含一个加密的密码列表）或 /etc/groups 文件（列出了不同的组），你会发现存在一些没有真实账户的用户，例如
    ftp 或 news。这些账户被称为特殊账户，它们被程序或守护进程用于执行其自身的操作。它们通常需要高于普通用户的权限，而正是为了避免使用 root 账户，才存在这些特殊账户。


    你可能永远不需要担心这些特殊账户。


    ## 8.3 程序管理 (RPM)


    Linux-Mandrake 使用 RPM 标准，即“Red-Hat 包管理器”，允许你轻松地管理程序。得益于 RPM，你只需挥手即可安装和卸载程序！RPM
    的真正强大在于它能够检查程序之间的依赖关系。因此，如果某个程序所需的某个库不存在，它将不允许安装该程序。


    对于 Intel 处理器及其兼容机，程序名称的结构如下：


    ```

    name.version.i386.rpm

    ```


    如果是源文件，你将在名称中找到 src。在 Linux-Mandrake 下，有两种管理 RPM 软件包的方法：命令行和 Kpackage 程序。不要忘记，只有
    root 用户才有权安装或卸载程序！


    ### 命令行上的 RPM


    RPM 程序配合选项用于管理你所有的 RPM 程序。命令行语法为：


    ```

    rpm -options program_name

    ```


    让我们看看可选的选项。


    ### 安装程序


    可以使用选项 -i 安装程序。例如，要安装 KLyX 程序，输入：


    ```

    rpm -ivh klyx-0.9a-f13.rpm

    ```


    你的程序已安装，并可以立即使用！选项 v（详细模式）和 h（进度）是可选的，允许让你看到安装进度。


    ### 更新程序


    要通过安装更新版本来更新程序，你应该使用 U 代替 i。这样一来，你所有的配置文件都会被保存。


    ### 卸载程序


    如果你想删除程序，请使用选项 e，例如：


    ```

    rpm -e program_name

    ```

    程序将被删除。


    ### 验证程序


    验证允许你检查文件是否存在。对于此，输入：


    ```

    rpm -V program_name

    ```


    ### 查询程序


    查询程序通常非常有用，例如为了了解其中包含的文件列表。使用：


    ```

    rpm -q program_name

    ```


    ### 其他选项


    你可以通过查阅帮助手册（man page）找到许多选项。--force 是相当危险的。


    ### Kpackage


    Kpackage 是允许管理程序的图形化工具。


    ## 8.4 安装过程


    ### 启动过程


    当你启动 Linux 时，内核会检查配置。它使用 dmesg 显示各种信息。然后它显示根系统。无法挂载该系统会导致著名的内核恐慌（Kernel Panic），从而停止计算机运行。


    第一个启动的进程是 init。它在启动时启动其他进程和大量的验证。在每个控制台上。


    ### 运行级别 (Runlevels)


    运行级别是一个特定的执行环境。Linux 允许你定义几个不同的环境。共有 7 个：


    - level 0：计算机关机。

    - level 1：单用户模式。仅用于特殊情况。

    - level 2：不通过 NFS 共享目录的多用户模式。

    - level 3：控制台模式下的正常运行级别。

    - level 4：未使用。

    - level 5：图形模式下的正常运行级别。

    - level 6：计算机重启。


    强烈建议不要将 3 或 5以外的任何运行级别设置为默认。在任何情况下，都不要将运行级别设置为 0 或 6：你将无法使用你的计算机！


    ### /etc/inittab 文件


    该文件包含根据你所在的执行级别要完成的任务列表。正常的运行级别是 3（控制台模式）或 5（图形模式）。/etc/inittab 文件的描述。


    它如下所示所示（不包含行号；形状可能根据你的配置而异）：


    ```

    # 默认模式：

    id:5:initdefault:

    # 系统初始化

    si::sysinit:/etc/rc.d/rc.sysinit

    10:0:wait:/etc/rc.d/rc 0

    11:1:wait:/etc/rc.d/rc 1

    12:2:wait:/etc/rc.d/rc 2

    13:3:wait:/etc/rc.d/rc 3

    14:4:wait:/etc/rc.d/rc 4

    15:5:wait:/etc/rc.d/rc 5

    ```


