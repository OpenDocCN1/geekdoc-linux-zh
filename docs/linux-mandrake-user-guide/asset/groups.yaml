  - '[PAGE 24]


    # 2.4. PROBLEMS–WHO TO CONTACT?


    which may be much more complicated to deal with. For each case, these are the
    correct steps to take:


    # Different problems that may occur (non exhaustive list)


    # You aren’t able to start the installation procedure


    Depending on the method of installation you use, there may be several reasons
    for this. If you are installing directly from a CD-ROM drive, check whether your
