    +   - three monitors: load of CPU, load of swap, load of memory;

    - the GNOME pager (will only work with compatible windows);

    - the clock.


    There are two different types of panels: lateral panels and corner panels. Lateral
    panels occupy one full side of the screen, however many launchers and applets
    you may have (lower panel). Corner panels occupy no space than is needed for the
    launchers and applets (top right panel). On the edge of these panels can be found
    two pointed buttons: they serve to mask the panel from one side to the other.


    The icons visible on the base window (the "desktop") are those of the GNOME file
