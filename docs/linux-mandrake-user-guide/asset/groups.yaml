    # 16 第 3 章 设置 Linux-MANDRAKE


    # 3.2 安装鼠标


    一旦你安装了 Linux 系统，你可能需要进行一些微调：例如，如果你没有成功安装你的显卡或打印机……你也可以配置运行在系统上的服务（守护进程）。一旦 Linux
    安装完成，你有足够的时间进行这些更改。


    # 3.3 安装显卡


    在 Linux 下，安装显卡长期以来一直是一项危险的任务，因为你需要手动编辑配置文件。现在由于几个能够自动创建文件的程序，这变得容易得多：xf86config
    和 Xconfig。


    大多数情况下，使用 Xconfigurator 是可以的，但你可能需要这些它。


    要开始，你需要知道：


    - 1. 你正在使用的卡类型（例如：S3, i740, Matrox,……）

    - 2. 你的卡是否与 Linux-Mandrake 兼容，

    - 3. 你的器的大致参数。


    任何计算机-硬件零售商都可以帮助你解决第一个问题。对于第二个点，只需检查 Linux-Mandrake 网站查看你的卡是否兼容（该列表不断更新）。第三个问题并不必要：现代显示器可以轻松支持非闪存模式。


    现在使用 Xconfigurator（输入：Xconfigurator）并严格遵循说明。最坏的情况下，你将选择一个 VGA16 服务器，它适用于几乎所有的卡但分辨率很低。


    # 3.4 设置网络


    首先，检查你的网卡是否被 Linux 识别。当你启动系统时，根据 PC 上安装的硬件，应该出现一行或多行提到 eth0（以太网）。然后，为了配置网络，你可以选择
    linuxconf（控制台或 X 窗口）和 netcfg（仅限 X 窗口）。


    要运行这些程序，在 shell 中输入 linuxconf 或 netcfg（或右键单击→执行命令）。这两个程序也可以在 K→非 KDE 应用程序→系统菜单启动。


    安装以太网卡和设置网络需要一些特定知识：咨询全面的 HOWTOs，它们涵盖了该主题（所有 HOWTOs 都在 Mandrake CD-ROM 上，位于 /doc
    目录）以及/或购买一本如 Linux Network 的书。'
