    ## 6.4 启动器


    你也可以直接在桌面上添加启动器（右键点击 $\rightarrow$ 新 $\rightarrow$ 启动器）。添加启动器的对话框显示如下：


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_77_0.png)


