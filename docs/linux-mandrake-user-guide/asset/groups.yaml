    此选项卡允许你设置机器名称以及与机器关联的网络接口（大多数情况下为以太网卡）。


    - 机器名称：

    如果你至少有一个网络接口，机器名称将是分配给该网络接口的完整名称（FQDN，完全限定域名），这是你在安装期间指定的指定的。如果你想更改名称，请确保它与你的某个接口关联时是一个有效名称。


    - 网络适配器配置：

    这是一个 Tulip 类型以太网卡的配置示例。如果你使用 DHCP 或 BOOTP 进行配置，则不需要输入 IP 地址或名称。如果你选择手动配置，应该输入与接口相关的
    IP 地址以及相应的名称，最后是一个别名。如果你使用 DNS（参见后文的 DNS 章节），机器名称必须与你的域名服务器匹配。


    除非你无法根据 IP 地址（参考其类别）推算出网络掩码，否则不要输入网络掩码。如果不是，你的系统管理员完全可以给你指定的网络掩码。


    使用的网络接口取决于你的外设类型：为以太网卡选择 `ethn`，其中 `n` 对应编号（注意避免冲突），为 ARCnet 外设选择 `arcn` 等。


    你被允许控制特定此主机并与其本地网络主要连接相关的参数


    | 主机名 | 适配器 1 | 2 | 3 | 4 |

    |---|---|---|---|---|---|

    | | 已启用 | | | | |

