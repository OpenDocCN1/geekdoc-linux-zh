    The general form of each entry is:


    ```

    id:rstate:action:process

    ```


    - Id designates an identification number.

    - Rstate is a sequence of runlevel numbers. If you are in the runlevel of one
    of the numbers indicated, the line will be executed.

    - Action indicates if the process should be launched once, every time it dies
    (respawn), etc ....

    - Process designates the action to follow, often a script.


    Line 2 designates the default runlevel of the system.


    Warning: Linux-Mandrake now uses the program chkconfig to manage the runlevel.
    See below the paragraph dedicated to this program.


    ## 8.4. LINUX-MANDRAKE INSTALLATION


    Line 4 is particular. It launches the script rc.sysinit which has the role of
    checking the integrity of the file systems, activating swap, etc ....


    Lines 5 to 11 allow the launching of scripts that depend on the level of execution.
    The script launched is /etc/rc.d/rc with the runlevel as a parameter.


    Line 13 indicates that if you press Ctrl+Alt+Del simultaneously, then the system
    must restart immediately. This is a very dangerous option for a server machine.
    You can deactive the line by making it a comment.


    Lines 15 to 20 indicate that for runlevels 2 to 5, the program mingetty must be
    launched, which allows you to connect yourself. The respawn indicates that if
    the process dies (for example the exit command), it must be relaunched.


    Line 22 is used for runlevel 5 to offer you a graphical login procedure (the kdm
    program).


    It is not advised to modify the access to /etc/initab because you risk not being
    able to restart your computer! When you are in such a case, use the boot disk.


    ## The scripts /etc/rc.d/


    All the Linux-Mandrake installation scripts are contained in the directory /etc/rc.d/.
    We will now describe the procedures executed.


    ### /etc/rc.d/rc.sysinit


    This is the first script to be executed. It is launched once on start-up. From
    this script comes almost all the messages which you will see on booting.


    This script starts by indicating the value of the PATH variable which defines
    the path of access to programs. Then, the program will search for the network
    configuration. If the network exists, it executes the network script (/etc/sysconfig/network);
    otherwise, it indicates to the system that there is no network and therefore the
    name of the machine will be localhost.


    Then the swap partition is activated. The HOSTNAME variable is displayed on the
    screen. If the NIS service is used, it is set up. The system proceeds to check
    the partitions (fsck -V -a $fsoptions / command). What follows allows the management
    of the start-up process if the partition is damaged. Finally, the management of
    quotas is activated.


    The script will configure your PNP cards. Then will launch all the programs which
    you have in the form of modules. All the partitions are then mounted and verified.


    Numerous files are deleted by the boot process (rm -f command) before the system
    configures the computer time. The activation of serial ports is the next step.


    The last part consists of instructions that are specific to Linux-Mandrake and
    that are executed when you first start up.


    ```

    /etc/rc.d/rc

    ```


    The program rc is designed to make scripts easier to launch according to the runlevel.
    This script is therefore quite short. It obtains the current runlevel in order
    to launch the necessary scripts. If the runlevel is x, then all the scripts of
    the directory /etc/rc.d/rcx.d are executed.


    ### /etc/rc.d/rcx.d/


    The scripts of the directory rcx are executed according to the runlevels. The
    contents of the rcx.d directories are very particular because these directories
    contain links to the services that are usable on your computer (contained in /etc/rc.d/init.d).
    If the name of the link begins with a K, the process is *Killed*;; otherwise,
    it is *Start*.


    We will take the example of the links of the directory rc0d. They are executed
    when the machine is stopped. Therefore you can see that all the services are stopped,
    except for the halt service.


    The contents of these directories can be changed by using the program ksysv.


    ### /etc/rc.d/init.d/ and the management of services


    This directory contains links to the services that are usable on your computer.
    If the name of the link begins with a K, the process is *Killed*;; otherwise,
    it is *Start*.


    We will take the example of the links of the directory rc0d. They are executed
    when the machine is stopped. Therefore you can see that all the services are stopped,
    except for the halt service.


    The contents of these directories can be changed by using the program ksysv.


    ## The program chkconfig


    The chkconfig program is used to manage the runlevels. There are five functions:


    - add new services

    - remove services

    - display information on current state

    - change the configuration of start-up

    - check


    ## The files .bashrc and .bashprofile


    On connection, a shell, called the login shell, is attributed to you. The bash
    shell is the most widespread. The files /etc/profile and ~/.bash_profile concern
    global configuration and personal files respectively. They serve to define functions
    and aliases.


    To configure an alias, for example, add a line of:


    ```

    alias ll=''ls -l''

    ```


    in your .bashrc file. In this way, you replace the ls -l command, which is fairly
    complicated to type every time, with the ll command, which is shorter. To activate
    the modifications type source ~/.bashrc and validate with the Enter key, or otherwise,
    the modifications will be activated when you next connect.


    Warning: do not choose names that could represent commands which already exist
    in the Linux system.


    To personalize .bash_profile, you should act similarly. For example, if you have
    installed Blender in a directory, let''s say, /usr/local/blender/, you should
    modify the file .bash_profile. Here is an example:


    ```

    PATH=$PATH:$HOME/bin

    ENV=$HOME/.bashrc

    USERNAME="fred"

    BLENDERDIR=/usr/local/blender

    (..)

    export USERNAME ENV PATH BLENDERDIR

    ```


    ## 8.5 Using linuxconf


    linuxconf is a configuration utility for which the philosophy is to bring together,
    under the same interface, all the configuration of a Linux system. It may be that
    you don''t find it to your liking (in other words, no tab for the program you
    want to configure) but this can be resolved: it is possible to extend linuxconf
    in a modular fashion, and therefore create-or find-the module that you need.


    In its current state of development, linuxconf can already do a lot of things,
    and unless you are an experimented user or administrator, you will certainly find
    everything that you would like to configure, and more besides.


    linuxconf is also independent of the environment you are using; there exists an
    interface for console mode (text mode), an HTML interface and a graphical interface.
    The latter is the one used here. All that will be said can be applied to the other
    two interfaces.


    The graphical interface looks like this.

