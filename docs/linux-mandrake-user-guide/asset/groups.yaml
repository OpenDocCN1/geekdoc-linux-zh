    ## 6.3. DRAG''N''DROP


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_74_0.png)


    A + sign will appear: this means that the item may be copied here. Release the
    button:


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_75_0.png)


    Now drag this same menu item that you have just copied onto the desktop into one
    of the panels: if it is a file of a suitable type, a launcher is created on the
    panel:


    ## 6.3. DRAG''N''DROP


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_76_0.png)


    You can also shortcut the passage by the desktop and directly drag a menu item
    onto a panel: the launcher is then created in the same way.


    ## 6.4 Launchers


    You can also add a launcher either directly on the desktop (right button click
    $\rightarrow$New $\rightarrow$launcher). The dialogue for the addition of a launcher
    is given in the following way:


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_77_0.png)


    The name of the launcher will be the name of the file created without the extension.
    The comment is the text which appears in the help bubble when the mouse pointer
    lingers over the top of the launcher. Finally, the command is that which one must
    type in the terminal to achieve the same result. In this case, the launcher will
    be a terminal where the top program runs.


    It should be noticed that GNOME uses Imlib, and therefore the icon associated
    with be of almost any known format. Also note that ticking the *Launch in a terminal*
    option for an X application is not as pointless as that: the standard output channel
    and the standard error channel are both redirected to


    ## 6.5 MORE ABOUT PANELS


    the terminal and it is in consequence easier, if not to debug the program, to
    capture error messages emitted.


    A right button click on the launcher will give you the opportunity of editing
    its properties, of moving it along the panel or even into another panel, or to
    remove it.


    ## 6.5 More about panels


    ### Manipulation with the mouse


    The action of the mouse in a given panel will differ according to whether you
    press the right or the middle button. If you press the middle button and keep
    it pressed, you can move it around the desktop at will. If you press the right
    button, you will have access to the global panel configuration parameters, as
    well as being able to add a launcher or an applet.


    ### Panel configuration parameters


    The parameters common to all the panels apply to animation, the icons associated
    with launchers, drawers, main menu and end of session and the modification of
    other parameters: help bubbles, property menus, global behaviour. The individual
    parameters for each panel apply to their position, their visibility and their
    appearance.


    ## 6.6 In conclusion


    Even if GNOME isn’t as successful as KDE at the moment, it has several redoubtable
    benefits: you can use the panels without a compatible window manager (and therefore
    customize your environment a little more), and its presentation is more enticing
    (although the corporate side of KDE appeals to certain people). But the lack of
    dedicated application is cruelly crippling.


    Both environments need a lot of memory (if you are not convinced, type M in a
    top...) and you should avoid running them on less powerful configurations. If
    your machine is powerful enough, the choice is yours!


    # Chapter 7


    # Introduction to Linux


    ## 7.1 Starting up and shutting down the system


    ### Start-up


    To boot Linux-Mandrake, you don’t have to do too much!

    If another system is already present in your computer or if LILO is installed,
    the latter will start, displaying:


    LILO:


    Hit the Tab key¹ to display a list of all possible systems. Logically, you should
    type linux to start your Mandrake system, unless you have given it a different
    name. If you hit the Enter key, the choice that was defined during installation
    will be launched, the same happening if you wait for more than five seconds. These
    parameters are modifiable under Linux in


    > ¹It is situated next to the Q key.


    the file /etc/lilo.conf. Refer to the chapter on LILO if you want to modify these
    parameters.


    You have perhaps chosen to use loadlin.exe under DOS or Windows Linux. In this
    case, it will be launched differently.


    ### The login procedure


    Linux is a multi-user system. In order to access the system, you have to be identified:
    this is called the login procedure.


    During the installation, you created a super-user account called root. At the
    login prompt, type root then type your password ("Password:"). We recommend that
    you use the second account that you created during the installation procedure
    (non-privileged user) for everyday use of the system.


    You are now logged on the root account. This account owns all the rights for the
    whole-system. It is an administration account for the computer and not a work
    account! You can therefore create again a user account, which will be your own.
    For this:


    `adduser login_name`


    where the login name will be a name that you have chosen (other than root). To
    create a password for this account, type:


    `passwd login_name`


    Should you need to access the root, use:


    `su`


    where the login name will be a name that you have chosen other than root.


    ## 7.1 STARTING UP AND SHUTTING DOWN


    ### Shutting down


    There are many ways in which you can shut down the system. The most common methods
    are:


    - 1. From the menu, select the System $\rightarrow$Shutdown.

    - 2. From the terminal, type `halt` or `reboot`.

    - 3. Press Ctrl+Alt+Del.


    What happens if the system is frozen? You may need to perform a hard reset.


    Wait, what happens if the system is halted? This operation can last several minutes.


    ## 7.2 Linux shells


    Once connected to the computer, you will see a prompt with the $ symbol. The program
    awaiting your instructions is the shell. Its role is to transmit your commands
    to the kernel.


    Here is a brief description of the different shells available:


    - bash: this is the most common shell. It creates a history of commands and allows
    you to edit them.

    - csh: the C shell. It does not enable you to edit the command line.

    - ksh: the Korn shell. This is the best known shell on Unix systems.

    - tcsh: improved version of the C shell. Also creates an editable history.

    - sh: the oldest

    - zsh: the most modern.


    ## 7.3 USING THE BASH SHELL


    By default, the shell used is the "Bash" (Bourne Again Shell). Simply type:


    ```bash

    echo $SHELL

    ```


    to find out which shell you are using. Be aware that each shell has its own syntax.
    We advise you to use the Bash shell, which is both simple and powerful. Under
    Linux-Mandrake, the Bash shell is the default. Later, we will use this shell in
    our examples.


    ### 7.3 Using the Bash shell


    If the shell reminds you at first of the DOS system, everything possible has been
    done to make the input of commands easy. Among the most useful keyboard shortcuts
    are:


    - Ctrl+A Go to the beginning of the line.

    - Ctrl+U Clear the current line.

    - Ctrl+C Stop the task which is running.


    Use the semi-colon to type several commands on the same line. The up and down
    arrows allow you to scroll through the command history. To reach a particular
    command without having to go through the whole history, type:


    ```bash

    history

    ```


    A list of commands in the history is displayed with a number next to each command.
    To execute a command, type:


    ```bash

    ! command_number

    ```

