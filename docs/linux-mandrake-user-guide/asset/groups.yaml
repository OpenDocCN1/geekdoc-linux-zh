    ## Chapter 10


    ## Appendix


    ## 10.1 FAQ


    You will find below some common Linux-Mandrake error messages and corresponding
    explanations. This FAQ is regularly updated on the Linux-Mandrake web site.


    "Unable to display the contents of the directory xxx"


    You do not have permission to read the contents of the directory. Check the directory
    permissions.


    "Unable to read in xxx. The file does not exist or access is refused."


    In general, the reason for this is effectively that you do not have permission
    to read this file. Check the file permissions.


    ## "KFM cannot be connected to ''localhost''"


    You have modified the loopback configuration.

    Type: localhost


    ```

    ping localhost

    ```


    Returned will be something like:


    ```

    PING localhost (127.0.0.1): 56 data bytes

    64 bytes from 127.0.0.1: icmp_seq=0 ttl=64 time=0.3 ms

    64 bytes from 127.0.0.1: icmp_seq=1 ttl=64 time=0.2 ms

    ```


    If this is the case, you should reconfigure your loopback. in /etc/hosts add the
    line:


    ```

    127.0.0.1        localhost

    ```


    then reboot your computer. If this still does not work, consult technical support.


    ## "My printer worked with previous versions of Linux-Mandrake, but not with version
    6.0"


    The 2.2.x kernel has modified the management of the parallel port. In order to
    correct this, edit the file /etc/conf.modules and add the following line:


    ```

    alias parport_lowlevel parport_pc

    options parport_pc io=0x378 irq=7

    ```


    Then restart your machine.

    The names of the ports have changed. If your printer is on the port /dev/lp1,
    it will now be on /dev/lp0. Open the file /etc/printcap and replace lp1 with lp0.


    ## 10.2. LINUX-MANDRAKE SPECIFICATIONS


    The entries in the K menu have been duplicated after updating a previous version
    of Linux-Mandrake to version 6.0.


    When you update Linux-Mandrake, it may happen, in certain cases, that the entries
    in the K Menu appear to have been duplicated. This is due to the fact that the
    old files are conserved with the .rpmsave extension. To resolve the problem, type:


    ```

    rm -f ''/opt/kde/share/applnk -name *.kdelnk.rpmsave -print''

    ```


    then restart the graphical interface (K menu/Panel/Reboot).


    ## "How can you delete LILO?"


    Use a DOS boot disk and type fdisk /mbr.


    ## "LILO is not installed correctly. What shall I do?"


    This is often due to a problem in the geometry of the disk. Modify the file /etc/lilo.conf
    in adding the option linear.


    ## "How can I modify the configuration of my keyboard?"


    Use /usr/sbin/kbdconfig.


    ## 10.2 Linux-Mandrake specifications


    Linux-Mandrake is a Unix type system, conforming to the POSIX standards. It is
    a genuine pre-emptive multitasking, multi-user operating system. It runs in 32-bit
    protected mode on Intel x86 compatible platforms, and in 64-bit mode on other
    architectures (Sparc, Digital...). It consists of a central kernel and multiple
    applications conforming on the whole to the criteria of Free Software (or OpenSource)


    ## 10.3 List of hardware supported under Linux-Mandrake


    Please consult the Linux-Mandrake web site for information on this topic, as the
    list is updated regularly in accordance with the versions of the packages used:
    http://www.linux-mandrake.com/


    ## 10.4 Description of packages supplied with Mandrake


    A complete list of RPM packages supplied with Linux-Mandrake, as well as a succinct
    description of each, can be found in the directory /doc on the first CD-ROM (installation
    CD-ROM). The list is arranged in alphabetical order.


    ## Chapter 11


    ## Glossary


    We have collected in this part:


    Account: The system Linux-Mandrake being a multi-user one, it is necessary to
    identify yourself to the system in order to be able to access your rights and
    your parameters.


    Alias: Abbreviations of commands. In general, to create an alias, type: alias=''command''.


    Binary: Programs that are executable.


    Boot: The procedure of loading the operating system.


    Compilation: Action that consists of creating binary files.


    Console: The graphical interface.


    Daemons: Services that run in the background.


    Dependencies: A program depends on other programs.


    ELF: A standard binary format for¹.


    Emacs: A very powerful text editor.


    Ethernet: Protocol for communication between computers.


    Ext2: A file system for Linux.


    FTP: Protocol used to send and receive files.


    GNU: The Free Software project ("GNU is Not Unix").


    Home: Personal directory for each user.


    KDE: The default desktop for Linux-Mandrake.


    Kernel: The heart of the Linux operating system.


    Library: Library of code shared by different applications. It is the equivalent
    of DLL files under Microsoft Windows.


    Link: An entry pointing to another file. The best known are symbolic links: they
    allow you to refer to a file outside of its directory.


    Login: Authentification procedure.


    Loopback: System that allows you to connect to your machine as it were a remote
    machine.


    MBR: Master Boot Record (or boot sector).


    Mount point: A directory attached to a peripheral.


    Mounting: In order for Linux to be able to use a peripheral, it has to be visible
    to the system.


    Multiprocessing: This means that the computer has more than one processor.

    '
  mdcn: '


    ## 第10 章


    ## 附录


    ## 10.1 常见问题 (FAQ)


    以下是一些常见的 Linux-Mandrake 错误信息及其相应的解释。此 FAQ 在 Linux-Mandrake 网上定期更新。


    “无法显示目录 xxx 的内容”


    您没有读取该目录内容的权限。请检查目录权限。


    “无法读取 xxx。文件不存在或访问被拒绝。”


    通常，此的原因是您没有读取该文件的权限。请检查文件权限。


    ## "KFM 无法连接到 ''localhost''"


    您修改了环回配置。

    输入：localhost


    ```

    ping localhost

    ```


    返回的内容将类似于：


    ```

    PING localhost (127.0.0.1): 56 data bytes

    664 bytes from 127.0.0.1: icmp_seq=0 ttl=64 time=0.3 ms

    64 bytes from 127.0.0.1: icmp_seq=1 ttl=64 time=0.2 ms

    ```


    如果是如此，您应该重新配置您的环回。在 `/etc/hosts` 中添加以下行：


    ```

    127.0.0.1        localhost

    ```


    然后重启电脑。如果仍然不起作用，请咨询技术支持。


    ## "我的打印机在之前的 Linux-Mandrake 版本中可以使用，但在 6.0 版本中无法工作"


    2.2.x 内核修改了并行端口的管理。为了修复此问题，编辑 `/etc/conf.modules` 文件并添加以下行：


    ```

    alias parport_lowlevel parport_pc

    options parport_pc io=0x378 irq=7

    ```


    然后重启机器。

    端口名称已经发生变化。如果您的打印机在 `/dev/lp1` 端口，现在它将位于 `/dev/lp0`。打开 `/etc/printcap` 文件并将 lp1
    替换为 lp0。


    ## 10.2 LINUX-MANDRAKE 规范


    在将之前的 Linux-Mandrake 版本更新到 6.0 后，K 菜单中的条目出现了重复。


    当您更新 Linux-Mandrake 时，在某些情况下，K 菜单中的条目似乎重复了。这是由于旧文件以 `.rpmsave` 扩展名保留的。要解决此问题，输入：


    ```

    rm -f ''/opt/kde/share/applnk -name *.kdelnk.rpmsave -print''

    ```


    然后重启图形界面（K 菜单/面板/重启）。


    ## "如何删除 LILO？”


    使用 DOS 启动盘并输入 `fdisk /mbr`。


    ## "LILO 安装不正确。我该怎么办？”


    这通常由于磁盘几何结构的问题。通过修改 `/etc/lilo.conf` 文件添加 `linear` 选项。


    ## "我如何修改我的键盘配置？”


    使用 `/usr/sbin/kbdconfig`。


    ## 10.2 Linux-Mandrake 规范


    Linux-Mandrake 是一个 Unix 类型系统，符合 POSIX 标准。它是一个真正的抢占式多任务多用户操作系统。它在 Intel x86 兼容平台上以
    32 位保护模式运行，在其他架构（Sparc, Digital...）上以 64 位模式运行。它由一个内核和多个符合自由软件（或开源）标准的应用程序组成。


    ## 10.3 Linux-Mandrake 支持的硬件列表


    请参阅 Linux-Mandrake 网站获取此主题的信息，因为列表会根据所用包的版本定期更新：http://www.linux-mandrake.com/


    ## 10.4 Mandrake 提供的软件包描述


    Linux-Mandrake 提供的 RPM 软件包完整列表以及每个包的简要描述可以在第一张 CD-ROM（安装 CD-ROM）的 `/doc` 目录中找到。该列表按字母顺序排列。


    ## 第11 章


    ## 术语表


    我们在这一部分收集了：


    Account（账户）：由于 Linux-Mandrake 系统是多用户系统，因此有必要向系统标识您的身份，以便访问您的权限和参数。


    Alias（别名）：命令的缩写。通常，要创建别名，输入：`alias=''command''`。


    Binary（二进制文件）：可执行的程序。


    Boot（启动）：加载操作系统的过程。


    Compilation（编译）：创建二进制文件的动作。


    Console（控制台）：图形界面。


    Daemons（守护进程）：在后台运行的服务。


    Dependencies（依赖关系）：一个程序依于于其他程序。


    ELF：一种标准的二进制格式¹。


    Emacs：一个非常强大的文本编辑器。


    Ethernet（以太网）：计算机之间通信的协议。


    Ext2：一种 Linux 的文件系统。


    FTP：用于发送和接收文件的协议。


    GNU：自由软件项目（“GNU 不是 Unix”）。


    Home（主目录）：每个用户的个人目录。


    KDE：Linux-Mandrake 的默认桌面。


    Kernel（内核）：Linux 操作系统的核心。


    Library（库）：不同应用程序共享的代码库。它等同于 Windows 下下的 DLL 文件。


    Link（链接）：指向另一个文件的条目。最为人知的是符号链接：它们允许您引用目录之外的文件。


    Login（登录）：身份验证程序。


    Loopback（环回）：允许您像连接到远程机器一样连接到您的本地系统。


    MBR：主引导记录（或启动区）。


    Mount point（挂载点）：附加到外设的目录。


    Mounting（挂载）：为了让 Linux 能够使用外设，它必须对系统可见。


    Multiprocessing（多处理）：这意味着计算机拥有多个处理器。


    '
