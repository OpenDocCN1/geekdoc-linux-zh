    ### /etc/rc.d/rc.sysinit


    这是第一个被执行的脚本。它在启动时运行一次。启动时你看到的几乎所有信息都来自此脚本。


    该脚本首先显示 `PATH` 变量的值，该变量定义了程序的访问路径。然后，程序将搜索网络配置。如果网络存在，则执行网络脚本（`/etc/sysconfig/network`）；否则，告知系统没有网络，因此机器名称将为
    `localhost`。


    然后激活交换分区。屏幕上会显示 `HOSTNAME` 变量。如果使用了 NIS 服务，则对其进行设置。系统继续检查分区（`fsck -V -a $fsoptions
    /` 命令）。后续操作允许在分区损坏时对启动过程进行管理。最后，激活配额管理。


    脚本将配置你的 PNP 卡。然后启动你所有以模块形式运行的程序。随后，所有分区都将被挂载并验证。


    在系统配置计算机时间之前，启动过程会删除许多文件（`rm -f` 命令）。串口的激活是下一步。


    最后部分由特定于 Linux-Mandrake 的指令组成，它们会在你首次启动时执行。


    ```

    /etc/rc.d/rc

    ```


    `rc` 程序旨在根据运行级别更容易地启动脚本。因此，此脚本非常短。它获取当前的运行级别以便启动必要的脚本。如果运行级别是 `x`，则执行 `/etc/rc.d/rcx.d/`
