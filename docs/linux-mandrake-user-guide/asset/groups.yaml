    # 10 第 2 章 安装 LINUX-MANDRAKE


    带有：基地址= 0x340 irq=7，如果你不确定这些值，将无法成功完成安装。


    未检测到 Linux-Mandrake 系统（CD-ROM、FTP、NFS、硬盘或 SMB 安装）


    使用 PowerPack 版本的 CD-ROM 不会发生这种情况。可能是因为你的 CD-ROM、远程站点（局域网或广域网）或 Mandrake 镜像不符合安装程序的预期。


    程序在安装包期间停止


    请检查你正在使用的分区大小是否大于所需大小。不建议在小于 300 MB 的分区上安装 Linux-Mandrake（除非你不打算安装 X Window）。


    # 你无法设置你的显卡


    这是一个常见问题（尽管正在变得越来越少见！）。不要恐慌，这（通常情况下）不会阻止你的 Linux 系统的运行。你可以在安装完成后以后设置卡配置。


    # 你无法设置你的网卡（系统未识别到它）


    这（通常情况下）不会阻止你的 Linux 系统的运行。你可以在安装完成后以后设置网卡配置。


    # 2.4 问题——联系谁？


    # 你无法设置你的打印机


    这不会阻止 Linux 系统的运行。你可以在安装完成后以后设置卡配置。


    # 你无法创建你的 LILO 引导软盘


    这是一个恼人的问题，在当前的 Linux-Mandrake 发行版中不应该出现。换一张新软盘重试。如果反复失败，请联系安装支持。


    # 你无法安装 LILO


    这通常是由于对硬盘结构的检测问题。这在最新的 BIOS 版本中不应该发生。如果发生了，请制作一个 LILO 引导软盘（按照说明操作）并使用它启动你的 Linux
    系统。然后编辑文件 /etc/lilo.conf 并插入行 "linear"。


    例如，如果你的 Linux 分区被挂载在 /dev/hda，你的内容应该像所示：


    ```

    (...)

    boot=/dev/hda

    linear

    (...)

    ```


    最后，使用命令 /sbin/lilo 重新安装 LILO。


    # 你无法启动你旧的操作系统


    这可能发生在你没有正确安装 LILO 的情况下。尝试从 Linux 系统重新安装 LILO（参见本手册中的相关章节）。如果你有 Windows，请使用 DOS
    启动盘然后输入 fdisk /mbr 来使用 Windows。


    # 12 第 2 章 安装 LINUX-MANDRAKE


    你可能遇到了硬件问题（CPU、缓存内存、内存、……）或过热。禁用你的缓存内存，为机器通风，将内存移动到另一个插槽。你能做的最后事情就是联系你的零售商。


    # 如果问题持续存在，你可以做什么？


    如果你认为你已经尝试了上述所有的解决方案，或者你的问题没有列出，请首先咨询网络上提供的详尽文档（FAQ、Dejanews 新闻组存档……）。Mandrake
    网站包含许多指向这些文档的链接以及一份通用错误列表。还请参考手册末尾列出的参考文献。


    欢迎加入 Linux-Mandrake 邮件列表，你可以在那里交换观点并讨论你的问题。要订阅，请访问 Linux-Mandrake 网站：http://www.linux-mandrake.com/。


    如果这些也没有帮助，也许该使用 Mandrake 安装支持（传真或电子邮件）了。以下是需要采取的步骤：


    # 详细描述问题


    精确描述问题很重要：问题何时发生？你可以复现吗？到底发生了什么？


    > http://www.dejanews.com/


    # 2.4 问题 联系谁？


    在“日志控制台”之间切换以获取有关问题的额外信息可能是很有用的。你可以通过 Alt+F3 和 alt+F4 键组合在控制台之间切换。写下最后 4 行。


    然后使用上述信息以清晰准确的方式陈述你的问题。


    # 联系 Mandrake 安装技术支持


    首先，你需要注册。请严格按照 Mandrake PowerPack 盒内附带的注册卡上的说明操作。你将收到一份注册确认，其中包含了联系技术支持的必要说明。


    请注意，技术支持答复的质量与你描述问题的准确性相关联。如果你希望获得更多支持，将必须订阅额外的支持合同。


    然后等待……


    延迟可能可能是 20 分钟或 24 小时，取决于工作负载以及你问题的复杂性。要获得这种支持，请连接到 http://www.linux-mandrake.com/index.html
    并阅读“扩展支持”中的信息。


    # 第 3 章 设置 Linux


    一旦你安装了 Linux 系统，你可能需要进行一些微调：例如，如果你没有成功安装你的显卡或打印机……你也可以配置运行在系统上的服务（守护进程）。一旦 Linux
