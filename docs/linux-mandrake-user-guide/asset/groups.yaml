    In this menu you will be able to change the appearance of your desktop.


    The background menu gives you a list of all the desktops and enables you to choose
    a background to apply. If you would like to have an imageless background, choose
    no wallpaper in the wallpaper menu then set up your colors: one for a uniform
    background or two for a nice graded look. One click on the colour enables you
    to modify it and the configure button enables you to access the grading options.
    On the other hand, if you would like an image in the background, simply choose
    one from the pull-down wallpaper menu. If you cannot find any that you like, choose
    one of your by clicking on Browse (any JPEG can be used). If you regularly modify
    the look of your desktop, you will certainly hope the menu is easily accessible.
    For this, check the option Insert in the panel. An icon is inserted on the left
    of the panel; simply click on it to access this menu. If you really like to change
    it often, check the option random.


    In the Border menu, you can choose to activate the borders of each desktop. This
    means that if you move to the left of'
  - '[PAGE 48]


    # 4.6. CUSTOMIZING THE DESKTOP 33


    the desktop (for example) and you continue to go left, the desktop will appear
    to follow you. You can therefore move a window from one desktop to another in
    this way. The magic borders delimit an attraction zone where the window will be
    stuck to the border or to the nearest window. For example, set the attraction
    to 40 pixels. Take a window and move it towards a border. In one move, you will
    see that it becomes stuck to the border: you have entered the attraction zone.


    The Color menu enables you to choose this aspect of the bars. Certain choices
    have been preconfigured.


    The Font menu works on the same principle by enabling you to modify the fonts
    used.


    The desktop has an imaginary grid on which the icons are positioned. In the Icon
    menu, you can modify the size of this grid to make the icons more or less spaced
    out. In addition, you can check the Transparent text for desktop icons option
    to avoid the icons name not being displayed in a background which is different
    to that of the desktop.


    To set up the screen saver, go to corresponding menu. It is possible to demand
    a password every time the screen saver is displayed. Do not modify the Priority
    zone which should remain on Elevated!


    Finally, go to the Style menu to give a MacOS style to KDE.


    # Information menu


    The Information menu offers you a simple and efficient way of finding information
    on your computer (IRQ, DMA, ...). Amongst the most interesting information is
    State of Samba'
