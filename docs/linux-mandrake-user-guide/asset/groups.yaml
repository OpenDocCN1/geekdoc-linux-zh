    ## Chapter 1


    ### Foreword


    ### 1.1 Linus Linux


    In 1991, Linus TORVALDS, at the time studying in Helsinki, Finland, created the
    very first version of Linux for his own needs. This very rudimentary program was
    intended to run on the PC 80386 of the age. But Linus TORVALDS had the good idea
    of making it "free" and to involve all those who wanted it. Thanks to the support
    of the emerging Internet network and the new-born community of developers, but
    also thanks to the pre-existence of the GNU project 1 started some years earlier
    by Richard STALLMAN, Linux went on to become some years later a full operating
    system. Its power is unrivalled, its stability is now legendary and it improves
    with every day!


    To make it easier to use, Linux is offered in the form of distributions, in other
    words, a set of coherent programs.


    > http://www.gnu.org/


    ### 1.2 Free software


    It is important to know that Linux is only the tip of an iceberg called "Free
    Software" 2/"Open Source"33. The particular characteristics of Free Software are
    as follows: free software can be redistributed at will and without cost, and it
    is modifiable by anyone sufficiently experienced in programming. This concept
    is used principally by the GPL (General Public License) and BSD (Berkeley Software
    Distribution), which are free.


    ### 1.3 Graphical interfaces


    For a while, Linux has only operated with multi-window interfaces. Towards the
    end of 1996, the majority of Linux servers are based on X. is is a to of,,,, is
    lacking to is more than 50% of the web.


    > 2 http://www.gnu.org/

    > 3 http://www.opensource.org/

    > 4 http://www.apache.org/

    > 5 http://www.kde.org/

    > 6 http://www.linux-mandrake.com/


    ### 1.4 Linux-Mandrake


    ### The Concept


    The "Desktop Environment" Linux-Mandrake was born from a simple idea: to supply
    the user with a solid base, to install and configure, and that the distribution
    is also the quickest to get up. Looking forward, we are convinced that Linux-Mandrake
    will bring you much satisfaction. Nevertheless, bear in mind that Linux is not
    always used like proprietary systems.


    ### 1.5 This manual


    For your information, be aware that this manual was entirely created under Mandrake
    with the following programs: LyX, Emacs for the text editing, Gimp and gif2ps
    for image processing, and the psutils for setting it out before printing.


    ### 1.6 Acknowledgements


    We thank Linus TORVALDS and all those who contributed to the Linux kernel. Thanks
    equally to the GNU project and therefore therefore, in particular, to Richard
    STALLMAN, without whom all would have certainly never existed. Thanks to all the
    developers of Free Software, whether they are professional engineers. We thank
    all who made the formidable effort to document Linux (the HOWTOs) and the translators.
    Thanks to the entire KDE team for taking the initiative to create a true graphical
    desktop for Linux and above all for all those who, with their enthusiasm and their
    interest, have allowed Linux-Mandrake to exist and develop itself.


    ## Chapter 2


    ### Installing Linux-Mandrake


    This chapter complements the Install Guide. It details the procedures for installing
    from NFS, FTP, HTTP and a hard disk and shows you how to resolve several problems.


    If your computer allows you to boot from the CD-ROM, do it; otherwise, start with
    the boot disk.


    Note: in certain cases, you will have to force your machine''s BIOS to start on
    the disk drive.


    You should see a welcome screen. Click on Enter to continue. You could also choose
    to start in "expert" mode. To do this, type "expert". A minimal Linux will be
    launched. It will detect your system''s resources and act as a base for the remainder
    of the installation.

