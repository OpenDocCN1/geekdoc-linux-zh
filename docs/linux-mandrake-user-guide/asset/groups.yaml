    in position with the help of pixmaps. A launcher, as the name suggests, launches
    applications. There are three particular types of launchers. You may have two
    of them at the far lefthand side of the lower panel: the main menu (the footstep
    mounted on an arrow) and a button for closing the session (immediately on the
    right). The third type of launcher is the drawer: it acts as a launcher which
    "contains" a panel which may itself contain other launchers, drawers or applets.
    Applets are X applications having the option of being completely integrated into
