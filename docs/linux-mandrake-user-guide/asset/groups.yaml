    # Chapter 8

    # System administration


    ## 8.1 The User and Groups


    Unlike other operating systems, Linux manages problems of security and notably
    user groups.


    In Linux, there are three types of users: yourself, the group to which you belong,
    and other users. Each user of the machine has his own personal directory which
    is a sub-directory of /home. For example, if your login name is fred, your personal
    directory will be /home/fred (you will often see the abbreviation ~ to designate
    your personal directory). This symbol is recognized by the bash shell. The only
    exception is the root account, of which the directory is /root. This notion of
    user directory allows you to protect your confidential files from being read by
    other users (only the superuser can access all the personal directories).


    However, you will certainly want to share documents with other users. That is
    why Linux supports groups. A group is a set of users. A user belongs to one group
    by default but it is possible to belong to several groups. The administrator must
    organize these groups using the relevant software. Often, groups are created by
    functions: one group for the accountants service, one for developers, etc...


    ## 2.2 Managing users


    ### Creating an account


    As you must never work under the root account, you should create at least one
    user even if you are the only person on your machine.


    We have seen the adduser command, but luckily there are graphical tools, notably
    linuxconf, which we shall summarise here.


    linuxconf is a very complete tool that allows you to handle Linux-Mandrake configuration
    files. Thanks to this tool, the management of user accounts is very simple. As
    the superuser, launch linuxconf. On the left are displayed the different modules
    and on the right, the current module. Go to management of users then user accounts.
    The list of current users is displayed. Choose add then fill in the various fields
    (for the group, you can choose users, default groups for the current users). Confirm
    and its finished!


    ### Special accounts


    If you edit the file /etc/passwd (which contains a list of the passwords, encrypted)
    or the file /etc/groups (where the different groups are indicated), you will notice
    that there exist users who do not have true accounts, such as ftp or news. These
    accounts, which are called special accounts, are used by programs or daemons for
    carrying out their operations. They often need rights that are superior to those
    of the normal user and it is so to avoid using the root account that there exist
    special accounts.


    It is more likely than not that you will never have to worry about these special
    accounts.


    ## 8.3 Management of programs (RPM)


    Linux-Mandrake uses the RPM standard, that is the "Red-Hat Package Manager", to
    allow you to manage your programs easily. Thanks to RPM, you install and uninstall
    programs with one movement of the hand! The real strength of RPM is its ability
    to check for dependency between programs. Therefore, it will not allow you to
    install a program if one of the libraries that it needs is absent.


    For Intel processors and compatibles, program names are structured in the following
    way:


    ```

    name.version.i386.rpm

    ```


    If it is a source file, you will find src in the name. Under Linux-Mandrake, there
    are two methods for managing RPM packages: the command line and the Kpackage program.
    Do not forget that only the root user has the right to install or uninstall programs!


    ### RPM on the command line


    The RPM program is used with options to manage all your RPM programs. command
    line syntax is:


    ```

    rpm -options program_name

    ```


    Let’s see the available options.


    ### Install a program


    A program can be installed using the option -i. For example, to install the program
    KLyX, type:


    ```

    rpm -ivh klyx-0.9a-f13.rpm

    ```


    Your program is installed and is ready for use immediately! The options v (verbal
    mode) et h (progress) are optional and allow you to see the progress of the installation.


    ### Update a program


    To update a program by installing a more recent version, you should use U instead
    of i. Thus, all your configuration files are saved.


    ### Uninstall a program


    Should you wish to delete a program, use the option e, as in:


    ```

    rpm -e program_name

    ```

    The program will be deleted.


    ### Verify a program


    Verification allows you to check if the files are present. For this, type:


    ```

    rpm -V program_name

    ```


    ### Interrogate a program


    It is often very useful to interrogate a program, for example, to know the list
    of files contained. Use:


    ```

    rpm -q program_name

    ```


    ### Other options


    There are a number of options that you can find out by consulting the man page.
    --force is fairly dangerous.


    ### Kpackage


    Kpackage is the graphical tool that allows you to manage programs.


    ## 8.4 Installation procedure


    ### The boot


    When you start Linux, the kernel checks the configuration. It displays various
    messages using dmesg. Then it shows the root system. Inability to mount this system
    leads to the famous Kernel Panic which stops the computer.


    The first process to be launched is init. It launches, on start-up, other processes
    and numerous verifications. on each console.


    ### Runlevels


    A runlevel is a particular execution environment. Linux allows you to define several
    different environments. There are 7 of them:


    - level 0: Shutdown of the computer.

    - level 1: Single user mode. Only to be used in particular cases.

    - level 2: Multi-user mode without sharing of directories through NFS.

    - level 3: Normal runlevel in console mode.

    - level 4: Not used.

    - level 5: Normal runlevel in graphical mode.

    - level 6: Computer reboot.


    It is strongly advised not to set any runlevel other than 3 or 5 as the default.
    In all cases, never set the runlevel to 0 or 6: you will no longer be able to
    use your computer!


    ### The file /etc/inittab


    This file contains the list of tasks to accomplish according to the execution
    level that you are in. The normal runlevel is either 3 (console mode) or 5 (graphical
    mode). Description of the file /etc/inittab.


    It appears in the following form (without the line numbers; the shape may vary
    according to your configuration):


    ```

    # Default mode:

    id:5:initdefault:

    # System initialization

    si::sysinit:/etc/rc.d/rc.sysinit

    10:0:wait:/etc/rc.d/rc 0

    11:1:wait:/etc/rc.d/rc 1

    12:2:wait:/etc/rc.d/rc 2

    13:3:wait:/etc/rc.d/rc 3

    14:4:wait:/etc/rc.d/rc 4

    15:5:wait:/etc/rc.d/rc 5

    ```

