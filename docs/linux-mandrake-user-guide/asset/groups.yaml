    # 16 CHAPTER 3. SETTING UP LINUX-MANDRAKE


    to recreate this file. To do this, whilst root user¹, use an

    editor (kedit, jed, emacs, vi...) and edit /etc/lilo.conf.

    For example, with kedit, type kedit /etc/lilo.conf.


    Let''s look at an example: your system contains a Linux

    a and a DOS system on two partitions of your principal disk

    (/dev/hda). Here is the configuration file /etc/lilo.conf to

    create (for the 2.0.36 kernel):


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=50

    image=/boot/mlinuz

    label=linux

    root=/dev/hda1

    read-only

    other=/dev/hda

    label=dos

    table=/dev/hda

    ```


    Of course, you can modify these parameters according to

    your disk configuration (SCSI disks, several disks, etc.).


    To reinstall LILO from your new file /etc/lilo.conf,

    simple type /sbin/lilo. You will have a message similar

    to:


    Added linux * (this will be the system loaded by default)

