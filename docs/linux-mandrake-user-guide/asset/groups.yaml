- md: '

    ## 4.7. ADVANCED USE OF KDE


    ### Viewing a Web page, downloading a file


    To view a web page, just type the URL of the page in the bar of KFM!


    In the same way, you can access the MandrakeSoft FTP site by typing: ftp://ftp.linux-mandrake.com.
    By default, KFM makes an anonymous connection to the site. If you have a valid
    account on the FTP site, you can use your login by typing and address of the form:
    ftp://username@ftp.domaine.extension. KFM will ask you for your password.


    ### Launching programs on start-up


    There is a universal way to start programs on start-up: modify the file ~/.bash_profile
    and ~/.xinitrc. Luckily, under KDE, you can just place a link to the program that
    you would like to launch in the StartUp directory which you will see on the desktop.


    ### Mount the disk drive or CD-ROM drive


    There exist, on the desktop, two shortcuts, one to the disk drive and one to the
    CD-ROM drive.


    Usually, in order to be able to access the information on a disk, formatted in
    ext2 format, the standard file format for Linux, or on a CD-ROM, you will have
    to mount the appropriate drive.


    If the disk is in DOS format, use mtools. Type man mtools for more details on
    this subject. The best known DOS commands are preceded by the letter m. In a few
    words, you should type mdir a: to display the contents of the disk. Some relevant
    commands are: mdir, mformat, mcopy, mdel.


    To mount a disk (or a CD-ROM), type the command mount /mnt/floppy (or mount /mnt/cdrom).
    This is fairly cumbersome if, as is often the case, you change the disk or CD-ROM
    often. In effect, if the drive is not unmounted, you cannot remove the CD-ROM.


    In Linux-Mandrake, by default, the two shortcuts make life a lot easier. With
    a single click, you mount the disk or CD-ROM. A small green square will appear
    on the corresponding icon, serving to remind you that the drive is mounted. To
    unmount a drive, click with the right mouse button and choose unmount. It''s as
    simple as that!


    ## Chapter 5


    ## The KDE programs


    ### 5.1 Text Editors


    KDE is supplied with 2 text editors as standard: kedit and kwrite. You will find
    them under Applications in the K Menu.


    kedit is a small text editor that allows you to type in a simple way short texts
    or to edit configuration files. It is possible to edit a message directly on an
    FTP server or on the Web. Simply indicate the Internet site and the file name
    at the prompt Placement of the Open menu (for example: ftp://ftp.linux-mandrake.com/Welcome.msg).


    kwrite is an editor which is very similar to the previous one, but is more powerful.
    In particular it allows you to modify the colors used by the text according to
    the document type. For example, open the document /.bash_profile. It appears in
    a uniform style. In the Options menu, choose Activate highlighting then Bash (the
    file .bash_profile is written in Bourne-shell). The style of the text is modified
    instantly:


    comments are in italics and functions are displayed in bold. There are also various
    other interesting modes as HTML or C. There is another interesting function for
    when you edit long files which gives you the option of placing markers on certain
    lines of the file. For this, choose *Add in the Markers* menu. Although it doesn''t
    offer as many features as Emacs, `kwrite` could be very useful to you; therefore
    do not hesitate to use it!


    ### 5.2 Image editing programs


    KDE is supplied with several graphics utilities which complement those that you
    will find elsewhere in the *Linux-Mandrake* distribution.


    The screen capture utility, called KSnapShot, allows you to make screen captures!
    It enables you to make a copy of the whole screen or only the window where the
    cursor is.


    The icon editor will enable you to create your own icons if you cannot find the
    icon you would like in the icon set supplied with KDE. The program appears as
    a classic drawing tool. The background is a grid. In effect, an icon is generally
    a drawing of which the size is strictly defined (32×32 pixels). The grid is there
    to help you to keep to this size.


    The Paint program is a drawing program which is simpler than anything else. Let
    free your imagination!


    ### 5.3 Use the Internet!


    Linux was created on the Internet, as was *KDE*. It therefore contains the tools
    necessary to connect to the world wide web. In the *Internet* menu, you will find
    an e-mail viewer, a news viewer, a dialler to connect yourself and utilities for
    other Internet services (IRC, telnet, archie).


    ### Use of the kppp dialler


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_60_0.png)


    Before connecting to the Internet, you have to set up your connection1. Launch
    the dialer then choose Configuration2. Click on the first tab New. Give a name
    to your connection, then fill in the telephone number. You can check the Save
    password option if you do not want to have to type the password every time. Do
    not modify anything else and move to the IP tab, where in general you don''t have
    to modify the default configuration. In the Domain section of DNS tab, enter the
    name of your ISP (for example, aol.com). Enter the IP address or addresses of
    name server below and click Add. If you would like to take advantage of kppp management
    feature, click on PPP tab and select your country. To exit, click on OK. In the
    Modem window, you can set up your modem. If it is an external modem, choose /dev/cux
    (where x represents serial port). For example, if your modem is linked to COM1,
    choose /dev/cu0. If, on the other hand, your modem is internal modem, opt for
    /dev/ttyS0. Do not alter the other parameters. After clicking on modem tab, the
    Modem and PPP tabs can verify that it has been set up correctly. The Modem and
    PPP tabs normally need not to be modified. The Graph tab allows you to view the
    input and output rates remains for you to surf the web!


    All of this supposes that you have an account with Internet Service Provider!
    In addition, your modem must not be one designed for Windows. If this is the case,
    it will never work under Linux. We shall give details of how to set up an account
    with classic Internet provider (ISP). If you have any problems, consult your service
    provider for more information.


    ## 5.4 Manage SYSTEM


    ### The mail viewer, Kmail


    Kmail is a high-performance, easy-to-use mail viewer. When you first launch it,
    a window will be opened to allow you to enter various parameters of your account:
    name, electronic address, signature files. The Network tab allows you to choose
    the type of connection you use to send and receive mail. For starters, Sendmail
    is not advised. Click on SMTP and indicate the address of your mail server. If
    you use Sendmail, you will need to set up a local box; otherwise a POP3 box. In
    the latter case, you will simply need to fill in the details given to you by your
    ISP. The most important part of the setting up process is now finished. The remaining
    tabs deal with ergonomics of your mail viewer. Kmail has all the features of modern
    mail viewer: address book, filters, etc.... Simple to use, it allows you to discover
    the huge benefits of email!


    Even if you are not a computer administrator by profession, it is interesting
    to know how to do some operations. Under Linux-Mandrake, certain operations are
    accessible via System menu. In case of doubt, consult your ISP. Sendmail is useful
    for important sites, handling thousands of messages every day. Sendmail is primarily
    known for its configuration which is incredibly complex!

