    ## 6.5 关于面板的更多信息


    终端，因此更容易（即使不是为了调试程序）捕获发出的错误信息。


    在启动器上点击右键可以让你编辑其属性、沿面板移动移动它甚至移动到另一个面板，或者将其删除。


    ## 6.5 关于面板的更多信息


    ### 使用鼠标操作


    在给定面板中的鼠标操作将取决于你按下右键还是中键。如果你按下中键并保持按住，你可以随意的在桌面上移动它。如果你按下右键，你将可以使用全局面板配置参数，并能够添加启动器或小程序。


    ### 面板配置参数


    所有面板通用的参数适用于动画、与启动器相关的图标、抽屉、主菜单和会话结束以及其他参数的修改：帮助泡泡、属性菜单、全局行为。每个面板的独立参数适用于它们的位置、可见性和外观。


    ## 6.6 结论


    尽管 GNOME 目前没有像 KDE 那样成功，但它有几个令人敬畏的优势：你可以在不使用兼容窗口管理器的情况下使用面板（因此可以更深入地自定义你的环境），而且它的演示更具吸引力（尽管
    KDE 的企业端吸引某些人）。但缺乏专用应用程序是一个严酷的弱点。


    这两个环境都需要大量的内存（如果你不信，请在 top 中输入 M...），你应该避免在性能较低的配置上运行它们。如果你的机器足够强大，选择权就在你！


    # 第 7 章


    # Linux 简介


    ## 7.1 系统的启动和关闭


    ### 启动


    要启动 Linux-Mandrake，你不需要做太多！

    如果你的计算机中已另一个系统，或者安装了 LILO，后者将启动并显示：


    LILO:


    按下 Tab 键¹显示所有可能的系统列表。从逻辑上讲，你应该输入 `linux` 来启动你的 Mandrake 系统，除非你给它起了不同的名字。如果你按下
    Enter 键，将启动安装期间定义的选项，如果你等待超过五秒也会发生同样的情况。这些参数在 Linux 下可以通过以下文件进行修改：


    > ¹它位于 Q 键旁边。


    `/etc/lilo.conf` 文件。如果你想修改这些参数，请参阅关于 LILO 的章节。


    你可能选择了在 DOS 或 Windows Linux 下使用 `loadlin.exe`。在这种情况下，它的启动方式会有不同。


    ### 登录程序


    Linux 是一个多用户系统。为了访问系统，你必须经过身份验证：这被称为登录程序。


    在安装期间，你创建了一个名为 root 的超级用户账户。在登录提示处，输入 `root` 然后输入你的密码（"Password:"）。我们建议你在安装过程中过程中创建的第二个账户（非特权用户）用于系统的日常使用。


    你现在已登录 root 账户。该账户拥有对整个系统的所有权限。它是计算机的管理员账户，而不是工作账户！因此，你可以再次创建一个用户账户，这将是你自己的。操作方法如下：


    `adduser login_name`


    其中 `login_name` 将是你选择的名字（root 之外）。要为此账户创建密码，输入：


    `passwd login_name`


    如果你需要访问 root，请使用：


    `su`


    其中 `login_name` 将是你选择的非 root 之外的名字。


    ## 7.1 启动和关闭


    ### 关闭


    有很多方法可以关闭系统。最常见的方法是：


    - 1. 从菜单选择 系统 $\rightarrow$Shutdown（关）。

    - 2. 从终端输入 `halt` 或 `reboot`。

    - 3. 按 Ctrl+Alt+Del。


    如果系统冻结怎么办？你可能需要硬重启。


    等，如果系统停机了怎么办？此操作可能会持续几分钟。


    ## 7.2 Linux Shell


    连接到计算机后，你将看到一个带有 $ 符号的提示符。等待你的指令的程序就是 shell。它的作用是将你的指令传递给内核。


    这里是可用 shell 的简要描述：


    - bash：最常用的 shell。它创建命令历史并允许你编辑它们。

    - csh：C shell。它不允许你编辑命令行。

    - ksh：Korn shell。这是 Unix 系统上最著名的 shell。

    - tcsh：C shell 的改进版本。同样创建可编辑的历史。

    - sh：最老的

    - zsh：最现代的


