    # 2.2 Managing users


    # Creating an account


    As you must never work under the root account, you should create at least one
    user even if you are the only person on your machine.


    We have seen the adduser command, but luckily there are graphical tools, notably
    linuxconf, which we shall summarise here.


    linuxconf is a very complete tool that allows you to handle Linux-Mandrake configuration
    files. Thanks to this tool, the management of user accounts is very simple. As
    the superuser, launch linuxconf. On the left are displayed the different modules
    and on the right, the current module. Go to management of users then user accounts.
    The list of current users is displayed. Choose add then fill in the various fields
    (for the group, you can choose users, default groups for the current users). Confirm
    and its finished!


    # Special accounts


    If you edit the file /etc/passwd (which contains a list of the passwords, encrypted)
    or the file /etc/groups (where the different groups are indicated), you will notice
    that there exist users who do not have true accounts, such as ftp or news. These
    accounts, which are called special accounts, are used'
