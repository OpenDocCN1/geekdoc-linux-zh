    接受 取消 帮助

    ```


    如果你的机器作为一个或多个子网络的路由器运行，路由守护进程将为你省去在所有机器上设置所有子网络路由的繁琐任务。它的作用是向其他机器发送路由表条目。


    如果你想发送路由表条目，你需要禁用“不发送任何路由”（Do not send out any routes）选项。如果你的机器同时也作为默认网关运行，你可以选择发送默认路由表。例如，如果你使用这台机器连接
    Internet 并希望向所有其他机器发送路由时就是如此。


    ## 机器名的搜索路径


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_122_0.png)


    将 IP 地址解析为机器名有三种不同的方式：


    - 1. hosts：系统在 /etc/hosts 文件中查找与 IP 地址或相应名称对应的条目，并返回所需的结果。这是最简单的方法，对于小型网络通常足够了；


    - 2. DNS：系统查询远程名称服务器。系统查询服务器的方法之前已解释过；


    - 3. NIS（网络信息系统）：参见下段落


    你可以使用或不使用任何你需要的服务，并指定查询服务的顺序。如果第一个失败，第二个将接管，依此类推。hosts DNS 是最好的折中方案，至少你不需要使用 NIS，就像在某些大型
    Unix 网络中那样。


    ## NIS


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_123_0.png)


    NIS 是由太阳微系统（Sun Microsystems）发明的一种协议。它避免了信息冗余，例如在“导出”用户账户、服务等方面。如果你想查询现有的 NIS
    域，需要在相关字段中输入域名以及服务器的名称或地址。如果你想创建一个 NIS 服务，请咨询 NIS-HOWTO。


    ## PPP/SLIP/PLIP


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_124_0.png)


    PPP、SLIP 和 PLIP 是三种类似于以太网卡的网络接口，但区别在于它们不是永久激活的。这就是为什么它们被分配了专门的章节。不会讨论 SLIP 和 PLIP
    接口的配置，部分因为它们是两个不常用的接口，部分因为它们的配置相对简单。另一方面，PPP 接口非常常见：


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_125_0.png)


    如果你想通过调制解调器建立 Internet 连接，你需要选择这种类型的接口。对应调制解调器的串口端口由文件 /dev/ttySx 指定，其中 x 代表串口号，/dev/ttyS0
    对应于第一个并行端口（COM1）等。


    你需要从你所选择的 Internet 服务提供商处查询你是否使用 PAP，如果是的话，你应该激活相应的选项，并且在此处填写连接名称和密码。然后你需要点击“自定义”（Customize），它包含四个个标签页。你只需要修改的选项如下：


    - 1. PAP 标签页（如果你使用 PAP）；


    - 2. 在“硬件”（Hardware）标签页中，你可以允许每个用户激活或禁用接口。


