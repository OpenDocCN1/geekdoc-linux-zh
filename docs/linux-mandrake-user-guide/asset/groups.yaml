  mdcn: "\n\n## 5.4. 管理你的系统\n\n![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_64_0.png)\n\
    \n要卸载程序，只需选择它并点击“卸载”，然后确认即可。你可以选择多个程序同时卸载。要做到这一点，你必须激活多选框模式，你可以在“软件包”（Packages）菜单中找到它。\n\
    \n安装程序有两种方法。第一种是直接从 KFM 文件管理器中点击你想要安装的程序。将弹出 KPackage 安装窗口，然后你应该点击“安装”（Install）。第二种方法是启动\
    \ KPackage 程序。转到“选项”（Options）菜单并选择“安装未安装的 RPM 包”。你可以指定几个不同的位置，特别是 FTP 站点。如果你从\
    \ Linux-Mandra CD-ROM 安装程序，请输入 `/mnt/cdrom/Mandra/RPM` 然后勾选“已使用”（Used）选项。退出对话框，并在“文件”（File）菜单中选择“重新加载”（Reload）。已安装的包前面会有字母\
    \ N。你就可以轻松地安装新软件包了！\n\n# 50 第 5 章 KDE 程序\n\n“选项”（Option）菜单允许你选择你喜欢的视图（所有程序、仅已安装程序或仅未安装程序）。为了加快软件包信息的搜索速度，KPackage\
    \ 使用了缓存。你可以禁用它。\n\n得益于 KPackage，你可以使用简单高效的工具来管理你的 Linux-Mandandra 系统。\n\n![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_65_0.png)\n\
    \n# 进程：KPM 和 KDE 任务管理器\n\nKDE 任务管理器可以在“系统”（System）菜单中找到，它允许你查看运行进程列表。你可以轻松地杀死进程（结束任务）或查看运行进程的树结构。\n\
    \nKpm 可以在“工具”（Utilities）菜单中找到，它提供相同的信息，但形式略有不同。\n\n## 5.4. 管理你的系统\n\n因此，你可以选择你喜欢的那个！\n\
    \n![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_66_0.png)\n\n# 磁盘空间：kddfree\n\nKDFree\
    \ 显示每个已挂载驱动器的空间占用百分比。\n\n# 52 第 5 章 KDE 程序\n\n# 运行级别：ksysv\n\n![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_67_0.png)\n\
    \nSysV Init 编辑器允许你选择在后台启动的守护进程。你需要超级用户（root）权限才能使用它。它以两系列服务的形式存在。在左侧，你会看到已安装服务的列表。在右侧，顶部是已启动的服务，下方是已停止的服务，分别对应每个运行级别。例如，在级别\
    \ 6（计算机重启）下，所有服务都已停止，除了重启本身。有趣的运行级别分别是 3 和 5（默认级别）以及完全图形化的级别。假设你不想在在级别 5 时启动 gpm\
    \ 服务。你只需要用鼠标选中它并将其拖到*停止*（*Stop*）区域即可。这个工具非常易用，但请注意你的操作，否则可能会遇到启动问题！\n\n# 字符字体管理\n\
    \n字符字体管理器是一个允许你管理系统中已安装字体的工具。\n\n# 打印文件管理\n\n如果你有一个打印机（本地或网络），你可以使用“打印文件”（*Print\
    \ file*）程序处理打印队列。当你启动它时，你会看到队列中的项目列表。要删除某项，选择它并点击“移除”（*Remove*）。你还可以通过选择“置到前端”（*To\
    \ the front*）将紧急项目移动到“队列前端”。\n\n# 第 6 章\n\n# GNOME：GNOME 网络对象模型环境\n\n## 6.1 简介\n\
    \nGNOME 是由 Miguel DE ICAZA 初始化的项目，得到了 GNU 项目的支持，它将 GNOME 作为其桌面环境。它的目标与 KDE 项目类似：创建一个完整的图形化环境，并定义一系列引导线，其他应用程序可以遵循这些线条以实现“GNOME\
    \ 兼容”。\n\nGNOME 比 KDE 新得多，但它的开发速度快得多。它已经是一个功能丰富的环境，并且在某些领域优于 KDE，但它缺乏成熟度，尤其是缺乏兼容应用程序。\n\
    \n## 6.2 环境介绍\n\n![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_71_0.png)\n\n与 KDE 不同，GNOME\
