    ## 8.5. 使用 LINUXCONF


    网络是整个 Unix 系统配置的基础点之一。Linux 也不例外。`ifconfig` 和 `route` 的手册页忽略了这一点（并且仍然忽略了它），不不，Linux
    也不例外。`ifconfig` 和 `route` 的手册页忽略这一点甚至比标题写的字还多（尽管这不应该阻止你看一眼 :))），而 `linuxconf`
    的巨大优点在于提供了一个组织良好且清晰的界面。如果你有一台完全隔离的机器，可以跳过本节。


    ### 网络


    此软件包允许你使用以太网和调制解调器（或其他串口连接）从头配置 TCP/IP 网络


    - 客户端任务 | 服务器任务 | 杂项

    - 基础主机信息

    - 服务器规范 (DNS)

    - 路由与网关

    - 主机名搜索路径

    - 网络信息系统 (NIS)

    - IPX 接口设置

    - PPP/SLIP/PLIP


