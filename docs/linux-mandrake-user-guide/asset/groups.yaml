    \ front-end for all the configuration files. It enables you to adjust the parameters\
    \ of your Linux system easily (with the mouse) and with precision.\n\nTo use linuxconf\
    \ (you have to be logged on as the root user), type\"linuxconf\" or select this\
    \ program in the K$\rightarrow$Applications non KDE$\rightarrow$System$\rightarrow$linuxconf\
    \ menu.\n\nYou can also use linuxconf on a console or via Netscape."
  - '[PAGE 36]


    # Chapter 4


    # Discover KDE


    # 4.1 The history of KDE


    KDE is a project that was started by Matthias ETTRICH in 1996! The aim was to
    create a full graphical environment and not only to create a new window manager.
    KDE Version 1.0 came out in 1998 and version 1.1 in February 1999. KDE is now
    a stable and very efficient environment: that is why Mandrake decided to use it
    as the default graphical manager!


    # 4.2 Introduction to KDE


    KDE is the default Linux-Mandrake graphical environment. At the same time simple
    and very complete, it enables you to discover your new Linux-Mandrake system by
    using only the mouse!'
  - '[PAGE 37]


    # An HTML desktop


    Today, the Internet is the heart of information technology. The HTML language,
    on which the Web relies, offers you a simple and fast method for navigating on
    the Internet. That is why the KDE desktop uses the HTML language so that you can
    navigate just as easily as your computer as on the Internet.


    From now on, a single click enables you to launch a program or to navigate the
    file structure of your Linux-Mandrake system! There is no difference between the
    Internet and your computer and you can manipulate the Internet resources as if
    they were files on your personal computer.


    # The K menu, panel and task bar


    The K menu provides you with a simple and efficient method for accessing KDE programs.
    Thanks to the programs which are accessible via the K menu, you have access to
    all the tools which allow you to use your computer. We shall describe the items
    of the K menu.


    There are two parts to the K menu. The first consists of Graphics, Applications,
    Internet, etc. items. These open a list of applications installed on your computer.
    For example, to launch KTelnet, click on K then choose Internet and finally KTelnet
    in the open menu. The second part contains direct access to elements such as the
    Trash Can or KDE Control centre.


    There are three particular menus: Configuration, Disk Navigator and Panel. The
    Configuration menu provides you with rapid access to the different areas of the
    KDE Control Centre. Using the Disk Navigator you can easily access Linux-Mandrake
    directories. The Panel enables you to control'
  - '[PAGE 38]


    # 4.2. INTRODUCTION TO KDE


    the icons which are present on the bar at the bottom of your screen (the *panel*).


    # Using context-dependent menus, using the right or third button


    As is the case with all modern front-ends, KDE supports context-dependent menus.
    These are accessible by using the second button on your mouse (the right button
    in general). The menu that is opened depends on the object you are pointing at.
    If you point at the desktop, the menu which is opened enables you to navigate
    between bookmarks, to create a new file (certain types) or to access the desktop
    properties. If, on the other hand, you click on an icon, the context-dependant
    menu enables you to delete a file or access its properties. The third button (the
    middle button of a 3-button mouse or press the two buttons together with a 2-button
    mouse) enables you to browse through the list of open programs, whichever virtual
    desktop you are using.


    # Drag-and-drop


    KDE supports drag-and-drop between KDE applications. For example, it allows you
    to pick up an icon in a directory and drop it on the desktop! Using this method,
    you can improve your efficiency.


    # The different desktops


    KDE supports virtual desktops. By default, you have 4 different desktops to choose
    from (it is possible to have up to 8). You can apply a different background to
    each desktop as you wish and you can rename them. Using the desktops, you'
  - '[PAGE 39]


    can organize the different applications to avoid overlapping windows.


    # Finding help


    KDE is supplied with on-line help, in the form of HTML files. The main help is
    accessible via the K menu. Each application has its own help menu.


    # 4.3 Using the desktop


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_39_0.png)'
  - '[PAGE 40]


    # 4.3. USING THE DESKTOP


    # What is the desktop?


    The desktop is the area of the screen in which you are going to work.


    On the left, you have a series of icons which permit you to launch applications
    or to open files. At the bottom you can be found the panel and the K menu which
    gives you access to all the KDE programs. At the top, you will see the task bar
    which displays the programs that are open and enables you to switch from one to
    the other quickly.


    # Browse the file structure with *KFM*


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_40_0.png)


    KFM could be considered both an Internet navigator and a file manager. To open
    KFM, you can click on one of the icons on the desktop or use the Disk Navigator
    (see below) to take yourself directly to the file you desire.'
  - '[PAGE 41]


    KFM contains a menu bar, a tool bar, and a bar. The main window shows the files
    and sub-directories situated in the directory indicated in the bar. It is possible
    to have a view of the file structure (menu View/File Structure). Notice that because
    KFM is a web navigator, you can read HTML files directly.


    The KFM windows are mounted on a title bar with control buttons. They let you
    close the window, resize it, iconify it or nail it down.


    # 4.4 K Menu


    # Different items


    The K menu has different items. The programs are ordered thematically (Internet,
    Graphics, etc...). You will also find direct access to the KDE Control Center,
    to the Trash Can, to file search tools and other common programs. Below, you will
    find more detailed explanations about KPanel and Disk Navigator.


    # The Disk Navigator menu


    The Disk Navigator is a tool which we can''t pass over quickly: it enables you
    to access quickly a directory in your file structure (Root menu) as well as your
    personal directories and most importantly the programs that you have used recently.


    It is possible to customize it. To do this, you go to the Options menu. You can
    modify the Personal and Shared parts. Click on your choice, a window will appear
    which corresponds to a KDE directory. To add an item, simply copy an object (directory
    or file) in another window then paste it into the'
- md: '

    ## 4.5. FILE AND FOLDER MANAGEMENT


    Disk Navigator window. Shut the window, choose Apply in the Disk Navigator menu
    and it''s done!


    Use this menu to gain precious time!


    ### The KPanel menu


    The panel is the bar you see at the bottom of your desktop. Other than the K menu
    and the list of desktops, you can add the programs which you would like to include
    so that you can launch them easily. The modifications are made via the KPanel
    menu. To add an item, choose Add an application then select the desired application
    (you could also select a group). The application is added to the panel. One click
    of the right button on the icon allows you to move or remove it. The Configure
    option enables you to access the configuration window of the panel as if you were
    in the KDE Control Centre.


    ## 4.5 File and folder management


    KDE makes a search for and use of all the resources of your computer easier by
    giving you a simple and customizable interface to navigate the file structure
    of your system.


    ### Presentation of the KFM menus


    KFM is the name of the program you will use to explore your system. It is composed
    of menus (File, Edit,...), a tool bar, a bar and a state bar.


    The bar indicates the current directory. It is given in the form file:/xxx, in
    the same way as a Web browser.


    The File and Edit menus are very classic and enable you to carry out the normal
    operations on files (create, search, cut and paste, ...). The View menu enables
    you to set up the KFM display. Using the Go menu, you can move through the history.
    In the Bookmark menu, you can save your favorites, whether they be local files
    or Internet sites. The Cache and Options menus enable you to configure precisely
    your KFM browser.


    ### The different views possible


    The View menu enables you to set up the display mode if the browser. An option
    is selected when you see a cross next to the name.


    Hidden files are the files where the name begins with a full stop: generally are
    configuration files for your programs. Click on the Show hidden files option if
    you wish to see them. The file structure option displays 3 names on the left:
    Root, Home and Desktop. The first is in fact the directory "", the second shortcut
    to the directory "/home" and the last to your sub-directory Desktop. Click on
    the triangle to the left of each name. This enables you to open the file structure
    without updating the right hand part. This is very practical for copying files.
    If, on the other hand, you click on the name, only the right hand part is updated.
    Perhaps you would like the file structure to follow your navigation (in other
    words, changes of directory on the right will be reflected in the file structure
    view). In this case, go to the Option/Configure file manager menu and then, in
    the Others section, click on the corresponding case.


    The option Show small images is one of the options that you cannot do without
    once you have tried: if you select it and you browse in a directory that contains
    images, you will see a little image instead of the normal image icon, giving you
    a preview of images. Finally, the HTML option enables you to choose whether you
    consider KFM a Web browser or not. For example: type /home/html/ in the bar (which
    supports completion). If HTML is selected, the web document index.html of this
    directory will be displayed, as with a Web browser. If HTML is not selected, then
    the list of files in the directory will be displayed.


    The following 4 options enable you to choose the display mode: Big icons, Small
    icons, Text and Detailed. The Text and Detailed modes are very similar and the
    equivalent of the ls -l command of the shell: you can see (from right to left)
    the file name, the associated permissions, the owner and the group the file belongs,
    the size and the time and date of latest modification.


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_44_0.png)


    ### Creation and manipulation of files and folders


    Using KFM, you can manipulate the files and folders as you wish. Also, you will
    no longer need to use text commands.


    You can move or copy files using drag and drop. To create a new element such as
    a directory, click with the right button and choose *New*.


    ### Searching for files


    There is a utility, accessible via the K menu or via *File/Search* in KFM, which
    enables you to search for files. It allows wildcards and enables you to search
    easily with simple criteria such as date of creation or contents.


    ## 4.6 Customizing the desktop


    ### Customizing the K menu


    ### KDE Control Centre


    The *KDE Control Centre* is the place where you can customize and set up the graphical
    interface.


    You can get to the KDE control centre via the K menu. The *Configuration* menu
    is a shortcut to the different areas of the control centre.


    The control centre is made up of 8 items grouping the options together, thematically.
    We shall look at these options.


    ### The Applications menu


    This will enable you to set up some key *KDE* applications.


    The connection manager is only accessible as the *root* user. It allows you to
    manage the different options of *KDM*, the KDE graphical connection manager. In
    the first window, you will be able to choose the welcome message and the language
    used for these messages (choose English). The following tabs enable you to choose
    the font, the background and whether to list the users or not.


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_46_0.png)


    We won''t return to the File manager and Web browser; these are the same parameters
    as those which you accessed from the Options menu of KFM (Configure the browser
    and Configure the file manager sections).


    In the Panel menu, you can define the position of the task bar or the panel. The
    Options tab enables you to choose the presence or non-presence of the information
    bubble in the K menu or the masking of the task bar. You will also find a Display
    the time in Internet beats option that we shall leave you to try out! The Desktop
    tab is very interesting: it enables you to choose the number of virtual desktops
    that you would like to have, and to rename them. By default, 4 desktops are present.
    To add another, modify the position of the visible cursor. The size cursor enables
    you to modify the size of the display reserved for the panel on each desktop.
    Finally, the last tab is the Disk Navigator which we talked about above.


    ### The Desktop menu


    In this menu you will be able to change the appearance of your desktop.


    The background menu gives you a list of all the desktops and enables you to choose
    a background to apply. If you would like an imageless background, choose no wallpaper
    in the menu then set up your colors: one for a uniform background or two for a
    nice look. One click on the colour enables you to modify it and the configure
    button enables you to access the grading options. On the other hand, if you would
    like an image in the background, simply choose one from the pull-down wallpaper
    menu. If you cannot find any that you like, choose one by clicking on Browse (any
    JPEG can be used). If you regularly modify the look of your desktop, you will
    certainly hope the menu is easily accessible. For this, check the option Insert
    in the panel. An icon is inserted on the left of the panel; simply click on it
    to access this menu. If you really like to change it, check the option random.


    In the Border menu, you can choose to activate the borders of each desktop. This
    means that if you move to the left of the desktop (for example) and you continue
    to go left, the desktop will appear to follow you. You can therefore move a window
    from one desktop to another in this way. The magic borders delimit an attraction
    zone where the window will be stuck to the border or to the nearest window. For
    example, set the attraction to 40 pixels. Take a window and move it towards a
    border. In one move, you will see that it becomes stuck to the border: you have
    entered the attraction zone.


    The Color menu enables you to choose this aspect of the bars. Certain choices
    have been preconfigured.


    The Font menu works on the same principle by enabling you to modify the fonts
    used.


    The desktop has an imaginary grid on which the icons are positioned. In the Icon
    menu, you can modify the size of this grid to make the icons more or less spaced
    out. In addition, you can check the Transparent text for desktop icons option
    to avoid the icons name not being displayed in a background which is different
    to that of the desktop.


    To set up the screen saver, go to corresponding menu. It is possible to demand
    a password every time the screen saver is displayed. Do not modify the Priority
    zone which should remain on Elevated!


    Finally, go to the Style menu to give a MacOS style to KDE.


    ### Information menu


    The Information menu offers you a simple and efficient way of finding information
    on your computer (IRQ, DMA, ...). Among the most interesting information is State
    of Samba

    '
  mdcn: '


    ## 4.5. 文件和文件夹管理


    磁盘导航器窗口。关闭该窗口，在磁盘导航器菜单中选择“应用（Apply）”即可完成！


    使用此菜单可以节省宝贵的时间！


    ### KPanel 菜单


    面板是你在桌面底部看到的条目。除了 K 菜单和桌面列表外，你还可以添加想要包含的程序，以便轻松地启动它们。修改通过 KPanel 菜单进行。要添加项目，请选择“添加应用程序（Add
    an application）”，然后选择所需的应用程序（你也可以选择一个组）。应用程序将被添加到面板中。在图标上点击右键可以移动或删除它。**“配置（Configure）”**选项允许你像在
    KDE 控制中心中一样访问面板的配置窗口。**


    ## 4.5 文件和文件夹管理


    KDE 通过为你提供一个简单且可自定义的界面来导航系统文件结构，使得搜索和使用计算机中的所有资源变得更加简单。


    ### KFM 菜单的展示


    KFM 是你将用于探索系统的程序名称。它由菜单（文件、编辑、...）、工具栏、栏条和状态栏组成。


    栏条显示当前目录。它以 `file:/xxx` 的形式给出，与网络浏览器相同。


    “文件”和“编辑”菜单非常经典，允许你对文件执行常规操作（创建、搜索、剪切和粘贴、...）。“视图（View）”菜单允许你设置 KFM 的显示方式。使用“跳转（Go）”菜单，你可以浏览历史记录。在“书签（Bookmark）”菜单中，你可以保存你的喜好，无论是本地文件还是互联网网站。**“缓存（Cache）”**和**“选项（Options）”**菜单允许你精确配置你的
    KFM 浏览器。


    ### 可的各种视图


    “视图”菜单允许你设置浏览器的显示模式。当看到名称旁边有一个交叉号时，表示该选项已被选中。


    隐藏文件是以句号开头名称的文件：通常是你的程序的配置文件。如果你想查看它们，请点击“显示隐藏文件（Show hidden files）”选项。文件结构选项在左侧显示三个名称：根目录（Root）、主目录（Home）和桌面（Desktop）。第一个实际上是目录
    `""`，第二个是目录 `/home` 的快捷方式，最后一个是你的子目录 `Desktop`。点击每个名称左侧的三角形。这允许你在不更新右侧部分的情况下打开文件结构。这对于复制文件非常实用。另一方面，如果你点击名称，只有右侧部分会更新。你可能希望文件结构跟随你的导航（换句话说，右侧目录的变化将反映在文件结构视图中）。在这种情况下，进入“选项/配置文件管理器（Option/Configure
    file manager）”菜单，然后在“其他（Others）”部分点击相应的复框。


    **“显示小图像（Show small images）”**选项是你尝试过后必不可少的选项之一：如果你选中它并浏览到一个包含图片的目录，你将看到一个小图像而不是普通的图像图标，从而提供图像预览。最后，**“HTML”**选项允许你选择是否将
    KFM 视为网络浏览器。例如：在栏条中输入 `/home/html/`（支持自动补全）。如果选择了 HTML，将显示该目录的 Web 文索引 `index.html`，就像网络浏览器一样。如果没有选择
    HTML，则将显示目录中的文件列表。


    以下 4 个选项允许你选择显示模式：**大图标（Big icons）**、**小图标（Small icons）**、**文本（Text）**和**详细（Detailed）**。“文本”和“详细”模式非常相似，等同于
    shell 中的 `ls -l` 命令：你可以（从右到左）看到文件名、关联权限、所有者和文件所属组、大小以及最后修改的时间和日期。


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_44_0.png)


    ### 文件和文件夹的创建与操作


    使用 KFM，你可以移动或删除图标。如果你选中了它并浏览到一个包含图片的目录，你将看到一个小图像而不是普通的图像图标，从而提供图像预览。此外，你可以通过拖拽操作文件和文件夹。要创建一个元素，在图标上点击右键并选择**“新建（New）”**。


    ### 搜索文件


    **“搜索（Search）”**允许你通过通配符在文件来查找文件。在这种情况下，进入**“选项/配置文件管理器（Option/Configure file
    manager）”**菜单，然后在“其他（Others）”部分点击相应的复框。


    ## 4.6 自定义桌面


    ### 自定义桌面


    KDE 允许你自定义你的桌面。


    ### 应用程序


    **“应用程序（Applications）”**菜单允许你管理这些程序。


    ### 控制中心


    **“控制中心（Control Centre）”**允许你访问设置界面。


    ### 面板


    **“面板（Panel）”**菜单允许你管理面板条目。


    ### 文件


    **“文件（File）”**菜单允许你执行常规操作。


    ### 视图


    **“视图（View）”**菜单允许你设置显示模式。


    ### 选项


    **“选项（Options）”**菜单允许你配置浏览器。


    '
