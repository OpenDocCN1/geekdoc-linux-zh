    # CHAPTER 4. DISCOVER KDE


    if you have Samba installed on your computer and X Server which reminds you of
    the set up of your display.


    ## The Keys menu


    The Global Shortcut and Standard Shortcut menus enable you to modify the keyboard
    shortcuts for the elements of the desktop and for the KDE menus (notably KFM menus)
    respectively.


    ## The Window menu


    The Advanced menu will enable you to define the behaviour of the standard keyboard
    shortcuts which are Ctrl+Tab and Alt+Tab. We advise that you leave the Capture
    right mouse button option ticked for correct functioning of non-KDE applications.
    The filters have a limited use and are furthermore complex because you need to
    know well how the X server are part of a class (for example, the terminal is part
    of the XTerm class). The filters enable you to modify the aspect of windows according
    to their class or title. To add a filter, select an action in the pull-down menu,
    type the title or class of the window then click on + add it to the list.


    The Buttons menu enables you to customize the position of buttons on windows.
    You can modify their location so that, for example, you don''t close a window
    when you are trying to enlarge it (by default, these two buttons are next to each
    other).


    > 1 Samba is a program which allows your computer to behave like a server for
    Microsoft clients.


    ## 4.6. CUSTOMIZING THE DESKTOP 35


    To specify the behaviour of the mouse with respect to windows, go to the Mouse
    menu. You can control a number of important parameters. For example: open two
    windows on the same desktop and cover one with the other. Suppose that the active
    option-middle button contains Place beneath. Now click on the task bar of the
    title of the active window with the right mouse button: this one now moves behind
    the other! You can thus precisely configure your mouse to gain in efficiency.


    The Property menu is one of the most interesting. You can choose if you would
    like to see the contents of a window when you resize or move it, or not. But most
    importantly, you can define a window placement and focus management policy. The
    window placement management menu has five options of which the aim is to enable
    you to choose how the new window will be placed on the desktop. If you choose
    Intelligent, a new window will be placed on the desktop in such a way that it
    overlaps other windows as little as possible. Cascade places the windows each
    shifted from the others. The Manual mode displays a cursor; click to position
    the window. The Interactive option is a cross between Intelligent and Manual:
    if the new window does not cover the others "too much" (the value of overlap allowed)
    enables you to define what you consider "too much!", it will be placed automatically;
    otherwise, a cursor appears.


    The choice of focus is important, as this defines what action is produced when
    the mouse passes over a window behind another. There are 4 possible choices


    ## Click to have focus


    Click on the window to make it active and move it to the foreground.


    # CHAPTER 4. DISCOVER KDE


    ## The focus follows the mouse


    The active window is the window in which the cursor can be found, but it stays
    underneath


    ## The classic focus follows the mouse


    Same behaviour as previous the Alt+Tab combination allows you to pass from window
    to another.


    ## Classic focus released


    Idem, but if the cursor leaves the window, the window remains active whilst the
    cursor is not in another window.


    Finally, the Title bar menu enables you to choose how the title bar will be displayed
    and what happens when it is double-clicked.


    ## KFM: setting up KFM


    KFM can be configured via the Option menu of the file manager. You will find the
    option of changing the font or of choosing the colour of links. An interesting
    option is file structure view following browsing, which enables you to maintain
    coherence between the left and right parts of KFM (in file structure mode).


    ## 4.7 Advanced use of KDE


    ## KFM


    ## MIME Types and Applications


    KFM is based on the Internet standards for handling file types. The principle
    of MIME is to associate a type, indicated primarily by the file extension(s) of
    corresponding files, to an application. In this way, you can read a file by opening
    the corresponding program with one click! Certain types are predefined but you
    can modify them or add new ones. To do this, go to Edition/MIME Type. They are
    ordered thematically.


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d3962_52.png)


    For example, let''s take the creation of a new type. By default, no application
    has been set.


    ## 4.7. ADVANCED USE OF KDE


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d3962_54.png)


    ## Management of bookmarks


    KFM provides a simple environment for managing your bookmarks. These bookmarks
    could be either local files or Internet addresses. To add the address of the current
    page to the bookmark, go to the Bookmarks menu then choose Add bookmark.


    In KFM, a bookmark is just a file in the /home/your_login/.kde/share/apps/kfm/bookmarks
    (which is the menu that you can access via the Bookmarks/Modify menu) which you
    can edit as a normal file.


    To order bookmarks, simply create a subdirectory in the /home/your_login/.kde/share/apps/kfm/bookmarks
    directory, then move files into this directory.


    ## Configure the browser


    The Options/Configure menu of the KFM browser enables you to configure certain
    points specific to the Internet. You can indicate the address of a proxy server
    under the first tab. We advise that you don''t modify the second which should
    be correct for the majority of sites. The user agent defines the string which
    will be sent by the browser when a web site requires an identifier. By default,
    KFM sends "Konqueror" but you can modify this. Type the address of the web on
    which you would like to carry out the change, enter a new identifier (for example,
    "Mozilla" to change from KFM to Netscape Navigator), then click Add. Except for
    particular reasons, you shouldn''t need to change the default. The Cookies tab
    enables you to define a policy for the acceptance of cookies by default and according
    to domains.


    ## Browse the Web with KFM


    ## Principle


    KFM is an Internet browser which allows you to use the majority of Internet services
    (FTP, Web, ...). It supports Javascript and the latest versions of the HTML langauge.

    '
  mdcn: '


    # 第 4 章 探索 KDE


    如果你的电脑上安装了 Samba 以及 X Server，这会让你联起显示器的设置。


    ## 快捷键菜单（Keys menu）


    全局快捷键和标准快捷键菜单允许你分别修改桌面元素以及 KDE 菜单（特别是 KFM 菜单）的键盘快捷键。


    ## 窗口菜单（Window menu）


    高级菜单允许你定义标准快捷键 `Ctrl+Tab` 和 `Alt+Tab` 的行为。我们建议勾选“捕获右键”选项，以确保非 KDE 应用程序的正常运行。过滤器的用途有限，而且复杂性较强，因为你需要非常熟悉
    X Server 是如何属于某个类别的（例如，终端属于 XTerm 类）。过滤器允许你根据窗口的类或标题修改窗口的属性。要添加过滤器，请在下拉菜单中选择一个操作，输入窗口的标题或类，然后点击
    `+` 将其添加到列表中。按钮菜单（Buttons menu）允许你自定义窗口上按钮的位置。你可以修改它们的位置，例如，当你尝试放大窗口时，不会意外关闭窗口（默认情况下，这两个按钮是相邻的）。


    > 1 Samba 是一个允许你的计算机像微软客户端服务器一样运行的程序。


    ## 4.6. 自定义桌面 35


    要指定鼠标相对于窗口的行为，请进入鼠标菜单（Mouse menu）。你可以控制许多重要参数。例如：在同一个桌面上打开两个窗口并让一个覆盖另一个。假设活动选项的中间键被设置为“置于下方（Place
    beneath）”。现在用右键点击活动窗口标题的任务栏：这个窗口现在移动到另一个窗口的后面了！因此，你可以精确地配置鼠标以提高效率。


    属性菜单（Property menu）是最有趣的菜单之一。你可以选择在缩放或移动窗口时是否显示窗口内容。但最重要的是，你可以定义窗口的放置和焦点管理策略。窗口放置管理菜单有五个选项，其目标是允许你选择新窗口如何放置在桌面上。如果你选择“智能（Intelligent）”，新窗口将以尽可能减少与其他窗口重叠的方式放置在面上。“层叠（Cascade）”会将窗口彼此错开排列。“手动（Manual）”模式会显示光标；点击即可放置窗口。“交互（Interactive）”选项是智能和手动的结合：如果新窗口没有覆盖其他窗口“太多”（允许的重叠值），则允许你定义你认为的“太多”！它将自动放置；否则会出现光标。


    焦点的选择至关重要，因为这定义了当鼠标滑过另一个背后的窗口时会产生什么动作。有 4 种可能的选择。


    ## 点击以获得焦点


    点击窗口使其变为活动状态并移动到顶层。


    # 第 4 章 探索 KDE


    ## 焦点跟随鼠标


    活动窗口是光标可以所在的窗口，但它保持在下方。


    ## 经典的焦点跟随鼠标


    行为与上一个相同，`Alt+Tab` 组合键允许你在窗口之间切换。


    ## 经典式焦点释放（Classic focus released）


    同上，但如果光标离开窗口，只要光标不在在另一个窗口中，该窗口将保持活动状态。


    最后，标题栏菜单（Title bar menu）允许你选择标题栏的显示方式以及双击时发生的情况。


    ## KFM：设置 KFM


    可以通过文件管理器的“选项”菜单配置 KFM。你会发现更改字体或选择链接颜色的选项。一个有趣的选项是“浏览后跟踪文件结构视图”，它允许你保持 KFM 左右部分（在文件结构模式下）的一致性。


    ## 4.7 KDE 的高级用法


    ## KFM


    ## MIME 类型与应用程序


    KFM 基于处理文件类型的互联网标准。MIME 的原理是将类型（主要由文件扩展名指示）与应用程序相关联。通过这种方式，你只需点击一下即可通过打开相应的程序读取文件！某些类型是预定义的，但你可以修改它们或添加新的。要执行此操作，前往编辑/MIME
    类型。它们按主题排序。


    ![](img/b8bd4587c4dd67fa1a0b81ef3d962.png)


    例如，让我们创建一个新类型。默认情况下，没有设置应用程序。


    ## 4.7 KDE 的高级用法


    ![](img/b8bd4587c4dd67fa1a0b81ef3d962.png)


    ## 书签管理


    KFM 提供了一个管理书签的简单环境。这些书签可以是本地文件，也可以是互联网地址。要将当前页地址添加到书签，请前往书签菜单并选择“添加书签”。


    在 KFM 中，书签只是 `/home/your_login/.kde/share/apps/kfm/bookmarks` 中的一个文件（你可以通过书签/修改菜单访问该菜单），你可以像普通文件一样编辑它。


    要对书签排序，只需在 `/home/your_login/.kde/share/apps/kfm/bookmarks` 目录下创建一个子目录，然后将文件移动到该目录。


    ## 配置浏览器


    KFM 浏览器的选项/配置菜单允许你配置特定的互联网。你可以在第一个标签下指定代理服务器的地址。我们建议不要修改第二个标签，它对于大多数网站都是正确的。用户代理（user
    agent）定义了浏览器在网站需要标识符时发送的字符串。默认情况下，KFM 发“Konqueror”，但你可以修改它。输入你想执行更改的网络地址，输入一个新的标识符（例如，为了改为
    Netscape Navigator 输入“Mozilla”），然后点击添加。除非特殊原因，否则不需要更改默认。Cookies 标签允许你定义默认以及根据域接受
    Cookie 的策略。


    ## 使用 KFM 浏览网页


    ## 原理


    KFM 是一个互联网浏览器，允许你使用大多数互联网服务（FTP、Web、……）。它支持 Javascript 和最新版本的 HTML 语言。


    '
