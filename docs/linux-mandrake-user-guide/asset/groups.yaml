    默认使用的 shell 是 "Bash"Bourne Again Shell）。只需输入即可查看你正在使用的 shell：


    ```bash

    echo $SHELL

    ```


    注意每个 shell 都有自己的语法。我们建议使用 Bash shell，它既简单又强大。在 Linux-Mandrake 中，Bash shell 是默认
    shell。稍后的示例中使用这种 shell。


    ### 7.3 使用 Bash shell


    如果 shell 起初让你想到 DOS 系统，已经尽可能让命令输入变得简单。最实用的快捷键包括：


    - Ctrl+A 跳到行首。

    - Ctrl+U 清空当前行。

    - Ctrl+C 停止正在运行的任务。


    使用分号在同一行内输入多个命令。向上和向下箭头可以在命令历史中滚动。要无需遍历整个历史到达某个特定命令，输入：


    ```bash

    history

    ```


    将显示历史中的命令列表，每个命令旁边都有编号。要执行某个命令，输入：


    ```bash

    ! command_number

    ```


