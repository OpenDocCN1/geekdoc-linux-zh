    ## 7.3. USING THE BASH SHELL


    ### The su command


    It enables you to log on to the root account while you are in a user account.
    When you type su, the shell asks for the password for root. Type it then hit the
    Enter key: you are now in the root account. Type exit (or press Ctrl+D) to go
    back to the previous account.


    ### The cd command


    This command enables you to change directory (cd for change directory). It can
    handle both absolute and relative paths. For example, let''s imagine that you
    are in your personal directory and you want to go to the docs/ subdirectory. Just
    type (relative path):


    cd docs/


    To go to the /usr/bin directory, type (absolute path):


    cd /usr/bin/


    Some of this command''s practical options are:


    - - cd .. enables you to go back to the parent directory (beware of the space
    between cd and ..).

    - - cd - enables you to go back to the previous directory.

    - - cd or cd ~ leads you to your personal directory.


    ### The ls command


    ls (for list) gives you a list of files in the current directory. Two options
    are generally used: -a to view hidden files and -l to look at long filenames.
    You can add the name of a directory at the end of the ls command line. For example:


    ```

    ls -al /usr/X11R6/bin/

    ```


    Type:


    ```

    man ls

    ```


    to find out all the available options of the ls command.


    ### The rm command


    This is used to delete a file.


    > Warning: once the file is deleted, there is no way of getting it back!


    Syntax:


    ```

    rm file_name

    ```


    This command accepts wildcards. The most frequent options are: -i which asks for
    confirmation before deleting a file and -r to erase files from a directory recursively.


    Example:


    ```

    rm -i ~/html/*.html

    ```


    erases all HTML files of the html/ subdirectory of your home directory.


    ### The mkdir and rmdir commands


    The mkdir command enables you to create a directory, while the rmdir command deletes
    it if it is empty.


    Syntax:


    ```

    mkdir directory_name

    rmdir directory_name

    ```


    The rmdir command is often replaced by rm -rf which enables you to delete a directory,
    even if it is not empty. Use with care!


    ### The more/less commands


    The more command enables you to read text page by page. It is very useful for
    looking at a file on your screen without modifying it.


    Type:


    ```

    more name_of_text_file

    ```


    Use q to quit.


    The less command (of which the name was chosen in position to "more") performs
    better, because it allows you to go back up the displayed list. Use the arrow
    keys for this.


    ### The grep command


    This command, which carries a large number of options, allows you to search for
    a string of characters in a file.


    Syntax:


    ```

    grep string file

    ```


    ### The ps command


    This command lists the running processes. The Command column gives the process''s
    name and the PID column gives its number (this is the number you have to use to
    kill a program via the kill command).


    Syntax:


    ```

    ps options

    ```


    The u option gives you more information and ax enables you to recognize processes
    that do not belong to you (such as those that are launched at the time of booting).


    ### The kill command


    If a program does not respond anymore, use this command to kill it.


    Syntax:


    ```

    kill PID_number

    ```


    In fact, the kill command sends a message to the program concerned, indicating
    that it must kill itself. Sometimes, you have to use kill-9 when the program does
    not respond anymore. The PID number is obtained with the ps command.


    Example:


    ```

    kill -9 354

    ```


    ### The tar command


    The tar command allows you to create or edit a Unix archive. Therefore, the syntax
    to include everything in a directory rep/ (and its subdirectories) is:


    ## 7.4. USING THE LINUX MULTITASKING SYSTEM


    Linux is a multitasking system and you can take advantage of this. The first method
    consists of launching the program in background. Note that some programs are interactive:
    nothing will happen if you launch them in background. To bring a program that
    was launched in background back to the foreground, type:


    ```

    fg program_name

    ```


    The second method consists of launching several sessions. In graphics mode, just
    press Alt and one of the keys between F1 and F6. A new login box appears and you
    can log into new session. To return to X(without closing the session), press Ctrl+Alt+F7.
    This method also enables you to work on another console if your console is no
    longer accessible and even to use of the computer''s reset button is very rare!


    ### 7.5 Output redirection


    One often wants to save the output of a program in order to process it. This is
    called output redirection.


    For example, if you want to record the output of the ls bin command in a file
    lsbin, type:


    ```

    ls /bin > ~/lsbin

    ```


    If the lsbin file already exists, its contents will be erased. To avoid this,
    type >> instead of > (this permits you to append the lsbin stream to the end of
    the lsbin file).


    ### 7.6 Understanding processes


    Generally, the contents of a file or a directory scroll too rapidly on your screen
    and you don''t have enough time to read them. A solution to this consists of saving
    the output of a command and then using the utility more to read it (more³ is a
    viewer that displays the text page by page). So, you should type:


    ```

    ls /bin > ~/lsbin

    more ~/lsbin

    ```


    Linux proposes a more "elegant" method. For this, we will use pipes. With this
    method, the output of one command is sent to the input of another command. This
    gives:


    ```

    ls /bin | more

    ```


    ```

    ls /bin | less

    ```


    Here, the output of the ls command is sent to more (or less) to be treated.


    You can combine different pipes to carry out complex procedures.


    A process is an independant program. For example, if you are using Netscape Navigator,
    a Netscape process is launched. This notion of process is crucial in Unix systems.


    The first process that is launched is init. Among other things, its role is to
    mount the file system and to launch getty

