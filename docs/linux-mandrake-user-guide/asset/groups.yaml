    ```


    If your machine operates as a router for one or more sub-networks, a routing daemon
    will spare you the fastidious task of setting up all the routes to all of the
    sub-networks on all the machines. Its role is to send out entries in the routing
    table to other machines.


    If you would like to send out entries of the routing table you will need to deactivate
    the option Do not send out any routes. If your machine also operates as a default
    gateway you can choose to send out the default routing table. This is the case,
    for example, if you use this machine to connect to the Internet and would like
    to send out the route to all the other machines.


    ## Search path for the machine name


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_122_0.png)


    The resolution of an IP address into a machine name can be carried out in three
    different ways:


    - 1. hosts: the system searches in the file /etc/hosts for an entry that corresponds
    to the IP address or the corresponding name and returns the result required. This
    is the simplest method and it is normally sufficient for a small network;


    - 2. DNS: the system interrogates remote name servers. The way in which the system
    interrogates servers has been explained earlier;


    - 3. NIS (Network Information System): see the following paragraph


    You can use or not whichever service you want and specify the order in which the
    services are consulted. If the first fails, the second takes over and so on. hosts
    DNS is the best compromise, at least you will not have to use NIS, as is the case
    with certain large Unix networks.


    ## NIS


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_123_0.png)


    NIS is a protocol invented by Sun Microsystems. It avoids information redundancy
    in, for example, "exporting" user accounts, services and more. If you would like
    to interrogate an existing NIS domain, you need to enter the domain name and the
    name or address of the server in the relevant fields. If you would like to create
    a NIS service, then consult the NIS-HOWTO.


    ## PPP/SLIP/PLIP


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_124_0.png)


    PPP, SLIP and PLIP are three network interfaces similar to Ethernet cards, but
    with the difference that they are not permanently active. This is why they have
    been given a dedicated section. The configuration of the SLIP and PLIP interfaces
    will not be discussed, partly because they are two interfaces that are not used
    much, and partly because their configurations are relatively simple. PPP interfaces,
    on the other hand, are very common:


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_125_0.png)


    This is the type of interface you need to choose if you would like to set up a
    connection to the Internet by modem. The serial port corresponding to the modem
    is designated by the file /dev/ttySx, where x represents the number of the serial
    port, /dev/ttyS0 corresponds to the first parallel port (COM1), etc.


    You will need to find out from the company you chose as your Internet service
    provider whether you use PAP, in which case you should activate the corresponding
    option and not fill in here the name of the connection and password. Then you
    need to click on Customize, which contains four tabs. The only options you need
    to modify are the following:


    - 1. the PAP tab (if you use PAP);


    - 2. in the Hardware tab, you can allow each user to activate or deactivate the
    interface.


