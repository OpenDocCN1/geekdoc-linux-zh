    The files /etc/profile and ~/.bash_profile serve to configure the work environment
    and the files /etc/bashrc and ~/.bashrc serve to define functions and aliases.
    The files /etc/profile and /etc/bashrc are the files which concern the global
    configuration of your computer and are valid for all the users that use this shell.
    The files which begin with a full stop are personal configuration files and apply
    uniquely to you.


