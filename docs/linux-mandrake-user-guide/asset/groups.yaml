    在安装过程中安装失败，你将在安装期间需要该文件。如果是，制作一个 LILO 引导软盘（按照说明操作）并使用它启动你的 Linux 系统。然后编辑 /etc/lilo.conf
    并插入 " "linear


    如果你的 Linux 分区被挂载在 /dev/hda，你应该有类似这样的内容：


    ```

    ，etc

    etc/

    linux


    重新安装文件 /etc/lilo.conf 例如：


    ```

    boot=/dev/hda

    map=/boot/map

    prompt

    timeout=50

    image=/boot/mlinuz

    label=linux

    read-only

    other=/dev/hda

    label=dos

    ```


    最后，根据文件 /etc/lilo.conf 重新安装 LILO。使用命令 /sbin/lilo。


    这（通常情况下）不会阻止你的 Linux 系统的运行。你可以在安装完成后以后设置配置。


