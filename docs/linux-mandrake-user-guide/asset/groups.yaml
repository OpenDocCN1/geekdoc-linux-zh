    ## 5.4. MANAGE YOUR SYSTEM


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_64_0.png)


    To uninstall a program, it is suffice to select it choose Uninstall then to confirm.
    You can select several to uninstall a number at the same time. To do this, you
    must activate multiple selection mode, which you can find in the Packages menu.


    There are two methods for installing a program. The first consists of simply clicking
    the program that you would like to install from the KFM file manager. The KPackage
    installation window will appear and you should then click on Install. The second
    method is to launch the KPackage program. Go to the Options menu and choose Install
    non-installed RPM packages. You can indicate several different places, notably
    FTP sites. If you install programs from the Linux-Mandra CD-ROM, type in /mnt/cdrom/Mandra/RPM
    then tick the option Used. Exit the dialogue box and choose Reload in the File
    menu. The installed packages are preceded by the letter N. You can then easily
    install new packages!


    # 50 CHAPTER 5. THE KDE PROGRAMS


    The Option menu allows you to select the view that you would like (all programs,
    only those installed or only for those not installed). To speed up the search
    for information on packages, KPackage uses a cache. It is possible to deactivate
    it.


    Thanks to KPackage, you have the use of simple and efficient tool for managing
    your Linux-Mandandra system.


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_65_0.png)


    # The processes: KPM and KDE TaskManager


    KDE TaskManager, which you will find in the System menu, allows you to see a list
    of the processes that are running. You can easily kill a process (kill task) or
    see the tree structure of processes running.


    Kpm, which can be found in the Utilities menu, gives you the same information
    but in a form that is a little different.


    ## 5.4. MANAGE YOUR SYSTEM


    You can therefore choose the one that you find to your liking!


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_66_0.png)


    # Disk space: kddfree


    KDFree displays the percentage of space occupied on each drive that has mounted.


    # 52 CHAPTER 5. THE KDE PROGRAMS


    # Runlevels: ksysv


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_67_0.png)


    The SysV Init editor is a program that allows you to choose the daemons which
    are launched in the background. You will need to be the superuser (root) to be
    able to use it. It is in the form of two series of services. On the left, you
    will see a list of installed services. On the right, you have, at the top, the
    services that have been started and below those which have stopped, for each runlevel.
    For example, at level 6 (computer reboot), all the services are stopped with the
    exception of reboot. The interesting runlevels are 3 and 5 (the default level)
    and the entirely graphical level, respectively). Suppose that you do not want
    the gpm service to be launched when you are at level 5. You will just need to
    pick it up with the mouse and drag it to the *Stop* zone. This tool is very easy
    to use but pay attention to what you do otherwise you may have booting problems!


    # Character font management


    The character font manager is a tool which enables you to manage the fonts which
    are installed on your system.


    # Management of print files


    If you own a printer (either local or on the network), you can handle the print
    queue using the *Print file* program. When you launch it, you will see a list
    of items in the queue. To delete an item, select it and then click on *Remove*.
    You can also move an urgent item "to the front of the queue" by choosing *To the
    front*.


    # Chapter 6


    # GNOME: the GNOME Network Object Model Environment


    ## 6.1 Introduction


    GNOME is a project initialized by Miguel DE ICAZA, with the support of the GNU
    project, which made of GNOME its desktop environment. Its aim is similar to that
    of the KDE project: to create a full graphical environment and define a series
    of driving lines that other applications can follow in order to be "GNOME compatible".


    GNOME is much more recent than KDE, but its development was much quicker. It is
    already an environment rich in functionality and superior to KDE in certain areas,
    but it lacks maturity and above all compatible applications.


