    # Chapter 2


    # # Installing Linux-Mandrake


    This chapter complements the Install Guide. It details the procedures for installing
    from NFS, FTP, HTTP and a hard disk and shows you how to resolve several problems.


    If your computer allows you to boot from the CD-ROM, do it; otherwise, start with
    the boot disk.


    Note: in certain cases, you will have to force your machine''s BIOS to start on
    the disk drive.


    You should see a welcome screen. Click on Enter to continue. You could also choose
    to start in "expert" mode. To do this, type "expert". Expert mode enables you
    to enter by hand all the machine parameters (no automatic detection).


    A minimal Linux will be launched. It will detect your system''s resources and
    act as a base for the remainder of the installation.'
- md: '

    ## CHAPTER 2. INSTALLING LINUX-MANDRAKE


    In this chapter, we have indicated the important points concerning installations
    from sources which are not the CD-ROM. The majority of steps are the same. You
    should therefore refer to the Install Guide to find the relevant details.


    ### 2.1 Installation disk


    When installing from sources other than the CD-ROM, you will need boot disks.
    The images of these disks can be found on the CD-ROM in the directory \images.
    Use the rawrite program to create them under Windows.


    All the necessary utilities can be found in the \dosutils and \images directories
    of the installation CD-ROM.


    First of all, you need to use DOS or Windows. In Windows, click on Start -> Execute
    -> Command. You will see a DOS window displayed on the screen.


    Insert the Linux-Mandrake installation CD-ROM. In the following section, we suppose
    that your CD-ROM drive is D:. Replace D: with the letter of your CD-ROM drive,
    if necessary.


    Insert a clean, formatted disk in the disk drive. Type:


    ```

    D:\dosutils\rawrite.exe

    ```


    You will be asked for the source. The files can be found in the directory \images.
    If you would like to create a boot disk for an installation from CD-ROM or hard
    disk, you will need the image boot.img, otherwise you will need the image pcmcia.img.


    Then type:


    ```

    D:\images\boot.img

    ```


    or


    D:\images\pcmia.img


    For the target, type A:, followed by Enter.

    The desired image will be copied onto your disk. The two boot disks enable you
    to start the computer and to initialize the installation procedure.

    If your computer ignores the disk, on start-up, you will need to modify your computer''s
    BIOS. Modify the boot sequence to: CDROM, A, C.


    ### 2.2 Take PCMIA ports into account


    If you are installing Linux-Mandrake from a portable, and you use PCMIA peripherals
    which are used in the installation (CD-ROM SCSI or Ethernet network card for an
    NFS installation for example), you should attempt to detect them. So reply yes
    to the question "Use your PCMIA peripherals?".


    Note that this only concerns the peripherals which will be used during the installation
    of Linux-Mandrake. Your PCMIA peripherals will always be recognized by your newly
    installed Linux system.


    ### 2.3 Choice of installation method


    You can choose between five different installation methods. Of course, if you
    install the PowerPack version of Linux-Mandrake, you will certainly use the CD-ROM
    installation. Select one of these methods for installation of Linux-Mandrake:


    - 1. Local CD-ROM: this is the ideal method if you own a CD-ROM drive. For more
    information consult the Install Guide.

    - 2. NFS Image: this method can be used if you have access to an NFS (Network
    File System) server which contains Linux-Mandrake on your local network.

    - 3. Hard disk: use this method if you have the Linux-Mandrake CD-ROM copied onto
    a hard disk present on your machine. This method will require the additional installation
    disk.

    - 4. FTP: if you have a high access rate to a distant FTP server holding the Linux-Mandrake
    distribution, use this method. This method will also require the use of the additional
    installation disk.

    - 5. SMB Image: use this method if you install Linux-Mandrake from a volume shared
    with Microsoft Windows. This method again requires the use of the additional installation
    disk.

    - 6. Installing from an NFS image: if you have at your disposal, within a local
    network to which you are connected, an NFS server containing Linux-Mandrake, you
    can install it directly via the network. Note that this procedure will be slower
    than installing from a local CD-ROM.


    #### Installing via NFS


    If you choose this method, the installation procedure will search for your network
    card and initialize it first. It will attempt to detect the card automatically
    first. If this fails, you will have to specify the type and parameters of your
    card.


    For example, for an ISA NE2000 compatible Ethernet card, you will need to specify:


    - that you have a NE2000 compatible card

    - its parameters: base address (e.g. 0x300) and IRQ (e.g. 5)


    If your card is not detected, you will not be able to use this method of installation
    via NFS. As soon as your card is recognized, you will have the choice of several
    methods of installation by NFS:


    Choose the appropriate method: static IP address, DHCP or BOOTP.


    - 1. Static IP address: choose this method if you have access to a NFS server
    for which you know all the characteristics (IP address, location of Mandrake files...)

    - 2. BOOTP: this method uses the "BOOTP" protocol.

    - 3. DHCP: this method uses the "DHCP" protocol (Dynamic Host Configuration Protocol)


    If you use one of the two latter methods, the installation procedure must be able
    to automatically detect an active and correctly configured BOOTP or DHCP server.

    If you use the first method, you have to enter a series of parameters:


    - IP address: enter the IP address of your machine.

    - Network mask: enter the network mask of your machine.

    - Default gateway: enter the default gateway.

    - Domain name: enter the domain name.

    - DNS server: enter the DNS server address.


    ### 2.4. PROBLEMS–WHO TO CONTACT?


    Different sorts of problems may occur during installation. Differing in degrees
    of seriousness, they range from a simple unrecognized card problem—which won''t
    necessarily stop the installation—to the pure and simple crash (very rare!). For
    each case, these are the correct steps to take:


    #### Different problems that may occur (non exhaustive list)


    You aren’t able to start the installation procedure


    Depending on the method of installation you use, there may be several reasons
    for this. If you are installing directly from a CD-ROM drive, check whether your
    computer allows you to boot in this way, if not, use a floppy disk. In any case,
    make sure that your computer is going to boot from the specified device: this
    can be controlled by the BIOS set up of your computer (hit the delete key when
    booting, or in some cases "F1").


    You should also check that the CD-ROM is not damaged. If you have any doubts about
    the integrity of your physical disk support, whether it be the disk or CD-ROM,
    contact your retailer.


    If you can’t start the installation procedure with the installation floppy disk,
    it too may be damaged. Try to make another one, using the disk image on the CD-ROM
    (boot.img file from the directory \images).


    Your network card is not recognized during FTP or a NFS installation


    In this case, you don’t have much choice: you will most certainly have to use
    the CD-ROM installation. Nevertheless, be sure of the characteristics of your
    network card (base address and IRQ) if you are prompted for these features.

    '
