    # Chapter 1


    # Foreword


    # 1.1 Linus Linux


    In 1991, Linus TORVALDS, at the time studying in Helsinki, Finland, created the
    very first version of Linux for his own needs. This very rudimentary program was
    intended to run on the PC 80386 of the age. But Linus TORVALDS had the good idea
    of making it "free" and to involve all those who wanted it. Thanks to the support
    of the emerging Internet network and the new-born community of developers, but
    also thanks to the pre-existence of the GNU project 1 started some years earlier
    by Richard STALLMAN, Linux went on to become some years later a full operating
    system. Its power is unrivalled, its stability is now legendary and it improves
    with every day!


    To make it easier to use, Linux is offered in the form of distributions, in other
    words, a set of coherent programs.


    > http://www.gnu.org/'
  - '[PAGE 13]


    # 1.2 Free software


    It is important to know that Linux is only the tip of an iceberg called "Free
    Software" 2/"Open Source"3. The particular characteristics of Free Software are
    as follows: free software can be redistributed at will and without cost, and it
    is modifiable by anyone sufficiently experienced in programming. This concept
    is used principally by the GPL (General Public License) and BSD-Licence (Berkeley
    Software Development) although these are not the only ones. Apart from Linux,
    a gem of Free Software is called "Apache"4 which is a web server program for the
    Internet and runs more than 50% of the web servers in the world. The majority
    of software which serves to make the Internet work (at all levels) is Free Software.


    # 1.3 Graphical interfaces


    For a while, Linux has only operated with "multi-window" graphical interfaces
    inherited from proprietary Unix systems. Entirely based on the "X Window System",
    they are named Mwm, Olwm, Fvwm, Afterstep. Towards the end of 1996, a small tem
    of developers brought together by Matthias ETRICH decided to aim higher and to
    create a true graphical desktop having advanced functions such as "drag-and-drop",
    with integrated HTML display. This set, called the "K Desktop Environment"5, or
    more simply "KDE", was a great success due to its high quality. KDE is the graphical


    > 2http://www.fsf.org/

    3http://www.opensource.org/

    4http://www.apache.org/

    5http://www.kde.org/'
  - '[PAGE 14]


    interface installed by default in the Mandrake distribution.


    The existence of multiple solutions is also an important aspect of free software.
    To this end, Linux-Mandrake is not only supplied with KDE, but also with a similar
    environment called GNOME. GNOME is a project that aims to create a graphical environment
    based on the graphics library GTK for which the technology relies on CORBA, a
    protocol for distributed objects.


    The two environments have their pros and their cons: with Linux-Mandrake, you
    can judge for yourself!


    # 1.4 Linux-Mandrake


    # The Concept


    The "Linux-Mandrake" distribution⁶ was born from a simple idea: to supply the
    user with a solid system base on an approved distribution, in simplifying use
    thanks to the addition of the most powerful graphical desktop available: the "K
    Desktop Environment", as well as a certain number of improvements and programs
    that avoid the need for the user to spend hours on searching on the Internet for
    the packages he might need to work efficiently and in an agreeable manner. We
    also think that Linux-Mandrake is also the simplest distribution to install and
    configure, and the quickest to get up and running. Looking ahead, we are convinced
    that your new Linux system will bring you much satisfaction. Nevertheless, bear
    in mind that Linux is not always used like other well-known operating systems
    and that to start with you will probably be put off. You will begin to appreciate
    the


    ```

    http://www.linux-mandrake.com/

    ```'
  - '[PAGE 15]


    phenomenal power of Linux from the moment you discover

    its coherence, its extraordinary dynamics linked with commu-

    nities on the Internet, but also the philosophy of Free

    Software and the new intellectual perspectives which it opens

    up.


    # 1.5 This manual...


    For your information, be aware that this manual was entirely

    created under Linux Mandrake with the following programs:

    KlyX, Emacs and LaTeX for the text editing, Gimp and gif2ps

    for image processing, and the psutils for setting it out before

    printing. All of these programs are Free Software.


    # 1.6 Acknowledgements


    we thank Linus TORVALDS and all those who contributed

    to the Linux kernel. Thanks equally to the GNU project and

    therefore, in particular, to Richard STALLMAN, without whom

    all this would have certainly never existed. Thanks to all

    the developers of Free Software, whether they made the

    or established engineers. We thank all those who made the

    formidable effort to document Linux (the HOWTOs) and the

    transators. Thanks to the entire KDE team for taking the

    initiative to create a true graphical desktop for Linux and

    above all for having the knowledge necessary to create such

    splendid software. Thanks in general to all those who are

    involved or have been involved closely or not with the Free

    Software movement. Finally thanks in particular to all those

    who, with their enthusiasm and their interest, have allowed

    Linux-Mandrake to exist and develop itself.'
