    ## 第1章


    ### 前言


    ### 1.1 Linus Linux


    1991年，当时在芬兰赫尔辛基学习的林斯·托瓦尔斯（Linus TORVALDS）为了自己的需求创建了第一个版本的 Linux。这个非常原始的程序旨在运行在当时的
    PC 80386 上。但林斯·托瓦尔斯有一个非常棒的想法，让它变得“免费”，并让所有想要它的人参与进来。得益于新兴互联网网络和新生的开发者社区的支持，也得益于理查德·斯尔曼（Richard
    STALLMAN）在几年前启动的 GNU 项目，Linux 在几年后变成了一个完整的操作系统。它的威力无与伦比的，它的稳定性现在已成为传奇，并且每天都在不断改进！


    为了方便使用，Linux 以发行版的形式提供，换句话说，是一组连贯的程序。


    > http://www.gnu.org/


    ### 1.2 自由软件


    重要的是，Linux 只是被称为“自由软件”2/"开源”3 的冰山一角。自由软件的特定特征如下：自由软件可以自由分发且无需费用，并允许任何足够经验的人员进行修改。


    ### 1.3 图形界面


    一段时间以来，Linux 只通过多窗口界面运行。到1996年底，大多数 Linux 服务器都是基于 X 的。


    > 2 http://www.gnu.org/

    > 3 http://www.opensource.org/

    > 4 http://www.apache.org/

    > 5 http://www.kde.org/

    > 6 http://www.linux-mandrake.com/


    ### 1.4 Linux-Mandrake


    ### 理念


    桌面环境 Linux-Mandrake 源于一个简单的想法：为用户提供一个坚实的基础，进行安装和配置，并且该发行版能够快速上手。展望未来，我们相信 Linux-Mandrake
    将带给你很多满意。尽管如此，请记住 Linux 并不像闭源系统那样使用。


    ### 1.5 本手册


    供您参考，请注意本手册完全是在 Mandrake 环境下使用以下程序创建的：用于文本编辑的 LyX 和 Emacs，用于图像处理的imp 以及用于排版的 psutils。


    ### 1.6 致谢


    我们感谢林斯·托瓦尔斯以及所有对 Linux 内核做出贡献的人。感谢 GNU 项目，因此特别感谢理查德·斯尔曼，没有他，这一切可能都不会存在。感谢所有自由软件开发者，无论他们是否是专业工程师。感谢所有为
    Linux 文档（HOWTOs）付出巨大努力的人以及翻译者。感谢整个 KDE 团队主动为 Linux 创建了真正的图形桌面，最重要的是感谢所有凭借热情和兴趣让
    Linux-Mandrake 存在并发展的人。


    ## 第2章


    ### 安装 Linux-Mandrake


    本章补充了安装指南。详细说明了从 NFS、FTP、HTTP 和硬盘安装的步骤，并向您展示如何解决一些问题。


    '
