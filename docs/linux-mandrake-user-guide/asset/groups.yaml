    /etc/rc.d/rcx.d/


    The scripts of the directory rcx are executed according to the runlevels. The
    contents of the rcx.d directories are very particular because these directories
    contain links to the services that are usable on your computer (contained in /etc/rc.d/init.d).
    If the name of the link begins with a K, the process is *Killed*;; otherwise,
    it is *Start*.


    We will take the example of the links of the directory rc0d. They are executed
    when the machine is stopped. Therefore you can see that all the services are stopped,
    except for the halt service.


    The contents of these directories can be changed by using the program ksysv.


    # /etc/rc.d/init.d/ and the management of services


    This directory contains a list of the daemons which you can use on your computer.
    This allows you to modify their behaviour on the fly, without having to restart
    the computer. All daemons use the same syntax. Type the name of the daemon to
    modify with an option that can be: **start to start** a daemon, **stop to stop**
    it, **restart to restart** it, **status to see** its state, and **reload to reload**
    it.


