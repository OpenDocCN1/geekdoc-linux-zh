  md: '# 5.4. MANAGE YOU SYSTEM


    # The mail viewer, Kmail


    Kmail is a high-performance, easy-to-use mail viewer. When you first launch it,
    a window will be opened to allow you to enter various parameters 3 of your mail
    account: name, electronic address, signature files. The Network tab allows you
    to choose the type of connection that you use to send and receive mail. For starters,
    Sendmail4 is not advised. Click on SMTP and indicate the address of your mail
    server. You will need to set up an in-box by clicking on Add. If you use Sendmail,
    you will need a local box; otherwise choose a POP3 box. In the latter case, you
    will simply need to fill in the details given to you by your ISP. The most important
    part of the setting up process is now finished. The remaining tabs deal with the
    ergonomics of your mail viewer.


    Kmail has all the features of a modern mail viewer: address book, filters, joint
    files, etc ... . Simple to use, it allows you to discover the huge benefits of
    e-mail exchange!


    # 5.4 Manage you system


    Even if you are not a computer administrator by profession, it is interesting
    to know how to do some basic operations. Under Linux-Mandrake, certain operations
    are accessible via the System menu.


    > ³In case of doubt, consult your ISP.


    > ⁴Sendmail is useful for important sites, handling thousands of messages every
    day. Sendmail is primarily known for its file configuration which is incredibly
    complex!'
