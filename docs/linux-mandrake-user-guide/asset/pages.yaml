  md: '# CHAPTER 8. SYSTEM ADMINISTRATION


    Let’s see the available options.


    # Install a program


    A program can be installed using the option -i. For example, to install the program
    KLyX, type:


    ```

    rpm -ivh klyx-0.9a-f13.rpm

    ```


    Your program is installed and is ready for use immediately! The options v (verbal
    mode) et h (progress) are optional and allow you to see the progress of the installation.


    # Update a program


    To update a program by installing a more recent version, you should use U instead
    of i. Thus, all your configuration files will be saved.


    # Uninstall a program


    Should you wish to delete a program, use the option e, as in extract. Type:


    ```

    rpm -e program_name

    ```


    The program will thus be deleted immediately.


    # Verify a program


    Verification allows you to check if all the files of a program are present For
    this, type:


    ```

    rpm -V program_name

    ```'
