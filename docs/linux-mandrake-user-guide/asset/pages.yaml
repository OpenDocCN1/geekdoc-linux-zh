  md: '# 4.7. ADVANCED USE OF KDE


    # Viewing a Web page, downloading a file


    To view a web page, just type the of the page in the bar of KFM!


    In the same way, you can access the MandrakeSoft FTP site by typing: ftp://ftp.linux-andraandrake.com.
    By default, KFM makes an anonymous connection to the site. If you have a valid
    account on the FTP site, you can use your login by typing and address of the form:
    ftp://username@ftp.domaine.extension. KFM will ask you for your password.


    # Launching programs on start-up


    There is a universal way to start programs on start-up: modify the file ~/.bash_profile
    and ~/.xinitrc. Luckily, under KDE, you can just place a link to the program that
    you would like to launch in the StartUp directory which you will see on the desktop.


    # Mount the disk drive or CD-ROM drive


    There exist, on the desktop, two shortcuts, one to the disk drive and one to the
    CD-ROM drive.


    Usually, in order to be able to access the information on a disk, formatted in
    ext2 format, the standard file format for Linux, or on a CD-ROM, you will have
    to mount the appropriate drive.


    If the disk is in DOS format, use mtools. Type man mtools for more details on
    this subject. The best known DOS commands are preceded by the letter m. In a few
    words, you should type mdir a: to display the contents of the disk. Some relevant
    commands are: mdir, mformat, mcopy, mdel.'
  merge: -1
