    # The Window menu


    The Advanced menu will enable you to define the behaviour of the standard keyboard
    shortcuts which are Ctrl+Tab and Alt+Tab. We advise that you leave the Capture
    right mouse button option ticked for correct functionning of non-KDE applications.
