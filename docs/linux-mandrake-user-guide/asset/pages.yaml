    KFM can be configured via the Option menu of the file manager. You will find the
    option of changing the font or of choosing the colour of links. An interesting
    option is file structure view following browsing, which enables you to maintain
    coherence between the left and right parts of KFM (in file structure mode).


    # 4.7 Advanced use of KDE


