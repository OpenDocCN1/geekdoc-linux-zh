    # Configure the browser


    The Options/Configure menu of the KFM browser enables you to configure certain
    points specific to the Internet. You can indicate the address of a proxy server
    under the first tab. We advise that you don''t modify the second which should
    be correct for the majority of sites. The user agent defines the string which
    will be sent by the browser when a web site requires an identifier. By default,
    KFM sends "Konqueror" but you can modify this. Type the address of the web on
    which you would like to carry out the change, enter a new identifier (for example,
    "Mozilla") to change from KFM to Netscape Navigator), then click Add. Except for
    particular reasons, you shouldn''t need to change the default. The Cookies tab
    enables you to define a policy for the acceptance of cookies by default and according
    to domains.


