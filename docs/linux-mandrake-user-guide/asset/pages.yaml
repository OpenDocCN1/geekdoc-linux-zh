  md: '# Chapter 11


    # Glossary


    We have collected in this part an explanation of various terms, both those that
    are specific to Linux and those that are general.


    Account :


    Linux-Mandrake organizes the users by attributing to each user an account on the
    machine. An account is a collection of parameters (personal directory, login,
    alias, shell with its variables, etc ...) which constitutes your work environment.


    Alias :


    Aliases are abbreviations of commands. In general, you can abbreviate shell commands.
    To create a new alias, type: alias alias_name=''command''. See the relevant paragraph
    in the manual.'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# CHAPTER 11. GLOSSARY


    # Binary :


    Programs are said to be in a binary form when they are directly executable by
    the computer. The binary format is derived from the source code through compilation
    of the program.


    # Boot :


    The rebooting procedure. During this procedure, the kernel and modules well as
    the services are loaded, after which you can access the system.


    # Compilation :


    Action that consists of creating from the source code a binary program that can
    be interpreted directly by the computer. Gcc is the most widely used compiler
    under Linux.


    # Console :


    Non graphical Linux interface. The console mode is used by servers and by Linux
    experts. .


    # Daemons :


    See Services.


    # Dependencies :


    Under Linux-Mandrake, it is common, that in order for one program to run, it needs
    other programs or other libraries. We therefore say that this program depends
    on another. The RPM format handles these interdependencies and will not allow
    you to install a program if you'
  merge: -1
  pgno: 149
- img_proc: true
  md: 'have not installed the programs that are vital for it to run properly¹.


    # ELF :


    Standard Linux program binary format. This replaces the old a.out format, which
    is now obsolete.


    # Emacs :


    Very powerful text editor. Its great strength lies in the possibility of creating
    extensions due to the LISP language.


    # Ethernet :


    Protocol for communication between computers on a local network. Via Ethernet,
    communications can take place at a maximum rate of 10 Mbits/s. Two more evolved
    protocols, FastEthernet and GigaEthernet, allow communication at 100 Mbits/s and
    1000 Mbits/s respectively.


    # Ext2 :


    ext2 is the Linux file system. Its features include permission management, high
    availability and management of quotas.


    # FTP :


    File Transfer Protocol. Protocol used to send and receive files. The base ftp
    program is a text mode program but there are numerous graphical versions.


    > ¹http://www.opensource.org/'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# CHAPTER 11. GLOSSARY


    # GNU :


    The Free Software Foundation project carries the name of GNU ("GNU is Not Unix").
    The aim is to rebuild a full computer environment in the form of free software.
    GNU''s highlight software is the gcc compiler. Although Linux borrows a lot from
    the GNU project, it is not part of it.


    # Home :


    Personal directory. Each user of Linux-Mandrake will be attributed a personal
    directory that is a sub-directory of /home.


    # KDE :


    The K Desktop Environment is the default desktop for Linux-Mandrake. Therefore,
    your desktop is easy to use, so that using the Linux-Mandrake system doesn''t
    require a long learning phase.


    # Kernel :


    The kernel is the heart of the Linux operating system. The 2.2.x kernel is the
    latest development of the kernel. It contains around 7 million lines of code and
    is still maintained by Linus TORVALDS.


    # Library :


    Library of code shared by different applications. It is the equivalent of DLL
    files under Microsoft Windows.


    # Link :


    A link is an entry pointing on another file. The best known are symbolic links:
    they allow you to refer to a file outside of its directory.'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Login :


    Authentification procedure. The system Linux-Mandrake being a multi-user one,
    it is necessary to identify yourself to the system in order to be able to access
    your rights and your parameters. The login procedure comprises two phases: the
    login name and the password.


    # Loopback :


    System that allows you to connect to your machine as it were a remote machine.
    Loopback is indispensable for good running of Linux.


    # MBR :


    Master Boot Record (or boot sector). The boot sector contains information on the
    systems that are bootable by the computer. LILO is the utility that writes the
    boot sector to allow you to load operating systems.


    # Mount point :


    A mount point is a directory attached to a peripheral. For example, the mount
    point of the CD-ROM drive is /mnt/cdrom.


    # Mounting :


    In order for Linux to be able to use a peripheral, it has to be visible to the
    system. We therefore talk about "mounting" of a peripheral.


    # Multiprocessing :


    This means that the computer has more than one processor. The kernel 2.2.x has
    vastly improved multiprocessor system (MPS) support.'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# NFS :


    Network File System. Protocol that is used to share the same directory between
    several computers. The machine that owns the shared directory is called the "Host"
    and the others are clients.


    # OS :


    Operating system. The operating system is a program that makes the link between
    applications (such as Corel WordPerfect or Netscape) and the hardware part.


    # Path :


    Access path. The variable PATH describes the directories in which the shell must
    search to find programs. The echo $PATH command allows you to find out the input
    parameters (each directory is separated by a colon).


    # Pipe :


    The pipe (the | character) allows you to supply to one program the output of another.
    For example, ls | less, allows you to give the output of the ls command to the
    less program.


    # POSIX :


    Set of specifications given out by the Unix group, to ensure the compatibility
    of programs under different Unix systems. Linux-Mandrake is POSIX compatible.


    # Proc :


    In your file structure, you can see a directory called /proc. However, this directory
    does not exist on your'
  merge: -1
  pgno: 153
- img_proc: true
  md: Runlevels are used by the system to know which services to start and stop. Level
    3 is the default level. Level 6 corresponds to rebooting and level 0 to complete
    stop. It is possible to change the level by editing the file /etc/initstab.
  merge: -1
  pgno: 154
- img_proc: true
  md: '# Service :


    Also called *daemons*. Services are programs that run in the background to respond
    to precise requests. For example, the *telnetd* service responds to *telnet* requests.
    The list of programs that are available for use your computer is configurable
    and depends on how you will use your computer.


    # Shell :


    The shell is the name of the interface that delivers your commands to the kernel.
    There are several different shells, such as *bash*, C Shell, *zsh*, etc ... The
    *Bash* shell is the most widespread of these.


    # Source :


    The source code represents the program as the developer has written it, before
    any compilation. It is the source code that has be modified in order to tailor
    programs for a precise requirement.


    # Swap :


    *Linux* uses a virtual file on the disk to write data when the *RAM* memory is
    full. Unlike other operating systems, *Linux* uses a dedicated partition (called
    the swap partition) for this operation.


    # Telnet :


    Remote connection program. Telnet allows you to execute programs on a distant
    machine as if they were on your own machine and, possibly, to display the results
    on your own screen.'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# UNIX :


    Family of operating systems. All the Unix systems are multi-tasking and multi-users.
    Linux-Mandrake is a particular Unix system.


    # Vi :


    Text Editor. Being at the same time rudimentary and very powerful, it is difficult
    to access because it doesn''t have a graphical interface. In case of problems,
    it is often the only editor that is accessible. It is for this reason that any
    Linux system administrator must know how to use it!


    # Wildcards :


    Wildcards are used to replace strings of characters for certain search procedures.
    The * symbol is used to replace a string of characters and the ? symbol is used
    to replace a single character.


    # X Terminal :


    An X terminal is a computer that does not hold any data but which executes programs
    and stores data on a remote machine. X terminals allow you to use light configurations
    in terms of the necessary power.


    # X Window :


    Name of the set of programs and libraries that manage the graphical part. The
    version used by Linux is called XFree86.'
