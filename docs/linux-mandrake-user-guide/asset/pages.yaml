    # 4.5 File and folder management


    KDE makes a search for and use of all the resources of your computer easier by
    giving you a simple and customizable interface to navigate the file structure
    of your system.


    # Presentation of the KFM menus


    KFM is the name of the program you will use to explore your system. It is composed
    of menus (File, Edit,...), a tool bar, a bar and a state bar.


    The bar indicates the current directory. It is given in the form file:/xxx, in
    the same way as a Web browser.


    The File and Edit menus are very classic and enable you to carry out the normal
    operations on files (create, search,'
  merge: -1
