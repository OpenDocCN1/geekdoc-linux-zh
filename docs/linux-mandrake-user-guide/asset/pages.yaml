- img_proc: true
  md: '# 8.4 Installation procedure for Linux-Mandrake


    This paragraph is dedicated to a the approach used by Linux-Mandrake when you
    start the computer. You will find relevant information in the file /etc/inittab
    especially.


    # The boot


    When you start up Linux, the kernel checks the configuration of the computer.
    It displays various messages which you can receive using the command dmesg | less.
    Then it shows the root file system, which is indispensable for the rest of the
    procedure. Inability to mount this system leads to the famous message Kernel Panic
    which stops the computer.


    The first process to be launched is the init process. It launches, on start-up,
    other processes and numerous verifications. It is notably this process which will
    launch the mingetty programs on each console, that are used for the login programs
    procedure. When the machine is stopped, init will take care of killing all the
    processes that are running and de-mounting the file systems.


    # Runlevels


    A runlevel is a particular execution environment. Linux allows you to define several
    different environments. There are 7 of them.


    level 0 Shutdown of the computer.


    level 1 Single user mode. Only to be used in particular cases.'
  merge: -1
  pgno: 99
- img_proc: true
  md: '# 8.4. LINUX-MANDRAKE INSTALLATION 85


    level 2 Multi-user mode without sharing of directories through NFS.


    level 3 Normal runlevel in console mode.


    level 4 Not used.


    level 5 Normal runlevel in graphical mode.


    level 6 Computer reboot.


    It is strongly advised not to set any other runlevel other than 3 or 5 as the
    default. In all cases, never set the runlevel to 0 or 6: you will no longer be
    able to use your computer!


    # The file /etc/inittab


    This file contains the list of tasks to accomplish according to the execution
    level that you are in. The normal runlevel is either 3 (console mode) or 5 (graphical
    mode). Description of the file /etc/inittab.


    It appears in the following form (without the line numbers; the shape may vary
    according to your configuration:


    ```

    01 # Default mode:

    02 id:5:initdefault:

    03 # System initialization

    04 si::sysinit:/etc/rc.d/rc.sysinit

    05 10:0:wait:/etc/rc.d/rc 0

    06 11:1:wait:/etc/rc.d/rc 1

    07 12:2:wait:/etc/rc.d/rc 2

    08 13:3:wait:/etc/rc.d/rc 3

    09 14:4:wait:/etc/rc.d/rc 4

    10 15:5:wait:/etc/rc.d/rc 5

    ```'
  merge: -1
