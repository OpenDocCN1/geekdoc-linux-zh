    to turn your computer off.


    +   2. A faster version of the previous solution consists to press the Ctrl+Alt+Del
    keys simultaneously (as on DOS). Then, the system unmounts all the peripherals
    properly. Wait for the computer to reinitialize and then cut off the power.


