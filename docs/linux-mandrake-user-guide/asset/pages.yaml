  md: '# Chapter 3


    # Setting up Linux-Mandrake


    Once you have installed your Linux-Mandrake system, you may need to carry out
    a bit of fine tuning: for example, if you didn''t manage to install your video
    card or printer... You can also configure the services ("daemons") which run on
    your system. You have all the time you want to make these changes, once Linux-Mandrake
    has been installed.


    # 3.1 Reinstallation/configuration of LILO (LINux LOader)


    If you have to reinstall LILO for one reason or other, you need the /etc/lilo.conf
    file which describes the parameters of all the disks on your system that are recognized
    by Linux. If the installation of LILO failed during installation, you will need'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# 16 CHAPTER 3. SETTING UP LINUX-MANDRAKE


    to recreate this file. To do this, whilst root user¹, use an

    editor (kedit, jed, emacs, vi...) and edit /etc/lilo.conf.

    For example, with kedit, type kedit /etc/lilo.conf.


    Let''s look at an example: your system contains a Linux

    a and a DOS system on two partitions of your principal disk

    (/dev/hda). Here is the configuration file /etc/lilo.conf to

    create (for the 2.0.36 kernel):


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=50

    image=/boot/mlinuz

    label=linux

    root=/dev/hda1

    read-only

    other=/dev/hda

    label=dos

    table=/dev/hda

    ```


    Of course, you can modify these parameters according to

    your disk configuration (SCSI disks, several disks, etc.).


    To reinstall LILO from your new file /etc/lilo.conf,

    simple type /sbin/lilo. You will have a message similar

    to:


    Added linux * (this will be the system loaded by default)

    Added dos


    > If you are not sure whether you are in "root", type su. A root

    prompt generally starts with the # character.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# 3.2 Installing your mouse


    If you need to reinstall you mouse once the installation is finished, use the
    mouseconfig utility in text mode. Do do this, type mouseconfig in a "shell" (terminal
    emulator: kvt or xterm).


    If your mouse has only two buttons, use Emulate the third button. In effect, this
    third button (actually the middle button) enables you to paste text between applications
    in X (having preselected the relevant part of the text with the left button).


    # 3.3 Installing your video card


    Under Linux, installing a video card has for a long time been a perilous exercise
    as you have to edit a configuration file manually according to the parameters
    of the card concerned! Now this has been made much easier due to several programs
    which enable you to create this file automatically: xf86config and Xconfigurator.


    In the majority of cases, using Xconfigurator is adequate but you may need to
    resort to xf86config, which is not as user-friendly.


    To start, you need to know:


    +   1. the type of card you''re using (for example: S3, i740, Matrox, etc.)


    +   2. if your card is compatible with Linux-Mandrake,


    +   3. the (approximate) characteristics of your monitor.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# 18 CHAPTER 3. SETTING UP LINUX-MANDRAKE


    Any computer-hardware retailer can help you with the first question. For the second
    point, simply check the Linux-Mandrake site² to see whether your card is compatible
    or not (the list is constantly updated). The third question is not necessarily
    essential: a modern screen can easily support a 1024x768 @60Hz resolution or more
    in non-interlaced mode. Therefore you can enter the characteristics that are closest
    to those of your monitor.


    Now use Xconfigurator (type: Xconfigurator) and follow the instructions carefully.
    At worst, you will have to choose a VGA16 server which works with almost any card
    but at a very poor resolution.


    # 3.4 Setting up your network


    First of all, check if your network card is recognized by Linux. When you boot
    the system, one or more lines mentioning eth0 (for "Ethernet") should appear according
    to the hardware installed on your PC. Then, to configure your network, you can
    choose between linuxconf (under console or X Window) and netcfg (only under X
    Window).


    To run these programs, type linuxconf or netcfg in a shell (or right mouse→Execute
    a command). Both programs can also be launched in the K→non KDE Applications→System
    menu.


    The installation of an Ethernet card and setting up the network requires some
    specific knowledge: consult the comprehensive "HOWTOs" which cover this subject
    (all those HOWTOs are available on the Mandrake CD-ROM, in the /doc directory)
    and/or buy a book such as Linux Network


    > http://www.linux-mandrake.com/indexfr.html'
  merge: -1
