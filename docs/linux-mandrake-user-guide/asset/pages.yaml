  md: '# CHAPTER 8. SYSTEM ADMINISTRATION


    program will search for the network configuration. If the network exists, it executes
    the network script (/etc/sysconfig/network); otherwise, it indicates to the system
    that there is no network and therefore the name of the machine will be localhost.


    Then the swap partition is activated. The HOSTNAME variable is displayed on the
    screen. If the NIS service is used, it is set up. The system proceeds to check
    the partitions (fsck -V -a $fsoptions / command). What follows allows the management
    of the start-up process if the partition is damaged. Finally, the management of
    quotas is activated.


    The script will configure your PNP cards. Then will launch all the programs which
    you have in the form of modules. All the partitions are then mounted and verified.


    Numerous files are deleted by the boot process (rm -f command) before the system
    configures the computer time. The activation of serial ports is the next step.


    The last part consists of instructions that are specific to Linux-Mandrake and
    that are executed when you first start up.


    ```

    /etc/rc.d/rc

    ```


    The program rc is designed to make scripts easier to launch according to the runlevel.
    This script is therefore quite short. It obtains the current runlevel in order
    to launch the necessary scripts. If the runlevel is x, then all the scripts of
    the directory /etc/rc.d/rcx.d are executed.'
