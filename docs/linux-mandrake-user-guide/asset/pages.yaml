  md: '# CHAPTER 8. SYSTEM ADMINISTRATION


    # The program chkconfig


    The chkconfig program is used to manage the services of the different runlevels.


    There are five distinct functions:


    +   - add new services,

    - remove services,

    - display information on the current configuration,

    - change the configuration of the loading of services on start-up,

    - check the start-up state of a particular service.


    # The files .bashrc et .bash_profile


    On connection, a shell, called the login shell, is attributed to you. The shell
    is the command interpreter that executes the commands read on the standard input
    (in the majority of cases, the keyboard) or from a file. The bash shell is the
    most widespread.


    The files /etc/profile and ~/.bash_profile serve to configure the work environment
    and the files /etc/bashrc and ~/.bashrc serve to define functions and aliases.
    The files /etc/profile and /etc/bashrc are the files which concern the global
    configuration of your computer and are valid for all the users that use this shell.
    The files which begin with a full stop are personal configuration files and apply
    uniquely to you.


    To configure an alias, for example, add a line of the type:


    ```

    alias ll=''ls -l''

    ```'
