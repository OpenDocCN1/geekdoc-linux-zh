  md: '# 38 CHAPTER 4. DISCOVER KDE


    The files are therefore opened with the text editor, which is far from ideal.
    To remedy this, we shall create a MIME type and associate it to KLIXX². Go to
    the Text category. With the right mouse button, click on a zone without text,
    choose new, then MIME Type. Give it a name without modifying the extension .kdelnk
    (for example: x-klyx.kdelnk). An error message indicates that no parameters have
    been specified. Click on the file you have just created with the right mouse button
    and open the Properties menu. Go to the Link option. The Filters option indicates
    the relevant file extensions. You can put several, separated by semi-colons (warning:
    you should always finish with a semi-colon). Type *.lyx; The MIME type is text/x-klyx
    and you can write "KlyX Document" for example in the Comment box. The Applications
    menu should by default contain <none>.


    At this point, the type exists but no application has been set up to launch it.
    Open Edit/Applications and click on Word Processing. You should see klyx.kdelnk
    appear³. Click with the right mouse button and make a list of the file properties
    appear. We are interested in what can be found under the Applications tab. At
    the bottom, you will find two important options: on the left is indicated all
    the MIME types handled by the application and on the left, those available. Find
    the type text/x-klyx on the left and then click on the arrow ←: the type will
    appear on the right. KlyX will now handle the files that have the extension *.lyx!


