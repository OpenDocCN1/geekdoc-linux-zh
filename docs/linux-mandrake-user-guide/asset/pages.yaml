    In this menu you will be able to change the appearance of your desktop.


    The background menu gives you a list of all the desktops and enables you to choose
    a background to apply. If you would like to have an imageless background, choose
    no wallpaper in the wallpaper menu then set up your colors: one for a uniform
    background or two for a nice graded look. One click on the colour enables you
    to modify it and the configure button enables you to access the grading options.
    On the other hand, if you would like an image in the background, simply choose
    one from the pull-down wallpaper menu. If you cannot find any that you like, choose
    one of your by clicking on Browse (any JPEG can be used). If you regularly modify
    the look of your desktop, you will certainly hope the menu is easily accessible.
    For this, check the option Insert in the panel. An icon is inserted on the left
    of the panel; simply click on it to access this menu. If you really like to change
    it often, check the option random.


    In the Border menu, you can choose to activate the borders of each desktop. This
    means that if you move to the left of'
