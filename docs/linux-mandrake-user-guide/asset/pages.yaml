    # You are unable to create your LILO boot floppy


    This is an annoying problem which should not occur with current Linux-Mandrake
    distributions. Pick up a new floppy and try again. In case of repeated failures,
    contact installation support.


    # You are unable to install LILO


    This is usually due to a detection problem with the hard disk structure. This
    should not happen with the latest BIOS releases. If it does, make a LILO boot
    floppy (as instructed) and use it to boot your Linux system. Then edit the file
    /etc/lilo.conf and insert the line "linear".


    For example, if your Linux partition is mounted on /dev/hda, you should have something
    like this:


    ```

    (...)

    boot=/dev/hda

    linear

    (...)

    ```


    Finally, reinstall LILO with the command /sbin/lilo.


