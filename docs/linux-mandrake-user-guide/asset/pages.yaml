    # Shutting down


    There are many ways in which you can shut down your Linux system but that should
    not include using your computer''s power switch! In fact, like many other operating
    systems, Linux intensely uses cache memories to accelerate the input/output, mostly
    with the disks (hard disk, floppy disk...). Thus you can never be sure that all
    the data saved on your disk actually was written to the disk.


    Therefore you need to quit your system properly. There are several ways of doing
    this:


