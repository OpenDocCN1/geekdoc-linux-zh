  md: '# Chapter 6


    # GNOME: the GNOME Network Object Model Environment


    # 6.1 Introduction


    GNOME is a project initialized by Miguel DE ICAZA, with the support of the GNU
    project, which made of GNOME its desktop environment. Its aim is similar to that
    of the KDE project: to create a full graphical environment and define a series
    of driving lines that other applications can follow in order to be "GNOME compatible".


    GNOME is much more recent than KDE, but its development was much quicker. It is
    already an environment rich in functionality and superior to KDE in certain areas,
    but it lacks maturity and above all compatible applications.'
  merge: -1
  pgno: 70
- img_proc: true
  md: '# 6.2 Presentation of the environment


    ![](img/b8bd4b587c4dd67fa1a0b81ef3d39692_71_0.png)


    Unlike KDE, GNOME does not come with its own window-dow manager. It can be any
    window manager, but GNOME defines also a series of conditions which state that
    the window manager must be "compatible". The first window manager to adopt this
    compatibility is Enlightenment, and that is the manager that has been used for
    the screen capture.


    In the top right corner and at the bottom of the screen are two panels. Unlike
    the KDE panel which is unique, a GNOME environment may contain as many panels
    as you would like. In these panels you can choose two different things: applets
    and launchers.


