    # 1.5 This manual...


    For your information, be aware that this manual was entirely

    created under Linux Mandrake with the following programs:

    KlyX, Emacs and LaTeX for the text editing, Gimp and gif2ps

    for image processing, and the psutils for setting it out before

    printing. All of these programs are Free Software.


    # 1.6 Acknowledgements


    we thank Linus TORVALDS and all those who contributed

    to the Linux kernel. Thanks equally to the GNU project and

    therefore, in particular, to Richard STALLMAN, without whom

    all this would have certainly never existed. Thanks to all

