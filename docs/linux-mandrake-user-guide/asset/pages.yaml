    20 6:2345:respawn:/sbin/mingetty tty6

    21 # Run xdm in runlevel 5

    22 x:5:respawn:/opt/kde/bin/kdm -nodaemon

    ```


    The general form of each entry is:


    ```

    id:rstate:action:process

    ```


    +   - Id designates an identification number.

    - Rstate is a sequence of runlevel numbers. If you are in the runlevel of one
    of the numbers indicated, the line will be executed.

    - Action indicates if the process should be launched once, every time it dies
    (respawn), etc ... .

    - Process designates the action to follow, often a script.


    Line 2 designates the default runlevel of the system.


    Warning: Linux-Mandrake now uses the program chkconfig to manage the runlevel.
    See below the paragraph dedicated to this program.'
