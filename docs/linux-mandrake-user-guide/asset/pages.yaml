    by programs or daemons for carrying out their operations. They often need rights
    that are superior to those of the normal user and it is so to avoid using the
    root account that there exist special accounts.


    It is more likely than not that you will never have to worry about these special
    accounts.


    # 8.3 Management of programs (RPM)


    Linux-Mandrake uses the RPM standard, that is the "Red-Hat Package Manager", to
    allow you to manage your programs easily. Thanks to RPM, you install and uninstall
    programs with one movement of the hand! The real strength of RPM is its ability
    to check for dependency between programs. Therefore, it will not allow you to
    install a program if one of the libraries that it needs is absent.


    For Intel processors and compatibles, program names are structured in the following
    way:


    ```

    name.version.i386.rpm

    ```


    If it is a source file, you will find src in the name. Under Linux-Mandrake, there
    are two methods for managing RPM packages: the command line and the Kpackage program.
    Do not forget that only the root user has the right to install or uninstall programs!


    # RPM on the command line


    The RPM program is used with options to manage all your RPM programs. command
    line syntax is:


    ```

    rpm -options program_name

    ```'
