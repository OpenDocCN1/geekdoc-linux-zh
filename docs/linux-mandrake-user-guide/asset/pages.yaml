  md: '# Chapter 8


    # System administration


    # 8.1 The User and Groups


    Unlike other operating systems, Linux manages problems of security and notably
    user groups.


    In Linux, there are three types of users: yourself, the group to which you belong,
    and other users. Each user of the machine has his own personal directory which
    is a sub-directory of /home. For example, if your login name is fred, your personal
    directory will be /home/fred (you will often see the abbreviation ~ to designate
    your personal directory). This symbol is recognized by the bash shell. The only
    exception is the root account, of which the directory is /root. This notion of
    user directory allows you to protect your confidential files from being read by
    other users (only the superuser can access all the personal directories).


    However, you will certainly want to share documents with other users. That is
    why Linux supports groups. A group is a set of users. A user belongs to one group
    by default but'
