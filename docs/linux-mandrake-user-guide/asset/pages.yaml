  md: '# Chapter 10


    # Appendix


    # 10.1 FAQ


    You will find below some common Linux-Mandrake error messages and corresponding
    explanations. This FAQ is regularly updated on the Linux-Mandrake web site.


    "Unable to display the contents of the directory xxx"


    You do not have permission to read the contents of the directory. Check the directory
    permissions.


    "Unable to read in xxx. The file does not exist or access is refused."


    In general, the reason for this is effectively that you do not have permission
    to read this file. Check the file permissions.'
  merge: -1
