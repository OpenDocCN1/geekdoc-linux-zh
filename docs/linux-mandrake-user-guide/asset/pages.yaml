    complicated to type every time, with the ll command, which is shorter. To activate
    the modifications type source "~/.bashrc" and validate with the Enter key, or
    otherwise, the modifications will be activated when you next connect yourself.


    Warning: do not choose names that could represent commands which already exist
    in the Linux system.


    To personalize .bash_profile, you should act similarly. For example, if you have
    installed Blender in a directory, let''s say, /usr/local/blender/, you should
    modify the file .bash_profile. Here is an example:


    ```

    PATH=$PATH:$HOME/bin

    ENV=$HOME/.bashrc

    USERNAME="fred"

    BLENDERDIR=/usr/local/blender

    (..)

    export USERNAME ENV PATH BLENDERDIR

    ```


    Note that we have added a new variable, BLENDERDIR, and we have added the name
    of this variable to the list of exported variables. In this way, it will take
    effect in all the terminals used.


