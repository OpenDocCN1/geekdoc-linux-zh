  md: '# 4.6. CUSTOMIZING THE DESKTOP 35


    To specify the behaviour of the mouse with respect to windows, go to the Mouse
    menu. You can control a number of important parameters. For example: open two
    windows on the same desktop and cover one with the other. Suppose that the active
    option-middle button contains Place beneath. Now click on the task bar of the
    title of the active window with the right mouse button: this one now moves behind
    the other! You can thus precisely configure your mouse to gain in efficiency.


    The Property menu is one of the most interesting. You can choose if you would
    like to see the contents of a window when you resize or move it, or not. But most
    importantly, you can define a window placement and focus management policy. The
    window placement management menu has five options of which the aim is to enable
    you to choose how the new window will be placed on the desktop. If you choose
    Intelligent, a new window will be placed on the desktop in such a way that it
    overlaps other windows as little as possible. Cascade places the windows each
    shifted from the others. The Manual mode displays a cursor; click to position
    the window. The Interactive option is a cross between Intelligent and Manual:
    if the new window does not cover the others "too much" (the value of overlap allowed)
    enables you to define what you consider "too much!), it will be placed automatically;
    otherwise, a cursor appears.


    The choice of focus is important, as this defines what action is produced when
    the mouse passes over a window behind another. There are 4 possible choices


    # Click to have focus


    Click on the window to make it active and move it to the foreground.'
