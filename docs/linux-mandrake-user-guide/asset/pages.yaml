  md: '# 8.3. MANAGEMENT OF PROGRAMS (RPM) 83


    # Interrogate a program


    It is often very useful to interrogate a program, for example, to know the list
    of files which comprise the package. You will find in the response a description
    of the package: you can therefore decide whether to install or uninstall it.


    The option to use here is q in combination with one or several others. Use:


    +   -qi to interrogate a program that is installed


    +   -qip to interrogate a program that is not installed. It is also necessary
    to specify the full path for the package


    +   -ql for a list of the files contained in the package. Add p if the package
    is not installed.


    +   -qPR to know the files which are necessary to install the package


    +   -qa to interrogate all packages


    All the commands, except the last, are to type before the name of the package.


    # Other options


    There are a number of further options that you can find out about by consulting
    the RPM man page. --force is fairly dangerous. Be careful if you use it.


    # KPackage


    KPackage is the graphical tool that allows you to manage programs. A precise description
