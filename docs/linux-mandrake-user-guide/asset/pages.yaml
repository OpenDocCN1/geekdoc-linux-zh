    The SysV Init editor is a program that allows you to choose the daemons which
    are launched in the background. You will need to be the superuser (root) to be
    able to use it. It is in the form of two series of services. On the left, you
    will see a list of installed services. On the right, you have, at the top, the
    services that have been started and below those which have stopped, for each runlevel.
