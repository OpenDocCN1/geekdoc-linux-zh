  md: '# 8.4. LINUX-MANDRAKE INSTALLATION


    Line 4 is particular. It launches the script rc.sysinit which has the role of
    checking the integrity of the file systems, activating swap, etc ...


    Lines 5 to 11 allow the launching of scripts that depend on the level of execution.
    The script launched is /etc/rc.d/rc with the runlevel as a parameter


    Line 13 indicates that if you press Ctrl+Alt+Del simultaneously, then the system
    must restart immediately. This is a very dangerous option for a server machine.
    You can disactivate the line by making it a comment.


    Lines 15 to 20 indicate that for runlevels 2 to 5, the program mingetty must be
    launched, which allows you to connect yourself. The respawn indicates that if
    the process dies (for example the exit command), it must be relaunched.


    Line 22 is used for runlevel 5 to offer you a graphical login procedure (the kdm
    program).


    It is not advised to modify the access to /etc/initab because you risk not being
    able to restart your computer! When you are in such a case, use the boot disk.


    # The scripts /etc/rc.d/


    All the Linux-Mandrake installation scripts are contained in the directory /etc/rc.d/.
    We will now describe the procedures executed.


    /etc/rc.d/rc.sysinit


    This is the first script to be executed. It is launched once on start-up. From
    this script comes almost all the messages which you will see on booting.


    This script starts by indicating the value of the PATH variable which defines
    the path of access to programs. Then, the'
  merge: -1
