  md: '# Chapter 4


    # Discover KDE


    # 4.1 The history of KDE


    KDE is a project that was started by Matthias ETTRICH in 1996! The aim was to
    create a full graphical environment and not only to create a new window manager.
    KDE Version 1.0 came out in 1998 and version 1.1 in February 1999. KDE is now
    a stable and very efficient environment: that is why Mandrake decided to use it
    as the default graphical manager!


    # 4.2 Introduction to KDE


    KDE is the default Linux-Mandrake graphical environment. At the same time simple
    and very complete, it enables you to discover your new Linux-Mandrake system by
    using only the mouse!'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# An HTML desktop


    Today, the Internet is the heart of information technology. The HTML language,
    on which the Web relies, offers you a simple and fast method for navigating on
    the Internet. That is why the KDE desktop uses the HTML language so that you can
    navigate just as easily as your computer as on the Internet.


    From now on, a single click enables you to launch a program or to navigate the
    file structure of your Linux-Mandrake system! There is no difference between the
    Internet and your computer and you can manipulate the Internet resources as if
    they were files on your personal computer.


    # The K menu, panel and task bar


    The K menu provides you with a simple and efficient method for accessing KDE programs.
    Thanks to the programs which are accessible via the K menu, you have access to
    all the tools which allow you to use your computer. We shall describe the items
    of the K menu.


    There are two parts to the K menu. The first consists of Graphics, Applications,
    Internet, etc. items. These open a list of applications installed on your computer.
    For example, to launch KTelnet, click on K then choose Internet and finally KTelnet
    in the open menu. The second part contains direct access to elements such as the
    Trash Can or KDE Control centre.


    There are three particular menus: Configuration, Disk Navigator and Panel. The
    Configuration menu provides you with rapid access to the different areas of the
    KDE Control Centre. Using the Disk Navigator you can easily access Linux-Mandrake
    directories. The Panel enables you to control'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# 4.2. INTRODUCTION TO KDE


    the icons which are present on the bar at the bottom of your screen (the *panel*).


    # Using context-dependent menus, using the right or third button


    As is the case with all modern front-ends, KDE supports context-dependent menus.
    These are accessible by using the second button on your mouse (the right button
    in general). The menu that is opened depends on the object you are pointing at.
    If you point at the desktop, the menu which is opened enables you to navigate
    between bookmarks, to create a new file (certain types) or to access the desktop
    properties. If, on the other hand, you click on an icon, the context-dependant
    menu enables you to delete a file or access its properties. The third button (the
    middle button of a 3-button mouse or press the two buttons together with a 2-button
    mouse) enables you to browse through the list of open programs, whichever virtual
    desktop you are using.


    # Drag-and-drop


    KDE supports drag-and-drop between KDE applications. For example, it allows you
    to pick up an icon in a directory and drop it on the desktop! Using this method,
    you can improve your efficiency.


    # The different desktops


    KDE supports virtual desktops. By default, you have 4 different desktops to choose
    from (it is possible to have up to 8). You can apply a different background to
    each desktop as you wish and you can rename them. Using the desktops, you'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'can organize the different applications to avoid overlapping windows.


