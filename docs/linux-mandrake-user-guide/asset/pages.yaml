  md: '# Chapter 2


    # # Installing Linux-Mandrake


    This chapter complements the Install Guide. It details the procedures for installing
    from NFS, FTP, HTTP and a hard disk and shows you how to resolve several problems.


    If your computer allows you to boot from the CD-ROM, do it; otherwise, start with
    the boot disk.


    Note: in certain cases, you will have to force your machine''s BIOS to start on
    the disk drive.


    You should see a welcome screen. Click on Enter to continue. You could also choose
    to start in "expert" mode. To do this, type "expert". Expert mode enables you
    to enter by hand all the machine parameters (no automatic detection).


    A minimal Linux will be launched. It will detect your system''s resources and
    act as a base for the remainder of the installation.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# 2 CHAPTER 2. INSTALLING LINUX-MANDRAKE


    In this chapter, we have indicated the important points concerning installations
    from sources which are not the CD-ROM. The majority of steps are the same. You
    should therefore refer to the Install Guide to find the relevant details.


    # 2.1 Installation disk


    When installing from sources other than the CD-ROM, you will need boot disks.
    The images of these disks can be found on the CD-ROM in the directory \images.
    Use the rawrite program to create them under Windows.


    All the necessary utilities can be found in the \dosutils and \images directories
    of the installation CD-ROM.


    First of all, you need to use DOS or Windows. In Windows, click on Start -> Execute
    -> Command. You will see a DOS window displayed on the screen.


    Insert the Linux-Mandrake installation CD-ROM. In the following section, we suppose
    that your CD-ROM drive is D:. Replace D: with the letter of your CD-ROM drive,
    if necessary.


    Insert a clean, formatted disk in the disk drive. Type


    ```

    D:\dosutils\rawrite.exe

    ```


    You will be asked for the source. The files can be found in the directory \images.
    If you would like to create a boot disk for an installation from CD-ROM or hard
    disk, you will need the image boot.img, otherwise-you will need the image pcmcia.img.,


    Then type


    ```

    D:\images\boot.img

    ```'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'or


    D:\images\pcmia.img


    For the target, type A:, followed by Enter.

    The desired image will be copied onto your disk.

    the two boot disks enable you to start the computer and

    to initialize the installation procedure.

    If your computer ignores the disk, on start-up, you will

    need to modify your computer''s BIOS. Modify the boot se-

    quence to: CDROM, A, C.


    # 2.2 Take PCMIA ports into account


    If you are installing Linux-Mandrake from a portable, and

    y you use PCMIA peripherals which are used in the installa-

    tion (CD-ROM SCSI or Ethernet network card for an NFS

    installation for example,), you should attempt to detect them.

    So reply yes to the question Use your PCMIA peripherals?.

    Note that this only concerns the peripherals which will be used

    during the installation of Linux-Mandrake. You PCMIA

    peripherals will always be recognized by your newly installed

    Linux system.


    # 2.3 Choice of installation method


    You can choose between five different installation methods.

    Of course, if you install the PowerPack version of Linux-

    Mandrake, you will certainly use the CD-ROM installation.

    Select one of these methods for installation of Linux-

    Mandrake:'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# CHAPTER 2. INSTALLING LINUX-MANDRAKE


    +   1. Local CD-ROM: this is the ideal method if you own a CD-ROM drive. For more
    information consult the Install Guide.


    +   2. NFS Image: this method can be used if you have access to an NFS (Network
    File System) server which contains Linux-Mandrake on your local network.


    +   3. Hard disk: use this method if you have the Linux-Mandrake CD-ROM copied
    onto a hard disk present on your machine. This method will require the additional
    installation disk.


    +   4. FTP: if you have a high access rate to a distant FTP server holding the
    Linux-Mandrake distribution, use this method. This method will also require the
    use of the additional installation disk.


    +   5. SMB Image: use this method if you install Linux-Mandrake from a volume
    shared with Microsoft Windows. This method again requires the use of the additional
    installation disk.


    +   6. Installing from an NFS image: if you have at your disposal, within a local
    network to which you are connected, an NFS server containing Linux-Mandrake, you
    can install it directly via the network. Note that this procedure will be slower
    than installing from a local CD-ROM.


    # Installing via NFS


    If you choose this method, the installation procedure will search for your network
    card and initialize it first. It will'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# 2.3. CHOICE OF INSTALLATION METHOD 5


    attempt to detect the card automatically first. If this fails, you will have to
    specify the type and parameters of your card.


    For example, for an ISA NE2000 compatible Ethernet card, you will need to specify:


    +   - that you have a NE2000 compatible card

    - its parameters: base address (e.g. 0x300) and IRQ (e.g. 5)


    If your card is not detected, you will not be able to use this method of installation
    via NFS.

    As soon as your card is recognized, you will have the choice of several methods
    of installation by NFS:


    Choose the appropriate method: static IP address, DHCP or BOOTP.


    +   1. Static IP address: choose this method if you have access to a NFS server
    for which you know all the characteristics (IP address, location of Mandrake files...)

    2. BOOTP: this method uses the "BOOTP" protocol.

    3. DHCP: this method uses the "DHCP" protocol (Dynamic Host Configuration Protocol)


    If you use one of the two latter methods, the installation procedure must be able
    to automatically detect an active and correctly configured BOOTP or DHCP server.

    If you use the first method, you have to enter a series of parameters:


    +   - IP address: enter the IP address of your machine.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# CHAPTER 2. INSTALLING LINUX-MANDRAKE


    +   - Sub-network mask: it is guessed automatically from your IP address—you can
    modify it according to your network.


    +   - Default gateway: ditto


    +   - Main name server: ditto


    The following dialogue box asks you to specify new parameters, in order to find
    out:


    +   1. your domain name


    +   2. the name of the machine that you are using


    +   3. the IP address of your second name server (optional)


    +   4. the IP address of your third name server (optional)


    You will now have to give information relating to the NFS server you are using.


    Enter the Internet address or IP number of your NFS server. Then enter the directory
    in which the Mandrake distribution can be found on this machine. This is the directory
    that contains the Mandrake/ directory. For example, if you have a Mandrake CD
    mounted on /mnt/cdrom/, the directory to specify is:


    ```

    /mnt/cdrom/

    ```


    Important note: the directory containing the Mandrake distribution must have export
    authorization on the NFS server (see the file /etc/export on the server). Otherwise
    you won''t be able to access it.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# 2.3. CHOICE OF INSTALLATION METHOD


    # Installation from a hard disk


    You have the option to install Linux-Mandrake from the partition of your hard
    disk that contains the distribution. This installation method requires the use
    of the second additional installation disk.


    Having loaded the second installation disk, you should choose the partition of
    the disk that contains the Mandrake distribution and the directory containing
    the Mandrake/ directory. The installation should then proceed without any particular
    problems.


    # Installation by FTP


    For installation by FTP, you have to load the second additional installation disk.
    Once you have done this, choose your FTP server (IP address) and the path to the
    Mandrake/ directory. Move onto the next chapter for the continuation of installation.


    When required, fill in the field name of FTP site, Mandrake Directory:


    +   1. The name of FTP site is the Internet address of this site. For example:
    ftp.linux-mandrake.com.


    +   2. The Mandrake directory is the full path where the directory Mandrake/ can
    be found.

    For example, if the remote FTP server contains the directory: /pub/linux/distributions/mandrake/i386/Mandrake/

    then you should enter /pub/linux/distributions/mandrake/i386.'
