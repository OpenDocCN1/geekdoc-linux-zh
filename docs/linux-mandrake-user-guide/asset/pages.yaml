    them under Applications in the K Menu.


    kedit is a small text editor that allows you to type in a simple way short texts
    or to edit configuration files. It is possible to edit a message directly on an
    FTP server or on the Web. Simply indicate the Internet site and the file name
    at the prompt Placement of the Open menu (for example: ftp://ftp.linux-mandrake.com/Welcome.msg).


    kwrite is an editor which is very similar to the previous one, but is more powerful.
    In particular it allows you to modify the colors used by the text according to
    the document type. For example, open the document /.bash_profile. It appears in
