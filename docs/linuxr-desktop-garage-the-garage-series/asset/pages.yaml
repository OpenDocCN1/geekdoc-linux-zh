    Lists of tasks can keep you organized. The Tasks component of Evolution is closely
    associated with the Calendar component. Tasks can appear in a section of your
    calendar in every view but the month view.


    On the menu in the Tasks component, Expunge is available. This item deletes all
    the tasks that are marked completed. The toolbar in the Tasks view doesn''t have
    any special buttons, just the standard buttons, the Print and Delete buttons,
    and three editing functions. I know, I feel cheated, too. If we could come up
    with new toolbar buttons for tasks, what would they be? Procrastinate? Generate
    Excuse to Tell Boss?


