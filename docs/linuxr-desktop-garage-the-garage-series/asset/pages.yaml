- pgno: 79
  md: '# ## Owners and Permissions


    Files and directories have ownership and permissions in Linux. These settings
    determine whether you are allowed to read, write, or execute that object (in the
    case of programs and scripts). Ownership and permissions are strict. You can''t
    perform a hostile takeover to become the owner of a file. You can''t talk your
    way into reading any file or folder that you are not allowed to read. Ownership
    is shown by username. Either letters or numbers represent the permissions for
    a file or folder. The letters and numbers stand for the three aspects of permission:
    read, write, and execute. Table 2.3 shows the text and number codes for permissions.


    **Table 2.3: File Permission Text and Number Codes**

    | PERMISSION TYPE | TEXT VIEW | NUMBER VIEW |

    | :--- | :---: | :---: |

    | Read | r | 4 |

    | Write | w | 2 |

    | Execute (or Access for directories) | x | 1 |



    You can see the permission for an object by right-clicking the file or folder
    in your file manager and looking at the Permissions tab (shown in Figure 2.10).
    You should see a section for the permissions with check boxes and a section showing
    the ownership. Permissions are listed in the order of the permissions for the
    object''s owner, the permissions for members of the group the object belongs to,
    and permissions for everyone. If you have read and write permissions to the file,
    you can change some of the permissions for the file. If you are the owner of the
    file, you can pretty much do whatever you want with that file.


    You can also see permissions listed in your terminal from the command line. We
    talk more about the terminal in a bit. You usually don''t have to worry about
    whether you have permissions for a file. Occasionally, however, knowing how to
    check the permissions can save you a good amount of troubleshooting time. For
    instance, if you find yourself unable to delete a file or to move a file, check
    the permissions. If you cannot save changes to a file, check the permissions.
    Permissions will become more prohibitive when you have to work with files that
    are outside your home directory.'
  merge: -1
  img_proc: true
