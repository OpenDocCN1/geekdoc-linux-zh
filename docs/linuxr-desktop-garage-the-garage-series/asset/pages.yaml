- pgno: 69
  md: 'In GNOME, that taskbar-like object is called the panel. A panel is a base on
    which you can add other objects, such as your main menu, icon links to programs,
    a window list, a clock, and other system controls, such as a volume and a logout
    button. Panels give you a lot of flexibility and control over the appearance and
    geography of your desktop. You can have multiple panels on the same desktop. Use
    the panel for a while as it is right now, to get used to how everything works.
    You can then experiment with adding new objects to your panel, changing the panel
    placement, and adding multiple panels.


    # The Default Panel


    You already have everything you need to start on the bottom panel. The first thing
    you see on the left side of the panel is a series of icons. These are for menus
    and programs that Fedora and GNOME thought you might like to have handy. There
    are also helpful utility objects on the panel to help you arrange windows and
    perform common tasks.


    **GNOME Panel Objects.** Here is a quick run-down of the default objects on the
    GNOME panel.


    | | | GNOME Main Menu | It''s a Fedora. Get it? Observant users will also notice
    that it is a red hat, just like the company Red Hat. That hat is your main menu,
    comparable to the Windows Start menu. On your main menu, you find links to most
    of the programs installed on your computer. |

    | | | Moxilla | The default Web browser in Fedora is Moxilla. Moxilla is similar
    to Netscape, and the two programs used to be related in their development. Moxilla
    also has mail and chat programs connected with it. |

    | | | Evolution | Evolution is an e-mail and scheduling program similar to Microsoft
    Outlook. |'
