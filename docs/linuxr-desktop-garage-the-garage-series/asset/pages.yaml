- pgno: 73
  md: '# Virtual Desktops


    Virtual desktops are multiple workspaces on which you can place windows, view
    menus, and do anything that you normally do on your computer. Having multiple
    desktops can confuse first-time Linux users. Virtual desktops are sim-ply more
    room for you to put things and do things. Though it is a tired analogy, picturing
    an actual desktop is helpful. It is like having four desks in your office to put
    all of your things on, to use as extra room to do your work.


    Many new Linux users who have switched from Windows or Mac don''t quite know what
    to do with all of those extra workspaces. When I first started using Linux, I
    used only one desktop. I told everyone that I didn''t need them. They were unnecessary,
    as far as I was concerned. Gradually, I started to play with my new toy. There
    were certain applications that I knew I liked to keep open but that I didn''t
    want to see on the taskbar or have to click around to get to other windows on
    the desktop. I started to use the other desktops and to config-ure them the way
    I wanted. Now, I feel like I can''t do without virtual desktops. When I have to
    use a Windows computer for any length of time, I search out utilities that will
    give me my virtual desktops back.


    You can have between 1 and 36 desktops in the GNOME Workspace Switcher, or up
    to 16 desktops in the KDE Pager. There are a number of different ways to use your
    new tool. You could put different types of applications on dif-ferent desktops,
    place windows on desktops according to the order in which you opened them, or
    shove things around all of your desktops in a random way. Be as organized or as
    messy as you are on a real desk. You know, that method you have that looks like
    a mess to other people, but in which you claim to know where everything is.


    # The GNOME Workspace Switcher


    In GNOME, by default, the access to your virtual desktop is on the bottom panel,
    near the Window list (see Figure 2.6).


    If you create new panels, you can add the Workspace Switcher to any panel by right-clicking
    the panel and choosing Add to Panel > Utilities > Workspace Switcher. The desktop
    that you are on will be shaded darker, and you can see outlines of your open windows
    in the Workspace Switcher. If you need to to to switch from one desktop to another
    is click in one of the panes on the Workspace Switcher.


    Want more workspaces? Or fewer? A few options are available to config-ure for
    your workspaces. You can change the number of workspaces and name'
  merge: -1
  img_proc: true
