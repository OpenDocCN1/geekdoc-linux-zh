- pgno: 43
  md: '# ## Obvious Choices


    I''m guessing that you will not have any trouble figuring out what language you
    speak, what language type of keyboard you use, or what time zone you are in. You
    will be asked, though, so study up and be prepared. It will be on the midexam.


    # ## Hardware Choices and Compatibility


    Both Mandrake and Fedora try to automatically detect most of your hardware for
    you. Your video hardware gets detected when the installer starts. The installer
    takes a guess at your mouse and keyboard and then shows those to you in a list
    of choices. If you are happy with what was detected, go on to the next step. When
    the installer cannot figure out what input devices you are using, one of the generic
    choices is selected. You can change the selection to your specific input devices
    by scrolling through the list.


    One choice you might not be familiar with is emulating a three-button mouse. In
    many of Linux’s desktop environments and programs, your middle mouse button is
    assigned functions. The default function in X is to use the middle mouse button
    to paste the contents of the Clipboard. If you don’t have a middle mouse button
    or scroll wheel, or if you are on a laptop without a middle mouse button, use
    the option to emulate a three-button mouse. You can then press both the left and
    right mouse buttons at once to perform any middle mouse button functions.


    If the installer cannot determine which monitor you are using, it assigns a generic
    choice, or Unprobed Monitor. You can choose one of the generic choices or try
    to find your monitor in a list.


    # ## Choosing an Install Type


    Mandrake and Fedora simplify the choice of which programs to install by categorizing
    all the programs by types of tasks or by the intended purpose of the computer.
    The best practice is to install more programs now. Will you be sitting around
    waiting while all this stuff installs anyway—why not add a few extra minutes?
    Throw in anything that looks relevant. You can always weed them out later.


    # ## Mandrake Package Groups


    First, Mandrake asks if you would like to do a Recommended Install or an Expert
    Install. If you feel okay with having some choices made for you, allow


    computer out of the closet to install Linux on it. Using the Linux desktop and
    the X Window System require a lot of RAM and a fairly fast processor. When you
    hear these people say that Linux runs on anything, they mean running'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'the Recommended Install. Nothing bad will happen, and it is the best choice
