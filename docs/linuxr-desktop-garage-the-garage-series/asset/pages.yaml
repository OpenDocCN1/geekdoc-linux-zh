- pgno: 109
  md: '# **Start or Stop a Service**


    Main menu > System > Configuration > Configure Your Computer

    (from inside the MandrakeLinux Control Center) System > Services


    # **Read the Logs**


    Main menu > System > Configuration > Configure Your Computer

    (from inside the MandrakeLinux Control Center) System > Logs


    # # Printing


    Some people print everything. They look up a Web page. They print it. They receive
    an e-mail. They print it. They open any file at all. They print it. Have you met
    these people? Okay, I should probably be quite because you might be a very printy
    person. I''m not against those of the printy sort. I guess I just don''t understand
    the constant printing. I am glad to let my printer feel lonely. The fewer small
    pieces of paper I have lying around me, the happier I am. Still, sometimes everyone
    needs to print something.


    Luckily, setting up printers in Linux is easy. Now, I know that the moment I said
    that, eight people just had a problem setting up a printer in Linux. It''s easy
    compared to connecting other hardware. It''s easy like using canned cheese spread.
    It''s easy like a Sunday morning. Well, maybe most hardware in Linux, it''s easy
    for certain brands and models. Support is best for HP and Epson printers, especially
    inkjet printers. To find out if your printer is supported, you can check the manufacturer''s
    documentation and Web site. Some companies acknowledge Linux and let you know.
    Otherwise, there is also a great site online for Linux printing, http://www.linuxprinting.org,
    where you can check whether your printer is supported, see which drivers work
    best, and look at suggested printers before you buy.


    Setting up your printer can involve different steps, contingent on the printer
    being directly connected to your computer or if you are connecting to the printer
    over a local area network.


    # ## Print Management in Fedora with GNOME


    Before you spend a lot of wasted time trying to set up a printer that will not
    work with Linux, check the Linux Printer Compatibility Database online at http://www.linuxprinting.org/printer_list.cgi.
    While you are on the Linux Printing site, you can grab drivers for your printer,
    but most compatible printer drivers are already included in Fedora.


    # ## Adding and Configuring a Printer


    Print Manager is one of the default icons on your bottom panel in Fedora, so click
    on it if it is still there. You can also open the Print Manager by going to the'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'main menu > System Tools > Print Manager. You need your root password to run
    the printer configuration tool and add a printer. Click the New button on the
    tool bar. Now you are looking at the Add New Print Queue screen. In Fedora, you
    are not just adding a printer—you are adding a queue, a waiting line. With a print
    queue, you can send a series of jobs to your printer without having to wait for
    each one to complete before sending the next.


    Step through the wizard screens. When you get to the part about naming your print
    queue, stop and listen to me. For most users, this name does not matter too much,
    but if you plan to set up more than one printer, you need to make sure the name
    is unique and descriptive enough that you can identify your different printers.
    The name Printer might not be the most unique or descriptive name to choose. The
    Queue Type screen is where you can choose to identify your printer as locally
    connected or connected via a LAN. Your locally connected printer should be automatically
    detected. You can then choose its device location from a list, often a list of
    only one. The usual device location for a parallel port printer is /dev/lpp0,
    and /dev/usb/lp0 for a USB printer. You must choose your network-connected printer
    by finding it on your local area network. You shouldn''t have any trouble finding
    the printer on a Windows network. On an Apple network, you can also now share
    your printer in Mac OS X as a Samba (a Linux/UNIX file-sharing program for Windows
    networks) shared printer. If you have trouble, get out your install disks and
    open main menu > System Settings > Add/Remove Applications. In the System category,
    make sure that System Tools > samba-client is checked and that the Printer Support
    category is checked.


    The next part of the wizard asks for your printer model, as shown in Figure 3.5.
    You can resist giving Fedora your printer information like a reluctant, guilty
    puppy snatcher under police questioning, but it is best to just cooperate. Your
    printer model was probably autodetected for a locally connected printer. If the
    detection was wrong or missing, choose the manufacturer and model from the list.
    You will have to choose the manufacturer and model for your network-connected
    printer.


    The next screen gives you a happy warning and tells you that you are done. You
    are then asked whether you want to create a test page. Yes, you do. A test page
    confirms that the printer is set up correctly and gives you materials for making
    paper airplanes (see http://www.paperplane.org/). You can now print from most
    applications by going to the print option in each program.


    When you need to edit or delete a printer, just open the Print Manager again.
    You will see an icon for each printer you have set up. Right-click a printer to
    edit its configuration. Highlight a printer and click Delete to remove it. You
    can also edit and delete printers in the Printer Configuration Tool, which is
    on the main menu > System Settings > Printers.'
