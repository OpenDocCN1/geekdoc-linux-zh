- pgno: 58
  md: '# 2


    # The All-Expense-Paid

    Desktop Tour


    Remember the first time I installed Linux. I said to myself, “Boy you’re going
    to really think yourself.”


    Then I said, “Yeah, I know.”


    Then I said, “Hey, you’re not supposed to answer. I’m talkin’ to myself.”


    “Well, duh,” I replied. “I’m you, so I know that.”


    “You’re being awfully contrary. Whadya gotta go and try to start a fight for?”


    I was talking about Linux.


    “Hey, I’m just having a conversation here. You’re the one trying to start a war.
    So, which desktop environment are you going to use?”


    “GNOME,” I said.


    “What? KDE is way easier. It’s way better-looking, too!” I argued with myself.


    “You wanna start a war? I will argue with you,” my GNOME half said.


    “I don’t want to fight. You’re the one being unreasonable. How can you use GNOME
    when KDE’s controls are in one central command center?”


    “But GNOME gives me more flexibility to customize my desktop however I want it.
    I like how Gnome handles themes better.”


    “You know, you really got the stupid side of our brain. I can’t believe that you
    are also me. I mean, themes? You want to talk about themes? KDE has much better
    themes.” My KDE half then went to kde-look.org and started pointing, saying, “Huh,
    right? Look. Look!”'
  merge: -1
  img_proc: true
- pgno: 59
  md: '"So what? GNOME has art.gnome.org, KDE has more themes, but everything looks
    so plastic."


    Then I got indignant with myself. I told myself to shut up. Profanity followed.
    It was messy. I felt like I was both the North-going Zax and the South-going Zax.
    (It''s from the Dr. Seuss story "The Zax," in *The Sneetches and Other Stories*.
    Geez, try to keep up here.) Eventually, I just started drinking. The voices don''t
    go away unless I start drinking. You know, drinking supernaturalities, chocomalty
    Ovaltine. Ovaltine is good for me and good to me.


    If I can start a war with myself over whether KDE or GNOME is better, just imagine
    how easy it is to good dedicated KDE and GNOME users into fighting and arguing
    over which is the better desktop environment. You might eventually become one
    of those fractious zealots, but try to keep an open mind for now. Both KDE and
    GNOME are very functional and usable environments. They have many features in
    common. Try out both. Feel free to use KDE programs in GNOME and to use GNOME
    programs in KDE. Your decision on which desktop environment to use will eventually
    come down to which feels better to you.


    # ## Login Managers


    In most operating systems, you can log in and not think about the program that
    is showing you the login screen. You can do that in Linux, too. You can log in
    each time with the default login manager that came with your distribution. That
    is probably what most Linux users do. If you do want to learn more, however, here''s
    your chance.


    The login manager is the GUI program that shows you the text boxes to input your
    username and password. Depending on the login manager and the settings, you might
    see an icon to correspond to your username or even a whole snazzy theme. There
    isn''t much that you need to know about your login manager, unless you want to
    change the settings for it. KDE and GNOME each have their own login manager programs.


    # ### KDM


    The login manager in KDE is KDM (KDE Display Manager). Mandrake divides the KDM
    login process into two steps. The login screen you first see in Mandrake''s KDM
    is a list of users with icons by them. Choose the username that you want to log
    in with, and click on it. The next screen you see has a text


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_59_0.png)


    RINGSIDE SEATS

    *Linux users fight over desktop environments often. You can always find the most
    spirited KDE vs. GNOME battles in the posts on Slashdot (http://www.slashdot.org).
    All that has to happen is for*'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'box for your password. Enter your regular user password that you set up during
    installation. The Session Type drop-down list lets you pick from the currently
    installed desktop manager choices. In Mandrake right now, let''s choose KDE, the
    default choice. The Back button takes you back one screen, in case you happened
    to click on the wrong username. Click Login when you are ready.


    That is all pretty simple. Login managers are simple. They let you log in and
    choose your desktop environment. Depending on your distribution, you might see
    KDM buttons for shutting down your computer, restarting your computer, restarting
    your X (GUI) session, or entering into a console (text-only) mode. Most of the
    time, you will just choose a user, enter your password, and move on. If you want
    to make changes to KDM, you can do so through a configuration tool.


    # Configuring KDM


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_60_0.png)


    You can twist KDM around to do lots of different things, from changing how it
    looks to changing how it works, to restricting which users can log in with KDM.
    When you start the Login Manager Configure dialog box in Mandrake, you are required
    to enter your root password. This Login Manager configuration is part of the KDE
    Control Center and can also be accessed from there. See Topic 4, “What''s Your
    Preference?”, for more information about the Control Center and preferences.


    The KDM configuration dialog box is a simple tabbed interface with five tabs.
    You can change anything on any of those tabs, but if you change some things that
    you want to undo, you can use a Defaults button as a safety net. There is also
    a fairly complete Help section available for KDM. Take a look next at the five
    tabs in the KDM configuration dialog box.


    The Appearance Tab. There are other appearance options in other tabs, but here
    is where most of the options that control the appearance of KDM are concentrated.
    The Greeting is text displayed above the username area. The Position choice determines
    where the login box appears. The GUI Style and Color Scheme options determine
    color and window decorations. Echo Mode


    *any story to even mention one desktop environment, and the users will start arguing
    in the threads. Just search Slashdot (the search field is a small box on the bottom
    of the page) for one of KDE or GNOME® releases to watch some of the fireworks.*'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'determines how your password is displayed while you type it in. The other options
    are self-evident by their labels.


    **The Font Tab.** There are three font categories, one for most of the fonts,
    one for the error messages you get from an action such as typing in an incorrect
    password, and one for the greeting. The antialiasing option is for font smoothing.


    **The Background Tab.** You can choose a wallpaper image or color for the background
    of your login screen. The Advanced Options are just for adjusting the amount of
    memory used. You most likely will not need to mess with that setting.


    **The Shutdown Tab.** The two options under Allow Shutdown let you specify which
    users are allowed to shut down the computer locally and remotely (over a network).
    The LIL0 option is for your boot manager. You can probably uncheck the option
    if you do not have a partitioned drive. If you do have partitions with more than
    one operating system installed on your computer, leave this box checked.


    **The Users Tab.** Some basic options and advanced options are mixed on this tab
    (see Figure 2.1). The System UIDs text boxes deal with the numeric ID assigned
    to users. You should leave those at the default settings. Between the Show Users
    and Select Users sections, you can choose which users are allowed to log in via
    KDM. Leaving the nobody and root users hidden from the login screen is a good
    idea. You can change the picture associated with different users with the options
    on the right side; just click on the picture to browse for other choices.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_61_0.png)'
  merge: -1
  img_proc: true
- pgno: 62
  md: '**The Convenience Tab.** On this tab, you can choose to skip the login manager
    altogether and have Linux log in your regular username automatically. For security
    reasons, you might not want to use the automatic login function unless your computer
    is at home, is used by no one else, and is not storing anything you might not
    want anyone else to see. The same warning applies to the *Passwordless Login*
    option. The *Preselect User* option is a handy one if you are the only usual user
    on your machine. You still need to enter your password.


    # GDM


    The GNOME login manager is similar to the KDE login manager. There are only so
    many original or innovative things you can do with the concept of a login manager.
    GDM (*GNOME Display Manager*) is set up so that you just type in your username,
    press Enter, type in your password, and press Enter again. On the screen, you
    also see options for changing the language, rebooting the computer, and shutting
    down the computer. The Session button lets you start Linux with any of the desktop
    environments that you have installed.


    The biggest difference between KDM and GDM is the flexible themes available in
    GDM. Although KDM gives you options for theming, those themes are the same themes
    as the style and window decoration themes in KDE for your desktop windows. The
    GDM themes are independent themes that are extremely flexible. You can view some
    of the themes people have made for GDM at [http://lart.gnome.org](http://lart.gnome.org)
    and [http://gnome-look.org](http://gnome-look.org). Make sure you don''t befuddle
    yourself by installing a radical theme. Some themes for GDM can change the button
    labels on the login screen, as well as the graphics and placement of elements.


    # Configuring GDM


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_62_0.png)


    The GDM configuration tool is arranged in tabs, just as in KDM. Options that you
    can change range from the basic to the perplexing. You need your root password
    to make changes to the GDM configuration. Here is an overview of each tab.


    **General.** You choose whether you want to use the graphical (themed) or the
    *standard* (old style with minimal graphics) greeter for your login screen on
    the General tab. The text in the Welcome String text sets what text will display
    on'
  merge: -1
  img_proc: true
- pgno: 63
  md: "the login screen. The Automatic Login option is okay if you are the only person\
    \ using your computer and are not worried about security. The Timed Login section\
    \ goes together with the automatic login, but you can instead have the computer\
    \ log in automatically. The first two sections are divided between local login\
    \ (when you are physically at the computer) and remote login (when you are logging\
    \ in from across a network). You will most likely need only local login options.\n\
    \n**Standard Greeter.** This tab has options for the old standard greeter. The\
    \ GDM standard greeter is a lot like the KDM greeter. You can set a logo image,\
    \ turn on the face browser to allow an avatar image for each user (to set the\
    \ image in the GNOME Control Center, see Topic 4), and select background image\
    \ and color options.\n\n**Graphical Greeter.** On this tab, I have the most fun.\
    \ There aren't many options to set here, but I love to theme things. You can choose\
    \ from four preinstalled GDM themes (see Figure 2.2). Use the Install New Theme\
    \ button to install a compressed file of a theme, or use the Delete Theme button\
    \ to remove themes. When you download a new GDM theme, don't unpack the compressed\
    \ file. You install the file as is, compressed as an archive file.\n\n![](img/f2b5f4073f00f9ec5546d9acb9cc6448_63_0.png)\n\
    \n**Figure 2.2**  \nThe theme chooser for GDM in Fedora.\n\n**Security.** For\
    \ the paranoid among us, I now present the Security tab. Paranoia can be a good\
    \ thing when it comes to computers. Options here are in check boxes, so they are\
    \ easy to read and make decisions about. Most of the options are a matter of preference.\
    \ I turn off remote root login because I think that is a good idea. XDMCP is used\
    \ for remote graphical logins."
  merge: -1
  img_proc: true
- pgno: 64
  md: '**Accessibility.** You can enable or disable the accessibility modules for
    the login screen. GDM''s accessibility features include an onscreen keyboard and
    alternative sound notification for events.


    **XDMCP.** You probably don''t need to enable XDMCP right now. XDMCP manages remote
    logins.


    # ## XDM


    There is also the generic flavor of the login manager programs, XDM (X Display
    Manager). XDM used to be our only display manager choice and is still the source
    of much of what you see in other login managers. You will probably not need to
    use XDM because there are more features in KDM and GDM, but you might see the
    program referred to here and there.


    # # The Desktop Landscape


    Whereas the opportunity in open source software to change programs for your custom
    needs is a great advantage in many cases, it can also lead to confusion when one
    version of a program is not consistent with other versions. This convenience problem
    doesn''t pop up very often, but the best and most notorious example of it is in
    how distributions alter the default appearance of the two main desktop environments,
    KDE and GNOME. Instead of the default KDE or GNOME menus, you will see Mandrake
    and Fedora menus. Distros also often favor one desktop environment over another.


    Mandrake defaults to using KDE. When you log in to Mandrake for the first time,
    without changing options for your session, you will end up in KDE by way of the
    KDM login manager. Fedora is equally prejudiced in its love of GNOME. The default
    login process in Fedora takes you through the GDM login manager and lands you
    in GNOME. Don''t be afraid to be a rebel. You can use KDE in Fedora and GNOME
    in Mandrake.


    For the sake of simplicity, we go over the landscapes of KDE and GNOME using the
    default configuration of each in the distribution that favors it. That means looking
    at KDE in Mandrake and looking at GNOME in Fedora. If you take that rebel route
    I mentioned, you will find that a few menus and icons are different, but it should
    not be hard for you to poke around and find what you need.'
  merge: -1
  img_proc: true
- pgno: 65
  md: "# Panels and Menus\n\nPanels and menus are your desktop palettes that hold\
    \ icons and links to programs and files. Without panels and menus, you would just\
    \ have a pretty desktop picture and nowhere to go. Every operating system and\
    \ desktop environment may style their panels and menus differently, but the common\
    \ function makes them easy to recognize. KDE and GNOME handle these important\
    \ widgets in a similar manner.\n\n# KDE\n\nThe KDE desktop environment (see Figure\
    \ 2.3) gets alternately praised and criticized for its similarity to the Windows\
    \ desktop. There are similar concepts inside as there are windows, a taskbar type\
    \ of object, and desktop icons, but KDE is its own creature with its own complexities.\
    \ Let's look at the basic components of your KDE desktop, starting with the panel\
    \ at the bottom of your desktop.\n\nFigure 2.3  \nThe KDE desktop in  \nMandrake.\n\
    \n![](img/f2b5f4073f00f9ec5546d9acb9cc6448_65_0.png)\n\n# The Kicker Panel\n\n\
    The Kicker panel is the bar at the bottom of your desktop that looks like the\
    \ taskbar in Windows. The objects on the panel help you access the programs installed\
    \ on your computer, see what windows you have open, take advantage of virtual\
    \ desktops, and use a few other utilities. The panel is your dashboard, where\
    \ you have everything you need to run the machine. Here are descriptions of the\
    \ panel objects that you see, moving from left to right."
  merge: -1
  img_proc: true
- pgno: 66
  md: '**KDE Kicker Panel Objects.** KDE provides a default set of panel objects and
    icons for you. Most of the icons link to frequently used programs, and the other
    objects include a few bare necessities.


    # # The K Menu


    KDE calls its main menu the K menu. The K menu is arranged into categories in
    which you will find most of the programs that are installed on your computer.
    The category names are simple enough (Office, Internet, Multimedia). You can guess
    what programs are in most of the categories. The K menu, of course, looks different
    in Mandrake than it does in Fedora. We will look at the Mandrake version. The
    Fedora version of the K menu is quite similar to the Fedora GNOME main menu described
    later in this topic.


    The more ambiguous category names in the K menu are **System** and **More Applications**.
    The **System** menu is a maze of submenus. This is the place to take care of configuring
    KDE, configuring your computer, and accessing other system utilities. **More Applications**
    is your miscellaneous category that contains links to programs that Mandrake didn''t
    think fit well in any other category.


    The other menu items in the K menu that are near the bottom are important items
    that you might need often. Here is a quick rundown of those menu items, starting
    at the bottom and moving up.


    **Logout.** This asks if you want to end your session (log out and return to the
    login screen), turn off the computer, or restart the computer. Mandrake has a
    mysterious picture of a cute little dragon in this dialog box. There''s probably
    something Freudian in that.


    **Lock Screen.** This activates the screensaver and prevents access to your desktop.
    To get back to your desktop, you need to enter your user password.


    **Start New Session.** This displays multiple user options. Linux allows more
    than one user to be logged in at a time. Most graphical desktops do not emphasize
    this option, in favor of simplicity. When you start a new session, you see the
    login screen again. Just log in and go. You can click on this option to read the
    warning, which explains how function keys are used for switching between sessions.


    **Run Command.** This brings up a text box for commands. If you know the terminal
    command for a program, you can use this option to type in the terminal command
    for the program you want to start. This can be a quick alternative to mousing
    through menus and submenus.


    **Recent Documents.** This lists many of the recent documents you have had open
    in KDE programs. This menu often isn''t good at including documents used in non-KDE
    programs. You can clear the list with the Clear History button.'
