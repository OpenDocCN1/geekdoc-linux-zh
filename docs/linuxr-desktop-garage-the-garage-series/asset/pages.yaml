- pgno: 272
  md: 'It is best to just start here and follow the links to the latest release to
    install. The installation happens right in your browser. Depending on how you
    have Mozilla or Firefox installed, you might have to run your browser as the root
    user to get ChatZilla installed. If you''re not sure, run the program as root.


    # Run as Root


    What''s the easiest way to run a GUI program as root? The terminal, of course,
    is the best method, for example:


    ```

    ```

    $ su

    Password:

    # mozilla &

    ```

    ```


    Don''t forget, the ampersand at the end of the command runs the program in the
    background, keeping your terminal free for more commands.


    When you have the program installed, you need to restart your browser. Close and
    open Mozilla or Firefox, and then take a look in the menu. In Mozilla, go to Window
    > IRC Chat. In Firefox, go to Tools > ChatZilla. Firefox also gives you the option
    to add ChatZilla as a toolbar button.


    +   - 1. Open ChatZilla (see Figure 10.8).

    +   - 2. The initial screen that you will see is full of “[INFO]” blurb s. Among
    those are a list of available networks. Just pick one of those: Click freenode
    to start.

    +   - 3. You are prompted for a nickname. Enter one and click OK. Pick something
    that won''t embarrass you later in life.

    +   - 4. Lots more messages scroll through. If you have successfully joined the
    server, you should see something like this at the end of all the other info:

    +      - `-- End of /MOTD`

    +      - `== User mode for [your user name] is now + i`

    +      - The MOTD is the message of the day. That''s what a lot of the text that
    scrolled past was. Just scroll up in the window to read it\u2014some of them are
    pretty funny.

    +   - 5. Now you need to find a channel to join. A channel is like a room full
    of people to talk to. To list active channels, type this:

    +      - `/list`


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_272_0.png)'
