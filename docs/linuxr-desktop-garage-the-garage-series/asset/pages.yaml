- pgno: 12
  md: '![](img/f2b5f4073f00f9ec5546d9acb9cc6448_12_0.png)


    # # Preface


    # ## Why a Book About the Linux Desktop?


    M o st Linux books are about running servers, writing bash scripts, or managing
    networks. You might have these lofty Linux goals in mind, but no matter who you
    are, you probably want to do things like visit Web sites, check your e-mail, or
    chat online. There are command-line programs to do those things, but why be so
    limited? Whether you are a new Linux user or an experienced user who wants to
    learn more, we are all users who spend time on the desktop.


    Not long ago, to have Linux as your desktop operating system meant looking at
    clunky windows and jagged fonts. You stared at long menus not knowing what most
    of the choices meant. You had to search and search to find out how to do the simplest
    activity. In the past few years Linux has changed. Linux has programs, utilities,
    and fun extras that are well designed and easy to use. Some programs in Linux
    today are better looking and easier to use than many of those found in Windows.
    Linux is no longer an inconvenience. The Linux desktop today lets you get your
    everyday tasks done while having fun with your computer.


    All of this fun still needs a little figuring out from time to time. In this book,
    we will figure it all out. We go through all the fun things we can do in Linux
    and learn how to get a little work done, too.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# ## What Is in This Book


    This book is full of self-help tips that will regrow your thinning hair, help
    you lose weight, make you money on the real-estate market, cook you a turkey on
    a rotisserie, and sell you a new set of knives. Why, this book is one great big
    late night TV infomercial. I''m lying. I do that. You''ll learn.


    This book is actually full of Linux. I love Linux. I love exploring Linux, and
    I bet you will, too. When I turn on my computer, I have things to do. I bet you
    do, too. All the chapters and sections in this book are arranged by the tasks
    that you need to do: from installing Linux, to setting up your preferences, to
    browsing online, to e-mail, to office productivity, to all the fun things we do
    with our computers when we''re supposed to be working. Rather than telling you
    which programs you should use for different tasks, you will find reviews, how-tos,
    and detailed descriptions of the most popular programs in each category. Linux
    is about choice, so I want to give you all the information and tools you need
    to make your choices.


    # ## Conventions Used in This Book


    +   * **Program Info**—This is the quick reference information you need to start
    up a program. Anytime a program is available on your main menu, you can find the
    path here. You can also find the terminal command and URL for programs here.


    +   * **ToolKits**—What''s the good of learning if you don''t get to use it? The
    ToolKits give you a chance to put what you learn to work.


    +   * **Under the Hood**—These tips contain extra bits of information and alternative
    methods


    +   * **Sidebars**—These asides give you fun facts about programs and topics.


    +   * **The Skinny**—While you have all of the tools you need to make your choice
    of programs yourself, you might want a little opinion. The Skinny sums up the
    good, the bad, and the ugly in each program.


    # ## What Is on the CD


    So, you are reading this book to learn more about Linux. To install Linux, you
    need an extra computer or room on your hard drive to install it. It might just
    want to try out Linux and learn about it before taking the big plunge. The CD
    in this book is a Linux live CD of the distribution Gnopix. A Linux live CD is
    a'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'Linux distribution that will boot up and run right off the CD without having
    to install a whole operating system on your computer. Gnoppix does not include
    every program that is covered in this book, but it provides you with enough to
    get your feet wet. Use the CD to get comfortable with a few Linux programs, and
    then go on the adventure and install a Linux distribution of your own.


    You can read more about Linux live CDs in Topic 1. You can read more about Gnoppix
    at http://www.gnoppix.org.


    To use the Gnoppix CD in this book, you need a PC with these requirements:


    +   PC with Intel-compatible CPU (486 or later)


    +   Bootable CD-ROM drive


    +   At least 96 MB for graphics mode


    +   SVGA-compatible graphics card


    Unfortunately, Gnoppix does not currently have a Mac version.


    Put the CD in your CD-ROM drive. Reboot your computer. You will need to make sure
    that your computer is set up to boot from CD when a bootable CD is present. See
    Chapter 1, "What Are You Getting Into?" and the "Under the Hood" note titled "CD
    Boot" on page 20 for more information about how to boot from your CD drive.


    # What Is on the Web Site


    At http://www.snerf.com/linuxdesktopgarage you will find lots of accompanying
    materials for this book. The Web site has errata (those are errors, not porm),
    all of the URLs from each chapter, information and links for newer versions of
    Linux software and Linux distributions, example files from the book, and more.'
  merge: -1
  img_proc: true
