- pgno: 230
  md: 'OpenOffice.org Draw is an odd duck. The program is both a standalone program
    and a complementary program to Ooo Writer. There isn''t really a direct counterpart
    for Draw to compete against in the MS Office world, although it can handle some
    of the work you might use Visio for without specializing in those tasks. Draw
    is a simple graphics tool that enables you to create quick sketch representations
    or complex diagrams. You can create 2D and 3D shapes (see Figure 8.6), use connectors
    for flowcharts and network diagrams, and use Bezier curves.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_230_0.png)


    Figure 8.6

    OpenOffice.org Draw showing some basic shapes.


    To create shapes and graphics, you mostly use the tools on the left sidebar and
    then supplement those with formatting buttons on the top toolbars for things such
    as color and text formatting. You can turn text into shapes, similar to but more
    powerful than MS Office''s Word Art. Importing and exporting images is easy, with
    support for GIF, PNG, JPG, TIF, and BMP. Don''t expect to be able to edit photo
    images in Draw, though; you can edit only graphics created in Draw.


    # Other Office and Productivity Programs


    # AbiWord


    | | |

    | Program Info | |

    | Terminal command | abiword |

    | Program URL | http://www.abisource.com/ |'
