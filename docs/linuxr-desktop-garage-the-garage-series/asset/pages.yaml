- pgno: 50
  md: 'Development. Making sure to include those categories of programs will help
    you if you need to install any programs later by compiling the program from its
    source. We talk more later about installing new software. As long as you are in
    the custom package selection, add the KDE (*K Desktop Environment*). Having both
    is good to see which one you like best and will help you with many of the examples
    and programs in the rest of this book.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_50_0.png)


    Fedora’s custom package-selection screen.


    # Users


    Unlike some OSs in which you are just you, on Linux, you have split personal-ities.
    I don’t think any of the things that happened to Sally Field in *Sybil* (if you
    don’t know that reference, *http://limbb.com* is your friend) will happen to you,
    but you are going to have to learn the differences among your multiple selves.


    The root user is the user in charge of administering the computer. If you want
    to install software, change the system configuration, or access certain directories,
    you need to be logged in as the root user. The root user is similar to being the
    Administrator in Windows XP Professional or to giving your user-name administrative
    privileges. Instead of always logging into your computer as the root user, you
    should create a regular user account to use as your everyday login. No one can
    stress enough the importance of running Linux as a regular user rather than the
    root user. By running under a regular user account, your computer will be more
    secure, both from unwanted intrusion and from you messing anything up.


    Both Fedora and Mandrake will ask you for a root password during the installation
    process.'
