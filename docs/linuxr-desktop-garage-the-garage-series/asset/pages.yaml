- pgno: 196
  md: 'On your first time using Evolution, you will see the Evolution Setup Assistant.
    This wizard will prompt you for entering e-mail information. If you want to use
    Evolution for e-mail, fill in all the appropriate fields and refer to Topic 6,
    "E-mail and Newsgroups," for more information. Otherwise, fill in enough silly
    information, such as ddes@fffagg.hh, to make Evolution happy, complete the time
    zone field, and move on.


    Evolution will look familiar to you if you have ever used Microsoft Outlook. The
    layouts of the programs are similar. Program elements such as the menu, toolbar,
    and status bar have familiar titles and icons. The menu bar changes, depending
    on which component of Evolution you are working in. The options in the File menu
    for Open Other User''s Folder and for Remove Other User''s Folder might be new
    to you. These options are for use with the Novell (or Ximian) Connector for Microsoft
    Exchange so that you can share mail folders and calendars on an Exchange network.
    Two other interesting items in the Tools menu are Pilot Settings and Pilot Conduit
    Settings. These items are links to elements of the gnome-pilot program. See the
    upcoming section "Syncing with Your PDA" for more details on these menu items.
    The toolbar is another program element that changes depending on which component
    view you are in. Other layout elements of Evolution stay the same. In the shortcut
    bar, you see buttons for each of the built-in components running in a vertical
    line along the left side of the bar. Clicking any of the buttons takes you to
    that component''s view. The folder bar is not seen by default in Evolution''s
    layout. You can add the folder bar to your view by going to the View menu and
    choosing Folder Bar. You can also toggle the folder bar into view with the labeled
    button below the toolbar in each view. The status bar, at the bottom of the window,
    shows you whether you are working online or offline and displays the progress
    of tasks such as sending and retrieving mail.


    # The Summary


    The Summary. . . well, it sums up all your information. This is the first screen
    you see when opening Evolution (see Figure 7.1). You can customize this screen
    with additional content or remove sections you don''t want to see. The Summary
    has sections for Weather, Newseeds, Mail Summary, Appointments, and Tasks.


    You can customize what is on the Summary screen by going to Tools > Settings >
    Summary Preferences. A series of tabs across the top correspond to the different
    sections of the Summary screen. You can check boxes for choices you want to see
    in the Summary screen.


    many references to the old name still crop up on message boards, on Web pages,
    and in newsgroups.'
