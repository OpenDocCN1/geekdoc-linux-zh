- pgno: 46
  md: '**Network Computer Server.** Software tools for the domain server on a network
    are in this choice. This group also contains the programs and utilities for sharing
    files on your computer with other computers on your network. If you plan to share
    files with Windows or Mac computers on the network, add this. Mandrake gives you
    a warning when installing some of these servers that could present potential security
    problems later. The warning is a nice feature so that you''re aware of the slight
    risk.


    **KDE Workstation.** KDE is Mandrake''s default desktop environment. Add this
    one.


    **GNOME Workstation.** GNOME is the other most popular desktop environment. I
    recommend adding both KDE and GNOME to try. You can decide which you like best
    later.


    **Other Graphical Desktops.** Here''s where you can add minimal desktop environments,
    such as WindowMaker and IceWM, or experimental ones, such as Enlightenment. If
    disk space isn''t a concern for you right now, just throw it all in for fun.


    # Fedora Install Types


    The install types in Fedora''s Anaconda installer are close to the beginning of
    the install process. Instead of many, more specific, categories, you choose from
    four types. If the package options within any of those choices do not match what
    you need, you can add or remove programs later.


    **Personal Desktop.** This choice gives you the fewest programs. If you know that
    you will not want to install many new programs, go for this choice. If you use
    your computer only to browse online, look at an occasional text doc, and e-mail,
    this could be your choice.


    **Workstation.** The Workstation type includes all the programs in the Personal
    Desktop choice, plus a few more. Software-development packages are included as
    well. You might not think that you need development packages, but I say do it
    anyway. You never know when you might need these packages. Software-dev packages
    are used when you need to install a program by compiling the code from source.
    The extra packages don''t require much more space and certainly can''t hurt to
    have. I think that this is the best choice to cover the largest group of users
    and their potential needs.


    **Server.** This is the choice for you if you want to run a server. If you are
    still going to use your machine for personal desktop functions, I suggest that
    you install Workstation and add the server packages that you need later with the
    package manager.'
