- pgno: 289
  md: '# XMMS


    # Program Info


    Fedora/GNOME menu Sound & Video > Audio Player


    Terminal command XMMS


    Program URL http://www.xmms.org


    This is the grandpa program of GUI digital audio players in Linux. XMMS has been
    around for a while but has stayed pretty popular throughout that time, just like
    the player that it is modeled after, WinAmp. As with many Linux programs, someone
    switched over from Windows, said, "I miss WinAmp," and made this version. XMMS
    is a solid little player that supports MP3, MOD, WAV, OGG, and others using plug-ins.
    There are plug-ins for some video support as well, but that function isn''t very
    well developed for XMMS. This player is mode for music.


    There are a few different window components to XMMS (see Figure 11.7). The three
    windows can be moved separately or together as a unit. The Main window contains
    the playback controls, volume control, progress slider, shuffle and repeat buttons,
    and playback display, which shows you information about the song you are playing.
    You can drag the Main window with your mouse and have the Equalizer and Playlist
    windows move with it. The Equalizer window has a graphic equalizer on it with
    several slider controls to adjust the spectrum of sound. The Playlist window lists
    the current playlist.


    # Figure 11.7


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_289_0.png)


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_289_1.png)


    also have written support for other portable players. The methods for how players
    sync with a given Linux program differ quite a bit, so do a quick search online
    for your particular player to find tutorials and reviews.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# An Ode to iTunes


    I used to be normal and listened to my music without thinking about how it was
    arranged or where I got it. Then I used iTunes. My digital music world changed.
    I cared about my ID3 tags. I wanted Smart Playlists and easy online purchase of
    songs, albums, and audio books. I was forever spoiled for normal MP3 listening.
    Rhythmbox makes up for my loss in many features, but it is like giving methadone
    to a heroin addict. The pool of needy, potential iTunes users in Linux isn''t
    large enough yet to convince Apple to make a Linux version. There is hope, though.
    I read that someone got iTunes for Windows to work in Crossover Office (more on
    that program in Topic 13, “Running Windows Applications”). I won’t stop begging
    Apple for a Linux version of iTunes, but I will try this hopeful alternative.


    XMMS arranges its windows and menus differently than other programs. You can access
    XMMS menus by right-clicking almost anywhere in any of the windows, just not in
    the list part of the Playlist window. Most of the menu options are for doing playback
    control and toggling the three window options in and out of view. In the Options
    menu, you can adjust many settings and change which skin XMMS displays. The Visualization
    menu has options for showing visualizer displays. Visualizations are digital light
    shows that often move with the beat of the music you play. There are a few built-in
    patterns and more available to download online.


    # Add Mp3 Support to XMMS in Fedora


    Read the beginning of ToolKit 11.2 to find out why you even need to mess with
    this. Fortunately, adding MP3 support to XMMS is cake.


    +   1. You simply need to install the package named xmms-mp3. You should be able
    to do that from FreshRpm’s.net’s repository using Apt or Yum. You can also get
    the package from Guru Labs (see [http://www.gurulabs.com/downloads.html](http://www.gurulabs.com/downloads.html)).

    +   2. Update Apt like normal:

    +   3. Install the xmms-mp3 package that XMMS needs for MP3 support:

    +   4. Open XMMS, and you should be ready to go.


    ```

    # apt-get update

    ```


    ```

    #apt-get-install xmms-mp3

    ```'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# # Watch Movies


    # ## Xine


    **Program Info**

    | Terminal command | xine | Program URL | http://xine.sourceforge.net/ |


    One of the most popular media players available for Linux is Xine (see Figure
    11.8). Xine supports many media types, from simple MP3 files to DVDs, AVI, MPEG
    video, and more. Codc are used to manage different media types, and plenty of
    codecs are available for Xine. Need to play a certain kind of file? Simple: Just
    find a codec that has been written for Xine for that media type, download it,
    and install the codec in Xine. In addition, many plug-ins are available for Xine
    to add more functionality to the program, such as new front-end modules that change
    the GUI for Xine''s controls and codecs to play new media types. Unlike other
    Linux media players, Xine''s GUI interface is installed by default, an added bonus
    for desktop users who like their mouse better than their terminal.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_291_0.png)'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'Totem is a front-end plug-in that runs on Xine''s base (see Figure 11.9). Totem
    shares many attributes with Xine as a player but sports a simplified interface.
    The program is split between a video and an audio player. The video player seems
    to be the more useful half. The pared GUI in Totem might not be as shiny as Xine''s
    interface, but the buttons and functions can be clearer and easier to find. Totem
    is the default player in GNOME 2.6 and is also the default player in Mandrake
    10 for both KDE and Gnome. As a result, if you put in a DVD, you will likely have
    Totem pop up automatically and start playing it for you.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_292_0.png)


    With Xine, as with other media players, there are many different ways to tweak
    the video and audio output to account for glitches and bugs. You can find a few
    of those tips online at Xine''s FAQ page (see http://xinehq.de/index.php/faq).
    If you are simply playing small video files or regular DVDs, you most likely won''t
    have to mess with tweaking options.


    Features in Xine include the capability to play several supported file types,
    play DVDs with menu support, show a visualizer for use when playing audio files,
    and adjust TV tuner card configuration. There is also streaming playlist support,
    the capability to change aspect ratio and scale video, video quality controls,
    and screenshot capability.


    # PLAY A MOVIE IN TOTEM


    If you don''t have Totem installed in Fedora, you can grab it from the APT and
    Yum repositories on freshrpms.net.


    # The Quick Way


    +   1. Put your DVD into the drive.

    +   2. Open Totem. You can type in the command `totem`. In Mandrake, find Totem
    from the main menu, Multimedia > Video > Totem Movie Player. In Fedora, look in
    the main menu under Sound & Video.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# Figure 11.9


    Totem playing

    a movie.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_293_0.png)


    +   3. Under Totem''s menu, go to Movie > Play DVD.

    +   4. Study episodes of the cartoon "Aqua Teen Hunger Force" for connections
    to the questions about the death of Elvis.


    # The Quicker Way


    +   1. In Mandrake 10, put in your DVD.

    +   2. Okay, you''re done. Totem pops up by default, playing the DVD.


    In both scenarios, just use the Play button to start things. You can use your
    mouse on the DVD''s menus.


    Xine''s default controls are shiny but confusing. Maybe they are confusing because
    they are shiny, and I think a qualified psychiatric professional would have to
    decide that question. The buttons aren''t labeled, and most don''t have intuitive
    icons or abbreviations on them. You can mouse over each button to see ToolTips,
    but when you want to perform a specific action, it can get to be like "Where''s
    Waldo?" using a mouse cursor. Right-click in Xine''s screen window to get to the
    menus. Those are easier to navigate. Everything in the default controls seems
    clunky without one of the nicer front-end plug-ins, like Totem. I definitely recommend
    using Totem to make your Xine life happier.'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# # MPlayer


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_294_0.png)


    I have a love-hate relationship with MPlayer. For years, the program was your
    best choice for playing a number of video and audio file formats—and, some might
    say, it still is. The great flexibility of MPlayer is made possible by its use
    of codecs (short for coders-decoders). Codecs are add-ins that act as translators
    for different digital media types. So, yes, MPlayer is cool and very handy (see
    Figure 11.10). Where does the hate half of my relationship come in? MPlayer just
    always seems to have some problem or complexity in installing or in adding codecs.
    I would blame this on my own ineptitude, but lots of other people have problems
    setting up MPlayer as well.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_294_1.png)


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_294_2.png)


    Mandrake comes with MPlayer, so Mandrake users are ready to go. You can install
    MPlayer using Apt or Yum in Fedora. The problem is in getting the GUI for MPlayer
    to work, if you feel you need GUI support. MPlayer is fully functioning from the
    command line, but having the GUI available is more fun. To get the GUI working,
    be sure to install the packages for GUI support, mplayer-gui, and skin support,
    mplayer-skins. The GUI and skin support might be included by default, depending
    on your installation method, but it''s a good thing to double-check if you have
    trouble later. There is a good site for Fedora users at `http://luna.cs.csu.edu/domik/mplayer/`.
    Grab everything in the Essential Downloads section.'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'With a fresh copy of MPlayer, you can play many audio and video types, including
    AVI and OGG files. To play more video and audio formats, you need to download
    some codecs. A lot of codecs are available to download and install, but the bundle
    that you want to start with is the Essential Codecs Package, on the Downloads
    page of the MPlayer Web site. Open your file manager to uncompress the file you
    just downloaded into a new directory, or open a terminal and uncompress the file
    with this command:


    ```

    tar -xvjf [filename]

    ```


    As root, copy all the codecs to `/usr/lib/win32` (create the directory, if it
    does not exist). MPlayer should be ready to play most common file types now.


    Skins are easy to add in MPlayer. You can download skins from the MPlayer Web
    site Downloads page. You need to copy new skins to the directory `/usr/local/share/mplayer/Skin`
    (check which directory you have MPlayer installed to). You should copy the whole
    directory for each skin, not just the files inside the directory.


    # Ogle


    | | | |

    |---|---|---|

    | **Program Info** |||

    | Terminal command | `ogle` ||

    | Program URL | `http://www.ctek.chaimers.se/groups/dvd` ||


    You know, McDonald''s was the first to have chicken nuggets, or McNuggets, as
    any gourmet would correct you. The nuggets were popular, and then the other fast
    food places jumped on board with their own versions. Sure, some of the newer nuggets
    were better than Mickey''s nuggets, but you had to respect the original nugget
    for being the first, the innovator. Ogle is the Chicken McNugget of Linux DVD
    players. It was the first DVD player in Linux to support DVD menus and navigation.
    Other Linux DVD players might be better, but you have to respect the innovator.


    Ogle is a dedicated program for playing DVDs (see Figure 11.11). That''s all it
    does, and it does it well. The controls and interface are nothing fancy, but they
    are clear and easy to use. Mouse over each button to see ToolTips. Ogle''s main'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'window is just a toolbar with a lot of buttons. A new viewing window opens
    when you open a DVD to play. First, you have your main playback controls in both
    rows of buttons on the left side. Most of these have icons you will recognize
    for Play, Stop, and so on. Right of those buttons are directional buttons for
    menu navigation, chapter access, and menu access. If you have a DVD player in
    your living room, most of these buttons are similar to the ones on your remote
    control.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_296_0.png)


    # **Figure 11.11**

    Ogle playing a DVD.


    Many keyboard shortcuts in Ogle enable you to easily perform basic functions while
    watching a movie without having to swing your mouse around all over the picture
    (see Table 11.2). These shortcuts are handy when you are in full-screen mode.
    Sometimes I prefer to poke people in the face with my mouse cursor, for lots of
    fifth-grade-flavored fun.


    MPlayer can be one of the more complex programs to get working correctly, and
    your setup and system might vary. If you have trouble, do some searching for other
    methode online.'
  merge: -1
  img_proc: true
- pgno: 297
  md: "Table 11.2: A Few of Ogle's Keyboard Shortcuts \n| KEYBOARD SHORTCUT | FUNCTION\
    \ | \n| :--- | :--- | \n| P | Play, resume from Pause | \n| > | Next chapter |\
    \ \n| < | Previous chapter | \n| <space> | Pause | \n| f, F | Toggle full-screen\
    \ mode | \n| t | Jump to DVD title menu | \n| . (period) | Fast-forward | \n|\
    \ , (comma) | Slow motion |\n\n# The Watchful Eye\n\nYou might find it hard to\
    \ believe, but under the Digital Millenium Copyright Act (DMCA), it is currently\
    \ unlawful for you to play a DVD that you have purchased on a Linux media player.\
    \ This oddity occurs because, to provide you with the means to play DVDs protected\
    \ by the Content Scrambling System (CSS, a copy protection measure used by distributors),\
    \ developers have reverse-engineered a way to get past the copy protection (DeCSS).\
    \ Many legal battles about this already have ensued ([http://cyber.law.harvard.edu/openlaw/DVD](http://cyber.law.harvard.edu/openlaw/DVD)),\
    \ and more are sure to come. None of the players we are discussing requires the\
    \ nefarious DeCSS. The Turbolinux distribution has released a version containing\
    \ Linux's first commercial DVD player, the PowerDVD player for Linux by Cyberlink.\
    \ Hopefully, that program will be available for purchase separately so we can\
    \ all play our Elvis movies without checking outside for the approaching authorities.\
    \ Write your Congressional representatives about this silly law ([http://www.congress.org/congressorg/home](http://www.congress.org/congressorg/home)).\n\
    \nThird-party add-ons are available for Ogle that can make the program easier\
    \ to use. First, there is a KDE front end for Ogle called oKle (see [http://okle.sourceforge.net/](http://okle.sourceforge.net/)).\
    \ This program adds simplified access to some of Ogle's functions and blends in\
    \ with KDE. There is also an ambitious add-on called Goggles (see [http://www.tifthplanet.net/goggles.html](http://www.tifthplanet.net/goggles.html)).\
    \ The software requires the Fox Toolkit (a GUI development tool for developers),\
    \ which makes installing Goggles more complex, but the work is worthwhile for\
    \ anyone who will use Ogle often. Goggles features include automatic bookmarks\
    \ and automatic starting."
  merge: -1
  img_proc: true
- pgno: 298
  md: "# RealPlayer\n\n**Program Info**\n| | |\n|---|---|\n| **Terminal command**\
    \ | `realplay` |\n| **Program URL** | http://www.real.com/linux |\n\nTwo RealPlayer\
    \ versions for Linux are available for use. Real has had a UNIX version of its\
    \ free RealPlayer 8 for years. The UNIX version 8 is community supported, which\
    \ means that Real doesn't support it or develop it—it just distributes it as an\
    \ alternative version. Real has also released RealPlayer 10 for Linux (see Figure\
    \ 11.12). The interface to RealPlayer 8 for UNIX is pre-GTK 2.x, which means some\
    \ clumsy-looking controls and no smooth, antialiased fonts. However, version 8\
    \ works just fine. RealPlayer 10 for Linux is much more slick and polished.\n\n\
    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_298_0.png)\n\nFigure 11.12  \nRealPlayer\
    \ 10.\n\nIf you're not familiar with RealPlayer, it plays many media types, including\
    \ RealAudio, RealVideo, MP3, OGG, and AAC (not the ones copy-protected by ffunes).\
    \ There are better players for most of those media types, but RealPlayer is usually\
    \ your only choice for RealAudio and RealVideo, which are often found streaming\
    \ online."
  merge: -1
  img_proc: true
- pgno: 299
  md: "You will probably want to set up a browser plugin for Real media types.  \n\
    The installer offers to install the plug-in for you, but, with varying plug-in\
    \ directory locations among different browsers and browser versions, the installer\
    \ accomplishes its lofty goal only half the time. Check out Mozilla’s plug-ins\
    \ page at http://plugin.do.c.ozweb.org for more information.\n\n# **FRIDGE**\n\
    \n# **Ultraviolence Makes a Comeback**\n\nIt used to be that if you showed up\
    \ early to a movie, you were subjected only to a bad silent show of advertisements\
    \ for chiropractors and some scratchy music. It could all be ignored. You could\
    \ talk to the people you came to the movie with. You could have some fun by going\
    \ to the movie early, getting a good seat, and learning about the wonderful services\
    \ of your local chiropractors. We showed up at a movie early the other day. There\
    \ were no slides. There was no scratchy music. There was no fun. We had walked\
    \ into the advertising version of A Clockwork Orange. We sat down to a trap. Loud\
    \ movie and carnival barking emitted from the speakers. Flashes of advertisements\
    \ and marketing burned our eyes. We tried to ignore it. We tried to have a conversation.\
    \ Our eyes were pinned open as we were programmed with the ultraviolence, ultraadvertising.\
    \ Brain cells were lost. When it was finally over, the TV commercials started.\
    \ By that time, there was no resistance.\n\n# **Helix**\n\nProgram Info\n\nProgram\
    \ URL | https://player.helixcommunity.org\n\nOnce upon a time, a group of developers\
    \ wanted to create a set of open digital media standards. They support and approval\
    \ from Real, a plus for implementing support for Real’s various audio and video\
    \ formats. The project is still in its adolescence, so don’t be surprised to find\
    \ bugs and complications. Getting browser plug-ins to work, especially in Firefox,\
    \ was where my patience was stretched."
  merge: -1
  img_proc: true
- pgno: 300
  md: 'To get a copy of the Helix Player, you can download executable installers or
    RPM files from https://player.helixcommunity.org/. Download options are limited
    as to the systems that are supported, and some are marked as “Experimental.”


    Although the Helix Player is not quite ready for the more trepidatious user, the
    program has great potential and is headed in the right direction. The Helix Player
    also represents the kind of compromise that other commercial companies with free
    software offerings (such as other media players and IM clients) should think about
    making. If those companies endorse and consult an open source version of their
    software, they can still have brand exposure and market recognition while not
    tying up a lot of their internal company resources in developing and supporting
    a new version of their software. The companies can also benefit from a more favorable
    reputation among Linux users. I always thought of Real as the Devil’s Privacy
    Encroachment Division, but now I am willing to cut it some slack. Apple Quicktime,
    you know I’m talking to you.


    # The Skinny


    | PROGRAM | USABILITY | INTERFACE | COMMENTS |

    | --- | --- | --- | --- |

    | Grip | Good | Fair | Grip is easy to use for ripping CDs. The series of tabs
    that the interface is arranged into is a little clumsy but not too hard to navigate
    through. The program could use some redesign in its configuration options, to
    make them friendlier for new users. Grip does the job efficiently. |

    | Rhythmbox | Great | Great | Simple layout and function make this the unchallenged
    choice for practical users who just want to listen to music, not stare at prettiness.
    The program is a little younger than other Linux audio players and is still working
    out a few bugs. |

    | Noatun | Fair | Good | This program works well but feels weird. The skins look
    cool sitting on your desktop but aren’t easy to use when you are in a hurry. The
    options for playback are simple. Choose this player if you value style over function.
    |'
  merge: -1
  img_proc: true
- pgno: 301
  md: '| PROGRAM | USABILITY | INTERFACE | COMMENTS |

    |---|---|---|---|

    | XMMS | Great | Good | Here is the solid, standby program with the best cross-section
    of features. XMMS has the practical usability of Rhythmbox and the visual fun
    of skins and visualizations of Noatun. XMMS outshines both those programs in its
    combined power. The interface is a little cramped and is showing its age. Unless
    new versions make improvements, newer players could surpass XMMS. |

    | Xine/Totem | Great | Great | Xine is flexible, dependable, and well designed.
    Using codecs and plug-ins, you can make the program play just about anything.
    It is easy to install and control, and the usability increases when using the
    simplified controls of the front-end add-on Totem. |

    | Mplayer | Fair/good | Good | It''s a chore to install and configure, but MPlayer
    is a good media player and great to use as a browser companion for online media
    files. The program is fully functional from the command line as well. |

    | Ogle | Good | Good | Ogle is the DVD player for Linux, period. DVD is all Ogle
    does, and it does it well. The interface is plain but functional. A couple features
    could use some work, but available additions to the program, such as Goggles,
    go a long way in making up the difference. |'
  merge: -1
  img_proc: true
- pgno: 302
  md: '| PROGRAM | UsABILITY | Interface | Comments |

    |---|---|---|---|

    | Real Player | Good | Good | Real''s Linux version 10 is a great improvement
    over past versions. The installer is an executable that will be a different experience
    than installing most other Linux software. For best results on streaming audio
    and video, set up MIME types in your browser in addition to (or instead of) setting
