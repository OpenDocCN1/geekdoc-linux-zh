  md: "# **Figure 7.1**  \nEvolution’s  \ndefault  \nSummary  \nscreen.\n\n![](img/f2b5f4073f00f9ec5546d9acb9cc6448_197_0.png)\n\
    \n# **Futzlng with File Formats**\n\nYou can import mail messages, calendars,\
    \ and contacts into Evolution. Figuring out the right file formats to use and\
    \ how to get the information into Evolution can be frustrating. Importing information\
    \ from Outlook or Outlook Express, version 4 or below, will be no problem. Otherwise,\
    \ your best options are to import single files of .mbox for mail-boxes, .vcf files\
    \ for contacts, and .ics for calendars. A quick trick for newer versions of Outlook\
    \ and Outlook Express is to install Mozilla in Windows, import all mail and address\
    \ data into Mozilla, and then use Mozilla to export that information to a more\
    \ standard format.\n\nThe newsfeeds are an interesting part of Evolution’s Summary\
    \ screen. Most of the default feeds are related to technology and Linux, so you\
    \ can feed your inner geek with daily geekitudes. There are a few entertainment\
    \ and other news choices as well. You can also add a newsfeed that is not in the\
    \ default list in the Summary Preferences dialog box. You are prompted for the\
    \ name and URL of the newsfeed you want to add. You can add any online feed that\
    \ is available in RDF format. The RDF format is a standard for aggregating Web\
    \ content using XML (a markup language for defining and sharing data). RDF feeds\
    \ are often also called RSS feeds."
  merge: -1
