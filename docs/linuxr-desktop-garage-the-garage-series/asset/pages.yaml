- pgno: 323
  md: 'WineX/Cedega fully supports Microsoft''s DirectX. DirectX is a set of application
    programming interfaces (APIs) required to run most commercial games written for
    Windows. Cedega comes out with fairly frequent releases to keep up with new releases
    of DirectX.


    With the name change from WineX to Cedega comes lots of other changes in the new
    release. Many gamers run Linux for most of their everyday tasks but keep a Windows
    partition around just to play games. Cedega''s new release makes playing Windows
    games in Linux easier than ever with the new Point2Play interface, support for
    high-performance pixel shaders, and support for DirectX 9.0. There is also a new
    pricing scheme with a $5 monthly subscription. For frequent gamers, the subscription
    is worthwhile.


    # ## Finding Games for Cedega


    Not every game that uses Microsoft''s DirectX works in Cedega. Each game has to
    be tried out by the Cedega developers or by curious and brave Linux users. TransGaming
    Technologies, the makers of Cedega, maintain a forum on their Web site at [http://www.transgaming.com/](http://www.transgaming.com/)
    for users to report experiences and problems. When running different games in
    Cedega, users can vote on which games they would like the Cedega team to work
    on. Cedega supports hundreds of Windows games. There is a list to browse of games
    that have successfully run in Cedega, all rated on how well they work. You are
    usually okay when you stick to games that are rated at a 4 or 5. Newer games are
    usually rated better than older games.


    # ## Playing Games with Cedega


    Cedega works a bit differently from any of the game emulators we talked about.
    You don''t run a ROM through Cedega; you need a copy of the game disk. To play
    a game in Cedega, you put in your Windows game disk and then start the game from
    within Cedega. As long as you did your homework ahead of time, checking the lists
    and comments about your game on the TransGaming site, you can get a game running
    quickly and easily in Cedega.


    **Copy Protection Catastrophes**


    Many new games use complex copy protection that is transparent when you play the
    games in Windows but that rears its head when you try to play the games in Linux.
    The copy-protection software thinks that you are trying to do something nefarious.
    To get around this problem, you might need to download a “no-CD” patch (sometimes
    simply called game fixes) for your game. Sites such as [http://www.megagames.com/](http://www.megagames.com/)
    maintain'
  merge: -1
