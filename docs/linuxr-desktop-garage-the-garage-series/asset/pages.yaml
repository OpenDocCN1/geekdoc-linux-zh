  md: "to choose the best **package** for your system. Look for the following **text**\
    \ in package names to fit with these CPUs:\n\n+   - **i686**: Pentium II CPU or\
    \ above\n+   - **i586**: Pentium-class CPU or above\n+   - **i386**: 386-class\
    \ CPU or above\n+   - **ppc**: Apple Macintosh Power PC\n+   - **noarch**: Can\
    \ be used with any CPU\n\nYou can easily install an **RPM** file in Fedora and\
    \ Mandrake by double-clicking the **RPM** file in your file manager. You can also\
    \ install an **RPM** file in the terminal to have a little more control over the\
    \ installation options.\n\n# More Than One Way to Skin an RPM\n\nDid you think\
    \ there were even more ways to install RPM files? Ding! You are correct. Besides\
    \ the installation methods we talk about in the Toolkit, Fedora's Package Manager\
    \ and Mandrake's RPMDrake can install RPM packages. Both tools are easy to use\
    \ but are limited to the programs and version numbers on the install disks. To\
    \ use the Fedora Package Manager or Mandrake's RPMDrake, go to your main menu:\
    \ With Fedora Package Manager, choose **System Settings > Add Remove Applications**.\
    \ For Mandrake RPMDrake, choose **System > Configuration > Packaging > Install\
    \ Software**.\n\nI prefer Apt or Yum on Fedora, and Mandrake Update on Mandrake\
    \ for installing new programs and for updating because those programs are all\
    \ more robust. They can each pull newer software from their respective online\
    \ sources.\n\nThat's all good news. Want the bad news? The bad news is that each\
    \ RPM file you install reduces your computer's life by one year. It's like chronic\
    \ life-long smoking for your computer. RPMs will stunt your computer's growth.\n\
    \nOf course none of that is true, but I had to see if you fell for it for at least\
    \ a second.\n\nThe bad news regarding RPM files can be said with one word: dependencies.\
    \ Some RPMs install right away with no problems. Other RPMs require that you have\
    \ additional RPM packages installed first; those required packages are called\
    \ dependencies. These can be frustrating little exchanges between you and your\
    \ computer. Here's an example of a dependency error message:\n\n```\n# rpm -ivh\
    \ coffee-1.3.3-lmdk.l586.rpm\nerror: Failed dependencies:\n\tcoffee-kword is needed\
    \ by coffee-1.3.3-1mdk\n\tcoffee-kspread is needed by coffee-1.3.3-lmdk\n\tcoffee-karbonis\
    \ is needed by coffee-1.3.3-lmdk\n```"
