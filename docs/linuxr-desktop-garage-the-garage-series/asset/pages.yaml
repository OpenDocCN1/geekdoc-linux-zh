  md: '# What''s Your Preference?


    have a little twitch. I’m not quite obsessive compulsive. I don’t have to wash
    my hands constantly or make sure to turn light switches on and off a certain number
    of times. My twitch happens when I see someone else’s desktop. I walk up behind
    you when you are using your computer and see the default desktop wallpaper, the
    default icons, the default task bar items, and all the same colors that came with
    your desktop environment.


    “Rrraaoouuuga!” I yell as I stand directly behind you.


    You jump, startled, and turn around. I don’t like the furious look on your face.


    “What?” I ask.


    “Why are you sneaking up on me and yelling?” you ask.


    “I’m not,” I claim.


    You look at me with incredulous eyes and a fed-up grimace. “I just heard you.
    What do you mean, you didn’t do it? What do you want?”


    I’m thinking that you’re a little leasy today, but, hey, I’ll cut you some slack.
    You are reading my book, after all. “It’s a twitch, you know, a tick. It’s like
    Tourette’s syndrome.”


    “Wouldn’t that mean that you should be cussing me out right now?” you ask.'
