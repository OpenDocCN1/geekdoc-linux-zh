- pgno: 47
  md: '**Custom.** You pick this one at your own risk if you''re a beginner. Although
    the installer won''t let you leave out packages that other packages need, you
    could still accidentally end up without either KDE or GNOME, or with no office
    software, just by unchecking a box.


    # # Disk Partitioning


    When you partition a disk you divide it into sections. Linux requires that you
    create a few specific partitions. You can let the installer partition the disk
    for you automatically, or you can do it yourself. If you haven''t used any of
    the common partitioning programs, such as Disk Druid, fdisk, or DiskDruid, I recommend
    that you let the installer do it. You should also let the installer create the
    partitions for you if you aren''t very familiar with partitioning.


    Linux requires a boot partition, a swap partition, and at least one native partition.
    A Linux native partition is one that uses the ext2 or ext3 file systems. You can
    see an example of the partitions created by a default Fedora install in Figure
    1.4. In this install, a 12GB partition is left for Windows (vfat indicates that
    the partition is formatted with Fat32). The resulting Linux space is divided into
    a boot partition, a root partition, and a swap partition. See Table 1.1 for more
    about partition types.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_47_0.png)


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_47_1.png)'
