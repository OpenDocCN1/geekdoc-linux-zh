    If you are unsure about which packages you need, use the categories. Your safest
    bet is always to install more than you think you need. That way you can remove
    anything unwanted later after you have played with it and deemed it unworthy,
    or unneeded, or unwanted, after you break that program’s little heart. Let it
    down gently, though.


    If you do decide to use the individual package selection right now, be sure to
    include GNOME and the software-development packages. Mandrake does not include
    GNOME by default.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_49_0.png)


    # Fedora


    Before the actual copying of files, you will see an abbreviated list of packages
    to be installed based on the install type that you chose earlier in the process.
    You can go ahead with the default choices, which include the GNOME desktop environment
    and most basic programs that you will need, or you can choose Customize Software
    Packages to Be Installed.


    Fedora organizes all the packages into categories for you (see Figure 1.5). Just
    check the box to the right of the category name. You can see what packages are
    included in that category. Check or uncheck any of the packages that you want.
    This is the time when you can also check the categories for Software Development
