- pgno: 20
  md: '![](img/f2b5f4073f00f9ec5546d9acb9cc6448_20_0.png)


    # # What Are You Getting Into?


    So, you want to know what you''re getting into by using Linux. I can tell you
    what you''re getting into: trouble. You''re getting into trouble. That''s what
    you usually hear about Linux. Linux has a reputation for being the scary, complex
    operating system that only ubergeeks should use for running servers. Linux has
    a reputation for being the operating system that you would never put on your mother''s
    computer, or anyone''s computer who isn''t a computer genius. Just like my reputation
    for being a genius. Linux''s reputation for being the sole domain of technophiles
    is not deserved. Actually, I''m not sure if my reputation as a genius exists within
    any circles, but I think it''s a good rumor to get started. Pass on to five friends
    that I''m a genius, will ya?


    Linux has come a long way from the days when running Linux for every-day desktop
    tasks was difficult. Linux today can be even easier than Windows to install and
    set up. Sure, there can be hiccups, but there are errors and problems with using
    any operating system.


    If Linux is so easy and great now, what''s the trouble? You are getting into an
    operating system that the minority of people use. Being in the minority means
    that you are going to run into a few situations that arise because the rest of
    the world—such as Web site creators, hardware makers, and people sharing documents
    with you—uses a different operating system. The trouble spots we will run into
    as we go through this book learning to use Linux are usually minor ones that can
    be fixed by thinking about the problem.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'I suppose I''m not being very encouraging. I am being realistic. Tell you what,
    though—will give you two different descriptions of Linux and let you pick the
    one that like best.


    # The Slick Sales Guy Introduction to Linux


    Welcome to using Linux! With Linux, you will be able to browse the Internet, send
    and receive e-mail, process as many words as you want—*at no extra charge*, I
    might add (*whink*)—and build spreadsheets until you are coughing up charts and
    graphs. There''s no extra software to buy! You can create graphics, chat online,
    and play games. Got a schedule? You can manage your schedules and contacts and
    tasks. Wanna listen to your MP3 collection? We''ll help you do it. Watch movies,
    create a Web site, print on *gene*-ine paper!


    Here at Slick Sales Guy Linux, we have it all for you! How much would you pay
    for so much fun, so much productivity, so much stability? Did we mention that
    in Linux you won''t see that Windows Blue Screen of Death? How much would you
    pay now? Did you know that Linux comes with free candy, balloons, kittens, puppies,
    and clowns! How much would you pay now? Windows averages $150–$200. Additional
    software can cost you hundreds or thousands more. Linux is free! Act now, and
    we''ll even toss in the ability to participate in the development of new software!
    All for free!


    I usually don''t trust any sales guy, but everything he just said is true. I might
    have to check into the free candy, balloons, kittens, puppies, and clowns part,
    but let''s trust him on that for the moment. Linux is free. Linux distributions
    do come with all of that software included. With Linux, you have the opportunity
    to participate in the development of new software as well. It''s as wonderful
    as a barrel full of fuzzy monkeys, but here I come again with that realism.


    # The Suzan Introduction to Linux


    Using Linux on the desktop is great. When you are working with the most common
    tasks and programs in Linux, you''re golden. Bob''s your uncle. You''re a pig
    in a blanket. You''re—just insert your own regional, colloquial phrase here that
    means you won''t have any trouble getting things done or figuring out how to do
    what you want to do. I''m not going to lie to you, though: Once you step outside
    the *boundaries of common tasks*, you need to be prepared to fiddle, tweak, and
    fight with things. You need to be prepared to search for help. A lot of computer
    tasks have not been perfected in Linux yet. A lot of open source software projects
    are unfinished, undocumented, and hard to use.


    The trouble that you might run into does have its rewards. Linux is stable. You
    don''t have to restart Linux all the time. You can customize almost everything
    on your entire desktop. You can have a say in new versions of programs. You can
    be the smartest, most computer-savvy person on your block.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Again, all of that is true. Whichever way you choose to look at using Linux
    on the desktop, just know that we''re in for a fun ride together.


    So, what are you getting into? You''re getting into an adventure. Adventures are
    good. Adventures are fun. They make movies about people having adventures. How
    much adventure you get depends on why you''re here. If you''re here because your
    office switched over to Linux and now you have to figure out how to get all of
    your work done, your adventure may be as easy as learning new programs and setting
    up preferences. If you''re here because you want to try something new, your adventure
    can be as broad, as easy or annoying, and as in-depth as you want. In either instance,
    be prepared for a lot of "Ah-ha!" moments of discovery when you are proud of how
    darned smart you are. Be prepared for a lot of frustrating moments when you question
    what you''re doing using Linux and question your own sanity. Be prepared to learn
    a lot.


    That''s what you''re getting into, but now you need to know the requirements.
    I''m not talking about system requirements. I''m talking about my requirements
    of you. I have a demand.


    I am going to demand that you have fun.


    Don''t look for everything to be just like it is in Windows or on a Mac; it''s
    not the same. It is okay that things aren''t the same. You will find enough similarities
    to your old OS in programs we cover that you won''t feel like you''re a stranger
    in a strange land. As you start using Linux on the desktop, if something doesn''t
    work the way you think it should, or if you can''t figure out a problem that pops
    up, don''t throw your mouse across the room. Don''t kick your dog or look for
    your copy of Windows. Take the tough stuff and look at it like a giant puzzle;
    be logical, use the tools in this book, and find solutions. Most of all, keep
    having fun. No matter what operating system you use, the only way to survive working
    with computers is to keep having fun, no matter what you are doing.


    # ## Mastering the Lingo


    Remember that part in Airplane! when the two guys are talking and the stewardess
    doesn''t understand them? Then the Mom from "Leave It to Beaver" stands up and
    says, "Stewardess, I speak live." I''ve got our June Cleaver right here, I would
    never name my son Beaver Cleaver, but I can help out with the Linux live. Figure
    1.1 shows the relationship of the terms. You can find more definitions in the
    Glossary, but here are a few of the most common terms.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Figure 1.1


    Everyone likes charts. Here is a breakdown of the relationship of some Linux lingo
    from a user''s point of view.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_23_0.png)


    # Linux


    Linux is commonly used as a term for the whole operating system, for the desktop,
    for the community, for lots of things. Linux is actually just the kernel. “What''s
    the kernel?” you are asking. Don''t think about corn. There''s no corn involved.
    You can think of the kernel as the engine of your operating system. The kernel
    is the “Little Engine That Could” that runs underneath it all. The Linux kernel
    is responsible for security, allocation of resources, and the lowest-level hardware
    interfaces. The name Linux comes from the UNIX operating system and a man from
    Finland, Linus Torvalds. There are lots of interesting stories about the name
    Linux, but none of them will help you get online or check your e-mail, so I will
    leave that interesting history for you to look up online.


    If people want to argue over whether it is proper to use the term Linux to mean
    the whole operating system, they might want to find more interesting things to
    do with their lives. Language is flexible, and Linux has become the common term
    for an operating system based on the Linux kernel.


    # Distribution (Distro)


    > *Distribution: The act of dispersing or the condition of being dispersed; diffusion.
    —www.dictionary.com*'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'The regular definition of distribution also applies to a Linux distribution.
    There is no central corporation behind Linux to put everything together for us.
    Open source software programs are often developed independently from one another.
    I know I don''t want to sit at my computer gathering and installing every single
    program that will need on my computer. You probably don''t want to do that, either.
    Thus, we have the distribution, or distro. A Linux distribution includes the Linux
    kernel, the X Window System, an installer, and a collection of programs all put
    together for you on a neat little CD (or multiple CDs), to use as an operating
    system. There are more distributions than ... here''s where I get stuck trying
    to find the right cliché for the situation. There are more distributions than
    stars in the sky? Rats in the sewers? Lint in my dryer? More distributions than
    you can shake a monkey at? Anyway, there are lots of distributions. For-profit
    companies, such as Mandrake and Red Hat, make some distributions; others, such
    as Debian and Gentoo, are part of a community effort. Organizations and individuals
    create even more distributions. Each of the distros has its merits, its oddities,
    its champions, and its detractors.


    # X


    X is the name of the specification for windowing operations in Linux; it''s also
    called the X Window System. X is what runs your graphical user interface (GUI).
    X can run on many operating systems besides Linux. Many distributions have used
    the XFree86 program for years. Newer distributions are also starting to use a
    new offshoot of XFree86, X.org. Which version of X you have will usually not matter
    to you while performing everyday tasks. You will need to know only what version
    of X you are running if you run into an issue that requires you to start the X
    Window System from the command line or to edit your configuration file.


    # Desktop Environment


    The next important term is desktop environment. This is a place where we fork
    off from the structure you are used to in Windows or Mac OS. One of the cool things
    about Linux is that you always have choices. Your desktop environment is the GUI
    that you will be looking at. It''s all the eye candy. Unlike in other operating
    systems, you can choose the desktop environment in Linux. You can choose to have
    a simple or complex desktop environment. Whereas the two main environments, KDE
    and GNOME, will look familiar to you because they''re similar to what you are
    used to, many other desktop environments will give you a more innovative experience.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Window Manager


    The window manager is just what it says it is: It controls those windows that
    programs pop up in. I don''t need to tell you this. You''re smart. You can guess
    and figure out this stuff. The reason you even need to know this term is that
    you also can choose which window manager to use in Linux. Until you are ready
    to experiment more, it''s best to stick with the window manager that came with
    your desktop environment.


    # Widget Set


    The widget set is the set of check boxes, buttons, scrollbars, menus, and other
    things that make up the controls of any window that you are in. Let me give you
    the strict, technical definition: It''s the stuff you can click on to make things
    do stuff. Again, you have a choice of which widget set to use. You can change
    from the default that comes with your desktop environment, or you can play around
    with other themes. Now you know a new term, and now you''re smarter. We all feel
    better about that.


    # Spoofkata


    Okay, I made up spoofkata, but I can define my made-up word. You might be a messy
    person or a neat person. The messy people have a layer of random junk, food, spilled
    beverages, sticky notes, or papers on their desks. That''s spoofkata. You might
    have trouble finding your mouse on your desk some days. You might have to cut
    through the sticky notes on the edges of your monitor like you are chopping out
    a trail in the Amazon jungle, and I don''t mean the online Amazon. I usually have
    only a medium level of spoofkata, consisting of an empty glass and lots of burned
    CDs. When using Linux, please sweep the spoofkata aside, for optimum results.


    # Programs


    You know what programs are. Hey, I put the term in the cool little diagram that
    I wanted to make, so it deserved to get a heading all its own.


    # You


    This is a carbon-based life form with opposable thumbs (though I suppose that''s
    not required), at least a modicum of logical reasoning ability to figure out problems
    that come up, and a damned fine judge of buying books. You bought this, so you
    must be smart.'
