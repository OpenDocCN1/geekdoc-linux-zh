  md: '![](img/f2b5f4073f00f9ec5546d9acb9cc6448_96_0.png)


    # System Tools and Utilities


    > “A genius is the man in whom you are least likely to find the power of attending
    to anything insipid or distasteful in itself. He breaks his engagements, leaves
    his letters unanswered, neglects his family duties incorrigibly, because he is
    powerless to turn his attention down and back from those more interesting trains
    of imagery with which his genius constantly occupies his mind.”

    > —William James


    Everyone’s mother has a favorite anecdote. You know, it’s the story that gets
    told to all the people you ever bring home right after she drags out the “adorable”
    pictures of you as a toddler taking a bath. My mother’s favorite story is one
    that she thinks demonstrates the personality differences between my sister and
    me. It goes something like this.


    It was Saturday, chore day. The cartoons had been watched already. Breakfast was
    over. Now the children must work. We had assigned chores that we did each week.
    Every Saturday, right before the chores were supposed to begin, both my sister
    and I tried to go out and play. I’m not sure why we had the delusional thought
    that we could get out of those chores, but who can find logic in children? We
    were stopped at the door and reminded that we had chores to do. We were handed
    buckets and cleaning supplies and sent to our respective assigned rooms.


    77'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'Now here''s where my mother''s anecdotal Rorschach test comes in. My sister
    would be sent to do her chores and go into a big hissy fit. She would stomp, complain,
    argue, and generally make a lot of noise. Then she would go and dutifully get
    her chores done, still complaining throughout. When she was done, she got to go
    out and play. What did I do? I didn''t have a tantrum. I didn''t complain. I was
    the perfect angel who was clearly unhappy with the required tasks, but who amiably
    went to get her work done.


    Then I escaped out the back door.


    Whoosh! I left bucket, mop, and dirt in their place and ran out to play. I got
    in trouble for it later, but hadn''t seem to matter to me when the lure of Saturday
    fun was beckoning. As a result, I think I spent most of that summer between third
    and fourth grade grounded, riding my bike around in little circles in the driveway.


    I would love to now tell you that I have learned from the silly mistakes of my
    childhood. I would also love to tell you that I have the powers of Wonder Woman
    without the requirement of wearing a metal bikini. Alas, neither statement is
    true. I don''t run out the back door anymore when I have to do something I don''t
    like, but I do put it off and try to avoid it.


    System tools and utilities are my distasteful computer task. They are like eating
    my vegetables and cleaning my room. They are my Linux root canal. The fun stuff
    is in the programs and themes and skins and preferences. So, now that my Linux
    Rorschach test has determined that I am a Type C computer user, one who would
    rather do the fun stuff, let the root canal begin. Maybe we will be able to find
    some fun in here.


    # What Are System Tools and Utilities?


    "System tools and utilities" is a very technical term, encompassing grand concepts
    in technological leapa and bounds and thoughts and ... wait ... I can''t lie to
    you anymore. We''ve known each other too long now. I made it up. "System tools
    and utilities" is a collective term to talk about the tasks that you have to do
    to maintain your computer, troubleshoot problems, and generally know what is going
    on in the operating system. We need a name for all of these tools and programs
    that describes them. What were my other choices? "Stuff"? "Things"? With that
    decided, let''s talk about system tools and utilities.


    Both Mandrake and Fedora have gone to great lengths to make these potentially
    difficult tasks as easy as possible for us. Most desktop users will not have to
    mess with many of the utilities that we are going to talk about.'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'Sometimes, though, you have to do some mundane computer task, such as changing
    your password, adding new hardware, or changing on obscure setting. You might
    not have to do certain things with your car, such as change a tire, very often,
    but it''s nice to know how, right?


    # Fedora''s System Tools and System Settings


    Fedora isn''t into creating control centers or central locations too much. Some
    people consider this practice to be a distraction from Fedora''s usability, while
    others think of the practice as a complement to their intelligence. In the case
    of system tools and settings for Fedora, the place to look is in the main menu.
    Utilities are split between the System Settings and System Tools menus in the
    main menu, with a few things that you might consider to be utilities spilling
    over into the Preferences menu.


    # System Settings Menu


    This menu contains lots of options that pertain to the user''s experience in Fedora
    and GNOME. Unlike the Preferences menu, though, these options affect all users,
    not just you. You will need your root password to use most of these tools.


    # Server Settings


    Services is the only option in this submenu. If you install more software later,
    you might see other entries here. You can start, stop, and restart services from
    the Service Configuration dialog box. A service is a background program that runs
    in your OS. Checking the box for a service causes that service to start when your
    computer starts. Try not to turn any services off or on unless you know exactly
    what they do.


    # Add/Remove Applications


    If you choose to customize which programs you added during installation, you might
    recognize this tool (it''s the same interface). The name of this tool is a little
    disingenuous because the Add/Remove Applications tool only adds or removes applications
    that are included on your install disks. This can be quick and handy for some
    programs, but there are better ways to update your system; we''ll talk about those
    later.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Authentication


    Choosing this option brings up the Authentication Configuration dialog box. This
    is another tool that most users will not have to mess with. If you know a lot
    about security and want to tweak the settings, go for it. Succinct descriptions
    are provided for each authentication type. If you want to learn more about authentication,
    read a little in here and also read up on the subject online.


    # Date & Time


    <sarcasm>Hmm, now what in the world could this be for?

    </sarcasm> This is the same dialog box you get by right-clicking the clock on
    your panel and choosing Adjust Date & Time. You can also choose to sync your clock
    to a network and choose the time zone.


    # Display Settings


    The three tabs in the Display Settings dialog box are Settings, Hardware, and
    Dual Head. On the first tab, you can adjust your screen resolution and color depth
    (see Figure 3.1). On the Hardware tab, you can change your choice of monitor and
    video card. The Dual Head tab is full of options for setting up dual monitors
    for one computer. I know, I wanted that tab to be full of options for becoming
    a dual-headed monster, too, but we have been denied our wish.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_99_0.png)'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# Keyboard


    This option is for setting the language of your keyboard.


    # Language


    Here you can set the default language for your system. If you are missing a language
    that you would like to have available, you can grab your install CDs and add it
    from the many languages available.


    # Login Screen


    We were here in the last chapter, remember? Ah, the memories. Anyway, this is
    the dialog box where you can change the settings for the GDM login manager program.


    # Network


    The settings in the Network Configuration dialog box are for changing the settings
    on your network card and your computer’s network identification information. Descriptions
    are at the top of each tab.


    # Printing


    You can add and edit printers with the Printer Configuration Tool. We talk more
    about printing in a bit.


    # Red Hat Network Configuration


    If you choose to use the Red Hat Network for your updates, this dialog box sets
    the addresses used, lets you adjust settings for controlling package management,
    and choose exceptions.


    # Root Password


    Change the root user’s password from here.


    # Security Level


    This dialog box is for setting your firewall options. If you enable the firewall,
    you can check boxes for which services and devices are allowed. Using the firewall
    is an excellent idea for broadband connection users at home.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# ## Sound Card Detection


    The only thing you can really do here is listen to that “if Zmdir played the guitar”
    sound and then answer Yes or No for whether you heard it. I suppose it’s a good
    tool to make sure your sound card is working, but I can think of more fun ways.


    # ## Users and Groups


    Add and edit users and groups with this tool. You can create groups to use for
    setting permissions for more than one user at a time or create a class of users.


    # ## System Tools Menu


    Many of the entries in the System Tools menu deal with the hardware in your system.
    Other options are for some of the same things as the System Settings menu. Most
    of these tools are new, graphical ways to perform actions that previously could
    be done only on the command line. A majority of these tools require your root
    password.


    # ## More System Tools


    Poof! It’s empty? Well, if you haven’t installed KDE along with GNOME, then, yeah,
    this submenu is an empty placeholder for most default Fedora users. If you have
    installed KDE, two of the KDE disk utilities are listed here.


    # ## Archive Manager


    This option opens the File Roller program. File Roller is the same program that
    pops up when you double-click an archive (.zip, .tar, .gz, and so on) in the Nautilus
    file manager. It is a manager program for creating and extracting compressed files.


    # ## Configuration Editor


    This is the behemoth of controversy for many Linux GNOME geeks. The GNOME Configuration
    Editor (GConf, shown in Figure 3.2) is a GUI front end to editing a database of
    application preferences. People who hate it usually say that it is too analogous
    to the Windows Registry. People who like GConf enjoy the convenience of having
    all those settings in one place. People who are me think that you should not even
    touch any settings in this program unless you know what you’re doing and are confident
    in any changes you might make in there. However, poking around and taking a look
    is always encouraged.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '![](img/f2b5f4073f00f9ec5546d9acb9cc6448_102_0.png)


    **Figure 3.2**

    The loved and hated GNOME Configuration Editor.


    # Disk Management


    With this tool, you can mount and unmount file systems on your computer, such
    as disk partitions and removable media such as CDs and floppy disks. You can also
    manage disks by right-clicking your desktop and choosing Disks from the pop-up
    menu.


    # Floppy Formatter


    I know, who uses floppies anymore? Talking about floppies is like hearing your
    uncle talk about those great eight-track tapes he used to have of the Doobie Brothers.
    If you still have floppies, well, here’s a tool to format them for you. The interface
    is very easy to use and gives you options for density and file system type so
    you can format floppies for use in other OSs.


    # Hardware Browser


    Take a look at what hardware is installed on your system in this tool. This isn’t
    the place to make changes to anything, but the Hardware Browser is the place to
    come when you need to know the brand or model of a device and don’t want to open
    the computer to find out.


    # Internet Configuration Wizard


    This wizard is magical. The Internet Configuration Wizard isn’t magical, but how
    can you expect me to resist saying that when they keep calling these things “wizards”?
    I’m a genius, but I’m only human. Here is where you can set up your Internet connection,
    whether it is a dial-up, broadband, wireless, or other connection.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# **A Lesson to Learn**


    Seemingly illogical problems always crop up when using computers. There is a lesson
    to learn if you want to keep your sanity. Got a problem? Go around it. When you
    start to have a problem on a computer, you are tempted to find the exact problem
    and why you are having that problem. Something inside you tells you to fight it
    out. Fighting the problem takes a long time and can breed frustration. Often with
    computers, the best course of action is to find an alternative way to do what
    you are trying to do. Go around the problem. Then, if you feel the need, you can
    try to find out the cause and slay the issue later, when you are not in the midst
    of frustration.


    # **Kickstart**


    This tool writes a Kickstart file. A Kickstart file is a long, complex text file
    used to save installation settings for performing multiple Fedora installs automatically.
    Most desktop users will not need this.


    # **Network Device Control**


    The Network Device Control module is a tool for monitoring, activating, and deactivating
    hardware such as network cards and modems. You can also access the configuration
    of listed devices.


    # **Print Manager**


    After you add a printer, you might want to see what it''s doing; you have the
    Print Manager to look at documents and status of the printer queue.


    # **Printing Notification Icon**


    This puts an icon in your system tray that you can click when you are printing
    to check the status of the print job.


    # **Red Hat Network**


    This brings up the dialog box for the Red Hat Network. This tool checks which
    system packages are available for update. You can use the Red Hat Network to keep
    your system up-to-date.


    # **Red Hat Network Alert Icon**


    If you haven''t gotten rid of it yet, you probably have a round icon in your system
    tray for the Red Hat Network. This menu option puts the icon back if you remove
    it.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# System Logs


    Log files are lists of events and warnings. This is a tool to view the log files
    for your system without having to use the terminal. Logs can be helpful for troubleshooting
    problems but don’t make for very interesting reading.


    # System Monitor


    You can view the current memory usage, processor usage, and running processes
    in the System Monitor. Some people like to incessantly stay abreast of their computer’s
    performance and keep this open all the time.


    # Terminal


    It’s the terminal. It’s your access to the command line. It’s your friend. Don’t
    be afraid of it. Open it. Like it. We have more brainwashing later to make you
    like the terminal.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_104_0.png)


    # TOOL KIT 3.3:


    # How to Do "Important" Stuff in Fedora


    Now that you know what all those cryptic entries in the System menus are for,
    let’s get down to the nitty gritty. When you have something boring to do that
    can be called maintenance or a utility, you usually don’t feel like wasting time
    figuring out how to get it done. Here are a few common utility tasks you might
    need to know how to do.


    +   - Change Your Password

    +     Main menu > Preferences > Password

    +   - Change the Root Password

    +     Main menu > System Settings > Root Password

    +   - Manage Users and Groups

    +     Main menu > System Settings > Users and Groups

    +   - Change the Date and Time

    +     Main menu > System Settings > Date & Time

    +   - Mount Disk Partitions and File Systems

    +     Main menu > System Tools > Disk Management

    +   - Start or Stop a Service

    +     Main menu > System Settings > Server Settings > Services

    +   - Read the Logs

    +     Main menu > System Tools > System Logs


    BIG BROTHER CAN BE PRETTIER

    If you keep the System Monitor open often to spy on your computer’s performance,
    you can spy in more style than with the GNOME tool. A program called GKreliim
    (http://www.gkreliim.net/) is


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_104_1.png)


    # UNDER THE HOOD'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# Mandrakelinux Control Center


    Trying to say whether the menu arrangement of Fedora''s system utilities or the
    control center cluttering of Mandrake''s is better just comes down to small details
    and opinions. Both give you convenient access to system settings and tools. The
    Mandrakelinux Control Center might be a bit more convenient for some people because
    everything is in one place for you. It does, however, take a few extra clicks
    to get to the tools.


    When you open the Control Center, you are attacked by giant icons. Maybe they
    don''t attack you, but they are pretty big. The Control Center is arranged into
    categories with modules that could be called either settings or tools all mixed
    into their respective categories. Not only are the categories smartly named and
    arranged, but most modules give you a quick introductory description when you
    open them. All that attention to information and usability makes dealing with
    mundane system tasks in Mandrake quite easy.


    Open the Mandrakelinux Control Center by going to main menu > System > Configuration
    > Configure Your Computer (see Figure 3.3). You will need your root password.
    Let''s go over what cereal box toy surprises lie underneath each of those giant
    icons.


    Figure 3.3

    The Mandrakelinux Control Center.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_105_0.png)


    the Linux geek''s Swiss army knife, with system monitors, mail notification, and
    more. You can even choose skins for the program to make it pretty.'
  merge: -1
  img_proc: true
- pgno: 106
  md: "# Boot\n\nAll the modules in the Boot category pertain to what happens when\
    \ you turn on and log into your computer. The Autologin module asks whether you\
    \ want Mandrake to skip the login manager and start your desktop for you. Autologin\
    \ is okay if you don't have others around your computer who shouldn't be messing\
    \ with your programs and data. The Boot Loader module opens settings for the boot\
    \ loader program, usually LILO or Grub. Unless you need to change options because\
    \ you are dual-booting, you can probably leave these settings alone. Boot Theme\
    \ lets you add a theme to the boot screen.\n\n# Hardware\n\nYep, this is where\
    \ you can set up all the hardware connected to your computer, or at least most\
    \ of it. The Hardware module is a browser to get information about the various\
    \ cards, input devices, ports, and doodads in your system. As you click each device\
    \ in the list, configuration modules or tools show whether they are available.\
    \ Other modules in the Hardware category include settings for Monitor, Screen\
    \ Resolution, Keyboard, Mouse, TV Card, and Scanners, which are all easy to understand.\
    \ The Graphical Server module gives you display settings for the X server, such\
    \ as monitor and graphic card. The Printers module lets you add printers. We go\
    \ over printing in more detail later.\n\n> Mounting Files, Not Horses\n> \n> Mounting\
    \ and unmounting file systems can be a strange concept for many new Linux users.\
    \ Let's compare file systems to books. You might have a book sitting by you. You\
    \ might even be touching that book, but you can't read it until you open it. To\
    \ read and write to a file system, Linux needs to open it first, which is expressed\
    \ in the kooky language of commands as mounting a file system. Other operating\
    \ systems mount and unmount file systems as well, but they hide it. No hiding\
    \ in Linux, no secrets. Linux will let you see the inner workings of the OS. Many\
    \ utilities are in your distro and desktop environment that mount file systems\
    \ automatically for you, but there's no harm in learning about what is going on\
    \ under the hood.\n\n# Mount Points\n\nMost users will not need to change the\
    \ options in these modules. The Partition module brings up the same partition\
    \ tool that you used during install. You can change the partition table for your\
    \ computer, but it's not a good idea. If you really messed up on the partitions,\
    \ you might want to just reinstall to have a clean start. You can change the options\
    \ for each type of removable media (such as CDs and floppies). NFS and Samba mount\
    \ points are shares on your local network, including Mac and Windows shares, that\
    \ use the same protocol."
  merge: -1
  img_proc: true
- pgno: 107
  md: 'Samba is the most common of the two protocols. WebDAV Mount Points gives you
    options for connecting to a remote Web server. Local Disk Sharing is where you
    can set up directories on your computer to share with others on your local area
    network.


    # Network & Internet


    This module gives you options for managing various types of connections. In addition,
    you can share your Internet connection with other computers on your network and
    edit proxy settings. You will use some of these modules in a bit to set up an
    Internet connection.


    # Security


    The three modules in this category make the paranoid among us smile. Level and
    Checks gives you detailed settings for the security on your computer. If you''re
    not familiar with the advanced options, read the descriptions of the Security
    Level choices to pick one. In Permissions, you can set the file permissions and
    owners for different directories. The Firewall module edits options for your Internet
    firewall.


    # System


    Options are here for many of the more frequent tasks you might have to do. Menus
    enables you to edit the main menu. The Display Manager is actually for choosing
    the login manager. In Services, you can set which background processes run on
    boot and start or stop each service. Fonts is for installing new fonts and seeing
    what you have. The Date & Time module adjusts the date, time, and time zone. You
    can also choose to sync to a network time server. Logs is the place to read the
    system logs for your computer (lists of events and errors that are confusing to
    read but can help in troubleshooting). Console brings up a root terminal to use.
    The Users and Groups module (see Figure 3.4) shows options for adding, editing,
    and deleting users and groups. In the Backups module, you see choices to set up
    regular backups of your data.


    # Software Management


    These modules provide a convenient way to add, remove, and browse the packages
    on your system. You need your install disks for the Install module. The Updates
    module opens the Mandrake Update tool that you will use later.'
  merge: -1
  img_proc: true
