    # FRIDGE


    # Why Are We Banning Books?


    I was so angry when I read a blog article recently that I could have choked a
    Barbie. The American Library Association came out with the list of most banned
    books in school and public libraries last year. I don’t get it. Some of the books
    on the list are so harmless and also so good. What’s wrong with The Color Purple?
    Maya Angelou? Where’s Waldo? And Judy Blume is all over that thing. These must
    be the same people who burn books.


    Even if someone disagrees with some parts of these books or thinks they are not
    appropriate for children, these books shouldn’t be banned. Just separate them
    out. Just pay attention to what your children read and do. I would even argue
    that some of those books with disturbing parts are things that children should
    read and discuss with adults instead of being kept kids in a perceived bubble
    of innocence. To Kill a Mockingbird is on there. Why not discuss the issues in
