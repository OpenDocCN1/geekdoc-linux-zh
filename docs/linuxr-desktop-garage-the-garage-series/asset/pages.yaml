- pgno: 240
  md: '# Sneaky Guessing


    Linux lets you be sneaky. If you don''t find your exact camera listed, try choosing
    one that is close to your model. Lots of times, a similar camera model will work.
    You can also search online to see what has worked for others.


    Other programs that are available for managing your photos and creating albums
    have their uses, but gtkam is the best solution if you just want to quickly grab
    images off a camera, without any extras to get in the way of your main task.


    # Use Gtkam to Import Photos from a Digital Camera


    I embarked on an around-the-world epic journey to get pictures of exotic locations
    for Michangelos vacation photos. Okay, actually I just took some pictures of places
    I could easily get to. I have an Olympus D395 that uses a USB connection. Getting
    the images off the camera with gtkam is easy.


    +   1. Connect your camera to your computer, and turn it on. Some cameras require
    you to select a different camera mode to communicate with the computer. Consult
    your camera''s manual to be sure.

    +   2. Open gtkam.

    +   3. First, set up gtkam to use your type of camera. Go to the menu and select
    Camera > Add Camera. You will see a settings window where you can select the type
    of camera you have connected. You can also give gtkam a shot at automatically
    detecting your type of camera with the Detect button. When you have the right
    camera, click Apply and OK.

    +   4. You should see an icon for your camera in the left column of gtkam. Click
    the plus sign(s) for the sections of your camera to expand the tree. Highlight
    any entry to see the images previewed in the right-side preview pane of gtkam.

    +   5. Select the images that you want to save, or go to the menu and choose Select
    > Select All to choose all the images in that section. Then use File > Save As
    or the Save button on the toolbar to save those images to your hard drive.

    +   6. If you want to clear your camera''s memory using gtkam, the process is
    almost the same as saving. Select the images to be deleted and use the Delete
    button or File > Delete from the menu.


    # Kongquerer


    Yep, I''m talking about the file manager, Kongquerer. Talking about a Conquistador
    who could grab your photos off your digital camera would be


    Linux users who own the same camera and who might have already tried alternative
    ways to mount the camera''s memory.'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'fun. I can see him in his metal helmet fighting to import images from even
    the most resistant digital camera. Also, this is just Konqueror, your handy KDE
    file manager. We have already seen that the file managers in Linux, both Konqueror
    and Nautilus, endeavor to be your central point for a lot of program functions,
    from simply managing files to acting as a Web browser. Add one more function to
    Konqueror’s list, gPhoto2 front end.


    To get images off your digital camera using Konqueror, the steps are few and easy.
    Connect your camera and turn it on. Linux detects most digital cameras, especially
    most USB cameras, right away. Open Konqueror. You can probably just type "camera:/"
    into the address bar. There should be a folder for your camera. In that folder
    will be either more directories or the image files on your camera, depending on
    how your camera stores images (see Figure 9.3). You can then copy images from
    the camera to a directory on your hard drive in the same way that you would normally
    copy files in Konqueror.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_241_0.png)


    Nautilus can also view a digital camera’s memory if it is mounted as a removable
    media item, but gKam is way easier for GNOME users than Nautilus for this purpose.


    **MANDRAKE WINS**

    Users of Mandrake have got it very easy when it comes to digital cameras. Just
    plug in your camera, and Mandrake pops an icon'
