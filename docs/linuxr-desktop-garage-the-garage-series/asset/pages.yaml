    +   6. A “Congratulations!” screen appears. Click Finish; your friend should be
    listed in your Contacts list. Double-click the contact to talk to him or her.


    # ## Keeping Up with the Joneses


    If you find yourself unable to log in to your Yahoo! Messenger account from Gaim
    or Kopete, check the latest release news for each program. Yahoo! often changes
    its IM protocol, usually (they say) for technical reasons. IM clients such as
    Gaim and Kopete are outsiders, so they have to change to keep up with Yahoo!’s
    changes. There have also been issues with AOL and MSN making changes. Even if
    you are using Kopete, you can usually get the latest news on what is happening
    with a protocol change on Gaim’s SourceForge forums at https://sourceforge.net/forum/?group_id=235.'
