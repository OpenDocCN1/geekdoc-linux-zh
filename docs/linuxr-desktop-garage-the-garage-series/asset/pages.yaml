  md: '# The Inbox


    Information about using the Inbox and all the e-mail options in Evolution is in
    Topic 6. For now, all you need to know is that you can view your Inbox by clicking
    the button on the shortcut bar.


    # The Calendar


    The calendar functions in Evolution were one of the major parts of the program
    to be modeled after Microsoft Outlook. If you have used Outlook, you will find
    a lot of familiar territory. Even if you have never used a calendar program on
    a computer, you will find Evolution''s Calendar component a pretty comfy place
    to park your appointments.


    With Evolution''s Calendar (see Figure 7.2), you can create and edit appointments;
    view your schedule by day, week, or month; and set alarms. The appointment options
    are quite flexible, with many choices and fields to add detailed information.
    You can choose to create a simple appointment with just a date, time, and title,
    or you can enter in information down to the last detail. With the Connector feature,
    you can also share calendars and appointments with others on an Exchange network.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_198_0.png)


    # Figure 7.2


    *Evolution''s Calendar component.*


