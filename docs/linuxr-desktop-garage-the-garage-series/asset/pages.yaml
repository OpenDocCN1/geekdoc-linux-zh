- pgno: 276
  md: '| Program | Usability | Interface | Comments |

    |---|---|---|---|

    | Gaim<br>(continued) | Great | Good | The Gaim developers have regular releases
    and are among the most responsive when it comes to fixing reported bugs. Having
    a parallel Windows version means that you can keep the same program and interface
    even if you have to use Windows for some reason. Also, the program is self-contained
    and can run equally well in KDE and GNOME |

    | Kopete | Good | Great | Kopete started off slow but has caught up to Gaim in
    most respects, while adding a few twists of its own. If you are a regular user
    of the KDE desktop, the integrated features Kopete uses with KAddressBook, the
    system tray, and KNotify will be great |

    | Yahoo! Messenger | Good | Fair/poor | You won’t ever have to worry about not
    being able to connect to Yahoo’s changing protocols when you are using their client,
    but you won’t have as many features, either. It’s admirable that Yahoo! has cared
    enough to make a Linux version of their IM program, but it would be nice if they
    kept it up-to-date. Not only does the interface look old compared to other Linux
    programs, but it doesn’t even keep up with the features that Yahoo’s client for
    Windows has. This one is good to keep on hand as a backup. |


    continues'
