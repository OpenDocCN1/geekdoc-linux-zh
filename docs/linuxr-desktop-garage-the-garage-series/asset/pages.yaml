- pgno: 236
  md: '![](img/f2b5f4073f00f9ec5546d9acb9cc6448_236_0.png)


    # Photos and Graphics


    Michelangelo Buonarrotti--now there was a genius*. Genius is often an unhappy
    thing to be. Most creative geniuses throughout history have led unhappy lives.
    Many of history''s geniuses inflicted unhappiness upon those around them with
    manic behavior. Hemingway drank. Van Gogh fought with his roommate, Gauguin. Kerouac
    was the family moocher. I read about these geniuses and sort of wish I could help
    one of them out, add a little happiness to their lives. We have a Make a Wish
    Foundation for terminally ill kids, so why not have a Make a Tortured Genius Happy
    Foundation?


    Michelangelo is a perfect candidate to be helped by the Foundation. As far as
    we know, he wasn''t drunk and brooding like so many artists you read about. Not
    much known is about his personal life. One thing is apparent, though: The dude
    never got a vacation. He was always getting cooped up in a chapel or a tomb. Pope
    Julius II wouldn''t leave him alone.


    > *"Michelangelo, paint me a ceiling in the Sistine Chapel."*


    > *"Michelangelo, sculpt me statuary for my tomb."*


    > *"Michelangelo, paint that back wall of the chapel. It''s too plain."*


    > *"Guards, bring back Michelangelo. He ran away again."*


    Was he the pope or his stepmother?'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'Pope Julius II didn''t let poor Mike go anywhere. Sure, he got out to the stone
    quarry once in a while to pick out a block, but that wasn''t even outside the
    Florence metropolitan area. He never seemed to get a vacation, a chance to travel.


    Today we are at an advantage. It is easy to travel. Even if you don''t go anywhere,
    you can learn about the world in books, in movies, in pictures, and through the
    Internet. We have so much that it makes me feel bad for Michelangelo, the poor,
    dead genius. I mean, look at this picture of him from Raphael''s School of Athens
    fresco (see Figure 9.1). He does not look happy.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_237_0.png)


    Luckily, I am a genius, too, so I can help him. Michelangelo is dead. Being dead
    doesn''t provide much opportunity for travel. I will give him a virtual vac- ation.
    I will make a photo album of Michelangelo''s missing virtual vacation for him
    to bore his dead friends with.


    # Digital Cameras


    Just as you experience with any peripheral hardware you hook up to your com- puter,
    your digital camera might work beautifully as soon as you plug it in, or you might
    end up wanting to toss it out a window. Most popular cameras com- ing out now
    connect via a USB port, for which there is great support in Linux.'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'Some cameras are now using Firewire, for which there is also support, but they
    can sometimes be more complex to work with. Consult an online hardware guide such
    as the one at http://www.faqx.docs/Linux-HOWTO/USB-DigitalCamera-HOWTO.html. Read
    up on your particular camera by searching for it online. Most problems with peripheral
    hardware in Linux can be traced to hooking up hardware that has no Linux support.


    When you have your camera connected and ready to go, you will need to get those
    pictures off the camera. In Windows, most people use the proprietary software
    that came with their camera. That software isn''t going to work in Linux. There
    might be a wise digital camera maker in the future that gives us Linux software
    with a digital camera, but right now camera makers write software for Windows
    and Mac. With easily attainable programs available in Linux to use with most any
    digital camera you own, you won''t need the software that came with your camera.
    The freedom to not have to use special software or worry about losing the disk
    that came with your camera is nice. There are many good applications in Linux
    for snagging the pictures off your digital camera, and most of those use a program
    called gPhoto2.


    # ## gPhoto2


    gPhoto2 is the engine that most other programs use behind the scenes to work with
    digital cameras. The program is installed by default in both Fedora and Mandrake.
    One of the best features of gPhoto2 is its scalable support. The program supports
    more than 400 cameras. You can look at the list of cameras by opening the program
    gKam or any other front end to gPhoto2 that you are using. Check the listing of
    supported cameras on the gPhoto2 Web site at http://www.gphoto.org/proj/libgphoto2/support.php.
    The odds are good that your camera is in the list. Cameras that are not listed
    currently don''t have the demand from users, so no one wrote a driver for them.
    Sometimes a camera is not supported because it is too old or because it is so
    new that no one has gotten around to adding it. I learned the hard way with an
    old Kodak that if your funky old camera isn''t supported, it probably won''t be.
    If you have a brand new camera that is not in the list, keep checking the gPhoto2
    Web site and updating the program to its newest version because it is likely that
    your camera will eventually get on the list.






    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_238_0.png)'
  merge: -1
  img_proc: true
- pgno: 239
  md: "# ## Getting Pictures from Your Camera\n\n# ## gKam\n\n**Program Info**\n|\
