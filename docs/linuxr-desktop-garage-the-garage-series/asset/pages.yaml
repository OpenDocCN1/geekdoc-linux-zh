  md: 'forget a command from time to time. A group of developers is working on a PPC
    (the type of processor in Apple computers) version of Fedora that will run on
    Macs.

    Cons: Many disliked Red Hat''s transition to Fedora and still hold a grudge. There
    are also rumors that Red Hat is controlling much of Fedora''s development, without
    allowance for the community input the company had promised. Mandrake makes some
    tasks automatic that Fedora users will need to do manually.

    Availability: Fedora hosts ISO images for download from mirrors. Red Hat''s Enterprise
    version, with support included, can be purchased from Red Hat.

    Cost: Download is free. Red Hat has many pricing tiers.


    # Gentoo


    This is one of the newer choices among the most popular Linux distributions. Gentoo
    will run on PCs or Macs. Gentoo is so flexible because it is not package based;
    most of the programs must be compiled on your machine. The distribution is another
    social distri-  bution run by its community of users.

    Install: Got some free time? Then Gentoo is for you. The install is text based
    and could arguably be most appropriate for advanced users. The installation process
    takes a very long time because Gentoo compiles programs upon install. There are
    three install options, each needing a LiveCD from Gentoo, that span from very
    customizable to just the base system.

    Pros: Gentoo''s Portage software-distribution system can be great for users who
    want the latest versions of things such as desktop environments that are more
    difficult to update on your own. Gentoo runs efficiently because it is customized
    for your system.

    Cons: Did I mention time? Let me say it again: time. It''s not just necessary
    on the install, either; system updates take time and are best done overnight.
    Even the geekiest friends I know running Gentoo talk about switching to something
    that they don''t have to wait for. You also need to know your commands because
    there are not a lot of GUI tools.

    Availability: Download one of three LiveCD versions.

    Cost: Free.


    # Linspire


    Linspire used to be called Lindows until Microsoft sued them over the name. Linspire
    might be the best distro available for working right out of the box. Multimedia
    plug-ins and emulation software are preinstalled.

    Install: Buy Linspire on one of those preinstalled PCs, and there''s nothing to
    worry about. If you buy the distro separately, the install goes smoothly and could
    be com-  pleted by a new user without much assistance.

    Pros: Linspire is a commercial distribution, and, just like other commercial OS,
    is a nicely put-together system. Many tools and menus look like the Windows equivalents.
    CrossOver Office, a popular program for running Windows software, comes with Linspire.
    It''s a distro fit to put my mother on with minimal worry-  you''d have to meet
    my mother.'
  merge: -1
