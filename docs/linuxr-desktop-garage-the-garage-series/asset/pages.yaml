    # **TOOL KIT 9.2:** Create a Multilayer Image with the GIMP


    Let''s make the first picture for Michelangelo''s virtual vacation photo album,
    a picture of Michelangelo and his Capuchin monkey, Don, at Mount Rushmore. We
    will need three photos to composite together: Michelangelo, Don, and the background
    scene. You can download example images to work with at the URL in Step 2. You
    can also choose to composite other pictures on your own. Either way, you will
    learn some important GIMP functions. Come on, it''ll be fun, like crafts time
    in school.


    +   1. Open the GIMP.

    +   2. With the three files you have chosen to composite. If you''re following
    along with the bouncing ball at home, download these three images:

    +      http://www.snerf.com/linuxdesktopgprage/examples/michelangelo.xcf

    +      http://www.snerf.com/linuxdesktopgprage/examples/don.xcf

    +      http://www.snerf.com/linuxdesktopgprage/examples/mountrushmore.jpg

    +   3. Open your background image, mountrushmore.jpg. Save it as a new image by
    going to File > Save As. Let''s save it as vacationphoto001.xcf.

    +   4. Open the two insert images, michelangelo.xcf and don.xcf. These are .xcf
    files because I have already cut out Michelangelo and Don from their background
    images.

    +   5. Go to Michelangelo''s picture. Notice that there are two layers, Mike and
    Background. Mike is the layer with his image cut out, and Background is a layer
    of solid black. Highlight the Mike layer in the layers window. Now select that
    entire layer by going to Select > All or by clicking Ctrl+A.

    +   6. Copy that layer''s image to the Clipboard using Edit > Copy, or click Ctrl+C.

    +   7. Click the background image of Mount Rushmore. Paste the Michelangelo image
    into the background with Edit > Paste or Ctrl+V.

    +   8. Don''t click anything else yet. The pasted image is shown in the layers
    window as a temporary layer, or floating selection, called Pasted Layer (see Figure
    9.5). You can choose to have the pasted layer become part of the existing layer
    underneath or to have the pasted layer become its own layer. I want the image
    on its own layer. Click the New Layer button in the layers window. That makes
    Pasted Layer into a permanent layer.

    +   9. Rename the new layer by right-clicking that layer in the layers window
    and choosing Edit Layer Attributes. Name it Michelangelo.

    +   10. Now go get Don. This image has two layers as well, Don and Background.
    Repeat the steps used with Michelangelo''s picture: Select all of the Don layer
    and copy it. Make sure you have the Background layer of the composite picture
    selected before you paste in the new image. Paste it on to the background image,
    create a new layer for it, and then name the new layer Don. You can see all the
    layers in Figure 9.6.'
