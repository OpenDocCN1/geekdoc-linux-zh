    # What Is IRC?


    Everyone has heard of chat rooms. They have been around for a long time. Lots
    of people have never gone into one, though. There are different kinds of chat
    rooms on the Internet. You can go to the public chat rooms that run in your browser
    at sites such as Yahoo.com and chat with anonymous strangers. You can go to chat
    rooms at some of your favorite Web sites and talk to like-minded people. Those
    are tame. There is still a Wild West on the Internet for chat, and it is called
    IRC, short for Internet Relay Chat. This is one part of the Internet that no advertisers,
    sensors, or corporations have been able to get to. Getting onto an IRC server
    and then into a room, or channel, is easy in Linux.


    You need to learn a whole host of new commands when using IRC. A great Web site
    to start to learn more about IRC is http://www.irchelp.org. If you want to, you
    can just go in and chat, but you need a few commands for the fun stuff, such as
    emoting. You might not know what emoting is, in terms of chat. Let''s think of
    it this way, in terms of Shakespeare.


    # Sonnet 78 by William Shakespeare (in the Language of English)


    > So oft have I invoked thee for my Muse

    > And found such fair assistance in my verse

    > As every alien pen hath got my use

    > And under thee their poesy disperse.

    > Thine eyes that taught the dumb on high to sing

    > And heavy ignorance aloft to fly

    > Have added feathers to the learned''s wing

    > And given grace a double majesty.

    > Yet be most proud of that which I compile,

    > Whose influence is thine and born of thee;

    > In others'' works thou dost but mend the style,

    > And arts with thy sweet graces graced be;

    > But thou art all my art and dost advance

    > As high as learning my rude ignorance.'
