- pgno: 349
  md: 'log file

    List in a file that is a record of actions or errors that have occurred.


    login manager

    Program that handles user management and access to the Linux desktop environment.


    Mandrake cooker

    Mandrake''s online repository of packages that developers are experimenting with
    but that might not be stable.


    Master Boot Record

    Small program that loads when a computer boots and reads the disk''s partition
    table, deciding which partition to boot from.


    MMORPG

    (massive multiplayer online role-playing game) A type of video game played online
    in which you create a character that interacts with other characters that also
    represent real human players.


    mount

    To make a storage device readable by the operating system.


    MP3

    Type of audio compression format that is currently the most popular format for
    music.


    multimedia

    Collective term referring to text, audio, video, animation, or images on the computer.


    network proxy

    See proxy.


    NTFS

    (NT File System) A file system type originally developed for Windows NT but that
    is also used in Windows 2000 and Windows XP.


    object oriented

    A method of programming that use functions and data structures to create reusable
    objects.


    OGG

    Type of audio compression format that is often popular in Linux because the format
    is freely available.


    OS

    (operating system) The most important program on your computer that processes
    input and output, controls hardware, and tracks files.'
