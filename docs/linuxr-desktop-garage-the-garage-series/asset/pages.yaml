  md: 'In KDE, the method to change icons for desktop and panel items is almost the
    same as in GNOME. Right-click the item, choose Properties from the menu, and click
    the picture of the icon in the dialog box. The difference in KDE is that you have
    two categories to choose the new icon from, system icons and other icons. The
