- pgno: 92
  md: '# **More Terminal Help**


    The Linux command line comes with its own help manual for you—in fact, two or
    three of them. These aren’t the most user-friendly help files in the world, but
    they give you the information you need. You have the man command, the help switch,
    and the info command.


    ```

    ```

    man [command name]

    [command name] -help

    info [command name]

    ```

    ```


    Not all commands have a help display or an info file. More commands have man files
    than any of the other options available to you. The man files are all arranged
    similarly for each command, but they can be cryptic for new users. Read down the
    file, and you will see the proper use syntax for the command, a description, and
    then long sections about the various switches (additions to a command, usually
    one letter, preceded by a hyphen), and other references for the command.


    The layout of both Konsole and the GNOME Terminal is as basic as it can get. There
    is a menu bar, a toolbar that shows buttons or tabs, and the main terminal itself.
    You can open new terminals in tabs or in multiple windows. As a terminal command
    line newbie, start with one tab in one window, use some of the basic commands
    we have talked about, and don’t be afraid. While you are logged in using the terminal
    as your regular user, you cannot break anything that is all that important. To
    avoid making a mistake that you cannot undo, pay attention to each step you take.
    There’s always Topic 1, “What Are You Getting Into?” to go back to for a fresh
    install if you really mess up.


    # ### TOOL KIT, 2.3:


    # Write Dirty Linux Poetry in the Terminal


    Want proof that the command line is fun? Well, there are lots of Linux commands
    that, when strung together, make me feel like a dumb, giggly third grader who
    has just discovered the word fart. Let’s string together some commands and see
    if we can get in trouble.


    +   1.  Use these real, umm, suggestive Linux commands to start with:

    +   *   man

    +   *   finger

    +   *   mount

    +   *   sleep

    +   *   unzip

    +   *   touch

    +   *   strip

    +   *   grep

    +   *   more

    +   *   make'
  merge: -1
  img_proc: true
