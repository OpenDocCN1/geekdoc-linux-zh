- pgno: 278
  md: '![](img/f2b5f4073f00f9ec5546d9acb9cc6448_278_0.png)


    # Music and Movies


    Some people are truly busy people. Most of the rest of the busy people fall into
    two categories. There are the people who like to say they are busy because it
    makes them feel important. These busy people are the ones who often tell you how
    little sleep they get, how much driving around they have to do, how many projects
    they are going on. They boast so that you will then think that these busy people
    are special people who are so needed that they can''t even sit down for one minute.
    Then there are the busy people who say they are busy so that they can get out
    of doing what they are supposed to do. These busy people are the ones who don''t
    speak up until they are asked to do some unpleasant task or to attend an unwanted
    social function. Suddenly, they are so busy.


    “Honey, are you ready to help me clean the car?” my husband called out one afternoon.


    I looked around the room for some saving grace, some out. All I was doing was
    watching a movie on my computer and organizing my MP3 collection.


    “Susan?” he repeated.


    I needed an answer. “I''m sorry, I can''t. I''m really busy right now.” Guess
    which kind of busy person I am.


    “What are you doing?” he asked.'
  merge: -1
  img_proc: true
- pgno: 279
  md: '“I’m, I’m … .” What excuse could I turn my current activities into? “I’m doing
    research!”


    Yeah, that sounded busy.


    “I’m researching whether Elvis is still alive.” I smacked myself in the head.
    That ruined it. There went my good, busy excuse. As it checking to see if Elvis
    is still around is an important enough excuse to get out of doing anything.


    Still, it was an interesting question. I dragged my feet outside to go help clean
    the car, but I wondered about Elvis the whole time. There were so many strange
    facts to consider. There was the conflicting weight on the death certificate,
    the sightings, and the jumpsuits that were so sparkly and magical. Crackpots had
    been gathering evidence and conspiracy theories for years, but I could take a
    new path in researching Elvis’s current whereabouts. I could find him by playing
    his own music over and over. I could watch his movies for signs of his impending
    plot to tool the world.


    # ## Play Music


    Do you think Elvis is alive? I mean, there’s plenty of fake evidence to suggest
    that he is alive somewhere working as an elderly Elvis impersonator, or working
    in a gas station, or taking it easy in some rest home somewhere (see Figure 11.1).
    He is probably listening to music on a computer. If Elvis is alive, I know what
    I want to ask him. “Do you prefer OGGs or MP3s?”


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_279_0.png)'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'There are so many different ways to listen to music on your computer, in different
    file formats and with different programs. There are purchaced CDs, burned CDs
    of custom playlists, online music services, and portable music players. I could
    use the opinion of an expert such as Elvis. I am sure that he has become a digital
    music aficianado in his old age. If we can''t get Elvis''s opinion at the moment,
    how do you differentiate among all of those options? Linux can accomodate most
    sound and video file formats, and there are a number of good programs to play
    those formats. That is a lot to choose from. Before I break out the Elvis CDs,
    we need to learn more about music file types and players in Linux.


    # # File Type Fight


    MP3 is the most ubiquitous audio format, but there are many more. I''m not sure
    whether you are an audiophile, but many audiophiles argue quite a bit over the
    best quality level and format for digital music. I''m just a user with a pair
    of pretty good speakers on my computer. I liked OGG files because they sounded
    cool and were an open format; but in the end, I have stuck with MP3s simply because
    it is easier to port them between computers, between operating systems, and onto
    portable players. See Table 11.1 for a synopsis of the most common audio file
    formats.


    Table 11.1: Description of Common Digital Audio Formats


    | FILE TYPE | DESCRIPTION |

    | :--- | :--- |

    | A.AC | Mostly known as the file type used in Apple''s iTunes, but can be played
    by some Linux applications if they are unencrypted. This is a lossy compressed
    format with improved quality over MP3. A.AC files from iTunes can sometimes have
    the file extension MP4, and some are copy protected. |

    | CDA | (CD Audio) These are the files on purchaced audio CDs when they are copied
    to a computer. They are uncompressed and can be ripped to compressed file types
    for use in digital music players. |

    | FLAC | The abbreviation stands for Free Lossless Audio Codec. It is a high-quality
    public domain format used by a few online music services. |



    *continues*'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'Table 11.1: **Description of Common Digital Audio Formats (Continued)**


    | FILE TYPE | DESCRIPTION |

    | :-- | :-- |

    | MP3 | This is the most popular format for digital music, which can be played
    in most digital players and most portable players. MP3 is a lossy compressed format,
    meaning that quality can vary. There are a few different quality levels, or bit
    rates, MP3s can be saved at, including 128Kbps and 192Kbps. |

    | MPC | This is a newer format similar to MP3, but with higher quality when compressed.
    This format is not yet supported in most digital music programs or portable players.
    |

    | OGG | (OGG Vorbis) OGG is the geeks'' format for digital music. The format is
    public domain and considered by many to be higher in quality than MP3 files encoded
    at the same bit rate. OGGs are making headway in popularity and are supported
    by most Linux players and a few portable players. |

    | WAV | You know those annoying sound schemes in your operating system? Those
    would be WAV files. They have been around for a long time. The format is uncompressed,
    takes up a lot of disk space for larger files, and is the pit stop format between
    CDA and MP3 when ripping purchased audio CDs. |

    | WMA | (Windows Media Audio) Microsoft created this format for use in its Windows
    Media Player. Many online music services use the format because Microsoft has
    made it easy for those services to build in copy protection, also known as digital
    rights management (DRM). WMAs are considered higher-quality audio than MP3s. These
    files can be played on a couple Linux players but are mostly intended for Windows
    Media Player. |


    # Grip


    **Program Info**


    |  |  |

    | :-- | :-- |

    | **Fedora/GNOME menu** | Sound & Video > Grip |

    | **Terminal command** | grip |

    | **Program URL** | http://nostatic.org/grip |


    This is one of the most popular programs for ripping audio CDs to a digital format.
    Other applications are available for ripping, but Grip is the most developed and
    useful. Grip supports ripping audio CDs to MP3, OGG, WAV, and FLAC. It also has
    a full-featured CD player built into the program, looks up to an'
