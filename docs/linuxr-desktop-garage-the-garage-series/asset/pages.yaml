    Why bother to buy Linux in a box? You get handy manuals with colorful logose plastered
    all over them. Who wouldn’t want that? If you feel lost with this whole Linux
    thing or don’t consider yourself to be technically inclined, buying a packaged
    distribution that includes manuals might be helpful. The manuals explain very
    basic concepts, such as using menus and moving windows. They then move on to talk
    about how to perform certain tasks. You will inevitably need to go beyond the
    manual and its limitations, but that’s why you are reading this book. Another
    great reason to buy the boxed distribution is that you get to financially contribute
    to the software that you are using and to the companies that put everything together
