- pgno: 211
  md: '# Other KDE-PIM Modules


    # KAlarm


    The program is a simple alarm program with a list interface to save multiple alarms.
    You can have the program run in the background to have alarm mes-sages pop up
    after you have closed the main program window.


    # Kandy


    With this program, you can sync much of the data in KDE-PIM Suite programs with
    a cell phone. Check out the Kandy Handbook under the Help menu for more info and
    to see if your phone is supported. You really need to know what you’re doing to
    use this part of the PIM suite.


    # Karm


    This is a great little program for timing how long you are spending on certain
    tasks. If you work with billable hours, this is a simple way to track time spent
    on projects. If you spend all your time goofing around, wouldn’t you like to know
    how much time you have been spending on solitaire games?


    # KNotes


    Do you miss sticky notes? KNotes is a desktop sticky note program for jotting
    down notes and reminders. You can also e-mail your notes. KNotes uses KMail by
    default, but the command can be changed in the preferences.


    # KonsolleKalendar


    You can perform functions such as adding, deleting, and editing calendar events
    from the command line with this program. This is handy for performing calendar
    functions from within a script. All these functions can be useful if you need
    to access your computer remotely in a terminal.


    # Syncing with Your PDA


    Syncing a PDA in Linux can be very easy for some people. For others, working with
    their PDA in Linux is complex and induces fits of swearing. Where your experience
    lands depends a lot on hardware, both the type of PDA you own and the detection
    when you plug your PDA into your computer. Many of the utilities in Linux for
    PDAs are easiest to use with Palm devices, the Handspring Visor, and other PalmOS-based
    PDAs. You can search various forums online to'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'look for others'' experiences trying to get other handheld computers hooked

    up in Linux. When you get past getting Linux to see and talk to your PDA,

    the process is just a matter of looking at what program you prefer to use for

    the sync.


    # ## Connecting Your PDA


    Before you plug your PDA into your computer, let''s make sure that you have the

    software that you need. Unless you did something different during installation,

    you should already have a command-line utility program called Pilot-Link

    installed by default in both Fedora and Mandrake. There are a couple of ways

    to find out whether the program is installed. In Fedora, if you are using Apt
    for

    your package management and the accompanying Synaptic program (see

    Topic 3, "System Tools and Utilities," for more information), you can open

    Synaptic, enter your root password, and use the Find button to search for "pilot-

    link." In Mandrake, Kpmdrake doesn''t show pilot-link in the search results on
    a

    default install, even though you might have the program installed. The fastest

    way to find out if you have pilot-link installed is to open a terminal and type
    this:


    ```

    $ dpkg -v

    ```


    You will get output like this if you have the program:


    ```

    ''- - - - - - - - - - - - - - - - - - - - - - - - - - - - -''

    | (c) Copyright 1996-2001, pilot-link team      |

    | Join the pilot-unix list to contribute.       |

    ''- - - - - - - - - - - - - - - - - - - - - - - - - - - - -''


    This is dpish from pilot-link version 0.11.8

    Build date: Nov  20 2003 15:16:20


    pilot-link 0.11.8 is covered under the GPL/LGPL.

    See the file COPYING for more details.


    Please use -h for more detailed options.

    ```


    Pilot-Link, or dpish, is a command-line program for communicating with

    your PDA. The program was made with Palm devices in mind, but if you have

    a Handspring or similar PDA, you are probably used to everything being cre-

    ated with Palm devices in mind. The dpish command name is short for Desktop

    Linux Protocol Shell. With it, you can send commands directly to your PDA. If

    you find that you don''t have Pilot-Link installed, first check your install CDs
    for

    the program. You can also get the latest release at http://www.pilot-link.org/.

    Both GNOME Pilot and Kpilot use Pilot-Link as a background process.'
  merge: -1
  img_proc: true
- pgno: 213
  md: "Most PDAs connect to either a serial port or a USB port. The process for both\
    \ is fairly similar. For most devices, you will most likely be able to plug right\
    \ in and go. Any command or program that you use to communicate with the PDA will\
    \ want a location or port to be listed. Using “in my USB port” won’t work. Linux\
    \ assigns a location to your device in the /dev directory. A USB device probably\
    \ is listed as /dev/ttyUSB0 or /dev/us/usb/ttyUSB0, with the 0 being the number\
    \ corresponding to the port you are using. The serial port can be in either /dev/ttyS0\
    \ or /dev/tty/S0, with 0 being, again, a different number depending on which port\
    \ you are using. The /dev location can vary depending on your distro and hardware.\
    \ If you have problems, you can search the gnome-pilot mailing list archives at\
    \ http://mail.gnome.org/archives/gnome-pilot-list/ for a lot of threads related\
    \ to hardware.\n\nYou can use the hardware browser for your distro to look for\
    \ the device location. In Fedora, go to main menu > System Tools > Hardware Browser.\
    \ Type in your root password and browse for the device. In Mandrake, go to main\
    \ menu > System > Configuration > Hardware > HardDrake. Enter the root password\
    \ and look around for your PDA.\n\nTo sync your PDA, you need the permissions\
    \ to be correct for the device. If you are going to sync as a regular user, the\
    \ device needs to have read and write permissions. Open a terminal, log in as\
    \ root, and change the permissions with this command:\n\n```\nchmod a+rw /dev/[your\
    \ device location]\n```\n\n# # GNOME Pilot\n\n![](img/f2b5f4073f00f9ec5546d9acb9cc6448_213_0.png)\n\
    \n|\tFedora/GNOME menu\tAdd from the panel's right-click menu:\n\t|\n\t|\tAdd\
    \ to Panel > Utility > Pilot Applet\t|\n\t|\tTerminal command\tgpilot-control-applet\t\
    |\n\n# ## Startup and Configure\n\nThe GNOME Pilot program is in GNOME as an applet.\
    \ This means that you can add the applet to your panel by right-clicking the panel\
    \ and following the menus to add the applet. If you need yet another way to start\
    \ the program, you can also double-click the Palm Pilot icon in the GNOME Control\
    \ Center. GNOME Pilot works with Evolution to sync your Palm device.\n\nThe first\
    \ time you run the program, you get a wizard to go through, called the Gnome Pilot\
    \ Setup Assistant. Fill out the information and click Next for each step. The\
    \ device location needed to complete the field is the /dev/[your device location]\
    \ listing you found when connecting the PDA."
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Make the Location Yours


    You might see the device location for a PDA as /dev/pilot, renamed or linked as
    that location by mysterious elves in your computer or by you with this command:


    ```

    ln -s /dev/[Your device location] /dev/pilot

    ```


    The setup assistant shows an error if the device location is not correct. You
    won''t be able to get past the wizard until you answer that Final Leopardy question
    right.


    # The Layout


    When you are through the gate and into the actual GNOME Pilot interface (see Figure
    7.13), there are more options. The layout of the program is a series of tabs with
    pop-up dialog boxes for more detailed options.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_214_0.png)


    The Pilots tab lists all your currently configured devices in a table. You can
    add new PDAs with the Add button. In the Pilot Settings dialog box, you are asked
    for information about the new PDA. You can type in the User Name and ID to use
    with the PDA or use the Get from Pilot button. Send the identification information
    back the other direction with Send to Pilot. Pilot Name is just a name to display
    in the table. In the Local Basedir field (a shorthand way of saying "base directory"),
    enter the directory location where you will want to keep the backup files from
    your PDA. If you are not sure, use the default; it is easily changed later. Sync
    Action is a choice of actions for when you HotSync the device. You can choose
    to do a full sync, to only move files to the PDA, to only move files to the computer,
    or to merge data. The most granular control is to choose Use Conduit Settings.
    With this choice, you can have different actions for different types of data.


    Figure 7.13

    The GNOME Pilot interface.'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'On the Devices tab, you see another table. This is a listing of the device
    settings that you entered in the setup assistant. You can change the name that
    is used, the port listed. Here you can also change the speed, set a timeout (in
    number of seconds), and choose the connection type. A good rule of thumb on the
    speed setting is to start low and try higher speeds to see if they work. Newer
    PDAs can skip the lowest settings and start with 19200 or higher. If the settings
    that you entered do not work, GNOME Pilot shows you an error message right away.


    Conduits are instructions for sending data between your computer and your PDA.
    GNOME Pilot has default conduits set up for the most common data types and actions.
    You can download and install additional conduits, and Evolution has a set of conduits
    for its HotSync functions. To use the conduits that are already set up, choose
    one from the list and use the **Enable** button to make it active. There is a
    *Conduit Settings* dialog box for each conduit, with a few choices that are particular
    to that conduit. The options vary, but most include **Action** and **One Time
    Action**. In those two fields, you can set whether you want that conduit to synchronize
    or to copy data in only one direction. Each configured PDA can be set up with
    its own set of conduits and conduit settings.


    # ## Syncing with GNOME Pilot


    The best way to use GNOME Pilot is to have the applet on one of your panels. Click
    on the applet, and you will see the configuration interface again. Right-click
    the applet, and you will see choices for restoring your PDA’s data, pausing or
    restarting the background process (daemon), viewing the last sync time, and setting
    preferences for notices from the program. Just click your HotSync button to sync.


