- pgno: 274
  md: '# A Few Basic IRC Commands


    Table 10.1: IRC Commands


    | IRC COMMAND | RESULT |

    |---|---|

    | /help | Displays help info from that server, which can be a long listing |

    | /join #philosophy | Joins the channel named philosophy |

    | /leave or /part | Leaves the channel, but stays in the server |

    | /list | Lists channels on the server |

    | /me dances like a cowboy | ** [your username] dances like a cowboy |

    | /msg josh | Sends a private message to the user with the nickname josh |

    | /nick newnickname | Changes your username—to newnickname, in this case |

    | /invite | Invites another user to a channel |

    | /quit see ya | Quits IRC and sends the parting message "see ya" |



    # XChat


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_274_0.png)


    Every group of programs has the solid, reliable veteran. For IRC chat, that solid
    program is XChat. If you are new to IRC, XChat is probably your best choice because
    it makes everything easy for the newbie. As soon as you start XChat, you see a
    few simple fields to fill in your username (it defaults to your Linux username)
    and a list of servers to join. Choose a server, and the main XChat window pops
    up.'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'In the main window (see Figure 10.9), you see the chat side on the left, a
    place for commands on the bottom, and a user list on the right. The menu is full
    of options to help you if you don''t know the corresponding IRC commands for those
    actions, or if you just don''t feel like typing them in. The Server menu has Join
    Channel and Leave Channel among its options. Under the Settings menu, you can
    even learn some new IRC user commands by browsing through the list in Settings
    > Lists > User Commands.


    # Figure 10.9

    XChat''s main window.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_275_0.png)


    After you connect to a server, use /list to find a channel, or search for one
    online, and then use /join #channelName to join. You will probably not have any
    technical problems while using XChat—just some possible people problems. Be polite,
    play nice with the other kids, and make sure you''re home in time for supper.


    # The Skinny


    | PROGRAM | USABILITY | INTERFACE | COMMENTS |

    | :--- | :--- | :--- | :--- |

    | Gaim | Great | Good | Gaim does it all. Just like many GNOME/GTK programs, it
    lacks some of the design and feature bells and whistles of its KDE counterpart,
    but it makes innovations in function. |'
