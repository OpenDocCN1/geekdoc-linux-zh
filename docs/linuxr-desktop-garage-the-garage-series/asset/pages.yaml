    \ URL** | http://pim.kde.org/ |\n\nWhy organize when you can korganize? Er, something\
    \ like that. This is the calendar and task portion of the KDE-PIM Suite. With\
    \ KOrganizer, you can manage your schedule, keep a journal, and manage tasks.\n\
    \nThe layout of KOrganizer is pretty simple. The current calendar month you are\
    \ working in stays handy in the upper-left corner of the window. To-do items are\
