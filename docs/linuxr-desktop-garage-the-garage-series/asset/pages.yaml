- pgno: 128
  md: '# # Apt and Synaptic


    | **Program Info** |

    |---|---|

    | **Fedora/GNOME menu** | *Synaptic: System Settings > Synaptic Package Manager*
    |

    | **Terminal Command** | apt-get |

    | **Program URL** | http://apt.freshrpms.net |


    I can’t be objective. I love Apt. Apt is the greatest thing since sliced chinchillas.
    I suppose that wouldn’t actually be a great thing, but you know what I mean. Apt
    was originally developed as a program for another distribution, Debian. Then the
    smart people in the world figured that Apt was so cool that other Linux users
    should be able to use it as well. Now we have Apt for RPMs. Apt is great because
    it takes the already good RPM package system and solves the dependency problem.
    With Apt, you call out to online servers full of RPMs (repositories) and ask for
    the packages you want. If other packages are required, Apt goes ahead and installs
    those dependent packages as well. Currently, Apt is not available for Mandrake
    in a proven, stable version, but there are users out there working on it.


    # The Magic Apt Commands


    You can keep your Fedora install up-to-date very simply with Apt, but you first
    need to make sure that you keep your Apt repository listing up-to-date. Before
    you use Apt to install anything, always resync the repository with this command:


    ```

    # apt-get update

    ```


    Now you are ready to use this command to install a program:


    ```

    apt-get install {package name}

    ```


    To update your whole system, use this command:


    ```

    # apt-get dist-upgrade

    ```


    Apt is a program that you use on the command line, but you can also use Synaptic,
    a GUI front end for Apt. Synaptic provides you with a very easy interface for
    managing packages and repositories. You can see which available packages you have
    installed, which you might like to install, and which need updating.'
  merge: -1
  img_proc: true
- pgno: 129
