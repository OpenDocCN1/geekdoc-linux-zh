- pgno: 116
  md: '# Broadband and Local Area Networks


    Linux likes you. Broadband connections, such as cable or DSL, and local area networks
    (LAN), such as those found in offices and some homes, are the easiest kind of
    connections to work with in Linux. In an office environment, you need to find
    out from your network administrator whether your office uses Dynamic Host Configuration
    Protocol (DHCP) or whether you need specific IP information. In your home, using
    a cable or DSL connection, you need to find out from your ISP whether it automatically
    assigns addresses using DHCP or whether you need IP and other network configuration
    information. Some cable Internet providers also require you to give your computer
    a specific name in the network settings, so make sure you get all the necessary
    information.


    As noted earlier for dial-up modem users, you might run into some attitude from
    your ISP. Many ISPs say they do not support Linux. If you end up having to ask
    your ISP for network configuration information, be firm. You are not asking them
    to support Linux; you are just asking for the network information. Insist that
    you get the help and information you need: You are paying them.


    # Setting Up Your Connection in Fedora


    The Network Configuration window (see Figure 3.8) is the place to enter any IP
    or other network information. You can get to the Network Configuration window
    by going to your main menu and selecting System Settings > Network. You will be
    prompted for your root password before you can enter any information.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_116_0.png)


    # Figure 3.8


    > The Network Configuration tool in Fedora.


    *to match up similar information. Most likely, you will need only the phone number,
    username, and password, but you might need DNS or IP information as well. Most
    important, do not let your ISP bully you. If they say they don’t support Linux,
    insist that they give you the pieces of information you need,*'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'The Network Configuration tool has a menu, a toolbar, and a series of four
    tabs. In the menu options, you can save your changes, work with multiple profiles,
    and access the help documentation. The toolbar choices change, depending on which
    tab you are in.


    **Devices Tab.** The first tab lists the network devices that are configured on
    your computer. These are not the physical devices, but they refer to virtual connections.
    For each piece of physical network hardware in your system, you usually have a
    device listed. You can also associate multiple devices with one piece of hardware.


    **Hardware Tab.** On this tab, you can configure your network card. Most likely,
    the settings that were put in place during installation will be fine.


    **DNS Tab.** If you are using DNS on your network, you can enter a hostname and
    DNS addresses.


    **Hosts Tab.** You can enter specific IP addresses and hostnames for computers
    on your network. If your network is using DNS, these settings override that.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_117_0.png)


    # Setting Up Your LAN Connection in Fedora


    If you had your network card in your computer when you installed Fedora, your
    settings are probably already okay. If you need to install a new network card
    or configure the connection, here is how to do so.


    +   1. From your main menu, go to System Settings > Network to open the Network
    Configuration window. You are prompted for your root password.

    +   2. Click on New on the toolbar. You will see the Add New Device Type wizard
    (see Figure 3.9). Choose the type of connection you want to add—in this case,
    most likely Ethernet Connection.

    +   3. You will see a list of the hardware on your computer. Choose your network
    card and click Forward.

    +   4. The easiest thing on a home network is to use DHCP to automatically assign
    and obtain IP addresses on your network. If you are using DHCP, all you need to
    do on this screen is choose Automatically Obtain IP Address Settings With and
    then select DHCP in the drop-down list. You can also check the box next to Automatically
    Obtain DNS Information from Provider if your ISP requires it. If you are not using
    DHCP on your network, you can choose Statically Set IP Addresses. If you are taking
    this harder route, I will assume that you either know the IP information to enter
    or can ask your network administrator for it.

    +   5. The last bit is to click Apply to end the wizard. The new connection (or
    device, to use Fedora’s word) is now listed in the Devices tab.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '![](img/f2b5f4073f00f9ec5546d9acb9cc6448_118_0.png)


    # Figure 3.9


    The Add New Device Type window in Fedora, entering IP information.


    # Setting Up Your Connection in Mandrake


    Remember the MandrakeLinux Control Center? We''re going back to it. Open the Control
    Center and choose Network & Internet. Now you have a lot more choices to look
    at here. Most of the icons in this category are task oriented, so if you want
    to add a new connection, choose New Connection. Here is a look at what all those
    icons are for.


    **New Connection.** This opens a wizard with which you can add any of the available
    Internet connections that Mandrake knows about, including modem, LAN, and wireless.


    **Internet Access.** Many of the fields on this tab are for information that you
    should enter when you add a new connection. This module gives you a shortcut to
    edit or enter DNS and hostname information.


    **Manage Connections.** At the top is a drop-down menu where you can choose a
    connection to edit the settings. Below that are a few tabs where you can edit
    IP and other network information.


    **Monitor Connections.** Here you can view the activity on your configured connections.
    Information displayed includes the volume of data sent and received and the speed.


    **Remove a Connection.** This module lists your connections in a drop-down choice
    so that you can choose one to delete, if you need to.


    **Proxy.** If you are behind a proxy server, you can enter the address information
    for the proxy here.'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'Internet Connection Sharing. If you are on a small or home network that does
    not have a computer acting as a dedicated server for the Internet connection to
    the rest of the computers on the network, some computer has to step up and volunteer
    for the job. If yours is the computer on your network that is directly connected
    to the Internet, this module walks you through a wizard of choices so that you
    can share that connection with other computers on your network.


    # TOOL KIT: 3.5


    # Setting Up Your LAN Connection in Mandrake


    Mandrake puts everything in one place for you, making it easier to find, but the
    interfaces for some of the tools are a bit clumsy. Nonetheless, it is a wizard,
    so let’s step through it.


    +   1. From the MandrakeLinux Control Center, click Network & Internet > New Connection.

    +   2. The first step is to choose a connection type. Click LAN Connection and
    then click Next.

    +   3. Choose your network card from the list and click Next.

    +   4. Now you get to choose whether you want to use DHCP (Automatic IP) or manually
    enter your network IP information (Manual Configuration). DHCP is the easiest
    choice. If you want to manually enter everything, I am going to assume that you
    know your IP information.

    +   5. Your next screen will look different, depending on your choice of DHCP
    or manual configuration. In either case, you have a few self-explanatory check
    boxes to complete. The defaults are good if you aren’t sure what to choose.

    +   6. Your next step is to optionally enter a hostname for your computer. After
    you click Next, there is a choice to enter a Zeroconf hostname. Zeroconf is a
    new network protocol that is trying to cut through the current tangle of proprietary
    protocols to make networking more simple. You are probably not using this, but
    it doesn’t hurt to retype your computer name in this box and click Next.

    +   7. You are asked whether you want to restart your network. Of course you do.
    Yes. This action restarts the network service.

    +   8. Read the happy Congratulations screen and click Finish.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Wireless


    Many homes and businesses are now using wireless networks. You can go to many
    public wireless “hot spots,” from libraries, to baseball stadiums, to coffee shops,
    and be able to get online. Some prominent ISPs are giving wireless routers to
    new customers with broadband service.


    Wireless support in Linux is new, so it can be shaky still. There is a little
    extra work to setting up a wireless connection and getting it to work in Linux.
    If you are undecided about whether to go wireless, make sure you consider all
    the reasons.


    Wireless may make sense for you if...


    +   - You have a laptop computer with a wireless network card.

    +   - You have a home network, and it would be difficult to string network cable
    all through your house.

    +   - You already live or work in a place with an existing wireless network.

    +   - You mainly use your computer for e-mail, Internet browsing, music, office
    applications, and other basic desktop functions that don’t require constant high-speed
    bandwidth.

    +   - You want to take the time and patience to configure and secure your wireless
    connection.


    Think twice about wireless if...


    +   - You have a desktop computer that doesn’t move very often.

    +   - You do a lot of bandwidth-intensive activities online and might feel limited
    by the reduced bandwidth capacity of wireless compared to a broadband-wired network.

    +   - You do not want to spend the time and money to set up and configure a wireless
    network or to make sure that it is secure.

    +   - You never wish you could be sipping a latte while surfing the Internet at
    a coffeehouse.


    # What to Get


    A basic wireless network consists of an Internet connection, a wireless router
    or wireless access point, and a computer with a wireless network card.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Wireless Protocol Choices


    There are three common wireless protocols right now. A protocol is a format for
    transmitting data. When you go to buy your wireless hardware, you will need to
    be familiar with the different protocols to choose the right hardware for the
    protocol you want to use.


    # 802.11a


    This protocol is mostly used in large offices right now. 802.11a is not nearly
    as common as b or g. You probably won''t be using this.


    # 802.11b


    This is the most common protocol in use right now. At 11Mbps, 802.11b is slower
    than g, but b is the protocol used by most public wireless hot spots in coffeehouses,
    airports, hotels, and some college campuses. 802.11b cards also have the best
    support in Linux.


    # 802.11g


    The 54Mbps speed of 802.11g makes it the fastest protocol, but Linux support is
    lacking for many g network cards. Look around online to find which of the latest
    cards for the g protocol are supported. If you do buy 802.11g hardware and you
    have a laptop, buy hardware that also supports the b protocol; then you have flexibility
    when trying to get online when you are out and about.


    The wireless access point or router you get does not matter in relation to your
    Linux system. The two will never meet. Buy the access point or router that you
    deem best for your needs. The wireless network interface card (NIC) you buy matters
    a lot in relation to your Linux system. Right now Linux support for wireless NICs
    is best for PC cards. Although there are wireless NICs that can connect to your
    computer via a PCI slot or USB port, there are not easily available drivers for
    those types of cards. Determined users can try searching out and installing drivers
    for other network card types, but most users should stick with PC cards. You can
    find the latest information online and buying advice on wireless hardware for
    your Linux system. One good site is http://www.hpl.hp.com/personal/learn_Tour/lhelles/Linux/.
    New hardware comes out all the time, so search online to find up-to-date information.


    # Configuring Your Wireless Network Access Point or Router


    To set up your access point or router, you need the manual that came with it.
    The setup disks and instructions probably were written for Windows users. If you
    have a Windows computer in your home or office as well as your Linux


