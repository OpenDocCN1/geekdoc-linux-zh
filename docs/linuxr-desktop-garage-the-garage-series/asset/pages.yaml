  md: 'fears creep back in. If you are unsure about any of the choices that I explain
    to you, choose the defaults. Both Mandrake and Fedora have good default choices,
    allowing you to go through the screens on autopilot with little concern. You will
    learn about additional software, options, and skills in the later chapters of
    this book that will help you with adding anything that you need.


    Right now, pop in the first install CD of the Linux distro you are installing.
    Go through all the choices. If you have a question about a certain step, use this
    section as an installation subject reference. Refer to one of the following sub-
    jects for more information on different installation steps common to Mandrake
