  md: '# Good Passwords


    Have you ever seen the movie *Hackers?* (Again, <http://imdb.com> might be your
    friend if you don''t know what I''m talking about.) They say in that movie that
    the most common passwords are *love*, *sex*, *secret*, and *god*. That is, unfortunately,
    probably true. A lot of people are so worried about remembering their passwords
    that they use words that are too easy to guess or find out. A good password should
    be more than six characters and should contain both numbers and letters. If you
    can use a phrase or word that isn''t in the dictionary, that is even better, especially
    for your root password. No, *password* is not a good password. Oh, and *Hackers*
    gets way funnier after you have used *Linux* for a while.


    Mandrake will have you create a regular user account during the installation process
    (see Figure 1.6). Fedora adds users in the post-installation steps. Both distros
    give you an option to have your regular user logged in automatically. If your
    computer is not a public computer that only you will be using, I suppose there
    is no harm in allowing the automatic login. The whole thing just makes me itchy,
    though. I don''t think anyone should use the option. I might think that because
    I have been known to change other people''s wallpapers or home pages for them
    to strange but funny things. So, if you want to amuse someone like me, by all
    means, enable automatic login. Just don''t be surprised when <http://www.marykateandashley.com>
    is set as your browser''s home page and your desktop wallpaper is covered with
    pictures of Hello Kitty.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_51_0.png)


    # Figure 1.6

    Adding users during a Mandrake install.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Network Configuration


    Don''t have a network card in the computer? Then skip the Network Configuration
    step. If you do have a network card, let''s play. The setup is easy. With a DSL
    or a cable modem Internet connection, you can probably select DHCP and move on.
    If you are on a LAN with an assigned IP address, click Edit and ask your network
    administrator for what information you should enter.


    The **Network Configuration** section looks like a big, important, scary thing
    during the install, but it is really just a matter of whether you have a network
    card and the right information. Even if you don''t have all your network information
    on hand now, you can change the entries later. If you have a dial-up modem or
    wireless card in your computer, the devices will likely be detected now, but you
    can set them up later.


    # Firewalls


    A firewall is your protection from unwanted intrusion. The firewall works by restricting
    traffic through different ports on your computer. The ports are numbered endpoints
    to logical connections. Linux is an OS that is known for being secure, but it
    is only as secure as you let it be. You have to take advantage of the security
    tools available to you. We have already talked about the root user and passwords,
    so now we can talk about ports, virtual intruders, and viruses.


    Setting up the firewall in Linux is a good idea. Even if you are behind a firewall
    on a network, set up the personal firewall in Linux as well. You might swear at
    the firewall later when you try to do something and find that the firewall isn''t
    set up correctly, but that''s when you should stop and think about that patient,
    logical problem solving we went over earlier. Everything can be tweaked or fixed.


    There are two firewall choices in the Mandrake installation. The third step of
    the install asks you about a security level. A scrolling text box is above the
    choice, with an explanation of what each level means. You should choose Standard
    for now; you can adjust settings later. There is a second firewall choice in Mandrake''s
    install. Near the end of the installation, you should see a summary that lists
    your hardware configuration. Scroll down and find Firewall in the Security section.
    This is for a firewall to limit outgoing connections. You can probably leave this
    alone for now. If you want to stop, go into the configuration, uncheck the Everything
    choice, and at least check off things that you know you will not be running. For
    instance, if you are not running a mail server, check off Mail Server.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'Fedora gives you the chance to set up your incoming firewall during the installation.
    All you have to do is decide which types of traffic you want to allow into your
    computer then check each box. If you are not familiar with some of the traffic
    types, you can find them all defined in the Glossary section.


    No, I don''t think that there are packs of swarthy-looking Internet bandits sitting
    online waiting for you to get your computer up and running so their attacks can
    begin. Yes, it is true that on Linux you will not have to deal with many, or likely
    any, viruses. Why take any chances, though? If you have a built-in, easy-to-configure
    tool to stop unwanted access to your computer, use it.


    # Creating a Boot Disk


    You might be asked if you want to create a boot disk. If you have a floppy and
    a floppy drive, there''s no reason not to. You never know if you might need a
    little parachute item such as a boot disk. Just grab a floppy, put it in, and
    follow the instructions. Skipping this step will not cause plagues of locusts
    to land on your monitor. You can move on, if you want.


    # Waiting


    Here''s the easiest step: You wait. After you choose the programs that you want,
    the installer moves on to copying and installing files onto your hard drive. Depending
    on which packages you choose and which disks those packages are on, you might
    have to change CDs. When all the copying is done, the install is complete. Take
    out any disk from your CD drive, and reboot the computer with the prompt on the
    screen.


    # Post-Installation Steps


    Both Mandrake and Fedora have post-installation wizards that guide you through
    a few setup steps. Most of the questions will be easier than high school biology,
    and no one will make you dissect anything.


    # Mandrake Post-Install


    The first thing Mandrake gives you in 10.0 is a User Survey. Completing this survey
    is totally up to you. Some people like being fodder for demographics; some don''t.


    Next, you can configure how your desktop is going to look. You choose your desktop
    environment (KDE is Mandrake''s default) and the theme, or look, of your desktop.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Then you''re done (see Figure 1.7). The desktop environment starts up and plops
    you onto the desktop. There is a welcome screen with links to Mandrake Web sites
    and shortcuts to some of the first things you might want to theme or customize.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_54_0.png)


    # Fedora Post-Install


    You will see a license agreement on the first post-install screen in Fedora Core
    2. The license you agree to in Fedora is less restrictive than any commercial
    software, so you don''t have to worry that you''re giving away your rights or
    are agreeing to wash the software developers'' cars once a week.


    Now it is time for another hard part. Fedora will ask you to confirm the date
    and time. I know, I know. You might feel like you''re not ready for this kind
    of technical question, but I have confidence in you.


    The other post-install steps include creating user accounts. Create your regular
    user account so that you have a different login than just the root user.


    You are asked to confirm or change the choices Fedora has detected for your sound
    card. There is also a button to hear a test sound. If Zamfir played the guitar
    instead of the pan flute, his music would sound like this test sound. Just click
    Yes to confirm that you heard the beautiful, yet moving music of Zamfir. If you
    did not hear the test sound, there will be some instructions. At this point, I
    suggest a nice, passive attitude. Click Yes whether you heard the test sound or
    not. If you didn''t hear it, you can fix the sound card settings later.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'Next, you have another chance to customize the software packages you want to
    install. The interface for this package management is the same interface you saw
    in the install if you chose Customize Software Packages to Be Installed. Again,
    you have the series of categories (refer back to Figure 1.5) and check boxes.
    At this point, I bet you just want to start using your computer. Because I am
    also in favor of sneaking open Christmas presents before you are supposed to,
    I advocate just skipping this step and getting to the login. If you want to install
    other software from the CDs, package-management tools are readily available from
    the main menu of both KDE and GNOME.


    You are now congratulated for being such a smart person and are handed over to
    your desktop to start using Linux (see Figure 1.8).


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_55_0.png)


    # Startup and Login


    When you start your computer, you get different kinds of status messages. If you
    are dual-booting, you should first see your boot loader. Choose your Linux installation
    and press Enter.


    In Fedora, you see a graphic of a computer, a status bar moving along, and a series
    of messages to let you know what is going on. If the startup encounters a problem
    or outputs a message that you should see, the'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'screen switches to showing you line-by-line output of what is going on. Usually
    there is no reason to panic if you are looking at the *Show Details* output. If
    your computer doesn''t start, then you can safely panic.


    Mandrake shows you a blue screen, but not a blue screen of death. The blue screen
    has a progress bar on it. The more verbose output of what is going on during startup
    is accessible to see or pops up on its own if Mandrake thinks you should see it,
    such as when new hardware is detected, when your network cable is unplugged, or
    when there is an error.


    The login screen is your next stop in both distros. Simply put in your user-name
    and password. Enter the information for the regular user you created, not the
    information for the root user. After that, your next stop is your desktop. That''s
    where I''m going next, too. Well, I''m going to my desktop, not to yours, but
    you get the idea.


