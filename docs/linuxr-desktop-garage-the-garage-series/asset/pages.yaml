- pgno: 35
  md: 'There are many Linux distributions out now, and most of those distros offer
    a similar set of features. A patient new user could figure out even the most technical
    of distributions. The difference between Linux on the desktop now and Linux on
    the desktop two years ago is astounding. Each of the major distros contributes
    innovations that get worked into new versions of other distros. That''s the character
    and power of Linux, the ability to share new ideas to benefit all and present
    choice for users.


    Right now, you''re the newbie. You''ve got to pick something. Fedora and Mandrake
    have simplified the installation, choices, tools, and utilities to be quite user
    friendly. You might even find some things easier in these distros than in your
    old OS. We will move forward with Fedora and Mandrake. In exploring these two
