    # ## Connecting to the World


    I think you can still have a computer and not be connected to the Internet. Wait,
    let me check on that—umm, yes, you can, but it''s like cutting off your computer''s
    head in today''s world. Without the Internet, you and your computer are just going
    to play Solitaire in your underwear all day. Of course, maybe that is what you
    like to do anyway. I''m not insulting your chosen path in life, but don''t you
    know what else is out there on the Internet? At the very least, you could order
    more underwear (see `http://www.treshspair.com/`).


    # ### Dial-up


    While most of the Internet world is speaking in terms of broadband, many people
    are still using dial-up connections. If you need to connect to the Internet with
    a dial-up modem, pull up a chair because we need to have a talk.


    Support for many modems in Linux is not so good. The culprit is a type of modem
    called a Winmodem. A few years back, hardware makers tried to cut costs by manufacturing
    cheaper modems that used lesser hardware and instead, relied on some bundled Windows
    software to run the modem. The result is that we now have what are called hardware
    modems and software modems. Hardware modems, such as those made by U.S. Robotics,
    are mostly supported in Linux. Software modems, which usually include the cheapest
    choices, are sparsely supported in Linux. Even the few software modems that can
    claim Linux support (sometimes dubbed Linuxmods) often require a lot of configuration
    that is extremely complex. You might as well go out and buy a hardware modem instead
    of wasting lots of time fiddling with all the necessary configuration to get a
    software modem running in Linux.


    How do you tell whether you have a Winmodem or a hardware modem? The best way
    to find out whether something works is to actually try it. You can also look online
    to see what type of modem you have. Open the hardware browser in your distro to
    get the brand and model of your modem.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Network Around the Problem


    Many people these days have more than one computer in their home. If you are one
    of those people and you have a software modem that you cannot get to work in Linux,
    try networking. A local area network is not just for broadband users; you can
    use another computer dial up to establish the Internet connection and then share
    that connection with your Linux computer. There are many online resources on how
    to network two or more computers together. Search online or check out these URLs:
    http://www.linksys.com/faq/default.asp?fpid=16 and http://computer.houstuffworks.com/home-networkw11.htm.


    +   - **Hardware Browser in Fedora.** *Main menu > System Tools > Hardware Browser*


    +   - **Hardware Browser in Mandrake.** *Main menu > System > Configuration >
    Configure Your Computer*

    +       (from inside the Mandrakelinux Control Center) *Hardware > Hardware*


    Find your modem in the list of hardware, and write down the brand and model of
    the modem. Next, go to an online listing of Winmodems at http://www.devildal.tv/~chris/winmodems/
    to see which list your modem is in. There is also a Linux Documentation Project
    page on Winmodems at http://tdl.dp.org/HOWTO/Winmodems-and-Linux/HOWTO-1.html#ss1.3.
    If you do have a Winmodem and want to try to make it work, check out http://www.linuxmodems.org/.


    # KPPP


    # Program Startup


    | | |

    | --- | --- |

    | **Fedora/GNOME menu** | *Internet > KPPP* |

    | **Mandrake/KDE menu** | *Internet > Remote access > KPPP* |

    | **Terminal command** | kppp |


    KPPP is the KDE program for Internet dialing. The program can be included with
    both Mandrake and Fedora if you choose to install KDE. If you don''t have KPPP,
    you can install the program from your installation disks. (See "Installing New
    Software," later in this topic, for more information.) Even though KPPP is a KDE
    program, it is really the best choice for both GNOME and KDE users. There isn''t
    a GNOME substitute at this time that is easier than KPPP.'
