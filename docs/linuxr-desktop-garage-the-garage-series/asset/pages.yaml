    # The Distribution Cavalcade


    # Debian/GNU


    Debian is a distro that is generally considered best suited for more experienced
    users. It is a “social distribution,” meaning that there is no big corporation
    putting the distro together. Debian is created and maintained by a community of
    users. Debian exists in three states: unstable, testing, and stable. Any new packages
    go into unstable and then move through the chain accordingly.


    Install: Debian is notorious for having one of the more cryptic installations.
    The install is text based and is aimed at the confident and experienced user.
    The new installer promises to be a little friendlier and offers a GUI option for
    the text-phobic.


    Pros: Apt, a great installation tool, was developed on Debian and is definitely
    a plus to use for installing new software. The system of keeping the distro in
    three states is one of the smarter ways for handling the addition of new programs.


    Cons: The installer doesn’t really install everything that most people will need.
    Post-install, you need to use Apt to add most of the software you want. The unstable,
    testing, and stable scheme doesn’t offer much of the instant gratification that
    we are all used to as computer and Internet users. The stable version can look
    outdated to someone looking for the newest versions of programs.


    Availability: Download ISOs or buy from the list of vendors on Debian’s site.


    Cost: Free to download; minimal cost for CDs, averaging around $20.


    # Fedora


    In 2003, Red Hat split its distribution into a home (or hobbyst) edition, Fedora,
    and a professional distribution, Red Hat Enterprise. The idea is that Fedora will
    be the proving ground for new versions. Red Hat borrowed the Fedora name from
    an existing distro and merged with its developers’ efforts. Fedora Core 1 is essentially
    Red Hat 10, and further development continues from there.


    Install: I think that Fedora can now give Mandrake some competition for easiest
    installer. The Anaconda installation program simplifies every question, while
    still allowing advanced users to customize many aspects of the install. Help menus
    are always visible.


    Pros: Red Hat, and now Fedora, is one of the more ubiquitous Linux distributions.
    Enjoying that popularity can make finding help for Fedora or finding packages
    quite easy. There is a port of Debian’s great APT tool for RPMs (packaged programs)
    now, so Fedora can use either APT or Yum (both similar and convenient tools for
    updating). Fedora also uses the Red Hat Network for updates. Many of the system
    tools have easy-to-use GUI front ends that will appeal to new users as well as
    experienced users who'
  merge: -1
  img_proc: true
