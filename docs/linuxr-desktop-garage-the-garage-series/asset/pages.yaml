- pgno: 135
  md: 'Lots and lots of text will scroll by, some of it in an obscure language from
    a 1960s Star Trek episode. You don''t have to catch it all; you can wait for the
    end result. If you are missing something that the program needs, you will see
    an error and can scroll back up to see what is missing. If you have a missing
    piece, try looking for it on your install disks. If you are successful, you will
    usually see your command prompt again.


    +   5.  You are now ready to compile the program. You compile the source with
    a pro-gram called make:


    ```

    # make

    ```


    More gobbly-gooptext scrolls past. If everything works, you will see the command
