  md: '![](img/f2b5f4073f00f9ec5546d9acb9cc6448_344_0.png)


    # Glossary


    **802.11a.b.g**

    Family of specifications for wireless LAN that describes the over-air interface
    between a wireless router or access point and a wireless network card.


    **AAC**

    (Advanced Audio Coding) An audio compression file type similar to MP3, used in
    Apple’s iTunes.


    **antialiased, antialiasing**

    A software technique for smoothing fonts and graphics.


    **API**

    (application program interface) Set of standard protocol tools for programming
    software applications. Applications that share the same API have similar interfaces.


    **archive file**

    A single file or multiple files that have been compressed into a smaller single
    file. Archives can be unpacked to access their contents.


    **authentication**

    Security term used to describe the process of identifying an individual for approved
    access to a system or object. Authentication is often in the form of a username
    and password.


    **avatar**

    A graphical icon or image used to represent a person online.


