    # ## Emulators


    An emulator is a program designed to mimic another operating system. In the case
    of games, these emulators mimic the operating systems of game consoles such as
    the Nintendo, Super Nintendo, PlayStation, or arcade machines. Fire up a *game
    emulator*, and you have a virtual version of that game system running on your
    computer. For anyone nostalgic for the heady days of old game consoles or arcade
    games, emulators are really fun. You can play all the games you remember without
    having to dig your old game console out of that box in your garage.


    To play a game on an emulator, you have to get a copy of the game to load. The
    game copies, usually called ROMs, are floating around online to download. Be warned
    that most emulator programs have not been made very user-friendly for new Linux
    users. You cannot usually download them from any handy repositories. There are
    sometimes, but not always, RPM files for the programs. Running emulators gets
    you into the terminal and config file land of Linux. If you don''t want to enter
    that land, you might want to stick with other gaming options. Many emulators are
    available to run in Linux, but a few programs have been around for a while and
    have most of the kinks worked out.


