- pgno: 350
  md: '+   1. A archive file containing several files.

    +   2. RPM *package*; collection of files clustered into one file for easy installation
    of programs.


    **panel**


    Desktop object on which small programs and icons can be placed.


    **partition**


    Divided section of a hard disk. Disks are often partitioned to install multiple
    operating systems on one disk.


    **peripheral hardware**


    Computer device that is not part of the central computer hardware, CPU, and motherboard.
    Examples include CD-ROM drives, mouse, keyboard, printer, and monitor.


    **PIM**


    (personal information management) Programs designed to help users organize small
    bits of personal information, usually including schedules, contacts, tasks, and
    reminders.


    **plug-in**


    A hardware or software module that adds features, often used to describe add-on
    modules for programs such as Web browsers.


    **POP3**


    (Post Office Protocol) Type of e-mail account; protocol for retrieving mail from
    a server.


    **pop-up ad**


    Online advertisement on a Web site that opens unrequested browser windows on your
    computer.


    **port**


    Computer interface for connecting a device.


    **PPC**


    (Power PC) Type of computer processor used by many Apple computers.


    **PPP**


    (Point-to-Point Protocol) Protocol for connecting a computer to a network, usually
    used with dial-up modems.


    **protocol**


    A standard format for transmitting data between two devices.


    **proxy**


    A server that sits between a client and network servers to improve efficiency
    and filter requests.'
  merge: -1
  img_proc: true
