  md: 'has required dependencies when you are installing it through Yum, it figures
    out and installs the dependencies for you. You can use Yum instead of or in addition
    to Apt or Up2date. Yum is installed by default on your Fedora system but is currently
    not available for Mandrake.


    # **Apt and Yum Repository Files**


    You can add or remove repositories for Apt and Yum to access in their sources
    files:


    +   Apt: `/etc/apt/sources.list`

    +   Yum: `/etc/yum.conf`

    +   Synaptic: Main menu > System Settings > Synaptic Package Manager


    A number of individuals and groups maintain repositories for hard-to-find add-on
    packages. One of the best sources is the Dag Wieers repository (see `http://dag.wieers.com/home-made/apt/`).
    Just remember not to include the funky extra repository sources if you do an `apt-get
    dist-upgrade` or `yum update`. If you fail to remove those new sources during
    an overall update, you risk rendering some packages unusable.


    Because Yum comes with Fedora, it uses the Fedora repository initially. You can
    add other repositories, if you like. Use the terminal command `su` to become the
    root user before using Yum. When you first use Yum in each session, you need to
    update the database of RPM header files:


    ```

    # yum check-update

    ```


    This can be a lengthy process the first time you do it, but it isn''t so bad subsequent
    times. Updating your system or installing a program is easy.


    To update installed packages, use this command:


    ```

    # yum update

    ```


    To install new packages, use this one:


    ```

    # yum install [package name]

    ```


    Just like Apt, Yum is very easy to use. Unlike Apt, no commonly used GUI front
    end is as good as Synaptic to use instead of the command line.'
  merge: -1
  img_proc: true
