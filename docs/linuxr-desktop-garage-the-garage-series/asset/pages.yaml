- pgno: 34
  md: 'I concentrate on Fedora (Core 2) and Mandrake (10.0) throughout the rest of
    this book. I think that these two distros are the easiest for someone new to Linux
    to install, set up, and use. It also is very easy to find software packages already
    compiled for both. When you get used to a few of the conventions of the Linux
    world, that is the time for you to explore. In Mandrake and Fedora, you will find
    that the desktop environment and programs you use are mostly the same between
    distributions. The installation and system tools differ.


    Deserving special mention is the next most popular choice among Linux users, SUSE
    (see Figure 1.2). SUSE is another distro that can be quite easy for new users,
    especially those switching from Windows. Utilities and system tools are intelligently
    arranged and easy to find in the menus. The distribution is RPM based, making
    installing new software uncomplicated for new users. If you opt to buy a boxed
    edition of Linux, SUSE has some of the best, most complete manuals included.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_34_0.png)


    # Figure 1.2  The SUSE desktop after first login.


    One of the most interesting newer choices on the distro front that also deserves
