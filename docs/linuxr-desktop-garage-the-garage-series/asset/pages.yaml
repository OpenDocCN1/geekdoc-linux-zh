  md: 'Cons: Cost shouldn''t be a negative when we''re talking about computer software,
    but in the Linux world, Linspire''s cost might be a sticking point for some users.
    Just as with other commercial operating systems, you will be waiting on the company
    for updates, and you won''t find many compiled packages online. If you like company
    support, you do have that, but you do not have many fellow users to ask for help.


    **Availability:** Buy the distro from Linspire''s online store or on a PC at Wal-Mart.


    **Cost:** Different versions range from $49 to $149.


    # ## Mandrake


    Mandrake has been around for a while, like many of the major distros, and has
    garnered reputations, both good and bad. On the good side, it''s the distribution
    most recommended to new users because Mandrake has always focused on ease of use,
    with many tools and wizards. On the bad side, some users don''t like how some
    of those tools and wizards work.


    **Install:** The Mandrake install is cake. All of the steps are in a screen-by-screen
    setup. A user could conceivably just choose Next on all of the default choices
    and still do alright.


    **Pros:** There are a lot of users and help out there for a new Mandrake user.
    Users can also play with programs in the Mandrake Cooker, a repository for new
    programs that are still being worked on. Functions that would be painful in other
    distros are effortless with the Mandrake Control Center. Mandrake also has a version
    for Macs.


    **Cons:** Releasers tend to be innovative, with all the latest versions of everything,
    but those latest versions can result in buggy releases. Device configuration can
    be confusing, but that''s true in many distros. Be careful with Cooker packages;
    software from the Mandrake Cooker is sometimes unstable.


    **Availability:** Download, buy CDs online, order CDs, or buy retail.


    **Cost:** Buying CDs averages $49–$229. If you download, Mandrake requests a donation
    and membership in the Mandrakelinux Users Club.


    # ## Slackware


    Slackware is the Linux grandpa, having been around since 1992. Just like Grandpa,
    Slackware wants none of your newfangled GUIs and tools. This distro had to walk
    to Linux uphill both ways, and so should you.


    **Install:** The install is text based and aimed at experienced users. All you
    have to do is look at Slackware''s installation FAQ to see the caliber of questions
    about the installation.'
