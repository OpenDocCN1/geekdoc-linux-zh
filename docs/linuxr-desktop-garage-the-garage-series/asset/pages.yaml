  md: '# Moving Windows Between Desktops in KDE


    You might open a program in one desktop and then need to move it to another. There
    is no need to close the program to move it. To move a window from one desktop
    to another, right-click on the window border, the top part with the title. A menu
    pops up.


    Move your cursor down, highlighting To Desktop to reveal the submenu. On the submenu
    is All Desktops, for keeping the window visible on every desktop, and a listing
    of your other desktops, according to what you have named them. You can see the
    current desktop delineated with a check mark. If you choose a desktop, the window
    goes away, although you just need to look down at the pager on the panel to see
    the outline of the window on the desktop that you chose. Just switch to that desktop
    to find your window again.


    # Manage Your Files


    A file manager is, at heart, merely a graphical way to organize and view your
    files. Not a lot of innovations can be made in moving files and folders around.
    With that in mind, you will probably feel right at home in the Linux file managers
    if you have used Windows or Mac OS. In most computer operating systems, all the
    data is arranged in a hierarchy of folders (directories) and files. Of course,
    your data is organized this way because we are all familiar with folders and documents
    in the physical world.


    # The Linux File System


    Each operating system has its own folder, or directory, hierarchy. You might be
    familiar with a few of the top-level folders in Windows, such as Program Files.
    Linux is not so palpable in its naming of the top-level directories. Most of those
    directories at the top level are ones that you will not—and usually should not—have
    to get into. If you are curious, many pages online (such as the one at http://www.freeos.com/articles/3102/)
    give lengthy explanations of the purpose of each top-level directory.


    You might not want to change anything in the /etc directory or the /var directory,
    but there are a few files and locations in the Linux file system that are useful
    to know about. You can sort of mentally bookmark these for reference.


    /etc. This is a directory that you shouldn''t muck around in unless you know what
    you''re doing, but /etc is a good directory to know about. This is where the


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_77_0.png)


    # UNDER THE HOOD


    # IS IT A FOLDER OR A DIRECTORY?


    It''s both. A folder and a directory are used as interchangeable terms. Folder
    is the friendlier term, invoking images of manila folders on a physical desk.
    Directory is the more technical term that'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'most important configuration files for Linux are kept. In extreme problem situations,
    the fix can be in here. However, unless you think of yourself as something close
    to an advanced user and have a reason to be there, consider this directory forbidden.
    Here, I will say it in German, so it sounds more forbidding: Verboten!


    /home/username. This is where you live. /home has directories for each of the
    users on your computer (except the root user). Your home directory is readable
    only by you and the root user. You can do whatever you want in here. Preference
    files for many of the programs that you run are also stored here in hidden folders.


    /mnt. If you mount another file system or external storage media, such as your
    Windows disk partition, a floppy disk, or a CD, /mnt is a good place to look for
    those files. /mnt is the usual place where your OS will give you access to mounted
    file systems.


    /misc. Can’t find the file system that you mounted in /mnt? Look in /misc. This
    is the directory that Fedora sometimes uses to mount file systems to.


    /root. You have a home, and so does the root user. But the root user is too good
    to live in the /home neighborhood where you live. If you run any programs as the
    root user, most of the preference files will be in here. You shouldn’t have to
    play around in the /root directory much.


    /tmp. /tmp means “temporary.” This is a handy directory for placing temporary
    files, especially files that you need to hand off to another user on the computer.
    You will see some mystery files in the /tmp directory because programs also use
    the /tmp directory to keep temporary files. Don’t bother cleaning it out; Linux
    can tidy up after itself.


    /usr/bin. This directory is on your verboten list of directories not to change
    things in, but it’s a great place to know about when you are looking for programs.
    /usr/bin is where most of your executable program files are stored. Want to run
    the command to start a program? This is where Linux finds the command.


    /usr/share. The root user owns this directory, but it contains many files that
    all users share, thus the name. For example, /usr/share/pixmaps is where you will
    usually find desktop wallpaper and icon files.


