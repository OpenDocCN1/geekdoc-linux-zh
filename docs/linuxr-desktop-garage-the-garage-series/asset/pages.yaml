  md: '# Mandrake Update


    # Program Info


    **Mandrake/KDE menu**  System > Configuration > Packaging > Mandrake Update


    **Terminal Command**  MandrakeUpdate


    You can update your Mandrake system easily as well. Mandrake Update (see Figure
    3.12) is a utility that uses the Mandrake program RPMdrake and combines it with
    the capability to grab updated packages from online sources. Unfortunately, this
    tool installs only updates and does not give you an interface to install whole
    new programs.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_132_0.png)


    When you open Mandrake Update, you will be asked if Mandrake can go get you a
    list of servers to choose from and then show you the list. You can pick whichever
    one looks good to you. The main window then starts up. Updates are arranged in
    categories and displayed in an expandable list on the right side of the window.
    Information about each package is displayed to the right when you click on a package
    name to highlight it. Each available update has a check box next to it. Just check
    the updates that you want to install and click the Install button when you are
    ready.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_132_1.png)'
