- pgno: 210
  md: '3. The options to set a reminder are different in Körganizer than in other
    programs: Check the Reminder box; set the time in minutes, hours, or days; and
    then choose a type of reminder. You have choices to use any or all of playing
    a sound, running a program, or displaying a message.


    4. Now you can fill in the other event details. The other options to complete
    on the General tab are for Categories, Access, and Template. The Attendees tab
    is a place to set up a list of attendees, such as for a meeting, and e-mail them
    about the event. To have your event recur, go to the Recurrence tab and click
    the Enable Recurrence check box. On the Attachments tab, you can add an associated
    file or Web address. At any time while you are completing options, you can click
    the Apply button to save the options that are completed so far.


    5. When you are done, click OK. You can see your new event listed on your calendar.
    Click that event to edit it.


    # ## To-Do Item


    1. To enter a new to-do item, right-click in the to-do area when you are in calendar
    view. You can also right-click the main content area when you are in the to-do
    view or choose Actions > New To-Do from the menu.


    2. Here we have the Edit To-Do dialog box (see Figure 7.12) with a General tab,
    an Attendees tab, and an Attachments tab. On the General tab, at least complete
    the Summary. You can also complete a due date and time, percent that the task
    is completed, a priority level, Categories, and Access. The Reminder and Template
    options are the same as they are for calendar events. I’m not sure why you would
    need people to attend your to-do item, but you have the Attendees tab, just in
    case. You can attach an associated file or address to your to-do item on the Attachments
    tab. You can click Apply at any time to save options you have entered so far.


    3. Click OK when you are done. You can edit your task by double-clicking the task
    in either the to-do view or any of the calendar views.


