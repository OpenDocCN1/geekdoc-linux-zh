    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_145_0.png)


    # **Change KDE Wallpaper, Theme, Window Decorations, and Colors**


    The best place to look for anything to do with the look of KDE is, naturally,
    `http://www.kde-look.org`. At kde-look, you can find icons, wallpapers, themes,
    splash screens, and everything else you need. You can still look for icons and
    themes elsewhere, but kde-look has the largest collection and is the safest place
    to download themes, to ensure that you don''t get any oddly corrupted files.


    Today we are going to grab a desktop wallpaper from the Web site. Plenty of good
    themes come with KDE, so we will use two of those for the style and window decorations.


    +   1. Fire up a Web browser and head over to kde-look.org.

    +   2. Under the category for Wallpapers, navigate to find one you like that fits
    your current screen resolution. If you don''t know your current screen resolution,
    look'
