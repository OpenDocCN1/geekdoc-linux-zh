    \ |\n\nKNode (see Figure 6.8) is the kinder, gentler newsgroup client. Like most\
    \ KDE programs, KNode does the basic job but shows a nicer interface to do the\
    \ job in. KNode supports the news features that you need, including reading articles,\
    \ posting articles, threading, sorting, and using multiple news servers, along\
    \ with some decent support for attachments. This isn’t the power user’s news reader,\
    \ but it has everything that the casual news reader will want.\n\nThe interface\
    \ of KNode is very nice looking and blends in well with the KDE desktop and other\
    \ KDE programs. The interface isn’t completely customizable, but it has some well-thought-out\
    \ usability aspects. You can display attachments inline, configure fonts and colors,\
    \ and filter messages. KNode also lets you drag and drop between folders and groups.\
    \ Folders are stored in the common .mbox format, which is handy for importing\
    \ or exporting. KNode is simple and usable, without getting cluttered."
