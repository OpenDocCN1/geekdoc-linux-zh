- pgno: 84
  md: '# Nautilus in Browser Mode


    The browser mode of Nautilus (see Figure 2.13) is named as such because you can
    browse your files in a single window. Click on any folder, use the Up button on
    the toolbar, or double-click a file to preview the contents. All those actions
    happen in the same Nautilus window. You can think of it as browsing a book or
    magazine page by page.


    The layout of Nautilus in browser mode is a simple one, with a menu, toolbar,
    address bar, a left-side detail and navigation pane, and a right-side view pane.
    The menu bar and toolbar are easy to understand, with the menus containing basic
    options and the toolbar consisting of large, labeled icons. The Location bar is
    an address bar into which you can type any file location. Unlike Konqueror, Nautilus
    does not advertise itself as a Web browser as well as a file manager, but you
    can type Web addresses into the location bar. By default, Nautilus shows you the
    source code of the Web page you visit. You can change this behavior, but you are
    better off opening a Web browser. The left-side panel shows details about a highlighted
    file or folder, such as date and file type. You can use the Information drop-down
    list to choose other views for the left-side pane, including a tree navigation
    view. The main view pane on the right displays the contents of the folder you
    are in or the preview of a file’s contents.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_84_0.png)


    **Figure 2.13**

    Nautilus using the Browse File System option in the main menu.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Nautilus in Spatial Mode


    The spatial mode of Nautilus (see Figure 2.14) keeps everything separate in its
    own place, or space. This is the Nautilus way of displaying file management in
    an object-oriented way. If the phrase “object oriented” means nothing to you,
    don’t worry; it means a lot to programmer types. What the spatial mode in Nautilus
    means for everyone is that every folder opens in a separate window. Every file
    system, every device, and every folder is given its own space.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_85_0.png)


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_85_1.png)


    There are still lingering arguments in the Linux community as to whether spatial
    file management is a good thing. Some users maintain that they just don’t want
    all of those extra windows. Advocates argue that spatial file management is more
    intuitive for users, helps new users learn the Linux file system faster, and makes
    dragging and dropping files more convenient.


    The GNOME developers have made the new spatial experience more user friendly with
    certain details to help you know where you are in the file system:


    +   - Every new Nautilus window opens offset from, down and to the right of, the
    previous window (cascaded), to allow you to easily click on any open window in
    a series.

    +   - If you want to browse, you can access the Browse Folder option from the
    File menu or by right-clicking on any folder.

    +   - When any folder has an open window, the icon for that folder dims to indicate
    that the folder is open.

    +   - The title of the current space is always at the top of that Nautilus window.

    +   - Click on the bottom-right title on the status bar to see an expanded menu
    of the directory tree above the current directory.


    # UNDER THE HOOD


    # A TRASH CAN FULL OF ERRORS


    *Sometimes you can’t empty your trash because of permissions problems. You might
    have created a file or folder while you were logged into the terminal as the root
    user then tried to delete them*'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# “Out, damned spatial! Out, I say!”


    Although that isn''t the exact line from Macbeth, it is the sentiment of some
    GNOME users since Nautilus added spatial mode. Controversy, opinion, and argument
    still rage on whether Nautilus''s spatial mode is a good thing. If you don''t
    want to use spatial mode, the easiest thing to do is start Nautilus from the Browse
    File System choice on the main menu. If that isn''t permanent enough for you,
    there is another way to force Nautilus to always open in browsing mode. Open a
    terminal (if you find yourself afraid of commands and the terminal, skip ahead
    to familiarize yourself with terminal commands). Type in this command:


    ```

    gconf-tool -2 --type bool --set /apps/nautilus/preferences/always_use_browser
    true

    ```


    Log out of GNOME, and log back in. Nautilus will remain in browser mode. If you
    ever want to switch this back, just replace the word true at the end of the command
    with false.


    Nautilus has traditionally played catch-up to Konqueror. KDE zealots have touted
    Konqueror as the innovative leader of Linux file managers for years. With spatial
    file management and new uses for the Nautilus file manager beyond simple file
    tasks, Nautilus is becoming an innovator as well. If the spatial file management
    seems odd to you, try it for a while. Switch between spatial mode and browser
    mode in Nautilus until you find the best fit for how you think and how you work.


