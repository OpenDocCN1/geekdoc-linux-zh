- pgno: 352
  md: '**SSL**


    (Secure Socket Layer) Protocol for transmitting data securely over a network by
    using keys to encrypt the data during transport.


    **stream (or streaming)**


    A method for delivering multimedia content on the Web in which the client user’s
    browser only needs to download the content in small portions that are continuously
    delivered.


    **swap**


    File system space used to augment the main computer memory.


    **theme**


    Set of visual elements applied to a program’s interface to change the look of
    the program.


    **torrent**


    File type used by the peer-to-peer file-sharing program BitTorrent that contains
    pointer information to find other users who have the file you want to download.


    **Tourrette’s syndrome**


    Neurological condition in which the subject has uncontrollable shouts, grunts,
    facial movements, tics, and upper-body movement.


    **True Type font**


    Outline font type created by Microsoft and Apple that is the most popular font
    type in use.


    **unmount**


    See *mount*.


    **URL**


    (uniform resource locator) The unique global address system used for documents
    online.


    **usability**


    The practice of increasing the efficiency and enjoyment of experiencing a program
    or Web site for users.


    **USB**


    (universal serial bus) A type of port for connecting peripheral devices that is
    very fast.


    **user**


    You.


    **vcard**


    (virtual card) An electronic business card format often attached to e-mail messages.'
