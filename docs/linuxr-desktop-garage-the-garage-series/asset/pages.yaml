- pgno: 283
  md: 'Down below in the Grip window are the CD player controls. The Toggle Disc Editor
    button shows a pane for editing each track''s ID3 tags. You can use Initiate/Abort
    Disc DB Lookup to start and stop lookup for info about your CD online. Toggle
    Track Display shows the small, CD player view of Grip.


    # TOOLKIT, II:


    # Rip Your Elvis CD with Grip


    +   1. Grab an audio CD and put it in your computer. I am going to use *Elvis:
    30 #1 Hits*. I think there might be evidence on there about Elvis''s current location.
    With or without evidence, I know that I want I want a "Little Less Conversation"
    ripped to an MP3. That''s a cool song.


    +   2. Depending on your desktop environment defaults, you will probably have
    a CD player pop up automatically when you put in your music CD. Close that program
    and open Grip instead. The command is `grip`, or you can find it by going to your
    main menu and looking under **Multimedia** or **Sound & Video**.


    +   3. Wait a few seconds if you are online right now. Grip contacts the Disc
    DB online database to gather track information about your CD so that you don''t
    have to type it all in. If you are not connected to the Internet or your CD is
    not found, use the Toggle Disc Editor button to fill in track information on your
    own.


    +   4. Click the Rip column to check the boxes for every track on the CD in the
    Tracks tab.


    +   5. Move to the Rip tab and click the Rip+Encode button. Things get started
    right away. You can watch the progress on the indicators below the buttons (see
    Figure 11.3).


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_283_0.png)


    set fields for artist, song title, album, genre, year, and more. OGGs use a similar
    format called OGG tags.'
