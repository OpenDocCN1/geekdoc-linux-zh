    # Commercial Games


    Not many commercial games are available for Linux. Most game companies know that
    the majority of hardcore gamers are running Windows. A few game makers consistently
    release their big titles for Linux. Some small game companies also make games
    for Linux. The reality of the situation is that dedicated gamers looking for the
    latest releases and the big titles in Linux are looking in the wrong place. Commercial
    game titles for Linux tend to often be released later than the Windows version
    and do not get the same level of support when it comes to patches and bug fixes.
    Still, there are a few shining beacons of hope out there for Linux gamers.


    # Doom 3


    **Program Info**


    | Program URL | http://www.doom3.com/ |

    |---|---|




    id Software is your best friend when gaming in Linux — that is, if you like first-person
    shooters. Every id release is highly anticipated and sets the standard for new
    games in that genre. The great part is that id Software almost always puts out
    a Linux version for us. I’m not sure if the people at id Software are enlightened
    saints of game programming or if they realize that lots of Linux geeks are also
    the same geeks who spend vast amounts of time traggling strangers.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_315_0.png)


    **LINUX GAMERS**

    *Gamers are always a dedicated group of users, no matter which OS they use. Linux
    gamers have a few sites to keep tabs on for the latest news, articles, and help.
    The linux-gamers site*'
