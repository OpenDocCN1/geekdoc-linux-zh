- pgno: 153
  md: 'Table 4.2 How to Find Frequently Used Preferences in the GNOME Control Center
    (Continued)


    |  |  |

    | --- | --- |

    | **New fonts** | Installing new fonts is not in the Control Center but is easily
    done. Open **Nautilus**, type `fonts://` in the address bar (or use **File** >
    **Open Location** if Nautilus is in *spatial* mode), and then drag and drop **TrueType**
    font `.ttf` files into the directory. |

    | **Notification sounds** | Sound > Sound Events |


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_153_0.png)


    # Change GNOME Wallpaper, Theme, and Window Decorations


    Desktop wallpapers are all over the Internet for you to download. When you want
    a GNOME- or Linux-related image, you can head over to http://art.gnome.org or
    http://gnome-look.org. Besides wallpapers, you can download window control themes,
    window border themes, GDM (login manager) themes, icon themes, individual icons,
    tutorials, and more.


    Let''s download a wallpaper image to use. Then we can change the window border
    and control themes using some of GNOME''s already installed choices.


    +   1. Open a browser, such as **Mozilla**, GNOME''s default browser, and go to
    http://art.gnome.org.


    +   2. Click on the link for either Backgrounds > GNOME or Backgrounds > Other.
    Choose a background image that you like and download it. The background images
    on art.gnome are not arranged by resolution, so download one that is at your resolution
    or larger. If you don''t know your current screen resolution, look in the **Control
    Center** under **Screen Resolution**. Save the image to your computer somewhere
    you can find it, or create a folder such as `/home/{username}/MyLook/`. I''m choosing
    the one called Big Munchkey (Blue).


    +   3. Open the **GNOME Control Center** and click the **Desktop Background**
    icon.


    +   4. In the Desktop Background dialog box, click the **Add Wallpaper** button.
    Browse to the directory where you saved your wallpaper image, select the image,
    and click **Open**. Use the drop-down choice next to **Style** to choose the placement
    style that works best for that image. Click **Close** when you are done.


    +   5. Now we want to change the themes. In the Control Center, double-click the
    **Theme** icon. You''ll see a list of themes. Click any of them, and the theme
    immediately takes effect. Like one? Just click the **Close** button. Like only
    parts of a theme? You can mix and match by clicking the **Theme Details** button.


    +   6. To change the window controls theme, click any of the themes in the list
    on the **Controls** tab. The theme changes right away.


    +   7. To change the window border theme, use the list on the **Window Border**
    tab. Select different themes to see them applied.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '+   8. Click the Close button when you are done with the theme details. Back
    in the main Theme dialog box, your theme now is listed as Custom. If you want
    to save the current theme choices, click the Save Theme button. You can fill in
    a name and description for your custom theme. Click Close when you are done.


    +   9. Check out your new desktop, resplendent in its pulchritude—you know, pretty.


    Installing new window border and control themes in GNOME is easier than it is
    in KDE. All you need to do is download the compressed file from a Web site with
    GNOME themes, such as http://art.gnome.org or http://gnome-look.org. Open the
    Theme dialog box in the Control Center and click the Theme Details button. Go
    to the right tab for the type of theme that you downloaded and click the Install
    Theme button. Select your downloaded file, and you are done. You should see the
    new theme that you installed in the list on the appropriate tab.


    # Icons


    Most distributions try to design a nice icon set for the default desktop. You
    could use the default set of icons, but then you would be default. Default is
    mediocre. You don''t want to be mediocre, do you? Do you want to be mundane? Unexciting?
    I think better of you than that. I think you want to put your own personal stamp
    on every aspect of your desktop. We spend so much time in our desktop these days
    that we should make ourselves at home there. I might be badgering you, but I think
