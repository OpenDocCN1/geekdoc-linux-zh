- pgno: 71
  md: 'You can right-click empty areas of the panel to add new objects or to change
    the properties of the panel. You can right-click any panel object to go to the
    properties or preferences for that object.


    # The GNOME Menu


    Now let''s talk about that hat on the panel—*or foot, or star depending on which
    distribution you are in—otherwise known as the main menu (or the GNOME menu).
    This thing has more disguises and aliases than most seasoned criminals. The GNOME
    menu (see Figure 2.5) contains links to most of the programs that are installed
    on your computer. The programs are divided into categories. Fedora adds another
    layer of preference to the main menu categories. Within each category are first
    the programs that the distribution favors and then the rest of the menu items
    that fit the category; in a submenu. So, you get menu items that look like this:
    Internet > More Internet Applications. You can find most KDE programs and programs
    that you added later after install in the More submenus.


    A few of the main menu items are not squirreled away in submenus. These items
    are at the bottom of the main menu. The lineup of menu options at the bottom of
    the GNOME menu includes utility items that you might use often. That is why they
    are so conveniently located. Starting at the bottom of the menu, let''s go over
    the menu items.


    +   - **Log Out.** This logs out to the login manager screen, but it also gives
    you the option to shut down or restart the computer.


    +   - **Lock Screen.** This activates the screensaver and prompts you for your
    user password to turn off the screensaver.


    +   - **Recent Documents.** This lists recent documents you have opened. The list
    notoriously does not include many documents from non-GNOME programs.


    +   - **Search for Files.** This brings up a Search window to look for files using
    a variety of criteria.


    +   - **Run Application.** This opens a dialog box with a text field so you can
    run a program using its command. This is sometimes quicker than wading through
    menus and submenus.


    +   - **Network Servers.** This opens your file manager, Nautilus, to view other
    computers on your local area network (LAN).


    +   - **Help.** This starts the GNOME Help browser, in which you can read up on
    many help topics for different programs.


    +   - **Browse File System.** This opens your file manager, Nautilus, to your
    home directory in browser mode.'
