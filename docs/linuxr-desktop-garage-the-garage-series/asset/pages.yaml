    # Moving Windows Between Workspaces in GNOME


    Now that you have everything set up the way you want it, or at least know how
    to set it all up, you are ready to work with your desktops. You can switch back
    and forth at will, without needing to close any programs. Sometimes you might
    start a program or open a window in one workspace, and then decide that you would
    rather have it in another workspace. Moving things around is easy.


    To move a window from one workspace to another, right-click on the top window
    border, the part with the title of the window in it. If you follow the menu choices,
    you can see Put on All Workspaces, followed by choices to move the window one
    to the left or one to the right, or to move the window to different workspace.
    Put on All Workspaces can be useful for any task that you want to have span more
    than one desktop. If you choose to move the window to another desktop, you will
    see the window disappear. You can see the outline of the window in the Workspace
    Switcher for that desktop.


    # The KDE Pager


    In KDE, with the default panel, you will find the access to the virtual desktops
    also on the bottom panel, near the taskbar (see Figure 2.8). The appearance of
    the sections of the pager are not only shaded, but also numbered. Additionally,
    you can see a small outline image of each open window in the sections of the pager.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_75_0.png)


    With the more defined divisions of the KDE panel, by default, the pager is more
    apparent and easy to find. The pager works the same as the GNOME Workspace Switcher;
    just click the desktop that you want to switch to it.


    Now you need to be able to tweak all the settings for the virtual desktops to
    the way you want them—because tweaking things is fun. In KDE, the configuration
    for the pager is in the Control Center, K Menu > System > Configuration > Configure
    Your Desktop. Expand the Desktop section and choose Multiple Desktops.'
  merge: -1
  img_proc: true
