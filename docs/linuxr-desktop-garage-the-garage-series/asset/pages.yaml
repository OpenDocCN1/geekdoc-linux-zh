- pgno: 258
  md: '# 10


    # Instant Messaging


    and Chat


    I was sitting in my house thinking about the relationship between the dust bunnies
    in the corner of the room and the layer of dust particles on the TV screen. Some
    people might just think about cleaning so that the dust would be gone, but then
    there wouldn''t be multiple forms of dust to contemplate.


    Philosophically, the different forms of dust begged the question, which came first,
    the bunny or the particle? Did I even need to know that? Did I need to know anything?
    I was spinning out of control into a solitary epistemological trap. I had to discuss
    the bunnies, the particles, the existence with someone. I felt I had made a breakthrough
    in the previously nonexistent discipline of Dustological Empiricism.


    I immediately started talking to Josh, my fellow epistemologist in dusty matters.
    I elucidated my theory on how dust particles got lonely by themselves. They arranged
    themselves into layers on the TV screen to have someone to talk to, like a social
    club. Some dust particles in the layer got tired of the particles next to them.
    You can talk for only so long to the same dust particle before you get bored.
    The disquieted dust particles left the dust layer to form dust bunnies with other,
    like-minded particles. The new dust bunnies enjoyed travel and adventure, which
    explained how they rolled across the hardwood floor like tumbleweeds at high noon.


    I talked and talked, but he never answered. I tried enunciating my words, clarifying
    my thoughts. I mean, I know I was talking about dust bunnies, but'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'that doesn’t mean that he should ignore me. I was annoyed. Didn’t he even know
    I was talking to him? That’s when I realized that he wasn’t even in the same room
    that I was in. He couldn’t see me or hear me talking to him.


    Why would I talk to someone who isn’t even in the same room as I am in? Sure,
    it sounds like I am really stupid, until you realize that is how all the instant-messaging
    services on the Internet are set up. No one can see or hear anyone on a different
    service talking to them. Maybe. I have a Yahoo! account, and you have an MSN account.
    None of us can talk to one another.


    # ## Dustological Empiricism and Instant Messaging


    Instant messaging (IM) is sort of like e-mail, but, you know, instant. E-mail
    is clumsy for quick conversations. IM lets you talk to a friend knowing that he
    or she is online right now. You can have a conversation as immediate and natural
    as you might have by phone. Many IM clients even allow you to see when your friend
    is typing responses to you. There are several IM networks and clients to choose
    from. The two biggest IM programs for Linux, Gaim and Kopete, support all of the
    major networks.


    Who came up with a crazy system of different networks, and what were they thinking?
    Well, they are commercial companies, and they were thinking about money. Instant
    messaging first got popular on the America Online Internet service as a method
    for AOL members to talk to other members. The method got so popular that AOL started
    letting people outside the AOL network use the service as well. It was good advertising
    for them and a good selling point for their service. Of course, whenever anything
    works well, you get other companies copying it. There are now a myriad of instant-messaging
    services and programs. Among the most popular services are AIM, Yahoo!, MSN, and
    ICQ.


    There have been attempts to get these separate services capable of talking to
    one another, but the companies resist. AOL and Yahoo! announced plans to get together
    on a service that they intend to sell to businesses. Other than that venture,
    the closest you can get is to have an account on every service on which you know
    a friend has an account. Until the utopian future day when IM communications can
    be open, you’re just talking in different rooms.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# Striving For a Jabber Nirvana


    No very convincing technical reasons explain why companies cannot have their instant-messaging
    protocols talk to one another. The only real reason is good old-fashioned capitalism
    and competition. You can say good and bad things about that, but the one thing
    I will say is that it is all a little inconvenient.


    Everyone can use e-mail because there is a standard. You can send an e-mail to
    friends without having to think about what network or protocol they use. We all
    use the same method for e-mail. Instant messaging currently has no standard. That’s
    where Jabber comes in.


    Jabber is a free, open, public protocol based on streaming XML. Whether or not
    you know, or care to know, what that means, just know that it means that Jabber
    is free, open, and public. Anyone can legally write an instant-messaging client
    application that uses Jabber without getting letters from any lawyers. Anyone
    can run a Jabber server without fear of being told to cease and desist. We can
    have a variety of programs to choose from and still be able to talk to each other
    on the same network.


    Of course, that can happen only if we all help. In this case, one of the best
    ways to help Jabber, and to help create a standard, is to simply use the Jabber
    protocol and network. Get an account with Jabber, and get your friends and family
    to use it, too. When we create a standard, there will be a true free market for
    both the commercial companies and the open source developers. The instant-messaging
    client that will win the day will be the one with the best features and ease of
    use. Corporations can still show ads in the clients. Open source companies and
    developers can have the freedom to create new programs using the open, standard
    protocol. We can all get together and talk in the same room.


    Learn how to get online with a Jabber account with the Jabber User Guide, at http://www.jabber.org/user/userguide/.
    [ANNOUNCER]–Cue Music


    > This ends Susan’s Soapbox. I hope you’ll join us next time when we will talk
    about how Susan really hates it when the food on her plate touches the other food
    on the plate.


    # Gaim


    # Program Info


    | Fedora/GNOME menu | Internet > Gaim Internet Messaging |

    | Terminal command | gaim |

    | Program URL | http://gaim.sf.net |'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'No, I didn’t say AIM—I said Gaim. It’s no mistake that the name of this program
    sounds similar to the abbreviated name for the America Online Instant Messenger.
    Some clever person long ago said, “GNOME, GTK, those start with a G.” Then another
    person said, “America Online Instant Messenger, AIM, that sounds kinda nice.”
    What happened next? The moment was just like the fabled moment when the world
    was given the greatest invention in the history of candy, the peanut butter cup.
    Remember? That was when the guy who had the peanut butter and the guy who had
    the chocolate bumped into one another and smashed out a new candy sensation. In
    this case, the two guys were probably the same guy, one of the Gaim developers,
    and parts of his brain crashed together the G and the AIM. I hope he’s not injured.


    # ## What’s Groovy in Gaim


    Gaim is the GNU knife of instant messaging. With Gaim, you can talk to people
    on almost every available IM service and IRC (Internet Relay Chat—hang on, we’ll
    get to that) and still cut a tin can! If you have an account on any of the protocols
    that Gaim supports—AIM/ICO, MSN, Yahoo!, Jabber, Gadu-Gadu, Groupwise, Napster,
    and Zephyr—you can talk to anyone on those services by simply setting up your
    different accounts in Gaim.


    The program pulls in lots of the features that are in the IM clients that go with
    the supported protocols. In the Preferences, you can add AIM buddy icons to your
    view. There are special features for MSN and Jabber. You can also set sound options
    and away messages like those in Yahoo! and others.


    More significantly, Gaim combines those cloned features with its own bag of fun.
    My favorite is the tabbed windows. When you get more than one person talking to
    you on IM, your desktop gets cluttered with so many different little windows that
    you can’t keep track of who talked when. Another very cool option when you use
    Gaim is the capability to use plug-ins. These work similarly to browser plug-ins,
    or extensions. Most of the available plug-ins installed by default are practical
    utilities such as Auto Reconnect and Message Notification. Other plug-ins and
    additions written by other developers for Gaim include gaim-festival (see http://festival-gaim.sourceforge.net/),
    to get all of your messages spoken out loud using the Festival Speech Synthesis
    System.


    The layout of Gaim is simple (see Figure 10.1). If you’ve used any of the big
    three IM clients—AIM, MSN, or Yahoo!—things will look familiar to you. There is
    one main window with view options for groups, offline buddy viewing, icons, and
    toggling of toolbars from view.'
