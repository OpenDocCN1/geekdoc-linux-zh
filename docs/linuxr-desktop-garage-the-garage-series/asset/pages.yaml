- pgno: 39
  md: '# Back Up Your Life


    I am constantly surprised that so many experienced computer users do not regularly
    back up their data and files. I might be a little bit of a backup Nazi, but it
    is only because I know how easy it is to have all your files one day and then
    have an inaccessible hard drive the next.


    I have everything digital. I ripped all of my music CDs to digital files. I pay
    bills online. I no longer know what sticky notes are. All the family photos are
    scanned in. I blog the events of my life on a Web site. I think my dog might even
    be digital. More and more, we are moving the documents of our entire lives over
    to our computers. Aren’t those things important enough to back up?


    The whole process needs to take you only fifteen minutes at the beginning of every
    month. Just copy everything that you value onto a rewritable CD, a Zip disk, a
    CDR, another computer in your house, an online service, or anything else you can
    use.


    # Steps for Dual-Booting with Mac OS


    +   1.  **Back up everything**. If you are not the kind of person who regularly
    backs up your data, start now. Hard drives can crash. Power lines can surge. Computers
    lose things. Especially back up any of your data from Mac OS before beginning
    this process.


    +   2.  **Plan the partitions**. If Mac OS is already installed, it’s going to
    have to be reinstalled. There is no easy way to resize an existing Mac partition.
    When you go through the install of Mac OS, a screen for creating partitions appears.
    Leave the intended Linux space as just free space. If you can, remember to give
    Linux at least 5GB, just so that you have room to play with.


    +   3.  **Install Mac OS first**. Just as with Windows, Mac OS wasn’t expecting
    to share you with any other OS, so there isn’t an option for anything such as
    a boot loader. Mac OS takes over the MBR.


    +   4.  **Start your Linux install**. Read up on the details in the following
    installation section. While moving through the installer screens, pay attention
    to what device the partitions are on; write them down, in case any of the OS partitions
    are not properly detected (for example, Mac OS on /dev/hda1 and the Linux root
    partition on /dev/hda3).


    # CD BOOT


    Your computer might not be set up to boot from a CD. If it is not, on PCs, you
    need to go into your BIOS to change the boot device order. On most systems, you
    press Delete, F1, or F2 to enter the'
  merge: -1
  img_proc: true
- pgno: 40
  md: '5. Set up the boot loader. A program called Yaboot is the most likely option
    for your boot loader. Follow the directions to set up the labels and default OS
    to boot into. The choices automatically are detected for you, but you can add
    or edit if something is missed.


    # # Sharing Files Between OS Partitions


    When you dual-boot your system, having access to the files on your other partitions
    from within Linux can be helpful. This is a one-way street, though. Linux can
    see Windows partitions, but Windows cannot see Linux partitions. I think there
    is some denial going on there.


    Sharing the Windows partition with Linux is not a clean way to do things. Headaches
    are involved with mounting the Windows partition so that it will be writable for
    your regular user account. In addition, when mounting your Windows partition as
    writable, you run the risk of deleting or moving files that Windows needs. When
    sharing files with your Windows partition, you need to be aware of what you are
    doing and always keep backups.


    A cleaner way to share files between Linux and Windows or Mac OSX is to have a
    third (you can think of it as the middle) partition on your system to serve as
    the sharing space. The size depends on what you want to do. I share the 5GB of
    MP3s that I have between two OSs. Determine how much space you need for the data
    that you will want to share, and create the partition.


    If you are running Linux on a Mac, the options for viewing a MacOS partition from
    Linux are a little complex for new users. The options to both read and write to
    your Mac partition are even shakier. Even though OS X is UNIX based, the two OSs
    and file systems do not play well together. Keep an eye out online. Every problem
    gets solved eventually in the Linux community.


    # # A Few Installation Notes


    The installation of Mandrake and of Fedora is easy. You just boot off the first
    install CD, answer a lot of questions about your system and your preferences,
    make some choices, and wait, watching the progress tick away.


    You might be a little nervous about installing any operating system. Don''t worry.
    As long as you have backed up any data you might need, there isn''t much for you
    to mess up. If you do think that you have messed up, just start over: There will
    be no harm done. You might look at this section and feel your


    BIOS (just look onscreen for a prompt of what key to press). Follow the directions
    in your BIOS to find the boot device section and make sure that your CD-ROM drive
    will boot before your hard disk. On newer Apple hardware, you just hold down C
    to boot from a CD.'
  merge: -1
  img_proc: true
