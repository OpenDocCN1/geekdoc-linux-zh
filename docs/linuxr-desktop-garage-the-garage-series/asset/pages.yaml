  md: '![](img/f2b5f4073f00f9ec5546d9acb9cc6448_330_0.png)


    # # Running Windows Applications


    I work in the downtown section of a medium-size city. Sometimes leaving work and
    walking down the street is a gauntlet of entreaties and demands. I dodge petitioners
    asking for my signature. I slide past street preachers working to save my soul.
    Up ahead I can spot donation seekers lying in wait. This is the everyday challenge
    of the modern American city dweller. Sometimes the sights and characters can be
    entertaining, and even perplexing, enough to make the inconvenience worthwhile.


    One day I saw a street performer of such enormous talent that I stood speechless
    in the reflected glow of her genius—well, actually, I stood stifling a giggle
    and moved to where I could watch her less obviously.


    The older woman sat across from the square downtown on the busy corner with the
    Nordstrom''s store and the Starbucks. She knew how to pick her corners. She was
    dressed in a bevy of multicolored scarves. Her musical accouterments included
    one old transistor radio, which sat in front of her on the brick sidewalk with
    antenna at attention. There were two containers also in front of her with scattered
    change in them. I''m not sure why there were two. Large bills in one and small
    change in the other? One for domestic currency and one for foreign? Complimentary
    tips in the red plastic bowl and disparaging tips in the blue plastic bowl?


    Her piece de resistance, the thing that really made her act, was a plastic toy
    electric guitar. The white guitar and colorful buttons gleamed in the muggy afternoon
    haze. That afternoon was begging for her magical sound to tear'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'open the mundane atmosphere. Her little transistor radio hissed static and
    strained for reception of a station, any station, to accompany the woman—no, the
    artist. The guitar''s buttons along the neck each corresponded to a preprogrammed
    guitar solo, engineered to sound like famous rock song interludes with all of
    the flavor, melody, and familiarity stripped out. The radio grabbed on to a song
    and held the reception. The performer raised her instrument to get ready. I knew
    something wonderful was about to take place. The tension was high. The anticipation
    was great. She waited for the appropriate place in Journey''s “Separate Ways”
    and then performed her magic.

    She hit the blue button.


    An anemic guitar riff punctuated Steve Perry''s yowling. I stood still and silent
    as the magnitude of her artistry washed over me in acoustic waves. How did she
    know the right moment? How did she choose the blue button when any amateur would
    have gone for the purple button?


    She was a performer. She was a rebel. She was not worthy of any tips.


    I mean, come on, sarcasm aside, was that a performance? Was it music? I suppose
    it is not up to me to judge what is music or what is art, but my sneaking suspicion
    is that substitution is the best word to describe that performance. She had no
    real electric guitar. She used a substitute to try to get a similar effect and
    experience.


    I can''t help but think of that woman and her white plastic guitar when I use
    a Linux program to open a Windows application. When you use other programs to
    simulate a different operating system like that, you are also substituting. I''m
    not saying you can''t do this. You clearly can run Windows applications in Linux
    with relative ease, depending on the program. I''m not saying that you shouldn''t
    do this: Sometimes you need a particular Windows app when you are working in a
    world full of Windows users. I am, however, taking my soapbox moment to ask you
    to try to learn to like native Linux programs before you use Windows programs
    as the transitional crutch. Although you have the ability to run Windows programs
    in Linux, it''s not always the easiest task.


    # Wine


    Program Info


    | Terminal Command | wine [program_or_exe_name] | Program URL | http://www.winehq.org
    |

    |---|---|---|---|


    Wine is not an emulator! Wine is not an emulator! Say it again with me—okay, don''t.
    We can stop now. They are pretty adamant about that whole “not an'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'emulator" thing over at the Wine camp. I imagine a scenario like you would
    find in Orwell''s *1984*. I say in a hushed whisper, "Wine is an emulator." Then
    there is a knock at the door. The men come to take me away to Room 101.


    Wine is a compatibility layer between Linux and Windows. You don''t need a copy
    of Microsoft Windows to run a program through Wine. Wine creates an alternative
    application program interface (API) that runs on top of Linux and uses no Windows
    code. Windows programs can run with this alternative API, similarly to how they
    run on the Windows API. The Wine developers say that Wine is still under development
    and isn''t ready for general use yet. Still, Wine is probably the most well-known
    program in Linux right now for running Windows programs and is widely used.


    Wine is often included with your distribution''s install disks. You can either
    install Wine from the install disks or download the program from the WINE Web
    site. Make sure you get the very latest version available for your distro. Each
    new version of Wine usually has important improvements. (The Wine Configuration
    screen is shown in Figure 13.1.)


    The easiest program to try first in Wine is Microsoft Notepad. Remember the plain-text
    editor in Windows? That''s the one. Some versions of Wine even install the Windows
    programs Notepad and Minesweeper for you to try. To find out what other programs
    have been run in Wine, check out the applications database at http://appdb.winehq.org/.
    The programs listed have not necessarily been run successfully in Wine, but the
    database lets you know how well each program has been reported to run and includes
    user comments.


    # Figure 13.1


    The Wine setup wizard.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_332_0.png)'
  merge: -1
  img_proc: true
- pgno: 333
  md: 'Wine requires a Windows C: drive, or at least a fake version of it. The usual
    location that Wine creates for the C: drive is `/home/username]/.wine/fake_windows`.
    This location can be different, depending on the package or source you installed
    Wine with. To install Windows programs to run in Wine, you need to run the Windows
    installer for the program in Wine, which is often on your Windows program’s CD.
    When you get the installer to run and finish, you use the program’s executable
    file (.exe) to run the program.


    Now I think I can say that I have gotten a Windows program to run in Wine without
    a hitch only once or twice. Remember, Wine is a work in progress. Most programs
    require tweaking to run, and many programs simply will not run. When you run into
    problems, read up on the program in the Wine application database to see how other
    users got the program to run. Quite often the solution to getting a program to
    run in Wine is to install the program in Windows and then copy over the executable
    file and .dll files to the Linux directory for that program in Wine.


    Now do you see why I warned you? Don’t worry, there is at least one other solution
    that is easier than Wine. You probably don’t want to mess with Wine unless you
    enjoy tweaking and problem solving. If you’re looking for something to use in
    a professional office environment, Wine probably isn’t ready. Wine is one of those
    Linux issues that can be a pain to work with but you feel like you’re helping
    a good cause. So, if you are the tweaking type, you can help make Wine easier
    to use and more dependable in the future by working with it and reporting your
    experiences in the applications database.


    # CrossOver Office


    **Program Info**


    | | Terminal Command | wine --cx-app [program executable] |

    | | | (CrossOver Office usually creates menu shortcuts that are better to use.)
    |

    | Program URL | | http://www.codeweavers.com/site/products/cxoffice |


    CrossOver Office is the kinder, gentler implementation of Wine. CrossOver is a
    commercial program that is based on Wine. You can run specific Windows programs
    that the makers of CrossOver Office, CodeWeavers, have tested. You can use CrossOver
    to get browser plug-ins to work with most browsers. You can also use the program
    as an additional way to install TrueType fonts. The program was originally focused
    on getting Microsoft Office programs to run under Linux, thus the name.'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'CrossOver installs and runs Windows programs through a nice, very simple GUI
    interface. The usability difference between this program and regular Wine is vast.
    Besides the Microsoft Office programs, CrossOver Office can run many popular Windows
    programs, including these:


    +   - Adobe Photoshop

    +   - Microsoft Outlook

    +   - Microsoft Internet Explorer

    +   - Windows Media Player (version 6.4, but newer versions are being worked on)

    +   - Lotus Notes

    +   - QuickTime

    +   - Dreamweaver MX

    +   - Flash MX


    You can try programs that are not included in the supported application list,
    but they might not run; you just have to wait and see. Someone even got iTunes
    working in CrossOver Office. When you stick to the supported applications list,
    you do need to reconcile yourself to the fact that supported versions of popular
    programs usually lag a version or two behind the latest Windows versions.


    Unlike most Linux programs, CrossOver isn’t free. You can download a trial version
    from the CodeWeavers Web site at http://www.codeweavers.com. The program runs
    so well and is so easy to use that it is well worth the price if you are someone
    who absolutely needs to run Windows programs in Linux. You can look over the list
    of supported applications at http://www.codeweavers.com/site/products/cxoffice/supported_apps/.
    Each application is rated and has a forum associated with it, a list of known
    issues, and tips.


    Using CrossOver Office is surprisingly easy. From installing programs to running
    programs, you rarely encounter any hicups, as long as you stick to the supported
    programs list. CrossOver can dependably be used in a professional environment.
    You can even choose between a Standard and a Pro version, with the Pro version
    including more support.'
  merge: -1
  img_proc: true
- pgno: 335
  md: "316\n\n# Win4Lin\n\n# Program Info\n\nTerminal Command: win or fwin  \nProgram\
    \ URL: http://www.netraverse.com/products/win4lin50/\n\nThe big claim of Win4Lin\
    \ is speed. The program doesn't start a virtual machine, but instead runs a DOS\
    \ environment by translating Windows operations to Linux operations using hooks\
    \ in the kernel. W4L is definitely a program for the more experienced Linux user,\
    \ but its speed claim is justified. I admit to not being someone who enjoys patching\
    \ the Linux kernel, but I have gotten Win4Lin working with a fair amount of tweaking\
    \ and swearing. When the program is installed and working, running Windows is\
    \ pretty easy. Because a copy of Windows is running, getting your favorite Windows\
    \ programs to work isn't too hard.\n\nThere are limitations to Win4Lin's speed\
    \ demon approach. With DOS running, you can use only Windows, 95, 98, or Me. They\
    \ are working on supporting newer versions of Windows, but I'm sure that requires\
    \ great changes to the program. You need a copy of Windows to install, and, yes,\
    \ you should have a legal copy of Windows. If you are a person who tends to update\
    \ the Linux kernel yourself, you are dependent on the company that makes Win4Lin,\
    \ NeTraverse, for kernel updates to keep running Win4Lin. One of the bigger limitations\
    \ in Win4Lin is that the program lacks DirectX support. This means no games or\
    \ multimedia applications for you with W4L. Finally, and that might not be a limitation\
    \ as much as it a consideration, Win4Lin is a commercial program that you have\
    \ to buy.\n\nOn the bright side, besides the speed with which Win4Lin runs, you\
    \ can count on the program to reliably run many Windows programs. Supported programs\
    \ include these:\n\n+   - Microsoft Office\n+   - Adobe Photoshop\n+   - Dreamweaver\n\
    +   - Adobe Illustrator\n+   - Lotus SmartSuite\n+   - Internet Explorer\n+  \
    \ - Norton Anti-Virus\n+   - Adobe FrameMaker"
  merge: -1
  img_proc: true
- pgno: 336
  md: 'Win4Lin also supports sound playback and Windows networking. With the graphical
    installer, speed, and reliable performance, W4L is a good program for moderate
    to advanced Linux users.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_336_0.png)


    # Message for the Man in the Ten-Gallon Hat


    If you are standing in the middle of a Starbucks in the suburbs of Oregon in a
    giant cowboy hat, a western shirt covered in shiny pearl snaps, a giant belt buckle,
    and pointy little boots, I have to laugh at you. What are you pretending? The
    stern cowboy look on your face isn’t helping. You’re still a man chasing an image
    and playing dress-up. How can anyone take you seriously when you use a giant white
    hat to try to project who you think you are?


    Dude, listen to me. There are no cows in the shopping center. There is nothing
    to wrangle in the Target parking lot. There are no little doggies or tumbleweeds
    in the Barnes and Noble bookstore.


    Try to deal in the reality you and your big belt buckle are now standing in.


    # VMware


    # Program Info


    | Terminal Command | Program URL |

    |------------------|-------------|

    | vmware           | http://www.vmware.com/ |


    VMware is an emulator. We can say that now and not fear the Orwellian men at the
    door. This program is definitely more aimed at professionals, with its high price
    tag, VMware is not just for Linux. VMware is a virtual machine that will run many
    operating systems on many different operating systems. So, for your $199, you
    can do whatever you want to—run Windows on Linux, run Linux on Windows, run cattle
    across the prairie.


    This is a program aimed at software developers who need to test their works in
    progress on different operating systems, but regular desktop users can certainly
    use it. To install VMware, you need a powerful computer that meets the demanding
    system requirements. You also need to recompile your Linux kernel while setting
    up VMware. If you plan to run Windows, you need to have your own licensed copy
    of Windows.'
  merge: -1
  img_proc: true
