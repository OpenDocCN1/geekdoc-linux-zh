    Calc is the free alternative to Microsoft Excel. Now, most frequent Excel users
    are very informed about financial functions. OOO Calc meets and exceeds the bar
    set by Excel to such a degree that the money people should look at the price comparison
    between free and complicated licensing scheme and never look back. Calc is a great
    spreadsheet program with a wide range of functions to choose from, good customizing
