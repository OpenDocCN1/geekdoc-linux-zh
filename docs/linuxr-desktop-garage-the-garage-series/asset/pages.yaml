- pgno: 156
  md: '# Finding and Creating New Icons


    You can never have too many icons. Although both KDE and GNOME come with lots
    of good icon choices, you will have to look online to find more unique icons.
    There are lots of Web sites for icons, including the same great sites we looked
    at for themes, kde-look.org and art.gnome.org. You can find icons on non-Linux
    Web sites as well. Good sites such as [http://www.deviantart.com/](http://www.deviantart.com/)
    and [http://www.wincustomize.org/](http://www.wincustomize.org/) have mostly Windows
    icons, but you can grab them for use in Linux as well. The Links section at the
    end of this topic has more URLs for desktop customization sites. Just download
    any file and then convert it to a `.png` file to use it as an icon.


    To create icons in Windows, you have to use programs that will work with the special
    `.ico` file type. To create icons in Mac OS X, you have to use a special file
    type as well. To create icons in Linux, you don’t need any voodoo—just a graphics
    editor. Most icons in KDE and GNOME use the png file type. Unlike `.ico` files,
    PNG files are common and can be created by most graphics editors. When creating
    your own icons remember a few general rules of thumb:


    +   - Keep your image square.

    +   - Size your image as 32 × 32 pixels or 45 × 45 pixels, for the most flexibility.

    +   - Make the surrounding space of your icon transparent.

    +   - Keep the image simple. Complexity doesn’t come through well in such a small
    image.


    # Fonts


    Fonts used to be one of the big “issues” in Linux. You couldn’t tell anyone that
    Linux was ready for the desktop while they were making faces at the weird, jagged
    fonts on your screen. I made those faces, too. A few versions back, we got the
    ability to use TrueType fonts and antialiased fonts. No one makes faces anymore.


    The default fonts that come on most Linux distributions are much nicer than they
    used to be. The fonts in the Lucida and Nimbus families can be used in place of
    a favorite sans serif font such as Arial. In addition to the Linux font families,
    you can download fonts from the Internet to use in Fedora and Mandrake. Download
    almost any .ttf font file (.ttf files are usually Windows fonts) and then install
    it.


    ```

    start the detective search for the main menu icon image file are these:

    Fedora: `/usr/share/icons/Bluecurve/48x48/apps/gnome-main-menu.png`

    Mandrake: `/usr/share/icons/mandrake.png`

    Alternatively, you can search for the filenames to find out what super-secret
    place they are hidden in

    ```'
