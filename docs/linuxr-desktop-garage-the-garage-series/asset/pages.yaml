    Adding a contact in Evolution.


    # # KDE-PIM Suite


    The KDE-PIM Suite is the collective name for the individual programs that handle
    functions that traditionally fall under the term “personal information management.”
    Whereas Evolution is one program with many components, each part of the KDE-PIM
    Suite is a standalone program. One new member of the PIM suite is Kontact, which
    is a container program that allows all the individual programs to be accessed
    as one, similar to Outlook and Evolution. Because the PIM suite programs can still
    be accessed and used separately, that is how we will go through them.


    # ## Kontact


    **Program Info**


    | Terminal command | kontact |


    | Program URL | http://pim.kde.org/ |


    Kontact groups all the components of the KDE-PIM Suite into one easy-to-use interface.
    The PIM programs used to be a collection that sorta, kind of worked together as
    one in a clumsy way. Kontact brings most of the PIM functions together smoothly.
    Kontact even has the component buttons running down the left side of the window,
    as Outlook and Evolution do. This program makes access to groupware functions
    much easier and features a Summary screen.


    Kontact links to the Summary component (see Figure 7.7), Mail (KMail), Contacts
    (KAddressBook), To-Do List (the to-do portion of KOrganizer), Calendar (KOrganizer),
    News (KNode), and Notes (KNotes). The Summary screen only lets you customize the
    weather, but otherwise Kontact makes using the KDE-PIM Suite a better experience.'
  merge: -1
  img_proc: true
