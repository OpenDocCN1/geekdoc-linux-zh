    5. To complete adding your task, click Save in the task window toolbar.


    # The Contacts


    Most e-mail programs have an address book or contacts function. In Evolution,
    by default, the Contacts component (see Figure 7.5) is organized like an old Rolodex,
    with individual contacts made to appear like index cards. You will find Evolution''s
    Contacts function to be similar to other address book programs and very easy to
