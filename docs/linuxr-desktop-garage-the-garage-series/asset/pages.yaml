    +   6.  Right now you have a program. You can run it from the directory you are
    in.

    +   However, the program is not available in your system as a command. To make
    it a command, you need to do one more thing:


    ```

    # make install

    ```


    +   7.  Now you have installed the program from source. You can get out of this
    directory and clean up everything by deleting the compressed file and its resulting
    directory. You should be able to type elapse at your command prompt to run the
