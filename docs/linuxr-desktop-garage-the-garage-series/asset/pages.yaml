- pgno: 284
  md: 'By default, Grip puts your new MP3 files into /home/[username]/mp3, or sometimes
    /home/[username]/ogg, even though it saves the files as MP3s. You can adjust the
    location files are ripped to in Config > Encode > Encode File Format. In this
    field, you can also change the filename scheme. The text in that field uses switches.
    You can view a list in the Grip help docs. Some common options are %A for Artist,
    %d for disc title, %n for the name of the track, and %t for the track number.


    7. The CD ejects when Grip is done.


    Ripping CDs can hog a lot of your system''s memory and processor resources, so
    you might want to step away from the computer and read the liner notes or something
    while you wait. Take a look at the resulting files that you ripped to MP3s to
    see if you like the directory location and filename format. If you have trouble
    encoding your files, look in Config > Encode > Encode File Format at the encoder
    being used. You might not have the selected encoder installed. You can obtain
    most of the encoders in the drop-down list by looking up the name in that list
    as a package name to install using your favorite method of installing new software.


    # Rhythmbox


    | Program Info | |

    | :--- | :--- |

    | Fedora/GNOME menu | Sound & Video > Music Player |

    | Terminal command | rhythmbox |

    | Program URL | http://www.rhythmbox.org/ |


    Someone liked Apple''s iTunes a lot, so that person made Rhythmbox. In some circles,
    that might be construed as stalking, but with open source software, it''s more
    of a tribute. The program has a layout very similar to iTunes, with browsing panes
    in the window and a Sources column. If you are used to iTunes, don''t expect too
    much; Rhythmbox isn''t the same. It is sort of like iTunes on vacation, with only
    the most basic playback and playlist functions available. Rhythmbox is, however,
    my favorite player in Linux right now because I like being able to browse my music
    in its Library view and easily set up playlists. I enjoy those functions more
    than I need pretty visualizers and interesting application skins.


    Upon first running Rhythmbox, you go through a wizard to add your music files
    to your music library. You can skip the step if you would prefer to add your music
    later. To add your music now, navigate to the directory your music is in and add
    it. Fedora users have a hitch in the process: You might not have MP3 support in
    Rhythmbox yet. Check out ToolKit 11.2 to add support for that file type.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# **TOOL KIT, 11.2:**


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_285_0.png)


    # Add Mp3 Support to Rhythmbox in Fedora


    Fedora doesn''t include MP3 support in any of the players included with the distribution;
    a company named Thomson has claimed licensing rights to the MP3 format. Many companies,
    including Microsoft, NullSoft (the makers of WinAmp), and Apple, have acknowledged
    this claim and paid licensing rights. Red Hat and Fedora prefer to ship their
    distro with only software that complies with the General Public License; they
    do not include MP3 support because the format is not under the GPL. Half of all
    of our brains says, "Good for you, Fedora! Way to stick to your principles." The
    other half of our brains says, "@65%#! Now how do I make that work?!"


    A group at http://rpm.livna.org maintains a repository of missing and helpful
    files for Fedora. URLs change with time, so if the URLs we talk about here stop
    working, go to http://www.fedorafaq.org to find out how to add MP3 support. Let''s
    go over this using Apt. If you have chosen to use yum for updates, the steps are
    mostly the same:


    +   1. Log in to your terminal as the root user and then edit the Apt sources
    file:


    ```

    ```bash

    # gedit /etc/apt/sources.list

    ```

    ```


    or


    ```

    ```bash

    # kate /etc/apt/sources.list

    ```

    ```


    +   2. Add the new sources to your list by adding these two lines:


    ```

    ```bash

    rpm http://rpm.livna.org/ fedora/2/i386 stable unstable testing

    rpm-src http://rpm.livna.org/ fedora/2/i386 stable unstable testing

    ```

    ```


    (Those are the Fedora Core 2 repositories on livna.org. Check the page at http://rpm.livna.org
    for other Fedora releases.)


    Save the file and close your text editor.


    +   3. Update Apt so that the new repositories are included:


    ```

    ```bash

    # apt-get update

    ```

    ```


    +   4. Install the GStreamer package that Rhythmbox needs for MP3 support:


    ```

    ```bash

    #apt-get-install gstreamer-plugins-mp3

    ```

    ```


    This package also installs the other package that you need, libmad.


    +   5. Open Rhythmbox, and you should be ready to go.


    +   6. As a last step, you might want to open the sources.list file again to either
    delete or comment out those two new repositories. (Comment them out by placing
    a # in front of each line.) You can keep them handy for any future packages that
    you might want to install or update from that group, but you shouldn''t include
    those repositories if you perform a dist-upgrade.'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'Rhythmbox is set up in a simple three-pane layout (see Figure 11.4). On the
    left is the Sources column, with access to the library view, to streaming locations
    in the Radio view, and, after you have created some, to views of your playlists.
    The Artists pane is a list of all the artists of the files you have added to your
    library. The artist information is gathered from each file''s ID3 or OGG tag.
    The Album pane lists each album from the tags of your music files. The Tracks
    view, below the artists and albums, shows the tracks that match the criteria from
    the Artists selection, Albums selection, or search criteria. Up near the toolbar,
    you find a volume control, a Search box, and a track progress slider.


    # Figure 11.4


    Rhythmbox''s Library view.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_286_0.png)


    # TOOL KIT, 11.3:


    # Import MP3 Files to Create a Playlist in Rhythmbox


    # Import the King


    +   1.  Open Rhythmbox and then go to **Music > Import Folder**. You can also
    press **Ctrl+O**.

    +   2.  Navigate to the directory you want to import files from. Our new MP3 files
    that we ripped in ToolKit 11.1 are in `/home/user/music/mp3/`.

    +   3.  Select the directory and click **Open**.

    +   4.  That''s it. You can now view the files in the Library view.


    # Create a Playlist


    +   1.  In the menu bar of Rhythmbox, go to **Music > Playlist > New Playlist**.
    You can also press **Ctrl+N**.

    +   2.  In the Sources column, on the left, you see your new playlist and an empty
    text box for naming it. I''m naming mine Elvis Pantes. Notice that the right side
    of the Rhythmbox window switched from the regular browsing layout of the library
    view to an empty list.

    +   3.  Let''s fill up that empty list. Go back to the Library view by clicking
    **Library** in the Sources column. Use the browsing functions to find the songs
    you want to add to the playlist.'
  merge: -1
  img_proc: true
