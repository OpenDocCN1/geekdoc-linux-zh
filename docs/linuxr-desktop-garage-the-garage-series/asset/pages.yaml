- pgno: 345
  md: '**AVI**


    (Audio Video Interleave) A multimedia file type used to store video and audio
    information, often used to compress movie files.


    **boot**


    To load the software that starts a computer.


    **boot loader**


    Program used to load the operating system into a computer’s memory when the computer
    is booted.


    **broadband**


    Transmission type for data that can carry multiple channels at the same time,
    used to identify Internet access types such as cable and DSL.


    **codec**


    (compressor/decompressor) Method for compressing and decompressing data, often
    used in relation to video and audio files.


    **compile**


    Act of transforming program source code into object code. Source code is written
    by programmers. Object code (with a linker) is executed as a program.


    **conduit (as related to PDA)**


    A channel for transmitting data between a PDA handheld computer and your PC.


    **cookie**


    A file placed on your computer by some Web sites through your browser that contains
    data, often used to store user information.


    **CSV**


    (comma-separated values) A format for data in which each value is separated by
    a comma.


    **daemon**


    Similar to a system agent or service, a background process that responds to specific
    events.


    **desktop environment**


    The graphical representation of your file system, with related tools. Examples
    of a desktop environment for Linux include KDE, GNOME, Fluxbox, Blackbox, and
    Enlightenment.


    **DHCP**


    (Dynamic Host Configuration Protocol) Protocol for assigning addresses on a network
    automatically. This makes networking easier with the software tracking IP addresses
    and allows you to easily add a new computer to a network.


    **directory**


    Representation of an object used to hold and organize multiple files in an operating
    system.'
  merge: -1
  img_proc: true
- pgno: 346
  md: 'Microsoft API developed to easily access hardware features, often referred
    to in relation to graphics-intensive programs such as games.


    An exact copy of a hard drive or file set.


    Collection of programs, including the Linux kernel, that can be installed together
    as an operating system.


    (domain name system) Service that translates domain names into IP addresses on
    a network.


    Program to control a device by translating between the device and the programs
    that use the device.


    (digital rights management) System for protecting copyrights on data by limiting
    access to that data.


    Broadband Internet service type in which data is carried over copper wires, usually
    a subscribed service through telephone companies or Internet service providers.


    Setting up a computer to boot either of two operating systems on the same machine.


    (digital video disk) Optical disk similar to a CD-ROM, often used for movies.
    Also now used for data storage because of its greater capacity.


    Graphical representation of the category or type of a file or folder in a file
    manager, usually by an icon.


    (emotional icon) Series of keyboard characters used to show emotion, often used
    in Internet chat, instant messaging, and e-mail.


    A program designed to imitate another program or operating system.


    (file allocation table) File system type used in older Windows operating systems.'
