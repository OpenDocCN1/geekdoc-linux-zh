    # ## Graphical Installers


    In Mandrake and Fedora, you use the *graphical installer* by default. There are
    text-only install options, but you probably will not need them unless there is
    a problem with something such as *detection* of your video card. For the most
    part, using the graphical installer is easier for you than that first time you
    kicked a small boy, knocked him down, stole his lunch money, and laughed. That
    might have been just me who did that, though.


    The graphical installer consists of screens with simply laid-out choices and a
    *Next* button at the bottom of each screen. Fedora''s installer is called Anaconda.
    Mandrake''s installer is called *DrakX*. Both *Fedora* and *Mandrake* have Help
    options on every screen. Other distributions, such as SUSE and Yellow Dog, use
    graphical installers as well. If you are installing one of these other distributions,
    you will find the screens to be easy and set up similarly to those used by Fedora
    and Mandrake.


    > **Write It Down**

    > You should grab information on the brand and model of your video card and monitor
    before you start up the Linux installer. Write the information down in case the
    autode- tection in the installer does not correctly detect these devices.


    As you go through the choices in the installer, just *read* each section care-
    fully to make sure that you are not blindly choosing the default when you should
    not. Consult the help section if you are not familiar with certain terms or if
    you feel confused. I next go through a general description of most of the steps
    you are going to encounter.'
