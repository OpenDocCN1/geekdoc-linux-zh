    OpenOffice.org Writer is one of the two main anchors of the OOo office suite.
    Writer is a great program that can live up to the expectations of MS Word users
    most of the time. The only places where Writer might be said to fail are really
    not failures as much as differences in the tools of the programs. Writer is a
    sophisticated word-processing program with many basic text- and paragraph- formatting
    options, tables, the capability to embed images, styles, and good document-layout
    features.


    You can use Writer for more complex duties than simple letter or document word
    processing. You can work collaboratively with the versioning system that allows
    for changes to documents to be accepted or rejected. Autocorrection has strong
    choices in its settings to correct most minor typing mistakes. You can also mark
    spelling and grammar mistakes as you type. Documents can use database merging
    for form letters and addressing. There are also indexing functions for navigating
    long documents.


    I like using the program, but a few aspects of OpenOffice.org Writer still bug
    me. Some fonts will display oddly in Writer, even though they display smoothly
    in other programs. Table creation and editing work all right but are kind of awkward.
    The Stylist handles document styles created or edited in Writer quite well, with
    some style features more usable than they are in MS Office, but the Stylist freaks
    out a bit with complex styles that are brought in through a document created in
    another word-processing program and fails to display some underlining or adds
    odd characters.


    The layout of OOo Writer (see Figure 8.2) is simple and similar to other word-processing
    programs. The differences come in the left sidebar and the various floating windows.
    Your toolbars and the sidebar are almost fully customizable by right-clicking
    a toolbar and choosing Customize. Many tools, such as the Stylist (Format > Stylist),
    pop up in floating windows that you can move around wherever you need them. The
    basic text-formatting options on the toolbars, such as fonts, bold, alignment,
    and indenting, are very easy to use


