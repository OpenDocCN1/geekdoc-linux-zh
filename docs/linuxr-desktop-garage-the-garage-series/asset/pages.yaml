  md: '# ## Yahoo! Messenger


    # ### Program Info


    Terminal command ymsseger


    Program URL http://messenger.yahoo.com


    The Linux user community is currently small enough that most companies scoff at
    making special versions of popular software just to run in Linux. Yahoo! did it.
    They didn''t have to make a Linux version of their IM client, but they listened
    to users who requested it.


    Now that we are done praising Yahoo! for being progressive and attempting to serve
    a wider range of operating systems than its IM competitors, I am free to complain.
    Yahoo! IM for UNIX (see Figure 10.6) works just fine. Everything functions. However,
    for a desktop aficionado who likes to have everything look nice, this program
    hurts the eyes. I need antialiased fonts (the nonjaggy ones) like I, Edgar Hoover
    needed a nice pair of red pumps and a girdle. Well, I guess he didn''t need those,
    and I probably don''t need nice fonts to look at. But, krikely, we want these
    things.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_268_0.png)


    # **Figure 10.6**


    Yahoo! Messenger for UNIX, chat window and main window.


    Okay, I''m done. It''s not a bad program to use. If you only have a Yahoo! account
    and want to get down to basics with simple conversation windows, this one is for
    you. Yahoo! Messenger is also good for anyone who might be used to using the Windows
    version of the program. You will find lots of the features missing and things
    moved around a bit, but labels and basic functions are the same.'
