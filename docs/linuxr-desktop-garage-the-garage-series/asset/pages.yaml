- pgno: 28
  md: '# Use the CD in This Book


    Go look in the back flap of the book. What''s there? Linux! There are a few Linux
    distributions that run off a bootable CD, a live CD distro. Knoppix and Gnoppix
    are among the most popular live CD versions. Mandrake also has a live CD distro
    called MandrakeMove. Most people use these distros so that they can easily boot
    into Linux from any PC. I have used Knoppix before to get quickly online after
    rendering my computer unable to boot by doing something way too smart to admit
    to. I just put in Knoppix, rebooted, and got online to look up how to fix the
    computer. You can use this distro to try out many of the programs and tools in
    this book. If you are still deciding whether to run Linux on your desktop, use
    this CD to test-drive a few features.


    The caveat to using a live CD distribution is that what you get on the CD is what
    you get, no changing desktop environments or installing software. The best use
    of a live CD is for a little exploring. After exploring, go ahead and take the
    plunge to installing a full Linux distribution.


    # Accost the Nearest Geeky-Looking Man or Woman Wearing Some Piece of Clothing
    with a Penguin on It, Steal Their Laptop, and Run Really Fast


    Umm, no, actually don''t do that. I think you might get arrested or something.


    # Which Distro?


    You can choose from many, many different Linux distributions. Some distributions
    are well established and stable, while others are a bit experimental. In choosing
    which Linux distribution you want to start out with, or even which distros you
    might want to try later, just look at who you are and what you need. Some major
    factors to consider in choosing a distribution are the ease of the installation,
    the stability, the availability of programs, whether there is a good-size community
    of users who can help you, how much work you want to do on system configuration
    and software installation, and on your own level of technical knowledge.


    Now, let''s talk about the zealots. Linux seems to breed zealots, people who are
    religiously dedicated to their distribution of choice. These are the people who
    will be all around as soon as you decide on a Linux distribution. A lot of Linux
    enthusiasts have strong words for any distribution that isn''t the one they


    BitTorrent software to open that file. BitTorrent fir-js other users sharing what
    you want and downloads the file in small bits. While downloading, you are also
    sharing. The download is a bit slow, but you relieve the traffic burden on many
    universities and volenteere running mirror sites by using BitTorrent.'
