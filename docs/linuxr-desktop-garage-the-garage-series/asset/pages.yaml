- pgno: 160
  md: '![](img/f2b5f4073f00f9ec5546d9acb9cc6448_160_0.png)


    # Browse the Internet


    Did you ever have a diary? I remember the diaries with the little locks on them
    that gave the appearance of containing deep and deterimental secrets that would
    shock even the most avid viewer of daytime soap operas. Everyone with a diary
    hid it. They walked through life in fear of someone finding and reading the diary.
    I remember finding my sister''s diary once. It wasn''t very interesting because
    she was only 14 at the time. I''m sure someone somewhere still has one of those
    locked-up books, but diaries have changed in the online world. Not only is the
    lock off the little book, but the little book is displayed online for all to see.
    Enter the era of the blog.


    Blogs are personal Web sites that can be public diaries, lists of links, political
    journals, or anything in between. The blog, which is short for "Web log," started
    out as people posting their browsing habits and favorite Web sites. The personal
    journal entered the equation next, providing highly addictive online reading for
    many a closet voyeur. Today blogs are everywhere and have gained a curious importance
    in our society and culture. It is hard to meet someone anymore without anticipating
    the URL of their blog. In the 2004 presidential race, blogs helped shape the rhetoric
    and course of the campaigns, with bloggers even being invited to be press correspondents
    at the conventions of both parties.


    Browsers were one of the killer apps that first helped make the Internet into
    a popular phenomenon. The power of Internet browsers turned a made-up verb such
    as "to blog" into an addictive reading obsession. The browser is the'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'center of our online experience, where we can look up things, read e-mail through
    online clients, and completely do away with the phone book. They have gone from
    a tool to simply find information, to virtual shopping malls, to communities full
    of blogged gossip and whiney high school girls pouring out their daily troubles.
    Before I found blogs, I never knew how interested I was to find out each day what
    happened in the life of a 30-something businessman or how school went for some
    14-year-old girl in the Midwest. Maybe I ought to find my sister''s diary again
    from when she was 14; it''s probably more interesting now than I thought it was.


    # Mozilla


    | **Program Info** |

    |---|

    | **Fedora/GNOME menu** | Internet > Web Browser |

    | **Mandrake/KDE menu** | Internet > Web Browsers > Mozilla |

    | **Terminal command** | mozilla |

    | **Program URL** | http://www.mozilla.org |


    Let me tell you a tale of a little browser rendering engine that was developed
    by a big company, was abandoned by that company, and then rose to become even
    greater than that company. Let me tell you a tale about the Mozilla Web browser
    (see Figure 5.1). In the late 1990s, facing the rise of Internet Explorer in the
    browser wars, Netscape released its code as an open source software project. It
    created a team of developers, called the Mozilla Organization, to work on the
    project. Netscape was both supporting the open source software community and enlisting
    its help to move the Netscape browser forward. As time wore on, AOL bought Netscape,
    and the Mozilla Project was alternately embraced and abandoned. In 2003, all ties
    were severed between AOL''s Netscape and Mozilla. Now the Mozilla Foundation,
    a nonprofit organization, leads the development and release of new versions of
    Mozilla and related software projects.


    Why bother to tell you any of this? Because it''s fun—and because you might notice
    a marked similarity in Mozilla to Netscape. Most of the menus, some skins, and
    many features of the two browsers are the same. Mozilla has been breaking away
    along its own path in the past couple years, though, and is creating new software
    projects and adding new features to its browser.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '![](img/f2b5f4073f00f9ec5546d9acb9cc6448_162_0.png)


    # **Figure 5.1**


    Mozilla run-

    ning in Fedora.


    Mozilla is the browser darling of the Linux world. The browser comes installed
    with both Fedora and Mandrake. Even Windows users are starting to switch to Mozilla
    and its other browser project, Firefox, because of security vul-

    nerabilities in Internet Explorer. Mozilla features a full suite of Internet applica-

    tions, including the browser, a mail client, a newsgroup reader, a chat client,
    a

    Web page composer, and a blender. Okay, not a blender, but it would be nice if

    Mozilla could make a good daiquiri.


    The Mozilla browser, still labeled as Navigator from its Netscape days, can

    feel a little heavy at times with all the features and other programs in the suite.

    The browser features tabbed browsing, a pop-up ad blocker, an image man-

    ager, theming options, and tools for managing cookies, passwords, and down-

    loads. No wonder the browser can be slow to load on some computers.


    The layout of Mozilla is similar to that of most browsers. You have a menu,

