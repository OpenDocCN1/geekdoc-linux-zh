- pgno: 88
  md: '# The Terminal


    I know, this is the scary part for lots of people. It’s okay. We will do this
    together.


    The terminal is a small program that enables you to interact with your system
    through text commands instead of by clicking on GUI objects. Using the terminal
    instead of the GUI is like using a manual transmission in a car instead of an
    automatic transmission. Any dedicated car nut will tell you that you can get better
    performance with a manual transmission. In this case, the performance boost with
    the terminal comes in the form of getting some tasks done faster.


    Most people are afraid of the command line in a terminal because they think that,
    it is complex and that there will be lots of commands to remember. Okay, they
    are partially right. There are lots of commands to know, but you don’t have to
    memorize them all. You don’t have to do every complex task on the command line.
    You can use the command line when it is convenient for you and ignore it when
    your task might be more convenient to do in the file manager or a GUI program.


    I think that many users fear that they will open the terminal and stare at that
    blinky cursor, not knowing what to type in. There is a shortcut to memorizing
    every command that you need—and, in this case, to preventing carpal tunnel syndrome.
    You can use the Tab key for command and file name completion. Begin to type a
    command that you know the first letter of, and then press Tab:


    ```

    [susan@dodongo] $ q <Tab><Tab>

    ```


    If there is only one choice for that letter or combination of letters, the one
    choice will show the first time you press Tab. If there are multiple choices,
    press Tab twice. You might get output that looks like this:


    ```

    qm2ts      gmake3      qt2ofix3     qtdoc         quota

    qm2ts3     qrttoppm    qtconfig      qtrename140

    qmake      qt2ofix     qtconfig3     qtrename1403

    ```


    All the commands that start with a q on my Fedora install were displayed. So,
    as long as you know what the command starts with, you’ve got help. Keep in mind
    that letters such as t or I have more than 100 commands, so try to get the first
    two or three letters before you press Tab.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Your Command Line Deconstructed


    What''s all that stuff in front of the cursor in your terminal? Mostly, the information
    preceding the cursor on the command line is information about who and where you
    currently are.


    [susan@ododongo] $


    Reading from left to right: your username "at" your computer''s name (this will
    often be localhost, by default), and then a prompt symbol before the cursor. A
    $ indicates that you are currently logged in as a regular user. A # indicates
    that you are logged in as the root user.


    Table 2.4: Common Commands for the Terminal


    | What You Want to Do | The Command to Do It |

    | :--- | :--- |

    | View the contents of a directory | `ls` |

    | Move up one directory | `cd ..` |

    | Move to another directory | `cd [directory name]` |

    | Copy a file | `cp [current file name] [new file name]` |

    | Move or rename a file | `mv [old file name/location] [new file name/location]`
    |

    | Delete a file or directory | `rm [file name]` |

    | Create a directory | `rm -rf [directory name]` <br>(directory must be empty)<br>`rm
    -rf [directory name]` <br>(for a directory that is not empty)<br>`mkdir [directory
    name]` |

    | Run a program | `[command] &` <br>(Use the & to run the program in the back-ground,
    keeping your terminal free for other things.) |


    keep a text file in your home directory. When you learn a new command that you
    might want to use again, copy it to the text file to save it for reference later.
    Linux also keeps a history of the commands you have used. Open a terminal and
    type history. The history will scroll down quite a bit, so type in'
  merge: -1
  img_proc: true
- pgno: 90
  md: '| What You Want to Do | The Command to Do It |

    | :--- | :--- |

    | Find a file | `find [file name]`<br>(You can use an asterisk (*) as a wildcard
    character, so find all things that start with an `m` with `m*`. ) |

    | Show the current directory path | `pwd` |

    | Install an RPM file | `rpm -ivh [package name]` |

    | Uninstall an RPM file | `rpm -e [package name]` |

    | View help for a command | `man [command name]`<br>`info [command name]`<br>`[command
    name] --help` |

    | Create a shortcut to a file | `ln -s [file linking to] [name of shortcut]` |

    | Peek at the contents of a file | `cat [file name]`<br>`less [file name]`<br>`pico
    [file name]`<br>(if the pico editor is installed) |

    | Edit a text file | `vi [file name]`<br>(vi is a complex text editor, so get
    familiar with how to use it first. If you get trapped in `vi`, `:q!` will get
    you out.) |

    | Prevent all the output from scrolling right by you | `[command] \| less`<br>When
    you get long output from a command, run the command again with a pipe (`\|`) and
    the `less` command at the end of it. |

    | End any process or command | Hold down `Ctrl`+`C` |

    | Become the root user | `su` (then enter your root password) |


    Sometimes you need to do things in the terminal as the root user. You don''t have
    to log out of your desktop manager and log back in to work as root. The terminal
    is your shortcut.


    +   1. Open a terminal.

    +   2. Type the command, `su`.

    +   3. Enter your root password.




    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_90_0.png)'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'You are now logged into the terminal as the root user, with all the permissions
    and danger that go with the privilege. Be as careful as you can be when you are
    logged in as the root user; I have just handed you the loaded gun of Linux. Don’t
    delete anything unless you are absolutely sure that you don’t need it. Don’t change
    anything unless you know what you are doing. Root access in the terminal is great
    for things such as installing new programs, but don’t go nuts with the power.


    # Konsale and GNOME Terminal


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_91_0.png)


    Fedora/GNOME menu

    Konsale: No main menu choice for Konsale, but use the command konsale to open
    it from the GNOME terminal.

    GNOME Terminal: System Tools > Terminal

    Mandrake/KDE menu

    Konsale: System > Terminals > Konsale

    GNOME Terminal: No main menu choice for GNOME Terminal, but use the command gnome-terminal
    to open it from Konsale.


    Both Konsale and the GNOME Terminal are very simple programs, as shown in Figure
    2.15. You basically just open each, and you are ready to go. The options for preferences
    mainly pertain to how your terminal looks. Both of these terminal programs are
    called X Terminals. They are virtual terminals that enable you to run commands.
    You can also press Ctrl+Alt+F1 through F6 to access other, full-screen terminals.
    Hold down Ctrl+Alt+F7 to return to X, your graphical screen.


    # Figure 2.15


    KDE’s terminal program, Konsale.


