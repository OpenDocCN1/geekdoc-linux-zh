    \ Konqueror to get started.\n\n+   1. Set your home page: Behavior.\n+   \n+ \
    \     In the middle of all of those file manager options is a text field for Home\
    \ URL.\n+   \n+   2. Enable all tabbed browsing options: Web Behavior.\n+   \n\
    +      When you learn to take advantage of tabbed browsing, you will never go\
    \ back. I now cringe when I see someone open a second browser window. The tab\
    \ options are in the middle of the dialog box; check them all. Check out the Advanced\
    \ Options to see if you want those options. I tend to check all of them except\
    \ the multiple tabs confirmation.\n+   \n+   3. Decide your cookies preferences:\
    \ Cookies.\n+   \n+      Konqueror has a lot of options for cookies management.\
    \ Decide how safe or paranoid you want to be.\n+   \n+   4. Make sure pop-ups\
    \ are blocked: Java & JavaScript (JavaScript tab).\n+   \n+      At the bottom\
    \ of the dialog box is a series of radio buttons to decide what you want to allow\
    \ JavaScript on Web pages to do. Denglting the Open New Windows capability covers\
    \ most pop-up ads.\n+   \n+      When you are done, be sure to click OK to apply\
    \ your changes. Use Konqueror for a bit and then open the preferences dialog box\
    \ again to explore the other options you can adjust to suit you."
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Other Browsers Available for Linux


    # Epiphany


    **Program Info**


    | Program URL | http://www.gnome.org/projects/epiphany/ |


    GNOME has always wanted a browser. It’s sort of like how I have always wanted
    a pony, or how one kid wants something just because the other kids in the neighborhood
    have one. The Epiphany browser emerged as the old GNOME browser, Galeon, rode
    off into the sunset. The main goal of Epiphany is simplicity. I think the developers
    looked at Mozilla, Konqueror, and Netscape, and saw browsers that were more bulky
    and heavy than bad fruitcake.


    The result is that Epiphany is a browser with a small footprint, a simple interface
    (see Figure 5.4), and no extraneous functions such as mail or newsgroups. You
    might be thinking, “Hey, you just told us all of this stuff about Mozilla Firefox!”
    First, calm down. Next, I can say that Epiphany and Galeon started this quest
    before Mozilla Firefox was born. Now Epiphany has competition in the simple browser
    genre.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_170_0.png)


    **Figure 5.4**


    *Epiphany is a browser that emphasizes efficiency and simplicity.*'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'Epiphany has most of the functions and features you will recognize in any browser,
    and also at least one innovation: The program uses the Mozilla Gecko layout engine
    for rendering Web pages. The advantage of using Mozilla’s layout engine is that
    you, as a user, can still benefit from the antialiased text and other nice aspects
    of the Gecko engine. The big difference in Epiphany is in how the browser handles
    bookmarks. We are used to the tree list or folder list when looking at our bookmarks.
    Epiphany has tossed the convention and opted for organizing bookmarks by keyword
    searching. To go to a stored bookmark, you type the bookmark name or a word from
    the URL in the address bar. Possible matches show in a drop-down list under the
    address bar. I like this new approach for finding bookmarks that you want to get
    to quickly. You do, however, lose the browsing of forgotten bookmarks when using
    this keyword method.


    # Opera


    | Program Info | |

    | :--- | :--- |

    | Program URL | http://www.opera.com |


    Opera is a classic. It’s like fine cheese, Norwegian cheese. This browser has
    been around for quite some time. Opera has been a friend to the Linux community
    for a while as well, by providing a Linux version long before it was popular to
    do so. Opera provides versions for all major Linux distributions, including Fedora,
    Mandrake, Red Hat, Debian, SuSE, and also a Macintosh Power PC package. The program
    is both a Web browser and an e-mail client with additional capabilities for participating
    in IRC chat (more on IRC in Topic 10, “Instant Messaging and Chat”). Opera is
    not entirely free; it’s a commercial application that you need to buy, but you
    can choose to download an ad-supported version.


    Once again, like all of the browsers we are talking about, there aren’t a lot
    of wildly differing features in the Opera browser. Among its attributes is the
    capability to search directly in the address bar by adding in a search engine’s
    shortcut before your keywords, such as a g for “Google.” So, type “g modern delusions
    of grandeur,” and you will go to the Google search result for those search terms,
    probably with my Web site as your top search result. Opera also takes pride in
    supporting Web standards, such as those set out by the W3C (see http://www.w3c.org).
    Now, Web standards might not mean much to you as a'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'user, but they mean a lot to Web developers and mean a lot in terms of giving
    you a consistent experience between browsers and Web sites.


    Opera can seem like a bit of a bloated application because it has so many features
    in it, but the company has been a leader in coming up with new ideas in browsers.
    Here are just a few in Opera''s lineup of interesting attributes:


    +   - Chat client

    +   - Mail client

    +   - Mouse gestures (set certain mouse movements to be shortcuts to common functions)

    +   - Multiple document interface (display multiple Web pages in one window, in
    tabs, or in a single interface)

    +   - Password manager

    +   - Pop-up blocking

    +   - Sessions (save a group of open pages to open again all as a group)

    +   - Skinning (change the whole look of Opera with downloaded skins and color
    schemes)

    +   - Small-screen rendering (rearrange pages for display on very small screens
    and windows)

    +   - Zoom (magnifies your view)


    # Netscape


    | Program Info |

    | :--- |

    | Program URL | http://channels.netscape.com/ns/browsers/ |




    You can call Netscape a classic, too, but it''s a different kind of classic, like
    an old friend you used to love who now just keeps coming to your house to kick
    your dog, eat all your cookies, and pee on your front porch. There is a name for
    a friend like that: Used to Be Cool Browser That Kicked Out Its Mozilla Friends
    and Now Just Shills for AOL and Time Warner.


    Okay, so I am maybe being a bit harsh. Netscape was the classic friend to Linux
    and to the browser world. For years, Netscape was the only big browser supporting
    Linux. Netscape was the better alternative in an Internet Explorer world. Netscape
    started the Mozilla Project to utilize the open source software


    > to young Linux geek children. On this hallowed day, Opera accused Microsoft
    of having its MSN search engine page render differently when it detected the Opera
    Web browser. Opera responded by releasing a version of its browser that always
    displayed the MSN search engine page translated in Swedish'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'community in its development of new versions. Those were the old days. Eventually,
    Netscape got eaten by Internet Explorer and bought by big corporations. They then
    asked the Mozilla folks to leave. Now Netscape is still a decent browser, but
    it somehow seems less friendly than it used to be.


    Odds are, you have used Netscape before in another OS, so you will recognize the
    conventions of its layout and features. Netscape includes a mail client, address
    book, news client, Web composer, instant messaging (AIM), themes, and integrated
    search capabilities; lots of multimedia plug-ins are available for it. The My
    Sidebar feature has search, news, buddy list, stocks, auctions, and music. Many
    more sidebar tabs are available to download as well.


    You might have sensed my bitterness about Netscape, but it’s only my own sense
    of regret, not the fault of the program. Although too many features over the years
    have made the browser a little bit slow to load, there is still a good Web browser
    there. Web developers will bristle at a few quirks in how Netscape deals with
    JavaScript and how it renders Web pages. Users will enjoy that Netscape is still
    free, easy to install, and familiar to use.


    # ## Multimedia on the Web


    I told you in the beginning that not everything was going to be perfect in Linux.
    Getting streaming media to work in your Linux browser is one of the two great
    areas I think need the most work and help from developers (the other is gaming).
    Some multimedia types are actually pretty easy. You can get MP3s, WAV files, PDF
    documents, Macromedia Flash content, and Real Player files to run fairly easily.
    You get into trouble when you have other movie or audio files to play, such as
    Quicktime, AVI, and other media types that can play in Windows Media Player.


    Your best bet is always to play media files in an outside player; if the Web page
    gives you that option. Web sites with embedded media players can be the bane of
    your existence. When there are embedded files that you cannot play, and if you
    are comfortable browsing through HTML source code, you can sometimes look at the
    source of the page and find the direct path to the media file you want to play.
    You can then poke that direct path URL into your address bar so that your browser
    can open the media file in an outside player.


    There are a few web resources and one program to ease your online multimedia pain.
    Mozilla, Firefox, and Konqueror still use Netscape-type plug-ins and can often
    use the plug-ins from Netscape’s Web page (see


    > Chef speak, “Tudey on M9N; Ver putestests geerensg up…” You can read more about
    this funny story at http://www.opera.com/presenterseases/en/ 2003/02/14/.'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'http://channels.netscape.com/ns/browsers/plugins.jp). Mozilla and Firefox users
    can go to the more specific and comprehensive page for Mozilla browser plug-ins
    at http://plugindoc.mozdev.org. One of the plug-ins on the MozDev page, mozplugger
    (which is an offshoot of Plugger), can be quite handy because it covers multiple
    types of files. If you install mozplugger, install it first and then install the
    specific plug-ins you want. Although all the information online is helpful, you
    will still run into issues. Crossover Office, a program used to run Windows applications
    in Linux (see Topic 13, "Running Windows Applications"), runs Microsoft Internet
    Explorer browser plug-ins quite well, including the two most difficult, Windows
    Media Player and Quicktime. Crossover Office is a commercial program, but you
    can download a demo version at http://www.codeweavers.com/site/products/download_trial.


    # ## The Skinny


    | PROGRAM | Usability | Interface | COMMENTS |

    | :--- | :--- | :--- | :--- |

    | Mozilla | Great | Great | Mozilla is the outsider that threatens Microsoft Internet
    Explorer''s stranglehold on browsers in the Windows world, and it is the darling
    of the Linux world. The program is one of the larger ones, with included mail
    and chat programs. |

    | Mozilla Firefox | Great | Great | Look, everybody, it''s Mozilla Jr.! Firefox
    started out as the lighter version of Mozilla but has developed its own distinct
    interface and characteristics that make it just a great all around browser. Not
    everyone wants a mail client and a browser in one, and not every one wants skins
    and chat in their browser, and Firefox is here to help, combining Mozilla''s power
    with small efficiency. This is also the easiest transitional browser for those
    used to Microsoft Internet Explorer. |'
  merge: -1
  img_proc: true
- pgno: 175
  md: '| PROGRAM | Usability | INTERFACE | COMMENTS | |---|---|---|---| | Konqueror
    | Great | Great | It''s not just for broadcast — or file management. Konqueror
    is a full-featured browser with quite a few advantages. If you are a KDE user,
    you will appreciate the seamless integration with the KDE desktop. Now that Apple
    is using Konq''s rendering engine, KHTML, in its Safari browser and contributing
    back to the open source project, we should see Konqueror just get better and better.
    | | Epiphany | Great | Good | This is a good, solid browser that is based on Mozilla''s
    layout engine. The small program size and simplicity of the interface makes it
    very fast. If you don''t need a lot of extra features and just want to browse
    online without baggage, Epiphany is a good choice. | | Opera | Good | Great |
    Opera is one of the big three Linux browsers; it''s a big program with a myriad
    of options. Highlights of this browser are its incredible flexibility and dogged
    support of Web standards. The commercial price tag, though modest, might scare
    away some users. | | Netscape | Good | Good | Before I slip back into lamenting
    like the chorus in a Greek tragedy, let me say that Netscape is a good browser.
    The fact that the program includes everything but a free vacation in Greenland
    means that it loads slow. If you enjoy the all-in-one quality of the many options
    and familiarity, give Netscape a try. | |'
