    # Free Games


    We are talking about Linux and open source software, so, of course, there are
    free game choices. Which games you might be interested in depends on what you
    like. A lot of free games are available on your Mandrake or Fedora install disks.
    Those games include the KDE and GNOME game collections. Popular open source games
    also have been around for quite some time, including FreeCiv and Tux Racer. More
    ambitious projects have been started for large-scale first-person shooter games
    and massive multiplayer online games.'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'Both the GNOME Games collection and KDE Games consist of small desktop games
    such as card games, puzzle games, and arcade games. These are the games you play
    when you need something to do, and when you are waiting for something to download,
    or when you have odd fantasies of becoming the Olympic Solitaire gold medalist.
    Other free games can be more involved and time consuming. You can have a lot of
    fun with the many free games available for Linux, but don’t expect most of them
    to be up to the standard of the popular commercial video games.


    # GNOME Games


    **Program Info**


    |  |  |

    | :--- | :--- |

    | Fedora/GNOME menu | *Games* |

    | Mandrake/KDE menu | *More Applications > Games* |

    | Program URL | http://www.gnome.org/projects/gnome-games |


    The GNOME Game package is on your install disks. You can also use Apt, Yum, or
    URPMI to get the packages online, but there are a few associated libraries to
    get as well. You are better off grabbing the packages from your install disks
    using the Fedora package manager tool or Mandrake’s RPMDrake. These are games
    that have been around for a while, so it’s not essential that you get the absolute
    latest versions of the packages.


    All the games in the GNOME Games collection are small and simple, but they can
    be challenging and addictive. Sometimes the hardest part of these games is figuring
    out what you are supposed to do in the game, thanks to a few cryptic game titles.
    You might get a few more games than the ones described in this topic when you
    install, but these are the official core games in the GNOME Games collection.


    **AisleRiot.** It’s Solitaire. To be technical, AisleRiot includes 70 different
    types of solitaire. You can play the popular Freecell or Klondike, as well as
    odd variations that surely no one can ever win.


    **Ataxx.** This is sort of like Reversi, but twisted. Instead of placing colored
    pieces on the board, you try to replace the other player’s pieces with yours.


    **Blackjack.** You know what blackjack is. Try to get closest to 21 with your
    cards, without going over.


    **Four-in-a-Row.** This is sort of a combination between Tic-Tac-Toe and that
    old board game Connect Four. My sister and I had enough fights over Connect Four
    as kids that this game brings back bad memories of getting scratched.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '**Gnomeris**. This is a Tetris clone. Try to turn and put together the falling
    shapes to complete horizontal lines (see Figure 12.1).


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_308_0.png)


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_308_1.png)


    **Iagno**. Remember the board game Othello? That was a copy of the old game Reversi.
    Iagno is another version of Reversi. Control the board by having the most pieces
    of your color showing.


    **Klotski**. This is a puzzle game in which you have to slide blocks to solve
    the puzzle in only a few moves.


    **Lines**. The game doesn''t have a creative name, but Lines is an apt name for
    this game. You have to move balls around to form them into lines of five in a
    row.


    **Mahjongg**. Oh, Mahjongg, the bane of centuries of Chinese slackers and of me
    when I have an unpleasant task before me. Match tiles to make them disappear from
    a stacked pattern. This is an ancient game, but putting it on the computer makes
    it so much better—no tiles to clean up.


    **Mines**. Mines is the same game as Minesweeper. You have to look for mines on
    a grid.


    **Nibbles**. This one can get addictive. You have to move a worm through a maze
    to collect gems. Your worm grows longer as you go, and you have to be sure not
    to hit a wall or part of your own worm. Actually, now that I''ve described it,
    Nibbles sounds sort of like a psychedelic drug trip turned into a game.'
  merge: -1
  img_proc: true
