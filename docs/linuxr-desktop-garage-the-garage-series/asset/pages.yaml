  md: '# An Open File to Someone Somewhere


    Dear People Who Make Linux Things That I Want, Please make versions of Apt and
    Yum for Mandrake. Yes, there is **URPMI** (a slightly similar command-line program
    for Mandrake). Yes, there is Mandrake Update. It’s not enough. Those utilities
    are okay, but having Apt and Yum versions for Mandrake would help us move toward
    even more of a standard for installing software in Linux. Apt and Yum for Mandrake
    would make everything less confusing. I know people are working on this now, but
    let’s get the effort more active. Apt and Yum for Mandrake would cure cancer,
    grow flowers, and give us all free cookies. Make them for me. Make them for Mandrake
    for me now.


    Sincerely,

    Susan


    # Installing Programs from Source


    Back in the old days, we had to walk uphill to install a program—uphill both ways,
    in 4 feet of snow, with no shoes, and dragging a dead horse with us. And we liked
    it! We had to install all new programs from the source code. You might never have
    heard of this method before. Installing from the source code is a unique benefit
    of open source software. With the source available to anyone, you can download
    that source—even edit it, if you know how to—and then compile the program yourself.
    When you install from source, you are installing the program for your particular
    architecture and your particular computer, and you are doing it manually. Although
    this method isn’t as easy as clicking an RPM file, it can give you a more efficient
    program because it was built for your system. If this all sounds hard and complex,
    don’t worry; it is. However, you can follow a few easy steps to make sure you
    usually have a smooth install of a program.


    # The Magic 7 Steps to Installing Programs from Source


    +   1.  Make sure you have development packages installed with your distribution.
    These were the software-development packages that were categories in your initial
    Linux installation. If you don’t have the development packages, you can add them
    from your install disks.


    +   2.  Download the source code, which is usually in a compressed `.tar` or `.tar.gz`
    archive file.


    +   3.  Unpack the archive file using either your file manager or the command
    line.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '+   4. Open a terminal and use the `su` command to become the root user. Then
    go to the new directory created by the unpacked archive.


    +   5. Enter the command `configure`.


    +   6. Enter the command `make`.


    +   7. Enter the command `make install`.


    Sure, those steps are harder than the one-step RPM install, but they’re not too
    hard. Sometimes installing a program from source is the only avenue available
    to you if no one has created an RPM package of that program. For more details
    on those last three steps and an example, see ToolKit 3.8. One disadvantage to
    installing programs from source code is that programs are much more difficult
    to uninstall than ones that were installed using RPM packages. You have to hunt
    down each file installed by the program to delete it.


    # TOOLKIT 3.8: Install a SourceForge.net Project from Source: `eLapse`


    Remember that open source timer program that we installed as an RPM? Let’s download
    the source code and install it again. For fun, if you installed the RPM with `me`
    before, first uninstall the program with the command (as the root user) `rpm -e
    eLapse` before installing it again. Download the source code file, `eLapse-0.2.tar.gz`,
    from http://sourceforge.net/projects/eLapse/.


    +   1. Open a terminal and go to the directory you downloaded the compressed file
    to.


    +   2. Unpack the tar file:


    ```

    # tar -zxvf eLapse-0.2.tar.gz

    ```


    +   3. Unpacking the archive created a new directory called “”eLapse-0.2.” Go
    into the directory:


    ```

    # cd eLapse-0.2

    ```


    List its contents to see what is there:


    ```

    # ls

    ```


    You will see a lot of files. When there is a README file and/or an INSTALL file,
    those are text files that you should read for instructions. This program is small
    and doesn’t have much extra information in its instruction files, but other programs
    might put info in those files that can save you a lot of time.


    +   4. One file in the directory is named configure. That file is actually a program
    that checks your computer to see that all the software-development tools that
    the program needs are installed. Run configure:


    ```

    # ./configure

    ```'
