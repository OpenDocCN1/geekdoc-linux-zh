- pgno: 36
  md: 'You can find a number of CD-burning software programs for Windows, and most
    have a help menu that will point you in the right direction.


    # ## Burning Disk Images in Mac OS X


    Whereas OS X makes burning music and data disks very easy, burning images is a
    little more complex. You can get a few third-party applications for burning disks
    on a Mac. Some of those programs make the job a little easier by putting all of
    the commands and utilities you need in one place. If you grab one of those programs,
    just follow the instructions that come with your software.


    If you want to burn your disk images through OS X, you need to open Disk Utility.
    From a Finder window, simply drag each downloaded disk image file into the left
    column of Disk Utility. The Burn button on the toolbar should then be available.
    You can insert a blank CD or DVD and then choose *Burn*.


    # # Dual-Booting


    # ### What Is Dual-Booting?


    Dual-booting is the term commonly used when installing two separate operating
    systems on the same computer. You can partition a single drive with one operating
    system on each, use one hard drive for each operating system, or spread things
    out among a few drives. For example you could dual-boot Linux and Windows or Linux
    and Mac OS.


    Here is how dual-booting works. Your hard drive has on it what is called the Master
    Boot Record (MBR). The Master Boot Record is located in the first sector of your
    hard disk. The record contains your partition table as well as information to
    identify where and how your operating system will boot. Normally, with one operating
    system, the MBR just shoots right into the OS that you have on your hard disk.
    However, when you are dual-booting, the MBR first makes a stop at a program called
    a boot loader. The boot loader gives you a menu of choices so that you can choose
    which of the operating systems on your hard disk you want to boot into. If you
    make no choice, the default choice is chosen automatically after a set number
    of seconds. The labels for the operating systems, which one is the default, and
    how many seconds to wait are all configurable.


    # ### Why Dual-Boot?


    A good portion of the rest of the world is using other operating systems, mostly
    Windows and Mac OS. Those people will send you files, design Web sites,'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'provide multimedia content, write software, and do most everything else with
    those other two more popular operating systems in mind. Linux can handle most
    of that, but sometimes you will need to use Windows or Macintosh. You might receive
    an office document with formatting that looks funny when you open it in Linux.
    You might visit a Web site that has a lot of multimedia content that would just
    be too much trouble to make work in Linux for the few moments that you will be
    there. You might have a deep, abiding need to play the latest first-person shooter
    game that will not run in Linux. You might want a gradual change to your new OS.
    You might get the point by now with all these repetitive sentences I have just
    given you.


    # ## The Boot Loader


    When you are dual-booting, the boot loader is a program that serves as a pit stop
    in the boot process for you to choose which operating system on your computer
    you want to boot into. The most popular boot loaders for use with Linux are GRUB,
    LILo, and Yaboot.


    GRUB and LILo run on PCs. LILo is the older choice, but GRUB is quickly overtaking
    LILo as the best choice for a boot loader. GRUB is the newer software, with some
    fixes of problems that previously came up in LILo. Mandrake still uses LILo as
    the default in 10.0, but you can switch it to use GRUB in the Summary screen.
    If you don’t switch the boot loader in Mandrake from LILo to GRUB, nothing bad
    will happen. Choosing either LILo or GRUB will not make much difference for most
    users.


    Yaboot is almost your only choice in a boot loader to run on Apple machines. Yaboot
    is certainly the reliable, tested boot loader that has been around for a while.
    Yaboot is text only and might look a little funny sitting in the upper-left corner
    of your screen in small text. Yaboot is a minimalist boot loader without a GUI
    or a lot of bells and whistles.


    # ### Steps for Dual-Booting with Windows


