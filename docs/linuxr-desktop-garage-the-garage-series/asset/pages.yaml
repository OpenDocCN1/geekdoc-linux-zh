    \ Ctrl+D) and delete the RPM file.\n\n# ### How to Uninstall an RPM File\n\nRemoving\
    \ any package on your system is easy. You need to remove packages in the terminal.\
    \ As the root user, use this command to uninstall an RPM:\n\n```\n`# rpm -e [package\
    \ name]`\n```\n\nIf other packages need that package, you will see an error telling\
