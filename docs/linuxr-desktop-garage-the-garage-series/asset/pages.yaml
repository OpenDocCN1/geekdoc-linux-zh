    # **My OpenOffice Writer Assignment, The Gunshoe Tale: Looking for a Pen**


    I don’t know what she is talking about. She just seems to go on and on like that.
    I came in here this morning because Jake said there was a pen on the desk I could
    borrow. Now I’m stuck sitting here listening to some leggy brunette go on and
    on about the wife she never was and the husband he really isn’t and what happened
    with the gun and that her sister was a whore and would I help her out. I don’t
    know if I’m helping her out or even why I’m still in here, but there’s the pen
    I came looking for. It’s a nice pen.


    “I’m afraid to go back to the place now. Ya think someone called the cops yet?
    Do ya think they would know that it was me? What do you usually do when this happens?”
    She wouldn’t stop talking like this. “Brenda told me you were a good guy. She
    said you knew what you were doing. She said that you were the person to help me
    out.”


    I just came in here to borrow a pen. I might even keep the pen. It’s a nice gold
    pen, and Jake probably won’t know that it’s even gone. I don’t need this dame
    coming in here making me dizzy with all this gab.


    Jake’s a detective. He’s this big guy who just boils over all the dames. He knows
    how to talk suave and all. I help him out once in a while when he needs somebody
    to do some legwork. He says if I help him out sometimes, he’ll teach me things.
    He hasn’t told me what yet, but I bet I’ll get me a girl.


    “Why are you just sitting there?”


    She’s pretty, this girl, but she’s awfully upset. She looks like trouble. Jake
    knows when a dame might be trouble. Jake had to go work on a case in Philadelphipia.
    He said I should watch the place while he was gone.


    “Aren’t you gonna help me?”


    She’s talking to me. I don’t know what to tell her. I’m not a detective. I’m just
    sort of watching the place. I just needed this pen. This girl is crying now. I
    don’t know what to tell a crying dame. Jake hasn’t taught me that part yet.'
  merge: -1
  img_proc: true
