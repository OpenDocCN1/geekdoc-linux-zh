    # Other Free Games


    Plenty of other free games are available for Linux besides the small games that
    come with KDE and GNOME. Aspiring video game designers have started projects for
    everything from first-person shooters to racing games, role-playing games, and
    more. One of the best Web sites to keep up with Linux games is [http://www.happypenguin.org/](http://www.happypenguin.org/).
    The Linux Game Tome, as the site is titled, keeps track of new Linux games, updates,
    and Linux game news. You can find links to information and to download most free
    and commercial games. The LGT has consistent coverage of each game that it tracks
    and should be your first stop when looking for Linux games.'
