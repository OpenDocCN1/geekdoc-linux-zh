- pgno: 282
  md: 'online database for CD information, playlists, and the capability to add and
    edit ID3 tags.


    When you rip an audio CD to MP3 files, the most common format that you want to
    convert to, the tracks on the CD go through a few steps. First, they are converted
    to uncompressed WAV files. Then they are compressed and encoded into MP3 files.
    Grip features the capability to simultaneously rip and encode, which makes the
    long process of ripping a CD go a little faster. Because of the WAV step in the
    process, you want to make sure that you have plenty of free disk space for Grip
    to save those WAV files to temporarily.


    Grip’s interface is a series of tabs with settings and options on each tab. CD
    player controls are in the bottom of the window. The Tracks tab (see Figure 11.2)
    is a list of the tracks on the CD. The far right column, Rip, is full of check
    boxes to mark which tracks you want to rip. The Rip tab (see Figure 11.3) is where
    you start the process, with buttons for Rip+Encode, Rip Only, and two abort buttons.
    The last button, DJI Scan, is for use if you have a program called Digital DJ
    (see http://www.nostatic.org/dj/\) installed. The indicators below those buttons
    show you progress on current actions. The Config tab is where most of the action
    is. A lot of options in here might sound cryptic to you. I suggest that you try
    ripping a few CDs using the default settings first. You can play with adjusting
    options afterward. You can check out Grip’s built-in help docs for information
    on advanced configuration, but you most likely will need to change only your personal
    preferences for file naming and locations. The Status tab scrolls status messages
    in an embedded window.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_282_0.png)


    # **Figure 11.2**

    Grip’s Tracks tab.


    **ID3 ME**


    *Digital audio formats such as MP3 and OGG contain track information about the
    song or audio embedded in the file. The standard format for track information
    in MP3s is the ID3 tag. The tags have*'
