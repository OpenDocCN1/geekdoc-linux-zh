- pgno: 316
  md: 'Doom 3 is the third entry in the Doom game series. Doom was one of the pioneers
    in multiplayer first-person shooters. In the single-player game of Doom 3, you
    are a Marine on a Mars research facility when evil walks in and takes over. The
    rest of your crewmates are being turned into zombies, and it’s up to you to stop
    the evil. Most Doom players don’t spend much time in the single-player game. The
    most fun and action comes from joining online servers to play with others on multiplayer
    servers. The multiplayer game includes only a death match with four players right
    now. However, patches and variations on the game are sure to come in the future.


    Doom 3 has set a new standard for processor, memory, and video demand from a game.
    That performance demand means that you should carefully check the system requirements
    first and make sure you can get the right Linux drivers for your video card.


    # Driver Demand


    Yes, the biggest problem in Linux isn’t the OS itself. The problem is usually
    the fact that software and hardware makers don’t always make versions of their
    software and drivers for Linux yet. If you have a top of the line video card,
    finding Linux drivers can be difficult at times. Luckily, both ATI and Nvidia,
    the two biggest video card makers, are now releasing Linux drivers after bowing
    to demand from Linux users and businesses such as movie special effects companies.
    When looking for video card drivers, first check the hardware makers’ sites, http://www.ati.com/support/driver.html
    and http://www.nvidia.com/content/drivers/drivers.asp.


    You should also look at a few sites, including the one at http://www.linuxforum.com/linux-hardware/video.html,
    for accounts of what other Linux users have done to get their video cards tweaked
    and set up for best performance.


