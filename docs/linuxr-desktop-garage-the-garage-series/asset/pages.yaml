    # ## OpenOffice.org


    Yes, that is a Web address and a name. OpenOffice.org uses its Web address as
    the name of the program suite. Some might call it clever. Some might call it marketing.
    I will just call it a name.


    The OpenOffice.org productivity suite includes most of the program types that
    you expect in an office suite. There is a word processor, a spreadsheet program,
    a presentation creator, and a program for diagrams. OpenOffice is a direct assault
    on the Microsoft Office suite. Every program in OOO is designed to be able to
    open documents from its MS Office counterpart and to come close to approximating
    the features in the MS Office programs. Sometimes OpenOffice hits the mark beautifully,
    and sometimes you grin and bear the differences. Besides trying to equal Microsoft
    Office, OpenOffice does a good job of taking itself seriously enough to come up
    with unique features of its own.


    All the OpenOffice programs are available for both Linux and Windows. Mac users
    can also run OOO through Apple''s X Server program. This cross-platform compatibility
    of OpenOffice.org means that you can smoothly share documents with users of other
    operating systems—as soon as you talk them into using OpenOffice.org instead of
    Microsoft Office.'
