  md: '# Phantom Keyboard Shortcuts


    If you try a keyboard shortcut to switch desktops and nothing happens, that might
    be because the keyboard shortcuts for switching between desktops are not enabled
    by default in KDE. Setting the keyboard shortcuts takes a little bit of detective
    work if you don''t know where to look. The settings are in the KDE Control Center
    (see Topic 4) under Regional & Accessibility. To set the shortcuts, click in the
    list, key down to Desktop Switching, choose Custom, and click on the image of
    a button. A window pops up. Just press the keys that you want to use, and click
    Ok.


    There are only a few simple options for configuring KDE Multiple Desktops, as
    shown in Figure 2.9. You can change the number of desktops using the text box,
    arrow buttons, or the slider. As you increase the number of desktops, they will
    become accessible to rename. Each of up to 16 desktops is listed separately so
    that you can rename each one. All you have to do then is choose OK. There is no
    setting for the number of rows; however, if you drag the edge of your panel down
    to make it smaller, KDE will adjust the number of rows in the pager for you.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_76_0.png)


