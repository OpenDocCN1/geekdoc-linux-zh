- pgno: 347
  md: '# **file manager**


    Graphical program for navigating through a file system and for adding, editing,
    and deleting files and directories.


    # **file system**


    Method used by operating systems to organize and track files.


    # **firewall**


    A hardware or software barrier used to prevent unauthorized access to or from
    a computer on a network.


    # **first-person shooter**


    Game type with a first-person viewpoint in which the player primarily shoots other
    players or characters.


    # **folder**


    See directory.


    # **font**


    Design for displaying characters that includes typeface, pitch, size, and spacing.


    # **frag**


    Term used in video games to describe killing a fellow player or game character.


    # **FTP**


    (file transfer protocol) Protocol for sending and receiving files over the Internet.


    # **Gantt chart**


    Graphical representation of activities and work over time in a project.


    # **genius**


    Susan


    # **glossary**


    You are reading it.


    # **GPL**


    (general public license) A license often used in open source software in which
    the complete source of a document or program is distributed, and anyone who receives
    the data must share it with anyone else as a part of the license agreement.


    # **GUI**


    (graphical user interface) A program interface that utilizes graphics to make
    a program easier to use and easier to learn.


    # **HTTP**


    (HyperText Transfer Protocol) Communications protocol used on the World Wide Web
    to define how data and messages are formatted and transferred.


    # **HTTP proxy**


    See proxy.'
