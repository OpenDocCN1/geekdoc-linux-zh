- pgno: 187
  md: '# Setting Up an Account


    You are prompted to go through an account setup wizard the first time you open
    Thunderbird. You can also access account settings and add multiple accounts at
    Tools > Account Settings. In the Account Settings dialog box, you can highlight
    an account in the list on the left to see its settings on the right. Use the Add
    Account button to create a new account.


    # Reading E-mail


    With your account set, just click the Get Mail button on the toolbar to fetch
    mail from the server. Depending on which layout choice you picked, the location
    of your folder list, message list, and preview pane might differ. To read mail,
    highlight the Inbox or folder you want in the folder list, and then click the
    message to show the message contents in the preview pane.


    # Sending E-mail


    The Write button on the toolbar opens the composer dialog box. A few text-formatting
    options are available, but keep in mind that using them changes your message into
    an HTML message. Although most people now have e-mail clients that can read HTML
    messages, they are still usually unnecessary. Complete the address in the To field
    for the message recipient, type your message below, and click Send when you are
    ready. You can attach files with the Attach button. The Contacts button accesses
    Thunderbird’s built-in address book. If you need to save the message as a draft,
    use the Save button.


    # Filtering Spam


    Junk mail filtering is one of the best features in Thunderbird. On your toolbar
    is a Junk button. Thunderbird automatically labels e-mails that it suspects of
    being spam. If the program misses a spam, highlight the message and click the
    Junk button to mark it as spam. If Thunderbird incorrectly marks a message as
    spam, the Junk button turns to saying Not Junk when you highlight the message
    so that you can mark it as not spam. Thunderbird learns from the mail you receive
    and the messages you mark. As you use Thunderbird more, you can adjust the Junk
    Mail preferences at Tools > Junk Mail Controls.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# ## Adding Mail Filters in Thunderbird


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_188_0.png)


    In most e-mail programs, you need to use the message-filtering features to filter
    spam. With the great junk mail controls in Thunderbird, you are free to use the
    message filters to concentrate on organizing your Inbox and folders.


    +   1. Open the Message Filters dialog box at Tools > Message Filters on the menu.

    +   2. Click the New button to open the Filter Rules window.

    +   3. Let''s say that I wrote a mean letter to Rod Stewart, that rock dude from
    the ''70s. Let''s say that I want to make sure that I don''t see any reply from
    him. I can fill out the filter rules to specify the sender and then add the action
    to put matching messages in the trash (see Figure 6.6).


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_188_1.png)


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_188_2.png)


    +   4. When you''re done with the rules, click OK. Close the Message Filters window.

    +   5. To apply your filters, go to Tools > Run Filters on Folder. Then you will
    be sure to not receive any e-mail from Rod Stewart.


    # ### Newsgroups


    You find the oddest people online, and you find most of those odd people in newsgroups.
    Groups are an old Internet staple. Although Web forums and message boards that
    you can read in your browser have threatened to make newsgroups extinct, there
    are still dedicated newsgroup users who doggedly check their groups all day and
    argue to their heart''s content.'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'A lot of good information is available in newsgroups, along with a lot of misinformation.
    Groups are one of the last Wild West, not-controlled-by-advertising bastions of
    Internet freedom. There are newsgroups for just about every subject you can think
    of—and a few that you don''t want to think of. Messages are not really moderated
    much and can range from helpful to abusive, from stupid to expert. You just have
    to figure out for yourself what information is credible, who to ignore, and which
    debates you want to jump into.


    Newsgroups are threaded conversations that are listed by date. You subscribe to
    a group from a list on your local news server, which is usually through your Internet
    service provider. Messages are listed by thread and by date. You download headers
    and messages for groups that you are subscribed to. Highlight a message to read
    it. You can reply to groups and post messages as well. Newsgroups, such as e-mail,
    are also attacked by spammers, so be careful not to give out your real e-mail
    address or information in public view.


    # ## Pan


    | **Program Info** | |

    |---|---|

    | Fedora/GNOME menu | Internet > Pan Newsreader |

    | Mandrake/KDE menu | Internet > News > Pan |

    | Terminal command | pan |

    | Program URL | http://pan.reibelbase.com/ |


    If you want to spend a lot of time reading and participating in newsgroups, a
    dedicated and powerful news program is preferable to an e-mail client. Pan is
    a powerful news program (see Figure 6.7) that features excellent sorting tools,
    article filtering, multiple connections, and good offline reading options. The
    development schedule for Pan is quite active, with an average of only three weeks
    between new versions.


    Pan is fast and easy to use, with the capability to download and read other articles
    while previous downloads are going on. Fans of binaries groups (you can download
    large files in newsgroups in separate binary attachments) will enjoy how multipart
    messages are displayed together and will appreciate the capability to filter out
    incomplete multipart messages. There are also a lot of choices for rearranging
    Pan''s layout.


    > *Evolution, KMail, Thunderbird, and Mozilla Mail. You can also search past newsgroup
    archives and read groups through your browser with Google Groups (see http://groups.google.com).*'
  merge: -1
  img_proc: true
