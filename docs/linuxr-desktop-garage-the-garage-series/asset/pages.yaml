- pgno: 164
  md: '# TOOL KIT: 5.4


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_164_0.png)


    # Get Your Essential Mozilla Preferences Set


    I always set a few preferences options as soon as I open a newly installed version
    of Mozilla. When you spend enough time online, you start to get particular about
    the tools that you use. So, open the Preferences dialog box in Edit > Preferences
    to get started.


    +   1. Set your home page: Navigator.


    I am an odd duck who lives online, so I create my own home page full of links
    to supplement my bookmarks. You''re probably not so weird, so choose a good starting
    place for you on the Internet, such as a search engine or portal site.


    +   2. Choose a search engine: Navigator > Internet Search.


    The Search button on Mozilla''s toolbar is a very nice feature, but it can be
    annoying if the search engine that the button uses is not set to your favorite
    search engine. The popular favorite right now is Google.com.


    +   3. Enable all tabbed browsing options: Navigator > Tabbed Browsing


    I love to use tabbed browsing, so I always check all the boxes for tabbed browsing
    so I only ever need one browser window open.


    +   4. Decide your cookies preferences: Privacy & Security > Cookies


    Cookies are a touchy subject in Web browsers. Advertisers and Web sites can use
    cookies to measure and report your Internet browsing habits for their own demographic
    information. Some people don''t care about it. Some people think that it is spying
    and hate it. I''ve landed on both sides of that argument at different times. Decide
    how you feel, and choose the settings that you want.


    +   5. Make sure pop-ups are blocked: Privacy & Security > Popup Windows.


    I''m not sure that there is anyone who doesn''t hate pop-up ads on the Internet.
    Mozilla''s built-in pop-up blocker works well. You can choose whether you want
    Mozilla to notify you when a pop-up ad is blocked. I like to be paranoid and double-check
    that this feature is enabled.


    When you are done, be sure to click OK to apply your changes. Use Mozilla for
    a bit, and then open the Preferences dialog box again to explore the other options
    you can adjust to suit you.'
  merge: -1
  img_proc: true
- pgno: 165
  md: "# # Mozilla Firefox\n\n| **Program Info** | | | \n|---|---|---|\n| Terminal\
    \ command | firefox | |\n| Program URL | http://www.mozilla.org/products/firefox/\
    \ | |\n\nI always loved Mozilla for its great features, but there were little\
    \ details that I had to look past. With so many components and accompanying programs,\
    \ I felt like I was loading up a troop of drunken circus elephants every time\
    \ I started the program. The themes were a great thing to have, but I had to use\
    \ a theme. That clashed with my carefully matched set of desktop environment themes.\
    \ The Search button was great, but it was too easy to type search terms into the\
    \ address bar and press Enter instead of clicking on the Search button, resulting\
    \ in error messages. I stayed loyal: After all, Mozilla was still my favorite\
    \ browser for Linux. Then Mozilla heard my unuttered annoyances and answered with\
    \ the Firefox browser (see Figure 5.2).\n\n![](img/f2b5f4073f00f9ec5546d9acb9cc6448_165_0.png)\n\
    \nFirefox is Mozilla Jr.—like Donkey Kong Jr., except that it would make for a\
    \ boring video game. The program is much lighter and reduces to a more basic set\
    \ of features. You still have pop-up blocking, tabbed browsing, and a download\
    \ manager, but there is no mail or composer. The Search button has been replaced\
    \ with a small search bar next to the address bar that can search a search engine\
    \ or the current page. There are themes, but they don't take over"
  merge: -1
  img_proc: true
- pgno: 166
  md: 'your whole browser window. The themes are for the toolbar buttons and other
    icons, leaving the window color and widgets to be controlled by your desktop environment
    theme. You can also rearrange the toolbar buttons to place them wherever you like
    and customize which buttons appear.


    The layout of Firefox is much like that of Mozilla and other browsers, but it
    rides itself of the remaining *Netscape baggage* that Mozilla carries. The interface
    strikes a good balance between the usability of Mozilla and the familiarity for
    so many users of Internet Explorer. That makes Firefox not only a good browser,
    but also a good browser to help users transition away from IE. The menus and toolbar
    buttons are similar to Mozilla’s, with a few exceptions for you to explore and
    poke at. The preferences are again accessible in Edit > Preferences. If you have
    a slightly older version (before 1.0), the prefs were in Tools > Options. The
    Preferences dialog box in Firefox is much more usable than Mozilla’s. Categories
    are accessed with five side icons instead of the mouse-clicking frenzy of an expandable
    tree view. Each category’s options are intelligently laid out and are easy to
    decipher.


    Firefox isn’t just a small, simple browser. Extensions are small add-on programs
    that you can download to install or install from right inside the browser. An
    available extension was written for almost anything you can think of, including
    blogging tools, Web development tools, more complex ad blockers and cookie managers,
    games, mouse gestures, and extensions to change how pages are displayed. You can
    open the Extensions dialog box by going to Tools > Extensions. Click Get More
    Extensions to go to the Web site where all available Firefox extensions are listed.
    Using extensions is a terrific way to allow users to make their browser as simple
    or complex as they want to.


    # TOOL KIT. 5.2


    # Find and Install Extensions in Firefox


    Blogger.com is a popular blogging site. You can get a whole blog started for yourself
    at Blogger in less than five minutes. With so many people using their service,
    a user wrote a Mozilla Firefox extension to provide easy access to Blogger.


    +   1. Open the Extensions dialog box at Tools > Extensions. There is nothing
    listed right now, so let’s install one.

    +   2. Click the Get More Extensions link. Firefox opens a separate browser window
    at the extensions Web site.

    +   3. Find the extension named BlogThis, either by going to the blogging category
    or by finding it alphabetically in the list of all extensions. Click it to get
    to the description page for that extension. Click the Install Now link.

    +   4. You see a pop-up warning about installing software. Calm Firefox down and
    click OK.


