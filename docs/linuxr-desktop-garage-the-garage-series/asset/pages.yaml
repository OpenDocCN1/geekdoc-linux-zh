    # # File Manager Icons and Emblems


    Your file manager need not be the plain sea of folders that you see by default.
    You can change many aspects of the look of Nautilus and Konqueror, including icons,
    emblems, and background colors and images. Personally, I tend not to mess with
    these customization options too much because I don''t spend a lot of time in my
    file manager. However, you might be a file-browsing fool who wants green camouflage
    backgrounds and tiny kitty icons.


    You cannot directly change the icon for each item in Nautilus. You can, however,
    add an emblem to any item. An emblem is a small icon that sits next to the item
    denoting a category or whatever you want to use it to denote. To add an emblem
    to an item in Nautilus, right-click the item, choose Properties, and then go to
    the Emblems tab. You will see a whole bunch of small icons. You can check as many
    as you like and then click OK when you are done. You can change the icons for
    file types in Nautilus by installing Nautilus themes that you can download from
    the Internet. Nautilus toolbar icons are affected by your choice of window control
    theme, but not all window control themes include Nautilus icons with them.


    In Konqueror, there are no emblems. You can right-click any item in Konqueror
    to change the icon for that item, just as if it were a desktop item. Icons for
    different file types and for the Konqueror tool bar are often changed when you
    install a new desktop style theme.


    Both Nautilus and Konqueror give you the option to change the background of your
    file manager. You can choose from preinstalled patterns, add your own pattern
    image, or choose a solid color. In Nautilus, go to Edit > Backgrounds and Emblems
    in the menu bar. Nautilus has options for patterns and colors, and a place in
    this dialog box to add new emblem images. In Konqueror, you go to View > Background
    Color or View > Background Image from the menu bar. Both file managers allow great
    flexibility for the look of your directories, but they also provide a couple hideous
    choices to steer clear of.


