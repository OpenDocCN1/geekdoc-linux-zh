- pgno: 208
  md: "The Hot New Stuff feature is a way to share calendar entries with other KOrganizer\
    \ users. KDE lists examples such as the World Cup soccer match or local Linux\
    \ user group (LUG) meetings. To use the feature, you can download calendars from\
    \ KOrganizer’s Web site at http://KOrganizer.kde.org/calen-dars/hotstuff.html.\
    \ You can keep looking for hot new stuff, but I never find any. Maybe someone\
    \ will upload that David Hasselhoff info for us.\n\n![](img/f2b5f4073f00f9ec5546d9acb9cc6448_208_0.png)\n\
    \n**Figure 7.10**  \nThe default view of KOrganizer.\n\nKOrganizer’s other fun\
    \ features don’t involve David Hasselhoff. I like the ability to create sub-to-do\
    \ items. Let’s say you have a to-do task that is “Go to the store.” You could\
    \ create new sub-to-do items for that task, such as “Buy live wombats: Pick up\
    \ new clean suit; Don’t forget to pay before leaving the store.” You can also\
    \ take a sub-to-do and break it out to stand alone with the Make Sub-To-Do Independent\
    \ option. KOrganizer can also use a Microsoft Exchange plug-in for group features\
    \ that adds an Exchange menu when it is installed. What’s Next is a feature that\
    \ shows you the next event in that day. It’s a handy view option for anyone with\
    \ a busy schedule.\n\nThe to-do list is KOrganizer’s task manager. The list is\
    \ viewable in all calendar views to the left of the main calendar area; however,\
    \ changing to the to-do list view brings your to-do list to fill the whole window,\
    \ with no calendar views to distract you from chronic list making."
