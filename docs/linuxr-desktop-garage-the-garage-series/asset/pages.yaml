    # TOOL KIT, 8.2:


    # Adding a Function in an OpenOffice.org Spreadsheet


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_228_0.png)


    +   1. Open OOO Calc and put a bunch of numbers down column A. Fill up from cell
    A1 to cell A10 with any numbers you like.

    +   2. Click in cell A11. Now we will add the total of the numbers in cells A1
    to A10. There are two ways to do this.

    +   3. The first way is to just click the Sum button near the formula bar above
    your spreadsheet. It''s to the left of the equals sign button, and it reads “Sum”
    when you mouse over it. When you click that Sum button, Calc looks to see how
    many rows of numbers you might want to add up. It assumes A1 through A10 right
    away. Click Enter, and you''re done. If you want to change the formula to add
    cells A5 through A10, you can edit the cell value in the formula bar.

    +   4. The second way to create a sum total cell is through the menu. Delete the
    contents of cell A11 so we can start over. Highlight cell A11 again.

    +   5. Go to the menu and choose Insert > Function. A dialog box with a list of
    functions pops up.

    +   6. Scroll down the list. As you highlight each function, you can see a description
    of it to the right. Find Sum in the list. You can fill in each cell label in all
    the number fields, and you can type in the Formula field below. Type in “A1:A10”
    in between the parentheses, and click OK.


    You can now add in the spreadsheet way. Maybe that''s what people mean when they
    say “new math.”


