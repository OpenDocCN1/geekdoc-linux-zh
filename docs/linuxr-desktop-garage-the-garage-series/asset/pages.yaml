    \ down to the Browser Identification category on the left. You can see your current\
    \ identification, disable sending the info, or add new ones to masquerade as any\
    \ browser you want. Mozilla and Firefox can also do this using add-ons.\n\n![](img/f2b5f4073f00f9ec5546d9acb9cc6448_169_0.png)\n\
