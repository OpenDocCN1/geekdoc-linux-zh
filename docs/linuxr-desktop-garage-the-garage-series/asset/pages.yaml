    \ Department  \nPrentice Hall Professional Technical Reference  \nPearson Technology\
    \ Group  \nOne Lake Street  \nUpper Saddle River, NJ 07458\n\nPrentice Hall Professional\
    \ Technical Reference makes no warranty or representation, either expressed or\
    \ implied, with respect to this software, its quality, performance, merchantability,\
    \ or fitness for a particular purpose. In no event will Prentice Hall Professional\
    \ Technical Reference, its distributors, or dealers be liable for direct, indirect,\
    \ special, incidental, or consequential damages arising out of the use or inability\
    \ to use the software. The exclusion of implied warranties is not permitted in\
    \ some states. Therefore, the above exclusion may not apply to you. This warranty\
    \ provides you with specific legal rights. There may be other rights that you\
    \ have that may vary from state to state. The contents of this CD-ROM are intended\
    \ for personal use only.\n\nMore information and updates are available at: **http://www.phptr.com/**"
