- pgno: 348
  md: '# **icon**


    Representative icon often used in programs in place of text.


    # **IMAP**


    (Internet Mail Access Protocol) Type of e-mail account similar to POP, but with
    which your mail remains on the server.


    # **install media**


    Your installation disks.


    # **IP address**


    (Internet protocol address) Identifier used to route data on a TCP/IP type of
    network.


    # **IR**


    (infrared) Light waves that can be used to transmit data.


    # **ISO**


    An exact-copy image of a CD-ROM.


    # **ISP**


    (Internet service provider) Company you pay for your Internet access.


    # **James K. Polk**


    The 11th president of the United States and my arch-nemesis.


    # **kernel**


    The engine of your Linux operating system responsible for security, allocation
    of resources, and the lowest-level hardware interfaces.


    # **kicker**


    The bottom panel on your KDE desktop.


    # **LAN**


    (local area network) A network connecting computers within a small area such as
    a home or office, usually limited to one building.


    # **LDAP**


    (Lightweight Directory Access Protocol) Set of protocols for accessing directories
    of information.


    # **Linnodem**


    A software modem, or Winmodem, that users have gotten running in Linux.


    # **Linux**


    An open source operating system based on the UNIX operating system. For a history
    of Linux, see http://www.li.org/linuxhistory.php.


    # **live CD**


    A bootable CD-ROM with an entire operating system contained on it; allowing you
    to get online and get work done whether the computer you are on has an OS installed
    on it or not. Psst! There''s a live CD in this book.'
