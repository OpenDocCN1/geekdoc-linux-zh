    trying out new distributions painless.


    # Burning Disk Images


    You need to create installation disks if you have downloaded the disk image files
    from the Internet. If you buy a Linux distribution or try out Linux with a live
    CD version, you don''t have to burn any disks.


    When you download a Linux distribution, you need to know what to do with those
    giant files that you now have sitting on your computer. Those files that you downloaded
    are disk images, usually ISOs. An ISO contains all of the files needed for the
    CD that you will create. You might have three or four of those giant files. Most
    Linux distributions are multis disk sets. Each disk image that you download is
    probably going to be larger than 600MB. Depending on your current operating system,
    the ISO files might look like archives to you. Don''t unpack the archive and burn
    a disk as you normally would; burning a disk image is different than burning a
    data or music disk.


    Fedora now also makes a DVD version of the distribution available for download.
    With the DVD disk image, you have fewer disks to burn. If you have a DVD burner
    available and you like playing with new toys, give it a try. The steps for burning
    DVD images might vary in Windows, depending on your software. The steps for burning
    a DVD disk image are the same in Mac OS X for anyone using Disk Utility.


    # Burning Disk Images in Windows


    Most common CD-burning programs in Windows have an option in the main window that
    says something like Burn Disk Image. If your program has that option, you are
    probably all set.'
