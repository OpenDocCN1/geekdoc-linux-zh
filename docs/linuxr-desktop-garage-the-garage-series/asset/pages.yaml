- pgno: 186
  md: '# Mozilla Thunderbird


    | | | |

    | --- | --- | --- |

    | **Terminal command** | thunderbird | |

    | **Program URL** | http://www.mozilla.org/products/thunderbird/ | |


    Just as Mozilla Firebird is the smaller, lighter version of Mozilla''s browser,
    Mozilla Thunderbird (see Figure 6.5) is the junior version of Mozilla Mail. Thunderbird
    is more basic and faster than its Mozilla Mail parent. You will find all the e-mail
    features you need and expect, including support for POP and IMAP accounts, multiple
    accounts, spell checking, encrypted mail, filters, an address book, and good importing
    tools to bring in mail from your previous e-mail program. Thunderbird adds a flexibility
    that is unmatched in other popular e-mail programs with its use of extensions.
    The extensions feature is similar to the extensions in Firefox. You can download
    and install small add-on programs to add specific functionality to Thunderbird
    through the extensions dialog box, accessed through Tools > Extensions.


    There isn''t anything startling in the layout of Thunderbird. There is a left
    side column of folders and accounts, an upper-right message list area, and a lower-right
    preview pane. Thunderbird does, however, give you layout choices in the preferences,
    as well as the capability to customize the toolbar. You can go through the preferences
    by going to Tools > Options. Themes for Thunderbird also change the icon set;
    these are accessible from the menu at Tools > Themes.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_186_0.png)


    # Figure 6.5


    Mozilla Thunderbird.


    # MOZILLA MAIL


    *When you use the Mozilla browser; you probably have Mozilla Mail included. You
    can open Mozilla Mail by clicking the Mail and Newsgroups icon in the bottom left
    of the Mozilla window. If you*


