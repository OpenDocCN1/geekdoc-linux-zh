- pgno: 310
  md: 'Some of the games are the standard ones you expect, such as **Solitaire** (**KPatience**),
    **Mahjongg** (**KMahjongg** and **KShisen**), **Tetris** (**KSirtet** and **KSmiletris**),
    **Minesweeper** (**KMinas**), and **Reversi** (**KReversi**). Other KDE Games
    that have similar GNOME Game counterparts are **KSnakerace**, **kWin4**, **KLines**,
    and **KSame**. Here are others in the KDE Game collection that are different.
    And, yes, most of them start with a K.


    **KAsteroids.** It doesn’t take a genius to deduce that **KAsteroids** is like
    the arcade game Asteroids. The game has good graphics and quick play, and, of
    course, no quarters are needed.


    **KAtomic.** In this game, you are sort of a scientist forming atoms into molecules.
    The game can be challenging and has decent graphics for its type.


    **KBackgammon.** This is a computer version of the board game Backgammon. You
    can play alone, against another player, or even online.


    **KBattleship.** You sunk my . . . never mind. It’s like the board game Battleship
    and supports online play.


    **KBlackbox.** This is a funky little game in which you play hide and seek in
    boxes on a grid. The game takes some good logical thinking as well as a little
    getting used to.


    **KBounce.** Catch as many balls as you can as they move across the field by building
    walls to trap them. **KBounce** seems simple at first, but a good player can come
    up with some elaborate strategies.


    **Kenolaba.** This is like the computer board game version of King of the Mountain.
    You have to shove the other player’s pieces off the board while following the
    rules of the board. **Kenolaba** is based on the board game *Abalone*.


    **KFouliEggs.** **KFouliEggs** (see Figure 12.3) is based on a Japanese game called
    Puco-Puco. The game is similar to Tetris-type games.


    **KJumpingCube.** You try to control as many squares on the board as possible
    to get the best score. This is a multiplayer tactical game.


    **Konquest.** A multiplayer strategy game, **Konquest** consists of trying to
    win by expanding your empire across space.


    **KPoker.** It’s poker. You can play against the computer and choose different
    deck designs for your cards.


    **KSokoban.** You know it’s a Japanese game when there is an odd premise to it
    like this. Hey, kids! Have you ever dreamed of being a warehouse manager and moving
    crates around all day? Then play **KSokoban**!.'
  merge: -1
  img_proc: true
