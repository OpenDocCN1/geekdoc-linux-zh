- pgno: 288
  md: 'To play a song in Noatun, go to File > Open, find the file or directory you
    want to play, and then click OK. This adds the song to your playlist. If you don''t
    have the playlist window open, click Settings > Show Playlist. There is also a
    toolbar icon for the playlist. Simply highlight a song and click the Play button
    on the toolbar or double-click the song in the playlist.


    Skinning in Noatun is different than in other programs. Skins are added as plug-ins,
    and they can rearrange the whole program. Although the default skin is plain vanilla,
    you can find some very interesting skins on Noatun’s Web site at [http://noatun.kde.org](http://noatun.kde.org).


    # TOOL KIT, 11.4

    **Skin Noatun to Play Your CD in Style**


    Not as many skins are available for Noatun as there are for XMMS, but they do
    more fun stuff. Let’s add one of the K-folol set of skins.


    +   1. Open Noatun and then go to Settings > Configure Noatun.

    +   2. Go to Plug-ins. You might see a warning about your playlist stopping play,
    but you can click OK. You’ll see a list of interfaces, many of which you already
    have installed by default.

    +   3. Uncheck the default skin, Excellent, and then check K-folol.

    +   4. When you click Ok or Apply, your Noatun interface changes to use the new
    skin and looks something like Figure 11.6.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_288_0.png)


    You can download new skins from the Noatun Web site and from KDE Look (see [http://www.kde-look.org](http://www.kde-look.org/)).
    You might have noticed that there was also an option for a WinAmp skin loader.
    This option lets you skin Noatun with any of the tons of WinAmp 2.x skins available
    online (see [http://winamp.com](http://winamp.com/)).'
