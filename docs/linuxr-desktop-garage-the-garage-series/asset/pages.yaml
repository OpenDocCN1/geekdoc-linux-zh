- pgno: 385
  md: "# ## About the CD-ROM\n\nThe CD in this book is a Linux live CD of the distribution\
    \ Gnopix. A Linux live CD is a Linux distribution that will boot up and run right\
    \ off the CD without having to install a whole operating system on your computer.\
    \ Gnopix does not include every program that is covered in this book, but you\
    \ can use the CD to get comfortable with a few Linux programs.\n\nYou can read\
    \ more about Linux live CDs in Chapter 1. You can read more about Gnopix at **http://www.gnopix.org**.\n\
    \nTo use the Gnopix CD in this book, you need a PC with these requirements:\n\n\
    +   * PC with Intel-compatible CPU (486 or later)\n+   * Bootable CD-ROM drive\n\
    +   * At least 96 MB for graphics mode\n+   * SVGA-compatible graphics card\n\n\
    Unfortunately, Gnopix does not currently have a Mac version.\n\nPut the CD in\
    \ your CD-ROM drive. Reboot your computer. You will need to make sure that your\
    \ computer is set up to boot from CD when a bootable CD is present. See Chapter\
    \ 1, and the \"Under the Hood\" note titled \"CD Boot\" on page 20 for more information\
    \ about how to boot from your CD drive.\n\n# ## CD-ROM Disclaimer\n\nPrentice\
    \ Hall Professional Technical Reference warrants the enclosed disc to be free\
    \ of defects in materials and faulty workmanship under normal use for a period\
    \ of ninety days after purchase. If a defect is discovered in the disc during\
    \ this warranty period, a replacement disc can be obtained at no charge by sending\
