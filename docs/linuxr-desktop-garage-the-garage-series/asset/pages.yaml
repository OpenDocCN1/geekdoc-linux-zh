- pgno: 216
  md: 'As soon as you get into the program, make a beeline for the menu and go to
    Settings > Configure K’Pilot. On the General tab, make sure that your PDA’s location
    is listed correctly in the Pilot Device field, and enter your user information
    in the Pilot User field. You can play with the Speed setting to get it right.
    A good guide is that older Palm Pilots often use 9600; newer models should be
    set to 19200 and then can try higher speeds later if they work. The Startup Options
    control whether you want the PDA to HotSync automatically on startup (Start Daemon
    at Login), whether to display a panel icon while syncing (Show Daemon in Panel),
    whether you want to stop the background process when you close K’Pilot (Stop Daemon
    on Exit) so that other sync programs can be used on that port; or whether you
    want the daemon to quit right after you HotSync (Quit After HotSync).


    The rest of the default settings on the other tabs of the configuration dialog
    box can probably be left alone. You can play with a few of them to see which you
    need to change. As soon as you have the settings configured, you should first
    do a whole backup of your PDA data. Use the Backup button on the toolbar.


    # The Layout


    There are six main function areas in K’Pilot. You see the icons for each running
    vertically down the left side of the window. The HotSync area shows a log of recent
    syncs, program version info, and a progress meter. There are four viewers, the
    To-Do Viewer, Address Viewer, Memo Viewer, and Generic DB Viewer. The first three
    let you browse through and manage saved data in each of those three categories,
    with functions for adding, editing, and deleting to-do items, addresses, and memos.
    You can also import new memos and export saved memos to text files. With the Generic
    DB Viewer, you can see a list of available databases on your PDA and browse records
    in those databases. The File Installer is the area for installing PDA software
    during a HotSync.


    # Syncing with K’Pilot


    K’Pilot uses conduits to determine what information is synchronized between your
    computer and your PDA during a HotSync. A number of default conduits will probably
    meet your needs. However, you can also search online for conduits written by third
    parties to use in K’Pilot. Go to Settings > Configure Conduits on the K’Pilot
    menu to pop up the conduits dialog box. Here you can check the conduits you want
    to have included for HotSyncs. When you click each conduit in the list, you see
    options for that conduit to the right. When you have all the conduit settings
    how you want them, click your HotSync button and go.


