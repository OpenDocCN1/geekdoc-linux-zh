    wants to admit their age by remembering it), but there is an emulator for it.
    You can find emulators for Nintendo GameBoy, Super Nintendo, Sega systems, PlayStation,
    and even Atari. LinuxLinks has a good list of Linux game emulators online at http://www.linuxlinks.com/Software/Emulators/
    Videogames/index.shtml.


    # WineX/Cede ga


    | **Program Info** |

    | --- |

    | Program URL | http://www.transgaming.com/ |


    # What Is Cede ga?


    Cede ga is a derivative of the program Wine. You will also see the program listed
    in articles and online resources as WineX, the recent old name of the pro- gram.
    The name Wine is an acronym for the phrase “Wine Is Not an Emulator,” so don’t
    call WineX/Cede ga an emulator, either. The program acts like an emu- lator, as
    far as the average user is concerned, despite the differences behind the scenes.
    Whereas Wine is a program that enables Linux users to run Windows programs in
    Linux, Cede ga lets you play games. Why have a differ- ent program for running
    games? That is where the X in WineX comes in.


    > have a ROM for 24 hours and then delete it. A few sites online (such as http://www.sys2004.com/legalarc.htm)
    list old arcade games that are now legal to have as ROMs and home-brew ROMs. Try
