- pgno: 178
  md: '# # E-mail and Newsgroups


    All over the world, there are collections of brilliant letters. Letters serve
    as small time capsules to historians. The paper, the envelope, the stamps, the
    style of the handwriting, the language used, the spelling, any decorative doodles,
    the type of pen used, and the manner in which the letter was saved all give a
    picture of the letter writer, receiver, and time. Our letters are now usually
    short notes sent by e-mail. Even if someone takes the time to write a long, thoughtful
    missive, the words and thoughts are in a constant danger of becoming lost or deleted
    data.


    I received two actual items in the mail last week that were not bills or junk
    mail. I haven''t received real mail in ages. The whole thing baffled me. I held
    the envelopes in my hand and wondered if these were very important messages because
    the senders had gone to the trouble of using a pen and some paper products. I
    imagined all sorts of things. Both were stiff envelopes that contained more than
    just sheets of paper. Why would someone need to send a card of some sort? It wasn''t
    anyone''s birthday. Do they still make birthday cards? I shook my head. Of course
    they still make birthday cards. That''s what that big section in the store is
    for; that section that I always go past without looking in. Both envelopes turned
    out to be innocuous. One was a change of address from a friend, and the other
    was full of pictures.


    I put the opened envelopes on a table carelessly. Later I could feel them staring
    at me with a real-world pressure that my inbox full of e-mail never does


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_178_0.png)'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# E-mail


    to me. I put them on a shelf in the cupboard with the paper phone books that also
    go unused, thinking that I would figure out what to do with them some other time.


    Later in the week, I received an important letter that talked of serious subjects.
    I received that letter as an e-mail. I thought about the irony that the two innocent
    and casual messages had come through the more permanent and solid channel of snail
    mail, while the important and serious message had come through e-mail.


    Historians in future years will probably not have the treasure of letters from
    our time. They might find old files saved in mysterious and deprecated formats
    that no one knows how to open anymore. They might find impersonal-looking printouts
    of e-mails all typed up and indistinguishable from a business memo except for
    their content. They will find the odd letter or card here and there that someone
    like me shoved onto a shelf because they didn''t know what else to do with it.
    They will document the range of years when letters disappeared.


    Although I love to look at old letters and appreciate them, I am one of the killers
    of the letter. I am one of those people who stick to electronic words. I have
    a great sense of history, but I don''t think that it is stronger than my great
    sense of convenience. I love being able to get rid of little pieces of paper and
    have everything stored in neat little files. I am a product of my time. Maybe
    we can find a way to preserve our new electronic history and still infuse it with
    a sense of our time and of our selves.


    Oh, e-mail, we alternately love and hate you. We love receiving nice messages
    from friends and family. We love the efficiency provided by e-mail in office environments.
    We hate the chain letters forwarded to us by unthinking relatives. We hate the
    spam that has threatened to take over e-mail. We hate getting bad news. Let''s
    not shoot the messenger--or, in this case, the e-mail program--for the sins of
    the medium. E-mail is one of the two main things people want to do with a computer,
    the other being surfing for porn--er, I mean, surfing on the Web.


    Linux has always had a great lineup of e-mail programs. Even back in the days
    when the most popular e-mail programs for Linux were text-only affairs that ran
    in the terminal, you could count on those programs having good features and clean
    functioning. Now in our GUI Linux desktop world, we have much prettier options
    for our e-mail programs, but they remain full of good features and clean design.'
  merge: -1
  img_proc: true
- pgno: 180
  md: "# Evolution\n\n# Program Info\n\nFedora/GNOME menu  *Internet > Evolution E-mail*\
    \ \nMandrake/KDE menu  *Internet > Mail > Evolution* \nTerminal command  *evolution*\
    \ \nProgram URL  *http://www.gnome.org/projects/evolution/*\n\nThe first thing\
    \ to say about Evolution is this: If you like Microsoft Outlook, you will like\
    \ Evolution. The program mimics the look and functionality of Outlook wherever\
    \ it can. Evolution has all the personal information management (PIM) elements\
    \ of Outlook, but we are interested in just the mail right now (see Topic 7, \"\
    Schedules, Contacts, and Tasks,\" for more on the other components of Evolution).\n\
    \nEvolution is currently the most widely used e-mail program in Linux (see Figure\
    \ 6.1). The e-mail component of the program doesn't have a lot of innovative features,\
    \ but it does include features that make the program the best solution for businesses\
    \ and busy people. Evolution does everything a mail client should, with support\
    \ for multiple e-mail accounts, great organizing tools, mail filtering, POP and\
    \ IMAP accounts, address recognition, and the capability to import mail from other\
    \ e-mail programs.\n\n![](img/f2b5f4073f00f9ec5546d9acb9cc6448_180_0.png)\n\n\
    # Figure 6.1\n\nEvolution's mail component."
  merge: -1
  img_proc: true
- pgno: 181
  md: 'The look of Evolution has many layers, as Figure 6.1 shows. There is a menu,
    a toolbar, a shortcut bar along the left side, a main content area, a status bar
    at the bottom, and an option for viewing a folder bar. You can use the shortcut
    bar to get to the mail component by clicking the Inbox button. Add the folder
    bar to your view, a must when using e-mail in Evolution, by going to View > Folder
    Bar in the menu. Your folder list contains links to other components of Evolution
    in addition to your mail folders. In the upper-right side, you have a place for
    your message list; there is a preview pane in the lower right. If you will be
    using Evolution only for e-mail, turning off the shortcut bar (View > Shortcut
    Bar) will save screen real estate so you have more room for your mail list and
    preview pane.


    Evolution is a complex program with lots of features, but a couple features are
    uniquely different from other Linux e-mail programs. Business users will appreciate
    Evolution''s capability to work with Microsoft Exchange servers. Evolution can
    also sync mail to your handheld PDA computer. vFolders are an interesting feature
    that enables you to organize your mail in virtual folders by defining filter rules
    for the views; the messages do not physically need to move to another folder to
    be included in a vFolder.


    # ## Setting Up an Account


    A wizard starts the first time you open Evolution so that you can set up a mail
    account. You will need to know your e-mail address, your mail account type, your
    incoming and outgoing mail server addresses, your username, and your password
    to set up a mail account. To get back to add multiple accounts or edit an account''s
    settings, go to Tools > Settings > Mail Accounts.


    # ## Reading E-mail


    When you have an account set up, click the Send/Receive button on the toolbar
    to fetch your mail. When you see messages in the list, just click one to highlight
    it. The message displays in the preview pane below.


    # ## Sending E-mail


    The New button on the toolbar brings up the message-composing window. You can
    send plain-text or HTML e-mails. If you use the text-formatting buttons to bold
    text or change fonts, the e-mail will be sent as an HTML message. Complete the
    address that you want to send the e-mail to. If you have addresses in your address
    book, Evolution tries to autocomplete the address as you type. Add a subject,
    type your message, and click Send. There are also easy options for adding attachments
    and saving messages as drafts.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# # Filtering Spam


    There isn’t a specific spam-filtering tool in Evolution. You need to create rules
    yourself to try to filter the good from the bad. You can create filters by going
    to Tools > Filters.


    # **TOOL KIT, 6.1:**


    **Set up Your Evolution E-mail Account**


    If you stepped through the setup wizard the first time you started Evolution,
    your e-mail address should be set up. If you canceled out of the wizard, want
    to edit your account, want to add an additional account, or just want to play
    along, you can come with me, but you are responsible for refreshments. You also
    need to know your e-mail address, your mail account type, your incoming and outgoing
    mail server addresses, your username, and your password.


    +   1.  Open the settings by choosing Tools > Settings > Mail Accounts on the
    menu bar.

    +   2.  Click Add to add an account. The same wizard that comes up the first time
    you start Evolution pops up, the Evolution Setup Assistant (see Figure 6.2). Step
    through the wizard and fill out all the fields with your information.

    +   3.  To edit your account, highlight the account on the list in the Mail Accounts
    section and click the Edit button.

    +   4.  The Account Editor dialog box has several tabs: Identity, Receiving Mail,
    Sending Options, Sending Mail, Defaults, and Security. Each tab is easy to go
    through and complete. You don’t need all the options on every tab to set up your
    e-mail account; you need only your basic e-mail account info.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_182_0.png)


    **Figure 6.2**


    The Evolution Setup Assistant is used for new mail accounts.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# KMail


    # Program Info


    | | | |

    | :--- | :--- | :--- |

    | Fedora/GNOME menu | *Internet* > More Internet Applications > KMail | |

    | Mandrake/KDE menu | *Internet* > Mail > KMail | |

    | Terminal command | kmail | |

    | Program URL | http://kmail.kde.org/ | |


    Unlike Evolution, KMail is just an e-mail client. I like programs that just do
    one thing and do their one thing well. KMail is just such a program. The KDE personal
    information management suite, Kontact, brings KMail into its wider program to
    create something more like Evolution, but you can still open and work with KMail
    on its own. KMail is a well-rounded e-mail program that has all the features you
    would expect, including support for POP3 and IMAP accounts, encrypted e-mail,
    and good mail filtering. With KMail, you can also use multiple identities and
    multiple mail accounts. KMail lets you filter messages on the server to avoid
    downloading certain attachments or spam and supports displaying HTML e-mail messages.


    Both the interface of KMail and its features keep to basics (see Figure 6.3).
    You have your mailboxes, folders, and listed accounts displayed in a column on
    the left, with your listed messages and a preview window on the right. The toolbar
    buttons are well labeled and easy to figure out. Simply highlight a mailbox or
    folder to view its contents, and then highlight a message to read it. The composer
    window allows for sending either plain-text or HTML messages and includes a few
    options for formatting text.


    # Figure 6.3


    The KMail interface.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_183_0.png)'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'KMail is simple but also sports some strong and unique features. The mail importing
    supports pulling in stored mail from Outlook Express, Netscape, Thunderbird, Eudora,
    and others. You just need to make sure that the format of the exported mailboxes
    from your old e-mail client matches up with a format that KMail will import, such
    as mbox and maildir mailboxes. One unique feature in KMail is the capability to
    bounce back mail to a sender, simulating a nonexistent e-mail address. This is
    great for spam because you can get your address off the lists of some spammers
    if they think the address doesn’t work.


    # # Setting Up an Account


    The first time you start KMail, the Identity wizard starts, but you can also go
    to **Settings > Configure KMail** in the menu to open the configuration window
    and go to the **Identities** section. Stepping through the wizard is easy. You
    need to know your e-mail address, your mail account type, your incoming and outgoing
    mail server addresses, your username, and your password. To set up multiple addresses
    or identities, open the configuration dialog box from the menu and add them with
    the **New** button.


    # # Reading E-mail


    When your account is set up, you can retrieve your new mail by clicking the **Check
    Mail** button on the toolbar or by going to **File > Check Mail**. Highlight a
    message in the list to read the message in the preview window.


    # # Sending E-mail


    Select the **New Message** icon on the toolbar or choose **File > New Message**
    from the menu. The new message composer window pops up. This will look familiar
    if you have used any other e-mail program. Just fill out the address to send the
    message to, compose the message, and click **Send**, or you can choose to save
    your message as a **draft** to finish later.


    # # Filtering Spam


    The internal filtering tools in KMail are robust but are not necessarily specific
    to spam. Whereas other e-mail programs try to flag suspected spam messages for
    you, in KMail, you have to set up those filters yourself. Go to **Tools > Create
    Filter** to get started.'
  merge: -1
  img_proc: true
- pgno: 185
  md: "# Send a Test Message in KMail\n\nYou have set up your account in KMail, and\
    \ you think you have gotten everything right. If you’re of the meticulous sort,\
    \ the one way to know for sure that everything is working is to send yourself\
    \ an e-mail. That might sound silly at first, like a much more complex and technical\
    \ version of talking to yourself. I actually send myself e-mails all the time\
    \ as reminders and notes about things. Either way, sending a test e-mail is a\
    \ quick and easy way to get familiar with the basic functions of KMail.\n\n+ \
    \  Open KMail and make sure you have already set up your identity and account.\n\
    +   \n+   Select New Message on the toolbar or go to File > New Message to open\
    \ the composer window (see Figure 6.4).\n\n![](img/f2b5f4073f00f9ec5546d9acb9cc6448_185_0.png)\n\
    \n![](img/f2b5f4073f00f9ec5546d9acb9cc6448_185_1.png)\n\n+   Put your own e-mail\
    \ address in the To field and then write your message. If you use any of the text—formatting\
    \ buttons above the message field, your message will be sent as an HTML message.\
    \ I am an adherent to the plain-text message only doctrine, myself.\n+   \n+ \
    \  If you want to add an attachment to your e-mail, click the Attach File button\
