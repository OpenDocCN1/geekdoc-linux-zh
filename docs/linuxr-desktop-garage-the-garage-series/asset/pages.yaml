  img_proc: true
- pgno: 32
  md: 'Availability: Download images from mirror sites or buy disks from Slackware''s
    online store.


    Cost: Free to download, $39.95 from the online store.


    # Sun Java Desktop System


    The initial version of Sun''s JDS is labeled as an enterprise one aimed at business
    users. JDS uses GNOME only and includes most features you would expect in any
    distro. As with the other commercial Linux distros, JDS has a lot of open source
    software that you find in other distributions, but it brands the programs with
    logos and themes so that the colors all match. One difference is the inclusion
    of the Java runtime environment: A few of the standard applications and accessories,
    such as a text editor and media player, are Java applications.


    Install: Sun JDS uses a variant of SUSE''s YaST installer, so the install is smooth
    and won''t throw any curves at users.


    Pros: Everything in this distro looks nice and goes together well. Sun''s Star
    Office is included; it would have to be purchased separately with other distributions.
    The integrated Java runtime environment and Java Studio Standard developer tools
    make this a great distro for Java developers.


    Cons: If you want to try any other desktop environment but GNOME, such as KDE
    or Enlightenment, you will have some hurdles to jump. No software for emulation
    is included or easily installed. JDS seems slow compared to other distros run
    on the same hardware.


    Availability: Must be purchased through Sun.


    Cost: Licensing is aimed at businesses: $100 per desktop per year, or $50 per
    employee per year for company-wide purchase.


    # SUSE


    SUSE is another distro that has been around for a while. There are plenty of users,
    but the community is not as big as a few of the other distributions. The community
    grew in 2003 when bad blood over the Fedora transition converted some Red Hat
    users to SUSE.


    Install: SUSE''s YaST2 (Yet Another Setup Tool) installer is really about as affordable
    as Fedora or Mandrake''s installation. Arguments about more complex aspects can
    be made, but listening to those arguments sounds like quibbling. It''s at least
    as easy as a Windows install.


    Pros: Having fairly recently been bought by Novell, SUSE should be easier to acquire
    than in the past. The distro is RPM based and can also use APT. There isn''t much
    to keep SUSE from being considered on the same level as Fedora and Mandrake for
    new users. Besides, everything on your desktop is themed green by default— who
    doesn''t like that? It''s like being smacked in the face with a fresh leafcushion
    every time you log in.


    Cons: Releas es have traditionally been less frequent, but hopefully that can
    change. A few of the tools and utilities are a little more difficult to use than
    other distros. SUSE is used by fewer people, so compiled packages and help from
    online sources might not be as available as they are for Fedora and Mandrake.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '**Availability:** Downloads of ISO images are available, and CDs can be purchased
    online from SUSE. Boxed editions also are available from third-party vendors.


    **Cost:** Free to download images, $29–$89 for CDs.


    # ## Xandros


    Xandros started out as a commercial distribution but now has a limited, ad-supported
    version available for free download. This distro is a fairly new player (although
    the base development came from the old Corel Linux) and has gotten some popularity
    and press for its good usability.


    **Install:** Installation is easy to zip through, with GUI screens and lots of
    choices suggested for you.


    **Pros:** Like Linspire, Xandros works right out of the box. The distro shows
    the work that has gone into it with an array of tightly integrated utilities that
    are stable.


    **Cons:** A limited number of applications are included. Some proprietary programs
    mean that you will have to wait for the company’s next release if you want those
    updated. Linux users are used to a little more flexibility than that. The only
    free version is ad supported. Support will have to come more from the company
    than from other users.


    **Availability:** Download or buy from Xandros.


    **Cost:** Free ad-supported download version, or $49–$99 for commercial versions.


    # ## Yellow Dog


    For years, Yellow Dog was the classic choice to run Linux on a Mac. The distro
    isn’t horribly innovative. Yellow Dog is essentially a direct port-over of the
    last Fedora version available, with certain conventions and tools of its own thrown
    in.


    **Install:** Yellow Dog uses Fedora’s Anaconda installer, so the install is just
    as easy as Fedora. The installer also keeps its core concept of Apple users in
    mind, with a good selection of Apple hardware choices.


    **Pros:** Yellow Dog is RPM based and also has Apt and Yum versions (update tools)
    available. Many of the utilities are ports from Fedora, so you will find that
    much of the online help from users applies to both distros. The company also maintains
    a good support mail list with archives.


    **Cons:** Anytime you are using Linux on PPC, you will have more trouble finding
    compiled packages. Apt and Yum are available, but you are limited to only a few
    repositories. Some of the tools feel a little clunkier than they do on Fedora,
    but the tools are there and do work.


    **Availability:** Yellow Dog has downloads of ISO images on mirror sites and CDs
    available for purchase. Boxed editions also are available from third-party vendors.


    **Cost:** Free download of ISOs, $25–$85 for disks, depending on what version
    you want.'
