- pgno: 115
  md: '# Create a Dial-up Connection with KPPP


    After you have successfully established that your modem will work in Linux and
    have gotten Linux to detect the modem, you need to set up the connection in KPPP
    so the modem knows where to dial up.


    +   1. Start KPPP (see Figure 3.7). You are asked for your root password.


    +   2. Go to Setup. A configuration window opens in which you should click the
    Modem button.


    +   3. Before you try to enter the info yourself, click the Query Modem button.
    KPPP searches for your modem. If it finds your modem, you will see a results window
    and KPPP will fill in the information it needs in the Modem area. If your modem
    is not found, you will see an error.


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_115_0.png)


    ![](img/f2b5f4073f00f9ec5546d9acb9cc6448_115_1.png)


    In case of an error, first check the device location that KPPP is using to find
    your modem under Modem Device in the Device tab. This is a drop-down list, so
    you can choose different ones and keep selecting Query Modem if you want to try
    the hit-and-miss method. If KPPP cannot find your modem, it is probably not compatible
    with Linux.


    +   4. Next, go to the Accounts tab. Click New to add a new account. You can then
    use the setup wizard and the settings that your Internet service provider (ISP)
    gave you.


    +   5. Close all configuration windows that you might still have open. In the
    main KPPP window, choose your new account from the Connect To field. You also
    need to complete the Login ID and Password fields.


    Now you should be ready to try to connect. You will hear all the creepy noises
    that modems make. When the connection is successful, the KPPP window minimizes
    to an icon on your panel.


