    buying a distribution is an easy way to give back.


    # ## Buy Online


    If you go to the Web sites of many Linux distributions, you will see links so
    that you can purchase copies online. Just as with buying a packaged set of disks
    and manuals in the store, buying a Linux cdistro online gives you the chance to
    financially contribute to your favorite distribution and to open source software.
    Most of the time with purchasing online, you will have the boxed set sent to you
    by mail. This method works if you don’t need instant gratification.


    # ## Download CD Images


    Did I mention that Linux is free? Let me say it again. Linux is free. You can
    get your copy of Linux by downloading it off the Internet. Unless you into self-torture,
    you will want to have a broadband connection to download any distro. Although
    there is a possibility of doing a network install, that can be another form of
    self-torture. Your best bet is to download CD images, called ISOs. A great Web
    site to visit for any distribution that you want is `http://www.distrowatch.com`.
    Distro Watch has descriptions and links to most of the distributions available,
    a top 10 list of the major distributions, and pricing so you know which ones are
    free and which are commercial distros. The information pages for each distribution
    also list which versions of popular programs are included.


