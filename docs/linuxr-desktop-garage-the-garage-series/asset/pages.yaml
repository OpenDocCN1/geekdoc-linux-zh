    Yum (Yellow Dog Updater Modified) is a lot like Apt. Just like Apt, Yum was developed
    for a different Linux distro, Yellow Dog. Just like Apt, Yum is a command-line
    updating tool. Just like Apt, the commands you need to install or update programs
    are intuitive and easy to remember. Yum is not only an automatic updater, but
    it is also a package-management tool for RPMs. If an RPM


