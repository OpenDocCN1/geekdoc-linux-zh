    # ZENworks Partition


    There are older machines that do not support an operating system boot environment.
    For images from the network in a pre-operating system environment. For these machines,
    ZENworks offers the capability to place a ZENworks partition on the local machine,
    which holds the Linux pre-operating system boot environment that would normally
    be sent to the device over PXE.


    When a ZENworks partition is placed on the device, the hardware first boots to
    the ZENworks partition that is load to the Linux environment and checks with the
    ZENworks Imaging server to see whether the system has been configured to take
    or restore an image to the system. This provides the automated capabilities of
    image management without the need for PXE.


    To install a ZENworks partition on the device, complete the following steps:


    +   1. Create a boot CD of the ZENworks boot system by burning the .iso image
    (/opt/nov11/zenworks/zdm/imaging/winutils/bootcd.iso) from the ZENworks server
    onto a CD or DVD. Configuration options can be manipulated via a settings.txt
    file on the CD.

    2. Boot the device with the ZENworks Imaging CD.

    3. Select Install/Update ZEN Partition from the presented menu.

    4. If the Imaging Server address is not specified in the settings.txt included
    in the CD, enter the IP address of the server, when prompted.

    5. The system then creates the partition and installs the Linux boot environment
    into that partition. When completed, the system prompts you to remove the CD and
    reboot.


    This adds the ZENworks partition, which checks at each reboot to see whether there
    is any administered preboot work for the device. If so, the device performs that
    and then boots into the operating system.'
