  md: '# Registering Devices into the System


    This chapter discusses registering devices in ZENworks 7 Linux Management. It
    primarily discusses two methods for registering devices:


    +   - Manually through the command line

    - Through the install


    # Registration Keys and Registration Rules


    After you have installed into the ZENworks Linux Management server, you should
    go into the ZENworks Control Center and set up registration keys and/or registration
    rules.


    Registration keys and rules tell ZENworks Linux Management how you want managed
    devices to be registered with the system.


    # Registration Keys


    Registration Keys are best used for situations where you want to create a limit
    on the number of devices that are registered. For example, if you know that a
    specific department has 10 workstations, you could create a registration key that
    is limited to 10 devices. As the devices are registered, you can easily see how
    many have been registered.


    To create a new registration key, follow these steps:'
