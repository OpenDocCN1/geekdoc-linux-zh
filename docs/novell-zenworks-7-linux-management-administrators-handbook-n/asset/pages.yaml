  md: '# SELECT THE DAYS OF THE WEEK


    The first items to select are the days of the week when you want the content replication
    processes to run. Select the days of the week by clicking on the check box under
    your desired days.


    # RESTRICT SCHEDULE TO THE FOLLOWING DATE RANGE


    Select the Restrict Schedule Execution to the Following Date Range check box if
    you want the system to perform the scheduled activity only during a specified
    calendar range. Then enter a start and end date by selecting the calendar browse
    button and picking the date on the pop-up calendar view.


    # SELECT WHEN SCHEDULE EXECUTION SHOULD START


    This area enables you to select the time or time range when you want the content
    replication process to begin, on the days that you have specified earlier.


    Choose one of the following options:


    +   * Start Immediately at Start Time—This activates the content replication system
    at the specified start time.


    +   * Start at a Random Time Between Start Time and End Time—This choice generates
    a random time that is between the start and end times. Then the content replication
    process begins at randomly selected time.


    +   * Start Immediately at Start Time, and Then Repeat Until End Time—This option
    starts the content replication process at the specified start time. It then relaunches
    the content replication process at the interval specified in the Hours and Minutes
    fields. The system continues to relaunch the process at the interval specified
    until the end time is reached.


    > NOTE


    Subsequent launches of the content replication process result in only files that
    have changed since the previous replication process being sent to the secondary
    server.


    Next, specify your start time and end time. Select the hour and minutes from the
    drop-down list and choose a.m. or p.m. Enter in both the start and end times.


    Next, if the time you have specified is a Greenwich Mean Time or Universal Time
    rather than the local time of the primary server, check the check box next to
    Use the Greenwich Mean Time (GMT) option.'
