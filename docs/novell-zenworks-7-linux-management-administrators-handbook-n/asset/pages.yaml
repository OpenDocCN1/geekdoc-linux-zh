- pgno: 164
  md: 'Login, a new login session is started on the remote device and you are prompted
    for a username and password.


    +   - Port—Enter the port that you have configured for VNC operations. The default
    is 5950.


    # NOTE


    It is important to understand the difference between Remote Control and Remote
    Login. Remote Control performs what you would traditionally expect: viewing the
    user''s desktop and having control over the mouse and keyboard. Remote Login,
    however, launches a new login session (much like a terminal server), which prompts
    you for a login and creates a new desktop based on the username and password you
    provide.You have your own desktop and are not controlling any other user''s desktop.


    Select the OK button to perform the requested remote management operation. You
    can configure various options (ports, whether to prompt the user, and so on) on
    remote control by making settings changes under the Remote Management section.
    See Chapter 6, "System Settings" for more information.


    # Imaging a Device


    There is value in an organization having a standard image to be applied to Linux
    devices, both servers and workstations. This often can be most valuable when it
    comes to diagnostics and repair of a device with problems. The administrator may
    work to repair a user''s workstation, for example, and if after a specific time
    a repair cannot be completed, it is often most effective to just reimage the device.


    ZENWORKS Linux Management enables you to take and apply images onto devices. Before
    you can take an image using PXE, you must have the novel-proxydcp running on the
    ZENWORKS server. If you want to take an image from booting from a CD or from a
    ZENWORKS partition on the device, you just need to make sure that the imaging
    server (pbpserv) and the novel-zmgreproboot server is running.


    This can be set to run through the YAST tool modifying runlevels for each individual
    service.


    The taking of an image can be done either automatically through ZENworks Control
    Center or manually from the device. The following sections describe how this can
    be accomplished.'
  merge: -1
  img_proc: true
- pgno: 165
