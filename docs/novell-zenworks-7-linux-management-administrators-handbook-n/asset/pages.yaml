    # Mirroring External Sources into ZENWorks Linux Management


    Patches and updates from various Linux sources are published on the Internet.
    For large deployments, you also may have several ZENWorks Management zones in
    your environment. Mirroring enables you to have ZENWorks retrieve large numbers
    of packages from an external source outside of your network, such as from the
    Internet or from outside your local zone.


    Using mirroring, you can maintain updated packages for operating systems such
    as SUSE LINUX and SLES LINUX as well as Red Hat systems. With'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# CHAPTER 12: Keeping ZENworks Linux Management Servers Synchronized


    mirroring you can also share catalogs and bundles between two independent zones.


    Mirroring is accomplished through the use of configuration files and a command-line
    tool called zlmmirror. To schedule mirroring to occur on a regular basis, you
    need to configure a CRON entry and schedule when the zimmirror command should
    run.


    The zimmirror usage process typically works in the following fashion:


    +   1. The system administrator creates a configuration file (or converts a previously
    ZENworks Linux Management configuration file) called zimmirrorconf.xml, which
    details specifics of the remote and local servers, as well as catalogs, bundles,
    and packages are to be copied. The zimmirrorconf.xml file should be located in
    the /etc/opt/novell/zenworks directory.


    +   2. System administrators set a cron entry or other scheduled time for zimmirror
    to run.


    +   3. Using the zimmirrorconf.xml file, zimmirror determines what catalog data
    to return from the servers.


    +   4. zimmirror authenticates to the remote server and downloads information
    about selected catalogs.


    +   5. zimmirror authenticates to the local server as a standard client, and downloads
    information about those same catalogs.


    +   6. Catalog data from the remote and local servers is compared with the package
    and filtering information from zimmirrorconf.xml, to determine which packages
    need to be downloaded.


    +   7. Packages are downloaded from the remote server.


    +   8. zimmirror authenticates to the local ZENworks Linux Management server as
    an administrator and adds the packages to the appropriate bundles, creating catalogs
    as necessary.


    Now''s take a closer look into the zimmirrorconf.xml file.


    # Looking at the zimmirrorconf.xml File


    The zimmirrorconf.xml file describes the URL locations of the source servers that
    will be providing the information to the local primary server running the zimmirror
    command. Additionally, the zimmirrorconf.xml file configures which catalogs or
    channels should be retrieved and how to place the packages from these sources
    into ZENworks Linux Management.'
  merge: -1
  img_proc: true
- pgno: 180
  md: "# Mirroring External Sources into ZENworks Linux Management\n\nFor mirroring\
    \ to function, you must define a single source server (you can have only one)\
    \ and a single destination server (only one here, too). You can then define any\
    \ number of catalog configurations that describe how the source server's content\
    \ should be mapped into the ZENworks Linux Management server.\n\nBecause there\
    \ are times when you want to mirror from many different sites, zlmirror takes\
    \ a config file as a parameter. If no parameter is specified, zlmirror uses the\
    \ default zlmirrorconf.xml file. If you want to mirror from multiple sources,\
    \ create a configuration file for mirroring from each source, and then create\
    \ a cron job that launches zlmirror with the desired config file for each source\
    \ you want to mirror.\n\n# SOURCE SERVER DEFINITION\n\nThe following template\
    \ is used to define the source server:\n\n```\n<SourceServer>\n  <Base>http://red-carpet.ximian.com/</Base>\n\
    \  <Type>rce</Type>\n  <User />\n  <Password />\n</SourceServer>\n```\n\nThe Base\
    \ path to the server you want to mirror must be in one of the formats, depending\
    \ on the type:\n\n+   - For ZENworks Linux Management sources, use the format\
    \ of https://server\n- For Red Carpet Enterprise servers, use the format of https://server/path\n\
    - For YAST updates, use the format of http(s):://server or http://server/path\n\
    - For Red Hat Network updates, use the format of http(s):://server/path\n\nThe\
    \ type of server must be one of the following specifications:\n\n+   - ZLM for\
    \ ZENworks 7 Linux Management Servers\n- RCE for Red Carpet Enterprise or ZENworks\
    \ 6.x Linux Management systems\n- YAST for YAST Online Update servers\n- RHN for\
    \ Red Hat systems\n\nThe user is the name of an account that has rights to read\
    \ the packages and information from the source server. The Password field is the\
    \ corresponding password for the user account."
  merge: -1
  img_proc: true
- pgno: 181
  md: "# CHAPTER 12: Keeping ZENWorks Linux Management Servers Synchronized\n\nThe\
    \ User is the name of an administrator account that has rights to write and create\
    \ the bundles and catalogs into the destination server. If no user is specified,\
    \ zmmir reads the identity from the following files, depending on the type:\n\n\
    +   - ZENWorks 7 Linux Management: /etc/opt/novell/zenworks/zmd/device\n- Red\
    \ Carpet Enterprise or ZENWorks 6.x Linux Management: /etc/ximian/mookie\n- YAST:\
    \ /etc/sysconfig/onlineupdate\n- Red Hat Network: Leave the username empty in\
    \ the form.\n\nzmmirror reads the following locations for the password portion\
    \ of the form:\n\n+   - ZENWorks 7 Linux Management: /etc/opt/novell/zenworks/zmd/secret\n\
    - Red Carpet Enterprise or ZENWorks 6.x Linux Management: /etc/ximian/partnernet\n\
    - YAST: /etc/sysconfig/onlineupdate\n- Red Hat Network: Leave the password empty\
    \ in the form.\n\n# DESTINATION SERVER DESCRIPTION\n\nYou must use the following\
    \ format to describe the destination server:\n\n```\n<DestinationServer>\n  <Base>https://localhost/</Base>\n\
    \  <Type>zlm</Type>\n  <User>Administrator</User>\n  <Password>password-</Password>\n\
    </DestinationServer>\n```\n\nThe User is the name of an administrator account\
    \ that has rights to write and create the bundles and catalogs into the destination\
    \ server. If no user is specified, zmmirror reads the identity from the same files\
    \ as specified in the preceding section.\n\nThe Base path in the form needs to\
    \ be of the format https://server for ZENWorks 7 Linux Management and /path/on/filesystem\
    \ for STATIC types, where the mirroring just copies the packages to the file system.\n\
    \n# CATALOG AND BUNDLE CONFIGURATION\n\nYou need to provide details on the catalogs\
