    \ a device, group, or folder, the action effectively assigns all policies in that\
    \ group.\n\nTo create a policy group, complete the following tasks:\n\n+   1.\
    \ Go to a Policies subfolder.\n2. Select the Add menu item in the list view.\n\
    3. Select the Policy Group menu item from the pop-up menu. This starts up the\
    \ Create New Group Wizard.\n4. Enter a unique group name into the the Group Name\
    \ field. See Figure 9.13 for a sample screen."
