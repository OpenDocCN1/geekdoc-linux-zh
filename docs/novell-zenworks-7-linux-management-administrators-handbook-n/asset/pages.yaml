- pgno: 132
  md: "# Assigning a Policy Through the Command Line\n\nWhen ZENworks Linux Management\
    \ is installed, an additional command-line tool is also installed on the primary\
    \ and secondary servers. This tool is zlman and is located in the /usr/bin directory.\
    \ This command-line tool enables you to perform almost any administrative function\
    \ that can be done via the web interface.\n\nTo assign a policy using the command-line\
    \ zlman tool, complete the following:\n\n+   1. Log in to one of the ZENworks\
    \ servers.\n2. Use the following command:\n   zlman workstation-add-policy <options>\
    \ <workstation> <policy>\n3. Optionally add the following options:\n   - -user=<name>,\
    \ enter an administrator user name\n   - -password=<string>, enter password for\
    \ the user specified\n\n# Policy Groups\n\nZENworks Linux Management makes it\
    \ possible to create policy groups. A policy group constitutes a set of policies\
    \ that can be assigned via a single group. In all the places in ZENworks Control\
