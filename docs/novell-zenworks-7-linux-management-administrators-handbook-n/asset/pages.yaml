  md: '# APPENDIX A


    # Commands


    This appendix discusses the command-line utilities for ZENworks Linux Management.


    There are three different command line utilities:


    +   - zlman—This is the main utility for managing ZENworks Linux Management.


    +   - rug—This is the utility with which the agent on the managed device performs
    tasks such as install, update, remove software, and so on.


    +   - zlmirror—This is the utility used to mirror bundles and catalogs, from remote
    ZENworks Linux Management, YAST Online Updates, and RedHat Network servers, to
    your local ZENworks Management server or to a local directory.


    Each command is labeled with the command name on the outer edge of the page. If
    there is a shortcut, it is displayed in parentheses next to the command. The syntax
    line is followed by a brief description and a list of any additional options.


    # zlman


    The following options are understood by all commands:


    ```

    -?, --help—Get help on a specific command.

    -U, --user=<username>—Specify username.

    -P, --password=<password>—Specify password.

    -log=<logfile>—Specify the file to log (default: /var/opt/nov11/log/zenworks/zlman.log).

    -d, --debug—Display debugging output.

    ```'
  merge: -1
  img_proc: true
