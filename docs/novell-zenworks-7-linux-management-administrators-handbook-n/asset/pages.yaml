- pgno: 69
  md: '# CHAPTER 6: System Settings


    # SELECT THE DAYS OF THE WEEK


    The first items to select are the days of the week when you want the inventory
    scan to run. Select the days of the week by clicking on the check box under your
    desired days.


    # RESTRICT SCHEDULE TO THE FOLLOWING DATE RANGE


    Select the Restrict Schedule check box if you want the system to perform the scheduled
    activity only during a specified calendar range. Then enter in a start and end
    date by selecting the calendar browse button and picking the date on the pop-up
    calendar view.


    # SELECT WHEN SCHEDULE EXECUTION SHOULD START


    This area is where you select the time or range when you want the inventory scan
    to begin, on the days that you have specified earlier.


    Choose one of the following options:


    +   * Start Immediately at Start Time—This activates the inventory scan at the
    specified time.

    * Start at a Random Time Between Start Time and End Time—This choice generates
    a random time that is between the start and end times. Then the inventory scan
    begins at that randomly selected time.

    * Start Immediately at Start Time, and Then Repeat Until End Time—This option
    starts the inventory scan at the specified time. Then it relaunches the inventory
    scan at the interval specified in the Hours and Minutes fields. The system continues
    to scan at the interval specified until the end time is reached.


    Next, specify your start time and end time. Do this by selecting the hour and
    minutes from the drop-down list and choose either a.m. or p.m. Enter in both the
    start and end times.


    Next if the time you have specified is a Greenwich Mean Time or Universal Time
    rather than the local time of the primary server, then check on the box next to
    the Use Greenwich Mean Time (GMT) option.


    # SET THE BLACKOUT TIME RANGES WHEN EXECUTION SHOULD NOT OCCUR


    This option enables you to specify time ranges, which may fall within a calculated
    start and end date. For example, let''s say that you would like to do an inventory
    scan every Saturday. However, at the end of each business quarter you want your
    servers working on end-of-quarter activities and not'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'consuming cycles transmitting inventory data. You can do so by entering in
    your schedule and then selecting blackout dates for the end of each quarter. This
    way, if the calculated start time occurs within a specified blackout date, ZENworks
    does not launch the inventory scan. The inventory scan is not started again until
    the next scheduled time.


    To enter in blackout dates, complete the following:


    +   1. Press the Add menu item. A pop-up dialog box is presented (see Figure 6.11).


    FIGURE 6.11

    Pop-up dialog to enter blackout dates and times.


    ![](img/1dc9ba96bb55315f8828b75f085ce4b4_70_0.png)


    +   2. Enter the start date for the blackout period by selecting the calendar
    icon next to the Start Date field. This brings up the calendar-up, where you can
    select your date.


    +   3. Enter the start time when the blackout period is to begin on the start
    date. Do so by clicking on the drop-down list next to this field and selecting
    a specific hour of the day.


    +   4. Enter the end date for the blackout period. This is initialized to be the
    same date as the chosen start date.


    +   5. Enter the end time when the blackout period is to end on the end date.
    Do so by selecting an hour from the drop-down list.


    +   6. Press the OK button to have the time entered in as a blackout specification.


    The entered blackout period is displayed on the screen. The blackout period begins
    at the specified time and ends at the selected end time on the end date.


    To remove previously entered blackout periods, select the check box next to the
    listed blackout period and then click on the Remove menu item.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# CHAPTER 6: System Settings


    # Event Schedule Type


    The event schedule enables you to select an event that triggers the inventory
    scan. Figure 6.12 is an example of this type of schedule.


    FIGURE 6.12

    Event schedule page.


    ![](img/1dc9ba96bb55315f8828b75f085ce4b4_71_0.png)


    You can choose from two types of events: Runlevel Change and User Login.

    When Runlevel Change is set, the inventory scan happens when the runlevel is changed
    on the machine. Runlevels vary from one distribution to the next, there are some
    standard runlevels:


    +   - 0—Halt the system.

    - 1, s—Single user.

    - 6—Reboot the system.

    - a, b, c—Process only entries in /etc/inittab that are marked with runlevel a,
    b, c.

    - q—Reread /etc/inittab.


    You can find the runlevels for the distribution by checking the /etc/inittab file
    for runlevels.

    As you would guess, choosing User Login performs the inventory scan when the user
    logs in to the machine.


    # Relative to Refresh Schedule Type


    The Relative to Refresh schedule enables you to perform an inventory scan relative
    to a setting, policy, or bundle refresh. Figure 6.13 is an example of this type
    of schedule.


    Choose one of the following Schedule Execution options:


    +   - Start Immediately on Refresh—This starts the inventory scan at the same
    time as the refresh occurs.'
