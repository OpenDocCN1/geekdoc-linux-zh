- pgno: 156
  md: '13. Next choose whether the sort should be ascending or descending based on
    the primary sort. Make the same selection for the secondary sort, if you choose.
    Press Next. Step 3 of the wizard should now be shown (see Figure 10.6).


    # FIGURE 10.6


    Step 3 (Filters) of the Create a New Report Wizard.


    ![](img/1dc9ba96bb55315f8828b75f085ce4b4_156_0.png)


    14. On Step 3 of the wizard you may choose any filters that you want to limit
    the data that is selected from the system. If you choose not to do filtering,
    just press Next. If you want to filter the selections, complete the following:


    +   - Select the New Filter menu item, this adds a filter line to the page.

    - In the first field of the filter line, choose whether the filter should have
    a NOT.

    - In the second field select one of any the possible data members that are available
    in the system.

    - In the third field you can select any Boolean or comparison operator that is
    appropriate for the member selected. Refer to Table 10.1 for a listing of these
    operators.

    - If you want to remove a filter line, mark the check box next to the filter line
    and press the Remove menu item.

    - As you add more filter lines, you will notice a small "or" is presented to the
    right. This helps you understand that the filter lines will be logically ORed
    together. For example, a two-filter line has the Boolean operation of saying "If
    filter1 or filter2 is true then include in the report."

    - If you want to have the system perform a logical AND between filter lines rather
    than an OR, select the OR in the Sets To Be'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# CHAPTER 10: Reporting


    field. This causes all individual filters to be ANDed together and all groups
    (explained later) to be ORed together. So, for example, with a two-filter line
    and the Sets Are to Be field set to OR, the logic "If filter1 and filter2 are
    both true for record then include the item in the report."


    +   - For more complex filtering, you may construct groups of filters and have
    those groups ANDed or OR together into a more complex Boolean expression. To add
    a group, press the New Sets menu item. When you do, all existing filters are considered
    to be in a group and a new group is presented on the page. After you have constructed
    more than one filter set, changing the Sets Are to Be field causes a logical opposite
    effect to the full expression.


    For example, if I have two filter sets, the first saying "filter1 or filter2,"
    and the second saying "filter3 or filter4," and the Sets Are to Be field set to
    AND, these sets will be ANDed together. This results in the following Boolean
    expression:

    If (filter1 or filter2) and (filter3 or filter4) then include in report.

    If you choose Sets Are to Be field set to OR, these sets are ORed together and
    the resulting Boolean logic

    If (filter1 and filter2) or (filter3 and filter4) then include in report.

    You will notice that both the sets and the logic within the set filters flips
    to the opposite Boolean operator. This is necessary to keep the Boolean expression
    valid.


    +   - After you have completed your filter for the report, press Next.


    +   - The last page of the wizard gives a summary of your report. Press Back to
    return to the previous pages to make changes, or press Finish to complete the
    creation of the report.


    +   - The next screen shows a success or failure of the report creation.


    +   - Press OK. Now the new report you created appears in the report list.


    # Running Reports


    To run the previously defined or any of your created reports, go to the report
    folder that contains your desired report.


    Select any of the reports you want to run. You may select the check box in the
    title bar to select all reports in the folder.'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'Press the Generate menu item and ZENworks runs each of the selected reports.
    When a report is completed, a browser window pops up with the report presented
    in the window.


    You may also generate a report by pressing the Generate Report quick task on the
    left task bar. This walks you through a wizard to generate any reports you select.


    Figure 10.7 shows a sample report.


    # Figure 10.7


    Sample generated report.


    ![](img/1dc9ba96bb55315f8828b75f085ce4b4_158_0.png)


    From the generated report you have several options presented in the button bar
    at the top left of the report. These buttons include


    +   - Print—This sends the report to your printer.


    +   - Close—This closes the report window.


    +   - Refresh—This reruns the selected filtering options against the system and
    presents a newly run report in the same window.


    # Saving Output of Reports


    Often you want to take the output of a report and save it for later viewing. This
    can be done directly from the generated output of the report. Figure 10.7 shows
    a sample report.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# CHAPTER 10: Reporting


    On the right of the report are three hyperlink selections. These selections output
    the report in various formats to your hard drive. They include


    +   - XML—This outputs the report in XML format suitable for parsing with execution
    code.


    +   - CSV—This outputs the report in comma-separated format, suitable for importing
    into most databases, tables, or spreadsheets.


    +   - HTML—This outputs the report in a browser format suitable for viewing in
    a browser.


    After you select the type of output you want, the system prompts you for a filename
    and location. After those fields are completed, the system creates the local file
    and puts the output of the report in that file in the format specified.


    # Editing an Existing Report


    To edit an existing report, press on the hyperlink report name from the listing
    of reports on the screen (refer to Figure 10.1 for an example).


    This shows you details of the report, including name, description, columns for
    the report, and any filtering. Modify any of the components you wish by completing
    the necessary actions as previously described in the wizard for that section.


    # Conclusion


    Reporting is a method for retrieving information out of the object store or the
    database. With ZENworks Linux Management and the ZENworks Control Center, you
    can define and generate all the reports you need.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# Common Device Management Tasks


    # Viewing Getting Started


    The first time that you launch and log in to the ZENworks Control Center you are
    presented with the Getting Started page. The Getting Started page gives you instructions,
    references, and links to other documentation to help you get ZENworks Linux Management
    working in your environment.


    After you have entered into the ZENworks Control Center, the Getting Started page
    is not displayed on subsequent launches. If you wish to see the Getting Started
    page again, you need to go to the Home tab in the ZENworks Control Center and
    press the View Getting Started task in the Quick Task list.


    # Managing Licenses


    When ZENworks Linux Management is initially installed without a license code,
    the software is configured to be in evaluation mode. Evaluation mode is a fully
    functional product for 90 days from the installation. At the end of the 90 days,
    you can no longer manage the system through ZENworks Control Center.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# CHAPTER 11: Common Device Management Tasks


    When you have a license code, you can enter the code to fully license the ZENworks
    Linux Management product. This can be done by going to the Home tab on the ZENworks
    Control Center and then clicking on the Manage Licenses task in the Quick List
    task.


    Clicking on the Manage Licenses task brings up the Product Activation dialog,
    shown in Figure 11.1.


    FIGURE 11.1 Product Activation dialog box.


    ![](img/1dc9ba96bb55315f8828b75f085ce4b4_161_0.png)


    Enter the license code that was given at the time of purchase. When a valid code
    is entered, press the OK button.


    # Clearing the Message Log


    Messages are categorized as either N-Acknowledged, Acknowledged, or Cleared. When
    a message has not been acknowledged, it shows up on the status screens that show
    messages and events. When a message is acknowledged by the administrator action,
    the message is displayed only in the Advanced options of the event snapshot in
    the ZENworks Control Center.


    On some occasions you may want to clear a message. When you clear a message, it
    still remains in the database, but is not displayed on the standard event snapshot
    and advanced options. Cleared messages can be displayed only via a report.


    To clear the message log, do the following:


    +   1. Launch ZENworks Control Center.

    2. Log in as a ZENworks administrator.

    3. Click on the Configuration tab.

    4. Click on the Clear Message Log quick task. This displays a dialog to enable
    you to selectively clear the logs (see Figure 11.2).


    146'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Controlling a Device Remotely


    FIGURE 11.2

    Clear Message Log dialog.


    ![](img/1dc9ba96bb55315f8828b75f085ce4b4_162_0.png)


    +   5. Enter the beginning and ending dates that you want to clear.

    6. Choose to clear the log by selecting the Clear radial button. If you want to
    permanently delete the selected logs, select the Permanently Delete radial button.

    7. Press OK.


    The logs are now cleared or deleted.


    # Acknowledging All Events


    When you are on a device Details tab, there is an Acknowledge All Events located
    in the quick task lists.


    When you press the Acknowledge All Events task in the ZENWorks Control Center,
    mark all events against the specific device as being acknowledged. This does not
    remove the events from the message log, but does remove them from being shown
    on the events snapshot displayed for each device.


    The messages that have been acknowledged may be viewed through the reporting features
    of ZENWorks Linux Management.


    # Controlling a Device Remotely


    There are times when you may need to control a device remotely in the Zone. This
    can be done by launching the Remote Control task when you are in the'
  merge: -1
  img_proc: true
- pgno: 163
  md: "devices list or on the details of a device. ZENworks Linux Management uses\n\
    the open source VNC tool.\n\nTo control a device remotely, you must have the Java\
    \ runtime installed on the\nmanaged device and the plug-in properly configured\
    \ for the browser you are\nusing. You can get the Java runtime and plug-in from\
    \ www.java.com.\n\nAdditionally, for security, the remote control requires that\
    \ the device have a\npassword set. You can assign a password on the device by\
    \ launching the fol-\ning on the remote device:\n\n```\n/opt/novel1/zenworks/sbin/zrmservice\
    \ --passwd\n```\n\nThis prompts you for a password to enter. This is normally\
    \ run by a user to\n sure that the password is known only by that user. The information\
    \ is\nthen passed to the help desk person to remote control the user's desktop.\n\
    The user can clear the password by entering a --clrpasswd option.\n\nWhen you\
    \ select to control a device remotely, the ZENworks Control Center\npops up the\
    \ following dialog (see Figure 11.3).\n\nFIGURE 11.3\n\nRemote Management dialog.\n\
    \n![](img/1dc9ba96bb55315f8828b75f085ce4b4_163_0.png)\n\nFrom the Remote Management\
    \ dialog you can enter the following:\n\n+   **IP Address**—This is filled in\
    \ automatically if the device is selected. If\nnot, you will need to enter the\
    \ IP address of the device to be controlled.\n\n+   **Operation**—Choose the operation\
    \ that you want to perform. The valid\noperations are Remote Control, Remote View,\
    \ and Remote Login. If you\nchoose Remote Control, the VNC agent is contacted\
    \ on the device. If you\nchoose Remote View, a remote control session is activated,\
