    # Available Policies in ZENworks 7 Linux Management


    Several policies have been created and defined in the ZENworks 7 Management system.
    This section discusses each of the available policies.


    # Epiphany Policy


    Epiphany is a web browser provided as part of the GNOME desktop. ZENworks 7 Linux
    Management provides a policy that allows the configuration of Epiphany browser
    on the assigned managed device.


    Checking or unchecking the corresponding check box enables you to configure the
    following actions from the Epiphany policy. When a check box is selected, that
    action is activated.


    +   - Disable JavaScript control of window chrome.

    - Hide menu bar.

    - Disable automatic downloading and opening of files.

    - Disable manual URL entry.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# CHAPTER 9: Policies


    +   - Disable bookmark editing.

    - Disable toolbar editing.

    - Disable history.

    - Disable loading of content from unsafe protocols. Default safe protocols are
    HTTP and HTTPS.

    - Add protocol to the Safe Protocol list.


    The following options of the Epiphany browser policy have additional data entered.
    Additionally, beyond setting the values for the following options, the policy
    may lock the value. To lock the value, select the lock button next to the corresponding
    value. This prevents the user from modifying that value on the assigned managed
    device.


    +   - Home page URL—Specify the default URL home page for the browser. No default
    home page URL is specified.

    - Download Folder—Specify the local folder where the browser should place any
    downloaded files. No default folder is specified.

    - Allow Popups—Specify whether pop-ups should be allowed. The default is Yes.

    - Allow Java—Specify whether the execution of Java applications on the browser
    page should be allowed. The default is Yes.

    - Allow JavaScript—Specify whether JavaScript on the page should be executed.
    The default is Yes.

    - Cookies—Specify whether the cookies'' acceptance should be set to Always Accept,
    Only from Sites You Visit, or Never Accept. The default is Always Accept.

    - Disk Space for Temporary Files—Specify the amount of space, in megabytes, that
    should be reserved for temporary files. The default is 50MB.


