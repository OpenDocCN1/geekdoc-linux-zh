- pgno: 182
  md: '# Mirroring External Sources into ZENworks Linux Management


    configuration form. Each catalog you want to mirror must have a separate CatalogConf
    section, as follows:


    ```

    <CatalogConf>

    <Name>Red Carpet 2</Name>

    <LocalName>Red Carpet 2</LocalName>

    <Target>sles-9-1586</Target>

    <ExcludeTarget></ExcludeTarget>

    <Bundle></Bundle>

    <ExcludeBundle>lib.*</ExcludeBundle>

    <Package></Package>

    <ExcludePackage></ExcludePackage>

    </CatalogConf>

    ```


    The Name field is the name of the catalog or channel you want to mirror from this
    source server. This is the only required parameter. If it is not specified, zlmirror
    creates or places the packages in a catalog with the same name.


    Local Name is the name of the catalog in which you wanted the mirrored software
    placed. If no local name is specified, the catalog name from the server is used.


    Folder specifies the object database folder (for example, /folder1/folder2) where
    bundles and catalogs are created and updated. If not specified, the catalogs and
    bundles will be created and updated in a zlmirror folder.


    Target restricts the mirroring operation on this catalog to packages and patches
    that support the specified target platform(s). If no target is specified, packages
    for all platforms are mirrored. This element can specified multiple times, and
    can contain either a target name or a regular expression string for wildcard matching
    of target names.


    ExcludeTarget is the same as Target, except packages and patches supporting the
    specified target platform(s) are excluded.


    ExcludeBundle is performed after Target, so platforms appearing in a Target and
    ExcludeTarget are ultimately excluded.


    Bundle restricts the mirroring operation on this catalog to the specified bundles(s).
    If not specified, all bundles are mirrored. This option is valid only for ZENworks
    Linux Management and YAST source servers. It can be specified multiple times and
    can contain either a bundle name or a regular expression string for wildcard matching
    of bundle names.


    ExcludeBundle is the same as Bundle, except packages and patches contained in
    the specified bundle(s) are excluded. This option is valid only for ZENworks Linux
    Management and YAST source servers. It can be specified multiple times'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# CHAPTER 12: Keeping ZENWorks Linux Management Servers Synchronized


    and can contain either a bundle name or a regular expression string for wildcard
    matching of bundle names. ExcludeBundle is performed after Bundle, so bundles
    appearing in a Bundle and ExcludeBundle are ultimately excluded.


    Package restricts the mirroring operation on this catalog to the specified package(s).
    If not specified, all package(s) are mirrored. This option is valid only for ZENWorks
    Linux Management and YAST source servers. It can be specified multiple times and
    can contain either a bundle name or a regular expression string for wildcard matching
    of bundle names.


    ExcludePackage is the same as the Package, except specified package(s) are excluded.
    This option is valid only for ZENWorks Linux Management and YAST source servers.
    It can be specified multiple times and can contain either a bundle name or a regular
    expression string for wildcard matching of bundle names. ExcludePackage is performed
    after Package, so packages appearing in a Package and ExcludePackage are ultimately
    excluded.


    # EXAMPLE CONFIGURATION


    The following displays a typical configuration file to mirror an NLD catalog from
    zone1 to zone2.


    ```

    <ZLMMirConf>

    <SourceServer>

    <Base>https://sourceprimary.zone1.com</Base>

    <Proxy />

    <Type>zlm</Type>

    <User>Administrator</User>

    <Password>source</Password>

    </SourceServer>

    ```


    ```

    <CatalogConf>

    <Name nld-9-i586/>

    <LocalName nld-9-i586/>

    <Folder Mirror />

    <Target />

    <ExcludeTarget />

    <Bundle />

    <ExcludeBundle />

    <Package />

    ```'
  merge: -1
  img_proc: true
- pgno: 184
  md: '```

    <ExcludePackage />

    </CatalogConf>

    ```


    </ZLMMirConf>


    This configuration file causes the nld-9-1586 catalog to be copied and updated
    on the local primary server. The local catalog name will also be nld-9-586 and
    will exist in the /Bundles/Mirror folder of the ZENworks Control Center.


    # Finishing Up The Configuration


    You should test your configuration file to see whether it is formed properly and
    will perform the intended actions.


    After you have created the configuration file for a source server, run the following-command
    to perform a dry run of the mirroring operation, and optionally add the verbose
    flag to see detailed messages:


    ```

    zlmmirror mirror -c zlmmirror-config.xml --dryrun --verbose

    ```


    If this operation provides the intended results, run the mirror command without
    the dry run flag to complete the operation:


    ```

    zlmmirror mirror -c zlmmirror-config.xml

    ```


    After you have configured your system and created your cron entries, zlmmirror
    continually refreshes your local catalogs with the latest updates.


    See Appendix A, "Commands," for all the options that are available for the zlmmirror
    command.


    # Summary


    It is important when you have more than one server in your ZENworks Linux Management
    to keep your servers synchronized with the files and administered functions. Additionally,
    to bring outside packages into the system automatically, you need to set up configurations
    and jobs for each mirroring activity you want.


    Using these techniques brings content into your system that you can then provide
    to your devices via catalogs or assign for installation to devices through assignments
    of bundles.'
  merge: -1
