- pgno: 234
  md: '# ZENworks Resources


    Many other resources are available concerning ZENworks. This appendix describes
    a few to assist you in your discovery and implementation of ZENworks.


    # Novell Support and Online Documentation


    Novell has set up a website that is the product home for ZENworks. This website
    is http://www.novell.com/products/zenworks. From this website, you can find Novell''s
    online documentation and announcements for the product.


    Additionally, from this page you can follow the links to http://support.novell.com/products,
    where you can find any patches and fixes that may be released for the product.
    ZENworks products are found under the NetWare and the Management Products categories.


    # ZENworks Cool Solutions


    Many more uses of ZENworks exist than can ever be described in a book such as
    this. Many customers use ZENworks every day and get very creative in their use
    of the system.


    Novell has set up a location on the Internet where customers can go to ask their
    questions of the actual ZENworks engineers and see what solutions other customers
    have come up with ZENworks.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# APPENDIX B: ZENworks Resources


    The website for ZENWorks Cool Solutions is http://www.novell.com/coolsolutions/zenworks.


    This site changes often and features articles from real customers or insiders
    on how to make ZENworks hum in your network. The site also includes a list of
    frequently asked questions and their answers and articles from other deployment
    specialists in the trenches. You can often find a white paper at the Cool Solutions
    site that will have the information you need for your issues.


    From time to time this site also posts software that is not supported by Novell
    but provided by some internal Novell engineers, Novell consultants, or customers.
    These tools can help you in your ZENworks deployment and management.


    One time on the ZENworks Cool Solutions site, the webmaster had a group of ZENworks
    engineers present a live, ask-the experts session. Customers were able to ask
    their questions and get real-time answers for their issues. You might even see
    some job postings for companies looking for ZEN masters to come and implement
    ZENworks in their environments.


    # Novell Advanced Technical Training


    Novell Advanced Technical training services provide many excellent ZENworks courses
    for beginners to advanced ZENworks administrators. Novell Advanced Technical Training
    offers their courses either online or with a Novell instructor. Whether you receive
    additional ZENworks training via the Internet or with a Novell instructor, you
    will come away knowing more about how to make ZENworks really work for you in
    your environment and how to get the most benefit out of the product.


    Check out the website to find out more about the classes offered: http://www.novell.com/training/pep/att/def.html.


    # Novell Consulting Services


    Novell Consulting Services has many good engineers who are familiar with ZENworks
    and how it can help Novell customers in their environments. They can assist you,
    beyond support, in getting ZENworks to do exactly what you want for your network.
    Novell Consulting Services can help you with field consulting and with any custom
    developments you may need, tailoring ZENworks to your organization''s needs.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Novell Technical Support Services


    Novell has one of the best trained and most responsive technical support service
    departments in the industry. Novell''s technical support engineers help customers
    resolve installation, configuration, incompatibility, and software issues. They
    track those issues and create technical information documents (TIDs) that break
    down the symptoms and resolution to the problem. TIDs are available from the Novell
    Technical Support Knowledgebase at the following address: http://support.novell.com/search/kb_index.jsp.


    You can also access the Novell Support forums to view and post messages about
    questions you have. Other users, as well as Novell''s support engineers, can respond
    to these messages. The Novell Support forums are available at the following web
    address: http://support.novell.com/forums/'
  merge: -1
  img_proc: true
