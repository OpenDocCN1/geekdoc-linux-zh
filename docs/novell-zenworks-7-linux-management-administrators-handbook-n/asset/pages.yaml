  md: '# ZENworks Linux Management Database


    This chapter discusses the database used for ZENworks Linux Management.


    # ZENworks Linux Management Databases


    By default, ZENworks Linux Management installs PostgreSQL version 7.4.7. However,
    you can also use Oracle 9i. During the install, you are prompted whether you want
    to install the database locally (on the machine on which you are installing ZENworks
    Linux Management) or to a remote PostgreSQL or Oracle database.


    ZENworks Linux Management also uses an object store. The ZENworks Object Store
    is eDirectory. It''s important to understand that unlike relational databases,
    the ZENworks Object Store can establish interrelationships of data, such as the
    relationship of an application to a workstation.


    # Information Stored in the Database


    The ZENworks 7 Linux Management database contains a lot of information used by
    the product. The following information is found in only the database:'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# CHAPTER 13: ZENworks Linux Management Database


    +   - Log Files

    - Inventory

    - Queue information

    - Package and bundle dependency


    The following information is found in only the ZENworks Object Store:


    +   - Administrators/Users

    - Policies

    - Tiered Electronic Distribution (TED) Configuration


    The following information is stored in both the ZENworks Object Store and the
    database:


    +   - Registration information

    - Package information (bundles, catalogs, and so on)


    # Accessing PostgreSQL


    You should never have to change or modify the database directly: However, you
    can use a few commands to look at the information within the database. If you
    used the defaults to set up ZENworks Linux Management, you can access PostgreSQL
    by following these steps:


    +   1. At the terminal prompt type su postgres

    2. Type psql zenworks to log in to the database.


    ```

    You then see the following information:

    Welcome to psql 7.4.7, the PostgreSQL interactive terminal.

    Type:\copyright for distribution terms

    \h for help with SQL commands

    \? for help on internal slash commands

    \g or terminate with semicolon to execute query

    \q to quit

    zenworks=#

    ```


    +   3. Type \d to view a description of what is in the database.

    nYou see a screen similar to Figure 13.1.'
