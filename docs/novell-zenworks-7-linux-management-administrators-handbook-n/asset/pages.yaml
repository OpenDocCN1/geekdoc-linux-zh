- pgno: 111
  md: 'CHAPTER 7: Bundles


    # Updating Previously Created Bundles


    Sometimes you want to update previously created bundles. This can be to add RPMs,
    delete RPMs, or modify their entries. Whenever any change is made to a bundle,
    ZENWorks automatically creates a new version for the bundle.


    When there are multiple versions of a bundle, you have the option of selecting
    which bundle you want to be delivered to the bundle to assigned devices. When
    the device verifies that all assigned bundles have been assigned, the device recognizes
    when a previously delivered bundle has a new version number. If the version number
    is different from the previously applied bundle, the newly selected bundle is
    applied to the device.


    To select the version of a bundle, follow these steps:


    +   1. Launch the ZENWorks Control Center.


    +   2. Browse to select the desired bundle.


    +   3. Click on the Details tab of the bundle.


    +   4. Press the drop-down list next to the version label. Select the desired
    version. Click on the Deploy button to mark the selected version as the version
    of the bundle to deploy to assigned devices.


    # Bundle Groups


    To simplify the management of a set of bundles. ZENWorks enables you to create
    a bundle group. A bundle group constitutes a set of defined bundles. You can then
    assign the set of bundles with a single action by assigning the bundle group.


    When a bundle group is assigned to a device, all the bundles represented in the
    group are installed on the device.


    Create a bundle group by doing the following tasks:


    +   1. Launch ZENWorks Control Center.


    +   2. Select the Bundle tab at the top of the screen.


    +   3. Browse to the folder within the bundles where you want to create the bundle
    group.


    +   4. Click on the New menu option and select Bundle Group. Figure 7.23 shows
    a sample first screen of the wizard. Press Next.'
  merge: -1
  img_proc: true
