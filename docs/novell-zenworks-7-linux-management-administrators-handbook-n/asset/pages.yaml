- pgno: 114
  md: '# CHAPTER 8


    # Catalogs


    This chapter discusses catalogs in the ZENworks Linux Management product. Catalog
    creation, modifications, and assignments, like all administrative functions, are
    performed in the ZENworks Control Center.


    # What Are Catalogs?


    A catalog goes hand in hand with RPM bundles and is simply an ordered collection
    of RPM bundles. (See Chapter 7, "Bundles.") Catalogs can be assigned and delivered
    to a managed device.


    Although RPM bundles are stored in the ZENworks Management database, catalogs
    are objects that are stored in the ZENworks Object Store. See Chapter 13, "ZENworks
    Linux Database," for more information.


    # What Are the Advantages of Catalogs?


    Catalogs are used for dependency resolution, as well as install optional software.
    Dependency resolution occurs when an RPM bundle has requirements that are not
    already met or when dependent RPMs in the catalog are automatically installed.


    # How to Create a Catalog


    Complete the following steps to create a catalog in ZENworks 7 Linux Management:'
  merge: -1
  img_proc: true
