- pgno: 12
  md: '# Preface


    The Open Source Software movement continues to shape the dynamics of the computer
    software industry as it has for the last decade. At the center of the Open Source
    Software is Linux—an operating system whose rapid growth is changing the world''s
    perception of open source.


    Strong backing by companies, as Novell, provide Linux distributions (SUSE LINUX,
    Novell Linux Desktop) along with all the necessary services and support functions,
    help make Linux an acceptable operating system choice for businesses. As a consequence,
    corporations are beginning to make significant movements to incorporate Linux
    into their business-critical computing systems. With the advent of the Novell
    Linux Desktop and other desktop offerings, Linux will also grow in the end-user
    desktop environment.


    As the Linux operating system becomes more prevalent in back-end server and desktop
    systems, companies will need better management systems to reduce the cost of Linux
    ownership. Companies cannot tolerate the high level of manual and costly tasks
    that are required to manage Linux systems. It is inefficient and costly to spend
    resources on mundane tasks such as hauling mounds of CDs around to install applications
    on users'' computers, re-installing operating systems, searching for all those
    dependent RPMs, or trying to figure out where the Linux assets are.


    ZENworks provides a management solution with a proven record of reducing the total
    cost of ownership. ZENworks helps you manage your systems through their entire
    life cycle. With ZENworks, the system automatically tracks assets; delivers applications;
    keeps your laptops, workstations, and servers up to date on the latest approved
    patches; and finds all of those dependent RPMs. ZENworks delivers images to systems
    that need restoring or upgrading. ZENworks includes remote management capabilities
    to help you diagnose and control computers in your WAN or the Internet.


    ZENworks delivers all these features into your enterprise regardless of your preferred
    platform. ZENworks can function in a Windows-only environment or mixed environments,
    including Windows, NetWare, and Linux.


    This book is about installing and getting ZENworks Linux Management working in
    your environment, from small to enterprise levels. We try to point out all the
    tips and "gotchas" to watch for to make your installation and deployment of ZENworks
    Linux Management a success.


    We thank you for purchasing this book and hope that it is useful to you.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# About the Authors


    **Ron Tanner** is currently a product manager for Novell ZENworks, defining the
    future of the product. Ron has been associated with ZENworks since its inception,
    and lead software development as Director of Engineering through the invention
    and first releases of ZENworks. He has 20 years of experience in developing software
    and leading engineering teams in exciting, cutting-edge technology. Prior to working
    at Novell, Ron developed advanced networking systems at AT&T Bell Laboratories.
    Ron has co-authored six other ZENworks Novell Press titles. When Ron can sneak
    away from ZENworks he can be found having fun with his wife, Cheer, and his four
    children, Teagan, Matson, Kelly, and Jarett.


    **Richard Whitehead** is currently the Director of Product Marketing for Novell
    ZENworks. Richard has worked on ZENworks for many years in various roles, including
    Product Line Manager. He has over 15 years of experience in the software industry,
    holding senior positions as a software engineer, tester, evangelist, product manager,
    and product marketing manager. In addition to working for Novell, Richard has
    worked for Evans and Sutherland, WordPerfect, and Citrix. In his free time, Richard
    enjoys just being a homebody, working in the yard, playing sports, and spending
    as much time as possible with his wife, Sandy, and three children Mitchell, Christian,
    and Madison.'
  merge: -1
  img_proc: true
