- pgno: 22
  md: '# Understanding ZENworks Linux Management


    # General Architecture


    ZENworks Linux Management is built on an all-new Services Oriented Architecture
    (SOA). This architecture represents significant advancements for existing ZENworks
    customers and is probably a familiar architecture for current ZENworks Linux users.
    Service Oriented Architectures are more scalable, Internet friendly, and secure.
    This section discusses the ZENworks Linux Management architecture, components,
    and best practices for rollout.


    The first server you install is called the primary ZENworks server. Additional
    ZENworks servers, called secondary servers, can be set up and then "joined" to
    the primary server. The only difference between the primary ZENworks server and
    the other secondary ZENworks servers is that the database is installed on the
    primary server. A collection of ZENworks servers is called a zone. ZENworks zones
    should be on a single LAN for better performance and scalability.


    Two main components are typically installed on the primary ZENworks server:'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'The database that contains the RPM packages to be delivered, device information,
    hardware and software inventory, and scheduled actions.


    The ZENworks Object Store, where the devices objects, content objects, group memberships,
    and object relationships are stored.


    Each Managed Device, including the ZENworks server(s), has the ZENworks Management
    Agent. Each agent uses the Mono (.NET) runtime environment on which the web services
    for policies. packages. remote control, and inventory run. In addition to the
    ZENworks Management Agent, the ZENworks Server has the following components (see
    Figure 2.1):


    +   - Java runtime for Tomcat for the ZENworks Control Center

    - Java runtime for Tiered Electronic Distribution

    - PDHCP server for proxy DHCP

    - Imaging server

    - TFTP server


    FIGURE 2.1

    ZENworks Linux Management architecture.


    ![](img/1dc9ba96bb55315f8828b75f085ce4b4_23_0.png)


    # Open Source Components


    ZENworks Linux Management can be divided into two components: the ZENworks Server
    and the ZENworks Management Agent. The ZENworks Server is the center point of
    ZENworks Linux Management and runs the services for the system. The ZENworks Server
    is proprietary and not open'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'source The ZENworks Management Agent, on the other hand is open source and
    enables Linux systems to be managed by the ZENworks Server.


    If there isn''t a ZENworks Linux Management server within your environment, users
    can receive updates from public servers only. This is a good solution for individual
    users, but is not recommended for enterprises.


    # Best Practices of Rollout Procedures


    It is highly recommended that you create a primary ZENworks server within the
    same LAN of the managed devices meaning that you do not manage devices over a
    WAN. This is also true for additional ZENworks servers that you join to the primary
    The additional servers that are joined will point back to the primary server for
    the database, the ZENworks Object Stores are replicated, and the packages are
    distributed via Tiered-Electronic Distribution. It will be faster and more efficient
    to have these processes done within a high-speed LAN environment.


    # Use of Directories


    As with other ZENworks products, ZENworks Linux Management uses Novell eDirectory
    to provide secure, scalable, policy-driven management. This is referred to as
    the ZENworks Object Store and is actually Novell eDirectory 8.7.3, which is automatically
    installed and configured during the setup of the ZENworks server This means that
    behind the scenes you are using the strengths of eDirectory for replication, federation,
    and object management. For the most part you do not need to worry about maintenance
    on the ZENworks Object Store. However, if needed, you can use the standard eDirectory
    tools


    # Use of Existing Databases


    Out of the box, ZENworks Linux Management ships with the Postgres database. If
    you choose to use Postgres, ZENworks Linux Management automatically sets it up
    and installs it. This includes applying the schema.


    In many enterprises, you may already have Oracle running and trained Oracle database
    administrators. ZENworks Linux Management can also use Oracle 9i. You must have
    Oracle 9i running on a different server than the ZENworks server. Also, you need
    to take some other steps to configure Oracle 9i with ZENworks Linux Management.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# CHAPTER 2: Understanding ZENworks Linux Management


    Before installing the ZENworks server, first ensure that you have connectivity
    between the server on which you will be installing and the Oracle server. You
    also need to apply the ZENworks schema. Then, during the install of the ZENworks
    server, you will be prompted by the database you want to use. Choose Oracle 9i
    and enter the DNS or IP address of the database server. You can get more information
    about database setup in Chapter 3, "Installing ZENworks Linux Management."


    # Use of Existing Servers


    Because the ZENworks server uses HTTP/HTTPS (ports 80 and 443), it is best practice
    to have a dedicated server. Otherwise, other web services that also use ports
    80/443 could conflict with ZENworks Linux Management services. Using a dedicated
    server also provides additional disk space that may be required for RPM packages
    and the other items stored in the Postgres database.


    # How and Where ZENworks Linux Management Is Managed


    The ZENworks server is also considered to be a managed device. This means that
    you can manage and maintain the ZENworks server(s) just like any other managed
    device.


    ZENworks Linux Management uses a web-based interface called the ZENworks Control
    Center. Using the ZENworks Control Center you can manage all your Linux systems
    from a central location. We recommend that you take some time to familiarize yourself
    with the ZENworks Control Center, especially if you have an existing ZENworks
    customer.


    # How Devices Are Represented and Managed in ZLM


    Every managed device is displayed in the ZENworks Control Center. The process
    for bringing a device into the Control Center is called registration. During the
    registration process, you can determine the containment of the device through
    a registration key. You can read more about registration keys in Chapter 5, "Registering
    Devices into the System."'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'After a device is accessible within the ZENworks Control Center, you can perform
    inventory, deliver and install software, enforce policies, and remote control
    the device. All these capabilities are done through the ZENworks Management Agent.


    # How Content Is Delivered


    Because ZENworks Linux Management uses a web services model, all work is done
    on the server and not the client or managed device. Requests are made by the ZENworks
    Management Agent, using a web service. The server then processes the request and
    provides a response back to the agent. This results in a system that is not "chatty"
    and using up bandwidth within the network. This process is illustrated in Figure
    2.2.


    FIGURE 2.2

    ZENworks system overview.


    ![](img/1dc9ba96bb55315f8828b75f085ce4b4_26_0.png)'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Terminology/Glossary


    ZENworks Primary Server—This is the first server installed. It contains the database,
    object store, and other web services.


    ZENworks Secondary Server—These are any servers that are installed and "joined"
    to the primary server. It includes all the services that the primary server has
    except for the database.


    ZONE—This is the management domain that includes the primary server and all secondary
    servers within a LAN.


    ZENworks Management Agent—This is the agent that allows ZENworks Linux Management
    to manage the device.


    Registration Key—The key used to register the device with the ZENworks server.


    ZENworks Control Center—The web-based administration console used to administer
    ZENworks Linux Management.


    Managed Device—Any device (workstation or server) that is managed by ZENworks
    Linux Management.


    Packages—Installation files used to install software. These are also called RPM
    packages.


    Bundles—A collection of packages.


    Postgres—An open source database that can be used to store packages, inventory,
    and other device information for ZENworks Linux Management.


    ZENworks Object Store—Stores the objects for the devices, content, and the object
    relationships.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Installing ZENworks Linux Management


    This chapter provides a walk-through on getting all the components of ZENworks
    Linux Management working in your environment. You always need to install a ZENworks
    primary server first, and then you can install agent components and secondary-servers
    in any order you desire.


    # Preparing the Server


    In this step, you set up and prepare a server to host the ZLM server components.
    This server has similar requirements to a web or data-base server, and must be
    set up according to the following guidelines:


    +   A dedicated server running SUSE LINUX Enterprise Server 9 SP1 (SLES 9 SP1).
    It is recommended that you perform a new installation of SLES 9 with at least
    the default graphical base system. This system must not have any previous version
    of ZENworks Linux Management or Red Carpet installed.


    +   This server must be able to resolve client hostnames using some method (DNS,
    /etc/hosts/). A fully qualified domain name entry for each managed device in /etc/hosts
    should be sufficient for a test environment.


    +   A static IP address must be used when configuring the network on this server.
    You might encounter problems with the datastore configuration if the IP address
    is obtained from a DHCP server.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'No service should be running on port 80. If Apache is running on your server
    (or any other service binding to port 80), stop this service before installing
    ZENworks. Apache can be stopped with the following command: /etc/init.d/apache2
    stop.


    After you have completed this server configuration, you are ready to install ZENworks
    Linux Management.


    # Executing the Installation Script


    ZENworks Linux Management is composed of primary and secondary servers. The following
    sequences describe how to install each of these types of servers.


    # Installing a Primary Server


    Run the following steps to install a ZENworks Linux Management primary server:


    +   1. Insert the ZENworks Linux Management CD.

    2. Log in as root and mount the installation media.

    3. Change to the /media/cdrom (or device mounted in step 2) directory, where the
    CD was mounted.

    4. Run the installation script: ./zlm-install.

    5. First the installation program verifies and-installs Python, if necessary.
    Then you are prompted to answer whether you wish to install ZENworks on this machine.
    Respond with a y.

    6. You next are presented with the ZENworks License Agreement. Review the agreement,
    and then you are prompted to answer whether you accept the license agreement.
    Enter a y to accept.

    7. The installation next installs the daemon that installs packages onto the system.
    The installation begins installing dependent packages on the server. The installation
    creates a log file in the /var/opt/node11/log/zenworks directory.

    8. After the dependencies are installed, the script script installs the ZENworks
    software and data store components. Following these, it installs the administration
    tools and the preboot imaging services.

    9. Next the installation script installs mirroring software to keep your ZENworks
    back-end servers synchronized, followed by the web services loader daemon and
    the ZENworks agent for the server.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '10. Now that all the packages have been installed, the server needs to be configured.
    You are prompted to decide whether you wish to run zlm-config. Respond with a
    y.


    11. The system gathers information and then prompts you for answers to the following:


    +   - Answer a y when asked whether this is the first server in the zone.


    +   - When prompted for an Organizational Name enter a unique name for this Management
    Zone.


    +   - When prompted, enter an Administrator password for accessing the web-based
    ZENworks Control Center, or the zlm command-line interface.


    12. Next the installation asks whether you want to use an external database for
    your data store. If you choose to use the local database from ZENworks, then enter
    an n and continue. If you choose a y to store data in a database on another machine,
    enter the following, when prompted:


    +   - IP Address or host name of the database server.


    +   - Communication port to the database.


    +   - Database name.


    +   - Database user. This user must have write access to the database to create
    tables and then fill those tables with data.


    +   - Database user password.


    13. ZENworks then completes the configuration of the remainder of the components.


    # Installing a Secondary Server


    A secondary server must be synchronized with the same clock time as the primary
    server. Be sure to complete the processes necessary to ensure time synchronization
    before installing the secondary server software.


    You can run the following to configure NTP to an external time source and to verify
    that you are synchronizing properly after your installation:


    +   1. Determine the IP address of the server that is providing the clock. The
    primary and secondary can point to the same source, or you could have secondary
    servers point to the primary.


    +   2. Launch YAST and select Network Services and NTP Client under that.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# CHAPTER 3: Installing ZENworks Linux Management


    +   3. On the NTP Client Configuration screen, select to automatically start the
    daemon when booting the system.


    +   4. In the NTP Server field enter the IP address of the server that will be
    providing the clock.


    +   5. Select Finish to save the configuration and launch the daemon.


    To verify that the timing synchronization is functioning properly, enter the `ntpq
    -p` command and verify that the offset field is less than 1 second.


    Run the following steps to install a ZENworks Linux Management server:


    +   1. Insert the ZENworks Linux Management CD.


    +   2. Log in as root and mount the installation media.


    +   3. Change to the /media/cdrom directory, where the CD was mounted.


    +   4. Run the installation script ./zlm-install.


    +   5. The installation program verifies and installs Python, if necessary. Then
    you are prompted as to whether you wish to install ZENworks on this machine. Respond
    with a y.


    +   6. Next you are presented with the ZENworks License Agreement. Review the
    agreement and then enter a y to accept.


    +   7. The installation next installs the daemon that installs packages onto the
    system. The installation then begins installing dependent packages on the server.
    The installation creates a log file in the /var/opt/novell1/log/zenworks directory.


    +   8. After the dependencies are installed, the script installs the ZENworks
    software and data store components. It then installs the administration tools
    and the preboot imaging services.


    +   9. Next the installation script mirrors mirroring software to keep your ZENworks
    back-end servers synchronized, followed by the web services loader daemon and
    the ZENworks agent for the server.


    +   10. Now that all the packages have been installed, the server needs to be
    configured. You are prompted whether you wish to run zlm-config. Respond with
    a y.


    +   11. The system gathers information and prompts you for the following.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '+   Answer with an n when asked whether this is the first server in the zone.


    +   When prompted for an IP Address or DNS Name of Primary Server, enter the DNS
    name of the primary server in the zone. This server will be a secondary server
    in that same zone.


    +   When prompted, enter the Administrator password for administrating the zone.
    This is the same password entered for the administrator when the primary server
    was installed.


    ZENworks finishes configuring the remainder of the components.


    After the installation process completes, verify the installation by following
    the instructions in the next section.


    # Verifying the Installation


    When the installation is complete, the ZENWorks Management Daemon (zmd) is running
    on your server. Confirm this using the following command: /etc/init.d/novell-zmd
    status


    This status should be reported as running.


    Confirm that the additional ZENWorks services are running by using the following
    commands:


    ```

    /etc/init.d/novell-zenloader status

    /etc/init.d/novell-zenserver status

    /etc/init.d/postgresql status

    /etc/init.d/nsd status

    /etc/init.d/novell-zended status

    /etc/init.d/novell-zmprebootpolicy status

    /etc/init.d/novell-pbserv status

    /etc/init.d/novell-proxydhccp status

    /etc/init.d/novell-zislnx status

    /etc/init.d/novell-tftpd status

    ```


    Each of these services should be listed as running. If any services are not running,
    start them manually with the following command: /etc/init.d/<servicename> start


    After you have verified that these services are all running, you can log in to
    the ZENWorks Control Center.'
  merge: -1
