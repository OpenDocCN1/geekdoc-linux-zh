- pgno: 122
  md: '# Policies


    This chapter discusses policies in the ZENworks 7 Linux Management product. Policy
    creation, modifications, and assignments, like all administrative functions, are
    performed in the ZENworks Control Center.


    # What Are Policies?


    Policies are configurations that may be made to an operating system or application
    on a managed device. Security settings or default configurations, for example,
    can be set up in a policy.


    After these policies are created, you can assign them to devices registered in
    your ZENworks system. When a device discovers (or is told) that it has a policy
    assigned, it retrieves the policy and applies that policy based on the schedule
    or event specified. When a policy is applied, the configurations are set on the
    operating system or application. Applying policies is the responsibility of enforcers
    that are installed on the device when the ZENworks 7 agent is installed.


    # Why Are Policies Useful?


    The reason that policies can be very powerful in managing your business environment
    is that you can create a single policy and, with just a click of the mouse, have
    that policy applied to hundreds and thousands of devices. After they are assigned,
    those devices automatically apply that policy. You can be confident that the policy
    is sent and enforced on the device.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# CHAPTER 9: Policies


    Now if you decide to change a policy, simply edit it in ZENworks Control Center
    and the system automatically updates all assigned devices with that updated policy.
    You don''t need to do a thing.


    # How Are Policies Assigned?


    Policies are assigned in the ZENworks Control Center through direct or indirect
    assignments. Regardless of whether a policy is assigned indirectly or directly,
    the policy is sent to the device and applied to the managed device.


    # Direct Assignment


    Directly assigned policies are policies that have been assigned directly to a
    managed device.


    # Indirect Assignment


    Indirectly assigned policies are policies that are effective for the device and
    have been assigned through a group membership or containment.


    # Assigning a Policy


    Several ways of assigning a policy to a device are available in the ZENworks Control
    Center. The following describes the different ways that you can assign a policy
    to a device:


    +   - As part of the policy creation wizard.

    - As an action in the standard ZENworks Control Center lists.

    - During review of the details of a folder, policy, or device.

    - In the command line on the managed device.


    # Assigning a Policy with Creation Wizard


    All policies are created through a policy creation wizard. Each wizard page is
    customized for the particular policy that is being created. Regardless of the
    type of policy created, all wizards present the same pages to allow for the assignment
    of the policy to managed devices, folders, or groups.


    After the policy is defined in the wizard and you are viewing the summary page,
    you may either finish the policy definition by pressing the Finished button on
    the page or you may proceed in the wizard to select an assignment of the policy
    by pressing the Next button (see Figure 9.1).'
  merge: -1
  img_proc: true
