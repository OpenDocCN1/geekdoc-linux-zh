- pgno: 16
  md: '# The Evolution of Linux Management


    In August 2003, Novell acquired a company called Ximian. Ximian was founded with
    the goal of building enterprise-class Linux solutions. One of these solutions
    was called Red Carpet, which was initially built to help Ximian Desktop customers
    keep their Linux systems up to date. Because a Linux system is basically a collection
    of packages (RPMs), the Ximian engineers built Red Carpet to deal with the multiple
    RPM dependencies. Red Carpet consisted of two components. The first component
    was the Red Carpet Daemon, an open source daemon which could be be used to get
    software updates for one system at a time. The second component was called Red
    Carpet Enterprise, which was a proprietary, inside-the-firewall solution that
    enabled enterprises to manage their Linux systems centrally. Shortly after acquiring
    Ximian, Novell re-branded Red Carpet Enterprise to ZENWORKS Linux Management.


    This book discusses the features and capabilities of ZENWERKS 7 Linux Management.
    ZENWORKS 7 Linux Management is a major release to ZENWORKS Linux Management, and
    it includes many new capabilities that aren''t found in other Linux management
    products. ZENWORKS 7 Linux Management brings to the Linux platform many of the
    features that current ZENworks customers have been using on Windows. However,
    ZENWORKS 7 Linux Management is built on a brand-new service-oriented architecture
    (SOA). This new architecture will be adopted by other ZENworks products in future
    releases.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# CHAPTER 1: The Evolution of Linux Management


    # What''s the Big Deal?


    Linux is maturing rapidly and is being deployed by more and more enterprises.
    Just like Windows, an enterprise operating system must be manageable. Without
    good resource management, it is nearly impossible to provide a secure and stable
    IT environment. ZENworks 7 Linux Management enables administrators to use state-of-the-art
    tools for deployment, management, and ongoing maintenance of all their Linux systems.


    # The ZENworks Family


    Because many readers of this book will be existing ZENworks customers, it''s important
    to understand the entire ZENworks family and the role that ZENworks Linux Management
    plays. Although available separately, it is also available as part of the ZENworks
    Suite—an integrated resource management solution for deploying, managing, and
    maintaining desktops, servers, and handheld devices throughout their lifecycle
    across multiple platforms. The capabilities in the ZENworks Suite include:


    +   - ZENworks Desktop Management—Automates the configuration, deployment, updating,
    healing, and migration of desktops. ZENworks Desktop Management also includes
    ZENworks Patch Management, ZENworks Data Management, ZENworks Personality Migration,
    and ZENworks Software Packaging.


    +   - ZENworks Server Management—Automates server configuration and the distribution
    and inventory of applications, content, and patches across all servers, regardless
    of platform. ZENworks Server Management also includes ZENworks Software Packaging
    and ZENworks Patch Management.


    +   - ZENworks Handheld Management—Automates handheld device management to reduce
    ownership costs, strengthen security, and increase user productivity on Palm,
    Windows CE, Pocket PC, and RIM BlackBerry devices.


    +   - ZENworks Data Management—Automatically backs up and synchronizes user files
    and data across multiple devices and even the Internet to reduce the costs of
    lost data, data restoration, and data access help desk calls.


    +   - ZENworks Personality Migration—Automates the migration of personal settings
    and application settings for each desktop for OS migration or disaster recovery.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Using ZENworks Linux Management with Novell Linux Desktop


    +   - ZENworks Software Packaging—Automates the repackaging, customizing, and
    distribution of MSI applications.


    +   - ZENworks Patch Management—Automates detection, deployment, and defending
    of Windows patches.


    +   - ZENworks Linux Management—Uses policies to automate the deployment, management,
    and maintenance of Linux resources. These automated and intelligent policies provide
    centralized control across the lifecycle of Linux systems with desktop lockdown,
    imaging, remote management, inventory, and software management.


    All ZENworks products rely significantly on the directory, specifically Novell
    Directory, to provide a greater level of manageability, and greater ease of management,
    for each component in the network.


    Most ZENworks products are cross platform and can run not only in NetWare environments,
    but also in Windows and Linux environments (without the need for NetWare or the
    Novell Windows client).


    # What’s New for ZENworks 7 Linux Management?


    There are many new features and capabilities in ZENworks 7 Linux Management. In
    addition to a new architecture, new features include the following:-


    +   - ZENworks Control Center, for web-based administration


    +   - New reporting capabilities


    +   - Imaging of Linux servers and desktops


    +   - Remote control


    +   - Policy-based management


    +   - Hardware and software inventory


    # Using ZENworks Linux Management with Novell Linux Desktop


    ZENworks Linux Management is not only complementary to Novell Linux Desktop, it
    is critical. ZENworks Management enables you to deploy,'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# CHAPTER 1: The Evolution of Linux Management


    manage, and maintain your Novell Linux Desktops centrally and includes the capability
    to image a desktop, deliver and install software, keep the desktop up to date,
    and control the desktop remotely for help desk and troubleshooting.


    ZENworks Linux Management also provides lockdown policies specific to Novell Linux
    Desktop that make it possible to apply policies to devices to configure and potentially
    protect and lock down the device from user modifications. This enables you to
    configure your Linux systems as you need them to work most effectively in your
    personalized environments. Then you can rest assured that the users of these devices
    will not be to disrupt their Linux systems by reconfiguring your locked policies.


    ZENworks Linux Management introduces the following policies to the Linux environment:
    Epiphany Policy, Evolution Policy, GNOME Policy, Novell Linux Desktop Policy,
    Remote Execute Policy, and Text File Policy. With these policies you can manage
    your Linux systems and the applications that run on them.


    With the Novell Linux Desktop Policy you can configure whether locking is on,
    determine background images for your desktops and the themes you want for your
    corporation, and enable disable applets, including Dictionary, Sticky Notes, OpenOffice
    Quickstart, and so on. These and other settings enable you to configure your systems
    exactly as you want them for your users.


    Additionally, with the Novell Linux Desktop Policy you control whether the configurations
    you place down on the initial desktops are locked from user changes, or which
    configurations you will allow your users to customize.


    # NOTE


    The ZENworks Linux Management Agent is installed by default with Novell Linux
    Desktop. This makes it easy to register and manage Novell Linux Desktop out of
    the box.


    # Using ZENworks Linux Management with SUSE LINUX Enterprise Server


    ZENworks Linux Management is also available as a bundle with SUSE LINUX Enterprise
    Server 9. Together they provide the most powerful, secure, and manageable Linux
    solution in the market by giving IT administrators centralized control over Linux
    software configurations across their server and workstation infrastructures. Although
    ZENworks Linux Management is tightly'
