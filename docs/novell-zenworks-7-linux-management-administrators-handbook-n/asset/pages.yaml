- pgno: 170
  md: '# Keeping ZENworks Linux Management Servers Synchronized


    This chapter discusses how to keep all your ZENworks servers (both primary and
    secondary) synchronized with object and package data. Additionally, this chapter
    discusses how to keep the primary server synchronized with an external source
    stream of updates for your Linux systems


    # Content Replication


    Under the zone Configuration page is a category called Content Replication. This
    category represents the settings that are available in ZENworks Linux Management
    for sending administered content throughout the system.


    Content replication in ZENworks Linux Management uses ZENworks Tiered Electronic
    Distribution.


    # ZENworks Tiered Electronic Distribution


    ZENworks Linux Management takes advantage of a transmission technology that was
    originally developed by the traditional ZENworks product line. This technology
    allows for very efficient and controlled distribution of content to any server
    in the network.


    Tiered Electronic Distribution (TED) is used by ZENworks Linux Management to effectively
    transmit RPM packages from the ZENworks primary server to all secondary servers.
    For example,'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# CHAPTER 12: Keeping ZENworks Linux Management Synchronized


    TED transmits to secondary servers only updates to the RPM packages, and does
    not send any packages that have already been copied to the secondary servers.

    TED also has a check-point restart feature, where if the connection drops between
    the source and destination server, TED resumes the content transmission when the
    connection is restored, without retransmitting any data that was already sent.


    NOTE

    TED synchronizes content only one way: from the source to the target servers.

    That is why package management in ZENworks Linux Management must be done on the
    primary server. It is always treated as the source, whereas all secondary servers
    are considered the targets.


    # Configuring Synchronization


    To configure when ZENworks should synchronize the secondary servers with the package
    content on the primary server, execute the following steps:


    +   1. Open ZENworks Control Center in your browser.

    2. Log in as an administrator.

    3. Click on the Configuration tab at the top of the ZENworks Control Center. This
    brings up the Management Zone Settings page. See Figure 12.1 for a sample page.

    4. Click on the Content Replication setting. This brings up the page to make this
    setting. See Figure 12.2 for an example.

    5. Click on the desired schedule type. The options include the following:


    +   - No Schedule

    - Date Specific

    - Day of the Week Specific

    - Monthly


    The various scheduling types are described in more detail in the following sections.


    +   6. Select Close to have the schedule applied.'
  merge: -1
  img_proc: true
