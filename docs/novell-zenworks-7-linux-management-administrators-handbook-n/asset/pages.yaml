    +   Enable This Platform—Select the check box to enable this platform to be presented
    in menus and in other areas in the ZENworks Control Center.


    7. Press OK. This adds this platform to the set understood by ZENworks.


    Now this platform appears in your platform selection as part of adding RPMs to
    a bundle.


    # Configuring Silent Installation of the Agent


    You can run an installation of the agent and record your responses, placing them
    in a configuration file for other agent installations. When you use the configuration
    file as an option to the agent installation, the installation is silent.


    Record the installation by running `zlm-install -a -r <config file path>`. This
    creates a config file with your responses.


    To play the installation on another workstation in silent mode, run `zlm-install
    -a -s <config file path>`. This installs the agent with the same configuration
    as specified in the recorded installation.


    # Cleaning the Database


    When an entry is removed from a Postgres database, the database marks the entry
    as invalid, but does not remove the entry from the database. There is a tool,
    `/opt/novell1/zenworks/bin/zlm-pq-vacuum`, that can be run to purge the database
    of all removed items.


    Run this tool periodically, or as a cron job to keep your database clean.


    You should note that you may need to edit the `zlm-pq-vacuum` file to allow for
    silent execution of the tool. By following the instructions in the file you can
    have the tool bypass the prompt for the database password.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Updating the Agent


    There are times when you need to make sure that the agent running on the local
    device is updated with the latest agent code. This can be accomplished by running
    the rug command.


    This contacts the ZENWorks Linux Management server, downloads the latest agent
    files, and installs them on the local device.


    # Encrypting a VNC Session


    The version of VNC that is shipped with ZENWorks Linux Management does not currently
    encrypt the communication between the viewer and client (host) machine. Most administrators
    who want to control a GUI-less device use the ssh command to control the device
    remotely. If you need to run the VNC tool in graphical mode and still want to
    encrypt the session, complete the following steps:


    +   1. Launch a terminal session on the administrator''s device (viewer).

    2. Launch the ZENWorks Control Center and browse to the device you want to remote-control.
    Discover the device''s IP address.

    3. You need to set up a tunnel port connection between the ZCC device and the
    managed device you want to control. To do this you need three pieces of information:


    +   * The port on the ZENWorks Control Center device that is free (assume 1234
    for the example)

    * The port of the VNC server that is running on the target device (that is 5950
    by default)

    * The IP address of the target device (should have gotten that in the previous
    step)


    Enter the following in the terminal session on the ZENWorks Control device:


    ```

    ssh -L 1234:localhost:5950 <Target IP address>

    ```


    Additionally you can include -l <user> to specify a user account. The SSH connection
    requires that you enter a password on a valid user account on the target device.
    As the shell makes a connection to the remote device, you are prompted for the
    password of the user you specified. After the password is supplied, the secure
    connection is finalized.'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'You can find out additional information on using SSH with VNC at

    http://www.uk.research.att.com/archive/vnc/sshvnc.html.


    +   4. Go back to the ZENworks Control Center and click on the Devices tab.


    +   5. Select the Remote Control device from the task list on the left. You

    are prompted with the following dialog (see Figure 14.3).


    Figure 14.3

    Remote Management dialog.


    ![](img/1dc9ba96bb55315f8828b75f085ce4b4_195_0.png)


    +   6. Enter localhost into the IP Address field.


    +   7. Enter 1234 into the Port field.


    +   8. Press OK. This starts the VNC viewer session over the tunneled port to

    the target device. Enter the password for the remote control session and

    press OK. This brings up the GUI of the device.


    # Not Installing the VNC Agent


    There may be times when, for security or space reasons, you may not want to

    have the agent install the VNC components that enable you to control the

    device remotely. You can do so by passing a -x option to the zlm-install

    command.


    When the zlm-install command receives a -x option, no X-Windows comp-

    nents (namely VNC) are installed.'
  merge: -1
