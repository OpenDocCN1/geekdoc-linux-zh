- pgno: 190
  md: '# Troubleshooting


    ZENworks Linux Management is a powerful tool that can be used to manage and update
    your Linux devices. However, because of the complexity of network environments,
    problems can occur that prevent ZENworks from doing its job. This chapter covers
    how to troubleshoot problems in the ZENworks Linux Management system.


    # Registering and Un-registering a Device


    There may be occasions when you need to un-register your workstation from the
    zone. With the local rug command you can un-register and then re-register a device
    to the desired zone.


    To un-register a device, do the following:


    +   1. Go to a command-line interface on the device.

    2. Enter the rug sl command to see all the services against this device is registered.
    Note the number of the service that you want to remove (this is the number in
    the first column of the output).

    3. Enter the following command to un-register from the service: rug sd <Number
    of the Service>.


    This removes the service. If the service is a ZENworks Linux Management service
    and you had registered it before, the act of un-registering does not remove the
    device in the object store. If you want to remove the device object, you must
    delete it in the ZENworks Control Center.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# CHAPTER 14: Troubleshooting


    To register a device, do the following:


    +   1. Go to a command-line interface or on the device.

    2. Enter the `rug s1` command to see all the services against which this device
    is registered. Check that you have not registered to the desired server. If you
    have, you need to un-register first.

    3. Enter the following command to register from the service: `rug sa <DNS or Address
    of ZENworks server>`.


    This registers your device to the ZENworks zone of that server. The act of registering
    a device object in the system.


    # Creating Custom Platforms


    On occasion, you may have some special custom distributions that your company
    has created based on one of the supported platforms of ZENworks Linux Management.
    These custom distributions can be recognized by ZENworks, and then RPMs in the
    bundles can have the new custom distributions as targets, enabling you to identify
    that the RPM is for those device types only.


    To create a new custom platform, complete the following:


    +   1. Launch ZENworks Control Center.

    2. Select the Configuration tab at the top of the browser.

    3. Select Platforms from the Management Zone Settings.

    4. Scroll to the bottom of the screen and select Add from the Custom Platforms
    snapshot. You are presented with the dialog box shown in Figure 14.1.


    FIGURE 14.1

    Add Platform dialog for creating custom target platforms.


    ![](img/1dc9ba96bb55315f8828b75f085ce4b4_191_0.png)'
  merge: -1
  img_proc: true
- pgno: 192
  md: '5. The simplest way to fill in the custom platforms is to copy a default platform
    that is similar to your custom system and then edit the contents. Select a similar
    platform by clicking on the drop-down menu list and selecting an existing target
    platform. Press OK.


    6. You are presented next with the Add Platform dialog, with the fields defaulted
    to your copied platform (see Figure 14.2). Edit the fields as desired.


    FIGURE 14.2

    Add Platform dialog box.


    ![](img/1dc9ba96bb55315f8828b75f085ce4b4_192_0.png)


    +   * Name—Enter the name of the platform as it is to be displayed in ZENworks
