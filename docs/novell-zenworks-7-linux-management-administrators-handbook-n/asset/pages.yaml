    List and status of ZENworks services.


    | Status | Type | URI |

    |---|---|---||

    | Active | ZENworks | ZENworks Linux Management | https://zlserver.zendemo.com/


    There are additional options for rug sa. You can see these by typing rug sa --help
    or you can refer to Appendix A, “Commands,” in this book.


    # Removing a Managed Device


    There may be a situation where you need to remove a device from the system. To
    remove a managed device, do the following:


    +   1. Open the ZENworks Control Center.

    2. Click on the Devices tab.

    3. Browse to the workstation or server you want to remove.

    4. Mark the check box to the device and click Delete in the title bar.

    Following only steps 1–4 does not remove the device; you must follow the next
    steps as follows:

    5. Log in as root on the managed device.

    6. Type rug s1 to view the services. Notice that each service running has a number
    next to it.

    7. Type rug sd <service number> to delete the service. Repeat this for each service.
    It is important to note that the services renumber each time you delete a service.

    8. Verify again that all services are deleted by typing rug s1.


    # Conclusion


    Device registration is a powerful and flexible way to import the devices you want
    to manage. Before you begin registering devices, make sure you have a plan on
    how you want them to appear. This ensures that your devices are organized well,
    making it easy for you to manage them going forward.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# System Settings


    This chapter discusses configuring the settings in ZENworks 7 Linux Management.
    System settings control the behavior and configuration of ZENworks 7 Linux Management.


    Within the ZENworks Control Center is a tab called Configuration. Clicking on
    this tab shows you a variety of options for controlling the behavior of ZENworks
    7 Linux Management. The Configuration view has five snapshots: Administrators,
    Management Zone Settings, Registration Keys, Default Registration Rules, and Licensing.


    # Administrators


    The Administrators snapshot enables you to create new administrators, edit administrator
    attributes, and delete administrators.


    The main administrator is always called "Administrator." This cannot be changed
    or renamed. However, you can change the password.


    To create a new administrator:


    +   1. Click on New in the Administrator snapshot title bar.


    +   2. The Add New Administrator dialog appears on the screen (see Figure 6.1).


    +   3. Enter the administrator name and password, retype the password, and click
    OK.'
