    # Management Zone Settings


    The main part of the configuration page is the Management Zone Settings snapshot.
    These settings drive the behavior of the Management Zone. The Management Zone
    is the back end ZENworks servers and all the devices that are connected to those
    servers. You can read more about architecture in Chapter 2, “Understanding ZENworks
    Linux Management.”


    Within the Management Zone Settings snapshot, you can configure


