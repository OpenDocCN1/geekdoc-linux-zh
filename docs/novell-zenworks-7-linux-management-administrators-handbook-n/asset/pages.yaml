- pgno: 113
  md: '# CHAPTER 7: Bundles


    button. Then select the desired devices and press OK to exit the pop-up dialog
    box. Press Next.


    +   The next screen is the summary screen. Press Finish to complete the bundle
    creation.


    You have now successfully created a bundle group. You can modify the bundle group
    by selecting the group and then using the snapshots displayed on the Add or Remove
    Members screen.


    # Conclusion


    This chapter discussed the creation and assignment of bundles and bundle groups.
    Bundles contain sets of RPM files or references to image files on ZENWorks servers.
    RPM bundles assigned to a device cause that device to install those packages.
    Assigning a preboot bundle assigns a specific image to the device when a re-image
    is requested, that image is applied.


    Users of previous versions of ZENWorks Linux Management will see that packages
    are now placed into bundles that can be assigned. Also, you will see later that
    catalogs are much like channels in previous versions of ZENWorks Linux Management.
    The enhancement with ZENWorks 7 is that bundles perform the installation without
    requiring a transaction to identify specific RPMs.


    Those of you who have a background in the traditional ZENWorks product will recognize
    that bundles are much like Application Objects from ZENWorks Desktop Management
    and Distributions from ZENWorks Server Management. Bundles represent content to
    be delivered to any device.'
