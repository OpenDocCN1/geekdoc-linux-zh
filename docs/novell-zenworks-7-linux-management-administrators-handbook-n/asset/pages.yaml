- pgno: 45
  md: '# CHAPTER 4: Understanding the ZENworks Control Center


    FIGURE 4.9

    ZENworks Control Center main home page.


    ![](img/1dc9ba96bb55315f8828b75f085ce4b4_45_0.png)


    On the main home page you see five snapshots: System Summary, Hot List, ZENworks
    Health, Upcoming Events, and the Watch List.


    The System Summary shows you the overall health of ZENworks Linux Management.
    You can see the status of the servers, workstations, policies, and bundles. Four
    columns across the top for each of these show Critical Status, Warning Status,
    Normal Status, and the Total. You can drill down to the status details by clicking
    on the underlined name. When you do, you see the logs and messages for the status
    you clicked. You can then acknowledge the messages and- they are cleared from
    the list.


    The Hot List shows devices that have unacknowledged warnings or errors. You can
    edit the Hot List snapshot by clicking on Advanced in the title bar.


    The ZENworks Health snapshot shows the health of the replication status of your
    servers, as well as the health of the backend services. If you see a Critical
    or Warning status, you can click on the underlined text to view the messages.


    Upcoming Events displays events (policies, images, and so on) that are to occur
    on the date selected. The times the events occur for the specified date are also
    shown. You can change the date by typing it in manually, choosing the calendar
    icon, or clicking on the options to move to next day, next week, or next month.


    The Watch List is a powerful tool for tracking the status of a specific workstation,
    server, policy, or bundle. This is especially useful if you have a workstation
    that has had sporadic problems or when you are applying an important policy and
    you want to know the status every time you launch the ZCC. To add an item to the
    watch list, follow these steps:


