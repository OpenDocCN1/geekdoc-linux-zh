    value to ZENworks. The options include Continue Modifying the Text Files and Do
    Not Modify the Text Files.

    2. Choose any executable you want to run after the text file editing has been
    completed. This is defined in the same manner as in the prior step. Press Next.

    3. Complete the wizard and press Finish.


    To add changes to the policy, you must browse to the policy and then select to
    see the details of that policy. You may add changes to the one file or add files
    to change.


    To add changes, select the file and select New, Change, and enter the changes
    requested. All the changes are entered into a dialog box that mimics the wizard.


    To add another text file to change, select the New, File menu option and enter
    the filename. All the changes are entered into a dialog box that mimics the wizard.


    # Conclusion


    Any editing to policies may be completed by browsing to the policy and selecting
    the details of the policy.'
  merge: -1
  img_proc: true
