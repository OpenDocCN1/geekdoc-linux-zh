- pgno: 146
  md: '# Reporting


    This chapter discusses reporting in the ZENworks 7 Linux Management product. Reporting,
    like all administrative functions, is performed in the ZENworks Control Center.


    Through the reporting features of ZENworks Linux Management, you may create, delete,
    modify, and generate reports. The output from the reports may be printed or exported
    to HTML, XML, or a CSV file.


    Reports in ZENworks Linux Management enable you to create tabular output using
    inventory data (both hardware and software) that has been collected from the managed
    devices in the network.


    # Creating Reports


    You can create a report in ZENworks 7 Linux Management by executing the following
    steps:


    +   1. Open your browser and enter the URL for the ZENworks Linux Management primary
    server (for example, http://server/zenworks).

    2. Log in with your administrator account by entering your admin account and password.
    Press Login.

    3. Click on the Reports menu at the top of the toolbar on the page. You should
    see a display similar to Figure 10.1.'
  merge: -1
  img_proc: true
