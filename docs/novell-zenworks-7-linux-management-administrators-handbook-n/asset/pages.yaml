  md: '# Logging


    By default, ZENworks Linux Management attempts to log lots of information and
    event data. You can configure the level of the logging on both the server and
    the device through zone settings. See Chapter 6, “System Settings,” for more information
    about zone settings.


    In ZENworks Linux Management, all logs are stored in a single location: `/var/opt/novell/log/zenworks`
    Go to this directory to discover all the various logs that will contain information
    about the processes running on your system. Logs on the device may be found in
    the same location.'
