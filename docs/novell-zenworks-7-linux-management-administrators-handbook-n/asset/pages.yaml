    # How to Create a Preboot Bundle


    Preboot bundles are associated with ZENworks imaging and make it possible to take
    or deliver an image to a managed device.


    A preboot bundle requires that you take two steps to apply the image to the device.
    The extra steps are there to ensure that you really want that action to take place
    on the device. All preboot bundles may result in actions that destroy the data
    on the drive as part of the imaging process.


    The first step involves creating and assigning a bundle to a device. In the second
    step you either launch the Perform Preboot Task action or edit the preboot work
    snapshot on the device summary page.


    Complete the following steps to create a Preboot bundle in ZENworks 7 Linux Management:


    +   1. Launch a browser and enter the URL of the ZENworks Control Center.

