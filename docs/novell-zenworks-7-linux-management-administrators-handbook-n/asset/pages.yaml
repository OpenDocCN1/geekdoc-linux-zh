- pgno: 88
  md: '# Bundles


    This chapter discusses bundles in the ZENWorks 7 Linux Management product. Bundle
    creation, modifications, and assignments, like all administrative functions, are
    performed in the ZENWorks Control Center.


    # What Are Bundles?


    Bundles are collections of content. This content can then be delivered to managed
    devices in the system.


    Two bundle types are available in ZENWorks 7 Linux Management: RPM bundles and
    preboot bundles.


    RPM bundles are collections of RPM packages that can be assigned and delivered
    to a managed device. Each RPM package within a bundle may specify the architecture
    to which that RPM package is targeted. A bundle may contain any number of RPM
    files that are to be installed on the target device.


    Preboot bundles contain a script or a reference to an image file that needs to
    be placed on a device. Additionally, you can perform preboot actions that take
    an image of a device at boot time and store that image on the server. A preboot
    bundle is delivered as part of the PXE system that can download an execution environment
    before the installed OS is launched on the target machine. The preboot environment
    can also be launched from a CD-ROM boot or from a locally installed ZENWorks partition.
    From this environment, the system can deliver the preboot bundle without PXE.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# What Are Are the Advantages of Bundles?


    Bundles are a good way to manage software collections. After a bundle is created,
    you can assign a bundle to a device and all appropriate RPM packages within the
    bundle are installed to the managed device. By using bundles you can group your
    RPM sets into logical entities that simplify the management of software delivered
    to your Linux systems.


    # Bundle Groups


    You may also create bundle groups. A bundle group contains an administered set
    of bundles and can be assigned to a managed device as one entity. So with bundle
    groups you can define bundle sets that should be managed and assigned as a single
    entity. Bundle groups may contain only bundles and not other bundle groups.


    # How to Create an RPM Bundle


    Complete the following steps to create an RPM bundle in ZENworks 7 Linux Management:


    +   1. Launch a browser and enter the URL of the ZENworks Control Center.

    2. Log in to the ZENworks Control Center.

    3. Press Bundles on the menu tab at the top of the page.

    4. Press the New drop-down menu and choose Bundle. This starts the Bundle Creation
    Wizard (see Figure 7.1).


    Complete the wizard to create a bundle. The steps of the wizard are described
    in the following sections.


    # RPM Bundle Creation Wizard: Bundle Type


    On this first page you need to select the RPM bundle type to create. An RPM bundle
    enables you to specify a set of RPM files you wish to install on the targeted
    device. Select the RPM bundle type. Press Next. This moves you to step 2 of the
    wizard.'
  merge: -1
  img_proc: true
