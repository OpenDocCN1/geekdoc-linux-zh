- pgno: 46
  md: 'Searching Within a View


    +   1. Click on the Add drop-down list.

    2. Choose the item type you want to add (Servers, Workstations, Bundles, Policies).

    3. Select the item(s) from the Object Browser and click OK.


    Items in the Watch List remain in the list until you remove them.


    # Navigating


    You will find navigating in the ZENworks Control Center to be easy and intuitive.
    The controls and behaviors are similar to those you use for navigating a standard
    web page. Items that can be acted on are underlined, or the mouse cursor changes
    to a hand. A single left-mouse click is all that is needed to act on an item.
    I still find it funny to watch people double-click on items in a web page. Save
    your finger for more important things like dialing your cell phone for pizza.


    Hint: In some wizards or screens you have to scroll to the bottom of the page
    to see the Next, Back, and other buttons. Running at a higher video resolution
    helps you avoid these situations. The ZENworks Control Center was designed to
    run at a minimum of 800x600. We recommend that you run at a minimum of 1024x768
    or higher.


    # Searching Within a View


    Some List Views also have an option to search. Searching is a powerful tool for
    finding information such as a specific workstation or server (see Figure 4.9).


    Searching is done by entering the Name and in most cases Type and Status. You
    can also use wildcards when doing a Name search. For example, if you wanted to
    find all workstations that end in finance that are running Novell Linux Desktop,
    you would do the following on the workstation view:


    +   1. Enter *finance in the Name field.


    +   2. Choose Workstation from the Type drop-down list.

    3. Choose Novell Linux Desktop from the Operating System drop-down list.

    4. Choose Any from the Status drop-down list.

    5. Click Search.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# CHAPTER 4: Understanding the ZENworks Control Center


    You can also perform an advanced search. This is done by clicking on the Advanced
    Search link in the top right corner of the Search box. In the advanced search
    you can choose the option to search with a filter in a report. This is a great
    way to leverage canned or custom reports to do your search. For example, you may
    want to search for devices registered within the last 24 hours. This is done by
    choosing that report and clicking Search.


    The other option in Advanced Search is to create a new filter. This provides a
    lot of flexibility when searching. You can create a New Filter or a New Set. Sets
    are groupings of Boolean searches. You can choose the sets are AND or OR by clicking
    on the drop-down list box next to Sets to Be. You can create multiple sets and
    filters by clicking on the New Set or New Filter multiple times. Figure 4.10 shows
    an example of a complex search containing both filters and sets. If you want to
    delete a set or filter, simply check the box next to the one you want to delete
    and then click Delete. Notice that the word Delete is dimmed if no items are checked.


    FIGURE 4.10

    Advanced search using filters and sets.


    ![](img/1dc9ba96bb55315f8828b75f085ce4b4_47_0.png)'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Customizing the ZENworks Control Center


    Every snapshot in the Portal View has a Minimize/Expand button on the far right
    side of the title bar. When a snapshot is expanded, the button displays two up
    arrows. In this state, the items beneath the title bar are visible. When a snapshot
    is minimized, the button displays two down arrows. In this state, the items below
    the title bar are hidden. The state of the snapshots is preserved as you navigate,
    or when you launch the ZENworks Control Center later.


    # The Future


    The ZENworks Control Center is a powerful tool for managing ZENworks 7 Linux Management.
    Future releases of other ZENworks products will also leverage the ZENworks Control
    Center for administration. This will enable you to manage Linux, Windows, NetWare,
    and Novell Open Enterprise Server with a single web tool.'
  merge: -1
  img_proc: true
