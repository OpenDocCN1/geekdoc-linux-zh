- pgno: 267
  md: '# Novell.

    ZENworks 7 Linux Management

    Administrator’s Handbook


    Get in Control with ZENworks 7 Linux Management

    Novell''s Linux offerings provide a wide range of network services and allow organizations
    of all sizes to leverage Linux and open-source technologies by developing a sound
    foundation for secure enterprise computing. Now, Novell ZENworks 7 Management
    allows organizations of all sizes to centrally manage these ever-increasing, increasingly
    complex infrastructures of Linux systems.


    This official Novell Press book is the definitive guide to ZENworks 7 Linux Management.
    Written for all system administrators, consultants, and others who implement and
    support ZENworks to effectively manage a Linux infrastructure and keep Linux systems
    of all kinds up and running with all the right stuff.


    Topics covered in this book range from the fundamentals of managing devices, to
    software and updates installed on those devices, to taking and restoring images
    of those devices, to applying policies to Linux devices that will enforce business
    rules.


    Whether you need to set up a Linux desktop quickly for a small department or you
    need to set up an entire Linux Infrastructure, Novell. ZENworks 7 Linux Management
    Administrator’s Handbook is your complete, definitive solution.


    # Inside You’ll Find Just What You Need to...


    +   - Install, configure, and update Linux systems

    - Install and configure applications

    - Make use of policies

    - Manage Linux services

    - Establish standard operating environments

    - Monitor software distributions

    - Harden Linux systems


    ABOUT THE AUTHORS


    Ron Tanner is a senior product manager for Novell ZENworks, responsible for defining
    the future of the product. He has more than 17 years of experience in developing
    software and leading teams into exciting, cutting-edge technology. He has co-authored
    six other ZENworks Novell Press titles.


    Richard Whitehead is the director of product marketing for ZENworks, responsible
    for managing and developing enterprise systems solutions for Novell customers.
    He has more than 15 years of experience in the software industry.


    Published with the authorization and collaboration of Novell, Inc.


    DVD includes evaluation version of ZENworks 7 Linux Management and entire book
    in PDF format


