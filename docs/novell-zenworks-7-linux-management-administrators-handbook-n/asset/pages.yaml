  md: '# How to Assign a Bundle to a Device


    When a bundle is assigned to a device either directly or indirectly, ZENworks
    installs the RPMs in the bundle or applies the preboot bundle to that device.


    A bundle that is newly assigned to a device is installed when the next bundle
    refresh cycle occurs. This can happen at boot time or based on the bundle refresh
    setting in the managed device''s zone.


    You can follow the following method to assign a bundle to a device. One method
    is as follows:


    +   1. Open the ZENworks Control Center.

    2. Click on Devices on the menu at the top of the screen.

    3. Browse within the Devices folder to the folder where the specific device is
    located.

    4. Select the specific device by clicking on the check box in the list next to
    the device. This activates the rest of the device menu.

    5. Select the Action menu item to open the drop-down list and select Assign Bundle.
    This launches the Bundle Assignment Wizard.


    # What Happens When a Bundle Is Assigned to a Device


    When an RPM bundle is assigned to a device, ZENworks attempts to install the packages
    in that bundle on device. When the device performs a refresh, which is done at
    boot time or when the scheduled refresh interval is reached, the device becomes
    aware of any newly assigned bundles.


    Because of the destructive nature of a preboot bundle, it is not automatically
    applied to the device. Manual steps must be performed for a preboot bundle to
    be applied to the device. Take the following steps to cause the device to run
    the preboot bundle at the next boot:


    +   1. Open the ZENworks Control Center.

    2. Browse to the device that needs to run the preboot bundle.

    3. Open the device to the Summary page.

    4. Select the Advanced option in the Preboot Work snapshot. A sample of this snapshot
    is displayed in Figure 7.19.'
  merge: -1
  img_proc: true
