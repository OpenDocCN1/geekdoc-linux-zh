- pgno: 129
  md: '# CHAPTER 9: Policies


    4. This takes you through the Assign Policy Wizard, as described in the previous
    section.


    You may also assign a policy to a folder by entering the folder''s details. You
    enter a folder''s details by pressing the Details link next to the folder name.
    Within that folder''s details is an Effective Policies snapshot. You can use this
    method to assign policies in the same way as described in the following "Assigning
    a Policy in Policy Details" section.


    When a policy is assigned to a folder, all devices in that folder and any subfolders
    receive that policy. This "inheritance" of a policy through a folder above can
    be overwritten by assigning a policy closer, in a hierarchical fashion, to the
    device.


    For example, if PolicyA was assigned to Folder1, any devices in Folder1 and Folder1.1
    would get PolicyA applied if they met the system requirements for that policy.
    If a separate Policy(called PolicyA1) were applied to Folder1.1, the devices in
    Folder1.1 would get PolicyA1 and not get PolicyA. To discover which policies will
    be applied to a device, you can pretend to enter ZENWOKs the location where the
    device is in the object store. Then walk up the folders searching for a policy.
    When you find a policy, you stop searching for that particular type of policy.
    You may continue to search the folder hierarchy looking for other policies, but
    you will not apply any policy of the type that you had previously found.


    The only exception to this rule is the Generic GNOME policy. This policy is cumulative,
    meaning that it is a merge of all the effective Generic GNOME policies that are
    associated to the device or a group or container of the device.


    # Assigning a Policy in Policy Details


