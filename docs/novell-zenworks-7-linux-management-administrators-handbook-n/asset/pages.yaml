- pgno: 35
  md: '# Upgrading ZENworks Linux Management from Previous Versions


    ZENworks 7 Linux Management has a very different architecture than previous releases.
    For example, ZENworks 7 Linux Management has introduced an object store to manage
    the system. Consequently there is a migration process involved in moving to this
    version.


    You can use two techniques to move information from your existing ZENworks Linux
    Management system to the new ZENworks 7 Linux Management installation: synchronization
    or migration.


    The synchronization method copies the RPM files and brings them into the new system,
    whereas the migration method imports the database along with the RPM files. Both
    methods require that the new agent be installed on the device for it to be managed
    by the new system.


    Because of the information length time to migrate the database, and because the
    migration brings over only the package information, it is preferable to use the
    synchronization method to bring your packages over your ZENworks Linux Management
    6.6 system. After that synchronization is complete, redirect your new ZENworks
    7 to the Novell corporate update site.


    # Synchronization Method


    The synchronization method requires that you retrieve channels from your existing
    ZENworks Linux Management 6.6 installation just as you would synchronizing other
    Linux sources into ZENworks 7 Linux Management. See Chapter 12, “Keeping ZENworks
    Linux Management Servers Synchronized," for more detailed information.


    Channels in the existing system will become bundles in the new system. They are
    placed in a catalog that is assigned to all the devices, allowing them to retrieve
    the updated RPMs.


    When the agent is installed on the device, the device registers with the new ZENworks
    7 system and then begins its updates from there. To install the agent you can
    place the ZENworks 7 agent RPMs into a channel and then have the device perform
    a transaction to run the setup. You to modify the configuration files to point
    your devices to the new ZENworks 7 system.


    The synchronization method gets all the RPMs and channels over to your new system.
    The inventory is regenerated by the new system. Transactions are not available
    in the new system and have to be re-created with a Remote Execute policy.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Upgrading ZENWorks Linux Management from Previous Versions


    # Migration Method


    The migration method delivers all the database information that is relevant

    along with the files for the RPMs. This step, however, requires some manual

    administration.


    Complete the following steps to migrate your system to the new ZENWorks 7:


    +   1. Log in to the existing ZENWorks 6.6.x system as root.

    2. Dump the existing ZENWorks database by executing the following command:

    ```bash

    pg_dump -R -c -f rcserver.dump rcserver -U rcadmin

    ```nThis creates a dump of the database.

    3. Copy the resulting dumped database and all the packages from the

    /zimian directory over to the new ZENWorks 7 system using the secure

    command:

    ```bash

    scp -r rcserver.dump /zimian root@<server>

    ```nThis copies the files to the home directory of root on the target server.

    4. The next step is to create a new database on the new ZENWorks 7 Linux

    Management server and load the dumped information into this new data-base. Log
    in to the ZENWorks 7 server as root and execute the following:

    a. Verify zlm-upgrade is in your path. It should be located at

    /opt/novell/zenworks/bin/zlm-upgrade.

    b. Retrieve the password to the ZENWorks database by doing a cat

    /etc/opt/novell/zenworks/secretserver and capturing the

    output.

    c. Switch to postgres user with the su - postgres command.

    d. Create the database you need by entering the following command:

    ```bash

    postgresserver:/# createdb -U zenadmin zlm661

    ```


    When prompted for the password, enter the output from the secretserver

    file.


    +   e. Type Ctrl+D to return to root user.

    f. Now that the database is created, you need to configure postgres to

    use it. Do this by editing the /var/lib/pgsql/data/pq_hba.conf

    file and add the following entries:


    | zlm661 | zenadmin | md5 |

    | --- | --- | --- |

    | host | zlm661 | zenadmin | 0.0.0.0.0.0.0 md5 |


    Save the file.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# CHAPTER 3: Installing ZENWorks Linux Management


    +   g. Enter the command `/etc/init.d/postgresql restart` and wait for the database
    to finish coming up.


    +   h. Enter the following to import the dumped data into the zlm661 database:

    ql -U zenadmin zlm661 <rcserver.dump


    When prompted for a password, enter the key from the secretserver file.


    +   5. Run the following command to migrate the data from the database and the
    file system packages into ZENWorks 7:

    /opt/novel11/zenworks/bin/zlm-upgrade zlm661 zenadmin ximian/red-carpet-server
    <password from secretserver file>


    +   6. When these steps are completed, the temporary database may be removed.
    Now all the package information, channels, and so on have been brought into ZENWorks
    7. Additionally, the administrators have been created in the new system and the
    RPM files have been copied into the proper locations.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Understanding the ZENworks Control Center


    This chapter discusses the main administration console for ZENworks 7 Linux Management,
    the ZENworks Control Center (ZCC).


    # What Is the ZENworks Control Center?


    The ZENworks Control Center is the heart of ZENworks 7 Linux Management. It is
    a task-oriented, web-based management console. If you prefer text-based administration,
    you can use ZLMAN. You can learn more about ZLMAN commands in Appendix A, "Commands."


    The ZENworks Control Center is divided into three primary regions (see Figure
    4.1). These regions are the Banner, the Navigation Bar, and the Content region.
    The Content region is further divided into the Header and the View.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# CHAPTER 4: Understanding the ZENworks Control Center


    FIGURE 4.1

    Views within the ZENworks Control Center.


    ![](img/1dc9ba96bb55315f8828b75f085ce4b4_39_0.png)


    # The Banner


    The Banner at the top of the ZENworks Control Center is always displayed. The
    contents of the Banner do not change. Within the Banner you find the Novell branding
    along with two other options. Clicking on Logout logs you out of the ZENworks
    Control Center and returns you to the login screen. Clicking on Help takes you
    to the help options, where you can get detailed help about the ZENworks Control
    Center.


    The Banner also contains tabs for easier navigation of tasks. From left to right,
    these tabs are Home, Devices, Policies, Bundles, Reports, Configurations. Clicking
    on the Home tab takes you back to your default startup page, or to the last task
    you were doing on that page. Details about the other tabs can be found in their
    corresponding chapters.


    Clicking on the Novell N on the far right of the Banner takes you to www.novell.com.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Content Views


    The Content region is the main area where tasks are performed. There are four
    different Content Views: the Portal View, the List View, the Settings View, and
    the Wizard View.


    # PORTAL VIEW


    The Portal View is one of the views you will see most often in the ZENworks Control
    Center. A Portal View is made up of several self-contained components called snapshots.
    Each snapshot contains information about a specific part of the system being managed.
    In Figure 4.2, you can see an example of a workstation View that contains a snapshot
    for the hardware summary, as well as a snapshot for the effective policies. There
    is no limit to the number of snapshots that can be displayed in a Portal View.


    # Figure 4.2


    Workstation Portal View.


    ![](img/1dc9ba96bb55315f8828b75f085ce4b4_40_0.png)


    # List View


    The List View, as you can envision from the name, shows a list of information
    from data sources like the database and the ZENworks Object Store. The information
    in the List Views enables you to easily sort, search, and perform actions on the
    data. Figure 4.3 shows an example of a server list view. In this view you can
    sort on any column, add or remove columns, as well as perform a search. To sort
    on a column item, or to change the sort order, simply click on the column heading.


    Also in the List View are options just above the columns for New, Edit, Delete,
    and the icon to move up to a level. The items in the New and Edit drop-down lists
    change depending on where you have browsed. You can also see other options next
    to these. For example, if you are looking at a list of workstations'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# CHAPTER 4: Understanding the ZENworks Control Center


    you see the option for Action. However, if you are looking at a list of reports,
    you see the item for Generate. Remember that some of these options are grayed
    out until you mark the check box next to a listed item.


    FIGURE 4.3

    Server List View.


    ![](img/1dc9ba96bb55315f8828b75f085ce4b4_41_0.png)


    SETTINGS VIEW

    The Settings View enables you to change the settings for an object. For example,
    clicking on the word Advanced on the title bar for a snapshot takes you to the
    settings for snapshot (see Figure 4.4).


    FIGURE 4.4

    Hot List Settings View.


    ![](img/1dc9ba96bb55315f8828b75f085ce4b4_41_1.png)


    WIZARD VIEW

    The Wizard View enables multistep, or complicated, tasks to be accomplished step
    by step. One example of a Wizard View is the creation of a policy (see Figure
    4.5). You can see more about creating policies and the steps needed by going to
    Chapter 9, "Policies."'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# FIGURE 4.5


    New Policy Wizard View.


    ![](img/1dc9ba96bb55315f8828b75f085ce4b4_42_0.png)


    # Navigation Bar


    Each view already described is coupled with the Navigation Bar. The contents of
    the Navigation Bar vary based on the Content View For example when you click the
    Device Tabs in the Banner the top of the Navigation Bar changes to Device Tasks.


    Some items in the Navigation Bar may always be shown if they are global An of
    a global item is the Frequently Used option. The items that display under the
    Frequently Used option are automatically built as you perform tasks your top ten
    frequently performed tasks are listed. The most frequently performed task is at
    the top of the list Items in the list that are not used for two days are automatically
    removed from the list The Frequently Used list is customizable in this release.


    # Object Browser


    In some cases you are required to select multiple objects. In these cases you
    are taken to the Object Browser. One example of using the Object Browser is to
    add a server to the Watch List (see Figure 4.6).


    To select items in the Object Browser either click on the arrow item next to the
    item or click select All. To remove items click on the delete icon next to the
    item, or click on Remove All.'
