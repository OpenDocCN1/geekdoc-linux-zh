- pgno: 43
  md: '# CHAPTER 4: Understanding the ZENworks Control Center


    FIGURE 4.6

    Select Servers Browser.


    ![](img/1dc9ba96bb55315f8828b75f085ce4b4_43_0.png)


    # Launching the ZENworks Control Center


    You can launch the ZENworks Control Center through either Internet Explorer 6
    SP1 (or higher) or Firefox 1.0 (or higher). If you are using a browser that''s
    not supported, you see a warning message when you log in. Enter the URL into the
    URL locator. The default URL for the ZCC is https://server/zenworks, where server
    is either the DNS or IP address of the ZENworks.


    The first screen you see is the ZENworks Login (see Figure 4.7). Enter the Username
    and Password you assigned during the installation. You can also choose the Language.
    The ZENworks Control Center supports English, French, German, Portuguese, and
    Spanish.


    Upon successful login, you see the Getting Started page (see Figure 4.8). From
    this page you can


    +   - Get a product overview

    - Learn how to register Linux devices

    - Learn how to deliver an application

    - Learn how to use policies

    - Link to online documentation'
