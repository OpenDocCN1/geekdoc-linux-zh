  md: '# SET THE "BLACK OUT" TIME RANGES WHEN EXECUTION SHOULD NOT OCCUR


    This option enables you to specify time ranges, which may fall within a calculated
    Start and end time. For example, imagine that you like to update your content
    every Saturday of the month. However, at the end of each business quarter you
    want your servers to work on end-of-quarter activities and not consume cycles
    transmitting package content. You can make this happen by entering your schedule
    and then selecting blackout dates for the end of each quarter. This, if the calculated
    start time occurs within a specified blackout date, ZENworks does not launch the
    replication process. The content replication process is not started until the
    next schedule time.


