  md: '# Chapter 3 Building a VPN with SSH and PPP


    and adding your routes, with the hope that everything completes in a timely manner
    that are used in many publicly available VPN creation methods. pppd sets up various
    environment variables, such as LINKNAME and IPREMOTE, that make it easy for our
    VPN scripts to determine which VPN has been established and to learn the necessary
    network parameters. Thus, we will have ip-up launch our vpn-server or vpn-client
    program automatically to set up the new routes. pppd calls /etc/ppp/ip-up, but
    the way this file works is radically different between Linux distributions. For
    some, it is not provided at all. Thus, we will cover a few methods you can use
    to point ip-up to our VPN scripts.


    PPP Customizations

    In the following examples, we assume that you have a default ppp installation.
    If you have created the PPP-related files that we assume are not around, our symlink
    solution will not work for you. Instead, append a line to your ip-up-related script
    that launches vpn-client or vpn-server manually.


    Slack: No ip-up Script

    Slack doesn''t provide an ip-up script at all. Thus, we need to create one point
    to our VPN scripts. The easiest way to do this is by using a symlink:


    ```

    falcons-client# ln -s /opt/ssh-vpn/bin/vpn-client /etc/ppp/ip-up

    ```


    or


    ```

    bears-server# ln -s /opt/ssh-vpn/bin/vpn-server /etc/ppp/ip-up

    ```


    Debian: /etc/ppp/ip-up.d

    The Debian ip-up script will automatically launch any scripts contained in the
    /etc/ppp/ip-up.d directory. Thus, we need to create a link to our VPN scripts
    in this directory, as follows:


    ```

    falcons-client# ln -s /opt/ssh-vpn/bin/vpn-client /etc/ppp/ip-up.d/vpn-client

    ```


    or


    ```

    bears-server# ln -s /opt/ssh-vpn/bin/vpn-server /etc/ppp/ip-up.d/vpn-server

    ```


    Red Hat: /etc/ppp/ip-up.local

    The ip-up script for Red Hat and other Red Hat-based distributions automatically
    launches /etc/ppp/ip-up.local after performing its own processing. All we need
    to do is create a symlink pointing to our VPN scripts named ip-up.local.


    ```

    falcons-client# ln -s /opt/ssh-vpn/bin/vpn-client /etc/ppp/ip-up.local

    ```


    or


    ```

    bears-server# ln -s /opt/ssh-vpn/bin/vpn-server /etc/ppp/ip-up.local

    ```'
