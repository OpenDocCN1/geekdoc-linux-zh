    * Enterasys Networks, Aurorean Virtual Network

    * eSoft, InstaGate EX

    * Hi/fn, IPSecure

    * Microsoft, Windows 2000 SP1

    * NetScreen, NetScreen

    * Nokia, Nokia VPN'
