    # Testing Your Network


    To ensure your network is operating properly, you should try a variety of methods
    to test the network. First, ping the gateway:


    ```

    # ping <gateip>

    ```


    You should see output that looks like the following:


    ```

    64 bytes from <gateip>: icmp_seq=0 ttl=255 time=0.0 ms

    64 bytes from <gateip>: icmp_seq=1 ttl=255 time=0.0 ms

    64 bytes from <gateip>: icmp_seq=2 ttl=255 time=0.0 ms

    64 bytes from <gateip>: icmp_seq=3 ttl=255 time=0.0 ms

    ...

    <gateip> ping statistics

    4 packets transmitted, 4 packets received, 0% packet loss

    round-trip min/avg/max = 0.0/0.0/0.0 ms

    ```


    You should have 0% packet loss; otherwise, there are other problems with your
    network. Contact your network administrator to resolve these problems.


    Next, ping the other end of the VPN connection. A small percentage of packet loss
    is acceptable, but anything more might make setting up the VPN difficult.

    Lastly, perform a traceroute to the other VPN gateway:

    # traceroute <ipaddr> of @cn.exemplify.com'
