  md: '# CIPE Configuration 279


    # Using CIPE with gated


    Note that if you run gated (the gateway routing daemon), you should put the static
    routing entries associated with CIPE tunnels that you have in /etc/gated.conf.
    An easier way of doing this is to notify gated of the changes in interface configuration
    by directly invoking a user-interface utility for gated gdc. The last four lines
    of the preceding ip-down script show a simple command that will tell gated to
    recheck the interface configuration. Simply remove the comment mark (#) in front
    of the gdc interface command to enable it.


    # Using Multiple Configuration Files


    If you want to use a number of CIPE connections, you will need a way to select
    different options, ip-up, and ip-down files on a per-connection basis. You can
    do this by assigning a unique name to connection and creating a set of configuration
    files for each name.


    For example, if you have three CIPE tunnels bbone, telework, and v42b, you can
    create a directory for each and copy options, ip-up, and ip-down files to those
    directories. Then you should modify each options file to refer to the right ip-up
    script. For example, the options file for bbone might look as follows:


    ```

    ptaddr 10.1.3.1

    ipaddr 10.1.3.2

    me bbone.rtr-1.uucp-nonex.com:9999

    peer bbone.rtr-2.europe-nonex.com:9999

    ipup /etc/cipe/bbone/ip-up

    ipdown /etc/cipe/bbone/ip-down

