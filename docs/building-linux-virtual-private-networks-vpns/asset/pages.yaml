  md: '# ZLIB compression is not supported.


    This message indicates that VTun was compiled without Zlib support. To correct
    this, download and compile Zlib. The other options are to use LZO compression
    (if it is installed) or to disable compression entirely.


    # LZO compression is not supported.


    This error is generated when VTun attempts to initialize LZO compression on a
    tunnel when LZO support was not added at compile time. To correct, disable compression
    or use Zlib.


    # Session network timeout.


    An established tunnel lost connectivity to the remote end. Make sure the remote
    end is still reachable and that VTun is running on it.


    # Encryption is not supported.


    VTun was compiled without OpenSSL support. To correct this, you will need to download
    and install the OpenSSL libraries.


    # Traffic shaping is not supported.


    VTun was compiled without traffic shaping support. Traffic shaping is disabled
    by running the configure script with the `disable-shaper` option. To correct this
    problem, rerun the configure script and recompile VTun.


    # No hosts defined.


    No tunnels are defined within your configuration file. Define a tunnel (using
    the examples listed earlier in this chapter as guidelines) and restart vtund.


    # Connection timed out.


    The client timed out while attempting to connect to the server. Make sure the
    server is reachable by pinging it. If you were attempting to connect by name,
    make sure DNS resolves to the correct IP address. Also, make sure the port settings
    on the client and the server are the same.


    # Denied connection from *host*.


    The server has denied a connection to a client. Make sure the passwords are the
    same on both machines.


    # Compatibility


    Although VTun is based on several standards, it is not compatible with any other
    tunneling protocols. This is because of the way the VTun client and server initiate
    connections.


    VTun itself, however, is supported on several different platforms. In addition
    to Linux, VTun is also supported on the following operating systems:


    +   * The BSD family: FreeBSD, OpenBSD, NetBSD

    * Solaris'
