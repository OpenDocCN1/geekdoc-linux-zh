  md: '# VPN Scripts 97


    You have two main methods of controlling your ssh command. The first is by creating
    entries in ~/.ssh/config, as shown earlier in this chapter. You can alternatively
    (or additionally) place them in the client_ssh_args variable. This variable is
    a simple string placed immediately after the $SSH command is specified in the
    pty argument to pppp.


    You can include options -l username or -p 9876. You can also place any arbitrary
    option available in ~/.ssh/config, but you must rewrite them slightly. For example,
    the command-variant of the ~/.ssh/config option Hostname client.example.org would
    be -hostname=client.example.org when used over the command line.


    We generally prefer to put all ssh configs in one location, either in ~/.ssh/config
    or in the /opt/ssh-vpn/etc/vpn_name configuration files. This makes it easier
    to see all the options at once


    # Starting and Stopping the VPN


    To start your VPN manually, you can simply run the following on the client:


    ```

    falcons-client# /etc/init.d/vpn start

    ```


    You can only start the VPN on the client because it is the VPN that begins the
    SSH connection. To stop the VPN, you can run the following:


    ```

    root# /etc/init.d/vpn stop

    ```


    You can stop the VPN from the client or the server because all it does is kill
    the relevant pppp command. You can also start or stop the VPN by specifying the
    VPN name manually to vpn-server or vpn-client command, for example:


    ```

    bears-server# /opt/ssh-vpn/bin/vpn-server stop vpn1

    falcons-client# /opt/ssh-vpn/bin/vpn-client start vpn1

    ```


    # Supporting Multiple VPNs


    Our scripts are designed to support any number of VPN connections, and the number
    you initiate or sustain is limited by the resources available (memory, processing
    power, number of processes, and so on) on the machines involved.


