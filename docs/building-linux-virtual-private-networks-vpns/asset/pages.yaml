  md: "A sample configuration file looks like this:\n\n```\nEther-tunnel {\n    pass\
    \ password1;\n    type ether;\n    proto tcp;\n    comp zlib:9;\n    encr yes;\n\
    \    keepalive yes;\n\nup {\n    ifconfig %% 192.168.254.253 netmask 255.255.255.252\"\
    ;\n    brctl addbr bridge0\n    brctl addif bridge0 eth1\n    brctl addif bridge0\
    \ %%\n    ifconfig eth1 0.0.0.0;\n    ifconfig %% 0.0.0.0;\n    ifconfig bridge0\
    \ 192.168.1.254 netmask 255.255.255.0\"\n}\ndown {\n    brctl delbr bridge0\n\
    \    ifconfig eth1 192.168.1.254 netmask 255.255.255.0\"\n}\n};\n}\n```\n\nIf\
    \ you wanted to add support for another protocol on ethernet, you could add the\
    \ appropriate protocol routing information in the up section.\n\n# Broadcasts\n\
    \nNote that, in this configuration, all broadcast traffic will be forwarded across\
    \ the tunnel. Although this might be desirable to significantly degrade the performance\
    \ of your VPN.\n\nIn the up section, brctl commands have been added to create\
    \ a bridge named bridge0. Once the bridge has been created, we add the eth1 and\
    \ the newly created tap interface (referenced by the %). Adding these two interfaces\
    \ to the bridge will mirror the raw ethernet frames between them. Any frame that\
    \ eth1 receives, the tap interface will also receive. Once the tap interface receives\
    \ a frame, it is forwarded to the VTun client.\n\nOnce the bridge has been created,\
    \ interfaces added to the bridge will allow IP connectivity. So that clients using\
    \ 192.168.1.254 as a gateway address will still be able to reach it, the IP is\
    \ assigned to the bridge0 interface.\n\nAfter the bridge has been created, the\
    \ brctl show command is used to view the status.\n\nAside from protocol-routing\
    \ information, the other change that needs to be made is to the type field. Changing\
    \ this to ether configures the connection to ethernet."
