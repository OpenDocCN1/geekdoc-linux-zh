  md: '# 108 Chapter 4 Building a VPN with SSL/TLS and PPP


    We must also come up with a name for our VPN. For our examples, we will use vpn1.
    Our scripts can establish more than one VPN at a time, and this name helps differentiate
    them.


    # Creating Your Keys and Certificates


    We want to have our SSL connection authenticated at both ends, thus ensuring that
    the endpoints are legitimate. To do so, we must create keys and certificates for
    both our client and server. We will have our VPN server require certificate authentication
    on both ends, which is not the default for SSL connections.


    Because we are striving for laziness, we will create keys that are self-signed.
    To generate our keys, we must create an OpenSSL configuration file. One is already
    provided for you in the Stelnel distribution, called stunnel.cnf. You can either
    use this file or create one of your own. The following is the configuration file
    we normally use:


    ```

    [ req ]ndefault_bits = 1024

    encrypt_key = yes

    distinguished_name = req_dn

    x509_extensions = cert_type

    [ req_dn ]ncountryName = Country Name (2 letter code)

    countryName_default = US

    stateProvinceName = State or Province Name (full name)

    stateProvinceName_default = IL

    localityName = Locality Name (eg, city)

    localityName_default = Chicago

    organizationName = Organization Name (eg, company)

    organizationName_default = Building Linux VPNs

    commonName = Common Name (FQDN of your server)

    commonName_default = fictitious.example.com


    [ cert_type ]

    sCertType = server

    ```


    We will need to put our keys and certificates in specific directories for Stelnel
    to find them. To make it possible to have multiple VPNs with different keys and
    certificates available, we will create a directory named /opt/ssl-vpn/etc/vpnname/
    (replacing vpnname with your actual VPN name), where we will store these files.
    Because the OpenSSL configuration file is the same regardless of the VPN we are
    using, save the file previously shown as /opt/ssl-vpn/etc/sslvpn.cnf.'
