    # pkpcipe and Incoming Connections


    Having set up all the necessary keys as previously explained, you need to decide
    how you are going to run pcipe. When making the decision, you need to remember
    that pkpcipe uses TCP to exchange keys, and one of the sides must act as a server
    and the other as a client, respectively.


    # Option 1: Spawning pkpcipe from inetd or xinetd


    There are several possible setups. Possibly, the most elegant one is to use inetd
    (or xinetd) to run pkpcipe as a service that is spawned when incoming connections
    arrive. In this case, you need not to worry about executing a ciped processes,
    each with a different options file and so on. Instead, pkpcipe takes care of authentication
    and shared key negotiation; it then spawns pcipe for each connection if everything
    is okay.


    In this case, what you need to do is to designate a single port for pkpcipe on
    your system (you do it only once) and add it to inetd/xinetd configuration. Thus,
    whenever a client pcipe process connects to the server pipe via TCP, it transmits
    its identity (dexter, for example), which is verified by using the client''s public
    key in the /etc/cipe/ directory. Subsequently, pkpcipe spawns pcipe.


    Here is a detailed description of how you can add pcipe as a service to be executed.
    First, look in /etc/services and add the following line to the file (9950 is the
    port number that will be associated with pkpcipe service):


    ```

    pkpcipe 9950/tcp

    ```


    Then add a line at the end of the /etc/inetd.conf file, as follows:


    ```

    pkpcipe stream nowait root /usr/local/sbin/pkpcipe pkpcipe

    ```


    If you prefer to use a wrapper by Wietse Venena, here is another option:


    ```

    pkpcipe stream nowait root /usr/sbin/tcp /usr/local/sbin/pkpcipe

    ```


    Briefly, the preceding line tells inetd to listen on the TCP port for pkpcipe
    specified in /etc/services; when an incoming connection is established, inetd
    will execute'
