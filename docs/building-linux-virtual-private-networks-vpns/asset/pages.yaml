  md: '# VTun Configuration 251


    After the tunnel is brought up, the commands in the up section will be executed.
    Note that two routes are added: one for the point-to-point network and one for
    the remote network. Also note that the %% in the ifconfig line is used to refer
    to the interface name used by this tunnel.


    Now lets examine some key elements of the vtund configuration. We configure the
    type of connection as tun. Also, because this is a tunnel for only IP traffic,
    we have decided that maximum compression is one of our goals, so we want to use
    Zlib compression. The configuration option zlib:9 instructs VTun to use Zlib compression
    with maximum supported compression, level 9. To use Zlib compression, we must
    also configure the tunnel to use TCP for transport. The configuration option proto
    top does this.


    Finally, to enable encryption, simply turn it on the line encryption yes. Once
    we have finished writing our configuration file, we can start the vtund in server
    mode.


    To run vtund in standalone mode, simply execute vtund with the command line options
    -s.


    ```

    vtund -s

    ```


    Running vtund in inetd mode is a bit more complicated. Because vtund will be spawned
    by the inetd super-server, we must update a few files to configure inetd properly.
    The first file we modify is /etc/services. This file will map a service name to
    a port. We need to add a single line to identify the service. The line to add
    will depend on which port you want vtund to listen on. For this example, we will
    assume we want to use port 5000. Additionally, we want to map both UDP and TCP
    packets on this port to the service vtund. The following lines can be added to
    /etc/services to create this mapping.


    ```

    vtund 5000/tcp

    vtund 5000/udp

    ```


    # Choosing a Port


    We have randomly chosen port 5000 for the VTun service. Before you make changes
    to your /etc/services file, you should verify that no other services are running
    on this port. You can use the netstat -a command to display which ports are in
    use on your system.


    Once we have added these lines to /etc/services, we can add a line for vtund in
    the configuration file for inetd. Inetd reads its configuration from /etc/inetd.conf.
    Adding the line to /etc/inetd.conf will correctly configure vtund to run in inetd
    mode:


    ```

    vtund stream tcp wait root /usr/local/sbin/vtund -f

    /etc/vtund.conf

    ```


    If your system uses xinetd, a replacement for inetd with an enhanced feature set,
    you will need to create a service name vtund in the directory /etc/xinetd.d. The
    contents of the file should be as follows:'
