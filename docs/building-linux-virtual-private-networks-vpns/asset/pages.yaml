  md: '# 302 Chapter 9 ClPe


    As for decreased amount of work, do not forget that pkcipe needs to be configured
    too and takes time. In addition, the distribution of public keys with pkcipe requires
    more work because it takes two copy operations for each pair of peers to exchange
    keys as opposed to one operation with the old scheme, although in the long run
    it will probably be worth it shared keys will be renegotiated automatically.


    Overall, we consider pkcipe to be a useful addition although it has its problems.


    # Debugging


    How do you determine what is wrong if one of the CIPE components does not work?
    You will need to use different techniques to debug information from different
    CIPE components. In this section, we will consider the techniques you can use
    with each component as well as a general tool you can use with most components
    (strace).


    # CIPE Mailing List


    If you feel stranded and have tried everything without success, try the CIPE mailing
    list available via http://sites.inka.de/bigred/archive/cipe-1/. If you want to
    ask a question, you will need to subscribe to the mailing list and then email
    c@inka.de.


    # str Tool


    You can use this tool to get a detailed overview of the system functions that
    a component is calling. This might give you an idea what specific function causes
    the component to crash. Here is an example of trace output:


    ```

    |root]# nyquist -f -o/tmp/out ciped-cb

    |root]# nyquist]# tail -20 /tmp

    12472 write(1, "maxer=199.77.128.173:30001\n", 24) = 24

    12472 write(1, "peer=128.61.33.81:300500\n", 24) = 24

    12472 write(1, "key=(secret)\n", 13) = 13

    12472 write(1, "nokey=no\n", 9) = 9

    12472 write(1, "socks=in\n", 7) = 7

    12472 write(1, "tokc=0\n", 8) = 8

    12472 write(1, "ipune=no\n", 12) = 12

    12472 write(1, "ipdown(none)\n", 14) = 14

    12472 write(1, "sprone(none)\n", 11) = 11

    12472 write(1, "maxer-1\n", 10) = 10

    12472 write(1, "tokts=0\n", 9) = 9

    12472 write(1, "ping=0\n", 7) = 7

    12472 write(1, "toping=0\n", 9) = 9

    12472 write(1, "dynip=no\n", 9) = 9

