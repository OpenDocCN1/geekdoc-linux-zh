- img_proc: true
  md: 'The pros of putting your VPN server behind your firewall are as follows:


    +   - The VPN is completely protected from the Internet by the firewall.

    - There is only one machine controlling all access to and from the Internet.

    - Network restrictions for VPN traffic are located only on the VPN server, which
    can make writing rules easier.


    The cons of putting your VPN server behind your firewall are as follows:


    +   - All VPN traffic must travel through the firewall as well, adding a degree
    of latency.

    - The firewall will need to shuffle VPN traffic from the Internet to the VPN directly.
    Because it cannot inspect this traffic (it is encrypted, after all), it will require
    a simple packet filter ACL or application proxy proxy.

    - Getting your VPN traffic to pass the encrypted VPN traffic is sometimes tricky.
    Some firewalls do not know what to do with IP protocols other than ICMP, TCP,
    and UDP. This means it will be harder or impossible to support VPNs that use different
    IP protocols, or ESP packets for IPSec or GRE packets for PPTP VPNs.

    - All the VPN traffic travels through the LAN wire, once from client to VPN server
    in the clear and once from the VPN to the firewall encrypted. This will degrade
    LAN performance.


    One option to decrease latency would be to connect a second network card (eth1)
    on the VPN server directly to a network card on the firewall (eth2) with a crossover
    cable. You could use a hub or switch and create an actual network segment if you
    prefer, but because you only have the two hosts here, a crossover cable would
    work well because no extra equipment is involved. This enables you to route the
    encrypted VPN traffic directly over this and through the firewall rather than
    backtracking over the existing LAN segment. This means the VPN traffic won''t
    be competing for LAN resources.


