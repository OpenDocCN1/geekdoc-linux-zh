  md: "# VTun Configuration\n\nThe following section covers the configuration options\
    \ available for VTun.\n\n# Overview of vtund.conf\n\nThe VTun configuration file\
    \ vtund.conf is used to specify options for each virtual tunnel. The following\
    \ section will list configuration options and explain how they are used. The default\
    \ location of the configuration file is /usr/local/etc/vtund.conf. The configuration\
    \ file is formatted in the following way:\n\n```\nSection {\n  SettingX value;\n\
    \  SettingY value;\n}\n```\n\nSection can be options, default, or tunnel name.\
    \ The options section contains general setup information for vtund, such as program\
    \ paths and port settings. The default section contains settings that are all\
    \ to be considered the default for all tunnels. The values can be overwritten\
    \ on an individual tunnel basis. To do so, simply change the setting in the specific\
    \ tunnel section. The tunnel name settings define the characteristics for individual\
    \ tunnels. Note that each tunnel name must be unique because it is meant to define\
    \ only a single tunnel.\n\n# Options Section\n\nTable 8.3 presents the options\
    \ available for the options portion of the vtund.conf file.\n\n| Option | Description\
    \ |\n| --- | --- |\n| port | Enables you to configure which port vtund listens.\
    \ Value must be a valid port number. On the client, this value is used to contact\
    \ the server on the specified port. |\n| Ifconfig | Specifies the path to the\
    \ ifconfig command. |\n| Ppp | Specifies the path to the pppd command. |\n| Route\
    \ | Specifies the path to the route command. |\n| Firewall | Specifies the path\
    \ to the firewall command (generally ipchains or iptables). |\n| Type | Enables\
    \ you to specify whether vtund runs standalone or is spawned from inetd. This\
    \ setting is either stand for standalone or inetd if it is spawned from inetd.\
    \ Only the server uses this setting. |\n| Persist | This causes a client to attempt\
    \ to reconnect to a server in the event of a disconnect."
  merge: -1
  pgno: 264
- img_proc: true
  md: '# Tunnel and Default Sections


    Table 8.4 lists the options for the tunnel and default sections of the vtund.conf
    file.


    | Option | Description |

    |---|---|

    | Passwd | Specifies the password used to authenticate and begin tunnel negotiation.
    Passwords must contain both numeric and alphabetic characters. If one does not,
    will generate an error and the connection will fail. |

    | Type | Enables the user to define the tunnel type, either IP, ethernet, or pipe.
    The values are tun, tap, and pipe, respectively. If not specified, it will default
    to a serial tunnel. Only the server uses this. |

    | Proto | Indicates the protocol used for the underlying tunnel transport. It
    can be either tcp or udp. If not specified, it defaults to tcp. Only the server
    uses this. |

    | Compress method:[1-9] | Used to specify the compression method (if any) used
    on the tunnel. The method can be either zlib or lz0. The number listed after the
    method sets the level of compression. A setting of 1 is less compression, more
    speed. A setting of 9 is more compression, less speed. Note that the compression
    method used is dependent on the protocol defined in the proto setting. Only the
    server uses this. |

    | Encryption | Turns encryption on and off for the tunnel. This is set to either
    yes or no. This is sent from the VTun server to the client. |

    | Speed X:Y | Enables rate limiting of the tunnel. Two values can be included,
    for inbound traffic (X) and for outbound traffic (Y). If only one value is used,
    it is assumed to be the same for both. Values are in kilobits/second. A value
    of 0 turns off rate limiting. Only the server uses this. |

    | Up { command1; command2 } | List the commands (command1,command2, and so on)
    to be executed after the connection has been established. These commands should
    include tunnel interface configuration (ifconfig), routing table changes, and
    any firewall rule changes to allow tunnel traffic. Note that % in the Up section
    is used to refer to the interface name used by that tunnel.|'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# VTun Configuration 249


    | Option | Description |

    | --- | --- |

    | Down {command1; command2; } | Same as Up, only the commands are executed when
    the tunnel connection is brought down. |

    | Stat | Enables the tracking of tunnel traffic statistics. Statistics are logged
    every five minutes. |

    | Srcaddr { iface value; addr value; port value; } | Configures vtun to use a
    specific local IP address as source address. iface is used to specify the name
    of a local interface, addr is used to bind to a specific IP address, and port
