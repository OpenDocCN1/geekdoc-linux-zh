    # Naming Public Key Files


    Does it matter how your public key/identity file is named at peer hosts? Actually
    it does. This is because your pkcipe will transmit its identity to the remote
    side, and that name will be used to search for a public key/identity file in `/etc/cipe/pk`.
    pkcipe currently uses the gethostname() call to obtain the name of your host.
    Alternatively, you can pass the name to pkcipe as the last parameter on the command
    line invoking pkcipe. Just use the following:


    ```

