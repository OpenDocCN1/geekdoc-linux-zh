  md: "To configure pkcipe, several files need to be present. Do not get bored just\
    \ yet. It is very simple, and if you have a clear picture in your head, you can\
    \ set everything up in 15 minutes.\n\n# /etc/cipe/identity{.priv}\n\nFirst of\
    \ all, each host that is going to use pkcipe must have an identity. identity consists\
    \ of two files: identity and identity.priv. These files represent public/private\
    \ keys, respectively. The files are generated by the rsa-keygen script (CIPE's\
    \ wrapper around the openssl command-line utility) that is included in the pkcipe\
    \ part of the CIPE package.\n\n# Restricted Access to /etc/cipe/identity.priv\n\
    \nNote that /etc/cipe/identity.priv (a host's private key) must only be readable\
