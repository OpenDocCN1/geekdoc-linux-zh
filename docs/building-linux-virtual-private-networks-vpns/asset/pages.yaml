- img_proc: true
  md: '# Installing pptd


    The PPTP server software is called PopTP, a clever pun we heartily admire. It
    was built for Linux but can work on other UNIX-like operating systems such as
    Solaris. It is simply a daemon that accepts inbound PPTP connections and forks
    copies of itself to handle the TCP control channel and GRE packets, shutting data
    to PPP to handle the actual point-to-point link, authentication, and encryption.


    To install PoPTo, snag a copy of the source from http://poptop.lineo.com and extract
    it:


    ```

    # root tar xzv pptd-VERSION.tar.gz

    # root cd pptd-VERSION

    ```


    Ppt comes with a configuration script to choose compile time settings. Some of
    the more useful command-line options are as follows:


    +   - -prefix=DIR Install the software into DIR instead of /usr/local

    - -with-libwrap Include TCP Wrapper support

    - -with-pppd-ip-alloc Allow pppd to allocate fixed IP addresses

    - -with-slirp Use SLIRp instead of pppd (more on this later)


    We generally configure pptpd as:


    ```

    #root /config --prefix=/opt/pkgs/pppd --with-libwrap \

    ---pppd-ip-alloc

    ```


    This puts the pptd programs in /opt/pkgs/pppd and uses TCP Wrappers.

    Unfortunately, there is no configuration option you can use to change the default
    location in where your pppd looks for your binary. If you installed it in a nonstandard
    location earlier, you will need to modify the following lines in the config.h
    file (which was generated from your ./config command) to reflect the correct location:


    ```

    * Where is my pppd? */

    #define PPP_BINARY "/usr/sbin/pppd"

    ```


    In our installation example earlier in the chapter, we installed pppd in

    /opt/pkgs/pppd-mppe directory, which means we''ll need to change the preceding
    line as follows:


    ```

    #define PPP_BINARY /opt/pkgs/ppp-mppe/usr/sbin/pppd

    ```


    Once done with any customizations, simply compile and install the software:


    ```

    # root make

    # root install

    ```


    # What are TCP Wrappers?


    TCP Wrappers enable you to control which machines are allowed to connect to your
    PPTP server based on the rules defined in /etc/hosts.deny and /etc/hosts.allow.
    TCP Wrappers are an option for most server software. See the hosts.allow man page
    for more information.'
  merge: -1
  pgno: 237
- img_proc: true
  md: '# Building a PPTP VPN Server


    # Install ppp-mpe for PoPToP


    PoPToP hands off the GRE-encapsulated PPP data to your local pppd command. This
    program must support the Microsoft extensions for authentication and encryption.


    The software of choice to handle this is ppp-mpe. It is a patched version of the
    standard PPP Linux software that incorporates the additional bits, interlacing
    with OpenSSL for the cryptographic algorithms. We covered the installation of
    ppp-mpe earlier in this chapter when we discussed PPTP clients. Install ppp-mpe
    as we described here.


    # PPTPd and SLIRP


    One of the pptpd configuration options we mentioned was --slirp. SLIRP is a TCP/IP
    emulator that essentially enables you to turn a normal shell account and turn
    it into a full-blown SLIP/PPP account. (SLIP is the protocol of choice for modem
    dial-in before PPP became common.)


    You could use SLIRP instead of using the pptpd program from the ppp-mpe package.
    ppp-mpe requires a Linux kernel module, making it very Linux specific, whereas
    SLIRP is more cross-platform. So if you wanted to run a PPTP server on Solaris,
    for example, SLIRP would be something to look into.


    We suggest, however, that you stick with ppp-mpe for the following reasons:


    +   - SLIRP is no longer maintained.


    +   - The version of SLIRP that supports the Microsoft PPTP Extensions, 1.3b,
    is a beta.


    +   - SLIRP was written to work with SSLeay 0.9.b. SSLeay was the predecessor
    to OpenSSL, which is now 0.96c as of this writing. Many flaws have been found
    and fixed since the SSLeay days.


    +   - SLIRP is based on the PPP 2.2 code base.Version 2.3 is standard, and 2.4
    is widely deployed.


    +   - The PPTP-Linux client software requires ppp-mpe, so if you need to support
    both client and server, you are already familiar with ppp-mpe anyway.


    SLIRP is available from http://blitzen.isberra.edu.au/slirp (official home page)
    and http://www.sec.nc/people/vote/vpn (the beta versions with PPTP support.)The
    SLIRP tarball contains some good information about how you integrate it with PPTPD,
    and the two actually work well together.


    If you want to use SLIRP, we suggest you to interface with OpenSSL instead of
    SSLeay so you get the benefit of the bug fixes that have been made in the last
    few years. Getting SLIRP to compile with recent OpenSSL versions is not trivial,
    unfortunately, due to changes in the OpenSSL interfaces.'
  merge: -1
