    /usr/bin/sudo /usr/bin/pppd noauth\n192.168.254.254:192.168.254.253,environment=\"\
    vpn_network=vpn1\"\nno-port-forwarding,no-forwarding,no-agent-forwarding 1024\
    \ 35\n12849554020444581541671425906528099794166182144...\n```\n\nIn the preceding\
    \ example, we will allow this identity to come from client.example.\nwith only,\
    \ an appropriate suite ppp command will be forced, all unnecessary forward-\n\
    ings in SSH will be turned off, and the vpn_network environment variable will\
