- img_proc: true
  md: 'PPP-over-SSH Overview 69


    mitigated around the deattack patch supplied by CORE-SDI back in 1998. SSH1 has
    been around the longest and a broader support base. SSH1 only supports asymmetric
    cryptography, which was patented until September of 2000 in the USA. Because this
    patch has expired, the RSA requirement is no longer an issue.


    SSH2 is a newer, feature-rich protocol and has stood up relatively well to the
    level of scrutiny it thus so far. SSH2 connections take much longer to establish,
    recent OpenSSH versions have greatly sped up this handshake. SSH2 supports both
    RSA and DSA asymmetric algorithms.


    Regardless of which SSH protocol you choose, make sure you are using a recent
    version of OpenSSH. Historically, there have been vulnerabilities from time to
    time in OpenSSH, such as separate ''UseLogin'' holes, or the integer overflow
    in the original deattack patch could lead to root compromise. OpenSSH has been
    doing much better than its peers, with respect to security. It includes countermeasures
    to esoteric attacks such as keystroke timing, in which an attacker uses the time
    between packets to determine how close the keys you typed are and can use this
    to infer what you have typed.


    We will use SSH identities (asymmetric cryptographic keys used for authentication,
    described in detail) to allow our VPN client to log to the VPN server. Unfortunately,
    the identity format for SSH1 is different than for SSH2. Thus, although OpenSSH
    supports versions of the SSH protocol, we will need to decide which version we
    want to use for our VPN. If you have a recent version of OpenSSH (which you should),
    we suggest you use SSH2. Provide details for creating your SSH identities for
    both SSH1 and SSH2, so the choice is yours.


    # Our Sample Network


    The theory is simple: Establish an SSH connection from the VPN client to the VPN
    server and have PPP daemons on both ends that tell each other to create our VPN.We
    will create a VPN between the Hosts Bears (the VPN server) and Falcons (the VPN
    client), as seen in Figure 3.1.


    Both Bears and Falcons have networks behind them that are to be connected securely.
    The dotted line designates the virtual network created between the two hosts.


    # What About the VPN-HOWTO?


    The definitive reference for establishing a PPP-over-SSH VPN is the Linux VPN-HOWTO,
    written in 1997 and available at www.linuxdoc.org/HOWTO/mini/VPN.html.


    Unfortunately, this document is rather dated at this point, and it assumes you
    already know the protocols and theories well.'
