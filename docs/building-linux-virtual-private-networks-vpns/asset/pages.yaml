- img_proc: true
  md: '# Considerations


    Before deciding what kind of VPN is right for you, you need to first define your
    requirements, conduct a risk analysis, and review collateral issues such as long-term
    support and operational management needs. In the next few sections, we will describe
    various issues for you to consider.


    # Key Distribution


    Key distribution among your VPN clients and servers should be one of the first
    security concerns you review. If your keys are compromised, the security of your
    system is compromised. When we talk about key distribution, we are concerned with
    two types of keys: symmetric and asymmetric.


    It is crucial to distribute symmetric keys securely. Ideally, you should use a
    secure out-of-band channel or physically access both systems and keys up your
    self.


    In most cases, however, this is not an option. If you have to distribute symmetric
    keys remotely, make sure you use at least SFTP, SCP, or SSL/TLS. (Telnet and FTP
    are insecure. If you use them, you are potentially giving your keys away to attackers.)
    You could go so far as a professional courier or have one of your employees travel
    to the remote site with the keys on a floppy disk.


    Asymmetric keys (which consist of both a public and private key pair) are a different
    matter. The public key can be transmitted without secrecy, such as with FTP or
    even email. Public keys by themselves do not offer an attacker anything that can
    be leveraged into your VPN. The secret key should not be transmitted to the remote
    end at all because it is only needed for decryption.


    Although it is completely fine to transfer public keys in nonsecure manners, it
    is crucial for you to verify that the keys have not been tampered with when they
    are received. This can be done by simply installing the key as appropriate to
    your VPN software and then calling up the administrator at the other end of the
    VPN link and reading the key aloud. If you transmit your key in a way that allows
    an attacker to modify it, the attacker could perform a man-in-the-middle attack,
    defeating the security of your VPN.


    In short, reliable transmission of the public key is important, though secret
    transmission is irrelevant. A secret key should never be stored on the remote
    endpoint of the VPN. If you are not familiar with asymmetric cryptography, see
    our glossary (Appendix C) for explanation.'
  merge: -1
