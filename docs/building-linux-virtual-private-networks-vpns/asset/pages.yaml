  md: '# Building Linux Virtual Private Networks (VPNs)


    Building Linux Virtual Private Networks (VPNs) focuses on showing how to get your
    VPN up and running as quickly as possible. You will learn VPN theory and fundamentals
    and will master important techniques and tools needed to design and set your VPN
    in a reliable, secure, and cost-effective fashion.


    This book offers concise, step-by-step instructions for building VPNs based on
    both standard protocols (IPsec, SSL, SSH, PPTP) and popular VPN solutions (VTun,
    cIPE, tinc). Through numerous examples and proven practices, you will gain important
    insights into choosing a VPN solution, installing and configuring it, setting
    up routing, configuring firewalls, measuring performance, and more.


    If you want to keep your Linux network secure with a VPN, use this book to gain
    insight into:


    +   * VPN theory and planning

    * Choosing a VPN solution

    * Common VPN scenarios

    * Details of firewall configuration

    * Key management setup

    * Routing

    * IPSec essentials

    * FreeS/WAN

    * SSH VPNs

    * SSL VPNs

    * PPTP

    * VTun

    * cIPE

    * tinc


    > Oleg Kolesnikov received his B.S. from the Georgia Institute of Technology.
    He has been doing research in information security at Georgia Tech and the Berkeley
    Lab, focusing on network security, cryptography, and secure protocols.


    > Brian Hatch is chief hacker at Onsight, Inc. He is the lead author of the best-selling
    book Hacking Linux Exposed (McGraw Hill) and is the comaintainer of Stunnel, an
    open-source, secure SSL wrapper used around the world to encrypt clear protocols.


    www.buildinglinuxvpns.com

    www.newriders.com


