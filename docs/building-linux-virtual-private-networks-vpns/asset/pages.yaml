  md: '# Building a PPTP VPN Client 27


    The ppp0 lines in netstat output are those of the machine''s normal dial-up modem
    connection. The ppp1 entries are the PPTP VPN tunnel and related routes. Note
    that both IP addresses of the ppp1 link are supplied by the VPN server, in this
    case 10.1.0.130 for our and 10.2.0.102 for its end. Assuming that the PPTP VPN
    server is set up properly, the values it supplies should


    For each established outbound PPTP connection, you will actually have three processes:
    a call manager, a GRE/PPP encapsulator/decapsulator, and the pppd process to handle
    the encryption and network connectivity. These processes are easily visible via
    the ps command:


    ```

    wildcat ps -ef | grep |pptp|ppppd

    root 5755 1 0 04:43 pts/1 00:00:00 /usr/bin/pptp pptp

    root 5757 0 call manager for xxx.xxx.xxx 1 0 04:43 pts/1 00:00:00 /usr/bin/pptp
    pptp: GRE-to-PPP

    gateway on /dev/pts/5

    root 5762 1 0 04:43 pts/5 00:00:00 /opt/pkgs/ppp-mpe/usr/sbin/pppd

    /dev/pts/5 38400 call Chicago

    ```


    You can stop the PPTP VPN tunnel simply by killing the pppd process:


    ```

    wildcat# kill 5762

    ```


    If you started the VPN with the ppptp-command script, you can kill it using the
    script as well:


    ```

    wildcat# /opt/bin/pptp-command

    1.) start

    2.) stop

    3.) setup

    4.) quit

    What task would you like to do?: 2

    Sending HUP signal to PPTP processes...

    ```


    # Starting the PPTP VPN Manually


    If you prefer doing things manually rather than have already configured your pptp-command,
    it''s easy enough from the command line. You must have configured CHAP secret,
    either using pptp-command or the manual method we described.


    To start a session, you need the external IP address of the PPTP server and the
    name of your PPTP VPN (that is, the filename in /etc/ppp/peers.). Then call pptp
    as follows:


    ```

    wildcat# call bears.example.comYou must manually add your network routes and modify
    /etc/resolv.conf if needed because these are normally handled by the pptp-command
    program for you.

    ```


    To stop the VPN, assuming it is using device ppp1, you could kill the pppd process
    as follows:


    ```

    wildcat# kill `cat /var/run/ppp1.pid

    ```'
