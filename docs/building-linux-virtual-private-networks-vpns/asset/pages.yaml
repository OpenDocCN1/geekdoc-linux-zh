  md: '# Chapter 6 FreeS/WAN


    # Background


    FreeS/WAN is an open-source package that provides RFC-compliant IPSec capabilities.
    The FreeS/WAN project was founded in 1996 by John Gilmore with the intent of providing
    a free mechanism to begin the overwhelming process of securing the Internet; this
    is a task in which any single component could be formidable by itself.


    A bit of history and politics surround the FreeS/WAN project and cryptography
    in general. (For an in-depth presentation of this, refer to the FreeS/WAN documentation.)
    To some degree, this has influenced the project''s progress and direction; for
    the most part, however, it has been more of an inconvenience than a significant
    impediment.


    FreeS/WAN is composed of two primary pieces: KLIPS and Pluto.


    # KLIPS


    KLIPS (kernel IP security) is source code that is integrated into the Linux kernel.
    KLIPS provides low-level drivers that allow IPSec functionality to be independent
    of communication interfaces and higher-level user-space code. KLIPS can be compiled
    either into the kernel or as a module for runtime insertion or removal.


    # Pluto


    Pluto is a daemon that performs IPSec IKE key exchanges and manages the IPSec
    keying. It interfaces with kernel KLIPS when necessary. Pluto is started automatically
    by the included FreeS/WAN initialization scripts.


    # Opportunistic Encryption


    One of the goals of the FreeS/WAN project is to influence the IPSec community
    to incorporate Opportunistic Encryption into the IPSec standard. Opportunistic
    Encryption allows for a more dynamic security environment, providing fallback
    mechanisms if an IPSec connection fails. It also provides easier key management
    because encryption key information can be stored in DNS for automatic retrieval
    and revocation. This greatly simplifies the administration and maintenance of
    IPSec.


    Unfortunately, Opportunistic Encryption is still in an experimental stage and
    is not recommended for a production environment. Because of this, we will not
    be discussing Opportunistic Encryption in any detail. If you''re interested, refer
    to the copious amount of information found in the FreeS/WAN documentation.


    Keep in mind that Opportunistic Encryption is experimental, which means that experimenting
    with it is a good thing. It definitely works as it should more often than not,
    and if you''re the heir apparent to the VPN administrator''s job, it could make
    your life a lot easier. If, when you complete this chapter, you''re sold on planning
    a large VPN implementation using FreeS/WAN, be sure to read all of the available
    documentation on Opportunistic Encryption.'
  merge: -1
