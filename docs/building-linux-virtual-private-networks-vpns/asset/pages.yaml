    total 4

    drwx------ 3 root root 4096 Jun 1 21:24 shattuck

    /etc/tinc/shattuck:

    total 12

    drwx------ 2 root root 4096 Jun 1 21:24 hosts

    -rw-r--r-- 1 root root 473 Jun 1 17:20 tinc.conf

    ```


    It does not matter what you currently have in the tinc.conf file because we will
    completely rewrite it while configuring the VPN.


    # Main Configuration File


    In the following sections, we will describe basic and extended options supported
