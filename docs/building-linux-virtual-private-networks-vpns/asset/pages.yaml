  pgno: 47
- img_proc: true
  md: '# VPN Protocols 31


    The third part of IPsec is the ESP. This part takes the payload (meat) of each
    packet and encrypts it based on the cryptosystem being used. This ensures confidentiality
    through the underlying cipher.


    For a pointed analysis of IPsec, refer to “A Cryptographic Evaluation of IPsec,”
    by Niels Ferguson and Bruce Schneier, 2000, counterpane.com/ipsec.html. As you
    read this paper, try to remember that, despite its limitations, IPsec remains
    the best-bet solution for most VPN applications. Its wide support and standardized
    approach also makes it the choice for interoperability. As Mr. Schneier aptly
    points out, it’s also a very complex system that depends on many relatively interdependent
    factors. However, many implementations have effectively reduced the impact of
    that complexity by simplifying their exposure to it.


    # Nonstandard VPN Protocols


    In addition to the “standard” VPN protocols, there exists one of nonstandard VPN
    protocols (“hacks”), colloquially speaking). This section will introduce three
    of VTun, cIPE, and tinc.


    # VTun


    VTun is another open-source VPN package. It operates on Linux, the BSDs, and Solaris,
    and it supports a wide variety of protocols. It relies on the TUN/TAP driver and
    can theoretically operate on any platform that supports this driver.

    VTun is highly configurable. Not only does it support TCP/IP, it also supports
    IPX/SPX, Appatak, and other protocols. Like other VPN packages, VTun has compression
    and encryption engines. In addition, VTun also has a traffic shaping mechanism.
    VTun is described in Chapter 8, "VTun."


    # cIPE


    cIPE (Crypto Encapsulation) is an open-source VPN package. It operates similarly
    to the PPP method previously described but with some differences. The main difference
    is that it can encapsulate IP datagrams within UDP datagrams or within TCP packets.
    This encapsulation includes headers, so the packet is unchanged. cIPE then relays
    the packet through the network interface to another cIPE gateway, where the IP
    datagram is removed from the UDP datagram or TCP packet. The full IP datagram
    is sent on its own.


    For purposes of confidentiality, cIPE encrypts the full IP datagram with either
    Blowfish or IDEA ciphers. Because these are symmetric ciphers, keys must be exchanged
    via a secure mechanism. After the tunnel is established, new keys are generated


    # Note


    IDEA is a patented cipher, so using it in a commercial environment might require
    the payment of license fees. If in doubt as to whether or not this applies to
    you, just use Blowfish.'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'cIPE also supports SOCKS5, which can make firewalling much easier. UDP datagrams
    that cIPE produces can be passed to a SOCKS5-enabled gateway, where they can be
    authenticated. Thus, the CIPE gateway can easily be placed behind the firewall
    for added protection.


    For simplicity, cIPE relies on UDP for datagram transport. Although this simplifies
    configuration and tunnel establishment, it also allows for dynamically changing
    carrier addresses. Thus, if one end of the tunnel changes addresses during operation,
    cIPE will recover gracefully.


    If you decide to use cIPE, it is suggested that you use it in conjunction with
    a SOCKS gateway because VPN utilization will be authenticated using a proven mechanism.
    A detailed description of cIPE, its installation, and its use is provided in Chapter
    9, "cIPE":


    tinc also relies on the universal TUN/TAP driver. It''s easy to implement and
    configure, can be reconfigured during operation, and has extensive documentation.
    Also, because it relies on the TUN/TAP driver, it is supported on Linux, the BSDs,
    and Solaris.


    +   * tinc currently supports only the Blowfish cipher. It uses UDP tunneling
    for ease of operation and configuration. tinc could best be applied to small networks
    in which efficiency and speed are key. See Chapter 10, "tinc" for details.


    # Summary


    At this point, you should have a high-level understanding of VPN theory, an understanding
    of the business justification relating to VPNs, and a general knowledge of the
    different players in the VPN community. The next chapter will delve deeper into
    the technical aspects of VPNs, the VPN design process, and how the services within
    your network are affected by a VPN.'
