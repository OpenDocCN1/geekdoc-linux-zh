  md: '# Linking to vpn-{server,client} in /etc/init.d


    Scripts used to start and stop system services are located in the /etc/init.d
    directory. (On some Linux distributions, notably earlier Red Hat systems, they
    are kept in /etc/rc.d/ instead). These scripts are usually linked from one of
    the /etc/rc.x directories to determine which runlevel the service should be active.


    Our scripts are designed to be run directly as one of the start/stop scripts,
    so all we need to do is link to them. Let''s say we want our VPN named vpn1 start
    in runlevel 2. We created the following symlink:


    ```

    bears-server# ln -s /opt/ssl-vpn/bin/vpn-server /etc/rc2.d/S99vpn1

    bears-server# ln -s /opt/ssl-vpn/bin/vpn-server /etc/init.d/vpnpn1

    ```


    ```

    falcons-client# ln -s /opt/ssl-vpn/bin/vpn-client /etc/rc2.d/S99vpn1

    falcons-client# ln -s /opt/ssl-vpn/bin/vpn-client /etc/init.d/vpnpn1

    ```


    These commands set up our VPN to be started as the last program as runlevel 2
    is begun. You can change the 99 to be appropriate for your system. We''d also
    create a generic init.d entry for ease of use.


    # Configuring ip-up to Run Our VPN Scripts


    When a PPP connection is established, we showed how to create symlinks that ip-up
    will use to call our vpn-server or vpn-client program to set up routes.


    See the section "Configuring ip-up to Run Our VPN Scripts" in Chapter 3 for details
    of how this works. If you just want to catch the chase, here are the appropriate
    commands for some popular distributions:


    Slackware:


    ```

    falcons-client# ln -s /opt/ssl-vpn/bin/vpn-client /etc/ppp/ip-up

    bears-server# ln -s /opt/ssl-vpn/bin/vpn-server /etc/ppp/ip-up

    ```


    Debian:


    ```

    falcons-client# ln -s /opt/ssl-vpn/bin/vpn-client /etc/ppp/ip-up.d/vpn-client

    bears-server# ln -s /opt/ssl-vpn/bin/vpn-server /etc/ppp/ip-up.d/vpn-server

    ```


    Red Hat:


    ```

    falcons-client# ln -s /opt/ssl-vpn/bin/vpn-client /etc/ppp/ip-up.local

    bears-server# ln -s /opt/ssl-vpn/bin/vpn-server /etc/ppp/ip-up.local

    ```


    # Creating Our Global VPN Configuration File


    Both the vpn-client and vpn-server scripts will read the file /opt/ssl-vpn/etc/ssl-vpn.conf.
    This file is located on our web page for easy download, Install it for both the
    client and server, as follows:


    ```

    root# mkdir /opt/ssl-vpn/etc; chmod 755 /opt/ssl-vpn/etc

    root# cp ssl-vpn.conf /opt/ssl-vpn/etc

    root# chmod 644 /opt/ssl-vpn/etc/ssl-vpn.conf

    ```'
  merge: -1
  pgno: 143
