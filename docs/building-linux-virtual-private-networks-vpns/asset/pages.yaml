    # Fields in ipsec.conf


    Here''s a general ipsec.conf file:


    ```

    config setup

    interfaces="ipsec0=eth0 ipsec1=eth1"

    klipsdebug=none

    plutodebug=none

    plutoload=%search

    plutostart=%search

    uniquequids=yes

    conn default

    keyingries=0

    authby=rsagig

    conn denet-cnet

    left=10.1.10.50

    leftsubnet=192.168.10.0/24

    leftnexthop=10.1.10.1

    leftid=de.exemplify.com

