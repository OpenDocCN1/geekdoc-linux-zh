  md: "# Using tinc 339\n\nThe question brings up the idea of changing network topology\
    \ to accommodate dynamic peers. Refer to Figure 10.4 for a scenario in which dynamic\
    \ DNS server and port forwarding are unnecessary. Of course, changing network\
    \ topology is not always acceptable, and this is why we described the preceding\
    \ scenario. In many cases, however, it will save you a lot of time.\n\n# Masquerading/NAT\
    \ Gateways and UDP\n\nWe will now describe two basic scenarios: one is when you\
    \ want to connect to a peer behind a masquerading/NAT firewall and the other is\
    \ when you want to connect from such a peer. Keep in mind that if both peers are\
    \ a NAT gateway or firewall, it might be better to use triangulation (if you can\
    \ find a third peer with a static IP address), as shown in Figure 10.4, for peers\
    \ A and B behind a masquerading/NAT firewall, you replace one connection between\
    \ A and B with two connections to a third peer, C, that has a static IP—AC and.\n\
    \n# Connecting to a Peer Behind a Firewall\n\nIf one of the peers is behind a\
    \ masquerading/NAT firewall, it can be quite difficult to get tinc to that peer\
    \ unless the firewall is set up to forward all traffic on a certain port to the\
    \ peer behind the firewall. You can achieve this, for example, by using ssh. Run\
    \ the following command on the firewall:\n\n```\n$root@fox tinc# -L 9000:172.16.1.1:6500\
    \ localhost\n```\n\nThis will tell ssh to redirect tcp port 9000 to port 650 of\
    \ the firewalled tinc peer whose IP address is 172.16.1.1.\nForwarding A TCP port\
    \ is not enough, and you also need to take care of the fact that tinc uses UDP.\
    \ Most NAT firewalls do not address translation for stateless protocols, so you\
    \ will need to either tinc to disable UDP or force the firewall to NAT UDP packets.\n\
    Disabling UDP is easier and, on recent versions of tinc, can be done by utilizing\
    \ the TCGOnly option on both peers. Be aware that the code for this option is\
    \ experimental as version 1.0pre4 of tinc and is not present in some of the earlier\
    \ versions of tinc.\n\n# Connecting from a Peer Behind a Firewall\n\nAs previously\
    \ mentioned, because tinc uses TCP and UDP, a masquerading/NAT firewall needs\
    \ to forward both protocols. If your firewall cannot network address translation\
    \ for UDP packets, you will need to configure tinc to use TCP as the only transport.\
    \ To do that, you should use the TCGOnly option as described earlier.\r\n\nThe\
    \ next problem you might need to resolve is when the source port for all tinc\
    \ packets sent through the firewall is replaced by the NAT function of that firewall\
    \ (if the port address translation [PAT] feature is enabled) so that the port\
    \ number becomes dynamic. In such a case, you need to make sure that you do not\
    \ specify the Port option in"
