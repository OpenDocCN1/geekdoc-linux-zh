  md: '# Planning Your VPN


    Your Linux distribution already installed a version of modutils, so you should
    remove that first. On a RedHat Linux system:


    ```

    # rpm -e --nodeps modutils

    ```


    The --nodeps option is necessary because the whole system depends on this package.
    You won''t be able to remove the package without specifying this option. Keep
    in mind that, in general, it''s not a good idea to use the --nodeps option frivolously.
    This is an exception to the rule, but you could seriously damage your system by
    removing packages that others require.


    Now that the package is removed, we can install the modutils package as follows:


    ```

    # cd /usr/src/modutils-2.4.8 && make install

    ```


    Be sure you have completed all the steps listed before restarting your system.
    Your system requires the modutils software to function.


    # Kernel Compilation


    Now you need to get some kernel source. It is up to you to decide which kernel
    to use, but it is recommended that you use kernel 2.2.19 or above for the 2.2
    kernels, or 2.4.5 or 2.4.6. Much of the work done for this chapter used kernel
    2.4.6 on i386 platforms and 2.2.19 on Spar platforms. If you run into problems
    compiling the kernel on your system, using a different kernel.


    # Note


    There are rumors about FreeSWAN being compatible with kernels 2.4.10 and above.
    Feel free to try it.


    Kernel source can be obtained from www.kernel.org or one of its mirrors. Be sure
    to get the kernel source, not without a patch! Kernel source files follow the
    naming convention linux-<version>.tar.gz or linux-<version>.tar.bz2. The .gz signify
    gzip compression, and the .bz2 extension signifies bzip2 compression.


    Save the kernel source to the directory /usr/src/ and decompress it with the appropriate
    command as shown. For gzip compression, use the following:


    ```

    # tar xvf linux-<version>.tar.gz

    ```


    For bzip2 compression, use the following:


    ```

    # tar xvf linux-<version>.tar.bz2

    ```


    For newer versions of GNU Tar (such as the one packed with RedHat 7.1), use the
    j flag instead of the I flag for bzip2 decompression. Both will work, but use
    of the I flag is deprecated.


    The kernel source will be untared into the directory /usr/src/linux. At this point,
    you''ll probably want to do symlinking to keep track of kernel versions. Move
    the linux directory to linux-<version> and then symlink the new directory to the
    symlink "linux". This can be done as follows:'
