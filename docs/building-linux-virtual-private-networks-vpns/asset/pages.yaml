  md: "# Chapter 10 tinc\n\nAlternatively, it is possible to be even more specific\
    \ and tell configure about the exact paths to OpenSSL includes and libraries.\
    \ You can do it by running the following:\n\n```\n[root@tinc ~]# ./configure --confdir=/etc\
    \ --with-openssl=/usr/local/ssl --n    --with-openssl-lib=/usr/local/ssl/lib -with-openssl-\n\
    \    --include=/usr/local/ssl/include\n```\n\nGenerally, this should take care\
    \ of the problem. We have found, that tinc's configuration script will often continue\
    \ failing about OpenSSL includes.\n\nOur solution might seem a bit harsh, but\
    \ it is effective. Using root privileges, create the /usr/include/openssl directory\
    \ and copy OpenSSL include files to that directory. For example:\n\n```\n[root@tinc\
    \ ~]# mkdir -m 755 /usr/include/openssl\n[root@tinc ~]# chown 0.0 /usr/include/openssl\n\
    [root@tinc ~]# chown 0.0 /usr/local/openssl/include/openssl/*\n/usr/include/openssl\n\
    ```\n\nIn the event that you want to determine why tinc is failing to compile,\
    \ we recommend that you check.log for a detailed explanation.\n\nFinally, you\
    \ can always ask for tinc's mailing list by sending an email with your questions\
    \ to tinc@nl.linux.org. To view responses to your inquiry, you can either subscribe\
    \ to the tinc mailing list or browse an online copy via http://tinc.nl.org.\n\n\
