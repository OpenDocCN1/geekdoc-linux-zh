  md: '# Advantages and Disadvantages of VPNs


    Although this is a book about VPNs, it wouldn''t be fair if we didn''t point out
    the disadvantages to VPNs as well as the advantages. Both are discussed here.


    # Advantages


    Advantages discussed in the following sections include those related to security,
    consolidation, transparency, cost, and administration.


    # Improved Security


    First and foremost, a VPN provides multiple elements of security to your networks.
    A VPN mitigates external risks such as IP spoofing, passive sniffing, loss of
    confidentiality, and packet injection. In addition, a VPN can protect your intranet
    from Internet-born viruses such as the CodeRed worm, which infected Internet-accessible
    hosts at a phenomenal rate.


    However, a VPN should not be implemented to defer a good and thorough approach
    to security because a VPN does not necessarily protect hosts from malicious users
    inside the network. The annual CSI/FBI survey shows that, on average, insider
    attacks can be more costly overall, more per incident, and more frequent, especially
    when you count use and internal fraud, waste, and abuse results. Disgruntled or
    bored employees can sometimes pose a greater threat to your organization than
    the rogue hacker.


    # Consolidation of Scattered Resources


    Having multiple offices and multiple office networks means you probably have resources
    scattered amongst them. These scattered resources signify a few things: increased
    administration, multiple pieces of hardware and software, duplication of effort,
    and so on. This equates to a higher cost of ownership (TCO).


    A VPN is an easy way to consolidate these resources, which in turn, can reduce
    your cost of ownership. In addition, the hardware and software that remain after
    consolidation can be applied to increase the availability of those resources.


    # Transparency to Users


    One of the major advantages of VPNs is transparency. Users, applications, and
    in most cases even hosts need not know that a VPN is in use. Thus, adding new
    software or hardware to your network does not require any more configuration than
    usual.


    # Reduced Cost


    Because a VPN is implemented using a local Internet connection, the need for dedicated
    lines and internal dial-up infrastructure is removed. The cost of a dedicated
    circuit, whether it''s a frame-relay or ATM link, can be a significant initial
    expense and'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'recurring cost for a company. Maintaining telephone lines and RAS equipment
    can also be cost prohibitive. A VPN can become very attractive when the options
    are weighed.


    # Ease of Administration


    Because the most common VPN configuration, the network-network topology, is transparent
    to users, applications, and hosts, relatively nothing is added to the administration
    or training efforts for these components of your organization.


    # Disadvantages


    The disadvantages of VPNs are related to implementation, troubleshooting, trust,
    and Internet availability.


    # Implementation Can Be Time Consuming


    Implementing a VPN can sometimes be difficult and time consuming. Configuration
    planning, management of keys, and troubleshooting can easily turn what seems to
    be a simple task into weeks of labor. If the option is available, it might be
    helpful to use consultants or contractors experienced with VPNs to assist in these
    matters. An individual should be able to fully design, implement, troubleshoot,
    and document a network-network or host-host VPN about two weeks. This assumes
    that the individual implementing the VPN has a detailed and accurate network design
    and that there are minimal network elements (that is, two firewalls, two routers,
    two switched, and two VPN devices). Any inaccuracies in the network design could
    require more time for VPN implementation because those would need to be troubleshoot.
    If these inaccuracies do not exist, the majority of the time will be spent on
    implementation and troubleshooting/testing. Design and documentation should only
    require a couple of days apiece. Host-network VPNs can require more time because
    number of components involved is much greater than for the other configurations.


    # Troubleshooting Problems


    Because, in a VPN, data enters a gateway unencrypted and leaves the gateway encrypted,
    it can be very difficult to troubleshoot a VPN. Problems as key desynchronization,
    failures in authentication, dropped packets, and gateway load and stress can make
    pinpointing problems in the VPN a difficult task.


    To make your VPN reliable, make sure the VPN administrators clearly understand
    the underlying software architecture and a thorough understanding of Internet
    protocols.


    # Network + Network = Huge Trust Domain


    Because you''re connecting two networks transparently, trust between the two networks
    becomes an issue. Do you trust the users on the other network to use'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# 20 Chapter 1 Introduction to VPNs


    resources on your network responsibly? Also, do you trust the security of the
    other network? If a malicious hacker gains access to the other network, he or
    she might also have gained access to your network.


    Planning a network-network VPN should involve close coordination with administrators
    and IT managers from all networks. Make sure that everyone has a good understanding
    of the security risks associated with the software and hardware you''re using
    and that they''ve considered the option of authentication to mitigate the risks
    associated with blanket trust.


    # Internet # 99% Availability


    With all the advantages of a VPN, one thing to not ensure is high availability.
    Because the VPN relies on the Internet for transport, VPN service might sometimes
    be disrupted during Internet outages. Outages can originate not only from your
    ISP but also from the networks in between. If a node or link in the path from
    one network to another goes down, it might take a while for service to be restored.
    If uptime is a critical requirement for your VPN, you might want to consider using
    ISPs that offer service-level agreements (SLAs) to their customers.


    This situation differs from a dedicated line because the dedicated line has many
    fewer points of failure than a VPN does. Furthermore, many ISPs these days support
    some form of QoS. However, you won''t get an assurance from your ISP that you''ll
    be able to connect to anywhere in the world 99% of the time; if they tell you
    that, you''re probably talking to someone in sales. Have a talk with someone in
    operations and you''ll get a different story, ISPs only control over the lines
    they own and manage.


    If uptime and bandwidth availability are a huge factor, be sure to weigh your
    options carefully. In some cases, leased lines might be more appropriate.


    # Vendor Interoperability


    With many vendors offering VPN solutions, with the complex nature of VPN protocols
    such as IPSec, it can be difficult to get different vendor solutions to operate.
    The first step in attempting to connect two vendors VPN devices is to check the
    VPNC web site (www.vpn.org) and check for your vendors'' interoperability. The
    second thing is to make sure you have the configuration right between the two
    (that is, SA parameters, crypto parameters, ESP AH parameters, and so on, assuming
    the connection will be IPSec). Other than that, research the products as best
    as you can discover their eccentricities.


    # Comparison of VPNs to Conventional Technologies


    Another way to look at VPNs is by comparing them directly to other technologies.
    In the following sections, we compare VPNs to RAS and leased lines.'
