- img_proc: true
  md: '# Configuration 325


    Note that if you do not specify the -n option when executing tinc, it will look
    in /etc/tinc or /usr/local/etc/tinc by default, depending on the options you used
    during installation.


    You can also run tinc as a service. Typically, if you installed tinc as a package,
    you should be able to simply type the following:


    ```

    [root@fox /root]# /etc/init.d/tinc start

    ```


    After tinc is started, you can find its process ID in the /var/run/tinc.<vpn_name>.pid
    file. You can use the pid to send various kinds of signals described in the following
    section.


    Note that there are a number of additional command-line options that tinc supports.
    In this section, we will describe some of the options useful. If you want to learn
    more, you can obtain the most recent list of options from the tinc(8) man page.


    # Useful Options and Signals


    This section describes various command-line options you can use when running tinc.
    It also gives a description of signals you can send to the tinc daemon to affect
    its execution.


    # Options


    The information in both this and the following sections is taken from the tinc-1.0pre4
    man page. Many of the comments were rewritten and expanded in Table 10.1 in an
    effort to provide a concise description of the options we found useful.


    Table 10.1 tinc Options

    | Option | Description |

    | --- | --- |

    | -c, --config=PATH | Read configuration options from the directory PATH. The
    default is /etc/tinc/tinc/<vpn_name>/. This is what you decide not to keep configuration
    files in /etc/tinc/<vpn_name>. |

    | -D, --no-detach | Don''t fork and detach. This will also disable the automatic-restart
    mechanism for fatal errors. |

    | -d | Increase debug level. The higher it gets, the more gets gets. Everything
    is output via syslog. See the "Troubleshooting" section below for more information.
    |

    | -k, --kill | Attempt to kill a running tinc and exit. A TERM signal (15) gets
    to send to the daemon that has its PID in /var/run/tinc.pid. Because it kills
    only one tinc daemon, you should use -n here if you started it that way. It will
    then read the PID from /var/run/tinc. /var/run/tinc.NETNAME.pid. |


    continues'
