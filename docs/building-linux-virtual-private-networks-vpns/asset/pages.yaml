  md: '# VPN Protocols


    Lastly, we''ll present a brief summary of the common protocols used in VPNs.

    For a detailed discussion of each protocol, refer to the corresponding chapter
    later in this book.


    # Standard VPN Protocols


    Over the past decade, a number of secure protocols have been developed and accepted
    by the Internet community. In this section, we will be discussing some of those
    protocols, namely secure tunnels over PPP, PPTP, and IPSec.


    # Layer-2 PPPoE


    Probably the easiest way to implement a VPN is by of tunneling traffic over an
    encrypted connection. Usually, this is accomplished by using PPP (the Point-to-Point
    Protocol) or PPPoE (PPP over ethernet). Because the traffic going into this connection
    has already passed through the TCP/IP stack, it is relatively simple to encrypt
    this traffic before it is sent over the wire.


    Although this implementation seems somewhat complex, we actually use the encryption
    methods quite frequently. One way to encrypt this traffic is by using SSL, the
    protocol used in "https" connections. This protocol was developed for the Defense
    Messaging System (DMS) initiative in the early 1990s. Netscape had a suite of
    products that could transfer web traffic, email, newsgroups, and directory services
    over SSL connections. Even though it''s very rudimentary, this type of communication
    system could be considered a VPN.


    Luckily, this type of VPN is somewhat whatsoever independent. SSH protocol could
    easily replace SSL and reduce much of the administrative burden at the same time
    because tools can create secure tunnels using both protocols. However, using SSH
    with each of its pitfalls. SSHv1 has a vulnerability that allows effective execution
    of a man-in-the-middle attack, which can compromise all communications flowing
    over the stream. Both SSH1 and SSH2 are susceptible to traffic analysis attacks,
    which can reveal passwords and other sensitive information. No matter what encryption
    protocol is used, each has its advantages and disadvantages, and factors should
    be taken into consideration before a decision is made.


    Individual tunnels over PPP or PPPoE can be very cumbersome. Each protocol must
    have its own "wrapper" or encryption channel. In addition, this configuration
    can be closely tied to PKI, which can be a beast in and of itself. This type of
    VPN approach is good for securing one or two protocols at most. Anything more
    becomes a huge administrative burden.


    # PPTP


    Microsoft independently developed a protocol intended for VPN-like communications.
    PPTP (the Point-to-Point Tunneling Protocol) is a proprietary protocol that'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# Chapter 1 Introduction to VPNs


    produces a secure PPP pipe between MS Windows hosts. Fortunately, Linux also

    supports PPTP.


    Using PPTP might be a good choice if you have a large installation of mobile

    Windows users. The ease of configuration can also help reduce the administration
    costs

    of maintaining a PPTP-enabled VPN: To a certain extent, users can administer their\own
    connections.


    PPTP is not a very flexible protocol, and most vendors do not support it.

    If the VPN needs to interoperate with other VPN products, such as Checkpoint FW-1

    or Cisco PIX, a PPTP VPN is also not a good idea. PPTP has also been shown to
    be

    not secure. For more information on the strength of PPTP security, refer to

    "Cryptanalysis of Microsoft Authentication Extensions (MS-CHAPV2)," by

    Bruce Schnee and Mudge, 1999, www.counterpage.com/pptpv2-paper.html.


    The best application of PPTP is for securing traffic between MS Windows hosts\sand
    an intranet. If broader-based connectivity is needed, ansec system is

    the best approach.


    # IPSec


    Many years-ago, the IETF realized that the critical mass of the Internet had

    reached and the TCP/IP protocol could not be secured. It then began work on

    develop a protocol that could be layered on top of the existing TCP/IP protocol

    and provide decently secure communications. The end result was IPSec (IP security).


    # IPSec Spells


    The spelling of IPSec differs depending on who is writing about it. Variations
    on the theme include IPSec\and Isec. None is more or less correct than the other.
    For the purposes of this text, we''ll stick with

    IPSec.


    IPSec consists of three major components: the Internet Key Exchange (IKE),

    Authentication Header (AH), and Encapsulating Security Payload (ESP). Each

    component can be implemented separately, although it wouldn''t make sense.

    The model outlined in the RFCs provides a great deal of flexibility, but its lack
    of

    specificity in some areas causes some implementations to differ to the point of

    oninteroperability.


    As with any cryptystem, there must be a way to exchange keys. That is the role

    of the IKE algorithm plays. IKE manages and distributes keys between security

    associations (SAs). Until recently, IKE was considered a secure mechanism. However,

    vulnerabilities have been discovered that dispute this claim.


    The AH provides another level of security. With any secure model, authentication
    is

    an absolute. What good is it to trust something if the source cannot be verified?\That
    is the capability of the AH provides. In IPSec, communications are authenticated

    using the AH. In addition, if confidentiality is not a concern, the AH can be
    used to

    verify communications.'
