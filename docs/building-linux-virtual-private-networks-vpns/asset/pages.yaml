  md: '# Building a VPN with SSH and PPP


    ONE OF THE FIRST ROLL-YOUR-OWN layer VPN solutions was to connect two networks
    with PPP over an SSH session. This method is an established practice, but it might
    feel a bit clunky to someone who is new to the protocols involved. When you finish
    this chapter, you''ll be able to create an SSH/PPP VPN either by hand or by using
    a set of scripts we provide.


    # PPP-over-SSH Overview


    To better understand the PPP-over-SSH implementation, let''s discuss the two protocols-involved.


    # PPP


    PPP stands for the Point-to-Point Protocol. PPP is a derivation of the popular
    High Level Data Link Control (HDLC) (another layer 2 point-to-point protocol,
    commonly used on T1 lines) to accomplish line control and encapsulate user data.
    PPP is most commonly used to establish a connection between modems over phone
    lines, such as when dialing up an ISP. Most Linux distributions come with tools
    such as wial or xisp that let you establish modem connections without fiddling
    with the underlying PPP commands and configurations. PPP, however, is not restricted
    to'
  merge: -1
  pgno: 84
- img_proc: true
  md: 'physical connections only; PPP connections can be established between hosts
    that have network connectivity. Our goal will be to establish a PPP connection
    between different machines on the Internet, which we will use to establish a VPN.


    To run pppd, the PPP protocol daemon, you must have a kernel that supports it.
    PPP is often compiled as a module that you can query with the command `lsmod`,
    so it should load automatically when needed. Most Linux distributions build their
    kernels with PPP support, so this should not be an issue.


    Most Linux distributions also come with precompiled versions of PPP that you can
    install. Thus, you likely will not need to compile and install pppd yourself,
    for reasons that we discuss later, suggest pppd version 2.3.7 or better.


    The focus of PPP has never been on the privacy of the transmitted data, and as
    a direct result, it relies on encryption methods to address this need. The risks
    of PPP data interception on phone lines are limited to line taps or a physical
    presence at either end of the PPP link. However, because we want to use PPP to
    establish a network connection by sending the traffic over the Internet, we must
    tunnel this PPP connection inside an encryption layer.


    # SSH


    The Secure Shell (SSH) protocol is most frequently used to provide secure shell
    access and file transfer with other hosts over the network, secure authentication,
    and data privacy. It was developed as a secure drop-in replacement for Telnet
    and the Berkeley r-commands `login`, `rsh`, and `rep`.


    SSH supports enhanced encryption and user authentication methods that have stood
    the test of time. OpenSSH, an implementation of the SSH protocol written by folks
    at FreeBSD and ported to Linux by the OpenSSH portability team, is now included
    with many Linux distributions by default. SSH is the facto secure login and file-transfer
    method for UNIX-like systems.


    There is SSH software from other vendors such as `ssh.com`. We prefer OpenSSH,
    however, because it comes with most Linux distributions, is easier to configure,
    is more consistent between versions, and supports both version 1 and 2 of the
    SSH protocol. The setup in this chapter assumes you are using OpenSSH.


    # Issues of Protocol


    The SSH protocol has gone through several different versions since it was created
    in 1995, the major ones being version 1.5 (referred to as SSH1) and version 2
    (SSH2). OpenSSH 2.0, which was released in June of 2000, supports both protocols
    natively. (Commercial SSH also can support both protocols but only by fork/execing
    the version 1 sshd binary when needed, creating a large performance hit.)


    The two SSH protocols are not compatible, and you should determine which one you
    prefer to use. Even now, there remains a theoretical insertion attack against
    the SSH1 protocol, but this is'
