- img_proc: true
  md: '# IPSec Architecture, Components, Concepts 145


    Note


    The IKE module in one of the Linux IPSec implementations—FreeS/WAN—is called Pluto.
    The Pluto daemon works in user space, negotiating and negotiating keys and SAs
    when necessary.


    # Overview of IKE


    IKE enables you to automatically negotiate SAs. IKE works over UDP, port 500.
    Thus, you''ll need to enable UDP traffic from/to that port to use IKE. If you
    use ipchains on Linux, you can enable IKE traffic as:


    ```

    root@# /sbin/ipchains -A input -p UDP -d

    <your_ipsec/ike_peer''s_ip>/32 500 -j ACCEPT

    ```


    IKE was designed to address a number of security concerns. It provides protection
    from an attacker replaying, removing, or changing messages. IKE can also support
    Perfect Forward Security (PFS).


    Note


    PFS is usually implemented as an option you can turn on when configuring IKE.
    With PFS, if a key is compromised, only the data encrypted by that key is compromised.
    Without PFS, the other keys/SAs can also be affected. We recommend that you enable
    this option.


    The protocol consists of the two phases described in the next sections.


    # Phase I


    The purpose of this phase is to establish a secure channel to protect subsequent
    Phase II negotiations. To establish the channel, both peers need to share a secret
    key and other parameters.


    The secure channel is created by negotiating an ISAKMP SA between the peers. It
    is important to note that Phase I negotiations typically take place less frequently
    (an hour or perhaps once a day) than Phase II negotiations (say, once every minute
    or every 1024K of encrypted data).


    # Phase II


    The purpose of this phase is to negotiate the IPSec SAs to protect IP traffic.
    All messages exchanged during Phase II are protected using the secure channel
    established during Phase I.


    To demonstrate, if hosts A and B want to protect traffic between each other using
    IPSec, they need to share a SA. If a packet is to be sent from A to B and there
    is no applicable SA in A''s SAD, IKE is asked to negotiate a new IPSec SA with
    B.


    When asked to negotiate a new SA, IKE first checks whether there is an ISAKMP
    SA to B; if there is not, a new ISAKMP SA is negotiated (Phase I). The ISAKMP
    SA is then used to securely negotiate the requested IPSec SA to protect traffic
    between A and B (Phase II). Next, the IPSec SA is saved in both A''s and B''s
    SAD.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# Authentication Methods


    It is crucial for peers participating in IKE negotiations to authenticate each
    other; otherwise, the security of the key exchange is questionable. To authenticate
    peers, IKE can utilize the methods discussed in the following sections.


    # Pre-shared Key (PSK)


    The authentication is performed by means of proof-of-possession of the shared
    key because only the participating peers are supposed to know the key. The problem
    is to distribute the key(s) in a secure and scalable manner.


    # Public Key Algorithms


    The authentication uses public key algorithms to encrypt data using a public key
    and decrypt it with private key. The method relies on two facts, namely:


    +   - The public key is received inside the peer''s public key. The problem is
    reliable distribution of the public keys.


    +   - If A is true, then possession of the private key associated with the public
    key previously mentioned may serve as a proof of identity.


    # Digital Signatures (DSS or RSA Signature)


    The peer to be authenticated electronically signs data with his or her private
    key. If the signature is verified using the public key of that peer, the peer''s
    identity is also verified.


    To deal with problem of distributing public keys, the digital signatures method
    can use digital certificates and rely on a trusted third party to bind the identity
    of the peer to be authenticated to its public key. In general, this method is
    considered better than exchanging public keys directly.


    Under certain circumstances, however can still be exploited. See www.cc.gatech.edu/~ok/mitm
    for more information.


    > Note

    in addition to the three generic authentication methods previously mentioned,
    the IPSec RFCs state that IPSec implementations may use Kerberos for authentication.
    One of the implementations that actually does so is Windows 2000''s IPSec.


    # IKE Phase I Essentials


    During Phase I, IKE has to carry out several important operations. One is to negotiate
    cryptographic protocols and parameters that will be used for authentication and
    encryption. The other is to authenticate peers using the negotiated algorithms.

    Finally, a shared secret needs to be established based on the exchanged information.'
  merge: -1
  pgno: 163
- img_proc: true
  md: '# IPSec Architecture, Components, and Concepts 147


    The outcome of Phase I is a secure channel that can be used between peers to perform
    Phase II negotiations of IPSec SAs.


    There are three possible Phase I modes:


    +   - Main mode

    - Aggressive mode

    - Base mode


    # Main Mode


    In the Main mode, six UDP datagrams are exchanged. If hosts A and B are the peers,
    the first Main mode message makes a proposal—offers a list of alternative protocols
    for B to choose from. In the second message, B returns the protocols it wants
    to use with other information.


    Here is a simplified example of the protocols that A could send in a proposal:


    From A to B:


    ```

    {3DES, MD5}, {BLF, SHA-1, DH-G1}, {CAST, MD5, DH-G1}, {3DES, SHA-1, DH-G2}

    ```


    From B to A:


    ```

    {3DES, SHA-1, DH-G2}

    ```


    As you can see, A offers four choices in its proposal. Each choice includes one
    cipher, one cryptographic hash, and one key exchange algorithm (unless Presared
    Key (PSK) is used). The DH-G* codes specify different groups of the Diffie-Hellman
    key exchange algorithm.


    > Note


    The difference between various DH groups previously mentioned is either in the
    length of the prime modulus (MODP) applied when performing DH calculations or
    in the basis of the DH algorithm. DH Groups 1, 2, and 5 use 768-, 1024-, and 1536-bit
    primes as modulus; DH groups 3 and 4 are based on elliptic curves.


    The bottom line is that, generally, the bigger the DH prime, the better. Using
    Group 1 is not a good idea, though if you are to choose, go with Group 5 or bigger
    groups. Free/WAN, the Linux IPSec implementation, supports DH Groups 2 and 5 as
    of version 1.91.


    In the next messages, peers exchange shared keys. (DiffieHellman is typically
    used to perform the key exchange.) Finally, the peers authenticate each other
    using the authentication method selected in the first messages. (Currently, it
    can be one of the three methods described earlier: PSK, public key algorithms,
    or digital signatures/certificates.)'
  merge: -1
  pgno: 164
- img_proc: true
  md: '# 148 Chapter 5 IPSec


    > Note


    In the Main mode, peers verify each other''s identities after the protocols and
    parameters have been negotiated. At the time of negotiation, the only identity
    information available to peers is their IP addresses. Thus, it is not possible
    to reliably attach a specific set of keys and security parameters to an identity
    before negotiating the protocols.


    # Aggressive Mode


    In the Aggressive mode, three UDP datagrams are transmitted. This mode is a compressed
    version of the Main mode. Therefore, fewer packets are necessary to establish
    a Phase I ISAKMP SA.


    Among the advantages of this mode are not only the decreased number of messages
    but also the possibility of associating the identity of the peer (not just the
    IP address, as in Main mode) with a specific preshared key or a security policy.
    This is possible because the identity information is exchanged before a shared
    key has been established.

    The major drawback of this mode is that resource-consuming calculations are performed
    immediately in response to the first (proposal) message. This means that an attacker
    can potentially send a number of proposals with spoofed source IP addresses, which
    might affect the receiver''s performance and lead to the denial of service.

    \To conclude, we''d like to note that the IPSec working group is currently considering
    the removal of the Aggressive mode altogether. Therefore, it might be a good idea
    to stick with the Main mode for now.


    # Base Mode


    The Base mode was devised to capitalize on the Aggressive mode''s advantages and
    deal with its disadvantages. Four UDP datagrams are sent in the Base mode. The
    mode performs the computationally intensive key establishment part until a response
    is received from the initiating party to confirm its existence.

    The Base mode does not address all the problems of the Aggressive mode, though.
    For instance, unless public key encryption is used, the identity of the communicating
    parties is not protected. This is because the shared keys are calculated after
    the peers have exchanged and verified each other''s identity information.


    Overall, the Base mode has its plus and minuses. However, it has not been as widely
    implemented as the Main and Aggressive modes.


    # Phase II Essentials


    After Phase I negotiations have been completed, both peers should share a new
    ISAKMP SA. The new ISAKMP SA will be used to protect the subsequent Phase II negotiations.


    The protocol for Phase II negotiations is called Quick mode (QM). The Quick mode
    consists of three messages and allows for negotiation of one or more IPSec SAs.
    Either peer can initiate the negotiations. Each negotiated IPSec SA will then
    be shared by peers and stored in their SADs.'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# IPSec Architecture, Components, and Concepts 149


    In QM, both parties need to negotiate IPSec protocol or a combination of protocols
    to be used with each IPSec SA. As in Phase I, the parties exchange proposals.
    A proposal includes a list of protection suites for each proposed IPSec SA. For
    instance, a proposal might include the following:


    ```

    ESP-3DES

    ESP-3DES-SHA

    ESP-3DES-MD5

    ESP-3DES-SHA-PFS


    AH-3DES-MD5

    AH-3DES-SHA

    AH-3DES-MD5-PFS

    AH-3DES-SHA-PFS

    ```


    With each proposal, additional information is also sent, in particular:


    +   - Proposed IPSec SA lifetime

    - DH Group

    - Transport or Tunnel mode indicator

    - Key information


    You are probably wondering: If more than one IPSec SA is negotiated, should they
    all be protected with the same ISAKMP SA? Obviously, if the ISAKMP SA is compromised,
    all the IPSec SAs protected with ISAKMP SA can be compromised. This is where Perfect
    Forward Secrecy can help.


    If you enable PFS, a separate Diffie-Hellman exchange will be performed for each
    IPSec SA (that is, an ISAKMP SA will only be used to protect one IPSec SA). This
    will make IPSec SAs/keys independent from each other, and if the ISAKMP key is
    compromised, only one IPSec SA/key is compromised. The downside of PFS is that
    the additional DH exchanges required for each IPSec SA will affect performance.


    # IPSec Packet Manipulation Protocols


    As discussed earlier, the IPSec protocol suite consists of three main elements
    that manipulate IP packet data:


    +   - Authentication Header (AH)

    - Encapsulating Security Payload (ESP)

    - IP Compression (IPCOMP)


    If you use AH to protect IP traffic, you get authentication, integrity protection,
    and replay protection. However, your data will be transmitted in cleartext. Choose
    ESP if you want to add encryption to make your data confidential. Furthermore,
    with ESP, you also get the three kinds of protection that AH offers.


    At this point, you might wonder why you should use AH at all. There are two arguments
    substantial enough to consider.'
  merge: -1
  pgno: 166
- img_proc: true
  md: '# Chapter 5 IPSec


    First, AH provides slightly more authentication and integrity protection than
    ESP. AH covers both the outer IP header and the packet''s payload, whereas ESP
    only covers the payload.


    Second, encrypting data in addition to authenticating it and protecting its integrity
    requires additional processing time.


    Unless you want to transmit packets in cleartext, we recommend that you combine
    AH and ESP or use ESP by itself. Typically, you have the following options:


    +   - AH only: Advanced authentication, integrity, and antireplay

    - ESP only: Authentication (optional), integrity, antireplay, and encryption

    - ESP and AH: Advanced authentication, integrity, antireplay, and encryption

    - ESP and IPCOMP: Authentication, integrity, antireplay, encryption, and compression.

    - ESP, AH, and IPCOMP: Advanced authentication, integrity, antireplay, encryption,
    and compression


    You can also combine multiple protocols by using several SAs for the same packet.
    In the example shown in Table 5.7, both AH and ESP will be applied to packets
    going to 192.168.2.1, port 53.


    # Table 5.7 Application of AH and ESP


    | SPI | Src | Dst | Src | Dst | Params Ciphers, | IPSec | Pointer to |

    |---|---|---|---|---|---|Keys, etc.) | Proto | Type | SPD Entry |

    | 280 | 192.168.1.8 | 192.168.2.1 | Any | 53 | [...] | AH | Out-bound | 5 |

    | 386 | 192.168.1.8 | 192.168.2.1 | Any | 53 | [...] | ESP | Out-bound | 5 |


    We will now describe AH, ESP, and IPCOMP in more detail.


    > Note In contrast to IKE, the three IPSec packet manipulation protocols work
    at the IP level, so there are no ports associated with them. However, ESP and
    AH both have protocol numbers associated with (50 and 51). There is no guarantee
    that your firewall will like packets with unknown protocol numbers, you might
    want to add specific firewall rules to let these protocols go through. If you
    use ipchains, then you can enable AH and ESP traffic as:


    ```

    root@fox # ipchains -A input -50 -s <your_ip> -j ACCEPT

    root@fox # ipchains -A output -50 -d <your_peer_ip> -j ACCEPT

    root@fox # ipchains -A input -51 -s <your_ip> -j ACCEPT

    root@fox # ipchains -A output -51 -d <your_peer_ip> -j ACCEPT

    ```'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# Authentication Header (AH)


    As previously mentioned, the Authentication Header (AH) protocol provides authentication,
    integrity, and replay protection. For authentication and integrity protection,
    AH relies on keyed cryptographic hash algorithms.

    The keyed algorithms are used because they make it impossible for attackers to
    modify and generate valid cryptographic hashes for intercepted AH-protected packets
    without knowing the keys shared by AH peers.


    # Adding AH Protection


    When AH protection is added to an IP packet, a new AH is inserted immediately
    after the IP header of the packet. (IPv6 may have extension headers before the
    new AH.) Figure 5.4 shows how AH protection is added to an IP packet.


    ![](img/ac8d70f99c3fa1e7029fbd036fc254da_168_0.png)'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# 152 Chapter 5 IPSec


    The added AH is typically 24 bytes long, consisting of six fields. The fields
    are as follows:


    +   - Next header (1 byte index, 50 for ESP, 51 for AH and others).

    - For IPv4, it contains the protocol index of one of the following protocols:
    ESP, COMP, TCP, or UDP. For IPv6, it contains the next extension header.

    - AH length in 4-byte dwords (1 byte).

    - Reserved field (2 bytes).

    - SPI (4 bytes).

    - Antireplay sequence number (4 bytes).

    - Sender''s and receiver''s counters are reset to 0 when SA is established. This
    number must not be allowed to cycle, so it is reset by establishing a new SA after
    $2^{32}$ AH packets protected using the SA are transmitted.

    - Authentication data (variable length, multiple of 4).

    Usually consists of a 12-byte stripped-down version of a 128-bit or 160-bit cryptographic
    hash output.


    Two keyed algorithms must be present in all AH implementations: HMAC-MD5 and HMAC-SHA1.
    The output of the keyed hash algorithm to be used by IPSec peers is stored in
    the Authentication Data field of the added AH as previously mentioned.


    # AH Step by Step


    The basic steps AH has to perform to do after protection are as follows:


    +   - Insert the AH header into the IP packet being processed.

    - Update the sequence number in the associated SA and store it in the new AH header.
    When a new SA is negotiated, its sequence number is reset to zero. The counter
    is incremented each time AH protection is added to a packet.

    - Add HMAC authentication data. The algorithm defined in the SA (for example,
    HMAC-MD5 or HMAC-SHA1) is used to generate a new message authentication code based
    on the contents of the IP packet. The authentication algorithm output is cut down
    to 96 bits and stored in the AH header.

    - Fragment the new AH-protected packet if necessary.


    # End-to-End Protection


    You need to understand that unless AH covers the complete path of an IP packet
    from one end to the other, the security of your AH-protected channel can be breached.


    For example, if hosts send traffic to a gateway that protects the traffic using
    AH, an intruder can change the traffic before it gets to the gateway. In this
    case, the change will not be detected, and AH protection is useless.'
  merge: -1
  pgno: 169
- img_proc: true
  md: '# IPSec Architecture, Components, and Concepts 153


    To deal with such problems, use end-to-end protection. In other words, start protecting
    traffic right where it originates and continue that protection all the way to
    its destination. The idea is illustrated in Figure 5.5.


    ![](img/ac8d70f99c3fa1e7029fbd036fc254da_170_0.png)


    Figure 5.5 End-to-end protection.


    Here is how you can better protect your network. First, set up all the hosts on
    your local network to protect their traffic using Transport mode AH or ESP. Next,
    set up your gateways to protect all traffic originating from the hosts using IPSec
    ESP in Tunnel mode. As a result, even if attackers gain access to your network,
    they will still not be able to read or alter your traffic.


    # Encapsulating Security Payload (ESP)


    As you''ve already learned, you can use the Encapsulating Security Payload (ESP)
    to add the three types of protection offered by AH (authentication, integrity,
    and replay protection) plus confidentiality.

    As previously noted, ESP enables you to select just confidentiality (data encryption).
    Again, before implementing this protection alone, review the findings of Steve
    Bellovin (see www.research.com/~smb/papers/bades.ps) to understand the implications
    of such a decision. We highly recommend using authentication and integrity protection
    whether you enable confidentiality or not.


    # Adding ESP Protection


    When ESP protection is added to an IPv4 packet, a new ESP header will be inserted
    either immediately after the AH header or after the IP header of the packet (if
    there is no AH header). For IPv6, the new ESP header becomes one of the extension
    headers. The ESP processing is depicted in Figure 5.6.'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# 154 Chapter 5 IPSec


    ![](img/ac8d70f99c3fa1e7029fbd036fc254da_171_0.png)


    ![](img/ac8d70f99c3fa1e7029fbd036fc254da_171_1.png)


    Figure 5.6 Adding ESP protection.


    The added ESP header consists of seven fields, two of which are optional. The
    fields include:


    +   - SPI (4 bytes)

    - Entireplay sequence number (4 bytes)

    - Payload data (for instance, encrypted IP packet when ESP is used in Tunnel mode)

    - Padding (optional, 0–255 bytes)

    - Padding length in bytes (1 byte)

    - Authentication data (if required, variable length; similar to the AH''s Authentication
    Data field)'
  merge: -1
  pgno: 171
- img_proc: true
  md: '# IPSec Architecture, Components, and Concepts 15


    Before adding the header, the ESP protocol performs encryption of the payload
    data and padding, if necessary. The data to be encrypted is divided into blocks
    and then encrypted block by block. The block length and the type of chaining applied
    to the blocks are specified in the associated SA.


    Currently, the ESP lists 56-bit DES-CBC as the minimum mandatory cipher to be
    implemented. However, the 56-bit DES does not provide adequate protection, so
    many implementations (for example, FreeS/WAN) dropped 56-bit DES in favor of 168-bit
    3DES, which is more secure.


    After the ESP protocol is processing the data, the ESP header is added. Next,
    authentication and integrity-protection values are either by ESP itself or by
    AH.


    # ESP Step by Step


    Summarizing the information in the previous section, here are the basic steps
    performed when adding ESP protection to an IP packet:


    +   1. Insert the ESP fields into the packet being processed. Pad the packet if
    necessary, filling out the Pad Length and Padding fields.


    +   2. Encrypt the ESP payload with the algorithm and parameters specified in
    the associated SA. A special type of encryption algorithm—NULL—disables encryption.


    +   3. Update the sequence number. This is the done way as in AH.


    +   4. Calculate authentication data if it is required. The data is calculated
    on the ESP packet, with the last field where the authentication data will be reset
    to all zeros. Skip this step if no authentication is required.


    +   5. Fragment the new ESP-protected packet, if necessary.


    # ESP Interoperability and End-to-End Protection


    If interoperability is a concern, your best to bet is HMAC-MD5 or HMAC-SHA-1 as
    a cryptographic hash algorithm and 3DES-CBC as a block cipher.


    AES Rij might also be a viable choice because it has been selected as the DES
    replacement. However, AES has not yet been implemented as widely as 3DES. The
    following sections for more information on interoperability.


    Another thing to consider is end-to-end protection. The problem is similar to
    the one described for AH earlier. In the case of ESP, however, the outer header
    is not authenticated. Hence, an attacker might be able to modify the IP headers
    of the packets on the local network even if ESP is used between a host and a gateway.You
    can solve this problem by protecting traffic end to end (with AH) by using both
    AH and ESP at the same time.'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# IPCOMP


    The IPCOMP compression must be completed before authentication or encryption takes
    place. The IPCOMP header contains, among other elements, a Compression Parameters
    Index (CPI) that defines a well-known compression algorithm to be used.


    One important thing you should know about IPCOMP is that if you are already using
    it at the IP level (corresponding to the Network Layer of the OSI model), turning
    on on lower layers, such as the Data-Link Layer or the Physical Layer, will not
    do you much good.


    The lower layers will try to compress data that has already been compressed. It
    will make your system slower without providing much compression in most cases.
    For example, if you have IPSec with IPCOMP turned on and it works over PPP or
    CSLIP, make sure you have PPP or CSLIP compression turned off.


    # Creating a VPN with IPSec


    We recommend that you take all VPNs, including IPSec based, one point-to-point
    link at a time. Creating an IPSec point-to-point VPN link will usually require
    you to do in the following:


    +   1. Identify the endpoints of your VPN link and make sure they support IPSec.

    For example, if you want to use FreeS/WAN on Linux, you will need to add IPSec
    support to the kernel (KLIPS) as well as compile and install IKE binaries (PLUTO).

    2. Configure IPSec on both peers: generate keys, define security policy, enable
    IPSec/IKE traffic, and determine the IP addresses of the tunneled networks and
    peers'' interfaces.

    3. Choose a way to authenticate peers: presared key (PSK), public key algorithms,
    or digital signatures.

    In the case of PSK, you will need to manually set up Security Associations on
    both peers specifying the same key.

    For public-key algorithms and digital signatures, you will need to distribute
    public keys so that each peer knows the public RSA/DSA key(s) of the other peer(s).

    4. Bring the IPSec interface up and run the IKE daemon, if necessary.

    5. Test your new IPSec VPN link.'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# IPSec Road Warriors


    In a road warrior scenario, we assume that one of the IPSec peers has a dynamic
    IP address. For example, you might have an employee who travels and who needs
    to securely connect to your company''s internal network while on the road using
    a laptop.


    Another example is when one of your IPSec peers obtains its IP address from a
    DHCP server and the IP address changes from time to time. This concept is depicted
    in Figure 5.7.


    ![](img/ac8d70f99c3fa1e7029fbd036fc254da_174_0.png)


    Figure 5.7 The road warrior scenario.


    Because the IP address of one of your IPSec peers is dynamic, your IPSec server
    can''t use it to verify the identity of the connecting peer. Therefore, if you
    want to support the road warrior scenario, you have to be able to authenticate
    incoming IPSec messages regardless of their source IP. To do that, you can use
    one of the three authentication methods described earlier (PSK, public keys, or
    digital signatures).


    # Interoperability of IPSec Implementations


    IPSec RFCs are known to leave a number of details at the implementers'' discretion.
    This is why making sure IPSec implementations operate is crucial (unless you are
    able to restrict all your VPN components to the same vendor). Remember that if
    you see a vendor offering an IPSec implementation, it does not necessarily mean
    the implementation will interoperate with other IPSec implementations. To get
    a list of some common reasons for interoperability faults, go to www.icslabs.com/html/communities/ipsec/lab/testing/CommonFaults.html.'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# FreeS/WAN


    For many IPSec implementations, you can find a list of the implementations with
    which they have been successfully tested. To illustrate, we have compiled a list
    of IPSec implementations that have a basic level of compatibility (the explanation
    for this is given after the list) with FreeS/WAN v1.91:


    +   - KAME: FreeBSD, NetBSD, OpenBSD, BSDI

    - PGPnet

    - Windows 2000

    - F-Secure VPN

    - IRE Safenet/SoftPK

    - SSH IPSec Express

    - Gauntlet GVPN

    - Xedia''s AccessPoint QVPN

    - Checkpoint SecuRemote VPN-1/Firewall1

    - Raptor Firewall, Raptor MobileNT


    By a basic level of compatibility between FreeS/WAN and another IPSec implementation,
    we mean that somebody was able to get FreeS/WAN to work with that implementation
    in one way or another. Note that, in many cases, testing was not comprehensive,
    so you might need to take a closer look on a case-by-case basis.


    # Web-Based Interoperability Testing


    Several organizations created web-based interoperability testing pages that you
    can use to test how your IPSec implementation operates with theirs. For example,
    NIST offers an interoperability page based on its reference implementation of
    IPSec called Cerberus. The IKE part of Cerberus is called PlutoPlus. You can test
    how your IPSec implementation operates with both at http://wit.andt.nist.gov.


    The NIST testing system supports both (PSK) and automatic (IKE) key negotiation.
    For PSK-based testing, Security Associations are established manually. For IKE-based
    testing, a Security Association is automatically negotiated between your implementation
    and Cerberus.


    Both the manual key test system and the IKE test system then use the negotiated
    Security Association to ping your system. The test results can be viewed on browser
    or be sent to you via email.


    Another web-based interoperability testing system is offered by SSH. It offers
    to test your system with the SSH IPSec Express implementation. Go to http://isakmp-test.ssh.fi
    for more information.'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# Conformance Testing


    The VPN Consortium came up with an IPSec conformance-testing page for its members.
    The idea is to define tests for various parts of the IPSec standards. If an IPSec
    implementation passes a conformance test, it gets a logo that constitutes VPNC''s
    belief that the implementation conforms to the appropriate set of IPSec standards.
    The VPNPC initiative is well on its first logos issued in July 2000.


    Currently, three conformance tests are available from VPNPC—Basic, Rekeying, and
    Certificates. A short description of each test and a list of the IPSec products
    that passed are given below. See www.vnpc.org/conformance.html for more details.
    Note that the list of conforming products is limited. In particular, it does not
    include free IPSec implementations.


    # Basic Test


    The Basic test requires an IPSec product to be able to initiate an IPSec ESP tunnel
    to each of the two test gateways. The tunnel requires 3DES for encryption, SHA-1
    for cryptographic hash, Diffie-Hellman Group 5 (1,024-bit MODP) for key exchange,
    and preshaared key for authentication. As the term "Basic" implies, every IPSec
    implementation mentioned today should have these features.


    Currently, this is the list of commercial IPSec implementations that have passed
    the Basic test:


    +   * ADTRAN, NetVanta

    * Alcat (Timestep), Secure VPN Gateway 7130 series

    * Ashley Laurent, BroadWay SDS

    * Avaya, VSU Series of VPN Gateways

    * Cisco, IOS IPSec

    * Cisco,VPN 3000 Concentrator

