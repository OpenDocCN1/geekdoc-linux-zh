  md: '# Building a PPTP VPN Client


    # Setting Up Your PPTP Tunnel Client


    We''ll show how to set up your PPTP tunnel by showing you the pptp-command in
    action. The pptp-command is simply a menu-driven interface that enables you to
    configure various ppp-related files. At each step, we''ll also show what changes
    the pptp-command program performs so that you can make these modifications manually
    if you prefer.


    Start off by running the pptp-command script and selecting setup:


    ```

    wildat@ pptp-command

    1.) start

    2.) stop

    3.) setup

    4.) quit

    What task would you like to do:

    1.) List CHAP secrets

    2.) Add a New CHAP secret

    3.) Delete a CHAP secret

    4.) List PPTP Tunnels

    5.) Add a NEW PPTP Tunnel

    6.) Delete a PPTP Tunnel

    7.) Configure resolv.conf

    8.) Select a default tunnel

    9.) Quit

    ```


    # Configuring CHAP Secrets


    The first thing you need to do is store the passwords that will be used for the
    PPTP connection. There are two usernames and passwords in question. The pptp-command
    script calls them the local name and remote name. Not obviously, the local name
    is the username used for authentication on the PPTP server, which you learn from
    your administrator. The remote name is usually PPTP unless configured differently
    by the server administrator.


    If you are connecting to an NT PPTP server and that is part of an NT domain, you
    must include the domain name as your local name argument, separated by double
    backslashes from your username. So, if your username was REEEN and the NT domain
    was CHICAGO, you would use CHICAGO\REEGEN for the local name.


    Select the Add new CHAP secret option from the setup menu:


    +   1.) List CHAP secrets

    2.) Add a New CHAP secret

    3.) Delete a CHAP secret

    4.) List PPTP Tunnels

    5.) Add a NEW PPTP Tunnel

    6.) Delete a PPTP Tunnel

    7.) Configure resolv.conf

    8.) Select a default tunnel

    9.) Quit


    7: 2'
