  md: 'Opportunistic Encryption 161


    +   - NetScreen, NetScreen

    - RapidStream

    - SSH Communications Security; IPSec Express


    # Conformance vs. Interoperability


    Beware that conformance does not mean interoperability. Conformance means that
    an implementation passed a set of predefined tests. Although the fact that IPSec
    imple- mations the same conformance tests increased probability of them being
    interoperable, it does not guarantee their interoperation.


    So what should you do? From our experience, the best way to determine what IPSec
    implementations your implementation can operate with is to search for rel- ev
    details through mailing lists or using Internet search engines. In addition, you
    can always try establishing an IPSec link and see if it actually works.


    # Opportunistic Encryption


    As you have noticed, your IPSec implementation needs to have information about
    the hosts to which it can send protected traffic. If you want to protect traffic
    to a random IP address of which you have no prior knowledge?


    Opportunistic encryption (OE) aims at adding secure connectivity between any two
    hosts that support IPSec. OE will try to protect packets destined not only for
    the IP addresses of your system also for other hosts without the need to prearrange
    the connection. In other words, OE negotiates secure tunnels with strangers.


    To demonstrate how OE works, assume a packet delivered for www.yahoo.com arrives
    at your IPSec gateway. The IPSec module on the gateway picks up the packet, looks
    at the destination address, and checks the local SPD and SAD.

    If no matching Security Association is found and there is no knowledge about the
    destination of the packet, a regular IPSec module would either drop the packet
    or send it unprotected. With OE enabled, the IPSec module might decide to establish
    a secure channel to www.yahoo.com.


    To do that, your IPSec module turns to DNS where the public key for www.yahoo.com
    can be stored. The IP address of www.yahoo.com (obtained from the header of the
    received packet) is used to find a reverse DNS record. The reverse DNS record
    will contain the key for www.yahoo.com.


    To illustrate, we will assume that www.yahoo.com does not support IPSec, so the
    record will refer to an IPSec gateway that. The IPSec gateway will be respons-
    ble for tunneling traffic to www.yahoo.com.


    The information retrieved from the reverse DNS record can be as follows:


    ```

    223.76.58.64.in-addr.arpa. PTR www.yahoo.com.

    IN TXT ''X-IPsec-Server(10)=64.58.76.250

    AEfJDfjffkkKr..5ggjGKKKJ''

    ```'
  merge: -1
