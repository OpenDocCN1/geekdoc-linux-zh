- img_proc: true
  md: '# ipchains and Forwarding


    First, check whether your kernel supports ipchains:


    ```

    [root@#] ls -l /proc/net/ip_fwchains

    -rw------- 1 root root 0 Mar 5 17:19 /proc/net/ip_fwchains

    ```


    If there is no such file, you can exclude ipchains from the list of possible reasons
    why tinc does not work and move on. Make sure, however, that if you have other
    machines using your tinc tunnel, you enable IP forwarding:


    ```

    [root@#] echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    Second, look for the ipchains package itself, as follows:


    ```

    [root@#] rpm -qvh | grep ipchains

    ipchains-1.3.9-5

    ```


    Again, if you do not have the package installed, you can skip this section and
    move on because you do not have to ipchains for tinc to work. However, we recommend
    that you use ipchains because it enables you to improve your security by providing
    increased control over the traffic in and out of your system.


    If you determine that ipchains is installed, the following section will describe
    how to view and adjust it.


    # Modifying ipchains Rules


    You can list all existing ipchains rules using the following:


    ```

    [root@#] ipchains -L

    ```


    Here is what you need to enable tinc traffic on port 655 to and from your host:


    ```

    [root@#] ipchains -A input -j ACCEPT -d <local_tinc_ip> 655 -p udp

    [root@#] ipchains -A output -j ACCEPT -d <peer_tinc_ip> 655 -p udp

    [root@#] ipchains -A input -j ACCEPT -d <local_tinc_ip> 655 -p tcp

    [root@#] ipchains -A output -j ACCEPT -d <peer_tinc_ip> 655 -p tcp

    ```


    # Running tinc


    Given that the configuration for both peers in our scenario is in place, tinc
    will not complain, and you should be able to run it on either peer using the following
    command line:


    ```

    [root@# tinc]# tincd -n <vpn_name>

    ```


    Or, in our specific example, you should use the following:


    ```

    [root@# tinc]# tincd -n shattuck

    ```


    This is a fairly common way of running tinc. By specifying a VPN name on the command
    line, you are telling tinc to look for configuration files in the /etc/tinc/<vpn_name>/
    directory.'
