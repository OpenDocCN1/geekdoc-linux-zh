    t changing the prefix length to /32.


    +   - Network doesn''t work, syslog shows only packets of length 46. This

    problem usually manifests itself in the following messages:

    Jan 1 12:00:00 host tinc.net[1234]: Read packet of length 46 from tap device

    Jan 1 12:00:00 host tinc.net[1234]: Trying to look up 0.0.192.168 in connection

    -- failed!


    Add ifconfig -arp to your /etc/tinc/<your_vpn>/tinc-script.

    - Network address and subnet mask do not match! The Subnet field must

    contain a network address. If you only want to use one IP address, set the

    netmask to /32, which corresponds to 255.255.255.255 (an example of

    least-inclusive mask).


    +   - This is a bug: net.c:253: 24: <Some error>. This is something that,

    according to tinc developers, should not have helped, so they

    strongly encourage users to report such errors. You can go to tinc''s web site
    and

    use the contact from the site to email the details of the error.

    - Error reading RSA key file ''rsa_key.priv'': No such file or directory.

    Make sure you use a complete path for the RSA key in tinc.conf.

    Specifying a relative path will not work because tinc changes its directory to
    /

    starting to avoid keeping mount point busy.


    # Using tcpdump to Capture Tinc''s Traffic


    Because most of the traffic transmitted by tinc the unprotected network is

    encrypted, one of the reasons you might still want to use tcpdump on regular net-

    work interfaces is simply verification of the existence of traffic or to specific
    IP

    addresses and ports.

    For instance, if tinc is having problems establishing a connection or traffic
    is not

    coming, run the following command to see what is actually transmitted:


    ```

    [root@tinc]# tcpdump -i eth0 ''src host <peer''s_real_ip> and src port 655 and

    dst host <local_ip> and dst port 655 and tcp''

    ```


    Make you adjust port numbers in the preceding example to reflect the numbers

    you used in host configuration files of both peers. Replace the tcp option with
    the\udp option to see the data transmitted over UDP.

    You can also use tcpdump on a tinc tunneling interface. In this case, you should
    be

    to see the decrypted traffic tunneled through the tinc interface:


    ```

    [root@tinc]# tcpdump -i tap0 ''src host <local_ip> and dst host

    <peers_tinc_ip> and tcp''

    ```'
