  md: '# Planning Your VPN 175


    # IP Security Protocol (FreeS/WAN IPSec)


    This is the main body of the KLIPS code. The options available signify to include
    the KLIPS code directly into the kernel (y), to compile the code as a module (m),
    or not to include it all (n). If you want IPSec functionality, select y or m here
    (preferably m).


    # IPSec: IP-in-IP Encapsulation (Tunnel Mode)


    IPSec can operate in one of two modes:Tunnel or Transport. The difference between
    these modes is described in Chapter 5, “IPSec.” You probably want to use Tunnel
    mode.


    # IPSec: Authentication Header


    IPSec can provide two different types of use: AH and ESP. AH mode only provides
    authentication, so you probably not want to use without ESP. Using ESP without
    AH mode is perfectly acceptable because ESP provides authentication and encryption.
    The decision to use AH should be based on your requirements. If you want to use
    IPSec in AH mode, select y here. Otherwise, select n.


    # HMAC-MD5 Authentication Algorithm


    One of the hashing functions available to IPSec AH mode is HMAC-MD5. Your choice
    to use this mode is dependent on whether the other endpoint in the IPSec connection
    requires the HMAC-MD5 algorithm.


    # HMAC-SHA1 Authentication Algorithm


    The other hashing algorithm included in FreeS/WAN is HMAC-SHA1. HMAC-SHA1 has
    been shown to be cryptographically stronger than HMAC-MD5, and it should be noted
    that this increased level of security comes at a moderate performance cost. Regardless,
    your decision to use this protocol should be based on the requirements of your
    VPN.


    # IPSec: Encapsulating Security Payload


    By selecting y here, you signify that you want to use IPSec in ESP mode. This
    is the mode you want to use because it provides mathematically sound confidentiality
    and authentication services.


    # 3DES Encryption Algorithm


    If you want to use IPSec in ESP mode, definitely select y here. Otherwise, it
    won’t work. It’s the only algorithm available at this time.


    # IPSec: IP Compression


    This option will compress IP packets in Tunnel mode. Because encryption of data
    can sometimes result in larger data, it’s good to compress that data as it passes
    through the'
