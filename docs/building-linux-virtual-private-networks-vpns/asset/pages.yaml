    SHA:DES-CBC-MD5:EXP-RC4-MD5:DES-RC4-SHA:EDH-DES-CBC-SHA:EXP-

    DES-CBC-SHA:EXP-RC2-CBC-MD5:EXP-RC4-CBC-MD5

    ```


    As you can see, the list of ciphers is extremely long and somewhat cryptic. However,
    for the security of your VPN, you might limit the ciphers you support by selecting
    only the strongest ciphers. This list can be created by running openssl as follows:


    ```

    $ openssl ciphers HIGH

    EDH-RSA:DES-CBC-SHA:EDH-DES-CBC-SHA:DES-CBC-SHA:DES-CBC-MD5

    ```


    If you want to see more output about each cipher, you can supply -v as well:


