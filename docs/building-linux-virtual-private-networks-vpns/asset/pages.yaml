  md: '# Colophon


    On the cover of this book is an image of the River Clyde winding through the City
    Center of Glasgow, Scotland. Glasgow is the largest city in Scotland, and the
    third largest city in the United Kingdom. It is located in the Clyde Valley 64
    km west of Edinburgh, and is a short distance from lochs and mountains that provide
    some of the most beautiful countryside in Britain.


    Glasgow is home to half the population of Scotland, and is the country''s cultural
    capital. The city was officially founded in 1180, but its history can be traced
    back to the founding of a church in the sixth century.The name “Glasgow” is said
    to be derived from a Gaelic word meaning“dear green place.”


    Glasgow has a mixture of Medieval, Georgian, and Victorian architecture, the oldest
    remaining home being Provand''s Lordship, built in 1471. The pedestrian-friendly
    City Center is the main shopping and nightlife area, bordered by Tongate and the
    Merchant City to the East, motorways to the North and West, and the River Clyde
    to the South.


    This book was written using Microsoft Word, and laid out in QuarkXPress. The fonts
    used for the body text are Bembo and MCPdigital. It was printed on 50# Husky Offset
    Smooth paper at VonHoffman Graphics, Inc., in Owensville, Missouri. Prepress consisted
    of PostScript computer-to-plate technology (filmless process). The cover was printed
    at Moore Langen Printing in Terre Haute, Indiana, on Carolina, coated on one side.'
