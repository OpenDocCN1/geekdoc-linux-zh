  md: '# Running and Troubleshooting FreeS/WAN 195


    ping, traceroute, Telnet

    The same tools that you use to test normal network connectivity can be used to
    test your VPN as well. We''ve already used ping quite a bit, so we''ll not reiterate.

    tracer output can be very interesting the results would be drastically different.
    Without the VPN, your traceroute output would presumably show a number of hops
    (usually greater than five) between the endpoints of your VPN. For a host-host
    VPN, there should only be one hop: the other end of the VPN. For a network-network
    VPN, the only hops should be the hosts on the internal networks and the VPN gateways.
    This quickly shows you drastic, logical simplification of your network when using
    a VPN.

    Another very useful troubleshooting tool is plain-old Telnet. Because telnet is
    an unencrypted protocol (also known as unencrypted SSH), you can watch usernames
    and passwords and all keystrokes between one host and in cleartext.


    Note

    Although you now have this information at your disposal, we urge you to use the
    information ethically and not for malicious purposes such as forgery of identity
    or compromising private information.


    In the way that we sniffed the pings between hosts, sniff a Telnet session without
    and with the VPN. Without the VPN, you should be able to pick out username and
    password in the data portion of the packet. With the VPN, you shouldn''t be able
    to decipher anything. If this is the case, your VPN is doing its job.


    # Other IPSec Commands


    Thus far, we''ve only used a few of the interactive commands that are part of
    FreeS/WAN. Most of the other commands are useful in checking the running state
    of FreeS/WAN. Of particular interest are the following commands:


    ```

    # ipsec spi

    # ipsec tncfg

    # ipsec route

    # ipsec look

    ```


    spi is the interface for viewing and setting IPSec SA parameters. Get familiar
    with the (somewhat cryptic) output so that you know what the different fields
    mean. The man page ipsec_spi.8 details the information presented.

    trof is the interface for viewing and configuring running ipsecN -> ethN interface
    bindings. This can be helpful if your key exchange is successful but your VPN
    tunnel is failing. If this is the case, it''s probably due to the virtual ipsec
    interface being bound to the wrong physical network interface.

    eroute is the interface for viewing and setting the FreeS/WAN extended routing
    tables. FreeS/WAN must maintain its own routing table because it operates at a
    deeper'
