    the PMTU. PMTU discovery is not without its problems, and some of them might affect
    you from time to time. These issues and their possible fixes are discussed in
    greater detail in RFC 2923. For a more detailed discussion on how PMTU works in
    general, see RFCs 2923 and 1191.


    # SA Bundles


    Each SA can offer only the protection of one IPSec security protocol (that is,
    AH or ESP). Sometimes you might need to use several kinds of protection on the
    same traffic flow.


    To solve this problem, IPSec defines a mechanism for combining SAs. The mechanism
    is called SA bundles. Two methods can be used to combine SAs into bundles: transport
    adjacency and iterated tunneling. The names look fancy, but the concepts are actually
    quite simple.


    The transport adjacency enables you to use both AH and ESP to packets. The protection
    is added in Transport mode, and only one ordering is possible—the first header
    is IP, then AH, and then ESP. An example of a SAD with two SAs bundled together
    is shown in Table 5.2.


    Table 5.2 A SAD With Two SAs

    | SPI | Bundle | Sec IP | Dst IP | Protocol | Mode | Type | Entry |

    |---|---|---|---|---|---|---||

    | 280 | 1 | 192.168.1.5 | 192.168.2.1 | AH | Transport | Outbound | 1 |

    | 300 | 1 | 192.168.1.5 | 192.168.2.1 | ESP | Transport | Outbound | 1 |


    As you can see from the table, the SAs have different SPIs, but they both have
    the same source and destination addresses as well as the SA bundle number.


    The exact method for informing your IPSec implementation of your desire to bundle
    the two SAs shown here is implementation specific. For example, if you use FreeS/WAN,
    you can use the `ipsec spigrp` command to bundle or unbundle SAs.'
