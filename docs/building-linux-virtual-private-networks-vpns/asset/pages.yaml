    | Argument | Purpose |

    |---|---|

    | proxyarp | Add an entry to the ARP table (lookup of IP to ethernet-address)
    with the address of the peer. Can be used to make the other end appear to be on
    the local network to other machines. Optional. |

    | debug | Optionally used to allow increased debugging information. |

    | linkname name | The name of this PPP link connection from others. Also used
