    kernel. Type the following:


    ```

    # cd /usr/src/linux/arch/i386/boot

    # cp bImage/boot/vmlinuz-<linux version>

    ```


    This will copy the kernel to the /boot directory. It''s important to keep track
    of the

    kernel versions, hence the <linux version> appended to the kernel.

    Next, you need to edit the /etc/lilo.conf file to make LILO aware of the new

    kernel. Open the file and add the following lines:


    ```

    image=/vmlinuz-<linux version>

    label=linux-vpn

    read-only

    root=<insert from other entries>

    ```


    The root= parameter tells LILO which contains the root file system. This should

    be the same as any of the other root fields in the other entries. If it doesn''t

    appear in any of the other entries, don''t include it in the new entry.

    The other line you should change is the one that reads default=<kernel

    label>. Change this to read default=linux-vpn. This will make the new kernel boot

    by default.


    The final step is to execute the following command:


    ```

    # /sbin/lilo

    ```


    The output of this step should list the different kernels listed in the /etc/lilo.conf

    file. The linux-vpn should have a following asterisk, signifying the default kernel

