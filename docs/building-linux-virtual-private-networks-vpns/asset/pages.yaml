  md: '# How IPSec Works


    We will introduce you to IPSec using two examples that show IPSec in action. The
    examples are somewhat generalized, but they should at least give you the basic
    ideas needed to understand IPSec.


    The first example shows how an outbound IP packet is processed. The second example
    explains how an inbound IP packet is processed. If you see you are not familiar
    with,just try to understand the main idea. We will provide additional details
    following this section.


    # Outbound Traffic


    When your system (say, 192.168.1.1) needs to send an IP packet out to the network
    and you have IPSec turned on, the IPSec kernel module will see the packet and
    need to decide what to do with it. It can drop the packet, let it go through without
    applying IPSec protection, or protect the packet using IPSec.


    To determine exactly what to do with the outbound packet, IPSec checks its Security
    Policy Database (SPD) defined by a system administrator. The database rules tell
    IPSec what to do with packets. Table 5.1 shows an example of an SPD containing
    three rules:


    Table 5.1 An Example of an SPD


    | Rule | Src | Dst | Src | Dst | IPSec | Mode* | Outbound |

    | # | IP | IP | Port | Port | Action | Protocol* | --- | --- | SA Index |

    | 1 | 192.168.1.1 | 192.168.2.1 | Any | 80 | IPSec | AH | Tunnel | 400 |

    | 2 | 192.168.1.23 | 192.168.2.5 | Any | 22 | Accept | --- | --- | 8500 |

    | 3 | 192.168.1.99 | 192.168.2.1 | Any | Any | IPSec | ESP | Transport | 6025
    |


    > *These two fields can be omitted because they are present in the Security Association
    (SA) to which this SPD refers.


    According to the preceding SPD, if you are sending a packet to 192.168.2.1 with
    any source port and a destination port of 80, rule 1 will be applied. The rule
    says that the matching packet should be protected using the Authentication Header
    (AH) IPSec protocol that adds authentication, integrity protection, and replay
    protection but does not provide confidentiality (which is to say that it does
    not encrypt the data).


    Then next thing the IPSec module needs to determine what specific parameters should
    be used to protect the packet (keys, sequence numbers for replay'
