    # Specifying Cipher Suites


    SSL/TLS supports many encryption ciphers. The server and client will negotiate
    the strongest cipher they have in common automatically. OpenSSL creates a default
    list of ciphers in the preferred order when it is installed. To see this list,
    use the openssl command as follows:


    ```

    $ openssl ciphers

    EDH-RSA:DES-CBC-SHA:EDH-DES-CBC-SHA:SHA-DES-CBC-MD5:SHA-DES-CBC-MD5:DES-RC4-

    DH-RSA:DES-RC4-SHA:SHA:EXP1024-RC4-MD5:DES-RC2-MD5:RC4-MD5:RC4-64-

