  md: '# # Introduction


    This book is intended to be a practical reference for building virtual private
    networks (VPNs) on Linux. The book consists of three main parts. Part I describes
    the essential things you need to know about VPNs, such as choosing a VPN solution,
    common scenarios, and considerations. Part II and III focus on techniques and
    details of VPN packages. These sections should provide you with the information
    you need to get your VPN up and running as quickly as possible.


    The majority of the examples used in this book are based on actual working setups.
    If you follow our recommendations, you should be able to get your VPN to work
    quickly. If you are a beginner, you will find step-by-step instructions along
    with explanations of what is being done. If you already have experience, you can
    use this book as a reference to deploy a practical VPN solution as well as to
    find out possible issues, configurations, and so forth.


    This book assumes you are already familiar with the basics of networking and Linux.
    We try to explain underlying concepts where appropriate, but our primary focus
    is on VPNs. If you have not had any prior experience with networking or UNIX systems,
    we highly recommend that you familiarize yourself with the basics first to make
    the book serve you more effectively.


    # # Contents in Detail


    This book consists of 10 chapters categorized into three parts, plus three appendixes.
    The following paragraphs provide an overview of the contents of each section.


    Part I, "Virtual Private Networks," consists of two chapters. In Chapter 1, "Introduction
    to VPNs," you will learn what virtual private networks are, when you might want
    to use them, how you can benefit from them, as well as how you go about choosing
    a VPN solution that is right for you. Chapter 2,"VPN Fundamentals," gets more
    technical, explaining possible scenarios, elements you need to consider when building
    a VPN, routing, interaction with firewalls, and performance.


    Part II, "Implementing VPN Protocols," focuses on the standard protocols you can
    use for your VPN. Chapter 3,"Building a VPN with SSH and PPP," covers how to build
    a VPN using PPP over SSH. Chapter 4,"Building a VPN with SSL/TLS and PPP," Chapter
    5,"IPSec," deals with construction of a VPN using the popular IPSec protocol.
    Chapter 6,"FreeS/WAN," focuses on the Linux implementation of IPSec, FreeS/WAN,
    from a practical perspective. All of the chapters in this section concentrate
    on the essential things you need to know to successfully install, configure, and
    operate VPNs based on the protocols described. Chapter 7,"PPTP" covers the contents
    of the Point-to-Point Tunneling Protocol in implementing a VPN.'
  merge: -1
