    # Security Parameters Index (SPI)


    The SPI is a 32-bit index into the Security Association Database. When an IPSec
    packet comes, the SPI contained in the header of the packet, in combination with
    the packet''s destination IP and the security protocol (AH, ESP), uniquely identifies
    the SA to be used with that packet. The SPI can reside in both AH and ESP protocol
    headers of IPSec-protected packets.


    The set of SPI values 1 through 255 is reserved by IANA for future use. The SPI
    of 0 is reserved for local use and must not be used in the packets that are sent
    out.


    # IPSec Key Exchange and Management Protocols


    The preceding sections descried Security Associations and Security Policy Databases.
    These databases can be set up either manually or automatically. If you want it
    to be done automatically, you will need to use key exchange and management protocols
    embedded in your IPSec solution. This section will describe such protocols.


    # IKE, Photoris, and SKIP


    IKE is the protocol that combines elements, definitions, and functionalities from
    such protocols as ISAKMP, SKEME, and Oakley to exchange and manage keys as well
    as SAs.


    The Internet Security Association and Key Management Protocol (ISAKMP, RFC2408)
    defines a general framework for establishing and managing Security Associations
    between peers that want to communicate securely. ISAKMP is quite abstract, so
    to use it with IPSec, a domain of interpretation (DOI) had to be defined (see
    RFC 2407).


    The Internet Key Exchange Protocol (IKE) uses the ISAKMP framework to exchange
    keys and establish SAs. As previously mentioned, in addition to using ISAKMP,
    IKE takes advantage of other concepts and protocols as well. For instance, IKE
    uses the Oakley key determination protocol (see RFC 2412) as well as SKEME for
    key exchange.


    IKE, ISAKMP, SKEME, and Oakley have their alternatives. One of them is Photoris.
    It has been used in the OpenBSD IPSec implementation in addition to IKE. SKIP
    is another alternative, but it is not widely implemented.


    In this section, we will focus on IKE and its fundamental principles.'
