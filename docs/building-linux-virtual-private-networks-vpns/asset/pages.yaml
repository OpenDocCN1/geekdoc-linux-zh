  md: 'and a VPN server. Each has its pros and cons, and we''ll do our best to help
    you pick the option that makes sense for you.


    # VPN Server on a Firewall


    The solution that feels most natural is to install your VPN software on your firewall
    itself. Many commercial firewalls include VPN components as an extra option. If
    you are working in a mixed commercial and freeware VPN environment, you will likely
    end up supporting this configuration.


    As seen in Figure 2.4, we have a single point of entry into our network, which
    serves three purposes:


    +   * The firewall allows outbound access to the Internet.

    * The firewall prevents inbound access from the Internet.

    * The VPN service encrypts traffic to remote clients or networks.


    ![](img/ac8d70f99c3fa1e7029fbd036fc254da_62_0.png)


    Figure 2.4 The VPN server on a firewall.


    The pros of putting your VPN on your firewall are as follows:


    +   * You have one place controlling all your security, meaning fewer machines
    to manage.

    * You can create firewall rules that apply to your VPN traffic using the same
    tools you already use to manage your firewall.


    The cons of putting your VPN on your firewall are as follows:


    +   * You have one place controlling all your security.You''d better make sure
    this machine is extremely secure.'
