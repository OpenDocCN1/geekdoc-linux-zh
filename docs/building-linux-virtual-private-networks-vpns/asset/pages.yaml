    the server. If a server has configured a tunnel for options that the client cannot
    support, there is no “fallback” support for a less secure connection. The tunnel
    simply fails to connect. Ideally, the vtdam of the tunnel are configured and built
    identically so that there can be no capabilities mismatch.


    # IP Tunnel Configuration


    This section will cover an implementation of an IP tunnel (that is, a tunnel that
    supports IP traffic). We will build VPN using the network introduced earlier in
    the book. Our goal will be to create a tunnel between the private networks 192.168.1.0/24
    and 192.168.2.0/24. Additionally, we will also configure our VPN to use Blowfish
    encryption and compression. The VPN that will be configured is illustrated in
    Figure 8.3.'
