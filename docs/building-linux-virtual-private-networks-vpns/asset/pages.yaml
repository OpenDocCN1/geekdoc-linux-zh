  md: '# Making VPNs Secure 25


    # Key Generation


    To ensure confidentiality and authentication, keys must be generated in a correct
    manner. Some cryptystems are vulnerable to cryptanalysis attacks because keys
    are not generated in such a way as to make them secure and not easily discardable.
    VPN relays on the underlying cryptystem, the implementor(s) must be knowledgeable
    about the underlying cryptystem being used so that they can effectively implement
    the VPN.


    This recently became an issue with the commonly used OpenSSL libraries. It was
    discovered that, previous to OpenSSL 0.9kh, the pseudorandom number generator
    in the OpenSSL package did not generate enough entropy when generating numbers
    for keys. This made it easier for a cracker, with access to the right resources,
    to guess the keys and subvert the cryptystem. This problem was resolved in the
    OpenSSL 0.9kh release, but what if your VPN had keys generated by one of the older
    versions, and you did not upgrade OpenSSL? You might be vulnerable to an attack
    that exploits this vulnerability.


    Be sure your keys are generated using a robust mechanism. In addition, it is good
    practice to change your keys frequently, with the change interval depending on
    the cryptystem you''re using. Depending on your requirements, you might need to
    change keys daily, once per month, or never. It is difficult to say, exactly,
    what this interval should be; if you are connecting to many hosts via a VPN, replacing
    keys could become very time-consuming and therefore costly. On the other hand,
    if you have only a few keys on a VPN, keys can be changed quickly and easily.
    Weigh all the factors of key management behavior before selecting a VPN solution.


    # Distributing Keys Securely


    Because both ends of a VPN link need a key(s) to encrypt and decrypt data, the
    keys must be transmitted between sites securely. If transmitted manually, it can
    easily take an hour or two to implement the new keys and test the configuration.
    This process is made easier by using commonly used privacy protocols such as PGP
    or PKI.


    If your VPN uses a public-key system, you will need two pairs of keys. This becomes
    another area of concern because a third party is needed to establish trust of
    the keys. How is the third party controlled? Where are the keys stored? What happens
    if a private key is compromised? Be sure that the third-party certifying authority
    operates at a higher security level than than the VPN itself. If not, the public-key
    trust model becomes lopsided.


    # Are You Sure It''s Working?


    In this ever-complex world of information technology, we must constantly rely
    on assumptions. We assume that everything is working between us and our email
    servers, and we very rarely check to see that it''s actually working as we expect.
    What if you see'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'up your VPN and assume it''s working and then later find out that it hasn''t
    been doing a darn thing?

    VPN is one of those things you don''t want to make assumptions about. Make sure
    your VPN is working by sniffing the outbound connection once in a while to make
    sure it''s encrypting the communication stream. Also try breaking the authentication
    mechanism so often to ensure that it''s actually checking users'' credentials.
    Try to authenticate using invalid credentials and see if it rejects you.


    # What VPNs Do Not Secure


    Information security is not a single-sided issue. Good security involves many
    layers and protections. A VPN is only one of those, and even with a VPN, your
    infrastructure could still be vulnerable.

    As stated earlier in this chapter, laptops are a common oversight when it comes
    to computer security. Employees carry proprietary information all over the world,
    many times without any security safeguards. The laptop could be stolen, or it
    be hacked while connected to the Internet through an ISP, regardless of whether
    the employee is using a VPN connection or not. A VPN cannot protect people from
    these threats. However, a VPN combined with a host-based firewall could prevent
    the laptop from being hacked, and some commercial VPN software includes this firewall.

    What about attempts from within your organization? As stated earlier, the annual
    CSI/FBI survey shows that, on average, almost half of hacking attempts originate
    from the organization, where restrictions and auditing are usually lax. When using
    a VPN, your network trust domain automatically becomes larger than before. Do
    you trust the security of the remote networks? A successful hack of a remote network
    could result in your own network being cracked.

    It is important to understand what a VPN protects and what it does not. Failing
    to do so could result in a breach of security.


    # Making the Decision On Using a VPN


    Sometimes it is appropriate to use a VPN, and sometimes it isn''t. This section
    will discuss some different situations to help you decide whether a VPN is right
    for your application.


    # When to Use a VPN


    Everything has its time and place, and VPNs are no exception. It can take time
    and cost to install a VPN, so you need to be sure that the VPN addresses a specific
    business need and that it''s more effective than the alternatives.

    If you need a significant number of resources secured between multiple networks
    and the privacy of the information those networks is at issue, a VPN can be'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# Making the Decision Using a VPN


    a good choice. That''s the beauty of a VPN. With one sweep, you can secure net-works
    from the outside world.


    If you need hosts to appear as though they''re on the same network, a VPN is the
    way to go. This can really come in handy when you have mobile clients that need
    transparent access back to headquarters or if you want to have full and secure
    access to your home network. Why bother with all the fuss of multiple IP address
    spaces? Why change your infrastructure if you change service providers? If you''re
    using a VPN, all you''ll need to change is the gateway configuration.


    If all the hosts on your different intranets operate at the same trust level,
    why should they be on different networks? Of course, there might be glaring conventional
    or technical reasons, but a VPN can make it seem as everyone''s on the same network.
    If everyone needs access to the MS Windows shares or other intranet resources,
    you can address this need with a VPN without opening your network to IP spoofing
    and session hijacking attacks.


    # When Not to Use a VPN


    Simple measures need simple means. If you only want to secure one protocol or
    service between a couple of hosts, do really want to spend all the time setting
    up a VPN? To some, the answer is undoubtedly yes, but to those who have specific
    justification justifying their rationale, this doesn''t necessarily equate to
    a cost-efficient use of resources.


    There are much easier ways to secure a protocol or two than a VPN. The most common
    way of doing this is to use freely available tunneling software that can tunnel
    one port to another through an encrypted and authenticated pipe. SSH can do this,
    as a program can tunnel. These things are a cinch to set up, requiring less than
    an hour from start to finish.


    Setting up a secure tunnel is really, really simple. Here''s a quick how-to:


    +   1. Let''s say you''re running a VNC server on your web server for remote administration.
    VNC is insecure in and of itself, so you you want to set up a secure pipe between
    your workstation and the web server.

    2. Using tunnel, you type the following commands:

    ```

    server tunnel -d 4000 -r localhost:5900

    client tunnel -c -d 127.0.2:5900 -r server:4000

    client vnc 127.2

    ```


    And there you have it! A secure pipe for VNC. Painless, no?

    Another reason you might not want to set up a VPN is if you''re thinking about
    connecting networks of different trust levels. That''s like a military organization
    connecting a top-secret network to an unclassified one. You would actually be
    making your network less secure by doing this because the users operating at the
    lower trust'
