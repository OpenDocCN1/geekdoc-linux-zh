  md: '# Limitations


    In our opinion, the major limitation of CIPE is its level of usability. CIPE is
    a great tool to play with, especially if you are a geek; however, there''s quite
    a bit of work involved, and it''s not a very friendly option for those who are
    new to Linux.


    Another limitation is that CIPE only implements two symmetric algorithms, of which
    one is patented. This effectively leaves a broader user base without a great deal
    of choice. If the CIPE authors added support for more ciphers, such as the new
    AES (Rijndael), 3DES, and so on, it would make the package much more appealing
    to the broadest audience.


    Yet another important limitation that CIPE has is its documentation. Unfortunately,
    CIPE''s documentation is very scarce and does not provide nearly as much information
    as many users would need to successfully troubleshoot and use it. The documentation
    clearly lacks examples. In particular, there is almost nothing available on using
    CIPE protocol version 4 in a bridging mode.


    CIPE is also limited in that it does not provide any performance evaluation in
    the documentation. Although CIPE seems to be lightweight and not very resource
    consuming, qualitative performance measurement is important. We feel that this
    fact, as well as the fact that CIPE''s overall security has not been carefully
    evaluated by a broadly qualified base of professionals, might limit CIPE''s acceptance.


    # Summary


    Overall, we believe that CIPE is a valuable package that can be successfully used
    to build VPNs under Linux. Whether it is going to be your ultimate solution or
    not, it is definitely worth trying.'
