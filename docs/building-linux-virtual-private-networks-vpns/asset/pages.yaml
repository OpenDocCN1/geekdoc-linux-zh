  md: '# Underlying Transport


    The beauty of a VPN is that it uses the network connection you already have.VPN
    technologies utilize the TCP/IP protocol that holds the Internet together. A secure
    packet is built by one VPN device, and then the VPN device sends the packet to
    another VPN device using the underlying transport mechanism. Thus, you can stick
    a VPN device anywhere on your network or anywhere on the Internet. This equates
    to savings, as we''ll discuss in the next section.


    # Why Use a VPN?


    Okay, we now have some idea of what a VPN is now. The question becomes, why we
    would want to use it? This section provides you with a number of clear reasons
    as to why you might want to implement a VPN.


    # Savings


    Using a VPN is an inexpensive way to connect physically distinct networks together.
    Because the Internet carries the traffic between these networks, it is unnecessary
    to pay for dedicated WAN links.


    # Central Office


    The root of the feelings of "security" with dedicated WAN links, be they be satellite,
    long-haul Plesiochronous Digital Hierarchy (PDH), or Synchronous Digital Hierarchy
    (SDH) links, lay in the physical security of the Central Offices (COs) that house
    them. Every CO is physically secured and usually is monitored in some way by the
    carrier that owns the space in which it lies. In the case of copper or fiber links,
    it is unlikely that an attacker would be determined (or savvy) enough to vampire-tap
    the link to extracting data. It is not unlikely, however, that a determined attacker
    would be able to collect meaningful data over time without being detected. This
    is particularly true if the attacker makes the attempt on an intermediate telephone
    pole, or junction. Even with the purchasing organization being equal, the security
    offered by a VPN can be of greater value than those WAN links commonly referred
    to as "private" or "leased" lines.


    To demonstrate, consider the following. The fictitious company Exemplify Technologies,
    has offices across the world: one in Washington D.C., one in Munich, and one in
    Tokyo. The company executives decided that information is too scattered among
    these offices and consolidation is desperately needed. Also, a report from an
    efficiency consultant stated that employees were spending too much time tracking
    down information and connecting to the scattered resources. So, the edict from
    high is to consolidate information and resources while making access to that information
    transparent to the end user. This can be quite a formidable task.


    Using a VPN, the company resources can be easily consolidated and used more efficiently.
    Because the VPN can operate over the Internet, there won''t be high'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'equipment or leased-line costs can easily drive costs into the hundreds of
    thousands of dollars, which can be a difficult expense to justify.


    # Transparency


    Here are some big questions when deciding whether or not to implement a new piece
    of software or hardware: How difficult will it be to train our users on this new
    stuff? How long will it take? How much will all the training and migration cost?
    Unfortunately, the answers to these questions are guesses at best.


    One of the main advantages of VPNs is the transparency by which they operate.
    This means that users do not need to be trained on how to use the VPN: It just
    happens. In addition, software does not need to be modified to use the VPN. The
    software will operate the same as it always has. This equates to not needing to
    upgrade or replace the software in which you''ve already invested.


    # Security


    Prior to the release of the Morris worm in 1988, concerns regarding computer security
    had not yet been evin in practical application. Tens of thousands of hosts were
    connected to the then-Internet, mostly in research institutions, large companies,
    and the government. Robert Morris released the Internet worm—the first known computer
    virus—it infected many of these interconnected hosts. Since then, the study of
    computer security has developed so much that while conferences are devoted to
    it, universities are developing programs that deal specifically with the topic,
    the government is subsidizing college-level computer security coursework and books
    like this are being written.


    A major advantage of a VPN is being able to secure multiple communication streams
    through a single mechanism. Over the VPN connection, web, email, file transfers,
    Internet-based videoconferencing, and any other traffic that uses TCP/IP for transport
    is secured from prying eyes. More specifically, the traffic is cryptographically
    secured and indecipherable to unintended recipients.


    From a business perspective, a VPN is an extremely cheap and quick to secure secure
    communications between two endpoints. Otherwise, each protocol would need to be
    secured individually, which could be costly and time consuming each service would
    need to be replaced or heavily modified.


    Keep in mind that the VPN does not secure all Internet traffic, only that which
    flows over the VPN link. The security that a VPN provides only protects what it
    carries, and it only protects it within the bounds of the VPN. Basically, the
    traffic from one device to another VPN device is protected, but it isn''t protected
    anywhere else (unless, of course, you''ve protected it through another mechanism).'
