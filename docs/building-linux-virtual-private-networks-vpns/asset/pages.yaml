  md: '# 276 Chapter 9 ClPe


    How does CIPE remedy this situation? Two basic scenarios are described here.

    The first scenario takes places when one side has a static IP address and the
    other a dynamic one. In this scenario, the static IP side must simply set its
    peer address to 0.0.0.0 and set the maxerr opt to -1. The latter prevents CIPE
    from exiting when it determines that it is not able to connect to the dummy address
    of the peer. A sample server (static IP) side configuration is given here:


    ```

    ptpaddr 10.1.2.1

    ipaddr 10.1.1.1

    me self.sandybeach.com:9999

    peer 0.0.0.0:9999

    maxerr -1

    key 3248df20adf9c00ccf9ecc2393bbb3e4

    ```


    On the dynamic IP side, the configuration looks as follows:


    ```

    ptpaddr 10.1.1.1

    ipaddr 10.1.2.1

    me 0.0.0.0:9999

    dynip 1

    peer self.sandybeach.com:9999

    ping 60

    maxerr 3

    key 3248df20adf9c00ccf9ecc2393bbb3e4

    ```


    Note that two additional options were added to the dynamic IP side: dynip and
    ping. The dynip option is needed for the c on the dynamic IP side to be able to
    register IP address changes. The ping option tells the dynamic side to contact
    the other immediately after determining its own current dynamic IP address.

    Let''s set out and look at how both sides interact.

    The static IP side waits for UDP packets on the port 9999. The dynamic IP side
    sends a UDP packet from the current IP to the static IP side, port 9999. The dynamic
    IP side makes three attempts (specified by the maxerr option), and if all three
    are unsuccessful, it exits. Keep in mind that the static IP side might be behind
    a firewall or SOCKS5 proxy, and that should still work fine.

    The second scenario takes place when both sides have dynamic IP addresses. Obviously,
    one of the sides has to tell the other IP address to break the loop. This can
    be achieved by using a dynamic DNS service, as Dynip or DNS2GO, to associate a
    domain name with a dynamic IP address. Thus, this scenario will be similar to
    the static-dynamic one previously described. The only difference is that the side
    would actually use a static domain name, not IP. This is the side with dynamic
    IP and a static domain:


    ```

    ptpaddr 10.1.2.1

    ipaddr 10.1.1.1

    me sb.dynip.com:9999

    peer 0.0.0.0:9999

    maxerr -1

    key 3248df20adf9c00ccf9ecc2393bbb3e4

    ```'
