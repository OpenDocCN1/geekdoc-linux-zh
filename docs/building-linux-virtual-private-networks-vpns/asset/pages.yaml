  md: 'Fragmentation parameters (Path MTU).


    +   The largest MTU on the path between two IPSec peers. The PMTU is usually discovered
    by probing. The probing begins by sending the largest packet allowed by the maximum
    transfer unit (MTU) on the first link with the DF (do not) bit set


    The first router on the path that needs to fragment the packet will send an ICMP
    destination unreachable with option code 4 (fragmentation needed and DF set) response
