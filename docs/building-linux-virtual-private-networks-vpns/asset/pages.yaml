- img_proc: true
  md: '# Setting up PPP SSH Manually


    Sudo is a versatile program that enables users to run a restricted set of commands
    as root. We will be creating a very simple set of rules that will enable us to
    run the pppd command.


    Sudo can be found at www.courtesan.com/sudo/. It is included with many Linux distributions
    as well, so you might not need to compile it.


    After Sudo is installed, run the visudo command to edit /etc/sudoers file. Do
    not edit this file manually (without using visudo) or you run the risk of corrupting
    it! Add the following lines to the end of the file:


    ```

    Cmd_Alias VPN=/usr/bin/pppd

    sshvpn   ALL=NOPASSWD: VPN

    ```


    Replace the path for /usr/bin/pppd if it is in a different location for your system.
    Also, replace sshvpn in the second line with the dummy user you have created for
    the SSH VPN if you picked something different. When finished, simply write your
    changes and exit editor.


    The preceding lines will allow the sshvpn to run the command /usr/bin/pppd with
    any arguments. Because of the NOPASSWD entry, the user will not be required to
    enter his password before being granted access to our programs. Because we need
    these commands to be executed automatically from our scripts, it would be impossible
    to enter a password.


    To test this, simply type the following on both the client and server machines:


    ```

    root@machine# su - sshvpn

    sshvpn@machine$ sudo /usr/bin/pppd noauth

    -y)#A!1]i! j4)}} & )) 3) (more gobheldydog continues....)

    ```


    The funny characters are the result of pppd attempting to handshake with your
    terminal. Jump to another window and killall -HUP pppd to stop the pppd process.


    If you have not set up the sudoers file correctly, you will be asked to enter
    your password.Verify your syntax in the sudoers file. Again, make sure you are
    using the visudo program and not editing /etc/sudoers manually.


    # Set Up PPP


    We need to run pppd on both hosts. Table 3.1 provides a list of useful pppd arguments.


    Table 3.1 pppd Arguments


    | Argument | Purpose |

    |---|---|

    | updetach | Once the connection is established, pppd detach from its tty and
    become a daemon (child of init). |

    | nodetach | Don''t detach from your tty. Useful for debugging. |


    continues'
