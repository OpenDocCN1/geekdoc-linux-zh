    # pkcipe-Based Configuration


    This section will explain how to set up configuration files used by pkcipe. You
    will also learn how to generate public keys and start pkcipe up both automatically
    and manually.


    # Setting up Host Keys and Identities


    As you remember, pkcipe makes it possible for a network administrator to avoid
    manually setting shared keys on both sides of a CIPE link via /etc/ccipe/options.

    The pkcipe utility uses Diffie-Hellman key exchange and public-key cryptography
    to verify the other side''s identity and negotiate a secret key. After the secret
    key has been negotiated, CIPE creates a temporary configuration file for ciped
    in /var/run/ccipe and executes ciped with that configuration file.'
