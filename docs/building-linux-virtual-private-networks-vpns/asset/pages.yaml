  md: '# Chapter 8 Using VTun


    3. Configure the VTun build.

    Paths for libraries and other features used by VTun are enabled by the use of
    the

    configure script included with the VTun package. Several options supported

    from the command line will allow a more flexible build of VTun. Running

    ./configure with these options produces the results listed in Table 8.2.


    Table 8.2 Options and Results from the configure Script

    | Option | Result |

    |---|---|

    | --disable-shaper | Disables traffic shaper support |

    | --disable-ssl | Disables support for SSL |

    | --disable-zlib | Disables support for compression over TCP tunnels |

    | --disable-lzo | Disable support for compression over UDP tunnels |

    | --with-ssl-headers | Enables you to specify the location of the SSL header files
    |

    | --with-ssl-libs | Enables you to specify the location of the SSL libraries |

    | --with-lzo-headers | Enables you to specify the location of the LZO header files
    |

    | --with-lzo-libs | Enables you to specify the location of the LZO library files
    |

    | --bindir=directory | Enables you to specify the location of the files when they
    are installed |


    If no command-line options are specified, configure will attempt to guess system
    settings and generate a Makefile based on its findings. If configure is unable

    to find required libraries, you will need to use the command-line options to

    specify the locations.


    4. Once configure has been executed and a Makefile has been generated, the

    command is used to build the vtund binary.


    ```

    make

    ```


    5. Install the software.

    Once the make command has finished building vtund, make install is used

    to install the compiled binaries into either the default directory /usr/local/sbin

    or the directory specified by the -bindir command-line option for configure.


    ```

    make install

    ```


    Now VTun should be completely installed. By default, it is installed in

    /usr/local/sbin.'
