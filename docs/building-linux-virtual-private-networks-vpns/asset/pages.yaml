    # ## Setting Up Sudo


    The pppd program, which is used to establish the network link between our VPN
    hosts, can only be run by the root user. Because we want to run our VPN scripts
    on both ends as a dummy user, we need a way to gain root privileges to run this
    program.


    Sudo is a versatile program that allows users to run a restricted set of commands
    as root. We will be creating a very simple set of rules that will enable us to
    run the pppd command.


    Sudo can be found at www.courtesan.com/sudo/. It is included with many Linux distributions
    as well, so you might not need to compile it.


    After Sudo is installed, run the visudo command to edit the /etc/sudoers file.
    Do not edit this file manually (without using visudo) or you run the risk of corrupting
    it! Add the following lines to the end of the file:


    ```

    Cmnd_Alias SSLVPN=/usr/bin/pppd

    sslvpn ALL=(NOPASSWD: SSLVPN

    ```'
