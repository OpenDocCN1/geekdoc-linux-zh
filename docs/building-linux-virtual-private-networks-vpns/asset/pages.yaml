    # tinc-up and tinc-down Scripts


    For peers in the sample scenario, you can skip tinc-down and use only tinc-up.
    The contents of a /etc/tinc/shattuck/tinc-up script on kitaro are given here:


    ```

    #!/bin/sh

    # bring interface down first

    ifconfig tap0 down


    # required by tinc

    # sets up tap0 MAC address to a special value

    # to ensure that tinc tunneling works

    ifconfig tap0 hw ether fe:fd:00:00:00:00:00


    # tinc interface''s IP address

    ifconfig tap0 192.168.1.1 netmask 255.255.255.255


    # make sure you have this line to disable ARP on

    # the tinc interface

    ifconfig tap0 -arp

    ```


    > Note

    If you are using the TUN/TAP driver, do not forget to replace with $NETNAME.


    To create tinc-up for banc, use the same file as kitaro. The only difference is
    that you will need to change the IP address specified on line 11 from 192.168.1.1
    to 192.168.1.20.


    # Adding Firewall Rules


    It is fairly common to create all configuration files and forget to enable packets
    to and from the tunneling interface. If you have already configured your tinc
    VPN but do not see responses when pinging the opposite side of the tunneling interface,
    one possible cause might be your firewall rules. We will describe how to check
    for this problem and modify the existing firewall rules to support tinc.


    Be aware that some firewalls along the path from one of your peers to the other
    might filter tinc traffic. If you have tried everything and still do not see tinc
    packets going through, we recommend that you select a different port number by
    using the Port option in the host configuration file.'
