  md: '# Glossary


    **Access Control List (ACL)** A set of data associated with a resource that defines
    entities that are allowed or denied access to the resource.


    **Advanced Encryption Standard (AES)** Rijndael A new symmetric cipher officially
    selected by NIST to replace DES. The cipher supports 128-, 192-, and 256-bit keys
    with varying block sizes.


    **asymmetric/public-key cipher** A cryptographic algorithm that uses different
    keys for encryption and decryption. The algorithm uses a keypair that consists
    of a private and a public key so that it is computationally infeasible to derive
    a public key from a private one.


    **authentication** The action of verifying information such as an identity, a
    credential, or ownership of something.


    **Authentication Header (AH)** The part of the IPSec protocol suite that provides
    authentication service to IP packets.


    **Authoritative** Can be used to describe either type of a DNS server or a response
    to a DNS query. An authoritative DNS server contains a “master” copy of a DNS
    zone that is generated based on the local configuration, possibly with the help
    of another name server. Authoritative response is the response from an authoritative
    DNS server.


    **authorization** The act of determining what an entity is allowed to do or have
    access to; this usually occurs after authentication and relies on it.


    ![](img/ac8d70f99c3fa1e7029fbd036fc254da_376_0.png)'
  merge: -1
  pgno: 376
- img_proc: true
  md: '# Appendix C Glossary


    A trusted entity whose credentials (a private key, for example) are used to bind
    the identity of a person to data, such as the person''s public key.


    Classless Inter-Domain Routing (CIDR) Allows the IP address space to be divided
    into portions of variable length, different from /8, /16, or /24 (class A, B,
    and C respectively). For example, if you have a small network that consists of
    10 hosts, without CIDR you would have to request either /24, /16, or /8 networks,
    all of which have much more addresses than you need. In contrast, you can simply
    use /28 (2**8 bits to define network), which will give you 2**(32-28)-2=14 addresses.


    Certificate Encrypted plaintext.


    Collision Domain Represents an area of an Ethernet''s CSMA/CD network in which
    data sent from/to a connected network device may collide with other network devices.


    Customer Premiere (or Provided) Equipment (CPE) Usually refers to a subscriber
    who should have in order to make use of telecommunications. Common types of CPE
    include telephones, modems, routers, and PCs.


    digital certificate Used to bind a private key to an identity by signing with
    a third party key (see Certificate Authority). In practice, a digital certificate
    can be a block of data DER encoded ASN.1 representations of an identity, the public
    key associated with the identity, the certificate''s validity, the certificate''s
    issuer, and additional information.


    ESP (Encapsulating Security Payload) The part of the IPSec protocol suite provides
    confidentiality and authentication services to IP packets.


    hash or message digest A one-way function that generates a digest based on an
    arbitrary block of data. The digest is typically 128 (MD5) or 160 (SHA-1) bits.
    One of the important properties of the hash function is that it should minimize
    collisions (that is, when different blocks of data result in the same digest).


    Hash-based Message Authentication Code (HMAC) A Message Authentication Code uses
    cryptographic hash functions, for example, MD5, MD4, SHA-1 and so on. Also see
    authentication code (MAC).


    integrity A property that guarantees that data has not been tampered with. kernel
    modules Code that can be added to the kernel without stopping or restarting a
    system. Examples include modules to support different file systems, device drivers,
    and so on. Modules usually have a .o extension. You can list, add, and remove
    modules using the modulus package (make sure it is installed). For instance, you
    can get a list of installed modules using lsmod(8), install a new module using
    insmod(8) or modprobe(8), and remove the module using rmod(8).


    Major/Minor number On Unix systems, devices usually have associated major and
    minor numbers. The major number identifies the type of a device. The minor number
    is used to distinguish devices of the same type.'
  merge: -1
  pgno: 377
- img_proc: true
  md: '# Glossary 361


    Message Authentication Code (MAC) A hash that also depends on a key. The key is
    required to verify the hash.


    Message Digest Algorithm (MD5) One-way cryptographic hash function generating
    128-bit message digests.


    .NET Microsoft''s initiative to provide comprehensive web services through a collection
    of scripting, user management, and e-commerce tools.


    nonrepudiation Prevents users from denying the actions they have performed. Examples
    include real senders unable to deny that a message was sent by them or real receivers
    unable to deny that the message was received by them.


    OpenSSL An open-source library implementing secure socket layer (SSL)/transport
    layer security (TLS) protocols as a full-strength crypto library providing access
    to a number of ciphers, hashes, encoding routines, and so on.


    Pipe A colloquial term referring to the abstract concept of a direct logical connection
    between entities (for example, devices, processes).


    plaintext Unencrypted data.


    Pre-Shared Key (PSK) The secret that parties may need to share in order to communicate
    securely.


    Public-Key Cryptography Standards (PKCS) A series of documents published by RSA
    Data Security to accelerate the development of public-key cryptography applications.
    The documents describe entities related to public-key cryptography applications,
    such as protocols, message formats, and so on. For instance, PKCS#1, #2, and #4
    describe RSA; PKCS#3 describes Diffie-Hellman key agreement; PKCS#7 describes
    general syntax for cryptography applied to it (such as digital signatures and
    envelopes). See www.rsasecurity.com/rsalabs/pkcs/ for the detailed list.


    Public-Key Infrastructure (PKI) A system designed to solve the public-key management
    problem by reliably and securely distributing, binding to identities, and revoking
    public keys.


    runlevel A system state that allows only a selected group of processes to run.
    The details of each state are defined in the configuration file of init(1) (often
    it is /etc/initab). Examples: Switching to level 0 leads to a system being halted,
    level 1 is single-user mode, level 3 is a multitask mode at which most systems
    typically run, and level 6 is rebooting. You can change levels on Linux using
    telinit(1) by running it as a superuser. If you changed init''s configuration
    file, don''t forget to run telinit q to make sure init reads the file.


    Secure Hashing Algorithm (SHA-1) One-way cryptographic hash function generating
    160-bit message digests.


    segment An abstract part of a network, defining a continuous part of a network
    not interrupted by a network device that changes the protocol properties of that
    network. Usually used when referring to LANs.


    shared key A key used by a symmetric cipher to encrypt or decrypt data (also called
    a symmetric or private key).'
