    useful when you want to add log entries, reconfigure devices, add firewall rules
    to divert traffic, and so on.


    # Configuring tinc


    At this point, we will assume you have performed all the necessary installations,
    in particular installing packages and creating directories and device files. If
    you have not yet done so, read the previous sections.

    For simplicity, our configuration will be based on the following scenario:


    +   1. You need to connect your host to a VPN called `shattuck`.

    2. The name of your host is `kitaro`, in the earlier example, and the name of
    the host you are connecting to is `bancroft`.

    3. You have a simple VPN consisting of only two hosts. The network address of
    the VPN is 192.168.1.0/24. The real IP address of the `kitaro` host is 172.166.1.1,
    and the real IP address of the `bancroft` host is 172.162.20.1.


