    # Real Testing


    To really test routing for the tunnels has been done correctly, the remote address
    on 192.168.1.0

    network should not be the IP of the Vtun server. if either side of the tunnel
    is able to ping the remote

    PPP interface, it will also be able to ping every interface on the Vtun machine.
    To truly test routing,

    reachability testing should be done to machines behind the Vtun server.


    # Pipe Tunnel Example


    For this example the goal is to securely transfer logs to another server, where

    they will be archived. Because security is a concern, we will use Vtun to encrypt
    the

    traffic to keep unwanted third parties from viewing the log files. The log file
    server

    where logs are archived by the Vtun server.Vtun clients will be the machines

    sending the log files.


    The first step with pipe tunnels is deciding which program to use to transfer
    the

    information across. If we are archiving log files on the same machine, we would

    possibly use the tar or cp command to create the backups. As an example, if we

    want to create a tar archive of all the files in the /var/log/ directory, we would
    type

    the following:


    ```

    tar -cvf log_backup.tar /var/log/*

    ```


    This would create a tar archive named log_backup.tar.

    Once we have decided on the command to use, we need to break the command

    unto a client and server section. For example, the chent section will create the

    out; the server section will store the output. Note that the client and server
    roles

    can be reversed—the server can produce the output, the client can receive it.
    It

    dep on how you configure your solution.


    To redirect tar''s output to the screen, use the f - option. The '' option gives
    tar

    the name of the file to store the archive in. The - option passes standard out
    as the

    filename to use. We can use a redirect, or a >, to send the output of the tar
    com-

    mand to a file.


    ```

    tar -cvf - /var/log/* > backup.tar

    ```'
