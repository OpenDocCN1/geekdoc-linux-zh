  md: '+   **IPF**. A Linux packet filter for 2.0 kernels. If you are still using
    a 2.2 kernel, you should really need upgrade.


    +   **IPChains**. The Linux packet filter for 2.2 kernels. Though it is a simple
    packet filter, you can support some protocols via kernel modules. The ip_masq_ftp
    module enables you to support the FTP protocol, for example. The problem with
    IPChains is that the kernel packet filters are handled by the modules see packets,
    meaning you must allow inbound access to ports that potentially be required by
    the kernel modules.


    +   **IPTables**. The Linux firewall software for 2.4 kernels, also known as Netfilter.
    IPTables supports both packet filtering and application gateway support together.
    Taking the FTP protocol as our example, the data channels that are used are accepted
    as RELATED packets. This makes your firewall much cleaner because you do not need
    to leave holes in your firewall for packets that might or not be used by modules.


    +   **IPFilter**. Created by Darren Reed, IPFilter is the default kernel packet
    filter of NetBSD and FreeBSD, and it runs on many other UNIX-like systems. IPFilter
    only runs on the old Linux 2.0 kernels, so if you want to use IPFilter, we suggest
    that you use a BSD machine instead. It is available at http://cooms.anu.au/~avalon/.


    Note

    Darren Reed modified the IPFilter license (or clarified, depending on your position)
    to deny modifications to the source, rendering it not completely open source.
    Because of this, it was removed from OpenBSD. Reed later allowed modifications
    used as part of NetBSD and FreeBSD. OpenBSD is creating a new packet filter, PF,
    from scratch to replace IPFilter. Yes, now and then there both be strife in the
    open-source community...


    +   **Dante**. Though normally included as part of a larger commercial firewall
    system, Dante is available as open source under a BSD-style license. It is a circuit-level
    firewall/proxy that is largely transparent to users. It is available at www.inet.net/dante/.


    +   **T.REX**. Open sourced in April 2000,T.REX is a sophisticated application
    gateway firewall that includes intrusion-detection features, strong authentication
    support, and extensive logging.Version 2 of T.REX was not yet available at the
    time this was written; though precompiled versions are available on CD.You can
