    |

    | noauth | Do not require any PPP authentication. This is a perfectly acceptable
    level of security because we have SSH validation of both endpoints. Incompatible
    with require-pap and require-chap. |

    | require-pap | Require PAP authentication of the PPP peer. Optional. If using
    PAP authentication, this option says that all PAP secrets are encrypted in the
    /etc/ppp/pap-secrets. |

    | papcrypt | Require CHAP authentication of the PPP peer. Optional. |

    | require-chap name name | The name of the local system for PPP authentication
    purposes. Optional but helpful when authentication is used. |

    | remotename name | The name of the remote system for PPP authentication purposes.
    Optional but helpful when authentication is used. |

    | user username | The username for PPP authentication. Defaults to the local system
    name if not supplied. |

    | show-password | Show the password used for authentication in the logs. This
    is useful only during the debugging phase and should be turned off once PPP is
    working properly between hosts. |

    | connect-delay # | The number of seconds to wait for a valid PPP packet from
    the peer. We set this to 10000 (10 seconds) to make sure SSH has time to establish
    its connection. This command is only used on the client end. |

    | pty command | Instead of using a terminal/serial device, run the command listed
    on its own pseudo tty. This will be our ssh command that connects to the remote
    end. This command is only used on the client end.'
