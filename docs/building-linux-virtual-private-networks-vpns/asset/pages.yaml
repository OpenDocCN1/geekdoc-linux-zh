  md: '# VPN and Firewall Interaction


    VPNs enable you to set up secure communications between endpoints and are just
    one weapon in your security arsenal. Firewalls, an older and more established
    security technology, are common in almost every environment. A VPN should be integrated
    into your security policy and that means making sure your VPN and firewall play
    nicely with each other.


    # Types of Firewalls


    Three main types of firewalls are in common use today: packet filters, application
    gateways, and stateful inspection firewalls. They are described in the following
    sections.


    # Packet Filters


    A packet filter is the simplest form of firewall. A packet filter firewall will
    compare any IP packet that attempts to traverse the firewall against its access
    control list (ACL). If the packet is allowed, it is sent through. If not, the
    packet filter can silently drop the packet (DENY in icmp speaks) or send back
    an ICMP error response (REJECT).


    Packet filters only look at five things: the source and destination IP addresses,
    the source and destination ports, and the protocol (UDP,TCP and so on). These
    tests are very fast because each packet contains all the data (in packet headers)
    necessary to make its determination. Due to its simplicity and speed, a packet
    filter can be enabled on your routers, eliminating the need for a dedicated firewall.


    One problem with packet filters is that they generally do not look deeply enough
    into the packet to have any idea what is actually being sent in the packet. Though
    you might have configured a packet filter to allow inbound access to port 25,
    the Simple Mail Transfer Protocol (SMTP) port, a packet filter would never know
    if some other protocol was used on that port. For example, a user on one system
    might run his Secure Shell (SSH) daemon on that port, knowing that the traffic
    would be allowed by the packet filter, and be able to SSH to the firewall against
    policy.


    Another problem with packet filters is that they are not effectively able to handle
    protocols that rely on multiple dynamic connections. The FTP protocol, for example,
    opens a command channel on which the various commands such as USER, RECV, and
    LIST are sent. When data is transferred between the hosts, such as files or the
    LIST output, a separate connection is established. You would need to have an ACL
    that would allow these data connections through FTP to work. However, packet filters
    do not read the FTP command to know when an ACL should be permitted.


    # Application Gateways


    An application gateway goes one step beyond a packet filter. Instead of simply
    checking the IP parameters, it actually looks at the application layer data. Individual'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'application gateways are often called proxies, such as an SMTP proxy that understands
    the SMTP protocol. These proxies inspect the data that is being sent and verify
    that the specified protocol is being used correctly.


    Let''s say we are creating an SMTP application gateway. It would need to keep
    track of the state of the connection: Has the client sent a HELO/ELHO request?
    Has it send a MAIL before attempting to send a DATA request? As long as the protocol
    is obeyed, the proxy will shuttle the commands from the client to the server.


    The application gateway must understand the protocol and both sides of the conversation.
    As such, it is a much more CPU-intensive process than a simple packet filter.
    However, this also grants it a greater element of security. You will not be able
    to run the described SSH-over-port-25 trick when an application gateway is in
    the way because it will realize that SMTP is not in use.


    Additionally, as an application gateway understands the protocols in use, it able
    to support tricky protocols such as FTP that create random data channels for each
    file transfer. As it reads the FTP command channel, it will see (and rewrite,
    if necessary) the data channel declaration and allow the specified port to traverse
    the firewall until the data transfer is complete.


    Often there is a protocol that is not directly understood by your application
    gateway but may be allowed to traverse it. SSH and HTTPS are two simple examples.
    Because they are encrypted end to end, an application gateway cannot read the
    traffic actively being sent.


    In these cases, there is usually a way to configure your firewall to allow private
    packets to be sent without interference by the firewall. You might hear this called
    a plug, which comes from the plug-gw, a part of the Firewall Toolkit (FWTK) that
    was used to connect a client and server directly when the protocol was not supported.


    > Note

    Even application gateways can be fooled if you are crafty enough. For example,
    you could tunnel any arbitrary protocol over SMTP: The client could send data
    as the DATA portion of the transaction, and the server could result in the resulting
    error/success code message. The nature and ubiquity of the HTTP protocol makes
    it easy. SOAP and NET are just two "accepted" examples of tunneling other protocols
    across HTTP. HTTPtunnel, available at www.httptunnel.com, is a freeway tool capable
    of tunneling any protocol across HTTP.


    # Stateful Inspection Firewalls


    Stateful inspection firewalls are a middle ground between application gateways
    and packet filters. Rather than truly reading the whole dialog between client
    and server, a'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# VPN and Firewall Interaction


    stateful inspection firewall will read only the amount necessary to determine
    how it should behave.


    Take the SMTP DATA command, for example. When this command is sent, the client
    will send the data (the text of the email) ending with a line containing a single
    “.”. The server then responds with a success or error code. An application gateway
    will need to be reading all the data that is sent and looking for the “.” and
    error code. A stateful inspection firewall, however, will realize that the client
    is sending data until the server responds. Thus, it will simply forward the client’s
    packets without inspection until the server responds. Simply put, a stateful inspection
    firewall understands the manner in which stateful protocols must conduct themselves
    and manages traffic accordingly within the rulesbase.


    By not reading all the data sent, a stateful inspection firewall achieves a significant
    performance gain over an application gateway while maintaining the higher level
    of security and protocol support. Our VPN traffic, however, will be encrypted
    end to end. As such, there will be little that a stateful inspection firewall
    will need to look at in our VPN datream—can’t inspect the actual data anyway.
    Because of this, there is no functional difference between a stateful inspection
    firewall and an application gateway for our VPN traffic. There is, however, a
    solid performance boost from using a stateful inspection firewall. Because our
    VPN is already introducing latency due to the overhead of encryption, the more
    performance you can get with your firewall, the better.


    # Stateful Inspection Concerns


    Stateful inspection firewalls have suffered from occasional faults. For example,
    to support the FTP protocol, stateful inspection firewalls would look at the packet
    to see whether a data channel was requested. An attacker could trick the server
    into sending a large error message containing a data channel request that aligned
    perfectly at the beginning of a second packet. The firewall would then open a
    channel dictated by the attacker. A program called ftppd-ozone (available at www.monkey.org/
    -dugsong/) could exploit this vulnerability. This particular problem has been
    fixed by firewall vendors, but there might be more lurking around.


    # Common Linux Firewalls


    Several firewalls can run on Linux. We will briefly describe them to cover in
    them, but it is beyond the scope of this book to cover them. See Riders’ Linux
    Firewalls, Second Edition by Robert Zietler (2002) for more information on firewalls.


    +   - The Firewall Toolkit (FWTK). This was the first publicly available application
    gateway and was the base of the commercial firewall Gauntlet. It is a set of userland
    applications that support protocols such as STMP, HTTP, telnet, and X11. It is
    still available at www.fwtk.org, though it has not been officially supported in
    years.'
