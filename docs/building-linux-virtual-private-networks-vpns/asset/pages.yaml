  md: '# Planning Your VPN


    One of the biggest roadblocks in a VPN implementation is the lack of planning.\entimes,
    there’s more than one person involved in the setup of a VPN, and there’s

    great deal of information to track and understand. Proper planning is crucial
    to the

    success of a VPN.


    # Mapping It Out


    The first thing to do is to make a visual map of your intended solution. This
    is helpful

    a a variety of reasons, many of which we will discuss throughout this chapter.
    A map

    could look very much like the network-network configuration shown in Figure 6.1.

    As you can see, the two VPN gateways have a spatial affinity to either the left
    or

    right side of the diagram. FreeS/WAN configuration files refer to these gateways
    as

    either “left” or “right,” we’ve already intuitively identified which is which.
    Whether

    VPN device is “left” or “right” is completely arbitrary. Also notice that first
    consecuutive routers are identified.


    ![](img/ac8d70f99c3fa1e7029fbd036fc254da_184_0.png)


    Figure 6.1 A vanilla map of VPN networks.


    # Naming Conventions


    We now need to prescribe an index (or name) to each of our gateways. This can
    be

    done in a variety of ways, but it is suggested that you use fully qualified domain
    names

    (FQDNs) preceded by an “at” symbol (@). The @ symbol tells FreeS/WAN not to

    resolve the name if DNS or another nameservice is not available. It also

    enables you to name your VPN connections meaningfully without relying on another

    service to regulate the names.

    For the purposes of this example, we’re going to name the “left” gateway

    @cn.exemplify.com and @de.exemplify.com (see Figure 6.2).'
  merge: -1
