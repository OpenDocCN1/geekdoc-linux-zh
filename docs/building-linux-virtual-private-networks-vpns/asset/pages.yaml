    Figure 6.3 The VPN map with IP addresses.


    # FreeS/WAN Compilation


    There''s a lot of source code to compile, let''s begin the process. We''ll assume
    you''re using an x86-compatible system, and our instructions will be centered
    on that assumption. Also, in some instances, you might be able to find a precompiled
    package for your distribution. Be aware that the only precompiled packages you''ll
    be able to use are those for the GMP library and modutils.


    # GMP


    Grab a copy of the GMP (GNU Multiple Precision) library. This can be obtained
    from the Ibiblio''s FTP archive (ftp://ftp.ibiblio.com/pub/gnu/gmp/). Grab the
    latest version of the library. As of this writing, the current version is 3.1.1,
    and that version works well with FreeS/WAN.'
  merge: -1
  pgno: 186
- img_proc: true
  md: 'If you prefer, you can find a precompiled package (RPM, DEB, whatever you prefer)
    from your Linux distribution vendor. However, be sure to get both the libraries
    and the headers. These are sometimes separate packages, and both are needed to
    successfully compile FreeS/WAN.


    If you get the source code, you''ll need to compile it. Here''s a brief synopsis
    of how to do this using GMP 3.1.1. Run the following commands:


    ```

    # tar zxf gmp:3.1.1.tar.gz

    # cd gmp-3.1.1

    # ./configure --prefix=/usr/local

    # make

    # install

    ```


    You can put the GMP package wherever you like, as specified in the --prefix option.
    Be aware that, if you do this, you might need to explicitly specify the path to
    the libraries and header files (by modifying Makefiles or defining environment
    variables) for subsequent compilations. It is suggested that you put the GMP files
    in either /usr or /usr/local because these are standard locations.


    One last thing: Because you''ve just compiled shared libraries, you need to make
    the Linux dynamic linker knows that the libraries are there. Edit the file /etc/ld.so.conf
    and add the library path to the file. For instance, because we installed GMP in
    /usr/local, we add the following line to /etc/ld.so.conf:

    /usr/local/lib


    Now, as root, type the following command to update the dynamic linker database:


    ```

    # ldconfig

    ```


    # modutils


    modutils is a set of utilities that load, unload, and find dependencies between
    kernel modules. If you are upgrading from a 2.2 kernel to a 2.4 kernel or if you''re
    using an older 2.4.x version of modutils, you''ll probably want to upgrade to
    the latest version. As of writing, the current version of modutils is 2.4.8. It
    can be downloaded from www.kernel.org or one of its mirrors.


    Compilation of modutils is exceedingly simple. Grab the tarball, save it in the
    /usr/src/src, and perform the following commands:


    ```

    # cd /usr/src/src

    # tar zxf modutils-2.4.8.tar.gz

    # cd modutils-2.4.8

    # ./configure --prefix=/

    # make

    ```


    Everything should have compiled successfully. If not, try to find out why it''s
    not compiling correctly and remedy the situation. Do not proceed to the next step
    until modutils has compiled successfully!'
