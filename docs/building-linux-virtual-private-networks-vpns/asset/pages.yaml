  md: '# Chapter 1 Introduction to VPNs


    After some analysis of this design, it was discovered that, on average, one-third
    of all emails were forwarded to the servers in Germany or Japan. (The offices
    in Germany and Japan are much smaller than the North American office.) The bandwidth
    we dial and latency are acceptable, but the insecurity of the model is not: Emails
    are forwarded in the clear without any protection against modification or eavesdropping.
    The following options were considered:


    +   * Lease lines that connect the offices in Germany and Japan to the North American
    office.

    * Set up a VPN to protect traffic between the three offices.


    A cost-benefit analysis of the two options showed that the recurring cost of leased
    lines is not affordable, not to mention that the leased lines would be underutilized.
    However, the one-time cost of the VPN is very reasonable. In both situations,
    hardware and long-term support are needed, and those costs are comparable.


    # Recommendation 2: Remote Access to Company Intranet Resources for Mobile Employees


    Currently, employees dial to an ISP of their choosing for Internet access when
    they''re not at one of the offices. Providing them access to intranet resources
    can be done through one of the following mechanisms:


    +   * Open the intranet firewalls to access intranet resources from the Internet.

    * Implement RAS access at each office.

    * Set up a VPN gateway at each of the three offices.


    The first mechanism was thrown out immediately due to security reasons. Opening
    up the intranet to the Internet would make the firewall almost useless. After
    the cost-benefit analysis of implementing a RAS solution, the working group found
    that the company would be actually paying for more employees to access intranet
    resources as compared to the present costs. Not only would the RAS equipment be
    expensive, the long-distance calls would be extremely high! That kind of recurring
    expense would not be possible to justify.


    The VPN gateway solution was the most attractive option of the three. Mobile users
    could continue to use the ISP service they presently use, and the only thing they
    would be required to do is install some software on their mobile computers. The
    only needed hardware would be the VPN gateway, which would be a one-time cost
    that is significantly less than RAS hardware.


    # Recommendation 3: Consolidate Administration of Internet Computing Resources


    For this recommendation, security is the biggest issue. If malicious attackers
    were to gain administrative access to these resources, intellectual property could
    be compromised and Exemplify’s reputation could be sullied.'
