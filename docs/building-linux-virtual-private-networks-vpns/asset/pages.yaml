- img_proc: true
  md: '# Scalability


    VPNs, like all pieces of your network infrastructure, must be able to support
    the traffic you have and be able to scale with the traffic you will support in
    the future. If you are implementing a VPN only to connect central and branch offices
    and have a limited growth plan, you are probably not concerned much with scalability
    because most VPN technologies will provide what you need. If you are rolling out
    an enterprise-wide VPN service and are supporting many dial-in users, scalability
    will be near the top of your list of VPN requirements.


    Three main issues define scalability:


    +   - Capability to handle more connections

    - Ease of maintenance and support

    - Cost


    All three of these issues will depend on the VPN you choose and its design. The
    topology you use can also greatly affect scalability.


    # Star Topology


    We will now examine a sample network-network VPN that has been built using the
    star topology (see Figure 2.2).


    ![](img/ac8d70f99c3fa1e7029fbd036fc254da_54_0.png)


    > Figure 2.2 The star topology for VPNs.'
  merge: -1
  pgno: 54
- img_proc: true
  md: 'In the star topology, you have a VPN connection from each remote site to the
    main VPN hub, Site One. The VPN hub must be able to support n VPN connections,
    n is the number of remote sites. Each remote site that wants to communicate securely
    must send its traffic through the VPN hub in the center.


    The main benefit of this model is that adding new sites is straightforward because
    all configuration changes are made at a central location, the VPN hub. The drawbacks
    are as follows:


    +   - There is a single point of failure. If the hub goes down, all the spokes
    can no longer communicate.

    - If performance on the hub suffers, performance for all VPN traffic suffers.

    - Two nodes that might be geographically close still have to route through the
    hub to communicate.


    Most of the drawbacks can be mitigated by adding more hubs to distribute the load
    and provide fault tolerance.


    # Full Mesh Topology


    Next, we will review a VPN built using the full mesh topology. In the fully meshed
    design, each site communicates directly with every other site. Figure 2.3 shows
    our sample network built as a fully meshed VPN.


    ![](img/ac8d70f99c3fa1e7029fbd036fc254da_55_0.png)


    Figure 2.3 The full mesh topology.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# Considerations 39


    Again, this VPN model has several benefits and one main drawback.

    The benefits are as follows:


    +   - There is no more single point of failure. Sites do not rely on a hub for
    intra-VPN communication.VPN connectivity is lost to the problematic network, and
    for all networks.

    - Overall performance is not limited to a single system.

    - Geographically close sites can now communicate directly.


    The drawback is increased maintenance. If you add a new node, you would typically
    create VPN associations with every other node.

    Although this topology has only one drawback, it is a big one. Instead of managing
    your keys at a center site, you must now manage them on every node. Again, if
    you have 1,000 nodes, this can be a formidable task.


    > Note

    Some VPN solutions, like tinc (see Chapter 10, "tinc"), handle routing for you
    automatically. This will probably not help much with a 1,000-node setup, but it
    can still save you a lot of time and effort.


    # Issues


    From both of the preceding examples, we see that adding nodes can be a lot of
    work. Both star and fully meshed topologies need a scalable way to distribute
    keys in a secure fashion.

    Instead of placing keys on each server, one solution VPNs have implemented retrieving
    key information from a centralized source. FreeS/WAN (see Chapter 6, "Free/WAN")
    supports what is called "opportunistic encryption" and is able to pull key information
    from DNS.

    Another issue that might be a problem is routing. You will need to propagate routing
    information (perhaps by running a common IGP routing protocol such as RIP or OSPF
    within your networks) or be stuck hard-coding routes manually.


    # Interoperability


    VPN software—even products based on open standards and RFCs—has notoriously had
    problems with interoperability. For example, administrators frequently find that
    different standards-compliant commercial solutions don''t actually work together
    or at all. Your interoperability needs can make or break your VPN decision.

    First, you must decide whether you will be connecting to VPNs not controlled by
    you. If you are connecting to devices over which you have no control, it is best
    to choose a VPN that is standards based for maximum interoperability.'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'FreeS/WAN is a good choice for interoperability. IPSec is an industry standard
    for traffic encryption and has been implemented by many different vendors. Although
    some of the implementations have only partial support for some of its features


    # Cross-Platform Availability


    Another thing to consider is whether your VPN package will need to run on multiple
    platforms.

    VPN packages rely only on a common interface that is available for many platforms.
    For example, the universal TUN/TAP driver provides an interface, which is used
    by cIPE (see Chapter 9, "cIPE"). As a result, cIPe is less coupled to the underlying
    architecture, and as soon as the driver is ported to a new platform, cIPe can
    then be added relatively quickly.


    # Cost


    Fortunately, because Linux is a free OS, costs incurred from building a Linux-based
    VPN are usually smaller than for other commercial solutions. The costs you will
    encounter are for the hardware and the Linux installation media, although the
    installation can be downloaded from a distribution mirror.

    Other operating systems require licensing for the OS as well as per-seat licensing
    for the VPN software. Linux has none of these licensing requirements. Not only
    is Linux software free, a number of firewall and security packages can be used
    in conjunction with the VPN software to further secure your site. If you were
    using similar software on commercial OSs, it could get expensive very quickly.

    Although Linux VPNs are cheap, client VPN packages for WinTel platforms are scarce,
    and as a result, they might not be the best for end user VPNs (unless your end
    users are UNIX savvy, which might rule out all but your engineers). Linux VPNs
    provide a great solution for network-network VPNs, where end users and their inferior
    OSs are not directly involved.'
  merge: -1
