- img_proc: true
  md: '![](img/ac8d70f99c3fa1e7029fbd036fc254da_185_0.png)


    # Collecting Addresses


    Now that we''ve identified and named our gateways, we need to collect IP addresses
    and add them to our map. The following information is needed from each side:


    +   - Gateway interface IP addresses

    - Private subnet network number and netmask

    - Routing information from each gateway to the Internet


    You can make a form similar to the following to keep track of information: index:


    ```

    eth0:

    eth1:

    default route:

    eth1 subnet/netmask:

    eth0 subnet/netmask:

    ```


    Complete the form for each VPN gateway. For example, for @de.exemplify.com, it
    would look like this: index:


    ```

    @de.exemplify.com

    eth0:

    10.1.10.50

    eth1:

    192.168.10.1

    default route:

    10.1.10.1

    eth1 subnet/netmask:

    255.255.255.0

    eth0 subnet/netmask:

    255.255.255.0

    ```'
