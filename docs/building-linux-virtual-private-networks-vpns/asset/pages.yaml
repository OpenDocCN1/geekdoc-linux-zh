  md: '# Table 3.3 Configuration File Variables


    | Variable | Used By | Example | Explanation |

    | --- | --- | --- | --- |

    | client_network | server | 192.168.1.0/24 | The network on the VPN client. This
    is used by the VPN server to establish the route to the remote network via the
    `route add` command. |

    | server_network | client | 192.168.2.0/24 | The network on the VPN server. This
    is used by the VPN client to establish the route to the remote network via the
    `route add` command. |

    | server_ppp_ip | server | 192.168.254.254 | The IP address of the VPN server
    end of the PPP link. Make sure this is not on a network available to either machine.
    |

    | client_ppp_ip | server | 192.168.254.253 | The IP address of the VPN client
    end of the PPP link. Make sure this is not on a network available to either machine.
    |


    The variables shown in Table 3.4 are optional.


    # Table 3.4 Configuration File Optional Variables


    | Variable | Used By | Example | Explanation |

    | --- | --- | --- | --- |

    | client_debug | client | yes | Add the debug option to pppd arguments and enable
    `set -x` for command-by-command output of the vpn-client script. |

    | server_debug | server | yes | Add the debug option to pppd for more verbose
    logging. |

    | client_ssh_args | client | -c 3des | Additional ssh args specific to this VPN.
    |

    | client_pppd_args | client | usepeerdns | Additional command-line arguments for
    `pppd` that are specific to this VPN. |

    | server_pppd_args | server | proxyarp | Additional command-line arguments for
    `pppd` that are specific to this VPN. |


