  md: 'If you do not have the OpenSSL library installed, you can either download the
    latest version of its source from www.openssl.org or just find a packaged version
    of the library at http://rpmfind.net.


    # Building tinc from Source Code


    To build tinc from source code, you will need to have all of the dependencies
    previously specified in place. Then you can try to run ./configure followed by
    make all check install. Both commands should be run from tinc''s source directory.


    Before you do that, there are some options you might want to pass to the configure
    script so that everything is handled the way you want it to. By default, tinc
    will use /usr/local/etc/tinc as its configuration directory. You might want to
    change it to /etc/tinc by specifying an appropriate parameter on the command line.
    Look at the output of the following command for additional options:


    ```

    [root@fox tinc]# ./configure --help

    ```


    Here is the sequence of commands used to build and install tinc:


    ```

    [root@fox]# cd tinc-src

    [root@fox]# ./configure --sysconfdir=/etc --with-openssl=/usr/local/ssl

    [root@fox]# make all check install

    ```


    If everything compiles and installs without a hitch, you can proceed to the "Installing
    Configuration Files" subsection. Otherwise, read for help in solving the problem.

    The next subsection considers some of the possible issues that might arise when
    compiling tinc.


    # Troubleshooting


    One of the most frequent problems with tinc is failing to detect the OpenSSL library
    even if you have the library installed on your system. If you know this kind of
    problem, the configure script properly stops and displays a message similar to
    the following:


    ```

    checking for evp.h... no

    checking for openssl/evp.h... no

    ```


    It seems like OpenSSL is not installed on this system. But perhaps you need to
    supply the exact location of the headers and libraries.

    You can try running configure with the --with-openssl=/DIRECTORY parameter. If
    you installed the headers and libraries in a different location you can use --with-openssl-include=/DIR
    and --with-openssl-libs=/DIR.


    ```

    configure: error: OpenSSL not found.

    ```


    You might try to run configure with --with-openssl-* referring to the appropriate
    directories. The way we usually do it is as follows (the exact paths will depend
    on your configuration):


    ```

    [root@fox tinc]# ./configure --sysconfdir=/etc --with-openssl=/usr/local/ssl

    ```'
