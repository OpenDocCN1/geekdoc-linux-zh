    \ option tells PPP to add an entry to the system's ARP table with the IP address\
    \ of the remote PPP interface and the hardware address of the local interface.\
    \ This creates illusion that the remote PPP interface is connected to the local\
    \ network because the local server will respond to the arp requests with its own\
    \ address."
