    | 6 root | 9 | 0 | 0 | SW | 0.0 | 0.0 | 0:03 kupated ||


    Here we can see that the system is relatively idle. The process VPN-PROC represents
    a VPN process; watching as clients beginning connecting to your machine can give
    you an idea of how many clients your server can handle.


    To collect utilization statistics, you can use cron to schedule the vmstat command
    to run at regular intervals during the day.'
