  md: 'scenarios in which you might find CIPE useful. A scenario describing the use
    of pckipe to build a CIPE VPN will be provided at the end of this section.


    Before we start with the scenarios, here is a recommendation. If you are using
    RFC1918 private networks—10.0.0.0/8, 172.16.0/12, and 192.168.0/16—it is considered
    good practice to add the following rules to disable routing for all the private
    networks first and add routes one by one, as necessary:


    ```

    route add -net 10.0.0.0/8 gw 127.0.0.1 reject

    route add -net 172.16.0/12 gw 127.0.0.1 reject

    route add -net 192.168.0/16 gw 127.0.0.1 reject

    ```


    # Rule of Least Privilege (ROLP)


    The practice of enabling routing for only those private networks that are in based
    on the so-called Rule of Least Privilege. The rule states that to achieve better
    security, an entity should only have the privileges it needs to perform the tasks
    assigned to it.


    Later, when you want to add a route for a private network (for example, 10.1.1.0/24),
    you can use the following:


    ```

    route add -net 10.1.1.0/24 gw 172.16.1.1

    ```


    This command will override the three rules we specified earlier and will be used
    by the system to route packets for a 10.1.1.0/24 network. The rest of the private
    network space will not be routed. Thus, you improve the security of your system
    because only the private networks that you know of pass through. This is because
    you need to add an explicit rule for each private network that you want to manage
    to route. The primary reason for adding the reject rules with higher metric is
    that, when a CIPE link goes down, the default route will be used to send packets
    to the addresses that were used for the CIPE link. Because the default route is
    unencrypted, the traffic could potentially be revealed to a third person.


    Generally, many people believe it is more secure to follow the "deny everything,
    enable specific" rule (similar to ROLP) than to "allow everything, deny specific,"
    and routing is not an exception.


    # Static Peers


    For this set of scenarios, all peers are assumed to have static IP addresses that
    do not change from session to session and can be referred to in CIPE and config
    files. Additionally, it is assumed that statically configured ciped is used.


    Should you decide to use pckipe, you need to simply append the contents of the
    /etc/cipe/options.<name> file to the appropriate public key of <name> in /etc/cipe/pk,
    set up pckipe as described in the previous section, and establish a connection
    between two peers using pckipe.'
