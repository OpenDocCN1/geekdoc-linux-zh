    a08:28:08:2b:3c:b3:52:13:26:f0:ac:e5:43:df:20:fb sshvpn@client

    ```


    If you use SSH2 protocol, run the following commands to create a password-protected
    SSH DSA identity in ~/.ssh/id_d:


