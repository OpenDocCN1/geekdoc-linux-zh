- img_proc: true
  md: '# Creating the PPTP Configuration Files


    The pptpd daemon looks in the file /etc/pptpd.conf for configuration options that
    are similar to those used by pppd in /etc/ppp/options. The PoTPo tarball includes
    a sample pptpd.conf file in the samples directory. We use the following:


    ```

    # Speed used by pppd. (Often ignored or irrelevant anyway)

    speed 115200

    ```


    ```

    # Option file for pppd, passed on the command line by pptpd.

    # We use a different one than the default here

    # s.t. you can include different requirements here, such

    # as +chaps, without interfering with normal PPP connections.

    option /etc/ppp/pptpd-options

    ```


    ```

    # Set debug mode for pptpd?

    # (This does not apply to pppd, however.)

    debug

    ```


    ```

    # Local IP Address List

    # This is a list of IP addresses for our side of the PPTP

    # (ppp0, ppp1, etc) link.

    localip 10.1.0.1-254

    ```


    ```

    # Remote IP Address List

    # This is a list of IP addresses that will be given to

    # the remote end of the link (ie the ppp# interface on

    # the pppTP client).

    remoteip 10.2.0.1-254

    ```


    ```

    # The address on which pptpd should listen. Useful

    # if you have multiple interfaces (which is likely)

    # and you don''t want to listen on all of them.

    # We use the external interface here.

    listen 200.8.8.8

    ```


    The local and remote IP address lists are used to set the IPs of the VPN links
    that are created. They can take a list of addresses by separating them with '','',
    or a range of addresses using ''-'', as such as:


    ```

    10.1.0.1,10.1.0.2,10.1.0.5

    10.1.0.1-200

    10.1.0.1-5,10.1.0.50-100

    ```


    ```

    The three IP addresses

