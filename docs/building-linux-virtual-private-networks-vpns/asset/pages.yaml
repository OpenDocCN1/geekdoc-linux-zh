    \nFigure 8.5 The serial tunnel.\n\n# Serial Tunnel Server\n\nThe serial tunnel\
    \ server will use PPP in server mode to pass out IP information to the client.\n\
    \n```\nPPP-tunnel {\n  pass password1;\n  comp yes;\n  encr yes;\n  up {\n   \
    \ ppp \"192.168.254.254:192.168.254.253 proxyarp\";\n    route \"add -net 192.168.2.0/24\
    \ gw 192.168.254.253\";\n  }\n}\n```\n\nThe ppp statement in the up section specifies\
