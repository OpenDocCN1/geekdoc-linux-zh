- img_proc: true
  md: 'signals Form of interruption on a UNIX system. When a signal is received, the
    process that received the signal is temporarily suspended, and its signal handler
    is run (either the default or the one installed by the process). The signal handler
    then takes action based on the type of signal received. Signals can be sent using
    the kill(1) utility; signal handlers can be installed using the signal(2) system
    call.


    **symmetric/private-key cipher** A cryptographic algorithm that uses the same
    key (usually called a symmetric, shared, or private key) for encryption and decryption.
    Symmetric ciphers can operate on blocks (fixed, usually 64 or 128 bits) or streams
    (as 1 bit) of data and are called block or stream ciphers, respectively.


    **Total cost of ownership (TCO)** The cumulative cost of owning or operating something.
    This includes purchase costs, leasing costs, support costs, depreciation, personnel,
    and so on.


    **Virtual Network Computing (VNC)** Virtual Network Computing is a free remote
    display system developed at AT&T that allows remote control of desktops on other
    hosts.


    **War Dialing.** With a modem, war dialing is the process of dialing numbers at
    random looking for another modem with which to connect.'
