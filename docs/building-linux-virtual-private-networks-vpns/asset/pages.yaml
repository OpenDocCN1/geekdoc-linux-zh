    -L/usr/lib -lcrypto -ldl -L.. -lib -lcipe

    /usr/libcrypto.so: undefined reference to ''sysconf@GLIBC_2.2''

    ```


    We fixed the problem by completing the following steps:


    +   1. Download and compile the latest version of OpenSSL. For this demonstration,

    we will assume that a freshly built OpenSSL is in the directory

    /usr/tmp/openssl-0.9.6a.

    2. Run CIPE''s configure with the following parameters:

    [root@cipe-1.5.1~]# /configure --with-ssl-lib=/usr/tmp/openssl-0.9.6a


