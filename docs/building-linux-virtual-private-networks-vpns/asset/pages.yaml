- img_proc: true
  md: 'As for the private key, it will be written out to /etc/tinc/shattuck/rsa_key.priv
    on both hosts. You should refer to this file using the PrivateKey option of tinc.conf
    and keep the private-key file secret. Note that it is better to use absolute pathnames.
    This will ensure that there is no ambiguity as to where the key is saved.


    # Host Configuration Files


    Peers that need to know about each other. First, they need to know each other''s
    IP addresses or at least the IP address of the host to which they will be connecting.
    Second, each peer needs to know the other side''s public key to negotiate a shared
    key used by the symmetric ciph. Third, they need to know what VPNs or subsets
    of addresses are associated with each peer. All this information is stored on
    a per-peer basis in each peer''s /etc/tinc/<vpn>/hosts/ directory.


    We will provide examples of host configuration files used by our scenario VPN
    in a moment. Note that because the VPN scenario consists of only two hosts, the
    following subnet options will actually be the IP addresses of the two members
    of the VPN. In addition, the number of network bits will be defined as /32—an
    equivalent to 255.255.255.255.


    # /etc/tinc/shattuck/hosts/kitaro


    On kitaro, the /etc/tinc/shattuck/hosts/kitaro file should contain a freshly generated
    public key. Add the following lines to the beginning of the file:


    ```

    # Subnet on the virtual private network that is local to this host

    # * In our example, a subnet with netmask 255.255.255.255, essentially

    # * a degenerate case consisting of the virtual IP address of our host

    Subnet = 192.168.1.1/32


    # The real IP address of this tinc host

    # (not really a routable address in our example)

    Address = 172.16.1.1

    ```


    In addition to modifying the file, you will also need to copy the file to the
    bancroft''s /etc/tinc/shattuck/hosts directory.


    # /etc/tinc/shattuck/hosts/bancroft


    When modifying /etc/tinc/shattuck/tinc.conf on kitaro earlier, you specified the
    name of the peer to which the daemon on kitaro is going to connect. However, the
    daemon only knows the symbolic name of the peer, and is not enough to establish
    a connection. To address this problem, you copy bancroft''s information to the
    /etc/tinc/shattuck/hosts directory on your host.


    On bancroft, the /etc/tinc/shattuck/hosts/bancroft configuration file might look
    as follows:


    ```

    # Subnet on the virtual private network that is local to this host

    Subnet = 192.168.1.2/32

    ```'
