  md: '# Chapter 1 Introduction to VPNs


    includes a discussion of the OSI protocol reference model. Even though we''ll
    be mentioning the OSI model in this text, a detailed discussion is not needed.
    If you feel rusty on the subject of computer networking, almost any other networking
    book on your bookshelf should provide the necessary information.


    Finally, this book will assist you to know what cryptography is. Of course, we
    don''t expect you to be able to mathematically prove the weaknesses of a particular
    cipher or know any details of a cryptosystem. All you''ll need to know is that
    a cipher makes data unreadable and that it requires keys to lock and unlock data.
    For more information on cryptography, refer to either Applied Cryptography (by
    Bruce Schneider, John Wiley & Sons, 1996) or Handbook of Applied Cryptography
    (by Alfred J. Menezes, Paul C. van Oorschot and Scott A. Vanstone, CRC Press,
    1996).


    When you want to build a VPN, especially if you are using UNIX frequently, you
    often tend to use simpler, more lightweight packages as low-level tools on which
    to build. Later you might want to add scripts, cron jobs, and other things, so
    it is important for the package you select to be highly customizable and simple.


    Many of the lightweight packages designed to fill this niche even leaving important
    features be behind in trying to trade functionality for simplicity. However, many
    provide more or less the necessary minimum of functions that you need to build
    a secure private network. In this chapter, we will describe one such package called
    CLIP. That''s for the preliminaries. Now let''s move on VPNs.


    # What is a VPN?


    # Definition


    VPN stands for virtual private network. The network part is obvious, but the other
    terms might evade intuitive understanding, let''s use a couple of familiar examples.


    Let''s begin with the "virtual" part of a VPN. Hypothetically speaking, let''s
    say you''re the IT manager for a small publishing company. You''ve connected to
    the Internet, so there aren''t any restrictions on your network. All the computers
    in the office are connected via a single ethernet backbone. About one-third of
    the computers are Macintosh, doing most of the graphics and layout work, and the
    rest are MS Windows PCs, providing basic productivity applications.


    Now let''s say you designed this network before TCP/IP became the facto standard
    for electronic communication. Then you have two protocols operating over the same
    ethernet network: AppleTalk and NetWare''s IP/SPX. These protocols are not compatible,
    but they also do not interfere with one another.


    Because both protocols co-exist peacefully and are mutually exclusive, you could
    say that you have two networks, even though both use the single ethernet network.
    Each network, the Mac network and the NetWare network, are logical, or virtual,
    networks. Hence, you have two virtual networks.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# What is a VPN?


    So, in the sense of a VPN, you''re effectively running a separate protocol apart
    from the TCP/IP protocol suite. The preparation in protocol provides a virtual
    network. You can run a VPN over the same network you have right now. You can even
    run a VPN over the Internet so that you can connect multiple, distant networks
    without severe infrastructure investment and reconfiguration.


    # Virtually Virtual


    Technically speaking, this isn''t entirely true because VPNs rely on the TCP/IP
    protocol. However, the data is abstracted to the point where the raw VPN data
    is not compatible with the TCP/IP protocol. Hence, it''s a veritable virtual network.
    As you will find all technically oriented scripture, a little bit of inaccuracy
    can save a lot of explanation.


    Now for an explanation of the contextual meaning of "private." A big concern on
    the Internet is privacy. When we send an email to an acquaintance, we don''t want
    everyone else in the world to read it, just the intended recipient. We can use
    tools such as PGP or PKI to encrypt the information and make it private that only
    the recipient can read it.


    The "private" part of VPN works the same way, although it handles a little differently.
    Communication over a VPN is encrypted so that only the recipient, or the recipient
    network, can understand the information. The "network" part of VPN should be intuitive,
    so we won''t discuss it. Therefore, a VPN is a virtual (not needing separate hardware)
    private (using cryptography to make information confidential) network (an infrastructure
    over which computers communicate).


    # VPN Elements


    In the preceding section, we explained why VPNs are called VPNs. In this section,
    we''ll discuss the different parts of a VPN and why they''re needed.


    # Encrypted Tunnel


    These days, privacy comes in many forms. We put up fences to give ourselves privacy,
    we rely on our employers and healthcare organizations to keep our medical secrets,
    and some of us masquerade with alter egos on the Internet just to keep people
    from learning who we are. Sometimes we''re just keeping things private, and sometimes
    we''re not. We''re not going to bore you with a discussion of social dynamics.
    That''s not what this book is about.


    From a business perspective, privacy is crucial to a business''s continued operation.
    The Internet also plays a vital role in business. But the Internet is a public
    network. So how do we keep things private? Data is dand and, and if I can read
    it, so can someone else, right?'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Chapter 1 Introduction to VPNs


    Cryptography asserts quite simply that if we cannot guarantee that no one will
    read the message, we can guarantee that it will be difficult for other people
    to understand it, as long as we keep the key secret. Caesar was one of the first
    people to come up with this idea. He would write messages to his generals using
    a very rudimentary cryptystem (known as the Caesar or shift-cipher). He would
    first write the message in Latin and then rotate each of the letters characters
    down the alphabet. Thus, the message "ATTACK ATHENS" would "DWDKQV". The generals
    would use the same process but backwards. The messengers could not read it, but
    he could. Although Caesar could not guarantee that his messengers would go unmolested
    by the enemy, his cipher had the effect of increasing the security of his military
    intelligence. It was almost like he was talking to his generals face to face.


    Fortunately, cryptology has come a long way, and VPNs use encryption to protect
    data. Data is encrypted upon transmission and decrypted upon reception. This gives
    the impression that the two hosts are communicating directly rather than having
    to pass unprotected data from node to node along the way. Therefore, it''s like
    having data directly tunneled from one place to another.


    # Authenticated Endpoints


    One thing Caesar was not able to determine whether or not the intended generals
    were actually the ones. If the enemy intercepted the messages and knew to decipher
    it, then the enemy could read the message. The only thing protecting the message
    was ignorance.


    In a VPN, messages are authenticated to ensure that they are coming from valid
    users. Valid users are granted access, whereas invalid ones are denied. Some VPN
    protocols, such as IPSec, authenticate each packet to ensure integrity of communication.


    At this point, you may be saying, "But the data is already encrypted! Why do I
    need to authenticate the data?" The reason is simple: replay attacks. An attacker
    might not be able to read the data, but if the attacker grabs a communication
    session, then he or she can gain a variety of cryptanalysis attacks that can reveal
    the keys of the cryptystem. One method is to alter the payload slightly and send
    the payload to the VPN device. When the VPN device responds, the attacker now
    has a much better idea of what the original packet contained. After many attempts
    this, the attacker might be able to determine the keys used by the in-place cryptystem.


    VPN authentication uses standard authentication protocols, which usually employ
    a hashing algorithm. If any part of a message changes, even just one bit in the
    whole packet, the output of the hashing algorithm changes. If the hash is different
    than what was expected, the VPN device simply drops the packet. The attacker is
    then left to guessing keys at random, which in some cases could take millennia
    to guess correctly.'
