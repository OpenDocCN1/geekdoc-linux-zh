- img_proc: true
  md: '# Building a VPN with SSL/TLS and PPP


    MOST PEOPLE WHO HAVE WANTED TO USE PPP to establish a VPN have used SSH. This
    was partly due to the easy availability of SSH when VPNs were beginning to be
    created. PPP can be encapsulated in any secure protocol, and SSL certainly fits
    the bill. However, few people have tried this method.


    When you finish this chapter, you''ll be able to create a VPN using SSL/TLS and
    PPP either by hand or by using a set of scripts provided. We think you''ll find
    it similar enough to PPP over SSH to be familiar and perhaps even less bulky and
    cleaner than using SSH.


    # PPP-over-SSL Overview


    To understand the PPP-over-SSL/TLS implementation, we must first describe the
    protocols involved.


    # PPP


    PPP stands for the Point-to-Point Protocol. PPP is a derivation of the popular
    High Level Data Link Control (HDLC) (another layer 2 point-to-point protocol,
    commonly used on T1 lines) to accomplish line control activities and encapsulate
    user data. PPP is most commonly used to establish a connection between modems
    over phone lines, such as when dialing up an ISP. Most Linux distributions come
    with tools such'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# Chapter 4 Building a VPN with SSL/TLS/PPP


    as wdial or xisp let you establish modern modem connections without fiddling with
    the underlying PPP commands and configurations. PPP, however, is not restricted
    to physical connections only; PPP connections can be established between any hosts
    that have network connectivity. Our goal will be to establish a PPP connection
    between different machines on the Internet, which we will use to establish a VPN.


    To run pppd, the PPP protocol daemon, must have a kernel that supports it. PPP
    is often compiled as a module that you can query with the command insmod. If so,
    it should load automatically when needed. Most Linux distributions build their
    kernels with PPP support, so this should not be an issue.


    Most Linux distributions also come with precompiled versions of PPP that you can
    install. You will likely not need to compile and install pppd yourself. However,
    for reasons that are discussed later, we suggest pppd version 2.3.7 or later.


    The focus of PPP has never been on the privacy of the transmitted data, and as
    a direct result, it relies on external encryption methods to address this issue.
    The risks of PPP data interception on phone lines are limited to line taps or
    a physical presence at either end of the PPP link. However, because we want to
    use PPP to establish a connection by sending the traffic over the Internet, we
    must tunnel this PPP connection inside an encryption layer.


    # SSL/TLS


    The secure socket layer (SSL) protocol was created to allow secure network communications.
    SSL uses strong encryption to protect clear-text protocols by encapsulating them—literally
    wrapping them inside a secure crypto layer. The encapsulated protocol, such as
    HTTP, POP or NNTP doesn''t need to know anything about cryptography. In fact,
    it doesn''t even need to know that it''s securely transmitted via SSL. All of
    the encryption and decryption is more than just an encryption layer to plain text
    translations. It also ,


    SSL provides more than just encryption it can provide authentication of the endpoints
    involved in the communication. It does this by checking certificates, which will
    be discussed later.

    SSL is most commonly used to protect HTTP (Hypertext Transfer Protocol) transmissions,
    and this is the purpose for which it was originally created. However, SSL is also
    commonly used to protect mail protocols such as POP and IMAP. Versions of the
    SSL-protected protocols usually take on a new name and port number. When encrypted
    with SSL, HTTP becomes HTTPS on port 443, POP3 becomes POP3S on port 995, and
    IMAP becomes IMAPS on port 993, for example. There are SSL versions of other protocols
    such as TELNET, FTP, FTPC, LDAP, and more,


    # When Not to Use SSL


    If you want to have a secure login or file transfer method, we strongly suggest
    using SSH, the Shell protocol. OpenSSH, an implementation of the SSH protocol
    by the OpenBSD development team, is available on most UNIX-like operating systems
    and comes with Linux distributions now. Though you can tunnel TELNET, FTP, RCP
    and friends through SSL, using OpenSSH will save you the headache of reinventing
    the wheel—and for this purpose, OpenSSH is a very stable tool.'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# SSL/TLS History


    SSL was created by Netscape Communications. The initial protocol design, SSL version
    1.0, was completed in July of 1994 but was not released. SSL version 2.0 was released
    in December of 1994 and was included in the Netscape browser. SSLv2 was found
    to have some flaws, the most notable of which was the capability for an attacker
    to trick the endpoints into using weak encryption when higher grade ciphers were
    supported.


    Netscape released SSL version 3.0, which corrected these flaws, in November of
    1995. It also included a number of enhancements such as supporting additional
    cipher cipher algorithms, decoupling the authentication and encryption keys, allowing
    cipher negotiation, and increasing the security of the protocol.


    In January of 1999, SSLv3 was used as the basis of the Transport Layer Security
    (TLS) protocol, a specification defined in RFC-2246. TLS includes all the functionality
    of SSLv3, but it is also refined enough to be compatible with the older SSLv3
    protocol. However, the TLS specification defines how software can transparently
    fall back to SSLv3 when the remote end does not speak TLS. Thus, when we refer
    to SSL/TLS, we mean the TLS protocol and its automatic capability to fall back
    to SSLv3 when needed.


    # SSL/TLS Authentication


    SSL/TLS has built in support for host authentication. This authentication is done
    in a way that ensures an attacker cannot read or manipulate the data being transmitted
    and that the endpoints are the ones you expect. This authentication is not mandatory
    but obviously is a good idea.


    For a server or client to be authenticated, it must have two things. The first
    is a public/private-key pair, which is an RSA or DSA key. The second is a certificate,
    which is a signed version of the public RSA or DSA key. This certificate is essentially
    a piece of data that says "I, the signer, promise that this key pair belongs to
    the owner." The certificates used in SSL/TLS are X509 structures, and for our
    purposes, you do not need to know what actually means.


    In a standard SSL/TLS transaction, the client will authenticate the server''s
    certificate; however the converse might not be true. HTTPS transactions, for example,
    seldom require the client (the web browser) to have a certificate for authentication.
    To make sure that we are requiring the highest level of security, we will require
    certificate validation of both the server and the client. Certificates can be
    signed in a variety of ways, however, and it is up to us to determine what sort
    of certificate we will choose to use. There are two certificate signing methods:
    third-party certificates and self-signed certificates.


    # Third-Party Certificates


    The most widely used type of certificate is one in which the administrator has
    its public key signed by a trusted third party. These third parties are called
    Certificate Authorities (CAs.)'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# 104 Chapter 4 Building a VPN with SSL/TLS and PPP


    Your web browser contains a list of public CAs. When connecting to a web site,
    the certificate presented by the server is checked; if the public key of the server
    is signed by one of these trusted CAs, the connection is allowed. If the certificate
    is not correctly signed by one of the acceptable CAs, a warning box is usually
    presented, and you are asked if you want to continue anyway.


    These CAs are usually large companies (such as Thawte or Equifax) that verify
    the company requesting a certificate has a right to the certificate requested.
    This is accomplished out-of-band through various means such as verifying your
    company information in databases or verifying your phone numbers and addresses,
    the owner of your domain name, and other things for which they charge a lot of
    money. After they have determined that you are legitimate, they will sign your
    public key and return this certificate to you.


    # Public CAs Aren''t Perfect


    Even given this level of paranoia, public CAs don''t always get right. For example,
    Veris issued two Microsoft certificates in January of 2001 to someone not affiliated
    with Microsoft at all and didn''t notice until six weeks later. During that time,
    the person who received the certificate could have used it to pose as Microsoft
    when serving web pages or signing software, for example.


    Getting a third-party certificate requires time (generally a week or two) and
    the hassle of filling out information. It also requires money. A standard web
    site certificate costs about $350.


    For our purposes, there''s no reason why we can''t simply self-signed certificates
    and save ourselves the trouble and cost of third-party certificates.


    # Self-Signed Certificates


    Any public/private key can create a certificate. There isn''t anything special
    about the CA keys except for the fact that they are preinstalled in your web browser.


    A common method to avoiding an "official" certificate from one of the CAs is to
    have your key signed by itself. This is called a self-signed certificate.


    In our VPN setup, we will be creating a public/private key pair for our client
    and will generate self-signed certificates for each. The client will authenticate
    the server by checking a local copy of the server''s certificate and versa.


    If we were to use a third-party signed certificate, we would install a local copy
    of the CA key on each head instead of a copy of the self-signed certificate. As
    long as you verify the integrity of the self-signed certificates when you install
    them, there is really no security difference between using a self-signed certificate
    and a third-party certificate in this, and we''ll choose the faster and cheaper
    route.


    # What If You Already Have Your Own CA?


    If you have your own CA in house, you might want to sign all the VPN keys with
    that instead of using self-signed certificates. If this is the case, you already
    have the knowledge that let you create and manage the certificates, and we''re
    surprised you''re reading this section at all.'
  merge: -1
