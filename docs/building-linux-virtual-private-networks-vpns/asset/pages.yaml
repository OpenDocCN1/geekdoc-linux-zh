  md: "# Host-Host Configuration\n\nWe'll begin with a simple host-host IPSec tunnel.\
    \ This is the easiest VPN tunnel to set up, and the configuration keys stay relatively\
    \ lean.\n\nUsing the information from our VPN map, we create the following file:\n\
    \n```\nconfig setup\n  interfaces=\"ipsec=eth0\"\n  klipsdebug=none\n  plutodebug=none\n\
    \  plutoload=%search\n  plutostart=%search\n  uniqueids=yes\n\nconn %default\n\
    \  keyingtries=0\n  authby=rsasig\n```\n\n```\nconn de-cn\n  left=10.1.10.50\n\
    \  nexthop=10.1.10.1\n  leftid=@de.exemplify.com\n  leftrsakey=sAQN7enIKLT1...\n\
    \  right=10.126.5.241\n  nexthop=10.126.5.1\n  rightid=@cn.exemplify.com\n  rightrsakey=sAQNQZru...\n\
    \  auto-add\n```\n\nThis file should be copied to /etc/ipsec.conf on both hosts.\
    \ This should already exist because it was placed there during FreeS/WAN installation.\
    \ However, the existing file does not contain your configuration information and\
    \ is therefore relatively worthless.\n\nOne field that might not be intuitive\
    \ is the *rsakey field. This field is the RSA public key for each index (or) host.\
    \ This comes from the /etc/ipsec.secrets file under the labeled pubkey.\n\nAnother\
    \ field that is not straightforward is the interfaces field. This parameter tells\
    \ KLIPS to which interface it should bind. You should only have a single interface\
    \ on this host, but if you have more than one, sure you specify the proper interface\
    \ (that is, the interface closest to the other host in the VPN tunnel).\n\nWe\
    \ can simplify our configuration using the %defaultroute parameter. The %defaultroute\
    \ parameter does some of the configuration work for us because it automatically\
    \ detects IP address information and fills the host's IP address and the nexthop\
    \ parameter.\n\nThe resulting files look like this for @de.exemplify.com and @cn.exemplify.com,\
    \ respectively:\n\n```\nconfig setup\n  interfaces=%defaultroute\n  klipsdebug=none\n\
    \  plutodebug=none\n```"
