  md: 'The details on the availability of all six ciphers are as follows:


    +   - The IDEA cipher is patented by ETH/Ascom-Tech of Switzerland. If you want
    to use it for commercial use, you need to obtain a license. For non-commercial
    use, however, the IDEA cipher is free.


    +   - CAST The CAST cipher is patented by Entrust, but it is free for both commercial
    and noncommercial use.


    +   - AES Rijndael, 3DES, RC4, and Blowfish. These are free for both noncommercial
    and commercial use.'
