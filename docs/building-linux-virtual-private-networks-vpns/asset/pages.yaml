    There are several other options that the VTun server uses, such as proto and type.
    This is because the VTun server sends details for the tunnel connection back to
    the client. It is up to the client to match the server''s parameters; otherwise,
    a connection will not be established.

    Also, if a connection is configured as UDP but the compression method specified
    is Zlib, this will cause an error because LZO compression can not be used with
    UDP. It is important to check the dependencies of each parameter before rolling
    a configuration into production.


    The setting up one of the most important configuration options. It is within this
