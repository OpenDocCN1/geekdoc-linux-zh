    # Setting Up the chap-secrets File


    PPTP.VPN remote users have their passwords stored on the server in

    /etc/ppp/chap-secrets. This file contains the client name (username), server

    name, secret (the password), and otherwise an IP address. The pptp program calls
    pppd

    with the argument pptp, the second field in /etc/ppp/chap-secrets must be

