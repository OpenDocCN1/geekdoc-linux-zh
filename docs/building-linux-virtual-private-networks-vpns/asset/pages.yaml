    # Performance


    VPN performance depends on many factors, including the type of VPN package you
    are using, the operating system you are using, the hardware it runs, and so forth.
    This section will discuss techniques you can use to measure server and network
    performance of your VPN components.


    # Server Performance


    Server performance should be periodically reviewed to make sure the machine is
    not throttling under the load of the VPN. The easiest way to gather information
    on how your server is performing is use tools like top and vmstat.


    The top command can be used to give you a real-time estimate of what each process
    on your system is doing. The following is a list from the output of top:


    | PID USER SIZE RSS SHARE STAT %CPU %MEM TIME COMMAND |

    |---|---|---|---|---|---|---|---||

    | 485 root | 9 | 3096 | 2500 | S | 5.0 | 4.0 | 0:00 VPN-PROC |

