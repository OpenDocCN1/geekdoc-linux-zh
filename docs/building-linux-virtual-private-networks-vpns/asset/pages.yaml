  md: '# Configuration 315


    We will now describe how to manually set up tinc to run automatically upon reboot
    as one of the init scripts on a RedHat Linux system. To perform the setup, you
    should run the commands described here.


    First, verify /etc/rc.d/init.d.Then go to your tinc source directory and copy
    the startup script for RedHat while allowing correct permissions.


    ```

    [root@fox]## mkdir -p /etc/rc.d/init.d/

    [root@fox]## cd <your_tinc_source_directory>

    [root@fox]## tinc cp redhat /etc/rc.d/init.d/tinc

    [root@fox]## chmod 000 /etc/rc.d/init.d/tinc

    [root@fox]## chmod 755 /etc/rc.d/init.d/tinc

    ```


    The next step is to useconfig to add lines to the tinc startup script. To do that,
    type the following:


    ```

    [root@fox]#-tinc /sbin/chkconfig --add tinc

    ```


    At this point, the tinc startup script should be ready to be run by init(8) next
    time you reboot your system.


    # Modifying /etc/services


    The official port number used by tinc is 655. This number is registered with Internet
    Assigned Numbers Authority (IANA) and can be added to a system-wide /etc/services
    file. The addition is not mandatory, but it could be useful if you prefer to use
    symbolic names instead of port numbers. Simply insert the following lines into
    /etc/services:


    +   tinc 655/tcp

    tinc 655/udp


    # Configuration


    In the following sections, you will learn about tinc configuration files, modifying
    firewall rules to support tinc, and different ways to run tinc.


    # Overview of Configuration Files


    Normally, all configuration files that use tinc are located in the /etc/tinc directory
    and its subdirectories. If you only use one VPN, you might want to put all your
    configuration files directly into the /etc/tinc directory. However, a substantial
    part of tinc functionality is based on the notion of multiple daemons working
    concurrently and servicing different VPNs. Such orientation is handy when you
    need your hosts to support several VPNs.


    If you were to keep all the configuration files for multiple VPNs in the same
    directory; you would probably lose track of which file belongs to which VPN fairly
    quickly, especially if you do not work with the configuration files every day.
    To avoid such chaos, tinc can associate a separate subdirectory of /etc/tinc with
    a different VPN.'
