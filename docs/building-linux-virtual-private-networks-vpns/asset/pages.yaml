  md: '# Network-Network CIPE Tunneling


    In this scenario, two networks are connected using a CIPE tunnel between their
    respective gateways, and a static route is set up between these gateways whenever
    a connection is established. In our example, 192.168.1.0/24 and 192.168.2.0/24
    are the networks that need to be connected using a CIPE point-to-point tunnel.

    172.16.1.1/24 and 172.17.3.5/16 are the IP addresses of the interfaces on the
    two gateways, A and B. We also assume that the link between the two networks is
    called "soho.\ Our example is depicted in Figure 9.1.


    ![](img/ac8d70f99c3fa1e7029fbd036fc254da_305_0.png)


    Figure 9.1 Network-network CIPE tunneling example.


    As you can see from Figure 9.1, workstations that belong to both networks do not
    need to know anything about the fact that tunneling occurs.

    Whenever a workstation from the 192.168.1.0/24 network wants to send an IP packet
    destined to, 192.168.2.10/24, the workstation applies the appropriate net-mask,
    determines that 192.168.2.10 is not on the local network, and sends the packet
    to the default gateway. The default gateway for machines on 192.168.1.0/24 is,
    as you might have already guessed, 192.168.1.1. It knows about the tunnel and
    forwards the packet via the secure tunnel to the other side, which is directly
    connected to 192.168.2.0/24.


    Netmask: /24 = 255.255.255.0

    For 192.168.2.10/24, 24 bits are used to specify a network, so the netmask would
    be 255.255.255.0.'
