  md: '# IPSec Architecture, Components, and Concepts 137


    # External Piece of Hardware (BITW)


    This approach is sometimes called bump-in-the-wire (BITW). In BITW, IPSec is usually
    implemented as an external device connected to a router. The device''s function
    is to secure IP packets. It is also possible to have a security gateway—a system
    running IPSec to which unprotected traffic is diverted to add protection. This
    term can also be used to refer to a hardware add-on card for an existing platform.
    Simply put, when you hear BITW, think software; when you hear BITW, think hardware.


    # Security Features


    The following are the four main classes of security features that IPSec offers
    to IPv4 and IPv6 traffic:


    +   * **Authentication.** Verifies the identity of the sender of a packet.

    * **Integrity protection.** Ensures that data has not been changed while in transit.

    * **Replay protection.** Prevents an attacker from saving encrypted packets and
    replaying them later without being detected.

    * **Confidentiality.** Conceals traffic being transmitted by encrypting it using
    a key shared by the sender and the receiver.


    The particular set of security features that will be used to protect IP traffic
    on your system depends on the chosen protocol (AH, ESP, or both). For instance,
    AH provides the first three features mentioned here but does not provide confidentiality.
    ESP, in contrast, can provide all.


    > Note

    With ESP, it is possible to use encryption (confidentiality protection) without
    authentication. Failing to provide authentication, however, may leave your system
    vulnerable to an attack. See Steve Bellovin''s paper at www.research.att.com/-smb/papers/badesp.ps.


    # Basic Concepts


    This section provides the definitions of various important IPSec concepts.


    # IPSec Modes


    Currently, IPSec can create packets in the two formats corresponding to the two
    supported modes: Transport and Tunnel.


    In the Transport mode, IPSec takes a packet to be protected, preserves the packet''s
    IP header, and modifies only the upper layers by adding IPSec headers and the
    requested kinds of protection between the upper layers and the original IP header.
    This mode was designed to be used mainly by hosts that want to protect


    IP traffic between each other. The Transport mode packet format is depicted in
    Figure 5.1.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# 138 Chapter 5 IPSec


    ![](img/ac8d70f99c3fa1e7029fbd036fc254da_155_0.png)


    Figure 5.1 IPSec Transport mode.


    In the Tunnel mode, IPSec treats the entire packet as a block of data, adds a
    new header, and protects the data (the original packet) by making it part of the
    encrypted payload of the new packet. This mode is typically used to tunnel traffic
    between gateways. The Tunnel mode packet format is shown in Figure 5.2.


    ![](img/ac8d70f99c3fa1e7029fbd036fc254da_155_1.png)


    Figure 5.2 IPSec Tunnel mode.


    It is common to use gateways to transparent tunnel all traffic that hosts send.
    It is important to note, however, that using this method might also imply that
    the local/proximal network(s) will be "trusted" to carry the unencrypted traffic
    to the aforementioned gateways.


    # Security Associations (SA)


    When you want to protect traffic between hosts or gateways, you need to specify
    which cryptographic algorithms, keys, and so on will be used. Such information
    is stored in Security Associations (SAs).


    SAs (we will also refer to them as IPSec SAs) are kept in a repository called
    the Security Associations Database (SAD). Because SAD contains sensitive information
    such as keys, sequence numbers and so on, it must be stored in a secure place
    to which access is restricted.'
