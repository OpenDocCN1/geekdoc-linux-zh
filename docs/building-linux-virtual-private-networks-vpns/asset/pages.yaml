  md: '# Using CIPE 299


    # Using pkcipe


    Before you start using pkcipe, you should understand that it is nothing more than
    just a front end of ciped that was designed to facilitate key distribution.


    Where would pkcipe fit well? For instance, you might want to use it when there
    is a large number of peers and it is difficult to securely distribute keys to
    all of the peers. Another example is when you do not want to trust a single peer
    to generate a shared key. Because pkcipe uses the identities of peers and then
    allows them to participate in the selection of a key, the decision is made collaboratively,
    and no single peer can deliberately generate a weak key.


    How do you use pkcipe? First, you should configure each pkcipe peer. You need
    to generate an identity (private/public key) for every peer, distribute public
    keys between peers that are going to be connected, and add options associated
    with each peer at the end of its public key. We described the process of pkcipe
    configuration in detail earlier, so for this section, we will assume that you
    are familiar with the basics of pkcipe configuration.


    # Example of Using pkcipe to Configure Three Peers


    For our sample scenario, we will use three peers: A, B, and C. We will go through
    pkcipe options on each peer and how to use pkcipe to configure the peers so that
    A is connected to B and B is connected to C. For each pair of peers, you will
    need to select one of the scenarios we showed earlier: network-network, network-host,
    static vs. dynamic IPs, and so on.


    For example, if A and B use static IP addresses and you want to use network-network
    CIPE configuration, you should determine which options are needed for the scenario.
    When determining the options, take into account that pkcipe uses TCP connections.
    This means you should address the problem of incoming connections for firewalled
    peers. You will use your choices later in the pkcipe configuration.


    The first step is to run rsa-keygen scripts on A, B, and C to generate identities
    for all the peers using the following:


    ```

    [root@A,B,C ~ /etc/cipe]# rsa-keygen /etc/cipe/identity 1024

    ```


    To distribute public keys, copy A''s /etc/cipe/identity (it contains A''s public
    key) to B as /etc/cipe/pk/ B''s /etc/cipe/identity to A as /etc/cipe/pk/B. Do
    so for B and C. As a result, all peers will have each other''s public keys.


    # pkcipe Requires Root Privileges


    The pkcipe command must be run as root.


    Then, for each pair of peers (such as A and B, B and C), decide which side is
    going to be the initiator of a TCP connection and which side is going to accepting
    connection. For the accepting side, you can run pkcipe as a server:


    ```

    [root@A xinetd.d]# pkcipe - 9950

    ```'
