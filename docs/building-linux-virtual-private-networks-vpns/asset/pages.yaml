- img_proc: true
  md: '# Our Conventions


    ![](img/ac8d70f99c3fa1e7029fbd036fc254da_52_0.png)


    Figure 2.1 A network-network scenario example.


    Our networks use the private-network range, as specified in RFC 1918. (We detail
    the RFC 1918 networks later in this chapter.) The IP addresses on outside (280.8.8.8
    and 270.7.7.7) are fictitious Internet-routable IP addresses that the two machines
    will use for their actual communication.


    # ## External IP Addresses


    You might notice something fishy with our two external IP addresses: 280.8.8.8
    and 270.7.7.7. These addresses are not legal; the legal range for any byte in
    an IP address is 0 to 255. We did not want to use actual routable IP addresses,
    lest you accidentally type them in and attempt to establish a VPN between you
    and some unsuspecting party. The examples we provide do one of the:


    +   - Use private IPs as external IPs, explicitly stating that you should replace
    them with real routable Internet IPs.

    - Use w.x.y addresses as external IPs, where w is greater than 255 and thus is
    illegal under the Internet.


    Our network-network scenario can be converted into the host-network one by removing
    the eth1 interface and the entire 192.168.1.0/24 network from Bears and connecting
    Bears to Falcons. Similarly, the host-network scenario can be converted into host-host
    by removing the eth1 interface and the 192.168.2.0/24 network from Falcons and
    having Falcons and Bears be the only two machines involved in the VPN.'
