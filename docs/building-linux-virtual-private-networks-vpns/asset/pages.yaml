    # Command-Line Arguments


    Table 9.2 provides a list of command-line arguments supported by pkcipe as of

    version 1.5.1.


    Table 9.2 Command-Line Arguments Supported by pkcipe 1.5.1

    | Argument | Description |

    |---|---|n| -c host:port | Connect to the given host and port using TCP.

