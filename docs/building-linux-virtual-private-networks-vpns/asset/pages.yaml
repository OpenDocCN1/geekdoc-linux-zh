  md: '# 7


    # PPTP


    ![](img/ac8d70f99c3fa1e7029fbd036fc254da_216_0.png)


    THIS BOOK IS DEDICATED TO BUILDING VPNs on the Linux operating system. Sometimes,
    however, we Linux bigots find ourselves in the unfortunate position where we must
    support non-UNIX-like systems directly. One of the worst-case scenarios is when
    you need to support-to-Windows VPN interoperability.


    PPTP, the Point-to-Point Tunneling Protocol, is an enhancement to PPP developed
    by Microsoft. PPTP is used almost exclusively to create VPN sessions for roaming
    users in host-network or host-host configurations. PPTP is fairly well integrated
    into Windows, making it an appealing solution for the unfortunate soul with a
    Windows desktop.


    You are likely to need to use PPTP on Linux for one of the two reasons:


    +   - You need to support VPNs for remote Windows desktops.

    - You need to establish a VPN from your Linux machine to your office, which only
    allows PPTP connections.


    You will seldom (almost never say) see PPTP used to connect two Linux machines.
    The other solutions we describe in this book already handle this situation more
    than adequately. And due to some problems with the PPTP protocol in the past—and
    the fact that it was developed by Microsoft—you’ll find that most Linux folks
    try to steer clear of PPTP whenever possible.'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# The PPTP Protocol


    PPTP is a generic framework you can use to establish secure VPN connections. Data
    packets that traverse the VPN are first encapsulated inside PPP packets. (We discussed
    PPP, the Point-to-Point Protocol, in Chapter 3, "Building a VPN with SSH and PPP,"
    and Chapter 4, "Building a VPN with SSL/TLS and PPP") These packets are encapsulated
    into Generic Routing Encapsulation (GRE) packets and are sent to the other end
    of the link. GRE is its own IP protocol, just as ICMP, TCP, and UDP are protocols.
    The protocol number for GRE is 47 (/etc/protocols contains a list of commonly
    used IP protocols, if you''re curious.


    In addition to GRE packets, which carry the actual PPTP data, a second control
    channel is used for the PPTP connection. from the PPTP client to port 1723 on
    the PPTP server. It is used to send signaling information and to check the status
    of the PPTP connection.


    PPTP itself does not specify what authentication or encryption algorithms should
    be used. Instead, the algorithms are negotiated by the underlying PPP session.


    # Microsoft''s PPTP Implementation


    For authentication and encryption to be enabled for the PPTP session, Microsoft
    needed to add a few algorithms to PPP. For authentication, a variant of the Challenge/Reply
    Handshake Protocol (CHAP), named MS-CHAP, was added. This method is based on two
    other methods used for file sharing and authentication, the LAN Manager hash (based
    on DES encryption) and the Windows NT hash (based on the MD4 function). The LAN
    Manager hash is known to be a weak algorithm, easily crackable by software such
    as Lolhtrack.


    The second extension to PPP is MPPE, the Microsoft Point-to-Point Encryption protocol.
    This protocol handles the actual encryption of the packets. It uses the RC4 stream
    cipher to encrypt the data with a 40- or 128-bit key. The encryption key used
    by the cipher is derived partially from the user''s password via the LAN Manager
    hash or NT hash. The session keys used for encryption are changed periodically,
    typically after 256 packets.


    # Problems with Microsoft''s Implementation of PPTP


    The first version of PPTP released by Microsoft faced some strict cryptographic
    scrutiny by the online community. In 1998, two leading crypto and security experts,
    Bruce Schneier of Counterpane Systems and Mullen of Lolht Heavy Industries, analyzed
    the protocol and found numerous show-stopping problems with it.


    Among the problems with Microsoft''s PPTPv1 were the following:


    +   MS-CHAPv1 sends the client password in two forms, a LAN Manager hash and NT
    hash. The former is a very weak algorithm. The tool Lolhtrack be used to break
    the LAN Manager hash and use it to attack the stronger NT hash, leading to the
    recovery of the user''s password.'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# The PPTP Protocol 201


    +   The encryption keys are derived from the user''s password. Thus, passwords
    with low entropy lead to low-level encryption, even when 128-bit encryption is
    used.


    +   MPPE used the same encryption key for both directions of the communication.
    This meant that the same key was used to encrypt two different cleartext streams.
    This is a big crypto no-no, allowing cryptographic analysis to derive the key
    or plaintext more quickly.


    +   The key used for MPPE is changed every 256 packets. However, an attacker can
    spoof resynchronize keys packet before the rekeying phase, which can be used to
    ensure that the key is never changed.


    +   There was no method for a client to authenticate the server, allowing an attacker
    to impersonate the server.


    These vulnerabilities were addressed in the next version of Microsoft PPTP, dubbed
    PPTPv2 included a new version of the authentication protocol, MS-CHAPv2. MS-CHAPv2
    is incompatible with the original. It increases the randomness of the keys, eliminating
    the weaker LAN Manager password hash, and allows MPPE to use different encryption
    keys for each direction of VPN traffic.


    Microsoft PPTP suffers from a few problems. First, the protocol is built to support
    older software by falling back to insecure MS-CHAP authentication if both endpoints
    do not support MS-CHAP2. Such backward compatibility is good from a user-friendly
    standpoint, but it''s a detriment to security in this context.


    The biggest problem, however, is that PPTPv2 still derives the encryption keys
    from the user''s password. Most user passwords do not contain 40 bits of entropy,
    even on a good day. Regardless of how many bits the cipher might be using, your
    effective encryption is only as strong as your password.


    # How Strong Is Your Password?


    T.M. Cover and R.C. King conducted experiments to determine how much entropy is
    contained in standard English ("A Convergent Gabling Estimate of the Entropy of
    English." IEEE Transactions on Information Theory, July, 1978). They gave subjects
    strings of letters and bet them on what the next letters would be. By comparing
    the actual results with the bets placed, they determined the entropy of English
    strings to be about 1.3 bits per letter.


    Thus, this sentence has not enough for 64 bits of entropy.


    That''s obviously not enough for a 128-bit key, and you can bet that most folks
    don''t normally use passwords as long as the preceding sentence (NT only allows
    14 characters, for example) Use numbers, punctuation, other characters, and variation
    of case can be used to create stronger keys.


    Experiments performed by other scientists range in their entropy estimation from
    0.6 to 1.6 bits per character.


    Just to stress this again, the problems described in this section are not with
    PPTP itself—which does not specify what authentication or encryption algorithms
    are'
