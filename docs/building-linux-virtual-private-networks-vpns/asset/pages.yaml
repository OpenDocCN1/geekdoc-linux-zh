  md: '# Running and Troubleshooting FreeS/WAN 193


    # Table 6.2 FreeS/WAN ipsec commands


    | Command Name | Description |

    | --- | --- |

    | auto | Controls automatically keyed VPN connections |

    | barf | Shows all FreeS/WAN debugging information |

    | eroute | Shows/modifies the extended routing table |

    | klipsdebug | Configures KLIPS debugging features |

    | look | Shows condensed debugging information |

    | manual | Controls manually keyed VPN connections |

    | pluto | Manipulates the IKE keying daemon directly |

    | ranbits | Generates and prints random bits in hexadecimal |

    | rsasikey | Generates RSA keys for Pluto authentication |

    | setup | Controls the interface to FreeS/WAN operation |

    | showdefaults | Prints default routing and interface information |

    | showhostkey | Shows the hostkey in a format suitable for use in DNS |

    | spi | Manipulates SA parameters |

    | spigr | Manages SPI groups |

    | tncfg | Associates virtual IPSec interfaces with real network interfaces |

    | whack | Controls the interface to Pluto |


    # For More Information


    Many more options give you more granular control over the Security Associations
    (SA), key lifetimes, and automatic initialization of VPN tunnels. If we were to
    cover all that here, we''d be rewriting all the documentation that already exists
    on FreeS/WAN. So please refer to FreeS/WAN documentation for clarification or
    further understanding.


    # Running and Troubleshooting FreeS/WAN


    In this section, we''ll discuss different ways to gather information about your
    running FreeS/WAN configuration. This is crucial for any VPN implementation because
    you have to ensure that it''s actually encrypting and authenticating traffic.


    # Packet Sniffling


    One of the most useful tools in any network administrator''s toolkit is a packet
    sniffer. Most current Linux distributions come with at least one packet sniffer
    such as tcpdump.'
