  md: "# Chapter 3 Building a VPN with SSH and PPP\n\nThis automatically turns on\
    \ IP packet forwarding on all interfaces by default. If you are making a host-host\
    \ VPN, this is sufficient. If you want to create a network- or host-network VPN,\
    \ you might want to turn on IP forwarding for only those interfaces that you explicitly\
    \ want to forward. For example, on a large VPN server, you might want to forward\
    \ via via all the ppp interfaces (the VPN links) and via eth1 (an internal interface)\
    \ but not via all the ethernet interfaces. To do so, you could use the following\
    \ shell script:\n\n```\n#!/bin/sh\n\necho 'Setting up IP forwarding rules'\necho\
    \ 1 > /proc/sys/net/ipv4/ip_forward\necho -n \"/proc/sys/net/ipv4/ip_forward:\
    \ \" \ncat /proc/sys/net/ipv4/ip_forward\n\nfor forwarding in /proc/sys/net/ipv4/conf*/forwarding\n\
    d\n\techo -n \"$forwarding: \"\n\n\tinterface=$(dirname $forwarding)\n\tinterface=$(basename\
    \ $interface)\n\n\tcase \"$interface\" in\n\t\tppp(eth1) # list of interfaces\
    \ through which\n\t\t# forwarding should be enabled\n\t\t\techo 1 > $forwarding\n\
    \t\t;\n\n\t\t*) # Turn off forwarding for all other interfaces\n\t\t\techo 0 >\
    \ $forwarding\n\t\t;\n\tesac\n\n\tcat $forwarding\ndone\n```\n\nMake sure you\
    \ tweak the preceding case statement to fit your IP forwarding policy. In this\
    \ case, eth1 and all ppp interfaces (ppp0, ppp1, ...) will be allowed to forward\
    \ packets, and all other interfaces will drop packets not destined for that interface.\n\
    \n# Creating the VPN Users\n\nNext, you must create the user that will be running\
    \ the VPN commands on both ends. We will assume that you use the username sshvpnpn\
    \ on both ends, though you can use any username you want. Although the usernames\
    \ don't have to be the same on both machines, it makes things easier. For example,\
    \ you might create the user as follows:\n\n```\nroot# groupadd sshvpnpn\nroot#\
    \ useradd -m -d /opt/ssh-vpn -c \"SSH VPN User\" -g sshvpnpn sshvpnpn\n```"
