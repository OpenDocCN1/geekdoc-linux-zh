    # Pros and Cons of Using pkcipe


    One of the most important advantages pkcipe has is that you no longer have to
    dis-

    tribute secret keys. Instead, you distribute public keys. Also, there is no need
    fornto come up with a different shared key for each tunnel you want to use. Finally,

    y only need to distribute public keys once, and pkcipe will automatically renegotioti-

    ated keys for you from time to time.


    These advantages do not come for free, however, and pkcipe has its weaknesses.

    in particular, a closer look reveals that although pkcipe might improve security,
    it is vul-

    erable to active attacks. For example, active adversaries interfering with Diffie-

    Hellman exchange can mimic identities of peers and gain access to the data that

    CIPE tunnels. See www.cc.gatech.edu/~ok/mitm for more information.'
