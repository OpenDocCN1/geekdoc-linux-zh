- img_proc: true
  md: '# 8 VTun


    VTUN, or VIRTUAL TUNNEL, is a VPN solution written by Maxim Krasnyansky. A VPN
    built with VTun uses tunnel interfaces in which data is encrypted as it passes
    into the tunnel and is decrypted as it exits the far side of the tunnel. The next
    section provides an overview of VTun. Sections on compiling, configuring, troubleshooting,
    and compatibility of VTun round out the rest of the chapter.


    # Overview of VTun


    A tunnel is a logical connection through which two devices appear to be directly
    connected. Tunnels work on the principal of packet encapsulation. Packet encapsulation
    is the process of placing a packet within another packet. In the case of VTun,
    the encapsulation is done on packets that are routed through the tunnel interface.
    VTun encapsulates packets within IP packets and uses IP networks to route these
    encapsulated packets from one side of the tunnel to the other. Tunnel interfaces
    are logical entries into a tunneled connection and are created on both sides of
    a tunnel connection. Each side of a tunnel has some information about the opposite
    end, such as a reachable network address and what networks lie beyond it. This
    way, when a packet comes into the server destined for a network beyond the far
    side of the tunnel, it is routed through the local tunnel interface. As mentioned
    earlier, the kernel then encapsulates this packet and forwards this new packet
    to the known address at the far side of'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# Chapter 8 UsingVTun


    the tunnel. Upon reaching the far side of the tunnel, the packet is inspected,
    de-encapsulated, and then forwarded to its original destination.

    Figure 8.1 illustrates the process of packet encapsulation for tunnel transport.
    Host 192.168.1.10 sends a packet to the VTun machine 280.8.8.8. The VTun server
    encapsulates the packet into another packet, with 280.8.8.8 as the source IP address
    and 270.7.7.7 as the destination IP address. When the client at 270.7.7.7 receives
    the packet, it is inspected and de-encapsulated. This returns the packet to its
    original state—that is, the source IP is again 192.168.1.10, and the destination
    IP reverts back to 192.168.2.15.


    ![](img/ac8d70f99c3fa1e7029fbd036fc254da_249_0.png)


    VTun enables two servers to establish connections, negotiate tunnel parameters,
    VTun enables the two servers to create a tunnel using TCP or UDP for the underlying
    transport.

    In addition to normal tunnel behavior, VTun also introduces new enhancements.
    VTun supports encryption of data so that any eavesdroppers will not be able to
    determine the contents of the encapsulated packet. VTun also supports compression
    so that packets are compressed as they enter the tunnel and are decompressed as
    they reach the tunnel endpoint. Finally, traffic shaping is a feature implemented
    by VTun to enable the throttling of tunnel connections to preserve bandwidth for
    prioritized traffic.

    VTun supports several different types of tunnels. More information on specific
    configuration tasks for each tunnel type will be discussed later in the “VTun
    Configuration” section of this chapter.


    # VTun Components and Their Functions


    VTun has two primary components: the Linux kernel TUN/TAP driver and the daemon
    vtun. The TUN/TAP kernel driver is used for creating the tunnel interfaces, whereas
    vtun is used for setup and maintenance of the local-to-remote tunneled connection.'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# The TUN/TAP Driver


    The TUN/TAP driver is used as a logical access point to a tunnel. In other words,
    packets routed to the driver are sent to the opposite end of the tunnel. The inverse
    is also true; packets read from the driver have been sent from the opposite end
    of the tunnel to the local side. The driver has two parts: the virtual interface
    and the device files.


    The virtual interface serves as an entrance to a tunnel. As packets are sent to
    the Linux server, routing decisions are made based on the destination field of
    each packet. vtund lists packets for sent to these interfaces and encapsulates
    or de-encapsulates the packet as appropriate. If the packet is destined for the
    far end of the tunnel,Vtun will encapsulate the packet in IP and will forward
    it out to the tunnel endpoint. The packet is destined for the local network, the
    packet is de-encapsulated and then forwarded the appropriate local interface.
    The TUN driver uses an IP interface named in the format of xtun, where X is some
    number that uniquely identifies that tunnel interface. For the rest of this chapter,
    the convention of referring to an IP virtual interface as tun will be used.


    The IP address configured for the TUN/TAP interface also allows routing to point
    traffic destined to remote networks towards that local interface. The local interface
    is logically connected to the next hop toward the remote network.


    To create a routing table entry for the networks on the far side of the tunnel,
    each tunnel interface must be configured with an IP address. For every tunnel
    connection, the remote and local tunnel interfaces are configured to be on the
    same network as point-to-point links. This perpetuates the illusion that the network
    across the tunnel is only one hop away.


    This sample routing table shows the routing used to send packets over the tunnel
    interface. Using this routing table, we will examine the process of routing packets
    over the tunnel interface.


    ```

    |root@vtun-client]# netstat -nr

    Kernel IP routing table

    Destination     Gateway         Genmask         Flags     MSS Window irtt Iface

    10.3.0.0       0.0.0.0         255.255.255.255 UH      40 0      tun

    10.3.0.0       10.3.0.1        255.255.255.252 UG      40 0      tun

    192.168.2.0     0.0.0.0         255.255.255.0 U       40 0      eth1

    192.168.1.0     10.3.0.1        255.255.255.252 UG      40 0      tun

    127.0.0.0       0.0.0.0         255.255.255.0 U       40 0      lo

    ```


    In the routing table, 192.168.2.0/24 is the local network, and 192.168.1.0/24
    is the remote network. In other words, packets that are sent to 192.168.1.0/24
    should be sent across the tunnel. In the routing table, the lines that are important
    to our tunnel-routing decisions are as follows:


    ```

    192.168.1.0     10.3.0.1        255.255.255.0 UG      40 0

    -> tun1

    ```'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# Chapter 8 Using VTun


    ```

    10.3.0.1      0.0.0.0       255.255.255.255  UH      40 0

    -> tun0

    ```


    The first line points traffic for the network 192.168.0/24 to the IP for the tunnel
    interface. The second line states that the IP address 10.3.0.1 is directly connected
    and is assigned to the interface tun0. When these packets are routed to the tun
    interface, they are placed in the queue for processing, vtund will be able to
    read the inter-face queue and process the packets.


    The TAP driver is for tunnels that transport ethernet frames. The TAP driver is
    also used to create a virtual interface for transport of those frames. The TAP
    virtual interface uses the naming convention tapX, where X is a number to uniquely
    identify each tap interface. For the rest of this chapter, each tap interface
    will be referred to as tap.


    Because in the case of the TAP driver we are dealing with layer 2 traffic, creating
    layer 3 routes will not enable two separate ethernet networks to communicate.
    Instead, we will need to bridge the ethernet frames. Bridging is a method for
    transporting ethernet traffic from one collision domain (sometimes referred to
    in this text as a segment) to another.


    Recent Linux kernels support for the TUN/TAP driver, but most distributions do
    not by default support it. It is therefore likely that you will need to recompile
    your kernel to support for TUN/TAP.


    # The vtund Daemon


    The vtund daemon is responsible for initiating and receiving tunnel connections,
    as well as maintenance of any currently established tunnels. vtund reads vtund.conf
    for tunnel configuration parameters and configures vtund''s mode of operation—client
    or server.


    vtund is responsible for packet input and output for the TUN/TAP interface. When
    packets are routed to the TUN/TAP interface, Vtund reads the packets from the
    interface and encapsulates them for transport across the tunnel.


    vtund configured as a server will wait for incoming connection requests and then
    send tunnel parameters back to the client. In server mode, vtund can also be configured
    to run in standalone mode or inet mode. This will be discussed more later in this
    section.


    In client mode, vtund will attempt to initiate a tunnel connection with the server.
    Users on the road or telecommuters are good examples of when vtund would be configured
    in client mode. Another good example would be remote offices connecting to the
    company headquarters.


    The vtund.conf configuration file also contains any commands necessary to establish
    a tunnel connection. Common commands include ifconfig commands for bringing up
    tunnel interfaces and routing statements for the remote network.


    The vtund daemon supports several command-line options. A few of the more useful
    options are listed in Table 8.1.'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Table 8.1 Some Useful vtunt Command-Line Options


    | Option | Description |

    | --- | --- |

    | -f | Causes vtunt configuration information to be read from file |

    | -s | Runs vtunt in standalone server mode |

    | -i | Causes vtunt server to run in inet mode |

    | -p | Causes vtunt client to attempt to reconnect to the server after the tunnel
    connection has terminated (persistent mode) |

    | session server | Causes vtunt client to establish the session specified in the
    configuration file to server |


    # inetd vs. Standalone Server Mode


    vtunt in server mode can run in standalone server mode or in inet mode. In inetd
    mode, vtunt is actually spawned from the super server inetd.

    The benefit of running in inet mode is that it provides an extra level of security
    with the use of TCP Wrappers.TCP Wrappers are a form of access control filters.
    inetd uses TCP Wrappers to access control to the server based primarily on traffic
    source address and destination port number.


    Standalone mode is designed for servers that will be handling a large amount of
    traffic. In inetd mode, the VTun traffic must first pass through the inetd daemon,
    which introduces a small bit of latency into the connection. This at first might
    seem like a negligible amount of time, but if your VPN server is handling a large
    number of VTun connections, the latency will increase. The increase in load might
    eventually cause timeouts and other problems for remote users.


    # Distribution Differences


    Some Linux distributions use xinetd. They are functionally similar in that they
    are both super-server type daemons, and xinetd allows for a greater amount of
    flexibility in configuring services. Regarding of what is bundled with your distribution,
    the command-line option for vtunt to run in inet mode is the same as running xinetd
    or inetd.


    # Supported Encryption Methods


    In any VPN implementation, it is important that both data encryption and data
    authentication be present to ensure the highest level of security and data integrity.
    Data encryption makes it difficult to intercept traffic and get the user data
    being sent across the tunnel. Integrity Protection ensures that the data has not
    been tampered with after it enters the tunnel.'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# 236 Chapter 8 Using VTun


    To implement encryption and authentication,VTun uses OpenSSL. Although OpenSSL
    supports several types of encryption,VTun currently uses the Blowfish algorithm.


    Blowfish was developed by Bruce Schneider of Counterplane Software. The source
    code for Blowfish is not patented and can be downloaded from many sites on the
    Internet. Blowfish was designed to be very fast and efficient. This makes it ideal
    for VTun packets which must be encrypted and decrypted quickly to ensure that
    additional latency is not introduced into a network conversation.


    Blowfish is a symmetric algorithm, meaning the same key used to encrypt the data
    is used to decrypt the data. Although VTun uses a key of 128 bits, Blowfish uses
    a key up to 448 bits. The it bits force a key space of 3.4 × 10³⁸ keys, making
    it sufficiently difficult to perform a brute force attack on encrypted data.


    For Integrity Protection,VTun uses md5 to create a 128-bit key hash from a phrase
    (the data). Md5 is a hashing algorithm used to produce an irreversible value for
    a given set of data. This value is nearly unique, and it is extremely unlikely
    that two different sets of data would produce the same md5 hash value. In short,
    md5 is a method for fingerprinting data. By including this value in the packet,
    it is possible for the computer receiving the packet to perform another md5 hash
    on the data received and compare it with the value one sent with the packet. If
    they are the same, the packet passes the integrity check. If they are different,
    the packet must have been tampered with.


    # Challenge-Based Authentication


    For additional security, when the client is authenticating itself to the server,
    it uses challenge-based authentication. Challenge-based authentication is a more
    secure method by which two parties can exchange passwords because plaintext passwords
    are not sent over the network.


    For the client to authenticate itself to a server, challenge-based authentication
    uses this sequence of events:


    +   1. The client initiates connection with the server.

    2. The server issues a challenge. The challenge consists of encrypting some data
    with the secret key that both the client and server share. This data is then sent
    to the client.'
  merge: -1
  pgno: 253
- img_proc: true
  md: '3. The client receives the challenge and decrypts it with the secret key that
    the client and server both share. The client calculates a hash for the random
    data and sends it to the server.


    4. The server receives the hashed data from the client and compares it with a
    hash of the random data originally sent. If the two values match, the client is
    authenticates. If the two values are different, the client fails to authenticate.


    If the client authenticates itself,VTun will continue to the next step in the
    process for creating a tunnel. The server will pass encryption and compression
    settings back to the client. If the client supports these options, the tunnel
    will be established.


    # Supported Tunneling Modes


    VTun supports four different types of tunnels. Depending on the type of VPN to
    design, any one of the four might be the right solution for you. Additionally,
    your VTun configuration need not be limited to only one type of tunnel. A single
    VTun daemon process can handle all type of connections if it has been configured
    to do.


    Tunnels can use either TCP or UDP for tunnel transport. For more reliable delivery,TCP
    should be used. Although TCP has overhead, tighter compression can be used to
    make for lost bandwidth.


    UDP tunnels require less bandwidth and are quicker than TCP tunnels. UDP tunnels
    can be used when bandwidth is tight.


    # IP Tunnels


    IP tunnels are tunnels that transport only IP traffic. IP tunnels can be used
    for both network-network and host-network connectivity. For office-to-office connectivity,
    IP tunnels provide a way to create a virtual topology between two IP networks.
    IP tunnels use the TUN device in the Linux kernel. The configuration is similar
    for user-to-office VPNs, but the client network to be tunnelled is generally a
    single IP


    IP tunnels use the TUN interface to create virtual interfaces. These interfaces
    serve as a logical IPTV for IP packets into the IP tunnel. Statements in the routing
    table are used to determine whether packets are sent across the tunnel or not.
    Figure 8.2 illustrates the steps the kernel takes to route a packet out the tunnel
    interface.


    # Ethernet Tunnels


    Whereas IP tunnels are used to handle IP packets, ethernet tunnels are used to
    create tunnels that transport ethernet frames. Although ethernet tunnels can forward
    IP packets just like IP tunnels, they can also forward other protocols that use
    ethernet, such as IPX. Any other protocol that runs natively over ethernet can
    be transmitted across a tunnel. Ethernet tunnels use the TAP device driver included
    with the kernel.'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# Chapter 8 Using VTun


    ![](img/ac8d70f99c3fa1e7029fbd036fc254da_255_0.png)


    Figure 8.2 The routing process for VPN traffic.


    Ethernet packets are forwarded to the tap interface by creating a bridge with
    the tap interface and an ethernet interface.

    Bridging can be used to forward all ethernet packets from one network segment
    to another. Bridging will be discussed in more detail in the "Ethernet Bridging
    Support" section in this chapter.


    # Serial Tunnels


    Serial tunnels use PPP or SLIP to provide a virtual PPP connection from one side
    of the tunnel to the other. Because PPP and SLIP provide their own network interfaces,
    it is possible to use VTun without compiling TUN/TAP support into the kernel.

    Aside from the interface differences, PPP tunnels act in the same way as the TUN/TAP
    driver. The PPP interface serves as the entrance to the tunnel.


    # Pipe Tunnels


    In some situations, in which network connectivity is unwanted or not available,
    VTun can be used to create a secure connection where output from a command is
    directed. A pipe tunnel gets its name from where the tunnel gets its—a UNIX pipe.
    A pipe tunnel is very similar to the pipe option used from the command line. When
    output from a command is passed to a pipe symbol, the output is directed to the
    command following it.'
  merge: -1
  pgno: 255
- img_proc: true
  md: 'Pipe tunnels work in a similar fashion. Essentially, when the client activates
    the tunnel, the command will execute on one side, and the other side will receive
    its output. Pipe tunnels are a good way to transport files or data directly between
    two VTun machines.


    # Other Supported Features


    In addition to common VPN features, VTun also supports several uncommon features.


    # Compression


    VTun supports traffic compression. This allows for more efficient use of the tunnel
    and provides more bandwidth for user traffic. Depending on the underlying tunnel
    connection, TCP or UDP, different types of compression can be used.


    TCP tunnels can use Zlib for compression. Zlib provides the best compression available
    to VTun but can only be used by TCP tunnels because it requires packets to be
    processed in a reliable manner.


    Zlib uses a modified version of the LZ77 compression, called deflation. Zlib is
    designed to be portable to any platform and is included with most distributions
    of Linux. Zlib''s compression format is similar to the one used by gzip.


    UDP tunnels can use LZO for compression. LZO does not compress as well as Zlib,
    but it is faster and works with UDP packet better delivery.


    Compression is available only for IP and ethernet tunnels. For pipe and serial
    tunnels, no data compression is supported.


    # Traffic Shaping


    The capability to define bandwidth limits for each tunnel is important so that
    one tunnel does not take any bandwidth from other tunnels. VTun supports traffic
    shaping by rate-limiting the amount of bandwidth a tunnel can use. Traffic shaping
    is a good idea for VTun servers with a limited amount of bandwidth.


    # Dependencies


    All of the following procedures can be used to install packages that are prerequisites
    for VTun. The commands listed should be useable on Linux kernel versions greater
    than or equal to 2.4.0.


    # IP Forwarding


    IP forwarding enables a VPN to route packets to the appropriate destination, based
    on the server''s routing table. If IP forwarding is not enabled, packets coming'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# Chapter 8 Using VTun


    into the VPN server that are destined for the opposite end of the tunnel will
    simply be discarded.

    To enable the routing of packets on your Linux machine, you will need to enable
    IP forwarding. The kernel will check the file for /proc/sys/ipv4/ip_forward to
    find out if it should route packets or not. There is a single number in this file:
    0 or 1. If the value is 1, IP forwarding will be set to true, and the kernel will
    route packets. If it is 0, IP forwarding will be set to false, and the kernel
    will not route packets.

    To start forwarding packets, run the following command:


    ```

    [root@vpn-server ~root]$# echo "1" > /proc/sys/ipv4/ip_forward

    ```


    To enable IP forwarding at boot time, follow the preceding command at the end
    of the file /etc/rc.d/rc.local.


    # OpenSSL


