    # Increasing the Security of Your VPN


    You can do several things to enhance the security of your VPN connection, particularly
    in the area of authentication. If you have followed the appropriate procedures,
    particularly the secure generation and installation of the SSH identity key on
    the client and the verification of them, these enhancements are not necessary
    for a secure VPN. However, adding more granular controls can''t hurt. We suggest
    the following restrictions for the paranoid.


    # Requiring PPP Authentication


    Now that we have proven that we can create a VPN


    PAP authentication sends the secret (password) over the connection in the clear,
    whereas CHAP authentication does not. Instead, it sends a hash of the secret and
    the challenge supplied by the peer. Because our PPP connection will be established
    over an encrypted SSH link, there is no compelling reason to prefer CHAP over
    PAP in this case.'
