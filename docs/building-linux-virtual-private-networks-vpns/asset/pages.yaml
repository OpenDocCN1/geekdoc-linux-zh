  md: '![](img/ac8d70f99c3fa1e7029fbd036fc254da_324_0.png)


    # 10


    # tinc


    NO SINGLE SOFTWARE PACKAGE IS CAPABLE of addressing all possible problems and
    requirements you might have when building a VPN. Fortunately, Linux provides several
    alternative VPN packages. Although in the majority of the packages work very similarly,
    in reality, the differences between them are significant enough for you to prefer
    one over another. In particular, there are differences in key generation and distribution,
    underlying transport protocols, available ciphers, performance, and so forth.
    Thus, it is important to know your alternatives.


    This chapter describes a package called tinc, another tool designed for building
    VPNs under Linux. The package has been in development since 1999 and is now quite
    stable. Before proceeding to the package details, take a look at the overview
    in the next section to get a better idea of tinc’s features.


    # An Overview of tinc


    tinc is a lightweight package providing basic VPN functionality. It is currently
    available for Linux, FreeBSD, and Solaris. The package is distributed freely under
    GNU’s GPL and is maintained by Guus Schieven and Ivo Timmerman.


    The following sections will focus on the 1.0pre4 of the tinc package running on
    an i386-based Linux platform. You can download the latest version of tinc from
    http://tinc.linux.org.'
  merge: -1
  pgno: 324
- img_proc: true
  md: '# Features


    The following sections outline the characteristics of tinc.


    # Designed to Work in Userspace


    tinc was designed to work completely in userspace. For users, this means that
    errors in implementation will not lead to kernel crashes. It also means that you
    do not need to worry about having part of the package you can''t compile if its
    version does not closely match the kernel''s version.


    # Uses Blowfish and RSA


    Currently, tinc uses Blowfish in CBC mode as a symmetric cipher. To obtain keys
    to be used by the symmetric cipher, asymmetric public-key algorithms (such as
    RSA) are utilized.


    Note that you need to have the OpenSSL library installed for the cryptographic
    functions tinc. This makes changing ciphers easier because the interfaces supplied
    by the library are similar for different ciphers.


    Keep in mind that tinc uses asymmetric algorithms, it relies on the fact that
    you can distribute public keys in a fashion that prevents active attacks and replacement
    of the keys. Whether you can do it securely or not, it is ultimately your responsibility
    to perform key distribution.


    # Uses Both TCP and UDP


    The underlying transport protocols used by tinc are TCP and UDP. These protocols
    are utilized to transmit control information and data, respectively. For masqueraded
    machines, it is possible to use TCP exclusively, although this scheme might cause
    problems with the TCP-over-TCP meltdown effect explained earlier in the book (the
    "Host-host CIPE Tunneling" section of Chapter 9, "ciPe").


    # Contains Embedded Support for Routing


    One of the features that makes tinc stand out is its embedded support for routing,
    tinc automatically propagates routes for various subsets connecting a VPN, saving
    you all the work you would otherwise need to set up routing.


    To illustrate, if your VPN consists of M peers and you want to add a new peer,
    typically you would make M-1 modifications to configuration files of all the peers,
    except for the one to which the new peer is connected, to reflect new routing.
    In contrast, if you use tinc, you will not need to make any changes to routing
    tables on any of the peers. As soon as the new peer is connected, routing information
    will be propagated automatically by tinc.


    # Requires Etherap or a Universal TUN/TAP Driver


    As previously described, the tinc package is available for several platforms,
    including FreeBSD, Linux, and Solaris. Because tinc depends on etherap (Linux
    kernel versions'
  merge: -1
  pgno: 325
- img_proc: true
  md: 'prior to 2.4) or the universal TUN/TAP driver, the platforms for which it is
    available need to provide support for either of these drivers.


    The use of the ethertap or universal TUN/TAP drivers means higher portability
    for tine because there is nothing in the package that is bound to a particular
    kernel version. Accordingly, as soon as support for the ethertap or TUN/TAP driver
    is included by an unsupported platform, tine can be ported to such platform fairly
    quickly.


    # Installation


    You have at least three options when choosing the kind of installation you want
    to perform:


    +   - Use an RPM or DEB package containing a set of precompiled, dynamically linked
    binaries.

    - Download tine source and compile it yourself.

    - Use a set of precompiled, statically linked tine binaries.


    > Note

    Do not forget that you will need root privileges to install and run tine.


    If you want to avoid compilation, the first option would probably be the easiest
    way of installing tine. Simply add tine as a package to the system and you are
    all set. Beware, however, that binary packages are typically slightly out-of-date
    in comparison to the source distribution. In addition, you will probably need
    to install other packages on which tine depends, such as OpenSSL, for instance.
    Go to http://tine.nl.org or http://rpmfind.net to find the latest version of the
    RPM/DEB package.


    The second option involves building a fresh set of binaries from the source code.
    This comes in handy when you want to ensure that everything is built properly
    from the bottom up and all the dependencies are in place. A detailed description
    of what you will need to do will be provided in a moment. Meanwhile, you can download
    the latest version of tine source from http://tine.nl.org.


    The third option is useful when you are experiencing problems with the libraries
    on which tine depends and find it difficult to compile. Because the binaries are
    statically linked, you do not need to worry about having all the libraries on
    your system. We recommend that you use this option as your last resort.


    # Dependencies


    This section describes installation and configuration of the components on which
    tine relies, namely ethertap or the universal TUN/TAP driver and the OpenSSL library.'
