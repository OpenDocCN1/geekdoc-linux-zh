    # VPN Server Behind Your Firewall


    Another location for your VPN server is to put it behind your firewall completely,
    attached to the internal network. As shown in Figure 2.6, our VPN server is not
    directly reachable from the Internet at all, and all packets must reach it through
    our dedicated firewall.


