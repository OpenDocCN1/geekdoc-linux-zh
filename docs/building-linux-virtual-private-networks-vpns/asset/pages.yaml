  md: '# Summary


    There''s much more to Free/WAN than can be expressed in this chapter. For instance,
    Opportunistic Encryption is an interesting concept and can make configuration
    and maintenance of Free/WAN VPNs much easier. Also, you might consider adjusting
    encryption parameters to boost performance. We didn''t even discuss the use of
    IPSec AH mode in this chapter, and your application might require it.


    You can also set up multiple tunnels between many different networks, set up VPN
    “hubs” to which mobile users can connect and access resources anywhere on the
    company intranet, and even set up tunnels within tunnels (very useful for geographically
    separate administration network). After you''re comfortable setting up simple
    Free/WAN VPNs, try redesigning your networks using VPNs.


    For more information on some of the topics discussed in this chapter, see the
    following:


    +   * Kernel-HOWTO: www.linuxuxdoc.org/HOWTO/Kernel-HOWTO.html

    * Net-HOWTO: www.linuxuxdoc.org/HOWTO/Net-HOWTO/index.html

    * Kirch-NAG: www.linuxuxdoc.org/LDP/nag2/index.html

    * Frisch1995: www.oreilly.com/catalog/esa/

    * Nadeau2001: http://jixen.tripod.com/'
