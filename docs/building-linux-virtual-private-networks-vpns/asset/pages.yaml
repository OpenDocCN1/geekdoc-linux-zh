  md: '# Setting up PPP over SSH Manually


    The biggest problem with VPN-HOWTO is that it was written for an older version
    of pppd. As we describe later, pppd requires a tty over which it communicates.
    The pty-redir hack was used to supply a tty over which the SSH connection could
    be established. This can be done more cleanly with the pty argument to ppad. Also,
    by using the ip-up script, which is called by ppad after a connection is established,
    we can have routes added immediately. Most other PPP-related VPN methods rely
    on a sleep 10 command to wait until the PPP connection is done before adding routes,
    which might delay the VPN completion if PPP is established quickly or may prevent
    correct routing if PPP takes a while to finish its handshake.


    # Setting up PPP over SSH Manually


    To begin, we will show you the various pieces involved in creating a VPN between
    two hosts manually. This will lay the groundwork for what we do in our later scripts
    and will help you teach what you is going on. This will aid in debugging the connection
    if necessary.


    # Installing and Verifying PPP


    First, determine that PPP is installed on both VPN client and VPN server. On a
    Debian or other dpkg-based system, you would type the following:


    ```

    root@debian~$S dpkg -l ppp | grep ppp

    ii ppp  2.3.11-4  Point-to-Point Protocol (PPP) daemon.

    ```


    On a Red Hat or other rpm-based system, you would type the following:


    ```

    root@redhat~$ rpm -q ppp

    ppp: 2.3.11-4

    ```


    Make sure that the version of ppp you have installed is 2.3.7 or greater because
    that is the first version that supports the pty argument necessary for setting
    up a pty auto-automatically.


    # Enabling IP Forwarding


    Most Linux distributions do not allow IP packet forwarding by default, but we
    must enable this to route VPN packets through the PPP interface. You can change
    the status of IP forwarding by modifying the appropriate kernel parameter. Though
    it is possible to recompile your kernel to change the default settings, the easiest
    way is to use the /proc file system. Files in /proc are not actually files but
    ways of accessing and/or modifying kernel parameters, and you must reboot to change
    these. Thus, the simplest way to turn on port forwarding is to run the following
    command:


    ```

    root# echo 1 > /proc/sys/net/ipv4/ip_forward

    ```'
  merge: -1
