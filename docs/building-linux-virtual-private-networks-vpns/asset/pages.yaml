  md: '# Shutting Down the VPN


    When you want to shut down the IPSec connection, issue the following command on
    both hosts:


    ```

    # ipsec auto --down <connection name>

    ```


    You might notice that, if there is a significant amount of time between executing
    this command on the hosts, the connection is reestablished. This is because the
    other VPN renegotiates the connection. It can do this because the connection is
    still in the Pluto database on both hosts. To delete the connection from the Pluto
    database, type the following on both hosts:


    ```

    # ipsec auto --delete <connection name>

    ```


    If at any point you need to reestablish the connection after deleting it from
    Pluto''s database, execute the following commands on both hosts:


    ```

    # ipsec auto --add <connection name>

    ```


    Then execute the following on one host:


    ```

    # ipsec auto --up <connection name>

    ```


    The IPSec connection should renegotiate.


    # Firewalls


    If your VPN sits behind a firewall, you''ll need to adjust your firewall ruleset.
    Based on your configuration, you''ll need to add two of three possible rules:


    +   - In any case, you need to allow traffic on UDP port 500 (ISAKMP) and to from
    the VPN device. This enables the Pluto daemon to exchange keys with other VPN
    devices.

    - If you''re using IPSec ESP mode, you''ll need to allow IP protocol 50 (ipv6-crypt)
    to and from the VPN device.

    - If you''re using IPSec in AH mode, you''ll need to allow IP protocol 51 (ipv6-auth)
    to and from the VPN device.


    # NAT and IP Masquerading


    Unfortunately, dealing with situations in which a VPN device sits behind a router
    forming NAT or IP masquerading is beyond the scope of this text. If this situation
    applies to you, visit Jean-Francois Nadeau''s FreeS/WAN page (http://jixen-tripod.com/)
    for more information.


    # Synopsis of IPSec Commands


    Table 6.2 presents the different FreeS/WAN ipsec commands and descriptions of
    each one.'
