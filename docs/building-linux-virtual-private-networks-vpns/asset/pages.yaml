  md: '# Establishing an SSL/TLS Connection


    All SSL/TLS connections begin with a handshake that allows the two machines to
    communicate securely. In a nutshell, the SSL/TLS handshake looks like this:


    The client initiates the connection request with a “client hello” packet. The
    server responds with a “server hello”. These messages establish the SSL/TLS protocol
    version, the ciphers they support, and a bit of random data. The server sends
    its certificate, and the client verifies it. If desired, the server may request
    a certificate from the client and verify it as well.


    The two machines then use the changercipher spec (an SSL component process independent
    of the Handshake Protocol) to finalize the ciphers to be used for this session
    and to agree on a key to use. This key is protected from prying eyes by encrypting
    it with the peer''s public key.


    Having verified the authenticity of the remote end, agreed on an encryption cipher,
    and securely communicated the key to be used, the SSL/TLS negotiation is complete,
    and each end indicates success. At this point, the actual application data is
    sent encapsulated in the SSL/TLS connection.


    This was a brief overview of the SSL/TLS setup. If you want the nitty-gritty of
    SSL/TLS, read RFC-2246 and the SSL specification located at http://home.netscape.com/eng/ssl13/.
    Believe it or not, the entire handshake can take place in only four packets.


    So, when encapsulating a protocol (for example HTTP) inside SSL/TLS, the connection
    looks like this:


    +   1. The client connects to the server on port 443 (HTTPS).

    2. The client and server negotiate and enable SSL/TLS.

    3. HTTP begins over the encrypted connection.


    # Our Sample Network


    The theory is: Establish an SSL/TLS connection from the VPN client to the VPN
    server and have PPP daemons on both ends that talk to each other to create our
    VPN. We will create a VPN between the Bears (the VPN server) and Falcons (the
    VPN client), as seen in Figure 4.1.


    Both Bears and Falcons have networks between them that are to be connected securely.
    The dotted line designates the virtual network created between the two hosts.'
