  md: '# Installing ppp-mppe 205


    CHAP/MS-CHAPv2 (Microsoft''s enhanced CHAP authentication.) The software package
    ppp-mppe is a special version of the standard Linux ppp package that includes
    these extensions.


    The code for ppp-mppe is available from the PPTP page at http://ppptcp.sourceforge.net/
    in several different forms:


    ```

    ppp-mppe-VERSION.alpha.rpm # Precompiled binaries for Alpha

    ppp-mppe-VERSION.i386.rpm # Precompiled binaries for Intel

    ppp-mppe-VERSION.src.rpm # The source as an RPM

    ppp-mppe-VERSION.tar.gz # The source as a tar archive

    ```


    If you want to install the binary rpms, simply download the one appropriate to
    your architecture and run the following:


    ```

    $ rpm -i filename.rpm

    ```


    We will describe the method of installing ppp-mppe from the source using the tar
    archive.


    # Installing ppp-mppe from the Source


    First, download the tar archive from http://ppptclient.sourceforge.net/ and extract
    these files:


    ```

    $ tar xzv ppp-mppe-VERSION.tar.gz

    $ cd ppp-mppe-VERSION

    $ sh unpack.sh

    ```


    The unpack script does the following automatically for you:


    +   - Creates the ppp-VERSION build directory.

    - Unpacks and patches the OpenSSL sources. The parts of OpenSSL needed for ppp-mppe
    are included.

    - Rewrites the OpenSSL Makefiles to only build the functions necessary for ppp-mppe.

    - Patches OpenSSL source files to include a new get_key() function, required by
    the Microsoft algorithms.

    - Patches the pppd source to support the PPTP-related extensions, such as the
    MS-CHAP authentication methods, and so on.

    - Unpacks kernel modules and module sources into the build directory.


    # Patching ppp-mppe Sources


    If you want to apply any pppd patches, this is the time. There are currently two
    patches available at http://themm.net/ that might be useful depending on your
    environment.'
