    Now we are going to discuss the "opposite" of the ip-up script, called ip-down.
    It is called whenever a point-to-point link is disconnected (goes down). Accordingly,
    the purpose of the ip-down script is to clean up after the ip-up script, remove
    routes, and so on. Here is an example of a basic ip-down script:


    ```

    #!/bin/sh

    # ip-down <interface> <myaddr> <daemon.pid> <local> <#remote> <arg>


    # Sample of the ip-down script.

    # This is called with the same arguments as ip-up after the device was

    # Closed. It can be used for removing proxyarps, or (like here)

    # for logging purposes, etc.


    umask 022

    PATH=/bin:/bin:/usr/sbin:/usr/usr/bin


    # Logging example

    now=date "+%b %d %T"

    echo "$now - interface $1 is down: $**" >> /var/log/cipe.log


    # remove the daemon PID file

    rm -f /var/run/cipe/$6.pid /var/run/cipe/$1.pid


    route del -net sk netmask 255.255.255.0


    # If the system runs gated, tell it what has happened

    #gdc  interface

    ```


    ```

    exit 0

    ```


    This script simply logs the fact that the CIPE point-to-point link went down and
    removes routing for the remote network that was accessible via the link.'
