  md: '# # VPN Topologies


    In this section, we''ll present the three basic varieties of VPN topologies: host-host,
    host-network, and network-network.


    # ## Host-Host


    The simplest implementation of a VPN is from one host to another. For the purposes
    of simplicity, we''ll assume that the hosts are connected via ethernet to a LAN
    that then connects to the Internet. Figure 1.4 illustrates the host-host topology.


    ![](img/ac8d70f99c3fa1e7029fbd036fc254da_32_0.png)


    Of course, in a real-life situation, communication would probably go though hubs,
    switches, routers, and WAN clouds. In addition, if hosts are directly connected
    via a CAT5 ethernet cable, the only risk you are mitigating with a VPN is wiretapping:
    a skill that''s rare to find and difficult to execute.


    In a host-host scenario, two hosts are connected to the Internet at their innermost
    point by either a direct line or a dial-up connection. Communication between these
    two hosts is insecure and is subject to the wilds of the Internet. By implementing
    a host-host VPN, all communications between these two hosts are secured by the
    authenticated and encrypted VPN transport.


    The application for this type of configuration is not readily apparent, so we''ll
    provide an example of how it could be effectively implemented. An instance of
    where host-host VPN might be appropriate is where you have two servers, each protected
    by a firewall, responsible for financial accounting. These servers need to communicate'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'frequently to synchronize data. The servers are connected to each office''s
    ethernet LAN, with the Internet gateway being a 128K ISDN connection. Building
    a network-network VPN would be overkill because there is no LAN-to-LAN traffic
    except for the financial servers'' synchronization, and the network-network VPN
    would require dedicated hardware. Therefore, a host-host VPN, being a software-only
    implementation, is the best solution.


    # Host-Network


    An easy way to provide mobile users with the capability to connect to the company
    network is via a secure virtual network, or a host-network VPN. Such a topology
    is shown in Figure 1.5.


    ![](img/ac8d70f99c3fa1e7029fbd036fc254da_33_0.png)


    Figure 1.5 A host-network VPN.


    In this configuration, each host independently connects to a LAN via a VPN gateway.
    Each host is authenticated, and VPN tunnels are initiated for each host. The mobile
    host can connect via any connection, by dial-up, a LAN connection, or a wireless
    link.

    Host-Network VPNs are found in remote-access situations. A mobile user can have
    VPN software on his or her laptop and connect to the intranet through the VPN
    gateway. This VPN topology can also be used for employees who work from home.
    The slow but steady growth of DSL and cable-modem customers makes working from
    home an attractive option. Unfortunately, these situations can make company'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'information more vulnerable. For instance, because cable-modem providers used
    shared-access methods, thousands of cable-modem subscribers all exist on the same
    segment, meaning that many users have visibility to other users'' traffic. A simple
    packet sniffer can reveal usernames, passwords, email, and so on. A VPN can make
    the traffic private and unreachable until it hits the corporate VPN gateway.


    # Network-Network


    The third topology found in VPNs is network-network. In this configuration, each
    gateway sits on the edge of a network and provides a secure communication channel
    between the two (or more) networks. Figure 1.6 provides an illustration of this
    topology.


    ![](img/ac8d70f99c3fa1e7029fbd036fc254da_34_0.png)


    Figure 1.6 A network-network VPN.


    This type of configuration is best suited to connecting geographically separate
    LANs. A major advantage of this configuration is that the remote LANs in the VPN
    are transparent to the end user. As a matter of fact, the VPN gateways appear
    to the users to be conventional routers.


    Network-to-network VPNs can be used to connect intranets, making the networks
    appear to be adjacent. The data transferred between the intranets is kept confidential
    during transit. This topology is also useful for extranets between multiple companies,
    with each company sharing particular resources with only the partner businesses.'
