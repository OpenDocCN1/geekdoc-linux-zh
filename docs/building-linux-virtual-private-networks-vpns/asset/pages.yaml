  md: '# Debug Levels


    You can specify different debug levels when starting tinc.

    Literally, the more -d options that are given to tinc, the more messages it will
    log.

    Each level inherits all messages of the previous level.

    If you do not specify any debug options, tinc will do basic logging, such as connection
    attempts, start/stop messages, and any serious errors.


    Table 10.3 provides a detailed description of each logging level you can request
    if you run tinc with the appropriate option.


    # Table 10.3 Logging Levels for tinc


    | Option | Description |

    | --- | --- |

    | -d | Causes tinc to log all connections made to other tinc demons |

    | -dd | Causes tinc to log status and error messages from other tine demons |

    | -ddd | Causes tinc to log all requests that are exchanged with other tinc demons,
    including authentication, key exchange, and connection list updates |

    | -dddd | Causes tinc to log a copy of everything received on the TCP link (called
    the meta socket in tinc''s documentation) |

    | -ddddd | Log all network traffic over the virtual private network |


    # Error Messages


    The following is a list of the most common error messages you can see when running
    tinc. Most of these messages are visible only in the syslog. The syslog viewing
    discussed earlier for information on how to view tinc-related messages there.


    +   - Could not open /dev/tap0: No such device. You forgot to mobprobe netlink_dev
    or mobprobe ethertap. You forgot to compile Netlink device emulation in the kernel.

    - Can''t write to /dev/net/tun: No such device. You forgot to mobprobe or forgot
    to compile Universal TUN/TAP driver into the kernel.

    - Packet with destination 1.2.3.4 is looping back to us! Note that you will only
    see this message if you specified a debug level of 5 or higher.


    This error indicates that packets are being sent out to the tap device, but according
    to the Subnet directives in your host configuration file, those packets should
    be accepted by your host.

    It is likely that the Subnet line in your host configuration file is wrong. You
    probably specified a netmask that is just as inclusive as the netmask of the tinc''s'
  merge: -1
