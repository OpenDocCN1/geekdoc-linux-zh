    # Ethernet Tunnel


    For our next VPN, we will configure an ethernet tunnel between our two sites.
    An ethernet tunnel will enable us to forward only IP traffic but also any other
    layer 3 traffic that runs over ethernet.


    As a few extra commands are needed to set up ethernet tunnels, they are a bit
    more complicated than IP tunnels. Aside from the VTun configuration, you will
    also need to have the brctl command, in the bridge-utils package, installed and
    working. Figure 8.4 shows the relationship between the bridge interface, tap interface,
    and Ethernet Tunnel.


    ![](img/ac8d70f99c3fa1e7029fbd036fc254da_271_0.png)


    Figure 8.4 The ethernet tunnel.


    # Ethernet Tunnel Server


    Most of the configuration for our ethernet tunnel will be the same as our IP tunnel
    configuration mentioned earlier. One of the changes that will need to be made
    is to the device setting. Because Ethernet tunnels use the TAP driver and thus
    a tap interface, this will need to be reflected in the configuration. The second
    change needs to be made to the up section for all protocols you want to forward
    across your tunnel.


    In this example, the up section will create a bridge interface that will bond
    the internal ethernet interface and the tap interface. After the interfaces are
    bonded, their IP address will be zeroed out, and we will reassign the IP address
    of the ethernet interface to the bridge interface. This will allow IP connectivity
    for devices that use the IP address of the ethernet interface as gateway, while
    at the same time bridging all ethernet traffic that the ethernet sees to the tap
    interface.


    Note that, for this example, IP connectivity between 192.168.1.0/24 and 192.168.2.0/24
    is not the goal. This is designed purely to tunnel ethernet traffic.'
