  md: '# Dynamic Peers


    You might find scenarios described in this section useful when one or more of
    the peers that make up your VPN have dynamic IP addresses. For example, some ISPs
    allocate IP addresses to clients using DHCP. Another typical example is when you
    dial-up PPP or SLIP access and your ISP dynamically selects an IP from a pool
    of addresses every time you log in.


    # Overview


    If you are looking for basic ideas that you can use with dynamic peers, here is
    a brief overview of what we are going to describe in this section.


    # Use One Point-to-Point Link at a Time


    Concentrate on the point-to-point links that form your VPN. Remember that tinc
    uses both TCP and UDP and that both of the protocols use either port 655 (by default)
    or the port you specified in the appropriate host configuration file.


    # Use the TCPOnly Option to Disable UDP


    If one of the peers in a point-to-point link is behind a Masquerading/NAT firewall
    and you are having problems with UDP traffic coming through, you can use the TCPOnly
    option in peers'' host configuration files. This option will cause tinc to transmit
    everything over TCP and to completely disable UDP transport.


    # Use Dynamic DNS to Introduce a Static Property


    If you can (create, for example, using dynamic DNS) something static about one
    of the dynamic peers, use that property to connect to that peer. For instance,
    use dynamic DNS to assign a static hostname to a dynamic peer and then use the
    hostname with the ConnectTo option.


    # Use Triangulation or Changing Network Topology


    If both peers are dynamic and it is hard to find or create static about them,
    use triangulation. This implies that at least one of your peers is static. If
    that''s the case, simply redefine the topology of your network and set up dynamic
    peers to connect to the static peer. The idea is illustrated in Figure 10.4.


    As you can see, given peers A and B that are behind a firewall, you replace one
    connection between A and B with connections to a third peer C that has a static
    IP (that is, AC and BC; AB = AC + BC), hence triangulation.

    Now zoom in on your VPN. Lets consider each point-to-point link that is a part
    of your VPN independently. Are any of the peers behind a Masquerading/NAT firewall?
    Are both dynamic or just one of them? If one of the peers has a static IP, you
    can move on to configuration; otherwise, you will need to figure out something
    static about one of the peers so that the other peer can connect to it.'
  merge: -1
  pgno: 353
- img_proc: true
  md: '# Using tinc 337


    ![](img/ac8d70f99c3fa1e7029fbd036fc254da_354_0.png)


    Figure 10.4 Triangulation: changing network topology to accommodate dynamic peers.


    Here are a couple of resources you might find helpful to create a static property
    for a peer that has a dynamic IP. The way to do it is to utilize the dynamic DNS
    service (see Chapter 9 for a list of DNS providers available online), which assigns
    a static domain name to the IP address of a dynamic peer. You can also try using
    a forwarding rule within a firewall configuration. Presumably, this rule will
    be updated every time the IP address of the appropriate dynamic peer changes.


    The following sections explain two typical scenarios that you might have with
    dynamic peers.


    # Network-Network Tunneling with Dynamic Peers


    As a basis for the scenario in this scenario, we will consider the network-network
    scenario with four peers—A, B, C, and D—that was described in detail earlier in
    the “Network-Network Tunneling” section. The original scenario is depicted in
    Figure 10.1.


    To illustrate how to deal with dynamic peers, we will assume that peers A and
    D in the original scenario are dynamic. We will then list the changes you would
    need to make in the original network-network scenario to accommodate that.


    # Changes to the Original-Network-Network Scenario


    As you remember, peer A connects to peer B, and peer D. If we make peers A and
    D dynamic (so that both have dynamic IP addresses), the change will only affect
    D’s configuration because D is the one to which other peer (B) connects. You will
    not need to change A’s configuration because A is connecting to another peer.
    Simply omit A’s IP address in its host configuration file.


    For D, you should change its host configuration file (/etc/tinc/abc/hosts/D) or
    D’s domain name, not IP address, in the file. Use one of the dynamic DNS service
    providers to obtain a domain name for D and set up D that sends an update to the
    appropriate dynamic DNS provider whenever D’s IP address changes. There is usually
    an FAQ for each peer detailing the process for IP address updates.'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# 338 Chapter 10 tinc


    Assuming the domain name you''ve registered for D is D.dyndns.org, here is what
    D''s modified host configuration file should look like:


    ```

    # Subnet on the virtual private network that is local to this host

    Subnet = 192.168.1.2/32

    ```


    ```

    Address = D.dyndns.org

    ```


    ```

    # 655 is the default port so you can omit or change this, if you want

    Port = 655

    ```


    ```

    # this key should be your peer''s public key

    -----BEGIN RSA PUBLIC KEY-----

    [...]

    -----END RSA PUBLIC KEY-----

    ```


    Make sure you copied the updated file to the peers that are going to be connecting
    to D (in our scenario, there is only one peer, B).


    # The PingTimeout Option


    The configuration for the preceding scenario is more complex than just signing
    up for a dynamic DNS domain and modifying the host configuration files. Think,
    for instance, the situation when D goes down, comes back up, and updates dynamic
    DNS. Obviously B should be notified in some way about the need to reconnect and
    reload the DNS record for D.


    Of course, B might be able to sense that a TCP connection to D was closed, but
    in many cases, D will not be able to exit gracefully and close the TCP connection
    by sending a TCP_FIN packet, so B will have to time out. Timing out can often
    be undesirable, although B is timing out, the tunnel timed out even if D comes
    back up.


    Therefore you might find helpful to look at the PingTimeout option in B''s main
    configuration file. If you adjust the value of this option, you might be able
    to minimize the downtime of the connection. You should be careful, though, setting
    the option to a small value on slow or overloaded links might lead to problems.


    You need to think about how you are going to restart tinc on B and if the link
    goes down. Sometimes it is enough to time tinc and its /etc/rc.d/init.script will
    restart it and possibly notify peers in the event of a failure.


    # Changing Network Topology


    So, why are we connecting from B to D? Would it not be easier to simply reverse
    the direction and make D connect to B because B has a static address? The answer
    to this question will depend on your specific configuration. For example, it will
    work if one of your peers is static, but if both are dynamic?'
