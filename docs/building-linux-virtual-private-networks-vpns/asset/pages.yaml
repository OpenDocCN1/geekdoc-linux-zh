  md: '# Limitations 99


    On the client, use the -v option to ssh to get verbose debugging information.
    On the server, check your system logs. Make sure you are logging all debugging
    messages via syslogd. OpenSSH typically uses the auth facility, so make sure your
    /etc/syslog.conf has a line similar to auth.debug /var/log/messages. Alternatively,
    you might try running ssh manually with the -d option to run in the foreground
    and debugging messages to your terminal.


    If the SSH connection is not established, also try specifying which SSH protocol
    version you want explicitly in the -4, ~/.ssh/config or the Client_ssh_args environment
    variable. Also make sure you''re using an identity that is compatible with your
    protocol. It is a good idea to run the same version of OpenSSH on both machines
    because you will face fewer interoperability issues.


    # Networking Issues


    If your PPP connection is established but you find that some or all IP packets
    are not making through, check for appropriate IP forwarding values in /proc/sys/net/ip_forward
    and friends. Also check to see if you have any iptchains or iptables rules that
    could be blocking the packets. Use the -1 option to iptchains to log denied packets
    and check your system logs.


    If you are having trouble looking up hostnames on the remote network, consider
    using the usepeers option to PPP, typically on the client.


    # Limitations


    The VPN runs over SSH, which is a TCP protocol. TCP, the Transmission Control
    Protocol, is an IP protocol that automatically handles retransmission of packets
    that were not received by the remote end. Thus TCP is a reliable protocol: either
    a packet has made it to the other end and is acknowledged in a timely manner,
    or the connection is terminated after an arbitrary timeout.


    +   - The use of TCP for our VPN has a drawback. We are encapsulating IP protocols
    (TCP, UDP, ICMP) over this connection. In particular, UDP (the User Datagram Protocol)
    is used for situations where guaranteed delivery is not required, such as streaming
    protocols in which loss of a packet or two is not traumatic.


    When these UDP packets are sent over our TCP connection, their transmission is
    guaranteed, and a packet that normally might have been lost with no effect will
    instead be retransmitted. This can cause your VPN to be slower than necessary.


    PPP was originally built only to handle IP protocols such as TCP, UDP, and ICMP.
    Thus, any non-IP protocol traffic would not be able to traverse the VPN. pppd
    does have support for IPX (Internet Packet eChange, the protocol used by Novell
    NetWare), however, there are several IPX-related options to pppd that you might
    need to tweak to get it working correctly. Consult the ppp(8) manual page.'
  merge: -1
