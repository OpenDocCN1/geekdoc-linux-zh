  md: 'the host configuration file of the peer from which you want to establish a
    connection. Also, if you have removed the Port option, do not forget to copy the
    modified host configuration file for a peer to all its peers.


    # Troubleshooting


    We have already described a number of the errors that might occur during configuration.
    In this section, we will focus on the errors that occur when you try to run tinc.
    The description of options and messages in this section is based on tinc-1.0pre
    documentation. If you want to get the most recent information, go to the tinc
    web site at http://tinc.nl.linux.org. However, most of the ideas we describe are
    generic enough to be useful regardless of which version of tinc you are using.


    # Note


    If you have no idea why your VPN does not work, remember that you can always get
    answers on the tinc mailing list. To ask a question, send an email to tinc@nl.linux.org.
    Our experience with this list has been positive. The responses are usually prompt
    and adequate. Note, however that unless you are subscribed to the mailing list,
    you will need to visit tinc''s web site to view responses to your question.


    # Using the tinc Log for Troubleshooting


    To effectively troubleshoot tinc, you will need to be able to view tinc messages
    in the syslog, set debug levels, and interpret various runtime error messages.
    These elements will be described in the following three sections.


    # Viewing tinc Log Messages


    Because tinc logs its messages using syslog, you can view the messages on most
    systems by typing the following:


    ```

    [root@flex tinc]# egrep <your_vpn_name> /var/log/messages | tail --lines=80 -f
    --

    ```


    If your system has a file different from /var/log/messages, the log information
    might reside in the preceding command accordingly.


    Alternatively, you can simply try to visually browse through the syslog file,
    as:


    ```

    [root@flex tinc]# more /var/log/messages

    ```


    Note that the amount of data written out to the syslog by tinc depends on the
    debug level you specified when starting tinc. A detailed description of the debug
    levels is given in the next section.'
