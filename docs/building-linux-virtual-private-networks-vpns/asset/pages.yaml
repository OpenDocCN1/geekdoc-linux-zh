- img_proc: true
  md: "# Configuring FreeSW/WAN 179\n\nThere are two types of cryptographic keys:\
    \ RSA public keys and PSK shared keys.\nYou can mix and match these however you\
    \ like, but each set of keys between two hosts or gateways must use the same type\
    \ of key. For instance, gateway A and gateway B can both use RSA keys, gateway\
    \ A and mobile host C can both use PSK keys, but gateway A and gateway B cannot\
    \ use both RSA and PSK keys between each other.\n\n# RSA Key Generation\n\nEven\
    \ though an RSA key was generated for you during installation, let's go through\
    \ the process of generating one anyway. Good practice is to change keys periodically,\
    \ and this is how you do it.\n\nIn a secure working directory (that is, with permission\
    \ 700 (rwx------)), type the following:\n\n```\n# ipsec rsasigkey -verbose 2048\
    \ > rsakey.tmp\n```\n\nYou'll see some output that the program is looking for\
    \ a large prime number. This could take a while no matter what kind of system\
    \ you have, so be patient.\n\nAfter the command completes, you'll have to add\
    \ some information to the rsakey.tmp file to make this understandable to FreeSW/WAN.\
    \ The format for this file is as follows:\n\n+   - RSA\n    <TAB> output of rsakeygen\n\
    \    <TAB>\n    <TAB>\n    <TAB>\n\nThe indentation of this file is crucial. Do\
    \ not forget to begin every line after the first line with a <TAB>. In addition\
    \ this is okay as long lines can be very long and might not fit on a single line\
    \ in your terminal window. This is okay as long as the whole line is technically\
    \ on a single line (that is, no new lines in the data).\n\nThe following is a\
    \ sample configuration file. An ellipsis (...) is used when lines are too long\
    \ to show, and the sample data is unnecessary to convey meaning.\n\n+   - RSA\n\
    \    # RSA 2048 bits p0pp3r Tue Sep 18 23:40:28 2001\n    # for signatures only,\
    \ UNSAFE FOR ENCRYPTION\n    # pubkey=sAQn7EnklTIFVXP+H...\n    # IN KEY=0x4200\
    \ 1 AQN7evKL8...\n    # (0x4200 = auth-only host-level, 4 = IPSec, 1 = RSA)\n\
    \    Modulus: 0x6fec4e29b0bd3945df...\n    PublicExponent: 0x03\n    # everything\
    \ after this point is secret"
  merge: -1
