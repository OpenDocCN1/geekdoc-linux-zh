  md: 'Summary 343


    # # Note


    For the universal TUN/TAP driver, replace tap0 with the name of the VPN for which
    you want to capture traffic (there should be a tunneling interface with the same
    name).


    # # Limitations


    In our opinion, there are several areas in which tine could benefit from increased
    functionality. In particular, it would be useful if tine could tunnel different
    kinds of traffic, such as ethernet frames or Novell''s IPX/SPX. There is also
    a lack of policy control. This is especially important for extranet. Additionally,
    there is an absence of concrete integrated performance and throughput measurement
    tools, an essential function for determining how scalable a VPN solution is.


    Because of the first limitation, tine cannot forward lower-layer protocols as
    a bridge and is only capable of handling NetBEUI as a router. Many people request
    this feature because they want to use NetBEUI, which is utilized by Windows Network
    Neighborhood. The good news is that the code for this feature is in development
    as version 1.0-pre4 and should be available.


    The second limitation has two sides to it. On one side, tine developers want to
    make the package lightweight and easy-to-use as possible. On the other side, it
    is important not to exclude useful features. Striking a balance can be difficult,
    and tine seems very responsive to user comments, so there is a chance they might
    include policy management mechanisms in future versions. For now, your best bet
    is to use a commercial solution such as Check Point''s Policy Editor or to define
    and enforce a policy using such tools as ipchains, DiffServ, and so on.


    Finally, what is missing (in our opinion) is a concise and thorough study of tine
    performance. It is unclear what the overhead is, how tine''s performance degrades
    when additional hosts are added, what bottlenecks are introduced with the automatic
    propagation of routing, and so forth. For some of these limitations, however,
    are common to the majority of open-source products, tine is not an exception.


    # # Summary


    We started this chapter by arguing that understanding your alternatives is an
    important step in selecting a VPN package appropriate to your needs. By now, you
    should have an idea of tine''s strengths and weaknesses. From our experience with
    tine, we can say that it is a great tool with common limitations. Plus, tine is
    not administratively demanding. Its well supported, relatively easy to use, and
    more importantly, free.


    Decide for yourself.'
  merge: -1
