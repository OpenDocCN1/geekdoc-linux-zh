- img_proc: true
  md: '# 294 Chapter 9 CIPE


    encrypted; you can secure many kinds of applications that are otherwise insecure.
    Examples include sending and receiving mail (SMTP and POP3/IMAP), reading news
    (NNTP), downloading files (FTP), remote access (Telnet, r* services), and so forth.
    You can also prevent sniffing that is widely used by attackers.


    What makes CIPE different from other tunneling and VPN packages is that it uses
    UDP as an underlying transport, which means you no longer have problems associated
    with stacking TCP over PPP over TCP. No, this is not a typo. A typical example
    of such a situation would be trying to tunnel PPP over SSH connections that use
    TCP. If you run TCP on top of the tunneled PPP connection, you will find out that
    this has a serious problem. The problem sometimes manifests itself in an “internal
    meltdown” effect caused by the higher TCP layer queuing retransmissions faster
    than the lower TCP can transmit. You can read more about why TCP over TCP is discouraged
    at http://sites.inka.de/sites/bigred/devel/tcp-tcp.html.


    # Securing Applications That Use UDP


    You can use the host-host scenario to secure applications that work over UDP.
    Such applications usually cannot be tunneled by the protocols that work over TCP.
    For instance, one of the protocols that could definitively be more secure using
    host-host CIPE scenario is the Simple Network Management Protocol (SNMP). It is
    notorious for its very basic security protection in the forum of community strings
    transmitted in cleartext.


    This issue is especially important for versions 1 and 2 of the SNMP protocol that
    are widely used. Because the information in cleartext can easily be sniffed and
    revealed, many SNMP devices and applications are vulnerable to attacks. CIPE can
    help you solve this problem by tunneling SNMP over an encrypted CIPE link.


    # Dynamic Peers


    Since version 0.5, CIPE has been capable of picking up peers’ addresses based
    on the first packet received. This makes it possible to establish CIPE tunnels
    if one or both of the peers use dynamic IP addresses.


    We have already briefly commented on one of the possible configurations in the
    earlier section “Static vs. Dynamic IP Addresses.” This section will be different
    in that we will consider dynamic IP versions of the scenarios described for static
    IPs earlier.


    # Dynamic DNS Service


    For some of the configurations we are going to describe, you will need to use
    a dynamic DNS service that will enable you to have a static domain name associated
    with your dynamic IP. There are both free and commercial dynamic DNS providers.
    If you need to get a domain name associated with a dynamic IP, the following links
    might be helpful: http://dnsq.org/, http://ddns.nu/, http://dyndns1.com.'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# Using CIPE 295


    Before we proceed, it is important to note that there is no way we know of to
    get CIPE tunnels to work when there is absolutely nothing static about peers and
    the information is not propagated between them in some way.


    For example, if both peers are behind a firewall doing network address translation
    (NAT) or masquerading, they do not know how to contact each other unless there
    is something static they can use, such as a specific port allocated on the firewall.


    # Network-Network CIPE Tunneling Using Dynamic IPs


    It often happens that one of the peers in the network-network setup has a dynamic
    IP address. In this case, the configuration files for the network-network CIPE
    tunnel will look different than those used for the tunnel with static IPs.


    If only one of the peers has a dynamic IP address (dynamic peer), it is not necessary
    to use dynamic DNS. You just need to use the same configuration files as with
    the static network-network connection, with a few additional options as follows:


    +   1. The dynamic peer initiates a connection, and its options file for the tunnel,
    in addition to other options, contains the following:


    ```

    ping 60

    dynip 1

    maxerr 33

    me 0.0.0.0:9999

    ```


    +   2. The static peer adds the following lines to its options file for the tunnel:


    ```

    maxerr -1

    peer 0.0.0.0:9999

    ```


    The additional options for the dynamic peer will tell it to initiate a connection
    as soon as possible. The dynamic peer will also ping the static peer every 60
    seconds, making it possible to reflect any changes in the dynamic peer''s IP address.


    If the static peer cannot be reached or there is an error, the dynamic peer will
    give up after three attempts (effectively 3 minutes because of the 60-second ping
    options).


    As for the static peer, it will assume that the other end has a dynamic IP address
    and wait for it to initiate a CIPE connection.


    If both sides use dynamic IP addresses, there is no easy way for one side to find
    out the address of the other side unless a static component is added to the system.
    A common way of solving this problem is to use a static domain name that is associated
    with one of the peers'' dynamic IPs. This domain name serves as the static component
    necessary for one of the peers to contact the other.


    When using static domain names with dynamic IPs, it is crucial to ensure that
    whenever an IP address changes, the domain is updated to reflect the changes before
    the other side uses the domain to reestablish a CIPE tunnel. You should choose
    update and ping intervals carefully to ensure that they are balanced.'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# Chapter 9 ClPe


    The problem is making update intervals large enough to minimize overhead associated
    with changing domain information and yet small enough to decrease the risks of
    a remote CIPE getting the wrong address, failing, and eventually exiting.


    # Using maxerr - 1 to Ignore Errors


    Setting the maxerr option to -1 on the initiating side should remedy the situation,
    but it is not a good idea if there is a high chance of other kinds of errors that
    should not be ignored.


    Two factors work in your favor. First, dynamic IP addresses are usually not updated
    frequently unless you use a dial-up connection that is not stable. Second, you
    can probably tolerate some downtime. Choose carefully based on what is more important
    to you. If overhead associated with updating a static domain is significant, use
    larger intervals. If downtime is a problem, ping more frequently and inform each
    time a new address is obtained.


    # Host-Network CIPE Tunneling Using Dynamic IPs


    To use network-host tunneling with Proxy ARP and dynamic IPs, simply use the configuration
    from the scenario described for static IPs and add extra parameters as explained
    in the previous section.


    The main difference between this scenario and the network-network scenario is
    that typically less emphasis is placed on link downtime. Indeed, it''s expected
    that the mobile user will just manually initiate a connection.


    In addition, there is only one workstation for which packets are tunneled, and
    the workstation''s IP address is assumed to be changing frequently anywhere. In
    the network-network scenario, however, the connectivity between two networks with
    multiple workstations is at stake, and downtime can be more important.


    # Ping Intervals and Downtime


    If downtime is important to you, you can set ping intervals to be smaller on the
    workstation side. If both peers are dynamic, make sure ping values and domain
    updates are balanced, as discussed in the previous section.


    # Host-Host CIPE Tunneling Using Dynamic IPs


    This scenario will be a limited version of the network-network scenario described
    earlier. The difference is that host-host does not require adding routing. Refer
    to the “Network-Network CIPE Tunneling” section for more information.


    # CIPE with NAT/Masquerading Firewalls and SOCK5 Proxies


    In this section, we will describe using CIPE with firewalls that do not address
    translation (NAT), sometimes referred to as masquerading firewalls. Then we will
    explain how to use CIPE with SOCK5 proxies.'
  merge: -1
  pgno: 313
- img_proc: true
  md: '# SOCKS5 and NAT


    The SOCKS version 5 Protocol, also referred to as an authenticated firewall traversal
    AFT, is an open Internet standard specified in RFC1928 that defines proxy functions
    at OSI Layer 4 (Transport). Among other things, version 5 supports strong authentication,
    message security, integrity protection, as well as UDP forwarding.


    One of the differences between SOCKS5 and NAT is that SOCKS5 enables return data
    paths and incoming connections to be requested by applications. NAT, in contrast,
    provides only unidirectional translation because it was designed to work at OSI
    Layer 3 (IP). NAT does not allow applications to specify which incoming connections
    need to be forwarded; circumvent the problem, firewall rules are usually used.


    # NAT and Masquerading


    So if one or both CIPE peers have private IP addresses and are behind a firewall
    that uses IP masquerading/NAT?

    Before moving on, stop for a second and think. Have you considered connecting
    the firewalls instead of connecting the peers behind the firewall? If yes, go
    to the scenarios described earlier. This will save you some effort so you will
    have time to enjoy a cup of freshly brewed coffee or tea.


    If that is not an option and you absolutely have to be peers behind the firewall,
    there are two possibilities. If only one of the peers is behind a firewall, it
    should be sufficient to use the same techniques as with the dynamic IP addresses,
    namely:


    +   1. Use a dummy peer IP address and disable errors on the static peer side,
    as follows:

    ```

    peer      0.0.0.0

    maxerr   1

    ```


    +   2. Add the following options to the configuration of the peer behind a firewall
    (the peer can use its private IP address in the me parameter of the configuration;
    it will be changed by the firewall anyway):

    ```

    ping 60

    maxerr 3

    me 192.168.1.1:9999

    ```


    Note that the static peer should not be specific to the remote port number. This
    is because the NAT module on the other peer''s firewall replaces the port number
    with a randomly chosen port, and it is not known in advance.

    You have noticed that the source of all the packets from the peer behind a firewall
    will be the IP address of the firewall. So, why not use it with the peer parameter
    in the static peer configuration? The reason is that we need to know the firewall''s
    address at any given time. If we have no control over the firewall, statically
    specifying the IP address can be risky because any changes in the IP address of
    the firewall would deprecate our configuration.'
  merge: -1
  pgno: 314
- img_proc: true
  md: '# SOCKS5 Proxies


    As we mentioned earlier, SOCKS5 supports UDP proxying, which is used by CIPE to
    exchange encrypted data between peers. SOCKS5 proxies can select both IP addresses
    and port numbers at their discretion. Their choices are returned to the peer that
    requested a connection, but the peer does not have any means to affect the selection
    of the address and port numbers. Therefore, the CIPE peer that will be accepting
    connections must support dynamic IP addresses.


    # SOCKS4 is Not Supported


    CIPE currently only works with SOCKS version 5 because version 5 is capable of
    UDP proxying. Earlier versions of SOCKS, such as SOCKS4, cannot be used with CIPE
    because they do not support UDP.


    Here is a sample scenario. There are two peers. One of them has a static public
    IP and will be accepting connections. The other peer has a static private IP and
    is working through a SOCKS5 server.


    The peer with static public IP must add the following lines to its configuration
    files to support dynamic IP addresses:


    ```

    peer 0.0.0.0

    maxer -1

    ```


    The peer that works through a SOCKS5 proxy must have the following option configured
    (we assume 192.168.1.5 is the address of the interface SOCKS5 machine):


    ```

    socks 192.168.1.5:1080

    ```


    This will tell the ciped of the peer that works through the SOCKS5 proxy to establish
    a control connection and use SOCKS5 for all communications.


    You need to make a decision as to whether the peer that works through the SOCKS5
    proxy is going to use password to authenticate itself. CIPE currently implements
    two authentication methods of those defined by SOCKS5, null-password and none.


    If you want to use a password for the peer to authenticate to SOCKS5 proxy, you
    should set the SOCKS_USER and SOCKS_PASSWORD environment variables to the username
    and password. For example:


    By now, you will have all the necessary configurations in place so that you can
    try to start ciped on both peers and get everything working. Note that if the
    SOCKS5 server goes down, it closes the control connection. You will need to restart
    ciped in this case to recover from the failure.'
  merge: -1
  pgno: 315
