  md: '# 226 Chapter 7 PPTP


    This script will stop all existing PPTP VPN connections when it stops the pptd
    daemon itself. If you want to only stop a specific VPN, kill the pppd process
    that is associated with it.


    # Troubleshooting


    Because there are many pieces to the PPTP VPN puzzle, you might find yourself
    in a number of sticky situations.


    # PPTP Modules Not Loaded


    Several modules must be loaded for PPP and PPTP to work. Attempt to establish
    a PPTP connection and check the list of loadable modules:


    ```

    # lsmod

    Module Size Used by

    mppe 22240 0 (unused)

    ppd_deflate 40180 2 (autoclean)

    bsd_comp 3852 0 (autoclean)

    ppp 21036 2 (autoclean) [mppe pppd_deflate bsd_comp]

    slhc 4440 1 (autoclean) [ppp]

    ```


    There will be other modules loaded as well, but these are the ones that are necessary
    for PPTP to function as a VPN. The mppe module is not supplied by your Linux distribution
    but was compiled earlier in this chapter. The rest most likely come preinstalled.
    If your kernel is compiled with PPP support in the kernel rather than as a loadable
    module (which is unlikely), you will not see the last four modules in lsmod output.


    Refer to the section "PPP Kernel Modules" earlier in this chapter to make sure
    you properly installed the modules necessary. If you failed to update /etc/modules.conf
    or run depmod -a, you might experience problems loading the new modules.


    # Enabling Debugging


    You can force additional debugging by adding the files you want to modify to the
    list of options for the PPTP programs.


    ```

    /etc/ppp/options For pppd (client and/or server)

    /etc/ppp/options.pptp For pptp (client)

    /etc/ppp/ppptpd-options For pptpd (server)

    ```


    Other options that might be helpful include show-password, which will let you
    see the username/password being used for authentication. You should turn this
    off when you are done debugging of course.'
  merge: -1
