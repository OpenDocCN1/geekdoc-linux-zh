    IPv6 are supported. (For IPv6, IPSec is mandatory.) As of today, IPSec functionality
    is deployed on a number of operating systems. For instance, FreeS/WAN is an open-source
    IPSec implementation for Linux (see Chapter 6, “FreeS/WAN”); KAME is a free IPSec
