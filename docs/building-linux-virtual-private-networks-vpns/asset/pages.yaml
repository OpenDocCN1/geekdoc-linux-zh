  md: '# Network Performance


    In most cases, VPNs will perform worse than an identical network without a VPN
    because VPNs must encrypt and decrypt the data. (The decrease in performance can
    potentially be mitigated if your VPN solution compresses traffic—for example,
    the ICMP protocol in IPSec.) When testing your VPN solution, it is a good idea
    to see how it performs over time.


    Some VPN technologies give you different choices that might affect performance.
    You might find that one encryption cipher outperforms others on your hardware.
    In the general, the weaker the encryption, the faster it is. However, you might
    find that some strong ciphers outperform weaker ciphers. (We discuss cipher-related
    issues in Appendix B,"Selecting a Cipher.\'')


    Over time, your VPN performance will change, perhaps because new users are added,
    network needs are different, or your hardware starts failing. It would behoove
    you to have an idea of your VPN performs now and has performed in the past, before
    your users start complaining.


    To view your current network usage, you can use a number of tools. Our favorite
    is the Multi Router Traffic Grapher (MRTG). We will also describe how you can
    use ttop to gather some simple network performance measurements.


    # MRTG


    Before you bring your VPN into production, you should first understand the amount
    of bandwidth currently in use for user traffic. An excellent lower-level tool
    for monitoring bandwidth is MRTG.


    MRTG is a free tool that produces graphs on your current network traffic in addition
    to weekly, monthly, and yearly graphs. It uses SNMP to gather utilization statistics
    from interfaces on servers and routers. MRTG shows only bandwidth utilization;
    it does not show a breakdown of utilization by traffic type, such as SMTP traffic
    or web traffic.


    # Tightening up SNMP Security


    Although SNMP on a gateway device can be a security risk, it can be useful to
    have it enabled for monitoring certain types of events. To tighten the security
    of SNMP, you can take the following steps:


    +   1. Make your community string read-only. This prevents outsiders from making
    changes to devices even if they have the community string.

    2. Create a firewall (or access list) entry, preventing SNMP traffic from entering
    from the Internet.

    3. Make sure to change the default community strings. They are often "public"
    for the read-only string and "private" for the read-write string. In SNMP, these
    strings are treated as passwords and should be changed regularly, just like any
    other password.'
  merge: -1
