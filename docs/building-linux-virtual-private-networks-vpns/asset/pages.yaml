    # Summary


    One of the essential things we wanted to convey in this chapter is the importance
    of planning for your VPNs. When building VPNs, we recommend that you always keep
    in mind fundamental considerations, particularly scalability, interoperability,
    and key distribution. You also need to have a clear understanding of what topology
    is the best for'
