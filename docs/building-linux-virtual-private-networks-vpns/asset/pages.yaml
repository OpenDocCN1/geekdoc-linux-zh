    When Stunnel gets the certificate from the remote end during SSL handshake, it
    will attempt to verify it by looking in this directory for a local copy of the
    certificate. It will take a hash of the certificate, which generates a hexadecimal
    eight-character string such as 1ca0c052. Stunnel will open a file named hash.0
    in this directory and compare its contents to the certificate presented by the
    peer. If they match, the remote end has been authenticated. If not, the connection
    will be dropped.


