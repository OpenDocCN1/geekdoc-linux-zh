    # Troubleshooting


    PPP over SSH is a tricky beast. The following sections discuss several helpful
    trou-shooting measures you might need when trying to get it working.


    # PPP Failures


    If pppd is failing to properly set up a PPP connection, the debug option on both
    ends to see why pppd is failing and review your system logs.


    If you''re having trouble seeing debugging information, make sure you have syslog
    configured to report all debugging messages. pppdconf is typically compiled to
    use the daemon-facility, so make sure your /etc/syslog.conf has a line similar
    to daemon.debug /var/log/messages. You might instead want to use the logfile option
    to view pppd.


    If you''re having PAP or CHAP authentication problems, consider using the show-password
    argument to pppd for additional debugging. You might want to turn off PAP or CHAP
    requirements until you verify that they are the source of the problem.


    If your PPP connection is being established correctly but you''re not getting
    routes, make sure your scripts are being called from ip-up in an appropriate way
    for your Linux distribution. Also make sure you have values set for client_network
    and server_network in the VPN configuration file. To verify your syntax, you might
    want to try adding the route manually using the value you specified in those variables.


    # SSH Failures


    Try to ssh manually from the client to the server (using the same arguments you
    intend to use for the VPN) and see if you can get in without a password. If set
    up properly, the remote end should automatically start pppd, and you should see
    the PPP handshake junk on your screen.


    If you get the error Aborted by user, make sure you do not have BatchMode set
    for your SSH login until you have accepted and verified the server''s host key.

    Make sure you have placed the public key in the correct client file: ~/.ssh/authorized_keys
    for SSH1, ~/.ssh/authorized_keys2 for SSH2.'
