    # Configuring /etc/resolv.conf


    The file /etc/resolv.conf dictates how your machine should perform DNS lookups.
    For example, the following /etc/resolv.conf file says to query the name servers
    on 127.0.0.1 and 345.6.7.8 (the DNS server at our ISP) for DNS responses, and
    that when a nonfully qualified hostname such as test is requested, to first try
    test. example.com and then test.example.org:


    ```

    search example.com example.org

    nameserver 127.0.0.1

    nameserver 345.6.7.8

    ```


    The resolv.conf file that works for you when connected to the Internet in general
    might not be suitable when you are using your VPN. In our network diagram, we
    have DNS servers (Cubes and Braves) inside the Chicago office that can provide
    lookups for the internal machines such as blackhawks.chicago.example.com; however,
    these machines are only available using the VPN.

