- img_proc: true
  md: 'The user program creates users with a locked password by default, ensuring
    that no one can log in to this account. The only way in these accounts can be
    accessed for now is using /bin/su as root. Later, we will set special SSH access
    to these user IDs. The home directory for this user is traditionally /opt/ssh-vpn.
    Although this user is going to be used more like a software product, installing
    in /opt (or /usr and so on) seems more in line with its function. Thus, hereafter
    we will use /opt/ssh-vpn, though you can use anything you want.


    # Naming Conventions


    To keep our two hosts straight, we will call the machine that starts the process
    VPN client and call the other machine the VPN server. The VPN client will use
    SSH to connect to the VPN server.

    We must also come up with a name for ourVPN. For some examples, we will use vpn1.
    Our scripts can establish more than one VPN at a time, and this name helps differentiate
    them.


    # Establishing Passwordless SSH Login


    Our VPN on the VPN client must be able to log in to the VPN server without a password.
    We can do this in several different ways with SSH. The two standard methods are
    host-based authentication and SSH identity authentication. Other methods, such
    as kerberos, generally involve too much maintenance and hassle to use in situations
    such as ours.


    Host-based authentication involves establishing a trust relationship between hosts;
    in this relationship, any user on one host (client) can log in to the other host
    (server) without a password. Without going into too much detail, this involves
    installing a copy of the client''s SSH public key onto the server in /etc/ssh/ssh_known_hosts
    and putting the client machine name into /etc/hosts. When the client connects,
    the host key it presents is checked against the host key stored in that file.
    If they match, the server knows the client is authentic, and the user is allowed
    in without a password. We will see later how SSH keys work when we establish our
    actual connection. If you want to use host-based authentication for other projects,
    consult the sshd manual page for details.


    The problem with host-based authentication is that it allows all users on the
    client to log in to the server without restrictions. In our situation, we want
    only one specific user to be able to log in, and we will be placing restrictions
    on the command that that user can run and by denying interactive logins altogether.
    Thus, host-based authentication is overly permissive for our needs.


    An SSH identity is a public/private key pair that is housed on the $HOME/.ssh/
    client. By placing the public key of this identity in the authorized_keys file
    on the SSH server, any user that has the correct identity can log in to the server.
    Normally, these identities are created such that they require a passphrase to
    be used.'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'Thus, a model using an SSH identity will allow the VPN user on the client to
