- img_proc: true
  md: 'used—but with the Microsoft implementation of PPTP. Unfortunately, Microsoft''s
    implementation is the only one you''re likely to use because it''s the only one
    supported by Windows machines.


    The complete analysis of PPPv1 and PPTPv2 by Schneider and Mudge can be found
    at www.counterpane.com/pptp.html. Before deciding to use PPTP, we suggest that
    you read their results and decide PPTP fits your security requirements.


    Though most of Schneider and Mudge''s security concerns with Microsoft''s PPTP
    have been addressed in PPTPv2, they still sum up their opinion of the protocol
    succinctly:"At this point we do not recommend Microsoft PPTP for applications
    where security is a factor.


    # PPTP on Linux


    Though PPTP was a creation of Microsoft, the company has released the specifications
    in various documents and RFCs. Thus, it is possible for others to write software
    that supports PPTP method.


    Both server and client PPTP implementations have been created for Linux. Both
    require a version of pppd that supports the Microsoft encryption (MPPE) and authentication
    (MS-CHAPv2) extensions. A patched version of pppd was developed that supports
    these algorithms, and it is necessary regardless of whether you are supporting
    PPTP on a Linux client or server. The client has a program, ppt, that is used
    to set up outbound calls, as well as a menu-driven Perl script that can help you
    configuration. The server has a program, pptpd, that accepts inbound connections.


    # PPTP, Packet Filters, and Firewalls


    Getting PPTP to work with Linux filters or packet filters takes planning, care,
    and a healthy dose of debugging. This is mainly because you have two connections
    at work: the TCP control channel and the GRE data channel.


    # PPTP and Packet Filters Filters


    Many folks, ourselves included, like to restrict the packets that are able to
    pass through our Linux servers by implementing kernel packet filters. These are
    configured using the iptchains command for 2.2 kernels and the iptables command
    for 2.4 kernels. (If you''re using a 2.0 or older kernel, you really should upgrade.)


    In general, we like to explicitly list which packets our machine can accept and
    deny all others. If you do this, your PPTP sessions will probably not work because
    the packets are being dropped. You will need to add rules like the following:


    ```

    # For 2.2 kernels

    root@firewall# iptchains -A input -p 47 -j ACCEPT

    root@firewall# iptchains -A output -p 47 -j ACCEPT


    # PPTP Servers

    root@firewall# iptchains -A input -p TCP -d 0.0.0.0/0 1723 -j ACCEPT

    root@firewall# iptchains -A output -p TCP -s 0.0.0.0/0 1723 -j ACCEPT

    ```'
