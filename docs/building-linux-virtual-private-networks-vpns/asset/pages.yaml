  md: '# Configuration 323


    +   * TCPOnly = <yes | no> If you are behind a firewall or are having problems
    with tinc sending data over UDP as underlying transport, you might want to restrict
    tinc to only TCP. As of version 1.0pre4, this option is experimental but it is
