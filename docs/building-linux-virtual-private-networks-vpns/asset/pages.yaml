  md: '# Chapter 3 Building a VPN with SSH and PPP


    ![](img/ac8d70f99c3fa1e7029fbd036fc254da_87_0.png)


    Figure 3.1 Our VPN network.


    We will show you how to create a VPN using the same protocols but in greater detail
    with some features not available or discussed in the HOWTO, as follows:


    +   - Both client and server run their software as a dummy user, not root. The
