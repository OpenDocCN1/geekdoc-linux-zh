  md: '# Introduction to VPNs


    YOU''RE READING THIS BOOK BECAUSE YOU have an interest in VPNs and Linux. This
    interest is perhaps driven by a business decision that needs to be made, research
    you''re doing, or mere curiosity. Whatever the reason, the intent of this book
    is to give you a detailed description of VPNs and some specific applications that
    might meet your needs.


    As you read this chapter, keep in mind that all the intricacies of VPNs, Linux,
    and security might not be revealed or discussed all at once. It would be best
    to read through the entire chapter before you begin to decide on or design a VPN.
    Otherwise, you might miss some important information that could affect your design
    and make your implementation insecure.


    Because the topic is a bit advanced, some preliminary knowledge will be assumed.
    You will be expected to be capable of getting around the Linux operating system
    fairly easily. Where necessary, instructions will be given to configure your Linux
    system for a VPN, but those instructions will not necessarily include commonly
    used commands. If you don''t feel comfortable on a Linux system, you should read
    some of the freely available texts regarding Linux or other books like Inside
    Linux by Michael J. Tobin. If you''ve used a Linux or UNIX system a decent amount,
    however, this book shouldn''t push the limits of your knowledge too far.


    This book will also assume familiarity with basic computer-networking concepts.
    It seems as though every hard-copy text that skims the surface of computer networking'
