    # Host-Host Tunneling


    By limiting the network-network scenario, it is possible to make each of the interconnected
    networks consist of only one host. This is achieved, as before, by using 32 bits
    to specify the network address (adding /32 in the Subnet option), which corresponds
    to the netmask of 255.255.255.255.


    Fundamentally, the configuration for this scenario will be very similar to the
    one for the host-network scenario. Therefore, we will take the host-network scenario
    as a baseline from which to start and will focus on the modifications you need
    to make to get the host-host example up and running.'
