    # Recommendation 1: Consolidation of Corporate Identity


    All offices should have access through the exemplify.com domain, exemplify.de
    and exemplify.jp will be renamed to de.exemplify.com and jp.exemplify.com, respectively,
    and WWW requests will be redirected from www.exemplify.com to either we.exemplify.com
