  md: '# Incompatible Encryption Options


    You can tailor the methods of authentication and the ciphers used for your connection
    in the various ppp/pptp options files. The relevant options are as follows:


    +   +chapms

    +chapms-v2

    +mppe-40

    +mppe-128

    +mppe-stateless


    The chapms options can take a + sign at the beginning, which means they must be
    used for authentication. The mppe options, unfortunately, do not work this way.
    However, if you compiled ppp-mppe with the patches discussed earlier in this chapter
    in the section "Patching ppp-mppe Sources," you also have the following options
    available:


    +   require-mppe

    require-mppe-stateless

    chapms-strip-domain


    If your system logs suggest that proper encryption could not be established, try
    removing any require options and be sure that all mppe* and chapms* are selected.
    If the VPN establishes correctly, there is an incompatibility of allowed authentication
    or encryption between the two endpoints. Compare the options on each end to make
    sure they specify compatible settings.


    # General PPP Problems


    We discussed two different methods of establishing a VPN with PPP in Chapters
    3 and 4. If you find that you are having generic PPP difficulties, you might want
    to refer to these chapters for ideas about PPP options that might be required.
    The troubleshooting section of these chapters also includes common PPP errors
    that can affect you when using PPTP.


    # Inbound Connections to PPTP Server Denied


    If you are running the Linux PPTP server and have compiled it with --with-libwrap,
    TCP Servers may be rejecting the incoming connections. Check your entries in /etc/hosts.allow
    and /etc/hosts.deny. See man hosts.allow for information on how to configure TCP.
    You might want to temporarily add ALL: ALL to the top of /etc/hosts.allow and
    see if the connection is established. If so, then TCP Servers are certainly misconfigured.


    # PPTP VPNs Still Aren''t Working


    PPTP requires both a single TCP channel (port 1723) and GRE packets in order to
    function. R불어 the section "PPTP. Packet Filters, and Firewalls" to make sure you''ve'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# Chapter 7 PPTP


    properly configured your host or network equipment to allow these packets through.
    GRE is often not easily supported, and the packets are normally dropped on the
    floor without any error message whatsoever.


    You might want to watch where the packets are flying using tcpdump at your PPTP
    endpoint and firewall. Run the following commands, in each window:


    ```

    root@firewall# tcpdump -n proto 47 or port 1723 -i INTERFACE1

    root@firewall# tcpdump -n proto 47 or port 1723 -i INTERFACE2

    root@opt-machine# tcpdump -n proto 47 or port 1723

    ```


    Replace INTERFACE1 and INTERFACE2 with your actual ethernet/ppp interface names.
    If all is going well, you will see the same packets on each side. If there is
    not, interference by the rules on your firewall. You might want to explicitly
    log any denied packets by adding the -l option to your chains rules to see where
    packets are being dropped.


    If you already have extensive iptchains/iptables rules, you are going to have
    a potentially annoying couple of days ahead of you when you try to get everything
    tweaked just to support your PPTP VPN. Good luck.


    # The PPTP VPN Isn''t Encrypted


    One of the biggest flaws of the software we describe here is that it could be
    used to successfully establish a 100% functional network connection between client
    and server doesn''t encrypt the packets at all. This is because the mpe-* encryption
    algorithms are not required by pptp and thus might not be negotiated if not supported
    by the remote end.


    The only way to ensure your encryption on your VPN is to apply the require-mppe
    patch (described in the section "Patching ppp-mppe Sources" earlier in this chapter)
    and make sure you have the following in your pptp options file:


    +   - require-mppe

    - require-mppe-stateless


    Make sure you check the VPN packets using tcpdump or other tools to verify that
    the packets are in encrypted, lest you implement a very insecure VPN.


    # Summary


    PPTP is an annoying beast. Though it is a generic protocol, the only version one
    created by Microsoft. This version has been improved, it still has intrinsic and
    documented flaws that make most cryptographers and security professionals grouse
    and I recommend against it.


    We recognize that there are times when you must connect to a server that only
    runs PPTP, either because you need to support Windows client machines. In either
    of these cases, we offer our deep sympathies.


    In any case in which both endpoints support stronger VPN technology, such as IPSec,
    we recommend that you avoid PPTP entirely.'
  merge: -1
