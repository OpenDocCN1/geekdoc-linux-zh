    # VPN Scripts


    As you can see, setting up a secure VPN with Stunnel and PPP involves many steps.
    In an effort to make it simpler, we now present the scripts we use to create such
    tunnels easily. First, here is the complete checklist you will need to follow
    to get your Stelnel/PPP VPN up and running:


    +   1. Install PPP.

    2. Set up IP forwarding.

    3. Set up the sslvpn users on both systems, including home directories.

    4. Pick a VPN name (we''ll use vpnpt).

    5. Create your SSL keys and certificate on the client and server.

    6. Distribute the certificates to both hosts and create the hash. symlink.

    7. Set up sudo on both machines.

    8. Set up PPP authentication via /etc/ppp/{pap, chap}-secrets, if desired.

    9. Install the scripts vpn-server and vpn-client in /opt/ssl-vpn/bin.

    10. Create a symlink to vpn-client or vpn-server in /etc/init.d.

    11. Configure pppd to run our VPN scripts via ip-up.

    12. Create our VPN configuration files.

    13. Start the VPN.


    We already discussed items 1 through 8 in this chapter, so refer to the appropriate
    sections to set them up.


    # Installing vpn-server and vpn-client


    Two programs are needed for our VPN connection: vpn-client launches a PPP connection
    to the server over Stunnel, and vpn-server launches a daemon to run its own copy
