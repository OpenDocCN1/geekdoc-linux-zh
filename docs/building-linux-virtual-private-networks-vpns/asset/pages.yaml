  md: '# Setting up PPP over SSL/TLS Manually 107


    # Enabling Linux IP forwarding


    Most Linux distributions do not allow IP packet forwarding by default, but we
    must enable this to route VPN packets through the PPP interface. You can change
    the status of IP forwarding by modifying the appropriate kernel parameter. Though
    it is possible to recompile your kernel to the default settings, the easiest way
    is to use the /proc file system. In /proc are not actually files but ways of accessing
    and/or modifying kernel parameters, and you must to change these. Thus, the simplest
    way to turn on port forwarding is to run the following command:


    ```

    root# echo 1 > /proc/sys/ipv4/ip_forward

    ```


    This automatically turns on IP forwarding on all interfaces by default. If you
    are making a host-host VPN, this is sufficient. If you want to create a network-network
    or host-network VPN, you might want to turn on IP forwarding for only those interfaces
    that you explicitly want to forward. For an example of how you can do this, see
    the section "Enabling IP Forwarding" in Chapter 3,"Building a VPN with SSH and
    PPP"


    # Creating the VPN Users


    Next, you must create the user that will be running the VPN commands on both ends.
    We will assume you use the username sslvpn on both ends, though you can use any
    username you want. Although the usernames do not have to be the same on both machines,
    it makes things easier. For example, you might create the user as follows:


    ```

    root# groupadd sslvpn

    root# useradd -m -d /opt/ssl-vpn -c "SSL VPN User" -g sslvpn sslvpn

    ```


    A sample /etc/shadow entry might look like this:


    ```

    sslvpn::11429:0:99999:7::

    ```


    The useradd creates users with a locked password by default, ensuring that no
    one can log in to which these accounts can be accessed for now is by using /bin/su
    as root. The home directory we use for this user is traditionally /opt/ssl-vpn.


    Although we could have created the home directory in /home, this user is going
    to be used more like a software product. Thus, installing in /opt (or /usr and
    so on) seems more in line with its function. So, hereafter we will use /opt/ssl-vpn,
    though you can use anything you want.


    # Naming Conventions


    To keep our two hosts straight, we will call the machine that establishes the
    VPN client and call the other machine the VPN server. The VPN client will establish
    an SSL connection to the VPN server.'
