    # cp -f rsakey.tmp /etc/ipsec.secrets


    # Symmetric Key Generation


    Using a symmetric cipher for IKE encryption is slightly simpler than using the
    RSA cipher. Performance is a little better because public-key ciphers are more
    computationally intensive, but that shouldn''t be an issue. Be aware, however,
    of the pitfalls when using a symmetric cipher.

    To generate a symmetric key, enter the following command:

    # ipsec --continuous 128 > secretkey.tmp


    This will place a pseudo-randomly generated number into the file secretkey.tmp.
    You then need to add some configuration text to this file to make Free/WAN understand
    it. Also, where we previously used the "RSA" to identify an RSA key, we will now
    use the "PSK" (private shared key) identifier to denote a secret key.

    The resulting file looks like this:


    ```

    @ex1.example.com

    @ex2.example.com:

    PSK "<randomly generated number in hexadecimal>"

    ```


    If we created a secret key as:

    0x4e4cfabea0714f72d582892cd08078a6


    Our /etc/ipsec.secrets file would look like this:

    @ex1.example.com:

    @ex2.example.com:

    PSK "0x4e4cfabea0714f72d582892cd08078a6"


    Notice that there are two indices for this key because this tells Free/WAN which
    key to use for which hosts. Also note that the entry is split across multiple
    lines and that every line is indented with a <TAB>. This is absolutely necessary.
    Otherwise, Free/WAN will interpret the unindented lines as separate entries.

    More than two indices share the same PSK key, but this is not recommended. Although
    it could make key management easier, it introduces too many points of failure
    within your VPN. It''s best to use only PSK keys between two hosts.


