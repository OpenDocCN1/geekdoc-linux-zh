- img_proc: true
  md: '# CIPE Transfer Protocol


    CIPE uses this protocol to transmit data encrypted using the two ciphers described
    earlier. CIPE currently supports versions 3 and 4 of its transfer protocol.


    Version 3 is the default protocol. It should generally be used and, although it
    only supports IP over IP and not other formats of data to be encapsulated. If
    you want to use CIPE to tunnel OSI Layer 2 packets (Ethernet, for example) or
    other protocols, use version 4.


    Version 4 is more flexible and can be used to encapsulate multiple protocols.
    In most cases, this version of the CIPE protocol is used to make CIPE act as an
    encryption-bridge, tunneling Ethernet frames. See the section "Compiling CIPE"
    for more information on how to tell CIPE to use this version of the protocol.


    # Implications of Using CIPE as an Encrypting Bridge


    If you want to use CIPE as an encrypting bridge, you should be aware of possible
    security and performance issues associated with this.


    If you tunnel all traffic in and out of your intranet, then all the higher level
    protocols encapsulated in the Ethernet frames that were not recognized by your
    firewall rules (lpx/spx, for example) will pass through. To stay in control of
    what goes in and out of your network, you will need to set up your firewall to
    lock into each Ethernet frame or filter traffic before the tunneling occurs. In
    addition, analyzing each packet can also be costly from a performance viewpoint.


    Note that the performance of your system might also decrease significantly if
    broadcast traffic is tuned. Because the CIPE machine is going to act as a bridge,
    its Ethernet interface will be put in promiscuous mode, and the interface will
    see all the traffic on the media, including broadcast frames. Sometimes there
    can be a lot of such frames, particularly with Microsoft domain protocols, which
    are known to generate huge amounts of broadcast traffic. These frames can easily
    clog your tunnel and your tunneling machine down because of the additional cycles
    required to encrypt and decrypt broadcast traffic.


    # Installation


    We will now go through a detailed description of CIPE installation. Remember that
    you will need to execute all commands in a superuser mode, as follows:


    ```

    [root@root]# id

    uid=0(root), gid=0(root), groups=0(root),1(bin),2(daemon),10(wheel)

    ```


    You will also need the latest version of the CIPE package. See http://sites.inka.de/sites/bigred/deved/cipe.html.'
  merge: -1
  pgno: 285
