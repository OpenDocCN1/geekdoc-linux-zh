    # All Host Configuration Options


    Host configuration options include the following:


    +   - <IP address | hostname> This option is only required if you want to be able
    to connect to the host you are configuring. The IP address you specify must be
    a routable IP address at which the host is reached, or the address of a host in
    a VPN.

    - IndirectData=<yes | no> This option indicates whether other demons besides the
    one you specified with the ConnectTo option in tinc.conf can make a direct connection
    to the host. By default, connections from outside are disabled.

    - <port> Using this option, you can select a port on which to accept incoming
    connections. The port number will be used for both TCP and UDP transports. The
    default value for the port is 655, which is officially registered with IANA. The
    value can be specified as a decimal (by default), an octal (when preceded by a
    single zero), or a hexadecimal (prefixed with "0x") tuple, or in "FFFF".

    - Subnet = <IP address/netbits> This option determines the range of IP addresses
    that will be accepted by the host for which the option is defined. The range must
    be a subset of the VPN network specified for the tap device, not of the real network
    to which the host is connected.


    The netbits part of the option details the length of the network part of the IP
    address. For instance, if your mask is 255.255.255.0, the number of network bits
    should be /16. For a mask of 255.255.255.240, the number of network bits should
    be /28. This notation is the same notation used by Classless Interdomain Routing
    (CIDR), defined in RFC 1519.'
