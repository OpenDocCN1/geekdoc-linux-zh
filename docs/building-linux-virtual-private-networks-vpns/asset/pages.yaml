    # # Selecting a Cipher


    IF YOUR VPN package supports MULTIPLE ciphers, you might wonder whether the cipher
    used by default is good enough for you. To determine the cipher that is adequate
    for your needs, you might find it helpful to learn about popular ciphers and the
    criteria you can use to select them. In addition, it is essential to understand
    what parameters ciphers might have and what those parameters mean.


    Note that selecting an adequate cipher is only one piece of the puzzle. For example,
    one of the other pieces is key distribution. If you have not solved the problem
    of distributing keys the most advanced cipher will not help you. If security is
    a big concern, we recommend that you conduct a detailed risk assessment of various
    components of your VPN. It should give you an idea of what other elements you
    might need to adjust in addition to selecting a different cipher.


    In this appendix, we will focus on six symmetric ciphers: 3DES, AES Rijndael,
    RC4, Blowfish, IDEA, and CAST. We will briefly evaluate these ciphers based on
    each of the following criteria: security, performance, and availability. We will
    also describe the generic parameters that these and other ciphers can have, such
    as key length, block size, and mode (ECB, CBC, OFB, CFB, and so on).


    The other goal we have for this appendix is to discuss the selection of parameters
    for asymmetric ciphers. We will not talk about choosing an asymmetric cipher because
    currently there are not many to choose from. (RSA and DSA are the two algorithms'
  merge: -1
  pgno: 368
- img_proc: true
  md: '# 352 Appendix B Selecting a Cipher


    that dominate.). Instead, we will explain to you how different parameters affect
    security and performance of an asymmetric cipher.


    The examples in this section will be based on the OpenSSL v0.9.6b, a free cryptographic
    library used by many open-source VPN packages as well as other popular soft-ware,
    such as Apache, OpenSSH, sendmail, and Samba.


    # Essential Cipher Parameters


    This section provides a description of several important cipher parameters, such
    as key length, key lifetime, and cipher modes, as well as our recommendations
    for how to choose the parameters.


    # Key Length and Lifetime


    We will begin describing typical key lengths. Key lengths used these days are
    usually 128–256 bits as well as 1024–4096 for symmetric and asymmetric ciphers,
    respectively. The maximum number of attempts that an attacker would need to break
    the ciphers with such key lengths using brute force is $2^{128}$–$^{256}$ for
    symmetric and $2^{1024}$–$^{4096}$ for asymmetric. Note that even a 128-bit key
    ($2^{128}$ keys to try) can keep the attacker capable of one terabyte of attempts
    per second busy for a while—close to $10^{20}$, which is longer than the age of
    the universe. So what is the best way to choose a key length?


    There are several important points to consider when deciding on key length for
    both symmetric and asymmetric ciphers.


    First, do not rely on key length itself to guarantee security. In principle, the
    strength of a cipher should be determined by its key length; in practice, the
    cipher’s design is just as important. Increase key length if you want more security,
    but do not underestimate the importance of other factors such as key distribution
    and the cryptographic strength of the cipher you are using.

    Second, many packages use both symmetric and asymmetric ciphers as a method to
    increase the security of the overall solution. However, the security of a system
    is only as great as the security of its weakest link. If you use RC4 with 40-bit
    keys as your symmetric cipher and 2048-bit RSA as your asymmetric cipher, there
    is a good chance that RC4 is your weakest link. In this case, you have at least
    two options. One is to improve the security of the system by increasing the RC4
    keysize or switching to a different cipher with bigger keys. The other option
    is to stick with 40-bit symmetric keys and decrease the RSA keys to 512-bit. It
    probably will not make the level of security of your system any lower because
    it is already low enough. For medium security, we recommend 128–bit symmetric
    with 2,048-bit asymmetric keys. For high security, 256–bit symmetric with 4,096–bit
    asymmetric keys should suffice for this time. This might entail additional planning,
    however, particularly because many symmetric ciphers only support 128-bit keys.'
  merge: -1
  pgno: 369
- img_proc: true
  md: '# Essential Cipher Parameters 353


    Third, the lifetime of a key is important. If you select it when selecting a cipher,
    we lightly encourage you to do so. A Corollary is that the frequency of a key
    change can be crucial as well, particularly for symmetric ciphers. Nevertheless,
    the rapidly growing availability of centralized and distributed computing power
    will always have a tidal effect on the operational decision-making processes of
    those who desire to protect information with any cryptographic measures.


    [--]


    Note

    Note that some packages, as tinc or clpe, renegotiate symmetric keys for you automatically.
    Usually this happens after a certain number of packets have been transmitted.
    Thus, you might not need to change keys yourself if you turn this option on in
    the package you are using.


    # Modes


    You might have already heard about different modes in which block ciphers can
    work. You can use modes to make your system more secure, efficient, and fault
    tolerant.

    Here is an example:


    ```

    OpenSSL enc ?

    -des-ecb -des-cbc -des-cfb -des-ofb -des (des-cbc)

    -des-ede -des-ede-cbc -des-ede-cfb -des-ede-ofb -desx none

    -des-ede3 -des-ede3-cbc -des-ede3-cfb -des-ede3-ofb -des3 (des-ede3-cbc)

    -idea-ecb -idea-cbc -idea-cfb -idea-ofb -idea (idea)

    -rc2-ecb -rc2-cbc -rc2-cfb -rc2-ofb -rc2 (rc2-cbc)

    -bf-ecb -bf-cbc -bf-cfb -bf-ofb -bf (bf-cbc)

    -cast5-ecb -cast5-cbc -cast5-cfb -cast5-ofb -cast (cast5-cbc)

    -rc5-ecb -rc5-cbc -rc5-cfb -rc5-ofb -rc5 (rc5-cbc)

    ```


    In this example, we obtained a list of supported ciphers for OpenSSL. You see,
    each of these ciphers has a three-letter mode appended to it. There are four supported
    modes: Electronic Codebook (ECB), Cipher Block Chaining (CBC), Cipher Feedback
    (CFB), and Output Feedback (OFB).

    If a cipher runs in Electronic mode, it means the cipher will encrypt each block
    independently. The advantage of this is its simplicity. Operations on blocks can
    be done in parallel as well, which might make your system more efficient. The
    major problem of this mode is that an attacker can detect patterns and change
    a secure message by rearranging, repeating, or removing blocks without knowing
    the key.

    If a cipher uses Cipher Chaining, encrypted blocks depend on each other. More
    specifically, the plaintext of the current block is XORed (that is, exclusively
    added so that the resulting bit is 1 if either the current bit of the block or
    the XOR mask is 1) with the ciphertext of the previous block and then encrypted.
    The advantage of this mode is that an attacker can''t change one block'
  merge: -1
  pgno: 370
- img_proc: true
  md: '(except for the last one) without affecting the others. The drawback is that
    very long messages will still have patterns.


    The other two modes—Cipher Feedback and Output Feedback—are similar to each other.
    In CFB mode, the current plaintext is XORed with the ciphertext of the previous
    block. In OFB mode, the current plaintext is XORed with a value that does not
    depend on plaintext or ciphertext.


    One of the advantages of CFB mode is that it makes it possible for a block cipher
    to encrypt less data than a block size. This way, for example, 1 byte of data
    can be encrypted immediately without waiting for the other 7 bytes (for a 64-bit
    cipher) to arrive. The disadvantage of CFB is that bit errors occur during transmission
    affect the decryption of subsequent blocks. OFB addresses this issue and is considered
    to be more tolerant; however, OFB has its problems. In particular, if attackers
    know one of the plaintext blocks, they can replace it with a false one. There
    are other problems with OFB, so an additional mode was proposed to fix them (Counter
    mode).


    This is by means no comprehensive overview, but by now, you have at least a basic
    idea of what different ciphers actually mean. We prefer CBC or CFB because ECB
    is not the most secure of the four and OFB has its own problems. There is no universal
    solution, so we recommend you take a closer look at each mode and decide which
    one is best based on your priorities and the results of a risk analysis. In short,
    weigh the options based on cost, long-term support options, and functionality.
    Note that the cost of protecting your information should always be quantifiably
    less than the cost of its compromise.


    # Selection Criteria


    In this subsection, we consider six popular symmetric ciphers in light of three
    selection criteria: security, performance, and availability.


    # Security


    Although all six of the popular symmetric ciphers we are considering (3DES, AES
    Rijndael, RC4, Blowfish, IDEA, and CAST) are relatively secure, some of them are
    believed to provide a higher level of security than others. In the paragraphs
    following, we will select our top three ciphers out of the six symmetric ciphers.


    First, it is our belief that, all things being equal, one of the best tests of
    a security solution is time. If a cipher has been known and used for years with
    its details openly published, there is a good chance that if it had any major
    flaws, they already would have been found. There is no guarantee of this, however,
    it is likely that the flaws would have been found. Therefore, it is generally
    a good idea to stick with older, well-tested ciphers.


    Coming from this point of view, a typical example of such a cipher would be 3DES.
    3DES itself is not old, but it is based on DES, which has been known for'
  merge: -1
  pgno: 371
- img_proc: true
  md: '# Selection Criteria


    several decades. One of the major problems with DES is its size: it uses 56-bit
    keys (with the remaining 8 bits used for error detection) that can be attacked
    using brute force in a matter of days, sometimes even hours. To fix the problem,
    the 3DES ciphers use either two 56-bit keys combined into one 112-bit key or three
    56-bit keys combined into one 168-bit key. Thus, if you prefer the time-test argument,
    use 3DES. On that basis, we will put it as number one on our list.


    Recently, an Advanced Encryption Standard algorithm designed to replace DES was
    finally selected after several years of analysis and competition. The winner is
    called Rijndael. The cipher has undergone a lot of scrutiny by security experts
    throughout the world and has been competing with a number of other highly praised
    ciphers. As a direct result of the comprehensive analysis and comparison, we decided
    to put AES Rijndael as number two on our list.


    Finally, many experts, including the famed author of Applied Cryptography, Bruce
    Schneider, believe that IDEA is currently one of the most secure ciphers (though
    bad it is patented). Because of its strong mathematical basis, we make IDEA our
    third choice.


    In addition to selecting the top three ciphers, the following is a list of the
    supported parameters for each cipher we are considering:


    +   * 3DES. 112- or 168-bit keys, 64-bit blocks.

    * AES Rijndael. 128-, 192-, or 256-bit keys; 128-, 192-, or 256-bit blocks.

    * IDEA. 128-bit keys, 64-bit blocks.

    * Blowfish. Up to 448-bit keys, 64-bit blocks.

    * RC4. 40- or 128-bit keys, stream cipher (no blocks).

    * CAST. 40- or 128-bit keys, 64-bit blocks.


    # Performance


    To determine the performance of our six symmetric ciphers, we used a PC with 750Mhz
    Intel Process and 1GB of RAM. The PC was running Linux with 2.4.3-SMP kernel.
    The following is the performance chart we obtained using the OpenSSL library interface
    (YMMV):


    ```

    [root@fox] # openssl

    OpenSSL speed

    ---

    OpenSSL 0.9.6b 9 Jul 2001

    built on: Mon Jul 9 22:39:13 PDT 2001

    options:sb(64,32) md2(int) rc4(idx,int) des(ptr,ris1,16,long) idea(int)

    blowfish(idx)

    ```


    ```

    compiler: gcc -FPIC -DTHREADS -D_REENTANT -DDSO_LFCN -DHAVE_LFCN_H -DL_ENDIAN

    TERCIO -O3 -fomit-frame-pointer -m4

    B6 -Wall -DSHA1_ASM -MD5_ASM -DRMD160_ASM

    ```'
  merge: -1
