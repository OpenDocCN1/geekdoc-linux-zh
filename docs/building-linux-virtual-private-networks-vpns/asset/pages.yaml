    # # 9

    cIP


    WHEN YOU WANT TO BUILD A VPN, especially if you are using UNIX frequently, you
    often tend to use simpler, more lightweight packages as low-level tools on which
    to build. Later you might want to add scripts, cron jobs, and other neat things,
    so it is important for the package you select to be highly customizable and simple.


    Many of the lightweight packages designed to fill this niche end up leaving important
    features behind in trying to trade functionality for simplicity. However, many
    are providing more or less the necessary minimum of functions you need to build
    a secure private network. In this chapter, we will describe one such package called
    cIPE.


    # ## Overview of cIPe


    Crypto IP Encapsulation (cIPe) is a simple, lightweight package that provides
    for tunneling encrypted IP packets over UDP. The package is available under GNU''s
    GPL and can be downloaded freely. The examples in this chapter will be based on
    the version 1.5.1 of the package, which supports Linux kernel v2.{2, 3, 4}.* and
    primarily focuses on the i386 platform. Although there is a port of cIPe to Windows
    NT, given the focus of this book, we will concentrate on the Linux implementation.'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# cIPE Components and Their Functions


    The cIPE package (in the rest of this chapter we will refer to as "CIPE" or "the
    package") consists of a kernel module and a user-level managing utility implemented
    as a daemon (ciped).


    # Kernel Module


    The kernel module performs various operations pertaining to the handling of IP
    packets, such as transceiving as well as encrypting them using a symmetric cipher.
    The kernel module realizes a virtual network device that can be configured and
    used for routing, just like all other network devices as eth0, ppp0, and so on.


    The name of the device depends on the protocol version as used; typically, it
    is cipe. The last three letters of the device name represent version 3 of the
    CIPE protocol (a, b, c=3), Blowfish symmetric cipher (b), and the index of the
    network device (0, 1, ..., n), respectively. The kernel module is named the same
    except for the device number, which is not present. For example, the default name
    of the kernel module is ciped.


    # User-Level Managing Utility


    The user-level ciped uses naming principles and is often called cipedcb, for that
    matter. This is done so that the utility can co-exist with other CIPE implementations
    that use different versions of CIPE and encryption protocols. The primary task
    of the utility is to perform key exchange and configuration of the CIPE package.


    Note that cIPE always operates on point-to-point links. A simple analogue of this
    setup be a PPP connection. If you have tried to set ppp0 up, you probably know
    that both have interfaces associated with them, and each interface must be assigned
    an IP address, MTU, and so forth; indeed, it would look something like this:


    ```

    # ifconfig -a

    ```


    ```

    ppp0 Link encap:Point-to-Point Protocol

    inet addr:xxx.xxx.xxx.1 P-T:xxx.xxx.xxx.2 Mask:255.255.255.255

    UP POINTPOINT RUNNING NOARP MTU:576 Metric:1

    RX packets:156 errors:0 overruns:0 frame:0

    TX packets:0 errors:0 dropped:14836 135 overflows:0 carrier:0 collisions:0

    ```


    ```

    ciped Link encap:IP Tunnel Hwaddr

    inet addr:yyy.yyy.yyy.1 P-T:yyy.yyy.yyy.2 Mask:255.255.255.255

    UP POINTPOINT NOTRAILERS RUNNING NOARP MTU:1442 Metric:1

    RX packets:0 errors:0 overruns:0 frame:0

    TX packets:0 errors:0 dropped:0 carrier:0 collisions:0

    ```


    Conversely, ciped is similar to pppp in many ways. First, there is one copy of
    ciper active ciped device. Second, ciped''s /etc/cipe/options configuration file
    somewhat resembles /etc/ppp/options. Finally, both ciped and pppp execute ip-up
    and ip-down scripts when links go up and down, respectively.'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# Overview of CIPE 267


    By drawing a parallel between pppd and ciped, we are trying to instill a mental
    picture of CIPE as a point-to-point concept. You will need this to better understand
    the sample VPN configuration we are going to introduce later in this chapter.


    # Public-Key Configuration Utility


    Starting with version 1.5, CIPE supports a public-key exchange algorithm (Diffie-Hellman)
    as well as RSA signatures. To configure and perform an initial key exchange, an
    additional security utility called pkcipe is included in CIPE distribution.


    The pkcipe establishes a TCP connection between two endpoints of a CIPE point-to-point
    link, exchanges public keys, and determines a shared key to be used by the ciped
    utility to symmetrically encrypt the data. The public-key exchange is done, pkcipe
    generates a configuration file that contains the secret key it negotiated and
    executes ciped with the new configuration file.


    Thus, pkcipe is aimed at facilitating the life of a network administrator and
    eliminating the need to manually distribute shared keys as described earlier.
    CIPE still supports the old way of manually distributing shared keys, however,
    should you decide to use it.


    # Supported Cryptographic Algorithms and Protocols


    In the following subsection, we will provide an overview of the cryptographic
    protocols and algorithms you can use with CIPE.


    # Blowfish, IDEA, Diffie-Hellman


    Originally, CIPE was designed to be very lightweight, so it relied on a network
    administrator to add a 128-bit static secret key to CIPE configuration files on
    both sides of a point-to-point link. This key was used to negotiate a dynamic
    session key that could be changed repeatedly and as a key with the supported symmetric
    cipher schemes CIPE could employ to encrypt tunneled data. This mechanism is still
    employed by CIPE, although a special add-on utility is now included, mentioned
    earlier, that performs Diffie-Hellman-based exchange.


    As of version 1.5.1, CIPE supports two symmetric ciphers, namely Blowfish and
    IDEA, both of which use 128-bit keys. Which of these ciphers should be selected?
    It depends on your goals. When making a decision, you might want to consider that
    IDEA is patented to ensure there are no legal problems.


    # The Default Cipher is Blowfish


    CIPE will use Blowfish by default unless you specify --enable-idea when configuring
    the package. See the section "Compiling CIPE" in this chapter.


    If you are looking for an industry-level solution, we recommend that you look
    at the packages that support most recent symmetric ciphers such as AES (Rijndael),
