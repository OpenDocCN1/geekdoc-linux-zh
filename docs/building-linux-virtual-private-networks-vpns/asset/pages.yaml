  md: '# Chapter 3 Building a VPN with SSH and PPP


    # Use the Most Recent OpenSSH


    This is just another reminder that you should make sure you''re using the most
    recent version of OpenSSH. For example, versions of OpenSSH before 2.9.p2 have
    a bug in which a user with a valid SSH identity can establish an SFTP session
    to the server and bypass the identity restrictions. (This is only possible with
    the SSH2 protocol. If an attacker has this identity, he or she could remove the
    command restriction simply by replacing the authorized_keys file with a new one
    that didn''t have the command option. If you cannot upgrade your OpenSSH server,
    at least comment out the Subsystem sftp line in /etc/ssh/sshd_config.


    # Running a Custom ssh Daemon on the VPN Server


    You can use your existing ssh daemon on the VPN server for the VPN''s SSH logins.
    However, if you want to be more restrictive—the defaults for SSH are overly permissive
    for our purposes, and healthy paranoia is always a good thing—you can run a separate
    sshd daemon on the VPN client


    All we need to create a second sshd_config file that specifies a different port
    number than the default (22) and our restrictive options. The shdpn user on the
    client connects to this sshd daemon instead. Here is how our new sshd_config,
    which we place in /opt/ssh-vpn/etc:


    ```

    Port 9876

    PidFile /var/run/ssh/sshd.pid


    HostKey /etc/ssh/ssh_host_key

    HostKey /etc/ssh/ssh_host_rsa_key

    HostKey /etc/ssh/ssh_host_dsa_key


    ServerKeyBits 768

    LoginGraceTime 600

    KeyRegenerationInterval 3600


    SyslogFacility AUTH

    LogLevel INFO


    RSAAuthentication yes

    AllowUsers shdpn


    # Restrictive settings

    #

    IgnoreHosts yes

    IgnoreUserKnownHosts yes

    PermitRootLogin no

    StrictModes yes


    PasswordAuthentication no

    PermitEmptyPasswords no

    ChallengeResponseAuthentication no

    RhostsAuthentication no

    ```'
