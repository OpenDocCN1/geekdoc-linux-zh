  md: '# The PPTP Protocol 203


    ```

    # PPTP Clients

    root@firewall# iptchains -A input -p TCP -s 0.0.0.0/0 1723 -j ACCEPT

    root@firewall# iptchains -A output -p TCP -d 0.0.0.0/0 1723 -j ACCEPT

    ```


    # For 2.4 kernels


    ```

    root@firewall# iptables -A INPUT -p 47 -j ACCEPT

    root@firewall# iptables -A OUTPUT -p 47 -j ACCEPT

    ```


    ```

    # PPTP Servers

    root@firewall# iptables -A INPUT -p TCP -d 0.0.0.0/0

    --destination-port 1723 -j ACCEPT

    root@firewall# iptables -A OUTPUT -p TCP -s 0.0.0.0/0

    --source-port 1723 -j ACCEPT

    ```


    ```

    # PPTP Clients

    root@firewall# iptables -A INPUT -p TCP -s 0.0.0.0/0

    --source-port 1723 -j ACCEPT

    root@firewall# iptables -A OUTPUT -p TCP -d 0.0.0.0/0

    --destination-port 1723 -j ACCEPT

    ```


    These rules simply say to allow inbound and outbound packets that match the two
    connections used by PPTP. Make sure to allow the server or client rules as appropriate
    (You could apply all rules and things will still work; you''ll have some extraneous
    ACCEPT rules.)


    # PPTP and Firewalls


    PPTP does not play well with firewalls that perform IP masquerading. Masquerading
    is the method that a Linux firewall can use to allow multiple machines inside
    to access the Internet. All the packets to and from the Internet appear to come
    from the firewall itself, which handles rewriting the packets and sending them
    back into the machines that established the connections.


    An iptchains/iptables masquerading works great for TCP and UDP protocols. These
    are annoying protocols, such as FTP; that are difficult to support because they
    use multiple ports at a time. Unfortunately, there is no standard module to support
    GRE and PPTP packets, and the kernel does not support this functionality.


    Thus, the only way is to patch the kernel itself to understand how to deal with
    the special GRE packets. Because its so substantial, we do not have the space
    to describe the installation and configuration that''s needed to get to this work.
    Instead, we simply refer to you to a few sources:


    +   - http://www.linux.org/HOWTO/VPN-Masquerade-HOWTO.html


    Start here, at the Linux VPN masquerade how-to. It discusses supporting PPTP,
    IPSec, and others.'
