    DNS MX records, with mail.exemplify.com listed with a priority of 10 and de.exemplify.com,
    jp.exemplify.com listed with a priority of 20. This will cause the North American
    email server to be chosen first and the other email servers to failover in case
    the North American server is unreachable. Internally, employees of each office
    will use their local email server, and that server will forward the email to the
    appropriate server delivery.


    When the North American SMTP server receives an email message, it is analyzed
    and passed on to the appropriate POP server for that address. For instance, if
    the North American server receives an email address to to an employee in Japan,
    the email server then forwards the email to pop.jp.exemplify.com, where it is
    delivered to the intended recipient.'
