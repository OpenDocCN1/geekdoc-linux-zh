    # Linking to vpn-{server,client} in /etc/init.d


    Scripts used to start and stop system services are located in the /etc/init.d
    directory.(On some Linux distributions, notably earlier Red Hat systems, they
    are kept in /etc/rc.init.d instead). These scripts are linked from one of the
    /etc/rc.x directories to determine in runlevel the service should be active.

    Our scripts are designed to be run directly as one of these start/stop scripts,
    so all we need to link them. Let''s say we want to have our VPN named vpn start
    in runlevel 2. We create the following:


    ```

    bears-server# ln -s /opt/ssh-vpn/bin/vpn-server /etc/rc2/S9vpn

    bears-server# ln -s /opt/ssh-vpn/bin/vpn-server /etc/init.d/vpn1


    falcons-client# ln -s /opt/ssh-vpn/bin/vpn-client /etc/rc2/D269vpn

    falcons-client# ln -s /opt/ssh-vpn/bin/vpn-client /etc/init.d/vpn1

    ```


    These commands set up our VPN to be started as the last program as runlevel 2
    is begun. You can change the 99 to be appropriate for your system. We''d also
    create a generic init.d entry for ease of use.


    # Configuring ip-up to Run Our VPN Scripts


    Immediately after a PPP connection is established, pppd will run the script

    etc/ppp/ip-up. We can use this fact to set our routes automatically instead of
    resorting to "sleep hacks" (in which you run a sleep 10 command before starting
    pppd'
