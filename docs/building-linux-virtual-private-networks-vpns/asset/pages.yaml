  md: '# 326 Chapter 10 tinc


    | Table 10.1 continued |

    | Option | Description |

    | :--- | :--- |

    | -n, --net=<vpn_name> | Work with a VPN called <vpn_name>. Determines a path
    where tinc looks for configuration files. |

    | -K, --generate-keys=[BITS] | Generate RSA public/private keypair of BITS length.
    If BITS is not specified, 1024 is the default, tinc will ask where you want to
    store the files will default to the configuration directory. Note that you can
    use the -c or -n option in combination with -K. |


    Signals\Knowing the process ID of the appropriate tinc daemon from /var/run/tinc.<vpn_name>.file,
    you can send signals to the daemon. The signals will be interpreted as characterized
    in Table 10.2.


    | Table 10.2 Signals That Can Be Sent to the tinc Daemon and Their Results |

    | Signal | Description |

    | :--- | :--- |

    | HUP | Causes tinc to close all connections, reread the configuration file, and
    restart. |

    | INT | Forces tinc to close all connections and quit. |

    | US1 | Causes tinc to output the current list of connections to syslog. |

    | US2 | Causes tinc to output the current list of subnets to syslog. |

    | ALRM | Forces tinc to try to connect to its peer immediately. tinc usually attempts
    to do this itself, but increases the waiting time between two consecutive attempts
    each time a failure occurs. If an attempt to connect an uplink the first time
    after tinc is started is not successful, the waiting time is set to the maximum
    time of 15 minutes. |


    Using tinc

    Regardless of how complex a VPN is, it can always be deconstructed into basic
    scenarios that are fairly easy to set up. Most of these basic scenarios deal with
    only two peers and thus can be represented by a point-to-point link. As in previous
    chapters, the scenarios are categorized as either host-host, host-network, or
    network-network. This section will discuss how to use tinc to handle each category
    so that you can use it to assemble your own VPN.'
  merge: -1
  pgno: 343
- img_proc: true
  md: 'Because, for each point-to-point link, one of the peers originates and the
    other waits for incoming connections, it is important to understand that there
    must be something static about the waiting peer. When both peers have static IP
    addresses, we use the addresses. When both peers have dynamic IP addresses or
    reside behind a masquerading/NAT firewall, we still need to use a static property
    for one of the peers, such as dynamic DNS or an explicit firewall rule forwarding
    packets from a certain-port to the peer behind the firewall.


    How can you make use of the preceding ideas? Think point-to-point. Determine which
    one of your peers is going to be the originator and which is the receiver. Think
    how you are going to refer to the receiver: Does it have a constant IP address
    or domain name? Maybe you should add a firewall rule that governs all the packets
    from port 9000 to the receiving peer. Ultimately, figure out which category your
    needs fit in and follow the appropriate scenario described here.


    The following examples assume you are using the ethapt driver. If you are using
    the universal TUN/TAP driver, you should replace /dev/tap0 with either /dev/tun
    or /dev/net/tun, whichever exists on your system.


    # Static Peers


    For this set of scenarios, we assume that all peers have constant routable IP
    addresses and are not behind a Masquerading/NAT firewall.


    > Note

    Note that tinc was developed with the idea of a VPN that might consist of a number
    of different subnetworks. Therefore, for each peer, you will need to specify a
    subnetwork to which the peer is directly connected.


    The following first scenario is the most generic. It enables you to connect two
    networks. The next two scenarios use a partial case of the first scenario, with
    one or both peers using a network address with the netmask of 255.255.255.255,
    which corresponds to a single IP address.


    After each peer has been configured, you can run tinned as follows:

    [root@fox tinc]# tinned -n abcd


    # Network-Network Tunneling


    To illustrate tunneling between several networks using tinc, we will use four
