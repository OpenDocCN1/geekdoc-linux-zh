  md: '# Chapter 4 Building a VPN with SSL/TLS and PPP


    # Starting and Stopping the VPN


    To start your VPN manually, you can simply run the following commands:


    ```

    bears-server# /etc/init.d/vpn1 start

    fcons-client# /etc/init.d/vpn1 start

    ```


    You must run the command on the server first so that the Stunnel daemon is ready
    to accept the connection from the client. To stop the VPN, you can use the following
    on either:


    ```

    root# /etc/init.d/vpn1 stop

    ```


    This will kill the VPN connection. If you terminate the VPN on the client, the
    Stunnel process will still be running on the server, waiting for new VPN connections,
    and you can reestablish a VPN at any time. If you terminate the VPN on the server,
    Stunnel will also be killed, and you must start it again if you want to accept
    new connections.


    You can also start or stop the VPN by specifying the VPN name to the vpn-server
    or vpn-client process manually, as follows:


    ```

    bears-server# /opt/ssl-vpn/bin/vpn-server vpn1

    falcons-client# /opt/ssl-vpn/bin/vpn-client start vpn1

    ```


    # Supporting Multiple VPNs


    Our scripts make it to support more than one VPN on your machines. You are only
    limited by the resources available (memory, processing power, number of processes,
    and so on) on the machines associated with it, as vpn1, chicago_office, and reegen_laptop.
    You must create the /etc/init.d/ or /etc/rc.d/ links to the vpn-server or vpn-client
    scripts and create the configuration files (/opt/ssl-vpn/etc/config_name.conf)
    for each VPN. These files will be the same except for the network information
    and Stunnel port.


    Current versions of Stunnel do not export any information about the certificate
    presented by the peer. Contrast this with our SSH VPN in the preceding chapter,
    where we were able to call vpn-server with different arguments using identity
    entities in authorized_keys(2). Because we cannot have a Stunnel daemon distinguishing
    one incoming connection from another, we must run one Stunnel daemon per VPN we'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# Troubleshooting 139


    want to support. So when creating your VPN configuration files, make sure you
    have separate server_stunnel_port values for each VPN.


    # Troubleshooting


    As with PPP over SSH, PPP over SSL/TLS can require some troubleshooting. The following
    sections cover the common issues you might run into.


    # PPP and Networking Problems


    Creating a PPP connection is troublesome to set up in the best of cases. See the
    sections “PPP Failures” and “Networking Issues” in Chapter 3 for a list of common
    PPP and networking problems and solutions.


    # Stunnel Issues


    Getting your Stunnel processes to communicate should be a straightforward process,
    but several common problems can keep you from properly establishing a TLS/SSL
    connection.


    # Certificate Verification Errors


    If Stunnel is unable to verify the peer certificate, it will log entries such
    as the following:


    ```

    VERIFY ERROR: depth=0 error=self signed certificate:

    /C=US/ST=IL/CN=server.example.com

    SSL_connect: error:140900B6:SSL routines:SSL3_GET_SERVER_CERTIFICATE:

    certificate verify failed

    ```


    You should first verify that you copied the certificate correctly to the other
    machine and that you created the hash. Aside from checking the certificate file
    visually—a through boring approach to the task—you could check the information
    and fingerprint by comparing output of the following commands:


    ```

    bears-server openssl x509 -hash -fingerprint -subject -noout in certfile

    flacons-client openssl x509 -hash -fingerprint -subject -noout in certfile

    ```


    Verify that the file has been correctly created:

    flacons-ls /opt/ssl-vpn/etc/vpn1/hash.0


    where hash is the value from openssl x509 -hash -noout -in certificate.

    If you get a VERIFY ERROR that is not followed by a certificate verify failed
    error, such as the following:


    ```

    VERIFY ERROR: depth=0 error=self signed certificate:

    /C=US/ST=IL/CN=server.example.com

    SSL_connect: error:D00870B7:asn1 encoding routines:d2i_ASN1_UTCTime:invalid time
    format

    ```'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# Chapter 4 Building a VPN with SSL/TLS and PPP


    Your certificate is properly linked via hash, 0, but the certificate is not properly
    formed. This usually indicates that the file was corrupted in transport somehow,
    and you should reload the certificate.


    # No Shared Ciphers


    Unless your server and client can both agree on a cipher to use, you will not
    be able to establish an SSL connection. This is logged with a message like the
    following:


    ```

    SSL_accept: error:14080A00:SSL routines:SSL3_GET_CLIENT_HELLO:no shared cipher

    ```


    This is most common if you have manually specified a list of ciphers on which
    machines are not compatible.Try removing any -ciphers arguments and testing the
    connection again. If it works, make sure you pick your ciphers more carefully.
    If it does not work, either Stunnel or OpenSSL was not compiled correctly.Recompile
    and install OpenSSL and Stunnel from scratch, making sure you use the same version
    of each package on both machines.


    # Limitations


    Our PPP-over-TLS VPN suffers from the same problems as our PPP-over-SSH VPN in
    the preceding chapter. Briefly, SSL/TLS is a TCP protocol, which is a reliable
    protocol (lost packets are retransmitted until received.). The problem occurs
    when we want to send UDP or other unreliable packets across the VPN.Whereas we
    normally accept that some packets will be lost and design our applications based
    on the fact that (for example, streaming media), when tunneled over a reliable
    transport mechanism like TCP, we needlessly guarantee that all these packets will
    be transmitted and received. For more details about this problem, see the “Limitations”
    section in Chapter 3.


    # Summary


    This chapter discussed all the pieces you need to successfully create a secure
    VPN using PPP and Stunnel.We have provided you with ready-to-use scripts that
    are both extensible and easy to use.


    If you have attempted a PPP-over-SSH VPN in the past, you might find that a PPP-over/TLS
    connection is easier to set up and maintain.We have custom daemons on both ends,
    it is a relatively clean solution:We do not rely on an existing SSH daemon, our
    host authentication with certificates is more straightforward than the combination
    of SSH identities and host keys, and is less “manual editing” of files all around.


    If you want to implement a “PPP-over-crypto” VPN, we would suggest you try a PPP-over-Stunnel
    VPN because of its more straightforward setup.'
