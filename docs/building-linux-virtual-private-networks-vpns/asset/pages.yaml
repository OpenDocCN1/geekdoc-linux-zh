  md: '# Modifying authorized_keys{2}


    We will place some restrictions on the use of the SSH identity supplied by the
    client by adding an initial options field to the -ssvpn/.ssh/authorized_keys{2}
    file. To simplify our programs, we will force the VPN server to automatically
    launch our vpn-server script. This also increases the security of the server if
    the identity is somehow stolen, an attacker cannot log in to the server; he or
    she can only attempt to establish a VPN.

    We will also set the environment variable vpn_network to the name (vpn1) that
    we have associated with this VPN. This variable will control several things:


    +   - The local machine name and username used for (optional) PPP authentication,
    in this case vpn1-server

    - The configuration file sourced by the vpn-server script, in this case /opt/ssh-vpn/etc/vpn1


    You can include a from to restrict what machine(s) can run to establish this VPN.
    We''ll also include all restrictive no-* forwarding options because these aren''t
    necessary for our VPN, they add overhead, and they could be used potentially to
    circumvent security policies. So our example could be the following:

    ```

    from=''example.com'',command="/opt/ssh-vpn/bin/vpn-server pppd vpn1",no-port-forwarding,no-x11-forwarding,no-agent-forwarding
    * 0024 35

    128944540204458154617425980975928079466181446...

    ```


    The only required pieces for our purposes are the command and option. Note that
    we are launching vpn-server with two arguments, pppd and the vpn name (vpn1).
    It will use these arguments to determine how it behaves. Without, our SSH VPN
    scripts will not function.


    # Creating our Global VPN Configuration File


    Both the vpn-client and vpn-server scripts will read the file /opt/ssh-vpn/etc/ssh-vpn.conf.
    This file is also located on our web page for easy download. Install it for both
    the client and the server, as follows:


    ```

    root# mkdir /opt/ssh-vpn/etc; chmod 755 /opt/ssh-vpn/etc

    root# cp ssh-vpn.conf /opt/ssh-vpn/etc

    root# chmod 644 /opt/ssh-vpn/etc/ssh-vpn.conf

    ```


    This file contains the pathnames of external commands that might be needed:


    ```

    # Location of programs. These are probably fine

    # for your system, but you should verify.

    SU=/bin/su

    ```'
