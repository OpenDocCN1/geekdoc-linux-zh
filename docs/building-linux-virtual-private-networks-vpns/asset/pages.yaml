  md: '# 316 Chapter 10 tinc


    We recommend that you use this feature if you want to have multiple tinc VPNs
    on your machine. Simply create a subve for each VPN that your machine belongs
    to and keep configuration files for the appropriate VPN there.


    Now you have an idea where to put tinc configuration files. It is time to take
    a closer look at the files themselves.


    # tinc.conf


    This is a main configuration file. You should have this file for each VPN you
    use. The file contains configuration information for your machine as a member
    of the VPN. For example, if your VPN is shattuck and the machine assigned to yours
    is kitaro, your /etc/tinc/shattuck/tinc.conf file might look as follows:


    ```

    Name = kitaro

    TapDevice = /dev/tap0

    PrivateKey = /etc/tinc/shattuck/kitaro.priv

    ConnectTo = deepblue

    ```


    The ConnectTo option specifies the name under which your machine is known to members
    of the shattuck VPN.

    The ConnectTo option instructs tinc to connect to its peer named deepblue. For
    this to work, you should have a /etc/tinc/shattuck/hosts/deepblue file containing
    configuration for the peer. If you do not specify the ConnectTo option, tinc will
    start waiting for incoming connections.


    /etc/tinc/<vpn>/hosts/*


    This directory contains configuration files for hosts that belong to a VPN <vpn>.
    The directory should consist of at least one file that contains configuration
    for your machine. In the preceding example, you will need to create /etc/tinc/shattuck/hosts/kitaro.
    You can also use the directory to store configuration files for the peers to which
    your machine is going to connect.


    # tinc-up and tinc-down Scripts


    If your VPN is shattuck, when you start tinc for the VPN, it will execute /etc/tinc/shattuck/tinc-up
    script. The script should set up an appropriate tinc interface and perform some
    additional configuration required for normal operation. Note that you will need
    to use different tinc-up scripts for ethertap and the universal TUN/TAP driver.


    For the etherap, you can use the following script:


    ```

    #!/bin/sh

    # bring interface down first

    ifconfig tap0 down


    # required by tinc

    # sets up tap0 MAC address to a special value

    ```'
