  md: '# IPSec Architecture, Components, and Concepts 139


    # SA Parameters


    Each SA can contain a number of parameters. Some of these parameters can be used
    as selectors to choose what types of inbound and outbound packets should be protected
    using the SA. For example, source and destination IP addresses, port numbers,
    and protocol types can be used as selectors.


    Generally, SA parameters include names of algorithms to be used to protect packets,
    keys, sequence numbers, and so on. The following is a list of possible SA parameters:


    +   - Security Parameters Index (SPI). SPI is one of the three parameters that
    uniquely identify an SA. The other two parameters are destination IP address and
    a security protocol name.


    +   - Source and destination IP address.


    +   - Source and destination port number.


    +   - The last two parameters can be used as selectors along with the transport
    protocol name.


    +   - Name—either a user ID or a system name. The user ID allows for differentiation
    between traffic from specific users. If a system name is used, it can be either
    a fully qualified DNS host name, an X.500 Distinguished Name, or an X.500 general
    name, similar to the subject name in the X.509v3 digital certificates.


    +   - Security Protocol—currently AH or ESP.


    +   - Authentication parameters (for example, signature or cryptographic hashing
    algorithm, keys, and so on).


    +   - Replay protection parameters (for example, the sequence number counter and
    sequence number overflow flag for outbound SAs, or the replay protection window
    and replay protection counter for inbound Sas).


    +   - Mode (Transport or Tunnel).


    +   - SA lifetime—specified as time or as a number of bytes processed (for example,
    45 seconds, 1,024 KB of data, and so on). Often, a combination of time and bytes
    is processed to determine SA lifetime.


    When an SA expires, the associated packets that arrive are usually being dropped
    until a new SA is negotiated. Therefore, IPSec implementations start negotiating
    a new SA shortly before it is due to expire (for example, the IPSec implementation
    in Cisco routers; also see the rekeyman parameter to Pluto – IKE daemon in FreeBSD/WAN).


    Make sure, however, if you set up your system to renegotiate SAs before they expire,
    you also stagger the renegotiation times. If IKE starts renegotiating all SAs
    at the same time, it will require your system to support a high peak load (CPU
    usage, bandwidth, and so on).'
