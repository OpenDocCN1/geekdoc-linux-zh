  md: '# 196 Chapter 6 FreeS/WAN


    kernel level than the TCP/IP stack and thus fully depend on the TCP/IP configuration.

    look merely outputs the information from each of the preceding commands. It only
    makes your life a little easier.


    Get to know these commands and how they affect the running configuration, although
    it is suggested that you make configuration changes through the /etc/ipsec.conf
    file. An IPSec VPN can be a complicated beast, and unless you copied detailed
    notes, it is best to keep track of your configuration changes so that you know
    when you''ve gotten something right.


    # “Gotchas"


    Several problems are frequently experienced when setting up a FreeS/WAN VPN, and
    we will go through a couple of them in this section. The first one you might encounter
    like this:


    +   - no default route, %defaultroute cannot cope!


    This occurs when the /etc/rc.d/init.d/ipsec initialization script is executed
    before your network interfaces are initialized. This is the case with road warriors
    because they initialize your PPP connection after your system is booted.


    The best solution is to remove the FreeS/WAN code from startup upon booting. You
    can do this in a variety of ways, but the easiest way is to issue the following
    command as root:


    ```

    # chconfig --del ipsec

    ```


    Then, after your PPP connection is set up and you have Internet connectivity,
    issue the following command as root and proceed to initialize your VPN tunnel:


    ```

    # /etc/rc.d/init.d/ipsec start

    ```


    Another error you might run into is the following:


    Error parsing ipsec.conf file


    Unless you are masochistic, you probably cut-and-pasted the RSA public keys into
    your /etc/ipsec.conf file. Unfortunately, new-line characters can sometimes be
    automatically inserted into long lines when cutting and pasting. Make sure each
    key exists on a single line. Also make sure you''ve indented it properly.


    You might run into this as one well:


    ```

    modprobe: Can''t locate module ipsec

    ```


    Did you install your modules after you compiled your kernel? If you''re unsure,
    do not


    ```

    # cd /usr/src/modules/linux

    ```


    ```

    # make modules_install

    ```


    If FreeS/WAN startup still doesn''t work, try using the appropriate version of
    the modutils package? If you''re using an old version, upgrade to the latest version
    of modutils and try again.'
