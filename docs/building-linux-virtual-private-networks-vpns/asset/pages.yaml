    some data (in this case, the Linux kernel sources) over measure its performance.
    First, we test the connection between the two VPN machines, Bears and Falcons,
    using their public IP addresses. This tests the actual connection of the machines
    without any of the VPN overhead. The non-VPN IP addresses we are using are 280.8.8.8
    and 270.7.7.7.


    ```

    bears# ../ttcp -t 270.7.7.7 < ../linux-2.4.12.tar.bz

    tttcp-t: buffer=8192, nbuf=2048, align=16384/0, port=5001 tcp -> 192.168.1.2

    tttcp-t: socket

