    Creating links to Makefiles.

    Makefile -> linux/Makefile.top

    pppd/Makefile -> Makefile.linux

    ppstats -> Makefile.linux

    chat/Makefile -> Makefile.linux

    pppdump -> Makefile.linux

    $ make

