  md: 'The PingTimeout option stipulates the time interval in seconds that the link
    needs to be inactive for tinc to send a keep-alive packet. If the other end does
    not respond within the same number of seconds, tinc aborts the connection and
    updates routing information.


    The PrivateKey option defines the name of the RSA private-key file that tinc should
    use. We will show how to generate this file in a moment. For now, do not worry
    about this option.


    # Extended Options


    Here is a list of options that can be used in the main configuration file in addition
    to the ones already described:


    +   - Interface <device_name>. By default, tinc will be listening for incoming
    connections on all network interfaces that are up. With this option, you can specify
    an interface address on which you want tinc to listen, as eth0, ppp0, s10, and
    so on.


    +   - InterfaceIP <local_IP_address>. When you are using aliases, if you have
    more than one IP address associated with an interface. This option lets you define
    which IP addresses you want to bind. The default behavior is to listen on all
    the addresses associated with the interface.


    +   - PrivateKey <hexadecimal_key_string>. This option enables you to provide
    a private key as a string. For safety reasons, however, we recommend that you
    use the PrivateKey option instead.


    # Generating Keys


    Run the following command on both peers to generate an RSA keypair for each peer:


    ```

    [root@fox /root]# tincd -n shattuck -K

    ```


    ```

    Generating 1024 bits keys:

    .......................+

    ...................... q

    ```


    Done.

    Please enter a file to save public RSA key to [/etc/tinc/shattuck/hosts/{kitaro|bancroft}]:
    <press_enter here>


    Please enter a file to save private RSA key to [/etc/tinc/shattuck/rsa_key.priv]:
    <press_enter here>


    As you probably noticed, if you just press Enter, your public key will be saved
    in /etc/tinc/shattuck/hosts/kitaro if you specified Name=kitaro in the /etc/tinc/shattuck/tinc.conf
    file. For bancroft, the name of the file with the public key should be /etc/tinc/shattuck/hosts/bancroft
    accordingly.'
