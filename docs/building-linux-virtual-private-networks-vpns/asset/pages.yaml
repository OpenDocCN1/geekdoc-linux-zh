    # Creating a VPN-Specific Configuration File


    Our vpn-server and vpn-client programs are written to be able to establish any

    number of arbitrary VPN connections. These commands determine which VPN

    should be creating by checking the program name and arguments. If two arguments

    are specified as in vpn-server start vpn1, the second argument is the VPN name.
    If

    inoked via a symlink such as /etc/init.d/vpn or /etc/rc.d/S99vpn1, it will use

    the program name, stripping away any leading # (or K##), yielding the VPN

    name vpn1. In other words, the script tries to figure out what you intuitively

    as possible. On the server, it determines the VPN name via the command-line argu-\ments
    set for the command option in the authorized_keys(2) file.


    Once the Vpn name is determined, it will get its configuration variables from
    the

    file /opt/ssh-vpn/etc/vpn_name. Thus, for your VPN named vpn1, we would create

    t file /opt/ssh-vpn/etc/vpn1. Each variable in the configuration file begins with

    server_ or client_, meaning you can create one file with all the necessary values
    and

    share it between the systems, if you desire, without worry about conflicts. The
    variables

    shown in Table 3.3 are required.'
