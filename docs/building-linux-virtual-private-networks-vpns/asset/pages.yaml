    \ Tunnel\n\nFor scenarios in which you are not able to use a tun or tap interface,\
    \ you can set up a serial tunnel. As previously mentioned, a serial tunnel creates\
    \ a virtual serial link, which acts as a tunnel. For this example, we will create\
    \ a PPP tunnel. PPP is designed for point-to-point links, which is how tunnel\
