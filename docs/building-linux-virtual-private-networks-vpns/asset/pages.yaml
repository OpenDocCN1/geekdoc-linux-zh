    # Host-Network CIPE Tunneling Using Proxy ARP


    Sometimes you might want to fool computers on a local network into thinking that
    your workstation is directly connected. On the other hand, you might simply need
    to remotely access the local network resources while away on vacation or work-home.


    In both cases, you can accomplish your goals using CIPE tunneling along with the
    Address Resolution Protocol (ARP). Whether it is your machine or another machine
    on the local network, you can make it appear as if the machines are directly connected.


    How can this possibly work? The idea is that a gateway capable of tunneling packets
    to a remote workstation "pretend" to be that workstation on the local network.


    More specifically, the gateway will answer ARP queries on behalf of the remote
    workstation, which will cause other workstations on the local network to update
    their ARP caches and direct their OSI Layer 2 frames to the gateway.


    Generally, the ARP protocol is used to map between Layer 2 MAC addresses and Layer
    3 IP addresses for directly connected networks. On Linux, it is implemented by
    the kernel module.


    Consider the following configuration, for instance:


    A private network 192.168.1.0/24 has several workstations and a gateway A. Gateway
    A’s IP address on the private network is 192.168.1.1. CIPE’s interface on A has
    the same IP. Gateway A also has an external interface with a public routable IP
    address.


    Mobile workstation B’s CIPE interface address is 192.168.1.3. Mobile workstation
    B also has a public routable IP address for its external interface, namely IP2.


    The configuration is shown in Figure 9.2. When mobile workstation B is not physically
    present and wants to make itself appear to all the workstations on network B if
    it were directly connected, B establishes a secure CIPE tunnel to gateway A. The
    gateway, in turn, serves as a proxy for all the packets directed to and from workstation
    B.'
