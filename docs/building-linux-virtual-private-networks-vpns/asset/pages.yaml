    Naturally, each CIPE peer must have a mirrored version of the other side''s /etc/cipe/options.
    For example, ipaddr and ptaddr, as well as me and peer parameters, must be inverted
    for each side of the point-to-point link.


    The ipup and ipdown options specify path to two scripts that will be executed
    when the point-to-point link associated with the options files come up and goes
    down, respectively. These scripts are very similar to those used by pppd and are
    typically used to add routing records. We will examine these files in one of the
