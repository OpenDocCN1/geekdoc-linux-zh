    /usr/src/freeswan-1.91/out.kbuild and try to trace the problem back to the module
    creating the error. If you start from the end of the error messages, go back until
    you see a line that says like -C <something or other>. That will give you some
    information as to what module or what type of module is creating the problem.


    The other place in which the process could bomb is the last step in the module
    installation process, when an external program is executed to find dependencies
    between modules. You''ll know it has failed if you see some messages like the
    following:


    ```

    *** Unresolved symbols in

    *** /lib/modules/2.4.6/kernel/drivers/net/tokenring/ibmtr.o

    *** Unresolved symbols in

    *** /lib/modules/2.4.6/kernel/drivers/net/tokenring/lanstreamer.o

    *** Unresolved symbols in

    *** /lib/modules/2.4.6/kernel/drivers/net/tokenring/olympic.o

    ```


    There are few reasons why this could be happening. One, you didn''t include a
    kernel configuration that these modules depend on. If that''s the case, go back
    and read the "help" associated with the module to see if you need to include something
    else in the configuration. Two, the source code could have a problem. Unless you''re
    a really good coder and you''re very familiar with the kernel source, you probably
    can''t do much about this. If you absolutely need this module, try a different
    kernel version. Otherwise, remove the module from the kernel configuration. Three,
    you didn''t install a new version of modutils. Go back to section "modutils" and
    install the latest version.'
