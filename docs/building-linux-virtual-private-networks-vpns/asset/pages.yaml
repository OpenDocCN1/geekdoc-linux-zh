  md: '# CIPE Configuration 275


    Initializing a Secret Key

    To initialize the CIPE secret key in /etc/cipe/options, you can come up with 16

    bytes of data or, for example, a hash of the pseudo random data provided by

    /dev/urandom, as follows:


    ```

    root@fox /root# dd if=/dev/urandom count=4 2>/dev/null | md5sum | awk ''{print\n$1}''
    >> /etc/cipe/options

    ```


    It is up to you to decide which of these is safer. However, it is not as important
    as

    making sure the key is delivered to your peer securely.

    The problem of distributing keys is more of a challenge than it might seem, espe-

    cially when you use a VPN with a large number of gateways. Also, remember that

    using ssh / tunnel /, and so on to distribute the keys is better than Telnet and
    FTP,

    but it is not a panacea and you must consider the risks involved.


    # Man-in-the-Middle Attacks Are More Serious Than You Think


    Regardless of how secure the package you use for your VPN is, if attacker catches
    keys while you

    distributing them, your VPN is no longer secure. You have already thought about
    how you distribute

    shared keys? Are you going to use FTP or NSF? You probably know that these protocols
    do not

    encrypt packets, so you are literally handing your keys out to attackers.

    However, we want to warn you that even if you use SSH or SSL, you are still likely
    to be vulnerable to

    attacks, man-in-the-middle. The problem is fundamental, and stealing the keys
    dis-

    tusing SSH or SSL can be almost as easy as capturing FTP and NFS traffic in the
    previous example.


    So what can you do to decrease the chances of an an attack? One of the most important
    things you

    know is to be wary of messages about changed keys and new certificates—you could
    be

    attack. In practice, it is also important to know how the attack works in order
    to prevent it. It see

    examples of example attacks and to find out more about the problem as well as
    ways to deal with it, see

    www.cc.gatech.edu/~kitm.


    Also, for older versions of CIPE (before 1.4.0), you will need to use keys that
    only\consist of decimal digits. This is a bug, not a feature. It is described
    for compatibility

    re because if your peer is using an older version of CIPE, your shared key will
    be

    interpreted differently on the peer''s side.


    To circumvent the problem, you can use a variation of the preceding command

    filters out nondecimal keys. For example:


    ```

    root@fox /root# dd if=/dev/urandom count=4 2>/dev/null | md5sum | tr -d a-f >>\n/etc/cipe/options

    ```


    # Static vs Dynamic IP Addresses


    Sometimes it is desirable for one (or both) of the peers to use dynamic IP addresses.

    For example, Internet service providers often use a pool of addresses to assign
    to their

    users. You might have a DSL line or a cable modem that obtains its IP address
    via

    DHCP, and the IP address can change at any time.'
