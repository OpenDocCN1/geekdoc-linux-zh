    # IDENT Checking


    Stunnel has the capability to query the user on the remote end of the connection.
    This is handled by using the IDENT protocol, which is described in RFC 1413.


    For this work


    One problem is that the ident server might not respond with the actual username.
    For privacy reasons, it might respond with a user ID or other unique piece of
    information. Thus, the easiest way to determine what you should put in the username
    field is to establish a connection and query ident daemon manually.


    Start up your sslvpn without any -u username (option). Once connected, determine
    which ports are in use for the connection. We assume you''re using port 9871 in
    the example.


    ```

    falcons-client$ netstat -nat |grep 9871

    top 0 @ client:4725 server:9871 ESTABLISHED

    ```


    This shows that the VPN client has established its connection from port 4725 to
    the server on port 9871. When we query the ident daemon on the server as:


    ```

    falcons-client$ telnet server ident

    Trying server...

    Connected to server.

    Escape character is '']''

    9871,4725

    9871, 4725 USERID : OTHER :ssvpn

    quit

    ```


    # IDENT vs AUTH


    If your machine does not recognize ident as a port name, try using auth, which
    is the older name for this protocol. You alternatively use the port number, 113,
    explicitly.


    The server indicates that the user associated with this port is sslvpn. The output
    might be different for depending on how your ident daemon is configured. To require
    ident restrictions, -u sslvpn in the Stunnel arguments on the client.


    ident verification can be enabled on the server as well. Follow the same logic
    before, but switch the order of the ports when connecting to the ident server
    with telnet.'
