  md: '# 206 Chapter 7 PPTP


    The first (strip-msdomain-patch.diff) is a patch that configures MS-CHAP to

    ignore any NT domain supplied as part of the username. In other words, DOMAIN\

    user will become simple user for authentication purposes, making your

    /etc/ppp/chap-secrets file less cluttered.


    You can turn this option by adding chaps-strip-domain to your /etc/ppp/

    options file.

    The second patch (require-mpe.diff) is one we strongly suggest for VPN users.

    A patch that can be used to force MPPE encryption, which is triggered when the

    directive require-mpe is added to /etc/ppp/options. If you do not apply this patch,

    y your PPTP connection might be established correctly but not use any encryption
    at

    meaning your VPN is not secure. Another option available if you use this patch
    is

    require-mpe-stateless. This requires that stateless MPPE be negotiated, which
    in

    t provides a higher degree of security because keys are renegotiated for each
    packet

    rather than every 256.


    To apply these patches, into the ppp source directory and run the patch

    command as follows:


    ```

    $ cd ppp-VERSION

    $ patch -p1 < /path/to/patch.diff

    ```


    Then add the options you desire to to /etc/ppp/options:


    ```

    # Require encryption

    require-mpe

    require-mpe-stateless

    ```


    ```

    # Strip NT domain craft

    chapes-strip-domain

    ```


    Again, we strongly suggest that you apply the require-mpe.diff patch. It is the
    only

    way you can be sure your VPN is using encryption. If you don''t mind having user-

    ames in /etc/ppp/chap-secrets that contain the NT domain, the other patch isn''t

    necessary.


    # Building pppd


    You then go into the new build directory and compile the software:


    ```

    $ cd ppp-VERSION # if you haven''t already

    $ ./configure

    ```


