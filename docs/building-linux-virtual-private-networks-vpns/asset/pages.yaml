    EDH-DES:DES-CBC-SHA SSLv3 KX=DH Au=DSS Enc=DES(168) Mac=SHA1

    DES-CBC:SHA SSLv3 KX=RSA Au=RSA Enc=DES(168) Mac=SHA1

    DES-CBC:MD5 SSLv2 KX=RSA Au=RSA Enc=DES(168) Mac=MD5

    ```


    To require a particular set of ciphers, use -C cipherlist argument to Tunnel,
    as follows:


    ```

    tunnel ... C EDH-DES:DES-CBC-SHA:DES-CBC-SHA ...

    ```


    This will instruct Tunnel to allow only one of the specified ciphers to be negotiated.
    You only need to specify this option on one of the two ends of the connection.


