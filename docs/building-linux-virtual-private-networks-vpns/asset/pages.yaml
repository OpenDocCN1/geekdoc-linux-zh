  md: '# Advantages and Disadvantages of VPNs


    # VPN vs. RAS


    These days, many businesses are trying to be flexible when it comes to employees''
    schedules. Being able to work from home is an attractive option for many people,
    especially if they''re single parents or live a decent distance from the office.
    Also, many companies need a mobile workforce: Salesforce and support engineers
    need to travel the globe to conduct business.


    Traditionally, there have been only two options available: either open the intranet
    resources to the outside world or maintain a pool of modems through which users
    can connect. Both of these solutions have severe disadvantages.


    Providing resources over the Internet means those resources are accessible to
    everyone on the Internet, not just the intended users. This can pose serious security
    risks. If the resources are compromised, you could be susceptible to unauthorized
    disclosure of trade secrets, proprietary information, and intellectual property.
    Not only that, if there are trust relationships between servers, one compromised
    server can cascade into other compromised servers. From a business perspective,
    this can translate to exponential financial losses.


    If you instead choose to maintain your pool, costs could quickly rocket. PPP servers,
    modems, multiport serial boards, telephone lines, long-distance calls, and administration
    costs can add up. In addition, you could be a victim of war dialing, a method
    still practiced that could compromise your internal network. Again, this could
    constitute financial losses for your company.


    # VPN vs. Leased Lines


    When connecting together geographically distant networks, it is common to use
    dedicated lines for the connection. Although the name can be misleading, dedicated
    lines can be anything from T-carriers (T1, T3, or the European analogue, E-carriers),
    DS-lines (DS1, DS3), OC-lines (OC3, OC12, OC48, OC192) or wireless lines (microwave,
    RF line of sight, or satellite). The lines are “dedicated” because the bandwidth
    is devoted to the owner of the line.


    Leased lines are good for some applications. If you have a database that is mission-critical
    and needs a lot of throughput, a leased line would be a good choice because it
    provides a guaranteed bandwidth. Also, you can purchase dedicated lines based
    on how much throughput you need. If you were in New York, you probably would not
    even notice that the database server was in San Francisco if it was on an OC-3!


    Another benefit of leased lines is that they are (or should be) always available.
    Because you control the equipment that maintains the connection, you are reasonably
    in control of the connection. This isn''t always the case because the dedicated
    lines pass through a WAN cloud; however, the WAN cloud is closely monitored and
    usually has redundant links with automatic failover capability. The probability
    that you''ll experience downtime as a result of WAN-cloud failure is relatively
    low. If your'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'database is regularly replicated, requires continuous queries, or requires
    regular updates over a 24-hour period, you''ll probably want a dedicated line.


    Even though a dedicated line is advantageous in certain situations, depending
    on where you are, a simple T1 can cost upwards of $5,000 for installation, $2,500
    per month for service, and $5,000 for customer equipment (CPE). For the first
    year alone, this can add up to $40,000, and it doesn''t count personnel costs,
    equipment costs, and so on. In addition to your current Internet connection! Keep
    in mind that this calculation only takes into account connectivity between two
    networks. More networks equate to higher cost.


    We rely on ISPs and telcos for our connectivity, but we shouldn''t always trust
    them. They have full access to the data that traverses their lines. What prevents
    one of their employees from sniffing the data? Many service providers have sniffers
    attached to their networks for troubleshooting purposes, but are the sniffers
    ethically, keeping customer confidentiality high on the list of priorities? If
    you need absolute trust in communications between two endpoints, your service
    provider does not belong to the loop.


    Using a Linux VPN solution, you can reduce the first year''s cost to about $5,000
    with only administrative costs in following years. Also, with a VPN, you won''t
    have to factor in other dedicated lines in future migration or expansion efforts.


    # Making VPNs Secure


    Although a VPN helps strengthen the computer and information security of your
    organization, it cannot mitigate all risks that your organization could face.
    Security, no matter which type, requires a comprehensive approach to be effective.
    This section will present other factors that are relevant to overall VPN security.


    # The Importance of Planning


    As mentioned in previous sections, the proper operation of a VPN depends on many
    factors. If VPN design isn''t planned carefully, vulnerabilities could appear
    on your network that previously didn''t exist. That would defeat the purpose of
    the VPN!


    First of all, be sure that everyone involved in the design and implementation
    of a VPN is communicating. VPN planning and implementation will probably require
    two or more people working together. If those people are not communicating, timely
    implementation of the VPN is at risk. The VPN design should be reviewed by peers
    from different teams, such as networking administrators, system administrators,
    DBAs, and other related parties. This will help flesh out some of the bugs or
    potential pitfalls before they happen.


    Also make sure that the design is well documented and that the documentation is
    maintained as things change. All too often, companies make changes to their infrastructure,
    and those changes are not consistently documented. Fortunately, discovery tools
    exist and are commonly employed to map a network.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# Making VPNs Secure 23


    One of the major pitfalls people run into when dealing with VPNs is comprehensive
    key management strategy. It seems trivial, but experience has shown that it is
    actually a lot more difficult than one might realize. In most VPNs, multiple keys
    are used to secure the communication path. There the seed key that allows the
    initialization of the VPN, and then keys are encrypted as the VPN operates. There
    are also host keys and gateway keys, and they should be different. Do you want
    to only have a single key protecting all your information and give that same key
    to all your mobile users? What if their laptops are stolen? Your entire infrastructure
    could be easily compromised.


    There''s also the decision of manual versus automatic key management. In either
    case, how often should keys be changed? What cipher is the VPN using? How vulnerable
    is cipher to traffic analysis or cryptanalysis attacks? Encryption only buys you
    time, it doesn''t protect your information forever. What if a key is compromised?
    Are there key revocation methods in place? If you don''t revoke and change keys,
    you will continue to be vulnerable.


    What about failover protection? What if the VPN stops operating as it should?
    It could be days before service is restored. Be sure to include a failover mechanism
    when designing your VPN. Otherwise, downtime could be financial loss.


    # Worms and Failover Protection


    The need for redundancy, or failover protection, was evidenced by the Nimda and
    CodeRed worms. These worms consumed massive amounts of bandwidth with their activity,
    which had the side effect of a Dos attack in many sections of the Internet. Your
    VPN is not immune to this phenomenon.


    Because VPNs can be complex, VPN management is not strictly a technical issue.
    Be sure that procedural and administrative safeguards are in place for the things
    that can''t be managed automatically.


    # Using Firewalls


    If you''re planning to implement a VPN, you''re probably already using a firewall
    to protect your systems. If the VPN traffic is traversing a firewall, the firewall
    rules need to change to allow the VPN traffic. When the ruleset changes to accommodate
    the VPN, the firewall policy should be updated to reflect the current configuration.


    Firewalls should be as protective as possible, only allowing access to particular
    resources. For instance, if you have a VPN gateway that forwards traffic from
    company LANs to the intranet, and you have a separate VPN gateway that forwards
    traffic from mobile users to the company intranet, do you want to allow everyone
    the capability to reach both gateways? The answer should be no. Mobile users have
    no reason to communicate with the LAN VPN gateway, and LANs have no reason to
    communicate with the mobile VPN gateway. By allowing everyone to connect to both
    gateways, you could be vulnerable to traffic analysis, cryptanalysis and replay
    attacks.'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# Chapter 1 Introduction to VPNs


    One last note about firewalls: Many times, when implementing and testing a VPN,
    the firewall ruleset will change. Unfortunately, the ruleset isn''t always restored
    to a secure configuration. If the ruleset isn''t restored, it''s not doing anything
    except introducing latency and risk to your network. Change control is critical
    when you''re dealing with your security architecture.


    # Proper ID Required


    When choosing a VPN, be sure it includes a de-cent authentication mechanism. Some
    VPN software, particularly IPSec compliant variants, have built-in authentication
    that uses hashing functions such as MD5 or SHA1. Other VPN implementations rely
    on external authentication services such as SOCKS.


    Are authentication attempts encrypted? Does it employ a cipher-response mechanism
    that changes for each authentication attempt? If not, usernames and passwords
    might be transmitted in cleartext, or attackers may be able to guess the sequence
    and grab vital information. If an attacker can decipher an authentication stream,
    the attacker may be able to use information to gain access to other resources
    on your network such as email or shell accounts. Poor authentication can lead
    to security breaches on other parts of your network.


    Whatever the authentication mechanism, it needs to be robust. Lack of proper authentication
    can leave your network vulnerable to a variety of attacks. Be sure to thoroughly
    understand the authentication services your VPN provides.


    # Keeping Your Secrets Safe


    One of the major reasons you''ve decided to implement a VPN is because it protects
    your information from prying eyes. However, just because it uses encryption doesn''t
    mean it is secure. RFC 2401, the RFC that describes the IPSec protocol, specifies
    that the default cipher should be included in all IPSec implementations is 40-bit
    DES. DES has been cracked in as little as two hours! IPSec supports other algorithms,
    but when implementing your VPN solution, be sure to take the strength of the cipher
    is able to provide adequate protection for your information over a sufficient
    period of time to make the information useless to an attacker.


    Fortunately, common sense has prevailed, and most VPN packages include other,
    stronger cryptosystems. Then again, some VPN software will default to DES encryption
    unless otherwise specified. So it would be wise to understand which ciphers are
    supported by your VPN of choice and select the one that''s appropriate for your
    application.'
