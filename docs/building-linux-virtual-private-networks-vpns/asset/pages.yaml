- img_proc: true
  md: "# 250 Chapter 8 Using VTun\n\n![](img/ac8d70f99c3fa1e7029fbd036fc254da_267_0.png)\n\
    \nFigure 8.3 IP tunnel.\n\n# IP Tunnel Server Configuration\n\nBecause the server\
    \ passes all tunnel attributes to the client, it is in the server configura-tion\
    \ that we will define all tunnel settings. For the client to connect properly,\
    \ it is only necessary that it support all the options sent to the server.\n\n\
    In this particular case, the server is directly connected to the network 192.168.1.0/24.\
    \ From our network diagram, we see that the tunnel interface on the server side\
    \ will be configured as 192.168.192.254, on the network as 192.168.254.252. Also,\
    \ we will presume in this scenario that we use maximum compression.\n\nThe following\
    \ are the contents of the /usr/local/etc/vtdun.conf file.\n\n```\noptions {\n\
    \    port 5000;\n    ppp /usr/sbin/pppd;\n    ifconfig {\n        route /sbin/ifconfig;\n\
    \        firewall /sbin/route;\n        /sbin/ipchains;\n    }\ndefault {\n  \
    \  compress yes;\n    speed 0;\n}\nIP-Tunnel {\n    pass password1;\n    type\
    \ tun;\n    proto tcp;\n    comp zlib:9;\n    encr yes;\n    keepalive yes;\n\
    \    up {\n        ifconfig \"%% 192.168.254.254 pointoint 192.168.254.253 mtu\
    \ 1500\";\n        route \"add -net 192.168.254.2/30 gw 192.168.254.253\";\n \
    \       route \"add -net 192.168.2.0/24 gw 192.168.254.254\";\n    }\n};\n```"
  merge: -1
  pgno: 267
