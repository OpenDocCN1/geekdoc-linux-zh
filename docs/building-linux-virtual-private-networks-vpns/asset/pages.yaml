  md: 'This file contains the path names of external programs that might be needed:


    ```

    # Location of programs. These are probably fine

    # for your system, but you should verify.

    SU=/bin/su

    UDO=/usr/bin/sudo

    PPPD=/usr/bin/pppd

    ROUTE=/bin/route

    STUNNEL=/usr/bin/stunnel

    WHOAMI=/bin/whoami

    ```


    It also includes the variable SSL_VPN_USER. Set this to the name of the user who
    runs the vpn-client script on the client, sslvpn in our examples:


    ```

    SSL_VPN_USER=sslvpn

    ```


    The vpn-client program will initially verify that it is running as the correct
    user and will use this value in the pty argument, as follows:


    ```

    pty $$SUDO -u $$pppd $STUNNEL ..."

    ```


    Again, this is required because pppd is running as root via sudo, but we want
    the SSL connection in the pty command to run as the SSL_VPN_USER. Got it? Whew!


    # Creating a VPN-Specific Configuration File


    Our vpn-server and vpn-client programs are written to be able to establish any
    number of arbitrary VPN connections. These commands determine which VPN they should
    be creating by checking the program name and arguments. If two arguments are specified
    as in vpn-server start vpn1, the second argument is the VPN name. If invoked via
    a symbolic link such as /etc/init.d/vpn1 or /etc/rc.X/S99vpn1, it will use the
    program name, stripping away any S## (or K##), yielding the VPN name vpn1. In
    other words, the script tries to figure out what you want intuitively as possible.


    Once the VPN name is determined, it will get its configuration variables from
    the file /opt/ssl-vpn/etc/vpn_name/config.


    Thus, for our VPN named vpn1, we would create the file /opt/ssl-vpn/etc/vpn1/config.
    Each variable in the configuration file begins with server_ or client_, meaning
    you can create one file with all the necessary values and share it between the
    systems, if you desire, without worry about conflicts. The variables shown in
    Table 4.2 are the most important.'
