- img_proc: true
  md: '# Summary


    In this chapter, we have discussed all the pieces needed to successfully create
    a secure VPN using PPP and SSH. We have provided you with ready-to-use scripts
    that are both extensible and easy to use. However, even with these in hand, setting
    up a PPP/SSH VPN is a headache the first several times. You might find yourself
    suddenly troubleshooting the connection even though it had been working properly
    for months.


    However, a VPN created by PPP over SSH is a tried-and-true method. The protocols
    are solid, are well defined, and—most importantly—are not in the state of flux
    that many other VPN technologies are in.'
  merge: -1
