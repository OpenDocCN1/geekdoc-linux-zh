  md: '# Chapter 3 Building a VPN with SSH and PPP


    82


    Chapter 3  Building a VPN with SSH and PPP


    nYou can have the PPP daemon on both ends require authentication to be absolutely
    sure that you have connected to the correct endpoint. This might be overkill,
    however, because we are verifying the authenticity of both endpoints automatically
    via SSH: the client by the server by its SSH host key.


    Regardless, if you want to establish PAP or CHAP authentication for your PPP connection,
    you will need to edit /etc/ppp/pap-secrets or /etc/ppp/chap-secrets files, respectively.
    By careful choice of the name, remotename, and user arguments supplied to pppd,
    we can make our /etc/ppp/(pap, chap)-secrets files easy to read.


    For example, on the client, we will use the following pppd arguments:


    ```

    debug require-pap show-password name vpn1-client \

    user vpn1-client remotename vpn1-server

    ```


    On the server, we will use the following arguments:


    ```

    debug require-pap show-password name vpn1-server \

    user vpn1-server remotename vpn1-client

    ```


    The following in /etc/ppp/pap-secrets will be on both hosts:


    | Username Server Password ip_addr |

    | vpn1-server vpn1-client "somepw" * |

    | vpn1-client vpn1-server "otherpassword" * |


    For extra security, you can encrypt the password using crypt() on the machine
    requiring the authentication. In other words, the vpn1-client does not need to
    know the password for the vpn1-server and could have an encrypted form in the
    password field. Thus, the /etc/ppp/pap-secrets file could read as follows:


    +   # User/client server password ip_addr

    # vpn1-server vpn1-client "8X5K.J/YftXJQ" *

    # vpn1-client vpn1-server "someotherpassword" *


    The output from the script would look like this:

    Encrypted Password: 8X5K.J/YftXJQ


    To use CHAP instead of PAP, specify the preceding procedures but the /etc/ppp/chap-secrets
    file instead, specify require-chap on the pppd command line, and do not encrypt
    the password using crypt(). CHAP authentication cannot handle encrypted passwords
    due to its design.


    In the preceding example, we required authentication of both the client and the
    server. You could require it for only one of the endpoints if desired simply by
    replacing require-{pap, chap} with noauth on the endpoint that does not need to
    perform peer authentication.'
