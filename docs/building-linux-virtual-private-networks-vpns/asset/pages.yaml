    (it can also be compiled for some UNIX-like operating systems as *BSD and Solaris,
    though Linux is its primary system). It''s been around a few years and works well
    with PPTP servers on Windows (NT and so on) as well as the server PPTP package
    introduced later in this chapter.


    pptp-linux consists of several pieces. The first is the pptp program, which handles
    making an outbound connection to the server, establishing the PPTP control and
    GRE channels. It calls a modified version of the PPP daemon, called ppp-mpe, for
    authentication and to handle the network connection and calls Microsoft Extensions
    for authentication and encryption.


