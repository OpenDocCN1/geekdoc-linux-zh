    # File System Security


    Immediately after installation, you should check the permissions of certain files
    and directories and change them if needed. Even though most of the permissions
    are listed set during the installation, it''s good practice to periodically verify
    that the permissions on these files and directories have not changed.

    The following commands will change the permissions of these files and directories
    so that they are secure:


    ```

    # chown -R root.root /usr/local/lib/ipsec

    # chown root.root /etc/ipsec.conf

    # chown root.root /etc/ipsec.secrets

    # chown root.root /usr/local/sbin/ipsec

    # chmod 755 /usr/local/lib/ipsec

    # chmod 644 /etc/ipsec.conf

    # chmod 755 /usr/local/bin/ipsec

    # chmod 755 /var/run

    ```


    # Configuring FreeS/WAN


    In this section, we''ll configure a few different types of VPN tunnels with FreeS/WAN.
    Based on what is available to you, pick a basic tunnel type and set that up first.

    Proceed through the troubleshooting steps until your first tunnel is configured
    and working properly. Everything from that point on should come easily.


    # Cryptographic Keys


    In this section, we''ll create the cryptographic keys for FreeS/WAN. After you
    generate a key and add the appropriate information, copy the file to /etc/ipsec.secrets.
    After you copy it, be sure the permissions on the file are set to 600 (rw-------).
    Otherwise, your cryptographic key could be compromised.'
