    \ Useful SSH Identity Restrictions\n| Restriction | Description |\n|--- | ---\
    \ |\n| from=\"pattern-list\" | A comma-separated list of hostnames for which this\n\
    identity will be honored. If the identity comes from a\ndifferent machine, the\
    \ connection will not be granted.\nThe wildcards * and ? are allowed, so is for\
    \ negation.\nUsed for restricting machines can connect with\nthat identity. |\n\
    \ command=\"command\" | Regardless of what (any) the client attempts\nto run,\
    \ instead run the command specified. This will be\nt shell script that launches\
    \ pppd with the appropriate\narguments later in this chapter. |\n environment=\"\
    VARIABLE=value\" | Create an environment variable VARIABLE WITH the\nvalue. We'll\
    \ use this later to specify which VPN\nname is associated with this connection.\
    \ |\n no-port-forwarding | Disable SSH's port forwarding. Port forwarding is not\n\
