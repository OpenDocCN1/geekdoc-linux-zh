    # Setting up PPP over SSL/TLS Manually


    To begin, we will show you the various pieces involved in creating a VPN between
    two hosts manually. This will lay the groundwork for what we do in our later scripts
    and will help you understand what you is going on. This will aid in debugging
    the connection if necessary.


    # Installing and Verifying PPP


    First, determine that ppp is installed on both your VPN client and VPN server.
    On a Debian or other dpkg-based system, you would type the following:


    ```

    root@debian# dpkg -l ppp | grep ppp

    ii ppp  2.3.11-4  Point-to-Point Protocol (PPP) daemon.

    ```


    On a Red Hat or other rpm-based system, you would type the following:


    ```

    root@redhat# rpm -q ppp

    ppp: 2.3.11-4

    ```


    Make sure that the version of ppp you have installed is 2.3.7 or greater because
    that is the first version that supports the pty argument necessary for setting
    up a pty automatically.'
