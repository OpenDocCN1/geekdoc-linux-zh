    # ip-up and ip-down Scripts


    The ip-up and ip-down scripts are executed whenever a point-to-point link handled
    by a CIPE daemon comes up or goes down, respectively. These scripts are usually
    used to set up routes, perform logging, and so on.


    When a point-to-point connection has been established, the appropriate CIPE interface
    comes up, and the ip-up script for that interface is called. The name of the script
    can be specified in the options file or in a ciped command line.


    The script is called with a number of parameters, such as the CIPE interface name,
    the ciped daemon''s process ID, the IP address of the local side of the interface,
    the IP address of the remote side, and so on.


    A simple ip-up script is as follows:


    ```

    #!/bin/sh

    # ip-up <interface> <daemon-pid> <local> <remote> <arg>


    # This script is called whenever the CIPE interface comes up/is opened.

    # Arguments:

    # $1 interface the CIPE interface

    # $2 myaddr our UDP address

    # $3 daemon-pid the daemon''s process ID

    # $4 local IP address of our CIPE device

    # $5 remote IP address of the remote CIPE device

    # $6 arg argument supplied via options

    # $22

    # This script can: set up routes, set up proxy arp records,

    # start daemons, perform logging.

    umask 022

    ```


    ```

    PATH=/sbin:/bin:/sbin:/usr/bin


    # add a route to the network passed in the arg (the options file)

    route add -net $6 gw $5 mask 255.255.255.0


    # just a logging example

    now=$(date "+%m-%d %T")necho ''$now - $1 is up. parameters: $*'' >> /var/log/cipe.log

    ```


    The preceding script adds routing to the network that has just become available
    via the remote-end IP address. The script also performs simple logging of the
    connection'
