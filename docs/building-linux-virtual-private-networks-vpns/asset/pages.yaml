    # PPP Kernel Modules


    Using PPP requires that the kernel be built with PPP support, either in the kernel
    itself or in kernel modules. The ppp-mppe tarball comes with precompiled modules
    that you can install if needed, as well as instructions on how you recompile your
    kernel with PPP support if necessary.


    Most Linux distributions already come with PPP support in their kernels. Thus,
    the chance that you will need to recompile your kernel is very small, and we won''t
    want to spend time to cover it. The ppp-mppe software works with your existing
    PPP support, so you do not need to "upgrade" your kernel or kernel modules for
    it to work.


    You can quickly check whether your PPP support in modules (the way most Linux
    distributions) by running the following commands:


    ```

    # insmod slihc

    # insmod ppp

    # lsmod | egrep slihc|ppp|Module

    Module      Size Used By

    ppp         21836 0 (unused)

    slhc        4440 0 [ppp]

    ```


    The slihc module contains routines used by the PPP module, the order in which
    we loaded them. The pppd program we run will automatically handles loading these
    modules if needed, so you should never need to load these manually anyway.

    If the preceding commands fail, you have PPP support compiled directly into your
    kernel (not as a module), or you do not have PPP support at compiled all and should
    recompile your kernel. Again, if you have an off-the-shelf Linux installation,
    you probably have PPP support compiled as a kernel module and need do nothing.


    # Installing the mppe Kernel Module


    If you want to have encryption available for your PPTP connection (which is the
    whole point you want to use for a VPN), you need to compile the mppe kernel module.
    The source is part of the tarball you''ve already unpacked. Run the kmodbuild.sh
    script to compile the kernel module:


    ```

    # cd ppp-VERSION/linux-kernel

    # sh kmodbuild.sh

    ```


    After a flash of compilation messages, you will be greeted with instructions for
    how to install your newly created modules:


    +   - Your kernel modules are in kernel-modules/new-VERSION

    - In order to use the new kernel modules, you need to install them in /lib/modules/VERSION'
