  md: '# VPN Server Behind a Firewall and NAT Traversal


    If you use a routable IP address for the external interface (the one that is not
    on 192.168.1.0/24) of the Chicago VPN server, you can use the explicit or centralized
    routing configurations described earlier.


    If you can''t use a routable IP for the Chicago VPN server outside interface,
    you''ll most likely need to get your VPN server to work over a NAT. Getting VPN
    solutions to work over NAT can be tricky.


    For instance, an IPSec-based solution, the easiest way is to have it in tunnel
    mode. This is because one-to-one NAT mapping can be established (that is, private
    IP address of the VPN server will be mapped to the routable IP address of the
    firewall). In transport mode, one-to-one mapping is a problem because packets
    can be coming from different IP addresses. Although a number of techniques have
    been proposed to deal with the problem, as of now, IPSec does not have an official
    standard defining IPSec interoperation with NAT. (Check www.ietf.org/html1.charts/ipsec-chapter.html
    for more up-to-date information.)


    Overall, NAT traversal is very difficult implementation and can be affected by
    a number of factors such as the transport protocols your VPN solution uses and
    so on. Your best bet is probably to consult the documentation and mailing lists
    for your particular VPN solution.


    # Trust Level


    Trust is important in an environment in which security is a concern. (In a paranoid
    world, this would mean every environment.) Which systems you trust should be considered
    carefully, and even if you do trust a system, be sure to trust it as minimally
    as possible.


    The principle of least privilege should be used on any system that is providing
    a service to the Internet. This doesn''t mean people outside of your network access
    to servers or services they do not need. In regards to VPNs, this doesn''t mean
    any services are absolutely necessary. Ideally, your machine that provided VPN
    access should be running only the VPN-related services, limiting the services
    that attackers could try to exploit.


    Realistically, you will probably have to be running a service or two for access
    to the box. To maintain security, these services should be of the encrypted variety:
    SSH instead of Telnet, SCP instead of FTP, and so on.


    Further, access to these services should be limited to a small range of IPs, at
    least limited to your local LAN. This could be done through TCP wrappers or your
    firewall but preferably be done on both. A little bit of redundancy can buy you
