    # 6


    # FreeS/WAN


    IN THIS CHAPTER, WE WILL DESCRIBE how to set up an IPSec VPN using the freely
    available FreeS/WAN (www.freeswan.org). We will provide an overview of the internals
    of the FreeS/WAN code and how it operates and will provide some concrete examples
    of how to plan, configure, and troubleshoot a FreeS/WAN implementation.


    The intent of this chapter is to enable you to pick up the book, read through
    this chapter, and be 95% prepared to implement a FreeS/WAN VPN. There''s a lot
    of information here, and if you follow the text by step, you should be able to
    get this VPN working.


    Be aware (read: forwarded) that we''re dealing with more than just the FreeS/WAN
    software here. You''ll also need to work with the Linux kernel and possibly some
    supporting software. As formidable a task as it might seem, it''s actually quite
    simple.


    Throughout this chapter, unless explicitly stated, we''ll assume that static IP
    addresses are used.


    # Overview


    This section will present the different parts of FreeS/WAN from a high-level perspective.
    It''s good to understand the constituent parts before attempting to set up a FreeS/WAN
    VPN.'
