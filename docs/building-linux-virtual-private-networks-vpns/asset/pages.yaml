  md: '# Sketching Configuration


    Before getting into details and showing contents of files, we would like you to
    have a clear picture of what exactly you need to do to configure the VPN in our
    test scenario.


    For the first peer, kitaro, you will need to do the following:


    +   1. Modify the main configuration file for kitaro (/etc/tinc/shattuck/tinc.conf).

    2. Generate keys and put the public key into the /etc/tinc/shattuck/hosts/kitaro
    file.

    3. Modify the host configuration file for kitaro (/etc/tinc/shattuck/hosts/kitaro)
    and copy the file to banroft''s /etc/tinc/shattuck/hosts directory.


    For the second peer, bancroft, you will need to perform a mirrored set of steps,
    namely:


    +   1. Modify the main configuration file for bancroft (/etc/tinc/shattuck/tinc.conf).

    2. Generate keys and put the public key into the /etc/tinc/shattuck/hosts/bancroft-file.

    3. Modify the host configuration file for bancroft (/etc/tinc/shattuck/hosts/bancroft)
    and copy it to kitaro''s /etc/tinc/shattuck/hosts directory.


    # Contents of the /etc/tinc Directory


    At this point, the /etc/tinc directory on both peers should contain the following
    information:


    ```

    [root@fox tinc#] ls -lR /etc/tinc

