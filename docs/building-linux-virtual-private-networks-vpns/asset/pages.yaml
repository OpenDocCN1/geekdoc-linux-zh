  md: 'Building Linux Virtual Private Networks (VPNs) covers the most popular VPN
    technologies available for the Linux platform. In the early chapters the theory
    behind VPNs is discussed, including needs and uses. Common network and host configurations
    are also covered. Subsequent chapters drill down the implementation and configuration
    of specific software packages. Specific, detailed instructions are included as
    well as troubleshooting information. This book will be an indispensable resource
    for anyone who wants to implement a Linux-based VPN. This book will meet the needs
    of anyone, from the Linux user to the experienced administrator to the security
    professional.


    —Oleg Kolesnikov


