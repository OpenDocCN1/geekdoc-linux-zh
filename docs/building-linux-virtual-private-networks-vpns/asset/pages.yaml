- img_proc: true
  md: '# Chapter 6 FreeS/WAN


    Table 6.1 ipsec.conf File Settings


    | Setting | Description |

    |---|---|\| config setup | These are general settings that specify default, connection-independent
    parameters. |

    | interfaces="..." | Specifies which physical interfacessec virtual interfaces
    should be bound. Multiple bindings are specified with a <SPACE> delimiter. This
    field must be surrounded by double quotes (unless the %defaultroute directive).
    |

    | klipsdebug= | Specifies the KLIPS debugging level. |

    | plutodebug= | Specifies the Pluto debugging level. |

    | plutoload= | Specifies whether Pluto should load IPSec connections into its
    database upon startup. The %search directive enables you to set values for each
    connection through the auto field. |

    | plutostart= | Specifies whether Pluto should attempt to negotiate IPSec connections
    upon startup. The %search directive enables you to set values for each connection
    through the auto field. |

    | uniqueids= | Tells Pluto that only one ID can be used simultaneously for a connection.
    |

    | conn %default | This section enables you to set default values for every subsequent
    conn section. |

    | keyingt= | Specifies the number of keying attempts to make before failing. The
    value of "0" denotes an infinite number of attempts. |

    | authby= | Specifies how connections should be authenticated. |

    | conn <name> | This is a specific connection definition. |

    | left -or- right | These parameters denote the IP address of the left and right
    VPN devices, respectively. |

    | *subnet | Specifies the subnet behind the specified VPN gateway. For a single
    host (nongateway), this parameter is not needed. |

    | *id | Denotes the index of the specified VPN device. This index should take
    the form of @something. |

    | *nexthop | Specifies the next hop, or the default route, of the respective VPN
    device. This is needed except when using the %defaultroute directive. |

    | *rsasigkey | Specifies the RSA public key for authentication purposes. |

    | auto= | Specifies how Pluto should handle this connection. Only useful when
    plutostart=%search. |


    184'
