  md: '# 110 Chapter 4 Building a VPN with SSL/TLS and PPP


    writing new private key to ''stunnel.pem''


    You are about to be asked to enter information that will be incorporated into
    your certificate request.

    What you are about to enter is what called a Distinguished Name or a DN.

    There are quite a few fields but you can leave some blank.

    For some fields there will be a default value,

    If you enter ''.'', the field will be left blank.


    Country Name (2 letter code) [US]:nState or Province Name (full name) [IL]:nLocality
    Name (eg, city) [Chicago]

    Organization Name (eg, company) [Building Linux VPNs:

    Common Name (FQDN of your server) [fictitious.example.com]:


    # The Common Name Field


    SSL browsers recognize the Common Name (CN) field of the certificate to match
    the fully qualified domain of the server. Thus, if a machine connects to www.example.com,
    the CN must match www.example.com as well. Stunnel does not have this requirement
    and will simply check the certificate presented by the peer against a list of
    valid certificates locally installed.


    Our key and certificate have been created as server.pem or client.pem as appropriate.
    This is saved in Privacy Enhanced Mail (PEM) format, a text representation (base64
    encoded) of the numeric data. There are other formats you can generate with OpenSSL,
    but Stunnel supports only PEM format. The file will look some like this:


    ```

    --- BEGIN PRIVATE KEY ---

    MIIXIQAAABBAQGC01HHKKMLLCUG02CZFN6X7bBC2gJWU7IOVAg2/pNAFAYJZT

    X1wjVHLFTObBhtRbHtIG+OCfJp+A11ZknprKZLCE

