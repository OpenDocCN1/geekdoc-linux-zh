    [root@tinc ~]# cp doc/sample-config/hosts/* /etc/tinc/shattuck/hosts\n```\n\n\
    # Note\n\nYou might find it useful to take a look at the preaged tinc archive\
    \ in RPM or DEB format. The archive contains additional samples of both configuration\
    \ files and rc.d scripts to start tinc as a daemon on system initialization.\n\
    \n# Adding tinc to /etc/rc.d\n\nYou can skip this section if you installed tinc\
    \ from an RPM or DEB package."
