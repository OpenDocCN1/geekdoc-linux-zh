  md: '# What is a VPN?


    # Trust Your Mobile Users


    It goes without saying that the Internet has brought about a major shift in the
    way people and businesses operate. Instantaneous communication from any Internet
    access point has enabled organizations to have a mobile workforce, a workforce
    unhindered by lack of proximity to the office. Through the Internet, employees
    can access company resources just easily as if they were sitting at an on-site
    terminal.


    Unfortunately, this can have negative consequences. As previously discussed, some
    Internet protocols are insecure, passing messages in the clear. This situation
    is complicated by the fact that, by their very nature, mobile computers appear
    to be no different than rogue Internet hosts. By default, no assurance exists
    that mobile hosts are actually part of your organization.


    # Secure That Mobile Computer!


    Not only is communication between a mobile employee''s computer and company resources
    insecure, mobile computers themselves are insecure. Many companies have been the
    victims of industrial espionage, by failing to secure the controlled infrastructure
    but by failing to properly secure mobile computers. If hackers want a company''s
    trade secrets or intellectual property, why go through the trouble of hacking
    the corporate infrastructure? Just hack an employee''s laptop!


    A VPN can only protect information on the wire, so be aware that a VPN will not
    offer protection against stolen laptops or industrialial espionage. Other protections
    must be employed to mitigate these risks.


    VPNs can protect your mobile infrastructure and make mobile users part of your
    trust domain. Transmissions from mobile computers and intranet resources can be
    authenticated and encrypted, effectively providing an extended security perimeter
    between the Internet and your organization. Some protocols, such as PPTP, have
    specifically been developed for this purpose. Using a VPN for mobile-user-to-intranet
    connectivity can ensure that your intellectual property isn''t compromised in
    transit.


    # A Sample VPN


    At this point, with all this high-level, abstract discussion of VPN technologies,
    specific applications may seem elusive. So here we present a concrete description
    of a VPN within a corporate environment. This example is complicated but will
    be as closely mapped to the real world as is practical to include discussion of
    business justification and design details.


    We''ll continue with the previous example, Exemplify Technologies, Inc. Exemplify''s
    three offices (Washington D.C., Munich, and Tokyo) are each connected to the Internet,
    as shown in Figure 1.1.'
