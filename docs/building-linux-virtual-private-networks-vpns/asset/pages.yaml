- img_proc: true
  md: '# Chapter 5 IPSSec


    In the preceding example, 64.58.76.223 is the IP address of www.yahoo.com, and
    64.58.76.250 is the IP address of an IPSec gateway that will be tunneling traffic
    to www.yahoo.com.


    In the next step, the IP address contained in the "X-IPsec-Server" of the IN TXT
    field will be used to get the key of the IPSec server to contact (also from a
    reverse DNS map). The key of the IPSec server found in the DNS will read as follows:


    ```

    IPsec-gw.yahoo.com. IN A 258.76.58.64

    IPsec-gw.yahoo.com. IN KEY @4208 4 ANJJKkIk9...yyUKKK8

    ```


    After the key has been retrieved, it will be used to negotiate an SA with ipsec-gw.yahoo.com
    using IKE/ISAKMP. The SA will then be utilized to protect traffic to www.yahoo.com.


    > Note


    > The main problem with this approach is getting the right public key for www.yahoo.com.
    As you know, regular DNS is not authenticated and can be spoofed. To ensure the
    authenticity of public keys, OE has to rely on DNSSEC, which is still somewhat
    a work in progress.


    OE functionality has been added to FreeS/WAN v1.91. For more information on FreeS/WAN
    support for OE, see www.freeswan.org/freeswan_trees/freeswan-1.91/Doc/How.html


    If you want to find out more about OE as a concept, go to www.freeswan.org/freeswan_trees/freeswan-1.91/doc/opportunism.spec.


    # Limitations and Conclusions


    Beware of the following things if you are going to use IPSec to build your VPN:


    +   - IPSec cannot make up for poor design choices or insecure systems.

    - You need to understand that IPSec is not a silver bullet that makes your system
    secure. Obviously, if your system has already been compromised, adding IPSec will
    not help you much. This is true for the majority of security concepts and packages,
    so we recommend that you protecting your system against intrusions very seriously.

    - IPSec only provides mechanisms to secure your system; you provide the policy.
    Be careful when choosing a policy to be used on your IPSec systems. Remember the
    importance of the end-to-end protection described earlier and make sure your policy
    protects traffic all the way from its source to its destination. Combine ESP and
    AH for better security.

    - IPSec does not protect against denial-of-service attacks.'
  merge: -1
  pgno: 179
- img_proc: true
  md: 'Overall, the biggest limitation of the current version of IPSec is probably
    its complexity. As many cryptographers argue, complexity is the enemy of security.
    To address this concern, a number of improvements are being considered. In particular,
    complete removal of such parts of IPSec as Transport mode, Aggressive mode, and
    even the AH protocol has been proposed. Also see `www.ietf.org/internet-drafts/draft-ietf-ipsec-improveike-00.txt`.


    In conclusion, despite IPSec''s complexity and imperfections, it is probably your
    best bet at this time if you want a widely supported and implemented industry-level
    solution.


    # Summary


    In this chapter, we described functioning and key elements of IPSec protocol suite.
    We focused on explaining IPSec from a practical perspective, covering the essential
    things a system or security administrator would need to know in order to successfully
    configure, monitor, and maintain an IPSec-based VPN.'
