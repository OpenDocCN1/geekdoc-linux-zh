    # Using Signals Under UNIX


    Although we assume that most of our readers are familiar with the idea of signals
    under UNIX, here is a brief explanation for those of you who would like to understand
    what is happening. When xinetd is first executed (usually during system startup),
    it sets up handlers for basic signals such as SIGHUP, SIGUSR1, SIGUSR2, and so
    on. Whensequently, you pass a -SIGHUP argument to kill the utility, as the example
    says, the utility calls a kernel function that informs xinetd''s signal handler
    that a signal was sent. It is up to the handler to decide what it will do in response.
    Typically, sending a SIGHUP causes daemons to reread their configuration.


    # Option 2: Manually Starting pcpipe on a Given Port


    Although the pcpipe authors do not presently mention this feature in the documentation,
    an additional command-line argument to pcpipe makes it possible to manually specify
    the TCP port number on which it is listening. We accidentally found this option
    when going through pcpipe source code, so there is no guarantee that it will work
    in the newer releases. It seems quite useful, though, we believe it will still
    be present in the newer releases.

    If you manually start pcpipe (as root) using the following command:


    ```

    [root@fox xinetd.d]# pcpipe -s 9950

    ```


    This will cause pcpipe to be bound to the TCP port and wait for connections. Therefore,
    it is not necessary to add anything to either xinetd or xinetd. The disadvantage
    of this method is that the command needs to be executed from somewhere, either
    during system startup or by some initialization script. However, it is invaluable
    for manually testing the system.


