    [0-127].x.y.z Class A

    16777214 hosts per network


    [128-191].x.y.z Class B

    65534 hosts per network


    [192-223].x.y.z Class C

    254 hosts per network


    [224-239].x.y.z Class D

    Available for multicast protocols only


    [240-255].x.y.z Class E

