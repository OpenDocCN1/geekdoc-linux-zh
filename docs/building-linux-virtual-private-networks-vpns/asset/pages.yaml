  md: '![](img/ac8d70f99c3fa1e7029fbd036fc254da_150_0.png)


    # 5


    # IPSec


    IPSEC IS AN IETF CONCEPT ENCOMPASSING a set of protocols designed to protect IP
    traffic. IPSec has become de facto standard for the majority of commercial VPN
    solutions as well as many open-source ones. If your VPN solution uses IPSec, it
    is important for you to understand how it works.


    This chapter is not intended to be yet another summary of IPSec RFCs. Instead,
