    There were 128 Class A blocks, each capable of supporting 16777214 hosts. There''s
    no way to single network with 16777214 hosts could have any hope of good performance.
    Thus, networks were broken up into subnets. Hosts were put onto different subnets
    based on function or location, and routers connected the various subnets.


    Let''s say we take the Class A network 10.[0-255].y and break it into 256 Class
    B networks of the form 10.x.y. Each network now has 65534 hosts (still a relatively
    unreasonable number from a management perspective).


    By default, a host that saw its IP address as 10.1.1.1 assumed it was on a Class
    A and assumed that if it wanted to communicate with 10.2.2.2, they were on the
    same physical wire. To be able correctly understand that 10.2.2.2 was on a different
    network, the concept of subnet mask was formed.


    A subnet mask is simply a dotted quad (like an IP address) that signifies how
    much of an IP address is the network portion and how much is the host portion.
    The Class A networks have a default subnet mask of 255.0.0.0, the Class B networks
    have a default subnet mask of 255.255.0.0, and the Class C networks have a default
    subnet mask of 255.255.255.0.


    To determine the network portion of an IP address, you can perform a bitwise (or
    Boolean) AND of the IP and netmask. To break our class A network into 256 smaller
    networks, the administrators use a netmask of 255.0.0.0 instead of default. The
    host 10.2.2.2 is on the 10.2.x network and the host 10.1.1.1 is on the 10.1.x
    network.


    A different way of viewing the subnet mask is to represent it in binary form.
    The common masks would be represented as follows:


    | Subnet Mask | Binary Format | CIDR Notation |

    | --- | --- | --- |

    | 255.0.0.0 | 11111111.00000000.00000000.00000000 | /8 |

    | 255.255.0.0 | 11111111.11111111.00000000.00000000 | /16 |

    | 255.255.255.0 | 11111111.11111111.11111111.00000000 | /24 |


    The CIDR notation at the end is simply a shortcut you can use to specify an IP
    address and its netmask in one quick form.'
