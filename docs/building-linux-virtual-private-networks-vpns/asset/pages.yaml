  md: '# 304 Chapter 9 cIpPe


    ciped

    You can set the debug option in /etc/cipe/options as shown here:


    ```

    debug 1

    ```


    Note that it is a Boolean option that can be either true (1) or false (0). If
    the debug is set to 1, ciped will not go into the background. Instead, it will
    stay interactive and display error messages to the standard error.


    Alternatively, you can set this option via ciped command line, as follows:

    [root@fox cipe]#ciped -cb -0 /etc/cipe/options debug=1


    This will have the same effect as putting the debug option to /etc/cipe/options.

    However, make sure you use name=value and not name value if you want to specify
    options on the command line.


    If you decide not to set the debug option to 1, you can always look in the syslog,
    as with the kernel module:

    [root@fox pkcipe]# tail -10 /var/log/messages


    # pkcipe


    Use the -D debug command-line option to tell pkcipe to display debug messages
    pertaining to its elements. As of version 1.5.1, the following values are defined
    in the pkcipe source:


    ```

    #define DEB_PROTO 1

    #define DEB_KEY 2

    #define DEB_BNUM 4

    #define DEB_PKT 8

    #define DEB_PKTERR 16

    #define DEB_LOCK 32

    #define DEB_SIGN 64

    #define DEB_PDUMP 128

    #define DEB_PSHA1 256

    ```


    As you can, DEB_SIGN will log any messages related to signatures, DEB_PKTERR will
    log whenever an error occurs in pkcipe packets, and so on. Note that this is an
    internal option and that CIPE authors do not elaborate on it in the documentation.
    Use at your own risk.


    Another option to use is -E. Use it if you want to log to standard error instead
    of syslog.'
