- md: "\n# Update Mint via the Terminal\n\nUp to now you've been using the shield\
    \ icon to launch Mint Update Manager in order to update the system and upgrade\
    \ the currently installed apps, tools and other elements. However, you can also\
    \ accomplish a complete system update and upgrade from the Terminal.\n\n## USING\
    \ APT-GET\n\nTo update and upgrade via the Terminal you use the APT (Advanced\
    \ Packaging Tool) command. It's a powerful tool and combines different elements\
    \ depending on its use.\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_47_0.png)\n\
    \n- **STEP 1** Start by opening a Terminal or if you already have one open clear\
    \ it with the clear command. This starts off with a clean slate to work on.\n\n\
    ```\ndavid@david-mint ~$ sudo clear\n```\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_47_1.png)\n\
    \n- **STEP 2** Enter apt-get into the Terminal. This brings up a list of the most\
    \ used apt-get commands, along with a brief description of what each does. It\
    \ works to look at even if it doesn't make much of sense at this time.\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_47_2.png)\n\
    \n- **STEP 3** Apt-get is used to update the software in Mint, as well as Ubuntu\
    \ and other Debian-based distros. Using the Update element retrieves new packages\
    \ and updates the list of source files. Upgrade and download them to the latest\
    \ versions of files. To start the entire Update process, enter: sudo apt-get update,\
    \ followed by your password.\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_47_3.png)\n\
    \n- **STEP 4** Notice the addition of the sudo command. The sudo command once\
    \ meant Super User Do, but now it's more acceptable as Sub User Do. It means that\
    \ the administrative (super User) uses APT (Advanced Packaging Tool) to get any\
    \ updates. Use this: sudo apt-get upgrade.\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_47_4.png)\n\
    \n- **STEP 5** Depending on the state of your updates, if you have any waiting\
    \ to install, you might have to apply the results of the sudo apt-get upgrade\
    \ command. You can press y to proceed and continue. What is happening here is\
    \ apt-get has some updated software to install for Mint, and you're the one.\n\
    \n- **STEP 7** Essentially, your system is now up to date according to the list\
    \ of packages from the apt-get update command. You can run through the process\
    \ one more time, just to check if everything went okay. To recap, enter: sudo\
    \ apt-get update, press Enter, then type: sudo apt-get upgrade and press Enter.\n\
