    \n![](img/b810837b9059fc96b3c0bd60b035eb13_62_3.png)\n\n# 使用终端\n\n## Linux 技巧与技巧\n\
    \n如你所见，Linux 终端是一个非常特别的环境。通过安装一些额外的应用并具备一点命令知识，就可以完成一些难以置信且往往非常奇怪的事情。\n\n## 执行命令\n\
    \n世界上有无数 Linux 技巧、秘密、黑客技巧和窍门。有些非常老，源于 Linux 的 Unix 传统，而另一些是 Linux 传说中的最新添加。这里是我们的十个技巧。\n\
    \n```\nEASTER EGGS\n文本编辑器 Emacs 是一个很棒的软件，但它也包含一个隐藏的彩蛋？在安装 Emacs 后 (sudo apt-get\
    \ install emacs)，切换到终端会话并输入：\nemacs -l 1 dunnett\ndunnett 是 Ron Schnell 在 1982\
    \ 年编写的一个文字冒险游戏，隐藏在 Emacs 中。\n```\n\n```\nTERMINAL BROWSING\n曾经幻想过浏览互联网吗？虽然不是特别有用，但这是一个非常值得观赏的事。要这样做，输入：\n\
    sudo apt-get install elinks elinks\n输入你想访问的网站。\n```\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_63_0.png)\n\
    \n## MOON BUGGY\n\n基于经典的 1982 年街机游戏《月球巡逻》(Moon Patrol)，Moon Buggy 在 1985 年在家用电脑上出现并广受好。它是一款出色的\
    \ Atari 游戏，可以通过以下方式在 Linux 终端中使用：\n\n```\nsudo apt-get install moon-buggy.\n```\n\
    \n然后：\nmoon-buggy\n享受吧。\n\n## 让雪下起来\n\n终端下雪不是你每天都能遇到的。如果你感兴趣，输入：\n```\nwget https://github.com/sentek/50548/raw/7d024716a579fb5232/snowjob.sh\n\
    chmod +x snowjob.sh\n./snowjob.sh\n```\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_1.png)\n\
    \n## 技巧与技巧\n\n## 内存大户\n\n如果你需要查看哪些应用消耗了最多的 Linux 内存，只需输入：\nps aux | sort -rn\n\
    这会按内存排序。\n\n## BBS\n\n在拨号时代，在线世界由公告板系统（BBS）组成。这些远程服务器供用户聊天、交换代码和游戏。使用 Linux，我们仍然可以连接到活跃的\
    \ BBS。有无数可选的 BBS，查看 https://www.telnetguide.com/bbs/ 获取更多。\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_0.png)\n\
    \n## SHRED\n\n删除文件时，可能有软件可以找回它。但要安全地永久删除文件，请使用：\n```\nshred -u NAMEFILE\n```\n\
    将 NAMEFILE 替换为要删除的文件。\n\n## 目录树\n\n如果你想用一个命令创建一个目录（文件夹）：\n```\nmkdir -p New-Dir/{folder1,folder2,folder3,folder4}\n\
    ```\n这会创建一个带有子文件夹的 NewDir。\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_1.png)\n\
    \n## ASCII 艺术\n\nASCII 应用于图片时非常震撼。但通常很难实现。你可以使用 img2txt 从你的图片创建一些 ASCII 艺术：\n\
    ```\nimg2txt NAMEFILE.png\n```\n将 NAMEFILE 替换为系统中实际的名称。如果未安装 img2txt，使用：\n```\n\
    sudo apt-get install caixa-utils.\n```\n\n## 忘记的命令\n\n记住所有的 Linux 命令并不。坦率地说，可以使用\
    \ apropos 来帮助我们。只需使用它，查看描述：\n```\napropos \"copy files\"\napropos \"rename files\"\
    \n```\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_2.png)\n\n## Linux 与大爆炸\n\n\
    Linux 是粒子的碰撞，以便我们理解宇宙是如何运作的。\n\n## 你知道吗...\n\nLinux 是大型对撞撞机（LHC）背后科学的核心？使用 Red\
    \ Hat Linux 和 CentOS（基于 Red Hat 核心构建的超稳定发行版）作为基础选择，科学家、开发者和工程师创建了 SL - Scientific\
