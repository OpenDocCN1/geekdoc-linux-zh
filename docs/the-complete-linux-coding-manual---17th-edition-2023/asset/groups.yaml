    # # Starting Python for the First Time


    We''re going to be using the Raspberry Pi as our Python 3 hardware platform. The
    latest version of Raspian preinstalled with Python 3, version 3.4.2 to be exact,
    so long as you have a version 3 Shell, all our code will work.


    # ## STARTING PYTHON


    We''re not going to go into the details of getting the Raspberry Pi up and running,
    there''s plenty of material available on that subject. However, once you''re ready,
    fire up your Pi and get ready for coding.


    +   * **STEP 1** With the Raspberry Pi desktop loaded, click on the Menu button
    followed by Programming > Python 3 (IDLE). This opens the Python 3 Shell. Windows
    and Mac users can find the Python 3 IDLE Shell from within the Windows Start menu
    or via Finder.


    +   * **STEP 3** For example, in the Shell enter: `2+2` After pressing Enter,
    the next line displays the answer: 4. Basically, Python has taken the ''code''
    and produced the relevant output.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_91_0.png)


    +   * **STEP 2** The Shell is where you can enter code and see the responses and
    output of code you''ve programmed into Python. This is a kind of sandbox, where
    you are able to try some simple code and processes.


    +   * **STEP 4** The Shell acts very much like a calculator, since code is basically
    a series of mathematical interactions with the system. Integers, which are the
    infinite sequence of numbers can be easily added, subtracted, multiplied and so
    on.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_91_1.png)


    ```

    Python 3.4.2 (Oct 19, 2014, 13:31:11)

    >>> on Linux

    >>> Type ''copyright'', ''credits'' or ''license'' for more information.

    >>> 2+2

    4

    ```


    ```

    Python 3.4.2 (Oct 19, 2014, 13:31:11)

    [GCC 4.9.1] on Linux

    >>> Type ''copyright'', ''credits'' or ''license'' for more information.

    >>> 2+2

    4

    >>> 23456+645252

    668708

    >>> 1234567890*12345

    152345

    ```'
