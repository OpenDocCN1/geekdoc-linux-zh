    \ metres is 15。在刚开始时听起来可能有点困惑，但你使用和创建自己的代码越多，就会变得越容易。\n\n## 字符串\n\n字符串是表示和持有字符序列的对象。例如，你可以在代码中有一个通用的问候语\
