    \n## Python 中的条件与循环\n\n条件和循环让程序变得有趣；它们可以是简单的也可以是复杂的，如何使用它们很大程度上取决于程序试图实现的目标；它们可能是游戏中剩余的生命值，或者仅仅是显示倒计时。\n\
    \n## 条件\n\n开始时保持条件简单会让学习编程变得更加愉快。让我们从检查某事是否为真开始，如果是执行其他操作。\n\n- 步骤 1 让我们创建一个新程序，要求用户输入一个单词，然后检查它是否是四字母单词。从\
