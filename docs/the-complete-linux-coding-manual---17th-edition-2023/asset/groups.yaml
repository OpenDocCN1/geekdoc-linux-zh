    ## Installing Linux on a PC


    Most distros come as a Live Environment. This means you can boot into an actual,
    fully-working distro from the DVD or USB that you created. Let''s see how that
    works and how you can go about installing Linux from there.


    ## UEFI BIOS


    The Unified Extensible Firmware Interface (UEFI) is used to identify and protect
    a PC during its boot-up process. It replaces the traditional BIOS but can cause
    issues when installing Linux.


    - **STEP 1** Insert your DVD or USB drive into your PC, and if you haven''t already,
    shutdown Windows. In this instance we''re using the USB boot media but the process
    is virtually identical. Start the PC when prompted the appropriate key to enter
    the BIOS or SETUP, choose F2, Del or F11.

    - **STEP 2** There are different versions of UEFI BIOS, covering them all be it
    possible. What you''re looking for is a section that details the Boot Sequence
    or Boot Mode. Here you have the option to turn off UEFI or Legacy Secure Boot.
    Most distros work with UEFI but it can be a tricky not to try it.

    - **STEP 3** With UEFI turned to Legacy mode, there are two ways of booting into
    the Live Environment. The first is via the BIOS you''re already in. Locate the
    Boot Sequence and change the first boot device from its original setting, to Internal
    HDD or mirror, to USB Storage Device for the media option, or DVD Drive for the
    media option.

    - **STEP 4** Alternatively use the Boot Menu. With this option you can press F5
    (or something similar) to display a list of boot media options, from there you
    can choose the appropriate media. Here you can now Save and Exit the BIOS by navigating
    to the Save & Exit option and choosing "Save Changes and Exit"


    ## INSTALLING LINUX


    Once the Live Environment has booted, you see the option to install the distro
    to your computer. Have a look around and when you''re ready, look for the Install
    option on the desktop.


    - STEP 1 Providing you are connected to the internet (if not, then do so) and
    you''re in the Live Environment, start the installation process by double-clicking
    on the Install Mint icon on the desktop. Other distros display their own name,
    of course, but the process is the same. Click Continue when you''re ready.

    - STEP 4 Before the installation process begins, you''re asked if you chose to
    make sure the erasure of the hard drive correct. This is your last chance to back
    out. If you''re certain you don''t mind wiping everything and starting again with
    Linux Mint, Continue to back up your files to the Linux disc/USB, reboot and start
    again.

    - STEP 5 Eventually you are asked to set up your username and password. Enter
    your Name to begin with the Computer Name, which it is identified on the network.
    Next choose a Username, followed by a good Password. You can click the Login Automatic
    option but leave the Encrypt Home Folder option for now.

    - STEP 3 When installing a new operating system''s recommended that you wipe the
    old OS, replacing it with the new. When you reach at this installation process,
    ensure the ''Erase disk and install Linux...'' option is selected. NOTE: This
    completely wipes Windows 10 from your computer, make sure you have backups of
    all your personal files and data.

    - STEP 6 The installation process can be quick, and there may be more questions
    to answer, or may simply installing Linux based on your previous answers. Either
    way, you will end up being asked to Continue the Live Environment or Restart to
    use the newly installed OS; if you''re ready to use Linux, click Restart.


