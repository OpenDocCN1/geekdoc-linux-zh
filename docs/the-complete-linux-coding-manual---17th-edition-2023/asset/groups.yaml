    ## 使用终端


    ## 通过终端安装应用 – 第 1 部分


    ### 命令行安装


    使用终端安装应用可能需要一些巧妙的键盘操作，但它能让你更好地了解正在安装什么内容以及安装在何处。


    - 第 1 步：从终端安装应用相对简单。首先，你需要确保系统是最新的。为此，打开终端并输入：`sudo apt-get update && sudo apt-get
    upgrade`。输入你的密码并接受任何必要的更新。

    - 第 2 步：正如你所看到的，`sudo apt-get update/upgrade` 等命令旨在升级系统中已安装的软件。当你想要安装更多应用时，确实可以这样做！恰好的是，这非常简单。首先，你需要一个要安装的应用，我们以
    Stella 为例。输入：`sudo apt-get install`。

    - 第 3 步：你需要输入 `y` 来确认安装，这将占用系统约 5.5MB 的存储空间。一旦 Stella 安装完成，你会发现 Mint 自动在菜单中创建了“游戏（Games）”分类以及相应的快捷方式。

    - 第 4 步：有时在安装软件时，你需要添加应用的存储库（Repository，简称 repo），它是存放软件的远程服务器位置，以及它所有的依赖项（运行所需的虚拟库和文件）。开始之前，使用此命令：`sudo
    add-apt-repository ppa:peterlevi/ppa`。在提示添加 PPA（个人软件包存档）时按回车键。


    ## 通过终端安装应用 - 第 1 部分


    ### 第 5 步


    这为应用 Variety Wallpaper Changer 添加了存储库，这是一个基于 Ubuntu 的应用，可以在 Mint 中运行并自动更换壁纸。现在已添加库，输入：`sudo
    apt-get update` 以更新新信息并将存储库的内容添加到软件包数据库中。


    ### 第 6 步


    现在安装 Variety，输入：`sudo apt-get install`。按 `y` 确认并接受安装，安装完成后，你可以在终端中输入 `variety`
    来运行它。


    ```bash

    sudo add-apt-repository ppa:varietycloud/ppa

    sudo apt-get update

    sudo apt-get install variety

    ```


    Variety

    Variety 是一个简单的自动壁纸更换器。它为你提供了多种壁纸。


    ```bash

    sudo add-apt-repository ppa:varietycloud/ppa

    sudo apt-get install variety

    ```


