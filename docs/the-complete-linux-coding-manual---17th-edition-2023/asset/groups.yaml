    ## Python on Linux


    > "Python is an experiment in how much freedom programmers need. Too much freedom
    and nobody can read another’s code; too little and expressiveness is endangered."


    - Guido van Rossum (Developer of the Python programming language)


    ![](img/b810837b9059fc96b3c0bd60b035eb13_85_0.png)


    Python is a fantastic programming language, combining ease of use with a generous
    helping of power to allow the user to create both minor utilities and performance-heavy
    computational tasks. However, there''s more to Python than simply being another
    programming language. It has a vibrant and lively community behind it that shares
    knowledge, code and project ideas, as well as bug fixes for future releases.


    We''ve used a Raspberry Pi for this section of the book, as it''s Linux based
    and one of the best coding platforms available. The Pi''s features and functions
    make it the perfect Python programming partner, so let''s get started.


