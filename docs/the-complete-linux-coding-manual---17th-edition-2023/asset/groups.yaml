    # Which Distro?


    ![](img/b810837b9059fc96b3c0bd60b035eb13_16_0.png)


    There are a vast variety of tools preinstalled, that a user can run for penetration
    testing against their network. There was once even a Hannah Montana Linux distribution
    but the less we talk about the better. The point being, there''s a distro out
    there for you.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_16_1.png)


    Needless to say, once you''ve mastered Linux to a relatively high degree, probably
    a power user all right, then you will want to expand your skills and begin to
    build your own Linux distro based on Arch, Debian or or one of the other distros
    available. Doing so involves a lot of command line knowledge, as well as knowledge
    of how the Linux system works and interacts with the hardware in the computer.
    You will need to be partitioning your drives, manually installing the apps and
    programs you want. Doing so takes time and there are a lot of skills you''re going
    to learn.


    Oddly enough, much higher-end technical users find themselves back at square one,
    using a distro like Linux Mint. The main reason is usually because it is an easy
    option, and it is a stable environment, but you always want to be fixing potential
    issues. Most of us would prefer the easy life, especially where technology is
    concerned, so the logical choice would be to choose a distro that is simple, yet
    still powerful enough to do everything you want it to do, hence Linux.


    Eventually you can consider yourself a technical Linux user but never consider
    yourself an expert, after all we''re always learning something new. You can build
    your own distro from scratch, help other Linux users out with problems, and may
    even contribute to the improvement of a distro during its testing phase or build.
    Where next?


    You may find that after going through the tutorials in this title you don''t like
    Linux Mint or the Cinnamon desktop. Fine, you may prefer Ubuntu, Debian or openSUSE
    the beauty of Linux. The freedom to change what you want, to distro from one to
    another without being penalised by cost or lack of access.


    The answer to the question, which distro is any which one you like! It can be
    as complex or easy as you need it to be, as long as it does what you want it to
    do, then it''s perfect.


