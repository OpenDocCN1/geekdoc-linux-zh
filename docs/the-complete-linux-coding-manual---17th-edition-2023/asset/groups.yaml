    # 选择哪种发行版？


    ![](img/b810837b9059fc96b3c0bd60b035eb13_16_0.png)


    这里预装了大量的工具，用户可以使用它们对自己的网络进行渗透测试。曾经甚至有一个名为“汉娜·蒙特纳”（Hannah Montana）的 Linux 发行版，但我们提得越少越好。重点是，总有一个适合你的发行版在那里。


    ![](img/b810837b9059fc96b3c0bd60b035eb13_16_1.png)


    不用俗说，一旦你掌握了相当高水平的 Linux（可能已经是一个高级用户了），你就会想要扩展自己的技能，并开始基于 Arch、Debian 或其他可用发行版构建你自己的
    Linux 发行版。这涉及到大量的命令行知识，以及对 Linux 系统如何工作以及与计算机硬件交互的了解。你将对硬盘进行分区，手动安装你需要的应用程序和程序。这需要时间，而且你将学到很多技能。


    奇怪的是，许多高级技术用户发现自己回到了起点，使用像 Linux Mint 这样的发行版。主要原因通常是因为它是一个容易的选择，而且是一个稳定的环境，但你总是想修复潜在的问题。我们大多数人更倾向于轻松的生活，尤其是在技术方面，因此逻辑上的选择是选择一个简单但足够强大以完成你想要的一切的发行版，这就是
    Linux 的选择。


    最终，你可以认为自己是一个技术型 Linux 用户，但永远不要认为自己是专家，毕竟我们总在学习新东西。你可以从零开始构建自己的发行版，帮助其他 Linux
    用户解决问题，甚至可能在发行版的测试或构建阶段对其改进做出贡献。下一步是哪里？


    你可能会发现，在读完本书中的教程后，你不喜欢 Linux Mint 或 Cinnamon 桌面。没关系，你可能更喜欢 Ubuntu、Debian 或 openSUSE，这就是
    Linux 的美丽之处。你可以自由更改你想要的内容，从一个切换到另一个另一个，而不会受到成本或访问权限限制的惩罚。


    这个问题的答案是：任何你喜欢的发行版都可以！它可以根据你的需要变得复杂或简单，只要它能完成你想它做的事情，它就是完美的。


    ![](img/b810837b9059fc96b3c0bd60b035eb13_16_2.png)


