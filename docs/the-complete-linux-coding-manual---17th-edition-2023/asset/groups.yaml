    # Becoming Anonymous Online


    The digital age has led to many great advances in communications; however, it
    has brought in a new age of spying and snooping. Most of us are no strangers to
    the frequent news stories of governments, secret organisations and underground
    hackers breaking our privacy but how can you combat this?


    ## ANONYMITY WITH MINT


    While it''s virtually impossible to become totally anonymous, you can take measures
    to ensure our privacy is at its best.


    - STEP 1: Starting with the basics, use HTTPS instead of the standard HTTP when
    browsing. This means that anything that transmitted over HTTPS is secure (hence
    the S part at the end) and encrypted.

    - STEP 3: Although Google may seem like the obvious choice for a modern internet
    search, the company does track all searches made by an individual. Consider an
    alternative search engine, such as DuckDuckGo, a search engine that doesn''t store
    personal data or track you.

    - STEP 2: When you''re browsing, consider using the Incognito or Private browsing
    modes in a browser. This disables your web history and cache, allowing you to
    browse without the details being stored for later scrutiny by someone else. However,
    it doesn''t stop any data or search tracking.

    - STEP 4: If you''re browsing on the Internet then consider installing some of
    the browser-plugins. For example, for Firefox, use Ghostery, NoScript and Adblock
    Plus to block trackers, adverts and other data mining techniques.


    ## VPNS AND TOR


    The previous steps can aid your online privacy but to become anonymous you need
    a Virtual Private Network and Tor.


    A VPN is a remote server, or cluster of servers, that establishes a connection
    with your computer. The result is that your computer''s identity on the Internet
    is hidden behind the VPN remote server; so you could live in the UK but have an
    IP address (online computer identity) belonging to Iceland.


    When the download has finished, drop it into the Terminal and enter the Downloads
    folder. Enter `ls` to check if the tar.xz file is present, then enter `tar -xf
    tor-browser-linuxx64-8.0.4.tar.xz` (X is updated, if your version is different
    press Tab to autocomplete the tor-browser-filename). When the files are unpacked,
    use `cd tor-browser-en-US/` to enter the new folder.


    ### STEP 1


    ### STEP 4


    ### STEP 2


    Most VPNs charge a monthly or annual fee but it''s worth the expense. We use CyberGhost,
    which.cyberghost.com, provides connections for Windows, Mac, Mint (and any other
    Linux distribution), Android and iOS devices. Details for each OS can be found
    at **support.cyberghost.com/hz/en-us/articles/213190329-Read-me-first-**


    ### STEP 5


    A look reveals a couple of entries: a folder called Browser and a file called
    ''start-tor-browser.desktop''. To start the tour so run `./start-tor-browser.desktop`.
    This command launches the Tor setup, where you will be offered two options: Connect
    or Configure. If you Connect, the connection will suffice. Click Connect when
    you''re ready.


    ### STEP 3


    Another option is to use Tor. Tor is an open network that you can connect to hide
    your IP address behind countless nodes. It''s ideal for Windows, Mac and Linux
    computers and is very easy to install and use. Start by navigating to **www.torproject.org/download/download-easy.html**
    and clicking on the Download Linux 64-bit version.


    ### STEP 6


    After the connection is established, the Tor Browser is launched. This is a customized
    version of Firefox and here you can securely browse the Internet without being
    viewed or tracked. Mixing both VPN and Tor for an extremely secure and private
    connection to the online world.


    ## Using the Terminal


    The Linux command line, the Terminal, is an incredibly powerful environment. From
    it, you can bring the OS to its knees, or update it to something spectacular.
    You can hack into remote computers, look at an animated ASCII camp fire, install
    new apps and programs, watch Star Wars played out from a server in the Netherlands,
    and code indent automated scripts.


    Linux: the operating system with a CLUE... Command Line User Environment.


    – Anonymous (Posted on comp.software.testing)


    In this section you will explore the intricacies of the Terminal, and how it works
    with Linux. You will learn how to manipulate the Linux File system from the Terminal,
    and you will discover some odd, but fun things you can do in the Terminal.


    The Terminal rules supreme in the world of Linux. Learn how it works, and you
    can access all that power.


    - 46 Basics of the Terminal

    - 48 Update Mint via the Terminal

    - 50 Install Apps via the Terminal – Part 1

    - 52 Install Apps via the Terminal – Part 2

    - 54 Did You Know...Linux Kernel 0.01

    - 56 Creating a File Using the Terminal

    - 58 Creating and Removing Directories

    - 60 Fun Things to do in the Terminal

    - 62 More Fun Things to do in the Terminal

    - 64 Linux Tips and Tricks

    - 66 Did You Know...Linux and the Big Bang

    - 68 Creating Bash Scripts– Parts 1 - 5

    - 78 Pi x Linux = The Perfect Combination

    - 80 Command Line Quick Reference

    - 82 A-Z

    - 84 Did You Know...Linux and the Big Bang


    ## Basics of the Terminal


    Most operating systems use two kinds of interface, the GUI and the command line.
    While the GUI is more user-friendly, the command line is more powerful.


    STEP 1: The Terminal can be accessed by either clicking the menu or opening a
    shortcut. The tilde ~ means your Home folder.


    STEP 2: The flashing cursor at the very end of the line is where your text is
    entered. Print Directory. Type `pwd` which outputs the current folder.


    ```bash

    david@david-mint ~ $

    ```

    ```

    david@david-mint ~ $pwd

    /home/david

    ```


    STEP 3: The Edit option lets you copy and paste commands to and from the Terminal
    and other sources; when you want to copy a very long and complex command from
    a web page. It allows you to edit the profile preferences.


    STEP 4: The Terminal enters Read Only mode which stops you from entering any commands
    into the Terminal.


    STEP 5: All the commands you enter work in the same manner: you enter the command,
    include any parameters to extend the use of the command and press Enter. Type
    into the Terminal: `uname` and press Enter. This displays some system information.


    STEP 6: Before we get into entering commands, let''s take a moment to see what
    the Terminal has to offer. The menu allows you to open a new Terminal, create
    a new profile, you can alter the size, colour and behaviour of the Terminal, add
    a new tab, and close all current active sessions.


    STEP 7: The Edit option allows you to copy and paste commands.


    STEP 8: View and Search options let you alter the sizing of the Terminal window
    and of course search within the Terminal for any particular words.


    STEP 9: The Terminal entry profile editing and sizing allows you to alter the
    character encoding.


    STEP 10: Finally, the Help option displays the contents and version number of
    the Terminal, or to be more precise, we''ll simply refer to it as Terminal in
    Future. The Contents are worth having a quick read through, to help familiarise
    yourself with how the Terminal works.

