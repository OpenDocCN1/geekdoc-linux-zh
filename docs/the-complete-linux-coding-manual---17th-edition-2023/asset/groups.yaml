- md: "\n# Apollo 11\n\nDID YOU KNOW... July 20th 1969 is remembered as a turning\
    \ point in human history, mankind first stepped on the moon. The software that\
    \ helped the crew make pivotal voyage didn't exist at the time and had to be developed\
    \ from scratch. Using a new method of storing programs called Rope Memory, the\
    \ engineers at MIT Instrumentation Laboratory populated the memory with a special\
    \ version of assembly.\n\nIncredibly, that code is freely available to view on\
    \ GitHub. Uploaded by a researcher in 2003, you can view the code by visiting\
    \ www.github.com/chrisgararry/Apollo-11/. Look out for code snippets, such as\
    \ Burn, Baby_Burn, in particular with the comment \"Goodbye. come again soon.\"\
    \n\nHave a look through, and see what else you can find.\n\n| FILENAME | TYPE\
    \ | DESCRIPTION |\n|---|---|---|\n| PNB001 | TX | BALLPARC | CONVERTS PARSE CURSALS\
    \ |\n| PNB002 | TX | THREE-DIGIT PARSES |\n| PNB003 | TX | TURBATOR |\n| PNB004\
    \ | TX | FLUBBERSON |\n| PNB005 | TX | STEPMAN |\n| PNB006 | TX | KATES |\n| PNB007\
    \ | TX | DANCE |\n| PNB008 | TX | CAPT |\n| PNB009 | TX | MARS |\n| PNB010 | TX\
    \ | CAPT |\n| PNB011 | TX | TEST |\n| PNB012 | TX | TEST |\n| PNB013 | TX | TEST\
    \ |\n| PNB014 | TX | TEST |\n| PNB015 | TX | TEST |\n| PNB016 | TX | TEST |\n\
    | PNB017 | TX | TEST |\n| PNB018 | TX | TEST |\n| PNB019 | TX | BEGET |\n\nProgrammers\
    \ aren't without a sense of humour. See what else is in there.\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_35_0.png)\n\
    \n![](img/b810837b9059fc96b3c0bd60b035eb13_36_0.png)\n\n# One giant leap for mankind,\
    \ and coding.\n\nCredit: Apollo 11/NASA\n\n# Creating Users\n\nWhen you first\
    \ install Linux Mint it is configured for single user. While sharing a account\
    \ with the entire family is fine, there may come a time when you need to create\
    \ separate users with their own folders.\n\n## NEW USERS\n\nHaving different users\
    \ means each user has access to his or her areas on the system. Documents, pictures,\
    \ videos and so are separate, with multiple users on operating systems.\n\n- STEP\
    \ 1: Click on the Linux Menu and type 'users' to begin searching for relevant\
    \ results. From the search results, choose Users and Groups. The Users and Groups\
    \ console is quite basic, and easy to use. At first, you can just see your own\
    \ installed Linux Mint.\n- STEP 2: To add a new user, click the Add button at\
    \ the bottom of the console. There are two types of users you can create: Standard\
    \ and Administrator. The new user needs to install new apps or accounts beyond\
    \ their Home Folder, then opt for the Standard account. Otherwise, use the Administrator\
    \ type.\n- STEP 3: The new user appears in the list of current Linux users in\
    \ alphabetical order. At present, there is no password set for the user in the\
    \ list, click No Password Set under the user's username.\n- STEP 4: You can now\
    \ enter a password for the new user or click the arrow at the end of the New Password\
    \ box to generate a password for you as well as displaying it. Naturally, it's\
    \ a good idea to come with a strong password. When you are done, click the Change\
    \ button.\n- STEP 5: You can use the Users and Groups console now that the new\
    \ user has been created. If you click the Mint Menu followed by Logout, you are\
    \ presented with the Login Manager. The new user is present in the list of currently\
    \ available users. Click on him/her to log in.\n- STEP 6: Once logged in the new\
    \ user is required to set up their desktop wallpaper, icons, Panel, Menu so on.\
    \ Depending on what Account Type you set up for Standard or Administrator, you\
    \ be able to install any new apps. This screenshot is from a Standard user account.\n\
    - STEP 7: You can create many new accounts as you need and will be able to switch\
    \ between them when required. It's best to have just one account that's capable\
    \ of installing new software, you can keep track of all.\n\n```\nuser@david-Mint:~$\
    \ sudo apt-get install\n[password for david]: \nSorry, user david is not allowed\
    \ to execute '/usr/bin/apt-get' as root.\nuser@david-Mint: $\n```\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_37_0.png)\n\
    ![](img/b810837b9059fc96b3c0bd60b035eb13_37_1.png)\n![](img/b810837b9059fc96b3c0bd60b035eb13_37_2.png)\n\
    \n# COMMAND LINE ACCOUNTS\n\nAs you expect, you can also create a new user within\
    \ the Command Line. Open a Terminal session under the main Administrator account.\n\
    \n- STEP 1: To process for adding a new user from the command line is relatively\
    \ simple. To begin, type sudo adduser username to create the new user's login\
    \ name. You are then asked to create a password for the user, along with their\
    \ full name and other details Click y to confirm the details and create the user\
    \ account.\n- STEP 2: You can check the details and account type for the new user\
    \ within Users and Groups. If you want to delete a user from Mint, you can enter:\
    \ sudo deluser username in the Terminal or delete Button in Groups.\n\n| | sudo\
    \ adduser jim |\n|---|---|\n| Adding user jim... |\n| New group `jim` exists |\n\
    | Adding new user `1002` to group `jim` |\n| Creating home directory: `/home/jim`\
    \ |\n| Copying skeleton from `/etc/skel/` |\n| password updated successfully |\n\
    | Retype new password: |\n| Enter full name []: or press ENTER for the default\
    \ value |\n| Room number []: |\n| Work Phone []: |\n| Phone []: |\n| Other []:\
    \ |\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_38_3.png)\n\n* Mint Linux & Programming\
    \ 39\n\n# Customising the Desktop\n\nCustomising the operating system desktop\
    \ is one way to make it your own: a personalised workspace that is help you work,\
    \ inspire or feature the company logo. Whatever your reasons for having your own\
    \ desktop, here's how it's done.\n\n## YOUR DESKTOP\n\nLinux is probably one of\
    \ the most own operating systems there is. With just a few tweaks, one or two\
    \ extras installed and imagination, you can create something incredible.\n\n-\
    \ STEP 1: The first aspect of desktop customisation is to change the wallpaper.\
    \ Right-click the desktop and choose Change Desktop Background. This opens the\
    \ Backgrounds in Linux Mint; remember other distros may present their background,\
    \ wallpaper selection tools differently.\n- STEP 3: You just need to click the\
    \ available images, from any of the locations provided to have them install the\
    \ desktop wallpaper. Incidentallyally, if you have images stored in another location\
    \ on your system or network, you can add them by clicking on the Plus symbol at\
    \ the bottom of the Backgrounds console, using the file manager to locate them.\n\
    - STEP 2: More recent versions of Linux Mint display the available backgrounds,\
    \ and so are separate, with multiple users. From the Pictures folder.\n- STEP\
    \ 4: By clicking on the Settings tab you can extend the options for the desktop\
    \ which is different from the others.\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_39_0.png)\n\
    ![](img/b810837b9059fc96b3c0bd60b035eb13_39_1.png)\n![](img/b810837b9059fc96b3c0bd60b035eb13_39_2.png)\n\
    \n# Customising the Desktop\n\n- STEP 5: If none of the available wallpapers take\
    \ your fancy, open a browser and search for the background you prefer. When you've\
    \ found the image you want, right-click it and choose Set as Desktop.\n- STEP\
    \ 8: Themes allows you to change the certain aspects of the Mint desktop: Borders,\
    \ Icons, Mouse Pointer. In the Settings tab you can change the options with on/off\
    \ slider.\n- STEP 6: Click the Menu button and search for 'desktop' and click\
    \ the Desktop results. The Desktop console allows you to pick the layout for multi-monitor\
    \ support.\n- STEP 10: Click Back on Themes, then you can locate the newly installed\
    \ theme and apply it to your desktop. Any Installed themes can also be uninstalled\
    \ with the Add/ Remove button. it's worth spending some time personalising the\
    \ desktop you want and there are some incredible themes.\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_40_0.png)\n\
    ![](img/b810837b9059fc96b3c0bd60b035eb13_40_1.png)\n![](img/b810837b9059fc96b3c0bd60b035eb13_40_2.png)\n\
    ![](img/b810837b9059fc96b3c0bd60b035eb13_40_3.png)\n![](img/b810837b9059fc96b3c0bd60b035eb13_40_4.png)\n\
    ![](img/b810837b9059fc96b3c0bd60b035eb13_40_5.png)\n\n"
