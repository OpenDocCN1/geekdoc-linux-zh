  - "[PAGE 123]\n\n# Structure of a C++ Program\n\nC++ has a very defined structure\
    \ and way of doing things. Miss something out, even as small as a semicolon, and\
    \ your entire program will fail to be compiled and executed. Many a professional\
    \ programmer has fallen foul of sloppy structure.\n\n#INCLUDE <C++ STRUCTURE>\n\
    Learning the basics of programming, you begin to understand the structure of a\
    \ program. The commands may be different from one language to the next but you\
    \ can start to see how the code works.\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_123_0.png)\n\
    \n```\nINT MAIN()\n main() initiates the declaration of a function, which is a\
    \ group of code statements under the name 'main'. All C++ code begins at the main\
    \ function, regardless of where it lies within the code.\n```\n\n```\nhelloworld.cpp\n\
    #include <iostream>\nint main()\n```\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_123_1.png)\n\
    \n#INCLUDE The structure of a C++ program is quite precise. C++ code begins with\
    \ a directive: #include <. The directive instructs the pre-processor to include\
    \ a section of the standard C++ code. For example: #include <iostream> includes\
    \ the header to support input/output operations.\n\nBRACES The open brace (brackets)\
    \ is something that you may not have come before, especially if you're used to\
    \ Python. The open brace indicates the beginning of the main function and all\
    \ the code that belongs to that function.\n\n```\nhelloworld.cpp\n#include <iostream>\n\
    int main()\n{}\n```\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_123_2.png)"
- md: "\n# Structure of a C++ Program\n\n## COMMENTS\nLines that begin with a double\
    \ slash are comments. This means they won't be executed and are ignored by the\
    \ compiler. Comments are designed to help you, or another programmer looking at\
    \ your code, to explain what's going on. There are two types of comment: // multiple\
    \ line comments and /* a single line */.\n\n## <<\nThe chevrons used here are\
    \ insertion operators. This means that whatever follows the chevrons is inserted\
    \ into the std::cout statement. In this case they're the words 'Hello, world!'\
    \ which will be displayed on the screen when you compile the code.\n\n```cpp\n\
    helloworld.cpp\n#include <iostream>\n\nint main() {\n    // My first C++ program\n\
    }\n```\n\n```cpp\nhelloworld.cpp\n#include <iostream>\nusing namespace std;\n\n\
    int main() {\n    // My first C++ program\n    cout << endl;\n}\n```\n\n## STD\n\
    While std stands for something quite different, in C++ it means Standard. It's\
    \ part of the Standard Namespace in C++, which covers a number of different statements\
    \ and commands. You can leave std part out of the code but it must be declared\
    \ at the start with namespace std; not both. For example:\n\n## OUTPUTS\nLeading\
    \ on, the \"Hello, world!\" is what you want to appear on the screen when the\
    \ code is executed. You can enter whatever you like inside quotation marks. Sometimes\
    \ brackets are needed, depending on the compiler. The endl part needs a new line\
    \ to be inserted.\n\n```cpp\n#include <iostream>\nusing namespace std;\n```\n\n\
    ```cpp\n// My first C++ program\ncout << \"Hello, world!\\n\";\n```\n\n```cpp\n\
    #include <iostream>\nint main() {\n    // My first C++ program\n    std::cout\
    \ << \"Hello, world!\\n\";\n}\n```\n\n## COUT\nIn this example we are using cout,\
    \ which is a part of the Standard Namespace, hence why it's there, as we're asking\
    \ to use it for a particular purpose. Character cout, which displays, prints something\
    \ to the screen. If you want endl, you have to declare it at the start of the\
    \ code, as mentioned below.\n\n## ; and }\nFinally you can see that lines within\
    \ a function block (except the last) end with a semicolon. This marks the end\
    \ of the statement; all statements in C++ must have one at the end or the compiler\
    \ will fail to build. The very last line has the closing bracket to indicate the\
    \ end of the main function.\n\n```cpp\nhelloworld.cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main() {\n    // My first C++ program\n    cout << \"\
    Hello, world!\\n\";\n}\n```\n\n# Compile and Execute\n\nYou've created your first\
    \ C++ program and now you understand the basics behind the structure of one. Let's\
    \ get things moving and compile and execute, or run if you prefer, the program\
    \ and see how it looks.\n\n# GREETINGS FROM C++\n\nCompiling and executing code\
    \ from within Geany is remarkably simple and just a matter of clicking a couple\
    \ of icons and seeing the result. Here's how it's done.\n\n- STEP 1: Open Geany,\
    \ if you haven't already, and load up the previously saved Hello World you created.\
    \ Ensure that there are no visible errors, such as a missing semicolon at the\
    \ end of the std::cout line.\n- STEP 2: If your code is ready, click the menu\
    \ bar at the top of the Geany. Notice that midway along the line of icons there's\
    \ a red brick icon. This is Build, which when runs through the code, checking\
    \ if the C++ standards to see if there are any errors that stop it from running.\n\
    - STEP 3: When you click the Build icon, the pane at the bottom of the Geany interface\
    \ displays. If all is well, you will see a successful compilation, if not Geany\
    \ issues an error with col the error was found on.\n- STEP 4: With the code successfully\
    \ built, it's now time to execute it. Next to the Build icon there's a paper airplane\
    \ icon, this is the Run. You can't run code that hasn't been built or has an error\
    \ in place. Click the Run icon.\n\n```cpp\nhelloworld.cpp\n#include <iostream>\n\
    \nint main() \n{\n    // My first C++ program\n    std::cout << \"Hello, world!\\\
    n\";\n}\n```\n\nSTEP 5: When you click Run, the C++ code executes and a simple\
    \ Terminal window appears displaying the results of the code. In this simple code,\
    \ you can see the words: Hello, world! in the world; as you've already learned,\
    \ the code is cout (outputting) the contents between the quotes in the std::cout\
    \ code.\n\nSTEP 8: Just as mentioned previously, you don't need to have std::cout\
    \ if you've already declared the standard namespace at the start of the code.\
    \ Now, let's create a deliberate mistake, to see what happens. Remove the semicolon\
    \ from the cout line, so it reads:\n\n```cpp\ncout << \"Hello, world!\\n\"\n```\n\
    \n```cpp\n#include <iostream>\nint main() {\n    // First C++ program\n    cout\
    \ << \"Hello, world!\\n\";\n}\n```\n\n| File Edit Tabs Help |\n|---|---|---|\n\
    | Hello, world! | | |\n| | | |\n| program exited with code 0 | | |\n| press return\
    \ to continue | | |\n\n# helloworld.cpp\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\nint main() {\n    // First C++ program\n    cout << \"Hello,\
    \ world!\\n\";\n}\n```\n\nSTEP 6: Pressing Return/Enter in the command box line\
    \ closes it, returning to Geanty. Let's alter the code under the using namespace\
    \ std;\n\n`cout << \"Hello, world!\\n\"`\n\nThen, delete the std:: part of the\
    \ cout line:\n\nSTEP 9: Now and build the code once more. If all is well, you\
    \ will see a successful compilation, if not Geany issues an error with col the\
    \ error was found on.\n\n```cpp\nhelloworld.cpp\n#include <iostream>\n\nint main()\
    \ \n{\n    // My first C++ program\n    std::cout << \"Hello, world!\\n\";\n}\n\
    ```\n"
  mdcn: "\n\n# C++ 程序的结构\n\n## 注释\n以双斜杠开头的行是注释。这意味着它们不会被执行，并且会被编译器忽略。注释的设计是为了帮助你（或查看你代码的另一个程序员）解释正在发生什么。注释有两种类型：//\
    \ 多行注释和 /* 单行行注释 */。\n\n## <<\n这里使用的尖括号是插入运算符。这意味着紧随尖括号后的任何内容都将插入到 `std::cout`\
    \ 语句中。在这种情况下，它们是 'Hello, world!' 这几个单词，当你编译代码时，它们将显示在屏幕上。\n\n```cpp\nhelloworld.cpp\n\
    #include <iostream>\n\nint main() {\n    // My first C++ program\n}\n```\n\n```cpp\n\
    helloworld.cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n  \
    \  // My first C++ program\n    cout << endl;\n}\n```\n\n## STD\n虽然 `std` 代表的是完全不同的意思，但在\
    \ C++ 中它代表 Standard（标准）。它是 C++ 标准命名空间（Standard Namespace）的一部分，涵盖许多不同的语句和命令。你可以在代码中省略\
    \ `std` 部分，但必须在开头用 `namespace std;` 进行声明，两者不可兼得。例如：\n\n## 输出\n首先，\"Hello, world!\"\
    \ 是你希望在代码执行时出现在屏幕上的内容。你可以在引号内输入任何你喜欢的内容。根据编译器的不同，有时需要括号。`endl` 部分需要插入换行。\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n```\n\n```cpp\n// My first C++ program\n\
    cout << \"Hello, world!\\n\";\n```\n\n```cpp\n#include <iostream>\nint main()\
    \ {\n    // My first C++ program\n    std::cout << \"Hello, world!\\n\";\n}\n\
    ```\n\n## COUT\n在这个示例中，我们使用了 `cout`，它是标准命名空间的一部分，这就是为什么它会在那里的原因，因为我们将其用于特定目的。字符对象\
    \ `cout` 用于在屏幕上显示或打印某些内容。如果你想使用 `endl`，你需要像下文提到的那样，在代码开头声明它。\n\n## ; 和 }\n最后，你可以看到函数块内的行（最后一行除外）以分号结尾。这标记了语句的结束；C++\
    \ 中的所有语句末尾必须有一个分号，否则编译器将无法构建。最后一行有一个右括号，表示 `main` 函数的结束。\n\n```cpp\nhelloworld.cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main() {\n    // My first C++\
    \ program\n    cout << \"Hello, world!\\n\";\n}\n```\n\n# 编译与执行\n\n你已经创建了第一个 C++\
    \ 程序，现在你理解了其结构背后的基础知识。让我们行动起来，编译并执行（或者如果你愿意，也可以运行）程序，看看它是什么样的。\n\n# 来自 C++ 的问候\n\
    \n在 Geany 内部编译和执行代码非常简单，只需点击几个图标并查看结果。以下是操作方法：\n\n- 步骤 1：如果还没有打开，请打开 Geany，并加载你之前保存的\
    \ Hello World。确保没有可见的错误，例如 `std::cout` 行末尾缺少分号。\n- 步骤 2：如果代码已准备好，点击 Geany 顶部的菜单栏。注意在图标行的中间有一个红色的砖块图标。这是\
    \ Build（构建），它运行时会检查代码是否符合 C++ 标准，以查看是否存在阻止运行的错误。\n- 步骤 3：当你点击 Build 图标时，Geany\
    \ 界面底部的面板会显示。如果一切正常，你将看到编译成功；如果没有，Geany 会输出错误以及错误所在的行号。\n- 步骤 4：代码成功构建后，现在是执行它了。Build\
    \ 图标旁边有一个纸纸飞机图标，这是 Run（运行）。你不能运行尚未构建或存在错误的代码。点击 Run 图标。\n\n```cpp\nhelloworld.cpp\n\
    #include <iostream>\n\nint main() \n{\n    // My first C++ program\n    std::cout\
    \ << \"Hello, world!\\n\";\n}\n```\n\n步骤 5：当你点击 Run 时，C++ 代码开始执行，并弹出一个简单的 Terminal（终端）窗口显示代码的结果。在这个简单的代码中，你可以看到单词：Hello,\
    \ world!；正如你已经学到的，代码通过 `cout`（输出）输出了 `std::cout` 代码中引号之间的内容。\n\n步骤 8：正如之前提到的，如果你已经在代码开头声明了标准命名空间，就不需要使用\
    \ `std::cout` 了。现在，让我们故意制造一个错误，看看会发生什么。从 `cout` 行中删除分号，使其变为如下：\n\n```cpp\ncout\
    \ << \"Hello, world!\\n\"\n```\n\n```cpp\n#include <iostream>\nint main() {\n\
    \    // First C++ program\n    cout << \"Hello, world!\\n\";\n}\n```\n\n| 文件 |\
    \ 编辑 | 标签页 | 帮助 |\n|---|---|---|\n| Hello, world! | | |\n| | | |\n| program exited\
    \ with code 0 | | |\n| press return to continue | | |\n\n# helloworld.cpp\n\n\
    ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    // First\
    \ C++ program\n    cout << \"Hello, world!\\n\";\n}\n```\n\n步骤 6：在命令框行按回车键（Return）可以关闭它，返回到\
    \ Geany。让我们修改 `using namespace std;` 下方的代码：\n\n`cout << \"Hello, world!\\n\"`\n\
    \n然后，删除 `cout` 行中的 `std::` 部分：\n\n步骤 9：现在再次构建代码。如果一切正常，你将看到编译成功；如果没有，Geany 会输出错误以及错误所在的行号。\n\
    \n```cpp\nhelloworld.cpp\n#include <iostream>\n\nint main() \n{\n    // My first\
    \ C++ program\n    std::cout << \"Hello, world!\\n\";\n}\n```\n\n"
