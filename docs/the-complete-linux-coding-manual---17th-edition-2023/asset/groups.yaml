    # Getting Started with Linux


    > “In real open source, you have the right to control your own destiny.”

    >—Linus Torvalds (developer of the Linux kernel)


    ![](img/b810837b9059fc96b3c0bd60b035eb13_17_0.png)


    It''s all fine and well talking about how good Linux is but how do you get it
    on your computer? Installing Linux is remarkably simple but there are several
    options available to you. This section looks into how you can download the Linux
    ISO, install it on a PC as your main operating system and even how to install
    a virtual environment.


    With a virtual environment you can run Linux while still using your main operating
    system, be that Windows or macOS. Intrigued? Read on and find out more.


    | | |

    |---|---|

    | 20 | Creating a Linux Installer on Windows |

