    apt-get autoclean

    Reading package lists...

    Building dependency tree...

    Reading information...

    The following packages were automatically installed and are no longer required

    You want to remove the following PACKAGES:

    ```


    ## Install Apps via the Terminal – Part 2


    Most of the time you''ll get to install apps from the Terminal using the standard
    apt command. However, sometimes an app demands a little more. This means installing
    an app from its source code which isn''t as scary as sounds.


    ### THE SOURCE


    The commands you will need to be familiar with here are Configure, Make and Install.
    You''ll find a lot of apps using source so it''s certainly a skill worth investing
    time in.


    - STEP 1: Source code for Linux usually comes in the form of .tar.gz or .tar.bz2.
    Both are compressed files holding all the code needed to make. Start this tutorial
    by creating a new folder in Home: `mkdir vim`.

    - STEP 2: Vim, by the way, is an advanced editor which we''ll use as an example
    to install. Enter the folder, cd vim, then within the new folder, enter the following
    command into the Terminal: `wget://ftp.vim.org/pub/unix/vim-7.tar.bz2`.

    - STEP 3: The `wget` command retrieves content from the internet, in this case
    the downloaded file successfully, according to Mint''s file system, the compressed
    file should be displayed in red.

    - STEP 4: We need to uncompress the contents of the file, so: `tar -xf vim-7.4.bz2`
    or type `tar -xf v` and press Tab to auto-fill the remaining name.

    - STEP 5: If you enter ls again, you''ll notice that a new folder has been created:
    vim; light blue text representing a folder in Mint. It''s always wise to create
    root folders for the main app, as you upgrade apps through this method the individual
    versions will have their own folder.

    - STEP 6: Type in cd vim to enter the folder, and ls again to view its contents.
    There will be a fair number of files present; most are the app''s core files,
    others will be labeled README or INSTALL. It''s always wise to read these files
    if they provide valuable information regarding the installation.

    - STEP 7: With a successful ./configure, the system will create a Makefile. This
    needs to be ''made'' by entering: make into the Terminal. This may take a while,
    depending on the size of the app.

    - STEP 8: You may need to keep installing new dependencies, depending on the app.
    After each new dependency is installed, re-run ./configure and when it doesn''t
    report back with an error you can continue to the next stage of the installation.
    Note: you may need to search for some error messages.


    ```bash

    david@david-mint~$ ls

    vim7.4.0.tar.gz

    vim7.4.0.tar.gz

    david@david-mint~$ sudo apt update

    ```


