    ## 桌面环境


    Linux Mint 提供了几个不同的版本，或称为“口味：Cinnamon、MATE 和 Xfce；这些版本也有 32 位和 64 位之分。但这一切意味着什么？在安装时你应该选择哪一个版本呢？


    ## 选择哪种 MINT？


    桌面环境（Desktop Environment）是你用于与 Linux 核心系统交互的图形界面。就像 Windows 10 的桌面也被称为 Fluent
    设计一样。


    Linux Mint 为用户提供了多个版本的发行版选择：Cinnamon、MATE 和 Xfce。虽然对于初学者来说这听起来有些困惑，但每个版本都包含相同的
    Linux 结构和内核。内核是操作系统的核心，处理软件之间所有的指令。


    那么，为什么要费心不同的桌面环境呢？简单来说，这取决于个人喜味。有些用户偏好 MATE，因为 MATE 是经典 GNOME 2 环境的分支，更以菜单为中心，并且在旧电脑上运行良好。另一些用户则偏好
    Cinnamon，这是一个非常现代的环境，可以在最新的硬件上运行，并具有一些尖端的桌面代码。相比之下，Xfce 是一种轻量级桌面环境，由于其对可用系统资源的需求极低，在旧硬件上运行良好。


    每个版本都是不同的桌面环境，即你用于与操作系统交互的图形用户界面（GUI）。每个桌面环境使用不同的应用程序来访问或使用系统，例如用于浏览操作系统文件结构的文件管理器，或者启动其他程序的方式。尽管如此，核心的生产力工具、视频和图形套件是相同的，且功能也相同。


    简而言之，Cinnamon 是 Linux Mint 的旗舰桌面环境。MATE 与更广泛的硬件兼容性更好。例如，Windows 仅提供一种桌面环境供工作，而
    Linux 提供了许多。因此，Linux Mint 选择为用户提供丰富的选择空间。


    ![](img/b810837b9059fc96b3c0bd60b035eb13_13_0.png)


    ## 一丝 Cinnamon 的风味


    除了外观和感受之外，Cinnamon 还有许多优点，尽管这些也是重要的因素。在这里，我们概述了几个功能，帮助你判断它是否适合你。


    ### 绝佳特质 1


    它在更现代的系统上表现出色，但比以前稳定得多，不再是以前那样的资源大户了。因此，如果你正在用旧电脑安装 Linux Mint，不要被 Cinnamon 吓跑了。


    ![](img/b810837b9059fc96b3c0bd60b035eb13_14_0.png)


    ### 绝佳特质 2


    Cinnamon 具有可配置的“热角”（Hot Corners），点击桌面的角落都可以执行特定任务，例如显示工作区、显示所有窗口或运行命令。热角功能是切换不同视图极极方法，有助于让桌面成为更高效的环境。


    ## Best MATE


    MATE 是一种简单易且直观的桌面环境，快速且稳定。与 Cinnamon 相比，它看起来有点过时，但只是表面现象。使用 MATE 有很多理由。


    ### 绝佳特质 1


    MATE 是旧电脑的极佳桌面环境。它对硬件组件的支持性通常比 Cinnamon 好，但同样能够提供美观的桌面以及高级定制功能。


    ![](img/b810837b9059fc96b3c0bd60b035eb13_14_1.png)


    ### 绝佳特质 2


    由于其高度可配置的特性，MATE 可以进行精细的定制。对于对桌面环境有更高要求的用户，有很多可用选项，包括 Compiz 设置，你可以在其中配置各种桌面特效，甚至是
    3D 桌面立方体。


    ## 无胆固醇桌面


    Xfce 起始于 1996 年的通用桌面环境（CDE）。从那时起它更改了几次名称，现在简单称为 Xfce，绰称为“无胆固醇桌面环境”（Cholesterol
    Free Desktop Environment）。


    ### 绝佳特质 1


    Xfce 确实是一个快速的桌面，并发挥了 Linux 作为快速操作系统的最佳特性。事实上，从页面顶部开始将其安装到新电脑上只需很快；写下几百字，我们就在使用一个全新的操作系统了。不赖。


    ### 绝佳特质 2


    仅仅因为它是快速且轻量的，并不意味着 Linux Mint Xfce 不是一个完整的桌面操作系统。与提供的其他环境一样，你可以获得最新版本的 Firefox、Librefox、Libreoffice、VLC、Gimp、聊天软件，甚至是
    BitTorrent 客户端。


    ![](img/b810837b9059fc96b3c0bd60b035eb13_14_2.png)


    ## 哪个发行版？


    到为止我们主要看了 Linux Mint，但还有其他 Linux 发行版可以尝试。事实上，有数千个 Linux 发行版可以下载和安装，那么你应该决定使用哪一个呢？


    ## 发行版跳（Distro Hopping）


    “发行版跳”是社区用来形容那些从不固定单一发行版的人的术语。他们在不同的发行版之间来回跳跃，测试每一个，直到移动到另一个或新发布的发行版。


    发行版跳并没有错，它是了解可用资源并发现某个发行版相对于另一个另一个可能不符合你口味的元素的好方法。问题在于该选哪一个。


    '
