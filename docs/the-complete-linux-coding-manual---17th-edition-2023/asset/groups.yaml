    \n## Using Commenting\n\nWhile comments may seem like a minor element to the many\
    \ lines of code combine to make a game, an application or even an entire operating\
    \ system, in fact they're probably one of the most important factors.\n\n## THE\
    \ IMPORTANCE OF COMMENTING\n\nComments inside code are basically human readable\
    \ descriptions that detail what the code is doing at that particular point. They\
    \ don't sound especially important but without comments it is one of the most\
    \ frustrating areas unless you're a professional or just starting out.\n\nIn short,\
    \ all code should be commented in a manner as to effectively describe the purpose\
    \ of a line, section or individual elements. You should get into the habit of\
    \ commenting as much as possible so that someone who doesn't know about programming\
    \ can pick up your code and understand what it's going to do by reading your comments.\n\
    \nIn a professional environment, comments are vital to the success of the code\
    \ and the ultimately. In an organisation, many programmers work alongside engineers,\
    \ developers hardware analysts and so. If you're part of the team that's writing\
    \ a basic piece of software for a game, then your comments help save a lot of\
    \ time when something went wrong and another team has to pick up and follow the\
    \ trail to the incident.\n\nThe best comments are always concise and link the\
    \ code logically, detailing what when the program hits a line or section. You\
    \ don't need to comment on every line. Something along the lines of: if x=0 doesn't\
    \ require you to comment that it equals zero then that's going to be obvious to\
    \ the reader. If x equals something that drastically changes the program for the\
    \ user, such as we've run out of lines, it certainly needs to be commented.\n\n\
    Even if the code is simple, you should write comments if you are going to share\
    \ it with others. This way you can return to code and always understand what you\
    \ did or where it was you went, or what worked brilliantly.\n\nComments are good\
    \ practice and you understand how to add a comment if it's your second nature.\n\
