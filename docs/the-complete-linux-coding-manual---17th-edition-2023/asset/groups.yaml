    # How to Set Python in Linux


    ## STEP 5


    However, if you want the latest, cutting edge version, you need to build Python
    from source. Start by entering these commands into the Terminal:


    ```bash

    sudo apt-get install build-essential checkinstall

    sudo apt-get install libreadline-dev libsqlite3-dev tk

    libcurl4-openssl-dev libbz2-dev libncurses5g-dev

    ```


