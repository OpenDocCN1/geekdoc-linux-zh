    # # Pi x Linux =

    The Perfect Combination


    When the Raspberry Pi was in its developmental stages its designers needed to
    ensure that they were creating a piece of hardware that could offer much more
    than simply a cheap, but small, computer.


    The Pi needed to be flexible with what it could do, it needed to have room to
    grow into more ambitious project concepts and ideas, and the goal was to do so
    in as easy to fashion as possible. To create a universal learning platform, that
    students of any age could interact with easily, while learning new concepts such
    as programming, electronics, and computing. Naturally, once the hardware was developed,
    the only choice of operating system was code, Linux.


    The versatility of Linux is legendary. This incredible core is so malleable that
    it can be steered toward any aspect of computing, from supercomputing to robotics,
    the space industry to terrestrial engineering; education and science, manufacturing
    and the internet. Think of an industry, and you will likely find a Linux installation
    somewhere in the background keeping it all together.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_77_0.png)


    Raspbian is the recommended operating system for the Raspberry Pi, a customised
    Debian-based distribution that comes with a collection of useful tools for coding,
    electronics, and general desktop computing duties. Alongside the apps are preloaded
    modules to help you get the most from it, including programming languages that
    you decide to learn and use, as well as software modules that will enable you
    to power and use the hardware items specific to the Pi. For example, there are
    Python modules that interact with the Raspberry Pi''s 40-pin GPIO, allowing you
    to create content for any of the Hardware Attached on Top devices.


    This combination is what makes the Raspberry Pi an excellent base for operations
    to learn not only coding, but also Linux in general. Raspbian, being Debian-based,
    will be able to run any of the Terminal commands listed in this book, as Linux,
    Mint and Ubuntu are also Debian-based. And with very little setup, you''ll be
    able to have both your regular, Windows or macOS computers, and have a Raspberry
    Pi as a headless (a powered device that doesn''t need a keyboard, mouse or monitor
    attached) computer from which you can connect and learn how to use Linux and how
    to code.


