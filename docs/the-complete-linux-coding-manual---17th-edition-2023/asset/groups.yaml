    # Becoming Anonymous Online


    The digital age has led to many great advances in communications; however, it
    has brought in a new age of spying and snooping. Most of us are no strangers to
    the frequent news stories of governments, secret organisations and underground
    hackers breaking our privacy but how can you combat this?


    # ANONYMITY WITH MINT


    While it''s virtually impossible to become totally anonymous, you can take measures
    to ensure our privacy is at its best.


    +   - STEP 1 Starting with the basics, use HTTPS instead of the standard HTTP
    when browsing. This means that anything that transmitted over HTTPS is secure
    (hence the S part at the end) and encrypted.


    +   - STEP 3 Although Google may seem like the obvious choice for a modern internet
    search, the company does track all searches made by an individual. Consider an
    alternative search engine, such as DuckDuckGo, a search engine that doesn''t store
    personal data or track you.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_41_0.png)


    +   - STEP 2 When you''re browsing, consider using the Incognito or Private browsing
    modes in a browser. This disables your web history and cache, allowing you to
    browse without the details being stored for later scrutiny by someone else. However,
    it doesn''t stop any data or search tracking.


    +   - STEP 4 If you''re browsing on the Internet then consider installing some
    of the browser-plugins that. For example, for Firefox, use Ghostery, NoScript
    and Adblock Plus to block trackers, adverts and other data mining techniques.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_41_1.png)'
  - '[PAGE 42]


    # VPNS AND TOR


    The previous steps can aid your online privacy but to become anonymous you need
    a Virtual Private Network and Tor.


    A VPN is a remote server, or cluster of servers, that establishes a connection
    with your computer. The result is that your computer''s identity on the Internet
    is hidden behind the VPN remote server; so you could live in the UK but have an
    IP address (online computer identity) belonging to Iceland.


    When the download has finished, drop it into the Terminal and enter the Downloads
    folder. Enter `ls` to check if the tar.xz file is present, then enter `tar -xf
    tor-browser-linuxx64-8.0.4.tar.xz` (X is updated, if your version is different
    press Tab to autocomplete the tor-browser-filename). When the files are unpacked,
    use `cd tor-browser-en-US/` to enter the new folder.


    # STEP 1


    ![](img/b810837b9059fc96b3c0bd60b035eb13_42_0.png)


    # STEP 4


    ![](img/b810837b9059fc96b3c0bd60b035eb13_42_1.png)


    # STEP 2


    Most VPNs charge a monthly or annual fee but it''s worth the expense. We use CyberGhost,
    which.cyberghost.com, provides connections for Windows, Mac, Mint (and any other
    Linux distribution), Android and iOS devices. Details for each OS can be found
    at **support.cyberghost.com/hz/en-us/articles/213190329-Read-me-first-


    # STEP 5


    A look reveals a couple of entries: a folder called Browser and a file called
    ''start-tor-browser.desktop''. To start the tour so run `./start-tor-browser.desktop`.
    This command launches the Tor setup, where you will be offered two options: Connect
    or Configure. If you Connect, the connection will suffice. Click Connect when
    you''re ready.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_42_2.png)


    ![](img/b810837b9059fc96b3c0bd60b035eb13_42_3.png)


    # STEP 3


    Another option is to use Tor. Tor is an open network that you can connect to hide
    your IP address behind countless nodes. It''s ideal for Windows, Mac and Linux
    computers and is very easy to install and use. Start by navigating to **www.torproject.org/download/download-easy.html**
    and clicking on the Download Linux 64-bit version.


    # STEP 6


    After the connection is established, the Tor Browser is launched. This is a customized
    version of Firefox and here you can securely browse the Internet without being
    viewed or tracked. Mixing both VPN and Tor for an extremely secure and private
    connection to the online world.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_42_4.png)


