    ## REMOVING APPS


    In addition to installing apps, the apt command can be used to remove any apps
    and help keep your system free and up resources.


    ### STEP 1


    To uninstall, remove the Variety app enter: `sudo apt-get remove variety`. Enter
    y to continue with the uninstall of the app; notice also how much space you''re
    freeing up on the hard drive as result of removing the app.


    ### STEP 3


    When you remove apps from the system some packages that were automatically installed
    are no longer required. You already saw in the previous tutorial, you can clean
    them up using command `sudo apt-get autoremove`, followed by pressing y to accept
    the process.


    ```text

    apt-get remove variety

    Reading package lists...

    Building dependency tree...

    Reading information...

    The following packages were automatically installed and are no longer required

    You want to remove the following PACKAGES:

    libimage-dev:2:2.3.4-1ubuntu20.0.1 libgif-dev:2:1.1-1ubuntu libjpeg-dev:2:6.2.0-2ubuntu20.4.1
    gobib2-python3-10 python3-pysiv2 variety-slideshow

    The following packages will be REMOVED

    After this operation, 1.06 MB disk space will be freed.

    Do you want to continue? [Y/n]

    ```


    ```text

    apt-get autoremove

    Reading package lists...

    Building dependency tree...

    Reading information...

    The following packages were automatically installed and are no longer required

    You want to remove the following PACKAGES:

    libimage-dev:2:2.3.4-1ubuntu20.0.1 libgif-dev:2:1.1-1ubuntu libjpeg-dev:2:6.2.0-2ubuntu20.4.1
    gobib2-python3-10 python3-pysiv2 variety-slideshow

    The following packages will be REMOVED

    After this operation, 1.06 MB disk space will be freed.

    Do you want to continue? [Y/n]

    ```


    ### STEP 2


    While the apt-get remove removes the app it doesn''t remove any of the extra clutter
    comes with an app, such as configuration and library files. To remove: `sudo apt-get
    purge variety`.


    ### STEP 4


    Finally to tidy up all the unused packages in the system and to remove those that
    the autoremove can delete you enter: `sudo apt-get autoclean`. These few tasks
    are for keeping your Mint set up and turning off unnecessary caused by upgrades.


    ```text

    apt-get purge variety

    Reading package lists...

    Building dependency tree...

    Reading information...

    The following packages were automatically installed and are no longer required

    Package is not installed, so removed

    You want to remove the following PACKAGES:

    ```


