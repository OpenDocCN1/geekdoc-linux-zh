    # # Installing a Virtual Environment


    A Virtual Environment is a simulated computer system. Using a Virtual Machine,
    you can mimic a standard PC and install an entire operating system to it without
    affecting the one installed on your computer. It''s a great way to use Linux,
    while still having Windows 10 as your main OS.


    # ## GOING VIRTUAL


    Using a Virtual Machine (VM) takes resources from your computer: memory, hard
    drive space, processor and so on. Make sure you have enough of each commencing.


    +   **STEP 1** We''re using VirtualBox as one of the easiest environments to get
    grips with. Enter virtualbox.org and click on ''Download VirtualBox''. This takes
    you to the main download page. Locate the correct host for your system: Windows,
    Mac, Host being the current installed operating system, and click the link to
    begin the download.


    +   **STEP 3** With the correct packages downloaded, and before you install anything,
    you need to make sure that the computer you''re using is able to host a VM. To
    do this, reboot the computer and enter the BIOS. When the computer starts up,
    press the F2 or FWER key to enter Setup.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_23_0.png)


    +   **STEP 2** Next, while at the VirtualBox download page, locate the VirtualBox
    Extension Pack. The Extension Pack supports USB devices as well as numerous extras
    that can help the VM environment, more like actual emulation.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_23_1.png)'
