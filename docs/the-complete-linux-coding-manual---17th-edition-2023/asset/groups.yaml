    \n![](img/b810837b9059fc96b3c0bd60b035eb13_62_3.png)\n\n# Using the Terminal\n\
    \n## Linux Tips and Tricks\n\nAs you've seen, the Linux Terminal is quite an exceptional\
    \ environment. With a few extra apps installed, and a smid of command knowledge,\
    \ incredible, and often quite strange, things can be accomplished.\n\n## TAKING\
    \ COMMAND\n\nThere are countless Linux tips, secrets, hacks and tricks out there.\
    \ Some are very old, originating from Linux's Unix heritage, while others are\
    \ recent additions to Linux lore. Here's our ten tips and tricks.\n\n```\nEASTER\
    \ EGGS\nEmacs, the text editor, is a great piece of software, however, it also\
    \ contains a hidden Easter Egg? With Emacs installed (sudo apt-get install emacs),\
    \ drop to a Terminal session and enter:\nemacs -l 1 dunnett\ndunnet is a text\
    \ adventure by Ron Schnell in 1982, and hidden in Emacs.\n```\n\n```\nTERMINAL\
    \ BROWSING\nEver fanced being able to browse the Internet? While not particularly\
    \ useful, it is quite a fascinating thing to behold. To do so, enter:\nsudo apt-get\
    \ install elinks elinks\nEnter the website you want to visit.\n```\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_63_0.png)\n\
    \n## MOON BUGGY\n\nBased on the classic 1982 arcade game, Moon Patrol, Moon Buggy\
    \ appeared on the home computers of 1985 amid much praise. It's a cracking Atari\
    \ game, and it is available in the Linux Terminal by:\n\n```\nsudo apt-get install\
    \ moon-buggy.\n```\n\nThen:\nmoon-buggy\nEnjoy.\n\n## LET IT SNOW\n\nSnowing in\
    \ the Terminal isn't something you come across every day. If you're interested,\
    \ enter:\n```\nwget https://github.com/sentek/50548/raw/7d024716a57e9fb52632/snowjob.sh\n\
    chmod +x snowjob.sh\n./snowjob.sh\n```\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_63_1.png)\n\
    \n## Tips and Tricks\n\n## MEMORY HOG\n\nIf you need to see what apps are consuming\
    \ the most memory on Linux, simply enter:\nps aux | sort -rn\nThis sorts output\
    \ by memory.\n\n## BBS\n\nBack in the days of dial-up connections, the online\
    \ world was made up of Bulletin Board Systems. These remote servers proved hangout\
    \ for users to chat, swap code, play games and more. Using Linux, we can still\
    \ connect to some active BBS.\nThere are countless operational BBS available,\
    \ check out https://www.telnetbbsguide.com/bbs/list/ for more.\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_64_0.png)\n\
    \n## SHRED\n\nWhen you delete a file, there is a chance someone with the right\
    \ software could retrieve it. However, to securely and permanently delete a file,\
    \ use:\n```\nshred -u NAMEFILE.txt\n```\nReplace NAMEFILE with the name of the\
    \ file to delete.\n\n## DIRECTORY TREES\n\nIf you want to create an entire directory\
    \ (or folder) with one command:\n```\nmkdir -p New-Dir/{folder1,folder2,folder3,folder4}\n\
    ```\nThis creates a NewDir with four sub folders.\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_64_1.png)\n\
    \n## ASCII ART\n\nASCII can be striking when applied to images. However, it's\
    \ often difficult to get right. You can create some great ASCII art from the images\
    \ you have using img2txt:\n```\nimg2txt NAMEFILE.png\n```\nReplace NAMEFILE with\
    \ the actual name of the image on your system. If img2txt installed, use:\n```\n\
    sudo apt-get install caixa-utils.\n```\n\n## FORGOTTEN COMMANDS\n\nIt's not easy\
    \ to remember all the Linux commands. Frankly, we can use apropos to help us.\
    \ Simply use it, with a description of the:\n```\napropos \"copy files\"\napropos\
    \ \"rename files\"\n```\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_64_2.png)\n\
    \n## Linux and the Big Bang\n\nLinux is colliding particles, so we can understand\
    \ how the universe works.\n\n## DID YOU KNOW...\n\nthat Linux is at the heart\
    \ of the science behind the Large Hadron Collider? Using a combination of Red\
    \ Hat Linux and CentOS (an ultra-stable distro built from the Red Hat core) as\
    \ the base distributions choice, scientists, developers and engineers have created\
    \ SL - Scientific Linux.\n\nUsing SL as the base, the clever people at CERN have\
    \ developed several different versions of their own custom distro to help with\
    \ all aspects of the LHC. Most notable is SLC, or Scientific Linux, also known\
    \ as CERN6. According to reports, there are over 36,000 running SL, and over 15,000\
    \ running SLC.\n\n## Creating Bash Scripts – Part 1\n\nEventually, as you advance\
    \ with Linux Mint, you will start creating your own automated tasks and programs.\
    \ These are essentially scripts, Bash Shell scripts to be exact, and they work\
    \ in the same way as a DOS Batch file does, or any other programming language.\n\
    \n## SCRIPTING\n\nA bash script is simply a series of commands that Mint will\
    \ run through to complete a certain task. They can be simple or remarkably complex,\
    \ it all depends on the situation.\n\nYou'll be working within the Terminal and\
    \ with a text editor throughout the coming pages. There are alternatives to the\
    \ text editor, which we'll look at a moment for the sake of ease, we'll be doing\
    \ our examples in Xed. Before you begin, run through the custom update check:\
    \ `sudo apt-get update && sudo apt-get upgrade`.\n\n```\nFile Edit View Search\
    \ Terminal Help\ndaviddavid-mint $ sudo apt-get update && sudo apt-get upgrade\n\
    (sudo) password for david: \nHit:1: http://ppa.launchpad.net/openshot/ubuntu-focal\n\
    Hit:2: http://ppa.launchpad.net/perlivaty/ubuntu-focal\nHit:3: http://ppa.launchpad.net/blender/ubuntu-20.04\n\
    Hit:4: http://ppa.launchpad.net/thomas-schiez/ubuntu-focal\nHit:5: http://ppa.launchpad.net/ubuntu-zubuntu-back/\n\
    Ign:6: http://www.mirrorservice.org/sites/linux-mint/\nGet:7: http://ppa.launchpad.net/wine/ubuntu-focal\n\
    Hit:8: http://ppa.launchpad.net/wine-builds/ubuntu-focal\nHit:9: http://ppa.launchpad.net/wine/ubuntu-focal\n\
    Hit:10: http://repository.spotify.com InRelease\n```\n\nThere are several text\
    \ editors we can use to create and so on. A bash script: Xed, Vi, Nano, Mint and\
    \ in the end it all comes down to personal preference. The use of Xed is purely\
    \ really to making it easier to read the script in the screenshots you see below.\n\
    \n![](img/b810837b9059fc96b3c0bd60b035eb13_67_0.png)\n\n```\nFile Edit View Search\
    \ Terminal Help\ndaviddavid-mint $ ls\ndaviddavid-mint ~ - cd scripts/\ndaviddavid-mint\
    \ ~ - cd scripts $\n```\n\nWindows users will be aware that in order for a batch\
    \ file to work, as it is executed and follow the programming within, it needs\
    \ to have a BAT file extension. Linux is an extension-less operating system but,\
    \ the convention is to give it a.sh extension.\n\n```\nFile Edit View Search Terminal\
    \ Help\ndaviddavid-mint $ ls\ndaviddavid-mint ~ script2.sh script4.sh\ndaviddavid-mint\
    \ ~ - scripts $ script4.sh\n```\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_67_1.png)\n"
