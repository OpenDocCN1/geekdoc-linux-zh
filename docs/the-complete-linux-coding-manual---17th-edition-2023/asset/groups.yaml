    # Installing Linux in a Virtual Environment


    With Oracle VirtualBox now up and running, the next task is to create the Virtual
    Machine (VM) environment into which you install Linux. This process won''t affect
    your currently installed operating system, which is why a VM is a great choice.


    ## CREATING THE VM


    There are plenty of options to choose from when creating a VM. For now though,
    let''s set up a VM adequate to run Mint Cinnamon and perform.


    - **STEP 1** With VirtualBox, click on the New Icon in top right of the app. This
    opens the VM Wizard.

    - **STEP 2** In the box next to Name, type Linux Mint and VirtualBox should automatically
    choose Linux as the Type and Ubuntu (64-bit) as the Version; if not then use the
    drop-down boxes to select the correct settings (remember Mint is based on Ubuntu).
    Click Next when you''re ready to proceed.

    - **STEP 3** The next section defines the amount of memory, or RAM, the VM has
    allocated. This amount is taken from the available memory on your computer. For
    example, if we give the VM too much (8GB of memory installed and we''re giving
    2GB to the VM). When you''re ready, click Next.

    - **STEP 4** This section is where you start to create the virtual disk that the
    VM uses to install Mint on. The default option, "Create a virtual hard now", is
    the one we''re using. Click Create to move on.

    - **STEP 5** The pop-up window appears after Creating Ask you what type of virtual
    hard disk you want to create. We''re going to use the default VDI (VirtualBox
    Disk Image) in this case, as others are often used to move VMs from one VM to
    another. Make sure VDI is selected and click Next.

    - **STEP 6** The question of whether to opt for Dynamically fixed sized hard disk
    may be as somewhat confusing to the newcomer. A Dynamically allocated hard disk
    is a more flexible option and won''t take up much space in your virtual hard disk
    to begin. Ensure Dynamically is selected and click Next.

    - **STEP 7** The virtual hard disk is a single folder, to add your virtual hard
    disk, on your computer, in this state. The section has enough free space available.
    For example, we will use a bigger storage option on your D: drive, named it Linux
    Mint and allocate 25.50GB of space to the virtual hard disk.

    - **STEP 8** After Creating the initial setup of the VM is complete; now you should
    be looking at the newly created VM within the VirtualBox Application. Before you
    begin, click the Settings button and then within the General section click the
    Advanced tab. Choose ''Bidirectional'' for shared Clipboard and Drag ''n Drop.

    - **STEP 9** Follow by clicking on the System section, then the Processor tab.
    Depending on your CPU, allocate as many cores as you can afford to your host system;
    for the Display section, slide the Video Memory up to maximum and enable ''3D
    Acceleration''. Click OK to commit the settings.

    - **STEP 10** Click on the Start button and explore the folder (with a green icon)
    in the ''Start-up disk'' window to locate the downloaded ISO of Mint; then click
    Start to boot up with Linux Mint Live Environment. You can now install and follow
    the standard Installation requirements.


    > You have the Auto capture keyboard option turned on. This will cause the virtual
    machine to automatically capture


    # Getting to Know Linux


    > "Anyone can build a fast processor. The trick is to build a fast system."

    — Seymour Cray (Electrical Engineer, and designer/founder of Cray Supercomputers)


    We''ve used Linux Mint as a guideline, as it''s an easy to use distro and perfect
    for former users. It''s also one of the most developed and well documented distros
    well as some fantastic options. In this section, we introduce the Linux Cinnamon
    Menu and Desktop, how it works and what you can do to it. Want to create another
    user or discover how to become online? Then read on.


    | Page | Title |

    | :--- | :--- |

    | 30 | Introduction to the Cinnamon Menu |

    | 32 | Navigating the Desktop |

    | 34 | 10 Things to do After Installing Mint |

    | 36 | Did You Know... |

    | 38 | Creating Users |

    | 40 | Customising the Desktop |

    | 42 | Becoming Online |


    ## Introduction to the Cinnamon Menu


    Now that you have Linux installed it''s time to have a good look. First though,
    if you''re using Virtualbox you''ll have a notification regarding Software Rendering;
    here''s how to fix it. You''re already looked at functions, using insert, remove,
    but there are also functions that can be applied to.


    - **STEP 1** Before we begin, we''re assuming you have this issue. The Software
    Rendering message appears in the top right of the desktop. To fix this, click
    on Devices in the Virtualbox window, followed by Insert Additions CD.

    - **STEP 2** The Guest Additions CD contains drivers for Virtualbox including
    virtual hardware. When it''s loaded, you''ll get a ''software needs running''
    notification with two options, Cancel and Run. Click the Run button and enter
    your Linux password.

    - **STEP 3** After a moment or two you''re automatically dropped into a command
    line view called the Terminal. This details the installation of new drivers, removing
    any old drivers, and installing the latest version. It won''t take long and when
    it''s done you will be asked to hit Enter to exit the terminal.

    - **STEP 4** The Additions CD icon is on the desktop, so right-click and then
    scroll down the menu to click. You can now restart Linux Mint by clicking the
    Menu, the bottom icon in the left, then the Restart button. This reboots Mint
    and the problem is fixed.


    > This medium contains software intended to be automatically started. Would you
    like to run it? The software will run directly from the medium VBox_6.0. You would
    never run software that you don''t trust. If in doubt, press Cancel.


    # Cinnamon ON THE MENU


    Now the Software Rendering issue for Virtualbox is out of the way, let''s take
    a look at the Mint Menu and how it works. Remember, this is just for Mint Cinnamon,
    other distros look and behave differently.


    - **STEP 1** First off, you may have already noticed the Welcome Screen that pops
    up when you login to Linux. Take a moment to browse through the options, read
    the First Steps and so on. When you''re done, click the X in the top corner of
    the window to close it.

    - **STEP 2** You''ve already used the Mint Menu to reboot the system and when
    you first used the Linux Environment. This time, click the Mint Menu and hover
    over the Office entry in the middle column. This changes the icons represented
    in the right-hand column, detailing what apps are installed under that section.

    - **STEP 3** Launching any of the apps from the Menu is as simple as finding and
    clicking it. For example, under the Office section, click on LibreOffice Writer.
    Writer is the preprocessor for Linux Mint. It opens and saves as Microsoft Word
    and functions in almost the same way.

    - **STEP 4** Open up the Menu again but this time hover the mouse pointer over
    Graphics, then click on GNU Image Manipulation Program. GIMP is a powerful manipulation
    app that''s probably as effective as Adobe''s Photoshop but requires a little
    more work to get the results you want. It''s certainly worthy the time to master,
    though.

    - **STEP 5** If you''re looking for a particular function or app, such as setting
    a printer, click on the Search box at the top of the Mint Menu. Start typing the
    app or function you want, and the Mint Menu displays the relevant options below.
    This works with modern Linux menus, regardless of the distros.

    - **STEP 6** Hover over any of the apps listed on the right-hand column and right-click,
    to be presented with a list of options: Add to Panel, Add to Desktop, Add to Favorites
    and Uninstall. Most of these options are obvious in their use. Add to Favorites
    places the app in the left-hand, quick-access column.

