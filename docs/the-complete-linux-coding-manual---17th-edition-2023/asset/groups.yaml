    # Creating Users


    When you first install Linux Mint it is configured for single user. While sharing
    a user account with the entire family is fine, there may come a time when you
    need to create separate users with their own Home Folders.


    # NEW USERS


    Having different users means each user has access to his or her areas on the system.
    Documents, pictures, videos and so are on separate, with multiple users on other
    operating systems.


    +   * STEP 1 Click on the Linux Mint Menu and type ''users'' to begin searching
    for the relevant results. From the search results, choose Users and Groups and
    enter your password. The Users and Groups console is quite basic looking, and
    thankfully easy to use. At first, you can just see your own username from you
    installed Linux Mint.


    +   * STEP 3 Enter the new user''s Full Name, followed by the Username they need
    when logging into Linux. Make sure the username is all in lower case, a-z and
    0-9 characters. You can have full stops, underscores or hyphens if you wish. Click
    the Add button when you''re ready to continue.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_37_0.png)


    +   * STEP 2 To add a new user, click the Add button at the bottom of the console.
    There are two types of users you can create, Standard and Administrator. The new
    user needs to install new apps or accounts of the file system beyond their Home
    Folder, then opt for the Standard account type. Otherwise, use the Administrator
    account type.


    +   * STEP 4 The new user appears in the list of current Linux Mint users, in
    alphabetical order. At present, there is no password set so the user in the list
    of current users, click the No Password Set option under the user''s username.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_37_1.png)


