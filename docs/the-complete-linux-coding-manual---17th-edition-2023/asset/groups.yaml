    > “Python 是关于程序员到底需要多少自由的实验。自由太多会导致没人能读懂别人的代码；自由太少则会表达力受到威胁。”


    - Guido van Rossum（Python 编程语言开发者）


    ![](img/b810837b9059fc96b3c0bd60b035eb13_85_0.png)


