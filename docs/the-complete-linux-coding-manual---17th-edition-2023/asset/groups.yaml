    # Using the Terminal


    # # Linux Tips and Tricks


    As you''ve seen, the Linux Terminal is quite an exceptional environment. With
    a few extra apps installed, and a smid of command knowledge, incredible, and often
    quite strange, things can be accomplished.


    # ## TAKING COMMAND


    There are countless Linux tips, secrets, hacks and tricks out there. Some are
    very old, originating from Linux''s Unix heritage, while others are recent additions
    to Linux lore. Here''s our ten tips and tricks.


    ```

    EASTER EGGS

    Emacs, the text editor, is a great piece of software, however, it also contains
    a hidden Easter Egg? With Emacs installed (sudo apt-get install em25), drop to
    a Terminal session and enter:

    emacs -l 1 dunnett

    dunnet is a text adventure by Ron Schnell in 1982, and hidden in Emacs.

    ```


    ```

    TERMINAL BROWSING

    Ever fanced being able to browse the Internet? While not particularly useful,
    it is quite a fascinating thing to behold. To do so, enter:

    sudo apt-get install elinks elinks

    Enter the website you want to visit.

    ```


    ![](img/b810837b9059fc96b3c0bd60b035eb13_63_0.png)


    # ## MOON BUGGY


    Based on the classic 1982 arcade game, Moon Patrol, Moon Buggy appeared on the
    home computers of 1985 amid much praise. It''s a cracking Atari game, and it is
    available in the Linux Terminal by:


    ```

    sudo apt-get install moon-buggy.

    ```


    Then:

    moon-buggy

    Enjoy.


    # ## LET IT SNOW


    Snowing in the Terminal isn''t something you come across every day. If you''re
    interested, enter:


    ```

    wget https://github.com/sentek/1505483/raw/7d024716a57e9fb52632fee09f44275361c4d2/snowjob.sh

    chmod +x snowjob.sh

    ./snowjob.sh

    ```


