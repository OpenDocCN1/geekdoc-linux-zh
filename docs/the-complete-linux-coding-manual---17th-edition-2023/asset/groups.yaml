    # Common Coding Mistakes


    When you start something new you''re inevitably going to make mistakes, this is
    purely down to inexperience and those mistakes are great teachers in themselves.
    However, even experts make the occasional mishap. It is, to learn from them as
    best as you can.


    # X=MISTAKE, PRINT Y


    There are many pitfalls for the programmer to be aware of, far too many to be
    listed here. Being able to recognise a mistake and fix it when you start to move
    into more advanced territory, and become a better coder. Everyone makes, even
    coders with over thirty years'' experience. Learning from these basic common mistakes
    help build a better coding foundation.


    # SMALL CHUNKS


    It would be wonderful to be able to work like Neo from The Matrix movies. Simply
    ask, your operator loads it into your memory and you instantly everything about
    the subject. Sadly we can''t do that. The major pitfalls is someone trying to
    learn too much, too quickly. So taking coding in small pieces and take your time.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_143_0.png)


    # EASY VARIABLES


    Meaning naming for variables is a must to eliminate common coding mistakes. Having
    letters of the alphabet is fine but what happens when the code states a problem
    with x variable. It''s not too difficult to name lives, money, player 1 and so.


    ```

    var points = 1023;

    var lives = 3;

    var totalTime = 45;

    write("Points: " + points);

    write("Lives: " + lives);

    write("Total Time: " + totalTime + " seconds");

    var playerScore = 0;

    write("Your total Score is: " + playerScore);

    ```


    # //COMMENTS


    Use comments, it''s a simple concept but can save many problems when you come
    next to over it. Inserting comment lines helps you quickly sift through thousands
    of lines of code that are causing problems; also if you need to review an older
    piece of code.


    ```

    orig x = 2;

    target x = 2;

    n = 5;


    #endif

    if (n == 0)

    return;

    //

    // Loop running. Here is the example:

    // (x - (-3)) is the greatest multiple of 4

    // In the while loop ahead, orig will move over

    increment by (a element of 4);

    // end marks our boundary for not falling out

    char * const end = 2 * (n & -3)

    // See if we''re aligned for writing in 64 bit

    #if abs(x) > 6

    !((defined(__amd64)) || defined(__x86)))

    ```


    # PLAN AHEAD


    While it''s great to have one morning and evening to decide a classic text adventure,
    it''s not practical without a good plan. Small snippets of code can be written
    without much thought and planning but longer and in-depth code requires a good
    planning work to stay and help iron out bugs.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_143_1.png)'
