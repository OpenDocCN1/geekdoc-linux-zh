- md: "\n## Creating Bash Scripts - Part 3\n\nYou can loop over data using the FOR,\
    \ WHILE and UNTIL statements. These can be handy if you're batch naming, copying\
    \ or running a script when a counter is needed.\n\nCreate a new script called\
    \ `count`. Enter the text in the screenshot below, save and make it executable.\
    \ The script creates the variable 'count' which at the beginning of the script\
    \ equals zero. Then the WHILE loop, WHICH count is less than (the LT part) 100\
    \ will print the current value of count in the echo command.\n\nTHE UNTIL loop\
    \ works much the same way as the WHILE loop does, more often than not, in reverse.\
    \ So counting to a hundred, using UNTIL, will be: `[ $count -gt 100 ]; do`. The\
    \ difference being, until count is greater (the gt part) one hundred, keeps looping.\n\
    \n```bash\nFile Edit View Search Tools Documents Help\ncount.sh\n#!/bin/bash\n\
    count=0\nwhile [ $count -lt 100 ]; do\n  echo $count\n  count=$((count+1))\ndone\n\
    ```\n\nExecuting the script will result in the numbers 0 to 99 listing the Terminal\
    \ screen; when it reaches the counter 100 will exit. Modify the script with the\
    \ FOR statement, it works much the same way. To use it in your script, enter the\
    \ text from the screenshot below to count.sh.\n\nYou're not limited to numbers\
    \ to one hundred. You can loop, whatever set of commands you execute as many times\
    \ as you want the loop to run. Renaming files, creating folders for example, this\
    \ script will create folders named folder1 through folder 100 using the FOR loop.\n\
    \n```bash\nFile Edit View Search Tools Documents Help\ncount.sh\n#!/bin/bash\n\
    for count in {0..100}; do\n  echo $count\ndone\n```\n\nThe addition we have here\
    \ is: `count in {0..100}; do` means: FOR the variable count in the numbers from\
    \ zero to one hundred, start the loop. The rest of the script is the same. Run\
    \ this script, and see the output appear in the Terminal.\n\nUsing the FOR statement\
    \ once more, we can execute the counting sequence by manipulating the (0..100)\
    \ part. This section of the code actually means (START, END, INCREMENT); if there's\
    \ no increment it's just a single digit to the END. For example, we could use\
    \ the loop to count up to 1000 with `for count in {0..1000..2}; do;`\n\n```bash\n\
