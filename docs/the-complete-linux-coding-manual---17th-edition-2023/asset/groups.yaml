    ## Using the Terminal


    ![](img/b810837b9059fc96b3c0bd60b035eb13_83_0.png)


    > DID YOU KNOW... that NASA''s state-of-the-art supercomputing cluster, Pleiades,
    is powered by Linux? Pleiades consists of 160 racks (11,440 nodes), 245,536 CPU
    cores, a total memory count of 935TB, 184,320 NVIDIA CUDA cores, and over six
    miles of fibre optic cabling.


    At the HEART of it lies a complex setup of SUSE Linux Enterprise Server, along
    with many custom development packages and other software unique to NASA''s projects.
    The projects NASA''s Advanced Supercomputing Division uses Pleiades for: The Kepler
    Mission—searching for extra-Earth-like planets; CFD (Computational Fluid Dynamics)
    modelling to help create more efficient space launch systems; Dark Matter research
    and simulation; and visualisation of Earth''s ocean currents, building data for
    the ECCO (Estimating the Circulation and Climate of the Ocean) Project.


    Did You Know...


    NASA''s Linux-powered supercomputer, Pleiades, Currently ranked the 11th most
    powerful in the world.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_84_0.png)


    ![](img/b810837b9059fc96b3c0bd60b035eb13_84_1.png)


