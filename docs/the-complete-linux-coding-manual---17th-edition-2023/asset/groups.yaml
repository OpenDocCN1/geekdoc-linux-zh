    \n## 注释的重要性\n\n代码内部的注释基本上是人类可读的描述，详细说明了代码在特定位点正在做什么。它们听起来不是特别重要，但如果没有注释，除非你是专业人士或刚刚起步，否则这将是最令人沮丧的领域之一。\n\
    \n简而言之，所有代码都应该进行注释，并能有效地描述一行、一个部分或单个元素的目的。你应该养成尽可能多注释的习惯，这样不了解编程的人也可以拿起你的代码，通过阅读注释来理解它将要做什么。\n\
    \n在专业环境中，注释对于代码的成功以及最终的成功至关重要。在一个组织中，许多程序员与工程师、开发人员、硬件分析师等工作。如果你是为游戏编写基础软件的团队成员，那么当出现问题且另一个团队必须接手并追踪事件溯源时，你的注释将帮助节省大量时间。\n\
    \n最好的注释总是简洁的并在逻辑上连接代码，详细说明程序运行到某一行或某部分时发生了什么。你不需要对每一行进行注释。类似 `if x=0` 这样的代码不需要你注释它等于零，这对读者来说是显而易见的。如果\
    \ `x` 等于某个极大改变用户程序的值，例如我们的行数用完了，那么确实需要注释。\n\n即使代码很简单，如果你打算与他人分享，也应该编写注释。这样你就可以回到代码，并始终理解你做了什么、去到了哪里，或者哪些部分运行得非常出色。\n\
    \n注释是一种良好的习惯，当添加注释成为你的本能时，你就理解了如何添加它。\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_129_0.png)\n\
