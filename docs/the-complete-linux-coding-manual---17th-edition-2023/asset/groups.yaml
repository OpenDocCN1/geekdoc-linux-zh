    JNZ A\nRET\n``` A\n```\n\n# Linux Coding & Programming\n\n## C++ Comments\n\n\
    Commenting in C++ involves using a double slash `//` or a forward slash and an\
    \ asterisk `/* */`. You've already seen brief examples but this is how it works.\
    \ Using the Hello World code as an example, you can easily comment different sections\
    \ of the code using the double slash:\n\n```cpp\n// My first C++ program\ncout\
    \ << \"Hello World!\";\n```\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main() {\n    // My first C++ program\n    cout << \"Hello, World!\";\n  \
    \  cout << \"And greetings from C++!\";\n}\n```\n\nBe careful when commenting\
    \ with block comments. It's very easy to forget to add the closing asterisk and\
    \ forward slash and any code fails to indent the comment block.\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main() {\n    // First C++ program\n \
    \   cout << \"Hello, World!\"; // This line outputs the words\n    /*\n    several\
    \ lines\n    without the need to add more slashes */\n    cout << \"And greetings\
    \ from C++!\";\n}\n```\n\nHowever, you can add comments to a line of code to describe\
    \ in a better way what is going on:\n\n```cpp\ncout << \"Hello, World!\"; // This\
    \ outputs the words 'Hello, world.' denotes a new line.\n```\n\nNote, you don't\
    \ have to put a semicolon at the end of a comment. This is because it's in a line\
    \ that is ignored by the compiler.\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n    // My first C++ program\n    cout << \"Hello, World!\"\
    ; // This line outputs the words 'Hello, world.' denotes a new line.\n}\n```\n\
    \nYou can comment out several lines by using the forward slash and asterisk:\n\
    \n```\n/*\nseveral lines\nwithout the need to add more slashes */\n```\n\nRemember\
    \ to finish the block comment with the opposite asterisk and forward slash.\n\n\
    ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    // My first\
    \ C++ program\n    cout << \"Hello, World!\"; // This line outputs the words 'Hello,\
    \ world.' denotes a new line.\n    /*\n    several lines\n    without the need\
    \ to add more slashes */\n}\n```\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n    cout << \"Hello, World!\";\n}\n```\n\nIf you try to\
    \ build and execute the code it errors, complaining of a missing curly bracket\
    \ to finish off the block of code. If you have made the error a few times, then\
    \ it is easy to go back and rectify. Frankly, the commenting in Geany helps identify\
    \ comments with:\n\n- Symbols\n- helloworld.cpp\n- #include <iostream>\nusing\
    \ namespace std;\n- main (4)\n- Variables\n- main (2)\n\n```cpp\ncout << \"Hello,\
    \ World!\";\n/*\nseveral lines\nwithout the need to add more slashes */\ncout\
    \ << \"And greetings from C++!\";\n```\n\nWith block comments, it is good practice\
    \ in C++ to add an asterisk to each new line of the block. This also helps you\
    \ to remember to close the comment block before continuing with the code:\n\n\
    ```\n/*\nseveral lines\nwithout the need to add more slashes */\n```\n\nFrankly,\
    \ Geany does this automatically but be aware of it when using IDEs.\n\n# Variables\n\
    \nVariables differ slightly when using C++ as opposed to Python. In Python, you\
    \ can simply state that 'a' equals 10 and a variable is assigned. However, in\
    \ C++ a variable has to be declared with its type before it can be used.\n\n##\
    \ THE DECLARATION OF VARIABLES\n\nYou can declare a C++ variable by using statements\
    \ in the code. There are several distinct types of variable you can declare. Here's\
    \ how it works.\n\n- **STEP 1** Open a new, blank C++ file and enter the usual\
    \ code headers:\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\n\
    {\n}\n```\n\n- **STEP 3** You can build and run the code but it won't do much,\
    \ other than store the variables 10 and 5 to the integers a and b. Ignore the\
    \ warns about variables set but not used, the code still works. To output the\
    \ contents of the variables, add:\n\n```cpp\ncout << a;\ncout << \"\\n\";\ncout\
    \ << b;\n```\n\nThe `cout << \"\\n\";` part simply place a new line between the\
    \ output of 10 and 5.\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_131_0.png)\n\
    \n- **STEP 2** Start by creating two variables, a and b, with one having a value\
    \ of 10 and the other 5. You use the data type int to declare these variables.\
    \ Within the curly brackets:\n\n```cpp\nint a;\nint b;\na = 10;\nb = 5;\n```\n\
    \n![](img/b810837b9059fc96b3c0bd60b035eb13_131_1.png)\n\n- **STEP 4** Naturally\
    \ you can declare a new variable, call it result and output some simple arithmetic:\n\
    \n```cpp\nint result;\nresult = a + b;\ncout << result;\n```\n\nInsert the above\
    \ into the code as the screenshot.\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_131_2.png)\n"
