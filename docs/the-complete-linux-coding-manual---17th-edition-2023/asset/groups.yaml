    ISO。


    ![](img/b810837b9059fc96b3c0bd60b035eb13_11_0.png)


    ## DVD 安装


    使用 DVD 安装 Linux Mint 只需要一张空白 DVD-R 光。当然，你还需要一个光驱（DVD驱动器）才能将 ISO 镜像刻录到光盘。


    ![](img/b810837b9059fc96b3c0bd60b035eb13_11_1.png)


    ## 虚拟机


    安装虚拟机是测试和使用 Linux 发行的常用方法。Linux Mint 在虚拟机中运行效果非常好，稍后详述。有许多虚拟机软件可用；然而，Oracle 的
    VirtualBox 是最易用的之一。你可以在 virtualbox.org 找到最新版本。


    ![](img/b810837b9059fc96b3c0bd60b035eb13_12_0.png)


    ## MAC 硬件


    尽管（如此）Linux Mint 可以安装在 Mac 上，但有一种观点认为 Mac 用户使用虚拟机，例如 VirtualBox 或 Parallels；何不呢，macOS
