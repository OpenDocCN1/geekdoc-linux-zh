    ## 创建 Bash 脚本 – 第三部分


    在之前的页面中，我们查看了一些基础基础脚本，涉及向屏幕输出文本、获取用户输入、存储并输出到屏幕，以及包含系统变量。现在让我们结合你目前获得的内容，并引入循环（Loops）。IF,
    THEN, ELSE。


    在大多数编程结构中，你都会遇到需要循环命令的时刻。


    - **第 1 ** 让我们现在查看 If、Then 和 Else 语句，当正确执行时，它们会比较一组指令。

    - **第 2 ** `Greeting2.sh` 是 `greeting.sh` 的副本，但有一处不同。在这里我们为 if 语句添加了一个循环。这意味着，如果变量等于
    David，下一行 `THEN` 将执行的操作。

    - **第 3 ** 下一行 `ELSE` 是变量不等于“David”时发生的情况。在这种情况下，它简单地在屏幕上输出“Awesome”，随后是变量。

    - **第 4 ** 你显然可以对脚本进行一些小调整，更改触发响应的名称变量；甚至在名字和姓氏变量匹配特定内容时发出响应。

    - **第 5 ** 最后一行 `fi` 语句将结束循环。如果你输入了无效命令，将得到错误。


    ```

    #!/bin/bash

    echo "Hello, what is your name?"

    read firstname

    echo "Thank you, and what is your surname?"

    read surname

    echo "$firstname"

    if [ "$firstname" != "David" ] && [ "$surname" != "Hayward" ]; thennecho "Awesome
    $firstname $surname"

    else echo Hello $firstname $surname, how are you on this fine day

    ```


