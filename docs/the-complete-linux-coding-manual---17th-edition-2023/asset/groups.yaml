    \n```\nhelloworld.cpp\n#include <iostream>\nint main()\n{\n    // 我的第一个程序\n  \
    \  std::cout << \"hello!\";\n}\n```\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_122_0.png)\n\
    \nLinux 编码与编程 123\n\n# C++ 程序的结构\n\nC++ 有非常明确的结构和处理问题的方法。漏掉任何内容，即使是一个小分号，你的整个程序将无法编译。许多专业程序员都曾毁于疏散的结构。\n\
    \n#INCLUDE <iostream>\n通过学习编程基础，你开始理解程序的结构。命令在不同语言之间可能不同，但你可以开始看到代码是如何工作的。\n\n\
