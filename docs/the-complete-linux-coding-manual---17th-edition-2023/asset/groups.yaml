    ![](img/b810837b9059fc96b3c0bd60b035eb13_142_0.png)\n\n《霍比特人》是一个计算机软件里程碑的超级程序。你将在文字和图形中面临危险、刺激和冒险。遇到《霍比特人》中的所有角色并用普通的英语与他们交谈！《霍比特人》程序带你进入充满挑战的幻想世界！\n\
    \n## MELBOURNE HOUSE\n\n> 霍比特，1982年高级编码的奇迹。\n\n## 常见编程错误\n\n当你开始学习新事物时，不可避免会出错，这完全是因为缺乏经验，而错误本身就是很好的老师。然而，即使是专家也会偶尔出错。最好的方法是尽可能从中学习。\n\
    \n## X=错误，打印 Y\n\n程序员有很多需要注意的陷阱，这里列不完。当你开始进入更高级领域时，能够识别并修复错误将让你成为更好的程序员。每个人都会出错，即使是拥有三十年经验的程序员。从这些基础常见错误中学习有助于建立更好的编程基础。\n\
