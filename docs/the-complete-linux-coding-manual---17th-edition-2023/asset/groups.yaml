    Pleiades 用于以下项目：开普勒任务——寻找类地外行星；CFD（计算流体力学）建模，以帮助创建更高效的太空发射系统；暗物质研究与模拟；以及地球洋流的可视化，为
    ECCO（海洋循环和气候估计）项目构建数据。


