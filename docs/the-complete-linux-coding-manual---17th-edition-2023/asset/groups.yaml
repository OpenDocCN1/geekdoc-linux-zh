    ## Creating Bash Scripts – Part 3


    In the previous pages we looked at some very basic scripting, involved outputting
    text to the screen, getting a user''s input, storing it and outputting to the
    screen as well as including a system variable. Now let''s combine what you''ve
    achieved so far and introduce Loops. IF, THEN, ELSE


    With most programming structures there will come a time where you need to loop
    through the commands.


    - **STEP 1** Let''s look at the If, Then and Else statements now, when executed
    correctly, compare a set of instructions.

    - **STEP 2** Greeting2.sh is a copy of greeting.sh but with a slight difference.
    Here we''ve added a loop to the if statement. This means, IF the variable is equal
    to David the next line, THEN is to what happens.

    - **STEP 3** The next line, ELSE, is what happens if the variable doesn''t equal
    ''David''. In this case it simply outputs to the screen ''Awesome'', followed
    by the variable.

    - **STEP 4** You can obviously play around with the script a little, changing
    the name variable that triggers a response; or even issuing a response where the
    first name and surname variables match a specific.

    - **STEP 5** The last line, the fi statement, is what will end the loop. If you
    have an invalid command get an error.


    ```

    #!/bin/bash

    echo "Hello, what is your name?"

    read firstname

    echo "Thank you, and what is your surname?"

    read surname

    echo "$firstname"

    if [ "$firstname" != "David" ]; && [ "$surname" != "Hayward" ]; thennecho "Awesome
    $firstname $surname"

    else echo Hello $firstname $surname, how are you on this fine day

    ```

