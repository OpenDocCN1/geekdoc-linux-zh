    ## Creating Bash Scripts – Part 2


    Previously we looked at creating your first Bash script, Hello World, and adding
    system variables. Now you can expand these and see what you can do when you start
    to play around with creating your own variables.


    ### VARIABLES


    Just as in every programming language Bash script can store and call certain variables
    from the system.


    - **STEP 1** Let''s start by creating a new script called `hello.sh`. Save the
    file and exit. Then `#!/bin/bash`, then `echo $1`. Make the script executable
    with `chmod +x hello.sh`.

    - **STEP 2** As the script is now executable, run it with `./hello.sh`. Now, a
    simple ''Hello'' is displayed in the Terminal. However, if you want to change
    the variable it begins to get interesting. For example, try `./hello.sh`.

    - **STEP 3** The output will now be Hello David is because Bash automatically
    assigns variables for the user, which are then held and parsed by the script.
    The variable `$1` now holds ''David''.

    - **STEP 4** You can rename variables. Modify the hello script with the following:
    `firstname=$1`, `surname=$2`, `echo $firstname $surname`. Putting each statement
    on a new line. Save the script and exit back into the Terminal.

    - **STEP 5** When you run the script you can now use custom variables: `./hello.sh`.
    Naturally change the variables with our name; the moment we''re just printing
    the contents, let''s use a two-variable list.

    - **STEP 6** Create a new script called addition.sh, using different variable
    names. Here we use firstnumber and secondnumber, and use the echo command to output
    simple arithmetic by using an integer expression. The sum is `$((firstnumber+secondnumber))`.
    Save the script and make it executable (chmod +x addition.sh).

    - **STEP 7** When you run the addition script we can enter two numbers: `./addition.sh
    1 2`. The result will helpfully be 3, with the terminal displaying ''The sum is
    3''. Try it with a few different numbers and see what happens. You can also copy
    the script and rename it to multiplication and subtraction.

    - **STEP 9** We''ve added a -n to the echo command here which will leave the cursor
    on the same line as the question, introducing a new line. The read command stores
    the users'' input as the variables firstname, and to read back later in the echo
    line. The clear command clears the screen.

    - **STEP 10** As a final addition, let''s include the date variable we used in
    the last section. The last line of the script to read: `echo Hello $firstname
    $surname, how are you on this fine $(date +Y)?` The output should display the
    current day of the week, calling it from a system variable.


