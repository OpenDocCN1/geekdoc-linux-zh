    ## 移除应用


    除了安装应用外，`apt` 命令还可以用于移除应用并保持系统整洁。


    ### 第 1 步


    要卸载应用，输入：`sudo apt-get remove variety`。输入 `y` 继续卸载应用；注意释放了多少硬盘空间。


    ### 第 3 步


    当你从系统中移除应用时，某些自动安装的软件包不再需要了。正如你之前看到的，可以使用 `sudo apt-get autoremove` 命令来清理它们，并按
    `y` 接受过程。


    ```text

    apt-get remove variety

    Reading package lists...

    Building dependency tree...

    Reading information...

    The following packages were automatically installed and are no longer required

    You want to remove the following PACKAGES:

    libimage-dev:2:2.3.4-ubuntu20.1 libgif-dev:2:1.1-ubuntu libjpeg-dev:2:6.2.0-ubuntu20.4.1
    python3-slideshow

    The following packages will be REMOVED

    After this operation, 1.06 MB disk space will be freed.

    Do you want to continue? [Y/n]

    ```


    ```text

    apt-get autoremove

    Reading package lists...

    Building dependency tree...

    Reading information...

    The following packages were automatically installed and are no longer required

    You want to remove the following PACKAGES:

    libimage-dev:2:2.3.4-ubuntu20.1 libgif-dev:2:1.1-ubuntu libjpeg-dev:2:6.2.0-ubuntu20.4.1
    python3-slideshow

    The following packages will be REMOVED

    After this operation, 1.06 MB disk space will be freed.

    Do you want to continue? [Y/n]

    ```


    ### 第 2 步


    `apt-get remove` 虽然移除了应用，但不会移除应用的额外杂质，例如配置和库文件。要移除这些，输入：`sudo apt-get purge variety`。


    ### 第 4 步


    最后清理系统中未使用的软件包并删除 `autoremove` 可以删除的内容，输入：`sudo apt-get autoclean`。这些任务是为了保持你的
    Mint 设置并关闭升级产生的残留文件。


    ```text

    apt-get purge variety

    Reading package lists...

    Building dependency tree...

    Reading information...

    The following packages were automatically installed and are no longer required

    Package is not installed, so removed

    You want to remove the following PACKAGES:

    ```


    ```text

    apt-get autoclean

    Reading package lists...

    Building dependency tree...

    Reading information...

    The following packages were automatically installed and are no longer required

    You want to remove the following PACKAGES:

    ```


    ## 通过终端安装应用 – 第 2 部分


    大多数情况下，你将使用标准的 `apt` 命令从终端安装应用。然而，有时应用需要更多操作。这意味着从源代码安装应用，这听起来并没有那么可怕。


    ### 源码


    你在这里需要熟悉的命令有 `Configure`、`Make` 和 `Install`。你会发现很多应用使用源码，因此这是一项值得投入时间的技能。


    - 第 1 步：Linux 源码通常以 `.tar.gz` 或 `.tar.bz2` 的形式出现。两者都是包含编译所需代码的压缩文件。通过在主目录下创建一个文件夹开始本教程：`mkdir
    vim`。

    - 第 2 步：提到，Vim 是一种高级编辑器，我们将它作为安装示例。进入文件夹 `cd vim`，然后在新文件夹中终端输入以下命令：`wget://ftp.vim.org/pub/unix/vim-7.tar.bz2`。

    - 第 3 步：`wget` 命令从互联网获取内容，在这种情况下成功下载了文件。根据 Mint 的文件系统，压缩文件应显示为红色。

    - 第 4 步：我们需要解压文件内容，所以：`tar -xf vim-7.4.bz2` 或输入 `tar -xf v` 并按 `Tab` 键填充剩余名称。

    - 第 5 步：如果你再次输入 `ls`，你会发现创建了一个文件夹：`vim`；浅蓝色文本在 Mint 中代表文件夹。为主应用创建根文件夹总是明智的，因为当你通过这种方法升级应用时，各个版本将有自己的文件夹。

    - 第 6 步：输入 `cd vim` 进入文件夹，再次输入 `ls` 查看其内容。会有相当数量的文件存在；大部分是应用的核心文件，其他将标记为 `README`
    或 `INSTALL`。如果这些文件提供了有关安装的价值信息，阅读它们总是明智的。

    - 第 7 步：成功执行 `./configure` 后，系统将创建一个 `Makefile`。这需要通过在终端中输入 `make` 来“制作”。这可能需要一些时间，取决于应用的大小。

    - 第 8 步：你可能需要安装新的依赖项。在安装每个新依赖后，重新运行 `./configure`，当不再报错时就可以继续安装的下一个阶段。注意：你可能需要搜索错误信息。


    '
