    helloworld.cpp\n#include <iostream>\nint main()\n```\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_123_1.png)\n\
    \n#INCLUDE C++ 程序的结构非常精确。C++ 代码以指令开始：#include <。指令指示预处理器包含标准 C++ 代码的一个部分。例如：#include\
    \ <iostream> 包含了支持输入输出操作的头文件。\n\nBRACES 大括号（括号）是你可能以前遇到过的东西，如果你习惯了 Python 的话。大括号表示\
