    ## Python Linux


    ## Why Python?


    There are many programming languages available for the modern computer, and some
    still available for 8 and 16-bit computers. Some of these languages are designed
    for scientific work, others for mobile platforms and such. Why you choose Python
    out of all of the rest?


    ## PYTHON POWER


    Ever since the earliest computers were available, enthusiasts, users and professionals
    have toiled away until the hours, slaving over an overheating heat of circuitry
    to create something akin.


    These pioneers of programming coders carved their way into a new frontier, small
    programs that enabled the letter ''A'' to scroll across the screen. It might not
    sound terribly exciting to a generation that''s used to ultra high-definition
    graphics and open world, multi-player games. However, forty-something years ago
    it was blindingly brilliant.


    Naturally these bedrockers formed the foundations for every piece of digital technology
    we use today. Some of us became chief developers for software companies, others
    pushed the hardware to its limits and founded the public empire that continues
    to amaze us.


    Regardless of whether you use an Android device, iOS device, PC, Mac, Linux, Smart
    TV, games, MP3 player, GPS device built-in to a car, set-top box or other connected
    and ''smart'' appliances, they all are programming.


    All those aforementioned digital devices need instructions to tell what to do,
    and also to be interacted with. These instructions are the programming code of
    the device and that can be built using a variety of programming languages.


    The languages we use in today depend on the platform, the device''s use and how
    the user will interact with the environment or users. Operating systems, such
    as Windows, macOS and Linux are usually a combination of C++, Python, and some
    form of visual-based language. Games generally are a combination of C++, C#, and
    some form of visual-based language.


