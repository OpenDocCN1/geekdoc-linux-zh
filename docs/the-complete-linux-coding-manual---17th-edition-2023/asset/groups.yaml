    ## 创建 Bash 脚本 – 第二部分


    之前我们查看了如何创建第一个 Bash 脚本（Hello World）并添加系统变量。现在你可以扩展这些内容，看看当你开始尝试创建自己的变量时可以做什么。


    ### 变量 (VARIABLES)


    就像每个编程语言一样，Bash 脚本可以存储和调用系统中的某些变量。


    - **第 1 ** 让我们先创建一个新脚本 `hello.sh`。保存文件并退出。输入 `#!/bin/bash`，然后输入 `echo $1`。使用 `chmod
    +x hello.sh` 使脚本可执行。

    - **第 2 ** 由于脚本现在是可执行的，使用 `./hello.sh` 运行它。现在终端会显示一个简单的“Hello”。但是，如果你想更改变量，事情变得有趣起来。例如，尝试
    `./hello.sh David`。

    - **第 3 ** 输出将变为 Hello David，因为 Bash 会自动为用户分配变量，然后由脚本进行持有并解析。变量 `$1` 现在持有“David”。

    - **第 4 ** 你可以重命名变量。使用以下内容修改 hello 脚本：`firstname=$1`、`surname=$2`、`echo $firstname
    $surname`。将每个语句放在新的一行。保存脚本并返回终端。

    - **第 5 ** 当你运行脚本时，现在可以使用自定义变量了：`./hello.sh David Smith`。自然地用我们的名字更改变量；目前我们只是打印内容，让我们使用双变量列表。

    - **第 6 ** 创建一个名为 `addition.sh` 的新脚本，使用不同的变量名。在这里使用 `firstnumber` 和 `secondnumber`，并使用
    `echo` 命令通过整数表达式输出简单的算术结果。总和是 `$((firstnumber+secondnumber))`。保存脚本并使其可执行（`chmod
    +x addition.sh`）。

    - **第 7 ** 当我们运行 addition 脚本时，我们可以输入两个数字：`./addition.sh 1 2`。结果将贴心地显示 3，终端显示“The
    sum is 3”。尝试几个不同的数字看看会发生什么。你也可以复制脚本并重命名为 multiplication（乘法）和 subtraction（减法）。

    - **第 9 ** 我们在这里向 `echo` 命令添加了 `-n`，这会让光标留在同一行。`read` 命令将获取用户的输入。


    - **第 10** 作为一个最后，我们包含了我们在上一个节中使用的日期变量。`clear` 命令会清除屏幕。


