    # Command Line Quick Reference


    When you start using Linux full time, you will quickly realise that the graphical
    interfaces of Ubuntu, Mint, etc. are great for many tasks but not great for all
    tasks. Understanding how to use the command line not only builds your understanding
    of Linux but also improves your knowledge of coding and programming in general.
    Your command line quick reference guide is designed to help you master Linux quicker.


    ## TOP 10 COMMANDS


    These may not be the most common used by everyone but they will certainly feature
    frequently for many users of Linux and the command line.


    **cd** is one of the commands you will use the most at the command line in Linux.
    It allows you to change your working directory. Use it to move around within the
    hierarchy of your file system. You can also use chdir.


    **mv** command moves a file to a different location or renames a file. example
    **mv file sub** renames the original file to **sub** **mv ~/Desktop** moves the
    file ''sub'' to your desktop directory does not rename it. You must specify a
    new name to rename it.


    **ls** shows the files in your current directory. Used with certain options, it
    lets you see file sizes, when they were created and for example, **ls -l** shows
    you the files that are in your home directory.


    **chown** changes the user or group ownership of each given file. If only an owner
    (a username or numeric ID) is given, that changes the owner of each given file
    and the group.


    **cp** used to make copies of files and directories. For example, **cp file sub**
    makes an exact copy of the file and names it with its original name.


    **chmod** changes the permissions on the files listed. Permissions are based on
    a simple system. You can set permissions for user, group and world whether each
    can read, write, and execute.


    **pwd** command prints the full pathname of the current working directory (“printing
    working directory”). Note that pwd also displays this information in the title
    bar.


    **rm** removes files and directories. The removal process unlinks a file from
    the storage device and marks it usable by future uses. In other words, removing
    files increases the amount of space available on your disk.


    **clear** command clears your screen if it is possible. It lets the environment
    for the terminal type and then figure out how to clear the screen. This is equivalent
    to typing Ctrl+L when using the shell.


    **mkdir** for “make directory” is used to create directories in a file system
    if the directory does not already exist. For example, **mkdir** works to create
    more than one directory when calling mkdir.


    ## USEFUL HELP/INFO COMMANDS


    The following commands are useful for when you are trying to learn more about
    the system or program you are working with Linux. You might not need them every
    day, but when you do, they will be invaluable.


    - The free command displays the total amount of free and used physical and swap
    memory in the system. For example, free gives the information using megabytes.

    - The sed command opens a stream editor. A stream editor is used to perform text
    transformations on an input stream: a file or input from a pipeline.

    - The df command displays filesystem disk space for all partitions. The command
    df-h is probably the most useful (the -h means human-readable).

    - The adduser command adds a new user to the system. Similarly, the addgroup adds
    a new group to the system.

    - The top program provides a dynamic real-time view of a running system. It can
    display system summary information, as well as a list of processes.

    - The deluser command removes a user from the system. To remove a user''s files
    and home directory, you need to add the -remove-option.

    - The uname command with the -a option prints all system information, including
    machine name, kernel version, and a few other details.

    - The delgroup command removes a group from the system. You cannot remove a group
    that is the primary group of users.

    - The ps command allows you to view all processes running on the machine. Every
    operating system''s version of ps is slightly different but all do the same thing.

    - The man man command brings up the manual entry for the man command, which is
    a great place to start using it.

    - The grep command allows you to search inside a number of files for a particular
    search pattern and then print matching lines. An example would be: grep blah file.

    - The man intro command is especially useful. It displays the Introduction to
    User Commands, which is a well written, fairly brief introduction to the Linux
    command line.


    ## A-Z of Linux Commands


    There are literally thousands of Linux commands, while this is not a complete
    A-Z, it does contain many of the commands you will most likely need. You will
    probably find that you end up using a smaller set of commands over and again but
