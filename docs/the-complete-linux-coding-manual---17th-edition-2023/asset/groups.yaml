    # # Working with Variables


    We''ve seen some examples of variables in our Python code already but it''s always
    worth going through the way they operate and how Python creates and assigns certain
    values to a variable.


    # ## VARIOUS VARIABLES


    You''ll be working with the Python 3 ID Shell in this tutorial. If you haven''t
    already, open Python 3 or close down the previous IDLE Shell to clear up any code.


    +   **STEP 1** In programming languages you''re required to use a dollar sign
    to denote a string, which is a variable made of multiple characters, such as a
    name of a person. In Python this''s not necessary. For example, in the Shell name="David
    Howard" (or use your own name, unless you''re also called David Howard)


    ```

    Python 3.4.2 Shell

    File Edit Shell Debug Windows Help

    >>> Type "credit" or "license" for more information.

    Oct 19 2014, 13:31:11

    >>> [GCC 4.8.1] on linux

    >>> name="David Howard"

    >>> print(name)

    David Howard

    >>>

    ```


    +   **STEP 3** You''ve seen previously that variables can be concatenated using
    the plus symbol between the variable names. In our example we can use print(name
    + ":" + title). The middle part between the quotations allows us to add a colon
    and a space, as variables are connected without spaces, so we need to add them
    manually.


    ```

    Python 3.4.2 Shell

    File Edit Shell Debug Windows Help

    >>> Type "credit" or "license" for more information.

    Oct 19 2014, 13:31:11

    >>> [GCC 4.8.1] on linux

    >>> name="David Howard"

    >>> title="Descended from Vikings"

    >>> print(name + ":" + title)

    David Howard:Descended from Vikings

    >>>

    ```


    +   **STEP 2** You can change the type of variable by issuing the type( ) command,
    placing the name of the variable inside the brackets. In example, this would be:
    type(name). Add a new string variable: title="Descended from Vikings".


    ```

    Python 3.4.2 Shell

    File Edit Shell Debug Windows Help

    >>> Type "credit" or "license" for more information.

    Oct 19 2014, 13:31:11

    >>> [GCC 4.8.1] on linux

    >>> name="David Howard"

    >>> print(name)

    David Howard

    >>> class str

    >>> >>> name="Descended from Vikings"

    >>> >>>(name)

    >>>

    ```


    +   **STEP 4** You can also combine variables within another variable. For example,
    to combine both name and title into a new variable we use:


    ```

    character-name = ":" + title

    ```


    Then output the content of the new variable as:


    ```

    print(character)

    ```


    Numbers are stored as different variables:

    age=44

    Type(age)

    Which, as we know, are integers.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_105_0.png)'
