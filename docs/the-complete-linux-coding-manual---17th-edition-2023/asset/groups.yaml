    # 在线匿名化


    数字时代为通信带来了许多巨大进步；然而，它也带来了一个间谍和窥探的新时代。我们大多数人对政府、秘密组织和地下黑客频繁破坏我们隐私的新闻并不陌生，但你该如何对抗这一切呢？


    ## 使用 Mint 实现匿名


    虽然想要完全匿名几乎是不可能的，但你可以采取措施来确保我们的隐私处于最佳状态。


    - 步骤 1：从基础开始，浏览时使用 HTTPS 而不是标准的 HTTP。这意味着通过 HTTPS 传输任何内容都是安全的（因此末尾有 S）并且经过加密的。

    - 步骤 3：尽管 Google 看起来是现代互联网搜索的显而易见的选择，但该公司会跟踪个人进行的所有搜索。考虑使用替代搜索引擎，例如 DuckDuckGo，这是一个不存储个人数据或不跟踪你的搜索引擎。

    - 步骤 2：在浏览时，考虑使用浏览器中的“无痕模式”或“隐私模式”。这会禁用你的网络历史记录和缓存，让你在浏览时详细信息不会被存储供他人日后审查。然而，它并不能阻止数据或搜索跟踪。

    - 步骤 4：如果你在互联网上浏览，可以考虑安装一些浏览器插件。例如，对于 Firefox，使用 Ghostery、NoScript 和 Adblock Plus
    来拦截跟踪器、广告和其他数据挖掘技术。


    ## VPN 和 Tor


    之前的步骤可以帮助你的在线隐私，但要实现匿名，你需要一个虚拟专用网络（VPN）和 Tor。


    VPN 是一个远程服务器或服务器集群，它与你的电脑建立连接。结果是你的电脑在互联网上的身份隐藏在 VPN 远程服务器之后；因此你可能住在英国，但拥有一个属于冰岛的
    IP 地址（在线电脑身份）。


    下载完成后，将其拖入 Terminal 并进入 Downloads 文件夹。输入 `ls` 检查 `tar.xz` 文件是否存在，然后输入 `tar -xf
    tor-browser-linuxx64-8.0.4.tar.xz`（X 会随版本更新，如果你的版本不同，请按 Tab 键自动补全 tor-browser-文件名）。当文件解压后，使用
    `cd tor-browser-en-US/` 进入新文件夹。


    ### 步骤 1


    ### 步骤 4


    ### 步骤 2


    大多数 VPN 收收月费或年费，但这笔支出是值得的。我们使用 CyberGhost（.cyberghost.com），它为 Windows、Mac、Mint（以及任何其他
    Linux 发行版）、Android 和 iOS 设备提供连接。每个系统的细节可以在 **support.cyberghost.com/hz/en-us/articles/213190329-Read-me-first-**
    查看。


    ### 步骤 5


    可以看到几个项目：一个名为 Browser 的文件夹和一个名为“start-tor-browser.desktop”的文件。要启动演示，请运行 `./start-tor-browser.desktop`。此命令启动
    Tor 设置，你将看到两个选项：Connect（连接）或 Configure（配置）。如果你选择 Connect，连接就足够了。准备好后点击 Connect。


    ### 步骤 3


    另一个选项是使用 Tor。Tor 是一个开放网络，你可以连接它并在无数节点后隐藏你的 IP 地址。它非常适合 Windows、Mac 和 Linux 电脑，且非常容易安装和使用。首先访问
    **www.torproject.org/download/download-easy.html** 并点击下载 Linux 64-bit 版本。


    ### 步骤 6


    连接建立后，将启动 Tor Browser。这是 Firefox 的定制版本，在这里你可以安全地浏览互联网，而不被查看或跟踪。结合使用 VPN 和 Tor，可以与在线世界建立极其安全且私密的连接。


    ## 使用 Terminal


    Linux 命令行（Terminal）是一个极其强大的环境。通过它，你可以让操作系统任你摆布，或者将其更新到惊人的状态。你可以黑入远程计算机，查看动画 ASCII
    篝火，安装新的应用和程序，观看从荷兰服务器播放的《星球大战》，并编写代码自动化脚本。


    Linux：一个带有 CLUE 的操作系统……即 Command Line User Environment（命令行用户环境）。


    – Anonymous（发布于 comp.software.testing）


    在本节中，你将探索 Terminal 的复杂之处以及它如何与 Linux 工作。你将学习如何从 Terminal 操作 Linux 文件系统，并将发现一些在
    Terminal 中可以做的奇怪但有趣的事情。


    Terminal 在 Linux 世界中处于至高地位。学习它的运作方式，你就能获得所有的力量。


    - 46 Terminal 的 46 个基础

    - 48 通过 Terminal 更新 Mint

    - 50 通过 Terminal 安装应用 – 部分 1

    - 52 通过 Terminal 安装应用 – 部分 2

    - 54 你知道吗...Linux 内核 0.01

    - 56 使用 Terminal 创建文件

    - 58 创建和删除目录

    - 60 Terminal 中好玩的事

    - 62 Terminal 中更多好玩的事

    - 64 Linux 技巧与窍门

    - 66 你知道吗...Linux 与大爆炸

    - 68 创建 Bash 脚本– 部分 1 - 5

    - 78 Pi x Linux = 完美组合

    - 80 命令行快速参考

    - 82 A-Z

    - 84 你知道吗...Linux 与大爆炸


    ## Terminal 基础


    大多数操作系统使用两种界面：GUI（图形用户界面）和命令行。虽然 GUI 更符合用户习惯，但命令行更强大。


    步骤 1：可以通过点击菜单或打开快捷方式访问 Terminal。波浪号 `~` 代表你的家目录（Home）。


    步骤 2：行末尾闪烁的光标是输入文本的地方。打印目录。输入 `pwd` 输出当前文件夹。


    ```bash

    david@david-mint ~ $

    ```

    ```

    david@david-mint ~$pwd

    /home/david

    ```


    步骤 3：Edit 选项允许你在 Terminal 与其他来源之间复制粘贴命令；例如当你想从网页复制很长且复杂的命令时。它允许你编辑偏好。


    步骤 4：Terminal 进入只读模式，阻止你在 Terminal 中输入任何命令。


    步骤 5：你输入的所有命令方式都相同：输入命令，包含任何参数以扩展命令的使用，然后按回车。在 Terminal 中输入 `uname` 并按回车。这将显示一些系统信息。


    步骤 6：在我们输入命令之前，让我们花点看看 Terminal 提供什么。菜单允许你打开一个新的 Terminal、创建一个配置，你可以更改 Terminal
    的大小、颜色和行为、添加新标签并关闭所有当前活动会话。


    步骤 7：Edit 选项允许你复制粘贴命令。


    步骤 8：View 和 Search 选项允许你调整 Terminal 窗口的大小，当然可以在 Terminal 内搜索任何特定单词。


    步骤 9：Terminal 条目配置编辑和调整允许你更改字符编码。


    步骤 10：最后，Help 选项显示 Terminal 的内容和版本号，更准确地说，我们将来将简单地称为 Terminal。内容值得快速读一遍，以帮助熟悉
    Terminal 的工作方式。


    '
