    # Python on Linux


    ## Saving and Executing Your Code


    While working in the IDLE Shell is perfectly fine for small code snippets, it''s
    not designed for entering longer program listings. In this section you''re going
    to be introduced to the IDE Editor, where you will be working from now on.


    ## EDITING CODE


    You will eventually reach a point where you have to move on from inputting single
    lines of code into the Shell. Instead, the IDLE Editor will allow you to save
    and execute your Python code.


    - STEP 1: First, open the Python IDLE Shell and when it''s up, click on File >
    New File. This will open a new window with Untitled as name. This is the Python
    IDLE Editor and within it you can enter the code needed to create your future
    programs.


    - STEP 2: The IDLE Editor is, for all intents and purposes, a simple text editor
    with Python features, coding and so on; in the same vein as Sublime. You enter
    the code as you would within the Shell, so taking an Example from the previous
    tutorial, enter:


    ```python

    print("Hello everyone!")

    ```


    - STEP 3: You can see that the same colour coding is in place in the IDLE Editor
    as it is in the Shell, enabling you to understand what''s going on with your code.
    However, to execute the code you need to first save it. Press F5 and you get a
    Save... box open.


    - STEP 4: Click on the OK in the Save box and select a destination where you''ll
    save all your Python code. The destination can be a dedicated folder called Python
    or you can just dump it wherever you like. Remember to keep a tidy drive, though,
    to help you out in the future.


    - STEP 5: Enter a name for your code, ''print hello'' for example, and click on
    the Save button. Once the Python code is saved and executed it will be detailed
    in the IDLE Shell. In this case, the words ''Hello everyone''.


    - STEP 6: This is how the vast majority of your Python code will be conducted.
    Enter it into the Editor, hit F5, save the code and look at the output in the
    Shell. Sometimes it will, depending on whether you''ve requested a separate window,
    but essentially that''s the process. The process we''ll use with this book, unless
    otherwise stated.


    - STEP 7: If you click the OK button, the file will be executed with the new code
    entries, and executed with the output in the Shell. It''s not a problem with just
    these few lines but if you want to edit a file, overwriting can become easy by
    using File > Save As From the Editor to create a backup.


    - STEP 8: Let''s extend the code and enter a few examples from the previous tutorial:


    ```python

    a=2

    b=2

    name="David"

    surname="Keyword"

    print(name, surname)

    print(a+b)

    ```


    If you press F5 now you''ll be to save the file, as it''s been modified from:


    - STEP 9: If you open the file location of the saved Python code, you can see
    that it is in a .py extension. This is the default Python filename. Any code you
    create will be whatever.py and any code you download from the internet resources
    be .py. Just ensure that the code is written for Python 3.


    - STEP 10: Now create a new file. Close the Editor, and open a new instance (File
    > New File from the Shell). Enter the following and save it as hello.py:


    ```python

    a="Python"

    b=10

    c="cool!"

    print(a, b, c)

    ```


    You will use this code in the next tutorial.


    ## Executing Code from the Terminal


    Although we''re working from the GUI IDLE throughout this book, it''s worth taking
    a look at Python''s command line handling. We already know there''s a command
    line version of Python but it''s also used to execute code.


    ## COMMAND THE CODE


