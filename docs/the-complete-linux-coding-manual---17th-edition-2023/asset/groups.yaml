  - "[PAGE 74]\n\n# Creating Bash Scripts - Part 4\n\n# CREATING A BACKUP TASK SCRIPT\n\
    \nOne of the most well used examples of Bash scripting is the creation of a backup\
    \ routine, one that manages the task as adding some customizations along the way.\n\
    \nA very basic backup script would look something like the simple script along\
    \ the lines of ~/bin/bash, then tar cvf ~/backups/my-backup.tg ~/Documents/. This\
    \ will create a compressed file backup of the /Documents folder, with everything\
    \ in it, and put it in a folder /backups with my name my-backup.tg.\n\nSTEP 4\
    \ Once the /backups folder is created, we can now create a new subfolder within\
    \ it The Time Stamp variables you set up at the beginning. Also mkdir -p $STAMP=$day\
    \ $Month $year - It's here that you put the backup file relevant to day/month/year.\n\
    \n![](img/b810837b9059fc96b3c0bd60b035eb13_74_0.png)\n\n```\n#!/bin/bash\nclear\n\
    time\nday=$(date +%d)\nmonth=$(date +%B)\nyear=$(date +%Y)\n\n# Folders\ndest=~/backups\n\
    source=~/Documents\n\nif [ ! -d $dest ]; then\n  echo \"Backup folder does not\
    \ exist! I am now creating it...\" mkdir -p $dest\nfi\n\nread -p \"Press any key\
    \ to continue...\" -n 1\ntar cvf $dest/backup-$day-$month-$year.tg $source\n```\n\
    \nSTEP 2 While perfectly fine, we can make the script a lot more interactive.\
    \ Let's begin defining some variables. Enter the text in the screenshot to a new\
    \ bash script. Notice that if we'll miss: 'source' as 'sauce', this is because\
    \ there's a built-in command called 'source' here different spelling on our part.\n\
    \nSTEP 5 With everything in place, you can now enter the actual backup routine,\
    \ based on the Tar command from Step 5. Combine with the variables, you have:\
    \ cvf $STAMP=$day-$Month-$year/Documents.tg In the screenshot, see how a handling\
    \ \"Now backup up\" works.\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_74_1.png)\n\
    \n```\n#!/bin/bash\nclear\ntime\nday=$(date +%d)\nmonth=$(date +%B)\nyear=$(date\
    \ +%Y)\n\n# Folders\ndest=~/backups\nsource=~/Documents\n\nif [ ! -d $dest ];\
    \ then\n  echo \"Backup folder does not exist! I am now creating it...\" mkdir\
    \ -p $dest\nfi\n```\n\nSTEP 3 The previous script entries allow you to create\
    \ a Time Stamp, so you know when the backup file was. We created a 'dest' variable,\
    \ where the folder file will be created (~/backups). You can now add a line of\
    \ code to check if the ~/backups exists, then it creates it.\n\nSTEP 6 Finally,\
    \ you can add a friendly message: echo \"Backup complete. All done..\" The completed\
    \ script is then not over-complex and it can be easily to include this within\
    \ your Home area, as well as the Home area itself.\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_74_2.png)\n\
    \n```\n#!/bin/bash\nclear\ntime\nday=$(date +%d)\nmonth=$(date +%B)\nyear=$(date\
    \ +%Y)\n\n# Folders\ndest=~/backups\nsource=~/Documents\n\nif [ ! -d $dest ];\
    \ then\n  echo \"Backup folder does not exist! I am now creating it...\" mkdir\
    \ -p $dest\nfi\n```\n\nLinux Coding & 75"
