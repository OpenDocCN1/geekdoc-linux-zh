    ## Using the Terminal


    ## Install Apps via the Terminal – Part 1


    ### COMMAND LINE INSTALLS


    Installing an app with the Terminal may require some nifty keyboard work but you
    get a better sense of what''s being installed and where.


    - STEP 1: Installing apps from the Terminal is relatively simple. First, you need
    to make sure the system is up to date. To do this open the Terminal and enter:
    `sudo apt-get update && sudo apt-get upgrade`. Enter your password and accept
    any necessary updates.

    - STEP 2: Just as you''ve seen, sudo apt-get update/upgrade and so on are designed
    to upgrade the software that''s already installed on the system. You do install
    more apps when you want! It so so happens that it''s extraordinarily simple. First,
    you need an app to install, let''s use Stella. Enter: `sudo apt-get install`.

    - STEP 3: You need to enter y to confirm the installation, which takes up around
    5.5MB of storage in the system. Once Stella is installed, you can see that Mint
    has automatically created the Games category in the Menu as well as the shortcut.

    - STEP 4: Sometimes, when installing software, you need to add the app''s Repository,
    or repo, is the remote server location where the software is held, along with
    all its dependencies (the virtual libraries and books it needs to function). For
    start, use this: `sudo add-apt-repository ppa:peterlevi/ppa`. Press Enter when
    asked to add and the PPA (Personal Package Archive).


    ## Install Apps via the Terminal - Part 1


    ### STEP 5


    This adds the repo for app Variety Wallpaper Changer, an Ubuntu-based app that
    works in Mint and changes the wallpaper automatically. Now that the repo is added,
    enter: `sudo apt-get update`, to update the new information and add contents of
    the repo to the package database.


    ### STEP 6


    Now to install Variety, enter: `sudo apt-get install`. Press y to confirm and
    accept the installation, and once installed, you can type `variety` into the Terminal
    to run it.


    ```bash

    sudo add-apt-repository ppa:varietycloud/ppa

    sudo apt-get update

    sudo apt-get install variety

    ```


    Variety

    Variety is a simple, automatic wallpaper changer. It provides you with a variety
    of wallpapers.


    ```bash

    sudo add-apt-repository ppa:varietycloud/ppa

    sudo apt-get install variety

    ```


