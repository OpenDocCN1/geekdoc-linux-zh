    # STEP 9


    For the GUI IDE, you need to enter the command into the Terminal:


    ```

    sudo apt-get install idle3

    ```


    The IDLE can be started with the command idle3. Note IDLE runs a different version
    from the one you installed.


    # STEP 10


    In the Terminal, go to the downloaded folder by entering cd downloaded source
    code with: tar -xvf python-3.7-Y.tar.gz (replace the Y with the version you downloaded).
    Now enter the unzipped folder with cd Python-3.7.Y/


    Now you need PIP (Pip Installs) which is a tool to help you install modules and
    extras.


    When PIP is installed, check for the latest update with:


