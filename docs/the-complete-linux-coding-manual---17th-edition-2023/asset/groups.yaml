    # Space Invaders


    SCORE 1,337


    ![](img/b810837b9059fc96b3c0bd60b035eb13_99_0.png)


    # DID YOU KNOW...


    when Space Invaders creator, Tomohiro Nishikado, was coding Space Invaders, he
    had to create his own hardware and development tools to write the games. Furthermore,
    he then discovered that as a result of the coding and the custom hardware, the
    fewer Invaders on-screen the faster the processor was able to render them. Thus,
    as you kill more Invaders, the faster they become. So rather than design the game
    to compensate for the speed increase, he decided to keep it as a challenging gameplay
    mechanism.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_100_0.png)


    # Numbers and Expressions


    We''ve seen some basic mathematical expressions with Python, simple addition and
    the like. Let''s expand on that now and see how powerful Python is as a calculator.
    You can work within the IDLE Shell or in the Editor, whichever you like.


    ## IT''S ALL MATHS, MAN


    You can get some really impressive results with the mathematical powers of Python;
    as most, if not all, programming languages, maths is the driving force behind
    it.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_101_0.png)


    - **STEP 1** Open the GUI version of Python 3, as mentioned you can use either
    the Shell or the Editor. For the time being, you''re going to use the Shell to
    warm our maths muscle, which we believe is a small gland located at the back of
    the brain (or not).


    - **STEP 2** In the Shell enter the following:


    2*2

    54356+34552345

    9867344*2734484221


    You can see that Python can handle quite large numbers.


    - **STEP 3** You can use all the mathematical operations: divide, multiply, brackets
    and so on. Practise with a few, for example:


    1/2

    6/2

    2**3

    (1+2)+(3*4)


    - **STEP 4** You''ve no doubt, division produces a decimal number. If these are
    called floats, or floating point arithmetic. however, if you need an integer to
    a decimal, you can use a slash:


    1/2

    6/2


    And so on.


    - **STEP 5** You can also use an operation to work the remainder left over from
    division. For example:


    10/3

    Will display 3.3333333333333335 which is of course recurring.


    - **STEP 6** Next up we have the power operator, or exponentiation. To work out
    the power of something you use double multiplication symbol on the keyboard.


    - **STEP 7** Numbers and expressions don''t stop there. Python has built-in functions
    to work out sets of absolute values, complex numbers. To convert to binary, use:


    bin(3)


    - **STEP 8** This will be displayed as ''011'', converting the integer into binary
    and adding the prefix 0b. If you want to remove the 0b prefix, then you can use:


    format(3, ''b'')


    - **STEP 9** A Boolean Expression is a logical statement that either be true or
    false. We can use these to compare data and test if it is less than, or greater
    than.


    - **STEP 10** Execute the code from Step 9, and you can see a series of True or
    False statements, depending on the result of the defining values: it''s an extension
    of what you''ve looked at, and an important part of programming.


    Format converts a value, 3, to a formatted representation controlled by the format
    specification, the ''b'' part. 10%3

    This will display 1, which is the remainder left over from dividing 10 into 3.


    ```

    >>2**5

    32

    >>2**4

    16

    >>6/2

    3

    >>2*3

    6

    >>(1+2)*4

    12

    >>1/2

    0.5

    >>10/3

    3.3333333333333335

    >>10%3

    1

    >>2**10

    1000000000

    format(3, ''b'')

    ```


    ```

    Python 3.4.2 (default, Mar 14 2016, 00:01:11)

    >>> type "copyright" or "license" for more information.

    >>>True

    False

    True

    False

    True

    False

    True

    False

    ```


    # Using Comments


    When you write your code, the flow, what each variable does the overall program
    operates is all inside your head. Another programmer could follow the code line
    by line but over time, it can become difficult to read.


    # COMMENTS!


    Programmers use a method of keeping their code readable by commenting on certain
    sections. If a variable is used, the programmer comments on what it is supposed
    to do, for example. It''s just good practice.


    - **STEP 1** Start by creating a new instance of the IDLE Editor (File > New File)
    and create a simple variable and print command:

    a=10

    print("The value of A is,", a)

    Save the file and execute.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_103_0.png)


    - **STEP 2** Running the code will return the line: The value of A is 10 into
    the IDLE Shell window, which is what we expect. Now, add some of the comments
    you''d normally see within code:

    # Set the start value of A to 10

    a=10

    # Print the current value of A

    print("The value of A is,", a)


    - **STEP 3** Save the code and execute it. You can see that the output in the
    IDLE Shell is still the same as before, despite the extra lines being added. Simply
    put, the hash symbol (#) denotes a line of text the programmer can insert to inform
    them and others, of what''s going on without the user being.


    - **STEP 4** Let''s assume that the variable that we''ve created is the number
    of lives in a game. Every time the player dies, the value is decreased by 1. The
    programmer could insert a route along the lines of:

    a-=1

    print("You''ve just lost a life!")

    print("You now have.", a, "lives left!")


    # STEP 5


    Whilst we know that the variable A is, the number of lives in the game, we could:


    ```python

    # Set the start value of A to 10

    a=10

    # Print the current value of A

    print("The value of A is,", a)

    ```


    # STEP 6


    Essentially, the new code with comments could like:

    ```python

    # Set the start value of A to 10

