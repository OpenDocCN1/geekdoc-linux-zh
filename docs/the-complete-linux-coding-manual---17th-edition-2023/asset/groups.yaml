    \ distance;\n    distance = 15;\n    cout << \"distance in metres: \" << distance;\n\
    }\n```\n\n```cpp\n3.1415926535973198\n(program exited with code: 0)\n```\n\n再次编译并运行代码；从命令行可以看到，变量\
