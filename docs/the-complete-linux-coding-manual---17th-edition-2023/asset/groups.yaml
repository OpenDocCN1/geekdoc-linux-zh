- md: "\n# Starting Python for the First Time\n\nWe're going to be using the Raspberry\
    \ Pi as our Python 3 hardware platform. The latest version of Raspian preinstalled\
    \ with Python 3, version 3.4.2 to be exact, so long as you have a version 3 Shell,\
    \ all our code will work.\n\n## STARTING PYTHON\n\nWe're not going to go into\
    \ the details of getting the Raspberry Pi up and running, there's plenty of material\
    \ available on that subject. However, once you're ready, fire up your Pi and get\
    \ ready for coding.\n\n- **STEP 1** With the Raspberry Pi desktop loaded, click\
    \ on the Menu button followed by Programming > Python 3 (IDLE). This opens the\
    \ Python 3 Shell. Windows and Mac users can find the Python 3 IDLE Shell from\
    \ within the Windows Start menu or via Finder.\n- **STEP 2** The Shell is where\
    \ you can enter code and see the responses and output of code you've programmed\
    \ into Python. This is a kind of sandbox, where you are able to try some simple\
    \ code and processes.\n- **STEP 3** For example, in the Shell enter: `2+2` After\
    \ pressing Enter, the next line displays the answer: 4. Basically, Python has\
    \ taken the 'code' and produced the relevant output.\n- **STEP 4** The Shell acts\
    \ very much like a calculator, since code is basically a series of mathematical\
    \ interactions with the system. Integers, which are the infinite sequence of numbers\
    \ can be easily added, subtracted, multiplied and so on.\n\n```\nPython 3.4.2\
    \ (Oct 19, 2014, 13:31:11)\n>>> on Linux\n>>> Type 'copyright', 'credits' or 'license'\
    \ for more information.\n>>> 2+2\n4\n```\n\n```\nPython 3.4.2 (Oct 19, 2014, 13:31:11)\n\
    [GCC 4.9.1] on Linux\n>>> Type 'copyright', 'credits' or 'license' for more information.\n\
    >>> 2+2\n4\n>>> 23456+645252\n668708\n>>> 1234567890*12345\n152345\n```\n\nSTEP\
    \ 5 while it's very interesting, it's not particularly exciting. Instead, try\
    \ this:\n\nSTEP 8 The Python IDE is a configurable environment, then you don't\
    \ like the way colours are represented, then you can change them via Options >\
    \ IDE and clicking on the Highlighting. However, we don't want, as you won't be\
    \ seeing the same as our screenshots.\n\n```python\nprint(\"Hello everyone!\"\
