    \n![](img/b810837b9059fc96b3c0bd60b35eb13_143_0.png)\n\n## 简单变量\n\n变量命名是消除常见编程错误的必要条件。使用字母没问题，但当代码指出变量\
    \ x 有问题时会怎样？命名生命、金钱、玩家 1 等并不困难。\n\n```javascript\nvar points = 1023;\nvar lives\
