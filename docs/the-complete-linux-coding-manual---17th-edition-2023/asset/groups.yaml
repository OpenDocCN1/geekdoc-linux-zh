    # # Customising the Desktop


    Customising the operating system desktop is one way to make it your own: a personalised
    workspace that is to help you work, inspire or feature the company logo. Whatever
    your reasons for having your own desktop, here''s how it''s done.


    # ## YOUR DESKTOP


    Linux is probably one of the most own operating systems there is. With just a
    few tweaks, one or two extras installed and so imagination, you can create something
    incredible.


    **STEP 1** The first aspect of desktop customisation is to change the wallpaper.
    Right-click the desktop and choose Change Desktop Background. This opens the Backgrounds
    in Linux Mint; remember other distros may present their background, wallpaper
    selection tools differently.


    **STEP 3** You just need to click the available images, from any of the locations
    provided to have them install the desktop wallpaper. Incidentallyally, if you
    have images stored in another location on your system or network, you can add
    them by clicking on the Plus symbol at the bottom of the Backgrounds console,
    using the file manager to locate them.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_39_0.png)


    **STEP 2** More recent versions of Linux Mint display available backgrounds depending
    on the version the user is running. You normally get three categories followed
    by a fourth, Pictures which is separate from the others. The Pictures option is
    different because it reads the image content from the Pictures folder in your
    Home area.


    **STEP 4** By clicking on the Settings tab you can, instead play numerous images
    as a slideshow or change the aspect of the wallpapers to a variety of choices.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_39_1.png)


    ![](img/b810837b9059fc96b3c0bd60b035eb13_39_2.png)'
