    ## 为什么选择 Python？


    现代计算机有许多编程语言，有些仍然用于 8 位和 16 位计算机。这些语言中，有些是为科学工作设计的，其他则用于移动平台等。在这么多语言中，你为什么选择 Python
    呢？


    ## Python的力量


    从最早的计算机出现起，爱好者、用户和专业人士就一直辛苦工作，在过热的电路热中挥汗如雨，以创造出类似的事物。


    这些编程领域的先驱们开辟了一个新疆界：小小的程序就能让字母“A”在屏幕上滚动。对于习惯了超高定义图形和开放世界多玩家游戏的一代人来说，这听起来可能并不那么兴奋。但在四十年前，它是光彩夺目地惊艳。


    自然地，这些奠基者为我们今天使用的每项数字技术奠定了基础。我们中的一些成为了软件公司的首席开发者，另一些则将硬件推向了极限，并创立了持续令我们惊讶的公共帝国。


    无论你使用的是 Android 设备、iOS 设备、PC、Mac、Linux、智能电视、游戏、MP3 播放器、汽车内置 GPS 设备、机顶盒或其他连接的“智能”电器，它们都是通过编程实现的。


    所有上述数字设备都需要指令来告诉它们该做什么，以及如何进行交互。这些指令就是设备的编程代码，可以使用多种编程语言构建。


    我们今天使用的语言取决于平台、设备用途以及用户如何与环境或用户交互。操作系统（如 Windows、macOS 和 Linux）通常是 C++、Python
    和某些基于视觉的语言的组合。游戏通常是 C++、C# 和某些基于视觉的语言的组合。


