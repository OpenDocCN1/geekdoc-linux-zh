    davidarthur~\n@david-mint $ ls > folders.txt && speak -f folders.txt\n```\n\n\
    ![](img/b810837b9059fc96b3c0bd60b035eb13_62_1.png)\n\n**STEP 7** A roaring ASCII\
    \ fire is the most useful command to have at your disposal, but it's fun! Install\
    \ it with `sudo apt-get install libaa-bin`, then when used afire, it's not exactly\
    \ warming but you get the idea. To expand the above, enter: `sudo apt-get install\
    \ bb caixa-utils, then, cafera.\n\nWith little that done, on the next: `sudo wget\
    \ http://www.robummy.com/projects/asciquarium/asciquarium.tar.gz && tar -xzf asciquarium.tar.gz\
    \ && cd asciquarium && chmod +x asciquarium`. Providing as well, enter `./asciquarium`\
