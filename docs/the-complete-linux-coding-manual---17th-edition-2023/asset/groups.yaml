    # 通过终端更新 Mint


    到目前为止，你一直在使用盾牌图标启动 Mint 更新管理器，以更新系统并升级当前安装的应用程序、工具和其他元素。然而，你也可以从终端完成完整的系统更新和升级。


    ## 使用 APT-GET


    若要通过终端进行更新和升级，你需要使用 APT（高级软件包工具）命令。它是一个强大的工具，并根据其用途结合不同的元素。


    ![](img/b810837b9059fc96b3c0bd60b035eb13_47_0.png)


    - **第 1 步** 首先打开终端，如果你已经打开了一个终端，请使用 `clear` 命令将其清空。这让你从一个整洁的界面开始工作。


    ```

    david@david-mint ~$ sudo clear

    ```


    ![](img/b810837b9059fc96b3c0bd60b035eb13_47_1.png)


    - **第 2 步** 在终端中输入 `apt-get`。这会列出最常用的 apt-get 命令，以及每个命令作用的简要描述。即使现在看起来没什么用处，先看一下也是好的。


    ![](img/b810837b9059fc96b3c0bd60b035eb13_47_2.png)


    - **第 3 步** Apt-get 用于更新 Mint 软件以及 Ubuntu 和其他基于 Debian 的发行版软件。使用 `Update`（更新）元素可以获取新软件包并更新源文件列表。`Upgrade`（升级）会将它们下载到最新版本的的文件。要启动整个更新过程，输入：`sudo
    apt-get update`，然后输入你的密码。


    ![](img/b810837b9059fc96b3c0bd60b035eb13_47_3.png)


    - **第 4 步** 注意这里添加了 `sudo` 命令。`sudo` 命令曾经意思是“Super User Do”（超级用户执行），但现在更多被接受为“Sub
    User Do”（子用户执行）。它意味着管理员（超级用户）使用 APT（高级软件包工具）来获取任何更新。请使用：`sudo apt-get upgrade`。


    ![](img/b810837b9059fc96b3c0bd60b035eb13_47_4.png)


    - **第 5 步** 根据更新状态，如果有任何等待安装的项，你可能需要应用 `sudo apt-get upgrade` 命令的结果。你可以按 `y` 继续进行。这里发生的情况是
    apt-get 有一些更新的 Mint 软件需要安装，而你就是那个执行者。


    - **第 7 步** 实际上，根据 `apt-get update` 命令的软件包列表，你的系统现在是最新的了。你可以再次运行一遍流程，以检查一切是否正常。总结一下，输入：`sudo
    apt-get update`，按回车，然后输入：`sudo apt-get upgrade` 并按回车。


    ```

