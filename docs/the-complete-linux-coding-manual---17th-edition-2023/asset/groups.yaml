  - '[PAGE 33]


    # #10 Things to do After Installing Linux Mint


    Linux Mint is a polished dish out of the box, but with most Linux distros, there
    are some tweaks that can be applied to improve the way it works. Although these
    are Mint-specific tweaks, most can be applied to other distros.


    # ## LINUX TWEAKS


    Some of these post-installation actions are highly recommended, while others are
    just additions and simply tweak the system or add a customisation.


    +   **STEP 1** The first, and most important, post-installation action is to update
    the system. Click on the shield icon in the Panel, Found at the bottom right of
    the desktop next to the time and date. This launches the Update Manager.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_33_0.png)


    +   **STEP 3** Click the OK and you can see a couple of updates ready for installation.
    Though click the blue bar OK to switch to a Local Mirror. Before you update this
    opens the Software Sources option. In the Mirrors section, click on the Main and
    Base drop-down menus and select a closest to your current location.


    +   **STEP 2** Linux Mint offers the user three level policy approach to updates:
    Don''t Break My Computer, Optimise Stability and Security and Always Update Everything.
    The recommended option is the Optimise Stability and Security, which only updates
    safe, essential patches that do not impact critical elements of the core. Read
    the descriptions but choose the middle, and recommended option.


    +   **STEP 4** Click the OK to close the Cache button and close the Software Sources
    window. In the Update Manager, click on the Install Updates and enter your password.
    The updates automatically apply themselves and relaunch Update Manager, this with
    time for more updates. Again, click Install Updates, OK any messages and wait
    for them to finish.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_33_1.png)'
  - '[PAGE 34]


    # 10 Things to do After Installing Mint


    STEP 5 The updates are graded by level, 1, being a low level update, level 5 being
    a dangerous one. Stick to 3 updates, or click Class; Reply for any messages regarding
    overwriting a configuration file. With regards to the Software Rendering engine
    and lack of drivers for non-VirtualBox, click the menu and type ''Driver'' into
    the search box.


    STEP 8 When asked to accept the changes, enter Y and also when asked to configure
    libvd. make sure OK and press Enter, then Yes to any further questions. Next up,
    in the Terminal: cat /proc/sys/vm/swappiness, the result should be 60. If your
    computer has less than 4GB of RAM/memory, then enter: nano sysctl.conf.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_34_0.png)


    STEP 6 Click the Driver Manager app that appears as a result of the search and
    enter your password. Mint takes a moment to analyse what is available and presents
    you with a selection of drivers for each detected hardware. With those graphical
    problems, such as Software Rendering, opt to use the latest, Recommended Graphics.


    STEP 9 This tweak helps up systems with less than 4GB RAM/Memory. Scroll down
    to the bottom of the file you opened and add the following lines:

    # Decrease swap usage to a reasonable level vm.swappiness=10


    ![](img/b810837b9059fc96b3c0bd60b035eb13_34_1.png)


    Click File > Save, then File > Quit. Reboot Linux Mint and you should notice a
    slight hike in performance.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_34_2.png)


    STEP 7 At this point you will probably need to restart Mint button again, so do
    not wait. After a reboot click the Menu. The Terminal is found in the left-hand
    column Follow the Files menu to open the Terminal, enter: sudo apt-get install
    libdvd-pkg, press Enter and type in your password. This enables DVD playback.


    STEP 10 Security is always a concern in this modern digital age. Linux Mint is
    a secure system, it is advisable to try and improve it. Click the Menu button
    and search for Firewall; click the Firewall Configuration icon and enter your
    password. In the Firewall window, click the Status slider to On.


