    ## 导航 Cinnamon 桌面


    每个桌面环境的行为都不相同。有些桌面环境（DE）提供可以自定义并放置在桌面上的部件，而另一些则选择简洁、利落的外观，以保持所有运行尽可能快速。让我们来看看
    Cinnamon 桌面提供了哪些功能。


    ## 一点惊喜


    Cinnamon 桌面环境是风格与性能的完美融合。它有很多迷人的之处，这也是为什么它是如此受欢迎的原因。


    - **1** 通过双击“计算机”图标开始探索 Cinnamon 桌面。这将打开 Cinnamon 中使用的文件管理器 Nemo。点击“计算机”图标将打开根文件系统，并提供光驱器（如果你安装了的话）、硬盘和
    Linux 核心文件系统的访问和视图。


    - **3** Nemo 具有许多不同的功能、视图和方式，让你能够查看和操作文件及文件夹。例如，如果你在“图片”文件夹中有图片，可以使用位于 Nemo 右下角的标记为“调整缩放级别”的滑块来选择图片的图标缩放比例。


    ![](img/b810837b9059fc96b3c0bd60b035eb13_31_0.png)


    - **2** Linux 文件系统对于以前的 Windows 用户来说可能很困惑，因此你需要稍微了解它的工作原理，我们建议你关注桌面上的“主目录”图标。这里有与用户账户相关的所有内容：你存储图片、视频、音乐、文档、下载项目等的地方。


    - **4** 就像任何优秀的文件管理器一样，如果你右键点击内部的任何文件或文件夹，就会获得丰富的选项。在 Cinnamon 中，桌面允许根据文件类型播放或查看文件，并复制、剪切、删除、压缩、重命名、通过电子邮件发送以及查看其属性。


    ![](img/b810837b9059fc96b3c0bd60b035eb13_31_1.png)


    ![](img/b810837b9059fc96b3c0bd60b035eb13_31_2.png)


    ## 步骤 5


    在桌面底部有一个面板（Panel），我们已经查看过面板的一个部分：菜单（Menu）。如果你在面板上的任何地方（应用程序以外）右键点击，你将看到一个菜单，可以以不同的方式编辑、添加和设置面板。


    ## 步骤 8


    在桌面右键点击的上下文菜单中，选择“自定义”，然后点击新打开窗口底部的“桌面设置”链接。在这个新窗口中，你可以编辑存在哪些桌面显示器。如果你使用的是连接了多个显示器的设置，还可以选择由哪一个显示器显示图标。


    ![](img/b810837b9059fc96b3c0bd60b035eb13_32_0.png)


    ## 步骤 6


    例如，如果你点击“修改面板”，你可以移除、删除面板、添加新面板并清除当前存在的所有插件（Applets）。所谓插件，就是设计用于运行并适配到 Cinnamon
    面板中的应用程序。


    ![](img/b810837b9059fc96b3c0bd60b035eb13_32_1.png)


    ## 步骤 9


    点击菜单并输入“系统设置”，然后打开结果图标。这将带你进入系统设置选项。在这里，你可以控制并编辑 Linux Mint Cinnamon 的外观和工作方式，管理所有新插件、管理防火墙并启用辅助功能。


    ![](img/b810837b9059fc96b3c0bd60b035eb13_32_2.png)


    ![](img/b810837b9059fc96b3c0bd60b035eb13_32_3.png)


    ## 步骤 7


    如果在桌面的任何地方右键点击，你会看到一组选项，允许你进一步添加、编辑或查看桌面内容。它与 Windows 非常相似，这就是为什么 Mint 是原 Windows
    用户的良好选择。


    ## 步骤 10


    简而言之，Linux Mint 可以配置得非常非凡。关于它能变得多好以及可以实现什么，，有很多示例。你可以根据自己的意愿变得复杂或简单，添加不同的组件和动画，或者仅仅保持平易易读。


    ![](img/b810837b9059fc96b3c0bd60b035eb13_32_4.png)


    ![](img/b810837b9059fc96b3c0bd60b035eb13_32_5.png)


    ## 安装 Linux Mint 后要做的 10 件事


    Linux Mint 开箱即用已经非常精美，但与大多数 Linux 发行版一样，通过一些调优可以改进它的工作方式。虽然这些是 Mint 特有的调优，但大多数可以应用于其他发行版。


    ## Linux 调优


    这些安装后的操作中的某些是强烈建议的，而另一些仅仅是补充，用于调优系统或添加自定义。


    - **步骤 1** 第一个也是最重要的安装后操作是更新系统。点击面板上的盾牌图标，位于桌面右下角的时间日期旁边。这将启动更新管理器。


    ![](img/b810837b9059fc96b3c0bd60b035eb13_33_0.png)


    - **步骤 3** 点击 OK，你可以看到几个等待安装的更新。然后点击蓝条 OK 切换到本地镜像。在更新之前，这会打开“软件源”选项。在“镜像”部分，点击“主源”和“基础”下拉菜单并选择距离你当前位置最近的。


    - **步骤 2** Linux Mint 为用户提供三级别的更新策略：“不要弄坏我的电脑”、“优化稳定性与安全性”和“始终更新一切”。推荐选项是“优化稳定性与安全性”，它只更新不影响核心关键元素的安全的、必需的补丁。阅读描述并选择中间的推荐选项。


    - **步骤 4** 点击 OK 关闭缓存按钮并关闭软件源窗口。在更新管理器中，点击“安装更新”并输入密码。更新会自动应用并重新启动更新管理器，届时会有更多更新。再次点击“安装更新”。

    '
