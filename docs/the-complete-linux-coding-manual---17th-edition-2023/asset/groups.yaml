    ## Navigating the Cinnamon Desktop


    Each desktop environment behaves differently to that of the next. Some DEs offer
    widgets that can be customised and placed on the desktop, others instead opt for
    a clean, sharp look to keep everything running as fast as possible. Let''s see
    what the Cinnamon desktop has to offer.


    ## A TOUCH OF SPICE


    The Cinnamon desktop environment is a great blend of style and performance. There''s
    lots to like about it, which is why it''s such a popular DE.


    - **1** Begin exploring the Cinnamon desktop by double-clicking the Computer icon.
    This brings Nemo, the file manager used in Cinnamon. The Computer icon opens up
    the root file system, with access and views to the optical drive (if you have
    one installed), hard drive and core Linux file system.


    - **3** Nemo has many different features, views and ways so that you can view
    and manipulate files and Folders. For example, if you have images in the Pictures
    Folder, you can select the icon zoom level for the images by using the slider
    located in the bottom right of Nemo, labelled Adjust Zoom Level.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_31_0.png)


    - **2** The Linux file system can appear confusing to a former Windows user, so
    you''re need a little more knowledgeable about how it works, we''d recommend you
    concentrate on the Home icon on the desktop instead. Here is everything relating
    to your user account: where you store Pictures, Videos, Music, Documents, Downloaded
    items etc.


    - **4** Just like any good file manager, if you right-click any of the files or
    folders within you get a wealth of options. In the case of Cinnamon, the desktop
    allow you to play or view a file depending on what type of file it is and copy,
    cut, delete, compress, rename, send via email and view its properties.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_31_1.png)


    ![](img/b810837b9059fc96b3c0bd60b035eb13_31_2.png)


    ## STEP 5


    At the bottom of the desktop there''s the Panel, We''ve already looked at one
    section of the Panel, the Menu. If you right-click anywhere on the Panel, other
    than on an App, you will see a menu to edit, add and set up the Panel in a different
    way.


    ## STEP 8


    From that desktop right-click, context-menu, select Customise, followed by the
    Desktop Settings link to the bottom of the newly opened window. This new window
    where you''re able to edit which desktop monitors are present. If you''re using
    a setup with multiple monitors attached, you can also choose which monitor displays
    icons.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_32_0.png)


    ## STEP 6


    For example, if you click the Modify Panel, you can remove, remove the Panel,
    add a new one and clear it of Applets that are currently present. An Applet, by
    them, is an app that''s designed to work and fit into the Cinnamon Panel.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_32_1.png)


    ## STEP 9


    Click on the Menu and type system settings and opening the result icon. This takes
    you to the System Settings options. Here you''re able to control and edit the
    way Linux Mint Cinnamon looks and works as all new widgets, manage the firewall
    and enable accessibility options.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_32_2.png)


    ![](img/b810837b9059fc96b3c0bd60b035eb13_32_3.png)


    ## STEP 7


    If right-click anywhere on the desktop you see a set of options that allows you
    to further add, edit or view the desktop content. it''s very similar to that of
    Windows, which is why Mint is a good choice for ex-Windows users.


    ## STEP 10


    In short, Linux Mint can be configured to look quite extraordinary. There are
    many examples of how good it can get and what can be achieved. You can go as complex
    or simple as you want, adding different component and animations or just keeping
    it plain and easy to read.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_32_4.png)


    ![](img/b810837b9059fc96b3c0bd60b035eb13_32_5.png)


    ## 10 Things to do After Installing Linux Mint


    Linux Mint is a polished dish out of the box, but with most Linux distros, there
    are some tweaks that can be applied to improve the way it works. Although these
    are Mint-specific tweaks, most can be applied to other distros.


    ## LINUX TWEAKS


    Some of these post-installation actions are highly recommended, while others are
    just additions and simply tweak the system or add a customisation.


    - **STEP 1** The first, and most important, post-installation action is to update
    the system. Click on the shield icon in the Panel, Found at the bottom right of
    the desktop next to the time and date. This launches the Update Manager.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_33_0.png)


    - **STEP 3** Click the OK and you can see a couple of updates ready for installation.
    Though click the blue bar OK to switch to a Local Mirror. Before you update this
    opens the Software Sources option. In the Mirrors section, click on the Main and
    Base drop-down menus and select a closest to your current location.


    - **STEP 2** Linux Mint offers the user three level policy approach to updates:
    Don''t Break My Computer, Optimise Stability and Security and Always Update Everything.
    The recommended option is the Optimise Stability and Security, which only updates
    safe, essential patches that do not impact critical elements of the core. Read
    the descriptions but choose the middle, and recommended option.


    - **STEP 4** Click the OK to close the Cache button and close the Software Sources
    window. In the Update Manager, click on the Install Updates and enter your password.
    The updates automatically apply themselves and relaunch Update Manager, this with
    time for more updates. Again, click Install Updates.


