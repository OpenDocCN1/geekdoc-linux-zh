    \ wchar_t |\n| 无值 | void |\n\n这些基本类型还可以使用修饰符进行扩展。长（Long）、短（Short）、有符号（Signed）和无符号（Unsigned）。这意味着修饰符可以扩展每个数据类型的极值范围。例如，`int`\
    \ 数据类型的值范围从 -2147483648 到 2147483647，这是一个合理的值。\n\n现在，如果你使用其中一个修饰符，范围就会改变：\n\n\
    - Unsigned int = 0 到 4294967295\n- Signed int = -2147483648 到 2147483647\n- Short\
    \ = -32768 到 32767\n- Unsigned short = 0 到 65535\n- Signed short = -32768 到 32767\n\
    - Long int = -2147483648 到 2147483647\n- Unsigned long int = -2147483648 到 2147483647\n\
    - Unsigned long = 0 到 4294967295\n\n自然情况下，你可以配合修饰符使用任何基本类型，每个数据类型都提供了足够的范围。然而，在\
    \ C++ 编程中，使用它们被认为是良好的。使用修饰符存在问题。`Double` 代表双精度浮点，可以使用它获取更精确的数字，但这些数字只精确到小数点五位。在\
    \ C++ 中显示数字时会出现这个问题，你可以通过添加 `precision()` 函数并在括号内添加值来限制 `double` 类型。例如，尝试这个：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\ndouble PI = 3.1415926535973236;\n\
    \nint main() {\n    cout << PI;\n}\n```\n\n```cpp\nDataTypes.cpp\n1 #include <iostream>\n\
    2 using namespace std;\n3 double PI = 3.1415926535973236;\n4 \n5 int main() {\n\
    6 {\n7     cout << PI;\n8 }\n9 }\n```\n\n编译并运行代码，你可以看到输出是 3.14159，这代表了 `cout`\
    \ 的限制。你也可以包含 `precision` 函数来获得更大的精度，到小数点两位位。使用以下代码：\n\n```cpp\n#include <iostream>\n\
    using namespace std;\ndouble PI = 3.1415926535973236;\n\nint main() {\n    cout.precision(2);\n\
