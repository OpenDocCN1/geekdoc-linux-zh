    Please enter a four-letter word: \")\nword_length=len(word)\nif word_length ==\
    \ 4:\n    print(word,\"is a four-letter word. Well done.\")\nelse:\n    print(word,\"\
    is not a four-letter word.\")\n```\n\n- 步骤 5 按 F5 保存并执行代码。在 Shell 中输入一个四字母单词，你应该你会收到该单词是四个字母的消息。现在按\
    \ F5 重新运行程序，这次输入五字母单词。Shell 将显示它不是四字母单词。\n\n- 步骤 6 扩展代码包含另一个条件。最终，它可能会变得复杂，我们增加了针对三字母单词的条件：\n\
    \n```python\nword=input(\"Please enter a four-letter word: \")\nif len(word)==4:\n\
    \    print(word, \"is a four-letter word. Well done.\")\nelif len(word)==3:\n\
    \    print(word,\"is a three-letter word. Try again.\")\nelse:\n    print(word,\"\
    is not a four-letter word.\")\n```\n\n## 循环\n\n循环看起来和条件很像，但在操作上有所不同。循环会根据次数运行代码块，通常由条件支持。\n\
    \n- 步骤 1 让我们从简单的 `While` 语句开始。`If`，这将检查某事是否为真，如果是则返回缩进的代码：\n\n- 步骤 3 `For` 循环是另一个示例。`For`\
    \ 用于遍历一组范围的数据，即存储在方括号变量中的列表。例如：\n\n```python\nx=0\nwhile x < 10:\n    print(x)\n\
    \    x = x + 1\n```\n\n```python\nwords=[\"Cat\",\"Dog\",\"Unicorn\"]\nfor word\
    \ in words:\n    print(word)\n```\n\n- 步骤 2 `If` 和 `for` 的区别在于 `while`，当它到达缩进代码的结尾时，它会返回并检查语句是否仍然为。对于\
    \ 10，每次循环打印 `x` 的当前值，然后将 `x` 加 1。当 `x` 最终等于 10 时循环结束。\n\n- 步骤 4 `For` 循环也可以使用\
    \ `range` 函数用于倒计时示例。\n\n```python\nfor x in range(1, 10):\n    print(x)\n```\n\
    \n这里不需要 `x`，因为 `range` 函数会从第一个到最后一个使用的数字创建一个列表。\n\n编码与编程 113\n\n"
