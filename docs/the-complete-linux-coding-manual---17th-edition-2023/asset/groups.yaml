    \    cout << area;\n}\n```\n\nLinux 编码与编程\n\n## 数据类型\n\n正如你所见，变量存储了程序员随后调用并在需要时进行操作的信息。变量简单来说是预留的内存位置，根据所使用的数据类型存储程序员分配的值。\n\
    \n## 数据的价值\n\nC++ 中为程序员提供了许多不同的数据类型，例如整数、浮点型、布尔型、字符等。人们广泛认为有七种基本数据类型，通常称为原生内置类型（Primitive\
