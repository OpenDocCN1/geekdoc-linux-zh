  - "[PAGE 133]\n\n# Data Types\n\nVariables, as you've seen, store information that\
    \ the programmer then later call up, and manipulate if required. Variables are\
    \ simply reserved memory locations that store the values the programmer assigns,\
    \ depending on the data type used.\n\n# THE VALUE OF DATA\n\nThere are many different\
    \ data types available for the programmer in C++, such as an integer, floating,\
    \ Boolean, character and so on. It's widely accepted that there are seven basic\
    \ data types, often called Primitive Built-in Types; however, you can create your\
    \ own data types that need to arise within your code.\n\n| Type | Command |\n\
    |---|---|\n| Integer | int |\n| Floating Point | float |\n| Character | char |\n\
    | Boolean | bool |\n| Double Point | double |\n| Wide Character | wchar_t |\n\
    | No Value | void |\n\nThese basic types can also be extended using the modifiers.\
    \ Long, Short, Signed and Unsigned. This basically means the modifiers can expand\
    \ the minimum and maximum range values for each data type. For example, the int\
    \ data type has a value of -2147483648 to 2147483647, a fair value, you would\
    \ get.\n\nNow, if you use one of the modifiers, the range alters:\n\n+   - Unsigned\
    \ int = 0 to 4294967295\n- Signed int = -2147483648 to 2147483647\n- Short = -32768\
    \ to 32767\n- Unsigned short = 0 to 65535\n- Signed short = -32768 to 32767\n\
    - Long int = -2147483648 to 2147483647\n- Unsigned long int = -2147483648 to 2147483647\n\
    - Unsigned long = 0 to 4294967295\n\nNaturally you can use any of the basic type\
    \ with the modifier, as there plenty of range provided with each data type. However,\
    \ it's considered good C++ programming to practise use them when needed.\n\nThere\
    \ are issues using the modifiers. Double represents a double-floating point, which\
    \ you can use to get more accurate numbers but these numbers are only accurate\
    \ up to the fifteenth decimal place. This is the problem when displaying numbers\
    \ in C++ using the function, in that case by only outputs the first five decimal\
    \ places. You can combat\n\nby adding a cout.precision() function and adding a\
    \ value inside the brackets then even you're still limited by the accuracy of\
    \ the double data type. For example, try this:\n\n```\n#include <iostream>\nusing\
    \ namespace std;\ndouble PI = 3.14159265358979323863;\n\nint main() {\n    cout\
    \ << PI;\n\n}\n```\n\n```\nDataTypes.cpp\n1 #include <iostream>\n2 using namespace\
    \ std;\n3 double PI = 3.14159265358979323863;\n4 \n5 int main() {\n6 {\n7    \
    \ cout << PI;\n8 }\n9 }\n```\n\nBuild and run the code and you can see the output\
    \ is 3.14159, representing cout's limitations in this.\n\nYou can also include\
    \ the code including the aforementioned cout.precision function, for greater accuracy.\
    \ You can practise all way up to 22 decimal places, with the following code:\n\
    \n```\n#include <iostream>\nusing namespace std;\ndouble PI = 3.14159265358979323863;\n\
    \nint main() {\n    cout.precision(22);\n    cout << PI;\n}\n```\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_133_0.png)"
