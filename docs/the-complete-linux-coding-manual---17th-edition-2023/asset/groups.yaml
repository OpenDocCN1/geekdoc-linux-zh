  mdcn: '


    # 在虚拟环境中安装 Linux


    现在 Oracle VirtualBox 已经运行起来，接下来的任务是创建一个虚拟机（VM）环境，你将并在其中安装 Linux。此过程不会影响你当前已安装的操作系统，这正是为什么虚拟机是一个极佳选择的原因。


    ## 创建虚拟机


    创建虚拟机时有许多选项可供选择。不过现在，让我们设置一个足以运行 Mint Cinnamon 并能够良好运行的虚拟机。


    - **步骤 1** 在 VirtualBox 中，点击应用程序右上角的“新建”图标。这将打开虚拟机向导。

    - **步骤 2** 在“名称”旁边的框中，输入 Linux Mint，VirtualBox 应该自动将“类型”选为 Linux，并将“版本”选为 Ubuntu
    (64-bit)；如果不是，请使用下拉框选择正确的设置（记住 Mint 是基于 Ubuntu 的）。准备好后，点击“下一步”。

    - **步骤 3** 下一部分定义了分配给虚拟机的内存（RAM）。此数量是从你计算机的可用内存中提取的。例如，如果我们给虚拟机分配太多（假设安装了 8GB
    内存，我们分配了 2GB 给虚拟机）。准备好后，点击“下一步”。

    - **步骤 4** 这一部分是你开始创建虚拟机用于安装 Mint 的虚拟磁盘的地方。默认选项“现在创建一个虚拟硬盘”就是我们正在使用的。点击“创建”继续。

    - **步骤 5** 点击“创建”后会弹出窗口，询问你想要创建什么种类型的虚拟硬盘。在这种情况下，我们将使用默认的 VDI（VirtualBox 磁盘镜像），因为其他格式通常用于在不同的虚拟机之间移动虚拟机。确保选中了
    VDI 并点击“下一步”。

    - **步骤 6** 是否选择“动态固定大小硬盘”的问题对于初学者来说可能有些困惑。动态分配的硬盘是一个更灵活的选项，在开始时不会在你的虚拟硬盘中占用大量空间。确保选中了“动态”并点击“下一步”。

    - **步骤 7** 虚拟硬盘是一个单一文件夹，在此状态下，你可以在计算机上添加你的虚拟硬盘。确保该部分有足够的可用空间。例如，我们将在你的 D 盘上使用一个更大的存储选项，命名为
    Linux Mint，并为虚拟硬盘分配 25.50GB 的空间。

    - **步骤 8** 在完成虚拟机的初始设置后；现在你应该可以在 VirtualBox 应用程序中看到新创建的虚拟机。在开始之前，点击“设置”按钮，然后在“常规”部分点击“高级”标签页。为“共享剪板”和“拖放”选择“双向”。

    - **步骤 9** 点击“系统”部分，然后点击“处理器”标签页。根据你的 CPU，为你的主机系统分配尽可能多负担得起的核心数；对于“显示”部分，将“视频内存”滑动到最大并启用“3D
    加速”。点击“确定”提交设置。

    - **步骤 10** 点击“启动”按钮，并在“启动磁盘”窗口中浏览文件夹（带有绿色图标）以找到下载的 Mint ISO 文件；然后点击“启动”以 Linux
    Mint Live 环境模式启动。你现在可以安装并遵循标准的安装要求了。


    > 你开启了自动捕获键盘选项。这将导致虚拟机自动捕获


    # 了解 Linux


    > “任何人都可以构建快速的处理器。技巧在于构建一个快速的系统。”

    — 西摩尔·克雷（Seymour Cray，电气工程师，Cray 超计算机的设计/创始人）


    我们使用 Linux Mint 作为指南，因为它是一个易于使用的发行版，非常适合新用户。它也是最先进、文档最全的发行版之一，并提供许多优秀的选项。在本节中，我们将介绍
    Linux Cinnamon 菜单和桌面、它的工作原理以及你可以对其进行的操作。想创建另一个用户或发现如何上网吗？请继续读下去。


    | 页面 | 标题 |

    | :--- | :--- |

    | 30 | Cinnamon 菜单简介 |

    | 32 | 桌面导航 |

    | 34 | 安装 Mint 后的 10 件事 |

    | 36 | 你知道吗... |

    | 38 | 创建用户 |

    | 40 | 自定义桌面 |

    | 42 | 接入网络 |


    ## Cinnamon 菜单简介


    现在你已经安装了 Linux，是时候仔细观察它了。不过首先，如果你使用 Virtualbox，你将收到一个关于“软件渲染”的通知；这里是修复方法。你已经查看了功能，使用了插入、删除，但还有一些可以应用的功能。


    - **步骤 1** 在开始之前，我们假设你遇到了这个问题。“软件渲染”消息出现在桌面的右上角。要修复此，点击 Virtualbox 窗口中的“设备”，然后点击“插入增强功能
    CD”。

    - **步骤 2** 增强功能 CD 包含 Virtualbox 的驱动程序，包括虚拟硬件。当加载时，你会收到一个“软件需要运行”的通知，有两个选项：“取消”和“运行”。点击“运行”按钮并输入你的
    Linux 密码。

    - **步骤 3** 几秒或几分钟后，你会自动进入一个名为“终端”的命令行视图。这详细说明了新驱动程序的安装、任何旧驱动程序的删除以及最新版本的安装。这不会花费很长时间，完成后系统将提示你按回车键退出终端。

    - **步骤 4** 增强功能 CD 图标在桌面上，因此右键点击并向下滚动菜单点击。你现在可以通过点击菜单、左边的重启按钮来重启 Linux Mint。


    > 此媒体包含自动启动的软件。你想运行它吗？软件将直接从 VBox_6.0 运行。如果不确定，按取消。


    # Cinnamon 菜单


    现在 Virtualbox 的软件渲染问题已经解决了，让我们看看 Cinnamon 菜单以及它的工作原理。记住，这仅适用于 Cinnamon，其他发行版的外观和行为会有不同。


    - **步骤 1** 首先，你可能已经注意到了登录 Linux 时弹出的欢迎屏幕。花点时间浏览选项，阅读“首次步骤”等。完成后，点击窗口右上角的“X”关闭它。

    - **步骤 2** 你已经使用过 Mint 菜单重启系统，并在第一次使用 Linux 环境时。这次，点击 Mint 菜单并将悬停在中间列的“办公”上。这将更改右侧列中显示的图标，详细说明该部分安装了哪些应用程序。

    - **步骤 3** 从菜单启动任何应用程序只需找到并点击它。例如，在“办公”部分下，点击 LibreOffice Writer。Writer 是 Linux
    Mint 的文字处理器。它可以以 Microsoft Word 格式打开和保存，功能几乎相同。

    - **步骤 4** 再次打开菜单，但这次将鼠标指针悬停在“图形”上，然后点击 GNU Image Manipulation Program。GIMP 是一个强大的处理程序，效果可能与
    Adobe 的 Photoshop 一样，但需要更多工作才能获得你想要的结果。不过它值得花时间掌握。

    - **步骤 5** 如果你正在寻找特定的功能或程序（例如设置打印机），点击 Mint 菜单顶部的搜索框。开始输入你想要的应用程序或功能，Mint 菜单会在下方显示相关选项。这在现代
    Linux发行版的菜单中都有效。

    - **步骤 6** 悬停在右侧列列出的任何应用程序上并右键点击，将看到一组选项：“添加到面板”、“添加到桌面”、“添加到收藏”和“卸载”。大多数中这些选项的用途都是显而易见的。“添加到收藏”会将应用程序放在左侧的快速访问列中。


    '
