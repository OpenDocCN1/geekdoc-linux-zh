  mdcn: '

    ## 在 PC 上安装 Linux


    大多数发行版都以 Live 环境（Live Environment）的形式提供。这意味着你可以从创建的 DVD 或 USB 闪盘启动一个真实的、功能完全的发行版。让我们来看看它是如何工作的，以及你如何从那里安装
    Linux。


    ## UEFI BIOS


    统一可扩展固件接口（UEFI）用于在 PC 启动过程中识别并保护。它取代了传统的 BIOS，但在安装 Linux 时可能会导致问题。


    - **步骤 1** 将你的 DVD 或 USB 闪盘插入 PC，如果尚未关闭 Windows，请将其关闭。在本例中，我们使用 USB 启动媒体，但过程几乎相同。启动
    PC 时，按下相应的键进入 BIOS 或 SETUP，选择 F2、Del 或 F11。

    - **步骤 2** UEFI BIOS 有不同的版本，可能的话会涵盖所有版本。你需要寻找的是详细说明启动顺序（Boot Sequence）或启动模式（Boot
    Mode）的部分。在这里你有关闭 UEFI 或 Legacy 安全启动（Secure Boot）的选项。大多数发行版都支持 UEFI，但如果不尝试可能会很棘手。

    - **步骤 3** 将 UEFI 切换到 Legacy 模式后，有两种方法进入 Live 环境。第一种是通过你已经进入的 BIOS。找到启动顺序，将第一个启动设备从原始设置更改为内部硬盘（Internal
    HDD）或镜像、媒体选项 USB 存储设备（USB Storage Device）或 DVD 器（DVD Drive）。

    - **步骤 4** 或者使用启动菜单（Boot Menu）。通过此选项，你可以按 F5（或类似的键）显示启动媒体选项列表，从那里选择合适的媒体。现在你可以导航到
    Save & Exit（保存并退出）选项并选择“Save Changes and Exit”来保存并退出 BIOS。


    ## 安装 Linux


    一旦 Live 环境启动，你就会看到将发行版安装到电脑的选项。环顾四周，当你准备好后，寻找桌面上的 Install（安装）选项。


    - 步骤 1 只要你已连接到网络（如果没有，请进行连接）并且处于 Live 环境中，双击桌面上的 Install Mint 图标开始安装过程。当然，其他发行版会显示它们自己的名称，但过程是相同的。准备绪后点击
    Continue（继续）。

    - 步骤 4 在安装过程开始之前，系统会询问你是否选择确保硬盘擦除是正确的。这是你退出的最后机会。如果你确定不介意清除所有内容并重新开始 Linux Mint，点击
    Continue 将文件备份到 Linux 磁盘/USB，重启并重新开始。

    - 步骤 5 最终，你会被要求设置用户名和密码。首先输入 Name 作为计算机名称，这是它在网络上的标识。接下来选择 Username（用户名），然后设置良好的
    Password（密码）。你可以点击 Login Automatic（自动登录）选项，但暂时留留 Encrypt Home Folder（加密主目录）选项。

    - 步骤 3 安装新操作系统时，建议擦除旧操作系统并替换为新的。当你到达此安装过程时，确保选择了“Erase disk and install Linux...”（擦除磁盘并安装
    Linux...选项。注意：这将完全从你的电脑中删除 Windows 10，请确保你已备份所有个人文件和数据。

    - 步骤 6 安装过程可能很快，可能会有更多问题回答，或者可能只是根据你之前的回答安装 Linux。无论如何，你最终都会被要求继续使用 Live 环境或重启（Restart）以使用新安装的操作系统；如果你已准备好使用
    Linux，请点击 Restart。


    准备安装 Linux Mint


    虽然安装过程与大多数 Linux 发行版非常，但某些发行版在安装期间会提供不同的问题。通常，这些问题并不难，没有非常技术性的内容，但如“安装第三方软件”（Installing-party
    software）之类的可能会令人困惑。在这种情况下，你可以点击 Continue，但如果你不确定，请准备一个连接互联网的设备以咨询任何问题。

    '
