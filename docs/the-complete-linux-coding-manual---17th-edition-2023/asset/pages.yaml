  md: '# Basics of the Terminal


    STEP 5 All the commands you enter work in the same manner: you enter the command,
    include any parameters to extend the use of the command and press Enter to execute
    the command line you''ve entered. Type into the Terminal: `uname` and press Enter.
    This displays some system information regarding Mint.


    STEP 8 View and Search options let you alter the sizing of the Terminal window
    and of course search within the Terminal for any particular words.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_46_0.png)


    STEP 6 Before we get into entering commands, let''s take a moment to see what
    the Terminal has to offer. The menu allows you to open a new Terminal, create
    a new profile, you can alter the size, colour and behaviour of the Terminal, add
    a new tab, and close all current active sessions.


    STEP 9 The Terminal entry enters the profile editing and sizing allows you to
    alter the character encoding. Interestingly, you can also set it to a Read Only
    mode, which stops you from entering any commands into the Terminal which is good
    for when you need to permanently display the contents.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_46_1.png)


    STEP 7 The Edit option lets you copy and paste commands to and from the Terminal
    and other sources; when you want to copy a very long and complex command from
    a web page. It allows you to edit the profile preferences.


    STEP 10 Finally, the Help option displays the contents and version number of the
    Terminal, or to be more precise, we''ll simply refer to it as Terminal in Future.
    The Contents are worth having a quick read through, to help familiarise yourself
    with the Terminal works.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_46_2.png)


    ![](img/b810837b9059fc96b3c0bd60b035eb13_46_3.png)


    Linux Coding & Programming 47'
