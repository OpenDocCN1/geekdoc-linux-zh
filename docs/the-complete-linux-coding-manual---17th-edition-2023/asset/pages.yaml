  md: "# Structure of a C++ Program\n\nCOMMENTS\nLines that begin with a double slash\
    \ are comments. This means they won't be executed and are ignored by the compiler.\
    \ Comments are designed to help you, or another programmer looking at your code,\
    \ to explain what's going on. There are two types of comment: // multiple line\
    \ comments and /* a single line.\n\n<<\nThe chevrons used here are insertion operators.\
    \ This means that whatever follows the chevrons is inserted into the std::cout\
    \ statement. In this case they're the words 'Hello, world!' which will be displayed\
    \ on the screen when you compile the code.\n\n```\nhelloworld.cpp\n#include <iostream>\n\
    \nint main() {\n    // My first C++ program\n}\n```\n\n```\nhelloworld.cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n    // My first C++ program\n\
    \    cout << endl;\n}\n```\n\nSTD\nWhile std stands for something quite different,\
    \ in C++ it means Standard. It's part of the Standard Namespace in C++, which\
    \ covers a number of different statements and commands. You can leave std part\
    \ out of the code but it must be declared at the start with namespace std; not\
    \ both. For example:\n\nOUTPUTS\nLeading on, the \"Hello, world!\" is what you\
    \ want to appear on the screen when the code is executed. You can enter whatever\
    \ you like inside quotation marks. Sometimes brackets are needed, depending on\
    \ the compiler. The endl part needs a new line to be inserted.\n\n```\n#include\
    \ <iostream>\nusing namespace std;\n```\n\n```\n//My first C++ program\ncout <<\
    \ \"Hello, world!\\n\";\n```\n\n```\n#include <iostream>\nint main() {\n    //\
    \ My first C++ program\n    std::cout << \"Hello, world!\\n\";\n}\n```\n\nCOUT\n\
    in this example we are using cout, which is a part of the Standard Namespace,\
    \ hence why it's there, as we're asking to use it for particular purpose. Character\
    \ cout, which displays, prints something to the screen. If you want endl, you\
    \ have to declare it at the start of the code, as mentioned below.\n\n; AND)\n\
    Finally you can see that lines within a function block (except) end with a semicolon.\
    \ This marks the end of the statement; all statements in C++ must have one at\
    \ the end or the compiler will fail to build. The very last line has the closing\
    \ bracket to indicate the end of the main function.\n\n```\nhelloworld.cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n    // My first C++ program\n\
    \    cout << \"Hello, world!\\n\";\n}\n```\n\nLinux Coding & Programming 125"
