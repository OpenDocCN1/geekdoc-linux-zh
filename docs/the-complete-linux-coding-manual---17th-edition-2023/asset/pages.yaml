  md: '# Fun Things to do in the Terminal


    Despite the seriousness of an operating system, the Linux community are certainly
    no strangers to a bit of fun. The developers over the years have created and inserted
    all manner of fun and odd elements into the Terminal.


    # TERMINAL FUN


    You''ll be working exclusively in the Terminal for the next two sections, so start
    warming your fingers. After all, work and no play... as the saying goes.


    +   STEP 1 The first command we''re going to use is sl, it''s not installed by
    default so enter sudo apt-get install sl. The command can be run with sl and when
    executed will display a Locomotive travelling across the screen (hence ''sl'').
    Entering ls, note the upper case, also works.


    +   STEP 3 If you''ve ever fancied having the computer read a random fortune out
    to you, then you''re in luck. Most distros require you to install the fortune,
    however Linux Mint differs having it already pre-loaded. All you need to do is
    enter the command fortune and enjoy.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_59_0.png)


    +   STEP 2 Fans of Star Wars get a fix when it comes to the Terminal. By linking
    to a remote server via the telnet command, you can watch Episode IV: A New Hope
    played out, all in ASCII. To view this spectacle, enter: telnet towel.blinklights.nl.


    +   STEP 4 The rev command is certainly interesting, and at first seems what a
    quite useless to the OS. However, it can be used to create some seemingly unbreakable
    passwords. Enter: rev, now type your text, and when you enter everything you type
    will be reversed. Press Ctrl+C to exit.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_59_1.png)


    ![](img/b810837b9059fc96b3c0bd60b035eb13_59_2.png)'
