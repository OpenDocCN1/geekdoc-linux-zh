  md: '# # Installing Linux on a PC


    Most distros come as a Live Environment. This means you can boot into an actual,
    fully-working distro from the DVD or USB that you created. Let''s see how that
    works and how you can go about installing Linux from there.


    # ## UEFI BIOS


    The Unified Extensible Firmware Interface (UEFI) is used to identify and protect
    a PC during its boot-up process. It replaces the traditional BIOS but can cause
    issues when installing Linux.


    +   * **STEP 1** Insert your DVD or USB drive into your PC, and if you haven''t
    already, shutdown Windows. In this instance we''re using the USB boot media but
    the process is virtually identical. Start the PC when prompted the appropriate
    key to enter the BIOS or SETUP, choose F2, Del or F11.


    +   * **STEP 3** With UEFI turned to Legacy mode, there are two ways of booting
    into the Live Environment. The first is via the BIOS you''re already in. Locate
    the Boot Sequence and change the first boot device from its original setting,
    to Internal HDD or mirror, to USB Storage Device for the media option, or DVD
    Drive for the media option.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_21_0.png)


    ![](img/b810837b9059fc96b3c0bd60b035eb13_21_1.png)


    +   * **STEP 2** There are different versions of UEFI BIOS, covering them all
    be it possible. What you''re looking for is a section that details the Boot Sequence
    or Boot Mode. Here you have the option to turn off UEFI or Legacy Secure Boot.
    Most distros work with UEFI but it can be a tricky not to try it.


    +   * **STEP 4** Alternatively use the Boot Menu. With this option you can press
    F5 (or something similar) to display a list of boot media options, from there
    you can choose the appropriate media. Here you can now Save and Exit the BIOS
    by navigating to the Save & Exit option and choosing "Save Changes and Exit"


    ![](img/b810837b9059fc96b3c0bd60b035eb13_21_2.png)'
