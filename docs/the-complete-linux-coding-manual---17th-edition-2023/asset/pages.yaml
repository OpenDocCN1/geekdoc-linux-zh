  md: '# #10 Things to do After Installing Linux Mint


    Linux Mint is a polished dish out of the box, but with most Linux distros, there
    are some tweaks that can be applied to improve the way it works. Although these
    are Mint-specific tweaks, most can be applied to other distros.


    # ## LINUX TWEAKS


    Some of these post-installation actions are highly recommended, while others are
    just additions and simply tweak the system or add a customisation.


    +   **STEP 1** The first, and most important, post-installation action is to update
    the system. Click on the shield icon in the Panel, Found at the bottom right of
    the desktop next to the time and date. This launches the Update Manager.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_33_0.png)


    +   **STEP 3** Click the OK and you can see a couple of updates ready for installation.
    Though click the blue bar OK to switch to a Local Mirror. Before you update this
    opens the Software Sources option. In the Mirrors section, click on the Main and
    Base drop-down menus and select a closest to your current location.


    +   **STEP 2** Linux Mint offers the user three level policy approach to updates:
    Don''t Break My Computer, Optimise Stability and Security and Always Update Everything.
    The recommended option is the Optimise Stability and Security, which only updates
    safe, essential patches that do not impact critical elements of the core. Read
    the descriptions but choose the middle, and recommended option.


    +   **STEP 4** Click the OK to close the Cache button and close the Software Sources
    window. In the Update Manager, click on the Install Updates and enter your password.
    The updates automatically apply themselves and relaunch Update Manager, this with
    time for more updates. Again, click Install Updates, OK any messages and wait
    for them to finish.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_33_1.png)'
