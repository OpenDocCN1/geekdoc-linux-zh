    \n# LOOPS\n\nA loop looks quite similar to a condition but they are somewhat different\
    \ in their operation. A loop will run through the block of code number of times,\
    \ usually with the support of a condition.\n\nSTEP 1 Let's start with a simple\
    \ While statement. If, this will check if something is TRUE, then return the indented\
    \ code:\n\nSTEP 3 For loop is another example. For is used to loop over a range\
    \ of data, a list stored as variables in square brackets. For example:\n\n```\n\
    x=0\nwhile x < 10:\n    print(x)\n    x = x + 1\n```\n\n```\nwords=[\"Cat\",\"\
    Dog\",\"Unicorn\"]\nfor word in words:\n    print(word)\n```\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_112_1.png)\n\
    \nSTEP 2 The difference between If and for is while and when it gets to the end\
    \ of the indented code, it goes back and checks the statement is still true. With\
    \ 10, each loop prints the current value of x, then adds 1 to that value. When\
    \ x eventually equals 10 loops.\n\nSTEP 4 For loop can also be used in the countdown\
    \ example using the range function.\n\n```\nfor x in range(1, 10):\n    print(x)\n\
