  md: '# Creating a Linux Installer on Windows


    # USB BOOTABLE MEDIA


    USB media is faster than a DVD and even more convenient, most modern PCs don''t
    have an optical drive installed. The process of transferring image is easy but
    you need a third-party app and a USB flash drive of 4GB or more.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_20_0.png)


    STEP 1 First open browser and go to www.rufus.ie. Scroll down the page and you
    come to a Downloading page which is the latest version of Rufus. Left the link
    to start the download.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_20_1.png)


    STEP 4 When you''re ready, click on the Start button of the Rufus app. This may
    open another dialog box asking you to download and use a new version of SysLinux.
    SysLinux is a selection of boot loaders, allowing your modern PC to access and
    boot from a USB flash drive. It is necessary, if so click on ''Yes'' to continue.


    As new versions of SysLinux are compatible with one another, and you may want
    to use Rufus to find the latest Linux files must be downloaded from the internet
    (''Hbinaries'' and ''Dillsys'') - download these files - Select ''No'' to continue


    > Note: The files will be downloaded in the current directory and will be resumed
    automatically.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_20_2.png)


    STEP 2 Double-click the downloaded executable and click Yes to the Windows security
    question and check for updates. With Rufus launched it should have identified
    your inserted USB drive, if not, remove and insert.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_20_3.png)


    STEP 5 The next steps ask you how you want the ISO to be written to USB flash
    drive. In both methods work for different situations but, the recommended ISO
    Mode is the more popular. This mode is preselected and click OK to continue, by
    OK to confirm the action.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_20_4.png)


    If you have an ''ISOHybrid'' image. This means it can be written either in ISO
    (file mode) or DD (disk mode). Rufus will use ISO mode by default so that you
    always have full access to the drive after writing it.

    If you encounter errors during boot, you may want to try writing image in DD mode.


    +   Please select the mode you want to use for this image:

    - Write in ISO mode (Recommended)

    - Write in DD mode


    ![](img/b810837b9059fc96b3c0bd60b035eb13_20_5.png)


    STEP 3 At the first Rufus interface you will find it confusing but not, it''s
    really quite simple. To begin with, click the SELECT button next to the ''Disk
    or ISO Image (select)'' dropdown menu. This launches a Windows explorer where
    you can choose and select the ISO.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_20_6.png)


    STEP 6 The ISO you transferred to the USB flash drive. It shouldn''t take too
    long, depending on the speed of the USB drive you found. Rufus auto-opens the
    USB drive in Windows Explorer during the process; you dont worry or close it if
    you want. When the process is complete, click on the button.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_20_7.png)


