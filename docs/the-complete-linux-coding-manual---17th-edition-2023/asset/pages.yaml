  md: "# Structure of a C++ Program\n\nC++ has a very defined structure and way of\
    \ doing things. Miss something out, even as small as a semicolon, and your entire\
    \ program will fail to be compiled and executed. Many a professional programmer\
    \ has fallen foul of sloppy structure.\n\n#INCLUDE <C++ STRUCTURE>\nLearning the\
    \ basics of programming, you begin to understand the structure of a program. The\
    \ commands may be different from one language to the next but you can start to\
    \ see how the code works.\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_123_0.png)\n\
    \n```\nINT MAIN()\n main() initiates the declaration of a function, which is a\
    \ group of code statements under the name 'main'. All C++ code begins at the main\
    \ function, regardless of where it lies within the code.\n```\n\n```\nhelloworld.cpp\n\
    #include <iostream>\nint main()\n```\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_123_1.png)\n\
    \n#INCLUDE The structure of a C++ program is quite precise. C++ code begins with\
    \ a directive: #include <. The directive instructs the pre-processor to include\
    \ a section of the standard C++ code. For example: #include <iostream> includes\
    \ the header to support input/output operations.\n\nBRACES The open brace (brackets)\
    \ is something that you may not have come before, especially if you're used to\
    \ Python. The open brace indicates the beginning of the main function and all\
    \ the code that belongs to that function.\n\n```\nhelloworld.cpp\n#include <iostream>\n\
    int main()\n{}\n```\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_123_2.png)"
