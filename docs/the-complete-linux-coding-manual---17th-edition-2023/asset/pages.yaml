  md: "# C++ Maths\n\nProgramming is mathematical in nature and as you might expect,\
    \ there's plenty of built-in scope for some quite intense maths. C++ has a lot\
    \ to offer someone who's implementing mathematical models into their code. It\
    \ can be extremely complex or relatively simple.\n\n# C++ = MC2\n\nThe basic mathematical\
    \ symbols apply in C++ as they do in most other programming languages. However,\
    \ by using the C++ Math Library, you can also calculate square roots, powers,\
    \ trig and more.\n\n+   STEP 1 C++'s mathematical operations follow the patterns\
    \ as taught in school, in that multiplication and division take precedence over\
    \ addition and subtraction. You can alter that create a new file and entry.\n\n\
    +   STEP 3 Multiplication and division can be applied as such:\n\n```\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n    float numbers = 100;\n\
    \    numbers = numbers + 10; // This adds 10 to the initial\n    cout << numbers\
    \ << \"\\n\";\n    numbers = numbers - 10; // This subtracts 10 from the new\n\
    \    cout << numbers << \"\\n\"\n}\n```\n\n```\n#include <iostream>\nusing namespace\
    \ std;\n\nint main() {\n    float numbers = 100;\n    numbers = numbers * 10;\
    \ // This multiplies 100 by 10\n    cout << numbers << \"\\n\";\n    numbers =\
    \ numbers / 10; // And this divides 1000 by 10\n    cout << numbers << \"\\n\"\
    \n}\n```\n\n+   STEP 2 While simple, the code gets the maths warmed up. Note that\
    \ we used a float for the numbers variables. While you can use an integer, if\
