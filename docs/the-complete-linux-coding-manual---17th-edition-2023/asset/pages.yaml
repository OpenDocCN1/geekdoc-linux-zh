    [GCC 4.8.0] Linux\n> type \"credits\" or \"license\" for more information.\nshirt\
    \ = 19.99\nprint(type(shirt))\nclass 'float'\n```\n\nSTEP 7\nAnother example of\
    \ Typecasting is when you provide input from the user, as a string. For example,\
    \ enter:\n\nenter:\nageage = input(\"How old are you?\")\n\nAll data is stored\
    \ as a string variable.\n\nSTEP 10\nWhen combining integers and floats usually\
