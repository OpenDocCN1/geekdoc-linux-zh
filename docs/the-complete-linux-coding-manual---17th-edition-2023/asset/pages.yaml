    \ Terminal to update and override the Update Manager, regardless of the distro\
    \ you're using? Some users greatly prefer using the Terminal to update their Linux\
    \ systems and accompanying apps, in the belief that it's better. However, that\
    \ is not.\n\nUsing the Terminal, apt-get update, doesnt change handling dependencies\
    \ between versions of packages, so if a package has its dependent files changed\
    \ from one version to another, then the update is held back\n\nThe Update Manager,\
    \ or Software Manager (depending on the distro), phases its updates and marks\
    \ those packages\n\nwith changed dependencies for updating. However, and this\
    \ is it, sometimes it doesn't.\n\nIt slows down the development of the package\
    \ being updated and the package is held in the distro's repositories until the\
    \ update is stable or in essence, from the point of view of your user, if you\
    \ update and upgrade using both the Terminal and the Update Manager regularly,\
    \ then you will be up to date as possible, and get the essential and stable versions\
    \ of the software, then it's best for reliable package updates, restart distro.\n\
