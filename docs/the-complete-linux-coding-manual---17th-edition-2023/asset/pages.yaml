  md: "# # Linux Kernel 0.01\n\n```\n/*\n * console.c\n * This module implements the\
    \ console functions\n * int console_init(void) {\n * while (read(tty_queue, queue))\n\
    \ * Hopefully this will be a rather complete VT102 implementation.\n * }\n\n```\n\
    \nNOTE!!! We sometimes disable and enable interrupts for a short while\n(to put\
    \ a word in video), but this will work even for keyboard\nencodings. However,\
    \ it doesn't start when getting a keyboard\ninterrupt, we use trap-gates. Hopefully\
    \ all is well.\n\n```\n#include <linux/sched.h>\n#include <linux/tty.h>\n#include\
    \ <asm/h>\n#include <asm/system.h>\n\n#define SCREEN_START 0xB8000\n#define SCREEN_END\
    \ 0x0000\n#define LINES 25\n#define COLUMNS 80\n\nextern unsigned void keyboard_interrupt(void)\
    \ {\n    static unsigned long origio=SCREEN_START,end_SCREEN_START+LINES*COLUMNS=0;\n\
    \    static unsigned long x,y;\n    static unsigned long top=0,bottom-LINES;\n\
    \    static unsigned long lines=LINES,columns=COLUMNS;\n    static unsigned long\
    \ count;\n    static unsigned long ques=0;\n    static unsigned char attr=0x07;\n\
    \n```\n\nDID YOU KNOW... that the first Linux kernel, programmed by Linus Torvalds,\
    \ only occupied 65KB of memory? And since version 0.01, the Linux kernel now boasts\
