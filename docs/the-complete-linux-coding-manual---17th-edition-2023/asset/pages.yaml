  md: "# C++ Comments\n\nCommenting in C++ involves using a double forward slash '//\
    \ or a forward slash and an asterisk '/*'. You've already seen brief examples\
    \ but this is how it works.\n\nUsing the Hello World code as an example, you can\
    \ easily comment on different sections of the code using the double slash:\n\n\
    ```\n// My first C++ program cout << \"Hello, World!\\n\";\n```\n\n```\nhelloworld.cpp\n\
    #include <iostream>\nusing namespace std;\nint main() {\n    // My first C++ program\n\
    \    cout << \"Hello, World!\\n\";\n    cout << \"And greetings from C++!\\n\"\
    ;\n}\n```\n\nBe careful when commenting, with block comments. It's very easy to\
    \ forget to add the closing asterisk and forward slash and any code that fails\
    \ to indent the comment block.\n\n```\nhelloworld.cpp x\n#include <iostream>\n\
    using namespace std;\nint main() {\n    // First C++ program\n    cout << \"Hello,\
    \ World!\\n\"; // This line outputs the words\n    /* This comment can\n     \
    \  several lines\n       without the need to add more slashes */\n    cout <<\
    \ \"And greetings from C++!\\n\"\n}\n```\n\nHowever, you can add comments to a\
    \ line of code, to describe in a better way what is going on:\n\n```\ncout <<\
    \ \"Hello, World!\\n\"; // This outputs the words 'Hello, world.' The \\n denotes\
    \ a new line.\n```\n\nNote, you don't have to put a semicolon at the end of a\
    \ comment. This is because it's in a line that is ignored by the compiler.\n\n\
    ```\nhelloworld.cpp\n#include <iostream>\nusing namespace std;\nint main() {\n\
    \    // My first C++ program\n    cout << \"Hello, World!\\n\"; // This line outputs\
    \ the words 'Hello, world.' The \\n denotes a new line.\n}\n```\n\nYou can comment\
    \ out several lines by using the forward slash and asterisk:\n\n> * This comment\
    \ can\ncover several lines\nwithout the need to add more slashes */\n\nRemember\
    \ to finish the block comment with the opposite asterisk and forward slash.\n\n\
    ```\nhelloworld.cpp\n#include <iostream>\nusing namespace std;\nint main() {\n\
    \    // My first C++ program\n    cout << \"Hello, World!\\n\"; // This line outputs\
    \ the words 'Hello, world.' The \\n denotes a new line.\n    /* This comment can\n\
    \       several lines\n       without the need to add more slashes */\n}\n```\n\
    \n```\nhelloworld.cpp\n#include <iostream>\nusing namespace std;\nint main() {\n\
    \    cout << \"Hello, World!\\n\";\n}\n```\n\nIf you try to build and execute\
    \ the code it errors, complaining of a missing curly bracket to finish off the\
    \ block of code. If you have made the error a few times, then it is easy to go\
    \ back and rectify. Frankly, the commenting in Geany helps identify comments with\n\
    \n+   Symbols\n- helloworld.cpp x\n- #include <iostream>\nusing namespace std;\n\
    - main (4)\n- Variables\n- main (2)\n\n```\ncout << \"Hello, World!\\n\";\n/*\
    \ This comment can\n   several lines\n   without the need to add more slashes\
    \ */\ncout << \"And greetings from C++!\\n\"\n```\n\nWith block comments, it is\
    \ good practice in C++ to add an asterisk to each new line of the block. This\
    \ also helps you to remember to close the comment block before continuing with\
    \ the code:\n\n> * This comment can\ncover several lines\nwithout the need to\
    \ add more slashes */\n\nFrankly, Geany does this automatically but be aware of\
    \ it when using IDEs."
