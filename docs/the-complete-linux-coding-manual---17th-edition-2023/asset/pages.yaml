    STEP 7 Of course you don''t have to use the Terminal to enter text into a file.
    Mint comes with a text editor Xed, which is similar to Windows Notepad. To view
    the previously created file in Xed, type into the Terminal xed Test2.txt and press
    Enter.


    STEP 10 We''ve learned to launch a Mint app, Xed can be opened by any command
