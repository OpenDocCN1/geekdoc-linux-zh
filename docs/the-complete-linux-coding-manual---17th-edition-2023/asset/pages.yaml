  md: '# Creating a File using the Terminal


    STEP 5 Let''s say you now wanted to create a text file, we''ll call it Test2.txt,
    with complete content to do. So, enter: cat Test2.txt. This will create the file
    Test2.txt and put it into the terminal.


    STEP 8 Xed is a GUI app, and you can enter text and save the file, or any file,
    by using the app''s main window, or File > Save | Save As from its top menu bar.


    ```

    david@david-mint $ mkdir Test2

    david@david-mint $ cd Test2

    david@david-mint $ touch Test.txt

    david@david-mint $ echo "Hello World" > Test2.txt

    cat Test2.txt

    ```


    ![](img/b810837b9059fc96b3c0bd60b035eb13_56_0.png)


    STEP 6 You''ll notice that the cursor is flashing below the cat > Test2.txt command
    without the prompt. This prompt will allow you to enter the text that the file
    will contain. Enter text, then press Ctrl+D to exit and save the contents to the
    file.


    STEP 9 If, however you prefer to remain within the Terminal to edit/save files,
    you can use Nano. Nano is a Simple Terminal-based editor. To try to edit a file,
    type nano filename. There''s a menu at the bottom of the screen. To save and exit
    any content in Nano, press Ctrl+X and follow the on-screen instructions.


    ```

    david@david-mint $ mkdir Test2

    david@david-mint $ cd Test2

    david@david-mint $ touch Test.txt

    david@david-mint $ echo "Hello World" > Test2.txt

    cat Test2.txt

