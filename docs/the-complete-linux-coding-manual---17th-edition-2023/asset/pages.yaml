  md: '# Python on Linux


    # Conditions and Loops


    Conditions and loops are what make a program interesting; they can be simple or
    rarer complex. how you use them depends greatly on what the program is trying
    to achieve; they could be the number of lives left in a game or just displaying
    a countdown.


    # TRUE CONDITIONS


    Keeping conditions simple to begin with makes learning to program a more enjoyable
    experience. Let''s start then by checking if something is true, then doing something
    else if it isn''t.


    +   STEP 1 Let''s create a new Python program that will ask the user to input
    a word, then check to see if it''s a four-letter word or not. Start with File
    > New, and begin with the input variable:


    +   STEP 3 Now you can use an if statement to check if the word, length is equal
    to four and print a friendly confirmation if it applies to the rule:


    ```

    word=input("Please enter a four-letter word: ")

    ```


    ```

    word=input("Please enter a four-letter word: ")

    word_length=len(word)

    if word_length == 4:

    print(word,"is a four-letter word. Well done.")

    ```


    ![](img/b810837b9059fc96b3c0bd60b035eb13_111_0.png)


    The double equals (=) means if checking is true or something else.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_111_1.png)


    +   STEP 2 Now we can create a new variable, then use the function and pass the
    variable through it to get the total number of letters that the user has entered:


    +   STEP 4 The condition at the end of if tells you that the statement is true
    everything after the colon indent. Next, move the cursor to the beginning of the
    Editor:


    ```

    word=input("Please enter a four-letter word: ")

    word_length=len(word)

    ```


    ```

    word=input("Please enter a four-letter word: ")

    word_length=len(word)

    if word_length == 4:

    print(word,"is a four-letter word. Well done.")

    else:

    print(word,"is not a four-letter word.")

