  md: '# # Command Line Quick Reference


    When you start using Linux full time, you will quickly realise that the graphical
    interfaces of Ubuntu, Mint, etc. are great for many tasks but not great for all
    tasks. Understanding how to use the command line not only builds your understanding
    of Linux but also improves your knowledge of coding and programming in general.
    Your command line quick reference guide is designed to help you master Linux quicker.


    # ## TOP 10 COMMANDS


    These may not be the most common used by everyone but they will certainly feature
    frequently for many users of Linux and the command line.


    **cd** is one of the commands you will use the most at the command line in Linux.
    It allows you to change your working directory. Use it to move around within the
    hierarchy of your file system. You can also use chdir.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_79_0.png)


    **mv** command moves a file to a different location or renames a file. example
    **mv file sub** renames the original file to **sub ~/Desktop** moves the file
    ''sub'' to your desktop directory does not rename it. You must specify a new name
    to rename it.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_79_1.png)


    **ls** shows the files in your current directory. Used with certain options, it
    lets you see file sizes, when they were created and for example, **ls -l** shows
    you the files that are in your home directory.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_79_2.png)


    **chown** changes the user or group ownership of each given file. If only an owner
    (a user name or numeric ID) is given, that changes the owner of each given file,
    and the files'' group.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_79_3.png)


    **cp** used to make copies of files and directories. For example, **cp file sub**
    makes an exact copy of the file you entered and names the copy sub; the first
    file will start with its original name.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_79_4.png)


    **chmod** changes the permissions on the files listed. Permissions are based on
    a simple system. You can set permissions for user, group and world you can set
    whether each can read, write, and execute.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_79_5.png)


    **pwd** command prints the full pathname of the current working directory (“printing
    working directory”). Note that the GNOME terminal also displays this information
    in the title bar of window.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_79_6.png)


    **rm** removes the deleted files and directories. The removal process unlinks
    a file in a filesystem from the storage device and marks as usable by future uses.
    In other words, removing files increases the amount of space available on your
    disk.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_79_7.png)


    **clear** command clears your screen if it is possible. It lets the environment
    for the terminal type and then the terrific to figure out how to clear the screen.
    This is equivalent to typing Control-L when using the shell.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_79_8.png)


    **mkdir** for “make directory” is used to create directories in a file system
    if the directory does not already exist. For example, **mkdir** works a create
    directory. More than one directory may be specified when calling mkdir.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_79_9.png)'
