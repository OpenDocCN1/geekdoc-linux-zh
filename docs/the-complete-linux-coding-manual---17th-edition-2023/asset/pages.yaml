  md: "# Creating and Removing Directories\n\nSTEP 5 The command to create directories\
    \ is logical, directories within directories. However, if you want to create a\
    \ directory and a sub-directory in a single command make sure you're at home (cd\
    \ ~) or enter: mkdir -p Temp/finances. Now, cd Temp/ is to list the directory.\n\
    \nSTEP 8 Now that we've created some directories, let's see about removing them.\
    \ By start entering the directory and listing its contents: cd testdir/ ls. The\
    \ previously created reports-directory is present. One way to remove it is enter:\
    \ rmdir reports, then ls to confirm it's not there.\n\n```\nFile Edit View Search\
    \ Terminal Help\ndaviddavid-mint ~ -Temp\\mkdir -p Temp/finances\nls\ncd Temp/finances\n\
    ls\ncd ..\nls\ndaviddavid-mint ~ -Temp\n```\n\n```\nFile View Search Terminal\
    \ Help\ndaviddavid-mint ~ -testdir\nmkdir testdir\ncd testdir\nmkdirdir reports\n\
    rmdir reports\ncd ..\nls\nrmdir testdir\ndaviddavid-mint ~ -testdir\n```\n\nSTEP\
    \ 6 The -p option is what enables mkdir to create the sub-directory as well as\
    \ the parent directory. In Linux, commands follow the same structure: Command,\
    \ Option, and Argument. In the previous step example, Command (mkdir), option\
    \ (-p) and argument (Temp/finances).\n\nSTEP 9 A quick warning: removing a directory\
    \ in the Terminal does not place it in the Mint Rubbish Bin, via Nemo file manager.\
    \ The same goes for any files, if you remove a directory from the Terminal it's\
    \ gone for good.\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_58_0.png)\n\n```\n\
    File Edit View Search Terminal Help\ndavid@david-mint $ mkdir -p Temp/finances\n\
    ```\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_58_1.png)\n\nSTEP 7 If you want\
    \ to draw into the various options available for the mkdir command, you can enter\
    \ mkdir --help to the Terminal. This will provide a quick help detailing the options\
    \ and how the command works.\n\nSTEP 10 Rmdir will only remove empty directories,\
    \ to remove sub-directories, or even files, you'll need to use the rm command\
    \ with the -R option. For example, try the rm -R Temp. A quick is reveals that\
    \ the parent folder and all of its contents are removed. Careful when using this\n\
    \n```\nFile Edit View Search Terminal Help\ndaviddavid-mint ~ --help\nmkdir [OPTIONS]\
    \ [DIRECTORY...]\nmake DIRECTORY (S), if they do not already exist\n  -a     \
    \              make parents\n  --mode=MODE           set file mode (in octal or\
    \ numeric)\n  -v                   preserve existing permission\n  --selinux \
    \           set SELinux context of each created directory\n  --verbose       \
    \      describe what is being made\n  --context=TEXT       set SELinux context\n\
    \  -Z,TEXT              use -Z, or if TEXT is specified to set the SELinux context\n\
    \  --help                display help information and exit\n```\n\n```\nFile Edit\
    \ View Search Terminal Help\ndaviddavid-mint ~ --help\nmkdir [OPTIONS] [DIRECTORY...]\n\
    make DIRECTORY (S), if they do not already exist\n  -a                   make\
    \ parents\n  --mode=MODE           set file mode (in octal or numeric)\n  -v \
    \                  preserve existing permission\n  --selinux            set SELinux\
    \ context of each created directory\n  --verbose             describe what is\
