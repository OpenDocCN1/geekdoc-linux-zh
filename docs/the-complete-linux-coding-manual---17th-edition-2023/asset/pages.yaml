  md: '# Pi x Linux = The Perfect Combination


    # WHICH PI?


    There are several Raspberry Pi models available, with each offering something
    slightly different from the others. The most recent Pi released is the Raspberry
    Pi 3 B+, and while this model is slightly more expensive than some of the other
    examples, it is the most powerful and feature-rich Pi


    Overall, It''s probably best to start experimenting with the Pi using the Linux
    Pi 3 B+, then moving on to one of the other models as you develop your skills
    and focus on a particular project, such as the use of the Pi Zero, with a smaller
    footprint and WiFi connectivity.


