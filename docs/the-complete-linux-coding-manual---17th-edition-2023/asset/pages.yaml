  md: '# # Creating Functions


    Now that you have mastered the use of variables and user input, the next step
    is to tackle functions. You''ve already used a few functions, such as the print
    command but Python enables you to define your own functions.


    # FUNKY FUNCTIONS


    A function is a command that you enter into Python to do something. It''s a little
    piece of self-contained code that takes data, works on it and then returns the
    result.


    +   STEP 1 It''s not just-data that a function works on. They can do all manner
    of things from one format to another and check the length or type of items. For
    example, a function is a short word that follows by brackets. For example, `len()`
    or `type()`.


    +   STEP 3 You can pass variables through functions in much the same manner. Let''s
    assume you want the number of letters in a person''s surname, you could use the
    following code (enter the text editor for this example):

    ```python

    name=input("Enter your surname: ")

    print("Your surname has", count, "letters in it.")

    ```


    ![](img/b810837b9059fc96b3c0bd60b035eb13_109_0.png)


    +   STEP 2 A function takes data, using a variable, works on it depending on how
    the function is programmed to do and return the value. The data being worked on
    inside the brackets, so if you wanted to know how many letters are in the word
    establishmentarianism, then you''d use: `len("disestablishmentarianism")` and
    the number 28 would return.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_109_1.png)


    +   STEP 4 Python has tens of functions built into it, far too many to get into
    the limited space available here. However, to view the list of built-in functions
    available Python 3, navigate to docs.python.org/3/library/functions.html. These
    are the predefined functions, but users who have created more, they''re not the
    only ones available.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_109_2.png)


    ![](img/b810837b9059fc96b3c0bd60b035eb13_109_3.png)'
