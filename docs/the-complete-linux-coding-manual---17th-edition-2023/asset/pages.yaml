  md: "# Data Types\n\n```\nDataTypes.cpp\n#include <iostream>\nusing namespace std;\n\
    double PI = 3.1415926535897323846;\nint main() {\n    cout.precision(22);\n  \
    \  cout << PI;\n}\n\n```\n\nThis is mainly due to the conversion from Binary in\
    \ the compiler and that IEEE 754 double precision standard occupies 64-bits of\
    \ data, where 52-bits are enough to represent the significant digits in the floating-point\
    \ number) and roughly 3.5-bits are taken holding the values 0 to 9. If you divide\
    \ 53 by 3.5, you will get 15.14287 which is 15 digits.\n\nTo be honest, if you're\
