    # BEYOND RASPBIAN


    # PI, LINUX AND CODING


    The flexibility of the Raspberry Pi''s processor means it''s capable of running
    other operating systems besides own. Still keeping with Linux, you can install
    Ubuntu MATE, Pidora (a Fedora-based distribution), Lakka, PiPlay (an emulation
    distribution) and Arch Linux. There are also systems based based on the Linux
    kernel, such as Android, Raspbian, and Chromium OS.


    As previously, the Raspberry Pi is an excellent code base, and with Linux as the
    backbone you''ll be able to learn how to code in a multitude of different programming
    languages.


    There''s Windows 10 Core, Raspberry Pi OS, Raspian PI, and Needless so, once you''ve
    finished experimenting with one version of Linux, you as well with a desktop version
    of Linux, you can go to another on the Raspberry Pi and see how that works, and
    whether it will work for you.


    Python is perfectly suited, since Raspberry is Linux, and debian-based, you can
    easily expand your scripts to encompass all of Pi''s functionality. Aside from
    creating backup scripts, you can create scripts that access the GPIO pins on the
    Pi, and be in able to create LEDs, and even more.


    # RISC OS Pi


    C is one of the most popular programming languages for beginners, and Raspberry
    comes pre-installed with everything you will need to get the most from your Python
    experience. There are countless pre-loaded modules, and as the most recent stable
    release of the language


    Pi comes with a great C++ editor, that''s easy to use and can help you develop
    amazing content. Whichever way you decide to take the coding and Linux adventure,
    the Raspberry Pi is an excellent platform from which to begin on.


