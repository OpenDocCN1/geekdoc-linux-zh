  md: '# # Install Apps via the Terminal – Part 2


    Most of the time you''ll get to install apps from the Terminal using the standard
    apt-command. However, sometimes an app demands a little more. This means installing
    an app from its source code, which isn''t as scary as it first sounds.


    # ## FROM THE SOURCE


    The commands you will need to be familiar with here are Configure, Make and Install.
    You''ll find a lot of apps using from source, so it''s certainly a skill worth
    investing time in.


    +   **STEP 1** Source code for Linux usually come in the form of .TAR.GZ or .TAR.BZ2.
    Both are compressed files holding all the code needed to ‘make’. Start off this
    tutorial by creating a new folder in Home: `mkdir vim`.


    +   **STEP 3** The `wget` command retrieves content from the internet, in this
    case the BZ2 file for Vim. To check its downloaded successfully, according to
    Mint''s file system colour, the compressed file should be displayed in red.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_51_0.png)


    +   **STEP 2** Vim, by the way, is an advanced text editor which we''ll use as
    an example to install. Enter the folder, cd Vim, then within the new Vim folder,
    enter the following command into the Terminal: `wget ftp://ftp.vim.org/pub/vim/unix/vim-7.tar.bz2`


    +   **STEP 4** We need to uncompress the contents of the file, now so: enter `tar
    -xf vim-7.4.tar.bz2` or type in `tar -xf v` and press the Tab to auto-fill the
    remaining file name.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_51_1.png)'
