  md: "# User Interaction\n\nThere's nothing quite as satisfying as creating a program\
    \ that responds to you. This basic user interaction is one of the most taught\
    \ aspects of any language and with it you're able to do much more than simply\
    \ greet the user by name.\n\n# HELLO, DAVE\n\nYou have already used cout, the\
    \ standard output stream, throughout our code. Now you're going to be using cin,\
    \ the standard input stream, to program a user response.\n\n+   * STEP 1 Anything\
    \ that you want the user input into the program needs to be stored somewhere in\
    \ the system memory, so it can be retrieved and used. Therefore, any input must\
    \ first be declared as a variable, so it's ready to be used by the user. By creating\
    \ a blank C++ file with headers:\n\n+   * STEP 3 The cin command works in the\
    \ opposite way from the cout command. With the first cout line're outputting 'What\
    \ is your age' to the screen, as indicated with the chevrons. Cin uses facing\
    \ chevrons, indicating an input. The input is put into the integer age and used\
    \ in the second cout command. Build and run code.\n\n```\nuserinteraction.cpp\n\
    1 #include <iostream>\n2 using namespace std;\n3 int main() {\n4 \n5 \n6 }\n```\n\
    \n![](img/b810837b9059fc96b3c0bd60b035eb13_139_0.png)\n\n+   * STEP 2 The data\
