  md: '# # Update Mint via the Terminal


    Up to now you''ve been using the shield icon to launch Mint Update Manager in
    order to update the system and upgrade the currently installed apps, tools and
    other elements. However, you can also accomplish a complete system update and
    upgrade from the Terminal.


    # ## USING APT-GET


    To update and upgrade via the Terminal you use the APT (Advanced Packaging Tool)
    command. It''s a powerful tool and combines different elements depending on its
    use.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_47_0.png)


    +   **STEP 1** Start by opening a Terminal or if you already have one open it
    with the clear command. This starts off with a clean slate on to work.


    ```

    david@david-mint ~$ sudo clear

    ```


    ![](img/b810837b9059fc96b3c0bd60b035eb13_47_1.png)


    +   **STEP 2** Enter apt-get into the Terminal. This brings up a list of the most
    used apt-get commands, along with a brief description of what each does. It works
    to look at even if it doesn''t make huge of sense at this time.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_47_2.png)


    +   **STEP 3** Apt-get is used to update the software in Mint, as well as Ubuntu
    and other Debian-based distros. Using the Update element retrieves new packages
    and updates the list of source files. Upgrade and download them to the latest
    versions of files. To start the entire Update and process, enter: sudo apt-get
    update, followed by your password.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_47_3.png)


    +   **STEP 4** Notice the addition of the sudo command. The sudo command once
    means Super User Do that it''s more acceptable as Sub User Do. It means that the
    administrative (super User) uses APT (Advanced Packaging Tool) to get any updates.
    Use this: sudo apt-get upgrade.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_47_4.png)


