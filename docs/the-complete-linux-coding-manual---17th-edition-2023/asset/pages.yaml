  md: '# Linux Tips and Tricks


    # MEMORY HOGS


    If you need to see what apps are consuming the most memory on Linux, simply enter:


    ps aux | sort -rnk


    This sorts the output by system memory.


    # BBS


    Back in the days of dial-up connections, the online world was made up of Bulletin
    Board Systems. These remote servers proved hangouts for users to chat, swap code,
    play games and more. Using Linux, we can still connect to some active BBSes.


    # telnet bastellarbastards.dynnds.org


    There are countless operational BBSes available, check out https://www.telnetbbsguide.com/bbs/list/detail/
    for more.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_64_0.png)


    # SHREDDER


    When you delete a file, there''s a chance of someone with the right software could
    retrieve it. However, to securely and permanently delete a file, use Shred:


    ```

    shred -zu NAMEFILE.txt

    ```


    Replace NAMEFILE with the name of the file to delete.


    # DIRECTORY TREES


    If you want to create an entire directory (or folder) with one command:


    ```

    mkdir -p New-Dir/

    {folder1,folder2,folder3,folder4}

    ```


    This creates a NewDir with four sub folders.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_64_1.png)


    # ASCII ART


    ASCII can be striking when applied to some images. However, it''s often difficult
    to get right. You can create some great ASCII art from the images you have using
    img2txt:


    ```

    img2txt NAMEFILE.png

    ```


    Replace NAMEFILE with the actual name of the image file on your system. img2txt
    install installed, use:


    ```

    sudo apt-get install

    caca-utils.

    ```


    # FORGOTTEN COMMANDS


    It''s not easy to remember all the Linux commands. Thankfully, we can use apropos
    to help us. Simply use it, with a description of the:


    ```

    apropos "copy files"

    apropos "rename files"

    ```


