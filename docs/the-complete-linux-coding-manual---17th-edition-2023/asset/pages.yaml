  md: '# # Why Linux?


    For many of its users, Linux means freedom. Freedom from the walled garden approach
    of other operating systems, freedom to change and use the OS as you please and
    freedom from any form of licensing or payment. There''s a lot more to Linux than
    you may think of.


    # ## FREE AND OPEN


    Linux is a fantastic fit for those who want something different. The efficiency
    of the system, the availability of applications and stability are just a few good
    reasons.


    The first thing you need to know is that there is no operating system called Linux.
    Linux is in fact the operating system kernel, the core component of an OS. When
    talking about Linux, what we do, and others, are referring to one of the many
    distributions, or distros, which are one at least one of Ubuntu, Fedora, SUSE,
    Debian, Slack, the list goes on. Each of these distros offers something different
    for the user. While each has the Linux kernel at its core, they provide you with
    a different looking desktop environment, different software, different ways in
    which to change and get more apps installed and a slightly different look and
    feel throughout the entire system. However, the centre lies Linux, which is why
    we say Linux.


    Linux works considerably differently to Windows or macOS. It''s free for a start;
    free to install on as many computers as you like, free for an unlimited amount
    of time and free programs and applications. This free use is one of the biggest
    draws for the developers, as Linux can be customized as much as you want.


    Alongside the free use comes a level of freedom to customise and model the system
    to your own. Each of the available distros available on the Internet have a certain
    ''spin''


    Linux is a great operating system to start coding.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_7_0.png)'
