  md: "# USER ERROR\n\nUser input is often a paralysing mistake in code. For example,\
    \ when the user is supposed to enter a number for there and entered it into letters.\
    \ Often a user can enter so much into an input buffer that overflows, thus the\
    \ code crashing. Watch those user inputs and clearly state what are needed from\
    \ them.\n\n```\nEnter an integer number\nYou have entered wrong input\nYou have\
    \ entered wrong input\nYou have entered wrong input\nsdf221232123\n1322a2y3n2a2y239236\n\
    You have entered wrong input\nThe number is: 12\nProcess returned (0x0) execution\
    \ time : 21.49 s\nPress any key to continue.\n```\n\n# Common Coding Mistakes\n\
    \nAlways make a backup of your work, with a secondary backup for any changes you've\
    \ made. Mistakes can be rectified if there's a good backup in place to revert\
    \ to. It is much easier to start where you left off, rather than starting from\
    \ beginning again.\n\n# BACKUPS\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_144_0.png)\n\
    \n# RE-INVENTING THE WHEEL\n\nYou can spend days trying to fathom out a section\
    \ of code to achieve a given result and it is frustrating and time-consuming.\
    \ While it is rewarding to solve the problem, often the same code is out on the\
    \ Internet. Don't try and reinvent the wheel, look if someone else has done it\
    \ before.\n\n# SECURE DATA\n\nIf you're writing code to deal with usernames and\
    \ passwords, or other sensitive data, ensure the data is not cleartext. Learn\
    \ how to create a function to encrypt data before feeding into a routine that\
    \ can transmit or store where someone may be able to get it.\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_144_1.png)\n\
    \n```\nclass=\"hello-top-slider\">\n  <div class=\"slider-inner\">\n    <div class=\"\
    slider-slide active\">\n      <img src=\"path/to/image.jpg />\n    </div>\n  \
    \  <div class=\"slider-slide\">\n      <img src=\"path/to/image.jpg />\n    </div>\n\
    \  </div>\n</div>\n```\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_144_2.png)\n\
    \n# HELP!\n\nAsking for help is something most of us have struggled with in the\
    \ past. With the world we live in, we're likely asking for everyone's time! It's\
    \ a common mistake for someone to suffer in silence. As long as you ask in the\
    \ correct manner, obey any forum rules and be polite, your question isn't silly.\n\
    \n# MATHS\n\nIf you make multiple calculations then you need to ensure that the\
    \ maths is behind it. There are thousands of instances where programs have offered\
    \ incorrect data based on poor Mathematical, which can have disastrous effects\
    \ on what the code is set to do. In short, double check your equations.\n\n| Tag\
    \ Collections | Popular Tags |\n|---|---|\n| 12345 | 915,000 |\n| 56789 | 45,000\
    \ |\n| 10123 | 12,000 |\n\n```\nvar x = 3\nvar y = 5\nfunction sum(x, y, z) {\n\
    \  return x + y + z\n}\nconsole.log(sum(x, y, 10));\n```\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_144_3.png)\n\
    \n![](img/b810837b9059fc96b3c0bd60b035eb13_144_4.png)"
