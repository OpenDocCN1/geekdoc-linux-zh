  md: '# # How to Set Up Python in Linux


    While the Raspberry Pi''s operating system contains the latest, stable version
    of Python, other Linux distros dont come with Python 3 preinstalled. If you''re
    not going down the Pi route, then here''s how to check and install Python for
    Linux.


    # ## PYTHON VERSATILE


    Linux is such a versatile operating system that it''s difficult to nail down one
    way of doing something. Different distributions go about installing software in
    different ways, so we''re sticking with Linux Mint for this particular tutorial.


    +   STEP 1 First need to ascertain which version of Python is currently installed
    in your Linux system. To begin, drop into a Terminal from your desktop or hit
    the Ctrl+Alt+T keys.


    ```

    david@david-mint: ~$ python --version

    ```


    +   STEP 3 In our case we have both Python 2 and 3 installed; as long Python 3.x
    is installed, then it''s always worth checking to see if the distro has been updated
    with the latest versions, so enter: sudo apt-get update to update the system.


    ```

    david@david-mint: ~$ python --version

    Python 2.7.15

    david@david-mint: ~$ python3 --version

    Python 3.6.7

    david@david-mint: ~$ sudo apt-get update

    [password] for david:

    ```


    +   STEP 2 Next enter python --version in the Terminal. You should have the output
    showing version 2.x of Python in your display. By default, most Linux distros
    come with both Python 2 and 3, so there''s plenty of code left available for Python
    2. Now enter: python3 --version.


    +   STEP 4 Once the update and completes, enter python3 --version to see if it
    is installed or updated; as long as you have Python 3.x, you are running the most
    recent version. The numbers after the 3 indicate patches and further updates.
    If they''re uncertain, then check for new elements.


    ```

    david@david-mint: ~$ python --version

    Python 2.7.15

    david@david-mint: ~$ python3 --version

    Python 3.6.7

    david@david-mint: ~$ sudo apt-get update

    ```


