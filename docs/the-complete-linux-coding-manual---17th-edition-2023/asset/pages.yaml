  md: '# The Best Linux Distributions


    There are lots of versions of Linux available, known as Distributions. Each has
    a different ethos and approach. Here are five great distributions to try and where
    you can get them.


    # GOING LINUX


    The installation process for most distributions is similar. You download a disk
    image from the website and burn it to an optical disk or create a USB Flash Driver
    install. Just be careful to get the right distribution for your hardware and read
    the instructions carefully.


    # LINUX MINT


    By far the popular Linux distro (distribution) is Linux Mint. Mint began life
    in 2006, as an alternative to the then most popular distro, Ubuntu. Although based
    on Ubuntu''s Long Term Support build, Linux Mint took a different direction and
    offered the user a better experience.


    Linux Mint has three main desktop versions available with each new version of
    the core OS. This may sound confusing at first but it''s quite simple. Linux Mint
    uses the Cinnamon Desktop Environment as its flagship model, with two more models
    available.


    Cinnamon is a graphically rich desktop environment, MATE uses less fancy, and
    is more stable on a wider variety of desktop systems, and Xfce is an extremely
    streamlined environment that''s built for speed.


    Throughout this title we''ll be using the Cinnamon version; however, you can try
    any of the other desktop environments. In fact, I recommend that you spend some
    time trying different environments, and even different distros, to see which suits
    you and your computer best.


    ![](img/b810837b9059fc96b3c0bd60b035eb13_9_0.png)


    # UBUNTU


    ![](img/b810837b9059fc96b3c0bd60b035eb13_9_1.png)


    The most popular distro available is Ubuntu, which is an African word meaning
    ''humanity to others''. Ubuntu''s popularity has fluctuated over its fourteen
    year. At one time, it was the most used Linux-based system in the world with some
    choices we made regarding to its presentation, and some unfavorable, controversial
    decisions involving privacy, saw it topple from the number one spot.


    That, Ubuntu has made amends and is slowly its way back up the Linux leader. The
    latest versions of the GNOME 3 desktop environment, an impressive improvement,
    although it can be a bit confusing for former Windows users and is a little heavy
    on system if you''re planning on installing it on an older computer.


    Ubuntu, for all its faults, is a good Linux distro to start experimenting with.
    It''s a clean interface, easy to use and install offers the user a complete Linux
    experience.


    www.ubuntu.com


    Linux Coding & Programming'
