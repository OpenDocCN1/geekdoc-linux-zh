    \ Linux\n> type \"credits\" or \"license\" for more information.\nname = \"Vikings\"\
    \nage = 44\nprint(name)\nprint(age)\nprint(type(name))\nclass 'str'>\nprint(type(age))\n\
    class 'int'>\nDavid Howard Descended from Vikings is 44 years old.\nprint(name\
    \ + age)\nTraceback (most recent call last):\nFile \"test\", line 1, in <module>\n\
    \    print(name + age)\nTypeError: Can't convert 'int' to object str\n```\n\n\
    STEP 8\nThis presents a bit of a problem when you want to work with a task that's\
    \ been inputed by the user, as a string variable and an integer. In instance,\
    \ you need to:\n\nint(age) + 10\n\nThis will TypeCast: the age into an integer\
    \ that can be worked.\n\n```\nEdit Shell Debug Options Windows help\nPython 3.4.2\
    \ (default, Oct 19 2014, 13:31:11)\n[GCC 4.8.0] Linux\n> type \"credits\" or \"\
    license\" for more information.\nage = 44\nage = input(\"How old are you?\")\n\
    print(age + 10)\nclass 'str\nTraceback (most recent call last):\nFile \"test\"\
    , line 1, in <module>\n    print(age + 10)\nTypeError: Can't convert 'str' to\
    \ object int\nage = 10\n```\n\nSTEP 6\nThis is a process called Typecasting. The\
    \ code is:\n\nprint (\"is \" + str(age) + \" years old.\")\n\nor you can use:\n\
    \nprint (\"is \", age, \" years old.\")\n\nNotice that in the case, you don't\
    \ need the spaces between the words in quotes as the comma treat each argument\
    \ separately.\n\nSTEP 9\nThis is how Typecasting is used when dealing floating\
    \ point arithmetic: numbers that have a decimal point in them. For example, enter:\n\
    \nshirt=19.99\n\nNow enter type(shirt) and you'll see that Python has allocated\
    \ the number as a 'float', because the value contains a decimal.\n\n```\nEdit\
