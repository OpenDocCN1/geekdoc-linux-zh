  md: '# Install Apps via the Terminal - Part 1


    # STEP 5


    This adds the repo for app Variety Wallpaper Changer, Ubuntu-based app that works
    in Mint and changes the wallpaper automatically. Now that the repo is added, enter:
    `sudo apt-get update`, to update the new information and add contents of the repo
    to the package database.


    # STEP 6


    Now to install Variety, enter: `sudo apt-get install`. Press y to confirm and
    accept the installation, and once installed, you can type `variety` into the Terminal
    to run it.


    ```

    sudo add-apt-repository ppa:varietycloud/ppa

    sudo apt-get update

    sudo apt-get install variety


    Variety

    Variety is a simple, automatic wallpaper changer. It provides you with a variety
    of wallpapers.

    nsudo add-apt-repository ppa:varietycloud/ppa

    sudo apt-get install variety

    ```


