  md: '# # Creating and Removing Directories


    As with creating files in the Terminal, you can also create and delete directories,
    or folders if you need them. Directories form the structure of your file system,
    without logical directories the filing system would be in utter chaos.


    # ##ING FOLDERS


    Learning how to create and delete folders in the Terminal is an important Mint,
    and indeed Linux overall, skill to master. Here''s the basics for you to try out.


    +   STEP 1 If you open the Terminal enter cd ~ to make sure you''re in your own
    Home directory. Now enter ls to view the current folders you have housed in the
    Home directory. You''ll notice that folders are labelled in cyan (light blue).
    Let''s start creating a new directory. Enter `mkdir testdir`.


    +   STEP 3 If you were to enter the command again `mkdir testdir`, you''ll receive
    a message stating: **mkdir: cannot create directory ''testdir'': File exists.**
    without saying then, that you''re only able to have one unique named directory
    while the current directory. However, Linux is case-sensitive, so you have Testdir,
    testdir and so on.


    ```

    File Edit View Search Terminal Help

    david@david-mint $ ls

    Desktop  Documents  Downloads  Mfile Music Pictures Public Templates Test Siden
    V Videos

    david@david-mint $ mkdir testdir

    david@david-mint: $ ls

    ```


    ```

    File Edit View Search Terminal Help

    david@david-mint $ ls

    Desktop  Documents  Downloads  Mfile Music Pictures Public Templates Test Siden
    V Videos

    david@david-mint $ mkdir testdir

    david@david-mint: mkdir: cannot create directory ''testdir'': File exists.

    davidd@david-mint: $ ls

    ```


    +   STEP 2 If you now enter ls again, you''ll see that the new directory, testdir,
    has been created alongside the other directories in the Home directory. Obviously
    the command `mkdir` is what creates the directory, and doubt you''ve already guessed
    it stands for Make Directory.


    +   STEP 4 You can create directories within directories you''ve already created.
    For example, enter the testdir with `cd testdir/` by ls to see the folder structure.
    Naturally there''s nothing present, as you''ve just created it. Now back to Home
    with `cd -`, and enter `mkdir testdir/reports`. Go back to the testdir, testdir/
    and is again.


    ```

    File Edit View Search Terminal Help

    david@david-mint $ ls

    Desktop  Documents  Downloads  Mfile Music Pictures Public Templates Test Siden
    V Videos

    david@david-mint $ mkdir testdir

    david@david-mint $ cd testdir

    david@david-mint $ mkdir reports

    david@david-mint: $ ls

    david@david-mint: $ cd ..

    david@david-mint: $ ls

    ```


    ```

    File Edit View Search Terminal Help

    david@david-mint $ ls

    Desktop  Documents  Downloads  Mfile Music Pictures Public Templates Test Siden
    V Videos

    david@david-mint $ mkdir testdir

    david@david-mint $ cd testdir

    david@david-mint $ mkdir reports

    david@david-mint: $ ls

    david@david-mint: $ cd ..

    david@david-mint: $ ls

    ```'
