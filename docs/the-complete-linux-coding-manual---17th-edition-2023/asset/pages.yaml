  md: "# # Creating a File Using the Terminal\n\nUsing the Terminal, you're able to\
    \ create folders, files and even execute Linux Mint apps. In truth, if you didn't\
    \ have the GUI at hand, you could still accomplish the same from the Terminal.\n\
    \n# ## MORE Terminal WORK\n\nCreating content using the Terminal isn't quite as\
    \ strenuous as it may first appear. Yes, the Terminal can look a daunting place\
    \ for the newcomer, but once mastered it's really quite intuitive.\n\n+   **STEP\
    \ 1** Open up the Terminal, and make sure you're in the Home folder. If not use\
    \ the `cd` -command to return to the Home folder from wherever you're currently\n\
    \n```\n```\ndavidd-mint ~ $ cd ~\ndavidd-mint ~ $ \n```\n```\n\n+   **STEP 3**\
    \ Your command line should change to the Test Folder and if you enter `ls` (List\
    \ folders) then be nothing within the folder; as you've just created. The `mkdir`\
    \ command is fairly self-explanatory: Make Directory followed by the name of your\
    \ choosing.\n\n```\n```\ndavidd-mint ~ $ mkdir Test\ndavidd-mint ~ $ cd Test\n\
    davidd-mint Test ~ $ ls\ndavidd-mint Test ~ $ ls \n```\n```\n\n+   **STEP 2**\
    \ Let's start by creating a new folder within Home, and call it Test. The command\
    \ you'll need is `mkdir` Test. Press **Enter** to create the folder when you've\
    \ typed in the command, then `cd` Test and press **Enter**. This will change your\
    \ Directory (hence `CD`) to the newly created Test.\n\n+   **STEP 4** To create\
    \ an empty file, called **Test.txt**, enter in the Terminal: `touch Test.txt`.\
    \ You can now view the new file in the folder: Touch is a standard Linux command\
    \ that allows the creation of files without the need to open a text editor, save\
    \ the file, then close the editor.\n\n```\n```\ndavidd-mint ~ $ mkdir Test\ndavidd-mint\
    \ ~ $ cd Test\ndavidd-mint Test ~ $ ls\ndavidd-mint Test ~ $ touch Test.txt\n\
    davidd-mint Test ~ $ ls \n```\n```\n\n![](img/b810837b9059fc96b3c0bd60b035eb13_55_0.png)"
