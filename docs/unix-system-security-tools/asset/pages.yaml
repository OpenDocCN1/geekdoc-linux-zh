  md: 'To unpack files from a tarfile, run tar with the extract and verbose flags:
    tar xv yourartfile.Z If the archive is compressed (*tar.Z), run: tar xvZ yourartfile.tar.Z
    If the archive is gzipped, run: tar xz yourartfile.tar.gz


    Tip


    +   cpio—This SVR4 and GNU utility copies files into or out of a cpio or tar archive.
    It is comparable to tar.


    # Running Dump and Restore


    While cp and tar are useful for ad hoc backups, the dump command is more thorough—it
    takes any filesystem and copies (“dumps”) to backup media. It''s particularly
    useful for doing incremental backups. A canonical way to ensure backups is to
    run a “level 0” or full backup followed by regular, incremental backups—dump supports
    ten levels and will backup all files that have changed since the last dump of
    a lower level. Dump stores information about the backups that have already been
    run in the file /etc/dumpupdates.


    By default'
