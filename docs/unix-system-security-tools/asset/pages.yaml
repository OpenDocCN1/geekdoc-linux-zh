  md: '# Well-Known Port Numbers


    Protocol ports are abstractions that act as the logical end points of TCP/IP links.
    The “Well-Known Ports” are assigned by the Internet Assigned Numbers Authority
    (IANA) and can only be used by system (or root) processes or by programs executed
    by privileged users. They range from 0 to 1023. When possible, corresponding TCP
    and UDP services are assigned the same number.'
  merge: -1
  pgno: 382
- img_proc: true
  md: 'Ports can be security-sensitive because they sometimes provide an avenue of
    attack. Repeated attempts to connect to various ports via the Internet can be
    a sign of attempted intrusion. For more on ports, see "Protocol Ports" on page
