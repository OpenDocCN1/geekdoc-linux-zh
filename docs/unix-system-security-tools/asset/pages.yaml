    can be found at http://consult.cern.ch/writeup/security/security_3.html#SEC7


    While user education is an important element of any password security plan, it
    is not, in itself, sufficient protection. It may, for prove to be ineffective
    in an environment with high turnover. When even “expert” users may not appreciate
    how insecure their password choices are, educating an ever-changing population
    of novices may be too great a challenge. In the end, the sysadmin has a greater
    stake in strong passwords than any individual user. Strictly speaking, education
    is not an “enforcement” measure. Software safeguards will provide stronger protection.


