    # Rule 3: System Security Degrades in Direct Proportion to Use


    This is Farmer''s Law (promulgated by computer security researcher Dan Farmer):
    “The Security of a Computer System Degrades in Direct Proportion to the Amount
    of Use the System Receives.”22


    Ignoring availability for a moment, a computer that''s powered down is more secure
    than one that''s powered up. A computer''s powered down, in a locked cage, in
    a subterranean bomb shelter, with armed guards might be secure. Once one person
    is using a system, risk increases. Once two or more are using a system, risk increases
    even more. Put the system on the Internet and provide some services... I''m sure
    you get the idea. As Dan says, “Ignorant or malicious users do more damage to
    system security than any other factors.”23


    The trade-off between security and usefulness/functionality is the classic computer
    security dilemma. Many Linux distributions are built for maximum functionality
    and thus ship with massive collections of programs and wide-open security settings.
