    (see Rule 6: There''s Always Someone Out Smarter, More Knowledgeable, or Better-Equipped
    You) on page 24.


    Even worse, an attacker could run your password checking program or intercept
    the results. Even if protected, its mere presence on your system increases your
    risk. Finally, there''s no guarantee your users will cooperate when notified that
    their passwords are broken; the warning mail sent by Crack can be easily disregarded.


    If you run Crack, you may want to let users know that their passwords are being
    checked. This notice may act as a deterrent, particularly if repeat offenders
