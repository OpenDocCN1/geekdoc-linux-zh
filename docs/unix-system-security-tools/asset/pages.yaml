  md: '# Chapter 01 / Introduction


    While one can abide by the legal definition as embodied in the trademark, I believe
    that this does a major disservice to the industry. As the base software of the
    Internet, UNIX technology is one of the significant achievements of 20th century
    civilization. To restrict it to a narrow legal or technical definition—as formulated
    by some of the vendors without abandoning it—is to deny its ongoing relevance
    and importance, which is most evident in the amazing popularity and strength of
    UNIX-like clones such as GNU/Linux and BSD.


    For the purposes of the book, I define UNIX as


    +   A set of enabling technologies first developed at AT&T that have been incorporated
    into several legally distinct but closely operating systems, each of which can
    be considered to be a “UNIX system.” If it looks like UNIX, operates like UNIX,
    runs common UNIX utilities and programs, and is developed with UNIX as a model,
    it''s UNIX.


    # The Many Flavors of UNIX


    Table 1.1 summarizes some of the common UNIX variants and clones. While the table
    lists isn''t nearly as diverse as the UNIX world is. Some of them are defunct
    and are listed for historical purposes. Others are on their way. In some cases,
    vendors have defected to Microsoft technology. In others, mergers and acquisitions
    have led to the consolidation of different UNIX implementations. A list of “dead”
    UNIX implementations would be substantial indeed, consisting of hundreds of variations
    on the letters “U,” “I,” and “X” (CLIX, CR/UX, MV/UX, SINIX, UNIX, etc.).


    Table 1.1 UNIX Variants and Clones

    | UNIX Variant | Company/Org. | For More Info |

    |---|---|---|

    | A/UX | Apple Computer, Inc. | defunct |

    | AIX | IBM | http://www.rs6000.ibm.com/software/ |

    | AT&T System V | AT&T | defunct |'
