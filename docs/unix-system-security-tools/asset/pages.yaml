    # Verifying Software


    One of the paradoxes of this book is that it advocates both strong UNIX system
    security and the security of freely-available security tools. As I point out in
    the Introduction, trust is a relative concept (page 28). Any tool or program you
    download from the Internet or receive from some other untrusted source could harm
    or subvert the security of your system.


    There are really two problems here: Can you trust the author and source of the
    program? Assuming the answer is yes, here''s a second question: can you trust
    that the program you download is actually the one the author wrote?


    While ultimately you can''t trust anything you didn''t code yourself (and you
    might not even trust your own secure programming skills), there are reputable
    programs, programmers, security firms, and security sites (and reputable books,
    too). While it''s possible for a security expert who''s been years or decades
    building a solid reputation to go bad, it''s an unlikely scenario. Furthermore,
    the open-approach acts as a safety net—word that a program contains hostile code
    or features will most likely get out sooner or


