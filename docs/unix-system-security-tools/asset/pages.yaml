    # Telnet


    Telnet is a standard for logging into a remote host over the Internet. It provides
    a general purpose, bi-directional communications facility that allows a local
    terminal program to interact and synchronize with a remote terminal "server" process.
    Telnet is built around the concept of a "Network Virtual Terminal”—an imaginary
    device which provides a network-wide, intermediate representation of a canonical
    terminal, thus freeing users and server processes from having to worry about the
    characteristics of each other''s terminals and terminal handling conventions.


    The UNIX implementation of the Telnet protocol is divided into the telnet client
    and the telnetd server. By convention, telnetd listens on TCP port 23.


    > Like FTP, Telnet has been around for a long time. There are dozens of RFC documents
    primarily concerned with Telnet. The first was drafted by Jon Postel and Joyce
    Reynolds for RFC 854. See http://www.faqs.org/rfc/rfc854.html


    Telnet presents some glaring security problems. Since it sends information in
    the clear, it is vulnerable to packet sniffing. An attacker can capture the username/password
    combinations used to start telnet sessions. Telnet can also be hijacked—once a
    user is logged in, an attacker can take control of the session.


