    Table 9.1 summarizes the options that can be used when running-Swatch.


    # Table 9.1 Swatch Options


    | Option | Description |

    | - | - |

    | -t filename | Actively monitor messages as they are written to filename |

    | -f filename | Make a single pass through the named file |

    | -p program_name | Examine input piped in from the named program |

    | -c filename | Use filename as the configuration file |

    | -r restart_time | Automatically restart at restart_time, which can be represented
