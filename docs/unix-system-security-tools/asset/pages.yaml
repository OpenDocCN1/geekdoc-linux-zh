  md: '+   RSA—this leading public-key cipher was developed by Ron Rivest, Adi Shamir,
    and Leonard Adleman. It is widely used to protect Internet communications. RSA
    Data Security''s patent is due to expire in September 2000 (see the footnote on
    page 320).


    # One-Way Hash Functions


    One-way hash functions process a message of arbitrary length and return a fixed-length
    hash value (say, 128 bits). In particular, they are difficult to reverse—given
    a hash value, it should be hard to compute the message it was generated from.
    In addition, it should be extremely hard to find two random messages that hash
    to the same value.


    We''ve already seen how a one-way hash function is used to store user passwords.
    This kind of function has other security uses as well. Like virtual fingerprints,
    they can be used to validate the integrity of messages and files. So-called “message
    digest” algorithms can be used to verify the integrity of documents that are distributed
    over insecure networks. Take an arbitrary document and calculate it, say, MD5
    hash value. Send the document along with its MD5 hash value to someone else. The
    receiving party can then take the document, run MD5, and check the result against
    the hash value you derived. If the two hash values match, your recipient can be
    confident that the document was not accidentally damaged or altered in transit.


    The same process can be used with system and user files—a hash value or message
    digest match can ensure that your files haven''t been deliberately tampered with.
    If information about a critical system file is hashed today, tomorrow''s hash
    should match. Given crackers'' propensity for “rootkitting” systems—installing
    altered system binaries to facilitate future access—systematic integrity checks
    using message digest algorithms or one-way hash functions can be an an important
    detection safeguard. While it''s preferable to deter an attack, if your effort
    fails, you want to know about it as soon as possible.'
