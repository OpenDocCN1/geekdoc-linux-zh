  md: '# Security Planning


    Sound security management starts with a reasoned plan. This chapter covers the
    essential steps in security planning. It helps you to identify the information
    and system assets that need protection, size up the threats those assets face,
    perform a cost-benefit analysis, and develop a security policy that you’ll need
    before you can start implementing security measures. In order to provide additional
    context for planning, I present a UNIX security model for defense-in-depth. This
    chapter also touches on key people topics such as user education and system administration
    ethics.


    31'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'Security is a process that starts with planning. While it may be possible to
    manage UNIX system security without a plan in place, such a nonchalant course
    is likely to lead to a disaster sooner or later. Good security planning, in turn,
    formalizes a defensive strategy, which, forms the basis for a security policy.
    Think of a security plan and an accompanying security policy as the roots of all
    other security efforts.


    A security plan can be specified in a formal document, drafted by a committee,
    or expressed as a simple set of strategies that you base your security tactics
    on. If you work for a large organization, some form of plan is almost certainly
    already in place. If you work for a start-up or an organization connecting to
    the Internet for the first time, you may need to develop a security plan and policy
    from scratch.


    The first step in developing a security policy and plan is to conduct a security
    review that focuses on analyzing the threats a site or installation faces. A security
    review should include a risk assessment that answers questions like: What are
    the system and information resources that need to be protected? How much are the
    data on your systems and system uptime? What are the threats that confront your
    systems? How probable are they? How expensive are the time and tools required
    to adequately defend the systems?


    A risk assessment provides fodder for a cost-benefit analysis. Perfect security
    is theoretically possible, but carries a price that no one can pay. In the real
    world, the potential costs of insecurity are weighed against the costs of security
    safeguards and procedures. Once an organization has performed a risk assessment
    and cost analysis, it can begin to formulate both security policy and a plan for
    implementing security based on the policy.


    # Risk Assessment


    Risk assessment requires that you determine four things: 1) what you need to protect,
    2) what it''s worth, 3) what you need to protect it from, and 4) how it can be
    protected. You need to identify your assets, identify the threats, and identify
    the resources needed to minimize the threat in a cost effective manner.'
