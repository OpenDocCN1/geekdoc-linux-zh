    you own the machine, you’re free to run Crack. On the other hand, be careful about
    running it on someone else’s systems (owned by your employer, university, ISP,
    client, etc.) without written permission.


    > Password cracking without explicit authorization may be considered a hostile
    activity. It may even be illegal in some jurisdictions.


    Caution


    One prominent consultant ran Crack on a client’s system in order to assess system
    security. He was caught, tried, convicted, and sentenced to five years of probation,
    480 hours of community service, 90 days of deferred jail time, and a $68,000 fine
    for his efforts.³


    Crack doesn’t actually “crack”—as in “decrypt”—the hashed UNIX passwords in the
    *passed* file. When Crack is invoked, it first creates a set of dictionaries from
    simple word lists that contain one word per line. One dictionary is compiled directly
    from words contained in the password file (like usernames). Another is compiled
    from permutations of usernames contained in the password file—“Joe User” becomes
    JUser, JoeU, resuej, etc. Other dictionaries are compiled from the word lists
    that either come with or be added by the user. A stream of permutated guesses
    are generated by applying mangling rules to the dictionaries—these might force
    words to all uppercase or lowercase, make them plural, reverse the order of characters,
    substitute the number “3” for the letter “E,” etc. Crack then encrypts the permutated
    guesses—using the system’s password hashing algorithm—and compares them against
    the hashed passwords in /etc/passwd. A separate script produces a readable report
    in plain or HTML format.


    Crack can be computationally expensive. The program includes several provisions
    for making the computation requirements easier to manage. It can be set to run
    only during off-hours, for example. It can be “niced” so it runs as a background
    process. It can also be


