    # NFS


    The Network File System (NFS) allows users to access files and programs across
    a network (usually a LAN). On an NFS-enabled client, a user can work with files
    that reside on a variety of servers, server architectures, and across a variety
    of operating systems—the remote files appear to be part of the local filesystem.
    NFS is ubiquitous—it has been implemented on almost all versions of UNIX in addition
    to the Apple Macintosh, Windows, MS-DOS, OS/2, and VMS. Client file requests are
    converted to NFS protocol requests, and are sent to the server system over the
    network. The server receives the request, performs the actual file system operation,
    and then sends a response back to the client.


    Promulgated by Sun Microsystems, NFS enables file systems to be exported by a
    server and imported by clients in a “stateless” effort way. It handles the creation
