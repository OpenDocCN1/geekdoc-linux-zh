  md: '# UNIX: A Practical Definition


    of his first name and Minux, pronounced lynn-nucks. By 1994, Linus and a far-flung
    team of kernel hackers were able to release version 1.0 of Linux. Linus and friends
    had a free kernel; Stallman and friends had the rest of a free UNIX clone system:
    People could put the Linux kernel together with GNU to make a complete free system.
    This system is known as “Linux,” though Stallman prefers the appellation “GNU/Linux
    system.” There are several distinct GNU/Linux distributions: some are available
    with commercial support from companies like Red Hat, Caldera Systems, and S.U.S.E.;
    others, like Debian GNU/Linux, are more closely aligned with the original free
    software concept.


    The spread of Linux, now up to kernel version 2.2, has been a startling phenomenon.
    Linux runs on several different chip architectures and has been adopted or supported
    to varying extents by several old-line UNIX vendors like Hewlett-Packard, Silicon
    Graphics, and Sun Microsystems, by PC vendors like Compaq and Dell, and by major
    software vendors like Oracle and IBM. Perhaps the most delicious irony is the
    response of Microsoft, which acknowledges the competitive threat of ubiquitous
    free software but seems unwilling or unable to respond with open-source software
    of its own.


    Microsoft has, however, struck blows with Windows NT (Windows 2000). During the
    late 1990s, vendor after vendor has abandoned the UNIX server platform in favor
    of Windows NT or wavered in their support. Silicon Graphics Inc., for example,
    has decided that Intel hardware and NT is the graphics platform of the future.


    # A Practical Definition


    The phenomenon of old-line UNIX vendors jumping ship and the concurrent run to
    Linux by vendors large and small bring us back to the question at the top of this
    section: What is UNIX?


