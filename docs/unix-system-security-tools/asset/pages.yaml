- img_proc: true
  md: '# Mounting the CD-ROM


    Before you can access the files, you may need to mount the CD-ROM using the mount
    command. This command usually takes the form:


    ```

    # mount CD-ROM_device mount_point

    ```


    The CD-ROM device varies depending on the system you’re using. In Linux, it may
    be /dev/cdrom. The mount point is the parent directory of the CD-ROM once it is
    mounted. The directories /cdrom or /mnt/cdrom would be conventional mount points.
    An example command under Linux might look like:


    ```

    # /bin/mount -r /dev/cdrom cdrom

    ```


    The “r” flag indicates a read-only filesystem (“synonymous). Check your system’s
    man page for mount for more details (man mount). It’s possible that your system
    is configured to auto-CD-ROMs. It’s also possible that you may need to be root
    in order to run the mount command.


    # Tips on the Tools


    Keep a few things in mind while working with the enclosed tools.


    +   The files for each tool are stored in a top-level directory (i.e., the files
    for the COPS tool are in the /cps directory).


    +   Most tools have a README file—read it first.


    +   The files for most of the tools are tarred and either compressed (.tar.Z)
    or gzipped (.tar.gz) with GNU zip (gzip). Most systems support these formats;
    for those that don’t, GNU zip is included on the accompanying CD-ROM. When available,
    RPM versions for Linux i386 are included.


    +   Some of the tar files are signed by the author with a PGP key. Others included
    MD5 checksums. If feasible, verify the packages—See “Verifying Software” on page
    133.


    +   Most of the tools are in source form. That means you need to compile and install
    them. Most of the packages include a'
