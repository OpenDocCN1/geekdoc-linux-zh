    # A UNIX Security Model


    Security is a very old science that has been studied for centuries. The principles
    of computer security are derived from the traditional principles of defense.


    There are three traditional approaches to the defense of systems: dispersion,
    designed to minimize losses; redundancy, designed to ensure the system operates
    despite damage to an individual part; and defense in depth, designed to make the
    attacker overcome a series of barriers before he can damage a vital part of the
    system.


    Dispersion can be an effective defense against both accidental and deliberate
    damage. When dispersion is effectively implemented, total destruction requires
    coordinated, multiple attacks—no single attack can destroy the entire system.
    The design of the Internet is a classic example of defense by dispersion. In the
    early 1960s, a series of incidents disrupted military communications. Researcher
    Paul Baran proposed that military command-and-control communications be dispersed
    throughout a distributed communications network so that the failure of any single
    relay or site


