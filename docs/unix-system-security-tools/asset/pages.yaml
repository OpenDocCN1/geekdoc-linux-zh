  md: '# Configuring Crack


    manual has several tips and potential workarounds. On a Red Hat Linux system,
    the default settings “just work.”


    > Tip If you''re running Red Hat Linux, you may need to double-back to Alex''s
    site and download a replacement for the file src/util/Makefile. The replacement
    file is c50-linux-util-makefile.txt. If you''re running Netscape Navigator, don''t
    just copy and paste (this can affect the file''s formatting)—use the “Save As”
    command.


    If you''re running Red Hat Linux, you''re ready to compile the source code. If
    you''re not, you may have some tweaking to do, depending on the platform you''re
    running and the password algorithm over your system uses. The manual contains
    many pointers on how to get things ready.

    From the Crack directory, issue the command


    ```

    # ./Crack -makeonly

    ```


    This will build the binaries and store them in the run/bin directory.


    # Configuring Crack


    If you''re going to run Crack over a network, you will need to build Crack from
    source on each machine.


    If your system uses shadow passwords, you will need to merge your hashed passwords
    and your /etc/passwd file back into an equivalent of the old style /etc/passwd
    file. This can be done manually or via a script provided in the scripts directory.
    The script shadmgr.sv is designed for System V systems, but works fine on shadowed
    Red Hat Linux boxed. To create a merged file called shadow4crack in the Crack
    directory, run a command like this:


    ```

    # bsh shadmgr.sv > ../shadow4crack

    ```


    For many situations, the default word lists shipped with Crack will be sufficient.
    You can provide additional word lists (say, from the Oxford site cited above,
    or your own) adding them to the dict directory. This may be appropriate for systems
    used by speakers of a language not included by default (e.g., Swahili, for example).'
