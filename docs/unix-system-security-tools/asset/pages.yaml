    Linux, for example, use PAM (Pluggable Authentication Modules), a flexible mechanism
    for systematically improving authentication (“PAM” on page 84). There are also
    authentication mechanisms designed to increase the security of passwords as they
    travel across networks. One-time passwords do this quite effectively—if a password
    is only used once, it doesn''t matter if it''s intercepted or guessed (see “One-Time
    Passwords” on page 81). Kerberos is another network authentication solution (see
    “Kerberos” on page 94).


    # Managing Accounts


    Maintaining account security requires careful management of both system and user
    accounts. In addition to the password security measures discussed above, you need
    to consider how usernames are set up. Some accounts require special handling,
    including default accounts included with the system (root in particular) and shared
    accounts. In some situations, it may be desirable to set up special account controls
    or restricted environments.


    # Usernames


    Usernames consist of one and eight letters and numbers. Most sites require usernames
    longer than three characters since short usernames can cause confusion. Some versions
    of UNIX have difficulty with usernames that contain punctuation or control characters:
    use of punctuation in usernames is often discouraged.


    Usernames are important because of their many uses. A username is not only an
    identifier used to access a specific system. It''s also a public persona, doubling
    as an email address and printed on business cards, etc. Many large sites use a
    consistent scheme for'
