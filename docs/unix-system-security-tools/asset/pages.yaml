    # Types of Firewalls


    Over the past several years, many types of firewalls have evolved. They can be
    roughly categorized as either network-level firewalls or application-level firewalls,
    though the distinction between the two gets weaker as firewall technologies are
    mixed and matched in the marketplace.


    # Network-level Firewalls


    A basic instance of a network-level firewall is a single router that sits between
    the Internet and an internal network and filters individual packets based on their
    source, destination addresses and ports. A packet-filtering router (known as a
    “choke” in firewall lingo) can be deployed in a variety of ways to block connections
    from or to specific hosts or networks, and by connections to


    +   4. From a Birds of a Feather meeting noted at http://cs.purdue.edu/coast/firewalls/firewalls_bof_95.txt

    5. Ibid.'
  merge: -1
  pgno: 347
- img_proc: true
  md: '# Classic Firewall Configurations


    specific ports. A site might wish to block connections from hostile or untrustworthy
    addresses, or it may block connections from all external addresses with an exception
    for SMTP so that mail can be exchanged with the outside.


    Network-level firewalls tend to be fast and transparent to users. They can be
    relatively easy to set up and cheap, and they can be programmed with straightforward
    rules like “block packets for unused services” or “allow incoming TCP connections
    to information servers but no other internal hosts.” They are also flexible. Say
    someone on subnet 123.4.5.0 is attacking one of your hosts: you can configure
    a network-level firewall to block all access from that subnet.


    Packet-filtering routers have some potential weaknesses, however. Older routers
    do not support extensive logging—your first sign of misconfiguration could be
    a break-in. Packet-filtering rules can also be complex to specify—filter rulesets
    can get convoluted that holes may be hard to detect.


    # Application Gateways


    A common way to overcome some of the weaknesses of packet filtering is to deploy
    an application-level firewall, a host that runs proxy services—software applications
    that forward and filter connections for services such as Telnet and FTP. The host
    running the proxy service is referred to as an “application gateway” or a “baseline
    host.” It can be combined with a packet-filtering router to provide better security
    and flexibility than if either were used alone.


    # Classic Firewall Configurations


    # Packet-filtering Firewall


    This is probably the simplest firewall configuration. You install a packet-filtering
    router at the Internet gateway and then configure the router’s packet-filtering
    in order to selectively block, or “filter,” protocols and addresses. Internal
    systems may have direct access to'
  merge: -1
  pgno: 348
- img_proc: true
  md: '330 / Chapter 16 / Firewalls


    the Internet while all or most access to internal systems from the Internet is
    blocked, depending on the policy.


    ![](img/1a7ecd5e8d14f7d50a9df943b7efac99_349_0.png)


    **Figure 16.1** A Packet-filtering Firewall


    # **Dual-Homed Host**


    Superior to the packet-filtering firewall in many ways, the dual-homed host (also
    known as a “dual-homed gateway”) is a simple configuration that is relatively
    easy to implement and offers good security. Many early Internet firewalls were
    built around a simple UNIX host configured as a “bastion host”—a host that acts
    as an application forwarder, traffic logger, and service provider. Naturally,
    a bastion host must be as secure as possible since it’s the focal point for attack
    on the network.


    A dual-homed host has two network interfaces—one connected to the internal network
    and one connected to the Internet. The host blocks all traffic passing through
    it and runs proxy services. In order to work properly, the computer must never
    forward packets directly from one interface to the other. This can be set up on
    many UNIX systems by setting the kernel variable ip_forwarding to zero (i.e.,
    off).


    This kind of firewall offers a greater degree of security than a packet-filtering
    firewall since it achieves a total block and conforms to the default deny policy.
    All services are denied unless they are specifically permitted, since no services
    pass except those for which proxies exist.


    ![](img/1a7ecd5e8d14f7d50a9df943b7efac99_349_1.png)


    **Figure 16.2** A Dual-homed Host Firewall'
  merge: -1
  pgno: 349
- img_proc: true
  md: '# Classic Firewall Configurations


    # Screened Host


    In a screened host firewall, access to and from a single bastion host is controlled
    by means of a router with some form of packet-screening capability to block off
    access between the protected network and the Internet. Traffic is permitted only
    to the bastion host, which runs proxy software similar to what would run on a
    dual-homed gateway.


    Screened host gateways are flexible. They offer the opportunity to selectively
    permit traffic through the screened router for applications that are considered
    trustworthy, or between mutually trusted networks. The disadvantage of this configuration
    is that there are now two security critical systems to be aware of: the bastion
    host and the router.


    ![](img/1a7ecd5e8d14f7d50a9df943b7efac99_350_0.png)


    Figure 16.3 A Screened Host Firewall


    # Screened Subnet


    In a screened subnet firewall, a small isolated network is placed between the
    internal network and the Internet. Two routers are used to create an inner, screened
    subnet—the “DMZ” (Demilitarized Zone). The DMZ houses the bastion host as well
    as information servers, modem pools, and other systems that require controlled
    access. Access to the DMZ subnet is protected by screening rules in the routers,
    which restrict traffic so that hosts on the subnet are the only systems reachable
    by both the internal network and the Internet.


    The screened subnet firewall is a variation of the dual-homed gateway and screened
    host firewalls. The DMZ makes it very difficult for an outsider to direct traffic
    at the hidden private network.'
  merge: -1
  pgno: 350
- img_proc: true
  md: 'If the routing is blocked, then, as with a dual-homed gateway, all traffic
    must pass through an application on the bastion host.


    ![](img/1a7ecd5e8d14f7d50a9df943b7efac99_351_0.png)


    Figure 16.4 A Screened Subnet Firewall


    # Firewall Planning


    Traditionally, many organizations have “rolled their own” fire-walls, using UNIX
    hosts and routers. In the past few years, firewall capabilities have been built
    into many UNIX implementations and a wide variety of both free and commercial
    firewall toolkits have become available. Additionally, it is possible for an organization
    to outsource firewall services: a large number of Internet Service Providers and
    other service organizations provide monitored firewall services.


    # Risk Assessment


    All computer security planning starts with a risk assessment: what am I trying
    to protect and what are the risks? Unfortunately, the risks are substantial when
    connecting a private network to the Internet or to any untrusted networks. If
    you’re connecting systems to the Internet, their security will be probed, even
    if you perceive that “there’s nothing of value” for anyone to steal. Many small-time
    home LAN operators have been surprised to find their Linux boxes on the receiving
    end of rootkit exploits: they can find their desperate calls for help on the comp.security.unix
    newsgroup. At the other end of the spectrum, serious ecommerce companies view'
  merge: -1
  pgno: 351
- img_proc: true
  md: '# Firewall Planning


    firewall implementation as a mission-critical part of preserving the

    trust online customers demonstrate with each order.


    # Policies


    You must adopt high-level policies outlining the services that the

    firewall will support and specifying the choice for default deny or

    default permit. You should also integrate firewall policy into the

    overall site security policy.


    # Personnel


    In all but the smallest installations, firewall administration is a full-

    time job. There is no replacement for trained, full-time system

    administrators who are available to monitor performance, upgrade

    systems, apply bug fixes and patches, and otherwise make sure that

    systems are secure and protected from intruders. A poorly-main-

    tained firewall may be worse than no firewall at all since it may

    permit break-ins while providing an illusion that the site is still

    secure. A site''s security policy should clearly reflect the importance

    of strong firewall administration.


    A firewall is not an excuse to pay less attention to system

    administration. It is, in fact, the opposite: if a firewall is penetrated,

    poorly administered site could be wide-open to intrusions and

    resultant damage. A firewall in no way reduces the need for highly

    skilled system administration.


    # Budget


    At the high-end, it can cost hundreds of thousands of dollars to

    install and configure firewalls across an entire corporation. At the

    low-end, an old PC running Linux can do it for free. Be sure to fac-

    tor in maintenance costs: even that freebie firewall will need ongoing-

    itoring and upgrades.


    # Minimum Requirements


    Once you''ve established policy, analyzed risk, and accounted for

    costs, you are ready to develop a set of design requirements for

    your firewall system. Following is a list of possible requirements

    extracted from the NIST publication, "Keeping Your Site Com-

    fortably Secure: An Introduction to Internet Firewalls.\”


    +   6. John P. Wack and Lisa J. Carnahan, NIST Special Publication 800-10. See
    http://csrc.nist.gov/nistpubs/800-10/'
  merge: -1
