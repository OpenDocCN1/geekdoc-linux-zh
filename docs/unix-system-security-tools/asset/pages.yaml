  md: '# A Sample COPS Report


    COPS'' reports are fairly straightforward and verbose. I ran COPS on an older
    system—a PC running Nextstep 3.3²—and was surprised at the number of vulnerabilities
    the program found. The report output below illustrates COPS'' major checks.


    Permissions Checking

    COPS will look for permission problems, one of the banes of UNIX system security.
    Directories that are world-writable can be particularly hazardous, especially
    if they''re in root''s path (the root user could execute a malicious program planted
    in such a directory).


    COPS found serious problems:


    +   Warning! Directory /LocalApps is _World_ writable and in roots path!

    Warning! Directory /NextDeveloper/Demos is _World_writable and in roots path!

    Warning! / is _World_ writable!

    Warning! /usr/spool/mail is _World_ writable!

    Warning! /usr/lib/crontab is _World_ readable!


    The program flagged the fact that sysadmin made the LocalApps directory world-writable.
    While this allows any user to install programs there, this configuration is unnecessary
    in this case and should be fixed (users should install programs in their home
    directories; programs that need to be shared should be installed by the sysadmin).


    Next, COPS found additional permissions problems.


    +   Warning! User root''s home directory / is mode 01777!

    Warning! User ucp''s home directory /usr/spool/uucpublic is mode 07771!

    Warning! User me''s home directory /me is mode 07777!


    These are all default conditions for this version of UNIX. The liberal permissions
    setting on root''s home directory is troubling.


    +   Nextstep has been updated over the years and renamed Openstep, Rhapsody, and
    now Mac OS X Server—see http://www.apple.com/macosx/server/'
  merge: -1
