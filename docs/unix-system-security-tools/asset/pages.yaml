    > If you don''t like last.com—or if it runs slowly on your system—try the spar
    tool. See "spar" on page 194.


    # The sa Command


    One problem with process accounting is that the pacct file can grow very quickly.
    Before long, it will consume hundreds of megabytes on a busy system. You need
    to run the sa command either interactively or via the cron mechanism to keep logging
    data from overwhelming your system.


    The sa command reports on, cleans up, and generally maintains the process accounting
    file. It is able to codense the information in var/log/pacct into the summary
    files /var/log/savacct and var/log/usract These summaries contain system statistics
    per command name and username—by default, sa reads them before and in addition
    to the pacct file so that its reports include all available information.


    The output of sa is a bit difficult to decipher. The following items are labelled:


    +   * avio—Average number of I/O operations per execution

    * cp—Sum of user and system time, in minutes

    * cpu—Same as cp

    * k—CPU-time averaged core usage, in 1k units

    * k*sec—CPU storage integral, in 1k-core seconds

    * re—Real time, in minutes

    * s—System time, in minutes

    * tio—Total number of I/O operations

    * u—User time, in minutes


    The example sa output below was taken from a busy BSD-based mail server.


    ```

    # sa

    > sa

    9853 196076.40re 0.01cp 15avio 0k

    ```'
