    # TCP/IP Ports for TLS/SSL


    In theory, TLS/SSL can transparently secure any TCP-based protocol running on
    any port if both sides know the other side is using TLS/SSL. For practical reasons,
    separate port numbers have been reserved for each of the protocols that can be
    secured by TLS/SSL, thus permitting packet filtering firewalls to allow such secure
    traffic through.


    Table 15.1 summarizes the SSL port numbers that have been reserved by the Internet
    Assigned Numbers Authority (IANA). While many of the secured versions of common
    net protocols are not in wide use, they are likely to be deployed in the coming
