    # A Practical Definition


    In the spirit of practicality, I like the straightforward definition promulgated
    by Simson Garfinkel and Gene Spafford in Practical UNIX & Internet Security: “A
    computer is secure if you can depend on it and its software to behave as you expect.”¹11
    In essence, a computer is secure if you can trust it. Data entered today will
    still be there tomorrow in unaltered form. If you made services x, y, and z available
    yesterday, they’re available today.


    I also like the practical definition offered by Tomas Olovsson, which is a narrow
    bit: “A secure system is a system on which enough trust can be put to use it together
    with sensitive information.”¹12


    Intrinsically, a secure system should be hard for unauthorized persons to break
    into—i.e., the value of the work necessary for an unauthorized person to break
    in should exceed the value of the protected data. Increasing attacker workload
    and the risks of detection are critical elements of computer security.


    For the purposes of this book, I define “system security” as:


    The ongoing and redundant implementation of protections for the confidentiality
    and integrity of information and system resources so that an unauthorized user
    has to spend an unacceptable amount of time or money or absorb too much risk in
    order to defeat it, with the ultimate goal that the system can be trusted with
    sensitive information.


