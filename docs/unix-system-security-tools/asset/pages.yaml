- img_proc: true
  md: '# Introduction


    Tripwire is a integrity checking tool designed to monitor filesystems for unauthorized
    modification. It''s particularly useful for detecting intruders who might change
    files in order to facilitate future access; remove or alter system log; leave
    viruses, worms and logic bombs; or otherwise wreak havoc.


    Most UNIX distributions are huge and include tens of files. There is no practical
    way for an individual to manually monitor system for unauthorized changes. Tripwire
    works by taking mathematical “snapshots” or fingerprints of files and storing
    them in a database. Later, it compares the files'' current snapshots against the
    original snapshots. Files that have been added, deleted, or changed are flagged
    by Tripwire, enabling sysadmins to take appropriate measures. Given proper installation,
    configuration, and monitoring, sysadmins can be quite sure that their “tripwired”
    systems have not been hacked.


    Not only is Tripwire invaluable for detecting intrusions, it can be a major time-saver
    when recovering from a break-in. Say you suspect that an unauthorized user has
    gained root access. The perpetrator could easily leave a Trojan Horse or virus
    behind. This would be very difficult to detect by manual inspection of the 40,000+
    files in a bare UNIX system. If you''ve installed Tripwire, however, you can easily
    check that your critical files have not been tampered with. If you don''t have
    an integrity checker like Tripwire, you''re really left with no choice but to
    re-install your system from scratch—a time-consuming and possibly unnecessary
    task.


    # Tripwire Overview


    # Benefits of Tripwire


    Tripwire is one of the most useful and elegant tools in the UNIX security canon.
    Developed by Eugene Spafford and Gene Kim at Purdue University in 1992, the package
    was commercialized in 1998 and is now maintained by Tripwire Security Inc. (http://www.tripwiresecurity.com).
    The company supports both commercial and free versions of the package that will
    run on most UNIX systems.'
  merge: -1
  pgno: 171
- img_proc: true
  md: '# Tripwire Overview


    Tripwire embodies the best attributes of a good security tool. It''s tamper-proof,
    portable between platforms, configurable, scalable, and self-contained.


    +   * Portable—The authors recognized that the UNIX world is diverse and those
    designed the program for maximum portability across various UNIX platforms. The
    program supports dozens of UNIX variants. The databases Tripwire produces are
    encoded as ASCII text that can be manipulated with text processing tools or printed.


    +   * Configurable—Tripwire can monitor changes to file permissions, modification
    times, and other file parameters on a per or per directory basis. It can be configured
    to ignore specified files and directories, or to check a directory but not recur
    into it.


    +   * Scalable—Tripwire can be set up to cover thousands of machines from a single
    installation. The package includes a pre-processing layer that helps sysadmins
    re-use configuration files—identically-configured machines can share a configuration
    file while a unique database file is generated for each unique machine.


    +   1. The authors of Tripwire tested over 250,000 files on five computers for
    duplicate signatures. The 16-bit CRC produced approximately 25,000 collisions,
    MD4, MD5, and Snefru produced none. See the design document, "The Design and Implementation
    of Tripwire" by Gene H. Kim and Eugene H.affafford.'
  merge: -1
  pgno: 172
- img_proc: true
  md: '• Self-contained—Tripwire’s operations don''t rely on external programs. Not
    only would additional programs be time-con-suming to install, but they could present
    additional security risks.


    # Summary of Operation


    Figure 7.1 sketches out how Tripwire uses two input files—a con-figuration file
    (tw.config) describing which directories and files to monitor and a baseline database
    of signatures—to generate a detailed report on alterations.


    ![](img/1a7ecd5e8d14f7d50a9df943b7efac99_173_0.png)


    **Figure 7.1 Tripwire’s Basic Operations\**


    When you first run Tripwire, the program creates the baseline database of signatures.
    The next time you run it, it uses the tw.config file to generate a new database
    of signatures. It then compares the two databases, applies any selection masks
    that you specified (so that constantly changing files are excluded), and spits
    out a report that you can read on a terminal, send by email, or print. Tripwire
    has four modes of operation: Database Generation, Integrity Checking, Database
    Update, and Interactive Update.


    +   2. This diagram is roughly based on one that appears in the design document,
    “The Design and Implementation of Tripwire” by Gene H. Kim and Eugene H. Spafford.'
