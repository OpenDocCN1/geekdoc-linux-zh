  md: '# UUCP


    is still shipped with UNIX and with Linux. A few pointers are in order.


    There are three versions of UUCP: Version 2, the original that was produced at
    AT&T in 1977; HoneyDanBer, also known as BNU (Basic Networking Utilities); and
    Taylor, written by Ian Lance Taylor. Most Linux distributions run Taylor UUCP,
