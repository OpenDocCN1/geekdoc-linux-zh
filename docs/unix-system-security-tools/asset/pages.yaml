  md: '# Swatch


    UNIX log files provide an avalanche of information. The Swatch tool can be used
    to reduce the plethora of log records to actionable items. It monitors syslog
    messages as they’re written to log files and takes pre-configured actions (e.g.,
    call my pager number) in response to patterns (e.g., evidence that someone is
    repeatedly trying to login in as root). This chapter covers how to install, configure,
    and run Swatch both for real-time log monitoring and log file auditing.'
