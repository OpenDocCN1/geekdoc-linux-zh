  md: '# The Login Records


    $ users

    alice carol dave bob


    # The last Command


    The last command searches back through wtmp to show a list of the users who have
    logged in since the file was first created. It reports both the tty and the date.
    The output can be verbose; the example output below is trimmed.


    ```

    $ last

    alice tty4 Thu May 7 19:50 still logged in

