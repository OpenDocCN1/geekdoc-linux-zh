  md: '# Managing Accounts


    Many systems also support accounts that run a single command like date, finger,
    halt, etc.


    You should review all pseudo-user and single-command accounts on your system.
    Check /etc/passwd for these accounts and make sure that there''s a "*" in the
    password field (rather than a blank entry). By and large, these default accounts
    don''t represent security holes, although bugs and misconfiguration can make them
    dangerous. For example, NEXT systems used to ship with a default account "me."
    The account was innocuous in and of itself, but the system designers put it in
    the privileged "wheel" group—thus, someone using the me account could use the
    su to access the root account. While this problem was the subject of a CERT advisory
    and was fixed in later versions of NEXTSTEP, it illustrates the potential dangers
