    # Configuring Swatch


    Swatch allows for two opposing approaches to setting up pattern/action rules:
    default accept and default deny. You can set Swatch to report on all messages
    and then suppress those that aren''t interesting. Or you can set Swatch to report
    on nothing and then add the items that you wish to see.


    Swatch 2.2 includes five sample configuration files:


    +   - swatchrc.monitor—appropriate for a server

    - swatchrc.personal—appropriate for a personal workstation

    - syslog.conf-client—a replacement syslog.conf for a client systems

    - syslog.conf-master—a replacement syslog.conf for a logging “master” system

    - syslog.conf-server—a replacement syslog.conf for a server


    Check your system''s syslog configuration file /etc/syslog.conf. If the configuration
    seems appropriate, leave it alone. Take a look at the sample syslog.conf files,
    however—they may include entries that you can add.


    Alternatively, you can set up syslog.conf to write everything to single file and
    set Swatch to report on everything it finds. This can be useful to testing purposes.
    You can then add reject entries to'
