  md: '# Preface


    # xvii


    is really no such thing. UNIX was developed by AT&T and subsequently- released
    in large part to the public domain. There are dozens of different kinds of UNIX
    today, produced by different vendors, universities, organizations, and individuals
    (see Table 1.1 on page 6). While I''ve taken steps to try to ensure that the comands,
    tools, and techniques will run on common UNIX imple- mentations, there''s absolutely
    no guarantee that anything in this book will work as described on any particular
    UNIX system. The reference platform for most of the examples in this book is Red
    Hat Linux 5.0. I also used a system running HP-UX 10.20 and various BSD-based
    systems. These systems were deployed in a test net-work that was broken down once
    the book was finished.


    The world of UNIX is extremely dynamic. Even as I write this, all reference platforms
    have been replaced by newer versions (Red Hat Linux 6.0, HP-UX 11, etc.). The
    world of computer security is extremely dynamic. Most likely, some of the tools
    described herein have also been replaced by newer versions. I''ve provided URLs
    for the tools and many of the methods I describe in this book as well as a list
    of Internet resources (page 345). I strongly recommend that you seek online information
    both before and while you work with any of these tools. If you have questions
    about the tools or UNIX security in general, I highly recommend the Usenet newsgroup
    comp.security.unix as a helpful resource.


    You can find additional information about the topics covered in this book as well
    as errata, information about future editions, and links to reviews at the albion.com/usst/


    ```

    http://www.albion.com/usst/

    ```


    A note on vocabulary: as dedicated computer lovers and tinkerers have been pointing
    out for years, "hackers”—problem-solvers who enjoy exploring the details of how
    systems work—are not "crackers”—malevolent persons who break into systems for
    fun and profit. The distinction has been lost by mainstream reporters, popular
    culture, and by criminals themselves, who like to call themselves "hackers" rather
    than trespassers, thieves, spies, extortionists, vandals, etc. I prefer to reserve
    the term "hacker" to describe the really smart people whose tinkering created
    everything'
