    One area of web security rarely gets much attention is maintaining the confidentiality
    of the web server logs. Web server software commonly maintains detailed information
    about who has visited the site, what they viewed, etc. When system security is
    breached, it is possible for this potentially sensitive information to leak, thus
    compromising the implicit trust that your visitors have placed in your site.


    Finally, web servers are very much at risk from denial-of-service attacks. This
    risk arises from the fundamental security paradox presented by web and other information
    servers—you want to provide a service to a worldwide public, but this leaves you
    vulnerable to those willing to abuse the privilege. There are ways to mitigate
    this risk, but it remains intrinsic to making private resources publicly.


    # Web Client Risks


    Browsing the web is a generically insecure activity. Bugs, inappropriate "active
    content" and scripts, and sloppy web server administration can leave web surfers
    vulnerable to:


    +   - application and system crashes

    - malicious code including viruses and Trojan Horses

    - loss of confidential information, and

    - breaches of privacy'
