  md: '# Filesystem Security


    Filesystem security lies at the core of UNIX system security. The UNIX filesystem
    controls who can access information and what they can do with it. Even if the
    outer wall of account security is breached, attackers must still defeat filesystem
    defenses predicated on an elaborate system of file ownership and permissions.
    This chapters covers the basics of filesystem controls. It also covers the innermost
    layer of protection—when all else fails, cryptography can keep data private. Verifying
    software is covered as well as integrity checking and backups. The chapter also
    includes a discussion of cryptographic filesystems.'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# The Unix Filesystem


    Filesystem Basics


    One of the reasons filesystem security is so important is this: on UNIX systems,
    *everything* is a file. A collection of user data is a file. A directory is a
    file. A process is a file. A command is a file. A network connection? Yes, even
    it is a file.


    Consider this partial listing of UNIX file types:


    +   * Regular files—ASCII text files, binary data files, binary executable files,
    etc.

    * Directories—Binary files containing a list of other files

    * Special files—Including device files commonly found in the /dev directory that
    encode information about items like drives

    * Links—Including hard links, which associate two or more filenames with the same
    storage location, and soft (symbolic) links, which point to other files

    * Sockets—Special files used for communications between processes


    Files of these various types are organized in a hierarchical tree structure that
    starts with a single directory called "root" (denoted with a forward slash "/").
    All the items in the tree are collectively known as the "filesystem." Though any
    particular UNIX system may, in fact, be comprised of a number of disk-based and
    network-based filesystems, it provides a single tree structure to its users. Each
    of the items in this tree is fully described by a number of attributes, including
    one or more names, an owner, a group, a set of permissions, a length, and other
    items. Most of these attributes are stored on disk in data structures called "inodes."
    Each node within a particular filesystem has a unique number; each file has a
    distinct inode.


    The inode is the focus of all file activity in the UNIX filesystem. UNIX filesystem
    security is based on three critical pieces of information stored in inodes:'
  merge: -1
  pgno: 131
