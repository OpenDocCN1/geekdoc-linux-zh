  md: '# Maintaining Filesystem Integrity


    The main purpose behind the UNIX permissions scheme—and all filesystem safeguards—is
    to maintain the integrity of the system and user files. Integrity is a core attribute
    of a secure system. You need to rest assured that the file you wrote yesterday
    is the same file you''ll open today. Attackers and malicious users may attempt
    to subvert filesystems in dozens of ways, taking advantage of misconfigured permissions
    to planting Trojan Horses and viruses.


    The previous section covered verifying software. The same techniques—and cryptographic
    checksums in particular—can be used to verify the integrity of filesystems.


    The outstanding implementation of a filesystem checking tool is Tripwire (covered
    starting on page 151). There are other tools that perform the same function—Hobgoblin
    is an example (see page 148). The find command can also be helpful (see “SUID/SGID”
    on page 121) as the commands covered in the next two sections.


    # The sum and cksum Commands


    Historically, UNIX systems have included the sum command, which performs a 16-bit
    checksum calculation on a specified file. In most modern UNIX implementations,
    the sum command is considered obsolete and has been replaced by the cksum command,
    which performs a 32-bit Cyclic Redundancy Check (CRC).


    The syntax of cksum is simple: cksum file. The command will return the 32-bit
    CRC value, the number of octets, and the filename:


    ```

    $ ls -1 | grep

    -rw------- 1 jrandom losers 30237 Mar 13 18:42 bar

    $ cksum bar

    164310067 30237 bar

    ```'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# Caution


    > The sum and cksum commands should not be considered reliable enough to verify
    the integrity of system files. Attackers can modify files so that they have the
    same checksum as the original file. This is possible because these commands were
    designed to detect accidental modifications. They are not strong enough to prevent
    deliberate attempts to yield a specific checksum. It''s better to use MD5 for
    this purpose. See nhttp://www.cert.org/advisories/CA-94.MD5.checksums.html


    # RPM Verification and Signature Checking


    RPM (Red Hat Package Manager) is a versatile software manager developed by Red
    Hat Software and included with their Linux distributions. It can be used to build,
    install, query, verify, update, and uninstall individual software packages. An
    RPM "package" includes an archive of files as well as package information.


    The RPM package eliminates some of the headaches associated with maintaining current
    software. The RPM man page contains an exhaustive accounting of its many options.
    What interests us here is RPM''s verification features. When you use RPM to install
    a package, RPM adds information about each installed file to a database, including


    +   - an MD5 checksum

    - file size

    - file type

    - owner

    - group

    - permissions mode


    When RPM is run with the "--verify" flag, it compares the values from the original
    files with the currently installed files and reports on discrepancies. For example,
    the following verifies the current timed binary:


    ```

    # rpm --verify timed-0.10-2

    ```'
