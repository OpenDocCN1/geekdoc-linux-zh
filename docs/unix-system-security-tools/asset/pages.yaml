    of these can be used on their own as well:


    +   MD5—This successor to MD4 and MD2 is the most widely implemented message digest
    algorithm. It was developed by Ronald L. Rivest, released into the public domain
    by RSA Data Security, Inc., and described by RFC 1321. MD5 processes text in 512-bit
    blocks and returns a 128-bit hash value. According to RFC: “It is conjectured
    that the difficulty of coming up with two messages having the same message digest
    is on the order of 2^64 operations, and that the difficulty of coming up with
    any message having a given message digest is on the order of 2^128 operations.”


    You can find source code for MD5—courtesy of Jim Ellis at CERT—at http://www.cert.org/ftp/tools/md5/
    or on the accompanying CD-ROM.


    # Tip


    +   SHA—The Secure Hash Algorithm was designed at NIST with the help of the National
    Security Agency. It lies at the core of the Secure Hash Standard, which in turn,
    is designed to ensure the security of the Digital Signature Algorithm (DSA). SHA
    is closely modeled after Ron Rivest''s MD4. It produces a 160-bit message digest.
    The Digital Signature Algorithm relies on SHA to generate a compressed message
    digest, which is then signed instead of the entire message.


    +   3. See http://www.faqs.org/rfcs/rfc1321.html


