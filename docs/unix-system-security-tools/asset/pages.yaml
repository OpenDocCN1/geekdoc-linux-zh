    and patching security holes over the years. Be sure to install and run the latest
    UNIX version for your platform since it may contain security-related fixes. Give
    serious thought to the security settings program offers—your browsing will be
    safer (if a bit crippled) if you disable both JavaScript and Java. Clean out your
    cache and cookie files on a regular basis. Avoid undesirable sites and use the
    “save” option in preference the “open” option for untrusted files.


    In order head off “Spartan Horse” attacks (described in “Web Client Risks” on
    page 308), be sure to educate your users about social engineering and the risk
    that their passwords could be stolen by deceptive code.


