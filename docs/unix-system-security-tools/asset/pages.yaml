  md: '# Verifying with PGP


    PGP is very handy for verifying software and other files that have been downloaded
    from the net. The author of a security tool, for example, can create a detached
    signature for the archived tool, using his or her public key. The author then
    makes the package available along with the detached signature and his or her public
    key. You download all three files, the author’s public key to your keyring, and
    then verify the package. PGP will sign the package with the author’s key, and
    check the resulting signature against the one included with the package. If there’s
    a match, you can assume that the package has not been tampered with (as long as
    you can trust the author’s key).


    This is simpler than it sounds. I’ll use the Abacus Logcheck by Craig H. Rowland
    to illustrate. ¹¹³ The distribution consists of three files:


    +   - logcheck-1.1.tar.gz—the compressed logcheck package

    - logcheck-1.1.tar.gz.asc—a detached PGP signature for the package

    - crowland.asc—Psionic.com’s public key


    The detached signature looks like this:


    ```

