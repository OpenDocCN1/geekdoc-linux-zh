  md: 'This method of protecting password security was first proposed by Leslie Lamport
    in 1981 and first implemented on a wide-scale by the S/Key system developed by
    Phil Karn at Bellcore (see “S/Key” on page 97).¹² S/Key is the basis of several
    related one-time password systems such as OIE (see “OPIE” on page 96) and the
    otp library (see “otp” on page 96). Unfortunately, these related but different
    one-time password systems are largely incompatible—the overall deployment of the
    technology has been slowed by implementation differences.


    In recent years, there has been an effort to develop standards for OTP systems.
    RFC 1938 by Neil Haller and Craig Metz describes a generic architecture for OTP.¹³
    It specifies two pieces of an OTP system: a password-generator that produces one-time
    user passwords based on a secret passphrase, and a server that verifies the received
    passwords and stores the last valid one that used.


    OpenBSD 2.4 includes an exemplary implementation of S/Key. The OpenBSD login utility
    will accept either passwords or the password “S/Key,” in which case S/Key authentication
    is performed. The skeyinit command initializes the system and asks the user enter
    a secret passphrase consisting of several words. The keyinfo command can be used
    to print out sets of one-time passwords. OpenBSD’s implementation provides maximum
    flexibility. A user working from an office console can use his or her regular
    password. When the same user is on the road using untrusted Internet facilities,
    he or she can avoid risk by using the one-time passwords from a code book.


    In the future, more and more UNIX vendors are likely to implement the OTP system.
    While OTP provides strong protection to passwords, it doesn’t address the confidentiality
    of the actual user session. In the long run, the need for special password security
    may decrease as network transmissions are routinely encrypted by emerging standards
    such as Transport Layer Security (see “TLS” on page 318) or Secure Shell (SSH).


