  md: '# SMTP/sendmail


    As a Mail Transport Agent, sendmail acts like the Postal Service, minus the actual
    letter carriers. Like post offices and mail sorting facilities, it serves as a
    relay, receiving, parsing, sorting, and directing email to delivery agents (“letter
    carriers”) that in turn make final delivery. The delivery agents are typically
    servers running protocols like the Post Office Protocol (POP) or Internet Message
    Application Protocol (IMAP), which provide for local storage and the delivery
    of mail to end user programs like `/bin/mail` or Netscape Messenger.


    sendmail has two main components: a binary program (usually `/usr/lib/sendmail`)
    and a configuration file (sendmail.cf). The file is organized into complex sets
    of rules that rewrite mail headers, check for errors, and select mail delivery
    agents. Since sendmail consults each rule time it parses the configuration file,
    the rule syntax is optimized for program speed rather than human comprehensibility.
    The rules have been variously described as “modern noise, Mr. Dijkstra swearing
    in the comic strip ‘Blondie’, and an explosion in a punctuation factory.”


    Additional components include the system-wide aliases files, which map usernames
    to aliases, and optional .forward files maintained in the home directories of
    individual users. The .forward mechanism allows users to set up their own forwarding
    aliases.


    Sendmail has a long and colorful history in the UNIX and Internet communities,
    dating back to 1979 when the program’s author Eric Allan wrote a predecessor called
    delivermail while at University of California at Berkeley. The program has been
    iterated many times over the years: version 5 (also known as IDA) was superseded
    by version 8 in 1993 (the latest version of which writing is 8.9.3).


