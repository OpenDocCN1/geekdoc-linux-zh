    # Cryptography


    We''ve already seen how cryptography is used to protect pass-

    words and enforce account security (see “The Password Mecha-

    nism” on page 53). It is also widely used to protect messages while

    hey’re being transmitted (see “IP Security” on page 270 and “Pro-

    tect Against Transmission Risks” on page 317). It can also be

