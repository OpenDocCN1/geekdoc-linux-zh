  md: '# Chapter 01 / Introduction


    +   * Detection—Works in conjunction with preventative measures. When prevention
    fails, detection should kick in, preferably while there''s still time to prevent
    damage. Includes logkeeping and auditing activities


    +   * Recovery—When all else fails, prepared to pull out backup media and restore
    from scratch, or cut to backup servers and net connections, or fall back on a
    disaster recovery facility. Arguably, this function should be attended to before
    the others


    Analyzing security by function can be a valuable part of the security planning
    process; a strong security policy will address all five areas, starting with recovery.
    This book, however, is primarily concerned with prevention and detection.


    # Security Domains


    Computer security is also frequently defined in terms of several interdependent
    domains that roughly map to specific departments and job titles:


    +   * Physical security—Controlling the comings and goings of people and materials;
    protection against the elements and natural disasters


    +   * Operational/procedural security—Covering everything from managerial policy
    decisions to reporting hierarchies


    +   * Personnel security—Hiring employees, background screening, training, security
    briefings, monitoring, and handling departures


    +   * System security—User access and authentication controls, assignment of privilege,
    maintaining file and filesystem integrity, backups, monitoring processes, log-keeping,
    and auditing


    +   * Network security—Protecting network and telecommunications equipment, protecting
    network servers and transmissions, combating eavesdropping, controlling access
    from untrusted networks, firewalls, and detecting intrusions


    This text is solely concerned with the latter two. System and network security
    are difficult, if not impossible, to separate in a UNIX'
