  md: '# OperatingSystem/UNIX $39.99 U.S.A.


    Get the UNIX Security Answers You Need—in the Most Complete Security Toolkit Anywhere


    If you''re a programmer or administrator who wants to safeguard your UNIX system,
    you can''t find a more comprehensive security toolkit than Seth Ross''s UNIX System
    Security Security Tools.


    UNIX Security Toolkit


    UNIX was developed during a more trusting era when the open exchange of information
    was more valued than airtight system security. With UNIX System Security Tools,
    you can harden UNIX without losing the openness that made you choose it in the
    first place.


    +   * Security Planning

    * Passwords

    * Permissions

    * Managing Accounts

    * File System Integrity

    * Cryptography

    * Backups

    * Auditing/Logging

    * Testing Your Defenses

    * Securing Network Services

    * Firewalls


    Featuring a wide selection of tools, from password checkers to firewalls (many
    of them conveniently packaged on the accompanying CD-ROM), and detailed UNIX security
    coverage, this one-stop professional package can help improve your security posture
    and protect valuable data from attackers, intruders, and accidental violations.
    While there is no such thing as perfect security, UNIX System Security Tools is
    the perfect start.


    With a Foreword by Simson Garfinkel.


    P/N 054054-3 part of ISBN 0-07-913788-1


