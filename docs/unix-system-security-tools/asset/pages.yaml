    # A Linux Firewall with ipchains


    The presence of firewall capabilities at the kernel level is one of the many benefits
    of Linux. The firewall utility ipfwadm (based on the BSD ipfw) provides sysadmins
    with many options for integrating firewall capabilities on their Linux boxes.
    In 1998, various Linux developers undertook a major re-write of the previous Linux
    IPv4 firewall code dubbed “ipchains.”


    > The ipchains tool is required to administer the IP packet filters in Linux kernel
    versions 2.1.102 and above. Systems running the 2.0 kernel series can download
    a kernel patch. To check if your system has ipchains, look for the file /proc/net/ip_fwchains


    Tip


    The ipchains is set up with filters that determine how packets are handled. The
    filters are controlled by three firewall chains—or lists of rules—called input,
    forward, and output. When a packet arrives, the kernel uses the input chain to
    determine whether it lives or dies. If it survives, the packet is routed. If the
    packet is destined for another machine, the kernel consults the forward chain.
    Finally, the kernel consults the output chain before sending it on its way.


    > For more information on ipchains, see the Linux IPCHAINS-HOWTO by Paul Russell,
    at http://www.rust.com/linux/ipchains/HOWTO.html and the Official IPCHAINS Home
    Page at http://www.rust.com/linux/ipchains/


    Tip


    Innovations like ipchains demonstrate that the art of building firewalls continues
    to evolve. Eventually, system and application security may improve to the point
    that perimeter defenses like fire-walls are rendered moot. This change, if it
    comes at all, will be'
