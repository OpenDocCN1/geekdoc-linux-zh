  md: 'page 99). Another program called "John the Ripper" has similar features. Both
    of these programs provide security through detection.


    A traditional downside to reactive password checking is the amount of computational
    resources (CPU time, disk space) the guessing program requires, especially when
    working on large sets of passwords. Today''s fast cheap hardware, however, makes
    this less of a barrier than it used to be. A more intrinsic problem is the "window"
    that exists between the time a user picks a weak password and the time password-checking
    program detects it. Crack can be set to run on a regular basis, but will always
