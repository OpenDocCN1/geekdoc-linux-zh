- img_proc: true
  md: '# Transport Protocols


    analogous to circuit-switched telephone calls. Protocol software on one machine
    “calls” the corresponding software on the remote machine. Once a connection is
    up, the software on both machines communicate continuously to ensure that the
    data is sent correctly. If communication fails, both machines detect the failure
    and report to the appropriate applications.


    TCP is predicated on a technique known as “positive acknowledgement with retransmission.”
    The recipient must communicate back to the sender by sending an acknowledgement
    message when it receives data. The sender keeps a record of each packet sent and
    waits for an acknowledgement before sending the next packet.


    A TCP connection is established by a three-way handshake that guarantees two hosts
    are ready to communicate as peers. The protocol inserts two special bits into
    each packet header in order to negotiate a new connection: SYN and ACK. To start
    a connection, the requesting host sends a packet that has the SYN bit set and
    the ACK bit unset. The receiving host responds by sending back a packet with the
    SYN and ACK bits set. Finally, the requesting host sends a third packet with the
    SYN bit unset and the ACK bit set.


    > TCP is based on work done by Vinton G. Cerf (the “father” of the Internet) and
    Robert E. Kahn in the early 1970s. In 1981, Jon Postel formalized it in RFC 793.
    For more information, see http://www.faqs.org/rfcs/rfc793.html


    TCP is designed to support services that require a reliable bidirectional stream
    of data. FTP and Telnet applications, for example, are built on TCP.


    Table 13.3 summarizes some common TCP services and their corresponding ports.'
