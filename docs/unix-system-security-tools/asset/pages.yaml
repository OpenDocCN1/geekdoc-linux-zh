  md: '# Cryptography


    cryptographic checksums to determine if unauthorized changes have been made to
    files—an art thats elevated by the Tripwire tool (see page 151). Most importantly,
    cryptographic techniques can be used to secure sensitive files or even entire
    filesystems.


    If one imagines UNIX system security as a series of concentric defenses, encryption
    lies at the core. When all other safeguards protect the confidentiality and integrity
    of your data, strong encryption can fail. Network-based attackers may exploit
    obscure network service to gain access to a system you use. Passwords can be cracked;
    permissions can be hacked; one by one the rings of defense fail. Your directory
    of sensitive files are under their fingertips when, they''re in. But wait! These
    files are protected by strong crypto—the cracker loses!


    Net hackers aside, every UNIX system contains a huge file loophole: the root user.
    Passwords and permissions mean nought to root, even the most trusted sysadmin
    can make a mistake that compromises the root account. Root access can also be
    stolen by a wide variety of means, from buffer overflow attacks to coercion. If
    the confidentiality of user data is critical, then that data must be encrypted.


    Cryptography (crypto) is the art and science of keeping files and messages secure.
    It works by mathematically transforming a “plaintext” (or “cleartext”) message
    into a disguised “ciphertext”—a process known as “encryption.” “Decryption” involves
    turning the ciphertext back into plaintext. The mathematical function used for
    encryption and decryption is called a cryptographic algorithm or “cipher.”


    Most cryptystems rely on a key, which can be one of a large number of values (the
    “keyspace”). The key is used to determine how data is encrypted or decrypted.
    In general, the security of the algorithm lies in the key; security should not
    depend on the secrecy of the algorithm.


    “Symmetric” ciphers use the same key for encryption and decryption. “Public-key”
    (or “asymmetric”) ciphers use different but related keys for encryption and decryption:
    a stranger can use your public key to encrypt a message that only you, holder
    of your private key, can decrypt.'
