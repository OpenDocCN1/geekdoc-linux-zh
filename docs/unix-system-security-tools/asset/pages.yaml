    # httpd logs


    Web server Apache maintains detailed logs about web traffic. These may contain
    important marketing information (who’s viewing your pages) and technical information
    (there’s a broken link that’s producing a “404” error).


    Apache produces two logs: an access_log and an error_log. You can specify where
    these logs are kept; by default, they live in the directory /usr/local/etc/httpd/logs.


    The access_log contains the following for each HTTP request:


    +   - Name or IP address of the remote host that made the request

    - Remote login name, if any, or “-” if none

    - Remote username, if any, or “-” if none

    - Time that the request was received (usually GET)

    - HTTP command that was executed (usually GET)

    - Status code (200 is “OK”; 304 is “Not Modified”; 404 is “Not Found”; etc.)

    - Number of bytes transferred


    Some servers use an extended record format that also includes the “referrer”—indication
    of where the page view came from (usually a link at another web site.).


    In the sample access_log below, you can see that several “GET” requests are answered
    from various hosts. Note that the last line contains a 404 error due to a spelling
