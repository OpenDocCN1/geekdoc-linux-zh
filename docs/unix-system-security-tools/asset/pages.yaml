- img_proc: true
  md: '# TCP/IP Networking


    you''re sending a packet down the hall or across the world, pulling in a web page
    or sending mail to Timbuktu. This is in stark contrast to earlier network schemes
    such as UUCP that required users to specify each hop needed to get from system
    A to system Z. Part of this “magic” is due to the elegant design of the IP addressing
    scheme.


    Each computer—or more exactly, each interface—on an IP network has a unique 32-bit
    IP address, a set of four 8-bit numbers or octets. Since humans don''t typically
    think in terms of 8-bit numbers, IP addresses are commonly written as four decimal
    integers separated by decimal points. Each integer represents represents the value
    of one octet of the Internet address. The 32-bit IP address


    ```

    10000000 00011010 00111110 00000010

    ```


    is written as


    128.10.30.2


    Each address actually contains a pair of identifiers: one for the network it is
    on (the netid), and one for the host on that network (the hostid). This has a
    number of important implications. The prominence of the netid makes routing much
    more efficient: a router only needs to know a path to a specific network rather
    than a specific host. An IP address really specifies a network connection, rather
    than an individual machine (say, for packet filtering between a trusted network
    and the Internet), the host needs two IP addresses. This binding of netid and
    hostid also means that when a machine changes networks, it needs to change its
    IP address as well.


    Every IP address belongs to one of three classic forms: Class A, Class B, and
    Class C. These correspond to three network classes. Given an IP address, its class
    can be determined from the first few bits (the high-order bits) in the address.
    Each class devoting a varying number of the remaining bits to the netid and the
    hostid. Naturally, as more bits are devoted to the netid, there are fewer individual
    hosts that can be specified by the hostid. Table 13.1 summarizes the three major
    classes.'
