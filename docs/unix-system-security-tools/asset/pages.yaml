  md: '# Ethics


    As always, the best prevention is awareness.


    # Ethics


    As our society grows increasingly dependent on computer systems, the role of the
    system administrator has been increasingly pivotal. Sysadmins often hold significant
    power. They handle all kinds of sensitive data, from bank transactions to medical
    records. They manage machines connected to networks which, in turn, connect to
    other networks. With these powers come responsibility.


    These responsibilities exist whether the administrator recognizes them or not.
    Sometimes those who operate home systems don''t view themselves as “system administrators”
    per se. Perhaps they''ve converted some old Windows PCs to Linux boxes and built
    small home LANs. Perhaps they come from the PC world, where your responsibility
    doesn''t extend beyond the system you''re sitting at. All this is fine, until
    those systems get connected to the Internet, where thousands of script kiddos
    running port scanning software prowl. An operator may think that no one will be
    interested in a humble home LAN but or she would be wrong. All of a sudden, innocent
    Linux box gets “root-kitted” and is set up as a base to attack other systems on
    the net. This happens everyday, as evidenced by the plaintive cries for help on
    comp.security.unix and other newsgroups: “My Linux box got cracked! What do I
    do?”


    If you run a UNIX system connected to the Internet, whether it''s a massive corporate
    LAN or a box in a basement, you''re ethically responsible for maintaining security.


    # The SAGE Code of Ethics


    The Systems Administrators Guild (SAGE) promulgates a Code of Ethics that is relevant
    to anyone who administers systems, handles sensitive information, or manages security.ed
    by Hal Miller, the code is divided into six canons. The code is neither prescriptive
    nor all-encompassing; still, it represents a valuable slice of insight into the
    ethical issues that operate “behind the scenes.”


    Here is the Code, as presented on the SAGE web site.


    +   9. See http://www.usenix.org/sage/publications/code_of_ethics.html'
