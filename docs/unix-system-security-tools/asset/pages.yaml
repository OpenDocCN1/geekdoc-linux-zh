  md: '# UNIX: A Practical Definition


    interface includes tools such as cc, troff, grep, awk, and a choice of shell.²
    I might add that UNIX provides a consistent approach to multitasking, with built-in
    operations for the creation, synchronization, and termination of processes. It
    is intrinsically portable between different kinds of computers.


    +   Social—Many people who run UNIX-like systems as Linux think they are running
    UNIX. Official UNIX systems and unofficial UNIX systems are commonly treated as
    belonging to a single category—in books, in media coverage, on the net, and by
    general consensus.


    # A Quick History of UNIX


    In order to define UNIX, it helps to look at its history. In 1969, Ken Thompson,
    Dennis Ritchie and others started work on what would become UNIX on a “little-used
    PDP-7 in a corner” at AT&T Bell Labs. For ten years, the development of UNIX proceeded
    at AT&T in numbered versions. V4 (1974) was re-written in C—a major milestone
    for the operating system''s portability among different systems. V6 (1975) was
    the first to become available outside Bell Labs—it became the basis of the first
    version of UNIX developed at the University of California Berkeley.


    Bell Labs continued work on UNIX into the 1980s, culminating in the release of
    System V (as in “five,” not the letter) in 1983 and System V, Release 4 (abbreviated
    SVR4) in 1989. Meanwhile, programmers at the University of California hacked mightly
    on the source code AT&T had released, leading to many a master thesis. The Berkeley
    Standard Distribution (BSD) became a second major variant of “UNIX.” It was widely
    deployed in both university and


    See http://www.faqs.org/faqs/unix-faq/faq/contents/'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Chapter 01 / Introduction


    corporate computing environments starting with the release of BSD 4.2 in 1984.
    Some of its features were incorporated into SVR4.


    As the 1990s opened, AT&T''s source code licensing had created a flourishing market
    for hundreds of UNIX variants by different manufacturers. AT&T sold its UNIX business
    to Novell in 1993, and Novell sold it to the Santa Cruz Operation two years later.
    In the meantime, the UNIX trademark had been passed to the X/Open consortium,
    which eventually merged to form The Open Group.


    While the stewardship of UNIX was passing from entity to entity, several long-running
    development efforts started bearing fruit. Traditionally, in order to get a BSD
    system working, you needed a source code license from AT&T. But by the early 1990s,
    Berkeley hackers had done so much work on BSD that most of the original AT&T source
    code was long gone. A succession of programmers, starting with William and Lynne
    Jolitz, started work on the Net distribution of BSD, leading to the release of
    386BSD-0.1 on Bastille Day, 1992. This original “free source” BSD was spun out
    into three major distributions, each of which has a dedicated following: NetBSD,
    FreeBSD, and OpenBSD, all of which are based on BSD 4.4.


    BSD wasn''t the first attempt at a “free” UNIX. In 1984, programmer Richard Stallman
    started work on a free UNIX clone known as GNU (GNU''s Not UNIX). By the early
    1990s, the GNU Project had achieved several programming milestones, including
    the release of the GNU C library and the Bourne Again Shell (bash). The whole
    system was basically finished, except for one critical element: a working kernel.


    Enter Torvalds, a student at the University of Helsinki in Finland. Linus looked
    at a small UNIX system called Minix and decided he could do better. In the fall
    of 1991, he released the source code for a freeware kernel called “Linux”—a combination


