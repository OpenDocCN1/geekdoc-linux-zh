- img_proc: true
  md: '# HTTP Basics


    The Hypertext Transfer Protocol (HTTP) is a fairly simple but very important protocol
    that allows users (“browsers”) or (“surfers”) to request and receive hypermedia
    content from the World Wide Web (WWW) and other distributed information systems.
    By default, the HTTP daemon (httpd) runs on top of TCP and listens on TCP port
    80. It can, use other ports and even other protocols that provide a reliable data
    stream (at least in).


    HTTP is a request/response protocol. In order to retrieve information, a web browsing
    client program like Netscape Navigator (technically known as a “user agent”) establishes
    a TCP connection to a server Apache and makes a request for a resource (a “GET”).
    The server examines the request and responds in accordance with the configuration
    of the server and the content the server contains. A server might send a Hypertext
    Markup Language (HTML) file, text, graphics, audio, video, or a Java applet, which
    the browser (hopefully) displays. A server may also run a program in response
    to a browser request, either through the Common Gateway Interface (CGI) or through
    the server’s Application Programming Interface (API).


    HTTP is both flexible and generic. While its original function was to retrieve
