    # Cost-Benefit Analysis


    A complete consideration of cost-benefit risk analysis is beyond the scope of
    this book. In brief, there are four steps for evaluating the costs and benefits
    of security measures.


    The first two key off a simple risk formula: R = L X P, where R is the risk of
    expected loss, L is the potential loss, and P is the probability or expected frequency
    of loss. Keeping this formula in mind, the first two steps are:


    +   - Quantifying the Threats (P)—Given the threats that face your systems, what
    is the probability of each causing a loss in a given time frame (i.e., a year)


    +   - Quantifying the Cost of Loss (L)—Includes the cost of repairing or replacing
    an item, the cost of system downtime, the cost to an organization’s reputation,
    and the cost to clients


    Once you’ve established the level of risk (R), there are two more steps:


    +   - Quantifying the Cost of Prevention—The cost of preventing each kind of loss.
    This may include the cost of hardware, such as uninterinterruptable power supplies
    or card access systems; the cost of software, such as a commercial intruder detection
    system; and the cost of personnel as new hires, training, etc.


    +   - Calculate the Bottom Line—For each loss, compare the calculated risk with
    the cost of avoiding or preventing the loss


