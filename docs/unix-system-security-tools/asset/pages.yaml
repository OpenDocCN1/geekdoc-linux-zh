  md: '# UNIX Security Books


    +   - Braun, Christoph. UNIX System Security Essentials. Wokingham, England: Addison-Wesley,
    1994, ISBN 0-201-42775-3.


    A good overview of UNIX security even though the title\u2019 reference system
    is SINIX, a somewhat obscure UNIX implementation from Siemens Nixdorf.


    +   - Curry, David A. UNIX System Security: A Guide for Users and System Administrators.
    Reading, MA: Addison-Wesley, 1994, ISBN 0-201-56327-4.


    This hardcover book covers all the bases.


    +   - Farrow, Rik. UNIX Security. Reading, MA: Addison-Wesley, 1991, ISBN 0-201-57030-0.


    A solid if somewhat dated overview of practical UNIX security.


    +   - Ferbrache, David, and Gavin Shearer. UNIX Installation, Security \u2016
    Integrity. Englewood Cliffs, NJ: Prentice Hall, 1993, ISBN 0-13-015389-3.


    A decent overview of UNIX security that\u2019s particularly strong on programming
    for security.


    +   - Garfinkel, Simson, and Gene Spafford. Practical UNIX and Internet Security.
    Sebastopol, CA: O\ReillyReilly \u2016 Associates, 1996, ISBN 1-56592-148-8.


