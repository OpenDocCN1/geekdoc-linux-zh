  md: '# Chapter 04 / Hardening Account Security


    avoidance. Capturing passwords that can''t be re-used is a truly futile line-of-attack.


    One-time passwords represent one of the most effective and elegant security tools
    and techniques. They can be implemented with hardware like a token card or with
    software and (gasp) paper. All one-time password schemes are conceptually based
    on the one-time pad, a perfect encryption method developed in 1917 by Major Joseph
    Mauborgne. A classic time pad consists of a large set of non-repeating key letters
    written on paper and glued together into a pad or codebook. The message sender
    uses each key in turn to encrypt one plaintext character—the encryption routine
    adds (modulo 26) the message character—the one-time key later. The receiver uses
    an identical pad to decrypt the message character by character. Once the pads
    are used, they are destroyed.


    As long as the eavesdropper can''t get access to the pad, this scheme is perfectly
    secure—even the most determined opponent can''t deduce since any given encrypted
    text can correspond to any plaintext message of the same size. Supposedly, the
    cold-war era hotline between the United States and the Soviet Union was protected
    by a one-time pad system. By Bruce Schneider points out,¹¹


    They are still secure today and will remain that way forever. It doesn''t matter
    how long the supercomputers work on the problem. Even after the aliens from Andromeda
    land with their spaceships and undreamed-of computing power, they will not be
    able to read the Soviet spy messages encrypted with time pads (unless they go
    back in time and get the one-time pads).


    The strength of the one-time pad (OTP) schemes has been incorporated into various
    one-time password schemes that rely on a code book. A code book of passwords is
    generated using a shared secret (typically a phrase). When a user needs to log
    in, he or she looks up the next available password in the code book, uses it to
    gain access, and then crosses it out. Assuming the code book is not defeated,
    this performs an almost perfect authentication.


    > ¹¹. Ibid., 17.'
  merge: -1
