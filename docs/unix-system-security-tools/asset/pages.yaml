    # UUCP


    The Unix-to-Unix Copy (UUCP) facility is a dial-up networking and file exchange
    scheme that was widely deployed on UNIX systems in the 1980s. Created in 1977,
    UUCP was popular because it was bundled with almost every UNIX distribution and
    because it provided rudimentary networking using relatively inexpensive dial-up
    modems and telephone lines. UUCP was used primarily for the point-to-point exchange
    of email and USENET news, though it could also be used as a generic file transfer
    protocol or to execute commands on a remote system. Mail and news articles would
    be temporarily stored (spooled) on one UUCP host and then transmitted when the
    uuicco program was invoked—typically by cron, and often during off-hours to save
    a phone charges.


    I’m using the past tense in describing UUCP because it has been largely superseded
    by the Point-to-Point Protocol (PPP), which uses the same hardware but offers
    a full range of Internet services, by the POP and IMAP protocols for retrieving
