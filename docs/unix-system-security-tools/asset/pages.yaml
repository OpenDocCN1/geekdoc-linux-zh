    This capability was added to UUCP during the late 1980s as a stop-gap measure
    during the transition from dial-up connectivity to TCP/IP. The uucp daemon listens
    on TCP port 540 for a connection request from a sending system''s uuico program.


    As one of the oldest UNIX utilities, UUCP is fairly secure, at least in so far
