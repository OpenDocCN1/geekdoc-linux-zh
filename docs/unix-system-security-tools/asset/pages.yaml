  md: '# Shadow Password Files


    Traditionally, the /etc/passwd file is world-readable since many programs need
    it to translate UIDs to usernames. The ls -l command, for example, would display
    numeric UIDs instead of usernames if it couldn''t access /etc/passwd. Unfortunately,
    given the availability of password-guessing programs, the world-readable /etc/passwd
    file with encoded passwords presents a major security risk. Most recent UNIX implementations
    support a workaround: shadow password files.


    The shadow password system essentially splits the password file into two parts:
    /etc/passwd and the shadow password file. The shadow password file stores the
    encoded passwords; the coded-password fields in /etc/passwd are all set to “x”
    or another placeholder. The shadow password file can only be read by root or set-uid
    programs like passwd that legitimately need access while all non-privileged users
    are denied access. By convention, the shadow password file is stored as /etc/shadow,
    though some systems use alternate paths and filenames. BSD systems, for example,
    store the encoded passwords in /etc/master.passwd.


    # Anatomy of /etc/shadow


    The /etc/shadow file contains fields for the username and the encoded password
    as well as the following:


    +   - Date password was last changed expressed as the number of days since Jan
    1, 1970

    - Minimum days between password changes. Days after which password must be changed

    - Days before password is to expire that user is warned

    - Days after password expires that account is disabled

    - Days since Jan 1, 1970, that account is disabled

    - A reserved field


