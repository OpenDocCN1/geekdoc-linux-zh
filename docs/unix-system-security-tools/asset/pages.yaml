  md: '# PAM Configuration Files


    PAM configuration information can be held in either a single file /etc/pam.conf
    or in the directory /etc/pam.d/. The PAM library can be compiled in one of two
    modes—one which uses either a single /etc/pam.conf file or /etc/pam.d/ directory
    but not both, and a second which allows both configuration set-ups, with /etc/pam.d/
    overriding the settings of /etc/pam.conf.


    In general, the directory format is easier to configure and maintain. It''s also
    a bit faster—only a short file needs to be parsed each time PAM is invoked, rather
    than a longer, singular configuration file. Since Red Hat Linux systems utilize
    the directory format, I''ll use this set-up in my examples.


    > The Linux-PAM System Administrators'' Guide by Andrew G. Morgan is an excellent
    guide to setting up PAM. See http://www.kernel.org/pub/linux/pam/Linux-PAM-pam.html


    Each of the files in /etc/pam.d/ controls a "service" or application. The file
    /etc/pam.d/login, for examples, governs the parameters of the login application.


    The syntax of each file in /etc/pam.d/ consists of lines of the following form:


    ```

    module-type      control-flag      module-path      arguments

    ```


