    # Default Accounts


    All UNIX systems ship with default accounts; sometimes these accounts have standard
    passwords or no password at all. Thus, they are a UNIX cracker''s best friend.


    Early versions of UNIX came without passwords for any account. As UNIX became
    commercialized, the tradition of password-less accounts, unfortunately, survived
    for some time. Most modern UNIX systems don''t install with password-less accounts;
    still, some UNIX systems arrive at a customer''s door with no root password. The
    root account, or “superuser,” is the most important account and the most coveted
    by crackers—root has unrestricted access to all aspects of the system. The first
    thing sysadmin should do with a new UNIX box is set a root password. Vendors should
    set up their systems so that the sysadmin is prompted for the root password during
    the installation process or the very first time system is booted.


    In addition to the root account, many systems have “pseudo-user” accounts such
    as bin, daemon, mail, and uucp. These accounts are usually never logged into,
    but are basically placeholders for process and file ownership.'
