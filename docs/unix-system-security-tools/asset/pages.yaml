  md: '# Enhancing Password Security


    # Generating Random Passwords


    Many UNIX implementations can be configured with a password generating program
    that presents a choice of several random character strings and asks the user to
    choose one. UNIX systems also can be configured to preceptively assign such passwords
    to users. Examples of generated passwords include:


    +   - a random 32-bit word converted to characters


    +   - a passphrase composed of random dictionary words


    +   - a password composed of consonant-vowel-consonant groups


    This solution may not be as easy or as satisfactory as it seems at first glance.
    For starters, the password generator must be truly random; otherwise, an attacker
    will be able to analyze its output. Morris and Thompson describe a random password
    system built around a random number generator. Since it only had 2¹⁵ possible
    starting values, it didn''t stand up to a cracker who was able to break in using
    just one minute of time. David Ferbrache and Gavin Shearer describe what happened
    to a university system that implemented a password generator. It used:


    > ... a machine-generated password as the initial password for all undergraduates.
    This password was unfortunately based solely on the user''s name and/her class
    details. This led to an attack by an older student who managed to determine the
    algorithm (presumably by discovering a selection of the allocated passwords).
    This student was then able to extrapolate the password of the entire year''s intake
    and to compromise many of the student accounts.


    Generated passwords which are not sufficiently random can open up huge holes in
    your security posture. At the same time, passwords which are sufficiently random
    are almost always very hard to remember. Users end up writing them down, thus
    defeating security (see “Writing Down Passwords” on page 52). Think like the enemy:
    why run a complex program when you can walk down


