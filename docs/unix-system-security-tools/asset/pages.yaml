  md: '# Chapter 04 / Hardening Account Security


    Again, modern BSD systems provide examples of how additional

    alg can be implemented. By default, FreeBSD uses a crypt()

    function built around the MD-5 one-way hash function (i.e., a

    function that operates on an arbitrary-length message and returns

    a fixed-length hash value). As part of a "dual-track" strategy

    ended to leave the core distribution free of crypto opt restrictions,

    FreeBSD can be retrofitted with a separate add-on library

    supporting the DES-based password hash.


    OpenBSD goes even further. The group that develops it is based

