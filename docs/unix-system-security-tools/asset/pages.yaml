  md: '# Tiger


    Tiger is a flexible tool that checks for known security problems. It’s more up-to-date
    than COPS and more thorough. It also is one of the few security tools that includes
    detailed explanations of its output. This chapter provides an overview of what
    Tiger does and how to install, configure, and run it.'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# Introduction


    Tiger is a UNIX security checker that scans system configuration files, file systems,
    and user configuration files for possible security problems. Tiger is meant to
    be run as a general sanity check before a system is connected to the Internet.
    Its main goal is to seek out circumstances that could lead to compromise of the
    root account. Once installed, it can methodically check for common problems, including
    altered system files, “strange” files, weak passwords, and unnecessary or new
    SUID/SGID executables.


    Tiger was written at Texas A&M University as part of the TAMU suite of security
    tools—the suite was developed in response to a series of coordinated Internet
    intrusions that occurred at the university in the summer of 1992.¹ The authors
    made extra efforts to ensure that the tool is easy-to-use so that users (as opposed
    to system administrators) can routinely monitor and learn about UNIX system security.
    It produces detailed reports that optionally include clear explanations of the
    meaning of each item found.


    Tiger is composed of a portable collection of Bourne shell scripts, C code, and
    data files. It can be run on almost any UNIX system; it contains specific support
    for


    +   * AIX

    * HPUX

    * IRIX

    * Linux

    * Nextstep

    * SunOS

    * UNICOS


    1. The incidents leading up to Tiger’s creation are documented in “Texas A&M Network
    Security Package Overview” by Dave Safford, Doug Schales, and Dave Hess. See http://coast.cs.purdue.edu/pub/tools/unix/tiger/TAMU/OVERVIEW'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# Introduction


    For most of these platforms, version 2.2.3 of Tiger is appropriate. Version 2.2.4
    was released in 1998—it contains modifications specific to Red Hat Linux 5.2.


    While Tiger is portable, it relies on some extent on fixed operating system “signatures”
    that contain items like a list of all SUID/SGID files. To make it work optimally
    on a system not listed above, you''ll need to make extensive customizations.


    # Caution


    Tiger is similar in design to COPS. It is, however, a newer tool that''s been
    more extensively developed. Like Tripwire, it can check the signature of important
    system files (though you''re better off using Tripwire for this purpose—see page
    151). It can also be configured to run Crack as part of its checks and report
    on weak passwords.


    # Tiger Checks


    Tiger is designed to check a broad assortment of files and directories. Specifically,
    it looks at


    +   - file and directory access permissions

    - SUID/SGID executables

    - crontab entries

    - mail aliases

    - NFS exports

    - inetd entries

    - PATH variables

    - .hosts and .netrc files

    - unusual files

    - alterations to key binaries (via signatures generated from CD-ROM)

    - binaries for which security patches exist

    - embedded pathnames'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'As one might expect, these checks can be time and resource-con-

    suming. Tiger can be run on an ad-hoc basis or at regular intervals

    through the cron mechanism. Tiger also includes its own special

    cron-like mechanism that allows you to run certain scripts at spec-

    ified intervals (tigercron). This helps conserve computing resources

    on production machines.


    # Tiger Reporting


    The authors put quite a bit of work into making the Tiger''s report

    format useful. Tiger labels all report items with an error

    classification:


    +   --FAIL-- The problem that was found was extremely serious.

    --WARN-- The problem that was found may be serious, but

    will require human inspection.

    --INFO-- A possible problem was found, or a change in

    configuration is being suggested.

    --ERROR-- A test was not able to be performed for some rea-

    son.


    This allows the user to quickly find and act on priority items.

    Tiger can also provide explanations of the problems it finds.

    Explanations can be inserted directly into the report (using the

    “-e” flag)—this produces verbose output. A separate list of expla-

    nations can also be generated from a report (using the tigexp com-

    mand—/tigexp -f report-file). Finally, you can look up the

    explanation of a single specific item report (using a command like

    /tigexp msgid where msgid is the message ID number.


    > In some instances, Tiger will report on vulnerabilities—like those

    contained in old CERT advisories—that no longer exist (much of

    Tiger was written in 1993 and hasn''t been updated since). Care-

    fully evaluate the timeliness of Tiger warnings before taking

    action.


    # Caution


    # Installing Tiger


    Once nice feature of Tiger is that it’s not necessary to install and

    configure it in order to run it. You can do a “test run” in three easy

    steps:


