  md: '# Firewalls


    This chapter explains what firewalls are and why they’re an important part of
    a defense-in-depth strategy for a UNIX-based and Internet-connected network. It
    presents some of the policy issues related to firewalls, common firewall designs,
    and an overview of firewall tools.'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# Chapter 16 / Firewalls


    In its simplest incarnation, a firewall is a component or set of components that
    restricts access between a protected network (typically a LAN) and the Internet.
    It can be implemented as hardware in the form of a router or computer, software
    running on a gateway system, or some combination.


    The term originally comes from the building industry. Firewalls are commonly built
    of fireproof materials and are often built between adjacent apartments or buildings.
    With a firewall, a fire that breaks out on one side of the wall can be contained,
    preventing it from spreading to neighboring units or structures. Steve Bellovin
    was the first to use the term in the context of computer security in an email
    message to a colleague in 1987.¹ Like many Internet terms, the metaphor between
    the physical firewall and the network firewall is rich—in many ways, there are
    fires breaking out all the time on the net. Very few organizations are interested
    in feeling the heat.


    # Why Firewalls?


    Marcus J. Ranum and Matt Curtin, authors of the Firewall FAQ,² summarize the justification
    for firewalls quite nicely:


    > The Internet, like any other society, is plagued with the kind of jerks who
    enjoy the electronic equivalent of writing on other people''s walls with spraypaint,
    tearing their mailboxes off, or just sitting in the street blocking their car
    horns. Some people try to get real work done over the Internet, and others have
    sensitive or proprietary data they must protect. Usually, a firewall''s purpose
    is to keep the jerks out of your network while still letting you get your job
    done.


    Firewalls are like traffic cops that do one of two things—let traffic go through,
    or block traffic. Like real-world cops, firewalls can be either permissive—in
    so far as they allow a generous flow of traffic—or paranoid in so far as they
    reject all but specific, pre-authorized blocks of traffic. In this way, they embody
    the security policy that the organization wishes to enforce.


    +   1. Bellovin, along with Cheswick, wrote the seminal book Firewalls and Internet
    Security: Repelling the Wily Hacker (Addison-Wesley, 1994).

    2. See http://www.clark.net/pub/mjr/pubs/fwaqf/index.htm'
  merge: -1
  pgno: 343
- img_proc: true
  md: '# Policy Considerations


    Like the ramparts of a medieval castle, well-implemented firewalls can be a critical
    part of a defense-in-depth strategy. Without a firewall, a LAN or subnet is extremely
    vulnerable to external attack on services like NFS of NIS, on weak passwords,
    and on misconfigured servers. Overall network security completely relies on maintenance
    of a consistent, high-level of security on each and every host—a difficult state
    to preserve across a complex network. Firewalls can:


    +   * control access to internal systems so that only mail or public information
    servers are reachable from the outside

    * block access to particular Internet sites on a per-machine or per-user basis

    * improve network security by filtering insecure services like NFS

    * reduce cost and increase efficiency by allowing sysadmins to concentrate security
    efforts on a single system as opposed to each and every host on a LAN

    * enhance privacy by blocking external access to services like finger and DNS,
    which could leak information to attackers

    * monitor communications between an internal network and the Internet in order
    to track down network penetrations or insider malfeasance

    * establish an encrypted link between two remote locations (sometimes referred
    to as a virtual private network)


    # Policy Considerations


    There are two levels of network security policy that need to be established before
    an effective firewall policy be implemented. At the top level is a service access
    policy which specifically lays out what services will be allowed or restricted
    across the firewall, how those services may be used, and how exceptions are handled.
    A realistic balance must be struck between protecting the network from known risks
    and allowing users access to needed network resources. A service access policy
    might state, for example, that only restricted access to mail and information
    servers will be'
  merge: -1
  pgno: 344
- img_proc: true
  md: 'allowed from the Internet, or it may be extended to allow some access from
    the Internet to contain hosts only by authenticated users.


    At a lower level is the firewall design policy that will dictate restriction mechanisms
    are implemented. There are two basic and exclusive strategies that inform firewall
    policy:


    +   - Default permit—permit any service unless it is expressly denied, allowing
    all services to pass by default, with the exception of those that the service
    access policy specifically disallows. This conforms to an “open lab” access model
    that maximizes functionality.


    +   - Default deny—deny any service unless it is expressly permitted, denying
    all services by default, with the exception of those that the service access policy
    specifically allows. This conforms to the classic access model used in many areas
    of information security.


    Neither strategy is full-proof. Default permit is easier to set up in some ways;
    the main task is to identify and deny risky protocols. While a default deny strategy
    closely tailored to the organization’s service access policy provides a higher
    level of security, it can be inconvenient for users. One reason for this is that
    many services—like Windows, FTP, and RPC—are difficult to filter. Another is that,
    as newer services—such as RealAudio—become available, users will be blocked from
    using them until the firewall administrators reconfigure the firewall.


    Like many security policy dichotomies, the two approaches need to be balanced
    and iterated upon. In some cases, services need to be denied because the security
    risk is too high. In others, a risky service may be essential to the mission of
    the organization and will be accommodated despite the risk.


    # Firewall Hazards


    With the corporate rush to exploit the Internet, there’s a tendency to seek out
    “stock” firewall products for purchase. There’s no such thing as a stock firewall—like
    many methods of improving computer security, a firewall requires tight customization
    to the unique'
  merge: -1
  pgno: 345
- img_proc: true
  md: '# Firewall Hazards


    needs and circumstances of a given site. If you seek a standard solution, you
    are on the wrong path. The thought of corporate customers asking vendors for the
    capability to misconfigure their firewalls is disheartening.


    The Computer Security Institute held a “meet the enemy” conference with a group
    of hackers. When asked about commercial firewall packages, the hackers made some
    interesting observations:


    +   First of all, with any commercial firewall that comes in a package, if you
    don''t have the knowledge to configure it, it''s useless to you anyway. It''s
    like going out and buying a car and not knowing how to drive it.


    A commercial firewall package creates its own risk. As one hacker points out:


    +   Two thousand people install ‘Super Firewall X’ at their sites, and then I
    sit down for a week or two and crack ‘Super Firewall X’—hey, we''ve just cracked
    two thousand sites.


    Another hacker offered a gem of wisdom concerning essential trained firewall administrators
    are:


    +   You have to have someone dedicated to the security of your network. You have
    to have someone who knows it inside and out—someone who can recognize when the
    system has problems, it''s not just because Bob did something weird last shift.


    Firewalls can breed a false sense of security. Some sites seem to feel that having
    a firewall, any firewall, makes their site secure against any form of attack.
    There''s a saying amongst gurus: it''s altogether possible to have a vault for
    a front door and screen doors in the back. As a perimeter defense, a firewall
    is only one piece of the puzzle—one tactic of many needed to provide an Internet
    site with defense-in-depth.


    A firewall will not protect an organization from attacks by insiders who operate
    behind the firewall. Some companies have


