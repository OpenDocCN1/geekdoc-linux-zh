    System systems have a slightly different process accounting system. The accounting
    is turned on with the startup command (/usr/lib/acct/startup/). The accounting
    file is usually /var/adm/pact—it is accessed via the acct command (rather than
    the last command described above).


    > Tip


    # The syslog Facility


    In many respects, the development of UNIX and UNIX clone systems has been somewhat
    haphazard. At no point did a dedicated software engineer sit down, plan, and implement
    an overall logging scheme. To this owe the ascendancy of the syslog facility—a
    general purpose logging facility that was originally developed at the University
    of California Berkeley for part of themail program. Over the years, syslog has
    been adapted for many logging functions and ported to many UNIX systems including
    those based on System V and Linux. Even more than the extensive time process accounting
    systems described earlier in this chapter, it casts a wide net of protection—any
    program can log events via syslog. In turn, syslog can log to the system console,
    can write to a file or a device, or can send a message to a user. It can log events
    locally or on another host over a network.


    ![](img/1a7ecd5e8d14f7d50a9df943b7efac99_202_0.png)'
  merge: -1
  pgno: 202
- img_proc: true
  md: 'The syslog facility is based on two key elements: /etc/syslogd (the daemon)
    and the /etc/syslog.conf configuration file. By convention, most syslog messages
    are written to the messages file, which lives in either the /var/adm or /var/log
    directories, though they can be written anywhere.


    A typical syslog record cites the name of the generating program and a text message.
    It also includes a Facility (a categorization of the source of the message) and
    a Priority ranging from “info” (informational) to “emerg” (an emergency)—these
    are critical to syslog behavior but typically don''t appear in the logs.


    # Facilities


    Each syslog message is assigned to one of the following major facilities:


    +   * LOG_AUTH—The authorization system: login, su, getty, etc.

    * LOG_AUTHPRIV—The same as LOG_AUTH, but logged to a file readable only by selected
    individuals

    * LOG_CRON—The cron daemon

    * LOG_DAEMON—Other system daemons, such as routed

    * LOG_FTP—The file transfer protocol daemons: ftpd, tftp

    * LOG_KERN—Messages generated by the kernel (as opposed to user processes)

    * LOG_LPR—The line printer spooling system: lpr, lpd

    * LOG_MAIL—The mail system

    * LOG_NEWS—The network news system

    * LOG_SYSLOG—Messages generated internally by syslogd(8)

    * LOG_USER—Messages generated by random user processes; the default facility if
    none is specified

    * LOG_UUCP—The UUCP system

    * LOG_LOCAL0...LOG_LOCAL7—Reserved for local use'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# The syslog Facility


    # Syslog Priorities


    The syslog daemon assigns one of several different priority levels to each event:


    +   - LOG_EMERG—A panic condition (normally broadcast to all users)


    +   - LOG_ALERT—A condition that should be corrected immediately, such as a corrupted
    system database


    +   - LOG_CRIT—Critical conditions, e.g., hard drive errors


    +   - LOG_ERR—Errors


    +   - LOG_WARNING—Warning messages


    +   - LOG_NOTICE—Conditions that are not error conditions, but might require special
    handling


    +   - LOG_INFO—Informational messages


    +   - LOG_DEBUG—Messages that contain information normally of use only when debugging
    a program


    # syslog.conf


    The syslog.conf file specifies the logging behavior of the syslogd program, which
    consults the configuration file when it starts up. Most UNIX systems ship with
    a reasonable baseline of syslog.conf settings. Nevertheless, it''s a system administrator''s
    duty to review these settings to ensure that the level of logging is appropriate
    and consistent with security policy.


    The file consists of individual entries for different programs or message categories,
    each on its own line. For each message category, a selector field and an action
    field are presented. These fields are separated by a tab:


    +   - the selector field specifies the types of messages (facilities) and priorities


    +   - the action field specifies the action to be taken if a message syslog receive
    matches the selection criteria'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# Tip


    Old versions of syslog.conf require tabs separate the fields, not spaces. Newer
    versions will accept either tabs or spaces. Use tabs if you wish to maintain backward
    compatibility.


    Each selector is composed of paired facility and priority. As noted in the bulleted
    list above, the facility can be one of the following: auth, authpriv, cron, daemon,
    ftp, kern, lpr, mail, news, syslog, user, uucp, and local0 through local7. The
    priority can be one of emerg, alert, crit, err, warning, notice, info, and debug.


    When you specify a priority, syslog will log a message whenever that priority
    or a higher one is generated. If you specify level “crit,” all messages marked
    crit, alert, or emerg will be logged. Note that the list in the previous section
    is in priority order.


    The action field of each line specifies where a message should be sent when the
    selector field selects a given message. It takes one of five forms:


    +   - a pathname (preceded by “/”)—selected messages are appended to the specified
    file or device

    - a hostname (preceded by “@”)—selected messages are forwarded to the syslog daemon
    on the named host

    - a list of users (comma delimited)—selected messages are written to those users
    (if they are logged in)

    - an asterisk—selected messages are written to all logged-in users

    - a command (preceded by a vertical bar (“|”)—selected messages are piped


    If, for example, you want to log all mail messages into a single file, the following
    line would be appropriate (the “#” indicates a comment):


    ```

    # Log all the mail messages in one place.

    mail.* /var/log/maillog

    ```


    The syntax is fairly straightforward—for all mail messages (mail.*), write to
    the file /var/log/maillog.'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# The syslog Facility


    Other facilities (programs) also get their own logs. The UUCP and news facilities
    can generate a lot of extraneous messages. It makes sense to store them in their
    own log (say, /var/log/spooler) and restrict logging to level “err” or higher.


    +   # Save mail and news errors of level err and higher in a # special file.

    uucp.news.err /var/log/spooler


    When an emergency message comes down the pike (*.emerg), you want all your users
    to get it. Plus, you want your dedicated loghost (foo7.example.com) to receive
    and store it.


    +   # Everybody gets emergency messages, plus log them on # another machine.

    *.emerg

    *.emerg @foo7.example.com


    Alert messages should be written both to root and to Alice’s personal account.


    +   # Root and Alice get alert and higher messages.

    *.alert root,alice


    Sometimes syslogdd will produce too much information. The kernel (the “Kern” facility),
    for example, can be verbose. You might want to log kernel messages to /dev/console,
    or you might want to suppress reporting them altogether. In the example below,
    the line specifying kernel logging is commented out.


    +   # Log all kernel messages to the console.

    # Logging much else clutters up the screen.

    #kern.* /dev/console


    You can specify all facilities in one line. The example below sends everything
    of level info or higher to /var/log/messages, except for mail (mail.none). The
    level “none” disables a facility.


    +   # Log anything (except mail) of level info or higher.

    # Don''t log private authentication messages!

    *.info:mail.none;authpriv.none /var/log/messages'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# Logging Everywhere


    Setting up logging is not trivial. Logging policy needs to be an integral part
    of an overall security plan, so that an adequate audit trail is maintained. You
    need to preserve the integrity and availability of logs, , and decide where they
    will be kept. Given the relatively low-cost of hard disks and the ubiquity of
    LANs, it makes sense for substantial installations to be generous in both what
    is captured and where it is kept. One way to improve availability is to send log
    messages to multiple devices and hosts.


    With a network of any size, it makes sense to send significant messages to one
    or more dedicated loghosts—security-enhanced machines that do nothing but accept
    incoming syslog messages. Even if a given system is compromised, you''re still
    be able to trust the dedicated loghosts being reporting to. Ideally, a dedicated
    loghost doesn''t have any user accounts, and all unnecessary services should be
    turned off.


    In some situations, it makes sense to log to a printer. A network intruder''s
    compromised system may be able to cover his or her tracks by altering log files.
    It''s tough to hack old-fashioned hard copy. This trick was used by Cliff Stoll
    to track down intruders who were able to alter online log files. Some nights he''d
    sleep right next to the log printer just in case it ran out of paper. This points
    points to a vulnerability of printer logging—printers have a tendency to run out
    of supplies or jam. Don''t depend on a printer as a sole logging target.


    In general, be generous with logging. The more places you send messages to be
    logged, the more difficult it becomes for an attacker or intruder to erase evidence.
    The following syslog.conf entries will log all messages to a loghost (foo7) and
    all authentication messages to a printer attached to the local host /dev/tty:


    ```

    auth.* /dev/tty

    *,** @foo7.example.com

    ```


    # Protecting Syslog


    The syslog facility is an obvious target for an attacker or intruder. A system
    that maintains logs for other hosts is particularly vulnerable to denial of service
    attacks—an attacker could subvert syslogd'
