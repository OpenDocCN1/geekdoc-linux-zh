    # Trojan Horses


    Trojan Horse is an “apparently useful program containing hidden functions that
    can exploit the privileges of the user, with a resulting security threat. A Trojan
    horse does things that the program user did not intend.” It usually performs a
    useful function while it also subverts security-checking program, for example,
    that mails the etc/passwd to an intruder. This method of attack was first described
