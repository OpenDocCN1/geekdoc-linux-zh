  md: '# Internet Mailing Lists/Newsgroups


    There are several Internet mailing lists and newsgroups relevant to UNIX system
    security. Follow the URLs to find subscription instructions.


    Bugtraq

    http://www.geek-girl.com/bugtraq/index.html—A full-disclosure UNIX security mailing
    list


    comp.security.unix

    news:comp.security.unix—Lively discussion of UNIX security issues, debates, complaints,
    announcements, and more. The comp.security hierarchy also includes groups devoted
    to security announcements, PGP, SSH, etc.


    Cu Digest

    http://sun.soci.niu.edu/~cudigest/—Per the home page: “The Cu Digest is a more-or-less
    weekly digest/newsletter/journal of debates, news, research, and discussion of
    legal, social, and other issues related to computer culture.”


    Firewall Wizards

    http://www.nfr.net/forum/firewall-wizards.html—This moder-ated firewall and security-related
    list is more like a journal than a public soapbox.


    The PRIVACY Forum

    http://www.vortex.com/privacy.html—Built around a moderated email digest for the
    discussion and analysis of issues relating to the general topic of privacy


    redhat.security.general

    news:redhat.security.general—A mailing list/newsgroup devoted to Red Hat Linux
    security issues'
