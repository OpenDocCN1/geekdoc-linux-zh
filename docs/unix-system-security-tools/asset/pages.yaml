  md: '# A Taxonomy of Computer Security


    Computer security is frequently associated with three core areas, which can be
    conveniently summarized by the acronym “CIA":


    +   - Confidentiality—Ensuring that information is not accessed by unauthorized
    persons

    - Integrity—Ensuring that information is not altered by unauthorized persons in
    a way that is not detectable by authorized users

    - Authentication—Ensuring that users are the persons they claim to be


    A strong security protocol addresses all three of these areas. Take, for example,
    Netscape’s SSL (Secure Sockets Layer) protocol. It has enabled an explosion in
    ecommerce which is really about trust (or more precisely, about the lack of trust).
    SSL overcomes the lack of trust between transacting parties by ensuring confidentiality
    through encryption, integrity through checksums, and authentication via server
    certificates (see “Protecting Against Transmission Risks” on page 317).


    Computer security is not restricted to these three broad concepts. Additional
    ideas that are often considered part of the taxonomy of computer security include:


    +   - Access control—Ensuring that users access only those resources and services
    that they are entitled to access and that qualified users are not denied access
    to services that they legitimately expect to receive

    - Nonrepudiation—Ensuring that the originators of messages cannot deny that they
    in fact sent the messages

    - Availability—Ensuring that a system is operational and functional at a given
    moment, usually provided through redundancy; loss of availability is often referred
    to as “denial-of-service"


    > 9. Bryan Pfaffenberger, Webster’s New World Dictionary of Computing Terms, Sixth
    Ed. (New York: Simon and Schuster, 1997).'
