    the four distinct directories that Tiger uses. Edit these for your system:

    * TIGERHOME—contains the tiger, tigeron, and tigerexp scripts, as well as the
    scripts subid (where the checking scripts live) and systems subdirectory (where
    binaries live); the default is /usr/local/tiger

    * TIGERWORK—used for scratch files; the default is /usr/spool/tiger/work or /var/spool/tiger/work

    * TIGERLOG—this is where security reports will go; the default is /usr/spool/tiger/logs
    or /var/spool/tiger/logs

    * TIGERBIN—where binaries live (if they''re not in TIGERHOME/systems); the default
    is /usr/spool/tiger/bin or /var/spool/tiger/bin


