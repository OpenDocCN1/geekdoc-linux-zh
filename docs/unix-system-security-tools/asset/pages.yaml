  md: '# Introduction


    This chapter starts off with a practical definition of UNIX, a quick UNIX history,
    and a snapshot of the different UNIX variants. It presents a taxonomy of computer
    security and related concepts. It introduces the world of UNIX security tools
    and cites criteria for evaluating security tools. This chapter also discusses
    the security implications of open-source software and makes an argument for a
    full-disclosure approach to security. It concludes with an overview of several
    important rules to think about when planning for and implementing system security.'
  merge: -1
