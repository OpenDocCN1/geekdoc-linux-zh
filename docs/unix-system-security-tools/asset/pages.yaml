  md: '# Running Swatch


    # Table 9.1 Swatch Options (Cont''d)


    | Option | Description |

    | -P pattern_separator | Use the specified pattern_separator when parsing the
    patterns in the configuration file—a comma is the default |

    | -A action_separator | Use the specified action_separator when parsing the actions
    in the configuration file—a comma is the default |

    | -I input_record_separator | Use the specified input_record_separator as the
    character(s) which mark the boundary of each input record—a carriage return is
    the default |


    # Auditing Arbitrary Logfiles


    Swatch can examine any of the many text logfiles kept on UNIX and Linux systems.
    If I wanted to look at visits from Example.com employees to one of my client''s
    web sites (let''s call her Alice)


    ```

    # swatch -c .swatchrc-ex -f /var/opt/www/alice_access_log

    ```


    Swatch takes a single pass on the 100 MB logfile and finds thousands of messages
    that look like:


    ```

    foobar.example.com - [02/May/1999:23:37:17 -0700] "GET /futureplans/index.html
    HTTP/1.1" 200 17684

    ```


    Perhaps someone is interested in purchasing Alice’s secret cookie recipe. Log
    file auditing with the “-f” flag can yield all kinds of information. It can be
    particularly helpful when a system administrator has been away from the terminal
    for the long-delayed vacation and wants to catch up.


    > Tip When examining an arbitrary logfile that doesn''t separate records with
    a carriage return, you may need to use the “-l” flag to specify an input_record_separator.'
