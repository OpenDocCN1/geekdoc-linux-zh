    # SMTP/sendmail


    The Simple Mail Transfer Program (SMTP) is the TCP/IP standard for exchanging
    email between computers. It specifies how the underlying mail delivery system
    passes messages from end point to end point. It does not concern itself with the
    user interface to mail, how the mail system accepts mail, or how mail is stored.
    Nor does it require a specific transmission subsystem, though by convention SMTP
    communication occurs on TCP port 25.


    # Tip


    Email has been a core network service since the first computer networks were built.
    See Jon Postel''s RFC 821 for a circa 1982 explanation of SMTP—See http://www.faqs.org/rfcs/rfc821.html
    Also of interest: David H. Crocker''s seminal RFC 822, the guide to email syntax—See
    http://www.faqs.org/rfcs/rfc822.html


    # Sendmail Basics


    On most UNIX systems, the sendmail program implements both the client and the
    server side of SMTP. The sendmail facility is known as a Mail Transport Agent
    (MTA), as opposed to a Mail User Agent (MUA). It processes mail for delivery to
    individuals and mailing lists, relays mail from one machine to another, appends
    mail to files, and provides mail as standard input to programs. Newer versions
    contain extensive options for defeating spam or Unsolicited Commercial Email (UCE),
    the bane of every Internet mail user.'
