  md: 'If you need to run FTP, consider the following steps:


    +   - As with any security-sensitive software, make sure you''ve installed the
    latest version of UNIX vendor''s ftptd.


    +   - Newer versions of ftptd support extensive logging. The “l-” flag logs successful
    and failed ftp sessions to syslog. Additional flags support further logging for
    anonymous FTP transfers (-S) and current ftp users (-U). Set your ftptd to log
    extensively and monitor the output on a regular basis (daily on a busy site).


    +   - Provide a restricted FTP environment by setting up the file /etc/ftpchroot.


    +   - If you need anonymous FTP, review the anonymous FTP configuration guidelines
    posted by CERT at http://www.cert.org/advisories/CA-93.10.anonymous.FTP.activity.html


    This document was released in 1993 in response to a rash of FTP problems.


    +   - If you need anonymous FTP, make sure that the anonymous FTP home directory
    (-ftp) is not owned by the user ftp. This might allow attackers to add or modify
    files. The FTP root directory and all its children should be owned by root. Note
    this contradicts the advice provided by some dated man pages.


    +   - If you need anonymous FTP, host it on a machine that''s outside your trusted
    internal network or intranet. Depending on your firewall configuration, you may
    be able to situate the host in the Demilitarized Zone (DMZ) (see “Screened Subnet”
    on page 331).


    +   - If you need to provide “drop-off” service, institute a policy that requires
    the sysadmin to check incoming files before they''re made publicly available.


    +   - Contain the risk of a denial-of-service attack by locating the anonymous
    FTP directory on an isolated partition or disk or by placing a disk quota on the
    ftp user.'
