  md: '# Cryptography


    # PGP


    Originally created by Philip R. Zimmermann in 1991, PGP has had a colorful history.
    It was the subject of a series of disputes due to its use of the patented RSA
    public-key cipher. It also got tangled in US crypto export controls–Zimmermann
    was the target of a three-year criminal investigation. The government held that
    US export restrictions for cryptographic software were violated when the freeware
    program managed to cross the US border. Despite the notoriety, PGP became the
    leading program for email encryption; version 2.6 was widely distributed and implemented
    on UNIX and other systems. The program is now owned by Network Associates (an
    entity formed by the mergers of McAfee, Network General, Helix, and Zimmermann''s
    company, Pretty Good Privacy, Inc.). A “free for non-commercial use” version is
    available from MIT.


    PGP is primarily designed to protect messages, especially electronic mail. It
    uses the IDEA cipher for data encryption, RSA for key management and digital signatures,
    and MD5 as a one-way hash function. PGP messages feature layered security: not
    only the contents disguised, but so is the sender''s signature. An eavesdropper
    only knows the recipient for certain.


    PGP can also be used to encrypt locally-stored files. In Listing 6.1, I encrypt
    the file using the “c” flag. I enter a passphrase which is not echoed by the program.


    # Listing 6.1 Encrypting a File with PGP


    ```

    $ ls -al | grep foo

    --rw-r--r-- 1 Jandom 21906 Mar 15 11:04 foo

    $ pgp -c foo

    ```


