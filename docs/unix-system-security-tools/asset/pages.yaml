    # ICMP


    One final TCP/IP protocol deserves mention: the Internet Control Message Protocol
    (ICMP), ICMP is a special messaging mechanism that allows routers to report errors
    or unexpected circumstances. ICMP is an integral part of the Internet Protocol.
    An ICMP message is sent from the IP software on one machine to the IP software
    on another.


    One of the most significant uses of ICMP is to test reachability. The ICMP echo
    request and echo reply message types are used by the ping command via a simple
    mechanism: A host sends an echo request to a second host; the receiving host receives
    the request and sends back an echo reply. Ping is invaluable when building a network.
    A successful result means that the machine is routing packets, and that intermediate
    machines are routing correctly, and that ICMP are working on both ends.


    > ICMP is described in detail in RFC 792 by Jon Postel. For more information,
    see http://www.faqs.org/rfcs/rfc792.html


