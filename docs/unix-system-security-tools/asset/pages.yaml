  md: '# Chapter 12 / Tiger


    Tiger then checks SUID binaries for potential problems. I''ve cut several messages
    similar to the two listed below. Tiger knows about a CERT-documented vulnerability
    and is smart enough to report on a file that might be affected. In this case,
    the potential hole was closed several years ago.


    The warning about relative pathnames in the uucp program is not all that serious.
    On the other hand, it raises the question: why is the UUCP facility installed
    on this machine in the first place?


    # Checking setuid executables...


    ```

    --WARN-- [misc013w] /usr/X1R6/bin/xterm: see CERT Advisory

    CA-93:17 about a security hole in xterm.

    ```


    CERT Advisory CA-93:17


    The xterm utility contains a vulnerability which allows any file to be overwritten,
    or the ownership of the file changed. Consult vendors for patches for supported
    versions of xterm. MIT Patch 26 for X11R5 contains a patch for the MIT distribution.


    ```

    --WARN-- [fsys002w] setuid program /usr/bin/uucp has

    relative pathnames.

    ```


    The listed program is a setuid executable (do not start with a ''/''). This often
    represents a security hole in the program. These relative pathnames can be caused
    by system()* or popen()* calls which do not use full pathnames to the executable,
    or, on systems that support dynamic linking, relative pathnames indicating the
    directories containing the libraries. In any case, these need to be checked.


    *Note: system() and popen() should *never* be used from a program which is executing
    with privileges.


    Before I ran Tiger, I deliberately inserted a SUID root Trojan Horse. As root,
    I created a copy of the bash shell, copied it to Mallory''s home directory, and
