    # SOCKS


    SOCKS is a networking proxy protocol that enables hosts on one side of a SOCKS
    server to gain full access to hosts on the other side of a SOCKS server without
    requiring direct IP reachability. SOCKS includes two primary components: the SOCKS
    server and the SOCKS client library. The server authenticates and authorizes connection
    requests, establishes proxy connections, and relays data. The client library sits
    between the client''s application and transport layers. Because of its simplicity,
    SOCKS has been widely used as a circuit-level firewall; hosts behind a SOCKS server
    can gain full access to the Internet while clients remain hidden to the Internet
    hosts they access. There are two versions of SOCKS available. SOCKS V4 performs
    three functions: connection requests, proxy circuit setups, and application data
    relays. SOCKS V5 adds authentication.


