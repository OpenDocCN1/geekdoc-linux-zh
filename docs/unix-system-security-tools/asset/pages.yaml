    # Password Aging


    Time is a critical factor in maintaining the confidentiality of passwords. The
    longer a password is in use, the greater the likelihood that it will be compromised
    (see “Rule 1: Security Through Obscurity Doesn’t Work” on page 21 and the equation
    on page 59). Many UNIX implementations (and System V Release 4-based systems in
    particular) support password aging—the ability to expire passwords after a set
    interval time. This feature is often enabled in the /etc/shadow file (see “Anatomy
    of /etc/shadow” on page 76). Typically, users are warned in advance that their
    passwords are about to expire.


    Military-grade security mandates the deployment of password aging. According to
    the Department of Defense’s “Password Management Guideline”:⁴


    There should be a maximum lifetime for all passwords. For protection against unknown
    threats, it is recommended that the maximum lifetime of a password be no greater
    than 1 year. The presence of known threats may indicate a need for a shorter lifetime.


    In addition to a maximum lifetime, some systems assign a minimum lifetime—this
    prevents users from changing their passwords when they expire and then immediately
    changing them back.


