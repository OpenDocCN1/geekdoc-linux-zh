  md: '# Introduction


    Security through obscurity, or by relying on secrets, is a tricky business (see
    “Rule 1: Security Through Obscurity Doesn’t Work” on page 21). While it’s risky
    to rely on a secret to provide security, it’s even riskier to rely on a secret
    that can be guessed by an opponent.


    The UNIX password scheme relies on secrets—alphanumeric strings—that exist in
    a finite space. Passwords, however, are vulnerable to the frailties of human psychology,
    and even a complex “random” password guessing scheme can be reduced to ultimately
    revealing algorithm.


    Crack takes an /etc/passwd file as input, scans the file’s contents looking for
    weak passwords, and reports its findings. It should not be confused with dozens
    of other programs—some of which may use the word “crack” or “rip” in their names—that
    are designed to break either system or application security.


    It should also not be confused with the general practice of system “cracking.”
    Crack 5.0a was written by British programmer Alex Muffett with the assistance
    of several well-known members of the UNIX community.¹ While it finds weak passwords
    and reports on them—thus potentially aiding “crackers”—it does not create any
    security problems that didn’t already exist due to either weak passwords or the
    lack of shadow passwords.² Crack is not particularly useful for defeating any
    particular user’s password—it’s designed to run against weak passwords in general
    rather than a given hashed password choice. Despite the misgivings that some may
    have, Crack is a completely legitimate tool that is widely deployed and run as
    part of standard system administration practice.


    While Crack is a legitimate tool for system security, you should only install
    and run it with explicit authorization. Obviously, if


    +   1. Muffett admits in the appendix that comes with the program that “Passcheck”
    might be a better name for the program. This would free it from the negative connotations
    of the word “crack,” which extend beyond the field of computer security.

    2. If there were a single argument for shadow passwords, which can only be viewed
    by root, Crack would be it. If an attacker already has root privilege, he or she
    won’t benefit from running Crack.'
