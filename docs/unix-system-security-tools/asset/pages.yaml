  md: '# Cryptography


    +   DES—The Data Encryption Standard was developed by NIST (National Institute
    of Standards and Technology) in the 1970s. It remains a worldwide standard. This
    symmetric cipher uses a 56-bit key. A modified form is used in the UNIX password
    encoding system. Some UNIX systems include a general purpose implementation; it''s
    not as ubiquitous as it could be due to US crypto export regulations. The security
    of DES is suspect; DES-cracking times continue to plunge—see http://www.eff.org/descracker/


    NIST no longer supports the use of the DES for many applications. Triple DES is
    a method for using the DES algorithm in three operations—NIST advises that it
    should be used instead of DES (see the draft FIPS at http://csrc.nist.gov/fps/ips46-3.pdf).
    Eventually, NIST will promulgate a more advanced standard (AES). In the meantime,
    you can find Eric A. Young''s encryption library, libdes, at ftp://ftp.py.uq.oz.au/pub/Crypto/DES/


    +   IDEA—The International Data Encryption Algorithm (IDEA) was first developed
    by Xuejia Lai and James Massey in 1990. IDEA is a block cipher that operates on
    64-bit plaintext blocks, the key is 128 bits long. IDEA is implemented in Pretty
    Good Privacy (PGP), a widely-used crypto program.


    +   RC4—This stream cipher was developed by Ron Rivest for RSA Data Security,
    in 1987. It uses keys of variable length. It is sometimes used for communications
    security (see “Setting Up a TLS/SSL Server” on page 320).


    +   Blowfish—This block cipher was developed by Bruce Schneider in 1993 as a general
    replacement for DES. It can be deployed for communications security. It is also
    used by at least one UNIX variant to encode passwords (see “Alternative Algorithms”
    on page 79).


    See Federal Information Processing Standards (FIPS) Publication 46-2 (1993), Announcing
    the Standard for DATA ENCRYPTION STANDARD (DES), at http://www.itl1.nist.gov/div897/pubs/fips46-2.htm'
