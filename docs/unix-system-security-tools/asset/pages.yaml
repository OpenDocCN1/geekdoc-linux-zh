    Traffic in Arms Regulation (ITAR). The ITAR category for “Auxiliary Military Equipment”
    includes Cryptographic (including key management) systems, equipment, modules,
    integrated circuits, components or software with the capability of maintaining
    secrecy or confidentiality of information or information systems.


    From the point of view of practical system security, this sucks. Many implementations
    of UNIX are crippled by their creators in order to avoid creating a US-only product.
    In many cases, weak DES is set aside as a separate product. This disease has both
    commercial vendors and freeway distributions. One remedy is to deploy a UNIX not
    created in the US—like OpenBSD, which is distributed by a group based in Canada.


    # Practical Crypto Algorithms


    There are several crypto algorithms which are widely implemented in the UNIX universe.


    +   - crypt—The original UNIX encryption program based on the WWII-era Enigma
    machine. It can be be easily broken—unlike the crypt (3) library (see the “Crypt
    Breakers Workbench (CBW)” on page 148. Nonetheless, it is fun to play with. Try
    improving security by encrypting a compressed file several times, using a different
    key with each round. For real encryption, use DES or PGP.


    See http://www.epic.org/crypto/export_controls/ITAR.html'
