    sure your wallet is secure at all times. In Cyberpunks, John Markoff and Katie
    Hafner describe how a wily cracker named Susan Thunder would pick up military
    officers at bars outside bases and go home with them. In the wee hours, she''d
    rifle through the officer''s personal affects searching for logins and passwords.


    +   - If you must record passwords, never write down username and password combinations,
    or associate either with a specific system or telephone number.

    - If you must record a password, garble it in a way you can remember. Add extra
    characters, invert the order of characters, or truncate it.

    - Never attach a password to any piece of computer hardware, especially monitors
    (and especially if you''re hosting nationally broadcasted TV segments).


    # The Password Mechanism


    On many UNIX systems, passwords and other user information are stored in the /etc/passwd
    file. The passwords displayed in this file are encoded using a one-way hash function—an
    algorithm that is easy to compute in one direction but computationally expensive
    to compute in the reverse direction.


    In a landmark paper, Robert Morris and Ken Thompson described how this “elaborate
    and strange design” evolved over the course of several years. Early UNIX systems
    stored user passwords in a flat readable “password file” that could be intercepted
    and exploited without a sysadmin noticing. It was also subject to happenstance.'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# Morris and Thompson tell of an embarrassing lapse on an early time-sharing
    system, when one system administrator was


    editing the password and another system administrator was editing the daily message
    that is printed on everyone''s terminal at login. Due to a software design error,
    the temporary editor files of the two users were inter and thus, for a time, the
    password file was printed on every terminal when it was logged in.


    Starting with Version 6 of AT&T UNIX, Thompson et al decided to take a different
    approach: UNIX passwords were encoded using a rotor-based algorithm modeled after
    the US Army''s M-209 cipher machine. This fast algorithm proved vulnerable to
    exhaustive plaintext searches and was replaced by a more advanced crypt() library
    that first appeared in Version 7 AT&T UNIX.


    # Caution


    The crypt() library should not be confused with the crypt encryption command,
    which is based on the German Enigma machine. The crypt command (also known as
    enigma) provides only nominal security—it can be defeated by the Crypt Breaker''s
    Workbench (CBW), a collection of tools released by Robert W. Baldwin in 1986 (see
    page 148).


    # The crypt () Algorithm


    At the heart of the UNIX password encoding mechanism is a derivation of DES (Data
    Encryption Standard), which usually uses a 56-bit key (eight 7-bit characters)
    to encrypt 64-bit blocks of clear text. The traditional UNIX crypt() function
    takes the user''s password, pads it out to eight characters, and then uses seven
    bits of each character to form a 56-bit DES key. This key is used to encrypt a
    64-bit block of zeros (00000000).


    +   1. Robert Morris and Ken Thompson, “Password security: A Case History.” In
    Unix Programmer''s Supplementary Documentation. AT&T, November 1979. See ftp://coast.cs.purdue.edu/pub/doc/passwords/morris.password_security_case_study.psz'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'repeated 25 times. The final output of the process is written into a string
    of 11 characters and stored in the /etc/passwd file.


    It is practically impossible to reverse this process, to take an encrypted password
    and work back to the plaintext version. This method of encoding is, however, vulnerable
    to a dictionary attack. A large corpus of words can be encrypted, stored, and
    then compared to the encoded passwords found in /etc/passwd.


    In order to make the DES-based scheme stronger and more resistant to dictionary
    attack, the designers of the traditional UNIX password mechanism added “salt”—a
    12-bit number, between 0 and 4095. The salt is used to perturb the DES algorithm
    so that each of the 4096 possible salt values causes a given plaintext password
    to encode to a different value.


    When a user picks or changes a password, the /bin/passwd program selects a salt
    based on the time of day, converts it into a two-character string, and stores
    that string as the first two characters of the encoded entry in /etc/passwd. Thus,
    a complete password entry consists of 13 characters: two for the salt, followed
    by 11 for the coded password.


    Figure 3.1 illustrates the UNIX password mechanism.


    ![](img/1a7ecd5e8d14f7d50a9df943b7efac99_74_0.png)


    # Figure 3.1 UNIX Password Encoding


    > The encoded entry in /etc/passwd is often described as the “encrypted password.”
    But as described above, the plaintext password is used as the key for encrypting
    a block of zeros—it has been encoded, but it''s actually the block of zeros that''s
    encrypted.'
  merge: -1
  pgno: 74
- img_proc: true
  md: 'When a user supplies a plaintext password to the /bin/login program, the salt
    is retrieved from the encoded password. Then, the supplied password is used as
    the key to encrypt a block of zeros, using the salt value as a seed. This is then
    compared with the encoded password. If there is a match, then the user is authenticated.


    Salt makes attacks against encoded passwords using precompiled dictionaries more
    expensive. Instead of decoding a single encoded run on each word in a dictionary,
    the attacker now has to encode and store 4096 permutations of each word in the
    dictionary. While this was a substantial resource barrier when salt was introduced
    over twenty years ago, a 12-bit salt can no longer be considered an effective
    safeguard (see "Password Vulnerabilities" on page 58).


    > You can find out more how passwords are encoded in the /etc/passwd file by consulting
    your system''s man page for crypt(3).


    # Anatomy of the Passwd File


    Each entry in the passwd file looks something like the following:

    name:coded-passwd:UID:GID:user-info:home-directory:shell


    Each of the seven fields is separated by a colon. Blank spaces are not allowed,
    except in the user-info field. Here’s a summary of what each field means:


    +   - name—This is the username assigned to the user. Typically, this is not proprietary
    information.


    +   - coded-passwd—The user''s encoded passwd. If a sysadmin needs to prevent
    a user from logging in, he or she will often replace this field with an asterisk
    (*). In general, this field isn''t edited manually. Users should change their
    passwords using the passwd command. It is important to note that many recent UNIX
    implementations rely on "shadow passwords”—passwords that are not stored in /etc/passwd
    (see "Managing Accounts" on page 61).'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# The Password Mechanism


    +   UID—The user''s unique identification number. By convention, UIDs smaller
    than 100 are reserved for system accounts.


    +   GID—The user''s primary group membership. Usually, this will determine the
    group ownership of the files the user creates. Under Red Hat Linux, each user
    account is assigned its own unique group by default.


    +   user-info—By convention, this contains the user''s full name. Mail systems
    and utilities like finger traditionally use the information in this field. This
    field is also known as the GECOS field.


    +   shell—This field specifies a path to the command interpreter that will be
    executed when the user logs in. There are several popular shells, including the
    Bourne shell (/bin/sh), the C shell (/bin/csh), and the Bash shell (/bin/bash).
    Note that it''s possible to assign a value of /bin/false to this field for users
    to prevent them from logging in.


    So, the following `/etc/passwd` entry:


    ```

    jrand:Npge08pf4wuk:513:100:J. Random Hacker:/home/jrand:/bin/csh

    ```


    indicates that the user J. Random Hacker has the username jrand, UID 513, GID
    100, a home directory *home/jrand*, the C shell as a default, and a salted password.
    Note that the salt is contained in the first two characters of the coded-password
    field. In the example above, “Np” is the salt and “ge08pf4wuk” is the encoded
    password. The encoded salt/password combination could just as easily have been
    `kbeMnZM00oLL7`: these two strings result from encrypting the same password. The
    example password in this case is “password”—don’t use this example!


    This example comes from Michael H. Jackson''s Linux Shadow-Password-HOWTO, http://metalab.unc.edu/LDP/HOWTO/Shadow-Password-HOWTO-2.html'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'The fact that the same password encodes two (actually 4096!) different ways
    highlights a significant security feature of salt—even if two users have the exact
    same password, it will encode differently. This prevents an easy line of attack
    whereby a user notices another user has the same password and can thus abuse or
    subvert the other user''s account.


    # Password Vulnerabilities


    There are two fundamental problems with the traditional UNIX password system:
    guessable passwords and the inevitable march of progress.


    Some of the leading minds in computer security have been analyzing the problem
    of guessable passwords for decades. While the number of eight-character combinations
    of letters and digits is huge, human psychology falls back on a relatively small
    space of memorable dictionary words and derivatives. Morris and Thompson found
    of 3,289 passwords they analyzed, 86% contain one or more significant weaknesses.
    It took them five minutes of dictionary searching to guess a third of them. One
    researcher compiled over 15,000 password entries and was able to crack 21% within
    a week, using late 1980s hardware. The human tendency toward guessable passwords
    leaves the password system, and thus, account security, very vulnerable to dictionary
    attack.


    Time has not been kind to the security of the UNIX password mechanism. The DES-based
    encoding system was designed to be slow, and for many years it protected against
