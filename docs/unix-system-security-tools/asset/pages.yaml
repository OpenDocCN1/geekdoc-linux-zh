- img_proc: true
  md: '# The Login Records


    business manager compiling programs? Is that one of your programmers in nine in
    the morning?


    Be attentive. Curious. Think like a shopkeeper who keeps close eye on who is coming
    into and leaving the store. Run wr when you first log in and before you log out
    at the end of the day (night). Observe bad logins—they could presage someone breaking
    in. In run ac to see who''s hog system resources—is an email-only user submitting
    huge jobs? Eternal vigilance is the price of security.


    ```

    One hole in the logging net is su command, which does not update utmp and wtmp
    files when a user substitutes one effective ID for another. This can lead to some
    strange consequences such as when su''ed user runs mail or another program that
    consults the utmp file. Fortunately, su maintains its own log (see “sulog” on
    page 189).

    ```


    Caution


    # The who Command


    The who consults the utmp file and reports on each user currently logged in. By
    default, the output of who includes username, terminal type, the login date and
    time, and remote host (if there is one).


    ```

    $ who

    root ttyl May 15 16:09

    bob console May 15 14:49

    alice tty2 May 16 00:13

    carol tty3 May 11 13:20

    ```


    The who command will consult the utmp file for previous logins if that file is
    named. A command like who /var/log/wtmp will report on every login since the wtmp
    file was truncated or created.


    For those in the midst of an existential crisis, the idiosyncratic form whoami
    provides some relief:


    ```

    $ whoami

    alice

    ```


    Some vendors include an extended who command with their UNIX systems. HP-UX, for
    example, supports 16 different flags and options. The “-a” flag produces a report
    “with everything on it,” including username, terminal type, time, idle time, process
    ID,'
  merge: -1
