    pwisthmonth, pwnextmonth, etc.). Password aging can even increase the risk that
    a user will choose a weak password. Consider the outcome of this scenario: J.
    Random''s password has just expired and he must select a new one right now, under
    time pressure.


    # Proactive Password Checking


    The best way to avoid weak passwords is to prevent users from selecting them in
    the first place. A proactive password checker either replaces the standard password
    changing program (passwd)—or wraps around it—and evaluates each user-selected
    password before associating it with an account. For the most part, it works like
    a reactive password checker—checking the entered password against iterations of
    username, first name, and last name, as well as against dictionaries. It typically
    can be configured on a per-machine basis, allowing the sysadmin to establish an
    appropriate level of password security. Some programs provide users with feedback
    about their rejected choices (“You may not use your last name,” etc.) though this
    mechanism can be exploited by an attacker to reduce the keyspace for password
    cracking.


    Several proactive password checkers have been implemented, including passwd+,
    npasswd, and epasswd (all three are detailed later in this chapter). None of these
    is trivial to install and configure. Modern UNIX implementations include a built-in
    password checker. Red Hat Linux, for example, uses Alex Moff''s CrackLib to check
    user-selected passwords. Red Hat and Solaris both implement PAM, which provides
    great flexibility in setting up alternative authentication mechanisms in general
    and proactive password checking in particular (see “PAM” on page 84 or the listing
    for the CrackLib module on page 94).'
