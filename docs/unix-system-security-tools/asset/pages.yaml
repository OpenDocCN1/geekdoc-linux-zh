    As noted above, Tiger can run at regular intervals from cron, but this can be
    problematic and resource-consuming for large systems. It also provides an attacker
    or intruder with a window of opportunity for committing and covering up malicious
    acts.


    Tiger provides a way to set the timing of individual script runs. While this still
    opens a window of vulnerability, it keeps the crontab file from getting cluttered.
    This capability is controlled by the cronrc file; the tigercron script does the
    work. The cronrc file is fairly self-explanatory.'
