  md: '# Actions


    In accordance with specifications in the .swatchrc configuration file, Swatch
    watches for particular patterns of events, from bad logins to system halts, and
    takes one of the following actions:


    +   - echo—displays the message, with either inverted or bold text

    - bell—displays the message and sounds the system bell

    - mail—mails the message to the user running Swatch

    - exec—executes a command or script

    - pipe—pipes a message to a program

    - write—uses the write command to notify users

    - ignore—does nothing


    # The Swatch Configuration File


    The operation of Swatch is set by a relatively simple configuration file that
    contains four Tab-separated fields:


    ```

    /pattern/.,./pattern,... action[action,action...]

    [[HH:JMM:SS] start:length

    ```


    The first two fields—pattern and action—are the most critical. The pattern is
    a regular expression to be matched. It is enclosed by forward-slashes “/”. If
    you want to track the activities of the user Mallory, the pattern “mallory/” will
    catch all log entries that mention him. If you want to see all *inetd* messages,
    “/inetd/” picks them up. A indicates that the preceding item will be matched zero
    or more times. Two regular expressions may be joined by a pipe “|”—the resulting
    regular expression matches any string containing either subexpression. The pattern
    “(panichalt)” will match either pattern or halt.


    The action consists of one of the bulleted items above: echo, bell, mail, exec,
    pipe, write, or ignore. The most common action is to echo the message. The appearance
    of the echoed text can be further specified by any of the keywords: normal, bold,
    underscore,'
