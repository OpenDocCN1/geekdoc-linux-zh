  md: '# HTTP/WWW Security


    There’s nothing inherently insecure about the HTTP protocol which underpins the
    World Wide Web, at least relative to older protocols like FTP and Telnet. The
    immense ubiquity and popularity of the web, however, makes it a favorite target
    for system crackers who seem to take great pleasure in defeating the system security
    of web servers and replacing popular web pages with cryptic and juvenile messages.
    This chapter explains some of the risks involved on both the server and client
    side and suggests security tools (starting with a secure server) and methods.
    It also describes TLS/SSL (Transport Layer Security/Secure Sockets Layer).'
  merge: -1
