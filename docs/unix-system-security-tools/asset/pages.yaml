  md: '# Chapter 02 / Security Planning


    It may be possible to value assets in a relative fashion, as a percentage of total
    budget, assets, or the worth of the firm as a whole.

    The IT assets of a highly-valued Internet company may be worth far more than their
    simple market value.


    Asset valuation can be complicated by the fact that an asset may have a different
    value for the owner than for those who covet it. A list of personnel and contact
    information may have nominal replacement value for the HR department, but if it
    would be more valuable for a head-hunting firm acting on behalf of a competitor.
    Consider developing as many as four estimated values: the average expected loss
    for the owner, the maximum expected loss for the owner, and the maximum gain for
    an attacker.


    Naturally, the process of identifying and valuating assets is more complex for
    a large organization than a small. In a large company, it may be necessary to
    convene a committee for members drawn from various line units as well as the IT
    department. If an organization has a great deal of sensitive data, it may be necessary
    to proceed on a need-to-know basis, with each part of an organization reporting
    and discovering only those assets within its domain.


    # Identifying Threats


    Given the assets you need to protect, what are the threats to these assets? In
    this era of the Internet, the system cracker or intruder is a popular figure depicted
    in more than a few Hollywood movies. Judging from the popular media, the crackers
    seem to be everywhere and nowhere at once, tweaking unclassified Department of
    Defense systems here, and changing a home page. While network security is a serious
    concern for any system connected to the Internet, a more serious threat often
    comes from within the organization. Insiders, from disgruntled employees to contractors,
    consistently rank high in corporate security assessments.


    Malevolent intruders and insiders inside, there are dozens of threats to the security
    and availability of any computer system: from software bugs to hardware failures;
    from the cup of coffee spilled into the keyboard to the backhoe that cuts off
    ten million phone lines.'
