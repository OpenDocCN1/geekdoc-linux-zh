    # Single Sign-on


    PAM was originally designed to provide users with a unified or integrated login
    across various applications while using a single system. The original concept
    has been extended to provide a “single sign-on”—the ability to log in once and
    then seamlessly access various applications and services across an entire enterprise.
    In general, this is a good idea. It can become difficult to get work done when
    one has to enter one password to log into a primary workstation, a second to access
    a corporate database, another to run a distributed client-server application,
    yet another to start an FTP session, and so on. In this kind of environment, the
    impulse to write down passwords on Post-It notes attached to a monitor can become
    irresistible. With a single sign-on, the user can establish trust with a single
    authentication.


    In environments where security is mission-critical, a single sign-on system can
    be dangerous—a single breach on a single workstation can give an attacker access
    to an entire enterprise network. In some situations, the security of applications
    and services is preserved by distinct and separate authentication schemes. The
    issue is moot to some extent, since single sign-on remains a design concept rather
    than a widely-implemented feature. It does, however, seem'
