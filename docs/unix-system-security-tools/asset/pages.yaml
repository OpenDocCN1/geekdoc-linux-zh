  md: '# Network Security Basics


    No UNIX box is an island. UNIX has been a major force behind the development of
    the Internet since the first Internet Protocol implementation was added to Berkeley
    UNIX in 1982. Connectivity with the Internet is a given for most UNIX systems,
    along with the need to consider network security in close conjunction with system
    security. This chapter introduces TCP/IP networking and covers some of the security
    concerns raised by TCP/IP services commonly offered by UNIX systems. It touches
    on the concept of protocol layers and how transmissions can be protected at each
    layer. It concludes by covering the netstat command.


    251'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# TCP/IP Networking


    # Defense by Dispersion


    The risky nature of connecting computers to networks is so widely known that it
    has become a “meme”—a unit of thought that spreads like a mental virus from person
    to person. Even Hollywood has embraced the notion of the dangerous network with
    crackers at every port.


    Ironically, the technology behind today’s networks was developed by the United
    States Department of Defense with security in mind. At the heart of most current
    networking is a classic “defense by dispersion” strategy first suggested by Rand
    researcher Paul Baran under a defense contract in 1962. It called for a network
    topology that distributed authority among a large number of geographically dispersed
    computers. The idea is stunning in its simplicity—in the case of nuclear attack,
    military command-control communications could have been maintained if or even
    most of the networked systems were totally destroyed. This topology was first
    implemented in the Advanced Research Projects Agency (ARPANET), a forerunner of
    the Internet built in the early 1970s.


    In order for dispersed and diverse computers to communicate, it was first necessary
    to develop a series of protocols—communications standards that specify the formulas
    for sending and receiving messages, message formats, and error handling. During
    the late 1970s, defense researchers developed a scalable, platform-independent
    set of protocols officially known as the TCP/IP Internet Protocol Suite that was
    widely deployed on the ARPANET starting in 1980. Enter UNIX. TCP/IP was integrated
    with the University of California’s Berkeley UNIX in the early 1980s. This implementation
    quickly spread to other UNIX implementations and other operating systems along
    with a set of standard application-level utilities like Telnet and FTP. The combination
    of open standards like TCP/IP and an open system like UNIX created fertile ground
    for the explosive growth of the Internet which continues to the present time.'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# TCP/IP Networking


    # Packet Switching


    The concept of packet switching is key to understanding how TCP/IP works. A packet
    (also known as a “datagram”) is a unit of transmission. The easiest way to understand
    packet switching is to contrast it with another common approach to network communications:
    circuit switching. Circuit-switched networks are created by forging a dedicated
    connection (or circuit) between two points. The telephone system is the canonical
    example of a circuit-switched network. When you make a call, a circuit is established
    from your phone through the local central office across the trunk lines to a remote
    central office and then on to the phone of the party you''re calling. You have
    a guaranteed dedicated connection to the other end that you pay for regardless
    of whether you''re talking or not.


    In packet-switched networks, traffic is broken into packets that contain identifying
    information as its destination. A file''s being transmitted from one system to
    another is divided into packets, sent one at a time over the network, and reassembled
    at the other end. Multiple streams of packets are combined, or multiplexed, in
    an efficient manner so that many machines can share the network medium simultaneously.
    Unlike the circuit-switched phone network, there''s no guaranteed connection between
    machines. If the network is congested, computers may have to wait before sending
    additional packets. Still, packet-switching confers a major advantage: multiple
    communications between computers can proceed concurrently, without the expense
    of having to maintain a dedicated circuit.


    # The Internet Protocol


    The part of the TCP/IP suite that defines packets as the basic unit of information
    on an internet is the Internet Protocol (IP). IP lies at the core of the Internet
    and many of its component networks. It defines the header of each packet—a structured
    collection of bytes that identifies the sender as well as the destination along
    with a number of other fields. The header is followed by the packet''s data contents,
    a larger block of arbitrary data that will generally be recombined with related
    data at the receiving end.'
  merge: -1
  pgno: 272
- img_proc: true
  md: 'IP can be used to connect two computers in a number of ways. One common way
    is by creating a Local Area Network (LAN). In a LAN, each computer contains a
    network interface device that connects it to a passive network medium such as
    copper wire or coaxial cable. Ethernet is a very common scheme for building a
    LAN that was developed at Xerox PARC in the early 1970s.


    IP can also connect two computers via a serial line, typically with two modems
    and a telephone line acting as a bridge. The Point-to-Point Protocol (PPP) supports
    the use of IP over phone lines and is widely deployed by Internet Service Providers.
    Finally, IP can also be encapsulated within packets defined by other protocols,
    such as ATM (Asynchronous Transfer Mode) or X.25.


    Viewed from another perspective, IP can be used to join two separate networks
    into an internetwork. This is archetypically accomplished by inserting a computer
    called a router (or “gateway”) between the two networks. A router is a computer
    that connects two networks and passes packets between them according to predetermined
    rules. Take a simple example of two networks. All packets on network 1 are bound
    for network 2 are captured by the router and sent to network 2. All packets on
    network 2 are bound for network 1 are captured and sent to network 1.


    The concept of the router connecting two networks is deceptively simple. A router
    doesn''t just connect two computers (or “hosts”); it connects two networks. Consider
    the case of three networks, connected by two routers, or x networks, connected
    by x-1 routers. All of a sudden, each router''s task in determining where to send
    packets becomes far more complex and the amount of information it store greatly
    increases. One of the beauties of IP, fortunately, is its scalability. An IP router
    doesn''t need to know about the topology of every host on every network it connects—routing
    decisions are made on the basis of the destination network, not the destination
    host. Since routing is based on networks, the amount of information that a router
    must hold is proportional to the number of networks on the Internet, not the number
    of hosts.


    # IP Addresses


    One of the beauties of the Internet is how transparent the complexity of routing
    packets is to its users. It doesn''t matter whether'
