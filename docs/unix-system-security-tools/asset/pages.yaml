    happens at the Internet Layer. The next section looks at the Transport Layer and
    its two major protocols: UDP and TCP.


    # Transport Protocols


    The TCP/IP protocol suite includes two transport layer protocols: the Transmission
    Control Protocol (TCP) and the User Datagram Protocol (UDP).'
