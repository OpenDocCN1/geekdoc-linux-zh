  md: '# Transmission Risks


    Information being transmitted between web client and web server can be intercepted
    by eavesdroppers on either end of the link or anywhere in between, including


    +   - the client''s LAN

    - the server''s LAN

    - the client''s ISP

    - the server''s ISP

    - any intermediary networks between the two ISPs


    The terms "secure web server" and "web browser security" refer to the ability
    of both sides to exchange encrypted information that should be useless to eavesdroppers.
    Barring a "secure" encrypted link between client and server, any information transmitted
    between the two is subject to packet-sniffing and other interception techniques.


    > Tip No review of web security risks would be complete without reference to "The
    World Wide Web Security FAQ" by Lincoln D. Stein. This can be discovered at http://www.w3.org/Security/Faq/


