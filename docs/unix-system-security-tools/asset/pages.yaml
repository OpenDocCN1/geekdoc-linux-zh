  md: '# Chapter 09 / Swatch


    your .swatchrc file until all the messages that remain interesting.


    For example, I set my /etc/syslog.conf to record all events to the messages file
    as a terminal (tty8 in this case):


    ```

    # Sample syslog.conf -- let''s see it all

    *.* /var/log/messages

    *.* /dev/tty8

    ```


    # Tip


    In order for changes to the syslog.conf file to take effect, you need to restart
    syslog or send a HUP signal to the daemon by the kill -HUP process-id You can
    find the process ID by running the ps command. If you''re running Linux, you can
    find the process ID by issuing a command like cat /var/run/syslog.pid


    With the swatch volume turned all the way up, I then set up a generous .swatchrc
    file, designed to highlight failed logins and the activities of both root and
    alice, ignore the flood of sendmail messages, and simply echo everything else.


    ```

    # A Generous swatchrc

    /FAILED LOGIN/

    /TOO MANY LOGIN TRIES/

    # Ignoring this stuff

    /sendmail/

    # Special stuff

    /root/

    /alice/

    /*/

    echo=inverse

    echo=inverse,bell=3,mail=root

    ignore

    echo=inverse,bell=4

    echo,bell

    echo

    ```


    This produces verbose Swatch sessions. I then go back, edit the .swatchrc so Swatch
    ignores additional superfluous messages, and so on until the proper balance is
    struck by echoing everything and ignoring too much.


    Undoubtedly, while monitoring security-sensitive messages, you''re sure to notice
    an unusual pattern of events that you wish to be alert for. Someone on a host
    in Germany would occasionally launch a series of telnet attempts against a client''s
    system—a pattern I discovered while auditing log files. Using a .swatch'
