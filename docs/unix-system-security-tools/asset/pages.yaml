  md: '# Preface


    The UNIX operating system is a critical part of our civilization''s infrastructure.
    Many tens of millions of people utilize services provided by UNIX machines each
    and every day, usually without realizing it. While UNIX has been deployed in commercial
    and academic settings for decades, its importance has been greatly amplified by
    the rise of the Internet as a mass medium. While UNIX and the Internet are logically
    distinct entities, in the real world the two are intricately intertwined. Most
    critical Internet services were first developed and deployed on UNIX boxes, and
    despite the rise of interlooping operating systems like Windows NT, UNIX continues
    to be the mainstay of the communications revolution initiated by the Internet.


    There is an irony here: UNIX was never intended to be a secure computing platform.
    From its start in AT&T''s Bell Laboratories thirty years ago, UNIX was designed
    to be a multi-user, multitasking operating system that featured ease-of-programming
    and functionality over security. It''s not surprising that as UNIX has become
    an increasingly important part of the worldwide information milieu, it has come
    under unrelenting attack from the curious and malevolent alike. While no one knows
    how many UNIX and UNIX-like'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'systems are use, let alone how many are attacked in a given year, one can infer
    that tens of thousands are probed, and hundreds compromised each and day.


    The purpose of this book is to provide UNIX system administrators with tools and
    techniques that can help provide a given UNIX system with a baseline of security.
    The UNIX security community has produced an amazing assortment of add-on security
    tools in the past decade. Using security archives like COAST as reference points,
    I evaluated over three dozen tools in the course of my research. I chose half
    a dozen to cover in-depth, selecting some that represented a certain kind of tool
    (e.g., Crack is an archetypal password checker) and some that demonstrate overall
    excellence (e.g., Tripwire measures well to the criteria I recommend in "Evaluating
    Security Tools" on page 15. Others I cover in survey form.


    While I did not intend this book to be a general primer on UNIX system security,
    much of the material is aimed at the technically astute individual who, by virtue
    of running a departmental server or home machine, has been thrust into the role
    of a security administrator. I assume that UNIX installations, large or small,
    share a common set of policy objectives: that continued operation is important;
    that user accounts and data should not be compromised; that important system events
    should be logged and monitored; and that systems need to be usable as well as
    secure.


    No tool or collection of tools can secure an operating system, nor can any book
    account for the amazing variety of ways that a system can be compromised by malevolence,
    incompetence, or the entropy of the universe. If you deploy the tools and techniques
    discussed here, however, you can achieve a security baseline that in most circumstances
    would be considered both practical and reasonably diligent. Of course, "most circumstances"
    doesn''t include top secret military installations, nuclear power plants, aviation
    control systems, banking systems, and the like. While nothing in this book is
    likely to harm the security of these types of important systems, reasonable diligence
    requires a far more thorough approach than can be presented in these scant.


    You should observe additional provisos when using this book and the tools it covers.
    Although this text refers to "UNIX," there'
  merge: -1
