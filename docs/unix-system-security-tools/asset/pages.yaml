  md: '# Enhancing Password Security


    Given the persistent problem of guessable passwords described in the last chapter
    (see “Password Vulnerabilities” on page 58), there are five major ways that system
    administrators can enhance or enforce password security:


    +   User education—Spreading the word via a formal password policy


    +   Reactive password checking—Running a password-checking program in order to
    find weak passwords


    +   Assigning passwords—Providing passwords for users, thus denying them the opportunity
    to select weak ones


    +   Proactive password checking—Disallowing the choice of poor passwords in the
    first place


    +   Password Aging—Forcing users to change their passwords with some frequency


    Additionally, threats to password security can be mitigated by the following measures:


    +   Shadow passwords—Storing passwords in a protected “shadow” file instead of
    /etc/passwd


    +   One-time passwords—Providing each user with a list of passwords that work
    once and once only


    Each of these methods has pros and cons. Some of them are built into by UNIX implementations;
    others need to be added. They can be provided by the tools listed in the “Account
    Security Tools Survey” on page 93. The following subsections discuss each of them
    turn.


    To help you decide which to implement on your systems, these measures are covered
    in some depth starting on page 89.


