  md: '# Transport Protocols


    The layering is organized so that layer n at the receiving end receives exactly
    the same object sent by layer n at the transmitting end.


    This last item is conceptually important.


    ![](img/1a7ecd5e8d14f7d50a9df943b7efac99_278_0.png)


    Figure 13.1 A Message Passing Through the Layers


    While the concept of layered protocols is interesting, it is an abstraction as
    far as system security is concerned. The nitty-gritty lies in what each layer
    actually does. The next chapter, “UNIX Network Services” (see page 275), reviews
