    Caution


    The bell action (bell=n) rings the system bell for n number of times. Urgent messages
    can set the bell to ring several times. The bell is handy for those moments when
    you''re in the office but away from the terminal running Swatch—set it to ring
    three times, for example, whenever there are three failed logins to the root account.


    The echo and bell actions are well-represented in the “Personal Swatch configuration
    file” included in the Swatch 2.2 distribution. It''s set to echo bad logins and
    logging errors in inverse mode and ring the bell the three times on important
    events. Other items—like sendmail, news, network time—are ignored. For the most
    part, kernel problems (“file system full”) also ring bells.


    # Listing 9.1 A Personal Swatch Configuration File


    ```

    #

    # Personal Swatch configuration file

    #

    ```


    ```

    # Alert me of bad login attempts and find out who is

    # on that system

    /INVALID|REPEATED|INCOMPLETE/      echo=inverse,bell-3

    ```


    ```

    # Important program errors

    /LOGIN/                          echo=inverse,bell-3

    /passwd/                         echo=bold,bell-3

    /ruserok/                        echo=bold,bell-3

    ```


    ```

    # Ignore this stuff

    /sendmail/.nntp/.xntp|ntpd/,faxspooler/      ignore

    ```


    ```

    # Report unusual tftp tp info

    /tftpd.*(ncd|kfps|normal exit)/      ignore

    /tftpd/                           echo,bell-3

    ```'
