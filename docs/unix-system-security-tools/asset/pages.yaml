    Why "uebercracker"? The idea is stolen, obviously, from Nietzsche''s ueberensch,
    or literally translated into English, "over man.\ Nietzsche used the term not
    to refer to a comic book superman, but instead a man who had gone beyond the incompetence,
    pettiness, and weakness of the everyday man. The uebercracker is therefore the
    system cracker who has gone beyond simple cookbook methods of breaking into systems.
    A uebercracker is not usually motivated to perform random acts of violence. The
    targets are not arbitrary—there is a purpose, whether it be personal monetary
    gain, a hit and raid for information, or a challenge to strike a major or prestigious
    site or net.personality. An uebercracker is hard to detect, harder to stop, and
    hardest to keep out of your site for good.


    Many security threat models assume that the bad guy will be a one-dimensional
    loner or a script kiddie probing systems for fun. While redundant security mechanisms
    and careful monitoring might protect against these threat models, they may fail
    against a determined, hardened, and skilled professional—an uebercracker.


    An even more serious threat than the uebercracker is the attack cell—a group of
    complex individuals who work together to attack systems in order to further a
    common goal. While an organization prepares for the lone cracker, an attack may
    be executed by professionals with extensive financial and technical resources.
    An attack cell might include a social engineering expert who''s been hired in
