  md: '# PAM


    PAM (Pluggable Authentication Modules) is a suite of shared libraries that provides
    sysadmins with a wide variety of precise controls over how applications authenticate
    users. While PAM is not a tool per se, it establishes a flexible framework for
    implement-ing site security policies.


    PAM represents an elegant solution to a persistent problem. Most UNIX programs
    that require user authentication rely on /etc/passwd and the traditional UNIX
    authentication scheme. As discussed in the previous chapter, a variety of factors
    have diminish-ed security of this system. Not only is it inherently vulner-able
    to cracking, but systems used to stand alone are now deployed on networks where
    many more individuals may have access to their login prompts.


    In response, several new authentication schemes have been developed over the years,
    including complex replacements for /etc/passwd like shadow and one-time passwords,
    those that utilize a challenge-response scheme, and those that depend on hardware
    (i.e., smart-card systems). While these new schemes improve secu-rity, they have
    been problematic to implement. Since many UNIX applications (login, telnet, ftp,
    su etc.) depend on /etc/passwd, all those applications have to be re-written before
    a new authent-ication scheme can be deployed.


    In order to solve this development bottleneck, several engineers at Sun Microsystems
    developed PAM—a general solution that sep-arates the development of privilege-granting
    software from the development of secure authentication schemes. PAM provides a
    front-end library of functions—an Application Programming Interface (API)—that
    an application may use to authenticate a user. The PAM library is configured by
    either a single file, /etc/pam.conf, or a series of configuration files located
    in /etc/pam.d/ which allow user requests for access (“let me log in”) to be transparently
    hon-ored by locally-available back-end authentication modules, in accordance with
    local security needs.


    Making things easy for users is a core goal of PAM. In order for security safeguards
    to be useful, they must be easy to use. Given the proliferation of different authentication
    schemes, users could get'
