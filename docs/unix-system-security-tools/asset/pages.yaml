    # Tip


    Modern UNIX implementations usually support different kinds of filesystems in
    addition to their native filesystem. Linux is particularly strong in this regard.
    Among the filesystems that are supported by the Linux kernel:


    +   * ext2—a high-performance filesystem used for both fixed and removable disks
    (the second version of the ext filesystem, which was derived from the Minix filesystem)


    +   * msdos—used by MS-DOS and Windows; filenames can be no longer than an 8 character
    name followed by an optional period and 3 character extension


    +   * umsdos—an extended DOS filesystem used by Linux; supports long filenames,
    UID/GID, permissions, and special files under the DOS filesystem


    +   * iso9660—a CD-ROM filesystem conforming to the ISO 9660 standard


    +   * hpfs—the High Performance Filesystem, used in OS/2


    +   * minix—used in the Minux OS; the first Linux filesystem


    +   * nfs—the network filesystem used to access disks located on remote computers


    +   * swap—a disk partition to be used for swapping


    # File Permissions


    File permissions are the lynchpin of UNIX filesystem security. UNIX is designed
    to be a multi-user system and it behaves that way even if there''s only one user
    that ever logs in. Access to files is'
