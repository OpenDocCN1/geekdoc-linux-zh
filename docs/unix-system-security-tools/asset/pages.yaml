    The “personal”.swatch won’t be sufficient if you’re responsible for a critical
    server or a cluster of servers. Important servers need to be monitored around
    the clock, and immediate action needs to be taken if they’re in danger of going
    down. The Swatch distribution includes a more aggressive sample .swatch for constant
    monitoring (swatch.monitor). Here, stronger actions are taken. In some cases,
    mail is sent. With repeated login attempts, a script is executed that fingers
    the user attempting the logins. A system crash executes a script that pages the
    sysadmin.


    In Listing 9.2, I’ve forced action items to a second line where both pattern and
    action wouldn’t fit on a single line.


    # Listing 9.2 A Swatch Configuration File for Servers


