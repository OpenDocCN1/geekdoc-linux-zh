  md: '# Algorithm Improvements


    perturbs the DES algorithm in one of 16,777,216 ways instead of 4096 ways. The
    attacker who uses a pre-compiled crack dictionary with 4096 permutations will
    have to start from scratch.


    # Extended Crypt


    NetBSD and OpenBSD implement the above tactics. Both of these free systems support
    an “extended crypt” that allows for larger salt values and an increased number
    of rounds—these can be specified in the _passwd.conf_ file.⁵ Under this scheme,
    the plaintext password (which can be longer than eight characters) is divided
    into groups of eight characters (a short final group is padded with zeros). Seven
    bits of each character (56 bits per group) are used to form DES keys. The first
    group of 56 bits becomes the initial DES key, which is encrypted with itself.
    The next group’s bits are XORed against the encrypted initial key—the resulting
    value becomes the next DES key. This process is repeated for each additional group.
    The final DES key is used to perform cumulative rounds of encryption on a 64-bit
    constant.


    This _crypt()* variant creates a 20 character password entry which is composed
    of two parts: the “setting” and the encoded password. The setting is a 9-character
    array consisting of an underscore (“_”) followed by 4 bytes of iteration count
    (specifying the number of rounds) and 4 bytes of salt. Each byte is encoded as
    a 6-bit printable character for a total of 48 bits for both count and salt.


    > Increasing the number of rounds provides some protection against cracking, but
    only in situations in which the cracker doesn’t know how many rounds were used.
    If attackers know you use 50 rounds instead of 25, they can easily adjust their
    password cracking program to account for this. It may take more time, but it’s
    still do-able.


    # Caution


    # Alternative Algorithms


    While a variant of DES has long been the stalwart of UNIX password encryption,
    other algorithms can be used instead of DES.


    ⁵ See the man pages for crypt. For NetBSD, see http://www.flame.org/cgi-bin/uncgi/hman.
    For OpenBSD, see http://www.openbsd.org/cgi-bin/man.cgi'
