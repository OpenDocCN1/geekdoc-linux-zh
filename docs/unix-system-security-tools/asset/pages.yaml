  md: '# FTP


    The File Transfer Protocol (FTP) allows files to be transferred from one system
    to another across a network. FTP is implemented in UNIX in two pieces: the *ftp
    client and the *ftpd server*. During an FTP session, a bi-directional data channel
    is constructed in order to transfer a part of a file, an entire file, or a number
    of files. FTP (i.e., ftppd, the daemon) typically uses TCP port 21 for sending
    commands and sometimes TCP port 20 for data. Often the client and server will
    negotiate to use a set of port numbers greater than 1024.


    # Tip


    When measured in Internet time, FTP is ancient—over 200 years old! It was first
    specified by Abhay Bhushan at MIT in 1971. The current specification was drafted
    by Jon Postel and Joyce Reynolds as RFC 959. To find out more about the colorful
    history of FTP, see http://www.faqs.org/rfc/rfc959.html


    Using FTP is a snap. You provide a hostname, username/pass-word, and a path to
    the file, and the program will fetch it. Modern FTP clients offer a plethora of
    features, with the ability to retrieve files using either the FTP or HTTP protocols
    (man ftp tells you more).


    Many organizations offer anonymous FTP, which allows network users without an
    account to fetch and deposit files using a special directory. These users simply
    enter “ftp” (preferred) or “anonymous” (for older systems) as the username and
    their email address as the password. The start of a typical anonymous ftp session
    might look like this:


    ```

    $ gnudist.gnu.org

    Connected to gnudist.gnu.org.

    220 ProFTPD 1.2.oprel Server (ProFTPD) [gnudist.gnu.org]

    Name (gnudist.gnu.org:alice): ftp

    331 Anonymous login ok, send your complete e-mail address as password.

    Password: ********n230-Welcome, archive user! ...

    230 Anonymous access granted, restrictions apply.

    ```


    +   1. One calendar year equals seven Internet years;)'
