    ProFTpd (the Professional FTP Daemon) is a newer ftpd modelled after the Apache
    web server. The author admits it’s not a lightweight bit of code, he believes
    that it’s more secure than wuftpd. For more information, see http://www.proftpd.org/index.html


    # Future Directions for FTP


    Even the best FTP implementations suffer from a flaw in the underlying protocol.
    In both active mode and passive mode, the protocol assumes, in the absence of
    any authentication method, that the client or server that opens the data channel
    is the same client or server attached to the associated control channel. Taking
    the case of a server listening on a given TCP port after the control connection
    has been set up: an attacker could guess the port the server is using and bombard
    it with connection attempts. In this interception scenario, any data being sent
    to the client would go to the attacker’s system instead. Alternately, the attacker
    could send data to the server, replacing data the client meant to send.'
