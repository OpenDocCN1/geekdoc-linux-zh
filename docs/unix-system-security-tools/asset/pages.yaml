- img_proc: true
  md: '# Why Account Security?


    Each individual that uses a UNIX system should have an account on that system.
    Each account is associated with a unique username and a secret password. These
    two items represent a vital UNIX security mechanism: a username (also known as
    an “account name” or “login name”) identifies who is using the system, while passwords
    authenticate the user as he or who she claims to be. Without authentication, it’s
    impossible to hold individuals accountable for their actions or to implement basic
    security controls.


    Account security is one of the “outer rings” of UNIX system security. A canonical
    line of attack targets the username/password safeguard. Accounts that belong to
    regular users and system users can be cracked open, sometimes by mere password-guessing,
    sometimes by systematic dictionary attacks, and sometimes due to negligence. If
    a system is connected to a network, its account security will be vulnerable to
    probes by snoopers, crackers, and other entities with malevolent intent. Once
    the “inside,” they can use a user account to impersonate a legitimate user, abuse
    system resources, launch attacks on other networked systems, or attempt to gain
    a higher level of privilege. Once the root account is compromised, the system
    is “owned” by the attacker. He can change any file or operating parameter, insert
    malicious code, add bogus users for future attacks, and then erase the evidence
    by altering log files.


    # Choosing Secure Passwords: A User Guide


    Passwords are a simple form of authentication. They represent a shared secret
    between the computer and a user. By presenting a password, the user proves to
    the computer that he or who is she claims.


    Bad passwords can severely compromise the security of a UNIX system. It''s trivial
    for an attacker to use a hit list of common passwords to feed one after another
    to a system until they’re in. Even a modest home computer with a good password
    cracking program can generate thousands of guesses in just a few hours.'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# Choosing Secure Passwords: A User Guide


    In theory, the most secure passwords consist of completely random combinations
    of letters, both upper and lower case, punctuation marks, and special characters.
    Unfortunately such passwords are difficult to memorize, and passwords that can''t
    be memorized need to be written down. Writing down passwords can, however, be
    risky (see "Writing Down Passwords") on page 52).


    The password you select to be protected against two lines of attack: 1) guesses
    that another person might make based on information gathered about you personally,
    and 2) guesses that a password-guessing program might make.


    # Password No-no''s


    Here''s a list of things you should not do when selecting a password:


    +   - Don''t choose a password that could be found in any dictionary of any language.
    Password-guessing programs can be configured with massive multi-lingual word lists
    that are widely available on the Internet.


    +   - Don''t choose a password consisting of a simple sequence of letters (for
    example, "qwerty" or "abcdef").


    +   - Don''t choose a password that contains any identifiable information about
    you (for example, your birthday, your spouse''s name, the names of your children,
    telephone numbers, Social Security numbers, the brand of car you drive, car license
    plate numbers, the name of the street you live on, etc.).


    +   - Don''t choose a new password that''s similar to one you''re replacing.


    +   - Don''t choose a password that contains your username or any variant of it.


    +   - Don''t choose a password shorter than six characters or one that contains
    only alphabetic characters or digits.


    +   - Don''t choose a password that contains all lower-case or upper-case letters.'
  merge: -1
  pgno: 70
- img_proc: true
  md: '+   • Don’t choose a password that you’ve seen published as a password example.


    # Good Passwords


    Here’s a list of things you should do when selecting a password:


    +   • Choose a password that’s at least six characters long.


    +   • Choose a password that contains non-alphabetic characters including numbers
    and special characters like ~!@$%^&*()_+-=[]|\;.<>?/<space>.


    +   • Choose a password that’s easy to remember so you don’t have to write it
    down.


    +   • Choose a password that you can type quickly without looking at the keyboard
    so that someone looking over your shoulder can’t tell what it is.


    # Writing Down Passwords


    As a general rule, passwords should not be written down. A password written on
    a legal pad, Post-It note, etc. can be discovered. A password committed to memory
    is the most secure.


    Even experts sometimes trip up by writing down passwords. For several months,
    Cliff Stoll, author of The Cuckoo’s Egg, hosted TV segments for the computer show
    “The Site” at his Oakland home. In one segment, Cliff admitted that he had committed
    a security blunder: he had his password written down on a Post-It note attached
    to his monitor, the same monitor that could be clearly seen by millions during
    the “over the air” segments. Needless to say, Cliff changed his password.


    If it’s absolutely necessary to write a password, consider the following precautions:


    +   • Write the password on a folded piece of paper and place in a lockbox or
    safe.


    +   • Write the password on something kept in your wallet. This is preferable
    to having this critical information right by your system. It raises the bar for
    a potential intruder—to get to the password, they have to get to you first. It
    should go without saying, but if you keep your password in your wallet, make'
