    The general form of the RPM signature check command is

    rpm --checksig <package_file>+


    This checks the PGP signature built into a package to ensure the integrity and
    the origin of the package.


    # Cryptographic Filesystems


    The “cryptographic filesystem” is one of the more compelling approaches to filesystem
    security. It follows a relatively simple dictum: if a system stores secret data,
    it should routinely store it in encrypted form. While there''s nothing stopping
    a user from using a tool like PGP to encrypt sensitive data for storage, the process
    can be cumbersome, time-consuming, and prone to error. Each time one needs to
    work on the files, they must be decrypted “by hand”; each time work is completed,
    the files must be encrypted again. This method of operation violates the rule
    that security safeguards should be easy to use. It also creates a window of vulnerability
    during the time the working files are stored in the clear. Why shouldn’t the encryption
    and decryption be handled by the filesystem in a transparent way, with minimal
    user intervention, so that secret information is never stored in the clear?


    # CFS


    The reasoning just introduced is the core idea behind the Cryptographic Filesystem
    (CFS) proposed and implemented by Matt Blaze.\” CFS provides a transparent interface
    to directories and files


    14. Matt Blaze, “A Cryptographic Filesystem for Unix.” Proceedings of First ACM
    Conference on Computer and Communications Security, Fairfax, VA, November 1993.
    See ftp://coast.cs.purdue.edu/pub/doc/cryptography/Crypto-File-System.ps.Z'
  merge: -1
  pgno: 160
- img_proc: true
  md: 'that are automatically encrypted with user-supplied keys. A single command
    associates a key with a directory; from then, the directory''s contents are automatically
    encrypted when they are written and decrypted when they''re opened.


    Typically, CFS-enabled directories are mounted as part of a virtual filesystem
    at the mount-point /crypt.


    CFS uses DES to encrypt files. CFS clients run a server daemon (cfsd) based on
    the Network File System (NFS) protocol (see “NFS” on page 297)—CFS can use either
    local or network filesystems for underlying storage.


    One potential drawback of CFS is speed. CFS requires additional data copies with
    each file request. Under normal UNIX operation, when a user application needs
    to access a file, the request goes to the kernel, which retrieves it from the
    filesystem. With CFS in place, the application goes to the kernel, which invokes
    cfsd, which calls to the kernel, which retrieves it from the filesystem. Then,
    the file has to be decrypted and passed back to the application.


    Tests run by Blaze indicate that file operations under CFS can be several times
    slower than normal UNIX operations. Real world tests indicate that CFS operations
    are about 1.3 times slower. This difference may be acceptable when you factor
    in the slowness of the alternative—manually encrypting each and every secret file
    every time it''s worked on.


    Another potential downside of CFS is its experimental nature. With any experimental
    filesystem, there''s an opportunity for severe data loss or corruption.


    Conceptually, both CFS and cryptographic filesystems in general are elegant. Many
    security safeguards are designed to protect servers by authenticating users who
    are intrinsically mistrusted. CFS works in reverse—by enforcing security for sensitive
    user data that must live on servers that are intrinsically mistrusted.


    # Caution'
