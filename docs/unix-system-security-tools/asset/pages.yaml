    # Ten General Security Rules


    Before we roll up our sleeves and get into the devilish details of

    planning and implementing UNIX system security, I''d like to posit

    ten general security rules or themes that I''ll return to again and again in this

    book.


    # Rule 1: Security Through Obscurity Doesn''t Work


    As they say in the movies, you can run but you can''t hide. You may

    think that you''re running an obscure UNIX-based web server that

    no one would dream of breaking into, but your obscurity is no pro-

    tection in area when thousands of malicious little punks have

    access to powerful network scanning tools which may discover

    your system and its vulnerabilities. You may think that you''re hid-

    critical data by burying it several directories deep, but you''d be

    wrong given the powerful search facilities built into UNIX. A soft-

    ware or hardware vendor might might realize that a hole exists in their

    offering but ship it anyway, thinking that no one will find it. These

    kinds of holes are discovered all the time.


    At best, security through obscurity can provide temporary pro-

    tection. Never be lled by it—with modest effort and time,

    secrets can be discovered. As Deep Threat points out on X-Files:

    "There''s always watching.



    # Rule 2: Full Disclosure of Bugs and Holes Benefits Security


    As cited above, some vendors may feel comfortable shipping soft-

    ware security holes with the expectation that the software is

    so complex and proprietary that no one will find them—the tree

    hasn''t fallen if no one was there to hear it. Some security

    professionals feel uncomfortable with the publicity that security

    holes and problems receive. They worry that announcing security

    exploits can give the "bad guys" ideas about how to attack sys-

    tems. On the other hand, the security community on the Internet

    has has committed itself to sharing knowledge about holes and possi-'
