- img_proc: true
  md: '# Tripwire Overview


    contains a list of these files and directories. Each entry is associated with
    a selection mask that tells the program what file attribute changes can be safely
    ignored.


    The selection mask is composed of select-flags. Each select-flag covers a different
    attribute. The “s” select-flag, for example, is for file size, while the “a” is
    for the access timestamp. Each flag is either added (“+\”) or deleted (“-\”) from
    an item to be monitored.

    A tw.config entry like


    ```

    /home/xyz +s-a

    ```


    tells Tripwire to track file size changes in /home/xyz while ignoring changes
    in the access file stamp.


    Table 7.1 summarizes Tripwire''s select-flags.


    | Select-flag | Attribute Covered |

    |---|---|

    | - | ignore the following attribute |

    | + | monitor the following attribute |

    | p | permission bits |

    | i | inode number |

    | n | number of links |

    | u | user ID of owner |

    | g | group ID of owner |

    | s | size of file |

    | a | access timestamp |

    | m | modification timestamp |

    | c | inode creation/modification timestamp |


    Each of Tripwire''s signature routines is assigned a number. You can specify which
    of these are applied to a file/directory entry'
  merge: -1
  pgno: 176
- img_proc: true
  md: '(Tripwire applies 1 and 2 by default). Table 7.2 specifies each sig-nature
    and corresponding number.


    # ### Table 7.2 Tripwire’s Signature Numbers


    | Signature # | Signature |

    |---||

    | 0 | null signature |

    | 1 | MD5, from RSA Data Security, Inc. |

    | 2 | Snefru, the the Xerox Secure Hash Function |

    | 3 | CRC-32, 32-bit Cyclic Redundancy Check |

    | 4 | CRC-16, 16-bit Cyclic Redundancy Check |

    | 5 | MD4, from RSA Data Security, Inc. |

    | 6 | MD2, from RSA Data Security, Inc. |

    | 7 | SHA, the NIST Secure Hash Algorithm |

    | 8 | Haval, a 128-bit signature algorithm |

    | 9 | null, reserved for future use |


    Given Tripwire’s flexibility, the selection-masks can get quite complex. The designers
    compensated for this complexity by creat-ing templates that contain common combinations
    of selection flags. In most cases, you''ll want to use these templates in your
    tw.config. Table 7.3 summarizes the five major templates.


    # ### Table 7.3 Selection-mask Templates


    | Template Letter | Template Purpose | Template Select-flags |

    |---|---||

    | R | Read-only files | +pinugsm12-ac3456789 | |

    | L | Log files | +pinug-sacm123456789 | |

    | N | Ignore nothing | +pinugsamc123456789 | |'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# Tripwire Overview


    # Table 7.3 Selection-mask Templates (Cont''d)


    | Template Letter | Template Purpose | Select-flags |

    | --- | --- | --- |

    | E | Ignore everything | -pinugsamc123456789 |

    | > | Growing log files | +pinug>samc123456789 |


    The R template is the default. So if the entry for /usr/local/bin looks like this


    ```

    /usr/local/bin R

    the effective selection-mask is

    /usr/local/bin +pinugsm12-ac

    ```


    and Tripwire will report any changes in mode bits, inode number, reference count,
    uid, gid, file size, modification timestamp, and the MD5 and Sefru signatures.
    It will ignore changes to the access and inode timestamps.


    There are two final operators to consider. A "!" before an entry indicates an
    inclusive prune. If the entry is a file, it is ignored. If the entry is a directory,
    it is ignored along with all the files within it. A "=" indicates an exclusive
    prune. If the entry is a file, it does nothing. If the entry is a directory, the
    directory will be monitored but not its contents.


    The following is a very simple tw.config file:


    ```

    #file/dir selection-mask

    /root R #check root''s home directory

    !/root/mbox R #but ignore root''s mailbox

    /usr/local R-2 #but save time by skipping

    Sefru

    =/home R #only the directory, not its contents

    ```


    Note that templates can be mixed with select-flags. "R-2" is a simple way of indicating
    a default check without using Sefru.'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# Installing Tripwire


    To download Tripwire, surf to Tripwire Security Systems, Inc.’s web site at the
    URL http://www.tripwiresecurity.com/tripwire. You can download either the UNIX
    or the Linux version. For Linux, there are RPM packages for binaries or source
    code available. For maximum flexibility, download the source code RPM, which should
    be called tripwire-1.3-1.src.rpm or something similar. While you''re there, also
    download the manual, which is in PDF format.


    Log in as root. Use RPM (the RedHat Package Manager) to install the Tripwire source
    code with a command in the form


    ```

    $ rpm -ivh tripwire-1.3-1.src.rpm

    ```


    The Tripwire source code will be copied to /usr/src/redhat/BUILD/tripwire-1.3-1.


    Review the README files included in the distribution as well as the FAQ file.
    You may also wish to review the manual.


    > **Caution** If you''re extremely meticulous, you''ll re-install your system
    binaries before installing Tripwire. This is the only way to ensure that you''re
    starting with a clean system. If you suspect that you''ve been hacked, definitely
    re-build your system from the original installation media.


    If you''re installing on a UNIX box (other than Linux), you may need to check
    the Makefile, edit the .include/config.h file, and make other customizations.
    Consult the manual for detailed instructions.


    From the top-level Tripwire source directory, type the command make. This will
    build the program binaries. The Tripwire binary (“tripwire”) and configuration
    file (“tw.config”) will be placed in the directory /usr/local/bin/tw. If you have
    problems compiling, consult the manual for trouble-shooting tips.


    Tripwire includes a script that tests if your installation was successful. Type
    the command make test at the top-level to invoke the script.'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# Configuring Tripwire


    Edit the tw.config file so that it will monitor the right files and directories.
    You don''t want Tripwire to miss checking important files, nor do you want it
    to report on files that constantly change in the course of normal system operation.
    The default tw.config is quite generous—it''s set to monitor most of the files
    on a stock Linux box. You may want to go ahead and run your first Tripwire report
    and then adjust tw.config based on the output you get.


    Run Tripwire in Database Generation mode by running the command tripwire -initialize.
    This creates your baseline database—a file tw.db_hostname where "hostname" is
    replaced by your machine''s hostname.


    > By default, the database is placed in a directory "/databases". Note in order
    to change where the database is placed, you''ll need to recompile Tripwire.


    # Running Tripwire


    Run Tripwire in Integrity Checking mode by running the command tripwire. Tripwire
    will run its comparisons and report on any discrepancies. The report you receive
    should produce a preamble that looks like Listing 7.3.


    # Listing 7.3 Preamble of a Tripwire Report


    Tripwire(tm) Intrusion Detection Software v1.3


    This release is for single CPU, single-site, end-use purposes. For commercial
    applications or product information, please visit the Visual Computing Corporation
    web site at http://www.visualcomputing.com/tripwire, or call us at (503) 223-0280.


    Tripwire(tm) Copyright 1992-98 by the Purdue Research Foundation of Purdue University,
    and distributed by Visual Computing Corporation under exclusive license arrangements.'
