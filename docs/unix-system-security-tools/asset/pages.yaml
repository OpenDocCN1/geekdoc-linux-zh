  md: '# UNIX Network Services


    The conceptual barrier between the strictly local and the wider network has dissolved
    as every major UNIX implementation now includes a dizzying array of network-capable
    applications and services, from the hoary (circa 1971 FTP) to the hot (HTTP).
    At the same time, the scope of UNIX system software has expanded to include more
    and more network utilities. This chapter covers the security risks of several
    major network services and attempts to describe how these risks can be managed
    with sound techniques and tools. The risks associated with running HTTP/WWW services
    are covered in the next chapter.


    275'
