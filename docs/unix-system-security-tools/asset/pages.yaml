- img_proc: true
  md: '# Table 13.1 IP Addresses


    | Class | High-order Bits (value) | netid (size) | hostid (size) | Maximum Number
    of Hosts |

    | --- | --- | --- | --- | --- |

    | Class A | 0 | 7 bits | 24 bits | 16,777,216 |

    | Class B | 10 | 14 bits | 16 bits | 65,546 |

    | Class C | 110 | 21 bits | 8 bits | 256 |


    Actually, each of the maximum number of hosts depicted in the table should be
    decremented by two. Hostid zero is never assigned to a specific host. It is reserved
    for identifying networks. Similarly, the highest possible host value in a network
    serves as the broadcast address—an address which reaches all of that network''s
    hosts.


    To help you understand the table above, the IP address mentioned earlier, 128.10.30.2,
    belongs to a class B network; the first two bits in the IP address are “10.” Further,
    the network address is 128.10.0.0 and the broadcast address is 128.10.255.255.


    There are also Class D addresses (reserved for multicasting) and Class E addresses
    (reserved for experimental use). Neither concerns us here.


    # Protocol Layering


    TCP/IP is a protocol suite rather than a monolithic entity. It consists of a variety
    of standards that work cooperatively to establish and maintain communication.
    The reason TCP/IP''s designers created an interlocking set of protocols becomes
    clear when you consider


    +   - the survivability design goal

    - all the difficulties that can come up in data communication.


    Networks are prone to hardware failure: a robust communication protocol needs
    to be able to detect when a host has crashed and route around it. Anyone who''s
    surfed the World Wide Web knows that network congestion is an ongoing feature
    of the Internet: the protocol needs to be able to relieve hosts that are'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# Protocol Layering


    bogged down by too much packet traffic. Sometimes packets are sucked into virtual
    black holes and the network suffers packet loss: the protocols have to know when
    this has happened and compensate. At other times, data is corrupted by anything
    from electromagnetic interference to sequence errors: the protocol must detect
    and compensate for data corruption as well.


    To make these problems more manageable, the TCP/IP designers created a vertical
    stack of protocols that run on top of each other on each connected host. The morass
    of potential problems is nearly divided layer by layer, with a protocol (or protocols)
    at each layer that specializing in handling a particular problem.


    There are four conceptual layers—Application, Transport, Internet, Network Interface—that
    sit on a fifth layer of network hardware. Each of the four conceptual layers is
    explained in Table 13.2.


    # Table 13.2 TCP/IP Protocol Layers


    | Layer | Layer Name | Description |

    | --- | --- | --- |

    | 4 | Application | This highest level provides support for applications that
    allow users to access TCP/IP services. An application sends data to and receives
    data from the protocol running at the Transport Layer (layer 3). |

    | 3 | Transport | This layer provides for end-to-end communications from one application
    to another. It divides the stream of data into packets and passes each packet
    along with a destination address to the Internet Layer (layer 2). It also receives
    data from layer 2 and passes it to layer 4. Some layer 3 protocols ensure the
    data arrives without error and in sequence (i.e., TCP). |'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# Table 13.2 TCP/IP Protocol Layers (Cont''d)


    | Layer | Layer Name | Description |

    |---|---|---|n| 2 | Internet | This layer of the IP protocol handles communication
    between one machine and another. It accepts a packet from the Transport Layer
    along with the destination address. It encapsulates the packet and uses the routing
    algorithm to determine whether to deliver directly or send to a router. It then
    delivers the packet directly to the appropriate network interface for delivery.
    It also accepts packets from layer 1 and uses the routing algorithm to determine
    whether they should be processed locally (to layer 3) or forwarded (back to layer
    1). |

    | 1 | Network Interface | This lowest level is responsible for establishing, maintaining,
    and releasing connections between network hardware. |


    Note this layering model is similar to but distinct from the seven-layer model
    promulgated by the International Standards Organization, formally known as the
    ISO Reference Model for Open System Interconnection. Like the TCP/IP model operates
    according to set rules:


    +   * Beneath the conceptual layers is a layer of network hardware that forms
    the physical link between two systems.

    * Each successive layer is progressively less concerned with the details of network
    traffic and more concerned with the details of user applications.

    * Each layer can only communicate with the layers directly above and below it
    in the stack.

    * Messages get passed down through the lower layers at the transmitting end and
    back up through the layers at the receiving end.'
