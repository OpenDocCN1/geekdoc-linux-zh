  md: '# Foreword


    How do you make a UNIX computer that is secure? It''s easy... really. Just put
    the computer in a steel room, turn it off, and lock the door as you leave. Unfortunately,
    while this strategy leaves you with a computer that is fairly secure, it also
    leaves you with a machine that is completely unusable.


    If security and usability are the twin goals, what is the best way to proceed?
    The days are long gone when you could simply purchase a UNIX workstation with
    the operating system pre-installed, and then download patches over the Internet
    as they became available by the vendor. One reason is that the majority of computers
    running the UNIX operating'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'system are running "free" versions of the operating system that are not necessarily
    supported, or for which support costs extra. An even bigger reason is the fact
    that the best computer security tools are not bundled with operating systems in
    the first place. Instead, you need to research and find the tools on the Internet
    and install them yourself.


    The world of UNIX system security tools is vast, constantly changing, and largely
    undocumented. There is a lot of good software available on the Internet today—but
    little of it is accompanied by good documentation. User guides and README files
    go so far. Even the programs that have well-written manuals do not include overview
    documents explaining general security postures or planning. And no README file
    will tell you how to frame together many publicly available tools into an overall
    security framework.


    That''s why this book is so important. In this volume, Seth Ross has gathered
    together, in one place, concrete information on dozens of different state-of-the-art
    tools, including scanners, vulnerability assessment tools, and network programs.
    He has combined installation and running information with tips on why you should
    be running the programs in the first place. And he''s also written an engaging
    primer on UNIX for people who are new to the security game, or who are simply
    too busy to keep up with all of the required reading. This book and the tools
    it covers can help you attain both security and usability, along with some peace
    of mind.


    —Simson L. Garfinkel


    Author, Practical UNIX and Internet Security'
  merge: -1
