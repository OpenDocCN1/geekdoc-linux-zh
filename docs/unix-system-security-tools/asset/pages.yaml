  md: '# Logging


    Logging significant system events is a critical element of system security. Most
    UNIX systems are able to run three different logging subsystems: connect-time
    logging via the wtmp/utmp files; process accounting via the acct or pacct file;
    and error logging via the syslog facility. This chapter covers these logging subsystems
    and the many commands and programs that allow a sysadmin or security administrator
    to monitor, audit, and maintain logs. It also covers several add-on tools, from
    Zap, which helps you to stalk an intruder, to syslog-ng, a security-enhanced version
    of the standard UNIX syslog facility.'
  merge: -1
  pgno: 186
- img_proc: true
  md: 'UNIX maintains several basic log files that track and record what''s happening
    on the system, including who''s logging in, who''s logging out, and what they''re
    doing. Newer versions of UNIX track additional information such attempts to log
    in as superuser, files transferred over the network, email exchanges, and more.


    Log files are critical to maintaining system security. They provide data for two
    critical functions: auditing and monitoring. By providing a recorded history—an
    audit trail of activities on your system—they allow you or a third party to go
    back and systematically evaluate the effectiveness of your security program and
    determine the causes of security breaches and system malfunctions. If push comes
    to shove, they can be used as evidence that you can present to the authorities.


    They can also be used in "real time" to monitor system status, to detect and track
    intruders, discover bugs, and to generally head off trouble. You can bird-dog
    your system by logging entries as they''re created or you can use a tool like
    Swatch (page 197) to watch for you.


    # Logging makes users accountable for their actions, particularly in environments
    with strong user authentication policies and systems. Nonetheless, it''s always
    possible for one user to masquerade as another. Never assume that information
    contained in a log is sacrosanct—always try to confirm log reports through independent
    means before taking action.


    While the mere existence of a log doesn''t provide perfect accountability, logging
    enables system administrators and security officers to


    +   - discover repeated attempts to defeat system security (say, an attacker trying
    a brute-force login)

    - track users who assume a high level of privilege (say, those who use the sudo
    command to execute commands as root)

    - track anomalous usage patterns (Carol from accounting works from 9 to 5 but
    the logs show her logged in at 3 AM; Mallory is hogging CPU time)

    - track intruders in real-time'
  merge: -1
  pgno: 187
- img_proc: true
  md: 'Logging aids detection. It''s vital that you know when your systems are being
    attacked or an intruder has broken in. While logging won''t prevent a break-in,
    it represents a fallback for basic account security. Even if account security
    fails, and an attacker is able to exploit user privileges, you want this fact
    to be duly recorded. Once you know what''s happening, you can take appropriate
    actions: cutting a user off, strengthening the network perimeter, monitoring and
    stalking an intruder to gather forensic evidence, etc. Policies for logging, maintaining
    logs, log monitoring, and auditing are all important pieces of a complete security
    policy.


    Perhaps the most important security function of logging is deterrence. Elementary
    human psychology dictates that people will behave differently when they know their
    actions are being watched. It''s not enough to simply set up logging—you should
    publicize that you''ve done in order to instill fear. You want to develop communication
    strategies designed to impress potential attackers of the likelihood of getting
    caught (“Rule 5: The Fear of Getting Caught is the Beginning of Wisdom” on page
    23). The goal is to prevent an attacker''s or wayward user''s intent from reaching
    the critical point of action.


    You should get the word out that your systems are set up for logging. One effective
    way to do this is with a login banner warning: “WARNING! Use of this system constitutes
    consent to security monitoring and testing. All activity is logged with your username,
    host name and IP address.”


    Unfortunately, log files are themselves vulnerable to attack. Any reasonably competent
    system cracker attempts to cover his or her tracks by modifying either the log
    files or worse, the logging mechanism itself. There are countermeasures which
    you can take to help preserve the integrity and usefulness of logging subsystems.
    These are covered later in this chapter.


    > For a valuable overview of how a cracker covers his or her tracks after breaking
    into a UNIX system, see the Phrase magazine article, “Playing Hide and Seek, Unix
    style,” available at http://www.fish.com/security/hide-n-seek.html.


    Tip'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# Logging Subsystems


    In most UNIX systems, there are three main logging subsystems:


    +   - Connect-time logging—performed by various programs that write records into
    /var/log/wtmp (or /var/adm/wtmp), and /var/run/utmp (can be let /etc/utmp or /var/adm/utmp).
    Programs such as login update the wtmp and utmp files so that sysadmins can keep
    track of who was logged into the system and when that user was logged in.

    - Process accounting—performed by the system kernel. Upon termination of a process,
    one record per process is written to the process accounting file (either pacct
    or acct). Process accounting''s main purpose is to provide command usage statistics
    on to base service charges for use of the system.

    - Error logging—performed by the syslogd(8) daemon. Various system daemons, user
    programs, and the kernel report worthy conditions via the syslog(3) function to
    the files, /var/adm/messages and /var/log/syslog.


    In addition, many UNIX systems create log files. Servers that provide network
    services like HTTP or FTP typically keep detailed logs.


    Depending on the UNIX version, log files are typically written to either the /var/log,
    /var/adm, /usr/adm, and occasionally the /etc directories. Most Linux systems
    keep major logs in /var/log—I''ll use this convention in most of my examples.
    Common log files are summarized in Table 8.1.


    # Table 8.1 Common UNIX Log Files


    | Log File | Purpose |

    | --- | --- |

    | access_log | Records HTTP/web traffic |

    | acct/pacct | Records user commands |


    +   1. This categorization of log files can be found in http://csrc.nist.gov/nissc/1998/proceedings/paper01.pdf'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# The Login Records


    **Table 8.1** Common UNIX Log Files (Cont''d)


    | Log File | Purpose |

    |---|---|

    | acculog | Records modem activity |

    | btmp | Records bad logins |

    | lastlog | Records the most recent successful login time and the last unsuccessful
    login as well |

    | messages | Records messages from the syslog facility (often linked to or from
    the syslog file) |

    | sudoog | Records commands issued using the sudo command |

    | sulog | Records use of the su command |

    | syslog | Records messages from the syslog facility (often linked to from the
    messages file) |

    | utmp | Records each user currently logged in |

    | wtmp | A permanent record of each time a user logs in and out |

    | xferlog | Logs FTP sessions |


    # The Login Records


    The *utmp*, *wtmp*, and *lastlog* log files are the linchpins of the most important
    UNIX logging subsystem—the one that keeps track of user logins and logouts. Information
    about currently logged in users is recorded in the file *utmp*; logins and logouts
    are recorded in the file *wtmp*; and last logins in the file *lastlog*. Date changes,
    shutdowns, and reboots are also logged in the *wtmp* file. All records include
    time stamps.


    These files (all *lastlog*) grow rapidly on busy systems with many users. The
    *wtmp* file, for example, will increase without bound unless it is periodically
    truncated. Many systems come configured to rotate *wtmp* on a daily or weekly
    basis. It is usually pruned daily by scripts run by *cron*. These scripts rename
    and rotate the *wtmp* files, keeping a week’s worth of data on hand.'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'Typically, wtmp is renamed to wtmp.1 at the end of day one; on day two, wtmp.1
    becomes wtmp.2, etc. up to wtmp.7.


    # Caution


    No login or connect time accounting is performed if /var/log/wtmp does not exist.
    It must be created manually (touch

    var/log/wtmp).


    # The Basic Mechanism


    Each time a user logs in, the login program looks up the user''s UID in the file
    lastlog. If it is found, the timestamp of the last time the user logged in, the
    terminal line, and the hostname are written to the standard output. The login
    program then records the new login time in lastlog.


    After the new lastlog record is written, the file utmp is opened and the utmp
    record for the user inserted. This record remains until the user logs out at which
    time it is deleted. The utmp file is used by a variety of commands, including
    who, w, users, and finger (see below for more on these commands).


    Next, the login program opens the file utmp, and appends the user''s utmp record.
    The same utmp record, with an updated time stamp is later appended to the file
    when the user logs out. The wtmp file is used by the programs last and ac (see
    below).


    # Caution


    In older versions of UNIX, the /etc/utmp file was world-writable (-rw-rw-rw-).
    It shouldn''t be, this allows any user to edit the file (potentially to obscure
    their presence). Newer UNIX systems ship /etc/utmp with a more restrictive setting
    (-rw-r--r--).


    # Monitoring with utmp/wtmp-based Commands


    Both the wtmp and utmp files are in binary format—they can''t be tailed (with
    the tail command) or concatenated (with the cat command). You need to run one
    of several commands—including who, w, users, last, and ac—in order to take advantage
    of the information they contain.


    A system administrator should monitor system security by periodically checking
    who is logged into the system and what they''re doing. This is particularly true
    for a security-sensitive system, or one with many users. Is the guy on vacation
    logged on? Is a'
  merge: -1
