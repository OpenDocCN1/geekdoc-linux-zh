  md: '# Vulnerability Testing


    This chapter describes vulnerability testing—the process of systematically checking
    hosts for known configuration errors, bugs, and other security problems. This
    can be accomplished manually, with the assistance of security checklists and vulnerability
    databases, or programmatically, with a variety of system-checking tools. The chapter
    covers host-based tools that check the security posture of a single system, tools
    that check and then actively fix specific problems, and network-based tools that
    can detect vulnerabilities from the outside.'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# The Art of Security Checking


    Let''s consider a very likely scenario. You''ve been tasked with con-necting a
    system to the Internet. A strong security policy is in place.

    You''ve examined the security of your accounts, and double-checked by running
    Crack. You''ve reviewed filesystem security and hardened it by deploying cryptography.
    As a precaution, you''ve installed Tripwire to monitor critical system binaries.
    Your logging system is up and running, including process accounting. You''re running
    Swatch to monitor system events in real-time. You still need to check the system''s
    network security standing but, but from the point-of-view of system security,
    you should be ready to go.


    Or maybe not. With a new system, or one that''s being placed in a more hostile
    environment (like the Internet), it''s wise to check and double-check your work
    with a host-based security audit or review. This kind of examination is distinct
    from the logging and auditing described in the Logging chapter (page 167). Instead
    of looking back a record of what''s happened, a vulnerability test or host-based
    audit examines what might happen in the future. Instead of detecting abuse, a
    host-based audit is intended to prevent it. A good host-based audit or security
    review touches almost every aspect of system security—users, passwords, home directories,
    system files, world-writable and SUID/SGID files, and services offered—with the
    goal of finding and fixing system security vulnerabilities and configuration errors.
    It acts as a failsafe that can potentially catch errors, omissions, and oversights.


    # Checklists


    One way to review system security is to run through a checklist. Security checklists
    are a long-standing tradition in computer security (and in computer books). They
    usually contain items that pertain to known vulnerabilities and configuration
    errors. The system administrator examines each item on the list and cross-checks
    it against the system being reviewed. If the system is compliant, the item gets
    checked off. Potential vulnerabilities are fixed on the spot preventing their
    exploitation. Once all items are checked off and accounted for, the sysadmin proclaims
    the system “secure,” and the system is deployed.'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# The Art of Security Checking


    Or maybe not. A good checklist can encourage a sysadmin to discover a number of
    security weaknesses he may not have considered. At the same time, the checklist
    approach to security has intrinsic problems. No single checklist can ever be complete.
    Even an exhaustive checklist may be out of date—new vulnerabilities are found
    every day. Even an exhaustive and up-to-date checklist is only as good as the
    person using it. Humans have a tendency to develop blind spots to things they
    see every day or don''t want to notice. Sysadmins, in spite of their heightened
    discipline, are no exception. A sysadmin might think to himself: “I’ve seen a
    checklist item after updating my sendmail installation, but that''s a big bother—I’ll
    think about it some other time.” Even worse, the checklist approach may induce
    a false sense of security—we’ve checked all the items on all the lists, therefore
    we’re ready to connect our systems to the Internet.


    You need to think like the enemy (Rule 9 on page 27). Assume that a skilled attacker
    or intruder has seen all the checklists and will work around them with new exploits
    and variations on old favorites.


    As long as you keep the limitations of the checklist review in mind, it can be
    useful and instructive; there are good security checklists out there. Some general
    computer security lists may be applicable to some extent—others are system-specific.
    Probably the most exhaustive checklists available for UNIX systems are contained
    in Appendix A of Practical Unix and Internet Security—they encapsulate much of
    the helpful information in this venerable tome (see the Bibliography). Another
    good UNIX security checklist was put out by the Australian Computer Emergency
    Response Team (ASCERT). Here’s an excerpt with exemplary checklist items (including
    one not mentioned elsewhere in this work):¹


    +   1. ASCERT, “UNIX Computer Security Checklist (Version 1.1)” at ftp://ftp.auscert.org.au/pub/
    auscert/papers/unix_security_checklist or http://www.cert.org/ftp/tech_tips/ASCERT_checklist1.1'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# 4.7 Root account


    +   * DO restrict the number of people who know the root password. These should
    be the same users registered with groupid 0(e.g., wheel group on SunOS). Typically
    this is limited to at most 3 or 4 people.


    +   * DO NOT log in root over the network, in accordance with site security policy.


    +   * DO su from user accounts rather than logging in root. This provides greater
    accountability.


    +   * ENSURE root does not have a ~/.hosts file. is not in root''s search path.


    +   * ENSURE root''s login files do not source any other files not owned by root
    or are group or world writable.


    +   * ENSURE root cron job files do not source any other files not owned by root
    or are group or world writable.


    +   * DO use absolute path names when e.g., /bin/su, /bin/find, /bin/passwd. This
    is to stop the possibility of root accidentally executing a trojan horse. To execute
    commands in the current directory, root should prefix the command with "../command.


    # Vulnerability Databases


    Another way to "sanity check" your security posture is to consult security vulnerability
    databases. These allow you to search for publicly-known vulnerabilities that could
    affect your specific systems. Several of these are available on the World Wide
    Web, but be beware of snake oil. Some are put out by reputable vendors; others
    by hackers. Some are spotty; others are exhaustive.


    You can create your own checklist from items found in these databases and meticulously
    make sure each problem is dealt with appropriately. It is also wise to regularly
    check vendor sites for security patches. Some distributions, like Red Linux, are
    constantly patched (especially right after a major upgrade).


    > The strongest vulnerability databases is maintained by Internet Security Systems
    Inc. You can search ISS''s X-force database at http://www.iss.net/cgi-bin/xforce/xforce_index.pl


    +   2. Some are simple pages, like the "Incomplete List of UNIX Security Vulnerabilities"
    at http://www.cs.iasate.edu/~helmer/unixsecurity/unix_vuln.htm, or by Fyodor''s
    Expl World at http://www.insecure.org/sploits.html


    +   3. See http://www.redhat.com/support/docs/errata.html'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Host-based Tools


    Manually reviewing checklists and other sources of security information can take
    a long time. The process is also prone to error and human foibles. To compensate,
    there are several tools that automate the process. Built on a foundation of known
    vulnerabilities, vulnerability-testing programs like COPS and Tiger work against
    a checklist on the sysadmin''s behalf, checking items like:


    +   - system configuration errors

    - unsafe permissions settings

    - world-writable files

    - SUID/SGID files

    - crontab entries

    - sendmail and FTP setups

    - weak or null passwords

    - changes to system files


    Running a system-checker like COPS or Tiger for the first time can be an eye-opener.
    Both programs produce voluminous reports on their findings, exposing all sorts
    of vulnerabilities. Neither program, however, extend beyond the border of the
    system it''s running on. System-checkers check systems, not other hosts or networks.


    > Both COPS and Tiger can check system binaries for alterations, but you''re much
    off relying on Tripwire for this critical security check ("Tripwire" on page 151).


    Tip


    COPS and Tiger are covered in their own chapters (see page 227 and page 235).
    Both passively check system security; that is, they find problems but don''t fix
    them. Corrections are left to the sysadmin. These programs suffer from what is
    potentially a more serious problem—they haven''t been updated in a while. As a
    result, they may lag behind other tools in detection of recently discovered security
    holes.'
  merge: -1
  pgno: 236
- img_proc: true
  md: 'COPS (1990) and Tiger (1993) are “oldies but goodies.” While still fundamentally
    sound, they haven''t been updated to reflect new vulnerabilities or vulnerabilities
    specific to Linux. They still do a good job checking “old” or legacy systems,
    but use them with caution on newer systems.


    Whatever tool you use, you should run vulnerability tests at regular intervals
    (daily on critical hosts), and whenever


    +   * a new system is installed (to get a baseline)

    * a compromise is suspected

    * a compromise is confirmed


    In addition, you should run random tests at unusual times—to guard against the
    attacker who, having determined your schedule, might be ducking out of site during
    regularly scheduled checks.


    # Tools That Fix Problems


    Another class of tools can find security problems and fix them. The Titan tool,
    for example, will check systems running Solaris, report on discovered problems,
    request permission to make repairs, and then correct the problems (the team working
    on Titan includes COPS and SATAN protagonist Dan Farmer. A somewhat obscure tool
    called S4 checks and corrects systems running Digital UNIX. For summaries of these
    tools, see the “Vulnerability Testing Tools Survey” on page 220.


    Theoretically, it makes sense for a checking tool to make needed changes. This
    further reduces the chance of operator error. At the same time, it increases the
    chance of program error. For this reason, you want to be any program you comes
    from a reputable source (like the Titan team) before trusting it to do the right
    thing for your system’s security and usability.


    The disclaimer in the README file for the S4 tool is quite clear about the risks
    of automatic fixes:'
  merge: -1
  pgno: 237
- img_proc: true
  md: 'S4 IS DESTRUCTIVE! ITS NATURAL TENDENCY IS TO SHUT DOWN OR ELIMINATE ALL NETWORK
    SERVICES CONSIDERED INSECURE BY THE AUTHOR! YOU CANNOT INSTALL S4 ON A LIVE SYSTEM!
    THINGS WHICH ARE OFFICIALLY SUPPORTED ON DIGITAL UNIX MAY NO LONGER WORK AFTER
    S4 IS INSTALLED! YOU MUST INSTALL THIS ON A SCRATCH MACHINE AT LE ON BEFORE TRYING
    IT ANYWHERE ELSE! THIS TOOL IS FREE BUT UNSUPPORTED, USE AT YOUR OWN RISK! AM
    I BEING CLEAR ENOUGH??????


    > The above disclaimer is crystal clear. Nonetheless, it bears restatement—don''t
    run security-fixing tools on production systems, even if you know what you''re
    doing.


    Caution


    Not every testing program that makes changes is destructive, however. The chkcact
    tool runs a fairly benign set of directory checks and fixes it can be run by “users.”
    For a brief description, see page 220.


    # Network Security Scanners


    All the tools mentioned above restrict their activity to the system they''re running
    on. There is a substantial class of tools that use communication channels to probe
    other hosts for vulnerabilities. Although mentioned here, these tools are beyond
    the scope of this book, which is focused on system security and network security
    per se. As it pertains to system security, rather than network security per se.
    The 1995 release of SATAN (another Dan Farmer production) proved, these tools
