    dave    pts/t2    2:20pm 88:42        1  2  -sh

    trent   pts/t3    1:07pm                8:18

    mallory pts/t4    10:07pm 133:55               -sh

    alice   pts/t5    1:50pm                   1  1  w

    ```


    The uptime command is closely related to w. It outputs the

    header information cited above.


    # The users Command


    The users command prints a single line listing the users currently

    logged in. Each displayed user name corresponds to a login ses-\sion. So, if a
    user has more than one login session, that user’s name

    will appear the same number of times in the output.'
