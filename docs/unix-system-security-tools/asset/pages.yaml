  md: '# Planning Considerations


    The best time to install Tripwire is immediately after you''ve built a “virgin”
    system, one that''s either new or recently upgraded. A system that has been up
    and running for a while may already be compromised: running Tripwire after this
    point may be of little or no value. If it''s not possible to install Tripwire
    when the system is new, give serious consideration to re-installing system binaries
    while in single-user mode. While this isn''t trivial, it''s the only way to insure
    your system is clean and stays clean.


    Tripwire requires some advance storage planning. You need to store the baseline
    database as well as the program binary in a secure place lest an attacker alter
    these files in a way that defeats the purpose of the program. The optimal arrangement
    is to store these files on a removable read-only medium—like a write-protected
    floppy disk, optical disk, or CD-ROM''s is inaccessible to potential attackers.
    Alternatively, you can place the files on a secure remote machine and export read-only.
    Keep in mind that making hard drive read-only using the mount command is insufficient
    since an attacker with root access could easily remount the drive so that it can
    be written.


    It''s important to consider the trade-offs between security and performance that
    Tripwire offers. You can choose to run any of the program''s six signature algorithms
    and two checksums against any of your files. It''s important to keep in mind,
    however, that some of these algorithms are computationally expensive. Snefru,
    in particular, runs slowly. Only those with an extreme threat model will want
    to run all algorithms against every directory and file. By default, Tripwire uses
    MD5 and Snefru. These two alone provide great protection and consume plenty of
    CPU cycles. I configured one of my Tripwire installations to run MD5 against all
    files and both MD5 and Snefru against critical system files. Even so, it takes
    a half-hour to produce a report on a Pentium Pro system running Red Hat Linux
    5.0. You need to balance your security needs against available time and CPU cycles.


    # Anatomy of tw.config


    Tripwire''s configuration file gives you precise control over the files and directories
    that the program monitors. The file tw.config'
