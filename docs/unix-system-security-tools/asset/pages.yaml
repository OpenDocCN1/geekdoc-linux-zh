    Tip


    # /etc/services


    A service is a combination of port and protocol. Both client and server programs
    consult the /etc/services file, which lists service names, port numbers, and aliases.
    Many of these are defined by RFCs (several important RFCs are cited in the next
    chapter; all of them can be found at http://www.faqs.org). Well Known Ports and
    associated service names are listed in Appendix C on page 363.


    # TCP Wrappers


    In response a series of attacks on systems at Eindhoven University of Technology
    in the Netherlands, Wietse Venema developed a simple but elegant tool to control
    and monitor incoming network traffic called TCP Wrappers. TCP Wrappers amends
    the inetd method of invoking network services. It works by “wrapping” around default
    network server programs like FTP and Telnet. When a connection is made, TCP Wrappers
    is initially invoked instead of the default service. It subjects the incoming
    connection to simple access controls (via two files—/etc/hosts.allow and /etc/bost.deny),
    logs the name of the remote host, and then runs the original network server program.'
