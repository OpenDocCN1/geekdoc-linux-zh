  md: '# HTTP/WWW Security Risks


    Sadly, the systems that are most vulnerable to client-side web risks are those
    with a minimal or non-existent system security model: Microsoft Windows and the
    Macintosh. An inventory of bugs and security problems associated with browsers
    like Microsoft Internet Explorer and Netscape Navigator is beyond the focus of
    this book. Fortunately, many of these problems have received widespread publicity
    in the mainstream press (“New hole found in Netscape ... News at 11”). Scripting
    vulnerabilities illustrate the phenomenon nicely.


    Both major web browsers support the ability to download scripts embedded in an
    HTML page and execute them within the browser. Often, these programs are designed
    to interact with the user and transmit information between the browser and the
    server. Several times, significant bugs have been discovered in Netscape’s JavaScript
    and Microsoft’s VBScript—for example, see http://www.cert.org/advisories/CA-97-20.javascript.html
    Even without bugs, it’s trivial for a malicious webmaster to include scripts in
    HTML pages that can either breach confidentiality or cause serious damage. One
    common line of attack is to create a JavaScript that spoofs an error message or
    a prompt for a user’s login ID and password. Danny J. Gremoire calls these “Spartan
    Horses”—they are similar to Trojan Horses but simpler. Major sites like HotMail
    have been victimized by this trivial cracking method, which Gremoire documents
    and demonstrates at http://theworld.com/spartanhorse/


    Other client risks result from breaches of privacy. Many web sites write an identifying
    cookie to the client—cookies can track users and learn where they’ve surfed to.
    According to the RFC that specifies cookie handling, client software should provide
    a way to specify domains for which cookies should or should not be saved. Unfortunately,
    this capability has not been implemented.


    +   See http://www.faqs.org/rfcs/rfc2109.html'
