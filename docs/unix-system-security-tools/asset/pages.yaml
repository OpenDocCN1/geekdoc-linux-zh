  md: 'On most systems, the default umask value is 022.


    # SUID/SGID


    The set-uid (SUID) and set group-id (SGID) properties allow users to run programs
    with special privileges. UNIX actually has two types of user IDs. The “real user
    ID” is the user ID established during the login process. The second type of ID
    is known as the “effective user ID”—this can be changed during the course of a
    login session by the SUID and SGID bits.


    Ordinarily, when a user runs a command, the process inherits the privileges of
    the user’s login shell and the effective user ID is the same as the real ID. When
    the SUID bit is set, however, the process inherits the privileges of the command’s
    owner. This has many practical applications. When a user runs the passwd command,
    for example, he or she can make limited changes to the /etc/passwd file, even
    though the file is owned by root. This is possible only because the passwd command
    with the SUID permission of root.


    You can identify a SUID program by inspecting its permission mode. If the “x”
    is changed to “s,” the program is SUID. For example, both the passwd and ps commands
    are SUID:


    ```

    % ls -l /bin/su /bin/login

    -rws--x--x 1 root root 15572 Dec 29 1997

    /bin/login

    -rwxr-xr-x 1 root root 12672 Oct 27 1997 /bin/su

    ```


    This capability, while very useful, can be dangerous. A classic attack on UNIX
    system security is to create a copy of the shell that is SUID root and then hide
    it. By invoking this back door, the attacker gains root privileges. While only
    root can create a SUID version of the shell owned by root, imagine that you’re
    logged in as root and leave your terminal unattended. Someone walks by and commands
    the types following:


    ```

    # cp /bin/bash /home/mallory/.bash

    # chmod 4777 /home/mallory/.bash

    ```


    Mallory now has an SUID copy of bash at his disposal. He can run now commands
    with full root privilege.'
