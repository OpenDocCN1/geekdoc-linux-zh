  md: 'The Blowfish algorithm is initialized with a fixed string consisting of the
    hexadecimal digits of pi. The initial Blowfish state is then expanded with the
    salt and the password—this process is repeated a variable number of rounds (the
    number is encoded in the password string). The final Blowfish password entry is
    created by encrypting the string “OrpheanBeholderScryDoubt” with the Blowfish
    state 64 times.


    The encoded password entry contains the Blowfish version number, the logarithm
    of the number of rounds, and the concatenation of salt and hashed password—each
    separated by the “$” character. An encoded “8” might specify 256 rounds. A valid
    Blowfish password might look like:


    ```

    $2$12$IAq8PR8sUnJ1HaohxX209q1m2kW97J5dsdXmb.EF42qjqch

    ```


    In this example, the initial expansion proceeded for 4096 rounds. Given the large
    number of rounds and long passwords, Blowfish-encoded passwords are far more difficult
    to crack than those encoded with the traditional DES-based mechanism. Given the
    added security provided by these kinds of algorithmic improvements, it should
    only be a matter of time before they’re implemented in other UNIX systems.


    # One-Time Passwords


    All the methods above are effective in a local environment, but what happens when
    those proactively-checked properly-aged passwords are sent over a network (i.e.,
    in plain text)? An attacker can use a password sniffer tool that monitors LAN
    traffic and records username/password combinations. The username/password combination
    is also vulnerable every time someone logs in via an untrusted network like the
    Internet.


    An elegant solution to the threat of password interception is to use a password
    once and then throw it away. Essentially, there is no way to protect a password
    in transit. Instead of trying to prevent the threat of eavesdropping, an authentication
    system based on one-time passwords neutralizes the benefits of interception, a
    classic example of strong security through risk'
