    # The w Command


    The w command collects the utmp file and displays information

    about each of the users currently on the system as well as the pro-\cesses they
    are running. The header shows the current time, how

    long the system has been running, how many users are currently

    logged on, and the system load averages for the past 1, 5, and 15

    .


