- img_proc: true
  md: '# Introduction


    Monitoring is an onerous task for UNIX system administrators, particularly for
    those who are responsible for the security status of large numbers of hosts. Even
    a modestly busy server will produce thousands of lines of logging information
    each day, testing the ability of any one person to sift through it all. It''s
    not surprising that logs are often ignored or used only for auditing purposes
    after a break-in or security compromise has occurred.


    Swatch (the Simple WATCH) is designed to ease the burden of monitoring and auditing
    log files. The authors of the program describe managing a facility with a dozen
    servers and fifty machines, all of which reported to a single logmaster host—important
    log messages were getting lost in the chaff. They developed Swatch to sift through
    the logs and take simple actions in response to reported events (i.e., detected
    patterns). They had four goals in the program:


    +   - It should be easy to use

    - It should support a simple set of actions that could be taken in response to
    certain messages

    - It should support customization by users so they can define their own actions

    - It should be reconfigurable on demand without manual intervention¹


    Swatch, the resulting Perl-based program they created, has been widely deployed
    over the years and further developed by author Todd Atkins. It has become a standard
    fixture at many UNIX sites, including some large installations. As one sysadmin
    at Lockheed Martin Aeronautics points out: “Swatch is something we REALLY use
    in a REAL world environment...”² It’s become so


    +   1. Stephen E. Hansen and E. Todd Atkins, Stanford University. “Automated System
    Monitoring and Notification with Swatch,” 1993 LISA Conference. A postscript version
    of this paper is included with the Swatch distribution. Or see http://www.stanford.edu/~atkins/swatch/lisa93.html

    2. Alek Komarnitsky, Swatch: Automated UNIX System Monitoring & Notification.
    See http://www.komar.org/komar/alek/pres/swatch/cover.html'
  merge: -1
  pgno: 217
- img_proc: true
  md: '“mainstream” that it’s bundled with some systems—Red Hat Linux, for example,
    includes an easy-to-install RPM package for Swatch.


    > The log file monitoring and auditing capabilities of a tool like Swatch should
    be included in every UNIX and Linux distribution—if they’re not, ask your vendor
    why.


    # Overview of Swatch


    Swatch can be used in one of three ways. It was originally written to actively
    monitor messages as they are written to a log file via the UNIX syslog utility.
    It can also be used for auditing—that is, reviewing and checking a log file in
    a single pass. Finally, it can accept input from a program—this is handy for checking
    process accounting logs that aren’t kept as plain text. These three ways to run
    Swatch—along with relevant options—are more fully described in “Running Swatch”
    on page 209.


    > Designed for syslog, Swatch can monitor any log file, including connection-time
    records, sulog, web access logs, etc.


    Regardless of how Swatch is run, the tool is dependent on two critical items:
    event patterns and corresponding actions, both of which are specified in a swatch
    configuration file.


    # Patterns


    Swatch can act on a wide variety of recorded log events because it matches regular
    expressions or keywords as they appear in log entries; “reboot,” “Filesystem Full,”
    “BAD SU,” and “yourcompetitor.com” are all patterns that may require action. Swatch
    will accept any regular expression that’s compatible with Perl, which behaves
    like the egrep program, which, in turn, was built on the grep program.


    > For more on regular expressions as they’re used in Swatch, consult the man pages
    for egrep (or grep) and perl.'
