  md: '# Program Logs


    by sending more messages than it can handle, or by sending gigabytes of syslog
    messages, filling the target''s disk.


    Some versions of UNIX include syslog daemons that have been extended with security
    safeguards. FreeBSD, for, allows you to launch syslogd in "secure mode”—the "-s
    flag tells syslogd not to accept any log messages from remote hosts. FreeBSD also
    allows you to precisely control incoming messages by using the "allowed peer"
    argument (the "-a flag)—this allows you to specify your IP addresses and ports
    that can log to your system.


    # The logger Command


    UNIX is full of small-purpose programs. The logger utility, for example, is very
    handy. It does one thing and only thing: it provides a shell command interface
    to the syslog(3) system log module so that you can make entries in the system
    log.


    The syntax is: logger <message>

    If Alice issues a command like


    ```

    $ logger This is the end of the world

    it will produce a syslog record that looks like this:

    Apr 23 15:36:49 foo alice: This is the end of the world

    ```


    > Never fully trust log entries. As the logger example above shows, it''s all
    too easy for fun-loving users or attackers to spoof critical logs.


    Caution


