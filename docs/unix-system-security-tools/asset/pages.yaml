    # DNS


    The Domain Name System provides a cooperative, distributed system for mapping
    names to addresses. This critical piece of protocol infrastructure allows client
    computers to determine IP addresses from hostnames and vice versa. This process
    is called resolving. DNS also plays a critical role in determining where mail
    should be sent.


    The machines on the original Internet had short names consisting of a string of
    characters. The Network Information Center (NIC) gave out names and managed this
    flat namespace. As the net grew, this simple system broke down—there were only
    so many unique names that could be assigned, and the NIC faced an administrative
    burden of having to administer names for thousands of sites, each with hundreds
    of hosts. DNS was designed to provide a decentralized system that delegated authority
    for part of the namespace and distributed responsibility for resolving names and
    addresses.


    DNS establishes a hierarchy of name servers, each of which has a zone of authority
    it is responsible for. When a client needs a name resolved, it forms a domain
    name query and sends it to the appropriate name server, which then checks to see
    if the domain lies within its zone of authority. If it does, the name server sends
    a response based on its database. If not, the name server seeks the name server
    that has the answer or provides the client with a reference to the right name
    server.


