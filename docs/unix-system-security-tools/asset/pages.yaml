    individual systems. Successive rings of defense increase the effort an attacker
    has to undertake. By increasing the work factor of getting inside, defense in
    depth encourages the attacker. Medieval castles were built with concentric rings
    or keeps, ramparts, and moats. As attackers penetrate the outer walls, defenders
    fall back on increasingly well-protected defenses like a keep or bailey. Once
    through the outer wall, attackers must defeat a keep with only one access route:
    a ladder to a door high in the wall.


    As with the Medieval castle, so with UNIX. Figure 2.2 provides a model for how
    to look at the security of a UNIX system.


    In a computing system, the first line of defense is physical security. If your
    systems are open to the public and unsupervised, you effectively have no security
    whatsoever. The root account can be compromised by an intruder who might open
    the computer''s case and pull the non-volatile ROM chip that stores a hardware
    password. Or the attacker could simply rip out a hard drive, take it to home,
    and attach it to another computer.


    Assuming that your systems are protected from physical access by mechanisms as
    locked doors or pass cards, the next layer of defense is account security. Here,
    the username and password combination is critical. Can an attacker create an account,
    access a legitimate user''s account, or in the worst case scenario, access the
    root account? If so, your system is obviously at great risk.


    +   4. Paul Baran et al. On Distributed Communications. RAND Report Series, August
    1964.'
