    administrators must exercise sound judgment, and are also obliged to take steps
    to have the law upgraded or corrected as is possible within their jurisdiction.


    Canon 2—A system administrator shall not unnecessarily infringe upon the rights
    of users. System administrators shall not act with, nor tolerate discrimination
    between authorized users based on any commonly recognized grounds (e.g., age,
    gender, religion, etc.), except where such discrimination (e.g., with respect
    to unauthorized users as a class) is a necessary part of their job, and then only
    to the extent that such treatment is required in dealing with the issue at hand.
    System administrators will not exercise their special powers to access any private
