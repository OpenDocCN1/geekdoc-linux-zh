    Businesses have been rushing to connect to the Internet with the expectation that
    they can complete turnkey security. While security vendors may disagree, I don''t
    believe turnkey solutions are even possible. There are too many variables to account
    for. There are too many variations in security policies, threat models, system
    configurations, and connectivity. You want to avoid the Margot Line syndrome:
    i.e., relying on a singular safeguard like a firewall that can be systematically
    sidestepped. Security is not something you buy, invent or do as a one-time event;
    it''s a continual process that requires ongoing planning, monitoring, and refinement.


    A corollary to this rule: There''s no checklist that will account for all vulnerabilities.
    Security checklists are a venerable way to check for errors and omissions, but
    don''t be dulled by them. The checklist method of security will fail against an
