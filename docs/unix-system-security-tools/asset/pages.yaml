    Note that TCP Wrappers is included with Red Hat and other Linux distributions.


    # IP Security


    The Internet Protocol was not designed for security. Its overriding purpose is
    to move packets from one machine to another. Its designers made no intrinsic provisions
    for authenticating hosts or protecting the privacy of communications in transit.
    Thus, it''s not surprising that attacks on IP-based communications have increased
    with the spread of IP networking.


    Given IP''s lack of authentication controls, many attacks are based on spoofing
    and trickery. Say Host A is set to accept connections from Host B. Host M can
    spoof Host A into thinking it''s Host B (IP spoofing). Given IP''s lack of encryption,
    Host M can sit between A and B, intercepting and then forwarding their communications
    (data spoofing or a man-in-the-middle attack).


    Some attackers will use any one of dozens of packet sniffers—programs that can
    listen to the transmissions between two machines and find interesting patterns
    (like username/password combinations). Other attackers may try connection hijacking
    to take over a telnet or other interactive session.


    The weakness of IP is compounded by weakness in many of the services that run
    over it in the next chapter, "UNIX Network Services" on page 275.


    The current version of the Internet Protocol is version 4 (IPv4). Given its vulnerabilities,
    security has been a major design consideration of the next generation IP—IP version
    6 (IPv6). Additionally, protocol designers have promulgated a "secure" IP called
    IPSec that works with either IPv4 or IPv6.


    In general, encryption features like confidentiality can be added to any of the
    layers of the TCP/IP stack (depicted in Figure 13.1 on page 259): Application,
    Transport, Internet, or Network Interface.'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# IP Security


    A good example of application-level encryption is the Secure Shell (SSH) tool.
    SSH allows users to log into another computer over a network, execute commands
    on a remote machine, and to move files from one machine to another while providing
    strong authentication and secure communications. It is intended as a replacement
    for login, rsh, and rep (for SSH URLs, see the Tip on page 284).


    Transport-layer security can be provided by Secure Sockets Layer (SSL) technology
    (also known as Transport Layer Security or TLS). This method of protecting transmissions
    is widely used in “secure web servers”—an SSL-enabled web server browser. I cover
    this in “Protecting Against Transmission Risks” on page 317.


    IP-level encryption can be provided by IPSec (see below). Finally, network interface
    (or link-level) encryption can be provided by dedicated encryption hardware.


    # IPSec


    IPSec provides an architecture for a variety of security services for either IPv4
    or IPv6. It works at the Internet Layer, providing confidentiality, integrity,
    and authentication for that layer and those above. Eventually, all Internet communications
    should be protected this way—it’s more efficient to systematically encrypt and
    decrypt incoming and outgoing packets than to deploy dozens of encryption-aware
    applications. While various add-on technology is being widely deployed on corporate
    Internet sites to form “virtual private networks” (VPNs), IPSec is the preferred
    long-term solution, forming a real private network.


    > You can find out more about IPSec in RFC 2041, “Security Architecture for the
