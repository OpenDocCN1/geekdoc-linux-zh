    There are four types of modules, each of which corresponds to a management task
    outlined above.


    +   * auth—Establishes users who are who they claim to be by instructing the application
    to prompt the user for a password (or another means of identification). Can also
    grant group membership or other privileges through its credential granting properties.

    * account—Performs various account management tasks. Can be used to restrict or
    permit access to an application based on a variety of parameters such as the time
    of day, available system resources, or the location of the user (console vs. tty).'
