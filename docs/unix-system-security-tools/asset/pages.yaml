    The of "easy" is tricky in this context because none of the tools in the entire
    UNIX security corpus are no-brains to install. They all require some foresight
    and effort. In many cases, tools that I thought might be very useful would not
    install at all on my reference machines. In other cases, tools were very elegantly
    designed and implemented—installation was painless enough that I could devote
    time and mental energy to configuration and rather than compiler errors and such.


    +   - Can this tool be configured to specific circumstances?

    No two UNIX systems are identical in every way. A good tool is flexible—the designers
    considered the various environments the tool would be used in and provided for
    customization.


    +   - Is this tool reliable?

    an unreliable security tool can be worse than no security tool at all since it
    provide a sysadmin with a false sense of security.


    +   - Is this tool reasonably easy to use?

    The regular operation of a tool should be a relatively simple matter. Human nature
    resists using complex or overly difficult tools—a tool that is too cumbersome
    won''t get used and thus wont provide needed protection. Also, the tool should
    produce readable output. Succinct reports are preferable to voluminous ones since
    the data reduction capabilities of any one person are limited. The Crack tool
    is a good example of a tool that provides reliable output: account so-and-so has
