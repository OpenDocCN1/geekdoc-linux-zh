  md: '# A Red Hat version of CFS—packaged as an RPM by Georg P. Israel—can be downloaded
    from

    http://www.replay.com/redhat/cfs.html


    TCFS

    A research group in Italy has been working on the Transparent Cryptographic Filesystem
    (TCFS), a Linux package inspired by CFS. TCFS is designed with even greater transparency—users
    don''t even have to know their files are encrypted. Whereas CFS sits on top of
    the native filesystem, TCFS integrates with the Linux kernel, resulting in better
    performance. TCFS operates like NFS: a TCFS filesystem can be accessed by applications
    using the same system calls as NFS (open, read, write,...). Blocks of data are
    correctly decrypted only if the right key is available to the kernel.


    You can find out more about TCFS at http://tcfs.dia.unisa.it/


    > When CFS or TCFS can slow down an attacker, they can''t protect user files from
    a compromised root account. The superuser can modify the kernel, the crypto software,
    or keep a log of every keystroke.


    # Backups

    It''s difficult to overstate the importance of regular data backups. Nothing compares
    to the experience of losing data, especially huge chunks of data. Every user and
    every system administrator loses data from time to time. The wise and the strong
    can recover because of sound backup strategies and execution.


    # The Varieties of Computer Failure

    There are so many ways that data can be lost or compromised. Shall we count the
    ways?


    +   * Hardware failure—hard drives crash (even new hard drives sometimes)

    * Software failure—operating systems and applications sometimes have bugs that
    can destroy-data'
