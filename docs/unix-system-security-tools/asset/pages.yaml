    # Active vs. Passive


    There are two FTP modes: active and passive. In active mode, the ftp client initiates
    a session by using a random port to contact server port 21, and the server responds
    by opening a data channel to the client (an “active open”). The data channel goes
    from server port 20 to the same random port number that initiated the session.
    In passive mode, the client initiates a session, is allocated a random port on
    the server, and then opens the data channel, which the server uses to send data
    back to the client.


    Newer FTP clients—like those implemented in web browsers—support passive mode.
    This is a good thing from the perspective of a firewall, which can honor outgoing
    client requests without allowing incoming connections from untrusted FTP servers.


    > In some ways, using passive mode merely transfers the risks of accepting calls
    on random ports from the client to the server. Since there are more clients than
    servers, and it''s easier to secure a single server than numerous clients, this
    arrangement improves overall security. RFC 1579 by firewall guru Steven M. Bellovin
    explores the merits of active vs. passive mode. http://www.faqs.org/rfcs/rfc1579.html


    Caution


