    # Verifying MD5


    MD5 checksums sometimes accompany software. You can use these to verify a package.
    For example, if you go down the COPS system checker from the CERT FTP site, you''ll
    find a check-sum file with the following entries:


    ```

    MD5 (cops.1.04.README) = 3e9af35c6dd4ed014b794efed61a046e6

    MD5 (cops.1.04.tar.gz) = dc287985fc28fb61138470c31ecebe5

    ```


    You can run the GNU-based md5sum utility (part of the textutils package) which
    is included with Red Hat Linux, and the md5 com-mand with BSD systems to verify
    the downloaded files as shown here:¹²


    ```

    # md5sum cops.1.04.tar.gz

    1fa4168729345bee99068f9989cb8b0 cops.1.04.tar.gz

    ```


    In this case, isn''t a match. Perhaps the package was dam-aged in transit. In
    any case, the checksuming approach is not a strong method of verification. If
    an attacker can replace the legitimate package with a Trojan Horse version, he
    or she can replace the checksums file at the same time. If he so, every well-meaning
    sysadmin who downloads the Trojan will get a perfect MD5 match.


    Note that MD5 can be used to verify system files as well. As you run the following
    check on the important lilo (Linux Loader) system binary when you install your
    system:


