  md: '# Asset Identification


    Draft a list of all the assets within your security domain. This will include
    all your systems, including hardware and software, all the data living on your
    systems, and your people (time is money). Think hardware, software, and wetware.
    You''ll also need to account for intangibles such as good will and reputation.


    A complete inventory includes hardware items such as CPUs, motherboards, RAM,
    disk drives, display monitors, printers, telephone lines, modems, network cabling
    plants, routers, and switches. Software assets include operating system binaries,
    operating system source code, application programs, utilities, security software,
    and diagnostic programs.


    How valuable is all the data within your security domain? Account for and classify
    proprietary or confidential data, from customer databases to patent applications.
    Then throw in more routine data. Include databases, documents, backups, system
    logs, and offline data.


    As for people, they are the users that depend on your systems. Their time is valuable.
    If they''re working in a mission-critical setting, their time may be extremely
    valuable. The health and safety of your personnel may be on the line as well.
    There are administrators, IT support staff, and even customers and vendors to
    consider as well.


    Finally, it would be wise to identify intangible assets such as your organization''s
    public image and reputation and the goodwill of customers. In the case of a bank,
    for example, its reputation for integrity and reliability is essential to operations.


    # Asset Valuation


    Determining the value of assets can be daunting. For the purposes of a security
    review, asset valuation need not be precise. Most assets can be evaluated on a
    monetary basis. Some, such as software packages, hardware, and mailing lists,
    have an obvious market value. Others can be measured in terms of business interruption.
    A trading firm, for example, knows that a certain dollar volume of business will
    be lost if its web servers are down for an extended period of time.'
