    # Security Policies


    RFC 2196 offers this lucid definition of security policy: “a formal statement
    of the rules by which people who are given access to an organization’s technology
    and information assets must abide.\”


    # Why Have a Security Policy?


    The primary purpose of any security policy is to provide a baseline for acquiring,
    configuring, managing, and auditing computer resources. While a security policy
    can be developed on an entirely informal basis (it may be as simple as “no one
    touches my standalone home box”), any UNIX site with more than two users will
    need to commit the policy to writing. A written security policy can be a good
    tool for informing users, staff, and managers of their obligation to protect technology
    assets.


    A strong security policy is a pre-condition for the rational and successful deployment
    of security tools. If a site doesn''t have a clear set of rules and goals, the
    process of setting up, deploying, and running security tools is unlikely to be
    effective. For example, a security administrator can run Crack against a system’s
    passwords, but unless a password policy has been articulated, the admin is likely
    to waste time discovering the obvious—users pick bad passwords.


    # Qualities of a Good Security Policy


    Security policies should be clear and unambiguous. Brevity is a benefit. A strong
    security policy establishes ownership and provides clear lines of responsibility.
    Without citing specific names, it establishes who within the organization has
    primary responsibility for maintaining key aspects of system security. It should
    have the buyin of all important constituencies within the organization: the security
    or system administrators, IT technical staff, line managers, and legal counsel.
    Naturally, a good security policy is one that can


