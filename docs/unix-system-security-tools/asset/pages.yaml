  md: '# The World of UNIX Security Tools


    Almost all of the security tools covered in this book are open source, as is the
    Red Hat Linux reference platform I''m using. The benefits of open source security
    software are numerous. In a process similar to peer review in the scientific community,
    open source code can be analyzed, audited, and vetted by dozens, hundreds, or
    even thousands of concerned practitioners. Bugs and other aberrations can be quickly
    discovered and patched, creating a substantial disincentive for programmers to
    place back doors, Trojan Horses, and other kinds of malicious code in their programs.
    In this way, open source software can be more trustworthy than proprietary software,
    illustrating what Raymond calls “Linus’s Law” (after Linux inventor Lin Torvalds):
    “Given enough eyeballs, all bugs are shallow.” Given open source, security problems
    can be characterized quickly and the fix will be obvious to someone.


