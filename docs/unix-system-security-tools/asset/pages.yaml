  md: '# Computer Security: A Practical Definition


    +   Privacy—Ensuring that individuals maintain the right to control what information
    is collected about them, how it is used, who has used it, who maintains it, and
    what purpose it is used for


    These additional elements don''t neatly integrate into a singular definition.
    From one perspective, the concepts of privacy, confidentiality, and security are
    quite distinct and possess different attributes. Privacy is a property of individuals;
    confidentiality is a property of data; and security is a property assigned to
    computer hardware and software systems. From a practical perspective, the concepts
    are interwoven. A system that does not maintain data confidentiality or individual
    privacy could be theoretically or even mathematically “secure,” but it probably
    wouldn''t be wise to deploy anywhere in the real world.


    # A Functional View


    Computer security can also be analyzed by function. It can be broken into five
    distinct functional areas:¹⁰


    +   Avoidance—A security fundamental that starts with questions like: Does my
    organization or business engage in activities that are too risky? Do we need an
    unrestricted Internet connection? Do we really need to computerize such business
    process? Do we really standardize on a desktop operating system with no control
    intrinsics


    +   Deterrence—Reduces the threat to information assets through fear. Can consist
    of communication strategies designed to impress potential attackers of the likelihood
    of getting caught. See “Rule 5: The Fear of Getting Caught is the Beginning of
    Wisdom” on page 23.


    +   Prevention—The traditional core of computer security. Consists of implementing
    safeguards like the tools covered in this book. Absolute prevention is theoretical,
    since there’s a vanishing point where additional preventative measures are no
    longer cost-effective.


