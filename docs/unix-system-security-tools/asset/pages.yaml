    and group.


    As discussed in the “Account Security Basics” chapter, each UNIX user is associated
    with a unique username and user ID number (UID). Additionally, every user is associated
    with one or more groups. Primary group membership is defined in the /etc/passwd
    file. For example, the user johndoe is associated with UID 123 and group 12 (staff).
    He is also a member of group 230 (ppusers).


    Every file in the UNIX filesystem is owned by one user and one group. Typically,
    a file is owned by the user that created it and that the user’s primary group
    (though BSD systems sometimes assign ownership to the group that owns the directory
    file in).


    Each file and directory has three sets of permissions with it: one set for the
    owner of the file, one set for members of the group file is associated with, and
    one set for all other users (commonly referred to as “the world” or “others”).


    Each set of permissions contains three identical permission bits that control
    the following:


    +   * read (r)—If set, the file or directory may be read.


    +   * write (w)—If set, the file or directory may be written or modified.


    +   * execute (x)—If set, the file or directory may be executed and searched.


