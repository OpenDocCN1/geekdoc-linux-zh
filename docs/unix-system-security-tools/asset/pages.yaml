    This will build the directories specified in the Makefile.


    # Configuring Tiger


    Once you''ve installed Tiger, there are a couple of configuration files you''ll
    want to look at: tigerrrc and site.

    Tiger is controlled by the tigerrrc configuration file. The Tiger package includes
    several example tigerrrc files, including one that runs all of Tiger''s checks
    (tigerrrc-all).


    > The default tigerrrc file included with the Tiger distribution is customized
    for Texas A&M systems—some Tiger checks are disabled. You should consider copying
    tigerrrc-all or tigerrrc-dist to tigerrrc and then editing it for your systems.


    Running all the checks may seem like a good idea, this produces very long reports.
    In fact, the more verbose the reports are, the harder it is to identify security-critical
    items. Once you have Tiger up and running, you''ll need to restrict the checks
    to those that are important for your system.

    nYou may also need to edit the site file, which is used to set Tiger up for a
    specific host. Of particular interest is the entry for Crack. If you want Tiger
    to initiate Crack runs for weak passwords, you''ll need to specify the path to
    the Crack script (/usr/local/etc/crack/Crack or /usr/local/sbin/c50a or whatever).
    The Tiger distribution includes a file site-sample, which you can edit and rename
    to site.


    # Running Tiger


    To run a complete tiger report with explanations for each item found (the -e flag),
    run the command:


    ```

    # ./tiger -c tigerrrc-all -e

    ```


    Note that the “-c” flag specifies use of the tigerrrc all file and the “-e” flag
    adds the explanations.'
