  md: '# HTTP/WWW Security Risks


    Web security risks can be classified into three general categories:


    +   - threats to the web server and the LAN it''s connected to

    - threats to the web browsing client

    - threats to the communication channel between the server and client


    # Web Server Risks


    The widespread deployment of web servers poses a network security paradox. The
    general goal of network security is to keep strangers off the network. Yet the
    general goal of a web server is to solicit strangers to visit your site in a controlled
    manner. There''s plenty of room for conflict in the middle ground between these
    divergent goals.


    There are several generic threats that every web server faces. Bugs in the HTTP
    server software, misconfiguration, insecure CGI programs, and the lack of strong
    encryption can allow attackers


    +   - to alter or replace the server provides

    - to gain access to confidential documents protected by the server''s access controls

    - to execute arbitrary commands on the server and thus subvert the server''s system
    security

    - to violate user privacy by inspecting log files

    - to launch denial-of-service attacks that incapacitate either the server or the
    network connection


    All of these threats have manifested themselves in the short history of the web.
    On September 13, 1998, the New York Times suffered a humiliating breach of web
    security.¹ The team of crackers known as HFG (H4CK1NG 4G1RL13Z) gained control
    of the paper''s web site and replaced the home page with a hairy collection


    > 1. For more on this attack, see http://www.dailyflame.com/006-nyt.html'
  merge: -1
