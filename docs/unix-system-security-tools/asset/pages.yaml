    # UDP


    The User Datagram Protocol is an unreliable connectionless delivery service that
    relies on IP to transport messages between machines. The protocol provides a procedure
    for application programs to send messages to other programs with a minimum of
    protocol mechanism. In contrast to TCP, the protocol is transaction-oriented—delivery
    and duplicate protection are not guaranteed. An application that uses UDP is fully
    responsible for handling problems like message loss, duplication, delay, and out-of-order
    delivery.


    Like IP, UDP makes a “best effort” to deliver packets. UDP runs quite reliably
    on a LAN and less reliably over the public Internet. The advantages of UDP are
    their simplicity and economy—less overhead headers results in greater throughput.


    UDP is used for resolving hostnames, transmitting routing information, Sun Microsystem’s
    Network Filesystem (NFS), and several obscure services that can miss a packet
    here and there without catastrophic results.'
