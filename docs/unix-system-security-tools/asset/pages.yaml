- img_proc: true
  md: '# Chapter 06 / Filesystem Security


    +   - User error—it''s very easy to delete critical files by mistake

    - Sysadmin error—it can be very destructive when it happens

    - Electronic break-ins—the system crackers are out there probing systems

    - Theft—what if someone comes in and lifts your ecommerce server?

    - Natural disaster—lightning, hurricanes, tornadoes, and earth-quakes all happen


    # Backup Strategies


    There are four types of backups:


    +   - A day-zero backup—A copy of every file as it exists when you first build
    or install a system. A “virgin” backup can be invaluable if someone breaks into
    your system and changes system files.

    - A full backup—A copy of every file on your system made on a regular basis.

    - An incremental backup—A copy of those item in the filesystem that have changed
    since the most recent full backup or incremental backup.

    - An ad hoc backup—A copy of working files made during the course of a project.
    In addition to system-wide backups, users should make ad hoc backups of their
    work each day.


    # Backup Commands


    Most Unix systems include a number of commands that can facilitate system backups.


    +   - cp—While usually used to copy single files, the cp (copy) command supports
    a recursive option (-R) that copies a directory and all its files and subdirectories.
    To copy all the contents of mydir to mydir2: cp -R mydir mydir2. Use of the vestigial
    alternative “-r” is deprecated since it doesn''t copy through symbolic links on
    some platforms.'
