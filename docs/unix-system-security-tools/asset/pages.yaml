  md: '# Chapter 01 / Introduction


    Ken Thompson in the late 1960s, the UNIX operating system has been programmed
    and hacked by successive generations of systems programmers.


    In November 1988, Robert Tappan Morris released the infamous "Internet worm" that
    corrupted thousands of net-connected machines overnight. Morris, son of a top
    US security official, brought issues of UNIX security to the forefront of the
    nation''s attention. The worm exposed a Pandora''s Box of vulnerabilities in UNIX,
    including bugs in the venerable sendmail and finger programs. It also exploited
    the concept of "trusted hosts" in UNIX—a mechanism developed as part of the Berkeley
    networking software that enabled users to execute commands from remote machines.
    Beyond its immediate impact on infected systems, the worm called into question
    the "open lab" approach to UNIX security, which maximizes resource-sharing and
    trusting cooperation at the expense of formal security controls. It represented
    a turning point—from the worm on, many UNIX installations have had to reconsider
    their security standing.


    In the wake of Morris'' worm attack, the UNIX community expended considerable
    energy to beef up security. Several leading organizations formed CERT (Center
    for Emergency Response Teams), which to this day is the number one source of information
    regarding security problems in UNIX systems. Vendors patched holes and increased
    their efforts to make sure updates adopted by their customers. Perhaps most significantly,
    UNIX programmers developed an arsenal of new security tools and made them freely
    available on the Internet.


    As a result, every UNIX sysadmin now has a toolbox of security tools at his or
    her disposal. Many of these tools and capabilities are built into modern UNIX
    implementations. Indeed, there is a major trend toward incorporating and bundling
