  md: 'NFS is built on Remote Procedure Call (RPC) primitives and uses RPC''s authentication
    methods to ensure security. It originally ran over UDP for performance reasons.
    It can now run over the more reliable TCP. Clients and server negotiate which
    protocol to use.


    A server grants access to a filesystem by adding an entry for that filesystem
    to the server''s /exports file. A client gains access to that filesystem with
    the mount system call, which requests a file handle for the filesystem. Once the
    filesystem is mounted by the client, the server issues a file handle to each client
    (or directory) the client accesses. If the file is removed on the server by another
    NFS user, the file handle becomes stale and produce an error.


    The count is an implementation of the mount protocol, which is described in RFC
    1094. See http://www.faqs.org/rfcs/rfc1094.html Also, RPC is defined in RFC 1057—see
    http://www.faqs.org/rfcs/rfc1057.html


    Unfortunately, NFS has built-in security. It was developed in old times (1985),
    when the slogan “the network is the computer” referred to LANs rather than the
    global Internet.


    Information transmitted by NFS over the network is not encrypted—thus, it''s subject
    to eavesdropping and/or interception.


    NFS uses the same authentication scheme as the UNIX file system and thus inherits
    UNIX''s file system vulnerabilities. ¹¹³ NFS accepts client requests when the
    client''s IP address appears on a list of trusted hosts. Under this scheme, users
    can be impersonated, since most of the permission checking is performed on the
    client. An imposter can trick a server by temporarily assigning the IP address
    of a victim to his own workstation. From that point on, the imposter can assume
    a false user ID to make NFS requests and thus access, alter, or even destroy private
    or confidential data on the server.


    +   13. It is possible, however, to configure NFS so that it utilizes one of two
    authentication services: either one based on the Diffie-Hellman key exchange protocol
    and one based on Kerberos.'
