  md: '# Backup Blunders


    The following pointers will help you avoid getting burned by backup problems.


    +   Verify backups—Any number of things can go wrong with the best backup system
    and strategies. Check the integrity of your backup media on a regular basis by
    running test restores.


    +   Protect media—Backup media need to be protected, because they contain copies
    of every file on your computer. Lock them up! If security is important at your
    site, don''t leave backups running unattended—somebody could swipe your tape and,
    with it, all of your users'' files.


    +   Write-protect your backup tapes—Moveable tabs on both DAT and 8-mm tapes allow
    you to take prophylactic measures against accidental erasure.


    +   Regularly send a set of backups to an off-site location—You''re not prepared
    for disaster if you back up your system and leave the backup tapes sitting next
    to your computer. Fire, flood, or theft could eliminate your backups along with
    your system. For ultimate protection, you might contract with one of the firms
    that send encrypted data via modem from servers to archives hidden in reinforced
    concrete bunkers—a legacy of years when corporations feared thermonuclear war.


    +   Be mindful of media limits—Some kinds of tape cannot be used over and again
    again without degrading. Know and respect the vendor-recommended limits.


    +   Print paper records—Hard copies of important configuration and system files
    are very difficult for an attacker to alter.


    +   Train the personnel responsible for backups—The function is critical enough
    to warrant special training in operating backup software and hardware.'
