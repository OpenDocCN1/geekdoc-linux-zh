    to other Internet systems, including those supported by the SMTP; NNTP, FTP, Gopher,
    and WAIS protocols. Through the use of proxies and gateways, HTTP allows basic
    hypermedia access to resources available from diverse applications.


    The popularity of the WWW—and the ubiquity of the HTTP protocol—is one of the
    most amazing developments in the history of the Internet. Despite the hegemony
