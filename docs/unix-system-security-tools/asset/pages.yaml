  md: 'HAVAL—Based on MD5, Haval was developed by Yuliang Zheng, Josef Pieprzyk, and
    Jennifer Seberry. It can output hash values of variable length, from 128 bits
    to 256 bits. It can be configured to run a variable number of rounds.


    Snefru—A one-way hash function with a colorful name (after a pharaoh), Snefru
    outputs 128-bit or 256-bit values. Like HAVAL, it can be configured to run a variable
    number of rounds. Its creator, Ralph Merkle, suggests a minimum of 8 rounds to
    ensure security. Multiple rounds, Snefru is slow—one way to speed Tripwire up
    is to eliminate file checking with Snefru.


    You can find source code for Snefru at

    ftp://coast.cs.purdue.edu/pub/tools/snefru/ or on the accompanying CD-ROM.


    # Tip


    # Digital Signatures


    One-way hash functions are often used with public-key algorithms to create digital
    signatures. Like a handwritten signature, a digital signature provides proof-of-authorship
    (authentication). Unlike a conventional signature, a digital signature can also
    indicate whether the signed document has been modified. In its simplest form,
    a digital signature is a message that is encrypted with the author’s private key.
    This is like public-key-key crypto run backwards. Public-key crypto provides two
    keys: a public key used to encrypt a message and a private key that decrypts messages
    once they are received. Using digital signatures, the message is encrypted with
    the private key so that anyone with the public key can decrypt it.


    In reality, public-key algorithms run too slow to sign long documents. Most digital
    signature protocols use one-way hash functions to create message digests: why
    sign the whole document when signing the message digest works just as well? This
    is faster and requires less storage space.'
