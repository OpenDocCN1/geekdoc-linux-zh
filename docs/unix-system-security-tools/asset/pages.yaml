    # Computer Security: A Practical Definition


    Defining “computer security” is not trivial. The difficulty lies in developing
    a definition that is broad enough to be valid regardless of the system described,
    yet specific enough to describe what security really is. In a generic sense, security
    is “freedom from risk or danger.” In the context of computer science, security
    is the prevention of, or protection against,


    +   * access to information by unauthorized recipients, and

    * intentional but unauthorized destruction or alteration of that information¹


    This can be re-stated: “Security is the ability of a system to protect information
    and system resources with respect to confidentiality and integrity.” Note that
    the scope of this second definition includes system resources, which include CPUs,
    disks, and programs, in addition to information.


    8. Dictionary of Computing, Fourth Ed. (Oxford: Oxford University Press, 1996).'
