  md: '# Configuring COPS


    COPS is a great general purpose tool with many, many options.

    Edit the files is_able.lst and crc_list to reflect your system.

    COPS will check is_able.lst for the permissions of sensitive files.

    Depending on the layout of the system''s filesystem, the defaults

    may may not be appropriate.


    COPS can be set up at regular intervals via the cron mechanism and can deliver
    regular reports via email.


    > The COPS directory should be readable, writable, and executable only by the
    owner of the directory—you don''t want others to be able to run COPS, change the
    scripts, or otherwise find or hide vulnerabilities. You should check the permissions
    of this directory, and fix them with a chmod 700 command if necessary.


    Caution


    In some cases, COPS runs checks that other (newer) programs do better. While COPS
    can check passwords, I recommend you install and run Crack instead. While COPS
    can run CRC checks on system files, I recommend Tripwire instead.


    # Running COPS


    +   To run COPS, cd to the directory where you installed COPS and enter the command:

    ```

    ./cops -v -s -b cops_errs

    ```


    +   Evaluate the COPS report. The header of a COPS session looks something like
    this:


    ATTENTION:

    Security Report for Mon May 3 20:30:32 PDT 1999

    from host foo


    +   Evaluate the results. Review the docs/warnings file for an explanation of
    COPS warnings.


    +   Fix flagged problems.'
