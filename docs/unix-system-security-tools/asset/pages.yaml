- img_proc: true
  md: 'At the outermost perimeter is network security: maintaining the security of
    communications and ensuring that only permitted traffic reaches the system. A
    firewall is a canonical perimeter defense. The security of standard services like
    FTP and Telnet is bolstered by invoking them through “wrapper” programs like TCP
    Wrappers. Perimeter defenses can be tested by scanning programs like SATAN.


    This book covers each of these in turn (“Account Security Basics” on page 49,
    “Filesystem Security” on page 111, and “Network Security Basics” on page 251).


    # User Education


    Even the most elaborate security plan and enforcement will fail if a system’s
    or a network’s users are not savvy about basic security issues. In many ways,
    the entire field of computer security represents a technical solution to a people
    problem.


    # Promulgate Policy


    Make sure that every user in the organization is made accountable for the security
    policy. Policies can be publicized via traditional corporate communications techniques,
    ranging from email distributions to reminders in the company newsletter. Ideally,
    maintaining security should be part of employee performance reviews.


    Security briefings can be effective in communicating the importance of maintaining
    an organization’s security profile. Since security breaches may occur infrequently,
    a briefing can reiterate the consequences of losses and describe relevant laws
    and policies. Regular security briefings can also act as a deterrent, in so far
    as the “fear of getting caught is the beginning of wisdom.”


    # Beware of Social Engineering


    All computer users should be aware of the cracker technique known as “social engineering.”
    Social engineering is a cracking method that relies on deceit or trickery to overcome
    impediments posed by information security measures. A master of deception can
    neutralize even the most hardened system security with a few phone calls.'
