  md: '# Account Security Basics


    Breaking into a user account is often the easiest way for an attacker to gain
    access to a system. Throughout the brief history of computing, users have been
    notorious for picking easy-to-guess passwords. This chapter contains a short guide
    to choosing secure passwords. It covers the traditional, crypt()-based UNIX password
    mechanism and its intrinsic vulnerability. Many systems have inactive accounts,
    misconfigured system accounts, or other problematic accounts. This chapter discusses
    managing UNIX accounts, including protecting the root account and setting up restricted
    environments.'
  merge: -1
