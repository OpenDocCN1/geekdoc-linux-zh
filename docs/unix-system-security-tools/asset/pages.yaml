    # Shared Accounts


    Every user of a UNIX system should have his or her own account. If users are allowed
    to share accounts, then accountability—the ability to determine who did what when—and
    thus security is breached.


    Some systems provide accounts for guests or visitors that do not require passwords.
    This is a bad idea. With names like guest, they give an attacker an easy way into
    a system. Once innocuously logged in as guest, they can probe for greater security
    lapses.


    If a system must provide for a guest account, set a password that is changed daily.
    Even better, consider providing guests—and other untrusted users—with a restricted
    shell (see “Restricted Environments” on page 67).


    If a system must provide for a group account so that team members can work on
    a project together, you should, at the very least, stipulate that these users
    use the su (stitute user) command in order to access the effective ID of another
    user—su attempts are logged to the file /var/log/messages (or to the sul file
    in the /usr/adm directory, in older systems). A much better alternative is to
    create a new group in the file /etc/group and add each team member to the group.


