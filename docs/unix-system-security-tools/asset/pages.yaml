- img_proc: true
  md: '# Glossary


    This small corpus of UNIX, security, and Internet-related technical terms is intended
    for the general reader. More terms and definitions can be found at http://www.netdictionary.com'
  merge: -1
  pgno: 426
- img_proc: true
  md: '# A Acceptable Use Policy


    Abbreviated AUP. A formal set of rules that governs how a network may be used.
    For example, the original NSFnet Acceptable Use Policy forbade non-research use
    by commercial organizations. AUPs sometimes restrict the type of material that
    can be made publicly available; many AUPs ban the transmission of pornographic
    material. The enforcement of AUPs has historically been very uneven. This was
    true of the NSFnet AUP: its limitations on commercial activity were so widely
    ignored that it was finally abandoned in 1994, enabling the development of today''s
    commercial Internet. See also


    # access control


    Ensuring that users access only those resources and services that they are entitled
    to access.


    # active attack


    An attack which results in an unauthorized state change, such as the manipulation
    of files, or the adding of unauthorized files.


    # asymmetric cipher


    See public-key cipher.


    # attack


    An attempt to bypass security controls on a computer. The attack may alter, release,
    or deny access to data.


    # audit


    The independent examination of records and activities to ensure compliance with
    established controls, policy, and operational procedures, and to recommend any
    indicated changes in controls, policy, or procedures.


    # audit trail


    In computer security systems, a chronological record of system resource usage.
    This includes user login, file access, various other activities, and whether any
    actual or attempted security violations occurred.'
  merge: -1
  pgno: 427
- img_proc: true
  md: '# authentication


    Ensuring that users are the persons they claim to be; the verification of the
    identity of a person or process.


    # availability


    Ensuring that a system is operational and functional at a given moment, usually
    through redundancy. Loss of availability is often referred to as *denial of service*.


    # B


    # back door


    A hole in the security of a computer system deliberately left in place by designers
    or maintainers. Synonymous with *trap door*; a hidden software or hardware mechanism
    used to circumvent security controls.


    # baud


    +   1. An obsolete term for the speed of a modem. Specifically, baud refers to
    the number of times per second a communications channel changes the carrier signal
    it sends on the phone line. A 2400-baud modem changes the signal 2400 times a
    second. Baud is often confused with bits per second (bps) even though they are
    technically different measurements.

    2. Originally, a unit of telegraph signalling set. Set at one Morse code dot per
    second, it was named after J.M.E. Baudot (1845-1903), the French engineer who
    constructed the first successful teleprinter.


    # Blowfish


    A block cipher developed by Bruce Schneier in 1993 as a general replacement for
    DES.


    # bomb


    A malicious piece of code hidden in a program that remains dormant until it is
    triggered. A *logic bomb* is triggered by a user action or event; a *time bomb*
    is triggered either after a set amount of time has elapsed or once a specific
    date is reached.'
  merge: -1
  pgno: 428
- img_proc: true
  md: '# brute force


    A programming style that relies on the computer''s raw processing power rather
    than intelligent design and implementation decisions on the part of the programmer.
    An example of brute force is a password-cracking routine that feeds the target
    system all the words from a dictionary.


    # BSD


    Abbreviation for Berkeley Software Distribution. A family of UNIX versions developed
    by Bill Joy and others at University of California Berkeley starting in 1980.
    BSD versions 4.1, 4.2 and 4.3 featured paged virtual memory, TCP/IP networking
    enhancements, and other features that were widely implemented in commercial UNIX
    systems from Sun Microsystems and others. The current version is 4.4; it''s implemented
    in FreeBSD, OpenBSD, and NetBSD. BSD is sometimes compared to and contrasted with
    AT&T UNIX.


    # bug


    A problem with computer software or hardware that causes it to malfunction or
    crash.


    # C


    # Certificate Authority


    Abbreviated CA. An entity that attests to the identity of a person or organization
    for the purposes of network security.


    # checksum


    A mathematical calculation applied to the contents of a packet or file before
    and after it is transmitted. If the “before” calculation does not match the “after”
    calculation, there were errors in the transmission.


    # cipher


    See cryptography.


    # circuit switching


    The signal switching traditionally used by telephone companies to create a continuous
    physical connection between a caller and a called party. Contrast packet switching.'
  merge: -1
  pgno: 429
- img_proc: true
  md: '# confidentiality


    Ensuring that information is not accessed by unauthorized persons.


    # connect-time logging


    Performed by various programs that write records into `/var/log/wtmp` (or `/var/adm/wtmp`),
    and `/var/run/utmp` (or `/etc/utmp`). Programs such as login update the `wtmp`
    files so that sysadmins can keep track of who was logged into the system and when
    that user was logged in.


    # cookies


    Electronic identifiers that enable web servers to record and track user movements
    through a site. Cookies are small files designed to support shopping cart applications;
    when a user returns to a site, a cookie is used to recall the items that were
    placed in the cart during their last session. Cookies are also used to help advertisers
    deliver banner ads to repeat visitors and to store username and passwords so they
    don''t have to be re-entered each time a secure site is visited. Invented by Lou
    Montulli while at Netscape, cookies raise controversial privacy and security concerns.
    A proposed Internet standard (RFC 2109) would give users the power not only to
    disable all cookies but to detect when a site is tracking a user. It would also
    allow users to accept cookies based on individual preferences.


    # cracker


    A malicious hacker who breaks (or cracks) the security of computer systems in
    order to access, steal, or destroy sensitive information. “Hacker” is often incorrectly
    used instead of cracker, especially by the media. Contrast *hacker*.


    # crypt


    The original UNIX encryption program based on the WWII-era Enigma machine.'
  merge: -1
  pgno: 430
- img_proc: true
  md: "# cryptography\n\nThe art and science of keeping files and messages secure.\
    \ It works by mathematically transforming a *plaintext* (or *cleartext*) message\
    \ into a disguised *ciphertext*, a process known as *encryption*. *Decryption*\
    \ involves turning the ciphertext back into plaintext. The mathematical function\
    \ used for encryption and decryption is called a *cryptographic algorithm* or\
    \ *cipher.\n\n# cyberspace\n\n+   1. The place where computer networking hardware,\
    \ network software, and people using them converge. First coined by William Gibson\
    \ in his novel, *Neuromancer*. Defined by author Bruce Sterling as the place where\
    \ a telephone call appears to occur: “Not inside your actual phone, the plastic\
    \ device on your desk. Not inside the other person’s phone, in some other city.*The\
    \ place between* the indefinite place *out there,*where the two of you, two human\
    \ beings, actually meet and communicate.” John Perry Barlow first adopted the\
    \ term for the nexus of computer and telecommunications networks. Barlow maintains\
    \ that cyberspace should be regarded as a qualitatively new world, a frontier\
    \ governed by new sets of rules and behaviors.\n\n+   2. The prefix *cyber* is\
    \ often combined with other words, as in *cyberpunk*.\n\n# cybotage\n\nTo willfully\
    \ and maliciously destroy or impede the automatic control processes of computers.\
    \ To deliberately disrupt a network. \n\n# D\n\n# daemon\n\nIn UNIX, a background\
    \ process that lies dormant waiting to perform some useful task. The sendmail\
    \ daemon, for example, continually runs but becomes active only when email is\
    \ sent or received."
  merge: -1
  pgno: 431
- img_proc: true
  md: '# dark-side hacker


    A malicious or criminal hacker; a cracker; one who breaks into computer systems
    for evil purposes. From George Lucas’ Star movie—those seduced by the “Dark Side
    of the Force” are opposed by elite Jedi Knights.


    # Data Encryption Standard


    Abbreviated DES. Developed by NIST (National Institute of Standards and Technology)
    in the 1970s; it remains a worldwide standard. This symmetric cipher uses a 56-bit
    key. A modified form is used in the UNIX password encoding system. In general,
    the use of DES is deprecated due to the availability of “DES cracker” machines.
    DES should no longer be considered “secure.”


    # denial of service


    A form of attack that prevents authorized users from accessing an information
    resource by making spurious requests. This term should be hyphenated when used
    as an adjective, as in “denial-of-service attack.”


    # DES


    See Data Encryption Standard.


    # digital signature


    Extra data appended to a message which identifies and authenticates the sender
    and message data using public-key cryptography.


    # E


    # Electronic Frontier Foundation


    Abbreviated EFF. To quote its mission statement, “The Electronic Frontier Foundation
    is a non-profit civil liberties organization working in the public interest to
    protect privacy, free expression, and access to public resources and information
    online, as well as to promote responsibility in new media.”


    See http://www.eff.org'
  merge: -1
  pgno: 432
- img_proc: true
  md: '# Glossary


    # encryption


    A procedure that renders the contents of a message or file unintintelligible to
    anyone not authorized to read it. PGP (Pretty Good Privacy) is a commonly-used
    encryption program. See also cryptography.


    # error logging


    Performed by the syslogd(8) daemon. Various system daemons, user programs, and
    the kernel report noteworthy conditions via the syslog(3) function to the file,
    /var/log/syslog.


    # F


    FAQ Acronym for Frequently Asked Questions. A reference document created for particular
    topic or group that answers to common beginners'' questions. It is considered
    poor Netiquette to ask a question without first reading the FAQ.


    # finger


    A UNIX utility that reports information about other users who have UNIX accounts.
    Finger can tell you, for example, and when a person last logged in to the system.
    It can also be used on a single host or across the Internet.


    # firewall


    A component or set of components that restricts access between a protected network
    and the Internet or between other sets of networks. A firewall can be hardware
    in the form of a router or computer, software running on a gateway system, or
    other combination.


    # free


    Many UNIX security tools are “free” both in the sense of not costing money and
    in the sense that you’re free to deploy them without strict licensing or other
    restrictions. Be warned: None of them are free in terms of the time needed to
    find, understand, implement, and run them. To paraphrase Richard Stallman: Think
    “free speech” rather than “free beer.” See “The GNU General Public License” on
    page 397.'
  merge: -1
  pgno: 433
- img_proc: true
  md: '# G


    gateway


    A special purpose, dedicated computer that attaches to two or more networks and
    routes packets from one to the other.


    GID


    Group ID; a user''s primary group membership.


    # H


    hacker


    An expert programmer who likes to spend a lot of time figuring out the finer details
    of computer systems or networks, as opposed to those who learn only the minimum
    necessary. Contrast cracker.


    home directory


    The initial working directory when a user logs in.


    hypertext


    Text that includes links or shortcuts to other documents, allowing the reader
    to easily jump from one text to related texts, and consequently from one idea
    to another, in a non-linear fashion. Coined by Ted Nelson in 1965.


    # I


    IDEA


    See International Data Encryption Algorithm.


    identity hacking


    Posing as someone else. Posting anonymously or pseudonymously, usually with the
    intent to deceive.


    International Data Encryption Algorithm


    Abbreviated IDEA. First developed by Xuejia Lai and James Massey in 1990. IDEA
    is a block cipher that operates on 64-bit plaintext blocks; the key is 128 bits
    long. IDEA is implemented in Pretty Good Privacy (PGP), a widely-used crypto program.'
  merge: -1
  pgno: 434
- img_proc: true
  md: 'Ensuring that information is not altered by unauthorized persons in a way that
    is not detectable by authorized users.


    # Internet


    A worldwide network of networks that all use the TCP/IP communications protocol
    and share a common address space. First incarnated as the ARPANET in 1969, the
    Internet has metamorphosed from a military internetwork first to an academic research
    internet and then to the current commercial internet. It commonly supports services
    such as email, the World Wide Web, file transfer, and Internet Relay Chat. The
    Internet is experiencing tremendous growth in the number of users, hosts, and
    domain names. It is gradually subsuming other media, such as proprietary computer
    networks, newspapers, television, and the telephone.


    # internet


    Any collection of packet-switching networks interconnected by gateways and sharing
    protocols that allow them to function as a single, large, virtual network. The
    uppercase Internet is the most prominent example of an internet.


    # Internet Protocol


    Abbreviated IP. The part of the TCP/IP suite that defines packets as the basic
    unit of information on an internetwork. IP lies at the core of the Internet and
    many of its component networks. It defines the header of each packet, a structured
    collection of bytes that identifies the sender as well as the destination. The
    header is followed by the packet''s contents, a larger block of arbitrary data
    that is reassembled at the receiving end.'
  merge: -1
  pgno: 435
- img_proc: true
  md: '# Internet Worm


    In November 1988, Robert Tappan Morris released the infamous worm that corrupted
    thousands of net-connected machines overnight. Morris, the son of a security official,
    brought issues of UNIX security to the the forefront of the world''s attention.
    The worm exposed a Pandora’s Box of vulnerabilities in UNIX, including bugs in
    the venerable sendmail and finger programs.


    # IP


    See Internet Protocol.


    # IP address


    A string of four numbers separated by periods used to represent a computer on
    the Internet, such as 207.44.147.151 (hostname www.albion.com). The format of
    the address is specified by the Internet Protocol in RFC 791. When a PC accesses
    the Internet through an ISP, it may receive a temporary IP address.


    # K


    # kernel


    The essential core of UNIX and other operating systems responsible for resource
    allocation, low-level hardware interfaces, and security.


    # key


    A string of characters used to mathematically encode a message so that it can
    only be read by someone in possession of that key or another related key (depending
    on whether the encryption method used is symmetric or asymmetric). Most cryptystems
    rely on a key, which can be one of a large number of values (the keyspace). In
    general, the security of a cipher lies in the key.


    # kluge


    A quick fix to a problem that places expediency over elegance. Pronounced *klooge*.
    Variant spelling is *kludge*.'
  merge: -1
  pgno: 436
- img_proc: true
  md: '# M


    mailbombing

    The act of sending massive amounts of email to a single address with the malicious
    intent of disrupting the system of the recipient. Mailbombing is considered a
    serious breach of Netiquette and is probably illegal.


    # N


    Netiquette

    Network etiquette, or the set of informal rules of behavior that have evolved
    in cyberspace, including the Internet and online services. See http://www.albion/netiquette


    network security

    Concerned with protecting network and telecommunications equipment, protecting
    network servers and transmissions, combating eavesdropping, controlling access
    from untrusted networks, building firewalls, and detecting intrusions.


    nonrepudiation

    Ensuring that the originators of messages cannot deny that they in fact sent the
    messages.


    # O


    one-time passwords

    Passwords that work once and only once. In a one-time password (OTP) system, users
    are provided with a list of passwords. After using a password to log in, the user
    crosses it off the list, and subsequently uses the next one on the list for the
    next login.


    one-way hash function

    A hash function that is difficult to reverse—given a hash value, it should be
    hard to compute the message it was generated from. In addition, it should be hard
    to find two random messages that hash to the same value. A one-way hash function
    works on a message of arbitrary length and returns a fixed-length hash value (say,
    128 bits).'
  merge: -1
  pgno: 437
- img_proc: true
  md: '# operational/procedural security


    Concerned with everything from managerial policy decisions to reporting hierarchies.


    # P


    # packet


    A unit of data sent across a network. When a large block of data is to be sent
    over a network, it is broken up into a number of packets, and the reassembled
    at the other end. Packets often include checksum codes to detect transmission
    errors. The exact layout of an individual packet is determined by the protocol
    being used.


    # packet sniffing


    The intentional and usually illegal act of intercepting packets of data being
    transmitted over a network (or the Internet) and searching them for information
    (like passwords).


    # packet switching


    A data transmission technique whereby user information is segmented and routed
    in discrete data envelopes called packets, each with its own appended control
    information for routing, sequencing, and error checking. This technique allows
    a communications channel to be shared by many users, each using the circuit only
    for the time required to transmit a single packet. Packet switching networks revolutionized
    the data transmission industry and made possible massive information networks
    like the Internet and its World Wide Web. Contrast circuit switching.


    # passive attack


    An attack that does not result in an unauthorized state change, such as one that
    only monitors and/or records data.'
  merge: -1
  pgno: 438
- img_proc: true
  md: '# password


    A unique character string held by each user, a copy of which is also stored in
    the system in encoded form. During login, the authentication process requires
    that the password a user enters matches the stored value. Since passwords are
    shared secrets, they need to be chosen and handled with care. See also one-time
    passwords, password aging, and shadow passwords.


    # password aging


    A scheme for keeping track of long passwords have been in effect and forcing users
    to change their passwords with some frequency.


    # patch


    Interim code designed to fix a problem or problems with the released version of
    a software package. See also bug.


    # permissions


    In UNIX, the ownership and access controls assigned to files and directories.
    They determine who can do what to a file. There are settings that determine whether
    the owner (set by user ID), the group (a predetermined set of user), or the world
    (anyone) can read (r) a file, write (w) to a file, or execute (x) a file. For
    example, a setting of “-rw-r-r--” means the owner can read or write to the file,
    the group can only read the file, and the world can only read the file.


    # personnel security


    Concerned with hiring employees, background screening, training, security briefings,
    monitoring, and handling departures.


    # physical security


    Controlling the comings and goings of people and materials as well as protection
    against the elements and natural disasters.'
  merge: -1
  pgno: 439
- img_proc: true
  md: '# piracy


    The unauthorized use or distribution of a computer program, compact disk, or other
    intellectual property. This term is most often used to describe the theft of commercial
    software programs, which are routinely cracked by either hobbyists, who distribute
    it over the Internet as warez, or by organized crime triads that resell the software
    on the black market.


    # Pretty Good Privacy


    Abbreviated PGP. A program, developed by Phil Zimmerman, that uses cryptography
    to protect files and electronic mail from being read by others. PGP also includes
    a feature which allows users to digitally “sign” a document or message, in order
    to provide non-forgeable proof of authorship.


    # privacy


    Ensuring that individuals maintain the right to control what information is collected
    about them and how it is used well as to know who used it, who maintains it, and
    what purpose it is used for.


    # process accounting


    Process accounting’s main purpose is to provide command usage statistics for billing.
    Upon termination of a process, one record per process is written to a file, often
    /var/adm/pacct.


    # protocol


    A series of rules and conventions that allow different kinds of computers and
    applications to communicate over a network.


    # public-key ciphers


    An encryption method that uses different keys for encryption and decryption. In
    other words, a stranger can use your public key to encrypt a message that only
    you, holder of your private key, can decrypt.'
  merge: -1
  pgno: 440
- img_proc: true
  md: '# R


    Realtime Blackhole List

    Abbreviated RBL. A list of networks that are known to be friendly or neutral to
    spammers who use these networks to send unsolicited commercial email. See http://maps.vix.com/

    rb1


    # README file


    +   1. A text file included with an application that contains important (and often
    last minute) information about installing and using the application.

    2. A text file on an FTP site that provides valuable information about the context
    of site.

    3. Any text file that you are supposed to read before proceeding.


    # relay spam


    The unethical and possibly illegal use of third party mail relays to send spam.
    By default, many email servers will relay or forward mail from any source to any
    destination. Spammers use this trust to save computational horsepower and bandwidth
    at the expense of innocent relay operators, who often deal with the fall-out.


    # replay attack


    A type of attack that defeats an authentication system by recording and replaying
    previously sent messages. The attacker records a username/password combination,
    for example, and then later uses the data to forge messages that appear to be
    authentic.


    # RFC


    Abbreviation for Request for Comment. One of a long-established series of informal
    informational documents and standards that guide the development of the Internet.
    The most famous is RFC 822, the Internet mail standard drafted by David Crocker.'
  merge: -1
  pgno: 441
- img_proc: true
  md: '# S


    # 423


    # root


    The administrative user account on a UNIX system that can bypass security controls.
    Sysadmins will log in as root when they need to perform tasks such as modifying
    system files, creating new user accounts, or setting up new services. The root
    account is also known as the superuser account. Root passwords are closely guarded
    and changed frequently by security-conscious sysadmins. See also sysadmin.


    # route


    The path that network traffic takes from its source to its destination. In a TCP/IP
    internet, each IP datagram is routed separately. The route a datagram follows
    may include many gateways and many physical networks.


    # router


    A computer that directs traffic and moves packets between networks. Any machine
    responsible for making decisions about which of several paths network traffic
    will flow. When used with TCP/IP, this term refers specifically to an IP gateway
    that routes datagrams using IP destination addresses.


    # RSA Algorithm


    RSA is an abbreviation of Rivest-Shamir-Aldeman. This widely-implemented public-key
    cryptographic algorithm hinges on the assumption that the factoring of the product
    of two large primes is difficult.


    # S


    # security


    Ensuring that private information remains private and uncompromised in an atmosphere
    where all other information is free. Security techniques such as encryption, passwords,
    and firewalls are designed to prevent unauthorized access to information, to protect
    the integrity of computing resources, and to limit the potential damage that can
    be caused by attackers and intruders. The notion of a "secure computer" is relative
    though: the only secure computer is one powered down in a locked facility that
    no one has access to.'
  merge: -1
  pgno: 442
- img_proc: true
  md: '# seven-layer reference model


    The standard model for communications protocols that is formally approved by ISO
    and CCITT. The ISO model identifies seven separate layers: the Physical Layer,
    the Data Link Layer, the Transport Layer, the Session Layer, the Presentation
    Layer, and the Application Layer. The layers are organized conceptually so that
    the "lowest" layer represents the physical link between two systems and the "highest"
    layer represents user applications. In order for two systems to communicate, both
    should support an implementation of each layer. Each layer is referred to as a
    protocol stack.


    # shadow passwords


    A system that stores passwords in a protected "shadow" file instead of `/etc/passwd`.


    # shell


    A command interpreter that''s executed and presented when a user logs in. There
    are several popular shells, including the Bourne shell (/bin/sh), the C shell
    (/bin/csh), the Korn shell (/bin/ksh), and the Bash shell (/bin/bash).


    # smurfing


    A denial-of-service attack that floods the target system with ping packets, causing
    network congestion and outages.


    # socket


    An abstraction that allows an application to access the TCP/IP protocols. An application
    opens a socket, specifies the service desired, binds the socket to a specific
    destination, and then sends or receives data. Sockets were originally implemented
    in Berkeley UNIX (BSD).


    # social engineering


    A cracking method that relies on deceit or trickery to overcome impediments posed
    by information security measures.'
  merge: -1
  pgno: 443
- img_proc: true
  md: '# spam


    To send a message (usually an advertisement) to many discussion groups (bulletin
    boards, mailing lists, and/or newsgroups) or to thousands or even millions of
    random email addresses, without regard for topical relevance, ethics, or legality.
    The act of spamming was pioneered in 1994 by Canter & Siegel, the immigration
    lawyers who sent an advertisement for their services to every USENET newsgroup
    and received a whole lot of flamer in ruin. Since then, the net has been flooded
    with fraudulent spam offers including get-rich-quick scams, bogus work-at-home
    businesses, illegal multi-level marketing and Ponzi schemes, solicitations for
    porn sites, and sales pitches that are too good to be true. Spammers have gotten
    more and more sophisticated in their methods of attack. The technology behind
    spamming has been advanced by the development of bulk email programs that can
    steal millions of email addresses from the web and commercial online services
    and mailbomb A typical spam message is a study in the art of fraud; spammers frequently
    forge the reply-to header field of their outgoing mail (from "anyuser@anywhere.com")
    so that enraged recipients have no way to directly respond. They also exploit
    open mail relays in order to hide the message path. Spam companies appear overnight,
    blast the net with millions or billions of messages, and then disappear. Spam
    is widely frowned-upon in cyberspace: no legitimate business spams the net or
    conducts business with spam companies. Aside from the mail filters that are supported
    by many mail programs, the best response to spam is to delete it. Responding to
    spam or responding to offers to be "taken off the list" only serve to confirm
    to the spammer that an address is valid, resulting in more spam. See Realtime
    Blackhole List.


    # spoofing


    A deliberate attempt to induce a user or resource to do the wrong thing by pretending
    to be someone or something else.


    # superuser account


    See root.'
  merge: -1
  pgno: 444
- img_proc: true
  md: '# SUID/SGID


    In UNIX, the set user-id (SUID) and set group-id (SGID) bits are part of the permissions
    associated with an executable file. If set, these allow a user to assume the effective
    identity of the file''s owner (SUID) and/or group (SGID) with respect to the process
    while it is running. A potential security risk, these permissions should be carefully
    monitored by sysadmins and are detected by a number of security tools.


    # symmetric ciphers


    Symmetric ciphers use the same key for encryption and decryption (as opposed to
    public-key or asymmetric ciphers). Symmetric ciphers fall into two broad classes:
    stream ciphers, which work on plaintext one bit at a time, and block ciphers,
    which work on groups of bits (blocks).


    # sysadmin


    The system administrator of a UNIX machine, or someone who maintains UNIX systems.
    See also *root*.


    # system security


    Concerned with user access and authentication controls, assignment of privilege,
    maintaining file and filesystem integrity, backups, monitoring processes, log-keeping,
    and auditing.


    # T


    # TCP


    See *Transmission Control Program*.


    # TCP/IP


    Abbrev. for Transmission Control Protocol/Internet Protocol. A collection of protocols
    that define the basic workings and features of the Internet.


    # Telnet


    A protocol which allows a user to log onto a remote UNIX computer as if directly
    connected to it. Telnet usually requires a user ID and password combination that
    is recognized by the remote system.'
  merge: -1
  pgno: 445
- img_proc: true
  md: '# terminal hijacking


    An attack that takes over control of a terminal session. The attacker can send
    and receive terminal I/O while a user is on the terminal.


    # threat


    Any action that has the potential to breach information security.


    # tiger team


    A group of professional hackers that attempts to break into computer systems in
    order to test security measures. This term derives from US military jargon.


    # Transmission Control Program


    Abbreviated TCP. The TCP/IP standard transport level protocol that provides the
    reliable, duplex, stream service on which many network tools and services depend.
    It is connection-oriented in the sense that before transmitting data, participants
    must establish a connection.


    # Trojan horse


    An insidious and usually illegal computer program that masquerades as a program
    that is useful, fun, or otherwise desirable for users to download. Once the program
    is run, it performs a destructive act. This usage is derived from the wooden horse
    in which, according to legend, the Greeks hid and gained access to Troy.


    # U


    # UDP


    See User Datagram Protocol.


    # uebercracker


    A highly-skilled and determined cracker that has gone beyond simple cookbook methods
    of breaking into systems. Motivated by personal gain, the uebercracker picks specific
    targets for specific reasons (as opposed to hackers, who are often motivated by
    intellectual curiosity).'
  merge: -1
  pgno: 446
- img_proc: true
  md: '# UID


    User ID; a user''s unique identification number.


    # umask


    A mask (i.e., a numeric string that blocks bits in a pattern) that determines
    the default permissions to be assigned to files and directories created by the
    associated user.


    # UNIX


    A set of enabling technologies first developed at AT&T that have been incorporated
    into several legally distinct operating systems, each of which can be considered
    to be a “UNIX system.” If it looks like UNIX, operates like UNIX, runs common
    UNIX utilities and programs, and is developed with UNIX as a model, it''s UNIX.


    # USENET


    The most available distribution of newsgroups is USENET, which contains over ten
    thousand unique newsgroups covering practically every topic and human proclivity.
    It is not part of the Internet, but can be reached through most Internet service
    providers. USENET was originally implemented in 1979-80 by Steve Bellovin, Jim
    Ellis, Tom Truscott, and Steve Daniel at Duke University. The names of newsgroups
    are comprised of a string of words separated by periods, such as “rec.humor.funny”
    or “misc.jobs.offered”. The first word (i.e., “rec” or “misc”) represents the
    top level of newsgroups. The second word (in these examples “humor” and “jobs”)
    represents a subcategory of the first level, and the third word a subcategory
    of the second.


    # User Datagram Protocol


    Abbreviated UDP. The TCP/IP standard protocol that allows an application program
    on one machine to communicate with an application program on another machine.
    UDP includes a protocol port number that allows the sender to distinguish among
    multiple applications on the receiving machine.'
  merge: -1
  pgno: 447
- img_proc: true
  md: '# UUCP


    Abbrev. for Unix-to-Unix Copy. UNIX software allows email and news messages to
    be exchanged on a store-and-forward basis between remote computers. Before the
    rise of the Internet, this was the main way that remote UNIX machines were networked.
    It is no longer in wide use.


    # V


    virus


    An insidious piece of computer code written to damage systems. Viruses can be
    hidden in executable program files posted online.


    vulnerability


    Any mechanism that could lead to a breach of the security of a system in the presence
    of a threat.


    # W


    wetware


    Hacker slang for the human central nervous system, especially the brain. Most
    computing systems have three essential components: software, hardware, and wetware.


    worm


    An insidious and usually illegal computer program that is designed to replicate
    itself over a network for the purpose of causing harm and/or destruction. While
    a virus is designed to attack a single program or system, a worm is designed to
    attack a network. The most infamous worm was created by Robert Tappan Morris in
    November 1988; it infiltrated over 6,000 network systems around the globe.


    # Z


    zombie


    A UNIX process that has died but remains listed as a running process.'
  merge: -1
