  md: '# Figure 2.2 A UNIX Defense Model


    ![](img/1a7ecd5e8d14f7d50a9df943b7efac99_60_0.png)


    The innermost wall is filesystem security: the ability to protect your information
    even in the event that an account or accounts have been breached. The UNIX permissions
    mechanism is critical here. If an attacker compromises an account, key files can
    still be protected by permissions, the limited access assigned to that account.
    Another important aspect of file security is encryption. If important files are
    encrypted, an attacker can breach an account and even defeat the permissions system
    without being able to use or exploit the encrypted data.'
