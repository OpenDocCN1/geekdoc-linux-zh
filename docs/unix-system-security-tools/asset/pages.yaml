  md: 'In 1992, a group of vendors including IBM, Digital, and Sun-took a revision
    to the NFS protocol resulting in NFS Version 3. While it offers substantial performance
    improvements via local file caching, it fails to address the protocol''s fundamental
    security weaknesses.


    # Tip


    A handful of general rules will help improve NFS security:


    +   - Dedicate a system to NFS service and don''t allow users to log into it.

    - Implement authentication services with Kerberos, rather than relying on UNIX-style
    authentication.

    - Limit the number and scope of exports as much as possible. Carefully configure
    `/letexports` so that only known and authorized local clients can access it. If
    clients only need access to part of a filesystem, export that part.

    - Limit the number and scope of client mounts. Not every client needs access to
    every NFS server.

    - When feasible, filesystems should be exported read-only.


    +   - Filesystems should never be exported to any hosts outside the LAN. If possible,
    all external access to NFS service should be blocked by a firewall.


    Finally, consider whether your installation really needs to be configured with
    NFS in the first place. NFS was created in an era when hard disks were expensive.
    By deploying diskless workstations and sharing a common file space, organizations
    could save money. Disk space is cheap now. NFS has also been deployed to allow
    users to access their home directories no matter which machine they log into.
    While this “open lab” configuration is conceptually attractive, we live in the
    PC now—most users have their own boxes that they use more or less exclusively.
    NFS can be an operational nightmare as well—when the server is down, work can
    grind to a halt. Your organization or site may be able to save time, money, and
    security by tossing NFS and installing lots of disks, a high-speed LAN, a software
    distribution program like rdist, and intranet web servers.'
