    # Process Accounting


    UNIX can track each and every command run by and every user. While this facility—known
    as process accounting—was intended to facilitate charging users for CPU time,
    it can be very useful for tracking down system problems. If you need to know who
    messed up those vital project files last night, the process accounting subsystem
    can all tell you. It can also help track the activities of an intruder (or a malicious
    user), subject to two big caveats:


    +   - A sophisticated attacker will attempt to delete or subvert the accounting
    file


    +   - Process accounting tells what commands a user executed, but not the full
    command argument


    The name and location of the process accounting file varies in different versions
    of UNIX. It may be named pacct or acct. It may live in /var/log (on Linux systems),
    /var/account, /var/adm, /usr/adm.


    # Turning Accounting On


    Unlike connect-time logging, process accounting is not active by default—it must
    be started up. To turn on process accounting on a Linux or BSD-based box, run
    the accton command. You must do this as root. The accton command must be in the
    file: accton file. The file must already exist. First use the touch command to
    create the pacct file:


    ```

    # touch /var/log/pacct


    Then run accton:


    # accton /var/log/pacct

    ```


    Once accton is active, you can monitor the commands being executed on your system
    at any time with the lastcomm command.'
