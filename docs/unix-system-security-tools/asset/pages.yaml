  md: '# Monitoring with Netstat


    A live Internet connection requires constant monitoring. You need to be able to
    find out which machines your host is connected to and what they are doing. The
    netstat command is designed for this purpose. It lists all TCP/IP connections
    along with the host and port number of each of the connection.


    Monitoring with netstat on a regular basis—looking for unusual or unauthorized
    connections—is a good sysadmin practice. The netstat command is quite flexible.
    It will list all UNIX domain sockets that are active as well as IP sockets. You
    can restrict your output to IP sockets using the “f -inet” option, as shown in
    the abbreviated example. Note that the following examples are taken from a machine
    running HP-UX and should work on BSD-derived systems—the syntax is slightly different
    on Linux and Solaris systems.


    ```

    $ netstat -f inet

    Active Internet connections

    Proto Recv-Q Send-Q Local Address Foreign Address (state) TIME_WAIT

    tcp 0 0 foo.example.com.smtp gate.ey.com.60072

    tcp 0 0 foo.example.com.1023 foo2.example.com.login ESTABLISHED

    tcp 0 140 www.albion.com.http 202.128.187.56:1206 FIN_WAIT_1

    tcp 0 0 foo.example.com.telnet host.blar.com:2913 ESTABLISHED

    ```


    The first line of this output indicates that port 60072 on “foreign” named gate.ey.com
    is connecting to the local SMTP port on foo1.example.com (presumably to send mail).
    The second shows a login across the LAN, from a user on host foo2 to foo2. The
    third shows an incoming web/http connection from the machine with the IP address
    202.128.187.56. The last line shows an incoming telnet session from host.blar.


    You can broaden the scope of netstat reporting to include all sockets, including
    those that are just listening, using the “-a” flag. In the sample below, you’ll
    see what appears in the previous example as well as various ports in the “listening”
    state.


    ```

    $ netstat -a -f inet

    Active Internet connections (including servers)

    Proto Recv-Q Send-Q Local Address Foreign Address (state)

    ...

    tcp 0 0 *.printer *.* LISTEN

    tcp 0 0 *.portmap *.* LISTEN

    tcp 0 0 *.pop3 *.* LISTEN

    tcp 0 0 *.pop *.* LISTEN

    ```'
