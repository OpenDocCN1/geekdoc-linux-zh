  md: '# COPS


    This chapter illustrates how a model system-checking or vulnerability testing
    program works. COPS (Computer Oracle and Password System) is designed to find
    and reports on common security problems, from world-writable directories to weak
    passwords. First, it needs to be installed and configured for a specific system.
    Once it’s up and running, you’ll need to fix the problems it finds, and then run
    it on a regular basis to monitor system security.'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# Introduction


    The COPS (Computer Oracle and Password System) package checks a Unix system for
    common procedural errors. COPS was presented at the summer 1990 USENIX Conference
    by authors Dan Farmer and Eugene H. Spafford, in the wake of the Internet worm.¹
    While the program was a milestone at the time of its release—showing how vulnerability
    testing could be rationalized—this combination of C code and shell scripts has
    not been updated in some time. Nonetheless, it remains a valuable tool for double-checking
    the security status of UNIX systems.


    # The Scope of COPS


    COPS sets out a wide net. It looks for administrative errors, account problems,
    and unauthorized permissions or privileges. Specifically, it checks:


    +   - for dangerous permissions on important system files and directories

    - for world-readable/writable file systems

    - all files for SUID status

    - the /etc/passwd file for null passwords

    - the /etc/group file

    - user passwords for guessability

    - the commands in /etc/rc* to make sure none of the files or paths are world-writable

    - the *crontab* file to make sure none of the files or paths are world-writable

    - user home directories to make sure none are world-writable

    - certain user files to make sure none are world-writable


    +   1. The COPS distribution includes Farmer''s and Spafford''s paper, “COPS and
    Robbers, UN*X System Security.” See /docs/COPS.report.ms'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# Introduction


    +   • the FTP setup


    +   • for illegitimate filesystem changes


    COPS can run at regular intervals by the cron mechanism with reports mailed to
    the system administrator. This can provide ongoing feedback on common problem
    areas. This can be particularly helpful for raising the security awareness of
    beginning system administrators.


    # COPS Downsides


    Farmer and Spafford point out some disadvantages of COPS in their paper, some
    of which are generic to all system-checking tools. Running COPS and getting a
    relatively clean report can create a false sense of security on the part of the
    system administrator. This is especially dangerous given that this tool is several
    years old and therefore will not catch recently-discovered security holes. Sysadmins
    should run COPS pro forma, fully aware that they are getting only a partial snapshot
    of system security.


    Another drawback of COPS is that it reports problems but doesn''t present solutions.
    The issues it flags are complex enough to require the intervention of a skilled
    and experienced system administrator. This is a kind of Catch-22. If an experienced
    sysadmin is on board, the need for COPS is diminished. If you need to run COPS,
    then you may need to rely on an experienced sysadmin to fix the problems it finds.
    Still, anyone who works with COPS can learn a trick or two.


    Finally, like many security tools, COPS can be run by a system cracker to find
    vulnerabilities in the target system. Thus, it has become the system administrator''s
    responsibility to run COPS at least once to make sure any gaping security holes
    are closed.


    > Some might argue that an old security tool that hasn''t been kept up-to-date
    is worse than none at all. I believe COPS still has value, as a model and as a
    checker for older UNIX installations. But you should never lose sight of its limitations,
    especially for systems connected to the Internet.


    Caution'
  merge: -1
