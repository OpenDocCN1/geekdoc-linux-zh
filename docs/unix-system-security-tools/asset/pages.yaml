  md: '# Protecting Against Transmission Risks


    While a complete description of TLS/SLL is beyond the scope of this work, I’ll
    present a brief sketch of how TLS should work.

    TLS is designed to set-up a secure “session”—an association between a client and
    a server

    TLS is designed to set-up a secure “session”—an association between a client and
    a server to avoid the expensive negotiation of new security parameters for each
    addition connection.


    The proposed protocol is divided into two separate layers: the TLS Handshake Protocol,
    which sits “on top,” and the TLS Record Protocol.


    The TLS Handshake Protocol establishes the cryptographic parameters of a secure
    session. As a TLS-enabled client and a server establish communication, they agree
    on a protocol version, select cryptographic algorithms, optionally authenticate
    each other, and use public-key encryption techniques to generate shared secrets.


    According to the preliminary specification, the TLS Handshake Protocol involves
    the following steps:


    +   - Exchange “hello” messages to agree on algorithms, exchange random values,
    and check for session resumption.

    - Exchange the necessary cryptographic parameters to allow the client and server
    to agree on a “pre-master secret.”

    - Exchange certificates and cryptographic information to allow the client and
    server to authenticate themselves.

    - Generate a master secret from the pre-master secret and exchanged random values.

    - Provide security parameters to the record layer.


    +   - Allow the client and server to verify that their peer has calculated the
    same security parameters and that the handshake occurred without tampering by
    an attacker.


    Once the client and server have “shaken hands” and agreed on session parameters,
    the TLS Record Protocol does the actual work of reading and writing data across
    the link. It takes a message to be


