  md: '# Protocol Ports


    Both TCP and UDP utilize an abstraction known as "ports." Ports solve a vexing
    problem. The ultimate destination for a message is a process running on a host.
    UNIX hosts, however, run many processes at once and dynamically create and destroy
    them on the fly. How can a sender find the right process to send a message to?


    Protocol ports serve as abstract destination points for messages. Each port is
    identified by a positive integer. Each message carries both a destination port
    number for the receiving end and a source port number that replies go to.


    Port numbers are a vital part of the Internet standards landscape—communication
    would be hindered in the absence of agreed-upon conventions for mapping port numbers
    to services. The Internet Assigned Numbers Authority (IANA) divides ports into
    three ranges: the Well Known Ports, the Registered Ports, and the Dynamic and/or
    Private Ports.


    +   * Well Known Ports—those from 0 through 1023. On most systems, these are reserved
    for root processes or programs executed by privileged users.


    +   * Registered Ports—those from 1024 through 49151


    +   * Dynamic and/or Private Ports—those from 49152 through 65535


    For overviews of the port numbering scheme, see the tables "Common TCP Ports and
    Services" on page 262 and "Common UDP Ports and Services" on page 264.


    For a complete list of the Well Known Ports, see Appendix C on page 363.


    For a complete and current list of IANA port assignments, see ftp://ftp.isi.edu/in-notes/assignments/port-numbers


    TCP

    TCP provides for reliable, end-to-end connection between processes running on
    either networked computers or the same computer. TCP connections act as "virtual
    circuits" that are somewhat'
