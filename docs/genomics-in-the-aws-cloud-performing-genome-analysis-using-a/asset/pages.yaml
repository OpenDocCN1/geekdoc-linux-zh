    also delivers an annotated variant file (VCF)—another special text file that describes
    the genome under analysis differs from standard reference genomes. Furthermore,
    there is analysis of copy number variation (CNV), which is when there are multiple
    repeats of a sequence that occurs only once in reference genomes—a condition that
    is associated with certain pathologies. There will also be information about large
    regions of inversion and deletion (also known as structural variations) and general
    statistics.


