  md: "# Chapter 8 Processing the Sequencing Data 157\n\nand position (POS), its identifier\
    \ in the dbsnp database if available (ID), the value\nof nucleotide(s) in the\
    \ reference genome (REF) and in the observed BAM\nfile (ALT), and its genotype\
    \ \"0/1\" if heterozygous and \"1/1\" if homozygous.\nYou can inspect the output\
    \ with the less command (and you end the command\npressing Ctrl+C). After the\
    \ header rows that start with a # symbol, you will\nsee the variants, with one\
    \ row per variant.\n\n```\nless -S my_variant.vcf\n```\n\nHere is what our CFTR\
    \ variant would look like in the VCF file:\n\n```\n# POS ID REF ALT QUAL FILTER\
    \ INFO FORMAT MY_SAMPLE\nchr7 117559541 rs11399360 TCTT T 1000 PASS GT 0/1\n```\n\
    \n# Making Adjustments and Refinements to the Variants in the\nVCF File\n\nNow\
    \ all of the SNVs and indel variants have been called, further GATK\nsoftware\
    \ analyses can help determine if variants are false-sequencing\nerrors or true-positive\
    \ variants. This is the Variant Quality Recalibration\n(VQSR) process. The seventh\
    \ column of variant rows in the VCF file is the\nFILTER field, and it contains\
    \ the \"PASS\" value for variant calls that are considered to be true positives.\
    \ In the VQSR process, the variants are ranked in order\nof confidence that they\
