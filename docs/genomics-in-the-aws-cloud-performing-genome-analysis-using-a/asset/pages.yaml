  md: '# Chapter 6 Building Your Environment in the AWS Cloud


    At this point, you will have to install a supported authentication app on your
    phone (well, on a phone anyway). Supported apps are Authy, Duo Mobile, LastPass
    Authenticator, Microsoft Authenticator, and Google Authenticator, and like Authy
    and Google Authenticator, we will use Google Authenticator for our purposes.


    Once you have done that, click Show QR Code in the Set Up MFA Device pop-up. You
    can then scan code with your authentication app, enter the first couple of codes
    it generates into the pop-up, and rest comfortably in the knowledge that your
    AWS root account is protected behind two methods of authentication. 6.27 shows
    how IAM presents the QR code on the screen.


    ![](img/f11d8c1d6b76e74ec2235e2ddebf829b_127_0.png)


    Figure 6.27: Getting a QR code for scanning


    Again, this is not a security risk, but the means by this kind of authentication
    works is too cool to pass over without at least a little exploration. Consider
    that you can use six-digit keys generated by you, even when the phone is disconnected
    from the Internet—even when it is in flight mode or in a Faraday cage. How can
    that be?


    Authentication tools implement algorithms HOTP and/or TOTP (Google Authenticator
    implements both). These algorithms apply a cryptographic method (SHA-1) to a secret
    key known only to both sides (the authentication app and AWS IAM). It is this
    secret key that is communicated to your authentication app when you scan the QR
    code in IAM. The HOTP/TOTP algorithm, using the secret key, generates the same
    series of six-digit keys when'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# Chapter 6 Building Your Environment in the AWS Cloud 101


    it is run on AWS and when it is run on the app. The fourth code generated by the
    app is the fourth code generated by the implementation of HOTP / TOTP on AWS;
    the same is true for the fifteenth and three-hundredth on each side. If AWS knows
    that a given authentication attempt for that certain user is the 564th, it knows
    what code the algorithm generates the only remaining problem is keeping the counts
    in sync TOTP—which stands for “time-based one-time password”—solves this problem
    by asynchronous (or nearly so) clocks on both the phone and the app in AWS IAM
    environment. Network Time Protocol (NTP) makes this easier to achieve than it
    is used for. The other algorithm, HOTP (its way aware Message Authentication Code)
    HMAC-based one-time password, where HMAC does not assume a common clock and requires
    synchronization of the “which run is this” number. It also allows leeway in the
    run count, up or down.


    # Establishing an AWS IAM Policy


    The next step in tightening the security situation on your AWS environment is
    to establish a policy enforcement to ensure that users’ passwords are obscure
    enough to resist guessing and brute-force attacks and are changed according to
    a schedule. Figure 6.28 shows IAM reminding you to set up a policy,


    ![](img/f11d8c1d6b76e74ec2235e2ddebf829b_128_0.png)


    Figure 6.28: IAM you want to set up a password policy for enhanced security.'
