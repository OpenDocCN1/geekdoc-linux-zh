    output.root -stat 1000

    ```


    ```

    # Partition

    CNVator_install/cnvator/cnvator -root "${output_prefix}".cnvator_

    output.root -partition 1000

    ```


    ```

    # Call CNVs

    CNVator_install/cnvator/cnvator -root "${output_prefix}".cnvator_

    output.root -call 1000 $output

    ```


    ```

    # https://github.com/abyzoylab/CNVator/blob/master/README.md

    # The output columns are as follows:

    # CNV_type size normalized_RD e-val2 e-val3 e-val4 q0

    # where:

    # normalized_RD -- read depth normalized to 1.

    # e-val -- calculated using t-test statistics.

    # e-val2 -- is the probability of RD values within the region to be in the tails
    of a gauss distribution describing frequencies of RD values in bins.

    # e-val3 -- same as e-val but for the middle of CNV

    # e-val4 -- same as e-val2 for the middle of CNV

    # q0 -- fraction of reads mapped with q0 quality

    ```


    The CNVator output contains obvious CNVs where there is a large change in depth,
    as well as there is little change in depth. In the latter case, we filter them
    out.


    ```

    infile=my_cnvator_results.txt

    outfile=my_filtered_cnvator_results.txt

    ```


    ```

    echo -e "\tstart\t\tcnv_type\tcnv_size\tnormalized_read_depth\tteval_ttest_eval2_gauss_prob\tteval3_ttest_midCNV\tteval4_gauss_prob\nmidCNVfraction_reads_mapped_with_q0_quality"
    | cat header

    cat awk $infile | awk ''BEGIN {FS="\t"; OFS="\t"} {if ($5<0.05) && ($6<0.05) &&
    ($7<0.05) && ($8<0.05)) {print $1,$2,$3,$4,$5,$6,$7,$8,$9}} | sed ''s/\s/\t/g''
    | awk ''BEGIN {FS="\t"; OFS="\t"} {print $1,$2,$3}'' | cat header.

    txt | cut -d''\t'' -f11 > $output

    ```


    The CNVator output is a tab-delimited file. To annotate it with VEP, convert it
    to a VCF.


    ```

    infile=my_filtered_cnvator_results.txt

    outfile=my_cnvator_results.vcf

    :>$output

    ```'
