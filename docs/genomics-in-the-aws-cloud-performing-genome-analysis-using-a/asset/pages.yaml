    This gives read and write access to you, and you only.


    # Testing Your Installation


    An easy way to verify that your AWS CLI installation has worked is to run a simple
    command that creates nor destroys anything. By going to your workstation''s command
    line and entering the following, you will get a listing of all the S3 buckets
    in the instance you''ve logged into:


    ```

    aws s3 ls

    ```


    If does not work, go back and investigate your CLI setup. The problem most likely
    has to do with permissions.


    # AWS CLI Essentials


    When using the AWS CLI, the general idea is that you go to your workstation''s
    command line (which is to, the shell in macOS or Linux, or the Windows command
    line or Power Shell) and invoke the aws command, followed by subcommands and arguments
    that specify what you want to do.


    One of the goals the architects of the AWS CLI seem to have in mind is consistency
    across client platforms. In other words, an AWS command sequence that works when
    connected via a Windows computer should also work when you are using a Linux machine
    to connect to the AWS cloud. This allows for portability of your skills across
    client platforms and makes it possible to share scripts that use the AWS command
    set among users of different kinds of machines.


    There are minor differences among the AWS CLI implementations for different operating
    systems. For example, in Windows, it is necessary to enclose certain values in
    double quotes ("*"), while the Linux implementation expects single quotes (''*'').'
