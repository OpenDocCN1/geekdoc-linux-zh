    # Creating Users


    Creating users is not hard. All you need to do is choose Users from the Access
    Management menu under AWS IAM. Click the Add User button, and give your new user
    name. You can choose to create multiple users at once, which is what we do (Figure
    6.34).


    Click the Next: Permissions to move on to the next step, where you can add your
    new users to a group (Figure 6.35). We added our new users to the GenomicsResearchers
    group we created previously.


    Subsequent steps allow you to add tags to your users (not necessary in our case)
    and review what you''re about to do before you create the new users.


    Once IAM has created the users you specified, it will show you a Success page
    that shows important characteristics of the users (Figure 6.36). It will display
    the access key ID, secret access key, and initial password. The username and password
    are obviously important for logging into the console, but you need the access
    key ID and secret access key to do anything programmatically. The Success display
    in the user creation process is the only time it is possible to display those
    values, so copy them somewhere or download and save them in CSV form.'
