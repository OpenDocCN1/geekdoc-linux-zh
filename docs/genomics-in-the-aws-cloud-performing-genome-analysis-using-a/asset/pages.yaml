  md: '# Chapter 4 ■ The Bioinformatics Workflow


    The standard tool for looking at a FASTQ file and reporting on its quality is
    called FASTQC, an open-source package freely available from the Babrah Bioinformatics
    site.


    ```

    www.bioinformatics.babraham.ac.uk/projects/fastqc

    ```


    The output of FASTQ is an HTML file that can be viewed in your web browser. What
    can you do if your genome data is found to have quality problems? One common and
    useful strategy is to excise low-quality regions from the sequences. This process
    is called trimming.


    # Trimming


    Trimming a genome sequence is the process of cutting out areas that have been
    determined to be of low for whatever reason. Trimming has to be done in moderation,
    because cutting out too much will lead to problems later when there is insufficient
    data to yield meaningful analysis, cutting out too much will little likewise to
    trigger later because the data is of low quality.


    Trimming should be done to eliminate adapters, which are occasionally present
    in the FASTQ file. Adapters are strings of synthetic nucleotides of known sequences.
    They contain information useful for the sequencing process: barcoding sequences,
    binding sites for the sequencing primers, and binding sequences that immobilize
    fragments in the flowcell of the sequencing machine. After DNA fragmentation,
    adapters are linked to each DNA fragment. Adapters are not usually present in
    the FASTQ file, as the sequencing starts after the 3'' primer. But if some DNA
    fragments are sequence too short, the sequencing can continue the 3'' into the
    3'' adapter. The sequence of the 3'' adapter then contaminates the FASTQ file
    and must be trimmed.


    Trimming is usually done with a piece of Java software called Trimmomatic. You
    can download Trimmomatic from the Usadell Lab site.


    ```

    www.usadell.org/cms/?page=trimmomatic

    ```


    With Trimmomatic in place, you can clean up your sequences. A typical trimming
    work sequence is as follows:


    +   Remove adapter sequences.


    +   Remove leading low-quality bases—say, before Phred code 5 (that is, Q score
    20).


    +   Remove N bases (N being FASTA/FASTQ code for “any nucleotide”—either A, C,
    G, or T—and therefore valueless).


    +   Remove trailing low-quality bases.


    +   Remove trailing N bases.'
