- img_proc: true
  md: '# Chapter 9 Visualizing the Genome


    configuration can be quite complex, and it is best suited for developers wanting
    to embed genomic views in their websites. Tablet is a lightweight visualizer that
    is easy to use but is restricted in the software file formats and connections
    to external resources. Artemis is convenient for small genomes such as bacterial
    genomes but can struggle with larger human or eukaryotic genomes or with a large
    number of tracks. IGV is a very comprehensive and customizable genome browser.
    It can handle a variety of file formats and offers a lot of functionalities, while
    remaining easy to use. For these reasons, IGV is a popular genome visualizer and
    will be our genome visualizer of choice in this chapter. A web version of IGV,
    called IGV Web App, was released in 2018. IGV Web App can be used for sharing
    genome views with other people. In this chapter, we will focus on the desktop
    version of IGV.


    # Installing the IGV Desktop Visualizer


    Go to the IGV desktop main page at www.broadinstitute.org/igv. The menu on the
    left contains three useful links, as shown in Figure 9.3.


    +   - **Downloads**: Enables you to download the latest version of the visualizer,
    available for Windows, Mac, and Linux.

    - **File formats**: Lists the 40 file formats that can be currently visualized
    on IGV. It includes of course the BAM and FASTA formats that we introduced in
    the previous chapter, as well as other formats that will enable us to annotate
    our genomic data. This large number of formats is one of the strengths of IGV.

    - **Hosted genomes**: Lists all reference genomes that are provided by default
    by IGV. This list covers several builds of the human genome, as well as the genomes
    of other species such as selection of mammals, fish, insects, fungi, plants, worms,
    protozoa, bacteria, and viruses.


    ![](img/f11d8c1d6b76e74ec2235e2ddebf829b_241_0.png)


    Figure 9.3: The IGV desktop main page'
