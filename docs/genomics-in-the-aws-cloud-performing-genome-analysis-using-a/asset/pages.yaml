    # Alignment to a Reference Genome


    With the creation of a FASTA or FASTQ file, we have a collection of nucleotides.
    Sequences from Illumina and BGI typically range from about 50 to 150 nucleotides
    in length, though nanopore, PacBio, or Chromium 10x sequencing—relatively new
    techniques—can yield longer sequences. Remember, that all of these sequences are
    in particular order. They come from fragments of DNA that were taken from cellular
    material that had been chopped mechanically and chemically—and even then, any
    long DNA segments that might have been chopped further because of the limitations
    of the sequencing technique employed.


    The contents of a FASTA or FASTQ file, therefore, are not useful by themselves.
    To derive any useful information from the newly sequenced DNA, a researcher has
    to assemble the fragments into something like a complete DNA strand. Ideally,
    it would be possible to pull all the fragments together into 46 long sequences
    that matched the sequences of the 23 pairs of chromosomes to the sampled individual.


    The short reads—millions of typically—do not contain any position information.
    It is by looking at a fragment sequence, to tell another about where it is—not
    which chromosome it came from. So, to assemble the fragments into a complete sequence,
    we need to use a reference genome.'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# Chapter 4 ■ The Bioinformatics Workflow 47


    The value of a reference genome lies in the fact that, for a given kind of organism,
    the genetic variation across individuals is very small. In humans, who have genomes
    about three billion nucleotides long, the variation is one-tenth of 1 percent—about
    three million differences among the overall three billion nucleotides.


    On the other hand, if we have a reference genome, we can fit the fragmentary sequences
    we''ve derived from a sequencing process into similar regions of the reference
    genome. It''s sort of like one of those puzzles for little kids who have cut-outs
    for the individual pieces to fit into: the pieces don''t interlock with each other
    but rather fit into a matching void.


    The process of fitting sample sequences onto a reference genome is called alignment
    or mapping.


    On the other hand, except for twins, no two individuals have exactly the same
    genetic sequence (even identical twins will differ genetically, practically, due
    to having different mutations and viral infections). Therefore, matches between
    the sampled genome and the reference genome will not be exact. Indeed, if they
    match exactly, there would be no point to genetic sequencing. The whole reason
    for sequencing of an individual is to identify differences between that person''s
    genome and the reference genome.


    Matching short samples to the reference genome is hard for several reasons. First
    among these reasons is that the basic task is to match sequences of a few hundred
    letters to a reference genome consisting of three billion letters. It''s just
    a monumental task, for a computer, to find where in such a gigantic string of
    characters a short string might fit.


    Beyond that, there might be several places a given sample sequence might match
    with the reference genome. In particular, there are places in the genome that
    feature a lot of repetitions. A given sample sequence would fit with any of several
    sequences, and there''s no way to tell which.


    Furthermore, the whole point of genetic sequencing is that the matches are not
    going to be perfect—nucleotides will differ between the reference genome and the
    individual''s genome. We are not clones, after all. Not all variations are “real.”
    They may instead be an artifact of the sequencing process, which is one of the
    reasons why we have a Phred quality score—to distinguish real variants from process-induced
    variations.


    The mismatches aren''t just limited to differences between the nucleotides at
    given locations. It is possible for the sample sequence to have extra nucleotides
    inserted at a given location (an insertion) or a series of nucleotides deleted
    (a deletion). These phenomena are collectively referred to as indels, and they
    mean that a given sample sequence and the nominally matching region on the reference
    genome need not be the same length. The alignment process has to allow for this
    possibility.'
