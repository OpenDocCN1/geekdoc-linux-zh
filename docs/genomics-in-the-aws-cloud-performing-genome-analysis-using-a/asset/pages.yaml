    # Inheritance


    As we have seen earlier, we have two sets of chromosomes, with one set inherited
    from each of our biological parents. Germ cells in ovaries or testes undergo a
    special type of cell division called meiosis, which generates daughter cells (egg
    or sperm) that contain only one set of chromosomes. An important event occurs
    during meiosis: when the paired chromosomes are aligned in front of each other
    in the first phase of meiosis, they exchange DNA between each other. This event,
    called crossing-over, occurs on average three to four times for each pair of chromosomes.
    It means that sperm or eggs rarely contain any original chromosome from any parent.
    They have instead chromosomes that have exchanged DNA material between parents.'
