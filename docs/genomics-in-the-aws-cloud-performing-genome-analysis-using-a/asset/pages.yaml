  md: '# Setting the Configuration at the Command Line


    You can make changes to the setup of the AWS command line with the aws configure
    command, which will prompt you for the AWS Access Key ID and AWS Secret Access
    Key matching your target instance. The basic command sequence is as follows:


    ```

    aws configure

    AWS Access Key ID [None]:<Your Access Key ID>

    AWS Secret Access Key [None]:<Your Secret Access Key>

    Default region name [None]:<The name of the AWS region you want to work

    in, such as ap-southeast-2>

    Default output [None]: ENTER

    ```


    This puts you at the AWS command line, logged in and ready to operate on your
    AWS resources. If you find yourself operating on more than one instance frequently
    (say, for your professional work as well as your personal activities), it is possible
    to set up a configuration file that lets you choose from among sets of access
    credentials.


    # Storing the Configuration in the Configuration File


    If you prefer not to set your security configuration at the command line, you
    can instead manually edit the file in which your credentials are stored.


    # Windows


    In Windows, your security configuration information is stored in the User Profile
    directory. The path to the directory is contained in the %USERPROFILE% environment
    variable, which the system administrator can set to pretty anything. By default,
    that directory is as follows:


    ```

    C:\Users\default

    ```


    or as follows:


    ```

    C:\Users\<Username>

    ```


    In the %USERPROFILE% directory, there will be a folder aws, within which is a
    file called credentials. The file that holds the access keys is in this file.


    # Linux and macOS


    In Linux and macOS, opening the following file in your favorite text editor:


    ```

    ~/.aws/config

    ```'
