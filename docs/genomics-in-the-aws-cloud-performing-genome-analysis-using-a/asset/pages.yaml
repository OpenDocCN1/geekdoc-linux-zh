  md: '# Epigenetics of Cancer


    We saw that the genome of cancers can develop large abnormalities, such as amplification
    of genes, translocations that match genes with the promoter, or fusion proteins
    that are abnormally activated. How does it happen? Cancer cells are genetically
    unstable. One of the key contributors for this instability is the hypo-methylation
    of the genome of cancer cells. More than 50 percent of the human genome is composed
    of mobile elements, and the proportion of mobile elements in most organisms''
    genomes is similarly highly. These mobile elements are mainly transposons (often
    described as jumping genes) and endogenous retroviruses that entered the genome
    of our ancestors up to millions of years ago. To prevent these mobile elements
    from changing position in the genome and creating mutations, the mobile elements
    are silenced by DNA methylation: a chemical methyl group attached to the C (cytosine)
    base of the mobile elements, particularly in areas with consecutive CGs (called
    CpG islands). In cancer, the methyl groups disappear, the transposons and endogenous
    retroviruses are not silenced anymore; they can move or duplicate to other areas
    of the genome and cause mutations. Hyper-methylation in the promoters and enhancers
    of oncogenes can also aberrantly increase the expression of oncogenes.


    In addition, the promoters and enhancers of tumor suppressors are often hypermethylated,
    which silences them. The important PTEN suppressor, which counters several oncogenes
    in proliferation pathways, is not expressed in up to 70 percent of prostate cancer
    patients; this loss is sometimes due to PTEN mutations but most often by aberrant
    methylation of the PTEN promoter.


    Histone marks (acetyl) and methyl groups placed on the tail of the histone proteins
    around DNA is wrapped) are also deregulated in cancer and contribute to aberrant
    gene expression. Repressive histone marks can aberrantly remain on developmental
    genes and keep cancer cells in an undifferentiated (stem-cell-or progenitor-cell-)
    and highly proliferative state.


    So, in cancer, the genome of cancer cells is globally hypo-methylated, which de-repress
    the mobile elements and increases genomic stability. Tumor suppressors are silenced;
    oncogenes can be demethylated at inappropriate times; histone marks, which provide
    an additional way to control transcription, are deregulated.


    These epigenetic abnormalities, which help drive cancer, cannot be picked up by
    WGS or WXS, as they do not change the DNA letters. They can be evidenced only
    by the study of the following:


    +   RNA expression: the extracted RNA can be sequenced via RNA-Seq in an approach
    similar to WGS, or to reduce costs, hybridized to microarrays. RNA-seq is a more
    powerful technique, as it allows not only detecting abnormalities in gene expression
    but also detecting gene fuses and studying isoforms and patterns of alternate
    splicing.'
