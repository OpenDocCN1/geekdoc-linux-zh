    # Samples


    The analysis of somatic genome, such as a tumor genome, requires two samples.


    +   - The tumor sample, such as a cancer biopsy


    +   - A normal sample corresponding to the germline genome, which the tumor sample
    will be compared to


    The bioinformatics workflow will identify somatic mutations, tumor mutations,
    by searching for mutations that are present in the tumor biopsy but not in the
    germline reference sample. The reference sample is usually a peripheral blood
    sample or a sample of normal tissue adjacent to the tumor.


    In the rare cases it is impossible to obtain a normal sample, the tumor sample
    can be compared to a data set containing the most common variants in a population
    of similar ethnicity; this approach, however, generates a lot of false positives
    for the detected tumor mutations and is not recommended.


    The tissue sample is ideally frozen after biopsy so that the DNA is of best quality.
    In practice, tumor samples are often preserved with formalin and embedded in a
    paraffin block, a technique called formalin-parffin-embedded (FFPE). Formalin,
    which is another name for formaldehyde, fragments and damages the DNA and can
    cause cytosine deamination into uracil or thymine; after sequencing, some Cs changed
    to Ts (or on opposite strand: G changed to A). Deamination is more common in samples
    with high levels of DNA fragmentation. The sequencing laboratories evaluate the
    DNA quality prior to sequencing and usually report the level of DNA fragmentation.


    Tumors are very heterogeneous and often harbor different clones. To be able to
    capture the genetic diversity of each clone, it is important to pick cells in
    different regions of the tumor.


