  md: '# Chapter 6 Building Your Environment in the AWS Cloud


    To set up a password policy for your AWS account, open the IAM Password Policy
    section of the Security status list and click the Manage Password Policy. You
    will be taken to the Account Settings page, shown in Figure 6.29, where you should
    click the Account Password Policy button.


    ![](img/f11d8c1d6b76e74ec2235e2ddebf829b_129_0.png)


    **Figure 6.29:** Setting a password policy with list of selectable options (Figure
    6.30).


    You''ll be presented with a list of selectable options (Figure 6.30). Establishing
    a policy is a matter of choosing which options you want to enforce, balanced against
    how much inconvenience you are comfortable imposing on users (which may just be
    yourself). It''s easy to require a variety of characters in a password. You may
    or may not want to require periodic resets, since those come up at the most inconvenient
    moments. Figure 6.31 shows typical sets of options.


    # Creating Groups


    Once you have set your security, you are ready to create some users. Best practice
    in undertaking that is to identify what kinds of users you want to create and
    set up a group to which each of user can belong. This makes it easier to manage
    users, that you can adjust the capabilities of many users at once by managing
    a group to which they belong, rather than by modifying the characteristics of
    the users individually.'
