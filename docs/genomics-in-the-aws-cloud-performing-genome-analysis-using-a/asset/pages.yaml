    # Transferring Files to and from Your AWS Instance


    You can easily transfer files between Linux machines or between Linux and macOS
    machines; you just need to use the scp (secure copy) command from a terminal.
    Suppose the IP address of your AWS instance is 170.160.10.15, you can transfer
    files from your Linux or macOS laptop to the AWS instance with:


    ```

    $ scp myfile.txt 170.160.10.15:-

    ```


    and vice versa with:


    ```

    $ scp 170.160.10.15:-/myfile.txt .

    ```


    To transfer files between a Windows laptop and the AWS instance, best solution
    is to use a File Transfer Protocol (FTP) package like WinSCP or FileZilla. Figure
    7.5 shows the FileZilla interface, with the laptop files on the left and the server
    files on the right. You can copy and paste from one side to the other securely.


