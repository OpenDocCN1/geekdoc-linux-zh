  md: '# Chapter 11 » Variants and Applications


    The input information to calculate a PRS should include the following:


    +   - The list of SNVs composing the score. They can be specified with an rsID
    or RefSNP or with the bp position in the genome.

    - The effect allele for each SNV.

    - The effect size (beta or weight) for each SNV.

    - The genome reference.


    If the effect size is specified as a hazard ratio or an odds ratio, take the log
    of the ratio to obtain the weight. As an example, Table 11.1 shows an extract
    of a PGS Catalog scoring file from a recent GWAS on thyroid disease. The study
    identified nearly 900,000 variants, with small effect sizes.


    # Table 11.1 Example of PGS Catalog Scoring File


    ```

    #genome_build=GRCh37

    #variants_number=895602

    #weight_type=BETA

    ```


    | CHR NAME | CHR POSITION | EFFECT_ALLELE | OTHER_ALLELE | EFFECT_WEIGHT |

    |---|---|---|---|---||

    | 1 | 754182 | A | G | -2.0E-06 |

    | 1 | 768444 | G | A | -2.0E-06 |

    | 1 | 779322 | A | G | 8.0E-06 |

    | 1 | 846808 | C | T | 2.0E-06 |

    | 1 | 853954 | C | A | -1.3E-05 |

    | 1 | 854250 | A | G | 3.0E-06 |

    | 1 | 861808 | A | G | 1.7E-05 |

    | 1 | 863124 | G | T | 3.9E-05 |


    The SNVs of the variants to analyze can be extracted by utilities such as BGEN,
    which is directly supported by PLINK, or bgenix. The extracted SNVs must be converted
    to PLINK format.


    ```

    > plink2 --bgen single_allelic.file --ref ref- \

    --hard-call-threshold 0.1 \

    --sample mytestsample.sample \

    --memory 16000 \

    --set-all-var-ids @:#_$r_$a \

    --freq \

    --make-pgen \

    --out raw

    ```'
