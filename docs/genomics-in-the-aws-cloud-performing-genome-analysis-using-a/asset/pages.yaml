    At egg fertilization, the egg and sperm fuse their nuclei together, as they prepare
    for the cell replication. The fertilized egg now contains the full sets of chromosomes.
    The sperm mitochondria get progressively eliminated, and only the egg mitochondria,
    therefore maternal mitochondria, remain.


    As we have received a set of chromosomes from each parent, we dispose of two copies
    for gene: a maternal copy and a paternal copy. Genes can have several alternate
    forms, called alleles. A particular position (locus) in the human genome may have
    two alternative nucleotides, alleles, C or T. In genome databases, the term reference
    allele refers to the nucleotide that is found in the reference human genome. As
    the reference is built from a limited number of individuals, it is not always
    the major allele found in the population.


    Single nucleotide variations are often called single nucleotide polymorphism (SNPs,
    pronounced "snps"). SNPs traditionally referred to variants present in more than
    5% of the population in order to exclude rare mutations. In practice, databases
    list SNPs of extremely low frequency. And many others prefer to use the generic
    term single nucleotide variation (SNV, pronounced "sniv"), which does not make
    any assumption about the frequency of the variation.


    Our genome constitutes our genotype, which is all our genetic information. Our
    genotype has an effect on our phenotype, which consists of our observable physical
    properties, such as height, hair color, or behavior. If we inherit the same allele
    or SNV from both parents, we are homozygous for that SNV. If we inherit different
    SNVs (for example, an A from one parent and a T from the other parent), we are
    heterozygous for SNV.


    In the genome, combinations of alleles at positions close to each other on the
    same chromosome tend to happen more often than would be expected by pure chance;
    this suggests they were inherited together. These combinations of alleles are
    called haplotypes. The technique of linkage disequilibrium quantifies how often
    alleles or sequence variants are inherited together; alleles that are always inherited
    together are said to be in linkage equilibrium.


    Alleles or SNVs can have several modes of inheritance. If the allele is associated
    with a strong phenotype, it is worthwhile doing a family tree indicating which
    family members are affected. This is called a family pedigree. Figure 2.6 illustrates
    an example of family pedigree. Males and females are respectively represented
