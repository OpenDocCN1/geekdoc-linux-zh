  md: '# Chapter 10 Containerizing Your Workflow on the Desktop


    A Docker image is a recipe for creating a container. An image, rather than being
    a snapshot of a disk volume or other storage medium, consists of code that describes
    how to build a particular kind of container from the ground up. It might say to
    start with a particular base image from the Docker repository (more on than later),
    add some dependencies, and then add an application (from some repository) on top
    of it. It is possible to think of images as consisting of layers: the configuration
    layer is on top of the application software layer, which is on top of a dependency
    layer, which is in turn on of an operating system layer.


    A container, then, is a running instance of a Docker image. If you know something
    about object-oriented software architectures, you might think of an image as an
    object class and a container as an object created from such a class.


    # More on Using the Docker Hub


    Central to the Docker experience is the Docker Hub, which is a set of repositories
    (public and private) where Docker images are stored. You can access the Docker
    Hub via a browser (at hub.docker.com using your Docker username and password to
    log in). If you prefer, you can get there via a menu option in the Docker Desktop
    application.


    The Docker Hub is searchable. Say you wanted a container that runs a database
    base. You could put the name of the database into the search box or browse for
    databases by category. The Docker Hub will bring up a list of available images
    that match. Figure 10.6 shows the listing for MySQL, the popular open-source database
    server.


    ![](img/f11d8c1d6b76e74ec2235e2ddebf829b_271_0.png)


    Figure 10.6: A Docker image for running the MySQL database


    Note the “Docker Official Image” tag in the listing. It indicates that this image
    is maintained by people who know what they are doing—either from the company that
    owns the software or from the open-source community that maintains it. You can
    generally trust images tagged as official to perform correctly and without surprises.


    # Containers for Genomics Work


    For genomics work, a number of prebuilt Docker images exist. For the purposes
    of illustration here, we will download and run the Genomics in the Cloud image,'
