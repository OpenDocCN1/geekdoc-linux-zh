  md: '# About the Authors


    Catherine Vacher, PhD, is a research fellow at the Brain and Mind Centre at the
    University of Sydney. There, she models complex systems related to healthcare
    and advises policymakers on the most effective use of limited health resources.


    She previously worked as a scientist at the Garvan Institute of Medical Research.
    There, she worked in bioinformatics, whole-genome sequencing, transcriptomics,
    molecular modeling, and metagenomics, mostly with respect to cancers.

    She also enjoyed a long career at IBM, in Europe and in the Asia-Pacific region.

    She enjoys theater and opera as well as travel.


    David Wall is a consultant specializing in the AWS cloud. His projects included
    complex database and machine learning solutions as well as telecom-communications
    systems.


    He is an avid cyclist and works as a volunteer firefighter.'
