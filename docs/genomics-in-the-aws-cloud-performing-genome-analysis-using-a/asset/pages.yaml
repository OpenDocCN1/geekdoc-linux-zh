    # Identifying and Annotating SVs and CNVs


    Structural variants (SVs) are larger variants than SNVs and indels and are usually
    defined as variants of more than 50 base pairs in length. They can be hundreds
    or thousands of nucleotides in length. As shown in Chapter 4, SVs can be called
    by two methods.


    +   - Identifying breakpoints, where one DNA sequence is connected to a DNA sequence
    located in a nonadjacent region. This method can identify SVs at the nucleotide
    level

    - Spotting variations in read depth detect copy number variants (CNVs) as copy
    number loss (deletions) or copy number gain (duplications).


    Many programs implement these techniques. Manta is a popular software for identifying
    breakpoints to all SVs. CNVator (and the related CNpytor from the same laboratory)
    are frequently used to detect CNVs, while Conavar can spot very large CNVs of
    more than 1 million nucleotides in length.

    Let''s install and run Manta to identify structural variants in our sample. Here
    is how to install:


    ```

    apt-get update -qq

    apt-get install -qq bzip2 gcc+ make python zlib-dev

    git clone https://github.com/Illumina/manta.git

    cd manta

    mkdir build && cd cd build

    # Ensure that CC and CXX are updated to target compiler if needed, e.g:

    # export CC=/path/to/cc

    # export CXX=/path/to/c++

    ../${MANTA_VERSION}.release_src/configure --jobs=4 --prefix=/path/to/install

    make -j4 install

    ```'
