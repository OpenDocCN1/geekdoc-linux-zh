    double stranded DNA sequences) are ligated to each end of the fragments, and the
    DNA fragments with adapters are selectively enriched. The sample is loaded into
    a specialized glass slide called a flowcell, where the amplification and actual
    sequencing take place. At the bottom of the flowcell are attached DNA sequences
    that are complementary to the adapters. The fragments introduced into the flowcell
    randomly bind by hybridization and then entered into the flowcell to create about
    1,000 copies of each fragment. The actual sequencing, called sequencing by synthesis,
    can now take place. Modified nucleotides are introduced into the flowcell. These
    specialized nucleotides force the DNA polymerase to add only one nucleotide at
    a time and have a fluorescent label. The DNA polymerase synthesizes a complementary
    strand for each fragment, using the modified nucleotides. A camera records all
    the fluorescent emissions and determines from the fluorescence wavelength base
    (A, T, G, or C) was added.


    The sequencing can be done along one end of the fragment (single-end sequencing).
    By adding a few extra steps to the process described previously, it is possible
    to sequence both ends of the fragment (paired-end sequencing). Whether single-end
    or paired-end sequencing, the sequencing is typically done for a length of 50
    to 150 bases, though the latest Illumina platform (NovaSeq) can go up to 250 bases.
    The human genome has many repetitive regions where it is difficult to properly
    align sequences obtained from short read sequencing. To facilitate alignment in
    repetitive regions, as well as to improve the detection of structural variations
    in the genome, it is advisable to use paired-end sequencing, as well as reads
    as long as possible.


    PacBio This technique, from Pacific Biosciences, relies on single-molecule, real-time
    (SMRT) sequencing to allow for long reads of about 50,000 bases on average. The
    PacBio platform has a higher sequencing error rate than Illumina/BGL. It is very
    expensive and reserved for research.


    Nanopore The Nanopore approach, from Oxford Nanopore Technology, is totally different.
    The DNA molecule is fed through a small channel called a nanopore, which generates
    an electric current that can be interpreted as the nucleotide sequence. Nanopore
    can generate very long reads, and the device (Nanopore MinION) is about the size
    of a portable telephone. However, Nanopore has a high error rate, so it is used
