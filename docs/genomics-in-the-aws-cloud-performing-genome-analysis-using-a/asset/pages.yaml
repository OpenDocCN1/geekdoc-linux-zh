    # Annotating the SNVs and Indels


    We now have our sample''s variants—SNVs and indels—recorded in the VCF file. As
    shown in Chapter 4, each human has around six million 60,000 SNVs and indels compared
    to the reference genome. Most of them are not problematic. We need to annotate
    the variants to identify which variants occur near a gene or in regulatory regions.
    Annotations also document the consequences of these variants, such as change of
    amino acid (missense variant), truncation (stopgain variant), or complete change
    in protein sequence (frameshift variant where an indel changes the reading frame
    of codons). Other annotations include frequency of the variant in the general
    population (usually derived from the EXAC database of 60,000 individuals), pathogenicity
    score (predicted by machine learning methods), and information from the clinic
    ClinVar database (“Likely pathogenic,” or “Variant of unknown significance”).


    VEP is a well-documented, frequently updated software for annotating variants
    in a VCF file. The base VEP installation provides some annotations, others are
