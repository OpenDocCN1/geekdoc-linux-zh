  md: '# Calling SNVs and Indel Variants


    Our BAM file is now ready to call all the variants: single nucleotide variants
    (SNVs), small insertions and deletions (indels), structural variants (SVs), and
    copy number variants (CNVs).


    We have hundreds of thousands of sequencing reads aligned to the human reference
    genome, like jigsaw pieces placed in the correct place in a jigsaw puzzle. When
    sequencing depth is 30x, then for each nucleotide position in the genome, there
    are around 30 sequencing reads that cover that nucleotide position. So, to continue
    the jigsaw puzzle analogy, it is as if each position in the puzzle has 30 identical
    pieces on top of it. If a sample has a difference at one of the two copies of
    the chromosome, then half of the sequencing reads will have a different value
    at that position, and a heterozygous SNP would be reported. If a sample has a
    difference at both positions of the chromosome, and a homozygous SNP should be
    reported. If a sample has, three nucleotides at a given position on one copy of
    the chromosome, then half of the sequencing reads will contain the text “3D” (signifying
    a three-base-pair deletion) in the BAM file’s cigar at that position, and a heterozygous
    small deletion should be called. If a sample has a one-nucleotide insertion at
    a given position, then half of the sequencing reads will contain the text “II”
    (signifying a one-base-pair insertion) in the BAM file’s cigar string at that
    position, and a heterozygous small insertion should be called.


    There are various software modules and pipelines that have been developed for
    processing DNA sequencing reads.


    The SNVs and indels are most commonly called by the Genome Analysis Toolkit (GATK)
    software developed by the Broad Institute, a leading genomics institute (github.com/broadinstitute/gat/releases).


    We will broadly follow the best practices developed and recommended by Broad Institute.
    You can search for “Broad Institute best practices” and find more about Broad
    best practices at gatk.broadinstitute.org/hc/en-us/36002726651-Best-Practices-Workflows
    and videos at www.broadinstitute.org/partnerships/education/broadde/best-practices-variant-calling-gatk.


    Sometimes it is not clear-cut whether a variant is present or whether the differences
    are seen similarly. Sequencing can produce systematic errors in addition to random
    errors. The GATK best pipeline contains extra steps producing extra information
    that the data of multiple samples can be compared at once. This allows the software
    to do a better job of detecting whether differences are real variants or only
    errors. When the variants of multiple samples are called in this way, it is referred
    to as joint-calling.'
