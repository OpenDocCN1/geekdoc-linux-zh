  md: '# A Crash Course in Molecular Biology


    To properly analyze genomes, you need to understand some key biology concepts.
    Biology is a vast field, and this chapter focuses on areas that are fundamental
    for extracting meaningful information from genomes.


    # DNA


    As you are aware, your genome encodes all the information necessary to build and
    maintain your body. It is composed of a series of about three billion letters,
    which can be either A, G, C, or T, and is stored inside the nucleus of your three
    trillion nucleated cells. Red blood cells do not have a nucleus and therefore
    are your only cells without a copy of your genome.


    Note that all living organisms—such as animals, plants, fungi, or bacteria—also
    have a genome, composed of the same letters A, G, C and T. This book focuses on
    the analysis of the human genome, but all concepts and techniques are applicable
    to other species. You can apply them to the analysis of the genome of your cat,
    goldfish, potted plant, or slime mold growing in your front lawn. In genomics,
    it is sobering to see that humans are just a life species among many others.


    Physically speaking, your genome is encoded into chains of repeating sub units
    called nucleotides. Each nucleotide consists of a sugar group, a phosphate'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# Chapter 2 A Crash in Molecular Biology


    group, and a base that can be adenine (A), guanine (G), cytosine (C), or thymine
    (T). The sugar is called deoxyribose; hence, these long molecules are named deoxyribonucleic
    acid (DNA). A chain of nucleotides is referred to as a DNA strand. To make this
    chemical structure more stable against mutations, your genome is actually stored
    as two complementary DNA strands. The second strand does not provide any information
    and is simply a copy of the first, where A is replaced by T, G by C, T by A, and
    C by G. The DNA strands bind via weak chemical bonds called hydrogen bonds (the
    bases A pair with T, the G pair with C), coil around each other, and the elegant
    and well-known DNA helix structure.


    DNA is a convenient and compact way of storing information. It has already been
    used to store, compressed MPEG videos and data up to 200 MB. In living organisms,
    the DNA molecule is broken into segments called chromosomes. Species have various
    numbers of chromosomes: the fruit fly has 8 chromosomes, spinach and slime mold
    have 12, humans have 46, dogs and chickens have 78, and bacteria. Bacteria stand
    apart as they have a single chromosome of circular shape, which is free floating
    as bacteria do not have a nucleus. The 46 human chromosomes are divided into two
    sets of 23 chromosomes, each set inherited from each parent. Our chromosomes are
    numbered from 1 to 22, with the last two chromosomes, X and Y, determining our
    sex.


    Not to be forgotten, each of our cells contains between 80 and 2,000 small oval
    structures called mitochondria that produce the energy required for the cell.
    Mitochondria are thought to be bacteria that have been internalized by the cells
    of our primitive ancestors 1.5 billion years ago. Each of our mitochondria has
    its own DNA, which has a circular shape (like in bacteria), unlike our linear
    chromosomes. We inherit our mitochondrial DNA exclusively from our mother. Although
    genealogical researchers study our maternal lineage many generations ago.


    The length of our genome, if we put our chromosomes end to end, would be nearly
    2 meters. To fit into the tiny nucleus of each of our cells, DNA is first wrapped
    around proteins called histones and then tightly and coiled. This packing complex
    of DNA and histone is called chromatin. When the chromatin is tightly packed (also
    condensed), the DNA cannot be accessed. When a region of DNA needs to be read,
    the chromatin is unpacked and is said to be open.


    Now, let''s look at some chemical bases and bonds to clarify an important concept
    that is confusing when interpreting genomic databases. DNA strands have orientation:
    at one end of the strand, the base is connected to the fifth carbon of the sugar,
    whereas at the other end, the base is attached to the third carbon. Each end of
    a DNA strand is therefore nicknamed 5'' or 3''. By convention, DNA sequences are
    represented from 5'' to 3''. Because the second complementary strand does not
    represent any additional information,'
