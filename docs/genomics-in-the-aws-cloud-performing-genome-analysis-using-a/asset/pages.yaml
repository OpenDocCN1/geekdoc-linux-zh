    # Copying the FASTQ Files


    FASTQ files contain the sequencing data from the sequencing service provider.
    For this exercise, we will obtain the publicly accessible whole-genome sequencing
    FASTQ files of an individual. The individual is sample NA12878 from the 1000 Genomes
    project, also as Utah Woman. The sequencing data from this individual is now a
    standard, by using sequencing centers and bioinformatic around the world for quality
    control and benchmarking. If you have your FASTQ files of sequencing paired reads
    that you want to process, you can use them instead of obtaining the data for NA12878.


    Use PuTTY to ssh to your EC2, mount the EFS, and type the following commands:


    ```

    cd efs

    mkdir -p data/fastq

    cd data/fastq

    wget -ftp http://ftp.sra.ebi.ac.uk/vol/fastq/SRR622/SRR622457/SRR622457_1.fastq.gz

    wget -ftp http://ftp.sra.ebi.ac.uk/vol/fastq/SRR622/SRR622457/SRR622457_2.fastq.gz

    ```


    We get commands will obtain the paired sequence read files for NA12878 whole-genome
    sequencing. The downloads will take hours because the files are large. During
    the download, you will see reporting of the progress of the downloading.


