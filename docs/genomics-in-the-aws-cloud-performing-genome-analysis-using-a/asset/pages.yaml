    # Understanding File Permissions


    File permissions can be either read access, write access, or execution access.
    The permissions are granted at the level of the file owner (called user), group,
    and for all others.


    Figure 7.6 indicates how the permissions are recorded.


    ![](img/f11d8c1d6b76e74ec2235e2ddebf829b_156_0.png)


    **Figure 7.6:** Linux file permissions


    Let''s look at the ls command we executed previously.


    ```

    $ ls -lh

    -rwxr-xr-x  1 root 158K Aug 25 2018 sudoku

    ```


    You can see that sudoku is a file (-) has read/write/execute permissions for the
    root user (rwx), plus read and execute permissions for the group as well as for
    others (r-x repeated twice).


    These permissions can be altered with the chmod command. The following command
    defines permissions to the file myfile.txt: read and write access'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# Chapter 7 Linux and AWS Command-Line Basics for Genomics


    to the file owner/user(u=rw), read access to the group (g=r), and no access to
    others (o=).


    ```

    $ chmod u=rw,g=rw,o=myfile.txt

    ```


    These permissions can also be granted using the octal code, as shown in Table
    7.2.


    Table 7.2: Linux Permissions, Octal Code, and Interpretation


    | PERMISSIONS | OCTAL CODE | INTERPRETATION |

    | --- | --- | --- |

    | rwxrwrwx | 777 | Read, write, and execute for all users |

    | rwx-xr-x | 755 | Read and execute for all users; write permission for owner
    |

    | rwx-\-\-\x-\-\- | 700 | Read, write, and execute for owner; no permission for
    anyone else |

    | rw-rw-rw- | 666 | Read and write permission for all |

    | r-\-\-\-\-\- | 400 | Read for owner; no permission for anyone else |


    The following command grants read, write, and execute access to all users for
    the myfile.txt file:


    ```

    $ chmod 777 myfile.txt

    ```


    # Compressing and Archiving Files


    The tar utility''s name comes from "tape archiver." The utility can be used to
    archive a group of files to disk or other media. It is often used to move files
    between disks or machines.


    Let''s archive and compress the proteinwork subdirectory of my home directory
    onto the disk /g/data.


    ```

    $ tar cvzf /g/data/proteinwork.tgz -proteinwork

    ```


    The -c option indicates that we are creating an archive and not extracting files
    from an archive. The -v option stands for verbose to show the tar progress. The
    -f option tells tar the name of the archive to create (proteinwork.tgz).'
