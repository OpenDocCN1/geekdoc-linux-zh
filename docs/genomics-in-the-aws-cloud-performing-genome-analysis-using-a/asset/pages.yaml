  md: '# Chapter 5 | AWS Services for Genome Analysis 61


    # General Concepts


    Before we get into the specifics of the various components you need to build a
    genomics environment in AWS, you need to understand some basic ideas. Most of
    them have the potential to be large areas of inquiry unto themselves, but you
    can approach them in a simplified way for the purposes of what we are attempting
    to do here.


    # Networking


    Sort by definition, working with computing resources in the cloud requires some
    knowledge of computer networking. For the purposes of this book, we''ll assume
    you are familiar with basic data networking concepts—that you know what an IP
    address is and what it means for connectivity to exist computing resources on
    a network. We won''t assume you''ve worked as a networking specialist, though,
    and absolutely do not expect you to have any familiarity with the way AWS does
    things.


    # AWS Functionalities


    AWS provides all kinds of functionalities that allows its users to distribute
    their resources around the world in an apparently seamless way. This allows AWS
    customers to improve the durability of their systems (for example, to continue
    to provide services in the event of a natural disaster that affects a large geographic
    region) and to offer services of better quality to widely distributed customers
    (to serve web and media files from a geographically proximate location, improving
    performance). AWS also allows customers to connect their virtual entities to traditional
    organizational data centers, creating hybrid systems that can manage all kinds
    of specific requirements.


    These features generally aren''t central to genome analysis, though. For the purposes
    of what we''re doing here, we will assume that you want to do the following:


    +   - Instantiate the tools you need in the AWS cloud as simply as possible

    - Access them securely from your own computer

    - Use AWS computing resources only as long as required

    - Store genomics information more or less permanently on AWS


    # AWS Accounts


    AWS is a business, which means that everything you do with AWS needs to be associated
    with an account, which is responsible for paying for the AWS'
