  md: '# Typical Results


    Of the aforementioned services, perhaps the best-known of the direct-to-consumer
    genetic testing services is 23andMe, a California company that pioneered the industry
    in 2007. When someone places an order with 23andMe, the company sends out a kit
    containing materials needed for the collection of saliva, which is then sent back
    for analysis. (The idea is that everyone''s saliva contains cells that have been
    shed from the interior of the mouth.) The company presents its report to the customer
    via its website.


    The company ran afoul of the U.S. Food and Drug Administration (FDA) in 2013,
    when the regulator objected to 23andMe (and other genetics services providers)
    that its service provided its customers with information on their susceptibility
    to various genetically linked conditions, such as male-pattern baldness and certain
    kinds of cancer. This FDA, stated constituted medical advice that should be formulated
    and delivered by a qualified doctor. The 23andMe tests were medical devices and
    should be regulated as such.


    After going quite viral, 23andMe applied to the FDA for permission in its reports
    about a number of mutations and alleles that are well-understood to associate
    with pathogenic conditions, including Alzheimer''s disease, Parkinson''s disease,
    celiac disease, and a number of BRCA1 and BRCA2 mutations associated with breast
    cancer. The company argued—and the FDA ultimately agreed—that the test methods
    used by 23andMe were sufficiently reliable and understood as to not require the
    involvement of a medical professional. As well, the entities agreed that the relationships
    between the tested sequences and the various diseases were adequately proven,
    and if an individual was found to have a sequence known to be pathogenic, there
    would be no need to hide the truth behind the medical establishment.


    With the shift toward presentation of information about ancestry rather than medical
    conditions, direct-to-consumer online genetic analysis services have, perhaps
    predictably, begun to appeal to whose ancestry is more than passing.


    So, what''s in a set of 23andMe reports? If you undergo the saliva test and log
    into the 23andMe website today, you will get a lot of novelty about probable hair
    color, the shapes of body parts, and the aspects of aging. Sometimes, 23andMe
    gets things right. For example, 23andMe predicted the following for me:


    +   - A 67 percent probability of little to no hair back. (Correct!)

    - A 32 percent probability of a bald spot on the top rear of the head. (Correct,
    pretty much. It''s kind of thinning there, but certainly bald. Certainly.)

    - A 74 percent chance that the earlobes are separate from the sides of the face.
    (Hear, hear!)'
