    # Copy Number Changes


    Cancer genomics develop large alterations whereby large regions of the genome
    can be duplicated once or more deleted. These changes are referred to as copy
    number variations (CNVs). The changes can be associated with better or worse survival
    and inform treatment for some cancers.


    CNVs can be inferred from the variation in depth in a BAM file. A region that
    has been duplicated will have more reads aligned to it, whereas a region that
    has been deleted will have a deficit in reads. Several software packages available
    that scan a BAM file, calculate the depth across the sequenced genome, split it
    into segments, filter the signal, perform statistical analysis, and finally produce
    a list of candidate CNVs. CNV callers always correct for GC content, as of DNA
    polymerase characteristics, regions with low GC content tend to accumulate ever
    reads, and regions with high GC content have more reads.


    Popular somatic CNV callers include CNvator, CNVpytor, GATK4 CNV, Control-FREE,
    and PureCn. In Chapter 8, we used CNvator, as it is an easy-use package that is
    commonly used in genomic analysis and has recently updated to allow somatic analysis.
    Here, we will use CNVpytor, which runs faster than CNvator and runs on Python.
    CNVpytor an come from the same laboratory (Abyzovlab) and can be used for genomic
    and somatic analyses.


    CNVpytor is available at github.com/abyzovlab/CNVpytor. Let''s install it. CNVpytor
    does not rely on the ROOT package like CNvator, so the installation is simplified.


    ```

    # Installation CNVpytor

    g clone https://github.com/abyzovlab/CNVpytor.git #copy the repository

