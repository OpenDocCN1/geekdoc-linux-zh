  md: 'Conversely, probability[mapping position is incorrect] equals $10^{-MAPQ/10}$.
    A tool called the Burrows-Wheeler Aligner (BWA), using an algorithm called Maximum
    Exact Matches (MEM), assigns a mapping quality (MAPQ) score that describes the
    probability that a sequence is mapped correctly to the reference genome. The maximum
    MAPQ score is 60, which corresponds to a probability of incorrect mapping of 0.0001
    percent, which is one in a million (other MAPQ values and their corresponding
    percentages are in Table 9.3). Reads with a low MAPQ are displayed in IGV in white
    as opposed to their usual gray color.


    # Table 9.3: Mapping Quality (MAPQ) Scores and Their Corresponding Probabilities


    | MAPQ | PROBABILITY THE MAPPING POSITION OF A READ IS INCORRECT |

    |---|---|\| 0 | 100% |

    | 10 | 10% |

    | 20 | 1% |

    | 30 | 0.1% |

    | 40 | 0.01% |

    | 50 | 0.001% |

    | 60 | 0.0001% |


    # Have a CIGAR


    CIGAR stands for Concise Idiosyncratic Alignment Report. It is a compressed representation
    of an alignment that is part of the SAM file format. M stands for Match, D for
    deletion, I for insertion, S for soft clipping (part of a sequence that does not
    align to the reference but is still saved in the BAM file), and H for hard clipping
    (part of a sequence that does not align to the reference and is not saved in the
    BAM file). For example:


    +   - 100M: Perfect alignment.

    - 80M5S15M: The first 80 bp of the read perfectly match the reference, the next
    5 bp are different from the reference, and the last 15 bp of the read again perfectly
    match the reference.


    Paired reads with an insert size that is larger than expected are highlighted
    in red and can correspond to a deletion: the paired reads were close to each other
    in the DNA fragment of the individual but separated by a big gap when mapped to
    the genome reference, as the individual is missing this part in their genome.


    Conversely, paired reads with an insert size that is smaller than expected are
    highlighted in blue and can correspond to an insertion: the paired reads were'
