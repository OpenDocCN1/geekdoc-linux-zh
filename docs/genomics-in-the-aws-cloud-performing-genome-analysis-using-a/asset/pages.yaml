    ./cnvpy -root myfile.pytor -ls

    ```


    Calculate histograms of read depth using bins of 10 kb, GC correction, and partition
    the data.


    +   # Calculate histograms of read depth, GC correction

    ./cnvpy -root myfile.pytor -his 10000

    # Partition data

    ./cnvpy -root myfile.pytor -partition 10000


    Finally, we call the CNVs and store the results in a tab-separated file that indicates
    the CNV type, region (start and end), size, and read depth (normalized to 1),
    followed by statistics and quality indicators.


    ```

    # Call CNV regions

    ./cnvpy -root myfile.pytor -call 10000 > calls.10000.tsv

    ```


    The called CNVs can be filtered to eliminate CNVs with little change in depth
    and can be annotated with VEP, using the same procedures in Chapter 8. CNVpy can
    also use as input the VCF file we previously generated with Strelka and calculate
    the imbalance in alleles (B-allele frequency or BAF). Heter SNVs are visible in
    half of the reads, so BAF is usually equal to 0.5. If one chromosomal region is
    duplicated, the heterozygous SNVs will be visible in one-third or two-thirds of
    the reads (depending on whether the SNV is on the region or not), so BAF will
    be equal to one-third or two-thirds. This provides an additional signal, in addition
    to the depth itself, deciding whether a region is a CNV or not.


