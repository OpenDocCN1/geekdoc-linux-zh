    # Mounting an S3 Bucket as a Windows Drive


    Our preferred tool for working with S3 buckets under Windows is TNTDrive. It is
    easy to set up and has been completely reliable.


    Setting up TNTDrive is simple. Download the installer executable from tntdrive.com
    and run it. You have to reboot after installation completions.


    Once you have rebooted, you can run TNTDrive and give it your access key ID and
    secret access key. With those, TNTDrive will connect to S3 and show your bucket
    hierarchy. You can then click Add New Mapped Drive in TNTDrive to map a drive
    to the top of your S3 environment (you can access the entire folder tree) or to
    some subordinate point. This is shown in Figure 6.42.


    # Mounting an S3 Bucket Under macOS and Linux


    The options for mounting S3 bucket as a drive under macOS are generally not as
    slick as what is available for Windows. There is, however, a perfectly reliable
    piece of software S3FS-FUSE available on GitHub. You can download and install
    it and then access your S3 environment from within the macOS Finder, same as you
    would with any network drive. There’s no special client, which is may even better
    than the TNTDrive approach.


    While there are a few ways to install S3FS-FUSE under macOS (you can download
    and build the source manually, if you want), the easiest way is with Homebrew,
    as shown here:


    ```

    brew cask install osfuse

    ```'
  merge: -1
