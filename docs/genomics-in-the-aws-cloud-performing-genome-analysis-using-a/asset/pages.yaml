    The next major refinement to make to our BAM alignment file of sequencing reads
    to a reference genome is the GATK Base Quality Score Recalibration (BQSR). This
    process applies machine learning to improve the nucleotide-specific quality scores.
    This is useful, because downstream processes rely on those quality scores to decide
    whether to call variants. For instance, if there are a few rows showing a variant
    in a given position but their quality scores are low, the downstream processing
    may decide to not call the variant, given'
