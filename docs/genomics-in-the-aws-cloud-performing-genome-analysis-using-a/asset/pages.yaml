    # Connecting from Windows


    When you are working under Microsoft Windows, it is best to use an application
    called PuTTY rather than built into the command line. PuTTY (the capitalized TTY
    refers to “teletypewriter,” a very old standard for text interfaces) is the standard
    tool for SSH work. You can download PuTTY free of charge from putty.org.


    Before you can connect to your EC2 instance, you must use the .pem file you downloaded
    from AWS to form a PuTTY key. PuTTY comes with a tool called PuTTY Key Generator
    (or PuTTYGen) that will convert a .pem file into a PuTTY-compatible .ppk file.


    Load your .pem file into PuTTY Key Generator, as shown in Figure 6.38. Then, click
    the Save Key button and generate a new file (a .ppk extension).


    ![](img/f11d8c1d6b76e74ec2235e2ddebf829b_136_0.png)


    Figure 6.38: a .ppk file with PuTTY Key Generator


    In PuTTY itself, navigate to Connection, SSH, Auth in the tree. Use the Browse
    button next to the Private Key File for Authentication box to specify the .ppk
    file you just created. Figure 6.39 shows what this looks like.


    On the Session page of PuTTY, the DNS name of your EC2 instance in the Host Name
    box, as shown in Figure 6.40.


    Click Open, and then get in, as shown in Figure 6.41.'
