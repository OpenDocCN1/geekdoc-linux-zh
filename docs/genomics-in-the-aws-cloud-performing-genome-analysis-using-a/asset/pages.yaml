  md: '# Connecting from macOS or Unix/Linux


    To connect using Terminal, which incorporates both the macOS command-line interface
    and your SSH connectivity, put your .pem file in a folder. Then, use Terminal
    and navigate to that directory.


    Terminal will not let you use a .pem file that is publicly readable. (You''ll
    get an error if you try.) You have to change the permissions on the file using
    the chmod command, as follows:


    ```

    chmod 400 GenomicsKeys.pem

    ```


    Once you have done that, you can initiate an SSH session to your instance like
    this:


    ```

    ssh -i GenomicsKeys.pem ubuntu@ec2-13-236-69-27.ap-southeast-2.compute

    .amazonaws.com

    ```


    Note that we use the DNS name rather than the IP address. This also assumes that
    you are connecting from an IP address that is allowed by the security group associated
    with the instance.

    A successful connection using macOS Terminal appears in Figure 6.37.


    ![](img/f11d8c1d6b76e74ec2235e2ddebf829b_135_0.png)


    Figure 6.37. Connecting to an EC2 instance with macOS Terminal'
