    We now have all the files to run BWA align the FASTQ sequencing reads to the reference
    genome produce a BAM alignment file.

    Set the variables that will be used for calling the BWA program. Our EC2 instance
    has two CPUs, so we tell BWA that there are two CPUs available by setting NCP
    to 2. If you are using your FASTQ sequencing paired reads instead of the ones
    downloaded, then enter them infile1 and infile2. If you have more than one pair
    of FASTQ files, then you will run BWA for each pair, and each BWA will have different
    values for ID (flowcell and lane), PU (flowcell, lane, and/or LB identifier).
    This will allow the future quality scale recalibration step to do a better job.
    If you have only one pair of FASTQ files that contains all the sequencing data
    for the sample, the values in ID, PU, and LB fields are not important given there
    is no need to distinguish between the different FASTQ files from different sequencing
    runs. The SM field contains the sample identifier that will be carried through
    the end of variant processing, choose a value that identifies the sample.


