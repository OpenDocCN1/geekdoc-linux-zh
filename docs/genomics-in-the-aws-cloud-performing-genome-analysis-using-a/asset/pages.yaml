  md: '# Chapter 8 Processing the Sequencing Data


    Decompress the Samtools software and go into the newly created directory of this
    software.

    t - xf samtools-1.16.1.tar.bz2 cd samtools-1.16.1


    Then follow the instructions in the INSTALL file to install the Samtools software.


    ```

    ./configure

    make

    make install

    ```


    To align these reads to a reference genome, we need to get the reference genome.
    Specifically, let''s get the human reference genome GRCh38 (also known as hg38),
    because it is more complete compared to its predecessor GRCh37 (also known as
    h19, and successor of h18). There are two main types of GRCh with multiple alternative
    regions, called alt-contigs, for some of the genomic regions where there are a
    lot of differences found in different people. The other version, the no-alt version,
    doesn''t have multiple redefinitions. We use the no-alt version reference. Let''s
    download it.


    ```

    wget

    ftp://ftp.ncbi.nlm.nih.gov/all/GCA/000/401/GCA_000001405.15_GRCh38/seqs_for_alignment_pipelines.ucsc_ids/GCA_000001405.15_GRCh38_no_alt_analysis_set.fna

    ```


    The programs that will use this reference genome require indices, so let''s create
    them.


    ```

    gunzip GCA_000001405.15_GRCh38_no_alt_analysis_set.fna

    bwa index GCA_000001405.15_GRCh38_no_alt_analysis_set.fna

    samtools fixidx GCA_000001405.15_GRCh38_no_alt_analysis_set.fna

    ```


    Now we have our pair of FASTQ files, a reference genome, the BWA alignment, and
    the Samtools commands to align FASTQ to the reference genome, with the output
    immediately piped to Samtools to compress the output:


    ```

    outputfile=my_fastq.bam

    infile1=my_fastq.R1.fastq.gz

    infile2=my_fastq.R2.fastq.gz

    ref_fasta=ref+GCA_000001405.15_GRCh38_no_alt_analysis_set.fna

    NCPUS=4 # To reduce execution time, use as many CPUs as you have available

    ID=HILLUMINA2AB1C4 # Illumina platform unit, may contain flowcell and lane

    PU=HILLUMINA2AB1C4:MY_SAMPLE_1 # Illumina platform unit, may contain

    flowcell, lane, and sample

    LB=20200101 # library prep id

    PL=ILLUMINA # platform technology used for sequencing

    ```'
