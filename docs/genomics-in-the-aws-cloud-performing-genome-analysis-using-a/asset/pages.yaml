  md: '# Chapter 6 Building Your Environment in the AWS Cloud


    To set up a group, choose Groups from the Access Management menu under AWS IAM.
    Click the Create New Group button, and give your new group name (Figure 6.32).
    We will call our group GenomicsResearchers.


    The next step is to attach policies to the group, which is how we define what
    rights and privileges members have in the AWS account. There are many ways to
    do this, and hundreds of policies are available by default (as, you can create
    more if you want). For the purposes of our undertaking, it''s best to choose Job
    Function from the drop-down list next to the Filter label. You''ll see an example
    of job functions (Figure 6.33).


    ![](img/f11d8c1d6b76e74ec2235e2ddebf829b_131_0.png)


    **Figure 6.32:** Naming your group


    For our GenomicsResearchers group, we choose PowerUserAccess, which lets people
    who are members of the group do many things—but not alter IAM permissions, for
    example. It’s a good balance between giving technical people enough power to do
    their work, while protecting the system from malicious intruders.


    Click the Next Step button, followed by the Create Group button, and you’re done.
    You have created a group into which you can put users.'
