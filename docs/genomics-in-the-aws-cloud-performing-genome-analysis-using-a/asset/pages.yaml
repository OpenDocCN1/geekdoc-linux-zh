  md: '# Chapter 12 ■ Cancer Genomics 287


    # Measuring Tumor Genomic Instability


    We saw that some cancers are caused by mutations in DNA repair genes, whether
    germline mutations (leading to familial cancer predisposition) or, most commonly,
    somatic mutations (progressively developed in the tumor). It is important to identify
    the presence of DNA repair defects as it can change the type of cancer proposed.


    There are two ways of identifying DNA repair defects.


    +   - Finding the exact cause of the defect, such as mutation, aberrant genetic
    silencing, or abnormal regulation of DNA repair genes

    - By analyzing the overall effect of these mutations on the genome, such as specific
    patterns of mutations that accumulate in the genome as a result


    Mutations or silencing of mismatch repair (MMR) genes, such as the MLH1/2/6 and
    PMS1/2 family of genes, result in more errors in the most problematic areas of
    the genome, as as highly repetitive regions of the genome *microatellite regions*.
    These areas are difficult to copy by DNA polymerases during cell replication,
    and defective MMR genes fail to correct copying errors. Microsatellite instability
    (MSI) is most common in colorectal cancer, gastric cancer, and endometrial cancer,
    and makes tumors more susceptible to responding checkpoint inhibitors. We will
    see in this section how to measure the degree of MSI.


    Mutations or aberrations in the homologous recombination (HR) pathway, which largely
    relies on the BRCA1 and BRCA2 genes, causes patterns of loss of heterozygosity,
    large-scale transitions, and telomeric allele imbalances. Patients with cancer
    and defects in homologous recombination can benefit from PARP inhibitors. The
    HR genes are more complex to identify and will not be covered here. For more information,
    look at the HRDetect method implemented in the Signature Lib package at github.com/Nik-Zainal-Group/signature.tools.lib.


    Microsatellite instability can be easily identified from BAM files. We will use
    the popular MicroselliteAnalysis for Normal-TumorStability(MANTIS) package, which
    can be downloaded from github.com/OSU-SRAB/MANTIS.


    First, use the RepeatFinder, which is included in the package, to identify the
    microsatellites of the genome reference and save their coordinates in BED file.


    ```

    /RepeatFinder -i $ref_fasta -o msi_loc.bed

    ```


    Second, use MANTIS to determine the instability score between the germline BAM
    (normal.bam) and the somatic BAM (tumor.bam), using the MSI coordinates calculated
    in the previous step. Specify the number of threads, for parallelized execution,
    with the option --threads.'
