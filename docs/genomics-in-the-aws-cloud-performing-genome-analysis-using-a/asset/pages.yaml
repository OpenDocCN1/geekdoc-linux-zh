    # Summary


    This chapter discussed the process by which we get from raw sequencing data to
    useful information about a genome. We built a pipeline to align a sample to a
    genome reference, refine the alignment data, call variants (SNVs, indels, SVs,
    CNVs), annotate and prioritize the variants, and perform inheritance analysis
    among members family—in an arbitrary Linux environment—and in the AWS cloud seamlessly.


    The next chapter will show how to visualize genome data using a browser. We will
    cover how to visualize the alignments to the reference genome, as well as how
    to integrate public data on additional tracks to get a better understanding of
    the genome.'
