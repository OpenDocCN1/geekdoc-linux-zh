    # Viewing Available Docker Images


    To see which images we have on the local machine, we can use docker images. It
    gives us a list of all the images we have built or downloaded, like this:


    ```

    docker images

    REPOSITORY TAG IMAGE ID CREATED SIZE

    perl latest e92f3ef9fe8db 2 weeks ago 859MB

    docker/getting-started latest 1f32459ef0f38 2 months ago 26.8MB

    hello-world latest bf756b1dae655 8 months ago 13.3KB

    ```


    # Running a Docker Container Interactively


    To run a Docker container (to take an image and turn it into a running container,
    in other words), use this command:


    ```

    docker run -it --rm perl

    ```


    The -it option specifies that you want to run the container interactively (i.e.,
    with a command line) and that there should be a terminal interface to allow you
    to use that command line.


    Figure 10.5 shows the Docker UI updated with the newly started perl container
    running interactively.


    Every container is different and can take its own commands interactively, but
    you can leave the interactive terminal associated with the running container by
    typing the following at the command line within the container:


    ```

    exit

    ```'
