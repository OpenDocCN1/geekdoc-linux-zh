  md: '# Phred Scores


    The characters in the fourth line of a FASTQ sequence description represent quality
    scores. In other words, they represent the probability that the sequencing machine
    correctly identified the nucleotide (A, C, G, or T) it denoted in a given location.


    Ordinarily, a quality or confidence score would be specified as some sort of probability
    or percentage: there is a 99.99 percent probability that the nucleotide has been
    determined correctly, or there is a 90 percent chance that it has been determined
    correctly. In genomics, however, and particularly in FASTQ files, quality is represented
    with a Phred score, also known as a Q score. Why is the Phred score called? It
    was originally calculated by a piece of software called Phred, which implemented
    an algorithm also called Phred. These were developed in the 1990s by a team led
    by Phil Green, a professor at Washington University in St. Louis—so maybe “Phred”
    is easier to say than “Phgreen”? That''s some speculation. The truth seems to
    have been lost to history.) A Phred score is calculated with the following formula:


    ```

    Q = -10 log₁₀ P

    ```


    In the formula, Q is the Phred score, and p is the probability that the value
    is wrong, expressed as a real number between 0 and 1. Let’s work through a sample.
    To express a 99.99 percent confidence that the data is correct, use 0.001 (the
    probability that it is incorrect, or 1 – 99.99) as your value for p.


    ```

    Q = -10 log₁₀ (0.001)

    Q = 30

    ```


    This is fine, except that the value 30 has two characters. In FASTQ, one-to-one
    correspondence between a single nucleotide and its quality score is needed. There
    has to be a way of converting two-place Q scores, such as 30, into a single character.


    By the way, in genomics, a Phred score of 20 or greater, which means there is
    a chance of 1 percent or less that the nucleotide has been named incorrectly,
    is considered good.


    # ASCII Encoding of Phred Scores


    Recall that the American Standard Code for Information Interchange (ASCII) specification
    is a way of encoding printable and other characters with bytes of data. It is
    very limited—it doesn’t support accented characters, let alone non-Latin character
    sets—and has been supplanted in most modern situations by the more capable Unicode
    standard. ASCII works well in this corner of genomics,'
