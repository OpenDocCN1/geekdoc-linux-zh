    We can see that all the reads have an orientation, pointing to the left or to
    the right. This window was sequenced with the very prevalent technique of paired-read
    sequencing, meaning the DNA fragments were sequenced on both ends (see 9.18).
    Read 2 is paired with read 1 and is said to be the mate of read 1. Both reads
    are facing inward, and the middle part of the DNA fragment is left unsequenced.
    The paired reads are separated in the IGV tracks in order to maximize space. We
    can, however, request to view the reads as pairs by right-clicking the reads track
    and selecting View As Pairs.


