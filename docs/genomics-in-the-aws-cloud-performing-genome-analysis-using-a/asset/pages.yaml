  md: '# Containerizing Your Workflow on the Desktop


    This chapter will teach you about containerization, which is a way of stripping
    your applications down to their essentials and running only those key parts as
    an easily managed module—a container on a host computer. When you use flexible
    and scalable AWS services to run that host computer, you can have a very powerful
    genomics working environment to use at minimal cost.


    # Introducing Containerization


    At one time, long ago, your only option for running applications was a physical
    server of some kind. Whether it was on your premises or hosted in a data center
    or some other way, there had to be a physical box with one or more physical processors,
    some memory, and some storage. This was an inefficient approach to the problem
    of providing applications. It was deviously hard to strike a balance between making
    maximum use of expensive hardware (depreciating in value all the time) and having
    enough application capacity to handle surges in demand. One was either wasting
    capacity or annoying application users with setbacks in performance and availability.

    Virtual machines (VMs) provided an intermediate solution. With virtual machines,
    you could have images of applications stored as large files. These images contained
    all the information about the server that was required to run an application.
    They included an operating system, all the application software,'
  merge: -1
  pgno: 262
- img_proc: true
  md: 'and all of its dependencies. The image files could then be loaded by a virtual
    machine management application, the function of which was to share the physical
    resources of a computer across multiple virtual machines running on it. The virtual
    machine management application had responsibility for keeping track of memory
    regions across all its hosted virtual machines and for sharing access to common
    resources, such as network.


    With virtual machines, you still had to have hardware (local or hosted). The difference
    was that you could allocate limited hardware (running the virtual machines) differently
    across the population of virtual machines (running applications). It was possible
    to spin up more of one kind of virtual machine and fewer of another to take care
    of situations in demand for one kind of application grow and demand for another
    embedded.


    The hardware, in a VM setup, is virtualized. A special software layer called a
    supervisor manages the sharing of the hardware across all of the virtual machines
    running under it. Figure 10.1 is a graphical representation of several virtual
    machines, each sharing the host machine''s hardware and with its own operating
    system, running on a single hardware platform.


    # Virtual Machines


    ![](img/f11d8c1d6b76e74ec2235e2ddebf829b_263_0.png)


    Figure 10.1: Virtual machines each have their own operating systems.


    Amazon EC2 (and other, similar services) probably represent the ultimate evolution
    of the virtual machine idea. Not only does EC2 support images that can be stored
    as files (AMI images) and brought online as live virtual machines as required,
    but the whole infrastructure for hosting virtual machines is abstracted'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# Chapter 10  Containerizing Your Workflow on the Desktop 237


    from the AWS user''s point of view. Otherwise, there are physical machines running
    EC2 instances in AWS data centers, but the average person who brings up EC2 instance
    via the AWS console or command line is not (indeed, cannot be) concerned with
    how that works behind the scenes.


    Because the hardware EC2 instances is abstracted to the user, users can treat
    it as a resource to draw on as required. If your application needs more computing
    power, just request more—budget will almost certainly run out before the supply
    of AWS computing power is exhausted. You can even set up your applications so
    that they scale automatically, bringing additional or larger EC2 instances online
    to run your application as dictated by demand.


    EC2 has its drawbacks, for one thing: EC2 instances are servers, which means they
    have to be managed. While AWS takes care of the infrastructure runs, you still
    have to concern yourself with everything inside the image, including the operating
    system. That means it is your responsibility to apply all patches related to security
    and everything else. Putting patches in place, and making sure they don''t miss
    up the functionality of your application, is your time-consuming responsibility.
    Don''t forget that operating systems sometimes have licensing costs.


    As well, EC2 servers can waste capacity. Even if your application is running on
    a small instance during a period of low demand, it is still rising up costs nonstop.
    The cost of running a t3a.small instance in us-west-1 (California) at this writing
    is on the order of USD $30 per month—not huge, but enough to add over time.


    What we want is something more resource- and cost-efficient than scalable EC2
    virtual machines. We want to define an application in its purest, simplest form
    and then run that minimal in the most efficient way possible. We want to be able
    to put large amounts of computing power behind that application instance when
    it is required and put almost no resources into running it when the low demand
    allows for it.


    This is the purpose of containers. Containers—there are many kinds, but Docker
    is the facto standard—implement what is OS-level virtualization, which is to virtualization
    of applications at the level of the operating system. One instance of an operating
    system can run many different containers. Applications running inside the containers
    “perceive” that they are running on their own computers with processors, memory,
    peripherals, and storage. In fact, physical resources (and the operating system
    on top of them) are potentially shared across many containerized applications.


    Figure 10.2 shows a series of containers running as processes on a single operating
    system. The containers do not have their own operating system instances and do
    not share the host''s hardware resources.'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# Containers


    ![](img/f11d8c1d6b76e74ec2235e2ddebf829b_265_0.png)


    Figure 10.2: Containers have their own configurations on top of the host''s operating
    system.


    The following are the advantages of containerized architecture:


    +   - Simplicity: Once you have defined a Docker image—more on what is involved
    in the next section—you can pass it to someone else (or deploy it to a more capable
    environment) easily makes it easy to collaborate with others on the development
    of an image, and similarly to deploy a container described by an image locally
    for development, and into the AWS cloud when more computing power is needed.


    +   - Flexibility: You can do anything you want with a Docker image, unconstrained
    by hardware or other limitation.


    +   - Comprehensiveness: A container represents a closed universe. Everything
    that is required for a container to do what it demands to exist within that container.
    There is no need, when transferring an application from one computing environment
    to another, to make sure that dependencies are aligned, that there are no version
    conflicts, or that kind of thing. Give a container to someone else, or transfer
    it from your laptop to the AWS cloud, and expect it to do the same thing, with
    no surprises.


    +   - Speed of start-up: While it is not so much of an advantage in genomics analysis
    work, containers start up faster than virtual machines. This means that in providing
    a service that has to respond to quickly evolving peaks and troughs in demand—think
    of a multiplayer, networked video game or something that has to react quickly
    to extreme changes in financial trading volumes—it is easy, and quick, to spin
    up containers on demand. Similarly, it is easy to take containers offline when
    demand for their services goes down.'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# Chapter 10 目 Containerizing Your Workflow on the Desktop 239


    A limitation of OS-level application virtualization is that a given operating
    system cannot host a container running another operating system. The containers
    must be set up with the operating system of the host machine on which they are
    running. While a Linux server running containers can handle containerized applications
    based on other Linux distributions, it is not possible to run containers that
    expect a Windows environment.


    Now, think about combining the advantages of containers (simplicity, ease of deployment,
    straightforward management) with the advantages of virtual servers (such as those
    on AWS). That combination yields the ability to scale the resources of the host
    operating system and down infinitely, while allocating those resources to multiple
    containerized applications in a way that matches their individual requirements.
    It would be possible to replicate a single container across multiple virtual host
    servers for redundancy. This is exactly what happens with the various AWS container
    management services, and this chapter will show you how to use them in your genomics
    applications.


    # Understanding and Using Docker


    Docker is one of many implementations of OS-level virtualization (others include
    LXC and Solaris containers, as well as chroot “ails” that allow processes to be
    given constrained environments as far back as Version 7 Unix in the late 1970s).
    It represents the de facto standard in this technology and is the basis for all
    AWS container management services.


    A Docker image is a fixed file that defines a container, while a Docker container
    is a running instance of an image. You can think of the relationship between a
    Docker image and a Docker container analogous to a Java class and an instance
    of that class. Figure 10.3 shows the relationship between a Docker image and containers
    that are spawned from it.


    ![](img/f11d8c1d6b76e74ec2235e2ddebf829b_266_0.png)


    Figure 10.3: A Docker image can spawn many (potentially slightly different) containers.'
  merge: -1
