  md: '# Chapter 7 Linux and AWS Command-Line Basics for Genomics


    The -z option says we want to create a compressed archive with gzip. Note that
    the file extension of the compressed archive can be either .tgz or .tar.gz. To
    extract, replace the option -c with the option -x (extract).


    ```

    $ xvfz /data/proteinwork.tgz

    ```


    tar can use bzip2 instead of gzip for compressing the archive. bzip2 achieves
    about 15 percent higher compression rates than gzip but is slower. It can be invoked
    with the -j option. The file extension of the compressed archive can be bz2, tb,
    or bz2.


    ```

    $ tar cvfj /data/proteinwork.bz2 -/proteinwork # archive andncompress with bzip2

    ```


    ```

    $ tar xvfj videos-14-09-12.tar.bz2. # extract and

    decompress

    ```


    # Compression


    Compression is a computational technique that reduces the amount of space required
    to store data. Usually, this is done by replacing strings of bytes many times
    in a data set with a small representative symbol that takes up less storage space.


    The Linux utilities gzip (decompression utility: gunzip; file extension .gz) and
    bzip2 (decompression utility: bunzip2, file extension .bz2) compress individual
    files.


    ```

    $ bzip2 AAA.bam

    ```


    The zip program is available on several operating systems and can create archives
    like tar.


    ```

    $ zip myzip.zip file1.txt file2.txt # compresses the 2 files into a

    single file myzip.zip

    $ zip -r myzip.zip mydir # compresses the contents of

    directory mydir into

    # myzip.zip

    ```


    Note that compressed files can be visualized without decompressing them, by using
    the zcat command. Other commands work on compressed files, such as zless, zmore,
    zgrep, or the utilities zdiff and zcomp, which compare files. These commands are
    referred to as Z commands and simplify our lives by decompression files temporarily
    in the temporary storage directory /tmp.


    ```

    $ zcat AAA.fastq

    ```'
