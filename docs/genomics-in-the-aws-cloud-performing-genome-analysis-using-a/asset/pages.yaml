  md: '# Chapter 7 Linux and AWS Command-Line Basics for Genomics


    AWS CLI commands are nested. In other words, the leading commands determine which
    following commands you can use. All command sequences begin with the following:


    ```

    aws

    ```


    After that, you specify which AWS service you want to work with. For example,
    you would enter the following to work with DynamoDB databases:


    ```

    aws dynamodb

    ```


    And you would enter the following to work with EC2 instances:


    ```

    aws ec2

    ```


    From there, you specify further subcommands, followed by parameters that designate
    specifically the string of commands and subcommands are to be carried out. To
    start an EC2 instance, for example, you would enter the following:


    ```

    aws ec2 start-instances --instance-id <The instance ID(s) of the instance(s) you
    want to start>

    ```


    Once you are within the CLI environment, you may not be sure what to enter next.
    Entering help rather than "actual" command or parameter should give you a listing
    of all possible options, with a short explanation of what each option does.


    # An Alternative Approach: AWS Systems Manager


    If you prefer not to install the CLI on your local machine or if you do not have
    one available for some reason, you can use AWS Systems Manager instead. There
    is a lot to learn about this tool—you will find that documentation refers to it
    as AWS SSM for some reason—than the command line, but it allows you to log into
    the AWS Console and issue many of the same commands you use at a local instance
    of the AWS CLI.


    To access AWS SSM, go to the AWS Console and choose it from the list of available
    services. From the SSM main page, choose the Quick Setup option, which will identify
    all EC2 instances, and other AWS resources, that are associated with your AWS
    account.


    On the left side of SSM environment, choose Run Command and click the Run Command
    button. Choose the command you want to run from the list of available commands—it
    is not as comprehensive as the set of commands from the AWS CLI package you can
    install on your own machine—and specify any required parameters. Click Run, and
    observe as SSM monitors the command as it runs.'
