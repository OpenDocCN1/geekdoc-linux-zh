  md: '# Chapter 5 AWS Services for Genome Analysis 71


    There’s no operating system within a container, they are so much “lighter” than
    full virtual machines.


    Containers are not unique to AWS—they are generic technology that can be used
    in a variety of ways. The central technology of modern containerized software
    is (as you would expect) the container, which is ultimately a file format. Among
    modern container designs is Docker, an open-source specification for virtualization
    and the operating system level. (Docker is not the only container specification,
    and it is in fact based on other specifications like LXC and runC, but it is the
    most widely used.) To be precise, Docker is both a specification and a company—Docker,
    Inc.—that offers products (all with the Docker name) that implement the Docker
    standard. Some of its products are free; others have costs associated with it.
    It can be more than a little confusing,


    The Docker standard allows a single OS instance—a Linux server, to create a simple
    sample—host multiple Docker containers. Each of the containers is an insular world
    unto itself, away of the computer it is running with no notion of any other containers.
    Note that the containers are not virtual machines, because they do not contain
    the OS or any virtualized CPU or RAM, the way a VMware or EC2 instance does. You
    can say that containers are virtualized at the OS level, rather than at the hardware
    level. This makes them smaller, more portable, and generally more efficient.


    On the other hand, containers don’t have guaranteed resources, the virtual machines
    do not. If you set up a VM, say in EC2, and say that it has 8 GB of RAM, how much
    RAM it will. If you put several containers on a host and that host has however
    much RAM it physically has, then the containers need to physically limit resource.
    An important trade-off for the “lightness,” portability and simplicity of containers
    is the lack of guaranteed resources.


    Once you have containerized software, you need a way to run it. In the simplest
    case, on a single physical server, you might set up a series of Docker containers—for
    example, one for a web server, one for business logic, and for database work in
    a multitier application. You then need a way to run these containers and have
    them talk to each other in a predictable and controllable way. This is the function
    of the Docker Engine (a product of the Docker company, in both free and paid versions),
    which coordinates the running of containers. How it works on a single server,
    and it is probably how you will set up your development machine.


    Things become more complex when you need to coordinate the running of containerized
    software across multiple servers—a cluster. Coordination requires taking multiple
    pieces of hardware, with disparate capabilities, and managing the operation of
    multiple containers across them. Load will be spread across all available computing
    resources in such a way that no item of hardware is overworked, and all containers
    enjoy the highest possible performance. There needs to be a way to simulate IP
    networking, with'
