  md: '# Chapter 7 Linux and AWS Command-Line Basics for Genomics 137


    # macOS and Linux


    To install the AWS CLI under Linux, Unix, or macOS, go to the operating system''s
    command line and enter this:


    ```

    curl "https://s3.amazonaws.com/aws-cli/awscli-bundle.zip" -o "awscli-bundle.zip"

    ```


    This downloads the AWS CLI configuration package from AWS. Then, use the unzip
    command to unzip the downloaded file.


    ```

    unzip awscli-bundle.zip

    ```


    With that done, you can enter this last command to actually run the installation
    script:


    ```

    sudo ./awscli-bundle/install -i /usr/local/aws -b /usr/local/bin/aws

    ```


    Note that the sudo command will prompt you for the machine''s administrative password.
    Having that done, and with the installation of the AWS CLI complete, you can verify
    that it works as expected with the aws command.


    ```

    aws --version

    ```


    The command line should return information about the versions of AWS, Python,
    and Windows, something like this:


    ```

    aws-cli/2.0.12 Python/3.7.4 Darwin/19.5.0 botocore/2.0.0dev16

    ```


    # Configuring the AWS CLI


    The most basic task is connecting to the AWS instance you want to operate upon.
    You will recall that the Access Key ID and Secret Access Key were created when
    you set up your account and configured IAM roles and users. You set up users and
    also use programmatic access, the latter of which is Access Key IDs and Secret
    Access Keys into the picture. You should have saved both values in a safe location
    when you created them. If you did not, you will need to create a new Access Key
    ID and matching Secret Access Key. That is because the Secret Access Key cannot
    be viewed, other than one time immediately after it is created. If you do not
    have the Secret Access Key for your account, you want to access via the AWS CLI.
    Go back to Identity and Access Management (IAM). There, you should delete any
    key sets for which you have lost the Secret Access Keys (those combinations cannot
    be used) and create a new one for your use at the AWS CLI.'
