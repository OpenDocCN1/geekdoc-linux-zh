    # Shutting Down an Instance to Save Money


    When you are not using an EC2 instance, you should shut it down so that you are
    not billed for running time. This is easy: simply go to the EC2 instances in the
    AWS Console, select the one you want, and choose Stop from the Actions menu (as
    shown in Figure 6.18). Do not choose Terminate that will delete the instance and
    you would have to re-create it to use it again.


    ![](img/f11d8c1d6b76e74ec2235e2ddebf829b_118_0.png)


    Figure 6.18: Stopping an instance to save running costs


    When an instance is in the Stopped state, you will still pay for its storage volumes
    but not for the computing power of the instance itself.


    # Setting Up S3 Buckets


    In almost any application, you''ll need to set up Simple Storage Service (S3)
    buckets for the purpose of storing input and output data. S3 is one of the oldest
    and most mature of the AWS services, and is easy to set up S3 buckets.'
  merge: -1
  pgno: 118
