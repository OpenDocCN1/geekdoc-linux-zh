  md: '# Chapter 11 | Variants and Applications 253


    The input single allelic file includes only the alleles specified in the PGS scoring
    file. We used the default threshold of 0.1 for hard calls.

    The output is a set of PLINK files.


    +   - File with extension pgen: Individual identifiers (IDs) and genotypes

    - File with extension pvar: Information on SNVs

    - File with extension psam: Information on the individuals

    - File with extension afreq: Allele frequencies


    To ensure good practices, PLINK requires a SNV quality control file and a sample
    quality control file to be able to calculate the PRS score.

    Let''s perform quality control on the SNVs and the snvQC file. We exclude the
    ambiguous SNVs and the SNVs with less than 0.3 imputation information.


    ```

    plink2 --pfile raw \

    --memory 16000 \

    --exclude clrrsIDs.ambiguous.txt \

    --extract-col-and test.tsv 9 10 \

    --extract-col-min 0.3 \

    --maf 0.005 \

    --write-snvplist \

    --make-pgen \

    --out snvQC

    ```


    Similarly, we perform quality control on the sample to analyze, by only keeping
    samples to a list of individuals (samples-that-passed-QC.txt) that passed criteria
    such as no discordance or unrelated individuals.


    ```

    plink2 --pfile raw \

    --memory 16000 \

    --extract snvQC.snvplist \

    --keep-fam samples-that-passed-QC.txt \

    --write-samples \

    --out samplesQC

    ```


    We are now to calculate the PRS, which is computed as follows:


    > PRS = \sum_{i=0} \beta_i * dosage / P * M


    where P is the ploidy (2 for humans) and M is the number of nonmissing SNVs in
    the studied individual.


    ```

    plink2 --pfile raw \

    --memory 16000 \

    --extract snvQC.snvplist \\

    ```'
