  md: '# CHAPTER

    11


    # Variants and Applications


    In this chapter, we look at some applications of the analysis of genomes. We first
    investigate polygenic risk scores, which capture the additive effects of thousands
    of variants to influence our complex traits. We then extend our study to metagenomics
    and explore how metagenomics can be applied to human samples.


    # Polygenic Risk Scores


    We know from twins studies that certain traits and health conditions are highly
    hereditary. Studies of identical and fraternal twins suggest, for example, that
    up to 80 percent of height variation is genetic. However, as the determination
    of height involves many variants along the genome, up to recently only 5 percent
    of height heritability could be explained. This paradox is referred to as the
    missing heritability problem. Rare diseases are often caused by a defective gene;
    in contrast, many traits and most common diseases are caused by hundreds or thousands
    of genetic variations.


    # Genome-wide Association Studies


    Finding these causal variants requires undertaking large studies called genome-wide
    association studies (GWAS), which look for associations between traits and genetic
    variants, in other terms, associations between phenotype and genotype,'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# Chapter 11 = Variants and Applications


    in a population. Although GWAS can study copy number variants or other sequence
    variations, most GWAS focus on single nucleotide variants (SNVs). GWASs were performed
    from microarrays in the past and are currently conducted by WES or NGS. There
    are about one million independent common variants along the genome. A lot of statistical
    tests must be performed, which must be corrected for multiple hypothesis testing.
    To achieve statistical significance, GWAS need therefore to be conducted on large
    cohorts, sometimes hundreds of thousands of people, or aggregate a large number
    of studies (metastudies).


    Initial GWAS studying height identified 40 genetic variants that could explain
    5 percent of height variation. In 2018, a global consortium claimed a GWAS on
    700,000 people found 3,300 genetic variants accounting for 25 percent of height
    variation. In 2020, the same consortium aggregated DNA information from 4.1 million
    individuals to identify 9,900 variants the height is still not fully accounted
    for, this endeavor highlights the incredible complexity of many traits and most
    common diseases, as well as the multiplicity of causal variants with each a very
    small effect.


    More than 5,700 GWAS have been performed so far,3,000 traits. GWAS have historically
    focused on populations of European ancestry, and the findings are less applicable
    to other ethnicities. However, a growing number of GWAS now focus on other ethnicities.


    Interestingly, while GWAS sometimes identified genetic variants in genes or regulatory
    areas, the majority are located in noncoding regions. This is quite humbling.
    We know that DNA can fold into large regions of the genome to contact and allow
    these remote regions to act as enhancers and regulate the transcription of genes
    located far away. However, we lack a mechanism to explain nature of the GWAS-identified
    noncoding variants.


    Some SNVs are known to affect the expression of mRNA and are referred to as eQTL
    loci. Many studies have used eQTL analysis to explain the results of GWAS. Comprehensive
    catalogs of eQTL are available for many tissue types (remember, mRNA expression
    is tissue-specific). The Genotype-Tissue Expression (GTEx) is the largest resource
    with eQTL catalog for 49 tissues; it is available at gtexport.org. The eQTL Consortium
    identified the eQTL derived from the blood samples of about 30,000 individuals
    (www.eqtlgen.org).


    GWAS have attracted critics as it implicate so many genetic variants for common
    diseases that it appears difficult to use the findings to make treatments to help
    patients. GWAS helped discover some biological mechanisms behind certain conditions,
    such as autophagy in Crohn’s disease and the complement pathway in subtypes of
    macular degeneration and schizophrenia, though it has not led to new treatments.
    The genetic variants uncovered by GWAS are,'
  merge: -1
  pgno: 277
- img_proc: true
  md: 'however, widely used to predict traits and risks of common diseases using polygenic
    risk scores.


    # Calculating a Polygenic Score


    Polygenic risk scores (PRSs), also called polygenic scores (PGSs) or genomic scores,
    predict phenotypes, such as a trait or disease. How are they calculated? The results
    of GWASs consist of a list of genetic variants (alleles at particular loci on
    the genome) with an effect size for each variant. The polygenic risk score is
    calculated by computing the sum of risk alleles a person has, multiplied by their
    corresponding effect sizes as a weighted GWAS on the phenotype.


    ```

    PRS = \sum_{i=0}^N \beta_i * dosage;

    ```


    N is the number of genetic variants or SNVs in the score, $\beta_i$ is the effect
    size (also called *beta*) of the variant $i$, and dosage $i$ is the number of
    copies of SNV in the studied person.


    A catalog of polygenic risk scores is available at www.pgscat.org and currently
    contains more than 2,600 polygenic scores for nearly 550 traits.


    Are the polygenic risk scores accurate? We saw that we can explain half the heritability
    of height, though it has been the focus of many large studies. In addition, complex
    diseases are the result of a combination of genotype and environmental factors.
    So they are indicative and work best when combined whenever possible with environmental
    factors.


    Polygenic scores can be calculated by software dedicated to calculating scores,
    such as PRSice, LDpred, JAmpred, PRS-CS, or lassosum, or generic tools for genomic
    analysis such as the popular PLINK or bsqnir. We will use PLINK 2.0.


    Let''s install PLINK 2.0.


    ```

    > wget https://s3.amazonaws.com/assets/alpha3/plink2_linux_avx_20220603.zip

    > unzip alpha3/plink2_linux_avx_20220603.zip

    ```


    Select a PRS from the PGS Catalog or from the supplementary information of a publication.
    Carefully consider the units used to measure the phenotype of interest, the confounding
    factors, the ethnicity of the cohort, and the predictive capability of the PRS.
    The PRSs are commonly evaluated using the pseudo-$R^2$, which corresponds to the
    amount of phenotypic variance explained by the PRS.'
