    contain a repeat of the label that appears in the first line. However, this second
    appearance of is usually omitted in the interest of keeping file size down.

    The fourth line comprises a series of characters, each of which represents the
    quality of the corresponding data in the second line. Each character represents
    the probability that the nucleotide in the second line was correctly determined
    by the sequencing machine. The details of exactly how the encoding works appear
