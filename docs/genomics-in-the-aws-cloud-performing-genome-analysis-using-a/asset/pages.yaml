    # Trio Analysis and Inheritance Analysis


    Sequencing trios, such as parents and child, provide greater analysis power as
    we can select the variants present in the individual(s) with a medical problem
    and exclude the variants from unaffected family members. This is a powerful way
    to narrow down candidate variants causal for a medical problem. Bioinformatics
    teams have different methods for carrying out trio analysis. The VPOT software
    is an easy-to-use and easy-to-run software that can carry out inheritance modeling
    trio on a VCF file containing variants of family members.


    The VPOT software can analyze the following inheritance models:


    +   - Autosomal dominant (AD): The child and one of the parents are affected by
    the genetic disease, while the other parent is not affected. This inheritance
    model occurs when the gene variant is able to cause the disease even when it is
    present on only one of the chromosomes and not be dominant either on the mother''s
    side (the mother has the variant and the disease) or on the father''s side (the
    father has the variant and the disease). Huntington''s disease is an infamous
    example of an autosomal dominant inheritance pattern.


    +   - Autosomal recessive (AR): The child is affected, but neither of the parents
    are affected; however, both parents are carriers. This inheritance model occurs
    when the gene variant is able to cause the disease only when it is present on
    both chromosomes. The parents each have one copy of the variant and their other
    chromosome does not. The child, when inheriting one copy of the gene from the
    mother and the other copy from the father, unfortunately inherited the variant
    from each parent. Usually this renders the gene nonfunctional, so the child has
    no functioning copy of the gene. The parents each have one functioning copy and
    one defective copy of the gene, so they don''t have the disease. Cystic fibrosis
    is an infamous example of the autosomal recessive pattern.


    +   - Compound heterozygous (CH): This is similar to autosomal recessive except
    that it involves different variants in the same gene. The parents each have one
    variant in a given gene that renders the gene nonfunctional, but they don''t have
    the same nonfunctional variant. The parents are unaffected because they each have
    one remaining good copy of the gene.'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'child, however, has unfortunately inherited the variants from the parents,
    resulting in two different defective variants in the same gene, resulting in the
    child being affected by the disease. Cystic fibrosis is also an example of the
    compound heterozygous inheritance pattern.


    +   - De-novo (DN): In this inheritance pattern, a de-novo variant has spontaneously
    in the embryo the child having a deleterious variant that neither parent has.
    The child is affected by the disease while the parents are not. There are 40 to
    80 de-novo variants in each embryo and Usually they occur in a region of the genome
    that do not cause a problem, and most newborns are not born with a genetic disease.
    Sometimes, a child is unlucky that a de-novo variant causes a disease.


    +   - Case-control (CC): In this scenario, there are family members with the disease
    and family members without the disease, and thus a genetic mutation is running
    through the family. These family members unlucky enough to receive one copy of
    the variant are affected by the disease. In this analysis, VPOT lists all the
    variants that are in all of the affected individuals and are not in any of the
    unaffected individuals. This analysis is carried out when we have the sequenced
    variants of other family members, who may or not have the parents'' sequenced
    variants to include in this analysis.


    If you are analyzing a trio case where the child is affected and the parents are
    not, then VPOT inheritance models for AR, CH, and DN are appropriate. If you are
    analyzing a trio where one of the parents is affected in addition to the child,
    then the AR model is appropriate. If you have an assortment of affected and unaffected
    members from an extended family (perhaps the parents'') DNA is not available,
    but DNA from cousins is available), then the VPOT CC analysis is helpful.


    To carry out VPOT inheritance modeling, we need to specify the pedigree, that
    is, how the sequenced individuals are related to each other, and who is affected
    by the disease. VPOT’s pedigree file format is the same as that used for the GATK
    software. It is tab-delimited, and the columns are the following:


    +   - Family ID


    +   - Individual ID


    +   - Paternal ID (if you don’t have the paternal sample for this individual,
    then put ND)


    +   - Maternal ID (if you don’t have the maternal sample for this individual,
    then put ND)


    +   - Sex (1=male; 2=female; other=unknown)


    +   - Phenotype (1=unaffected; 2=affected)'
