  md: '# Reference Genomes


    What, then, is a reference genome?


    A reference genome is a “standard” sequence of nucleotides, representing a single
    species, published and made available for comparison against other individual
    genomes. Generally, a reference genome represents some of compilation of several
    individuals. Several genomes are combined to prevent a bias from emerging with
    respect to what characteristics are “normal” within the species. The current reference
    genome consists of a mosaic of genomes from more than 10 anonymous individuals,
    males and females, though the main contribution comes from a man of African-European
    heritage referred to as RP11.


    The genomes of all healthy humans include two copies of each autosome (that is,
    chromosomes 1 through 22) and two sex chromosomes in females and one, X and Y.
    In contrast, a reference genome includes only one copy of each autosome as well
    as one copy of X and Y—that’s a total of 24 reference chromosome sequences.


    As of writing, the latest human reference genome is called Genome Consortium Human
    Build 38 (GRCh38), which was released in December 2013. Beyond that, there are
    more updates to the reference genome, and the most recent of them is Patch 14,
    released in February 2022—so the full name of the current human reference genome
    is GRCh38p14. It contains just over three billion nucleotides (with gaps) and
    just under three billion gaps. More than half of the genome is in continuous sequences
    (contigs) than 24 chromosomes, being the 22 autosomes and the two different sex
    chromosomes, X and Y.


    As well, GRCh38 includes sequences of mitochondrial DNA (mtDNA). Recall from earlier
    in this book that mitochondria is passed exclusively from mother to child and
    is therefore an essential tool in the study of population genomics—and by extension
    the migration of populations around the world, which is relevant to anthropology.


    Prior to GRCh38 was GRCh37, which the Genome Consortium (GRC) released in February
    2009. Some databases still refer to GRCh37, but have migrated, or are in the process
    of migrating, to GRCh38. The newer genome has a better coverage of the human genome
    than the older reference GRCh37 and in particular now includes sequences of the
    centromere region of the chromosome attached to fibers during mitosis). It also
    includes many additional sequences (called alternate contigs, or alt-contigs)
    corresponding to areas of high variability among individuals, in particular areas
    related to the immune system, and with fewer gaps than the previous version (about
    500 gaps'
