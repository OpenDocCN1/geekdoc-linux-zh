  md: '# Processing Nucleated Cells


    The next step in processing a sample of biological material into data that can
    be manipulated by a computer is to process the cell into DNA, as pure as possible.
    Simply put, this is a process of breaking open the cells and their nuclei then
    washing away all the miscellaneous cellular material, leaving only DNA.


    You can think of cells as waxy bags filled with fluid. The cell membrane—the outer
    boundary of the cell—is formed by a double layer of molecules called phospholipids,
    each of which has a hydrophilic head and a hydrophobic tail. They arrange themselves
    to tail, with the water-loving heads pointed outward or toward the cytoplasm that
    fills the cell.


    Within the cell membrane, in the cytoplasm, various structures exist: the mitochondria,
    the ribosomes, the Golgi apparatus, and so on. Also in the cytoplasm is the nucleus,
    which is another balloon, with two walls (each with two layers of phospholipids
    arranged to tail). The chromosomes, made of histones and tightly coiled DNA, sit
    within the nucleus.


    To get at DNA, we must break down the cells physically—open the cellular bags
    to release the genetic material in a process called lysis. There are many ways
    to do this, but it''s most often by physical means—simply putting the cells in
    what is basically a blender or grinding them with a mortar and pestle. lysis can
    also involve detergents. (After all, the goal is to break down the fatty cell
    walls, unlike what happens when you remove grease from dishes and utensils.) An
    enzyme called Proteinase K can help melt down cellular structures.


    The next phase in purifying DNA is to take the cellular mash and process it further.
    First, positively charged sodium ions are added to the material and mixed well.
    The positive ions attach themselves to the DNA molecules, which carry a negative
    charge. Neutralizing the DNA makes it more chemically stable and less soluble
    in water.


    A cold alcohol (usually ethanol or isopropanol) is added to the cellular material.
    With mechanical manipulation (i.e., stirring), the DNA will precipitate out of
    the rest of the mash—it can be visible as string, white material—and can be removed
    from the rest of the matter with a pipette. Further rinsing with alcohol needs
    to be washed away other cellular debris.


    Finally, the clean DNA is put into storage, slightly alkaline water for short-term
    storage and further examination.


    # FASTA Files


    The output of a sequencing operation, in its simplest form, is a FASTA file. A
    FASTA file—the name derives from an old piece of software and doesn''t really
    stand for anything—is a file that contains a sequence of nucleotides (A, C, G,'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'and T). In fact, the FASTA format has applications beyond nucleotides and can
    be used to encode information about amino acids and proteins, but we''ll focus
    on its applications in recording genome sequences.


    A FASTA file is a text file encoded as ASCII text, which makes it easy to manipulate
    with UNIX shell tools and other text-manipulation software (such as Perl, Python,
    and anything that implements regular expressions).


    The FASTA format is straightforward. For each sequence, there is a header line
    that begins with a > character. After that, the sequence itself appears as a series
    of ASCII characters (just the four of them in the case of nucleotide sequences).
    Here''s a sample from a human genome:


    ```

    > chr1

    GTGTGGTGCAGCAGCCCCACCTGTGCAGCTGGACACTGCGCCGCCTTGCTCTACAAGTAGCT

    GCGGATATA

    AGGGACACCCCGAGATCTGTTTGGTTAGCTAGACCTCTAATATGGATTCCGGTTTAAAAA

    GTAAAAAATA

    AATATATTTTTATGTTGACTGTATTACATCCAGATCTAGTGCTGTGTGTCCACCAGCTAGCTTAGA

    ATGCGGCTT

    TCTCCCAAGTGTTGTACTATTTGGATTTCCAGTGCTCAAGACCCGGATCTCTTATTTAG

    TTTGGCGTC

    GGGCGGGCGTGTATTTTTTAAACTTCCAGATGATTTTGGTGCATGCGCGGT

    ```


    (In some FASTA files, the sequence is broken into 80-character rows, but that''s
    not required by the format specification and it is always the case).


    The problem with FASTA files is that, in most cases, every nucleotide in every
    sequence is not 100 percent authoritative (reference sequences being a notable
    exception). For that reason, we need a way to attach a description of quality
    to each nucleotide. That''s the purpose of the next file format we cover in this
    chapter: FASTQ files with quality information, also known as FASTQ files.


    # FASTQ Files


    Files in the FASTQ format are essentially the raw data that results from a modern
    genome sequencing operation for anything other than a reference genome. They are
    the output of a sequencing machine, such as those from Illumina and Oxford Nanopore.
    A FASTQ file is where "wet lab" processes end and manipulation of genetic information
    by computers.


    A FASTQ file contains sequences of letters representing nucleotides (A, C, G,
    and T), a quality score for each letter, and labeling information. The quality
    score is necessary because the sequencing process is imperfect. For a given nucleotide,
    the sequencing machine is making a “best guess” as to what that nucleotide really
    is. The guess is considered better if the conditions under'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# Chapter 4 The Bioinformatics Workflow 43


    which the guess (or “call”) was made closer to ideal, and alike is deemed worse
    if the conditions were less good.


    Quality is the probability that a given read is correct. It is determined by the
    sequencing machine, which looks at the images of genetic material used to make
    a decision about whether a given nucleotide was A, C, G, or T. It considers the
    resolution of the image and also its sharpness. A high-resolution image with strong
    sharpness can be relied upon better to get a correct read, so a nucleotide determined
    with such an image would be assigned a Phred score. A low-resolution image, or
    one with poor sharpness, could not be relied on much, so a nucleotide associated
    with an image like that would get a low Phred score. The actual algorithms used
    to evaluate image quality and assign a corresponding quality score are proprietary
    to the machines of sequencing.

    FASTQ files are ASCII-encoded files, which makes it easy to manipulate using regular
    expressions, standard command-line tools, and languages such as Perl, Python,
    Ruby, and R. The format evolved from an older standard called FASTA, discussed
    earlier in this chapter, allowed sequences to split across multiple lines to accommodate
    the limitations of older computing equipment. FASTQ files, in contrast, have exactly
