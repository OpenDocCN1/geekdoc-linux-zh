    12

    Cancer Genomics


    In this chapter, we discuss the analysis of somatic mutations, which are mutations
    we develop across our life span. By far, the most studied somatic mutations are
    the mutations found in cancerous tumors, so we named this chapter "Cancer Genomics."
    However, the workflow presented in this chapter could also be applied to any tissue
    in the body, such as the analysis of your sun-damaged skin (provided you are willing
    to submit yourself to a punch skin biopsy) or the analysis of a benign polyp of
    your cat.


    # Somatic Genomes


    As we age, our genome accumulates mutations and diverges from our birth genome.
    As mentioned in Chapter 2, our birth genome, derived from the fusion of the germ
    cells of our parents, we call our germline genome. Across our life span, our cells
    acquire mutations through replication errors or environmental factors such as
    UV rays, tobacco, toxins, or viruses. These acquired mutations are called somatic
    mutations, and by definition they affect only certain cells of our body.


    This is the fundamental difference: germline mutations affect all our cells, whereas
    somatic mutations are present only in some cells of our body. Organs that accumulate
    more somatic mutations are those most exposed to environmental mutagens or with
    a high cellular turnover, like the skin, lung, gastrointestinal'
  merge: -1
  pgno: 294
- img_proc: true
  md: 'tract, liver, and blood. In contrast, cells of the brain and muscles, for example,
    are less prone to mutations. Somatic mutations can also develop while in utero.
    While our germline genome is often referred to as our birth genome, it would be
    more accurate to call it at fertilization. In practice, a mutation that develops
    in the first cell divisions of the fertilized egg will affect the majority of
    our cells and is a nearly constant or germline mutation. A recent study from Iceland
    showed that identical twins differ by average 5.2 such near-constitutional mutations,
    which are very hard to distinguish from germline mutations (Jons et al., 2021).
    Somatic mutations that occur later in embryonic development can create mosaicism,
    where an individual is made of two or more populations of cells with different
    genes; an example can be someone born with a large dark birthmark such as a congenital
    melanocytic nevus, typically caused by a mutation in the NRAS or BRAF mutation
    during skin development.


    # Cancer


    As our cells accumulate somatic mutations through replication errors or environmental
    factors, some somatic mutations can confer a proliferation or fitness advantage
    to a cell over our other cells. This mutated cell will divide into identical cells
    with the same mutated genome (that is the same genome), forming a clone—a population
