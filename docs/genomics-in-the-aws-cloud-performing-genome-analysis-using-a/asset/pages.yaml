  md: '# Chapter 5 AWS Services for Genome Analysis 75


    by different resources—perhaps a piece of software on an EC2 instance here, perhaps
    a Lambda function then, a call to a RESTful web service, then a batch script,
    then maybe a human action of some kind. While workflows are not strictly linear,
    there''s generally a requirement that one completes before the next step begins—the
    output of one becomes the input of the next. When it is impossible to predict
    how long it will take a given step to complete, we need something to coordinate
    the overall process. That''s Step Functions come into their own.


    In genomics, Step Functions can manage the overall process of taking a FASTQ file,
    transmitting it to a compute resource for analysis, and taking the results—a BAM
    file, typically—and storing them somewhere else. It also (as well or instead)
    store the results of the sequence analysis in a database for further examination
    that way.


    # Simple Workflow Service


    Functionally similar to AWS Step Functions, AWS SWF requires the user to develop
    "decider" modules. Although they are more flexible than workflows implemented
    in Step Functions, SWF solutions can be harder to develop, test, and maintain.
    AWS recommends that you use AWS Step Functions unless you have a reason not to.


    # Third-Party Solutions


    The Broad Institute has created a scientific-oriented workflow execution system
    called Cromwell. Cromwell is based on AWS Batch and a dedicated controller to
    run Batch jobs that coordinate the activities of multiple worker nodes and the
    flow of input and output files between the worker nodes and an S3 storage bucket.


    The Barcelona Centre for Genomic Regulation developed a workflow named Nextflow.
    Nextflow is functionally similar to Cromwell and also makes use of AWS Batch.


