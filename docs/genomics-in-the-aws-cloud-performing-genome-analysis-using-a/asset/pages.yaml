  md: '# Chapter 5 | AWS Services for Genome Analysis


    Aside from the way in which they run and are priced, EC2 instances are grouped
    into instance types, which is to say the applications for which they are generally
    suited. The following instance types are available:


    +   - General Purpose, which have names beginning with M, or sometimes T or A
    (think of M for "miscellaneous" computing). These machines have a balance of computing
    power, memory, and network performance (don''t forget that network performance
    governs how an instance accesses remote objects, such as those in S3 buckets)

    - Compute Optimized, which have names beginning with C (presumably for "compute").
    These machines have lots of processing power

    - Memory Optimized, whose names start with R or X (think RAM or "Xtra" memory).
    You might consider these VMs if your planned application includes rapid and random
    access to stored objects, and putting those objects in persistent storage slows
    down too much.

    - Accelerated Computing, which have names starting with P, G, or F. These virtual
    workstations have graphics processing units (GPUs) or field-programmable gate
    arrays (FPGAs) of the sort that can be used for computationally intensive work—associate
    G with GPU and F with FPGA.

    - Storage Optimized, which have names beginning with I, D, or H (think of I for
    IOPs). Use these machines for work that involves a lot of accessing stored objects.


    A EC2 instance type name would be like m5.large, which describes a general-purpose
    instance (the fifth version thereof) of large size (other size options include
    xlarge, 2xlarge, and so on). You can look up the exact specifications of this
    or any other instance type in the AWS EC2 documentation and discover that the
    m5.large has two virtual CPU (vCPU) cores, 8 GB of RAM, and support for EBS storage.
    These instance specifications evolve all the time, be sure to consult the documentation
    for the latest information.


    # Containers


    Virtual machines, which is to say EC2 instances in the AWS world, are not the
    only way to package up software solutions and run them in the cloud. Containers
    are a means by which application software, including all of its dependencies,
    can be stored in a single package and run anywhere. Typically, they are run on
    a developer''s workstation initially and then deployed to much more computing
    resources when it is time to put them into production.

    Think of containers as highly portable applications. In a single module, containers
    hold whole software solutions, complete with all their dependencies.'
