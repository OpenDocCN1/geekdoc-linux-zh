  md: '# Chapter 7 Linux AWS Command-Line Basics for Genomics


    The AWS Command-Line Interface (CLI) is a set of tools that runs either on your
    local computer—Windows, macOS, or Linux—or on a remote computer dedicated to the
    role of AWS administration. You install the AWS CLI software package and are then
    able to use hundreds of text commands that enable you to do pretty anything you
    want to do with AWS.


    On Windows, you run AWS commands at the traditional command line (cmd.exe) or
    in PowerShell. In a Unix-like environment, such as Linux or macOS, you run commands
    from your favorite shell—Bash, zsh, tsh, or another one. There is also a way to
    run AWS CLI commands from the AWS Console, using an AWS service called Systems
    Manager.


    After gaining some familiarity with the AWS CLI, you will find that it is more
    time-efficient to perform most tasks. You will also come to appreciate that you
    can use the AWS CLI in command-line scripts. That makes it easy to replicate the
    performance of AWS tasks quickly and repeatedly.


    # Installing the AWS CLI Environment


    Before you can use the AWS CLI, you have to install it on your workstation (your
    laptop computer or the EC2 instance that will serve as your administrative workstation).
    Setting up the CLI is a straightforward matter, described here.


    # Windows


    To install the CLI under Microsoft Windows, find the installer (.msi) that suits
    your version of the operating system, either 32 or 64 bit. Run the installer as
    you would any other Windows setup wizard.


    In 64-bit Windows environments, the CLI installs to C:\Program Files\Amazon\AWSCLI.


    In 32-bit Windows environments, the CLI installs to C:\Program Files (x86)\Amazon\AWSCLI.


    To confirm that the installation completed successfully, go to the Windows command
    line (cmd.exe) or PowerShell and enter the following:


    ```

    aws --version

    ```


    The command should return information about the versions of AWS, Python, and Windows
    itself, something like this:


    ```

    aws-cli/2.0.12 Python/3.7.4 Windows/7

    ```'
