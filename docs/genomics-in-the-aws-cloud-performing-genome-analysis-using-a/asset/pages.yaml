  md: '# Chapter 6 Building Your Environment in the AWS Cloud


    Cloud instance or other resource on a public subnet does not mean that anyone
    on the Internet can access it. Rather, it means that an Elastic Compute Cloud
    instance, if it is given an Elastic IP address (or other public IP address), can
    be reached from the Internet. Even then, all the usual security applies, including
    password authentication and public-key encryption.


    You could, potentially, set up one or more private subnets in addition to the
    public subnet. If you wanted to prevent something like a database server from
    ever being reached from the Internet, You could keep your Internet-accessible
    servers in the public subnet while hiding your databases in the private subnet,
    allowing the accesses, if needed, by means of an access control list (ACL). This
    is how you could implement something like a website referred to information on
    a database. If you wanted, you could also allow the computing resources in the
    private subnet to initiate communication over the Internet by means of Network
    Address Translation (NAT) device.


    But that is not we want. We want a simple VPC, with just a single public subnet,
    on which we can host Elastic Compute Cloud instances. Note that things like S3
    buckets connect to the VPC via the AWS infrastructure. They don''t use the Internet,
    but rather AWS connectivity that is controlled by means of AWS Identity and Access
    Management (IAM) rights and other control mechanisms.


    We therefore choose the first option, VPC With A Single Subnet, and click Select.
    We get the Step 2 screen, with its default settings, in Figure 6.4.


    IP addressing schemes are a large and somewhat complicated subject, and one that
    you don''t have to understand fully in order to do genomics work on the AWS cloud.
    In short, you need to choose an addressing scheme that allows for enough unique
    IP addresses to cover all of the devices that will ever be on your subnet. You
    generally generally use addresses in a range that is not meant for Internet routing,
    as defined by a standards document called RFC 1918. That specification allows
    for three address ranges that are meant to be used on private subnets and cannot
    be routed over the Internet. The three ranges are as follows:


    ```

    10.0.0.0 to 10.255.255.255 (10.0.0.0/8)

    172.16.0.0 to 172.31.255.255 (172.16.0.0/12)

    192.168.0.0 to 192.168.255.255 (192.168.0.0/16)

    ```'
