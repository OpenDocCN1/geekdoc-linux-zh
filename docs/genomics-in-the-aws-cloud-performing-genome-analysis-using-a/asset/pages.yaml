  md: '# Extraction of DNA


    We saw in Chapter 2 that DNA is a molecule—the famous double helix—that exists
    in the nuclei of Cells. The DNA is arranged into chromosomes, where it is tightly
    coiled around proteins called histones.


    # Deriving Nucleated Cells from Whole Body


    To get DNA, we must first begin with a sample of nucleated cells—that is, cells
    that have nuclei. Most cells do have nuclei, so it is possible to extract DNA
    from almost any tissue sample. As an aside, in detective novels and cop shows
    forensics are depicting DNA from such materials as urine or the seminal fluid
    of a man who has had a vasectomy, the creators are not totally off base. Bodily
    fluids like those typically contain whole cells that slip off inside the body,
    and DNA can be extracted from those cells. Saliva contains a number of cells that
    drop off inside the body, which is why a lot of low-market genetics services require
    saliva samples.


    For the purposes of this chapter, we assume that we are working with a blood sample
    from a human. Interestingly, red blood cells do not have nuclei—they''ve evolved
    so as to fix oxygen-carrying hemoglobin within the double-layered lipid membranes
    that form their cell walls. Similarly, platelets—essential to stopping bleeding
    by coagulation—do not have nuclei either.


    There is more blood than red cells and platelets, however. White blood cells,
    which are part of the body''s immune system and are also known as leukocytes,
    which have nuclei and where DNA comes when starting with a sample of blood.


    A sample of blood, broken down by volume and disregarding normal variations between
    men and women, is typically 40–50 percent red blood cells, 1 or 2 percent white
    blood cells and platelets, and the rest plasma (which is water with various hormones,
    clotting factors, and other trace substances present in it).


    The first thing to do in isolating DNA from whole blood is to separate the white
    blood cells from the rest of the blood. This is typically done with a centrifuge,
    which a spinning force causes cells to settle out of the plasma. After fractionation
    by centrifuge, a formerly uniform sample is layered, with a thick stratum of red
    blood cells at the bottom, a thick layer of yellow plasma at the top, and a thin
    layer comprising white cells and platelets between the two layers.


    Called the buffy coat because of its off-white color, the middle layer is extracted
    from the rest of the fractionated blood sample with a pipette and used as the
    basis for the rest of the DNA extraction process.'
