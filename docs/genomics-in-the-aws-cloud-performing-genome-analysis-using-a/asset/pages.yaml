  md: '# # Chapter 9 ■ Visualizing the Genome 215


    Click Downloads to access the IGV installation links for Windows, Mac, and Linux.
    Where should we install IGV? We could install IGV on our AWS EC2 instance and
    visualize genomes from our Windows desktop by using a graphical terminal like
    PuTTY with an X server for Windows, as discussed in Chapter 7. This would mean
    all graphical IGV data would transit over the network, which would be slow and
    with a lower resolution and defeat the purpose of a local genome browser. We will
    instead install IGV on our desktop (or laptop) and enable a back-end connection
    between our desktop and our genomic data, which resides on AWS.


    We like to have consistent environments between our EC2 instance and a Linux virtual
    machine (for example, an Ubuntu virtual machine with VMware, as in Chapter 7)
    to access AWS. So we will install the Linux version of IGV in our Linux virtual
    machine:


    +   1. Open a browser window in your Linux virtual machine.

    2. Go to broadinstitute.org/igv.

    3. Click Downloads and then the IGV for Linux icon.

    4. Click Save File.

    5. Unzip the downloaded file to your installation directory (/opt).


    ```

    sudo unzip /home/cv/Downloads/IGV_Linux_2.8.7.zip -d /opt

    ```


    The downloaded files automatically include the prerequisite Java 11, so no additional
    software needs to be installed. To launch the IGV browser, launch the already
    provided shell script igv.sh. This script starts with 4 GB of memory, which is
    sufficient for most users. For large files with many tracks, the memory can be
    increased to, for example, 8 GB, by editing the igv.sh script. Replace this:


    ```

    "java --module-path=lib -Xmx4g"

    ```


    with this:


    ```

    "java --module-path=lib -Xmx8g"

    ```


    Let''s launch the IGV browser.


    ```

    cd /opt/IGV_Linux_2.8.7

    ./igv.sh

    ```


    The window of the IGV browser opens, as shown in Figure 9.4.'
