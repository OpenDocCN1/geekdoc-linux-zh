  md: '# Introduction


    Welcome to Genomics in the AWS Cloud!

    From its title, you can conclude that this book is about two things: genomics
    (the science of sequencing and interpreting genetic data) and Amazon Web Services
    (one of the three big hosted computing platforms). Genomics in the AWS Cloud,
    therefore, is meant to appeal to people from a biology background who want to
    learn how to do genomics work with AWS or to people with a computer background
    who want to find out how to apply their skills to genomics.


    Both of these areas, genomics and cloud computing, are evolving constantly, and
    practically no one can claim to be completely au with either. This book, therefore,
    aims at no one but separate moving targets. Our goal is not to teach you everything
    there is to know about AWS and genomics—or even about the intersection of the
    two fields—but rather to show you the following:


    +   - Enough of the general concepts of cloud computing and genomics that you
    understand the problems to be solved and the technologies available to work on
    those problems


    +   - Enough specifics to enable you to work through actual genomics tasks and
    see results


    # Who Should Read This Book


    This book is intended for people who aren''t content to use commercial genome
    sequencing services and want to do their own analysis. We walk through the process
    of getting raw data from a blood sample via a lab and then using the AWS services
    to analyze it—learning which genes are present in the sample and what they might
    say about you and your health. This will enable you to'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Introduction


    investigate aspects of your genome that commercial services don''t explore because
    they are not allowed to give medical advice.


    As well, this book is suited to people who want to learn about the AWS cloud and
    want to structure their study around a useful field—genomics.


    # Genomics


    At the core of genomics is sequencing, which is the process of taking some biological
    material, as as blood or tissue, and converting to pure information. This is a
    complicated process that combines the traditional work of a biologist (which is
    to say, manipulating actual cells in a “wet lab” environment) with information
    technology. Cells go into the process; computer-readable data comes out.


    Genome sequencing took a long time to figure out. Expensive methods were first
    employed in the 1970s and 1980s. More automated methods became available in the
    late 1990s, and these enabled the sequencing of relatively simple organisms: yeasts,
    bacteria, and a relatively microscopic nematode worm (*Caenorhabditis elegans*)—still
    an experimental subject). Uncomplicated plants (notably *Arabidopsis thaliana*—a
    European weed with a particularly small genome) and modest insects (*Drosophila
    melanogaster*—the fruit fly), both longterm standard experimental subjects, soon
    followed after the turn of the century.


    Two biologists described the first human genome sequencing in an article in the
    Journal *Science* 2001. Scientists have worked to refine the human genome sequencing
    since then and also have to sequence the genomes of other organisms.


    Key to their work has been a continuous drop in the cost of full-genome sequencing.
    The first human genome sequence in 2001 cost 2.7 billion U.S. dollars to produce—it
    required funding of the sort only national governments could provide. Within less
    a decade, by 2005, the cost had fallen by four orders of magnitude to something
    like $1 million—still quite a lot. In writing, in 2012, it is possible to have
    a human genome sequenced for the cost of a high-end smartphone, and plenty of
    companies are attracting funding for their plans to bring the cost to less than
    $100. By the time the asteroid 99942 Apophis makes its closest approach to Earth
    in 2029, sequencing a full genome will almost cost the same as the simplest routine
    blood test costs. The cost of knowing everything about your genetic makeup will
    be trivial (assuming Apophis doesn''t render this unimportant, which latest reports
    assure it won''t).


    The dramatic fall of the price of genome sequencing, from billions of dollars
    at the turn of the twenty-first century to a few hundred dollars today, makes'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Introduction


    it possible for almost all of us to explore our genetic makeup. While all, as
    humans, share practically all of our genetic code (upwards of 99.9 percent), the
    differences make all the difference.


    The tiny fraction of our individual genomes that differ from other humans is what
    accounts for whether we are male or female, all of our physical characteristics,
    many of our personality traits, and our propensity to health or various kinds
    of disease.


    The availability of low-cost genome sequencing has revolutionized medical and
    pharmaceutical research and is started to change the practice of medicine. It
    also enables us to understand the building blocks of life and how much, or how
    little, we differ from other life forms.


    Genomics in the AWS Cloud is about discovering and studying those differences
    and learning from them. But there is another part to the equation, which is to
    say the other set of tools and techniques identified in the title.


    # Cloud Computing and AWS


    Almost in parallel with the advances in genomics that took place between 1995
    and the present day, so-cloud computing evolved enormously during the same time
    period and represents a standard way of designing, deploying, and operating processing
    systems.


    Now, the idea of computing resources that are not local to the people who need
    them is not at all. The earliest commercial and scientific computers were, of
    course, mainframes that were shared across many users—and more than a few of these
    remain in place today. Servers in organizational or co-location data centers,
    providing storage and computing resources to privileged users and the general
    public, have long been part of information technology. In the case of mainframes
    and client-server systems, users access remote systems (often without knowing
    or caring where they actually are). Functionally, that''s cloud computing, and
    it''s not a new thing.


    What is the issue with which modern cloud computing platforms allow rapid construction
    and cost-effective use of powerful systems. You can quickly set up workflows,
    test them with minimal computing power, and then scale them enormously when it''s
    time for a production run. More or less, you pay only for the computing power
    you use, and there are ways to schedule the use of processor cycles for times
    of low demand, when computing is cheaper. With the exception of storage and data
    transfer—meaning machine images that can be turned into working compute resources,
    well as input and output data—systems configured in the cloud can cost practically
    when they are not doing useful work. Such efficient use of expensive resources
    isn''t possible with on-premises or traditionally hosted solutions.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Introduction


    There are three main players in the cloud-computing industry.


    +   - Amazon Web Services (AWS)

    - Google Cloud Platform (GCP)

    - Microsoft Azure


    Each of them has its points of strength and weakness, and those relative merits
    are beyond the scope of this publication. Most organizations mix and match parts
    of each anyway to take advantage of relative technical superiorities and to maintain
    leverage with vendors. It suffice to say that we chose to do our genomics over
    AWS.


    Considering genome analysis is essentially a workflow to be carried out on storage
    and computing resources, AWS is well suited to the job. Here are some of the tools
    we will use:


    +   - Elastic Compute Cloud (EC2) for building and running Linux servers that
    actually run the software required for genome analysis

    - Elastic Block Storage (EBS) for maintaining updated disk images, ready to attach
    to a working machine when needed

    - Simple Storage Service (S3) for storing input and output files when ready access
    to them is needed

    - Simple Workflow Service (SWF) for automating processes

    - Glacier when files need to be archived at low cost

    - Identity and Access Management (IAM) for maintaining security and appropriate
    user privileges


    # What You''ll Learn from This Book


    Since it''s unlikely that many readers are familiar with both genomics and AWS,
    this book is meant to teach you each subject—or both if you are familiar with
    neither—and how they work together.


    # How This Book Is Organized


    Here is a quick introduction to each chapter in this book. You can skip directly
    to the parts that interest you most, or you can read from beginning to end to
    get a complete picture.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Introduction


    Chapter 1: Why Do Genome Analysis Yourself When Commercial Offerings Exist? This
    chapter explains what turnkey commercial services (such as 23&Me) exist and what
    they are good for. It explains what they do not do and why you might want to do
    your own genomics work.


    Chapter 2: A Crash Course in Molecular Biology This chapter brings you up to speed
    the speed of biological science as it pertains to genomics. Use this to refresh
    your knowledge from school or to get a new understanding.


    Chapter 3: Obtaining Your Genome This chapter explains how to get a sample of
    your blood suitable for sequencing and how to send it off to a lab for conversion
    into raw genome data.


    Chapter 4: The Bioinformatics Workflow This chapter approaches the sequencing
    process from a biological point of view, explaining how one step of data processing
    feeds into the next to ultimately produce the results you want.


    Chapter 5: AWS Services for Genome Analysis This chapter represents a deep dive
    into the AWS services you can use for genomics work. If you know biology but aren''t
    familiar with AWS, you might want to begin here.


    Chapter 6: Building Your Environment in the AWS Cloud This chapter goes into more
    detail about how to set up AWS services for genomics work.


    Chapter 7: Linux and AWS Command-Line Basics for Genomics All major bioinformatics
    tools run under Linux, so you''ll need to understand that operating environment
    and how to get things working together within it.


    Chapter 8: Processing the Sequencing Data This chapter explains how to get from
    raw sequencing data to useful information about a genome.


    Chapter 9: Visualizing the Genome This chapter introduces you to tools you can
    use to depict genomic information graphically, enabling you to understand it better.


    Chapter 10: Containerizing Your Workflow on the Desktop This chapter explains
    how to use Docker containers, both locally and in AWS, to process efficiently
    and scalably.


    Chapter 11: Variants and Applications This chapter explores certain aspects of
    genome analysis, allowing you to dig deeper into the information you have derived
    from your sample.


    Chapter 12: Cancer Genomics This chapter discusses the analysis of somatic mutations,
    specifically those found in cancerous tumors, although the workflow could also
    be applied to any tissue in the body.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# How to Use This Book


    You can approach this book by reading straight through, from beginning to end.
    That is probably the best way to approach it if you have knowledge of neither
    genomics nor AWS. Alternatively, if you feel you have a good handle on one or
    the other, you can focus on those chapters that cover your weak area and then
    study the sections on how AWS can be used to create and automate a genomics workflow.


    # Our Story


    This book is not about us, but it''s probably fair to explain to you, our reader,
    who we are and where we are coming from as we write this book.


    We are a married couple and the parents of two children. Catherine is a working
    scientist and bioinformatician, attached to a medical research group in Sydney.
    David is an information technology and communications consultant who designs and
    builds AWS solutions, among other things.


    A key fact is that one of our children is not alive anymore. Our daughter, Floriane,
    died of a sudden cardiac arrest in April 2015. She was nine years old at the time.


    Floriane''s death and its consequences are not the subject of this book. However,
    the way she lived and died inspired us to take our knowledge of genomics and cloud
    computing and look inward at our family. We wanted to know what happened to Floriane
    and what bearing that had on the rest of us. We honor her memory by attempting
    to understand what happened to her. As well, we want to keep the rest—particularly
    her younger brother, Roland—safe.


    Floriane was a fit and apparently healthy girl of mine. She had no ongoing medical
    concerns and by all appearances developing normally. She was active and happy.


    One evening, after dinner, she approached David on the sofa and asked him to chase
    her around the house—one of her favorite activities that she had indulged in many
    times before. David chased Floriane around, theoretically waving his arms. Floriane
    giggled excitedly and ran a few meters. David caught her and flipped her upside-down,
    which excited her because she knew it led to ticking. At that point, she went
    completely limp.


    David was confused. He thought he''d accidentally hit Floriane''s head on something.
    Catherine, nearby, thought it was a seizure, even though Floriane had never had
    one previously. It quickly became clear that Floriane was in cardiac arrest.


    Not having a defibrillator on hand, we called for an ambulance and did best in
    the seconds before she died with manual cardiopulmonary resuscitation'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Introduction xxx


    (CPR) proved ineffective. Paramedics showed up with a defibrillator and adrenaline,
    and used both, but it was all over by then. Floriane died at home, a few minutes
    after the onset of her cardiac arrest.


    (Again, it''s not the subject of this book, please take this opportunity to contemplate
    the fleetingness of life and appreciate the people you love. We''ll wait.)


    And so we were left with questions: What just happened? Why did it happen? Is
    it going to happen to any of the rest of us? There were many questions, far more
    existential in nature, and those questions remain, subjects for other venues.
    Looking at the situation in a limited way, our daughter had died, completely unexpectedly,
    and we wanted to know why.


    Speculation on the cause of Floriane''s death began almost immediately. She hadn''t
    been very sick at all. She hadn''t exhibited the symptoms—fear and so on—of an
    infection, such as meningitis. She was far too mature—nineteen years old, tall,
    and fit—to have succumbed to the strange and random things that claim the lives
    of babies and are grouped under the catchall descriptor Sudden Sudden Death Syndrome
    (SIDS). She didn''t have any known allergies. She wasn''t taking any medicines.
    She suffered an injury, had''n eaten anything unusual, had traveled anywhere dangerous—she
    had not done anything outside the realm of what is normal for a fifth-grade girl
    living in Australia. And yet she was no longer alive.


    The emergency-room doctor offered a broad guess that turned out to be right: cardiomyopathy,
    or a disease of the heart muscle. Further investigation by the medical examiner
    showed some characteristics of hypertrophic cardiomyopathy (HCM), which is one
    of several kinds of cardiomyopathy, but also revealed characteristics of arrhythmic
    ventricular cardiomyopathy (ARVC), another disease of the heart. Genetic testing
    showed two genes: MYH7 (associated with HCM) and RYR2 (associated with ARVC).


    The medical examiner officially attributed Floriane''s death to HCM but noted
    that her case had “unusual features”—a reference to the traces of ARVC that had
    been found. The solace of death could just as well had been ARVC, we were told.


    We began to research and think. We discovered disturbances to the heart rhythm
    due to adrenaline. Floriane had gone into cardiac arrest when she was wound up
    with excitement, playing with David. She had received an injection of adrenaline
    from the paramedics. Could the undeniable structural defects caused by HCM, which
    would prove fatal, but not until age 30 or so, have been amplified by some form
    of ARVC?


    The question gained urgency when we learned that while Floriane''s MYH7 a de novo
    mutation, she hadn''t inherited it from us, and her brother didn''t have it.


    So began our research into our family''s genomes.'
  merge: -1
