  md: '# Chapter 8 ■ Processing the Sequencing Data 149


    reference genome that was used to create the BAM file and that was probably not
    provided with the BAM file. If you would like to realign your sequencing reads
    to the same reference genome we are using in these exercises, you can extract
    your reads from the BAM file as FASTQ. You can then align the FASTQ reads to a
    reference genome, as we have just done. To extract the reads from a BAM as FASTQ,
    we need the Bedtools software addition to Samtools, so let''s download and install
    Bedtools. from github.com/arq5x/bedtools2/ right-click the bedtools.static.binary
    link, select Copy Link Address, and run the following:


    ```

    wget https://github.com/arq5x/bedtools2/releases/download/v2.30.0/

    ln -s bedtools.static.binary bedtools

    ```


    Now extract FASTQ read pairs from an existing BAM file. We use Samtools to sort
    the BAM file by read identifier so that read pairs will be one after the other.
    We use Samtools to filter the BAM files so we get each read only once and don''t
    get any extra copies that are "primary alignment" or "supplementary alignment".
    Then we use Bedtools to extract the read pairs, with the first read of a read
    pair going into the first FASTQ output file and the second read of a read pair
    going into the second FASTQ output file. The output FASTQ files are plain text,
    so we compress them to take up disk space.


    ```

    infile=my_bam.bam

    outfile1=my_fastq.R1.fastq

    outfile2=my_fastq.R2.fastq


    samtools sort -n "${infile}" | \

    samtools view -F 2304 | |\

    bedtools bamftq -i -fq "${outfile1}" -fq2 "${outfile2}"


    gzip $outfile1

    gzip $outfile2

    ```


    If you received more than one pair of FASTQ files, you align each pair separately
    to its own BAM file and merge the BAM files during the Markdown-steps of the next
    section.


