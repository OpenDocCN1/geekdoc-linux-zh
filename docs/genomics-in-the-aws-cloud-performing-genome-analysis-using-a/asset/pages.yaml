  md: '# Chapter 5 AWS Services for Genome Analysis


    services under it. In many cases, you can get a bit of value out of AWS for zero
    cost (at least for a, as trial), but you still have to have an account.

    To create an account, navigate to


    ```

    portal.amazon.com/billing/signup#/start

    ```


    and work through the process as prompted. You have to provide credit card information
    for billing, though the first time you create an AWS account, you can use certain
    resources free charge—some forever, for the first year after the creation of your
    account, and some for a specified trial period. This is the AWS free tier, and
    it is a good practice to consider what is available in the free whenever you want
    to try a new service.


    # Virtual Private Cloud


    The "stuff" you create on AWS exists on the AWS network, alongside else''s. Keeping
    users'' resources operate on a virtualized, shared platform is one of the core
    responsibilities of the AWS architects and administrators, and their techniques
    are closely held trade secrets. As far as we concerned, you can rely on the AWS
    resources that belong to us are held within a virtual private cloud (VPC), which
    is a hosted network to which we control access.


    A VPC is an Internet Protocol (IP) network, except rather taking the form of routers,
    switches, firewalls, and cables in a rack or data closet, it is virtual. An VPC
    is a software abstraction of an IP network, which means you can access and make
    changes to your VPCs remotely. Anything you can do with a traditional IP network
    (but need not) be done with a VPC.


    In its simplest form, a VPC is a single flat network with a simple address range
    and no connectivity to other VPCs or the Internet. You can use a simple VPC like
    this to hook up several virtual servers, called EC2 instances (more on them later),
    the same you might connect several physical machines to an Ethernet switch with
    blue Cat 6 cables.


    A more complex VPC could have multiple subnets and route tables to describe how
    resources on each subnet access resources on other subnets. Still more elaborate
    might have an Internet gateway, with a route table to control access in and out,
    to let the world at large access the resources on your VPC.


    For the purposes of private genomics, a simple VPC will suffice. You can create
    a simple VPC with no capability to interact with the Internet or other VPCs. If
    you are wondering how you will access computing resources that exist on a basic
    VPC that does not have Internet access, understand that you will access your AWS
    virtual machines directly—via encrypted remote access, such as SSH or Remote Desktop.
    We have a VPC only because it enables virtual machines (and other resources) to
    share data and also because it''s a technical requirement: EC2 instances must
    exist within VPCs.'
