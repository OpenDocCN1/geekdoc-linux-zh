    # The Alignment Process


    The alignment process is the process of matching fragmentary sequences from a
    sample (test subject) having been encoded in a FASTQ file and trimmed to improve
    quality—and attempt to fit it to a reference genome.


    You perform alignment with a piece of software capable, logically enough, of two
    different variations of the Burrows-Wheeler algorithm and STAR (which stands for
    "spliced transcripts alignment to a reference\). BWA is used for aligning DNA
    sequences, while STAR is preferentially selected for aligning spliced muscle RNA.
    Alignment is compute-intensive and is perhaps the part of computational genome
    analysis that is best suited to Amazon Web Services, with its virtually unlimited
    computing power.


    We prefer BWA and so will focus on that package here. BWA implements three algorithms.


    +   - BWA-backtrack is best for short sequences up to 100 base pairs.

    - BWA-SW can handle longer sequences (up to 1,000 base pairs), but it is slower
    than BWA-MEM and yields less accurate results. On the other hand, it may be better
    at handling sequences with many gaps.

    - BWA-MEM is the best of the BWA algorithms, capable of handling long (up to 1,000
    base pairs) and short (70–100 base pairs) sequences efficiently and accurately.


    BWA takes FASTQ files as input files and generates as output a sequence alignment
    map (SAM) file. As the SAM file is very large, it is compressed into a binary
    alignment and BAM file.


