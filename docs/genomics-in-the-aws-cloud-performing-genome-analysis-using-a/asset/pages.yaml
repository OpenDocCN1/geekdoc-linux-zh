- img_proc: true
  md: '# Chapter 6 Building Your Environment in the AWS Cloud


    Authentication confirms that someone (or something, in the case of a piece of
    software) is who they say they are. If a system can determine, with a high degree
    of confidence, that an assertion about identity (''I am David Wall'') is true,
    then it can come to the problem of access, which is to letting the user see and
    do things appropriate to their identity.


    A system establishes the authenticity of an identity claim (performs authentication)
    by evaluating characteristics of the entity making it. These boil down to some
    combination of these factors:


    +   - The entity knows: This is usually the combination of a username (which it
    is often more or less public, or easily guessable) and a password, written or
    maybe spoken. We will talk about password quality later.


    +   - The entity has: This is usually a hardware device of some kind, which generates
    a constantly changing code number. If you can cite the current number, it is likely
    that you have the device. Banks sometimes issue a little key that generates codes
    that are needed for account access; virtual private networks (VPNs) use the same
    approach. Today, though the approach that provides the best combination of reliability,
    convenience, and low cost is to use a smartphone app. Google Authenticator seems
    to be most common, but Authy is also popular and a companion desktop application
    for Windows, macOS, and Linux.


    +   - Something that is inherent to the entity: In the case of people, this is
    usually some sort of biometric measurement—fingerprint, retina pattern, voiceprint,
    something like that.


    +   - Some combination of time and location: For example, if a user is supposed
    to be accessing from a particular corporate network during certain business hours,
    their identity might be challenged if they appear to be coming from across the
    Internet or at a time outside the access window.


    In the case of our AWS account, we will set up the first two of those factors.
    We already have a username and password on our root account, and we will supplement
    that with hardware authentication based on Google Authenticator running on a smartphone.
    This will be two-factor authentication (2FA), the simplest form of MFA, and it''s
    good enough for almost everything, including the protection of the personal genome
    information we are working with.


    To set up MFA


    Choose Virtual MFA Device from the Manage MFA Device pop-up, and click Continue
    (Figure 6.26).'
