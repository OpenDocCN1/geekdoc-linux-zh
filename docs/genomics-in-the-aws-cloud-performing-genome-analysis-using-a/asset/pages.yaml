    to new data sets. IGSR includes the wholegenome sequence (WGS) at depth of about
    3,000 individuals and includes the WGS at high depth of a subsection of individuals.
    The data is also stored in an Amazon S3 bucket (s3://1000genomes).


    **Genome in a Bottle (GIAB)** GIAB (jimb.stanford.edu/giab) is a consortium that
    develops reference standards, methods, and data to translate whole-genome sequencing
    into clinical practice. GIAB sequenced at high depth and on several technological
