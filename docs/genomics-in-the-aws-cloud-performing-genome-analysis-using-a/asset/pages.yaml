    Still staying clear of cloud offerings for now, there are a couple of packages
    that facilitate this requirement.

    The Docker solution for the coordination of containers across a cluster is called
    Docker Swarm. (Again, it is an open-source solution maintained by the for-profit
    Docker company.)Swarm, as it is it called, has a reputation for being simple and
    easy to configure. It allows users to use the YAML definition language to group
    containers into units called *services* or *microservices*, which usually correspond
    to functional applications (interface, business logic, and database, for example).

    The main alternative to Docker Swarm is Kubernetes, which was developed by a group
    of ex-source software engineers who worked on Google''s internal container management
    system, known as Borg. Kubernetes developed and subsequently released to the public
    open-source software. Kubernetes can manage Docker containers, as well as other
    kinds, and allows users a great deal of flexibility in determining how their containers
    are grouped, both functionally and with respect to their physical allocation across
    a cluster of servers. A pod is a group of containers that are colocated on a single
    server within the cluster, and a service is a functional entity that spans pods
    to provide desired capacity. Beyond, Kubernetes allows for a common filesystem
    to be shared across multiple pods in a more or less transparent way.

    Are you confused? With some variations with respect to the specifics of implementation,
    containerization allows functional computing units to be separated from their
    operating systems and treated as discrete entities. These entities can be grouped
    and run in a coordinated way multiple instances of the operating system—multiple
    physical servers.

    Now, consider how this can be done in the cloud, where everything is generically
    virtual and scalable.

    The most straightforward way to deploy and run containers under AWS is with Elastic
    Container Service. You can register a container with ECS and then use it to run
    the containerized applications and make them available to users. You can use the
    management service to scale your application up and down to demand.

    It is important to understand that under ECS, the concept of EC2 virtual machines
    that run on one or more ECS instances does not go away. Recall what we said a
    few paragraphs ago, about Docker containers running (s or in groups) on multiple
    Linux servers and as Docker Swarm or Kubernetes—managing the operation of the
    collective resource. Under the AWS architecture, ECS assumes a role played to
    that of Swarm or Kubernetes. It manages containers on multiple server instances.

    You can fit other resources, such as load balancers and EBS volumes, into your
    ECS configurations, as well. It is worth noting that ECS attracts charges of'
