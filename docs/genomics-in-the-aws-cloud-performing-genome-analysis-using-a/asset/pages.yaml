    python mantys.py \# MSI coordinates calculated in previous step

    --bedfile msi_loci.bed \# genome reference used for the BAM files

    --genome ref_fasta \# germline BAM

    -n normal.bam

    -t tumor.bam \# somatic BAM

    --threads 8 \# nb of threads depending on type of AWS instance

    -o myfile.txt \# output file for MSI score.

    ```


    MANTIS produces output files containing the microsatellite locus-specific calculations
    used by the algorithm. The important output file is the myfile_status file, which
    contains the final MANTIS result and MSI score. The higher the score, the more
    likely the tumor to have high MSI status. The myfile_status file also contains
    the cutoff values most commonly used by clinicians to call a high MSI status.
    The FDA approved in 2017 the use of the immune inhibitor pembrolizumab for unresectable
    or metastatic cancers with high MSI or MMR deficiency, irrespective of the tissue
    of origin.


    # Summary


    We have arrived at the end of our final chapter. We have covered a lot of ground
    together, including molecular biology, sequencing a genome, discovering how to
    set up our environment on the cloud, analyzing genomes, and expanding to other
    applications and even proteins. It is an endless journey, where the more we know,
    the more we discover what we do not know. Genomes are incredibly complex as they
    are like legacy machines that have accumulated layers and layers of evolution
    since the beginning of life on Earth. They are incredibly redundant, but it is
    this redundancy that makes them robust. After analyzing so many genomes, it feels
    incredible to see so many mutations in completely healthy individuals, at the
    same time, and in very rare cases, a misspelled letter can bring dissarray. Genomes
    can give us insights about our predispositions, but with exceptions, can enable
    us to take action to avoid these conditions. Genomes also make us humble as we
    share many genes with very simple life forms and open a window in the process
    of evolution. The function of half of our genes is still unknown, and you might
    be the one who will make new discoveries. There is also an enormous gap between
    what we know of the genome and how to apply this knowledge to benefit patients.
    In addition to sequencing your own family genomes, there are bewildering number
    of public databases and published data that can be analyzed, and the power of
    the cloud gives the computing power to everyone to dive into it. Do not be intimidated
    by the scientific literature. We still know very little, and most things are yet
    to be discovered. Above all, and in all your genomic adventures in the cloud,
    have fun!'
