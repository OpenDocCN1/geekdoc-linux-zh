  md: '# CHAPTER

    8


    # Processing the

    Sequencing Data


    In this chapter, we run a pipeline to convert sequencing data into gene information.
    The sequencing data consists of millions of short reads generated by Illumina
    or BGI short read DNA sequencing. The gene information includes the DNA variants
    and mutations found in the genes of the person whose DNA was sequenced. When the
    variant is only 1 nucleotide long, it is called a single nucleotide variation
    (SNV) or single nucleotide polymorphism (SNP). Variants that are 2 to 50 nucleotides
    long are called indels. Anything bigger than that is called a structural variant
    (SV) or copy number variant (CNV).


    # Getting from Data to Information


    To get sequencing data to gene information, we can run the following steps, which
    make up our data processing pipeline:


    +   - Align the sequencing reads to the reference genome to produce a BAM file.

    - Make adjustments and refinements to the aligned reads in the BAM file.

    - Identify the small differences (SNVs and indels) in this data compared to the
    reference genome and record them in the VCF file.

    - Make adjustments and refinements to the variants in the VCF file.'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# Chapter 8 Processing the Sequencing Data


    5. Annotate the SNVs and indels so that we will know whether they are inside a
    gene and whether the consequence of the variant may be deleterious.


    6. Prioritize the variants to be able to identify the most consequential ones.


    7. When analyzing a family or trio (mother, father, and child), carry out inheritance
    analysis to see which variants are in family members who have a disease and are
    not in the other members of the family who don''t have the disease.


    8. Identify and annotate SVs and CNVs.


    Let''s look at software commands to process these eight steps, step-by-step. And
    at each step of the pipeline, let''s see what a particular variant of interest
    would look like at that stage of the pipeline. We will follow an example variant
    in the cystic fibrosis gene CFTR. The variant is Phe508del, which causes the phenylalanine
    amino acid Phe, normally at position 508 of the amino acid sequence of the protein,
    to be deleted from the CFTR protein. It is a deletion of 3 nucleotides (CTT) at
    codon chr7:117559591-117559593 in the GRCh38 reference genome, which is chr7:117199645-117199647
    in the GRCh37 reference genome. In the sequence, this deletion is c.1521_1523del.


    The wild-type sequence consists of the following nucleotides, which translate
    into a chain of amino acids starting with Proline (Pro) at position 499:


    +   - Nucleotides: CCTGCACCATTAAAAGAAATATCATTTGGGTCTTCTATGAT

    - Amino acids: ProGlyThrIleLeysGluAsnIlePheGlyValSerTyrAsp

    - Position of amino acids:

    499500150250350455065506750850951051512513


    The variant-containing sequence resulting from the deletion of Phe508 is as follows:


    +   - Nucleotides: CCTGCACCATTAAAAGAAATATCATTTGGGTCTTCTATGAT

    - Amino acids: ProGlyThrIleLeysGluAsnIleGlyValSerTyrAsp

    - Position of amino acids:

    4995001502503504550655067507909510511512513


    The CTT sequence in the wild-type sequence spans two codons. You may notice that
    the Phe amino acid at position 508 is no longer present. You may also note that
