  md: '# CHAPTER

    3


    # Obtaining Your Genome


    Unless you have access to a lot of expensive laboratory equipment and possess
    the skills to use it, the process of obtaining your genome will involve engaging
    a laboratory to take some of your biological material, extract the nuclear DNA
    from it, and sequence that DNA to yield a data file containing your genome.


    # Preparing to Have Your Genome Sequenced


    As you think about having your genome sequenced, there are some things you need
    to know before you start.


    # Can It Affect My Insurance?


    In the United States, the Genetic Information Nondiscrimination Act (GINA) makes
    it illegal for health insurance providers in the United States to use genetic
    information to deny health coverage or increase premiums. (Full details and exceptions
    are at ghr.nlm.nih.gov/primer/dtcogenetictesting/dtcinsurerisk.) A similar law
    is in vigor in Australia for Medicare and private health funds. In both countries,
    however, genetic information can be used to increase premiums for other types
    of insurance, such as life insurance or disability insurance.'
