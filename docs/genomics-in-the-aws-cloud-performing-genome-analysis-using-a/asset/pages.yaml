  md: '# Aligning to the Reference Genome


    As a result, we have hundreds of millions of sequencing reads in the FASTQ files,
    each one from a different place in the genome. We need to align these to the reference
    genome. It is like putting the pieces of a jigsaw puzzle into their correct places,
    where the guiding outlines of the correct places


    For each sequenced read, there are four lines in the FASTQ file. The first part
    of the first line is the sequence identifier. The actual DNA sequence is recorded
    on the second line. The third line is a separator with the plus sign. The fourth
    line has the same length as the second line because it is the quality information
    about nucleotide in the sequence. Here is what one of the paired reads looks like:


    ```

    @01234:A0:HM1A2ABC;1:111:1054:1000 1:N:0:AAGAGGCA+NCATAA

    GTGAAGAAATTTCATTCTTCAGTTTTCTCTGTATGCCACATTAAAAAATCATCTTGG

    TTCCCCTATGATAGATATAGAAGCTCATCAACAGATGCACTAAGAAGTAAGAAAAAACTGTGA

    AACTTT

    FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF

    FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF

    FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF

    FF,FF

    ```


    As mentioned in Chapter 4, paired reads sequencing involves sequencing DNA fragments
    from each end of the fragment. Paired reads have the same sequence identifier
    and are stored in separate FASTQ files traditionally named with the suffixes R1.fastq
    and R2.fastq.


    As you can imagine, the FASTQ files are large and therefore stored in a compressed
    format so they take up less disk space. Most programs reading FASTQ files can
    read the compressed files. If your FASTQ file is not already compressed and you
    want to compress it, use the bgzip command from the htslib library. The code for
    htslib is at github.com/samtools/htslib. To obtain this latest release, click
    the Releases link, and right-click the link for the latest release and copy the
    link address. Download that latest software release.


    ```

    wget https://github.com/samtools/htslib/releases/download/1.14/htslib-1.14.tar.bz2

    ```


    Decompress the htslib software and go into the newly created directory of this
    software.


    ```

    tar -xf htslib-1.14.tar.bz2

    cd htslib-1.14

    ```'
