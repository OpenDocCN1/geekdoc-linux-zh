    in that they run on virtualized servers, meaning that the servers are not “visible”
    to us we make use of them. The servers are abstracted away in the AWS environment.
    Developers who make use of Lambda functions do not to worry about deploying a
    server to host them. The Lambda function is just deployed into the AWS environment,
