  md: '# 92 Chapter 6 Building Your Environment in the AWS Cloud


    Here''s the procedure:


    +   1. Go to console.aws.amazon.com. Log in using your email address and password.

    2. Click Services to see the list of services. S3 appears under the Storage section
    and is usually near the top, but you can also type it into the box at the top
    to filter out everything. Click the S3 link. You will see your bucket list, in
    a manner of speaking, as shown in Figure 6.19.


    ![](img/f11d8c1d6b76e74ec2235e2ddebf829b_119_0.png)


    Figure 6.19: A list of all existing buckets


    +   3. Give your bucket name.

    The name has to be compatible with the Domain Name Service (DNS), which means
    it cannot end in a dash - or a period. You have to use all lowercase letters,
    too. Interestingly, it also has to be unique across all bucket names in AWS S3,
    even those you don''t control. For this reason, you might want to use a naming
    convention that helps satisfy this requirement. We name our buckets with the prefix
    dw or cv, for example. Figure 6.20 shows the naming of a new bucket.'
