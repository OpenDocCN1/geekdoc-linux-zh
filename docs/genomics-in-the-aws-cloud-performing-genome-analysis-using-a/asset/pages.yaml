    # Identifying the Small Differences and Recording Them in the VCF File


    Now that all sequences are aligned to the human reference, we need to call the
    variants (SNVs, indels) at each nucleotide position. If the sequencing depth is
    30x, around 30 covers each nucleotide position. If about 50 percent (respectively
    100 percent) of reads differ from a human reference at a nucleotide position,
    we can call a heterozygous (respectively homozygous) SNV. If about 50 percent
    of reads have a CIGAR that reports 3 nucleotides deletion (“3D” in the CIGAR),
    as in the CFTR deletion example, a heterozygous small deletion should be called.


    In the following commands, GATK software programs will be used to study the BAM
    file and call SNVs and indels. The SNV and indel variants will be reported in
    the output VCF file. GATK programs includes extra steps to assess if variants
    likely to be sequencing errors instead of genuine variants. Calling the variants
    of several samples in a single step as joint-calling, can improve accuracy. In
    example, we have only one sample running through the multistep best practices
    pipeline. However, this pipeline allows joint-calling multiple samples.'
