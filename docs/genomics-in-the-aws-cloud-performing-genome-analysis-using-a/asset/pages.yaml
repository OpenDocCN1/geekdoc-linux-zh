    # Quality Control


    Once we have a FASTQ file, we can examine it to see which parts of it are of sufficient
    quality to potentially yield meaningful results. In examining a sequence we must
    consider the following:


    +   **Nucleotide quality:** We must look at the Phred scores to see which of the
    stated nucleotides has sufficient probability of correctness to be useful. In
    general, we disregard reads (reported 20, denoting nucleotide identifications)
    that have a Phred score below a certain value (often 20, denoting a probability
    of error greater than 1 percent and denoted by ASCII encoded score 5).


    +   **Nucleotide distribution:** The frequency of each kind of nucleotide should
    be approximately equal across the entirety of the sequence. That is, there should
    be approximately equal numbers of A, C, G, and T throughout the stated sequence.
    Certain sequencing techniques can lead to biases, though particularly at the beginnings
    and ends of sequences. One function of quality control is to account for those
    biases. The presence of too many G and C calls (high GC content), in particular,
    can indicate sample contamination or other problems.


    +   **Sequence duplication levels:** They can arise from biased PCR enrichment,
    which is a concern, or from genuine over-representation of some sequences (relatively
    rare in DNA sequencing, though it can happen that, by chance, sequences are cut
    at exactly the same positions; it’s more common when doing RNA sequencing, where
    some transcripts can be highly expressed).'
