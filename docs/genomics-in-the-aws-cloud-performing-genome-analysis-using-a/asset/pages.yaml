    then sends the output to the sort utility and then to the uniq utility, which
    counts the number of unique CIGARS:


    ```

    $ samtools view AAAA.bam | cut -f 6 | sort | uniq -c

    ```


    Redirection operators can, for example, save the lengthy screen output (called
    standard output) of a program to a text file, which can be easily read later (Table
    7.3).


    # Table 7.3: Redirection Operators


    | REDIRECTION OPERATOR | ACTION |

    | --- | --- |

    | > | Creates a new file that contains the standard output |

    | >> | Appends the standard output to the existing file |

    | < | Sends the contents of the specified file to be used as standard input |

    | << | Accepts additional lines as standard input |


    In the following example, we visualize a compressed FASTQ file with zcat, extract
    the top 5,000 lines, recompress the result, and redirect the standard output to
    create a FASTQ file. This can be used to create a pipeline on a small scale.


    ```

    $ zcat AAAA.fq.gz | head -5000 | gzip > AAAA.fq.gz

    ```


    The following command counts the number of reads in a FASTQ file:


    ```

    $ zcat AAAA.fq.gz | echo $(wc -l |''''/4))

    ```


    The wc (word count) utility with the -l (line) option counts the number of lines.
    Each line in a FASTQ file is described by four lines, the result needs to be divided
    by 4.


