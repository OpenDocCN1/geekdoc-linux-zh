    # # Storage


    Say what you like about genomics, but there''s no way around the fact that it''s
    very big. The genomics files associated with a single project can easily occupy
    hundreds of terabytes.


    AWS provides several levels of storage to cater to either short-term storage,
    long-term storage, or archival storage.


    The short-term storage can be used directly by the EC2 instance and is the most
    expensive: it comprises the EC2 instance store (typically used for storing buffers
    and cached data during the lifetime of the instance); the Elastic Block Store
    (EBS), which corresponds to durable, block-level volumes that can be attached
    to a running instance; and the Elastic File System (EFS), which provides scalable
    file store that can be attached to several running instances.


    The long-term storage consists of the Amazon Simple Storage (S3 for short) and
    is less expensive than the short-term storage. For reason, the large genomic files
    are usually kept on S3. Popular genomics tools such as Samtools or recent releases
    of the Integrative Genomics Viewer (IGV) can directly work from BAM files stored
    in S3. However, other genomics tools require files to be transferred to short-term
    storage to be processed by the EC2 instance.


    For archival needs, data can be stored on Glacier.


    When thinking about storage, consider the features that are important to you.
    These typically include the following:


    **Durability** Durability is a measure of how protected your data is. All S3 storage
    classes (with the possible exception of S3 Zone-Infrequent Access) offer the same
    level of durability (99.999999999 percent). Your data, stored in S3, is unlikely
    to disappear.


    **Availability** Availability is the amount of time, expressed as a percentage
    of a specified time period, that your data can be accessed. The S3 Standard storage
    class advertises availability of 99.99 percent over one year, meaning your data
    could be unavailable for as long as 52 minutes, 32 seconds across an entire year
