  md: '# 156 Chapter 8 Processing the Sequencing Data


    Using the BAM file as input, let''s create an intermediate file called the gVCF
    file.


    ```

    infile=my_bam_bqsr.bam

    outfile=my_gvcf.gz

    ref_fasta=GCA_000001405.15_GRCh38_no_alt_analysis_set.fasta

    gatk_dbsnp=Homo_sapiens_assembly38.dbsnp38.vcf.gz


    gatk HaplotypeCaller \\

    -R "$ref_fasta" \

    --dbsnp "$gatk_dbsnp" \

    -I "$infile" \

    -BC gVCF \

    -O "$outputfile"

    ```


    Using the gVCF file as input, let''s create the intermediate GenomicsDB database.


    ```

    infile=my_gvcf.gz

    out_directory=my_genomics_db_directory

    ref_fasta=GCA_000001405.15_GRCh38_no_alt_analysis_set.fasta


    gatk GenomicsDBImport \\

    -V "$infile" \

    --genomics-db-workspace-path "$output_directory" \

    --reader-threads 4

    ```


    # If this is a joint-call and there is more than one input sample,

    # then replace the above -V line with:

    # -V my_gvcf1.gvcf -V my_gvcf2.gvcf -V my_gvcf3.gvcf


    Using the intermediate GenomicsDB database as input, let''s call the SNV and indel
    variants.


    ```

    input_directory=my_genomics_db_directory

    outfile=my_gvcf.gz

    ref_fasta=GCA_000001405.15_GRCh38_no_alt_analysis_set.fasta

    gatk_dbsnp=Homo_sapiens_assembly38.dbsnp38.vcf.gz


    gatk GenotypeVCFs \\

    -R "$ref_fasta" \

    -O "$outputfile" \

    -D "$gatk_dbsnp" \

    -G StandardAnnotation \\

    --only-output-calls-starting-in-intervals \

    --use-new-qual-calculator \

    -V gendb::$\${input_directory}

    ```


