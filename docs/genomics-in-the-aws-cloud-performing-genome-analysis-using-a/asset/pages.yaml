  md: '# Commercial Sequencing Services


    As you survey the Web, you will find that there are several popular consumergrade
    genome sequencing services, including 23andMe, Ancestry, and MyHeritage. Others
    include the:


    +   - African Ancestry: This service is marketed to Africans and people of African
    heritage. Some users have regretted that the service does not show DNA broken
    down by origin in the various regions of the African continent.

    - Athletigen: This service focuses on markers related to physical fitness, such
    as those affecting endurance and speed of recovery after exertion.

    - DNAFit: This service provides diet plans designed around certain nutritionrelated
    markers.

    - Fitness Genes: This service offers training regimes that fit genomic markers
    to physical exertion.

    - GEDmatch: This service focuses on genealogy and links with others who have submitted
    their sequences.

    - Genome Link: This service provides information on a series of characteristics,
    such as physical endurance and skin color.

    - Genpalate: Focused on nutrition, this service aims to help its customers optimize
    their diets.

    - Living DNA: This is an ancestry-focused service with a user community primarily
    from the United Kingdom and Ireland.

    - MyHeritageDNA: Ancestry focused, this service connects its users with possible
    relatives and suggests genetic risks to health.

    - Nebula Genomics: Offering a monthly subscription that entitles users to monthly
    updates as new information becomes available, this service includes data on the
    oral microbiome (i.e., the bacteria found in your saliva).

    - Prometheus: This is a modestly priced service that detects a number of single
    nucleotide polymorphisms (SNPs, or “snips”.

    - Sano Genetics: This free service concentrates on SNPs related to autism and
    mathematical reasoning.

    - SelfDecode: This is a general-purpose detector of several thousand genetic markers.

    - Vitagine: Focused on fitness and athletic performance, this service includes
    ancestry information as well.

    - Xcode Life: This service offers several low-cost specialty tests including one
    on skin care and another on metabolic diseases.'
