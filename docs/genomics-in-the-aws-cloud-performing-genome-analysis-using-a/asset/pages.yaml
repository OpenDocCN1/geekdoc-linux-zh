    corresponds to the part of the insert that was unsequenced. If we click any read,
    a window pops up that presents the following information:


    +   - The length of the read: The target read length is specified at sequencing
    and is usually 100 or 150 bp. In practice, the read length can vary slightly.
    Here, the vast majority of reads have a length of 101 bp.


    +   - The length of the insert: This is quite variable as it is affected by the
    fluctuation in size of the original DNA fragments. The insert sizes vary between
    200 and 400 bp.


    +   - The mapping quality (MAPQ) of the read: The mapping quality of a read equals
