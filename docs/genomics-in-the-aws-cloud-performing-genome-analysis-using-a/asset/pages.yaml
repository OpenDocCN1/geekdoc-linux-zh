    Now that you have the reference files required for BQSR, let''s run the two steps
    of BQSR.


    ```

    infile=my_bam_markup_sort_tags.bam

    outfile=my_bam_bqsr.bam

    ref_fasta=GCA_000001405.15_GRCh38_no_alt_analysis.set_fa

    out_bqsr_table=my_bam_bqsr.table

    ```


    ```

    dbspn=Homo_sapiens_assembly38.dbspn18.vcf.gz

    known_indels=Homo_sapiens_assembly38_gold_standard.indels.vcf.gz

    gold_std_indels=Mills_and_1000G_gold_standard.indels.hg38.vcf.gz

    ```


    ```

    # BQSR Step 1 - building a model by comparing the existing bam file with

    known true variants

    gatk BaseRecalibrator -R "$ref_fasta" \

    -I "$infile" \

    --use-original-qualities \

    --known-sites "$dbspn" \

    --known-sites "$gold_std_indels" \

    -O "$bqsr_table"

    ```


    ```

    # BQSR Step 2 - applying the model to produce a new BAM file having

    adjust nucleotide quality scores

    gatk ApplyBQSR \

    -R "$ref_fasta" \

    -I "$infile" \

    -bqsr-recal "$out_bqsr_table" \

    --static-quantized-quals 20 \

    --static-quantized-quals 30 \

    --add-output-sam-program-record \

    --create-output-bam-index \

    --create-output-bam-md5 \

    --use-original-qualities \

    -O "$outfile"

    ```


