  md: '![](img/f11d8c1d6b76e74ec2235e2ddebf829b_49_0.png)


    Figure 2.6: Family pedigree


    The following are: the main modes of inheritance:


    +   - Autosomal dominant: A single SNV inherited from one parent can cause the
    condition, and the normal version inherited from the other parent cannot compensate
    for it. On the family pedigree: affected individuals usually have an affected
    parent. The SNV-associated phenotype occurs in every generation. Familial hypercholesterolemia
    is example of autosomal dominant condition.


    +   - Autosomal recessive: The SNV needs to be inherited from both parents to
    cause the condition. On the family pedigree, both parents of the affected individuals
    are carriers. It''s a condition typically not seen in every generation. Cystic
    fibrosis and sickle cell anemia are examples of autosomal recessive conditions.


    +   - X-linked dominant: The SNV is located on the X chromosome, and one copy
    of the SNV is enough to cause the condition. So, men and women can be equally
    affected. Affected men pass the condition to all their daughters but not to their
    sons.


    +   - X-linked recessive: The SNV is located on the X chromosome, and the presence
    of a normal version of the gene can rescue the phenotype. Males have only one
    X chromosome and will be affected if they have the SNV. Females have two X chromosomes
    so are less likely to be affected. Hemophilia A is one example.


    +   - Y-linked SNV on the Y chromosome: This condition is passed from father to
    son.'
