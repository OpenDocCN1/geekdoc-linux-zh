  md: '# Chapter 3 ■ Obtaining Your Genome 35


    # Shipping the Sample


    Once you have secured your sample in your vacuette, give it a gentle shake to
    ensure that the preservative is mixed with the blood. Then, put it in a refrigerator
    to cool it off. (Do not freeze it.) The idea is that the sample will last longer
    if it''s kept cool.


    We had ship our samples to the laboratory in Hong Kong, a trip of about 36 hours
    from Sydney to Manila by the usual “overnight” courier services. We wanted our
    sample to arrive as cool as possible, but we didn''t want to use dry ice (which
    complicates shipping) or messy water ice. We had to think of an alternative solution.


    In case, we purchased a vacuum-insulated metal drink bottle with 500 mL capacity
    and a wide mouth (Thermos is one brand name, but there are plenty of good-quality
    makers). We cooled the bottle overnight in our freezer. Meanwhile, we bought a
    small quantity of what are called glass stones or vase fillers, which are flattened
    glass beads intended to secure the bases of dried and artificial flowers in an
    arrangement. Don''t get confused with "florist''s beads," which are soft polymer
    beads that retain water and can supply an arrangement of cut flowers with moisture
    for an extended time—you don''t want those. You could use any kind of glass beads
    or dense polyurethane beads. We put the glass stones in the freezer to cool down
    well.


    The idea was based on the ideas of thermal mass and thermal inertia. The concept
    is that some materials are slow to change temperature (they have a high specific
    heat), and objects surrounded by those materials could be kept at a certain temperature
    for a relatively long time. Think of a piece of aluminum foil, heated in a flame.
    Aluminum foil has a low specific heat. It''s hot when removed from the flame,
    which quickly cools down when exposed to room-temperature air. In contrast, a
    rock (with relatively high specific heat) heated at the bottom of a campfire and
    removed from the coals will retain its elevated temperature for some time in the
    ambient air.


    We took the cooled vacuum bottle and filled it halfway with some of the chilled
    glass stones, nestled in its bag, into them. We refilled the remainder of the
    insulated bottle with glass stones, sealed the top, and put the whole thing into
    the refrigerator to stay cool while we got ready to go.


    For the trip to the airport (a drive of about an hour in Sydney''s summer heat),
    we packed the vacuum bottle with the sample and stones inside an ordinary picnic
    cooler with cold packs. This was probably overkill. Whether the exterior of the
    vacuum bottle was exposed to ambient air an hour earlier or later wasn''t going
    to make a huge amount of difference, but we wanted to give it the best possible
    chance of arriving in Hong Kong in top condition.'
