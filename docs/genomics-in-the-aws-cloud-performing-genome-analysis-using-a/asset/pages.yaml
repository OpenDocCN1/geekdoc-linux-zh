    # Privacy


    Before you sit with a company that provides genomic genome sequencing, read carefully
    the fine print in terms of confidentiality of produced genomic data. Some companies
    provide low prices as they sell information from the de-identified genomes to
    pharmaceutical companies or other institutes. This is not bad in itself and can
    contribute to better cures, but it needs to be transparently agreed upon both
    sides. More expensive providers provide complete genomic data confidentiality.


    # Humility and Levelheadedness


    The more we explore the human genome, the more we discover new levels of complexity:
    16 years after the completion of the first half of the human genome, we still
    do not understand the function of half of the human genes. The “junk DNA” anymore;
    it is littered with regulatory regions and is widely transcribed, whereas it was
    previously thought to be silent. New levels of regulation of the genome are discovered
    every few months. Scientists still widely disagree on the overall proportion of
    the genome that is functional.(The range varies between 15 percent and 80 percent.)


    In the past, sequencing focused on the sick. Now that more and more healthy people
    are being sequenced, we found that mutations thought to be deleterious are in
    individuals living long lives. Our genomes and our cells have a lot of redundant
    mechanisms that help them cope with mutations. With the exception of Huntington’s
    disease, which is a catastrophic disease that can be predicted with high accuracy
    from specialized genetic testing, most mutations or gene variants can only produce
    an increased risk and require additional mutations (genetic background) and environmental
    factors to actually produce disease. In other words, relax the very well-known
    APOE gene variant, associated with Alzheimer’s disease, which only moderately
