    to a reference genome, prefer to use desktop genome visualizers such as Integrative
    Genomics Viewer (IGV; www.bioinstitute.org/igv), Integrated Genome Browser (IGB:
    bioviz.org), JBrowse (jbrowse.org), Tablet (ics.hutton.ac.uk/tablet), or Artemis
    (www.sanger.ac.uk/tool/artemis). IGB was released in 2001 and is one of the oldest
