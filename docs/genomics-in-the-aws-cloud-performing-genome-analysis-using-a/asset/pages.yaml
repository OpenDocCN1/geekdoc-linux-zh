  md: '# Grep


    Very often in genomics work, you will want to pick lines and sections of interest
    out large text files. For example, you might want to learn where a particular
    sequence of nucleotides appears in a whole-genome sequence. grep is a useful utility
    that searches for text in a file and returns the line where there is a match.


    ```

    $ grep HomoSapiens myfile.txt    # Returns lines with the word

    HomoSapiens

    $ grep -i HomoSapiens myfile.txt    # Same, but makes the search

    case insensitive

    ```


    We can do the opposite and search for lines without text.


    ```

    $ grep -v HomoSapiens myfile.txt    # Returns lines without the word

    HomoSapiens

    $ grep -c HomoSapiens myfile.txt    # Counts the number of lines with the

    word HomoSapiens

    ```


    Grep can use Linux regular expressions, as follows:


    +   * represents the beginning of a line.

    * identifies the end of a line.

    * Characters inside brackets, [ ], constitute bracket expressions. For example,
    the bracket expression [aou] matches cat, cot, and cut.

    * A range expression such as [5-7] matches c5, c6, and c7.

    * The dot (.) represents any single character except a new line.

    * ? corresponds to zero matches or one match.

    * represents one or more matches.


    How do easily count the number of sequences in a FASTA file? The FASTA sequences
    start with > at the beginning of a line, so grep counts the number of lines with
    >.


    ```

    $ grep -c "*" reads.fa

    ```


    # Pipes and Redirection Operators


    Pipes, represented by the character |, enable you to send the output of one program
    to another program as input. For example, the following command visualizes a BAM
    file; passes the output to the cut utility, which cuts the sixth column (to extract
    the CIGARS—that is, alignment reports for each read);'
