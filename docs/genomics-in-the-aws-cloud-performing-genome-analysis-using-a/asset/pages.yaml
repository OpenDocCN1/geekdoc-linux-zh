  md: '**DNA methylation:** If DNA is treated with the chemical bisulfite, the methylated
    cytines are left untouched while the unmethylated cytines are converted to uracil.
    The sequencing of the DNA reveals the position of all methylated cytines throughout
    the genome. This technique is called *whole-genome sequencing* (WGBS). A cheaper
    and more popular alternative, particularly in the clinic, is to hydrate the bisulfite-treated
    DNA to a microarray; the most popular methylation array is the MethylationEPIC
    array from Illumina, which allows the quantification of methylation at up to 850,000
    CpG sites.


    **Histone marks:** These are studied by the technique chromatin immunoprecipitation-sequencing
    (ChIP-seq). Cells are treated with formaldehyde to link DNA with all proteins
    bound to it (such as histones and transcription factors). The histone marks are
    identified (“immunoprecipitated”) by adding antibodies to the histone marks of
    interest. The DNA is sequenced and corresponds to the areas where the histone
    marks of interest are located on the genome. If antibodies specific to transcription
    factors are used instead, this technique allows determining where transcription
    factors bind in the genome.


    Note that the Nanopore sequencing platform can allow users to perform WGS and
    study DNA methylation in one step, as methylated cytosines trigger a different
    signal as they travel through a nanopore. The drawbacks are a high error rate
    in false positive (false call false of methylated C when it is unmethylated) versus
    WGS.


    # Mechanisms of Cancer


    Cancer to be seen as a genetic disease of bad genes (oncogenes) against good genes
    (tumor suppressors). It has become progressively clear that it is much more complicated.
    It is difficult from the genome alone to differentiate a cancer tumor from a benign
    tumor, or from aged tissue. A recent study analyzed the excess skin from individuals
    who underwent cosmetic surgery. Scientists were surprised to see the sun-aged
    skin of these individuals had oncogene mutations that most were specific to cancer
    (Marticore et al., 2015). Robert Weinberg and Douglas Hanahan published in 2000,
    and revised in 2011 and 2022, a landmark article on the markers of cancer. In
    this article, Weinberg went beyond the oncogene/tumor suppressor dichotomy and
    summarized the cellular and biological mechanisms behind cancer. Although nature
    imperfect and always a work in progress, it is always an excellent basis for explaining
    cancer mechanisms.


    Figure 12.1 shows the main hallmarks of cancer, as defined by the 2022 revision
    of the landmark publication of Weinberg and Hanahan. Note that of the 14 hallmarks,
    also apply to benign tumors, and only one is specific to cancer: invasion and
    metastasis.'
