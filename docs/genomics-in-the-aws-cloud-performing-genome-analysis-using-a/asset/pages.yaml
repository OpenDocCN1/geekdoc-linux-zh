    chromosome, but the repairs are imperfect. As a result of this single event, the
    chromosome can display displays, deletions, inversions, translocations, and copy
    number variations. Chromothripsis is rare in the germline and causes congenital
    disease. In contrast, it occurs in about 40 percent of cancers, with the highest
    frequency in sarcomas (70–100 percent), melanomas, glioblastoma (brain tumor of
    glial cells), and lung adenocarcinomas (about 50 percent for each).


