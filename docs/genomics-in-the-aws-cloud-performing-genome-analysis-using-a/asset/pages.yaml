  md: '# Chapter 2 = Crash Course in Molecular Biology 13


    the area where the chromosome was attached to the fibers to be pulled apart from
    the poles of the cell mitosis. The ends of each chromosome contain a chain of
    repetitive letters. For humans and other vertebrates, the sequence is AGGGTT (TCCAA
    on the complementary strand), repeated about 2,500 times in humans. These are
    telomeres, and their role is to protect the ends of our chromosomes from damage
    or fusing with other chromosomes. Limitations in the DNA replication machinery
    cause them to shorten at each cell division. In addition, oxidative stress and
    free radicals can shorten telomeres. When telomeres are too short, cells stop
    dividing and enter a state senescence. Senescent cells send inflammatory signals
    and are associated with aging and disease.


    The upper half of each chromosome, which is shorter, is the p arm (p for "petit,"
    French for small). The lower, or longer, part of the chromosome is named the q
    arm. The chromosome arms have been further divided into bands and sub-bands. For
    example, 13p11.2 refers to chromosome 13 p arm, band 11, sub-band 2. On browsers,
    chromosomes are represented horizontally, with the p arm conventionally placed
    on the left.


    How does our genome evolve during our lifetime? At birth, all cells have the same
    genome. The exception concerns rare cases of mosaicism, where an individual has
    the same mutation in a certain part of the body, often due to the mutation occurring
    at an early embryonic stage in a subset of their cells. So, in most cases, all
    cells at birth have the genome, which is the replica of the genome of the initial
    fertilized egg produced by biological parents. Because the egg and sperm that
    generated our first cell are called germ cells, our birth genome is called our
    germline genome. As we age, we progressively accumulate mutations, such as UV-induced
    mutations in our skin, pollutant-induced mutations in our lungs, or cancers. The
    genomes of these tissues have significantly drifted from the original genome and
    are called somatic genomes. The genome analysis methods slightly differ between
    germline and somatic genomes, but it is important to understand the difference.


    # DNA at Work: RNA and Proteins


    DNA is a repository of information and does not do anything by itself. But it
    can be read and acts as a template to produce RNA and proteins, which are the
    workhorses in our bodies. The production of RNA from DNA is straightforward and
    is called transcription, whereas the generation of protein from RNA is more complex
    and is called translation. We need at this stage to introduce the notion of gene,
    which is a string of letters in our genome that codes for a functional unit.


    How many genes do we have? The question is hotly debated and depends on the definition
    of a gene. The definition of a gene used to be based on the central'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# Chapter 2 A Crash Course in Molecular Biology


    dogma of molecular biology: the DNA of a gene is the template for producing RNA,
    which is then translated into protein. We have about 20,000 protein-coding genes,
    from a prior evaluation of 30,000 before the completion of the sequencing of the
    first human genome. However, we now know that our genome is widely transcribed
    and includes more than 15,000 noncoding genes, which are genes that produce RNA,
    which is never translated (called non-coding RNA, or ncRNA). The function of many
    of these ncRNAs is unknown. Some ncRNAs help translate RNA into proteins, while
    many regulate the transcription of genes.


    The transcription of DNA into RNA is performed by the enzyme RNA polymerase. DNA
    is always read from 3'' to 5'', and synthesized from 5'' to 3''. If the gene is
    in the Plus strand, the enzyme transcribes the Minus strand, which is identical
    to the original gene DNA sequence (see Figure 2.3). However, there are two differences:
    thymine (T) is replaced by uracil (U), and the sugar is ribose—the reason for
    that nucleic acid. Note that RNA is composed of a single strand


    If the RNA is to be translated into a protein, it is further processed into a
    messenger RNA (mRNA). First, a chemical group is added at its 3'' end and a polyA
    sequence at its 5'' end. Second, the introns, and possibly some exons (alternate
    splicing), are spliced out. The mRNA leaves the nucleus of the cell and is translated
    into a protein by proteins called the ribosome. The mRNA is read three letters
    at a time.'
