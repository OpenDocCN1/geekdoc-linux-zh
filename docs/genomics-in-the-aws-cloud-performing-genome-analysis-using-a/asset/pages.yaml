- img_proc: true
  md: '# Chapter 9 Visualizing the Genome


    reasonably apart in the DNA fragment of the individual but were separated by a
    sequence that is unique to this individual and absent from the genome reference.
    As a consequence, the reads are very close to each other when mapped to the genome
    reference or can even overlap.


    Figure 9.19 shows an isolated reads in a darker color with an insert greater than
    500 bp. This is not enough evidence to call a deletion event. In true deletion
    event, several reads pairs are in a darker color across the same genomic location,
    and the coverage significantly drops as the aligner is struggling to map the reads
    around the deletion. Same rules apply for insertion events.


    ![](img/f11d8c1d6b76e74ec2235e2ddebf829b_257_0.png)


    **Figure 9.19:** An indication that the aligner is having trouble mapping a sequence


    As shown in Figure 9.19, the paired reads should be oriented inward. If the paired
    reads are both oriented toward the right or toward the left, this can correspond
    to an inversion. An *inversion* is a large section of DNA that is reversed in
    the sequenced individual compared to the reference genome. If the paired reads
    are both oriented outward, a duplication or translocation might have occurred
    in the sequenced individual compared to the reference genome.


