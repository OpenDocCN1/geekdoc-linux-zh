    Reserved Instances If you can commit to a longer period (from a year to three
    years), AWS offers a discount on what are otherwise the same as on-demand instances.
    Subcategories of reserved instances include standard reserved instances (which
    are suited for always-on) and are the most deeply discounted kind and convertible
    reserved instances (which are functionally similar to standard reserved instances,
    except that they allow instance types to be modified or upgraded over time.


    Scheduled Instances Also called reserved instances, these instances go on- and
    offline according to a schedule you configure. Scheduled instances are not as
    deeply discounted on a per-second basis as standard and convertible reserved instances,
    which are meant for full-time operation. On the other hand, they allow for scheduling
    other than full time—for example, you might set up a reserved instance to run
    for a few hours every day to do a batch job. You have to commit to a full year
    of a schedule to get the instances at a discount. Instances are like this for
    regular, automated tasks, as doing a nightly summary of transaction data. They
    are less useful for scientific work, such as genome analysis, which often requires
    interactive and varied work under the control of a researcher.


    Spot Instances A spot instance is one that comes to life when AWS capacity availability
    is such that the company can provide the kind and quantity of EC2 instances you
    need at a particular price per hour. This is where cloud computing really shines,
    because it limits waste—EC2 instances and the computing power to run them, which
    would have otherwise idle, can be put to jobs that are less critical. When AWS
    has extra computing, it spins up spot instances, enabling the jobs running on
    those instances to move ahead. When there is an increased requirement for on-demand
    computing—people with reserved instances beginning turn on their VMs or it is
    time for scheduled reserved instances to start up—spot instances can be shut down.
    To compensate for this on-and-off behavior and the fact that there is no guarantee
    that an instance will be running at a given moment, users of spot instances are
    given deep discounts—70 percent or more below on-demand prices. This is the lowest-cost
    option of all the EC2 run modes and is suitable for the kinds of batch processing
    that genomics workflows sometimes require.'
