    # # Configuring Your Account Securely


    When you created your account, what you established is what the root user. The
    root user is essentially the ultimate administrator of your account. That user
    has access to absolutely everything and can create, remove, or alter any aspect
    of the account. While the so-called "god account" is super-handy and it may seem
    like the easiest way to get things done is to log in under that account,'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# 96 Chapter 6 Building Your Environment in the AWS Cloud


    doing so is considered poor practice. For one thing, it is easy to make mistakes.
    There is nothing to stop the root user from say, deleting a critical set of data
    or destroying an EC2 virtual machine. Furthermore, the root account for everyday
    tasks means the account is much more “out there” and exposed to malicious hacking
    attempts. Black-hat hackers love getting administrative access, for reasons that
    should be obvious.


    ![](img/f11d8c1d6b76e74ec2235e2ddebf829b_123_0.png)


    Figure 6.23: The new bucket in the list of all buckets


    Therefore, good practice demands that we use the root account to create other
    accounts for each user of the system (both human and programmatic), each with
    a level of access and privilege appropriate to what they need to do—enough and
    no more.'
  merge: -1
  pgno: 123
