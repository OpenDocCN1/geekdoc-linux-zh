  md: "# Chapter 8 Processing the Sequencing Data\n\nAs mentioned in Chapter 4, the\
    \ tab-delimited entry indicates the sequence identifier (identical for the two\
    \ paired reads, so this read maps and its mate), the chromosome and position in\
    \ the chromosome this read maps to, the same information for this read's mate,\
    \ a CIGAR field, a flag, a mapping quality score, and the length of the original\
    \ fragment.\n\nHere, our example sample maps to chromosome 7 at position 117559573,\
    \ and its mate maps to the same chromosome (the = field) at position 117559783.\
    \ The CIGAR 67M3D83M indicates that 67+3D nucleotides perfectly match (M) the\
    \ genome with a 3bp deletion (D) in the middle. The flag 99 means this is the\
    \ first read of the pair and both reads are mapped. The mapping quality score\
    \ of 60 (top score) indicates excellent mapping quality, and the fragment size\
    \ is estimated to be 400 nucleotides, which is in the normal range.\n\nThe definition\
    \ of BAM files is found on page 6 of the BAM file specification at samtools.github.io/hts-specs/SAMv1.pdf.\
    \ The flag values are explained at broadinstitute.github.io/picard/explain-flags.html.\
    \ Enter the sam_flag value, and let we explain that particular value.\n\n# Making\
    \ Adjustments and Refinements to the Aligned Reads in the BAM File\n\nWe broadly\
    \ follow the best practices developed and recommended by the Broad Institute and\
    \ use the Genome Analysis Toolkit (GATK) software to process the aligned sequencing\
    \ reads.\n\nLet's download and install the GATK software. Go to github.com/broadinstitute/gatk,\
    \ right-click the gatk zip file to copy the link address, and download the GATK\
    \ software package.\n\n```\nwget https://github.com/broadinstitute/gatk/releases/download/4.3.0.0/\n\
    gatk-4.3.0.0.zip\nunzip gatk-4.3.0.0.zip\ncd gatk-4.3.0.0\n -S README.md\n```\n\
    \nYou will see in the README.md file that GATK requires Java version 8. If you\
    \ don't already have Java 8, please install it.\n\n```\nsudo apt install openjdk-8-jre\n\
    ```\n\nThe best practices performing the MarkDuplicates step. is possible for\
    \ the sequenced fragment to sequenced more than once, as are PCR duplicates or\
    \ optical duplicates. The MarkDuplicates identifies these extra reads and marks\
    \ them as duplicates so that downstream processing can take that into account.\
    \ Why would we take this into account? One example is when the software is calling\
    \ a variant and has to decide whether the reads contain the variant and half the\
    \ reads contain the reference genome"
