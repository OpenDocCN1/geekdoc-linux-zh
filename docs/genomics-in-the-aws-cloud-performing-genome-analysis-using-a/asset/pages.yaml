    can be called as needed.


    Lambda functions are essentially executable modules of code (you can write them
    in Python, Node.js, C#, and Ruby, as well as Java, Go, and Windows PowerShell)
    that can be called from anywhere, security configurations permitting, and perhaps
    most often they are called in response to a triggering event. For example, an
    S3 bucket can trigger a Lambda function when a file is written or changed. Alternatively,
    a Lambda function can run on a schedule or be exposed for larger applications
    to call by means of an API gateway. With API gateways, you can build complex applications
    that are run in a distributed way, with Lambda functions by (for example) mobile
    apps, web pages, and traditional compiled desktop applications.


    The cost of Lambda functions is on a per-invocation basis, so there’s no need
    to maintain a server that might be substantially idle most of the time.


    # Workflow Management


    To coordinate multiple steps running asynchronously, you need a workflow management
    solution. AWS has three: AWS Batch, Step Functions, and the older Simple Workflow
    Service (SWF).


    # AWS Batch


    AWS Batch allows you to do the same things you can do with Linux shell scripts
    (.sh) and Microsoft Windows batch (.bat) files, which is to run processing jobs
    in coordinated groups (for example the output of one job as the input of the next
    job.


    Based on Docker containers, Batch coordinates the running of jobs on EC2 instances
    and can even optimize tasks to take advantage of lower spot pricing; you can specify
    that Batch runs a job only when computing power is available at or below a price
    threshold you specify. AWS Batch cost nothing in themselves. You pay only for
    the computing and other resources you control by means of AWS Batch.


    # AWS Step Functions


    Amazon Step Functions are concerned with sequences of tasks that must be performed
    asynchronously. That is, the actual execution of steps is carried out'
