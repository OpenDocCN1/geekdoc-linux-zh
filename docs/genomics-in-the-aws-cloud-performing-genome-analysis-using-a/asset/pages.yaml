  md: '# Chapter 6 Building Your Environment in the AWS Cloud 97


    To create secondary accounts, we need to use AWS Identity and Access Management
    (IAM). IAM is a service listed among the others in the AWS Console. You can look
    for it in the list under Security, Identity, and Compliance, but it''s probably
    quicker to search for it in the search box. Figure 6.24 shows the IAM main page.


    ![](img/f11d8c1d6b76e74ec2235e2ddebf829b_124_0.png)


    Figure 6.24: The IAM main page


    Note that the IAM dashboard page is warning us about our security status: only
    three of the five recommended actions have been implemented. (These three steps
    are carried out automatically as part of account setup) While we are here for
    the purpose of creating subsidiary users, we should take the opportunity to tighten
    our account''s security by working through the remaining two steps: multifactor
    authentication and establishing an AWS IAM policy.


    # Turning On Multifactor Authentication


    This is not a security textbook, but it is worth taking a look at why setting
    up AWS MFA is a good idea. If nothing else, security is an interesting topic and
    we are curious people.'
  merge: -1
