  md: '# # CHAPTER 9

    Visualizing the Genome


    In the previous chapter, we performed quality control steps on the FASTQ file
    delivered by the sequencing facility, and we aligned all the sequences of that
    file to the human genome reference. We are only halfway through our analysis,
    as we still have to, first, "call the variants" (that is, formally identify all
    the differences between our genome and the genome reference) and second, annotate
    these variants in order to find out their impact—such as, do they change the protein
    encoded by a gene? Are they common or rare? Benign or potentially pathogenic?
    And so far.


    Before moving to these next steps, it is helpful to visualize the result of the
    alignment of our genome to the human genome reference. It will help us to better
    understand the process of genome analysis, as well as how our genome works. We
    will use a genome visualizer for this step.


    # Introducing Genome Visualizers


    What is a genome visualizer? It is a graphical tool that allows you to visualize
    genomic data. The sequence of a genome is usually displayed as a horizontal line.
    Genomic data associated with that sequence is aligned to the sequence and organized
    as "tracks" above or below the genome sequence. For example, tracks can include
    RNA or protein information, DNA modifications, transcription factors binding sites,
    degree of complexity of the sequence, degree of conservation of'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# 212 Chapter 9 ■ Visualizing the Genome


    the sequence versus other species, or alignments of sequenced reads to that genome
    sequence.

    Some visualizers are particularly suited to browsing publicly available data,
    although they also allow you to import and visualize your own private genomic
    data. These visualizers use the UCSC Genome Browser (genome.ucsc.edu), the Ensembl
    Genome Browser (www.ensem.org), or the NCBI Genome Workbench (ncbi.nlm.nih.gov/tools/gbench).
    The UCSC Genome Browser is particularly popular, with several million hits a day.
    Large international projects, like the ENCODE, FANTOM, and GTEX projects, make
    their data as tracks in this browser. The ENCODE and FANTOM projects seek to describe
    the regulatory elements and transcriptome of the human genome; the GTEX project
    analyzed the transcriptome and quantitative trait loci (eQTL) of 54 tissues from
    1000 donors. In addition, the journal Nucleic Acids Research authors to create
    a track for reviewers, and some authors make these tracks available to the public.
    The UCSC Genome Browser is also available as a desktop application, called Genome
    Browser in a Box (GBIB).

    Figure 9.1 presents a view of the UCSC Genome Browser for the tumor necrosis factor
    (TNF) gene, when expressed promotes systemic inflammation. The TNF protein is
    targeted by several inhibitors to treat rheumatoid arthritis, including adalimumab,
    which is currently the largest pharmaceutical drug in the world.


