    CNVpy uses as input BAM file to calculate read depth. The names of the chromosomes
    must correspond to the names in the BAM file. CNVpy automatically detects the
    reference genome.


    ```

    # Extract information from BAM file

    ./cnvpy -root myfile.pytor -tree tumor.bam -chrom chr1 chr2 chr3 chr4

    chr5 chr6 chr7 chr8

    chr9 chr10 chr11 chr12 chr13 chr14 chr15 chr16 chr17 chr18 chr19 chr20

    chr21 chr22 chrX chrY

    ```


    ```

