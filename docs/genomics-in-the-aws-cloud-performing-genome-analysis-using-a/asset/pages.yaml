    # Running Programs in the Background


    Appending & to a command allows the command to be executed in the background.
    It is particularly useful if you launch a GUI program (such as the graphical editor
    gedit) from a terminal window. If & is not used in that case, the terminal window
    becomes unresponsive until you exit the GUI program.


    ```

    $ gedit myfile.txt &

    ```


    If you forget to type &, you can suspend the program with Ctrl+Z. You can then
    type in bg to put the program in the background (like if you had type &), and
    fg to return it to the foreground.

    If you need to launch one or several programs that will take a long time to run
    (very common in genomics), you can use the convenient screen command. Screen multiplexes
    terminal emulators into one.


    ```

    $ screen # start a new session

    $ ./myprogram.sh # launch a (long) program

    CTRL+a+d # detach from the session

    $ screen -r # reattach to the session

    ```'
