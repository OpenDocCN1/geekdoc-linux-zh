  md: 'An operating system is a program, or software, that interfaces with all basic
    hardware components of a computer and provides tools that enable you to use your
    computer. It is composed of the following:


    +   **A kernel**: The kernel is the core part of the operating system, which interfaces
    directly with the central processing unit (CPU), memory, hard disks, network adapters,
    and other hardware devices of your computer.


    Examples of kernels are the Windows kernel, the macOS kernel, and the Linux kernel.
    The Linux kernel is free and open source and was first developed in 1991 by a
    Finnish student named Linus Torvals. The Linux kernel shares many similarities
    with the Unix operating system, developed by Bell Labs at AT&T in 1969, and is
    available for free under the GNU (standing for "GNU''s Not Unix") General Public
    License.


    Most users do not interact with the kernel itself but through intermediary programs
    that call kernel functions, such as the intermediary programs listed.


    +   **A command-line interface**: This interface, also called the text-mode shell,
    enables you to type in commands to list, copy, or rename files; programs; etc.
    This command-line interface can be accessed in Linux or macOS by launching the
    program “terminal” or in Windows by typing `cmd` in your Windows taskbar. With
    Linux, several Linux command-line interfaces are available, such as the shell
    (sh), the Bourne Again shell (bash), and the Korn shell (ksh).


    +   **A graphical user interface (GUI)**: The GUI allows you to perform actions
    by manipulating icons and menus and using the functions of a mouse. Windows and
    macOS share with their very extensive GUI functions. Linux relies on a primitive
    GUI called X Windows System (named X). To extend this primitive GUI, several Linux
    desktop environments have developed that provide a better overall Linux environment,
    such as the K Desktop Environment (KDE) or the GNU Object Model Environment (GNOME).


    +   **Utilities**: These include text editors, file managers, programs to clean
    up or defagment disks, utilities to install or deinstall programs, etc.


    +   **Libraries**: Linux libraries comprise programming functions that are used
    by various programs.


    How does Linux differ from Windows and macOS? Linux, as already mentioned, is
    free and open source (meaning the source code of Linux is freely available), whereas
    Windows and macOS are commercial, proprietary operating'
