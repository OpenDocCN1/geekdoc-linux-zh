  md: '# Chapter 6 Building Your Environment in the AWS Cloud


    8. In the Add Storage step, we will set up the disks that are attached to our
    EC2 instance. We like to have at least two: one for the operating system itself
    and one or more additional partitions for binaries, working data, and everything
    else. Figure 6.13 shows how we specified a root volume of 10 gibibytes (not gigabytes,
    there is not much practical difference) and a second volume of 20 gigibytes.


    9. Click Next: Add tags to move ahead in the configuration wizard. Add tags page
    appears, as in Figure 6.14.


    Tags are most useful to people who manage a lot of resources on AWS. They provide
    a way to identify and search for components and to identify elements which work
    with others. Tags probably will not help with our small genomics research, but
    using tags is considered good practice and it is possible that we will have multiple
    EC2 instances at some point, we will use a tag to denote that this instance is
    for genomics. Note that the tag is applied to both the EC2 instance itself and
