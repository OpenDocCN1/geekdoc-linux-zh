    # Metagenomics


    Metagenomics refers to the study of genomes isolated from bulk samples, typically
    from environmental samples from the water, sea, or soil. These samples contain
    ecosystems of microorganisms that can be sequenced in bulk.


    Metagenomics can also apply to human samples. Communities of microorganisms including
    bacteria, viruses, and fungi live on our skin, in our mouth, and in our intestinal
    tract. Even our blood, which to be seen as sterile, harbors viruses as well as
    bacteria that have translated from our guts or lungs. When we sequence a human
    sample, whether a blood or saliva sample or a cancer tumor, all DNA present in
    the sample gets sequenced. All reads get mapped to the human genome reference,
    and the unmapped reads are discarded. Unmapped reads actually correspond to other
    organisms that were present in the sample at the time of sequencing and therefore
    were sequenced as well.


    All do these reads correspond to the time of the sample taking? No. The majority
    of unmapped reads map to water bacteria that are present in the laboratory reagents.
    Some reads correspond to artificial viral vectors that are commonly used in laboratories
    to transfer cells with genetic material. So metagenomics studies require strict
    quality control to detect these contaminations early in the processing pipelines.
    However, the study of unmapped reads can be very informative and detect microorganisms
    that contribute to disease.


    Metagenomics studies of bacteria and fungi usually involve specialized software
    that relies on a large database of sequenced bacteria and fungi and has algorithms
    to match sequences with organisms. Viruses can be studied the same way. However,
    as viral genomes are very small compared to bacteria and fungi, viruses can be
    studied by building a concatenated viral reference of all viruses sequenced and
    mapping the unmapped reads to this viral reference.


    Let''s first create the viral reference. After downloading all viral genomes from
    NCBI at www.ncbi.nih.gov/assembly, we can concatenate these genomes into a single
    viral reference.


    ```

    >cat * viral_reference.fa

    ```


    We use the samtools command to extract the unmapped reads from the sample to analyze.


    ```

    samtools view -f 0x04 -h -b original.bam -o unmapped.bam

    ```'
