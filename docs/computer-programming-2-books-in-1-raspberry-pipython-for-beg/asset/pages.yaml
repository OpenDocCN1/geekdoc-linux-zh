  md: '# Chapter Twelve


    # Minecraft Pi Edition


    You can find Minecraft Pi in the Games section by installing Raspian on your Raspberry
    Pi. Minecraft Pi is a bare-bones version of the popular survival game that aims
    to teach different programming languages to users.


    It''s fun, of course, but it''s not the Minecraft game that we have come to know
    and love. A community of users have found out how to install the full version
    of Minecraft on your Raspberry Pi 2 or 3, as with all things Raspberry Pi.


    There''s a lot of editing and tinkering with files and terminal commands, as with
    all things Raspberry Pi. Just make sure you take your time, read every move, and
    you should be okay.


    # Bear in mind


    There''s some stuff you should know before you dive in:


    You will need to understand the log-in details for your Mojang account, along
    with your Minecraft username. You will need a paid license for Minecraft, naturally.
    You can buy one from Minecraft.net


    Minecraft 1.8.9 is unique to the guide. However, the newest edition, officially
    1.9.4 (more on this below), can be run with a quick tweak. Running Minecraft is
