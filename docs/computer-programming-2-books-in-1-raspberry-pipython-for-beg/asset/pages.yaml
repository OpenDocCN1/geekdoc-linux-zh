    Enter the following command from the terminal to take a picture

    when the camera module is attached and enabled:


    The camera was placed upside-down in this example. If the camera is

    positioned in this location, it is important to flip the picture to

    appear in the correct way.


    Flip vertical and flip horizontal


    The picture must be rotated 180 ° to view correctly with the camera

    positioned upside-down. By passing the -vf and -hf flags, the way to

    correct this is to add both a vertical and a horizontal flip:


    Now the photo has been properly recorded.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# The Resolution


    At a resolution of 2592 x 1944, which is 5,038,848 pixels or 5 megapixels, the
    camera module takes photographs.


    # Width of File


    There will be about 2.4 MB for a picture taken with the camera module. This is
    around 425 GB of images.


    It will take up to 1 GB in about 7 hours to take 1 photo per minute. This is a
    pace of around 3.3 GB per day or 144 MB per hour.


    # Script from Bash


    You can build a Bash script which uses the camera to take an image. Open your
    editor of choice to construct a script and write the following sample code:


    ```

    #! About /bin / bash

    DATE=$(date +"percent Y- percent m- percent d H percent M")

    ```


    This script will take an image and use a timestamp to name the file. By building
    the camera folder, you''ll also need to make sure the route exists:


    MKDIR Camera Camera

    Say we saved it as camera.sh, so we''d make the file executable:

    + x chmod camera.sh

    Run then with:

    The./camera.sh


    # More choices


    For a complete list of choices, run raspistill without any arguments. Retransfer
    stderr to stdout to scroll and pipe the output to less:


    Raspistill 2>&1 smaller


    # RASPIVIDL OPTIONS'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'Raspivid is a video capture command line tool with a Raspberry Pi camera module.


    # Raspivid Simple Use


    Record a video using the following command when the camera module is attached
    and enabled:


    ```

    -o vid.h2644 raspivid

    ```


    Remember to use -hf and -vf, such as raspistill, to flip the image if necessary.


    This will save a video file of 5 seconds to the path provided here as vid.h264
    (default time length).


    # Specify video length


    Pass the -t flag with a number of milliseconds to determine the length of the
    video taken. For instance:


    ```

    Raspivid -o video.h264 -t 1000000

    ```


    It will record a video for 10 seconds.


    # More choices


    Run raspivid with no reasons for a complete list of potential choices, or pipe
    this command with less and scroll through:


    Raspivid 2>&1 Smaller


    Scroll and type q to exit using the arrow keys.


    # Image Format for MP4


    As a raw H264 video stream, the Pi captures video. Unless it is "wrapped" in an
    appropriate container format like MP4, many media players may fail to play it,
    or play it at an incorrect pace. Using MP4Box is the best way to get an MP4 file
    from the Raspivid button.


    Download the MP4Box using the following command:


    ```

    Download sudo apt -y gpacac install.

    ```'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'Capture your raw video with Raspivid and package it like this in an MP4 container:


    # Record 30 seconds of 640x480 raw video with a bit rate of 150kB / s in a pideo.h264
    file:


    ```

    Raspidvid -t 30000 -w 640 -h 480 -fps 25 -b 1200000 -p 0,0,640,480 -o Pideo.h260,480

    ```


    # RAW video bundled in an MP4 container:


    Pideo.h264 pideo.mp4Box -add pideo.h264 pideo.mp4Box


    # Delete the raw file from the source, leaving the remaining pideo.mp4 file to
    play.


    ```

    Pideo.h2644rm rm

    ```


    Alternatively, wrap your current Raspivid output around MP4'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# # Appendix C: HDMI Display Modes


    Options on composite video mode


    Sdtv mode for sdtv


    A TV standard used for composite video output is specified by the sdtv mode command.
    On the original Raspberry Pi, the RCA socket produces composite video. Composite
    video is output along with sound on the 4 pole TRRS (lensFlare) socket on other
    Raspberry Pi, except for Pi Zero and Compute Module. There is an unpopulated header
    called ''TV'' on the Pi Zero that outputs composite video. Composite video is
    accessible via the TVDAC pin on the Compute Module. The default sdtv mode value
    is 0.0.


    Outcome of sdtv mode


    +   0 NTSC NORMAL


    +   1 NTSC Japanese edition- no pedestal


    +   2 Regular Friend


    +   3 Brazilian PAL version-525/60 rather than 625/50, various subcarriers


    +   16 NTSC Progressive Scan


    +   18 PAL''s Progressive Scan


    Sdtv aspect


    The sdtv aspect command determines the composite video output aspect ratio. The
    value is 1. by default.


    Product of sdtv aspect


    +   1 4:3'
  merge: -1
  pgno: 259
- img_proc: true
  md: '2 14:9


    3 16:9


    # Sdtv-disable-colourburst


    Setting sdtv disable colourburst to 1 on composite video output disables colourburst.
    The image will be shown in monochrome but may be clearer in appearance.


    # Enable tvout (only Pi 4B)


    Composite performance is disabled on the Raspberry Pi 4 by default because of
    the way the internal clocks are interrelated and allocated. Since composite video
    requires a very specific clock, setting the clock on the Pi 4 to necessary means
    that other clocks linked to it are adversely affected, slowing down the entire
    device slightly. Since composite video is a less widely used feature, to avoid
    this device slowdown, we decided to disable it by design.


    Use the enable tvout=1 option to allow composite output. This will detrimentally
    affect performance to a limited degree, as mentioned above.


    The composite behavior stays the same on older Pi models.


    # Options for HDMI mode


    Note for Raspberry Pi4B users: Since there are two HDMI ports on the Raspberry
    Pi 4B, some HDMI commands can be applied to either port. You may use the command
    <:port> notation, where the port is 0 or 1, to define the port to which the setting
    should be applied. If no port is defined, o. is the default. If a port number
    is defined for a command that does not need a port number, the port will be ignored.
    For more information on the syntax and alternative mechanisms, please refer to
    the HDMI section in the Documentation Conditionals tab.


    The Raspberry Pi 4 has upgraded video hardware to accommodate dual 4k displays,
    which imposes slight limitations on the modes supported. For more info, please
    see here.


    Secure hdmi safe'
  merge: -1
  pgno: 260
- img_proc: true
  md: 'Try to boot with full HDMI compatibility, setting hdmi safe to 1 would lead
    to "safe mode" settings being used. This is the same as setting the parameters
    that follow:


    Hdmi force hotplug=1


    Hdmi ignore edid=oxa5000080


    Configuration-hdmi-boost=4


    Hdmi group=2


    Hdmi mode=4


    Disable overscan=0 Overscan=o


    Overscan-left=24


    Overscan-right=24


    Top-24 overscan-top=24


    Bottom=24 overscan


    # Hdmi ignore edid


    If your display does not have an accurate EDID, setting hdmi ignore edid to ox5000080
    allows the ignoring of EDID / display data. To ensure that it is not activated
    inadvertently, it needs this unusual value.


    #  Hdmi edid file


    Instead of reading it from the display, setting hdmi edid file to 1 would cause
    the GPU to read EDID data from the edid.dat file stored in the boot partition.
    There''s more stuff available here.


    #  Hdmi edid filename


    You may use the hdmi edid filename command on the Raspberry Pi 4B to define the
    filename of the EDID file to be used, as well as which port to apply the file
    to. To allow EDID files, it also needs hdmi edid file=1.


    For instance:'
  merge: -1
  pgno: 261
- img_proc: true
  md: 'File hdmi edid file=1


    Hdmi edid filename:o = FileForPortZero.edid FileName:o = FileForPortZero.edid


    Hdmi edid filename:1 = FileForPortOne.edid filename:1=


    Hdmi force edid audio


    Setting hdmi force edid audio to 1 pretends that the monitor supports all audio
    formats, allowing DTS / AC3 passthrough even when this is not recorded as supported.


    Hdmi ignore edid audio


    Setting hdmi ignore edid audio to 1 pretends that the monitor not accept all audio
    audio formats. This means the analog audio (headphone) jack will switch to ALSA.


    Hdmi force edid 3d 3


    Even though the EDID does not imply support for this, setting hdmi edid 3d to
    1 pretends that all CEC modes support 3D.


    Init hdmi ignore cec init


    During booting, setting hdmi ignore cec to 1 will avoid the initial active source
    message being sent. This prevents your Raspberry Pi from coming out of standby
    and channel-switching when you reboot a CEC TV.


    Hdmi ignore cec-cec


    Setting hdmi ignore cec to 1 pretends that the TV does not at all support CEC.
    There will be no CEC functions supported.


    Name of cec ossd name


    The cec osd name command sets the device''s initial CEC name. The Raspberry Pi
    is the norm.


    Encoding hdmi pixel


    The command hdmi pixel encoding forces the mode for pixel encoding. By default,
    the mode requested by the EDID will be used,'
  merge: -1
  pgno: 262
- img_proc: true
  md: 'so you do not need to change it.


    # Outcome of hdmi pixel encoding


    Default o (RGB for CEA minimal, RGB for DMT full)


    +   1 Minimal RGB (16-235)


    +   Total 2 RGB (0-255)


    +   3 Minimal YCbCr (16-235)


    +   4 Absolute YCbCr (0-255)


    # Hdmi blanking


    The hdmi-blanking command controls what happens when, using DPMS, the operating
    system demands that the monitor be put into standby mode to conserve power. The
    HDMI output is blanked but not turned off if this option is not set or set to
    0. You can also set the HDMI output to shut off by setting this option to 1 to
    imitate the actions of other computers: the attached monitor will go into a lowpower
    standby mode.


    Setting hdmi blanking=1 will not cause the HDMI output to be turned off on the
    Raspberry Pi 4, as this function has not yet been implemented.


    Note: When using applications that do not use the framebuffer, such as omplayer,
    this feature may cause problems.


    # Outcome of hdmi blanking


    +   o The HDMI output is blanked out


    +   1 You can turn off and blank the HDMI output


    # The hdmi drive


    The hdmi drive command allows you to choose between performance modes for HDMI
    and DVI.


    # Outcome of hdmi drive


    +   1 Normal mode for DVI (no sound)'
  merge: -1
  pgno: 263
- img_proc: true
  md: '2 Normal HDMI mode (if supported and allowed, sound will be sent)


    Configuration hdmi boost


    Configures the HDMI interface signal power. There is a minimum value of 0 and
    a maximum value of 11. For the original Model B and A, the default value is 2.
    For Model B+ and all later versions, the default value is 5.


    If HDMI problems (speckling, interference) are seen, then try 7. Up to 11 can
    require very long HDMI cables, but values this high should not be used unless
    absolutely necessary.


    On the Raspberry Pi 4, this option is ignored.


    The hdmi group


    The hdmi group command identifies either CEA (Consumer Electronics Association,
    the norm typically used by TVs) or DMT (Display Monitor Timings, the norm typically
    used by monitors) as the HDMI output group. You can use this setting in conjunction
    with hdmi mode.'
  merge: -1
  pgno: 264
