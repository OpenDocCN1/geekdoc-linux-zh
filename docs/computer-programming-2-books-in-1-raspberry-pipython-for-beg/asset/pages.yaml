  md: '# Tips for keeping the process as fluid as possible


    Here are some tips to make the process go as fast as possible:


    +   - Phase 1 does not extend to users of Raspberry Pi 3. You can''t overclock
    the Pi 3 at present. Moreover, the Pi 3 is actually quicker out of the box than
    the Pi 2 ''s suggested overclocking pace.


    +   - Use the arrow keys on your keyboard after entering the Phase 4 command to
    highlight Advanced Options and press Enter. Next, highlight the GL Options, and
    choose Allow.


    +   - In Step 7 of the guide that says to click "edit profile," you actually need
    to click Profile Editor, and then double-click the first (and only) listing. Under
    Version Selection, next to Use Version, press a dropdown and pick a build number.
    Bear in mind, the default of the guide is 1.8.9. Use that version right now, and
    then, once all works, we can change it.


    +   - Step 10 tells you, without further guidance, to edit the file "run.sh".
    To do this, open your Pi directory''s Minecraft folder and right-click the run.sh
    file, select Text Editor.


    You have two choices for choosing Minecraft. The guide tells you to use "./run.sh"
    to start Minecraft in the Terminal. While that works, you will need to enter "cd
    Minecraft" in the Terminal window before entering the button. Another option is
    to open the Minecraft folder, double-click the file run.sh, and then select "Run."


    Run the most recent edition


    All right, so you can start tinkering with the installation once you get it up
    and running. You''ll need to relaunch Minecraft.jar file in order to jump to the
    new version of Minecraft.


    +   1. Enter cd Minecraft in the terminal window


    +   2. First, please enter: java -jar Minecraft.jar Minecraft.jar


    +   3. Click the Profile Editor button and update the version to 1.9.4 (or whatever
    the most recent version is).'
