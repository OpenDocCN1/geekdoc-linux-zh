    wanted to find the word Händel in a text. You could search for the three variants
    ("Handel," "Händel" and "Haandel") separately, or you could find another word
    that "encodes" these variants. In this case, the word that is needed would be"H
    (a | ä | ae)". The vertical bar is a type of metacharacter used to separate'
