    uses a model where a parent node of information can have several children.

    - Network: An improvement of the hierarchical model that allows a child to have
    multiple parents.

    - ransactional: Whose sole purpose is the sending and receiving data at high speeds.
    These bases are very rare.

    - Relational: This is the model used today to represent real problems and manage
