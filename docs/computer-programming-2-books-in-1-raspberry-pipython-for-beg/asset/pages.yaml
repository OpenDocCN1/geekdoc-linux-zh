- img_proc: true
  md: 'There are a range of items to try if the camera module is not working correctly:


    +   - Is the ribbon cord, not the Monitor Serial Interface (DSI), connected to
    the Camera Serial Interface (CSI)? In either port, the ribbon connector will suit.
    The camera port is near the HDMI connector.


    +   - Are all the ribbon connectors securely seated, and are they round in the
    right way? They must be straight in their holes.


    +   - Is the Camera Module connector securely connected between the smaller black
    Camera Module itself and the PCB? This connection can come loose during transit
    or when placing the Camera Module in a case. Flip up the connector on the PCB
    using a fingernail, then reconnect it with gentle pressure. It engages with a
    very slight click. Don''t push it; it''s possibly slightly misaligned if it does
    not engage.


    +   - Have sudo apt and apt full-upgrade been upgraded?


    +   - Has raspi-config been executed and allowed the Camera Module?


    +   - Is your power supply adequate? The Camera Module adds between 200-250mA
    to your Raspberry Pi''s power requirements.


    Try the following if things are still not working:


    +   - Error: the command raspistill / raspivid is not found. This possibly means
    that somehow your update / upgrade failed. Again, try it.


    +   - Error: ENOMEM. The Camera Module does not start. Re-check all the links.


    +   -Mistake: ENOS. It is possible that the Camera Module will run out of GPU
    memory. In /boot/ folder, search config.txt. The choice for gpu mem should be
    at least 128. Alternatively, in the Advanced section of raspi-config, use the
    Memory Split option to describe this.


    If you''ve tested all the above problems and the Camera Module still doesn''t
    fit, try posting for more support on our forums.


