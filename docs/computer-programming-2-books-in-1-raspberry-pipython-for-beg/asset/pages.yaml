    # Metacharacters


    A regular expression can contain metacharacters, which are symbols that have special
    meaning when placed inside a regular expression. In the previous section, you
    have seen the metacharacter |, which is equivalent to the Boolean expression or
    is used to separate the alternatives of a word. However, there are many more metacharacters.
    Before we start with the Python examples, I''m going to show you some of the most
    common ones.


    +   - The metacharacter ''?'' indicates "at most one match" of the character that
    comes immediately before. Thus, the expression "obscure" corresponds to the words
    "dark" and "obscure". The expression "(re) Place would correspond to "place" and
    "reposition."


    +   - The metacharacter ''*'' indicates "zero or more matches" of the character
    that comes immediately before. Thus, the expression "01 * o" would correspond
    to the words 0, 010, 0110, 01110, 011110,


    +   - The metacharacter ''-'' works similar to the previous one, but indicates
    "at least one match". The expression "01 + o" would now correspond to the words
    010, 0110, 01110, 011110, 011111,


    +   - The metacharacter ''{n}'' indicates "exactly n matches" of the previous
    character. For example, the expression "ab {3} a" would correspond to the word
    "abba".


    +   - The metacharacter ''{n, m}'' indicates "between n and m matches". If the
    second space is blank, it means "at least n matches". Therefore, the expression
    "01 {2,4} o" would correspond to 0110, 01110, 011110, while the expression "01
    {2,} o" would accept the words 0110, 01110, 011110, 0111110, ...n


