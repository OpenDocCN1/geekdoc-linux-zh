  md: '# # Chapter Ten


    # ## Introduction to Scratch


    Scratch is based on a graphical user interface that makes it unnecessary for complex
    language syntax or general code-typing. The ability to help provide beginners
    with their first programming experience is first and foremost. This is why providing
    a range of functions still takes precedence over the factor of simple usability.
    However, despite these limitations, as the following list indicates, Scratch has
    some of the essential properties of conventional programming paradigms. There
    are:


    Visual: All Scratch elements are represented, for example, by an understandable
    graphical representation of program commands via image blocks. In addition, they
    can be inserted and placed together conveniently by drag-and-drop.


    Object-oriented: There are neither classes nor an inheritance scheme for Scratch
    programming. However, Scratch shows characteristics of the object-oriented programming
    concept with elements such as data encapsulation (controlled access to data through
    specified interfaces) or polymorphism (objects may assume different data types).


    Imperative: The imperative programming paradigm is accompanied by some of the
    scripts that are made available to you to program from Scratch. Instruction sequences,
    therefore, determine in which series what acts are to be performed.


    Event-oriented : As soon as the event specified in its header block occurs, any
    script that you use in a Scratch project begins. The loading of a project can
    also be postponed until the occurrence of a particular event by using a "Wait
    Until" block.'
