    # Why choose the Raspberry Pi and not anything else?


    The Raspberry Pi has a few competitors, but the foundation encourages individuals
    to clone the concept, so competitor might not be the right word. BeagleBoard and
    PandaBoard (which are both the companies'' names and their key devices) are included.
    They are also non-profit organizations, but with aims somewhat different from
    the Raspberry Pi Foundation. BeagleBoard targets all hardware tinkerers, and PandaBoard
    aims to provide a moderately priced mobile software-programming platform.


    Like Raspberry Pi, ARM processors are both exposed boards and capable of HD video.
    But there are more connectors and link headers (board bits that can be used by
    soldering additional hardware) on BeagleBoards and PandaBoards than on the Raspberry
    Pi, and both are bigger. The following are not comprehensive part lists, but here
    are some characteristics that vary from Pi:


    BeagleBoard and BeagleBoard-xMBoard:


    +   - Texas Instruments Cortex A8-based processor, running on the BeagleBoard
    from 600 MHz to 720 MHz (depending on version) and 1 GHz on the xM.


    +   - 128 MB RAM on the original BeagleBoard, but on the newer boards, 256 MB
    and 512 MB RAM, respectively.


    +   - Connector DVI-D display


    +   - S-video adapter


    +   - Audio (not all audio out) and in out'
