    # Introducing Raspbian


    Raspbian is a free Debian-based operating system designed for the Raspberry Pi
    hardware. The collection of basic programs and utilities which make your Raspberry
    Pi run is an operating system. Raspian, however, offers more than a pure OS: with
    more than 35,000 packages of pre-compiled software packed nicely for quick installation
    on your Raspberry Pi.


    In June 2012, the initial construction of more than 35,000 Raspbian packages designed
    for the best results on the Raspberry Pi was completed. Raspbian, however, is
    still being actively developed with a focus on enhancing the reliability and performance
    of as many Debian packages as possible.


    Note: Raspbian is not affiliated with the Base of Raspberry Pi. A small, dedicated
    team of developers who are fans of the Raspberry Pi hardware, the Raspberry Pi
    Foundation ''s educational objectives and, of course, the Debian Project, developed
    Raspbian.


    Use external computers for storage


    A device that holds all the addressable data storage of a computer is an external
    storage device, is often referred to as auxiliary storage and secondary storage.
    Removable or non-removable, temporary or permanent, and available over a wired
    or wireless network may be an external storage unit.'
  merge: -1
  pgno: 173
- img_proc: true
  md: 'External storage allows users to store data independently at a comparatively
    low cost from the main or primary storage and memory of a device. It increases
    storage space without having to open up a device.


    External storage is mostly used to store information that programs running on
    a desktop, laptop, server, or mobile device, such as an Android or iOS smartphone
    or tablet, have less regular access to.


    An external storage device for PCs mostly consists of stationary or portable hard
    drives (HDDs) or solid-state drives (SSDs) connected to or wirelessly through
    a USB or FireWire link.


    An external storage device can serve as primary storage linked to servers via
    Ethernet or Fibre Channel switches for businesses, as secondary storage for backup
    and archiving purposes. External storage provides block-based, file-based or object
    storage HDD, flash and hybrid storage arrays, or a combination of these three
    protocols known as unified storage. Examples of external storage storage area
    networks (SANs) for block-level storage and network-attached storage (NAS) systems
    for file-based storage.


    The transport of data between on-site and off-site computer systems is another
    common case for an external storage unit.


    When transferring vast volumes of data to the cloud, providers will also use external
    storage devices in a practice known as cloud seeding. It can take hours or days
    to transfer tens of terabytes of data over a network, clients put their data on
    an external storage device and send the device to their preferred provider for
    copying locally. Only modified data will travel through the network to the cloud
    for backup, archiving or disaster recovery (DR) purposes after the initial seeding.


