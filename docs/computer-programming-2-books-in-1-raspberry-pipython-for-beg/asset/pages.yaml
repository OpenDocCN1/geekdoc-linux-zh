    Samba is an SMB / CIFS networking protocol implementation that Windows devices
    use to provide mutual access to files, printers, serial ports, etc. A detailed
    Wikipedia page on Samba and its capabilities is open.


    This page will describe how to install a shared folder on a Windows computer so
    that it appears on your Raspberry Pi, or share a folder on your Raspberry Pi so
    that it can be accessed by a Windows client, using a subset of the Samba method.


    *Installing support for CIFS / Samba*


    Raspberry Pi OS does not provide CIFS / Samba support by default, but this can
    be added easily. All the necessary components to use Samba as a server or client
    are installed with the following commands.


    *Sudo Update Apt*


