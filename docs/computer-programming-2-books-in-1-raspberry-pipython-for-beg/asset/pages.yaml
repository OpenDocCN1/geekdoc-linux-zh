    # 4. Overclock your Pi


    You can adjust your Pi''s clock velocity and voltage to many different presets.
    It can cause instability to set the clock speed and voltage at higher rates than
    the specification, so do it in small increments and ensure good airflow around
    your Pi.


    Run this wizard if you see any apparent instability and set the clock speed back
    down to something slightly lower—repeat until your device is fully stable. After
    making this adjustment, it is also recommended to reboot your system. Keep the
    Shift key to disable overclocking temporarily.


