  \ Use --help for more information.\n```\n\n### gpg\n\nGNU 隐私守护工具 `gpg` 可用于创建公钥和私钥。这些密钥可以用于多项功能，包括加密文件以便文件数据在传输到另一个系统时更加安全。\n\
  \n第一步是使用 `gpg --gen-key` 命令创建加密密钥。该命令的运行是在 `~/.gnupg` 目录下的一组文件，这些文件可以用于加密数据或对消息进行数字签名。请参见示例\
  \ 33-6。\n\n**示例 33-6** `gpg --gen-key` 命令\n\n点击此处查看代码图像\n\n```bash\nroot@onecoursesource:~#\
  \ gpg --gen-key\ngpg (GnuPG) 1.4.16; Copyright (C) 2013 Free Software Foundation,\
  \ Inc.\nThis is free software: you are free to change and redistribute it.\nThere\
  \ is NO WARRANTY, to the extent permitted by law.\n\nPlease select what kind of\
  \ key you want:\n   (1) RSA and RSA (default)\n   (2) DSA and Elgamal\n   (3) DSA\
  \ (sign only)\n   (4) RSA (sign only)\nYour selection? 1\nRSA keys may be between\
  \ 1024 and 4096 bits long.\nWhat keysize do you want? (2048)\nRequested keysize\
  \ is 2048 bits\nPlease specify how long the key should be valid.\n         0 = key\
  \ does not expire\n<n>  = key expires in n days\n<n>w = key expires in n weeks\n\
  <n>m = key expires in n months\n<n>y = key expires in n years\nKey is valid for?\
  \ (0)\nKey does not expire at all\nIs this correct? (y/N) y\nYou need a user ID\
  \ to identify your key; the software constructs the user ID\nfrom the Real Name,\
  \ Comment and Email Address in this form:\n    \"Heinrich Heine (Der Dichter) <heinrichh@duesseldorf.de>\"\
  \n\nReal name: June Jones\nEmail address: june@jones.com\nComment: Test\nYou selected\
  \ this USER-ID:\n    \"June Jones (Test) <june@jones.com>\"\n\nChange (N)ame, (C)omment,\
  \ (E)mail or (O)kay/(Q)uit?O\nYou need a Passphrase to protect your secret key.\n\
  \nWe need to generate a lot of random bytes. It is a good idea to perform\nsome\
  \ other action (type on the keyboard, move the mouse, utilize the\ndisks) during\
  \ the prime generation; this gives the random number\ngenerator a better chance\
  \ to gain enough entropy.\ngpg: key 1946B1F2 marked as ultimately trusted\npublic\
  \ and secret key created and signed.\n\ngpg: checking the trustdb\ngpg: 3 marginal(s)\
  \ needed, 1 complete(s) needed, PGP trust model\ngpg: depth: 0  valid:   1  signed:\
  \   0  trust: 0-, 0q, 0n, 0m, 0f, 1u\npub   2048R/1946B1F2 2017-06-05\n      Key\
  \ fingerprint = 1D6A D774 A540 F98C EBF0  2E93 49D5 711C 1946 B1F2\nuid        \
  \          June Jones (Test) <june@jones.com>\nsub   2048R/FED22A14 2019-06-05\n\
  ```\n\n#### 可能会出现什么问题\n\n如果你收到“Not enough random bytes available. Please do some\
  \ other work to give the OS a chance to collect more entropy!”的消息，请继续操作你的系统，它最终会生成足够的随机字节。出现此错误是因为系统从随机内存（RAM）中的随机项生成加密密钥，而内存是根据系统操作进行填充的。如果你不急，可以尝试运行一个系统密集型命令，例如\
  \ `sudo find / -type f | xargs grep blahblahblah > /dev/null`。\n\n为了让用户能够加密数据发送给你，他们需要你的公钥。要将此公钥发送给用户，首先执行以下命令来创建一个公钥文件：\n\
  \n点击此处查看代码图像\n\n```bash\ngpg --output pub_key_file  --export 'June Jones'\n```\n\
  \n`--output` 选项用于指定公钥文件的名称。`--export` 选项用于指定你想发送的密钥。\n\n发送公钥后，接收用户通过执行以下命令将密钥导入他们的\
  \ GPG 数据库中（`pub_key_file` 是他们从你那里收到的文件）：\n\n```bash\ngpg --import pub_key_file\n\
  ```\n\n然后用户可以使用以下命令加密文件：\n\n点击此处查看代码图像\n\n```bash\ngpg --encrypt --recipient june@jones.com\
  \ data.txt\n```\n\n当文件加密后，可以使用系统上的私钥进行解密。\n\n### 安全警报服务\n\n安全警报服务提供当前安全问题的及时信息。以下是这些服务中的某几个：\n\
  \n- **BugTraq**：这是一项由 Security Focus (`www.securityfocus.com`) 赞助的服务。根据网站介绍，“BugTraq\
  \ 是一个关于安全漏洞详细讨论和公告的列表，介绍了漏洞是什么、如何利用以及如何修复。”要订阅该列表，请访问链接：[`www.securityfocus.com/archive/1/description.3`](http://www.securityfocus.com/archive/1/description.3)。\n\
  - **CERT**：广义而言，CERT 代表计算机应急响应小组。但在这种，它指的是一个特定的 CERT：位于卡基梅隆大学（CMU）的 CERT 协调中心（CERT-CC）。该组织是\
  \ CMU 更大组织软件工程学院（SEI）的一个组成。CERT 提供多种功能，包括漏洞分析工具、漏洞知识库以及关于安全问题的协调。访问 [www.cert.org](http://www.cert.org)\
  \ 了解更多关于该组织的信息。\n- **US-CERT**：美国 CERT ([www.us-cert.gov`](http://www.us-cert.gov))。网络安全与通信中心（NCCIC）位于该网站。根据网站介绍，US-CERT\
  \ 是“国家旗舰的网络防御、事件响应和运营集成中心”，其使命是“减少国家系统性的网络安全和通信挑战”。\n\n### 总结\n\n当涉及安全时，你会发现有更多内容需要学习。本章涵盖了一些在逻辑上不适合书中其他章节的安全主题。你发现了如何使用\
  \ `gpg` 工具加密文件以确保安全。你还学习了如何配置 fail2ban 和 OpenVPN。最后，你学习了可以提供有关安全问题重要信息的网站。\n\n####\
