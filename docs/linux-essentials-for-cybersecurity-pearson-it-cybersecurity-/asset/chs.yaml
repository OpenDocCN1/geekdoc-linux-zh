  \ | **Description** |\n| --- | --- |\n| **SSLEngine** | This directive allows you\
  \ to turn off (or on) SSL by setting it to `off` or `on`. |\n| **SSLCertificateFile**\
  \ | Until now the authentication described has been directional: The client authenticates\
  \ the server. However, you can set up a file that can authenticate the client. A\
  \ single file that contains all the Certificates of CA serves this purpose. If you\
  \ have such a file, use the `SSLCertificateFile` to specify its location. |\n| **SSLCertificatePath**\
  \ | Like the `SSLCertificateFile` directive, `SSLCertificatePath` is used to authenticate\
  \ client systems. Rather than place all the Certificates of CA into a single file,\
  \ you can place them in separate files in a directory. The `SSLCertificatePath`\
  \ directive is used to specify the location of this directory. |\n| **SSLProtocol**\
  \ | Recall that SSL can refer to either Sockets Layer or Transport Layer Security.\
  \ You can specify which protocol to use and which version of that protocol by using\
  \ the `SSLProtocol` directive. This is useful when you need to use an older protocol\
  \ for backward compatibility or for you want to use a specific protocol. Arguments\
  \ to the `SSLProtocol` directive include `SSLv2`, `SSLv3`, `TLSv1`, `TLSv1.1`, `TLSv1.2`,\
  \ and `ALL`. |\n\n\n\n\n\n| `ServerSignature` | 该指令与 Apache Web 服务器创建的文档有关。它用于创建包含有用调试信息的页脚。它可以被设置为\
  \ `On` 或 `Off`。该指令也使用 `ServerTokens` 指令向这些文档中添加服务器和操作系统信息。 |\n\n| `TraceEnable`\
  \ | SSL 跟踪用于调试。默认情况下，它通常是关闭的。使用带有 `On` 选项的 `TraceEnable` 指令启用 SSL 跟踪功能。 |\n\n##\
  \ 代理服务器\n\n`代理服务器` 是一种促进客户端与服务器之间通信的系统。根据代理服务器的设计，有几种不同类型的代理服务器以及不同的优势。不同类型的代理服务器包括隧道代理服务器、正向代理和反向代理服务器。\n\
  \n### 隧道代理\n\n这种代理设计用于作为两个网络之间的网关。例如，基于 IPv4 的网络需要与基于 IPv6 的网络通信时。请参见图 21-6 以获取隧道代理的视觉示例。\n\
  \n![Image](img/00083.jpeg)\n\n**图 21-6** *隧道代理*\n\n### 正向代理\n\n这种代理设计用于在通信的客户端工作。例如，网络浏览器可以指向代理服务器，而不是直接与\
  \ Web 服务器通信。通常，当人们称一个系统为代理服务器时，他们指的是运行作为正向代理的系统。请参见图 21-7 以获取正向代理的视觉示例。\n\n![Image](img/00084.jpeg)\n\
  \n**图 21-7** *正向代理*\n\n正向代理服务器可以提供几个关键功能：\n\n*   它可以通过阻止对外部资源的访问来充当过滤器。\n*   它可以充当客户端和服务器之间的缓冲区，因为服务器“看到”请求是来自代理的，而不是原始客户端。这可以隐藏原始客户端数据，例如其\
  \ IP 地址或位置。某些用户更倾向于这种方式，因为它允许匿名浏览。这对于绕过限制也非常有用（例如，仅允许特定地理区域访问的网站）。在这种情况下，位于正确地理区域的代理服务器可以允许所需的访问。\n\
  *   代理服务器可以缓存静态数据（例如具有静态网页的网站）。当多个代理客户端尝试检索相同的数据时，代理服务器可以通过直接返回数据来加速过程，而不是反复查询 Web\
  \ 服务器。\n*   代理服务器可以记录客户端活动。\n\n### 反向代理\n\n反向代理服务器是配置在服务器端的服务器。例如，不是让 Web 客户端直接连接到贵公司的\
  \ Web 服务器，而是让他们先连接到代理服务器。然后代理服务器与 Web 服务器通信以获取所需的数据。请参见图 21-8 以获取反向代理的视觉示例。\n\n\
  ![Image](img/00085.jpeg)\n\n**图 21-8** *反向代理*\n\n反向代理服务器可以提供几个关键功能：\n\n*   它可以通过阻止对外部资源的访问来充当过滤器。\n\
  *   它可以充当客户端和服务器之间的缓冲区，因为服务器“看到”请求是来自代理的，而不是原始客户端。这可以隐藏原始客户端数据，例如其 IP 地址或位置。某些用户更倾向于这种方式，因为它允许匿名浏览。这对于绕过限制也非常有用（例如，仅允许特定地理区域访问的网站）。在这种情况下，位于正确地理区域的代理服务器可以允许所需的访问。\n\
  *   代理服务器可以缓存静态数据（例如具有静态网页的网站）。当多个代理客户端尝试检索相同的数据时，代理服务器可以通过直接返回数据来加速过程，而不是反复查询 Web\
  \ 服务器。\n*   代理服务器可以记录客户端活动。\n\n反向代理服务器可以提供几个关键功能：（注：源文件中重复了文本）\n\n反向代理服务器可以提供几个关键功能：\n\
