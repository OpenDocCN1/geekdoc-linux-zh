  \n### 编辑文件\n\n你可能会奇怪为什么会有整整章专门介绍编辑文件。Linux 操作系统很大程度上是由数百个文本文件配置的。用户和组账户、系统服务、实用以及许多其他功能都依赖文本文件来存储关键信息。\n\
  \n第 2 章，“在命令行上工作](#part0014.html_ch02)”介绍了几个关键文件的示例，包括如 `/etc/profile` 和 `~/.bashrc`\
  \ 等初始化文件。这些初始化文件用于在用户登录或打开新的 shell 进程时修改 shell 环境。这些文件中的每一个都是在某个时刻需要编辑的文本文件。\n\n\
  在本章中，你将学习如何使用文本编辑器。重点将放在 `vi/vim` 编辑器上，但也会介绍其他的编辑器。\n\n在阅读本章并完成练习后，你将能够完成以下操作：\n\
  - 使用 `vi` 编辑器编辑文本文件\n- 熟悉其他的文本编辑器，如 `Emacs`、`joe` 和 `gedit`\n\n### vi 编辑器\n\n回想\
  \ Unix 的早期，它是 Linux 的前身：用户坐在键盘前，准备好编辑她正在编写的程序。她盯着打印机（是的，打印机，不是显示器）考虑执行哪些命令。在 20\
  \ 世纪 70 年代初，显示器非常稀有，即使用户有一个，它主要也设计用于显示执行代码的输出，而不是交互式地编辑文件。\n\n相反，用户会使用简单的基于命令的编辑器，例如\
  \ `ed` 编辑器。通过这个编辑器，用户可以执行操作，如列出文件内容（即打印文件）、修改文件的特定字符或保存文件内容。然而，这一切都是以一种在今天看来可能繁琐的方式完成的。用户看不到她正在编辑的内容，而是假设命令执行成功（或者她可以打印文件来验证）。\n\
  \n当显示器变得越来越普遍时，`ed` 编辑器看起来似乎是编辑文本文件的笨拙方法。在 20 世纪 70 年代中期，一个名为 `vi`（visual 的缩写）的替代编辑器被引入\
  \ Unix。它相比 `ed` 编辑器是一个巨大的改进，因为你实际上可以看到你的文档，并在编辑时在文档中移动。\n\n`vi` 编辑器现在是 Linux 和 Unix\
  \ 环境的标准文本编辑器。尽管它可能不像其他编辑器那样用户友好，但它有几个重要的优点：\n\n- `vi` 编辑器（或 `vim`，`vi` 编辑器的改进版本）存在于每一个\
  \ Linux 发行版中。这意味着如果你知道如何使用 `vi` 编辑器编辑文件，无论你在哪个发行版上工作，你总是可以编辑文件。\n- 因为 `vi` 编辑器是纯命令行的编辑器，所以它不需要图形用户界面（GUI）。这很重要，因为许多\
  \ Linux 服务器没有安装 GUI，这意味着你无法使用基于 GUI 的文本编辑器。\n- 一旦你理解了 `vi`，你会发现它是一个高效的编辑器，与大多数其他编辑器相比，它允许你快速编辑文件。这是因为所有命令都是短的且基于键盘的，所以你不需要浪费时间离开键盘去鼠标。\n\
  - `vi` 编辑器非常稳定，在过去的 40 年里没有太大变化。要用 `vi` 编辑器编辑一个文件，只需输入 `vi filename`。\n\n#### 什么是\
  \ vim？\n\n`vim` 编辑器于 1991 年发布，作为 `vi` 编辑器的克隆。`vim` 编辑器具有 `vi` 编辑器的相同功能，但它还有一些额外功能。这些功能对软件开发者可能非常有用。\n\
  \n你的发行版可能只有 `vi` 编辑器。许多发行版同时拥有 `vi` 和 `vim` 编辑器。在某些发行版中，`vi` 命令实际上是 `vim` 编辑器的链接。\n\
  \n有一种简单的方法可以判断你使用的是 `vi` 还是 `vim`。请参见图 4-1](#part0016.html_fig_1) 中的 Text Support\
  \ 对话框获取更多信息。\n\n![Image](img/0014.jpeg)\n\n**图 4-1** *文本支持：模式？*\n\n**注意**\n\n除非另有说明，本章所示命令在\
  \ `vi` 和 `vim` 编辑器中均有效。仅在 `vim` 中有效的命令将注明。\n\n**安全提示**\n\n如果在编辑文件时出错，直接修改系统可能会损坏操作系统。因此，某些工具被设计以更安全的方式编辑这些文件。\n\
  \n例如，在第 6 章](#part0019.html_ch06) “管理组账户，”和第 7 章](#part0020.html_ch07) “管理用户账户，”中，你将介绍用户和组账户。这些账户的信息存储在各种基于的系统文件（如\
  \ `/etc/passwd`）中，这些文件可以直接编辑。但是，使用 `useradd` 和 `usermod` 等命令修改用户账户，或使用 `groupadd`\
  \ 和 `groupmod` 修改组账户更为安全。这些工具在修改文件之前会执行错误检查操作，并备份文件的之前的版本。\n\n\n\n\n\n点击此处查看代码图像\n\
  \n```\n[student@onecoursesource.com ~]$ cp /etc/services .\n[student@onecoursesource.com\
  \ ~]$ vi services\n```\n\n### 使用基础 vi 模式\n\n由于 vi 的设计初衷是仅使用键盘，这带来了一个挑战，因为有时键盘上的特定按键应该执行命令，而其他时候该按键应该代表要插入到文档中的字符。为了让按键执行不同的任务，vi\
  \ 有三种运行模式：\n\n- **命令模式（Command mode）**：该模式是默认模式。当你打开 vi 时，你将处于命令模式。在此模式下，你可以执行移动光标、删除文本和粘贴文本的命令。\n\
  - **插入模式（Insert mode）**：当你处于插入模式时，插入任何按键都会作为新文本出现在你的文档中。当你完成新文本添加后，可以按下 `Escape`\
  \ 键返回默认模式（命令模式）。有关如何进入插入模式的详情，请参见本章的“进入插入模式”部分。\n- **末行模式（Last line mode）**：末行模式也称为\
  \ `ex mode`，允许你执行更复杂的操作，例如将文档保存为不同的文件名。要从命令模式进入末行模式，请按下 `:` 键。输入命令并按下回车后，命令将执行，你通常会返回命令模式。在某些情况下，你可能需要按下\
  \ `Escape` 键返回命令模式。随后的章节将更详细探讨这种模式。\n\n**注意**\n\n你无法从插入模式直接跳转到末行模式，反之亦然。要进入插入模式或末行模式，你必须先处于命令模式。按下\
  \ `Escape` 键即可进入命令模式。\n\n请查看图 4-2 以获取三种 vi 模式 的图形化表示。\n\n![Image](img/00015.jpeg)\n\
  \n**图 4-2** *vi 编辑器的三种模式*\n\n### 进入插入模式\n\n当你首次启动 vi 编辑器时，你处于命令模式。该模式的设计旨在让你执行命令，如导航显示的文本、复制文本和删除文本。\n\
  \n在命令模式下，你无法向文档插入新文本，因为所有键盘按键都已分配给命令任务。要插入新文本，你必须使用 `s` 命令从命令模式移动到插入模式。这些命令包括：\n\
  \n| `i` | 新文本将出现在光标位置之前。 |\n| `a` | 新文本将出现在光标位置之后。 |\n| `I` | 新文本将出现在行首。 |\n| `A`\
  \ | 新文本将出现在行尾。 |\n| `o` | 在光标所在行的下方打开一个新行；新文本将放置在此行上。 |\n| `O` | 在光标所在行的上方打开一个新行；新文本将放置在该行上。\
  \ |\n\n请查看图 4-3 以获取这些 vi 命令工作方式的视觉化描述。\n\n![Image](img/00016.jpeg)\n\n**图 4-3**\
  \ *进入插入模式的 vi 命令*\n\n如果你在标准的 vi 编辑器中工作，那么屏幕底部默认不会出现“-- INSERT --”提示。要在标准 vi 编辑器中启用此功能，请在命令模式下输入以下命令：\n\
  \n```bash\n:set showmode\n```\n\n当你想要返回命令模式时，只需按下 `Escape` 键。这在文档中通常表示为 `<ESC>`。如果你返回了命令模式，底部的“--\
  \ INSERT --”应该从屏幕上消失。\n\n### 移动命令\n\n在命令模式下，你可以使用各种按键在文档中移动光标。常用方法之一是将光标向左或向右移动一个字符，或者向上或向下移动一行。这可以使用键盘上的箭头键，也可以使用\
  \ `h`、`j`、`k` 和 `l` 键来实现，如图 4-4 所示。\n\n![Image](img/00017.jpeg)\n\n**图 4-4** *vi\
  \ 移动命令*\n\n还有许多额外的移动命令，包括：\n\n| `$` | 移动到当前行的最后一列（字符）。 |\n| `0` | 移动到当前行的第一列（字符）。\
  \ |\n| `w` | 移动到下一个单词或标点符号的开头。 |\n| `W` | 跳过下一个空格。 |\n| `b` | 移动到上一个单词标点符号的开头。 |\n\
  | `B` | 移动到上一个单词的开头，忽略标点。 |\n| `e` | 移动到下一个单词或标点符号的结尾。 |\n| `E` | 移动到下一个单词的结尾，忽略标点。\
  \ |\n| `)` |向前移动一个句子。 |\n| `(` | 向后移动一个句子。 |\n| `}` | 前移动一个段落。 |\n| `{` | 向后移动一个段落。\
  \ |\n| `H` | 移动到屏幕顶部。 |\n| `M` | 移动到屏幕中间。 |\n| `L` | 移动到屏幕底部。 |\n| `[[` | 移动到屏幕起始。\
  \ |\n| `]]` | 移动到屏幕结束。 |\n| `G` | 移动到文档末。 |\n| `x` | 删除光标下的字符。 |\n\n### 重复修饰符\n\n\
  在上一节中，你发现可以通过输入数字后跟 `G` 来跳转到文档中的特定行。例如，`7G` 将带你到第 7 行。\n\n在命令前放置数字充当修饰符。修饰符可以用于许多命令模式命令。以下是一些示例：\n\
  \n| `3w` | 向前移动三个单词。 |\n| `5i` | 插入五次。 |\n| `4(` | 向后移动三个段落。 |\n\n你还可以在删除、复制和粘贴等命令上使用重复修饰符。通常，如果有一个你逻辑上想要执行多次的命令模式命令，那么重复修饰符对该命令应该有效。\n\
  \n**你正在尝试这些命令吗？**\n\n回想一下我们建议将 `/etc/services` 文件复制到你的主目录以便尝试这些命令。记住，如果卡在插入模式，只需按下\
  \ `Escape` 键返回命令模式。\n\n### 撤销\n\n你可以在命令模式下输入 `u` 字符来撤销对文档所做的任何更改。在标准 vi 编辑器中，你只能撤销一次操作；事实上，`u`\
  \ 命令充当撤销/重做键。\n\n如果你使用的是 vim 编辑器，你可以撤销多次操作。只需一直按下 `u` 字符，旧的修改将被“撤销”。你可以使用 `^r` 命令（Ctrl\
  \ 键加 r 键）来执行“重做”，即撤销撤销命令产生的更改。\n\n**对话式学习™——快速清除错误**\n\n**Gary**: 你好，Julia。我遇到大麻烦了。我想可能在进入插入模式之前输入了一个数字，当我按下\
  \ Escape 返回命令模式时，文档中出现了大量的重复文本！\n\n**Julia**: 好的，这里有几种可能的解决方案。此时如果你在命令模式下按下 `u`\
  \ 字符，它将撤销上一次操作。\n\n\n\n\n\n**Julia**: 对的，我猜你不想重新输入一遍所有内容吧？\n\n**Gary**: 没门！\n\n\
  **Julia**: 好的，那意味着第二个选项也不行。\n\n**Gary**: 第二个选项是什么？\n\n**Julia**: 不保存任何内容直接退出。让我们尝试另一种方法。滚动查看你的文档。发现任何重复的信息请告诉我。\n\
  \n**Gary**: 好的……让我看看……是的！看起来是那五页的内容在反复重复。\n\n**Julia**: 好的，你能移动到第一组五页结束的地方吗？然后移动到第二组五页的第一行。\n\
  \n**Gary**: 好的，我到了。\n\n**Julia**: 太棒了，现在删除从当前行到文档末尾的内容，输入 `G$`。\n\n**Gary**: 噢，是的，起作用了！\n\
  \n**Julia**: 非常好。把另外两种技术记在心里，因为它们以后可能会派上用场。\n\n**Gary**: 再次感谢你，Julia。你省了我大量的工作。\n\
  \n**Julia**: 不客气，Gary。\n\n假设你自打开文档以来已经做了大量更改，并且想放弃所有更改。在这种情况下，你可能想在不保存的情况下关闭文档然后重新打开。要不保存更改关闭文档，输入命令\
  \ `:q!`（按 `:` 键、`q` 键和 `!` 键）。关于此命令以及退出 vi 编辑器的其他方法将在本章稍后部分介绍。\n\n## 复制、删除和粘贴\n\n\
  以下是常用复制命令的总结。请记住，这些命令要在命令模式（command mode）下执行：\n\n| 命令 |  |\n| :--- | :--- |\n| `yw`\
  \ | 复制单词；实际上是从单词中的当前字符复制到单词结束（包括标点符号）以及单词后的空格。因此，如果你的光标在“this is fun”中的 *h* 上，`cw`\
  \ 命令将把“his”复制到内存中。 |\n| `yy` | 复制当前行。 |\n| `y$` | 复制从当前字符到行尾的内容。 |\n| `yG` | 将当前行复制到文档末尾。\
  \ |\n\n你可能会奇怪，为什么要用 `y` 字符？这是因为将文本复制到内存缓冲区的过程曾被称为“yanking”（取用）。\n\n以下是常用删除命令的总结。请记住，这些命令应该在命令模式下执行。\n\
  \n| 命令 | 描述 |\n| :--- | :--- |\n| `dw` | 删除单词；实际上是从单词中的当前字符删除到单词结束（包括标点符号）以及单词后的空格。因此，如果你的光标在“this\
  \ is fun”中的 *h* 上，`dw` 命令将删除“his”，结果是“tis fun”。 |\n| `dd` | 删除当前行。 |\n| `d$` | 删除从当前字符到行尾的内容。\
  \ |\n| `dG` | 删除从当前行到文档末尾的内容。 |\n| `x` | 删除光标当前所在的字符（功能类似于 Delete 键）。 |\n| `X` |\
  \ 删除光标当前字符的前一个字符（功能类似于 Backspace 退格键）。 |\n\n 粘贴命令可能会稍微复杂一点，因为它们的工作取决于你正在粘贴的内容。例如，假设你已经将一个单词复制到了缓冲区。在这种情况下，下表描述了粘贴命令将如何工作：\n\
  \n| 命令 | 描述 |\n| :--- | :--- |\n| `p` | 在光标前粘贴缓冲区内容 |\n| `P` | 在光标后粘贴缓冲区内容 |\n\n\
  如果你将整行（或多行）复制到缓冲区，行为会有所不同：\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `p` | 在光标上方行粘贴缓冲区内容\
  \ |\n| `P` | 在光标下方行粘贴缓冲区内容 |\n\n如果你想知道剪切命令在哪里，请阅读图 4-5 中的 Text Support™ 对话。\n\n\
  ![Image](img/00018.jpeg)\n\n**图 4-5** vi 中 Text Support™ 剪切文本\n\n## 查找文本\n\n查找文本是使用\
  \ vi 编辑器的软件人员的关键功能，因为执行代码时出现的错误信息通常包含错误位置的代码片段。你可以通过以下方法查找文本：\n\n*   在命令模式下，输入 `/`（斜杠），你会看到该字符出现在终端窗口的左下角。现在输入你想搜索的内容，然后按\
  \ `<ENTER>`。vi 编辑器将在文档中*向后*搜索你请求查找的文本。\n*   在命令模式下，输入 `?` 键，你会看到该字符出现在终端窗口的左下角。现在输入你想搜索的内容，然后按\
  \ `<ENTER>`。vi 编辑器将在文档中*向前*搜索你请求查找的文本。\n\n假设你的搜索没有找到你需要的特定匹配项。你可以使用 `n` 命令找到下一个匹配项。如果你的上次搜索是以\
  \ `/` 键开始的，`n` 命令将向前搜索；如果你的上次搜索是以 `?` 键开始的，`n` 命令将向后搜索。\n\n如果你搜索了“/one”并发现你需要多次按\
  \ `n` 键才能找到你要的内容怎么办？\n\n## 替换\n\n查找文本并将其替换为其他文本，使用以下格式：\n\n```\n:ys/pattern/replace\n\
  ```\n\n要在在前十行执行查找替换，使用：\n\n```\n:1,10s/I/\n```\n\n你可以使用 `$` 字符表示最后一行：\n\n```\n:300,$s/I/\n\
  ```\n\n因此，要在整个文档上执行替换，使用：\n\n```\n:1,$s/I/\n```\n\n默认情况下，每行只替换第一个匹配项。假设你正在搜索的行如下：\n\
  \n![Image](img/00018.jpeg)\n**图 4-5** 区分大小\n\n要替换行中的所有出现项，在搜索命令末尾添加 `g`：\n\n```\n\
  :s/dog/cat/g\n```\n\n你可以认为 `g` 代表“获取全部”（get all）。它实际上代表“全局”（global）。\n\n查找和替换是区分大小写的。假设你正在搜索的行如下：\n\
  \n![Image](img/00018.jpeg)\n**图 4-5** 区分大小\n\n结果匹配了第二个“dog”，因为第一个是大写的 *D*。要执行不区分大小写的查找替换操作，请在搜索命令末尾添加\
  \ `i`：\n\n```\n:s/dog/cat/i\n```\n\n## 保存并退出\n\n在上一节中，你输入冒号（`:`）字符来执行查找替换操作。复杂的命令在最后行模式下执行，为了纪念\
  \ ex 编辑器也称为 *ex 模式*。 `:` 字符会将你带到屏幕底部，在你输入命令时显示它。\n\n在此模式下可以执行的另一个操作是“保存并退出”文档：\n\
  \n```\n:wq\n```\n\n\n\n\n你必须在退出之前保存，因此你不能执行 `:qw` 命令，因为这将尝试先退出后保存。\n\n### 安全要点\n\
  \n通常，以 root 身份登录的用户会使用 `:wq!` 来保存并退出。当直接修改 root 用户当前没有权限更改的系统文件时，这有时是必要的。`:wq` 之后的\
  \ `!` 字符将强制将更改写入文件，实际上是将权限临时更改为可写，保存更改，然后将权限还原为原始设置（更多关于权限的详细信息请参阅 第 9 章，“文件权限](#part0023.html_ch09)”）。****\n\
  \n遗憾的是，`:wq!` 变成了许多系统管理员的坏习惯。通过将其作为你的默认保存方法，你可能会意外修改关键的系统文件，可能修改了某个会导致系统无法正常运行或使系统变得脆弱的文件。避免养成这个坏习惯，默认使用\
  \ `:wq`，仅在需要时使用 `:wq!`——且在经过仔细思虑之后再使用。\n\n你可能只想保存但继续继续工作：\n\n```\n:w\n```\n\n你也可以保存到另一个文档，但此操作有一个小“陷阱”。假设你想对\
  \ `services` 文件所做的更改保存到名为 `myservices` 的文件中。执行以下命令：\n\n```\n:s myservices\n```\n\
  \n更改将被放入此文件中；然而，任何后续更改将默认保存到原始的 `services` 文件中。大多数现代编辑器会将默认保存文档“切换”为上次保存的文档，但 `vi`\
  \ 并不会这样做。要查看当前文档，输入 `^G` (Control+g)。\n\n所以，如果你想编辑新文件，你应该退出 `vi` 编辑器并打开新文件。\n\n\
  如果你对文件进行了更改并尝试在不保存的情况下退出（`:q`），你将收到如下错误消息：\n\n点击此处查看代码图像\n\n```\nE37: No write since\
  \ last change (add ! to override)\n```\n\n要强制退出（不保存更改退出），请执行以下命令：\n\n```\n:q!\n\
  ```\n\n## 扩展你的 vi 知识\n\n尽管我们已经了许多 `vi` 命令，但我们仅仅刚刚触及皮毛。`vi` 编辑器是一个强大的工具，拥有数百个命令。此外，它还提供了一些非常高级的功能，例如语法高亮、创建宏的能力、同时编辑多个文件的能力等等。\n\
  \n`vim` 编辑器有一些实用的内置文档，但你必须安装特定的软件包包才能访问这些文档。安装软件将在 第 26 章，“基于 Red Hat 的软件管理](#part0044.html_ch26)”和\
  \ 第 27 章，“基于 Debian 的软件管理](#part0045.html_ch27)”中进行详细介绍。现在，只需确保你正以 root 用户身份登录并执行以下命令之一：\n\
  \n*   在 Red Hat、Fedora 和 CentOS 发行版上，执行 `yum install vim-enhanced`。\n*   在 Debian、Ubuntu\
  \ 和 Mint 发行版上，执行 `apt-get install vim-enhanced`。\n\n### 注意\n\n在 Ubuntu 和 Mint 上，你可以登录安装期间创建的普通用户账户，并运行\
  \ `sudo apt-get install vim-enhanced` 命令。\n\n如果安装了 `vim-enhanced` 包，你可以在 `vim` 编辑器中执行\
  \ `:help` 命令，你将看到帮助文档出现。示例见 图 4-6。\n\n![Image](img/00019.jpeg)\n\n**图 4-6** *vim\
  \ 帮助输出*\n\n使用方向键（或 h, j, k, 和 l）滚动查看文档。向下大约 20 行处，你将开始看到一些子主题，如 图 4-7 所示。\n\n![Image](img/00020.jpeg)\n\
  \n**图 4-7** *vim 帮助主题*\n\n这些主题每一个（例如 `quickref` 或 `usr_01.txt`）都是一个独立的帮助主题。要查看这些主题，首先输入\
  \ `:q` 命令退出当前帮助文档。然后输入类似下面的命令，将 `topic` 替换为你查看的主题全名：\n\n```\n:help topic\n```\n\n\
  例如，要查看关于“使用语法高亮”的帮助，输入以下命令：\n\n```\n:help usr_06.txt\n```\n\n#### 其他编辑器\n\nLinux\
  \ 中有许多你可以使用的编辑器。本节的重点是让你意识到这些编辑器，而不是教你如何使用每一种。注意，你的发行版上可能没有安装所有这些编辑器。你可能需要安装额外的软件包以访问更多的编辑器。\n\
  \n#### Emacs\n\n与 `vi` 编辑器一样，`Emacs` 编辑器开发于 20 世纪 70 年代。喜欢 `Emacs` 的 Linux 用户会赞美它的易用定制能力。如果你在基于\
  \ GUI 的终端中启动 `Emacs`（只需运行 `emacs` 命令），应该打开该程序的 GUI 版本，如 图 4-6 所示。\n\n#### gedit\
  \ 和 kwrite\n\n(按照逻辑处理剩余部分...)\n\n\n\n\n### 4. `_____` 命令将在 vi 编辑器中复制整行。\n\n### 5.\
  \ `_____` 命令将允许你在使用 vi 编辑器时从当前位置向后搜索文本。\n\n## 第 5 章：当问题出现时\n\n首先是坏消息：某些事情将会出错。命令会执行失败，程序会崩溃，配置会出现错误。\n\
  \n现在是好消息：有处理这些问题的技术。故障排除不仅仅是“在黑暗中摸索”。当问题出现时，你应该采取具体的步骤来确定问题并识别最佳解决方案。\n\n在本章中，你将学习在事情运行结果不完全符合预期时应该遵循的技巧和实践。你还将发现一些作为管理员可以使用的技术，用来向用户告知系统问题。\n\
  \n在阅读本章并完成练习后，你将能够完成以下操作：\n\n* 正确使用故障排除技能诊断系统问题\n* 在用户登录期间或用户已登录期间通知用户系统问题\n\n###\
  \ 故障排除的科学\n\n尽管故障排除看起来像某种只有愿意遵守保密协议的人才知道的神秘艺术，但它更是对于那些经常成功解决问题的人来说的一门科学。这门科学不仅限于\
  \ Linux，因为你可以将这里提供的方法应用于其他操作系统和其他信息技术领域的问题，也可以应用于你在生活中遇到的问题。\n\n首先，这里是你故障排除问题时应该采取的通用步骤：\n\
  \n1. 收集与问题相关的所有相关信息。这是一个重要的步骤，因为我们倾向于快速解决问题，而不对其进行彻底研究。这很容易导致错误的结论，反过来可能会使问题变得更加复杂。\n\
  2. 确定问题最可能的原因。同样，避免对第一个可能过早下结论。认真考虑其他哪些条件可能导致了问题，并对最可能的原因做出合理的推测。\n3. 在采取任何行动之前，记录你计划执行以解决问题的操作。这可能是此过程中最容易被忽略的步骤，但它是至关重要的。如果你记录了计划要采取的操作，将更容易撤销任何没有正常运行的操作。此步骤的一部分还可以包括在修改之前对关键文件进行备份复制。\n\
  4. `仅`执行已记录的操作来解决问题。注意对`仅`一词的强调。不要在解决问题的途中决定转向另一个方向。如果你决定你的计划行不通，请回溯解决方案（撤销到该点的步骤）并制定新的攻击计划。\n\
  5. 确定问题是否已正确解决。这一步看起来可能没必要提到，但你会发现经常你认为自己已经解决了一个问题，结果在未来的某个时候发现你其实并没有解决。这在为他人解决问题时非常常见；例如，如果你是一个系统管理员并尝试为另一个用户解决问题。\n\
  6. 如果问题没有被正确解决，使用第 3 步的文档回到你开始此过程时的系统状态。然后回到第 2 步并再次执行第 2-5 步。\n7. 如果问题已解决，确定由于你所采取的操作现在是否存在任何额外问题。这是一个经常被忽略的步骤。例如，你可能修改了用户账户以提供对目录的特定访问，但这种修改导致用户无法访问其之前拥有访问权限的其他目录。你显然无法检查所有内容，但在进入下一步之前，想一下“这个解决方案可能会产生什么问题？”\n\
  8. 使用以后易于检索的技术存储你创建的文档，包括那些没有解决问题的操作。我们发现某些问题会反复出现，而我们的大脑并不擅长记忆我们费尽力发现过的解决方案。为你自己或你的组织创建一个故障排除日志或手册，以便将来解决问题更加容易。此外，请记住你的解决方案可能会导致更多问题，这些问题可能在未来的某个时候才会出现。拥有的你所做的日志会让未来的生活方便得多。\n\
  9. 考虑你可以做什么来防止这个问题在未来再次发生。保持主动，因为它可以为你节省时间、提高生产力，并保护你（和其他人）避免以后的大麻烦。\n\n### 第 1\
  \ 步：收集信息\n\n为了探索你如何收集信息，请考虑以下场景。假设你尝试使用 `cp` 命令复制文件，正如第 2 章中“命令行命令行工作”所述的。\n\n点击此处查看代码图像\n\
  \n```\nstudent@onecoursesource:~$ cp /etc/hosts\ncp: missing destination file operand\
  \ after '/etc/hosts'\nTry 'cp --help' for more information.\n```\n\n显然，之前的命令失败了，你可能很快就能确定原因。然而，这是一个关于当你遇到问题时如何收集信息的演示。一种技术是阅读尝试执行命令后出现的实际消息：`cp:\
  \ missing destination file operand after '/etc/hosts'`。\n\n你也可以尝试执行获取更多信息的建议：\n\n\
  点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$ cp --help\nUsage: cp [OPTION]... [-T]\
  \ SOURCE DEST\n  or:  cp [OPTION]... SOURCE... DIRECTORY\n  or:  cp [OPTION]...\
  \ -t DIRECTORY SOURCE...\nCopy SOURCE to DEST, or multiple SOURCE(s) to DIRECTORY.\n\
  \nMandatory arguments to long options are mandatory for short options too.\n  -a,\
  \ --archive                same as -dR --preserve=all\n…\n```\n\n由于尺寸的原因，我们简化了这个命令的输出，但重点是该命令提供了更有用的信息。但是，如果这些信息不够怎么办？也许你可以对问题文件尝试其他命令：\n\
  \n点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$ ls /etc/hosts\n/etc/hosts\n```\n\
  \n虽然在之前的例子中并非如此，但可能会产生额外的错误引导你发现问题。\n\n在你阅读这本书时，你将收集更多工具添加到你的故障排除工具箱中。准备好一份可以用于简化故障排除的命令和技巧“查询表”。\n\
  \n### 第 2 步：确定可能的原因\n\n对于这一步，如果原因不明确，你应该考虑使用其他来源来引导你进入正确的方向，包括以下来源：\n\n* 阅读文档，如\
  \ man 和 info 页\n* 询问同事的意见\n* 联系你的系统管理员寻求建议\n* 在 Linux 论坛网站上研究你的问题，如第 3 章“获取帮助”中提到的网站\n\
  * 使用你收集的信息进行互联网搜索，如图 5-1](#part0017.html_fig5_1）所示\n\n    ![Image](img/00025.jpeg)\n\
  \n    **图 5-1** *进行互联网搜索*\n\n\n\n\n如果你计划向同事或系统管理员寻求帮助，请准备好提供你在第一步中收集的所有信息，以便他们理解问题及其背景。去找系统管理员或\
  \ IT 支持人员并说“我无法复制文件”并不能提供足够的信息来帮助解决问题。你收集的细节越多，你的问题就越可能被快速解决。\n\n### 第 3 步：记录你的攻击计划\
  \ (POA)\n\n诚然，很多问题不需要详尽的文档，但随着你学习 Linux 中越发复杂的的主题，你会发现发现解决方案本身也变得越来越复杂。现在就开始养成记录\
  \ POA 的习惯，因为以后再养成这个习惯将会更加困难。\n\n在计划如何执行文档记录步骤时，请考虑以下因素：\n\n* 我可以如何让这个过程变得简单？\n*\
  \ 我可以如何确保文档易于检索和参考？（随手使用的纸片是一个非常糟糕的主意。）\n* 有哪些可用工具？考虑像 Google Docs 和 Dropbox 这样的文件共享工具。对于组织，你可能考虑专门为跟踪问题设计的工具，例如\
  \ Bugzilla（[www.bugzilla.org](http://www.bugzilla.org)）。\n\n### 第 4 步：执行操作\n\n这看起来似乎是简单的一步，但你应该考虑几点。首先，不要只是盲目地执行解决问题的操作。例如，如果你正在执行\
  \ 10 个步骤，请在每一步之后停下来进行评估。问自己以下问题：\n\n* 运行得正确吗？\n* 我是否有任何拼写错误？\n* 我得到的是预期的输出吗？\n*\
  \ 是否还有其他地方看起来不对劲？\n\n这不需要你进行长时间、复杂的、反省式的观察——只需进行瞬间的健康检查，以确保你的解决方案在正确的轨道上。\n\n###\
  \ 第 5 和第 6 步：问题解决了吗？\n\n识别问题是否已解决在大多数情况下可能是最简单的一步。你遇到的问题仍然存在吗？记住，如果是，你需要撤销你在上一步中执行的操作，因为这些操作可能会让情况更加复杂或产生更多的问题。\n\
  \n### 第 7 步：还有其他问题吗？\n\n在某些情况下，不需要这一步。回想上一个示例中的问题：\n\n点击此处查看代码图片\n\n```\nstudent@onecoursesource:~$\
  \ cp /etc/hosts\ncp: missing destination file operand after '/etc/hosts'\nTry 'cp\
  \ --help' for more information.\n```\n\n问题出在 `cp` 命令需要两个参数——要复制的文件和存放副本的位置：\n\n\
  点击此处查看代码图片\n\n```\nstudent@onecoursesource:~$ cp /etc/hosts /tmp\nstudent@onecoursesource:~$\n\
  ```\n\n这个解决方案不太可能导致任何其他问题（除非，当然，你将文件复制到了错误的目录）。然而，随着问题和解决方案变得越来越复杂，你应该花更多时间来确保你的解决方案没有导致其他问题的产生。在本书的早期提供实际示例是困难的，但请考虑以下场景：多年前，这本书的作者之一曾是一名年轻的系统管理员，一位无法登录系统的用户的用户找到了他。该系统管理员迅速确定问题是用户配置文件之一中的设置（确切来说是\
  \ `/etc/shadow` 文件，这将在后的 第 7 章 中的“管理用户账户”中介绍）。对该文件进行快速编辑解决了问题。\n\n然而，这个快速解决方案产生了一个意外之外的副作用：系统中所有其他拥有账户的用户都无法再次登录系统了。这个快速修复最终导致了更大的问题。更糟糕的是，这位年轻、鲁莽的管理员没有记录他所采取的操作，因此其他管理员不知道是什么导致了这个问题。\n\
  \n人们并不总是能够预见到解决方案可能产生的所有潜在问题，但对解决方案的边缘进行探测，寻找可能出现的其他潜在问题并没有好处。\n\n### 第 8 步：存储文档\n\
  \n这一步与第 3 步非常相似，之前涵盖过。\n\n### 第 9 步：防止未来问题\n\n相同的问题很有可能会发生多次，可能发生在很多人身上。防止未来问题的一种方法是主动通知他人。这通常是系统管理员的工作，他们可以发送消息（电子邮件、短信等）或在用户登录系统时显示消息。这是本章下一个主题的重点。\n\
  \n#### 通知用户\n\n确保用户及时了解网络或系统变更的动态是非常重要的。Linux 有几种方法可以自动通知用户此类信息。\n\n#### 登录前和登录后消息\n\
  \n你的环境中可能有数百个系统，这使得很难向每个用户提供有用信息，例如每个系统的设计用途、每个系统使用的发行版，以及他们应该使用哪种系统。这类信息可以通过创建在登录过程之前或之后显示的消息来按系统逐个地提供。\n\
  \n仔细考虑你想要显示的信息。信息太多，你可能会面临用户只读一小部分的风险；信息太少，你可能会面临未提供足够信息的风险。\n\n##### /etc/issue\
  \ 文件\n\n假设有一天，你决定解决向每个用户提供有用信息（如每个系统的设计用途、每个系统使用的发行版以及他们应该使用哪种系统）很困难的问题。这类信息可以通过创建在登录过程之前或之后显示的消息来按系统逐个地提供。\n\
  \n仔细考虑你想要显示的信息。信息太多，你可能会面临用户只读一小部分的风险；信息太少，你可能会面临未提供足够信息的风险。\n\n（注：提供的输入文本后半部分有大量重复，已根据你的规则处理了唯一结构）。\n\
  \n\n\n请注意，这些特殊值实际上是由名为 `agetty` 的进程使用的。`agetty` 命令负责提供登录提示符。\n\n`/etc/issue` 文件也可用于提供额外信息，例如关于系统使用的警告信息。请对以下\
  \ `/etc/issue` 文件所做的更改，然后查看图 5-3 以查看这些更改的结果。\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource\
  \ ~]# more /etc/issue\n\\S\nKernel \\r on an \\m\n\nRunning on terminal \\1\n\n\
  Platform: \\m\n\nNote: Secure system - No unauthorized access!  All activity is\
  \ closely monitored\n```\n\n![Image](img/00027.jpeg)\n\n**图 5-3** *自定义命令行登录界面*\n\
  \n要测试 `/etc/issue`文件的更改更改你需要能够通过命令行登录。你可能在练习系统中一直是通过 GUI 登录的。你应该可以通过按住键盘上的 `Ctrl`\
  \ 和 `Alt` 键并按下 `F2` 键（或 `F3`、`F4` 等）访问命令行登录。\n\n要查看 `/etc/issue`文件的更改，请通过命令行登录然后注销。当显示登录界面时，应该会出现新的\
  \ `/etc/issue` 内容。\n\n要返回 GUI，请使用 `Ctrl+Alt+F1` 或 `Ctrl+Alt+F7`（其中一个应该可以生效）。通常 `F2`\
  \ 到 `F5` 是命令行登录。`F1` 或 `F7` 通常是 GUI 显示（不是 GUI 的那一个应该是另一个命令行登录）。\n\n### /etc/issue.net\
  \ 文件\n\n`/etc/issue` 文件仅在用户通过本地命令行登录时显示。如果用户从远程系统登录，你可以通过将信息放置在 `/etc/issue.net`\
  \ 文件中来显示消息。最初，这设计用于向通过 `telnet` 登录的用户显示消息，但 `telnet` 在很大程度上已经是一个过时的恐龙物了，它已被更安全的\
  \ `SSH` 服务所取代。\n\n然而，你应该知道，SSH 服务器默认不会显示 `/etc/issue.net` 文件的内容。若要在 SSH 连接启动时显示该文件的内容，你应该修改\
  \ `/etc/ssh/sshd_config` 文件中的 `Banner` 设置。默认情况下，该设置看起来如下：\n\n点击此处查看代码图片\n\n```\n\
  [root@onecoursesource ~]# grep Banner /etc/ssh/sshd_config\n#Banner none\n```\n\n\
  通过进行以下更改来显示 `/etc/issue.net` 文件的内容（确保在修改此文件后重启 `sshd` 守护进程；这在第 28 章“系统启动](#part0046.html_ch28)”中有所介绍，并根据发行版而异）：\n\
  \n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# grep Banner /etc/ssh/sshd_config\n\
  Banner /etc/issue.net\n```\n\n`/etc/issue.net` 文件的内容与 `/etc/issue` 文件类似：\n\n点击此处查看代码图片\n\
  \n```\n[root@onecoursesource ~]# more /etc/issue.net\n\\S\nKernel \\r on an \\m\n\
  ```\n\n这些特殊字符序列在通过 `telnet` 连接时运行良好（但 `\\S` 似乎例外外）：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource\
  \ ~]# telnet onecoursesource\nTrying ::1...\nConnected to onecoursesource .\nEscape\
  \ character is '^]'.\n\nKernel 3.10.0-229.14.1.el7.x86_64 on an x86_64\nonecoursesource\
  \  login:\n```\n\n然而，这些字符序列对 Secure Shell 服务器没有特殊含义：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource\
  \ ~]# ssh onecoursesource\n\\S\nKernel \\r on an \\m\nroot@onecoursesource 's password:\n\
  ```\n\n除非你确实允许 `telnet` 连接，否则你可能想更改 `/etc/issue.net` 文件使其不包含任何特殊字符序列。如果你同时允许 `telnet`\
  \ 和 `SSH` 连接，请保留 `/etc/issue.net` 文件中的特殊字符序列，并修改 `/etc/ssh/sshd_config` 中的 `Banner`\
  \ 设置以指向另一个位置：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# grep Banner /etc/ssh/sshd_config\n\
  Banner /etc/ssh.banner\n```\n\n\n\n\n*   **“你敢试试”警告消息**：好的，我们知道这听起来和之前的建议背道而驰。然而，在你的任务关键型服务器上，你不想表现得那么友好和开心。确保用户知道这台服务器的监控有多严密。让他们知道，如果他们违反了规则，后果将非常严重。\n\
  \n*   **即将发生的变更**：如果你计划在下周二关闭此系统进行维护，请在 `/etc/motd` 文件中记录此信息。如果你在未来几周内添加新软件，请通过\
  \ `/etc/motd` 文件中的通知进行标明。\n\n*   **系统的目的**：如果这是你的 Web 服务器，为什么不在用户登录时不明确说明这一点呢？用户应该知道他们正在操作或登录到的是种种系统，而\
  \ `/etc/motd` 文件是说明这一点的绝佳之处。你可以想象，当管理员被问到“你为什么在那台系统上运行这个 CPU 密集型程序？”时，已经听过多少次“噢，我不知道那是我们的邮件服务器！”。\n\
  \n这些只是你可以放置在 `/etc/motd` 文件中的一些想法。通过将这些信息放置在 `/etc/motd` 文件中，你可以向用户传递许多其他有用信息。（注意：在大多数发行版中，`/etc/motd`\
  \ 文件默认是空的。）\n\n要查看 `/etc/motd` 文件的示例，首先查看以下命令的输出，然后查看图 5-4 所示的输出：\n\n点击此处查看代码图片\n\
  \n```\n[root@onecoursesource ssh]# more /etc/motd\nNote: This system will be down\
  \ for maintenance on Friday from 10PM to 10:30PM.\n在此期间你将无法登录，任何正在运行的 cron 任务将不会执行。如果有任何问题，请咨询\
  \ Julia。\n```\n\n![Image](img/00028.jpeg)\n\n**图 5-4** *自定义的命令行登录界面*\n\n### 广播消息\n\
  \n`/etc/issue`、`/etc/issue.net` 和 `/etc/motd` 文件是登录过程中提供有用信息的极佳之处。但如果你现在系统上有 10\
  \ 个用户，需要向他们发送一条紧急消息怎么办？本节侧重于与当前登录系统的用户通信的技术。\n\n#### wall 命令\n\n有时，你可能需要向当前登录系统的所有用户发送消息。`wall`\
  \ 命令提供了您向每个用户的终端广播消息的能力。以下是 `wall` 命令的示例：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource\
  \ ~]# wall shutting down in five minutes\nBroadcast message from root@onecoursesource\
  \ (pts/3) (Sun Oct 25 12:44:33 2019):\n\nshutting down in five minutes\n```\n\n\
  ### 注意\n\n`wall` 消息限制总共 20 行。\n\n为了避免显示消息顶部的横幅（banner），在执行 `wall` 命令时使用 `-n` 选项。横幅是消息的以下部分：\n\
  \n点击此处查看代码图片\n\n```\nBroadcast message from root@onecoursesource (pts/3) (Sun Oct\
  \ 25 12:44:33 2019):\n```\n\n在许多发行版中，普通用户也允许使用 `wall` 命令。在某些情况下这可能会令人厌恼：\n\n点击此处查看代码图片\n\
  \n```\n[student@onecoursesource ~]# wall today is my birthday!\nBroadcast message\
  \ from student@onecoursesource (pts/3) (Sun Oct 25 12:52:36 2019):\n\ntoday is my\
  \ birthday!\n```\n\n所有用户都可以使用 `wall` 命令，因为它是一个 SGID 程序。这种权限集合将在第 9 章“文件权限”中详细介绍。以下输出中的\
  \ `s` 字符表示这是一个 SGID 程序：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# ls -l /usr/bin/wall\n\
  -r-xr-sr-x. 1 root tty 15344 Jun  9  2019 /usr/bin/wall\n```\n\n所有的终端设备（`/dev/tty1`、`/dev/tty2`、`/dev/pts/0`\
  \ 等）都由 tty 组所有。tty 对这些文件具有写权限，因此当 `wall` 命令以 tty 组身份运行时，它可以直接向这些终端设备写入信息。要禁用普通用户发送\
  \ `wall` 消息的能力，只需移除 SGID 权限集合：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# ls\
  \ -l /usr/bin/wall\n-r-xr-sr-x. 1 root tty 15344 Jun  9  2019 /usr/bin/wall\n[root@onecoursesource\
  \ ~]# chmod g-s /usr/bin/wall\n[root@onecoursesource ~]# ls -l /usr/bin/wall\n-r-xr-xr-x.\
  \ 1 root tty 15344 Jun  9  2019 /usr/bin/wall\n[root@onecoursesource ~]# su - student\n\
  Last login: Sun Oct 25 12:51:36 PDT 2018 on pts/3\n[student@onecoursesource  ~]$\
  \ wall today is my birthday!\n```\n\n普通用户不会显示任何错误信息，但 `wall` 命令不会向任何用户账户发送消息。\n\n\
  用户可能会禁用针对特定终端的 `wall` 消息。你随时可以在以后将值改回“yes”。`wall` 消息并不是不能弄乱，因为你随时可以这样做。\n\n点击此处查看代码图片\n\
  \n```\n[root@onecoursesource ~]# mesg n\n[root@onecoursesource ~]# mesg y\n```\n\
  \n#### shutdown 命令\n\n如果向用户发送广播消息的目的是你需要关闭系统，请考虑使用 `shutdown` 命令。`shutdown` 命令的语法为\n\
  \n点击此处查看代码图片\n\n```\nshutdown [OPTIONS...] [TIME...]\n```\n\n`WALL` 是你想要发送给每个人的广播消息。当然，你想给用户留出保存工作和退出系统的时间，因此你可以使用\
  \ `TIME` 值来指定在实际关闭之前等待多久：\n\n点击此处查看代码图片\n\n```\nshutdown +5 \"system shutdown\n\
  ```\n\n`+5` 值告诉 `shutdown` 命令在实际关闭之前等待 5 分钟。显示给所有用户的消息类似于\n\n点击此处查看代码图片\n\n```\n\
  Broadcast message from root@onecoursesource (pts/3) (Sun 2019-02-11 13:20:09 PDT):\n\
  \nshutting down\nThe system is going down for power-off at Sun 2019-02-1113:25:09\
  \ PDT!\n```\n\n此消息将按定期持续显示（关机前 5 分钟、3 分钟前等）。如果你更早地启动关机（例如 `shutdown +60`），则用户可以继续登录。但在关机发生前\
  \ 5 分钟，用户登录会被禁用，因为 `shutdown` 命令创建了 `/run/nologin` 文件，阻止额外的登录尝试。\n\n作为管理员，可以通过 `shutdown\
  \ -c` 命令取消正在进行的关机：\n\n点击此处查看代码图片\n\n```\n[student@onecoursesource  ~]$ shutdown\
  \ -c\n\nBroadcast message from root@onecoursesource (pts/3) (Sun 2019-02-11 13:23:32\
  \ PDT):\n\nThe system shutdown has been cancelled at 2019-02-1113:24:32 PDT!\n```\n\
  \n以下是一些额外的选项：\n\n\n\n\n\n- `-r`: 重启而非关机。\n- `-h`: 停止系统（取决于你的发行版，可能与关机相同）。\n- `-k`:\
  \ 不实际关机；仅发送 `wall` 消息表示系统正在关闭。\n\n### 总结\n\n本章的重点是学习在处理 Linux 发行版时可能出现问题的技巧。你还学习了如何向用户发送消息（无论是在登录时还是已登录期间），以便他们提供有关系统的重要信息。\n\
  \n#### 复习题\n\n**1.** 在尝试本地命令行登录之前，系统会显示 `/etc/_____` 文件。\n\n**2.** 在尝试 telnet 登录之前，系统会显示\
  \ `/etc/_____` 文件。\n\n**3.** 在成功登录后，会显示 `/etc/_____` 文件。\n\n**4.** `_____` 命令将向当前登录系统的所有用户显示一条消息。\n\
  \n1. `wall`\n2. `mesg`\n3. `send`\n4. `shutdown`\n\n**5.** `shutdown` 命令的 `_____`\
  \ 选项用于取消关机操作。\n\n# 第二部分：用户和组账户\n\n用户和组账户对于系统安全的重要性无论如何强调都不为过。如果有人使用普通用户账户就能访问系统，这将为他们提供发起进一步攻击的立足点。保护组和用户账户从理解这些账户的作用开始。\n\
  \n在第二部分，“用户和组账户”中，你将探索以下章节：\n\n- 第 6 章，“管理组账户”重点关注组账户，包括如何添加、修改和删除组。特别关注系统组（或特殊组）以及理解主级组和辅助组之间的区别。\n\
  - 第 7 章，“管理用户账户”涵盖了用户账户的细节。你将学习如何创建和保护这些账户，以及如何教授用户保护其账户的良好安全实践。\n- 第 8 章，“制定账户安全策略”为你提供了利用第\
  \ 6 章和第 7 章中获得的知识来创建安全策略的方法。\n\n## 第 6 章：管理组账户\n\n由于 Linux 是一个多用户操作系统，安全性通常基于账户。每个人都获得一个用户账户（详情请参见第\
  \ 7 章，“管理用户账户”），并且每个用户账户都是一个或多个组账户的成员。\n\n组账户用于为该组成员的用户账户提供访问权限或施加限制。这种访问/限制可以应用于文件、目录或其他操作系统的功能。通过使用组账户，你可以轻松地对多个用户账户应用安全策略。\n\
  \n在本章中，你将学习更多关于组账户的概念。你还探索了如何创建、修改和删除组账户。\n\n阅读本章并完成练习后，你将能够：\n\n- 理解 Linux 组的概念\n\
  - 管理组，包括创建、修改和删除组账户\n- 理解名为“用户私有组 (UPGs)”的安全功能\n- 学习如何创建组管理员\n\n### 组有什么什么用？\n\n\
  每个能够访问 Linux 系统的人都会获得一个用户账户。该用户账户提供了几个不同的功能，包括用户名和密码。此外，每个用户都是一个或多个组账户的成员。\n\n成为组的成员允许用户特殊访问系统资源，例如运行在系统上的文件、目录或进程（程序）。这种组成员关系也可防止访问系统资源，因为\
  \ Linux 中的几项安全功能利用组来施加安全限制。这些安全功能将在本书的后续章节中介绍。\n\n### 主组与辅助组\n\n每个用户至少是一个组的成员。第一个组被称为用户的`主组`\
  \ 组。用户所属的任何额外组被称为用户的`辅助组` 组。\n\n通过执行 `id` 或 `groups` 命令可以显示组成员关系：\n\n点击此处查看代码图像\n\
  \n```\nstudent@onecoursesource:~$ id\nuid=1002(student) gid=1002(student)\ngroups=1002(student),60(games),1001(ocs)\n\
  student@onecoursesource:~$ groups\nstudent@onecoursesource:~$\n```\n\n`id` 的输出在表\
  \ 6-1 中描述。\n\n**表 6-1**\n\n| 值 | 描述 |\n| :--- | :--- |\n| `uid=1002(student)` |\
  \ 用户 ID |\n| `gid=1002(student)` | 主组 |\n| `groups=1002(student),60(games),1001(ocs)`\
  \ | 辅助组 |\n\n`groups` 命令包含了用户所属的每一个组。主组始终列在第一个。\n\n主组和辅助组成员关系之间最重要的区别在于用户创建文件的时间。每个文件都由一个`用户\
  \ ID` 和一个组 ID 所有。当用户创建文件时，将使用用户的主组作为组所有者。\n\n点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$\
  \ id\nuid=0(root) gid=0(root)\ngroups=0(root)\nstudent@onecoursesource:~$ groups\n\
  ```\n\n文件创建后，用户可以使用 `chgrp` 命令将文件的组所有权更改另一个组：\n\n点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$\
  \ ls -l sample.txt\n-rw-rw-r-- 1 student student 0 Sep 15 11:39 sample.txt\nstudent@onecoursesource:~$\
  \ chgrp games sample.txt\nstudent@onecoursesource:~$ ls -l sample.txt\n-rw-rw-r--\
  \ 1 student games 0 Sep 15 11:39 sample.txt\n```\n\n### 可能会出现什么问题？\n\n虽然用户可以将自己的文件组成员关系更改他们所属的组，但他们不能更改其他用户文件的组成员关系，因为这构成了安全风险。以下命令演示了用户尝试更改另一个用户的文件组所有权时的典型错误消息：\n\
  \n点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$ ls -l /etc/hosts\n-rw-r--r-- 2 root\
  \ root 199 Sep 15 11:24 /etc/hosts\nstudent@onecoursesource:~$ chgrp games /etc/hosts\n\
  chgrp: changing group of '/etc/hosts': Operation not permitted\n```\n\n\n\n\n\n\
  ```\nstudent@onecoursesource:~$ ls -l sample.txt\n-rw-rw-r-- 1 student games 0 Sep\
  \ 15 11:39 sample.txt\nstudent@onecoursesource:~$ id\nuid=1002(student) gid=1002(student)\n\
  groups=1002(student),60(games),1001(ocs)\nstudent@onecoursesource:~$ chgrp users\
  \ sample.txt\nchgrp: changing group of 'sample.txt': Operation not permitted\n```\n\
  \n用户可能能够临时将其主组更改为另一个组，但这取决于于一个名为 `/etc/group` 的文件的安全特性，该文件将在后续介绍。\n\n## /etc/group\
  \ 文件\n\n组信息存储在几个文件中：\n\n*   `/etc/passwd` 文件包含用户账户信息，包括每个用户的主组成员关系。关于该文件内容的详细信息将在第\
  \ 7 章中讨论。为了在本章中讨论组，这种主组成员关系是使用组的 GID 存储的，如下例所示：\n\n    点击此处查看代码图像\n\n    ```\n \
  \   student@onecoursesource:~$ grep student /etc/passwd\n    student:x:1002:1002::/home/student:\n\
  \    ```\n\n*   `/etc/group` 文件存储每个组的信息，包括组名、组 ID (GID) 和次级用户成员。\n\n*   `/etc/gshadow`\
  \ 文件存储组的额外信息，包括组管理员和组密码。关于该文件的详细信息将在本章稍后标题为“etc/gshadow 文件”的节中讨论。\n\n示例 6-1 展示了典型的\
  \ `/etc/group` 文件的部分。\n\n**示例 6-1** */etc/group 文件*\n\n点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$\
  \ head /etc/group\nroot:x:0:\ndaemon:x:1:\nbin:x:2:\nsys:x:3:\nadm:x:4:syslog,bo\n\
  tty:x:5:\ndisk:x:6:\nlp:x:7:\nmail:x:8:\nnews:x:9:\n```\n\n### 安全亮点\n\n如示例 6-1 所示，普通（非管理员）用户可以查看\
  \ `/etc/group` 文件。这强调了防止未经授权访问系统的必要性，因为即使是普通用户通过查看 `/etc/group` 文件也能获取系统的价值信息。注意，管理员不应更改\
  \ `/etc/group` 文件的权限，因为会导致某些程序无法正常工作。\n\n请记住，这在操作系统中并不常见，因为普通用户在其他操作系统（包括 Unix、macOS\
  \ 和 Microsoft Windows）上也可以看到基本的组信息。\n\n`/etc/group` 文件中的每行描述一个组。每行被分为多个数据字段，并使用冒号（:`）字符作为字段分隔符。表\
  \ 6-2 使用 `adm:x:4:syslog,bo` 行作为示例描述了这些字段。\n\n**表 6-2** /etc/group 文件的字段\n\n| **字段**\
  \ | **描述** |\n| --- | --- |\n| **adm** | 组名。组名在当前系统中必须是唯一的，以避免与文件所有权相关的问题。 |\n|\
  \ **x** | 密码占位符。组密码以前放在 `/etc/group` 文件中，但出于安全考虑，已移动到 `/etc/gshadow` 文件。这是因为 `/etc/group`\
  \ 文件所有用户可见，而 `/etc/gshadow` 文件仅对 root 用户可见。关于组密码的详细信息将在本章稍后标题为“etc/gshadow 文件”的节中讨论。\
  \ |\n| **4** | 这是一个代表组 ID (GID) 的数值。GID 在当前系统中必须是唯一的，以避免与文件所有权相关的问题。 |\n| **syslog,bo**\
  \ | 这是该组的成员列表。要将用户作为次级成员添加到组中，管理员会将用户名添加到此字段中。这通常通过 `usermod` 或 `gpasswd` 命令完成（参见“将用户添加到组”和“组管理员”）。\
  \ |\n\n### 安全亮点\n\n通常情况下 `/etc/group` 文件不会手动更改。管理员使用 `groupadd`、`groupdel` 和 `groupmod`\
  \ 等命令来更改 `/etc/group` 文件。\n\n## 特殊组\n\n一个典型的 Linux 系统将有很多默认组。关注安全的管理员应该注意这些特殊组 账户，因为这些账户可以提供安全功能或构成安全威胁。表\
  \ 6-3 突出了更重要的特殊组（涵盖所有组超出了本书的范围）。\n\n**表 6-3** 特殊组\n\n| **组名** | **描述** |\n| ---\
  \ | --- |\n| **root** | 此组账户留给系统管理员。不要将普通用户添加到此组，因为这将为普通用户提供对文件的特权访问。 |\n| **adm**\
  \ | 此组成员通常有权访问系统监控（如日志文件）。查看这些文件内容可以比普通用户通常获得的更多系统信息。 |\n| **lp** | 这是系统中许多组（包括\
  \ tty、mail 和 cdrom）之一，用于提供文件访问。通常普通用户不会被添加到这些组，因为这些组由守护进程（daemons）使用。 |\n| **sudo**\
  \ | 此组与 `sudo` 命令配合使用。`sudo` 命令将在第 7 章](#part0020.html_ch07)中详细讨论。 |\n| **staff**\
  \ | 传统上在 Unix 上使用的默认组，但在现代 Linux 发行版中很少使用。 |\n| **users** | 现代 Linux 发行版中很少使用的默认组。\
  \ |\n| **operators** | 传统上在 Unix 上使用的组，用于需要执行特定系统任务特权权限的用户。 |\n\n## 用户私有组\n\n通常在创建用户账户时，也会为该用户创建一个组。这种设计是为了克服\
  \ Linux 早期的一种常见情况，即系统管理员会惯性地将所有用户添加到组（通常称为“users”或“staff”）。\n\n\n\n\n\n这种做法导致了用户获得了访问他们本不应该访问的文件。通过将所有人放在同一个组中，每个用户创建的每个新文件都属于该组，这意味着要么组织中的每一个人都能通过组权限访问该文件，要么用户必须记住在创建每个新文件时删除对该组的所有权限。图\
  \ 6-1 演示了这种场景会产生的问题（`file1.txt` 演示了安全风险，而 `file2.txt` 演示了当用户记得删除对该组的所有权限时的情况）。\n\
  \n![Image](img/00030.jpeg)\n\n**图 6-1** *为所有人设置全局组的问题*\n\n为每个用户创建一个组的概念被称为用户私有组\
  \ (UPGs)，其中每个用户都有一个属于自己的组作为其私有组，这意味着所有所有用户都能访问其他用户文件的安全风险被限制了。\n\n遗憾的是，如果系统管理员没有正确处理组成员关系，这种方法也会带来安全风险。UPG\
  \ 本质上使用用户的主组变得毫无意义（至少在默认情况下如此），因为用户是该私有组的唯一成员。如果用户不是其他组的成员，那么为了给特定用户提供访问权限，通常会使用其他权限设置。这最终会导致系统上的所有人都能获得权限，而这正是\
  \ UPG 设计旨在避免的问题。图 6-2 演示了这种场景产生的问题。\n\n![Image](img/00031.jpeg)\n\n**图 6-2** *UPG\
  \ 的潜在问题*\n\nUPG 确实提供了一个解决方案，但只是部分的。管理员还必须实施安全策略，包含以下一项或多项：\n\n*   将用户放入其他组的程序，以便一起工作的人更方便地共享文件访问权限。\n\
  *   向所有用户教授正确使用权限的计划。关于此主题的详细讨论可以在第 9 章，“文件权限](#part0023.html_ch09)”中找到。\n*   管理员应该考虑允许用户将新用户添加到他们自己的私有组中。关于此主题的详细讨论见下一节，“/etc/gshadow\
  \ 文件](#part0019.html_ch06lev2sec5)”。\n*   教用户如何使用访问控制列表 (ACLs) 的计划，这是一种向特定用户或组分配权限的方法。关于此主题的详细讨论可以在第\
  \ 9 章中找到。\n\n### 对话学习™——规划分组\n\n**Gary**: 嗨，Julia。你有时间吗？我可以听听你的建议吗？\n\n**Julia**:\
  \ 可以的，你需要什么？\n\n**Gary**: 我正试图制定一个计划，来创建我们组织需要的 Linux 组，但我不太确定该从哪里开始。\n\n**Julia**:\
  \ 通常，创建 Linux 组是为了让用户能够通过组权限相互共享文件。例如，你组织的每个部门可能都应该有自己的组。\n\n**Gary**: 就这样吗？只需为每个部门创建一个组即可？\n\
  \n**Julia**: 不，还有其他因素需要考虑。例如，来自不同部门的两个人可能需要共享文件。如果他们在不同的组中，这将带来挑战。如果他们正在合作一个项目，那么为该特定项目创建一个组是有意义的。\n\
  \n**Gary**: 好的，所以为每个部门创建组，并为需要共享文件访问的项目创建组。还有别的吗？\n\n**Julia**: 即使一个项目不涉及不同部门的人，你可能也想为它创建一个组。这样，文件不是与部门内的所有人共享，而是只有部门内的少数几个人员可以访问这些文件。\n\
  \n**Gary**: 创建组还有其他常见的常见理由吗？\n\n**Julia**: 在创建组时，你可能还需要考虑职位。公司通常为经理、工程师、承包商等设有不同的组。\n\
  \n**Gary**: 好的，太棒了。这让我对从哪里开始有了一个好想法。谢谢你的帮助！\n\n**Julia**: 不客气！\n\n### /etc/gshadow\
  \ 文件\n\n`/etc/group` 文件包含了一些组账户信息，但更多信息可以在 `/etc/gshadow` 文件中找到。该文件只有 root 用户可以查看，因此更敏感的数据存储在\
  \ `/etc/gshadow` 文件中。\n\n示例 6-2 演示了典型的 `/etc/gshadow` 文件的部分。\n\n**示例 6-2** */etc/gshadow\
  \ 文件*\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# head /etc/gshadow\nroot:*::\n\
  daemon:*::\nbin:*::\nsys:*::\nadm:*:student:syslog,bo,student\ntty:*::\ndisk:*::\n\
  lp:*::\nmail:*::\nnews:*::\n```\n\n`/etc/gshadow` 文件中的每一行都描述一个组。每行被划分为数据字段，用冒号（:`）字符作为字段分隔符。表\
  \ 6-4 使用 `adm:*:student:syslog,bo,student` 示例描述了这些字段。\n\n**表 6-4** /shadow 文件的字段\n\
  \n| 字段 | 描述 |\n| :--- | :--- |\n| adm | 组名。这匹配 `/etc/group` 中的组名。 |\n| * | 组密码。值为\
  \ `*` 表示“未设置有效密码”。参见更多信息。 |\n| student | 组管理员。组管理员可以添加和删除用户。 |\n| syslog,bo,student\
  \ | 组成员列表。这应该是 `/etc/group` 中的相应字段。 |\n\n`/etc/shadow` 文件中的密码字段的作用是允许用户在运行 `newgrp`\
  \ 命令时通过输入组密码来临时切换主组。默认情况下，任何该组的成员都可以通过 `newgrp` 切换主组：点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$\
  \ groups\nstudent adm games cs\nstudent@onecoursesource:~$ newgrp\nstudent@onecoursesource:~$\
  \ groups\ngames adm cs\n```\n\n除非知道组密码，否则用户无法切换到他们所属的组。该密码由管理员使用 `gpasswd` 命令设置：点击此处查看代码图像\n\
  \n```\nroot@onecoursesource:~# gpasswd staff\nChanging the password for group staff\n\
  New Password:\nRe-enter new password:\nroot@onecoursesource:~# grep staff /etc/shadow\n\
  staff:$6$iv.ggaA$iWGw61b/ZqKhu4WnMfA9qpNQvAQcljBF1XdWBq\n```\n\n一旦设置密码，用户就可以在运行\
  \ `newgrp` 命令时通过输入组密码来切换主组：点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$ groups\n\
  student adm games cs\nstudent@onecoursesource:~$ newgrp staff\nPassword:\nstudent@onecoursesource:~$\
  \ groups\nstaff adm cs student\n```\n\n虽然可以使用组密码方法，但请考虑：如果你想允许用户切换到一个新的主组，为什么不直接把他们加入组呢？由于这种逻辑，组密码在\
  \ Linux 系统上并不常用。\n\n参见图 6-3 获取更多信息。\n\n![Image](img/00032.jpeg)\n\n**图 6-3** 文本支持——切换主组\n\
  \n### 管理组\n\n组管理包括创建新组、修改现有组和删除组。这些操作需要 root 账户提供的权限。\n\n\n\n\n\n管理组还包括将用户添加到组或从组中移除用户的过程。通常情况下，这些操作需要\
  \ root 账户提供的权限，但如果创建了组管理员，那么组管理员也可以为特定组执行这些任务。\n\n### 创建组\n\n使用 `groupadd` 命令创建新组，如下：\n\
  \n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# groupadd -g 5000 payroll\nroot@onecoursesource:~#\
  \ tail -1 /etc/group\npayroll:x:5000:\n```\n\n**注意**\n\n`-g` 选项用于为组分配一个 GID。如果省略\
  \ `-g` 选项，则将使用 1000 以上的下一个可用 GID（在某些系统上，可能会使用 500 以上的下一个可用 GID）。最佳实践是使用 `-g` 选项并使用较高的值（5000\
  \ 或以上），这样就不会影响用于用户私有组（User Private Groups）的 GID。\n\n**可能会出现什么问题？**\n\n在创建组时，你必须使用当前未使用的\
  \ GID 和名称，否则将得到错误：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# groupadd -g 4000\
  \ payroll\ngroupadd: group 'payroll' already exists\nroot@onecoursesource:~# groupadd\
  \ -g 5000 test\ngroupadd: GID '5000' already exists\n```\n\n### 修改组\n\n除了添加和移除成员外，管理员对组进行的最典型的更改是更改组名。进行此项更改的原因可能是原始名称描述不够充分，因此另一个名称更好。\n\
  \n要更改组名，请使用 `groupmod` 命令并配合 `-n` 选项，如下：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~#\
  \ tail -1 /etc/group\npayroll:x:5000:\nroot@onecoursesource:~# groupmod -n payables\
  \ payroll\nroot@onecoursesource:~# tail -1 /etc/group\npayables:x:5000:\n```\n\n\
  ### 删除组\n\n通过执行 `groupdel` 命令来删除组。然而，在删除组之前，管理员应该在文件系统中搜索所有属于该组的文件，并将所有权更改另一个组。如果不执行这一步，那么属于该组的文件将变为仅由组的\
  \ GID 所有，这会导致组权限失去意义。以下是一个示例：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# ls -l\
  \ /tmp/example\n-rw-r--r-- 1 root payables 0 Sep 15 16:07 /tmp/example\nroot@onecoursesource:~#\
  \ groupdel payables\nroot@onecoursesource:~# ls -l /tmp/example\n-rw-r--r-- 1 root\
  \ 5000 0 Sep 15 16:07 /tmp/example\n```\n\n请参阅 图 6-4 获取有关如何按组所有权搜索文件的信息。\n\n![图像](img/00033.jpeg)\n\
  \n**图 6-4** Text Support™—如何通过组所有权查找文件并更改所有权\n\n### 将用户添加到组\n\n`usermod` 命令的 `-G`\
  \ 选项用于将用户添加到组。但要小心，因为默认情况下该选项将覆盖现有的组成员关系。这里是一个示例：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~#\
  \ id student\nuid=1002(student) gid=1002(student)\ngroups=1002(student),60(games),1001(ocs)\n\
  root@onecoursesource:~# usermod -G adm student\nroot@onecoursesource:~# id student\n\
  uid=1002(student) gid=1002(student) groups=1002(student),4(adm)\n```\n\n要在保持用户当前组成员关系的同时将用户添加到组，请配合\
  \ `-G` 选项使用 `-a` 选项：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# id student\n\
  uid=1002(student) gid=1002(student)\ngroups=1002(student),60(games),1001(ocs)\n\
  root@onecoursesource:~# usermod -G adm -a student\nroot@onecoursesource:~# id student\n\
  uid=1002(student) gid=1002(student)\ngroups=1002(student),4(adm)\n```\n\n**注意**\n\
  \n默认情况下此选项将覆盖现有的组成员关系。\n\n\n\n\n\n# 用户账户的重要性\n\n用户账户在 Linux 操作系统中起着至关重要的作用，包括：\n\
  \n*   **授予系统访问权限**：用户账户为用户提供了登录并获得受控系统访问的方法。\n*   **保护文件和目录**：每个文件（和目录）都属于一个用户账户。文件的账户所有者可以根据文件权限访问该文件。\n\
  *   **安全进程**：每个运行中的进程（程序）都属于一个用户账户。该用户账户有权停止或修改运行中的进程，而其他用户没有此权限。\n*   **额外权限**：系统管理员可以为用户账户提供特殊权限。这可能包括运行特定进程或执行其他用户无法执行特定系统操作的能力。\n\
  *   **额外验证**：某些软件程序会对用户账户进行身份验证。这意味着运行这些软件程序时需要使用用户账户和用户密码（或其他身份验证方法）。\n\n## 用户账户信息\n\
  \n本地用户的账户数据存储在几个不同的文件中：\n\n*   `/etc/passwd`：主账户数据。\n*   `/etc/shadow`：用户密码与密码相关的数据。\n\
  *   `/etc/group`：组账户数据，包含与用户账户相关的信息。有关此文件的细节可见第 6 章中的“管理组账户”。\n*   `/etc/gshadow`：组账户数据，包含与用户账户相关的信息。有关此文件的细节可见第\
  \ 6 章。\n\n请注意，这些文件仅用于存储本地用户账户信息。用户账户也可以由网络服务器提供，允许用户使用相同的用户名和密码登录到多个不同的系统。\n\n基于网络的用户账户将在本章稍后部分详细介绍。\n\
  \n## /etc/passwd 文件\n\n`/etc/passwd` 文件包含基本的用户账户信息。然而，尽管它的名称如此，但该文件并不包含任何与用户密码相关的信息。\n\
  \n示例 7-1 展示了典型的 `/etc/passwd` 文件的一部分。\n\n**示例 7-1** *`/etc/passwd` 文件*\n\n点击此处查看代码图像\n\
  \n```\nstudent@onecoursesource:~$ head /etc/passwd\nroot:x:0:0:root:/root:/bin/bash\n\
  daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin\nbin:x:2:2:bin:/bin:/usr/sbin/nologin\n\
  sys:x:3:3:sys:/dev:/usr/sbin/nologin\nsync:x:4:65534:sync:/bin:/bin/sync\ngames:x:5:60:games:/usr/games:/usr/sbin/nologin\n\
  man:x:6:12:man:/var/cache/man:/usr/sbin/nologin\nlp:x:7:7:lp:/var/spool/lpd:/usr/sbin/nologin\n\
  mail:x:8:8:mail:/var/mail:/usr/sbin/nologin\nnews:x:9:9:news:/var/spool/news:/usr/sbin/nologin\n\
  ```\n\n**安全要点**\n\n如示例 7-1 所示，普通（非管理员）用户可以查看 `/etc/passwd` 文件。这突显了防止未经授权访问系统的必要性，因为即使是普通用户也可以查看\
  \ `/etc/passwd` 文件获取有关系统的价值信息。请记住，这在操作系统中并不常见——普通用户可以在其他操作系统（包括 Unix、macOS 和 Microsoft\
  \ Windows）中看到基本的用户账户信息。\n\n请注意，管理员不应更改 `/etc/passwd` 文件的权限，因为这将导致某些程序无法工作。\n\n`/etc/passwd`\
  \ 文件中的每行描述一个组。每行被划分为数据字段，并以冒号（`:`）作为字段分隔符。表 7-1 以 `root:x:0:0:root:/root:/bin/bash`\
  \ 行作为示例描述了这些字段。\n\n**表 7-1** /etc/passwd 文件的字段\n\n| 字段 | 说明 |\n| --- | --- |\n|\
  \ **root** | 用户名。用户名在当前系统中必须是唯一的，以避免与文件所有权相关的问题。 |\n| **x** | 密码占位符。用户密码以前存放在 `/etc/passwd`\
  \ 文件中，出于安全考虑已移动到 `/etc/shadow` 文件。这是因为 `/etc/passwd` 文件所有用户可见，而 `/etc/shadow` 文件仅\
  \ root 用户可见。有关用户密码的细节将在本章后的“/etc/shadow 文件”节中讨论。 |\n| **0** | 这是一个表示用户 ID (UID)\
  \ 的数值。UID 在当前系统中必须是唯一的，以避免与文件所有权相关的问题。 |\n| **0** | 这是一个表示用户主组的数值。回想第 6 章，用户可以是多个组的成员，但主组用于设置初始组。\
  \ |\n| **root** | 这是一个注释字段，通常称为 GCOS。在大多数系统中，管理员将使用此字段放置分配的电话号码或办公室位置。GCOS 是一个利用此（参见后文管理组账户）的功能。\
  \ |\n| **/root** | 这是用户的家目录。通常这应该是 `/home` 下的目录，但 root 用户有一个特殊的家目录 `/root`。 |\n\
  | **/bin/bash** | 这是用户的登录 shell。`/bin/bash` 的值表示用户登录时具有典型的 BASH shell。其他常用值包括：`/usr/sbin/nologin`：用于守护账户（不供普通用户登录的账户）。`/bin/false`：有时也用于守护账户。`/bin/tcsh`：用于\
  \ TCSH（T shell，C shell 的增强版）账户。`/bin/dash`：用于 DASH（Debian Almquist Shell）账户。`/bin/rbash`：用于受限\
  \ shell 账户。参见本章后的“受限 shell 账户”。\n\n**安全要点**\n\n通常 `/etc/passwd` 文件不会被手动修改。管理员使用\
  \ `useradd`、`userdel` 和 `usermod` 命令来更改 `/etc/passwd` 文件的内容。然而，管理员可以选择手动修改 `/etc/passwd`\
  \ 文件；结果是可能会出现错误。要检查 `/etc/passwd` 文件是否存在错误，请以 root 用户登录并执行 `pwck` 命令。\n\n## 特殊用户\n\
  \n典型的 Linux 系统会有许多默认用户账户。这些默认账户的 UID 值通常小于 1000，使得管理员很容易识别出这些是特殊账户。\n\n这些默认账户通常被称为“守护账户”，因为它们被守护程序使用。*守护进程*\
  \ 是在后台运行并执行特定系统任务的程序。\n\n可能存在其他默认账户为操作系统提供功能。例如，nobody 账户用于通过 NFS (网络文件系统) 共享的文件权限。\n\
  \n此外，如果你向系统中添加新软件，可能会增加更多用户，因为软件供应商利用用户账户和组账户来对软件部分的文件提供受控访问。\n\n\n\n\n\n关注安全的管理员应该意识到这些默认用户账户，因为这些账户既可以提供安全功能，也可能构成安全威胁。表\
  \ 7-2 列出了更重要的特殊组账户（涵盖所有默认用户已超出本书的讨论范围）。\n\n### 表 7-2 默认用户账户\n\n| **组** | **描述**\
  \ |\n| --- | --- |\n| `root` | 该账户是系统管理员账户。需要注意的是，`root` 账户的特殊之处在于其 `UID` 为 `0`。任何\
  \ `UID` 为 `0` 的用户都是全系统管理员。作为安全提示，当您执行审计时，请查找任何 `UID` 为 `0` 的用户，这是一种常见的黑客技术。 |\n\
  | `syslog` | 该账户用于系统日志守护进程访问文件。 |\n| `lp` | 这是许多用户之一（包括 `mysql`、`mail`、`postfix`\
  \ 和 `dovecot`），操作系统使用这些用户通过称为“守护进程”的后台进程提供对特定文件的访问。 |\n| `bind` | 此用户用于提供 DNS（域名系统）功能的软件。\
  \ |\n\n### 安全亮点\n\n作为管理员，您应该意识到每个用户账户的设计用途。花时间探索您的 `/etc/passwd` 文件中列出的所有用户，并仔细考虑每个账户的影响。此外，在向系统添加软件后，检查\
  \ `/etc/passwd` 文件的内容以确定是否添加了新的用户账户。如果添加了新账户，请探索这些新账户的。\n\n### `/etc/shadow` 文件\n\
  \n`/etc/passwd` 文件包含一些用户账户信息，但不包含密码信息。讽刺的是，这些密码数据存储在 `/etc/shadow` 文件。该文件仅对 `root`\
  \ 用户可见，这就是为什么关于密码的更敏感数据存储在 `/etc/shadow` 中。\n\n示例 7-2 展示了典型的 `/etc/shadow` 文件的部分。\n\
  \n#### 示例 7-2 `/etc/shadow` 文件\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# head\
  \ /etc/shadow\nroot:$6$5rU9Z/H5$sZM3MRyHS24SR/ySv80ViqIrzfhh.p1EWfOic7NzA2zvSjquFKi\n\
  PgIVJy8/ba.X/mEQ9DUwtQQb2zdSPsEwb8.:17320:0:99999:7:::\ndaemon:*:16484:0:99999:7:::\n\
  bin:*:16484:0:99999:7:::\nsys:*:16484:0:99999:7:::\nsync:*:16484:0:99999:7:::\n\
  games:*:16484:0:99999:7:::\nman:*:16484:0:99999:7:::\nlp:*:16484:0:99999:7:::\n\
  mail:*:16484:0:99999:7:::\nnews:*:16484:0:99999:7:::\n```\n\n`/etc/shadow` 文件中的每行都描述一个用户账户的密码信息。每行被划分为数据字段，使用冒号（`:`）作为字段分隔符。表\
  \ 7-3 使用 `news:*:16484:0:99999:7:::` 行作为示例描述了这些字段。\n\n### 表 7-3 `/etc/shadow` 文件的字段\n\
  \n| **字段** | **描述** |\n| --- | --- |\n| `news` | **用户账户名字段**：这与 `/etc/passwd` 文件中的用户名匹配。\
  \ |\n| `*****` | **用户密码字段**：`*****` 或 `!` 表示“未设置有效密码”。注意示例 7-2 中 `root` 账户的值（那串非常长的字符集合）是加密密码的示例。加密密码是单向哈希加密的，这意味着没有方法可以解密密码。当用户登录时，他们在登录过程中提供的密码会被加密，该值将与\
  \ `/etc/shadow` 文件中的值进行比对。如果值匹配，用户即可登录。安全提示：如果此字段完全为空，则相应的用户在提示输入密码时只需按 `<ENTER>`\
  \ 即可登录。这构成了巨大的安全风险，因此当您审计系统时，请查找没有设置密码的账户。 |\n| `16484` | **最后更改密码日期字段**：此数字代表自\
  \ 1970 年 1 月 1 日到用户密码最后一次更改日期之间的天数。1970 年 1 月 1 日被称为 Unix 的 *epoch*（时间起点），因为 Unix\
  \ 是在那时发布的。该数值与该行的其他字段结合使用，以提供基本的密码有效期功能。更多信息请参见接下来的两个字段。 |\n| `0` | **最小密码有效期字段**：此数字代表用户更改密码后必须经过多少天才能再次更改。例如，如果此字段被设置为\
  \ `5`，则用户必须等待五天。 |\n| `99999` | **最大密码有效期字段**：此字段代表账户被锁定之前可以经过多少天。例如，如果此字段被设置为 `60`，则用户必须每\
  \ 60 天更改一次密码。 |\n| `7` | **密码警告字段**：如果账户密码必须在五天内更改，用户将在登录过程中收到警告。此数值代表在他们登录时显示警告的天数。\
  \ |\n| ` ` | **密码空闲字段**：想象一下用户忽略了警告并且在账户锁定之前没有更改密码。此字段提供了一个宽限期，用户在此期间内可以登录（超过最大密码有效期后的天数）。\
  \ |\n| ` ` | **过期日期字段**：此值代表自 1970 年 1 月 1 日到账户过期的天数。当过期日期到达时，账户将被锁定。此字段对于临时分配到特定公司组工作的账户非常有用。\
  \ |\n| ` ` | **未使用的字段**：目前最后一个字段未使用，但保留以供未来使用。 |\n\n`/etc/shadow` 文件带有最小密码有效期、最大密码有效期、密码空闲等功能，往往会让初\
  \ Linux 用户感到困惑。对于系统管理员来说，理解这一点至关重要，因为它提供了重要的用户账户安全保障。图 7-1 中的示例旨在让更好地理解 `/etc/shadow`\
  \ 文件的字段。\n\n![图像](img/00035.jpeg)\n\n#### 图 7-1 `/etc/shadow` 文件的字段\n\n通过图 7-1 中显示的示例记录值，我们可以得出\
  \ `bob` 用户账户的以下信息：\n\n*   它目前有一个锁定密码（`*` = 已锁定）。\n*   自 1970 年 1 月 1 日以来账户密码最后一次更改（在此例中为锁定）以来已经过了\
  \ 16484 天。\n*   用户必须每 90 天更改一次账户密码，且新密码必须至少保留三天。\n*   如果账户密码必须在五天内更改，用户将在登录过程中收到警告。\n\
  \n\n\n\n\n* 如果用户超过了 90 天的密码有效期最大值，将有 30 天的宽限。在接下来的 30 天内，用户可以在登录过程中更改账户密码。\n* 账户将在从\
  \ 1970 年 1 月 1 日起 16,584 天后过期（被锁定）。\n\n## 对话式学习™—理解密码有效期\n\n**Gary**: 嗨，Julia。我被一个与用户密码相关的问题给难住了。\n\
  \n**Julia**: 遇到什么问题了，Gary？\n\n**Gary**: 我有一个用户尝试更改密码，但他一直收收到一个奇怪的错误信息。\n\n**Julia**:\
  \ 他是在使用 `passwd` 命令来更改密码吗？\n\n**Gary**: 是的。\n\n**Julia**: 他收到了什么错误信息？\n\n**Gary**:\
  \ “你必须等待更长时间才能更改密码。”\n\n**Julia**: 哦，我猜他可能最近更改过密码，现在又尝试将其更改为其他密码？\n\n**Gary**: 没错。昨天命令还能用，但今天它就给他显示了那个错误信息。\n\
  \n**Julia**: 好的，查看 `/etc/shadow` 文件，特别是包含此人账户数据的这一行。看该行的第四字段。那里的值是多少？\n\n**Gary**:\
  \ 10。\n\n**Julia**: 这意味着用户在更改密码后必须等待十天才能再次更改。这防止了人们在系统强制他们更改新密码后，立即切回之前的旧密码。\n\n\
  **Gary**: 但如果他真的需要更改它呢？\n\n**Julia**: 没问题。管理员可以为用户进行更改。\n\n**Gary**: 好的，太好了。谢谢你提供的信息！\n\
  \n**Julia**: 不客气！\n\n## 管理用户\n\n管理用户的过程包括创建新用户、修改现有用户以及删除用户。这些操作需要 root 账户提供的权限。\n\
  \n### 创建用户\n\n使用 `useradd` 命令创建一个新组：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~#\
  \ useradd timmy\nroot@onecoursesource:~# tail -1 /etc/passwd\ntimmy:x:1003:1003::/home/timmy:\n\
  root@onecoursesource:~# tail -1 /etc/shadow\ntimmy:!:17456:0:99999:7:::\n```\n\n\
  关于 `useradd` 命令的一些重要注意事项：\n\n* `-u` 选项可以给用户分配一个 UID。如果省略 `-u` 选项，则将使用 1000 以上的下一个可用\
  \ UID（在某些系统中，可能会使用 500 以上的下一个可用 UID）。\n* 注意，尽管 `/etc/passwd` 文件中的用户主目录被设置为 `/home/timmy`，但该目录默认并没有创建。要创建此目录，在执行\
  \ `useradd` 命令时必须使用 `-m` 选项。创建主目录也可以设置为默认值；更多信息请参见本章节后后的“使用默认值”部分。\n* 新用户的账户默认是锁定的（因此\
  \ `/etc/shadow` 文件的第二个字段中为 `!`）。在创建账户后，使用 `passwd` 命令设置账户密码。\n\n表 7-4 描述了 `useradd`\
  \ 命令的其他额外用选项。\n\n### 表 7-4 有用的 `useradd` 选项\n\n| 选项 | 描述 |\n| --- | --- |\n| `-c`\
  \ | 设置 `/etc/passwd` 文件的注释字段。 |\n| `-d` | 指定用户的主目录，而不是默认的 `/home/username`。 |\n\
  | `-e` | 设置账户过期日期；使用 YYYY-MM-DD 格式的参数（例如，`-e 2020-12-31`）。 |\n| `-f` | 设置 `/etc/shadow`\
  \ 文件的活动字段。 |\n| `-g` | 设置用户的主组。注意，在使用用户私有组 (UPG) 的系统中，这将覆盖 UPG 特性。有关 UPG 的详情请参见第\
  \ 6 章。 |\n| `-G` | 设置用户的辅助组。注意，在使用用户私有组 (UPG) 的系统中，此操作会覆盖 UPG 特性。 |\n| `-k` | 指定骨架目录。更多信息请参见本章节后的“使用默认值”部分。\
  \ |\n| `-D` | 显示默认设置。 |\n| `-p` | 设置密码。 |\n| `-s` | 指定用户的登录 shell。 |\n| `-u` | 指定\
  \ UID。 |\n\n#### 可能会出错？\n\n在创建用户时，如果 UID 不是唯一的，将会出现错误：点击此处查看代码图像\n\n```\nuseradd\
  \ nick already exists\n```\n\n### 设置密码\n\n在创建用户后，需要设置密码。这是通过使用 `passwd` 命令完成的：点击此处查看代码图像\n\
  \n```\nuser 'nick' already exists\n```\n\n```\nroot@onecoursesource:~# tail -1 /etc/shadow\n\
  timmy:!:17456:0:99999:7:::\nroot@onecoursesource:~# passwd timmy\n输入密码：\n再次输入密码：\n\
  密码已更新\n```\n\n### 使用默认值\n\n你可以使用选项来更改创建用户的方式，但如果你使用这些选项，则将使用默认值。这些默认值可以通过使用 `useradd\
  \ -D` 命令查看：点击此处查看代码图像\n\n```\nroot@onecoursesource:~# useradd -D\nGROUP=100\nHOME=/home\n\
  INACTIVE=-1\nEXPIRE=\nSHELL=/bin/sh\nSKEL=/etc/skel\nCREATE_MAIL_SPOOL=no\n```\n\
  \n这些某些值并不准确。例如，`GROUP=100` 表示“将用户放在 GID 为 100 的组中”，但大多数 Linux 发行版使用用户私有组，因此该值并未实际使用。然而，这些某些值例如指示账户过期日期的\
  \ `EXPIRE` 值是有效的。\n\n可以通过编辑 `/etc/default/useradd` 文件中的值来更改这些设置。可以在 `/etc/login.defs`\
  \ 文件中查看并修改额外的默认设置。例如，示例 显示了与有效期相关的设置。\n\n#### 示例 7-3 默认密码有效期\n\n点击此处查看代码图像\n\n```\n\
  root@onecoursesource:~# grep PASS /etc/login.defs\n#    PASS_MAX_DAYS    密码使用的最大天数。\n\
  #    PASS_MIN_DAYS    两次更改密码之间的最小天数。\n#    PASS_WARN_AGE    密码过期前给予警告的天数。\nPASS_MAX_DAYS\
  \    99999\nPASS_MIN_DAYS    0\nPASS_WARN_AGE    7\n#PASS_CHANGE_TRIES\n#PASS_ALWAYS_WARN\n\
  #PASS_MIN_LEN\n#PASS_MAX_LEN\n# NO_PASSWORD_CONSOLE\n```\n\n### 使用骨架目录\n\n创建账户只是过程的一部分。在许多情况下，在用户的主目录中放置特定的默认文件对用户有益。这可以通过使用骨架目录来实现。\n\
  \n使用骨架目录时，指定目录的所有内容将复制到新用户的主目录中。复制的文件也将自动归新用户所有，如示例 所示。\n\n#### 示例 7-4 文件归新用户所有\n\
  \n\n\n\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# ls -lA /etc/skel\ntotal 12\n\
  -rw-r--r--   1 root root   220 Apr  8  2014 .bash_logout\n-rw-r--r--   1 root root\
  \  3637 Apr  8  2014 .bashrc\n-rw-r--r--   1 root root   675 Apr  8  2014 .profile\n\
  root@onecoursesource:~# useradd -m -k /etc/skel steve\nroot@onecoursesource:~# ls\
  \ -lA /home/steve\ntotal 12\n-rw-r--r-- 1 steve steve  220 Apr  8  2014 .bash_logout\n\
  -rw-r--r-- 1 steve steve 3637 Apr  8  2014 .bashrc\n-rw-r--r-- 1 steve steve  675\
  \ Apr  8  2014 .profile\n```\n\n不同的目录可以用于不同类型的用户。例如，你可以创建一个名为 `/etc/skel_eng` 的目录结构，其中包含的\
  \ `.bashrc` 文件包含了专为软件工程师设计的别名（aliases）。然后，你可以创建另一个名为 `/etc/skel_sales` 的目录，其 `.bashrc`\
  \ 文件包含专为销售工程师设计的别名。在为软件工程师创建账户时使用 `-k /etc/skel_eng` 选项，在为销售工程师创建账户时使用 `-k /etc/skel_sales`\
  \ 选项。\n\n**注意**\n\n如果不使用 `-k` 选项，`useradd` 命令将将 `/etc/skel` 目录的内容复制到新用户账户中。\n\n\
  ### 修改用户\n\n作为管理员，你可以使用 `usermod` 命令以及与 `useradd` 命令相同的选项来修改用户账户。例如，如果你想更改用户的名称，可以使用带有\
  \ `-c` 选项的 `usermod` 命令：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# grep timmy\
  \ /etc/passwd\ntimmy:x:1003:1003::/home/timmy:\nroot@onecoursesource:~# usermod\
  \ -c \"Timmy Smith\" timmy\nroot@onecoursesource:~# grep timmy /etc/passwd\ntimmy:x:1003:1003:Timmy\
  \ Smith:/home/timmy:\n```\n\n虽然 `usermod` 命令可以更改 `/etc/shadow` 文件的过期日期和非活动字段，但 `chage`\
  \ 命令可以使用所示选项更改其他字段：\n\n| `-m` | 更改最小天数字段。 |\n| :--- | :--- |\n| `-M` | 更改最大天数字段。\
  \ |\n| `-d` | 更改“自上次修改密码以日期”字段（YYYY-MM-DD 格式）。 |\n| `-I` | 更改非活动字段。 |\n| `-E` |\
  \ 更改过期日期字段（YYYY-MM-DD 格式）。 |\n| `-W` | 更改警告天数字段。 |\n\n### 管理 GECOS\n\n回想章节前面的内容，`/etc/passwd`\
  \ 文件中的注释字段通常被称为 GECOS（通用综合操作系统）字段。尽管在现代 Linux 系统上并不经常使用，但有一项功能允许普通用户修改 `/etc/passwd`\
  \ 文件的注释字段，至少是针对他们自己的账户。默认情况下，用户可以通过 `chfn` 命令进行这些更改，如示例 7-5 所示。\n\n**示例 7-5** *`chfn`\
  \ 命令*\n\n点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$ chfn\nPassword:\nChanging\
  \ the user information for student\nEnter the new value, or press ENTER for the\
  \ default\n    Full Name:\n    Room Number []: 101\n    Work Phone []: 999\n   \
  \ Home Phone []: 1-555-555-5555\nstudent@onecoursesource:~$ grep student /etc/passwd\n\
  student:x:1002:1002:,101,999,1-555-555-5555:/home/student:\n```\n\n一些普通用户喜欢这个功能，因为这些数据可以使用\
  \ `finger` 命令轻松地显示：\n\n点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$ finger student\n\
  Login: student                    Name:\nDirectory: /home/student              \
  \  Shell: /bin/sh\nOffice: 101, 999            Home Phone: 1-555-555-5555\nNever\
  \ logged in.\nNo mail.\nNo Plan.\n```\n\n然而，此功能可能会导致安全风险，因为它赋予了普通用户修改 `/etc/passwd`\
  \ 文件的能力。诚然，它应该只修改注释字段，但 `chfn` 程序中的安全漏洞始终可能导致利用，因此你可能会考虑关闭此功能。移除此功能的简单方法是更改 `chfn`\
  \ 程序的权限：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# ls -l /usr/bin/chfn\n-rwsr-xr-x\
  \ 1 root root 46424 Feb 16  2014 /usr/bin/chfn\nroot@onecoursesource:~# chmod u-s\
  \ /usr/bin/chfn\nroot@onecoursesource:~# ls -l /usr/bin/chfn\n-rwxr-xr-x 1 root\
  \ root 46424 Feb 16  2014 /usr/bin/chfn\n```\n\n这会导致以下错误：\n\n点击此处查看代码图像\n\n```\n\
  student@onecoursesource:~$ chfn\nPassword:\nChanging the user information for student\n\
  Enter the new value, or press ENTER for the default\n    Full Name:\n    Room Number\
  \ []: 101\n    Work Phone []: 999\n    Home Phone []: 1-555-555-5555\nCannot change\
  \ to root.\n```\n\n**注意** 权限和 `chmod` 命令在第 8 章中有详细介绍。\n\n### 删除用户\n\n通过执行 `userdel`\
  \ 命令完成删除账户。然而，在删除用户之前，你需要做一个决定：你是只想从 `/etc/passwd` 和 `/etc/shadow` 文件中删除账户，还是也想删除用户的主目录？\n\
  \n在某些情况下，保留用户的主目录对于接替该用户的人可能有用。邮件池可能出于审计或责任原因是必要的。\n\n要删除用户并保留其主目录，请在不带任何参数的情况下使用\
  \ `userdel`：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# userdel steve\n```\n\n\
  要删除用户及其主目录，请为 `userdel` 命令包含 `-r` 选项。\n\n### 受限 账户\n\n在某些情况下，你可能希望为特定用户提供非常有限的系统访问权限。例如，假设你有一个只需要有限访问系统的访客用户（例如为了协助需要在网络上测试的硬件维修）。或者你创建一个基于亭机（kiosk）的系统，只想让用户执行特定任务，例如预租汽车或查看他们的学生课程表。\n\
  \n在这些情况下，你应该考虑创建一个受限 shell 账户。这种账户利用 BASH shell，但有许多重要的限制，包括：\n\n*   用户无法使用 `cd`\
  \ 命令更改目录。\n*   用户无法更改以下变量的值：`SHELL`、`PATH`、`ENV` 和 `BASH_ENV`。\n*   用户无法运行任何路径以\
  \ `/` 开头的命令（例如 `/bin/bash`）。\n*   用户无法将输出重定向到文件。\n\n可以在 `rbash` 的手册页中查看附加限制。然而，要点是受限\
  \ shell 账户非常有限，只能访问内置命令和通过 `PATH` 变量提供的命令。\n\n要创建受限 shell 账户，请使用 `useradd` 命令的 `-s`\
  \ 选项并提供参数 `/bin/rbash`：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# useradd -m\
  \ -s /bin/rbash limited\n```\n\n接下来，修改账户以便用户对命令有受限访问。例如，如果你只想让用户运行 `/bin` 目录中的命令，请将以下内容添加到用户的\
  \ `.bashrc` 文件的末尾：\n\n```\nPATH=/bin\n```\n\n\n\n\n\n此项也可以设置为你复制了特定命令的目录，而不是整个 `/bin`\
  \ 目录。一旦用户登录，他们可以执行的命令将受到限制。例如，`ls` 命令位于 `/bin` 目录，因此是被允许的。然而，`vi` 命令位于 `/usr/bin`\
  \ 目录而非 `/bin` 目录，因此它将执行失败：\n\n点击此处查看代码图像\n\n```\nlimited@onecoursesource:~$ ls\n\
  limited@onecoursesource:~$ vi\n-rbash: /usr/lib/command-not-found: restricted: cannot\
  \ specify\n'/' in command names\n```\n\n### 安全要点\n\n微调限制账户以提供恰当的访问权限需要实践和一些经验。建议从有限数量的命令开始，并根据需要添加更多命令。\n\
  \n### 基于网络的用户账户\n\n在本书的这个阶段，对基于网络的账户进行全面讨论还为时过早。通用网络知识以及提供基于网络账户的服务尚未介绍。因此，本章的讨论更多是基于理论的。后面的几个章节——最值得注意的是第\
  \ 19 章“网络配置”——将更详细地涵盖这些主题。\n\n使用基于网络的账户登录到不同的系统，需要在你想让用户登录的系统与提供登录信息的服务器之间建立客户端服务器关系。Linux\
  \ 平台有多种不同的登录服务器，包括：\n\n*   **LDAP (轻量级目录访问协议)**：LDAP 服务器可以提供用户组账户数据以及 LDAP 管理员定义的其他数据。它是\
  \ Linux 发行版中用于网络账户常用的服务器。\n\n*   **NIS (网络信息服务)**：虽然没有 LDAP 灵活，但 NIS 具有易于设置和管理的优势。然而，关注安全的管理员通常会因为其安全问题而避免\
  \ NIS。\n\n*   **Active Directory 和 Samba**：Active Directory 是微软的产品，而 Samba 是一个基于\
  \ Linux 的服务，它可以利用 Active Directory 允许用户使用 Active Directory 服务器登录到 Linux 系统。由于 Active\
  \ Directory 的更改没有考虑到 Linux 系统的结构，这可能是一个复杂的配置。\n\n当系统可以使用服务器进行基于网络的账户时，本地账户仍然可用。然而，考虑到可能会冲突，有一种方法可以指示先访问哪个位置的账户信息。这是通过设置\
  \ `/etc/nsswitch.conf` 文件来实现的，该文件是名为 NSS (名称服务切换) 的本地服务的配置文件。例如，`/etc/nsswitch.conf`\
  \ 文件中的以下设置将确保在用户尝试登录时，首先引用本地数据库文件（`/etc/passwd`、`/etc/shadow` 和 `/etc/group`）：\n\
  \n点击此处查看代码图像\n\n```\npasswd:         files ldap\ngroup:          files ldap\nshadow:\
  \         files ldap\n```\n\n如果不在本地文件中找到用户的账户信息，则将使用 LDAP 服务器。关于基于网络的用户账户的更多细节，可以在讨论网络服务的第\
  \ 19 章中找到。\n\n### 使用 su 和 sudo\n\n作为管理员，你通常想通过登录为特定用户来测试用户账户。遗憾的是，即使是管理员也不知道普通用户账户的密码。但是，root\
  \ 用户可以“切换用户”（`su`）到另一个用户账户，如下：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# id\n\
  uid=0(root) gid=0(root) groups=0(root)\nroot@onecoursesource:~# su - student\nstudent@onecoursesource:~$\
  \ id\nuid=1002(student) gid=1002(student)\ngroups=1002(student),4(adm),60(games),1001(ocs)\n\
  ```\n\n`su` 命令打开一个新的 shell，其中身份已切换到新用户（在本例中为 student 用户）。要返回原始账户，请使用 `exit` 命令关闭\
  \ shell，所示：\n\n点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$ id\nuid=1002(student)\
  \ gid=1002(student)\ngroups=1002(student),4(adm),60(games),1001(ocs)\nstudent@onecoursesource:~$\
  \ exit\nlogout\nroot@onecoursesource:~# id\nuid=0(root) gid=0(root) groups=0(root)\n\
  ```\n\n\n\n\n\n注意，在示例 7-6 中，学生用户最初无法运行 `apt-get` 命令。该命令用于在系统上安装软件，需要管理员权限。使用 `sudo`\
  \ 命令可以临时提升学生用户的权限，允许其以 root 用户身份执行 `apt-get` 命令。\n\n同时请注意示例 7-6 中的高亮区域，系统会要求学生用户输入密码。这是学生账户的密码，而不是\
  \ root 账户的密码。如果在执行此命令之前已经设置了 `sudo` 权限，则学生用户不需要 root 密码。\n\n这种访问是在一个名为 `/etc/sudoers`\
  \ 的文件中配置的。为了给学生账户提供访问权限，在该文件中加入了以下条目：\n\n点击此处查看代码图片\n\n```\nroot@onecoursesource:~#\
  \ grep student /etc/sudoers\nstudent ALL=/usr/bin/apt-get\n```\n\n该行的格式为 `account_name\
  \ SYSTEM*=*command`。`account_name` 和 `command` 都是自俗易懂的，但 `SYSTEM` 值需要稍微解释。这可能是该配置行有效的系统主机名。在这种情况下，它可能被设置为“onecoursesource”，因为这是当前系统的主机名。然而，如果将此\
  \ `/etc/sudoers` 文件复制到另一个系统，则必须更新该文件。在此处使用 `ALL` 作为值意味着“无论此文件位于哪个系统上，此行都适用”。\n\n\
  注意，不应直接修改 `/etc/sudoers` 文件，而应该使用 `visudo` 命令。该命令会执行基本的语法检查，并在出现问题时发布错误消息：\n\n点击此处查看代码图片\n\
  \n```\n>>> /etc/sudoers: syntax error near line 22 <<<\nWhat now?\nOptions are:\
  \ ?\n  (e)edit sudoers file again\n  e(x)it without saving changes to sudoers file\n\
  \  (Q)uit and save changes to sudoers file (DANGER!)\n\nWhat now? x\nroot@onecoursesource:~#\n\
  ```\n\n此外注意，只有 root 用户可以编辑 `/etc/sudoers` 文件。\n\n### 安全亮点\n\n对 `sudo` 的完整讨论超出了本书的范围。它是一个具有许多配置选项和功能的强大工具。考虑通过探索\
  \ `sudo` 和 `visudo` 命令的文档（man 和 info 页）以及 `sudoers` 文件来自行研究这个主题。\n\n最重要的是，仅在需要时提供\
  \ `sudo` 权限。过多的权限会导致严重的安全风险。\n\n### 限制用户账户\n\n可以使用几种方法来限制用户账户，包括文件权限和 SELinux。这些主题将在后面的章节讨论，但现在介绍一种是有意义的：可插认证模块\
  \ (PAM)。\n\nPAM 是一个强大的工具，允许管理员对用户账户提供许多限制。例如：\n\n* `PAM` 可以根据时间或日期限制对系统的访问。\n* `PAM`\
  \ 可以限制用户登录后的系统资源利用率，包括限制用户可以运行的进程数量或用户进程可以使用多少内存。\n* `PAM` 可以应用于特定的登录命令。这允许为用户本地登录与远程登录的情况设置不同的规则。\n\
  * `PAM` 可以用于为特定的登录事件创建额外的日志记录。\n\n前面的列表详细列出了 `PAM` 能提供的部分功能。`PAM` 是一组库，由本地命令行登录、SSH（安全外壳）和\
  \ FTP（文件传输协议）等基于认证的软件调用。基本上，每当用户账户需要认证时，都会使用 `PAM` 库来验证和校验用户。\n\n`PAM` 有一个主配置文件（`/etc/pam.conf`），但很少使用。相反，每个基于认证的软件程序在\
  \ `/etc/pam.d` 目录下都有独立的配置文件，如示例 7-7 所示。\n\n#### 示例 7-7：`/etc/pam.d` 目录\n\n点击此处查看代码图片\n\
  \n```\nroot@onecoursesource:~# ls /etc/pam.d\naccountsservice                cups-daemon\
  \             login\natd                            dovecot                 newusers\n\
  chfn                           gdm                     other\nchpasswd         \
  \              gdm-autologin           passwd\nchsh                           gdm-launch-environment\
  \  polkit-1\ncommon-account                 gdm-password            pop3\ncommon-auth\
  \                    gnome-screensaver       ppp\ncommon-password              \
  \  imap                    samba\ncommon-session                 lightdm       \
  \          sshd\ncommon-session-noninteractive  lightdm-autologin       su\ncron\
  \                           lightdm-greeter         sudo\n```\n\n你在该目录中看到的文件将取决于安装了哪些软件。例如，`ls`\
  \ 命令在安装 FTP 服务器之前执行过。示例 7-8 重点突出了 vsftpd 之后出现的一个新文件。\n\n#### 示例 7-8：vsftpd 之后的新文件\n\
  \n点击此处查看代码图片\n\n```\nroot@onecoursesource:~# ls /etc/pam.d\naccountsservice    \
  \            cups-daemon             login\natd                            dovecot\
  \                 newusers\nchfn                           gdm                 \
  \    other\nchpasswd                       gdm-autologin           passwd\nchsh\
  \                           gdm-launch-environment  polkit-1\ncommon-account   \
  \              gdm-password            pop3\ncommon-auth                    gnome-screensaver\
  \       ppp\ncommon-password                imap                    samba\ncommon-session\
  \                 lightdm                 sshd\ncommon-session-noninteractive  lightdm-autologin\
  \       su\ncron                           lightdm-greeter         sudo\n```\n\n\
  为了理解 `PAM` 如何工作，我们将关注单一服务：安全外壳（Secure Shell）。一个 PAM 配置示例（不包含注释行和空行）如示例 7-9 所示。\n\
  \n#### 示例 7-9：SSH 的示例 PAM 配置\n\n点击此处查看代码图片\n\n```\nroot@onecoursesource:~# grep\
  \ -v \"^#\" /etc/pam.d/sshd | grep -v \"^$\"\n@include common-auth\naccount    required\
  \     pam_nologin.so\n@include common-account\nsession [success=ok ignore=ignore\
  \ module_unknown=ignore default=bad]\npam_selinux.so close\nsession    required\
  \     pam_loginuid.so\nsession    optional     pam_keyinit.so force revoke\n@include\
  \ common-session\nsession    optional     pam_motd.so motd=/run/motd.dynamic noupdate\n\
  session    optional     pam_motd.so # [1]\nsession    optional     pam_mail.so standard\
  \ noenv # [1]\nsession    required     pam_limits.so\nsession    required     pam_env.so\
  \ # [1]\nsession    required     pam_env.so user_readenv=1 envfile=/etc/default/locale\n\
  session [success=ok ignore=ignore module_unknown=ignore default=bad]\npam_selinux.so\
  \ open\n@include common-password\n```\n\n\n\n\n\n| 模块 (Module) | 这是一个库（在 PAM 中技术上称为\
  \ `*module]*`），它执行特定任务并返回“成功”或“失败”。有很多模块可用，每个模块都设计用于执行与用户验证相关的特定任务。 |\n| 参数 (Argument(s))\
  \ |传递给模块的参数，用于更改模块的行为。某些模块不使用参数，而其他模块可能需要参数。从某种意义上说，这类似于你在 shell 中执行时发送的参数。 |\n\n\
  ## PAM 类别\n\n类别本质上是 PAM 可以执行的四个主要操作之一。这些操作在表 7-6 中有更详细的描述。\n\n### 表 7-6 PAM 类别\n\
  \n| **类别 (Category)** | **描述 (Description)** |\n| --- | --- |\n| **account** | 用于验证用户账户是否有权使用服务。这可能包括检查用户是否可以通过网络或在特定的日期时间登录。\
  \ |\n| **auth** | 用于验证（即确认）用户是其所声称的身份，通常是让用户为其尝试使用的账户提供密码。 |\n| **password** | 用于更新身份验证方法，例如为账户提供新密码。\
  \ |\n| **session** | 用于在向用户提供服务之前和之后执行操作。例如，这可以限制用户账户的访问。 |\n\n需要注意的是，当身份验证程序发出验证请求时，该程序会要求执行特定类别的模块。例如，如果用户通过\
  \ SSH 登录，则 SSH 工具将首先尝试验证用户名。这是通过要求 PAM 运行 `account` 类别中的模块来实现。如果所有这些模块都运行成功，那么 SSH\
  \ 工具将尝试验证用户身份，可能是通过验证用户是否为账户提供了正确的密码（SSH 还有其他可用方法）。这是通过要求 PAM 运行 `auth` 类别中的模块来实现。\n\
  \n假设这些模块返回“成功”，SSH 工具可能会运行 `session` 模块来建立用户的会话。使用“可能（may）”一词是因为这取决于编写 SSH 工具的开发者决定调用这些\
  \ PAM 类别中的哪些以及何时调用。作为管理员，由你来精细调整调用哪些模块，以自定义如何授予用户访问系统的权限。 |\n\n图 7-2 提供了此过程如何运作的视觉演示。图中的“S”箭头表示当模块运行时如果\
  \ PAM 返回“success”则将采取的操作。图中的“F”箭头表示当模块运行时如果 PAM 返回“failure”则将采取的操作。 |\n\n![Image](img/00036.jpeg)\n\
  \n**图 7-2** *使用 PAM 类别的 SSH*\n\n## PAM 控制值 (Control Values)\n\n决定一个类别是否成功很大程度上取决于控制值。这些值在表\
  \ 7-7 中有更详细的描述。\n\n### 表 7-7 PAM 控制\n\n| **控制类型 (Control)** | **描述 (Description)**\
  \ |\n| --- | --- |\n| **requisite** | 如果相应的模块返回“失败”，则该类别的其余模块将不再执行，该类别返回整体结果为“失败”。\
  \ |\n| **required** | 如果相应的模块返回“失败”，则该类别的整体结果将是“失败”。但是会执行额外的模块（它们的返回值不用于该类别的整体返回值）。\
  \ |\n| **sufficient** | 如果相应的模块返回“成功”，则该类别的整体结果将是“成功”，且不再执行任何额外的模块。然而，如果在指定了“required”控制时，之前的模块返回了“失败”，则此结果将被忽略。\
  \ |\n| **optional** | 除非该模块是该服务的唯一模块，否则相应模块的结果并不重要。通常，此值用于在身份验证过程中执行某些不需要测试成功或失败的操作。\
  \ |\n\n请注意，你可能会遇到一种更复杂的控制类型，你可以在下面的输出中看到示例：\n\n点击此处查看代码图像 |\n\n```\nroot@onecoursesource:~#\
  \ grep ^auth /etc/pam.d/common-auth\nauth    [success=1 default=ignore]    pam_unix.so\
  \ nullok_secure\nauth    requisite            pam_deny.so\nauth    required    \
  \        pam_permit.so\nauth    optional            pam_cap.so\n```\n\n`[success=1\
  \ default=ignore]` 控制类型允许管理员进一步精细调整 PAM 的行为，但这非常复杂，在很大程度上超出了本书的范围。如果你查阅 `pam.conf`\
  \ 的帮助页面，你会发现有几十种此类复杂的控制值。对于本书，我们关注四种主要的控制类型。 |\n\n## PAM 模块\n\nPAM 模块是实际执行的代码。每个模块执行一个特定任务并应该返回成功或失败的值。一些更有用的\
  \ PAM 模块在表 7-8 中描述。\n\n### 表 7-8 有用的 PAM 模块\n\n| **模块 (Module)** | **描述 (Description)**\
  \ |\n| --- | --- |\n| **pam_access** | 用于“基于位置”的访问控制 |\n| **pam_cracklib** | 用于修改密码策略\
  \ |\n| **pam_deny** | 始终返回“失败”结果 |\n| **pam_env** | 用于设置环境变量 |\n| **pam_khomedir**\
  \ | 用于创建家目录 |\n| **pam_nologin** | 用于判断用户的 shell 是否为 `/etc/nologin` |\n| **pam_tally**\
  \ | 用于计算登录尝试 |\n| **pam_time** | 用于“基于时间”的访问控制 |\n| **pam_unix** | 用于标准用户身份验证 |\n\
  \n**安全要点 (Security Highlight)**\n\nPAM 配置文件已经包含了几个被身份验证软件使用的模块。你可能会想要学习这些模块的作用，我们也鼓励你去探索它们。但是，除非你理解这些模块并意识到此类更改对身份验证软件的影响，否则请不要在配置文件中更改或删除这些模块。\
  \ |\n\n本书重点关注如何对这些模块中的某些进行特定更改，以及如何向配置文件添加关键的 PAM 模块。并不是每个 PAM 模块都会被详细介绍。 |\n\n\
  ## 使用 PAM 修改密码策略\n\nPAM 的一个用法是修改默认密码策略。如表 7-9 所示，你可以为 `pam_cracklib` 模块提供参数来修改许多密码设置。\n\
  \n### 表 7-9 pam_cracklib 密码设置\n\n| **参数 (Argument)** | **描述 (Description)** |\n\
  | --- | --- |\n| **difok=N** | 新密码必须包含多少不同的字符。 |\n| **difignore=N** | 在忽略 `difok`\
  \ 设置的限制之前，新密码需要多少个字符。 |\n| **minlen=N** | 密码允许的最小字符长度。 |\n| **retry=N** | 在显示错误消息之前提示用户的次数（默认为\
  \ 1）。 |\n| **type=name** | 在用户更改密码时向其显示的消息（默认为 Unix）。 |\n\n`minlen` 参数与四个额外参数配合使用：`dcredit`（数字计数）、`lcredit`（小写字母计数）、`ocredit`（其他字符计数）和\
  \ `ucredit`（大写字母计数）。这些项目中的每一个项都可以分配一个值，用于“满足”密码最小长度的要求。 |\n\n例如，以下要求密码最小长度为 12 个字符，但使用一个大写字母可以计\
  \ 12 个字符最小长度中的三个（使用多个大写字母不会提供额外的额度）： |\n\n\n\n\n\n点击此处查看代码图像\n\n```\npassword  \
  \  required    pam_cracklib.so minlen=12 ucredit=3\n```\n\n### 注意事项\n\n并不是所有的 Linux\
  \ 发行版都默认安装了 `cracklib` 模块。在使用基于 Debian 的系统时，请以 root 用户身份执行以下命令来安装该模块（如果需要）：`apt-get\
  \ install libpam-cracklib`。在基于 Red Hat 的系统上，运行此命令：`yum install libpam-cracklib`。\n\
  \n### 可能会出现什么问题？\n\n更改 PAM 配置文件时务必非常小心。你可能会轻易锁定 root 账户。建议在更改 PAM 配置文件后，保持当前系统的登录状态，并尝试作为\
  \ root 用户进行另一次登录，以确认你是否仍然可以访问系统。此外，请务必在对配置文件进行任何更改之前始终进行备份，以便于将文件还原到其原始值。\n\n除了\
  \ `pam_cracklib` 库之外，你还可以使用 `pam_unix` 库来修改密码策略。例如，你可以使用 `remember=N` 参数让 PAM 记住\
  \ `N` 个密码（这样用户就不能反复重复使用相同的密码）。旧密码以加密格式存储在 `/etc/security/opasswd` 中。\n\n以下是 `/etc/pam.d/common-password`\
  \ 文件中密码设置的示例：\n\n点击此处查看代码图像\n\n```\nPassword    required    pam_cracklib.so minlength=12\
  \ ucredit=3\ntype=Linux\npassword    [success=1 default=ignore]    pam_unix.so obscure\n\
  use_authtok try_first_pass sha512 remember=7\n```\n\n### 总结\n\nLinux 操作系统使用用户账户来控制对关键组件（包括文件和目录）的访问。在本章，你学习了如何管理这些用户账户。这包括如何创建、修改、保护和删除用户账户，以及如何使用特殊组账户功能（包括受限制的用户账户）。\n\
  \n#### 关键术语\n\n- 守护进程\n- NFS\n- skel 目录\n- GECOS\n- LDAP\n- NIS\n- 活动目录\n- Samba\n\
  - NSS\n- PAM\n\n#### 复习题\n\n**1.** 用户密码和密码过期数据存储在 `/etc/`_____ 文件中。\n\n**2.** 哪个\
  \ UID 使 root 账户成为系统上的管理员？\n\n1. 0\n2. 1\n3. 10\n4. 125\n\n**3.** 在 `/etc/shadow`\
  \ 文件的这一行中，值 `7` 代表什么？\n\n```\nsync:*:16484:0:99999:7:::\n```\n\n1. 上次修改密码日期字段\n\
  2. 最小密码有效期字段\n3. 最大密码有效期字段\n4. 密码警告期字段\n\n**4.** `/etc/default/`_____ 文件包含了 `useradd`\
  \ 命令所使用的默认值。\n\n**5.** PAM 配置文件存储在 `/etc/`_____ 目录中。\n\n# 第 8 章：制定账户安全策略\n\n本书书的一个重要组成部分是关注如何使系统更加安全。在现代\
  \ IT 环境中，安全是一个非常重要的课题，尽早学习如何保护系统将帮助你加强自己的 Linux 技能树。\n\n书中的大部分部分都以一个专门关注安全的章节作为结束。在这些章节中，你学习了如何保护\
  \ Linux 的特定组件。本章的重点是保护你的组账户和用户账户。\n\n你有大量的工具和功能可用，帮助你保护 Linux。虽然本书无法涵盖所有这些内容，但你将接触到其中许多工具。\n\
  \n在阅读本章并完成练习后，你将能够完成以下操作：\n\n- 使用 Kali Linux 对系统进行安全探测\n- 为用户账户创建安全策略\n\n### 介绍\
  \ Kali Linux\n\n之前我们讨论了不同的 Linux 发行版，包括某些发行版如何非常关注某个特定功能。有很多基于安全的发行版，其中某些在默认情况下原生更安全。另一些则提供了设计用于增强你环境安全性的工具和功能。图\
  \ 8-1 根据 [distrowatch.com](http://distrowatch.com) 显示了最流行的基于安全的 Linux 发行版。\n\n![Image](img/00037.jpeg)\n\
  \n**图 8-1** *基于安全的 发行版*\n\n最流行的发行版之一是 Kali Linux，它旨在为你提供测试安全的工具。我们将在书中多次使用该发行版。安装\
  \ Kali Linux 后，你可以通过点击**应用程序**来访问这些工具，如图 8-2（part0021.html_fig8_2）所示。\n\n![Image](img/00038.jpeg)\n\
  \n**图 8-2** *Kali Linux 应用程序*\n\n工具分为不同的类别。例如，“密码攻击”类别包含了测试用户账户强度的工具。我们不会涵盖 Kali\
  \ Linux 的所有工具，但书的每个部分都会包含一些重要工具的讨论，你可以自行探索其他。\n\n### 安全原则\n\n在继续之前，应该对 `安全` 一词进行更好的定义。尽管它看起来是一个简单的词，但实际上相当复杂。\n\
  \n大多数人认为“安全”是防止黑客进入系统的东西，但它包含的内容要多得多。从安全的角度来看，你的目标是让正确的实体可以使用系统和服务数据，同时拒绝未经授权实体的访问。\n\
  \n我们使用 `实体` 一词是因为我们指不仅仅是人。例如，你可能有一个服务向其他系统提供用户账户信息。这些信息不应提供给不应该访问的系统。\n\n你还必须在提高安全性和可用性之间找到正确的平衡。换句话说，如果你把系统锁得太死，以至于授权实体无法获得所需的访问，你实际上降低了系统的安全性。\n\
  \n你还必须关注可能尝试获取未经授权的授权用户。内部用户具有优势，因为他们已经通过自己的账户越过了一层安全防护。他们通常默认情况下受到信任，因此安全人员和管理员经常忽视他们作为未经授权访问的来源。\n\
  \n外部黑客也可能通过让系统拒绝授权实体访问来破坏你的安全（实际上，内部黑客也可能这样做）。有些人乐于让关键服务器（如你的 Web 服务器）无法访问，或者发布令人尴尬的消息来损害公司的声誉。\n\
  \n\n\n\n将保护 Linux 系统或网络考虑为类似于保护一家银行。你可能看过电影或电视节目，其中复杂的银行安全系统被非常聪明且意志坚定的小偷攻破了。你的目标是让你的系统变得足够安全，以至于只有非常聪明且意志坚定的黑客才有机会攻破它。\n\
  \n## 创建安全策略\n\n良好的安全策略应该为管理员和用户提供一个可以遵循的蓝图。它至少应该包含以下内容：\n\n*   一组规则，用于确定系统上允许和不允许执行的操作。例如，这组规则可以描述所有用户都必须遵守的密码策略。\n\
  *   一种确保所有规则得到遵守的手段。这可能包括主动运行探测系统安全的程序，以及查看系统日志文件以发现可疑活动。\n*   一个定义良好的、用于处理系统被攻破时的计划：通知谁、应该采取哪些行动等。这通常被称为`应急响应计划`（incident\
  \ response plan）。\n*   一种在获得新信息时积极更改策略的方法。应该主动寻求这些信息。例如，大多数 Linux 发行版都有方法可以有关新漏洞和工具（如补丁和更新），以及解决这些漏洞的技术。\n\
  \n## 保护账户\n\n在保护用户账户时，你必须考虑几个组成部分。这些包括：\n\n*   系统或网络的物理安全\n*   用户教育\n*   确保账户不会易受攻击\n\
  \n### 物理安全\n\nIT 安全人员往往会忽略将物理安全作为安全策略的一部分。这有时是因为他们认为“物理安全不是 IT 部门的责任”，因为许多公司有专门的部门负责物理安全。如果是如此，这两个部门应该合作以确保获得最佳的整体安全策略。如果不是这样，那么物理安全可能完全是\
  \ IT 部门的责任。\n\n在制定包含物理安全的策略时，你应该考虑以下因素：\n\n*   确保对组织内系统的物理访问安全，特别是关键任务服务器，如邮件服务器和\
  \ Web 服务器。务必考虑哪些系统具有修改其他系统所需的访问权限和权限。\n*   确保网络物理访问的安全。未经授权的人不应具有访问任何网络资产的物理权限。\n\
  *   防止未经授权的人查看你的系统，特别是终端窗口。黑客可以通过查看键盘输入和终端窗口上显示的数据来收集信息。这些信息可用于破坏安全。\n*   为关键任务系统的\
  \ BIOS 设置密码保护，特别是当这些系统无法在物理上做到 100% 安全时。\n*   保护系统免受盗窃和硬件错误。\n\n物理安全还有许多其他方面需要你考虑。本节的目的是鼓励你思考如何将物理安全作为系统安全保护的一部分。请将此视为多层安全策略的第一道防线。\n\
  \n### 教育用户\n\n多年前，这本书的作者之一曾教过一门 Linux 安全课程，他说（主要是开玩笑地说的）“无论你们做什么，千万不要把密码写下来并贴在键盘下面。”在引起全班的一阵大笑后，一个学生说：“没有人真的会那样做，对吧？”在午休期间，其中几个学生在办公室里转了一圈，翻过键盘并发现了三个密码。实际上，还发现了第四个密码被贴在一名员工的显示器上。\n\
  \n显然，用户在安全策略中起着至关重要的作用。他们通常没有意识到自己的行为如何破坏安全。在创建安全策略时，你应该考虑如何鼓励用户让你的系统变得更安全，而不是不安全。例如，考虑以下措施：\n\
  \n*   鼓励用户使用强密码。\n*   警告用户安装未经你组织批准或支持的软件。\n*   鼓励用户立即报告任何可疑活动。\n*   要求用户在不安全的位置（如公共\
  \ Wi-Fi 点）登录访问关键系统时要小心。如果用户必须从不安全的位置访问关键系统，考虑实施 VPN（虚拟专用网络）技术。\n*   警告用户他们永远不要与任何人共享他们的账户或密码。\n\
  *   教育用户点击电子邮件中的链接或打开来自未知来源的附件。这些内容通常包含病毒或蠕虫，或者可能是欺骗尝试（试图伪装成合法资源以获取账户信息的尝试）。即使发送者是已知的或值得信任的，如果他们的邮箱账户被攻破，信息也可能包含恶意软件。\n\
  \n教育用户本身是一个相当大的话题，但在制定安全策略时，你应该在上面投入大量的精力和精力。我们鼓励你进一步探索这个话题，因为进一步的讨论超出了本书的范范围。\n\
  \n### 账户安全\n\n你可以在系统上采取特定行动来使账户更安全。这些行动某些将在本书的后部分介绍。例如，你可以通过`PAM`（可插拔认证模块）的功能让用户账户更安全，该主题在第\
  \ 7 章“管理用户账户”中详细介绍过。另一个例子：第 25 章“系统日志”讨论了使用系统日志——这在保护用户账户时是一个重要主题。系统日志用于确定是否有人尝试获取系统的未经访问权限。\n\
  \n本节涵盖了一系列用户账户安全主题。每个主题都经过简要解释，然后我们提供如何将该主题整合到安全策略中的思路。\n\n#### 用户账户名\n\n考虑一下，黑客要获取系统的未经访问权限，需要两部分信息：用户名和用户密码。防止黑客获取用户名将使黑进系统的过程变得困难。考虑使用难以猜测的账户名。\n\
  \n例如，不要为 Bob Smith 创建名为 `bsmith` 的账户。如果黑客知道 Bob Smith 在公司工作，这对黑客来说很容易猜。考虑使用类似 `b67smith`\
  \ 的用户账户名。记住，你的员工可能出现在公司网站或介绍他们与公司关系的新闻中。\n\n**将其纳入安全策略中**：创建一条规则，所有用户账户必须是通过真实姓名难以猜出的内容。此外，使用邮件别名（参见第\
  \ 20 章“网络服务配置：基本服务””）来向外界隐藏用户名。\n\n#### 无密码的用户\n\n正如你可能猜到的，没有密码的用户构成了巨大的安全风险。如果\
  \ `/etc/shadow` 文件完全没有密码，只需要用户名即可登录系统。\n\n**将其纳入安全策略中**：创建一个 crontab 条目（参见第 14 章“crontab\
  \ and at”），定期执行以下命令：\n\n```\ngrep \"^[^:]*::\" /etc/shadow\n```\n或者，可以使用在本章后面介绍的安全工具之一。\n\
  \n#### 防止用户更改密码\n\n\n\n\n\n在某些用例下，你不希望用户更改账户密码。例如，假设你有一个访客账户，其设计用于为非员工提供限制性的系统访问。你不希望任何使用此账户的人更改密码，因为这将阻止下一次访客使用该账户。\n\
  \n如果你将 `/etc/shadow` 文件的 `min` 字段设置得比 `max` 字段高，那么用户将无法更改账户密码（注意：在某些发行版中，如 Kali，`min`\
  \ 字段的选项为 `-n`，`max` 字段的选项为 `-x`）：\n\n点击此处查看代码图片\n\n```\npasswd -m 99999 -M 99998\
  \ guest\n```\n\n**将其纳入安全策略中**：确定哪些账户应该受到此限制，并根据需要应用该限制。记住定期更改密码，以免过去的“访客”以后仅因为知道密码就能再次访问系统。\n\
  \n### 应用程序账户\n\n上一个示例中描述的访客账户也可以应用程序账户。对于应用程序账户，应仅允许命令行登录（系统不应显示 GUI）。然后，将 `/etc/passwd`\
  \ 文件中该用户的最后一个字段更改为应用程序，如下所示：\n\n点击此处查看代码图片\n\n```\nguest:x:9000:9000:Guest account:/bin/guest_app\n\
  ```\n\n`/bin/guest_app` 将运行一个提供系统受限访问的程序。如果你希望该账户能够访问多个一个一个程序，也可以考虑使用 第 7 章 中描述的受限\
  \ shell。\n\n**将其纳入安全策略中**：确定哪些账户应该受到此限制，并根据需要应用该限制。\n\n### 启用进程审计\n\n可以使用名为 `psacct`\
  \ 的软件工具来跟踪用户执行的所有命令。在那些怀疑黑客攻击尝试可能成功的系统上，这一点非常重要。需要按照以下步骤下载并安装该工具：\n\n1. 从 [`ftp.gnu.org/gnu/acct/`](http://ftp.gnu.org/gnu/acct/)\
  \ 下载该工具。\n2. 执行 `gunzip acct` 命令来解压下载的文件。\n3. 执行 `tar -xvf acct` 命令来提取文件内容。\n4.\
  \ 执行 `cd` 命令进入由 `tar` 命令创建的目录。\n5. 执行 `./configure; make; make install` 命令安装软件。\n\
  \n软件安装后，你可以通过先创建服务将存储数据的日志文件来启动服务：\n\n点击此处查看代码图片\n\n```\nmkdir /var/log/account\n\
  touch /var/log/account/pact\n```\n\n然后使用以下命令启动服务：\n\n```\naccton on\n```\n\n服务启动后，你可以使用\
  \ `lastcomm` 命令查看已执行的命令：\n\n点击此处查看代码图片\n\n```\nroot@onecoursesource:~# lastcomm\n\
  more              root     pts/0      0.00 secs Sun Feb 25 15:42\nbash         \
  \  F  root     pts/0      0.00 secs Sun Feb 25 15:42\nkworker/dying  F  root   \
  \  __         0.00 secs Sun Feb 25 15:31\ncron          SF  root     __        \
  \ 0.00 secs Sun Feb 25 15:39\nsh            S   root     __         0.00 secs Sun\
  \ Feb 25 15:39\nlastcomm          root     pts/0      0.00 secs Sun Feb 25 15:37\n\
  accton        S   root     pts/0      0.00 secs Sun Feb 25 15:37\n```\n\n`ac` 命令也提供了有用信息。例如，要查看每个用户在过去\
  \ 24 小时内所有登录时间的摘要，请使用 `ac -p --individual-totals` 命令。\n\n**将其纳入安全策略中**：在可能存在漏洞的关键系统（如\
  \ Web 服务器和邮件服务器）上，包含此软件包并使用 crontab 条目（关于 crontab 条目的信息请参阅 第 14 章）来生成定期报告（每或每日）。\n\
  \n### 避免以超级用户身份运行命令\n\n大量的轶事涉及系统管理员由于意外以 root 用户身份运行了某些命令，导致系统被破坏并造成了严重混乱。考虑一种你运行\
  \ `rm -r /` 命令的情况。作为一个普通用户，你可能会删除你自己的文件，但权限（在 第 9 章，“文件权限””中讨论过）会阻止你删除系统上任何你不拥有的文件。然而，如果该命令是由登录为\
  \ root 用户的人运行的，那么所有文件都可能被毁。\n\n**将其纳入安全策略中**：始终以普通用户身份登录。\n\n### 安全工具\n\n许多安全工具可以用来发现漏洞。在\
  \ Kali Linux 上，这些工具是默认安装并配置好的。在 Kali Linux 上，本节描述了使用这些工具，但这些工具也可以在其他发行版上通过 `sudo`\
  \ 来获取信息（详情请参见 第 9 章）。\n\nImage\n\n**图 8-3** *密码攻击*\n\n你可能还会考虑“13 – 社会工程学”。社会工程是一种通过非技术手段获取信息的技巧。例如，黑客可能会假装成公司的\
  \ IT 团队成员获取信息。\n\n#### john 和 Johnny 工具\n\n`john` 工具（全名：John the Ripper）是一个命令行密码破解工具。命令行工具的优势在于你可以通过\
  \ crontab 条目（关于 crontab 条目的信息请参阅 第 14 章）来自动化它，从而定期运行该工具。\n\nJohnny 工具是 `john` 工具的\
  \ GUI 版本。这种 GUI 工具的优势在于你不需要记忆所有的选项。\n\n在两种情况下，你都需要一个包含 `/etc/passwd` 和 `/etc/shadow`\
  \ 条目的的文件。你可以通过运行以下命令创建此文件：\n\n```\ncat /etc/passwd /etc/shadow > file_to_store\n\
  ```\n\n运行 Johnny 时，可以通过点击 **Open password file** 加加载该文件。接下来，选择你想破解的账户，然后点击 **Start\
  \ new attack**。当每个账户被破解时，它都会显示出来，如图 8-4 所示。\n\nImage\n\n**图 8-4** *破解的密码*\n\n要查看执行了什么\
  \ `john` 命令，点击 **Console log** 按钮，如图 8-5 所示。\n\nImage\n\n**图 8-5** *john 命令*\n\n\
  #### hydra 工具\n\n与 `john` 工具使用用户账户和密码文件不同，`hydra` 工具通过特定协议主动探测系统。例如，以下命令将使用 `hydra`\
  \ 工具通过 FTP（文件传输协议）攻击本地系统：\n\n点击此处查看代码图片\n\n```\nhydra -l user -P /usr/share/set/fasttrack/wordlist.txt\
  \ ftp://127.0.0.1\n```\n\n\n\n\n\n请注意，不要在任何您没有书面授权进行安全分析的系统上运行此类命令。在其他组织的系统上尝试运行此命令可能被视为黑客入侵。\n\
  \n字典列表文件是系统上许多可用文件之一。点击 `Applications`、`05 – Password Attacks`、`wordlists` 来显示文件列表，如图\
  \ 8-6 所示。\n\n![Image](img/00042.jpeg)\n\n**图 8-6** 显示字典列表*\n\n你也可以网上网上许多字典列表。\n\n\
  ### 总结\n\n你已经开始了学习创建安全策略的过程。在本书五个主要部分的结束时，你将扩展这些知识。根据你在这一章中学到的内容，你应该已经拥有创建用户账户安全策略所需的信息，包括使用\
  \ Kali Linux 提供的工具进行安全扫描。\n\n#### 复习题\n\n**1.** 填入缺失的选项，使 `bob` 账户的用户无法更改密码：`passwd\
  \ _____ 99999 -M 99998 bob`\n\n**2.** 哪个命令可以用于查找没有密码的用户？\n\n1. `find`\n2. `grep`\n\
  3. `passwd`\n4. `search`\n\n**3.** `_____` 包提供了进程计数功能。\n\n**4.** 下列哪些实用程序可以执行密码破解操作？\n\
  \n1. `john`\n2. `nick`\n3. `jill`\n4. `jim`\n\n**5.** 哪个命令可以用于从普通用户切换到 root 用户？\n\
  \n1. `switch`\n2. `sed`\n3. `du`\n4. `su`\n\n# 第三部分\n\n## 文件与数据存储\n\n任何操作系统中最关键的元素之一就是数据。这些数据存储在介质设备上，如硬盘、DVD\
  \ 和 USB 驱动器。为了组织和保护数据，Linux 使用了文件系统。\n\n理解文件系统的特性以及如何使用工具保护存储在文件系统中的数据，对于所有在该操作系统的用户来说都是重要任务。例如，普通用户必须学习如何使用权限保护自己的文件；而系统管理员则必须使用各种技能来保护系统文件。\n\
  \n在第三部分，“文件与数据存储”，你将探索以下章节：\n\n*   第 9 章，“文件权限”，侧重于使用 Linux 权限保护文件。本章还深入了更高级主题，例如特殊权限、`umask`、访问控制列表和文件属性。\n\
  *   第 10 章，“管理本地存储：要素”，涵盖了与本地存储设备概念相关的主题。这包括如何创建分区和文件系统，以及一些额外的基本文件系统特性。\n*   第\
  \ 11 章，“管理本地存储：高级特性”，涵盖了与本地存储设备高级特性相关的主题。这包括如何使用 `autofs` 创建加密文件系统。你还学习了逻辑卷管理，这是管理本地存储设备的另一种方法。\n\
  *   第 12 章，“管理网络存储”，讨论了如何让存储设备跨网络可用。包含了文件系统共享技术，如网络文件系统 (NFS)、Samba 和 iSCSI。\n*\
  \   第 13 章，“制定存储安全策略”，为你提供了利用在第 9 章、第 10 章、第 11 章和第 12 章中获得的知识来创建安全策略的方法。\n\n##\
  \ 第 9 章\n\n### 文件权限\n\n理解文件和目录权限对于 Linux 安全至关重要，因为 Linux 是一个多用户环境，权限的设计是为了保护你的工作不受他人干扰。要理解权限，你首先需要知道\
  \ Linux 中提供的权限类型，以及它们应用于文件和目录时的不同之处。\n\n一旦你理解了不同的权限，你就知道如何设置它们。Linux 提供了两种方法：符号法和八进制（或数字）法。\n\
  \n你还在本章中学习了特殊权限，包括 SUID、SGID 和粘滞位（sticky bit）。这些权限为文件和目录提供了特殊访问，通常由系统管理员管理。\n\n\
  还将介绍几个与权限相关的课题，包括默认权限、访问控制列表 (ACL) 以及更改文件和目录的用户和组所有权。\n\n阅读本章并完成学习后，你将能够：\n*   在文件目录中使用特殊权限\n\
  *   为文件设置默认权限\n*   使用访问控制列表限制访问\n*   使用文件属性进行安全操作\n\n### 标准权限\n\n每个文件和目录都有标准权限（也称为读、写和执行），它们允许或拒绝访问。\n\
  \n### 查看权限\n\n要查看文件或目录的权限，使用 `ls -l`：\n\n```\n[student@localhost ~]$ ls -l\n-rw-r--r--\
  \ 1 root group 62 May 9 2018\n```\n\n输出的第一个字符表示文件类型（记住，如果第一个位置是 -，表示普通文件，d 表示目录）以及文件的权限。权限被分为三组：用户所有者、组和其他用户。\n\
  \n每组有三种可能的权限：读（用 **r** 表示）、写（用 **w** 表示）和执行（用 **x** 表示）。如果设置了该权限，就会显示表示该权限的字符。否则，将显示一个连字符（–）表示未设置该权限。因此，`r-x`\
  \ 意味着“设置了读和执行，但没有设置写”。\n\n#### 文件与目录\n\n读、写和执行权限的具体含义取决于对象是文件还是目录。对于文件，这些权限意味着：\n\
  *   **读**：查看或复制文件内容。\n*   **写**：修改文件内容。\n*   **执行**：像程序一样运行文件。创建程序后，必须使其变为可执行才能运行。\n\
  \n对于目录，它们意味着：\n*   **读**：列出目录的文件。\n*   **写**：在目录中添加和删除文件（需要执行权限）。\n*   **执行**：`cd`\
  \ 进入目录或在路径中使用它。\n\n### 安全要点\n\n目录的写权限可能是危险的。如果用户对你的某个目录具有写和执行权限，那么该用户就可以删除目录中的所有文件。\n\
  \n### 修改权限\n\n`chmod` 命令用于更改文件的权限。它可以用两种方式使用：符号法和八进制法。在八进制法中，权限被赋予了数值：\n\n*   读\
  \ = 4\n*   写 = 2\n*   执行 = 1\n\n通过这些数值，可以用一个数字来描述整个权限集：\n\n*   7 = **rwx**\n*  \
  \ 6 = **rw-**\n*   5 = **r-x**\n*   4 = **r--**\n*   3 = **-wx**\n*   2 = **-w-**\n\
  *   1 = **--x**\n*   0 = **---**\n\n\n\n\n\n因此，若要将一个文件的权限更改为 `rwxr-xr--`，你需要执行以下命令：\n\
  \n```\nchmod 754 filename\n```\n\n使用八进制权限时，你应该始终提供三个数字，这将更改所有权限。但是，如果你只想更改集合中的某一个权限呢？对于这种情况，请通过向\
  \ `chmod` 命令传递三个值来使用符号方法，如表 9-1 所示。\n\n#### 表 9-1 符号方法值\n\n| 实体 | 操作 | 权限 |\n| ---\
  \ | --- | --- |\n| u = 用户所有者 | + | `r` |\n| g = 组所有者 | - | `w` |\n| o = 其他 | = |\
  \ `x` |\n| a= 所有 | | |\n\n以下演示了如何使用符号方法为所有三个集合（用户所有者、组所有者和其他）添加执行权限：\n\n点击此处查看代码图像\n\
  \n```\n[student@localhost ~]$ ls -l display.sh\n-rw-rw-r--. 1 student student 291\
  \ Apr 30 20:09 display.sh\n[student@localhost ~]$ chmod a+x display.sh\n[student@localhost\
  \ ~]$ ls -l display.sh\n-rwxrwxr-x. 1 student student 291 Apr 30 20:09 display.sh\n\
  ```\n\n#### 对话式学习™——八进制与符号权限\n\n**Gary**：你好，Julia。我有些地方困惑。为什么我们有两个方法可以更改权限呢？\n\n\
  **Julia**：你好，Gary。你指的是八进制权限和符号权限吗？\n\n**Gary**：是的！看起来只需要其中一种。\n\n**Julia**：从技术上来说，是的。如果你愿意，可以始终使用八进制或始终使用符号权限。然而，了解两者会让你的生活变得更轻松。\n\
  \n**Gary**：你什么意思？\n\n**Julia**：假设你只想为组所有者添加读权限，并且选择选择八进制方法。在这种情况下，在你运行 `chmod` 命令之前，你首先需要做什么？\n\
  \n**Gary**：嗯，我必须先列出当前权限，以确定使用什么值来添加新权限。\n\n**Julia**：完全正确。在这种情况下，直接使用 `g+r` 不是更简单吗？\n\
  \n**Gary**：好吧，所以像这样进行微小的权限更改，使用符号方法会更简单。但为什么要用八进制方法呢？\n\n**Julia**：嗯，如果你想完全更改权限，或者仅仅是更改几个呢？直接确定八进制值并使用它，可能比执行像\
  \ `u+wx,g-xo-wx` 这样复杂的操作要容易得多。\n\n**Gary**：噢，对的，在那种情况下符号方法可能会变得非常糟糕。我明白了。谢谢你的建议！\n\
  \n**Julia**：不客气！\n\n### 默认权限\n\n当用户创建文件或目录时，shell 会自动设置默认权限。默认权限是一个可配置选项。`umask`\
  \ 命令设置一个值，用于确定文件和目录的默认权限。注意，这些默认权限仅在文件或目录初始创建时生效。\n\n`umask` 命令用于指定在创建新文件或目录时掩码（不包含）哪些默认权限。\n\
  \n`umask` 命令接受一个参数：掩码值。掩码值是一个八进制值，作用于新文件或新目录的最大可能权限，如表 9-2 所示。\n\n#### 表 9-2 最大可能权限\n\
  \n| 类型 | 新项目的最大权限 |\n| --- | --- |\n| 文件 | `rw-rw-rw-` |\n| 目录 | `rwxrwxrwx` |\n\
  \n如表 9-2 所示，新文件永远不会被赋予执行权限。此权限集必须在创建文件创建后添加。\n\n图 9-1 描述了 027 的 `umask` 值如何应用于新文件，以及它是如何应用于新目录的\n\
  \n![图像](img/00043.jpeg)\n\n**图 9-1** 对文件和目录应用 027 `umask` 值\n\n虽然可以使用任何八进制值来确定权限掩码，但某些值更为常用。表\
  \ 9-3 演示了这些常用 `umask` 值对新文件和目录的影响。\n\n#### 表 9-3 常用 `umask` 值\n\n| 值 | 文件 | 目录 |\n\
  | --- | --- | --- |\n| 002 | `rw-rw-r--` | `rwxrwxr-x` |\n| 022 | `rw-r--r--` |\
  \ `rwxr-xr-x` |\n| 027 | `rw-r-----` | `rwxr-x---` |\n| 077 | `rw-------` | `rwx------`\
  \ |\n\n注意你也可以使用符号方法来指定 `umask`。例如，`umask rw-rwr---` 命令与 `umask 002` 命令相同。\n\n每个\
  \ shell 都有自己的 `umask` 值。如果你在一个 shell 中更改了 `umask`，它不会影响其他 shell。要使 `umask` 修改持久，请将\
  \ `umask` 命令添加到 `~/.bash_profile` 文件。\n\n重要的是你需要理解 `umask` 值是为了为文件和目录提供指定默认权限的简单方法。在文件或目录创建后，可以使用\
  \ `chmod` 命令来满足特定情况。\n\n### 可能会出现什么问题？\n\n有时要确定为什么无法访问文件或目录可能非常沮丧。例如，考虑以下命令：\n\n\
  点击此处查看代码图像\n\n```\nbob@onecoursesource:~# cp sample /etc/skel\ncp: cannot create\
  \ 'sample1': Permission denied\n```\n\n问题在哪里？为了发现错误，首先查看错误消息。在这种情况下，问题似乎在 `/etc/skel`\
  \ 目录上，而不是 `sample` 文件上。\n\n接下来，通过查看每个目录的权限来确定你是否可以进入目录。最后，查看目标目录的写入权限\n\n\n\n\n\n\
  这看起来很奇怪，因为正如你在第 7 章“管理用户账户”中所学习到的那样，用户账户密码存储在 `/etc/shadow`文件中。为了修改该文件的内容，用户需要读取和写入权限。然而，当用户运行命令时，他们对文件的访问是基于其账户（UID\
  \ 和 GIDs）。那么，学生用户是如何能够修改一个他通常甚至无法查看的文件的呢？\n\n答案在于 `passwd` 命令本身的权限：\n\n点击此处查看代码图片\n\
  \n```\nstudent@onecoursesource:~$ which passwd\n/usr/bin/passwd\nstudent@onecoursesource:~$\
  \ ls -l /usr/bin/passwd\n-rwsr-xr-x. root root 27768 Nov 25 06:22 /usr/bin/passwd\n\
  ```\n\n所有者执行权限位的 `s` 字符意味着该文件设置了 SUID 权限。有了 SUID 权限，命令会执行“以...身份运行”的功能，这允许 `passwd`\
  \ 命令以学生账户或所有 `/usr/bin/passwd` 文件的账户（在本例中为 root 用户）的身份访问文件。由于 `passwd` 命令拥有“root\
  \ 权限”，它能够临时修改 `/etc/shadow` 文件的权限以从而修改其内容。\n\n### 安全要点\n\nSUID 权限通常应用于 root 用户拥有的文件。出于安全考虑，意识到你系统上的\
  \ SUID 程序是非常重要的。\n\n你可以使用示例 9-1 所示的 `find` 命令来发现这些程序（注意：使用 `head` 命令是为了限制输出，因为该命令可能会产生几十个\
  \ SUID 程序）。\n\n**示例 9-1** 使用 `find` 发现程序\n\n点击此处查看代码图片\n\n```\nstudent@onecoursesource:~$\
  \ find / -perm -4000 -ls | head\n    13972     40 -rws--x--x   1  root     root\
  \        40248 Feb 11  2018 /usr/sb\nin/userhelper\n    13964     36 -rwsr-xr-x\
  \   1  root     root        36176 Mar 10  2018 /usr/sb\nin/unix_chkpwd\n    13802\
  \     92 -rwsr-xr-x   1  root     root        89472 Mar  2  2018 /usr/sb\nin/mtr\n\
  \    13830     12 -rwsr-xr-x   1  root     root        11152 Mar 10  2018 /usr/sb\n\
  in/pam_timestamp_check\n    13974     12 -rwsr-xr-x   1  root     root        11192\
  \ May 26  2018 /usr/sbin/usernetctl\n```\n\n### 安全要点\n\n你应该何时运行 `find` 命令来发现 SUID\
  \ 程序？最初是在安装完操作系统之后。注意每个 SUID 程序，并确定哪些并不真正需要 SUID。例如，在第 6 章“管理组账户”中讨论过的 `newgrp`\
  \ 命令就是一个 SUID 程序。如果你不需要用户使用此命令，可以考虑禁用 SUID 功能，因为这将使系统更加安全。\n\n此外，在安装新软件时也运行 `find`\
  \ 命令。软件供应商喜欢向系统添加可能并不真正需要的 SUID 程序。这会导致虚假的权限提升以及软件内部的漏洞。\n\n最后，每当你怀疑系统被入侵时，都运行 `find`\
  \ 命令。黑客喜欢创建 SUID 程序来为以后访问系统留留“后门”。\n\n要设置 SUID 权限，请使用以下方法之一（注意 `xxx` 指标准的读、写、执行权限）：\n\
  \n```\nchmod u+s file\n```\n\n或者\n\n```\nchmod 4xxx file\n```\n\n要取消 SUID 权限，请使用以下方法之一：\n\
  \n```\nchmod u-s file\n```\n\n或者\n\n```\nchmod 0xxx file\n```\n\n### SGID\n\n与 SUID\
  \ 权限类似，SGID 权限可以用于通过命令的组所有权执行访问文件和目录的。例如，考虑以下情况：\n\n点击此处查看代码图片\n\n```\nstudent@onecoursesource:~$\
  \ ls -l /usr/bin/write\n-rwxr-sr-x 1 root tty 19544 Nov 27  2018 /usr/bin/write\n\
  ```\n\n`write` 命令设置了 SGID 权限（注意组执行权限位置上的 `s`），这意味着...\n\n\n\n\n\n```\nroot@onecoursesource:~#\
  \ chmod g+s /home/groups/project\nroot@onecoursesource:~# ls -ld /home/groups/project\n\
  drwxrws--- 2 root project 40 Dec 23 14:05 /home/groups/project\nroot@onecoursesource:~#\
  \ su – bob\nbob@onecoursesource:~$ cd /home/groups/project\nbob@onecoursesource:project$\
  \ cp ~/bob_report2 .\nbob@onecoursesource:project$ ls -l bob_report2\n-rw-r-----\
  \ 1 bob project 1230 Dec 23 14:25 bob_report2\n```\n\n现在，在 `/home/groups/project`\
  \ 目录下创建的任何新文件将由 `project` 组所有。\n\n要设置 SGID 权限，请使用以下方法之一（其中 `xxx` 代表标准的读、写、执行权限）：\n\
  \n```\nchmod g+s file\n```\n\n或者\n\n```\nchmod 2xxx file\n```\n\n要取消 SUID 权限，请使用以下方法之一：\n\
  \n```\nchmod g-s file\n```\n\n或者\n\n```\nchmod 0xxx file\n```\n\n### 粘滞位 (Sticky\
  \ Bit)\n\n为了理解`粘滞位`]`权限，请考虑需要一个所有用户都能共享文件的目录的情况。换句话说，所有用户都应该进入目录（执行权限）、查看目录中的所有文件（读权限），并向目录中添加新文件（写权限）：\n\
  \n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# mkdir /home/shareall\nroot@onecoursesource:~#\
  \ chmod 777 /home/shareall\nroot@onecoursesource:~# ls -ld /home/shareall\ndrwxrwxrwx\
  \ 2 root project 40 Dec 23 14:05 /home/shareall\n```\n\n这些权限的问题在于目录的写权限。该权限允许用户向目录中添加新文件，但它也允许用户删除目录中的任何文件（无论他们是否拥有该文件）。显然，如果用户开始删除彼此的文件，就会产生问题（以及潜在的安全风险）。\n\
  \n粘滞位权限有一个解决方案。当它应用于目录时，该权限会改变写权限的行为。用户仍然可以向目录中添加文件（假设这不会覆盖由另一个用户拥有的现有文件），但用户要删除目录中的文件，需要满足以下条件之一：\n\
  \n*   用户必须拥有该文件，*或者*\n*   用户必须拥有该目录，*或者*\n*   用户必须是系统管理员。\n\n粘滞位权限应该已经设置在系统的至少一个目录上了：`/tmp`\
  \ 目录。该目录是用户（或软件程序）临时放置文件的地方：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# ls -ld\
  \ /tmp\ndrwxrwxrwt 16 root root 320 Dec 23 16:35 /tmp\n```\n\n要设置粘滞位权限，请使用以下方法之一（其中\
  \ `xxx` 代表标准的读、写、执行权限）：\n\n```\nchmod o+t file\n```\n\n或者\n\n```\nchmod 1xxx file\n\
  ```\n\n（注意这里使用的是数字 1，而不是小写字母 `l`。）\n\n要取消 SUID 权限，请使用以下方法之一：\n\n```\nchmod o-t file\n\
  ```\n\n或者\n\n```\nchmod 0xxx file\n```\n\n`表 9-4` 总结了 `SUID]`、`SGID]` 和粘滞位的特殊权限集。\n\
  \n**表 9-4 SUID、SGID 和粘滞位的特殊权限集**\n\n| | **SUID** | **SGID** | **Sticky Bit** |\n\
  | --- | --- | --- | --- |\n| **描述** | 在可执行文件上设置时，`SUID` 允许程序使用执行文件所有所有者的权限访问文件。\
  \ | 在可执行文件上设置时，`SGID` 允许程序使用执行文件组所有者的权限访问文件。当它设置在目录上时，目录中的所有新文件都会继承目录的组所有权。 | 当目录上设置粘滞位时，目录中的文件只能由文件的所有者、目录的所有者或\
  \ root 用户删除。 |\n| **设置** | `chmod u+s file` 或 `chmod 4xxx file`（`xxx` 代表标准的读、写、执行权限。）\
  \ | `chmod g+s file` 或 `chmod 2xxx file`（`xxx` 代表标准的读、写、执行权限。） | `chmod o+t file`\
  \ 或 `chmod 1xxx file`（`xxx` 代表标准的读、写、执行权限。）注意：粘滞位权限几乎总是被设置为八进制值 1777。 |\n| **移除**\
  \ | `chmod u-s file` 或 `chmod 0xxx file` | `chmod g-s file` 或 `chmod 0xxx file`\
  \ | `chmod o-t file` 或 `chmod 0xxx file` |\n\n### 访问控制列表 (ACLs)\n\n传统的读、写、执行权限存在根本性问题。考虑需要为特定用户授予权限的情况，但文件是组所有。。解决方案是使用`访问控制列表\
  \ (ACLs)`，它允许为特定用户和组设置权限。\n\n假设 Sarah 用户创建了一个文件，输出显示：\n\n点击此处查看代码图像\n\n```\nsarah@onecoursesource:~$\
  \ ls -l\n-rw--r-- 1 sarah\n```\n\n这种解决方案的问题是组织中的每个人都可以查看该文件。有一个更好的解决方案。如果 Sarah\
  \ 用户是该组的管理员，她可以将 William 用户加入组。然而，这种解决方案也有缺陷，因为该用户将访问所有组的文件。\n\n最好的解决方案是使用 `setfacl`\
  \ 在文件上创建 ACL：\n\n点击此处查看代码图像\n\n```\nsarah@onecoursesource:~$ setfacl -m user:dane:r--\
  \ sales_report\n```\n\n`-m` 用于创建一个新的 ACL。参数格式为 `what:who:permission`。\n\n*   `user`\
  \ 或 `u`：用于为特定用户应用 ACL。\n*   `group` 或 `g`：用于为特定组应用 ACL。\n*   `others` 或 `o`：用于为“其他”应用\
  \ ACL。\n*   `mask` 或 `m`：用于设置 ACL 的掩码。（掩码将在本节后部分解释。）\n\n`who` 的值将是要应用权限的用户或组。权限可以是符号值（`r--`）或八进制值（`4`）。\n\
  \n一旦在文件或目录上应用了 ACL，在执行 `ls -l` 命令时，权限后面会出现加号（`+`）字符，所示：\n\n点击此处查看代码图像\n\n```\nsarah@onecoursesource:~$\
  \ ls -l sales_report\n-rw-rw-r--+ 1 sarah sales 98970 Dec 27 16:45 sales_report\n\
  ```\n\n要查看 ACL，请使用 `getfacl` 命令：\n\n\n\n\n\n点击此处查看代码图像\n\n```\nsarah@onecoursesource:~$\
  \ getfacl sales_report\n# file: sales_report\n# owner: sarah\n# group: sarah\nuser::rw-\n\
  user:william:r--\ngroup::rw-\nmask::rw-\nother::r--\n```\n\n请参考示例 9-3 查看为组设置 ACL\
  \ 的示例。\n\n**示例 9-3** *为用户组设置 ACL*\n\n点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$\
  \ setfacl -m g:games:6 sales_report\nstudent@onecoursesource:~$ getfacl sales_report\n\
  # file: sales_report\n# owner: sarah\n# group: sarah\nuser::rw-\nuser:william:r--\n\
  group::rw-\ngroup:games:rw-\nmask::rw-\nother::r--\n```\n\n#### mask 值（The Value）\n\
  \n注意示例 9-3 输出中的 `mask` 值 (`rw-`)。`mask` 用于临时禁用或限制 ACL。考虑一种情况：你希望 ACL 值在短时间内不生效。如果有许多个\
  \ ACL，要移除每一个实例并在稍后重新应用每一个将非常困难。相反，只需更改 `mask` 值即可，如示例 9-4 所示。\n\n**示例 9-4** *更改\
  \ `mask` 值*\n\n点击此处查看代码图像\n\n```\nsarah@onecoursesource:~$ setfacl -m mask:0 sales_report\n\
  sarah@onecoursesource:~$ getfacl sales_report\n# file: sales_report\n# owner: sarah\n\
  # group: sarah\nuser::rw-\nuser:william:r--                #effective:---\ngroup::rw-\
  \                      #effective:---\ngroup:games:rw-                 #effective:---\n\
  mask::---\nother::r--\n```\n\n`mask` 指定了除所有者和“其他人”之外的任何人对文件拥的最大权限。注意上一个输出中的“effective”（有效）部分，它展示了\
  \ `mask` 值对 `william` 用户、“games” 组以及文件所有组（`group::`）权限的影响。\n\n要取消这些限制，请将 `mask`\
  \ 设置为之前的值（在此情况下为 `rw-`），如示例 9-5 所示。\n\n**示例 9-5** *重置 `mask` 值*\n\n点击此处查看代码图像\n\n\
  ```\nsarah@onecoursesource:~$ setfacl -m mask:rw- sales_report\nsarah@onecoursesource:~$\
  \ getfacl sales_report\n# file: sales_report\n# owner: sarah\n# group: sarah\nuser::rw-\n\
  user:william:r--\ngroup::rw-\ngroup:games:rw-\nmask::rw-\nother::r--\n```\n\n###\
  \ 默认 ACL（Default ACLs）\n\n对于普通权限，使用 `umask` 值来确定应用于新文件和目录的默认权限。对于 ACL，你可以使用 `setfacl`\
  \ 命令的 `-m` 选项，为在 shell 中创建的所有新文件和目录定义一组默认 ACL。在这种情况下，参数使用的语法为：`default:*what*:*who*:*permission*`。\n\
  \n示例 9-6 将为 **reports** 目录创建一个默认 ACL。\n\n**示例 9-6** *为目录设置默认 ACL*\n\n点击此处查看代码图像\n\
  \n```\nsarah@onecoursesource:~$ mkdir reports\nsarah@onecoursesource:~$ setfacl\
  \ -m default:g:games:r-x reports\nsarah@onecoursesource:~$ setfacl -m default:u:bin:rwx\
  \ reports\nsarah@onecoursesource:~$ getfacl reports\n# file: reports\n# owner: sarah\n\
  # group: sarah\nuser::rwx\ngroup::rwx\nother::r-x\ndefault:user::rwx\ndefault:user:bin:rwx\n\
  default:group::rwx\ndefault:group:games:r-x\ndefault:mask::rwx\ndefault:other::r-x\n\
  ```\n\n示例 9-7 展示了新文件和目录将如何继承示例 9-6 中执行的命令所创建的 ACL。\n\n**示例 9-7** *ACL 继承*\n\n点击此处查看代码图像\n\
  \n\n\n\n例如，一个很有文件属性是可以使文件变得“不可变”（immutable）。不可变文件是完全无法的；包括 root 用户在内的任何人都无法删除或修改它。要使一个文件变为不可变，请使用\
  \ `chattr` 命令：\n\n点击此处查看代码\n\n```\nroot@onecoursesource:~# chattr +i /etc/passwd\n\
  ```\n\n注意，现在没有用户可以更改 `/etc/passwd` 文件了，这意味着无法向系统添加新用户（也无法删除现有的用户）。这看起来可能像是一个奇怪的操作，但请想象一种系统是公开的场景（例如商场里的自助服务机）。这种系统不需要新用户，也不希望任何人删除用户。\n\
  \n### 安全要点\n\n在我们对 `/etc/passwd` 文件应用不可变属性的情况下，你可能会问自己：“这个文件不是已经受权限保护了吗？”尽管确实如此，但添加不可变属性提供了一个额外的安全层，使整个系统更加安全。\n\
  \n要查看文件的属性，请使用 `lsattr` 命令：\n\n点击此处查看代码\n\n```\nroot@onecoursesource:~# lsattr /etc/passwd\n\
  ----i--------e-- /etc/passwd\n```\n\n连字符（`-`）字符表示未设置的文件属性。完整的属性列表可以在 `chattr` 命令的\
  \ man 页中找到。表 9-8\n\n```\nroot@onecoursesource:~# chattr -i /etc/passwd\nroot@onecoursesource:~#\
  \ lsattr /etc/passwd\n-------------e-- /etc/passwd\n```\n\n`chattr` 命令的重要选项如表 9-9\
  \ 所示。\n\n#### 表 9-9 `chattr` 命令的选项\n\n| 选项 | 描述 |\n| --- | --- |\n| `-R` | 递归地更改应用于整个目录结构。\
  \ |\n| `-V` | 详细模式。输出以演示所做的更改。 |\n\n### SELinux 简介\n\n与文件属性类似，SELinux（安全增强型 Linux）并不是一种“文件权限”，但该主题属于本章，是因为\
  \ SELinux 也会对文件和目录的访问产生重大影响。需要注意的是，SELinux 是一个潜在巨大的课题，全面讨论 SELinux 远超本书的范围（事实上，它本身应该是一整本书）。本节的目的是向你介绍\
  \ SELinux 的概念并演示它的工作原理。\n\n要理解 SELinux，你首先将想要学习 Linux 使用权限保护文件的传统方法的某些潜在缺陷。\n\n\
  ### 用户创建安全漏洞\n\n文件和目录可能会被那些不理解权限或无意中提供了比预期更多访问权限的用户破坏。这反映了句古老的系统管理格言：“如果没有用户，什么都不会坏掉，系统也会更安全。”当然，对这句话的回答是：“如果没有用户，我们就没有工作做了！”用户的错误经常会导致对存储在文件中的数据产生意外之外的访问。\n\
  \n可以通过配置 SELinux，在进程（程序）访问文件时提供额外的安全层级来弥补这一缺陷。可以应用 SELinux 安全策略，要求进程必须属于 SELinux\
  \ 安全上下文（想象成“安全组”）才能访问文件和目录。普通权限仍将用于进一步定义访问，但在访问文件/目录时，会首先应用此 SELinux 策略。\n\n然而，尽管可以配置\
  \ SELinux 策略来限制普通用户运行进程时对文件和目录的访问，但这认为是一种非常严格的策略，并没有我们我们将讨论的下一个场景常见。当极其安全的文件系统至关重要时，可以考虑这种更严格的策略，但也考虑到普通用户可能会发现系统变得难用得多且复杂得多。\n\
  \n#### 守护进程创建安全漏洞\n\n一个更大的担忧，也是大多数 SELinux 策略旨在解决的问题，是守护进程（或系统进程）如何带来安全风险。考虑一种情况：你有许多活跃的进程提供各种服务。例如，其中一个进程可能是\
  \ Web 服务器，如示例 9-8 所示的 Apache Web 服务器。\n\n#### 示例 9-8 *Apache Web 服务器进程*\n\n点击此处查看代码\n\
  \n```\nroot@onecoursesource:~# ps -fe | grep httpd\nroot      1109     1  0  2018\
  \ ?        00:51:56 /usr/sbin/httpd\napache    1412  1109  0 Dec24 ?        00:00:09\
  \ /usr/sbin/httpd\napache    4085  1109  0 05:40 ?        00:00:12 /usr/sbin/httpd\n\
  apache    8868  1109  0 08:41 ?        00:00:06 /usr/sbin/httpd\napache    9263\
  \  1109  0 08:57 ?        00:00:04 /usr/sbin/httpd\napache   12388  1109  0 Dec26\
  \ ?        00:00:47 /usr/sbin/httpd\napache   18707  1109  0 14:41 ?        00:00:00\
  \ /usr/sbin/httpd\napache   18708  1109  0 14:41 ?        00:00:00 /usr/sbin/httpd\n\
  apache   19769  1109  0 Dec27 ?        00:00:15 /usr/sbin/httpd\napache   29802\
  \  1109  0 01:43 ?        00:00:17 /usr/sbin/httpd\napache   29811  1109  0 01:43\
  \ ?        00:00:11 /usr/sbin/httpd\napache   29898  1109  0 01:44 ?        00:00:10\
  \ /usr/sbin/httpd\n```\n\n注意在前面的输出中，每行都描述了系统中运行的一个 Apache Web 服务器进程（`/usr/sbin/httpd`）。行的第一部分是启动进程的用户。以\
  \ root 运行的进程仅用于生成额外的 `/usr/sbin/httpd` 进程。然而，其他进程响应来自客户端工具（网页浏览器）的入站网页请求。\n\n想象一下，如果\
  \ Apache Web 服务器软件中发现了一个安全漏洞，允许客户端工具控制 `/usr/sbin/httpd` 进程之一，并向该进程发出自定义命令或操作。这些操作中的一个可能是查看\
  \ `/etc/passwd` 文件的内容，由于设置在该文件上的权限，该操作将是成功的：\n\n点击此处查看代码\n\n```\nroot@onecoursesource:~#\
  \ ls -l /etc/passwd\n-rw-r--r-- 1 root root 2690 Dec 11  2018 /etc/passwd\n```\n\
  \n从前面命令的输出中可以看出，所有用户都有查看 `/etc/passwd` 文件内容的权限。问问自己：你是否希望某个随机人员（通常称为黑客）能够查看存储用户账户数据的文件内容？\n\
  \n### 安全要点\n\n不要将这个问题仅仅认为与 Apache Web 服务器有关。系统上运行的任何进程都可能被破坏，并为怀有恶意的人提供意外的访问。在你的系统上运行\
  \ `ps -fe` 命令，以了解范围内有多少个进程在运行。\n\n\n\n\n通过 SELinux 策略，`/usr/sbin/httpd` 进程可以被“锁定”，使得每个进程只能访问一组特定的文件。这是大多数管理员使用\
  \ SELinux 的目的：保护那些可能被黑客利用已知（或可能是未知）的漏洞进行攻击的进程。\n\n### SELinux 基础知识\n\n并不是所有的 Linux\
  \ 发行版都安装了 SELinux。判断其是否可用（并正在积极使用）的一种方法是使用 `getenforce` 命令：\n\n点击此处查看代码图像\n\n```\n\
  root@onecoursesource:~# getenforce\nEnforcing\n```\n\n结果“Enforcing”（强制模式）意味着 SELinux\
  \ 已安装且安全策略当前处于激活状态。你可以使用 `setenforce` 命令禁用安全策略（在测试新策略或排查 SELinux 问题时非常有用）：\n\n点击此处查看代码图像\n\
  \n```\nroot@onecoursesource:~# setenforce 0\nroot@onecoursesource:~# getenforce\n\
  Permissive\n```\n\n在“Permissive”（允许模式）模式下，SELinux 不会阻止对文件和目录的访问，但会发出警告，这些警告可以在系统日志文件中查看。\n\
  \n### 安全上下文\n\n每个进程都在一个安全上下文中运行。要查看此内容，请使用 `ps` 命令的 `-Z` 选项（此处使用 `head` 命令仅是为了限制命令的输出）：\n\
  \n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# ps -fe | grep httpd | head -2\nsystem_u:system_r:httpd_t:s0\
  \ root     1109     1  0  2018 ?      00:51:56 /usr/sbin/httpd\nsystem_u:system_r:httpd_t:s0\
  \ apache   1412  1109  0 Dec24 ?      00:00:09 /usr/sbin/httpd\n```\n\n安全上下文（`system_u:system_r:httpd_t:s0`）非常复杂，但对于理解\
  \ SELinux 基本，重要的部分是 `httpd_t`，它类似于一个安全组或域。作为该安全域的一部分，`/usr/sbin/httpd` 进程只能访问安全策略允许\
  \ `httpd_t` 访问的文件。该策略通常由 SELinux 专家编写，该专家应该在哪些进程能够访问系统上的特定文件和目录方面拥有丰富的经验。\n\n文件和目录也有同样由策略定义的\
  \ SELinux 安全上下文。要查看特定文件的安全上下文，请使用 `ls` 命令的 `-Z` 选项（注意 SELinux 上下文包含大量数据，因此文件名无法放在同一行）：\n\
  \n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# ls -Z /var/www/html/index.html\nunconfined_u:object_r:httpd_sys_content_t:s0\
  \ /var/www/html/index.html\n```\n\n再次，一个完整的 SELinux 安全上下文包含许多部分，但对本书来说最重要的部分是 `httpd_sys_content_t`。根据安全策略的规则，运行在\
  \ `httpd_t` 安全上下文的进程可以访问 `httpd_sys_content_t` 安全上下文的文件。\n\n要查看此访问的示例，请先查看图 9-3，该图演示了\
  \ Apache Web 服务器访问 `/var/www/html/index.html` 文件的能力。\n\n![Image](img/00045.jpeg)\n\
  \n**图 9-3** *成功显示 `index.html` 文件*\n\n接下来，使用以下命令将 SELinux 安全上下文更改不同的类型：\n\n点击此处查看代码图像\n\
  \n```\nroot@onecoursesource:~# semanage fcontext -a -t user_home_t\n/var/www/html/index.html\n\
  root@onecoursesource:~# restorecon -v /var/www/html/index.html\nRelabeled /var/www/html/index.html\
  \ from unconfined_u:object_r:httpd_sys_content_t:s0 to unconfined_u:object_r:user_home_t:s0\n\
  ```\n\n关于上述命令的几说明：\n\n*   通常你不会将此安全上下文应用到此特定文件，因为该安全上下文是留给用户主目录下的文件的。然而，其目的是演示 SELinux\
  \ 如何保护文件，因此使用这样的上下文是有意义的。\n*   `semanage` 命令将文件的上下文应用到安全策略中，但要对文件本身进行永久更改，必须执行 `restorecon`\
  \ 命令。\n\n现在查看图 9-4，它演示了 Apache Web 服务器不再能够访问该文件。\n\n![Image](img/00046.jpeg)\n\n\
  **图 9-4** *无法访问 `index.html` 文件*\n\n你可以通过查看以下内容了解为什么发生这种情况：\n\n点击此处查看代码图像\n\n```\n\
  root@onecoursesource:~# journalctl | grep index.html\nDec 11 13:41:56 server audit[1234]:\
  \ type=AVC msg=audit(170): denied=read s=system_u:system_r:httpd_t:s0 t=unconfined_u:object_r:httpd_sys_content_t:s0\
  \ name=\"/var/www/html/index.html\" pc=\n```\n\n### 安全上下文结论\n\n这里的讨论快速介绍了什么是 SELinux。你还有很多可以学习的内容，包括上下文是什么以及如何设置它们，以及如何排除故障。\n\
  \n### 总结\n\n在本章中，你学习了如何查看和设置标准权限、`umask` 值、访问控制列表（ACL）以及特殊权限。你还学习了如何使用文件属性来增强文件的安全性。最后，你接触了\
  \ SELinux 背后的概念，这是一种保护文件和目录的高级方法。\n\n#### 术语\n\n*   权限\n*   掩码\n*   SUID\n*   SGID\n\
  *   粘性位\n*   访问控制列表\n*   SELinux\n\n#### 复习题\n\n1.  `ls` 命令的 _____ 选项将显示基本文件权限。\n\
  2.  哪种权限允许用户删除目录中的文件？\n    *   文件的执行权限\n    *   文件的写入权限\n    *   目录的写入权限\n    *\
  \   目录的读取权限\n3.  哪种权限用于修改目录上写入权限的行为？\n    *   SUID\n    *   SGID\n    *   粘性位\n\
  \    *   以上都不是\n4.  使用 _____ 命令用于在创建新文件或目录时指定要掩码（不包含）的默认权限。\n5.  填空为 **/data 目录**\
  \ 设置 SGID 权限：`chmod _____ /data`。\n\n## 第 10 章：管理本地存储：基础\n\n本章的重点是本地存储设备的关键概念和基础管理。你首先学习一些关键概念，包括分区和文件系统以及它们如何对操作系统起着重要作用。然后你学习如何创建分区和文件系统，以及如何让这些新的存储设备可用。我们通过深入研究交换设备来完成本章，交换设备是用于提供虚拟内存空间的设备。\n\
  \n在阅读本章并完成练习后，你能够执行以下操作：\n\n*   创建分区和文件系统\n*   执行高级文件系统操作\n*   手动和自动挂载分区\n*   创建并激活交换设备\n\
  \n### 文件系统基础\n\n\n\n\n挂载（mounting）过程通过将文件系统放置于目录位置使其可用。在学习如何实现这一点之前，你应该了解一些关于文件系统的基础知识。\n\
  \n### 分区\n\n分区用于将硬盘分割成更小的组件。每个组件都可以被视为一个不同的存储设备。在每个分区上，都可以创建一个独立的文件系统（`btrfs`、`xfs`、`ext4`\
  \ 等）。\n\n传统的基于 PC 的分区在创建数量上存在限制。最初只允许四个分区，这些被称为主分区（primary partitions）。随着对更多分区的需求，人们创建了一种技术，允许将一个主分区转换为扩展分区。在扩展分区内部，你可以创建额外的逻辑分区（logical\
  \ partitions partitions）。\n\n在图 10-1 中，`/dev/sda1`、`/dev/sda2` 和 `/dev/sda3` 是主分区。`/dev/sda4`\
  \ 分区是一个扩展分区，作为 `/dev/sda5`、`/dev/sda6` 和 `/dev/sda7` 逻辑分区的容器。\n\n![Image](img/00047.jpeg)\n\
  \n**图 10-1** *传统分区结构*\n\n在大多数使用传统分区的发行版中，你将被限制为共 15 个分区，但通过内核调整（修改）可以将此数字增加到 63。\n\
  \n传统的分区表存储在主引导记录（MBR）中。一种新的分区表称为 GUID 分区表（GPT），它没有与 MBR 分区表相同的限制或布局。\n\n可以使用几种不同的工具来创建或查看分区，包括\
  \ `fdisk`、`parted` 以及安装程序提供的基于 GUI 的工具。可用的 GUI 工具因发行版而异。\n\n`fdisk` 和 `parted` 都支持命令行选项，并且都可以作为交互式工具执行。`fdisk`\
  \ 和 `parted` 工具将在本章稍后部分介绍。\n\n### 文件系统\n\n`filesystem` 这个词本身可能让人有些困惑。实际上有两种类型的文件系统：物理文件系统虚拟文件系统。\n\
  \n物理文件系统是用于组织设备上数据的结构，例如分区、逻辑卷或 RAID（独立磁盘冗余阵列）设备。通常在使用 `filesystem` 一词时，指的是物理文件系统。有许多不同物理文件系统，如本章后文所述。\n\
  \n虚拟文件系统是普通用户在查看操作系统上的文件和目录时看到的内容。虚拟文件系统由几个物理文件系统通过目录树合并而组成。\n\n要理解这个概念，请先看图 10-2。\n\
  \n![Image](img/00048.jpeg)\n\n**图 10-2** *虚拟文件系统*\n\n图 10-2 显示了典型 Linux 虚拟文件系统的一部分。这是普通用户查看文件系统的方式，将其视为按层级存储数据的目录集合。虚拟文件系统结构的顶部是\
  \ `/` 目录，子目录和文件存储在 `/` 目录内部。\n\n但作为管理员，你应该知道这并不止于此。`/` 目录是一个物理文件系统的挂载点。挂载点是物理文件系统合并到虚拟文件系统的方式，而用户看到的正是这种目录结构。其他目录（如\
  \ `/var` 和 `/usr`）也可以是挂载点。在这种情况下，你可能希望将文件系统视为类似于图 10-3 所示的内容。\n\n![Image](img/00049.jpeg)\n\
  \n**图 10-3** *高亮挂载点的虚拟文件系统*\n\n图 10-3 对于虚拟文件系统背后发生的情况提供了更深入的见解。用灰色高亮的目录位于存储在 `/dev/sda1`\
  \ 分区上的文件系统中。`/var` 目录内是存储在 `/dev/sda2` 分区上的文件系统。`/usr` 目录内是存储在 `/dev/sda3` 分区上的文件系统。\n\
  \n将文件系统置于目录下的是通过挂载过程完成的。挂载可以通过 `mount` 命令手动执行，也可以通过 `/etc/fstab` 文件中的条目自动执行。挂载过程将在本章稍后部分进行详细介绍。\n\
  \n## 为什么有这么多分区/文件系统？\n\n你会发现许多 Linux 安装都有几个分区——当然，每个分区都有独立的文件系统。你想要创建多个分区的有有几个：\n\
  \n*   **挂载选项**：每个分区在挂载时可以有不同的挂载选项。这提供了更大的灵活性，因为你可能针对特定情况使用特定的挂载选项。在本章稍后我们将探索挂载选项并重新讨论这个话题。\n\
  *   **文件系统类型**：每个分区可以是不同类型的文件系统。某些文件系统更安全，某些更适合处理大文件，而有些性能更好。为特定情况选择正确的文件系统可以获得更安全的系统。\n\
  *   **磁盘配额**：此 Linux 功能允许你限制用户可以使用的空间。配额限制是针对每个文件系统的，因此拥有多个文件系统允许为不同区域设置不同配额的选择。\n\
  *   **备份策略**：许多备份工具允许你按文件系统指定备份发生的不同频率。例如，如果 `/home` 目录是一个文件系统的挂载点，而 `/boot` 是另一个文件系统的挂载点，你可以创建一个策略，每天备份\
  \ `/home` 中的文件，而每月备份一次 `/boot` 中的文件。\n*   **防止文件系统写满**：考虑一种情况，如果 `/home` 目录是一个独立的文件系统，用户生成了大量大文件。它们可能会填整个文件系统，导致其他用户无法在其主目录中创建文件。这是为什么\
  \ `/home`、`/var` 和 `/tmp` 通常是独立文件系统的主要原因之一，因为这些都是普通用户有权创建文件的目录结构。\n\n**安全亮点**\n\n\
  创建一个允许单个用户就能填满整个硬盘的虚拟文件系统结构被认为是一个严重的安全风险。当整个硬盘满时，操作系统无法正常运行，因为许多进程需要向硬盘写入数据的能力。\n\
  \n## 应该创建哪些分区/文件系统？\n\n这个问题的答案实际上取决于好几个因素。在决定你将创建哪些分区时，你应该考虑不同挂载选项、文件系统类型、磁盘配额和备份策略的优势。还要考虑这些文件系统将包含的内容。至少要考虑将以下目录设置为独立物理文件系统的挂载点：\n\
  \n*   **/ (根)文件系统**：虚拟文件系统的顶层。该文件系统的大小在很大程度上取决于了哪些其他文件系统。这是一个必须的分区。\n\n\n\n\n\n\
  *   **/var 文件系统**：`/var` 文件系统包含本质上是变化的数据（即它们经常变化）。这包括日志文件、邮件文件和生成池（例如打印生成池）。该文件系统的大小取决于许多因素，包括它是否为邮件服务器、系统上创建了哪些日志文件以及该系统是否作为打印服务器运行。考虑将\
  \ `/var` 设置为独立的文件系统，以便实施备份策略并限制磁盘空间完全填满的风险。\n\n*   **/home 文件系统**：`/home` 文件系统是存储普通用户主目录的地方。该文件系统的大小取决于许多因素，包括在系统中工作的用户数量以及这些用户执行的功能。考虑将\
  \ `/home` 设置为独立的文件系统，以便实施备份策略并限制磁盘空间完全填满的风险。\n\n*   **/boot 文件系统**：启动文件（包括 `kernel`、`bootloader`\
  \ 和 `initramfs` 文件）存储的位置。当 `/boot` 是一个独立的文件系统时，其大小通常为 100–200MB。由于该文件系统在启动过程中必须易于访问，因此它被放置在独立的文件系统中。\n\
  \n### 注意事项\n\n上述内容并非所有可能的文件系统的完整列表。有充分理由将其他目录（如 `/usr` 和 `/opt`）设置为物理文件系统的挂载点。请准备好反复尝试，直到找到满足你需求的物理文件系统的良好组合。\n\
  \n### 文件系统类型\n\n文件系统用于组织系统上的数据（文件和目录）。Linux 提供了许多类型的文件系统。表 10-1 对这些文件系统进行了简要总结。\n\
  \n**表 10-1** 文件系统类型\n\n| 选项 | 描述 |\n| --- | --- |\n| **ext2** | Ext2 是原始 `ext`（扩展文件系统）的改进版本。\
  \ |\n| **ext3** | Ext3 是 `ext2` 的改进版本（增加了日志支持等功能）。 |\n| **ext4** | Ext4 是 `ext3`\
  \ 的改进版本（允许使用更大的文件系统，等其他功能）。 |\n| **xfs** | Xfs 是一种高性能文件系统，通常用于替代 `ext2/ext3/ext4`\
  \ 系列文件系统。 |\n| **btrfs** | 一种为扩展到大容量数据设备而设计的文件系统。 |\n| **UDF** | 通用磁盘格式文件系统主要用作\
  \ DVD 光盘的文件系统。 |\n| **ISO9660** | 专门设计用于 CD-ROM 光盘的文件系统。 |\n| **HFS** | Apple 开发的专有文件系统。在现代系统中更多用作\
  \ CD-ROM 光盘上的文件系统。 |\n\n### 对话式学习™——哪种文件系统类型？\n\n**Gary**: 嗨，Julia。你能帮我下吗？我正试图在我创建的新分区上确定使用哪种文件系统。种类太多了，我不知道该选哪一个。\n\
  \n**Julia**: 嘿，Gary！我假设你指的是传统的分区，比如硬盘上的那种？不是像 CD-ROM 或 DVD 那种吧？\n\n**Gary**: 正确。\n\
  \n**Julia**: 好的，那排除了一堆文件系统，比如 `UDF`、`ISO9660` 和 `HFS`。所以，第一步是确定你的发行版支持哪些文件系统。\n\n\
  **Gary**: 你是说所有的发行版都支持所有文件系统吗？\n\n**Julia**: 不是。至少默认情况下不是。通常你可以安装额外的软件，但选择一个已经是发行版自带的可能更好。\n\
  \n**Gary**: 我该如何弄清楚这一点？\n\n**Julia**: 通常发行版的文档会说明这一点。你也可以直接尝试使用一些创建你感兴趣的文件系统的特定命令。\n\
  \n**Gary**: 假设我有大量的选项可选。我该选哪个呢？`Ext4`？还是 `Xfs`？\n\n**Julia**: 这个问题其实没有简单的答案。你真的需要考虑你想用文件系统来做什么，并进行一些研究，以确定哪种文件系统最符合你的需求。\n\
  \n**Gary**: 你能给我举个例子吗？\n\n**Julia**: 没问题。假设你的文件系统中会有非常大的文件。在这种情况下，你可能会发现 `xfs` 的性能比其他文件系统更好。当然，你还需要探索其他功能，但这能给你提供一个寻找方向的思路。\n\
  \n**Gary**: 好的，听起来在这里做“准备工作”很重要。还有其他建议吗？\n\n**Julia**: 有的，如果是关键文件系统，可以考虑创建几种不同类型并进行基准测试，以找到哪种最好。另外，不要忘记考虑关键的安全特性，特别是如果该文件系统将被公众访问（例如共享驱动器）或包含\
  \ Web 服务器的文件时。\n\n**Gary**: 明白了。再次感谢，Julia。\n\n### 管理分区\n\n为了创建文件系统，你首先需要创建一个或多个分区。分区用于在逻辑上将硬盘或其他存储介质划分成更小的部分。通过创建分区，你在挂载、备份和文件系统安全等方面具有更高的灵活性。单个存储设备上的完整分区集合称为\
  \ `partition table`（分区表）。\n\n在使用工具创建分区之前，你应该意识到有两种不同的分区方法：MBR（主引导记录）和 GPT（GUID 分区表）。\n\
  \n#### MBR\n\nMBR 分区表通常被称为“传统”分区，以于较新的分区表（如 GUID 分区表）。MBR 分区表的限制是默认情况下只允许四个分区。对于像\
  \ Linux 这样的操作系统来说，这是一个极具限制性的因素。\n\n然而，MBR 分区表中的主分区之一可以转换为扩展分区。在扩展分区内可以添加额外的分区。这些额外的分区被称为\
  \ `逻辑分区`。请参图 10-4 的视觉示例。\n\n![Image](img/00050.jpeg)\n\n**图 10-4** *主引导记录*\n\n关于硬盘设备名称的说明：硬盘通过\
  \ `/dev` 目录下的设备名称引用。基于 IDE 的设备名称以 `/dev/hd` 开头，而 SATA、SCSI 和 USB 设备名称以 `/dev/sd`\
  \ 开头。系统上的第一个驱动命名为“a”，因此第一个 SATA 设备是 `/dev/sda`。第二个 SATA 设备是 `/dev/sdb`，依此类推。分区从\
  \ 1 开始顺序编号，例如 `/dev/sda1`、`/dev/sda2` 和 `/dev/sda3`。\n\n#### GPT\n\nGPT 和 MBR 分区之间有几处区别。然而，在这种情况下，你应该注意的最重要的一点是分区表的结构。GPT\
  \ 支持创建的分区数量比 MBR 多得多，并且没有“四个主、一个扩展、多个逻辑”的结构。GPT 中的所有分区都是简单的分区，不需要解决与 MBR 分区相关的遗留问题。\n\
  \n#### 创建 MBR 分区\n\n要创建 MBR 分区，你可以使用 `fdisk` 命令。\n\n**注意**\n\n通常在安装过程中整个硬盘都会被使用，这使得很难创建分区来练习创建文件系统。如果你在使用虚拟机，可以相当容易为系统添加新磁盘（请咨询\
  \ VirtualBox、VMware 或你使用的任何虚拟化软件的文档）。如果不方便，你始终可以使用一个小 U 盘进行练习——只需确保先删除 U 盘中的所有重要数据！\n\
  \n要显示设备的当前分区表，请使用 `fdisk` 命令的 `-l` ，如例 10-1 所示。\n\n**例 10-1** *`fdisk -l` 命令*\n\n\
  点击此处查看代码图像\n\n\n\n\n\n```\n[root@onecoursesource ~]# fdisk -l /dev/sdb\n\nDisk /dev/sdb:\
  \ 209 MB, 209715200 bytes\n255 heads, 63 sectors/track, 25 cylinders\nUnits = cylinders\
  \ of 16065 * 512 = 8225280 bytes\nSector size (logical/physical): 512 bytes / 512\
  \ bytes\nI/O size (minimum/optimal): 512 bytes / 512 bytes\nDisk identifier: 0xccd80ba5\n\
  \n   Device Boot      Start         End      Blocks   Id  System\n```\n\n示例 10-1\
  \ 中的设备目前没有分区，因此“Device Boot Start End...”行下的数据是空的。要向此设备添加分区，请使用不带 `-l` 选项的 `fdisk`\
  \ 命令：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# fdisk /dev/sdb\nWARNING: DOS-compatible\
  \ mode is deprecated. It's strongly recommended to\n         switch off the mode\
  \ (command 'c') and change display units to\n         sectors (command 'u').\nCommand\
  \ (m for help):\n```\n\n注意显示的警告。根据你所使用的发行版，你可能不会收到此警告，因为这些建议（关闭模式并将显示单位更改为扇区）有时是\
  \ `fdisk` 命令的默认设置。如果你收到了此警告，请在命令提示符处输入 `quit` 退出 `fdisk` 工具，并使用 `-c` 和 `-u` 选项重新启动\
  \ `fdisk` 命令：\n\n点击此处查看代码图片\n\n```\nCommand (m for help): quit\n[root@onecoursesource\
  \ ~]# fdisk -cu /dev/sdb\nCommand (m for help):\n```\n\n### 注意事项\n\n与其退出 `fdisk`\
  \ 工具，不如考虑在命令提示符处使用 `c` 和 `u` 选项切换到正确的模式。\n\n要创建一个新分区，请在命令提示符处输入 `n`：\n\n点击此处查看代码图片\n\
  \n```\nCommand (m for help): n\nCommand action\n   e   extended\n   p   primary\
  \ partition (1-4)\np\nPartition number (1-4): 1\nFirst sector (2048-409599, default\
  \ 2048):\nUsing default value 2048\nLast sector, +sectors or +size{K,M,G} (2048-409599,\
  \ default 409599):\nUsing default value 409599\n```\n\n要保存这些更改，请在命令提示符处输入 `w` 命令：\n\
  \n点击此处查看代码图片\n\n```\nCommand (m for help): w\nThe partition table has been altered!\n\
  Calling ioctl() to re-read partition table.\nSyncing disks.\n```\n\n#### 创建 MBR\
  \ 分区\n\n`parted` 工具是一个交互式工具，允许你显示和修改传统的及 GUID 分区表。它还可以在分区上创建文件系统。\n\n要显示分区表，请使用\
  \ `-l` 选项（请以 root 用户身份运行此命令）：\n\n点击此处查看代码图片\n\n```\n [root@onecoursesource ~]# parted\
  \ -l /dev/sda\nModel: ATA VBOX HARDDISK (scsi)\nDisk /dev/sda: 42.9GB\nSector size\
  \ (logical/physical): 512B/512B\nPartition Table: msdos\nNumber  Start   End   \
  \  Size    Type     File system  Flags\n 1      1049kB  42.9GB  42.9GB  primary\
  \  ext4         \n\nModel: Linux device-mapper (thin) (dm)\nDisk /dev/mapper/docker-8:1-264916-f9bd50927a44b8333c036684911b54e48efbc23926b5f0e907d:107GB\n\
  Sector size (logical/physical): 512B/512B\nPartition Table: loop\nNumber  Start\
  \  End    Size   File system  Flags\n 1      0.00B  107GB  107GB  ext4\n\nModel:\
  \ Linux device-mapper (thin) (dm)\nDisk /dev/mapper/docker-8:1-264916-77a4c5c2f60aa6b31a7280ac39a657bfd7ece940507fb0c12822f7a:107GB\n\
  Sector size (logical/physical): 512B/512B\nPartition Table: loop\nNumber  Start\
  \  End    Size   File system\nFlags\n\n要修改驱动器的分区表，请运行不带 `-l` 选项的 `parted` 命令：\n\n\
  点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# parted  /dev/sda\nGNU Parted 2.3\n\
  Using /dev/sda\nWelcome to GNU Parted! Type 'help' to view a list of commands.\n\
  (parted)\n```\n\n在 `parted` 提示符处可以使用许多有用命令，其中见表 10-2。\n\n#### 表 10-2 parted 提示处的有用命令\n\
  \n| 命令 | 描述 |\n| --- | --- |\n| `rm` | 删除分区。 |\n| `?` 或 `help` | 打印命令菜单。 |\n| `mkpart`\
  \ | 创建新分区。 |\n| `mkpartfs` | 创建新分区和文件系统。 |\n| `print` | 打印当前分区表。 |\n| `quit` | 不保存更改退出。\
  \ |\n| `w` | 将更改写入驱动器的分区表。 |\n\n### 创建文件系统\n\n现在有了分区，可以使用 `mkfs` 命令创建文件系统。例如，要在\
  \ `/dev/sdb1` 分区上创建 ext4 文件系统，请按照示例 10-2 所示执行 `mkfs` 命令。\n\n#### 示例 10-2 mkfs 命令\n\
  \n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# mkfd -t ext4 /dev/sdb1\n-bash: mkfd:\
  \ command not found\n[root@onecoursesource ~]# mkfs -t ext4 /dev/sdb1\nmke2fs 1.4.12\
  \ (May-2010)\nFilesystem=\nOS type: Linux\nBlock size=1024 (log=0)\nFragment size=1024\
  \ (log=0)\nStride=0 blocks, Stripe width=0 blocks\n51000 inodes,203776 blocks\n\
  10188 blocks (5.0%) reserved for the super user\nFirst data block=1\nMaximum filesystem\
  \ blocks=6737108\n25 block groups\n8192 blocks per group, 8192 fragments per group\n\
  2040 inodes per group\nSuperblock backups stored on blocks:\n    8193, 24577, 40961,\
  \ 57345, 73729\nWriting inode tables: done\nCreating journal (4096 blocks): done\n\
  Writing superblocks and filesystem accounting information: done\n\nThis filesystem\
  \ will be automatically checked every 38 mounts or 180 days, whichever comes first.\
  \ Use `tune2fs -c` or `-i` to override.\n```\n\n`mkfs` 命令是用于创建特定文件系统的各种命令的前端命令。例如，`mkfs\
  \ -t ext4` 命令运行 `mkfs.ext4` 命令。你可以通过输入 `mkfs.` 然后按两次 `<TAB>` 键查看 `mkfs` 命令可以创建哪些文件系统：\n\
  \n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# mkfs.\nmkfs.cramfs   mkfs.ext3  \
  \   mkfs.ext4devmkfs.vfat\nmkfs.ext2     mkfs.ext4     mkfs.msdos\n```\n\n你可以直接运行这些任何命令，但通常执行\
  \ `mkfs` 命令更方便。\n\n`mkfs` 命令本身的选项很少。然而，每个 `mkfs.*` 命令都有许多修改文件系统创建方式的选项。\n\n假设你为\
  \ `/home` 有一个独立的文件系统，且它是一个 500GB 的文件系统。除非使用 `-m` 选项并指定不同的值，否则为超级用户保留的比例为 5%。如果你在创建此文件系统时不使用此选项，这意味着有\
  \ 25GB 被预留给了 root 用户，而 root 用户可能不会在 `/home` 文件系统中放置任何一个文件！\n\n### 安全要点\n\n文件系统有很多选项，我们强烈建议你探索系统中文件系统的可用选项。启用哪些选项会对系统性能产生巨大影响，有时对安全也有影响。\n\
  \n例如，考虑基于 ext 文件系统的 `-m` 选项，它用于指定为超级用户保留的文件系统比例。此设计的目的是即使普通用户“填满了”文件系统，root 用户（或以\
  \ root 身份运行的守护进程）能够在文件系统中存储文件。\n\n\n\n\n\n要了解更多关于这些选项的信息，请阅读特定文件系统的 man page（帮助手册）。例如，要了解更多关于\
  \ `ext4` 的信息，你可以执行以下命令：`man mkfs.ext4`\n\n## 基于 ext 文件系统的工具\n\n若干工具允许你更改和查看基于 ext\
  \ 文件系统。这些工具包括：\n\n* `fsck.`\n* `dumpe2fs`\n* `tune2fs`\n* `debugfs`\n\n### fsck.*\n\
  \n`fsck` 命令（以及相关的 `fsck.` 命令）的作用是修复文件系统问题。当操作系统没有正常关闭时，文件系统可能会损坏或崩溃。这可能是由于断电或粗心的的员工不小心踢到了电源线导致的。\n\
  \n产生这种问题的原因是，文件系统元数据（关于文件的信息，如名称、权限、所有者、时间戳等）的更改最初存储在内存中。每隔固定间隔，这些数据就会写入硬盘。然而，如果系统在这些数据仍在内存中时非正常关闭，硬盘上的数据就会过时，从而导致文件系统损坏。\n\
  \n当系统在不正常关闭后启动时，名为 `fsck`（文件系统检查）的实用程序会检查文件系统。在某些情况下，它会对文件系统进行更改，但通常任何错误都会导致启动（startup）过程失败。你需要手动修复文件系统错误。\n\
  \n`fsck` 实用程序非常直观。例如，要在第一个 SATA（串行高级技术附件）驱动器的第一个分区上执行它，请执行以下命令：\n\n```\nfsck /dev/sda1\n\
  ```\n\n你可能会遇到很多诸如“blah, blah, blah 某某损坏了。你想修复这个问题吗？”的问题。答案应该始终是“yes”（否则你无法挂载或使用此文件系统）。因此，你可能一直希望带有\
  \ `-y` 选项运行 `fsck` 实用程序，以便对每个问题都回答 yes：\n\n```\nfsck -y /dev/sda1\n```\n\n### 安全提示\n\
  \n不要在运行中的文件系统（live filesystems）上运行 `fsck` 实用程序。运行中的文件系统没有文件系统损坏；只有没有正常卸载的文件系统才会出现这个问题。在活动文件系统上运行\
  \ `fsck` 实用程序可能会导致问题，而不是解决问题。记住那句话：“如果没坏，就不要尝试修理它！”\n\n你还应该知道，`fsck` 实用程序就像 `mkfs`\
  \ 实用程序一样，实际上只是特定文件系统 `fsck` 实用程序的前。例如，如果你在 ext4 文件系统上执行 `fsck`，则执行 `fsck.ext4` 实用程序。\n\
  \n注意，不同的 `fsck` 实用程序有不同的选项，请查看 man page 以确定可以使用哪些选项。\n\n### dumpe2fs\n\n`dumpe2fs`\
  \ 命令可以显示有关 `ext*` 文件系统的细节。此命令的输出非常巨大，默认包含了大量关于块组描述符的信息，这些通常是你不需要看到的。要在忽略块组描述符的同时查看这些信息，请使用\
  \ `-h` 选项，如示例 10-3 所示。\n\n**示例 10-3** `dumpe2fs` 命令\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# dumpe2fs -h /dev/sdb1\ndumpe2fs 1.41.12 (17-May-2010)\nFilesystem volume name:\
  \   <none>\nLast mounted on:          <not available>\nFilesystem UUID:        \
  \  7d52c9b6-28a8-40dc-9fda-a090fa95d58f\nFilesystem magic number:  0xEF53\nFilesystem\
  \ revision #:    1 (dynamic)\nFilesystem features:      has_journal ext_attr resize_inode\
  \ dir_index filetype extent flex_bg sparse_super huge_file uninit_bg dir_nlink extra_isize\n\
  Filesystem flags:         signed_directory_hash\nDefault mount options:    (none)\n\
  Filesystem state:         clean\nErrors behavior:          Continue\nFilesystem\
  \ OS type:       Linux\nInode count:              51000\nBlock count:          \
  \    203776\nReserved block count:     10188\nFree blocks:              191692\n\
  Free inodes:              50989\nFirst block:              1\nBlock size:      \
  \         1024\nFragment size:            1024\nReserved GDT blocks:      256\n\
  Blocks per group:         8192\nFragments per group:      8192\nInodes per group:\
  \         2040\nInode blocks per group:   255\nFlex block group size:    16\nFilesystem\
  \ created:       Tue Sep 15 00:12:17 2017\nLast mount time:          n/a\nLast write\
  \ time:          Tue Sep 15 00:12:18 2017\nMount count:              0\nMaximum\
  \ mount count:      38\nLast checked:             Tue Sep 15 00:12:17 2017\nCheck\
  \ interval:           15552000 (6 months)\nNext check after:         Sat Mar 12\
  \ 23:12:17 2017\nLifetime writes:          11 MB\nReserved blocks uid:      0 (user\
  \ root)\nReserved blocks gid:      0 (group root)\nFirst inode:              11\n\
  Inode size:               128\nJournal inode:            8\nDefault directory hash:\
  \   half_md4\nDirectory Hash Seed:      a3bbea7e-f0c2-43b2-a5e2-9cd2d9d0eaad\nJournal\
  \ backup:           inode blocks\nJournal features:         (none)\nJournal size:\
  \             4096k\nJournal length:           4096\nJournal sequence:         0x00000001\n\
  Journal start:            0\n```\n\n如从示例 10-3 中所示，`dumpe2fs` 命令提供了大量的信息。表 10-3 描述了一些较重要的文件系统特征。\n\
  \n**表 10-3** 文件系统特征\n\n| 选项 | 说明 |\n| --- | --- |\n| Filesystem features | 这对于确定文件系统的能力非常重要。\
  \ |\n| Default mount options | 虽然你可以在 `/etc/fstab` 中指定挂载选项（稍后你会看到），但你有默认选项。 |\n\
  | Inode count | 每个文件必须有一个 inode。因此，inode 计数告诉你文件系统上可以放置文件的最大数量。 |\n| Reserved block\
  \ count | 为超级用户保留了多少块。 |\n| Block size | 该文件系统的块有多大。 |\n\n### tune2fs\n\n要更改文件系统，请使用\
  \ `tune2fs` 命令。例如，要更改留给超级用户的文件系统百分比，请执行类似下面的命令：\n\n点击此处查看代码图像\n\n``` [root@onecoursesource\
  \ ~]# tune2fs -m 0 /dev/sdb1\ntune2fs 1.41.12 (17-May-2010)\nSetting reserved blocks\
  \ percentage to 0% (0 blocks)\n```\n\n\n\n\n\n需要意识到，并不是所有的文件系统特性都能通过 `tune2fs` 命令进行更改。例如，文件系统中的\
  \ inodes（每个文件必须有一个 inode，用于存储有关文件的信息）数量是在文件系统创建时设置的，无法更改。如果你需要更多 inode，则必须备份文件系统，创建一个新的文件系统并恢复数据。\n\
  \n## debugfs\n\n`debugfs` 命令是一个非常有用的工具，允许你在交互式环境中执行调试操作。该工具被设计用于在当前未激活（未挂载）的文件系统上执行。\n\
  \n通过执行带有分区设备名称的命令启动该工具：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# debugfs\
  \ /dev/sdb1\ndebugfs 1.41.12 (17-May-2010)\ndebugfs:\n```\n\n`debugfs` 工具提供了许多实用的工具，包括几个功能与普通\
  \ Linux 命令类似的工具。示例 10-4 演示了使用 `ls` 命令列出当前目录下文件的功能。\n\n**示例 10-4** `ls` 命令\n\n点击此处查看代码图像\n\
  \n```\ndebugfs:  ls\n 2  (12) .   2  (12) ..   11  (20) lost+found    12  (20) asound.conf\n\
  \ 13  (32) autofs_ldap_auth.conf    14  (24) cgconfig.conf\n 15  (20) cgrules.conf\
  \    16  (36) cgsnapshot_blacklist.conf\n 17  (20) dnsmasq.conf    18  (20) dracut.conf\
  \    19  (20) fprintd.conf\n 20  (16) gai.conf    21  (20) grub.conf    22  (24)\
  \ gssapi_mech.conf\n 23  (16) hba.conf    24  (20) host.conf    25  (20) idmapd.conf\n\
  \ 26  (20) kdump.conf    27  (20) krb5.conf    28  (20) ld.so.conf\n 29  (24) libaudit.conf\
  \    30  (20) libuser.conf    31  (24) logrotate.conf\n 32  (20) mke2fs.conf   \
  \ 33  (20) mtools.conf    34  (20) named.conf\n 35  (24) nfsmount.conf    36  (24)\
  \ nsswitch.conf    37  (16) ntp.conf\n 38  (20) openct.conf    39  (36) pm-utils-hd-apm-restore.conf\n\
  \ 40  (20) prelink.conf    41  (24) readahead.conf    42  (20) reader.conf\n 43\
  \  (24) request-key.conf    44  (20) resolv.conf    45  (20) rsyslog.conf\n 46 \
  \ (24) sestatus.conf    47  (20) smartd.conf    48  (16) sos.conf\n 49  (20) sudo.conf\
  \    50  (24) sudo-ldap.conf    51  (20) sysctl.conf\n 52  (24) Trolltech.conf \
  \   53  (24) updatedb.conf    54  (24) warnquota.conf\n 55  (20) xinetd.conf   \
  \ 56  (20) yum.conf\n```\n\n你可以通过 `stat` 命令获取有关此文件的信息，如 示例 10-5 所示。\n\n**示例 10-5**\
  \ `stat` 命令\n\n点击此处查看代码图像\n\n```\ndebugfs:  stat yum.conf\nInode: 56   Type: regular\
  \    Mode:  0644   Flags: 0x80000\nGeneration: 1017195304    Version: 0x00000001\n\
  User:     0   Group:     0   Size: 969\nFile ACL: 4385    Directory ACL: 0\nLinks:\
  \ 1   Blockcount: 4\nFragment:  Address: 0    Number: 0    Size: 0\nctime: 0x55f863e0\
  \ -- Tue Sep 15 11:30:56 2015\natime: 0x55f863e0 -- Tue Sep 15 11:30:56 2015\nmtime:\
  \ 0x55f863e0 -- Tue Sep 15 11:30:56 2015\nEXTENTS:\n(0): 853\n```\n\n`debugfs` 命令最实用的功能之一是恢复删除文件的能力——只要你动作足够快！例如，考虑\
  \ 示例 10-6 中的情况，文件被不小心删除了。\n\n**示例 10-6** 使用 `debugfs`\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# ls /data\nasound.conf                host.conf       nfsmount.conf       \
  \          smartd.conf\nautofs_ldap_auth.conf      idmapd.conf     nsswitch.conf\
  \                 sos.conf\ncgconfig.conf              kdump.conf      ntp.conf\
  \                      sudo.conf\ncgrules.conf               krb5.conf       openct.conf\
  \                   sudo-ldap.conf\ncgsnapshot_blacklist.conf  ld.so.conf      pm-utils-hd-apm-restore.conf\
  \  sysctl.conf\ndnsmasq.conf               libaudit.conf   prelink.conf        \
  \          Trolltech.conf\ndracut.conf                libuser.conf    readahead.conf\
  \                updatedb.conf\nfprintd.conf               logrotate.conf  reader.conf\
  \                   warnquota.conf\ngai.conf                   lost+found      request-key.conf\
  \              xinetd.conf\ngrub.conf                  mke2fs.conf     resolv.conf\
  \                   yum.conf\ngssapi_mech.conf           mtools.conf     rsyslog.conf\n\
  hba.conf                   named.conf      estatus.conf\n[root@onecoursesource ~]#\
  \ rm /data/yum.conf\ny\n```\n\n要恢复此文件，首先卸载文件系统并使用 `-w` 选项启动 `debugfs` 命令（该选项以读写模式打开文件系统）：\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# umount /data\n[root@onecoursesource\
  \ ~]# debugfs /dev/sdb1\ndebugfs 1.41.12 (17-May-2010)\ndebugfs:\n```\n\n现在使用 `lsdel`\
  \ 命令列出已删除的文件并使用 `undel` 命令恢复文件。请记住，你必须在删除文件后尽快执行；否则数据块可能会被新文件占用。\n\n## 基于 Xfs 的文件系统工具\n\
  \n就像有工具可以帮助你查看和修改基于 ext 文件系统一样，也有工具允许你对基于 xfs 的文件系统执行这些任务。这些工具包括：\n\n* `xfsdump`\n\
  * `xfsrestore`\n* `xfs_info`\n* `xfs_check`\n* `xfs_repair`\n\n**注意** 并不是所有的 Linux\
  \ 发行版都提供了 xfs 文件系统支持。如果你想练习 xfs 命令，请使用 CentOS 7，因为 xfs 是该发行版的默认文件系统。\n\n### xfsdump\
  \ 和 xfsrestore\n\n`xfsdump` 命令用于备份文件系统，可以备份到磁带设备或其他存储位置。假设你没有磁带设备，示例 10-7 显示使用文件作为存储位置，备份\
  \ `/boot` 目录。\n\n**示例 10-7** `xfsdump` 命令\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# xfsdump -f /tmp/boot_back /boot\n```\n\n\n\n\n\n注意，在示例 10-7 中执行 `xfsdump`\
  \ 命令时，用户被提示输入一个标签（label）和一个介质标签（media label）。标签是备份的名称，而介质标签是设备名称（如备份带）。如果备份跨越多个磁带，则可以提供多个介质标签。\n\
  \n默认情况下，会进行全备份。这被称为 0 级（全量）备份。1 级 级备份（增量备份）将备份自上一次 0 级备份以来所有变化的文件。2 级 级备份（差异备份）将备份自上一次较低级别备份（0\
  \ 级或 1 级，以较新的为准）以来所有变化的文件。使用 `-l` 选项来指定备份级别（如果不指定 `-l` 选项，默认为 0）。\n\n可以使用 `xfsrestore`\
  \ 命令从备份中恢复文件。在接下来的示例中，备份中的所有文件将恢复到当前目录，在下面的示例中用点（`.`）字符表示：\n\n```\nxfsrestore -f\
  \ /backup/location .\n```\n\n你可以使用 `-t`（用于“目录列表”）选项列出备份中的文件（使用 `grep` 命令是为了避免显示表头信息），如示例\
  \ 10-8 所示。\n\n**示例 10-8** *-t* 选项\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]#\
  \ xfsrestore -t -f /tmp/boot_back | grep -v \"^xfsrestore\" | head\n.vmlinuz-3.10.0-229.11.1.el7.x86_64.hmac\n\
  .vmlinuz-3.10.0-229.el7.x86_64.hmac\nSystem.map-3.10.0-229.el7.x86_64\nconfig-3.10.0-229.el7.x86_64\n\
  symvers-3.10.0-229.el7.x86_64.gz\nvmlinuz-3.10.0-229.el7.x86_64\ninitrd-plymouth.img\n\
  initramfs-3.10.0-229.el7.x86_64.img\ninitramfs-0-rescue-affb8edd5c9a4e829010852a180b0dc9.img\n\
  vmlinuz-0-rescue-affb8edd5c9a4e829010852a180b0dc9\n```\n\n通常你只想恢复单个文件。实现此目的的方法之一是使用\
  \ `xfsrestore` 命令的交互模式。参见示例 10-9 中的演示（注意，为了简便，省略了一些输出）。\n\n**示例 10-9** *xfsrestore*\
  \ 命令\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# xfsrestore -i -f /tmp/boot_back\
  \ /tmp\n\n ========================== 子树选择对话框 ==========================\n\n可用命令：\n\
  \    pwd\n    ls [ <path> ]\n    cd [ <path> ]\n    add [ <path> ]\n    delete [\
  \ <path> ]\n    extract\n    quit\n    help\n-> ls\n###已省略###\n             135\
  \ config-3.10.0-229.el7.x86_64\n             134 System.map-3.10.0-229.el7.x86_64\n\
  \             133 .vmlinuz-3.10.0-229.el7.x86_64.hmac\n          524416 grub2/\n\
  \             131 grub/\n-> add config-3.10.0-229.el7.x86_64\n\n -> extract\n\n\
  \ --------------------------------- 对话框结束 ---------------------------------\n\n\
  xfsrestore: 正在恢复非目录文件\nxfsrestore: 恢复完成：已耗 2807 秒\nxfsrestore: 恢复摘要:\nxfsrestore:\
  \   流 0 /tmp/boot_back OK (success)\nxfsrestore: 恢复状态: SUCCESS\n[root@onecoursesource\
  \ ~]# ls /tmp/config*\n/tmp/config-3.10.0-229.el7.x86_64\n```\n\n**注意**\n\n在某些发行版中，还有设计用于备份基于\
  \ ext 的文件系统的命令：`dump` 和 `restore` 命令。这些命令的工作方式与 `xfsdump` 和 `xfsrestore` 命令类似。\n\
  \n### xfs_info\n\n`xfs_info` 命令提供了当前挂载的 xfs 文件系统的基本文件系统信息，如示例 10-10 所示。\n\n**示例\
  \ 10-10** *xfs_info* 命令\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# xfs_info\
  \ /dev/sda1\nmeta-data=/dev/sda1              isize=256    agcount=4, agsize=32000\n\
  \         =sectsz=512   attr=2, projid32bit=1\n         =crc=0        finobt=0\n\
  data     =bsize=4096   blocks=128000, imaxpct=25\n         =sunit=0      swidth=0\n\
  naming   =version 2              bsize=4096   ascii-ci=0 ftype=0\nlog      =internal\
  \               bsize=4096   blocks=853, version=2\n         =sectsz=512   sunit=0\
  \ blks, lazy-count=1\nrealtime=none                   extsz=4096   blocks=0, rtextents=0\n\
  ```\n\n### xfs_check 和 xfs_repair\n\n类似于 `fsck` 实用程序，`xfs_repair` 工具修复未挂载的 xfs 文件系统。请参见示例\
  \ 10-11 演示。\n\n**示例 10-11** *xfs_repair* 命令\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# xfs_repair /dev/sda1\nPhase 1 - 查找并验证超级块...\nPhase 2 - 使用内部日志\n        - 清零日志\n\
  \        - 扫描文件系统和节点 map...\n        - 找到根块\nPhase 3 - 遍历每个 AG...\n        - 扫描并清除未链接列表...\n\
  \        - 处理已知节点并执行发现...\n        - agno = 0\n        - agno = 1\n        - agno\
  \ = 2\n        - agno = 3\n        - 处理新发现的节点\nPhase 4 - 检查重复块...\n        - 设置重复列表...\n\
  \        - 检查声称块的节点...\n        - agno = 0\n        - agno = 1\n        - agno =\
  \ 2\nPhase 5 - 重建 AG Header 和树...\n        - 重置超级块...\nPhase 6 - 检查节点连接性...\n  \
  \      - 重置实时位图和摘要节点的内容\n        - 遍历文件系统 ...\n        - 将断开的节点移动到 lost+found ...\n\
  Phase 7 - 验证并修正链接计数...\ndone\n```\n\n如果你只想检查文件系统问题但不修复任何问题，请运行 `xfs_check` 命令而不是\
  \ `xfs_repair` 命令。你可能会发现你的发行版没有包含 `xfs_check` 命令，而是允许在 `xfs_repair` 命令上使用 `-n` 选项（不修复），因为它执行了与\
  \ `xfs_check` 相同的任务。无论你使用哪种命令，请确保在执行命令前已卸载该文件系统。\n\n### 附加文件系统工具\n\n`du` 和 `df`\
  \ 命令设计用于显示文件系统信息。这些工具独立于文件系统的类型。\n\n#### du\n\n`du` 命令提供磁盘空间使用的估计值。例如，以下命令显示 `/usr/lib`\
  \ 目录的使用量：\n\n点击此处查看代码图像\n\n```\n[root@localhost ~]$ du -sh /usr/lib\n791M    /usr/lib\n\
  ```\n\n`/usr/lib` 命令的重要选项如表 10-4 所示。\n\n**表 10-4** */usr/lib* 命令选项\n\n| 选项 | 描述\
  \ |\n| --- | --- |\n| -h | 以人类可读格式显示 |\n| -s | 显示摘要而非子目录的大小 |\n\n#### df\n\n`df`\
  \ 命令显示分区和逻辑设备的使用情况：\n\n点击此处查看代码图像\n\n```\n[root@localhost ~]$ df\nFilesystem   \
  \       1K-blocks      Used Available Use% Mounted on\nudev                  2019204\
  \        12   2019192   1% /dev\ntmpfs                  404832       412    404420\
  \   1% /run\n/dev/sda1            41251136   6992272  32522952  18% /\nnone    \
  \                    4         0         4   0% /sys/fs/cgroup\nnone           \
  \          5120         0      5120   0% /run/lock\nnone                  2024144\
  \         0   2024144   0% /run/shm\nnone                   102400         0   \
  \ 102400   0% /run/user\n```\n\n`df` 命令的重要选项如表 10-5 所示。\n\n**表 10-5** *df* 命令选项\n\
  \n| 选项 | 描述 |\n| --- | --- |\n| -h | 以人类可读格式显示值 |\n| -s | 显示摘要而非子目录的大小 |\n\n\n\n\
  \n\n| `-i` | 显示 inode 信息。 |\n\n### 挂载文件系统\n\n在本节中，你将介绍用于手动挂载和卸载文件系统的命令。你还将学习如何通过在\
  \ `/etc/fstab` 文件中创建条目，修改系统在启动过程中自动挂载文件系统。\n\n#### umount 命令\n\n在讨论如何挂载文件系统之前，有必要简要演示一下\
  \ `umount` 命令。要卸载一个文件系统，你可以指定 `umount` 命令，并在后跟挂载点或设备名称。例如，如果 `/dev/sda1` 设备被挂载在\
  \ `/boot` 目录下，执行以下两个命令中的任意一个都将卸载该文件系统：\n\n```\numount /boot\numount /dev/sda1\n\
  ```\n\n关于 `umount` 命令的更多讨论将在探索 `mount` 命令后出现。\n\n#### mount 命令\n\n`mount` 命令可用于挂载文件系统，也可以显示当前哪些文件系统已挂载。在不带参数使用时，`mount`\
  \ 命令会显示已挂载的文件系统以及一些挂载属性（也称为挂载选项），如示例 10-12 所示。\n\n示例 10-12 *`mount` 命令*\n\n点击此处查看代码图像\n\
  \n```\n[root@onecoursesource ~]# mount\n/dev/mapper/vg_livecd-lv_root on / type\
  \ ext4 (rw)\nproc on /proc type proc (rw)\nsysfs on /sys type sysfs (rw)\ndevpts\
  \ on /dev/pts type devpts (rw,gid=5,mode=620)\ntmpfs on /dev/shm type tmpfs (rw,rootcontext=\"\
  system_u:object_r:tmpfs_t:s0\")\n/dev/sda1 on /boot type ext4 (rw,usrquota,grpquota)\n\
  none on /proc/sys/fs/binfmt_misc type binfmt_misc (rw)\nsunrpc on /var/lib/nfs/rpc_pipefs\
  \ type rpc_pipefs (rw)\n/dev/sr0 on /media/VBOXADDITIONS_5.0.2_102096 type iso9660\n\
  \    (ro,nosuid,nodev,uhelper=udisks,uid=500,gid=500,iocharset=utf8,mode=0400,dmode=0500\n\
  ```\n\n每一行描述一个已挂载的设备，并分为四个字段，已加粗高亮：\n\n点击此处查看代码图像\n\n```\ndevice on mount_point\
  \ type fs_type (mount_options)\n```\n\n表 10-6 详细描述了这些字段。\n\n表 10-6 `mount` 命令输出的字段\n\
  \n| 选项 | 说明 |\n| --- | --- |\n| `device` | 设备是挂载文件系统的位置。这可以是逻辑卷管理（LVM 将在第 11 章“管理本地存储：高级特性]”中介绍）、一个设备文件（如\
  \ `/dev/mapper/vg_livecd-lv_root`）、分区设备文件（如 `/dev/sda1`）、CD-ROM（如 `/dev/sr0`）、伪文件系统（如\
  \ tmpfs）或其他各种设备类型（如网络驱动器、USB 驱动器、RAID 设备，以及如果你回到时光机，软盘）。伪文件系统（逻辑文件组）是通常驻留在内存中的文件系统，这个主题超出了本书的范围。\
  \ |\n| `mount_point` | 这是文件系统当前挂载的目录。例如，示例 10-12 中 `/dev/sda1` 设备上的文件系统挂载在 `/boot`\
  \ 目录下。 |\n| `fs_type` | 这是文件系统的类型。除了伪文件系统，这些都很直观。记住在后续章节将更详细地介绍文件系统。 |\n| `mount_options`\
  \ | 最后一个字段至关重要，因为你作为管理员，可以通过这里影响文件系统的行为。有大量的挂载选项可以改变文件系统的行为。每种文件系统都有不同的挂载选项（尽管某些挂载选项适用于多个文件系统）。一个很好的例子是\
  \ `rw` 选项，你可以在示例 10-12 中的多种类型文件系统中看到它。该选项使文件系统可读可写数据。 |\n\n注意，`mount` 命令知道系统当前挂载了什么，因为这些信息存储在\
  \ `/etc/mtab` 文件中，如示例 10-13 所示。\n\n示例 10-13 *`/etc/mtab` 文件*\n\n点击此处查看代码图像\n\n```\n\
  [root@onecoursesource ~]# more /etc/mtab\n/dev/mapper/vg_livecd-lv_root / ext4 rw\
  \ 0\nproc /proc rw 0\nsysfs /sys rw 0\ndevpts /dev/pts devpts rw,gid=5,mode=620\
  \ 0\ntmpfs /dev/shm tmpfs rw,rootcontext=\"system_u:object_r:tmpfs_t:s0\" 0\nnone\
  \ /proc/sys/fs/binfmt_misc binfmt_misc rw 0\nsunrpc /var/lib/nfs/rpc_pipefs rpc_pipefs\
  \ rw 0\n/dev/sr0 /media/VBOXADDITIONS_5.0.2_102096 iso9660 ro,nosuid,nodev,uhelper=udisks,uid=500,gid=500,iocharset=utf8,mode=0400,dmode=0500\
  \ 0\n/dev/sda1 /boot ext4 rw,usrquota,grpquota 0\n```\n\n每当文件系统挂载或卸载时，`/etc/mtab`\
  \ 文件就会更新。另一个包含挂载信息的文件是 `/proc/mounts` 文件，如示例 10-14 所示。\n\n示例 10-14 *`/proc/mounts`\
  \ 文件*\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# more /proc/mounts\nrootfs\
  \ / rootfs rw 0\nproc /proc rw,relatime 0\nsysfs /sys sysfs rw,seclabel,relatime\
  \ 0\ndevtmpfs /dev devtmpfs rw,seclabel,relatime,size=247568k,nr_inodes=61892,mode=755\
  \ 0\ndevpts /dev/pts devpts rw,seclabel,relatime,gid=5,mode=620,ptmx=000 0\ntmpfs\
  \ /dev/shm tmpfs rw,seclabel,relatime 0\n/dev/mapper/vg_livecd-lv_root / ext4 rw,seclabel,relatime,barrier=1,data_ordered\
  \ 0\nnone /selinux selinuxfs rw,relatime 0\ndevtmpfs /dev devtmpfs rw,seclabel,relatime,size=247568k,nr_inodes=61892,mode=755\
  \ 0\n/proc/bus/usb /proc/bus/usb usbfs rw,relatime 0\nnone /proc/sys/fs/binfmt_misc\
  \ binfmt_misc rw,relatime 0\nsunrpc /var/lib/nfs/rpc_pipefs rpc_pipefs rw,relatime\
  \ 0\n/etc/auto.misc /misc autofs rw,relatime,fd=7,pgrp=1822,timeout=300,minproto=5,maxproto=5,indirect\
  \ 0 \n-hosts /net autofs rw,relatime,fd=13,pgrp=1822,timeout=300,minproto=5,maxproto=5,indirect\
  \ 0 \n/dev/sr0 /media/VBOXADDITIONS_5.0.2_102096 iso9660 ro,nosuid,nodev,uhelper=udisks,uid=500,gid=500,iocharset=utf8,mode=0400,dmode=0500\
  \ 0\n/dev/sda1 /boot ext4 rw,seclabel,relatime,barrier=1,data_ordered,usrquota,grpquota\
  \ 0\n```\n\n尽管这两个文件都包含当前挂载文件系统的信息，但你应该注意以下一些差异：\n\n* `/etc/mtab` 文件由 `mount` 和 `umount`\
  \ 命令管理。`mount` 命令有一个选项 `-n` 表示“不更新 /etc/mtab 文件”，因此该文件可能不准确。\n* `/proc/mounts` 文件由内核管理，更有可能是的。\n\
  * `/proc/mounts` 文件通常包含更多信息（例如，对比示例 10-13 中 `/dev/sda1` 设备的挂载选项和示例 10-14）。\n\n###\
  \ 手动挂载文件系统\n\n要挂载文件系统，你应该为 `mount` 命令指定两个参数：要挂载的设备和挂载点。例如，以下命令首先演示了 `/dev/sda1`\
  \ 已挂载，然后卸载 `/dev/sda1` 设备，最后将其重新挂载到 `/boot` 分区：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# mount | grep /dev/sda1\n/dev/sda1 on /boot type ext4 (rw,usrquota,grpquota)\n\
  [root@onecoursesource ~]# umount /dev/sda1\n[root@onecoursesource ~]# mount /dev/sda1\
  \ /boot\n[root@onecoursesource ~]# mount | grep /dev/sda1\n/dev/sda1 on /boot type\
  \ ext4 (rw)\n```\n\n\n\n\n如果你仔细观察，你会发现设备原始挂载方式与第二次挂载方式之间的差异。在第二次执行 `mount` 命令的输出中，缺少了\
  \ `usrquota` 和 `grpquota` 选项。这是因为 `/dev/sda1` 设备最初挂载时，由于 `/etc/fstab` 文件中的项启用了这些选项，该文件将在本章稍后介绍。\n\
  \n若要手动启用挂载选项，请使用 `-o` 选项：\n\n点击查看代码图片\n\n```\n[root@onecoursesource ~]# mount |\
  \ grep /dev/sda1\n/dev/sda1 on /boot type ext4 (rw)\n[root@onecoursesource ~]# umount\
  \ /dev/sda1\n[root@onecoursesource ~]# mount -o usrquota,grpquota /dev/sda1 /boot\n\
  [root@onecoursesource ~]# mount | grep /dev/sda1\n/dev/sda1 on /boot type ext4 (rw,usrquota,grpquota)\n\
  ```\n\n### 安全要点\n\n另一个实用的挂载选项是 `ro` 选项，它允许将文件系统挂载为只读。如果文件系统当前以读写模式挂载，可以通过执行 `mount\
  \ -o remount,ro /dev/*device_name` 命令将其更改为只读。将文件系统挂载为只读对于故障排除或尝试识别黑客后门非常有用，且不会允许问题代码执行。\n\
  \n如前所述，有很多挂载选项，这些选项可以适用于多种文件系统类型，也可以是特定的某个文件系统类型。挂载选项将在本章稍后详细讨论。\n\n`mount` 命令的另一个命令行选项是\
  \ `-t` 选项，允许你指定文件系统类型。在大多数情况下，`mount` 命令足够智能，可以在挂载之前通过探测文件系统来选择正确的类型。但是，如果你需要指定文件系统类型，请使用以下语法：\n\
  \n```\nmount -t ext4 /dev/sda1 /boot\n```\n\n### 卸载文件系统的问题\n\n如果文件系统正在被使用，则无法卸载。文件系统可能被使用的原因有几个，包括：\n\
  \n*   有文件正从该文件系统打开。\n*   有进程正在该文件系统中运行。\n*   用户 shell “处于”该文件系统中。换句话说，挂载点目录或挂载点下的子目录是用户\
  \ shell 的当前目录。\n\n这对于需要卸载文件系统的系统管理员来说可能是令人沮丧的。你不希望看到以下错误消息：\n\n点击查看代码图片\n\n```\n\
  [root@onecoursesource ~]# umount /boot\numount: /boot: device is busy.\n       \
  \ (在某些情况下，关于使用设备的进程有用信息\n         可以通过 lsof(8) 或 fuser(1) 找到)\n```\n\n注意，错误消息包含了使用\
  \ `lsof` 或 `fuser` 命令的建议。`lsof` 命令是一个列出打开文件的出色命令（非常适合排除许多不同问题），但在情况下，`fuser` 命令更有用。\n\
  \n以文件系统的挂载点作为参数执行 `fuser` 命令，可以显示哪个进程正在使用该文件系统：\n\n点击查看代码图片\n\n```\n[root@onecoursesource\
  \ ~]# fuser /boot\n/boot:                4148c\n```\n\n此示例中的值 4148 表示进程的 PID，而 `c`\
  \ 表示进程被使用的方式。以下内容直接来自 `fuser` 手页文档：\n\n点击查看代码图片\n\n```\nc      当前目录。\ne      正在运行的可执行文件。\n\
  f      已打开的文件。在默认显示模式下省略 f。\nF      为了写入打开的文件。在默认显示模式下省略 F。\nr      根目录。\nm    \
  \  mmap 映射的文件或共享库。\n```\n\n因此，`c` 意味着 PID 为 4148 的进程将 `/boot` 目录（或 `/boot` 目录的子目录）作为当前目录。如果你使用\
  \ `-v` 选项（代表“verbose”，详细模式），你可以看到更多细节：\n\n点击查看代码图片\n\n```\n[root@onecoursesource\
  \ ~]# fuser -v /boot\n                     USER        PID ACCESS COMMAND\n/boot:\
  \               bob        4148 ..c.. bash\n```\n\n现在你就可以去找到用户 bob 并让他离开 `/boot`\
  \ 目录了。或者，你可以使用 `fuser` 命令的另一个有用选项来杀死那个让你头疼的进程：\n\n点击查看代码图片\n\n```\n[root@onecoursesource\
  \ ~]# fuser -k /boot\n/boot:                4148c\n[root@onecoursesource ~]# fuser\
  \ -v /boot\n[root@onecoursesource ~]# umount /boot\n```\n\n### 安全要点\n\n当执行 `fuser`\
  \ 命令时，它会向所有使用该文件系统的进程发送 `SIGKILL` 信号。这是强制卸载的一种强大方法，但应谨慎使用，因为它会终止活动中的进程。\n\n### 自动挂载文件系统\n\
  \n有几个文件系统在启动时会被挂载。挂载哪些文件系统取决于 `/etc/fstab` 文件的设置。请参阅 示例 10-15 获取示例的 `/etc/fstab`\
  \ 文件。\n\n#### 示例 10-15：/fstab 文件\n\n```\nstudent@onecoursesource ~]$ more /fstab\n\
  # 可访问的文件系统通过引用维护在 '/dev/disk' 下\n## 更多信息请参见 man 页 fstab(5), findfs(8) 和 blkid(8)\n\
  #\n/dev/mapper/vg_livecd_root /                   ext4   defaults 1\nUUID=974e2406-eeec-4a49-9df7-c86d046e9f9\
  \ /boot   ext4   usrquota,grpquota,defaults\n1 2\n/dev/mapper/vg_livecd_swap swap\
  \              swap    defaults        0 0\ntmpfs                   /dev/shm   \
  \             tmpfs   defaults        0 0\ndevpts                  /dev/pts    \
  \            devpts  gid=5,mode=620  0 0\nsysfs                   /sys         \
  \           sysfs   defaults        0 0\nproc                    /proc         \
  \          proc    defaults        0 0\n```\n\n`/etc/fstab` 文件的每行包含六个数据字段，用空格分隔，用于描述文件系统的位置、文件系统类型、挂载系统的位置（挂载点）以及如何挂载（挂载选项）。这六个字段是：\n\
  \n点击查看代码图片\n\n```\ndevice_to_mount   mount_point   fs_type   mount_options\ndump_level\
  \   fsck_value\n```\n\n表 10-7 详细描述了这些字段。\n\n**表 10-7** /etc/fstab 文件的字段\n\n| **选项**\
  \ | **描述** |\n| --- | --- |\n| **device_to_mount** | 这是包含要挂载文件系统的设备描述符。指定此名称有多种方式，包括使用设备文件名（如\
  \ `/dev/sda1`）、标签或 UUID（通用唯一标识符）。这些各方式的优缺点将在本章的“设备描述符”部分进行讨论。 |\n\n\n\n\n\n| `mount_point`\
  \ | 文件系统在目录树结构中所在的目录。 |\n\n| `fs_type` | 文件系统类型。设备上的文件系统通常使用 `btrfs`、`ext4`、`xfs`\
  \ 或 `vfat` 条目。网络文件系统通常使用 `nfs` 或 `cifs`（Windows 文件共享）。伪文件系统通常使用 `tmpfs`、`proc` 或\
  \ `devpts`。`swap` 条目用于作为内存的设备（如硬盘缓存或操作系统的交换空间）。 |\n\n| `mount_options` | 挂载文件系统时使用的选项。请参阅本章后文的“[挂载选项\
  \ (Mount Options)””节。 |\n\n| `dump_level` | 此值由 `dump` 命令用于确定备份哪些文件系统。值为 1 表示“备份此文件系统”，值为\
  \ 0 表示“不备份此文件系统”。在现代 Linux 发行版中很少使用 `dump` 命令，因此大多数管理员习惯性地在此字段中填入 0。 |\n\n| `fsck_value`\
  \ | 系统启动时，`fsck` 命令会对本地 Linux 文件系统进行检查。它检查哪些文件系统以及检查顺序取决于此字段。值为 0 表示“不检查”；这应该是所有非\
  \ Linux 文件系统（包括远程挂载的文件系统）的取值。值为 1 或更高表示“在此文件系统上运行 `fsck` 命令”。大多数管理员对 `/` 文件系统使用值\
  \ 1，对所有其他分区使用值 2。文件系统从值 1 开始按顺序进行检查。如果所有分区都位于单个硬盘上，那么使用任何其他值都没有优越性，因为一次只能检查一个分区。然而，如果你有多个硬盘，你可能希望对不同硬盘上大小相似的分区使用相同的值，以加快运行\
  \ `fsck` 命令的过程。这是因为 `fsck` 命令可以在不同的硬盘上并行运行。因此，如果 `/dev/sda1` 和 `/dev/sdb6` 大大小相近，请对它们使用相同的\
  \ `fsck` 值。 |\n\n### 设备描述符 (Device Descriptors)\n\n如果你添加了新的文件系统，应该仔细考虑使用什么设备描述符来挂载该文件系统。例如，假设你向系统添加了一个新硬盘，创建了一个设备名称为\
  \ `/dev/sdb1` 的分区，并在分区上放置了 `ext4` 文件系统。你你可以在 `/etc/fstab` 文件中添加如下的一行：\n\n```\n/dev/sdb1\
  \  /data  ext4  defaults 0 1\n```\n\n从现在起，这很可能运行得良好，但存在一个潜在问题：设备名称可能会发生变化。如果你向系统添加或删除硬盘，固件程序（例如\
  \ BIOS）可能会认为新硬盘是“第一”块磁盘，导致现有磁盘的设备名称发生变化。即使是删除设备上的分区也可能导致现有分区被重新编号。\n\n因此，与其对普通分区使用设备名，你可以使用标签（labels）。`label`\
  \ 是你放置在分区上的名称。如果设备名称发生变化，标签仍然会“粘”在那个分区上，这使其成为一种更好的挂载方法。要要创建标签，请使用 `e2label` 命令：\n\
  \n```\n[root@onecoursesource ~]# e2label /dev/sdb1 data\n```\n\n在 `/etc/fstab` 文件中使用以下语法：\n\
  \n```\nLABEL=\"data\"  /data  ext4  defaults 0 1\n```\n\n注意，你可以使用 `e2label` 命令或\
  \ `blkid` 命令显示标签：\n\n```\n[root@onecoursesource ~]# e2label /dev/sda2\ndata\n[root@onecoursesource\
  \ ~]# blkid | grep sda2\n/dev/sda2: UUID=\"974e2406-eeec-4a49-9df7-c86d046e97f9\"\
  \ TYPE=\"ext4\" LABEL=\"data\"\n```\n\n虽然使用标签挂载设备比使用设备名好，但它仍然不是理想的。如果你将此磁盘从当前系统取出并添加到另一个系统中，可能会出现标签冲突。如果新系统也有一个标签为“data”的分区，就会导致问题。\n\
  \n最稳定的解决方案是使用 UUID 数字。通用唯一标识符是在设备创建时分配给该设备的数字。由于这个数字非常大（128 位）以及其生成方式，两个设备几乎不可能具有相同的数字。`blkid`\
  \ 命令显示设备的 UUID：\n\n```\n[root@onecoursesource ~]# blkid\n/dev/sda2: UUID=\"974e2406-eeec-4a49-9df7-c86d046e97f9\"\
  \ TYPE=\"ext4\" LABEL=\"data\"\n```\n\n要在 `/etc/fstab` 文件中使用 UUID，请使用以下命令：\n\n```\n\
  UUID=974e2406-eeec-4a49-9df7-c86d046e97f9 /data ext4 defaults 0 1\n```\n\n最后，重要的是，并不是所有设备都需要\
  \ UUID 或标签。考虑来自 `/etc/fstab` 的这一行：\n\n```\n/dev/mapper/vg0-root swap 0 0\n```\n\n\
  逻辑卷将在第 11 章 中详细讨论。\n\n### 挂载选项 (Mount Options)\n\n文件系统的行为在很大程度上取决于提供的选项。有几十种不同的挂载选项。最重要的是的是与\
  \ `defaults` 相关的选项。当你在 `/etc/fstab` 中指定 `defaults` 作为挂载选项时，你实际上指定了 `rw`、`suid`、`dev`、`exec`、`auto`、`nouser`、`async`\
  \ 和 `relatime`。表 10-8 详细描述了这些选项。\n\n#### 表 10-8 默认选项\n\n| 选项 | 描述 |\n| --- | ---\
  \ |\n| `rw` | 以读写模式挂载文件系统。要以只读模式挂载，请使用 `ro`。 |\n| `suid` | 启用文件系统中文件的 SUID 权限，详情请第\
  \ 9 章“文件权限.”使用 `nosuid` 选项禁用 SUID 权限。禁用 SUID 权限是为了防止用户创建 SUID 程序，这可能会导致安全风险。（注意：`/`\
  \ 和 `/usr` 文件系统不应使用 `nosuid` 挂载。） |\n| `dev` | 允许在文件系统中使用设备文件。通常设备文件位于 `/dev` 目录下，因此出于安全考虑，在所有文件系统（`/`\
  \ 文件系统除外）上使用 `nodev` 选项将提高安全性。 |\n| `exec` | 允许文件系统中的可执行文件。使用 `noexec` 选项禁用执行文件。在服务器上禁止执行文件可能是一个好主意，可以防止用户引入新程序。\
  \ |\n| `auto` | 当管理员对 `mount` 命令使用 `-a` 参数时使用此选项。`-a` 选项意味着“挂载 `/etc/fstab` 文件中所有具有\
  \ `auto` 选项的文件系统”。请记住，当系统启动时会使用 `mount -a` 命令来挂载文件系统，因此使用 `noauto` 选项也意味着该文件系统在启动时不会自动挂载。\
  \ |\n\n\n\n\n\n| 选项 | 说明 |\n| :--- | :--- |\n| `nouser` | 不允许普通用户挂载文件系统。出于安全考虑，这通常是最佳选项，但在某些情况下，你可能希望用户挂载可移动设备。在这种情况下，请使用\
  \ `user` 选项。如果你使用了 `user` 选项，一旦挂载文件系统，只有该用户可以卸载它。还需要注意 `user` 选项，它也允许任何用户挂载文件系统。然而，该选项也允许任何用户卸载文件系统。\
  \ |\n| `async` | 执行同步的过程是为了确保所有数据已写入硬盘。通常在创建或修改文件时，文件内容会直接写入硬盘，但元数据（关于文件的信息）临时存储在内存中。这减少了过度的硬盘写入并防止了抖动（thrashing，即硬盘过载时发生的情况）。每隔固定间隔，这些元数据就会写入硬盘，此过程被称为同步。`async`\
  \ 选项会导致元数据临时存储在内存中。在某些情况下，这可能会导致问题，因为如果系统异常关机，这些元数据可能会丢失。如果这些元数据至关重要，请考虑使用 `sync`\
  \ 选项，但要意识到可能会显著降低系统速度。注意：如果你正在使用 `async` 选项，始终可以通过执行 `sync` 命令将元数据写入硬盘。 |\n| `relatime`\
  \ | 每个文件都有三个时间戳：文件内容最后修改的时间、元数据最后更改的时间以及文件最后被访问的时间。文件访问时间通常不是关键的，但它会导致大量的系统写入，特别是当你对目录结构执行递归命令时（例如\
  \ `grep -r`）。`relatime` 选项允许更新访问时间戳。如果这导致了性能问题，请考虑将选项更改为 `norelatime`。 |\n\n如前所述，这些并不是选项；事实上有更多选项。要发现这些额外的选项，请浏览\
  \ `mount` 命令的帮助页（man page）。首先查看标题为“Filesystem Independent Mount Options”（文件系统无关挂载选项）的部分，因为它包含了适用于大多数文件系统的选项。然后搜索你正在使用的文件系统。示例\
  \ 10-16 显示了与 ext4 文件系统相关的 `mount` 帮助页的一部分。\n\n**示例 10-16** *ext4 文件系统的挂载选项*\n\n\
  点击此处查看代码图像\n\n```\nMount options for ext4\n       The ext4 filesystem is an advanced\
  \  level  of  the  ext3  filesystem\n       which  incorporates  scalability  and\
  \ reliability enhancements for sup-\n       porting large filesystem.\n\n      \
  \ The  options  journal_dev,  noload,  data,  commit, orlov,   oldalloc,\n     \
  \  [no]user_xattr [no]acl, bsddf, minixdf, debug, errors, data_err, grpid,\n   \
  \    bsdgroups, nogrpid sysvgroups,  resgid,  resuid,  sb,  quota,  noquota,\n \
  \      grpquota,  usrquota  and  [no]bh are backwardly compatible with ext3 or\n\
  \       ext2.\n\n       journal_checksum\n              Enable checksumming of \
  \ the  journal transactions.  This will\n              allow  the recovery code\
  \ in e2fsck and the kernel to detect cor-\n              ruption in the kernel.\
  \ It is a compatible change  and  will\n              ignored by older kernels.\n\
  \n       journal_async_commit\n              Commit block can be written to disk\
  \ without waiting for descrip-\n              tor blocks. If enabled older kernels\
  \ cannot  mount  the  device.\n```\n\n### 挂载移动媒体\n\n当可移动媒体（如 CD-ROM 或 DVD）被自动挂载时，它们通常在\
  \ `/media` 目录下可用。在运行带有 GUI（如 Gnome 或 KDE）的现代 Linux 发行版上，不需要配置此过程，因为这些软件程序能够识别新的可移动媒体并自动挂载。\n\
  \n然而，在没有运行 GUI 的系统上，这种自动挂载过程不会发生。你可以通过以下 `/etc/fstab` 条目配置系统，允许普通用户挂载可移动设备：\n\n\
  点击此处查看代码图像\n\n```\n/dev/cdrom /media udf,iso9660 noauto,owner 0 0\n```\n\n### 交换空间\n\
  \n交换空间 在可用内存 不足时由操作系统使用。内存中当前未使用的数据被“交换”到硬盘上为该用途保留的专用空间，以便为其他进程使用内存腾出空间。\n\n通常，你在安装过程中会创建一个交换分区。在安装后的某个点，你可能决定添加额外的交换空间。这可以是另一个交换分区或交换文件的形式。\n\
  \n要查看当前激活的交换设备，请使用 `-s` 选项执行 `swapon` 命令：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# swapon -s\nFilename            Type          Size       Used      Priority\n\
  /dev/dm-1           partition     1048568\n```\n\n从 `swapon -s` 命令的输出中，你可以看到交换文件系统的设备名称（`/dev/dm-1`）、交换文件系统的大小（字节）以及该空间已使用了多少。优先级表示应该先使用哪个交换文件系统。\n\
  \n### 创建交换设备\n\n交换设备可以是存储设备（分区、逻辑卷、RAID 等）也可以是文件。通常，存储设备比交换文件快一点，因为内核不需要通过文件系统即可访问存储设备上的交换空间。然而，你并不总是能向系统添加新设备，因此你可能会发现交换文件更常用于次交换设备。\n\
  \n假设你已经创建了一个标记类型为 82 的新分区（在本例中为 `/dev/sdb1`），你可以通过执行以下命令将其格式化为交换设备：\n\n点击此处查看代码图像\n\
  \n```\n[root@onecoursesource ~]# mkswap /dev/sdb1\nSetting up swapspace version\
  \ 1, size = 203772 KiB\nno label, UUID=039c21dc-c223-43c8-8176-da2f4d50842\n```\n\
  \n你可以使用 `swapon` 命令将此添加到现有的交换空间中：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]#\
  \ swapon -s\nFilename            Type          Size       Used      Priority\n/dev/dm-1\
  \           partition     1048568       37636         -1\nroot@onecoursesource ~]#\
  \ swapon /dev/sdb1\nroot@onecoursesource ~]# swapon -s\nFilename            Type\
  \          Size       Used      Priority\n/dev/dm-1           partition     1048568\
  \       37636         -1\n/dev/sdb1           partition     203768        0    \
  \         -2\n```\n\n记住 `swapon` 命令只是临时解决方案。在 `/etc/fstab` 中添加如下条目以使其成为永久交换设备：\n\
  \n点击此处查看代码图像\n\n```\nUUID=039c21dc-c223-43c8-8176-da2f4d508402 swap    defaults\
  \    0 0\n```\n\n要创建交换文件，你首先需要创建一个大文件。这通过使用 `dd` 命令可以完成。示例 10-17 显示了如何创建一个名为 `/var/extra_swap`\
  \ 的 200MB 文件，然后将其交换空间启用。\n\n**示例 10-17** *创建文件并启用交换空间*\n\n点击此处查看代码图像\n\n\n\n\n\n\
  ```\n[root@onecoursesource ~]# dd if=/dev/zero of=/var/extra_swap bs=1M count=200\n\
  200+0 records in\n200+0 records out\n209715200 bytes (210 MB) copied, 4.04572 s,\
  \ 51.8 MB/s\n[root@onecoursesource ~]# mkswap /var/extra_swap\nmkswap: /var/extra_swap:\
  \ warning: don't erase bootbits sectors\n        on whole disk. Use -f to force.\n\
  Setting up swapspace version 1, size = 204796 KiB\nno label, UUID=44469984-0a99-45af-94b7-f7e97218d67a\n\
  [root@onecoursesource ~]# swapon /var/extra_swap\n[root@onecoursesource ~]# swapon\
  \ -s\nFilename             Type          Size         Used       Priority\n/dev/dm-1\
  \            partition     1048568      37664      -1\n/dev/sdb1            partition\
  \     203768       0          -2\n/var/extra_swap      file          204792    \
  \   0          -3\n```\n\n如果你决定要手动从当前交换空间移除一个设备，请使用 `swapoff` 命令：\n\n点击此处查看代码图片\n\
  \n```\n[root@onecoursesource ~]# swapon -s\nFilename         Type          Size\
  \        Used          Priority\n/dev/dm-1        partition     1048568     27640\
  \         -1\n/var/extra_swap  file          204792      0             -2\n[root@onecoursesource\
  \ ~]# swapoff /var/extra_swap\n[root@onecoursesource ~]# swapon -s\nFilename   \
  \     Type          Size        Used          Priority\n/dev/dm-1       partition\
  \     1048568     27640         -1\n```\n\n### 总结\n\n在本章中，你学习了如何创建分区和文件系统，以及如何执行基本的文件系统操作任务。这是通过手动和自动挂载分区，并使用挂载和卸载操作期间可以使用的不同选项实现的。\n\
  \n#### 关键术语\n\n*   物理文件系统\n*   虚拟文件系统\n*   挂载点\n*   挂载\n*   标签\n*   UUID\n*   同步\n\
  *   交换空间\n*   日志 (journal)\n*   快照 (snapshot)\n*   inode\n\n#### 复习题\n\n**1.** 下列哪些是用于\
  \ CD-ROM 光盘的文件系统？（选择两个）\n\n1.  ext2\n2.  HFS\n3.  ISO9660\n4.  UDF\n\n**2.** \\\
  _ 命令用于卸载文件系统。\n\n**3.** 哪些命令可以用于确定是什么阻止了你卸载文件系统？（选择两个）\n\n1.  `mount`\n2.  `umount`\n\
  3.  `fuser`\n4.  `lsof`\n\n**4.** `fuser` 命令的哪个选项显示保持文件系统繁忙进程的所有者？\n\n1.  `-k`\n\
  2.  `-o`\n3.  `-v`\n4.  以上所有\n\n**5.** 下列哪个命令可以显示设备的 UUID？\n\n1.  `e2label`\n2.\
  \  `mount`\n3.  `sync`\n4.  `blkid`\n\n**6.** \\_ 命令从当前使用中移除交换设备。\n\n**7.** 哪种文件系统支持大小达\
  \ 2TB 的文件？\n\n1.  ext2\n2.  ext3\n3.  ext4\n4.  以上都不是\n\n**8.** 下列哪个命令可以用于创建分区？\n\
  \n1.  `mkfs`\n2.  `fsck`\n3.  `dumpe2fs`\n4.  `fdisk`\n\n**9.** 填空以创建一个 ext4 文件系统：\\\
  _\n\n**10.** \\_ 命令从当前使用中移除交换设备。\n\n## 管理本地存储：特性\n\n在本章中，重点是高级存储。接下来，我们将探索 autofs\
  \ 的功能，它允许设备自动挂载。本地和远程存储都包含在第 12 章“远程存储”中。最后，你将学习逻辑卷管理和分区的基础知识。\n\n在读完本章并完成练习后，你将能够：\n\
  *   创建并挂载文件系统\n*   管理逻辑卷\n*   设置磁盘配额\n*   管理硬链接和软链接\n\n### 加密文件系统\n\n涉及 Linux 加密时，你希望了解的一种重要技术是\
  \ LUKS (Linux Unified Setup)。当我们说 LUKS 是一个规范时，我们的意思是它描述了 Linux 上如何加密文件系统。它并不提供任何软件，尽管它通常被称为“非官方标准”。\n\
  \n由于它是一个规范，LUKS 并不强制你使用任何特定的软件工具来加密文件系统。虽然有不同的工具可用，但为了本书的目的，我们将演示一种名为 DMCrypt 的内核实现。\n\
  \nDMCrypt 是一个内核模块，允许内核理解加密文件系统。除了 DMCrypt 模块外，你应该了解可以使用两个创建和挂载加密文件系统的命令：`cryptsetup`\
  \ 和 `cryptmount` 命令。注意，你只需要这两个命令中的一个（很可能是 `cryptsetup` 命令）来配置加密文件系统。\n\n以下步骤演示了如何使用\
  \ `cryptsetup` 命令创建一个新的加密文件系统。开始，你可能需要加载一些内核模块（参见第 28 章”，有关 `modprobe` 命令的详情）：\n\
  \n点击此处查看图片\n\n```\n[root@onecoursesource ~]# modprobe dm-crypt\n[root@onecoursesource\
  \ ~]# modprobe aes\n[root@onecoursesource ~]# modprobe sha256\n```\n\n接下来，在新分区上创建一个\
  \ LUKS 格式的密码。注意，如果你正在使用现有分区，首先需要备份所有数据并卸载该分区。以下命令将覆盖 **/dev/sda3** 分区的数据：\n\n点击此处查看图片\n\
  \n```\n[root@onecoursesource ~]# cryptsetup --verbose --verify-passphrase\nluksFormat\
  \ /dev/sda3\nWARNING!\n========\nThis will overwrite data on /dev/sda3 irrevocably.\n\
  Are you sure? (Type uppercase yes): YES\nEnter passphrase:\nVerify passphrase:\n\
  Command successful.\n```\n\n\n\n\n注意上一次 `cryptsetup` 命令的输出，系统会提示你提供密码（一个如句子或简单短语之类的字符字符串）。每当你需要挂载文件系统时，都需要这个密码。\n\
  \n接下来，你需要运行一个命令来创建一个新的加密设备文件。以下操作将创建一个名为 `/dev/mapper/data` 的文件，它之后将被用于挂载加密的文件系统。你输入的密码必须与之前通过\
  \ `cryptsetup` 命令创建的密码匹配。\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# cryptsetup\
  \ luksOpen /dev/sda3 data\nEnter passphrase for /dev/sda3:\n```\n\n现在文件系统已经打开（你可以将其视为“已解锁”或“已解密”），请在新设备上创建一个文件系统，如示例\
  \ 11-1 所示。\n\n**示例 11-1** *创建文件系统*\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]#\
  \ mkfs -t ext4 /dev/mapper/data\nmke2fs 1.42.9 (28-Dec-2013)\nFilesystem label=\n\
  OS type: Linux\nBlock size=4096 (log=2)\nFragment size=4096 (log=2)\nStride=0 blocks,\
  \ Stripe width=0 blocks\n34480 inodes, 137728 blocks\n6886 blocks (5.00%) reserved\
  \ for the super user\nFirst data block=0\nMaximum filesystem blocks=142606336\n\
  5 block groups\n32768 blocks per group, 32768 fragments per group\n6896 inodes per\
  \ group\nSuperblock backups stored on blocks:\n    32768, 98304\nAllocating group\
  \ tables: done\nWriting inode tables: done\nCreating journal (4096 blocks): done\n\
  Writing superblocks and filesystem accounting information: done\n```\n\n注意上一个命令，设备\
  \ `/dev/mapper/data` 被用作创建文件系统的设备。非常重要的一点是*不要*在分区（本例中为 `/dev/sda3`）上创建文件系统。\n\n\
  创建挂载点目录并在 `/etc/crypttab` 和 `/etc/fstab` 文件建立目。`/etc/crypttab` 文件将新的 `/dev/mapper/data`\
  \ 设备与 `/dev/sda3` 分区关联。系统在启动过程中会使用这种关联将 `/dev/mapper/data` 挂载到 `/data` 目录下。\n\n\
  点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# mkdir /data\n[root@onecoursesource\
  \ ~]# echo \"data /dev/sda3 none\" >> /etc/crypttab\n[root@onecoursesource ~]# echo\
  \ \"/dev/mapper/data /data ext4 defaults 1 2\" >> /etc/fstab\n```\n\n每次启动系统时，系统都会提示你输入密码以挂载\
  \ `/dev/mapper/data` 设备。示例参见图 11-1。\n\n![图像](img/00051.jpeg)\n\n**图 11-1** *启动过程中的密码提示*\n\
  \n可以通过将 `/etc/crypttab` 文件中的 `none` 修改为提供密码的设置来实现此自动化，但这违背了你最初加密文件系统的目的。\n\n###\
  \ 管理 autofs\n\nautofs 的目的是当用户（或任何进程）访问挂载点时，自动挂载文件系统。挂载点一段时间未使用后，文件系统会自动卸载。\n\nautofs\
  \ 的起点是 `/etc/auto.master` 文件，它允许你指定在访问挂载点时挂载什么。通常，你的发行版已经有了一个 `/etc/auto.master`\
  \ 文件，但其具体内容可能随发行版而有所不同。示例 11-2 显示了 CentOS 7.x 系统上的 `/etc/auto.master` 文件。\n\n**示例\
  \ 11-2** *CentOS 7.x 系统上的 /etc/auto.master 文件***\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ Desktop]# more /etc/auto.master\n#\n# Sample auto.master file\n# 这是一个“主”自动挂载器映射表，它具有以下格式：\n\
  # mount-point [map-type[,format]:]map [options]\n# 有关格式的详情请查看 auto.master(5)。\n\
  #\n/misc    /etc/auto.misc\n#\n# NOTE: 从 hosts map 执行的挂载将使用 \"nosuid\" 和 \"nodev\"\
  \n# 选项进行挂载，除非显式给出了 \"suid\" 和 \"dev\"\n# 选项。\n/misc    /etc/auto.misc\n```\n\n\n\
  \n\n```\n[root@onecoursesource Desktop]# more /etc/auto.misc\n#\n# This is an automounter\
  \ map and it has the following format\n# key [ -mount-options-separated-by-comma\
  \ ] location\n# Details may be found in the autofs(5) manpage\n\ncd        -fstype=iso9660,ro,nosuid,nodev\
  \        :/dev/cdrom\n\n# the following entries are samples to pique your imagination\n\
  #linux        -ro,soft,intr        ftp.example.org:/pub/linux\n#boot         -fstype=ext2\
  \         :/dev/hda1\n#floppy       -fstype=auto         :/dev/fd0\n#floppy    \
  \   -fstype=ext2         :/dev/fd0\n#e2floppy     -fstype=ext2         :/dev/fd0\n\
  #jaz          -fstype=ext2         :/dev/sdc1\n#removable    -fstype=ext2      \
  \   :/dev/hdd\n```\n\nMost of these lines are commented out, but one line does provide\
  \ a setting that is currently enabled:\n\n点击此处查看代码图像\n\n```\ncd        -fstype=iso9660,ro,nosuid,nodev\
  \    :/dev/cdrom\n```\n\nThe first field (`cd` in this example) contains the rest\
  \ of the path to generate the mount point. The second field contains the mount options,\
  \ and the third field is the device to mount. In other words, based on the entry\
  \ in 示例 11-3, if a user or process were to enter the `/misc/cd` directory, then\
  \ the local `/dev/cdrom` device would be mounted with the `-fstype=iso9660,ro,nosuid,nodev`\
  \ mount options.\n\nOn modern Linux distributions that have a GUI running, the GUI\
  \ automatically mounts CD-ROMs. However, this would not happen on a server that\
  \ was not running a GUI, so this setting might make it easier for regular users\
  \ to access the CD-ROM (normally they would not be allowed to mount the CD-ROM).\n\
  \nSuppose you wanted to create an automount that mounts the NFS share of `server1:/usr/share/doc`\
  \ under the `/nfs/doc` directory and creates an automount that mounts the NFS share\
  \ of `plan9:/aliens` under the `/nfs/aliens` directory. First add the following\
  \ entry in the `/etc/auto.master` file:\n\n点击此处查看代码图像\n\n```\n/nfs            /etc/auto.custom\n\
  ```\n\nThen add the following entries in the `/etc/auto.custom` file:\n\n点击此处查看代码图像\n\
  \n```\nDoc        -fstype=nfs    server1:/usr/share/doc\nAliens     -fstype=nfs\
  \    plan9:/aliens\n```\n\nNext, create the `/nfs` directory (note that on modern\
  \ systems, this step might not be necessary, but it does no harm either):\n\n```\n\
  mkdir /nfs\n```\n\nDo not create any subdirectories; `/nfs/doc` and `/nfs/aliens`\
  \ will be created by the automount daemon as required (and then deleted when no\
  \ longer required).\n\nFinally, either start or restart the autofs service. Assuming\
  \ you are working on a SysVinit system, execute the following:\n\n```\n/etc/init.d/autofs\
  \ start\n```\n\nNote that you can also create a direct map, which is less complex\
  \ and recommended for simple mounts. For direct maps, you add an entry like the\
  \ following in the `/etc/auto.master` file:\n\n```\n/-    /etc/auto.direct\n```\n\
  \nThen you place the complete mount point, mount options, and device to mount in\
  \ the `/etc/auto.direct` file:\n\n点击此处查看代码图像\n\n```\n/remote/aliens    -fstype=nfs\
  \    plan9:/aliens\n```\n\nRemember to restart the autofs services whenever you\
  \ make changes to any of these map files.\n\n### 卷管理器\n\nThe partitioning technology\
  \ that has been used on x86 platforms for decades has limitations. For example,\
  \ the entire partition must reside on a single disk, making it difficult to take\
  \ advantage of disk space when a new hard drive is added to the system. It is also\
  \ not easy to resize traditional partitions.\n\n逻辑卷管理器 (LVM) is a technology that\
  \ can be used in place of traditional partitions. Using LVM you can incorporate\
  \ new storage space into an existing storage device, essentially extending the capacity\
  \ of a device that already contains a filesystem. LVM also allows you to create\
  \ “snapshots,” enabling you to create backups of live filesystems.\n\n### 卷管理器概念\n\
