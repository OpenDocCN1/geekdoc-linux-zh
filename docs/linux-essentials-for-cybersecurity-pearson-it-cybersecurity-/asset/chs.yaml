  \n## 引言\n\nLinux 作为一项爱好项目于 1991 年推出，已成为当今 IT 市场的主导力量。尽管技术上 Linux 指的是一个特定的软件部分（内核），但许多人将\
  \ Linux 指为构成稳健操作系统的软件工具集合。\n\nLinux 是整个 IT 行业中广泛使用的技术，由于其安全性、低成本和可扩展性，它被用作常见平台的替代方案。Linux\
  \ 操作系统驱动着各种服务器，包括电子邮件服务器和 Web 服务器。\n\n与任何操作系统一样，网络安全对于任何在 Linux 系统上工作的 IT 专业人员来说都是一个关注重点。由于\
  \ Linux 系统运行着大量的软件，并且有不同的版本（称为发行版），网络安全是一个涉及系统用户和系统管理员的复杂过程。\n\n\n\n\n\n遗憾的是，在 Linux\
  \ 的书籍和课程中，网络安全往往被忽视。通常，这些学习形式倾向于关注如何使用 Linux 系统，而网络安全往往只被顺带提及，或者被认为是针对经验极其丰富的专业人士的高级课题。这可能是因为这些书籍和课程的作者认为网络安全是一个很难学习的话题，但在讨论\
  \ Linux 时忽略这个主题是一个巨大的错误。\n\n为什么在学习 Linux 时，网络安全是一个如此重要的课题？原因之一是 Linux 是一个真正的多用户操作系统。这意味着即使是普通用户（终端用户）也需要如何保护自己的数据免受其他用户的侵害。\n\
  \n网络安全至关重要的另一个原因是，大多数 Linux 操作系统都提供了大量的网络服务，这些服务通常会暴露在互联网上。在保护个人 Linux 系统或整个组织的\
  \ Linux 系统时，必须考虑全球数百万人窥探的目光。\n\n我们写这本书的目标是为你提供 Linux 专业人员应该具备的技能。我们采用的方法是典型的“从底层开始”的方法法，但结合了独特的方法论，即始终关注安全性。在本书中，你将看到许多安全问题的引用。书中有整个章节专门介绍安全，并强调了创建安全策略。\n\
  \nLinux 是一个非常庞杂的话题，在一本书中完全涵盖它是不可能的。Linux 安全也是如此。我们尽力提供尽可能详尽细节，但也鼓励你自己探索，以学习更多关于书中介绍的每个话题。\n\
  \n感谢阅读，祝你的 Linux 网络安全之旅愉快。\n\n## 谁应该读这本书？\n\n回答“谁不应该读这本书？”这个问题可能更容易。Linux 发行版被各种类型的人使用，包括：\n\
  \n* 软件开发者\n*   数据库管理员\n*   网站管理员\n*   安全管理员\n*   系统管理员\n*   系统恢复专家\n*   “大数据”工程师\n\
  *   黑客\n*   政府机构\n*   移动用户和开发者（Android 是一个 Linux 发行版）\n*   芯片供应商（许多芯片设备上都有嵌入式 Linux）\n\
  *   数字取证专家\n*   教育者\n\n上面的列表甚至不是完整的列表！Linux 简直无处不在。它是 Android 手机使用的操作系统。大量的 Web\
  \ 和邮件服务器运行在 Linux 上。许多网络设备（如路由器和防火墙）都安装了嵌入式 Linux 版本。\n\n本书适用于那些想要更好地使用 Linux 系统，并确保他们所工作的\
  \ Linux 系统尽可能安全的人士。\n\n## 本书结构安排\n\n* **第 1 章：发行版与核心组件**深入探讨与理解 Linux 各部分相关的本质信息。你将学习\
  \ Linux 操作系统的不同组件，以及什么是发行版。你还学习了如何安装 Linux 操作系统。\n* **第 2 章：命令行命令行工作**涵盖了在 Linux\
  \ 环境中工作所需的必备命令。\n* **第 3 章：获取帮助**为你提供了获取 Linux 话题额外信息的方法。这包括操作系统原生提供的文档，以及重要的基于网络的资源。\n\
  * **第 4 章：编辑文件**侧重于你可以用于编辑文本文件的工具。编辑文本文件是 Linux 的一项关键任务，因为大部分配置数据都存储在文本文件中。\n* **第\
  \ 5 章：当出现问题时**回顾了如何处理 Linux 中可能出现的问题。本章提供了有关如何在 Linux 环境中排查系统问题的细节。\n* **第 6 章：管理组账户**关注组账户，包括如何添加、修改和删除组。特别关注了系统（或特殊）组，以及理解主组和要组的区别。\n\
  * **第 7 章：管理用户账户**涵盖了关于用户账户的细节。你将学习如何创建和保护这些账户，以及如何教用户在保护账户方面养成良好的安全习惯。\n* **第 8\
  \ 章：制定账户安全策略**为你提供了利用第 6 章和第 7 章获取的知识创建安全策略的方法。\n* **第 9 章：文件权限**关注使用 Linux 权限保护文件。本章还探讨了更高级的话题，如特殊权限、`umask`、访问控制列表\
  \ (ACLs) 和文件属性。\n* **第 10 章：管理本地存储：基础**涵盖与本地存储设备概念相关的话题。这包括如何创建分区和文件系统，以及一些额外的文件系统功能。\n\
  * **第 11 章：管理本地存储：高级功能**涵盖与本地存储设备相关的话题。这包括如何使用 `autofs` 和创建加密文件系统。你还学习了逻辑卷管理，这是管理本地存储的另一种方式。\n\
  * **第 12 章：管理网络存储**讨论了如何跨网络提供存储设备。还包括网络文件系统 (NFS)、Samba 和 iSCSI 等文件系统共享技术。\n* **第\
  \ 13 章：制定存储安全策略**为你提供了利用第 9-12 章获取的知识创建安全策略的方法。\n* **第 14 章：`crontab` 和 `at`**涵盖了两组工具，允许你在未来的某个时间自动执行进程。`crontab`\
  \ 系统允许用户按固定间隔执行程序，例如每月一次或每周两次。`at` 系统为用户提供了一种在未来某个特定时间执行程序的方法。\n* **第 15 章：脚本编写**涵盖了将\
