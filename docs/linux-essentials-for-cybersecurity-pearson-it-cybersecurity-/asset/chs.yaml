  \ `newkey.pem`（私钥文件），但你不再需要 `newreq.pem` 文件了，因为它仅仅是用于签名请求的。\n\n### 安全要点\n\n这些文件名是通用的；良好的做法是更改并将文件放在不同的位置。通常存储证书的两个位置是\
