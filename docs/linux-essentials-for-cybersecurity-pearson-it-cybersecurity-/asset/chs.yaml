  \ shell，只想在该系统上支持 BASH。或者你可能由于已经存在一个良好的 shell 而认为此软件包是不必要的。如果你正在考虑安装（这需要额外的 shell），请务必调查其影响和后果。\n\
  \n如果你认为这可能是很好的软件包，那么在批准之前，你还应该查看它提供的文件，特别是可执行程序（通常位于 `/bin`，但也可能位于 `/sbin` 或 `/usr/sbin`）：\n\
