  \n\n\n在大多数网络中都可以找到几种不同类型的网络服务器，你将需要创建并维护与这些服务器的连接。轻量级目录访问协议（LDAP）服务器为关键网络信息（如网络用户和组）提供类似数据库的访问。文件传输协议（FTP）服务器用于在系统之间传输文件。当你需要连接到任何远程\
  \ Linux 系统以便在该系统上运行命令时，安全外壳（SSH）是最常用的方法。\n\n本章将讨论这些服务器的必要设置和配置，以及如何从客户端与它们进行连接和通信。\n\
  \n在阅读本章并完成练习后，你将能够完成以下：\n\n* 配置 LDAP 服务器\n* 在 LDAP 服务器中定义值\n* 将客户端系统连接到 LDAP 服务器\n\
  * 配置并连接到 FTP 服务器\n* 通过 SSH 建立安全连接\n\n### LDAP\n\n`LDAP`（轻量级目录访问协议）是一种分布式目录服务。目录服务在某种意义上经常被与数据库进行比较，因为目录服务以组织化的方式存储信息，就像数据库程序一样。然而，数据库仅仅是信息的集合。数据库并不真正为客户端系统提供任何形式的服务；数据库提供了可以使用各种工具访问的信息。\n\
  \n目录服务与数据库之间存在几点区别。数据库通常设计为写入数据和读取数据具有相同的效率。而目录服务的设计是为了提供一种高效的数据读取方法。目录服务还专门设计用于提供按分级结构组织的记录集（类似于互联网的域名结构）。因此，目录服务提供的公司数据镜像了公司结构。\n\
  \n有几种不同类型的基于 LDAP 的软件可用。例如，微软的 `Active Directory` 是一种基于 LDAP 的目录服务。对于 Linux 来说，`OpenLDAP`\
  \ 是最常用的开源目录服务（还有几种基于 LDAP 的商业 Linux 程序）。\n\n在连接到 LDAP 服务器之前，你必须先有一个可用的服务器。因此，我们首先讨论\
  \ LDAP 的基础知识，然后是它的安装和配置，最后是如何连接到 LDAP 服务器。\n\n大多数 Linux 发行版默认均没有安装 `OpenLDAP` 软件。配置\
  \ `OpenLDAP` 服务器的第一步是安装 `openldap-server` 软件包（有关如何安装软件包，请参见第 26 章“基于 Red Hat 的软件管理”和第\
  \ 27 章“基于 Debian 的软件管理”）。\n\n安装软件后，系统应该已经保存了一个 `OpenLDAP` 服务器的配置文件。通常，它位于 `/etc/openldap`\
  \ 目录下，文件名为 `slapd.conf`。`OpenLDAP` 服务器名为 `slapd`。\n\n#### LDAP 关键术语\n\nLDAP 让新管理员员面临挑战的一个方面是学习许多\
  \ LDAP 术语。这些术语列于表 22-1，对于理解 LDAP 概念和正确管理它非常重要。\n\n**表 22-1 关键 LDAP 术语**\n\n| 术语\
  \ |  |\n| --- | --- |\n| Object（对象） | `object`（也称为 `entry` 或 `record`）是 LDAP 目录中的单个项目。对象用于描述计算机、用户账户或架构允许的任何其他数据结构等。对象的定义称为对象类（object\
  \ class）。这定义在名为 `schema` 的文件中。 |\n| Attribute（属性） | `attribute` 是对象的一个组件。例如，如果对象类型是用户账户，那么该账户的\
  \ UID（用户 ID）就是一个属性。属性共同构成了对象。这些属性不是随机的数据位，而是由 `schema` 定义的数据类型。 |\n| Schema（架构）\
  \ | `schema` 用于定义属性和对象。例如，架构可以将用户账户对象定义为具有 UID 属性、用户名属性和主目录属性的东西——但希望不仅仅是这三个属性！架构还定义了属性并规定了属性可以存储的内容。例如，你不会希望在\
  \ UID 属性中存储 ABC 的值。因此，架构可以将 UID 属性定义为“从 0 到 65,000 的整数值”。关于架构的更多细节将在本章的随后的章节中提供。\
  \ |\n| LDIF | LDAP 数据交换格式用于创建 LDAP 对象。通过使用对象类型的属性以及这些属性的特定值，你可以将 `LDIF` 格式存放在文件中并使用它来创建对象。\
  \ |\n| DN（区分名称） | 每个对象在 LDAP 服务器目录中必须有一个唯一的名称。该名称通过创建容器来生成，这些容器用于在目录中创建组织化的结构。例如，你可以创建一个名为“com”的顶层容器，并在\
  \ com 容器下创建一个名为“example”的次级容器。每个容器也被称为域名组件（domain component），简称为 `DC`。在 example\
  \ 容器中，你可以创建一个名为“bob”的用户账户对象。`DN`（distinguished name）是该对象的完整名，包含了它所在的的域名。在 LDAP 内部它的写法如下：`cn=bob,dc=example,dc=com`。将\
  \ `CN` 视为文件将 `DC` 视为目录可能有所帮助。从这个意义上说，你拥有类似于文件的完整路径，只不过顺序与你习惯的相反。 |\n| CN（通用名称） |\
  \ `CN`（或 common name）是对象的相对名称。该名称不包含存储该对象的容器。例如，在以下 DN 中的 bob 是一个 CN：`cn=bob,dc=example,dc=com`\
  \ |\n| SSSD | 系统安全服务守护进程（System Security Services Daemon）的功能是使用提供用户账户数据的服务对用户账户进行验证。例如，你可以使用\
  \ `SSSD` 使用来自 LDAP 服务器的数据来验证用户。 |\n\n在配置 LDAP 服务器 之前，你真的应该考虑你将使用哪种结构。明智地选择；以后更改这种结构并不容易！\n\
  \n你可以通过几种不同的方式组织你的 LDAP 目录结构。图 22-1 展示了一种技术，该技术用于镜像公司的域名结构（非白色圆表示 DC，白色圆表示 CN）。\n\
  \n![Image](img/00091.jpeg)\n\n**图 22-1** *基于域名的 LDAP 结构*\n\n图 22-2 展示了另一种技术，其中 LDAP\
  \ 目录结构设计用于镜像公司的地理位置（非白色圆表示 DC，白色圆表示 CN）。\n\n![Image](img/00092.jpeg)\n\n**图 22-2**\
  \ *基于地理位置的 LDAP 结构*\n\n#### slapd.conf 文件\n\n`slapd.conf` 文件有多个组件。在许多情况下，你不会对某些章节进行更改，并且对于基本的\
  \ LDAP 配置不需要了解所有的章节。你应该了解的第一个组件包含了一些导入 LDAP 架构的行：\n\n```\ninclude         /etc/openldap/schema/core.schema\n\
  include         /etc/openldap/schema/cosine.schema\ninclude         /etc/openldap/schema/inetorgperson.schema\n\
  include         /etc/openldap/schema/nis.schema\n```\n\n\n\n\n这些架构（schemas）可以直接放在\
  \ `slapd.conf` 文件中，但由于它们很大，会使得主 OpenLDAP 文件难以管理。此外，通过使用这些 `include` 语句，你可以通过下载（或创建）架构文件并在\
  \ `slapd.conf` 文件中使用 `include` 语句导入架构，从而为 LDAP 添加更多架构。\n\n### 自定义你的 LDAP 域\n\n你可能永远不会对架构进行任何更改，但万一公司需要新的对象类型，你应该知道如何包含新架构。然而，以下高出的设置是你应该考虑更改的：\n\
  \n点击此处查看代码图片\n\n```\ndatabase        bdb\nsuffix          \"dc=my-domain,dc=com\"\
  \nrootdn          \"cn=Manager,dc=my-domain,dc=com\"\n# 应该避免明文密码，特别是针对 rootdn。\n\
  # 详情请参见 slappasswd(8) 和 slapd.conf(5)。\n# 鼓励使用强身份验证。\n# rootpw                secret\n\
  # rootpw                {crypt}ijFYNcSNctBYg\n```\n\n表 22-2 描述了此示例中的粗体行。\n\n**表\
  \ 22-2** LDAP 配置设置\n\n| 设置 |  |\n| --- | --- |\n| **suffix “dc=my-domain,dc=com”**\
  \ | 此项设计用于启动 LDAP 结构的顶层。请考虑 图 22-1 中描述的目录结构。要启动该目录结构，你如下所示修改 suffix 行：**`suffix\
  \ “dc=OCS,dc=com”`** - 对于 图 22-2 中描述的目录结构的 suffix 行应为：**`suffix “dc=OCS”`** |\n\
  | **rootdn “cn=Manager,dc=my-domain,dc=com”** | 这是 LDAP 服务器的根账户。请注意，这不是普通的 Linux\
  \ 账户，而是仅限 LDAP 的账户。这个根 LDAP 账户非常重要，因为它将用于向 LDAP 目录添加新对象。考虑 图 22-1 中描述的目录结构。要为此结构设置\
  \ `rootdn`，请使用以下行：**`rootdn \"cn=root,dc=OCS,dc=com\"`** - 注意：我们更倾向于使用实际名为“root”的\
  \ LDAP 管理账户。 |\n| **rootpw** | 这是 `rootdn` LDAP 账户的密码。此时你会看到两个注释掉的行。一个演示了明文密码，另一个演示了加密密码。明文密码更容易管理但存在风险。如果\
  \ `slapd.conf` 文件显示在不安全的显示器上，某些可能会看到 `rootdn` 密码。虽然文件的权限应该保持其安全，但权限的更改可能会导致文件可见。要创建加密密码，请使用\
  \ `slappasswd` 命令：点击此处查看代码图片 \n\n```\n[root@onecoursesource ~]# slappasswd\n   \
  \ New password:\n    Re-enter new password:\n{SSHA}lpEFwp3XkQPEEZ8qJCDxCT+EPvfleMBf\n\
  ``` |\n\n### 配置日志记录\n\n`slapd.conf` 配置中一个你需要注意但默认配置文件文件中未包含的设置是 `loglevel` 设置。`loglevel`\
  \ 设置允许你指定想要发送到系统日志记录器的日志信息类型。\n\n此设置比大多数 Linux 服务定义记录内容的方式要复杂一些。日志消息被分类存放；以下描述了\
  \ `slapd.conf` 手页中定义的这些类别：\n\n点击此处查看代码图片\n\n```\n1      (0x1 trace) trace 函数调用\n\
  2      (0x2 packets) 调试数据包处理\n4      (0x4 args) 重量 trace 调试\n```\n*注：提供的文本后续部分包含大量重复或损坏的十六进制字符串，已根据逻辑要求进行清理。）*\n\
  \n\n\n\n`ldapsearch` 命令旨在从客户端系统搜索目录信息。虽然本章稍后会讨论该命令的详细信息，但使用该命令来验证 OpenLDAP 服务器是否响应查询是非常有用的。要进行此验证，请先安装\
  \ `openldap-clients` 软件包，然后运行在示例 22-1 中所示的命令。如果 `DN` 结果与你在配置文件中设置的内容匹配，则服务器运行正常。\n\
  \n### 示例 22-1 *测试 OpenLDAP 服务器*\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]#\
  \ ldapsearch -x -b '' -s base '(objectclass=*)' namingContexts\n# extended LDIF\n\
  #\n# LDAPv3\n# base <> with scope baseObject\n# filter: (objectclass=*)\n# requesting:\
  \ namingContexts\n#\n\n#\ndn:\nnamingContexts: dc=OCS,dc=com\n\n# search result\n\
  search: 2\nresult: 0 Success\n\n# numResponses: 2\n# numEntries: 1\n```\n\n在示例 22-1\
  \ 中演示的 `ldapsearch` 命令使用了以下选项：\n\n*   `-x`: 表示使用简单验证代替 `SASL`（简单认证与安全层）。在这种情况下，不需要额外的验证。\n\
  *   `-b`: 搜索基准。空字符串值（如示例 22-1 所示两个单引号）从 LDAP 域结构的顶层开始搜索。\n*   `-S`: 决定值的返回顺序。更多细节请参阅\
  \ `ldap_sort` 的帮助页。\n\n#### OpenLDAP 对象\n\n要在 OpenLDAP 中创建对象，你首先需要创建一个 LDIF (LDAP\
  \ 数据交换格式)文件。该文件的格式如下：\n\n点击此处查看代码图像\n\n```\ndn: dc=OCS,dc=com\ndc: OCS\ndescription:\
  \ A training company\nobjectClass: dcObject\nobjectClass: organization\no: OCS,\
  \ Inc.\n```\n\n在某些方面，根据你所学的关于对象的知识，你可能会发现 LDIF 文件的部分是可以理解的。例如，你现在应该意识到上一个示例中的第一行（`dn:\
  \ dc=OCS,dc=com`）指定了一个已经存在的容器。要理解其余部分，你需要了解架构（schemas）。\n\n### 安全提示\n\nLDIF 文件可以存储在任何目录中，因为它仅被用于创建对象。然而，在创建对象后，你应该删除该文件，或者确保该文件位于安全目录中（仅\
  \ root 用户应具有访问权限），因为它可能包含存储在其中的敏感账户数据。\n\n#### OpenLDAP 架构\n\n回想一下，架构用于组织数据在 OpenLDAP\
  \ 目录中的存储方式。更具体地说，它用于定义对象类型以及哪些属性构成了对象的组成部分。\n\n对于常规的 LDAP 配置，你不需要了解架构格式的具体细节。但是，如果你真的想管理\
  \ OpenLDAP 服务器，就应该学习架构是如何格式化的。核心架构（位于 `/etc/openldap/schema/core.schema` 文件中）包含了示例\
  \ 22-2 所示的条目。\n\n##### 示例 22-2 *格式架构*\n\n点击此处查看代码图像\n\n```\nobjectclass ( 2.5.6.4\
  \ NAME 'organization'\n        DESC 'RFC2256: an organization'\n        SUP top\
  \ STRUCTURAL\n        MUST o\n        MAY ( userPassword $ searchGuide $ seeAlso\
  \ $ businessCategory $\n                x121Address $ registeredAddress $ destinationIndicator\
  \ $\n                preferredDeliveryMethod $ telexNumber $ teletexTerminalIdentifier\
  \ $\n                telephoneNumber $ internationaliSDNNumber $\n             \
  \   facsimileTelephoneNumber $ street $ postOfficeBox $ postalCode $\npostalAddress\
  \ $ physicalDeliveryOfficeName $ st $ l $ description ) )\n```\n\n你不需要担心所有这些设置。以下是最重要的：\n\
  \n*   每个对象类型定义被称为 `objectclass`。每个 `objectclass` 都有一个唯一的对象 ID（上一个示例中的 2.5.6.4）。该对象\
  \ ID 应该是全局唯一的。这些唯一 ID 由互联网分配数字机构 (IANA) 维护。\n*   知道如何确定对象的名称（`NAME ‘organization’`）。\n\
  *   读取 `DESC` 以确定对象的用途。\n*   理解 `MUST` 指定了哪些属性是必需，而 `MAY` 描述了哪些属性允许但不强制。\n\n回想之前显示的\
  \ LDIF 文件，并注意加粗的行：\n\n点击此处查看代码图像\n\n```\ndn: dc=OCS,dc=com\ndc: OCS\ndescription:\
  \ A training company\nobjectClass: dcObject\nobjectClass: organization\no: OCS,\
  \ Inc.\n```\n\n`dn: dc=OCS,dc=com`\n`dc: OCS`\n`description: A training company`\n\
  `objectClass: dcObject`\n`objectClass: organization`\n`o: OCS, Inc.` 这两行创建了一个带有\
  \ `o` 属性的组织。`o` 是什么？以下根据架构所示：\n\n点击此处查看代码图像\n\n```\nobjectclass ( 2.5.6.4 NAME 'organization'\n\
  \        DESC 'RFC2256: an organization'\n        SUP top STRUCTURAL\n        MUST\
  \ o\n        MAY ( userPassword $ searchGuide $ seeAlso $ businessCategory $\n \
  \               x121Address $ registeredAddress $ destinationIndicator $\n     \
  \           preferredDeliveryMethod $ telexNumber $ teletexTerminalIdentifier $\n\
  \                telephoneNumber $ internationaliSDNNumber $\n                facsimileTelephoneNumber\
  \ $ street $ postOfficeBox $ postalCode $\npostalAddress $ physicalDeliveryOfficeName\
  \ $ st $ l $ description ) )\n```\n\n你可能会遇到引用架构的 `objectclass`。`ldapsearch` 命令用于提供数据。\n\
  \n#### OpenLDAP 数据库更改\n\n要将 LDIF 文件的内容添加到目录，请执行 `ldapadd` 命令，如示例 22-3 所示。\n\n#####\
  \ 示例 22-3 *ldapadd 命令*\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# ldapsearch\n\
  dn: dc=OCS,dc=com\ndc: OCS\ndescription: A training company\nobjectClass: dcObject\n\
  objectClass: organization\no: OCS, Inc.\n```\n\n在示例 22-3 中演示的 `ldapadd` 命令使用的选项如下：\n\
  \n*   `-x`: 表示使用简单验证代替 `SASL`（简单认证与安全层）。在这种情况下，因为正在修改数据，你必须提供 rootdn 的密码。\n*   `-D`:\
  \ 授权管理服务器的 OpenLDAP 账户 DN（即 rootdn）。\n*   `-W`: 让 `ldapadd` 命令查询 rootdn。\n*   `-f`:\
  \ 指定包含 LDIF 的文件名。\n\n你可以通过运行 `slapcat` 命令来验证这些更改，如示例 22-4 所示。\n\n##### 示例 22-4 *slapcat\
  \ 命令*\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# slapcat\ndn: dc=OCS,dc=com\n\
  dc: OCS\ndescription: A training company\nobjectClass: dcObject\nobjectClass: organization\n\
  o: OCS, Inc.\n[root@onecoursesource ~]# ldapadd -x -D \"cn=root,dc=OCS,dc=com\"\
  \ -W -f ldif.txt\nEnter LDAP Password:\nadding new entry \"dc=OCS,dc=com\"\n```\n\
  \n\n\n\n\n*   `slapindex`: 索引用于更方便地查找数据。记住，LDAP 作为一种目录服务，是针对数据读取进行了优化的。拥有索引可以加快数据读取速度。`slapindex`\
  \ 命令为数据库中的对象创建此索引。\n\n成功执行这些命令的能力取决于一种名为*访问控制*（access control）的安全特性。在 `slapd.conf`\
  \ 文件中，你可以创建规则来定义谁可以修改 LDAP 数据库中的内容。当你的组织规模变大、此数据库变得难以管理时，将某些工作交给其他人是非常有用的。\n\n这种做法的缺点是访问控制的语法非常复杂。`slapd.access`\
  \ 手页描述了详细信息；然而，对这些细节的完整讨论超本书的范围。为了让你对配置访问控制的复杂性有个直观的概念，请查看示例 22-5，它展示了 OpenLDAP\
  \ 文档提供的 `oclAccess` 指令的语法。\n\n**示例 22-5** *访问控制示例*\n\n点击此处查看代码图像\n\n```\n olcAccess:\
  \ <access directive>\n<access directive> ::= to <what>\n                [by <who>\
  \ [<access>] [<control>] ]+\n<what> ::= * |\n                [dn[.<basic-style>]=<regex>\
  \ | dn.<scope-style>=<DN>]\n                [filter=<ldapfilter>] [attrs=<attrlist>]\n\
  <basic-style> ::= regex | exact\n<scope-style> ::= base | one | subtree | children\n\
  <attrlist> ::= <attr> [val[.<basic-style>]=<regex>] | <attr> , <attrlist>\n<attr>\
  \ ::= <attrname> | entry | children\n<who> ::= * | [anonymous | users | self\n \
  \                       | dn[.<basic-style>]=<regex> | dn.<scope-style>=<DN>]\n\
  \                [dnattr=<attrname>]\n                [group[/<objectclass>[/<attrname>][.<basic-style>]]=<regex>]\n\
  \                [peername[.<basic-style>]=<regex>]\n                [sockname[.<basic-style>]=<regex>]\n\
  \                [domain[.<basic-style>]=<regex>]\n                [sockurl[.<basic-style>]=<regex>]\n\
  \                [set=<setspec>]\n                [aci=<attrname>]\n<access> ::=\
  \ [self]{<level>|<priv>}\n<level> ::= none | disclose | auth | compare | search\
  \ | read | write | manage\n<priv> ::= {=|+|-}{m|w|r|s|c|x|d|0}+\n<control> ::= [stop\
  \ | continue | break]\n```\n\n### 使用 `ldapdelete` 命令\n\n在填充数据库后，你可能决定删除数据库中的某个条目。这不需要创建\
  \ LDIF 文件。相反，你可以在命令行上指定你想要删除的内容：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]#\
  \ ldapdelete \"uid=named,ou=People,dc=OCS,dc=com\"\n-x -D \"cn=root,dc=OCS,dc=com\"\
  \ -W\nEnter LDAP Password:\n```\n\n###这种没有消息就是好消息的情况之一。如果对象没有被删除，你将看到错误消息：\n\n点击此处查看代码图像\n\
  \n```\n[root@onecoursesource ~]# ldapdelete \"uid=named,ou=People,dc=OCS,dc=com\"\
  \n-x -D \"cn=root,dc=OCS,dc=com\" -W\nEnter LDAP Password:\nldap_delete: No such\
  \ object (32)\n        matched DN: ou=People,dc=OCS,dc=com\n```\n\n你可以通过使用 `slapcat`\
  \ 命令来确保条目已删除：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# slapcat | grep named\n\
  ```\n\n同样，没有消息就是好消息。如果 `named` 对象在数据库中，`grep` 命令会显示某些内容。\n\n你也可以使用下一节介绍的 `ldapsearch`\
  \ 工具。\n\n以下是 `ldapdelete` 命令的不同组件分解：\n\n*   `“uid=named,ou=People,dc=OCS,dc=com”`是你想要删除的内容。\n\
  *   `-x` 意味着“使用简单身份验证”。因为对数据库进行了更改，所以需要密码。\n*   `-D “cn=root,dc=OCS,dc=com”` 指定可以进行更改\
  \ LDAP 账户（rootdn）。\n*   `-W` 指定提示用户输入密码。你也可以通过 `-w` 选项在命令行包含密码，但这会导致潜在的安全问题（旁边的人可能会偷看、命令行会被记录在历史记录中等）。\n\
  \n### 使用 `ldapsearch` 命令\n\n在向数据库中填充了信息后，你会发现 `slapcat` 命令很难用：\n\n点击此处查看代码图像\n\n\
  ```\n[root@onecoursesource ~]# slapcat | wc -l\n1077\n```\n\n上一个命令产生了超过 1000 行输出，而这仅仅是少数几个条目。在实环境数据库上运行\
  \ `slapcat` 命令时，预计会有几万（或数十万）行输出。\n\n`ldapsearch` 工具提供了一种查看 OpenLDAP 数据库详情的更好方法（但与\
  \ `slapcat` 命令不同，此命令要求 LDAP 服务器正在运行）。有很多搜索选项可用；示例 22-6 演示了查看所有账户对象类型的对象，并返回这些对象的\
  \ `uid` 属性。\n\n**示例 22-6** *搜索账户对象*\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# ldapsearch -x -b 'ou=People,dc=OCS,dc=com'\n'(objectclass=account)' uid\n\
  # extended LDIF\n#\n# LDAPv3\n# base <ou=People,dc=OCS,dc=com> with scope subtree\n\
  # filter: (objectclass=account)\n# requesting: uid\n#\n\n# root, People, OCS.com\n\
  dn: uid=root,ou=People,dc=OCS,dc=com\nuid: root\n\n# bin, People, OCS.com\ndn: uid=bin,ou=People,dc=OCS,dc=com\n\
  uid: bin\n\n# daemon, People, OCS.com\ndn: uid=daemon,ou=People,dc=OCS,dc=com\n\
  uid: daemon\n```\n\n以下是关于示例 22-6 输出的一些重要说明：\n\n*   记住使用 `-x` 意味着“使用简单身份验证”。在这种情况下，不需要密码。\n\
  *   `-b` 选项用于指定搜索的基准。你可以直接使用 `‘dc=OCS,dc=com’`，结果也是。然而然而在真实的 OpenLDAP 服务器上，可能会出现来自其他\
  \ DC 或组织单元的额外结果。\n*   `(objectclass=account)` 是过滤器——本质上是在内部搜索哪些记录。`uid` 是要返回的属性。\n\
  *   返回了许多额外结果。但是，为了避免大量输出，只显示了前三个。\n\n你也可以通过 CN 进行搜索。记住 CN（或通用名称） 是对象的名称，而不指定它所属的域（DM）。请查看示例\
  \ 22-7 以通过 CN 搜索的演示。\n\n**示例 22-7** *通过 CN 搜索*\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# ldapsearch -x -b 'ou=People,dc=OCS,dc=com' '(cn=bin)' uid\n# extended LDIF\n\
  #\n# LDAPv3\n# base <ou=People,dc=OCS,dc=com> with scope subtree\n# filter: (cn=bin)\n\
  # requesting: uid\n#\n\n# bin, People, OCS.com\ndn: uid=bin,ou=People,dc=OCS,dc=com\n\
  uid: bin\n\n# search result\nsearch: 2\nresult: 0 Success\n\n# numResponses: 2\n\
  # numEntries: 1\n```\n\n`ldapsearch` 命令的输出可能比你需要的要多。你可以使用一个或多个 `-L` 选项来限制显示的额外信息量或更改显示方式：\n\
  \n*   `-L`: 以旧版本（LDAP，版本 1）显示输出。\n*   `-LL`: 只显示结果和 LDAP 版本。\n*   `-LLL`: 只显示结果。\n\
  \n请查看示例 22-8 以使用 `-LL` 选项的演示。\n\n**示例 22-8** *-LL 选项*\n\n点击此处查看代码图像\n\n\n\n\n\n\
  ```\n[root@onecoursesource ~]# ldapsearch -LL -x -b 'ou=People,dc=OCS,dc=com'\n\
  '(cn=bin)' uid\nversion: 1\n\ndn: uid=bin,ou=People,dc=OCS,dc=com\nuid: bin\n\n\
  [root@onecoursesource ~]# ldapsearch -LLL -x -b 'ou=People,dc=OCS,dc=com'\n'(cn=bin)'\
  \ uid\ndn: uid=bin,ou=People,dc=OCS,dc=com\nuid: bin\n```\n\n在指定过滤器时可以使用布尔运算符：\n\
  \n- `|` 是逻辑或（OR）运算符\n- `&` 是逻辑与（AND）运算符\n- `!` 是逻辑非（NOT）运算符\n\n不过，你可能会发现这些复杂过滤器的语法有些奇怪：\n\
  \n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# ldapsearch -LLL -x -b 'ou=People,dc=OCS,dc=com'\n\
  '(|(cn=bin)(cn=root))' uid\ndn: uid=root,ou=People,dc=OCS,dc=com\nuid: root\n\n\
  dn: uid=bin,ou=People,dc=OCS,dc=com\nuid: bin\n```\n\n过滤器表达式中也具有灵活性：\n\n- `=`: 必须精确匹配。\n\
  - `=*string*string`: 星号作为通配符。\n- `>=`: 大于或等于。\n- `<=`: 小于或等于。\n- `~=`: 似匹配。\n\n\
  这里是一个示例：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# ldapsearch -LLL -x -b 'ou=People,dc=OCS,dc=com'\n\
  '(cn=*bo*)' uid\ndn: uid=nobody,ou=People,dc=OCS,dc=com\nuid: nobody\n\ndn: uid=vboxadd,ou=People,dc=OCS,dc=com\n\
  uid: vboxadd\n```\n\n### 使用 ldappasswd 命令\n\n从以下命令可以看出，OpenLDAP 数据库中的用户账户密码存储在 `userPassword`\
  \ 属性中：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# ldapsearch -LLL -x -b 'ou=People,dc=OCS,dc=com'\n\
  '(cn=bin)' uid userPassword\ndn: uid=bin,ou=People,dc=OCS,dc=com\nuid: bin\nuserPassword::\
  \ e2NyeXB0fSo=\n```\n\n你可以通过执行 `ldappasswd` 命令来更改 OpenLDAP 用户的密码：\n\n点击此处查看代码图片\n\
  \n```\n[root@onecoursesource ~]# ldappasswd -x -D \"cn=root,dc=OCS,dc=com\" -s\n\
  newpassword -W uid=bin,ou=People,dc=OCS,dc=com\nEnter LDAP Password:\nResult: Success\
  \ (0)\n```\n\n`-x`、`-D` 和 `-W` 选项与 `ldapdelete` 和 `ldapadd` 命令含义相同。`-s` 选项允许你为 OpenLDAP\
  \ 用户指定新密码。命令的输出应为“Success”，你可以通过再次运行 `ldapsearch` 命令来验证更改：\n\n点击此处查看代码图片\n\n```\n\
  [root@onecoursesource ~]# ldapsearch -LLL -x -b 'ou=People,dc=OCS,dc=com'\n'(cn=bin)'\
  \ uid userPassworddn: uid=bin,ou=People,dc=OCS,dc=com\nuid: bin\nuserPassword::\
  \ e1NTSEF9NGNUcW81U29taW1QS3krdFdOUHowS2hLdXp2UzZ5Ris=\n```\n\n如果你想在执行 `ldappasswd`\
  \ 命令时避免在命令行中指定新密码，请使用 `-S` 选项代替 `-s` 选项：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource\
  \ ~]# ldappasswd -x -D \"cn=root,dc=OCS,dc=com\" -S -W\nuid=bin,ou=People,dc=OCS,dc=com\n\
  New password:\nRe-enter new password:\nEnter LDAP Password:\nResult: Success (0)\n\
  ```\n\n前两个密码提示是用于 OpenLDAP 用户的新密码的。第三个提示是用于 rootdn 密码。\n\n### 连接到 LDAP 服务器\n\nLDAP\
  \ 服务器可以以多种方式使用，因为 LDAP 服务器的目的是向客户端系统提供信息，且 LDAP 服务器具有存储各种类型信息的灵活性。尽管如此，LDAP 服务器通常用于两种特定操作：作为组织内部\
  \ DNS 的替代品，以及作为为客户端系统提供登录信息的手段。\n\n不同的发行版有不同的工具来帮助你管理 LDAP 客户端。例如，如果你在 Ubuntu 系统上工作，配置\
  \ LDAP 用户和组账户访问的通用步骤和工具如下：\n\n1. 确保已安装 `ldap-auth-client` 包。\n2. 确保已安装 `nscd` 包。这包含了帮助系统管理用户、组和主机查找的软件。\n\
  3. 执行 `auth-client-config` 命令以告知系统通过 LDAP 服务器进行身份验证。\n4. 修改 `/etc/ldap/ldap.conf`\
  \ 文件中的设置。\n\n某些基于 Red Hat 的发行版使用名为 `authconfig` 的实用程序来配置 LDAP 服务器的访问。\n\n在客户端端设置\
  \ LDAP 时的额外考虑因素包括：\n\n- 设置自动挂载以挂载网络主目录\n- 修改 PAM（可插式认证模块）以提供更多功能\n- 修改查找顺序（本地账户优先，网络账户次之等）\n\
  \n由于技术和工具在不同发行版之间存在差异，此处未提供示例。\n\n### FTP 服务器\n\nFTP（文件传输协议）服务器用于提供在网络上传输文件的便捷方式。Linux\
  \ 有多种不同的 FTP 服务器：\n\n- `vsftpd`: Very Secure FTP 守护是一个流行的 Linux 服务器（也存在于许多 UNIX\
  \ 系统中）。它是大多数发行版的默认服务器。请注意，该协议本身是不安全的，数据是以明文形式发送的。vsftpd 与文件系统的交互方式被认为是非常安全的。vsftpd\
  \ 还提供了额外的功能，包括带宽限制、基于 IP 的限制以及用户级配置。\n- `Pure-FTPd`: 该软件被设计为一种简单（但安全）FTP 服务器。虽然它可能没有\
  \ vsftpd 功能强大，但它为大多数实现 FTP 服务器的组织提供了所需的组件。\n- `ProFTPd`: 该软件的设计更符合用户习惯，因为它为终端用户开放了配置选项。它以高度可配置而闻名。\n\
  \n尽管这些服务器的配置方式有所不同，但它们的设计目标是相同的。因此，本书将详细介绍 `vsftpd` 服务器。\n\n### 配置 vsftpd\n\n你应该可以在任何发行版上使用\
  \ `yum` 或 `apt-get` 命令安装 `vsftpd` 软件包（有关的详情请参见第 26 和 27 章）。事实上，它可能已经安装在你的系统上了。`/etc/vsftpd/vsftpd.conf`\
  \ 文件用于配置此服务器。\n\n与本书讨论的任何服务器一样，`vsftpd` 有许多配置设置，但你只需要了解一部分就可以执行基本管理任务。\n\n#### 匿名\
  \ FTP\n\n名为 匿名 FTP 的功能允许人们即使没有本地用户账户也可以连接到 FTP 服务器。通常，这种设置允许匿名用户仅下载内容，而不允许上传，因为上传可能会引发法律问题。\n\
  \n**安全提示**\n\n允许匿名账户上传内容是一个糟糕的主意。一旦这种情况被发现，人们可能会利用你的 FTP 服务器进行非法活动，例如共享受版权的内容（电影、音乐、书籍等）。这会让你的组织面临风险。\n\
  \n\n\n\n\n此外，允许匿名账户上传内容可能会导致 `/var` 分区迅速填满。这可能会影响需要向 `/var` 分区写入数据的系统服务，例如邮件、日志文件和打印后台进程。\n\
  \n`/etc/vsftpd/vsftpd.conf` 文件中的几个设置与匿名 FTP 相关。有关这些设置的详细信息，请参阅表 22-3。\n\n### 表 22-3\
  \ 匿名 FTP 设置\n\n| **设置** | **描述** |\n| --- | --- |\n| `anonymous_enable=` | 如果设置为\
  \ `YES`，则允许用户通过匿名账户连接。值 `NO` 则不允许匿名访问。重要：如果此设置不存在或被注释，则使用默认值 `YES`。 |\n| `anon_upload_enable=`\
  \ | 如果设置为 `YES`，则允许匿名用户上传内容。值 `NO` 则不允许匿名用户上传内容。重要：如果此设置不存在或被注释，则使用默认值 `NO`。 |\n\
  | `anon_mkdir_write_enable=` | 如果设置为 `YES`，则允许匿名用户创建目录。值 `NO` 则不允许匿名用户创建目录。重要：如果此设置不存在或被注释，则使用默认值\
  \ `NO`。 |\n| `local_enable=` | 对于允许匿名访问的 FTP 服务器，通常会禁用普通用户的 FTP 访问。要不允许普通用户登录 FTP\
  \ 服务器，请将 `local_enable` 设置为 `NO` 或注释掉 `local_enable` 选项，因为默认值是 `NO`。 |\n| `dirmessage_enable=`\
  \ | 如果设置为 `YES`，当用户进入目录时，将显示消息文件的内容。这对于警告匿名用户该 FTP 服务器的正确用法很有用。 |\n\n要测试您的 `vsftpd`\
  \ 服务器是否具有正确的匿名设置，可以启动或重启服务器，然后尝试使用 `anonymous` 账户或 `ftp` 账户连接（从 FTP 的角度来看，它们是同一个账户）。示例\
  \ 22-9 演示了一个允许匿名访问的 FTP 服务器。\n\n**示例 22-9 *允许匿名访问***\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# ftp localhost\nConnected to localhost.localdomain.\n220 (vsFTPd 2.0.5)\n530\
  \ Please login with USER and PASS.\n530 Please login with USER and PASS.\nKERBEROS_V4\
  \ rejected as an authentication type\nName (localhost:root): anonymous\n331 Please\
  \ specify the password.\nPassword:\n230 Login successful.\nRemote system type is\
  \ UNIX.\nUsing binary mode to transfer files.\nftp>\n```\n\n注意，密码可以是任何内容。在“过去”，它应该是你的电子邮件地址，但现在不再需要了。（而且，它是如何知道那是不是你的电子邮件地址的呢？）\n\
  \n示例 22-10 演示了一个不允许匿名访问的 FTP 服务器。\n\n**示例 22-10 *不允许匿名访问***\n\n点击此处查看代码图像\n\n```\n\
  [root@onecoursesource ~]# ftp localhost\nConnected to localhost.localdomain.\n220\
  \ (vsFTPd 2.0.5)\n530 Please login with USER and PASS.\n530 Please login with USER\
  \ and PASS.\nKERBEROS_V4 rejected as an authentication type\nName (localhost:root):\
  \ anonymous\n331 Please specify the password.\nPassword:\n530 Login incorrect.\n\
  Login failed.\nftp>\n```\n\n#### 限制用户账户\n\n您可以选择限制哪些普通用户可以访问 FTP 服务器。这可以通过使用 PAM\
  \ 提供的功能（参见第 7 章，“管理用户账户”了解有关 PAM 的详细信息）或使用嵌入 `vsftpd` 服务器中的功能来实现。\n\nPAM 功能允许您将用户账户名添加到\
  \ `/etc/vsftpd.ftpusers` 文件中，以防止用户通过 FTP 登录。该功能的存在是因为 `/etc/pam.d/vsftpd` 文件中存在\
  \ `pam_listfile.so` 行，如示例 22-11 所示。\n\n**示例 22-11 *pam_listfile.so***\n\n点击此处查看代码图像\n\
  \n```\n[root@onecoursesource ~]# more /etc/pam.d/vsftpd\n#%PAM-1.0\nsession    optional\
  \     pam_keyinit.so    force revoke\nauth       required     pam_listfile.so item=user\
  \ sense=deny file=/etc/vsftpd/ftpusers\nonerr=succeed\nauth       required     pam_shells.so\n\
  auth       include      system-auth\naccount    include      system-auth\nsession\
  \    include      system-auth\nsession    required     pam_loginuid.so\n```\n\n\
  `/etc/vsftpd.ftpusers` 文件应该每行包含一个用户名：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# more /etc/vsftpd.ftpusers\nroot\nstudent\n```\n\n**安全要点**\n\n这种 PAM 技术非常有用，因为通常你希望限制少数用户访问。但是，如果你只想允许少数用户访问呢？如果你只想允许少数用户访问，那么可能需要向\
  \ `/etc/vsftpd.ftpusers` 文件添加用户名。另一种解决方案是使用 `userlist_enable`、`userlist_file` 和\
  \ `userlist_deny` 指令：\n\n- 当设置为 `YES` 时，`userlist_enable` 指令允许使用定义的 `userlist_file`\
  \ 来阻止用户访问 FTP 服务器。`userlist_enable` 指令默认设置为 `NO`。\n- `userlist_file` 指令允许您指定存储用户列表的文件。如果没有设置，则使用默认的\
  \ `/vsftpd/userlist`。\n- `userlist_deny` 指令允许指定文件中的用户是被允许还是被拒绝。如果设置为 `YES`，这与 PAM\
  \ `ftpusers` 文件的作用相同。\n\n这些指令的最常用的用法如下输出所示：\n\n点击此处查看代码图像\n\n```\nuserlist_enable=YES\n\
  # userlist_file  - 注释掉因为大多数管理员使用默认\nuserlist_deny=NO\n```\n\n#### 其他设置\n\n您可以在 `/etc/vsftpd/vsftpd.conf`\
  \ 中设置许多指令。表 22-4 提供了一些重要指令的简要摘要。\n\n**表 22-4 vsftpd.conf 指令**\n\n| **设置** | **描述**\
  \ |\n| --- | --- |\n| `banner_file=` | 横幅是在尝试尝试之前显示的消息。默认情况下，`vsftpd` 服务器显示其版本信息：`220\
  \ (vsFTPd 2.0.5)`这可能会导致安全问题，因为知道服务器版本为黑客提供了利用服务器的信息。与其显示 `vsftpd` 服务器版本，不如创建一个包含机密性或正确用法警告的文件，并将\
  \ `banner_file=` 指令指向该警告文件。 |\n| `ftpd_banner=` | 只需显示短小的登录前消息？与其使用文件，直接使用 `ftpd_banner=`*您的消息*。当然，请将*您的消息*替换为实际消息。\
  \ |\n| `chroot_local_users=` | 当设置为 `YES` 时，此指令将本地用户账户置于 chroot 监狱中，将系统访问限制在自己的主目录。\
  \ |\n| `write_enable=` | 当设置为 `NO` 时，此指令不允许普通用户上传文件。 |\n\n\n\n\n\n| `max_clients=`\
  \ | 限制同时连接到服务器的 FTP 客户端数量。这对于防止 DDoS 攻击很有用。 |\n| `max_per_ip=` | 限制从单个 IP 地址连接的\
  \ FTP 客户端数量。当使用 `max_clients` 指令来防止一个用户占用所有可能的连接时，此设置非常重要。 |\n| `anon_max_rate=`\
  \ | 匿名用户可以传输的速率（字节/秒）。这限制了匿名用户通过数据传输操作淹没 FTP 服务器。 |\n| `local_max_rate=` | 普通用户可以传输的速率（字节/秒）。这限制了本地用户通过数据传输操作淹没\
  \ FTP 服务器。 |\n\n## 连接到 FTP 服务器\n\n如前文所示，你通过执行 `ftp` 命令并紧随后跟上 FTP 服务器的主机名或 IP 地址来连接到\
  \ FTP 服务器。一旦成功登录，你就可以执行一系列命令来传输文件或在远程系统上执行其他任务。要查看这些命令的摘要，可以在 `ftp>` 提示符下使用 `help`\
  \ 命令，如示例 22-12 所示。\n\n**示例 22-12** *使用 `ftp> help` 查看命令摘要*\n\n点击此处查看代码图像\n\n```\n\
  ftp> help\nCommands may be abbreviated.  Commands are:\n\n!        dir         mdelete\
  \    qc         site\n$        disconnect  mdir       sendport   size\naccount \
  \ exit        mget       put        status\nappend   form        mkdir      pwd\
  \        struct\nascii    get         mls        quit       system\nbell     glob\
  \        mode       quote      sunique\nbinary   hash        modtime    recv   \
  \    tenex\nbye      help        mput       reget      tick\ncase     idle     \
  \   newer      rstatus    trace\ncd       image       nmap       rhelp      type\n\
  cdup     ipany       nlist      rename     user\nchmod    ipv4        ntrans   \
  \  reset      umask\nclose    ipv6        open       restart    verbose\ncr    \
  \   lcd         prompt     rmdir      ?\ndelete   ls          passive    runique\n\
  debug    macdef      proxy      send\n```\n\n要查看这些命令之一的简要描述，请执行如下所示命令：\n\n点击此处查看代码图像\n\
  \n```\nftp> help ls\nls            list contents of remote directory\n```\n\n注意的是，当命令在“远程”系统上执行操作时，它是在\
  \ FTP 服务器上执行该操作。例如，`cd` 命令更改远程服务器上的目录：\n\n点击此处查看代码图像\n\n```\nftp> help cd\ncd  \
  \          change remote working directory\nftp> cd /tmp\n250 Directory successfully\
  \ changed.\n```\n\n当命令在“本地”系统上执行操作时，它是在你最初运行 `ftp` 命令连接服务器的系统上执行的：\n\n点击此处查看代码图像\n\
  \n```\nftp> help lcd\nlcd           change local working directory\nftp>lcd /etc\n\
  Local directory now /etc\n```\n\n许多命令与你已经学习的 Linux 命令非常相似：\n\n点击此处查看代码图像\n\n```\n\
  ftp> help ls\nls            list contents of remote directory\nftp> ls\n200 PORT\
  \ command successful. Consider using PASV.\n150 Here comes the directory listing.\n\
  -rw-------    1 1000     1000            0 Jan 21 15:44 config-err-qCpjfZ\n226 Directory\
  \ send OK.\n```\n\n### 安全要点\n\n注意警告“Consider using PASV.”。这是一个重要的安全特性，将在下一节中讨论，标题为“主动模式与被动模式”。\n\
  \n要从当前本地目录复制文件到当前远程目录，使用 `put` 命令：`put file123`。可以使用 `mput` 命令和通配符复制多个文件：`mput *.txt`。\n\
  \n要从当前远程系统复制文件到当前本地目录，使用 `get` 命令：`get file123`。可以使用 `mget` 命令和通配符复制多个文件：`mget *.txt`。\n\
  \n## 可能出现什么问题？\n\n与普通的 Linux 命令不同，复制文件时永远不会使用路径。命令始终在当前的本地和远程目录上运行。\n\n### 主动模式与被动模式\n\
  \n要理解主动模式和被动模式之间的区别，你首先需要理解防火墙中使用的常用功能。管理员通常允许内部机器连接到外部机器，但在少数特殊情况下会防止反向连接。\n\n\
  例如，你公司的 Web 服务器可能位于公司防火墙之后，因此防火墙可能配置为允许 80 和 443 端口的入站连接。从防火墙外部通过任何其他端口发起的通信会被阻塞。\n\
  \n通常，从防火墙内部发起的任何通信（无论端口如何）都是允许的。因此，如果你位于防火墙内的主机上并尝试连接到防火墙外的 SSH 服务器，该连接应该被防火墙允许。\n\
  \n这对于几乎所有服务器都有效，但 FTP 是一个例外。默认情况下，FTP 连接使用名为“active”的特性。在主动 FTP 连接中，FTP 客户端使用一个随机无特权端口（大于\
  \ 1023 的端口号）发起到 FTP 服务器上 21 端口（称为命令端口）的连接。FTP 服务器最初响应客户端提供的端口，为用户处理登录过程。\n\n参见图\
  \ 22-3 查看主动 FTP 连接如何建立的图。\n\n![Image](img/00093.jpeg)\n\n**图 22-3** *建立主动 FTP 连接*\n\
  \n一旦建立了此初始连接，就会发生一些额外的操作。用户会被提示输入用户名和密码以登录 FTP 服务器。一旦用户成功登录，任何数据传输（例如上传或下载文件）都在不同的端口上进行。服务器上使用端口\
  \ 20。在客户端上，端口号比连接端口大 1。因此，对于图 22-4 中的示例，这是端口 1029。\n\n![Image](img/00094.jpeg)\n\
  \n**图 22-4** *FTP 数据传输*\n\n客户端的所有命令（以及服务器的响应）继续通过原始端口发送。但数据传输使用了新端口并由服务器发起。这是一个问题，因为客户端侧的防火墙通常设计用于阻止此类连接。你可能会认为只需允许该端口的入站连接，但请记住该端口是一个移动目标。客户端在首次建立连接时随机选择客户端端口。\n\
  \n结果是，当客户端尝试下载或上传文件时，FTP 服务器似乎冻结了。在此之前的一切操作看起来都很正常。\n\n当使用被动模式时，FTP 服务器指示不要启动数据传输通信并等待客户端建立连接。这满足了防火墙规则（如果配置正确），因为\
  \ FTP 服务器设置的数据被认为是 FTP 客户端连接请求的响应。\n\n建立被动模式的方法是登录 FTP 服务器然后执行 passive 命令，如示例 22-13\
  \ 所示。\n\n\n\n\n\n```\n[root@onecoursesource ~]# ftp localhost\nConnected to localhost.localdomain.\n\
  220 (vsFTPd 2.0.5)\n530 Please login with USER and PASS.\n530 Please login with\
  \ USER and PASS.\nKERBEROS_V4 rejected as an authentication type\nName (localhost:root):\
  \ anonymous\n331 Please specify the password.\nPassword:\n230 Login successful.\n\
  Remote system type is UNIX.\nUsing binary mode to transfer files.\nftp> passive\n\
  Passive mode on.\nftp>\n```\n\n# Secure Shell (安全外)\n\nSecure Shell 设计用于取代不安全的远程操作，例如\
  \ `telnet`、`ftp`、`rlogin`、`rsh`、`rcp` 和 `rexec` 命令/协议。以前通信方法的主要问题在于它们以明文跨网络传输数据，而不是加密格式。在某些情况下（例如\
  \ `telnet` 和 `ftp`），这可能包括在网络上以明文形式发送用户账户数据（用户名和密码）。\n\nSecure Shell (`SSH`) 协议通过加密跨网络传输的数据提供了更好的安全级别。`SSH`\
  \ 已成为 Linux 中的一种标准，几乎几乎所有的发行版默认都包含了客户端和服务器软件。如果你的系统中没有安装此软件，你应该安装 `openssh`、`openssh-server`、`openssh-clients`\
  \ 和 `openssh-askpass` 软件包（有关安装软件的更多细节，请参见第 26 章 和 第 27 章）。\n\n## 配置 Secure Shell\
  \ 服务器\n\n`/etc/ssh` 目录是存储 Secure Shell 配置文件的位置。SSH 服务器的配置文件是 `/etc/ssh/sshd_config`\
  \ 文件。不要将其与 `/etc/ssh/ssh_config` 文件混淆，后者用于配置客户端程序，例如 `ssh`、`scp` 和 `sftp` 命令。\n\n\
  ### 基础配置设置\n\n两种不同的 SSH 协议分别为 1 和 2。这些并不是版本，而是为了提供安全数据连接而开发的两个独立协议。曾有一段时间这两个协议被广泛使用，但现在几乎所有的\
  \ SSH 客户端只使用协议 2。要设置你的 SSH 服务器接受的协议，请使用 `Protocol` 关键字：\n\n```\nProtocol 2\n```\n\
  \n如果你有一些需要协议 1 的旧版 SSH 客户端，可以在 `/etc/ssh/sshd_config` 文件中使用以下关键字设置，让你的 SSH 服务器接受两种协议连接：\n\
  \n```\nProtocol 1,2\n```\n\n### 安全要点\n\n协议 1 不再受到支持，应尽可能避免使用。协议 2 具有更好的安全特性并且正在积极改进。通常情况下，你应该始终远离不再支持或不再活跃维护的软件，因为当黑客发现安全漏洞时，这些漏洞不会被修复。\n\
  \n在某些情况下，你可能有多个网卡（或虚拟接口），并且你想限制 SSH 服务器仅监听某些网卡。要实现这一点，请使用 `ListenAddress` 关键字并指定分配给\
  \ SSH 应接受连接的网卡的 IP 地址。这是一个示例：\n\n点击此处查看代码图片\n\n```\nListenAddress 192.168.1.100:192.168.1.101\n\
  ```\n\nSSH 服务器监听的标准端口号是 22。你可以通过使用 `Port` 关键字修改 SSH 服务器以监听另一个端口：\n\n```\nPort 2096\n\
  ```\n\n### 安全要点\n\n使用非标准端口会让黑客发现服务变得稍微困难一些。然而，有很多工具允许黑客探测系统上“开放”的端口（即对服务有响应的端口）。因此，更改端口不会完全隐藏\
  \ SSH 服务。但是，许多黑客也只是使用带有硬编码值（如端口号）的脚本，因此你可能可以使用不同的端口号来避免随意的黑客尝试。\n\n你可能需要更改 SSH 服务器记录的种类的日志消息。这可以通过\
  \ `LogLevel` 关键字进行设置。以下是可用的级别：\n\n* `QUIET`\n* `FATAL`\n* `ERROR`\n* `INFO`\n* `VERBOSE`\n\
  * `DEBUG`\n* `DEBUG1` (与 `DEBUG` 相同)\n* `DEBUG2`\n* `DEBUG3`\n\n与系统日志（有关系统日志的详情请参见第\
  \ 25 章 \"系统日志”）一样，这些级别是层层递的。例如，`INFO` 级别包含了在 `ERROR` 和 `FATAL` 级别生成的所有日志（技术上也包括\
  \ `QUIET`，但该级别没有消息）。切换到 `DEBUG`、`DEBUG2` 或 `DEBUG3` 时要小心，因为这会导致真实 SSH 服务器上出现安全问题。\n\
  \n### 安全要点\n\n`sshd_config` 手页指出：“使用 `DEBUG` 级别的日志违反了用户隐私，不建议这样做。”如果你在测试机器上将 `LogLevel`\
  \ 关键字设置为 `DEBUG`，然后重启 SSH 服务器，连接到 SSH 服务器并查看 `/var/log/secure` 文件（基于红帽的系统）或 `/var/log/auth.log`\
  \ 文件（Debian），你就能看到为什么（如用户名和密码的数据被捕获了）。\n\n### 影响用户访问的设置\n\n要禁止 root 用户通过 SSH 登录，请将\
  \ `PermitRootLogin` 值更改为 `no`：\n\n```\nPermitRootLogin no\n```\n\n### 安全要点\n\n你可能希望不允许\
  \ root 用户直接通过 SSH 登录，特别是当系统连接到互联网时。允许通过 SSH 登录 root 会为潜在的黑客提供通过尝试多个密码来使用暴力攻击以获取访问的能力。\n\
  \n更好的选择是允许普通用户登录，允许用户使用 `su` 或 `sudo` 命令切换到 root 账户。虽然仍然可以对普通用户尝试暴力攻击，但黑客必须知道该账户存在，并且在获得访问后尝试破解\
  \ root 账户。\n\n如果你有一个没有理由通过 SSH 登录的普通用户怎么办？在这种情况下，你有两个选择：`AllowUsers` 或 `DenyUsers`。这两个关键字都允许你指定一个用户名列表：\n\
  \n```\nAllowUsers bob sue ted\n```\n\n如果你使用 `AllowUsers` 关键字，只有这些用户被允许连接 SSH 服务器。如果你使用\
  \ `DenyUsers` 关键字，所有用户都可以连接到 SSH 服务器，列表中的用户除外。注意，如果你同时两个关键字，`DenyUsers` 优先。\n\n\
  你可以使用通配符匹配模式：\n\n点击此处查看代码图片\n\n```\nDenyUsers guest*#拒绝任何以 \"guest\" 开头的用户名\nDenyUsers\
  \ ????app#拒绝任何包含 4 个字符并以 \"app\" 结尾的用户名\n```\n\n### 安全要点\n\n你还可以使用 `AllowGroups`\
  \ 和 `DenyGroups` 关键字。\n\nSSH 服务器有几种不同的身份验证方法。以下是你应该了解的关键：\n\n* `PasswordAuthentication`：当设置为\
  \ `yes`（默认）时，此设置允许用户通过提供用户名和密码进行登录。如果设置为 `no`，用户可以使用身份密钥登录。身份密钥将在本章后面的部分详细介绍。\n\n\
  * `PubkeyAuthentication`：当此设置为 `yes` 时，用户可以在服务器上存储公钥。公钥是由用户客户端系统上的 `ssh-keygen`\
  \ 命令生成的。该过程在本章的后续部分会有更详细的介绍。\n\n表 22-5 描述了影响用户登录的其他有用 SSH 服务器设置。\n\n**表 22-5** SSH\
  \ 服务器设置\n\n| **设置** | **描述** |\n| --- | --- |\n| `Banner` | 指定一个在用户身份验证过程之前显示其内容的文件。\
  \ |\n\n\n\n\n\n| `PrintMotd` | 如果此项设置为 `yes`（默认值），当用户通过 SSH 登录系统时，将显示 `/etc/motd`\
  \ 文件的内容。 |\n| `X11Forwarding` | 如果设置为 `yes`（默认值为 `no`），提供了一种方便的方法，允许在 SSH 服务器上执行图形程序并在\
  \ SSH 客户端上显示。这要求执行 SSH 客户端命令（`ssh` 命令）时带有 `-X` 或 `-Y` 选项。 |\n| `MaxAuthTries` |\
  \ 设置为一个数值，表示用户输入正确密码的尝试次数。默认值为 `6`。 |\n| `PermitEmptyPasswords` | 如果此设置为 `no`（默认值），如果用户账户的密码字段为空，用户无法通过\
  \ SSH 登录。 |\n\n### Secure Shell 客户端命令\n\n你需要了解几种不同的 SSH 客户端命令，包括：\n\n* `ssh`: 允许你登录到\
  \ SSH 服务器并通过命令行在服务器上工作。\n* `scp`: 允许你通过命令行在 SSH 服务器与之间传输文件。\n* `sftp`: 允许你连接到 SSH\
  \ 服务器并执行类似 FTP 的命令。\n\n你应该了解这些命令中每一个的功能，以及 `/etc/ssh/ssh_config` 文件中的一些关键设置。\n\n\
  ### ssh_config 文件\n\n`ssh_config` 文件的几个组件与 `sshd_config` 文件不同。首先，有一个系统级的 `/etc/ssh/ssh_config`\
  \ 文件，它适用于所有用户。此外，每个用户都可以在其家目录中创建一个文件（`~/.ssh/config`），该文件可用于覆盖 `/etc/ssh/ssh_config`\
  \ 文件中的设置。\n\n除了文件之外，命令行选项也可以覆盖配置文件中指定的值。以下是所有这些信息被解析的顺序：\n\n1. 命令行选项\n2. 用户的 `~/.ssh/config`\
  \ 文件\n3. `/etc/ssh/ssh_config` 文件\n\n**重要**\n\n找到的第一个参数将会被使用的。例如，如果在用户的 `~/.ssh/config`\
  \ 文件中设置了 `ConnectTimeout`，而在 `/etc/ssh/ssh_config` 文件中设置了不同的值，则将使用用户的配置文件来设置该值。\n\
  \n`ssh_config` 文件与 `sshd_config` 文件之间的另一个重要区别是，`ssh_config` 文件中的大多数设置都是 `Host` 设置的子设置。`Host`\
  \ 设置允许你为你连接的不同的 SSH 服务器指定不同的规则。例如，以下配置将在连接到 server1.onecoursesource.com 时应用 `0`\
  \ 的 `ConnectTimeout` 值，在连接到 test.example.com 时应用 `600` 的值：\n\n点击此处查看代码图片\n\n```\n\
  Host server1.onecoursesource.com\nConnectTimeout 0\nHost test.example.com\nConnectTimeout\
  \ 600\n```\n\n`ssh_config` 文件中的许多设置与 SSH 服务器配置文件中的设置相关。回想一下以下 `/etc/ssh/sshd_config`\
  \ 文件设置：\n\n```\nX11Forwarding yes\n```\n\n在客户端侧，此功能通常通过执行基于 `ssh` 的命令时使用 `-X` 或\
  \ `-Y` 选项启用。然而，如果你想让此功能成为默认值，可以在 `/etc/ssh/ssd_config` 或 `~/.ssh/config` 文件中使用以下设置：\n\
  \n```\nForwardX11 and ForwardX11Trusted\n```\n\n### ssh 命令\n\n第一次尝试通过 `ssh` 命令连接到机器时，系统会提示验证\
  \ RSA 密钥指纹：\n\n点击此处查看代码图片\n\n```\n[student@onecoursesource ~]$ ssh 192.168.1.22\n\
  The authenticity of host '192.168.1.22 (192.168.1.22)' can't be established.\nRSA\
  \ fingerprint256:SHA256:...\nAre you sure you want to continue connecting (yes/no)?\n\
  student@onecoursesource ~]$ ssh 192.168.1.22\nThe authenticity of host '192.168.1.22\
  \ (192.168.1.22)' can't be established.\nRSA fingerprint256:SHA256:...\nAre you\
  \ sure you want to continue connecting (yes/no)?\nstudent@onecoursesource ~]$ ssh\
  \ 192.168.1.22\nThe authenticity of host '192.168.1.22 (192.168.1.22)' can't be\
  \ established.\n```\n\n\n\n\n\n```\n[student@onecoursesource ~]$ scp /etc/hosts\
  \ 192.168.1.22:/tmp\nstudent@192.168.1.22's password:\nhosts                   \
  \                                   100%  187     0.2KB/s   00:00\n```\n\n以下是一些一些实用的\
  \ `scp` 选项：\n\n* `-r`: 复制整个目录结构\n* `-v`: 详细模式；显示有助于调试传输问题的详细信息\n* `-q`: 静默模式\n*\
  \ `-p`: 保留时间戳和权限\n\n`sftp` 命令连接到 SSH 服务器并提供了一个类似 FTP 的客户端界面。请参阅示例 22-14 查看演示。\n\n\
  **示例 22-14** *通过 sftp 连接*\n\n点击此处查看代码图片\n\n```\n[student@onecoursesource ~]$ sftp\
  \ 192.168.1.22\nConnecting to 192.168.1.22...\nstudent@192.168.1.22's password:\n\
  sftp>cd /tmp\nsftp>ls\ngconfd-root            hosts                  keyring-GhtP1j\
  \         mapping-root\nnis.6788.ldif          nis.6818.ldif          nis.6836.ldif\
  \          orbit-root\nssh-ysXgwO2672         uplist                 virtual-root.9QNCsb\n\
  sftp>get hosts\nFetching /tmp/hosts to hosts\n/tmp/hosts                       \
  \                   100%  187     0.2KB/s   00:00\nsftp>ls h*\nhosts\nsftp>quit\n\
  ```\n\n## 高级 SSH 特性\n\n初级管理员经常问的一个问题是：SSH 如何加密数据传输以确保安全？所使用的技术涉及公钥和私钥。当 SSH 客户端连接到\
  \ SSH 服务器时，服务器会向客户端提供其公钥。\n\n在建立会期间，客户端和服务器会生成一个对称会话密钥，该密钥随后用于加密主机之间交换的所有数据。然后，客户端用公钥加密所有数据并发送到服务器。数据只能通过私钥解密，而私钥仅存储在服务器上。\n\
  \n这些密钥在安装 SSH 服务器时创建，并存储在 `/etc/ssh` 目录。\n\n如果用户经常登录到特定的 SSH 服务器，该用户可能希望设置无密码登录。要实现此，你需要按照以下步骤操作：\n\
  \n### 第一步\n\n在 SSH 客户端机器上执行 `ssh-keygen` 命令，如示例 22-15 所示。当提示输入密码（passphrase）时，按回车键留空（或者，你可以使用\
  \ `ssh-keygen` 命令的 `-N` 选项，这样就不会有密码提示）。\n\n**示例 22-15** *ssh-keygen 命令*\n\n点击此处查看代码图片\n\
  \n```\n[student@onecoursesource ~]$ ssh-keygen -t rsa\nGenerating public/private\
  \ rsa key pair.\nEnter file in which to save the key (/home/student/.ssh/id_rsa):\n\
  Enter passphrase (empty for no passphrase):\nEnter same passphrase again:\nYour\
  \ identification has been saved in /home/student/.ssh/id_rsa.\nYour public key has\
  \ been saved in /home/student/.ssh/id_rsa.pub.\nThe key fingerprint is:\nb4:77:29:40:b8:aa:d1:1c:3a:cb:e6:b8:5d:9b:07:fb\
  \ student@localhost.localdomain\nThe key's randomart image is:\n+--[ RSA 2048]----+\n\
  |       ..       |\n|      ..        |\n|       .o        |\n|    . .. o   .  |\n\
  |   + o  S o o    |\n|  + =    . o     |\n| . =.o           |\n| o=..o.        \
  \ |\n|o+o ooE          |\n+-----------------+\n```\n\n### 第二步\n\n现在 `~/.ssh/id_rsa.pub`\
  \ 文件中有一个公钥。这需要被复制到远程服务器，放入远程机器上你账户的 `~/.ssh/authorized_keys` 文件中（你可能需要创建此目录并将权限设置为\
  \ `770`）。可以使用以下命令完成：\n\n点击此处查看代码图片\n\n```\nstudent@localhost ~]$ cat .ssh/id_rsa.pub\
  \ | ssh 192.168.1.22 'cat >> .ssh/authorized_keys'\nstudent@192.168.1.22's password:\n\
  ```\n\n### 第三步\n\n将 `authorized_keys` 文件的权限设置为 `640`：\n\n点击此处查看代码图片\n\n```\n[student@onecoursesource\
  \ ~]$ ssh 192.168.1.22 'chmod 640 /home/student/.ssh/\nauthorized_keys'\nstudent@192.168.1.22's\
  \ password:\n```\n\n### 安全要点\n\n在某些发行版中，你可以使用 `ssh-copy-id` 命令同时完成第二步和第三步。然而，你也应该知道如何使用这些步骤描述的手动方法。\n\
  \n现在你应该能够无需密码即可登录 SSH 服务器了：\n\n点击此处查看代码图片\n\n```\n[student@onecoursesource ~]$ ssh\
  \ 192.168.1.22 date\nMon Jan 11 16:59:32 PST 2019\n```\n\n一些安全专家指出，为密钥不设置密码会带来安全风险。但是，如果你……\n\
  \n### 总结\n\n本章的重点是配置、安全以及连接。\n\n## 核心术语\n\n* `LDAP`\n* `OpenLDAP`\n* `Active`\n\
  * `attribute`\n* `schema`\n* `LDIF`\n* `DN`\n* `CN`\n* `SSSD`\n* `anonymous`\n*\
  \ `active`\n* `passive`\n\n#### 复习题\n\n1. 一个 _____ 是对象的一个组成部分。\n2. 用于创建对象的文件格式被称为\
  \ _____。\n3. 使用哪个命令创建 rootdn 密码？\n4. OpenLDAP 数据库目录的权限应该设置为 _____。请提供一个八进制值。\n5.\
  \ 可以使用 _____ 命令在启动服务器之前测试 OpenLDAP 配置文件。\n6. 填空在命令行中提供 rootdn 密码：\n7. 使用基于 `ldap`\
  \ 的命令（如 `ldapsearch`）时，哪个选项意味着“使用简单身份验证”？\n8. `vsftpd.conf` 文件中的 _____ 指令用于允许匿名\
  \ FTP 连接。\n\n\n\n\n\n** 9. ** 以下哪些 `vsftpd.conf` 指令与创建一个允许特定用户访问 FTP 服务器的列表相关？（选择所有适用项。）\n\
  \n1. `userlist_enable`\n2. `userlist_file`\n3. `userlist_allow` \n4. `userlist_deny`\n\
  \n** 10. ** `/etc/ssh/sshd_config` 文件中的 `_____` 设置用于指定在哪些接口上接受 SSH 连接。\n\n** 11.\
  \ ** `/etc/ssh/sshd_config` 文件的 `_____` 设置用于指定哪些用户可以连接到 SSH 服务器。\n\n## 第 23 章：制定网络安全策略\n\
  \n对于每种网络服务，可以使用多种方法来加保护该服务。例如，保护 BIND DNS 服务的部分措施包括将 BIND 放置在 chroot 监狱中、实施拆分 BIND\
  \ 配置以及使用事务签名（这些内容在第 20 章“网络服务配置：基本服务](#part0036.html_ch20)”中均已介绍过），但可以使用许多额外的安全设置来使\
  \ BIND 服务器更加安全。\n\n您的安全策略应该包含特定的步骤，以妥善保护每个基于网络的服务。这可能是一项艰巨的任务，因为有许多不同的服务，其中许多在书中并未涵盖。\n\
  \n之前的三个章节涵盖了多种基于网络的服务。每种服务的关键安全特性已介绍过，因此在本章中将不再重复。然而，请意识到，当您创建安全策略时，这些安全特性是非常重要的。同样重要的是这些基于网络的服务提供的额外安全特性（如果您最终在生产环境中实现这些服务，您将需要对它们进行更多探索）。\n\
  \n此外，本书的后后部分将更详细地介绍某些基于网络安全特性。例如，防火墙（在第 31 章“防火墙](#part0050.html_ch31)”中进行了详细介绍）可以用于阻止进入系统的入连接。虽然防火墙将是任何网络安全策略的主要部分，但本章并未讨论它们。相反，本章重点关注网络安全策略的三个关键组件：内核参数、TCP\
  \ Wrappers 和网络时间协议。\n\n在阅读完本章并完成练习后，您将能够执行以下操作：\n\n* 修改内核参数以提供更好的网络安全\n* 实现 TCP\
  \ Wrappers\n* 手动配置系统时间\n* 配置系统使用网络时间协议服务器\n\n### 内核参数\n\n第 28 章“系统启动”向您介绍了一个与内核参数相关的主题。您可以使用内核参数通过调整关键特性来修改内核的行为。它们可以更改内核管理设备的方式、优化内存使用并增强系统的安全性。\n\
  \n由于第 28 章中提供了对内核参数的完整讨论，因此本章重点介绍内核参数的要点以及一些对网络安全较重要的内核参数。\n\n#### /etc/sysctl.conf\
  \ 文件\n\n可以通过修改 `/etc/sysctl.conf` 文件来修改内核参数；请参阅示例 23-1 获取该文件的示例。\n\n**示例 23-1: /etc/sysctl.conf\
  \ 文件**\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]#head /etc/sysctl.conf\n# Red\
  \ Hat Linux 的内核 sysctl 配置文件\n#\n# 对于二进制值，0 为禁用，1 为启用。更多信息请参阅 sysctl(8) 和\n# sysctl.conf(5)。\n\
  \n# 控制 IP 数据包转发\nnet.ipv4-ip_forward = 0\n\n# 控制源路由验证\nnet.ipv4.conf.default.rp_filter\
  \ = 1\n```\n\n若要修改内核参数，您需要在该文件中将参数的值（例如 `net.ipv4-ip_forward`）设置为新值。例如，`net.ipv4-ip_forward`\
  \ 内核参数决定了该系统是否将作为路由器运行。路由器会在网络之间转发网络数据包。如果您将 `net.ipv4-ip_forward` 设置为 1（0=假或否，1=真或是），那么这台机器就可以作为路由器。一个完整的路由器还需要两个网络连接（每个网络一个）。\n\
  \n注意，对 `/etc/sysctl.conf` 文件的任何更改都不会立即生效，除非重启系统或运行 `systemctl --system` 命令使更改生效。\n\
  \n本章仅介绍了一些常用的内核参数，许多特性都是为了更安全。\n\n#### 忽略 ping 请求\n\n`ping` 命令通常用于确定远程主机是否可访问。它通过向远程主机发送互联网控制消息协议\
  \ (ICMP) 显回请求来实现这一点。这带来了两种安全挑战：\n\n* 黑客可以利用 `ping` 探测活动系统（请参见第 30 章“端口探测”），这是一种常见的方法。结果是，对于关键系统最好忽略\
  \ `ping` 请求。\n* 响应 `ping` 请求可能会导致系统受到拒绝服务 (DoS) 攻击，当大量数据包发送到系统时。由于这种漏洞，对于关键系统最好忽略\
  \ `ping` 请求。\n\n要忽略 `ping` 请求，请在 `/etc/sysctl.conf` 文件中使用以下设置：\n\n点击此处查看代码图像\n\n\
  ```\nnet.ipv4.icmp_echo_all = 1\n```\n\n**会出现什么问题？**\n\n如果您将所有系统都设置为忽略 `ping` 请求，这意味着您无法使用\
  \ `ping` 命令确定机器是否通过网络做出响应。在尝试排排除网络问题时，请记住这一点。\n\n#### 忽略广播请求\n\n广播请求可用于拒绝服务 (DoS)\
  \ 和分布式拒绝服务 (DDoS) 攻击，其技术类似于 `ping` 请求。要忽略广播请求，请在 `/etc/sysctl.conf` 文件中使用以下设置：\n\
  \n点击此处查看代码图像\n\n```\nnet.ipv4.icmp_echo_ignore_broadcasts = 1\n```\n\n#### 启用 TCP\
  \ SYN 保护\n\nSYN 洪水攻击 是另一种拒绝服务攻击，其通过使用 SYN 请求来使系统无法响应。要忽略 SYN 请求，请在 `/etc/sysctl.conf`\
  \ 文件中使用以下设置：\n\n点击此处查看代码图像\n\n```\nnet.ipv4.tcp_syncookies = 1\n```\n\n#### 禁用 IP\
  \ 源路由\n\nIP 源路由 是一项允许数据包发送者指定应该采取的网络路由的特性。该特性绕过了路由表并使您的系统变得脆弱，因为黑客可以采用中间人攻击（在客户端与服务器的通信之间插入系统），或者他们可以利用此特性绘制您的网络地图并绕过您的防火墙。\n\
  \n\n\n\n\n每个网络接口都有一个独立的 IP 源路由内核参数。因此，要从特定的网络设备上禁用此功能，可以使用如下设置：\n\n点击此处查看代码图片\n\n\
  ```\nnet.ipv4.conf.eth0.accept_source_route = 0\n```\n\n### TCP Wrappers\n\nTCP\
  \ wrappers 用于当那些服务器程序在编译时调用了 `libwrap` 库，并且当系统尝试访问该服务时会调用该库的场景。例如，当有人尝试连接到 Secure\
  \ Shell 服务器（`sshd`）时，Secure Shell 服务器会调用 `libwrap` 库。`libwrap` 库使用配置文件来根据发起连接的机器确定是否应该允许\
  \ SSH 连接。使用的文件是 `/etc/hosts.allow` 和 `/etc/hosts.deny` 文件。\n\n在探索配置文件之前，你首先需要能够确定哪些服务使用了\
  \ `libwrap` 库。实现这一简单方法是使用 `ldd` 命令：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource\
  \ ~]# ldd /usr/sbin/sshd | grep libwrap\nlibwrap.so.0 => /lib64/libwrap.so.0 (0x00007efeb9df7000)\n\
  ```\n\n如果 `ldd` 命令返回 `libwrap.so.0`，则该程序使用了 TCP wrappers。找到这些“被 libwrapped”的服务的一种方法是执行如示例\
  \ 23-2 所示的命令。\n\n**示例 23-2** 显示“libwrapped”程序\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource\
  \ ~]# for i in /usr/sbin/*\n>do\n>ldd $i | grep libwrap && echo $i\n>done\nlibwrap.so.0\
  \ => /lib64/libwrap.so.0 (0x00007facd0b05000)\n/usr/sbin/exportfs\nlibwrap.so.0\
  \ => /lib64/libwrap.so.0 (0x00007fd295593000)\n/usr/sbin/rpcinfo\nlibwrap.so.0 =>\
  \ /lib64/libwrap.so.0 (0x00007fd87537c000)\n/usr/sbin/rpc.mountd\nlibwrap.so.0 =>\
  \ /lib64/libwrap.so.0 (0x00007f5251e30000)\n/usr/sbin/rpc.rquotad\nlibwrap.so.0\
  \ => /lib64/libwrap.so.0 (0x00007f96e8b39000)\n/usr/sbin/sshd\nlibwrap.so.0 => /lib64/libwrap.so.0\
  \ (0x00007f5a93020000)\n/usr/sbin/xinetd\n```\n\n**注意**\n\n`/usr/bin` 和 `/sbin`\
  \ 目录中可能存在使用 `libwrap` 库的服务，因此你也应该搜索这些目录。\n\n要理解 `/etc/hosts.allow` 和 `/etc/hosts.deny`\
  \ 文件如何工作，你首先需要理解这两个文件的求值顺序。当服务（例如 `sshd`）请求 `libwrap` 库授权某个连接时，它会首先查找 `/etc/hosts.allow`\
  \ 文件以确定是否有任何匹配的规则。规则将进行详细描述，但基本上一个规则包含一个服务（`sshd`）和一个机器规格（IP 地址、主机名等）。如果 `/etc/hosts.allow`\
  \ 文件中有匹配的规则，该库实用程序将告诉服务允许此访问。\n\n如果 `/etc/hosts.allow` 文件中没有匹配的规则，那么 `libwrap` 库将查看\
  \ `/etc/hosts.deny` 文件中的规则。如果该文件中匹配了规则，则 `libwrap` 库将告诉服务不要允许此访问。\n\n如果两个文件中都没有匹配的规则，则\
  \ `libwrap` 库将告诉服务允许此访问。这意味着默认策略是允许访问，而你需要在 `/etc/hosts.deny` 中设置规则来阻止访问。参见图 23-1\
  \ 获取此过程的视觉表示。\n\n![Image](img/00095.jpeg)\n\n**图 23-1** TCP Wrappers\n\n`/etc/hosts.allow`\
  \ 和 `/etc/hosts.deny` 文件中规则的语法为：\n\n点击此处查看代码图片\n\n```\nservice_list: client_list\
  \ [options]\n```\n\n服务是二进制可执行服务程序的名称（例如 `sshd` 或 `xinetd`）。客户端列表是该规则应该应用于哪些系统。考虑以下简单的示例：\n\
  \n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# more /etc/hosts.allow\n[root@onecoursesource\
  \ ~]# more /etc/hosts.deny\nsshd: test.onecoursesource.com\n```\n\n在前面的示例中，所有客户端都被允许访问本地系统以连接到任何服务，但来自\
  \ test.onecoursesource.com 系统的客户端不能通过 `sshd` 服务连接。\n\n服务列表可以包含多个服务：\n\n点击此处查看代码图片\n\
  \n```\n[root@onecoursesource ~]# more /etc/hosts.allow\n[root@onecoursesource ~]#\
  \ more /etc/hosts.deny\nxinetd,sshd: test.onecoursesource.com\n```\n\n上一个示例将拒绝来自\
  \ test.onecoursesource.com 系统的用户连接到 `sshd` 或 `xinetd`。\n\n`ALL` 关键字可以指定所有服务：\n\n\
  点击此处查看代码图片\n\n```\nservice_list: client_list [options]\n```\n\n[root@onecoursesource\
  \ ~]# more /etc/hosts.allow\nALL: test.onecoursesource.com\n```\n\n`ALL` 关键字也可以指定所有机器：\n\
  \n点击此处查看代码图片\n\n```\nservice_list: client_list [options]\n```\n\n[root@onecoursesource\
  \ ~]# more /etc/hosts.deny\nALL: local\n```\n\n### 网络时间协议\n\n维护准确的系统钟对网络安全至关重要，因为许多网络服务具有时间功能。例如，网络登录可能在特定一段时间内有效。或者网络服务可能会使用\
  \ PAM（在第 7 章 和第 8 章 中讨论）来允许特定日期或时间的访问。\n\n系统钟可以手动设置，也可以通过网络时间协议 (NTP) 配置。在本节中，我们首先介绍如何手动设置系统钟。虽然使用\
  \ NTP 服务器更理想，但在没有可靠 NTP 服务器的情况下，你至少应该学会如何手动设置系统钟。\n\n#### 手动设置系统钟\n\n可以使用 `date`\
  \ 命令显示系统钟：\n\n点击此处查看代码图片\n\n```\n [root@onecoursesource ~]#date\nTue Feb 28 22:15:33\
  \ PST 2019\n```\n\n`date` 命令的输出通常用于生成唯一文件名，因为该命令具有非常灵活的格式。这是一个示例：\n\n点击此处查看代码图片\n\
  \n```\n[root@onecoursesource ~]#date \"+%F\"\n2019-02-28\n[root@onecoursesource\
  \ ~]#touch data-$(date \"+%F\")\n[root@onecoursesource ~]#ls data*\ndata-2019-02-28\n\
  ```\n\n表 23-1 详细了一些更常用的日期格式。\n\n**表 23-1** 日期格式\n\n| **格式** | **描述** |\n| --- |\
  \ --- |\n| %a | 简写的星期名称 (Sun) |\n| %A | 完整的星期名称 (Sunday) |\n| %b | 简写的月份名称 (Jan)\
  \ |\n| %B | 完整的月份名称 (January) |\n\n\n\n\n\n| `%d` | 月中的几 |\n| `%D` | 与 `%m/%d/%y`\
  \ 相同 |\n| `%F` | 与 `%Y-%m-%d` 相同 |\n| `%m` | 月 |\n| `%n` | 换行符 |\n| `%y` | 两位年份\
  \ (19) |\n| `%Y` | 四位年份 (2019) |\n\n作为 root 用户，你可以使用以下语法通过 `date` 命令设置系统时：\n\n点击此处查看代码图像\n\
  \n```\n[root@onecoursesource ~]#date Tue Feb 28 2019\n```\n\n在某些系统中，使用 `timedatectl`\
  \ 命令来显示或设置系统时，如示例 23-3 所示。\n\n```\n[root@onecoursesource ~]#timedatectl\n      本地时间:\
  \ Tue 2019-02-28 22:07:39 PST\n  世界时间: Wed 2019-03-01 06:07:39 UTC\n        RTC\
  \ 时间: Sun 2018-06-12 17:50:56\n        时区: America/Los_Angeles (PST, -0800)\n  \
  \   NTP 已启用: yes\n     同步中: no\n     本地 TZ: no\n      夏令时: no\n```\n\n作为 root 用户，你可以使用此命令设置系统时。表格\
  \ 23-2 展示了修改系统时的常用方法。\n\n**表格 23-2 修改系统时**\n\n| 方法 | 描述 |\n| --- | --- |\n| `set-time\
  \ [*time]` | 将系统时设置为指定的 `time` |\n| `set-timezone [*zone]` | 将系统时区设置为指定的 `zone`\
  \ |\n| `set-ntp [*0|1]` | 启用 (1) 或禁用 (0) 网络时间协议 |\n\n#### 手动设置系统时区\n\n`tzselect`\
  \ 实用是一个菜单驱动、基于 CLI 的工具，允许用户选择时区。在示例 23-4 中提供了一个示例。\n\n**示例 23-4 执行 `tzselect` 命令**\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource~]#tzselect\n请识别一个位置以便正确设置时区规则。\n请选择大陆、海洋、“coord”或“TZ”。\n\
  1) 非洲\n2) 美洲\n3) 南极洲\n4) 北极洋\n5) 亚洲\n6) 大西洋\n7) 澳洲\n8) 欧洲\n9) 印度洋\n10) 太平洋\n11)\
  \ coord - 我想使用地理坐标。\n12) TZ - 我想使用 Posix TZ 格式指定时区。\n#? 2\n请选择一个与你时间一致的国家。\n1) 安圭拉\n\
  2) 安提瓜和巴布达\n3) 阿根廷\n4) 阿鲁巴\n5) 巴哈马\n6) 巴巴多\n7) 别尔兹\n8) 玻利维亚\n9) 巴西\n10) 加拿大\n11)\
  \ 喀勒比荷兰\n12) 开曼岛\n13) 智利\n14) 哥伦比亚\n15) 哥斯达达\n16) 古巴\n17) 库拉索\n18) 多米尼克\n19) 多米尼加共和国\n\
  20) 厄瓜多尔\n21) 萨尔瓦瓦\n22) 法属圭亚\n23) 格陵兰\n24) 格纳达\n25) 法属\n26) 危地马拉\n27) 圭亚\n#? 49\n\
  请选择以下时区区域之一。\n1) 东部时间 (Eastern Time)\n2) 东部时间 - 密歇根州 - 大多数地区\n3) 东部时间 - 肯塔基州 - 路易斯维地区\n\
  4) 东部时间 - 肯塔基州 - 韦县\n5) 东部时间 - 印第安纳州 - 大多数地区\n6) 东部时间 - 印第安纳州 - Daviess, Dubois,\
  \ Knox & Martin 县\n7) 东部时间 - 印第安纳州 - 普拉斯基县\n8) 东部时间 - 印第安纳州 - 克拉福德县\n9) 东部时间 - 印第安纳州\
  \ - 派克县\n10) 东部时间 - 印第安纳州 - 瑞士县\n11) 中部时间 (Central Time)\n12) 中部时间 - 印第安纳州 - 珀里县\n\
  13) 中部时间 - 印第安纳州 - Stark 县\n14) 中部时间 - 密歇根州 - Dickinson, Gogebic, Iron & Menominee\
  \ 县\n15) 中部时间 - 北达科他州 - Oliver 县\n16) 中部时间 - 北达科他州 - Morton 县（曼丹地区外）\n17) 中部时间 -\
  \ 北达科他州 - Stark 县\n18) 中部时间 - 北达科他州 - Pierce 县\n19) 中部时间 - 北达科他州 - Sioux 县\n20)\
  \ 中部时间 - 北达科他州 - Williams 县\n21) 中部时间 - 北达科他州 - McLean 县\n...（此处省略重复的县列表，已清理）\n\
  ```\n\n\n\n\n| `driftfile` | 包含一个值的文件，该值代表了 NTP 报告的时间与系统时钟之间典型的偏移（变化）。此值用于定期更新系统时钟，而无需访问\
  \ NTP 服务器。 |\n| `restrict` | 用于指定守护进程的限制，包括当该 NTP 服务器作为服务使用时，哪些机器可以访问它。 |\n| `server`\
  \ | 用于在当机器作为 NTP 客户端使用时列出一个 NTP 服务器。 |\n\n请参示例 23-5 获取典型的 `/etc/ntp.conf` 文件示例。\n\
  \n## 示例 23-5 典型的 `/etc/ntp.conf` 文件\n\n点击此处查看代码图片\n\n```\n# For more information\
  \ about this file, see the man pages\n# ntp.conf(5), ntp_acc(5), ntp_auth(5), ntp_clock(5),\
  \ ntp_misc(5), ntp_mon(5).\n\ndriftfile /var/lib/ntp/drift\n\n# Permit time synchronization\
  \ with our time source, but do not\n# permit the source to query or modify the service\
  \ on this system.\nrestrict default kod nomodify notrap nopeer noquery\n\n# Permit\
  \ all access over the loopback interface.  This could\n# be tightened as well, but\
  \ to do so would effect some of\n# the administrative functions.\nrestrict 127.0.0.1\n\
  restrict ::1\n\n# Hosts on local network are less restricted.\n#restrict 192.168.1.0\
  \ mask 255.255.255.0 nomodify notrap\n\n# Use public servers from the pool.ntp.org\
  \ project.\n# Please consider joining the pool (http://www.pool.ntp.org/join.html).\n\
  server 0.fedora.pool.ntp.org iburst\nserver 1.fedora.pool.ntp.org iburst\nserver\
  \ 2.fedora.pool.ntp.org iburst\nserver 3.fedora.pool.ntp.org iburst\n\n# Enable\
  \ public key cryptography.\n#crypto\n\nincludefile /etc/ntp/crypto/pw\n\n# Key file\
  \ containing the keys and key identifiers used when operating\n# with symmetric\
  \ key cryptography.\nkeys /etc/ntp/keys\n```\n\n`pool.ntp.org` 地址指向一个地理分布在世界各地的\
  \ NTP 服务器群。这些服务器可以在 `/etc/ntp.conf` 文件中自由使用。例如，以下服务器由 Fedora 项目提供（请注意，这些通常是镜像，指向其他系统，因此一旦你连接到这些服务器，结果的主机名将会有不同）：\n\
  \n0.fedora.pool.ntp.org\n\n1.fedora.pool.ntp.org\n\n2.fedora.pool.ntp.org\n\n3.fedora.pool.ntp.org\n\
  \n`ntpq` 命令允许你对 NTP 服务器执行查询。例如，示例 23-6 中显示的 `ntpq` 命令显示了 NTP 服务器状态的摘要。\n\n## 示例\
  \ 23-6 ntpq 命令\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# ntpq -p\n     remote\
  \           refid      st t when poll reach   delay   offset  jitter\n============================================================\n\
  *propjet.latt.ne 68.110.9.223     2 u  120 1024  377   98.580    7.067   4.413\n\
  -services.quadra 208.75.88.4      3 u  272 1024  377   72.504  -10.689   1.612\n\
  +mirror          216.93.242.12    3 u  287 1024  377   20.406   -2.555   0.822\n\
  +108.61.194.85.v 200.23.51.102    2 u  741 1024  377   69.403   -3.670   1.610\n\
  ```\n\n表 23-4 列出了 `ntpq` 命令的一些重要选项。\n\n## 表 23-4 ntpq 命令的选项\n\n| 选项 | 说明 |\n| ---\
  \ | --- |\n| `-d` | 启用调试模式 |\n| `-n` | 列出主机 IP 地址而不是名称 |\n| `-p` | 打印所有对的列表 |\n\n\
  ## 注意：使用 Kali Linux\n\nKali Linux 提供了一些极色的工具，可以让你探测系统的网络安全。然而，鉴于我们尚未完全覆盖涵盖书中介绍的所有网络安全主题，对这些工具的进一步讨论推迟到后面的章节。\n\
  \n### 总结\n\n在本章中，你学习了内核参数的几个元素，包括如何配置系统。\n\n#### 关键术语\n\nNTP\n\nrouter\n\nwrap\n\
  \nDoS\n\nDDoS\n\nSYN flood\n\nIP\n\nman\n\nin-the-middle\n\n#### 复习题\n\n1. NTP 的主配置文件是\
  \ `_____`。\n2. 哪些项可以防止 DoS？（选择两个）\n   - `/etc/hosts`\n   - `/etc/hosts`\n   - `/etc/allow`\n\
  \   - `/etc/deny`\n3. `_____` 库用于配置。\n4. `_____` 命令允许你对 NTP 服务器执行查询。\n\n\n\n\n\n\
  点击此处查看代码图像\n\n```\n[student@onecoursesource ~]$ps\n  PID TTY          TIME CMD\n\
  18360 pts/0    00:00:00 bash\n18691 pts/0    00:00:00 ps\n```\n\n每一行描述一个进程。默认情况下，`ps`\
  \ 命令显示以下信息：\n\n* `PID`：进程标识符（Process ID）；每个进程都有一个唯一的 ID，用于控制该进程。\n* `TTY`：这是启动该进程的终端窗口。终端窗口本质上是用户从命令行发布命令的地方。最初这是一种物理终端（一种为操作系统提供键盘输入的机器）。事实上，TTY\
  \ 代表 `Teletype`（电报打字），是曾用于连接到某些原始 Unix 系统的终端。以“pts”开头的终端是基于 GUI 的虚拟终端，即 shell 程序运行的窗口或远程连接（如\
  \ SSH 连接）。你可能还会看到“tty”，它表示非 GUI 的虚拟终端。“?”表示该进程不是从终端启动的，而是从另一个进程启动的（可能是在系统启动期间）。\n\
  * `TIME`：CPU 时间；进程在 CPU 上执行代码花费的时间。虽然这个数字会随时间推移而增长，但通常是一个非常小的数字（几秒钟或几分钟，但很少更多），除非进程出现问题。\n\
  * `CMD`：命令。\n\n要列出系统上运行的所有进程，请添加 `-e` 选项，如下所示。这非常有用，因为你想要查看的进程可能是从不同的 shell（或由不同的用户）启动的，但该命令的结果可能有几十甚至几百行输出。\n\
  \n点击此处查看代码图像\n\n```\n[student@onecoursesource ~]$ps -e | wc -l\n194\n```\n\n记得 `wc\
  \ -l` 将显示数据的行数；在在上一个示例中，它就是 `ps` 命令产生的行数。每个进程显示在单独的一行，因此该系统有 193 个进程正在运行（有一行表头信息——PID、TTY、TIME\
  \ 等）。因此，你可能想想使用 `grep` 命令通过命令名来过滤输出：\n\n点击此处查看代码图像\n\n```\n[student@onecoursesource\
  \ ~]$ps -e | grep xeyes\n 4896 pts/2    00:00:00 xeyes\n```\n\n`ps` 命令另一个有用的选项是\
  \ `-f`，它会显示关于进程的“完整信息”：\n\n点击此处查看代码图像\n\n```\n[student@onecoursesource ~]$ps -f\n\
  UID        PID  PPID  C STIME TTY          TIME CMD\nstudent    3872  3693  0 16:41\
  \ pts/5    00:00:00 bash\nstudent    4934  3872  0 21:05 pts/5    00:00:00 ps -f\n\
  ```\n\n当你使用 `-f` 选项时，会包含以下新数据列：\n\n* `UID`：用户 ID；启动进程的用户名。该用户“拥有”该进程，这很重要，因为要控制进程，你要么需要是\
  \ root 用户，要么是进程的所有者。\n* `PPID`：父进程 ID；这是启动此行所描述进程的进程 PID。例如，在上述的输出中，`ps -f` 命令是由\
  \ `bash` 命令启动的，因此 `ps -fe` 命令的 PPID 与 `bash` 命令的 PID 匹配。当当前有多个同一命令或程序的执行运行时，这对于查找特定进程非常有用。\n\
  * `C`：状态；值为 1 表示它当前正在 CPU 上执行代码（或在 CPU 队列中有代码），值为 0 表示它当前处于“睡眠”状态（等待某事的发生以便执行执行操作）。\n\
  * `STIME`：启动时间；命令启动的时间。如果一个命令运行已超过 24 小时，这里将显示日期而不是时间。\n\n`ps` 命令还有许多其他有用的选项。这种情况正是你真正想要探索文档并找到对日常工作有用的额外选项的时候。\n\
  \n### pgrep 命令\n\n你通常会结合使用 `ps` 和 `grep` 命令来显示特定的进程：\n\n点击此处查看代码图像\n\n```\n[student@onecoursesource\
  \ ~]$ps -e | grep sleep\n25194 pts/0    00:00:00 sleep\n```\n\n`pgrep` 命令也可以提供类似的功能：\n\
  \n点击此处查看代码图像\n\n```\n[student@onecoursesource ~]$pgrep sleep\n25194\n```\n\n`pgrep`\
  \ 命令的重要选项如表 24-1 所示。\n\n**表 24-1** `pgrep` 命令的选项\n\n| **选项** | **描述** |\n| --- |\
  \ --- |\n| `-G` *name* | 按组名匹配进程。 |\n| `-l` | 显示进程名和 PID。 |\n| `-n` | 优先显示最近启动的进程。\
  \ |\n| `-u` *name* | 按用户 *name* 匹配进程。 |\n\n### top 命令\n\n`top` 命令显示定期更新的进程信息（默认每两秒一次）。`top`\
  \ 命令输出的前半部分包含总体信息，而后半部分显示选定的进程列表。\n\n参见图 24-1 查看 `top` 命令的典型输出。\n\n![Image](img/0096.jpeg)\n\
  \n**图 24-1** *top 命令*\n\n`top` 命令提供了总体统计数据以及进程信息。表 24-2 描述了输出内容。\n\n**表 24-2** `top`\
  \ 命令的输出\n\n| 输出 | 描述 |\n| --- | --- |\n| 第一行 | 源自 `uptime` 命令的输出；详情见“uptime 命令”章节。\
  \ |\n| 第二行 | 运行中的系统进程摘要。 |\n| 第三行 | 自上次刷新以来的 CPU 统计数据。 |\n| 第四行 | 物理内存统计。（注意：在 **top**\
  \ 命令中输入 **E** 可以更改值。） |\n| 第五行 | 虚拟内存统计。 |\n| 剩余行 | 列表及相关信息。 |\n\n在 `top` 命令运行时，你可以输入交互命令来执行更改显示值、重新排序进程列表和杀死（停止）进程等操作。这些交互命令是单字符。重要的交互命令见表\
  \ 24-3。\n\n**表 24-3** 执行 top 中的命令\n\n| 命令 | 描述 |\n| --- | --- |\n| `h` | 帮助；显示交互命令摘要。\
  \ |\n| `E` | 将默认值从字节更改为其他；可用值会循环，直到回到字节。 |\n| `Z` | 切换颜色高亮；使用小写 `z` 切换彩色和无彩色。 |\n\
  | `B` | 切换粗体开启或关闭。 |\n| `<>` | 将排序列向左 (`<`) 或向右 (`>`) 移动。 |\n| `s` | 设置更新值为不同于默认\
  \ 2 秒的值。 |\n| `k` | 通过提供 PID 杀死进程。 |\n| `q` | 退出 `top` 命令。 |\n\n`top` 命令还支持几种命令行选项。重要选项如表\
  \ 24-4 所示。\n\n**表 24-4** `top` 命令的重要选项\n\n| 选项 | 描述 |\n| --- | --- |\n\n\n\n\n\n\
  | `-d` | 设置数据刷新之间的时间。例如，`top -d 5` 意味着数据每 5 秒刷新一次，而不是默认的每 2 秒刷新一次。 |\n| `-n` *number*\
  \ | `top` 命令退出前的最大数据刷新次数。 |\n| `-u` *username* | 仅显示由 *username* 拥有的进程。 |\n\n###\
  \ uptime 命令\n\n尽管 `uptime` 命令不显示单个进程数据，但它确实提供了有关整体进程活动的统计信息。`uptime` 命令显示系统已运行的时间以及其平均负载，如下所示：\n\
  \n点击此处查看代码图片\n\n```\n[student@onecoursesource ~]$ uptime\n 15:06:13 up 2 days, \
  \ 9:09,  3 users,  load average: 0.01, 0.02, 0.05\n```\n\n平均负载表示过去 1、5 和 15 分钟的\
  \ CPU 使用情况（例如为 0.01、0.02 和 0.05）。平均负载与 CPU 的数量有关，下文描述：\n\n*   单 CPU 系统上的平均负载为 1.0\
  \ 意味着 100% 的利用率。\n*   单 CPU 系统上的平均负载为 2.0 意味着 200% 的利用率（这意味着进程经常在等待 CPU，因为正忙碌）。\n\
  *   双 CPU 系统上的平均负载为 1.0 意味着 50% 的利用率。\n*   双 CPU 系统上的平均负载为 2.0 意味着 100% 的利用率。\n\n\
  `uptime` 命令提供对于判断 CPU 是否过载很有用。CPU 利用率持续超过 100% 表示存在问题，并可能导致服务器响应时间延迟。\n\n### 安全提示\n\
  高平均负载可能表明存在黑客尝试。更糟糕的是，这可能是攻击成功的的结果，黑客已系统上放置了情报收集脚本。\n\n### free 命令\n\n`free` 命令显示内存统计信息。尽管该命令不显示每个单独进程使用多少内存，但它确实提供了可用内存和当前使用内存的良好概述。这里是一个示例：\n\
  \n点击此处查看代码图片\n\n```\n[student@onecoursesource ~]$ free\n             total     \
  \  used       free     shared    buffers     cached\nMem:       4048292    3891592\
  \     156700        460     370640    1617812\n-/+ buffers/cache:    1903140   \
  \ 2145152\nSwap:       400000          0          0\n```\n\n值默认以字节（bytes）显示。需要关注的重要区域是总内存以及空闲内存。`shared`、`buffers`\
  \ 和 `cache` 列对开发者来说更为重要。\n\n`Swap` 指“交换空间”，该主题在第 10 章“管理本地存储：要点”以及第 11 章“管理本地存储：高级功能”中有所讨论。记住，交换空间是硬盘存储，在系统内存变满时临时用于存储来自内存的数据。\n\
  \n`free` 命令的重要选项包括如表 24-5 所示。\n\n**表 24-5 free 命令的选项**\n\n| 选项 | 说明 |\n| --- | ---\
  \ |\n| `-k` | 以千字节（KB）显示内存使用。 |\n| `-m` | 以兆字节（MB）显示内存使用。 |\n| `-g` | 以吉字节（GB）显示内存使用。\
  \ |\n| `-s` *n* | 每 *n* 秒更新一次显示。 |\n| `-t` | 显示每列总和的行。 |\n\n### 运行中的进程\n\n通常，进程作为前台作业启动。当进程在前台运行时，启动该进程的\
  \ BASH shell 将不可用。在后台运行的进程会留出 BASH shell 供用户执行额外的命令。\n\n术语 *job* 和 *process*（进程）本质上是可以互换的。系统上运行的任何程序都是进程。作业是从命令行执行的进程。每个\
  \ BASH shell 都会跟踪从该 BASH shell 启动的作业。\n\n**对话式学习™——进程与作业**\n\n**Gary**: 嗨，Julia。你能给我解释一下什么吗？我不理解进程（process）和作业（job）之间的区别。\n\
  \n**Julia**: 嗨，Gary。没问题。让我们从描述进程开始。进程是运行在系统上的任何命令、程序或应用程序。这包括在启动过程中启动的、由其他用户启动的或由其他进程启动的程序。\n\
  \n**Gary**: 好的，我理解。\n\n**Julia**: 作业也是进程。将作业看作系统中运行的所有进程的子集。并不是所有进程都是作业。例如，启动时启动的任何进程都不被视为作业。\n\
  \n**Gary**: 那么，哪些进程被认为是作业呢？\n\n**Julia**: 任何在 shell 中由用户启动的进程。换句话说，任何通过在 shell 中输入命令或程序名称而启动的命令或程序。\n\
  \n**Gary**: 为什么这些进程被称为作业呢？\n\n**Julia**: 因为对作业可以使用某些命令和功能，而这些在其他进程上无法使用。例如，`jobs`\
  \ 命令显示在当前 shell 中启动的所有进程。\n\n**Gary**: 好的，但我也可以通过 `ps` 命令查看这些“作业进程”，对吧？\n\n**Julia**:\
  \ 是的，但重点在于，你通常只想关注由当前 shell 启动的进程，所以 `jobs` 命令在这些情况下通常更有意义。此外，作业具有每个 shell 都是唯一的作业编号。你可以通过\
  \ `jobs` 命令查看这些作业编号，并可以使用它们。\n\n\n\n\n`kill` 命令可更改进程的状态，包括停止（杀死）一个进程。要停止一个进程，首先确定其进程\
  \ ID（PID）或作业号，然后将该数字作为参数提供给 `kill` 命令。进程 ID 方法和作业号两种方法均在示例 24-1 中进行了演示。\n\n## 示例\
  \ 24-1：使用 `kill` 命令停止作业\n\n点击此处查看代码图片\n\n```\n[student@onecoursesource ~]$jobs\n\
  [1]-  Running                 sleep 999 &\n[2]+  Running                 sleep 777\
  \ &\n[student@onecoursesource ~]$kill %2\n[student@onecoursesource ~]$jobs\n[1]-\
  \  Running                 sleep 999 &\n[2]+  Terminated              sleep 777\n\
  [student@onecoursesource ~]$ps -fe | grep sleep\nstudent  17846 12540  0 14:30 pts/2\
  \    00:00:00 sleep 999\nstudent  17853 12540  0 14:31 pts/2    00:00:00 grep --color=auto\
  \ sleep\n[student@onecoursesource ~]$kill 17846\n[student@onecoursesource ~]$ps\
  \ -fe | grep sleep\nstudent  17856 12540  0 14:31 pts/2    00:00:00 grep --color=auto\
  \ sleep\n[1]+  Terminated              sleep 999\n```\n\n`kill` 命令向进程发送信号，告知进程应采取什么操作。该信号可以指定为数字参数或关键字参数。示例\
  \ 24-2 演示了如何列出 `kill` 命令可以向进程发送的所有信号。\n\n## 示例 24-2：列出 Kill 信号\n\n点击此处查看代码图片\n\n\
  ```\n[student@onecoursesource ~]$ kill -l | head -5\n 1) SIGHUP 2) SIGINT3) SIGQUIT4)\
  \ SIGILL 5) SIGTRAP\n 6) SIGABRT7) SIGBUS8) SIGFPE 9) SIGKILL10) SIGUSR1\n11) SIGSEGV12)\
  \ SIGUSR213) SIGPIPE14) SIGALRM15) SIGTERM\n16) SIGSTKFLT17) SIGCHLD18) SIGCONT19)\
  \ SIGSTOP20) SIGTSTP\n21) SIGTTIN22) SIGTTOU23) SIGURG24) SIGXCPU25) SIGXFSZ\n```\n\
  \n示例 24-2 中的输出使用 `head` 命令进行了截断，因为后期的 kill 信号更加晦涩，且没有输出中显示的早期信号那样重要。一些较重要的 kill\
  \ 信号描述在表 24-6 中。\n\n## 表 24-6：重要的 Kill 信号\n\n| 信号 | 说明 |\n| --- | --- |\n| `-1`\
  \ 或 `SIGHUP` | 发送 HUP 信号。更多详情请参见本章后面的“nohup 命令”部分。示例：`kill -1 PID` |\n| `-2` 或 `SIGINT`\
  \ | 键盘中断；相当于按 Ctrl+C 停止正在在前台运行的进程。注意某些进程忽略信号 2，因此这可能无法停止这些进程。示例：`kill -2 PID` |\n\
  | `-9` 或 `SIGKILL` | 强制杀死；不给进程提供任何选择，强制进程退出内存。一个潜在的负面影响是进程没有机会执行保存数据或删除临时文件等操作。示例：`kill\
  \ -9 PID` |\n| `-15` 或 `SIGTERM` | 标准杀死；默认发送此信号。注意某些进程忽略信号 15，因此它可能无法停止那些进程。示例：`kill\
  \ -15 PID` |\n\n### 安全提示\n\n由于存在潜在的负面影响，在停止进程时应避免使用信号 9，至少最初是如此。通过发出常规的 `kill` 命令允许进程优雅地关闭，等待约\
  \ 30 秒，然后尝试 `kill -9` 命令。\n\n如果你尝试停止的程序开发者决定忽略常规 kill 信号，或者黑客已经接控制并在系统上执行了潜在有害的进程，则\
  \ `-9` 选项可能是必要的。\n\n### pkill 命令\n\n使用 `kill` 命令向进程发送信号时，你通过提供 PID（进程 ID）来指定进程。使用\
  \ `pkill` 命令，你可以提供进程名、用户名或其他方法来指定要向哪个进程（或进程）发送信号。例如，以下命令将向用户 sarah 拥的所有进程发送 kill\
  \ 信号：\n\n点击此处查看代码图片\n\n```\n[student@onecoursesource ~]$pkill -u sarah\n```\n\n\
  表 24-7 显示了重要的选项。\n\n## 表 24-7：pkill 选项\n\n| 选项 | 说明 |\n| --- | --- |\n| `-G` | 匹配组\
  \ ID。 |\n| `-u` | 匹配用户名。 |\n| `-x` | 精确匹配进程名。 |\n| `-n` | 使用正则表达式匹配进程名。 |\n\n###\
  \ killall 命令\n\n`killall` 命令用于停止特定名称的所有进程。示例：\n\n点击此处查看代码图片\n\n```\n[student@onecoursesource\
  \ ~]$killall firefox\n```\n\n表 24-8 显示了重要的选项。\n\n## 表 24-8：killall 选项\n\n| 选项 |\
  \ 说明 |\n| --- | --- |\n| `-I` | 忽略大小写。 |\n| `-i` | 交互模式；在发送前提示。 |\n| `-r` | 使用正则表达式匹配进程名。\
  \ |\n| `-s` | 改为发送信号。 |\n| `-v` | 详细；报告是否发送了进程。 |\n\n### xkill 命令\n\n你可以通过运行 `xkill`\
  \ 命令然后点击你想要停止的进程来杀死进程。参考图 24-3。\n\n## 图 24-3：使用 xkill 停止\n\n运行 `xkill` 的第一步是看到窗口。\n\
  \n![图像](img/000.jpg)\n\n### nohup 命令\n\n每个进程都有一个启动它的父进程。例如，如果你在 BASH shell 中执行命令，那么该命令的父进程就是\
  \ BASH shell。\n\n当父进程被停止时，会向所有进程发送 HUP 信号。这种 HUP 信号旨在停止进程。默认情况下，子进程在收到 HUP 信号时会停止。\n\
  \n为了避免这种情况，请使用 `nohup` 命令执行子进程：\n\n点击此处查看代码图片\n\n```\n[student@onecoursesource ~]$nohup\
  \ some_command\n```\n\n这种技术通常用于远程登录系统并希望在断开后让某些命令继续运行。\n\n### 进程优先级\n\n“Nice”值用于指示\
  \ CPU 哪个进程访问 CPU 的优先级更高。值的范围从 `-20`（最高优先级）到 `19`（最低优先级）。用户创建的作业的默认优先级为 `0`。你可以通过运行\
  \ `nice` 命令来为新进程设置优先级值。要更改现有进程的优先级值，请使用 `renice` 命令。\n\n#### nice 命令\n\n要指定不同于默认的“nice”值，通过\
  \ `nice` 命令执行作业：\n\n点击此处查看代码图片\n\n```\n[student@onecoursesource ~]$nice -n 5 firefox\n\
  ```注意，普通用户不能分配负 nice 值。这些值只能由 root 用户使用。\n\n要查看进程的 nice 值，使用 `ps` 命令的 `-o` 选项并包含“nice”的值：\n\
  \n\n\n\n\n```\n[student@onecoursesource ~] ps -o nice,pid,cmd\n NI   PID CMD\n \
  \ 0 23865 -bash\n  5 27967 firefox\n  0 27969 ps -o nice,pid,cmd\n```\n\n## renice\
  \ 命令\n\n使用 `renice` 命令更改现有作业的 nice 值，如 示例 24-3 所示。\n\n**示例 24-3** 使用 `renice` 更改现有作业的\
  \ Nice 值\n\n点击此处查看代码\n\n```\n[student@onecoursesource ~] ps -o nice,pid,cmd\n NI\
  \   PID CMD\n  0 23865 -bash\n 5 28235 sleep 999\n  0 28261 ps -o nice,pid,cmd\n\
  [student@onecoursesource ~] renice -n 10 -p 28235\n28235 (process ID) old priority\
  \ 5, new priority 10\n[student@onecoursesource ~] ps -o nice,pid,cmd\n NI   PID\
  \ CMD\n  0 23865 -bash\n 10 28235 sleep 999\n  0 28261 ps -o nice,pid,cmd\n```\n\
  \n### 注意\n\n普通用户（非 root）只能将现有进程的优先级降低为较低优先级。只有 root 用户可以将进程优先级更改为高优先级。\n\n`renice`\
  \ 命令的重要选项包括表 24-9 所示的选项。\n\n**表 24-9** `renice` 命令的选项\n\n| 选项 |  |\n| --- | ---\
  \ |\n| `-g` *group* | 更改所有属于该*组*的文件优先级。 |\n| `-u` *user* | 更改所有属于该*用户*的文件优先级。 |\n\
  \n### 总结\n\n在本章中，你探索了如何控制进程，包括如何启动、暂停、恢复和停止进程。你还学习了显示进程信息的几种技巧以及更改进程 CPU 优先级的方法。\n\
  \n#### 关键术语\n\nProcess\n\nPID\n\nTTY\n\nterminal\n\nkill\n\njob\n\nbackground process\n\
  \nforeground process\n\nHUP\n\n#### 复习题\n\n**1.** `_____` 命令用于显示在在系统上运行的所有进程。\n\n\
  **2.** 哪个命令被用于定期显示进程信息（默认每 2 秒一次）？\n\n1. `free`\n2. `uptime`\n3. `top`\n4. `jobs`\n\
  \n**3.** 进程的 CPU 优先级由 ____ 的 nice 值指定。\n\n**4.** 哪个命令可以停止进程执行？（选择所有适用项）\n\n1. `stop`\n\
  2. `skill`\n3. `pkill`\n4. `xkill`\n\n**5.** 如果父进程停止，可以使用 `_____` 命令防止进程终止。\n\n\
  ## 第 25 章 系统日志\n\n系统日志对于以下几个原因至关重要：这些日志为管理员提供了故障排除所需的信息。此外，日志还可以提供有关服务的常规信息。复杂之处在于有不同的日志方法。某些\
  \ Linux 发行版使用较旧的 `syslog` 技术，而另一些发行版使用较新的 `rsyslog` 或 `journald`。这两种技术在本章中均有涵盖。在阅读本章并完成练习后，你将能够以下操作：\n\
  \n* 查看系统日志\n* 配置 `syslog`\n* 轮转日志文件\n* 查看 `journald` 日志\n\n#### Syslog\n\n`syslog`\
  \ 服务自 1980 年以来一直存在。尽管当时它是先进的，但随着对复杂日志技术的需求，其局限性日益增长。在 1990 年代后期，创建了 `syslog-ng`\
  \ 服务以扩展传统 `syslog` 的功能。在 2000 年代中期，创建了 `rsyslog` 服务（包括 TCP 支持在内）。\n\n#### syslogd\
  \ 进程\n\n`syslog` 进程负责记录。它决定记录哪些事件以及将它们放在何处。配置文件通常为 `/etc/syslog` 或 `/etc/rsyslog.conf`。\n\
  \n**表 25-1** syslogd 选项\n\n| 选项 | 说明 |\n| --- | --- |\n| `-d` | 启用调试模式。 |\n| `-f`\
  \ | 指定配置文件。 |\n| `-m` | 每隔分钟创建一个时间戳。 |\n| `-r` | 允许进程接受远程消息。 |\n| `-S` | 详细模式。 |\n\
  | `-x` | 禁用 DNS 查询。 |\n\n### 安全要点\n\nLog `rsyslog` 或 `syslog` 文件用于指定日志记录。大多数现代发行版使用\
  \ `rsyslog` 或 `syslog-ng`。配置文件位于 `/etc/rsyslog.conf` 或 `/etc/syslog`。\n\n无论文件位于何处，其内容如下：\n\
  \n点击此处查看代码\n\n```\nroot@onecoursesource:~# more /etc/default/rsyslog\n# Options\
  \ for rsyslog\n# -x disables DNS lookups\n# See rsyslog(8) for more details\nRSYSLOG_OPTIONS=\"\
  \"\n```\n\n你通过使用 `RSYSLOG_OPTIONS` 变量指定表 25-1 中描述的选项。例如，将当前系统配置为 syslog 服务器，请使用以下：\n\
  \n```\nRSYSLOG_OPTIONS=\"-r\"\n```\n\n**注意**\n\n如果你在一个仍使用 `syslog` 的旧系统上工作，该日志文件唯一的真实区别是它的名称（`syslog`\
  \ 而不是 `rsyslog`）。此外，`rsyslog` 支持本章未提到的更多选项。\n\n#### /var/log 目录\n\n`/var/log` 目录是\
  \ `syslogd` 和 `rsyslogd` 进程放置日志文件的标准位置。这些进程创建的精确文件因发行版而异。以下描述了一些常用的创建文件：\n\n* `/var/log/auth.log`:\
  \ 与身份验证操作相关的日志条目（通常的用户登录系统）。\n* `/var/log/syslog`: 该文件中存储了各种日志条目。\n* `/var/log/cron.log`:\
  \ 与 `crond` 进程相关的日志条目（`crontab` 和 `at` 操作）。\n* `/var/log/kern.log`: 来自内核的日志条目。\n\
  * `/var/log/mail.log`: 邮件服务器的日志条目（尽管 Postfix 通常将其日志记录存储在单独的位置）。\n\n\n\n\n\n并不是 `/var/log`\
  \ 目录下的日志文件都由 `syslogd` 守护进程创建。许多现代服务创建并管理独立于 `syslogd` 的日志文件。可以将 `syslogd` 守护进程的条目视为操作系统的一部分，而独立的进程（如\
  \ Web 服务器、打印服务器和文件服务器）会为每个进程创建日志文件。你在 `/var/log` 目录中会发现哪些额外文件，很大取决于你的系统提供了哪些服务。\n\
  \n### 安全亮点\n\n非 `syslogd` 日志文件与 `syslogd` 管理的日志同样重要。当你为处理日志文件制定安全策略时，请务考虑这些额外的日志文件。\n\
  \n### /etc/syslog.conf 文件\n\n`/etc/syslog.conf` 文件是 `syslogd` 守护进程的配置文件，它告诉守护进程将接收到的日志条目发送到何处。以下展示了一个去除了注释和空行的典型\
  \ `syslog.conf` 文件：\n\n点击此处查看代码图像\n\n```\n[root@localhost ~]# grep -v \"^$\" /etc/syslog.conf\
  \ | grep -v \"^#\"\n*.info;mail.none;authpriv.none;cron.none       /var/log/messages\n\
  authpriv.*                                      /var/log/secure\nmail.*        \
  \       -/var/log/maillog\ncron.*                                          /var/log/cron\n\
  *.emerg                                        *\nuucp,news.crit               \
  \                   /var/log/spooler\nlocal7.*                /var/log/boot.log\n\
  ```\n\n每一行代表一条日志规则，分为两个主要部分：选择器（例如，`uucp,news.crit`）和动作（例如，`/var/log/spooler`）。选择器也分为两部分：设施（例如，`uucp,news`）和优先级（例如，`crit`）。\n\
  \n以下列表了可用的设施（facilities）及其简要描述：\n\n*   `auth (or security)`：与系统认证相关的日志消息（例如用户登录时）。\n\
  *   `authpriv`：与非系统认证相关的日志消息（例如 Samba 等服务验证用户时）。\n*   `cron`：从 `crond` 守护进程发送的日志消息。\n\
  *   `daemon`：从各种守护进程发送的日志消息。\n*   `kern`：从内核发送的日志消息。\n*   `lpr`：从旧的过时的打印服务器发送的日志消息。\n\
  *   `mail`：从邮件服务器（通常是 sendmail）发送的日志消息。\n*   `mark`：旨在在日志文件中放置时间戳的日志消息。\n*   `news`：用于新闻服务器（一种过时的\
  \ Unix 服务器）的日志消息。\n*   `syslog`：由 `syslogd` 生成的日志消息。\n*   `user`：用户级日志消息。\n*   `uucp`：由\
  \ uucp 生成的日志消息（一种过时的 Unix 服务器）。\n*   `local0 through local7`：由非标准服务或 shell 脚本可以生成的自定义日志消息。更多信息请参阅本章后面对\
  \ `logger` 命令的讨论。\n*   `*`：代表所有设施。\n\n以下列表显示了可用的优先级级别，按从从低到高排序：\n\n*   `debug`：与调试服务问题相关的消息。\n\
  *   `info`：关于服务的通用信息。\n*   `notice`：比 info 消息稍严重，但尚未达到需要警告的程度。\n*   `warning (or\
  \ warn)`：表示某些轻微错误。\n*   `err (or error)`：表示更严重的错误。\n*   `crit`：非常严重的错误。\n*   `alert`：表示必须解决某种情况，因为系统或服务接近崩溃。\n\
  *   `emerg (or panic)`：系统或服务正在崩溃或已完全崩溃。\n*   `*`：代表所有级别。\n\n实际上，使用什么优先级级别来发送消息是由软件开发者决。例如，开发\
  \ `crond` 守护进程的人可能认为 `crontab` 文件中的错误是警告级优先级，或者他们可能选择将其错误级优先级。通常来说，`debug`、`info`\
  \ 和 `notice` 优先级级别是供参考（FYI）类型的消息，而 `warning` 和 `error` 意味着“这是你应该检查的内容”，而 `crit`、`alert`\
  \ 和 `emerg` 意味着“不要忽略这个；这里有严重问题”。\n\n一旦确定了严重性，`syslogd` 守护进程需要确定对日志条目采取什么动作。以下列表显示了可用的动作：\n\
  \n*   `Regular file`：位于 `/var/log` 目录下的用于放置日志条目的的文件。\n*   `Named pipes`：此主题超出了本书的范围，但本质上是将日志条目发送到另一个进程的技术。\n\
  *   `Console or terminal devices`：记得终端设备用于在登录会话中显示信息。通过将消息发送到特定的终端窗口，你可以让当前打开该窗口的用户看到。\n\
  *   `Remote hosts`：发送到远程日志服务器。\n*   `User(s)`：写入指定用户的终端窗口（使用 `*` 表示所有用户）。\n\n###\
  \ 安全亮点\n\n非 `syslogd` 日志文件与 `syslogd` 管理的日志同样重要。当你为处理日志文件制定安全策略时，请考虑这些额外的日志文件。\n\
  \n你会看到两种指定要写入文件的格式：\n\n`/var/log/maillog`\n\n`-/var/log/maillog`\n\n如果你在文件名之前没有连字符（`-`\
  \ 字符），每个日志条目都会导致 `syslogd` 守护进程写入硬盘。这将对邮件服务器等系统产生性能影响，因为收到的或发送的每封邮件产生产生日志条目。\n\n\
  如果你在文件名之前放置连字符，`syslogd` 守护进程将进行“批量”写入，这意味着每个日志条目都不会导致硬盘写入，而是 `syslogd` 守护进程会收集一组此类消息并一次性写入。\n\
  \n那么，为什么这是一个安全问题？如果你的 syslog 守护进程产生的硬盘写入过多，严重影响了系统性能，那么关键操作可能会失败，导致数据丢失或无法访问关键数据。\n\
  \n### 对话式学习——远程日志服务器\n\n**Gary**: Julia……我有个问题想问你。\n**Julia**: 什么问题？\n**Gary**:\
  \ 我被要求从我们的一台服务器发送日志消息到远程日志服务器。为什么这很重要？\n**Julia**: 噢，这在系统关键服务器上很常见，特别是当它们连接到互联网时。想象一下你是一个黑客，已经未经授权访问了目标服务器。一旦获得访问，你可能想掩盖自己的足迹。猜猜你可能会做什么？\n\
  **Gary**: 噢，我明白了！我会删除日志文件！这样没人知道我是如何进入系统的。该死，他们可能根本不知道我访问过系统！\n**Julia**: 没错，但如果那些日志文件也被复制到了另一台服务器呢？\n\
  **Gary**: 噢，那么掩盖足迹就困难得多了。我必须黑进另一个系统，可能那个系统有不同的账户和服务，这会让事情变得困难得多。\n**Julia**: 现在你知道为什么想把日志文件的副本发送到另一台服务器了。\n\
  **Gary**: 谢谢，Julia！\n**Julia**: 乐意效劳，Gary。\n\n### /etc/rsyslog.conf 文件\n\n大多数现代系统使用\
  \ `rsyslogd` 守护进程而不是 `syslogd` 守护进程。较新的 `rsyslod` 守护进程具有更多功能，但旧 `syslogd` 守护进程的大多数功能仍然有效。\n\
  \n例如，尽管 `/etc/rsyslog.conf` 文件中存在一些 `/etc/syslog.conf` 中不存在的功能，但本章之前描述的内容对于新的配置文件仍然有效。\n\
  \n\n\n\n您应该意识到 `/etc/rsyslog.conf` 文件中的几个新特性。其中一个特性是使用模块的能力。模块提供了更多功能；例如，下面的模块允许\
  \ `rsyslogd` 守护进程通过 TCP 协议接受来自远程系统的日志消息：\n\n点击此处查看代码图片\n\n```\n# provides TCP syslog\
  \ reception\n#$ModLoad imtcp\n#$InputTCPServerRun 514\n```\n\n此外，`/etc/rsyslog.conf`\
  \ 文件中一个名为 `GLOBAL DIRECTIVES`（全局指令）的新扇区允许您为所有日志文件条目提供设置。例如，以下内容将设置由 `rsyslogd` 守护进程创建的任何新日志文件的所有者、组所有者权限：\n\
  \n点击此处查看代码图片\n\n```\n# Set the default permissions for all log files.\n#\n$FileOwner\
  \ syslog\n$FileGroup adm\n$FileCreateMode 0640\n```\n\n最后一个重大变化是大多数日志规则不再存储在 `/etc/rsyslog.conf`\
  \ 文件中，而是存储在 `/etc/rsyslog.d` 目录的文件。这些文件可以如下所示包含在主配置文件：\n\n点击此处查看代码图片\n\n```\n# Include\
  \ all config files in /etc/rsyslog.d/\n#\n$IncludeConfig /etc/rsyslog.d/*.conf\n\
  ```\n\n通过使用“包含”目录，您可以通过向目录中添加或删除文件来快速添加或删除大量日志规则。\n\n### 创建您自己的 `/etc/syslog.conf`\
  \ 条目\n\n读取现有 `/etc/syslog.conf` 条目的能力很重要，但能够创建自己的条目也很有用。创建一个条目包括首先修改 `/etc/syslog.conf`\
  \ 文件，然后重启 `syslogd` 服务。在 `syslogd` 服务重启后，您应该使用 `logger` 命令测试您的新条目。\n\n#### 添加条目\n\
  \n首先，确定您想要捕获什么种类型的条目。例如，通常所有 `crond` 守护进程日志消息都发送到 `/var/log/cron` 文件，这是因为 `/etc/syslog.conf`\
  \ 文件中有如下条目：\n\n点击此处查看代码图片\n\n```\ncron.*                                       \
  \   /var/log/cron\n```\n\n如果您还想将 `crit` 优先级及以上的 `cron` 消息发送到 root 用户的终端窗口该怎么办？您可以向\
  \ `/etc/syslog.conf` 文件添加以下条目：\n\n点击此处查看代码图片\n\n```\ncron.crit                 \
  \                      root\n```\n\n当您指定一个优先级时，所有该优先级级别及以上（更严重）的消息都会发送到目的地。要仅捕获特定优先级级别的消息，请使用以下语法：\n\
  \n点击此处查看代码图片\n\n```\ncron.crit                                      root\n```\n\n\
  ```发送消息的另一种方法是从您创建的脚本。您可以在脚本中执行 `logger` 命令（见下一节）来创建日志条目，但您可能不想使用标准设施（如 `cron` 和\
  \ `mail`），因为这些已经与特定的服务关联。相反，请使用自定义设施（`local0`、`local1` 等）。这些值中的最大值 `local7`。这是一个示例：\n\
  \n```\nlocal7.* /var/log/custom\n```\n\n在做出这些更改并保存 `/etc/syslog.conf` 文件后，重启 `syslogd`\
  \ 服务（重启服务的详情请参见 第 28 章，“系统启动](#part0046.html_ch28)”）。然后使用 `logger` 命令测试您的新条目。\n\n\
  **可能会出现什么问题？**\n\n`/etc/syslog.conf` 文件中的错误可能会对现有日志规则产生影响。请确保始终使用 `logger` 命令来测试新规则。\n\
  \n#### 使用 `logger` 命令\n\n`logger` 工具可将日志条目发送到 `syslogd` 守护进程：\n\n点击此处查看代码图片\n\n\
  ```\n[root@localhost ~]# logger -p local7.warn \"warning\"\n```\n\n`logger` 命令的重要选项提供在\
  \ 表 25-2 中。\n\n**表 25-2** 重要 `logger` 命令选项\n\n| **选项** | **描述** |\n\n| --- | ---\
  \ |\n| `-i` | 记录 logger 进程的 PID。 |\n| `-s` | 将消息输出到 STDERR 的同时发送到 `syslogd` 守护进程。\
  \ |\n| `-f` `file` | 使用 `file` 的内容作为消息。 |\n| `-p` | 指定设施和优先级。 |\n| `-t` | 为日志条目标记标签。\
  \ |\n\n### `logrotate` 命令\n\n`logrotate` 是一个用于处理日志轮转的实用。`logrotate` 配置文件位于 `/etc/logrotate.conf`。`logrotate`\
  \ 命令通常由 `cron` 自动运行。\n\n\n\n\n# 日志轮转配置\n\n| 选项 | 说明 |\n| --- | --- |\n| `mail address`\
  \ | 将备份日志文件发送至 `address`。 |\n| `minsize X` | 仅当日志大小至少达到 `X` 指定的值时才进行轮转。 |\n| `nocompress`\
  \ | 不对日志文件的备份副本进行压缩。 |\n| `olddir dir` | 将备份日志文件放置在 `dir` 目录。 |\n\n`/etc/logrotate.d`\
  \ 目录下的文件用于覆盖 `logrotate` 工具在 `/etc/logrotate.conf` 文件中的默认设置。这些文件的设置与 `/etc/logrotate.conf`\
  \ 文件的设置相同。\n\n通过使用这个“包含”目录，你可以通过添加或删除 `/etc/logrotate.d` 目录中的文件来轻松插入或移除日志轮转规则。\n\
  \n## journalctl 命令\n\n在现代 Linux 系统中，日志进程由 `systemd-journald` 服务处理。要查询 `systemd`\
  \ 日志条目，请使用 `journalctl` 命令，如示例 25-2 所示。\n\n### 示例 25-2：使用 `journalctl` 命令\n\n点击此处查看代码图像\n\
  \n```\n[root@localhost ~]#journalctl | head\n-- 日志开始于 Tue 2019-01-24 13:43:18 PST，结束于\
  \ Sat 2019-03-04 16:00:32 PST. --\nJan 24 13:43:18 localhost.localdomain systemd-journal[88]:\
  \ Runtime journal is using 8.0M (max allowed 194.4M, trying to leave 291.7M free\
  \ of 1.8G available → current\nlimit 194.4M).\nJan 24 13:43:18 localhost.localdomain\
  \ systemd-journal[88]: Runtime journal is using 8.0M (max allowed 194.4M, trying\
  \ to leave 291.7M free of 1.8G available → current\nlimit 194.4M).\nJan 24 13:43:18\
  \ localhost.localdomain kernel: Initializing cgroup subsys cpuset\nJan 24 13:43:18\
  \ localhost.localdomain kernel: Initializing cgroup subsys cpu\nJan 24 13:43:18\
  \ localhost.localdomain kernel: Initializing cgroup subsys cpuacct\nJan 24 13:43:18\
  \ localhost.localdomain kernel: Linux version 3.10.0-327.18.2.el7.x86_64 (builder@kbuilder.dev.centos.org)\
  \ (gcc version 4.8.3 20140911 (Red Hat 4.8.3-9) (GCC) ) #1 SMP Thu May 12 11:03:55\
  \ UTC 2016\nJan 24 13:43:18 localhost.localdomain kernel: Command line: BOOT_IMAGE=/vmlinuz-3.10.0-327.18.2.el7.x86_64\
  \ root=/dev/mapper/centos-root ro rd.lvm.lv=centos/root rd.lvm.lv=centos/swap crashkernel=auto\
  \ rhgb quiet LANG=en_US.UTF-8\nJan 24 13:43:18 localhost.localdomain kernel: e820:\
  \ BIOS-provided physical RAM map:\nJan 24 13:43:18 localhost.localdomain kernel:\
  \ BIOS-e820: [mem 0x0000000000000000-0x000000000009fbff] usable\n```\n\n`journalctl`\
  \ 命令的重要选项包括表 25-4 所示所示。\n\n### 表 25-4：journalctl 命令的选项\n\n| 选项 | 说明 |\n| --- | ---\
  \ |\n| `--all or -a` | 以完整格式显示所有字段。 |\n| `-r` | 反转日志顺序，优先显示最新的条目。 |\n| `-k` | 仅显示内核消息。\
  \ |\n| `--priority=value` | 仅显示匹配优先级 `value`的消息（`emerg`, `alert`, `crit`, `err`,\
  \ `warning`, `notice`, `info` 或 `debug`）。 |\n\n## /etc/systemd/journald.conf 文件\n\
  \n`/etc/systemd/journald.conf` 文件用于配置 `systemd-journald` 服务。通常，该文件默认包含所有被注释掉的值`/etc/systemd/journald.conf`\
  \ 的重要设置包括表 25-5 所示。\n\n### 表 25-5：/etc/systemd/journald.conf 文件的设置\n\n| 设置 | 说明\
  \ |\n| --- | --- |\n| `Storage=value` | 存储日志的位置；`value` 可以是“volatile”。 |\n\n\n\n\
  \n\n软件包是一个包含软件程序及额外所需组件的文件。例如，考虑一个 Web 服务器软件程序。该程序为 Web 客户端提供网页，但它需要额外的数据（如配置文件数据）来执行其工作。\n\
  \n从某种意义上说，软件包就像第 2 章中讨论的“在命令行上工作”中的 tar 文件。它包含了组成完整软件程序的文件集合。然而，它还包含额外信息，例如元数据（关于软件的信息；谁创建了它、何时发布的等）和依赖项。`依赖`\
  \ 是一个软件程序依赖于另一个程序的术语。\n\n红帽软件包的命名规范（例如，`ntpdate-4.7.6p5-22.fc27.x86_64.rpm`）描述在图\
  \ 26-1](#part0044.html_fig26_1)中。\n\n![Image](img/00100.jpeg)\n\n**图 26-1** *红帽软件包名称的组件*\n\
  \n包名提供了关于软件包本身的基本信息。软件包可能会根据包提供的主要命令命名，也可能根据整个软件项目命名。\n\n软件包版本可能会有点困惑，因为关于版本没有规则。通常，版本中的第一个数字（`ntpdate-4.7.6p5-22.fc27.x86_64.rpm`\
  \ 中的“4”）是主发布版本，第二个数字（`ntpdate-4.7.6p5-22.fc27.x86_64.rpm` 中的“7”）是次要发布版本。除此以外，完全取决于软件供应商。某些供应商在版本中使用多达六个数字，而某些则使用字母字符（例如“6p5”）。\n\
  \n维护 Linux 发行版的开发者通常会在包名中添加一个“发行版（distro）”数字。例如，图 26-1](#part0044.html_fig26_1)\
  \ 中的“fc27”意味着“Fedora 第 27 版”。这表明在重新打包之前，可能专门该发行版对软件进行了某些更改。\n\n架构通常为 32 位平台（“x86”）或\
  \ 64 位平台（“x86_64”），但支持非 Intel 平台的发行版将具有不同的架构值。你可能还会看到“noarch”，这意味着包中的软件不依赖于任何特定架构。\n\
  \n### 如何获取软件包\n\n如果你正在使用如 `yum` 或 `dnf` 的命令，这些工具可以自动为你下载软件包。然而，如果你正在使用 `rpm` 命令安装软件包，你需要手动查找并下载软件包（或使用\
  \ `rpm` 命令的选项来告诉它从哪里获取软件包）。\n\n软件包有多个来源，包括以下几个：\n\n*   **发行版网站**：每个发行版都有自己的服务器。\n\
  *   **[www.rpmfind.net](http://www.rpmfind.net)**：一个拥有 RPM 软件包的网站。\n*   **[rpm.pbone.net](http://rpm.pbone.net)**：一个拥有\
  \ RPM 软件包的网站。\n*   **独立项目网站**：任何创建设计在基于红帽的发行版上运行的软件的供应商，都可能拥有一个可以直接下载软件的网站。\n* \
  \  **[GitHub.com](http://GitHub.com)**：许多软件供应商也通过此网站共享代码。\n\n### 安全提示\n\n下载软件时要非常小心。因为软件必须由\
  \ root 用户安装，这为黑客入侵你的系统提供了了方便的方法。黑客会将有效软件重新打包，并带有一些旨在破坏你系统的额外工具。\n\n### `/var/lib/rpm`\
  \ 目录\n\n虽然你很少直接对 `/var/lib/rpm` 目录执行任何任务，但你应该意识到这是存储所有软件包元数据的地方。软件包元数据是关于软件包的信息，例如软件包构建日期和构建软件包的供应商。每当你安装新软件（或删除软件）时，`/var/lib/rpm`\
  \ 目录中的数据库就会发生变化：\n\n点击查看代码图像\n\n```\n[root@onecoursesource ~]#ls /var/lib/rpm\n\
  Basenames     __db.002  Group       Obsoletename  Requirename  Triggername\nConflictname\
  \  __db.003  Installtid  Packages      Sha1header\n__db.001      Dirnames  Name\
  \        Providename   Sigmd5\n```\n\n虽然你应该意识到此目录的存在以及其目的是存储关于软件包的信息，但你不应该直接修改这些文件中的任何一个。偶尔你可能需要重新构建这些文件中的数据库，但这应该通过执行\
  \ `rpm --rebuilddb` 命令来实现。\n\n### 使用 rpm 命令\n\nRPM 原本是 Red Hat Package Manager（红帽软件包管理器）的缩写。随着更多发行版开始使用\
  \ RPM 系统管理软件包，RPM 被重新定义为 RPM Package Manager（一个递归缩写——技术上说是一个“回写缩写（back acronym）”，因为其定义中包含了缩写本身），由于包括红帽企业\
  \ Linux（RHEL）、Fedora 和 SUSE 在许多发行版中使用了它。\n\n**对话式学习：为什么使用 rpm？**\n\n**Gary**：Julia，你能对\
  \ `rpm` 命令可以解释一下吗？\n\n**Julia**：是的，我会尽力解释一下 `rpm` 命令的用法。\n\n**Gary**：好的，我发现 `yum`\
  \ 和 `dnf` 似乎更好用。\n\n**Julia**：是的，`yum` 和 `dnf` 是前端工具，而它们底层使用 `rpm` 命令。\n\n**Gary**：那么我为什么应该直接使用\
  \ `rpm` 命令呢？\n\n**Julia**：有很多原因。例如，假设你有一个没有依赖项的 `rpm` 文件，你可以通过 `rpm` 命令安装它。\n\n\
  **Gary**：好的，还有其他情况吗？\n\n**Julia**：是的，假设有人发了一个 `rpm` 文件，而你想在安装之前查看它的信息。`rpm` 命令可以很好地处理这种情况。\n\
  \n**Gary**：很好的观点。我不想在不看一眼的情况下安装它！\n\n**Julia**：没错。此外，你还可以使用名为 `rpm2cpio` 的基于 `rpm`\
  \ 的命令从软件包中手动提取文件。\n\n**Gary**：你说服我了！我应该详细学习 `rpm` 命令及其功能。谢谢，Julia。\n\n### 列出 rpm\
  \ 信息\n\n要列出所有已的软件包，请执行 `rpm -qa` 命令。`-q` 表示“查询（query）”，`-a` 选项表示“所有（all）”（注意由于典型系统中有数百个软件包，这里使用了\
  \ `head` 命令来限制输出），如示例 26-1](#part0044.html_exa26_1）所示。\n\n**示例 26-1** *`rpm -qa`\
  \ 命令*\n\n点击查看代码图像\n\n```\n[root@onecoursesource ~]# rpm -qa | head\npciutils-libs-3.3.0-1.fc20.x86_64\n\
  iptables-services-1.4.19-1.fc20.x86_64\nbouncycastle-pg-1.46-10.fc20.noarch\nperl-HTTP-Negotiate-6.01-7.fc20.noarch\n\
  php-pdo-5.5.26-1.fc20.x86_64\nvim-filesystem-7.4.475-2.fc20.x86_64\nsisu-inject-0.0.0-0.4.M4.fc20.noarch\n\
  perl-DBD-Pg-2.19.3-6.fc20.x86_64\nphp-bcmath-5.5.26-1.fc20.x86_64\nzlib-1.2.8-3.fc20.x86_64\n\
  ```\n\n\n\n\n\n要查看基础包信息，请执行以下命令：`rpm -qi *pkgname*`。将 `pkgname` 替换为您想要显示的包名称。请参示例\
  \ 26-2 示例。\n\n### 示例 26-2 *查看包信息*\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]#\
  \ rpm -qi zlib\nName        : zlib\nVersion     : 1.2.11\nRelease     : 3.fc28\n\
  Architecture: x86_64\nInstall Date: Tue 6 Feb 2019 09:09:01 AM PST\nGroup      \
  \ : System Environment/Libraries\nSize        : 188163\nLicense     : zlib and Boost\n\
  Signature   : RSA/SHA256, Tue 28 Aug 2017 02:04:04 AM PDT, Key ID 2eb161fa246110c1\n\
  Source RPM  : zlib-1.2.8-3.fc20.src.rpm\nBuild Date  : Sat 26 Aug 2017 06:42:20\
  \ AM PDT\nBuild Host  : buildvm-05.phx2.fedoraproject.org\nRelocations : (not relocatable)\n\
  Packager    : Fedora Project\nVendor      : Fedora Project\nURL         : http://www.zlib.net/\n\
  Summary     : The compression and decompression library\nDescription :\nZlib is\
  \ a general-purpose, patent-free, lossless data compression\nlibrary which is used\
  \ by many different programs.\n```\n\n注意，`rpm -qi` 命令输出中的重要信息包括版本、发行版本和安装日期。描述也可以有助于确定该软件包包的设计用途。\n\
  \n要列出该包安装的文件，请执行以下命令：`rpm -ql *pkgname*`。在安装软件包后立即运行此命令是非常实用的，这样您就可以了解系统中添加了哪些新文件。这是一个示例：\n\
  \n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# rpm -ql zlib\n/usr/lib64/libz.so.1\n\
  /usr/lib64/libz.so.1.2.8\n/usr/share/doc/zlib\n/usr/share/doc/zlib/ChangeLog\n/usr/share/doc/zlib/FAQ\n\
  /usr/share/doc/zlib/README\n```\n\n如果该包提供了某种服务，那么该服务可能会有配置文件。要列出包的配置文件，执行以下命令：`rpm\
  \ -qc *pkgname*`。例如：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# rpm -qc vsftpd\n\
  /etc/logrotate.d/vsftpd\n/etc/pam.d/vsftpd\n/etc/vsftpd/ftpusers\n/etc/vsftpd/user_list\n\
  /etc/vsftpd/vsftpd.conf\n```\n\n注意，上一个示例中没有使用 `zlib` 包，因为它没有配置文件：\n\n点击此处查看代码图片\n\
  \n```\n[root@onecoursesource ~]# rpm -qc zlib\n[root@onecoursesource ~]#\n```\n\n\
  查看包提供的文档文件也是很有用的。这允许您查看有关如何使用随包软件的详细信息。要列出文档文件，执行以下命令：`rpm -qd *pkgname*`。例如：\n\n\
  点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# rpm -qd zlib\n/usr/share/doc/zlib/ChangeLog\n\
  /usr/share/doc/zlib/FAQ\n/usr/share/doc/zlib/README\n```\n\n如果您发现系统中已经存在某个文件，并想知道是否有其他文件也是作为包的一部分被安装的怎么办？当文件被修改过时这非常有用，因为您可以直接从包中检索原始文件。要查看某个文件源自哪个包，使用\
  \ `rpm -qf *filename*` 命令：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# rpm -qf\
  \ /usr/lib64/libz.so.1\nzlib-1.2.8-3.fc20.x86_64\n```\n\n如果包中的一个文件被修改或删除，那么该包的其他文件可能也被修改或删除。要获取包中所有文件的状态列表，使用\
  \ `rpm -V *pkgname*` 命令：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# rpm -V\
  \ clamd\n.....UG..    /var/clamav\nmissing     /var/run/clamav\n```\n\n`rpm -V`\
  \ 命令的输出可能有点难以理解。如果包中的文件被修改或删除，那么该包的其他文件可能也被修改或删除。要获取包中所有文件的状态列表，使用 `rpm -V *pkgname*`\
  \ 命令：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# rpm -V clamd\n.....UG..  \
  \  /var/clamav\nmissing     /var/run/clamav\n```\n\n`rpm -V` 命令的输出可能有点难以理解。如果包中的文件被修改或删除，那么该包的其他文件可能也被修改或删除。要获取包中所有文件的状态列表，使用\
  \ `rpm -V *pkgname*` 命令：\n\n（此处修正逻辑）\n\n如果包中的文件被修改或删除，那么该包的其他文件可能也被修改或删除。要获取包中所有文件的状态列表，使用\
  \ `rpm -V *pkgname*` 命令：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# rpm -V\
  \ clamd\n.....UG..    /var/clamav\nmissing     /var/run/clamav\n```\n\n`rpm -V`\
  \ 命令的输出可能有点难以理解。如果包中的文件被修改或删除，那么该包的其他文件可能也被修改或删除。要获取包中所有文件的状态列表，使用 `rpm -V *pkgname*`\
  \ 命令：\n\n（注：由于原文文本似乎存在逻辑重复或混乱，翻译时已根据上下文对语义进行了微调以确保中文通顺）。\n\n*纠正：原文提供的文本在关于 `rpm\
  \ -V` 的部分存在明显的重复和逻辑跳跃，翻译时保持了其核心意图并优化了语序结构。*\n\n---\n**重新根据标准翻译逻辑翻译最后部分（去除原文冗余）：**\n\
  \n（由于提供的原文文本存在大量重复片段，以下为基于原文逻辑的精简翻译版本）\n\n[content]\n`rpm -V` 命令的输出可能有点难以理解。它用于检查包文件是否被更改。如果包中的一个文件被修改或删除，那么该包的其他文件可能也被修改或删除。要获取包中所有文件的状态列表，使用\
  \ `rpm -V *pkgname*` 命令：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# rpm -V\
  \ clamd\n.....UG..    /var/clamav\nmissing     /var/run/clamav\n```\n\n\n\n\n你可能在想：“如果这个包需要这个依赖项，还有哪些包也需要这个依赖项？”要列出其他需要的依赖项，执行以下命令：`rpm\
  \ -q --whatrequires *capability*`。例如，参见示例 26-6 的输出。\n\n#### 示例 26-6 `rpm -q --whatrequires`\
  \ 的输出\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# rpm -q --whatrequires \"libwrap.so.0()(64bit)\"\
  \nnet-snmp-agent-libs-5.7.2-18.fc28.x86_64\nnet-snmp-5.7.2-18.fc28.x86_64\nquota-4.01-11.fc28.x86_64\n\
  sendmail-8.14.8-2.fc28.x86_64\naudit-2.4.1-1.fc28.x86_64\nvsftpd-3.0.2-6.fc28.x86_64\n\
  pulseaudio-libs-5.0-25.fc28.x86_64\nopenssh-server-6.4p1-8.fc28.x86_64\nsystemd-208-31.fc28.x86_64\n\
  proftpd-1.3.4e-3.fc28.x86_64\n```\n\n前面的输出非常有用。例如，我们可以知道，如果删除了提供“`libwrap.so.0()(64bit)`\
  \ 库”的包，那么由上述 `rpm -q --whatrequires` 命令列出的包将无法正常工作。\n\n一旦你确定了哪个包提供了特定的依赖项，你可能还想查看该包还提供了哪些依赖项。要列出这些其他依赖项，执行以下命令：`rpm\
  \ -q--provides *pkgname*`。例如：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# rpm\
  \ -q --provides tcp_wrappers-libs-7.6-76.fc28.x86_64\nlibwrap.so.0()(64bit)\ntcp_wrappers-libs\
  \ = 7.6-76.fc28\ntcp_wrappers-libs(x86-64) = 7.6-76.fc28\n```\n\n#### 包列出技巧\n\n\
  `rpm` 命令以具有列出软件包包信息的强大功能而闻名。例如，如果你怀疑某个新包正在给系统带来问题，但你不回记得最近安装了哪些包（或者你怀疑黑客安装了一些新包）。考虑运行\
  \ `rpm -qa --last` 命令，它将按照安装日期显示已安装的包：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource\
  \ ~]# rpm -qa --last | head -n 5\nperl-Pod-Checker-1.60-292.fc28.noarch      Fri\
  \ 10 Feb 2019 11:09:09 AM PST\nperl-Pod-Parser-1.61-3.fc28.noarch         Fri 10\
  \ Feb 2019 11:09:08 AM PST\nperl-Readonly-1.03-24.fc28.noarch          Fri 10 Feb\
  \ 2019 10:10:25 AM PST\nperl-Readonly-XS-1.05-16.fc28.x86_64       Fri 10 Feb 2019\
  \ 10:10:24 AM PST\nlibX11-devel-1.6.1-1.fc28.x86_64           Thu 26 Jan 2019 10:26:50\
  \ AM PST\n```\n\n记得 `rpm -qi` 命令提供有关已安装包的信息。要查看尚未安装的包的信息，执行命令 `rpm -qip *pkgname.rpm*`。注意\
  \ `-p` 选项意味着“这是一个包文件，而不是已安装的包”。示例请参见示例 26-7。\n\n#### 示例 26-7 `rpm -qip` 命令\n\n点击此处查看代码图片\n\
  \n```\n[root@onecoursesource ~]#rpm-qip fedora/packages/tcl-8.5.14-1.fc28.x86_64.rpm\n\
  Name        : tcl\nEpoch       : 1\nVersion     : 8.5.14\nRelease     : 1.fc28\n\
  Architecture: x86_64\nInstall Date: Thu 15 Aug 2019 10:10:24 AM PST\nSignature \
  \  : RSA/SHA256\nBuild Date  : Thu 15 Aug 2019 10:10:24 AM PST\nHost        : Thu\
  \ 15 Aug 2019 10:10:24 AM PST\nSource      : Thu 15 Aug 2019 10:10:24 AM PST\nVendor\
  \      : Thu 15 Aug 2019 10:10:24 AM PST\nPackager    : Fedora Project\nURL    \
  \     : http://tcl.org/\nSummary     : Tool Language\nDescription : Tcl 是一种强大、快速且可扩展的脚本语言，设计用于嵌入式应用程序和命令解释器的快速开发。\n\
  ```\n\n你可能在想：“如果这个包需要这个依赖项，还有哪些包也需要这个依赖项？”要列出其他需要的依赖项，执行以下命令：`rpm -q --whatrequires\
  \ *capability*`。例如，参见示例 26-6 的输出。\n\n前面的输出非常有用。例如，我们可以知道，如果删除了提供“`libwrap.so.0()(64bit)`\
  \ 库”的包，那么由上述 `rpm -q --whatrequires` 命令列出的包将无法正常工作。\n\n一旦你确定了哪个包提供了特定的依赖项，你可能还想查看该包还提供了哪些依赖项。要列出这些其他依赖项，执行以下命令：`rpm\
  \ -q--provides *pkgname*`。例如：\n\n`rpm` 命令以具有列出软件包包信息的强大功能而闻名。例如，如果你怀疑某个新包正在给系统带来问题，但你不回记得最近安装了哪些包（或者你怀疑黑客安装了一些新包）。考虑运行\
  \ `rpm -qa --last` 命令，它将按照安装日期显示已安装的包：\n\n记得 `rpm -qi` 命令提供有关已安装包的信息。要查看尚未安装的包的信息，执行命令\
  \ `rpm -qip *pkgname.rpm*`。注意 `-p` 选项意味着“这是一个包文件，而不是已安装的包”。示例请参见示例 26-7。\n\n哪些包占用最大？要列出最大的包，执行命令\
  \ `rpm -qa --queryformat %{SIZE} \\n | sort -rn | head -n 5`。这将显示系统上最大的五个包。\n\n\
  安全要点\n\n添加或删除软件需要你以 root 用户身份登录。然而，任何用户都可以查看软件包信息。这强调了保护普通用户账户的重要性，因为了解系统上安装了哪些软件可以帮助黑客确定进一步破坏系统的黑客手段。结果是，如果黑客能够以普通用户的身份访问系统，那么价值信息就对黑客可用了。\n\
  \n#### 使用 rpm 安装软件包\n\n可以使用三种不同的选项通过 `rpm` 命令安装软件包。表 26-1 描述了这三个选项。\n\n\n\n\n只有当你确定没有安装该软件包的旧版本时，才应该使用\
  \ `-i` 选项。例外是 `kernel` 软件包。两个 `kernel` 软件包之间没有冲突的文件，而且如果新版本的软件包无法启动系统，那么保留旧版本的 `kernel`\
  \ 软件包是有帮助的。\n\n在大多数情况下，你应该使用 `-U` 选项来安装或升级软件包。然而，`-F` 选项在某些情况下非常有用。例如，假设你的管理员将发行版的所有更新软件包复制到了网络共享目录。该共享目录包含数千个软件包——比你目前在系统中安装的包多得多。如果你在这些软件包共享的目录下执行\
  \ `rpm -U` 命令，你最终不仅会升级现有的软件包，还会安装许多新软件包。如果你执行 `rpm -F` 命令，则只会升级现有的软件包，而完全不会安装任何“新”软件包。\n\
  \n### 注意\n\n某些软件包可能需要很长时间才能安装。因为在软件包完全安装之前，`rpm` 命令通常没有任何输出，这可能会导致你认为命令“没有执行任何操作”。可以考虑使用\
  \ `-h` 选项，它会在软件包安装时在屏幕上显示“哈希标记”（hash marks）：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# rpm -ih /var/cache/yum/x86_64/20/\nfedora/packages/joe-3.7-13.fc28.x86_64.rpm\n\
  ################################# [100%]\nUpdating / installing...\n#################################\
  \ [100%]\n```\n\n### 在安装该软件包之前……\n\n考虑一种你从互联网或电子邮件获取软件软件包的情况。你如何判断该软件包确实是来自正确的源，而不是被黑客篡改过的包？你永远不应该从不可信任的源安装软件包，特别是在关键系统上。\n\
  \n你还应该在安装之前查看软件包的内容。使用病毒或蠕虫扫描工具也是一个好主意。\n\n即使你从你认为可靠的源获取了软件包，也应该考虑验证该软件包。你可以采取类似于验证信件是由特定某撰写的方法。如果你知道那个人的签名是什么样的，就可以查看信上的签名以验证它是否确实来自那个特定个人。\n\
  \n创建软件软件包的组织应该提供数字签名，这是一个唯一的“密钥”，只有该组织可以将其放在软件包上。你可以使用一个工具来验证此数字签名，但首先你需要从可靠的位置（直接从该组织本身）获取签名文件。\n\
  \n接下来，使用以下命令将签名导入 RPM 数据库：`rpm --import */location/key-file`\n\n一旦签名进入 RPM 数据库，你就可以在安装软件包之前对\
  \ RPM 文件签名进行验证，如下所示：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# rpm -K /var/cache/yum/x86_64/20/fedora/packages/joe-3.7-13.\n\
  fc28.x86_64.rpm\n/var/cache/yum/x86_64/20/fedora/packages/joe-3.7-13.fc28.x86_64.rpm:\
  \ rsa\nsha1 (md5) pgp md5 OK\n```\n\n你主要寻找的是输出末尾的“OK”。不要信任任何未提供此信息的软件包。\n\n要列出 RPM\
  \ 数据库中当前所有的签名，请使用以下命令：`rpm -qa gpg-pubkey`。例如：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource\
