  \ 8192\n                 FirstBurstLength: 65536\n                 MaxBurstLength:\
  \ 262144\n                 ImmediateData: Yes\n                 InitialR2T: Yes\n\
  \                 MaxOutstandingR2T: 1\n                 ************************\n\
  \                 Attached SCSI devices:\n                 ************************\n\
  \                 Host Number: 3    State: running\n                 scsi3 Channel\
  \ 00 Id 0 Lun: 0\n                 scsi3 Channel 00 Id 0 Lun: 1\n              \
  \           Attached scsi disk sdb      State: running\n```\n\n请记住，`udev` 系统创建并管理设备文件。在这种情况下，`udev`\
  \ 守护进程与 `scsi_id` 命令协同工作，将目标与 `sdb` 设备（`/dev/sdb` 文件）映射，因此在示例 12-8 中输出了：**Attached\
  \ scsi disk sdb**。虽然你可以手动执行 `scsi_id` 命令，但它通常由 `udev` 守护进程用于创建设备文件。\n\n该目标的好处在于，它对本地文件系统来说就像普通设备一样。你可以在上面创建分区、创建文件系统并挂载该文件系统，如示例\
  \ 12-9 所示。\n\n#### 示例 12-9：在本地系统使用 iSCSI 目标\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
