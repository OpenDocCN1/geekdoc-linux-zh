  ### 额外的 LVM 命令\n\n有几十个额外的 LVM 命令（LVM 是一个巨大的主题）。了解几乎所有与 LVM 相关的命令都是 `lvm` 命令的子命令是有用的。\n\
  \n在本章演示的 LVM 命令通常通过指向 `/sbin/lvm` 命令的符号链接执行：\n\n点击此处查看\n\n```\n[root@onecoursesource\
  \ ~]# which pvcreate\n/sbin/pvcreate\n[root@onecoursesource ~]# ls -l /sbin/pvcreate\n\
  lrwxrwxrwx. 1 root root 3 Oct 22 10:55 /sbin/pvcreate -> lvm\n```\n\n这在救援环境中至关重要，因为救援环境中存在\
  \ `lvm` 命令但没有指向 `lvm` 命令的链接命令。（注意：救援环境是你是从恢复光盘启动系统并尝试修复问题的环境。）\n\n当不带参数执行 `lvm`\
  \ 命令时，你会获得一个 `lvm>` 提示符，可以在其中执行这些子命令，如示例 11-10 所示。\n\n**示例 11-10** *`lvm` 命令*\n\n\
  点击此处查看代码图像\n\n\n\n\n\n```\n[root@onecoursesource ~]# lvm\nlvm> help\n  可用的 lvm 命令:\n\
  \  使用 'lvm help <command>' 获取更多信息\n\n  dumpconfig      导出活动配置\n  formats       \
  \  列出可用的元数据格式\n  help            显示命令的帮助\n  lvchange        更改逻辑卷的属性\n  lvconvert\
  \       更改逻辑卷布局\n  lvcreate        创建逻辑卷\n  lvdisplay       显示逻辑卷信息\n  lvextend\
  \        为逻辑卷添加空间\n  lvmchange       带有设备映射器，此命令已过时且不执行任何操作\n  lvmdiskscan     列出可能作为物理卷的设备\n\
  \  lvmsadc         收集活动数据\n  lvmsar          创建活动报告\n  lvreduce        减小逻辑卷的大小\n\
  \  lvremove        从系统中删除逻辑卷\n  lvrename        重命名逻辑卷\n  lvresize        调整逻辑卷的大小\n\
  \  lvs             显示逻辑卷信息\n  lvscan          列出所有卷组中的所有逻辑卷\n  pvchange        更改物理卷的属性\n\
  \  pvresize        调整物理卷的大小\n  pvck            检查物理卷的一致性\n  pvcreate        为 LVM\
  \ 初始化物理卷\n  pvdata          显示物理卷的磁盘元数据\n  pvdisplay       显示物理卷的各种属性\n  pvmove\
  \          将区从一个物理卷移动到另一个\n  pvremove        从物理卷删除 LVM 标签\n  pvs             显示物理卷信息\n\
  \  pvscan          列出所有物理卷\n  segtypes        列出可用的段类型\n  vgcfgbackup     备份卷组配置\n\
  \  vgcfgrestore    恢复卷组配置\n  vgchange        更改卷组属性\n  vgck            检查卷组的一致性\n\
  \  vgconvert       更改卷组元数据格式\n  vgcreate        创建卷组\n  vgdisplay       显示卷组信息\n\
  \  vgexport        从系统中注卷组\n  vgextend        向卷组添加物理卷\n  vgimport        将导出的卷组注册到系统\n\
  \  vgmerge         合并卷组\n  vgmknodes       在 /dev 中为卷组设备创建特殊文件\n  vgreduce     \
  \   从卷组中删除物理卷\n  vgremove        删除卷组\n  vgrename        重命名卷组\n  vgs          \
  \   显示卷组信息\n  vgscan          搜索所有卷组\n  vgsplit         将物理卷移动到新或现有卷组\n  version\
  \         显示软件和驱动程序版本信息\nlvm> quit\n```\n\n## 调整逻辑卷的大小\n\n调整 LV（逻辑卷）的大小是一个两步过程。如果你要减小\
  \ LV，你首先需要缩小文件系统的大小，然后使用 `lvreduce` 命令缩小 LV。某些文件系统不允许你缩小文件系统的大小，但减小 LV 的小本身并不罕见。\n\
  \n你很可能是要增大 LV 的大小。在这种情况下，你首先增大 LV，然后“扩展”文件系统。请注意，这些步骤与你减小 LV 大小的步骤顺序相反。\n\n绝大多数文件系统不仅允许增长，而且许多文件系统允许在无需卸载文件系统的情况下进行操作。\n\
  \n在开始此过程之前，请查看文件系统的当前大小；在本示例中，它约为 23MB：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# df -h /dev/mapper/VG0-lv0\nFilesystem           Size  Used Avail Use% Mounted\
  \ on\n/dev/mapper/VG0-lv0   23M  204K   21M   1% /storage-lv0\n```\n\n同时查看 示例 11-11\
  \ 中显示的 LV 大小，它略大一些，因为文件系统需要一些空间存储元数据，导致可用大小比包含文件系统的容器小。\n\n**示例 11-11** *逻辑卷显示大小*\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# lvdisplay /dev/mapper/VG0-lv0\n ---\
  \ 逻辑卷 ---\n LV Path                /dev/VG0/lv0\n LV Name                lv0\n VG\
  \ Name                VG0\n LV UUID                m3cZlG-yydW-iNlh-I0Ky-HL3C-vWI8-AUKmRN\n\
  \ LV Write Access        read/write\n LV Creation host, time onecoursesource.localdomain,\
  \ 2017-10-27 09:14:21 -0700\n LV Status              available\n # open        \
  \         1\n LV Size                24.00 MiB\n Current LE             6\n Segments\
  \               1\n Allocation             inherit\n Read ahead sectors     auto\n\
  \ - currently set to     256\n Block device           253:3\n```\n\n注意，该文件系统当前已挂载并包含文件。这是为了说明，即使文件系统当前正在被使用，你也可以执行增大\
  \ LV 和文件系统大小的过程：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# df -h /dev/mapper/VG0-lv0\n\
  Filesystem           Size  Used Avail Use% Mounted on\n/dev/mapper/VG0-lv0   23M\
  \  204K   21M   1% /storage-lv0\n```\n\n使用 `lvextend` 命令增大 LV 的大小。在这种情况下，大小增加了 40MB：\n\
  \n点击此处查看代码图像\n\n```\n[onecoursesource ~]# lvextend -L +40M /dev/mapper/VG0-lv0\n\
  \  Logical volume VG0/lv0 changed from 24.00 MiB to 64.00 MiB.\n```\n\n验证 LV 现在增大：\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# lvdisplay /dev/mapper/VG0-lv0 | grep\
  \ Size\n  LV Size                64.00 MiB\n```\n\n注意文件系统的大小没有变化：\n\n点击此处查看代码图像\n\
  \n```\n[root@onecoursesource ~]# df -h /dev/mapper/VG0-lv0\nFilesystem         \
  \  Size  Used Avail Use% Mounted on\n/dev/mapper/VG0-lv0   23M  204K   21M   1%\
  \ /storage-lv0\n```\n\n现在使用 `resize2fs` 命令调整文件系统的大小（如果你正在调整 xfs 文件系统，请使用 `xfs_grow`\
  \ 命令）：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# resize2fs /dev/mapper/VG0-lv0\n\
  The filesystem /dev/mapper/VG0-lv0 is now 65536 blocks.\n```\n\n验证该命令执行成功：\n\n点击此处查看代码图像\n\
  \n```\n[root@onecoursesource ~]# df -h /dev/mapper/VG0-lv0\nFilesystem         \
  \  Size  Used Avail Use% Mounted on\n/dev/mapper/VG0-lv0   61M  5.3M   53M   10%\
  \ /storage-lv0\n```\n\n\n\n\n\n请参考示例 11-13 查看此过程的演示。\n\n#### **示例 11-13** \n*缩小逻辑卷的大小*\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# umount /storage-lv0/\n[root@onecoursesource\
  \ ~]# fsck -f /dev/mapper/VG0-lv0\nfsck from util-linux-ng 2.17.2\ne2fsck 1.41.12\
  \ (17-May-2010)\nPass 1: Checking inodes, blocks, and sizes\nPass 2: Checking directory\
  \ structure\nPass 3: Checking directory connectivity\nPass 4: Checking reference\
  \ counts\nPass 5: Checking group summary information\n/dev/mapper/VG0-lv0: 14/16384\
  \ files (0.0% non-contiguous), 8429/65536 blocks\n[root@onecoursesource ~]# resize2fs\
  \ /dev/mapper/VG0-lv0 24M\nresize2fs 1.41.12 (17-May-2010)\nResizing the filesystem\
  \ on /dev/mapper/VG0-lv0 to 24576 (1k) blocks.\nThe filesystem on /dev/mapper/VG0-lv0\
  \ is now 24576 blocks long.\n\n[root@onecoursesource ~]# lvreduce -L -40M /dev/mapper/VG0-lv0\n\
  \  WARNING: Reducing active logical volume to 24.00 MiB\n  THIS MAY DESTROY YOUR\
  \ DATA (filesystem etc.)\nDo you really want to reduce lv0? [y/n]: y\n  Reducing\
  \ logical volume lv0 to 24.00 MiB\n  Logical volume lv0 successfully resized\n[root@onecoursesource\
  \ ~]# mount /dev/mapper/VG0-lv0 /storage-lv0\n[root@onecoursesource ~]# df -h /dev/mapper/VG0-lv0\n\
  Filesystem            Size  Used Avail Use% Mounted on\n/dev/mapper/VG0-lv0    24M\
  \  6.0M   17M  27% /storage-lv0\n```\n\n#### **注意**\n\n你可以在挂载状态下扩展 ext3、ext4 和 xfs\
  \ 文件系统。若要减小这些文件系统的大小，你需要先将它们卸载。\n\n#### LVM 快照\n\n许多备份工具采用以下方法来备份文件系统：\n\n1. 记录正在备份的文件的元数据。\n\
  2. 记录正在备份的目录的元数据。\n3. 备份目录（实际上是属于每个目录的文件列表）。\n4. 备份文件内容。\n\n你可以通过 `dump` 命令等工具查看到这一点。请注意示例\
  \ 11-14 输出中加粗的行。\n\n#### **示例 11-14** \n***dump** 命令\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# dump -f /tmp/backup /storage-lv0\n DUMP: Date of this level 0 dump: Tue Oct\
  \ 27 22:17:18 2017\n DUMP: Dumping /dev/mapper/VG0-lv0 (/storage-lv0) to /tmp/backup\n\
  \ DUMP: Label: none\n DUMP: Writing 10 Kilobyte records\n DUMP: mapping (Pass I)\
  \ [regular files]\n DUMP: mapping (Pass II) [directories]\n DUMP: estimated 4880\
  \ blocks.\n DUMP: Volume 1 started with block 1 at: Tue Oct 27 22:17:18 2017\n DUMP:\
  \ dumping (Pass III) [directories]\n DUMP: dumping (Pass IV) [regular files]\n DUMP:\
  \ Closing /tmp/backup\n DUMP: Volume 1 completed at: Tue Oct 27 22:17:18 2017\n\
  \ DUMP: Volume 1 4890 blocks (4.78MB)\n DUMP: 4890 blocks (4.78MB) on 1 volume(s)\n\
  \ DUMP: finished in less than a second\n DUMP: Date of this level 0 dump: Tue Oct\
  \ 27 22:17:18 2017\n DUMP: Date this dump completed:  Tue Oct 27 22:17:18 2017\n\
  \ DUMP: Average transfer rate: 0 kB/s\n DUMP: DUMP IS DONE\n```\n\n这种技术的问题在于备份运行中的（已挂载）文件系统。在备份元数据和文件数据之间，文件系统可能会发生变化。例如，在备份了\
  \ `/storage-lv0/hosts` 文件的元数据后，如果文件在备份内容之前被删除，将导致备份出现问题。\n\n最好的做法是在备份之前卸载文件系统，但在生产机器上这并不总是可能的。因此，你可以利用\
  \ LVM 快照。快照提供了 LV 内部文件系统的“冻结镜像”。通过备份这个冻结的镜像，你可以确保获得良好的（无错误的）备份。\n\n要创建快照，请使用带有 `-s`\
  \ 选项的 `lvcreate` 命令：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# lvcreate -L\
  \ 20M -s -n snap0 /dev/mapper/VG0-lv0\n  Logical volume \"snap0\" created.\n```\n\
  \n现在有一个名为 `/dev/mapper/VG0-snap0` 的新设备。`-s` 选项指定你想创建一个快照 LV。`-n` 选项指定新 LV 的名称。最后一个参数是新\
  \ LV 所快照的 LV 名称。\n\n为此新设备创建一个挂载点并以只读方式挂载它，以确保“冻结”的文件系统不会发生任何变化：\n\n点击此处查看代码图像\n\n\
  ```\n[root@onecoursesource ~]# mkdir /backup\n[root@onecoursesource ~]# mount -o\
  \ ro /dev/mapper/VG0-snap0 /backup\n```\n\n现在你可以使用任选的备份工具备份 `/backup` 文件系统。你可以看到它目前包含与原始\
  \ LV 相同的数据：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# ls /backup\ngroup  hosts\
  \  lost+found  words\n[root@onecoursesource ~]# ls /storage-lv0\ngroup  hosts  lost+found\
  \  words\n```\n\n那么，备份 `/backup` 文件系统与备份 `/storage-lv0` 文件系统有什么不同呢？虽然 `/storage-lv0`\
  \ 文件系统是运行中的且可以修改，但 `/backup` 文件系统无法更改，如下面的命令所示：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# rm /backup/hosts\nrm: cannot remove '/backup/hosts': Read-only file system\n\
  [root@onecoursesource ~]# ls /backup\n```\n\n完成备份后，你应该通过卸载快照并执行 `lvremove` 命令来销毁\
  \ LVM 快照：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# umount /dev/mapper/VG0-snap0\n\
  [root@onecoursesource ~]# lvremove /dev/mapper/VG0-snap0\n```\n\n\n\n\n\n普通用户可能会创建许多大文件对文件系统产生负面影响。用户可以使用大文件完全填满整个文件系统，导致其他人无法使用该文件系统。\n\
  \n磁盘配额的设计是为了解决这个问题。作为管理员，你可以限制用户在每个文件系统中可以使用多少空间。该限制可以应用于单个用户，也可以应用于组的所有成员。\n\n\
  例如，你可以通过创建一个 `hard limit`（硬限制），为用户 `ted` 启用磁盘配额，将其限制在 300MB 空间内。你还可以创建一个 `soft limit`（软限制），当用户超过此限制时会产生警告（但在达到\
  \ `hard limit` 之前不会阻止创建新文件）。\n\n如果你为一个组创建了磁盘配额，则配额将单独适用于该组的每个成员。例如，如果用户 `nick`、`sarah`\
  \ 和 `julia` 是 `payroll` 组的成员，并且 `/home` 文件系统设置了 100MB 的硬限制，那么每个用户在该文件系统中最多可以使用 100MB\
  \ 空间。\n\n限制用户创建的文件数量同样重要。每个文件都需要一个 inode，它是文件中存储文件元数据的部分，例如文件所有权、权限和时间戳。每个文件系统拥有的\
  \ inode 数量有限，尽管这个限制通常非常慷慨，但有决心的用户可能会创建大量空文件，导致耗尽所有可能的 inode。因此，即使有更多可用空间，如果没有额外的\
  \ inode，其他人也无法在该文件系统中创建文件。\n\n最后，请注意，本文讨论一直使用 `filesystem`（文件系统）这一术语。这是因为磁盘配额是应用于整个文件系统的，而不是某个特定目录。\n\
  \n## 为文件系统设置磁盘配额\n\n要启用用户配额，你必须使用 `usrquota` 挂载选项挂载文件系统。可以通过向 `/etc/fstab` 文件的挂载选项字段中添加\
  \ `usrquota` 来：\n\n点击此处查看代码图片\n\n```\n/dev/sdb1      /              ext4    usrquota\
  \             1   1\n```\n\n然后，使用以下命令重新挂载文件系统（以下命令必须由 root 用户执行）：\n\n点击此处查看代码图片\n\
  \n```\n[root@localhost ~]$ mount -o remount /\n```\n\n在启用 `usrquota` 选项挂载文件系统后，你需要通过执行以下\
  \ `quotacheck` 命令来创建初始配额数据库：\n\n点击此处查看代码图片\n\n```\n[root@localhost ~]$ quotacheck\
  \ -cugm /dev/sdb1\n```\n\n这将导致在文件系统的挂点目录下生成新文件：\n\n点击此处查看代码图片\n\n```\n[root@localhost\
  \ ~]$ ls /aquota*\n/aquota.group  /aquota.user\n```\n\n`quotacheck` 命令的重要选项显示在表\
  \ 11-3 中。\n\n**表 11-3** `quotacheck` 命令的选项\n\n| **选项** | **描述** |\n| --- | --- |\n\
  | `-c` | 创建数据库文件。 |\n| `-g` | 仅创建 `aquota.group` 文件，意味着除非也使用 `-u` 选项，否则仅启用组配额。 |\n\
  | `-m` | 在创建配额文件时不尝试卸载文件系统。 |\n| `-u` | 仅创建 `aquota.user` 文件，意味着除非也使用 `-g` 选项，否则仅启用用户配额。\
  \ |\n\n## 编辑、检查和生成用户配额报告\n\n按照上一节介绍的方法设置磁盘配额后，按照以下步骤启用并显示用户的配额：\n\n1. 通过执行 `quotaon`\
  \ 命令开启磁盘配额。\n2. 使用 `edquota` 命令创建或编辑用户配额。\n3. 使用 `quota` 或 `repquota` 命令显示配额信息。\n\
  \n### quotaon\n\n`quotaon` 命令用于为文件系统开启配额。通常在系统启动时，会自动完成此操作。但是，你可以通过执行 `quotaoff`\
  \ 命令后跟文件系统名称来关闭配额（以下命令必须由 root 用户执行）：\n\n点击此处查看代码图片\n\n```\n[root@localhost ~]$\
  \ quotaoff /dev/sdb1\n[root@localhost ~]$ quotaon /dev/sdb1\n```\n\n### edquota\n\
  \n要创建或编辑用户的配额，执行 `edquota` 命令后跟用户名（以下命令必须由 root 用户执行）：\n\n点击此处查看代码图片\n\n```\n[root@localhost\
  \ ~]$ edquota sarah\n```\n\n`edquota` 命令将进入编辑器（通常默认为 vi）并显示用户所有的配额。输出内容类似于如下：\n\n\
  点击此处查看代码图片\n\n```\nDisk quotas for user sarah (uid 507):\n  Filesystem  blocks \
  \  soft   hard\n  /dev/sdb1               0      0\n```\n\n表 11-4 描述了配额的字段。\n\n\
  **表 11-4** 配额字段\n\n| **字段** | **描述** |\n| --- | --- |\n| `Filesystem` | 启用了配额的文件系统。\
  \ |\n| `blocks` | 用户当前使用的块数。 |\n| `soft` | 代表块的软限制值；如果用户创建文件超过此限制，将产生警告。 |\n| `hard`\
  \ | 代表块的硬限制值；如果用户创建文件超过此限制，将阻止额外文件的创建。 |\n| `inodes` | 用户在文件系统中当前使用的 inode 数。 |\n\
  | `soft` | 代表 inode 的软限制值；如果用户创建文件超过此限制，将产生警告。 |\n| `hard` | 代表 inode 的硬限制值；如果用户创建文件超过此限制，将阻止额外文件的创建。\
  \ |\n\n**注意**\n\n 宽限期可以通过执行 `edquota –t` 命令进行设置。请参见“宽限期”章节以获取更多信息。\n\n### quota\n\
  \n用户可以执行 `quota` 命令来显示其账户的配额：\n\n点击此处查看代码图片\n\n```\n[sarah@localhost ~]$ quota\n\
  Disk quotas for user sarah (uid 507):\n     Filesystem  blocks   quota   limit \
  \  grace   files   quota   limit   grace\n      /dev/sda1   20480   30000   60000\
  \               1       0\n```\n\n注意用户超过软限制时的输出；在以下示例中，用户 `sarah` 超过了块的软限制：\n\n\
  点击此处查看代码图片\n\n```\n[sarah@localhost ~]$ quota\nDisk quotas for user sarah (uid 507):\n\
  \     Filesystem  blocks   quota   limit   grace   files   quota   limit   grace\n\
  \      /dev/sda1   40960*  30000   60000   7days       2       0\n```\n\n当用户超过软配额时，会提供一个宽限期。用户必须在宽限期内将文件系统中的空间降低到软配额以下，否则当前使用量将转换为硬配额限制。\n\
  \n**注意**\n\n宽限期可以由 root 用户通过执行 `edquota –t` 命令进行设置。\n\n### repquota\n\n\n\n\n\n\
  `repquota` 命令由 root 用户，用于显示整个文件系统的配额（以下命令必须由 root 用户执行）：\n\n点击此处查看代码图片\n\n```\n\
  [root@localhost ~]$ repquota /\n*** 设备 /dev/sda1 上的用户配额报告\n块宽限时间: 7days; Inode 宽限时间:\
  \ 7days\n                        块限制                文件限制\nUser            used \
  \   soft    hard  grace    used  soft  hard  grace\n----------------------------------------------------------------------\n\
  root      -- 4559956       0       0         207396     0     0\ndaemon    --  \
  \    64       0       0              4     0     0\nman       --    1832       0\
  \       0            145     0 0\nwww-data  --       4       0       0         \
  \     1     0     0\nlibuuid   --      40       0       0              6     0 \
  \    0\nsyslog    --    3848       0       0             23     0     0\nmessagebus\
  \ --      8       0       0              2     0     0\nlandscape --       8   \
  \    0       0              2     0     0\npollinate --       4       0       0\
  \              1     0     0\nvagrant   --  550060       0       0          29906\
  \     0     0\ncolord    --       8       0       0              2     0     0\n\
  statd     --      12       0       0              3     0     0\npuppet    --  \
  \    44       0       0             11     0     0\nubuntu    --      36       0\
  \       0              8     0     0\nsarah     +-   40960   30000   60000  6days\
  \       2     0     0\n```\n\n`repquota` 命令的重要选项包括：\n\n| 选项 | 说明 |\n| --- | ---\
  \ |\n| `-a` | 显示 `/etc/fstab` 文件中指定了配额挂载选项的所有文件系统的配额。 |\n| `-g` | 显示组配额而不是特定用户配额。\
  \ |\n| `-s` | 以人类可读的大小（块大小来显示信息。 |\n\n### 硬链接与软链接\n\nLinux 上有两种不同类型的文件链接：\n\n* **硬链接\
  \ (Hard links)**：当你对一个文件创建硬链接时，无法区分“原始”文件和“链接”文件。它们只是指向相同 inode 的两个文件名，因此指向相同的数据。如果你有\
  \ 10 个硬链接文件并删除了其中任何 9 个，数据仍然保留在剩余的文件中。\n\n    图 11-9 展示了硬链接。\n\n    ![图像](img/00059.jpeg)\n\
  \n    **图 11-9** *硬链接*\n\n    在图 11-9 中，`abc.txt` 和 `xyz.txt` 文件被硬链接在了一起。这意味着它们共享相同的\
  \ inode 表。inode 表中的省略号（`…`）表示元数据——关于文件的信息，例如用户所有者和权限。这些元数据还包含了指向存储设备中存储文件数据的块的指针。\n\
  \n* **软链接 (Soft links)**：当你创建一个软链接时，原始文件包含数据，而链接文件“指向”原始文件。对原始文件进行的任何更改也会显示在链接文件中，因为使用链接文件始终会导致跟踪链接到目标文件。删除原始文件会导致链接断，使链接文件变得毫无用处并导致数据完全丢失。\n\
  \n    图 11-10 展示了软链接。\n\n    ![图像](img/00060.jpeg)\n\n    **图 11-10** *软链接*\n\n\
  \    在图 11-10 中，`abc.txt` 文件被软链接到 `xyz.txt` 文件。`abc.txt` 文件指向文件名 `xyz.txt`，而不是相同的\
  \ inode 表（尽管图中未显示，但 `abc.txt` 文件有它自己的 inode 表）。通过遵循链接，可以通过 `abc.txt` 文件访问 `xyz.txt`\
  \ 文件的数据。\n\n#### 为什么要使用链接？\n\n链接在系统管理任务中的一个常见用途是：当管理员决定将关键文件的位置移动到不同的目录位置（或给文件重命名）时。这可能会给习惯于原始文件位置和名称的用户带来困惑。\n\
  \n例如，假设一个关键配置文件名为 `/etc/setup-db.conf`，管理员想要将此文件移动到 `/etc/db` 目录。在文件移动后，可以创建一个符号链接来帮助其他用户（可能还有程序）找到正确的数据（务必以\
  \ root 用户身份运行以下命令）：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]$ ln -s /etc/db/setup-db.conf\
  \ /etc/setup-db.conf\n```\n\n`/etc` 目录有几个这种使用链接的示例：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource\
  \ ~]$ ls -l /etc | grep \"^l\"\nlrwxrwxrwx   1 root root          12 Jan 26  2017\
  \ drupal -> /etc/drupal6\nlrwxrwxrwx   1 root root          56 Dec 17  2017 favicon.png\
  \ -> /usr/share/icons/\nhicolor/16x16/apps/fedora-logo-icon.png\nlrwxrwxrwx   1\
  \ root root          22 Jan 23  2017 grub2.cfg -> ../boot/grub2/grub.cfg\nlrwxrwxrwx\
  \   1 root root          22 Dec 17  2017 grub.conf -> ../boot/grub/grub.conf\nlrwxrwxrwx\
  \   1 root root          11 Jan 23  2017 init.d -> rc.d/init.d\nlrwxrwxrwx   1 root\
  \ root          41 Feb 18  2017 localtime -> ../usr/share/zoneinfo\nlrwxrwxrwx \
  \  1 root root          12 Jan 26  2017 drupal -> /etc/drupal6\nlrwxrwxrwx   1 root\
  \ root          56 Dec 17  2017 favicon.png -> /usr/share/icons/\nhicolor/16x16/apps/fedora-logo-icon.png\n\
  lrwxrwxrwx   1 root root          22 Jan 23  2017 grub2.cfg -> ../boot/grub2/grub.cfg\n\
  lrwxrwxrwx   1 root root          22 Dec 17  2017 grub.conf -> ../boot/grub/grub.conf\n\
  lrwxrwxrwx   1 root root          11 Jan 23  2017 init.d -> rc.d/init.d\nlrwxrwxrwx\
  \   1 root root          41 Feb 18  2017 localtime -> ../usr/share/zoneinfo\n```\n\
  \n#### 创建链接\n\n要创建链接，按以下方式执行 `ln` 命令：`ln [-s]` *target_file* *link_file*。例如，为了 `/etc/hosts`\
  \ 在当前目录下创建一个名为 `myhosts` 的硬链接，执行以下命令：\n\n```\n[root@onecoursesource ~]$ ln /etc/hosts\
  \ my```\n\n硬链接文件共享相同的 inode。你只能对与原始文件位于相同文件系统的文件（而不是目录）创建硬链接。对其他文件系统上的文件或目录创建硬链接会导致错误：\n\
  \n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]$ ln /boot/initrd.img-3.16.0-generic\
  \ initrd\nln: failed to create hard link 'initrd' => '/boot/initrd.img-3.16.0-generic':\
  \ Invalid\ncross-device link\n[root@onecoursesource ~]$ ln /etc myetc\nln: '/etc':\
  \ hard link not allowed for directory\n```\n\n软链接（也称为*符号链接*）是通过系统指向其他文件（或目录）的文件。你可以对任何文件或目录创建软链接：\n\
  \n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]$ ln -s /boot/initrd.img-3.16.0-generic\
  \ initrd\n```\n\n#### 显示链接文件\n\n`ls` 命令可用于显示软链接和硬链接。软链接非常容易识别，因为执行 `ls -l` 命令时会显示目标文件：\n\
  \n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]$ ls -l /etc/vtrgb\nlrwxrwxrwx 1 root\
  \ root 23 Jul 11  2015 /etc/vtrgb -> /etc/alternatives/vtrgb\n```\n\n硬链接更难识别，因为硬链接文件与另一个共享相同的\
  \ inode。例如，输出输出中权限后的数字 **2** 表示这是一个硬链接文件。\n\n\n\n\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource\
  \ ~]$ ls -l myhosts\n-rw-r--r-- 2 root root 186 Jul 11  2015 myhosts\n```\n\n要查看文件的\
  \ inode 编号，请使用 `ls` 命令的 `-i` 选项：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]$\
  \ ls -i myhosts\n263402 myhosts\n```\n\n然后使用 `find` 命令搜索具有相同 inode 的文件：\n\n点击此处查看代码图片\n\
  \n```\n[root@onecoursesource ~]$  find / -inum 263402 -ls 2> /dev/null\n263402 \
  \   4 -rw-r--r--   2 root     root       186 Jul 11  2015 /root/myhosts\n263402\
  \    4 -rw-r--r--   2 root     root       186 Jul 11  2015 /etc/hosts\n```\n\n###\
  \ 总结\n\n在本章中，你学习了加密文件系统，以及出于安全考虑，加密整个文件系统比加密单个文件的价值。本章涵盖的其他主题还包括 autofs、逻辑卷管理、磁盘配额和链接。\n\
  \n#### 关键术语\n\n- LUKS\n- autofs\n- LVM\n- snapshot\n- PV\n- PE\n- LE\n- LV\n- VG\n\
  \n#### 复习题\n\n1. 1. `_____` 命令用于创建卷卷组。\n2. 2. `vgcreate` 命令的哪个选项指定物理卷的区区大小？\n  \
  \ - `-e`\n   - `-t`\n   - `-s`\n   - `-p`\n3. 3. 在 LVM1 系统上，分配给逻辑卷的最大区区（extents）数量是多少？\n\
  \   - 100,000\n   - 97,400\n   - 65,534\n   - 以上都不是\n4. 4. `_____` 命令显示关于物理卷的信息。\n\
  5. 5. `vgdisplay` 命令的哪个选项提供了卷组的详细信息，包括卷组中包含哪些物理卷的信息？\n   - `-t`\n   - `-d`\n   -\
  \ `-V`\n   - 以上都不是\n6. 6. `lvcreate` 命令的 `_____` 选项用于指定逻辑卷名称。\n   - `-i`\n   - `-l`\n\
  \   - `-s`\n   - `-n`\n7. 7. 哪个命令允许向现有卷组添加新的物理卷？\n   - `pvadd`\n   - `pvextend`\n\
  \   - `vgadd`\n   - `vgextend`\n8. 8. `_____` 命令用于更改 ext4 文件系统的大小。\n\n## 第 12 章\n\
  \n### 管理网络存储\n\n有许多方法可以为用户从一个系统传输文件到另一个系统的能力。例如，在 Linux 上，你可以利用 SAMBA 服务器。使用 SAMBA\
  \ 服务器的优势在于，执行传输使用的协议不仅仅是“Linux 特有的”。这使得在不同操作系统之间（例如 Linux 和 Microsoft Windows 之间）传输文件变得更容易。\n\
  \n在本章中，你将学习 SAMBA 服务器，包括关键配置设置。完成本章后，你应该能够使用 SAMBA 服务器共享目录或打印机。你还应该理解如何使用 SAMBA\
  \ 用户账户保护这些共享内容。\n\n一旦创建了 SAMBA 共享，你就应该知道如何访问它。你将学习多种方法，包括如何挂载 SAMBA 共享使其看起来像本地文件系统的一部分。\n\
  \n另一种在 Linux 和 Unix 中更常见的共享共享方法是网络文件系统 (NFS)。这种方法允许管理员与安装了 NFS 客户端软件的其他系统共享目录结构。\n\
  \n你将学习如何设置 NFS 服务器并从 NFS 客户端连接到它。你还学习了如何保护 `portmap`，该服务授予对 NFS 服务器的访问权限。\n\n最后，你将学习如何使用\
  \ iSCSI 为客户端系统提供网络存储设备。\n\n在阅读本章并完成练习后，你能够完成以下操作：\n- 创建并访问 Samba 共享\n- 创建并访问 NFS\
  \ 共享\n- 通过 iSCSI 共享存储位置\n- 在客户端系统使用 iSCSI 资源\n\n### Samba\n\n在不同系统之间共享文件的方法之一是通过名为\
  \ SMB（Server Message Block）的协议。该协议由 IBM 在 20 世纪 80 年代中期发明，目的是在局域网（LAN）主机之间共享目录。跨网络共享文件和目录的术称为\
  \ DFS（分布式文件系统）。除了 SMB 之外，NFS（网络文件系统）也是 Linux 流行的 DFS（NFS 将在本章后面介绍）。你经常会听到配合 SMB\
  \ 使用的 CIFS（通用互联网文件系统）缩写；它是一种基于 SMB 的在 Windows 系统上流行的文件系统。\n\n通常，你会考虑安装三个独立的包：\n\
  - **SAMBA**: 该包包含 SAMBA 服务器。\n- **SAMBA-client**: 该包包含 SAMBA 客户端程序，允许你连接到 SAMBA\
  \ 服务器。\n- **SAMBA-common**: 该包包含服务器和客户端共同使用的软件。\n\n为了测试 SAMBA，我们建议安装这三个包。另一个有用的包是\
  \ SAMBA-swat，它提供了一个基于 Web 的管理工具。\n\n#### SAMBA 配置\n\nSAMBA 的配置文件是 `/etc/SAMBA/smb.conf`（在某些旧系统上，它可能是\
  \ `/etc/smb/smb.conf`）。它与 Linux 中发现的大多数配置文件有所不同。这里是需要注意的一些关键点：\n\n- 文件有良好的注释。你不需要查阅标准的\
  \ Samba 文档，因为配置文件包含了详细说明。\n- 文件使用以下格式拆分为部分：\n  - `[name]`: 这通常被称为“部分”，表示共享项目或服务。\n\
  \  - `[options and attributes]`: 每一行都是上方共享项目或服务的独立配置选项。\n- 该配置文件使用了两种注释字符：`#` 和\
  \ `;` 字符。`#` 字符用于普通注释；而 `;` 字符用于将你不想使用的实际配置设置转换为注释行，以便在以后可能需要这些设置时进行维护。这样，正确的命名规范和适当的属性就会保留在配置文件中。\n\
  \n为了让你典型的 `smb.conf` 文件看起来什么样，请查看示例 12-1 的输出，它展示了一个删除了所有注释和空行的典型默认 `smb.conf` 文件。\n\
  \n**示例 12-1** *默认 **smb.conf*** 文件*\n\n\n\n\n\n```\n[root@onecoursesource ~]# grep\
  \ -v \"#\" /etc/SAMBA/smb.conf | grep -v \";\" | grep -v \"^$\"\n[global]\n    \
  \    workgroup = MYGROUP\n        server string = SAMBA Server Version %v\n    \
  \    security = user\n        passdb backend = tdbsam\n        load printers = yes\n\
  \        cups options = raw\n[homes]\n        comment = Home Directories\n     \
  \   browseable = no\n        writable = yes\n[printers]\n        comment = All Printers\n\
  \        path = /var/spool/SAMBA\n        browseable = no\n        guest ok = no\n\
  \        writable = no\n        printable = yes\n```\n\n示例 12-1 中的命令行到底做了什么？回一下，`grep`\
  \ 命令是一个过滤工具，而 `-v` 选项是“反向” `grep`。当使用 `-v` 选项时，`grep` 命令会显示所有匹配模式之外的行。因此，第一个 `grep`\
  \ 模式匹配任何带有 `#` 注释字符的行并过滤掉这些行。第二个 `grep` 模式匹配任何带有 `;` 注释字符的行并过滤掉这些行。最后一个 `grep` 模式匹配空行并过滤掉这些行。所以，输出是由文件中所有真实的配置设置组成的（没有注释，也没有空行）。跟我们读一遍：“`grep\
  \ is my friend!`”。学习掌握如 `grep` 等命令，允许系统过滤你所需的信息，将使管理你的 Linux 系统变得容易得多。\n\n注意，这里有三个部分：`[global]`、`[homes]`\
  \ 和 `[printers]`。当添加目录和单个打印机进行共享时，会添加额外的部分。\n\n### [global] 部分\n\nSamba 服务器的主要设置存放在\
  \ `[global]` 部分。回想一下 示例 12-1 中显示的默认值：\n\n点击此处查看代码图像\n\n```\n[global]\n        workgroup\
  \ = MYGROUP\n        server string = SAMBA Server Version %v\n        security =\
  \ user\n        passdb backend = tdbsam\n        load printers = yes\n        cups\
  \ options = raw\n```\n\n你会发现默认选项足够启动 SAMBA 服务器了，但你可能想要更改至少几个选项以适应你的系统需求。表 12-1 描述了这些默认选项。\n\
  \n**表 12-1 典型的 [global] 选项**\n\n| **选项** | **描述** |\n| --- | --- |\n| `workgroup`\
  \ | 这是 NetBIOS（网络基本输入输出系统）工作组或 NetBIOS 域名。这是一种将一组机器组合在一起的技术。如果你想通过 SMB 与 Microsoft\
  \ Windows 系统通信，这可能很重要。 |\n| `server string` | 对服务器的描述；当远程系统尝试连接到服务器以确定服务器提供的服务时非常有用。值\
  \ `%v` 被替换为 SAMBA 的版本号。值 `%h` 可以表示服务器的主机。 |\n| `security` | 决定使用什么类型的用户身份验证方法。值\
  \ `user` 表示将使用 SAMBA 用户帐户。如果你在 Microsoft Windows 系统上有一个 DC（域控制器），你将指定域。要通过 Active\
  \ Directory 进行身份验证，请指定 `ads`。 |\n| `passdb backend` | 指定如何存储 SAMBA 帐户数据。通常情况下，除非你是专家，否则不需要更改它。\
  \ |\n| `load printers` | 此选项如果设置为 `yes`，则告诉 SAMBA 默认共享所有 CUPS 打印机。（通用 UNIX 打印系统是\
  \ Linux 和 Unix 中常用的打印协议。）尽管这很方便，但你并不总是想在 SAMBA 服务器上共享所有的 CUPS 打印机。单个打印机共享可以在单独的部分中处理。注意：为了让\
  \ SAMBA 能够加载所有 CUPS 打印机，需要正确配置 `[printers]` 部分（这将在后面的章节描述）。 |\n| `cups options`\
  \ | 关于 CUPS 的选项；很少修改，且应仅由专家执行。 |\n\n### [homes] 部分\n\n在本章的后后部分，你将学习如何创建 SAMBA 用户帐户。这些\
  \ SAMBA 用户与 Linux 用户帐户关联（通常共享相同的名称，但这不是强制要求的），而且这些 Linux 用户帐户当然有家目录。\n\n为了让这些用户更容易通过\
  \ SAMBA 服务器共享他们的家目录，`[homes]` 部分设计用于自动共享这些目录。请记住，普通的 Linux 权限仍然适用，因此这些共享通常只对家目录的所有者开放家目录。\n\
  \n默认的 `[homes]` 共享通常如下：\n\n点击此处查看代码图像\n\n```\n[homes]\n        comment = Home Directories\n\
  \        browseable = no\n        writable = yes\n```\n\n该部分中的值在以下列表中定义：\n\n* `comment`:\
  \ 共享的描述。\n* `browseable`: 如果设置为 `yes`，则可以通过显示 SAMBA 服务器上可用共享信息的客户端实用程序看到该共享。如果设置为\
  \ `no`，该共享是可用的，但使用实用程序的用户必须知道该共享的存在。\n\n**安全要点**\n使用 `browseable = no` 功能提供了一些额外的安全性，但请记住它只是混淆了共享。它并不会让共享受到完全保护，一个有意的黑客可能猜出共享名称并因此访问该共享。\n\
  \n* `writable`: 如果设置为 `yes`，则家目录是具有读写访问权限的共享。记住普通权限有效。如果设置为 `no`，则家目录是具有只读访问权限的共享。请记住底层文件系统的权限仍然有效。结果是，可以通过此\
  \ SAMBA 设置授予访问，但被文件系统拒绝。\n\n**可能会出现什么问题？**\n如果你通过 SAMBA 连接到系统并无法访问某个文件或目录，请尝试通过本地登录或\
  \ Secure Shell 直接登录系统（请参阅第 22 章，“连接到远程系统](#part0038.html_ch22)”以了解 Secure Shell），然后尝试直接访问该文件。如果不能，那么问题出在本地文件权限上。如果可以，那么问题出在\
  \ SAMBA 共享创建的方式。\n\n### [printers] 部分\n\n回想 `[global]` 部分中的 `load printers` 设置。当该设置为\
  \ `yes` 时，SAMBA 会寻找 `[printers]` 部分以自动共享所有 CUPS 打印机。一个典型的 `[printers]` 部分如下：\n\n\
  点击此处查看代码图像\n\n```\n[printers]\n        comment = All Printers\n        path = /var/spool/SAMBA\n\
  \        browseable = no\n        guest ok = no\n        writable = no\n       \
  \ printable = yes\n```\n\n在大多数情况下，你不太可能更改此部分。然而，你应该理解此部分中默认设置的含义：\n\n* `comment`:\
  \ 共享的描述。\n* `path`: CUPS 队列目录的位置（这是发送到打印机的项目之前存储的地方）。\n* `browseable`: 如果设置为 `yes`，则可以通过显示\
  \ SAMBA 服务器上可用共享信息的客户端实用程序看到该共享。如果设置为 `no`，该共享是可用的，但使用实用程序的用户必须知道该共享的存在。\n* `guest\
  \ ok`: 允许来帐户访问 CUPS 打印机。关于该帐户的更多细节将在本章后面的部分给出。\n* `writeable`: 应设置为 `no`，因为这不是一个目录共享。\n\
  * `printable`: 应设置为 `yes`，因为这是一个打印机共享。\n\n\n\n\n\n你可以创建目录或打印机的自定义共享。对于目录共享，其语法与\
  \ `[homes]` 部分非常相似。你首先创建一个部分名称，然后设置相关参数。在下面的示例中，`/usr/share/doc` 目录被共享为只读。当你想要节省空间并且仅有一个包含文档的系统时，这种方法非常有用：\n\
  \n点击此处查看代码图像\n\n```\n[doc]\n    comment = System documentation\n    path = /usr/share/doc\n\
  \    guest ok = yes\n    browseable = yes\n    writeable = no\n```\n\n对于此共享，资源是以只读方式共享的，因为没有必要对资源进行更改。只有拥有\
  \ SAMBA 账户的用户才能查看文档。\n\n如果你想为共享添加更多安全性，可以使用以下选项来限制哪些 SAMBA 用户可以访问它（以及如何访问）：\n\n\
  - `valid users`：可以访问此共享的 SAMBA 用户列表。例如：`valid users = bob, ted`。这可以类此类比为通过显式注明用户名对用户进行“白名单”管理。\n\
  - `invalid users`：无法访问此共享的 SAMBA 用户列表。所有其他 SAMBA 用户都将允许访问。这可以类比为通过显式注明用户名对用户进行“黑名单”管理。\n\
  - `read list`：可以访问共享但以只读方式访问的 SAMBA 用户列表。\n- `write list`：对共享具有读写权限的 SAMBA 用户列表。\n\
  \n要共享特定的打印机，首先要确保 `[global]` 部分中的 `loadprinters` 设置为 `no`。然后创建一个如下所示的部分：\n\n点击此处查看代码图像\n\
  \n```\n[hp-101]\n       path = /var/spool/SAMBA/\n       browseable = yes\n    \
  \   printable = yes\n       printer name = hp-101\n```\n\n### SAMBA 服务器\n\n在你修改了\
  \ `/etc/SAMBA/smb.conf` 文件之后、启动 SAMBA 服务器之前，你应该执行 `testparm` 命令。该命令用于验证配置文件的语法，如示例\
  \ 12-2 所示。\n\n**示例 12-2** `testparm` 命令\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# testparm\nLoad smb config files from /etc/SAMBA/smb.conf\nProcessing section\
  \ \"[homes]\"\nProcessing section \"[printers]\"\nProcessing section \"[doc]\"\n\
  Loaded services file OK.\nServer role: ROLE_STANDALONE\nPress enter to see a dump\
  \ of your service definitions\n\n[global]\n        workgroup = MYGROUP\n       \
  \ server string = SAMBA Server Version %v\n        passdb backend = tdbsam\n   \
  \     cups options = raw\n\n[homes]\n        comment = Home Directories\n      \
  \  read only = No\n        browseable = No\n\n[printers]\n        comment = All\
  \ Printers\n        path = /var/spool/SAMBA\n        printable = Yes\n        browseable\
  \ = No\n\n[doc]\n        comment = System documentation\n        path = /usr/share/doc\n\
  \        guest ok = Yes\n```\n\n### 可能会出现什么问题？\n\n如果 `testparm` 命令发现了任何错误，你将在输出中看到如下所示的消息（在这种情况下，错误是因为\
  \ `lp_bool` 的值必须是布尔值；换句话说，值应为 0 或 1）：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# testparm\nLoad smb config files from /etc/SAMBA/smb.conf\nProcessing section\
  \ \"[homes]\"\nProcessing section \"[printers]\"\nProcessing section \"[doc]\"\n\
  ERROR: Badly formed boolean in configuration file: \"nope\".\n\nlp_bool(nope): value\
  \ is not boolean!\n```\n\n一旦你拥有了有效的配置文件，就可以启动 SAMBA 服务（该服务名为“smb”，而不是 SAMBA）。你会看到两个服务启动：`smbd`\
  \ 和 `nmbd`。`smbd` 服务处理共享，而 `nmbd` 进程处理 NetBIOS 操作：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# ps -fe | egrep \"smbd|nmbd\"\nroot     20787     1  0 12:18 ?        00:00:00\
  \ smbd -D\nroot     20790     1  0 12:18 ?        00:00:00 nmbd -D\nroot     20792\
  \ 20787  0 12:18 ?        00:00:00 smbd -D\n```\n\n### 安全亮点\n\n通常，看到同名的多个进程可能存在问题。例如，黑客可能在系统上放置了一个恶恶意程序，该程序生成了多个进程。\n\
  \n在这种情况下，不必担心多个 `smbd` 进程。每个客户端请求都会产生一个新的 `smbd` 进程来处理该客户端的请求。\n\n`nmbd` 和 `smbd`\
  \ 在 `/var/log/SAMBA` 目录下都有独立的日志文件：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]#\
  \ ls /var/log/SAMBA\nnmbd.log  smbd.log\n```\n\n### 注意\n\n如果你习惯在 Microsoft Windows\
  \ 系统上管理 Active Directory，你可能熟悉一个名为 `net` 的命令行工具。SAMBA 软件也提供了此工具来管理基于 SAMBA 和 CIFS\
  \ 的服务器。\n\n例如，以下命令列出了测试网域中的所有用户：\n\n#### SAMBA 账户\n\n在用户访问 SAMBA 服务器之前，你需要创建一个 SAMBA\
  \ 账户。在用户访问 SAMBA 服务器之前，你需要创建一个 SAMBA 账户需要与一个系统账户关联。在本例中，系统已经有一个“student”用户：\n\n\
  点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# grep student /etc/passwd\nstudent:x:500:500::/home/student:/bin/bash\n\
  ```\n\n要为 Linux 用户创建 SAMBA 账户，使用 `smbpasswd` 命令（在“password”提示后，密码不会显示）：\n\n点击此处查看代码图像\n\
  \n```\n[root@onecoursesource ~]# smbpasswd -a student\nNew password:\nRetype new\
  \ password:\nAdded user student.\n```\n\n`-a` 选项用于添加账户。如果你想更改现有 SAMBA 账户的密码，请省略\
  \ `-a` 选项。\n\n##### 映射\n\n系统账户和 SAMBA 账户使用相同的名称是正常的，且用户的用户的困惑。但如果你为每个人使用不同的名称，可以使用用户名映射。首先在\
  \ `[global]` 部分包含以下设置：\n\n点击此处查看代码图像\n\n```\nusername map = /etc/SAMBA/usermap.txt\n\
  ```\n\n在 `/etc/SAMBA/usermap.txt` 文件中，创建如下条目：\n\n```\nbobsmith = student\nnickjones\
  \ = teacher\n```\n\n第一个值是 Linux 账户名，第二个值是 SAMBA 账户名。不要忘记为了使这些生效你需要创建 SAMBA 账户，并且因为你修改了\
  \ `[global]` 部分，你需要重启 SAMBA。\n\n请记住，如果你使用 Microsoft Active Directory 或域服务器来验证 SAMBA\
  \ 用户，等号左侧应该是 Microsoft 账户名。\n\n回顾之前讨论过的 `guest ok` 设置：\n\n点击此处查看代码图像\n\n```\n[doc]\n\
  \    comment = System documentation\n    path = /usr/share/doc\n    guest ok = yes\n\
  \    browseable = yes\n    writeable = no\n```\n\n识别该访客账户关联到哪个 SAMBA 用户的一种方法是在是在共享部分（如\
  \ `[doc]` 部分）中使用以下条目：\n\n```\nguest account = test\n```\n\n然后使用 `smbpasswd` 命令创建“test”\
  \ SAMBA 账户。\n\n#### 访问 SAMBA 服务器\n\n要发现网域中的 SAMBA 服务器，请执行 `nmblookup` 命令：\n\n点击此处查看代码图像\n\
  \n\n\n\n\n```\n[root@onecoursesource ~]# nmblookup MYGROUP\nquerying MYGROUP on\
  \ 10.0.2.255\n10.0.2.15 MYGROUP<00>\n```\n\n在发现 SAMBA 服务器后，你可以通过执行 `smbclient` 命令来查看\
  \ SAMBA 服务器上可用的共享，如示例 12-3 所示。\n\n**示例 12-3** *显示 SAMBA 服务器共享*\n\n点击此处查看代码图片\n\n\
  ```\n[root@onecoursesource ~]# smbclient -U student -L 10.0.2.15\nPassword:\nDomain=[ONECOURSESOURCE]\
  \ OS=[Unix] Server=[SAMBA 3.0.33-3.40.el5_10]\n\n        Sharename       Type  \
  \    Comment\n        ---------       ----      -------\n        doc           \
  \  Disk      System documentation\n        IPC$            IPC       IPC Service\
  \ (SAMBA Version 3.0.33-3.40.el5_10)\n        student         Disk      Home Directories\n\
  Domain=[ONECOURSESOURCE] OS=[Unix] Server=[SAMBA 3.0.33-3.40.el5_10]\n\n       \
  \ Server               Comment\n        ---------            -------\n\n       \
  \ Workgroup            Master\n        ---------            -------\n        MYGROUP\
  \              ONECOURSESOURCE\n```\n\n在示例 12-3 中，`-U` 选项允许你指定用于访问服务器的 SAMBA 账户。注意，系统会提示你输入该\
  \ SAMBA 账户的密码。`-L` 选项用于你想列出服务器上可用的文件和服务。通过提供 IP 地址（此例为 10.0.2.15）来识别服务器。\n\n要访问特定的共享，请执行以下\
  \ `smbclient` 命令：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# smbclient -U student\
  \ //10.0.2.15/doc\nPassword:\nDomain=[ONECOURSESOURCE] OS=[Unix] Server=[SAMBA 3.0.33-3.40.el5_10]\n\
  smb: \\>\n```\n\n一旦连接上，你就可以执行类似于 FTP 命令的命令。请参见示例 12-4 的简要演示。\n\n**示例 12-4** *使用\
  \ `smbclient` 命令*\n\n点击此处查看代码图片\n\n```\nsmb: \\> help\n?              altname  \
  \      archive        blocksize   cancel\ncase_sensitive cd             chmod  \
  \        chown       close\ndel            dir            du             exit  \
  \      get\ngetfacl        hardlink       help           history     lcd\nlink \
  \          lock           lowercase      ls          mask\nmd             mget \
  \          mkdir          more        mput\nnewer          open           posix\
  \          posix_open  posix_mkdir\nposix_rmdir    posix_unlink   print        \
  \  prompt      put\npwd            q              queue          quit        rd\n\
  recurse        reget          rename         reput       rm\nrmdir          showacls\
  \       setmode        stat        symlink\ntar            tarmode        translate\
  \      unlock      volume\nvuid           wdel           logon          listconnect\
  \ showconnect\n!\nsmb: \\> cd zip-2.31\nsmb: \\zip-2.31\\> ls\n  .             \
  \   D        0  Fri Oct  9 18:22:37 2018\n  ..               D        0  Sat Jan\
  \  2 21:29:14 2018\n  CHANGES               60168  Tue Mar  8 20:58:06 2018\n  TODO\
  \                   3149  Sun Feb 20 21:52:44 2018\n  WHERE                 19032\
  \  Tue Apr 18 18:00:08 2018\n  README                 8059  Sat Feb 26 19:22:50\
  \ 2018\n  LICENSE                2692  Sun Apr  9 15:29:41 2018\n  WHATSNEW    \
  \           2000  Tue Mar  8 20:58:28 2018\n  algorith.txt           3395  Sat Dec\
  \ 14 05:25:34 2018\n  BUGS                    356  Sat Dec 14 05:25:30 2018\n  MANUAL\
  \                40079  Sun Feb 27 23:29:58 2018\n\n                46868 blocks\
  \ of size 131072\\. 13751 blocks available\nsmb: \\zip-2.31\\> get README\ngetting\
  \ file \\zip-2.31\\README of size 8059 as README (231.5 kb/s) (average 231.5 kb/s)\n\
  smb: \\zip-2.31\\> quit\n```\n\n在示例 12-4 中演示的大多数命令与你已经熟悉的 Linux 命令相似。其中不同的是 `get`\
  \ 命令——它从远程系统下载文件到本地系统。\n\n你可以通过执行 `smbstatus` 命令查看 SAMBA 服务器的状态，包括哪些机器连接到它以及正在访问什么资源。如以下输出所示，SAMBA\
  \ 服务器已由本地系统上的某人连接（因此 IP 地址相同 10.0.2.15）：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource\
  \ zip-2.31]# smbstatus\nSAMBA version 3.0.33-3.40.el5_10\nPID     Username     \
  \ Group         Machine\n-------------------------------------------------------------------\n\
  21662   student       student       onecoursesource    (10.0.2.15)\nService    \
  \  pid     machine       Connected at\n-------------------------------------------------------\n\
  doc          21662   onecoursesource     Sun Jan  3 17:45:24 2016\nNo locked files\n\
  ```\n\n### 挂载 SAMBA 共享\n\n与其要求用户手动连接到 SAMBA 或 Microsoft Windows 共享，你可以通过挂载每个共享来让这些共享出现在本地文件系统中。例如：\n\
  \n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# mkdir /doc\n[root@onecoursesource\
  \ ~]# mount -t cifs -o user=student //10.0.2.15/doc /doc\nPassword:\n```\n\n挂载过程应该是非常简单的，因为它与你过去执行过的挂载操作相似（有关挂载的更多信息，请复阅第\
  \ 10 章“管理本地存储：要点”）。`-t` 选项用于指定文件类型。`-o` 选项用于提供选项——在这种情况下是 SAMBA 账户名称。`//10.0.2.15/doc`\
  \ 参数是待挂载的设备，而 `/doc` 参数是挂载点。\n\n### 可能会出现什么问题？\n\n注意共享路径是以双斜杠（`//`）开头的，而不是像目录路径那样只有一个。使用单个\
  \ `/` 将会导致命令失败。\n\n通常你希望在启动过程中自动挂载 SAMBA 共享。在 `/etc/fstab` 文件中添加以下行可以实现此任务：\n\n\
  点击此处查看代码图片\n\n```\n//10.0.2.15/doc   /doc   cifs   user=student,password=sosecret\
  \   0    0\n```\n\n当然，将 SAMBA 密码直接包含 `/etc/fstab` 文件中是非常糟糕的主意，正如 `password=sosecret`\
  \ 设置所做的。本地系统的所有用户都可以查看 `/etc/fstab` 的内容，因此你应该使用凭据文件：\n\n点击此处查看代码图片\n\n```\n//10.0.2.15/doc\
  \   /doc   cifs   credentials=/etc/SAMBA/student 0    0\n```\n\n在 `/etc/SAMBA/student`\
  \ 文件中，你放置如下条：\n\n点击此处查看代码图片\n\n```\nuser=student\npassword=sosecret\n```\n\n###\
  \ 安全要点\n\n确保存储 SAMBA 用户名和密码的文件权限已正确安全。权限应该只允许 root 用户查看此文件的内容，因此考虑使用以下命令进行安全：`chmod\
  \ 600 /etc/SAMBA/student`。\n\n### 网络文件系统\n\n网络文件系统 (NFS) 是一种分布式文件系统 (DFS) 协议，已使用了\
  \ 40 多年。NFS 最初由 Sun Microsystems 在 1984 年创建，旨在为管理员提供一种从一个 UNIX 系统向另一个 UNIX 系统共享文件和目录的简单方法。\n\
  \n自诞生以来，NFS 已移植到多个不同的操作系统，包括 Linux 和 Microsoft Windows。尽管它可能没有 SAMBA 流行，但仍有许多组织在使用\
  \ NFS 共享文件。\n\n#### 配置 NFS 服务器\n\n\n\n\n\n在大多数 Linux 发行版中，默认安装了 NFS 软件；你可以简单地通过\
  \ `nfs`、`nfsserver` 或 `nfs-kernel-service` 启动脚本启动 NFS（脚本名称取决于发行版；你可以在第 15 章“脚本”学习更多脚本知识）。在某些情况下，你可能需要安装\
  \ `nfs-utils` 或 `nfs-kernel-server` 包，但通常 NFS 软件是默认安装的。如果不确定如何安装此软件，请参第 26 章“基于\
  \ Red Hat 的软件管理”和第 27 章“基于 Debian 的软件管理”。\n\n不过，NFS 有一个小技巧。它需要另一个名为 RPC（远程过程调用）\
  \ 的服务。RPC 充当 NFS 客户端和 NFS 服务器之间交互的中间人。RPC 服务由名为 `portmap` 的实用程序提供；当你尝试启动 NFS 服务器时\
  \ `portmap` 服务器未运行，你将收到类似下面的错误消息：\n\n点击此处查看代码图像\n\n```\nCannot register service:\
  \ RPC: Unable to receive; errno = Connection refused\nrpc.rquotad: unable to register\
  \ (RQUOTAPROG, RQUOTAVERS, udp).\n```\n\n### /etc/exports 文件\n\nNFS 服务器的主要配置文件是\
  \ `/etc/exports`。你使用该文件来指定想要与 NFS 客户端共享的目录。该文件的语法为：\n\n```\nDirectory    hostname(options)\n\
  ```\n\n`Directory` 的值应替换为你想要共享的目录名称（例如，`/usr/share/doc`）。`hostname` 的值应该是可以解析为 IP\
  \ 地址的客户端主机名。`options` 值用于指定如何共享该资源。\n\n例如，`/etc/exports` 文件中的以下条目将 `/usr/share/doc`\
  \ 目录与 NFS 客户端 `jupiter` 共享（具有读写选项），与 NFS 客户端 `mars` 共享（具有只读选项）：\n\n点击此处查看代码图像\n\n\
  ```\n/usr/share/doc jupiter(rw) mars(ro)\n```\n\n注意，`jupiter` 和 `mars` 名称/选项之间有一个空格，但主机名与其对应的选项之间没有空格。新手管理员的一个常见错误是提供如下所示的条目：\n\
  \n```\n/usr/share/doc jupiter (rw)\n```\n\n上一行将使用默认选项与 `jupiter` 主机共享 `/usr/share/doc`\
  \ 目录，并且所有其他主机都以读写权限访问此共享。\n\n当你在 `/etc/exports` 文件中指定主机名时，允许以下方法：\n\n*   `hostname`：可以解析为\
  \ IP 地址的主机名。\n*   `netgroup`：使用 `@groupname` 指定的 NIS 网络组。\n*   `domain`：使用通配符的域名。例如，`*.onecoursesource.com`\
  \ 将包含 onecoursesource.com 域名中的任何机器。\n*   `Network`：使用 VLSM（可变子网掩码）或 CIDR（无类域间路由）使用\
  \ IP 地址定义的网络。示例：`192.168.1.0/255.255.255.0` 和 `192.168.1.0/24`。\n\n有很多不同的 NFS 共享选项，包括这些：\n\
  \n*   `rw`：以读写方式共享。记住普通的 Linux 权限仍然有效。（注意这是一个默认选项。）\n*   `ro`：以只读方式共享。\n*   `sync`：文件数据更改立即写入磁盘，会对性能产生影响，但导致数据丢失的可能性较低。在某些发行版中这是默认值。\n\
  *   `async`：`sync` 的相反；文件数据更改最初写入内存。这会提高性能，但更有可能导致数据丢失。在某些发行版中这是默认值。\n*   `root_squash`：将\
  \ NFS 客户端的 root 用户组帐户映射到匿名帐户，通常是 `nobody` 帐户或 `nfsnobody` 帐户。更多细节请参阅下一节“用户 ID 映射”。（注意这是一个默认选项。）\n\
  *   `no_root_squash`：将 NFS 客户端的 root 用户组帐户映射到本地 root 和组帐户。更多细节请参阅下一节“用户 ID 映射”。\n\
  \n### 用户 ID 映射\n\n为了使从 NFS 服务器到 NFS 客户端共享资源的过程尽可能透明，请确保两个系统上使用相同的 UID（用户 ID） 和 GID（组\
  \ ID）。要理解这个概念，请先看图 12-1](#part0026.html_fig12_1)。\n\n![图像](img/00061.jpeg)\n\n**图\
  \ 12-1** *NFS ID 映射——相同的用户和组名*\n\n在图 12-1 中，NFS 服务器和 NFS 客户端都具有相同的学生用户和组帐户。两个系统对这些帐户都使用\
  \ UID `500` 和 GID `500`。NFS 服务器将 `/share` 目录与 NFS 客户端共享，客户端将其挂载在 `/access` 目录下。现在当学生用户尝试访问\
  \ `/access/example` 文件时，该用户对该文件具有 `rw-` 权限。\n\n现在考虑图 12-2](#part0026.html_fig12_2)描述的情况。\n\
  \n![图像](img/00062.jpeg)\n\n**图 12-2** *NFS ID 映射——不同的用户和组名*\n\n在图 12-2](#part0026.html_fig12_2)示例中，NFS\
  \ 客户端对这些帐户具有 UID `500` 和 GID `500`。NFS 服务器将 `/share` 目录与 NFS 客户端共享，客户端将其挂载在 `/access`\
  \ 目录下。现在当学生用户尝试访问 `/access/example` 文件时，该用户对该文件具有 `rw-` 权限。\n\n**安全亮点**\n\n避免帐户不匹配的一种方法是使用中央身份验证系统，例如\
  \ NIS 或 LDAP 服务器。使用中央身份验证系统比使用本地帐户对安全性更好（想象一下在几十个系统上删除同一个帐户的头疼程度）。\n\nNIS 和 LDAP\
  \ 配置涵盖在第 19 章](#part0035.html_ch19)“网络配置”。\n\n记得 `/etc/exports` 的共享选项之一是 `root_squash`。这是因为你可能不想\
  \ NFS 客户端上的 root 帐户对 NFS 服务器上的文件具有 root 权限。`root_squash` 共享选项会导致罕见情况，即普通用户对文件系统中某些内容的权限比\
  \ root 用户还要高。这是一个例子：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# mount | tail\
  \ -1\n192.168.1.22:/share on /access type nfs (rw,addr=192.168.1.22)\n[root@onecoursesource\
  \ ~]# ls -l /access/example\n-rw-r--r--. 1 student student 187 Jan  5 17:14 /access/example\n\
  [root@onecoursesource ~]# echo \"no way\" > /access/example\nbash: /access/example:\
  \ Permission denied\n```\n\n### 服务器进程\n\n到为止，你已经了解到要使系统成为 NFS 服务器，你需要执行以下步骤：\n\n\
  1.  在 `/etc/exports` 文件中创建至少一个共享条目。\n2.  启动 `portmap` 服务。\n3.  启动 NFS 服务。\n\nNFS\
  \ 服务实际上由几个共同工作的不同进程组成，如示例 12-5](#part0026.html_exa12_5)中输出输出所示的。\n\n**示例 12-5**\
  \ *NFS 服务器进程*\n\n点击此处查看代码图像\n\n\n\n\n\n```\n[root@onecoursesource ~]# ps -fe | grep\
  \ 'rpc\\.'\nrpcuser   2074     1  0 Jan03 ?        00:00:00 rpc.statd\nroot    \
  \ 26445     1  0 17:15 ?        00:00:00 rpc.rquotad\nroot     26460     1  0 17:15\
  \ ?        00:00:00 rpc.mountd\nroot     26515     1  0 17:15 ?        00:00:00\
  \ rpc.idmapd\n[root@onecoursesource ~]# ps -fe | grep nfs\nroot     26449    15\
  \  0 17:15 ?        00:00:00 [nfsd4]\nroot     26450     1  0 17:15 ?        00:00:00\
  \ [nfsd]\nroot     26451     1  0 17:15 ?        00:00:00 [nfsd]\nroot     26452\
  \     1  0 17:15 ?        00:00:00 [nfsd]\nroot     26453     1  0 17:15 ?     \
  \   00:00:00 [nfsd]\nroot     26454     1  0 17:15 ?        00:00:00 [nfsd]\nroot\
  \     26455     1  0 17:15 ?        00:00:00 [nfsd]\nroot     26456     1  0 17:15\
  \ ?        00:00:00 [nfsd]\nroot     26457     1  0 17:15 ?        00:00:00 [nfsd]\n\
  ```\n\n取决于你系统中运行了哪些基于 RPC 的服务，如果你运行示例 12-5 中所示命令，可能会看到一些额外的输出行。示例 12-5 提供的列表仅显示了与\
  \ NFS 相关的进程。这些进程如下：\n\n*   `rpc.statd`：此进程在 NFS 客户端正在使用 NFS 服务器资源时，处理 NFS 服务器重启时的恢复过程。\n\
  *   `rpc.rquotad`：此进程与文件系统的配额系统配合工作。\n*   `rpc.mountd`：此进程处理初始的 NFS 客户端挂载请求。（注意，在\
  \ LPIC-2 考试目标中，它被列为 `mountd`，因此在考试时预计会遇到这其中一种称呼。）\n*   `rpc.idmapd`：此进程仅于运行 NFSv4\
  \ 的系统中。它可以用于修改系统之间用户和组名的映射方式。\n*   `nfsd`：也称为 `rpc.nfsd`，此进程处理客户端/服务器关系大部分。如果你的系统同时使用\
  \ NFSv3 和 NFSv4，你还会看到 `nfsd4` 或 `rpc.nfsd4` 进程。\n\n### 理解 portmap\n\n将 `portmap`\
  \ 工具想象成那些老式的电话接线员。你可能在旧电影中见过它们，有人拿起电话说：“接线员，请帮我接通波士顿 4567。”接线员知道应该建立哪种连接来连接双方。如果你无法想象那个例子，可以考虑\
  \ `portmap` 提供了一份地图，列出了计算机上各种服务和程序所使用的端口，就像地图上的图例标识每个元素一样。\n\n这就是 `portmap` 的主要工作。当一个基于\
  \ RPC 的服务启动时，它通过向 `portmap` 提供一个网络端口号来告诉它如何访问自己。当客户端系统尝试连接到服务器时，它会询问 `portmap` 工具该服务正在使用哪个端口。\n\
  \n如果你登录到 NFS 服务器，可以通过执行 `rpcinfo` 命令查看此信息，如示例 12-6 所示。\n\n#### 示例 12-6 `rpcinfo`\
  \ 命令\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# rpcinfo -p\n   program vers\
  \ proto   port\n    100000    2   tcp    111  portmapper\n    100000    2   udp\
  \    111  portmapper\n    100021    1   udp  56479  nlockmgr\n    100021    3  \
  \ udp  56479  nlockmgr\n    100021    4   udp  56479  nlockmgr\n    100021    1\
  \   tcp  36854  nlockmgr\n    100021    3   tcp  36854  nlockmgr\n    100021   \
  \ 4   tcp  36854  nlockmgr\n    100011    1   udp    758  rquotad\n```\n\n\n\n\n\
  点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# showmount -a\nAll mount points on onecoursesource.localdomain:\n\
  10.0.2.15:/share\n```\n\n## 配置 NFS 客户端\n\n挂载 NFS 共享与挂载分区或逻辑卷没有太大区别。首先，创建一个普通目录：\n\
  \n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# mkdir /access\n```\n\n接下来，使用 `mount`\
  \ 命令挂载 NFS 共享：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# mount 192.168.1.22:/share\
  \ /access\n```\n\n你可以通过执行 `mount` 命令或通过查看 `/proc/mounts` 文件来验证挂载是否成功。查看 `/proc/mounts`\
  \ 文件的优势在于它提供了更详细的信息：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# mount | tail\
  \ -1\n192.168.1.22:/share on /access type nfs (rw,addr=192.168.1.22)\n[root@onecoursesource\
  \ ~]# tail -1 /proc/mounts\n192.168.1.22:/share /access nfs rw,relatime,vers=3,rsize=131072,wsize=131072,namlen=255,\n\
  hard,proto=tcp, timeo=600,retrans=2,sec=sys,mountaddr=192.168.1.22,mountvers=3,\n\
  mountport=772,mountproto=udp,local_lock=none,addr=192.168.1.22 0 0\n```\n\n如果 NFS\
  \ 客户端重启，此挂载在系统启动后将不会重新建立。为了使此挂载在重启后保持持久，请在 `/etc/fstab` 文件中添加如下的条目：\n\n点击此处查看代码图片\n\
  \n```\n[root@onecoursesource ~]# tail -1 /etc/fstab\n192.168.1.22:/share      /access\
  \  nfs      defaults      0      0\n```\n\n在 `/etc/fstab` 文件中添加此条目后，卸载 NFS 共享（如有必要），并在执行\
  \ `mount` 命令时仅提供挂载点来测试新条目：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# umount\
  \ /access\n[root@onecoursesource ~]# mount /access\n[root@onecoursesource ~]# mount\
  \ | tail -1\n192.168.1.22:/share on /access type nfs (rw,addr=192.168.1.22)\n```\n\
  \n回 `/etc/fstab` 文件的第四字段包含挂载选项。NFS 有多种挂载选项可用，包括一些默认挂载选项。表 12-2 描述了这些选项，默认选项已加粗。\n\
  \n### 表 12-2 NFS 挂载选项\n\n| 选项 | 说明 |\n| --- | --- |\n| soft|hard | NFS 客户端会在特定时间内尝试挂载\
  \ NFS 服务器（参见 `timeo=` 选项）。如果服务器没有响应且使用了 `hard` 选项，NFS 客户端将无限尝试挂载。如果使用 `soft` 选项，NFS\
  \ 客户端将停止尝试挂载服务器。这在启动过程中非常重要。你不希望系统挂起，反复尝试挂载一个无法访问的 NFS 服务器资源（可能是服务器宕机或存在网络问题）。 |\n\
  | fg|bg | 在启动过程中执行前台 (`fg`) 挂载或后台 (`bg`) 挂载。如果你决定使用 `hard` 选项，请考虑将挂载放在 `bg` 模式，以便系统继续启动而不会在\
  \ NFS 服务器不可用时可能挂起。 |\n| timeo= | 使用 1/10 秒设置超时值。例如，`timeo=300` 表示 30 秒的超时值。 |\n\
  | retrans= | 指定重试挂载 NFS 共享的次数。默认进行 3 次 UDP 尝试和 2 次 TCP 尝试。 |\n| retry= | 在超时之前尝试的次数。默认值取决于你的发行版和\
  \ NFS 版本。 |\n| rsize= | 每个 READ 请求的最大字节字节数。管理员通常将其设置为 8192（默认值可以是 1024、4096 或 8192，取决于你的发行版）。\
  \ |\n| wsize= | 每个 WRITE 请求的最大字节字节数。管理员通常将其设置为 8192（默认值可以是 1024、4096 或 8192，取决于你的发行版）。\
  \ |\n\n## iSCSI\n\n### iSCSI (互联网小型计算机接口)\n\n**Gary**: 嘿，Julia。你能来选一个吗？\n\n**Julia**:\
  \ 没问题。\n\n**Gary**: 我正在尝试理解 iSCSI 提供了什么。\n\n**Julia**: 嗯，你真正需要考虑的是远程存储相对于本地存储提供了什么。\n\
  \n**Gary**: 比如扩展性，对吧？\n\n**Julia**: 这是优势之一。例如，本地空间可能非常有限，而远程存储可以使用数据中心。此外，请记住网络连接性非常重要。\n\
  \n**Gary**: 那么，如果我决定使用远程存储，有哪些选择？\n\n**Julia**: 你可以使用像 Samba 或 NFS 这样的文件共享服务。这些通常被称为\
  \ NAS，即网络附属存储。虽然这些服务具有某些优势，但它们的设计目的是为了共享文件系统的一部分。iSCSI 为客户端系统提供了一个工作类似于硬盘的设备，但显然是远程的。\n\
  \n**Gary**: 好的，那么还有其他我应该考虑的 iSCSI 替代方案吗？\n\n**Julia**: 是的，你也可以选择光纤，通常被称为 FC。\n\n\
  **Gary**: 那么，FC 的优缺点是什么？\n\n**Julia**: 这并不总是一个一而易见的答案，但通常 FC 将具有非常强的性能和可靠性，但成本比\
  \ NAS 和 iSCSI 解决方案高。此外，FC 在局域网中提供了很好的解决方案，而 NAS 和 iSCSI 是广域网更好的解决方案。\n\n**Gary**:\
  \ 好的，这给了我一个起点。听起来在做决定之前，我真的应该获取每种解决方案的更多细节。\n\n**Julia**: 是的，这是你不直接跳入的内容。在采取任何行动之前，规划你的网络存储需求并确定哪种解决方案最合适。\n\
  \n要理解 iSCSI，你首先需要了解一些关键术语：\n\n*   **Target (目标)**: 该术语描述位于服务器上的存储设备。服务器可以在局域网内，也可以在广域网上。将目标设为被共享的存储设备。此外，请记住，目标被视为设备而不是文件系统。当客户端系统访问此设备时，它可以像像硬盘一样被对待。\n\
  *   **Initiator (启动器)**: 这是连接到目标的客户端。在某些情况下，启动器被称为 iSCSI 客户端。\n\n\n\n\n\n-   **WWID**:\
  \ 全局标识符（World Wide Identifier）；这是一个保证在全球范围内唯一的标识符。对于连接到互联网的 iSCSI 设备来说，这个唯一编号非常重要，可以确保没有其他\
  \ iSCSI 设备具有相同的标识号。它在概念上类似于网卡上的 MAC 地址（这是一个其他网卡不拥有的唯一标识符）。在 iSCSI 服务器上，将通过符号链接文件和实际设备文件名建立关联。`WWN`（全球名称）有时与\
  \ `WWID` 互换使用。\n-   **LUN**: 逻辑单元数（Logical Unit Number）；这是目标端用于识别 iSCSI 设备的值。该概念源于\
  \ SCSI，在每个系统中，每个 SCSI 设备都可以通过如下所示的 `LUN` 来识别：`/dev/dsk/c0t0d0s0`。`c0t0d0s0` 表示你想要访问的\
  \ SCSI 设备的控制器卡、目标、磁盘和切片（分区）。对于 iSCSI，重要的是要理解 `WWID` 是互联网上唯一的名称，而 `LUN` 仅在本地系统中是唯一的。\n\
  \n### 目标配置\n\n要将你的系统配置为 iSCSI 服务器，你首先需要安装 `scsi-target-utils` 包及其依赖项。大多数发行版通常不会默认安装此包。（有关如何管理软件包的信息，请参阅\
  \ 第 26 章“基于 Red Hat 的软件管理”和 第 27 章“基于 Debian 的软件管理”。）请记住，`scsi-target-utils` 包还包含一些需要安装的依赖包。如果你不确定如何安装此软件，请查看\
  \ 第 26 章和 第 27 章。\n\n安装软件包后，编辑 `/etc/tgt/targets.conf` 文件来创建目标。该条目看起来应该如下所示：\n\n\
  点击此处查看代码图像\n\n```\n<target iqn.2018-10.localdomain.onecoursesource:test1>\n    \
  \    backing-store /dev/VolGroup/iscsi\n        initiator-address 10.0.2.15\n</target>\n\
  ```\n\n在这里，`iqn.2018-10.localdomain.onecoursesource:test1` 是为此目标创建唯一名称的方法，类似于之前提到的\
  \ `WWID`。其格式应为 `iqn.year-month.domain_in_opposite_order:name_for_target`。例如，如果你想在\
  \ `test.sample.com` 机器上创建一个名为 `firefly` 的目标，且现在是 2018 年 10 月，那么你创建的名称就是 `iqn.2018-10.com.sample.test:firefly`。\n\
  \n`backing-store` 值应该是一个没有存储数据或文件系统的设备，例如新创建的分区或逻辑卷。记住，你正在创建一个设备目标，而不是共享一个已的文件系统。\n\
  \n`initiator-address` 描述了哪些系统允许访问此目标。\n\n接下来，启动 `tgtd` 守护进程。在 SysVinit 系统上执行以下命令：\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# /etc/init.d/tgtd start\nStarting\
  \ SCSI target daemon:                            [  OK  ]\n```\n\n最后，执行 `tgt-admin\
  \ --show` 命令以验证目标已启用，如示例 12-7\n\n```\n[root@onecoursesource ~]# tgt-admin --show\n\
  Target 1: iqn.2018-10.localdomain.onecoursesource:test1\n    System information:\n\
  \        Driver: iscsi\n        State: ready\n    I_T nexus information:\n    LUN\
  \ information:\n        LUN: 0\n            Type: controller\n            SCSI ID:\
  \ IET     00010000\n            SCSI SN: beaf10\n            Size: 0 MB, Block size:\
  \ 1\n            Online: Yes\n            Removable media: No\n            Prevent\
  \ removal: No\n            Readonly: No\n            Backing store type: null\n\
  \            Backing store path: None\n            Backing store flags:\n      \
  \  LUN: 1\n            Type: disk\n            SCSI ID: IET     00010001\n     \
  \       SCSI SN: beaf11\n            Size: 264 MB, Block size: 512\n           \
  \ Online: Yes\n            Removable media: No\n            Prevent removal: No\n\
  \            Readonly: No\n            Backing store type: rdwr\n            Backing\
  \ store path: /dev/VolGroup/iscsi\n            Backing store flags:\n    Account\
  \ information:\n    ACL information:\n        10.0.20\n```\n\n### 发起器配置\n\n要将你的系统配置为\
  \ iSCSI 发起器，你首先需要安装 `iscsi-initiator-utils` 包及其依赖项。大多数发行版通常不会默认安装此包。\n\n安装软件包后，你可以使用\
  \ `iscsiadm` 命令查看 iSCSI 服务器提供的目标名称。要执行此任务，请使用以下 `iscsiadm` 命令：\n\n点击此处查看代码图像\n\n\
  ```\n[root@onecoursesource ~]# iscsiadm -m discovery -t sendtargets -p 10.0.2.15\n\
  Starting iscsid:                                      [  OK  ]\n10.0.2.20:3260,1\
  \ iqn.2018-10.localdomain.onecoursesource:test1\n```\n\n注意，当你第一次执行此命令时，它会自动启动 `iscsid`\
  \ 守护进程。\n\n你在 `iscsiadm` 命令输出中寻找的是哪些机器可以作为发起器（在本例中为 `10.0.2.20`）以及 IQN（iSCSI 节点名称）。发起器列表应该包含你正在执行命令的机器（客户端），以便你能够连接到\
  \ iSCSI 目标。\n\n现在目标已经发现，连接到它的简单方法是启动 `iscsi` 服务：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# /etc/init.d/iscsi restart\n```\n\n`iscsi` 脚本启动 `iscsid` 守护进程，该守护进程负责管理发起器侧的\
  \ iSCSI 目标。虽然你可能不会更改 `iscsid` 守护进程的配置脚本，但你应该知道它位于 `/etc/iscsi/iscsid.conf` 文件。\n\
  \n`iscsi` 脚本也是确定目标在本地系统中分配的设备名称极佳方法，如示例 12-8 中突出输出所示。\n\n**示例 12-8** 确定 iSCSI 目标的本地设备名称\n\
  \n点击此处查看代码图像\n\n\n\n\n\n```\n[root@onecoursesource ~]# /etc/init.d/iscsi status\n\
