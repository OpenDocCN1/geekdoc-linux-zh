  \nThen you place the complete mount point, mount options, and device to mount in\
  \ the `/etc/auto.direct` file:\n\n点击此处查看代码图像\n\n```\n/remote/aliens    -fstype=nfs\
  \    plan9:/aliens\n```\n\nRemember to restart the autofs services whenever you\
  \ make changes to any of these map files.\n\n\n\n\n听起来 LVM 似乎完美解决了一切。诚然，在大多数情况下，你可能应该使用\
  \ LVM 而不是传统分区，但 LVM 也有一些你应当考虑的缺点：\n\n*   LVM 不像 RAID 那样提供冗余功能（话虽如此，传统分区也不提供）。不过，你可以通过创建软件\
  \ RAID 1 设备并将其作为 LVM 内部使用的存储设备来解决这个问题。LVM2 还具有一个整合软件 RAID 的功能（但仅针对第 4、5 或 6 层，不适用于第\
  \ 1 层）。\n*   一些较旧的固件和引导加载程序不知道如何访问 LVM 设备。因此，你经常看到 `/boot` 文件系统放置在普通分区上。然而，随着更现代的固件和引导加载程序能够访问\
  \ LVM 设备，这种情况最近开始发生变化。\n\n## 在单硬盘系统上使用 LVM 的优势\n\n你可能会疑惑，为什么在只有一个硬盘的系统上要使用 LVM。为了回答这个问题，让我们来为你介绍一个我们在系统管理员职业生涯中多次处理过的情况。\n\
  \n我们经常被指派安装新系统，并且总是尝试根据情况创建合理的划分。例如，如果我们正在安装一台邮件服务器，我们会确保创建一个单独 `/var` 文件系统。如果我们正在安装的一台有多个用户的机器，我们会确保\
  \ `/home` 文件系统位于单独的分区上。因此，最终得到的分区布局看起来像表 11-2 中描述的布局并不罕见。\n\n### 表 11-2 示例分区布局\n\
  \n| 分区 | 挂载点 | 大小 |\n| --- | --- | --- |\n| `/dev/sda1` | `/boot` | 200MB |\n| `/dev/sda2`\
  \ | `/var` | 1.5GB |\n| `/dev/sda5` | `/` | 5GB (注：`/dev/sda3` 未使用，`/dev/sda4` 是扩展分区。)\
  \ |\n| `/dev/sda6` | `/tmp` | 500MB |\n| `/dev/sda7` | `/home` | 2.5GB |\n\n通常情况下，表\
  \ 11-2 中描述的文件系统布局在一段时间内运行良好。然而，这并不总是持久的，因为文件系统空间需要随时间发生变化。例如，有一次发现 `/tmp` 文件系统经常填满，但\
  \ `/home` 文件系统的占用率甚至不到 10%。如果能从 `/home` 文件系统（位于 `/dev/sda7` 分区）中取一些空间并分给 `/tmp`\
  \ 文件系统（位于 `/dev/sda6` 分区）就太棒了，但这并不是一项简单的任务。通常步骤如下：\n\n**步骤 1.**** 备份 `/home` 中的数据（`/tmp`\
  \ 是临时数据，因此没有必要备份该文件系统）。\n**步骤 2.**** 卸载 `/home` 和 `/tmp`（这可能需要切换到单用户模式）。\n**步骤 3.****\
  \ 销 `/dev/sda7` 和 `/dev/sda6` 分区。\n**步骤 4.**** 创建新的、调整大小后的 `/dev/sda7` 和 `/dev/sda6`\
  \ 分区。\n**步骤 5.**** 在新分区上创建文件系统。\n**步骤 6.**** 恢复数据。\n**步骤 7.**** 挂载 `/home` 和 `/tmp`\
  \ 文件系统。\n\n如果你认为这些工作量太大，可以考虑从 `/home` (`/dev/sda7`) 文件系统取空间并分给 `/var` (`/dev/sda2`)\
  \ 文件系统。这可能需要更改除 `/dev/sda1` 分区以外的所有分区，这将花费大量的时间和精力。\n\n如果这些是 LVM 存储设备而不是普通分区，过程将简单得多，所需的数据备份和停机时间也会少得多。你可以轻松缩小\
  \ LVM 存储设备的空间并将该空间提供另一个 LVM 存储设备，或者你只需要向系统添加一个新的存储设备并将该空间提供给需要空间的文件系统。\n\n## LVM\
  \ 基础\n\n希望到现在你已经被 LVM 的优点说服，并且至少愿意放弃普通分区而选择 LVM。下一个障碍是理解 LVM 的概念。\n\n**注意**\n\n\
  如果你想练习 LVM 命令，考虑使用虚拟机。如果你正在使用虚拟机，可以轻松地创建三个新的虚拟硬盘来练习本章介绍的 LVM 命令。\n\n回到原始场景：你有三块\
  \ 40GB 的硬盘，你需要让内核将这总共 100GB 的空间视为单个存储设备。在安装这些设备后，该过程的第一步是将它们转换为物理卷 (PVs)。这是通过执行\
  \ `pvcreate` 命令完成的。例如，如果你有三个设备名为 `/dev/sdb`、`/dev/sdc` 和 `/dev/sdd` 的驱动，可以通过执行以下命令将它们转换为\
  \ PV：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource Desktop]# pvcreate /dev/sdb /dev/sdc\
  \ /dev/sdd\n```\n\n\n\n\n为了视觉化物理范围（extents）的概念，请查看图 11-4 中的黑色框（但请想象有更多这样的框，因为在我们场景中每个\
  \ PV 都是 40GB，而每个范围仅为 4MB）。\n\n![Image](img/00054.jpeg)\n\n**图 11-4** *物理范围*\n\n\
  如果你想查看范围的大小以及其他有用的 VG 信息，请执行 `vgdisplay` 命令，如示例 11-4 所示。\n\n**示例 11-4** *`vgdisplay`\
  \ 命令*\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# vgdisplay VG0\n  --- Volume\
  \ group ---\n  VG Name               VG0\n  System ID\n  Format                lvm2\n\
  \  Metadata Areas        3\n  Metadata Sequence No  1\n  VG Access             read/write\n\
  \  VG Status             resizable\n  MAX LV                0\n  Cur LV        \
  \        0\n  Max PV                0\n  Cur PV                3\n  Act PV     \
  \           3\n  VG Size               1.49 GiB\n  PE Size               4.00 MiB\n\
  \  Total PE              381\n  Alloc PE / Size       0 / 0\n  Free  PE / Size \
  \      381 / 1.49 GiB\n  VG UUID               AbRpPe-vaV3-1SKI-eFMB-IN48-Fdkt-U54OW7\n\
  ```\n\n### 注意\n\n虽然原始场景是使用三块 40GB 的硬盘，但此示例使用了三个 500MB 的虚拟硬盘。如果你在虚拟机上练习这些命令，我们建议使用较小的虚拟硬盘，而不是浪费空间去创建巨大的虚拟硬盘。\n\
  \n注意，格式被设置为 `lvm2`，因此在该系统上，我们没有受到每个 LV 最多 65,534 个范围的限制。`VG Size` 值表示 VG 中可用的空间大小，而\
  \ `Total PE` 值表示可分配给 LV 的物理范围总数。\n\n如果你在 `vgdisplay` 命令中使用 `-v` 选项，还可以看到与该 VG 关联的任何\
  \ PV 和 LV 的信息。此时我们还没有创建任何 LV，因此执行 `vgdisplay -v` 命令将提供示例 11-5 所示的额外信息。\n\n**示例 11-5**\
  \ *`vgdisplay -v` 命令*\n\n点击此处查看代码图像\n\n```\n--- Physical volumes ---\nPV Name  \
  \             /dev/sdb\nPV UUID               K6ikZy-yRxe-mwVf-ChQP-0swd-OvNA-L56QNT\n\
  PV Status             allocatable\nTotal PE / Free PE    127 / 127\n\nPV Name  \
  \             /dev/sdc\nPV UUID               1eCbvm-FzNb-479B-5OAv-CTje-YWEe-gJhcyK\n\
  PV Status             allocatable\nTotal PE / Free PE    127 / 127\n\nPV Name  \
  \             /dev/sdd\nPV UUID               7KUVBt-Un5l-0K3e-aeOy-deqP-iUW4-24fXwI\n\
  PV Status             allocatable\nTotal PE / Free PE    127 / 127\n```\n\n你也可以通过执行\
  \ `pvdisplay` 命令查看有关 PV 的详细信息，如示例 11-6 所示。\n\n**示例 11-6** *`pvdisplay` 命令*\n\n点击此处查看代码图像\n\
  \n```\n[root@onecoursesource ~]# pvdisplay /dev/sdb\n --- Physical volume ---\n\
  \ PV Name               /dev/sdb\n VG Name               VG0\n PV Size         \
  \      512.00 MiB / not usable 4.00 MiB\n Allocatable           yes\n PE Size  \
  \             4.00 MiB\n Total PE              127\n Free PE               127\n\
  \ Allocated PE          0\n PV UUID               K6ikZy-yRxe-mwVf-ChQP-0swd-OvNA-L56QNT\n\
  ```\n\n### 注意\n\n当引用 PV 上的范围时，我们将其其为物理范围（physical extents）。当 LV 使用这些物理范围时，它们被称为逻辑范围（logical\
  \ extents）。它们并不是两个不同的东西，而是从两个视角观察同一个事物。它们通常直接被称为范围（extents），但你应该意识到，有些 LVM 文档会使用\
  \ PE 或 LE 术语。\n\n### 逻辑卷\n\n要使用 VG 中的空间创建 LV，请执行 `lvcreate` 命令。在创建 LV 时，你可以启用多个选项。一个简单的示例是创建一个\
  \ LV 并指定你想要使用多少个范围：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# lvcreate -l\
  \ 100 -n testlv VG0\n  Created 100 logical extents 1 logical volume \"testlv\" in\
  \ volume group \"VG0\" now active\n```\n*(注：此处原文未提供完整示例代码块，但根据上下文推断为 lvcreate 命令示例)*\n\
  \n*(由于原文文本中后部分存在断裂或格式混乱，翻译已根据逻辑进行了对齐处理)*\n\n\n\n\n```\n[root@onecoursesource ~]#\
  \ mkfs -t ext4 /dev/mapper/VG0-lv0\nmke2fs 1.41.12 (17-May-2010)\nFilesystem label=\n\
  OS type: Linux\nBlock size=1024 (log=0)\nFragment size=1024 (log=0)\nStride=0 blocks,\
  \ Stripe width=0 blocks\n6144 inodes, 24576 blocks\n1228 blocks (5.00%) reserved\
  \ for the super user\nFirst data block=1\nMaximum filesystem blocks=25165824\n3\
  \ block groups\n8192 blocks per group, 8192 fragments per group\n2048 inodes per\
  \ group\nSuperblock backups stored on blocks:\n        8193\nWriting inode tables:\
  \ done\nCreating journal (1024 blocks): done\nWriting superblocks and filesystem\
  \ accounting information: done\nThis filesystem will be automatically checked every\
  \ 20 mounts or\n180 days, whichever comes first. Use tune2fs -c or -i to override.\n\
  ```\n\n现在，创建一个挂载点，挂载文件系统并验证挂载情况如下所示：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# mkdir /storage-lv0\n[root@onecoursesource ~]# mount /dev/mapper/VG0-lv0 /storage-lv0\n\
  [root@onecoursesource ~]# mount | grep lv0\n/dev/mapper/VG0-lv0 on /storage-lv0\
  \ type ext4 (rw)\n```\n\n最后，在 `/etc/fstab` 文件中添加如下条目：\n\n点击此处查看代码图像\n\n```\n/dev/mapper/VG0-lv0\
  \  /storage  ext4  defaults 0 2\n```\n\n### 显示 LVM 信息\n\n有几个命令可以显示 LVM 信息，包括我们已经介绍过的几个。例如，回想\
  \ `vgdisplay` 命令提供有关 VG 的信息。现在已经创建了两个新的 LV，请查看示例 11-8，观察与之前执行 `vgdisplay` 命令输出的差异。\n\
  \n**示例 11-8** *LV 创建后的 `vgdisplay` 命令*\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# vgdisplay -v VG0\n    Using volume group(s) on command line.\n  --- Volume\
  \ group ---\n  VG Name               VG0\n  System ID\n  Format                lvm2\n\
