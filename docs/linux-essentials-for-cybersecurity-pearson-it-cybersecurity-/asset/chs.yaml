  \ (0xaa9eaa4114c35f82)\n        Validity\n            Not Before: Dec 15 03:00:07\
  \ 2017 GMT\n            Not After : Dec 14 03:00:07 2020 GMT\n        Subject:\n\
  \            countryName               = US\n            stateOrProvinceName   \
  \    = CA\n            localityName              = San Diego\n            organizationName\
  \          = OCS\n            commonName                = OCS\n            emailAddress\
  \              = bo@onecoursesource.com\n        X509v3 extensions:\n          \
  \  X509v3 Basic Constraints:\n                CA:FALSE\n            Netscape Comment:\n\
  \                OpenSSL Generated Certificate\n            X509v3 Subject Key Identifier:\n\
  \                C5:04:9F:4C:07:BE:1D:EE:0E:36:44:C7:DF:7B:68:3C:5C:B3:4D:B2\n \
  \           X509v3 Authority Key Identifier:\n                keyid:3F:DD:38:62:16:2A:65:12:09:B8:63:55:E5:9B:AB:2B:24:0A:C1:E0\n\
