  \ SUID 或 SGID 权限而提供了特权？”\n\n最后，请注意在本节演示的命令是在已经安装了软件的系统中执行的。你应该在测试系统上审核软件包，在测试系统中你可以安全地安装软件包，而不必担心影响关键系统。该系统不应连接网络。这允许你在决定是否将软件安全地安装到“真实”系统之前运行并测试每条命令。\n\
  \n## 确保从可信源安装\n\n许多管理员依赖 `yum`、`dnf` 和 `apt-get` 命令下载并安装软件程序。只要这些工具配置为从可信源下载，这就不是坏习惯。然而，你的安全策略应该包含一个过程，在以此方式安装软件包之前确认软件包的源位置。\n\
  \n这意味着你应该包含对指向 `yum`、`dnf` 和 `apt-get` 命令仓库服务器配置文件的审查：\n\n*   对于 `yum` 和 `dnf`：`/etc/yum.conf`\
  \ 文件和 `/etc/yum.repos.d` 目录下的文件。\n*   对于 `apt-get`：`/etc/apt/sources.list` 文件或位于\
  \ `/etc/apt/sources.list.d` 目录的文件。\n\n此外，当你直接从其他源获取软件时，应该格外小心，例如从网站下载软件包或通过电子邮件接收软件包。非常仔细地考虑是否应该安装此类软件包，如果你决定继续安装，请对其进行仔细审查。\n\
  \n## CVE\n\n\n\n\n常见漏洞与披露 (CVE)是一个旨在提供单一位置以让你了解与安全相关的软件问题的系统。该系统由 MITRE 公司维护，并可以通过\
  \ [`cve.mitre.org`](http://cve.mitre.org) 访问，如图 29-1 所示。\n\n![Image](img/00117.jpeg)\n\
  \n**图 29-1** *CVE 网站*\n\n当漏洞被发现并报告给 MITRE 时，它会被分配一个唯一的 ID，无论该漏洞是在哪种发行版中发现的。因此，每个漏洞都可以使用此唯一\
  \ ID 进行引用，使得在支持许多不同发行版的环境中工作时更容易跟踪它。\n\nCVE 数据对任何人免费开放。这对于管理员来说是极好的的，因为他们可以获得漏洞的详细信息，但这意味着如果你不保持系统更新，黑客也可能利用这些信息攻击你的系统。\n\
  \n你的安全策略应该包括定期审查相关 CVE 的做法，以确定可能的安全漏洞。你可以下载所有的 CVE 并使用 `grep` 命令找到与你系统中安装的软件相关的漏洞。你还可以利用\
  \ CVE 网站上的搜索工具。图 29-2 展示了 `zsh`（Z shell）的搜索结果。\n\n![Image](img/00118.jpeg)\n\n**图\
  \ 29-2** *CVE 搜索结果*\n\n你应该考虑使用“数据馈送 (Data Feeds)”，这是网站上的一个功能，让你能够通过 Twitter 或电子邮件了解\
  \ CVE。如果你选择电子邮件，请记住这可能会导致大量邮件，因此考虑使用特定的电子邮件地址，例如通用部门地址或仅限管理员的地址专门接收这些安全警报，特别是当有多个管理员将审查信息并做出决策时（例如如果不同的管理员负责每个班次）。\n\
  \nCVE 中提供的信息定义非常明确，包含以下内容：\n\n*   唯一的 CVE ID。\n*   对问题的简要描述。\n*   附加信息的引用。\n*  \
  \ 分配 CVE 唯一 ID 的组织。\n*   CVE 创建的日期。这是一个非常重要的字段，因为旧的 CVE 在现代版本的软件中可能不是问题。软件供应商通常会发布补丁来修复任何报告为\
  \ CVE 的漏洞。\n\n请参见图 29-3 的 CVE 示例。\n\n![Image](img/00119.jpeg)\n\n**图 29-3** *CVE\
  \ 示例*\n\n### 针对特定发行版的安全警报\n\n每个发行版通常会有自己的安全警报。这是因为构建发行版的工作之一就是对其他开源项目提供的软件进行定制。例如，Z\
  \ shell 可能会被修改，以为你系统中安装的发行版提供额外的功能。\n\n这也是为什么许多组织只安装和支持一两个发行版的原因之一。环境中的发行版越多，意味着妥善保护每个系统所需的工作就越多。你的安全计划应该包括定期审查\
  \ CVE 以及审查发行版的安全警报。\n\n例如，考虑红帽企业级 Linux (Red Hat Enterprise Linux, RHEL)。红帽使用红帽安全通告\
  \ (RHSAs 来通知安全人员任何潜在的漏洞。红帽在适当的情况下引用 CVE，以便你意识到这是所有发行版中的问题，而不仅仅是 RHEL。\n\nRHSA 明确指出了哪些版本的发行版可能受到影响。这是重要的，因为你不想调查并不影响你当前发行版的漏洞。请参见图\
  \ 29-4 的 RHSA 示例。\n\n![Image](img/00120.jpeg)\n\n**图 29-4** *RHSA 示例*\n\n### xinetd\n\
