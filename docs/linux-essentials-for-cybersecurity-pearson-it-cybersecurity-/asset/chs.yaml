  \ 26 章至第 28 章中获取的知识创建安全策略的方法。\n\n第 30 章, “足迹扫描,” 涵盖了黑客用于发现系统信息的技巧。通过学习这些技术，你应该能够制定一个更好的安全计划。\n\
  \n第 31 章, “防火墙,” 探索了如何配置保护你的系统免受网络攻击的软件。\n\n第 32 章, “入侵检测,” 提供了对工具和技术的理解，以确定是否有人成功攻破了你系统的安全性。\n\
  \n第 33 章, “额外的安全任务,” 涵盖了各种额外的 Linux 安全功能，包括 fail2ban 服务、虚拟专用网络 (VPNs) 和文件加密。\n\n\
  # 第一部分\n\n介绍 Linux\n\n1991 年，赫尔辛基大学的学生 Linus Benedict Torvalds（林纳·贝尼迪特·托瓦兹）正在使用一个名为\
  \ Minix 的操作系统。Minix（源自“mini-Unix”）是一种设计用于教育环境的类 Unix 操作系统。虽然 Linus 喜欢 Minix 的许多功能，但他发现它总体上有所不足。因此，在\
  \ 1991 年 8 月 25 日，他在网上发布了以下帖子：\n\n“你好，使用 Minix 的朋友们——\n\n我正在编写一个（免费的）操作系统（只是一个爱好，不会像\
  \ gnu 那样大而专业），用于 386(486) AT 兼容机。这个项目从 4 月就开始酝酿，现在开始准备就绪了。我想听听大家对 Minix 中喜欢/不喜欢之处的反馈，因为我的操作系统和它很相似（出于实用考虑，文件系统的物理布局也是相同的，等等）。”\n\
  \n这个“只是一个爱好”的项目就是最终演变成 Linux 的开始。从那时起，Linus 的项目已成为现代 IT 蓝图的重要组成部分。它产生了一个供全球数百万用户使用的健壮操作系统。事实上，Linux\
  \ 在某种程度上很难回避的，因为它驱动着许多手机（Android 基于 Linux），并且是许多 Web 服务器、电子邮件服务器和其他基于互联网的服务器的首选操作系统。\n\
  \n在第一部分“介绍 Linux”中，你将接触一些重要的 Linux 主题：\n\n*   第 1 章, “发行版和核心组件,” 深入探讨了与理解 Linux\
  \ 各部分相关的本质信息。你将学习到 Linux 操作系统的不同组件，以及什么是发行版。\n*   第 2 章, “在命令行上工作,” 涵盖了在 Linux 中工作所需的本质命令。\n\
  *   第 3 章, “获取帮助,” 将你提供了获取 Linux 额外信息的方法。这包括操作系统原生提供的文档。\n*   第 4 章, “编辑文件,” 专注于你可以用于编辑文本文件的工具。编辑文本文件是一项关键的\
  \ Linux 任务，因为大部分配置数据存储在文本文件中。\n*   第 5 章, “当出现问题时,” 回顾了如何处理 Linux 中可能出现的问题。本章提供了如何排除系统问题的细节。\n\
  \n## 第 1 章：发行版和核心组件\n\n在你开始学习 Linux 的所有功能和能力之前，了解 Linux 是什么以及主要组件会有帮助。在本章中，你学习了\
  \ Linux 的一些基本概念。你发现了什么是发行版以及如何选择最适合你的一个。你还被介绍了安装 Linux 的过程。\n\n在阅读本章并完成练习后，你将能够做到：\
  \ \n\n- 描述 Linux 的各个部分\n- 识别组成 Linux 操作系统的主要组件\n- 描述不同发行版\n- 识别安装 Linux 的步骤\n\n\
  ### 介绍 Linux\n\nLinux 是一个操作系统，就像 Windows 一。然而，这种定义非常简单。从技术上说，Linux 是名为 `kernel`\
  \ (#part0055.html_gloss05) 的软件组件，而内核是控制操作系统的软件。\n\n内核本身无法提供完整操作系统所需的功能。实际上，许多不同的组件结合在一起定义了\
  \ IT 专业人员所说的 Linux 操作系统，如图 1-1 (#part0013.html_fig1_1)所示。\n\n![Image](img/00002.jpeg)\n\
  \n**图 1-1** *Linux 操作系统的组件*\n\n需要注意的是，图 1-1 (#part0013.html_fig1_1) 中描述的所有组件并不是\
  \ Linux 操作系统总是需要的。例如，不需要图形用户界面 (GUI)。实际上，在 Linux 服务器系统中很少安装 GUI，因为它需要额外的硬盘空间、CPU\
  \ 周期和随机存储器 (RAM) 使用。\n\n**安全亮点**\n\n你可能会奇怪 GUI 软件如何构成安全风险。事实上，任何软件组件都会构成安全风险，因为它是操作系统另一个可能被攻破的部分。当你设置\
  \ Linux 系统时，务必确保只安装该特定用例所需的软件。\n\n图 1-1 (#part0013.html_fig1_1) 所示的 Linux 操作系统部分如下列表所示：\n\
  \n\n\n\n\n- **用户实用程序 (User utilities)**：用户使用的软件。Linux 拥有数以千计的可以在命令行或 GUI 环境下运行的程序。本书将介绍这些实用程序中的许多。\n\
  \n- **服务器软件 (Server software)**：操作系统用于提供某种功能或访问权限的软件，通常跨网络进行。常见示例包括文件共享服务器、提供网站访问的\
  \ Web 服务器以及邮件服务器。\n\n- **Shell (Shells)**：要通过命令行与 Linux 操作系统进行交互，你需要运行一个 Shell 程序。有几种不同的\
  \ Shell 可用，将在本章稍后部分进行讨论。\n\n- **文件系统 (File systems)**：与操作系统一样，文件和目录（又文件夹）存储在定义良好的结构中。这种结构被称为`文件系统`。Linux\
  \ 有多种不同的文件系统可供。关于此主题的详细信息将在第 10 章“管理本地存储：核心要素”以及第 11 章“管理本地存储：高级特性”中介绍。\n\n- **内核\
  \ (The kernel)**：内核是 Linux 中控制操作系统的组件。它负责与系统硬件交互以及处理操作系统的关键功能。\n\n- **内核模块**：内核模块是一种能为内核提供更多功能的程序。你可能会听说\
  \ Linux 内核是一个模块化内核。作为一个模块化内核，Linux 内核往往更具扩展性、安全性且资源消耗更低（换句话说，它是轻量级的）。\n\n- **GUI\
  \ 软件 (GUI software)**：图形用户界面 (GUI)软件为 Linux 操作系统提供了“基于窗口”的访问。与命令行 Shell 一样，在为 Linux\
  \ 操作系统选择 GUI 时你有很多选择。GUI 软件将在本章稍后部分详细介绍。\n\n- **库**：这是由其他程序用于执行特定任务的软件集合。虽然库是 Linux\
  \ 操作系统的一个重要组件，但它们不会是本书的重点。\n\n- **设备文件 (Device files)**：在 Linux 系统上，一切皆可视为文件，包括硬件设备。设备文件是系统用于与设备（如硬盘、键盘或网卡）交互的文件。\n\
  \n### Linux 发行版\n\n构成 Linux 操作系统的各种软件部分非常灵活。此外，大多数软件都是以“开源”形式许可的，这意味着使用这些软件的成本通常为零。这些特性（灵活和开源）的结合催生了大量的\
  \ Linux 发行版。\n\nLinux 发行版（也称为`发行版/distro`）是 Linux 操作系统的一种特定实现方式。每个发行版都会与其他发行版共享许多共同特征，例如核心内核、用户实用程序和其他组件。发行版之间最常见的区别在于它们的整体目标或用途。例如，以下列表描述了几种常见的发行版类型：\n\
  \n- **商业型 (Commercial)**：设计用于商业环境的发行版。这些发行版通常会与支持合同捆绑。因此，尽管操作系统本身可能是免费的，但支持合同会增加年度费用。商业版本通常具有较慢的发布周期（3–5\
  \ 年），从而提供更稳定、更安全的平台。商业发行版的典型示例包括 Red Hat Enterprise Linux 和 SUSE。\n\n- **家庭或业余型\
  \ (Home or amateur)**：这些发行版侧重于为想要 macOS 或 Microsoft Windows 之外选择的个人提供 Linux 操作系统。通常这些发行版只有社区支持，发布周期极快（3–6\
  \ 个月），因此所有最新功能都能快速获得。业余发行版的典型示例包括 Fedora、Linux Mint 和 Ubuntu（尽管 Ubuntu 也有一个为商业用户设计的版本）。\n\
  \n- **安全增强型 (Security enhanced)**：某些发行版是围绕安全设计的。要么是发行版本身具有额外的安全功能，要么是它提供了增强其他系统安全性的工具。典型示例包括\
  \ Kali Linux 和 Alpine Linux。\n\n- **Live 发行版 (Live distros)**：通常使用操作系统之前，你首先需要将其安装到系统中。通过\
  \ Live 发行版，系统可以直接从可移动介质（如 CD-ROM、DVD 或 USB 闪盘）启动。Live 发行版的优势是可以在不修改系统硬盘内容的情况下测试某个发行版。此外，某些\
  \ Live 发行版还带有修复已安装操作系统问题的工具（包括 Microsoft Windows 问题）。Live 发行版的典型示例包括 Manjaro Linux\
  \ 和 Antegros。大多数现代业余发行版（如 Fedora 和 Linux Mint）也有 Live 版本。\n\n**安全亮点**\n\n商业发行版往往比为家庭用户设计的发行版更安全。这是因为商业发行版通常用于企业或政府的系统关键任务，因此支持这些发行版的组织通常会将安全性作为操作系统的关键组件。\n\
  \n要意识到，这些只是 Linux 发行版的类型之一。还有为教育目的、青少年学习者、初学者、游戏、旧电脑等许多用途设计的发行版。学习更多可用发行版的优秀来源是\
  \ [`distrowatch.com`](https://distrowatch.com)。该网站提供了搜索和下载安装许多发行版所需软件的功能。\n\n###\
  \ Shell\n\n`Shell` 是允许用户向系统发出命令的软件程序。如果你工作过 Microsoft Windows，你可能使用过该系统的 Shell 环境：DOS。与\
  \ DOS 一样，Linux 中的 Shell 为用户提供了命令行界面 (CLI)。\n\nCLI 命令具有某些优势。它们通常比 GUI 应用更强大且功能更多。这部分是因为创建\
  \ CLI 程序比创建 GUI 程序更容易，部分也是因为某些 CLI 程序在 GUI 程序出现之前就已经创建了。\n\nLinux 有几种不同的 Shell 可用。你的系统中有什么\
  \ Shell 取决于安装了什么。每个 Shell 都有特定的特性、功能和语法使其区别于其他 Shell，但它们本质上都执行相同的功能。\n\n尽管 Linux\
  \ 有多种不同的 Shell，但远为流行的 Shell 是 BASH Shell。BASH Shell 是从一个名为 Bourne Shell 的旧 Shell\
  \ 开发的（BASH 代表 Bourne Again SHell）。因为它如此流行，它将是本书讨论重点。\n\n### GUI 软件\n\n当你安装 Linux\
  \ 操作系统时，你可以决定只通过 CLI 登录并与系统交互，还是安装一个 GUI。GUI 软件允许你使用鼠标和键盘与系统交互，就像你在 Microsoft Windows\
  \ 内部操作一样。\n\n对于个人使用，在笔记本电脑和桌面系统上，拥有 GUI 通常是一个很好的选择。使用 GUI 环境的便利性通常优于该软件带来的缺点。通常，GUI\
  \ 软件往往是系统资源的大户，占用更高百分的 CPU 周期和内存。\n\n\n\n\n\n请考虑，每当你向系统添加更多软件时，你就增加了一个潜在的安全风险。每个软件组件都必须经过妥善的安全，这对于任何提供用户访问系统手段的软件都尤为重要。\n\
  \n基于 GUI 的软件是额外潜在安全风险的一个良好示例。用户可以通过 GUI 登录界面登录，这为黑客利用系统提供了另一种手段由于由于原因，系统管理员倾向于不在关键服务器上安装\
  \ GUI 软件。\n\n与 Shell 一样，GUI 软件有很多可用选项。许多发行版都有“默认”GUI，但你始终可以选择安装不同的。GUI 软件的简列表包括\
  \ `GNOME`、`KDE`、`XFCE`、`LXDE`、`Unity`、`MATE` 和 `Cinnamon`。\n\nGUI 不是本书的主要部分。因此，作者建议你尝试不同的\
  \ GUI，并选择一个最符合你需求的。\n\n## 安装 Linux\n\n在安装 Linux 之前，你应该回答以下问题：\n\n* 你将选择哪种发行版？如前所述，你有大量的选择。\n\
  * 应该执行何种安装？这里有几个选择，因为你可以在系统上原生安装 Linux，也可以将发行版作为虚拟机 (VM) 安装。\n* 如果原生安装 Linux，硬件是否支持？在这种情况下，你可能想避开新的硬件，特别是较新的笔记本电脑，因为它们可能包含\
  \ Linux 尚未支持的组件。\n* 如果作为虚拟机安装 Linux，系统是否有足够的资源同时支持宿主机操作系统和虚拟机？通常这取决于系统有多少内存。在大多数情况下，拥有至少\
  \ 8GB 内存的系统应该支持至少一个虚拟机。\n\n### 什么发行版？\n\n你可能会问自己：“选择一个发行版有多难？会有多少发行版？”第二个问题的简单答案是“非常多”。在任何时候，大约有\
  \ 250 个活跃的 Linux 发行版。然而，不要让这个数字吓跑你！\n\n尽管有很多发行版，但其中大部分都非常冷门，迎合非常特定的情况。在你学习 Linux\
  \ 时，不应该考虑这类发行版。\n\n### 对话式学习™——选择 Linux 发行版\n\n**Gary**: 嘿，Julia。\n\n**Julia**:\
  \ 你看起来很忧郁。怎么了，Gary？\n\n**Gary**: 我正试图决定为新服务器安装哪种 Linux 发行版，我感到非常压力从。。\n\n**Julia**:\
  \ 啊，我明白这种感觉，以前经历过很多次。好了，让我们看看能否缩小范围。你觉得你可能需要为这个系统提供专业支持吗？\n\n**Gary**: 可能不需要……额，除了从你那里得到的帮助之外！\n\
  \n**Julia**: 我感觉到我的收件箱很快会有更多邮件。好吧，这没能缩小多少范围。如果你说“是”，我会建议你选择一个商业发行版，比如 `Red Hat Enterprise\
  \ Linux` 或 `SUSE`。\n\n**Gary**: 我想选一个更受欢迎的发行版，因为我觉得它们会有更多的社区支持。\n\n**Julia**: 这是一个好主意。根据\
  \ [distrowatch.com](http://distrowatch.com)，有几个获得社区支持的发行版最近下载量很大，包括 `Mint`、`Debian`、`Ubuntu`\
  \ 和 `Fedora`。\n\n**Gary**: 我听过这些，但 [distrowatch.com](http://distrowatch.com) 上列出的其他我以前没听过。\n\
  \n**Julia**: 有时那些其他发行版可能包含你觉得实用的功能。你多快需要安装新服务器？\n\n**Gary**: 截止日期在两周后。\n\n**Julia**:\
  \ 好的，我建议在 [distrowatch.com](http://distrowatch.com) 上做更多研究，挑选三到四个候选并在虚拟机上安装它们。花些时间测试它们，包括使用你将放置在服务器上的软件。还要花些时间查看社区支持页面，问问自己是否觉得它们会有用。\n\
  \n**Gary**: 听起来是个很好的开始。\n\n**Julia**: 还有一点：考虑一下并不是一种可能的解决方案。几个发行版都可能符合你的需求。你的目标是先排除那些不符合你需求的，然后尝试确定剩余部分中最好的。祝你好运！\n\
  \n少数发行版非常流行，构成了世界上 Linux 安装的大部分。然而，全面讨论这些流行发行版的每个优缺点超出了本书的范围。出于学习 Linux 的目的，作者建议你安装以下一个或多个发行版：\n\
  \n* `Red Hat Enterprise Linux (RHEL)`、`Fedora` 或 `CentOS`：这些发行版被称为基于 Red Hat 的发行版，因为它们都共享一套来自\
  \ Red Hat 发布 Linux 的共同基础代码。还有许多其他共享此代码的发行，但这些通常是最流行的。注意 `Fedora` 和 `CentOS` 都是完全免费，而\
  \ `RHEL` 是基于订阅的发行版。对于书中的基于 Red Hat 的示例，我们将使用 `Fedora`。\n* `Linux Mint`、`Ubuntu`\
  \ 或 `Debian`：这些发行版被称为基于 Debian 的发行版，因为它们都共享一套来自 Debian 发布 Linux 的共同基础代码。还有许多其他共享此代码的，但这些通常是最流行的。对于书中的基于\
  \ Debian 的示例，我们将使用 `Ubuntu`。\n* `Kali`：这是一个基于安全的发行版，将在本书的几个章节中使用。将此发行版视为一个确定安全漏洞的工具。\n\
  \n### 原生还是虚拟机？\n\n如果你有一台可用的旧电脑，你完全可以在上面原生安装 Linux（这被称为裸机或原生安装）。然而，考虑到你可能想测试多个发行版，虚拟机\
  \ (VM) 安装可能是更好的选择。\n\n虚拟机是一个认为自己是原生安装的操作系统，但它实际上正在与宿主机操作系统共享系统。（实际上有一种虚拟化形式虚拟机意识到自己被虚拟化，但这超出了本书的范围，学习\
  \ Linux 并非必须。）宿主机操作系统可以是 Linux，也可以是 `macOS` 或 `Microsoft Windows`。\n\n为了创建虚拟机，你需要一个提供虚拟机管理程序的程序*虚拟机管理程序*是向虚拟机呈现“虚拟硬件”的软件。这包括虚拟硬盘、虚拟网络接口、虚拟\
  \ CPU 以及物理系统中常见的其他组件。有许多不同的虚拟机管理程序软件，包括 `VMware`、`Microsoft Hyper-V`、`Citrix XenServer`\
  \ 和 `Oracle VirtualBox`。你也可以利用托管虚拟机管理程序，它们是云端应用程序。通过这些解决方案，你甚至不需要在本地系统中安装任何东西。`Amazon\
  \ Web Services` 是允许托管虚拟机管理程序的云服务的良好示例。\n\n### 安全亮点\n\n安全行业中的许多辩论围绕着虚拟机是否比裸机安装更安全。这个问题没有简单的答案，因为需要考虑许多方面。例如，虽然虚拟机可能提供某种抽象，使得黑客更难意识到它们的存在，但它们也产生了另一个需要妥善安全的软件组件。\n\
  \n\n\n\n通常，安全并不是组织使用虚拟机的主要原因（更好的硬件利用率通常是主要原因）。但是，如果你选择在你的环境中使用虚拟机，就应该仔细考虑其对安全的影响并将其纳入你的安全策略中。出于学习\
  \ Linux 的目的，我们将使用 Oracle VirtualBox。它是免费提供的，并且在多个平台上运行良好良好，包括 Microsoft Windows（这很可能是你已经在自己的系统上安装的操作系统）。你可以从\
  \ [`www.virtualbox.org`](https://www.virtualbox.org) 下载 Oracle VirtualBox。安装过程非常简单：只需接受默认值或阅读安装文档\
  \ ([`www.virtualbox.org/wiki/Downloads#manual`](https://www.virtualbox.org/wiki/Downloads#manual))）。\n\
  \n在安装完 Oracle VirtualBox 并安装了一些虚拟机之后，Oracle VM VirtualBox Manager 的界面将与图 1-2 相似。\n\
  \n![Image](img/00003.jpeg)\n\n**图 1-2** Oracle VirtualBox 虚拟机管理器\n\n### 安装发行版\n\n\
  如果你正在使用 Oracle VirtualBox，安装发行版的第一步是添加一个新的“机器”。这通过在 Oracle VM VirtualBox Manager\
  \ 中执行以下步骤完成：\n\n1. 点击 `Machine`（机器）然后点击 `New`（新建）。\n2. 为 `VM` 提供名称；例如，在 `Name:`\
  \ 框中输入 `Fedora`。注意 `Type`（类型）和 `Version`（版本）可能会自动更改。`Type` 应该是 `Linux`。检查下载的安装媒体查看它是\
  \ 32 位还是 64 位操作系统（这些信息通常包含在中）。大多数现代版本都是 64 位。\n3. 使用滑动条或在 `MB` 框中输入数值来设置 `Memory\
  \ Size`（内存大小）。通常，运行完整的 Linux 安装需要 `4196MB`（约 4GB）的内存。\n   保持勾选“Create a virtual\
  \ hard disk now”（立即创建虚拟硬盘）。\n4. 点击 `Create`（创建）按钮。\n5. 在下一个对话框中，将选择虚拟硬盘的大小。默认值可能是\
  \ `8.00GB`，对于完整安装来说有点小了。推荐的最小值为 `12GB`。\n6. 将“Hard disk file type”（硬盘文件类型）保留为 `VDI`（虚拟硬盘）。将“Storage\
  \ on physical hard disk”（在物理硬盘上的存储）更改为 `Fixed Size`（固定大小）。\n7. 点击 `Create`（创建）按钮。\n\
  \n过会儿（几分钟后），你应该能在 Oracle VM VirtualBox Manager 左侧的列表中看到你的新机器。在继续下一步之前，确保你已知安装媒体的位置（你下载的\
  \ Linux 发行版的 *.iso` 文件）。\n\n要启动安装过程，点击新机器，然后点击 `Start`（启动）按钮。示例见图 1-3。\n\n![Image](img/00004.jpeg)\n\
  \n**图 1-3** 开始安装过程\n\n在出现的下一个窗口中，你需要选择安装媒体。在 `Select Start-up Disk`（选择启动磁盘）对话框中，点击像带有绿色“向上箭头”文件夹的小图标。然后导航到包含安装媒体的文件夹，选择它并点击\
  \ `Open`（打开）按钮。返回对话框后，点击 `Start` 按钮。一旦开始安装，选项和提示实际上取决于你正在安装哪种发行版。随着发行版新版本的发布，这些内容也会发生变化。由于这些安装过程非常灵活，我们建议你遵循发行版发布提供的安装指南。\n\
  \n与其提供具体的指令，我们还提供以下建议：\n\n* **接受默认值**。通常，默认选项对于你的初始安装效果良好。记住，你以后可以重新安装操作系统。\n* **不要担心特定的软件**。其中一个选项可能要求你选择要安装哪些软件。同样，选择提供的默认即可。你以后可以添加更多软件，你将在第\
  \ 25 章“系统日志”中学习如何操作。\n* **不要忘记密码**。你会被要求为 `root` 账户或普通用户账户设置密码。在生产系统中，你应该确保设置一个不容易被破解的密码。然而，在这些测试系统中，请选择一个容易记住的密码，因为在这种特殊情况下，密码安全性不是大问题。如果你忘记了密码，恢复密码将在第\
  \ 28 章“系统引导”中介绍（或者你可以重新安装 Linux 操作系统）。\n\n### 总结\n\n读完本章后，你应该对 Linux 操作系统的主要组件有更好的理解。你还应该知道什么是\
  \ Linux 发行版，并对在安装 Linux 之前应该回答的问题心中有数。\n\n#### 关键术语\n\nkernel\nshell\nfile system\n\
  kernel modules\nlibraries\ndistribution\ndistro\nCLI\nGUI\nvirtual machine, VM\n\
  \n### 习题\n\nkernel\nshell\nfile system\nkernel modules\nlibraries\ndistribution\n\
  distro\nCLI\nGUI\nvirtual machine, VM\n\n#### 复习题\n\n**1** _____ 是一种用于组织操作系统中文件和目录的结构。\n\
  **2** 下列哪项不是 Linux 操作系统的常见组件？\n1. 内核 (kernel)\n2. 库 (libraries)\n3. 磁盘驱动器 (disk\
  \ drive)\n4. 外壳 (shells)\n**3** 下列哪项是基于安全的 发发行版？\n1. Fedora\n2. CentOS\n3. Debian\n\
  4. Kali\n**4** _____ 程序提供了操作系统的命令行界面。\n**5** _____ 是一种认为自己是原生安装的但实际上与宿主机共享系统的操作系统。\n\
  \n## 第 2 章 命令行\n\nLinux 最惊人的特性之一是海量的命令行工具。有数以千计的命令，每个命令都是为执行特定任务而设计的。如此多的命令提供了极大的灵活性，但也让学习\
  \ Linux 变得有些令人畏。\n\n本章的目标是向你介绍一些核心的命令行工具。你将学习管理文件和目录的命令，包括如何查看、复制和删除文件。你还学习了强大的正则表达式\
  \ (#part0055.html_gloss195) 的基础，它允许你使用模式查看和修改文件。本章还介绍了一些常用的文件压缩工具，例如 `tar` 和 `gzip`\
  \ 工具。\n\n在阅读本章并完成练习后，你将能够执行以下操作：\n\n* 管理文件和目录\n* 使用 变量 (#part0055.html_gloss268)\
  \ 等 shell 功能\n* 使用名为历史的 shell 功能重新执行之前的命令\n* 识别正则表达式并知道如何配合 `find`、`grep` 和 `sed`\
  \ 等命令使用它们\n* 管理文件压缩工具\n\n### 文件管理\n\nLinux 操作系统包含大量的文件和目录。因此，在 Linux 系统上工作的主要部分就是知道如何管理文件。在本节中，你将学习一些用于文件管理的必备命令行工具。\n\
  \n### Linux 文件系统\n\n\n\n\n\n你可能已经熟悉 Microsoft Windows 了。该操作系统使用驱动器来组织不同的存储设备。例如，主硬盘通常被指定为\
  \ `C:` 驱动器。额外的驱动器，如 CD-ROM 驱动器、DVD 驱动器、额外的硬盘以及可移动存储设备（USB 驱动），被分配为 `D:`、`E:` 等。在\
  \ Microsoft Windows 中，甚至网络驱动器通常也会被分配一个“驱动器号”。\n\n在 Linux 中，使用了不同的方法。每个存储位置（包括远程驱动器和可移动介质）都可以名为\
  \ root（根）的顶层目录下访问。根目录由单个斜杠字符（`/`）符号表示。请参见图 2-1 以 Linux 文件系统一小部分的演示（完整的 Linux 文件系统可能包含数百个、甚至数千个目录）。\n\
  \n![Image](img/00005.jpeg)\n\n**图 2-1** *Linux 文件系统小部分的视觉示例*\n\n使用图 2-1 中的示例，`boot`、`bin`、`etc`、`home`\
  \ 和 `usr` 目录被认为位于 `/` 目录之下。`julia` 和 `sarah` 目录被认为位于 `home` 目录之下。通常使用子目录或子目录来描述位于另一个目录下的目录。父目录一词则用于描述包含子目录的目录。因此，`home`\
  \ 目录是 `julia` 子目录的父目录。\n\n为了描述一个目录的位置，通常使用完整路径，该路径包含了一直到根目录的所有目录。例如，`julia` 目录可以通过\
  \ `/home/julia` 路径来描述。在此路径中，第一个 `/` 代表根目录，所有后续的 `/` 字符用于分隔路径中的额外目录。\n\n你可能在好奇这些不同的目录中存储了什么。这是一个很好的问题，但考虑到你刚刚开始学习\
  \ Linux 操作系统，目前也是一个很难回答的问题。尽管在这里会提供答案，但请意识到这并不是你现在过度担心的事情——随着你进一步探索 Linux，这些位置将变得更有意义。\n\
  \n文件系统层次结构标准 (FHS) 是 Unix 和 Linux 操作系统中文件和目录应该放置位置的定义。一些重要位置的摘要提供在表 2-1 中。\n\n**表\
  \ 2-1** FHS 位置\n\n| **位置** | **描述/内容** |\n| --- | --- |\n| `/` | 根目录或顶层目录。 |\n|\
  \ `/bin` | 关键二进制可执行文件。 |\n| `/boot` | 与启动（启动）系统相关的文件。 |\n| `/etc` | 系统的配置文件。 |\n\
  | `/home` | 普通用户的家目录。 |\n| `/lib` | 关键系统库。 |\n| `/media` | 可移动介质的挂载点位置。 |\n| `/mnt`\
  \ | 临时挂载位置。 |\n| `/opt` | 可选软件软件包。 |\n| `/proc` | 与内核数据和进程数据相关的信息。（这是一个虚拟文件系统，而不是基于磁盘的文件系统。）\
  \ |\n| `/root` | root 用户的家目录。 |\n| `/sbin` | 关键系统二进制可执行文件。 |\n| `/tmp` | 临时文件位置。\
  \ |\n| `/usr` | 许多包含二进制可执行文件、库和文档的子目录位置。 |\n| `/usr/bin` | 非必需二进制可执行文件。 |\n| `/usr/lib`\
  \ | `/usr/bin` 目录中可执行文件的库。 |\n| `/usr/sbin` | 非必需系统二进制可执行文件。 |\n| `/usr/share` |\
  \ 与架构无关的数据。 |\n| `/var` | 可变数据（大小经常变化）。 |\n| `/var/mail` | 邮件日志。 |\n| `/var/log`\
  \ | 志处理数据（如打印志处理）。 |\n| `/var/tmp` | 临时文件。 |\n\n### 命令执行\n\n执行 shell 命令的标准方法是在命令提示符处输入命令，然后按回车键。这里有一个示例：\n\
  \n点击此处查看代码图像\n\n```\n[student@localhost rc0.d]$ pwd\n/etc/rc0.d\n```\n\n命令也接受选项和参数：\n\
  \n*   选项是改变命令行为的预定义值。选项如何改变命令的行为取决于特定的命令。\n*   通常，选项是跟随在连字符（`-`）后面的单字符值，例如 `-a`、`-g`\
  \ 和 `-z`。通常情况下，这些单字符选项可以组合在一起（例如 `-agz`）。一些较新的命令接受“单词”选项，例如 `--long` 或 `--time`。单词选项以两个连字符开头。\n\
  *   参数是提供的额外信息，例如文件名，用于确定执行什么操作。参数不以连字符开头。\n\n要执行一系列命令，请用分号（`;`）分隔每个命令，并在输入最后一个命令后按回车键。这里有一个示例：\n\
  \n点击此处查看代码图像\n\n```\n[student@localhost ~]$ pwd ; date\n/home\nFri Dec 00:25 PST\n\
  ```\n\n### pwd 命令\n\n`pwd`（打印工作目录）命令显示 shell 的当前目录：\n\n点击此处查看代码图像\n\n```\nstudent@localhost\
  \ rc0.d/\n```\n\n### cd 命令\n\n要将 shell 的当前目录移动到另一个目录，请使用 `cd`（切换目录）命令。`cd` 命令接受一个参数：目标的位置。例如，要进入\
  \ `/etc` 目录，你可以执行以下命令：\n\n[点击此处查看代码图像\n\n```\n[student@localhost ~]$ cd /etc\n[student@localhost\
  \ etc]$\n```\n\n`cd` 命令是那种“没有消息就是好消息”命令之一。如果执行成功，没有任何输出（但请注意提示符已经更改）。如果命令失败，将显示错误，如下：\n\
  \n点击此处查看代码图像\n\n```\n[student@localhost ~]$ cd nodir\nbash: cd: nodir: No such file\
  \ or directory\n[student@localhost ~]$\n```\n\n### 安全提示\n\n出于安全考虑，用户无法 `cd` 进入所有目录。这将在第\
  \ 9 章](#part0023.html_ch09)“文件权限](#part0023.html_ch09)”中详细介绍。\n\n当你提供的参数以根目录符号（`/`）开头时，它被认为是绝对路径。绝对路径用于当你从固定位置（根目录）提供你想去的地方的指令。例如，你可以输入以下命令：\n\
  \n```\ncd /etc/skel\n```\n\n你也可以根据当前位置给出指令。例如，如果你已经在 `/etc` 目录中并想进入 `skel` 目录，你可以执行\
  \ `cd skel` 命令。在这种情况下，`skel` 目录必须直接位于 `etc` 目录之下。这种输入路径的形式被称为使用相对路径。\n\n\n\n\n\n\
  仔细想一下，你过去已经多次以这些方式之一提供过指引。例如，假设你在拉斯维加斯有一个朋友，你想为他提供去你在圣地亚哥家里的指引。你不会从朋友的家里开始提供指引，而是从一个你们都熟悉的固定的位置（例如一条常用的高速公路）开始。但是，如果那位朋友目前就在你家里，想要去当地一家商店的指引，你就会从你当前的位置提供指引，而不是之前提到的固定位置。\n\
  \n在 Linux 中，有几个特殊字符代表像 `cd` 这样的命令中的目录：\n\n- 两个“点”（周期）字符 `..` 表示当前目录的上一级。因此，如果当前目录是\
  \ `/etc/skel`，命令 `cd ..` 将将当前目录更改到 `/etc` 目录。\n- 一个点（`.`）表示当前目录。这对于 `cd` 命令来说并不常用，但当你想要表示“我当前所在的目录”时，它对其他命令非常有用。\n\
  \n- 波浪号字符 `~` 表示用户的家目录。每个用户都有一个家目录（通常为 `/home/*username*`），用户可以在那里存储自己的文件。`cd ~`\
  \ 命令将带你回到家目录。\n\n## `ls` 命令\n\n`ls` 命令用于列出目录中的文件。默认情况下，会列出当前目录的文件，如下例所示：\n\n点击此处查看代码图像\n\
  \n```\n[student@localhost ~]$ ls\nDesktop   Downloads  Pictures  Templates\nDocuments\
  \ Music      Public    Videos\n```\n\n与 `cd` 命令一样，你可以使用绝对路径或相对路径作为目录参数，来列出另一个目录中的文件。\n\
  \n`ls` 命令有许多选项。一些最重要的选项如表 2-2 所示。\n\n### 表 2-2 `ls` 命令选项\n\n| 选项 | 说明 |\n| --- |\
  \ --- |\n| `-a` | 列出所有文件，包括隐藏文件。 |\n| `-d` | 列出目录名，而不是目录的内容。 |\n| `-F` | 在文件末尾添加一个字符来指示其类型；示例包括\
  \ `*`（可执行文件）、`/`（目录）和 `@`（符号链接文件）。 |\n| `-h` | 与 `-l` 选项配合使用时，以人类可读格式提供文件大小。 |\n\
  | `-l` | 显示详细列表（参见此表后的示例）。 |\n| `-r` | 反转文件列表的输出顺序。 |\n| `-S` | 按文件大小排序。 |\n| `-t`\
  \ | 按修改时间排序（先列出最新文件）。 |\n\n## 可能出现什么问题？\n\n在 Linux 中，命令、选项、文件名以及几乎所有其他都是区分大小的。这意味着如果你尝试执行命令\
  \ `ls -L`，你得到的输出（或错误消息）将与输入命令 `ls -l` 不同。\n\n`ls -l` 命令的输出每个文件包含一行，如图 2-2 所示。\n\n\
  ![Image](img/00006.jpeg)\n\n**图 2-2** `ls -l` 输出\n\n## 文件通配符 (File Globbing)\n\n\
  *文件通配符*（也称为*通配符*）是命令行上提供的任何字符，代表文件名的部分部分。支持以下通配符：\n\n| 通配符 | 说明 |\n| --- | --- |\n\
  | `*` | 匹配文件名中的零个或多个字符 |\n| `?` | 匹配文件名中的任意单个字符 |\n| `[ ]` | 匹配文件名中的单个字符，只要该字符包含在\
  \ `[]` 字符内 |\n\n此示例显示当前目录中所有以字母 `D` 开头的文件：\n\n点击此处查看代码图像\n\n```\n[student@localhost\
  \ ~]$ ls -d D*\nDesktop   Documents   Downloads\n```\n\n下一个示例显示当前目录中所有长度为五个字符的文件：\n\
  \n点击此处查看代码图像\n\n```\n[student@localhost ~]$ ls -d ?????\nMusic\n```\n\n## `file`\
  \ 命令\n\n`file` 命令将报告文件内容的类型。以下命令提供了一些示例：\n\n点击此处查看代码图像\n\n```\n[student@localhost\
  \ ~]$ file /etc/hosts\n/etc/hosts: ASCII text\n[student@localhost ~]$ file /usr/bin/ls\n\
  /usr/bin/ls: ELF 64-bit LSB executable, x86-64, version 1 (SYSV),\ndynamically linked\
  \ (uses shared libs), for GNU/Linux 2.6.32,\nBuildID[sha1]=aa7ff68\n```\n\n\n\n\n\
  \n`mkdir` 命令的重要选项显示在表 2-5 中。\n\n## 表 2-5 `mkdir` 命令的选项\n\n| **选项** | **描述** |\n\
  | --- | --- |\n| `-p` | 在必要时创建父目录；例如，`mkdir /home/bob/data/january` 如果文件不存在，则将创建路径中的所有目录。\
  \ |\n| `-v` | 为每个创建的目录显示一条消息。在 Linux 中，`-v` 选项通常意味着“详细（verbose）”。详细模式包含关于所执行操作的额外信息。\
  \ |\n\n## cp 命令\n\n`cp` 命令用于复制文件或目录。该命令的语法为\n\n点击此处查看代码图片\n\n```\ncp [options] file|directory\
  \ destination\n```\n\n其中 `file|directory` 表示要复制的文件或目录。`destination` 是你想要复制文件或目录的位置。以下示例将\
  \ `/etc/hosts` 文件复制到当前目录：\n\n点击此处查看代码图片\n\n```\n[student@localhost ~]$ cp /etc/hosts\
  \ .\n```\n\n注意，*必须*指定目标位置。\n\n表 2-6 提供了 `cp` 命令的一些重要选项。\n\n### 表 2-6 `cp` 命令的选项\n\
  \n| **选项** | **描述** |\n| --- | --- |\n| `-i` | 如果复制过程导致覆盖现有文件，则提供交互式提示。 |\n| `-n`\
  \ | 永远不覆盖现有文件。 |\n| `-r` | 复制整个目录结构（`r` 代表递归）。 |\n| `-v` | 启用详细模式（即描述复制文件和目录时所执行的操作）。\
  \ |\n\n## mv 命令\n\n`mv` 命令将移动或重命名文件。\n\n示例：\n\n```\nmv /tmp/myfile ~\n```\n\n重要选项包括表\
  \ 2-7 中所示的内容。\n\n### 表 2-7 `mv` 命令的选项\n\n| **选项** | **描述** |\n| --- | --- |\n| `-i`\
  \ | 如果移动过程导致覆盖现有文件，则提供交互式提示。 |\n| `-n` | 永远不覆盖现有文件。 |\n| `-v` | 启用详细模式（即描述移动文件和目录时所执行的操作）。\
  \ |\n\n## rm 命令\n\n`rm` 命令用于删除（删除）文件和目录。\n\n示例：\n\n```\nrm file.txt\n```\n\n重要选项包括表\
  \ 2-8 中所示的内容。\n\n### 表 2-8 `rm` 命令的选项\n\n| **选项** | **描述** |\n| --- | --- |\n| `-i`\
  \ | 在删除文件之前提供交互式提示。 |\n| `-r` | 删除整个目录结构（`r` 代表递归）。 |\n| `-v` | 启用详细模式（即描述删除文件和目录时所执行的操作）。\
  \ |\n\n## rmdir 命令\n\n`rmdir` 命令用于删除（删除）空目录。如果目录不为空，该命令将失败（使用 `rm -r` 来删除目录及其目录内的所有文件）。\n\
  \n示例：\n\n```\nrmdir data\n```\n\n## touch 命令\n\n`touch` 命令有两个功能：创建一个空文件以及更新现有文件的修改时间和访问时间戳。要创建文件或将现有文件的时间戳更新为当前时间，请使用以下语法：\n\
  \n```\ntouch filename\n```\n\n重要选项包括表 2-9 中所示的内容。\n\n### 表 2-9 `touch` 命令的选项\n\n\
  | **选项** | **描述** |\n| --- | --- |\n| `-a` | 仅修改访问时间，不修改修改时间。 |\n| `-d` *date* |\
  \ 将时间戳设置为指定的*date*（例如，`touch -d “2018-01-01 14:00:00”）。 |\n| `-m` | 仅修改修改时间，不修改访问时间。\
  \ |\n| `-r` *file* | 使用 *file* 的时间戳作为参考设置指定文件的时间戳（例如，`touch -r /etc/hosts /etc/passwd`）。\
  \ |\n\n### 安全要点\n\n`touch` 命令非常用于更新关键文件的时间戳，以便纳入自动化系统备份。你将在第 10 章 “管理本地存储：要素”中学习更多关于系统备份的知识。\n\
  \n## Shell 特性\n\nBASH shell 提供了许多可以自定义工作环境的特性。本节重点介绍这些特性。\n\n### Shell 变量\n\nShell\
  \ 变量用于在 shell 中存储信息。这些信息用于修改 shell 本身或外部命令的行为。表 2-10 详细列出了一些常用变量。\n\n### 表 2-10\
  \ Shell 变量\n\n| **变量** | **描述** |\n| --- | --- |\n| `HOME` | 当前用户的家目录。 |\n| `ID`\
  \ | 用户 ID。 |\n| `LOGNAME` | 登录的用户名。 |\n| `OLDPWD` | 上次 `cd` 所在的目录。 |\n| `PATH` |\
  \ 命令查找路径。 |\n| `PS1` | 主提示符。 |\n| `PWD` | 当前工作目录。 |\n\n注意：除了列出的，还有许多 shell 变量。关于\
  \ `PATH` 和 `PS1` 的更多细节将在后面提供。\n\n### echo\n\n`echo` 命令用于显示信息。通常用于显示变量的值。\n\n示例：\n\
  \n```\n[student@localhost ~]$ echo $HISTSIZE\n1000\n```\n\n`echo` 命令只有几个选项。有用的是\
  \ `-n` 选项，它在输出结束时不换行。\n\n某些特殊序列可以包含在 `echo` 命令的参数中。例如，命令 `echo “hello\\nthere”`\
  \ 将产生输出：\n\n```\nhello\nthere\n```\n\n表 2-11 描述了 `echo` 命令的一些常用序列。\n\n### 表 2-11\
  \ `echo` 命令字符序列\n\n| **序列** | **描述** |\n| --- | --- |\n| `\\a` | 响铃。 |\n| `\\n`\
  \ | 换行字符。 |\n| `\\t` | 制表符字符。 |\n| `\\\\` | 单反斜杠字符。 |\n\n### 安全要点\n\n`echo` 命令在尝试调试程序或脚本时可以提供非常有价值的调试信息，因为可以在程序执行的各个点触发响铃，以标记程序运行到了某些位置。\n\
  \n### set\n\n`set` 命令在不带参数执行时会显示所有变量及其值。要查看所有 shell 变量，可以使用 `set` 命令，如下所示：\n\n```\n\
  [student@localhost ~ 95]$ set | head -n 5\nABRT_DEBUG_LOG=/dev/null\nAGE=25\nBASH=/bin/bash\n\
  BASHOPTS=checkwinsize:cmdhist:expand_aliases:extglob:extquote:force_fignore:\nhistappend:interactive_comments:progcomp:promptvars:sourcepath\n\
  BASH_ALIASES=()\n```\n\n注意：之前的命令中的 `| head -n 5` 表示“将 `set` 命令的输出作为输入传递给 `head`\
  \ 命令，并只显示前五行这种过程被称为重定向，将在本章后续章节详细介绍。在之前的示例中包含它，是因为 `set` 命令的输出将占据本书的几页纸。\n\n`set`\
  \ 命令还可以用于修改 shell 的行为。例如，使用当前未赋值赋值的变量通常会显示一个“空字符串”或无输出。执行命令 `set -u` 在使用未定义变量时将产生错误消息：\n\
  \n点击此处查看代码图片\n\n\n\n\n\n```\n[student@localhost ~]$ echo $NOPE\n\n[student@localhost\
  \ ~]$ set -u\n[student@localhost ~]$ echo $NOPE\nbash: NOPE: unbound variable\n\
  ```\n\n表 2-12 提供了一些额外的实用 `set` 选项。\n\n#### 表 2-12 `set` 命令的选项\n\n| `Option` | `Description`\
  \ |\n| --- | --- |\n| `-b` | 当后台作业结束时，立即向 shell 报告。后台作业是指是在后台运行的程序（详情请参见第 22 章，“连接到远程系统](#part0038.html_ch22)”）。使用\
  \ `+b`（默认值）以便在下一个主提示符显示之前进行此报告。 |\n| `-n` | 一种 shell 编程功能，读取脚本中的命令但不执行这些命令。用于对脚本进行语法错误检查。\
  \ |\n| `-u` | 使用未设置的变量时输出错误信息。 |\n| `-C` | 使用重定向操作符（如 `cmd` > `file`）时不允许覆盖现有文件。有关此功能的更多细节，请参见本章后面关于重定向的讨论。\
  \ |\n\n#### unset\n\n使用 `unset` 命令从 shell 中删除变量（例如，`unset VAR`）。\n\n#### PS1 \n\n\
  `PS1` 变量定义主提示符，通常使用特殊字符序列（`\\u` = 当前用户名，`\\h` = 主机名，`\\W` = 当前目录）。示例：\n\n点击此处查看代码图片\n\
  \n```\n[student@localhost ~]$ echo $PS1\n[\\u@\\h \\W]\\$\n```\n\n注意，定义变量时不带美元符号字符，但在引用时使用美元符号：\n\
  \n点击此处查看代码图片\n\n```\n[student@localhost ~]$ PS1=\"[\\u@\\h \\W \\!]\\$ \"\n[student@localhost\
  \ ~ 93]$ echo $PS1\n[\\u@\\h \\W \\!]$\n```\n\n#### PATH 变量\n\n大多数命令可以通过只需输入命令并按回车键来运行：\n\
  \n点击此处查看代码图片\n\n```\n[student@localhost ~]# date\nThu Dec  1 18:48:26 PST 2016\n\
  ```\n\n命令是通过使用 `PATH` 变量“找到”的。该变量包含用逗号分隔的目录列表：\n\n点击此处查看代码图片\n\n```\n[student@localhost\
  \ ~]$ echo $PATH\n/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin:\n\
  /home/student/.local/bin:/home/student/bin\n```\n\n这个“定义的路径”按顺序被搜索。因此，当执行之前的 `date`\
  \ 命令时，BASH shell 首先查找 `/usr/local/bin` 目录。如果 `date` 命令位于该目录中，则执行它；否则，检查 `PATH` 变量中的下一个目录。如果在这些任何目录中未找到该命令，则会显示错误：\n\
  \n点击此处查看代码图片\n\n```\n[student@localhost ~]$ xeyes\nbash: xeyes: command not found...\n\
  ```\n\n**安全提示**\n\n在某些未找到命令的情况下，可能会看到类似下面的消息：\n\n点击此处查看代码图片\n\n```\nInstall package\
  \ 'xorg-x11-apps' to provide command 'xeyes'? [N/y]\n```\n\n这是由于你尝试运行的命令根本不在系统中，但可以通过软件包进行安装的结果。对于在家庭或非商业环境中使用\
  \ Linux 的用户来说，这可能是一个实用的功能，但如果你正在生产服务器上工作，你应该始终仔细考虑任何软件的安装。\n\n要执行一个不在定义路径中的命令，请使用完全限定路径名，如下：\n\
  \n点击此处查看代码图片\n\n```\n[student@localhost ~]$ /usr/xbin/xeyes\n```\n\n要向 `PATH` 变量添加目录，请使用以下语法：\n\
  \n点击此处查看代码图片\n\n```\n[student@localhost ~]$ PATH=\"$PATH:/path/to/add\"\n```\n\n\
  `=` 号右侧的值（`$PATH:/path/to/add`）首先返回 `PATH` 变量的当前值，然后追加一个冒号和一个新目录。因此，如果 `PATH` 变量设置为\
  \ `/usr/bin:/opt`\n\n**安全提示**\n\n在某些未找到命令的情况下，可能会看到类似下面的消息：\n\n点击此处查看代码图片\n\n```\n\
  Install package 'xorg-x11-apps' to provide command 'xeyes'? [N/y]\n```\n\n这是由于你尝试运行的命令根本不在系统中，但可以通过软件包进行安装的结果。对于在家庭或非商业环境中使用\
  \ Linux 的用户来说，这可能是一个实用的功能，但如果你正在生产服务器上工作，你应该始终仔细考虑任何软件的安装。\n\n要执行一个不在定义路径中的命令，请使用完全限定路径名，如下：\n\
  \n点击此处查看代码图片\n\n```\n[student@localhost ~]$ /usr/xbin/xeyes\n```\n\n要向 `PATH` 变量添加目录，请使用以下语法：\n\
  \n点击此处查看代码图片\n\n```\n[student@localhost ~]$ PATH=\"$PATH:/path/to/add\"\n```\n\n\
  `=` 号右侧的值（`$PATH:/path/to/add`）首先返回 `PATH` 变量的当前值，然后追加一个冒号和一个新目录。因此，如果 `PATH` 变量设置为\
  \ `/usr/bin:/opt`\n\n#### 环境变量\n\n当变量被导出时，它对 shell 的所有子进程都是可用。如果变量未被导出，则它只在当前 shell\
  \ 中可用。\n\n要创建一个环境变量，使用 `export` 命令：\n\n```\nexport NAME=value\n```\n\n导出后，从 shell\
  \ 启动的任何命令都可以访问该变量。\n\n```\necho $NAME\n```\n\n要删除环境变量，使用 `unset` 命令：\n\n```bash\n\
  unset NAME\n```\n\n\n\n\n\n当用户登录到系统时，会启动一个登录 shell。当用户在登录后启动一个新的 shell 时，它被称为非登录\
  \ shell*。在任何情况下，都会使用初始化文件来设置 shell 环境。执行哪些初始化文件取决于该 shell 是登录 shell 还是非登录 shell。\n\
  \n图 2-4 展示了用户登录系统时会执行的哪些初始化文件。\n\n![Image](img/00008.jpeg)\n\n**图 2-4** *用户登录系统时执行的初始化文件*\n\
  \n以下是对图 2-4 的解释：\n\n*   用户登录时执行的第一个初始化文件是 `/etc/profile` 文件。在大多数 Linux 平台上，该脚本包含了一段代码，用以执行\
  \ `/etc/profile.d` 目录下所有以 `.sh` 结尾的初始化文件。*`/etc/profile` 文件的用途是为系统管理员提供一个地方，存放每个\
  \ BASH shell 用户登录时都会执行的代码（通常是登录消息和环境变量定义）。*\n\n*   在执行 `/etc/profile` 文件后，登录 shell\
  \ 会在用户的家目录下查找名为 `~/.bash_profile` 的文件。如果找到，登录 shell 将执行该文件中的代码。否则，登录 shell 会查找名为\
  \ `~/.bash_login` 的文件。如果找到，登录 shell 将执行该文件中的代码。否则，登录 shell 会查找名为 `~/.profile` 的文件并执行该文件中的代码。*这些文件的用途是为每个用户提供一个地方，存放该特定用户每次登录时都会执行的代码（通常是环境变量定义）。*\n\
  \n*   下一个执行的初始化文件是 `~/.bashrc` 脚本。*该文件的用途是为每个用户提供一个地方，存放该用户每打开一个新 shell 时都会执行的代码（通常是别名/alias\
  \ 定义）。*\n\n*   再一个执行的初始化文件是 `/etc/bash.bashrc` 脚本。*该文件的用途是为系统管理员提供一个地方，存放用户每打开一个新\
  \ shell 时都会执行的代码（通常是别名/alias 定义）。*\n\n图 2-5 展示了用户打开新 shell 时会执行的哪些初始化文件。\n\n![Image](img/00009.jpeg)\n\
  \n**图 2-5** *用户启动非登录 shell 时执行的初始化文件*\n\n以下是对图 2-5 的解释：\n\n*   用户打开非登录 shell 时执行的第一个初始化文件是\
  \ `~/.bashrc` 脚本。*该文件的用途是为每个用户提供一个地方，存放该用户每次打开一个新 shell 时都会执行的代码（通常是别名/alias 定义）。*\n\
  \n*   下一个执行的初始化文件是 `/etc/bash.bashrc` 脚本。在大多数 Linux 平台上，该脚本包含一段代码，用以执行 `/etc/profile.d`\
  \ 目录下所有以 `.sh` 结尾的初始化文件。*这些初始化文件的用途是为系统管理员提供一个地方，存放用户每打开一个新 shell 时都会执行的代码（通常是别名/alias\
  \ 定义）。*\n\n### 别名 (Alias)\n\n别名 是一种 shell 功能，允许通过发布单个“命令”来执行一组命令。以下是创建别名的方法：\n\n\
  点击此处查看代码图片\n\n```\n[student @localhost ~]$ alias copy=\"cp\"\n```\n\n以下是使用别名的方法：\n\
  \n点击此处查看代码图片\n\n```\n[student @localhost ~]$ ls\nfile.txt\n[student @localhost ~]$\
  \ copy /etc/hosts .\n[student @localhost ~]$ ls\nfile.txt  hosts\n```\n\n要显示所有别名，请不带参数执行\
  \ `alias` 命令。要取消别名，请使用 `unalias` 命令，如示例 2-1 所示。\n\n**示例 2-1** *使用 **unalias** 命令取消别名*\n\
  \n点击此处查看代码图片\n\n```\n[student @localhost ~]$ alias\nalias copy='cp'\nalias egrep='egrep\
  \ --color=auto'\nalias fgrep='fgrep --color=auto'\nalias grep='grep --color=auto'\n\
  alias l='ls -CF'\nalias la='ls -A'\nalias ll='ls -alF'\n[student @localhost ~]$\
  \ unalias copy\n[student @localhost ~]$ alias\nalias egrep='egrep --color=auto'\n\
  alias fgrep='fgrep --color=auto'\nalias grep='grep --color=auto'\nalias l='ls -CF'\n\
  alias la='ls -A'\nalias ll='ls -alF'\n```\n\n### 命令 (Command)\n\n每个 shell 在内存中保留了一个之前执行过的命令列表。可以通过\
  \ `history` 命令查看此列表。输出可能很多，因此通常会给出一个数值来限制数量。例如，以下 `history` 列出了最后五个命令：\n\n点击此处查看代码图片\n\
  \n```\n[student @localhost ~]$ history 5\n83  ls\n84  pwd\n85  cat /etc/passwd\n\
  86  clear\n87  history\n```\n\n表 2-13 显示了 `history` 命令的一些常用选项。\n\n**表 2-13** history\
  \ \n\n| 选项 | 说明 |\n| --- | --- |\n| -c | 清空历史列表。 |\n| -r | 读取历史文件的内容。 |\n| -w |\
  \ 将当前 BASH shell 的列表写入历史文件。 |\n\n要执行历史列表中的命令，输入 `!` 后直接跟随要执行的命令编号。例如，要执行命令 84（上例中的\
  \ `pwd` 命令），请输入：\n\n```\n[student @localhost ~]$ !84\npwd\n/home\n```\n\n### 历史变量\
  \ (History Variables)\n\n几个变量可以影响历史列表的存储方式，其中一些在表 2-15 中。\n\n**表 2-15** 影响历史存储的变量\n\
  \n| 变量 | 说明 |\n| --- | --- |\n| HISTIGNORE | 一组用冒号分隔的模式，用于指示哪些命令*不*放入历史列表。例如，以下设置将不会放入\
  \ `cd`、`pwd` 和 `clear` 命令：HISTIGNORE=\"cd*:ls*;clear\"` |\n| HISTSIZE | 设置为一个数值，代表历史列表中保留的最大命令数。\
  \ |\n\n\n\n\n\n| `HISTCONTROL` | 限制存储在历史列表中的行数。可以设置为以下值之一：\n\n* `ignorespace`: 任何在开头有空格的命令都不会被存入历史列表。\n\
  * `ignoredups`: 重复的命令在历史列表中只保留一次。\n* `ignoreboth`: 结合 `ignorespace` 和 `ignoredups`\
  \ 的功能。\n* `erasedups`: 下次写入历史列表时，也会移除当前历史列表中所有的重复条目。 |\n\n### .bash_history 文件\n\
  \n当用户注销系统时，当前的历史列表会自动写入用户的 `.bash_history` 文件中。这通常存储在用户的家目录（`~/.bash_history`）下，但可以通过修改\
  \ `HISTFILE` 变量来其名称和位置。\n\n`.bash_history` 文件中存储多少行由 `HISTFILESIZE` 变量的值决定。\n\n\
  ### 安全提示\n\n`history` 命令可能会带来安全风险，因为对于任何没有设置登录屏幕和密码保护屏幕保护程序的 Linux 系统，任何拥有访问系统和文件凭据的人，都可以通过通过输入\
  \ `history` 命令并读取或将结果复制到文件中供以后使用。\n\n请务必始终使用短空闲提示的密码保护屏幕保护程序以防止这种情况发生。清除历史记录或使用\
  \ `HISTIGNORE` 变量标记登录信息是额外的安全实践，以防止他人使用过去命令中找到身份凭据。\n\n### 重定向输入和输出\n\n每个命令都能发送两个输出流（标准输出和标准错误），并接受一个数据流（标准输入）。在文档中，这些术语也可以描述如下：\n\
  \n* 标准输出 = `stdout` 或 `STDOUT`\n* 标准错误 = `stderr` 或 `STDERR`\n* 标准输入 = `stdin` 或\
  \ `STDIN`\n\n默认情况下，`stdout` 和 `stderr` 发送到终端窗口，而 `stdin` 来自键盘输入。在某些情况下，你希望更改这些位置，这是通过被称为\
  \ `重定向` 的过程实现的。\n\n表 2-16 描述了执行重定向的方法。\n\n**表 2-16 重定向方法**\n\n| 方法 | 说明 |\n| ---\
  \ | --- |\n| `cmd < file` | 覆盖 `stdin`，使输入来自指定的文件。 |\n| `cmd > file` | 覆盖 `stdout`，使输出进入指定的文件。\
  \ |\n| `cmd 2> file` | 覆盖 `stderr`，使输出进入指定的文件。 |\n| `cmd &> file` | 同时覆盖 `stdout`\
  \ 和 `stderr`，使输出进入指定的文件。 |\n| `cmd1 | cmd2` | 覆盖来自 `cmd1` 的 `stdout`，使其作为 `stdin`\
  \ 进入 `cmd2`。有关此功能的更多详细信息，请参阅“管道”章节。 |\n\n在以下示例中，`cal` 程序的 `stdout` 被发送到名为 `month`\
  \ 的文件中：\n\n```bash\n[student@localhost ~]$ cal > month\n```\n\n将 `stdout` 和 `stderr`\
  \ 重定向到不同的文件中是常见的，如下一个示例所示：\n\n```bash\n[student@localhost ~]$ find /etc -name \"\
  *.cfg\" -exec file {} \\;\n> output 2> error\n```\n\n重定向 `stdin` 非常罕见，因为大多数命令都会接受文件名作为普通参数；然而，执行字符翻译的\
  \ `tr` 命令需要重定向 `stdin`：\n\n```bash\n[student@localhost ~]$ cat /etc/hostname\nlocalhost\n\
  [student@localhost ~]$ tr 'a-z' 'A-Z' < /etc/hostname\nLOCALHOST\n```\n\n### 管道\n\
  \n管道过程（因为 `|` 字符被称为 `管道`）将一个命令的输出传递给另一个命令，从而产生了一个更强大的命令行。例如，以下命令获取 `ls` 命令的标准输出并发送到\
  \ `grep` 命令，以过滤在 4 月 16 日更改的文件：\n\n```bash\n[student@localhost ~]$ ls -l /etc |\
  \ grep \"Apr 16\"\n-rw-r--r-- 1 root     321 Apr 16  2018 blkid.conf\ndrwxr-xr-x\
  \ 2 root root    4096 Apr 16  2018 fstab.d\n```\n\n\n\n\n\n要将一个命令的输出作为另一个命令的参数使用，请将命令置在\
  \ `$( )` 字符之间。例如，`date` 和 `pwd` 命令的输出将作为参数发送给 `echo` 命令：\n\n点击此处查看代码图片\n\n```\n\
  [student@localhost ~]$ echo \"Today is $(date) and you are in the $(pwd) directory\"\
  \nToday is Tue Jan 10 12:42:02 UTC 2018 and you are in the /home/student directory\n\
  ```\n\n## 高级命令\n\n如前所述，Linux 有成数以千计的命令。本节涵盖的命令是您可能经常使用的一些较高级的命令。\n\n### find 命令\n\
  \n`find` 命令将根据不同的标准在实时文件系统中搜索文件和目录。以下是该命令的格式：\n\n点击此处查看代码图片\n\n```\nfind [options]\
  \ starting_point criteria action\n```\n\n`starting_point` 是搜索开始的目录。`criteria` 是要搜索的内容，而\
  \ `action` 是对结果执行的操作。\n\n表 2-17 中显示的选项旨在修改 `find` 命令的行为。\n\n#### 表 2-17 find 命令的选项\n\
  \n| **选项** | **描述** |\n| --- | --- |\n| `-maxdepth` *n* | 限制搜索进入子目录的深度；例如，`find\
  \ -maxdepth 3` 将搜索限制在三个子目录深。 |\n| `-mount` | 防止搜索作为挂载点的目录。这在您从 `/` 目录进行搜索时非常有用。挂载点用于访问本地或基于网络的文件系统。将在第\
  \ 10 章中更详细地介绍。 |\n| `-regextype` *type* | 当使用正则表达式 (RE) 时，此选项指定将使用什么类型的 RE；`type`\
  \ 可以是 `emacs`（默认）、`posix-awk`、`posix-basic`、`posix-egrep` 或 `posix-extended`。注意：正则表达式的主题在本章稍后部分会有更详细的介绍。\
  \ |\n\n大多数基于标准的选项允许您指定一个数值作为参数。可以在其前面加上 `-` 或 `+` 字符以表示“小于”或“大于”。例如，使用 `+5` 意味着“大于五个”。表\
  \ 2-18 显示了一些重要的基于标准的选项。\n\n#### 表 2-18 基于标准的选项\n\n| **选项** | **描述** |\n| --- | ---\
  \ |\n| `-amin` *n* | 根据访问时间匹配文件；例如，`-amin -3` 将匹配在过去三分钟内被访问过的文件。 |\n| `-group` *name*\
  \ | 匹配由 `name` 组所有的文件。 |\n| `-name` *pattern* | 根据提供的 `pattern` 匹配文件或目录；`pattern`\
  \ 可以是正则表达式。注意：正则表达式的主题在本章稍后部分会有更详细的介绍。 |\n| `-mmin` *n* | 根据修改时间匹配文件；例如，`-mmin -3`\
  \ 将匹配在过去三分钟内被修改过的文件。 |\n| `-nogroup` | 匹配不属于任何组的文件。 |\n| `-nouser` | 匹配不属于任何用户的文件。\
  \ |\n| `-size` *n* | 根据文件大小匹配文件；值 `n` 前可以加上 `+`（大于）或 `–`（小于），并在前面加上一个修改过的单位：`c`\
  \ 代表字节，`k` 代表千字节，`M` 代表兆字节，或 `G` 代表吉字节 |\n| `-type` *fstype* | 匹配所有类型为 `fstype`\
  \ 指定的文件类型的文件；`fstype d` 表示目录，`p` 表示命名管道，`f` 表示普通文件，或其他代表更高级文件类型的字符。 |\n| `-user`\
  \ *username* | 匹配所有由 `username` 用户所有的文件（例如，`find /home -user bob`）。 |\n\n一旦找到文件，就可以对该文件执行操作。表\
  \ 2-19 显示了一些重要的基于操作的选项。\n\n#### 表 2-19 基于操作的选项\n\n| **选项** | **描述** |\n| --- | ---\
  \ |\n| `-delete` | 删除所有匹配的文件（例如，`find /tmp -name “*.tmp” -delete`）。 |\n| `-exec`\
  \ *command* | 在每个匹配的文件上执行命令（参见此表后的示例）。 |\n| `-ls` | 列出每个匹配文件的详细信息。 |\n| `-ok` |\
  \ 在每个匹配的文件上执行命令，但在每次匹配之前提示用户；提示是一个是/否问题，用于确定用户是否想要执行该命令。 |\n| `-print` | 打印每个匹配文件的文件名。\
  \ |\n\n### 安全强调\n\n使用 `-nogroup` 或 `-nouser` 有助于识别文件\n\n#### 正则表达式\n\n术 *regex*\
  \ 是正则表达式 (RE) 的缩写，是一种用于匹配字符或字符集。例如，在用 RE 的工具中，点 `.` 将匹配单个字符，而 `[a-z]` 将匹配任何小写字母。\n\
  \n正则表达式有两种类型：基础和扩展。基础 RE 是“原始的”，而扩展 RE 是新增的。使用 RE 的工具通常默认支持基础 RE，并具有某些启用扩展 RE 的选项或功能。虽然文档可能认为基础\
  \ RE 是过时的，但大多数现代工具在使用它们。\n\n常用的基础 RE 在表 2-20 中描述。\n\n#### 表 2-20 基础 RE\n\n| **RE**\
  \ | **描述** |\n| --- | --- |\n| `^` | 匹配行首。 |\n| `$` | 匹配行尾。 |\n| `*` | 匹配零或多个字符。\
  \ |\n| `.` | 匹配单个字符。 |\n| `[ ]` | 匹配位于 `[ ]` 之内的单个字符；字符列表 `[abc]` 或范围 `[a-c]`）是允许的。\
  \ |\n| `[^]` | 匹配不在 `[ ]` 之内的单个字符；字符列表 `[^abc]` 或范围 `[^a-c]`）是允许的。 |\n| `\\` | 转义正则表达式的特殊含义；例如，模式\
  \ `\\.*` 将匹配值 `.*.*`。 |\n\n\n\n\n\n| `+` | 匹配前面的字符或表达式一次或多次。 |\n| `{X}` | 匹配前面的字符或表达式\
  \ `X` 次。 |\n| `{X,}` | 匹配前面的字符或表达式 `X` 次或多次。 |\n| `{X,Y}` | 匹配前面的字符或表达式 `X` 到 `Y`\
  \ 次。 |\n| `?` | 前面的字符或表达式是可选的。 |\n\n`find` 命令支持 `-regexp` 选项，该选项允许你使用正则表达式对文件名进行模式匹配。\n\
  \n例如，以下命令将搜索所有文件名中包含“chpasswd”且在“chpasswd”之后文件名中某处还包含“8”的文件：\n\n点击此处查看代码图片\n\n```\n\
  [student@localhost ~]$ find / -regex \".*chpasswd.*8.*\" 2> /dev/null\n/usr/share/man/zh_CN/man8/chpasswd.8.gz\n\
  /usr/share/man/ja/man8/chpasswd.8.gz\n/usr/share/man/zh_TW/man8/chpasswd.8.gz\n\
  /usr/share/man/ru/man8/chpasswd.8.gz\n/usr/share/man/de/man8/chpasswd.8.gz\n/usr/share/man/fr/man8/chpasswd.8.gz\n\
  /usr/share/man/man8/chpasswd.8.gz\n/usr/share/man/it/man8/chpasswd.8.gz\n```\n\n\
  ### grep 命令\n\n使用 `grep` 命令在文件中搜索包含特定模式的行。默认情况下，`grep` 命令在找到匹配的模式时会显示整行内容。\n\n示例：\n\
  \n点击此处查看代码图片\n\n```\n[student@localhost ~]$ grep \"the\" /etc/rsyslog.conf\n# 要启用高精度时间戳，请注释掉下面这一行。\n\
  # 设置所有日志文件的默认权限。\n```\n\n**注意**\n\n用于执行搜索的模式使用的是基础正则表达式。\n\n`grep` 命令的重要选项包括 表 2-22\
  \ 所示。\n\n**表 2-22 grep 命令的选项**\n\n| 选项 | 说明 |\n| --- | --- |\n| `-c` | 显示匹配行数的计数，而不是显示每一个匹配的行。\
  \ |\n| `--color` | 匹配的文本以与其余文本不同的颜色显示。 |\n| `-E` | 在基础正则表达式的基础上额外使用扩展正则表达式。 |\n\
  | `-f` | 固定字符串；模式中的所有字符都被视为普通字符，而不是正则表达式字符。 |\n| `-e` | 用于在一个 `grep` 命令中指定多个模式（例如，`grep\
  \ -e pattern1 -e pattern2 file`）。 |\n| `-f file` | 使用指定 `file` 中找到模式。 |\n| `-i`\
  \ | 忽略大小写。 |\n| `-l` | 显示匹配模式的文件名，而不是显示文件中匹配的每一行。这在搜索多个文件时有用（例如，`grep “the” /etc/*`）。\
  \ |\n| `-n` | 在显示行之前显示行号。 |\n| `-r` | 递归搜索目录结构中的所有文件。在这种情况下，`recursively` 一词意味着“遍历所有子目录”。\
  \ |\n| `-v` | 反向匹配；返回所有不包含指定模式的行。 |\n| `-w` | 仅匹配整个单词；例如，命令 `grep “the” file` 会匹配字母\
  \ `the`，即使它是较大单词的一部分（如 `then` 或 `there`），但命令 `grep -w “the” file` 仅会将 `the` 作为一个独立的单词进行匹配。\
  \ |\n\n例如，要根据文件内容搜索文件系统，使用带有 `-r` 选项的 `grep` 命令：\n\n点击此处查看代码图片\n\n```\n[student@localhost\
  \ ~]$ grep -r \":[0-9][0-9]:games:\" /etc 2> /dev/null\n/etc/passwd:games:x:5:60:games:/usr/games:/usr/sbin/nologin\n\
  ```\n\n### sed 命令\n\n`sed` 命令旨在以非交互式方法编辑文件数据。与大多数编辑器（如 第 4 章 中讨论的 `vi` 编辑器，“编辑文件](#part0016.html_ch04)”）需要人工交互来对文件进行修改不同，`sed`\
  \ 命令可以自动更改。\n\n在下面的示例中，`sed` 命令将 `/etc/hosts` 文件中的“localhost”替换为“myhost”：\n\n点击此处查看代码图片\n\
  \n```\n[student@localhost ~]$ cat /etc/hosts\n127.0.0.1 localhost\n[student@localhost\
  \ ~]$ sed 's/localhost/myhost/' /etc/hosts\n127.0.0.1 myhost\n```\n\n\n\n\n\n| `-z`\
  \ | 使用 `gzip` 实用压缩/解压缩 `.tar` 文件。在本章稍后将介绍有关该工具的更多细节。 |\n\n### `gzip` 命令\n\n使用 `gzip`\
  \ 命令来压缩文件：\n\n点击此处查看代码图像\n\n```\n[student@localhost ~]$ ls -lh juju\n-rwxr-xr-x\
  \ 1 vagrant vagrant 109M Jan 10 09:20 juju\n[student@localhost ~]$ gzip juju\n[student@localhost\
  \ ~]$ ls -lh juju.gz\n-rwxr-xr-x 1 vagrant vagrant 17M Jan 10 09:20 juju.gz\n```\n\
  \n请注意，`gzip` 命令会用较小的压缩文件替换原始文件。\n\n重要的选项包括表 2-26 中所示的。\n\n**表 2-26** `gzip` 命令的选项\n\
  \n| **选项** | **描述** |\n| --- | --- |\n| `-c` | 将输出写入标准输出 (STDOUT) 且不替换原始文件。使用重定向将输出数据放入新文件中（例如，`gzip\
  \ -c juju > juju.gz`）。这对于保留原始文件的同时创建一个压缩文件有用。 |\n| `-d` | 解压缩文件（你也可以使用 `gunzip`\
  \ 命令）。 |\n| `-r` | 递归：当给定目录参数时，用于压缩该目录（及其子目录）中的所有文件。注意，这并不会合并文件，而是创建多个压缩文件。 |\n\
  | `-v` | 详细：显示压缩百分比。 |\n\n### `gunzip` 命令\n\n使用 `gunzip` 命令来解压 gzipped 格式的文件：\n\n\
  点击此处查看代码图像\n\n```\n[student@localhost ~]$ ls -lh juju.gz\n-rwxr-xr-x 1 vagrant vagrant\
  \ 17M Jan 10 09:20 juju.gz\n[student@localhost ~]$ gunzip juju\n[student@localhost\
  \ ~]$ ls -lh juju\n-rwxr-xr-x 1 vagrant vagrant 109M Jan 10 09:20 juju\n```\n\n\
  ### `bzip2` 命令\n\n使用 `bzip2` 命令来压缩文件：\n\n点击此处查看代码图像\n\n```\n[student@localhost ~]$\
  \ ls -lh juju\n-rwxr-xr-x 1 vagrant vagrant 109M Jan 10 09:20 juju\n[student@localhost\
  \ ~]$ bzip2 juju\n[student@localhost ~]$ ls -lh juju.bz2\n-rwxr-xr-x 1 vagrant vagrant\
  \ 14M Jan 10 09:20 juju.bz2\n```\n\n请注意，`bzip2` 命令会用压缩文件替换原始文件。\n\n重要的选项包括表 2-27\
  \ 中所示的。\n\n**表 2-27** `bzip2` 命令的选项\n\n| **选项** | **描述** |\n| --- | --- |\n| `-c`\
  \ | 将输出写入标准输出 (STDOUT) 且不替换原始文件。使用重定向将输出数据放入新文件中（例如，`bzip2 -c juju > juju.bz`）。\
  \ |\n| `-d` | 解压缩文件（你也可以使用 `bunzip2` 命令）。 |\n| `-v` | 详细：显示压缩百分比。 |\n\n### `xz`\
  \ 命令\n\n使用 `xz` 命令来压缩文件：\n\n点击此处查看代码图像\n\n```\n[student@localhost ~]$ ls -lh juju\n\
  -rwxr-xr-x 1 vagrant vagrant 109M Jan 10 09:20 juju\n[student@localhost ~]$ xz juju\n\
  [student@localhost ~]$ ls -lh juju.xz\n-rwxr-xr-x 1 vagrant vagrant 11M Jan 10 09:20\
  \ juju.xz\n```\n\n重要的选项包括表 2-28 中所示的。\n\n**表 2-28** `xz` 命令的选项\n\n| **选项** | **描述**\
  \ |\n| --- | --- |\n| `-c` | 将输出写入标准输出 (STDOUT) 且不替换原始文件。使用重定向将输出数据放入新文件中（例如，`xz\
  \ -c juju > juju.xz`）。 |\n| `-d` | 解压缩文件（你也可以使用 `unxz` 命令）。 |\n| `-l` | 列出现有压缩文件的信息（例如，`xz\
  \ –l juju.xz`）。 |\n| `-v` | 详细：显示压缩百分比。 |\n\n`gzip`、`xz` 和 `bzip2` 命令非常相似。最大的区别在于用于压缩文件的技术。`gzip`\
  \ 命令使用 Lempel-Ziv (LZ77) 编码，`bzip2` 命令使用 Burrows-Wheeler (BWT) 排序算法，而 `xz` 命令使用\
  \ LZMA 和 Huffman 编码。\n\n### 总结\n\n`gzip`、`xz` 和 `bzip2` 命令非常相似。最大的区别在于用于压缩文件的技术。本章重点介绍了所有\
  \ Linux 用户应该掌握的命令。这些命令允许你操作操作系统、处理文件和目录。\n\n#### 术语\n\n- 当前目录\n- 根目录\n- 父目录\n- 子目录\n\
  - 目录\n- 文件系统层级结构\n- 文件系统层级结构\n- 参数\n- 绝对路径\n- 相对路径\n- 文件\n- 通配符\n- 变量\n- 局部变量\n\
  - 环境变量\n- 登录 shell\n- 非登录 shell\n- 初始化文件\n- 别名\n- 重定向\n- 管道\n- 子命令\n- 正则表达式\n\n\
  #### 复习题\n\n**[1]** `rm` 命令可以删除目录。\n\n**[2]** 哪些项是路径类型？（多选）\n1. absolute\n2. full\n\
  3. complete\n4. relative\n\n**[3]** 哪一项代表当前目录？\n1. .\n2. ..\n3. -\n4. ~\n\n**[4]**\
  \ `ls -l` 选项将显示权限。\n\n**[5]** `file` 命令将告诉你内容的类型。\n\n## 第 3 章：获取帮助\n\n由于你可能刚刚开始学习\
  \ Linux，这个操作系统看起来非常庞大。如果你知道如何使用它，有很多命令可用。幸运的是，Linux 自带了一个强大的帮助系统。几乎每个命令、功能、配置文件和服务服务都有足够的文档，可以在你忘记选项、设置或值时提供帮助。在本章中，你将学习如何使用这些文档。\n\
  \n在阅读本章并完成练习后，你将能够：\n\n使用特定的命令行选项发现命令信息\n\n使用 `man` 或 `info` 页面获取命令、功能或配置文件的帮助\n\
  \n使用系统上的额外文档解决问题\n\n### 手页 (Man Pages)\n\n要获取有关命令或配置文件的附加信息，可以使用手页。例如，要了解更多关于 `ls`\
  \ 命令的信息，请执行 `man ls`。\n\n在查看手页内容时，可以使用键盘导航。表 3-1 突出了更有用的移动命令。\n\n**表 3-1** 移动命令\n\
  \n| **移动命令** | **描述** |\n| --- | --- |\n| h | 用于显示帮助屏幕（手页移动命令的摘要） |\n| SPACEBAR\
  \ | 在当前文档向前翻页 |\n| b | 在当前文档向后翻页 |\n| ENTER | 在当前文档向下移动一行；方向键也可以执行此操作 |\n| UP ARROW\
  \ | 在当前文档向上移动一行 |\n| /term | 在文档中搜索 *term*（这可以是正则表达式，也可以是纯文本） |\n| q | 退出手页并返回 shell\
  \ |\n\n### 手页组件\n\n\n\n\n\n每个帮助页（man page）都分为许多不同的组件。请参考图 3-1 查看 `ls` 命令帮助页某些组件的示例。\n\
  \n![Image](img/00010.jpeg)\n\n**图 3-1** *`ls` 命令帮助页的组件*\n\n表 3-2 描述了最常见的组件。\n\n\
  **表 3-2** `ls` 命令的常见组件\n\n| **组件** | **描述** |\n| --- | --- |\n| **NAME** | 命令名称\
  \ |\n| **SYNOPSIS** | 命令的简要描述 |\n| **DESCRIPTION** | 命令的详细描述，包括其选项 |\n| **AUTHOR**\
  \ | 编写命令的人员 |\n| **REPORTING BUGS** | 向何处发送有关命令问题的信息 |\n| **SEE ALSO** | 与此帮助页主题相关的其他命令或文档\
  \ |\n| **EXAMPLES** | 命令的使用示例 |\n\n### 帮助页章节\n\n由于帮助页的数量非常多（记住，有数千个命令、实用程序配置文件），它们被分为称为“章节”的类别。在某些情况下，需要将章节作为参数。例如，`man\
  \ passwd`（`passwd` 命令的帮助页）产生的文档与 `man 5 passwd`（`/etc/passwd` 文件的帮助页）不同。\n\n当你查看帮助页时，章节会显示在屏幕左上角的括号内，如图\
  \ 3-2\n\n**图 3-2** *`ls` 命令的帮助页章节*\n\n主要章节详见表 3-3。\n\n**表 3-3** `ls` 命令的主要章节\n\n\
  | **章节** | **描述** |\n| --- | --- |\n| 1 | 可执行命令和 shell 命令 |\n| 2 | 系统调用 |\n| 3 |\
  \ 库调用 |\n| 4 | 特殊文件（即 `/dev` 中的设备文件） |\n| 5 | 文件格式 |\n| 6 | 游戏 |\n| 7 | 杂项 |\n|\
  \ 8 | 基于系统管理员的命令 |\n| 9 | 内核例程 |\n\n你可能会奇怪如何知道特定的帮助页章节。你可以通过 `man -f` 命令查看这些信息：\n\
  \n点击此处查看代码图像\n\n```\n[student@onecoursesource.com ~]$ man -f passwd\npasswd (1)\
  \           - change user password\npasswd (1ssl)        - compute password hashes\n\
  passwd (5)           - the password file\n```\n\n**注意**\n\n`man -f` 命令与 `whatis`\
  \ 命令相同：\n\n点击此处查看代码图像\n\n```\n[student@onecoursesource.com ~]$ whatis passwd\npasswd\
  \ (1)           - change user password\npasswd (1ssl)        - compute password\
  \ hashes\npasswd (5)           - the password file\n```\n\n`man -f` 命令将列出任何现有帮助页中命令或配置文件的所有章节。如果你不知道命令或配置文件的确切名称，可以使用\
  \ `man` 命令的 `-k` 选项来搜索“关键词”，如示例 3-1\n\n```\nstudent@onecoursesource.com:~$ man -k\
  \ password | head -n 5\nchage (1)            - change user password expiry information\n\
  chgpasswd (8)        - update group passwords in batch mode\nchpasswd (8)      \
  \   - update passwords in batch mode\ncpgr (8)             - copy with locking the\
  \ given file to the password ...\ncppw (8)             - copy with locking the given\
  \ file to the password ...\n```\n\n**注意**\n\n`man -k` 命令与 `apropos` 命令相同。\n\n在某些情况下，当你使用\
  \ `man -f` 或 `man -k` 命令时可能得不到响应。例如，你可能会得到如下内容：\n\n点击此处查看代码图像\n\n```\n[student@onecoursesource.com\
  \ ~]$ man -k passwd\npasswd: nothing appropriate.\n```\n\n这可能是因为存储帮助页列表和描述的数据库尚未构建或更新。要构建此数据库，请以\
  \ root 用户身份运行 `mandb` 命令，如示例 3-2\n\n```\n[student@oneource.com ~]$ man -f passwd\n\
  passwd (1)           - change user password\npasswd (1ssl)        - compute password\
  \ hashes\npasswd (5)           - the password file\n```\n\n### 帮助页位置\n\n在某些情况下，帮助页可能不在标准位置。这发生在你安装第三方软件且开发者选择将帮助页放在其他地方时。在这种情况下，可以使用\
  \ `-M` 选项：\n\n点击此处查看代码图像\n\n```\n[student@onecoursesource.com ~]$ man -M /opt/man\n\
  ```\n\n或者，你可以设置 `MANPATH` 变量：\n\n点击此处查看代码图像\n\n```\nexport MANPATH=/opt/man:\n```\n\
  \n### 命令选项\n\n某些命令支持提供基本帮助的选项。在大多数情况下，通过使用 `--help` 选项显示帮助，如示例 3-3\n\n```\nstudent@onecoursesource.com:~$\
  \ date --help | head -n 3\nUsage: date [OPTION]... [+FORMAT]\n  or:  date [-u|--utc|--universal]\
  \ [MMDDhhmm[[CC]YY][.ss]]\nDisplay the current time in the given FORMAT, or set\
  \ the system date.\n```\n\n此输出有助于让你记住命令的选项和功能，无需阅读整个帮助页。\n\n**注意**\n\n少数命令使用 `-h`\
  \ 而不是 `--help`。\n\n### help 命令\n\n`help` 命令仅为内置命令提供信息，因为这些命令没有帮助页。例如，你可能认为 `cd`\
  \ 命令有帮助页，但由于它是内置 shell 命令，所以它没有帮助页，如下：\n\n点击此处查看代码图像\n\n```\nstudent@localhost:~$\
  \ man cd\nNo manual entry for cd\n```\n\n可以通过运行命令 `help cd` 查看 `cd` 命令的帮助页面。\n\n\
  提示：不要尝试记忆哪些命令是内置 shell 命令。当你尝试查看帮助页时遇到“No manual entry...”错误时，只需尝试使用 `help` 命令。或者，你可以通过运行\
  \ `help -s` 命令获取所有内置命令的列表，如示例 3-4 所示。\n\n**示例 3-4** *`help -s` 输出的最后十行*\n\n点击此处查看代码图像\n\
  \n\n\n\n\n```\nstudent@onecoursesource.com:~$ help -s | tail\nexport [-fn] [name[=va>\
  \  typeset [-aAfFgilrtux>\n false                    ulimit [-SHabcdefilmn>\n fc\
  \ [-e ename] [-lnr] [>  umask [-p] [-S] [mode>\n fg [job_spec]            unalias\
  \ [-a] name [na>\n for NAME [in WORDS ...>  unset [-f] [-v] [-n] >\n for (( exp1;\
  \ exp2; exp>  until COMMANDS; do CO>\n function name { COMMAN>  variables - Names\
  \ and>\n getopts optstring name>  wait [-n] [id ...]\nhash [-lr] [-p pathnam>  while\
  \ COMMANDS; do CO>\n help [-dms] pattern .>  { COMMANDS ; }\n```\n\n### `info` 命令\n\
  \n几乎每个命令和配置文件都有 man 页（帮助页），因为这是记录这些功能的技术。较较新的是 [info 页面。相比于每个 man 页仅仅是一个单一的文本文档，info\
  \ 页面更像是从网站读取内容，具有超链接以提供更丰富的结构。\n\n例如，输入命令 `info ls` 并使用方向键向下移动到“* Menu:”部分。你会看到一个类似于图\
  \ 3-3 的“目录”。\n\n![Image](img/00012.jpeg)\n\n**图 3-3** `ls` Info 页面中的超链接\n\n如果你将光标移动到“*\
  \ Sorting the output::”行并按回车键，你将跳转到一个描述如何对 `ls` 命令输出排序的文档。你已经进入了一个子节点（例如，“10.1.3\
  \ Sorting the output”）。要返回上级节点，请按 `u` 键（`u` 代表 up）。\n\n表 3-4 描述了 `info` 命令的额外移动命令。\n\
  \n**表 3-4** `info` 命令的移动命令\n\n| **命令** | **描述** |\n| --- | --- |\n| `n` | 移动到下一个节点（例如，如果你在\
  \ 10.2.3，这会将你带到 10.2.4） |\n| `p` | 移动到上一个节点（例如，如果你在 10.2.3，这会将你带到 10.2.2） |\n| `u`\
  \ | 移动到父节点 |\n| `l` | 移动到上节点（你上次所在的节点） |\n| `b` | 移动到当前节点的起始位置（当前屏幕顶部） |\n| `t`\
  \ | 移动到所有节点的顶层（显示顶层目录） |\n| `q` | 退出 `info` 命令 |\n\n你可能在奇怪为什么既有 info 页面又有 man 页，以及你应该使用哪一个。以下是对这些问题的某些回答：\n\
  \n*   man 页已经存在很长时间了（自 20 世纪 70 年代 Unix 早期以来）。尽管它们可能没有那么易读，但它们为开发者提供了一种标准的文档方式。\n\
  *   info 页面更用户友好，但开发者需要花费更多工作来创建。\n*   通常一个命令会有 man 页但没有 info 页面。在这种情况下，`info` 命令将显示\
  \ man 页。\n*   info 页面读起来更像教程；而 man 页读起来更像文档。\n*   man 页的优势在于它们比 info 页面更容易打印。\n\
  *   总的来说，两者兼备提供了灵活性。使用你最喜欢的方法。\n\n### `/usr/share/doc` 目录\n\n`/usr/share/doc` 目录也可能提供额外的文档。该目录下提供哪些文档取决于安装了哪些软件。示例\
