  3. `ignore client-updates`\n4. `avoid client-updates`\n\n**8。** _____ 指令用于定义 DHCP\
  \ 服务器提供信息的网络。\n\n**9。** 以下哪项是 MDA 的示例？\n\n1. `mailget`\n2. `mailserv`\n3. Dovecot\n\
  4. procmail\n\n**10。** 以下 procmail 规则的哪个部分用于指定锁文件名？\n\n```\n:0:\n* ^Tob\nbobfile\n\
  ```\n\n1. 第一个 `:`\n2. 第二个 `:`\n3. `bobfile`\n4. 以上都不是\n\n## 第 21 章：网络服务配置：Web 服务\n\
  \n常见的服务器类型之一是 Web 服务器。根据大多数估计，有超过 1 亿 Web 服务器直接连接到互联网，但在公司和政府机构内部使用的数量要多得多。\n\n\
  由于大多数 Web 服务器都可以直接通过互联网访问，因此安全性至关重要。在本章中，你不仅学习了如何配置一种流行的 Linux Web 服务器（Apache 超文本传输服务器），还学习了如何启用重要的安全功能。\n\
  \n本章还向你介绍了代理服务器。使用代理服务器有几个原因，包括加速数据访问和为服务器（包括 Web 服务器）提供额外的安全层。你学习了代理服务器的基础知识以及如何配置两种流行的代理服务器。\n\
  \n阅读本章并完成练习后，你将能够能够操作：\n\n- 配置 Apache Web 服务器\n- 在 Apache Web 服务器上启用安全功能\n- 配置代理服务器\n\
  \n### Apache Web 服务器\n\n通常，当人们说他们在系统上安装了 Apache 时，他们指的是 Apache 软件基金会提供的 Web 服务器。该组织实际上提供了许多开源项目，但因为它最因\
  \ Apache 超文本传输服务器而闻名，软件术语中的“Apache”已成为该 Web 服务器的同义词（我们通常将其称为 Apache Web 服务器）。它也被称为“httpd”，因为这通常是\
  \ Web 服务器进程的名称。\n\n\n\n\n\n超文本传输协议（HTTP，或简单称为 `hypertext`）自 20 世纪 90 年代以来一直是网页的传输协议。该协议允许客户端程序（网络浏览器）从服务器程序（例如\
  \ `httpd` 进程）请求数据。这些数据通常使用一种名为超文本标记语言 (HTML) 的标记语言进行格式化，而该语言随后会被转换为人类可读的网页。\n\n\
  在开始配置 Apache Web 服务器之前，你首先需要查找主配置文件的位置。根据你使用的发行版，该文件可能位于以下目录之一：\n\n* `/etc/apache`\n\
  * `/etc/apache2`\n* `/etc/httpd`\n* `/etc/httpd/conf`\n\n例如，在 Ubuntu 系统上，配置文件位于\
  \ `/etc/apache2` 目录下，而在 CentOS 系统上，它位于 `/etc/httpd/conf` 目录下。即使是主配置文件的文件名也会因发行版而异。例如，它在\
  \ CentOS 上命名为 `httpd.conf`，在 Ubuntu 上命名为 `apache2.conf`。尽管这可能令人沮丧，但好消息是，无论配置文件位于何处，文件内的语法应该是相同的。\n\
  \n### Apache Web 服务器基础配置\n\n默认的 Apache Web 服务器配置文件由注释和指令组成，指令是参数，因此可以被赋值。以下是 Apache\
  \ 配置文件的部分示例：\n\n点击此处查看代码图像\n\n```\n# ServerRoot: 目录树的顶端，服务器的配置\n# 错误和日志文件都保存在该目录下。\n\
  #\n# 不要在目录路径末尾添加斜杠。如果你将\n# ServerRoot 指向非本地磁盘，如果使用了基于文件的互斥锁，\n# 请务必在 Mutex 指令中指定本地磁盘。如果你想为\n\
  # 多个 httpd 守护进程共享相同的 ServerRoot，你将需要至少\n# 修改 PidFile。\n#\nServerRoot \"/etc/httpd\"\
  \n```\n\n通常，每个指令（至少是默认指令）都有详细的注释（`#comment`），这更容易确定每个指令的用途。有数百种可能的指令，其中一些将在本章稍后部分进行更详细的描述。你应该了解的基础指令在表\
  \ 21-1 中描述。（注释格式的描述直接取自配置文件。）\n\n**表 21-1** Apache 基础指令\n\n| 指令 | 描述 |\n| --- |\
  \ --- |\n| `ServerRoot` | 点击此处查看代码图像 |\n```\n# ServerRoot: 目录树的顶端，服务器的配置\n# 错误和日志文件都保存在该目录下。\n\
  ```\n示例：`ServerRoot \"/etc/httpd\"` |\n| `Listen` | 点击此处查看代码图像 |\n```\n# Listen:允许你将\
  \ Apache 绑定到特定的 IP 地址和/或\n# 端口，而不是默认设置。另见 <VirtualHost>\n# 指令。\n```\n示例：`Listen\
  \ 12.34.56.78:80` 示例：`Listen 80` 关于此指令的进一步讨论将在本章稍后出现。 |\n| `DocumentRoot` | 点击此处查看代码图像\
  \ |\n```\n# DocumentRoot: 你从中提供文档的\n# 目录。默认情况下，所有请求都来自此目录，但\n# 可以符号链接和别名来指向其他位置。\n\
  ```\n示例：`DocumentRoot \"/var/www/html\"` |\n| `LogLevel` | 点击此处查看代码图像 |\n```\n#\
  \ LogLevel: 控制记录到 error_log 中的消息数量。\n# 可能的值包括：debug, info, notice, warn, error,\
  \ crit,\n# alert, emerg。\n```\n示例：`LogLevel warn` 当你的 Web 服务器运行不正常时，这可能是一个关键设置。考虑将\
  \ LogLevel 改为 debug 并重启你的 Web 服务器。现在日志文件中出现了许多有用的日志消息。 |\n\n在某些情况下，指令需要多个值。多行指令的语法与单行指令略有不同：\n\
  \n点击此处查看代码图像\n\n```\n<Directory />\n    AllowOverride All\n    Require all granted\n\
  </Directory>\n```\n\n`<Directory />` 行开始指令，并持续到 `</Directory>`。在先前的示例中，`AllowOverride`\
  \ 和 `Require` 也是指令（你可以将这些视为子指令）。\n\n### 启动 Apache Web 服务器\n\n在安装 Apache Web 服务器软件包后，你应该能够使用默认配置文件启动服务器。虽然它不会提供有用的内容，但知道服务器在不需要更改任何配置文件的情况下正常运行是有益的。\n\
  \nApache Web 服务器进程名为 `httpd`。你可以使用默认配置文件启动服务器。通过启动脚本启动它，或者使用 `apachectl`（或 `apache2`）程序。启动服务器后，通过在同一机器的浏览器中输入\
  \ `localhost` 来验证它是否在响应。结果应该如图 21-1 所示。\n\n默认情况下，网页所在的目录是 `/var/www/html`。\n\n![图\
  \ 21-1](img/000.jpeg)\n\n**图 21-1** *默认网页*\n\n如果你想进一步测试你的功能，可以在 `/var/www/html`\
  \ 目录下创建一个小型文本文件（如果你熟悉该语言）：\n\n点击此处查看代码图像\n\n```\n[root@localhost ~]# echo \"testing,\
  \ 1, 2, 3, 4\n```\n\n### Apache Web 服务器日志文件\n\n两个日志文件对于测试和故障排除非常有用：`access_log`\
  \ 和 `error_log`。`access_log` 包含了有关访问的信息。`error_log` 包含了出现问题时的信息。\n\n以下是 `access_log`\
  \ 中的最后两个条目：\n\n点击此处查看代码图像\n\n```\n[root@localhost ~]# tail -2 /var/log/httpd/access_log\n\
  ::1 - - [09/Dec/2018:05:02:22 -0800] \"GET /tes HTTP/1.1\" 404 20 \"-\"\n\"Mozilla/5.0\
  \ (X11; Linux x86_64; rv:38.0) Gecko/2010101 Firefox/38.0\"\n::1 - - [09/Dec/2018:05:02:28\
  \ -0800] \"GET /test HTTP/1.1\" 200 26 \"-\"\n\"Mozilla/5.0 (X11; Linux x86_64;\
  \ rv:38.0) Gecko/2010101 Firefox/38.0\"\n```\n\n注意，每行的 `GET` 部分指示了请求的文件。access_log\
  \ 并不指示文件是否已发送，只表示存在请求。\n\n### 启用脚本\n\n你可以通过启用模块来为 Apache Web 服务器添加功能。许多模块随 Apache\
  \ 的默认安装提供，另一些可以在互联网上获取。\n\n你至少应该知道如何启用允许 Perl 和 PHP 脚本的模块。这些模块允许 Web 开发人员使用脚本创建更动态的网页。\n\
  \n\n\n\n\n这是一个关于在 Web 服务器上启用脚本支持的简要介绍。在现实世界中，实施脚本功能时应非常小心，因为它可能允许黑客在未经授权的情况下访问你的系统。虽然你需要了解这些基础知识，但在实线\
  \ Web 服务器上实施之前，请将此视为你应该深入探索的话题。\n\n## 启用 PHP 脚本\n\n要启用 PHP 脚本，请按照以下步骤操作：\n\n**步骤\
  \ 1.** 确保系统上已安装 PHP。例如，以下命令可以验证 CentOS 系统是否安装了 PHP（如果需要，请参考第 26 章“基于 Red Hat 的软件管理”和第\
  \ 27 章“基于 Debian 的软件管理”以获取安装软件的说明）：\n\n点击此处查看代码图像\n\n```\n[root@localhost ~]# yum\
  \ list installed | grep php\nphp.x86_64                          7.2.3-36.el7_1\
  \                 @updates\nphp-cli.x86_64                      7.2.3.el7_1    \
  \                @updates\nphp-common.x86_64                   7.2.3.el7_1     \
  \               @updates\n```\n\n**步骤 2.** 验证 `libphp7.so` 文件是否存在于 Apache Web 服务器模块目录。该文件应该随着\
  \ PHP 软件包一起被安装。在 CentOS 系统上，Apache Web 服务器模块位于 `/etc/httpd/modules` 目录：\n\n点击此处查看代码图像\n\
  \n```\n[root@localhost ~]# ls /etc/httpd/modules/*php*\n/etc/httpd/modules/libphp7.so\n\
  ```\n\n**步骤 3.** 配置 Apache Web 服务器以启用 PHP。这可以通过修改主配置文件或在模块的 `include` 目录中创建文件来实现。例如，在\
  \ CentOS 系统上，主配置文件中会出现以下行：\n\n点击此处查看代码图像\n\n```\n[root@localhost ~]# grep Include\
  \ /etc/httpd/conf/httpd.conf\nInclude conf.modules.d/*.conf\n    #   Indexes Includes\
  \ FollowSymLinks SymLinksifOwnerMatch ExecCGI\nMultiViews\n    # (你还需要还需要 \"Options\"\
  \ 指令中添加 \"Includes\")\nIncludeOptional conf.d/*.conf\n```\n\n在 `/etc/httpd/conf.modules.d`\
  \ 目录中，存在以下文件：\n\n点击此处查看代码图像\n\n```\n[root@localhost ~]# cat /etc/httpd/conf.modules.d/10-php.conf\n\
  #\n# PHP 是一种嵌入 HTML 的脚本语言，它试图让\n# 开发者能够轻松编写动态生成的网页。\n#\n<IfModule prefork.c>\n \
  \ LoadModule php5_module modules/libphp5.so\n</IfModule>\n```\n\n**步骤 4.** 重启 Apache\
  \ Web 服务器。\n\n请记住，前面的步骤应该提供了基本的 PHP 功能。对于真实的 Apache 服务器，你可能想要探索额外的配置设置。\n\n你如何判断它是否生效了？首先，在\
  \ `DocumentRoot`（例如 `/var/www/html`）中创建以下文件（命名为 `hello.php`）：\n\n点击此处查看代码图像\n\n\
  ```\n<html>\n<head>\n<title>PHP Test</title>\n</head>\n<body>\n<?php echo '<p>Hello\
  \ World</p>'; ?>\n</body>\n</html>\n```\n\n然后，通过将 Web 浏览器指向 `localhost/hello.php`\
  \ URL 来测试脚本。结果应该类似于图 21-2。\n\n![Image](img/00079.jpeg)\n\n**图 21-2** PHP 测试页面\n\n\
  **可能会出现什么问题？**\n\n`IfModule prefork.c` 指令用于指定何时加载模块。关键元素是 `LoadModule` 行，因此请勿删除此值。\n\
  \n要启用 Perl 脚本，请按照以下步骤操作：\n\n**步骤 1.** 确保系统上已安装 Perl Apache 模块。例如，以下命令可以验证 CentOS\
  \ 系统是否安装了 PHP：\n\n点击此处查看代码图像\n\n```\n[root@localhost ~]# yum list installed | grep\
  \ mod_perl\nmod_perl.x86_64                        2.0.8-10.20140624.1602105 @epel\n\
  ```\n\n**步骤 2.** 验证 `mod_perl.so` 文件是否存在于 Apache Web 服务器模块目录。该文件应该随着 `mod_perl`\
  \ 软件包一起安装。在 CentOS 系统上，Apache Web 服务器模块位于 `/etc/httpd/modules` 目录：\n\n点击此处查看代码图像\n\
  \n```\n[root@localhost ~]# ls /etc/httpd/modules/*perl*\n/etc/httpd/modules/mod_perl.so\n\
  ```\n\n**步骤 3.** 配置 Apache Web 服务器以启用 Perl。这可以通过修改主配置文件或在模块的 `include` 目录中创建文件来实现，如下：\n\
  \n点击此处查看代码图像\n\n```\n[root@localhost ~]# cat /etc/httpd/conf.modules.d/02-perl.conf\n\
  #\n# Mod_perl 将 Perl 解释器整合到 Apache Web 服务器中，\n# 使得 Apache Web 服务器可以直接执行 Perl 代码。\n\
  # Mod_perl 将 Perl 运行时库链接到 Apache Web 服务器\n# 并为 Apache 的 C 语言 API 提供面向对象的 Perl 接口。\n\
  # 结果是更快的 CGI 脚本处理过程，\n# 因为不需要外部解释器。\n#\nLoadModule perl_module modules/mod_perl.so\n\
  ```\n\n**步骤 4.** 在主配置文件中添加以下内容：\n\n```\n<Directory /var/www/html/perl>\nAllowOverride\
  \ All\nSetHandler perl-script\nOptions +ExecCGI\nOrder allow,deny\nAllow from all\n\
  </Directory>\n```\n\n这允许你将 Perl 脚本放在 `/var/www/html/perl` 中。\n\n**步骤 5.** 重启 Apache\
  \ Web 服务器。\n\n你如何判断它是否生效了？首先，在 `/var/www/html/perl` 中创建以下文件（命名为 `hello.pl`）：\n\n\
  点击此处查看代码图像\n\n```\nprint \"Content-type: text/plain\\r\\n\\r\\n\";\nprint \"hello\"\
  ;\n```\n\n然后通过将 Web 浏览器指向 `localhost/perl/hello.pl` URL 来测试脚本。结果应该类似于图 21-3。\n\n\
  ![Image](img/00080.jpeg)\n\n**图 21-3** Perl 测试页面\n\n**可能会出现什么问题？**\n\n在旧系统中，所需的包名可能不同（例如\
  \ `apache-mod_perl` 或 `libapache2-mod-perl2`）。\n\n**安全提示**\n\n出于安全考虑，你可能想使用重定向语句将\
  \ Perl 脚本存储在其他位置。可以通过 `Alias` 指令来实现，如下：\n\n```\nAlias /perl/ /var/httpd/perl/\n\
  ```\n\n现在访问 Web 服务器上的 `/perl` 目录下的文件时，Apache 服务器将查找 `/var/httpd/perl` 目录。\n\n##\
  \ Apache Web 服务器安全\n\n公司的 Web 服务器将暴露在互联网以及所有热衷于利用弱点的“坏分子”。安全 Web 服务器有许多通用方法，包括：\n\
  \n*   限制系统上的用户帐户。\n*   仅安装系统运行所需的最小软件。\n*   限制系统上运行的进程。\n*   使用权限保护关键目录和文件（或者使用\
  \ SELinux，它在第 9 章“文件权限”中介绍过）。\n*   实施防火墙（在第 31 章“防火墙”中讨论过）。\n\n除了系统安全，Apache Web\
  \ 服务器内部的某些设置也可以使其更安全。\n\n### 核心设置\n\n在 Apache Web 服务器的主配置文件中，可以通过以下设置限制客户端访问：\n\n\
  点击此处查看代码图像\n\n```\nStartServers 10\nMinSpareServers 5\nMaxSpareServers 15\nMaxClients\
  \ 150\nMaxRequestsPerChild 5000\n```\n\n\n\n\n\n有关这些设置的详情，请参见表 21-2。\n\n## 表 21-2\
  \ Apache Web 服务器客户端限制设置\n\n| 设置 | 描述 |\n| --- | --- |\n| `StartServers` | 当 Apache\
  \ Web 服务器启动时，它最初会启动一个由 root 用户拥有的进程。该进程从不处理客户端请求。相反，它会启动由 Apache 用户（或其他非 root 账户）拥有的其他进程，由这些进程来处理客户端请求。由于运行进程的\
  \ Apache 用户对系统文件的访问权限有限，这保护了系统。`StartServers` 设置指定了应该启动多少以 Apache 用户身份运行的进程。参见示例\
  \ 21-1，查看 `StartServers` 设置值 `10` 如何导致运行多个 `httpd` 进程。你选择的值取决于 Web 服务器的负载。在缓慢的 Web\
  \ 服务器上启动几十个此类进程会导致系统资源的浪费。当许多客户端连接到服务器时，启动的进程不足会对性能产生影响。 |\n| `MinSpareServers`\
  \ | 当产生客户端请求时，`httpd` 进程会被分配去处理它们。一旦一个 `httpd` 进程分配给某个客户端，在完成该客户端的任务之前它无法用于任何其他客户端，因此需要启动新的服务器。`MinSpareServers`\
  \ 指令确保始终可用特定数量的 `httpd` 进程。 |\n| `MaxSpareServers` | 如果 Apache Web 服务器的需求减少，可能会有一组\
  \ `httpd` 进程“闲置”等待客户端请求。`MaxSpareServers` 指令用于告诉 Apache 在未使用时“杀死”多余的服务器。 |\n| `MaxClients`\
  \ | 从某种意义上说，这可以被称为“最大服务器”。记住每个服务器处理一个客户端。如果 `MaxClients` 指令设置为 `150`，则将启动最多 150\
  \ 个服务器。结果，最大客户端数量也是 150 个。 |\n| `MaxRequestsPerChild` | 在拒绝服务 (DoS) 攻击中，多个客户端可能会向\
  \ Apache Web 服务发送大量请求。如果有足够的客户端机器（等同于 `MaxClients` 的数量），这种攻击可以有效禁用 Web 服务器。将 `MaxRequestPerChild`\
  \ 设置为如 `5000` 等值可以限制 DoS 攻击的有效性。 |\n\n## 示例 21-1  `httpd` 进程\n\n点击此处查看代码图像\n\n```\n\
  [root@localhost perl]# ps -fe | grep httpd\nroot     24007     1  2 17:02 ?    \
  \    00:00:00 /usr/sbin/httpd -DFOREGROUND\napache   24009 24007  0 17:02 ?    \
  \    00:00:00 /usr/sbin/httpd -DFOREGROUND\napache   24010 24007  0 17:02 ?    \
  \    00:00:00 /usr/sbin/httpd -DFOREGROUND\napache   24011 24007  0 17:02 ?    \
  \    00:00:00 /usr/sbin/httpd -DFOREGROUND\napache   24012 24007  0 17:02 ?    \
  \    00:00:00 /usr/sbin/httpd -DFOREGROUND\napache   24013 24007  0 17:02 ?    \
  \    00:00:00 /usr/sbin/httpd -DFOREGROUND\napache   24014 24007  0 17:02 ?    \
  \    00:00:00 /usr/sbin/httpd -DFOREGROUND\napache   24015 24007  0 17:02 ?    \
  \    00:00:00 /usr/sbin/httpd -DFOREGROUND\napache   24016 24007  0 17:02 ?    \
  \    00:00:00 /usr/sbin/httpd -DFOREGROUND\napache   24017 24007  0 17:02 ?    \
  \    00:00:00 /usr/sbin/httpd -DFOREGROUND\napache   24018 24007  0 17:02 ?    \
  \    00:00:00 /usr/sbin/httpd -DFOREGROUND\n```\n\n### 用户身份验证\n\n在公共 Web 服务器上，你可能决定限制对特定目录的访问。这可以通过设置身份验证方法来实现，要求客户端用户知道用户名密码。（注意，这些不是普通用户名，而是专门为\
  \ Apache Web 服务器设置的用户名。）\n\n要使用此功能，你需要确保已加载 `mod_auth` 模块。这可以从主配置文件或模块的 `include`\
  \ 目录中加载。\n\n为了保护网站的部分内容，你需要创建一个密码文件。执行所示的 `htpasswd` 命令：\n\n点击此处查看代码图像\n\n```\n\
  [root@localhost ~]# htpasswd -c /etc/httpd/password bob\nNew password:\nRe-type\
  \ new password:\nAdding password for user bob\n```\n\n\n\n\n\n提醒你一下，与本书涵盖的许多主题一样，我们并不要求你成为该主题的专家，而是理解它的概念和一些配置选项。关于虚拟主机，还有许多细节可以深入探讨；然而，本书的重点是为你提供核心内容。\n\
  \n例如，在配置基于 IP 的虚拟主机时，你可以选择设置多个守护进程（daemons），而不是让一个守护进程响应多个 IP 地址。\n\n重点是，如果你真的想成为一名\
  \ Apache Web 服务器管理员，要学习的内容比比本书提供的要多得多！\n\n## 会话式学习™——基于 IP 与基于域名的虚拟主机\n\n**Gary**：嘿，Julia。我正在设置一些\
  \ Web 服务器，我不确定应该使用哪种技术。\n\n**Julia**：你说的“哪种技术”什么意思？\n\n**Gary**：额，我需要在一个系统上设置三个\
  \ Web 服务器，我可以使用基于 IP 的方法或基于域名的方法。\n\n**Julia**：啊，是的，好的。通常，如果你打算成为 Web 服务器提供商，并想在单台机器上托管几个不同的网站，你会使用基于\
  \ IP 的技术。\n\n**Gary**：为什么呢？\n\n**Julia**：嗯，请记住，使用基于 IP 的方法，你可能只有一个网卡，并且你会为这个网卡分配多个\
  \ IP 地址。这对于 Web 托管组织是理想的，因为他们不想安装大量的网卡，而且每个网站应该有一个独立的 IP 地址。\n\n**Gary**：好，那么这就是最好的解决方案了？\n\
  \n**Julia**：这可能取决于情况。你计划让它们成为内部服务器，还是可以在互联网上使用的服务器？\n\n**Gary**：仅限内部。\n\n**Julia**：那么你可能会发现基于域名的技术更简单。你只需要在网卡上使用一个\
  \ IP 地址，只需要更新 DNS 服务器，为每个域名或 URL 提供相同的 IP 地址即可。\n\n**Gary**：好的，这看起来对这种情况来说是最好的。谢谢你，Julia。\n\
  \n### HTTPS\n\n发工资了！是你登录银行在线网站并支付那些账单的时候了。你输入银行的 URL，注意到 `https://` 这几个字母魔法般地出现在网站名称之前。在本章之前的内容中，你介绍了\
  \ HTTP（超文本传输协议），但现在这个缩写后面增加了一个“s”。\n\nHTTPS 是一种新的、更安全的协议。大多数人将其称为 HTTP Secure 或\
  \ HTTP SSL（SSL 代表安全套接层，一种基于安全的协议）。HTTPS 提供两个主要优势：网站身份经过验证，且客户端（网络浏览器）与服务器（Web 服务器）之间交换的数据更加加密。如果你查看有关\
  \ HTTPS 的文档，你会发现一种名为 TLS（传输层安全） 的更新加密协议现在也经常使用。TLS 设计用于取代 SSL，但社区经常将 TLS 称为 SSL。\n\
  \n在管理 Apache Web 服务器时，你应该意识到 HTTPS 使用端口 `443`，而 HTTP 使用端口 `80` 进行网络通信。\n\n### SSL\
  \ 基础\n\nSSL 使用的技术被称为`非对称加密`](part0055.html_gloss12）（它也被称为`PKC`](part0055.html_gloss172)\
  \ 或 `公钥加密`）。在在非对称加密中，会使用两个密钥：公钥和私钥。这些密钥用于加密和解密数据。\n\n公钥用于加密发送到 Apache Web 服务器的数据。该密钥在请求时提供给所有系统。例如，当网络浏览器首次连接到使用\
  \ SSL 的 Apache Web 服务器时，浏览器会请求服务器的公钥。这个公钥会免费提供给浏览器。\n\n从浏览器发送到服务器的任何额外数据（如用户名和密码）都使用此公钥进行加密。这些数据只能由服务器使用私钥进行解密。这就是`非对称加密`术语出现的地方。在`对称加密`中，使用同一个密钥来加密和解密数据。使用非对称加密需要两个独立的密钥：一个加密数据，另一个用于解密。这意味着只有\
  \ Web 服务器可以解密由浏览器发送的数据。\n\n你可能会好奇浏览器究竟是如何知道它连接的是正确的 Web 服务器而不是某些“流氓”服务器的。当 Web 服务器发送其公钥时，它包含一个数字签名（也称为`消息摘要`）。这个数字签名可以发送到\
  \ CA（证书颁发机构） 服务器，这是一个用于验证数字签名的受信任第三方系统。\n\n从用户的角度来看，这一切都在后台发生，并且完全透明——至少在出现问题且浏览器显示警告信息之前是这样。因为数字证书通常有有效期，最常见的问题是\
  \ CA 没有更新的数字证书——或者用户更改了计算机上的日期！\n\n请参阅 图 21-4 查看此过程的视化示例。\n\n![Image](img/00081.jpeg)\n\
  \n**图 21-4** *SSL  own*\n\n### SSL 问题\n\nSSL 并不是完美的解决方案。以下是关于使用 SSL 的一些安全担忧：\n\n\
  *   拥有大量的证书颁发机构（CA）机器增加了一个被攻破的可能性。大多数网络浏览器都有一个可以使用的 CA 大型列表。\n*   信任也是一个问题。数字签名的目的是让你的网络浏览器不会盲目信任与其通信的网站。然而，你的网络浏览器在某种程度上确实盲目信任\
  \ CA。CA 存在层级结构，最顶端是根 CA（root CA）。其概念是，子 CA 受到信任是因为它的父级 CA 是这么说的，但在结构的顶端，根 CA 没有办法说“因为某些其他\
  \ CA 是这么说的，所以信任我”。它基本上是在说“信任我，因为我是根 CA”。\n*   中间人攻击 也是可能的。当你通过一个路由器（通常是不可信的无线路由器）连接时，该路由器可以利用连接并在数据传输时读取数据。\n\
  *   如果你有虚拟主机，SSL 也是一个挑战。每个虚拟主机都应该有自己的数字签名。然而，当客户端（网络浏览器）首次联系服务器（Apache Web 服务器）时，客户端在请求公钥时不包含网站名称。结果是服务器不知道向客户端发送哪个数字签名。这个问题有解决方法，但其细节超出了本书的涵盖范围。\n\
  *   与任何非对称加密技术一样，私钥的安全性至关重要。如果此密钥被交给错误的元素，加密数据可能会被破解。\n\n### 自签名\n\n需要注意的是，并不是所有网站都使用第三方\
  \ CA 来验证网站身份（尽管你的银行网站是这样的！）。让第三方 CA 执行验证是涉及成本的。因此，较小组织使用所谓的[`自签名证书`](part0055.html_gloss212）的过程并不罕见。\n\
  \n基本上，自签名证书是不需要第三方 CA 进行验证的证书。使用自签名证书，Web 服务器展示其公钥和数字签名，这基本上是在说“信任我，我是正确的网站”。\n\n\
  ### SSL 和 Apache\n\n\n\n\n\n你可以通过几种不同的方式实现 SSL。本节的技术是使用名为 `mod_ssl` 的模块。另一种方法是使用名为\
  \ `Apache-SSL` 的 Apache Web 服务器（[`www.apache-ssl.org/`](http://www.apache-ssl.org/)）。这是核心\
  \ Apache Web 服务器加上 OpenSSL 项目软件的结合。一些商业产品还提供定制的基于 SSL 的 Apache Web 服务器\n\n实现 `mod_ssl`\
  \ 非常简单。你只需要在 Apache 配置文件中添加如下的一行：\n\n点击此处查看代码图片\n\n```\nLoadModule ssl_module /path/to/modules/mod_ssl.so\n\
  ```\n\n事实上，这可能比这还要简单。如果你安装了 `mod_ssl` 软件包，配置过程可能会自动发生。例如，在典型的 CentOS 系统上，安装 `mod_ssl`\
  \ 软件包后，会出现以下文件：\n\n点击此处查看代码图片\n\n```\n[root@localhost ~]# ls /etc/httpd/conf.modules.d\n\
  00-base.conf  00-lua.conf  00-proxy.conf  00-systemd.conf  02-perl.conf\n00-dav.conf\
  \   00-mpm.conf  00-ssl.conf    01-cgi.conf      10-php.conf\n[root@localhost ~]#\
  \ more /etc/httpd/conf.modules.d/00-ssl.conf\nLoadModule ssl_module modules/mod_ssl.so\n\
  ```\n\n回想本章前面的，`/etc/htppd/conf.modules.d` 目录中的文件已包含在该 CentOS 系统上 Apache Web 服务器的配置过程中。\n\
  \n如果现在重启 Apache Web 服务器，它将同时接受普通的 HTTP 和 HTTPS 请求。你可能只想接受 HTTPS 请求；但现在这产生了一个小问题，因为如果你此时尝试通过\
  \ HTTPS 连接到 Web 服务器，你应该收到一个类似于图 21-5 所示的警告消息。\n\n![Image](img/00082.jpeg)\n\n**图\
  \ 21-5** 浏览器警告消息\n\n出现此警告是因为你没有设置数字签名并让 CA 对进行签名。该过程将在下一节中描述。\n\n### SSL 服务器证书\n\
  \n要创建 SSL 证书，你必须安装 `openssl` 软件包。回想你有两个选择：要么让 CA 对你的证书进行数字签名，要么你可以进行自签名。如果你打算使用\
  \ CA，首先要执行 `openssl` 命令来生成 RSA 密钥文件。语法如下：\n\n点击此处查看代码图片\n\n```\n[root@localhost\
  \ ~]# openssl genrsa -des3 -out server.key 1024\nGenerating RSA private key, 1024\
  \ bit long modulus\n..++++++\n.......................................................................................................++++++\n\
  e is 65537 (0x10001)\nEnter pass phrase for server.key:\nVerifying - Enter pass\
  \ phrase for server.key:\n```\n\n参数 `genrsa` 告诉 `openssl` 命令创建一个 RSA 密钥文件。另一个选项是生成\
  \ DSA 密钥文件；然而，在这种情况下通常首选 RSA。DSA 在签名方面更快，但在验证方面较慢（当配合 Web 服务器使用时，验证的频率远高于签名）。\n\n\
  **注意**\n\nRSA 代表什么？该缩写由该技术发明者姓氏的首字母组成：Ron Rivest、Adi Shamir 和 Leonard Adleman。DSA\
  \ 代表什么？数字签名算法。\n\n`-des3` 参数指定用于加密的算法（三重 DES），`server.key` 参数指示存储密钥的文件名，`1024` 参数指定密钥的位数（位）。如果你使用密钥文件中的数据，则需要密码短语。\n\
  \n下一步是执行示例 21-4 中的命令来生成一个 CSR（证书签名请求）。\n\n**示例 21-4** 生成 CSR\n\n点击此处查看代码图片\n\n```\n\
  [root@localhost ~]# openssl req -new -key server.key -out server.csr\nEnter pass\
  \ phrase for server.key:\nYou are about to be asked to enter information that will\
  \ be incorporated\ninto your certificate request.\nWhat you are about to enter is\
  \ what is called a Distinguished Name or a DN.\nThere are quite a few fields but\
  \ you can leave some blank\nFor some fields there will be a default value,\nIf you\
  \ enter '.', the field will be left blank.\n-----\nCountry Name (2 letter code)\
  \ [XX]:US\nState or Province Name (full name) []:CA\nLocality Name (eg, city) [Default\
  \ City]:San Diego\nOrganization Name (eg, company) [Default Company Ltd]:OCS\nOrganizational\
  \ Unit Name (eg, section) []:\nCommon Name (eg, your name or your server's hostname)\
  \ []:OCS\nEmail Address []:bo@onecoursesource.com\n\nPlease enter the following\
  \ 'extra' attributes\nto be sent with your certificate request\nA challenge password\
  \ []:linuxrocks\n```\n\n`req` 参数用于指定创建一个 CSR，`-new` 参数创建一个新的 CSR，`-key` 参数用于指定你之前创建的现有密钥，`-out`\
  \ 参数用于创建发送给 CA 的文件。\n\n要对密钥进行自签名，你首先需要安装 `openssl-perl` 软件包。然后执行示例 21-5 所示的命令。（注意：`CA.pl`\
  \ 文件的具体位置在你的系统上可能不同。）\n\n**示例 21-5** 设置 CA\n\n点击此处查看代码图片\n\n```\n[root@localhost\
  \ ~]# mkdir /tmp/test\n[root@localhost ~]# cd /tmp/test\n[root@localhost test]#\
  \  /etc/pki/tls/misc/CA.pl -newca\nCA certificate filename (or enter to create)\n\
  \nMaking CA certificate ...\nGenerating a 2048 bit RSA private key\n....................................+++\n\
  ...+++\nwriting new private key to '/etc/pki/CA/private/cakey.pem'\nEnter PEM pass\
  \ phrase:\nVerifying - Enter PEM pass phrase:\n-----\nYou are about to be asked\
  \ to enter information that will be incorporated\ninto your certificate request.\n\
  What you are about to enter is what is called a Distinguished Name or a DN.\nThere\
  \ are quite a few fields but you can leave some blank\nFor some fields there will\
  \ be a default value,\nIf you enter '.', the field will be left blank.\n-----\n\
  Country Name (2 letter code) [XX]:US\nState or Province Name (full name) []:CA\n\
  Locality Name (eg, city) [Default City]:San Diego\nOrganization Name (eg, company)\
  \ [Default Company Ltd]:OCS\nOrganizational Unit Name (eg, section) []:\nCommon\
  \ Name (eg, your name or your server's hostname) []:OCS\nEmail Address []:bo@onecoursesource.com\n\
  \nPlease enter the following 'extra' attributes\nto be sent with your certificate\
  \ request\nA challenge password []:linuxrocks\nAn optional company name []:\nUsing\
  \ configuration from /etc/pki/tls/openssl.cnf\nEnter pass phrase for /etc/pki/CA/private/cakey.pem:\n\
  Check that the request matches the signature\nSignature ok\nCertificate Details:\n\
  \        Serial Number: 12294451229265977217 (0xaa9eaa4114c35f81)\n        Validity\n\
  \            Not Before: Dec 14 09:43:55 2017 GMT\n            Not After : Dec 13\
  \ 09:43:55 2020 GMT\n        Subject:\n            countryName               = US\n\
  \            stateOrProvinceName       = CA\n            organizationName      \
  \    = OCS\n            commonName                = OCS\n            emailAddress\
  \              = bo@onecoursesource.com\n        X509v3 extensions:\n          \
  \  X509v3 Subject Key Identifier:\n                3F:DD:38:62:16:2A:65:12:09:B8:63:55:E5:9B:AB:2B:24:0A:C1:E0\n\
  \            X509v3 Authority Key Identifier:\n                keyid:3F:DD:38:62:16:2A:65:12:09:B8:63:55:E5:9B:AB:2B:24:0A:C1:E0\n\
  \n            X509v3 Basic Constraints:\n                CA:TRUE\nCertificate is\
  \ to be certified until Dec 13 09:43:55 2020 GMT (1095 days)\n\nWrite out database\
  \ with 1 new entries\nData Base Updated\n```\n\n\n\n\n注意，`/etc/pki/tls/misc/CA.pl`\
  \ 脚本创建了一个名为 `/etc/pki/CA/private/cakey.pem` 的文件。这确保后续过程能够正常运行。下一步是创建签名请求，如示例 21-6\
  \ 所示。\n\n### 示例 21-6 *创建签名请求*\n\n点击此处查看代码图像\n\n```\n[root@localhost test]# /etc/pki/tls/misc/CA.pl\
  \ -newreq\nGenerating a 2048 bit RSA private key\n.....................................................+++\n\
  ...............................................................................................+++\n\
  writing new private key to 'newkey.pem'\nEnter PEM pass phrase:\nVerifying - Enter\
  \ PEM pass phrase:\n-----\nYou are about to be asked to enter information that will\
  \ be incorporated\ninto your certificate request.\nWhat you are about to enter is\
  \ what is called a Distinguished Name or a DN.\nThere are quite a few fields but\
  \ you can leave some blank\nFor some fields there will be a default value,\nIf you\
  \ enter '.', the field will be left blank.\n-----\nCountry Name (2 letter code)\
  \ [XX]:US\nState or Province Name (full name) []:CA\nLocality Name (eg, city) [Default\
  \ City]:San Diego\nOrganization Name (eg, company) [Default Company Ltd]:OCS\nOrganizational\
  \ Unit Name (eg, section) []:\nCommon Name (eg, your name or your server's hostname)\
  \ []:OCS\nEmail Address []:bo@onecoursesource.com\n\nPlease enter the following\
  \ 'extra' attributes\nto be sent with your certificate request\nA challenge password\
  \ []:linuxrocks\nAn optional company name []:\nRequest is in newreq.pem, private\
  \ key is in newkey.pem\n```\n\n此过程的最后一步是通过执行带有 `-signreq` 选项的 `CA.pl` 脚本进行签名，如示例\
  \ 21-7 所示。\n\n### 示例 21-7 *签名请求*\n\n点击此处查看代码图像\n\n```\n[root@localhost test]# /etc/pki/tls/misc/CA.pl\
