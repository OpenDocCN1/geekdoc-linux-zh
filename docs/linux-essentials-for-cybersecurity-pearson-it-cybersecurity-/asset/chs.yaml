  * **第 17 章：制定自动化安全策略**为你提供了利用第 14-16 章获取的知识创建安全策略的方法。\n* **第 18 章：网络基础**涵盖了在配置和保护网络连接之前应该了解的基础知识。\n\
  * **第 19 章：网络配置**涵盖了配置系统以连接网络的过程。\n\n\n\n\n\n第 20 章, “网络服务配置：基本服务,” 涵盖了配置若干网络化工具的过程，包括\
