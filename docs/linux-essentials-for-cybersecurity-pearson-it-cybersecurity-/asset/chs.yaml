  \ `_netdev` 挂载选项，因为这确保在尝试挂载资源之前网络已经就绪。\n*   iSCSI 的内容比本书讨论的要多。如果你考虑在环境中实现 iSCSI，你可能想考虑其他功能，例如通过修改\
  \ `/etc/iscsi.conf` 来保护目标。还有 iSCSI CHAP（挑战握手验证协议），这需要在目标上进行配置。\n\n### 总结\n\n在本章中，你学习了如何管理远程设备。首先，你接触了\
