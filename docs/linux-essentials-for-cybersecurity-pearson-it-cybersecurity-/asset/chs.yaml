  \ 第 13 章：制定存储安全策略\n\n保护存储设备面临着挑战，因为通常破坏这些设备的个人已经拥有访问这些系统的有效权限。本章重点关注如何使用你在第 9 章–第\
  \ 12 章中学到的技能来保护数据。\n\n存储设备的安全不仅是为了防止人们看到敏感数据，还包括确保关键数据不丢失。你还将学习如何创建文件和目录的备份，以及制定备份策略以确保能够恢复丢失的数据。\n\
  \n在阅读本章并完成练习后，你将能够完成以下操作：\n\n* 为保护存储设备制定安全计划\n* 制定备份策略\n* 利用备份工具\n\n### 制定计划\n\n\
  在制定存储设备安全计划时，你应该考虑以下因素：\n\n* 敏感数据需要免受窥探，包括那些对系统具有有效访问权限的用户。\n* 考虑所有数据应该存储在哪里。例如，包含公司私有数据的关键数据库不应存储在面向外部的\
  \ Web 服务器（或任何面向外部的服务器）。\n* 在存储设备故障或灾难（如火灾或洪水）破坏存储设备的情况下，需要定期对所有关键数据进行备份。\n* 应该建立数据恢复系统，以便快速恢复丢失的数据。\n\
  \n保护数据所需的关键要点已经在之前的章节中涵盖（第 9 章–第 12 章），后续章节将提供更多信息。以下是这些要点的总结，以及你在制定安全计划时应如何考虑它们：\n\
  \n* 使用文件权限、文件属性和 SELinux 的组合防止已访问系统的用户访问文件（在第 9 章 中的“文件权限`”中介绍）。\n* 考虑所有数据应该存储在哪里。例如，包含公司私有数据的关键数据库不应存储在面向外部的\
  \ Web 服务器（或任何面向外部的服务器）。\n* 在存储设备故障或灾难（如火灾或洪水）破坏存储设备的情况下，需要定期对所有关键数据进行备份。\n* 应该建立数据恢复系统，以便快速恢复丢失的数据。\n\
  \n保护数据所需的关键要点已经在之前的章节中涵盖（第 9 章–第 12 章），后续章节将提供更多信息。以下是这些要点的总结，以及你在制定安全计划时应如何考虑它们：\n\
  \n\n\n\n\n- **备份将存储在哪里？** 你是准备使用磁带设备、光驱设备（CD-ROM/DVD）、外部存储设备（USB 驱动器），还是网络可访问的存储位置？每个存储位置都有固有的优缺点。\n\
  \n- **将使用什么备份工具？** 你对备份工具的决定对数据备份和恢复过程具有重大影响。大多数 Linux 发行版都默认安装了几个工具，例如 `dd` 和 `tar`\
  \ 命令。在很多情况下，其他工具是免费可用的；你只需要从发行版仓库中安装每种工具即可。除了发行版自带的工具外，你可能还会考虑探索第三方工具，这些工具通常提供更稳健的解决方案。\n\
  \n### 什么内容需要备份？\n\n管理员在安装操作系统时倾向于使用多个分区（或逻辑卷）的原因之一是这有助于制定良好的备份策略。某些目录的变化频率比其他目录更频繁。通过将这些目录变为独立的文件系统，你可以利用文件系统的特性来进行备份。\n\
  \n例如，备份未被活动修改的数据通常是一个好主意。但在备份用户主目录时，这可能会带来挑战。通过将 `/home` 设置为独立分区，你可以卸载该分区并直接从该分区执行备份。更好的是，可以将\
  \ `/home` 文件系统放在逻辑卷上，并使用逻辑卷管理器（LVM）快照创建 `/home` 目录下文件系统的“冻结”视图。这允许用户在你备份数据的同时继续在文件系统上工作。\n\
  \n这并不意味着你总是为你想要备份的每个目录结构创建独立的文件系统。事实上，在某些情况下（例如 `/etc` 目录），这甚至是不可能的（`/etc` 必须与 `/`\
  \ 分区位于同一个文件系统中）。然而，只要可能，为要纳入备份策略的目录结构创建独立的文件系统通常是一个好主意。\n\n**注意**\n\n你会发现，在本章中，我们倾向于交替使用*目录*（directory）和*文件系统*（filesystem）术语。正如所知，并非所有目录都代表整个文件系统——只有那些作为挂载点的目录才如此。但是，由于我们强烈建议表\
  \ 13-1 中的目录应该是文件系统的挂载点，因此在讨论这类目录时，我们决定交替使用*目录*、*目录结构*和*文件系统*这些术语。\n\n那么，你应该考虑将哪些目录/文件系统纳入备份策略中？表\
  \ 13-1 突出了通常作为备份策略一部分的内容。\n\n**表 13-1** 考虑纳入备份策略的目录/文件系统\n\n| **目录/文件系统** | **考虑的理由**\
  \ |\n| --- | --- |\n| `/home` | 如果你的系统有任何普通用户，该目录结构肯定将是你备份策略的一部分。然而，在没有普通用户的服务器上，此目录在备份策略中通常被忽略。\
  \ |\n| `/usr` | `/usr` 目录很少变化，因为它是系统大多数命令、文档和程序的存放位置。该目录结构只在向系统添加新软件或更新现有软件时才会变化。一些管理员主张永远不要备份\
  \ `/usr`，因为如果出现问题，你随时可以重新安装软件。这种推理的缺陷在于，很少有管理员会维护他们他们管理的所有系统上安装的所有软件列表。因此，你应该将此目录纳入备份策略中。\
  \ |\n| `/bin` | 如果你备份 `/usr` 目录，请考虑包含 `/bin` 目录，因为某些操作系统软件安装在该目录结构中。 |\n| `/sbin`\
  \ | 如果你备份 `/usr` 目录，请考虑包含 `/sbin` 目录，因为某些操作系统软件安装在该目录结构中。 |\n| `/opt` | 如果你的系统中安装了大量的第三方软件，你可以考虑备份此目录。在大多数\
  \ Linux 发行版中通常并非如此。 |\n| `/var` | 存储在 `/var` 目录结构中的主要数据包括日志文件、入邮件队列和打印队列。打印队列不需要备份，但根据系统的功能，日志文件和邮件队列可能是重要的。通常此文件会在服务器上会被备份，但在桌面系统中经常被忽略。\
  \ |\n| `/boot` | 内核位于该目录结构中。如果你安装了新内核，请考虑备份此目录结构。通常它不会定期备份。 |\n| `/lib` 和 `/lib64`\
  \ | 如果你备份 `/usr` 目录，请考虑包含 `/lib` 和 `/lib64` 目录，因为操作系统库安装在这些目录结构中。随着向系统添加软件，有时也会添加新的库。\
  \ |\n| `/etc` | 此目录结构在备份策略中经常被忽略，但它通常也是变化最频繁的目录。常规系统管理任务（如管理软件配置文件和管理用户/组账户）会导致\
  \ `/etc` 目录结构的变化。在活跃的系统上，应该定期备份此目录。（注意，`/etc` 目录*必须*是 `/` 文件系统的一部分；它不能是一个独立的文件系统。）\
  \ |\n\n你永远不应该备份哪些目录/文件系统？以下目录没有存储在硬盘上，要么包含永远不需要备份的临时信息：\n\n* `/dev`\n* `/media`\n\
  * `/mnt`\n* `/net`\n* `/proc`\n* `/srv`\n* `/sys`\n* `/var/tmp`\n\n### 频率是多少？\n\n\
  没有精确的规则告诉你多长时间执行一次备份。要确定备份的频率，请先确定你将备份哪些目录/文件系统，然后了解数据在每个目录上变化的频繁程度。\n\n根据你的观察，你应该能够确定执行备份的频率。不同目录可能会有不同的计划，你还需要考虑执行全量备份与增量备份的频率对比。\n\
  \n### 全量还是增量？\n\n并不是所有软件工具都提供执行增量备份的灵活性。但如果你使用的是提供此功能的工具，请考虑将其纳入备份策略。\n\n如果备份工具确实提供增量备份，可能有几种不同的级别。以下是一些示例：\n\
  \n* 级别 0 备份是全量备份。\n* 级别 1 备份备份自上一次低级别备份（级别 0）以来更改的所有文件。\n* 级别 2 备份备份自上一次低级别备份（级别\
  \ 0 或 1）以来更改的所有文件。\n\n通常这些增量备份将包含 1–9 级。因此，级别 9 备份将备份自上一次低级别备份（可能是级别 0、1 级、2 级等）以来更改的文件。\n\
  \n为了更好地理解增量备份，请先看图 13-1。\n\n![Image](img/00063.jpeg)\n\n**图 13-1** *备份策略 #1*\n\n\
  图 13-1 中的策略展示了一个为期四周的备份周期。每四周，该循环就会重复一次。在周期的第一天，执行全量（级别 0）备份。第二天，周一，执行级别 2 备份。这备份了自上一次低级别备份（级别\
  \ 0）以来更改的所有内容。这基本上是一天的变化。\n\n\n\n\n周二，会执行 Level 3 备份。这备份了自上一次低级别备份（周一执行的 Level 2）以来的所有更改。在周期间每天，都会执行一次备份，备份目录/文件系统过去\
  \ 24 小时的更改。\n\n在接下来的周日，会执行 Level 1 备份。这备份了自上一次低级别备份（循环开始时执行的 Level 0）以来的所有更改。本质上，这备份了整周的更改。\n\
  \n这种备份计划的优点是每晚的备份花费的时间相对较。周日的备份每周都会变长，但本周的其他时间备份都是相对较小的。由于大多数企业在周日的下班时间较早，这对业务访问这些系统的需求影响很小。\n\
  \n这种备份计划的缺点在于恢复。如果因为第三周周五数据丢失而必须恢复文件系统，则必须按照以下顺序执行恢复：\n\n*   Level 0 备份\n*   第 3\
  \ 周周日执行的 Level 1 备份\n*   第 3 周周一执行的 Level 2 备份\n*   第 3 周周二执行的 Level 3 备份\n*   第\
  \ 3 周周三执行的 Level 4 备份\n*   第 3 周周四执行的 Level 5 备份\n\n现在将图 13-1 中的备份策略与图 13-2 所示的备份策略进行比较。\n\
  \n![Image](img/00064.jpeg)\n\n**图 13-2** *备份策略 #2*\n\n使用图 13-2 中的备份策略，你还在循环的第一天执行全备份。周一至周六执行的备份备份了自周日以来更改的所有文件。下周日执行的备份包含了自循环中首次备份以来更改的所有文件。\n\
  \n这种方法的缺点是随着周的进行，每次备份花费的时间越来越多。优点是恢复过程更简单更快速。如果因为第三周周五数据丢失而必须恢复文件系统，则必须按顺序执行以下恢复：\n\
  \n*   Level 0 备份\n*   第 3 周周日执行的 Level 1 备份\n*   第 3 周周四执行的 Level 5 备份\n\n还有许多其他备份策略，包括著名的汉诺塔，它基于一种数学游戏。要记住的重要点是，你应该研究不同的方法并找到适合你情况的方法。\n\
  \n### 备份将存储在何处？\n\n你有许多介质选项可以存储备份数据。表 13-2 描述了最常用的介质，并提供了一些你应该考虑的优缺点。\n\n**表 13-2**\
  \ 备份存储位置\n\n| **位置** | **优点** | **缺点** |\n| --- | --- | --- |\n| 磁带 | 成本低，货架寿命中\
  \ | 速度慢，需要特殊硬件，需要大量维护 |\n| 磁盘 | 速度快，易获取 | 不便携 |\n| 远程 | 通常易获取，便于实现数据异地安全 | 依赖网络访问，可能昂贵，可能缓慢\
  \ |\n| 光学介质 | 速度尚可，成本低，硬件易于且价格适中 | 存储容量小，通常为“一次写入”，不可重用 |\n\n**注意**\n\n考虑遵循 3-2-1\
  \ 规则：存储所有重要备份数据的三份副本。使用至少两种类型的介质进行备份。确保至少有一份备份在异地。\n\n### 将使用哪种备份工具？\n\n你可以使用许多不同的工具来备份数据，包括已是大多数\
  \ Linux 发行版一部分工具以及第三方工具。在本章中，我们涵盖了以下工具：\n\n*   `dd`\n*   `tar`\n*   `rsync`\n* \
  \  Amanda\n*   Bacula\n\n除了备份工具外，你还应该注意其他用于创建和恢复文件的工具：\n\n*   `dump/restore`：不像过去那样频繁使用，这些工具设计用于备份和恢复整个文件系统。这些工具支持全备份和增量备份，这使得它们成为少数具有此功能的标准备份工具。\n\
  *   `cpio`：与 `tar` 命令类似，`cpio` 命令可以将来自多个位置的文件合并到一个归档。\n*   `gzip/gunzip`：虽然 `gzip`\
  \ 命令没有提供你在备份工具中所需的关键功能（即它不会合并文件），但它确实可以压缩文件。因此，它可以用于压缩备份文件。\n*   `bzip2/bunzip2`：虽然\
  \ `bzip2` 命令没有提供你在备份工具中所需的关键功能（即它不会合并文件），但它确实可以压缩文件。因此，它可以用于压缩备份文件。\n*   `zip/unzip`：该工具的优点是它可以合并文件并压缩这些文件；此外，它使用了在多个操作系统（包括许多非\
  \ Linux 操作系统）上采用的标准压缩技术。\n\n#### 标准备份实用程序\n\n这些实用程序被认为是标准的，因为你可以预见到它们存在于每一个 Linux\
  \ 发行版中。这样做的好处是你可以在几乎每个 Linux 发行版中使用这些工具。\n\n### dd 命令\n\n`dd` 命令用于备份整个设备、单个分区或逻辑卷。例如，要将整个磁盘备份到第二个磁盘，请执行以下命令：\n\
  \n```\ndd if=/dev/sda of=/dev/sdb\n```\n\n`if` 选项用于指定输入设备。`of` 选项用于指定输出设备。执行此命令时，确保\
  \ `/dev/sdb` 至少与 `/dev/sda` 一大。如果你没有备用磁盘，但在设备（如外部 USB 磁盘）上有足够的空间怎么办？在这种情况下，将输出到镜像中：\n\
  \n```\ndd if=/dev/sda of=/mnt/hda.img\n```\n\n你也可以使用 `dd` 命令将 CD-ROM 或 DVD 的内容备份为\
  \ ISO 镜像：\n\n```\ndd if=/dev/cdrom of=cdrom.iso\n```\n\nISO 镜像文件可以创建更多的 CD-ROM，也可以通过网络共享。\n\
  \n了解镜像和 ISO 文件都可以被视为普通文件是有有的，因为这两种类型都可以被挂载和浏览：\n\n```bash\nmkdir /test\nmount -o\
  \ loop /mnt/had.img /test\n```\n\n`dd` 命令的优点之一是它可以备份硬盘上的任何内容，而不仅仅是文件和目录。例如，每个磁盘的开头都有一个称为\
  \ MBR（主引导记录）的区域。对于引导磁盘，MBR 包含引导加载程序（GRUB）和分区表的副本。拥有这些数据的备份将是有用的：\n\n```bash\ndd\
  \ if=/dev/sda of=/root/mbr.img bs=512 count=1\n```\n\n`bs` 选项表示块大小，`count` 指明要备份多少个块。值\
  \ 512 和 1 是意义的，因为 MBR 的大小是 512 字节。\n\n\n\n\n我们建议将 MBR 镜像存储在外部设备上。如果系统因为 MBR 损坏而无法启动，你可以从恢复光盘\
  \ 启动，并使用单个命令恢复 MBR：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# dd if=mbr.img\
  \ of=/dev/sda\n```\n\n### tar 命令\n\n带归档 (`tar`) 命令最初设计用于将文件系统备份到磁带设备。尽管现在许多人使用 `tar`\
  \ 命令备份到非磁带设备，但你也应该了解如何使用磁带设备。\n\nLinux 中的磁带设备名称遵循 `/dev/st*` 和 `/dev/nst*` 约定。第一个磁带设备分配的设备名为\
  \ `/dev/st0`，第二个磁带设备可以通过设备名称 `/dev/st1` 访问。\n\n`/dev/nst0` 也指向第一个磁带设备，但它会向磁带设备发送“不回绕”（no\
  \ rewind）信号。这在你需要向磁带写入多个卷数据时非常重要。磁带驱动器的默认行为是在备份完成后自动回绕。如果你在同一块磁带上写入另一个备份，你将覆盖第一个备份，除非在执行第一次备份时使用了\
  \ `/dev/nst0` 设备名称。\n\n如果你正在操作磁带设备，你应该了解 `mt` 命令。该命令旨在允许你直接操作磁带设备，包括从一个卷移动到另一个卷以及删除磁带内容。以下是一些常见示例：\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# mt -f /dev/nst0 fsf 1     #向前跳过一个文件（也称为卷）\n\
  [root@onecoursesource ~]# mt -f /dev/st0 rewind     #回绕磁带\n[root@onecoursesource\
  \ ~]# mt -f /dev/st0 status     #打印磁带设备的信息\n[root@onecoursesource ~]# mt -f /dev/st0\
  \ erase      #擦除磁带器中的磁带\n```\n\n### 注意事项\n\n对于后续示例，我们假设你的系统中没有磁带驱动器。为 `tar` 命令提供的示例将\
  \ tar 包（`tar` 命令的结果）放在普通文件中；然而，如果你有磁带驱动器，可以将文件名替换为你的磁带设备文件。\n\n使用 `tar` 工具创建备份（或\
  \ tar 包），请使用 `-c`（创建）选项结合 `-f`（文件名）选项：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# tar -cf /tmp/xinet.tar /etc/xinetd.d\ntar: Removing leading `//' from member\
  \ names\n```\n\n文件名开头的 `/` 字符会被移除，因此备份的不是绝对路径，而是相对路径。这使得指定恢复文件的位置变得更加容易。保留开头的 `/`\
  \ 将导致文件始终被存储在完全相同的位置。\n\n要查看 tar 包的内容，请结合 `-t`（列出内容）和 `-f` 参数，如 示例 13-1 所示。\n\n\
  **示例 13-1** *使用 `tar -tf` 查看 Tar 包内容*\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# tar -tf /tmp/xinet.tar\netc/xinetd.d/\netc/xinetd.d/rsync\netc/xinetd.d/discard-stream\n\
  etc/xinetd.d/discard-dgram\netc/xinetd.d/time-dgram\netc/xinetd.d/echo-dgram\netc/xinetd.d/daytime-stream\n\
  etc/xinetd.d/chargen-stream\netc/xinetd.d/daytime-dgram\netc/xinetd.d/chargen-dgram\n\
  etc/xinetd.d/time-stream\netc/xinetd.d/telnet\netc/xinetd.d/echo-stream\netc/xinetd.d/tcpmux-server\n\
  ```\n\n在列出 tar 包内容时，你通常想查看详细信息。包含 `-v`（详细）选项以查看额外信息，如 示例 13-2 所示。\n\n**示例 13-2**\
  \ *使用 `–v` 选项查看 Tar 包详情*\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# tar -tvf\
  \ /tmp/xinet.tar\ndrwxr-xr-x root/root         0 2018-11-02 11:52 etc/xinetd.d/\n\
  -rw-r--r-- root/root       332 2017-03-28 03:54 etc/xinetd.d/rsync\n-rw------- root/root\
  \      1159 2016-10-07 10:35 etc/xinetd.d/discard-stream\n-rw------- root/root \
  \     1157 2016-10-07 10:35 etc/xinetd.d/discard-dgram\n-rw------- root/root   \
  \   1149 2016-10-07 10:35 etc/xinetd.d/time-dgram\n-rw------- root/root      1148\
  \ 2016-10-07 10:35 etc/xinetd.d/echo-dgram\n-rw------- root/root      1159 2016-10-07\
  \ 10:35 etc/xinetd.d/daytime-stream\n-rw------- root/root      1159 2016-10-07 10:35\
  \ etc/xinetd.d/chargen-stream\n-rw------- root/root      1157 2016-10-07 10:35 etc/xinetd.d/daytime-dgram\n\
  -rw------- root/root      1157 2016-10-07 10:35 etc/xinetd.d/chargen-dgram\n-rw-------\
  \ root/root      1150 2016-10-07 10:35 etc/xinetd.d/time-stream\n-rw------- root/root\
  \       302 2018-11-02 11:52 etc/xinetd.d/telnet\n-rw------- root/root      1150\
  \ 2016-10-07 10:35 etc/xinetd.d/echo-stream\n-rw------- root/root      1212 2016-10-07\
  \ 10:35 etc/xinetd.d/tcpmux-server\n```\n\n要将 tar 包的所有内容提取到当前目录，请使用 `-x`（提取）选项结合\
  \ `-f` 选项，如 示例 13-3 所示。\n\n**示例 13-3** *使用 `tar –xf` 提取 Tar 包内容*\n\n点击此处查看代码图像\n\
  \n```\n[root@onecoursesource ~]# cd /tmp\n[root@onecoursesource tmp]# tar -xf xinet.tar\n\
  [root@onecoursesource tmp]# ls\nbackup          pulse-iqQ3aLCZD30z   virtual-root.MLN2pc\
  \  virtual-root.zAkrYZ\netc             pulse-lZAnjZ6xlqVu   virtual-root.o6Mepr\
  \  xinet.tar\nkeyring-9D6mpL  source               virtual-root.vtPUaj  zip-3F4A\n\
  [root@onecoursesource tmp]# ls etc\nxinetd.d\n[root@onecoursesource tmp]# ls etc/xinetd.d\n\
  rsync\n```\n\n假设 tar 包包含成千上万个文件，而你只需要几个。你可以在 `tar` 命令末尾列出文件名来执行这种部分恢复：\n\n```\n\
  [root@onecoursesource tmp]# tar -xf xinet.tar etc/xinetd.d\n[root@onecoursesource\
  \ tmp]# ls etc/xinetd.d\nrsync\n```\n\n`tar` 命令有许多选项；请参考 表 13-3 了解一些更实用的选项（包括已涵盖的）。\n\
  \n表 13-3 实用的 **tar** 选项\n\n| **选项** | **描述** |\n| --- | --- |\n| -A | 追加到现有的 tar\
  \ 包中。 |\n| -c | 创建 tar 包。 |\n| -C | 设置当前目录。 |\n| -d | 显示现有 tar 包与当前文件系统文件之间的差异。\
  \ |\n| --delete | 从 tar 包中删除文件（磁带上不支持）。 |\n| -j | 使用 `bzip2` 命令压缩 tar 包。 |\n| -t\
  \ | 列出 tar 包的内容列表。 |\n| -x | 提取 tar 包的内容。 |\n| -z | 使用 `gzip` 命令压缩 tar 包。 |\n| -W\
  \ | 写入后尝试验证。 |\n\n### rsync 命令\n\n`rsync` 命令提供的备份功能与 `tar` 和 `dd` 命令不同。它设计用于将文件备份到远程系统。它可以通过安全外壳\
  \ (SSH) 进行通信，使备份过程更加安全。此外，它只备份自上次备份以来更改的文件。\n\n例如，示例 13-4 所示所示命令将 `/etc/xinetd.d`\
  \ 目录递归备份到 `server1` 机器的 `/backup` 目录。\n\n**示例 13-4** *`rsync` 命令*\n\n点击此处查看代码图像\n\
  \n\n\n\n```\n[root@onecoursesource ~]# rsync -av -e ssh /etc/xinetd.d server1:/backup\n\
  root@server1's password:\nsending incremental file list\nxinetd.d/\nxinetd.d/chargen-dgram\n\
  xinetd.d/chargen-stream\nxinetd.d/daytime-dgram\nxinetd.d/daytime-stream\nxinetd.d/discard-dgram\n\
  xinetd.d/discard-stream\nxinetd.d/echo-dgram\nxinetd.d/echo-stream\nxinetd.d/rsync\n\
  xinetd.d/tcpmux-server\nxinetd.d/telnet\nxinetd.d/time-dgram\nxinetd.d/time-stream\n\
  \nsent 14235 bytes  received 263 bytes  1159.84 bytes/sec\ntotal size is 13391 \
  \ speedup is 0.92\n```\n\n上条命令使用的选项是 `-v`（详细模式）、`-a`（归档）和 `-e ssh`（通过 SSH 执行）。第一个参数是要待复制的内容，第二个参数是复制的位置。\n\
  \n假设 `/etc/xinetd.d` 目录下的某个文件发生了变化：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource\
  \ ~]# chkconfig telnet off     #更改 /etc/xinetd.d/telnet\n```\n\n注意，当再次执行 `rsync`\
  \ 命令时，只有被修改的文件会被传输：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# rsync -av -e\
  \ ssh /etc/xinetd.d server1:/backup\nroot@server1's password:\nsending incremental\
  \ file list\nxinetd.d/\nxinetd.d/telnet\n\nsent 631 bytes  received 41 bytes  192.00\
  \ bytes/sec\ntotal size is 13392  speedup is 19.93\n```\n\n## 第三方备份工具\n\nLinux 提供了许多第三方备份工具。以下是其中两个常用工具的简要总结。\n\
  \n### Amanda\n\n高级马里兰自动网络磁盘归档器（Advanced Maryland Automatic Network Disk Archiver，简称\
  \ Amanda）是一种在 Unix 和 Linux 发行版中都很流行的开源软件工具。尽管有一个免费的社区版本，但也有提供支持的企业级版本（当然，这是付费的）。\n\
  \nAmanda 提供了一个调度器，使得系统管理员能够更容易地自动化备份过程。它还支持写入到磁带设备或硬硬盘。\n\n### Bacula\n\nBacula\
  \ 是一个开源产品，支持不同平台的客户端，包括 Linux、Microsoft Windows、macOS 和 Unix。Bacula 的一个引人注的功能是能够自动化备份，将系统管理员从这项常规性任务中解放出来。\n\
  \n在服务器端配置 Bacula 可以通过 Web 界面、GUI 工具或命令行工具完成。\n\nBacula 的缺点是其备份数据格式与其他备份格式不兼容，例如\
  \ `tar` 命令的格式。这使得除非你在系统中安装了 Bacula 工具，否则很难处理这些备份数据。\n\n### 总结\n\n在本章中，你探索了如何创建存储设备安全计划。第\
  \ 9 章–第 12 章 中的许多主题包含了存储设备的安全特性。这些特性是一个稳健安全计划的核心。本章回顾了这些关键特性，并介绍了如何创建数据备份以及从这些备份中恢复数据。\n\
  \n#### 关键术语\n\n汉诺塔\n\n磁带设备\n\ntar 包\n\nAmanda\n\nBacula\n\n#### 复习题\n\n**1。** 对于使用数字指定全备和增量备份的工具，数字\
  \ _____ 指定一个全备。\n\n**2。** 下列哪些目录不需要备份？\n\n1. `/etc`\n2. `/var`\n3. `/dev`\n4. `/sys`\n\
  \n**3。** 下列哪些目录不需要备份？\n\n1. `/usr`\n2. `/tmp`\n3. `/proc`\n4. `/boot`\n\n**4。**\
  \ 使用 `_____` 命令用于远程备份数据；默认情况下，它只备份自上次使用命令以来更改的数据。\n\n**5。** 下列哪个备份存储位置可能是最快的？\n\n\
  1. 光光盘\n2. 磁带\n3. 硬盘\n\n**6。** 在以下备份存储位置中，哪个 _____ 指定一个全备。\n\n**7。** 磁带设备上的 _____\
  \ 选项是用于将 _____ 备份数据。\n\n**8。** `_____` 命令用于远程备份数据。\n\n**9。** 在以下备份存储位置中，哪个可能是最快的？\n\
  \n\n\n\n`crontab`(#part0055.html_gloss34) 命令允许用户查看或修改其 `crontab` 文件。`crontab` 文件允许用户调度定期执行的命令，例如每小时一次或每月两次。\n\
  \n`crontab` 命令的常用选项包含在表 14-1 中。\n\n### 表 14-1 重要的 `crontab` 命令选项\n\n| 选项 | 描述 |\n\
  | --- | --- |\n| `-e` | 编辑 `crontab` 文件。 |\n| `-l` | 列出 `crontab` 文件中的条目。 |\n| `-r`\
  \ | 移除 `crontab` 文件中的所有条目。 |\n| `-u` | 指定用户账户。 |\n\n`crontab` 表的每一行被分为多个字段，由一个或多个空格字符分隔。表\
  \ 14-2 描述了这些字段。\n\n### 表 14-2 `crontab` 表的字段\n\n| 字段 | 描述 |\n| --- | --- |\n| 第一字段：分钟\
  \ | 命令应执行的分钟。值可以在 0 到 59 之间。你可以使用单个值或值列表，例如 `0,15,30,45`。也可以使用范围值（`1-15`）。星号（`*`）字符表示“所有可能的值”。\
  \ |\n| 第二字段：小时 | 命令应执行的小时。值可以在 0 到 23 之间。你可以使用单个值或值列表，例如 `0,6,12,18`。也可以使用范围值（`8-16`）。星号（`*`）字符表示“所有可能的值”。\
  \ |\n| 第三字段：日期 | 命令应执行的日期。值可以在 1 到 31 之间。你可以使用单个值或值列表，例如 `1,15`。也可以使用范围值（`1-10`）。星号（`*`）字符表示“未指定”，除非第五字段也是\
  \ `*` 字符，在这种情况下它意味着“所有可能的值”。 |\n| 第四字段：月份 | 命令应执行的月份。值可以在 1 到 12 之间。你可以使用单个值或值列表，例如\
  \ `6,12`。也可以使用范围值（`1-3`）。星号（`*`）字符表示“所有可能的值”。 |\n| 第五字段：星期 | 命令应执行的星期几。值可以在 0 到\
  \ 7 之间（0=周日，1=周一…6=周六，7=周日）。你可以使用单个值或值列表，例如 `1,3,5`。也可以使用范围值（`1-5`）。星号（`*`）字符表示“未指定”，除非第三字段也是\
  \ `*` 字符，在这种情况下它意味着“所有可能的值”。 |\n| 第六字段：命令 | 要执行的命令名称。 |\n\n例如，以下 `crontab` 条目将在每月从早上\
  \ 08:30 开始，在每个工作日（周一至周五）每半小时执行一次直到下午 16:30（下午 4:30）`/home/bob/rpt.pl` 脚本：\n\n点击此处查看代码图片\n\
  \n```\n0,30 8-16 * 1-12 1-5 /home/bob/rpt.pl\n```\n\n要创建 `crontab` 条目，请带有 `-e` 选项执行\
  \ `crontab` 命令：\n\n点击此处查看代码图片\n\n```\nstudent@onecoursesource:~# crontab -e\n```\n\
  \n`crontab` 命令将进入一个编辑器，允许创建或编辑 `crontab` 条目。默认情况下，它将使用 `vi` 编辑器。你可以通过更改 `EDITOR`\
  \ 变量来修改它，该变量在第 2 章的“在命令行上工作”节的“环境变量\n\n```\n\"/tmp/crontab.6or0Y9\":1: bad minute\n\
  errors in crontab file, can't install.\nDo you want to retry the same edit?\n```\n\
  \n你可以在提示符处回答 `Y` 或 `N`。回答 `Y` 将带你回到编辑器，你需要在那里修复错误然后再次退出编辑器。回答 `N` 将丢弃你对 `crontab`\
  \ 表所做的所有更改。\n\n但请注意，如果你输入的是逻辑错误（例如，将小时输入为 4 而不是 16），系统不会提醒你，因为命令语法是有效的。\n\n完成对 `crontab`\
  \ 条目的编辑后，只需像平常一样退出编辑器即可。例如，如果你使用 `vi` 编辑器，请在命令模式下输入 `:wq`。\n\n### 安全要点\n\n每个用户都有自己的\
  \ `crontab` 条目集合。这些条目存储在只有 root 用户才能访问的文件中。这些文件通常位于 `/var/spool/cron` 。\n\n要显示当前用户的\
  \ `crontab` 表，请带有 `-l` 选项执行 `crontab` 命令：\n\n点击此处查看代码图片\n\n```\nstudent@onecoursesource:~#\
  \ crontab -l\n0,30 8-16 * 1-12 1-5 /home/bob/rpt.pl\n```\n\n作为管理员，你可以带有 `-u` 选项执行\
  \ `crontab` 命令来查看其他用户的 `crontab` 表：\n\n点击此处查看代码图片\n\n```\nstudent@onecoursesource:~#\
  \ crontab -l\n0,30 8-16 * 1-12 1-5 /home/bob/rpt.pl\n```\n\n要移除整个 `crontab` 表，请带有\
  \ `-r` 选项执行 `crontab` 命令：\n\n点击此处查看代码图片\n\n```\nstudent@onecoursesource:~# crontab\
  \ -r\n```\n\n### 配置用户访问 cron 服务\n\n作为管理员，你可以使用配置文件来决定用户是否可以使用 `crontab` 命令。`/etc/cron.deny`\
  \ 和 `/etc/cron.allow` 文件用于控制 `crontab` 。\n\n这些文件的格式为每行一个用户名。这是一个示例：\n\n点击此处查看代码图片\n\
  \n```\n[root@localhost ~]$ cat /etc/cron.deny\nalias\nbackup\nbin\ndaemon\nftp\n\
  games\ngnats\nguest\nirc\nlp\nmail\nman\nnobody\noperator\nproxy\nsync\nsys\nwww-data\n\
  ```\n\n表 14-3 描述了 `/etc/cron.deny` 和 `/etc/cron.allow` 文件的工作方式，而图 14-1 提供了额外信息。\n\
  \n### 表 14-3 关于 `/etc/cron.deny` 和 `/etc/cron.allow` 文件的工作细节\n\n| 情况 | 描述 |\n| ---\
  \ | --- |\n| 仅存在 `/etc/cron.deny` 文件 | 文件列出的用户被拒绝使用 `crontab` 命令，而所有其他用户都可以成功执行\
  \ `crontab`。当你想要拒绝少数用户但允许大多数用户时使用此文件。 |\n| 仅存在 `/etc/cron.allow` 文件 | 文件列出的用户被允许使用\
  \ `crontab` 命令，而所有其他用户都无法执行 `crontab`。当你想要允许少数用户但拒绝大多数用户时使用此文件。 |\n| 两个文件都不存在 |\
  \ 在大多数 Linux 发行版中，这意味着只有 root 用户可以使用 `crontab` 命令。但在某些平台上，这会导致所有用户都可以使用 `crontab`，因此请务必并完全你你管理的\
  \ Linux 发行版。 |\n| 两个文件都存在 | 仅查看 `/etc/cron.allow` 文件，完全忽略 `/etc/cron.deny` 文件。 |\n\
  \n![Image](img/00065.jpeg)\n\n**图 14-1** *文本支持™—为什么我不能使用 **crontab**?*\n\n\n\n\n\
  \n在不应由普通用户工作的系统（如服务器）上，最好使用 `/etc/cron.allow` 文件，并仅包含少数允许访问 `crontab` 命令的账户。\n\n\
  ## /etc/crontab\n\n`/etc/crontab` 文件充当系统 `crontab` 的角色。系统管理员编辑此文件以便在特定间隔执行系统关键进程。\n\
  \n### 安全要点\n\n`/etc/crontab` 文件对于执行系统维护至关重要，对于自动化安全扫描也是如此。只有 root 用户有权限修改此文件，但在大多数发行版中，普通用户默认可以查看其内容。考虑移除“其他”（others）权限集的读取权限，以避免窥探的眼睛看到你正在执行哪些扫描。\n\
  \n这是一个示例的 `/etc/crontab` 文件：\n\n点击此处查看代码图像\n\n```\n[root@localhost ~]$ more /etc/crontab\n\
  SHELL=/bin/sh\nPATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin\n\
  \n# m h dom mon dow user  command\n17 *    * * *   root    cd / && run-parts /etc/cron.hourly\n\
  ```\n\n每行配置都描述了一个要执行的进程、何时执行以及执行该进程时使用的用户名。每行被分为多个字段，由一个或多个空格分隔。表 14-4 描述了这些字段。\n\
  \n### 表 14-4 /etc/crontab 文件的字段\n\n| 字段 | 描述 |\n| --- | --- |\n| 第一个字段：分钟 | 命令执行的分钟。值可以在\
  \ 0 到 59 之间。你可以使用单个值或值列表，例如 `0,15,30,45`。也可以使用范围值（`1-15`）。星号（`*`）字符表示“所有可能的值”。 |\n\
  | 第二字段：小时 | 命令执行的小时。值可以在 0 到 23 之间。你可以使用单个值或值列表，例如 `0,6,12,18`。也可以使用范围值（`8-16`）。星号（`*`）字符表示“所有可能的值”。\
  \ |\n| 第三个字段：日期 | 命令执行的每月日期。值可以在 1 到 31 之间。你可以使用单个值或值列表，例如 `1,15`。也可以使用范围值（`1-10`）。星号（`*`）字符表示“未指定”，除非第五字段也是星号（`*`），在这种情况下它表示“所有可能的值”。\
  \ |\n| 第四个字段：月份 | 命令执行的月份。值可以在 1 到 12 之间。你可以使用单个值或值列表，例如 `6,12`。也可以使用范围值（`1-3`）。星号（`*`）字符表示“所有可能的值”。\
  \ |\n| 第五个字段：星期 | 命令执行的星期。值可以在 0 到 7 之间（0=周日，1=周一……6=周六，7=周日）。你可以使用单个值或值列表，例如 `1,3,5`。也可以使用范围值（`1-5`）。星号（`*`）字符表示“未指定”，除非第三字段也是星号（`*`），在这种情况下它表示“所有可能的值”。\
  \ |\n| 第六个字段：用户名 | 执行命令的用户名。 |\n| 第七个字段：命令名 | 要执行的命令名称。 |\n\n大多数默认的 `/etc/crontab`\
  \ 文件设计用于执行一个名为 `run-parts` 的脚本。该脚本接受目录名称作为参数。脚本将执行指定目录中的所有程序（很可能是脚本本身）。\n\n例如，在接下来的\
  \ `/etc/crontab` 条目中，首先通过 `cd` 命令将当前目录更改到 `/` 目录，然后执行 `/etc/cron.hourly` 目录中的所有程序：\n\
  \n点击此处查看代码图像\n\n```\n[root@localhost ~]$ tail -n 1 /etc/crontab\n17 *    * * * \
  \  root    cd / && run-parts /etc/cron.hourly\n```\n\n大多数发行都会为以下目录包含 `run-parts`\
  \ 的 `/etc/crontab` 条目：\n\n* `/etc/cron.hourly`：包含每小时执行一次的程序\n* `/etc/cron.daily`：包含每天执行一次的程序\n\
  * `/etc/cron.weekly`：包含每周执行一次的程序\n* `/etc/cron.monthly`：包含每月执行一次的程序\n\n这意味着，如果你想每天执行一次某些操作，不需要在\
  \ `/etc/crontab` 文件中创建条目。你可以将程序放置在 `/etc/cron.daily` 目录中。这就是许多开发者处理需要自动化任务的方法。因此，在安装某些软件后，你可能会在这些目录中的一个或多个发现新程序。\n\
  \n### 安全要点\n\n请记住，放置在 `/etc/cron.{hourly,daily,weekly,monthly}` 任何目录中的程序都将以 root\
  \ 用户身份执行。由于这种特权权限，你应该谨慎放置在这些目录中的任何程序。安装软件后，务必检查这些目录以查看是否有新条目。你也可以自动化此任务，正如你在第 15\
  \ 章“脚本编写”中学到的那样。\n\n除了 `/etc/crontab` 文件中的条目外，系统 `crontab` 条目也可以于 `/etc/cron.d`\
  \ 目录。这使得软件开发者更容易添加自定义条目（而不是直接编辑 `/etc/crontab` 文件）。因此，在确定所有将执行的系统 cron 任务时，请查看 `/etc/cron.d`\
  \ 目录中的所有文件以及 `/etc/crontab` 文件中的条目。\n\n### 安全要点\n\n熟悉本节提到的所有文件和目录。注意这些位置本应包含的内容，因为黑客经常会在系统\
  \ `crontab` 文件或 `/etc/cron.{hourly,daily,weekly,monthly}` 目录中添加条目，以在系统中创建后门。这种技术通常在黑客获得系统\
  \ root 权限后使用，旨在即使在入侵行为被发现后也能轻松重新获得访问。\n\n例如，如果黑客以 root 用户身份访问了系统，他们可以在 `/etc/cron.daily`\
  \ 目录中创建一个小型脚本来重置 root 密码（重置为他们知道的内容）。即使被发现，他们只需要等到第二天即可，因为 root 密码很快就会被设置为他们知道的内容。\n\
  \n如果你发现了一个不认识的条目，请查看将要执行的文件内容，以确定该文件是否合法，或者如果允许该文件执行是否存在潜在的安全问题。\n\n## /etc/anacrontab\n\
  \n`crontab` 系统按计划执行命令的组件是 `crond` 守护进程。这是一个后台运行的进程，每分钟唤醒一次并根据需要执行命令。\n\n系统 `crontab`（`/etc/crontab`\
  \ 文件和 `/etc/cron.d` 目录中的文件）的一个问题是，当系统关闭且应该执行命令时会发生什么。在这种情况下，重要的系统命令可能会被跳过。考虑以下场景：用户的\
  \ Linux 笔记本电脑上有几个设计在晚上运行的 `crontab` 条目。该用户每天下班前习惯性关闭笔记本。第二天早上，用户打开笔记本。遗憾的是，上述没有任何\
  \ `crontab` 条目会被执行，因为在命令本应该执行时，由于笔记本未打开，`crond` 守护进程并没有运行。\n\n`/etc/anacrontab`\
  \ 文件用于 `anacron` 命令，以确定如何执行 `crond` 在系统关闭期间错过的命令。一个典型的 `/etc/anacrontab` 文件如下：\n\
  \n点击此处查看代码图像\n\n\n\n\n\n```\n[root@localhost ~]$ cat /etc/anacrontab\nSHELL=/bin/sh\n\
  PATH=/sbin:/bin:/usr/sbin:/usr/bin\nMAILTO=root\n# the maximal random delay added\
  \ to the base delay of the jobs\nRANDOM_DELAY=45\n# the jobs will be started during\
  \ the following hours only\nSTART_HOURS_RANGE=3-22\n\n#period in days  delay in\
  \ minutes  job-identifier   command\n1         5    cron.daily     nice run-parts\
  \ /etc/cron.daily\n7        25    cron.weekly    nice run-parts /etc/cron.weekly\n\
  @monthly 45cron.monthly   nice run-parts /etc/cron.monthly\n```\n\n文件的底行描述了要运行哪些命令以及何时运行它们。每行被分为多个字段，由一个或多个空格字符分隔。表\
  \ 14-5 描述了这些字段。\n\n### 表 14-5 `/etc/anacrontab` 文件的字段\n\n| 字段 | 描述 |\n| --- | ---\
  \ |\n| 第一个字段：周期 (period) | `anacron` 命令查看日志文件以确定第三字段列出的命令上一次执行的时间。第一个字段意味着“如果距离上次执行该命令已超过此天数，则在启动过程完成后执行该命令”。\
  \ |\n| 第二个字段：等待时间 (wait time) | 系统完成启动后等待这段时间（分钟），然后执行第四字段中的命令。 |\n| 第三个字段：命令名称\
  \ | 被跳过的命令名称。 |\n| 第四个字段：要执行的命令 | 应该执行的命令。 |\n\n例如，以下行意味着“如果距离上次执行 `cron.daily`\
  \ 命令已一天或以上，则在系统启动 5 分钟后执行 `nice run-parts /etc/cron.daily` 命令”：\n\n点击此处查看代码图像\n\n\
  ```\n1     5     cron.daily       nice run-parts /etc/cron.daily\n```\n\n### 注意\n\
  \n在某些现代 Linux 发行版中，`anacron` 实用已经过时，因为现代的 `crond` 守护进程处理了此功能。然而，如果你的系统仍使用 `anacron`\
  \ 实用，你应该了解它的工作原理，因为你应该维护此文件，以与系统 `crontab` 表执行的操作保持一致。\n\n#### 使用 at\n\n`at` 命令用于调度在未来的某个特定时间执行一个或多个命令。该命令的语法为\
  \ `at time`，其中 `time` 表示你想要执行命令的时间。例如，以下命令将允许你调度一个命令在明天下午 5:00 运行：\n\n```\nat 5pm\
  \ tomorrow\nat>\n```\n\n当出现 `at>` 提示符时，输入要在指定时间执行的命令。要执行多个命令，请按 `Enter` 键获取另一个 `at>`\
  \ 提示符。\n\n完成后，按住 `Ctrl` 键并按下字母 `d`。这将产生 `<EOT>` 消息并创建 `at` 任务。这里是一个示例：\n\n点击此处查看代码图像\n\
  \n```\n[root@localhost ~]$ at 5pm tomorrow\nat>/home/bob/rpt.pl\nat>echo \"report\
  \ complete\" | mail bob\nat><EOT>\njob 1 at Thu Feb 23 17:00:00 2017\n```\n\n###\
  \ atq\n\n`atq` 命令列出当前用户的 `at` 任务：\n\n点击此处查看代码图像\n\n```\n[root@localhost ~]$ atq\n\
  1       Thu Feb 23 17:00:00 2018 a bob\n```\n\n输出包括任务编号（上一个例中的 1）、命令执行的日期和用户名（bob）。\n\
  \n### atrm\n\n要在执行 `at 任务之前删除它，请运行 `atrm` 命令并跟上要删除的任务编号。例如：\n\n点击此处查看代码图像\n\n```\n\
  [root@localhost ~]$ atq\n1       Thu Feb 23 17:00:00 2018 a bob\n[root@localhost\
  \ ~]$ atrm 1\n~/shared$ atq\n```\n\n#### 配置用户访问 at 服务\n\n作为管理员，你可以使用配置文件来确定用户是否可以使用\
  \ `at` 命令。etc/at.deny` 和 `/etc/at.allow` 文件用于控制对 `at` 命令的访问。注意，这与控制对 `crontab` 命令的访问的方法相同，但文件名不同。\n\
  \n这些文件的格式为每行一个用户名。例如：\n\n点击此处查看代码图像\n\n```\n[root@localhost ~]$ cat /etc/at.deny\n\
  alias\nbackup\nbin\ndaemon\nftp\ngames\ngnats\nguest\nirc\nlp\nmail\nman\nnobody\n\
  operator\nproxy\nsync\nsys\nwww-data\n```\n\n表 14-6 描述了 `/etc/at.deny` 和 `/etc/at.allow`\
  \ 文件的工作原理。\n\n### 表 14-6 关于 `/etc/at.deny` 和 `/etc/at.allow` 文件工作原理的细节\n\n| 情况 |\
  \ 描述 |\n| --- | --- |\n| 仅存在 `/etc/at.deny` 文件 | 此文件中列出的所有用户都被拒绝访问 `at` 命令，而所有其他用户都可以成功执行\
  \ `at` 命令。当你想要拒绝少数用户的访问但允许大多数用户访问时，使用此文件。 |\n| 仅存在 `/etc/at.allow` 文件 | 此文件中列出的所有用户都被允许访问\
  \ `at` 命令，而所有其他用户无法成功执行 `at` 命令。当你想要拒绝少数用户的访问但允许大多数用户访问时，使用此文件。 |\n| 两个文件都不存在 |\
  \ 在大多数 Linux 发行版中，这意味着 root 用户可以使用 `at` 命令。 |\n| 两个文件都存在 | 只参考 `at.allow` 文件，完全忽略\
  \ `at.deny` 文件。 |\n\n### 对话式学习——crontab vs at\n\n**Gary**: 嗨，Julia。你能解释一下在什么情况下我应该用\
  \ `crontab` 命令而不是 `at` 命令吗？\n\n**Julia**: 没问题，假设你想在未来的某个时间运行一个命令。例如，你想看下周六谁登录了系统。在这种情况下，你可以使用\
  \ `at` 命令。\n\n**Gary**: 好的，那么什么时候该用 `crontab` 命令呢？\n\n**Julia**: 假设你需要定期执行某个命令。例如，每个星期都需要自动处理工资批处理任务。在这种情况下，你将使用\
  \ `crontab`。\n\n**Gary**: 好的，明白了。谢谢。\n\n**Julia**: 没问题！\n\n### 总结\n\nLinux 操作系统提供了多种方法来调度任务，例如在未来运行程序。本章涵盖了\
  \ `crontab` 和 `at` 两个工具。学习自动化任务对于你作为系统管理员的效率以及系统的一致性都有帮助。本章中的“安全要点”（Security Highlight）侧边栏有助于识别需要检查的区域，因为自动化可能会带来安全风险。\n\
  \n#### 关键术语\n\nat\n\ndaemon\n\ncrontab\n\n#### 复习题\n\n**1.** `crontab` 命令的 _____\
  \ 选项将删除当前用户 `crontab` 中的所有输入。\n\n**2.** `crontab` 文件的哪个字段被用于指定星期几？\n\n1. 2\n2. 3\n\
  3. 4\n4. 5\n\n**3.** 哪些文件用于控制谁可以使用 `crontab` 命令？（选择两项。）\n\n1. `/etc/cron.deny`\n\
  2. `/etc/cron.permit`\n3. `/etc/cron.block`\n4. `/etc/cron.allow`\n\n**4.** `/etc/_____`\
  \ 文件被系统管理员用于按间隔执行系统关键进程。\n\n**5.** _____ 命令将列出当前用户的 `at` 任务。\n\n\n\n\n\n有些人会通过查看历史列表来让操作变得更简单。回想第\
  \ 2 章中的“在命令行中工作”，你可以通过不断按向上方向键直到看到正确的命令，或者通过输入 `!`+`cmd`（将 `cmd` 替换为你想执行的命令）来重新执行之前的命令。这种方法有时有效，但历史列表会变化，而且为了找到特定命令而连续按\
  \ 75 次向上方向键本身就是一种令人沮丧的行为。\n\n这就是脚本编写更有意义的地方。脚本编写本质上是根据你想要经常（或偶尔）执行的 Linux 命令创建的小型程序。脚本编写还提供了一些编程特性，例如流控制和向脚本传递参数。在本章中，你将学习如何创建和读取\
  \ `BASH` 壳脚本。\n\n读完本章并完成练习后，你将能够做到以下点：\n\n- 描述不同脚本语言的关键特性，包括 Perl、Python 和 `BASH`\
  \ 脚本\n- 创建和读取 `BASH` 脚本\n\n## Linux 编程\n\n大多数 Linux 编程语言可以分为两个大类：脚本语言（有时称为“解释型”语言）和编译型语言。并没有严格的定义来划分这些类别，但以下是它们之间的本质区别：\n\
  \n- 编译型语言不能直接从源代码执行。必须先将源代码转换为编译代码。\n- 脚本传统上是不编译的。\n- 脚本语言通常更容易学习。\n- 脚本执行某项任务所需的代码通常较少。\n\
  \n作为一个这些类别没有被严格定义的例子，请考虑以下情况：`Perl` 是一种流行的脚本语言，可以直接从源代码执行，但在执行之前它会被编译到内存中，并执行代码的编译形式。\n\
  \n由于本书的侧重点是 Linux，因此本章将集中在 `BASH` 脚本编写上。然而，你应该意识到，Linux 发行版也经常使用其他脚本语言。接下来的章节简要介绍了\
  \ `BASH`、`Perl` 和 `Python` 脚本——这些是 Linux 上最常用的三种脚本语言。\n\n### BASH 壳脚本编写\n\n在之前的章节中，你已经学习了在\
  \ Linux 中工作和使用 `BASH` 壳的基础知识。你学过的命令也可以用于脚本编写程序。例如，假设你经常执行以下命令：\n\n点击此处查看代码图像\n\n\
  ```\ncd /home\nls -l /home > /root/homedirs\ndu -s /home/* >> /root/homedirs\ndate\
  \ >> /root/homedirs\n```\n\n与其日复一日地手动执行这些每一个命令，你可以将所有命令放入一个文件中，使该文件为可执行，然后像程序一样运行该文件：\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]$ more /root/checkhome.sh\n#!/bin/bash\n\
  \ncd /home\nls -l /home > /root/homedirs\ndu -s /home/* >> /root/homedirs\ndate\
  \ >> /root/homedirs\n[root@onecoursesource~]$ chmod a+x /root/checkhome.sh\n[root@onecoursesource~]$\
  \ /root/checkhome.sh\n```\n\n因为你可以在 `BASH` 壳脚本中原生使用 Linux 命令，这种脚本语言可以非常强大。使用这种语言的另一个优势是，你可以确信几乎每个\
  \ Linux（以及 Unix）发行版都会拥有 `BASH` 壳，这使得脚本从一个系统迁移到另一个系统变得容易。\n\n除了可以在 `BASH` 壳脚本中使用\
  \ Linux 命令外，你应该意识到这种语言还有其他编程特性，例如：\n\n- 变量\n- 循环控制（`if`、`while` 等）\n- 退出状态值\n- 从其他文件加载代码的能力\n\
  \n尽管具有这些优点，`BASH` 壳脚本也有一些缺点：\n\n- 它缺乏一些高级编程特性，例如面向对象的编程。\n- 它通常比执行其他语言要慢得多，因为每个命令通常是作为一个独立的进程执行的。\n\
  \n尽管有这些缺点，`BASH` 壳脚本在 Linux 中仍然流行。事实上，在典型的 Linux 发行版上搜索 `BASH` 脚本（以 `.sh` 结尾的文件）通常会得到数百个结果：\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]$ find / -name \"*.sh\" | wc -l\n578\n\
  ```\n\n提示：上一个命令为你提供了寻找现有 `BASH` 壳脚本的方法。这很有用，因为学习 `BASH` 壳脚本包含了阅读现有的脚本。\n\n### Perl\
  \ 脚本编写\n\n20 世纪 80 年代中期，一位名为 Larry Wall 的开发者开始研究一种新的脚本语言，这种语言最终被命名为 Perl。当时他正在基于\
  \ Unix 的系统工作，这些系统拥有 C 编程语言、Bourne Shell 脚本语言（`BASH` 的前身）以及 `sed` 和 `awk` 等工具（稍后会介绍这些工具）。然而，这些工具都没有按照他的意愿工作，因此他创建了自己的语言。\n\
  \n当然，Larry 不想丢失他喜欢的这些工具的特性，因此他将喜欢的特性整合到了自己的新语言中。这产生了一种既像 C、像脚本编写，又像 Unix 工具合集的语言。\n\
  \nLinux 用户喜欢 `Perl` 的几个方面，包括以下：\n\n- 你可以非常快速地编写 `Perl` 代码，因为基础脚本所需的大部分已经内置在语言中。\n\
  - `Perl` 代码非常灵活；你不会像其他语言那样受到限制。\n- `Perl` 的语法相当简单，主要源自 C 语言。\n- 学习 `Perl` 通常不需要很长时间。\n\
  - `Perl` 拥有非常强大的特性，例如健壮的正则表达式。\n\n尽管 `Perl` 可用于许多应用程序，但它通常用于：\n\n- **数据解析**：`Perl`\
  \ 拥有强大的正则表达式功能，使其非常适合数据处理（从数据中提取块并生成报告）。\n- **Web 开发**：由于其 Web 开发特性，它是基于 LAMP（LAMP\
  \ = Linux, Apache HTTP Server, MySQL, Perl 或 PHP）技术的一部分，包括通用网关接口（`CGI`）。\n- **代码测试**：因为\
  \ `Perl` 编写简单快速，开发者经常使用它来创建测试应用程序工具。\n- **GUI 程序**：额外的 Perl 模块（库），如 `WxPerl` 和 `Tk`，为\
  \ Perl 程序员提供了轻松创建 GUI 界面供用户与 Perl 代码交互的选项。\n- **管理工具**：系统管理员经常创建 Perl 脚本来帮助他们自动化管理任务。\n\
  \n**注意**\n\n`Perl` 脚本编写是一个非常大的话题，超本书的范围。然而，随着你 Linux 经验的增长，`Perl` 是你应该考虑学习的语言，因为它拥有允许你自动化\
  \ Linux 任务的特性。\n\n### Python 脚本编写\n\nPython 的起源由其创始人 Guido van Rossum 描述，他在 1996\
  \ 年出版的一本关于 Python 的书籍序中写道：\n\n“六年前，1989 年 12 月，我正在寻找一个‘爱好’编程项目，来度过圣诞期间的一周。我的办公室……会关门，但我有一台家用电脑，闲闲无事。我决定为我最近一直在思考的新脚本语言编写一个解释器：一种\
  \ ABC 的后代，能够吸引 Unix/C 黑客的兴趣。我选择 Python 作为项目的临时标题，当时我的心情有点反叛（而且是《蒙提派飞行滑团》的大粉丝）。”\n\
  \n\n\n\n\n他并不知道 Python 终将成为世界上最流行的脚本语言之一。自从 20 世纪 80 年代那个决定性的圣诞假期以来，Python 已经发展成为一种健壮的编程语言，许多\
  \ Linux 工具和开源项目的核心。\n\nPython 的驱动哲学之一是结构良好的代码。Python 通过非常严格的缩进方案等规则来强制执行。你可以通过阅读“Python\
  \ 之禅”文档中定义的一些规则，看到 Python 开发者是如何认真对待“结构良好的”这一概念的：\n\n* 美化优于丑陋。\n* 显式优于隐式。\n* 简单优于复杂。\n\
  * 复杂优于晦涩。\n* 扁坦优于嵌套。\n* 稀疏优于密集。\n* 可读性至关重要。\n\n除了 Python 是一种结构良好的语言外，以下组件使得 Python\
  \ 成为一种流行语言：\n\n* 它具有面向对象的特性。\n* 它拥有巨大的标准库。\n* 它是可扩展或嵌入的。\n* Python 提供的数据结构比许多语言都更丰富。\n\
  \n尽管 Python 可用于许多不同的应用，但它通常用于以下领域：\n\n* **基于网络的应用程序**：通过使用基于 Python 的网络框架 `Twisted`，你可以开发基于网络的应用程序。\n\
  * **Web 开发**：Apache Web Server 使用 Python 脚本构建动态网站的选项。\n* **科学应用**：Python 有多个可用库，使其成为创建科学应用的良好选择。\n\
  * **系统工具**：Linux 开发者经常使用 Python 为操作系统创建系统工具。\n\n### Note\n\nPython 脚本是一个非常庞大的话题，超出了本书的范围。然而，随着你对\
  \ Linux 经验的增长，Python 是一门你应该考虑学习的语言，因为它强大的功能，允许你在 Linux 上实现任务自动化。\n\n### 对话学习™——哪种语言最好？\n\
  \n**Gary**: 嗨，Julia！我正准备创建一个脚本，但不确定哪种语言是最好的。我在考虑 Perl、Python 或 BASH。哪一个是最好的语言？\n\
  \n**Julia**: 我认为列出每种脚本语言的优缺点是一个错误。首先，这通常是一个观点问题。\n\n**Gary**: 你什么什么意思？\n\n**Julia**:\
  \ 例如，Perl 是一种非常灵活的语言，而 Python 更有结构。如果我想写一个快速脚本，并且不担心长期维护代码，那么灵活性可能是一个优点，而结构是一个缺点。然而，如果我在和多个开发者一起开发一个较大的产品，那么结构可能是一个优点，而灵活性是一个缺点。\n\
  \n**Gary**: 那么，我如何决定使用哪种语言呢？\n\n**Julia**: 与其尝试比较每种脚本语言的优缺点，不如尝试关注人们通常喜欢每种语言的什么，以及每种语言的典型用途。决定语言的某个方面是特性还是劣势会更好。\n\
  \n**Gary**: 好的，我想这很有道理，因为如果存在一种“最好的语言”，那么大家都会只用那一种语言了。\n\n**Julia**: 你得很好——你明白我的意思了。\n\
  \n### BASH 脚本基础\n\n在某种程度上，你已经了解了 BASH 脚本的许多基础知识，因为你已经在书中学习了 BASH shell 的许多功能。例如，你已经在第\
  \ 2 章中学习了 shell 变量。Shell 变量用于 BASH 脚本中存储值。\n\n要启动 BASH 脚本，请在文本编辑器（如 `vi` 或 `vim`\
  \ 编辑器）中输入以下内容作为脚本的第一的第一：\n\n```\n#!/bin/bash\n```\n\n这个特殊序列被称为 `shebang`，它告诉系统将此代码作为\
  \ BASH 脚本执行。\n\nBASH 脚本中的注释以 `#` 字符开头，并延伸到行尾。例如：\n\n点击此处查看代码图像\n\n```\necho \"Tux\
  \ for President\"   #向屏幕打印 \"Tux for President\"\n```\n\n如上一个示例所示，`echo` 命令可以用于向运行程序的的用户显示信息。`echo`\
  \ 命令的参数可以包含任何文本数据，还可以包含变量的值：\n\n```\necho \"The answer is $result\"\n```\n\n在创建并保存\
  \ BASH 脚本后，你需要使其具有可执行性：\n\n点击此处查看代码图像\n\n```\n[student@onecoursesource ~]$ more\
  \ hello.sh\n#!/bin/bash\n#hello.sh\n\necho \"Tux for President\"\n[student@onecoursesource\
  \ ~]$ chmod a+x hello.sh\n```\n\n### Security Highlight\n\n脚本永远不应设置 SUID 权限。此权限允许有人劫持脚本并以脚本所有者的身份运行命令。\n\
  \n现在你可以使用以下语法将代码作为程序运行：\n\n点击此处查看代码图像\n\n```\n[student@onecoursesource ~]./hello.sh\n\
  Tux for President\n```\n\n注意，需要在命令名称之前放置 `./`。这是因为命令可能不在 `PATH` 变量指定的任何目录中。\n\n\
  点击此处查看代码图像\n\n```\n[student@onecoursesource ~]$ echo $PATH\n/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin\n\
  ```\n\n为了避免在运行脚本时需要包含 `./`，你可以修改 `PATH` 变量以包含脚本所在的目录。例如，用户在主目录下创建一个 `bin` 目录并将脚本放在其中：\n\
  \n点击此处查看代码图像\n\n```\n[student@onecoursesource ~]$ mkdir bin\n[student@onecoursesource\
  \ ~]$ cp hello.sh bin\n[student@onecoursesource ~]$ PATH=\"$PATH:/home/student/bin\"\
  \n[student@onecoursesource ~]$ hello.sh\nhello!\n```\n\n除了第 2 章中讨论的变量外，BASH 脚本还有代表传入参数的变量。例如，考虑执行一个名为\
  \ `test.sh` 的脚本：\n\n点击此处查看代码图像\n\n```\n[student@onecoursesource ~]$ test.sh Bob\
  \ Ted\n```\n\n值 **Bob**、**Sue** 和 **Ted** 被赋值给脚本中的变量。第一个参数 (**Bob**) 被赋值给 `$1`，第二个参数赋值给\
  \ `$2`，依此类推。此外，所有参数被共同赋值给 `$@`。\n\n关于这些位置参数或任何与 BASH 脚本相关的详细信息，请查阅 B 的 man 页：\n\n\
  点击此处查看代码图像\n\n```\n[student@onecoursesource ~]$ man bash\n```\n\n### 条件表达式\n\nBASH\
  \ shell 提供了几种条件语句，包括 `if` 语句：\n\n点击此处查看代码图像\n\n```\nif [ cond ]\nthen\n    statements\n\
  elif [ cond ]\nthen\n    statement\nelse\n    statements\nfi\n```\n\n注意以下几点：\n\n\
  * “else, if”语句写作 `elif`，如果你不需要进行额外的条件检查，则不需要它。\n* 在 `if` 和 `elif` 之后，你需要一个 `then`\
  \ 语句。然而，在 `else` 之后不要包含 `then` 语句。\n* 使用倒过来的“if”单词 `fi` 来结束 `if` 语句。\n\n参见示例 15-1\
  \ 获取 `if` 语句的示例。\n\n**示例 15-1** *示例 **if** 语句*\n\n点击此处查看代码图像\n\n\n\n\n\n```bash\n\
  #!/bin/bash\n#if.sh\n\ncolor=$1\n\nif [ \"$color\" = \"blue\" ]\nthen\n   echo \"\
  it is blue\"\nelif [ \"$color\" = \"red\" ]\nthen\n   echo \"it is red\"\nelse\n\
  \   echo \"no idea what this color is\"\nfi\n```\n\n### 注意\n\nBASH 允许你在进行数值相等性判断时使用\
  \ `==` 或 `=`。\n\n在 示例 15-1 中，使用了以下条件语句：\n\n```\n[ \"$color\" = \"blue\" ]\n```\n\
  \n这种这种语法会隐式地调用一个名为 `test` 的 BASH 命令，该命令可用于执行多种比较测试。这包括整数（数值）比较、字符串比较和文件测试操作。例如，使用以下语法测试存储在变量\
  \ `$name1` 中的字符串值是否等于存储在变量 `$name2` 中的字符串：\n\n```\n[ \"$name1\" != \"$name2\" ]\n\
  ```\n\n### 可能会出现什么问题？\n\n创建 `if` 语句时常见的错误包括忘记在 `if` 和 `elif` 语句之后加上 `then`。此外，人们经常错误地在\
  \ `else` 语句后放置 `then`，但这是错误的。\n\n### 重要提示\n\n方括号周围的空格非常重要。每个方括号的前后都应该有一个空格。如果没有这些空格，将会发生错误信息。\n\
  \n养成在 BASH 脚本中给变量加上双引号的习惯。这在变量未被赋值时非常重要。例如，假设执行 示例 15-1 中的脚本时没有提供任何参数。结果是 `color`\
  \ 变量未赋值，生成的条件语句将变为 `if [ = “blue” ]`。\n\n结果将为假（false），但如果没有在 `$color` 周加上引号，结果将是一个错误信息并且脚本将立即退出。这是因为在返回\
  \ `$color` 的值后，生成的条件语句缺少了其关键组件之一：`if [ = “blue” ]`。\n\n除了判断两个字符串是否相等或不相等外，你可能发现\
  \ `-n` 选项很有用。该选项用于判断字符串是否为空，这在测试用户输入时非常有用。例如，示例 15-2 中的代码将从用户输入（键盘）读取数据，将输入赋值给变量\
  \ `$name`，并测试确保用户确实输入了名称。\n\n### 示例 15-2：测试用户输入\n\n点击此处查看代码图像\n\n```\n[student@onecoursesource\
  \ ~]$ more name.sh\n#!/bin/bash\n#name.sh\n\necho \"Enter your name\"\nread name\n\
  if [ -n \"$name\" ]\nthen\n   echo \"Thank you!\"\nelse\n   echo \"hey, you didn't\
  \ give a name!\"\nfi\n[student@onecoursesource ~]./name.sh\nEnter your name\nBo\n\
  Thank you!\n[student@onecoursesource ~]./name.sh\nEnter your name\n\nhey, you didn't\
  \ give a name!\n```\n\n## 整数比较\n\n如果你想执行整数（数值）比较操作，请使用以下符号：\n\n* `-eq`: 如果值相等则为真。\n\
  * `-ne`: 如果值不相等则为真。\n* `-gt`: 如果第一个值大于第二个值则为真。\n* `-lt`: 如果第一个值小于第二个值则为真。\n* `-ge`:\
  \ 如果第一个值大于或等于第二个值则为真。\n* `-le`: 如果第一个值小于或等于第二个值则为真。\n\n## 文件测试比较\n\n你也可以对文件和目录执行测试操作，以确定文件状态的信息。这些操作包括：\n\
  \n* `-d`: 如果“文件”是目录则为真。\n* `-f`: 如果“文件”是普通文件则为真。\n* `-r`: 如果文件存在且运行脚本的用户可读则为真。\n\
  * `-w`: 如果文件存在且运行脚本的用户可写则为真。\n* `-x`: 如果文件存在且运行脚本的用户可执行则为真。\n* `-L`: 如果第一个值小于或等于第二个值则为真。\n\
  \n## 流程控制语句\n\n除了 `if` 语句外，BASH 脚本语言还有其他几种流程控制语句：\n\n* **while 循环**: 只要条件语句为真，就会重复执行代码块。\n\
  * **until 循环**: 只要条件语句为假，就会重复执行代码块。本质上是 `while` 循环的相反。\n* **case 语句**: 类似于 `if`\
  \ 语句，但为多种情况提供了更容易分支方法。`case` 语句以 `esac`（“case”的倒序写法）结束。\n* **for 循环**: 为值列表中的每个项目执行代码块。\n\
  \n### while 循环\n\n以下代码段将提示用户输入五位数字。如果用户遵守，程序将继续，因为 `while` 循环的条件将为假。然而，如果用户提供了错误的数据，`while`\
  \ 循环的条件将为真，用户将再次再次输入正确的数据：\n\n点击此处查看代码图像\n\n```\necho \"Enter a five-digit ZIP code:\
  \ \"\nread ZIP\n\nwhile echo $ZIP | egrep -v \"^[0-9]{5}$\" > /dev/null 2>&1\ndo\n\
  \   echo \"You must enter a valid ZIP code – five digits only!\"\n   echo \"Enter\
  \ a five-digit ZIP code: \"\n   read ZIP\ndone\n\necho \"Thank you\"\n```\n\n上一个示例中的\
  \ `egrep` 命令有点复杂。首先，正则表达式模式匹配的是恰好为五位数字的值。`-v` 选项用于在未找到模式时返回一个值。因此，如果 `$ZIP` 包含一个有效的五位数字，那么\
  \ `egrep` 将返回假结果，因为它正在尝试寻找不包含五位数字的行。如果 `$ZIP` 包含五位数字以外的内容，`egrep` 命令将返回真结果。\n\n\
  为什么用 `> /dev/null 2>&1`？因为你不想显示来自 `egrep` 命令的任何内容，只需利用它的真/假返回值。所有操作系统（OS）命令在执行时都会返回一个真或假值（技术上每个命令返回\
  \ 0 表示“真”，返回正数表示“假”），这正是这里需要的。命令产生的任何 `STDOUT`（普通命令输出）或 `STDERR`（命令错误消息）都是不必要的，且如果显示给用户，只会增加混乱。\n\
  \n### for 循环\n\n`for` 循环允许你对一组项目执行操作。例如，以下命令以 root 用户身份运行时，将创建五个用户账户：\n\n点击此处查看代码图像\n\
  \n```bash\nfor person in bob ted sue nick fred\ndo\n    useradd $person\ndone\n\
  ```\n\n### 循环控制\n\n与大多数语言一样，BASH 脚本提供了一种提前退出循环的方法，或者停止当前循环迭代并开始新一次迭代。使用 `break`\
  \ 命令立即退出 `while`、`until` 或 `for` 循环。使用 `continue` 命令停止 `while`、`until` 或 `for` 循环的当前迭代并开始下一次迭代。\n\
  \n### case 语句\n\n`case` 语句设计用于需要多次条件检查的情况。虽然可以使用带有多个 `elif` 语句的 `if` 语句，但 `if`/`elif`/`else`\
  \ 的语法通常比 `case` 语句复杂。\n\n这是 `case` 语句的语法（注意 `cmd` 代表任何 BASH 命令或编程语句）：\n\n点击此处查看代码图像\n\
  \n```bash\ncase var in\ncond1)  cmd\n        cmd;;\ncond2)  cmd\n        cmd;;\n\
  esac\n```\n\n对于上例语法示例，`var` 代表你想要条件检查的变量值。例如，考虑以下代码：\n\n点击此处查看代码图像\n\n```bash\n\
  name=\"bob\"\n\ncase $name in\nted)  echo \"it is ted\";;\nbob) echo \"it is bob\"\
  ;;\n*)     echo \"I have no idea who you are\"\nesac\n```\n\n\n\n\n\n“条件”（condition）是一种使用与文件通配符相同匹配规则的模式。星号（`*`）匹配零或多个任意字符，`?`\
  \ 匹配单个字符，你还可以使用方括号 `[]` 来匹配特定范围内的单个字符。你还可以使用管道符（`|`）表示“或”。例如，考虑示例 15-3，它用于检查用户对问题的回答。\n\
  \n#### 示例 15-3：`case` 语句示例\n\n点击此处查看代码图片\n\n```\nanswer=yes\n\ncase $answer in\n\
  y|ye[sp]) echo \"you said yes\";;\nn|no|nope) echo \"you said no\";;\n*)  echo \"\
  bad response\";;\nesac\n```\n\n### 用户交互\n\n示例 15-3 中的示例有点像一个谜题，因为它的目的是检查用户输入。然而，变量是硬编码的。使用实际的用户输入会更有意义，这可以通过\
  \ `read` 语句来收集：\n\n```\nread answer\n```\n\n`read` 语句将提示用户提供信息，并将该数据（技术上来自 `STDIN`，即程序从该处读取数据，且默认设置为用户的键盘）读取到指定为\
  \ `read` 语句参数的变量中。请参阅示例 15-4 的示例。\n\n#### 示例 15-4：`read` 语句示例\n\n点击此处查看代码图片\n\n\
  ```\nread answer\n\ncase $answer in\ny|ye[sp]) echo \"you said yes\";;\nn|no|nope)\
  \ echo \"you said no\";;\n*)  echo \"bad response\";;\nesac\n```\n\n要给不同的变量赋值，请使用以下语法：\n\
  \n```\nread var1 var2 var3\n```\n\n使用 `-p` 选项向用户发布提示：\n\n```\nread -p \"Enter your\
  \ name\" name\n```\n\n### 使用命令替换\n\n命令替换是在较大的命令中执行子命令的过程。它通常用于收集数据并将这些数据存储到变量中。例如，以下命令将\
  \ `date` 命令的输出存储到 `$today` 变量中：\n\n```\ntoday=$(date)\n```\n\n可以使用两种方法之一执行命令替换：\n\
  \n*   方法 1：`$(cmd)`\n*   方法 2：``cmd` ``\n\n注意，方法 2 使用的是反引号（也称为“backtick”字符），而不是单引号。两种方法产生相同的结果；但方法\
  \ 1 通常被认为更具“可读性”，因为很难看出单引号和反引号的区别。\n\n### 附加信息\n\n想学习更多关于创建 BASH 脚本的内容？以下是获取额外信息的良好资源：\n\
  \n*   `man bash`：BASH shell 的手册页包含大量关于编写 BASH 脚本的信息。\n*   [`tldp.org`](http://tldp.org)：该网站（遗憾地）大部分过时了。但是有一份名为《高级\
  \ Bash 脚本指南》的优秀文档。点击“Documents”部分下的“Guides”链接并向下滚动直到看到此指南。该指南的作者通常会定期更新。由于指南按发布日期列出，此指南几乎始终位于列表顶部。\n\
  \n### 总结\n\n自动化的关键特性是将命令批量处理成单个可执行文件。脚本语言（如 Python、Perl 和 BASH 脚本）提供了这种强大的功能。在本章中，你学习了创建脚本的基础，主要关注\
  \ BASH 脚本。\n\n#### 关键术语\n\n*   Perl\n*   Python\n*   条件表达式\n*   变量\n\n#### 复习题\n\
  \n1.  **1。** 在像程序一样运行脚本之前，必须向脚本添加 _____ 权限。\n2.  **2。** 使用哪个命令来显示消息？\n    *   `print`\n\
  \    *   `display`\n    *   `show`\n    *   `-echo`\n3.  **3。** `while` 语句要求在以下哪个之后直接跟随一个\
  \ `then` 语句？（选择两个。）\n    *   `if`\n    *   `fi`\n    *   `else`\n    *   `-elif`\n\
  4.  **4。** 使用 _____ 运算符判断一个整数是否小于等于另一个整数。\n5.  **5。** _____ 命令收集用户输入并存储该值。\n\n\n\
  \n\n\n点击此处查看代码图像\n\n```\nlogrotate [-dv] [-f|--force] [-s|--state file] config_file\
  \ ..\n```\n\n注意，我们在讨论系统日志时，将在第 25 章“系统日志”中深入讨论 `logrotate` 命令。此处讨论的目的是收集关于可以创建哪些自动化过程以更好地服务的想法。帮助页中\
  \ `DESCRIPTION` 部分的第一段为每天执行此命令提供了一个绝佳理由：\n\n“logrotate 旨在简化产生大量日志文件的系统的管理。它允许对日志文件进行自动轮转、压缩、删除和邮件发送。每个日志文件可以在每天、每周、每月或在文件过大时进行处理。”\n\
  \n但脚本的其余部分呢？第 4 行引入了你尚未在 BASH 脚本中学习过的新知识：当命令或程序执行结束时，它会向调用程序返回一个退出状态值。这是一个数值，如果命令执行成功则为\
  \ 0，如果命令失败则为正值。该退出状态值存储在 `$?` 变量中。\n\n第 4 行将此值存储在一个名为 `EXITVALUE` 的新变量中，第 5 行包含了你应该已经从第\
  \ 15 章讨论的话题中理解的代码。`if`语句判断 `EXITVALUE` 是否不为 0，如果不为 0，则将执行 `logger` 命令。`logger` 命令是做什么的？\n\
  \n再次查看帮助页：“logger 在系统日志中创建条目。”因此，如果 `logrotate` 命令失败，`logger` 工具将创建一个关于该失败的条目。\n\
  \n第 8 行直接以“成功”返回值 0 退出脚本。\n\n### man-db.cron\n\n这个脚本稍大，因此并不是每一行都会被检查，并使用 `grep`\
  \ 命令过滤掉注释行和空行：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource cron.daily]#grep -v \"\
  ^#\" man-db.cron | grep -v \"^$\" | nl\n     1  if [ -e /etc/sysconfig/man-db ];\
  \ then\n     2      . /etc/sysconfig/man-db\n     3  fi\n     4  if [ \"$CRON\"\
  \ = \"no\" ]; then\n     5     exit 0\n     6  fi\n     7  renice +19 -p $$ >/dev/null\
  \ 2>&1\n     8  ionice -c3 -p $$ >/dev/null 2>&1\n     9  LOCKFILE=/var/lock/man-db.lock\n\
  \    10  [[ -f $LOCKFILE ]] && exit 0\n    11  trap \"{ rm -f $LOCKFILE ; exit 0;\
  \ }\" EXIT\n    12  touch $LOCKFILE\n    13  mandb $OPTS\n    14  exit 0\n```\n\n\
  第 1–3 行使用了一种名为*源化*的功能。如果文件 `/etc/sysconfig/man-db` 存在，则执行它，就像该文件的代码被嵌入此脚本中一样。这通常用于从外部文件导入变量。\n\
  \n第 4–12 行执行了一些对于第 13 行命令能够正确运行所必需的设置任务。这些行中的大部分都很直观易懂（第 9 行创建一个变量，第 12 行创建一个文件，等）。某些命令（如\
  \ `renice` 命令）将在后续章节中介绍。\n\n第 13 行是该脚本的核心。根据帮助页，`mandb` 命令（在帮助页中描述为 `%mandb%`）执行以下操作：\n\
  \n“%mandb% 用于初始化或手动更新通常由 %man% 维护的索引数据库缓存。缓存包含了与帮助页系统当前状态相关的信息，其中存储的信息被 man-db 工具用于以增强其速度和功能。”\n\
  \n为什么这很有用？当你向系统添加和更新软件时，会有新的帮助页被引入。通过每天自动执行此命令，帮助页的功能就得到了优化。\n\n### mlocate\n\n\
  在第 2 章“在命令行上工作”中，你学习了 `find` 命令，它用于根据文件名、所有者、权限和其他文件元数据在实时文件系统中搜索文件。除了 `find` 命令，还有一个名为\
  \ `locate` 的命令也可以查找文件：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource cron.daily]#locate\
  \ motd\n/etc/motd\n/extract/etc/motd\n/usr/lib64/security/pam_motd.so\n/usr/libexec/usermin/caldera/motd\n\
  /usr/libexec/usermin/caldera/motd/images\n/usr/libexec/usermin/caldera/motd/images/icon.gif\n\
  /usr/libexec/webmin/pam/pam_motd.so.pl\n/usr/share/doc/pam/html/sag-pam_motd.html\n\
  /usr/share/doc/pam/txts/README.pam_motd\n/usr/share/man/man8/pam_motd.8.gz\n```\n\
  \n`find` 和 `locate` 命令之间有几处区别，最大的区别是 `locate` 命令并不搜索实时文件系统，而是从每天自动生成的数据库中搜索。这使得\
  \ `locate` 命令比 `find` 命令更快，因为搜索实时文件系统更耗时。\n\n`locate` 命令使用的数据库每天是如何生成的？正如你现在可能猜到的，它就是\
  \ `mlocate` 脚本：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource cron.daily]#nl -ba mlocate\n\
  \     1  #!/bin/sh\n     2  nodevs=$(< /proc/filesystems awk '$1 == \"root\" &&\
  \ $2 != \"rootfs\" { print $2 }')\n     3  renice +19 -p $$ >/dev/null 2>&1\n  \
  \   4  ionice -c3 -p $$ >/dev/null 2>&1\n     5  updatedb\n```\n*注：原始源代码中的代码块示例中包含乱码；我已根据上下文进行了清理，以反映逻辑脚本并保持其结构。*\n\
  \n\n\n\n\n**Julia**: 可能有的。有些代码是你无法合法修改的。在某些情况下，如果你修改了代码并将修改后的版本交给别人，你需要注明原作者。还会有其他可能的限制——这同样取决于应用于代码的许可协议。\n\
  \n**Gary**: 好的，我该如何确定我能做什么呢？\n\n**Julia**: 有时候许可协议就嵌入在代码中，或者至少有一个描述该协议的网站引用。在某些情况下，你可能只需要联系所有者。如果你要在工作中使用这些代码，可能还想咨询你的经理，他们可以咨询公司的法务团队。\n\
  \n**Gary**: 好的。谢谢，Julia！\n\n### 创建你自己的自动化脚本\n\n创建自己的自动化脚本的过程初看起来可能很令人生畏，但在你花时间探索现有示例后，它就会变得简单。以下是创建脚本时的一些建议：\n\
  \n*   注意你例行执行的任务。如果你发现自己自己在反复执行一组相同或相似的系列命令，那么用脚本将这些命令自动化就是有意义的。\n*   系统中是否存在某个命令执行时耗时很长？或者是否存在一个占用大量系统资源（内存、CPU、网络带宽等）的命令？也许该命令应该在半夜无人使用系统时通过\
  \ `cron` 或 `at` 任务执行。\n*   你是否发现组织中的其他用户在使用复杂的命令行工具时感到挣扎？你可以创建一个交互式脚本，提示用户回答问题，然后为运行你脚本的用户执行带有所有复杂选项的正确命令。\n\
  *   需要定期运行关键的安全审计吗？将该审计写成脚本，并将其添加到系统的 `crontab` 文件中。\n*   人们是否忘记参加你的重要周会了？写一个脚本在会议开始前\
  \ 10 分钟自动生成提醒邮件。\n*   想知道周五晚上 8 点有谁登录了系统吗？创建一个 `cron` 任务，运行 `who` 命令并向你发送邮件。\n*\
  \   忘记了定期更新系统上的软件吗？将其制成一个 `cron` 任务，你再也不需要担心它了。\n*   你是否定期备份文件，或者你是否发现自己在几天之后才意识到本该做备份，但现在由于系统崩溃或有人覆盖了你的文件而已经太晚了？请制定一个更好的备份策略。\n\
  \n听起来像是一长串任务，但从大局来看，这些都是小事。你自动化系统的可能性几乎是无限尽的。\n\n### 可能会出现什么问题？\n\n好的，并不是所有事情都应该自动化。例如，如果黑客入侵了你的系统，不要依靠自动化脚本来保护你。某些任务仍然需要人工干预（谢天）。\n\
  \n### 总结\n\n知道如何创建自动化过程只赢了一半。知道你应该自动化什么是另一半。在本章中，我们探索了一些想法和概念，旨在帮助你判断在系统上应该自动化哪些任务。\n\
  \n#### 关键术语\n\n*   `Exit status`\n*   `sourcing`\n*   `repository`\n\n#### 复习题\n\
  \n**[1].** `_____` 脚本轮转、压缩并发送系统日志。\n\n**[2].** 哪些目录包含定期执行的脚本？（选择两个。）\n\n1.  `/etc/cron.d`\n\
  2.  `/etc/crond.minutely`\n3.  `/etc/cron.daily`\n4.  `/etc/cron.hourly`\n\n**[3].**\
  \ 哪个变量用于存储命令的退出状态？\n\n1.  `$!`\n2.  `$$`\n3.  `$^`\n4.  `$?`\n\n**[4].** `_____`\
  \ 命令显示文件，包括行号。\n\n**[5].** 在编码术语中，一个 `_____` 是一个位置。\n\n\n\n\n\n* `/etc/at.deny (-rw-r--r--)`:\
  \ 在大多数系统中，普通用户不需要访问此文件，因此考虑将权限更改为 `-rw------`。\n* `/etc/at.allow (-rw-r--r--)`:\
  \ 在大多数系统中，普通用户不需要访问此文件，因此考虑将权限更改为 `-rw------`。\n* `/usr/bin/crontab (-rwsr-xr-x)`:\
  \ 为了确保除了 root 用户之外的任何用户无法执行 `crontab` 命令，请移除 SUID 权限以及组和其他用户的权限：`-rwx------`**。\n\
  * `/usr/bin/at (-rwsr-xr-x)`: 为了确保除了 root 用户之外的任何用户无法执行 `at` 命令，请移除 SUID 权限以及组和其他用户的权限：`-rwx------`。\n\
  \n* `/etc/anacrontab (-rw-r--r--)`: 在大多数系统中，普通用户不需要访问此文件，因此考虑将权限更改为 `-rw------`。\n\
  \n在为 `crontab` 和 `at` 创建安全策略时，你还应该考虑以下两个额外问题：\n\n* 记住每个系统都有自己的 `crontab` 和 `at`\
  \ 系统。你创建的策略必须考虑不同系统的不同规则。\n* 如果你删除了用户使用 `crontab` 和 `at` 命令的能力，那么该用户现有的 `crontab`\
  \ 和 `at` 任务仍然会执行。禁用访问仅限制用户创建更多 `crontab` 和 `at` 任务的能力。你的安全策略还应该有一个程序，在用户被阻止访问时识别并删除现有任务。\n\
  \n## BASH 脚本的安全\n\nBASH 脚本允许你创建工具。编写 shell 脚本的人通常不会考虑安全性；然而，黑客会利用现有脚本来破坏系统，因此为 BASH\
  \ 脚本制定安全策略是非常重要的。本节概述了在创建 BASH 脚本安全策略时你应该考虑的一些安全特性。\n\n### 脚本的访问\n\n某些脚本旨在为所有人提供工具，但某些是针对特定用户（数据库管理员、系统管理员等）的。仔细考虑你放置脚本的位置，并确保只有授权用户才能访问脚本并具有执行它们的能力。\n\
  \n还要考虑将脚本放置在哪些系统上。将 BASH 脚本放置在公共可访问的系统上，其威胁比放置在内部服务器上更大。\n\n不要允许任何人修改脚本，除非是脚本的所有者。例如，脚本的良好权限设置应该是\
  \ `-rwxr-x---`，而糟糕的权限设置将是 `-rwxrwx---`。第二种权限设置将允许任何组员具有修改脚本内容的能力。\n\n永远不要在 BASH\
  \ 脚本上设置 SUID 或 SGID 权限。了解 BASH 的黑客可以通过从脚本运行额外的命令来利用这一点，这可能提供对黑客通常无法访问的文件的权限。\n\n\
  ### 脚本内容\n\n为了执行脚本，必须为用户开启读取权限。这意味着，与大多数系统二进制命令不同，用户可以看到 BASH 脚本中的所有内容。因此，你应该有一份脚本安全策略，要求所有脚本都不包含任何敏感数据（用户名、密码等）。\n\
  \n在脚本中执行命令时，使用绝对路径更安全。例如，考虑以下情况：\n\n点击此处查看代码\n\n```\n#!/bin/bash\ncd /data\nls -l\
  \ jan_folder\nrm jan_folder/file1\n```\n\n更安全的脚本应该是这样的：\n\n点击此处查看代码\n\n```\n/usr/bin/cd\
  \ /data\n/usr/bin/ls -l jan_folder\n/usr/bin/rm jan_folder/file1\n```\n\n如果你不使用绝对路径，将使用用户的\
  \ `PATH` 变量来确定命令的位置。这可能导致执行错误的命令。例如，黑客喜欢在 `/tmp` 等目录中放置恶意的 `rm`、`ls` 和 `cd` 命令（这些命令将利用或破坏系统）。\n\
  \n### 数据处理\n\n编写 shell 脚本时的一个关注领域是用户数据。这些数据可以通过命令行参数、用户创建的环境变量或通过与用户的交互（例如 `read`\
  \ 命令）收集。在处理用户数据时，考虑以下因素：\n\n* 避免运行基于用户数据的关键命令。例如，不要接受用户提供的值，然后尝试使用该值执行 `passwd`\
  \ 命令。\n* 不要信任环境变量设置是正确的。\n* 对所有用户相关数据进行有效性检查。例如，如果你期望用户提供五位的邮政编码，请验证他们提供的恰好是五位。\n\
  \n### Shell 设置\n\n考虑以下 shell 设置：\n\n* `set -u`: 该设置会导致 shell 脚本在使用未设置的变量时提前退出。\n\
  * `set -f`: 该设置会导致避免通配符的扩展。对于来自用户的数据，通配符扩展可能会成为问题。\n* `set -e`: 该设置会导致脚本在其中任何命令失败时自动退出。\n\
  \n### Shell 风格\n\n虽然这不仅仅是一个基于安全的话题，但你应该考虑查看 Google 的 Shell 风格指南 ([`google.github.io/styleguide/shell.xml`](https://google.github.io/styleguide/shell.xml))。它许多产生更好\
  \ shell 脚本的最佳实践。这也可以导致更安全的代码，因为最佳实践通常意味着你遵循了一套良好的规则，不太可能在代码中创建安全漏洞。\n\n最后，如果你执行其他用户的脚本，请先阅读脚本以确保它执行了正确的命令。对于你在互联网上找到任何脚本都尤其如此。\n\
  \n### 总结\n\n在本章中，你探索了与为自动化工具（`crontab` 和 `at`）和 BASH 脚本创建安全策略相关的多个主题。\n\n#### 复习题\n\
  \n**1.** `/var/spool/cron` 目录的权限应该是 `d____.`。\n\n**2.** 哪个命令将只允许 root 用户能够运行 `crontab`\
  \ 命令？\n\n1. `rm /etc/crontab`\n2. `rm -r /var/spool`\n3. `chmod 0700 /usr/bin/crontab`\n\
  4. `rm /usr/bin/crontab`\n\n**3.** BASH 脚本永远不应具有 _____ 和 SGID 权限。\n\n**4.** 下列哪个会导致脚本在脚本中的命令失败时退出？\n\
  \n1. `set -u`\n2. `set -f`\n3. `set -e`\n4. `set -v`\n\n**5.** 下列哪个会导致 shell 脚本在使用未设置的变量时退出？\n\
  \n1. `set -u`\n2. `set -f`\n3. `set -e`\n4. `set -v`\n\n\n\n\n\n*   第 20 章，“网络服务配置：基本服务”涵盖了配置包括\
  \ DNS、DHCP 和电子邮件服务器在内的若干网络化工具的过程。\n*   第 21 章，“网络服务配置：Web 服务”涵盖了配置包括 Apache Web\
  \ 服务器和 Squid 在内的若干网络化工具的过程。\n*   第 22 章，“连接到远程系统”讨论了如何通过网络连接到远程系统。\n*   第 23 章，“制定网络安全策略”提供了利用你在\
  \ 第 18 章、第 19 章、第 20 章、第 21 章和第 22 章中获得的知识来创建安全策略的方法。\n\n# 第 18 章\n\n## 网络基础\n\n\
  为了正确配置网络、能够排除网络问题并妥善保护网络连接，你需要首先理解一些网络原理。本章的目标是涵盖这些原理。\n\n我们首先从讨论一些网络术语开始，包括主机、IP\
  \ 地址和协议。本章还包含了对子网划分和网络端口的讨论。\n\n请记住，本章重点关注网络的核心要素。网络是一个非常大的话题，整本书都致力于现代网络环境的原理和特征。我们鼓励你学习比本章提供的更多的知识，但从学习\
  \ Linux 和配置 Linux 网络的角度来看，本章的内容为你提供了所需的基础。\n\n阅读本章并完成练习后，你将能够做到：\n\n*   解释基础性的网络术语\n\
  *   定义网络地址，包括子网划分\n*   描述常见的网络端口\n*   识别 IPv4 和 IPv6 之间的主要区别\n*   描述常见的网络协议\n\n\
  ### 网络术语\n\n当两台或更多计算机通过某种连接进行通信时，网络就建立了。这种连接可以通过几种不同的技术创建，包括以太网、光纤和无线。\n\n网络上的每台计算机被称为`主机，它可以包含许多不同的系统，例如台式电脑、笔记本电脑、打印机、路由器、交换机，甚至是手机。尽管本章的重点是运行\
  \ Linux 操作系统的计算机，但你应该将任何在网络上通信的系统视为 `host`。\n\n网络通分为大类：\n\n*   `LAN (局域网)`(part0055.html_gloss110)：这描述直接通信的主机。\n\
  *   `WAN (广域网)`(part0055.html_gloss27)：这描述通过路由器通信的主机集合。\n\n图 18-1\n\n数据位于网络数据包内部。数据必须以接收系统能够理解的格式化。这部分由协议处理。`protocol`(part0055.html_gloss184)\
  \ 是主机之间网络通信的定义良好的标准。例如，Web 服务器通常使用 HTTP (超文本传输协议) 作为客户端主机与服务器之间的通信手段。`server` 是网络上提供服务的机；它向接收者提供服务，接收者被称为\
  \ `client`。这就是为什么当你使用网络浏览器时，通常会输入这样的 Web 地址：`http://www.OneCourseSource.com`。\n\n\
  你可以将子网值比作邮件中的城市、州和邮政编码，它允许邮递员路由到正确的地点。在某种意义上，你也可以将每个城市比作 LAN，将整个国家（甚至是世界）比作 WAN。\n\
  \n子网值与 IP 地址结合时，会创建一个唯一的网络地址。如何实现将在本书稍后部分介绍。你可以将子网值比作封上的名字。\n\n图 18-2\n\n**图 18-2\
  \ 传统邮件**\n\n协议用于网络的更高层级来定义网络操作。例如，回想网络上的每台主机都有一个唯一的 IP 地址（互联网协议地址）。该协议用于确定将信息发送到网络的哪个位置。其他常见的网络协议包括\
  \ TCP（传输控制协议）、UDP（用户数据报协议）和 ICMP（互联网控制消息协议）。关于这些协议的详细细节将在本书稍后部分提供。\n\n**注意**\n\n\
  字面上有成百上种标准协议，在大多数情况下，你不需要担心协议的细节。然而，如果你想学习比书中提供的更多的协议知识，请访问许多描述 RFC（意见征求）的网站之一，例如\
  \ `https://www.rfc-editor.org`。https://www.rfc-editor.org\n\n### IPv4 对比 IPv6\n\n\
  \n\n\n\nIP 的两个不同版本是 `IPv4` 和 `IPv6`。`IPv4` 长期以来一直是互联网上的标准，正逐渐被 `IPv6` 取代。这两个版本之间有许多差异，但详尽讨论超出了本书的范围。相反，我们将考虑其中一个主要差异，并提供一个图表来说明其他一些差异。\n\
  \n要理解这一主要差异，首先请考虑这一点：总共有 4,294,967,296 个可能的唯一 `IPv4` 地址。这看起来可能很多，甚至可能超过了我们可能的需求，但这些\
  \ IP 地址的分类和分配方式导致了可用 IP 地址的短缺，这在 20 世纪 90 年代首次被认识。连接到互联网的每个设备都需要一个唯一的标识符以便正常通信——我们将在后面关于\
  \ `IPv4` 地址如何工作的章节中详细介绍，但现在请记住，曾几何某段时间，我们确实担心 `IPv4` 地址会用尽。\n\n`IPv4` 使用一种名为“点分十进制表示法”（也称为点分隔符）的技术，它将一个\
  \ 32 位数字分为四个字节（octets），产生约 43 亿个可能的 IP 地址。`IPv6` 使用另一种名为“十六进制表示法”的技术，这是一个 128 位数字。这种技术产生了\
  \ 340,282,366,920,938,463,463,374,607,431,768,211,456 `IPv6` 地址（如果这个数字大到无法理解，可以想象成“340\
  \ 万万亿万亿亿”或“现今每个活的人都有数万亿可用地址”）。换句话说，我们现在和可预未来互联网上所有的主机都有足够的 IP 地址。\n\n`IPv6` 比 `IPv4`\
  \ 具有其他优势，如表 18-1 所示。\n\n### 表 18-1 IPv4 和 IPv6 之间的差异\n\n| 差异 | 描述 |\n| --- | ---\
  \ |\n| 地址方案 | `IPv4`: 点分十进制表示法，一个 32 位数字分为四个字节。`IPv6`: 十六进制表示法，一个 128 位数字 |\n| 可用主机数量\
  \ | `IPv4`: 约 43 亿，无额外子网划分。子网划分（Subnetting）是将一个较大的网络划分为较小网络的过程，会导致可用 IP 地址的损失。`IPv6`:\
  \ 比 `IPv4` 多得多——大约 340,000,000,000,000,000,000,000,000,000,000,000,000。可用地址数量不需要子网划分。\
  \ |\n| 路由 | `IPv6` 具有更高效的路由技术。路由是数据包从一个网络移动到另一个网络的方式。 |\n| 自动配置 | `IPv6` 可以配置为自动分配\
  \ IP 地址，类似于 `IPv4` 中的 `DHCP (Dynamic Host Configuration Protocol)`，但不需要 `DHCP` 服务器。`DHCP`\
  \ 提供提供 IP 地址和子网的服务。 |\n| 数据包头部 | 每个网络包都有一个包含该数据包信息的头部。`IPv6` 的头部要灵活得多。 |\n| 安全性\
  \ | `IPv4` 依赖其他协议为网络数据包提供安全性，而 `IPv6` 具有内置安全功能。 |\n\n#### 安全性亮点\n\n`IPv6` 通常被认为更安全，但请记住，如果你在连接到互联网的系统上使用\
  \ `IPv6`，在某个时刻网络包可能会被转换为 `IPv4` 包（通常在离开你的网络后不久）。因此，`IPv6` 提供的安全功能通常在你的组织内部有效。\n\n\
  请注意，表 18-1 并不是 `IPv6` 和 `IPv4` 差异的完整描述，但它应该让你得出一个大致的概念，即 `IPv6` 是一个更好的整体协议。这可能会让你好奇为什么它在“缓慢地”取代\
  \ `IPv4`——顺便说一下，我们指的确实是*缓慢地*。`IPv6` 于 1996 年 1 月引入，到它 20 岁生日时，仅在世界上约 10% 的计算机上启用。更最近的估计显示这一数字已接近\
  \ 25%。\n\n互联网没有完全切换到 `IPv6` 有许多原因，这里是两个最常见的原因：\n\n*   将整个网络从 `IPv4` 切换到 `IPv6` 不是一项轻易的任务。这些协议在许多方面截然不同，因此必须投入大量的精力和工作才能使这种切换顺利且透明地进行。即使你的组织切换到了\
  \ `IPv6`，在某个时刻连接互联网的其他部分时，网络通信必须转换为 `IPv4`，因为互联网大部分仍然在使用 `IPv4`。\n\n*   还记得对 `IPv4`\
  \ 地址用尽的担心吗？这种担心由于一种名为 `NAT (Network Address Translation)` 的 `IPv4` 功能的发而被消除。通过 `NAT`，单个主机（在这种情况下是路由器）可以拥有一个可以在网络上直接通信的\
  \ `IPv4` 地址。路由器连接的 LAN 使用一组 IP 地址（称为私有 IP 地址），这些地址不能直接用于互联网。路由器翻译互联网与内部私网之间所有进入和出的网络包，允许内部私网中的主机通过\
  \ `NAT` 路由器间接访问互联网。今天几乎所有的主机，包括你的手机和家中的设备（如许多平板电视，甚至冰箱），都有内部私有 IP 地址。随着 `NAT` 的广泛采用，`IPv4`\
  \ 地址用尽的担心消失了，因为只需要少数具有活动 IP 地址的路由器即可允许数百个主机间接访问互联网。\n\n由于 `IPv4` 仍然是互联网上的主导协议，本书将关注\
  \ `IPv4` 而非 `IPv6`。然而，你应该了解本章描述的两者之间的差异，并考虑在未来学习更多关于 `IPv6` 的知识。\n\n### IPv4 地址\n\
  \n一个 IPv4 地址由四个用点字符分隔的数字组成（例如，`192.168.100.25`）。每个数字代表一个字节，即可以用二进制值表示的数字，如下：\n\n\
  ```\n11000000.10101000.01100100.00011001\n```\n\n`192` 可以用二进制 `11000000` 表示。\n\n\
  ### 图 18-3 数值的二进制表示\n\n`IPv4` 地址分为若干类，总共有五类。这些类由第一个字节（IP 地址的第一个数字）定义。例如，IP 地址 `192.168.100.25`\
  \ 使用 `192` 值来定义它属于五类中的哪一类。表 18-2 描述了这些标准的 IPv4 地址类。\n\n### 表 18-2 IPv4 类\n\n| 类\
  \ | 描述 |\n| --- | --- |\n| A | `1.x.x.x` 到 `126.x.x.x`。允许 127 个网络，每个网络拥有 1600 万个主机。第一个字节定义网络地址，其余字节定义主机地址。\
  \ |\n| B | `128.x.x.x` 到 `191.x.x.x`。允许大约 16000 个网络，每个网络最多 65000 个主机。 |\n| C | `192.x.x.x`\
  \ 到 `223.x.x.x`。允许大约 200 万个网络，每个网络最多 2540 万个主机。 |\n| D | `224.x.x.x` 到 `239.x.x.x`。仅用于组播组。\
  \ |\n| E | `240.x.x.x` 到 `254.x.x.x`。仅用于研究和开发。 |\n\n因此，一个 `55.x.x.x` A 类网络可以拥有最多\
  \ 1600 万个主机 IP 地址，范围从 `55.0.0.1`（`55.0.0.0` 留给网络本身）到 `55.254.254.254`（技术上最大值是 255，但那些\
  \ IP 地址预留用于向整个网络广播消息）。\n\n\n\n\n\n分配了大型网络（A 类或 B 类，尽管 C 类网络也适用）的组织不希望在单个网络上有数百万甚至数千个主机。子网划分（Subnetting）提供了一种将大型网络划分为较小部分的方法。这是通过使用通常用于主机的\
  \ IP 地址来定义网络地址和广播 IP 地址，从而创建较小的网络（子网）来实现。\n\n你有必要了解子网工作的两种常见网络情况：\n\n* 当一个系统已经有一个\
  \ IP 地址和一个子网地址时，你想知道如何确定所创建的子网。\n* 当你有一个较大的 IP 网络并想知道如何将其划分为较小的网络时。如果你的组织中有若干个较小的物理网络，这一点非常重要，因为每个物理网络必须位于单独的子网上。\n\
  \n在这两种情况下，你都可以自由地使用互联网上提供的许多 IP 地址计算器来帮助你完成这一过程。向你展示如何手动执行这些任务的目的是为了帮助你理解子网划分的工作原理。\n\
  \n### 从 IP 地址和子网确定网络地址\n\n假设你正在使用一个完整的 `192.168.100.0` C 类网络。这意味着前三个字节节 `192.168.100.0`\
  \ 用于网络地址，最后一个可能的 IP 地址是广播地址（`192.168.100.255`），所有其他 IP 地址（`192.168.100.1` 到 `192.168.1.254`）都可以分配给网络上的主机。\n\
  \n也许在一个物理网络中拥有 254 个主机并不符合你的需求，你想将此 C 类网络划分为更小的网络。在在此之前，请通过查看表 18-3 考虑网络最初是如何定义的。\n\
  \n**表 18-3** C 类网络定义\n\n| 类别 | IP 地址 | IP 地址的二进制格式 |\n| --- | --- | --- |\n| 地址\
  \ | 192.168.100.25 | 11000000.10101000.01100100.00011001 |\n| 子网掩码 | 255.255.255.0\
  \ 或 24 | 11111111.11111111.11111111.00000000 |\n| 网络 | 192.168.100.0 | 11000000.10101000.01100100.00000000\
  \ |\n| 广播 | 192.168.100.255 | 11000000.10101000.01100100.00011111 |\n| 第一个 IP |\
  \ 192.168.100.1 | 11000000.10101000.01100100.00010001 |\n| 最后一个 IP | 192.168.100.254\
  \ | 11000000.10101000.01100100.00011110 |\n| 网络中最大主机数 | 254 | |\n\n在表 18-3 中，IP\
  \ 地址同时以点十进制法（`192.168.100.25`）和二进制格式显示。子网掩码以三种格式显示：\n\n* 可变子网掩码 (VLSM)格式：本质上与点十进制格式相同。\n\
  * 无类域间路由 (CIDR) 格式：此值与 VLSM 相同，但描述方式不同。该值是二进制格式中“1”的数量（将它们相加，你将得到表 18-3 中子网掩码的 24\
  \ 个“1”）。\n* 二进制格式：如表 18-3 所示。\n\n要确定 IP 地址的哪部分代表网络，只需查看二进制格式中 IP 地址和子网掩码中均为“1”的所有位。为了方便观察，这在表\
  \ 18-3 中已高亮显示。\n\n该网络中第一个可能的地址定义了网络本身（表 18-3 中的 `192.168.100.0`），该网络中最后一个可能的地址定义了广播地址（表\
  \ 18-3 中的 `192.168.100.255`）。\n\n表 18-3 中的示例非常直观，因为它是标准类之一。查看表 18-4 中的示例，看看不同的非标准子网（`255.255.255.240`）如何影响各种\
  \ IP 地址。\n\n**表 18-4** 非标准子网掩码示例\n\n| 类别 | IP 地址 | IP 地址的二进制格式 |\n| --- | --- |\
  \ --- |\n| 地址 | 192.168.100.25 | 11000000.10101000.01100100.00011001 |\n| 子网掩码 |\
  \ 255.255.255.240 或 28 | 11111111.11111111.11111111.11110000 |\n| 网络 | 192.168.100.0\
  \ | 11000000.10101000.01100100.00000000 |\n| 广播 | 192.168.100.31 | 11000000.10101000.01100100.00001111\
  \ |\n| 第一个 IP | 192.168.100.17 | 11000000.10101000.01100100.00010001 |\n| 最后一个 IP\
  \ | 192.168.100.30 | 11000000.10101000.01100100.00011110 |\n| 网络中最大主机数 | 14 | |\n\
  \n**注意**\n\n理解子网划分可能需要一些时间。\n\n### 私有 IP 地址\n\n如前所述，私有 IP 地址 与 NAT 使用。大多数组织对大多数主机使用私有\
  \ IP 地址，对需要直接访问的系统使用公网 IP。你应该熟悉这些范围：\n\n* 10.0.0.0-10.255.255.255\n* 172.16.0.0-172.31.255.255\n\
  * 192.168.0.0-192.168.255.255\n\n### 常见协议栈\n\n你应该熟悉以下协议栈：\n\n* **IP（网协议）**：该协议负责在主机之间传递网络数据包。它的功能包括路由，或将数据包从一个物理网络发送到另一个网络。网络数据包在到达正确目标之前通常会通过多个路由器转发。\n\
  * **TCP（传输控制协议）（part0055.html_gloss248)**：该协议辅助 IP（网协议），这就是为什么你经常听到 TCP/IP 术语。TCP\
  \ 的设计旨在确保网络包以可靠且有序的方式到达。使用 TCP，数据包是基于连接的，这意味着会进行错误检查以确定数据包在传输过程中是否丢失。如果丢失丢失，将创建并发送替换包。TCP\
  \ 通常比 UDP 慢，因为检查每个数据包需要更多的“工作”。此外，数据包丢失需要重新发送，这可能会影响后续数据包。然而，它比 UDP 更可靠，因为所有数据包都经过了验证。使用\
  \ TCP 的示例是下载软件程序。\n* **UDP（用户数据报协议）（part0055.html_gloss257)**：类似于 TCP，该协议辅助 IP（网协议）。它执行与\
  \ TCP 类似的功能；但数据包是无连接的，这意味着不进行错误检查以确定数据包在传输过程中是否丢失。因此，它比 TCP 快，因为无连接数据传输不需要那么多“工作”。由于缺乏错误检查，它也比\
  \ TCP 不可靠。使用 UDP 的示例是视频直播，偶尔丢失数据包不会对整体数据流产生重大影响。\n\n\n\n\n\n- **ICMP（互联网控制消息协议）**：该协议主要用于发送错误消息以及确定网络设备的状态。它与\
  \ `TCP` 或 `UDP` 的不同在于，它被设计用于发送简单的消息，而不是在设备之间传输数据或建立设备间的连接。ICMP 的用法示例是 `ping` 命令（参见第\
  \ 19 章，“网络配置”），它用于验证是否可以通过网络访问主机。\n\n## 网络端口\n\n`/etc/services` 文件是传统上将服务映射到端口的位置。之所以之所以认为是传统的，是因为从历史角度看，服务程序会查看此文件来确定服务应该使用哪个端口。然而，大多数现代服务在配置文件中都有一个设置，用于确定服务将使用的实际端口。\n\
  \n`/etc/services` 文件对管理员来说仍然有用，因为它包含了由互联网数字分配机构 (IANA) 分配给服务的端口。\n\n该文件中的每行都描述了一个服务到端口的映射。该行的格式如下：\n\
  \n点击此处查看代码图片\n\n```\nservice_name     port/protocol    [alias]\n```\n\n例如：\n\n点击此处查看代码图片\n\
  \n```\n[root@localhost ~]# grep smtp /etc/services\nsmtp            25/tcp     \
  \     mail\nsmtp            25/udp          mail\nrsmtp           2390/tcp     \
  \           # RSMTP\nrsmtp           2390/udp                # RSMTP\n```\n\n表 18-5\
  \ 列出了常用端口和服务的用途。请注意，描述是刻意简短的，要完全理解每个协议需要多得细节。然而，大致了解协议的功能是这里的首要目标。对于这些许多协议，你将在第\
  \ 19 章中接触使用这些协议的软件服务。\n\n### 表 18-5 常用网络端口\n\n| 端口 | 服务 |\n| --- | --- |\n| 20 和\
  \ 21 | FTP（文件传输协议）。用于在主机之间传输文件。 |\n| 22 | SSH（安全外壳)。用于连接远程系统并执行命令。 |\n| 23 | telnet。用于连接远程系统并执行命令。\
  \ |\n| 25 | SMTP（简单邮件传输协议)](part0055.html_gloss51）。用于将主机名转换为 IP 地址。 |\n| 80 | HTTP（超文本传输协议）。用于与\
  \ Web 服务器通信。 |\n| 110 | POP3（邮局协议)](part0055.html_gloss154）。用于同步系统时钟。 |\n| 139 |\
  \ NETBIOS（网络基本输入/输出系统)。用于局域网通信。 |\n| 143 | IMAP（互联网消息访问协议)。用于检索电子邮件。 |\n| 161 &\
  \ 162 | SNMP（简单网络管理协议)。用于收集网络设备的信息。 |\n| 389 | LDAP（轻量级目录访问协议)。用于提供网络信息，如网络账户信息。\
  \ |\n| 443 | HTTPS（加密超文本传输协议)。通过加密消息与 Web 服务器通信。 |\n| 465 | SMTPS（加密简单邮件传输协议)。用于发送加密电子邮件消息。\
  \ |\n| 514 | Syslog（系统日志)。用于向远程系统发送系统日志消息。 |\n| 636 | LDAPS（加密轻量级目录访问协议)。通过加密提供网络信息，如网络账户信息。\
  \ |\n| 993 | IMAPS（加密互联网消息访问协议)。通过加密连接检索电子邮件。 |\n| 995 | POP3S（加密邮局协议)。通过加密连接检索电子邮件。\
  \ |\n\n### 会话式学习™——理解协议\n\n**Gary**: 嘿，Julia。\n\n**Julia**: Gary，你看起来很低落。怎么怎么了？\n\
  \n**Gary**: 我正试着理解所有这些协议。我刚刚开始理解什么是协议，现在又发现有这么多协议在做许多不同的事情。\n\n**Julia**: 即使是经验丰富的管理员也会觉得如此数量的协议让人无从从。也许我可以给你提供一些建议？\n\
  \n**Gary**: 首先，要明白你不必了解每一个协议。每个系统或主机只会只有少数服务，可能只有一个是向网络提供的。例如，一个通过 LDAP 提供账户的服务器不太可能是\
  \ Web 服务器。\n\n**Julia**: 好的，所以我应该关注我将要维护的主机提供的服务，对吧？这是一个非常好的开始。此外，如何配置服务使用该协议以及如何实现安全才是真正重要的。这让我感觉好多了！我曾试着读其中一个，我的头就开始转圈了。\n\
  \n**Julia**: 相信我，你不是唯一经历过这种情况的人！\n\n### 总结\n\n在这一章中，你探索了几个关键网络概念。本章的目标不是让你成为专家，而是向你介绍这些概念，以便配置、维护和安全网络的过程变得更容易。\n\
  \n#### 关键术语\n\n- LAN（局域网)\n- WAN（广域网)\n- 网络数据包\n- 数据包头\n- IP 地址\n- 主机\n- 网络\n- 以太网\n\
  - 光纤\n- 子网\n- 协议\n- 点分进制表示法\n- 十六进制表示法\n- 路由\n- DHCP\n- FTP\n- SSH\n- telnet\n-\
  \ VLSM（变长子网掩码)\n- CIDR（无分类域间路由)\n- NAT（网络地址转换)\n- 私有 IP 地址\n- IP\n- TCP\n- UDP\n\
  - ICMP\n- SMTP\n- DNS\n- HTTP\n- POP3\n- NTP\n- NetBIOS\n- IMAP\n- SNMP\n- LDAP\n\
  - HTTPS\n- SMTPS\n- syslog\n- LDAPS\n- IMAPS\n\n#### 复习题\n\n1. 1 _____ 是两个主机之间网络通信的良好定义标准。\n\
  2. 2 关于 `TCP` 的哪项是正确的？\n   - 它是无连接的。\n   - 它通常比 `UDP` 快。\n   - 它确保数据以可靠的方式到达。\n\
  \   - 它不进行错误检查。\n3. 3 哪种协议设计用于确定网络设备的状态？\n   - `FTP`\n   - `POP3`\n   - `telnet`\n\
