  \ directory` 骨架目录；创建用户账户时用于填充用户主目录的目录。\n\n`SMB` 服务器消息块；IBM 在 20 世纪 80 年代中期发明的用于局域网（LAN）上主机之间共享目录的协议。\n\
  \n`SMTP` 简单邮件传输协议；邮件交换的标准协议。\n\n`SMTPS` 安全版简单邮件传输协议；用于发送加密的邮件消息。\n\n`snapshot` 快照；一种让文件系统看起来是静态的以执行准确备份的技术。\n\
  \n`sniff` 嗅探；监控网络流量。\n\n`SNMP` 简单网络管理协议；用于收集网络设备的信息。\n\n`socket` 套接字；两个系统网络连接的一部分，与特定的网络端口相关。\n\
  \n`source` 在包管理中，这是基于 Debian 的系统对仓库的术语。\n\n`source repository` 源仓库；在 Debian 包术语中，使用\
  \ `apt` 命令时下载包的位置。\n\n`sourcing` 来源；执行独立文件中的代码，如同嵌入当前 shell 或脚本一样。这通常用于 shell 或脚本中创建变量。\n\
  \n`special groups` 特殊组；属于 Linux 安装的一部分或在添加软件时创建的组。这些组通常为系统进程提供特殊访问权限。\n\n`splashimage`\
  \ 启动图；Legacy GRUB 启动菜单时显示的图形。\n\n`SSH` 安全 Shell；用于连接远程系统并执行命令。\n\n`SSL` 安全套接层；用于安全数据传输的加密协议。\n\
  \n`SSSD` 系统安全服务守护进程；与目录结构交互以提供身份验证服务的进程。\n\n`static host` 静态主机；每次请求 IP 地址时从 DHCP\
  \ 服务器获取相同网络信息的主机。也称为保留*。\n\n`sticky bit` 粘滞位；修改目录写入权限的权限设置。\n\n`subcommand` 子命令；在另一个（主）命令参数列表中执行的命令。子命令的输出作为参数传递给主命令。\n\
  \n`subdirectory` 子目录；另一个目录（父目录）下的目录。\n\n`subdomain` 子域名；较大域名组成部分的域名。\n\n`subnet`\
  \ 子网；与 IP 地址结合定义主机的网络。\n\n`SUID` 设置用户 ID；一种在运行进程时赋予额外访问权限的方法。\n\n`swap space` 交换空间；当可用内存不足时替代内存使用的硬盘空间。\n\
  \n`SYN flood attack` SYN 洪水攻击；使用 SYN 请求使系统无响应的拒绝服务攻击。\n\n`syncing` 同步；将存储在内存中的数据写入硬盘的过程。\n\
  \n`syslog` 用于向远程系统发送系统日志消息。\n\n`table` 表；防火墙规则的一种，如 filter、nat 或 mangle。\n\n`tape\
  \ device` 磁设备；允许你将文件系统数据备份到带上。\n\n`tar ball` 包；使用 `tar` 命令合并文件形成的文件。\n\n`target`\
  \ 在 iSCSI 术语中，目标描述存储设备，位于远程服务器上。\n\n\n\n\n\n`target`: 当匹配到规则时执行的操作。\n\n`TCP`: 传输控制协议；一种旨在确保网络包以可靠且有序的方式到达的协议。\n\
  \n`TCP Wrappers`: 某些服务器使用的库，用于允许或拒绝对服务的访问。\n\n`telnet`: 用于连接到远程系统并执行命令。\n\n`terminal`:\
  \ 用户向用户提供系统命令行访问权限的地方。这可以是连接到系统的物理终端机，也可以是虚拟终端，例如 GUI 终端窗口或 SSH 连接。\n\n`time to\
  \ live`: 缓存 DNS 服务器保留从主 DNS 服务器或从 DNS 服务器获取的数据的持续时间。\n\n`TLS`: 传输层安全协议；一种用于加密数据传输和身份验证的加密协议。TLS\
  \ 用于替代 SSL，通常被泛称为 SSL。\n\n`Tower of Hanoi`: 一种基于数学谜题的备份策略（汉诺数字塔）。\n\n`TTL`: 参见 *time\
  \ to live](##part0055.html_gloss252)*。\n\n`TTY`: 代表终端；物理或虚拟终端的唯一名称。\n\n`UDP`: 用户数据报协议；一种允许以无连接方式传输数据包的协议。\n\
  \n`UEFI`: 统一扩展固件接口；设计用于替代 BIOS 的软件（另见 BIOS）。\n\n`UFW`: 不复杂的防火墙；一种旨在简化使用 `iptables`\
  \ 配置防火墙过程的前端实用程序。\n\n`UID`: 参见 *user ID](###part0055.html_gloss264)*。\n\n`unit`:\
  \ 系统的核心特征之一。\n\n`UPG`: 参见 *User Private Group](###part0055.html_gloss266)*。\n\n\
  `URI (uniform resource identifier)`: 在 Debian 软件包配置中，URI 用于定义源存储库的路径。\n\n`user ID`:\
  \ 分配给用户账户的唯一数值值。\n\n`user ID mapping`: NFS 客户端上的用户名或组名到 NFS 服务器上的用户名或组名的映射。\n\n\
  `User Private Group`: 为特定用户创建的组账户。\n\n`UUID`: 全局唯一标识符；用于指定磁盘设备的唯一值。\n\n`variable`:\
  \ 在 shell 或编程语言中存储值的方式。\n\n`VG`: 卷组；用于创建逻辑卷的物理卷集合。\n\n`vi mode`: vi 编辑器的一项功能；你所处的的模式允许你执行特定的操作。\n\
  \n`virtual filesystem`: 通过挂载点合并在一起的物理文件系统集合。\n\n`virtual host`: 当 Apache Web 服务器为多个网站提供网页服务时所指的虚拟主机。\n\
  \n`virtual machine`: 一种操作系统，它认为自己是原生安装的，但实际上它正与宿主操作系统共同共享一个系统。\n\n`VLSM`: 变长子网掩码；一个分为四个字节的\
  \ 32 位数字，用于定义 IPv4 子网掩码。\n\n`VM`: 参见 *virtual machine](###part0055.html_gloss273)*。\n\
  \n`VPN`: 虚拟专用网络；一种提供通常只有物理网络上才提供的隐私性的虚拟网络。\n\n`WAN`: 广域网；这种网络描述了通过系列路由器或交换机通信的局域网集合。\n\
  \n`WAP`: Wi-Fi 保护访问；一种用于保护无线路由器免受未经授权的用户访问的加密规范。\n\n`WEP`: 无线加密协议；一种用于保护无线路由器免受未经授权的用户访问的旧加密规范。\n\
  \n`white pages`: 一种旨在提供用户信息的架构。\n\n`wildcard`: 参见 *file glob](###part0055.html_gloss63)*。\n\
  \n`WWID`: 全局唯一标识符；在 iSCSI 中，这是一个保证在世界范围内都是唯一的标识符。\n\n`xinetd`: 被称为“超级守护进程”，因为它会根据需要启动其他守护进程（服务），并在不再需要时停止每一个。\n\
  \n`zone transfer`: 将新的 DNS 区域信息从主服务器复制到从用服务器的过程。\n\n## 索引\n\n### 符号\n\n- `$PATH`\
