  \ -qa gpg-pubkey`。例如：\n\n[点击此处查看代码图像\n\n```\n[root rpm -qa gpg-pubkey*\ngpg-pubkey-11f63c3\n\
  ...\ngpg-pubkey-11f63c3:150\n```\n\n(注：由于原文中存在大量重复的列表项，在翻译时已保持逻辑一致并精简了冗余展示，以符合文档工程师的易读要求，但核心指令和格式已完整保留。)\n\
  \n\n\n*   在安装新的 RPM 软件包时，`rpm` 命令要求你下载 RPM 文件，或者手动指向一个网络可访问的 RPM 文件。使用 `yum` 命令时，在安装过程中会自动使用远程仓库来下载软件包。\n\
  \n*   当你安装一个具有依赖项的 RPM 软件包，且该依赖包尚未安装时，`rpm` 命令将失败。使用 `yum` 命令时，会自动处理依赖关系，因为该命令会下载并安装所有的依赖包。\n\
  \n*   `yum` 工具是一个名为 Yellowdog Updater (YUP) 的旧包管理工具的重写。事实上，YUM 代表 Yellowdog Updater,\
  \ Modified（修改版 Yellowdog Updater）。Yellowdog 是一个过时的 Linux 发行版的名称。\n\n## 可能出现什么问题？\n\
  \n你可能会遇到“依赖地狱”术术。当你尝试用 `rpm` 命令安装一个 RPM 软件包时，发现该包有依赖项。你找到了这些依赖包并尝试安装它们，结果发现这些包也有依赖项。你可以想象的，这可能会导致一个糟糕的局面：你正试图寻找安装初始包所需的所有依赖。`yum`\
  \ 命令的设计旨在解决大多数此类依赖问题。\n\n## 仓库\n\n仓库（也称为 `repo`）是一个位置，通常是网络可访问的，包含了 RPM 软件包和一个描述这些软件包之间关系的小型数据库。`yum`\
  \ 命令连接到仓库以确定哪些软件包可用。在安装软件包期间，`yum` 命令还会从仓库下载软件包。\n\n仓库可以通过 FTP、HTTP 或 HTTPS 在网络上共享，也可以存储在系统的本地目录（硬盘或可移动介质）中。当通过网络共享仓库时，仓库设置的部分工作是配置\
  \ FTP 服务器或 Web 服务器。详情请参阅第 20 章“网络服务配置：基本服务”以及第 21 章“网络服务配置：Web 服务”，了解如何配置这些服务器的详情。\n\
  \n### 访问仓库\n\n要访问仓库，你需要知道如何配置 `yum` 命令。这是通过 `/etc/yum.conf` 文件和 `/etc/yum.repos.d`\
  \ 目录下的文件实现的。\n\n`/etc/yum.conf` 文件是 `yum` 命令的主要配置文件。例如，请参见示例 26-9。\n\n**示例 26-9**\
  \ `/etc/yum.conf` 文件\n\n点击此处查看代码图像\n\n```\n[main]\ncachedir=/var/cache/yum/$basearch/$releasever\n\
  keepcache=0\ndebuglevel=2\nlogfile=/var/log/yum.log\nexactarch=1\nobsoletes=1\n\
  gpgcheck=1\nplugins=1\ninstallonly_limit=5\nbugtracker_url=http://bugs.centos.org/set_project.php?project_id=23&ref=\n\
  \ http://bugs.centos.org/bug_report_page.php?category=yum\ndistroverpkg=centos-release\n\
  ```\n\n`/etc/yum.conf` 文件的关键设置如表 26-2 所示。\n\n**表 26-2** `/etc/yum.conf` 文件的设置\n\n\
  | 设置 |  |\n| --- | --- |\n| `cachedir` | 下载后存放 RPM 包的目录。 |\n| `logfile` | 包含 `yum`\
  \ 操作的日志文件位置。 |\n| `gpgcheck` | 值为 `1` 表示“执行 `gpg` 检查以确保软件包有效”；值为 `0` 表示“不执行 `gpg`\
  \ 检查”（这可以通过每个仓库配置文件的特定设置来覆盖）。详见下文对 `/etc/yum.repos.d` 目录的描述。 |\n| `assumeyes` |\
  \ 值为 `1` 表示“始终对是/否提示回答‘是’”；值为 `0` 表示“不做任何假设，而是提供提示”。 |\n\n`/etc/yum.repos.d` 目录包含以\
  \ `.repo` 结尾的文件。这些文件用于指定 yum 仓库的位置。每个文件定义定义一个或多个仓库，如图 26-2 所示。\n\n![Image](img/00102.jpeg)\n\
  \n**图 26-2** `/etc/yum.repos.d` 目录下的文件格式\n\n### 创建仓库\n\n创建仓库涉及以下步骤：\n\n1. 创建一个存储软件包的目录。\n\
  2. 将所有软件包复制到此目录。\n3. 运行命令 `createrepo */directory`（将 `*/directory` 替换为你在步骤 1 中创建的目录）。注意，系统默认通常不包含\
  \ `createrepo` 命令。你应该安装 `createrepo` 软件包以获取该命令的使用。\n\n## 使用 yum 命令\n\n`yum` 命令用于从仓库安装软件。它也可用于删除软件。表\
  \ 26-3 突出了主要的 `yum` 命令。\n\n**表 26-3** 主要 `yum` 命令和选项\n\n| 命令/选项 | 描述 |\n| --- |\
  \ --- |\n| `install` | 从仓库安装软件包及其依赖项（例如，`yum install`）。 |\n| `groupinstall` | 从仓库安装整个软件包组（例如，`yum\
  \ groupinstall “Office Suite”`）。 |\n| `update` | 更新指定的软件包。 |\n| `remove` | 删除指定的软件包及其依赖项。\
  \ |\n| `groupremove` | 删除指定的软件包组。 |\n| `list` | 列出软件包，包括已安装和可用的（例如，`yum list`）。\
  \ |\n| `grouplist` | 列出软件包组，包括已安装的；不带参数使用 `grouplist` 可查看列表。 |\n| `info` | 提供特定软件包的信息（例如，`yum\
  \ info zip`）。 |\n| `groupinfo` | 提供特定组的信息。 |\n| `-y` | 自动对任何提示回答“是”（例如，`yum -y install`）。\
  \ |\n\n### 使用 yum 显示软件包信息\n\n使用 `yum` 命令显示软件包，使用 `yum list *item*`。将 `*item*` 替换之一：\n\
  \n* `installed`: 显示系统中安装的所有软件包。\n* `available`: 显示仓库可用但未安装的软件包。\n* `all`: 列出所有软件包，无论是否安装。\n\
  \n你也可以使用通配符（glob 字符）来限制输出。例如，示例 26-10 只显示包名中包含“zip”的软件包。\n\n**示例 26-10** 包含“zip”的软件包\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# yum list installed \"*zip*\"Loaded\
  \ plugins: fastestmirror, langpacks\n * base: mirror.supremebytes.com\n * epel:\
  \ mirror.chpc.utah.edu\n * extras: mirrors.cat.pdx.edu\n * updates: centos.sonn.com\n\
  Installed Packages\nbzip2.x86_64                    1.0.6-13.el7               @base\n\
  bzip2-libs.x86_64               1.0.6-13.el7               @base\ngzip.x86_64  \
  \                   1.5-8.el7                  @base\nperl-Compress-Raw-Bzip2.x86_64\
  \  2.061-3.el7                @anaconda\nunzip.x86_64                    6.0-15.el7\
  \                 @base\nzip.x86_64                      3.0-10.el7            \
  \     @anaconda\n```\n\n\n\n\n`yum` 命令还支持 `search` 功能，它可以匹配包名和摘要中的通配符（glob pattern）。它会尝试在包描述和\
  \ URL（网站链接）中匹配通配符。例如，所有包名、摘要和描述中包含“joe”的软件包都将在示例 26-11 中的命令中显示（搜索词在输出中会被高亮）。\n\n\
  **示例 26-11** *使用 `yum` 命令搜索软件包*\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]#yum\
  \ search joe\nLoaded plugins: fastestmirror, verify\nLoading mirror speeds from\
  \ cached hostfile\n * atomic: www6.atomicorp.com\n * fedora: mirrors.rit.edu\n *\
  \ updates: mirrors.rit.edu\n=============================== N/S matched: joe ===============================\n\
  libjoedog-devel.i686 : Development files for libjoedog\nlibjoedog-devel.x86_64 :\
  \ Development files for libjoedog\njoe.x86_64 : An easy to use, modeless text editor\n\
  jupp.x86_64 : Compact and feature-rich WordStar-compatible editor\njwm.x86_64 :\
  \ Joe's Window Manager\nlibjoedog.i686 : Repack of the common code base of fido\
  \ and siege\nlibjoedog.x86_64 : Repack of the common code base of fido and siege\n\
  texlive-jknapltx.noarch : Miscellaneous packages by Joerg Knappen\n```\n\n你可能会奇怪，为什么在示例\
  \ 26-11 的命令中匹配到了 `jupp.x86_64` 软件包。如果你运行 `yum info jupp.x86_64` 命令，你会发现该命令的输出部分包含了示例\
  \ 26-12 所示的内容。\n\n**示例 26-12** *显示 `yum` 信息*\n\n点击此处查看代码图像\n\n```\nDescription :\
  \ Jupp is a compact and feature-rich WordStar-compatible editor and\n          \
  \  : also the MirOS fork of the JOE 3.x editor which provides easy\n           \
  \ : conversion for former PC users as well as powerfulness for\n            : programmers,\
  \ while not doing annoying things like word wrap\n            : \"automagically\"\
  . It can double as a hex editor and comes with a\n            : character map plus\
  \ Unicode support. Additionally it contains an\n            : extension to visibly\
  \ display tabs and spaces, has a cleaned up,\n            : extended and beautified\
  \ options menu, more CUA style key-bindings,\n            : an improved math functionality\
  \ and a bracketed paste mode\n            : automatically used with Xterm.\n```\n\
  \n### 软件组\n\n`yum` 命令相对于 `rpm` 命令的优点之一可以在仓库（repo）上创建软件组。通过将软件包分组，可以更容易地安装一套或一组软件包。\n\
  \n要显示现有仓库中提供的某些软件组，请使用命令 `yum group list`，如示例 26-13 所示。\n\n**示例 26-13** *`yum group\
  \ list` 命令*\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]#yum group list\nLoaded\
  \ plugins: fastestmirror, verify\nLoading mirror speeds from cached hostfile\n *\
  \ atomic: www6.atomicorp.comyu\n * fedora: mirrors.rit.edu\n * updates: mirrors.rit.edu\n\
  Installed environment groups:\n   Minimal Install\nAvailable environment groups:\n\
  \   GNOME Desktop\n   KDE Plasma Workspaces\n   Xfce Desktop\n   LXDE Desktop\n\
  \   Cinnamon Desktop\n   MATE Desktop\n   Sugar Desktop Environment\n   Development\
  \ and Creative Workstation\n   Web Server\n   Infrastructure Server\n   Basic Desktop\n\
  Installed groups:\n   Development Tools\nAvailable Groups:\n   3D Printing\n   Administration\
  \ Tools\n   Audio Production\n   Authoring and Publishing\n   Books and Guides\n\
  \   C Development Tools and Libraries\n   Cloud Infrastructure\n   D Development\
  \ Tools and Libraries\n   Design Suite\n   Editors\n   Educational Software\n  \
  \ Electronic Lab\n   Engineering and Scientific\n   Fedora Eclipse\n   FreeIPA Server\n\
  \   Games and Entertainment\n   LibreOffice\n   Medical Applications\n   Milkymist\n\
  \   Network Servers\n   Office/Productivity\n   RPM Development Tools\n   Robotics\n\
  \   Security Lab\n   Sound and Video\n   System Tools\n   Text-based Internet\n\
  \   Window Managers\nDone\n```\n\n`yum group list` 命令并没有显示所有的软件组。某些组默认隐藏，可以通过执行\
  \ `yum group list hidden` 命令来查看。该命令的输出太大，无法在书中显示。为了演示使用 `hidden` 选项将显示更多软件组，请查看以下输出：\n\
  \n点击此处查看代码图像\n\n```\n [root@onecoursesource ~]#yum group list | wc -l\n51\n[root@onecoursesource\
  \ ~]#yum group list hidden | wc -l\n142\n```\n\n注意 `wc -l` 将显示上一个命令输出的行数。每一行代表一个软件组（除了几行不包含组名的行），因此\
  \ 142 行对比 51 行意味着，如果不使用 `hidden` 选项，会有大约 90 个额外的软件组未显示。\n\n你可以使用 `yum group info`\
  \ 命令显示有关软件组的信息，如示例 26-14 所示。\n\n**示例 26-14** *`yum group info` 命令*\n\n点击此处查看代码图像\n\
  \n```\n[root@onecoursesource ~]#yum group info \"LibreOffice\"\nLoaded plugins:\
  \ fastestmirror, verify\nLoading mirror speeds from cached hostfile\n * atomic:\
  \ www6.atomicorp.com\n * fedora: mirrors.rit.edu\n * updates: mirrors.rit.edu\n\
  Group: LibreOffice\nGroup-Id: libreoffice\nDescription: Productivity Suite\nMandatory\
  \ Packages:\n   +libreoffice-calc\n   +libreoffice-draw\n   +libreoffice-email\n\
  \   +libreoffice-impress\n   +libreoffice-math\n   +libreoffice-writer\nOptional\
  \ Packages:\n   +libreoffice-base\n   +libreoffice-filter\n   +libreoffice-pyuno\n\
  ```\n\n在下一节中，你将学习如何使用软件包组安装软件包。\n\n### 使用 yum 安装软件\n\n当你使用 `yum` 命令安装软件包时，你可以指定包名、通配符或包内的文件名。例如，示例\
  \ 26-15 展示了通过名称安装 `joe` 软件包。\n\n**示例 26-15** *使用 `yum` 安装软件包*\n\n点击此处查看代码图像\n\n\
  ```\n[root@onecoursesource ~]#yum install joe\nLoaded plugins: fastestmirror, verify\n\
  Loading mirror speeds from cached hostfile\n * atomic: www6.atomicorp.com\n * fedora:\
  \ mirrors.rit.edu\n * updates: mirrors.rit.edu\nResolving Dependencies\n--> Running\
  \ transaction check\n---> Package joe.x86_64 0:3.7-13.fc28 will be installed\n-->\
  \ Finished Dependency Resolution\n\nDependencies Resolved\n\nAdded No new dependencies\
  \ to be installed.\n\n===================================================\nPackage\
  \    Arch         Version              Repository     Size\n===================================================\n\
  Installing:\n joe        x86_64       3.7-13.fc28          fedora         382 k\n\
  \nTransaction Summary\n===================================================\nInstall\
  \  1 Package\n\nTotal size: 382 k\nInstalled size: 1.2 M\nIs this ok [y/d/N]: y\n\
  Downloading packages:\nRunning transaction check\nRunning transaction test\nTransaction\
  \ test succeeded\nRunning transaction (shutdown inhibited)\n  Installing : joe-3.7-13.fc28.x86_64\
  \                                       1/1\n  Verifying  : joe-3.7-13.fc28.x86_64\
  \                                       1/1\n\nInstalled:\n  joe.x86_64 0:3.7-13.fc28\n\
  \nComplete!\n```\n\n在下一个示例中，使用了通配符来匹配包名：`yum install joe*`。\n\n如果你知道某个文件属于该包，可以指定文件名：`yum\
  \ install /bin/joe`。\n\n默认情况下，`yum` 命令会在下载或安装软件包之前提示你。为了避免该提示并自动回答“是”，请对 `yum` 命令使用\
  \ `-y` 选项。\n\n\n\n\n如果你只想下载软件包而不安装任何包，请使用 `--downloadonly` 选项。这会将软件包放置在 `/var/cache/yum`\
  \ 目录下的子目录中（例如，对于 Fedora 的 28 版本，路径为 `/var/cache/yum/x86_64/28`）。这在创建自己的软件源时非常有用，因为它提供了一种下载软件包而无需实际安装的方便方法。\n\
  \n要从组中安装软件包，请使用 `yum group install grpname` 命令（例如，`yum group install \"LibreOffice\"\
  `）。\n\n## 使用 yum 移除软件\n\n使用 `yum remove` 命令来移除软件包。你可以指定包名、通配符（glob）或文件名作为 `yum remove`\
  \ 命令的参数：\n\n*   `yum remove joe`\n*   `yum remove ruby`\n*   `yum remove /usr/bin/ruby`\n\
  \n默认情况下，系统会询问你是否确认要删除该软件包。使用 `-y` 选项自动回答“yes”。\n\n### 可能会出现什么问题？\n\n在结合 `-y` 选项和包含通配符的包参数时，请务必非常小心。你可能会删除比预想多得软件包。\n\
  \n要移除一个软件组，请使用以下语法：`yum group remove grpname`。\n\n## 使用 yum 插件\n\n插件 (Plug-ins)\
  \ 用于为 `yum` 提供更多功能。一些常用的 `yum` 插件示例：\n\n*   `fastmirror`：从镜像列表中找到速度最快的镜像；镜像 是软件源的一个特性，允许软件源将客户端请求分散到不同的系统。\n\
  *   `snapshot`：在更新期间自动对文件系统进行快照；文件系统的快照允许在 `yum` 操作产生问题时恢复文件。\n*   `versionlock`：启用“锁定”软件包的功能；当软件包被锁定时，将不会对该包执行任何更新。\n\
  \n你可以通过执行以下命令显示当前安装的插件：`yum info yum`。此命令会产生大量输出，因此示例 26-16 设计为仅显示一个已安装的插件。\n\n\
  ### 示例 26-16 *显示 yum 插件*\n\n点击此处查看代码\n\n```\n[root@onecoursesource ~]#yum info yum\
  \ | head -n 25\nLoaded plugins: fastestmirror, verify\nLoading mirror speeds from\
  \ cached hostfile\n * atomic: www6.atomicorp.com\n * fedora: mirrors.rit.edu\n *\
  \ updates: mirrors.rit.edu\nInstalled Packages\nName        : yum\nArch        :\
  \ noarch\nVersion     : 3.4.3\nRelease     : 152.fc20\nSize        : 5.6 M\nRepo\
  \        : installed\nFrom repo   : updates\nSummary     : RPM package installer/updater/manager\n\
  URL         : http://yum.baseurl.org/\nLicense     : GPLv2+\nDescription : Yum 是一个可以检查并自动\n\
  \            : 下载和安装更新的 RPM 包的实用。\n            : 依赖项会自动获取并下载，\n            : 在需要时提示用户许可。\n\
  ```\n\n\n\n\n## 1. 包含软件包软件包元数据的 RPM 数据库存储在 `/var/lib/_____` 目录下。\n\n## 2. 哪条命令可以列出所有当前安装的软件包？\n\
  \n1. `rpm -ql`\n2. `rpm -qp`\n3. `rpm -qa`\n4. 以上这些选项均不正确。\n\n## 3. `_____` 命令将在指定的目录中创建一个存储库。\n\
  \n## 4. `rpm` 命令的 `_____` 选项将只升级系统中当前已安装较旧版本的软件包。\n\n1. `-i`\n2. `-F`\n3. `-g`\n\
  4. `-U`\n\n## 5. `yum` 命令的 `_____` 特性将匹配包名和摘要中的 glob 模式。\n\n## 第 27 章\n\n### 基于\
  \ Debian 的软件管理\n\n在第 26 章“基于 Red Hat 的软件管理”中，你学习了如何在使用 RPM 的发行版上管理软件包软件包。另一个流行的包管理系统最初创建于\
  \ Debian Linux，适用于 Ubuntu 和 Mint 等发行版。该包管理系统不使用 `rpm`、`yum` 和 `dnf` 等命令，而是使用 `dpkg`、`apt`、`apt-get`\
  \ 和 `apt-cache` 等命令。\n\n从概念上说，这两个包管理系统非常相似。区别在于每个系统提供的特定命令、选项，以及在某些情况下的功能。本章重点介绍基于\
  \ Debian 的包管理系统，并强调了 Debian 和 Red Hat 软件管理之间的主要区别。\n\n**重要提示**\n\n由于这是本书中涵盖软件包的第二章，因此重点更多在于“如何操作”，而不是软件包管理的理论和概念。请务必回顾第\
  \ 26 章 以获取与理论和概念相关的信息。\n\n在阅读本章并完成练习后，你将能够完成以下操作：\n\n* 使用 `dpkg` 命令查看、安装和删除软件包\n\
  * 为 APT 命令创建软件源\n* 使用 APT 命令查看、安装和删除软件包\n\n### 使用 dpkg 管理软件包\n\n在许多方面，Debian 包管理工具与\
  \ Red Hat 包管理工具非常相似。例如，与 `rpm` 命令等效的命令是 `dpkg` 命令。这两条命令都非常适合显示已安装软件包的信息，以及安装本地下载的包文件。\n\
  \nDebian 包管理器用于许多 Linux 发行版，包括 Debian、Ubuntu 和 Mint。软件包文件以 `.deb` 扩展名发行。\n\n####\
  \ 使用 dpkg 列出软件包信息\n\n要查看当前安装的所有软件包，请使用带有 `-l` 选项的 `dpkg` 命令，如示例 27-1 所示。\n\n**示例\
  \ 27-1** 带有 `-l` 选项的 `dpkg` 命令\n\n点击此处查看代码图片\n\n```\nroot@onecoursesource:~# dpkg\
  \ -l | head\nDesired=Unknown/Install/Remove/Purge/Hold\n| Status=Not/Inst/Conf-files/Unpacked/halF-conf/Half-inst/trig-aWait/Trig-pend\n\
  |/ Err?=(none)/Reinst-required (Status,Err: uppercase=bad)\n||/ Name\nVersion  \
  \                                           Architecture Description\n+++-=========================================-\n\
  ==============================================================-\n================================================================\n\
  ii  account-plugin-aim                        3.8.6-0ubuntu.2\n                \
  \                amd64        Messaging account plugin for AIM\nii  account-plugin-google\
  \                     0.11+14.04.20140409.1-0ubuntu2\n                    all  \
  \        GNOME Control Center account plugin for single signon\nii  account-plugin-jabber\
  \                     3.8.6-0ubuntu.2\n                                amd64   \
  \     Messaging account plugin for Jabber/XMPP\nii  account-plugin-salut       \
  \               3.8.6-0ubuntu.2\n                                amd64        Messaging\
  \ account plugin for Local XMPP\n (Salut)\nii  account-plugin-yahoo            \
  \          3.8.6-0ubuntu.2\n                                amd64        Messaging\
  \ account plugin for Yahoo!\n```\n\n当列出所有软件包时，输出由于格式原因可能较难阅读。查看单个软件包会简单一些，如图 27-1\
  \ 所示。\n\n![Image](img/00103.jpeg)\n\n**图 27-1** `dkpg -l` 命令的输出\n\n图 27-1](#part0045.html_fig27_1)中显示的最后一行第一个字符与\
  \ `Desired=Unknown/Install/Remove/Purge/Hold` 相关。这个 `i` 表示正常（期望）状态。\n\n图 27-1 中显示的最后一行第二个字符与\
  \ `Status=Not/Inst/Conf-files/Unpacked/halF-conf/Half-inst/trig-aWait/Trig-pend`\
  \ 相关。这个 `i` 表示该软件包已安装。\n\n图 27-1 中显示的最后一行第三个字符与 `Err?=(none)/Reinst-required (Status,Err:\
  \ uppercase=bad)` 相关。这个 `i` 表示没有错误。\n\n\n\n\n\n```\nThe output format is selectable\
  \ with the --verify-format option,\nwhich by default uses the rpm format, but that\
  \ might  change  in\nthe  future,  and  as  programs parsing this command output\n\
  should be explicit about the format they expect.\n```\n\n要查看未安装软件包的内容（文件列表），请使用\
  \ `-c` 选项，如 示例 27-3 所示。\n\n### 示例 27-3 *使用 `-c` 选项*\n\n点击此此处查看代码图片\n\n```\nroot@onecoursesource:~#\
  \ dpkg -c /tmp/joe_3.7-2.3ubuntu1_amd64.deb | head\ndrwxr-xr-x root/root       \
  \  0 2014-02-17 14:12 ./\ndrwxr-xr-x root/root         0 2014-02-17 14:12 ./etc/\n\
  drwxr-xr-x root/root         0 2014-02-17 14:12 ./etc/joe/\n-rw-r--r-- root/root\
  \     38076 2014-02-17 14:12 ./etc/joe/jicerc.ru\n-rw-r--r-- root/root     32368\
  \ 2014-02-17 14:12 ./etc/joe/rjoerc\n-rw-r--r-- root/root     32215 2014-02-17 14:12\
  \ ./etc/joe/jstarrc\n-rw-r--r-- root/root      9327 2014-02-17 14:12 ./etc/joe/ftyperc\n\
  -rw-r--r-- root/root     30127 2014-02-17 14:12 ./etc/joe/jpicorc\n-rw-r--r-- root/root\
  \     37722 2014-02-17 14:12 ./etc/joe/joerc\n-rw-r--r-- root/root     34523 2014-02-17\
  \ 14:12 ./etc/joe/jmacsrc\n```\n\n### 安全提示\n\n在安装软件包之前，您应该列出其内容，特别是当是从不太可靠来源获取软件包时。寻找可疑的文件，例如\
  \ `/etc/passwd` 和 `/etc/shadow`。黑客会在软件包中植入恶意文件以破坏系统。\n\n要显示未安装的软件软件包信息，请使用 `-I`\
  \ 选项，如 示例 27-4 所示。\n\n### 示例 27-4 *使用 `-I` 选项*\n\n点击此此处查看代码图片\n\n```\nroot@onecoursesource:~#\
  \ dpkg -I /tmp/joe_3.7-2.3ubuntu1_amd64.deb | head\n new debian package, version\
  \ 2.0.\n size 350818 bytes: control archive=1821 bytes.\n     118 bytes,     7 lines\
  \      conffiles\n    1812 bytes,    34 lines      control\n    1400 bytes,    28\
  \ lines   *  postinst             #!/bin/sh\n     133 bytes,     7 lines   *  postrm\
  \               #!/bin/sh\n     357 bytes,    13 lines   *  preinst            \
  \  #!/bin/sh\n     310 bytes,     9 lines   *  prerm                #!/bin/sh\n\
  \ Package: joe\n Version: 3.7-2.3ubuntu\n```\n\n#### 使用 dpkg 安装软件\n\n使用 `dpkg` 命令安装软件包时，请使用\
  \ `-i` 选项，如 示例 27-5 所示。\n\n### 示例 27-5 *dpkg 命令使用 `-i` 选项*\n\n点击此此处查看代码图片\n\n```\n\
  root@onecoursesource:~# dpkg -i /tmp/joe_3.7-2.3ubuntu1_amd64.deb\nSelecting unselected\
  \ package joe.\n(Reading database ... 177428 files and directories currently installed.)\n\
  Preparing to unpack ...joe_3.7-2.3ubuntu1_amd64.deb ...\nUnpacking joe (3.7-2.3ubuntu)\
  \ ...\nSetting up joe (3.7-2.3ubuntu) ...\nupdate-alternatives: using /usr/bin/joe\
  \ to provide /usr/bin/editor (editor) in auto mode\nProcessing triggers for man-db\
  \ (2.6) ...\n```\n\n您还可以指定一个目录作为 `-i` 选项的参数。如果参数是一个目录，该目录内所有以 `.deb` 结尾的文件都将被安装。\n\
  \n##### 可能会出错的地方\n\n很容易混淆 `-I` 选项（显示软件包信息）和 `-i` 选项（安装软件包）。在这里需要小心，因为这两个选项都用于软件包文件，导致您在只想显示软件包信息时却意外安装了软件包。\n\
  \n#### 使用 dpkg 重配置软件\n\n软件包管理的功能之一是可以在安装（和删除）过程中执行自定义操作。这是通过通常是交互式的脚本实现的。在某些情况下，在软件包安装后再次执行这些脚本是有用的。\n\
  \n例如，`keyboard-configuration` 软件包用于配置默认键盘。如果您决定将系统送到另一个键盘布局不同的国家，那么再次执行该软件包的配置脚本将有用。您可以通过执行\
  \ `dpkg-reconfigure` 命令来实现。图 27-2 展示了执行 `dpkg-reconfigure keyboard-configuration`\
  \ 命令的结果。\n\n![Image](img/00104.jpeg)\n\n**图 27-2 *dpkg-reconfigure keyboard-configuration\
  \ 命令****\n\n##### 可能会出错的地方\n\n使用 `dpkg-reconfigure` 命令时要小心，因为可能会破坏花费时间和精力精调的配置。\n\
  \n#### 从 Debian 软件包提取文件\n\n回想 第 26 章，您可以从不安装软件包的情况下从 RPM 包中提取文件。这对于探索软件包文件（寻找恶意代码）或替换缺失或损坏的系统文件有用。\n\
  \n在 Debian 系统上执行此任务的技术是使用 `dpkg` 命令的 `-x` 选项：\n\n点击此此处查看代码图片\n\n```\nroot@onecoursesource:~#\
  \ mkdir /tmp/joe_files\nroot@onecoursesource:~# dpkg -x /tmp/joe_3.7-2.3ubuntu1_amd64.deb\n\
  /tmp/joe_files\nroot@onecoursesource:~# ls /tmp/joe_files\netc  usr\nroot@onecoursesource:~#\
  \ ls /tmp/joe_files/etc\njoe\nroot@onecoursesource:~# ls /tmp/joe_files/etc/joe\n\
  ftyperc  jicerc.ru  jmacsrc  joerc  jpicorc  jstarrc  rjoer\n```\n\n### 安全提示\n\n\
  由于 `-x` 是 `dpkg` 命令的一个选项，始终担心尝试提取软件包文件时可能会漏掉它。这将导致软件包，如果软件包包含恶意软件，可能会导致严重问题。\n\n\
  #### 使用 dpkg 命令删除软件包\n\n在 Debian 系统上删除软件包有两种方法：\n\n* `dpkg -r pkg_name`：此方法删除软件包，但将其配置文件保留在系统上。\n\
  * `dpkg –P pkg_name`：此方法删除软件包，包括软件包的所有配置文件。\n\n示例 27-6 展示了使用 `dpkg -r` 命令的方法。\n\n\
  ### 示例 27-6 *使用 dpkg -r 命令删除软件包*\n\n点击此此处查看代码图片\n\n```\nroot@onecoursesource:~#\
  \ dpkg -r joe\n(Reading database ... 177514 files and directories currently installed.)\n\
  Removing joe (3.7-2.3ubuntu1) ...\nupdate-alternatives: using /usr/bin/jmacs to\
  \ provide /usr/bin/editor (editor) in auto mode\nupdate-alternatives: using /usr/bin/jpico\
  \ to provide /usr/bin/editor (editor) in auto mode\nupdate-alternatives: using /bin/nano\
  \ to provide /usr/bin/editor (editor) in auto mode\nProcessing triggers for man-db\
  \ (2.6.7.1-ubuntu1) ...\nroot@onecoursesource:~# ls /etc/joe\neditorrc  ftyperc\
  \  jicerc.ru  jmacsrc  joerc  jpicorc  jstarrc  rjoerc\n```\n\n将 示例 27-6 中 `ls`\
  \ 命令的输出与 示例 27-7 中使用 **-P** 选项删除软件包时 `ls` 命令的输出进行比较。\n\n### 示例 27-7 *使用 dpkg -P\
  \ 命令删除软件包*\n\n点击此此处查看代码图片\n\n\n\n\n\n```\nroot@onecoursesource:~# dpkg -P joe\n\
  (Reading database ... 177514 files and directories currently installed.)\nRemoving\
  \ joe (3.7-2.3ubuntu1) ...\nupdate-alternatives: using /usr/bin/jmacs to provide\
  \ /usr/bin/editor (editor) in auto mode\nupdate-alternatives: using /usr/bin/jpico\
  \ to provide /usr/bin/editor (editor) in auto mode\nupdate-alternatives: using /bin/nano\
  \ to provide /usr/bin/editor (editor) in auto mode\nPurging configuration files\
  \ for joe (3.7-2.3ubuntu1) ...\nProcessing triggers for man-db (2.6.7.1-1ubuntu1)\
  \ ...\nroot@onecoursesource:~# ls /etc/joe\nls: cannot access /etc/joe: No such\
  \ file or directory\n```\n\n缺少 `/etc/joe` 目录（`joe` 软件包配置文件的位置）表明这些文件已从系统中移除。\n\n\
  ## 会话式学习™——使用 ping 命令\n\n**Gary**: 嗨，Julia。我刚刚学习了 `dpkg` 命令的 `-r` 和 `-P` 选项，我有一个问题。\n\
  \n**Julia**: 问吧！\n\n**Gary**: 我正在尝试理解为什么我想用其中一个选项而不是另一个。\n\n**Julia**: 啊，这个。使用 `-r`\
  \ 选项的优势是，如果在配置文件中进行了任何自定义，在将来重新安装软件包时仍然可用。\n\n**Gary**: 那么，如果我想以后再次安装该软件包，并且想使用之前的配置文件，我应该使用\
  \ `-r` 选项，对吧？你能给我举个例子吗？\n\n**Julia**: 没问题。假设你有一个配置完全 Web 服务器，但你现在想移除该软件。配置那个 Web\
  \ 服务器花了很长时间，你不想再次做这些工作，也不想从备份中恢复配置。\n\n**Gary**: 好的，那么为什么要用 `-P` 选项呢？\n\n**Julia**:\
  \ 当你确定将来不会再次安装该软件包，或者当你想确保在再次安装软件包时获得一个“干净”的安装时，就可以使用它。\n\n**Gary**: 啊，好的。谢谢你的信息，Julia。\n\
  \n## 使用 APT 管理软件包\n\n高级软件包工具 (APT) 是一系列命令，提供了与 Red Hat 系系统上的 `yum` 或 `dnf` 相同的功能。APT\
  \ 包含了许多工具，但以下是主要的：\n\n* `apt`: 此工具可用于大多数基本的软件包管理命令。\n* `apt-get`: 此工具为更高级的软件包管理操作提供了额外功能。\n\
  * `apt-cache`: 此工具为更高级的操作和软件包查询提供了额外功能。\n\n### APT 仓库\n\n与 `yum` 和 `dnf` 命令一样，APT\
  \ 命令利用从那里下载软件包的仓库。这些仓库在 APT 中被称为 `sources`，它们可以存放在本地驱动器（CD-ROM、USB 驱动器等）上，也可以通过网络提供。\n\
  \n要配置系统以访问 APT 源，你可以编辑 `/etc/apt/sources.list` 文件或位于 `/etc/apt/sources.list.d` 目录下的文件。在某些发行版中，`/etc/apt/sources.list`\
  \ 文件的使用已被弃用，转而使用 `/etc/apt/sources.list.d` 目录中的文件。在这些系统上，`/etc/apt/sources.list`\
  \ 文件可能不存在，或者是一个空文件。\n\n在拥有 `/etc/apt/sources.list` 文件的系统上，它通常是一个文档良好的配置文件。每行定义一个源。`示例\
  \ 27-8` 显示了一些典型的条目（注意，通过 `grep` 命令删除了空行和注释行）。\n\n**示例 27-8** `/etc/apt/sources.list`\n\
  \n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# grep -v \"^$\" /etc/apt/sources.list\
  \ | grep -v \"^#\" | head\ndeb http://us.archive.ubuntu.com/ubuntu/ trusty main\
  \ restricted\ndeb-src http://us.archive.ubuntu.com/ubuntu/ trusty main restricted\n\
  deb http://us.archive.ubuntu.com/ubuntu/ trusty-updates main restricted\ndeb-src\
  \ http://us.archive.ubuntu.com/ubuntu/ trusty-updates main restricted\ndeb http://us.archive.ubuntu.com/ubuntu/\
  \ trusty universe\ndeb-src http://us.archive.ubuntu.com/ubuntu/ trusty universe\n\
  deb http://us.archive.ubuntu.com/ubuntu/ trusty-updates universe\ndeb-src http://us.archive.ubuntu.com/ubuntu/\
  \ trusty-updates universe\ndeb http://us.archive.ubuntu.com/ubuntu/ trusty multiverse\n\
  deb-src http://us.archive.ubuntu.com/ubuntu/ trusty multiverse\n```\n\n`图 27-3`\
  \ 显示了 APT 源配置文件的典型数据字段。\n\n![Image](img/00105.jpeg)\n\n**图 27-3** APT 源配置字段\n\n\
  APT 源配置文件的字段在 `表 27-1` 中有更详细的描述。\n\n| 字段 | 描述 |\n| :--- | :--- |\n| **类型 (Type)**\
  \ | 该字段指示此源中的软件包是是普通软件包 (`deb`) 还是源软件包 (`deb-src`)。 |\n| **源位置 (Source location)**\
  \ | 源的 `URI` 是存储软件包文件的 URL。这可以是网络位置（通过 Web 服务器共享）或本地资源（存放在硬盘上）。 |\n| **发行版 (Suite)**\
  \ | 每个源 URI 可以有多个发行版。suite 的值是 URL 下的子目录。 |\n| **组件 (Component](#part0055.html_gloss32)**\
  \ | 指示此源上有种软件包。有四种常用的组件：**Main (主)**：发行版官方支持。**Restricted (受限)**：发行版官方支持但是闭源的。**Universe\
  \ (宇宙)**：社区支持和维护，但应该是开源的。**Multiverse (多用途)**：社区或发行版均不支持。可能是闭源的，并且可能引起版权和专利问题。 |\n\
  \n在 `图 27-3` 和 `表 27-1` 中描述的 APT 源配置文件使用一种称为“单行”样式。某些发行版使用较新的名为 DEB22 的样式。这种样式的格式如下：\n\
  \n点击此处查看代码图像\n\n```\nTypes: deb-src\nURIs: uri\nSuites: suite\nComponents: [component1]\
  \ [component2] [...]\noption1: value1\noption2: value2\n```\n\n因此，在 `图 27-3` 中描述的单单行样式示例可以使用以下方式用\
  \ DEB22 样式编写：\n\n点击此处查看代码图像\n\n```\nTypes: deb\nURIs: http://us.archive.ubuntu.com/ubuntu/\n\
  Suites: trusty\nComponents: main restricted\n```\n\n两种样式可以使用多种不同的选项。例如，你可以通过以下 DEB22\
  \ 样式指定源的软件包架构：\n\n点击此处查看代码图像\n\n```\nTypes: deb\nURIs: http://us.archive.ubuntu.com/ubuntu/\n\
  Suites: trusty\nComponents: main restricted\nArchitectures: amd64\n```\n\n有许多可能的选项；请参阅\
  \ **sources.list** 手页获取更多详细信息。\n\n### 创建源仓库\n\n以下步骤描述了如何创建源仓库：\n\n1. 安装 `dpkg-dev`\
  \ 软件包（如果尚未安装）。例如：`apt-get install dpkg-dev`。\n\n2. 创建一个目录。例如：`mkdir /var/packages`。\n\
  \n\n\n\n\n3. 将软件包复制到新目录中。这些软件包可以从现有源下载（该技术在本章的稍后部分将介绍），你也可以在 `/var/cache/apt/archives`\
  \ 目录下找到你需要的软件包（这是软件包在安装到本地系统之前下载的存放位置）。\n\n4. 在包含软件包的目录中运行以下命令：`dpkg-scanpackages\
  \ . /dev/null | gzip -9c > Packages.gz`。\n\n### 使用 APT 命令列出软件包信息\n\n要列出所有软件包（包括已安装和可安装的软件包），请使用\
  \ `apt list` 命令，如示例 27-9 所示。\n\n**示例 27-9** *`apt list` 命令*\n\n点击此处查看代码图片\n\n```\n\
  root@onecoursesource:~# apt list | head\n\nWARNING: apt does not have a stable CLI\
  \ interface yet. Use with caution in scripts.\n\nListing...\n0ad/trusty 0.0.15+dfsg-3\
  \ amd64\n0ad-data/trusty 0.0.15-1 all\n0ad-data-common/trusty 0.0.15-1 all\n0ad-dbg/trusty\
  \ 0.0.15+dfsg-3 amd64\n0xffff/trusty 0.6~git20130406-1 amd64\n2ping/trusty 2.0-1\
  \ all\n2vcard/trusty 0.5-3 all\n3270-common/trusty 3.3.10ga4-2build2 amd64\n389-admin/trusty\
  \ 1.1.35-0ubuntu1 amd64\n```\n\n这里是 `apt list` 命令两个两个选项：\n\n*   `--installed`：用于显示当前安装的软件包\n\
  *   `--upgradable`：用于显示已安装且有新版本可用的软件包\n\n`apt` 命令还支持使用搜索词列出软件包。然而，搜索软件包的一种更强大的方法是使用\
  \ `apt-cache` 命令，它提供了一种使用正则表达式搜索软件包的方法：\n\n点击此处查看代码图片\n\n```\nroot@onecoursesource:~#\
  \ apt-cache search \"^joe\"\njoe - user friendly full screen text editor\njoe-jupp\
  \ - reimplement the joe Debian package using jupp\nscheme2c - Joel Bartlett's fabled\
  \ Scheme->C system\n```\n\n考虑使用 `apt` 命令进行简单的软件包列出，并使用 `apt-cache` 命令进行复杂的软件包列出。\n\
  \n要显示特定软件包的信息，请使用 `apt show` 命令，如示例 27-10 所示。\n\n**示例 27-10** *使用 `apt show` 命令列出软件包信息*\n\
  \n点击此处查看代码图片\n\n```\nroot@onecoursesource:~# apt show joe | head -n 16\n\nWARNING:\
  \ apt does not have a stable CLI interface yet. Use with caution in scripts.\n\n\
  Package: joe\nPriority: optional\nSection: universe/editors\nInstalled-Size: 1,345\
  \ kB\nMaintainer: Ubuntu Developers <ubuntu-devel-discuss@lists.ubuntu.com>\nOriginal-Maintainer:\
  \ Josip Rodin <joy-packages@debian.org>\nVersion: 3.7-2.3ubuntu1\nDepends: libc6\
  \ (>= 2.14), libtinfo5\nBreaks: jupp (<< 3.1.18-2~)\nDownload-Size: 351 kB\nHomepage:\
  \ http://joe-editor.sourceforge.net/\nBugs: https://bugs.launchpad.net/ubuntu/+filebug\n\
  Origin: Ubuntu\nAPT-Sources: http://us.archive.ubuntu.com/ubuntu/ trusty/universe\
  \ amd64 Packages\nDescription: user friendly full screen text editor\n Joe, the\
  \ Joe's Own Editor, has the feel of most PC text editors.\n```\n\n**注意**\n\n`apt-cache\
  \ show` 命令提供相似的输出。这两个命令都接受通配符（通配符）作为命令的参数。因此，要显示所有以“vi”开头的软件包，你可以执行 `apt show vi`\
  \ 或 `apt-cache show vi` 命令。\n\n`apt-cache` 命令提供了一个显示软件包依赖项和反向依赖的选项，如示例 27-11 所示。\n\
  \n**示例 27-11** *使用 `apt-cache showpkg` 命令列出依赖信息*\n\n点击此处查看代码图片\n\n```\nroot@onecoursesource:~#\
  \ apt-cache showpkg joe\nPackage: joe\nVersions:\n3.7-2.3ubuntu1 (/var/lib/apt/lists/us.archive.ubuntu.com_ubuntu_dists_trusty_universe_\n\
  binary-amd64_Packages)\n Description Language:\n                 File: /var/lib/apt/lists/us.archive.ubuntu.com_ubuntu_dists_trusty_\n\
  universe\n```\n\n\n\n\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# apt-get download\
  \ joe\nroot@onecoursesource:~# ls /var/cache/apt/archives/j*\n/var/cache/apt/archives/joe_3.7-2.3ubuntu1_amd64.deb\n\
  ```\n\n你可能在好奇软件包组，例如第 26 章中 `yum` 命令提供的那些组。对于 APT 来说，组的工作方式略有不同。在交互式工具 `aptitude`\
  \ 中可以使用组功能，如图 27-4 所示。\n\n![Image](img/00106.jpeg)\n\n**图 27-4** *`aptitude` 工具*\n\
  \n`aptitude` 工具通常默认安装。还有一个名为 `tasksel` 的类似工具可用，但它通常不会默认安装（如果你需要该工具，请运行 `apt-get\
  \ install tasksel`）。请参阅图 27-5 查看 `tasksel` 工具的演示。\n\n![Image](img/00107.jpeg)\n\n\
  **图 27-5** *`tasksel` 工具*\n\n另一个选项是使用 `synaptic` 工具，这是一种基于 GUI 的包管理工具。该工具的示例显示在图\
  \ 27-6 中。\n\n![Image](img/00108.jpeg)\n\n**图 27-6** *`synaptic` 工具*\n\n### 注意\n\n\
  `aptitude`、`tasksel` 和 `synaptic` 工具可用于删除软件包并显示有关软件包的信息（尽管所有工具都可能无法提供软件包的详细信息）。此外，许多发行版都提供独立的基于\
  \ GUI 的包管理工具，因此务必咨询你所在发行版的文档。\n\n### 可能会出现什么问题？\n\n依赖基于 GUI 的包管理工具会限制你在不同系统上执行包管理任务的能力。这些工具通常不会安装在生产系统中，因为\
  \ GUI 本身需要大量的系统资源（内存、CPU 等）。所以，你真的应该将学习重点放在命令行 APT 工具上。\n\n### 使用 APT 命令删除软件包\n\n\
  要删除一个软件包但保留其配置文件，请使用 `apt remove` 或 `apt-get remove` 命令。示例如：\n\n```\napt remove\
  \ joe\n```\n\n若要彻底清除一个软件包（删除所有软件包文件，包括配置文件），请使用 `apt-get purge` 命令，如示例 27-13 所示。\n\
  \n**示例 27-13** *使用 `apt-get purge` 命令彻底清除软件包*\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~#\
  \ apt-get purge joe\nReading package lists... Done\nBuilding dependency tree\nReading\
  \ state information... Done\nThe following packages will be REMOVED:\n  joe\n0 upgraded,\
  \ 0 newly installed, 1 to remove, 587 not upgraded.\nAfter this operation, 1,345\
  \ kB space will be freed.\nDo you want to continue? [Y/n] y\n(Reading database ...\
  \ 17514 files and directories currently installed.)\nRemoving joe (3.7-2.3ubuntu1)\
  \ ...\nupdate-alternatives: using /usr/bin/jmac to provide /usr/bin/editor in auto\
  \ mode\nupdate-alternatives: using /usr/bin/jpico to provide /usr/bin/editor in\
  \ auto mode\nupdate-alternatives: using /bin/nano to provide /usr/bin/editor in\
  \ auto mode\nPurging configuration files for joe (3.7-2.3ubuntu1) ...\nProcessing\
  \ triggers for man-db (2.67) ...\n```\n\n### 额外的 APT 功能\n\n这里是 APT 提供的一些需要的额外功能：\n\
  \n- `apt-get check`：用于检查所有安装软件包是否有损坏的依赖。\n- `apt-get clean`：清除缓存的仓库信息。\n- `apt-get\
  \ autoclean`：移除旧的软件包信息。\n\n### 总结\n\n在本章，你学习了在基于 Debian 的发行版上管理软件包的几种不同方法。你学习了 `dpkg`\
  \ 命令，它主要用于查看软件包信息，但也可以用于简单的安装和删除。你还学习了 APT 命令提供的高级包管理工具，包括从仓库下载软件和处理依赖关系的工具。\n\n\
  #### 关键术语\n\n- 源 (source)\n- URI（统一资源标识符）\n- 组件 (component)\n- 源仓库 (source repository)\n\
  \n#### 复习题\n\n**1](#part0053.html_r27_1)** `dpkg` 命令的 _____ 选项用于显示软件包文件的信息。\n\n\
  **2](#part0053.html_r27_2)** `dpkg` 命令的哪个选项会删除软件包但保留其配置文件？\n   - `-u`\n   - `-r`\n\
  \   - `-P`\n   - `-c`\n\n**3](#part0053.html_r27_3)** `_____` 命令用于为 APT 创建源仓库。\n\
  \n**4](#part0053.html_r27_4)** 以下哪一个不是有效的 APT 命令？\n   - `apt-cache`\n   - `apt-get`\n\
  \   - `apt-install`\n   - `apt-remove`\n\n**5](#part0053.html_r27_5)** `apt list`\
  \ 命令的 _____ 选项将仅显示当前安装在系统上的软件包。\n\n# 第 28 章 系统启动\n\n系统启动是一个相当庞泛的话题，它包含了启动过程中发生的操作。在本章中，你将学习系统启动的不同阶段，包括引导加载程序阶段、内核加载阶段和“init”阶段。\n\
  \n在读完本章并完成练习后，你将能够：\n\n- 描述启动过程的四个阶段\n- 配置 Legacy GRUB 和 GRUB 2\n- 修改内核的关键组件\n-\
  \ 加载和卸载内核模块\n- 修改启动时启用的服务\n\n### 启动过程的阶段\n\nLinux 操作系统的启动过程分为四个主要阶段：\n\n- BIOS/UEFI\
  \ 阶段\n- 引导加载阶段\n- 内核阶段\n- 内核后阶段\n\n### BIOS/UEFI 阶段\n\n当 Linux 系统首次开启时，会启动一个软件程序来引导系统。该软件程序不是\
  \ Linux 的一部分，而是你的系统硬件自带的程序。两种不同类型是 BIOS（基本输入输出系统） 和 UEFI（统一扩展固件接口)。虽然两者执行的任务相似（启动过程），但它们的功能不同并使用不同的接口配置。\n\
  \nBIOS 是两者较旧的一种，并逐渐被淘汰。BIOS 被认为是固件，即嵌入硬件的程序。BIOS 已经存在 30 多年，具有一些局限性，包括它识别的设备、对大启动设备的支持有限以及对分区表的限制。\n\
  \nUEFI 是新的，被认为是 BIOS 的替代品。然而，因为它不是固件而是扩展固件的软件程序，它可以用于带有 BIOS 的系统。UEFI 比 BIOS 有许多优势，包括支持更大的启动分区、从不同设备（RAID、LVM\
  \ 等）读取数据的以及读取基于 GUI 的分区表的能力。\n\n### 引导加载阶段\n\n引导加载程序是操作系统提供的一个软件程序，设计用于访问硬盘上的文件（特别是内核）并启动操作系统的引导。多种引导加载程序可用，包括\
  \ LILO（全称为 Linux Loader，一种本书中将不会介绍的旧引导加载程序）、GRUB 2 和传统的 GRUB（统一引导加载程序）。\n\n\n\n\n\
  \n`引导程序`可以安装在硬盘（常见）或 USB 驱动器（罕见）等设备上。如果安装在硬盘上，引导程序通常存储在一个名为主引导记录 (MBR)的特殊位置，这是硬盘开头的一个预留位置（具体来说是启动磁盘的前\
  \ 215 字节）。分区表也恰恰存储在此处。\n\n在某些情况下，引导程序可能存储在分区的第一个扇区，通常当系统中安装了多个引导程序时如此。在可移动设备上存储引导程序很罕见，但这样做可以实现更灵活的启动（可以在不同的可移动设备上，如\
  \ USB 闪存盘，安装不同的引导程序）。\n\n通常，引导程序是在启动过程中安装的，但引导程序可能会损坏并需要重新安装。要安装引导程序，请执行 `grub-install`\
  \ 命令并提供要安装 GRUB 的设备。例如，以下命令将 GRUB 安装在第一块 SATA 硬盘上：\n\n```\ngrub-install /dev/sda\n\
  ```\n\n关于配置和使用 GRUB 2 以及 Legacy GRUB 的更多细节将在本章后面的部分出现。\n\n## 内核阶段\n\n引导程序加载内核并将启动过程的控制权交给内核。在内核阶段，内核会进行自我配置并加载内核模块。通常，这包括以下任务：\n\
  \n1. 配置系统以便能够开始为软件分配内存地址。\n2. 探测硬件并执行配置操作。\n3. 解压 `initrd` 或 `initramfs` 镜像；这些文件包含启动时所需的内核模块。\n\
  4. 初始化元设备，如 LVM 和 RAID 设备。\n5. 以只读方式挂载根文件系统。\n6. 启动内核后阶段，包括启动一个完成剩余系统启动的程序。\n\n\
  管理员通常不会对内核阶段做太多的修改。你可以通过重新编译内核或从引导程序向内核传递参数来更改内核的行为。这在本章稍后的 GRUB 部分中会讨论。\n\n你应该了解\
  \ `initrd` 和 `initramfs` 镜像的功能。默认情况下，Linux 内核相当小，而内核模块（作为独立的软件组件）为内核提供了更多功能。通常，Linux\
  \ 内核默认启用的内核模块较少。在挂载文件系统之前的启动过程中，通常需要额外的模块。这些额外的模块存储在压缩文件中，即 `initrd` 或 `initramfs`。\n\
  \n这两者中较旧的是 `initrd`，它正在被 `initramfs` 取代。`initrd` 的缺点之一是它的镜像基于文件系统（如 `ext2`），这需要内核原生启用文件系统支持。`initrd`\
  \ 的另一个缺点是它必须被视为磁盘设备，这需要在内存中对 I/O 操作缓冲（这是多余的，因为 `initrd` “磁盘”实际上已经加载到了内存中）。\n\n如果你的系统使用\
  \ `initrd`，可以使用 `mkinitrd` 命令生成新的 `initrd` 文件。如果你的系统使用 `initramfs`，请使用 `dracut`\
  \ 命令创建新的 `initramfs` 文件。你很少这样做，因为安装程序创建的 `initrd` 或 `initramfs` 文件应该可以正常工作。只有当你添加了初始启动需要的新设备时，才需要创建一个新的\
  \ `initrd` 或 `initramfs` 文件。关于此主题的更多细节可以在本章后面找到。\n\n## 内核后阶段\n\n一旦内核完成了所有任务，它就会启动一个完成操作系统启动的进程。内核启动哪个进程取决于你正在使用哪种\
  \ Linux 发行版。现代 Linux 系统通常使用三种启动技术：SysVinit、systemd 和 Upstart。大多数现代系统使用 systemd。\n\
  \n## GRUB\n\nLegacy GRUB 已经存在多年，曾被誉为旧引导程序技术（如 LILO）的绝佳替代品。然而，随着硬件变得越来越复杂，Legacy\
  \ GRUB 开始出现。\n\nGRUB 2 的开发是为了克服 Legacy GRUB 的局限性。以下是几个关键区别：\n\n* GRUB 2 支持 UUID（通用唯一标识符），它比物理地址更可靠。\n\
  * GRUB 2 支持 LVM 和 RAID 设备。\n* GRUB 2 支持更多的操作系统。\n* 配置文件有所不同。\n\n### Legacy GRUB\
  \ 配置\n\n由于主流发行版不再使用 Legacy GRUB，练习本章中的主题可能会有些挑战性。Legacy GRUB 的主配置文件是 `/boot/grub/grub.conf`\
  \ 文件，如示例 28-1 所示。\n\n**示例 28-1：`/boot/grub/grub.conf` 文件**\n\n```\n[root@onecourses]#\
  \ more grub.conf\n# grub.conf generated by anaconda\n# Note that you do not have\
  \ to rerun grub after making changes to this file\n# NOTICE:  You have a /boot partition.\
  \ This means that\n#          kernel and initrd paths are relative to /boot/, eg.\n\
  #          root (hd0,0)\n#          kernel /vmlinuz-version root=/VolGroup00/Log00\n\
  #          initrd /initrd-version.img\n#boot=/dev/sda\ndefault=0\ntimeout=5\nsplashimage=(hd0,0)/splash.xpm.gz\n\
  hiddenmenu\ntitle CentOS (2.6.18-406.el5)\n        root (hd0,0)\n        kernel\
  \ /vmlinuz-2.6.18-406.el5 root=/VolGroup00/Log00 rhgb quiet\n        initrd /initrd-2.6.18-406.el5.img\n\
  title CentOS (2.6.18-398.el5)\n        root (hd0,0)\n        kernel /vmlinuz-2.6.18-398.el5\
  \ root=/VolGroup00/Log00 rhgb quiet\n        initrd /initrd-2.6.18-398.el5.img\n\
  ```\n\n该文件的第一部分包含 Legacy GRUB 的通用配置信息。表 28-1 描述了这些配置设置中常见的。\n\n**表 28-1：常见的 Legacy\
  \ GRUB 配置设置**\n\n| 设置 | 描述 |\n| --- | --- |\n| **default** | 表示在达到超时值之前未选择标题时，启动哪个标题。标题按照它们在文件中出现的顺序进行编号，第一个标题分配数值\
  \ 0，第二个标题分配数值 1，依此类推。 |\n| **timeout** | 表示一个以秒为单位的等待时间，等待用户选择一个要启动的标题。如果在在此超时期间未选择任何标题，将使用默认标题。在此期间，会显示倒计时器。\
  \ |\n\n\n\n\n\n| splashimage | “splashimage”是在显示旧版 GRUB 启动菜单时显示的图形。它必须是特定的文件类型，限制为\
  \ 14 色、640×480 分辨率，且扩展名为 `.xpm.gz`（`.xpm`是一种特定的图形格式，`.gz` 是 gzipped 压缩文件）。 |\n|\
  \ `hiddenmenu` | 此设置没有赋值的值。如果存在此设置，则不显示 GRUB 菜单，只显示倒计时器。如果按下键盘上的按键，倒计时将结束并显示菜单。\
  \ |\n\n每个标题部分由几行组成：\n\n点击此处查看代码图像\n\n```\ntitle CentOS (2.6.18-406.el5)\n    root\
  \ (hd0,0)\n    kernel /vmlinuz-2.6.18-406.el5 ro root=/dev/VolGroup00/LogVol00 rhgb\
  \ quiet\ninitrd /initrd-2.6.18-406.el5.img\n```\n\n表 28-2 描述了 `title` 部分的设置。\n\n\
  ### 表 28-2 旧版 GRUB `title` 设置\n\n| 设置 | 说明 |\n| --- | --- |\n| `title` | 此设置的值将在启动过程中显示在\
  \ GRUB 菜单中。通常这包括分发行版的名称和内核版本，但也可以进行修改以提供任何信息。 |\n| `root` | 描述包含启动文件的设备（内核文件和 initrd\
  \ 文件）。值 `(hd0, 0)` 指向该设备上的硬盘和分区。更多细节请参见此表后的后续内容。 |\n| `kernel` | 这是要加载的内核的位置，相对于\
  \ `root` 参数指定的设备。除了内核位置外，还可以添加值，这些值将在内核启动时传递给内核。例如，`ro` 告诉内核将根文件系统挂载为只读。此外，`root=/dev/VolGroup00/LogVol00`\
  \ 告诉内核根文件系统的位置（在本例中为 LVM 设备）。值 `quiet` 告诉内核不要显示详细的启动信息，值 `rhgb` 告诉内核使用红帽图形启动功能（在启动期间提供漂亮的进度条，而不是显示启动信息）。你可以传递给内核的几十种其他可能的值。\
  \ |\n| `initrd` | 这是 `initrd` 文件的位置，相对于 `root` 参数指定的设备。 |\n\n`root` 参数指定的设备可能会引起混淆。请记住，Linux\
  \ 中的分区通常被称为设备文件（例如，`/dev/hda1`）。\n\n通常，硬盘要么是 IDE（`/dev/hda`、`/dev/hdb` 等），要么是 SATA（dev/sda`、`/dev/sdb`）。设备由字母表示（a\
  \ = 第一个，b = 第二），分区从 1 开始编号（`/dev/hda1`、`/dev/hda2` 等）。\n\nGRUB 中的命名约定有所不同。IDE 和\
  \ SATA 驱动器之间没有区别。所有驱动器都是“hd”。驱动器分配数字而不是字母（`0=/dev/da`，`1=/dev/db`）。分区从 0 开始编号，这是设备文件的标准做法。因此，你可能称为\
  \ `/dev/sda1` 的设备在旧版 GRUB 中是 `(hd0, 0)`。`/dev/sdb2` 设备在旧版 GRUB 中是 `(hd1, 2)`。\n\n\
  你可能想知道在这个文件中更改什么。考虑以下场景：\n\n- 系统位于一个不安全的地方，你希望限制某人在启动过程中更改 GRUB 的能力。实现这一点的一种方法是将超时值更改为\
  \ `0`。GRUB 将自动并立即使用默认标题。这看起来可能是一件危险的事情，因为你无法中断启动过程，但请记住你可以从外部设备启动。这一步的意义在于你的系统在物理上是不安全的，目标是使其难以执行备用启动。\n\
  - 你可能发现了一个想要启用的有用内核参数。在这种情况下，你会将此参数添加到标题的内核行（kernel line）中。\n- 如果系统是你正在其上测试新功能（如重新编译内核）的实验机器，在启动过程中查看详细的内核消息可以帮助你排除可能出现的问题。从标题中删除\
  \ `quiet` 和 `rhgb` 参数以启用详细信息。\n\n### 安全亮点\n对于物理上不安全的系统，将 GRUB 超时值设置为 `0` 是一个很好的安全措施，因为它减少了某人在启动过程中破坏系统的机会。以下是你应该应该采取的其他步骤：\n\
  \n- 移除任何外部驱动器和端口，例如 CD-ROM 驱动器和 USB 端口。\n- 为 BIOS 设置密码以防止从其他设备启动。\n- 在机箱上加锁，使硬盘无法被拆卸并在不同的系统中运行。\n\
  - 为 GRUB 设置密码（此方法将在稍后介绍）。\n\n#### 在启动期间更改旧版 GRUB\n\n在启动过程中，你可以执行更改系统启动方式的操作。这些操作包括：\n\
  \n- 选择一个备用标题进行启动\n- 修改标题的参数\n- 通过 GRUB 命令行执行 GRUB 命令\n\n最常见的任务是选择一个备用标题启动。当 GRUB\
  \ 菜单出现后，使用方向键选择一个标题，并在准备好启动系统时按下 `Enter` 键。参见图 28-1 允许你选择标题的屏幕示例。\n\n![Image](img/00109.jpeg)\n\
  **图 28-1** 旧版 GRUB 标题\n\n有两种方法修改标题的参数。一种技术是使用 `e` 命令在启动前编辑标题。大多数情况下，你正在更改内核行，因此另一种使用\
  \ `a` 命令修改内核参数的技巧可能更有用。参见图 28-2 使用 `e` 命令编辑标题的示例。\n\n![Image](img/00110.jpeg)\n\
  **图 28-2** 编辑旧版 GRUB 标题\n\n注意，当你在编辑标题时，使用方向键移动到要编辑的行。一旦在目标行上，使用 `e` 命令编辑该行。参见图 28-3\
  \ 编辑标题内行的示例。\n\n![Image](img/00111.jpeg)\n**图 28-3** 编辑旧版 GRUB 标题行\n\n更改后，按下 `Enter`\
  \ 返回上一个屏幕。按下 `Esc` 键取消所有更改。返回上一个屏幕后，使用 `b` 命令使用自定义标题参数启动系统。\n\n最后，你可以通过使用 `c` 命令简单地执行\
  \ GRUB 命令。如果你这样做，将得到一个 `grub>` 提示符，可以在其中执行 GRUB 命令。\n\n你需要记住的最有用 GRUB 命令之一是 `help`。该命令显示所有可能的\
  \ GRUB 命令，如图 28-4 所示。\n\n![Image](img/00112.jpeg)\n**图 28-4** 获取帮助\n\n#### 在旧版 GRUB\
  \ 中进入单用户模式\n\n恭喜你！你公司的系统管理员去了另一份工作，你被提升到了这个职位。这对你来说是令人兴奋的一天，你渴望给老板留下深刻印象。第一个任务：更新公司\
  \ Web 服务器上的软件（这是一个本该几个月前就完成的任务）。\n\n\n\n\n\n1. 首先启动系统，并在 GRUB 菜单出现后按下键盘上的任意键。现在，编辑\
  \ GRUB 标题屏幕上的第一个标题，在内核参数末尾添加一个 `s`。请参考图 28-5 示例。\n\n    ![Image](img/00113.jpeg)\n\
  \n    **图 28-5** *编辑内核行*\n\n2. 按 `Enter` 接受更改，然后使用 `b` 命令启动系统。系统将启动到单用户模式，并自动以 root\
  \ 身份登录，而无需询问任何密码。\n\n3. 一旦出现 shell 提示符，只需执行 `passwd` 命令即可更改 root 密码。请参考图 28-6 示例。\n\
  \n    ![Image](img/00114.jpeg)\n\n    **图 28-6** *在单用户模式下更改 root 密码*\n\n4. 修改 root\
  \ 密码后，你可以重启系统或按 `Ctrl+D` 继续启动系统到默认运行级别。\n\n### 注意\n\n上一个示例适用于使用 Legacy GRUB 的旧系统。新系统可能需要更复杂的命令序列来重置\
  \ root 密码。\n\n### 加固 Legacy GRUB\n\n你刚刚克服了作为系统管理员的第一道障碍！正当你在心里拍拍自己时，突然意识到了一个心惊的现实：尽管你的\
  \ Web 服务器在物理上是安全的，但其他几个关键服务器位于公共可以访问的区域。什么能防止别人走到其中一台机器前，并使用相同的技术“恢复”root 密码呢？\n\
  \n幸运的是，有一种技术可以防止他人访问单用户模式。你可以为 GRUB 分配密码，防止用户在不知道 GRUB 密码的情况下修改标题。\n\n加固 GRUB 的第一步是生成一个\
  \ MD5 加密密码。虽然你可以使用明文密码，但加密密码密码更安全。请注意 Legacy GRUB 配置文件的权限：\n\n点击此处查看代码图像\n\n```\n\
  [root@onecoursesource ~]# ls -l /boot/grub/grub.conf\n-rw------- 1 root root 760\
  \ Oct  9 23:38 /boot/grub/grub.conf\n```\n\n好消息是，只有 root 用户可以查看此文件的内容。GRUB 密码在此文件中，因此你可能认为明文密码已经足够安全。然而，如果你正在编辑此文件，别人可以在你的屏幕上看到它（记住，这个系统在物理上可能并不安全）。因此，加密密码真的是最好的。\n\
  \n要创建加密密码，请执行 `grub-md5-crypt` 命令，如下：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# grub-md5-crypt\nPassword:\nRetype password:\n$1$KGnIT$FU80Xxt3lJlqU6FD104QF/\n\
  ```\n\n接下来，在 `/boot/grub/grub.conf` 文件的标题部分上方添加类似如下的行：\n\n点击此处查看代码图像\n\n```\npassword\
  \ --md5     $1$KGnIT$FU80Xxt3lJlqU6FD104QF/\n```\n\n**注意**\n\n如果你将密码设置放在标题区域内，它将防止别人在不知道密码的情况下启动到该标题。\n\
  \n`/boot/grub/grub.conf` 文件现在看起来应该像示例 28-2 所示。\n\n**示例 28-2** *修订后的 `/boot/grub/grub.conf`\
  \ 文件*\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# more /boot/grub/grub.conf\n\
  # grub.conf generated by anaconda\n#\n# 注意，在对此文件进行更改后，不需要重新运行 grub\n# 告：你有一个 /boot\
  \ 分区。这意味着\n#          所有内核和 initrd 路径都是相对于 /boot/，例如：\n#          root (hd0,0)\n\
  #          kernel /vmlinuz-version ro root=/dev/VolGroup00/LogVol00\n#         \
  \ initrd /initrd-version.img\nboot=/dev/sda\ndefault=0\ntimeout=5\nsplashimage=(hd0,0)/grub/splash.xpm.gz\n\
  hiddenmenu\npassword --md5 $1$KGnIT$FU80Xxt3lJlqU6FD104QF/\ntitle CentOS (2.6.18-406.el5)\n\
  \        root (hd0,0)\n        kernel /vmlinuz-2.6.18-406.el5 ro root=/dev/VolGroup00/LogVol00\
  \ rhgb quiet\n        initrd /initrd-2.6.18-406.el5\ntitle CentOS (2.6.18-406.el5)\n\
  \        root (hd0,0)\n        kernel /vmlinuz-2.6.18-406.el5 ro root=/dev/VolGroup00/LogVol00\
  \ rhgb quiet\n        initrd /initrd-2.6.18-406.el5\n```\n\n首先启动系统，并在 GRUB 菜单出现后按下键盘上的任意键。现在，编辑\
  \ GRUB 标题屏幕上的第一个标题，在内核参数末尾添加一个 `s`。请参考图 28-5 示例。\n\n![Image](img/00113.jpeg)\n\n\
  **图 28-5** *编辑内核行*\n\n系统将启动到单用户模式，并自动以 root 身份登录，而无需询问任何密码。\n\n`root=/dev/VolGroup00/LogVol00`\n\
  `initrd /initrd-version.img`\n\n### Legacy GRUB 2\n\n新系统可能需要更复杂的命令序列来重置 root 密码。\n\
  \n#### GRUB 2 配置\n\n`/boot/grub/grub.conf` 文件现在看起来应该像示例 28-2 所示。\n\n**示例 28-2**\
  \ *修订后的 `/boot/grub/grub.conf` 文件*\n\n#### `/etc/default/grub`\n\n对于更现代的系统，`/etc/default/grub`\
  \ 文件显示了一个示例。\n\n**示例 28-3** *`/etc/default/grub` 文件*\n\n```\n[root@onecoursesource\
  \ ~]# more /etc/default/grub\n...\nGRUB_DEFAULT=0\nGRUB_HIDDEN_TIMEOUT_QUIET=true\n\
  GRUB_TIMEOUT=10\nGRUB_DISTRIBUTOR=\"'lsb_release -i -s 2> /dev/null || echo Debian'\"\
  \nGRUB_CMDLINE_LINUX_DEFAULT=\"quiet splash\"\nGRUB_CMDLINE_LINUX=\"\"\n...\n```\n\
  \n\n\n\n\n此文件包含许多以 shell 变量形式存在的设置。表 28-3 描述了你可能在 `/etc/default/grub` 文件中更改的常用设置。\n\
  \n#### 表 28-3 常见的 `/etc/default/grub` 设置\n\n| 设置 | 描述 |\n| --- | --- |\n| `GRUB_DEFAULT`\
  \ | 此项可以设置为代表默认启动标题的数字。第一个标题由 0 表示，第二个为 1，以此此类推。使用数字可能会很麻烦，因为标题的顺序可能会变化。这将在章稍后的部分进行详细讨论。此值也可以设置为\
  \ `saved`，这样 GRUB 就会记住上次选择的标题。这需要同时设置 `GRUB_SAVEDEFAULT` 参数。 |\n| `GRUB_SAVEDEFAULT`\
  \ | 如果设置为 `true` 且 `GRUB_DEFAULT` 设置为 `saved`，则 GRUB 会记住上次选择的标题，并将其标记为下次启动的默认值。\
  \ |\n| `GRUB_TIMEOUT` | 在启动到默认标题之前等待的秒数。值为 -1 将无限期等待。 |\n| `GRUB_TIMEOUT_STYLE`\
  \ | 如果设置为 `hidden`，则在超时倒计时期间不显示标题菜单。 |\n| `GRUB_CMDLINE_LINUX` | 这包含要添加到内核命令行中的值，用于向内核传递参数（例如\
  \ `quiet` 和 `rhgb`）。这将添加到每个标题中。 |\n| `GRUB_CMDLINE_LINUX_DEFAULT` | 通常为每个内核创建两个标题：一个普通标题和一个用于进入单用户模式的恢复标题。此设置将内核参数添加到普通标题中，而不是恢复标题。\
  \ |\n\n##### 保存 GRUB 2 更改\n\n如果你对 `/etc/default/grub` 文件进行了更改并重启机器，你会发现这些更改不会立即影响\
  \ GRUB 2。你首先需要运行一个命令，该命令获取 `/etc/default/grub` 文件中的值（以及来自 `/etc/grub.d` 目录下文件的值）并创建一个新的\
  \ GRUB 2 配置文件。\n\n在基于 Red Hat 的系统上，执行 `grub2-mkconfig` 命令。在基于 Debian 的系统上，执行 `update-grub`\
  \ 命令。\n\n**注意**\n\n在执行相应的命令更新 GRUB 2 配置文件后，你可以在 `grub.cfg` 文件（位于 `/boot/grub` 或\
  \ `/boot/grub2` 目录）查看这些更改。你会发现这不是典型的 Linux 配置，而更像是一个脚本。你可能会想要编辑此脚本，但如果你这样做了，那么你的更改将在下次执行\
  \ `grub2-mkconfig` 或 `update-grub` 命令时丢失（例如，在安装新内核时可能会发生这种情况）。\n\n##### GRUB 2 标题\n\
  \n创建和指定 GRUB 2 标题稍微有点复杂。例如，你可以通过将 `/etc/defaults/grub` 文件中的 `GRUB_DEFAULT` 参数设置为数值来设置默认标题。但是，你如何确定哪个标题是第一个，哪个是第二个，以此此类推呢？你可以重启机器并查看标题的顺序，但这并没有解决另一个问题：当你的内核更新或手动添加额外标题时，该顺序可能会发生。\n\
  \n当你执行 `grub2-mkconfig` 或 `update-grub` 命令时，它会探测系统内核并在 `grub.cfg` 文件中创建 `menuentry`\
  \ 设置。其中一个条目的示例如图 28-8 高亮部分所示，供演示。\n\n![Image](img/00116.jpeg)\n\n**图 28-8** `grub.cfg`\
  \ 中的 `menuentry` 设置\n\n根据 `grub.cfg` 文件中 `menuentry` 组的顺序，你可以确定分配给 `GRUB_DEFAULT`\
  \ 的正确数值。只需意识到系统的某些更改（例如安装新内核）会导致这些 `menuentry` 组产生新的顺序。因此，使用与 `menuentry` 关联名称可能更好，例如：\n\
  \n点击此处查看代码\n\n```\nGRUB_DEFAULT=\"'CentOS Linux (3.10.0-229.11.1.e;7.x86.64) 7 (Core)\"\
  '\n```\n\n如果你想创建自己的自定义标题，请在 `/etc/grub.d/40_custom` 文件添加条目。该条目与 `grub.cfg` 文件中的\
  \ `menuentry` 相同，因此你可以复制并粘贴其中一个示例来创建自己的。在修改 `/etc/grub.d/40_custom` 文件后，记得运行 `grub2-mkconfig`\
  \ 或 `update-grub` 命令。\n\n##### 在 GRUB 2 中启动到单用户模式\n\n在本章前面，你学习了如何在使用 Legacy GRUB\
  \ 系统的系统中启动到单用户模式以恢复 root 密码。如果你的系统使用 GRUB 2 作为启动系统，过程将有所不同。\n\n步骤 1：启动系统到单用户模式。在\
  \ GRUB2 菜单处，按 `e` 编辑选定的条目。找到以 `linux` 开头的行并在行尾添加 `init=/bin/sh`。按 `Ctrl+x` 启动。\n\
  \n步骤 2：进入 shell 提示符后，使用 `passwd` 命令设置 root 密码。\n\n步骤 3：重启系统。\n\n\n\n\n为了理解 Linux\
  \ 内核，最好先说明内核不是什么。内核并不是单一的、巨大的程序。相反，内核由一个核心程序和一组较小的程序组成，这些小程序被称为内核模块或 `LKMs`（可加载内核模块），它们可以根据需要加载和卸载。\n\
  \n回想，内核执行着多项关键系统任务，包括管理硬件设备，如硬盘、网卡和蓝牙设备。为了管理这些每一个硬件设备，内核需要在内存中有一个相应的程序（称为 `driver`\
  \ 或 `module`）。然而，很少有需要将所有内核模块都存在内存中的情况。因此，这些模块通常在需要时才加载到内存中。\n\n例如，如果你有一台台式机或服务器，你可能没有蓝牙设备，因为这些设备通常只出现在笔记本电脑上。对于这些系统，将蓝牙模块加载到内存中没有任何意义。这不仅会导致可用\
  \ RAM 减少，而且如果加载所有内核模块，系统启动可能会慢得多。\n\n本章稍后会提供有关这些模块如何加载和卸载的更多细节。但是，在开始修改内核之前，理解模块是非常重要的。\n\
  \n## 内核文档\n\n如果你计划修改内核或编译自定义内核，你真的需要访问内核文档。可以在以下几个位置找到它们：\n\n*   `/usr/src/linux/Documentation`\
  \ 目录：对于较旧版本的内核（通常是 3.0 版本之前），文档与内核源码文件一起安装。内核源码文件是你编译自定义内核时使用的文件。要获取源文件（以及文档），你需要安装\
  \ `kernel-devel` 包。\n*   `/usr/share/doc/kernel-doc*/Documentation` 目录：对于较新版本的内核（通常是\
  \ 3.0 版本之后），文档文件不再与源代码捆绑。要获取文档，你需要安装 `kernel-doc` 包。\n*   `https://www.kernel.org/doc`\
  \ 网站：你也可以从 `kernel.org` 网站访问内核文档。\n\n好消息是 Linux 内核是有文档的！坏消息是它的组织并不很好。例如，如果你查看 `Documentation`\
  \ 目录，你会看到一组名为 `magic-number.txt`、`zorro.txt` 和 `bt8xxgpio.txt` 等命名的文本文件（不，我们没有胡造这些名字）。如果你还不熟悉\
  \ `grep` 命令，现在是时候尝试一下了，因为该命令将是你寻找所需内容的最强大助手。内核文档中包含海量信息，你只需要耐心找到你所需的内容。\n\n## 调优内核\n\
  \n在现实世界中，你需要学习如何利用内核文档。为了让你了解这些信息可以提供什么，我们将介绍位于 `/proc/sys` 目录下的一个功能。\n\n如果你查看 `/proc/sys`\
  \ 目录，你会看到如下目录：\n\n```\n[root@onecoursesource sys]$ ls\ncrypto  debug  dev  fs  kernel\
  \  net  sunrpc  vm\n```\n\n这些目录每一个都包含文件（和子目录），你可以使用它们来修改内核的行为，而无需重新编译。例如，如果你查看 `/proc/sys/fs`\
  \ 目录，你会看到一堆文件，其中一个名为 `file-max` 的：\n\n```\n[root@onecoursesource fs]$ ls\naio-max-nr\
  \    dir-notify-enable  inode-nr          leases-enable  overflowuid\naio-nr   \
  \     epoll              inode-state       mqueue         quota\nbinfmt_misc   file-max\
  \           inotify           nr_open        suid_dumpable\ndentry-state  file-nr\
  \            lease-break-time  overflowgid\n[root@onecoursesource fs]$ more file-max\n\
  49305\n```\n\n你可能会好奇这个文件意味着什么。问题的答案可以在 `/usr/share/doc/kernel-doc-2.6.32/Documentation/sysctl/fs.txt`\
  \ 文件找到：\n\n“`file-max` 中的值表示 Linux 内核分配的最大文件句柄（file-handles）数量。当你收到大量关于文件句柄的错误信息时，你可能想要增加此限制。”\n\
  \n`file-handle` 是分配给打开的文件的标识符，例如，当进程打开一个文件进行读取或写入时。因此，在上例中，该系统在任何时刻可以打开的文件最大值为 49,305，这就是存储在\
  \ `file-max` 文件中的值。你可以通过更改 `file-max` 文件中的值来临时更改此值：\n\n```\n[root@onecoursesource\
  \ fs]$ echo 60000 > file-max\n[root@onecoursesource fs]$ more file-max\n60000\n\
  ```\n\n在本章稍后的部分，你将看到如何使此更改永久生效。\n\n## 内核镜像\n\n到目前，你应该已经意识到内核实际上是一组组合在一起的软件部分。内核的核心是一个较小的程序，功能并不多。为了能够执行更高级的任务，内核需要内核模块的增强。\n\
  \n内核模块与内核合并有两种主要方法。第一种方法称为 `LKMs`（可加载内核模块）。即内核模块与内核处于独立的文件，并在需要时加载到内存中。LKMs 可以在启动过程的内核阶段加载到内存，也可以在之后需要时加载。\n\
  \n第二方法是创建一个包含核心内核以及必要的内核模块的内核。内核与模块合并的结果是一个名为 `kernelimage` 的文件。Linux 中使用了不同类型的内核镜像，但这里是最常见的两种：\n\
  \n*   `zImage`：在基于 Intel 的硬件架构上，前 640KB 的 RAM 被称为*low 内存*（low memory）。旧系统要求内核存储在低内存中，因此\
  \ `zImage` 是限制在 512KB 的压缩内核镜像（这是压缩后的镜像大小），以便内核能够放入低内存中。\n*   `bzImage`：低内存限制不再是一个因素，因为大多数系统允许内核存储在*高内存*（high\
  \ memory，即 1MB 以上的内存）中。这是幸运的，因为大多数内核镜像的远大于 512KB。`bzImage` 类型专为大于 512KB 的内核镜像设计。\n\
  \n注意：有些人人会告诉你 `bzImage` 中的 “bz” 代表 `bzip2` 压缩。这是错误的。在内核 2.6.30 之前，镜像通常使用 `gzip`\
  \ 工具进行压缩，从 2.6.30 开始，镜像使用 `bzip2` 工具进行压缩。`bzImage` 术语实际上代表“big zImage”（大 zImage）。\n\
  \n内核镜像文件通常采用以下格式命名：`vmlinuz-*version*.*arch***.\n\n\n\n\n`vmlinuz` 只是告诉你它是一个内核映像。它可能是\
  \ `zImage` 或 `bzImage` 文件。你可以通过对该文件执行 `file` 命令来判断它是哪种类型：\n\n点击此处查看代码\n\n```\n[root@onecoursesource\
  \ ~]# file /boot/vmlinuz-2.6.32-573.el6.x86_64\n/boot/vmlinuz-2.6.32-573.el6.x86_64:\
  \ Linux kernel x86 boot executable\nbzImage, version 2.6.32-573.el6.x86_64 (mockbuil,\
  \ RO-rootFS, swap_dev 0x4,\nNormal VGA\n```\n\n你可能通过文件大小判断出 `zImage` 文件应该小于 512KB，因此下面的文件显然是一个\
  \ `bzImage` 文件，因为其大小很大：\n\n点击此处查看代码\n\n```\n[root@onecoursesource ~]# ls -lh  /boot/vmlinuz-2.6.32-573.el6.x86_64\n\
  -rwxr-xr-x. 1 root root 4.1M Jul 23 09:13 /boot/vmlinuz-2.6.32-573.el6.x86_64\n\
  ```\n\n镜像文件名中的 `version` 部分通常包含基础内核版本（此例中为 `2.6.32.573`）和发行版版本（此例中为 `el6`）。文件名中的\
  \ `arch` 部分指定了构建内核的架构。值 `x86` 表示 Intel 32 位架构及兼容架构，而 `x86_64` 表示 Intel 64 位架构及兼容架构。\n\
  \n## 内核模块\n\n在大多数情况下，你不需要担心内核模块，因为这些模块通常会自动为你进行维护。如果需要某个模块，在几乎所有情况下，它会自动加载到内存中。而且，由于模块很小，它们很少需要从内存中卸载。\n\
  \n有时，你可能想调整模块的使用方式。许多模块具有 `parameters`（有时称为 `options`），可以用于调整模块的行为。\n\n### 模块文件\n\
  \n模块存储在 `/lib/modules` 目录下。每个内核在 `/lib/modules` 目录下都有自己的子目录：\n\n点击此处查看代码\n\n```\n\
  [root@onecoursesource ~]# ls /lib/modules\n2.6.32-573.7.1.el6.x86_64  2.6.32-573.el6.x86_64\
  \  2.6.32.68\n```\n\n当你处理模块时，选择正确的子目录非常重要。此时 `uname` 命令就很有用，因为它的输出可以你当前正在使用哪个内核：\n\
  \n点击此处查看代码\n\n```\n[root@onecoursesource ~]# uname -a\nLinux localhost.localdomain\
  \ 2.6.32-573.7.1.el6.x86_64 #1 SMP Tue Sep 22\n22:00:00 UTC 2015 x86_64 x86_64 x86_64\
  \ GNU/Linux\n```\n\n典型的 `/lib/modules/*kernel_version` 目录的内容看起来如 示例 28-5 所示。\n\n\
  **示例 28-5** `/lib/modules/kernel_version` 目录内容\n\n点击此处查看代码\n\n```\n[root@onecoursesource\
  \ 2.6.32-573.7.1.el6.x86_64]# pwd\nlib/modules/2.6.32-573.7.1.el6.x86_64\n[root@onecoursesource\
  \ 2.6.32-573.7.1.el6.x86_64]# ls\nbuild              modules.drm\nextra        \
  \      modules.ieee1394map  modules.symbols\nkernel             modules.inputmap\
  \     modules.symbols\nmisc               modules.isapmap    modules.usb\nmodules.alias\
  \      modules.modesetting  source\nmodules.alias.bin  modules.networking   updates\n\
  block              modules.ofmap        vdso\ndep                modules.pcimap\n\
  pcimap               modules.seriap\n```\n\n你不需要担心此目录中的所有文件，但有几个是你应该的。模块存储在 `kernel`\
  \ 目录下的子目录中：\n\n点击此处查看代码\n\n```\n[root@onecoursesource kernel]# pwd\n/lib/modules/2.6.32-573.7.1.el6.x86_64/kernel\n\
  [root@onecoursesource kernel]# ls\narch  crypto  drivers  fs  kernel  mm  net  sound\n\
  ```\n\n这些子目录提供了将模块分类的方法。例如，所有文件系统模块都位于 `/lib/modules/*kernel_version*/kernel/fs`：\n\
  \n点击此处查看代码\n\n```\n[root@onecoursesource fs]# pwd\n/lib/modules/2.6.32-573.7.1.el6.x86_64/kernel/fs\n\
  [root@onecoursesource fs]# ls\nautofs4     configfs  exportfs  fat      mbcache.ko\
  \  nfs\nbtrfs       cramfs    ext2      fscache  squashfs\ndlm         fuse    \
  \  nfs_common  ubifs\necryptfs    ext4      gfs2     lockd        udf\n```\n\n如果你以后需要手动将模块复制到系统中，确切知道模块的存储位置是非常重要的。通常，额外的模块是通过软件工具安装的，但有时你会将这些模块复制到系统。\n\
  \n复制模块后，执行 `depmod` 是关重要的。`depmod` 命令探测 `/lib/modules/*kernel_version*/kernel` 下的所有模块，并生成\
  \ `/lib/modules/*kernel_version*/modules.dep` 和 `/lib/modules/*kernel_version*/map`\
  \ 文件。\n\n`modules.dep` 文件很重要，因为它包含了所有内核模块和依赖项的列表。依赖是指一个模块需要另一个模块才能成功工作。例如，考虑 示例\
  \ 28-6 中的输出。\n\n**示例 28-6** `modules.dep` 文件\n\n点击此处查看代码\n\n```\n[root@onecoursesource\
  \ 2.6.32-573.7.1.el6.x86_64]# head modules.dep\nkernel/arch/x86/kernel/cpu/mcheck/mce-inject.ko:\n\
  kernel/arch/x86/kernel/cpu/cpufreq/powernow-k8.ko:\nkernel/drivers/cpufreq/freq_table.ko\
  \ kernel/arch/x86/kernel/cpu/cpufreq/mperf.ko\nkernel/arch/x86/kernel/cpu/cpufreq/mperf.ko:\n\
  kernel/arch/x86/kernel/cpu/cpufreq/acpi-cpufreq.ko:\nkernel/drivers/cpufreq/freq_table.ko\
  \ kernel/arch/x86/kernel/cpu/cpufreq/mperf.ko\nkernel/arch/x86/kernel/cpu/cpufreq/pcc-cpufreq.ko:\n\
  kernel/arch/x86/kernel/cpu/cpufreq/stepstep-lib.ko:\nkernel/arch/x86/kernel/cpu/cpufreq/p4-clockmod.ko:\n\
  kernel/drivers/cpufreq/freq_table.ko kernel/arch/x86/kernel/cpu/cpufreq/stepstep-lib.ko\n\
  kernel/arch/x86/kernel/cpu/cpufreq/intel_pstate.ko:\nkernel/arch/x86/kernel/cpu/cpufreq/test_nx.ko:\n\
  kernel/arch/x86/kernel/cpu/cpufreq/microcode.ko:\n```\n\n第一行列出了模块 `mce-inject.ko`，由于冒号后面没有任何内容，它没有依赖项。在第二行中，你可以看到\
  \ `powernow-k8.ko` 模块依赖 `freq_table.ko` 模块。\n\n**注意**\n\n`depmod` 命令只对当前内核执行。如果你需要\
  \ `depmod` 为另一个内核创建适当的文件，请将内核名称作为参数：\n\n点击此处查看代码\n\n```\n[root@onecoursesource ~]#\
  \ depmod 2.6.32.68\n```\n\n### 列出已加载的模块\n\n当模块加载到内存时，你可以在 `lsmod` 命令的输出中看到它。请参考\
  \ 示例 28-7 查看 `lsmod` 命令的输出。\n\n**示例 28-7** `lsmod` 命令\n\n点击此处查看代码\n\n```\n[root@onecoursesource\
  \ ~]# lsmod | head\nModule                  Size  Used by\nfuse                \
  \   79892  2\nvboxsf                 37663  0\nautofs4                27000  3\n\
  8021q                  20362  0\ngarp                    7152  1 8021q\nstp    \
  \                 2218  1 garp\nllc                     5418  2 garp,stp\nipt_REJECT\
  \              2351  2\nnf_conntrack_ipv4       9154  2\n```\n\n输出包含三列：\n\n*   第一列（**Module**）列出内存中的模块名称。注意模块文件名略有不同，因为文件名包含扩展名，例如\
  \ `.ko`。\n\n\n\n\n\n*   第二列（`Size`）是模块以字节为单位的大小。通常模块很小，不占用多少内存。\n*   最后一列（`Used\
  \ by`）是有多少个“东西”正在使用该模块。这些东西可以是进程、其他模块或内核本身。如果这些是其他模块，`lsmod` 命令的输出将列出这些模块的名称。只有当第三列的值为\
  \ 0 时，你才能从内存中卸载模块，这意味着它目前没有被使用。\n\n## 将模块加载到内存\n\n在向你展示如何将模块加载到内存之前，我们首先向你展示一个示例，说明你很少这样做。大多数情况下，模块是按需加载到内存中的。例如，查看以下命令的输出：\n\
  \n点击此处查看代码\n\n```\n[root@onecoursesource ~]# lsmod | grep fat\n[root@onecoursesource\
  \ ~]#\n```\n\n如你所见，内存中没有名为“fat”的模块。`fat` 模块是读取 FAT（文件分配表）文件系统所需的模块之一（一种基于 Windows\
  \ 文件系统，你可以在 USB 盘等移动设备上找到它）。当前挂载的文件系统中没有 FAT 文件系统，因此不需要将此模块加载到内存中。\n\n在示例 28-8 中，你可以看到带有\
  \ FAT 文件系统的 USB 盘插入系统时，系统日志文件中发生了什么。\n\n**示例 28-8 添加 USB 盘时的系统日志文件条目**\n\n点击此处查看代码\n\
  \n```\n[root@onecoursesource linux-2.6.32.68]# tail /var/log/messages\nNov  9 22:22:04\
  \ localhost kernel: USB Mass Storage support registered.\nNov  9 22:22:05 localhost\
  \ kernel: scsi 7:0:0:0: Direct-Access     Generic  Flash Disk\n      8.07 PQ: 0\
  \ ANSI: 2\nNov  9 22:22:05 localhost kernel: sd 7:0:0:0: Attached scsi generic sg6\
  \ type 0\nNov  9 22:22:05 localhost kernel: sd 7:0:0:0: [sdf] 7831552 512-byte logical\
  \ blocks:\n (4.00 GB/3.73 GiB)\nNov  9 22:22:05 localhost kernel: sd 7:0:0:0: [sdf]\
  \ Write Protect is off\nNov  9 22:22:05 localhost kernel: sd 7:0:0:0: [sdf] Assuming\
  \ drive cache: write through\nNov  9 22:22:05 localhost kernel: sd 7:0:0:0: [sdf]\
  \ Assuming drive cache: write through\nNov  9 22:22:05 localhost kernel: sdf: sdf1\n\
  Nov  9 22:22:05 localhost kernel: sd 7:0:0:0: [sdf] Assuming drive cache: write\
  \ through\nNov  9 22:22:05 localhost kernel: sd 7:0:0:0: [sdf] Attached SCSI removable\
  \ disk\n```\n\n该设备被系统识别，然后发生了若干操作。其中一个操作是为 USB 盘创建一个设备文件。USB 盘还会自动挂载。你可以根据示例 28-9\
  \ 所示的 `mount` 命令输出的最后一行看到这一点。\n\n**示例 28-9 mount 命令**\n\n点击此处查看代码\n\n```\n[root@onecoursesource\
  \ linux-2.6.32.68]# mount\n/dev/mapper/VolGroup-lv_root on / type ext4 (rw)\nproc\
  \ on /proc type proc (rw)\nsysfs on /sys type sysfs (rw)\ndevpts on /dev/pts type\
  \ devpts (rw,gid=5,mode=620)\ntmpfs on /dev/shm type tmpfs (rw,root=\"system_u:object_r:tmpfs:s0\"\
  )\n/dev/sda1 on /boot type ext4 (rw)\nnone on /proc/sys/fs/binfmt_misc type bfmt_misc\
  \ (rw)\ngvfs-fuse-daemon on /root/.gvfs type fuse.gvfs (rw,nodev)\n/dev/sdf1 on\
  \ /media/CENTOS63 type vfat (rw,nodev,helper=udisks,uid=0,shortname=mixed,dmask=077,utf8=1)\n\
  ```\n\n注意文件系统类型：`vfat`。`vfat` 文件系统是 FAT 文件系统的几种变体之一。在没有加载适当模块到内存的情况下，内核是如何识别此文件系统并挂载\
  \ USB 设备的？因为它在内核尝试挂载文件系统时已经加载到内存中了。正如从以下命令的输出所示，`vfat` 模块现在已加载：\n\n点击此处查看代码\n\n\
  ```\n[root@onecoursesource ~]# lsmod | grep fat\nvfat                   10584  1\n\
  fat                    54992  1\n```\n\n`vfat` 模块第三列中的值 `1` 表示有一个东西正在使用该模块。在这种情况下，这个“东西”就是挂载进程。卸载该文件系统，你会发现该值降到了\
  \ `0`：\n\n点击此处查看代码\n\n```\n[root@onecoursesource ~]# umount /media/CENTOS63\n[root@onecoursesource\
  \ ~]# lsmod | grep fat\nvfat                   10584  0\nfat                   \
  \ 54992\n```\n\n正如上一个示例所示，内核通常能够自动将模块加载到内存。但你真的想手动加载 `vfat` 模块。可以使用两个命令：`insmod`\
  \ 命令（“硬方法”）和 `modprobe` 命令（“软方法”）。\n\n如果你使用 `insmod` 命令，你需要提供模块的完整路径（注意，在执行此命令之前，模块会先从内存中卸载，该过程将在稍后介绍）：\n\
  \n点击此处查看代码\n\n```\n[root@onecoursesource ~]# insmod /lib/modules/2.6.32-573.7.1.el6_86_64/kernel/fs/fat/vfat.ko\n\
  insmod: error inserting '/lib/modules/2.6.32-573.7.1.el6_86_64/kernel/fs/fat/vfat.ko':\
  \ -1 Unknown symbol in module\n```\n\n遗憾的是，有时命令会失败，如从上一个命令的输出所示。这个“Unknown symbol\
  \ in module”（模块中未知符号）错误是因为 `vfat` 模块有一个依赖模块。你怎么知道哪个依赖模块？通过查看 `/lib/modules/kernel-version*/modules.dep`\
  \ 文件，如下：\n\n点击此处查看代码\n\n```\n[root@onecoursesource ~]# grep vfat /lib/modules/2.6.32-573.7.1.el6_86_64/modules.dep\n\
  kernel/fs/fat/vfat.ko: kernel/fs/fat/fat.ko\n```\n\n所以，如果你先加载 `fat` 模块，然后就可以加载 `vfat`\
  \ 模块。当然，你首先需要检查 `fat` 模块是否有任何依赖（后续示例中的第一个 `lsmod` 命令仅仅是为了验证这些模块没有被加载到内存中）：\n\n点击此处查看代码\n\
  \n```\n[root@onecoursesource ~]# lsmod | grep fat\n[root@onecoursesource ~]# grep\
  \ fat.ko /lib/modules/2.6.32-573.7.1.el6_86_64/modules.dep\nkernel/fs/fat/vfat.ko:\
  \ kernel/fs/fat/fat.ko\nkernel/fs/fat/vfat.ko: kernel/fs/fat/fat.ko\nkernel/fs/fat/msdos.ko:\
  \ kernel/fs/fat/fat.ko\n[root@onecoursesource ~]# insmod /lib/modules/2.6.32-573.7.1.el6_86_64/kernel/fs/fat/fat.ko\n\
  [root@onecoursesource ~]# insmod /lib/modules/2.6.32-573.7.1.el6_86_64/kernel/fs/fat/vfat.ko\n\
  ```\n\n`insmod` 命令太麻烦了。不仅要手动加载依赖模块，还要知道模块的具体位置。一个更易用的命令是 `modprobe` 命令：\n\n点击此处查看代码\n\
  \n```\n[root@onecoursesource ~]# lsmod | grep fat\n[root@onecoursesource ~]# modprobe\
  \ vfat\n[root@onecoursesource ~]# lsmod | grep fat\nvfat                   10584\
  \  0\nfat                    54992  1 vfat\n```\n\n`modprobe` 命令通过 `modules.dep`\
  \ 文件查找你要加载的模块的位置。该命令还会使用 `modules.dep` 文件确定该模块的任何依赖项，并先加载这些依赖模块。\n\n**对话式学习™——加载模块**\n\
  \n**Gary**: 嗨，Julia。你对内核模块有经验吗？\n\n**Julia**: 有一点点……你是在某个模块上遇到困难了吗？\n\n**Gary**:\
  \ 没有，我只是一直在用 `modprobe` 加载模块，现在发现 `insmod` 命令也可以加载模块。我应该用哪一个？为什么？\n\n\n\n\n\n**Julia**:\
  \ 我建议在大多数情况下使用 `modprobe`。它在确定依赖模块方面做得非常好，而且你指定模块的完整路径。\n\n**Gary**: 那么我应该完全忽略 `insmod`\
  \ 命令 吗？\n\n**Julia**: 有几个理由你应该了解 `insmod` 命令。首先，一些旧的脚本可能仍使用 `insmod` 来加载模块。\n\n\
  **Gary**: 还有其他理由需要了解这个命令吗？\n\n**Julia**: 是的，`insmod` 的优势之一是你可以用它来快速测试新模块，只要它没有任何依赖项。使用\
  \ `modprobe` 命令时，你必须先将模块安装在正确的位置，然后运行 `depmod` 命令，这样 `modprobe` 命令才能知道模块位于何处以及它的依赖项是什么。`insmod`\
  \ 命令不需要这一点，因此它非常适合测试新模块——也许是一个是你或你所在机构的其他开发者创建的模块。\n\n**Gary**: 好的，听起来我大部分都会使用 `modprobe`，但\
  \ `insmod` 确实有一些用场景。谢谢，Julia。\n\n## 从内存中卸载模块\n\n在演示如何从内存中卸载模块之前，你应该考虑你为什么需要卸载模块：\n\
  \n*   **模块可能会导致某种冲突或错误**。这对于第三方模块可能是可能的，但对于内核自带的任何模块都不可能。\n*   **你可以通过卸载模块来释放内存空间**。请记住，模块通常很小。如果你必须通过卸载模块来释放内存，你真的应该考虑为该系统增加内存。\n\
  \n这两个理由极不太可能足以迫使你从内存中卸载模块。请记住，即使你卸载了模块，当它再次需要时它会被重新加载。然而，在极少数需要从内存中卸载模块的情况下，你应该知道如何完成这项任务。\n\
  \n要手动卸载模块，你可以使用 `rmmod` 命令：\n\n点击此处代码图像\n\n```\n[root@onecoursesource ~]# rmmod\
  \ fat\nERROR: Module fat is in use by vfat\n```\n\n遗憾的是，如果系统正在使用该模块，你将收到错误消息，如上一个示例所示。\n\
  \n与其使用 `rmmod` 命令，不如考虑使用 `modprobe -r` 命令：\n\n点击此处代码图像\n\n```\n[root@onecoursesource\
  \ ~]# rmmod fat\n```\n\n这应该从内存中移除 `fat` 和 `vfat` 模块（假设 `vfat` 模块当前未被使用）。如果模块正被进程或内核使用，你仍然会报错。\n\
  \n## 列出模块信息\n\n在现实世界中，你不会经常从内存中加载和卸载模块。然而，你会发现了解模块——特别是模块参数是有用的。\n\n模块参数是一个允许你修改模块行为的功能。并不是所有模块都有参数，但对于那些拥有参数的模块，了解参数可以帮助你自定义系统的行为。\n\
  \n要查看模块的参数（以及附加信息），执行 `modinfo` 命令，如示例 28-10 所示。\n\n**示例 28-10** *`modinfo` 命令*\n\
  \n点击此处代码图像\n\n```\n[root@onecoursesource ~]# modinfo cdrom\nfilename:       /lib/modules/2.6.32-573.7.1.el6.x86_64/kernel/drivers/cdrom/cdrom.ko\n\
  license:        GPL\nsrcversion:     6C1B1032B5BB33E30110371\ndepends:\nvermagic:\
  \       2.6.32-573.7.1.el6.x86_64 SMP mod_unload modversions\nparm:           debug:bool\n\
  parm:           autoclose:bool\nparm:           autoeject:bool\nparm:          \
  \ lockdoor:bool\nparm:           check_media_type:bool\nparm:           mrw_format_restart:bool\n\
  ```\n\n这是允许内核利用 CD-ROM 驱动器的模块。以 `parm` 开头的行是参数。例如，你可能习惯了在 Linux 系统上插入并挂载 CD-ROM\
  \ 光盘时，CD-ROM 驱动器门是锁定的。这可以通过 `cdrom` 模块的 `lockdoor` 参数来控制。\n\n设置此参数的方法之一是通过 `modprobe`\
  \ 命令加载模块，并将参数作为参数：\n\n点击此处代码图像\n\n```\n[root@onecoursesource ~]# modprobe cdrom\
  \ lockdoor=0\n```\n\n由于 `lockdoor` 是一个 bool（布尔）类型，它可以被设置为 1（锁门）或 0（不锁门）。\n\n\n\n\
  \n\n## 例 28-11 `sysctl -a` 命令\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# sysctl\
  \ -a | head\nkernel.sched_child_runs_first = 0\nkernel.sched_min_granularity_ns\
  \ = 1000000\nkernel.sched_latency_ns = 5000000\nkernel.sched_wakeup_granularity_ns\
  \ = 1000000\nkernel.sched_tunable_scaling = 1\nkernel.sched_features = 3183\nkernel.sched_migration_cost\
  \ = 500000\nkernel.sched_nr_migrate = 32\nkernel.sched_time_avg = 1000\nkernel.sched_shares_window\
  \ = 10000000\n```\n\n参数的名称（例如 `kernel.sched_child_runs_first`）是一个相对路径，它从 `/proc/sys`\
  \ 开始，目录和文件名之间使用点（`.`）字符而不是斜杠（`/`）。例如，`/proc/sys/dev/cdrom/lock` 文件被命名为 `dev.cdrom.lock`\
  \ 参数：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# sysctl -a | grep dev.cdrom.lock\n\
  dev.cdrom.lock = 1\n```\n\n你可以通过 `sysctl` 命令来更改此参数的值：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# sysctl dev.cdrom.lock=0\ndev.cdrom.lock = 0\n[root@onecoursesource ~]# sysctl\
  \ -a | grep dev.cdrom.lock\ndev.cdrom.lock = 0\n```\n\n实际上，使用 `sysctl` 命令比直接修改文件更安全，因为\
  \ `sysctl` 命令知道参数的哪些值是有效的，哪些是无效的：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]#\
  \ sysctl dev.cdrom.lock=\"abc\"\nerror: \"Invalid argument\" setting key \"dev.cdrom.lock\"\
  \n```\n\n`sysctl` 命令知道哪些参数值是有效的，因为它它可以查看 `modinfo` 的输出。例如，根据 `modinfo` 命令的输出，`lock`\
  \ 文件的值必须是布尔值（0 或 1）：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# modinfo cdrom\
  \ | grep lock\nparm:           lock:bool\n```\n\n如果你直接修改文件或使用 `sysctl` 命令，更改是临时的。当系统重启时，值将恢复默认值，除非你在\
  \ `/etc/sysctl.conf` 文件中进行了更改；请参见例 28-12 以该文件的示例。\n\n## 例 28-12 `/etc/sysctl.conf`\
  \ 文件\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]#head /etc/sysctl.conf\n# Red\
  \ Hat Linux 的内核 sysctl 配置文件\n#\n# 对于二进制值，0 表示禁用，1 表示启用。更多信息请见 sysctl(8) 和\n# sysctl.conf(5)。\n\
  \n# 控制 IP 数据包转发\nnet.ipv4-ip_forward = 0\n\n# 控制源路由验证\nnet.ipv4.conf.default.rp_filter\
  \ = 1\n```\n\n若要在重启后禁用 CD-ROM 锁定，请向 `/etc/sysctl.conf` 文件中添加以下行：\n\n```\ndev.cdrom.lock=0\n\
  ```\n\n在某些发行版中，你可以在 `/etc/sysctl.d` 目录下创建一个文件，并提供自定义的内核和内核模块参数。检查 `sysctl` 手册页以查看你的发行版是否支持这种方法。\n\
  \n### init 阶段\n\n如前所述，一旦内核加载完成，就会启动 init 阶段。历史上曾有几种不同的 init 阶段技术：\n\n*   **SysVinit**：源自\
  \ Unix 的旧方法。尽管这种方法已使用多年，但很少遇到使用 SysVinit 的现代 Linux 发行版。因此，本书将不再涵盖这种方法。\n*   **Upstart**：设计用于\
  \ SysVinit 的替代品，用于 Debian、Ubuntu、Fedora 和 SUSE 等发行版。然而，几乎所有的发行版都迁移到了最新的 init 阶段软件：systemd。因此，本书将不再涵盖\
  \ Upstart。\n*   **systemd**：虽然比 SysVinit 和 Upstart 更复杂，但 systemd 已成为标准的 init 阶段技术，并将在本章的重点。\n\
  \n### 安全提示\n\n如果你直接修改文件或使用 `sysctl` 命令，更改是临时的。当系统重启时，值将恢复默认值，除非你在 `/etc/sysctl.conf`\
  \ 文件中进行了更改；请参见例 28-12 以该文件的示例。\n\n#### 配置 systemd\n\nsystemd 本身非常庞大。其核心提供了存储在 `/var/log/`\
  \ 的消息。这些信息可以帮助排除故障。\n\nsystemd 的用途之一是目标（target）。以下类型是最关键的：\n\n*   **Service (服务)**：服务用于启动（或停止）。具体位置位于以\
  \ `.service` 结尾的文件。有关目标单元的更多信息请见本章后续。\n*   **Target (目标)**：目标单元是其他单元的集合。这些在 SysVinit\
  \ 中曾被称为“运行级别”（runlevels）。\n\n##### 使用服务单元\n\n服务文件用于描述要启动的内容。例如，为了演示，查看例 28-13 的输出。\n\
  \n点击此处\n```\n[root@onecoursesource ~]# more /etc/systemd/system/sshd.service\n[Unit]\n\
  Description=OpenBSD Secure Shell server\nAfter=network.target auditd.service\nConditionPathExists=!/etc/ssh/sshd_not_to_\n\
  \n[Service]\nEnvironmentFile=-/etc/default/ssh\nExecStart=/usr/sbin/sshd -D $SSHD_OPTS\n\
  ExecReload=/bin/kill -HUP $MAINPID\nKillMode=process\nRestart=on-failure\n\n[Install]\n\
  WantedBy=multi-user.target\nAlias=sshd.service\n```\n\n服务文件的关键设置描述于表 28-4 (#part0046.html_tab24)。\n\
  \n**表 28-4 服务单元的关键设置**\n\n| 设置 | 描述 |\n| --- | --- |\n| **After** | 表明此服务应在列出的目标单元中的所有服务之后启动。本章稍后将提供有关目标单元的更多信息。\
  \ |\n| **ExecStart** | 启动服务要执行的命令。你可以修改以更改服务行为的设置之一。 |\n| **WantedBy** | 此设置用于指定与此服务关联的目标。例如，`WantedBy=multi-user.target`\
  \ 意味着“此服务是多用户目标的一部分”。该设置的结果是在定义目标和单元单元文件的目录中创建一个符号链接文件。 |\n\n\n\n\n\n```\n[root@onecoursesource\
  \ ~]# systemctl start sshd\n[root@onecoursesource ~]# systemctl status sshd\n• sshd.service\
  \ - OpenSSH server daemon\n   Loaded: loaded (/usr/lib/systemd/system/sshd.service;\
  \ disabled;\n   Active: active (running) since Mon 2018-12-11 20:32:46 PST; 6s\n\
  \     Docs: man:sshd(8)\n           man:sshd_config(5)\n Main PID: 13698 (sshd)\n\
  \    Tasks: 1 (limit: 4915)\n   CGroup: /system.slice/sshd.service\n           └─13698\
  \ /usr/sbin/sshd -D\n\nDec 11 20:32:46 localhost.localdomain systemd[1]: Starting\
  \ OpenSSH\nDec 11 20:32:46 localhost.localdomain sshd[13698]: Server listening\n\
  Dec 11 20:32:46 localhost.localdomain sshd[13698]: Server listening\nDec 11 20:32:46\
  \ localhost.localdomain systemd[1]: Started OpenSSH\n[root@onecoursesource ~]# systemctl\
  \ stop sshd\n[root@onecoursesource ~]# systemctl status sshd\n• sshd.service - OpenSSH\
  \ server daemon\n   Loaded: loaded (/usr/lib/systemd/system/sshd.service; disabled;\n\
  \   Active: inactive (dead)\n     Docs: man:sshd(8)\n           man:sshd_config(5)\n\
  \nDec 11 20:32:46 localhost.localdomain systemd[1]: Starting OpenSSH\nDec 11 20:32:46\
  \ localhost.localdomain sshd[13698]: Server listening\nDec 11 20:32:46 localhost.localdomain\
  \ sshd[13698]: Server listening\nDec 11 20:32:46 localhost.localdomain systemd[1]:\
  \ Started OpenSSH\nDec 11 21:10:26 localhost.localdomain sshd[13698]: Received signal\n\
  Dec 11 21:10:26 localhost.localdomain systemd[1]: Stopping OpenSSH\nDec 11 21:10:26\
  \ localhost.localdomain systemd[1]: Stopped OpenSSH\n```\n\n其他的 `systemctl` 选项包括\
  \ `restart`（停止并启动服务）和 `reload`（让服务在不停止的情况下重新加载其配置文件）。\n\n### 使用目标单元\n\n记得目标单元（target\
  \ unit）是其他单元（通常是服务单元）的集合。你可以通过执行 `systemctl list-unit-files --type=target` 命令列出所有不同的目标单元，如示例\
  \ 28-15 所示。\n\n**示例 28-15** *列出目标*\n\n点击此处查看代码\n\n```\n[root@onecoursesource ~]#\
  \ systemctl list-unit-files --type=target\nUNIT                  STATE\nanaconda.target\
  \            static\nbasic.target               static\nbluetooth.target       \
  \    static\nbus.target                static\ncryptsetup-pre.target      static\n\
  cryptsetup.target          static\nctrl-alt-del.target        disabled\ndefault.target\
  \             enabled\nemergency.target           static\n```\n\n在典型系统中定义了数十个目标。为了理解启动过程，以下目标是最重要的：\n\
  \n* `default.target`: 启动系统所需的标准服务集。通常此目标包含核心软件，但完整功能需要由其他目标提供的额外服务。\n* `multi-user.target`:\
  \ 提供全功能系统（不包含 GUI）的服务集。`default.target` 单元是 `multi-user.target` 单元的必要条件。\n* `graphical.target`:\
  \ 提供 GUI 的服务集。\n\n要充分了解所有当前已启用的目标（以及相应的服务），请执行 `systemctl list-dependencies` 命令，如示例\
  \ 28-16 所示。\n\n**示例 28-16** *列出目标依赖关系*\n\n点击此处查看代码\n\n```\n[root@onecoursesource~]#\
  \ systemctl list-dependencies | head\ndefault.target\n• ├accounts-daemon.service\n\
  • ├gdm.service\n• ├livesys-late.service\n• ├livesys.service\n• ├rtkit-daemon.service\n\
  • ├switchero-control.service\n• ├systemd-update-utmp-runlevel.service\n• └─multi-user.target\n\
  \   ├─...\n```\n\n### 安全要点\n花些时间了解这些服务每个的设计用途。系统上运行的服务越多，潜在的漏洞就越多。仔细考虑每个服务，以确定你可以禁用哪些服务来使系统更具安全。\n\
  \n你可以使用 `systemctl enable` 命令将服务添加到目标单元：\n\n```\n[root@onecoursesource ~]# systemctl\
  \ list-dependencies | grep sshd\n[root@onecoursesource ~]# systemctl enable sshd\n\
  Created symlink /etc/systemd/system/multi-user.target.wants/sshd.service → /usr/lib/systemd/system/sshd.service.\n\
  [root@onecoursesource ~]# systemctl list-dependencies | grep sshd\n•   ├─sshd.service\n\
  ```\n\n服务被添加到的目标基于其服务配置文件中的 `WantedBy` 设置：\n\n```\n[root@onecoursesource:~]# grep\
  \ WantedBy /etc/systemd/system/sshd.service\nWantedBy=multi-user.target\n```\n\n\
  ### 总结\nLinux  way 系统的启动过程是一个多步骤的过程。在本章中，你学习了可以修改以更改启动行为并使系统更安全的区域。\n\n#### 关键术语\n\
  * `Firmware`（固件）\n* `BIOS`\n* `UEFI`\n* `bootloader`（引导加载程序）\n* `MBR`\n* `LILO`\n\
  * `GRUB`\n* `UUID`\n* `splashimage`（启动图像）\n* `LKM`（内核模块）\n* `kernel image file`（内核镜像文件）\n\
  * `unit`（单元）\n\n#### 复习题\n1. `_____` 命令用于创建新的 `initramfs` 文件。\n2. 在 Legacy GRUB\
  \ 文件中，哪个设备名称是有效的？\n   * `hd0,0`\n   * `(hd0,0)`\n   * `(hd0.0)`\n   * `(hd0:0)`\n\
  3. `_____` 命令用于创建 GRUB2 加密密码。\n4. 哪些命令可以将内核模块加载到内存中？（选择两个）\n   * `lsmod`\n   * `insmod`\n\
  \   * `ldmod`\n   * `modprobe`\n5. `_____` 命令用于更改 `systemd` 单元，例如启动和启用服务。\n\n##\
  \ 第 29 章：制定软件管理安全策略\n\n在第 26 章“基于 Red Hat 的软件管理”和第 27 章“基于 Debian 的软件管理”中，你分别学习了如何在\
  \ Red Hat 和 Debian 系统上安装软件。安装软件伴随着责任：确保放置在系统上的软件不会带来安全风险。在本章中，你将学习如何发现软件可能带来的的安全风险。\n\
  \n### 确保软件安全\n由于安装软件非常容易，安全专家可能会忽略创建软件安全策略的重要性。本节重点介绍在 Linux 发行版上管理软件时应遵循的安全策略的关键要素。\n\
  \n#### 保持包更新\n\n\n\n\n在某些方面，保持所有软件包为最新版本可能是一把双刃剑。许多软件更新包含了对漏洞或安全缺陷的修复，因此安装这些更新至关重要。另一方面，提供更多特性或功能的软件更新可能会引入以前版本中不存在的安全漏洞。\n\
  \n安装任何修复漏洞或安全漏洞的软件更新都是良好的做法。通常情况下，安装提供新功能的软件也是一个好主意，但在安装之前你应该考虑探索该更新。你可能无法判断该更新是否引入了新的安全漏洞，但你应该能够判断该更新是否真的必要。\n\
  \n保留软件更新日志也是重要的。这看起来像是有大量的“文性工作”，但每当你选择不安装某个更新时，都应该在日志条目中清楚说明原因。否则，其他管理员可能会在不知道跳过更新原因的情况下决定安装该更新。\n\
  \n在工作站系统上通过 `crontab` 任务自动执行更新也相当。然而，这对于任务关键服务器来说通常不是一个好主意，因为更新可能会导致问题，特别是对核心操作系统软件或内核的更新。对于任务关键服务器，通常最好有一个与任务关键服务器完全相同（或尽可能相同）的实验室系统，并在实验室系统上执行更新。在实验室系统经过测试确保没有出现问题后，软件更新就可以安全地安装到任务关键系统上了。\n\
  \n你还应该准备好在新更新引起问题时撤销（回滚）更新。这并不是总是能立即察觉到的，因此应对对更新的系统进行常规监控，以检查故障软件。\n\n最后，请注意在安装软件包后不需要重启系统（内核除外）；但你可能需要重启服务器程序。这并不总是如此，因为许多开发者已将重启过程包含在软件包的安装后任务中。\n\
  \n## 考虑移除不必要的软件包\n\n这起初可能是一个挑战，但仅在系统上安装必要的软件是非常重要的。确定哪些软件包是必要的挑战在于，典型的默认 Linux 安装包含了数千个软件软件包。例如，Kali\
  \ Linux 的默认安装包含几乎 3000 个软件包，如下所示：\n\n点击此处查看代码图像\n\n```\nroot@kali:~# dpkg -l | wc\
  \ -l\n2801\n```\n\n你可能会问：“我真的需要通过逐一检查每个软件包来决定每个系统应该安装哪些软件包吗？”答案是，你应该探索发行版中每个软件包提供什么，然后为不同类型的系统创建规则。例如，什么属于典型用户工作站，什么属于\
  \ Web 服务器？\n\n事实上，你应该创建三类分类：\n\n*   应该默认安装的软件。\n*   被视为可选的软件（可以安装，但默认不安装）。\n*  \
  \ 潜在的风险或有问题的软件，绝不应安装在任何系统上。\n\n你通过探索软件包来确定是否应该安装该软件包的过程。例如，你可能首先查看软件包以确定它的作用，如 Fedora\
  \ 系统上的列表 29-1 所示。\n\n**列表 29-1** *查看软件包信息*\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
