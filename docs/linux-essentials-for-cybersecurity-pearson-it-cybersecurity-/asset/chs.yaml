  \ 美国特定的 CERT。\n\n## 术语表\n\n* **绝对路径** 从根目录到文件或目录的指示。\n* **访问控制列表 (access control\
  \ lists)** ACL 用于向特定用户或组授予权限。\n* **Active Directory** 基于 LDAP 协议的微软 Windows 产品。用于存储信息并各种用途提供数据，例如用户身份验证。\n\
  * **主动 FTP 模式**在此模式下，FTP 服务器发起数据连接。\n* **别名 (alias)** Shell 的一种功能，允许通过发布单个“命令”来执行一组命令。\n\
  * **Amanda** 第三方备份工具。\n* **匿名 FTP** FTP 的一种功能，可以使用特殊账户（anonymous 或 ftp）在无需密码或本地用户账户的情况下连接到\
  \ FTP 服务器。\n* **Apache** Apache Web 服务器的常用称呼（正式名称为 Apache 超文本传输协议服务器）。\n* **参数 (argument)**\
  \ 提供给命令的参数，告诉命令对什么对象（文件、用户等）执行操作。\n* **ARP** 地址解析协议；一种定义如何将 IP 地址转换为 MAC 地址的协议。\n\
  * **ARP 表** 包含 IP 地址和相应 MAC 地址的内存表。\n* **非对称加密 (asymmetric cryptography)** 一种加密技术，使用一个密钥（公钥）加密数据，另一个密钥（私钥）解密数据。也称为\
  \ PKC（公钥加密）。\n* **at** 用于调度在未来某个特定时间执行一个或多个命令的系统。\n* **属性 (attribute)** 对象的组件。\n\
  \n\n\n\n\n`authoritative name server` 根据系统本地存储存储的记录返回结果的名称服务器。另参见 name server。\n\
  \n`autofs` 一种设计用于按需自动挂载系统的系统。\n\n`background process` 一个在后台运行且不影响父进程执行额外程序的进程。\n\
  \n`Bacula` 一种第三方备份实用。\n\n`Berkeley Internet Name Domain (BIND)` 互联网上最广泛使用的 DNS 软件。\n\
  \n`BIOS` 基础输入/输出系统；启动系统引导过程的固件。\n\n`bootloader` 由操作系统提供的软件程序，旨在访问硬盘上的文件（特别是 `kernel`\
  \ 内核）并启动操作系统的引导。\n\n`CA` 证书颁发机构；一种旨在数字签名证书以验证另一个系统身份的系统。CA 具有层级结构，顶层 CA 称为 `root\
  \ CA`（根 CA）。\n\n`caching name server` 根据从其他名称服务器（如权威名称服务器）获取的信息返回结果的名称服务器。\n\n`CERT`\
  \ 计算机应急响应小组；原型是卡内基·梅隆大学（CMU）的 `CERT 协调中心 (CERT-CC)`。\n\n`certificate` 对于 SSH 而言，证书用于允许无密码认证。\n\
  \n`chain` 一组防火墙规则，包含了类型和过滤点。\n\n`child directory` 参见 subdirectory。\n\n`CIDR` 无类间域网路由；类似于\
  \ VLSM，`CIDR` 提供子网掩码，但通过指定 `IPv4` 地址中多少字节被保留用于网络。\n\n`CIFS` 通用互联网文件系统；一种在 Microsoft\
  \ Windows 系统上流行的基于 SMB 的协议。\n\n`CLI` 命令行界面；一种通过在 shell 程序中输入命令与操作系统通信的手段。\n\n`CN`\
  \ 通用名称；对象的相对名称。\n\n`component` 在 Debian 软件包配置方面，这是一种用于分类软件包的特性。常见组件包括 Main、Restricted、Universe\
  \ 和 Multiverse。\n\n`conditional expression` 编程术语，意味着根据真或假测试的结果执行语句。\n\n`crontab`\
  \ 一种用于调度在未来特定时间执行进程的系统。\n\n`current directory` shell 当前所在的目录。\n\n`CVE` 常见漏洞与披露；一个旨在为安全人员提供单一位置以学习与安全相关的软件问题的系统。\n\
