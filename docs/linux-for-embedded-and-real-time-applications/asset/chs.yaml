  \nButenhof, David R., *Programming with POSIX Threads*, Addison-Wesley, 1997.\n\n\
  # 第 10 章\n\n## 嵌入式网络\n\n授人以鱼不如授人以渔。\n\n教他如何使用网络（Net），他就不会打扰你几周了。\n\n万物皆可互网，甚至是冰箱。^(1)\
  \ 所以，是时候将注意力转向嵌入式领域的网络编程了。Linux 作为 Unix 的衍生版本，对网络有广泛的支持。\n\n我们将从查看基础网络接口 `socket`\
  \ 开始。以此为基础，我们将继续检查常见的应用层网络协议如何在嵌入式设备中使用。\n\n## Sockets\n\n“socket”接口首次在伯克利版本的 Unix\
  \ 中引入，它是 Unix 系统中大多数网络编程的基础。Socket 是 Unix 文件访问机制的泛化，它为跨网络或单台计算机内的通信提供了端点。Socket\
  \ 也可以被认为是命名管道（named pipe）概念的扩展，显式地支持客户端/服务器模型，其中多个客户端可以连接到一个服务器。\n\n文件描述符（file descriptors）和\
  \ socket 之间的主要区别在于，当应用程序调用 `open()` 时，文件描述符绑定到特定的文件或设备，而 socket 可以在创建时不绑定到特定的目的地。应用程序可以在每次使用\
  \ socket 时选择提供目的地址（例如在发送数据报文时），也可以将目的地绑定到 socket 以避免重复指定目的（例如在使用 TCP 时）。\n\n客户端和服务器可能存在于同一台机器上。这简化了构建客户端/服务器应用程序的过程。在将应用程序发布到网络之前，可以在同一台机器上测试两端。按照惯例，网络地址\
  \ `127.0.0.1` 是“本地回环”设备。进程使用该地址的方式与使用其它网络地址完全相同。\n\n### 尝试一下\n\n执行命令 `/sbin/ifconfig`。这将列出系统中网络设备的属性和当前状态。你应该至少看到两个条目：一个是\
  \ `eth0`（以太网接口），另一个是 `lo`（本地回环设备）。\n\n此命令在你的开发主机和目标机上都应该有效，并产生类似的结果。`ifconfig` 配合适当参数也是设置网络接口属性的命令。\n\
  \n### 服务器进程\n\n图 10.1 展示了服务器进程建立通信所经历的基本步骤。我们首先创建一个 socket，然后将其 `bind()` 到一个名称或目的地址。对于本地\
  \ socket，该名称是文件系统项，通常位于 `/tmp` 或 `/usr/tmp` 中。对于网络 socket，它是一个*服务标识符*，由一个“点点四位”（dotted\
  \ quad）Internet 地址（例如 `192.168.1.11`）和一个协议端口号组成。客户端使用此名称来访问服务。\n\n![image](img/F000101f10-01-9780124159969.jpg)\n\
  \n图 10.1 网络服务器。\n\n接下来，服务器使用 `listen()` 服务创建一个连接队列，然后使用 `accept()` 服务等待客户端请求。当成功接收连接请求时，`accept()`\
  \ 返回一个新的 socket，该 socket 用于此连接的数据传输。服务器使用标准的 `read()` 和 `write()` 调用通过该描述符传输数据。事务完成后，新创建的\
  \ socket 被关闭。\n\n服务器可能会产生一个新的进程来处理连接，同时它返回等待额外的客户端请求。这允许服务器同时服务多个客户端。每个客户端请求都会产生一个带有自己\
  \ socket 的新进程/线程。思考，这就是 Web 服务器的工作方式。\n\n### 客户端进程\n\n图 10.2 显示了事务的客户端侧。客户端首先创建一个\
  \ socket 并将其命名为匹配服务器的公开名称。接下来，它尝试 `connect()` 到服务器。如果连接请求成功，客户端将继续使用 `read()` 和\
  \ `write()` 调用通过该描述符传输数据。当事务完成后，客户端关闭 socket。\n\n![image](img/F000101f10-02-9780124159969.jpg)\n\
  \n图 10.2 网络客户端。\n\n如果服务器为此客户端产生了一个进程，那么当客户端关闭连接时，该进程应该消失。\n\n### Socket 属性\n\n`socket`\
  \ 系统调用创建一个 socket 并返回一个描述符，供以后访问该 socket。\n\n```c\n#include <sys/socket.h>\n\nint\
  \ socket (int domain, int type, int protocol);\n```\n\nSocket 由三个属性描述，这些属性决定了如何进行通信。*域*\
  \ 指定了通信介质。最常用的域是用于本地文件系统的 `PF_UNIX` 和用于 Internet 连接的 `PF_INET`。这里的“PF”代表协议族（Protocol\
  \ Family）。\n\n\n\n\n域决定了套接字的名称或地址。对于 `PF_INET`，地址是 `AF_INET` 并采用点分格式。这里“AF”代表地址族（Address\
  \ Family）。通常，`AF_` 值与 `PF_` 值之间存在一一对应的关系。网络可能支持许多不同的服务。特定的服务通过“端口号”来标识。如 `ftp`、`http`\
  \ 等建立的服务使用了 1024 以下的端口号。\n\n某些域例如 `PF_INET` 提供了可选通信机制。`SOCK_STREAM` 是一种基于连接的、可靠的双向字节流，这是\
  \ `TCP` 的基础。`PF_INET` 域 `SOCK_DGRAM` 是数据报服务，用于发送较短的消息，但不保证会被网络重排序。这是 `UDP` 的基础。`SOCK_RAW`\
  \ 允许进程直接访问 `IP`。\n\n协议通常由套接字域决定，你无法选择。因此协议参数通常为 0。\n\n## 一个简单示例\n\n### 服务器\n\n创建另一个\
  \ Eclipse 项目。按照操作，将其命名为“network”。它位于 `home/src/network`。打开 `netserve.c` 文件并包含路径。首先，我们创建一个使用流的\
  \ `server_socket`。接下来，我们需要将此套接字绑定到特定的网络地址。这需要填充 `sockaddr_in` 结构 `server_addr`。`inet_aton()`\
  \ 函数接收一个地址字符串作为第一个参数，将其转换为数字并存储在 `server_addr` 的相应字段中。有趣的是，如果成功，`inet_aton()` 将返回\
  \ 0。通过编译符号 `SERVER` 可以在本地回环设备或跨网络运行服务器。\n\n端口号是 16 位的，并通过编译符号 `PORT` 传递。`htons()`\
  \ 函数是一组小函数之一，实际上解决了不同字节序计算机之间传输二进制数据的问题。互联网建立了“网络字节序”，即大端序。所有二进制数据在到达网络时预期为网络字节序。`htons()`\
  \ 将主机字节序的短整数（16 位）转换为网络字节序。有一个对应的函数 `ntohs()`，它将网络字节序转换回主机字节序。\n\n现在使用 `bind()`\
  \ 函数将 `server_socket` 绑定到 `server_addr`。最后，使用 `listen()` 函数为传入的连接请求创建一个队列。在这种情况下，队列长度为\
  \ 1 就足够了，因为只有一个客户端会连接到此服务器。\n\n现在我们准备好 `accept` 连接请求。`accept()` 的参数是：\n\n- 套接字描述符。\n\
  - 指向 `accept()` 将填充的 `sockaddr` 结构的指针。\n- 参数 2 中的整数。如果客户端地址结构的长度较短，`accept()` 将修改它。\n\
  \n`accept()` 会阻塞直到连接请求到达。返回值为用于与此客户端传输数据的套接字描述符。在本示例中，服务器简单地回显从客户端接收的字符串，直到字符串以“q”开头。\n\
  \n### 客户端\n\n现在看 `netclient.c`。`netclient` 在运行时决定连接到本地还是跨网络。我们按照服务器的方式创建一个套接字和地址结构。然后通过调用\
  \ `connect()` 连接服务器。参数为：\n\n- 套接字描述符。\n- 指向要连接的服务器地址的 `sockaddr` 结构指针。\n- `sockaddr`\
  \ 结构的长度。\n\n当 `connect()` 返回时，我们准备好传输数据。客户端提示字符串，将此字符串写入套接字并等待读取响应。当输入字符串的第一个字符是“q”时，进程终止。\n\
  \n### 尝试\n\n我们需要为服务器和客户端创建 make 目标。查看 Makefile 查看这些目标是如何指定的。该项目包含许多 make 目标。你可以现在创建它们，也可以等到需要时再创建。顺便注意，没有“all”目标。制作客户端和本地服务器。设置主机调试配置来调试服务器并启动会话。单步执行代码直到调用\
  \ `accept()`，它将阻塞直到客户端发起连接。\n\n在 shell 窗口中，进入 `network/` 目录并执行 `./netclient`。输入几个字符串并观察发生了什么。要终止两个进程，输入以“q”开头的字符串（例如“quit”）。\n\
  \n接下来，我们想在目标上运行 `netserve`，而在主机上运行 `netclient`。删除 `netserve.o` 并构建远程服务器的 make 目标。\n\
  \n在连接到目标的终端窗口（运行 `minicom` 的那个）中，进入 `network/` 目录并执行 `./netserve`。回到原始窗口执行 `./netclient`。\n\
  \n## 远程温度控器\n\n转向更实用的示例，我们的温度控器可能出现在分布式环境中，当前温度必须报告给监控站，且设定值和限制需要远程设置。自然地，我们希望通过网络实现这一点。\n\
  \n从 `Posix/` 目录将 `monitor.c` 和 `thermostat.c` 拷贝到 `network/`，并刷新网络项目将这些文件引入 Eclipse。实际上，`ther.c`\
  \ 不需要任何更改。以下是 `monitor.c` 需要的：\n\n1. 将设置网络服务器和建立连接的过程隔离在名为 `createServer()` 的独立函数中，它大致由\
  \ `netserve.c` 中的第 18–55 行组成。这样做的原因很快就会显现。`createServer()` 不接受参数并返回 `accept()` 返回的套接字号（int）。如果发生任何错误，它应返回\
  \ -1。\n2. 在 `monitor()` 的 `while (1)` 循环之前调用 `createServer()` 并检查返回值是否错误。\n3. 在\
  \ `createServer()` 返回的套接字上将 `fgets()` 替换为 `read()`。\n4. 在 switch 语句中添加一个新命令“”，通过网络返回当前温度。实际上，我们可能想查询温度控器的任何参数。思考如何扩展协议来实现目标。\n\
  5. `netclient` 期望发送给服务器的每个字符串都有响应。因此，对于每个有效的参数更改命令返回“OK”，对于无效命令返回“?”\n\n为温度控器的仿真版本和目标版本创建\
  \ make 目标。构建仿真版本并将主机调试配置指向 `network/thermostat_s`。你需要两个 shell 窗口来测试温度控器：一个运行设备程序，另一个运行\
  \ netclient。\n\n当你对仿真满意后，构建目标版本并在那里尝试。在重新构建之前，记得删除 `thermostat.o` 和 `monitor.o`。还记得执行\
  \ `netclient remote` 让客户端与目标上的服务器通信。\n\n\n\n\n按照目前网络恒温器的构建，一次只能有一个客户端连接它。在实际应用中，很有可能有多个客户端同时连接到恒温器。记得我们在讨论套接字（sockets）时，服务器进程可能会根据连接请求选择创建一个新进程或线程，以便能够立即返回并监听更多请求。\n\
  \n在我们案例中，我们可以创建一个新的监控线程。这就是 `createServer()` 函数背后的思路。它可以被转换为一个服务器线程，其工作是在连接请求来临时时产生一个新的监控线程。所以，尝试一下吧。\n\
  \n泛泛来说，这里将网络恒温器转换为支持多个客户端的服务所需的步骤如下：\n\n1. 将 `monitor.c` 复制为 `multimon.c` 并在该文件中进行工作。\n\
  2. 将 `createServer()` 重构为线程函数。\n3. 在 `createThread()` 函数中，更改 `pthread_create()`\
  \ 的参数，以创建服务器线程而不是监控线程。\n4. 转到 `createServer()` 的最后四行，紧跟注释“Accept a connection.”之后。用一个无限\
  \ `while` 循环将这些行括起来。\n5. 在 `printf()` 语句之后，添加对 `pthread_create()` 的调用以创建一个监控线程。\n\
  6. 在监控线程的 `switch` 语句中添加一个情况 ‘q’： “q” 表示客户端正在终止（退出）会话。这意味着监控线程应该退出。\n\n现在，这些是棘手的部分。`client_socket`\
  \ 必须传递给新创建的监控线程。每次调用 `pthread_create()` 时，线程对象从哪里来呢？一种简单的方法可能是估计想要访问恒温器的最大客户端数量，然后创建一个同样大的\
  \ `pthread_ts` 数组。另一种更通用的方法是使用动态内存分配，即 `malloc()` 函数。\n\n但最大的问题是，当监控线程终止时，你如何取回一个\
  \ `pthread_t` 对象呢？监控线程本身无法返回它，因为该对象仍在作用域内，即仍在被使用。如果我们忽略这个问题，恒温器最终将变得无响应，要么是因为 `pthread_t`\
  \ 数组的所有元素都已使用，要么是因为我们耗尽了内存，因为没有东西被返回到动态内存池。\n\n这里是一些想法。为每个 `pthread_t` 对象关联一个标记，说明它是分配在固定数组上还是动态分配的。该标记是包含\
  \ `pthread_t` 的数据结构的一部分，指示其关联的 `pthread_t` 是空闲的、使用中的还是“待定”（pending），即可以被释放的。服务器线程在创建监控时会将此标记标记设置为“使用中”状态。该结构可能还包含套接字号。这个“元”\
  \ `pthread_t` 对象将被分配并传递给监控线程。\n\n现在的问题是，标记何时可以被设置为“空闲”状态？再次，监控线程不能这样做，因为在线程实际退出之前，`pthread_t`\
  \ 对象一直在使用中。这就是第三种状态 `PENDING` 派上用场。\n\n监控线程在终止之前将标记设置为 `PENDING`。然后我们创建一个独立的线程，如果可以的话称之为“资源”（resource），它执行以下操作：\n\
