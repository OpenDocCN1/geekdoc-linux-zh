  \ 年；第三卷同样由 Stevens 合著，日期为 1997 年。如果你想理解互联网的内部工作机制，强烈推荐此书。\n\n[`en.wikipedia.org/wiki/Comparison_of_lightweight_web_servers`](http://en.wikipedia.org/wiki/Comparison_of_lightweight_web_servers)——这篇文章包含了一对非常有用的表格，比较了十多个种小型轻量级\
