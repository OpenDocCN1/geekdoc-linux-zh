  \ 的监控线程。\n10. 定期唤醒并检查标记设置为 `PENDING` 的监控线程。\n\n\n\n\n要通过 HTTP 提供数据，你需要一个 Web 服务器。为嵌入式设备创建一个\
  \ Web 服务器并没有你想象的那么困难。这是因为所有的渲染工作（最困难的部分）都是由客户端 Web 浏览器完成的。总来说，服务器要做的只是交付文件。\n\n\
  `network/` 目录包含一个名为 `webserve.c` 的简单示例。在 `Eclipse` 中打开它。它的启动方式与 `netserve.c` 非常相似，不同在于它监听的是端口\
  \ `80`，即 HTTP 分配的端口。一旦建立连接，服务器就会从客户端读取请求消息并对其进行处理。对于我们这种有限的用途，我们只处理两种方法：`POST` 和\
  \ `GET`。\n\n在 `GET` 的情况下，第 183 行附近的 `doGETmethod()` 函数会打开指定的文件并确定其内容类型。在“真实”Web\
  \ 服务器（如 `Apache`）中，HTML 文件被存储在特定的目录中。在这种情况下，将文件放在与程序相同的目录下似乎更简单，因此 `doGETmethod()`\
  \ 会删掉开头的 `/`（如果存在），使路径相对于当前目录。\n\n如果一切正常，我们调用 `responseHeader()` 来发送成功响应。响应头指示了文件的内容类型，并告诉服务器我们要关闭连接，即使客户端请求保持连接。最后，我们发送文件本身。如果它是\
  \ `HTML` 文件，我们需要解析它以寻找动态内容标签。\n\n### 动态 Web 内容\n\n在嵌入式应用中，仅仅提供静态 `HTML` 网页并不特别有趣，甚至没有用。通常，设备需要报告某些信息，我们可能希望对其进行某种程度的控制。有多种方法可以将动态内容整合\
  \ `HTML`，但由于这不是一本关于 Web 编程的书，我们将采用一种“快速粗暴”的方法。\n\n现在是快速回顾 `HTML` 的好时机。查看 `network/`\
  \ 目录下的 `index.html` 文件。\n\n`HTML` 的一个优秀特性是易于扩展。你可以发明自己的标签。当然，客户端浏览器不理解的任何标签它都会简单地忽略。因此，如果我们发明了一个标签，它在发送文件之前必须由服务器解释。我们将发明一个名为\
  \ `<DATA>` 的标签，看起来如下：\n\n```html\n<DATA data_function>\n```\n\n`index.html` 中包含一个数据标签。\n\
  \n服务器扫描 `HTML` 文本寻找 `<DATA>` 标签。`data_function` 是一个返回字符串的函数。服务器将 `<DATA>` 标签替换为返回的字符串。打开\
  \ `webvars.c`。顶部有一个表，每个条目由一个文本字符串和一个函数名组成。紧随其的是 `cur_temp()` 函数，它以 ASCII 字符串的形式返回我们恒温器的当前温度。\n\
  \n现在回到 `webserve.c` 找到第 124 行左右的 `parseHTML()` 函数。它扫描输入文件寻找 `<DATA>` 标签。当发现一个标签时，它将该标签之前的所有内容写入套接字。然后，它使用关联数据数据的函数名称调用\
  \ `web_var()`。`webvars.c` 中的 `web_var()` 会查找并调用该数据函数，返回其字符串值。`web_var()` 的返回值会被写入，然后继续扫描。\n\
  \n不言而喻，数据函数可以是我们想要的任何形式。这个特定的示例恰好返回了当前温度。顺便提一下，`parseHTML()` 中存在一个细微的 Bug。看看你能如何处理它。\n\
  \n### 表单和 POST 方法\n\n`<DATA>` 标签是我们从服务器向客户端发送动态数据的方式。`HTML` 包含一种从客户端向服务器发送数据的简单机制。你在浏览网页时无疑用过很多次。它就是\
  \ `<FORM>` 标签。我们示例 `index.html` 文件中的那个看起来如下：\n\n```html\n<FORM ACTION=\"control\"\
  \ METHOD=\"POST\">\n  <INPUT TYPE=TEXT NAME=\"Setpoint\" SIZE=10>Setpoint:\n  <INPUT\
  \ TYPE=TEXT NAME=\"Limit\" SIZE=10>Limit:\n  <INPUT TYPE=TEXT NAME=\"Deadband\"\
  \ SIZE=10>Deadband:\n  <INPUT TYPE=\"submit\" NAME=\"Go\">\n</FORM>\n```\n\n这告诉浏览器在用户点击“Go”按钮时，使用\
  \ `POST` 方法执行名为“control”的 `ACTION` 来发送三个文本变量。通常情况下，`ACTION` 是一个 `CGI` 脚本。这超出了本文讨论的范围，因此我们只为“control”实现一个函数。\n\
  \n查看第 165 行左右的 `doPOSTmethod()` 函数。它获取标头中的下一个标记，即 `ACTION` 函数的名称。然后它调用 `web_var()`，即我们之前用于动态\
  \ `<DATA>` 标签的同一个函数。在这种情况下，我们需要传递另一个参数，即指向消息体的指针，因为数据字符串就在那里。\n\n在 `<DATA>` 标签的情况下，`web_var()`\
  \ 的成功返回会产生一个字符串指针。在 `POST` 方法的情况下，不需要字符串指针，但 `web_var()` 仍然需要返回一个非零值表示成功。\n\n`HTTP\
  \ POST` 消息体包含客户端浏览器在表单中返回的值：\n\n```text\n<name1>=<value1>&<name2>=<value2>&<name3>=<value3>&Go=\n\
  ```\n\n`webvars.c` 中的 `parseVariable()` 函数在消息体中搜索变量名并返回对应的值字符串。\n\n### 构建并尝试\n\n\
  为 Web 温度器创建必要的 `make` 目标并在工作站的调试器下运行它，这样你就可以观察浏览器访问它时发生了什么。你必须以 `root` 身份运行才能绑定到\
  \ `HTTP` 端口 `80`。\n\n在你喜欢的浏览器中，在目标窗口输入\n\n`http://127.0.0.1`\n\n一旦 `index.html`\
  \ 文件被完全处理，你应该看到类似图 10.4 的内容。\n\n![image](img/F000101f10-05-9780124159969.jpg)\n\n\
  图 10.4 Web 温度器。\n\n在目标板上运行 Web 温度器时，在浏览器中输入 `http://192.168.1.50`。\n\n一旦你在工作站和目标机上都运行了它，这里有一个“额外作业”。`network/`\
  \ 目录下有三个圆形的 GIF 文件——一个红色、一个绿色和一个开启。它们可以用来表示冷却器和报警的状态。因此尝试添加几个 `<DATA>` 标签来输出相应的圆形图像。\n\
  \n当然，我们想要做的另一件事是动态更新温度读数。动态 Web 内容涉及 Java Applets 等问题超出了本书的范围，但绝对值得尝试。搜索短语“embedded\
  \ web server”可以找到大量扩展我们内容的商业产品和开源项目。\n\n虽然 `webserve.c` 是 HTTP 处理的一个很有用的介绍，但它相当局限。幸运的是，开源世界包含了许多适用于嵌入式应用的实用\
  \ Web 服务器。资源部分包含指向维基百科文章的链接，它对“轻量级” Web 服务器提供了非常有用的比较。\n\n`boa` Web 服务器是开源嵌入式服务器的一个很好的例子，它恰好在我们的目标文件系统中。`Boa`\
  \ 是一个单任务 HTTP 服务器，这意味着它不会产生自身的副本，也不会为处理每个接入连接创建线程，而是在内部对连接进行复用。它最早于 1995 年左右发布。最新版本日期为\
  \ 2005 年。\n\n`rcS` 脚本执行最后的操作之一是通过调用 `/etc/rc.d/init.d` 中的 `httpd` 脚本来启动 `boa`。但记得，我们在第\
  \ 5 章中注释掉了 `httpd` 的启动。因此，编辑 `/etc/init.d/rcs` 以取消注释第 44–47 行。保存文件并重启目标板。`boa` 现在在后台运行，等待对端口\
  \ `80` 的连接请求。\n\n\n\n\n`/etc/boa/boa.conf` 文件提供了程序的配置信息。除外，它还指定了顶层 HTML 文件的位置。在这种情况下，路径是\
  \ `/www`。当你打开一个网页时，通常不需要指定文件名。默认通常是 `index.html`。这在 `boa.conf` 中也有指定。请注意，`/www`\
  \ 目录由 `root` 所有，且只有 `root` 可以访问。\n\n因此，在你的工作站上打开浏览器并将其指向 [`192.168.1.50`](http://192.168.1.50)。你会看到一个\
  \ FriendlyARM 的推广页面，主要是中文。你还有几个本地页面可以查看。还有一个网络链接，除非你的目标板连接到互联网，否则你无法访问。\n\n## 嵌入式电子邮件\n\
  \n在结束嵌入式网络网络之旅之前，让我们快速看看如何在嵌入式环境中使用电子邮件。假设我们的恒温器维护着温度日志，并跟踪冷却器启动的频率和持续时间。我们可能定期将该日志发送到某处进行审查和分析。\n\
  \n发送电子邮件的协议称为 `SMTP`，即简单邮件传输协议。像 `HTTP` 一样，它是一种相当基于 ASCII 的客户端-服务器机制。`SMTP` 使用全双工流套接字，客户端发送文本命令，服务器回复包含数字状态码的响应。它是一种“步进”协议，每条命令都必须得到响应。\n\
  \nListing 10.2 是与 `SMTP` 服务器交互的典型对话。客户端条目已加粗，并添加了额外的空行以提高可读性。当建立连接时，服务器会介绍自己，告诉我们一些关于它的信息。随后，客户端使用\
  \ `HELO` 命令介绍自己，并指定域名。请注意，服务器的每条回复都以三位状态码开头。这允许对消息对话进行简单的自动处理，同时随附的文本支持人类解释。命令和回复不区分大小写。\n\
  \n![image](img/F000101f10-06-9780124159969.jpg)\n\nListing 10.2\n\n接下来，我们指定消息的发送者\
  \ (`FROM`) 和接收者 (`RCPT`)。可以有多个接收者。`SMTP` 规范要求电子邮件地址括在角括号内，至少示例是这样显示的。然而，我的 `SMTP`\
  \ 服务器似乎没有它们也运行得很好。消息正文通过 `DATA` 命令引入。服务器对 `DATA` 命令做出响应，并在客户端发送终止序列之前不再再次响应，终止序列是单独成行的一个点\
  \ “.”。此时，我们可以发送另一条消息，或者像本例一样发送 `QUIT`。服务器关闭连接，客户端也应该这样做。\n\n`network/` 目录下的 `maildialog`\
  \ 程序允许你与 `SMTP` 服务器交互。Listing 10.2 就源于此。查看一下 `maildialog.c`。该程序接受一个运行时参数，即 `SMTP`\
  \ 邮件服务器的，可以是点分四位，也可以是完全限定域名。注意函数 `gethostbyname()`。该函数的参数是一个主机标识符，可以是表示为字符串的点分四位，也可以是完全限定域名。在后者，`gethostbyname()`\
  \ 会访问网络寻找指定域名的地址。\n\n在打开与服务器的套接字后，程序进入一个循环，在该循环中它：\n\n1. 打印之前的服务器响应。\n2. 检查上一条命令中几个改变循环行为的关键词：\n\
  \    - 对于 `DATA` 命令，进入另一个循环，发送文本直到看到一个只包含点 “.” 的行。\n    - 对于 `QUIT` 命令，退出并关闭连接。\n\
  3. 从用户处获取另一条命令。\n\n用你自己的邮件服务器进行编译并尝试。\n\n```\nmake maildialog\nmaildialog <your_server_name>\n\
  ```\n\n`sendmail.c` 文件实现了一个简单的客户端，可以从应用程序调用来发送电子邮件。邮件服务器和本地域名指定在字符串指针中，这些指针必须由调用程序声明。消息本身体现在一个数据结构中。应用程序只需填充数据结构并调用\
  \ `sendMail()`。\n\n注意 `do {…} while (0)` 结构。这是一种在出现问题时退出消息事务的方法，而无需使用可怕的 `goto`。如果发生错误，我们只需跳出\
  \ `while` 循环。\n\n先用测试应用程序 `mailclient` 进行尝试。（5）。然后，为恒温器创建一个新线程，让它每隔 15 min 唤醒一次并发送带有当前温度的电子邮件。\n\
  \n电子邮件不仅限于文本。使用多用途互联网邮件扩展 (MIME)，我们可以发送几乎任何类型的二进制数据——图片、音频、视频和固件更新——作为附件。像大多数 IP\
  \ 一样，`SMTP` 要求在传输之前将任意二进制数据转换为 7 位 ASCII。这通常通过 `Base64` 编码完成。\n\n发送电子邮件的另一面自然是接收。今天最流行的接收电子邮件机制称为邮局协议，目前版本为\
  \ 3，被称为 `POP3`。`POP3` 是一种命令/响应协议，与 `SMTP` 非常相似，如 Listing 10.3 所示，它恰恰显示了 Listing\
  \ 10.2 中发送事务的接收端。\n\n![image](img/F000101f10-07-9780124159969.jpg)\n\nListing 10.3\n\
  \n嵌入式 `POP3` 客户端可能扮演什么角色？我想到的是自动接收和分析由网络恒温器发送的日志。这种场景并不一定是经典的“嵌入式”应用，它完全可能运行在工作站上。尽管如此，它可以是大型嵌入式应用中的元素。\n\
  \n像 `SMTP` 一样，`POP3` 事务从介绍开始，在这种情况下包括一个密码。有几个命令，其中 `LIST` 和 `RETR` 会返回以只包含句点的行结束的多行响应。获取消息后，我们可以从服务器上删除它。当然，当我们完成所有操作后，我们执行\
  \ `QUIT`，关闭与服务器的连接。\n\n修改 `maildialog.c` 以与 `POP3` 服务器而非 `SMTP` 服务器交互是一个相对练习。因此，你这一节的额外作业正是此。创建一个\
  \ `maildialog` 的版本，命名为 `popdialog`，它与 `POP3` 服务器交互以检索电子邮件。`POP3` 服务器通常监听端口 110。\n\
  \n事实上有几个“坑”。`POP3` 协议坚持命令必须由回车 (`\\r`) 和换行符 (`\\n`) 共同结束。还有几个与搜索单独成行的终止字符串 “.” 相关的问题。首先，服务器可能会将多行作为一个单独字符串发送，因此你不能依赖点是第一个字符。你还需要在字符串中搜索\
  \ `\\n.`。其次，为了验证该点是单独成行的，仅仅搜索 `\\n.\\n` 是不够的，因为服务器可能会插入回车符 `\\r` 字符。因此在 `\\n.` 之后，你需要寻找\
  \ `\\n` 或 `\\r`。\n\n## 其他应用层协议\n\n我们看过的三种协议——`HTTP`、`SMTP` 和 `POP3` 对于某些类别的嵌入式问题很有用。还有许多其他应用层协议在其他情况下也很有用。例如，简单网络管理协议\
  \ (`SNMP`) 已成为管理网络资源的事实标准机制。几乎每个连接到网络的设备都实现了 `SNMP`，你的嵌入式设备可能也应该这样做。在嵌入式场景中，`SNMP`\
  \ 可用于简单的监控和控制。\n\n我们基本结束了应用层编程的之旅。在第 11 章 中，我们将深入内核空间并查看 Linux 内核。\n\n## 资源\n\n\n\
