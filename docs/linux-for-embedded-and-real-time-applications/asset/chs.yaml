  \ 插件。该页面列出了超过 1000 个插件，包括商业和开源。\n\n[www.eclipse.org](http://www.eclipse.org)—Eclipse\
  \ Foundation 的官方网站。这里有很多内容，值得花时间浏览一下。我特别推荐下载 *C/C++ Development Toolkit User Guide*\
  \ (PDF)。\n\n¹本章的部分内容改编自 *Eclipse Platform Technical Overview*，© IBM Corporation\
