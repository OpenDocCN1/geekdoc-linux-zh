  David Emery\n\n## 复习\n\n现在是停下来，深呼吸，在我们继续处理应用程序开发之前，看看我们已经到了哪一步了。\n\n第 1 章 为我们概述了嵌入式和实时空间，以及\
  \ Linux 如何适应该空间。第 2 章 如果你还没有 Linux 工作站，它介绍了安装过程。对于刚接触 Linux 的新手来说，第 3 章 提供了概述和介绍。在第\
  \ 4 章中，你安装了从本章开始我们需要的几个软件包。第 5 章 介绍了我们在本书本节将使用的目标单板计算机（SBC）。此时，目标板应该已经正确启动 Linux。最后，在第\
  \ 6 章中，你学习并熟悉了 Eclipse 集成开发环境。\n\n现在是时候将这一切整合起来，在交叉开发环境中构建应用程序了。\n\n## ARM I/O 架构\n\
  \n与大多数现代处理器架构一样，`ARM` 将外设放在与内存相同的地址空间内。这意味着可以使用与内存相同的指令访问外设。程序不需要知道或关心访问的是内存还是硬件设备。这与例如\
  \ `x86` 架构形成对比，在 `x86` 架构中，外设存在于独立的地址空间，通过单独的 I/O 指令访问。\n\n`x86` 的情况下，I/O 不仅位于独立的地址空间，而且\
  \ I/O 指令只能在特权级 0（也称为“内核空间”）执行。这需要使用内核空间设备驱动程序来访问外设。然而，`ARM` 允许我们直接从用户应用程序访问外设。\n\
  \n图 7.1 显示了 `S3C2440` 处理器的 32 位地址空间是如何分配的。处理器的八个片选引脚每个访问 128 MB 的内存空间，因此覆盖了 32 位地址空间从\
  \ 0 到 `0FFFFFF` 的前 1 GB。在 NOR 位置下，NOR flash 从 0 开始，内部 SRAM 映射到 0。在 NAND 位置下，NOR\
  \ flash 不可见，内部 SRAM 映射到 0。这个第一阶段加载器将 U-boot 拷贝到 SDRAM 并执行它。\n\n奇怪的是，内部外设占据了地址空间的顶部几页，而不是像这样“卡在中间”。内部外设在\
  \ `S3C2440` 数据书中有充分描述，除少数例外外，在这里不再重复。\n\n### LED 和按键\n\n然而，我们将详细说明四个 LED 和六个按键映射到通用输入/输出（GPIO）端口。LED\
  \ 使用基于 `0x5600010` 的 B 口（GPB），按键使用基于 `0x5600060` 的 G 口（GPG）。图 7.2 显示 LED 如何映射到 `GPB`\
  \ 数据寄存器的位，以及它们在板子上的样子；图 7.3 对按键也是如此。\n\n正如 S3C2440 数据书所示，每个 GPIO 引脚根据控制寄存器决定多种功能。位通常可以作为通用输入、通用输出或特定外设功能（如串口）的一部分。稍后我们将看到如何将\
  \ LED 位设置为输出并将按键位设置为输入。\n\n## 从 Linux 访问 I/O——我们的第一个程序\n\n### 创建项目\n\n在 Eclipse\
  \ 中创建项目有两种方法：*标准*项目（也称为 *Makefile* 项目）或*托管*项目（也简单称为*可执行*项目）。托管项目会自动在默认工作区创建项目目录、一个模板\
  \ C 源文件和一个 makefile。在第 6 章中，我们为 `record_sort` 程序创建了一个托管项目。\n\n\n\n通常情况下，你已经以“常规”的方式组合好了一些项目，并希望将它们带入\
  \ Eclipse CDT 环境，书中的大多数示例项目已经包含了 makefile。此时，`Makefile` 项目的作用是将现有的 `makefile` 及其构建的文件引入\
  \ CDT 环境中。\n\n对于我们的第一个项目，我们将使用 `root_qtopia/home/src/led` 下的程序来阐述一些基本概念，并验证 CDT\
  \ 是否运行正常，以及我们是否可以在目标机上执行新构建的程序。然后，我们将更详细地查看 `led` 程序。\n\n启动 Eclipse 并选择 `File ->\
  \ New -> C Project`，像我们在 `第 6 章` 中做的那样打开 `New Project` 向导。输入项目名称“led,”，并取消勾选 `Use\
  \ default location` 复选框。现在，浏览到 `home > src > led` 并点击 `OK` 选择它。在 `Project type:`\
  \ 窗口中，展开 `Makefile project` 并选择 `Empty Project`。点击 `Finish`。项目向导会创建该项目，随后它会出现在左侧的\
  \ `Project Explorer` 窗口中。\n\n项目被创建在 `home/` 而不是默认的 `workspace` 下有一个非常特定的原因。最终的可执行文件必须对目标板可见，因此我们必须在目标机的\
  \ NFS 挂载根文件系统中将其位于某个位置。另一种方法是创建一个位于根文件系统的工作区。\n\n项目应该作为创建过程的一部分自动构建。如果没有构建，请右键点击\
  \ `Project Explorer` 视图中的 `led` 项并选择 `Build Project`。好了，我们已经构建了项目，现在如何运行它呢？\n\n\
  ### 目标机执行环境\n\n在继续之前，让我们回顾一下我们的设置。目标板具有从 NAND 闪存启动的内核，并通过从主机工作站网络挂载的根文件系统。目标机上的\
  \ `stdin`、`stdout` 和 `stderr` 连接到 `ttySAC0`，它在物理上连接到主机的 `ttyS0` 或 `ttyUSB0`。我们通过终端仿真程序\
  \ `minicom` 与运行在目标机上的 shell 通信。`图 7.4` 描述了这种设置。\n\n![image](img/F000071f07-04-9780124159969.jpg)\n\
  \n图 7.4 主机与目标机。\n\n通过 NFS 挂载根文件系统的一个结果是，我们可以在*目标机上*执行物理位于主机文件系统的程序文件。这允许我们在无需将程序固入闪存的情况下测试目标软件。当然，运行在目标机上的程序可以打开\
  \ NFS 挂载的主机卷上的文件。\n\n目标文件系统上的目录之一是 `/home`。在 `/home/src/` 下有几个子目录，每个子目录代表书中后描述的一个项目。\n\
  \n在 shell 窗口中启动 `minicom` 并启动目标板。启动完成后，在 `minicom` 窗口中执行 `ls home`。你将看到与工作站上 `~/root_qtopia/home`\
  \ 相同的文件子目录。要执行 `led` 程序，执行以下操作：\n\n```\ncd home/src/led\n./led\n```\n\n该程序打印一条问候消息，然后顺序闪烁四个\
  \ LED。顺便提一下，命令中的 `\"./` 符号表示当前目录。之所以这样做是因为当前目录通常不是普通用户路径的一部分。这样做被认为存在安全风险。\n\n请注意，Linux\
  \ 改变了我们传统的进行嵌入式编程的方式，如图 `图 7.5` 所示。嵌入系统几乎总是由 `RAM` 与 `ROM`、`PROM`、`EPROM` 或 `flash`\
  \ 等非易失内存组成。构建嵌入式系统的传统方法是创建一个程序的可执行镜像，包括所有静态链接的库函数，可能还有一个多任务内核。然后你将此镜像“烧录”到一个或多个非易失内存芯片中。当系统启动时，处理器开始直接从\
  \ `ROM` 执行此镜像。\n\n![image](img/F000071f07-05-9780124159969.jpg)\n\n图 7.5 嵌入式编程的两种视图。\n\
  \n在 Linux 视图中，程序是必须在执行前加载到内存中的“文件”。因此，我们创建了一个 `ROM` “文件系统”，其中包含系统运行所需的任何程序的文件镜像。这可能包括用于网络等功能的各种实用程序和守护进程。这些程序随后由启动初始化过程或根据需要加载到\
  \ `RAM` 中，并在那里执行。\n\n通常情况下，`C` 库并不是静态链接到这些镜像文件，而是动态链接的，这样在任何时刻内存中的任何程序都可以共享库的一个副本。\n\
  \nLinux 方法的优势之一是，我们不受限于从 `ROM` 文件系统加载程序文件。正如刚刚演示的，我们可以同样轻松地通过网络加载程序用于测试目的。\n\n###\
  \ led 程序\n\n让我们更仔细地查看 `led` 程序，以此作为理解如何在 Linux 中从用户空间访问外设的方法。用 Eclipse 编辑器打开 `led.c`。你可能想在编辑器中开启行号。在标记栏上右键点击并选择\
  \ `Show Line Numbers`。\n\n首先，注意所有 `#include` 指令旁边的“?” 符号。如果你将鼠标悬停在其中一个符号上，它会显示“Unresolved\
  \ inclusion”（未解析的包含）。这意味着 `Eclipse` 无法找到头文件，因此无法无法解析头文件中的符号。“?” 符号将会神奇消失。注意这是一个全局设置。\n\
  \n回到程序。在第 41 行左右，程序打开了 `/dev/mem`。`mem` 设备是用户程序直接引用内存的一种。三行之后，我们调用 `mmap()`。在 main\
  \ 函数中，`GPIOp` 被声明为类型 `S32410_P`。后者指向 `s3c2410-regs.h` 中的结构体，它映射了寄存器。\n\n等等，`record_sort`\
  \ 项目有问题。以下是修复方法：\n\n1. 在 `Project Explorer` 中右键点击项目项并选择底部的 `Properties`。\n2. 展开\
  \ `Properties` 对话框中的 `C/C++ General` 项并选择 `Paths and Symbols`。\n3. 确保选择了 `Includes`\
  \ 选项页。点击 `Add ...` 并输入 `/usr/local/arm/4.3/arm-none-linux-gnue/libc/usr/include`。勾选\
  \ `Add to all configurations` 和 `languages`。\n4. 再次点击 `Add ...` 并输入 `../include`。这会获取本地头文件\
  \ `s3c2410-regs.h`，它定义了硬件寄存器。勾选 `Add to all configurations` 和 `languages`。\n5. 点击\
  \ `OK`。点击 `Apply`。将询问你是否要重建索引。选择 Yes。\n6. 再次点击 `OK`。\n\nLED 连接到并行 I/O 控制器 B (`GPB`)\
  \ 的位。在使用它们之前，我们必须正确配置它们。\n\nLED 是 `GPB` 的第 5–8 位，十六进制表示为 `0x1E0`。第 49 行的 `write_reg()`\
  \ 函数将这四个位配置为输出。查看 `include/s3c2410-regs.h` 以了解该函数和 `GP_BIT()` 宏是如何工作的。第 50 行的 `set_reg()`\
  \ 函数最初将这些位设置为 1，由于它们是拉低的，所以 LED 是关闭的。\n\n\n\n\n另一个有用的程序是 `src/devmem/` 目录下的 `devmem.c`。它映射了一个内存区域，然后允许你以字节、字或长字的形式读取和写入该区域内的位置。看一眼吧。代码本身非常自明易懂。\n\
  \n## The Makefile\n\n出于几个原因，值得看一眼项目的 makefile。在 Eclipse 编辑器中打开 makefile（列表 7.1）。首先注意到的是\
  \ `CC` 的定义。为了无歧地命名 GNU 工具链，有几种相关的约定。这里显示的是由以下三部分组成的命名约定：\n\n`<处理器>-<操作系统>-<工具>`\n\
  \n![image](img/F000071f07-06-9780124159969.jpg)\n列表 7.1 用于 Led 项目的 Makefile。\n\n\
  进入 `/usr/local/4.3.2/bin`，你会发现整套这类 3 部分的文件名，它们是相应的 5 部分文件名的链接，这 5 部分由：\n\n`<处理器>-<制造商>-<操作系统>-<可执行二进制格式>-<工具>`\
  \ 组成\n\n在这种情况下（如今已很常见），制造商字段被设置为“none”。我也看到过一种包含 C 库版本的格式。但注意，`arm-linux-g++` 和\
  \ `arm-linux-gcc` 并不是链接，而是带有额外参数以识别我们要编译的 ARM 变体的 5 部分脚本。\n\n## Data Acquisition\
  \ Example\n\n现在我们已经访问了 ARM 处理器的外设空间，让我们转向一些更有趣的内容。S3C2440 包含了多通道 A/D 转换器。这通常用于屏幕，但为了测试目的，通道\
  \ 0 连接到了电位器。我们将作为一个简单数据采集示例的基础，该示例将贯穿本书的剩余部分。良好的编程实践要求硬件相关代码与操作 I/O 寄存器的代码之间有清晰的分离。至少，硬件相关代码应该与主程序分离。在\
  \ LED 示例中，硬件相关代码混合在了一个源文件中，这在程度上“作弊”了，因为目标是说明硬件访问是如何工作的，而不引入任何应用代码。\n\n创建一个名为 `measure`\
  \ 的新 Eclipse 项目，位于 `src/measure`。打开源文件 `measure.c`。首先注意到的是我们再次拥有了紧邻头文件的符号。但与其费力地重新输入头文件路径，这次我们将从\
  \ `led` 项目导出一些项目设置，并将它们导入 `measure`。\n\n按照以下步骤操作：\n\n1. 在 Project Explorer 中选择 `led`\
  \ 项目，右键点击并选择 Export……\n2. 在 Export 对话框中，展开 `C/C++` 并选择 `C/C++ Project Settings`。点击\
  \ Next。\n3. 确保选择了 `led` 项目并取消勾选 Symbols。\n4. 浏览到 `home/src/` 并输入文件名。数据将保存为 XML 文件。\n\
  5. 图 7.6 显示最后的导出对话框。点击 Finish。\n\n![image](img/F000071f07-06-9780124159969.jpg)\n\
  图 7.6 Export 对话框。\n\n接下来是将项目设置导入 `measure` 项目的步骤：\n\n1. 在 Project Explorer 中右键点击\
  \ `measure` 项目并选择 Import……\n2. 展开 `C/C++` 并选择 `C/C++ Project Settings`。点击 Next。\n\
  3. 浏览到 `home/src/` 并选择 `includes.xml`。点击 OK。\n4. 点击 Finish。\n5. 打开 `measure` 项目属性，验证包含路径是否存在。\n\
  \n程序读取 A/D 值并在 `stdout` 上打印。它还读取板上的六按键输入，并将任何按下按钮的数值值写入 LED。程序接受一个命令行参数，即两次读取之间的秒数。默认值为二。\n\
  \n现在是我对我的示例程序做一个观察的好机会。在这些示例中，几乎没有错误或“合法性”检查。如果你输入错误的内容，程序可能会崩溃。这在这个示例中不是大问题，但在需要更多输入的后续示例中可能会成为问题。\n\
  \n我觉得添加大量的错误检查代码会干扰示例想要传达的观点。如果你喜欢，可以添加一些错误检查逻辑。回到程序，需要注意的重要点是，处理开关、LED 和 A/D 转换器的大部分细节都“隐藏”在以后应用程序形式呈现数据的\
  \ API 之后。应用程序不需要关心设置外设的细节；它只需调用相应的 `init` 函数。然后它一直读写数据，直到用户终止程序。最后它“关闭”外设设备。\n\n\
  文件 `trgdrive.c` 实现了“设备驱动” API。命名为 `trgdrive` 的原因将在第 8 章阐明。有两个初始化函数：`initAD()` 和\
  \ `initDigIO()`。注意 `initDigIO()` 必须首先调用，因为它打开了 `/dev/mem` 并映射了 GPIO 空间。`initAD()`\
  \ 将 LED 位设置为输出，开关位设置为输入。\n\n读取 A/D 转换器由通用 `readAD()` 函数处理。它将通道号写入 ADC 并开始转换。转换完成后，它读取并返回\
  \ 10 位值。数字输出体现在三个函数中：`setDigOut()`、`clearDigOut()` 和 `writeDigOut()`。这些函数专门针对 Mini2440\
  \ 上的 LED 进行了适配，位模式经过了移动，以便我们可以使用最低位。“设置”一个位实际上是清空它以开启 LED。配置为输出的位。输入函数 `getIn()`\
  \ 仅返回整个 GPIO 数据寄存器。由你对数据进行适当掩码。两个“close”函数只需取消映射其相应的“init”函数所映射的内存空间。\n\n`measure`\
  \ 项目的 makefile 有几个构建目标。默认情况下，Eclipse 只知道如何构建如果存在“all”目标。在 `measure` 项目的情况下，“all”目标构建了一个被称为“模拟版本”的东西。我们将在第\
  \ 8 章讨论它。其他构建目标需要在 Eclipse 中声明。在 C/C++ 视图的右侧有一个标记为 Outline 的视图，它显示当前编辑器窗口中显示的内容大纲。该视图中有另一个标记为\
  \ Make Targets 的标签，允许我们指定备用 make 目标。图 7.7 显示由 Add Target 调出的对话框。在这种情况下，Target Name\
  \ 是 `measure`。Make Target 也是 `measure`，所以我们不需要重新输入。Eclipse 为目标名称和 make 目标相同的常见情况提供了快捷方式。点击\
  \ create 按钮。现在在 Make Targets 视图中，在 `measure` 项目下，右键点击 `measure` 目标并选择 Build Make\
  \ Target。\n\n\n\n\n在目标机上运行程序。ADC 返回 0–`1,023` 范围内的 10 位数据。用小螺丝刀转动电位器，你应该看到报告的值发生相应的变化。按下按钮并观察\
  \ LED 的显示模式。\n\n在本章中，我们学习了如何访问 Mini2440 目标板上的外设寄存器。第 8 章将更深入地探讨调试主题。\n\n# 第 8 章：嵌入式软件调试\n\
  \n如果调试是移除 Bug 的过程，那么编程就是引入 Bug 的过程。\n\nEdsger W. Dijkstra\n\n在第 6 章中，你看到了 Eclipse\
  \ 是如何与 Gnu 调试器 `GDB` 结合得非常紧密的。在本章中，我们将查看 `GDB` 的其他功能，并探索如何在目标板上使用 `GDB`。我们还将考虑一种简单的高级仿真方法，这在开发早期阶段非常有用。\n\
  \n## 使用 Eclipse 进行远程调试\n\n在典型的桌面环境中，目标程序运行在调试器相同的机器上。但在我们的嵌入式环境中，带有 `GDB` 的 Eclipse\
  \ 运行在主机工作站，而被调试的程序运行在 ARM 目标机上。你可以将 `GDB` 认为具有客户端和服务器端，如图 8.1\n\n图 8.1 `GDB` 的客户端/服务器本质。\n\
  \n将目标机连接到 `gdb` 串口协议有两种方法：\n\n*   `gdb stubs`：一组链接到目标程序的函数。`gdb stubs` 是一种仅限 RS-232\
  \ 的解决方案。\n*   `gdbserver`：运行在目标机上的独立程序，它反过来运行被调试的程序。`gdbserver` 的优势是它完全独立于目标程序。换句话说，无论是否远程调试，目标机的构建都是相同的。`gdbserver`\
  \ 的另一个优势是它可以通过以太网运行。最后，Eclipse 使用了 `gdbserver`，这是使用它的最佳理由。\n\n`gdbserver` 是 `/usr/local/arm/4.3.2`\
  \ 中 ARM 交叉工具链的一部分。有趣的是，在 `arm-none-linux-gnueabi/libc` 下分布着六个不同的 `gdbserver` 副本。通过尝试，我发现\
  \ `armv4t/usr/bin` 下是有效的。必须将 `gdbserver` 文件复制到目标文件系统中，以便 Mini2440 可以执行它。一个良好的位置是\
  \ `/usr/bin`，因为它在 `PATH` 中。\n\n为了在 `GDB` 下运行测量程序，你首先 `cd` 进入 `src/measure` 目录并执行：\n\
  \n```bash\ngdbserver:10000 measure\n```\n\n`gdbserver` 的参数为：\n\n*   冒号前的网络端口号。标准格式为“host:port”，其中“host”可以是主机名或点分位形式的\
  \ IP 地址，但 `gdbserver` 会忽略主机部分。只要不与使用的其它端口号冲突，端口号可以是任意的。通常，1024 以下的端口号保留给已建立的网络协议（如\
  \ HTTP 端口 80），因此最好选择 1023 以上的数字。端口号 10000 恰好是 Eclipse 调试器的默认值。\n*   目标程序名称。\n* \
  \  目标程序的参数（如果有）。\n\n`gdbserver` 的响应类似于如下内容：\n\n```text\nProcess measure created;\
  \ pid = 703\n```\n\n你的 `pid` 值可能会不同。这表示 `gdbserver` 已加载程序，并正在等待在指定的端口开始调试会话。\n\n\
  ### 远程调试启动配置\n\n我们需要为远程调试准备不同的调试启动配置。在 Project Explorer 视图中选中 `measure` 项目，通过 **Run\
  \ > Debug Configurations**… 打开调调试配置对话框，或者点击可爱的小虫子图标旁边的向下箭头并选择 Debug Configurations……。尽管有一个名为\
  \ C/C++ Remote Application 的类别，但我们将像之前处理 `record_sort` 那样，在 C/C++ Application 下创建此新配置。\n\
  \n1.  选中 `C/C++ Application`，点击 **New** 按钮。这将弹出我们在第 6 章中看到的调试配置对话框，且名称和项目条目已填充。\n\
  2.  我们需要填写 `C/C++ Application` 条目。点击 **Search Project**……。这将弹出一个列表项目中找到的所有可执行文件的对话框。选择\
  \ `measure` 并点击 **OK**。\n3.  检查图 8.2 中的内容。\n4.  ……（此处原文为乱码）\n\n![image](img/F000083f08-02-97800224159999.jpg)\n\
  \n图 8.2 偏好设置。\n\n\n\n\n两个 LED 分别作为冷却器和报警器。它们在 `measure/` 目录下的 `driver.h` 中被定义为 `COOLER`\
  \ 和 `ALARM`。温控器本身本质上是一个基于指示温度具有三个状态的简单状态机：\n\n* 正常（Normal）\n* 高（High）\n* 限制（Limit）\n\
  \n对于每个状态，采取的操作和下一个状态如下：\n\n**当前状态：Normal**\n温度高于设定值 + 死带\n开启 `COOLER`\n下一个状态= `High`\n\
  温度高于限制值\n开启 `ALARM`\n下一个状态= `Limit`\n\n**当前状态：High**\n温度低于设定值—死带\n关闭 `COOLER`\n\
  下一个状态= `Normal`\n温度高于限制值\n开启 `ALARM`\n下一个状态= `Limit`\n\n**当前状态：Limit**\n温度低于限制值\n\
  关闭 `ALARM`\n下一个状态= `High`\n温度低于设定值—死带\n关闭 `COOLER`\n下一个状态= `Normal`\n\n该状态机只是对 `state`\
  \ 变量的一个庞大的 `switch()` 语句。\n\n这是你进行实际编程的机会。复制 `measure.c` 并将其重命名为 `thermostat.c`。由于\
  \ `thermostat.c` 已经是 `measure` 的 `makefile` 中的先决条件，你只需要在项目资源管理器（Project Explorer）视图中右键点击\
  \ `measure` 并选择刷新（Refresh）。\n\n在 `thermostat.c` 中实现该状态机。将变量 `setpoint`、`limit` 和\
  \ `deadband` 声明为全局整数。我建议将 `readAD()` 返回的值除以 10，以得到一个合理的温度值，并使其更容易调节电位。选择一个合适的 `setpoint`\
  \ 以及一个高于它几“度”的限制值。正负一计数的死带可能足够了。\n\n## 主机工作站作为调试环境\n\n尽管远程 GDB 为我们提供了观察目标程序行为的良好窗口，但有充分的理由在主机开发机上进行初始调试是有用的。首先，主机在项目启动时即可可用，可能在任何实际目标硬件可用或工作之前很久。在许多情况下，使用模拟比使用真实硬件更容易准确地测试边界条件。主机拥有文件系统，可以用于创建测试脚本并记录测试结果。\n\
  \n当你刻画大多数嵌入式系统软件的内容时，通常会发现大约 5%，可能是 10% 的代码直接处理硬件。其余代码与硬件无关，因此只要代码结构得当以隔离依赖于硬件的元素，就不需要硬件进行测试。\n\
  \n这里的想法是构建一个简单的模拟器来代表硬件 I/O 设备。然后你可以通过通过键盘提供刺激并在屏幕上注意输出来运行应用程序。在测试的后期阶段，你可能想用基于文件的“脚本驱动程序”代替屏幕和键盘，以创建可重复的测试用例。\n\
  \n查看 `measure/` 目录下的 `simdrive.c`。该文件暴露了与 `trgdrive.c` 相同的 API，但使用共享内存区域与另一个进程通信，该进程在屏幕上显示数字输出并通过键盘接受模拟输入值。此功能在\
  \ `devices.c` 中实现。共享内存区域由类型为 `shmem_t`（定义在 `driver.h` 中）的数据结构组成，包含一个模拟输入字段和一组假设连接到\
  \ LED 的数字输出。它还包含一个进程 ID 字段（`pid_t`），设置为 `devices` 进程的 `pid`，允许温控器进程在数字输出变化时发出信号。\n\
  \n`devices` 创建并初始化共享内存区域。在 `simdrive` 中，`initAD()` 挂接到之前创建的共享内存区域。`readAD()` 仅返回共享内存中\
  \ `a2d` 字段的当前值。`setDigOut()` 和 `clearDigOut()` 函数相应修改 `leds` 字段，然后信号 `devices` 进程更新屏幕显示。[图\
  \ 8.5] 以图形形式说明了这一过程。\n\n![image](img/F000083f08-05-9780124159969.jpg)\n\n图 8.5 温控器模拟。\n\
  \n温控器模拟版本的可执行文件称为 `thermostat_s`（`_s` 代表 simulation），它是项目 `makefile` 中的默认目标。事实上，当你执行刷新操作将\
  \ `thermostat.c` 引入 Eclipse 时，它应该已经自动构建了。在编辑 `thermostat.c` 后再次构建，请选择项目菜单并点击全部构建（Build\
  \ All）。\n\n要构建 `devices` 程序，我们需要向项目中添加另一个目标。在项目资源管理器中右键点击 `measure` 并选择 Make targets\
  \ -> Create。目标名称（Target Name）为“devices”，Make Target 相同。继续构建 `devices` 目标。\n\n在 shell\
  \ 窗口中运行 `devices`。要调试 `thermostat_s`，可以使用我们在第 6 章为 `record_sort` 项目创建的调试启动配置：\n\n\
  1. 调出调试配置（Debug Configurations）对话框，选择针对 `record_sort` 项目的。\n2. 将名称更改为“host”。我们将使用此配置进行所有的模拟调试。\n\
  3. 将项目更改为“measure”，并选择 `thermostat_s` 作为应用程序。\n4. 点击 **Apply**（应用），然后点击 **Debug**（调试）以进入调试视图，此时程序将停在\
  \ `main()` 的第一行可执行代码。\n\n### 高级断点功能\n\n`thermostat_s` 程序为我们提供了探索断点一些高级功能的机会。在状态机\
  \ `switch()` 语句顶部设置一个断点。现在转到调试视图右上角的断点（Breakpoints）视图，右键点击你刚刚创建的断点项。选择右键菜单底部的断点属性（Breakpoint\
  \ Properties）。这会弹出图 8.6 所示的空白对话框。\n\n![image](img/F000083f08-05-9780124159969.jpg)\n\
  \n图 8.6 断点属性。\n\n操作（Actions）可以绑定到断点上，这样当断点被触发时，就会执行绑定的操作。CDT 提供了四类预定义操作：\n\n* **播放声音（Play\
  \ Sound）**——当触发断点时播放声音文件。也许断点每隔小时才会发生一次。当你听到适当的哔声时，你可以去做些事情，回来查看发生了什么。声音文件可以是 `.wav`、`.mid`、`.au`\
  \ 或 `.aiff`。\n* **日志消息（Log Message）**——向控制台输出消息。要查看消息，你必须在控制台视图中选择日志操作（Log Action）。\n\
  * **运行外部工具（Run External Tool）**——执行在 Eclipse 中配置为外部工具的程序。例如，程序可能运行在远程设备上。你可以配置断点向桌面发送电子邮件或短信。程序从运行\
  \ > 外部工具 > 外部工具进行安装和配置。\n* **恢复（Resume）**——在指定的延迟后自动恢复程序。再次，如果程序远程运行，这可能是让它在断点后继续运行唯一方法。\n\
  \n让我们创建一个声音操作。在 Fedora 14 KDE 中，大多数声音文件 `.wav` 位于 `/usr/share/` 的子文件夹中。一些在 `sounds/alsa/`\
  \ 中。许多位于 `kde4/apps/` 的 `sounds/` 文件夹下：\n\n| kbounce | kmousetool |\n| :--- | :---\
  \ |\n| knetwalk | kolf |\n| korganizer | kreversi |\n\n在 `/usr/lib/openoffice.org/basis.3/share/gallery/sounds/`\
  \ 下也有很多。方法如下：\n\n1. 在 Actions 对话框中点击 **New**。默认选择 Sound Action。\n2. 给它一个命名。 “beep”怎么样？\n\
  3. 浏览到包含 `.wav` 文件的文件夹并选择一个。要听听听起来如何，点击 Play Sound。\n4. 点击 **OK**。\n\nBeep 操作现在出现在可用操作列表中。以类似的方法创建一个日志操作（Log\
  \ action）。让它打印消息“Hit the breakpoint at the switch statement.”\n\n\n\n\n\n选择“可用操作”列表中的每一项并点击\
  \ `Attach`。它们现在都将出现在此断点的 `Actions` 列表中。让程序运行。当它命中断点时，你应该能听到提示音。在 `Console` 视图中，找到\
  \ `Console` 菜单右侧的 `Display Selected Console` 下拉菜单。选择 `Log Action Messages`。要返回程序输出，选择\
  \ `[C/C++ Application]` `thermostat_s`。\n\n再次弹出 `Breakpoint Properties` 对话框。在左列中选择\
  \ `Common` 以弹出图 8.7 所示的对话框。这列出了关于断点的一些基本信息，例如其所在的文件和行号以及其启用状态。它还为我们提供了两种控制断点的方法。\n\
  \n![image](img/F000083f08-07-9780124159969.jpg)\n\n图 8.7 通断点属性。\n\n`Condition` 允许我们指定一个布尔表达式来控制是否触发断点。如果表达式的值为真，则触发断点；否则，将其忽略。该表达式可以包含任何程序变量。例如，我们只在预期状态发生变化时才对\
  \ `switch()` 语句上的断点感兴趣。在每次循环过循环时都触发断点将是枯燥且低效的。因此，我们可以输入条件：\n\n```\nvalue > setpoint\
  \ + deadband\n```\n\n然后当触发断点时，我们可以单步执行代码以确保状态已改变且冷却器已开启。然后我们可以将条件改为：\n\n```\nvalue\
  \ > limit\n```\n\n并观察在该转换期间发生了什么。当然，我们还会反转这一过程，观察状态转换变回正常。\n\n`Common` 对话框中的 `Ignore\
  \ count` 是断点在被触发之前会被忽略的次数。例如，如果我们输入 `10`，那么在头 10 次遇到断点时，它都会被忽略，并在第 11 次遇到时最终触发。这对于运行固定次数的\
  \ `for` 循环可能有用，因为我们可能只对循环的第一次和最后一次感兴趣。\n\n使用这些高级断点功能，通过向设备程序输入不同的 `A/D input` 值来调试你的温控器程序，并观察温控器状态机的如何响应。\n\
  \n当你觉得程序运行正常时，为目标板重新构建它。你需要另一个 `make` 目标。例如，将其命名为 `ARMthermo`。取消勾选 `Same as the\
  \ target name` 并在 `Make target` 中输入全部。取消勾选 `Use builder settings` 并在 `Build` 命令中输入\
  \ `make TARGET=1`。在创建此目标之前，删除 `thermostat.o`。否则，它将不会为 ARM 重新编译，链接器会报错提示有错误的的对象文件。\n\
  \n要在目标机上调试 `thermostat_t`，你需要修改在章节开头为 `measure` 程序创建的调试启动配置。弹出 `Debug Configurations`\
  \ 对话框并选择 `measure` 配置。将名称更改为“target”，因为我们将使用此配置进行所有的目标调试。将 `C/C++ Application` 中的文件名从\
  \ `measure` 改为 `thermostat_t`。这些是所需的全部更改。点击 `Apply`。\n\n在目标板上，运行 `gdbserver:10000\
  \ thermostat_t`。回到 Eclipse，点击 `Debug`。你现在正在目标板上调试温控器程序。\n\n## 调试器服务框架\n\n尽管功能强大，但我们迄为止看到的远程调试过程有点繁琐。你必须通过\
  \ `minicom` shell 手动启动 `gdbserver`，而程序控制台就在那里。如果点击 `Debug` 时让 `gdbserver` 自动启动该不是很好吗？并且程序的\
  \ I/O 显示在 Eclipse 控制台视图中。这就是 `DSF` 为我们做的事情。\n\n`DSF` 构建在 `Remote System Explorer\
  \ (RSE)` 之上，这是一组允许你直接处理远程系统上的文件和文件夹等资源的工具。`RSE` 反过来使用 `SSH`（即 `Secure Shell`）与远程系统建立通信。遗憾的是，我们的目标文件系统不包含\
  \ `SSH`。因此，在我们玩 `RSE` 和 `DSF` 之前，我们必须在目标机上安装 `SSH`。\n\n### 安装 SSH\n\n`SSH` 是一种网络协议，用于在不安全网络通过安全通道连接的联网计算机之间进行安全数据通信、远程\
  \ shell 服务、命令执行和其他安全网络服务。它是 `Telnet` 以及其他不安全的远程 shell 协议（如 `Berkeley rsh` 和 `rexec`\
  \ 协议）的替代品，这些协议以明文发送信息（特别是密码），使得它们容易被数据包分析捕获和泄露。`SSH` 使用的加密旨在为不安全网络上的数据提供机密性和完整性。\n\
  \n目前有很多 `SSH` 的实现，其中许多是专有的。还有一个开源版本，可能并不令人意外，被称为 `OpenSSH`。我们将使用这种。\n\n在我们的目标板上安装\
  \ `OpenSSH` 证明是相对简单的，因为有人为 `Mini2440` 完成了所有工作并慷慨地将结果发布在 Google 组中。请查看 Resources\
  \ 部分的 URL。从顶级组页面，进入 `Source` 然后点击 `Browse`。你会看到五个文件列表、一个 `README`、一个脚本和三个压缩 tar\
  \ 包。`SSH` 构建在两个软件包之上：安全套接层 (`SSL`) 和加密库 `zlib`。将所有文件下载到工作站的方便位置。\n\n查看 `README.txt`\
  \ 文件。它概述了三个步骤：运行脚本构建软件包、将文件复制到目标系统的相应位置、以及运行 `SSH 守护进程以验证其工作正常。第一步是运行 `make clean`，它会删除之前构建产生的所有中间文件（如果有的话）。下一步是\
  \ `configure`，该脚本首先检查执行它的系统以确保其能够构建软件包。然后它根据找到系统和传递给脚本的任何参数创建 `Makefile` 以及构建软件包所需的任何其他文件。`configure`\
  \ 脚本通常接受修改构建方式的参数。\n\n`make` 步骤实际上使用 `configure` 脚本创建的文件来构建软件包。`make` 的输出是一系列文件、库或可执行文件，位于当前目录或其子目录中。这些文件通常需要移动到其他位置才能有用。这就是\
  \ `make install` 命令的作用。在许多情况下，`make install` 必须以 root 用户身份运行，因为它引用的目录具有 root 权限。在这种情况下，取决于你最初选择加载文件的位置，你可能不需要\
  \ root。\n\n\n\n\n然而，你需要 root 权限才能执行 `README.txt` 中的其余步骤，因为目标文件系统大部分由 root 拥有。`README.txt`\
  \ 中的第 2 步实际上是 `make install` 过程的延续，但无法将其折叠进 `Makefile` 或脚本中，因为作者不知道你目标文件系统的位置。你被指示将几个文件拷贝到\
  \ `usr/libexec`。结果发现该目录在我们的目标文件系统中不存在，所以你必须先创建它。另一方面，`usr/local/etc` 是存在的，所以你不需要创建它。\n\
  \n`/var/` 目录很有意思。用编辑器打开 `root_qtopia/etc/init.d/rcS`。这是 Linux 在目标板卡上首次启动时执行的脚本。对于我们的目的来说，有趣的部分从大约第\
  \ 30 行的 `/bin/mount –n –t ramfs none /var` 开始。这表示在 `/var` 处挂载一个 RAM 文件系统。`/var`\
  \ 代表经常变化的“变量”数据，比如日志文件等。如果我们的根文件系统挂载在 NAND 闪存上，并将 `/var` 目录作为其的一部分，会导致闪存芯片产生不必要的磨损，并因向闪存写入日志文件导致性能下降。因此，`/var`\
  \ 目录挂载在位于 RAM 中的文件系统上。此外，这意味着 `/var` 的内容在重启后不会保留。\n\n接下来的目的是 `README.txt` 指导你在 `/var`\
  \ 下创建几个目录。`/var/run` 和 `/var/empty` 已经存在，因为它们是由 `rcS` 脚本创建的。你需要做的是向 `rcS` 添加行 `mkdir\
  \ –p /var/log/empty/sshd`。你还必须向 `rcS` 添加行 `/usr/sbin/sshd`，以便让 SSH 守护进程在启动时运行。重启目标设备并验证\
  \ `sshd` 正在运行。\n\n###为 Root 设置密码\n\n当 SSH 连接到远程系统时，即使你登录的用户不需要密码，它也会坚持要求输入密码，而我们目标板卡上的\
  \ root 用户正是如此。你通过 `passwd` 工具完成此操作。在目标板卡上执行 `passwd`。它响应如下：\n\n```\nChanging password\
  \ for root\nNew password:\n```\n\n然后它会提示你验证密码。现在，每当你启动板卡时，都必须输入密码。\n\n### 配置 RSE\n\
  \n启动 Eclipse 并打开 RSE 视图。你会发现左侧的 Project Explorer（项目资源）视图被一个标记为 Remote Systems（远程系统）的视图取代了，编辑器下的视图集合被名为\
  \ Remote System Details（远程系统详情）的内容取代。目前 Remote Systems 中列出的唯一项是 `Local`，即你的工作站。展开该项显示\
  \ `Local Files`（本地文件）和 `Local Shells`（本地 Shell）。展开 `Local Files` 以浏览文件系统（图 8.8）。\n\
  \n![image](img/F000083f08-08-9780124159969.jpg)\n\n图 8.8 Remote Systems 视图。\n\n\
