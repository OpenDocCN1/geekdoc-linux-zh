  \n# 第 9 章：Posix 线程\n\n只有当你的时间毫无价值，Linux 才是免费的。\n\nJamie Zawinski\n\n我们在上一节中开发的温控器并不十分实用，因为操作参数、设定点、限制值和死区都是被硬编码在程序中的。任何实用的温控器都应该让这些参数变得对用户可调。在这种情况下，我们可能会发明一种简单的命令协议，通过控制台更改这些参数。\n\
  \n我们该如何实现这样的进程？在旧的 DOS 时代，我们可能会使用 `kbhit()` 函数来轮询键盘活动。但 Linux 是一个多任务系统。轮询是低劣的。我们需要的是一个独立的执行线程，它等待控制台上的行文本，解析该行并执行操作。\n\
  \n我们可以使用 `fork()` 来创建一个新进程。代码列表 9.1 以伪代码形式展示了一种可能的实现方法。我们首先创建一个共享内存空间，然后通过 `fork`\
  \ 创建一个新的子进程。子进程监控 `stdin`，并将任何有效命令的结果发布到共享内存区域中相应的条目。父进程就是我们已经见过的温控器程序。\n\n![image](img/F000095f09-01-9780124159969.jpg)\n\
  \n代码列表 9.1 温控器的 Fork 实现。\n\n但可能存在更高效的实现方法。记得第 3 章 中提到的，Linux 进程可以有多个执行线程，而且这些线程都共享进程的内存空间。那么，创建一个一直停留在\
  \ `stdin` 上等待命令的线程怎么样呢？具体来说，在本章中，我们将探索 Posix 线程。\n\nPosix（也写作 POSIX）是一个缩写，意为“可移植操作系统接口”（Portable\
  \ Operating System Interface），并为了方便起额外加了一个 X。POSIX 代表了一系列标准，定义了基于 UNIX 的可移植操作系统的各个方面。这些标准由电气电子工程师学会（IEEE）和国际标准组织（ISO）共同维护。在\
  \ IEEE 和开放组（The Open Group）的协作下，各种文档被合并成了一个单一标准（参见资源部分）。\n\n通常来说，Linux 符合 Posix。命令行\
  \ Shell、实用程序和系统接口多年来都经过了升级，以满足 Posix 要求。但在多线程的背景下，我们在这里特别感兴趣的是被称为 1003.1 c 的 Posix\
  \ Threads 接口。\n\n用于 Pthreads API 原型的头文件是 `pthread.h`，它位于库头文件的默认目录 `/usr/include`\
  \ 中，或者在我们的交叉工具链中，位于 `/usr/local/arm/4.3.2/arm-none-linux/gnueabi/libc/usr/include`。\n\
  \n## 线程\n\nRTOS 通常将线程称为任务（tasks）。它们几乎是同一件事。线程是封装在函数中的独立执行线程。线程拥有自己的堆栈，称为其*上下文*（context）。\n\
  \n![image](img/F000095u09-01-9780124159969.jpg)\n\n通过调用 `pthread_create()` 并传入以下参数来创建线程：\n\
  \n- `pthread_t`—一个表示或标识线程的*线程对象*。`pthread_create()` 会根据需要对其初始化。\n- 指向线程*属性*（attribute）对象的指针。通常它是\
  \ `NULL`。稍后会详细介绍。\n- 指向*启动例程*（start routine）的指针。启动例程接收一个 `void` 类型指针参数并返回一个 `void`\
  \ 类型指针。\n- 调用启动例程时传递给该函数的参数。\n\n线程可以通过调用 `pthread_exit()` 或直接从其启动函数返回来终止。`pthread_exit()`\
  \ 的参数是启动函数的返回值。\n\n就像父进程可以通过调用 `waitpid()` 等待子进程完成，线程也可以通过 `pthread_join()` 等待另一个线程完成。`pthread_join()`\
  \ 的参数是要等待的线程的线程对象，以及一个存储线程返回值的地方。调用线程将被阻塞，直到目标线程终止。线程之间没有像进程那样的父子关系，因此一个线程可以加入任何其他线程。\n\
  \n线程可以通过调用 `pthread_self()` 确定自己的 ID。最后，线程可以通过调用 `sched_yield()` 自愿让出处理器。\n\n注意，上述的大多数函数都返回一个\
  \ `int` 值。这反映了 Pthreads 处理错误的方法。Pthreads 函数不是通过在全局变量 `errno` 中报告错误，而是通过其返回值来报告错误。附录\
  \ B 对 Pthreads API 提供了更完整的描述，包含了所有错误代码列表。\n\n### 线程属性\n\nPOSIX 提供了一种开放的机制，通过使用*属性对象*（attribute\
  \ objects）来扩展 API。对于每种类型的 Pthreads 对象，都有一个对应的属性对象。该属性对象实际上是属性对象的扩展参数列表。\n\n通常来说，Linux\
  \ 符合 Posix。命令行 Shell、实用程序和系统接口多年来都经过了升级，以满足 Posix 要求。但在多线程的背景下，我们在这里特别感兴趣的是被称为 1003.1\
  \ c 的 Posix Threads 接口。\n\nPOSIX 提供了一种开放的机制，通过使用*属性对象*来扩展 API。对于每种类型的 Pthreads 对象，都有一个对应的属性对象。该属性对象实际上是属性对象的扩展参数列表。\n\
  \n一个重要的哲学点是，所有的 Pthreads 对象都被认为是“不透明的”（opaque）——至少在大多数情况下是如此。我们很快会看到一个例外。这意味着你永远不会访问对象本身的成员。所有访问都是通过获取和设置成员的\
  \ API 函数完成的。这允许通过简单的定义对应的 get 和 set 函数对来向 Pthreads 对象添加新参数。在简单的实现中，get 和 set 函数可能仅仅是一对访问属性数据结构成员的宏。\n\
  \n![image](img/F000095u09-02-9780124159969.jpg)\n\n在使用属性对象之前，必须先对其进行初始化。然后，可以使用相应的函数设置或检索为该对象定义的任何属性。这必须在调用\
  \ `pthread_create()` 使用属性对象之前完成。如果需要，属性对象还可以被“销毁”。注意，同一个属性对象可以用于创建多个线程。\n\n线程对象的唯一强制属性是“分离状态”（detach\
  \ state）。它决定了线程在终止时是否可以被加入。默认分离状态是 `PTHREAD_CREATE_JOINABLE`，意味着线程可以在终止时加入。另一种是\
  \ `PTHREAD_CREATE_DETACHED`，意味着线程不能被加入。\n\n如果你需要线程的返回值或希望线程按特定顺序终止，那么加入是有用的。否则，创建分离线程更好。可加入线程的资源在另一个线程加入它之前无法回收，而分离线程的资源在终止后即可回收。\n\
  \n还有若干可选的调度策略属性。\n\n### 同步——互斥锁（Mutexes）\n\n一旦引入了第二个独立的执行线程，我们就创造了资源冲突的可能。考虑这个有些人为的例子：两个线程，每个都想在单个共享打印机上打印信息“I\
  \ am Thread n”，如图 9.1 所示。在没有任何同步机制的情况下，结果可能是“II a amm Taasskk 12.”\n\n![image](img/F000095f09-02-9780124159969.jpg)\n\
  \n图 9.1 资源冲突。\n\n\n\n\n我们需要某种方法来调节打印机的访问，以便一次时间只有一个任务可以使用它。\n\n`mutex`（“互斥”的缩写）就像一把钥匙，用于控制对资源的访问。只有持有钥匙的线程才能使用该资源。为了使用该资源（在此例为打印机），线程必须首先通过调用适当内核服务来`acquire`密钥（`mutex`）图\
  \ 9.2]。如果密钥可用，即资源（打印机）当前未被他人占用，线程允许继续执行。在使用打印机后，该线程会释放互斥锁，以便其他线程可以使用它。\n\n![image](img/F000095f09-03-9780124159969.jpg)\n\
  \n图 9.2 使用互斥锁解决资源冲突。\n\n然而，如果打印机正在使用中，该线程将被阻塞，直到当前持有 `mutex` 的线程释放它。在 `mutex` 使用期间，可能有任意数量的线程尝试获取\
  \ `mutex`。它们都将被阻塞。等待的线程将按照优先级顺序或调用 `pthread_mutex_lock()` 的顺序进入队列。线程在 `mutex` 处的排队方式可能是内置在内核中的，也可能是创建\
  \ `mutex` 时的配置选项。\n\n![image](img/F000095u09-03-9780124159969.jpg)\n\nPthreads 互斥\
  \ API 遵循与线程 API 非常相似的模式。有一对用于初始化和销毁互斥锁对象的函数，以及一组操作互斥锁对象的函数。列表还显示了初始化静态分配互斥对象的另一种方法。`PTHREAD_MUTEX_INITIALIZER`\
  \ 提供了与 `pthread_mutex_init()` 相同的默认值。\n\n在互斥锁上可以执行两种操作：`lock` 和 `unlock`。如果 `mutex`\
  \ 不可用，`lock` 操作将导致调用线程阻塞。还有另一个名为 `trylock` 的函数，允许你在不阻塞的情况下测试 `mutex` 的状态。如果 `mutex`\
  \ 可用，`trylock` 返回成功并锁定 `mutex`。如果 `mutex` 不可用，它将返回 `EBUSY`。\n\n### 互斥锁属性\n\n互斥锁属性遵循与线程属性相同的基本模式。有一对函数用于创建和销毁互斥锁属性对象。我们将稍后讨论\
  \ `pshared` 属性。很快我们还会涉及其他属性。\n\n互斥锁属性“type”（类型）实际上是 Linux 对 Pthreads 的非可移植扩展。Pthreads\
  \ 标准明确允许非可移植扩展。唯一的要求是任何非可移植符号的名称后都必须加上 `_np`。\n\n互斥锁类型随后被纳入标准。\n\n![image](img/F000095u09-04a-9780124159969.jpg)![image](img/F000095u09-04b-9780124159969.jpg)\n\
  \n如果一个线程尝试锁定它已经锁定的 `mutex` 会发生什么？通常情况下，该线程会直接挂起。“type”属性改变了线程尝试锁定其已锁定的 `mutex` 时的行为。type\
  \ 的可能值为：\n\n*   `Normal`（普通）。如果一个线程尝试锁定它已持有的 `mutex`，它将被阻塞，从而导致死锁。普通互斥锁不进行一致性或合理检查。\n\
  *   `Error checking`（错误检查）。如果一个线程尝试递归锁定错误检查互斥锁，锁函数将立即返回错误代码 `EDEADLK`。此外，如果 `unlock`\
  \ 函数由 `mutex` 的当前所有者以外的线程调用，它将返回错误。\n*   `Recursive`（递归）。递归互斥锁允许线程成功地多次锁定同一个 `mutex`。它会计算\
  \ `mutex` 被锁定的次数，并要求在 `mutex` 进入未锁定状态之前调用相同次数的 `unlock` 函数。这种类型还会检查 `mutex` 是否是由锁定它的同一线程解锁的。\n\
  *   `Default`（定-`-` 默认）。标准规定，如果尝试递归锁定，这种类型将导致“未定义行为”。它还说，实现可以将 Default 映射到其他类型之一。\n\
  \n可选地，Pthreads 互斥锁可以实现优先级继承（priority inheritance）或优先级顶层（priority ceiling）协议，以避免优先级反转。互斥锁属性\
  \ `protocol` 可以设置为“none”、“priority inheritance”或“priority ceiling”，`prioceiling`\
  \ 属性设置优先级顶层的值。\n\n### 解决资源共享问题——优先级反转\n\n使用互斥锁解决资源冲突可能会导致微妙的性能问题。考虑 图 9.3 所示的情况。线程\
  \ 1 和 2 都需要访问受 `mutex` 保护的公共资源。线程 1 读取队列，线程 2 写入队列。显然，每个线程都需要对队列进行独占访问，因此我们用 `mutex`\
  \ 保护它。\n\n![image](img/F000095f09-06-9780124159969.jpg)\n\n图 9.5 通过条件变量进行通信。\n\n\
  线程 1 将锁定 `mutex` 然后检查队列是否有任何数据。如果有，线程 1 读取数据并解锁 `mutex`。然而，如果队列为空，线程 1 需要在某处阻塞，直到线程\
  \ 2 写入某些数据。线程 1 必须在阻塞之前解锁 `mutex`，否则线程 2 将无法写入。但在线程 1 解锁 `mutex` 和阻塞之间存在时间间隙。在此期间，线程\
  \ 2 可能会执行并无法没有人在队列上阻塞。\n\n条件变量通过在锁定 `mutex` 的情况下进行等待（阻塞）来解决这个问题。内部，条件等待函数会解锁 `mutex`\
  \ 允许线程 2 继续执行。当条件等待返回时，`mutex` 会再次被锁定。\n\n\n\n条件变量的基本操作是 `signal` 和 `wait`。`signal`\
  \ 唤醒等待该条件的其中一个线程。线程唤醒的顺序取决于调度策略。线程还可能执行 `timed wait`，即如果在指定的时间间隔在条件被信号触发之前过期，等待将返回一个错误。线程还可以对条件进行\
  \ `broadcast`（广播），这会唤醒等待该条件的所有线程。\n\n### 条件变量属性\n\nPthreads 并没有为条件变量定义任何强制性属性，尽管至少有一个可选属性。\n\
  \n## 线程的终止与取消\n\n线程可以以自愿或非自愿的方式终止。线程可以通过简单的返回或调用 `pthread_exit()` 来自终止。在后者情况下，在终止之前，线程通过调用\
  \ `pthread_cleanup_push()` 注册的所有 `cleanup handlers`（清理处理程序）会被调用。\n\n大多数线程运行在无限循环中。只要系统通电，线程就会一直运行并执行其任务。有些线程启动、完成工作并结束。但在某些情况下，允许一个线程非自愿地终止另一个线程是有用的。也许是用户按了\
  \ CANCEL 按钮来停止长时间的搜索操作。也许该线程是一个冗余数值算法的一部分，由于另一个线程已经解决了问题，它不再被需要了。Pthreads 取消机制为不再需要的线程提供了有序关闭的方法。\n\
  \n但取消必须谨慎进行。你不能在线程执行的任意任意停止它。假设它锁定了一个互斥锁（mutex）。如果你终止了一个持有互斥锁的线程，该互斥锁将永远无法被解锁。线程可能分配了一个或多个动态内存块。如果线程被终止，这些内存如何返回呢？\n\
  \nPthreads 允许每个线程管理自己的终止，以便线程在实际终止之前释放和/或返回任何全局资源。因此，当你取消一个线程时，你通常不是立即停止它，而是要求它在安全或方便时尽快自终止。\n\
  \nPthreads 支持三种取消模式（图 9.6），编码为称为 `cancellation state`（取消状态）和 `cancellation type`（取消类型）的两个位。线程可以选择禁用取消，因为它正在执行一个必须完成的操作。默认模式是\
  \ Deferred（延迟），这意味着取消只能在特定点（称为 `cancellation points`，取消点）发生，在这些点上，程序会测试线程是否被请求终止。大多数可以无限阻塞的函数，例如等待条件变量或读取或写入文件，都应该是取消点，并且在\
  \ Posix 规范中被定义为此。\n\n![image](img/F000095f09-07-9780124159969.jpg)\n\n图 9.6 取消模式。\n\
  \n虽然异步取消模式看起来是一个好主意，但它很少是安全的。这是因为从定义上来说，你不知道线程接收到取消请求时处于什么状态。它可能刚刚调用了 `pthread_mutex_lock()`。互斥锁锁定了吗？不知道。因此，在异步取消模式生效期间，你无法安全地获取任何共享资源。\n\
  \n![image](img/F000095u09-06-9780124159969.jpg)\n\n线程可以通过调用 `pthread_cancel()` 来取消另一个线程。`pthread_setcancelstate()`\
  \ 和 `pthread_setcanceltype()` 允许线程设置其取消模式。注意，这些函数分别返回状态和类型之前的值。函数 `pthread_testcancel()`\
  \ 允许你创建自己的取消点。如果线程未被请求终止，它将立即返回；否则，它不会返回。\n\n### 清理处理程序\n\n当线程被请求自终止时，在线程安全终止之前，可能有一些事情需要被“清理”。例如，它可能需要解锁互斥锁或返回动态分配的内存缓冲区。这就是\
  \ `cleanup handlers` 的作用。每个线程在概念上都有一个活动清理处理程序的栈。处理程序通过 `pthread_cleanup_push()`\
  \ 推送到栈上，并在线程被取消或调用 `pthread_exit()` 时按反序执行。清理处理程序接受一个 `void*` 类型的参数。\n\n![image](img/F000095u09-07-9780124159969.jpg)\n\
  \n最近推送的清理处理程序可以通过 `pthread_cleanup_pop()` 从栈中弹出（当它不再需要时）。通常情况下，无论线程是否终止，都需要清理处理程序的功能。`execute`\
  \ 参数指定了在弹出处理程序时是否执行该处理程序。非零值表示执行。另注意，`pthread_cleanup_pop()` 只能从调用 `pthread_cleanup_push()`\
  \ 的同一个函数中调用。除了良好的编程习惯外，这是必要的，因为 `pthread_cleanup_push()` 是一个宏，在许多实现中，它以一个左大括号“{”结束，引入了一个代码块。而\
  \ `pthread_cleanup_pop()` 则有相应的右大括号。\n\n列表 9.2 显示了带有清理处理程序的典型队列应用程序的读取线程（主函数）。我们假设使用默认的延迟取消模式。注意，`pthread_cleanup_pop()`\
  \ 被用于解锁互斥锁，而不是普通的互斥锁解锁函数。\n\n![image](img/F000095f09-08-9780124159969.jpg)\n\n列表\
  \ 9.2 清理处理程序示例。\n\n我们在这里需要清理处理程序的原因是 `pthread_cond_wait()` 是一个取消点，并且在我们调用它时互斥锁是锁定的。但每每次通过\
  \ `while` 循环时都推入弹出清理处理程序真的是必要的吗？如果在被称为“处理数据”的部分（即解锁互斥锁的地方）有取消点，那么就是必要的。该线程只有在持有互斥锁时才能调用清理处理程序。如果在互斥锁解锁期间没有取消点，那么将推送清理调用移动到循环外部是安全的。在这种情况下，我们就不真的需要弹出清理了。\n\
  \n我们将在下一章中机会使用清理处理程序。\n\n## Pthreads 实现\n\n在内核版本 2.6 之前，最流行的线程实现是 LinuxThreads。它从大约\
  \ 1996 年就开始了，到 2.5 内核开始开发时，人们普遍认为需要新方法来解决 LinuxThreads 的局限性。在这些局限性中，内核将每个线程表示为一个独立的进程，或\
  \ `schedulable entity`（可调度实体），给它一个唯一的进程 ID，尽管在一个进程实体中存在许多线程。这导致了与其他线程实现的兼容性问题。每个进程有\
  \ 8192 个线程的硬编码限制，虽然这看起来很多，但有些问题可以从运行数千个线程中获益。\n\n这项新开发工作的结果是原生 Posix 线程库 NPTL，它现在是\
  \ 2.6 和 3.x 系列内核中的标准线程实现。它同样将每个线程视为单独的可调度实体，但利用了内核中的改进，这些改进专门为了克服 LinuxThreads 的局限性设计的。`clone()`\
  \ 调用被扩展以优化线程创建。每个进程的线程数量不再有限制，新的固定时间调度器可以处理数千个线程而不会产生过度开销。一种新的同步机制——快速互斥锁或“futex”，在不进行内核调用的情况下处理非竞争情况。\n\
  \n在 IA-32 上的测试报告说，NPTL 能够在 2 秒内启动 100,000 个线程。相比之下，在没有 NPTL 的内核上进行此测试将需要大约 15 分钟。\n\
  \n\n\n\n\n我们现在有了足够的背景知识来为我们的温控器添加一个线程，以监控串口参数的变化。我们将使用一种非常简单的协议来设置参数，该协议由一个字母、一个空格和一个数字组成。“s”代表设定点（setpoint），“l”代表限制（limit），“d”代表死区（deadband）。因此，要更改设定点，你可以输入：\n\
  \n```\ns 65<Enter>\n```\n\n这将设定点设置为 65°C。\n\n将目前位于 `src/measure/` 下的 `thermostat.c`\
  \ 复制到 `src/posix/`。在 `home/src/posix/` 目录下创建一个名为“posix”的新 Eclipse 项目。同样，确保它是一个 Makefile\
  \ 项目，并导入带有包含路径的项目设置。打开 `monitor.c`。首先注意到的是 `#include <pthread.h>`。此头文件定义了 Pthreads\
  \ API 的原型。注意 `paramMutex` 和 `monitorT` 的声明，后者将成为我们我们监控线程的句柄。\n\n由于 `setpoint`、`limit`\
  \ 和 `deadband` 这些参数被两个线程（温控器线程和监控线程）独立访问，我们需要一个互斥锁（mutex）来保证对其中一个线程的独他访问。实际上，这个特定的应用程序可能并不绝对需要互斥锁，因为共享资源是整数，对它们的访问应该是原子的。但它确实可以说明这一点。\n\
  \n顺便注意，`setpoint`、`limit` 和 `deadband` 在 `thermostat.h` 中被声明为 `extern`。假设这些变量在 `thermostat.c`\
  \ 中分配。如果你恰好为参数使用了不同的名称，则需要将它们修改以匹配。\n\n查看 `monitor()` 函数。它只是一个简单的循环，从 `stdin` 获取并解析字符串。注意在\
  \ `monitor()` 更改任何参数之前，它锁定了 `paramMutex`。在 `switch` 语句结束时，它释放了 `paramMutex`。你的温控器状态机也需要同样的方法。\n\
  \n移动到函数 `createThread()`。它将在 `thermostat.c` 的 `main()` 中调用，初始化 `paramMutex` 并创建监控线程。`createThread()`\
  \ 如果失败将返回非零值。`terminateThread()` 确保在退出 `main()` 之前正确终止监控线程。它应该在 `main()` 中于 `closeAD()`\
  \ 之前调用。\n\n### Linux 设备驱动程序\n\n我们将通过这次练习引入另一个 Linux “功能”。我们不再直接从用户空间访问 I/O 端口，而是利用内核空间设备驱动程序，这进一步将我们与硬件隔离开。在这里，我们关注从用户空间使用驱动程序。在第\
  \ 12 章中我们将查看驱动本身。\n\n虽然其他操作系统将设备视为“某种”文件，但 Linux 更进了一步，实际上为设备创建了目录。这通常是 `/dev`。结果之一是，重定向机制可以像应用于文件一样容易地应用于设备。\n\
  \n设备分为四种类型：字符设备、块设备、管道和网络设备。字符设备和块设备的主要区别在于后者（如磁盘）是可以随机访问的，即你可以在字符流中前后移动。对于字符设备，流通常只向一个方向移动。块设备通过文件系统访问，而字符设备被直接访问。在这两种情况下，I/O\
  \ 数据都被视为字节的“流”。\n\n管道是伪设备，在进程之间建立单向链接。一个进程向一端写入，另一个进程从另一端读取。网络设备则不同，它们处理数据“包”。\n\
  \n### 底层 I/O\n\nLinux 内核提供了三个设备驱动程序集合，用于访问与我们的应用程序相关的外围设备。这些是：\n\n- `/dev/adc`:\
  \ `read()` 返回通道 0 的数字文本字符串。\n- `/dev/leds`: `ioctl()` 设置或清除单个 LED。\n- `/dev/buttons`:\
  \ `read()` 返回一个 6 字符字符串；每个按钮对应一个“1”或“0”。\n\n查看 `posix/` 目录下的 `trgdrive.c`，查看 Posix\
  \ 温控器中是如何使用这些驱动程序的。\n\n### thermostat.c 需要的更改\n\n惊讶的是，要让 `thermostat.c` 与监控程序工作，所需的更改很少。\n\
  \n1. `include pthread.h` 和 `thermostat.h`。\n2. 在 `main()` 顶部 `call createThread()`\
  \ 并测试返回值。\n3. 在对状态变量进行 `switch` 语句之前 `lock paramMutex`，并在 `switch` 语句结束时释放它。\n4.\
  \ 在运行循环之后立即 `call terminateThread()`。\n\n\n\n\n就是这样！makefile 支持如 第 8 章 中描述的目标机构建和仿真构建。仿真构建使用\
  \ `measure/` 目录下的驱动文件 `simdrive.o` 并假设它已经构建完成。构建仿真程序并尝试运行。\n\n## 调试多线程程序\n\n多线程确实为调试过程带来了一些复杂性，但的是，GDB\
  \ 提供了处理这些问题的功能。在 Eclipse 中调试 `thermostat_s`（确保设备正在运行），使用主机调试配置并在 `main()` 函数中的 `createThread()`\
  \ 调用处设置断点。当程序在断点停止时，点击单步步（Step into）进入 `createThread()` 函数。\n\n单跳（Step over）`pthread_mutex_init()`\
  \ 调用和 `CHECK_ERROR`。现在当你单跳 `pthread_create()` 调用时，调试视图中会出现第二个线程。这是监控线程，它已经进入了 `fgets()`\
  \ 调用内部。\n\n在 `monitor()` 函数中调用 `fgets()` 之后设置一个断点。现在在控制台（Console）视图中输入一行文本。这是否为有效命令并不重要，我们现在只想让程序停止在断点处。让程序继续运行，当它到达断点时，注意线程\
  \ `[2]` 现在是悬挂在断点的线程。线程 `[1]` 最可能悬挂在 `sleep()` 函数内部。\n\n尝试在 `main()` 和 `monitor()`\
  \ 的各个位置设置断点，以验证参数是否正确更新，以及恒温器是否对新值做出正确响应。\n\n当你对程序在仿真下的运行感到满意时，为目标机重新构建它并在那里进行调试。你需要像我们在上一章中为\
  \ `measure` 项目那样创建一个新的 make 目标。你还需要同时删除 `monitor.o` 和 `thermostat.o`，以便目标版本能够正确构建。\n\
  \n当你启动调试器时，可能会看到控制台视图中快速闪过一些警告信息。这些是无害的。\n\n调试器会正常地停止在 `main()` 的第一行。让程序执行到 `createThread()`\
  \ 处的断点。单跳后，调试视图显示两个线程，正如我们在仿真版本中看到的那样。从现在开始，目标调试过程本质上与仿真模式相同。\n\n在对线程有了基本了解后，我们准备好处理下一章节，即网络问题。\n\
  \n## 资源\n\nOpen Group 已为私用目的免费提供了整个 Posix（现称为 Single Unix）规范。请访问：\n\n[www.unix.org/online.html](http://www.unix.org/online.html)\n\
