  \n# 前言\n\n在二十年前的今天\n\n胡椒军士教乐队练习演奏\n\n***John Lennon, Sergeant Pepper’s Lonely Hearts\
  \ Club Band***\n\n发自：torvalds@klaava.Helsinki.FI (Linus Benedict Torvalds)\n\n新闻组：comp.os.minix\n\
  \n主题：你最想在 minix 中看到什么？\n\n摘要：关于我新操作系统的简单调查\n\n消息-ID：<1991Aug25.205708.9541@klaava.Helsinki.FI>\n\
  \n日期：91 年 8 月 25 日 20:57:08 GMT\n\n机构：赫尔辛基大学\n\n所有正在使用 minix 的大家好：\n\n我正在为 386(486)\
  \ AT 兼容机开发一个（免费）操作系统（只是个爱好，不会像 `gnu` 那样大而专业）。这从 4 月就开始酝酿，现在开始准备就绪了。我想听到大家对 minix\
  \ 中喜欢/不喜欢的事物的任何反馈，因为我的操作系统在某些方面与其相似（由于出于等原因，文件系统的物理布局也是相同的）。\n\n我目前移植了 `bash(1.08)`\
  \ 和 `gcc(1.40)`，一切似乎运行良好。这意味着我将在几个月内就能得到一些实用的东西，我想知道大多数人最想要哪些功能。欢迎任何建议，但我不保证会实现它们:-)\n\
  \nLinus ( torvalds@kruuna.helsinki.fi)\n\n备注。是的——它不包含任何 minix 代码，并且有一个多线程文件系统 `fs`。\n\
  \n它是不可移植的（使用了 386 任务切换等），而且它可能永远不会支持 AT 硬盘以外的任何东西，因为我只有这些：-(。\n\n通过在当时处于初生的、纯文本的互联网上发布这条信息，芬兰的大学生\
  \ Linus Torvalds 开启了一场革命。当我于 2011 年底写此文时，Linux 庆祝了它的 20 周年。我怀疑 Linus 完全没有意识到，他的“爱好”项目很快就会变成一个强大的\
  \ 32 位（随后是 64 位）操作系统，并能与来自雷德蒙德的“博格（微软）”相抗衡。\n\n不用说，Linux 在 20 年里走了很远的路。原始版本 1991\
  \ 年 9 月 17 日发布的 0.01 版本包含 88 个文件，总计 278 KB。现代的 Linux 版本包含近 40,000 个文件，占用空间 400 多\
  \ MB。字面意思是，全球成千上万的程序员以各种方式参与着 Linux 开发。\n\n自本书第二版于 2006 年出版以来，Linux 世界发生了很多，这当然是编写新版的动力。内核持续进化改进，最近为了庆祝\
  \ 20 周年已更新到 3.0 版本。Google 在 2007 年底推出了 Android 变体。\n\n## 读者群与先决条件\n\n我写这本书的动力是创造一本我在开始接触\
  \ Linux 时希望拥有的书。考虑到这一点，本书面向两个不同的读者群体：\n\n1. 主要读者群体是嵌入式程序员，他们需要了解嵌入式领域的 Linux。这是我的背景，以及我进入\
  \ Linux 的方式；所以这似乎是一个合理的书籍结构。\n\n2. 另一类读者群体是 Linux 程序员，他们需要对嵌入式和实时编程概念的介绍。\n\n因此，每组人可能都会看到一些回顾性内容，尽管这些可能是以全新的视角呈现的。\n\
  \n\n\n\n\n本书并非打算作为初学者指南。我假设你已经成功安装了 Linux 系统，并至少对其进行过一些尝试。你知道如何登录，尝试过了一些命令行工具，并且可能已经运行过\
  \ GUI 桌面。尽管如此，第 2 章仍将带你完成安装过程，而第 3 章将对对嵌入式和实时程序员感兴趣的某些 Linux 特性和性质进行简要介绍。\n\n本书大致分为三个部分。第一部分主要是介绍性的内容，为第二部分奠定基础，第二部分将讨论交叉开发环境中的应用程序编程。第三部分将更详细地查看之前介绍的某些组件和工具。它还探讨了\
  \ Linux 中的实时性能。\n\n不言而喻，你无法通过阅读书籍来学习编程。你必须去实践。这就是为什么这本书被设计为一份实用的操作指南。你将在你的 Linux\
  \ 工作站上安装许多软件包，书籍网站 [www.elsevier.com/](http://www.elsevier.com/) 上提供了示例代码。\n\n嵌入式编程通常意味着目标机器与工作站开发机是独立且不同的。我们在书中工作的主要目标环境是第\
  \ 5 章中介绍的基于 ARM 的单板计算机。这是一种广泛可用、廉廉的设备，具有真实嵌入式产品的能力。但即使你选择不购买该开发板，我们将引入一种模拟方法，让你能够在工作站上尝试许多基本概念。\n\
  \n## 个人偏见\n\n和大多数计算机用户一样，无论好坏，我都在 Windows 屏幕前度过了多年，老实说，我日常生活中仍在使用 Windows 进行计算。在此之前，我对\
  \ DOS 游刃有余，更早之前，我还在研究过 RT-11、RSX-11 和 VMS。所以，并不是说我不懂命令行编程。事实上，在 Windows 95 出现之前的时代，可能可能在我终于将\
  \ WIN 添加到我的 `AUTOEXEC.BAT` 文件之前已经过了好几年。\n\n然而，硬核 Unix 程序员认为 GUI 是给软弱者准备的。他们自豪地通过命令行完成一切工作。随你怎么怎么说吧，但我喜欢\
  \ GUI。是的，命令行仍然有其地位，特别是对于 shell 脚本和 Makefile，但在移动文件层次结构和执行移动、复制、删除、重命名等简单文件操作时，拖放操作完胜那些极其晦涩的\
  \ Unix shell 命令。我也拒绝触碰 `vi` 和 `emacs` 等基于文本的编辑器，尽管最近我开始能忍 `vim`。当然，如果你能记住所有晦涩的命令，它们确实很强大。给我一个所见即所得的\
  \ WYSIWYG 编辑器。\n\n我最喜欢的 GUI 是 KDE 桌面环境。它拥有所有必要的功能，包括一个非常漂亮的语法彩色编辑器，更不用说全套办公和个人效率工具。顺便说一下，KDE\
  \ 是“K Desktop Environment”的缩写，包含大多数商业 Linux 发行版。显然，你可以自由使用任何你最熟悉的环境来完成书中的示例。但如果你是\
  \ Linux 新手，我推荐使用 KDE，这也是我们在学习本书时将要演示的环境。\n\n## 组织结构\n\n本书围绕三个主要部分组织。\n\n* *第一部分*——第\
  \ 1 章至第 6 章。这是一份介绍和入门指南。如果你还没有 Linux，你将安装它。对于不熟悉 Unix/Linux 系统的人，会有对 Linux 本身的介绍。你将设置并连接第二部分将使用的目标板以研究跨平台应用开发。最后，你将安装并熟悉各种交叉开发工具，包括开源集成开发环境\
  \ `Eclipse`。\n\n* *第二部分*——第 7 章至第 12 章—探索交叉环境中的应用程序编程。我们将查看从用户空间访问硬件、调试技术以及用于初步调试的高级模拟。我们将引入\
  \ Posix 线程、网络编程和 Android，并将查看内核级编程和设备驱动。\n\n* *第三部分*继续查看嵌入式 Linux 程序员工具箱中的各种组件和工具。我们将查看\
  \ `U-boot` 引导加载程序、`BusyBox`、`Buildroot` 和 `OpenEmbedded` 等。最后，我们将探讨 Linux 的实时增强。\n\
  \n好了，让我们开始吧。加入我，开启一段充满刺激、有时会有颠簸，但最终有趣且富有收获的过山车之旅，进入激动人的嵌入式 Linux 世界。\n\n# 第一部分\n\
  \n## 导言与入门\n\n* 第 1 章 嵌入式与实时空间\n* 第 2 章 安装 Linux\n* 第 3 章 介绍 Linux\n* 第 4 章 主机开发环境\n\
  * 第 5 章 硬件\n* 第 6 章 Eclipse 集成开发环境\n\n# 第 1 章\n\n## 嵌入式与实时空间\n\n如果你想环游世界受邀到各地演讲，就写一个\
  \ Unix 系统。\n\n林斯·托瓦兹\n\n### 什么是嵌入式？\n\n你正在参加派对，一个一个的异性走过来问你做做什么的。你可以俏皮地说“尽可能少少”，但话题最终会转到你编写嵌入式系统这件事上。在你的新朋友开始环顾寻找律师或医生之前，你最好给出一个引人入胜的解释，到底什么是嵌入式系统。\n\
  \n我通常这样开始：嵌入式系统是一个带有计算机的设备，但设备的用户并不一定知道或不在乎计算机是否在那里。它是隐藏的。我通常举的例子是汽车中的发动机控制计算机。你不会因为引擎是由计算机控制的就改变驾驶方式。噢，还有一个计算机控制防抱锁制动器，另一个决定何时释放气囊，还有许多其他在当你坐在早晨拥堵的车流中为你提供娱乐和信息的计算机。\n\
  \n然后你可以继续指出，世界上分布的嵌入式计算机比个人电脑（PC）多得多。(1) 事实上，最近的市场数据显示，PC 仅占每年销售微处理器芯片的 2%。即使家里没有\
  \ PC，平均每个家庭也包含几十台计算机。\n\n\n\n\n另一方面，嵌入式系统通常包含比典型桌面计算机多得多的 I/O 设备。一个典型的系统可能包括以开关、按钮和各种类型的显示器形式的用户\
  \ I/O，且这些显示器通常带有触摸屏。它可能拥有一个或多个通信通道，无论是异步串口、通用串行总线（USB）以及/网络端口。它可能通过模拟转数字（A/D）和数字转模拟（D/A）转换器的形式实现数据采集和控制。这些设备很少有应用程序程序员所习惯的操作系统支持。因此，嵌入式系统程序员往往必须直接与硬件交互。\n\
  \n嵌入式设备通常受到严重的资源限制。虽然典型的 PC 现在有 4 GB 内存和数百 GB 磁盘，但嵌入式设备通常仅靠几兆内存和非易失性存储器运行。这需要程序员发挥创造力。\n\
  \n## 什么是实时？\n\n实时更难解释。实时背后的基本思想是，我们期望计算机`及时`（in time）对其环境做出响应。但“及时”意味着什么呢？很多人认为实时意味着极快。事实并非如此。在系统运行的背景下，实时仅仅意味着`足够快`（fast\
  \ enough）。如果我们讨论的是运行汽车引擎的计算机，那确实很快！那个家伙必须在发动机每旋转一圈时做出决策——关于燃料流量、火花点正。\n\n另一方面，考虑一个由一个或多个计算机控制的化学精炼。计算机系统负责控制过程并检测可能导致破坏的故障。但化学过程的时间常数至少在秒到分钟范围内。因此，我们假设计算机系统应该能够在足够的时间内响应任何故障，以避免灾难。\n\
  \n但假设当故障发生时，计算机正在打印关于上周生产的详尽报告或正在运行工资单。它有多快能对可能的紧急情况做出响应？\n\n实时计算的本质不仅在于计算机对环境的响应足够快，还在于它的响应足够`可靠`（reliably）快。发动机控制计算机必须能够在引擎每次转动时调整燃料流量和火花点正。如果延迟了，引擎运行就不会正常。化工厂的控制器必须能够在足够的时间内检测并响应异常情况，以避免灾难。如果不能，它就失败了。\n\
  \n我认为这段话说得最清楚：\n\n实时系统是指计算的正确性不仅取决于计算的逻辑正确性，取决于结果产生的时间。如果没有满足系统的时间约束，则认为发生了系统故障。\n\
  \nDonald Gillies 选《实时计算常见问题解答》\n\n因此，实时编程的艺术在于设计一种在随机异步事件中可靠地满足时间约束的系统。并不意外的是，这说起来做起来难，并且有大量的文献和开发工作致力于实时系统理论。\n\
  \n## Linux 如何以及为何融入其中？\n\nLinux 是作为一种类 Unix 模式的通用操作系统开发的，其基本架构模仿了 Unix。没有人会建议 Unix\
  \ 适用于作为嵌入式操作系统或实时操作系统（RTOS）。它体积庞大、消耗资源，而且它的调度器是基于“公平性”而非“优先级”。简而言之，它是嵌入式操作系统的对立面。\n\
  \n但 Linux 具有几个早期 Unix 版本不具备的优势。它是“免费”的，而且你可以获得源代码。这里有一个庞大且热情的 Linux 开发者和用户社区。很有可能其他人正在解决或已经解决过你所面临的相同问题。这一切都在网上。关键在于如何找到它。\n\
  \n### 开源\n\nLinux 的开发遵循由自由软件基金（FSF）发起的开源软件哲学。简单来说，开源是基于软件应该是自由可用的：用于使用、修改和复制。这种理念在构建互联网和万维网的技术文化中已经存在了约\
  \ 20 年，并在最近几年扩展到商业世界。\n\n关于开源软件的本质存在许多误解。也许解释它是什么最好的方法是从谈论它不是什么开始的。\n\n*   开源不是共享软件（shareware）。使用共享软件的前提条件是你向版权所有者支付费用。共享软件通常以免费形式分发，但在时间或功能上受到限制。要获得完整包，你必须付费。相比之下，开源代码是免费提供的，并且没有义务为它付费。\n\
  *   开源不是公领域（public domain）。根据定义，公领域代码不受版权保护。开源代码由其作者拥有版权，作者根据开源软件许可的条款发布它。因此，版权所有者赋予你使用代码的权利，前提是你遵守许可的条款。但如果你不遵守许可条款，版权所有者可以要求你停止使用该代码。\n\
  *   开源并不一定完全免费。尽管说了没有义务为开源软件付费，但这并不排除你对其进行打包和分发并收取费用。许多公司专门从事销售打包好的 Linux “发行版”。\n\
  \n你为什么要为你可以免费获得的东西付费？推测是因为东西都在一个地方，而且你可以从供应商那里获得支持。当然，支持的质量很大取决于供应商。\n\n所以“免费”指的是使用代码的自由，而不一定是成本。考虑“自由言论”（free\
  \ speech），而不是“免费啤酒”（free beer）。\n\n开源代码是：\n\n*   受开源许可限制，许多情况下是 GNU 公许可 `GPL`（见下文）。\n\
  *   受到批判性的同行评审。作为一名开源程序员，你的代码公开可见，开源社区往往是一个非常有批判性的群体。开源代码经过大量的测试和同行评审。这是一个达尔文式的过程，只有最好的代码才能生存。“最好”当然是一个主观术语。它可能是技术上的最优，但也可能完全不可读。\n\
  *   极具颠覆性。开源运动颠覆了主流范式，即软件等知识产权必须被严密保护以便你赚大钱。相反，开源哲学认为软件应该对所有人免费，以实现社会利益的最大化。如果你能从中赚到一些钱，那很好，但这不是主要动机。FSF\
  \ 创始人 Richard Stallman 特别地主张软件不应拥有所有者（见附录 C）。\n\n可移植性与可扩展性\n\n\n\n\nLinux 最初是为 Intel\
  \ x86 处理器家族开发的，目前大部分的内核开发工作仍然在 x86 平台上进行。尽管如此，Linux 内核的设计明确区分了依赖于处理器的代码（必须针对每种不同的架构进行修改）以及仅需重新编译即可移植到新处理器的代码。因此，Linux\
  \ 已经移植到广泛的 32 位以及最近的 64 位处理器架构，包括：\n\n*   Motorola 68k 及其许多变体\n*   Alpha\n*   Power\
  \ PC\n*   高级 RISC 机器 (ARM)\n*   Sparc\n*   MIPS\n\n这仅仅是一些最流行的架构。因此，无论你为嵌入式项目考虑哪种\
  \ 32 位架构，很可能都有相应的 Linux 版本可用，并有开发者社区提供支持。\n\n一个典型的桌面级 Linux 安装需要占用 10–20 GB 的磁盘空间，并需要\
  \ 1 GB 内存才能运行得良好。相比之下，嵌入式目标通常被限制在 64 MB 或更少的内存，并且可能只有 128 MB 的闪存 ROM 用于存储。幸运的是，Linux\
  \ 是高度模块化的。那 10 GB 中的大部分内容是文档、桌面实用程序以及游戏等在嵌入式目标中完全不需要的。要创建一个占用不超过 2 MB 闪存的功能完整（尽管受限）的\
  \ Linux 系统并不困难。内核本身具有高度的可配置性，并包含了相当友型的工具，允许你移除应用程序中不需要内核功能。\n\n## 嵌入式 Linux 在何处？\n\
  \n无处不在。截至 2005 年 7 月，[LinuxDevices.com](http://LinuxDevices.com) 网站列出了 300 多种运行\
  \ Linux 的商业产品。它们的范围涵盖了从手机、个人数字助理（PDAs）和其他手持设备，到路由器和网关、瘦客户端、多媒体设备和电视机顶盒，再到机器人甚至适用于军事指挥控制应用的加固型\
  \ VME 总机箱。而这些仅仅是 LinuxDevices 编辑们恰好知道的产品。\n\n嵌入 Linux 的首批且可能最广为人知的家庭娱乐设备之一是 TiVo\
  \ 个人视频录像机，它在 2000 年首次推出时引发了电视收视革命。TiVo 基于 Power PC 处理器，运行着“自产”的嵌入式 Linux 版本，该版本使用图形渲染芯片生成视频。\n\
  \n拥有一个运行 Linux 设备的乐趣有一半在于让它做一些比原始制造商意图更多或不同的事情。有很多网站和书籍致力于“破解”TiVo。增加存储容量可能是显而易见的破解手段。其他流行的破解方法包括显示天气、体育比分或股票报价，以及搭建\
  \ Web 服务器。\n\n嵌入式 Linux 的应用不仅限于消费品。它出现在销售点终端、视频监控系统、机器人，甚至外太空。美国航空航天局的戈达太空飞行中心开发了一个名为\
  \ FlightLinux 的 Linux 版本，以解决航天器车载计算机的独特问题。在国际空间站上，基于 Linux 的设备控制着名为自动转移飞行器（ATV）的无人维护航天器的交会对和对接操作。\n\
  \n从历史上看，电信运营商和服务提供商一直依赖于专有的平台来满足电信网络对可用性、可靠性、性能和服务响应时间的要求。今天，运营商和服务提供商正拥抱“开放架构”，并转向商用现有的硬件软件，以便在保持运营商级性能的同时降低成本。\n\
  \nLinux 在向开放、基于标准的网络基础设施迁移的过程中起着重要作用。2002 年，开源开发实验室成立了一个工作组来定义“运营商级 Linux”（CGL），以满足电信行业对更高可用性、可维护性和可扩展性的要求。CGL\
  \ 的目标是实现所谓的“五九级”可靠性水平，这意味着系统运行时间占比达到 99.999%。这意味着每年的停机时间不超过约 5 分钟。\n\n## 开源许可\n\n\
  大多数软件的最终用户许可协议（EULA）专门设计用于限制你对该许可范围所涵盖的软件进行允许的操作。典型的限制防止你制作副本或以其他方式重新分发它。你经常被告诫不要尝试对软件进行“反向工程”。\n\
  \n相比之下，开源许可旨在保证你根据自己的意愿尽可能使用、修改和复制目标软件的权利。权利随之而来义务。如果你修改并随后分发受开源许可涵盖的软件，你就有义务在相同的条款下提供修改后的源代码。这些更改将变成“衍生作品”，也受许可条款的约束。这允许其他用户更好地理解软件，并在他们需要时进行进一步的更改。\n\
  \n开源许可被称为“反式拷贝”（copyleft）许可，这是对版权（copyright）一词的变体，旨在传达利用版权法作为增强对知识产权（如软件）访问的手段而非限制它的理念。版权通常由作者用于防止他人复制、改编或分发作品，而\
  \ copyleft 则明确允许此类改编和重新分发，前提是结果作品根据相同的许可条款发布。因此，copyleft 允许你从人的工作中获益，但你做的任何修改必须以类似的条款发布。\n\
  \n可以认为，最广为人知且最广泛使用的开源许可是 GNU 通用公共许可证（GPL），它由 FSF 于 1989 年首次发布。Linux 内核根据 GPL 许可。但\
  \ GPL 存在一个问题，导致它在许多商业情况下无法实施。使用或依赖于在 GPL 下发布的其他软件的软件，即使只是对库进行 `linking`（链接），也被视为衍生作品，因此受\
  \ GPL 条款的约束并必须以源代码的形式提供。\n\n为了规避这一问题并促进开源库的发展，FSF 提出了“库级 GPL”（Library GPL）。区别在于，链接到受\
  \ LGPL 保护的库的程序被视为衍生作品，因此不需要提供源码，但你必须为库本身提供源码。随后，LGPL 被称为“较级 GPL”（Lesser GPL），因为它为用户提供的自由较少。虽然\
  \ LGPL 使使用开源软件开发专有产品成为可能，但 FSF 鼓励开发者将其库放在 GPL 下，以实现开放最大化。\n\n在光谱的另一端是伯克利软件发行（BSD）许可，它比\
  \ GPL 早了约 12 年。它“建议”但不要求将代码更改返回给开发者社区，并明确允许衍生产品使用其他许可，包括专有许可。\n\n\n\n\n大多数根据 `GPL`\
  \ 发布的软件（包括 Linux 内核）都遵循许可证的第 2 版，该版本发布于 1991 年，恰好是 Linux 出生的那一年。FSF 于 2007 年 6 月发布了\
  \ `GPL` 第 3 版。第 3 版的动机之一是解决“硬件锁定”（tivoization）问题，这是 `FSF` 创始人理查德·斯尔曼提出的术语。事实证明，TiVo\
  \ 只运行带有授权数字签名的代码。因此，尽管 TiVo 按照 `GPL` 提供了源代码，但对代码的修改将无法运行。\n\n斯尔曼认为这种做法规避了 `GPL`\
  \ 的精神。其他开发者（包括 Linus Torvalds）则将数字签名视为一种有用的安全工具，并不希望一味地禁止它们。这种争论仍在继续。无论如何，内核本身在短期内不太可能升级到第\
  \ 3 版。\n\n## 法律问题\n\n关于开源的法律影响已经产生了大量的 FUD（恐惧、不确定和怀疑），特别是考虑到 SCO 声称 Linux 内核被其专有的\
  \ Unix 代码“污染”了。SCO 集团（原名 Santa Cruz Operations）于 1996 年从 Novell 手中获得了 Unix System\
  \ V 源代码的权利，尽管对于 SCO 到底从 Novell 买了什么仍存在争议。无论如何，SCO 声称 IBM 将部分 SCO 受版权保护的专有 Unix 代码引入了\
  \ Linux 内核，并以此向 Linux 用户索要许可费。\n\n最终，SCO 的诉讼宣告告败，该公司于 2007 年申请了第 11 章破产。但突然之间，通过争夺开源许可问题可以赚到大钱。结果是，嵌入式开发者需要注意到开源和专有软件周围的许可证问题。由于需要，嵌入式软件通常与操作系统紧密结合，并包含了源自或其他来源的元素。虽然没人期望嵌入式工程师成为知识产权律师，但理解你所使用和创建的软件许可证条款仍然至关重要，以确保所有元素都能“良好地协作”。\n\
  \n而且这个问题是双刃剑。目前也存在识别违背 `GPL` 行为的努力。这里的意图并不是赚钱，而是通过向违规者施压使其整改，从而维护 `GPL` 的完整性。特别是，`GPL`\
  \ 违反项目已经“揭露”了十几个似乎随意对待 `GPL` 条款的嵌入式 Linux 厂商。根据 `GPL` 违反项目创始人 Harald Welte 的说法，最常见的违规者是路由器等网络设备，随后机顶盒和车载导航系统。\n\
  \n开源许可专家 Bruce Perens 观察到，嵌入式开发者似乎有一种心态：“这是嵌入式的，没人能更改源代码——所以 `GPL` 并不真正适用于我们。”但它确实适用。\n\
  \n既然我们已经对嵌入式和实时领域以及 Linux 如何融入其中有了一些了解，第 2 章将阐述在工作站上安装 Linux 的过程。\n\n## 资源\n\n[embedded.com](http://embedded.com)——*嵌入式系统设计*杂志的网站。该网站并非专门针对\
  \ Linux，但作为嵌入式系统问题的通用信息工具，非常实用。\n\n[fsf.org](http://fsf.org)——自由软件基金（Free Software\
  \ Foundation）。\n\n[gpl-violations.org](http://gpl-violations.org)——通用公共许可证违反项目的启动目的是“提高人们对通用公共许可证过去和现在违规行为的意识”。根据网站介绍，这“仍然几乎是一个人的人的工作”。\n\
  \n[keegan.org/jeff/tivo/hackingtivo.html](http://keegan.org/jeff/tivo/hackingtivo.html)——许多致力于破解\
  \ TiVo 硬件的网站之一。\n\n[kernel.org](http://kernel.org)——Linux 内核存档。你可以在这里下载最新的内核版本，以及几乎任何之前的版本。\n\
  \n网络上的开源资源非常丰富。以下是一些对嵌入式开发者特别感兴趣的网站列表。\n\n[linuxdevices.com](http://linuxdevices.com)——一个致力于嵌入式\
  \ Linux 相关问题的新闻和门户网站。\n\n[opensource.org](http://opensource.org)——开源倡议（OSI），一家非营利机构，“致力于通过管理和促进《开源定义》来造福社区”。OSI\
  \ 认证符合其“开源”定义的软件许可证。\n\n[osdl.org](http://osdl.org)——开源开发实验室（OSDL），一个非营利联盟，专注于加速\
  \ Linux 在企业领域以及最近的嵌入式领域的增长和采用。2005 年 9 月，OSDL 接手了嵌入式 Linux 联盟的工作，该联盟曾为嵌入式 Linux\
  \ 开发了一个“平台规范”。\n\n[sourceforge.net](http://sourceforge.net)——“世界最大的开源开发网站”，为开源开发者提供免费服务，包括项目托管和管理、版本控制、错误和问题跟踪、备份和存档，以及通信与协作资源。\n\
  \n[slashdot.org](http://slashdot.org)——“极客的新闻，重要的事情。”一个非常流行的新闻和论坛网站，专注于通用开源软件特别是\
  \ Linux。\n\n[uclinux.org](http://uclinux.org)——Linux/微控制器项目是将 Linux 移植到没有内存管理单元（MMU）的系统。\n\
  \n¹但在当今世界，大多数人至少是模糊地知道嵌入式计算设备的存在，因为他们至少携带一个：手机手机。\n\n²`GNU` 是一个自指的缩写，意为“GNU 不是 Unix”。`GNU`\
  \ 项目由理查德·斯尔曼于 1983 年发起，旨在实现一个完全由自由软件组成的“完整的 Unix 系统”。\n\n³VERSA Module Eurocard\
  \ 总，一种工业计算机封装和连接标准。\n\n⁴恐惧、不确定和怀疑。\n\n# 第 2 章：安装 Linux\n\n如果比尔·盖茨每次 Windows 崩溃就能得到一个尼分……噢，他确实有。\n\
  \n发现自 [Slashdot.org](http://Slashdot.org)\n\n在 Windows 下进行嵌入开发是可能的，但并不容易。基础 Windows\
  \ 缺乏许多便于嵌入开发的工具和功能。而且，你为什么要那样做呢？因此，我们将重点完全放在 Linux 上，不再涉及设置 Windows 开发系统的过程。\n\n\
  虽然本书不是 Linux 的入门教程，但值得花一点时间回顾安装过程和替代配置。如果你已经有一个令满意的 Linux 安装，你可以直接跳过本章，除非你想学习虚拟化或双启动。\n\
  \n本章中的指令和步骤主要面向 Fedora，但通用概念适用于几乎任何 Linux 安装。\n\n## 分发版\n\nLinux 安装多年来取得了巨大的进步，已经变成了一个相当直接、几乎没有痛苦的过程。安装\
  \ Linux 最简单、也是唯一合理的方法是从*分发版*（distribution，简称 distro）中安装。\n\n\n\n\n一个发行版几乎包含了你在 Linux\
  \ 安装中需要的所有内容，包括内核、实用程序、图形化桌面环境、开发工具、游戏、媒体播放器等等。大多数（但并非所有）发行版都使用 `package manager`，这是一种将各个组件组合成易管理软件包的软件。`Fedora`\
  \ 和 `Red Hat` 发版使用 `RPM`，即 `Red Hat Package Manager`。`Debian` 及其衍生版（如 `Ubuntu`）使用\
  \ `dpkg`。一个软件包包含该组件的软件（即可执行文件、库等），以及用于安装和卸载该组件的脚本以及显示该包需要哪些其他包的依赖信息。\n\n一个典型的发行版可能包含数千个软件包。事实上，这成了\
  \ Linux 各项目和发行者之间的一种营销游戏。“我的发行版包数量比你的多。”以下是一些流行且易于使用的发行版，其中任何一个都适用于嵌入式开发。网址请见本章末尾的“资源”部分。\n\
  \n### Debian GNU/Linux\n\n`Debian` 项目是一个全志愿者的努力，由全球约 3000 人组成，完全由捐赠支持。[SurveyMonkey.com](http://SurveyMonkey.com)\
  \ 在 2007 年的调查显示，`Debian` 仅次于 `Ubuntu`（后者是 `Debian` 的衍生版），是“个人和组织最常用的 Linux 发行版”。\n\
  \n`Debian` 以其“丰富的选项”而闻名。当前的稳定版本 `6.0` 有超过 29,000 个软件包，支持九种计算机架构，包括常见的 `Intel/AMD`\
  \ 32 位和 64 位处理器，以及 `ARM` 和 `IBM eServer zSeries` 主机。`Debian` 声称是最早使用稳健软件包管理系统的发行版之一，这与\
  \ `RPM` 不同。`Debian` 软件包的文件扩展名为 `.deb`。\n\n与其他许多流行的发行版相比，`Debian` 的发布周期可能且不太一致，通常两次大版本发布之间间隔\
  \ 2 年。\n\n### Fedora\n\n`Fedora` 项目始于 2003 年底，当时 `Red Hat` 停止了其零售版 Linux 发行版以专注于企业软件。最初的\
  \ `Fedora` 版本基于 `Red Hat Linux 9`。`Red Hat` 继续赞助 `Fedora` 项目，它作为 `Red Hat Enterprise\
  \ Linux` (`RHEL`) 发布的起点。\n\n`Fedora` 以处于开源软件开发的前沿为荣，因此它具有相对激进的发布计划，大约每 6 个月一次。当前版本是\
  \ `16`。从 `Red Hat` 开始，`Fedora` 一直是我喜欢的 Linux 发行版，我目前正在运行 `14`。我倾向于比领先落一两个大版本，并且大约每两三个版本更新一次。我不一定要最新、最强大的。嘿，如果好用，就一直用下去。\n\
  \n我对新版本有两个基本不满。这可能适用于 `Fedora` 以外的发行版：\n\n1. 功能倾向于“移动”。我可能对此很敏感，因为我倾向于使用图形化对话框进行配置和设置。似乎每个新版本的发布，这些对话框的路径都会发生变化。\n\
  2. 每个连续的发布似乎变得越来越“像 Windows”。也就是说，更多的菜单变成了可爱的图标，而不是简单、直接的文本选择。这无疑反映了吸引更多“消费者”受众的愿望，但作为一名计算机专业人士，我觉得这很反感。幸运的是，至少目前，还有方法恢复到经典的菜单样式。\n\
  \n虽然书中的几乎所有内容都是“与发行版无关的”，但发行版往往有所不同的一个领域是设置和配置。我们将在第 4 章需要对网络进行某些更改时面对这个问题。那里的描述将重点介绍\
  \ `Fedora`。考虑到这一点，如果你还没有确定自己喜欢的 Linux 发行版，我建议使用 `Fedora`，至少在你读这本书期间。\n\n`Fedora`\
  \ 仅运行在 `Intel/AMD` 平台上。\n\n### Red Hat Enterprise Linux\n\n`RHEL` 专门针对商业市场，包括主机。有针对\
  \ `x86`、`x86-64`、`Itanium`、`PowerPC` 和 `IBM System z` 的服务器版本，以及针对 `x86` 和 `x86-64`\
  \ 的桌面版本。虽然 `RHEL` 的许多功能源自 `Fedora`，但它的发布计划更加保守，大版本大约每 2 年发布一次。截至 2011 年底，最新的稳定版本是\
  \ `6.1`。\n\n尽管 `RHEL` 是一个商业产品，但它完全基于开源代码。因此，`Red Hat` 将整个源代码库供下载。几个小组利用这一点重新构建了他们自己的\
  \ `RHEL` 版本。其中最出名的之一是 `CentOS`，据说截至 2011 年底它是第八流行的发行版。这些构建版本删除了任何对 `Red Hat` 商标的引用，并将更新系统指向非\
  \ `Red Hat` 服务器。在其他情况下，它们在功能上是相同的。\n\n虽然这些构建版本是免费的，但它们显然无法获得任何形式的 `Red Hat` 支持。\n\
  \n### SUSE\n\n`SuSE` 最初开发于德国， 1994 年首次发布，使其成为最老的商业发行版。该名称是德语 `Software und System\
  \ Entwicklung`（软件与系统开发）的缩写。随后该名称更改为 `SUSE`，不再被视为缩写。\n\n`Novell` 在 2003 年收购了 `SUSE\
  \ Linux AG`，并在 2005 年宣布了 `openSUSE` 项目，允许外部开发者参与。`SUSE Linux` 有两种形式：由 `openSUSE`\
  \ 项目驱动的 `openSUSE` 和商业版本 `SUSE Linux Enterprise`。与 `Fedora` 和 `Red Hat` 一样，`openSUSE`\
  \ 处于 Linux 开发的“前沿”，具有激进的发布计划，而 `SUSE Linux Enterprise` 则坚持更保守的计划。\n\n### Ubuntu\n\
  \n根据其网站，`Ubuntu` 是一个古老的非洲词，意思是“对他人的仁爱”。它也意味着“因为大家，所以我是我”。它是 `Debian` 代码库的分支，于 2004\
  \ 年首次发布，旨在创建一个易于使用的 Linux 版本。它有两个版本：桌面版和服务器版。\n\n发布按照预测的 6 个月周期进行，每第四个版本获得长期支持 (`LTS`)。`LTS`\
  \ 版本的桌面版支持 3 年，服务器版支持 5 年。随着 `12.04` 即将发布，桌面支持将延长到 5 年。\n\n从历史上看，`Ubuntu` 与大多数其他发行版一样，支持图形化桌面环境，包括\
  \ `GNU Object Model Environment` (`GNOME`) 和 `K Desktop Environment` (`KDE`)。2011\
  \ 年春季发布的 `11.04` 版本引入了一个名为 `Unity` 的新桌面环境，它是 `GNOME` 的“外壳界面”。其目的是在笔记本和平板电脑有限的屏幕上更有效地利用空间。一些用户批评新界面“与\
  \ GNOME 太不同且功能较弱”，而另一些人发现这种极简主义的方法更有吸引力。\n\n虽然 `Ubuntu` 强调易用性，但开发者通过消除许多在例如 `Fedora`\
  \ 等中支持设置和配置的图形化对话框，使得基础系统配置变得更加困难。此外，root 用户账户被“锁定”，因此无法直接以 root 身份登录。你必须使用 `sudo`\
  \ 命令。这显然是故意的，遵循 Windows 的传统，以此防止“普通用户”折腾他们的系统。\n\n配置上的困难将在第 4 章我们需要更改某些网络参数时成为问题。除非\
  \ `Ubuntu` 是你喜欢的发行版且你对它非常熟悉，否则我不推荐它。\n\n\n\n尽管如此，Ubuntu 可能是最流行的 Linux 发行版。2009 年\
  \ 6 月，ZDNet 报道道：“全球有 1300 万活跃的 Ubuntu 用户，其增长速度快于任何其他发行版。”\n\n## 硬件要求\n选择好发行版后，你需要一台设备来运行它。任何现代\
  \ PC 都能很好地作为开发主机。最低要求是：奔腾级以上的处理器、运行图形化操作需要 1 GB 内存，以及安装“工作站”级 Linux 至少需要 20 GB 磁盘。当然，内存和磁盘越大越好。\n\
  \n我大部分的 Linux 工作都是在 Dell 笔记本电脑上的 Windows 7 下运行“虚拟机”完成（稍后会介绍）。该虚拟机分配了 1 GB 内存和 20\
  \ GB 磁盘。我目前运行的是 Fedora 14。\n\n你至少需要一个异步串口。USB 转串口转换器就可以正常工作。你还需要一个网络接口。我们将结合串口和网络端口来与目标机进行通信并调试目标代码。\n\
  \n## 安装场景\n接下来的决定是你想*如何*安装 Linux。基本上有三种安装场景。\n\n### 独立安装 (Stand-Alone)\n如果你能专门出一台机器给\
  \ Linux，这是显而易见的选择。你让安装过程格式化整个磁盘。\n\n### 双启动 (Dual-Booting)\n但在很多情况下，你可能想将 Linux\
  \ 安装在一台已经运行某种变 Windows 的机器上。实现这一点有几种方法。本节介绍双启动，下一节介绍虚拟化。\n\n在双启动场景下，你在启动时选择引导哪种操作系统。该操作系统将完全控制机器。Linux\
  \ 安装将把标准的 Windows 引导加载程序替换为 `GRUB`（即全局统一引导加载程序）。随后，`GRUB` 会提供选择启动操作系统的选项，如图图 2.1\n\
  \n图 2.1 `GRUB` 启动菜单。\n\n虽然从历史上看，双启动是普通用户最流行的安装场景，但也是最复杂的，因为它需要重新配置你的硬盘。最常见的情况是你机器上已经安装了一个版本的\
  \ Windows，你想添加 Linux。\n\n在此时，Windows 可能占据了整个磁盘，因此你必须为 Linux 腾出空间。从根本上说，这需要减小存放 Windows\
  \ 的磁盘分区的大小，以便为 Linux 创建未分配空间。请记住，Linux 需要大约 20 GB 的磁盘空间，因此你的磁盘必须至少有那么大的连续空闲空间。你可以使用\
  \ Windows 磁盘碎片工具将所有空闲空间移到磁盘的“末尾”。\n\nWindows 7 有一个非常实用的磁盘管理工具来处理分区。从开始菜单，选择`控制面板>管理工具>计算机管理`。在计算机管理对话框中，选择`存储>磁盘管理`。这将显示如图图\
  \ 2.2 所示的菜单。它显示了五个分区，最大的识别为 `C:` 盘。\n\n![image](img/F000022f02-02-9780124159969.jpg)\n\
  \n图 2.2 Windows 7 磁盘管理。\n\n这里有必要介绍一下磁盘分区的背景。在 DOS/Windows/PC 世界中，一个磁盘最多可以有四个*主*分区。这些主分区中的任何一个都可以指定为*扩展*分区，而扩展分区又可以包含几个*逻辑*分区。扩展分区可以包含的逻辑分区数量没有固定上限，但由于\
  \ Linux 访问分区的机制，单个硬盘驱动器的实际上限是 12。\n\n看一眼图 2.2 中的分区列表，并将其与从同一块磁盘上通过 Linux `fdisk`\
  \ 命令得到的列表 2.1 列表进行对比。这台特定的机器已经配置了双启动。注意 `fdisk` 报告了六个分区，而 Windows 磁盘管理器只显示了五个。`/dev/sda4`\
  \ 被识别为扩展分区。`sda5/` 和 `sda6/` 是 `sda4/` 内部的逻辑分区。磁盘管理器没有显示扩展分区。\n\n![image](img/F000022f02-03-9780124159969.jpg)\n\
  \n列表 2.1 `fdisk` 输出。\n\n奇怪的是，磁盘管理器将所有五个分区都识别为主分区，但 `fdisk` 向我们展示了图形表示右侧的两个分区实际上是扩展分区内的逻辑分区。\n\
  \n有了这些背景，是时候为 Linux 创建一些空闲了。但首先，在你对磁盘驱动器进行*任何*更改之前，**务必备份你的数据**。尽管这些工具本应该可以工作，但总会出意外。所以请做好准备。右键点击操作系统分区（`C:`）并选择`收缩卷....`。顺便提一下，Windows\
  \ 倾向于将分区称为“卷”。磁盘管理器查询分区以查看它可以缩小到多小。在大容量磁盘上这可能需要一段时间。最后，出现了如图图 2.3 所示的对话框。虽然标签有点困惑，但它告诉我们可以从\
  \ `C:` 分区中删除 113 GB。\n\n![image](img/F000022f02-04-9780124159969.jpg)\n\n图 2.3 缩小分区。\n\
  \n随后，Linux 安装将仅格式化供 Linux 使用的分区。\n\n### 虚拟化 (Virtualization)\n但如今计算领域的热门词汇是虚拟化，即在另一个操作系统上运行操作系统。基础操作系统或原生操作系统被称为*主机*。它运行一个*虚拟机管理器*（VMM），由其再运行一个被称为*虚拟机*的操作系统。在双启动场景中只有一个操作系统在运行，而在虚拟化中主机和虚拟机同时运行。你甚至可以在它们之间移动文件数据。\n\
  \n有两个流行的 VMM——`VMware` 和 `VirtualBox`。`VMware` 是同名公司的商业产品。他们提供一个名为 `VMware Player`\
  \ 的免费版本，可以在 Windows 和 Linux 上运行。\n\n`VirtualBox` 是由 Oracle（原 Sun）赞助的开源软件包。同样适用于\
  \ Windows 和 Linux 主机，但也支持 Mac 和 Solaris。\n\n这两个软件包在安装和操作上非常相似。安装软件后，你创建一个虚拟机，并为它们分配资源，如磁盘和内存。虚拟机中的磁盘在主机上表现为一个大文件。然后你以相同的方式在虚拟机上安装操作系统。\n\
  \n我恰好在使用 `VirtualBox`。\n\n还有第三种 VMM 是来自同名瑞士公司的 `Parallels`。它是严格面向图形密集型应用的商业产品。你可以获得一个免费的限时评估许可。`Parallels`\
  \ 利用内置在高端 处理器中的虚拟化技术。\n\n### DVD 还是 Live CD？\n大多数 Linux 发行版至少有三种形式：DVD、光盘集（现在大约是六张）或*Live\
  \ CD*。Live CD 是一个精简的可启动 Linux 系统，让你有机会在不实际安装的情况下尝试新的发行版。当然，你无法在其中保存任何数据或修改配置。每次启动时，它都会重置到默认配置。\n\
  \nLive CD 提供的选项之一是安装发行版。当你选择此选项时，它将运行与 DVD 或整套光盘相同的安装过程。区别在于要安装的软件包是从网络获取的，而不是从物理介质获取。\n\
  \n\n\n\n无论你选择哪种场景或安装介质，安装过程大体都是相同的。本节介绍了 Fedora 的安装，但其他发行版的流程也非常相似：\n\n* 下载发行版介质（参见“资源”部分）。这将\
  \ `.iso` 文件，即 DVD 或 Live CD 的精确镜像。\n* 将 `.iso` 刻录到相应的物理介质。你需要一个光盘刻录程序将 `.iso` 文件（或文件）传输到物理介质。在虚拟机环境中，你可以直接挂载\
  \ `.iso` 文件，就像它是 CD 或 DVD 一样。\n* 从安装介质启动计算机，或从 Live CD 上点击安装图标。你可能需要配置 PC 的 `BIOS`\
  \ 以从光介质启动。\n* 按照说明操作。\n\n安装过程本身非常简单。你会被要求选择一些常用选项，如语言、键盘、时区等。你将选择一个 root 密码。root\
  \ 用户是系统管理员，称为“超级用户”（superuser）。关于它的更多信息请见下一章。\n\n### 磁盘分区\n\n最后，你会看到如图 2.4 所示的对话框。在这里情况变得严肃，因为你正要做出一些不可逆的决定。如果你安装的是仅限\
  \ Linux 的系统或虚拟机，这里的答案是“使用所有空间”（Use All Space）。在虚拟机情况下，“所有空间”实际上指的是你创建虚拟机时创建的文件。在仅限\
  \ Linux 的情况下，它确实是磁盘上的所有空间。如果你正在安装双系统配置，正确的答案是“使用空空间”（Use Free Space），即你之前在 Windows\
  \ 磁盘管理器中释放的空间。\n\n![image](img/F000022f02-05-9780124159969.jpg)\n\n图 2.4 磁盘分区。\n\
  \n除非你有充分理由，否则接受建议的分区。它通常运行得很好。当你点击`Next`下一步）时，系统会提示你确认要将更改写入磁盘。到此为止，安装程序尚未对系统做出任何永久更改。当你点击`Write\
  \ changes to disk`将更改写入磁盘）时，你就提交了。\n\n接下来，你会被询问引导加载程序 `GRUB`。如果你正在安装双系统，你可以选择选择哪个操作系统作为默认系统。\n\
  \n### 软件包选择\n\n在安装正式开始之前的下一步也是最后一步是软件包选择。在菜单菜单中，选择“软件开发”（Software Development）。这会预选许多支持软件开发的软件包，包括\
  \ GNU 编译器集合（`GCC`）。选择`Customize now`（现在自定义）。当你点击`Next`下一步时，你将看到如图 2.5 所示的对话框。这让你能够选择“软件开发”组之外的其他功能和软件包。\n\
  \n![image](img/F000022f02-06-9780124159969.jpg)\n\n图 2.5 软件包选择。\n\n在“桌面环境”（Desktop\
  \ Environments）下，我建议选择 `KDE`。这完全是一个个人主。。Linux 世界有两个流行的图形化桌面环境：`GNOME` 和 `KDE`。`GNOME`\
  \ 往往更受欢迎。我恰恰偏好 `KDE`，而且由于本书其余部分显示的是图形桌面图像，它们将是 `KDE`。我恰恰更喜欢 `KDE` 的呈现方式。它更“像 Windows”。事实是，我大部分的日常计算工作都在\
  \ Windows 中完成的（嘿，我正在用 Word 写这本书）。如果你职业生涯的大部分时间都是坐在 Windows 屏幕前，我认为你会发现 `KDE` 更符合你的胃口。但如果你对\
  \ `GNOME` 有强烈的偏好，尽管去吧。\n\n在“开发”（Development）下，选择 `KDE Development`。这会安装 `Qtopia`（`QT`）图形库，当我们在几章之后配置\
  \ Linux 内核时，我们将需要它们。\n\n点击`Next`下一步，安装开始。意不意外的是，这将花费一段时间时间，大约一小时，因为你的计算机上将安装大约一千个软件包。\n\
  \n安装完成后，系统将提示你重启。系统应该重启并进入你刚刚安装的内容。有几个安装后的问题需要处理。其中包括，你必须接受 Fedora 许可条款并创建一个普通用户。\n\
  \n在此之后，你将拥有一个功能完备的 Linux 安装。准备好进入下一章时，重启它，在下一章中我们将回顾 Linux 的许多实用功能。\n\n## 资源\n\n\
  [linuxiso.org](http://linuxiso.org)—该网站提供了几乎所有不同架构、不同修订版本的流行 Linux 发行版的 ISO 镜像文件下载。\n\
  \n### 特定发行版网站\n\n[debian.org](http://debian.org)\n\n[fedoraproject.org](http://fedoraproject.org)\n\
  \n[opensuse.org](http://opensuse.org)\n\n[redhat.com](http://redhat.com)\n\n[ubuntu.com](http://ubuntu.com)\n\
  \n### 其他资源\n\n[parallels.com](http://parallels.com)—Parallels VMM 网站。\n\n[virtualbox.org](http://virtualbox.org)—VirtualBox\
  \ VMM 网站。\n\n[vmware.com](http://vmware.com)—关于 VMware 虚拟机管理的信息。在这里下载 VMware Player。\n\
  \n¹顺便说一下，你也不会如此。基本功能在每个版本之间并没有很大变化。很大程度上是外观上的。如果你只是刚开始，选择一个相当新的发布版本并坚持一段时间。\n\n\
  # 第 3 章\n\n## 介绍 Linux\n\n从伯克利产生了两个主要产品：\n\nLSD 和 Unix。我们不认为这是一种巧合。\n\nJeremy S.\
  \ Anderson\n\n对于可能不熟悉 Unix 风格操作系统的人来说，本章介绍了 Linux 的一些显著特征，特别是对嵌入式开发人员感兴趣的内容。这绝不是一个详尽的介绍，有很多书籍可以更深入地探讨这些主题。\n\
  \n如果你已经熟悉 Unix 和 Linux 概念，请随意翻阅，或完全跳过本章。\n\n## 运行 Linux—KDE\n\n启动你的 Linux 机器并以你的普通用户登录。如果你在\
  \ Fedora 14 上运行 `KDE`，你将看到如图 3.1 所示的屏幕。除非你运行 `VirtualBox` 或 `VMware`，否则你将看不到前两行和最底部的菜单行。如果你运行的是不同版本的\
  \ Linux，你的屏幕可能不同，但应该具有大多数相同的特征。\n\n![image](img/F000034f03-01-9780124159969.jpg)\n\
  \n图 3.1 KDE 初始屏幕。\n\n左下角是一个像样式化“f”的菜单图标，它的作用与 Windows 的开始菜单相同。KDE 将此称为“应用程序启动器菜单”（Application\
  \ Launcher Menu）。最初，点击此图标会弹出一组基于图标的菜单，我个人觉得很难用。幸运的是，你可以将其更改为旧的列表样式。右键点击“f”图标并选择“切换到经典菜单样式”（Switch\
  \ to Classic Menu Style）。当然，要意识到这完全是个人品味的问题。\n\n### 文件管理器\n\n在新系统中我想做的第一件事之一就是打开文件管理器，这样我可以看看系统里有什么。点击桌面文件夹中的“主”（Home）图标。文件管理器显示你的主目录内容，即你存储所有文件的地方。注意，KDE\
  \ 默认使用单击激活项目。你可以通过从开始菜单选择`Settings`设置）>`System Settings`系统设置）将其更改为双击。滚动到`Hardware`硬件，并选择`Input\
  \ Devices`输入设备）>Mouse 鼠标。\n\n最近 Fedora 版本的默认文件管理器叫做 `Dolphin`，再次地，它不是我的菜。我发现旧的文件管理器\
  \ `Konqueror` 更好用，并提供了更有用的呈现方式。你可以从系统设置下的“默认应用程序”（Default Applications）菜单更改文件管理器。\n\
  \n如图 3.2 所示显示了我配置的 Konqueror。意不意外的是，它最初看起来不是那样。为了获得左侧的导航面板，点击最左侧的红色“根文件夹”（Root folder）图标。Konqueror\
  \ 有很多选项，所以请尝试尝试，让它完全符合你的喜好。\n\n\n\n\n\n### 图 3.2 Konqueror 文件管理器。\n\n## 终端窗口\n\n\
  你将经常使用的另一个窗口是我们在本章后面描述的命令行壳（shell）。从应用程序启动菜单（Application Launcher Menu）中，选择`System>Konsole\
  \ (Terminal)`。图 3.3 显示了我是如何配置 shell 的。同样，通过从设置（Settings）菜单中选择“配置配置文件”（Configure\
  \ Profiles…），可以访问大量的配置选项。我恰好喜欢白色背景上显示黑色文字，并将尺寸设置为`80×25`，因为这符合我刚进入这个行业时使用的旧式串行 CRT\
  \ 终端。\n\n![image](img/F000034f03-03-9780124159969.jpg)\n\n图 3.3 命令行窗口。\n\n文件（File）菜单提供了打开新\
  \ shell 窗口以及在 shell 窗口内打开多个标签页的选项。同时打开二三个 shell 窗口并在任何一个窗口中保留二三个标签页的情况并不罕见。\n\n\
  ## Linux 特性\n\n以下是 Linux 以及类 Unix 操作系统通用的一些重要特性。\n\n- `多任务`（Multitasking）。Linux\
  \ 调度器实现了真正的抢占式多任务处理，即当异步事件发生导致高优先级进程变为就绪时，它将抢占当前正在运行的进程。虽然它是可抢占的，^(1)，但内核中存在较大的延迟，这使其通常不适用于硬实时应用。此外，默认调度器实现了一种“公平性”策略，为所有进程提供运行的机会。\n\
  - `多用户`（Multiuser）。Unix 演变为一种时间分时系统，允许多个用户共享一台昂贵的（至少在当时是如此）计算机。因此，它许多支持隐私和数据保护的特性。Linux\
  \ 继承了这一传统，并在服务器环境中对其发挥了良好作用。^(2)\n- `多处理器`（Multiprocessing）。Linux 对真正的对称多处理提供了广泛支持，多个处理器通过共享内存总线紧密耦合。这在多核处理器时代变得尤为重要。\n\
  - `保护内存`（Protected Memory）。每个 Linux 进程都在自己的私有内存空间中运行，不允许直接访问另一个进程的内存空间。这防止了一个进程中的野指针损坏另一个进程的内存空间。越界访问会被处理器的内存保护硬件捕获，进程将在收到适当通知后被终止。\n\
  - `分级文件系统`（Hierarchical File System）。是的，所有现代操作系统——甚至是 DOS——都有分级文件系统。但 Linux/Unix\
  \ 模型在我们在习惯的传统 PC OS 基础上增加了一些奇妙的设计：\n    - `链接`（Links）。链接仅仅是指向另一个文件的文件系统项，而不是文件本身。链接可以作为一种非常有用的抽象机制，以及在多个用户之间共享文件的方法。它们在配置场景中也被广泛用于，用于从几个可选文件中选择其中一个。\n\
  \    - `设备无关 I/O`（Device-Independent I/O）。同样，这并不是新概念，但 Linux 通过将每个外围设备视为文件系统中的一项，将该概念推向了逻辑终。从应用程序的角度，写入文件和写入（例如）打印机之间没有任何区别。\n\
  \n## 保护模式架构\n\n当代 Intel 处理器中保护模式内存的实现首次出现在 `80386` 中。它利用完整的 `32-bit` 地址来提供 `4 GB`\
  \ 的寻址范围。访问受到控制，使得内存块可以是可执行的（Executable）、只读或读/写。\n\n处理器可以在四个`特权级`（privilege levels）之一运行。运行在最高特权级级别\
  \ `0` 的程序可以做任何它想做的事——执行 I/O 指令、启用和禁用中断以及修改描述符表。较低的特权级防止程序执行可能“危险”的操作。例如，文字处理应用程序可能不应该干扰中断标志位。那是操作系统的工作。\n\
  \n因此，应用程序代码通常运行在最低级别，而操作系统运行在最高级别。设备驱动程序和其他服务可能运行在中间级别。但在实践中，Linux 和大多数其他针对 Intel\
  \ 处理器的操作系统只使用级别 `0` 和 `3`。在 Linux 中，级别 `0` 被称为“内核空间”（Kernel Space），而级别 `3` 被称为“用户空间”（User\
  \ Space）。\n\n### 实模式（Real Mode）\n\n在讨论 `x86` 保护模式编程之前，回顾一下“实”地址模式的工作原理很有帮助。\n\n\
  在 20 世纪 70 年代后期，当 Intel 设计 `8086` 时，设计人员面临着一个难题：如何仅用 `16 bits` 访问 1 兆的地址空间。在当时，1\
  \ 兆被认为是非常巨大的内存。他们提出的解决方案（无论好坏）是由两个名为段（`Segment`）和偏移（`Offset`）的 `16-bit`数量构建出一个 `20-bit\
  \ (1 MB)` 地址。将段值左移四位并将其加到偏移量上即可创建 `20-bit` 线性地址（图 3.4）。\n\n![image](img/F000034f03-04-9780124159969.jpg)\n\
  \n图 3.4 实模式寻址。\n\n`x86` 处理器在实模式下四个段寄存器。对内存的每次引用其段值都源自这些寄存器之一。默认情况下，指令执行相对于`代码段 (CS)`，大多数数据引用（例如\
  \ `MOV` 指令）相对于`数据段 (DS)`，引用栈的指令相对于`栈段 (SS)`。额外段 (ES) 用于字符串移动指令，并可以使用段前缀进行覆盖。\n\n\
  一个段的长度可达 `64 KB`，并按 `16-byte` 边界对齐。小于 `64 KB` 的程序本质上是位置无关的，可以重定位到 `1 MB` 地址空间的任何地方。大于\
  \ `64 KB` 的程序（无论是代码还是数据）都需要多个段，并且必须显式操作段寄存器。\n\n### 保护模式（Protected Mode）\n\n保护模式仍然利用段寄存器，但不再直接提供地址的一部分，段寄存器中的值（现在称为选择符\
  \ `selector`）变成了“段描述符”（`Segment Descriptors`）表的索引。段描述符完整地描述了一个内存块，包括其基址（base）和限制（limit）（图\
  \ 3.5）。物理内存中的线性地址通过将逻辑地址中的偏移量加上描述符中包含的基址计算得出。如果生成的地址大于描述符中指定的限制，处理器将发出内存保护故障。\n\n\
  ![image](img/F000034f03-05-9780124159969.jpg)\n\n图 3.5 保护模式寻址。\n\n描述符是一个 8 字节的对象，它告诉我们关于内存块的所有所需信息。\n\
  \n- `基地址 [31:0]` 该块/段的起始地址。\n- `限制 [19:0]` 段的长度——这可以是字节长度（最高 `1 MB`），也可以是 `4 KB\
  \ 页`的长度。其解释由粒度（Granularity）位定义。\n- `类型` 一个 4 位字段，定义了该段描述的内存类型。\n- `S` 0=该描述符描述“系统”段。1=该描述符描述\
  \ CS 或 DS。\n- `DPL` 描述符特权级——一个 2 位字段，定义了访问该段所需的最小特权级。\n- `P` 存在位—1=该描述符表示的内存块存在于内存中。用于分页。\n\
  - `G` 粒度—0=将限制解释为字节。1=将限制解释为 `4 KB 页`。\n\n注意，当粒度位置为 `1` 时，单个段描述符可以表示整个 `4 GB` 地址空间。\n\
  \n\n\n\n\n普通描述符（`S` 位=1）描述代表数据或代码的内存块。`Type` 字段为 4 位，其中最高位区分 `CS` 和 `DS`。`CS` 是可执行的，而\
  \ `DS` 不可执行。`CS` 可能可读也可能不可读。`DS` 可写。任何超出 `Type` 字段范围的访问（例如尝试执行 `DS`）都会导致内存保护故障。\n\
  \n## “平坦”与分段内存模型\n\n由于单个描述符就可以引用整个 4 GB 地址空间，因此可以通过引用单个描述符来构建你的系统。这被称为“平坦”（flat）模型寻址，它实际上是大多数\
  \ 8 位微控制器寻址模型以及 DOS “微型”（tiny）内存模型的 32 位等效模型。所有内存都可以平等访问，且没有保护。\n\nLinux 实际上也做了类似的事情。它为操作系统和每个进程使用单独的描述符以实施保护，但它将每个描述符的基地址设置为零。因此，偏移量与虚拟地址相同。实际上，这消除了分段。\n\
  \n## 分页\n\n分页机制允许每个任务假装拥有一个非常大的平坦地址空间。该空间随后被划分为 4 KB 的*页*（pages）。只有当前正在访问的页面保留在内存中，其余留在磁盘上。\n\
  \n如图 3.6 所示，分页增加了另一层间接性。从选择器和偏移量派生的 32 位线性地址被分为三个字段。高 10 位作为`页目录`（Page Directory）的索引。页目录项（`PDE`）指向`页表`（Page\
  \ Table）。线性地址中的后续 10 位提供指向该表的索引。页表项（`PTE`）提供物理内存中 4 KB 页的基地址，这被称为`页帧`（Page Frame）。原始线性地址的低\
  \ 12 位提供页帧的偏移量。每个任务都有自己的页目录，由处理器控制寄存器 `CR3` 指定。\n\n![image](img/F000034f03-06-9780124159969.jpg)\n\
  \n图 3.6 分页。\n\n在此查找过程的任一阶段，可能发现页表或页帧不存在于物理内存中。这会导致*页故障*（Page Fault），反过来导致操作系统在磁盘上找到对应的页面并加载到内存中可用的页中。这可能需要“换出”当前占用该内存的页面。\n\
  \n分页的进一步优势是，它允许多个任务或进程轻松地共享代码和数据，只需将它们各自地址空间中的相应部分映射到同一个物理页即可。\n\n分页是可选的，你不必使用它，尽管\
  \ Linux 使用了。分页由处理器寄存器 `CR0` 中的一个位控制。\n\n页目录和 `PTEs` 各的长度均为 4 字节，因此页目录和页表最大为 4 KB，这恰好也是页帧的大小。高\
  \ 20 位指向页表或页帧的基地址。第 9–11 位留给操作系统供其使用。除其他外，这些位可以用于指示某个页面应被“锁定”在内存中，即不可换出。\n\n在剩余的控制位中，最有趣的是：\n\
  \n- `P` Present（存在位）。1=该页在内存中。如果此位为 0，引用此页目录或 `PTE` 将导致页故障。注意，当 `P==0` 时，该项的其余部分不再相关。\n\
  - `A` Accessed（访问位）。1=该页已被读取或写入。由处理器设置，但由操作系统清除。通过定期清除访问位，操作系统可以确定哪些页面长时间未被引用，因此这些页面易易被换出。\n\
  - `D` Dirty（脏位）。1=该页已被写入。由处理器设置，但由操作系统清除。如果一个页面没有被写入，那么在必须被换出时，没有需要将其写回磁盘。\n\n##\
  \ Linux 进程模型\n\nLinux 中的基本结构元素是*进程*（process），它由可执行代码和一组*资源*（resources，如数据、文件描述符等）组成。这些资源受到完全保护，使得一个进程无法直接访问另一个进程的资源。为了让两个进程能够相互通信，它们必须使用\
  \ Linux 定义的进程间通信机制，如共享内存区域或管道。\n\n这些都是很好的，因为在系统中建立了高层次的保护。一个出错的进程很可能会被系统检测并在对其他进程造成任何损坏之前被抛出（图\
  \ 3.7）。但在创建进程和使用进程间通信机制方面，需要付出过度开销的代价。\n\n![image](img/F000034f03-07-9780124159969.jpg)\n\
  \n图 3.7 进程与线程。\n\n然而，*线程*（thread）仅指代码。线程只存在进程环境中，一个进程中的所有线程共享其资源。因此，所有线程对数据内存和文件描述符具有同等访问权限。这种模型被称为*轻量级多任务*（lightweight\
  \ multitasking），以区别于 Unix/Linux 进程模型。\n\n轻量级任务的优势是线程间通信更高效。缺点当然是任何线程都可以破坏任何数据。历史上，大多数操作系统是围绕轻线程模型构建的。作为回应，许多实时操作系统提供了类似于\
  \ Linux 进程模型的保护版本。\n\n### `fork()` 函数\n\nLinux 启动时只有一个进程，即 `init` 进程。系统中的其他进程都是通过调用\
  \ `fork()` 创建的。调用 `fork()` 的进程被称为*父进程*，新创建的进程被称为*子进程*。\n\n如果你习惯了通过调用任务创建服务创建任务的多任务操作系统，那么\
  \ `fork()` 看起来可能非常奇怪。`fork()` 创建了父进程的副本——代码、数据、文件描述符以及内核可能持有的任何资源。这可能导致拷贝数兆内存的空间。为了避免复制可能被覆盖的内容，Linux\
  \ 采用了写时复制（copy-on-write）策略。\n\n`fork()` 开始复制进程数据结构并为子进程分配一个新的进程标识符（PID）。然后，它复制页目录和页表。最初，所有的\
  \ `PTEs` 都指向与父进程相同的页面。两个进程页都设置为只读。当其中一个进程尝试写入时，会导致页故障，反过来导致 Linux 为该进程分配新页并复制现有页的内容。\n\
  \n### `execve()` 函数\n\n当然，99% 的情况是子进程通过调用 `execve()` 从磁盘加载可执行镜像文件来启动一个新程序。Listing\
  \ 3.2 以骨架形式展示了一个简单的命令行解释器。它从 `stdin` 读取一行文本，对其进行解析，并调用 `fork()` 创建新进程。子进程随后调用 `execve()`\
  \ 加载文件并执行刚刚输入的命令。`execve()` 会覆盖调用进程的代码、数据和栈。\n\n\n\n\n\n列表 3.2 命令行解释器。\n\n如果这是一个普通的“前台”命令，命令解释器必须等待命令完成。这是通过\
  \ `waitpid()` 实现的，它会阻塞调用进程，直到与 `pid` 参数匹配的进程完成为止。顺便提一下，大多数多任务操作系统并不具备阻塞一个进程或任务以等待另一个任务完成的能力。\n\
  \n如果 `execve()` 执行成功，它不会返回。相反，控制权将转移给新加载的程序。\n\n## Linux 文件系统\n\nLinux 文件系统在许多方面与你可以在\
  \ Windows PC 或 Macintosh 上找到的文件系统相似。它是一个分层系统，允许你在由 `//` 标识的 `root directory`（根目录）下创建任意数量的子目录。类似于\
  \ Windows，文件名可以非常长。然而，在 Linux（以及大多数 Unix 类系统）中，文件名的“扩展名”——文件名中“.”之后的部分——其意义比在 Windows\
  \ 中小得多。例如，虽然 Windows 可执行文件始终有 `.exe` 扩展名，但 Linux 可执行文件很少有扩展名。总的来说，文件内容是通过文件头而非特定的扩展名标识符来识别的。尽管如此，许多应用程序（例如\
  \ C 编译器）确实支持默认的文件扩展名。\n\n与 Windows 不同，Linux 中的文件名是`区分大小`的。`Foobar` 和 `foobar` 是不同的文件，且与\
  \ `fooBar` 也不同。排序也是区分大小的。在按名称排序的目录列表中，以大写字母开头的文件出现在以小写字母开头的文件之前。以 `.` 开头的文件被认为是“隐藏”的，除非你明确请求，否则不会在目录列表中显示。\n\
  \n此外，Linux 文件系统具有许多在典型 Windows 系统中没有的功能。让我们来看一些可能令嵌入式程序员程序员感兴趣的功能。\n\n### 文件权限\n\
  \n由于 Linux 是多用户系统，每个文件都有一组关联的 `permissions`（权限），用于指定不同类用户允许对该文件执行的操作。通过在命令壳窗口中输入\
  \ `ls –l` 命令或使用桌面文件管理器获取某些 Linux 目录的详细列表。每个文件条目的的一部分由一组 10 个标志位和一对名称组成，看起来像这样：\n\
  \n`-rw-r-r- Andy physics`\n\n在这个示例中，Andy 是文件的 `owner`（所有者），文件属于一个名为 physics 的用户\
  \ `group`（组），也许是某大学的物理系。通常情况下（但并非总是），所有者是创建文件的人。\n\n10 个标志位中的第一个标识文件类型。普通文件在这里显示为字符\
  \ `-`。目录由 `d` 标识，链接由 `l` 标识，以此此类推。当我们以后遇到设备驱动程序时，我们会看到该标志的其他条目。其余九个标志位分为三组三个。所有组的标志位相同，分别代表读取文件的权限\
  \ `r`、写入文件的权限 `w` 或如果是可执行文件则执行文件的权限 `x`。写入权限也允许删除文件。\n\n这三组然后代表授予不同类用户的权限。第一组标识授予文件所有者的权限，且几乎总是允许读取和写入的。第二组标志位授予同一用户组中其他成员权限。在这种情况下，`physics`\
  \ 组对文件具有读取权限，但没有写入权限。最后一组标志位授予“世界”（即所有用户）权限。\n\n`x` 权限值得再次查看。在 Windows 中，扩展名为 `.exe`\
  \ 的文件被*假设*为是可执行的。在 Linux 中，二进制可执行文件通过 `x` 权限来识别，因为我们没有显式的文件扩展来识别它。此外，只有设置了 `x` 权限的用户类才被允许调用执行。因此，如果我以普通用户身份登录，我不允许调用可能更改系统整体状态的程序（例如更改网络地址）。\n\
  \n`x` 权限的另一个有趣特性是它也适用于 shell 脚本（我们将在本章后面的部分介绍）。对于 DOS 粉丝来说，shell 脚本等同于 `.bat` 文件。它是一个可以作为程序执行的命令文本文件。但除非\
  \ `x` 位被设置，否则 shell 不执行该脚本。\n\n### “root” 用户\n\n每个 Linux 系统中都有一个名为 `root` 的非常特殊的用户。`root`\
  \ 无论权限标志位如何都可以对任何文件进行任何操作。`root` 主要用于系统管理目的，不建议日常使用。显然，如果你不小心，可能会遇到很多麻烦，而 `root`\
  \ 权限构成了潜在的安全威胁。尽管如此，嵌入式和实时开发者对系统执行的某些操作通常需要对 `root` 拥有的文件写入或执行权限，因此需要你以 `root` 用户身份登录。\n\
  \n过去，我大多数时候直接以 `root` 身份登录，因为这样比较省事。这导致的结果之一是我创建的每个文件都属于 `root`，如果不更改权限，普通用户无法写入。这变成了一个恶性循环。我以\
  \ `root` 登录得越多，我就*必须*越多以 `root` 登录来做任何有用的事。从以后我采取了更谨慎的做法：作为普通用户登录，仅在需要时切换到 root。\n\
  \n如果你以普通用户登录，可以使用 `su`、`substitute user` 或 `sudo` 命令切换到 `root`。不带参数的 `su` 命令会在你输入正确的\
  \ root 密码后启动一个具有 `root` 权限的 shell。要返回普通用户状态，输入 `exit` 终止 shell。\n\n`sudo` 命令允许你以\
  \ `root` 身份执行命令，前提是你已经在“sudoers 文件” `/etc/sudoers` 中被授权。当然，sudoers 文件文件由 `root`\
  \ 所有，因此只有 root 用户可以授权 sudoers。一旦你通过输入自己的密码通过了验证，你可以在短时间内（默认 5 分钟）使用 sudo，而无需重新输入密码。\n\
  \n例如，如果我想更改 `/dev` 目录中某个文件的权限，我可以执行：\n\n```\nsudo chmod +rw/dev/ttyS0\n```\n\n系统会提示我输入密码，如果输入成功，命令将执行。然后我可以在\
  \ 5 分钟内继续执行 sudo 命令，而无需重新输入密码。注意，sudo 比 su 提供了更好的安全性，因为 root 用户必须授权 sudo，且不需要披露\
  \ root 密码。\n\n### /proc 文件系统\n\n`/proc` 文件系统是 Linux 的一个有趣功能。它的作用就像普通文件系统。你可以列出 `/proc`\
  \ 目录下的文件，可以读取和写入这些文件，但它们并不真实存在。`/proc` 文件中的信息是在读取文件时生成的。注册了给定 `/proc` 文件的内核模块包含了生成读取数据和接受写入数据的函数。\n\
  \n`/proc` 文件是内核的一个窗口。它们以用户级任务和 shell 易访问的方式提供了系统状态的动态信息。在图 3.8 的简略目录列表中，数字标记目录表示进程。每个进程在\
  \ `/proc` 下都有一个目录，包含若干目录和文件描述进程的状态。\n\n尝试一下\n\n看看 Linux 仅通过启动就会产生多少进程是很有有趣的。重启系统，打开命令壳并执行：\n\
  \n```\nps –A | wc\n```\n\n\n\n\n\n`ps` 命令列出系统上运行的进程。`ps` 的输出每个进程占一行。`wc` 命令统计传递给它的行数、单词数和字符数。行数本质上就是运行的进程数。在我的\
  \ Fedora 14 系统上，有 281 个进程正在运行。\n\n现在尝试：\n\n```bash\nps –A | more\n```\n\n此命令让你每次一页地查看\
  \ `ps` 的输出。请注意，`ps` 命令的信息来自于 `/proc` 文件系统。\n\n这里是另一个能够凸显 `/proc` 数据实时性的命令。执行：\n\n\
  ```bash\ncat /proc/interrupts\n```\n\n`interrupts` 文件列出了系统中的所有的中断源、自系统启动以来每个中断触发的次数以及注册到该中断的驱动程序。现在，再次执行该命令：\n\
  \n```bash\ncat /proc/interrupts\n```\n\n你会发现许多数字都增加了，这证明了数据是动态生成的。\n\n![image](img/F000034f03-10-9780124159969.jpg)\n\
  \n图 3.8 /proc 文件系统。\n\n### 文件系统层次结构标准\n\nLinux 系统通常包含极数量的文件。例如，一个典型的 Fedora 安装可能包含大约\
  \ 30,000 个文件，占用几个 GB 的磁盘空间。显然，将这些文件以某种一致、连贯的方式进行组织至关重要。这就是文件系统层次结构标准（FHS）的动机。该标准允许用户和软件开发者“预测安装的文件和目录的位置”。^(4)\
  \ FHS 绝非 Linux 特有，它适用于通用的 Unix 类操作系统。\n\nLinux 文件系统的目录结构始终从*根目录*（root）开始，标识为 `/`。FHS\
  \ 指定了几个直接隶属于根目录的目录及其内容。这在图 3.9 中所示。FHS 从两个独立的轴对文件进行特征描述：\n\n*   **可共享与不可共享**。网络化系统可以通过网络文件系统（NFS）挂载某些目录，使得多个用户可以共享可执行文件。然而，某些信息是特定计算机独有的，因此是不可共享的。\n\
  *   **静态与变量**。Linux 系统中的许多文件是不改变的可执行文件，它们是*静态的*。但用户创建或获取的文件（例如通过下载或电子邮件）是*变量的*。这两类文件应该保持清晰分离。\n\
  \n![image](img/F000034f03-11-9780124159969.jpg)\n\n图 3.9 文件系统层次结构。\n\n以下是 FHS 定义的目录描述：\n\
  \n*   `/bin`：包含用户和系统管理员使用的命令二进制可执行文件。FHS 规定了 `/bin` 必须包含的内容，其中包括命令 shell 和基本文件实用工具。`/bin`\
  \ 文件是静态且可共享的。\n*   `/boot`：包含启动过程所需的所有内容，配置文件和安装程序映射除外。除了内核可执行镜像，`/boot` 还包含了内核开始执行用户态程序之前使用的数据。`/boot`\
  \ 文件是静态且不可共享的。\n*   `/etc`：包含主机特定的配置文件和目录。除了包含文件系统动态信息的 `mtab` 之外，`/etc` 文件都是静态的。FHS\
  \ 标识了 `/etc` 的三个可选子目录：\n    *   `/opt`：位于 `/opt` 中的附加应用程序包的配置文件。\n    *   `/sgml`：标准通用标记语言（SGML）和扩展标记语言（XML）的配置文件。\n\
  \    *   `/X11`：X 窗口的配置文件。\n在实践中，大多数 Linux 发行版有许多更多 `/etc` 子目录，代表可选的启动和配置需求。\n*\
  \   `/home`：（可选）包含用户家目录。每个用户在 `/home` 下都有一个与其用户名同名的子目录。虽然 FHS 将其标记为可选，但实际上它在 Unix\
  \ 系统中几乎是通用的。`/home` 下子目录的内容显然是变量的。\n*   `/lib`：包含启动系统和运行根文件系统中的命令所需的共享库镜像，即 `/bin`\
  \ 和 `/sbin` 中的二进制文件。在 Linux 系统中，`/lib` 有一个子目录 `/modules`，包含内核加载模块。\n*   `/media`：可移动介质的挂载点。当可移动介质被自动挂载时，挂载点通常是卷名。\n\
  *   `/mnt`：提供一个临时挂载文件系统的方便位置。\n*   `/opt`：包含可选的附加软件包。每个包在 `/opt` 下都有自己的子目录。\n* \
  \  `/root`：root 用户的家目录。^(5) 这不是 FHS 的要求，但通常是被接受的做法并高度建议。\n*   `/sbin`：包含对系统管理至关重要的二进制工具，如引导、恢复、还原或修复系统。这些实用工具通常仅供管理员使用，普通用户在路径中不需要\
  \ `/sbin`。\n*   `/tmp`：临时文件。\n*   `/usr`：二级层次结构，见下文。\n*   `/var`：变量数据。包括打印目录和文件、管理和日志数据，以及瞬态和临时文件。基本上是运行过程中变化的系统级数据。`/var`\
  \ 下有很多子目录。\n\n#### /usr 层次结构\n\n`/usr` 是一个包含面向用户的文件的二级层次结构。图 3.10 显示了 `/usr` 下的子目录。其中许多是根目录功能的镜像。可能\
  \ `/usr` 中最有趣的子目录是 `/src`。这通常是 Linux 源码安装的地方。你可以在 `/src` 下以格式为 `linux-<版本号>-ext`\
  \ 的子目录安装多个内核。\n\n![image](img/F000034f03-12-9780124159969.jpg)\n\n图 3.10 /usr 层次结构。\n\
  \n这将有一个指向正在使用的内核版本的逻辑链接 `linux`。\n\n### 文件系统的“挂载”\n\nWindows 和 Linux 文件系统的主要区别在于文件设备（硬盘、软磁盘、光驱等）如何映射到系统目录结构。Windows\
  \ 文件系统让设备显式可见，用字母-冒号组合标识，例如“C:”。而 Linux 强调*统一*的文件系统，其中物理设备实际上是不可见的。\n\n将物理设备映射到文件系统结构的机制被称为“挂载”。^(6)\
  \ 可移动介质设备（如光驱）是这一特性最明显的表现。在读取光驱之前，你必须使用 `mount` 命令将驱动器挂载到目录结构中的现有节点上，例如：\n\n```bash\n\
  mount/media/cdrom\n```\n\n该命令之所以有效，是因为 `/etc/fstab` 文件包含了关于通常挂载到 `/media/cdrom`\
  \ 的设备以及该设备包含什么类型的文件系统（在此例中为 `iso9660`）的信息。\n\n\n\n\n\n上述关于 FHS（文件系统层次结构）的部分提到了 `/etc`\
  \ 目录。这是 Unix 系统相对于 Windows 真正出彩的地方之一。好吧，Unix 优于 Windows 的方法有很多。无论如何，`/etc` 目录本质上以纯文本文件的形式包含了内核和应用程序所需的所有配置信息。这些文件的语法和语义并不总是一目了然，但至少你可以阅读它们。许多内核配置文件的格式在\
  \ man 页面（帮助页）中都有记载（参见“获取帮助”章节）。\n\n相比之下，Windows 系统特意将配置信息隐藏在一个名为“注册表”（the Registry）的魔法位置（伴随着阴森的音乐响起）。凡人用户经常被警告要远离注册表，因为不当的更改会导致系统无法启动。事实上，注册表只能通过特殊的程序\
  \ `regedit` 进行更改，直到大约一年前，我终于弄清楚了注册表物理上位于哪里。\n\n如果你曾鼓起勇气运行 `regedit` 并实际查看注册表，你无疑注意到条目是相当晦涩的符号，而值则是更加晦涩的二进制值。我认为这绝对是微软刻意为之。他们不希望愚蠢的消费者胡乱摆弄电脑并可能导致其报废。然而，Linux\
  \ 用户知道自己在做什么（这里是这么说的），并且有权随心所欲地查看和修改数据。\n\n## Shell（壳）\n\nLinux 系统启动时发生的最后几件事之一是调用名为\
  \ `shell` 的命令解释器程序。它的主要工作是解析你在控制台输入的命令并执行相应的程序。但 shell 不仅仅是一个简单的命令解释器。它还包含了一套强大且富有表现力的解释性编程语言。通过\
  \ shell 脚本语言和现有实用程序相结合，完全可以在不写写的一行 C 代码的情况下产生非常复杂的应用程序。事实上，这就是 Unix 编程的通用哲学：从一组简单的实用程序开始，通过\
  \ shell 脚本语言将它们连接起来。\n\nShell 脚本语言包含了循环、测试、函数等常用的编程结构。但也许 shell 工具箱中最精妙的技巧是“管道”（pipes）的概念。这是一种将数据从一个程序流到另一个程序的机制。这个比喻非常完美：一个程序将字节倾入管道的一端，而第二个程序从另一端取出这些字节。\n\
  \n大多数 Linux/Unix 实用程序从一个名为 `stdin` 的默认设备接受输入。同样，它们将输出写入一个名为 `stdout` 的设备。任何错误信息都会写入\
  \ `stderr`。通常，`stdin` 是键盘，而 `stdout` 和 `stderr` 是显示器。但我们可以同样轻松将 `stdin` 和 `stdout`\
  \ 视为管道的两端。\n\n`stdin` 和 `stdout` 可以被`重定向`（redirected），这样我们就可以将输出发送到文件，或从文件中读取输入。在\
  \ shell 窗口中，尝试只输入命令 `cat` 而没有任何参数。`cat` 可能是所有 Unix 实用程序中最简单的。它所做的只是逐行将 `stdin` 复制到\
  \ `stdout`。当你带参数输入命令时，它会耐心地在 `stdin` 等待键盘输入。输入一行文本，它就会将该行发送到 `stdout`（显示）。输入 `Ctrl-C`\
  \ 退出程序。\n\n现在尝试这个：\n\n```\ncat>textfile\n```\n\n输入一行文本。这次你没有看到该行被重复，因为 `>` 操作符将\
  \ `stdout` 重定向到了文件 `textfile`。输入几行，然后按 `Ctrl-C` 退出。\n\n这个练习的最后一步是：\n\n```\ncat<textfile\n\
  ```\n\n漂亮！你用之前的命令创建的文件显示在了屏幕上，因为 `<` 操作符将 `stdin` 重定向到了 `textfile`。`cat` 实际上实现了一个快捷方式，如果你将文件名作为命令行参数输入而不使用\
  \ `<` 操作符，它将将其视为输入文件。即：\n\n```\ncat textfile\n```\n\n然而，管道真正的威力在于 `|` 操作符，它获取一个程序的\
  \ `stdout` 并将其馈给另一个程序的 `stdin`。当我执行上述练习时，我创建了一个包含内容的 `textfile`：\n\n```\nthis is\
  \ a file\nof text from the keyboard\n```\n\n现在如果我执行\n\n```\ncat textfile | grep\
  \ this\n```\n\n我得到了：\n\n```\nthis is a file\n```\n\n正如你可能猜到的那样，`grep` 是一个过滤器。它尝试匹配其命令行参数和输入流\
  \ `stdin`。包含参数文本的行被传递到 `stdout`。其他行则直接被忽略。这里发生的情况是 `cat` 的输出变成了 `grep` 的输入。\n\n\
  按照典型的 Unix 风格，`grep` 代表 Get Regular Expression（获取正则表达式）“某个东西”。我忘记了 “p” 代表什么了。正则表达式实际上是一种强大的机制，可以说是一种用于搜索文本的脚本语言。`grep`\
  \ 体现了正则表达式的语法。\n\nShell 脚本和 Makefile 大量使用了重定向和管道。\n\n其他一些 shell 特性值得提一下，因为它们可以节省大量的输入。shell\
  \ 维护了一个命令历史，你可以通过上方向键访问它。这允许你重复任何之前的命令，或对其进行微调以创建一个新的、类似的命令。有一个 `history` 命令可以输出系统或某些子集的累积命令历史。历史维护在你主目录的\
  \ `.bash_history` 文件中。\n\n图 3.11 显示了我系统中 `history` 命令的最后几行。要重新执行列表中的任何命令，只需输入 `!`\
  \ 后紧跟历史列表中的命令编号，例如：\n\n```\n!998\n```\n\n![image](img/F000034f03-13-978012415996.jpg)\n\
  \n3.11 命令\n\n另一个非常酷的功能是自动补全，它可以为你补全文件名。假设我想执行\n\n```\ncat verylongfilename\n```\n\
  \n只要文件名的剩余部分在当前目录中是唯一的，shell 就会自动补全它，帮我省去输入整个文件名的麻烦。如果 shell 找不到唯一匹配项，它会发出哔声。这时你只需要多输入一点直到剩余部分唯一。\n\
  \n最后，`~` 字符代表你的主目录。所以从文件系统的任何地方都可以执行 `cd~` 回到主目录。\n\n事实上有几种常用的 shell 程序。它们的基本目的相同，但在语法和功能上有所不同。最流行的如下：\n\
  \n*   **Bourne Again Shell**——bash。`bash` 是 Bourne shell (`sh`) 的“重生”，最初由 Stephen\
  \ Bourne 编写并随 Unix 第 7 版发布。它是大多数 Linux 发行版的默认 shell，除非你有充分理由或强烈感觉使用不同的 shell，否则你应该使用它。\n\
  *   **Korn Shell**——ksh。由 David Korn 在 20 世纪 80 年代初开发。它提供了比 `bash` 更先进的编程功能，但保持了向后兼容。\n\
  *   **Tenex C Shell**——tcsh。C shell (`csh`) 的继者，而 `csh` 本身是 Bourne shell 的先驱。Tenex\
  \ 是一个启发了 `tcsh` 某些功能的操作系统。\n*   **Z Shell**——zsh。被描述为扩展的 Bourne shell，具有大量改进，包括\
  \ `bash`、`ksh` 和 `tcsh` 的一些有用功能。\n\nshell 编程的主题本身值得写一本书，而且有很多。我在 Amazon.com 上搜索“shell\
  \ programming”时，得到了 189 条结果。\n\n## 获取帮助\n\nUnix/Linux 系统的官方文档是一组被称为“man pages”（帮助页）的文件，man\
  \ 是 manual 的缩写。通过 shell 命令 `man` 访问 man 页面，例如：\n\n```\nman cp\n```\n\n\n\n\n要获取\
  \ shell 拷贝命令的帮助，请尝试一下。在 shell 提示符处输入 `man man` 可以学习更多关于 `man` 命令的信息。`Man` 会一次显示一屏，底部有一个“:”提示符。要移动到下一页，请输入`<space>`。在到达页尾之前退出\
  \ `man`，请输入“`q”。你也可以在 man 页中向上或向下翻页。有趣的是，你不会在 `man man` 页面中找到这些信息。man 页的写作风格非常简练；它们本质上是参考资料，而不是教程。信息通常限于：该命令的作用、它的参数是什么，以及它接受哪些选项。\n\
  \n为了方便查找特定主题，man 页被组织为以下章节：\n\n- 第 1 节：在 shell 提示符处输入的用户命令。\n- 第 2 节：内核应用程序接口 (API)\
  \ 函数。\n- 第 3 节：C 库函数。\n- 第 4 节：设备。关于特定外围设备的信息。\n- 第 5 节：文件格式。描述了 `/etc` 中许多文件的语法和语义。\n\
  - 第 6 节：游戏。\n- 第 7 节：杂项。\n- 第 8 节：系统管理。主要由系统管理员使用的 shell 命令。\n\n另一个有用的信息源是“info\
  \ 页”。info 页倾向于更详尽，提供关于某个主题的详细信息。通过 `info` 命令访问 info 页。尝试这个：\n\n```\ninfo gcc\n```\n\
  \n来了解更多关于 GCC 编译器包的信息。\n\n在 KDE 和 GNOME 等图形化桌面环境环境中，你也可以通过图形化界面访问 man 和 info 页。我发现通过这种方式查看\
  \ info 页内容特别有用。\n\n最后，在讨论 Linux 获取帮助时，如果不提到 Google，讨论将是不完整的。当你被 Linux 中的某些奇怪行为困扰时，Google\
  \ 是你的朋友。我常见的挫败感之一是错误信息，因为它们很少告诉你到底出了什么问题。所以，请将错误信息的一部分输入到 Google 搜索框中。你可能会收到至少十个处理该错误的论坛帖子，很有可能其中会有有用的信息。\n\
  \n在对 Linux 有了良好的基础之后，我们的下一个任务是配置开发工作站，并安装允许我们开发目标应用程序的软件。\n\n## 资源\n\nSobell, Mark\
  \ G., *A Practical Guide to Linux*. 自我开始攀那条陡峭的 Linux 学习曲线以来，这本书一直是我的圣经和伴侣。它是 Linux\
  \ 和类 Unix 系统的优秀入门指南，尽管出版于 1997 年，但它已经变得有些过时且难以找到。它已被 Sobell, Mark G., *A Practical\
  \ Guide to Linux Commands, Editors, and Shell Programming* 所代。\n\n[tldp.org](http://tldp.org)—Linux\
  \ 文档项目。正如名称所示，这是 Linux 文档的来源。你可以在这里找到教程、深度指南、常见问题解答 (FAQs)、man 页，甚至还有名为 *Linux Gazette*\
  \ 的在线杂志。材料通常写得很好且有用。\n\n¹是“preemptible”还是“preemptable”？Word 2007 的拼写检查器说两者都是错。一段时间前\
  \ [linuxdevices.com](http://linuxdevices.com) 上的辩论似乎倾向于“ible”结尾，但并没有定论。我想我会坚持使用\
  \ preemptible。\n\n²尽管我在嵌入式领域的经验是，保护功能（特别是文件权限）可能是一个完全的麻烦。某些程序，例如 Firefox 浏览器，并没有礼貌地告诉你你没有权限写入该文件，它们只是静静在那里什么也不做。\n\
  \n³图形化文件管理器提供不区分大小写的排序作为选项。\n\n⁴*文件系统层级标准——版本 2.3，日期 04 年 1 月 29 日*，由 Rusty Russell、Daniel\
  \ Quinlan 和 Christopher Yeoh 编写。可在 [www.pathname.com/fhs](http://www.pathname.com/fhs)\
  \ 获取。\n\n⁵注意这里潜在的混淆。目录层次结构既有一个*根*(root)“/”，还有一个*根目录*(root directory)“/root”，即 root\
  \ 用户的家目录。\n\n⁶这个术语可能追溯到卷带驱动器的时代，那时一卷磁带必须物理上被“挂载”(mounted)。\n\n⁷“变砖”(Bricking)是指把计算机的配置搞坏到再无法启动，从而使其等同于一块砖。这个术语在嵌入式领域被频繁使用。对于桌面电脑，更合适的词可能是“抛锚”(boat\
  \ anchoring)。\n\n⁸con**cat**enate 的缩写。你不喜欢 Unix 命令命名吗？\n\n# 第 4 章：主机开发环境\n\n当你说“我写了一个导致\
  \ Windows 崩溃的程序”时，人们只是茫然地看着你说：“嘿，这些问题系统自带的，**免费**送给我的。”\n\nLinus Torvalds\n\n在本章中，我们将配置主机工作站环境，为在第\
  \ 5 章中配置目标板做准备。涉及的步骤包括：\n\n- 从 Mini2440 DVD 安装一些软件\n- 配置工作站\n- 配置工作站的网络\n\n我们在这一章中有很多工作要做。但在深入这些之前，让我们泛泛看一眼交叉开发环境。\n\
  \n## 交叉开发工具——GNU 工具链\n\n目标计算机不仅资源有限，其处理器架构也可能与你（可能是）基于 x86 的开发工作站不同。因此，我们需要一个交叉开发工具链，它运行在\
  \ PC 上，但可能需要为不同的处理器生成代码。我们还需要一个工具来帮助我们调试运行中的代码。\n\n### GCC\n\n到目前，Linux 世界中使用最广泛的编译器是\
  \ GNU 编译器集合 (`GCC`)。它最初被称为 GNU 编译器，但后来更改了名称以反映它不仅对 C 语言的支持。`GCC` 拥有针对 C、C++、Objective\
  \ C、Fortran、Java 和 Ada 的语言前端，以及这些语言的运行时库。\n\n`GCC` 还支持除 x86 之外的多种目标架构。目标包括：\n\n\
  - Alpha\n- ARM\n- M68000\n- MIPS\n- PowerPC\n- SPARC\n\n等等。事实上，Wikipedia 关于 `GCC`\
  \ 的文章列出了 FSF 版本 GCC 支持的 43 处理器和处理器族。\n\n`GCC` 可以运行在多种环境中，包括 Linux 和其他 Unix 变体。甚至有可以在\
  \ DOS 和 Windows 下运行的版本。\n\n`GCC` 可以被构建在某一架构（例如 PC）上运行，同时为另一种架构（可能是 ARM）生成代码。这就是交叉开发的精髓。\n\
  \n`GCC` 是编译器、汇编器和链接器的结合体。各个语言前端将源代码翻译成中间汇编格式，然后由特定处理器的汇编器进行汇编，并最终链接成可执行文件。对于一个包含单个\
  \ C 源文件的程序，构建可执行文件的命令可以简单得如下：\n\n```\ngcc myprogram.c\n```\n\n默认情况下，这会创建一个名为 a.out\
  \ 的可执行文件。-o 选项让你执行显而易见的操作，即重命名可执行文件：\n\n```\ngcc -o myprogram myprogram.c\n```\n\
  \n如果你的项目包含多个源文件，-c 选项告诉 `GCC` 只编译：\n\n```\ngcc -c myprogram.c\n```\n\n生成可重定位的对象文件\
  \ `myprogram.o`。稍后可以使用另一个 `GCC` 命令将其与其他 .o 文件链接以产生可执行文件。\n\n通常情况下，你不会直接调用 `GCC`。你会使用\
  \ Makefile。\n\n### Make\n\n\n\n真实世界中的项目包含几十到数千个源文件。这些文件之间存在依赖关系，例如如果你更改了一个文件（例如一个头文件），另一个文件（如\
  \ C 源文件）就需要重新编译，最终整个项目都需要重新构建。跟踪这些依赖关系并确定在何时需要重新构建哪些文件，是名为 `Make` 的强大工具完成的工作。\n\n\
  作为 shell 命令 `make` 的响应，`Make` 工具从当前目录中名为 `Makefile` 或 `makefile` 的文件中获取指令。该文件由“依赖行”（dependency\
  \ lines）组成，指定“目标文件”（target file）如何依赖于一个或多个“前提文件”（prerequisite files）。如果任何一个前提文件比目标文件新，`make`\
  \ 将使用依赖行后面的一个或多个“构建命令”（construction commands）更新目标文件。基本语法如下：\n\n```\n target: prerequisite-list\n\
  \ <tab> construction commands\n```\n\n编写 makefiles 时需要注意的一个常见错误是用空格代替构建命令开头的制表符（tab）。它**必须**must）是一个制表符。\n\
  \n不要被这个简单的例子误导了。make 语法中包含大量的复杂性和微妙之处，它看起来有点像 shell 脚本语言。你在本章后面下载的示例代码包含一些简单的 Makefile\
  \ 示例。在后面的章节中，你将配置并构建 Linux 内核，它有一个巨大且非常复杂的 makefile。\n\n通常，为新项目创建 makefile 的最佳方法是从现有的类似项目的\
  \ makefile 开始。\n\n### GDB\n\nGDB 代表“GNU DeBugger”（GNU 调试器）。这是一个强大的源码级调试软件包，让你看到程序内部发生了什么。你可以对代码进行单步执行、设置断点、检查和修改变量等。和大多数\
  \ Linux 工具一样，`GDB` 本身是命令行驱动的，这使得它用起来相当相当繁琐。`GDB` 有几个图形化前端，可以将图形用户界面 (GUI) 命令翻译成\
  \ `GDB` 的文本命令。你在第 6 章中会遇到的 Eclipse 为 `GDB` 提供了一个非常优秀的图形化前端。\n\n`GDB` 可以设置为在主机工作站上运行，同时在另一台目标机器上调试代码。两台机器可以通过串口或网络端口连接，或者你可以使用在位仿真器（ICE）。许多\
  \ ICE 供应商都为他们的产品提供了 `GDB` 后端。\n\n某些处理器芯片中还内置了专用调试端口。这些端口被称为联合测试作用组（JTAG）和后台调试模式（BDM）。这些端口提供了访问硬件断点寄存器等调试功能的权限。这些端口也存在\
  \ `GDB` 后端。\n\n## 安装软件\n\n### DVD 上有什么？\n\n书中示例推荐的目标板是 FriendlyARM 生产的 Mini2440，由\
  \ Industrial ARMworks 在美国分发。资源部分提供了订购链接。第 5 章包含了关于该板的更多详细信息。\n\nMini2440 附带的 DVD\
  \ 包含了大量的软件。除了 Linux 外，它还支持 Windows CE 和 MicroC/OS II。我们主要感兴趣的是 `linux/` 子目录，其中包含内容：\n\
  \n- `arm-linux-gcc-4.3.2.tgz`——用于构建 Mini2440 软件的 GCC 交叉工具链。\n- `arm-qtopia.tgz`——QT\
  \ 图形库的应用开发工具包。这个为 Mini2440 构建代码。\n- `bootloader.tgz`——`u-boot` 和包含在 NOR flash 中的“vivi”启动加载器的源码。有一个较新版本的\
  \ `u-boot`，我们将在后面的章节中探讨。\n- `busybox-1.13.3-mini2440.tgz`——BusyBox 工具的源码，我们将在后面的章节中查看。\n\
  - `Descriptions.txt`——你所预期的内容。遗憾的是，它是中文的。\n- `examples.tgz`——练习板上许多外设和端口的示例代码。\n\
  - `linux-2.6.29-mini2440-20090708.tgz`——一个针对 Mini2440 预先补丁的 Linux 内核分支。我们将使用包含 Mini2440\
  \ 的较后版本内核。\n- `logomaker.tgz`——一个可执行文件。我猜它是创建启动屏图像文件的。\n- `madplay-0.15.2b.tar.gz`——一个\
  \ MPEG 音解码器和播放器。完整源代码。\n- `mkyaffs2image.tgz`——两个创建 YAFFS 镜像的可执行文件。你将需要使用名为 `mkyaffs2image-128M`\
  \ 的那个。\n- `root_qtopia.tgz`——Mini2440 的根文件系统。我们将通过 NFS 挂载它。\n- `vboot-src-20090721.tgz`——似乎某种启动加载器。不包含任何文档。\n\
  - `wireless_tools.29.tar.gz`——操作无线扩展的工具，设置无线 LAN 特定参数的接口。\n- `x86-qtopia.tgz`——另一个\
  \ QT 应用开发包。这个为 x86 生成代码。\n\n注意，上述列表是截至 2011 年 12 月的 `linux/` 目录内容。它可能会随后的发布而变化。\n\
  \n### 安装交叉工具链\n\n插入 DVD。1。在 KDE 中，只需插入就会弹出“可用设备”。选择那一个。这会将 DVD 挂载到 `/media/UDF/`\
  \ 并在文件管理器中打开该位置，我们真的需要使用它。\n\n这需要一段时间。（注意点表示当前目录）。在 shell 窗口中，以 root 用户身份（再次使用 `su`\
  \ 或 `sudo`）执行以下操作：\n\n```\ncd /\ncp /media/UDF arm-linux-gcc-4.3.2.tgz\ntar -xzf\
  \ arm-linux-gcc-4.3.2.tgz\n```\n\n你需要将 `/usr/local/arm-4.3.2/bin` 添加到你的 `PATH` 中，它是\
  \ shell 搜索可执行文件的目录列表。在 Fedora 中，定义 `PATH` 的文件是 `.bash_profile`。在 Ubuntu/Debian 安装中，它只是\
  \ `.profile`。从现在起我们将进行大量的编辑。如果你有喜欢的 Linux 编辑器，尽管使用它。我个人拒绝碰 `vi` 或 `emacs`^3。我喜欢的\
  \ KDE 编辑器是 Kwrite。在文件管理器中双击文本文件，它会自动在 Kwrite 中打开。\n\n在 `.bash_profile`（或 `.profile`）中你会发现一个以\
  \ `PATH=$PATH:` 开头的行，后面跟着 `$HOME/bin`。在该行的末尾添加 `:/usr/local/arm-4.3.2/bin`。保存文件并关闭编辑器。新的路径在你注销并重新登录后才会生效。这是最流行的交叉工具链之一。\n\
  \n### 安装根文件系统\n\n我们现在需要安装的另一个组件是目标板将通过 NFS 挂载的根文件系统。你应该仍以 root 登录。执行以下命令序列：\n\n\
  ```\ncd /home/<your_home_directory>\ncp /media/UDF root_qtopia.tgz\ntar -xzf root_qtopia.tgz\n\
  rm root_qtopia.tgz\n```\n\n注意你在这里不能使用 `~` 来指定家目录，因为你是以 root 登录的，`~` 解析为 `/root`。查看你家目录下新的\
  \ `root_qtopia/` 子目录，你会发现它的布局与工作站的根目录几乎相同。\n\n## 终端仿真器 minicom\n\n`minicom` 是一个简单的\
  \ Linux 应用程序，通过串口仿真哑 RS232 终端。我们将用它与目标板通信。\n\n最近的 Linux 发行版通常不会默认安装 `minicom`。它很容易安装。作为\
  \ root 用户（再次使用 `su` 或 `sudo`）执行：\n\n```bash\nyum install minicom\n```\n\n\n\n\n\
  | `apt-get install minicom` | 在 Ubuntu 或 Debian 中 |\n\n这两个命令本质上执行相同的操作。它们都会连接互联网寻找指定的软件包，解析任何依赖关系，下载软件包并安装它们。\n\
  \n一旦安装了 `minicom`，就有许多配置选项需要更改，以便与目标进行通信。\n\n在终端窗口中，再次*作为 root 用户*，输入命令 `minicom–s`。如果你是第一次运行\
  \ `minicom`，可能会看到以下警告信息：\n\n`WARNING: Configuration file not found. Using defaults`\n\
  \n你将看到一个配置菜单。选择 serial port setup（图 4.1）。默认情况下，`minicom` 通过调制解调器设备 `/dev/modem`\
  \ 通信。我们需要将其改为直接连接 PC 的一个串口，将单词“modem”替换为 `ttyS0` 或 `ttyS1`，其中 `ttyS0` 代表串口 COM1，`ttyS1`\
  \ 代表 COM2。然而，如果你的主机只有 USB 端口且你正在使用 USB 转串口转换器，那么正确的设备可能是“ttyUSB0”。同样，如果你正在运行虚拟机，请确保虚拟机已挂载到串口。\n\
  \n![image](img/F000046f04-01-9780124159969.jpg)\n\n图 4.1 `minicom` 串口设置菜单。\n\n输入“E”后按“I”以选择\
  \ 115,200 波特率。确保硬件和软件流控都设置为“no”。这些是切换选项。输入“F”或“G”将在相应值在“yes”和“no”之间进行切换。图 4.1 显示了最终的串口配置。\n\
  \n输入 <Enter> 退出串口设置，然后选择 modem and dialing。在这里，我们想要删除 调制解调器的 Init 字符串和 Reset 字符串，因为在直接串口连接中它们是多的。输入“A”并通过退格键删除整个\
  \ Init 字符串。输入“B”并对 Reset 字符串执行相同的操作。此菜单中的其他字符串并不重要，因为它们永远不会被调用。\n\n输入 <Enter> 退出\
  \ modem and dialing，然后选择 screen and keyboard。输入一次“B”将退格键从 BS 更改为 DEL。\n\n输入 <Enter>\
  \ 退出 screen and keyboard。选择 Save setup as dfl（默认）。然后选择 Exit。\n\n执行 `ls–l /dev/ttyS0`（如果你在串口设置中选择了\
  \ `/dev/ttyS1` 或 `/dev/ttyUSB0`，则使用相应的路径）。注意，只有所有者和组有权访问设备。为了获得此端口的权限，你必须成为 `dialout`\
  \ 组的成员。\n\n通常情况下，有两种方法可以实现，你选择哪种取决于个人偏好。可以通过 Fedora 菜单中的 Administration（管理）> Users\
  \ and Groups（用户和组）访问图形化对话框。你会被要求输入 root 密码。这将弹出图 4.2 所示的用户管理器对话框。高亮你的用户名并选择 Properties（属性）。然后选择\
  \ Groups 标签（图 4.3）。向下滚动找到 `dialout` 并勾选它。点击 OK，然后关闭用户管理器对话框。\n\n![image](img/F000046f04-02-9780124159969.jpg)\n\
  \n图 4.2 用户管理器对话框。\n\n![image](img/F000046f04-03-9780124159969.jpg)\n\n图 4.3 组对话框。\n\
  \n另一种方法是手动编辑 `/etc/group` 文件。作为 root 用户，在编辑器中打开 `/etc/group`。找到以“dialout:”开头的行，并在行末尾添加“:<your_user_name>”。保存文件并关闭编辑器。\n\
  \n## 网络\n\n主机的网络配置需要几处更改。\n\n### 网络地址\n\n你的工作站可能配置为通过动态主机配置协议（DHCP）获取网络地址。但情况下，为了简单起见，我们将为工作站和目标指定固定\
  \ IP 地址。\n\n通过 Administration（管理）-> Network Configuration（网络配置）访问 Fedora 修改网络参数的图形菜单。4。在\
  \ Network Configuration 对话框中，选择 Devices 标签（默认），高亮 `eth0` 并点击 Edit。在 Ethernet Device\
  \ 对话框的 General 标签中，取消勾选“Automatically obtain IP address settings with …” 框。现在输入固定\
  \ IP 地址。网络地址 `192.168.1` 是一个很好的选择，因为它是本地网络保留的网络地址范围之一。为你的工作站选择节点 2。如图 4.4 所示输入子网掩码。如果你连接到网络，可能还需要设置默认网关地址和\
  \ DNS 节点。\n\n![image](img/F000046f04-06-9780124159969.jpg)\n\n图 4.4 编辑网络设备对话框。\n\
  \nControlled by NetworkManager 复选框可能会产生问题。如果你的网络端口已经激活且勾选了此框，可能没有问题。但注意，当你退出 Network\
  \ Configuration 对话框时，Activate（激活）和 Deactivate（禁用）按钮不是“激活”状态的。如果网络端口未激活，你就无法对其进行控制。我发现有效的方法是取消勾选\
  \ NetworkManager 框，激活端口，然后再次勾选该框。下次启动时，端口应该会自动激活。当你退出配置对话话框时，系统会询问你是否要保存更改。选择 Yes。根据我的经验，通常不需要重启网络。\n\
  \n或者，你可以直接进入编辑网络设备文件。网络参数位于 `/etc/sysconfig/network-scripts/` 中，你应该在那里找到一个名为 `ifcfg-eth0`\
  \ 的文件。你可能想复制该文件并将其命名为 `dhcp-ifcfg-eth0`。这样，如果以后需要，你就有一个 DHCP 配置文件。现在用编辑器（当然是作为 root\
  \ 用户）打开原始文件。它看起来应该像 Listing 4.1。这里显示的行行顺序可能不同，并穿插着其他行。\n\n![image](img/F000046f04-04-9780124159969.jpg)\n\
  \n列表 4.1 (a) `ifcfg-eth0` 和 (b) 修改后的 `ifcfg-eth0`。\n\n将行 `BOOTPROTO=dhcp` 更改为 `BOOTPROTO=none`，并如\
  \ Listing 4.1b 所示添加四行新内容。严格来说，只有当工作站连接到可以访问互联网的网络时，Gateway 条目才是必要的。\n\nUbuntu 用户会发现，如果图形化网络配置对话框确实存在，几乎无法访问。因此，你需要编辑相应的配置文件，即\
  \ `/etc/network/interfaces`。最初，该文件有两个行如 Listing 4.2a 所示描述本地回环接口的行。如 Listing 4.2b\
  \ 所示添加四行描述 `eth0` 的行。同样，只有当工作站连接到可以访问互联网的网络时，Gateway 条目才是必要的。\n\n![image](img/F000046f04-05-9780124159969.jpg)\n\
  \n列表 4.2 (a) Interfaces 和 (b) 修改后的 Interfaces。\n\n### 无线如何？\n\n个人而言，我没有在 Linux 中直接配置无线网络端口的成功经验。但无线端口在虚拟机环境中运行良好，因为虚拟机管理器虚拟化了网络接口，使其在虚拟机内部看起来是其他设备。例如，VirtualBox\
  \ 将任何物理网络接口转换为 Intel 82540EM 千兆以太接口。\n\n\n\n\n拥有两个接口非常有用。例如，你可以让无线端口连接到网络并通过 DHCP\
  \ 获取其 IP 地址，同时按照上述描述重新配置以太网端口，以实现与目标机的独占连接。例如，我的网络是 `192.168.1.1`。我将目标板插入交换机。路由器中的\
  \ DHCP 服务器提供范围从 `100` 到 `199` 的节点地址。我笔记本电脑上的 Windows 宿主机操作系统从 DHCP 获取 IP 地址。Linux\
  \ 客户端通过此处描述的步骤固定了其地址，一切运行良好良好。\n\n## 网络文件系统 (Network File System)\n\n我们使用 `NFS`\
  \ 来挂载目标板的根文件系统。5。当我们从第 7 章开始开发应用程序时，这样做的原因就会显而易见。这意味着我们需要“导出”工作站上的一个或多个目录，以便在网络上可见。\n\
  \n导出的目录在文件 `/etc/exports` 中指定。该文件可能存在，但目前是空的。以 `root` 用户身份，使用编辑器打开它并添加以下行：\n\n```\n\
  /home/<your_home_name> *(rw,no_root_squash,sync,no_subtree_check)\n```\n\n将 `<your_home_name>`\
  \ 替换为你的主目录名称。这将使主目录在网络上可见，其他节点可以将其部分内容挂载到本地文件系统中。`*` 表示允许挂载此目录的客户端。在这种情况下，网络上的任何机器可见该目录。你可以通过\
  \ DNS 名称或 IP 地址指定特定机器（例如 `machine1.intellimetrix.us` 或 `192.168.1.50`）。你也可以通过提供网络和网络掩码来指定给定网络上的所有机器，如\
  \ `192.168.1.0/255.255.255.0`。\n\n括号内的选项描述了客户端如何访问该目录。此处选项包括：\n\n*   `rw`: 允许读写访问。也可以指定\
  \ `ro` 为只读。\n*   `no_root_squash`: 默认情况下，客户端上 `root` 用户发的文件请求在服务器上被视为来自用户 `nobody`。如果指定了\
  \ `no_root_squash`，客户端上的 `root` 用户将拥有与服务器 `root` 用户相同的访问权限。这可能会带来安全影响，但在某些情况下是必要的。\n\
  *   `sync`: 通常情况下，文件写入是异步的，这意味着当 `NFS` 将请求交给文件系统但在实际到达最终目的地之前，客户端就会收到写入完成的通知。`sync`\
  \ 选项等待操作真正完成。\n*   `no_subtree_check`: 如果只导出了卷的一部分，名为“子树检查”（subtree checking）的例程会验证请求的文件是否在导出的部分。如果导出了整个卷，或者你不在意此项检查，禁用子树检查将加快传输速度。\n\
  \n`NFS` 对此文件的格式相当挑剔。最后一行必须以换行符结束，且括号内部不允许有空格。\n\n配置好导出文件后，我们需要确保 `NFS` 正在运行。Fedora\
  \ 用于此目的图形对话框位于 `Administration>Services`（服务管理），如图 4.5\n\n图 4.5 服务管理对话框。\n\n在 shell\
  \ 中，你可以使用 `service` 命令控制 `nfs`其他服务，该命令运行位于 `/etc/init.d` 中的指定 System V init 脚本。例如，启动\
  \ `nfs` 将执行：\n\n```\nservice nfs start\n```\n\n停止它，将执行：\n\n```\nservice nfs stop\n\
  ```\n\n检查状态：\n\n```\nservice nfs status\n```\n\n查看 `/etc/init.d` 查看是否存在名为 `nfs`\
  \ 的脚本文件。查看该文件以了解它是如何工作的。\n\n## 简单文件传输协议 (Trivial File Transfer Protocol)\n\n我们要处理的最后一项事务是简单文件传输协议。\n\
  \n\n\n## 嵌入式硬件\n\n嵌入式计算涵盖了极其广泛的硬件：从（可能）为你的自动咖啡机提供动力的 8 位处理器，到手机或平板电脑中的（可能是多核的）32\
  \ 位处理器，再到运行电信网络的大规模并行处理环境。在本章中，我们将开始研究嵌入式目标板，我们将在接下来的章节中用它进行应用程序编程。\n\n## ARM 单板机\n\
  \n`ARM` 是一种 32 位精简指令集计算机（`RISC`）架构，由 `ARM Holdings` 开发，这是一家最初名为 Advanced RISC Machines\
  \ 的英国公司。据报道，从产量来看，它是部署最广泛的 32 位架构。`ARM` 处理器的相对简单性使其适用于低功耗应用。因此，它们已经主导了移动和消费电子市场。约\
  \ 98% 的手机至少使用一个 `ARM` 处理器.^(1)\n\n`ARM Holdings` 本身并不制造芯片。相反，它将该架构授权给许多半导体制造商，包括\
  \ `AppliedMicro`、`Atmel`、`Freescale`、`Marvell`（原 `Intel`）、`Nvidia`、`ST-Ericsson`、`Samsung`\
  \ 和 `Texas Instruments`（`TI`）等。\n\n接下来的几章将探索使用单板机（`SBC`）作为目标的跨平台环境应用程序编程。具体而言，我们将使用一种小型基于\
  \ `ARM` 的 `SBC`，即 `Mini2440`，它基于 `Samsung S3C2440 ARM9` 系统级芯片（`SOC`）。该板的 `Mini35`\
  \ 版本包含一个 3.5 英寸触摸屏 `LCD`，并配有所有必要的电缆和电源，以及一张包含有用软件的 DVD。`Mini35` 的单价价格约为 120 美元（图\
  \ 5.1）。\n\n![image](img/F000058f05-01-9780124159969.jpg)\n\n图 5.1 带有 3.5 英寸 LCD\
  \ 的 Mini2440。\n\n为什么选择 `Mini2440`？在研究基于 `ARM` 的 `SBCs` 时，我认为 `Mini2440` 性价比最高。在合理的价格提供了多样化的功能\
  \ set。\n\n`Mini2440` 由一家名为 `FriendlyARM` 的中国公司制造。美国分销商是 `Industrial ARMworks`。详见资源部分。\n\
  \n### 规格\n\n• 处理器：`Samsung S3C2440`，405 MHz\n• 64 MB RAM\n• 128 MB 至 1 GB NAND 闪\n\
  • 2 MB NOR flash\n• 外围连接：\n• 10/100 以太网\n• `USB 2.0` 主机和设备\n• 3 个 `RS-232`（9 针 D\
  \ 型连接器）\n• `SD/MMC` 插槽\n• 多通道 `ADC`（`pot` 连接到通道 `0`）\n• 立体音频输出，麦克风输入\n• `JTAG`\n\
  • 4 个用户 LED\n• 6 个用户推按钮\n• 电源（5 VDC，带开关的圆柱插头和 LED）\n• 尺寸：100 mm（~3.6 英寸）× 100 mm\n\
  \n## 其他板子如何？\n\n市场上有很多基于 `ARM` 的 `SBCs`。我选择 `Mini2440` 是因为它看起来性价比最高。尽管如此，回顾几个流行的替代方案仍然值得。\n\
  \n### BeagleBoard\n\n`BeagleBoard` 是一种流行的开源硬件 `SBC`，基于 `TI OMAP3530` `SOC`，它结合了\
  \ `ARM Cortex-A8` CPU 和 `TI TMS320C64x` 数字信号处理器。它最初由 `TI` 作为教育工具开发，其设计在知识共享许可下发布，使其实际上是开源的。\n\
  \n#### 规格（修订版 C4）\n\n• 处理器：`TI OMAP3530`， 720 MHz\n• 256 MB RAM\n• 256 MB NAND 闪\n\
  • 外围连接：\n• 使用 `HDMI` 连接器的 `DVI-D`，最大分辨率 1280×1024\n• S 视频\n• `USB 2.0 HS OTG`\n\
  • `RS-232`\n• `JTAG`\n• `SD/MMC` 插槽\n• 立体音频输入输出\n• 电源（5 VDC，圆柱插头）\n• 尺寸：75 mm（~3\
  \ 英寸）× 75 mm\n• 建议分销商价格：125 美元\n\n该板在 5 V 下仅需 2 W，也可以通过其 `USB` 端口供电。\n\n名为 `BeagleBoard-xM`\
  \ 的 `BeagleBoard` 修改版本于 2010 年 8 月开始发货。`-xM` 稍大，为 8.25 × 8.25 cm，具有更快的 CPU 核心（1\
  \ GHz，相比 `C4` 的 720 MHz）、更大的 RAM（512 MB 对 256 MB）、板载以太口、摄像头端口和 4 口 `USB` 集线器。`-xM`\
  \ 缺少板载 NAND，需要将操作系统和文件系统存储在 `microSD` 卡上。`-xM` 的建议分销商价格为 149 美元。\n\n作为一个具有大型社区的开源项目，`BeagleBoard`\
  \ 似乎是一个自然的选择。\n\n### Gumstix\n\n`Gumstix` 系列 `SBCs` 由一家名称源自口香糖的公司制造。由于其尺寸小，有两个系列：`Overo`\
  \ 和 `Verdex`。\n\n### 规格\n\n• 处理器：400 MHz 的 `Overo-OMAP270` 或 720 MHz 的 `Verdex-OMAP3530`\n\
  • 256 MB RAM\n• 无闪存，从 SD 卡启动\n• 外围连接：\n• 以太网\n• `USB 2.0`\n• `HDMI`\n• RCA 视频\n\
  • 立体音频输出\n• 摄像头插针\n• 通过 `microUSB` 插座供电\n• 尺寸：85.6×53.9×17 mm\n\n### Raspberry Pi\n\
  \n2012 年 3 月，`Raspberry Foundation` 引入了 `Raspberry Pi`，目标是在学校提供计算机科学教育。该设备于 2012\
  \ 年 2 月上市并几乎立即售一空。\n\n### 规格\n\n• 处理器：700 MHz 的 `Broadcom BCM2835`（`ARM11`）\n• 256\
  \ MB RAM\n• 无闪存，从 SD 卡启动\n• 外围连接：\n• 以太网\n• `USB 2.0`\n• `HDMI`\n• RCA 视频\n• 立体音频输出\n\
  • 摄像头连接插针\n• 通过 `microUSB` 供电\n• 尺寸：85×53×2.1 mm\n\n## 设置 Mini2440\n\n图 5.2 显示了板的布局。遗憾的是，所有有趣的东西——推按钮、LED\
  \ 和 A/D 电位器——都被显示面板遮住了。取出固定显示器到支撑柱上的四个螺丝。这里有几种替代方案。你可以移除支撑柱并将其安装在板的另一侧。或者，你可以使用四个\
  \ #3 公制螺母将显示 PCB 固在 LCD 上，并仅让它与主板分离。\n\n该板提供了四根电缆：\n\n• 9 针 D 转 9 针 D `RS-232` 电缆。注意，该电缆是母对母的。你会预计这是一根\
  \ Tx 和 Rx 线路交叉的“调制解调器”电缆，但不是。它是直连的。\n• 交叉电缆。这允许你直接将板连接到工作站的以太网端口，而无需通过集线器或交换机。把它看作标准的以太网调制解调器。\n\
  • `USB` 电缆。这是最初加载引导程序所需的。\n• `JTAG`，25 针 D 转 10 针平电缆。这用于在板的 `JTAG` 端口上驱动 `NOR` 闪存。我们将在稍后的章节查看它。\n\
  \n## 闪存和文件系统\n\n\n\nMini2440 具有多种形式的内存，包括易失性和非易失性内存，如图图 5.3 所示。非易失性存储有两种形式：一个占据处理器内存地址空间一部分的\
  \ 2 MB `NOR flash`，以及一个使用字节宽端口进行地址和数据的 128 MB `NAND flash`。此外还有 64 MB 的 `SDRAM`\
  \ 作为工作内存。\n\n![image](img/F000058f05-03-9780124159969.jpg)\n\n图 5.3 Mini2440 内存配置。\n\
  \nFlash 内存有两种基本形式，称为 `NAND` 和 `NOR`，根据其存储单元的基本逻辑结构命名。这两种类型具有鲜明的特性，适用于系统中的不同功能。\n\
  \n`NOR flash` 因其可靠性、快速的读取操作和随机访问能力，非常适合用于代码存储。由于代码可以直接在本地执行，`NOR` 是存储固件、启动代码、操作系统以及不经常变化的数据理想选择。Mini2440\
  \ 拥有 2 MB 的 `NOR flash`，尽管我们并没有真正使用它。\n\n`NOR flash` 的缺点是写入和擦除时间较慢。`NAND flash`\
  \ 的特点是密度更高、成本更低、写写更快以及更长的擦写寿命。这使得它适合存储数据。但 `NOR flash` 可以像 `RAM` 一样直接在处理器的内存空间中访问，而\
  \ `NAND flash` 通过逐位或逐字节的方式访问。\n\n我们的系统有 128 MB 的字节宽 `NAND flash`，组织成四个“分区”：\n\n\
  | 名称 | 大小 | 偏移 |\n| --- | --- | --- |\n| u-boot | 0×00040000 | 0×00000000 |\n| env\
  \ | 0×00020000 | 0×00040000 |\n| kernel | 0×00500000 | 0×00060000 |\n| root fs |\
  \ 0×07aa0000 | 0×00560000 |\n\n第一个分区是 256 KB，包含启动加载器 `u-boot`。下一个 128 KB 的分区包含启动加载器的环境变量。第三个分区是\
  \ Linux 内核，占用 5 MB。最后，最后一个分区包含其他所有内容并持有根文件系统。\n\n### Flash 中的根文件系统\n\n在生产嵌入式环境中，根文件系统通常以压缩镜像的形式存在于闪存中。当内核启动时，它会将该镜像复制并解压到\
  \ `RAM` 中，以便文件系统是可写的。这样做的一个结果是文件系统是`易失的`。系统通电期间所做的任何更改在断电后都会丢失。要使文件更改永久，你必须重新刷镜像。\n\
  \n由于根文件系统存储在 `NAND flash` 中，我们可以对文件进行更改，这些更改会直接反映回闪，因此是`非易失的`。\n\nLinux 文件系统有许多不同的格式，最流行的是\
  \ `ext3` 和 `ext4`。这些文件系统通常位于磁盘等质存储设备上，并不适用于闪存存储设备。\n\nFlash 设备上的文件系统必须处理“磨损均衡”和坏块等问题。为了写入闪存扇区，必须先对其进行擦除。闪存设备的每个扇区可以承受有限的擦除次数，通常以十万次计。闪存文件系统试图通过在整个设备上均匀分布写入操作来最大限度地延长设备寿命。同样，它会检测出现缺陷的扇区并在其周围移动数据。\n\
  \n理想情况下，闪存设备的文件系统将透明地实现这些操作，使用户户将其视为磁盘。\n\n### 准备开发板\n\n值得仔细查看 `factory_images/`\
  \ 中的各种脚本文件。其中一个是你需要编辑的。对于此处的每个部分，请用编辑器打开相应的文件并进行操作。\n\n### 示例代码\n\n`factory_images/`\
  \ 目录包含若干项目。确保对所有用户都设置了 `execute` 权限。使用 `chmod` 命令进行设置。\n\n### factoryimages\n\n\
  `factory_images/` 目录包含：\n\n- `README`: 描述目录中的文件。\n- `boot_usb`: 通过 USB 下载文件的程序。\n\
  - `mini_boot`: 用于设置目标机的 U-boot 脚本。\n- `*.sh`: 几个简化某些操作的 shell 脚本。\n- `sc2410_boot_usb.tar.gz`:\
  \ `boot_usb` 的源代码。\n- `set-mini_boot`: 用于下载和运行 `mini_boot` 的 minicom 脚本。\n- `target_fs.yaffs`:\
  \ 用于加载到 NAND flash 的 YAFFS 文件系统镜像。\n- `u_boot.bin`: 预编译的 u-boot 。\n- `uImage-3.1.5`:\
  \ 可执行内核镜像。\n- `yaffs.patch`: 配置内核时我们需要此文件。\n\n### 脚本文件\n\n其中一个是你你需要编辑。对于此处的每个部分，请用编辑器打开相应的文件并进行操作。\n\
  \n### mini_boot\n\n此脚本由 `u-boot boot loader` 解析。它使用 `setenv` 命令设置几个环境变量并将环境保存到 `NAND\
  \ flash` 中。然后它使用简单文件传输协议 (`TFTP`) 下载三个文件——u-boot 启动加载器、Linux 内核和根文件系统镜像，并将它们保存到\
  \ `NAND flash` 中相应的分区。\n\n第 1 行中的数字（默认值为 5）标识连接到板的 LCD 屏幕。Mini2440 的 Mini35 版本配有几种不同的\
  \ 3.5 英寸 LCD 面板，所有面板都具有不同的定时和偏移参数。下表列出了所有显示器和相应的索引号。面板类型通常在边框上标识，如果没有在边框上，则在 LCD\
  \ 的 PCB 底部。\n\n第 2 行指定了目标板根文件系统所在的位置。将 `<your_home_directory>` 替换为你的主目录名称。保存文件。我们现在不会对该文件进行更详细的介绍，因为我们将在稍后的章节中查看\
  \ `u-boot`。\n\n#### set-mini_boot\n\n\n\n\n这是一个由 `minicom` 执行的脚本。它的主要作用是通过 TFTP\
  \ 下载 `mini_boot` 脚本并开始执行。但在执行此操作之前，它必须为目标机的 IP 地址和 TFTP 服务器的地址设置几个环境变量。如果你需要使用不同的网络地址，可以在这里进行修改。请根据需要编辑第\
  \ 2 行（目标地址）和第 6 行（服务器地址）。\n\n### *.sh\n\n有三个相当短的 Linux Shell 脚本，它们封装了一些实现细节。\n\n\
  `mk_kernel.sh`——`mkimage` 程序用于向文件添加 `u-boot` 头部，它需要许多难以记忆的参数。此脚本为 Linux 内核镜像添加相应的头部信息。\n\
  \n`mk_uboot.sh`——此脚本为第一个参数提供的 `u-boot` 脚本添加 `u-boot` 头部，并将生成的文件移动到 TFTP 目录；如果没有提供第二个参数，该目录默认为\
  \ `/var/lib/tftpboot`。你需要在刚刚编辑过的 `mini_boot` 文件上调用此脚本：\n\n```\nmk_uboot mini_boot\n\
  ```\n\n`move_files`——将要下载到目标的文件复制到 TFTP 目录，除非指定参数，否则使用 `/var/lib/tftpboot`。执行此脚本。\n\
  \n### 操作步骤\n\n1. 将三根线缆（USB、网线和串口线）以及电源连接到板卡。将启动选择开关拨到 NOR 位置，靠近板卡边缘。\n\n2. 在 Linux\
  \ Shell 窗口中，`cd` 进入 `factory_images/` 并执行 `minicom -w`（-ww 用于“折行显示”）。在另一个 Shell\
  \ 窗口中，`cd` 进入 `factory_images/` 并切换为 root 用户。\n\n3. 开启板卡电源。Supervivi 显示如图 5.4 所示的菜单。这出现在运行\
  \ `minicom` 的窗口中。按下“d”。板卡现在等待下载文件。\n\n![image](img/F000058f05-04-9780124159969.jpg)\n\
  \n图 5.4 Supervivi 菜单。\n\n4. 在另一个 Shell 窗口中（作为 root 用户），执行 `./boot_usb u-boot.bin`。文件下载到目标板卡并在下载完成后开始执行。U-Boot\
  \ 现在正在板卡上运行。\n\n5. 在 `minicom` 窗口中，执行以下两个命令：\n\n```\nnand scrub\nnand createbbt\n\
  ```\n\n这两个命令都需要确认你确实要执行操作。`createbbt` 命令需要很长时间。1 GB 的闪存可能需要 15 分钟。\n\n6. 在 `minicom`\
  \ 窗口中，输入 Ctrl-a “g” 调出运行脚本对话框（图 5.5）。输入“c”并回车“set-mini_boot”。双击 <Enter> 键。`minicom`\
  \ 脚本运行。这需要一些时间。\n\n![image](img/F000058f05-05-9780124159969.jpg)\n\n图 5.5 minicom\
  \ 运行脚本对话框。\n\n7. 在下载闪文件系统镜像期间，`minicom` 脚本可能会“超时”，显示为无响应。输入 Ctrl-c 可以使其恢复运行。\n\n\
  8. 当闪存文件系统镜像写入 NAND 完成后，将启动选择开关拨回 NAND 位置（朝向支柱）并按下白色复位按钮。`u-boot` 引导加载程序将启动你刚刚加载的\
  \ Linux 内核，并通过 NFS 从你的工作站挂载根文件系统。\n\n### 最终步骤\n\n当内核启动时，你会在 `minicom`（控制台）窗口看到许多消息。这些消息跟踪内核启动的进度。在\
  \ LCD 屏幕上，你会看到 Tux 的图像。最后，屏幕上将出现以下消息：\n\nStarting networking…（启动网络……）\nStarting\
  \ web service…（启动 Web 服务……）\nStarting leds service…（启动 LED 服务……）\nStarting Qtopia,\
  \ please waiting…（正在启动 Qtopia，请等待……）\n\n控制台窗口的最后一行是：\n\nPlease press enter to activate\
  \ this console.请按回车激活此控制台。）\n\n按下 <Enter> 后 root 身份登录，无需密码。\n\n执行 `ls` 命令只需证明 Linux\
  \ 正在运行。执行 `ls –l bin`。注意，几乎每个条目都是指向 busybox 的链接。我们将在书的后面部分详细介绍 BusyBox。为了直观感受目标环境，列出\
  \ `/proc` 目录并导出中断文件，以查看目标上 Linux 注册了哪些中断。\n\n同时，屏幕现在显示的是图 5.6，这是一个由 Qtopia 生成的图形菜单。即使菜单是英文的，这并不是我们目前想要的。所以现在你应该禁用\
  \ Qtopia。\n\n![image](img/F000058f05-06-9780124159969.jpg)\n\n图 5.6 Qtopia 主菜单。\n\
  \nQtopia 是通过 `root_qtopia/etc/init.d` 中的脚本文件 `rcS` 启动的。以 root 身份用编辑器打开文件并滚动到最后。在最后三行前加上“#”将其注释掉。同时也注释掉第\
  \ 44–52 行以 `/etc/rc.d/init.d/httpd start` 开头的行。我们将自己处理 Web 服务器和 LED，不希望内置服务干扰。\n\
  \n你可能会问：“我如何通过图形化文件管理器以 root 身份打开文件？” 有方法，但很多时候我匆忙打开一个文件编辑，结果发现它属于 root。我想出的绕过此问题的技巧是：使用“另存为”将文件保存到主目录，然后在\
  \ Shell 窗口中变为 root 用户，并将文件移回原始位置。\n\n保存文件后，重置目标机。它应该进入 Linux 且没有 Qtopia 屏幕。\n\n\
  ### 可能会出现什么问题？\n\n在启动如 Mini2440 等嵌入式目标板卡时，遇到困难并不罕见。最常见的问题分为两大类。第一串口。确保波特率设置正确。这通常不是问题，因为\
  \ 115 kBd 似乎是 `minicom` 的默认值。更常见的问题是没有关闭硬件流控。此外，确保你使用的是随附的串口线。两端都是母头接口的线缆通常是交叉线，但\
  \ Mini2440 配置的是直连线。常见的网络问题包括启用了增强 Linux (SELinux) 和开启了防火墙。这将阻止目标通过 NFS 挂载根文件系统。作为起点，禁用\
  \ SELinux 并关闭防火墙。确保 IP 地址正确。并双击你使用的网络线——如果你直接连接目标和工作站则使用交叉线，如果通过集线器使用直连线。\n\n##\
  \ 引导加载程序\n\nMini2440 采用两阶段启动过程，我们将在第 14 章中详细探讨。最后阶段是一个称为 U-Boot 或简单的 u-boot 的开源引导加载程序，它位于闪存中。按下复位按钮，这次快速输入一个两个键。我通常按空格键。\n\
  \n而不是执行自动启动，u-boot 在打印出板的基本信息后会显示自己的提示符。\n\n输入命令 `printenv` 查看环境变量。有很多。以下是比较重要的环境变量：\n\
  \n```\nbootdelay=3\nbaudrate=115200\nbootcmd=nand read 3200000 kernel 267000; bootm\
  \ 3200000\nstdin=serial\nstdout=serial\nstderr=serial\nethaddr=08:08:11:18:12:27\n\
  bootargs=console=ttySAC0,115200 root=/dev/nfs nfsroot=192.168.1.2:/home/doug/root_qtopia\
  \ ip=192.168.1.50\n```\n\n注意上述最后两行在 U-Boot 中实际上是一行。默认变量为：\n\n- `bootdelay`——继续自动启动前等待的秒数。\n\
  - `baudrate`——对于串口。\n- `bootcmd`——如果没有中断自动启动则执行的命令。\n- `stdin`, `stdout`, `stderr`——将标准\
  \ Linux 文件符重定向到串口。\n- `ethaddr`——设置板卡的 MAC 地址。注意所有 Mini2440 板卡的默认 MAC 地址都相同。\n-\
  \ `bootargs`——内核启动时传递的命令行参数。`bootargs` 信息包括：\n    - 控制台设备以及由于是串口，还有波特率，\n    - 根文件系统类型，在此例中为\
  \ NFS，\n\n\n\n\n\n- NFS 根文件系统所在的位置，\n- 该设备的 IP 地址。\n\n通常情况下，MAC 地址在设备制造时，会使用从电气与电子工程师学会（IEEE）获得的数字“烧录”到太网设备中，这保证了全球范围内每一个\
  \ MAC 地址都是唯一的。但此板的厂商没有这样做，每块板在初始化时都程序了相同的 MAC 地址。\n\n在实践中，只需要确保特定*网络段*上的每个 MAC 地址都是唯一的即可。如果你在同一个网络段上有两个或多个\
  \ Mini2440 开发板，你必须更改其中一个之外的所有设备的 MAC 地址。你可以通过执行 `u-boot` 命令来更改地址：\n\n```\nsetenv\
  \ ethaddr nn.nn.nn.nn.nn.nn\n```\n\n其中“nn”代表任何任意十六进制数字。如果你更改了 MAC 地址或对环境变量进行了任何其他更改，将需要执行\
  \ `saveenv` 以使更改持久化。\n\nU-boot 拥有非常丰富的命令集，其中许多细节详见附录 A。现在，输入 `help` 即可查看完整列表。\n\n\
  当目标板已完全配置并连接到工作站后，我们现在需要一个合适的集成开发环境（IDE）来简化编写应用程序的任务。这就是第 6 章](#CHP006.html_CHP006）的主题。\n\
  \n## 资源\n\n- [andahammer.com](http://andahammer.com)—Mini2440 美国分销 Industrial ARMworks\
  \ 的网站。\n本书的配套网站：[`booksite.elsevier.com/9780124159969`](http://booksite.elsevier.com/9780124159969)。\n\
  - [friendlyarm.net](http://friendlyarm.net)—Mini2440 的中国制造商。有一个丰富的下载页面，但许多实用内容已经在\
  \ DVD 中。销售页面列出了全球经销商的完整列表。\n- [`billforums.station51.net`](http://billforums.station51.net)。\n\
  - [`groups.google.com/group/mini2440`](http://groups.google.com/group/mini2440)—这是关于\
  \ Mini2440 的两个非常好的讨论论坛。\n- [intellimetrix.us/downloads.htm](http://intellimetrix.us/downloads.htm)—该页面还托管了示例代码以及后续的所有更新和错误列表。\n\
  \n### 其他开发板站点\n\n- BeagleBoard: [beagleboard.org](http://beagleboard.org)。\n- Gumstix:\
  \ [gumstix.org](http://gumstix.org) 和 [gumstix.com](http://gumstix.com)。\n- Raspberry\
  \ Pi: [raspberrypi.org](http://raspberrypi.org)。\n- ¹c|net，“ARMed for Living Room，”[`news.cnet.com/ARMed-for-the-living-room/2100-1006_3-6056729.html`](http://news.cnet.com/ARMed-for-the-living-room/2100-1006_3-6056729.html)。\n\
  \n# 第 6 章\n\n# Eclipse 集成开发环境^(1)\n\n你可以花一整天的时间来自定义标题栏。\n\n相信我。这是我的经验之谈。\n\nMatt\
  \ Welsh\n\nIDE 是提高生产力的极佳工具。桌面开发者已经使用它们多年了。最常见的例子可能是微软的 Visual Studio 环境。过去，许多嵌入式工具厂商都构建了自己的私有\
  \ IDE。\n\n在开源世界中，首选的 IDE 是 Eclipse，也称为 Eclipse 平台，有时简称为平台。该项目由对象技术国际（OTI）启动，随后被\
  \ IBM 收购。2001 年底，IBM 与几个合作伙伴组成了一个协会，将 Eclipse 作为一个开源项目进行推广和开发。它现在由 Eclipse 基金会维护，这是一个由软件行业供应商组成的非营利联盟。几家领先的嵌入式\
  \ Linux 厂商（如 Monta Vista、TimeSys、LinuxWorks 和 Wind River Systems）已接受 Eclipse 作为它们未来\
  \ IDE 开发的基础。\n\n我甚至会说，Eclipse 是目前最专业、运行最良好的开源项目。在过去的约 6 年里，每年 6 月中旬，基金会都会发布平台及大部分相关项目的重大新版本，总计约\
  \ 2000 到 3000 万行代码。在 2011 年之前，这些版本按照字母顺序用木星的卫星来命名。2010 年的版本名为 Helios。2011 年的版本打破了这一传统，名为\
  \ Indigo。\n\n应该注意的是，Eclipse 不限于在 Linux 下运行。它在各种 Windows 操作系统下的运行同样良好。\n\n## 概述\n\
  \n“Eclipse 是一种通用工具平台——一个开放、可扩展的 IDE，适用于任何特定或特定的用途。它提供了一个功能丰富的开发环境，允许开发者高效地创建能够无缝集成到\
  \ Eclipse 平台的工具，”该平台自身的在线概述是这样说的。从技术上讲，Eclipse 本身并不是一个 IDE，而是用于开发 IDE 和*富客户端*应用程序的*开放平台*。\n\
  \n图 6.1 显示了基本的 Eclipse 工作区。它由几个*视图*（views）组成，包括：\n- `Navigator`—显示工作区中的文件，\n- `Text\
  \ Editor`—显示文件内容，\n- `Tasks`—“待办事项”列表，\n- `Outline`—正在编辑的文件大纲。\n\n![image](img/F00006X06-01-978012415969.jpg)\n\
  图 6.1 工作区\n\n尽管 Eclipse 有许多内置功能，但大部分功能都是通用的。它采用插件（plug-ins）。除了一个名为平台运行时（Platform\
  \ Run-time）的小内核外，Eclipse 平台的所有功能都在插件中。该平台主要用 Java 编写，实际上最初被设计为 Java 开发工具。图 6.2 显示了平台的主要组件和\
  \ API。平台的主要作用为工具开发者提供使用的机制和遵循的规则，以便创建无缝集成的工具。这些机制通过定义良好的 API、类和方法暴露。平台还提供了实用的构建块和框架，有助于开发新工具。\n\
  \n![image](img/F00006X06-02-978012415969.jpg)\n图 6.2 Eclipse 平台\n\nEclipse 的设计和构建满足以下要求：\n\
  - 支持构建各种应用程序工具。\n- 支持不受限制的工具供应商，包括独立软件供应商。\n- 支持处理任意内容类型，如 HTML、Java、C、JSP、EJB、XML\
  \ 和 GIF。\n- 促进不同内容类型和工具供应商之间的无缝集成。\n- 支持基于图形和非图形的应用开发环境。\n- 运行在各种操作系统上，包括 Windows\
  \ 和 Linux。\n- 利用 Java 语言的流行来编写工具。\n\n### 插件\n\n*插件*（plug-in）是 Eclipse 功能的最小单元，可以独立开发和交付。一个小工具通常写在一个插件中，而一个复杂工具可能会将其功能拆分到多个插件中。除了一个名为平台运行时的小内核外，Eclipse\
  \ 平台的所有功能都在插件中。\n\n插件用 Java 编写。典型的插件包含 JAR 库中的 Java 代码、一些只读文件以及其他资源，如图像、Web 模板、消息目录和原生代码库。某些插件不包含代码，例如以\
  \ HTML 页面形式贡献在线帮助的插件。单个插件的代码库和只读内容位于文件系统中的同一个目录，或位于服务器上的基础 URL 下。\n\n\n\n\n每个插件的配置由一对文件描述。`manifest`\
  \ 文件（即 `manifest.mf`）声明了关于插件的基本信息，包括名称、版本以及对其他插件的依赖。第二个可选文件 `plugin.xml` 声明了插件与其他插件之间的连接关系。这种连接模型非常简单：插件可以声明任意数量命名的\
  \ `extension points`（扩展点），以及针对其他插件中一个或多个扩展点的任意数量的 `extensions`（扩展）。\n\n扩展点可以被其他插件扩展。例如，`workbench`\
  \ 插件为用户偏好声明了一个扩展点。任何插件都可以通过定义对该扩展点的扩展来贡献其自己的用户偏好。\n\n## Workbench（工作区）\n\nEclipse\
  \ 的 `workbench` API、UI 和实现是由两个工具包构建的：\n\n1. 标准小部件工具包 (`SWT`)——一组与原生窗口系统集成的小部件和图形库，但具有与操作系统无关的\
  \ API。\n2. `JFace`——一个使用 `SWT` 实现的 UI 工具包，简化了常见的 UI 编程任务。\n\n与都是通用 UI 工具包的 `SWT`\
  \ 和 `JFace` 不同，`workbench` 提供了 Eclipse 平台的 UI 个性，并提供了工具与用户交互的结构。由于这种核心且决定性的作用，`workbench`\
  \ 等同于整个 Eclipse 平台的 UI，也等同于平台运行时看到的主窗口（见图 6.1）。`workbench` API 依赖于 `SWT` API，在较程度上依赖于\
  \ `JFace` API。\n\nEclipse 平台的 UI 范式基于编辑器（editors）、视图（views）和视角（perspectives）。从用户的角度来看，工作窗口在视觉上由视图和编辑器组成。视角体现在屏幕上可见编辑器和视图的选择与排列上。\n\
  \n`Editors`（编辑器）允许你打开、编辑和保存对象。它们遵循类似于基于文件系统的工具的打开–保存–关闭生命周期，但与 `workbench` 的集成得更紧密。激活时，编辑器可以向\
  \ `workbench` 菜单和工具栏贡献操作。平台为文本资源提供标准的编辑器；其他插件提供更具体的编辑器。\n\n`Views`（视图）提供你正在处理的某些对象的信息。视图可以通过提供有关正在编辑文档的信息来协助编辑器。例如，标准的内容大纲视图会在活动编辑器有可用内容时显示其内容的结构化大纲。视图可以通过提供有关当前选中对象的信息增强其他视图。例如，标准的属性视图会显示在另一个视图中选中对象的属性。平台提供了几个标准视图；额外的视图由其他插件提供。\n\
  \n一个工作区窗口可以有多个独立的 `perspectives`（视角），但在任何时刻只有一个是可见的。每个视角都有自己的视图和编辑器，它们在屏幕上进行排列（平铺、堆叠或分离）以便展示，尽管某些可能是隐藏的。在一个视角内，可以同时打开不同类型的视图和编辑器。视角控制初始视图的可见性、布局和操作的可见性。你可以快速切换视角来处理不同的任务，并轻松地重新排列和自定义视角以更好地适应特定任务。平台提供了用于通用资源导航、在线帮助和团队支持任务的标准视角。其他插件提供了额外的视角。\n\
  \n插件工具可以增强现有的编辑器、视图和视角以：\n\n- 向现有视图的本地菜单和工具栏中添加新操作。\n- 当现有编辑器变为激活状态时，向工作区菜单和工具栏添加新操作。\n\
  - 向现有视图或编辑器的弹出内容菜单中添加新操作。\n- 向现有视角中添加新视图、操作集和快捷键。\n\n### 安装\n\nEclipse 有两个部分：Eclipse\
  \ 本身和 Java 运行环境 (`JRE`)。从 [eclipse.org](http://eclipse.org) 下载 Eclipse。有多个版本可供选择。由于对\
  \ C 开发感兴趣，请获取适用于 C/C++ 开发者的 Eclipse IDE。\n\n你可以将 Eclipse 放在任何你喜欢的地方。我选择安装在 `/usr/local`。解压后，你会发现一个意料之中的、名为\
  \ `eclipse/` 的新子目录。\n\n由于 Eclipse 主要用 Java 编写的，因此你需要一个 `JRE` 来支持它。大多数现代 Linux 发行版默认都会安装\
  \ `JRE`，但它可能与 Eclipse 不兼容。Fedora 14 提供的 `IcedTea6` 运行良好。如有必要，请从 Oracle（原 Sun Microsystems）下载最新版本。下载的是一个可执行的二进制文件。将其复制到任何你喜欢的地方并执行它。`/usr/local`\
  \ 是一个好地方。你会被要求阅读并接受 Java SE 运行时环境版本 6 的二进制代码许可协议。你需要将新安装的 `JRE` 的 `bin/` 目录添加到你的\
  \ `PATH` 中。\n\n就是这样。Eclipse 已安装完成并准备就绪。在 shell 窗口中，`cd` 进入 `eclipse/` 目录并执行 `./eclipse`。从其他地方输入\
  \ eclipse 可执行文件的完整路径。或者直接在 KDE 文件管理器窗口中双击它。\n\n更好的办法是在 `/usr/bin` 目录下创建一个名为 `eclipse`\
  \ 的脚本文件。它包含如下：\n\n```bash\n#!/bin/bash\n/usr/local/eclipse/eclipse &\n```\n\n第一行标识此文件为\
  \ shell 脚本。第二行执行 Eclipse。`&` 表示在后台运行此程序并返回 shell 提示符。由于 `/usr/bin` 在你的路径中，你只需要输入\
  \ `eclipse`。\n\n## 使用 Eclipse\n\n每次 Eclipse 启动时，它都会要求你选择一个 `workspace`（工作空间），这是你存放项目文件的地方。默认是你家目录下的名为\
  \ `workspace/` 的目录。在 `workspace/` 下是每个项目的子目录。按照工作空间对话框，如果你是第一次执行 Eclipse，你将看到欢迎界面。在后续运行中，Eclipse\
  \ 会直接打开工作区，但你仍然可以通过帮助菜单中的第一项访问此窗口。\n\n[/content]\n\n## C 开发环境—CDT\n\n在 [Eclipse.org](http://Eclipse.org)\
  \ 正在进行的项目中有工具项目。该项目的一个子项目是 `CDT` 项目，它为 Eclipse 平台构建了功能完整的 C 和 C++ IDE。Linux 下的 `CDT`\
  \ 基于 GNU 工具并包含：\n\n- 具有语法高色的 C/C++ 编辑器，\n- 使用 `GDB` 的 C/C++ 调试器，\n- 用于外部程序的 C/C++\
  \ 启动器\n- 解析器，\n- 搜索引擎，\n- 内容辅助程序，\n- Makefile 生成器\n\n### 创建新项目\n\n在我们 C/C++ 项目的初始练习中，我们将创建一个简单的记录排序应用程序。要排序的记录由名称和\
  \ ID 数字组成。为了简化代码，我们将名称中的任何空格替换为下划线。程序将根据命令行指定的，按名称或 ID 数字升序对记录文件进行排序：\n\n```\nrecord_sort\
  \ <datafile> [1|2]\n```\n\n其中 `1` 表示按名称排序，`2` 表示按 ID 排序。如果没有给出排序参数，则默认按名称排序。\n\n\
  \n\n在 Eclipse C/C++ 视图中，选择 `File>New>C Project`。这会弹出如图 6.3 所示的新项目向导。将其命名为“record_sort”。项目类型选择\
  \ `Executable>Empty Project`；工具链选择 `Linux GCC`，我们将使用默认的工作空间位置。点击 Next 会弹出 Select\
  \ Configurations 对话框，你可以在其中选择 `Debug` 或 `Release` 配置中的一个或两者。稍后，你将可以选择构建这些配置中的某一个。它们的主要区别在于，`Debug`\
  \ 配置在构建时开启了编译器的调试标记“-g”，以便为 `GDB` 提供符号信息。而 `Release` 配置则排除了调试标记。\n\n![image](img/F00006Xf06-03-9780124159969.jpg)\n\
  \n图 6.3 新项目向导。\n\n当你在新项目向导中点击 Finish 时，你会在 Project Explorer 视图中看到一个项目。`record_sort`\
  \ 项目下的唯一项是 `Includes`，这是一个用于搜索头文件的路径列表。\n\n此时，查看目录 `workspace/record_sort/` 可能会很有帮助。它仅包含两个文件：`.cproject`\
  \ 和 `.project`，这两个文件都是描述项目的 XML 代码。`.project` 为基础 Eclipse 平台提供配置信息，而更详尽的 `.cproject`\
  \ 则为 `CDT` 提供信息。没有必要理解这些文件的内容，但知道它们的存在是有用的。\n\n### 向项目添加源代码\n\n向项目添加源代码基本上有两种方法。你当然可以在可以在编辑器（Editor）窗口中创建一个新文件，也可以将现有文件导入到项目中。执行\
  \ `File>Import…` 弹出 Import 对话框。展开 `General` 类别并选择 `File System`。点击 Next，然后点击 Browse，导航到\
  \ `record_sort` 并点击 OK。这会弹出 Import 对话框。选择所有文件并点击 Finish。这些文件现在显示在 Project Explorer\
  \ 视图中。请注意，并没有 `record_sort.c` 文件。这是因为你将亲自输入它，以练习 `CDT` 编辑器。\n\n点击工具栏左侧 New 图标旁的小箭头，从下拉菜单中选择\
  \ `Source File`。将其命名为 `record_sort.c`。编辑器窗口将打开，并带有初步的头部注释。`record_sort.c` 的内容如图\
  \ 6.4 所示，但在阅读下一节之前不要开始输入。\n\n![image](img/F00006Xf06-04-9780124159969.jpg)\n\n图\
  \ 6.4 record_sort.c。\n\n### 内容辅助 (Content Assist)\n\nCDT 编辑器具有许多让你的编码工作变得更容易的功能。这些功能统属于\
  \ `Content Assist`。`Content Assist` 的基本思想根据当前的上下文、作用域和前缀预测你可能输入的内容，从而减少必须输入的按键次数。可以通过输入\
  \ `Ctrl+Space` 调用，并且在结构体或类名后输入 `.`、`->` 或 `::` 时也会自动激活。\n\n### 代码模板 (Code Templates)\n\
  \n`Code Templates` 是 `Content Assist` 的一个元素，为经常使用的代码段提供起点。当你输入一个字母组合并跟随 `Ctrl+Space`\
  \ 时，会显示以该字母开头的代码模板列表。选择一个，它将自动插入到文件中当前光标位置。\n\n尝试一下这个——在图 6.4 中输入 `#include` 行后，输入\
  \ `ma` 然后 `Ctrl+Space`。这将弹出 `main()` 函数的模板。你可以在 `Window>Preferences>C/C++>Editor>Templates`\
  \ 下编辑模板。Content Assist 的其他方面也可以在 Preferences 下自定义。\n\n### 自动闭合\n\n在你输入时，请注意每当你输入左引号、括号\
  \ `()`、方括号 `[]`、角括号 `<` 或大括号 `{}` 时，编辑器会自动添加结束字符并将光标置两者之间。在括号内输入任何所需内容并按 `Enter`。这会将光标置于结束字符之后。然而，如果你将光标移出封闭区域（例如为了复制粘贴某些文本），`Enter`\
  \ 键将恢复其开始新行的正常行为。\n\n对于大括号，结束大括号将根据当前选择的编码样式进行放置，并且光标将正确缩进。\n\n最后，请注意在你输入时，Outline\
  \ 视图中会出现相应的条目，用于识别头文件、函数以及（如果有的话）全局变量。\n\n### 程序\n\n在继续构建和运行项目之前，让我们仔细看看它实际上在执行什么。`main()`\
  \ 本身非常直观。它只是对 `sort_utils.c` 中声明的函数的调用，这些函数执行了实际工作。\n\n`read_file()` 函数读取数据文件，假设该文件组织为每行一条记录，其中记录包含一个文本名称和一个数字\
  \ ID。它为记录数组分配内存，并为每个名称字段单独分配内存。\n\n有两个排序函数——一个根据名称字段排序，另一个根据 ID 字段排序。这两个函数都实现了以其发明者\
  \ Donald Shell 命名的壳排序（shell sort）。壳 排序通过比较相隔几个位置的元素，比更简单的插入排序改进了性能。\n\n在记录数组排序后，`write_sorted()`\
  \ 将其写入 `stdout`。这当然可以被重定向到文件。\n\n最后一步是在函数 `return_records()` 中返回所有分配的内存。\n\n该程序实质上几乎没有进行任何“合理性检查”（sanity\
  \ checking），如果你有兴趣，可能想在其中加入一些。在错误检查方面也极少。\n\n### 构建项目\n\n一旦你完成并保存了 `record_sort.c`\
  \ 文件，下一步就是构建项目。在项目中创建或导入的所有文件都会自动成为该项目的一部分，并被构建和链接到最终的可执行文件中。\n\n在 Project Explorer\
  \ 视图中，选择顶层 `record_sort` 条目。然后执行 `Project>Build Project` 或右键点击并选择 `Build Configurations>Build>All`。在前一种情况下，将构建\
  \ `Active Configuration`。默认情况下，这是 `Debug` 配置。可以通过执行 `Project>Build Configurations>Set\
  \ Active` 来更改 `Active Configuration`。\n\n在后一种情况下，将构建 `Debug` 和 `Release` 配置。哪种情况下，Project\
  \ Explorer 视图中的 `record_sort` 下出现一个或两个新条目。这些条目代表 `Debug/` 和 `Release/` 目录，分别存放对应配置的对象文件和可执行文件。每个目录还包含一个\
  \ `makefile` 和一些 Eclipse 特有的文件。\n\n\n\n修复问题并重新构建项目。顺便说明一下，默认情况下 Eclipse 不会在构建前自动保存修改过的文件。你必须手动保存。该行为可以在选项（Preferences）中更改。保存\
  \ `sort_utils.c` 并再次运行构建。这次应该会成功，你会在项目资源管理器（Project Explorer）视图的 Debug 树中看到可执行文件。\n\
  \n在继续调试之前，你可能想在编辑器中开启行号显示，因为我们在过程中引用行号。在编辑器窗口中，右键点击左侧的垂直栏（称为标记栏）。其选项之一是 `Show Line\
  \ Numbers`（显示行号）。点击它。这是一个全局参数，适用于编辑器中当前打开的任何文件以及随后打开的文件。\n\n## 使用 CDT 进行调试\n\nCDT\
  \ 与 `GDB` 的集成非常紧密。与大多数 Unix 工具一样，`GDB` 本身面向面向命令行。Eclipse 为原生接口提供了一个图形化封装，这样你就不需要记住所有的命令了。\n\
  \n在调试之前，我们必须创建一个调试启动配置（debug launch configuration.）。执行 `Run>Debug Configurations…`。选择\
  \ `C/C++ Application` 并点击左上角的 `New` 按钮。这会弹出如图 6.5 所示的 `Debug Configuration` 对话框。所有内容已正确填写。我们只需要添加一项。选择\
  \ `Arguments` 选项卡，并在 `Program arguments:` 窗口中输入“datafile”。`datafile` 是一组程序用于排序的示例数据记录。它与\
  \ `sort_utils.c` 和 `record_sort.h` 一起被导入项目。\n\n![image](img/F00006Xf06-05-9780124159969.jpg)\n\
  \n图 6.5 调试配置对话框。\n\n点击 `Apply`，然后点击 `Debug`。系统询问你是否要打开调试视图（Debug perspective）。选。\n\
  \n图 6.6 显示了初始调试视图。底部是 `Console`（控制台）窗口，终端 I/O 在此处进行。编辑器窗口显示 `record_sort.c` 并高亮了\
  \ `main()` 的第一行。右侧的 `Outline`（大纲）选项卡列出了 `record_sort.c` 包含的所有头文件，以及在该文件中声明的所有全局和外部符号，包括变量、常量和函数。\n\
  \n![image](img/F00006Xf06-06-9780124159969.jpg)\n\n图 6.6 调试视图。\n\n右上角是一组选项卡，提供了各种调试信息，包括局部变量、断点和寄存器。当然，最初所有局部变量都是随机值，因为它们是分配在栈上的。在左上角\
  \ `Debug` 选项卡正下方是一组执行图标。点击 `Step Over`（步过）图标。编辑器窗口中的高亮将移动到下一行，`Variable`（变量）视图中的\
  \ `sort` 显示其初始值为 `1`。该值被黄色高亮显示，是因为它自上次调试器挂起以来发生了变化。你也可以通过简单地将光标悬停在任何变量上来查看其当前值。试一试。\n\
  \n现在，点击 Debug 视图工具栏中的 `Resume`（恢复）图标让程序继续运行。嗯，我们得到的结果并不完全符合预期。`datafile` 有十二条记录，但只有一条记录输出到\
  \ `Console` 视图。这是因为程序中内置了几个运行时错误，以便练习使用调试器。\n\n### Debug 视图（调试视图）\n\n在 Debug 视图中，右键点击顶层项目项并选择\
  \ `Relaunch`（重新启动）以开始另调试运行。如图 6.7 所示，Debug 视图以分级形式显示程序状态。层级顶部是 `launch instance`（启动实例），即由名称标识的启动配置实例。其下方是调试器实例，由调试器名称标识，在此例中为\
  \ `gdb`。调试器下方是受调试器控制的程序线程。对于 `record_sort` 只有一个线程。稍后我们将看到 `gdb/Eclipse` 如何处理多线程程序。\n\
  \n![image](img/F00006Xf06-07-9780124159969.jpg)\n\n图 6.7 调试视图。\n\n最后，在最底层的是由函数名、源代码行号和程序计数器标识的线程栈帧（stack\
  \ frames）。目前只有一个 `main()` 栈帧停在 `record_sort.c` 的第 22 行。\n\nDebug 视图的工具栏有许多用于管理程序执行的按钮。将光标悬停在它们上可以查看标签。\n\
  \n点击一次 `Step Over`，然后点击 `Step Into`（步入）进入 `read_file()` 函数。注意，Debug 视图中出现了第二个栈帧，编辑器中打开了\
  \ `sort_utils.c`。此时，仔细观察工作区右上角的四个选项卡视图是值得的。\n\n### Variables View（变量视图）\n\n当在 Debug\
  \ 视图中选择一个栈帧时，`Variables` 视图会显示该帧中的所有局部变量。现在你应该处于 `read_file()` 函数中。可见两个变量都是指针。点击名称左侧的白色箭头可以取消指针引用并显示相应的值。对于字符串变量，完整字符串将在窗口中显示。\n\
  \n选择 Debug 视图中的 `main()` 栈帧，注意 `Variables` 视图会变为显示 `main()` 中的局部变量。如果选中的不是栈帧，变量视图将变为空。记住，你也可以通过将光标悬停在变量上来查看值。\n\
  \n### Breakpoints View（断点视图）\n\n为了调试 `record_sort` 中的问题，你可能需要设置一个或多个断点。选择 `Breakpoints`\
  \ 视图，目前它是空的，因为我们还没有设置任何断点。\n\n在 `sort_utils.c` 的第 34 行设置断点。那是 `read_file()` 中 `if`\
  \ 语句的开头。在标记栏的 34 行点击右键并选择 `Toggle Breakpoint`（切换断点）。出现绿圆表示此处设置了启用的断点。标记表示断点已成功安装。\n\
  \n断点视图会出现新项目，带有断点的完整路径。复选框显示断点已启用。点击复选框禁用断点，注意标记栏中的圆变为白色。禁用的断点会被调试器忽略。再次点击复选框重新启用。\n\
  \n点击 Debug 视图工具栏中的 `Resume`，程序运行到断点。Debug 视图中的 `Thread [0]` 表示线程由于命中断点而挂起。点击 `Step\
  \ Over` 让 `temp` 加载第一条记录。选择 `Variables` 视图并点击 `temp` 旁的白色箭头。现在你可以看到 `temp` 中字段的当前值。自上次挂起以来值发生变化的变量会被黄色高亮。\n\
  \n### Memory View（内存视图）\n\n在调试视图底部选项卡窗口中默认还会显示另一个面向调试的视图。MemoryMemory 视图允许你监控和修改进程内存。内存被组织为\
  \ `memory monitors`（内存监控）列表，每个监控器代表一个由基地址指定的内存区域。每个内存监控可以使用四种预定义格式之一或多种显示，这些格式被称为\
  \ *memory renderings*（内存渲染）。预定义的渲染格式为十六进制（默认）、ASCII、有符号整数和无符号整数。\n\n图 6.8 显示了 `read_file()`\
  \ 中第一次调用 `fscanf()` 之后 `temp` 分配区域的内存监控。Memory 视图分为两个窗格，一个列出当前激活的监控器，另一个显示所选监控器的渲染结果。一个监控器可以启用多个渲染格式，这些格式将在渲染面板中以选项卡形式显示。\n\
  \n\n\n前四个字节包含一个指向为名称分配区域的指针。记住 `x86` 是一种“小端字节”机器。因此，当如所示显示内存时，大多数条目看起来都是“反过来”的。\n\
  \n每个窗格都有一组很小且相当直观的按钮用于管理窗格。这些按钮允许你添加或删除显示器或渲染器，在显示器的情况下，还可以删除所有显示器。\n\n## 完成调试\n\
  \n在有了关于 Eclipse 核心调试功能的背景知识后，你应该能够找到插入到 `sort_utils.c` 中的两个运行时错误。祝你好运。\n\n## 总结\n\
  \n在我拙见，Eclipse 是我见过的执行最专业的开源项目。它构思周密，实现严谨。尽管它拥有强大的功能和灵活性，但最常用的操作却相对简单直观。文档虽然仍然具有参考性质而非教程性质，但仍然具有可读性，并且大部分情况下是准确的。遗憾的是，有太多的开源项目无法这样评价。\n\
  \n插件机制使得 Eclipse 具有无限的扩展性。这为开源和商业扩展提供了机会，以应对各种应用程序。下方的“资源”部分列出了 Eclipse 插件仓库。\n\n\
  就像书中的许多主题一样，我们真的只是浅尝表面，专注于嵌入式开发人员特别感兴趣的领域。但希望这足以激发你进一步挖掘的兴趣。那里还有很多东西。加油吧！\n\n我们现在已经完全准备好为目标板进行真正的编程了。那是下一章的主题。\n\
