  \ makefile 中应该有一种自动完成此操作的方法，但我还没有研究出来。\n\n⁴提示：如果 `<DATA>` 标签溢出缓冲区边界会发生什么？绕过此问题的权宜方法是每次读取和写写一个字符。但这会产生重大的性能影响，因为每次调用\
  \ `read()` 和 `write()` 都会导致向内核空间的转换，并伴随着相应的开销。因此，如果我们能以大块进行读取和写入效果会更好。\n\n⁵别忘记将收件人改为你自己。\n\
  \n# 第 11 章：内核的配置与构建\n\nHackito ergo sum\nAnonymous\n\nLinux 最奇的特性之一在于你拥有源代码。你可以随心所欲地对它做任何你想做。我们大多数人并没有打算也没有需要深入直接修改内核源码。但访问源码意味着内核是高度可配置的。也就是说，你可以构建一个精确匹配你目标系统需求或局限性的内核。\n\
  \n再次，如果你的角色是为 Linux 编写应用程序（正如我们在最后几个章节中所做的那样），或者你是一个 Linux 系统管理员，你可能永远不需要接触内核。但作为一名嵌入式系统开发者，你将需要构建新内核，可能需要好几次，无论是为了工作站还是目标环境。幸运的是，配置和构建内核的过程相当简单。我的经验是，构建新内核是一个极好的建立信心的练习，特别是对于\
  \ Linux 新手来说如此。\n\n本章的剩余部分将详细说明并解释为我们的目标开发板配置和构建可执行内核镜像所需的各种步骤。\n\n## 入门\n\nLinux\
  \ 内核源码位于 [www.kernel.org](http://www.kernel.org)，你可以在那里找到从 1991 年 Linus 原始发布以来每个版本的内核代码。源码提供\
  \ gzipped tar 格式（`.tgz`）和稍小的 bzipped 格式（`.bz2`）。\n\n通常情况下，你可以自由使用任何符合你需求和/或你喜欢的内核版本。但目前，你想要获取版本\
  \ 3.1.5，因为该版本恰好刻在目标板的闪存中。导航到 `/pub/linux/kernel/v3.0` 并下载 `linux-3.1.5.tar.bz2`。在\
  \ `/usr/src` 中创建 `arm/` 目录并在那里解压。首先，检查 `/usr` 和 `/src` 是否启用了对“其他”用户的读写权限，以便你可以以普通用户身份操作内核。我选择创建\
  \ `arm/` 目录是为了明确我们正在为 ARM 目标构建此内核。\n\n我通常用归档工具打开文件，它会自动识别文件格式并选择相应的解压工具。但对于像内核源码树的文件，我发现使用\
  \ shell 命令更快。进入 `/usr/src` 并执行 `tar -xjf linux-3.1.5.tar.bz2`。\n\n解压文件后，你会在 `/usr/src/arm`\
  \ 看到一个新的目录 `linux-3.1.5/`。多个版本的内核并不罕见。如何处理这些版本？有一个简单的命名策略使其易于管理。通常，Linux 源码安装为 `/usr/src`\
  \ 的子目录。子目录通常采用 `linux-<version_number>-<additional_features>` 的形式。\n\n### 内核版本命名\n\
  \n这让我们进入内核是如何命名的。<version_number>` 表示从 [kernel.org](http://kernel.org) 获取的内核基础版本，看起来如下：3.1.5。第一个数字是“版本”，在本例中为\
  \ 3。通常在内核及其 API 发生重大变化时，该数字才会增加。版本号从 1996 年到 2011 年年中，直到 Linus 为了纪念 Linux 发布 20\
  \ 周年而将版本改为 3。\n\n第二个数字 1 用于识别内核 API 可能不同但差异不足以进行完整版本更改的发布。新版本大约每 2-3 个月出现一次。\n\n\
  最后的数字（示例中的 5 代表不改变内核 API 的错误和安全修复。\n\n`<additional_features>` 是对标准内核进行补丁以支持额外功能的标识方式。我们安装了标准的\
  \ 3.1.5 内核，因此 `<additional_features>` 字段为空。稍后我们将为内核创建一个特定的配置并添加适当的 `<additional_features>`\
  \ 字段。\n\n`<additional_features>` 字段也用于内核开发者标识被称为发布候选版本（release candidates）的开发树。从稳定内核发布开始，足够稳定的代码被合并到主线成为下一个发布版本\
  \ rc1。例如，3.1.5 将变成 3.2-rc1。随后是 6-10 周的测试和补丁期，rc 数字大约每周滚动一次。当新树被认为足够稳定时，将去掉 -rc*n*\
  \ 并重新开始过程。\n\n鉴于系统中可能有多个内核源码树，你正在处理的内核通常通过 `/usr/src` 中名为 `linux` 的符号链接来识别，在本例中\
  \ `linux` 将位于 `/usr/src/arm`。使用以下 shell 命令创建符号链接：\n\n```bash\nln -s linux-3.1.5\
  \ linux\n```\n\n\n\n不需说，内核包含了大量的文件——C 源代码、头文件、makefile、脚本等。3.1.5 版本包含 37,800 个文件，占用\
  \ 317 MB 空间。因此，并不意外，有一个标准的目录结构以易于管理的方式组织这些文件。图 11.1 显示了从 `/usr/src/arm/linux` 开始的内核源码树。目录如下：\n\
  \n- **Documentation**——几乎是不言自明。这是一组文本文件的集合，描述了内核的各个方面、问题、“陷阱”（gotchas）等。在 `Documentation`\
  \ 下有许多子目录，用于需要更详尽解释的主题。虽然这里的信息通常很有用，但往往是过时的。也就是说，文档是在某个特定功能添加到内核时最初编写的，但随着功能的演进，文档并没有跟进更新。\n\
  - **arch**——所有依赖于架构的代码包含包含 `arch` 的子目录下。内核支持的每种架构在 `arch` 下都有一个目录，并有自己的子目录结构。可执行的内核镜像最终位于\
  \ `arch/<architecture>/boot`。makefile 中的一个环境变量 `ARCH` 指向适当的目标架构目录。`arch/` 是内核中两个最大的子树之一，包含了几乎\
  \ 12,400 个文件。\n- **block**——块设备层层。这是优化与块存储设备传输的代码。\n- **crypto**——处理系统安全中加密方面的代码。\n\
  - **drivers**——设备驱动程序代码。在 `drivers` 下，有许多用于各种设备和设备类的子目录。这是另一个主要的内核子树，拥有接近 9,600\
  \ 个文件。\n- **firmware**——这是内核树中一个较新的新增内容。它包含了在启动时加载固件的设备的二进制固件文件。最终，这些文件将被移动到用户空间，因为它们大部分是专有的，将它们与\
  \ GPL 许可的内核代码混合是有“问题”的。\n- **fs**——文件系统。在 `fs` 下，为 Linux 支持的每种文件系统有一组目录。\n- **include**——头文件。`include/`\
  \ 最重要的子目录是 `linux/`，它包含内核 API 的头文件。\n- **init**——基础初始化代码。\n- **ipc**——支持 Unix System\
  \ 5 进程间通信机制（如信号量、消息传递和共享内存）的代码。\n- **kernel**——这是核心。大多数不属于任何其他类别的基础体系无关内核代码都在这里。这包括调度器和基础中断处理等。\n\
  - **lib**——收集到库中的几个工具函数。\n- **mm**——内存管理函数。\n- **net**——网络支持。`net` 下的子目录包含支持各种网络协议的代码。\n\
  - **samples**——另一个较新的新增内容，包含了显示如何管理内核某些内部数据结构的示例代码。\n- **scripts**——支持配置和构建过程的文本文件和\
  \ shell 脚本。\n- **security**——为内核提供可选的安全模型。\n- **sound**——对声卡和高级 Linux 音效架构 (ALSA)的支持。\n\
  - **tools**——内核性能监控器。\n- **usr**——大部分是为初始 RAM 磁盘设置链接器段的汇编代码。\n- **virt**——用于内核的虚拟环境。\n\
  \n![image](img/F000113f11-01-9780124159969.jpg)\n\n图 11.1 内核源码树。\n\n## Kernel Makefile\n\
  \n`/usr/src/arm/linux` 包含一个标准的 make 文件 `Makefile`，其中有大量的 make 目标（targets）。默认情况下，内核为运行\
  \ makefile 的架构构建构建，在绝大多数情况下，这是 x86 的某种变体。在我们情况下，我们想要为我们的 ARM 目标板交叉编译内核。\n\n如上所述，有一个环境变量\
  \ `ARCH`，可以通过设置它来选择构建的架构。可以在调用 `make` 的命令行中设置它，如下：\n\n```\nmake ARCH=arm\n```\n\n\
  或者，我更倾向于做法是编辑 makefile 来永久设置 `ARCH` 的值。用你喜欢的编辑器打开 `/usr/src/arm/linux` 中的 makefile，并到第\
  \ 195 行，该行初始为：\n\n```\nARCH ? $(SUBARCH)\n```\n\n将其更改为：\n\n```\nARCH ?= arm\n```\n\
  \n下一行定义了变量 `CROSS_COMPILE`。它通过指定添加到工具名称前的前缀来标识交叉工具链。我们的 ARM 交叉工具链由前缀 `arm-linux-`\
  \ 标识。你可以在这里输入，或者可选地在配置过程中指定它。保存文件并退出编辑器。\n\n现在执行 `make help`。你将看到几个类别中非常长的 make\
  \ 目标列表。我们目前特别感兴趣的是“Architecture specific targets (arm)”类别。在该类别下，有许多以 `_defconfig`\
  \ 结尾的目标名称。这些 make 为各种基于 ARM 的开发板创建默认配置文件。在构建新内核时，从一个已知的良好配置开始总是很好的做法。在我们情况下，是 `mini2440_defconfig`。因此执行：\n\
  \n```\nmake mini2440_defconfig\n```\n\n在 `/usr/src/arm/linux` 中产生了一个新文件 `.config`。\n\
  \n## Patching the Kernel\n\n在我们实际配置和构建内核之前，还有一个需要跳越的障碍。以有序方式更改发布源码的机制是 patch 工具。`patch`\
  \ 的输入是由 `diff` 创建的文件，它比较两个文件并报告任何差异。因此，当开源程序员想要分发升级时，他会对修改的代码和原始代码执行 `diff`，并将 `diff`\
  \ 的输出重定向到补丁文件。\n\n在这种情况下，我从 `linux-3.1.5.tar.bz2` 创建了两个内核源码树，并将第一个命名为 `linux-3.1.5-orig/`。我在另一个源码树上执行了\
  \ Aleph One 的脚本，然后从 `/usr/src/arm` 执行：\n\n```\ndiff -uprN linux-3.1.5-orig linux>yaffs.patch\n\
  ```\n\n创建一个相应的补丁文件 `yaffs.patch`。查看 diff 手页以了解各种选项的含义。\n\n事实证明，目标 flash 上使用的文件系统并未纳入主内核。这显然是一个许可问题。尽管\
  \ YAFFS 是根据 GPL 发布的，其版权所有者 Aleph One 在某些情况下保留了权利。这使得 YAFFS 无法进入自由内核。\n\nAleph One\
  \ 提供了一个压缩的 tar 文件，其中包含一个安装到源码树的脚本。但由于我们的目标是引入“补丁”机制，我选择针对 [kernel.org](http://kernel.org)\
  \ 的未修改 3.1.5 内核源码树执行该脚本。\n\n注意 `patch` 通常从标准输入获取输入，所以我们必须重定向输入到文件。`-p1` 标志告诉 `patch`\
  \ 从要补丁的文件名删除第一个斜杠及其之前的内容。这识别了通常的情况，即创建补丁的根目录与应用补丁的目录不同。删除第一个斜杠之前的路径使得目录变为相对。\n\n\
  ```\npatch -p1< yaffs.patch\n```\n\n支持 YAFFS 的所有内容现在已添加到内核源码树中。\n\n此补丁还安装了 Posix\
  \ 和后期恒温器示例使用的 mini2440_* 驱动程序以及一个修订过的 .config 文件。默认配置开启了许多你并不需要的特性。revised.config\
  \ 关闭了许多此类功能，并且实际上是目标 flash 中内核的配置。\n\n## Configuring the Kernel—make config, menuconfig,\
  \ xconfig\n\n\n\n\n构建内核的过程始于调用三个执行配置过程的 make 目标之一。`make config` 会启动一个基于文本的脚本，顺序引导你通过每一个配置选项。对于每个选项，你有三个或四个选择。这三个选择是：“y”（是）、“n”（否）和“?”（请求帮助）。默认选择以大写字母显示。\n\
  \n某些选项有第四种选择，“m”，意味着将此功能编译为可加载的内核模块，而不是将其编译到内核映像中。内核模块是动态扩展内核的一种，对于设备驱动程序等内容特别有用。下一章将详细介绍模块。\n\
  \n图 11.2 显示了 `make config` 对话框的片段。\n\n![image](img/F000113f11-02-9780124159969.jpg)\n\
  \n图 11.2 make config 对话框。\n\n大多数选项都包含了真正“有用”的帮助文本（图 11.3）。\n\n![image](img/F000113f11-03-9780124159969.jpg)\n\
  \n图 11.3 内核配置帮助文本。\n\n`make config` 的问题在于它简直极其枯燥。通常情况下，你只会改变极少数选项，而让其余保持默认状态。但 `make\
  \ config` 强制你逐一通过每一个，而现代内核的选项远超过 2,000 个。对我个人来说，我从未用过 `make config`，我真的好奇它为什么还在内核包中。\n\
  \n`make menuconfig` 基于 ncurses 库，会弹出如图 11.4 所示的伪图形界面。在这里，配置选项被分为若干类别，你只需要访问需要更改的选项类别即可。该界面解释得很详细，且相当直观。但由于它不是真正的图形化程序，所以鼠标无法工作。它提供了与\
  \ `make config` 相同的帮助文本。当你退出主菜单时，会有保存新配置的选项。\n\n![image](img/F000113f11-04-9780124159969.jpg)\n\
  \n图 11.4 make menuconfig。\n\n虽然大多数真正的 Linux 黑客似乎更倾向于 `menuconfig`，但从易用性来看，我的选择是\
  \ `make xconfig`。它会弹出一个基于 X Windows 的菜单，如图 11.5 所示。现在你可以一次看到所有的选项类别并使用鼠标进行导航。当然，你必须运行\
  \ X Windows 才能使用此选项，并且必须安装 `g++`、Qt 图形库和 Qt 开发工具包。\n\n![image](img/F000113f11-05-9780124159969.jpg)\n\
  \n图 11.5 make xconfig。\n\n`g++` 和开发工具通常默认不安装。如果没有安装，请以 root 用户执行：\n\n```\nyum install\
  \ gcc-g++\nyum install qt3-devel\n```\n\n如往常一样，Debian/Ubuntu 用户应将 `yum` 替换为 `apt-get`。\n\
  \n在默认显示模式下，`xconfig` 在左侧显示配置类别树。选择其中一个会在右上角的窗口中显示该类别的一系列选项。选择一个选项会在右下角的窗口显示该选项的帮助信息。图\
  \ 11.5 从通用设置菜单开始。大多数选项都以复选框的形式呈现。点击框会在已选中（已选择）和未选中（未选择）之间交替。这些被称为 `binary`（二进制）选项。可以编译为内核模块的选项有第三种值——一个点，表示该功能将作为模块构建。这些是\
  \ `tristate`（三态）选项。例如是总线支持。点击 PCCard (PCMCIA/CardBus) 支持旁边的框，它会变成一个点。再次点击，它会变成一个钩号。再次点击则取消勾选。\n\
  \n某些选项拥有一组除是否以外的允许值，并由 `radio buttons`（单选按钮）表示。选择内核功能查看几个示例：内存分割（Memory split）和抢占模型（Preemption\
  \ Model）。某些选项接受数值。一个数值选项的示例是通用设置下的内核日志缓冲区大小（kernel log buffer size）。目前并不清楚如何更改数值。双击该选项会在两个右侧窗口之间打开一个对话框。\n\
  \n由于某些其他选项未被选中而这些选项将不会显示。再次，PC Card 选项可以作为一个示例。当取消勾选框时，右上侧窗口为空白。现在点击复选框，相应的选项就会出现在右上角。\n\
  \n### 尝试一下\n\n熟悉内核配置选项的最佳方法是启动 `xconfig` 并看看那里有什么。所以……\n\n```\ncd /usr/src/arm/linux\n\
  make xconfig\n```\n\n经过一段时间程序和文件的构建后，图 11.5 中的菜单将会出现。只需浏览子菜单及其各种子子菜单，以感受 Linux 内核功能的灵活性和丰富性。阅读帮助描述。\n\
  \n所有关键配置选项都应该在修订后的 `.config` 文件中正确设置，但为了额外练习，请检查它们。在通用设置下有一个名为“交叉编译器工具前缀”（Cross-compiler\
  \ tool prefix）的选项。这是一个字符串选项，必须设置为“arm-linux-.”进入文件系统下的杂杂文件系统（Miscellaneous file\
  \ systems），查看 `yaff2` 文件系统支持已被选中。将其构建进内核，而不是作为模块。你可以取消勾选日志闪文件系统（journaling Flash\
  \ File System）支持。确保在网络文件系统下的 NFS 客户端支持和 NFS 根文件系统（Root file system on NFS）已选中。\n\
  \n默认配置启用了许多你实际上并不需要的选项，至少初期不需要。Mini2440 没有内置无线支持，因此蓝牙和任何被称为“Wireless”（无线）的内容都可以安全地删除。原生语言支持是另一个可以移除许多不必要模块的地方。\n\
  \n如果你确实制作了更改，请确保在通用设置下添加一个本地版本字符串（Local version string）。\n\n在阅读下一节时，暂时保留配置菜单。\n\n\
  `make xconfig` 在保存配置方面为你提供了额外的灵活性。你不需要总是将其保存到标准的 `.config` 文件，可以使用 `File->Save As`\
  \ 选项将其保存到你指定的命名，稍后使用 `File->Load` 加载该文件。\n\n### xconfig 选项\n\n`xconfig` 菜单的 `Option`\
  \ 菜单中有非常有用的选项。`Show Name` 为右上面板添加一列，显示每个配置变量的名称。`Show Range` 显示二进制和三态选项的范围和当前值。在我看来，这仅部分有用。另一个部分用的选项是\
  \ `Show Data`。对于二进制和三态选项，它几乎重复了 `Show Range`。对于数值和文本选项可能会有用。\n\n`Show All Options`\
  \ 很容易理解。它会以灰色显示所有未满足某些条件而无法选择选项。假设你确定某个选项存在但找不到。开启 `Show All Options`，然后使用 `Edit\
  \ -> Find` 搜索。现在开启 `Show Debug Info` 查看该选项的条件。此功能还会显示选项名称及其定义位置。\n\n完成后，关闭 `xconfig`\
  \ 菜单。系统会询问你想要保存还是放弃更改。\n\n### .config 文件\n\n可能值得提到，真正的内核黑客倾向于使用 `make menuconfig`\
  \ 而不是 `make xconfig`。无论你选择哪种，配置过程的结果都是一个名为 `.config` 的文件，包含了所有的配置变量。列表 11.1 是一个片段。首先注意到顶部的注释：\n\
  \n```\n# 自动生成的文件，请编辑\n```\n\n手动编辑由工具创建的文件被认为是一种“不规范的做法”。你极可能会搞砸它。\n\n\n\n\n未选中的选项将保留在文件中，但会被“注释掉”。被选中的选项将获得相应的值：构建到内核镜像的特征为“y”，模块为“m”，或者是一个数字或列表中的元素。`.config`\
  \ 被包含在 `Makefile` 中，它控制了构建的内容以及如何构建。在构建过程早期，`.config` 会被转换为头文件 `include/linux/autoconf.h`，这样配置变量就可以用于条件编译。\n\
  \n## 幕后故事——到底发生了什么\n\n本节中的信息对于构建内核的过程并非至关重要，你现在可以忽略它。但当你达到开发设备驱动程序或其他内核增强阶段（或者可能是直接修改内核本身）时，将需要修改控制配置过程的文件。\n\
  \n配置菜单中的所有信息都由一组名为 `Kconfig` 的文本文件提供，这些文件散落在整个源码树中。这些是用 `Config Language` 编写的脚本文件，它的看起来看起来非常像\
  \ shell 脚本语言，但并不完全相同。主 `Kconfig` 文件位于 `linux/arch/$(ARCH)`，其中 `ARCH` 是 `Makefile`\
  \ 中的一个变量，用于标识基础架构。\n\n进入 `linux/arch/arm` 并打开 `Kconfig`。找到第 222 行左右读取 `menu “System\
  \ Type\"` 的行。将该文件的结构与从 `System Type` 开始的配置菜单进行比较，这种模式应该变得相当清晰。每个配置选项都通过关键字 `config`\
  \ 标识，后面紧跟选项的符号名称，例如 `config MMU`。这些每一个项都会被转换为 `Makefile` 变量（或宏），例如 `CONFIG_MMU`。然后\
  \ `Makefiles` 使用这些变量来决定将哪些组件包含在内核中，并将 `#define` 符号传递给源代码。\n\n选项类型由以下关键字之一指示：\n\n\
  - `bool`：选项有两个值，“y”或“n”。\n- `tristate`：选项有三个值，“y”nn”和“m”。\n- `choice`：选项为所列值中的其中之一。\n\
  - `int`：选项接受一个整数值。\n\n该类型关键字通常包含一个提示符（prompt），即在配置菜单中显示的文本。或者，`prompt` 关键字可以指定提示符。还有没有可显示提示符的“隐藏”选项。在\
  \ `Kconfig` 顶部有一组选项，由于没有指定提示符，它们不会出现在菜单中。在配置菜单中，点击 `Options->Show All Options`。现在所有选项都显示了，包括没有提示符的选项以及取决于未选中选项的选项。\n\
  \n配置项中的其他关键字包括指定帮助文本的 `help` 和 `depends`，这意味着只有当它依赖的某些其他选项被选中时，该选项才有效或可见。还有 `select`，它表示如果选择了此选项，那么某些其他选项也必须被开启。\n\
  \n在“System Type”菜单行正上方有这一行：\n\n`source init/Kconfig`\n\n`source` 关键字是扩展配置菜单以包含额外模块化功能的方法。它实际上与\
  \ C 语言中的 `#include` 相同。你会在主 `Kconfig` 文件各处发现 `source` 行。\n\n`Config Language` 实际上比这个简单示例所暗示的要广泛得多。更多详细信息请查看\
  \ `linux/Documentation/kbuild/kconfig-language.txt`。\n\n### 构建内核\n\n实际构建内核的过程取决于你构建的目的而略有不同。我们的主要目标是为目标板构建内核，因此我会首先描述这一点。然后，我将描述为工作站构建新内核的替代过程。\n\
  \n下面的前三个步骤可以作为普通用户执行。\n\n`make clean`。删除之前构建创建的所有中间文件。这确保了所有内容都使用当前配置选项构建。你会发现几乎所有的\
  \ Linux Makefile 都有一个 `clean` 目标。严格来说，如果你是第一次构建，则没有中间文件需要清理，因此你不需要运行 `make clean`。\n\
  \n`make`。这是核心所在。它构建可执行的内核镜像和所有内核模块。不意外，这需要一些时间。生成的压缩内核镜像是 `arch/$(ARCH)/boot/bzImage`。\n\
  \n`make uImage`。目标板上的 u-boot 引导加载程序它处理的任何文件前面都需要一个 64 字节的头部。`uImage` make 目标会将该头部放在\
  \ `bzImage` 之前，在 `arch/$(ARCH)/boot` 中创建文件 `uImage`。\n\n这 64 字节的头部告诉 U-boot 关于文件数据的性质。头部传达了镜像属性，包括：\n\
  \n- 目标操作系统\n- 目标 CPU 架构\n- 镜像类型——内核、文件系统、独立程序等\n- 压缩类型\n- 加载地址\n- 入口\n- 镜像名称\n-\
  \ 镜像时间\n\n之前在第 4 章中，我们将一个名为 `mkimage` 的可执行文件拷贝到了 ARM 交叉工具链的 `bin/` 目录。这是构建头部的工具。它由\
  \ `uImage` `Makefile` 目标调用。`mkimage` 实际上是 U-boot 分发的一部分，我们将在第 14 章介绍。\n\n下一步需要 root\
  \ 用户权限。\n\n`make modules_install INSTALL_MOD_PATH=/home/<your_user_name>/root_qtopia`。将模块拷贝到\
  \ `$(INSTALL_MOD_PATH)/lib/modules/<kernel_version>`，其中 `<kernel_version>` 是内核版本。注意，为目标板构建时必须显式指定根文件系统。否则，模块将进入工作站的\
  \ `/lib/modules`。严格来说，在这种情况下此步骤并不是必要的，因为启动内核内核模块。\n\n就是这样。顺便提一下构建过程是递归的。内核源码树中的每个子目录都有自己的\
  \ `Makefile` 来处理该目录的文件。顶层 `Makefile` 递归地调用所有的子 Makefile。\n\n为工作站构建内核的过程在几个细节上略有不同。你不需要执行\
  \ `make uImage` 步骤。不带 `INSTALL_MOD_PATH` 参数执行 `make modules_install`，然后作为 root 执行此步骤：\n\
  \n`make install`。这做了几件事。将内核内核（x86 构建为 `vmlinuz`）拷贝到 `/boot`，连同映射文件 `Systemmap`。在\
  \ `/boot/grub.conf` 中添加新项，以便 GRUB 将新内核作为启动选项。最后，它在 `/boot` 创建初始内存磁盘 `initrd`。\n\n\
  ### 工作站插曲\n\n在我们继续加载和测试新内核之前，上述最后两项值得简单解释。如今大多数工作站安装都集成了一个名为 GRUB 的引导加载程序，用于选择特定的内核或备操作系统。拥有启动多个镜像的能力非常有理由的。假设你构建了一个新内核但它无法正常启动。你总是可以回到已知良好的镜像，然后弄清楚新内核哪里出了问题。如果你好奇，可以查看你工作站上的\
  \ `/boot/grub.conf` 文件。\n\n大多数 Linux 内核被设置为使用 `initrd`，它是初始内存磁盘的缩写。初始内存磁盘是一个由引导加载程序加载到内存中的极小\
  \ Linux 文件系统，并在内核启动时挂载，在主根文件系统挂载之前。使用 initrd 的通常理由是在挂载根分区之前需要加载某些内核模块。通常，这些模块用于支持根分区使用的文件系统（例如\
  \ ext3），或者可能是连接硬盘的控制器（例如 SCSI 或 RAID）。\n\n现在我们有了一个新内核，如何测试它呢？我们当然可以将新镜像加载到闪存中，或者替换现有的内核镜像。\n\
  \n\n\n\n另一种方法是使用 `TFTP` 通过网络启动新镜像。这在开发环境中特别有优势，因为我们可以快速测试新的内核镜像，而无需经过耗时的闪 flash\
  \ 烧录过程。\n\n将 `arch/arm/boot/uImage` 移动到 `/var/lib/tftpboot`，或者你选择的任何 `tftp` 目录。启动目标板进入\
  \ `U-boot` 并执行以下命令：\n\n```\ntftpboot 32000000 uImage\nbootm 32000000\n```\n\n`tftpboot`\
  \ 将 `uImage` 下载到 RAM 中地址 `0x3200000` 处。然后 `bootm` 解释位于 `0x3200000` 处的 `U-boot` 头部，将镜像拷贝到内存中的正确位置（在必要时进行解压），并将控制权移交给它。内核启动后，执行命令\
  \ `uname –a`，你会发现内核镜像有一个与你编译时间对应的时间戳。\n\n恭喜你！你可以拍拍自己的手鼓励自己了。你现在是一个 Linux 黑客了。\n\n\
  顺便注意，`U-boot` 始终将数字解释为十六进制。此外，还有一个 `u-boot` 环境变量 `boot_tftp`，它包含了上述的两个命令。运行它可以 tftp\
  \ 下载并启动内核。\n\n在下一章中，我们将深入内核空间，查看编写 Linux 设备驱动程序的资源。\n\n# 第 12 章：内核模块与设备驱动程序\n\n\
  如果你觉得我是个糟糕的司机，你应该看看我的推夫球水平。\n— Snoopy\n\n本章的目标是介绍 Linux 设备驱动程序的基础知识。我们将从可安装内核模块的概念开始。然后，我们将结合针对\
  \ `Mini2440` 的简单 GPIO 驱动程序，查看基本的设备驱动程序 API。我们还将查看如何处理中断。最后，我们将学习如何将新的设备驱动程序集成到内核源码树中。\n\
  \n由于我们需要，这是一个非常复杂主题的简要概述。资源部分提供了额外的阅读。\n\n## 内核模块\n\n可加载内核模块提供了一种非常有用的方法，可以扩展基础\
  \ Linux 内核的功能并添加新特性，而无需重新构建内核。一个关键特性是，模块可以在需要功能时动态加载，并在不再需要时卸载。你可以将模块视为内核等同的用户空间进程。模块对于设备驱动程序和文件系统等内容特别有用。\n\
  \n考虑到 Linux 支持的硬件范围之广且多样，构建一个包含所有可能的设备驱动程序的内核镜像是不现实的。相反，内核仅包含用于启动设备和其他常见硬件（如串口和并行端口、IDE\
  \ 和 SCSI 驱动器等）的驱动程序。其他设备作为可加载模块支持，并且实际上只加载特定系统所需的模块。\n\n在生产嵌入式环境中，通常没有使用加载模块的良好技术理由，因为我们预先确切系统必须支持哪些硬件，因此我们只需将这些支持构建到内核镜像中。尽管如此，我们之后会看到使用模块可能出于“业务”原因。在测试新驱动程序时，模块仍然有用。你不需要在每次发现并修复驱动程序代码中的问题时都重新构建一个新的内核镜像。只需将其作为模块加载并尝试即可。\n\
  \n请记住，模块在特权级别为 0 的内核空间中执行，因此能够导致整个系统崩溃。\n\n### 模块示例\n\n在 `home/src/hello/` 目录下创建一个新的\
  \ Eclipse Makefile 项目。打开 `hello.c` 文件。首先，注意内核模块所需的两个包含文件。这是一个可加载内核模块的简单示例。它包含了两个非常简单的函数：`hello_init()`\
  \ 和 `hello_exit()`。最后两行：\n\n```\nmodule_init(hello_init);\nmodule_exit(hello_exit);\n\
  ```\n\n这些代码识别了这些函数，供加载器和卸载器使用。每个模块必须包含一个初始化函数和一个退出函数。`module_init()` 宏指定的函数由 `insmod`\
  \ 命令调用。`module_exit()` 宏指定的函数由 `rmmod` 命令调用。\n\n\n\n\n\n如果你最初是使用普通用户名登录并使用 `su`\
  \ 变为 root 用户，那么你必须在所有模块命令前加上 `/sbin/`，因为 `/sbin` 通常不是普通用户路径（path）的一部分。无论日志级别（loglevel）如何，`printk`\
  \ 消息都不会出现在 X 窗口下运行的 shell 窗口中。这是因为 X 窗口运行的是“虚拟”终端。你可以通过以下命令查看 `printk` 的执行结果：\n\n\
  ```\ntail /var/log/messages\n```\n\n再次以 root 用户执行。这会打印消息日志文件的最后几行。该命令有一个实用的变体：\n\
  \n```\ntail -f /var/log/messages\n```\n\n“f”代表“跟踪（follow）”。这个版本会持续运行并输出发送到 messages\
  \ 的新文本。该命令也可以表示为 `tailf`。我通常会打开第二个 shell 窗口来监控消息文件。\n\n模块是特定于内核版本的。这意味着 `insmod`\
  \ 只会加载为当前运行的内核版本编译的模块。这是因为内核 API 可能会并随时间发生变化。例如，为 3.1.5 版本编译的模块如果被加载到 3.4.4 版本中很可能会崩溃，因为内核函数的参数列表发生了变化。`insmod`\
  \ 确实提供了一个强制加载为其他版本编译的模块的选项（`-f`），在许多情况下它是有效的。\n\n尝试命令 `lsmod`。它会按照加载顺序的反序列出当前加载的模块。`hello`\
  \ 应该是第一个项目。`lsmod` 还会为每个模块提供“使用计数（usage count）”，并显示哪些模块依赖于其他模块。相同的信息可以在 `/proc/modules`\
  \ 文件中找到。\n\n现在执行命令 `rmmod hello`。你应该能看到 `hello_exit()` 打印的消息。最后再次执行 `lsmod`，确认 `hello`\
  \ 不再列出。顺便提一下，`rmmod` 不需要 `.ko` 扩展名。一旦加载，模块仅通过其基名称进行标识。\n\n模块可能（且通常会）包含对外部符号（如 `printk`）的引用。这些外部引用是如何解析的呢？`insmod`\
  \ 根据内核的符号表来解析它们，该符号表作为内核引导过程的一部分加载到内存中。此外，模块中定义的任何导出符号都会添加到内核符号表中，并供随后加载的模块使用。因此，模块可以引用的唯一外部符号是构建在内核镜像或之前加载的模块中的符号。内核符号表位于\
  \ `/proc/ksyms`。\n\n### “污染”（Tainting）内核\n\n当你安装 `hello` 时，在 `hello_init()` 消息出现之前，你应该看到了另一条消息：\n\
  \n```\nhello: module license ‘unspecified’ taints kernel\n```\n\n这到底是什么意思？显然，内核维护者已经厌倦了处理涉及无源码内核模块的错误报告，即未根据\
  \ GPL 等开源许可证发布的模块。他们解决这一问题的方案是发明了 `MODULE_LICENSE()` 宏，通过该宏你可以声明一个模块确实是开源的。格式如下：\n\
  \n```\nMODULE_LICENSE (<approved string>”)\n```\n\n其中 `<approved_string>` 是在 `linux/include/linux/module.h`\
  \ 中找到的 ASCII 文本字符串之一。其中并不意外地包含了“GPL”。如果你按照 GPL 等开源许可证的条款分发你的模块，你被允许在代码中包含相应的 `MODULE_LICENSE()`\
  \ 调用，并且加载你的模块不会产生任何投诉。\n\n如果你安装了一个产生上述警告的模块，随后系统崩溃，那么崩溃文档（核心转储）将揭示加载了非开源模块的事实。你的内核被无人可以访问的代码“污染”了。如果你将崩溃文档提交给内核维护者，它将会被忽略。\n\
  \n在 `hello.c` 中，在两个 `module_param()` 语句下方添加以下行：\n\n```\nMODULE_LICENSE(“GPL”);\n\
  ```\n\n重新制作 `hello` 并验证安装新版本后不再生成警告。尽管如此，你的内核仍然是受污染的。污染标记会一直存在，直到你重启系统。污染标记可以通过\
  \ `/proc/sys/kernel/tainted` 查看。它实际上是一个位掩码（bit mask），揭示了关于内核状态的许多信息。这些内容在 `linux/Documentation/sysctl/kernel.txt`\
  \ 中记录。\n\n### 内核模块与 GPL\n\n内核模块与 GPL 之间存在着某种“特殊”的关系。众所周知，Linux 是根据 GNU GPL 发布的，特别是\
  \ GPL 第 2 版。\n\n大家一致认为，运行在用户空间中且仅使用已发布内核 API 的应用程序不是 GPL 定义的“衍生作品”，因此可以保持专有。另一方面，任何静态链接到内核中的代码都在使用\
  \ GPL 代码，并根据定义，属于衍生作品，必须根据 GPL 发布并提供源代码。\n\n动态加载的模块是一个折中地带。尽管它们也使用了内核中的 GPL 代码，但模块不需要是开源的，尽管正如我们所见，如果你运行非开源模块，内核至少会“敲打你的手腕（警告）”。尽管如此，仍有一些内核开发者想要禁止非开源模块，并且一度讨论过不允许加载此类模块。\n\
  \n作为回应，Linus 断言，禁止专有模块将扼杀 Linux 的商业可行性，因为硬件供应商在保持其驱动程序专有方面有正当利益。发布驱动源码可能会泄露其专有硬件的细节。如果他们被强制发布源代码，他们将不再支持\
  \ Linux。\n\n这对你如何处理自己的驱动程序有影响。从技术上讲，在嵌入式环境中通常没有理由使用模块，因为硬件是固定且明确的。因此，将驱动编译到内核中是合理的。但如果你想保持这些驱动程序的专有，你就被迫仅作为模块进行构建。\n\
  \n### 构建内核模块\n\n内核模块的构建过程比我们以前遇到的 Makefile 要复杂一些。复杂性源于模块必须在内核自身的上下文中进行构建，特别是你打算运行模块的内核。结果是，如果你在内核树之外构建模块（如我们现在这样），Makefile\
  \ 必须切换到内核源码根目录。实际构建发生在内核源码的顶层，结果被放回模块所在的目录。\n\n发生的情况是 `hello/` 目录下的 Makefile 再次调用\
  \ make，切换到内核源码树并将 `hello.c` 的位置作为参数。查看 `hello` 的 Makefile。注意第一行：\n\n```\nobj-m :=\
  \ hello.o\n```\n\n不进行详细介绍，这告诉内核构建系统从 `hello.o` 创建模块。接下来我们根据需要指定一些调试标志。\n\n真正有趣的事情发生在第\
  \ 20 行，我们在那里对 modules 目标调用 make。短语：\n\n```\n-C /lib/modules/$(shell uname -r)/build\n\
  ```\n\n这是 make 修改内核源码树的方式。执行 shell 命令 `uname -r`，你会得到一个表示内核版本的数字字符串。进入 `/lib/modules`，你会发现一个同名的子目录。有一个名为\
  \ `build` 的链接，它实际上指向当前执行内核的源码树。你一定猜到了 `-C` 意味着切换目录。最后，短语 `M=$(shell pwd)` 将当前目录作为环境变量\
  \ `M` 传递。\n\n\n\n\n内核源码树不需要是完整的内核源码。具体来说，不需要 `*.c` 文件。需要的是头文件、配置文件（configuration）和\
  \ make 文件（make files）。这是流行的桌面发行版的正常格式。查看一下你内核的源码树，看看里面有什么。\n\n最终结果是将 `hello.c` 编译为\
  \ `hello.o`，然后将其转换为可加载模块 `hello.ko`。你会注意到，在此过程中，它会创建许多临时文件和一个目录。因此有了 `clean`（清理）目标。如果一个模块由两个或多个源文件构建，makefile\
  \ 的第一行会展开为如下内容：\n\n```\nobj-m := module.o\nmodule-objs := file1.o file2.o\n```\n\
  \n在为任何类型的项目（无论是内核模块还是用户空间应用）创建 Makefile 时，从现有模型开始通常是一个好主意。这里描述的 Makefile 是其他内核模块项目的良好起点。\n\
  \n最后，我们在为 `hello` 创建 Eclipse 项目时忽略了一点：包含路径。内核模块从内核源码树获取头文件，具体来说是 `<linux>/include`，其中\
  \ `<linux>` 是内核源码的绝对路径。使用项目属性（Project Properties）来正确设置包含路径。如果你忘记了如何操作，请回阅第 7 章。\n\
  \n## 模块的作用\n\n作为内核的扩展，模块的作用是为应用程序提供某些服务或一组服务。与应用程序不同，模块不会独立执行。相反，它会耐心地等待，直到某个应用程序调用它的服务。\n\
  \n但该应用程序如何访问模块的服务呢？这就是 `module_init()` 函数的作用。通过调用一个或多个内核函数，`module_init()` 向内核“注册”模块的“能力”（capabilities）。实际上，模块在说：“我在这里，这是我能做的事情。”\n\
  \n图 12.1 形象地展示了这种注册过程的工作原理。`init_module()` 函数调用某些 `register_capability()` 函数，并传递一个指向结构的指针，该结构包含模块内部函数的指针。`register_capability()`\
  \ 函数将指针参数放入内部的“能力”数据结构中。系统随后定义了一种协议，规定应用程序如何通过系统调用访问能力数据结构中的信息。\n\n![image](img/F000125f12-01-9780124159969.jpg)\n\
  \n图 12.1 将模块与内核链接.^(2)\n\n注册能力的一个特定示例是 `cdev_add()` 函数，它注册了“字符”设备驱动程序的能力。随后，应用程序通过\
  \ `open()` 系统调用访问字符设备驱动程序的服务。这将在稍后进行详细描述。\n\n如果一个模块不再被需要并通过 `rmmod` 命令移除，则 `module_exit()`\
  \ 函数应该“注销”模块的能力，释放能力数据结构中的条目。\n\n## 什么是设备驱动程序？\n\n对于“设备驱动程序”（device driver）的定义可能和编写它们的程序员一样多。从根本上说，设备驱动程序仅仅是“抽象化”外围硬件细节的方法，以便应用程序程序员不必担心它们。\n\
  \n在简单系统中，驱动程序可能只是直接链接到应用程序的函数库。在通用操作系统中，设备驱动程序通常是独立加载的程序，通过某些特定系统的协议与应用程序通信。在像 Linux\
  \ 这样的多任务系统中，驱动程序应该能够建立来自不同应用程序进程的通设备的多个“通道”。尽管在所有情况下，驱动程序都是通过 API 描述的，该 API 定义了驱动程序预期支持的服务。\n\
  \n设备驱动程序范式在 Linux 这样的保护模式环境中具有额外的意义。原因有两个。首先，用户空间应用程序代码通常不允许执行 I/O 指令。这只能在特权级别为\
  \ 0 的内核空间中完成。因此，一组直接链接到应用程序的设备驱动程序函数将无法工作。驱动程序必须在内核空间中执行。实际上，你可以通过一些复杂的步骤来允许从用户空间进行\
  \ I/O 访问，但最好避免这样做。\n\n第二个问题是用户空间是可交换的（swappable）。这意味着在 I/O 操作正在进行时，用户的数据缓冲区可能会被交换到磁盘。当该页面被换回内存时，它很可能位于不同的物理地址。因此，传输到外围设备的数据必须留存在内核空间，而内核空间是不可交换的。驱动程序必须负责在内核空间和用户空间之间传输这些数据。\n\
  \n## Linux 设备驱动程序\n\n第 9 章包含了对设备驱动程序的简要讨论。让我们回顾一下。Unix（以及扩展的 Linux）将外围设备世界分为四类：\n\
  \n- 字符（Character）\n- 块（Block）\n- 管道（Pipe）\n- 网络（Network）\n\n字符设备和块设备的主要区别在于，后者（如磁盘）是可以随机访问的，也就是说，你可以在字符流中来回移动。此外，块设备上的数据以一个或多个块的形式进行传输，并进行预取和缓存。对于字符设备，流通常只向一个方向移动。例如，你无法从串口回退并重新读取某个字符。某些字符设备可能实现\
  \ `seek` 函数。块设备必须关联文件系统，而字符设备则没有。\n\n管道是伪设备（pseudodevices），它们在进程之间建立单向链接。一个进程向管道的一的一端写入数据，另一个进程从另一端读取。\n\
  \n网络设备的不同之处在于，它们为多个协议客户端处理数据“包”（packets），而不是为单个客户端处理数据“流”（stream）。此外，数据从系统外部的源异步到达网络设备。这些差异导致内核与设备驱动程序之间需要不同的接口。\n\
  \n### /dev 目录\n\n虽然其他操作系统将设备视为文件（某种意义上），但 Linux 更进了一步，实际上为设备创建了目录。通常这个是 `/dev`。在工作站的终端窗口中，输入\
  \ `cd /dev` 和 `ls –l s*`。你会看到有趣的条目。注意标志字段中的第一个字符。“b”代表“块”设备，“c”代表“字符”设备。记得第 3 章，“l”代表链接，“d”是目录。\n\
  \n在块设备和字符设备条目的组字段和日期戳之间（通常显示文件大小的地方），有一对用逗号分隔的数字。它们分别称为“主设备号”（major device number）和“次设备号”（minor\
  \ device number）。主设备号识别设备驱动程序。次设备号仅供驱动程序本身使用，用于区分驱动程序处理的不同类型的设备。\n\n在 2.6 系列之前，主设备号和次设备号各占\
  \ 8 位，主号与设备驱动程序之间存在一对一对应关系。实际上，主号是指向设备驱动程序指针表的索引。现在设备号是一个 32 位整数，定义为 `dev_t`，其中高\
  \ 12 位是主号，其余位是次号。现在的注册机制允许多个驱动程序附加到同一个主号上，只要它们使用不同的次号范围。\n\n/dev 中的条目是通过 `mknod`\
  \ 命令创建的，例如：\n\n```\nmknod /dev/ttyS1 c 4 65\n```\n\n\n\n\n\n这创建了一个名为 `ttyS1` 的 `/dev`\
  \ 条目。这是一个主设备号为 4、从设备号为 65 的字符设备。这里没有引用设备驱动。我们通过 `mknod` 所做的只是在文件系统中创建一个条目，以便应用程序可以“打开”该设备。但在此发生之前，我们必须“注册”一个主号为\
  \ 4、从号为 65 的字符设备驱动以建立连接。\n\n### 低层用户空间 I/O API\n\n我们在第 9 章中已经很好地涵盖了访问设备驱动特性的低层用户空间\
  \ API。如有必要请进行复习。\n\n### 驱动内部结构\n\n熟悉设备驱动结构最简单的方法是查看它的代码。在 `root_qtopia/home/src/simple_hw`\
  \ 中有几个简单的示例。\n\n在 `simple_hw/` 目录下创建一个新的 Eclipse makefile 项目。你需要添加适当的包含路径，该路径位于\
  \ Linux 内核源码树中。详情请参见 `Makefile`。最后，你需要创建一个新的 make 目标 `modules`。\n\n在 Eclipse 编辑器中打开\
  \ `simple_hw.c`。基本上，一个驱动由一组函数组成，这些函数镜像了低层用户空间 API 中的函数。然而，驱动函数是由内核在内核空间（Kernel Space）中，响应应用程序调用低层\
  \ I/O 函数而调用的。\n\n### 驱动数据结构\n\n在检查设备驱动中的函数之前，我们应该查看驱动程序使用的一些重要数据结构。除了 `struct cdev`\
  \ 外，这里描述的所有结构都位于 `include/linux/fs.h` 中。\n\n`struct file_operations`：`file_operations`\
  \ 结构是一组指向构成设备驱动 API 的所有可能函数的指针。它实现了图 12.1 中描述的要求，即向内核的其他部分通信模块的能力。函数有很多，但驱动只需要声明它实际实现的那些函数。未使用的条目被设置为\
  \ `NULL`，如果它们被调用，则会触发某些默认操作或错误。\n\n`simple_hw` 的 `file_operations` 结构位于第 180 行。它使用*标记字段*（tagged\
  \ field）格式来初始化结构。只通过名称指定我们使用的字段。其他所有字段都被设置为零或 `NULL`。`owner` 字段几乎总是设置为 `THIS_MODULE`。\n\
  \n`struct file`：此结构代表一个打开的文件，并被传递给 `file_operations` 表中的大多数函数。它在用户空间进程调用 `open()`\
  \ 且在驱动的 `open()` 函数被调用之前创建。驱动程序编写者唯一感兴趣的字段是 `void* private_data`。这允许你根据“每个连接”的基础上分配数据结构，并将其传递给所有的驱动函数。\n\
  \n`struct inode`：此结构代表文件系统中的一个条目。对于硬件设备驱动，它通常代表 `/dev` 中与驱动关联的节点。它被传递给 `open()`\
  \ 和 `release()` 等函数，但根据我的经验，你很少需要访问 `inode` 结构中的任何内容。\n\n`struct cdev`：此结构定义在 `include/linux/cdev.h`\
  \ 中，用于向内核注册驱动。驱动程序编写者感兴趣的字段是 `ops`（它用 `file_operations` 结构初始化）以及设置为 `THIS_MODULE`\
  \ 的 `owner`。\n\n### init() 和 exit()\n\n从第 36 行开始是一组四个模块参数，分别对应主设备号、传输大小（1、2 或 4\
  \ 字节）、4 字节寄存器内的偏移量以及基础物理地址。虽然这是一个能够读写任何 GPIO 端口的通用驱动，但默认参数值暴露了 LED 位。\n\n现在我们来看第\
  \ 207 行的 `hw_init()` 函数。它做的第一件事是进行逻辑合理性检查，即检查 `offset` 参数以确保它对于选定的传输大小是合理的。然后，通过调用\
  \ `request_mem_region()` 获取相关 I/O 内存空间的独占访问权限，如果成功将返回非空值。`request_mem_region()`\
  \ 的参数是基础物理地址、要分配的端口数量以及设备名称。`NR_PORTS` 通过 `Makefile` 传入，默认值为八。设备名称用于在各种 `/proc`\
  \ 文件中标识驱动。\n\n记住，内核处理的是*虚拟*地址。因此，在访问 GPIO 端口之前，我们必须将它们映射到虚拟地址空间。这是通过 `ioremap()`\
  \ 函数完成的。\n\n接下来，我们需要分配一个从设备号范围表示我们的 GPIO 端口。这些端口将属于一个主设备号，该主号充当与我们驱动的链接。`register_chrdev_region()`\
  \ 接收具有特定主/从起始点的 `dev_t`、从号数量和一个设备名称。如果指定的范围不可用，它返回负错误代码。或者，`alloc_chrdev_region()`\
  \ 会根据给定的起始从号、从号数量和设备名称动态分配主号。\n\n宏 `MKDEV(int, int)` 根据主号和从设备号生成 `dev_t`。还有用于获取\
  \ `dev_t` 的主号和从号元素的宏：`MAJOR(dev_t)` 和 `MINOR(dev_t)`。\n\n宏 `MKDEV(int, int)` 根据主号和从设备号生成\
  \ `dev_t`。还有用于获取 `dev_t` 的主号和从号元素的宏：`MAJOR(dev_t)` 和 `MINOR(dev_t)`。\n\n宏 `MKDEV(int,\
  \ int)` 根据主号和从设备号生成 `dev_t`。还有用于获取 `dev_t` 的主号和从号元素的宏：`MAJOR(dev_t)` 和 `MINOR(dev_t)`。\n\
  \n宏 `MKDEV(int, int)` 根据主号和从设备号生成 `dev_t`。还有用于获取 `dev_t` 的主号和从号元素的宏：`MAJOR(dev_t)`\
  \ 和 `MINOR(dev_t)`。\n\n宏 `MKDEV(int, int)` 根据主号和从设备号生成 `dev_t`。还有用于获取 `dev_t` 的主号和从号元素的宏：`MAJOR(dev_t)`\
  \ 和 `MINOR(dev_t)`。\n\n宏 `MKDEV(int, int)` 根据主号和从设备号生成 `dev_t`。还有用于获取 `dev_t` 的主号和从号元素的宏：`MAJOR(dev_t)`\
  \ 和 `MINOR(dev_t)`。\n\n（注：此处由于原文中存在重复段落，翻译已按要求进行了逻辑处理）\n\n---\n\n现在我们来看第 207 行的\
  \ `hw_init()` 函数。它做的第一件事是进行逻辑合理性检查，即检查 `offset` 参数以确保它对于选定的传输大小是合理的。然后，通过调用 `request_mem_region()`\
  \ 获取相关 I/O 内存空间的独占访问权限，如果成功将返回非空值。`request_mem_region()` 的参数是基础物理地址、要分配的端口数量以及设备名称。`NR_PORTS`\
  \ 通过 `Makefile` 传入，默认值为八。设备名称用于在各种 `/proc` 文件中标识驱动。\n\n记住，内核处理的是*虚拟*地址。因此，在访问 GPIO\
  \ 端口之前，我们必须将它们映射到虚拟地址空间。这是通过 `ioremap()` 函数完成的。\n\n接下来，我们需要分配一个从设备号范围表示我们的 GPIO\
  \ 端口。这些端口将属于一个主设备号，该主号充当与我们驱动的链接。`register_chrdev_region()` 接收具有特定主/从起始点的 `dev_t`、从号数量和一个设备名称。如果指定的范围不可用，它返回负错误代码。或者，`alloc_chrdev_region()`\
  \ 会根据给定的起始从号、从号数量和设备名称动态分配主号。\n\n宏 `MKDEV(int, int)` 根据主号和从设备号生成 `dev_t`。还有用于获取\
  \ `dev_t` 的主号和从号元素的宏：`MAJOR(dev_t)` 和 `MINOR(dev_t)`。\n\n\n\n\n\n这两个函数的正数返回值表示成功传输的字节数，而负数返回则表示错误。\n\
  \n这两个函数遵循相同的基本模式。我们从 `struct file` 结构体的一个字段中提取设备设备号，并用它来设置寄存器地址。然后，我们将计数调整为传输大小的倍数，并为数据分配一个缓冲区。注意，`kmalloc()`\
  \ 是内核空间中 `malloc()` 的内核等价物。此时，`hw_write()` 调用 `copy_from_user()` 将用户空间的数据传输到本地缓冲区。然后我们进入一个循环来执行指定大小的传输。最后，`hw_read()`\
  \ 调用 `copy_to_user()` 将本地缓冲区传输到用户空间。`copy_from_user()` 和 `copy_to_user()` 封装了在内核空间和用户空间之间移动数据的细节。\n\
  \n你可能在奇奇 `ioread*x()` 和 `iowrite*x()` 调用。我们难道不能直接将虚拟地址视为一个普通的 C 变量吗？在大多数情况下是可以的，但在某些架构中，由于某种原因，这种方法行不通。因此，出于移植性考虑，你应该使用这些函数。`hw_write()`\
  \ 展示了如何直接访问地址。\n\n`hw_write()` 对 LED 有一些优化。数据被反转了，使得 1 表示 LED 亮起。数据向左移了五位，因此低四位表示\
  \ LED。\n\n图 12.2 试图用图表形式捕获写操作驱动处理的本质。用户进程调用 `write()`。这通过 `INT` 指令触发内核，其中写操作被作为\
  \ `syscall[]` 表的索引进行传递。`filedes` 参数包含了（其他内容外）主设备号，以便内核的 `write` 函数能够访问驱动程序的 `file_operations`\
  \ 结构体。内核调用驱动的 `write` 函数，该函数将用户缓冲区拷贝到内核空间。\n\n![image](img/F000125f12-02-9780124159969.jpg)\n\
  \n图 12.2 处理写调用。\n\n### 编译并运行驱动\n\n在 `simple_hw/` 目录下执行 `make` 来编译模块。我们正在使用动态分配的主设备号机制，因此现在的问题是，我们如何知道分配了哪个主设备号，以便在\
  \ `/dev` 中创建相应的节点？查看 `hw_load` 脚本。它首先安装模块。然后它列出文件 `/proc/devices`，该文件显示了主设备号与驱动之间的关系。该输出随后被传递给模式扫描程序\
  \ `awk`，该程序查找我们的模块名称并返回关联的主设备号。\n\n然后脚本创建了八个设备节点，其名称与 S3C2440 数据手册中的寄存器名称匹配。\n\n\
  在目标板上执行以下操作：\n\n1. `cd /home/src/simple_hw`。\n2. `cat /proc/iomem` 验证范围 `0x56000010`\
  \ 到 `0x5600002f` *没有*被列出。这意味着该范围对我们的驱动程序可用。\n3. `./hw_load`。\n4. `cat /proc/iomem`\
  \ `0x56000010` 到 `0x5600002f` 已挂载到了 `simple_hw`。\n5. `cat /proc/devices` 显示分配给 `simple_hw`\
  \ 的主设备号。\n6. `ls –l /dev/pio*` 显示由 `hw_load` 创建的设备节点。\n7. `lsmod` 显示 `simple_hw`\
  \ 已加载。\n8. `echo –n “1” > /dev/pio_GPBDAT` 一个 LED 应该亮起。\n\n`echo` 通常会向它输出的每个字符串末尾添加换行符\
  \ (0x10)。但你在 LED 上看到的只有字符串中的最后一个字符。`-n` 选项不添加换行，所以你看到的是字符串中实际最后一个字符。再尝试几种模式。完成后，执行\
  \ `./hw_unload` 移除模块和设备节点。当然，你也可以直接重启。\n\n“没什么大不了的，”你可能会说，“我们在第 7 章 中已经闪烁过 LED 了。”确实如此，但这个练习表明，通过标准驱动机制使设备可访问，我们就可以通过标准的\
  \ Linux 工具来访问它。我们可以通过脚本访问它。事实上，我挑战你写一个脚本来复制第 7 章中 LED 程序的行为。\n\n### 调试内核代码\n\n内核空间代码在调试方面面临一些问题。首先，`Eclipse`\
  \ 和 `GDB` 依赖于内核服务。如果我们停止内核（例如在断点处），这些服务就不可用了。因此，其他一些方法对于内核和模块代码往往更有用。\n\n### printk\n\
  \n对我个人而言，我从来不是 `printf()` 调试策略的忠实粉丝。偶尔它被证明是有用的，但大多数时候，打印语句所在的位置不对。所以你必须移动它，重新编译代码并再次尝试。我发现使用高质量的源级调试器来探测代码和数据要容易得多。\n\
  \n尽管如此，许多 Unix/Linux 程序员严重依赖 `printf()` 及其内核等价物 `printk()`。在内核级别，这很有道理。当然，请记住 `printk()`\
  \ 会产生性能影响。\n\n虽然 `printk()` 语句在开发期间很有用，但在发布生产代码之前应该将它们移除。当然，你一删掉它们，就会有人发现一个 bug，或者你会添加一个新功能，然后你就又需要它们了。管理这个问题的简单方法是将\
  \ `printk()` 封装在一个宏中，如列表 12.1 所示。\n\n![image](img/F000125f12-03-9780124159969.jpg)\n\
  \n列表 12.1 在宏中封装 `printk()`。\n\n当你调试时，在编译器命令行上定义 `DEBUG` 宏。当你编译生产代码时，`DEBUG` 未被定义，因此\
  \ `printk()` 语句会被编译掉。\n\n### /proc 文件\n\n我们在第 3 章 首次遇到 `/proc` 文件。`/proc` 文件系统作为内核的窗口，驱动程序可以可以通过\
  \ `/proc` 文件提供运行时信息。事实上，许多 Linux 工具（例如 `lsmod`）都是从 `/proc` 获取信息的。\n\n`/proc` 文件的实现似乎比\
  \ `printk()` 语句困难，但优点是只有当你请求时才会产生开销。而 `printk()` 语句总是执行。\n\n一个简单的只读 `/proc` 文件可以通过列表\
  \ 12.2 所示的两个函数实现。使用 `/proc` 的模块必须包含 `<linux/proc_fs.h>`。`create_proc_read_entry()`\
  \ 函数在 `/proc` 目录中创建一个条目。它通常从模块初始化函数中调用。其参数为：\n\n- 名称：文件名。\n- 文件权限 `mode_t`：谁允许读取。值\
  \ 0 被视为特殊情况，允许所有人读取该文件。\n- `struct proc_dir_entry`：在 `/proc` 层次结构中的位置。`NULL` 值将其放在\
  \ `/proc` 下。\n- 读取函数：用于读取文件的函数。\n- 私有：传递给 `create_proc_read_entry()` 的参数。\n\n![image](img/F000125f12-04-9780124159969.jpg)\n\
  \n列表 12.2 /proc 文件函数。\n\n`read_proc()` 函数作为某些进程调用 `/proc` 文件的结果被调用。其参数为：\n\n- `page`：指向内核分配的页（4\
  \ KB）内存的指针。`read_proc()` 将其数据写入此处。\n- `start`：`read_proc()` 从页的何位置开始写入数据。如果 `read_proc()`\
  \ 返回少于一页的数据，可以忽略此并从开头开始写入。\n- `offset`：之前的 `read_proc()` 调用写入了页多少字节。如果 `read_proc()`\
  \ 返回少于一页的数据，可以忽略此。\n- `count`：页的大小。\n- `eof`：完成后将其设置为非零。\n- `data`：传递给 `create_proc_read_entry()`\
  \ 的私有数据元素。\n\n和任何良好的读取函数一样，`read_proc()` 返回读取的字节数。\n\n\n\n\n\n作为一个简单的示例，我们可能想查看\
  \ `simple_hw` 中的 `read` 和 `write` 函数被调用了多少次。列表 12.3 展示了如何通过 `/proc` 文件实现这一目标。\n\n\
  ![image](img/F000125f12-05-9780124159969.jpg)\n\n列表 12.3 向模块添加 `/proc` 文件。\n\n##\
  \ 处理中断\n\n通常，I/O 操作需要很长时间才能完成，或者计算机必须等待某些事件的发生。在这些情况下，我们希望有一种方式来通知计算机操作已完成或事件已发生。这被称为\
  \ `interrupt`（中断）。中断可以看作是用户空间信号的硬件等价物。它们是异步事件，驱动程序为这些事件注册处理程序。当中断发生时，处理程序就会被调用。\n\
  \n中断处理程序的本质是与其他代码并发运行的。因此，它们不可避免地引发了并发以及以及数据结构和硬件的竞争。在处理处理程序时，所有处理竞态条件和并发访问的工具和技术都会派上用场。\n\
  \n尽管我们目前遇到的驱动代码运行在调用它的进程环境中，但中断处理程序由于是异步的，运行在任何进程环境之外，处于一种被称为 `interrupt context`（中断上下文）的状态。因此，它们所能做的操作相当有限。以下是中断处理程序不允许执行的操作：\n\
  \n• `Access user space`（访问用户空间）。由于处理程序相对于进程是异步执行的，我们不知道在处理程序被调用时哪个进程正在运行。\n• `Sleep`（睡眠）。只有进程上下文可以睡眠。\n\
  • `Execute for a long time`（长时间执行）。处理程序中断了某些。我们希望尽快回到之前的任务。如果中断处理程序确实需要耗时操作，它应该调用\
  \ `bottom half`（下半部）。\n\n实验中断的示例称为 `simple_int.c`。`simple_int` 的操作非常直观。我们将一个 GPIO\
  \ 输出引脚连接到一个 GPIO 输入引脚，后者也被配置为在上升沿产生中断。图 12.3 展示了如何使用跳线帽将相应的位连接在一起。\n\n![image](img/F000125f12-06-9780124159969.jpg)\n\
  \n图 12.3 将输出位连接到输入位。\n\n驱动的 `write` 函数为发送给它的每个字节切换输出位。因此，每隔第二个字节就会触发一次中断。中断处理程序获取微秒级分辨率当前时间，并将时间戳字符串写入循环缓冲区。`read`\
  \ 函数会“睡眠”直到中断处理程序唤醒它。然后它将循环缓冲区的内容传回给用户空间。结果是一串时间戳，显示了系统生成中断的速度。这一操作在图 12.4 中以图形形式所示。\n\
  \n![image](img/F000125f12-07-9780124159969.jpg)\n\n图 12.4 `simple_int` 的操作。\n\n\
  ### 注册中断处理程序\n\n像任何驱动资源一样，中断处理程序在使用之前必须向内核注册。用编辑器打开 `simple_int.c`。从模块初始化函数第 436\
  \ 行开始，有一组四个 `request_irq()` 调用，代表不同的运行模式。我们稍后会回到 `tasklet` 和 `wq` 模式。现在我们将 `my_interrupt`\
  \ 注册为中断处理程序。`request_irq()` 的参数如下：\n\n• 你正在注册的中断号。\n• 指向处理函数的指针，该函数接受两个稍后描述的参数。\n\
  • 一个 `flags` 位掩码。\n• 设备名称。`/proc/interrupts` 用它来识别持有中断的设备。\n• 用于共享中断线的指针。通常情况下，这将指向驱动的私有数据区域，用以识别是哪个设备引起的中断。如果中断不是共享的，可以为\
  \ `NULL`。\n\n一如往常，如果函数成功则返回 0，失败则返回负错误代码。最可能的错误是 `-EBUSY`，意味着另一个设备已经注册了此非共享中断。\n\
  \n`flags` 包含几个位，包括以下三个：\n\n• `IRQF_DISABLED`——设置时表示这是一个“快速”处理程序。快速处理程序在禁用中断的状态的情况下执行。除非绝对必要，否则不应设置此位。\n\
  • `IRQF_SHARED`——设置时表示中断线是共享的。多个对共享中断的注册可以成功。\n• `IRQF_SAMPLE_RANDOM`——表示生成的中断可以贡献\
  \ `/dev/random` 和 `/dev/urandom` 使用的“熵池”。\n\n最后一个标志位值得更详细的解释。`/dev/random` 和 `/dev/urandom`\
  \ 生成用于创建加密安全密钥的真随机数。这些随机数基于贡献“熵池”的随机事件。如果你的设备以真正的随机间隔产生中断（例如键盘），你应该设置此位。\n\n然而，以固定间隔产生中断的设备（时间滴答或垂直消隐信号）不应设置此位。有趣的是，网络驱动程序不应该设置此位，因为它们受到黑客通过规律且可预测的数据包定时进行的攻击。`drivers/char/random.c`\
  \ 文件对此问题有一些相关的注释。\n\n当内核响应中断调用中断处理程序时，它传递了两个参数：\n\n• 被激活的中断号。\n• 传递给 `request_irq()`\
  \ 的私有数据参数。\n\n处理程序的返回值表示它是否实际处理了中断。如果处理程序处理了中断，它应该返回 `IRQ_HANDLED`。否则，它应该返回 `IRQ_NONE`。这有助于内核处理共享中断并检测虚假中断。\n\
  \n### 探测中断\n\n查看从第 381 行开始的 `int_init()`。遵循标准的设备注册过程，下一个关注的问题是我们如何确定请求哪种中断号。有两个加载时参数控制着它的实现——`irq`\
  \ 和 `probe`。`irq` 初始化为 `-1`，意味着我们尚未确定使用哪种中断。`probe` 有三个可能的值：\n\n• 0—使用基于默认输出位（第\
  \ 0 位）的默认值。\n• 1—寻求内核的帮助以找到正确的 IRQ。\n• 2—驱动程序将自行进行探测。\n\n内核提供了一对函数可以帮助确定设备连接到哪个中断线。这些函数在第\
  \ 276 行开始的 `kernel_probe()` 中所示。\n\n`probe_irq_on()` 返回当前未分配的中断掩码。该函数保留返回值，然后安排设备产生中断。随后它调用\
  \ `probe_irq_off()`，并传递 `probe_irq_on()` 返回的值。`probe_irq_off()` 返回调用 `probe_irq_on()`\
  \ 之后产生的中断号。如果没有发生中断，则返回 0。如果发生了多个中断（模糊情况），则返回一个负数。\n\n最后的选项被称为自行探测。这在第 322 行开始的\
  \ `self_probe()` 中所示。它实际上是上述内核辅助方法的一种变体。在这种情况下，我们根据可能的输出位和可以跳线的输入中断的组合知道了可能的中断，因此我们将探测处理程序附加到任何空闲的中断上。然后我们安排产生中断并观察会发生什么。\n\
  \n\n\n\n你应该看到一系列时间戳消息，它们相隔约 10 μs，输入字符串中的每两个字节产生一个消息。\n\n- `rmmod simple_int`。\n\
  - `insmod simple_int.ko probe=1`。\n\n执行完上述两个命令后，`simple_int` 将具有相同的设备设备号。使用 `probe=2`\
  \ 重复这两个命令。\n\n这里有一个编程挑战。修改 `simple_int.c`，使其不再报告中断间隔，而是报告中断延迟（interrupt latency），即从设置中断线开始到中断处理程序开始执行的时间。\n\
  \n### 延迟处理——“下半部”（Deferred Processing—the “Bottom Half”）\n\n[此处由于原文为英文，翻译如下]\n中断服务程序（ISR）应该执行得尽可能快，以便其设备的中断可以被重新启用。此外，我们希望尽快回到进程上下文，以便我们能够更好地处理系统状态。\n\
  \n几乎所有实用的操作系统都将中断处理分为两个部分。第一部分是 ISR 本身，它直接响应中断。至少，ISR 需要清除设备中断标志位，并可能读取或写入某些数据。但这些就是它应该做的全部工作。如果有更广泛的工作需要完成（例如处理网络数据包），应该推迟到以后系统更“方便”的时候再进行。\n\
  \n在 Linux 中，这两个部分被称为“上半部”（top half）和“下半部”（bottom half）。下半部机制多年年来经过了广泛的修订和升级，事实上，原始的下半部机制在\
  \ 2.6 系列中已被弃用。目前可用的下半部处理策略有两种：`tasklets` 和 `workqueues`。\n\ntasklet 简单来说是一个带有长型数据参数的函数，它被调度在未来的某个时间运行。它在“软中断”上下文中执行，这意味着中断是开启的，但它仍然必须遵守\
  \ ISR 的规则。\n\nworkqueues 与 tasklets 非常相似，区别在于它们在专用“内核线程”的上下运行。这意味着，除其他外，工作队列函数可以睡眠（sleep）。该函数不需要以原子方式执行。\n\
  \n`simple_int` 可以通过一对模块参数实现上半部/下半部范式。当 `wq` 或 `tasklet` 设置为非零时，会注册备用中断处理程序。\n\n\
  “上半部”中断处理程序会将二进制时间戳（两个长字）写入循环缓冲区，并调用下半部；对于 tasklet 和 workqueue 版本，这恰好是同一个函数。写入二进制时间戳显然比格式化并写入\
  \ ASCII 文本要快。\n\n处理程序还会增加一个计数器，以便我们知道在下半部执行之前它触发了多少次。\n\n下半部函数位于第 200 行的 `do_bottom_half()`\
  \ 首先读取并重置中断计数。它将计数格式化为文本并写入文本缓冲区。接下来，它读取二进制时间戳缓冲区中的任何内容，将其格式化为文本，并写入文本缓冲区。最后，它唤醒读取函数。图\
  \ 12.5 以图表形式描述了这一过程。\n\n### 尝试一下\n\n- `rmmod simple_int`\n- `insmod simple_int.ko\
  \ tasklet=1`\n- `echo “a string of text” > /dev/port0`\n- `cat /dev/port0`\n- `rmmod\
  \ simple_int`\n- `insmod simple_int.ko wq=1`\n- `echo “a very long string of text”\
  \ > /dev/port0`\n- `cat /dev/port0`\n\n你注意到了什么？tasklet 往往执行得相当快。workqueues 受调度器的控制，花费的时间要长。\n\
  \n![image](img/F000125f12-08-9780124159969.jpg)\n\n图 12.5 带有下半部的 `simple_int`。\n\
  \n### 将你的驱动程序编译进内核\n\n在生产嵌入式环境中，除非有所有权考虑，否则没有理由使用可加载内核模块。因此，当你的新驱动程序运行后，你可能希望将其编译进内核执行镜像中。这意味着将你的驱动程序集成到内核源码树中。这并没有你想的那么难。\n\
  \n首先，你需要将驱动程序源文件拷贝到内核源码树中。让我们开始吧。\n\n\n\n\n# 第 15 章 源码控制—GIT\n# 第 16 章 编译工具\n\n\
  # 第 13 章\n## BusyBox 与 Linux 初始化\n\nLinux：GNU 世代的选择\n\n`ksh@cis.ufl.edu` 在 1993\
  \ 年将这句话印在了 T 恤上\n\n在嵌入式环境中，最大的问题往往是资源匮乏，特别是内存和存储空间。正如你无疑观察到的，无论是在阅读本书的过程中，还是通过其他经验，Linux\
  \ 确实很`big`！内核本身通常在 2–3 MB 之间，然后是带有实用程序程序和配置文件的根文件系统。在本章中，我们将介绍一种强大的工具，可以显著减少 Linux\
  \ 的整体“占用空间”，使其能够适应资源受限的嵌入式设备。\n\n我们在本章中要讨论的另一个主题是用户空间初始化，特别是如何让我们的温器器应用程序在启动时运行的问题。我们还将为温器器添加一个简单的显示。\n\
  \n## 介绍 BusyBox\n\n即使你的嵌入式设备是“无头”的（也就是说它没有通常意义上用于用户交互的屏幕和/或键盘），你仍然需要最小的命令行工具。你无疑需要\
  \ `mount`、`ifconfig` 以及可能的其他几个工具来让系统运行。记住，每个 shell 命令行实用程序都是一个带有独立可执行文件的独立程序。\n\n\
  BusyBox 背后的理念非常简单且天才。与其让每个实用程序都成为一个带有相应开销的独立程序，为什么不直接写一个程序来实现`all` 实用程序呢？嗯，可能不是所有的，但包含了绝大多数常用工具。大多数实用程序都需要同一组“辅助”功能，例如解析命令行和将\
  \ ASCII 转换为二进制。与其在数百个文件中重复这些功能，BusyBox 只对它们实现了一次实现。\n\nBusyBox 项目始于 1996 年，目标是将一个完整的\
  \ Linux 系统放在单张软盘上，该软盘可以作为 `rescue disk`（救援盘）或 Debian Linux 发行版的安装程序。救援盘用于修复无法启动的\
  \ Linux 系统。这意味着救援盘必须能够启动系统并挂载硬盘文件系统，并且它必须提供足够的命令行工具来将硬盘根文件系统恢复到可启动状态。\n\n随后，嵌入式开发者发现这是在资源受限的嵌入式环境中减少\
  \ Linux 占用空间的显而易见的方法。因此，该项目远超它的 Debian 起源，如今 BusyBox 是几乎每个商业嵌入式 Linux 产品的一部分，并存在包括许多路由器和媒体播放器在内的各种\
  \ Linux 产品中。\n\nBusyBox 自称为嵌入式 Linux 的“瑞士军刀”，因为就像瑞士军刀一样，它是一个多功能工具。从技术上说，开发者将其称为“多功能二进制文件”（multicall\
  \ binary），这意味着程序可以通过多种方式调用以执行不同的命令。这是通过以各种实用程序命名的符号链接实现的。这些链接随后都指向 BusyBox 可执行文件。\n\
  \n## 配置和安装 BusyBox\n\n板载 DVD 上有一个版本的 BusyBox。虽然它有点旧了，但我建议从这里开始，仅仅因为这是目前板子上运行的程序。稍后你可以从网站获取更更新的版本。将\
  \ DVD 中的 `linux/busybox-1.13.3-mini2440.tgz` 拷贝到你的家目录并解压它。你会发现一个新的子目录 `busybox-1.13.3/`。\n\
  \nBusyBox 是高度模块化且可配置的。虽然它能够实现超过 300 个 shell 命令，但你绝不要求在系统中包含所有命令。配置过程允许你确切选择哪些命令将包含在你的系统中。表\
  \ 13.1 是 BusyBox 近期版本可用命令的完整列表。\n\n表 13.1 BusyBox 命令\n\n![Image](img/T000137tabT0010.jpg)\n\
  \nBusyBox 支持像内核一样的 `xconfig` 和 `menuconfig` make 目标进行配置。图 13.1 显示了 `xconfig` 菜单，而\
  \ 图 13.2 显示了顶层的 `menuconfig` 菜单。同样的内核，还有一个 `make help` 目标，列出了其他 make 目标。奇怪的是，`xconfig`\
  \ 没有出现在列表中。\n\n![image](img/F000137f13-01-9780124159969.jpg)\n\n图 13.1 BusyBox xconfig\
  \ 菜单。\n\n![image](img/F000137f13-02-9780124159969.jpg)\n\n图 13.2 BusyBox menuconfig\
  \ 顶菜单。\n\n没有用于创建默认配置的 `_defconfig` 目标，因此我们的初始配置必须来自其他地方。这就是 `fa.config` 文件的作用。将其拷贝为\
  \ `.config`，然后执行 `make xconfig` 或 `make menuconfig`。\n\n### BusyBox 设置\n\n虽然 `xconfig`\
  \ 导航面板显示许多选项类别，但实际上只有两个选项：(1) 配置、构建并安装 BusyBox 以及 (2) 选择所需的 applet（小程序）。在 Build\
  \ Options（构建选项）下，你可以选择使用静态链接库或共享库构建 BusyBox。静态链接的 BusyBox 大得多，但你就不需要共享库了。例如，带有共享库的\
  \ BusyBox 为 634,368 字节。静态链接版本为 1,701,544 字节。但存放共享库的 `/lib` 目录总计占 14 MB。所以问题是，你是否在任何地方都需要这些共享库？\n\
  \nBuild Options 也是你可以选择交叉编译器前缀的地方，注意它已经为你设置好了。\n\n在 Installation Options（安装选项）下，你可以选择创建符号链接的方式。可以是软链接、硬链接或脚本“封装器”。随附的框描述了硬链接和软链接之间的区别。由于指向相同数据的硬链接共享同一个\
  \ inode，这对于 inode 数量有限的系统来说是一个非常有用的选项。软链接是默认选项，并且通常是最佳方法。\n\nInstallation Prefix（安装前缀）是错误的。它标识了你安装\
  \ BusyBox 的文件系统根目录。在我们的案例中这是 `/home/target_fs`。你在这里指定，或者在 `make install` 步骤通过添加\
  \ `CONFIG_PREFIX=/home/target_fs` 来指定。有趣的是，在早期的 BusyBox 版本中，如果不指定位置，它会默认到 BusyBox\
  \ 树内部。现在不再可行了。\n\n### Applets\n\n300  BusyBox applet 分属于几个类别。这些类别与 BusyBox 目录树密切对应。在许多情况下，BusyBox\
  \ 版本的实用程序省略了一些冷门选项。你可以将这些视为“精简”版。尽管如此，可用选项足以满足嵌入式系统的任何需求。\n\n在某些情况下，你可以为命令选择所需的选项。例如，选择\
  \ Coreutils 类别并滚动到 `ls`。你会发现几个可选的 `ls` 选项。可能这样做的原因是为了减小代码体积（如果这很重要的话）。如果帮助能指示每个选项可以节省多少空间，那就太好了。\n\
  \n浏览这些类别以感受里面有什么。你会发现开启许多你可能不需要的功能，例如 `vi` 编辑器。而且你会在嵌入式设备上真的需要 `tar` 和 `gzip` 吗？看看\
  \ Shells 类别。默认 shell 是 `ash`，它称为 BusyBox 发行中最完整且“严谨正确”的 shell。另外两个 shell `hush`\
  \ 和 `msh` 提供的功能较少，以换取更小的占用空间。\n\n### 构建与安装\n\nBusyBox 使用标准的 `make` 和 `make install`\
  \ 命令模式来构建和安装包。但如果你执行 `make`，你会发现它带有以下错误消息失败了：\n\n```\nMakefile:1273: *** mixed implicit\
  \ and normal rules. Stop.\n```\n\n\n\n\n\n这是一个由于更新 make 语法导致的已知问题。我可以告诉你如何修复它，但目前看来，由你自己进行适当的\
  \ Google 搜索并修复它可能更有用。\n\n执行 `make` 之后，你会在顶层 `BusyBox` 目录中发现几个以 “busybox.` 开头的新文件。其中一个是实际的可执行文件，即命名为\
  \ `busybox`。接下来，执行 `make install`，这会将 `busybox` 可执行文件以及所有链接拷贝到你在配置期间指定的目录。大功完成，BusyBox\
  \ 准备就绪了。\n\n## 硬链接 vs 软链接\n\n在第 3 章中，我们简要讨论过“链接”（links）的概念，即文件系统中仅指向其他文件的条目，而没有考虑硬链接与软链接（或符号链接）之间的区别。\n\
  \n尝试以下操作。在你的工作站 shell 窗口中进入 `~/target_fs/home/src/led`。执行以下命令：\n\n```\nln led.c\
  \ led2.c\nln –s led.c led3.c\nls –l\nstat led.c\nstat led2.c\nstat led3.c\n```\n\
  \n你注意到了什么？特别注意注意引用计数（权限字段之后的数字）以及文件大小。`led3.c` 被识别为指向 `led.c` 的链接。它的长度为 5，即它所指向的文件名的长度。相比之下，`led2.c`\
  \ 和 `led.c` 具有相同的长度且引用计数为 2，而其他所有内容的引用计数均为 1。`stat` 命令告诉我们每个文件代表哪一个 inode。需要注意的是，`led.c`\
  \ 和 `led2.c` 共享同一个 inode，而 `led3.c` 有一个不同的 inode。\n\n现在执行以下操作：\n\n```\nrm led.c\n\
  ls –l\n```\n\n在我的 Fedora 14 上，`led3.c` 的条目被高亮显示，表示它指向的文件不存在。`led2.c` 的引用计数现在变为 1。\n\
  \n最后，将 `led2.c` 重命名为 `led.c`：\n\n```\nmv led2.c led.c\nls –l\n```\n\n`led3.c` 条目再次指向一个有效的条目。\n\
  \n这个练习的意义在于，硬链接是相同数据的备用名称，或者说是别名。它们都指向磁盘上的相同数据块。在引用计数变为零之前，这些数据无法被删除。相比之下，软链接或符号链接指向的不是数据，而是文件名，而该文件名可能存在，也可能不存在。\n\
  \n## 使用 BusyBox\n\nBusyBox 可执行文件通常安装在 `/bin` 目录，大多数用户级命令行工具都位于那里。然后，例如，在 `/bin`\
  \ 中我们创建如下符号链接：\n\n```\nln–s busybox ls\n```\n\n现在，当你从 shell 调用 `ls` 时，实际执行的是 `BusyBox`。程序通过查看\
  \ `main()` 函数的第一个参数（即调用它的名称，即 `ls`）来确定它应该做什么。BusyBox 实现的每个命令都会创建一个类似的链接。\n\n你也可以直接调用\
  \ BusyBox，将命令名称及其参数作为命令行传递给它，如下所示：\n\n```\nbusybox ls–l\n```\n\n执行 `busybox –help`\
  \ 或仅单独运行 `busybox` 都会产生一条帮助信息，其中列出了当前 BusyBox 实例中内置的命令列表。\n\n## 温度调节器显示器\n\n我们的温度调节器现在是一个相当用的网络启用设备，但它没有本地显示器。如果你的\
  \ Mini2440 有 LCD，我们现在可以解决这个问题。先说一点历史。\n\n许多年前，Unix（以及后来的 Linux）系统的典型“控制台”设备是通过串口线连接到计算机的哑终端。这是字符设备的一个经典案例。然后，像数字设备公司（DEC）的\
  \ `VT100` 这样的视频终端开发了一些智能功能，提供了移动光标、更改颜色和选择性擦除屏幕部分的方法。后来，PC 引入了内置计算机自身的位图“帧缓冲区”（framebuffer）设备的概念。\n\
  \n这些发展不可避免地为 Linux 驱动模型增加了额外的复杂性。在串口视频终端时代，每个制造商最初都发明了自己用于光标控制等的协议。因此，为了可移植性，这些各种通常不兼容的协议必须被“抽象”成某种统一的东西。\n\
  \n因此，“控制台设备驱动程序”的作用正是这样做——为需要不仅仅是输出字符流的应用程序提供一个统一的接口。`VT100` 协议已成为终端控制的事实标准，这就是典型的控制台驱动程序向\
  \ API 暴露的内容。\n\n同样，帧缓冲区具有各种形状和大小、各种颜色深度以及将位和字节映射到屏幕像素的各种方法。帧缓冲区驱动的作用是暴露一个统一的 API，允许应用程序（实际上还有控制台等其他驱动）以一致的方式管理这些差异。\n\
  \nLCD 面板的驱动是一个帧缓冲区驱动。帧缓冲区主数为 29 的字符设备。遗憾的是，帧缓冲区 API 的文档并不完善。但没关系，因为我们不会直接使用它。\n\n\
  相反，我们将使用连接到设备号 4 的控制台驱动程序。该驱动正确地挂载到 `S3C2410` LCD 帧缓冲区驱动，使得写入它的任何内容都会显示在屏幕上。\n\n\
  ### ANSI 终端转义序列\n\n事实上，有一种用于控制控制台设备的标准协议。它基于 DEC 最初为其 `VT100` 系列视频终端开发的协议。该标准有几个常用名称，其中大多数包含缩写\
  \ ANSI（美国国家标准学会）。\n\n终端控制命令都以转义字符 27 或 0×1b 开头，通常缩写为 `<ESC>`。后面通常跟着一个 `` 字符以及或多个定义某些控制动作的字符。字符串\
  \ `<ESC[` 被称为控制序列引入符或 `CSI`。\n\n终端控制的完整 ANSI 标准非常详尽，我还没有找到一个真正易于阅读的版本。作为参考，欧洲计算机制造商协会（ECMA）编写的版本包含在\
  \ CD 中，文件名为 `ECMA-048.pdf`。要找到其他版本，可以在 Google 上搜索类似“ansi terminal escape”。\n\n幸运的是，对于我们的目的，不需要对转义序列做太多。我们主要想做的是移动光标，为我们的温度调节器创建一个用户友好的显示。设置光标的命令是：\n\
  \n```\n<ESC>[<row>;<col>H\n```\n\n其中 `<row>` 和 `<col>` 是表示所需光标位置的数字。第 1 行 1 列是屏幕的左上角。例如，为了将光标设置在第\
  \ 2 行第 12 列，我们可以在 C 中创建以下字符串：\n\n```\n\"\\x1b[2;12H\"\n```\n\n### 温度调节器显示\n\n有了这些背景，让我们为我们的温度调节器添加一个看起来类似于[图\
  \ 13.3 的显示。在 `home/src/lcd` 下创建一个名为“lcd”的新的 Eclipse 项目。打开 `lcdutils.c`。该文件目前有以下函数：\n\
  \n* `lcd_erase(int what)`——根据 `what` 的值擦除当前行或整个屏幕。在 `lcdutils.h` 中定义了一对常量。可以向此函数添加其他擦除选项。\n\
  * `int lcd_init(void)`——初始化 LCD 屏幕。打开指向控制台设备的文件并返回文件描述符。获取 I/O 端口 C 以便操作背光。如果任何操作失败，则返回\
  \ −1。注意，通常不需要文件描述符，但在需要时可以使用。\n* `lcd_set_cursor(int row, int col)`——将光标移动到指定位置。\n\
  * `lcd_write_string(int row, int col, char *string)`——在指定位置写入字符串。\n* `lcd_write_number(int\
  \ row, int col, int value, int width)`——在指定位置以指定的宽度写入十进制值。\n* `lcd_backlight(int\
  \ on)`——如果 `on` 为零，则关闭背光。否则开启。\n* `lcd_close(void)`——关闭指向控制台的文件并取消映射 I/O 空间。\n\n\
  ![image](img/F000137f13-03-9780124159969.jpg)\n\n图 13.3 温度调节器 LCD 屏幕。\n\n\n\n\n\n\
  那里还有一个简单的程序 `lcdtest.c`，用于测试这些函数。看一眼 `lcdtest.c`。然后编译它并尝试运行。\n\n这些功能已经足够创建如 图 13.3\
  \ 所示的屏幕了。尝试使用网络版本的温控器操作一下。然后，当从网络端更改任何参数时，你将看到显示器上的内容发生了更新。为 `netthermo_t` 创建一个\
  \ Eclipse 目标（target）。\n\n当然，你可以根据需要随时向 `lcdutils` 中添加新功能。\n\n## ncurses 库\n\n对于我们遇到的这个问题，实际上有一个更高层次的解决方案，我们在之前的\
  \ 第 6 章 讨论仿真时简要提到过它。`devices` 程序利用 `ncurses` 库在窗口中移动光标。`ncurses` 还可以完成许多其他工作，如更改颜色和设置字体。\n\
  \n这里没有使用 `ncurses` 的原因有几个。尽管它是几乎每个 x86 Linux 发行版的一部分，但它并不是我们正在使用的 ARM 工具链的默认部分。它是一个非常有用的工具，我鼓励你去了解一下，尽管如此，理解底层\
  \ API 仍然很有用。\n\n`ncurses` 是 GNU 库的一部分。请参见“资源”部分的网络地址。\n\n## 用户空间初始化\n\n我们现在有了一个实用的温控器应用程序。接下来我们需要做的是安排该应用程序在系统启动时自动运行。此外，在最终产品中，我们可能不需要控制台壳（shell）。\n\
  \n让我们从从通电到 Linux 内核启动第一个用户空间进程的初始化过程。这个过程中基本上有四个步骤。\n\n### 阶段 1 引导加载程序\n\n当 `S3C2440`\
  \ 通电并释放复位引脚时，执行将从地址 `0` 处的复位向量指定的位置开始。该芯片包含 4 KB 的 SRAM，称为 `Steppingstone`，映射到地址\
  \ `0`。当板子设置为从 NAND 闪存启动时，在执行之前，NAND 的前 4 KB 会复制到 `Steppingstone` 中。这段代码对片选择线、时钟和\
  \ RAM 等内容进行非常底层的初始化。基本上是运行处理器和访问 RAM 所需的最小配置。然后它将 `U-boot` 从 Flash 复制到 DRAM 并开始执行。\n\
  \n### U-Boot\n\n`U-boot` 加载器通过初始化它需要的外设（通常是串口、网络，可能还有 USB）继续初始化过程。然后，如果自动启动序列没有中断，它通常会将内核从\
  \ Flash 复制到 RAM 并开始执行。\n\n### Linux 内核\n\n如果内核是一个压缩镜像，它会将自己解压到 RAM 中适当的位置。然后，它初始化所有的内核子系统，例如内存管理，以及系统中所有外设设备的驱动程序。在某种程度上，这可能重复\
  \ `U-boot` 已完成的初始化，但当然，内核不知道 `U-boot` 做了什么，因此必须根据其自己的需求来初始化设备。在初始化过程中，内核会输出大量信息，描述它正在操作。\n\
  \n接下来，它挂载根文件系统。到目前为止，内核一直运行在内核空间。最后，它启动 `init` 进程，完成向用户空间的过渡。\n\n### Init 进程\n\n\
  `init` 总是是内核启动的第一个进程，它的工作是让一切正常运行起来。\n\n`init` 可执行文件通常是 `/sbin/init`，尽管内核也会搜索其他几个替代位置。在我们目标板案例中，`/sbin/init`\
  \ 与几乎所有其他可执行文件一样，简单地指向 `BusyBox` 的链接。\n\n`init` 从 `/etc/inittab` 文件获取指令。看一眼 `target_fs/etc/inittab`。顶部的注释让你对发生的情况有一个很好的了解。每个条目都有由冒号分隔的四个字段：\n\
  \n`<id>:<runlevel>:<action>:process`\n\n| id | 连接到进程的 tty。如果进程不使用控制台，则为 NULL。 |\n\
  | runlevel | 被 BusyBox 忽略。 |\n| action | init 处理进程的八种方式之一。 |\n| process | 要运行的程序，包括任何参数。\
  \ |\n\n允许的 action 有：\n\n| once | 执行一次该进程。 |\n| wait | 执行一次该进程。Init 等待该进程终止。 |\n\
  | askfirst | 询问用户是否应该运行此进程。 |\n| sysinit | 这些进程在其他任何执行之前执行一次。 |\n| respawn | 每当进程终止时重启该进程。\
  \ |\n| restart | 类似于 respawn。 |\n| shutdown | 在系统关闭时执行这些进程。 |\n| ctrlaltdel | 当\
  \ init 接收到 `SIGINT` 信号时执行，意味着操作员输入了 CTRL–ALT–DEL。 |\n\n注意，在这种情况下 `sysinit` action\
  \ 是执行 `rcS` 脚本。\n\n可能，启动我们应用程序最简单的方法是从 `inittab` 内部。在 `ttyn` 条目之后添加以下条目：\n\n`ttySAC0::respawn:/home/src/lcd/netthermo_t`\n\
  \n我们不需要控制台终端，所以注释掉现有的 `ttySAC0:` 开头的行。保存 `inittab`。\n\n重置目标板并让它启动 Linux。你应该能看到温控器启动。\n\
  \n顺便提一下，启动应用程序的另一种方法是简单地替换 `/sbin/init`，使其指向 `BusyBox` 的符号链接。这对于几乎所有其他可执行文件都是这样，但\
  \ `init` 中有很多功能是有用的。\n\n\n\n\n\nU-Boot 支持广泛的命令集，它不仅便于启动，还能管理闪存、通过网络下载文件等。附录 A 详细说明了该命令集。该命令集通过环境变量和脚本语言进行了增强。\n\
  \n### 安装和配置 U-Boot\n\n请查看“资源（Resources）”部分获取 U-Boot 源码 tar 包的位置。有多个版本供选择，我恰好选择了\
  \ `1.3.2` 版本。在你的主目录下解压该 tar 包。你会发现一个名为 `uboot-<version_number>` 的新子目录。在根目录下有一个非常详细的\
  \ `README` 文件。在 `doc/` 目录下还有额外的 `README` 文件，它们主要描述了特定板卡的特性。\n\nU-Boot 目前尚不支持 `make\
  \ xconfig` 甚至 `make menuconfig`。配置是通过手动编辑头文件来完成的。`cd` 到 `include/configs/` 目录并打开\
  \ `mini2440.h`。配置变量的标识如下：\n\n- 配置选项 `options` 名称以 `CONFIG_` 开头。\n- 配置设置 `settings`\
  \ 是硬件特定的，名称以 `CFG_` 开头。这些通常是数值值。`README` 文件警告说，“如果你不知道自己在做什么，就不要动这些这些内容”。\n- 包含的\
  \ shell 命令通过以 `CONFIG_CMD_` 开头的名称进行标识。\n\n像 BusyBox 一样，你可以选择 150 多个 shell 命令中的任何一个包含在\
  \ U-Boot 中。从第 111 行开始是包含包含命令列表，从一组默认设置开始。在第 299 行，定义了 NAND 分区，随后是初始设置的环境变量。\n\n\
  当你完成检查（可能还会编辑）`mini2440.h` 后，`cd` 回到 `uboot-<version_number>`，执行：\n\n```\nmake mini2440_config\n\
  ```\n\nU-Boot 的 `Makefile` 很有意思。用编辑器打开它。从第 470 行开始，`include/configs/` 目录下的每个头文件都有一个\
  \ `_config` `make` 目标。这些条目大部分看起来像第 2480 行针对 Mini2440 的条目。`make` 目标 `unconfig` 会删除由之前调用\
  \ `mkconfig` 脚本创建的几个文件。接下来，带有描述相关板卡的参数调用 `mkconfig` 脚本。\n\n若要构建 U-Boot，就像我们之前处理内核和\
  \ BusyBox 那样，直接调用 `make` 即可。顺便提一下，没有必要指定交叉编译工具链的前缀 `arm-linux-`。这由配置过程处理。当然，如果你的前缀恰好不同，你可能需要编辑\
  \ `Makefile` 来更改它，或者将 `CROSS_COMPILE` 环境变量作为参数传递给 `make`，如下：\n\n```\nmake CROSS_COMPILE=my_tool_prefix-\n\
  ```\n\n`make` 步骤会生成几个输出文件：\n\n- `u-boot`——可执行和链接格式 (ELF) 二进制格式的可执行文件，\n- `U-boot.bin`——原始二进制镜像，适用于写入闪存，\n\
  - `u-boot.map`——链接器输出的映射文件，\n- `u-boot-nand2k.bin`——填充到 2k 块大小的二进制执行文件，\n- `u-boot-nand16k.bin`——填充到\
  \ 16k 块大小的二进制执行文件，\n- `u-boot.srec`——Motorola S 记录格式的可执行文件。\n\n`make` 步骤还会构建几个工具，包括\
  \ `tools/` 目录下的 `mkimage`。\n\n### 测试新的 U-Boot\n\n在将新的 U-Boot 写入闪存之前，你可能想先在 RAM 中测试它。如果你恰好有一个\
  \ `JTAG` 硬件调试器，可以使用。如果你做了重大更改并确实需要测试新的 U-Boot，这非常有用，因为这可能是在引导程序代码上使用断点的唯一方法。\n\n\
  另一种方法类似于我们在第 5 章`。\n7. 重置。新的 U-Boot 正在运行。\n\n### “调试” NOR\n\n好的，假设你的 NOR flash 坏了。你该怎么办？嗯，可以通过板卡的\
  \ JTAG 端口对 NOR flash 进行重新编程。\n\nMini2440 套件的一部分是一个名为 JTAG “wiggler”的设备，它插入 PC 的并行端口并连接到板卡上的\
  \ 10 针平线 JTAG 端口。注意，USB 转并行端口转换器不起作用；它必须是原生并行端口。套件 CD 上的 `H-JTAG/` 目录包含一个控制“wiggler”的\
  \ Windows 应用程序。那里还有一个 PDF 文档 *JTAGing the NOR*，解释了如何操作。\n\n### 创建闪存文件系统\n\n我们快要完成了。我们已经根据特定需求配置了内核和引导程序。我们设置了\
  \ init 进程，使其直接启动到温控器应用程序。最后一步是创建一个 YAFFS2 文件系统镜像，我们可以将其写入 NAND flash。\n\n我们之前看到过\
  \ NAND flash 被任意划分为不同大小的 `partitions`（分区）。具体而言，我们的闪存有四个分区，如 `mini2440.h` 中定义并在在此列出供参考：\n\
  \n| 名称 | 大小 | 偏移 |\n| --- | --- | --- |\n| u-boot | 0×00040000 | 0×00000000 |\n\
  | env | 0×00020000 | 0×00040000 |\n| kernel | 0×00500000 | 0×00060000 |\n| root\
  \ fs | 0×07aa0000 | 0×00560000 |\n\n内核将这些分区视为名为 `mtdblock` 的设备中的磁盘分区，具体为 `/dev/mtdblock0`\
  \ 到 `/dev/mtdblock3`。这允许我们挂载位于闪存中的文件系统。内核还定义了一组字符设备 `/dev/mtd0` 到 `/dev/mtd3`，允许我们直接访问闪存。在目标板上执行以下\
  \ shell 命令：\n\n```\nhead /dev/mtd1\n```\n\n这将转储 U-Boot 环境的第一部分。\n\n根文件系统位于分区，对应\
  \ `mtd3`。因此，为了从 NAND flash 挂载根文件系统，我们向内核传递命令行，说明挂载来自 `/dev/mtd3` 的 YAFFS 文件系统。\n\
  \n在 U-Boot 提示符下运行以下命令：\n\n```\nprintenv set_bootargs_nand\nrun set_bootargs_nand\n\
  printenv bootargs\n```\n\n在第 16 章结束时，我们得到了一个直接启动到显示应用程序的文件系统。最后一步是将该文件系统加载到目标板的\
  \ NAND flash 中，以便板卡启动启动。\n\n我们需要创建一个 YAFFS `文件系统镜像`，即包含文件系统中所有内容的特定格式文件。YAFFS 项目提供了一个工具可以这样做。在工作站的\
  \ shell 窗口中成为 root 用户。挂载 FriendlyARM DVD，进入 DVD 上的 `linux/` 目录，并将 `mkyaffs2image.tgz`\
  \ 拷贝到根目录 `/`。`cd/` 解压此文件。两个新的可执行文件出现在 `/usr/sbin` 中：`mkyaffs2image` 和 `mkyaffs2image-128M`。确保这两个文件对所有人都有执行权限。\n\
  \n退出 root 用户 shell 并 `cd` 到你的主目录。执行：\n\n```\nmkyaffs2image-128M /var/lib/tftpboot/root_qtopia.yaffs\
  \ root_qtopia\n```\n\n这在 `/var/lib/tftpboot` 中创建了 `root_qtopia.yaffs` 文件，它是 `root_qtopia/`\
  \ 的 YAFFS 文件系统镜像。我在以前这样做时遇到过几次的潜在问题。即使闪存是 128 MB（或更大），整个镜像文件也必须放入 64 MB 的 RAM 中。\n\
  \n\n\n\n\n如果你已经使用 NFS 挂载的目标文件系统工作了一段时间，你可能已经积累了一些垃圾文件。清理 `/home/src` 下的所有目录。`/opt/Qtopia/pics`\
  \ 中有 2 MB 的图片，你不需要那些内容。`/lib/modules` 下可能存在内核模块。事实证明它们并不是必需的，因为内核从未加载过它们。你可以删除这些模块。\n\
  \n当你将 `root_qtopia.yaffs` 压缩到 64 MB 以下时，请按照以下步骤操作，这些步骤与我们之前对引导程序进行的操作类似：\n\n1. 启动目标板进入\
  \ U-Boot 提示符\n2. `tftp 30008000 root_qtopia.yaffs`\n3. `nand erase root`\n4. `nand\
  \ write.yaffs 30008000 root $(filesize)`\n5. `run set_bootargs_nand`\n6. `boot`\n\
  \n温控器应用程序应该开始运行了。\n\n最后，你可能想加载你在第 11 章中创建的内核。该过程与加载文件系统的本质相同。只需将内核文件 `uImage` 复制到\
  \ `/var/lib/tftpboot`，将步骤 2 中的“root_qtopia.yaffs”替换为该文件名，并在步骤 3 和 4 中将“root”替换为“kernel”。\n\
  \n### 关于闪分区的更多思考\n\n在运行 Linux 的目标板上，执行 `cat /proc/mtd`。你应该看到以下内容：\n\n```\nmtd0:\
  \ 00040000 00020000 \"supervivi\"\nmtd1: 00020000 00020000 \"param\"\nmtd2: 00500000\
  \ 00020000 \"Kernel\"\nmtd3: 07aa0000 00020000 \"root\"\nmtd4: 08000000 00020000\
  \ \"nand\"\n```\n\n将其与我们在 U-Boot 中通过 `mtdparts` 命令获得的分区列表进行比较。这很奇怪，名称不同。是的，内核对闪存分区有它自己的视图。U-Boot\
  \ 在 `include/configs/mini2440.h` 中声明分区。内核在 `arch/arm/mach-2440/mach-mini2440.c`\
  \ 中声明它们。幸运的是，大小是相同的，因此分区是对齐的。`00020000` 是分区的擦除块大小。\n\n这里显然存在混淆的可能，甚至更糟。显然，最好在一个地方声明分区。事实证明有几种方法可以实现这一点。分区可以通过内核命令行传递。其格式为：\n\
  \n`mtdparts=<mtddef>[; <mtddef>]`\n\n`<mtddef>:= <mtd_id>:<partdef>[,<partdef>]`\n\
  \n其中 `mtd_id` 是名称。\n\n`<partdef>:= <size>[@offset][<name>][ro][lk]`\n\n`<size>:=\
  \ 标准 Linux 内存大小或 \"-\" 表示所有剩余空间\n\n`<name>:= ’（’ NAME ’)’`\n\n这与 `mini2440.h` 中的声明格式本质完全相同。为了实现这一点，你必须开启一个默认未开启的配置变量。那就是\
  \ `CONFIG_MTD_CMDLINE_PARTS`，它位于内核的 `xconfig` 菜单中的：`Device Drivers -> Memory Technology\
  \ Device (MTD) Support -> Command line partition table parsing`。\n\n### 平坦化设备树\n\
  \n还有另一种一致的硬件定义方法，它超出了我们刚刚描述的内容，并实际上同时向引导程序和内核定义了系统的所有硬件。它被称为*扁平设备树* (`FDT`)。\n\n\
  事实上，问题不仅仅是闪存分区。引导程序和内核之间还共享着大量的硬件信息：\n\n• RAM——大小和位置\n• 外设：\n  • 以太网\n  • USB\n\
  \  • 控制台\n\n`FDT` 也称为设备树文件 (DTB)、设备树二进制文件或直接称为设备树，它提供了一种向引导程序和内核通信这些信息的机制。FDT 派生自\
  \ IBM 的 Open Firmware 规范，是一个表示板卡底层硬件细节的数据库。\n\n硬件的文本表示存储在扩展名为 `.dts` 的文件中。特殊的编译器\
  \ `dtc` 将文本转换为二进制表示（即“blob”），该文件与内核一起加载到内存中，内核将这些信息转换为设备程序用于识别硬件资源所需的内部表示。\n\n设备树由表示设备或总线的节点组成。每个节点包含属性，即键值对，提供了有关设备的信息。值是任意的字节字符串，对于某些属性，它们包含表格或其他结构化信息。我们在这里不详细介绍语法。\n\
  \n设备树的概念在 PowerPC 分支中演变，那里使用得最频繁。事实上，现在所有 PowerPC 平台都需要向内核传递设备树。`.dts` 文件通常位于内核源码的\
  \ `arch/$ARCH/boot/dts`。`powerpc/` 分支有 145 个 `.dts` 文件，而 `arm/` 分支只有 8 个。为了熟悉语法，请查看\
  \ `arch/arm/boot/dts`。设备树支持必须编译到内核和 U-Boot 中。U-Boot 有两个配置变量 `CONFIG_OF_LIBFDT` 和\
  \ `CONFIG_OF_BOARD_SETUP` 来启用设备树。内核有 `CONFIG_DTC` 和 `CONFIG_OF`。这些都不是用户设置的。如果实现支持则开启，否则关闭。\n\
  \n在 U-Boot 中启用设备树支持时，启动过程略有不同。你必须将内核镜像和编译后的设备树加载到内存。`bootm` 的语法变为：\n\n`bootm <kernel_address><fdt_address>`\n\
  \n`<fdt_address>` 通常在控制转移到 `<kernel_address>` 时通过寄存器传递。\n\n好了，温控器应用程序现在已烧入闪存，我们准备就绪了。在下一章中，我们将关注源码控制。\n\
  \n## 参考\n\n[denx.de](http://www.denx.de)—这是 U-Boot 主要开发者 Wolfgang Denk 的网站。这里有良好的用户手册、wiki，以及当然源码：[ftp://ftp.denx.de/pub/u-boot/](http://ftp.denx.de/pub/u-boot/)——这里可以获取回到\
  \ 2002 年的 U-Boot 版本。\n\n[yaffs.net/](http://www.yaffs.net/)——YAFFS 文件系统的官方网站。\n\n\
  [denx.de/wiki/U-Boot/UBootFdtInfo](http://www.denx.de/wiki/U-Boot/UBootFdtInfo)—除其他内容外，该页面提供了关于扁平设备树的良好参考文献。\n\
  \n[`ols.fedoraproject.org/OLS/Reprints-2008/likely2-reprint.pdf`](http://ols.fedoraproject.org/OLS/Reprints-2008/likely2-reprint.pdf)—*A\
  \ Symphony of Flavours: Using the Device Tree to Describe Embedded Hardware*，2008\
  \ 年 Linux 研讨会 Grant Likely 和 Josh Boyer 的演示稿。\n\n\n\n\n\n* Rational Clear Case\n\
  * Mercurial\n* Perforce\n* Subversion\n* Visual Source Safe.\n\n在 2002 年之前，内核开发社区还没有使用版本控制系统（VCS）。更改以补丁（patches）和存档文件的形式非正式地传递。2002\
  \ 年，社区开始使用 `BitKeeper`，这是一种专有的分布式版本控制系统。随后，内核开发者与 `BitKeeper` 人员之间的冲突导致后者失去了该软件包的免费使用权。\n\
  \n这促使 Linux 社区根据使用 `BitKeeper` 积累的经验开发了自身的工具。最终生成的系统具有简单的设计，运行速度极快，同时实现了这些目标：\n\n\
  * 快速\n* 设计简单\n* 全局分布式\n* 支持“非线性”开发\n* 能够支持数千个并行分支\n* 高效处理如内核等大型项目\n\n那么，“git”这个名字是从哪里来的呢？Git\
  \ 是英国俚语中对愚蠢或令人讨厌的人的称呼。正如林斯（Linus）解释的那样：“我是一个自大的混蛋，我用自己的名字命名我所有的项目。先是‘Linux’，现在是‘git’。”\n\
  \n## 介绍 Git\n\nGit 是一个分布式版本控制系统，客户端不仅检出文件的快照，而且完整镜像中央仓库。这在图 15.2 中所示。每次检出（checkout）都是一次完整的备份。因此，如果中央服务器崩溃，可以从任何客户端恢复，且几乎没有损失。在大多数现代\
  \ Linux 发行版中，Git 随开发工具一起安装。\n\n![image](img/F000289f15-02-9780124159969.jpg)\n\n\
  图 15.2 分布式版本控制。\n\n图 15.3 展示了典型的 git 命令序列。你首先通过 `git clone` 命令获取项目仓库的副本。这会从中央仓库的当前活动分支创建一个该项目的完整本地副本。hello-world\
  \ 项目包含了 43 个不同语言的 Hello-World 程序。\n\n![image](img/F000289f15-03-9780124159969.jpg)\n\
  \n图 15.3 Git 命令序列。\n\n然后你对项目进行更改。`git add` 将你所做的更改添加到 `index` 中，为下一次提交（commit）做准备。index\
  \ 持存储了自上次提交以来添加的更改的快照。你可以在提交之间多次调用 `git add`。\n\n`git commit` 将 index 存回本地仓库，并附带一个描述更改内容的注释。`-m`\
  \ 选项意味着后面跟着一条消息。这对于较短的日志消息非常有用。如果你漏掉 `-m` 选项，git 会打开 `$EDITOR`，允许你创建更详细的日志消息。关键点在于，git\
  \ 强制要求你在每次提交时都提供注释。\n\n一个 `commit` 是在执行提交命令时树中所有文件的快照。与上一个提交或快照的差异以压缩增量（delta）的形式存储在\
  \ `.git/objects` 下。\n\n当你创建一个新仓库时（图 15.4），在你创建仓库的目录中会出现一个新的子目录 `.git/`。`.git/` 包含了\
  \ git 了解项目所需的一切。\n\n![image](img/F000289f15-04-9780124159969.jpg)\n\n图 15.4 创建新仓库。\n\
  \n`.gitignore` 是一个你应该添加到每个创建的仓库的文件。它包含了一份不需要 git 跟踪的文件列表。例如，你不需要跟踪对象文件（`*.o`）或备份文件（`*~`）。hello-world/\
  \ 有一个 `.gitignore` 文件示例。\n\n### 文件状态与生命\n\n从 git 的角度来看，你工作目录中的每个文件都处于两种状态之一：已跟踪（tracked）或未跟踪（untracked）。已跟踪的文件是\
  \ git 已知并“跟踪”的文件。已跟踪的文件可能是未修改、已修改或暂存（staged）。当你 clone 一个项目时，所有文件最初都是已跟踪且未修改的。你使用\
  \ `git status` 命令确定项目文件的状态。\n\n尝试一下。为 hello-world 项目添加一个 README 文件，然后执行 `git status`。结果看起来像列表\
  \ 15.1。在这种情况下，还有一个已修改并已暂存（通过对它执行 `git add`）但尚未提交的文件。正如状态输出所示，使用 `git add <file>`\
  \ 来跟踪该文件并将其包含在下次提交中。\n\n![image](img/F000289f15-05-9780124159969.jpg)\n\n列表 15.1\
  \ Git Status。\n\n执行 `git add README`。现在 README 处于暂存状态，也就是说已准备好提交，以及自上次提交以来任何已修改并添加的文件。\n\
  \n这让我们来看了图 15.5 中的状态图。git 这种状态机视图的主要目的是说明大多数操作都是在本地、离线完成的。这有两个主要优势：\n\n1. 速度更快。\n\
  2. 你不需要在线即可工作。\n\n![image](img/F000289f15-06-9780124159969.jpg)\n\n图 15.5 Git 状态机视图。\n\
  \n我们已经见过了 `git clone` 和 `git push`。`git fetch` 从远程仓库检索更新。`git pull` 则执行 fetch 后进行合并（merge），将更新集成到当前分支。\n\
  \n### 分支与合并\n\n也许 git 最突出的特征是它的分支模型。其他 VCS 也支持分支，但 git 以一种特别优雅的方式实现。事实上，有些用户将分支模型称为\
  \ git 的“杀手锏”。\n\n要理解分支是如何工作的，我们需要后退并仔细观察 git 是如何存储提交的。图 15.6 显示了单个提交的内容。它由一个提交元数据对象组成，包含作者、提交者和提交注释等，以及一个指向树对象的指针，该树对象反过来指向代表此提交中更改的单个对象的二进制（blob）。树和\
  \ blob 构成了该提交所代表的快照。\n\n![image](img/F000289f15-07-9780124159969.jpg)\n\n图 15.6\
  \ 提交的表示。\n\n图 15.7 显示了又两个提交之后的情况。每个随后的提交对象都指向其父提交（即创建它的提交）。这就是我们如何重建项目完整历史的方法。图中还有两个对象。Master\
  \ 是当前分支的名字，即你正在工作的分支。每个项目都从 master 分支开始。HEAD 指向当前活动分支。HEAD 是 `.git/` 中的一个文件。\n\n\
  ![image](img/F000289f15-08-9780124159969.jpg)\n\n图 15.7 多次提交。\n\n好了，让我们创建一个新分支。也许你想测试一些想法，但在彻底测试之前不想打扰生产代码。在\
  \ hello-world 项目上尝试一下。执行 `git branch testing` 然后执行 `git checkout testing`。`branch`\
  \ 命令创建一个名为 testing 的新分支，`checkout` 命令导致 HEAD 指向指定的分支，如图 15.8 所示。\n\n![image](img/F000289f15-09-9780124159969.jpg)\n\
  \n图 15.8 添加分支。\n\n现在对其中一个文件进行更改，然后执行 `git add` 和 `git commit`。检出 master 分支并在那里进行更改。结果如图\
  \ 15.9 所示。分支已经分叉。重要点是，每当你切换不同的分支时，git 都会将工作目录的状态恢复到该分支当前指向的快照。\n\n![image](img/F000289f15-10-9780124159969.jpg)\n\
  \n图 15.9 分叉分支。\n\n最终，你将达到想要将 testing 分合并回 master 生产分支的时刻。在检出 master 分支的情况下，执行 `git\
  \ merge testing`。Git 在两个分叉分支和一个共同祖先之间执行三路合并，创建一个新的提交对象。见图 15.10。\n\n![image](img/F000289f15-11-9780124159969.jpg)\n\
  \n图 15.10 合并分支。\n\n此时，你可能不再需要 testing 分支了。你可以使用 `git merge–d testing` 删除它。\n\n##\
  \ 配置 Git\n\n\n\n\n当你进行第一次提交（commit）时，你可能注意到 git 建议了一个从你系统信息中提取名称和电子邮件地址。用户名和信息是非常重要的数据，因为其他开发者可能需要就你对项目的提交与你联系。因此，为你的\
  \ git 包配置基本信息是非常重要的。\n\nGit 将配置信息存储在三个地方：\n\n1. `/etc/gitconfig`——适用于所有用户的系统级参数。使用\
  \ `git config --system` 来读取或写入这些值。\n2. `~/.gitconfig`——每个用户特定的参数。使用 `git config\
  \ --global` 来访问这些值。\n3. `.git/config`——在你当前正在工作的仓库中找到的特定项目参数。\n\n每个层级都会覆盖前一层的值，例如，`.git/config`\
  \ 中的值优先级高于 `/etc/gitconfig` 中的值。这些文件当然是纯 ASCII 文本，因此你可以通过手动编辑文件并插入正确的语法来设置值，但通常运行\
  \ `git config` 命令要简单得多。\n\n要开始之前，请设置你的用户信息：\n\n```bash\ngit config --global user.name\
  \ \"Homer Simpson\"\ngit config --global user.email homer@thesimpsons.com\n```\n\
  \n这些命令暗示了配置文件的基本结构。所有的配置变量都指定为 `section.variable`。在配置文件中，节名称被包含在方括号中。方括号中还可以包含一个用引号括的子节名称。该语法变为\
  \ `section.subsection.variable`。\n\n为了更好地理解这些内容是如何结合的，请执行 `git config --list`，它会列出所有当前定义的配置变量。然后用编辑器打开\
  \ `hello-world/.git/config` 以查看这些值是从哪里来的。\n\nGit 提供了一个帮助命令 `git help`，它列出了所有命令。如果你接着执行\
  \ `git help <command>`，你将获得 `<command>` 的帮助手册（man page）。执行 `git help config`，你最终会看到一个\
  \ git 识别的配置变量列表。\n\n## 图形化 Git\n\nEclipse 支持 git 也许并不令人意外。启动 Eclipse 并切换到“Git 仓库探索”透视图（Git\
  \ Repository Exploring perspective）。“项目资源管理器”视图（Project Explorer view）已被“Git 仓库”视图（Git\
  \ Repositories view）所取代。该视图的菜单栏上具有以下操作的图标：\n\n- 向视图添加本地仓库。\n- 向视图克隆仓库。\n- 在视图中创建新的\
  \ git 仓库。\n\n由于我们已经有一个 `hello-world` 仓库，让我们将其添加到 Eclipse 中。点击“添加”图标弹出如图 15.11 所示的对话框。从\
  \ `hello-world/` 目录或任何父目录开始，点击“搜索”按钮。Eclipse 应该能找到 `hello-world` 仓库。点击确定，仓库将被添加到“Git\
  \ 仓库”视图。\n\n![image](img/F000289f15-12-9780124159969.jpg)\n图 15.11 将仓库添加到 Eclipse。\n\
  \n在 Git 仓库视图中展开 `hello-world` 条目和各种子项，如图 15.12 所示。此处显示的各个对象的右键菜单几乎完全符合你的预期。如果你右键点击“分支”（Branches），可以创建一个新分支。当前检出的分支由一个勾选标记标识。右键点击另一个分支名称以对其进行检出（check\
  \ out）。\n\n![image](img/F000289f15-13-9780124159969.jpg)\n图 15.12 Git 仓库视图。\n\n\
  为了在 Eclipse 环境中管理 `hello-world`，我们需要使其成为一个 Eclipse 项目。右键点击“工作目录”（Working directory）条目并选择“复制路径到剪贴板”。严格来说，这不是一个\
  \ C/C++ 项目，因此我们选择 File>New>Project，展开 General 并选择 Project。点击“下一步”并给项目命名。脑海中浮出了“Hello\
  \ World”。取消勾选“使用默认位置”，在位置框中右键点击并选择“粘贴”。然后点击“完成”。\n\n对一个或多个文件进行更改。只需双击工作目录下的文件条目即可在编辑器中打开它们。然后右键点击已更改的条目将其添加到暂存区（staging\
  \ area）。现在右键点击 `hello-world` 条目并选择“提交”（Commit）。这将弹出如图 15.13 所示的对话框。\n\n![image](img/F000289f15-14-9780124159969.jpg)\n\
  图 15.13 提交对话框。\n\n修改的文件列在作者（Author）和提交者（Committer）条目下方。状态中的勾选标记表示该文件已暂存。工具栏上有一个勾选所有文件的图标。请注意，由于我们创建了\
  \ Eclipse 项目，现在工作目录中有一个 `.project` 文件。点击“完成”，提交即被保存。\n\n### 创建新仓库\n\n归根结底，这一切目的是让你自己的项目受到\
  \ git 的控制。作为一个示例，让我们从书中之前处理过的 Eclipse 项目中创建一个新仓库。网络项目如何？\n\n要将现有的 Eclipse 项目引入 git\
  \ 仓库，在“项目资源管理器”中选择项目条目，右键点击并选择团队（Team）>共享项目（Share Project）。这将弹出一个对话框，你可以在其中选择想要使用的\
  \ VCS。选择 git 并点击“下一步”，如图 15.14 所示。\n\n![image](img/F000289f15-9780124159969.jpg)\n\
  图 15.14 配置仓库。\n\n回到“项目资源管理器”视图，网络条目现在显示 `[master HEAD]`，但还没有进行初始提交。如果你右键点击并选择“团队”（Team），选项之一是“提交”（Commit），这将弹出我们在图\
  \ 15.13 中看到的对话框。选择所有文件，输入提交消息，并点击“提交”。\n\n你仍然可以在 C/C++ 透视图中完成大部分工作。Git 对开发过程的干扰并不大。当你需要进行“类\
  \ git 式”的操作时（例如管理分支），你需要切换到“Git 仓库”透视图。\n\n我们使用 git 进行 SCC（软件配置控制）的探索到此结束。在下一章也是最后一章中，我们将查看从源码构建完整\
  \ Linux 系统的工具。\n\n## 资源\n\n[`git-scm.com`](http://git-scm.com)—git 首页。\n\n[`git-scm.com/book`](http://git-scm.com/book)—Scott\
  \ Chacon 编写的 *Pro Git*。这是一本非常易读且详尽的 git 介绍。整本书可以在 git-scm 网站上以 HTML 格式提供，也可以下载 PDF\
  \ 版本。\n\n[`en.wikipedia.org/wiki/Comparison_of_revision_control_software`](http://en.wikipedia.org/wiki/Comparison_of_revision_control_software)—包括\
  \ git 在内的约 30 版本控制系统的很好的对比。\n\n[`github.com`](https://github.com)—一个 git 托管服务，声称托管了来自\
  \ 200 万人的 300 万多个仓库。开源项目免费。私有仓库需要每月订阅。\n\n[`na1.salesforce.com/help/doc/en/salesforce_git_developer_cheatsheet.pdf`](https://na1.salesforce.com/help/doc/en/salesforce_git_developer_cheatsheet.pdf)—这是一个紧凑、实用的\
  \ git 使用“速查表”。你可以通过 [`git-scm.com/docs`](http://git-scm.com/docs) 更直接地访问它。\n\n\n\
  \n\n[gitorious.org](http://gitas.org)—另一个 git 托管服务。这一个似乎比 github 更有社区氛围。\n\n# 第\
  \ 16 章\n\n## 构建工具\n\n面向对象代码的伟大之处在于，它可以让简单简单的问题变得巨大且复杂。\n\n一个嵌入式 Linux 系统包含几个主要组件，它们都源自免费提供的源代码，并且都可能需要不同程度的定制。这些组件包括：\n\
  \n• 引导加载程序 (Boot loader)\n• Linux 内核\n• 根文件系统\n• 交叉工具链 (Cross-tool chain)\n\n在本书的过程中，我们将这些视为独立的元素，而没有过多关注它们的来源、构建方式，或者它们之间是如何相互作用的。\n\
  \n这些元素共同构成了一个嵌入式 Linux `distribution`（发行版）。许多嵌入式发行版已经演变，以解决构建和集成这些元素的问题。我们将在本章查看其中一些。\n\
  \n### Buildroot\n\nBuildroot 源于开发了 `uClibc` 和 `Busybox` 的同一个项目。`uClibc` 是 `glibc`\
  \ 的轻量级版本，专门为嵌入式 Linux 应用开发。它最初是为了是为了支持 `uClinux`（一种针对非内存管理单元 `MMU` 处理器的 Linux 变体）而开发的。与大多数现代开源库一样，`uClibc`\
  \ 根据库通用公共许可证 (`LGPL`) 发布。\n\nBuildroot 是一组 `Makefiles`、脚本和补丁，旨在简化交叉编译工具链、根文件系统和\
  \ Linux 内核镜像的构建过程。对于经常处理非 x86 器的工作的嵌入式开发者来说，这是一个特别重要的问题。\n\nBuildroot 以及其他类似构建系统（如\
  \ `OpenEmbedded` (`OE`)）的一个有趣之处是，所有内容都是从互联网获取的源码构建的。其结果之一是初始构建可能需要 `long` 时间，通常需要几个小时。另一个特性是\
  \ Buildroot 专门设计为作为普通用户运行。你不需要 root root。\n\n从 [buildroot.uclibc.org](http://buildroot.uclibc.org)\
  \ 下载 tar 包。在本文写作时，最稳定的版本是 `buildroot-2012.05`。将其解压到合适的位置，可能可能是你的家目录。执行 `make help`\
  \ 查看所有可用选项。注意，有一组类似于我们在内核中看到的 `*_defconfig` 目标，包括 `mini2440_defconfig`。因此执行 `make\
  \ mini2440_defconfig`，然后执行 `make xconfig`。\n\n图 16.1 是 `xconfig` 菜单截图。泛来说，配置选项分为以下几类：\n\
  \n• 目标架构和变体\n• 构建 Buildroot 的选项\n• 工具链选项\n• 系统配置\n• 目标包选择\n• 引导加载程序\n• 内核。\n\n![image](img/F000204f16-01-9780124159969.jpg)\n\
  \n图 16.1 BuildRoot xconfig。\n\n帮助信息通常比我们在内核配置中看到的没用。你可能想要更改几个地方。在 Toolchain 下，启用宽字符\
  \ (`WCHAR`) 支持。这似乎是许多其他功能的要求。选择 Linux 3.1.x 头文件，因为我们正在使用 3.1.5 版本。为目标主机构建 `gdbserver`\
  \ 并为主机构建 `gdb`。在网络应用下，你可能想为 Eclipse Remote System Explorer 选择 `openssh`。在文件系统镜像下，选择\
  \ `ext2` 根文件系统，因为我们将其用于 NFS 挂载。退出并保存更改。\n\n执行 `make`。几小时后，你应该会发现 `output/` 子目录填充如下：\n\
  \n• `build/`—除交叉工具链外，所有组件都在在此构建。\n• `images/`—引导加载程序、内核和根文件系统的最终镜像。\n• `host/`—为\
  \ BuildRoot 所需编译的主机安装工具，包括交叉工具链。\n• `staging/`—指向 `output/host/usr/sysroot` 的链接。它的用途并不明确。\n\
  • `target/`—一个`几乎` 完整的目标文件系统。它缺少 `dev/` 目录，该目录必须以 root 用户身份创建。请使用 `images/` 中的文件系统镜像。\n\
  • `toolchain/`—交叉工具链组件的构建目录。\n\n### OpenEmbedded\n\n`OE` 项目将自己描述为创建 Linux 发行的软件框架，主要用于（但不限于）嵌入式应用。它源于用于\
  \ Sharp Zaurus 个人数字助理 (`PDAs`) 的 OpenZaurus 项目。OpenZaurus 开发者认为他们已经推推了 Buildroot\
  \ 的极限。很快，其他 PDA 开发者参与了 `OE` 开发，多年来，许多嵌入式发行版都基于 `OE` 代码库。`OE` 于 2011 年 3 月与 `Yocto`\
  \ 项目合并，形成 `OE-Core` 项目。\n\n从根本上说，`OE` 包含两个元素：构建引擎 `BitBake`，以及告诉 `BitBake` 要做什么的\
  \ `metadata`（元数据）。`BitBake` 用 Python 编写的。引用用户手册，“不像 `make` 等单项目工具，[BitBake] 不基于单个\
  \ makefile 或一组封闭的相互依赖 makefiles，而是收集并管理一组很大程度上独立的构建描述（包配方），并按正确的顺序构建它们。”\n\n\n\n\
  \n\n```bash\nexport BBPATH=/path/to/openembedded:/path/to/build/folder\n```\n\n\
  ```bash\necho 0 >/proc/sys/vm/mmap_min_addr\n```\n\n```bash\nbitbake–v task-base\n\
  ```\n\n这为你为你提供开始构建镜像或单个包所需的各种交叉编译器、库和工具。尝试构建 `console-image` 编译配方：\n\n```bash\n\
  bitbake-v console-image\n```\n\n这会生成一个内核镜像 `uImage` 和一个根文件系统 `console-image.jffs2`，后者可以烧录到闪存中。\n\
  \n如既往一样，我们只是触及了这个极其复杂的工具的皮毛。如果你感兴趣，可以深入研究并学习更多。\n\n## 个人观察\n\n在大多数情况下，我克制了没有在书中加入自己的个人偏见。是的，我承认我是一个\
  \ GUI 拥趸，因此我强调了 `Eclipse` 和 `KDE`。但现在我要发表主见了。我不喜欢 `OE`。在我看来（My Humble Opinion），它复杂得没必要，文档匮乏，而且根据我的经验，它并不好用。诚然，情况因人而异，显然它对某些人来说是有效的。尽管如此，我在各种论坛和邮件列表中看到了足够多的不满意见，这强化了我的观点：`OE`\
  \ 真的还没有准备好大规模投入。\n\n我最近尝试为 `Gumstix` 开发板进行 `OE` 构建。它花费了超过 24 小时，生成了超过 600,000 个文件，最后我甚至不确定自己得到了什么。哦，还有一个我必须手动修复的构建错误。我实际上对修复方案竟然有效了感到非常惊讶。\n\
  \n我在使用 `BuildRoot` 上获得了一些（但不多）成功。至少 `BuildRoot` 更加“易于上手”，因为它它是基于脚本和 `Makefiles`\
  \ 等熟悉概念构建的。\n\n## Android\n\n到目前为止，任何与消费级技术有哪怕半点联系的人都知道，`Android` 是 `Google` 对移动设备\
  \ `Linux` 的实现。你可能不知道的是，`Android` 现在是全球领先的智能手机平台，在 2012 年第一季度占据了 59% 的市场份额。每天有一百万台\
  \ `Android` 设备被激活！\n\n当然，`Android` 不仅仅是 `Linux`；它是一个完整的开发框架，如图 16.3 所示。虽然大多数 `Android`\
  \ 应用是用 `Java` 编写的，但该平台中没有 `Java Virtual Machine`，也不执行 `Java` 字节码。`Java` 类被编译为 Dalvik\
  \ 可执行文件并运行在 `Dalvik` 上，这是一种专门为 `Android` 设计的特化虚拟虚拟机，并针对内存和 CPU 有限的电池供移动设备进行了优化。\n\
  \n![image](img/F000204f16-03-9780124159969.jpg)\n\n图 16.3 Android 框架。\n\n本文写作时 `Android`\
  \ 的最新发布版本是 4.1 `Jelly Bean`，于 2012 年 7 月发布。有趣的是，从 2009 年 4 月发布的 1.5 版本 `Cupcake`\
  \ 开始，所有的发布版本都按照甜点的字母顺序进行命名。\n\n`Android` 开发有两个不同的层次：应用开发和平台开发。应用开发可以在 `Windows`、`Linux`\
  \ 或 `Mac OS X` (Intel) 上进行。平台开发仅限于 `Linux` 和 `Mac OS`。\n\n### 应用开发\n\n首先从 [developer.android.com/sdk/](http://developer.android.com/sdk/)\
  \ 下载 `Linux` 版 Android 开发包 (SDK) 压缩包。在合适的位置解压这个 80 多兆的文件。这只是个开始。接下来，你需要 `Android\
  \ SDK Platform Tools` 和一个真实的平台。执行 `tools/android` 调出图 16.4](#CHP016.html_F0025)所示对话框。选择\
  \ `Android SDK Platform tools` 和 `Android` 4.1 (API 16)，然后点击安装 7 个软件包。系统会要求你接受许可协议。当然，最简单的方法是点击全部接受。\n\
  \n![image](img/F000204f16-04-9780124159969.jpg)\n\n图 16.4 Android SDK Manager。\n\
  \n下载完成后，最有用的事情是进入 `docs/about` 并用浏览器打开 `index.html`。这会引导你进入一份非常详尽的开发者指南。`Eclipse`\
  \ 是 `Android` 首选开发环境，因此你需要下载 `Eclipse` 的 Android 插件。在完成安装和配置后，最好的可能是构建你的第一个应用。\n\
  \n一旦你构建了第一个“Hello World”应用，你可以在通过 USB 连接的真实 Android 设备上运行它，也可以在模拟器上运行。这两个方法都可以从\
  \ `Eclipse` 进入。\n\n### 平台开发\n\n平台开发是另一个问题。硬件要求相当“苛刻”。`Gingerbread` (2.3.x) 及更高版本需要\
  \ 64 位环境。源码下载约为 8.5 GB，单次构建需要超过 30 GB 的磁盘空间。\n\nGoogle 定期在最新版本的 `Ubuntu` 上测试 `Android`\
  \ 构建，但建议其他 `Linux` 发行版也应该可行。目前推荐使用 `Ubuntu` 10.04，再次强调，它必须是 64 位的。目前推荐：\n- `Ubuntu`\
  \ 10.04\n- `Python` 2.5–2.7\n- `JDK` 6 或更高\n- `Git` 1.7 或更高\n\n## 总结\n\n我们已经在 `Linux`\
  \ 世界中涵盖了大量内容。简要回顾一下，我们涵盖了：\n- 嵌入式 `Linux` 的概概述\n- 安装 `Linux` 以及目标硬件\n- `Eclipse`\
  \ IDE\n- 交叉开发环境\n- 配置 `Linux` 内核和设备驱动\n- 如 `uboot`、`BusyBox` 和 `git` 等各种工具\n- `Linux`\
  \ 发行版和构建工具\n\n我不认为这些内容是完整的。我们涉及了一些需要深入研究的主题。希望你至少研究我列出的一些资源。再次，请加入 [groups.yahoo.com/embeddedbook](http://groups.yahoo.com/embeddedbook)\
  \ 的 Yahoo 群组。编码愉快！\n\n## 资源\n\n[buildroot.uibc.org](http://buildroot.uibc.org)—`BuildRoot`\
  \ 的主页。\n[billforums.51.net/viewtopic.php?f=3&t=4](http://billforums.51.net/viewtopic.php?f=3&t=4)—关于\
  \ `OpenEmbedded` 在 Mini2440 上的入门指南。\n[source.android.com](http://source.android.com)—在此获取\
  \ Android 源码和工具，以及详细的开发文档。\n\n# 附录 A\n\n# U-Boot 命令\n\nU-Boot 支持一套丰富的命令集。本节描述了其中最有用的命令。由于\
  \ `U-Boot` 高可配置，并非所有命令都存在于特定的实现中。某些命令的行为取决于配置，并取决于环境变量的值。\n\n所有 `U-Boot` 命令都期望十六进制数字。在随后的描述中，参数包含在\
  \ `< >` 中。可选参数进一步包含在 `[ ]` 中。命令名称通常可以缩写为唯一的字符串。\n\n## 信息命令\n\nbdinfo (bdi)—显示目标板的信息，例如内存大小和位置、时钟频率和\
  \ MAC 地址。这些信息对 `Linux` 内核可用。\n\nconinfo (conin)—显示可用控制 I/O 设备的信息。它显示设备名称、标志和当前用途。\n\
  \n\n\n\n\n`flinfo [<bank #>] (fli)—显示有关可用闪存内存的信息。如果不提供参数，`flinfo` 将列出所有闪存内存库（banks）。如果提供数字参数\
  \ `n`，它将仅列出第 `n` 个内存库。\n\n`iminfo <start addr> (imi)—显示 Linux 内核或 ramdisk 等镜像的头部信息。它会列出镜像名称、类型和大小，并验证\
  \ `CRC32` 校验和。`iminfo` 接受一个作为镜像起始地址的参数。`ininfo` 的行为受环境变量 `verify` 的影响。\n\n`help\
  \ [<command name>]—自证其名。如果不提供参数，它将打印所有命令的简短描述。如果提供命令名称参数，它将提供更详细的帮助。\n\n## 内存命令\n\
  \n默认情况下，内存命令对 32 位整数进行操作。通过在命令名后附加 `.w`（用于 16 位）或 `.b`（用于 8 位），可以使其改为对 16 位字或 8\
  \ 位类型进行操作。还有一个 `.l` 后缀用于显式指定 32 位。例如：`cmp.w 1000 2000 20` 比较地址 `0×1000` 和 `0×2000`\
  \ 处的 32（十六进制 20）字。\n\n`base [<offset>] (ba)—获取或设置作为所有其他内存命令偏移偏移的基地址。如果不带参数，它将显示当前基地址，默认为\
  \ `0`。数字参数将成为新的基地址。这对于重复访问内存的特定区域很有。\n\n`crc32 <start addr> <length> [<store addr>]\
  \ (crc)—计算并显示从 `<start addr>` 开始长度为 `<length>` 字节的 32 位校验和。可选的第三个参数指定存储校验和的位置。\n\
  \n`cmp <addr1> <addr2> <count>—比较两个内存区域。`<count>` 是数据项的数量，与指定的字节、字或长字（long）大小无关。\n\
  \n`cp <source> <dest> <count>—将一段内存复制到另一个位置。`<count>` 是拷贝的项目数。\n\n`md <addr> [<count>]—内存显示。以十六进制和\
  \ ASCII 格式显示一段内存。可选的 `<count>` 参数默认为 64 项。`md` 会记住最近的 `<addr>` 和 `<count>`，因此如果未带地址参数输入，它将从上次停止的地方继续。\n\
  \n`mm <start addr>—使用自动递增修改内存。显示项的地址和当前内容，并提示用户输入。有效的十六进制值将替换当前值，命令将显示下一个项。只要你输入有效的十六进制值，操作就会持续。输入非十六进制值以终止命令。\n\
  \n`mtest <start addr> <end addr> [<pattern>]—简单的 RAM 读写测试。此测试会修改 RAM，如果触及了 U-Boot\
  \ 使用的区域（如栈或堆），可能会导致系统崩溃。\n\n`mw <addr> <value> [<count>]—从 `<addr>` 开始向一段内存范围写入\
  \ `<value>`。可选的 `<count>` 默认为 1。\n\n`nm <addr>—在常量地址修改内存（无自动递增）。交互式地向同一地址写入有效的十六进制数据。这对于访问\
  \ I/O 设备寄存器很有用。输入非十六进制内容终止命令。\n\n`loop <addr> <count>—在紧循环中读取内存。这对于范围测试很有用。此命令永远不会终止！唯一的退出方法是重置板卡。\n\
  \n## NOR 闪存内存命令\n\nU-Boot 将 NOR 闪存内存划分为扇（sectors）和库（banks）。库定义为由连接到同一片选信号的一个或多个内存芯片组成的内存区域。库被进一步划分为扇，扇是单次操作中可以写入或擦除的最小单位。库编号从\
  \ 1 开始，而扇编号从 0 开始。\n\n`cp <source> <dest> <count>—`cp` 命令是“感知闪存的”。如果 `<dest>` 在闪存中，它将调用相应的编程算法。注意，如果目标区域未擦除或包含任何受保护的扇，拷贝可能会失败。\n\
  \n`erase <start> <end> (era)—擦除从 `<start>` 到 `<end>` 的闪存。`<start>` 必须是扇的起始地址，`<end>`\
  \ 必须是后续扇的结束地址。否则命令不执行。如果范围包含任何受保护的扇，将显示警告。要擦除的范围也可以用库和扇的形式表示。\n\n`erase <bank #>:<start\
  \ sector>[–<end sector>]—擦除闪存库 `<bank #>` 中的 `<start sector>` 到 `<end sector>`。如果不存在\
  \ `<end sector>`，则仅擦除 `<start sector>`。\n\n`erase all—擦除除受保护扇外的所有闪存内存。\n\n`protect\
  \ on | off <start> <end>`—为指定范围开启或关闭写保护。`<start>` 必须是扇的起始地址，`<end>` 必须是后续扇的结束地址。与擦除命令一样，保护范围可以用库和扇的形式表示。\n\
  \n`protect on | off <bank #>:<start sector>[–<end sector>]—在闪存库 `<bank #>` 中从 `<start\
  \ sector>` 到 `<end sector>` 开启或关闭写保护。如果不存在 `<end sector>`，则仅影响 `<start sector>`。\n\
  \n`protect bank <bank #>—为指定库中的所有扇开启或关闭写保护。\n\n`protect all—为系统中的所有闪存开启或关闭写保护。\n\
  \n注意，保护机制仅是软件层，取决于 U-Boot 的写入。\n\n## NAND 闪存内存命令\n\nNAND 闪存分为任意大小的分区。所有 NAND 命令均以\
  \ `nand` 为缀。\n\n`nand info—显示可用的 NAND 设备。\n\n`mtdparts—列出 NAND 分区。\n\n`nand erase\
  \ [clean] [<offset> <size>]—从 `<offset>` 开始擦除 `<size>` 字节。如果没有指定 `<offset>`，则擦除整个芯片。\n\
  \n`nand scrub—清理。\n\n`nand createbt—创建坏块表。\n\n`nand bad—列出坏块。\n\n`nand read[.jff2\
  \ | .yaffs] <address> <partition> <size>`—从闪存的 `<offset>` 或 `<partition>` 名称读取 `<size>`\
  \ 字节到 RAM 的 `<address>`。`.jff2` 和 `.yaffs` 修饰符识别文件系统。\n\n`nand write[.e | .jff2\
  \ | .yaffs] <address> <partition> <size>`—将 RAM 中 `<address>` 的 `<size>` 字节写入闪存的\
  \ `<offset>` 或 `<partition>` 名称。`.e` 修饰符表示写入纠错字节。`.jff2` 和 `.yaffs` 修饰符识别文件系统。\n\
  \n## 执行控制命令\n\n`autoscr <addr>`—执行 U-Boot 命令脚本。该脚本被写入文本文件，然后使用 `mkimage` 工具转换为镜像。`<addr>`\
  \ 是头部的起始位置。\n\n`bootm <addr> [<param> …]—从内存启动镜像（如 OS）。`<addr>` 处的头部包含 OS 类型、压缩（如果有）、加载和入口地址的必要信息。`<param>`\
  \ 是传递给 OS 的多个可选参数。OS 镜像被复制到 RAM 中并在必要时解压缩。然后转移到入口地址。对于 Linux，识别的一个可选参数是 initrd 磁盘镜像。\n\
  \n顺便注意镜像可以从 RAM 启动，例如通过 TFTP 下载。在这种情况下，请确保压缩镜像不会与解压缩镜像使用的内存区域重叠。\n\n`go <addr> [<param>\
  \ …]—将控制转移给从 `<addr>` 开始的独立应用程序，并传递可选参数。这些程序不需要复杂的 OS 环境。\n\n\n\n\n也可以使用串口线下载文件。推荐用于串口镜像下载的终端仿真器是\
  \ `kermit`，因为某些用户报告了使用 `minicom` 下载镜像时存在问题。\n\n`loadb <offset>`—通过串口接收二进制镜像并下载到地址\
  \ `<offset>` 处。在 `U-Boot` 中启动此命令，然后在主机端发起传输。\n\n`loads <offset>`—通过串口接收 S-record\
  \ 文件并下载到地址 `<offset>` 处。\n\n## 环境变量命令\n\n`printenv [<name> …]`—打印一个或多个环境变量的值。如果不带任何参数，`printenv`\
  \ 将列出所有环境变量。否则，它将列出指定变量的值。\n\n`setenv <name> [<value>]`—带有一个参数时，`setenv` 会从 U-Boot\
  \ 环境变量中删除指定的变量并回收存储空间。带两个参数时，它会将变量 `<name>` 设置为 `<value>`。这些更改仅发生在 RAM 中。**警告：**在\
  \ `<name>` 和 `<value>` 之间使用空格，而不是“=”。后者将被视为字面量，并导致非常奇怪的结果。\n\n当值包含对命令行解析器具有特殊含义的字符（如用于变量替换的\"\
  $”和用于命令分隔的\";”）时，适用标准的 shell 引用规则。这些字符使用反斜杠“\\”进行转义。示例：\n\n```\nsetenv netboot tftp\
  \ 210000000 uImage\\; bootm\n```\n\n`saveenv`—将环境变量写入持久性存储器。\n\n`run <name> […]`—将环境变量\
  \ `<name>` 的值视为一个或多个 U-Boot 命令并执行它们。如果指定了多个变量，它们将按顺序执行。\n\n`bootd (boot)`—`run bootcmd`\
  \ 的同义词，用于执行默认启动命令。\n\n## 环境变量\n\nU-Boot 环境存储在持久性存储器中，并在 U-Boot 启动时复制到 RAM。它存储了用于配置系统的环境变量。环境受\
  \ `CRC32` 校验保护。本节列出了 U-Boot 识别的一些环境变量。\n\n此处显示的变量在 U-Boot 场景中具有特定用途，在大多数情况下不会被显式使用。需要时，U-Boot\
  \ 环境变量会在命令中显式使用，类似于在 shell 脚本和 Makefile 中的用法，通过将它们封装在 `$()` 中。\n\n`autoload`—如果设置为“no”或任何以“n”头的字符串，`rarp`\
  \ 和 `bootp` 命令将仅获取配置信息而不尝试使用 `TFTP` 下载镜像。\n\n`autostart`—如果设置为“yes”，通过 `rarpb`、`bootp`\
  \ 或 `tftp` 命令加载的镜像将通过内部调用 `bootm` 命令自动启动。\n\n`baudrate`—指定控制台串口波特率的十进制。只有预定义的波特率设置可用。执行\
  \ `setenv baudrate <n>` 命令后，U-Boot 期望在实际提交新速率之前以新速率接收换行符。如果失败，板必须重置并恢复到旧波特率。\n\n\
  `bootargs`—此变量的值将作为启动参数传递给 Linux 内核，即“命令行”。\n\n`bootcmd`—定义一个命令字符串，当初始倒计时未被中断时自动执行，但仅当变量\
  \ `bootdelay` 也被定义为非负值时才执行。\n\n`bootdelay`—在执行 `bootcmd` 变量的内容之前等待的秒数。在 `bootcmd`\
  \ 序列开始之前按下任意键可以中断延迟。**警告：**将 `bootdelay` 设置为 0 会立即执行 `bootcmd` 并实际上禁用了与 u-boot 的任何交互。相反，将此变量设置为\
  \ −1 则会禁用自动启动。\n\n`bootfile`—由 `tftpboot` 命令加载的默认镜像名称。\n\n`ethaddr`—板上第一个或唯一以太网接口的\
  \ MAC 地址，在 Linux 中称为 `eth0`。MAC 地址是 48 位，表示为六对用点分隔的十六进制数字。\n\n`eth1addr, eth2addr`—存在时的第二个和第三个太网接口的\
  \ MAC 地址。\n\n`ipaddr`—为目标板设置 IP 地址以进行 TFTP 下载。\n\n`loadaddr`—`tftpboot`、`loads`\
  \ 和 `bootm` 等命令在 RAM 中的默认缓冲区地址。注意：代码中似乎存在但并未记录的默认加载地址 `0x21000000`。\n\n`serverip`—用于\
  \ `tftpboot` 命令的 TFTP 服务器的 IP 地址。\n\n`serial#`—一个包含硬件标识（如类型和序列号）的字符串。此变量只能设置一次，通常在板制造期间。一旦设置，U-Boot\
  \ 将拒绝删除或覆盖此变量。\n\n`verify`—如果设置为“n”或“no”，则在 `bootm` 命令中禁用对整个镜像的校验计算，以牺牲启动过程安全性换取速度。头部校验仍会被验证。\n\
  \n以下环境变量可以根据网络启动命令（`bootp`、`dhcp` 或 `tftp`）根据启动服务器提供的信息自动更新：\n\n- `bootfile`—见上文，\n\
  - `dnsip`—你的域名服务器的 IP 地址\n- `gatewayip`—网关（路由器）的 IP 地址，\n- `hostname`—目标主机名。\n-\
  \ `ipaddr`—见上文，\n- `netmask`—子网掩码，\n- `rootpath`—NFS 服务器上根系统的路径，\n- `serverip`—见上文，\n\
  - `filesize`—使用最后一个 `bootp`、`dhcp` 或 `tftp` 命令下载的文件的大小（十六进制字符串形式的字节）。\n\n# 录 B\n\
  \n## 为什么软件不应该有所有者\n\n数字技术通过让复制和修改信息变得更容易为世界做出贡献。计算机承诺为我们所有人让这一切变得更容易。\n\n并不是所有人都希望变得更容易。版权制度赋予了软件程序“所有者”，其中大多数人的目标是从其他公众手中剥夺软件的潜在收益。他们希望成为唯一可以复制和修改我们所用软件的人。\n\
  \n版权制度随着印刷术而成长——这是一种大规模生产复制的技术。版权与这项技术契合得很好，因为它只限制了副本的大规模生产者。它并没有剥夺书籍读者的自由。一个不拥有打印机的普通读者只能用笔和墨水复制书籍，很少有读者因此被起诉。\n\
  \n数字技术比印刷机更灵活：当信息以数字形式存在时，你可以轻松地复制它与他人分享。正是这种灵活性使其与版权之类的系统非常不匹配。这就是现在用于执行软件版权的日益恶劣且严酷的措施的原因。考虑软件出版者协会（SPA）的这四种做法：\n\
  \n- 大规模宣传声称帮助朋友违背所有者的行为是错误的。\n- 招募线人举报他们的同事和伙伴。\n- （在警察帮助下）对办公室和学校进行搜查，并告诉人们必须证明自己对于非法复制是清白的。\n\
  - （由美国政府根据 SPA 的要求）起诉麻省理工学院 David LaMacchia 这样的人，不是因为复制软件（他没有被指控复制任何软件），仅仅是因为让复制设施无人看且未能监控其使用。\n\
  \n这四种做法与前苏联使用的做法相似，在那里，每台复制机都有守卫防止禁止的复制，个人必须秘密地复制信息并像“地下出版”一样手手传。当然，这是有区别的：苏联控制信息的动机是政治的；在美国，动机是利润。但影响我们的是行动，而不是动机。任何阻止信息共享的尝试，无论出于什么原因，导致相同的方法和同样的残酷。\n\
  \n所有者为了以下几类理由，要求赋予他们控制我们如何使用信息的权力：\n\n- **标签化。**所有者使用如“盗版”和“盗窃”等抹蔑词汇，以及如“知识产权”和“损害”等专业术语，向公众暗示某种思维方式——程序与物理对象之间简单的类比。\n\
  \n\n\n我们对于物质对象属性的观点和直觉，是关于从某人那里`take an object away`是否正确的。这些观点并不直接适用于对某物进行`making\
  \ a copy`。但所有者仍然要求我们应用这些观点。\n\n### 夸大\n\n所有者说，当用户自己复制程序时，他们遭受了“损害”或“经济损失”。但复制行为对所有者没有直接影响，也没有伤害任何人。只有当制作副本的人本该付费从所有者那里购买一个时，所有者才可能损失。\n\
  \n稍微思考就能发现，大多数这类人并不会购买副本。然而，所有者在计算他们的“损失”时，仿佛每一个人都会购买副本一样。委婉地说，这叫夸大。\n\n### 法律\n\
  \n所有者经常描述法律的现状，以及他们可以威胁我们的严厉惩罚。这种方法背后隐含的暗示是：当今法律反映了不容质疑的道德观——但与此同时，我们又被促使将这些惩罚视为自然事实，不能归咎于任何人。\n\
  \n这种说服路线并不是为了经受住批判性思维而设计的；而是为了强化一种习惯性的思维路径。\n\n法律不判定对错是显而易见的。每个美国人都应该知道，四十年前，在许多州，黑人坐在公交车前部是违法的；但只有种族主义者才会会说坐在那里是错误的。\n\
  \n### 自然权利\n\n作者经常声称他们与所编写的程序之间存在特殊的联系，并进一步断言，结果就是他们对程序的欲望和利益远超过任何人的利益——甚至超过世界上其他所有人的利益。（通常是公司而非作者拥有软件的版权，但我们被要求忽略这种差异。）\n\
  \n对于那些将此作为伦理公理的人——“作者比你重要”——我只能说，我我自己作为一个著名的软件作者，认为这是胡说八道。\n\n但普通人之所以可能对作者的自然权利主张产生同情，原因有两个。\n\
  \n其之一是与物质对象进行了过度的类比。当我煮意大利面条时，如果别人也吃了它，我会反对，因为那样我就没得吃了。他的行为对我造成的伤害与他获得的利益完全相等；我们中只有一个人能吃这碗面条，所以问题是，谁来？我们之间细微的区别就足以扭转伦理平衡。\n\
  \n但无论你运行还是修改我编写的程序，对你的影响是直接的，而对我只是间接的。你把副本给你的朋友，对你和你的朋友的影响远大于对我影响。我不应该有权力告诉你不去做这些事。任何人都不应该。\n\
  \n第二个原因是，人们被告诉作者的自然权利是我们社会公认且不容质疑的传统。\n\n从历史角度来看，事实恰恰相反。在起草美国宪法时，作者自然权利的想法曾被提出并被果断拒绝了。这就是为什么宪法只`permits`版权制度的存在而不`require`它；这就是为什么它规定版权必须是暂时的。它还规定版权目的是促进进步——而不是奖励作者。版权确实在某种程度上奖励了作者，对出版社更多，但那是为了改变他们行为的手段。\n\
  \n我们社会公认的传统是：版权侵犯了公众的自然权利——这种侵犯只有为了公众的利益才能成立。\n\n### 经济\n\n支持软件所有者的最终论点是，这会导致更多软件的生产。\n\
  \n与其他论点不同，这个论点至少对主题采取了正当的方法。它基于一个有效的目标——满足软件用户。从经验上说清楚，如果人们做某事能得到丰厚报酬，他们就会生产更多。\n\
  \n但经济论点有一个缺陷：它基于这样一个假设，差异仅仅在于我们要付多少钱。它假设“生产软件”就是我们想要的，无论软件是否有所有者。\n\n人们很容易接受这个假设，因为这符合我们对物质对象的经验。以一个三明治为例，你完全可以免费或花钱得到一个等等的三明治。如果是这样的话，你支付的金额是唯一的区别。无论你是否必须购买，三明治的味道、营养价值都是相同的，而且无论哪种情况下你都只能吃一次。你是否从所有者那里得到三明治，并不会直接影响任何事情，除了你之后拥有的金额。\n\
  \n对于任何种物质对象都是如此——无论它是否有所有者，都不会直接影响它`是什么`，或者如果你获得它你能用它做什么。\n\n但如果一个程序有了所有者，这在很大程度上影响了它是什么，以及如果你买了一个副本你能用它做什么。这种区别不仅仅是钱的问题。软件所有者制度鼓励软件所有者生产东西——但不是社会真正需要的。而且它造成了无形的伦理污染，影响着我们所有人。\n\
  \n社会需要什么？它需要对公民真正开放的信息——例如，人们可以阅读、修复、适应和改进的程序，而不仅仅是运行。但软件所有者通常交付的是一个我们无法研究或更改的黑盒。\n\
  \n社会还需要自由。当一个程序有了所有者时，用户失去了控制自己生活一部分的自由。\n\n最重要的是，社会需要鼓励公民自愿合作的精神。当软件所有者告诉我们，自然地帮助邻居是“盗版”时，他们污染了我们社会的公民精神。\n\
  \n这就是为什么我们说自由软件是一个自由的问题，而不是价格的问题。\n\n所有者的经济论点是错误的，但经济问题是真实的。有些人编写有用软件是为了编写的乐趣，或者是为了崇拜和喜爱；但如果我们想要比那些人写的更多的软件，我们需要筹集资金。\n\
  \n十年来，自由软件开发者一直在尝试各种方法寻找资金，并取得了一些成功。不需要让任何人富有；美国家庭中位数收入约为`35k`，证明对于许多不如编程那么满意的工作来说足够的激励。\n\
  \n多年来，直到一项资助让这变得没有必要，我一直通过对我编写的自由软件进行定制增强来维持。每个增强功能都被添加到发布的标准版本中，并最终向公众开放。客户付钱给我是为了让我开发他们想要的增强功能，而不是开发我原本认为优先级最高的功能。\n\
  \n自由软件基金会（`FSF`）是一个旨在自由软件开发的免税慈善机构，通过销售`GNU CD-ROMs`、`T-shirts`、`manuals`和豪华版（所有用户都可以自由复制和更改）以及捐赠来筹资金。它现在有五名程序员，加上三名处理邮购的员工。\n\
  \n一些自由软件开发者通过出售支持服务赚钱。Cygnus Support 在[本文写作时]约有 50 名员工，估计其员工活动约有 15%是自由软件开发——对于一家软件公司来说这是一个值得尊敬的比例。\n\
  \n包括 Intel、Motorola、Texas Instruments 和 Analog Devices 在内的公司联合资助了`C`语言的自由`GNU`编译器的持续开发。同时，`Ada`语言的`GNU`编译器正受到美国空军的资助，他们认为这是获得高质量编译器的成本效益的方法。[空军的资助于一段时间以前结束；`GNU\
  \ Ada Compiler`现在已投入使用，其维护由商业资助。]\n\n\n\n\n所有这些例子都是很小的；自由软件运动仍然很小，而且很年轻。但这个国家（美国）听众支持的电广播例子表明，在不强迫每个用户付费的情况下支持一项大型活动是可能的。\n\
  \n作为今天的计算机用户，你可能会发现自己正在使用专有软件。如果你的朋友要求复制一份，拒绝将是错误的。合作比版权更重要。但在私下、隐秘地合作并不能带来良好的社会。一个人应该追求公开、自豪地过上正直的生活，这意味着要对专有软件说“不”。\n\
  \n你有权与其他使用软件的人进行公开、自由的合作。你有权学习软件的工作原理，并以此教你的学生。你有权聘佣你喜欢的程序员在程序出现故障时修复它。\n\n你属于自由软件。\n\
