- fmt: '

    ### Slackware

    Patrick Volkerding created Slackware during 1992 and is the oldest surviving Linux
    distro. It is famous for the bug-free and clean distributions. It runs on both
    32-bit (`i486`) and 64-bit (`x86_64`) architectures. The philosophy is similar
    to Arch Linux. There are few drawbacks, such as a limited number of application
    support and upgrade complexities.


    ### Debian

    GNU/Linux came to existence on 1993. Today Debian can be thought of as the largest
    Linux distro and largest possible collaborative software project. According to
    Distrowatch, Debian is developed by more than 1000 volunteers, 50000+ binary packages,
    and inspiring over 120 distros. Debian is highly stable, has an outstanding quality
    assurance and supports the most processor architectures in contrast to others.
    One of the main drawbacks is the release of stable updates (2-3 years).


    ### Fedora

    Fedora is one of the most innovative Linux distros at present. It is linked to
    the famous Red Hat Linux. On 2003, Red Hat introduced a revolutionary change:
    the Fedora Core. It is introduced as a community edition designed for Linux hobbyists.
    Right now, Red Hat is the most profitable enterprise. Fedora presents outstanding
    security, supports multiple desktop environments, contributed to the kernel advancements,
    `glibc` and `GCC`, `SELinux` integration, journaled file system, system and other
    enterprise features. It also supports both 32-bit and 64-bit environments. It
    is geared toward more enterprise features and users.


    ### Red Hat and Cent OS

    Red Hat holds the flagship in the enterprise. It started in 1995. It had many
    innovative components, such as Anaconda GIU-based installer, `RPM` package manager,
    and more. Regrettably, it failed to maintain its phase with rising patent issues
    and similar. It ended its life on 2003 and gave birth to `RHEL` (Red Hat Enterprise
    Linux) and Fedora core. `RHEL` is undoubtedly the industry de-facto. It is able
    to operate on platforms like `x86_64`, `Arm64`, `Power ISA`, `IBM Z` and desktop
    platforms. It has huge variations targeting different enterprise-class applications
    such as servers and workstations. In the meantime, Fedora works as the upstream
    for future `RHEL` versions. Given the leadership and influence, exceptional support,
    cutting edge technology, `RHEL` is a superb for the enterprise use. It is used
    by tech giants.


    ### Gentoo

    Gentoo is a highly flexible meta distribution which allows users to run a verity
    of kernels and software configurations. Gentoo can be customized. This project
    introduced by Daniel Robbins in 2000. Even though it offers flexibility, it requires
    expertise to use. In other words, this is not suitable for inexperienced users,
    as it may take more time to get used to it. The upgrades can be time-consuming.


    ### Arch Linux

    Arch Linux was launched by Judd Vinet in 2002. In the beginning, it was considered
    as a marginal project that existed between intermediate and advanced users. Later
    on, it was promoted using a feature called “rolling- release”. Rolling-release
    means the operation system has the ability to keeps itself up to date. Arch Linux
    has an excellent software management infrastructure. It is included the ability
    to install software from the source code. One of the disadvantages is the risk
    of breakdown due to occasional instabilities.


    ### Ubuntu

    Ubuntu revolutionizes Linux for desktop users. It has been popular for a long
    time. It was launched in 2004 and is still popular among Linux Users. Ubuntu is
    based on `DEB` packages. It has a long-term support via Canonical and it even
    supports the enterprise now with its server edition. Some special features of
    Ubuntu are that it includes an installable live DVD, it supports for new technologies
    where a novice can easily get used to Ubuntu and the different desktop environments.
    One of the Significant disadvantages of Ubuntu is its lack of compatibility.


    ### MX Linux

    MX Linux was introduced as a replacement for MEPIS Linux. This has designed for
    personal purposes as well as business. The most popular feature of MX Linux is
    its graphical administrative tools, known as `MX-Tools`. It also has exceptional
    support for the platform, exceptional compatibility with graphics drivers and
    the ease of administration. MX Linux may not be friendly for novices when compared
    Mint and Ubuntu. It takes time to get used to it and its installer and some tools
    may appear different.


    ### Mint

    Linux Mint was launched in 2006. It was designed based on Ubuntu. This distribution
    is the best for the beginners. Mint has a wide range of enhancements that make
    it user friendly. It provides interoperability with other operating systems. Therefore,
    it is suitable not only for personal use, but also for the enterprise. The developers
    offer 3 types of releases namely official (on December), point releases (as needed,
    e.g., bug fixes) and a monthly snapshot release. This makes Mint highly stable.


    ### Backtrack and Kali

    There are other special Linux editions geared toward system security and penetration.
    Kali Linux is the most popular penetration testing platform at present. It all
    started with the creation of BackTrack from the merger of WHAX (WHAX was a Slax
    based Linux distribution. The company that was behind this was Offensive Security
    . Earlier versions of WHAX was based on Knoppix and named Whoppix). BackTrack
    5 was based on Ubuntu Lucid LTS. It supported both 32-bit and 64-bit architectures
    and ARM. In 2013, the company rebuilt the platform based on Debian and released
    in under the name Kali. Kali Linux is highly stable and advanced with its capabilities
    and the set of top-level penetration testing tools.


    ### Android

    What about Android? Android is the largest distribution based on a modified version
    of the Linux kernel, and Google’s own libraries. Android also runs a virtual platform
    called `Dalvin` to run the applications written in Java. Such applications target
    different hardware platform and it depends on the Google APIs. You cannot run
    a desktop version of Linux in an Android device. You cannot run a mobile Android
    version in a PC (without emulation and virtualization).


    ### Linux Live CDs

    Linux Live CDs and USBs are quite popular among a variety of users. It goes beyond
    simply learning what Linux is before the installation. Many Linux live distributions
    support running an operating system from a CD ROM. It is great for demonstration
    purposes and to test out things. The customized distributions include packages
    to carry out various simple and complex system tasks, such as changing hard disk
    layouts, security and recovery procedures and many more. These versions are now
    appearing as Linux USB distributions. The site `https://livecdlist.com/` lists
    a huge collection of live CDs. All the major distributions support the live CD
    functionality.


    #### Puppy Linux

    Puppy Linux is a small system that is less than 200MB. This Linux distribution
    is best for basic computer functions and web browsing. Even though it is ultra-small,
    file recovery tools and partitioning are still available. This distribution makes
    it easy to install other popular applications because it has its own package manager.
    Puppy Linux has various customized versions known as “puplets”. One of the advantages
    of the Puppy Linux is it can be used in older hardware.


    #### Slax

    Slax is a small and fast Linux distribution. It was based on Slackware. But now
    it’s based on Debian stable. It is one of the user-friendly Linux distribution.
    Users can delete or add modules when downloading. Slax is quite convenient. This
    distribution can be booted by different media such as USB flash or DVD ROM. Slax
    have a boot menu which includes many options.

