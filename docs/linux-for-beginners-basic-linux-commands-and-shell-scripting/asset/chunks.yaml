    ## 引言

    本书包含了如何使用或迁移到 Linux 以获取乐趣和利润的验证步骤和策略。这是 Linux 系列书籍中的第一本。你可以从书中学习 Linux 的基本概念和应用：从安装到基础
    Shell 脚本。该系列的后续书籍将为你提供 Linux 概念、哲学和应用知识的深度知识。该系列书籍组织良好，旨在为初学者提供足够的知识成为高级 Linux
    用户。


    ### 谁应该读这本书？

    本书使用简单的技术术语编写，并采用简单的示例和解释，使拥有 Linux 零或极少经验的用户也能学习 Linux 是什么以及如何开始学习 Linux。书的结构侧重于提供分步骤的说明和示例，并配有截图和解释，以避免混淆和歧义。内容不仅针对初学者，还面向普通计算机用户、初级管理员以及希望学习或加强对
    Linux 及其在实践中应用之方法了解的高管人员。


    ### 本书是如何组织和使用的

    本书将引导你完成自己 Linux 系统的初始设置，并向初学者介绍所需的 Linux 系统管理基础知识。在后面的章节中，它涵盖了更高级的主题，包括某些系统管理原理、理论和实际应用、基础和高级脚本，以及
    `GAWK` 等程序。本书按以下方式组织：

    * 你将学习更多关于 Linux 的历史、版本等内容（第 1 章）。

    * 安装和使用你的第一台 Linux 设备以及一些基础管理（第 2 章）。

    * Linux 用户管理原理、实用方法、编辑器、终端和控制台（第 3 章）。

    * Linux 命令、文件系统和基础管理简介（第 4 章）。

    * Linux 分区类型、数据文件以及通过排序、使用 `grep` 搜索、压缩/解压缩和存档进行的操作（第 5 章）。

    * Shell 脚本准备工作，例如理解进程、环境变量和数组（第 6 章）。

    * 命令别名、文件描述符、堆、数学运算、高级结构化命令和示例（第 7 章）。

    * 函数、参数、选项、`getopt` 和 `getopts`、读取用户输入和交互式脚本、高级函数、库以及 `GAWK` 的完整课程（第 8 章）。


    ### Tips、注释、注意事项和场景

    本书设计了许多排版特征，帮助你从书中获取最多的信息。


    ## 为什么选择 Linux？

    Linux 是一个开源操作系统或内核。它不仅是最流行的服务器操作系统，也是被广泛使用的开源操作系统。它由 Linus Torvalds 在 1991 年在
    `GNU` 的合作下创立。Linux 用于许多系统，例如笔记本电脑、台电脑、智能手机、智能冰箱等。尽管在起初它只在计算机程序员中闻名，但现在几乎无处不在。今天，Linux
    服务器运行着 Google、Facebook 以及许多知名服务。


    与 Windows 和 Mac OS 等其他流行的客户端操作系统相比，Linux 是一个开源系统，而其他系统不是。这意味着用户无法在那些操作系统中进行更改，因为用户无法访问它们的源代码。但任何人都可以修改
    Linux 操作系统。这并不意味着 Linux 没有商业版本。


    有些人将 Linux 称为 `UNIX` 的克隆。`UNIX` 是 Linux 的基础，或者从技术上说是灵感。在考虑核心时，两者是相似的。尽管 Linux
    像 `UNIX`，但它有独特的特征。`UNIX` 和 Linux 之间的区别在于：

    * Linux 非常灵活，但 `UNIX` 僵化，因此不能用于任何计算机。

    * 与 `Unix` 相比，Linux 提供了广泛的可移植性。

    * Linux 的源代码可以轻松获得，但对于 `UNIX` 并非如此。


    这些都是 Linux 基础的原因。一个完整的 Linux 系统可以被称为发行版。这包含了 Linux 内核、`GNU` 应用、桌面环境和应用程序。有许多满足需求的发行版：

    * Linux Mint

    * Ubuntu

    * Debian

    * Red Hat / CentOS

    * Fedora

    这些发行版是根据需求定制的。可以根据自己的需求选择最合适的发行版。例如，Ubuntu 可以轻松安装，任何人都可以使用，而 `OpenSUSE` 则需要高级知识。最近，由于许多优点，Linux
    用户量激增。考虑到 Linux 的优点，最流行的一点是它是免费的。与 Windows 和 Mac 相比，Linux 在用户中占据主导地位。在历史上，Linux
    并不是一个用户友好的操作系统，但现在它拥有足够的功能，并且灵活且高度可定制，可以在不下载完整功能包的情况下安装想要的内容。


    Linux 的主要优点之一是它的安全性。由于许多操作系统的安全问题，Linux 的增加是不可避免的，考虑到其强大的安全架构。在使用 Linux 时，大多数情况下不需要使用杀病毒程序（这并不意味着它完全没有漏洞，但这些很罕见）。在考虑隐私时，Linux
    系统也是有利的。由于 Linux 是一个开源操作系统，任何爱好者都有机会修改它，创建他们自己的发行版。即使具有所有这些功能，Linux 也非常稳定且可靠。Linux
    的安装通过现代 GUI 能力变得极其简单并运行在几乎所有的硬件上。与其他操作系统相比，Linux 的软件更新和补丁也更快。除了上述缺点，还有一些问题，其中之一是
    Linux 的版本数量非常多，这让初学者可能会感到困惑。由于 Linux 用户用户更多控制权，在过去的几十年里，Linux 赢得了普及。


    ## 第 1 章：Linux 内核与操作系统简介

    在本章中你将学习：


    ### 什么是 Linux

    Linux 内核、Linux 发行版、桌面系统、Shell。一切从正式的介绍开始。在本章中，我们将从操作系统的角度来看 Linux。


    ### 什么是 Linux？

    在不假设你了解操作系统的情况下，让我们简要看看术语和定义。我们将理解 Linux 是什么及其架构。操作系统是一个旨在更好地与一组硬件交互的软件程序，通过通信、管理和维护自身来实现工作，我们称之为计算机。如果采用一个更传统的定义，操作系统是用户和硬件之间的接口。操作系统通常在计算机的启动（boot）过程中加载到内存中，基本上诊断整个系统的健康状况，然后从硬盘将内容加载到内存。现在你知道操作系统是什么以及它的角色。有很多正在使用的操作系统，主要的操作系统有
    Unix、Linux 和 Mac OS。现在当涉及到 Windows 等流行的操作系统时，清楚操作系统是什么。它是私有的且易于区分的。然而，在 Unix 和
    Linux 上，有更多关于起源以及如何变为现实可以学习。


    如果你对操作系统的历史感兴趣，Unix 是最老的操作系统之一，特别是对于服务器系统。它是一个名为 `Multics` 的旧系统的衍生品。1970 年，Ken
    Thompson 与开发了 `C` 语言的 Dennis Ritchie 用 `C` 语言重写了这个小系统。Unix 在学术界迅速成长，Berkeley 是其中心。他们引入了
    软件发行版 `BSD`。在 70 年代和 80 年代，Unix 在学术界之外演变为操作系统并被其他组织采用。有许多版本，如 `IBM-AIX`、`HP-UX`、`Sun
    Solaris` 等。重要记住是 Unix 并不是开源软件。最终，在 BSD 家族下出现了一些开源变体，例如 FreeBSD。这种许可现在被称为 BSD 许可证。Linux
    的出现得益于两个重要的名字：Richard Stallman 和 Linus Torvalds。在 90 年代，Richard 想要创建一个真正开源且免费的私有
    Unix 系统的替代品。他在 `GNU` 名下创建了一系列工具和程序。`GNU` 是一个递归缩写，它的意思是“GNU 不是 Unix！”。然而，一组程序和工具没有内核是无法工作的！


    ### 什么是内核？

    内核是操作系统的核心。一旦启动，它对整个计算机拥有完全控制权。它由一个小的加载程序加载，然后它就是始与终。它被加载到相同或单独的内存空间，然后控制并分配硬件，控制输入/输出操作、软件请求和处理。在赫尔辛基大学期间期间，Linus
    正在创建一个非操作系统特有的程序，以便他可以使用当时带有处理器的他的新 PC。他当时使用 `GNU C 编译器` 和其他工具，并在 `MINIX` 上继续开发（尽管架构从微内核变成了单体内核）。得益于
    Linus 和他与 GNU 的关系，Linux 作为一个可用的操作系统诞生了，Richard 的免费开源梦想变成了现实。Linux 是一个类 Unix 操作系统。我们也可以说它在某种程度上是
    Unix 的克隆。Linux 基本上由内核、`GNU`、X-Windows GUI 和图形桌面系统组成。它还包含了其他应用程序和工具。


    ### 内核的作用

    由于我们从内核介绍开始，让我们看看更多技术细节。这将有助于你理解 Linux 的某些重要方面，以及其他操作系统。


