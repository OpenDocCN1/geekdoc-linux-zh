    ```bash

    (sleep 10; echo $BASH_SUBSHELL; sleep 10) &

    ```![](img/rsrc339.jpg)一旦处理完第一个，你必须再次按一次回车键。![](img/rsrc33D.jpg)现在，第二个进程的状态变得可见了。


    ### 使用协进程 (Co-processes)

    协处理是一种同时启动子 shell 并执行命令的技术。在这里要使用的命令是 `coproc`。

    示例：让进程进入睡眠并观察其行为。

    命令：

    ```bash

    coproc sleep 10

    ```![](img/rsrc33N.jpg)


    ### 内部和外部命令

    在 Linux 环境中，命令有两种类型：内部命令和外部命令。


    #### 外部命令

    这些不是内置 shell 命令。这些命令（又文件文件命令）存在于 shell 之外。它们实际上是程序或工具。因此，这些程序可以位于 `/bin`、`/sbin`、`/usr/bin`
    或 `/usr/sbin` 等目录。外部命令的主要区别在于它需要创建一个（在 Linux 术语中称为 fork）子进程来执行。


    #### 内部命令

    这些是内置的 shell 命令。内部命令不需要创建子进程。要识别命令的类型及其所在位置，我们可以使用以下命令。例如：


    ```bash

    which ps

    type -a ps

    ```![](img/rsrc343.jpg)让我们通过执行以下命令找到更多关于 `/bin/ps` 的信息：


    ```bash

    ls -l /bin/ps

    ```![](img/rsrc348.jpg)现在根据信息，`ps` 是一个外部命令。那么什么是内部命令呢？像 `echo` 这样的命令就是内部命令。`echo`
    命令简单地将内容回显。要查看选项列表，请参见 `man echo`![](img/rsrc34E.jpg)如你所见，`echo` 不返回任何子进程。内部命令的完整列表可以在
    [`manpages.ubuntu.com/manpages/xenial/man7/bash-builtins.7.html`](http://manpages.ubuntu.com/manpages/xenial/man7/bash-builtins.7.html)
    获取。控制进程时还有其他几个命令。在书中，我们不会从系统管理员的角度来看 `ps` 命令。让我们看看其他的：


    - `bg`: 将进程发送到后台（恢复停止的进程）。![](img/rsrc34P.jpg)

    - `fg`: 将进程从后台恢复到前台。![](img/rsrc34V.jpg)


    这里 `sleep` 进程在子 shell 中创建，然后停止。一旦它停止，就使用 `fg` 命令将其带回前台。


    - `bg`: 将进程发送到后台。

    - `fg`: 将进程从后台恢复到前台。

    - `wait`: 挂起脚本直到作业完成。

    - `disown`: 将作业从 shell 中移除。

    - `stop`: 挂起进程。

    - `kill`: 杀死进程。


