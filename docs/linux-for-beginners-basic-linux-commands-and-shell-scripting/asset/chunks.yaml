    \ be able to execute any other commands as root.![](rsrc18A.jpg)![](rsrc18F.jpg)Switching\
    \ UsersNow that you have created the user and assigned permissions, and if the\
    \ save was successful after editing the file, it is time to switch to this user\
    \ and perform some tests. To do so, use the su command to switch to that account.\
    \ As you now understand, you do not have to stick to a superuser account. You\
    \ can switch back and forth instead. This will enforce security as well.In addition,\
    \ the -l option can be used to provide an environment like what the user would\
    \ expect if he/she had directly logged in.Execute the following command (example).su-\
    \ l helpdeskMore Advanced CommandsLet’s learn the process of adding a new user.\
    \ The theory will be important for the sake of administration. When a new user\
    \ is added to the system, the following events and actions occur.-         His/her\
    \ home directory is created (under /home directory)-        The following files\
    \ (hidden files) will be copies to the user’s home directory. These are used to\
    \ provide the required environment variables.\n\n*   .bash_logout\n\n*   .bash_profile\n\
    \n*   .bashrc"
