    \ : Not equals operator.\n\nWe can also use string comparisons in a similar method.\
    \ The operators are as follows:\n- `str1 = str2` : Matches 2 strings for equality.\n\
    - `str1 != str2` : Matches for inequality.\n- `str1 > str2` : Greater than operator.\n\
    - `str1 < str2` : Less than operator.\n- `-z str1` : Checks for 0 length.\n- `-n\
    \ str1` : Checks for a length more than0.\n\nLet’s also look at the file comparison\
    \ operators.\n\n### File comparison operators\n\n| Operator | Description |\n\
    | :--- | :--- |\n| `FILE1 -ef FILE2` | `FILE1` and `FILE2` have the same device\
    \ and inode numbers |\n| `FILE1 -nt FILE2` | `FILE1` is newer (modification date)\
