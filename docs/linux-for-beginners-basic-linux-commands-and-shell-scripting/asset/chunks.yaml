    and create multiple users. When creating users, you must access files, check whether
    the user exists, or not and iterate until the end of the file.We will have the
    following fields in the file.username,fnHere, fn stands for full name.As you already
    noticed, comma separated file is not align with the default field separators.
    In this case, we need to use our own separator.IFS=’,’In addition, we will use
    the read command to perform the reading from the file.#!/bin/bashinp="/home/jan/Desktop/users"while
    IFS='','' read -r uid fndoecho "adding $uid"useradd -c "$fn" -m $uiddone < $inp![](rsrc4A6.jpg)CHAPTER
    9: Introduction to FunctionsIn this chapter you will learn​ What functions are​
    Parameters and options​ getopt(s)​ Writing functions​ Handling functions (exit
    status, arguments, variables and arrays)​ GAWK basicsBefore going into functions,
    some important topics will be discussed in this section starting with handling
    user input. Handling user input is essential in actual scenarios. Interactive
    scripts are useful when it requires to handle data and input from the user. Linux
    offers a few command line parameters, options as well as handling direct input
    (e.g., from Keyboard).You have already come aware of how startup values are passed
    when executing a shell script. For instance, we executed ./Myscript with ./Myscript
    car value. It provided specific information for this input. This is actually an
    interactive script and it was able to handle user input.Reading a supplied parameter
    is handled by bash. There is a special variable called positional parameters .
    These parameters handle the script name and 8 other parameters so that it can
    be used with custom input values. The script name is held by $0. $1 - $9 holds
    the rest.Let’s look at a simple mathematical equation with 2 arguments.#!/bin/bashmultiplication=$[
    $1 * $2 ]echo The multiplication of $1 and $2 is $multiplication![](rsrc4B1.jpg)It
    takes $1 and $2 and perform a simple math operation.Another example :#!/bin/bashvar1=$USERecho
    Welcome $var1echo Wishing you a happy $1In this example, it takes a day for $1
    and present it to the user as a greeting.![](rsrc4BD.jpg)You must enter text within
    double quotation marks if you wish to enter more than one word when executing
    scripts. Otherwise, you will run out of parameters and a messed-up output.In the
    next example, we will be reading the script name and making decisions based on
    it. One problem exists with the $0\. It may contain more than the name of the
    script, e.g., path. There is a command to remove the path, as well as any other
    values in between. The basname command comes handy in doing so.#!/bin/bashvar1=$0var2=$(basename
    $0) #Here we remove ‘./’ and other additional stuffif [[ $var2 == "Myscript" ]]then​
    echo This is Jan’s script $var1 #Raw name​ echo This is Jan’s script without additional
    things in the name: $var2​ #This line returns the formatted name with basenameelse​
    echo This not Jan’s script but $var2fi![](rsrc4BZ.jpg)Now you know how to use
    script name as a variable. You can make decisions based on the script name. For
    instance, if a script has a name ‘who’ it can run the who command. If the name
    is addition, you could only execute the addition where the script can perform
    subtraction.When you run the scripts with parameters, you must be sure that no
    inaccurate or unexpected values are passed causing crashes. Therefore, it is the
    best practice to test the input and pass them through if-then-else decision-making
    ladder. However, this is also a cumbersome task. Therefore, we could use some
    special parameters to assist.Counting ParametersThere is a special variable for
    counting the number of parameters entered. It is$# . This variable counts the
    number of parameters entered upon executing the script. Let’s look at the following
    example.#!/bin/bashvar1=$#echo Number of arguments supplied $var1![](rsrc4CC.jpg)Another
    example : Calculating factorial if and only if the number of parameters equals
    to one.#!/bin/bashvar1=$#num=$1if [ $var1 -eq 1 ]then​ fact=1​ while [ $num -gt
    1 ]​ do​ fact=$((fact * num))​ num=$((num - 1))​ done​ echo $factelse​ echo "Script
    usage: ./Myscript argument. Example: ./Myscript 5"fi![](rsrc4D0.jpg)There are
    two other unique variables providing a way to obtain the last parameter and script
    name used. These are:-         $#-         {!S#}Let’s run the following script
    and obtain the output.#!/bin/bashecho $#echo ${!#}![](rsrc4DF.jpg)To access all
    the parameters there are two more variables,-         $*-         $@These two
    variables provide access to all the parameters in two different ways.-        
    $* variable provides access to all the parameters as a single line.-         $@
    variables provides access to all the parameters individually.This can be explained
    by using a for loop.#!/bin/bashcount=1for params in "$*"do​ echo "Variabe \$*
    Parameter #$count = $params"​ count=$[ $count + 1 ]doneechocount=1for params in
    "$@"do​ echo "Variable \$@ Parameter #$count = $params"​ count=$[ $count + 1 ]done![](rsrc4E8.jpg)Shifting
    ThingsThe shift command is another useful command. It shifts the current positional
    parameters left n time. This n = 1 by default.Syntax : shift [n]In the next example,
    let’s try to shift the provided values#!/bin/bashshift 0echo Param 0: $0echo Param
    1: $1echo Param 2: $2echo Param 3: $3echo Param 4: $4![](rsrc4EP.jpg)Now let’s
    start shifting them.#!/bin/bashshift 1echo Param 0: $0echo Param 1: $1echo Param
    2: $2echo Param 3: $3echo Param 4: $4![](rsrc4F2.jpg)Although the $0 has no change,
    the other values have been shifted. Let’s use a for loop this time.#!/bin/bashfor
    (( i = 0; i <= 4; i++ ));doecho Shifting $i:echo 1: $1echo 2: $2echo 3: $3echo
    4: $4shiftdone![](rsrc4FG.jpg)In this output, you can see how the provided values
    are getting shifted during the 5 iterations. If we provide 4 values, the entire
    values will be shifted without any number remaining.We can use this shifting to
    do things like traversing folders. A practical example will be removal of files
    in a specific directory or directories older than 365 days.Moving with OptionsIn
    the previous lesson we learned about passing arguments or parameters with the
    execution. We can also pass options. These options can be used to take decisions
    based on the provided options.Let’s take a look at an example.#!/bin/bashwhile
    [ -n "$1" ]do​ case "$1" in​ -x) echo "Found a valid option -x" ;;​ -y) echo "Found
    a valid option -y" ;;​ -z) echo "Found a valid option -z" ;;​ *) echo "$1 is not
    a valid option" ;;​ esac​ shiftdone![](rsrc4G4.jpg)If we combine the examples
    for finding parameters and options, we can obtain both successfully.#!/bin/bashwhile
    [ -n "$1" ]do​ case "$1" in​ -x) echo "Found a valid option -x" ;;​ -y) echo "Found
    a valid option -y" ;;​ -z) echo "Found a valid option -z" ;;​ *) echo "$1 is not
    a valid option" ;;​ esac​ shiftcount=1for params in "$@"do​ echo "Variabe \$@
    Parameter #$count = $params"​ count=$[ $count + 1 ]doneechodoneUsing getopt and
    getopts CommandsThese two commands are used to parse or break the options provided
    through the command line.Syntax of getopt: getopts optstring name [argument]...There
    are few things to note before we get into the actual use of getopt.-         optstring:
    Defines valid option letters used in the CLI.-         This also defines which
    of these letters require a parameter value.-        Either ‘+’ or ‘-‘ must be
    used when providing options. As soon as we provide the number of options or an
    option with no + or – then the command ends processing the list.To use this, we
    have to follow some rules. When you supply a list of options, you must use colons
    to notify an option has one or more parameters.Let’s take a look at an example.
    Here, we define the input pattern asgetopt ab:c:dThis means we are going to provide
    an option -a (or +a), then an option -b with a parameter (i.e. -b param1), then
    -c (e.g., -c param2 param3) and -d.![](rsrc4H6.jpg)As you see at the end of -d
    it stops processing the options.You must have seen the param1 and param2 are experiencing
    an issue. When the parameters have spaces between it, there is a problem. However,
    if we ignore it for now, we can do some more experiments.![](rsrc4HB.jpg)Also,
    note that -ab is treated as -a -b (is fine in this example). The first example
    is the normal operation. In the second, we do not provide a -d and it terminates
    the line at param3\. In the second, it is terminated at param1 as c has lost its
    ‘-‘. Finally, we provide an additional option and it was rejected successfully.There
    are some options with getopt itself.![](rsrc4HG.jpg)Example : Parsing Options
    with getoptSource: [https://gist.github.com/cosimo/3760587](https://gist.github.com/cosimo/3760587)(with
    extra clarify and output)#!/bin/bashARGS=`getopt -o vhns: --long verbose,dry-run,help,stack-size:
    -n ''parse-options'' -- "$@"`#Parse parameters and store normalized strings in
    $ARGS. We are using getopt options -o, --long, and -n for error reportingif [
    $? != 0 ] ; then echo "Failed parsing options." >&2 ; exit 1 ; fi#If the command
    has not exited with 0 = errorecho "$ARGS"#Echoes the provided options and parameter
    if anyeval set -- "$ARGS"#Set parameters to pre-processed string $ARGSVERBOSE=falseHELP=falseDRY_RUN=falseSTACK_SIZE=0while
    true; docase "$1" in-v | --verbose ) VERBOSE=true; shift ;;-h | --help )    HELP=true;
    shift ;;-n | --dry-run ) DRY_RUN=true; shift ;;-s | --stack-size ) STACK_SIZE="$2";
    shift; shift ;;-- ) shift; break ;;* ) break ;;esacdoneecho VERBOSE=$VERBOSEecho
    HELP=$HELPecho DRY_RUN=$DRY_RUNecho STACK_SIZE=$STACK_SIZE![](rsrc4JJ.jpg)The
    outputs of this screenshot are as follows.'
