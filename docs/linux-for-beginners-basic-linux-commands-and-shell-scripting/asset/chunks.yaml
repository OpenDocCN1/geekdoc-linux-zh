    ### 4. Now we will use the relative path to make things easier and less time-consuming.
    In this case, we can use the `/`.


    ![](rsrc21A.jpg)

    Here, the `dir` command lists directories under my current folder. I could jump
    to desktop folder using the command `cd Desktop`.


    There are 2 special characters when it comes to directory traversal. Those are
    `.` and `..`. Single dot represents the current directory. Double dots represent
    the upper folder.


    ### 5. To go back to one level up, use the `..` for instance


    ![](rsrc21M.jpg)


    ### 6. You can also use `..` to skip typing folder paths. For instance,


    ### 7. You can go back one level and go forward. Here, you go up to the home folder
    and then go forward (down) to the Music folder.


    ![](rsrc21X.jpg)


    ### 8. You can do the `../` in a chain to go to a folder in an upper level, back
    and forth using absolute path (mixing relative and absolute paths).


    ![](rsrc223.jpg)


    ## Listing Files

    We use `ls` command to list files. This is one of the most popular commands among
    Linux users. Below is a list of `ls` commands and their use.


    | command | Description |

    | :--- | :--- |

    | `ls -a` | List all files including all the hidden files starting with `.` |

    | `ls --color` | Colored list `[=always/never/auto]` |

    | `ls -d` | List the directories with `*/` |

    | `ls -F` | Append indicator to entries (such as one of `*/=>@&#124;`) |

    | `ls -i` | Lists the inode index |

    | `ls -l` | List with long format including permissions |

    | `ls -la` | Same as above with hidden files |

    | `ls -lh` | The long list with human readable format |

    | `ls -ls` | The long list with file size |

    | `ls -r` | Long list in reverse |

    | `ls -R` | List recursively (the directory tree) |

    | `ls -s` | List file size |

    | `ls -S` | List by size |

    | `ls -t` | Sort by date/time |

    | `ls -X` | Sort by extension name |


    Let’s examine a few commands. Remember, you can use more than one argument. E.g.,
    `ls -la`


    Syntax:

    ```

    ls [option ...] [file]...

    ```


    Detailed syntax:

    ```

    ls [-a | --all] [-A | --almost-all] [--author] [-b | --escape][--block-size=size]
    [-B | --ignore-backups] [-c] [-C] [--color[=when]][-d | --directory] [-D | --dired]
    [-f] [-F | --classify] [--file-type][--format=word] [--full-time] [-g] [--group-directories-first][-G
    | --no-group] [-h | --human-readable] [--si][-H | --dereference-command-line]
    [--dereference-command-line-symlink-to-dir] [--hide=pattern] [--indicator-style=word]
    [-i | --inode][-I | --ignore=pattern] [-k | --kibibytes] [-l] [-L | --dereference][-m]
    [-n | --numeric-uid-gid] [-N | --literal] [-o][-p | --indicator-style=slash] [-q
    | --hide-control-chars][--show-control-chars] [-Q | --quote-name] [--quoting-style=word][-r
    | --reverse] [-R | --recursive] [-s | --size] [-S] [--sort=word][--time=word]
    [--time-style=style] [-t] [-T | --tabsize=cols][-u] [-U] [-v] [-w | --width=cols]
    [-x] [-X] [-Z | --context] [-1]

    ```


    Example:

    ```

    ls -l setup.py

    ```

    ![](rsrc25S.jpg)

    This gives long list style details for this specific file.


    More examples:

    - Lists content of your home directory: `ls`

    - Lists content of your parent directory: `ls */`

    - Displays directories of the current directory: `ls -d */`

    - Lists the content of root: `ls /`

    - Lists the files with the following extensions: `ls *.{htm,sh,py}`

    - Lists the details of a file. If not found suppress the errors: `ls -myfile.txt
    2>/dev/null`


    A word on `/dev/null/dev/null` is an important location. This is actually a special
    file called the `null device`. There are other names, such as `blackhole` or `bit-bucket`.
    When something is written to this file, it immediately discards it and returns
    end-of-file (EOF).


    When a process or a command returns an error `STDERR` or the standard error is
    the default file descriptor a process can write into. These errors will be displayed
    on screen. If someone wants to suppress it, that is where the null device becomes
    handy. We often write this command line as `/dev/null 2>&1`.


    What does it mean by `2` and `$1`? The file descriptors for Standard Input (stdin)
    is `0`. For Standard Output (stdout), it is `1`. For Standard Error (stderr) it
    is `2`. Here, we are suppressing the error generated by the `ls` command. It is
    redirected to stdout and then writing it to the `/dev/null` thus discarding it.


    ## Color Codes

    ![](rsrc26A.jpg)

    Image: ls color codes These color codes distinguish the file types quite well
    (you can find the script source at [https://askubuntu.com/questions/17299/what-do-the-different-colors-mean-in-ls](https://askubuntu.com/questions/17299/what-do-the-different-colors-mean-in-ls)).


    Let’s run `ls -lasSt`

    ![](rsrc26G.jpg)

    This uses a long list format, displays all files, sorts by time. Now, you need
    to understand what these values are:


    1. `4`: File size (sorted by size).

    2. In the next section `d` is for directory.

    3. The next few characters represent permissions (`r-read`, `w-write`, `x-execute`).

    4. Number of hard links.

    5. File owner.

    6. File owner’s group.

    7. Byte size.

    8. Last modified time (sort by).

    9. File/Directory name.

