- fmt: "\n# Adding a User Through the Command Line\n\nIt is easier to manage users\
    \ and groups through Linux command line. In this section, we will look into the\
    \ techniques and examples.\n\n## User and Group Management in Linux\n\nLinux is\
    \ a multi-user platform. Most of the time in an enterprise environment or even\
    \ in a SOHO environment, it is shared among multiple users. Some users and organizations\
    \ used to share single account among several users. This is a dangerous practice\
    \ in terms of security and availability. Therefore, the recommended best-practice\
    \ is the creation of multiple accounts and distribute the permissions accordingly.\
    \ In a Linux system, if there is a need for sharing files or directories, user\
    \ and group management tools are more than capable.\n\n### Root or Superuser Privileges\n\
    \nAdding a new user involves administering an account other than your own, which\
    \ requires superuser (AKA `root`) privileges. The same applies to other user or\
    \ group management tasks, such as deleting an account, updating accounts, and\
    \ creating and removing groups.\n\nUser managements tasks are the responsibility\
    \ of the root user or the superuser as with any other operating system. This includes\
    \ user as well as group management tasks. Since the account management requires\
    \ security and safeguards, it is a must.\n\nThe user management tasks are carried\
    \ out using the following commands:\n\n- `su`: Switch user.\n- `sudo`: Executes\
    \ the commands with elevated privileges as the root user.\n- `adduser`: Adds a\
    \ user to a Linux system.\n- `userdel`: Deletes a user account with or without\
    \ user’s files.\n- `addgroup`: Adds a group.\n- `delgroup`: Removes a group.\n\
    - `usermod`: This command can be used to modify users after adding.\n- `chage`:\
    \ This command can change the age of an account (change age). In other words,\
    \ it is used to change the account expiry.\n\n### Files Involved\n\n- `/etc/passwd`:\
    \ Holds user information.\n- `/etc/shadow`: Password encryption.\n- `/etc/sudoers`:\
    \ Neither a user can perform administrative tasks nor provide administrative delegations\
    \ if the user is not enlisted in this file. We have gone through the steps and\
    \ modified this file in a recent section in this chapter.\n- `/etc/group`: This\
    \ file holds all the group information.\n\nSuperuser is the all-powerful account\
    \ with all the permissions to perform anything and everything. It is the alpha\
    \ and omega. The root user can be configured after installing the operating system.\
    \ By default, on Ubuntu, the system installer becomes a super user too. This isn’t\
    \ true for each and every Linux flavor.\n\nHow do we know if `sudo` is usable?\
    \ Yes, it has to be installed and configured. Let’s use the following command\
    \ to verify it.\n\nCommand: `which sudo`\n\nThe command verifies and confirms\
    \ the existence of `sudo`. If it does not on any occasion, use the following command\
    \ to install it:\n`apt-get install sudo`\n\n## Adding a New User Account\n\nTo\
    \ get some hands-on experience, let’s create a user named `Test2` using Ubuntu.\
    \ It is always better if you change your user to the root user by using the `su-`\
    \ command.\n\n```\nsudo adduser test2\n```\n\nAlternatively, switch to root first\
    \ and then execute:\n\n```\nadd user test2\n```\n\nYou will be prompted to enter\
    \ a password twice. Then it will be stored in the `/etc/passwd` file. In this\
    \ file, colons are used as field separators. Upon creating users, it is possible\
    \ to provide other information (e.g.full name). Some are optional (phone number,\
    \ etc.).\n\nWhen creating a user, a primary group is created using the same username\
    \ of the user. The user is assigned to this group by default.\n\n### Sudoers -\
    \ What is Is\n\nThe sudoers file was introduced earlier in this chapter. In order\
    \ to delegate administrative tasks, it must be granted permission. This is achieved\
    \ through adding newly created users to the `/etc/sudoers` file. In this section,\
    \ the newly created user will be added to the sudoers file so that the user can\
    \ be granted additional permissions to perform certain tasks.\n\n1. Open `/etc/sudoers`\
    \ file using `sudo visudo` command. In order to safeguard this file, do not open\
    \ it using other editors. It is also better to use the root account by switching\
    \ to it. It can make things secure and less painful. By opening this through `visudo`\
    \ you ensure the following:\n    a. Other users cannot edit the file simultaneously.\n\
    \    b. The syntax is verified before exiting.\n2. In the `/etc/sudoers` add a\
    \ new entry for the new user account.\n\nFor instance, assume that you want you\
    \ provide superuser permissions for `Test2`. To accomplish the task, add the following\
    \ line at the bottom of `/etc/sudoers`:\n\n`test2 ALL=(ALL) ALL`\n\nThis line\
    \ has the format `A B = (C:D) E`. Let's refresh our memories about the content\
    \ of this again:\n- `A` represents the username.\n- `B` represents the current\
    \ host or all hosts in a networked environment.\n- `C:D` represents the user and\
    \ the group.\n- `E` indicates the commands this user is allowed to execute.\n\n\
    ## Creating Command Aliases\n\nIt is not advisable to directly provide permissions\
    \ to users as we did before. There is an alternative and more granular approach.\
    \ For instance, it is possible to allow a set of commands and apply it to a user.\
    \ We achieve this by grouping the commands into a set. This set is called an Alias.\n\
    \nIn order to allow `helpdesk` user to only use `adduser` and `usermod`, but no\
    \ other commands, list the commands one by one (using absolute paths ) stated\
    \ below. Assume we are providing the permission for an account named `helpdesk`.\
    \ You can apply it to the `test2` or any user you prefer:\n\n`helpdesk ALL=(ALL:ALL)\
    \ /usr/sbin/adduser, /usr/sbin/usermod`\n\nAlternatively, define an alias (which\
    \ we can name as wish as long as it's all upper case, for instance, `HELDESK`).\
    \ We use uppercase letters to define aliases. This is how it is done:\n\n`Cmnd_Alias\
    \ HELDESK = /usr/sbin/adduser, /usr/sbin/usermod`\n`helpdesk ALL=(ALL:ALL) HELDESK`\n\
    \nOther than these specified here, helpdek will not be able to execute any other\
    \ commands as root.\n\n## Switching Users\n\nNow that you have created the user\
    \ and assigned permissions, and if the save was successful after editing the file,\
    \ it is time to switch to this user and perform some tests. To do so, use the\
    \ `su` command to switch to that account. As you now understand, you do not have\
    \ to stick to a superuser account. You can switch back and forth instead. This\
    \ will enforce security as well.\n\nIn addition, the `-l` option can be used to\
    \ provide an environment like what the user would expect if he/she had directly\
    \ logged in. Execute the following command:\n\n```\nsu - helpdesk\n```\n\n## More\
    \ Advanced Commands\n\nLet’s learn the process of adding a new user. The theory\
    \ will be important for the sake of administration. When a new user is added to\
    \ the system, the following events and actions occur:\n\n- His/her home directory\
    \ is created (under `/home` directory)\n- The following files (hidden files) will\
    \ be copies to the user’s home directory. These are used to provide the required\
    \ environment variables:\n    - `.bash_logout`\n    - `.bash_profile`\n    - `.bashrc`\n"
