    \ you are using a Live CD, it is already there.\n\n5.  Let’s install gparted with\
    \ the following command:\n\n    sudo apt-get install gparted\n\n6.  Format the\
    \ USB once.\n\n7.  Press Ctrl+H to show hidden files. Load the image file (mount)\
    \ to USB (copy).\n\n8.  Right click on the partition, select Manage Flags and\
    \ enable boot and lba flags.\n\nIf you want to use something else, like mkusb:\n\
    \n1.  To structure and format let’s use a utility called mkusb . First let’s obtain\
    \ it on Ubuntu (standard edition). Press enter at each line.\n\n    sudo add-apt-repository\
    \ universe\n\n    sudo add-apt-repository ppa:mkusb/ppa\n\n    sudo apt-get update\n\
    \n    sudo apt-get install mkusb\n\n2.  For ease let’s use the GUI version of\
    \ mkusb.\n\n3.  Run the tool and examine the options. You can restore the USB\
    \ to a standard storage device after the process.\n\n![](rsrcEH.jpg)Image: mkusb\
    \ utility\n\n4.  From the first option you can create a bootable device. It will\
    \ wipe the first megabyte and create the require layout.\n\nIf you would like\
    \ to use usb-creator on Ubuntu\n\n1.  To create the portable USB from the ISO\
    \ you obtained, let’s use usb-creator utility in Ubuntu. Simply mount the USB\
    \ and start this program.\n\n2.  For the source image, provide the image by browsing\
    \ to the path. This is if the image is not listed – if it is not, use the Other…\
    \ button to find it.\n\n3.  Disk to use: Select the USB stick from the list. You\
    \ can insert a DVD if you want to use a DVD instead.\n\n4.  If you use USB, select\
    \ the first bootable partition from the list. The partition should be in Fat16\
    \ or FAT32 format.\n\n5.  If you get a Dbus error, please refer [https://bugs.launchpad.net/usb-creator/+bug/458334](https://bugs.launchpad.net/usb-creator/+bug/458334)\n\
    \nWhat if your computer is utilizing UEFI?It is easier to install Ubuntu if the\
    \ BIOS mode is set to legacy. If it is a UEFI (Unified Extensible Firmware Install),\
    \ you need to setup a UEFI mode boot device. USB is the best option here.You do\
    \ not have to install Linux in UEFI mode unless there is another system installed\
    \ and you want to install in a dual-boot configuration.\n\n1.  Obtain Ubuntu 64bit\
    \ ISO. It is better to obtain version 12.10 or higher, as these versions support\
    \ secure boot technology.\n\n2.  When you create your USB stick, use Gparted,\
    \ as instructed above.\n\n3.  Access your computer’s firmware menu and disable\
    \ Quickboot/Fastboot and Intel Smart Response Technology (SRT). If you are using\
    \ a Windows 8 or higher, disable Fast Startup.\n\n4.  Set up your firmware to\
    \ boot from UEFI mode. That is all!\n\nBooting from your Live CD\n\n1.  Insert\
    \ the DVD or the USB stick and turn on the computer.\n\n2.  Select the language.\n\
    \n3.  When you are prompted with options, select “Try Ubuntu without any change\
    \ to your computer”.\n\nLinux System Requirements for Major DistributionsThe following\
    \ table lists the recommended requirements for the following Linux distributions.\
    \ There are not the minimum requirements! These are the recommended requirements.\
    \ Why are minimum requirements removed from this table? Because at present, people\
    \ use generally powerful computers with newer hardware. Having a computer with\
    \ at least 1 GB memory and at least 40-80 GB hard disk is extremely likely. Therefore,\
    \ the minimum and somewhat unrealistic requirements are not deliberately included.\
    \ If you wish to find out what those are, please refer the manufacturer’s website\
    \ or the knowledge-base.Table: Linux System Requirements for Major Distributions\n\
    \n| Linux Distribution | CPU | Memory | Hard Disk |\n\n| Red Hat Linux 7 | Intel/AMD\
    \ 64, ARM and more | 768MiB – 1.5 GiB | 10 GiB |\n\n| Cent OS 7 | I386, x86_64,\
    \ PowerPC8le, IA-32, ARMv7hl, AARch64 (arm64)1 GB logical CPU for 64bit | 1 GB\
    \ | 10-20 GB |\n\n| Mint 19.1 | 64bit recommended | 2 GB | 20 GB |\n\n| Ubuntu\
    \ 18.04.3 | 2 GHz Dual-core | 2 GB | 25 GB |\n\n| Fedora 30 | 2 GHz | 4 GB | 10-20\
    \ GB |\n\n| Debian 9 | 2 GHz | 2 GiB | 25 GiB |\n\n| MX Linux | i486 | 2 GB |\
    \ 5 GB |\n\n| Kali Linux |  |  |  |\n\nPerforming a Basic GUI Installation\n\n\
    1.  Insert the bootable media and restart the computer. If you are using a virtual\
    \ machine, simply mount the ISO file into the DC/DVD ROM and start the virtual\
    \ machine.\n\n2.  You will see the boot menu first.\n\n3.  Next, you have to decide\
    \ whether you want to try or install Ubuntu. Click Install Ubuntu .\n\n4.  Next,\
    \ select or change your keyboard layout and click continue.\n\n5.  In the next\
    \ screen you will be presenter with 4 options.\n\n    1.  Normal installation\
    \ (similar to a full feature installation).\n\n    2.  Minimum installation, which\
    \ includes browser and a minimal set of utilities. This is good for security purposes.\n\
    \n    3.  Other options: Download updates while installing Ubuntu - This option\
    \ will update your system during the installation. However, this will take more\
    \ time. You can even do this once you install the system.\n\n    4.  Other options:\
    \ Install third-party software for graphics and Wi-Fi hardware and additional\
    \ media formats – This option is important. If your computer requires additional\
    \ drivers, you can install it with this option.\n\n        ![A screenshot of a\
    \ social media post Description automatically generated](rsrcKG.jpg)Image: Ubuntu\
    \ install options\n\n6.  Next is the disk options. You will get 4 options here.\n\
    \n    1.  Erase disk and install Ubuntu: Do not ever use this option if you are\
    \ preparing for a dual-boot configuration. Otherwise, this is the best option.\n\
    \n    2.  Encrypt: You can enable encryption during the installation.\n\n7.  Use\
    \ LVM: This option enables you to utilize the Logical Volume Manager. It helps\
    \ disk management tasks, such as resizing partitions and taking\n\nsnapshots so\
    \ that you can recover the OS later![A screenshot of a cell phone Description\
    \ automatically generated](rsrcM2.jpg) .Image: Ubuntu installation type\n\n8.\
    \  If you want to keep dual-boot configuration or set up a new partition table,\
    \ click Something else . It will take you to a new screen.\n\n![A screenshot of\
    \ a cell phone Description automatically generated](rsrcMA.jpg)Image: Ubuntu partition\
    \ optionsUbuntu and Linux systems display the hard disks as files. If the disk\
    \ was an IDE, the names will be /dev/hda to /dev/hdd. For SCSi controllers, it\
    \ is /dev/sda. If there were more disks, they will be named as /dev/sda, /dev/sdb\
    \ etc. And the partitions will be /dev/sda1, /dev/sda2 etc. You can use MBR or\
    \ GPT as the partition style. The latter is the new scheme and it provides multiple\
    \ advantages over MBR. GPT or GUID partition table sets a unique GUID for each\
    \ partition, the number of partitions are virtually unlimited and it is solid\
    \ against data corruption. On EFI and UEFI systems GPT is used.\n\n9.  If you\
    \ are to create a custom partition scheme, what partitions are required and what\
    \ are the size requirements?\n\n    1.  Linux has different set of partitions\
    \ and let’s have a look at the table below.\n\nTable: Linux directories\n\n| Directory\
    \ | Purpose |"
