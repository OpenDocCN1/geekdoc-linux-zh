  trans: "\n\n| 代码 | 含义 |\n| :--- | :--- |\n| 0 | 命令成功执行 |\n| 1 | 未知错误 |\n| 2 | 命令误用\
    \ |\n| 126 | 命令无法执行 |\n| 127 | 未找到命令 |\n| 128 | |\n| 128+x | |\n| 130 | |\n| 225\
    \ | |\n\n退出状态还有一个很有趣的特性：你可以定义自己的退出码。这通过使用 `exit` 命令后跟一个你指定的数值来实现。\n\n示例：\n```bash\n\
    #!/bin/bash\nls -la Test\nexit 100\n```\n在结果末尾，当执行 `echo $?` 时，它会显示我们定义的退出码。\n\
    \n另一个示例：\n```bash\n#!/bin/bash\nls -la Test\necho $?\nexit 100\n```\n如果你观察退出码，可以识别出一个范围（0\
    \ – 255）。这是因为 shell 使用了一种名为“取模运算”的方法来计算退出码。它将错误值除以 256，并使用余数作为退出码。\n\n## 结构化命令\n\
    \n到目前为止我们学习了很多命令以及如何构建基础脚本。你也可以使用 `man` 命令或 `--help` 选项来学习关于命令和其他特性的知识。\n\n对于脚本编写，如果你是一个程序员甚至是一个新手，你必须应用一些条件。否则，当我们为了应用可能需要复杂逻辑的现实场景构建脚本时，我们就无法构建命令结构来获取逻辑输出。为了解决这个问题，脚本可以像其他编程语言一样利用\
    \ `if-then-else` 和 `for` 等结构化命令。这些被称为条件或逻辑结构。在本节中，我们将深入学习结构化命令。让我们先从一个简单的开始。\n\
    \n### if-then-fi 和 if-then-else-fi\n\n在任何编程语言和逻辑中，`if-then` 逻辑都是最基本的。你可以在脚本中使用同样的方法。以下是它的用法：\n\
    \n```bash\nif [expression];then\n    # 如果 'expression' 为真，则执行代码\nfi\n```\n\n示例：\n\
    ```bash\n#!/bin/bash\nif grep APR --color File3.txt\nthen\n    echo \"APR is found\
    \ in the file\"\nelse\n    echo \"APR is not found\"\nfi\n```\n\n然而，如果无法进行比较，这种方法就是无效的。例如，如果你想比较多个情况（例如\
    \ APR、MAY、JUN 等）并进行一些逻辑操作，你将需要一种技术来实现。这时 `test` 功能就派上用场了。\n\n```bash\nif test\
    \ conditionthen\n    commands\nfi\n```\n\n在不使用 `test` 单词的情况下，我们可以直接使用方括号。这样做时，必须注意以下几点：\n\
    - 你必须在最左边的括号处留空格。\n- 你必须在最右边的括号处留空格。\n\n测试条件可以比较数值、字符串和文件。让我们也学习一下运算符以及如何使用它们：\n\
    - `eq` : 等于运算符，用于比较两个值。\n- `le` : 小于或等于运算符。\n- `lt` : 小于运算符。\n- `ge` : 大于或等于运算符。\n\
    - `gt` : 大于运算符。\n- `ne` : 不等于运算符。\n\n我们也可以用类似的方法进行字符串比较。运算符如下：\n- `str1 = str2`\
    \ : 匹配两个字符串是否相等。\n- `str1 != str2` : 匹配不相等。\n- `str1 > str2` : 大于运算符。\n- `str1\
    \ < str2` : 小于运算符。\n- `-z str1` : 检查长度是否为 0。\n- `-n str1` : 检查长度是否大于 0。\n\n让我们也来看看文件比较运算符。\n\
    \n### 文件比较运算符\n\n| 运算符 |  |\n| :--- | :--- |\n| `FILE1 -ef FILE2` | `FILE1` 和\
    \ `FILE2` 具有相同的设备号和 inode 码 |\n| `FILE1 -nt FILE2` | `FILE1` 比 `FILE2` 新（修改日期）\
    \ |\n| `FILE1 -ot FILE2` | `FILE1` 比 `FILE2` 旧 |\n| `-b FILE` | `FILE` 存在且是块设备文件\
    \ |\n| `-c FILE` | `FILE` 存在且是字符设备文件 |\n| `-d FILE` | `FILE` 存在且是一个目录 |\n| `-e\
    \ FILE` | `FILE` 存在 |\n| `-f FILE` | `FILE` 存在且是普通文件 |\n| `-g FILE` | `FILE` 存在且设置了组\
    \ ID (setgid) |\n| `-G FILE` | `FILE` 存在且属于有效组 ID |\n| `-h FILE` | `FILE` 存在且是一个符号链接（与\
    \ `-L` 相同） |\n| `-k FILE` | `FILE` 存在且设置了粘滞位 (sticky bit) |\n| `-L FILE` | `FILE`\
    \ 存在且是一个符号链接（与 `-h` 相同） |\n| `-O FILE` | `FILE` 存在且所有有效用户 ID |\n| `-p FILE` |\
    \ `FILE` 存在且是一个命名管道 |\n| `-r FILE` | `FILE` 存在且已授予读权限 |\n| `-s FILE` | `FILE`\
    \ 存在且大小大于零 |\n| `-S FILE` | `FILE` 存在且是一个套接字 |\n| `-t FD` | 文件描述符 `FD` 在终端上打开\
    \ |\n| `-u FILE` | `FILE` 存在且设置了用户 ID (setuid) |\n| `-w FILE` | `FILE` 存在且已授予写权限\
    \ |\n| `-x FILE` | `FILE` 存在且已授予执行（或搜索）权限 |\n\n"
- fmt: "\nLet’s look at some examples.\n\n### Basic Comparison\n```bash\n#!/bin/bash\n\
    T1=\"Jan\"\nT2=\"Jake\"\nif [ \"$T1\" = \"$T2\" ]; then\necho true\nelse\necho\
    \ false\nfi\n```\n![](rsrc3U8.jpg)\n\nIn this example we match two strings. Using\
    \ `if` we match the commands in order to obtain whether the match is true or false.\
    \ This logic is called Boolean logic. \n\nWhat happens if we put commands before\
    \ and after the `if` statement? Well, these will not be considered as parts of\
    \ the `if` statement! They will be executed or failed accordingly outside the\
    \ statement.\n\nIn this command, we use an `else` to match the error condition.\
    \ That is if the matching results in a failure. If you remove the `else` and the\
    \ `echo false`, what will be the result?\n\nExample:\n```bash\nT1=\"Jan\"\nT2=\"\
    Jake\"\nif [ \"$T1\" = \"$T2\" ]; then\necho true\nfi\n```\n![](rsrc3UM.jpg)\n\
    \nAs you notice, there is no output. Because, it simply jumped out of the `if`\
    \ statement since the two names do not match. In this example, we use the logical\
    \ operator `=`. We could use `!=` to evaluate a mismatch instead (or `-ne`). The\
    \ `!` applies the NOT logic. In conjunction with the `EQUAL` operator, the logic\
    \ is `NOT EQUAL`. If `T1` is not equal to `T2`, then return true.\n\n```bash\n\
    if [ \"$T1\" != \"$T2\" ]; then\n```\n![](rsrc3UU.jpg)\n\nYou can specify more\
    \ actions between `if [expression]; then` and `fi`. Let’s match an exit code in\
    \ this example and add more commands in between.\n\n```bash\n#!/bin/bash\nvarx=$(ls\
    \ -l Test 2>/dev/null)\n$?\necho $varx\nif [ $varx -eq 0 ]; then\necho A match\
    \ found\necho varx?\nelse\necho \"The file/directory does not exist\"\nfi\n```\n\
    \nIn this example, we are getting an output of the `ls` command’s exit code. If\
    \ the directory exists, the exit code will be `0`. If the directory does not exist,\
    \ it will be something else (`1`). We are suppressing the error message by sending\
    \ it o `/dev/null`. At the end of the expression we request the exist code.\n\n\
    Then we are outputting the exit code by using `echo` command. Finally, we are\
    \ comparing the exit code. If it is `0`, then there is a match, and we echo `varx`\
    \ again. If the exit code does not match, then `else` is true and the other message\
    \ will be displayed (The file/directory does not exist). Why we need `else` here?\
    \ To match the false logic. In a longer form we will be using `elif` (else if)\
    \ to match cases.\n\n![](rsrc3VB.jpg)\n\nAs you see the directory existed and\
    \ the return code is `0`. Let’s remove the directory and try again.![](rsrc3VF.jpg)\n\
    Now the directory is gone, and the output is as expected.\n\n### Using Nested\
    \ If\nIn a script you may need to match more than Boolean logic. Instead, you\
    \ may have to match each and every case. For example, if you run the `ls` command,\
    \ there can be more exit codes to match and upon each code, we can take action.\
    \ This method is called nesting. Let’s look at an example.\n\n```bash\n#!/bin/bash\n\
    a=10\nb=20\nif [ $a -eq $b ]\nthen\necho “a = b”\nelif [ $a -gt $b ]\nthen\necho\
    \ “a > b”\nelif [ $a -lt $b ]\nthen\necho “a < b”\nelse\necho “None of the conditions\
    \ have met”\nfi\n```\n![](rsrc3W5.jpg)\n\nThe output is accurate and as expected.\
    \ Let’s try another example.\n\n```bash\n#!/bin/bash\nuser_name=jake\nif grep\
    \ $user_name /etc/passwd\nthen\necho \"The user $user_name found in the system.\"\
    \nelif ls -d /home/$user_name\nthen\necho \"The user $user_name not found but\
    \ a profile directory exists\"\nfi\n```\n![](rsrc3WM.jpg)\n\nLet’s delete the\
    \ user now without removing his files.![](rsrc3WS.jpg)\nNow, let’s execute the\
    \ script again.![](rsrc3WX.jpg)\nSince we have not used the `-f` option with `userdel`,\
    \ the profile folder existed. This is a useful way to find remaining files when\
    \ you delete a user. We can even extend this code by adding another case. Let’s\
    \ look at the following example. This time the home directory of jake has been\
    \ removed.\n\n```bash\n#!/bin/bash\nuser_name=jake\nif grep $user_name /etc/passwd\n\
    then\necho \"The user $user_name found in the system.\"\nelif ls -d /home/$user_name\n\
    then\necho \"The user $user_name not found but a profile directory exists\"\n\
    else\necho “The user $user_name does not exist!”\nfi\n```\n![](rsrc3XD.jpg)\n\n\
    Now, let’s look at some file comparison examples.\n\n```bash\n#!/bin/bash\nmydir=$home/jan\n\
    if [ -d mydir ]\nthen\necho “The directory $mydir exists!”\nls -l $mydir\nelse\n\
    echo “The directory $mydir does not exist”\nfi\n```\n![](rsrc3XV.jpg)\n\nLet’s\
    \ now compare the date of two files and append some text from the newer (temp)\
    \ file if the other file is older.\n\n```bash\n#!/bin/bash\nvarF=/home/jan/Desktop/File1.txt\n\
    ls -al > temp.txt\nif [ temp.txt -nt File1.txt ]\nthen\ntemp.txt >> File1.txt\n\
    echo File updated\nelse\necho The file is newer than the temporary file\nfi\n\
    ```\n![](rsrc3YA.jpg)\n\nWe can also use this method to know if you can read a\
    \ file, write to a file, update log files, and add dates to logs with other details\
    \ in real-life scenarios. Let’s try if we can verify a file exists and if we can\
    \ write to it.\n\n```bash\nfile_name=/home/jan/Desktop/myfile\nif [ -f $file_name\
    \ ] #If the file is a file and exist\nthen\nif [ -s $file_name ] #If the file\
    \ size is greater than zero\nthen\nif [ -w $file_name ]\nthen\necho \"This file\
    \ is writable\"\ndate >> $file_name\nelse\necho \"This file is not writable!\"\
    \nfi\nelse\necho \"This file is empty\"\nfi\n```\n![](rsrc3YZ.jpg)\n\nWe are testing\
    \ each branch, and this is the output when the file is there, when the file is\
    \ not writable, and finally when it is removed or does not exist.\n\n### Combining\
    \ Test Cases with Boolean Operators\nWhen you write scripts, you may need to compare\
    \ more than one test cases (complex cases) for decision making. There are two\
    \ operators `&&` and `||` representing `AND` and `OR` logic. For instance, we\
    \ could match if a file exists and if the size is zero.\n\n### Using Even More\
    \ Features\nThere are several other advanced features, such as double parentheses\
    \ and double square brackets, used for mathematical operations and advanced string\
    \ operations. We used double parentheses also to use internal operations rather\
    \ than letting the single parenthesis to spawn subshells. There are several symbols\
    \ you need to understand before you proceed. Table 8.3: Logical operators\n\n\
    | Symbol | Description |\n| :--- | :--- |\n| ! | Logical negation |\n| ~ | Bitwise\
    \ negation |\n| & | Bitwise AND |\n| && | Logical AND |\n| \\| | Bitwise OR |\n\
    | \\| | Logical OR |\n| ** | Exponentiation |\n| --val | Pre-decrement |\n| val--\
    \ | Post-decrement |\n| ++val | Pre-increment |\n| val++ | Post-increment |\n\
    | << | Bitwise-shift (Left) |\n| >> | Bitwise-shift (Right) |\n"
