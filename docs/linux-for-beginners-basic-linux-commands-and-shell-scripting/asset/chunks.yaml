- fmt: "\n1. Download Ubuntu from [http://www.ubuntu.com/getubuntu/download](http://www.ubuntu.com/getubuntu/download)\n\
    \n2. In a Windows or a Linux platform, burn the ISO image to a DVD.\n\n3. Boot\
    \ from the DVD and select “Try Ubuntu”.\n\nIf you want to create a USB there are\
    \ instructions. The steps also provide the guide to set up a DVD in step 13).\
    \ If you do not have an operating system installed, you have to boot into “Try\
    \ without installing”. Then you can use the `Gparted` partition tool, for instance,\
    \ if you want to create a USB stick to boot a computer.\n\n1. You need to use\
    \ a USB with 4 GB capacity. Remember that your USB will be erased during the set\
    \ up. If the USB stick is a USB 3.0 it will be faster. \n\n2. The USB stick must\
    \ support booting. There may be some sticks with problems. This must be verified\
    \ before selecting a USB.\n\n3. If you are on Windows, you can use a software,\
    \ such as `Rufus`, to prepare the USB and complete the installation. Since we\
    \ are learning Linux, why don’t we do it on Linux?\n\n4. On a Linux system, let’s\
    \ use `Gparted` to create the USB stick. I am using Ubuntu to create the USB.\
    \ If you are using a Live CD, it is already there.\n\n5. Let’s install `gparted`\
    \ with the following command:\n\n```\nsudo apt-get install gparted\n```\n\n6.\
    \ Format the USB once.\n\n7. Press `Ctrl+H` to show hidden files. Load the image\
    \ file (mount) to USB (copy).\n\n8. Right click on the partition, select `Manage\
    \ Flags` and enable `boot` and `lba` flags.\n\nIf you want to use something else,\
    \ like `mkusb`:\n\n1. To structure and format let’s use a utility called `mkusb`.\
    \ First let’s obtain it on Ubuntu (standard edition). Press enter at each line.\n\
    \n```bash\nsudo add-apt-repository universe\nsudo add-apt-repository ppa:mkusb/ppa\n\
    sudo apt-get update\nsudo apt-get install mkusb\n```\n\n2. For ease let’s use\
    \ the GUI version of `mkusb`.\n\n3. Run the tool and examine the options. You\
    \ can restore the USB to a standard storage device after the process.\n\n![](rsrcEH.jpg)Image:\
    \ mkusb utility\n\n4. From the first option you can create a bootable device.\
    \ It will wipe the first megabyte and create the require layout.\n\n### If you\
    \ would like to use `usb-creator` on Ubuntu\n\n1. To create the portable USB from\
    \ the ISO you obtained, let’s use `usb-creator` utility in Ubuntu. Simply mount\
    \ the USB and start this program.\n\n2. For the source image, provide the image\
    \ by browsing to the path. This is if the image is not listed – if it is not,\
    \ use the `Other…` button to find it.\n\n3. Disk to use: Select the USB stick\
    \ from the list. You can insert a DVD if you want to use a DVD instead.\n\n4.\
    \ If you use USB, select the first bootable partition from the list. The partition\
    \ should be in `Fat16` or `FAT32` format.\n\n5. If you get a `Dbus` error, please\
    \ refer [https://bugs.launchpad.net/usb-creator/+bug/458334](https://bugs.launchpad.net/usb-creator/+bug/458334)\n\
    \n### What if your computer is utilizing UEFI?\n\nIt is easier to install Ubuntu\
    \ if the BIOS mode is set to legacy. If it is a UEFI (Unified Extensible Firmware\
    \ Install), you need to setup a UEFI mode boot device. USB is the best option\
    \ here. You do not have to install Linux in UEFI mode unless there is another\
    \ system installed and you want to install in a dual-boot configuration.\n\n1.\
    \ Obtain Ubuntu 64bit ISO. It is better to obtain version 12.10 or higher, as\
    \ these versions support secure boot technology.\n\n2. When you create your USB\
    \ stick, use `Gparted`, as instructed above.\n\n3. Access your computer’s firmware\
    \ menu and disable `Quickboot/Fastboot` and `Intel Smart Response Technology (SRT)`.\
    \ If you are using a Windows 8 or higher, disable `Fast Startup`.\n\n4. Set up\
    \ your firmware to boot from UEFI mode. That is all!\n\n### Booting from your\
    \ Live CD\n\n1. Insert the DVD or the USB stick and turn on the computer.\n\n\
    2. Select the language.\n\n3. When you are prompted with options, select “Try\
    \ Ubuntu without any change to your computer”.\n\n### Linux System Requirements\
    \ for Major Distributions\n\nThe following table lists the recommended requirements\
    \ for the following Linux distributions. There are not the minimum requirements!\
    \ These are the recommended requirements. Why are minimum requirements removed\
    \ from this table? Because at present, people use generally powerful computers\
    \ with newer hardware. Having a computer with at least 1 GB memory and at least\
    \ 40-80 GB hard disk is extremely likely. Therefore, the minimum and somewhat\
    \ unrealistic requirements are not deliberately included. If you wish to find\
    \ out what those are, please refer the manufacturer’s website or the knowledge-base.\n\
    \nTable: Linux System Requirements for Major Distributions\n\n| Linux Distribution\
    \ | CPU | Memory | Hard Disk |\n| :--- | :--- | :--- | :--- |\n| Red Hat Linux\
    \ 7 | Intel/AMD 64, ARM and more | 768MiB – 1.5 GiB | 10 GiB |\n| Cent OS 7 |\
    \ I386, x86_64, PowerPC8le, IA-32, ARMv7hl, AARch64 (arm64) | 1 GB logical CPU\
    \ for 64bit | 1 GB | 10-20 GB |\n| Mint 19 | 64bit recommended | | | 20 GB |\n\
    | Ubuntu 18.04.3 | 2 GHz | 2 GB | 25 GB |\n| Fedora 30 | Dual-core | 4 GB | 10\
    \ GB |\n| Debian 9 | 2 GHz | 2 GiB | 25 GB |\n| MX Linux | i486 | | | 5 GB |\n\
    | Kali Linux | | | |\n\n### Performing a Basic GUI Installation\n\n1. Insert the\
    \ bootable media and restart the computer. You will see the boot menu. Next, you\
    \ have to decide whether you want to try or install Ubuntu. Next, select your\
    \ keyboard layout and continue.\n\n2. In the next screen you will be with 4 options:\n\
    \n    - Normal installation (similar to a full feature).\n    - Minimum installation,\
    \ which includes a minimal set of utilities. This is good for security.\n    -\
    \ Other options: Download updates while installing – This option will update your\
    \ system. However, this will take more time.\n    - Other options: Install third-party\
    \ software for graphics and Wi-Fi hardware and additional formats – This option\
    \ is important. If your computer requires additional drivers, you can install\
    \ it.\n\n3. Next is the disk options. You will get 4 options:\n\n    - Erase disk\
    \ and install Ubuntu: Do not ever use this option if you are preparing for a dual-boot\
    \ configuration. Otherwise, this is the best option.\n    - Encrypt: You can enable\
    \ encryption during the installation.\n    - Use LVM: This option enables you\
    \ to utilize the Logical Volume Manager. It helps disk management tasks, such\
    \ as resizing partitions and taking snapshots so that you can recover the OS.\n\
    \    - If you want to keep dual-boot configuration or set up a new partition table,\
    \ click `Something Else`.\n\n4. Install Ubuntu\n\nUbuntu and Linux systems display\
    \ the hard disks as files. If the disk was an IDE, the names will be `/dev/hda`\
    \ to `/dev/hdd`. For SCSi controllers, it is `/dev/sda`. If there were more disks,\
    \ they will be named as `/dev/sda`, `/dev/sdb` etc. And the partitions will be\
    \ `/dev/sda1`, `/dev/sda2` etc. You can use `MBR` or `GPT` as the partition style.\
    \ The latter is the new scheme and it provides multiple advantages over `MBR`.\
    \ `GPT` or GUID partition table sets a unique GUID for each partition, the number\
    \ of partitions are virtually unlimited and it is solid against data corruption.\
    \ On EFI and UEFI systems `GPT` is used.\n\nIf you are to create a custom partition\
    \ scheme, what partitions are required and what are the size requirements?\n\n\
    1. Linux has different set of partitions and let’s have a look at the table below.\n\
    \nTable: Linux directories\n\n| Directory | Purpose |\n| :--- | :--- |\n"
