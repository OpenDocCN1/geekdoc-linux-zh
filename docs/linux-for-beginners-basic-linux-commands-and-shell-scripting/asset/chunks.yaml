    GUIPlease follow these steps in order to add a user through Ubuntu GUI.


    1.  Open the Account Settings dialog, either through Ubuntu Dashboard ,or by clicking
    the down-arrow located at the upper right-hand corner on your Ubuntu screen.


    ![](rsrc14B.jpg)Image: Ubuntu user account


    2.  Next, click your username and then select Account Settings as follows.


    ![](rsrc14J.jpg)Image: Ubuntu account settings


    3.  The following Users dialog will open.


    ![](rsrc14S.jpg)Image: Ubuntu main user account![](rsrc14X.jpg)


    4.  Click the Unlock button located at the upper right-hand corner of the Users
    dialog. The following Authentication dialog will open for you to provide authentication
    information as an administrator because only this way you will be able to create
    or edit user accounts:


    ![](rsrc154.jpg)Image: Authentication request


    5.  Next, provide your password and then click the Authenticate button. You will
    now be able to see that all the fields in the Users dialog are enabled for you.


    6.  Click the Add User button. The Add User dialog will open for you to enter
    details of the new user you want to create.


    7.  You can specify if you want to create a Standard or an Administrative user
    through this dialog. It is also important to know that it is not a good security
    practice to leave the password field empty for the new user. This way any user
    can log in and access private and secure data on your system. Let’s add jake as
    a new standard user.


    ![](rsrc15D.jpg)Image: Adding a new user


    8.  Click the Add button, which will only be enabled when you have provided all
    the valid information in the Add User dialog. The new user will now be created,
    and you will be able to see it in the Users dialog as follows:


    ![](rsrc15M.jpg)Image: New standard user


    9.  You can also change the group to become an Administrator, select a locale,
    to reset the password, to enable automatic login, and to view the account activity.


    10.  To remove a user, you can use the remove button at the bottom right area.'
