  trans: "\n\n1. 正常操作示例。\n2. 失败，因为缺少栈大小的值。\n3. 提供了完整的选项和参数值。\n4. 额外的参数值被拒绝。\n5. 了\
    \ `d` 作为大小（它应该检查数字）以及一个无效的 ‘-5’。\n6. 另一个包含 3 个选项和一个参数值的正常操作。\n\n如你所见，`getopt`\
    \ 存在一些问题。最常见的问题是多个参数值，以及当用空格分隔时无法将两个或多个值识别为一个整体。即使我们使用 `\"\"`，`getopt` 也无法检测出差异。\n\
    \n### getopts 救场\n\n`getopts` 有两个重要的隐式变量（环境变量）。它们是：\n- `$OPTIND`\n- `$OPTARG`\n\
    \n`$OPTIND` (OPTion INDex) 是指向标志（例如 `-a`）的参数指针。`$OPTARG` (OPTional ARGuments)\
    \ 是附加到标志上的可选参数（例如 `-a test`）。\n\n还有其他一些规则：\n- 如果字母后面跟着 `;`，则认为该选项带有参数值。\n- 如果命令以\
    \ `:` 开头。\n- 如果提供的选项没有带 `-` 或 `+`，则将停止处理。\n- 当配合此使用 `while` 命令时，不需要括号。\n\n示例：在这个示例中，我们将使用\
    \ `getopts` 从算法选择中获取文件的校验和。这是与单独运行命令的输出对比。\n\n```bash\n#!/bin/bash\nUSAGE=\"Usage=\
    \ `basename $0` options [-m filename] [-s filename] -h for help. Example: ./Myscript\
    \ -m File1.txt\"\nFILENAME_M='' #此参数通过 -m 提供\nFILENAME_S='' #此参数通过 -s 提供\nSEL=''\
    \ # 记录来自 m, s 或 h 的选择\nwhile getopts \"m:s:h\" opt; do #在 m 或 s 后面必须有一个值\n  case\
    \ \"$opt\" in\n    m)\n      FILENAME_M=\"$OPTARG\" # 赋值可选值\n      echo \"MD5\
    \ Selected\"\n      SEL=$opt # #SEL=m\n      ;;\n    s)\n      FILENAME_S=\"$OPTARG\"\
    \ # 赋值可选值\n      echo \"SHA1 Selected\"\n      SEL=$opt # #SEL=s\n      ;;\n \
    \   h)\n      echo $USAGE && exit 0\n      ;;\n  esac\ndone\nshift $(( OPTIND\
    \ - 1 ))\nif [[ $SEL == m ]] && [[ $FILENAME_M == '' ]]; then\n  # 如果未提供文件名\n\
    \  echo \"YOU MUST PROVIDE A FILE NAME!X $USAGE\" >&2\n  exit 1\nelif [[ $SEL\
    \ == m ]] && [[ $FILENAME_M != '' ]]; then\n  # 如果 m 带有文件名\n  echo -----------------------------\n\
    \  md5sum < $FILENAME_M\n  echo -----------------------------\nelif [[ $SEL ==\
    \ s ]] && [[ $FILENAME_S == '' ]]; then\n  # 如果 s 没有文件名\n  echo \"YOU MUST PROVIDE\
    \ A FILE NAME!Y $USAGE\" >&2\n  exit 1\nelif [[ $SEL == s ]] && [[ $FILENAME_S\
    \ != '' ]]; then\n  # 如果 s 带有文件名\n  echo -----------------------------\n  sha1sum\
    \ < $FILENAME_S\n  echo -----------------------------\nelse\n  echo \"Unable to\
    \ proceed: $USAGE\"\nfi\n```\n\n### 读取用户输入\n\n脚本或任何程序最重要的交互功能是获取用户输入并对其处理以创建有效且准确的输出。在\
    \ Linux 世界中，我们使用 `read` 命令读取用户输入。该命令提供了一系列全面的选项，并用于高级操作。\n\n语法：`read [-ers] [-a\
    \ array] [-d delim] [-i text] [-n nchars] [-N nchars][-p prompt] [-t timeout]\
    \ [-u fd] [name ...] [name2 ...]`\n\n表 9.1: read 命令选项\n\n| 选项 | 说明 |\n| :--- |\
    \ :--- |\n| `-a array` | 将读取的单词赋予数组变量 `ARRAY` 的顺序索引，从零开始 |\n| `-d delim` | 继续直到读取到\
    \ `DELIM` 的第一个字符，而不是换行符 |\n| `-e` | 使用 Readline 在交互式 shell 中获取行 |\n| `-i text`\
    \ | 使用 `TEXT` 作为 Readline 的初始文本 |\n| `-n nchars` | 在读取 `NCHARS` 个字符后返回，而不是等待换行符，但在遇到分隔符之前读取的字符少于\
    \ `NCHARS` 个时则遵循分隔符 |\n| `-N nchars` | 仅在恰好读取 `NCHARS` 个字符后返回，除非遇到 EOF 或读取超时，并忽略任何分隔符\
    \ |\n| `-p prompt` | 在尝试读取之前输出字符串 `PROMPT` 且不带尾换行 |\n| `-r` | 不允许反斜杠转义任何字符 |\n\
    | `-s` | 不回显来自终端的输入 |\n| `-t timeout` | 如果在 `t TIMEOUT` 秒内没有读取到完整行，则超时并返回失败。`TMOUT`\
    \ 变量的值是默认超时时间。`TIMEOUT` 可以小数。如果 `TIMEOUT` 为 0，则仅当指定的文件描述符上有可用输入时 `read` 才返回成功。如果超时，退出状态将大于\
    \ 128 |\n| `-u fd` | 从文件描述符 `FD` 而不是标准输入读取 |\n\n"
- fmt: "\nNow, let’s try some examples and learn how to use the command.\n\n```bash\n\
    #!/bin/bash\necho -n \"Enter your name: \"\nread name\necho \"Hi $name, welcome\
    \ to Ubuntu GNOME desktop. \"\n```\n![](rsrc4RB.jpg)\nPretty cool! Isn’t it? The\
    \ next example uses the `-p` option.\n\n```bash\n#!/bin/bash\nread -p \"Enter\
    \ your name: \" name\necho \"Hi $name, welcome to Ubuntu GNOME desktop. \"\n```\n\
    ![](rsrc4RJ.jpg)\nIn this example, we were using a variable. However, even if\
    \ you do not specify one, the `read` command has its own environment variable\
    \ `REPLY` to hold such data.\n\nExample:\n```bash\n#!/bin/bash\nread -p \"Enter\
    \ your name: \"\necho \"Hi $REPLY, welcome to Ubuntu GNOME desktop. \"\n```\n\
    ![](rsrc4RU.jpg)\nAnother useful option is the `-t` option. We can use this to\
    \ expire the user input prompt.\n\n```bash\n#!/bin/bash\nif read -t 30 -p \"Enter\
    \ your name: \"\nthen\n    echo \"Hi $REPLY, welcome to Ubuntu GNOME desktop.\
    \ \"\nelse\n    echo \"Your session timed out! :(\"\nfi\n```\n![](rsrc4S5.jpg)\n\
    If you were unable to respond within 30 seconds, the `read` will automatically\
    \ terminate. It is like a session timeout isn’t it? Reading passwords is also\
    \ possible with `read`, and the cool thing is, it can stop displaying the characters\
    \ we type.\n\n```bash\n#!/bin/bash\nread -p \"Enter your name: \"\necho \"Hi $REPLY,\
    \ welcome to Ubuntu GNOME desktop. \"\nread -s -p \"Enter your password: \" pass\n\
    echo “Your password is $pass”\n```\n![](rsrc4SF.jpg)\nIt is also possible to read\
    \ single characters (i.e., Y/N) and it can be useful when requesting a confirmation\
    \ from the user. For this case, you can integrate it with the `case` command.\
    \ Finally, we will read from a file and add some line numbers to make `read` convenient.\n\
    \n```bash\n#!/bin/bash\nfName='' # To store the filename the user inputs\ncount=1\
    \ # Otherwise, the count starts from 0\nread -p \"File name: \" fName=$REPLY\n\
    echo $fName\ncat $fName | while read line\ndo\n    echo \"$count: $line\"\n  \
    \  count=$[ $count + 1]\ndone\necho \"EOF\"\n```\n![](rsrc4T1.jpg)\n\n# Writing\
    \ Functions\nWhen you are handling tasks using small to large scripts, it is a\
    \ tedious task to continuously rewrite the code when parts of the code can be\
    \ reused in the same script or somewhere else. Instead, it is great if such parts\
    \ can be reused or recalled with necessary values. This is common in general programing\
    \ platforms. Well, `bash` is not a loser here! It offers the same and is called\
    \ a function. Functions are code blocks that can be reused in a script. In this\
    \ section you will learn how to use functions in your code.\n\n## Basic Components\n\
    A function can be defined in the following way. It is not complicated.\n\n```bash\n\
    function function_name {\n    commands\n}\n```\nLet’s test the function of a function\
    \ in an example.\n\n```bash\n#!/bin/bash\nfunction love {\n    echo \"Do you love\
    \ Linux?\"\n}\nfor(( x=1; x<=5; x++ ))\ndo\n    love\ndone\n```\n![](rsrc4TP.jpg)\n\
    The function is called within the loop and it works! What would happen if we create\
    \ a function and change the definition of the same function (both functions will\
    \ have the same name) elsewhere below the code from the first function? Then the\
    \ names will be the same, yet it will use the 2 nd definition!\n\n## Exit Status\
    \ and Return Value\nA function should have an exist status. However, since it\
    \ can have many commands and success/failures, it will return the last successful\
    \ or unsuccessful status. This may become troublesome although we can query it\
    \ by `$?`. This is where the return value of a function becomes useful. Let’s\
    \ look at an example.\n\n```bash\n#!/bin/bash\nfunction calculate {\n    num1=0\n\
    \    num2=0\n    cal=0\n    read -p \"Input your first value: \" num1\n    read\
    \ -p \"Input your second value: \" num2\n    cal=$[ $num1 + $num2 ]\n    echo\
    \ $cal\n    return 0\n}\ncalculate\necho \"$?\"\necho \"The end!\"\n```\n![](rsrc4UD.jpg)\n\
    There are 2 limitations to this technique, however. Those are:\n- You must not\
    \ execute any command before capturing the exit status.\n- You must use a return\
    \ value below 256 that is a limitation of the return value.\n\nTo resolve this\
    \ problem, we can directly obtain the return value by following this procedure.\n\
    \n```bash\n#!/bin/bash\nvar1=100\nvar2=200\nvar3=0\nvar_F=0\nfunction math {\n\
    \    var3=$[ $var1 + $var2 ]\n    echo $var3\n}\necho \"The return value is being\
    \ calculated…\"\nvar_F=$(math)\necho “The result is $var_F”\n```\n![](rsrc4V0.jpg)\n\
    \n## Passing Arguments\nJust like we did with scripts, we can pass variables to\
    \ functions. The function can use `$1` to `$9` variables to capture the values.\
    \ The function can retrieve these values and execute the commands.\n\n```bash\n\
    function calculate{\n    if [ $# -eq 0 ] || [ $# -gt 2 ]\n    then\n        echo\
    \ \"Need two values!\"\n    elif [ $# -eq 1 ]\n    then\n        echo \"Need one\
    \ more value\"\n    else\n        echo $[ $1 + $2 ]\n    fi\n}\nval=$(calculate\
    \ 250 500)\necho $val\necho \"The end!\"\n```\n![](rsrc4VN.jpg)\nIn this example,\
    \ we have passed 2 simple arguments. Then we took each argument and performed\
    \ a calculation. If you still remember how to use `$1`-`$9` this is a simple task.\n\
    \n## Handling Variables\nIn the next section we will look at how environment variables\
    \ can be integrated with functions. Using variables in a function is essential.\
    \ However, when you use functions you must be careful of one thing: Do not use\
    \ the same name for variables inside the function as well as outside because one\
    \ can corrupt the data of the other. To avoid such issues, you could use `local`\
    \ and global variables. Let’s look at this example.\n\n```bash\n#!/bin/bash\n\
    function compare{\n    temp=10\n    result=$[ temp+1 ]\n}\ntemp=5\necho \"Final\
    \ result =\" $result\nif [ $temp -eq 10 ]; then\n    echo \"romised!\"\nelse\n\
    \    echo \"Not compromised!\"\nfi\n```\n![](rsrc4WB.jpg)\nNow you see the problem.\
    \ The `temp` variable is assigned a value 5. Yet after the execution of the function\
    \ it is 10. Let’s try with a local variable.\n\n```bash\n#!/bin/bash\nfunction\
    \ compare{\n    local temp=10\n    result=$[ temp+1 ]\n}\ntemp=5\necho \"Final\
    \ result =\" $result\nif [ $temp -eq 10 ]; then\n    echo \"romised!\"\nelif [\
    \ $temp -eq 5 ]; then\n    echo \"Not compromised!\"\nelse\n    echo -1\nfi\n\
    ```\n![](rsrc4WZ.jpg)\nNow, temp is 5 and there is no conflict.\n\n## Using Arrays\
    \ and Passing Arrays\nIf you are familiar with arrays, you may know what it is.\
    \ However, for a reader who isn’t familiar with arrays, this section includes\
    \ an introduction. An array is a memory location that we construct to hold more\
    \ than one parameter. We can create arrays in two ways:\n- By declaring an array.\n\
    - By creating an array.\n\n### Declaring an Array\nTo declare an array, we can\
    \ simply use the following syntax:\n```bash\ndeclare -a my_array\n```\n\n### Create\
    \ an Array on the Fly\nThe following syntax can be used to create an array on\
    \ the fly:\n```bash\nmy_array=(foo baz)\n```\n\n### Handling Arrays\nTo insert\
    \ or modify a value, we could use:\n`my_array[0]=foo`\nWe have inserted `foo`\
    \ as the first element of this array. To retrieve data, we could use the following\
    \ methods:\n- `echo ${my_array[@]}` : Using `@` symbol.\n- `echo ${my_array[*]}`\
    \ : Using `*` symbol.\n![](rsrc4XN.jpg)\nI hope you remember the difference between\
    \ `@` and `*`. Let’s look at this using a `for` loop.\n\n```bash\nmy_array=(foo\
    \ baz)\nfor x in \"${my_array[@]}\"\ndo\n    echo \"$x\";\ndone\nfor y in \"${my_array[*]}\"\
    \ndo\n    echo \"$y\";\ndone\n```\n![](rsrc4Y4.jpg)\nAs you see, `@` returns each\
    \ element and the other returns all items but in a single string.\n\n### Using\
    \ Arrays in Functions\nUsing arrays in functions can be very useful as the code\
    \ can be reused due to the complexity arrays introduce. Let’s learn from an example.\n\
    \n```bash\nfunction arr_test{\n    local temp_arr\n    temp_arr=(\"$@\") # Assigns\
    \ values to the array from the outside\n    echo \"Value of the array in the function\
    \ is: ${temp_arr[*]}\"\n}\nmy_array=(a b c d e)\necho \"Array values in the original\
    \ array is: ${my_array[*]}\"\narr_test \"${my_array[*]}\"\n```\n![](rsrc4YM.jpg)!\n\
    As you see, the two arrays have identical values.\n\n## Recursive Functions\n\
    What is recursion? A function may call itself for certain purposes. The best example\
    \ is calculating factorial. When calculating, the function recursively call itself\
    \ to run the calculations. Let’s look at this example.\n\n```bash\nfunction factorial\
    \ {\n    if [ $1 -eq 1 ]\n        # If the input is 1, then the result is 1\n\
    \        echo 1\n    else\n        # If the input is not 1\n        local tmp=$[\
    \ $1 - 1 ]\n        local result=$(factorial $tmp) # The function calls itself\
    \ again\n        echo $[ $result * $1 ]\n    fi\n}\n```\nWait, the original text\
    \ had `result=$(factorial $REPLY)` and similar.\n\n## Using Function as a Library\n\
    We have already learned about how functions can be used efficiently. However,\
    \ you cannot still use a function outside the original script because it is limited\
    \ to the current session. Is it the truth? No! You can use functions in a script\
    \ for a purpose of another. Here is how:\nYou simply have to save the script in\
    \ the same location as the script trying to use it. Or else, you need to provide\
    \ the full (absolute) path. There is also a proper way to call an external script.\
    \ Let’s learn it in the following code.\n\n```bash\nfunction add {\n    echo $[\
    \ $1 + $2 ]\n}\n```\nThis is our script and let’s save it as `custom_func`. Now,\
    \ let’s invoke in it another script saved in the same location.\n\n```bash\n.\
    \ ./custom_func\nnum1=10\nnum2=20\nresult=$(add $num1 $num2)\necho $result\n```\n\
    ![](rsrc500.jpg)\nFinally, we are successfully able to store out library and reuse\
    \ it as we have always wanted! This chapter has covered fundamentals and advanced\
    \ uses of functions and how a function can be used in different perspectives.\
    \ This section will not cover graphics interfaces as it would be too advanced\
    \ for a starter.\n\n# Introduction to GAWK\nIn order to do data and file manipulation\
    \ you could use `bash` shell and `SED` to perform certain advanced functions.\
    \ However, to manipulate data, especially complex data, you often need an environment\
    \ similar to a program. This is where you would go for `awk`. The name “AWK” derived\
    \ from the 3 authors who wrote this program: Alfred Aho, Peter Weinberger, and\
    \ Brian Kernighan. `GAWK` is `AWK`’s GNU version. It isn’t just a command editor.\
    \ It has its own programming language and can do much including:\n- Define variables\
    \ and store data using variables.\n- Arithmetic and string operations.\n- Structured\
    \ programming capabilities.\n- Data formatting and reorganizing for purposes.\n\
    \nThe last feature is highly important when there is a large set of files, such\
    \ as logs and when reports to be generated from these data. `GAWK` is able to\
    \ format the data into more readable information that makes sense. The entire\
    \ `GAWK` manual is available at https://www.gnu.org/software/gawk/manual/awk.html.\n\
    \nSyntax: `awk [POSIX or GNU options] -f file ...`\n`awk` looks like the following:\
    \ `pattern { action }`. Note the escape characters. cannot use `^` here. Another\
    \ instance is when you wish to print first word of each line of a log file. Remember,\
    \ do not use `$` as you normally would with other programming languages. `awk\
    \ '{print $1}'`. In order to change the field separator, use the `-F` option.\
    \ We are using no separators at first and then `:` and `-` as separators in next\
    \ steps. When you use `awk` in the command-line, you could start with `awk` and\
    \ press enter. Then it will start accepting your commands until you enter the\
    \ single quotation. Another advanced feature of `gawk` is the ability to store\
    \ a program in a file and refer in the CLI. Let’s create a new `awk` file in the\
    \ desktop and name it `script.awk`. Let’s have it read the `$1` and `$6` of a\
    \ file and echo the content:\n\n```awk\n{print \"The user \"$1'\"s home directory:\"\
    \ $6}\n```\nSave the file. Now, run the following command:\n```bash\nawk -F: -f\
    \ ./script.awk /etc/passwd\n```\n![](rsrc51Y.jpg)\nIn this example, we call the\
    \ script and pass the file `/etc/passwd`. The script takes it, uses the delimiter\
    \ `:` and breaks the 1st and 6th fields. `jan:x:1000:1000:Jan,,,:/home/jan:/bin/bash`\
    \ (1) (6).\n\n## Understanding Data Fields\nNow you have a basic understanding\
    \ of how `gawk` or `awk` works. In order to utilize the data fields properly,\
    \ you need to know how field variables work:\n- `$0` represents the entire line.\n\
    - `$1` represents the first data field.\n- `$n` represents the last data field.\n\
    This is how you should access data using these variables.\n\n## Processing GAWK\
    \ Before Processing Data\nIn any software program, you find welcoming and instructional\
    \ lines before the start. It is difficult in `GAWK` without a special variable\
    \ `BEGIN`. In the following example, it is demonstrated.\n\nExample:\n```bash\n\
    awk 'BEGIN {print \"Hello World!\"}'\n```\n![](rsrc52F.jpg)\n\n## Processing the\
    \ End of File\nAs `BEGIN` starts the process before processing data, `END` keyword\
    \ allows you to specify a script once the reading of data ends.\n\n```bash\nawk\
    \ 'BEGIN {print \"File Contents:\"}{print $0}END {print \"End of File\"}' File3.txt\n\
    ```\n![](rsrc52R.jpg)\n\n## GAWK Variables\nJust like we used variables, `GAWK`\
    \ also facilitate the use of variables. There are 2 types of variables:\n- User-defined\
    \ Variables\n- Built-in Variables\nLet’s first look at the Built-in variables.\
    \ `GAWK` provides a small set of data fields and records variables. These can\
    \ be utilized with both input and output data to control data and record handling.\
    \ The following table includes the set.\nTable 9.2: GAWK field and record variables\n"
