    It is also easier to manage. The only drawback is the bottleneck it creates as
    a single space of failure. However, the modern operating systems have overcome
    such issues and Linux distributions are highly robust, reliable, stable and secure
    operating systems.Linux kernel is responsible for the following tasks.-        
    Process management.-         Scheduling.-         Inter-process communication.-
            Memory management.-         File System management.-         Device and
    driver management (hardware).-         Network management.-         Security.We
    will be looking into this deeper when we discuss the related topics during this
    series. For now, let’s look at how these things are arranged.Since we are looking
    into Linux, let’s get an idea of versioning. Versioning is a critical part of
    any software development. Linux kernel, as well as any distribution, has a version
    number. It has the following format.<Major Number><Minor Number><Micro Number>-<Patch
    Level>The version represents the version number. The release can be an even or
    an odd number. The even number represents a stable release, while the odd number
    indicates a version in development. The patch level is also important here. It
    indicates the bugfixes.Any Linux distribution has its own versioning. If we take
    few examples:-         The latest Ubuntu version is 18.04\. The upcoming version
    is 19.04.-         Latest Red Hat release is 8.0 and the kernel version is 4.18.0-80.This
    formatting is subject to change at any time.Linux Kernel Releases and SupportThere
    are 4 release types.-         Pre-patch: These are RC (release candidate) versions
    targeting developers and enthusiasts.-        Mainline: This is managed by Linus
    and the developers and is the root of development. Major releases occur per 2
    – 3 months.-        Stable: Once the mainline release is out and bugs are fixed,
    it is considered stable. It is maintained by a designated custodian. There may
    be a few bug releases until the next release. These updates often occur on a weekly
    basis.-        Long-term: Some flavors arrive with long term support. For instance,
    the distribution is maintained and patched at least for a couple of years. This
    line of distribution is known as Long-Term Support or LTS. However, older trees
    are not patched very often.It is worth mentioning the release of other kernels
    by Linux distributors. Major Linux flavor developers release their own long-term
    support distributions. These are not maintained by the main line, but rather by
    the distributor individually through their own support channel.To find more about
    kernels, visit [https://www.kernel.org/](https://www.kernel.org/)Linux LBSStandardization
    is vital for any operating system or a software platform to maintain interoperability
    and compatibility. For instance, compiled software should be capable of (compatible)
    running on any Linux platform. Like POSIX, LBS is a specification that appears
    to define services and Application Binary Interfaces (ABIs). However, some distributors
    may not align themselves with this standard.Linux DistributionsA Linux distribution
    or a “distro” is a complete Linux package consisting of the kernel and other components
    we discussed. There are many distributors who integrate and distribute these so
    that end-users do not have to do anything complex.According to [https://distrowatch.com/](https://distrowatch.com/)
    currently there are 288 Linux distributions and it is gradually declining.  peaked
    at 323 and now it is 288.These distributions are specific, or targeting a specific
    user group, or a functional group, such as developers, infrastructure, multimedia,
    or even general users. Let’s look at 3 major types of distributions.-        
    Core distributions.-         Special distributions.-         Live CDs.Most applications
    are customized for desktop users and business users. It includes facilities to
    install and use Linux easier, popular operating system-like desktop distributions,
    (e.g., similar to Windows or Mac) and autodetection/configuration of hardware. These
    distributions made Linux revolutionary popular among desktop users.Major Linux
    Distributions'
