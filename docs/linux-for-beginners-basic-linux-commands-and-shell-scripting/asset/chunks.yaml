- fmt: "\n# The Case Command\n\nThe `case` command is extremely useful when there\
    \ is a long ladder of `if-then-else` statements. With the `case` command, the\
    \ stages can be represented as cases.\n\nSyntax:\n```bash\ncase $variable-name\
    \ in\npattern1)\n    command1...commandN;;\npatternN)\n    command1...commandN;;\n\
    *)\n    esac\n```\nYou can also use `pattern1|pattern2|pattern3)` to match multiple\
    \ patterns instead of a single pattern. `Case` command can be used for highly\
    \ advanced decision-making constructs.\n\n### Advanced example:\n```bash\n#!/bin/bash\n\
    if [ -z $1 ] #if the script runs without argument\nthen\n  rental=\"Unknown vehicle\"\
    \nelif [ -n $1 ]\nthen\n  # If supplied make first argument as a rental\n  rental=$1\n\
    fi\n# use case statement for rental decision making\ncase $rental in\n\"car\"\
    ) echo \"For $rental rental is $25 per k/m.\";;\n\"van\") echo \"For $rental rental\
    \ is$20 per k/m.\";;\n\"jeep\") echo \"For $rental rental is $18 per k/m.\";;\n\
    \"bicycle\") echo \"For $rental rental $1 per k/m.\";;\n*) echo \"Sorry, no $rental\
    \ rental is available for you!\";;\nesac\n```\nExecuting this script is somewhat\
    \ different from the previous scripts. To execute this, you must provide an argument\
    \ with the execution command. ![](rsrc43B.jpg)\n\n### Another example:\n```bash\n\
    #!/bin/bash\ncase $USER in\nroot) echo \"Welcome Superuser\";;\njan | jake) echo\
    \ \"Welcome administrator!\";;\ntestuser) echo \"Welcome test! Please use the\
    \ dev board for reporting\";;\n*) echo \"Access is denied!\";;\nesac\n```\n![](rsrc43W.jpg)\n\
    \n# The for Command\n\nIn scripting, you will often find requirements for command\
    \ iteration or looping. For instance, when you read from a file or a set of files\
    \ this becomes remarkably useful.\n\nSyntax:\n```bash\nfor var in list\ndo\n \
    \   commands\ndone\n```\nHere, `var` variable holds the current list item value.\
    \ At the end of a full iteration it holds the value of the last iteration.\n\n\
    ### Basic example:\n```bash\n#!/bin/bash\nfor i in {1..5}\ndo\n  echo \"Welcome\
    \ $i times\"\ndone\n```\n![](rsrc44H.jpg)\n`for` command can be used in the following\
    \ method. This is mostly used in programming.\n\n### C-style Commands\n\nThe following\
    \ syntax is known as the C-style. In C programming language, such expression style\
    \ is used for loops etc.\n\nSyntax:\n```bash\nfor (( EXP1; EXP2; EXP3 ))\ndo\n\
    \    command1\n    command2\n    command3\ndone\n```\n\n### Example:\n```bash\n\
    #!/bin/bash\nfor (( a=0; a<=5; a++ ))\ndo\n  echo \"Welcome $a times\"\ndone\n\
    ```\n![](rsrc456.jpg)\nWe can even utilize multiple expressions. For instance,\
    \ we could use the following:\n`for (( a=0, b=9; a<=5; a++,b--))`\n\n### For with\
    \ IF command\n\nIt is possible to combine `for` with `if` in order to exit loops\
    \ when a condition is met. There are other uses as well. For instance, when you\
    \ want to find a file, you could search for the file name using a `for` loop.\
    \ By using `if` you can end the loop when the file is found.\n\n### Advanced example:\n\
    ```bash\n#!/bin/bash\nfor file in /etc/*\ndo\n  if [ \"${file}\" == \"/etc/resolv.conf\"\
    \ ]\n  then\n    countNameservers=$(grep -c nameserver /etc/resolv.conf)\n   \
    \ line=$(grep -n nameserver /etc/resolv.conf)\n    lineNumber=${line%:*}\n   \
    \ echo \"Total ${countNameservers} nameservers defined in ${file}\"\n    head\
    \ -n $lineNumber /etc/resolv.conf | tail -1\n    #echo $varRes\n    break\n  fi\n\
    done\n```\nThis example is a complex one. It searches for the name resolution\
    \ table (file). When it is found, it counts the nameservers and echoes the count.\
    \ It also displays a nameserver list by taking line number to the line variable\
    \ and then obtaining the line number out of a string (this string has the line\
    \ number before the ‘:’). Then we use `head` and `tail` commands to display the\
    \ entries.\n![](rsrc45Z.jpg)\n\nWhen you use `for` loop, remember not to use certain\
    \ expressions such as strings with ‘’ ` symbol. It can mess up the output. Do\
    \ not also use multi-word values in strings as `for` command will assume each\
    \ list item is separated by a space. If you use `New Name` as a single list item,\
    \ it will treat as two. You need to use `\"\"` as appropriate.\n\nAs you previously\
    \ did, you could read list from a variable. For instance:\n```bash\n#!/bin/bash\n\
    list=\"Car Bus Bike Helicopter\"\nfor vehicle in $list\ndo\n  echo \"Have you\
    \ ever traveled back home by $vehicle?\"\ndone\n```\n![](rsrc46D.jpg)\nIt can\
    \ also be used to read values from a command.\n\n### Example: In this example,\
    \ we are using a file with a list of vehicles.\n```bash\n#!/bin/bash\nlist=\"\
    vehicles\"\nfor vehicle in $(cat $list)\ndo\n  echo \"Travel home by $vehicle\"\
    \ndone\n```\n![](rsrc46U.jpg)\nWhat happens if there is a name of a car manufacturer\
    \ like Aston Martin?![](rsrc470.jpg)\nAgain, the `for` command breaks the output\
    \ and messes up. In order to resolve this the field separators were introduced.\n\
    \n### Field Separators\n\nA field separator can be a space, a tab, and even a\
    \ new line. There is an environment variable called `Internal Field Separator`\
    \ or `IFS`. This was the root cause of the previous problem. To resolve this,\
    \ it is possible to define our own field separators.\n\n```bash\n#!/bin/bash\n\
    list=\"vehicles\"\nIFS=$'\\n' #Defines our intended field separator\nfor vehicle\
    \ in $(cat $list)\ndo\n  echo \"Travel home by $vehicle\"\ndone\n```\n![](rsrc47G.jpg)\n\
    Another useful feature of the `for` loop is the support for wildcards. This is\
    \ often used when searching for files. For instance, `for file in /home/*` can\
    \ be used.\n\n# While Command\n\n`while` command is versatile than `for` and `if-then-else`\
    \ and its somewhat of a cross between two.\n\nSyntax:\n```bash\nwhile test\ndo\n\
    \    other commands\ndone\n```\nThe `while` loop keeps running as long as the\
    \ exit code is zero. If it isn’t it breaks the iterations and ends the loop.\n\
    \n### Example:\n```bash\n#!/bin/bash\nnum1=5\nwhile [ $num1 -gt 0 ]\ndo\n  echo\
    \ $num1\n  num1=$[num1 - 1 ]\ndone\n```\n![](rsrc48A.jpg)\n\n# Until Command\n\
    \nThis is the last of our commands. `Until` command can be thought of as the opposite\
    \ of `while` command.\n\nSyntax:\n```bash\nuntil test\ndo\n    other commands\n\
    done\n```\n\n### Example:\n```bash\n#!/bin/bash\nvar1=10\nuntil [ $var1 -eq 0\
    \ ]\ndo\n  echo $var1\n  var1=$[var1 - 2 ]\ndone\n```\n![](rsrc48Y.jpg)\n\n# The\
    \ Break and Continue Commands\n\nControlling loops is essential requirement in\
    \ scripting, as well as any other discipline. The `break` command simply breaks\
    \ a loop and exits. This can be used with `if-then-else`, `while` and `until`\
    \ commands. On the other hand, `continue` command skips the iteration and goes\
    \ to the next. However, it does not break the loop entirely.\n\n```bash\n#!/bin/bash\n\
    for i in 1 2 3 4 5 6 7 8 9\ndo\n  if [ $i -eq 5 ]\n  then\n    echo “skipping\
    \ 5th iteration…”\n    continue\n  fi\n  echo “I is equal to $i”\ndone\n```\n\
    ![](rsrc49.jpg)\nThis concludes the lesson on structured commands and conditionals.\
    \ At the end, we will look into one real-life scenario so you can practically\
    \ use what you have learned.\n\n### Example: Creating a Set of Users\n\nIf you\
    \ have been working as an administrator, you may have already used techniques\
    \ to create users using bulk updates. In such cases, we often use either text\
    \ files or comma-separated files (.CSV or a spreadsheet if you are a Windows user).\
    \ In this example, we will be using such a file and create multiple users. When\
    \ creating users, you must access files, check whether the user exists, or not\
    \ and iterate until the end of the file. We will have the following fields in\
    \ the file: `username,fn`. Here, `fn` stands for full name. As you already noticed,\
    \ comma separated file is not align with the default field separators. In this\
    \ case, we need to use our own separator `IFS=','`.\n\n```bash\n#!/bin/bash\n\
    inp=\"/home/jan/Desktop/users\"\nwhile IFS=',' read -r uid fn\ndo\n  echo \"adding\
    \ $uid\"\n  useradd -c \"$fn\" -m $uid\ndone < $inp\n```\n![](rsrc4A6.jpg) CHAPTER\
    \ 9: Introduction to Functions\n\nIn this chapter you will learn own- What functions\
    \ are\n- Parameters and options\n- `getopt(s)`\n- Writing functions\n- Handling\
    \ functions (exit status, arguments, variables and arrays)\n\n###\n\nBefore going\
    \ into functions, some important topics will be discussed in this section starting\
    \ with handling user input. Handling user input is essential in actual scenarios.\
    \ Interactive scripts are useful when it requires to handle data and input from\
    \ the user. Linux offers a few command line parameters, options as well as handling\
    \ direct input (e.g., from Keyboard).\n\nYou have already come aware of how startup\
    \ values are passed when executing a shell script. For instance, we executed `./Myscript`\
    \ with `car` value. It provided specific information for this input. This is actually\
    \ an interactive script and it was able to handle user input.\n\nReading a supplied\
    \ parameter is handled by `bash`. There is a special variable called positional\
    \ parameters. These parameters handle the script name and 8 other parameters so\
    \ that can be used with custom input values. The script name is held by `$0`.\
    \ `$1 - $9` holds the rest. Let’s look at a simple mathematical equation with\
    \ 2 arguments.\n\n```bash\n#!/bin/bash\nmultiplication=$[ $1 * $2 ]\necho The\
    \ multiplication of $1 and $2 is $multiplication\n```\n![](rsrc4B1.jpg)\nIt takes\
    \ `$1` and `$2` and perform a simple math operation.\n\n### Another example:\n\
    ```bash\n#!/bin/bash\nvar1=$USER\necho Welcome $var1\necho Wishing you a happy\
    \ $1\n```\nIn this example, it takes a day for `$1` and present it to the user\
    \ as a greeting.\n![](rsrc4BD.jpg)\nYou must enter text within double quotation\
    \ marks if you wish to enter more than one word when executing scripts. Otherwise,\
    \ you will run out of parameters and a messed-up output.\n\nIn the next example,\
    \ we will be reading the script name and making decisions based on it. One problem\
    \ exists with the `$0`. It may contain more than the name of the script, e.g.,\
    \ `path`. There is a command to remove the path, as well as any other values in\
    \ between. The `basename` command comes handy in doing so.\n\n```bash\n#!/bin/bash\n\
    var1=$0\nvar2=$(basename $0) #Here we remove ‘./’ and other additional stuff\n\
    if [[ $var2 == \"Myscript\" ]]\nthen\n  echo This is Jan’s script $var1 #Raw name\n\
    \  echo This is Jan’s script without additional things in the name: $var2 #This\
    \ line returns the formatted name with basename\nelse\n  echo This not Jan’s script\
    \ but $var2\nfi\n```\n![](rsrc4BZ.jpg)\nNow you know how to use script name as\
    \ a variable. You can make decisions based on the name. For instance, if a script\
    \ has name `who` it can run the `who` command. If the name is addition, you could\
    \ only execute the addition. When you run the scripts with parameters, you must\
    \ be sure that no inaccurate or unexpected values are passed causing crashes.\
    \ Therefore it is the best practice to test the input and pass them through `if-then-else`\
    \ ladder.\n\n# Counting Parameters\n\nThere is a special variable for counting\
    \ the number of parameters: `$#`. This variable counts the number of parameters\
    \ upon executing the script. Let’s look at the following:\n\n```bash\n#!/bin/bash\n\
    var1=$#\necho Number of arguments supplied $var1\n```\n![](rsrc4CC.jpg)\n\n###\
    \ Another example: Calculating factorial only if the number of parameters equals\
    \ one.\n```bash\n#!/bin/bash\nvar1=$#\nnum=$1\nif [ $var1 -eq 1 ]\nthen\n  fact=1\n\
    \  while [ $num -gt 1 ]\n  do\n    fact=$((fact * num))\n    num=$((num - 1))\n\
    \  done\n  echo $fact\nelse\n  echo \"Script usage: ./Myscript 5\"\nfi\n```\n\
    ![](rsrc4D0.jpg)\nThere are two other variables providing a way to obtain the\
    \ last parameter and script name used. These are `$!` and `${#}`. Let’s run the\
    \ following script and obtain the output.\n```bash\n#!/bin/bash\necho $#\necho\
    \ ${!#}\n```\n![](rsrc4DF.jpg)\nTo access all the parameters there are two ways:\n\
    - `$*` variable provides access to all parameters as a single line.\n- `$@` variables\
    \ provides access to all parameters individually. This can be explained by using\
    \ `for` loop.\n\n```bash\n#!/bin/bash\ncount=1\nfor params in \"*\"\ndo\n  echo\
    \ \"Variable $* Parameter #$count\"\n  count=$[count + 1 ]\ndone\ncount=1\nfor\
    \ params in \"$@\"\ndo\n  echo \"Variable $@ Parameter #$count\"\n  count=$[count\
    \ + 1 ]\ndone\n```\n![](rsrc4E8.jpg)\n\n# Shifting Things\n\nThe `shift` command\
    \ is another useful command. It shifts the current positional parameters left\
    \ `n` time. This `n = 1` by default.\n\nSyntax:\n```bash\nshift [n]\n```\nIn the\
    \ next example, let’s try to shift the provided values:\n```bash\nshift 0\necho\
    \ Param 0: $0\necho Param 1: $1\necho Param 2: $2\necho Param 3: $3\necho Param\
    \ 4: $4\n```\n![](rsrc4EP.jpg)\nNow let’s start shifting them:\n```bash\nshift\
    \ 1\necho Param 0: $0\necho Param 1: $1\necho Param 2: $2\necho Param 3: $3\n\
    echo Param 4: $4\n```\n![](rsrc4F2.jpg)\nAlthough the `$0` has no change, the\
    \ other values have been shifted. Let’s use a `for` loop this time.\n```bash\n\
    for (( i = 0; i <= 4; i++ ));\ndo\n  echo Shifting $i:\n  echo 1: $1\n  echo 2:\
    \ $2\n  echo 3: $3\n  echo 4: $4\n  shift\ndone\n```\n![](rsrc4FG.jpg)\nIn this\
    \ output, you can see how the provided values are getting shifted during the 5\
    \ iterations. If we provide 4 values, the entire values will be shifted without\
    \ any number remaining. We can use this shifting to do things like traversing\
    \ folders. A practical example will be removal of files in a specific directory\
    \ or directories older than 365 days.\n\n# Moving with Options\n\nIn the previous\
    \ lesson we learned about passing arguments or parameters with the execution.\
    \ We can also pass options. These options can be used to take decisions based\
    \ on the provided options. Let’s take a look at an example:\n```bash\nwhile [\
    \ -n \"$1\" ]\ndo\n  case \"$1\" in\n    -x) echo \"Found a valid option -x\"\
    \ ;;\n    -y) echo \"Found a valid option -y\" ;;\n    -z) echo \"Found a valid\
    \ option -z\" ;;\n    *) echo \"$1 is not a valid option\" ;;\n  esac\n  shift\n\
    done\n```\n![](rsrc4G4.jpg)\nIf we combine the examples for finding parameters\
    \ and options, we can obtain both successfully:\n```bash\nwhile [ -n \"$1\" ]\n\
    do\n  case \"$1\" in\n    -x) echo \"Found a valid option -x\" ;;\n    -y) echo\
    \ \"Found a valid option -y\" ;;\n    -z) echo \"Found a valid option -z\" ;;\n\
    \    *) echo \"$1 is not a valid option\" ;;\n  esac\n  shift\n  count=1\n  for\
    \ params in \"$@\"\n  do\n    echo \"Variable $@ Parameter #$count = $params\"\
    \n    count=$[count + 1 ]\n  done\ndone\n```\n\n# Using getopt and getopts Commands\n\
    \nThese two commands are used to parse or break the options provided through the\
    \ command line.\n\nSyntax of `getopt`: `getopts optstring name [argument]`...\n\
