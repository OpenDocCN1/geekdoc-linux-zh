    \ editor, Kate is a multi-window and feature ich editor.GNOME EditorSince we are\
    \ using Ubuntu, it is better to use a GNOME editor. gedit is the default editor\
    \ in many cases.![](rsrc1W1.jpg)Image: Linux Gnome editorGedit supports tabs,\
    \ has a find and replace option, language, spelling, date/time tools, full screen\
    \ mode, and a side panel. Another great feature is the printer support.![](rsrc1W7.jpg)Image:\
    \ Ubuntu gedit editor with the slide panelCHAPTER 5: Basic Linux Shell CommandsIn\
    \ this chapter you will learnLinux File SystemNavigationListing Files with ls/dev/nullManaging\
    \ Directories, Files and ContentHard and Soft LinksIntroductionWe already explored\
    \ commands in the previous chapters. We are not going to look at some useful commands\
    \ for file handling and similar uses. Before going into more details, let’s look\
    \ at the Linux file structure.Linux stores files in a structure known as the virtual\
    \ directory structure . This is a single directory structure. It incorporates\
    \ all the storage devices into a single tree. Each storage device is considered\
    \ as a file. If you examine the path of a file, you do not see the disk information.\
    \ For instance, the path to my desktop is, /home/jan/Desktop . This does not display\
    \ any disk information in its path. By this way, you do not need to know the underlying\
    \ architecture.If you are to add another disk to the existing, you simply use\
    \ mount point directories to do so. Everything is connected to the root.These\
    \ files naming is based on the FHS (Filesystem Hierarchy Standard). Let’s look\
    \ at the common files once more. We already went through the directory types during\
    \ the installation.Table: Linux directory types\n\n| Directory | Purpose |\n\n\
    | / | This is the root home directory. The upper-most level. |\n\n| /bin | This\
    \ is the binary store. GNU utilities (user-level) exist in this directory. |\n\
    \n| /boot | This is where the system stores the boot directory and files used\
    \ during the boot process. |\n\n| /dev | Device directory and nodes. |\n\n| /etc\
    \ | This is where the system stores the configuration files. |\n\n| /home | Home\
    \ of user directories. |\n\n| /lib | System and application libraries. |\n\n|\
    \ /media | This is where media is mounted, media such as CDs, USB drives. |\n\n\
    | /mnt | Where the removable media is mounted to. |\n\n| /opt | Optional software\
    \ packages are stored here. |\n\n| /proc | Process information – not open for\
    \ users. |\n\n| /root | Home directory of root. |\n\n| /run | Runtime data is\
    \ stored here. |\n\n| /sbin | System binary store. Administrative utilities are\
    \ stored here. |\n\n| /srv | Local services store their files here. |\n\n| /sys\
    \ | System hardware information is stored here. |\n\n| /tmp | This is the place\
    \ for temporary files. |\n\n| /usr | This is where the user-installed software\
    \ are stored. |\n\n| /var | Variable director where the dynamic files such as\
    \ logs are stored. |\n\n![](rsrc20G.jpg)Directory and File NavigationTo view a\
    \ list of directories in the present directory, in Windows you use the dir command.\
    \ This command works the same way on Linux.To navigate to files, the most basic\
    \ method is to use the full path to the file such as /home/jan/Desktop/ . There\
    \ are basic commands to do this with easier.\n\n1.  Know your present working\
    \ directory with pwd command.\n\n    ![](rsrc20R.jpg)\n\n2.  Change the directory\
    \ location using the cd command. Here we use the absolute path .\n\n    ![](rsrc20Y.jpg)\n\
    \n3.  Get back to the home directory using the cd command only."
