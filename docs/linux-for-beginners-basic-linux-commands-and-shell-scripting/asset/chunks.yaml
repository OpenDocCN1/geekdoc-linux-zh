    ```bash\n#!/bin/bash\nif grep APR --color File3.txt\nthen\n    echo \"APR is found\
    \ in the file\"\nelse\n    echo \"APR is not found\"\nfi\n```\n\nHowever, this\
    \ method is not effective if we cannot do comparisons. For instance, if you are\
