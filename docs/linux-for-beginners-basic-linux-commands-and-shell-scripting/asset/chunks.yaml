    ### Linking Files with Hard and Symbolic Links

    Another feature of the Linux file system is the ability to link files. Without
    maintaining original copies of files everywhere, you can link files to keep virtual
    copies of the same file. You can think of a link as a placeholder. There are 2
    types of links:

    - Symbolic links

    - Hard links


    A symbolic link is another physical file. It is not a shortcut. This file is linked
    to another file in the file system. Unlike a shortcut, the symlink gets instant
    access to the data object.

    Syntax : `ln -s [OPTIONS] FILE LINK`

    Example : `ln -s ./Y/test1.txt testn.txt![](rsrc2B7.jpg)

    If you check the inode you will see these are different files. The size can tell
    the same difference:

    - `279185 test1.txt`

    - `1201056 testn.txt`

    When you create symlinks, the destination file should not be there (especially
    directory with the destination symlink name should not be there). However, you
    can force the command to create or replace the file![](rsrc2BE.jpg)

    The `ln` command is also valid for directories![](rsrc2BK.jpg) ![](rsrc2BR.jpg)

    If you wish to overwrite symlinks, you have to use the `-f` as stated above. Or
    else, if you want to replace the symlink from a file to another, use `-n`.

    Example : I have 2 directories `dir1` and `dir2` on my desktop. I create a symlink
    - `dir1` to `sym`. Then I want to link `sym` to `dir2` instead. If I use `-s`
