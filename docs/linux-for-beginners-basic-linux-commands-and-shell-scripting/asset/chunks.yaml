  trans: "\n\n1. 从 [`www.ubuntu.com/getubuntu/download`](http://www.ubuntu.com/getubuntu/download)\
    \ 下载 Ubuntu。\n\n2. 在 Windows 或 Linux 平台上，将 ISO 镜像刻录到 DVD。\n\n3. 从 DVD 启动并选择“尝试\
    \ Ubuntu（Try Ubuntu）”。\n\n如果你想创建 USB 启动盘，这里有相关说明。这些步骤也提供了第 13 步中设置 DVD 的指南。如果你没有安装操作系统，必须进入“在不安装的情况下尝试（Try\
    \ without installing）”。然后你可以使用 `Gparted` 分区工具，例如，如果你想创建一个启动电脑的 USB 盘。\n\n1. 你需要一个容量为\
    \ 4 GB 的 USB 盘。请记住，USB 盘在设置过程中会被擦除。如果 USB 盘是 USB 3.0 的速度会更快。\n\n2. USB 盘必须支持启动。某些优盘可能存在问题。在选择\
    \ USB 盘之前必须验证这一点。\n\n3. 如果你使用的是 Windows，可以使用如 `Rufus` 等软件准备 USB 盘并完成安装。既然我们正在学习\
    \ Linux，为什么不在 Linux 上操作呢？\n\n4. 在 Linux 系统上，让我们使用 `Gparted` 创建 USB 盘。我正在使用 Ubuntu\
    \ 创建 USB 盘。如果你使用的是 Live CD，它已经存在其中了。\n\n5. 使用以下命令安装 `gparted`：\n\n```\nsudo apt-get\
    \ install gparted\n```\n\n6. 格式化一次 USB 盘。\n\n7. 按 `Ctrl+H` 显示隐藏文件。加载镜像文件（挂载）到\
    \ USB（复制）。\n\n8. 右键点击分区，选择`管理标志（Manage Flags）`并启用 `boot` 和 `lba` 标志。\n\n如果你想使用其他工具，例如\
    \ `mkusb`：\n\n1. 为了进行结构化和格式化，让我们使用一个名为 `mkusb` 的实用。首先在 Ubuntu（标准版）上获取它。每行按回车。\n\
    \n```bash\nsudo add-apt-repository universe\nsudo add-apt-repository ppa:mkusb/ppa\n\
    sudo apt-get update\nsudo apt-get install mkusb\n```\n\n2. 为了方便起见，让我们使用 `mkusb`\
    \ 的 GUI 版本。\n\n3. 运行该工具并检查选项。过程完成后，你可以将 USB 恢复为标准存储设备。\n\n![](img/rsrcEH.jpg)图像：mkusb\
    \ 工具\n\n4. 从第一个选项开始，你可以创建一个启动设备。它将擦除第一个兆字节并创建所需的布局。\n\n### 如果你想在 Ubuntu 上使用 `usb-creator`\n\
    \n1. 要从获取的 ISO 创建便携 USB，让我们使用 Ubuntu 中的 `usb-creator` 实用工具。只需挂载 USB 并启动此程序。\n\n\
    2. 对于源镜像，通过浏览路径提供镜像。如果镜像未列在列表中——如果没有，使用`其他...（Other…）`按钮找到它。\n\n3. 要使用的磁盘：从列表中选择\
    \ USB 盘。如果你想使用 DVD，可以插入 DVD。\n\n4. 如果使用 USB，请从列表中选择第一个启动分区。该分区应为 `Fat16` 或 `FAT32`\
    \ 格式。\n\n5. 如果你遇到 `Dbus` 错误，请参考 [`bugs.launchpad.net/usb-creator/+bug/458334`](https://bugs.launchpad.net/usb-creator/+bug/458334)\n\
    \n### 如果你的电脑使用的是 UEFI 怎么办？\n\n如果 BIOS 模式设置为 legacy（传统），安装 Ubuntu 会更简单。如果它是 UEFI（统一扩展固件接口），你需要设置一个\
    \ UEFI 模式启动设备。USB 是此处的最佳选择。除非已经安装了另一个系统并且你想以双启动配置进行安装，否则不需要在 UEFI 模式下安装 Linux。\n\
    \n1. 获取 Ubuntu 64 位 ISO。获取 12.10 或更高版本更好，因为这些版本支持安全启动技术。\n\n2. 在创建 USB 盘时，按照上文说明使用\
    \ `Gparted`。\n\n3. 进入电脑的固件菜单并禁用`快速启动/快速启动（Quickboot/Fastboot）`和 `Intel 智能响应技术\
    \ (SRT)`。如果你使用的是 Windows 8 或更高版本，请禁用`快速启动（Fast Startup）`。\n\n4. 设置你的固件从 UEFI 模式启动。就这样！\n\
    \n### 从你的 Live CD 启动\n\n1. 插入 DVD 或 USB 盘并开启电脑。\n\n2. 选择语言。\n\n3. 当提示选项时，选择“在不更改电脑任何的情况下尝试\
    \ Ubuntu（Try Ubuntu without any change to your computer）”。\n\n### 主要发行版的 Linux\
    \ 系统要求\n\n下表列出了以下 Linux 发行版的推荐要求。这些不是最低要求！这些是推荐要求。为什么从表中删除了最低要求？因为目前人们通常使用带有较新硬件的强大电脑。拥有至少\
    \ 1 GB 内存和至少 40-80 GB 硬盘的电脑是极可能的。因此，没有刻意包含最低且有些不切实际的要求。如果你想了解这些具体要求，请参考制造商的网站或知识库。\n\
    \n表格：主要发行版的 Linux 系统要求\n\n| Linux 发行版 | CPU | 内存 | 硬盘 |\n| :--- | :--- | :---\
    \ | :--- |\n| Red Hat Linux 7 | Intel/AMD 64, ARM 及更多 | 768MiB – 1.5 GiB | 10\
    \ GiB |\n| Cent OS 7 | I386, x86_64, PowerPC8le, IA-32, ARMv7hl, AARch64 (arm64)\
    \ | 64 位使用 1 GB 逻辑 CPU | 1 GB | 10-20 GB |\n| Mint 19 | 推荐 64 位 | | | 20 GB |\n\
    | Ubuntu 18.04.3 | 2 GHz | 2 GB | 25 GB |\n| Fedora 30 | 双核 | 4 GB | 10 GB |\n\
    | Debian 9 | 2 GHz | 2 GiB | 25 GB |\n| MX Linux | i486 | | | 5 GB |\n| Kali Linux\
    \ | | | | |\n\n### 执行基础 GUI 安装\n\n1. 插入启动媒体并重启电脑。你将看到启动菜单。接下来，你必须决定是尝试 Ubuntu\
    \ 还是安装 Ubuntu。接下来，选择你的键盘布局并继续。\n\n2. 在下一个屏幕上，你将看到 4 个选项：\n\n    - 正常安装（类似于全功能）。\n\
    \    - 最小化安装，包含一组最基本的实用程序。这对于安全很有好处。\n    - 其他选项：在安装时下载更新 – 此选项将更新你的系统。但这将花费更多时间。\n\
    \    - 其他选项：为图形和 Wi-Fi 硬件以及附加格式安装第三方软件 – 此选项非常重要。如果你的电脑需要额外的驱动程序，你可以安装它。\n\n3.\
    \ 接下来是磁盘选项。你将获得 4 个选项：\n\n    - 擦除磁盘并安装 Ubuntu：如果你正在准备双启动配置，请永远不要使用此选项。否则，这是最佳选项。\n\
    \    - 加密：你可以在安装期间启用加密。\n    - 使用 LVM：此选项允许你利用逻辑卷管理器。它可以帮助磁盘管理任务，例如调整分区大小和快快，以便你可以恢复操作系统。\n\
    \    - 如果你想保留双启动配置或设置新的分区表，请点击`其他（Something Else）`。\n\n4. 安装 Ubuntu\n\nUbuntu\
    \ 和 Linux 系统将硬盘显示为文件。如果磁盘是 IDE，名称为 `/dev/hda` 到 `/dev/hdd`。对于 SCSi 控制器，是 `/dev/sda`。如果有更多磁盘，它们将被命名为\
    \ `/dev/sda`、`/dev/sdb` 等。分区将为 `/dev/sda1`、`/dev/sda2` 等。你可以使用 `MBR` 或 `GPT` 作为分区类型。后者是新方案，相比\
    \ MBR 具有许多优势。`GPT` 或 GUID 分区表为每个分区设置了唯一的 GUID，分区数量几乎没有限制，并且能够防范数据损坏。在 EFI 和 UEFI\
    \ 系统上使用 `GPT`。\n\n如果你要自定义分区方案，需要哪些分区以及大小要求是什么？\n\n1. Linux 拥有不同的分区集，让我们看看下表。\n\
    \n表格：Linux 目录\n\n| 目录 | 用途 |\n| :--- | :--- |\n\n"
- fmt: "\n# Files System Overview\n\n| Path | Description |\n| :--- | :--- |\n| `/`\
    \ | This is the root home directory. The upper-most level. |\n| `/bin` | This\
    \ is the binary store. GNU utilities (user-level) exist in this directory. |\n\
    | `/boot` | This is where the system stores the boot directory and files used\
    \ during the boot process. |\n| `/dev` | Device directory and nodes. |\n| `/etc`\
    \ | This is where the system stores the configuration files. |\n| `/home` | Home\
    \ of user directories. |\n| `/lib` | System and application libraries. |\n| `/media`\
    \ | This is where media is mounted, media such as CDs, USB drives. |\n| `/mnt`\
    \ | Where the removable media is mounted to. |\n| `/opt` | Optional software packages\
    \ are stored here. |\n| `/proc` | Process information – not open for users. |\n\
    | `/root` | Home directory of root. |\n| `/sbin` | System binary store. Administrative\
    \ utilities are stored here. |\n| `/tmp` | This is the place for temporary files.\
    \ |\n| `/usr` | This is where the user-installed software are stored. |\n| `/var`\
    \ | Variable director where the dynamic files such as logs are stored. |\n\n##\
    \ Partitioning Considerations\n\nWhen you create a specific partition scheme you\
    \ need to consider the following calculations.\n\n| Partition | Recommendation\
    \ |\n| :--- | :--- |\n| `/boot`: if the disk is more than 100 GB. | 250 – 1000\
    \ MB |\n| `/SWAP` | At least the size of the RAM |\n| `/` | Minimum 8 GB to 15\
    \ GB |\n\nFor GPT and EFI partitions, a BIOS boot partition (for Legacy Boot)\
    \ or an EFI partition is required. If legacy, this partition is 1 MB in size.\
    \ And if EFI it has to be mounted at `/boot/efi` and the size is 100-250 MB (fat32).\
    \ \n\n`SWAP` is a virtual memory reserved for memory operations. If the system\
    \ requires more memory space, inactive areas or pages are dumped or swapped with\
    \ disk. `SWAP` must not be thought of as a replacement for memory. The old rule\
    \ for `SWAP` size is `2 x RAM`. However, this is no longer true.\n\n### Table:\
    \ Linux SWAP partition recommendations\n\n| Memory Size Installed | SWAP Space\
    \ | SWAP with Hibernation |\n| :--- | :--- | :--- |\n| `<= 2 GB` | `2 x RAM` |\
    \ `3 x RAM` |\n| `2 - 8 GB` | `= RAM` | `2 x RAM` |\n| `8 – 64 GB` | `4 GB to\
    \ ½ x RAM (8 GB is sufficient)` | `1.5 x RAM` |\n| `> 64 GB` | `4 GB` | Hibernation\
    \ should be avoided |\n\nThe following is a recommended custom partition scheme\
    \ found on Ubuntu documentation. Since we installed Ubuntu, you can consider the\
    \ following if you plan to use it for a long time.\n\n### Table: Ubuntu partition\
    \ recommendation\n\n| Partition | Recommended Size |\n| :--- | :--- |\n| `/home`\
    \ | All – separate disk is also better. |\n| `/usr` | 10 GB |\n| `/var` | 2 GB\
    \ |\n| `/lib` | 5 GB |\n| `/boot` | 250 MB |\n| `/opt` | 500 MB – 5 GB. Allocation\
    \ of several GBs if you use universal repositories. |\n| `/etc` | 250 MB |\n|\
    \ `/sbin` | 250 MB |\n| `/bin` | 250 MB |\n| `/dev` | Avoid partitioning |\n|\
    \ `/srv` | `<= 100 MB`. If you run a web server or similar, plan it well. |\n\
    | `/tmp` | `<= SWAP` |\n| `/mnt` | |\n| `/media` | |\n\nSource: `https://help.ubuntu.com/community/DiskSpace`\n\
    \n## Installation Process\n\n10. Now you know how to allocate partitions. If you\
    \ did not allocate any, but use the defaults, you will get the following popup.\n\
    \n![A screenshot of a cell phone Description automatically generated](rsrcXB.jpg)\n\
    Image: Confirming the changes to the disk\n\n11. Next, select where you are geographically\
    \ located.\n\n12. Create your user account in the next Window. An important thing\
    \ to remember, especially for Windows user. Linux file system is case-sensitive!\
    \ You must use capital and simple letters carefully. If you use a username `John`\
    \ and `john`, they are not the same! This is true for files, folders and other\
    \ things too.\n\n![A screenshot of a cell phone Description automatically generated](rsrcXM.jpg)\n\
    Image: Creating the first user!\n![A screenshot of a cell phone Description automatically\
    \ generated](rsrcXU.jpg)\nImage: Creating the first user - options\n\n13. The\
    \ installation will start once you complete these steps and you will be notified\
    \ when the installation is complete.\n\n14. Installation completion screen will\
    \ be displayed. Click `Restart Now`. \n\n15. Once you restart and if you have\
    \ selected the login prompt, you will be taken to the login page.\n\n16. Next,\
    \ you have to complete the post installation tasks. Remember, during the installation,\
    \ your network connection will be configured.\n\n17. After you look into the What’s\
    \ new section, click Next.\n\n18. Set up LivePatch. This is critical if you are\
    \ worried about kernel patch fixing and I recommend you configure it.\n\n19. In\
    \ the next screen, you can register for this by creating a new account or sign\
    \ in if you already have an account. Click Next.\n\n20. In the next screen, you\
    \ can join their anonymous quality assurance program (e.g., collecting crash data\
    \ etc.,) by clicking `Help improve Ubuntu - Yes, send system info to Canonical`.\
    \ If you do not want to participate, select the other option and close the window.\n\
    \nWelcome to your new Ubuntu workspace. This is Ubuntu 18.04.3.![](rsrcYA.jpg)\n\
    Image: Ubuntu Workspace\n\n## Post Installation Tasks\n\n### Connecting to a network\n\
    \nIf you are unable to connect to a network, we can configure it using the GUI.\
    \ To start, click the network icon at the upper-right hand corner. It will open\
    \ the settings panel and then within it, the `Network` panel.\nYou simply need\
    \ to go to the `IPv4` section and configure it. If it is set to `DHCP`, in most\
    \ cases you are good to go. If you are using a virtual machine, you will have\
    \ to bridge the networks in the virtual machine host.\nTo select a manual address,\
    \ do the following procedure.![](rsrcYP.jpg)\nImage: Ubuntu network configuration\n\
    In addition, you can set an `IPv6` address, `DNS` (here I use Google DNS) and\
    \ other details. The wireless connection is similar to this.\n\n#### How do you\
    \ configure a connection using commands?\n\n1. Right click on desktop and click\
    \ `Open terminal`. The terminal helps you to execute commands and do much more.\
    \ Let’s learn it by getting the hands dirty.\n\n2. You can use 2 commands to see\
    \ the connection properties of the available connections.\n\n    1. `ip` command\
    \ –\n\n![](rsrcZ4.jpg)\n\n2. Use `lswh`. This command displays the logical name\
    \ of the available connections.\n\n`lswh`. This command displays the logical name\
    \ of the available connections. (Wait, the text says `lswh`, but usually `ip link`.\
    \ I will keep the text content).\n`lswh`. This command displays the logical name\
    \ of the available connections.\nActually, looking at the text: `Use lswh. This\
    \ command displays the logical name of the available connections.`\n2. Use `lswh`.\
    \ This command displays the logical name of the available connections.\n\nWait,\
    \ let,,,, the the the..\n\n![](rsrcZC.jpg)\n3. If you want to view the details\
    \ of the ethernet (the wired network), use the command `etht`. Here I need to\
    \ use the logical name of my ethernet which is `ens33` in my case. You may need\
    \ to install this if it does not exist.\n\n```\nsudo ettool ens33\n```\n3. Now\
    \ let’s configure our ethernet using commands. Let’s add a static IP.\n\n```\n\
    sudo ip addr add 192.168.0.200/24 dev ens33\n```\nHere, `dev` stands for the device.\n\
    This command will add an address, but it may add a secondary address if one address\
    \ is already present.\n\n4. To modify the address, let’s use a new command `ifconfig`.\
    \ First, let’s install it. How do we install a package in Ubuntu? Using the `apt-get`\
    \ command.\n\n```\nsudo apt-get net-tools\n```\nOnce it is installed, you can\
