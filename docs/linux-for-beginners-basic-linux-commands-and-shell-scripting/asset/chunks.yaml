    # Troubleshooting Installations


    Sometimes, on rare occasions, you may receive the fatal error `11 (SIGSEGV)`.
    If an operating system installation accesses a memory location that is not supposed
    to, it will be stopped from proceeding further. `SIGSEGV` stands for Segment Violation
    Signal, in other words, a segmentation fault. This indicates a hardware related
    problem. If this was due to a problem in the hard disk, you can try wiping it
    and install again. If it is due to a memory fault, swapping memory modules wil
    work. You can also try disabling CPU cache in `BIOS` and see if it helps.


    # CHAPTER 3: Linux User Management


    In this chapter you will learn:

    - `sudo` Command and Super/Root User

    - Managing Users Through GUI/CLI

    - Managing `sudoers`

    - Command Aliases

    - What is `/etc/passwd`

    - Special Bits


    In this chapter you will learn how to set up super user, how to modify the root
    user and other accounts, how to set up administrators, regular users and groups
    via the GUI, as well as from the command line.


    ## `sudo` Command


    Since you are new to the Linux operating system, you need to understand some basic
    commands in order to elevate yourself to the `su` or the super user. `sudo` command
    elevates the users to the root user providing enough permissions to perform the
    administrative tasks. However, not everyone is going to get these permissions
    by default. The users must be added to the `/etc/sudoers` file in order to use
    this command.


    ![](rsrc10Y.jpg)

    ![](rsrc114.jpg)![](rsrc119.jpg)


    Example: When you use Ubuntu first, you can take control of the root account.
    First, you need to set a password for the root and then proceed with switching
    the user.

    ![](rsrc11E.jpg)

    Yay! Now, you are the root user!


    ## Adding Users to sudo Users List


    To add a user to the sudo users list, you should use either the GUI or the `sudo
    visudo` command. Issue this command in a terminal. Run the following command:


    ```bash

    sudo visudo

    ```

    ![](rsrc11P.jpg)

    Image: `sudo` users list


    Let’s try to understand the file. There is the root user with `root ALL=(ALL)
    ALL`. The first `ALL` means that the root user can use any terminal. The second
    means root can act as any user. Final `ALL` permits the user to run all the commands.


    We can add more users with very specific control. For instance, `poweruser ALL=
    /sbin/poweroff` command will allow the `poweruser` user to turn off the system
    via any terminal.


    The next thing to learn is using the aliases. You can use several types of aliases
    in this file:

    - `Host_Alias`

    - `User_Alias`

    - `Runas_Alias`

    - `Cmnd_Alias`


    For instance, the `sudoers` file may look like the following:

    - Change the `env_reset` to `env_reset,timestamp_timeout=n`. Here you must replace
    `n` so that the session will not go any longer that the specified minutes. You
    can use `-1` to stop the timeouts.

    - By default, you do not see the password when you type when elevating to `sudo`.
    If you want to see the `*` when you type the password, use the `pwfeedback` to
    the above line. i.e., `env_reset,pwfeedback`.

    - Create the alias and set permissions. See the example below.


    ```text

    Defaults          env_reset,pwfeedback,timestamp_timeout=15

    Defaults          mail_badpass

    Defaults          secure_path="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin"

    # Host alias specification

    Host_Alias LAN = jan.contoso.com, jake. contoso.com

    Host_Alias SRV = jan.host.com, drake.host.com, jake.host.com

    Host_Alias DNET = 10.1.2.0/255.255.255.0

    # User alias specification

    User_Alias OPERATORS = dan

    User_Alias WEBADMIN = jan, sana

    User_Alias MAILADMIN = kane

    # Cmnd alias specification

    Cmnd_Alias SU = /bin/su

    Cmnd_Alias HTTPD = /etc/rc.d/init.d/httpd, /etc/rc.d/init.d/mysql

    # User privilege specification

    root   ALL=(ALL:ALL) ALL

    OPERATORS​ ALL=ALL #The operators group has all the privileges.

    jan2 DNET=(ALL)ALL#jan2 has all the permissions through the DNET network.

    # Members of the admin group may gain root privileges

    %admin ALL=(ALL) ALL

    print_operator ALL= PRINTING#print_operator can run lpc and lprm from any computer.

    # Allow members of group sudo to execute any command

    %sudo   ALL=(ALL:ALL) ALL

    ```

    ![](rsrc140.jpg)


    ## Adding a User through the GUI


    Please follow these steps in order to add a user through Ubuntu GUI:


    1. Open the `Account Settings` dialog, either through `Ubuntu Dashboard`, or by
    clicking the down-arrow located at the upper right-hand corner on your Ubuntu
    screen.

    ![](rsrc14B.jpg)

    Image: Ubuntu user account


    2. Next, click your username and then select `Account Settings` as follows.

    ![](rsrc14J.jpg)

    Image: Ubuntu account settings


    3. The following `Users` dialog will open.

    ![](rsrc14S.jpg)![](rsrc14X.jpg)

    Image: Ubuntu main user account


    4. Click the `Unlock` button located at the upper right-hand corner of the `Users`
    dialog. The following `Authentication` dialog will open for you to provide authentication
    information as an administrator because only this way you will be able to create
    or edit user accounts:

    ![](rsrc154.jpg)

    Image: Authentication request


    5. Next, provide your password and then click the `Authenticate` button. You will
    now be able to see that all the fields in the `Users` dialog are enabled for you.


    6. Click the `Add User` button. The `Add User` dialog will open for you to enter
    details of the new user you want to create.


    7. You can specify if you want to create a `Standard` or an `Administrative` user
    through this dialog. It is also important to know that it is not a good security
    practice to leave the password field empty for the new user. This way any user
    can log in and access private and secure data on your system. Let’s add `jake`
    as a new standard user.

    ![](rsrc15D.jpg)

    Image: Adding a new user


    8. Click the `Add` button, which will only be enabled when you have provided all
    the valid information in the `Add User` dialog. The new user will now be created,
    and you will be able to see it in the `Users` dialog as follows:

    ![](rsrc15M.jpg)

    Image: New standard user


    9. You can also change the group to become an `Administrator`, select a locale,
    to reset the password, to enable automatic login, and to view the account activity.


    10. To remove a user, you can use the `remove` button at the bottom right area.

