    can use all the above examples together as follows.usermod --expiredate 2020-01-31
    --append --groups root,helpdesk --home /newhome/helpdesk helpdesk --shell /bin/sh
    helpdeskLocking and Unlocking UsersIt is possible to lock and unlock users. This
    is not helpful in regular operations, but very useful in work environments.Lock
    example : usermod --lock helpdeskUnlock example : usermod --unlock  helpdeskGroup
    Management (Advanced)![](rsrc1AA.jpg)Commands:-         groupadd hr_group-        
    chown :hr_group hr.txt-         usermod -aG hr_group user1-         usermod -aG
    hr_group user2-         usermod -aG hr_group user3![](rsrc1AN.jpg)If we take another
    example where 3 users need access to a file shared by one user, the grouping becomes
    very useful and secure. Let’s assume there are 3 users,-         user1-        
    user2-         user3The user1 has a file to be shared. If you change the file
    permission by issuing the command chmod . 660 means the owner and the group can
    read/write the file. However, if we use the default group created when the user1
    is created, it will grant every other user in the same group to access all the
    files and personal data of user1\. This is where the groups are important. You
    can set other groups and apply appropriate permissions. We can implement a proper
    grouping structure to better align the sharing and security.Understanding the
    setuid, setgid, and Sticky BitThis is a permission which can be applied to files,
    i.e., to an executable file. When you do so, the other users inherit the effective
    permissions from the owner. Therefore, it raises security concerns, and such applications
    must be kept to a minimum. This permission is used with the system programs.For
    instance, let’s take usr/bin/passwd . This is responsible for changing the password
    of a user. By doing so, it modifies the file /etc/shadow . For this file the superuser
    must be able to change his and other passwords, while the others must be able
    to change their own passwords but not any other’s. Therefore, the rest of the
    users must be able to read and execute. To do so, the root must be able to specify
    accounts.![](rsrc1B1.jpg)Note the rwsr here. The s stands for the setuid . In
    this case, setuid and user’s execute bit enabled (‘s’ means it is enabled, if
    it was ‘S’ instead, it means the execute bit is disabled).When setgid bit is enabled,
    the effective GID of the real user becomes that of the group owner. Other users
    can access the file under the privilege of the group owner. If this is set on
    a directory the files created within this directory inherits the same group. New
    directories inherit the same setgui . When someone requires access to a shared
    directory, this is the best approach regardless the primary group of the file
    owner.To enable the setgid, run the following command. Replace the filename with
    the name of the original file.Command : chmod g+s [filename]To send it in octal
    form (digits), you need to set the following. Replace the directory name from
    the name of your original directory.Command : chmod 2755 [directory]![](rsrc1BC.jpg)
    ![](rsrc1BC.jpg) ![](rsrc1BH.jpg)Also note the color change of the test.txt file.![](rsrc1BP.jpg)The
    Sticky BitIf the sticky bit is enabled for files , it is ignored by the system.
    However, if it is set on a directory, it restricts users on actions, such as renaming
    and deleting, unless the user takes ownership, or becomes the root. To enable
    this bit, use one of the following commands below.Command : chmod o+t [directory]
    or chmod 1755 [directory]![](rsrc1BC.jpg) ![](rsrc1BC.jpg) ![](rsrc1C0.jpg)Also
    note the highlighted directory name in Blue.Finally, there is even more granular
    permissions we can set with other commands, such as chattr, but we will look into
    these chapters in the next book in the series.Deleting a GroupTo delete a group,
    use the groupdel command.Syntax : groupdel [group_name]Example : groupdel test2Deleting
    a UserTo delete an account, use the userdel command.Example : sudo userdel test2CHAPTER
    4 : Linux Terminals, Editors and ShellWhat you will learn in this chapterTerminal
    and TypesTerminfoConsoleThe ShellThe ManualEditorsThe TerminalIn the beginning
    of Unix and Linux, the computers those days didn’t have  graphical interfaces
    or environments. To interact with the operating system, there was a program called
    a terminal. It was mainly based on text. The early Linux versions also used an
    interface to let users interact with the operating system. It did not have advanced
    capabilities like now, or even graphical support. Therefore, it was called a dumb
    terminal. However, it provided a way to interact with the computer or remote computers.
    For security purposes, even now most servers run in text mode and interacted with
    graphical interfaces outside if required.The terminal exists with Linux and now
    has advanced capabilities, such as block-mode graphics and vector graphics. It
    supports character sets such as:-         ASCII.-         ISO-8859-1, 2, 6, 7
    and 8.-         ISO-10646 also known as Unicode.Terminals support control codes
    for the control of features in the monitor and the keyboard. It also helps to
    control the cursor location and other non-printable operations. Some of the control
    codes include:-         Carriage return.-         Arrow keys.-         Page up/down.-
            New line (line feed).In addition, it used a display buffer to hold the
    history of commands. This was known as the scroll region . As the screen scrolls,
    the terminal was able to remember those data.![](rsrc1D8.jpg)Another type of buffering
    is known as alternate screen . In this method, a terminal was able to store data
    in another screen instead of the monitor. This was the beginning of the simple
    graphics based on terminals. There was a control code to signal the terminal to
    switch the monitor between screen data and the alternate screen.During the early
    days, there were special color-based text, such as bold and underline characters,
    blinking characters, and Black characters on White backgrounds. After a while,
    color terminals were available and there were multiple control codes to control
    the behaviors related to colors.Today we are using advanced programs emulating
    those terminals. Such packages need special keys used by terminals those days.
    It is impractical for a keyboard to have a number of special keys to support terminals.
    Therefore, it is possible to map keys. However, mapping can be different from
    one system to another. There are some common keys available with most packages,
    such as the arrow keys, delete, repeat (sends the value of other keys), return
    (carriage return – similar to the enter key), break, and specific function keys
    (such as F1 to F12 in common keyboards).The TerminfoAs you now understand, there
    are many terminal emulation packages emulating various terminals. For each terminal,
    the Linux operating system must keep the control codes so that it can distinguish
    and accurately operate the codes. These characteristics are in a place as a collection
    and it is called the Terminfo database .To distinguish among the terminals, a
    folder is created to hold the set of files relating to that terminal. The folder
    is named after a character relating to the name of the terminal.In Ubuntu, the
    terminfo location is /etc/terminfo/*/*You can use the toe command to view all
    the available terminal types.Example : toe -a![](rsrc1DN.jpg)The ConsoleIn the
    early days, when you start a Linux machine, you just get a text-based console
    with a login prompt. You can authenticate and start sending commands. Modern Linux
    systems create several virtual consoles upon bootup. There can be up to 63 virtual
    consoles. You can switch between these consoles by using special key combinations
    or using the function keys of your keyboard. For instance, you could use Alt +
    Fn or Ctrl + Alt + Fn (here the simple n represents the number of a function key
    in your keyboard). In Ubuntu, you could open the text-based console by using Alt
    + Ctrl + F3\. To get back, press Alt + Ctrl + F2.![](rsrc1DW.jpg)Image: The Ubuntu
    consoleTypes of TerminalsThere are many types of terminals. We will look at a
    few popular and easy to us terminals.xtermThis is the oldest X-Windows terminal
    emulation package available. This provides DEC VT 102/220 emulation CLI and Tektronix
    4014 graphical environment.Now there are emulators, such as Eterm and ROXterm,
    which are lightweight and offers great freedom of selecting features. While Eterm
    provides more flexibility, ROXterm offers features for power users. The following
    images shows the options available with xtem.![](rsrc1E7.jpg) ​ ![A screenshot
    of text Description automatically generated](rsrc1EB.jpg)Image: xterm main and
    VT options![A screenshot of a cell phone Description automatically generated](rsrc1EG.jpg)Image:
    VT fontsKonsoleKonsole is the terminal emulator available with the KDE desktop
    environment. KDE has a menu bar similar to Windows and offers tabbed window sessions.
    These are convenient features of the Konsole. The most important feature of this
    is the Profiles . It offers saving and reusing settings of a tabbed session. It
    also offers a powerful bookmarking feature for directories and SSH. Other features
    include:-         Translucent background-         Split-view mode.-         Customizable
    color schemes and key-bindings.-         Incremental search.-         HTML compatible
    output.-         Terminal activity notifications.For a set of command line options,
    please visit [https://docs.kde.org/stable5/en/applications/konsole/command-line-options.html](https://docs.kde.org/stable5/en/applications/konsole/command-line-options.html)The
    GNOME terminalGNOME also offers its own terminal emulator package the GNOME terminal.
    By default, Ubuntu comes with the GNOME terminal. It has lots of useful options.
    Let’s find out which terminals exist with Ubuntu using a command.Run the following
    command in the emulator.update-alternatives --display x-terminal-emulator![A screenshot
    of a cell phone Description automatically generated](rsrc1F2.jpg)GNOME terminal
    offers a rich set of features and commands. It supports tabs, attach/detach tabs,
    profiles, pre-determined sizes, etc.There are new terminal emulators with cool
    features. Here is a list of those.-         Xfce4 : For XFCE desktop environments.-
            Terminator – [https://launchpad.net/terminator](https://launchpad.net/terminator)-
            Tilda - [http://tilda.sourceforge.net/tildaabout.php](http://tilda.sourceforge.net/tildaabout.php)-
            Guake (Python-based): [https://github.com/Guake/guake](https://github.com/Guake/guake)-
            Yakuake : [http://extragear.kde.org/apps/yakuake/](http://extragear.kde.org/apps/yakuake/)-
            Eterm : http://www.eterm.org/Starting the Terminal in Ubuntu (GNOME)To
    start the terminal, you can simply right click on the desktop or within a folder
    (an empty area). Terminal is also available in the docker at the left corner.
    You can also launch it from the Ubuntu software manager.The Shell in a NutshellWhat
    is the shell? I introduced the shell in a previous chapter. Shell is the user
    interface and can be accessed through the terminal. Most of the time the default
    shell is the bash shell. Bash stands for B ourne A gain SH ell. The Bourne shell
    is the original Unix shell, and this is the Linux version of it. A shell provides
    interactive access to the operating system. There were other shells such as Dash
    (bash on Debian), ksh (Korn shell), zsh (Z shell) and csh (C shell).The shell
    loads whenever you login, but it usually starts when you start the terminal program.
    If you log into a text-mode login, it loads as you log in. Depending on the user
    configuration, it loads appropriate features. We can see these configurations
    in /etc/passwd. For instance, for my account it is:jan:x:1000:1000:Jan,,,:/home/jan:/bin/bashAs
    you can see at the end of the line, /bin/bash is the shell for this user.Understanding
    the Shell PromptIf you carefully look at the terminal you will see a bunch of
    text before a blinking cursor. This is the shell prompt. For me it is:jan@jan-virtual-machine:~$As
    you see, on Ubuntu the prompt uses a ‘$’ sign. Some older systems might use ‘%’
    instead. C shell has ‘>’. Windows command prompt is similar to this if you are
    a Windows user. If a user elevates to root user (superuser) his prompt will change
    to a ‘#’.From this point onward, we will be focusing on shell and it will be your
    companion for the rest of the course. It is quite useful, and it has many things
    to offer including help files, useful tips, etc.Parts of the Prompt-         The
    username of the user who started the shell.-         Current virtual console.-
            Current working directory (here ~ represents the home directory).The default
    command prompt is controlled by an environment variable known as PS1 . Another
    environment variable PS2 controls the next-tire command prompt. To display the
    current setting for you, try the following command.echo $PS1echo $PS2![](rsrc1G2.jpg)There
    are many characters controlling the bash shell prompt. Here is a list of characters.Table:
    Bash shell character controls'
