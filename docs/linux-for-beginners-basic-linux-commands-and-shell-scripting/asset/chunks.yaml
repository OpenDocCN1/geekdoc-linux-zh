- fmt: "\n## Examples\n\n- Display the size of all the files: `df -a`\n- Display the\
    \ size of home directory of someone: `df /home/username` (replace the username\
    \ with the user’s user name). ![](rsrc2PB.jpg)\n- Display the size of a file.\
    \ This time in a more human readable format in bytes, KB, MB and GB. ![](rsrc2PG.jpg)\n\
    - Print the size in the power of 1000s. ![](rsrc2PP.jpg)\n- Display the grand\
    \ total of the size in human readable format (1024 blocks). ![](rsrc2PW.jpg)\n\
    - Display the file type: `df -T filename`\n\nA similar command exists in order\
    \ to find the disk usage. The command is `du`.\n\n### Syntax\n```\ndu [OPTION]...\
    \ [FILE]...\ndu [OPTION]... --files0-from=F\n```\n\n### Options\nSome options\
    \ are similar to the `df` command:\n- `-0`, `--null` : end each output line with\
    \ NULL\n- `-a`, `--all` : write count of all files, not just directories\n- `--apparent-size`\
    \ : print apparent sizes, rather than disk usage\n- `-B`, `--block-size=SIZE`\
    \ : scale sizes to SIZE before printing on console\n- `-c`, `--total` : produce\
    \ grand total\n- `-d`, `--max-depth=N` : print total for directory only if it\
    \ is N or fewer levels below command line argument\n- `-h`, `--human-readable`\
    \ : print sizes in human readable format\n- `-S`, `--separate-dirs` : for directories,\
    \ don’t include size of subdirectories\n- `-s`, `--summarize` : display only total\
    \ for each directory\n- `--time` : show time of last modification of any file\
    \ or directory\n- `--exclude=PATTERN` : exclude files that match PATTERN\n\n###\
    \ Examples\n- Disk usage summary of the home directory of a user: `du /home/jan`\n\
    - Viewing with human readable format. ![](rsrc2RN.jpg)\n- Grand total of disk\
    \ usage for any directory: `dh -sh` ![](rsrc2RU.jpg)\n- Disk usage for every file:\
    \ `du -a`\n- To get the disk usage of the files in a directory with the grand\
    \ total: `du -ch` ![](rsrc2S0.jpg)\n- Exclude certain files form the list. `du\
    \ -ah --exclude` ![](rsrc2S5.jpg)\n- Disk usage based on the file modification\
    \ time: `du -ah --time /home/jan/Desktop` ![](rsrc2SA.jpg)\n\n## Obtaining Disk\
    \ Partition Information\n\nThe command to use is `lsblk`. This stands for “list\
    \ block devices”. An example is below.![](rsrc2SH.jpg)\n\nTo view disk and partition\
    \ information, use the following commands. Although these commands have more uses\
    \ its out of scope of this book.\n\n### Disk Information\n- View Partition Description\
    \ – Command: `sudo fdisk -l` ![](rsrc2SS.jpg)\n- View Partition Information –\
    \ Command: `sudo parted -l` ![](rsrc2SX.jpg)\n\n## Working with Data Files\n\n\
    In this section, we will look into the commands which are used to manipulate and\
    \ organize data.\n\n### Sorting Data\nSorting is one of the most convenient uses\
    \ of data when it comes to human understandable formats. Sorting can be done according\
    \ to many patterns. For instance, from A-Z, or a-z, ascending or descending. Let’s\
    \ look at an example. The command is as you guessed, `sort`.![](rsrc2T4.jpg)\n\
    \nWhat happened here? As you see, it relies on basic rules, such as language rules.\
    \ In the first example, 1 and 0 together 1+0 is sorted like 1, then 10 then 100\
    \ and so on. If we take a look at this example, it will be easier to understand.![](rsrc2T9.jpg)\n\
    \nAs you see, it requires more clear instructions to distinguish between the general\
    \ rules and more specific rules.\n\n### Syntax\n```\nsort [OPTION]... [FILE]...\n\
    sort [OPTION]... --files0-from=F\n```\n\n### Options\nSorting command comes with\
    \ a lot of options. See man `sort` for more. These options are self-explanatory.\
    \ Let’s look at some examples.\n\n- Example: Sorting by numerical values.\n  Command:\
    \ `sort -n File1` ![](rsrc2TK.jpg)\n- Example: Sort by Months.\n  Command: `sort\
    \ -M File2` ![](rsrc2TT.jpg)\n\nYou would say, “Wow! It does not work!” What is\
    \ causing the file not to be sorted according to English? If your system uses\
    \ a different language than English, then this command will not work! In order\
    \ to fix this, you have to change the format of the selected Language by accessing\
    \ the settings panel.![](rsrc2U0.jpg)\n\nIf the format is a non-English speaking\
    \ country, change it to an appropriate format (in my case, I have selected United\
    \ States). This must be followed by a restart.![](rsrc2U6.jpg)\n\nVoila! It worked!\
    \ Another example is using the reverse order with the `-r` option.![](rsrc2UC.jpg)\n\
    \nWhen we sort, we can specify a position to start with. This is useful when a\
    \ data file has many positions. For instance, let’s look at the `/etc/passwd/`.\
    \ It has many lines similar to this. Let’s assume you want to sort by the 3rd\
    \ field. Here we will select a field separator and it is `:`. To specify the field\
    \ position, use the `-k` parameter. To specify the field separator, use the `-t`\
    \ parameter accordingly. The sorting format is numeric. The example attempts to\
    \ sort the `passwd` file by numeric user id.\n\nBefore:![](rsrc2UJ.jpg)\nAfter\
    \ `sort -t ':' -k 3 -n /etc/passwd`:![](rsrc2UP.jpg)\nIt is well sorted now.\n\
    \nLet’s use some previous commands in conjunction with `sort` command. Sort by\
    \ Disk Space example: `du -sh /home/jan | sort -nr`.\nHere, `r` indicates reverse\
    \ sort. This command (`du`) used to obtain a grand total of disk usage, sort numerically\
    \ in reverse order, and then displays the top 10 lines (by default `head` command\
    \ returns the top 10 lines).![](rsrc2UX.jpg)\n\n### Using Disk Free and Sort Command\n\
    In this example, `df -h | sort -r -k 5 -I` is able to sort the disk usage by percentage\
    \ of use.\nBefore: `df -h`![](rsrc2V4.jpg)\nAfter: `df -h | sort -nrk5`![](rsrc2V8.jpg)\n\
    As you see here, according to 5th field, it is sorted.\n\nSorting command provides\
    \ 3 advanced features:\n- Evaluating if a file is unsorted. For this use the `-c`\
    \ option. We use `sort -cn` to find out if the file is sorted. It detects the\
    \ first disorder at line. This is also true for other sorting options.![](rsrc2VE.jpg)\n\
    - We can remove duplicates when we use the `-u` option. Let’s use `sort -un File1`![](rsrc2VK.jpg)\n\
    - Finally, the `sort` command can be used to send the output to a new file. This\
    \ is also a great option. Let’s use the previous command. `sort -un File1 > File3.txt`![](rsrc2VT.jpg)\n\
    \n## Searching with grep\nWhen it comes to data handling, the most important is\
    \ undoubtedly the searching capability. Now we are going to look at `grep` command.\
    \ Searching within data is one of the most important tasks of any person who using\
    \ a computer and engaging with data handling. To find a specific word or a line\
    \ of text within a file without scrolling for hours can really save the time of\
    \ yours. Do not confuse searching for data with searching for files. `grep` is\
    \ capable of using many options and search patterns. It can even use colors for\
    \ the output (match).\n\n### Syntax\n```\ngrep [OPTIONS] PATTERN [FILE...]\n```\n\
    \n### Options\nFor options, execute the `man grep`. In the first example, we will\
    \ simply look for a word “That” in a html file.\n`grep --color \"that\" filename.html`\
    \ As you see, the output is colored with this,![](rsrc2W6.jpg)\n\n- To view line\
    \ numbers, use the `-n` option. `grep -n --color \"Wikipedia\" Wikipedia_records-.html`](rsrc2WB.jpg)\n\
    - To perform case insensitive search, use `-i`. `grep -ni --color \"Wikipedia\"\
    \ Wikipedia_records-.html`](rsrc2WH.jpg)\n- If there are multiple files, you can\
    \ search all the files with wildcards such as `*`. `grep --color \"Apr\" *.txt![](rsrc2WP.jpg)\n\
    - You can also search subdirectories recursively with `-r`. `grep --color \"Apr\"\
    \ *![](rsrc2WV.jpg)\n\n### Using Regular Expressions\nExample: Here we are using\
    \ the wildcard `.` To represent any character that will be matched. `*` means\
    \ any character or number of characters. In this case, if we take `Your.*`, the\
    \ qualified words are any word or sentence between `Your` and `account`. It can\
    \ be `Your account` or `Youraccount`. Since we use `-i` this won’t looking for\
    \ cases. `grep --color \"Your.*\" *.txt`](rsrc2X1.jpg)\n\n## Using Gzip, Bzip2\
    \ and Tar\nThe `gzip` and `bzip2` are commonly used for file compression and decompression.\
    \ If you are a Windows user, you must be familiar with `WinZip` and `WinRAR` or\
    \ `7Zip`. These command-line utilities do the same. However, the `gzip` command\
    \ uses Lempel-Ziv algorithm and is found in some algorithms Burrows-Wheeler block\
    \ sorting algorithm. Let’s take an example for each algorithm.![](rsrc2X7.jpg)\
    \ Here you can see the original file size has reduced to a significant low (168K\
    \ to 749 Bytes).![](rsrc2XC.jpg) With `bzip2` the compression is even higher than\
    \ `gzip`. Also note, the compressed file can be compressed with another algorithm.\
    \ For instance, we could compress the `gzip` file again with `bzip2`.![](rsrc2XJ.jpg)\
    \ Here, the drawback is clearly visible. The `bzip2` application was far more\
    \ efficient. To decompress, use the `-d` option.![](rsrc2XS.jpg) There is a significant\
    \ issue with these utilities. Those replace the original file (deletes). To prevent\
    \ it, use the `-k` option (keep). `bzip2 -k File1.txt`](rsrc2XY.jpg) As you are\
    \ able to see, the original file is still there.\n\n### tar\nThe `tar` command\
    \ was developed with the intention of archiving files. Nowadays, it is used for\
    \ data collection and backing up data. `tar` is used in conjunction with `gzip`\
    \ and `bzip2`. The resulting file are `tar.gz` or something similar. These are\
    \ called tar balls. The purpose of `tar` is to archive and compress the output\
    \ files. This is also useful for backing up files.\n\n### Syntax\n```\ntar [-A]\n\
    ```\n\n### Options\n- `--concatenate` : concatenate\n- `c` : create\n- `d` : diff\
    \ --compare\n- `--delete` : delete\n- `r` : append\n- `t` : list\n- `--test-label`\
    \ : test label\n- `u` : update\n- `x` : extract --get [options] [pathname ...]\n\
    \n### Examples\nExample: `tar -czvf archive_name.tar.gz /path/to/file-or-directory`\n\
    Command: `tar -czvf archive.tar.gz Test`![](rsrc2YD.jpg)\n\nYou can also list\
    \ multiple files or directories: `/home/jan/Desktop/Test` `/home/jan/Desktop/Test1`\
    \ etc. Another feature is excluding files or directories: `tar -czvf archive.tar.gz\
    \ ./ --exclude=File11.txt.bz2 --exclude=File1.txt.bz2`](rsrc2YJ.jpg) Here I am\
    \ excluding 2 archives from the tar. To untar, use the following command.\nCommand:\
    \ `tar -xzvf archive.tar.gz`\n\n## CHAPTER 7: Shell Scripting: Visiting Prerequisites\n\
    \nIn this chapter you will learn\n- Process management\n- Bash commands\n- Environment\
    \ Variables\n\n### Environment Variables\nBefore we get into the scripting deeper,\
    \ we have to learn few more certain advanced features:\n- Processes and Relationships.\n\
    - Environment Variables.\n\n### Process Management Basics\nLet’s explore the shell.\
    \ As you learned in the previous chapters, there are several shell types. To find\
    \ the shell type you can use this example.\nCommand: `cat /etc/passwd`](rsrc2Z8.jpg)\
    \ This executable resides on `/bin`. There are other shells as well. You can find\
    \ this information using `ls -lF /bin/bash`. You can find other shells using `/csh`,\
    \ `/dash` etc. The following example demonstrates this task.![](rsrc2ZD.jpg)\n\
    \n### Parent Child Relationship\nAs stated in a previous section, the `bash` shell\
    \ starts either when you log into the text-mode interface or when you launch a\
    \ terminal in GUI. This is what we called a parent shell . If we run a bash command\
    \ or something related, it spawns another shell, which is a child of the parent\
    \ shell and it also has a prompt and acts like the parent.To examine this process,\
    \ we are using a special command. It is the `ps` (process status) command.![](rsrc2ZN.jpg)![](rsrc2ZU.jpg)\
    \ Here the `UID` stands for User ID, `PID` is Process ID, `PPID` is Parent Process\
    \ ID, `C` is Process Utilization, `STIME` is Start Time, `TTY` is Time to Live,\
    \ `Time` is Total Time and finally the command executed.Here in the first image\
    \ you see the first command `ps -f`. Before that the `bash` is running and its\
    \ process ID was 4142. The other was the actual `ps -f` command.Once we execute\
    \ the bash command, it displays a set of new processes. The 2nd line of the 2nd\
    \ image shows a child process under the parent bash shell. The process ID of the\
    \ parent bash was 4142. The child bash process has 4249 as the PID. The next `ps`\
    \ command executes in this shell. To see this in the terminal in a graphical representation\
    \ we can use the `--forest` option with the `ps` command.![](rsrc301.jpg) We call\
    \ this parent child process Sub-shelling . The `ps` command is a powerful process\
    \ information utility and it can be used to examine the nesting and shell processing.##\
    \ Bash Command ParametersTable: Bash command parameters\n"
  raw: 'Examples :-         Display the size of all the files: df -a-        Display
    the size of home directory of someone: df /home/username (replace the username
    with the user’s user name).  ![](rsrc2PB.jpg)  -        Display the size of a
    file. This time in a more human readable format in bytes, KB, MB and GB.  ![](rsrc2PG.jpg)-
            Print the size in the power of 1000s.  ![](rsrc2PP.jpg)-         Display
    the grand total of the size in human readable format (1024 blocks).  ![](rsrc2PW.jpg)-
            Display the file type: df -T filenameA similar command exists in order
    to find the disk usage. The command is du .Syntax :du [OPTION]... [FILE]...du
    [OPTION]... --files0-from=FOptions : Some options are similar to the df command.-0,
    –null : end each output line with NULL-a, –all : write count of all files, not
    just directories–apparent-size : print apparent sizes, rather than disk usage.-B,
    –block-size=SIZE : scale sizes to SIZE before printing on console-c, –total :
    produce grand total-d, –max-depth=N : print total for directory only if it is
    N or fewer levels below command line argument-h, –human-readable : print sizes
    in human readable format-S, -separate-dirs : for directories, don’t include size
    of subdirectories-s, –summarize : display only total for each directory–time :
    show time of of last modification of any file or directory.–exclude=PATTERN :
    exclude files that match PATTERNExamples :-         Disk usage summary of the
    home directory of a user: du /home/jan-         Viewing with human readable format.  ![](rsrc2RN.jpg)-
            Grand total of disk usage for any directory: dh -sh  ![](rsrc2RU.jpg)-
            Disk usage for every file: du -a-        To get the disk usage of the
    files in a directory with the grand total: du -ch  ![](rsrc2S0.jpg)-         Exclude
    certain files form the list. du - ah --exclude  ![](rsrc2S5.jpg)-         Disk
    usage based on the file modification time: du -ah –time /home/jan/Desktop  ![](rsrc2SA.jpg)Obtaining
    Disk Partition InformationThe command to use is lsblk. This stands for “list block
    devices”. An example is below.![](rsrc2SH.jpg)To view disk and partition information,
    use the following commands. Although these commands have more uses its out of
    scope of this book.Disk InformationView Partition Description – Command: sudo
    fdisk -l![](rsrc2SS.jpg)View Partition Information – Command: sudo parted -l![](rsrc2SX.jpg)Working
    with Data FilesIn this section, we will look into the commands which are used
    to manipulate and organize data.Sorting DataSorting is one of the most convenient
    uses of data when it comes to human understandable formats. Sorting can be done
    according to many patterns. For instance, from A-Z, or a-z, ascending or descending.
    Let’s look at an example. The command is as you guessed, sort .![](rsrc2T4.jpg)What
    happened here? As you see, it relies on basic rules, such as language rules. In
    the first example, 1 and 0 together 1+0 is sorted like 1, then 10 then 100 and
    so on. If we take a look at this example, it will be easier to understand.![](rsrc2T9.jpg)As
    you see, it requires more clear instructions to distinguish between the general
    rules and more specific rules.Syntax : sort [OPTION]... [FILE]...sort [OPTION]...
    --files0-from=FOptions: Sorting command comes with a lot of options. See man sort
    for more. These options are self-explanatory. Let’s look at some examples.Example
    : Sorting by numerical values.Command : sort -n File1![](rsrc2TK.jpg)Example :
    Sort by MonthsCommand : sort -M File2![](rsrc2TT.jpg)You would say, “Wow! It does
    not work!”What is causing the file not to be sorted according to English? If your
    system uses a different language than English, then this command will not work!In
    order to fix this, you have to change the format of the selected Language by accessing
    the settings panel.![](rsrc2U0.jpg)Image: Changing the default formatIf the format
    is a non-English speaking country, change it to an appropriate format (in my case,
    I have selected United States). This must be followed by a restart.![](rsrc2U6.jpg)Voila!
    It worked!Another example is using the reverse order with the -r option.![](rsrc2UC.jpg)When
    we sort, we can specify a position to start with. This is useful when a data file
    has many positions. For instance, let’s look at the /etc/passwd/It has many lines
    similar to this. Let’s assume you want to sort by the 3rd field. Here we will
    select a field separator and it is ‘:’. To specify the field position, use the
    -k parameter. To specify the field separator, use the -t parameter accordingly.
    The sorting format is numeric. The example attempts to sort the passwd file by
    numeric user id.Before:![](rsrc2UJ.jpg)After sort -t '':'' -k 3 -n /etc/passwd
    :![](rsrc2UP.jpg)It is well sorted now.Let’s use some previous commands in conjunction
    with sort command.Sort by Disk Space example: du -sh /home/jan | sort -nrHere,
    r indicates reverse sort. This command (du) used to obtain a grand total of disk
    usage, sort numerically in reverse order, and then displays the top 10 lines (by
    default head command returns the top 10 lines).![](rsrc2UX.jpg)Using Disk Free
    and Sort CommandIn this example, df -h | sort -r -k 5 -I is able to sort the disk
    usage by the percentage of use.Before : df -h![](rsrc2V4.jpg)After : df -h | sort
    -nrk 5![](rsrc2V8.jpg)As you see here, according to 5th field, it is sorted.Sorting
    command provides 3 advanced features.-        Evaluating if a file is unsorted.
    For this use the -c option. We use sort -cn command to find out if the file is
    sorted. It detects the first disorder at the 6 th line as 12 is out of order.
    This is also true for other sorting options including months.![](rsrc2VE.jpg)-
           We can remove duplicates when we use the option -u . Let’s use the command
    sort -un File1  ![](rsrc2VK.jpg)-        Finally, the sort command can be used
    to send the output to a new file. This is also a great option. Let’s use the previous
    command. The new command would be sort -un File1 > File3.txt![](rsrc2VT.jpg)When
    it comes to data handling, the most important is undoubtedly the searching capability
    . Now we are going to look at the grep command.Searching with grepSearching within
    data is one of the most important tasks of any person who is using a computer
    and engaging with data handling. To find a specific word or a line of text within
    a file without scrolling for hours can really save the time of yours and the organization’s
    you work for. It has many useful options as well. Do not confuse searching for
    data with searching for files.Grep is capable of using many options and search
    patterns. It can even use colors for the output (match).Syntax : grep [OPTIONS]
    PATTERN [FILE...]Options : For options, execute the man grep command.In the first
    example, we will simply look for a word “That” in an html file.Command : grep
    --color “that” filename.htmlAs you see, the output is colored with this command,![](rsrc2W6.jpg)To
    view line numbers, use the -n option.Command : grep -n --color "Wikipedia" Wikipedia_Wikipedia\
    records\ -\ Wikipedia.html ![](rsrc2WB.jpg)To perform case insensitive search,
    use -i option.Command : grep -ni --color "Wikipedia" Wikipedia_Wikipedia\ records\
    -\ Wikipedia.html![](rsrc2WH.jpg)If there are multiple files, you can search all
    the files with the use of wildcards such as ‘*’.Command : grep -in --color "Apr"
    * .txt![](rsrc2WP.jpg)You can also search subdirectories recursively with -r .Command
    : grep -in --color "Apr" *![](rsrc2WV.jpg)Using Regular ExpressionsExample : Here
    we are using the wildcard ‘.’ To represent any character that will be matched.
    ‘*’ means any character or number of characters. In this case, if we take a match
    “Your.*account”, the qualified words are any word or sentence in between the ‘Your’
    and ‘account’. It can be “Your bank account” or “Youraccount”. Since we use -in
    this won’t be looking for cases.Command :  grep -inr --color “Your.*account” *.txt![](rsrc2X1.jpg)There
    are lots of uses with grep command and we will be using it more in the next few
    chapters.Using Gzip, Bzip2 and TarThe gzip and bzip2 are commonly used for file
    compression and decompression. If you are a Windows user, you must be familiar
    with WinZip and WinRAR or even 7Zip. These command-line utilities do the same.
    However, the gzip command uses Lempel-Ziv algorithm and is found in some Microsoft
    algorithms. The other users Burrows-Wheeler block sorting algorithm. Let’s take
    an example for each algorithm.![](rsrc2X7.jpg)Here you can see the original file
    size has reduced to a significant low size (168K to 749 Bytes).![](rsrc2XC.jpg)With
    bzip2 the compression is even higher than gzip.Also note, the compressed file
    can be compressed with another algorithm. For instance, we could compress the
    gzip file again with bzip2.![](rsrc2XJ.jpg)Here, the drawback is clearly visible.
    The direct bzip2 application was far more efficient.To decompress, use the -d
    option.![](rsrc2XS.jpg)There is a significant issue with these utilities. Those
    replace the original file (deletes). To prevent it, use the -k option (keep).bzip2
    -k File1.txt![](rsrc2XY.jpg)As you are able to see, the original file is still
    there.tarThe tar command was developed with the original intention of archiving
    files. Nowadays, it is used for data collection and backing up data.Tar is used
    in conjunction with gzip and bzip2\. The resulting file are tar.gz or something
    similar. These are called tar balls . The purpose of tar is to archive and compress
    the output files. This is also useful for backing up files.tar [-] A --catenate
    --concatenate | c --create | d --diff --compare |--delete | r --append | t --list
    | --test-label | u --update |x --extract --get [options] [pathname ...]Example
    : tar -czvf archive_name.tar.gz /path/to/file-or-directoryCommand : tar -czvf
    archive.tar.gz Test![](rsrc2YD.jpg)You can also list multiple files or directories:
    /home/jan/Desktop/Test /home/jan/Desktop/Test1 etc.Another feature is excluding
    files or directories: tar -czvf archive.tar.gz ./ --exclude=File11.txt.bz2 --exclude=File1.txt.bz2![](rsrc2YJ.jpg)Here
    I am excluding 2 archives from the tar.To untar, use the following command.Command:
    tar -xzvf archive.tar.gzCHAPTER 7: Shell Scripting: Visiting PrerequisitesIn this
    chapter you will learnProcess managementBash commands​ Environment VariablesBefore
    we get into the scripting deeper, we have to learn few more certain advanced features.-
