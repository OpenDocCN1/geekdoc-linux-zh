    Example : I have 2 directories `dir1` and `dir2` on my desktop. I create a symlink
    - `dir1` to `sym`. Then I want to link `sym` to `dir2` instead. If I use `-s`
    and `-f` together (`-sf`) it does not work. The option to us here is `-n`](rsrc2BX.jpg)


    #### Unlinking

    To remove the symlinks you can use the following commands:

    - Syntax : `unlink linkname`

    - Syntax : `rm linkname`


    #### Creating Hard Links

    Now we will look at creating hard links. Hard link creates a separate virtual
    file. This file includes information about the original file and its location.

    Example : `ln test1.txt hard_link`](rsrc2C7.jpg)![](rsrc2CD.jpg)

    Here we do not see any symbolic representations. That means the file is an actual
    physical file. And if you look at the inode , you will see both files having the
    same inode number`](rsrc2CJ.jpg)

    How do we identify a hard link? Usually the files connected to a file is 1\. In
    other words, itself. If the number is 2, that means it has a connection to another
    file.

    Another example`](rsrc2CS.jpg)

    Symbolic link does not change this increment of hard link number for each file.
    See the following example`](rsrc2CX.jpg)

    What happens if the original file is removed?![](rsrc2D2.jpg)

    Now here you can see the `hard_link` has reduced to its links to 1\\. The symbolic
    link displays a broken or what we call the orphan state`](rsrc2D7.jpg)


    #### File Renaming

    Next, we will look at how file renaming works. For this the command used is `mv`.
    `mv` stands for “move”.

    Syntax : `mv [options] source dest`

    Example : `mv LICENSE LICENSE_1`

    You must be cautious when you use this command. If you do the following, what
    would happen?![](rsrc2DH.jpg)

    One advantage of this command is that you can move and rename the file all together,
    especially when you do it from one location to another.

    Example : Moving `/home/jan/Desktop/Y/snapt` to `/Desktop` while renaming it so
    `Snap`. This is similar to a cut and paste on Windows except for the renaming
    part.

    Example : `mv /home/jan/Desktop/Y/snapt/ ./Snap`](rsrc2DT.jpg)![](rsrc2DY.jpg)


    #### Removing Files

    To remove files, use `rm` command. `rm` command does not ask you if you want to
    delete the file. Therefore, you must use the `-i` option with it.

    Syntax : `rm [OPTION]... FILE...`


    #### Managing Directories

    There is a set of commands to create and remove directories:

    - To create a directory, use the `mkdir` command.

    - To remove a directory, use the `rm` command.

    Syntax : `mkdir [-m=mode] [-p] [-v] [-Z=context] directory [directory]`

    `rm [-p] [-v |verbose] [ignore-fail-non-empty] [directories ...]`

    Example : Creating a set of directories with the `mkdir` command. To create a
    tree of directories you must use `-p`. If you try without it, you won’t succeed`](rsrc2EC.jpg)

    Command: `mkdir -p ./Dir1/Child1/Child2`](rsrc2EG.jpg)

    Example : `rmdir ./Dir1/Child1/Child2`](rsrc2EM.jpg)

    To remove a directory with the `rm` command is not possible if the directory has
    files in it. You have to remove the files first in order to remove the directory.
    In this case, you can use another command to do this.

    Example : `rm -rf /Temp`](rsrc2F0.jpg)![](rsrc2F5.jpg)


    #### Managing File Content

    File content management is extremely useful for day to work. You can use several
    commands to view and manage content. Let’s look at the file command first. It
    helps us have a peak into the file and see what actually is. It can do more:

    - It provides an overview of the file.

    - It tells you if the file is a directory.

    - It tells you if the file is a symbolic link.

    - It can display file properties especially against executables.

    - It may you about the content (i.e., executed against a script).

    Syntax : `file [option] [filename`](rsrc2FJ.jpg)![](rsrc2FP.jpg)


    #### Viewing Files with cat

    To view files, you cannot use the `file` command. You can use a more versatile
    command known as `cat`.

    Syntax : `cat [OPTION] [FILE]`

    This command is an excellent tool to view a certain file or files once, parts
    of the files and especially logs.

    Example : `cat test.txt`](rsrc2FZ.jpg)

    Example : Viewing 2 files together: `cat test.txt test.txt`](rsrc2G5.jpg)

    Creating files with `cat` is also possible. The following command can create a
    file.

    Example : `cat >test`](rsrc2GB.jpg)![](rsrc2GG.jpg)

    The `cat` command can be used with 2 familiar commands used earlier: `less` and
    `more`.

    Example : `cat test.txt | more`](rsrc2GN.jpg)

    Example : `cat test.txt | less`](rsrc2GU.jpg)

    Example : Displaying a line number with `cat`: `cat -n test.txt`](rsrc2H0.jpg)

    Overwriting the Files with cat -

    You can use the redirection (standard input) operator (`>`). The following command
    will overwrite the text file. This is a useful tool, but you have to use it with
    caution. This can be performed for multiple files to obtain a single file.

    Example : `cat test.txt > text.txt`](rsrc2X.jpg)

    Appending file content with `cat` without overwriting – Since the previous command
    causes overwriting, it cannot be used if you are willing to append a content from
    one file to another.

    Example : `cat text.txt >> test.txt`](rsrc2H8.jpg)

    Example : Using standard input with `cat`: `cat < testy`](rsrc2HD.jpg)

    Using `head` and tail commands

    By default, the `head` command displays 10 lines from the top and `tail` command
    displays 10 lines from the bottom.

    Examples:

    - `head testy`

    - `tail testy`

    - `head -2 testy`

    - `tail -2 testy`](rsrc2HT.jpg)![](rsrc2HY.jpg)


    ### CHAPTER 6: Working with Disk, Media and Data Files

    In this chapter you will learn with Disks and Partitions, Working with data files,
    Sorting with `grep`, and Comping files.


    In this chapter, we will be looking into some advanced commands to monitor basic
    disk properties, manage media files, such as mounting and unmounting, and learn
    how to manage data files with more advanced commands.


    #### Working with Disks

    In the previous chapter, we discussed how Linux treats the file system and what
    the defaults are. We will briefly look into the Linux disk formats and file systems.

    Linux distributions run on the following disk formats:

    - `ext2`

    - `ext3`

    - `ext4`

    - `jfs`

    - `ReiserFS`

    - `XFS`

    - `Btrfs`


    ext2, 3, and 4

    This is the most used Linux file system nowadays. `ext` is successor of Extended
    Filesystem (etc). The second version added more improvements and addressed limitations
    of the `ext` version (used in MINIX systems). It extended the size to 16 GB to
    2 TB. `ext2` is often used with removable media. The biggest improvement was the
    journaling capability. Linux kernel 2.4.15 integrated the `ext2` file system.
    The leap was a major relief as it was very stable and did not need to check the
    disk once the machine goes through a clean shutdown. The upgrade capability from
    `ext2` to `ext3` was flawless. The third version extended the capabilities and
    the fourth version focused on performance standards. `ext4` is the current version.
    This was released with the kernel version 2.6.28 and offered backward compatibility.
    It supports 16 GB to 16 TB maximum size and provides a mechanism to turn off journaling.


    JFS

    The Journaling File System was developed by IBM for AIX UNIX. It can be used as
    an alternative to `ext4` when there are minimal system resources, especially the
    processing power.


    ReiserFS

    ReiserFS is introduced as an alternative to `ext3` with more advanced features
    and performance. It also has a faster journaling system.


    XFS

    It is a high speed JFS with parallel I/O processing.

    In the previous chapters, the logical volume manager (LVM) was introduced (the
    virtual file system). The following image is a view of the entire LVM file structure.

    ![A close up of a screen Description automatically generated](rsrc2K2.jpg)

    Image: Linux file system hierarchy

    Source: [https://en.wikipedia.org/wiki/Unix_filesystem](https://en.wikipedia.org/wiki/Unix_filesystem)


    #### Working with Disks and Media

    #### Mounting Media

    Mounting is the technique of integrating the media to the virtual file system.
    It must be accomplished before accessing the media. Some systems support automatic
    mounting, but it is good to know how to mount the media manually.

    The `mount` command is used to achieve this goal.

    Syntax : `mount -t type device dir`

    Other Syntaxes:

    `mount -a [-fFnrsvw] [-t vfstype] [-O optlist]`

    `mount [-fnrsvw] [-o option[,option]...] device|dir`

    `mount [-fnrsvw] [-t vfstype]`


    The `mount` command is used to attach the device. This command refers the `/etc/fstab`.
    The `mount` command provides the following:

    - The device name

    - The mount point

    - Filesystem type

    The type depends on the many files available. In many cases, `vfat` is the file
    system mostly. Or else it can be a CD rom with the `iso9660`.

    Example: `mount -t vfat /dev/vdb1 /mnt`](rsrc2KW.jpg)

    `mount /cd` or `mount /dev/cd`


    The `umount` command is used to unmount the device. The syntaxes are as:

    `umount [-hV]`

    `umount -a [-dflnrv] [-t vfstype] [-O options]`

    `umount [-dflnrv] {dir|device}` (Wait, I see some repetition in the source text,
    cleaning up).

