    \ and is owned by the effective group ID |\n| `-h FILE` | `FILE` exists and is\
    \ a symbolic link (same as `-L`) |\n| `-k FILE` | `FILE` exists and has its sticky\
    \ bit set |\n| `-L FILE` | `FILE` exists and is a symbolic link (same as `-h`)\
