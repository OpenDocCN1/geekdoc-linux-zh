  trans: "\n\n# 通过命令行添加用户\n\n通过 Linux 命令行管理用户和组更加方便。在本节中，我们将介绍相关的技术和示例。\n\n## Linux\
    \ 中的用户和组管理\n\nLinux 是一个多用户平台。在企业环境甚至 SOHO（小型办公/家庭办公）环境中，它通常供多个用户共享。某些用户和组织过去会让几个用户共享同一个账户。从安全和可用性的来看，这是一种危险的做法。因此，推荐的最佳实践是创建多个账户并相应分配权限。在\
    \ Linux 系统中，如果需要共享文件或目录，用户和组管理工具完全能够胜任。\n\n### Root 或超级用户权限\n\n添加新用户涉及管理您以外的账户，这需要超级用户（AKA\
    \ `root`）权限。其他用户或组管理任务也是如此，例如删除账户、更新账户以及创建和删除组。\n\n与任何其他操作系统一样，用户管理任务是 root 用户或超级用户的责任。这包括用户和组管理任务。由于账户管理需要安全保障，因此这是必须的。\n\
    \n使用以下命令执行用户管理任务：\n\n- `su`: 切换用户。\n- `sudo`: 以 root 用户身份通过提权权限执行命令。\n- `adduser`:\
    \ 向 Linux 系统添加用户。\n- `userdel`: 删除用户账户，无论是否删除用户文件。\n- `addgroup`: 添加组。\n- `delgroup`:\
    \ 组。\n- `usermod`: 此命令可在添加用户后修改用户。\n- `chage`: 此命令可以更改账户的年龄（更改有效期）。换句话说，它用于更改账户过期时间。\n\
    \n### 涉及的文件\n\n- `/etc/passwd`: 存储用户信息。\n- `/etc/shadow`: 密码加密。\n- `/etc/sudoers`:\
    \ 如果用户未列在此文件中，则既无法执行管理任务也无法提供管理授权。我们在在本章之前的某个章节已经介绍过并修改了此文件。\n- `/etc/group`:\
    \ 此文件包含所有的组信息。\n\n超级用户是全能账户，拥有执行任何操作的所有权限。它是起始也是终结。在安装操作系统后可以配置 root 用户。默认情况下，在\
    \ Ubuntu 上系统安装程序也会成为超级用户。并不适用于所有的 Linux 发行版。\n\n我们如何知道 `sudo` 是否可用？是的，它必须安装并配置。让我们使用以下命令进行验证。\n\
    \n命令：`which sudo`\n\n该命令验证并确认 `sudo` 是否存在。如果在任何情况下不存在，请使用以下命令安装：\n`apt-get install\
    \ sudo`\n\n## 添加新用户账户\n\n为了获得一些实践经验，让我们使用 Ubuntu 创建一个名为 `Test2` 的用户。使用 `su-` 命令将您的用户切换到\
    \ root 用户始终会更好。\n\n```\nsudo adduser test2\n```\n\n或者，先切换到 root 然后执行：\n\n```\n\
    add user test2\n```\n\n您将会被提示输入两次密码。然后它将被存储在 `/etc/passwd` 文件中。在该文件中，冒号被用作字段分隔符。在创建用户时，可以提供其他信息（例如：全名）。某些是可选的（电话号码等）。\n\
    \n在创建用户时，会创建一个与用户用户名相同的主组。默认情况下，该用户被分配到该组。\n\n### Sudoers - 什么是\n\nsudoers 文件在本章的早些部分介绍过。为了委托管理任务，必须授予权限。这通过将新创建的用户添加到\
    \ `/etc/sudoers` 文件来实现。在本节中，将把新创建的用户添加到 sudoers 文件中，以便授予用户执行某些任务的额外权限。\n\n1. 使用\
    \ `sudo visudo` 命令打开 `/etc/sudoers` 文件。为了保护此文件，不要使用其他编辑器打开它。最好通过切换到 root 账户来使用。这可以让操作更安全且不痛苦。通过\
    \ `visudo` 打开它，你可以确保：\n    a. 其他用户无法同时编辑该文件。\n    b. 在退出前会验证语法。\n2. 在 `/etc/sudoers`\
    \ 为新用户账户添加新条目。\n\n例如，假设你想为 `Test2` 提供超级用户权限。要完成此任务，请在 `/etc/sudoers` 的底部添加以下行：\n\
    \n`test2 ALL=(ALL) ALL`\n\n此行的格式为 `A B = (C:D) E`。让我们回顾一下：\n- `A` 代表用户名。\n- `B`\
    \ 代表当前主机或网络环境中的所有主机。\n- `C:D` 代表用户和组。\n- `E` 表示此用户允许执行的命令。\n\n## 创建命令别名\n\n不建议像之前那样直接为用户提供权限。有一种替代的、更细粒度的方法。例如，可以允许一组命令并将其应用于用户。我们通过将命令分一组来实现这一点。这组被称为别名（Alias）。\n\
    \n为了让 `helpdesk` 用户仅使用 `adduser` 和 `usermod` 而不使用其他命令，逐一列出下面的命令（使用绝对路径）。假设我们正在为名为\
    \ `helpdesk` 的账户提供权限。您可以将其应用于 `test2` 或任何您喜欢的用户：\n\n`helpdesk ALL=(ALL:ALL) /usr/sbin/adduser,\
    \ /usr/sbin/usermod`\n\n或者，定义一个别名（只要是全大写，我们可以随心命名，例如 `HELDESK`）。我们使用大写字母定义别名。方法如下：\n\
    \n`Cmnd_Alias HELDESK = /usr/sbin/adduser, /usr/sbin/usermod`\n`helpdesk ALL=(ALL:ALL)\
    \ HELDESK`\n\n除了这里指定的之外，helpdesk 将无法以 root 身份执行任何其他命令。\n\n## 切换用户\n\n现在您已经创建了用户并分配了权限，如果编辑文件后保存成功，是时候切换到该用户并一些测试了。要这样做，请使用\
    \ `su` 命令切换到该账户。正如您现在所理解的，不必坚持使用超级用户账户。您可以来回切换。这也将加强安全性。\n\n此外，可以使用 `-l` 选项提供类似于用户如果/她直接登录时期望的环境。执行以下命令：\n\
    \n```\nsu - helpdesk\n```\n\n## 更高级的命令\n\n让我们学习添加新用户的过程。为了管理工作，理论将是非常重要的。当新用户被添加到系统时，会发生以下事件和操作：\n\
    \n- 创建其/她的主目录（在 `/home` 目录下）\n- 下列文件（隐藏文件）将被复制到用户的主目录。这些文件用于提供所需的环境变量：\n    -\
    \ `.bash_logout`\n    - `.bash_profile`\n    - `.bashrc`\n\n"
- fmt: "\n- Creating a mail spool at `/var/spool/mail/username`\n- A group is created.\
    \ The name of the group is same as the username.\n\n### Understanding `/etc/passwd`\n\
    All the account information is stored in this file. A record exists per user in\
    \ the following format:\n`[username]:[x]:[UID]:[GID]:[Comment]:[Home directory]:[Default\
    \ shell]`\n\n- `[username]` is the name of the user account.\n- `x` means the\
    \ account is protected by a shadow password in `/etc/shadow`.\n- `UID` and `GID`\
    \ are User ID and Group ID.\n- The `Home directory` points to the absolute (long)\
    \ path to the user’s home directory.\n- The `Default shell` will be loaded when\
    \ the user logs in.\n\n### Understanding `/etc/group`\nThe group information is\
    \ stored in `/etc/group` file. It has the following format:\n`[Group name]:[Group\
    \ password]:[GID]:[Group members]`\n\n- `Group name` is the name of the group.\n\
    - `Group password`. If `x` is there, it is not used.\n- `GID` is the same as in\
    \ `/etc/passwd`.\n- `Group members`, a comma separated file.\n\n### Modifying\
    \ a User\nAfter adding a new user, his attributes can be modified using a special\
    \ command known as `usermod`.\nSyntax: `usermod [options] [username]`\n\nSetting\
    \ and expiry date example:\n`usermod --expiredate 2020-01-31 helpdesk`\n\nAdding\
    \ to multiple groups example:\n`usermod --append --groups root,helpdesk helpdesk`\n\
    \nChanging the home folder example:\n`usermod --home /newhome/helpdesk helpdesk`\n\
    \nChange the default shell example:\n`usermod --shell /bin/sh helpdesk`\n\n![](rsrc19Z.jpg)\n\
    \nWe can use all the above examples together as follows:\n```\nusermod --expiredate\
    \ 2020-01-31 --append --groups root,helpdesk --home /newhome/helpdesk helpdesk\
    \ --shell /bin/sh helpdesk\n```\n\n### Locking and Unlocking Users\nIt is possible\
    \ to lock and unlock users. This is not helpful in regular operations, but very\
    \ useful in work environments.\n\nLock example: `usermod --lock helpdesk`\nUnlock\
    \ example: `usermod --unlock helpdesk`\n\n### Group Management (Advanced)\n![](rsrc1AA.jpg)\n\
    \nCommands:\n- `groupadd hr_group`\n- `chown :hr_group hr.txt`\n- `usermod -aG\
    \ hr_group user1`\n- `usermod -aG hr_group user2`\n- `usermod -aG hr_group user3`\n\
    \n![](rsrc1AN.jpg)\n\nIf we take another example where 3 users need access to\
    \ a file shared by one user, the grouping becomes very useful and secure. Let’s\
    \ assume there are 3 users:\n- `user1`\n- `user2`\n- `user3`\n\nThe `user1` has\
    \ a file to be shared. If you change the file permission by issuing the command\
    \ `chmod`. `660` means the owner and the group can read/write the file. However,\
    \ if we use the default group created when the `user1` is created, it will grant\
    \ every other user in the same group to access all the files and personal data\
    \ of `user1`. This is where the groups are important. You can set other groups\
    \ and apply appropriate permissions. We can implement a proper grouping structure\
    \ to better align the sharing and security.\n\n### Understanding the setuid, setgid,\
    \ and Sticky Bit\nThis is a permission which can be applied to files, i.e., to\
    \ an executable file. When you do so, the other users inherit the effective permissions\
    \ from the owner. Therefore, it raises security concerns, and such applications\
    \ must be kept to a minimum. This permission is used with the system programs.\n\
    \nFor instance, let’s take `/usr/bin/passwd`. This is responsible for changing\
    \ the password of a user. By doing so, it modifies the file `/etc/shadow`. For\
    \ this file the superuser must be able to change his and other passwords, while\
    \ the others must be able to change their own passwords but not any other’s. Therefore,\
    \ the rest of the users must be able to read and execute. To do so, the root must\
    \ be able to specify accounts.\n\n![](rsrc1B1.jpg)\n\nNote the `rwsr` here. The\
    \ `s` stands for the `setuid`. In this case, `setuid` and user’s execute bit enabled\
    \ (`s` means it is enabled, if it was `S` instead, it means the execute bit is\
    \ disabled). \n\nWhen `setgid` bit is enabled, the effective `GID` of the real\
    \ user becomes that of the group owner. Other users can access the file under\
    \ the privilege of the group owner. If this is set on a directory the files created\
    \ within this directory inherits the same group. New directories inherit the same\
    \ `group`. When someone requires access to a shared directory, this is the best\
    \ approach regardless the primary group of the file. To enable the `setgid`, run\
    \ the following command. Replace the `filename` with the name of the original\
    \ file:\n```\nchmod g+s [filename]\n```\nTo send it in octal form (digits), you\
    \ need to set the following. Replace the directory name from the name of your\
    \ original directory:\n```\nchmod 2755 [directory]\n```\n![](rsrc1BC.jpg) ![](rsrc1BC.jpg)\
    \ ![](rsrc1BH.jpg)\n\nAlso note the color change of the `test.txt`. ![](rsrc1BP.jpg)\n\
    \n### The Sticky Bit\nIf the sticky bit is enabled for files, it is ignored by\
    \ the system. However, if it is set on a directory, it restricts users on actions,\
    \ such as renaming and deleting, unless the user takes ownership or becomes the\
    \ root. To enable this bit, use one of the following commands:\n```\nchmod o+t\
    \ [directory]\nchmod 1755 [directory]\n```\n![](rsrc1BC.jpg) ![](rsrc1BC.jpg)\
    \ ![](rsrc1C0.jpg)\n\nAlso note the highlighted directory name in Blue. Finally,\
    \ there is even more granular permissions we can set with other commands, such\
    \ as `chattr`, but we will look into these in next.\n\n### Deleting a Group\n\
    To delete a group, use the `groupdel` command.\nSyntax: `groupdel [group_name]`\n\
    Example: `groupdel test`\n\n### Deleting a User\nTo delete an account, use the\
    \ `userdel` command.\nExample: `sudo userdel test`\n\n# CHAPTER 4 : Linux Terminals,\
    \ Editors and Shell\n\nWhat you will learn in this chapter\n- Terminal and Types\n\
    - Terminfo\n- Console\n- The Shell\n- Editors\n\n### The Terminal\nIn the beginning\
    \ of Unix and Linux, the computers those days didn’t have graphical interfaces.\
    \ To interact with the operating system, there was a program called a terminal.\
    \ It was mainly based on text. The early Linux versions also used an interface\
    \ to let users interact with the operating system. It did not have advanced capabilities\
    \ like now, or even graphical support. Therefore, it was called dumb terminal.\
    \ For security purposes, even now most servers run in text mode and interacted\
    \ with graphical interfaces outside if required. The terminal exists with Linux\
    \ and now has advanced capabilities, such as block-mode graphics and vector graphics.\
    \ It supports character sets such as:\n- ASCII\n- ISO-8859-1, 2, 6, 7 and 8\n\
    - ISO also known as Unicode\n\nTerminals support control codes for the control\
    \ of features in the monitor and the keyboard. It also helps to control the cursor\
    \ location and other non-printable operations. Some of the control codes include:\n\
    - Carriage return\n- Arrow keys\n- Page up/down\n- New line (line feed)\n\nIn\
    \ addition, it used a display buffer to hold the history of commands. This was\
    \ known as the scroll region. As the screen scrolls, the terminal was able to\
    \ remember those data. ![](rsrc1D8.jpg)\n\nAnother type of buffering is known\
    \ as alternate screen. In this method, a terminal was able to store data in another\
    \ screen instead of the monitor. This was the beginning of the simple graphics\
    \ based on terminals. There was a control code to signal the terminal to switch\
    \ the monitor between screen data and the alternate screen.\n\nDuring the early\
    \ days, there were special color-based text, such as bold and underline characters,\
    \ blinking characters, and Black on White backgrounds. After a while, color terminals\
    \ were available and there were multiple control codes to control the behaviors\
    \ related to colors. Today we are using advanced programs emulating those terminals.\
    \ Such packages need special keys used by terminals those days. It is impractical\
    \ for a keyboard to have a number of special keys to support terminals. Therefore,\
    \ it is possible to map keys. However, mapping can be different from one system\
    \ to another. There are some common keys available with most packages, such as\
    \ the arrow keys, delete, repeat (sends the value of other keys), return (carriage\
    \ return – similar to the enter key), break, and specific function keys (such\
    \ as F1 to F12 in common keyboards).\n\n### Terminfo\nAs you now understand, there\
    \ are many terminal emulation packages emulating various terminals. For each terminal,\
    \ the Linux operating system must keep the control codes so that it can distinguish\
    \ and accurately operate the codes. These characteristics are in a place as a\
    \ collection and it is called the Terminfo database. To distinguish among the\
    \ terminals, a folder is created to hold the set of files relating to that terminal.\
    \ The folder is named after a character relating to the name of the terminal.\
    \ In Ubuntu, the terminfo location is `/etc/terminfo/*/*`.\n\nYou can use the\
    \ `toe` command to view all the available terminal types.\nExample: `toe -a`![](rsrc1DN.jpg)\n\
    \n### The Console\nIn the early days, when you start a Linux machine, you just\
    \ get a text-based console with a login prompt. You can authenticate and start\
    \ sending commands. Modern Linux systems create several virtual consoles upon\
    \ bootup. There can be up to 63 virtual consoles. You can switch between these\
    \ consoles by using special key combinations or using the function keys of your\
    \ keyboard. For instance, you could use `Alt + Fn` or `Ctrl + Alt + Fn` (here\
    \ the simple `n` represents the number of a function key in your keyboard). In\
    \ Ubuntu, you could open the text-based console by using `Alt + Ctrl + F3`. To\
    \ get back, press `Alt + Ctrl + F2`.rsrc1DW.jpg)\n\n### Types of Terminals\nThere\
    \ are many types of terminals. We will look at a few popular and easy to terminals.\n\
    \n**xterm**: This is the oldest Windows terminal emulation package available.\
    \ This provides DEC VT100 CLI and Tektronix. Now there are emulators, such as\
    \ `Eterm` and `ROterm`, which are lightweight and offers great freedom of selecting\
    \ features. While `E` provides more flexibility, `ROterm` offers features for\
    \ power users. The following images shows the options available with xterm. ![](rsrc1E7.jpg)\
    \ ![](rsrc1EB.jpg) ![](rsrc1EG.jpg)\n\n**Konsole**: Konsole is the terminal emulator\
    \ available with KDE desktop environment. KDE has a menu bar similar to Windows\
    \ and offers tabbed window. These are convenient features:\n- Translucent background\n\
    - Split-view mode\n- Customizable color schemes and key-bindings\n- Incremental\
    \ search\n- HTML compatible output\n- Terminal notifications\n\nFor a set of command\
    \ line options, please visit `https://docs.kde.org/stable/applications/konsole/command-line-options.html`.\n\
    \n**GNOME terminal**: GNOME also offers its own terminal package the GNOME terminal.\
    \ By default, Ubuntu comes with GNOME terminal. It has lots of useful options.\
    \ Let’s find out which terminals exist with Ubuntu using a command. Run the following\
    \ command in the emulator:\n```\nupdate-alternatives --display x-terminal-emulator\n\
    ```\n![](rsrc1F2.jpg) GNOME terminal offers a rich set of features and commands.\
    \ It supports tabs, attach/detach tabs, profiles, pre-determined sizes, etc. There\
    \ are new terminal emulators with cool features. Here is a list of those:\n- **Xfce**:\
    \ For XFCE desktop environments.\n- **Terminator**: `https://launchpad.net/terminator`\n\
    - **Tilda**: `http://tildasourceforge.net/tildaabout.php`\n- **Guake (Python-based)**:\
    \ `https://github.com/Guake/guake`\n- **Yakuake**: `http://extragear.kde.org/apps/yakuake/`\n\
    - **Eterm**: `http://www.eterm.org`\n\n### Starting the Terminal in Ubuntu (GNOME)\n\
    To start the terminal, you can simply right click on the desktop or within a folder\
    \ (an empty area). Terminal is also available in the docker at the left. You can\
    \ also launch it from the Ubuntu software manager.\n\n### The Shell in a Nutshell\n\
    What is the shell? I introduced the shell in a previous chapter. Shell is the\
    \ user interface and can be accessed through the terminal. Most of the time the\
    \ default shell is the bash shell. Bash stands for Bourne Again Shell. The Bourne\
    \ shell is the original Unix shell, and this is the Linux version of it. A shell\
    \ provides interactive access to the operating system. There were other shells\
    \ such as Dash (bash on Debian), `ksh` (Korn shell), `zsh` (Z shell) and `csh`\
    \ (C shell).\n\nThe shell loads whenever you login, but it usually starts when\
    \ you start the terminal program. If you log into a text-mode login, it loads\
    \ as you log in. Depending on the user configuration, it loads appropriate features.\
    \ We can see these configurations in `/etc/passwd`. For instance, for my account\
    \ it is:\n`jan:x:1000:1000:Jan,,,:/home/jan:/bin/bash`\nAs you can see at the\
    \ end of the line, `/bin/bash` is the shell for this user.\n\n### Understanding\
    \ the Shell Prompt\nIf you carefully look at the terminal you will see a bunch\
    \ of text before a blinking cursor. This is the shell prompt. For me it is:\n\
    `jan@jan-virtual-machine:~$`\n\nAs you see, on Ubuntu the prompt uses a `$` sign.\
    \ Some older systems might use `%` instead. C shell has `>`. Windows command prompt\
    \ is similar to this if you are a Windows user. If a user elevates to root user\
    \ (superuser) his prompt will change to a `#`. From this point onward, we will\
    \ be focusing on shell and it will be your companion for the rest of the course.\
    \ It is quite useful, and it has many things to offer including help files, useful\
    \ tips, etc.\n\n Parts of the Prompt\n- The username of the user who started the\
    \ shell.\n- Current virtual console.\n- Current working directory (here `~` represents\
    \ the home directory).\n\nThe default command prompt is controlled by an environment\
    \ variable known as `PS1`. Another environment variable `PS2` controls the next-tire\
    \ command prompt. To display the current setting for you, try the following command:\n\
    ```\necho $PS1\necho $PS2\n```\n![](rsrc1G2.jpg)\n\nThere are many characters\
    \ controlling the bash shell prompt. Here is a list of characters. Table: Bash\
    \ shell character controls\n"
