  trans: "\n\n# case 命令\n\n当存在长长的 `if-then-else` 语句时，`case` 命令非常有用。通过 `case` 命令，可以将阶段表示为不同的\
    \ case。\n\n语法：\n```bash\ncase $variable-name in\npattern1)\n    command1...commandN;;\n\
    patternN)\n    command1...commandN;;\n*)\n    esac\n```\n你也可以使用 `pattern1|pattern2|pattern3)`\
    \ 来匹配多个模式，而不是单个模式。`case` 命令可用于高度高级的决策结构。\n\n### 高级示例：\n```bash\n#!/bin/bash\n\
    if [ -z $1 ] #如果运行脚本时没有参数\nthen\n  rental=\"Unknown vehicle\"\nelif [ -n $1 ]\n\
    then\n  # 如果提供了参数，则将其作为租赁\n  rental=$1\nfi\n# 使用 case 语句进行租赁决策\ncase $rental in\n\
    \"car\") echo \"For $rental rental is $25 per k/m.\";;\n\"van\") echo \"For $rental\
    \ rental is$20 per k/m.\";;\n\"jeep\") echo \"For $rental rental is $18 per k/m.\"\
    ;;\n\"bicycle\") echo \"For $rental rental $1 per k/m.\";;\n*) echo \"Sorry, no\
    \ $rental rental is available for you!\";;\nesac\n```\n执行此脚本与之前的脚本有所不同。要执行它，你必须在执行命令中提供一个参数![](img/rsrc43B.jpg)\n\
    \n### 另一个示例：\n```bash\n#!/bin/bash\ncase $USER in\nroot) echo \"Welcome Superuser\"\
    ;;\njan | jake) echo \"Welcome administrator!\";;\ntestuser) echo \"Welcome test!\
    \ Please use the dev board for reporting\";;\n*) echo \"Access is denied!\";;\n\
    esac\n```\n![](img/rsrc43W.jpg)\n\n# for 命令\n\n在脚本编写中，你经常会遇到命令迭代或循环的需求。例如，当你从一个文件或一组文件中读取内容时，这变得非常有用。\n\
    \n语法：\n```bash\nfor var in list\ndo\n    commands\ndone\n```\n在这里，`var` 变量持有当前列表项的值。在一次完整迭代结束后，它持有最后一次迭代的值。\n\
    \n### 基础示例：\n```bash\n#!/bin/bash\nfor i in {1..5}\ndo\n  echo \"Welcome $i times\"\
    \ndone\n```\n![](img/rsrc44H.jpg)\n`for` 命令可以用于以下方法。这主要用于编程中。\n\n### C 风格命令\n\n\
    以下语法被称为 C 风格。在 C 编程语言中，这种表达式风格用于循环等。\n\n语法：\n```bash\nfor (( EXP1; EXP2; EXP3\
    \ ))\ndo\n    command1\n    command2\n    command3\ndone\n```\n\n### 示例：\n```bash\n\
    #!/bin/bash\nfor (( a=0; a<=5; a++ ))\ndo\n  echo \"Welcome $a times\"\ndone\n\
    ```\n![](img/rsrc456.jpg)\n我们甚至可以利用多个表达式。例如，我们可以使用：\n`for (( a=0, b=9; a<=5; a++,b--))`\n\
    \n### 带有 IF 命令的 for\n\n可以将 `for` 与 `if` 结合，以便在满足条件时退出循环。它还有其他用途。例如，当你想要查找一个文件时，可以使用\
    \ `for` 循环搜索文件名。通过使用 `if`，你可以在找到文件时结束循环。\n\n### 高级示例：\n```bash\n#!/bin/bash\n\
    for file in /etc/*\ndo\n  if [ \"${file}\" == \"/etc/resolv.conf\" ]\n  then\n\
    \    countNameservers=$(grep -c nameserver /etc/resolv.conf)\n    line=$(grep\
    \ -n nameserver /etc/resolv.conf)\n    lineNumber=${line%:*}\n    echo \"Total\
    \ ${countNameservers} nameservers defined in ${file}\"\n    head -n $lineNumber\
    \ /etc/resolv.conf | tail -1\n    #echo $varRes\n    break\n  fi\ndone\n```\n\
    这是一个复杂的示例。它搜索名称解析表（文件）。找到它后，它计算 nameserver 的数量并输出计数。它通过将行号赋给行变量，然后从字符串中获取行号来显示\
    \ nameserver 列表（该字符串在冒号之前是行号）。然后我们使用 `head` 和 `tail` 命令显示条目。\n![](img/rsrc45Z.jpg)\n\
    \n当你使用 `for` 循环时，记住不要使用某些表达式，例如带有 `` ` 符号的字符串。这会搞乱输出。也不要在字符串中使用包含多个单词的值，因为 `for`\
    \ 命令会假设每个列表项是用空格分隔的。如果你将 `New Name` 作为一个单个列表项，它会将其视为两个项。你需要根据情况使用 `\"\"`。\n\n\
    正如你之前做的那样，你可以从变量中读取列表。例如：\n```bash\n#!/bin/bash\nlist=\"Car Bus Bike Helicopter\"\
    \nfor vehicle in $list\ndo\n  echo \"Have you ever traveled back home by $vehicle?\"\
    \ndone\n```\n![](img/rsrc46D.jpg)\n它也可以用于从命令中读取值。\n\n### 示例：在此示例中，我们使用一个包含车辆列表的文件。\n\
    ```bash\n#!/bin/bash\nlist=\"vehicles\"\nfor vehicle in $(cat $list)\ndo\n  echo\
    \ \"Travel home by $vehicle\"\ndone\n```\n![](img/rsrc46U.jpg)\n如果存在像 Aston Martin\
    \ 这样的名称会发生什么？再次，`for` 命令会破坏输出。为了解决这个问题，引入了分隔符。\n\n### 字段分隔符\n\n分隔符可以是空格、制表符，甚至是换行符。有一个名为\
    \ `Internal Field Separator (IFS)` 的环境变量。这是之前问题的根源。为了解决这个问题，可以定义自己的分隔符。\n\n```bash\n\
    #!/bin/bash\nlist=\"vehicles\"\nIFS=$'\\n' # 定义我们所需的字段分隔符\nfor vehicle in $(cat\
    \ $list)\ndo\n  echo \"Travel by $vehicle\"\ndone\n```\n![](img/rsrc47G.jpg)\n\
    `for` 的另一个有用功能是支持通配符。这通常用于搜索文件。例如，可以使用 `for file in /home/*`。\n\n# while 命令\n\n\
    `while` 命令比 `for` 更灵活，类似于 `if-then-else`。\n\n语法：\n```bash\nwhile test\ndo\n  \
    \  other commands\ndone\n```\n`while` 循环只要退出码为零，就会一直运行。如果不是，它将中断迭代并结束循环。\n\n###\
    \ 示例：\n```bash\n#!/bin/bash\nnum1=5\nwhile [ $num1 -gt 0 ]\ndo\n  echo $num1\n\
    \  num1=$[num1 - 1 ]\ndone\n```\n![](img/rsrc48A.jpg)\n\n# until 命令\n\n`until`\
    \ 命令可以被视为 `while` 命令的反相反。\n\n语法：\n```bash\nuntil test\ndo\n    other commands\n\
    done\n```\n\n### 示例：\n```bash\n#!/bin/bash\nvar1=10\nuntil [ $var1 -eq 0 ]\ndo\n\
    \  echo $var1\n  var1=$[var1 - 2 ]\ndone\n```\n![](img/rsrc48Y.jpg)\n\n# break\
    \ 和 continue 命令\n\n控制循环是脚本编写的基本要求。`break` 命令直接跳出循环。它可以与 `if-then-else`、`while`\
    \ 和 `until` 命令配合使用。另一方面，`continue` 命令跳过当前迭代并进入下一次。但它不会完全中断循环。\n\n```bash\n#!/bin/bash\n\
    for i in 1 2 3 4 5 6 7 8 9\ndo\n  if [ $i -eq 5 ]\n  then\n    echo “skipping\
    \ 5th iteration…”\n    continue\n  fi\n  echo “I is equal to $i”\ndone\n```\n\
    ![](img/rsrc49.jpg)\n这结束了关于结构化命令和条件的课程。在最后，我们将查看一个现实场景，以便你实践所学的知识。\n\n### 示例：创建一组用户\n\
    \n如果你一直担任管理员工作，你可能已经使用过批量更新创建用户的方法。在这种情况下，我们通常使用文本文件或逗号分隔的文件（如果是 Windows 用户则使用电子表格）。在本示例中，我们将使用此类文件并创建多个用户。创建用户时，你必须访问文件，检查用户是否存在，并迭代到文件末尾。文件中将以下字段：`username,fn`。在这里，`fn`\
    \ 代表全名。正如你注意到的，逗号分隔的文件与默认字段分隔符不匹配。在这种情况下，我们需要使用自己的分隔符 `IFS=','`。\n\n```bash\n\
    #!/bin/bash\ninp=\"/home/jan/Desktop/users\"\nwhile IFS=',' read -r uid fn\ndo\n\
    \  echo \"adding $uid\"\n  useradd -c \"$fn\" -m $uid\ndone < $inp\n```\n![](img/rsrc4A6.jpg)\
    \ 第 9 章：函数简介\n\n在本章中，你将学习：\n- 什么是函数\n- 参数和选项\n- `getopt(s)`\n- 写函数\n- 处理函数（退出状态、参数、变量和数组）\n\
    \n### GAWK 基础\n\n在进入函数之前，本节将讨论一些重要主题，从处理用户输入开始。处理用户输入在实际场景中是关重要的。当需要处理来自用户的数据和输入时，交互式脚本非常有用。Linux\
    \ 提供了几个命令行参数、选项以及处理直接输入（例如从键盘）。\n\n你已经意识到在执行 shell 脚本时启动值是如何传递的。例如，我们带有 `car`\
    \ 值执行了 `./Myscript`。它为该输入提供了特定信息。这实际上是一个交互式脚本，它能够处理用户输入。\n\n读取提供的参数由 `bash` 处理。有一个特殊变量称为位置参数。这些参数处理脚本名和另外\
    \ 8 个参数，因此可以使用自定义输入值。脚本名由 `$0` 持有。`$1 - $9` 保存剩余部分。让我们来看带有 2 个参数的简单数学方程。\n\n```bash\n\
    #!/bin/bash\nmultiplication=$[ $1 * $2 ]\necho The multiplication of $1 and $2\
    \ is $multiplication\n```\n![](img/rsrc4B1.jpg)\n它获取 `$1` 和 `$2` 并执行一个简单的数学运算。\n\
    \n### 另一个示例：\n```bash\n#!/bin/bash\nvar1=$USER\necho Welcome $var1\necho Wishing\
    \ you a happy $1\n```\n在本示例中，它获取 `$1` 并向用户显示问候。![](img/rsrc4BD.jpg)\n如果你在执行脚本时想在引号内输入多个单词，必须使用双引号。否则，它们会被视为两个项。在下一个示例中，我们将读取脚本名并根据此做决策。有一个特殊变量是\
    \ `$0`。它可能包含路径以及其他值。`basename` 命令在这些操作中非常方便。\n\n```bash\n#!/bin/bash\nvar1=$0\n\
    var2=$(basename $0)\nif [[ $var2 == \"Myscript\" ]]\nthen\n  echo This is Jan’s\
    \ script $var1\nelse\n  echo This not Jan’s script $var2\nfi\n```\n![](img/rsrc4BZ.jpg)\n\
    现在你知道如何将脚本名作为变量。你可以根据它做决策。例如，如果脚本名为 `who`，它可以运行 `who` 命令。当你带有参数运行脚本时，必须确保没有传递不准确或意外的值导致崩溃。因此，测试输入并通过\
    \ `if-then-else` 阶梯是最佳实践。\n\n# 参数计数\n\n有一个特殊变量 `$#` 用于计数参数数量。这在执行脚本时非常有用。让我们来看：\n\
    \n```bash\n#!/bin/bash\nvar1=$#\necho Number of arguments $var1\n```\n![](img/rsrc4CC.jpg)\n\
    \n### 另一个示例：仅当参数数量为 1 时计算阶乘。\n```bash\n#!/bin/bash\nvar1=$#\nnum=$1\nif [ $var1\
    \ -eq 1 ]\nthen\n  fact=1\n  while [ $num -gt 1 ]\n  do\n    fact=$((fact * num))\n\
    \    num=$((num - 1))\n  done\n  echo $fact\nelse\n  echo \"Script usage: ./Myscript\
    \ 5\"\nfi\n```\n![](img/rsrc4D0.jpg)\n还有两个提供了获取最后一个参数和脚本名的方法。这些是 `$!` 和 `${#}`。让我们运行以下脚本并获取输出。\n\
    \n```bash\n#!/bin/bash\necho $#\necho ${!}\n```\n![](img/rsrc4DF.jpg)\n\n# 移位操作\n\
    \n`shift` 命令是另一个有用命令。它将当前的位置参数左移 `n` 次。默认 `n = 1`。\n\n语法：\n```bash\nshift [n]\n\
    ```\n在下一个示例中，尝试移位提供的值：\n```bash\nshift 0\necho Param 0: $0\necho Param 1: $1\n\
    echo Param 2: $2\necho Param 3: $3\necho Param 4: $4\n```\n![](img/rsrc4EP.jpg)\n\
    现在开始移位它们：\n```bash\nshift 1\necho Param 0: $0\necho Param 1: $1\necho Param 2:\
    \ $2\necho Param 3: $3\necho Param 4: $4\n```\n![](img/rsrc4F2.jpg)\n尽管 `$0` 没有变化，但其他值已经移位。这次我们使用\
    \ `for` 循环。\n\n```bash\nfor (( i = 0; i <= 4; i++ ));\ndo\n  echo Shifting $i:\n\
    \  echo 1: $1\n  echo 2: $2\n  echo 3: $3\n  echo 4: $4\n  shift\ndone\n```\n\
    ![](img/rsrc4FG.jpg)\n在输出中，你可以看到提供的值在 5 次迭代期间是如何移位的。如果我们提供 4 个值，整个值将移位而没有任何剩余。我们可以使用这种移位来执行遍历文件夹等操作。实际示例是删除特定目录或\
    \ 3365 天的目录的文件。\n\n# 使用选项移动\n\n在上一节中，我们学习了执行时传递参数或参数。我们也可以传递选项。这些选项可以根据提供的选项做出决策。让我们来看一个示例：\n\
    ```bash\nwhile [ -n \"$1\" ]\ndo\n  case \"$1\" in\n    -x) echo \"Found a valid\
    \ option -x\" ;;\n    -y) echo \"Found a valid option -y\" ;;\n    -z) echo \"\
    Found a valid option -z\" ;;\n    *) echo \"$1 is not a valid option\" ;;\n  esac\n\
    \  shift\ndone\n```\n![](img/rsrc4G4.jpg)\n如果我们结合查找参数和选项的示例，我们可以成功获取：\n```bash\n\
    while [ -n \"$1\" ]\ndo\n  case \"$1\" in\n    -x) echo \"Found a valid option\
    \ -x\" ;;\n    -y) echo \"Found a valid option -y\" ;;\n    -z) echo \"Found a\
    \ valid option -z\" ;;\n    *) echo \"$1 is not a valid option\" ;;\n  esac\n\
    \  shift\n  count=1\n  for params in \"$@\"\n  do\n    echo \"Variable $@ Parameter\
    \ #$count = $params\"\n    count=$[count + 1 ]\n  done\ndone\n```\n(注：由于输入用户提供的原始文本中存在大量重复和乱码的占位符，我已根据逻辑提取并翻译了核心有效的技术部分。)\n\
    \n"
- fmt: "\n1. Normal operation example.\n2. Failed as the value is missing for stack\
    \ size.\n3. With full options and parameter value provided.\n4. Extra parameter\
    \ value rejected.\n5. Passed `d` as the size (it should check for numbers) and\
    \ a ‘-5’ that is invalid.\n6. Another normal operation with 3 options and a parameter\
    \ value.\n\nAs you understand, there are several issues with `getopt`. The most\
    \ prevailing is the multiple parameter values and its inability to detect two\
    \ or more as a single set when separated with a spacebar. Even if we use `\"\"\
    ` `getopt` simply does not detect a difference.\n\n### getopts to the Rescue\n\
    \nThere are two important implicit variables (environment variables) of `getopts`.\
    \ Those are:\n- `$OPTIND`\n- `$OPTARG`\n\n`$OPTIND` (OPTion INDex) is the argument\
    \ pointer to the flags (e.g., `-a`). `$OPTARG` (OPTional ARGuments) is the optional\
    \ arguments attached to a flag (e.g., `-a test`).\n\nThere are few other rules:\n\
    - If a letter is followed by a `;` it takes the option as having a parameter value.\n\
    - If the command starts with `:`\n- If options provided without `-` or `+` will\
    \ stop the processing.\n- When the `while` command is used with this, it does\
    \ not need brackets.\n\nExample: In this example, we will use `getopts` to obtain\
    \ the checksum of a file from an algorithm selection. This is the output compared\
    \ with running the commands individually.\n\n```bash\n#!/bin/bash\nUSAGE=\"Usage=\
    \ `basename $0` options [-m filename] [-s filename] -h for help. Example: ./Myscript\
    \ -m File1.txt\"\nFILENAME_M='' #This argument is provided with -m\nFILENAME_S=''\
    \ #This argument is provided with -s\nSEL='' # Records the selection from m, s\
    \ or h\nwhile getopts \"m:s:h\" opt; do #After m or s there must be a following\
    \ value\n  case \"$opt\" in\n    m)\n      FILENAME_M=\"$OPTARG\" #Assigns the\
    \ optional value\n      echo \"MD5 Selected\"\n      SEL=$opt # #SEL=m\n     \
    \ ;;\n    s)\n      FILENAME_S=\"$OPTARG\" #Assigns the optional value\n     \
    \ echo \"SHA1 Selected\"\n      SEL=$opt # #SEL=s\n      ;;\n    h)\n      echo\
    \ $USAGE && exit 0\n      ;;\n  esac\ndone\nshift $(( OPTIND - 1 ))\nif [[ $SEL\
    \ == m ]] && [[ $FILENAME_M == '' ]]; then\n  #If no filename #provided.\n  echo\
    \ \"YOU MUST PROVIDE A FILE NAME!X $USAGE\" >&2\n  exit 1\nelif [[ $SEL == m ]]\
    \ && [[ $FILENAME_M != '' ]]; then\n  #If m with filename\n  echo -----------------------------\n\
    \  md5sum < $FILENAME_M\n  echo -----------------------------\nelif [[ $SEL ==\
    \ s ]] && [[ $FILENAME_S == '' ]]; then\n  #If s without a #filename\n  echo \"\
    YOU MUST PROVIDE A FILE NAME!Y $USAGE\" >&2\n  exit 1\nelif [[ $SEL == s ]] &&\
    \ [[ $FILENAME_S != '' ]]; then\n  #If s with filename\n  echo -----------------------------\n\
    \  sha1sum < $FILENAME_S\n  echo -----------------------------\nelse\n  echo \"\
    Unable to proceed: $USAGE\"\nfi\n```\n\n### Reading User Input\n\nThe most important\
    \ interactive feature of a script or any program is taking the user input and\
    \ process it to create an effective and accurate output. To read user input in\
    \ the Linux world we use the `read` command. This command offers a set of comprehensive\
    \ options and can be used for advanced operations.\n\nSyntax: `read [-ers] [-a\
    \ array] [-d delim] [-i text] [-n nchars] [-N nchars][-p prompt] [-t timeout]\
    \ [-u fd] [name ...] [name2 ...]`\n\nTable 9.1: read command options\n\n| Option\
    \ | Description |\n| :--- | :--- |\n| `-a array` | Assign the words read to sequential\
    \ indices of the array variable `ARRAY`, starting at zero |\n| `-d delim` | Continue\
    \ until the first character of `DELIM` is read, rather than newline |\n| `-e`\
    \ | use Readline to obtain the line in an interactive shell |\n| `-i text` | Use\
    \ `TEXT` as the initial text for Readline |\n| `-n nchars` | Return after reading\
    \ `NCHARS` characters rather than waiting for a newline, but honor a delimiter\
    \ if fewer than `NCHARS` characters are read before the delimiter |\n| `-N nchars`\
    \ | Return only after reading exactly `NCHARS` characters, unless EOF is encountered\
    \ or read times out, ignoring any delimiter |\n| `-p prompt` | Output the string\
    \ `PROMPT` without a trailing newline before attempting to read |\n| `-r` | Do\
    \ not allow backslashes to escape any characters |\n| `-s` | Do not echo input\
    \ coming from a terminal |\n| `-t timeout` | Time out and return failure if a\
    \ complete line of input is not read within `t TIMEOUT` seconds. The value of\
    \ the `TMOUT` variable is the default timeout. `TIMEOUT` may be a fractional number.\
    \ If `TIMEOUT` is 0, `read` returns success only if input is available on the\
    \ specified file descriptor. The exit status is greater than 128 if the timeout\
    \ is exceeded |\n| `-u fd` | Read from file descriptor `FD` instead of the standard\
    \ input |\n"
