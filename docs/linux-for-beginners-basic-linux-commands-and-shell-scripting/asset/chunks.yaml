    # Command


    `awk -f awkflib -f script.awk /etc/passwd`


    The command was quite a success and our library file work as expected. With this
    lesson you have successfully completed all the chapters and lessons in this book.


    ## Conclusion


    Linux is gaining a rapid popularity among the enterprise users, as well as in
    schools, at home, and is used almost everywhere including servers, computers,
    mobile devices, IoT and countless other occasions. The content of this book will
    be a great source for Linux newbies and enthusiasts.


    You may have not familiar with Linux yet but I invite you to try as many practice
    examples as possible in a Linux box. It is not difficult to find a low-cost computer
    to install Linux as it is not resource-hungry. Getting your hands dirty is essential.


    You may have a Windows background and may find it difficult at some stages. There
    are many ways to change the Linux box to a Windows-like environment and the all
    the required information is included in this book. There are some debate about
    which operating system is the best. I suggest you not to go toward any judgement
    and learn what you have to so that you can master Linux as much as possible.


    If you are willing to take professional certifications there are many paths. Learning
    Linux for carrier advancement is a good decision as there are many opportunities
    in all over the world. Red Hat offers a great set of certifications on their enterprise
    platform. More information on Red Hat certification can be found here: https://www.redhat.com/en/services/training-and-certification.


    I have added multiple references in the book to help you get more information.
    Linux man pages and `--help` command are excellent sources as well.


    The next two books will provide even more knowledge in Linux and are intended
    to cover all the aspects providing you with a high-level technical knowledge of
    Linux. Until then, I wish all the readers good luck and happy coding!

