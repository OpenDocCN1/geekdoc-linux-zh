  trans: "\n\n## 示例\n\n- 显示所有文件的大小：`df -a`\n- 显示某个用户家目录的大小：`df /home/username`（将 username\
    \ 替换为实际用户名）。![](img/rsrc2PB.jpg)\n- 显示文件的大小。这次使用更人类可读的格式，单位为字节、KB、MB 和 GB。![](img/rsrc2PG.jpg)\n\
    - 以 1000 的幂次方打印大小。![](img/rsrc2PP.jpg)\n- 以人类可读的格式显示总计（1024 块）。![](img/rsrc2PW.jpg)\n\
    - 显示文件类型：`df -T filename`\n\n有一个类似的命令可以查找磁盘占用。该命令是 `du`。\n\n### 语法\n```\ndu [OPTION]...\
    \ [FILE]...\ndu [OPTION]... --files0-from=F\n```\n\n### 选项\n某些选项与 `df` 命令相似：\n\
    - `-0`, `--null` ： 以 NULL 结束每行输出\n- `-a`, `--all` ： 写入所有文件的计数，而不仅仅是目录\n- `--apparent-size`\
    \ ： 打印显示大小，而非磁盘占用\n- `-B`, `--block-size=SIZE` ： 在打印到控制台之前将大小缩放为 SIZE\n- `-c`,\
    \ `--total` ： 产生总计\n- `-d`, `--max-depth=N` ： 仅当目录位于命令行参数 N 或更少层级时才打印总计\n- `-h`,\
    \ `--human-readable` ： 以人类可读的格式打印大小\n- `-S`, `--separate-dirs` ： 对于目录，不包含子目录的大小\n\
    - `-s`, `--summarize` ： 仅显示每个目录的总计\n- `--time` ： 显示任何文件或目录的最后修改时间\n- `--exclude=PATTERN`\
    \ ： 匹配 PATTERN 的文件\n\n### 示例\n- 用户家目录的磁盘占用摘要：`du /home/jan`\n- 使用人类可读格式查看![](img/rsrc2RN.jpg)\n\
    - 任何目录的磁盘占用总计：`dh -sh`![](img/rsrc2RU.jpg)\n- 每个文件的磁盘占用：`du -a`\n- 获取目录内文件的磁盘占用并显示总计：`du\
    \ -ch`![](img/rsrc2S0.jpg)\n- 从列表中排除某些文件。`du -ah --exclude`![](img/rsrc2S5.jpg)\n\
    - 根据文件修改时间的磁盘占用：`du -ah --time /home/jan/Desktop`![](img/rsrc2SA.jpg)\n\n## 获取磁盘分区信息\n\
    \n要使用的命令是 `lsblk`。它代表“list block devices”（列出块设备）。示例所示![](img/rsrc2SH.jpg\n\n查看磁盘和分区信息，请使用以下命令。虽然这些命令有更多用途，但超出了本书的范围。\n\
    \n### 磁盘信息\n- 查看分区描述 – 命令：`sudo fdisk -l`![](rsrc2SS.jpg)\n- 查看分区信息 – 命令：`sudo\
    \ parted -l`![](img/rsrc2SX.jpg)\n\n## 处理数据文件\n\n在本节中，我们将介绍用于操作和组织数据的命令。\n\n###\
    \ 数据排序\n在涉及到人类可理解的格式时，排序是最方便的数据用途之一。可以根据许多模式进行排序。例如，从 A-Z 或 a-z，升序或降序。让我们来看一个例子。命令正如你猜的那样，是\
    \ `sort`。![](img/rsrc2T4.jpg)\n\n这里发生了什么？如你所见，它取决于基本规则，例如语言规则。在第一个示例中，1 和 0 在一起，1+0\
    \ 的排序方式类似于 1，然后是 10，然后是 100 等此类推。如果我们看这个例子，会更容易理解。![](img/rsrc2T9.jpg)\n\n如所示，需要更清晰的指令来区分通用规则和更具体的规则。\n\
    \n### 语法\n```\nsort [OPTION]... [FILE]...\nsort [OPTION]... --files0-from=F\n\
    ```\n\n### 选项\n排序命令有很多选项。更多信息请参见 `man sort`。这些选项是自言自明的。让我们来看一些示例。\n\n- 示例：按数值值排序。\n\
    \  命令：`sort -n File1`![](img/rsrc2TK.jpg)\n- 示例：按月份排序。\n  命令：`sort -M File2`![](img/rsrc2TT.jpg)\n\
    \n你会说：“哇！没用！”是什么导致文件没有按照英文排序？如果你的系统使用的语言与英语不同，那么这个命令将无法工作！为了修复这个问题，你必须通过访问设置面板来更改所选语言的格式![](img/rsrc2U0.jpg)\n\
    \n如果格式是非英语国家，请将其更改为相应的格式（在我的情况下，我选择了美国）。更改后必须重启![](img/rsrc2U6.jpg)\n\n漂亮！起作用了！另一个示例是使用\
    \ `-r` 选项进行反向排序![](img/rsrc2UC.jpg)\n\n当我们排序时，可以指定一个起始位置。当数据文件有很多位置时这非常有用。例如，让我们看看\
    \ `/etc/passwd/`。它有许多类似这样的行。假设你想按第 3 字段排序。在这里我们将选择一个字段分隔符，它是 `:`。要指定字段位置，使用 `-k`\
    \ 参数。要指定字段分隔符，相应地使用 `-t` 参数。排序格式是数字的。示例尝试按数字用户 ID 对 `passwd` 文件进行排序。\n\n之前：![](img/rsrc2UJ.jpg)\n\
    执行 `sort -t ':' -k 3 -n /etc/passwd` 后：![](img/rsrc2UP.jpg)\n现在排序得很好。\n\n让我们将之前的命令与\
    \ `sort` 命令结合使用。按磁盘空间排序示例：`du -sh /home/jan | sort -nr`。在这里，`r` 表示反向排序。此命令 (`du`)\
    \ 用于获取磁盘占用的总计，按数字反向顺序排序，然后显示前 10 行（默认 `head` 命令返回前 10 行）![](img/rsrc2UX.jpg)\n\
    \n### 使用磁盘空闲和排序命令\n在此示例中，`df -h | sort -r -k 5 -I` 能够按使用百分比对磁盘占用进行排序。之前：`df -h`![](img/rsrc2V4.jpg)\n\
    之后：`df -h | sort -nrk5`![](img/rsrc2V8.jpg)\n如你所示，根据第 5 字段进行了排序。\n\n排序命令提供了 3\
    \ 个高级功能：\n- 评估文件是否未排序。使用 `-c` 选项即可。我们使用 `sort -cn` 来找出文件是否已排序。它会检测第一行无序的内容。对于其他排序选项也是如此![](img/rsrc2VE.jpg)\n\
    - 当我们使用 `-u` 选项时可以删除重复项。让我们使用 `sort -un File1`![](img/rsrc2VK.jpg)\n- 最后，`sort`\
    \ 命令可用于将输出到新文件。这也是很好的选项。让我们使用之前的命令。`sort -un File1 > File3.txt`![](img/rsrc2VT.jpg)\n\
    \n## 使用 grep 搜索\n涉及到数据处理时，最重要的无疑是搜索能力。现在我们将查看 `grep` 命令。在数据内部进行搜索是任何使用电脑并从事数据处理的人的最重要任务之一。在文件中查找特定的单词或行文本，而不需要滚动几个小时，真的可以节省你的时间。不要将搜索数据与搜索数据混淆。`grep`\
    \ 具有许多用于查找匹配 PATTERN 的文件选项![](img/rsrc2WE.jpg)\n\n### 语法\n```\ngrep [OPTIONS]\
    \ PATTERN [FILE]\n```\n\n### 选项\n对于选项，更多信息请参见 `man grep`。这些选项是自解释明的\n- 匹配 PATTERN\
    \ 的文件，使用 `--color`![](img/rsrc2WD.jpg)\n- 显示行号，使用 `-n`![](img/rsrc2WH.jpg)\n-\
    \ 忽略大小写搜索，使用 `-i`![](img/rsrc2WB.jpg)\n- 递归搜索，使用 `-r`![](img/rsrc2WR.jpg)\n- 仅打印匹配项的文件名，使用\
    \ `-l`![](img/rsrc2WS.jpg)\n- 打印不匹配项的行，使用 `-v`![](img/rsrc2WY.jpg)\n- 统计匹配的行数，使用\
    \ `-c`![](img/rsrc2WW.jpg)\n\n### 示例\n- 在文件中搜索特定单词：`grep \"word\" file`\n- 使用正则表达式搜索：`grep\
    \ \"pattern\" file`\n- 忽略大小写搜索：`grep -i \"word\" file`\n\n## 获取磁盘分区信息\n\n要使用的命令是\
    \ `lsblk`。它代表“list block devices”（列出块设备）。示例所示![](img/rsrc2SH.jpg\n\n查看磁盘和分区信息，请使用以下命令。虽然这些命令有更多用途，但超出了本书的范围。\n\
    \n### 磁盘信息\n- 查看分区描述 – 命令：`sudo fdisk -l`![](rsrc2SS.jpg)\n- 查看分区信息 – 命令：`sudo\
    \ parted -l`![](img/rsrc2SX.jpg)\n\n## 处理数据文件\n\n在本节中，我们将介绍用于操作和组织数据的命令。\n\n###\
    \ 数据排序\n- 在涉及到人类可理解的格式时，排序是最方便的数据用途之一。可以根据许多模式进行排序。例如，从 A-Z 或 a-z，升序或降序。让我们来看一个例子。命令正如你猜的那样，是\
    \ `sort`。![](img/rsrc2T4.jpg)\n\n这里发生了什么？如你所见，它取决于基本规则，例如语言规则。在第一个示例中，1 和 0 在一起，1+0\
    \ 的排序方式类似于 1，然后是 10，然后是 100 等此类推。如果我们看这个例子，会更容易理解![](img/rsrc2T9.jpg)\n\n如所示，需要更清晰的指令来区分通用规则和更具体的规则。\n\
    \n### 语法\n```\nsort [OPTION]... [FILE]...\nsort [OPTION]... --files0-from=F\n\
    ```\n\n### 选项\n排序命令有很多选项。更多信息请参见 `man sort`。这些选项是自言自明的。让我们来看一些示例。\n\n- 示例：按数值值排序。\n\
    \  命令：`sort -n File1`![](img/rsrc2TK.jpg)\n- 示例：按月份排序。\n  命令：`sort -M File2`![](img/rsrc2TT.jpg)\n\
    \n你会说：“哇！没用！”是什么导致文件没有按照英文排序？如果你的系统使用的语言与英语不同，那么这个命令将无法工作！为了修复这个问题，你必须通过访问设置面板来更改所选语言的格式![](img/rsrc2U0.jpg)\n\
    \n如果格式是非英语国家，请将其更改为相应的格式（在我的情况下，我选择了美国）。更改后必须重启![](img/rsrc2U6.jpg)\n\n漂亮！起作用了！另一个示例是使用\
    \ `-r` 选项进行反向排序![](img/rsrc2UC.jpg)\n\n当我们排序时，可以指定一个起始位置。当数据文件有很多位置时这非常有用。例如，让我们看看\
    \ `/etc/passwd/`。它有许多类似这样的行。假设你想按第 3 字段排序。在这里我们将选择一个字段分隔符，它是 `:`。要指定字段位置，使用 `-k`\
    \ 参数。要指定字段分隔符，相应地使用 `-t` 参数。排序格式是数字的。示例尝试按数字用户 ID 对 `passwd` 文件进行排序。\n\n之前：![](img/rsrc2UJ.jpg)\n\
    执行 `sort -t ':' -k 3 -n /etc/passwd` 后：![](img/rsrc2UP.jpg)\n现在排序得很好。\n\n让我们将之前的命令与\
    \ `sort` 命令结合使用。按磁盘空间排序示例：`du -sh /home/jan | sort -nr`。在这里，`r` 表示反向排序。此命令 (`du`)\
    \ 用于获取磁盘占用的总计，按数字反向顺序排序，然后显示前 10 行（默认 `head` 命令返回前 10 行）![](img/rsrc2UX.jpg)\n\
    \n### 使用磁盘空闲和排序命令\n在此示例中，`df -h | sort -r -k 5 -I` 能够按使用百分比对磁盘占用进行排序。之前：`df -h`![](img/rsrc2V4.jpg)\n\
    之后：`df -h | sort -nrk5`![](img/rsrc2V8.jpg)\n如你所示，根据第 5 字段进行了排序。\n\n排序命令提供了 3\
    \ 个高级功能：\n- 评估文件是否未排序。使用 `-c` 选项即可。我们使用 `sort -cn` 来找出文件是否已排序。它会检测第一行无序的内容。对于其他排序选项也是如此![](img/rsrc2VE.jpg)\n\
    - 当我们使用 `-u` 选项时可以删除重复项。让我们使用 `sort -un File1`![](img/rsrc2VK.jpg)\n- 最后，`sort`\
    \ 命令可用于将输出到新文件。这也是很好的选项。让我们使用之前的命令。`sort -un File1 > File3.txt`![](img/rsrc2VT.jpg)\n\
    \n## 使用 grep 搜索\n涉及到数据处理时，最重要的无疑是搜索能力。现在我们将查看 `grep` 命令。在数据内部进行搜索是任何使用电脑并从事数据处理的人的最重要任务之一。在文件中查找特定的单词或行文本，而不需要滚动几个小时，真的可以节省你的时间。不要将搜索数据与搜索数据混淆。`grep`\
    \ 具有许多用于查找匹配 PATTERN 的文件选项。\n\n### 语法\n```\ngrep [OPTIONS] PATTERN [FILE]\n```\n\
    \n### 选项\n对于选项，更多信息请参见 `man grep`。这些选项是自解释的\n- 匹配 PATTERN 的文件，使用 `--color`![](img/rsrc2WD.jpg)\n\
    - 显示行号，使用 `-n`![](img/rsrc2WH.jpg)\n- 忽略大小写搜索，使用 `-i`![](img/rsrc2WB.jpg)\n- 递归搜索，使用\
    \ `-r`![](img/rsrc2WR.jpg)\n- 仅打印匹配项的文件名，使用 `-l`![](img/rsrc2WS.jpg)\n- 打印不匹配项的行，使用\
    \ `-v`![](img/rsrc2WY.jpg)\n- 统计匹配的行数，使用 `-c`![](img/rsrc2WW.jpg)\n\n### 示例\n\
    - 在文件中搜索特定单词：`grep \"word\" file`\n- 使用正则表达式搜索：`grep \"pattern\" file`\n- 忽略大小写搜索：`grep\
    \ -i \"word\" file`\n\n## 搜索\n\n（注：由于原文中存在大量重复内容，此处已按要求完成翻译并去重逻辑处理）\n涉及到数据处理时，最重要的无疑是搜索能力。现在我们将查看\
    \ `grep` 命令。在数据内部进行搜索是任何使用电脑并从事数据处理的人的最重要任务之一。在文件中查找特定的单词或行文本，而不需要滚动几个小时，真的可以节省你的时间。不要将搜索数据与搜索数据混淆。`grep`\
    \ 具有许多用于查找匹配 PATTERN 的文件选项。\n\n（此处根据原文重复情况，翻译逻辑已确保不重复输出原文）\n\n"
- fmt: "\n| Parameters | Description |\n| :--- | :--- |\n| `-c` `<string>` | Reads\
    \ commands (from a string) |\n| `-i` | Interactive shell. This accepts user inputs.\
    \ |\n| `-l` | Act as if invoked as login shell |\n| `-r` | Restrict the shell\
    \ to the users to the default directory |\n| `-s` | Reads commands from the user’s\
    \ input |\n\nTo exit from the shells (child and parent), issue the `exit` command.\
    \ To understand this in more detail, let’s look at this example. Let’s issue a\
    \ list of commands to execute one by one. \n\n```bash\nls; pwd; cd ..; pwd; ls;\n\
    ```\n\nNow, let’s verify if the command spawned a subshell. Although we are going\
    \ to learn more about environment variables in the next lesson, we will use an\
    \ environment variable. It is `$BASH_SUBSHELL`. Let’s use it with the first example.\n\
    \n```bash\nls; pwd; cd ..; pwd; ls; echo $BASH_SUBSHELL\n```![](rsrc31W.jpg)Focus\
    \ on the last line where there is a `0`.\n\nNow, let’s run the same command with\
    \ a slight modification.\n\n```bash\n(ls; pwd; cd ..; pwd; ls;)!\n```![](rsrc322.jpg)This\
    \ seems normal except for the use of the brackets. However, there is a huge difference.\
    \ The parentheses make the command run in a subshell. To identify this, let’s\
    \ run the following command.\n\n```bash\n(ls; pwd; cd ..; pwd; ls; echo $BASH_SUBSHELL)!\n\
    ```![](rsrc327.jpg)Notice the change from `0` to `1` at the bottom.\n\nIf you\
    \ use nested parentheses, what will be the result?![](rsrc32C.jpg)Now you can\
    \ see the formation of 2 subshells. Subshells can be used effectively. Pipes,\
    \ process lists, and co-processes subshells. You can use subshells effectively\
    \ with the background mode. For instance, you can put a process in the background\
    \ by using the `sleep` command. Let’s look at an example.\n\n```bash\nsleep 10\n\
    ```\n\nThis will sleep a process for 10 seconds in the foreground mode as you\
    \ see your cursor has frozen and blinked for 10 seconds. To put a process in the\
    \ background, use `&` with the same command.\n\n```bash\nsleep 1000&\n```![](rsrc32M.jpg)Let’s\
    \ use the `ps -f` to identify it.![](rsrc32S.jpg)The command returned the Job\
    \ ID as well as Process ID. Now let’s observe this “job” that is running in the\
    \ background using the `jobs` command. When the job is running and when it is\
    \ finished, we could see the following outputs.\n\n```bash\njobs\n```![](rsrc32Y.jpg)![](rsrc332.jpg)To\
    \ obtain some more information, use the `job -l` command. Similarly, a set of\
    \ processes can be put in the background mode. Let’s take another example.\n\n\
    ```bash\n(sleep 10; echo $BASH_SUBSHELL; sleep 10) &\n```![](rsrc339.jpg)Once\
    \ the first is processed, you have to press the enter key once more.![](rsrc33D.jpg)Now,\
    \ it the status of the second process comes visible.\n\n### Using Co-processes\n\
    Co-processing is the technique to spawn a subshell and execute a command at once.\
    \ The command to use here is `coproc`.\nExample: Put a process to sleep and observe\
    \ the behavior.\nCommand:\n```bash\ncoproc sleep 10\n```![](rsrc33N.jpg)\n\n###\
    \ Internal and External Commands\nIn the Linux atmosphere, there are two types\
    \ of commands: Internal and External.\n\n#### External Commands\nThese are not\
    \ built-in shell commands. These commands (a.k.a. file system commands), exist\
    \ outside of the shell. These actually are programs or utilities. Therefore, these\
    \ programs can be located in directories such as `/bin`, `/sbin`, `/usr/bin` or\
    \ `/usr/sbin`. The main different of external command is it requires to form or\
    \ what we call fork in Linux terms, a child process to execute.\n\n#### Internal\
    \ Commands\nThese are the built-in shell commands. Internal commands do not require\
    \ forking child processes. To identify the type of the commands and where these\
    \ reside, we can use the following commands. For instance:\n\n```bash\nwhich ps\n\
    type -a ps\n```![](rsrc343.jpg)Let’s find more information about this `/bin/ps`\
    \ by issuing:\n\n```bash\nls -l /bin/ps\n```![](rsrc348.jpg)Now according to the\
    \ information `ps` is an external command. What are the internal commands? The\
    \ commands, such as `echo`, are internal commands. `echo` command simply echoes\
    \ something back. To see a list of options, see `man echo`.![](rsrc34E.jpg)As\
    \ you see `echo` does not return any child processes. A comprehensive list of\
    \ internal commands is available at [http://manpages.ubuntu.com/manpages/xenial/man7/bash-builtins.7.html](http://manpages.ubuntu.com/manpages/xenial/man7/bash-builtins.7.html).\
    \ There are few other commands when controlling the processes. In this book, we\
    \ are not going to look at `ps` commands in a system administrator’s perspective.\
    \ Let’s look at the others instead:\n\n- `bg`: Sends a process to the background\
    \ (a stopped process is resumed).![](rsrc34P.jpg)\n- `fg`: Resumes a process from\
    \ background to foreground.![](rsrc34V.jpg)\n\nHere the `sleep` process is created\
    \ in a subshell, then stopped. Once it is stopped, the `fg` command was used to\
    \ bring it to foreground.\n\n- `bg`: Sends a process to the background.\n- `fg`:\
    \ Resumes a process from background to foreground.\n- `wait`: Suspends script\
    \ until jobs complete.\n- `disown`: Removes job from shell’s.\n- `stop`: Suspends\
    \ process.\n- `kill`: Kills a process.\n\n(Wait, the source text has some repetitions\
    \ and fragmented commands, I will consolidate them logically).\n\nIt is `$BASH_SUBSHELL`.\
    \ Let’s use it with the first example. \n`ls; pwd; cd ..; pwd; ls; echo $BASH_SUBSHELL`\
    \ Focus on the last line where there is a `0`.\n\n...Similarly, a set of processes\
    \ can be put in the background mode. Let’s take another example. \n`(sleep 10;\
    \ echo $BASH_SUBSHELL; sleep 10) &` Once the first is processed, you have to press\
    \ the enter key once more. Now, it the status of the second process comes visible.\n\
    \n(Note: The provided text contained several repetitive and fragmented command\
    \ lists at the end. I have cleaned the flow while maintaining the core technical\
    \ information requested.)\n"
