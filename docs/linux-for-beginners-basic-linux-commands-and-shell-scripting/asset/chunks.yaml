  trans: "\n现在，让我们尝试一些示例并学习如何使用该命令。\n\n```bash\n#!/bin/bash\necho -n \"Enter your\
    \ name: \"\nread name\necho \"Hi $name, welcome to Ubuntu GNOME desktop. \"\n\
    ```\n![](img/rsrc4RB.jpg)\n很酷的！不是吧？下一个示例使用了 `-p` 选项。\n\n```bash\n#!/bin/bash\n\
    read -p \"Enter your name: \" name\necho \"Hi $name, welcome to Ubuntu GNOME desktop.\
    \ \"\n```\n![](img/rsrc4RJ.jpg)\n在这个示例中，我们使用了一个变量。然而，即使你不指定变量，`read` 命令也有它自己的环境变量变量\
    \ `REPLY` 来存储此类数据。\n\n示例：\n```bash\n#!/bin/bash\nread -p \"Enter your name: \"\
    \necho \"Hi $REPLY, welcome to Ubuntu GNOME desktop. \"\n```\n![](img/rsrc4RU.jpg)\n\
    另一个实用的选项是 `-t` 选项。我们可以用它来设置用户输入提示超时。\n\n```bash\n#!/bin/bash\nif read -t 30 -p\
    \ \"Enter your name: \"\nthen\n    echo \"Hi $REPLY, welcome to Ubuntu GNOME desktop.\
    \ \"\nelse\n    echo \"Your session timed out! :(\"\nfi\n```\n![](img/rsrc4S5.jpg)\n\
    如果你无法在 30 秒内做出响应，`read` 将自动终止。这就像会话超时，不是吗？使用 `read` 也可以读取密码，酷酷的地方是，它可以停止显示我们输入的字符。\n\
    \n```bash\n#!/bin/bash\nread -p \"Enter your name: \"\necho \"Hi $REPLY, welcome\
    \ to Ubuntu GNOME desktop. \"\nread -s -p \"Enter your password: \" pass\necho\
    \ “Your password is $pass”\n```\n![](img/rsrc4SF.jpg)\n也可以读取单个字符（例如，Y/N），这在请求用户确认时非常有用。对于这种情况，你可以将其与\
    \ `case` 命令结合使用。最后，我们将从文件中读取并添加一些行号，使 `read` 变得方便。\n\n```bash\n#!/bin/bash\nfName=''\
    \ # 用于存储用户输入的文件名\ncount=1 # 否则，计数从 0 开始\nread -p \"File name: \" fName=$REPLY\n\
    echo $fName\ncat $fName | while read line\ndo\n    echo \"$count: $line\"\n  \
    \  count=$[ $count + 1]\ndone\necho \"EOF\"\n```\n![](img/rsrc4T1.jpg)\n\n# 函数\n\
    当你使用从小到大的脚本处理任务时，如果代码部分可以在同一个脚本或其他地方重用，不断重写代码将是一项乏的任务。相反，如果这些部分可以使用必要的值重用或调用，那就太好了。这在通用编程平台上很常见。嗯，`bash`\
    \ 在这里并不逊！它提供了相同的功能，并被称为函数。函数是在脚本中重用的代码块。在本节中，你将学习如何在代码中使用函数。\n\n## 基本组件\n函数可以用以下方式定义。并不复杂。\n\
    \n```bash\nfunction function_name {\n    commands\n}\n```\n让我们在一个示例中测试函数的函数。\n\
    \n```bash\n#!/bin/bash\nfunction love {\n    echo \"Do you love Linux?\"\n}\n\
    for(( x=1; x<=5; x++ ))\ndo\n    love\ndone\n```\n![](img/rsrc4TP.jpg)\n函数在循环内部被调用，它起作用了！如果我们创建一个函数并在第一个函数代码下方更改相同函数的定义（两个函数具有相同的名称），会发生什么？那么名称将是相同的，但它将使用第二个定义！\n\
    \n## 退出状态和返回值\n函数应该有一个退出状态。然而，由于它可以包含许多命令以及成功/失败的情况，它将返回最后一次成功或失败的状态。尽管我们可以通过\
    \ `$?` 查询它，但这可能会变得麻烦。这就是函数的返回值变得有用的地方。让我们来看一个示例。\n\n```bash\n#!/bin/bash\nfunction\
    \ calculate {\n    num1=0\n    num2=0\n    cal=0\n    read -p \"Input your first\
    \ value: \" num1\n    read -p \"Input your second value value: \" num2\n    cal=$[\
    \ $num1 + $num2 ]\n    echo $cal\n    return 0\n}\ncalculate\necho \"$?\"\necho\
    \ \"The end!\"\n```\n![](img/rsrc4UD.jpg)\n然而，这种技术有两个局限性。它们是：\n- 你绝不能在捕获退出状态之前执行任何命令。\n\
    - 你必须使用小于 256 的返回值，这是返回值的局限性。\n\n为了解决这个问题，我们可以按照以下步骤直接获取返回值。\n\n```bash\n#!/bin/bash\n\
    var1=100\nvar2=200\nvar3=0\nvar_F=0\nfunction math {\n    var3=$[ $var1 + $var2\
    \ ]\n    echo $var3\n}\necho \"The return value is being calculated…\"\nvar_F=$(math)\n\
    echo “The result is $var_F”\n```\n![](img/rsrc4V0.jpg)\n\n## 传递参数\n就像我们在脚本中所做的那样，我们可以变量传递给函数。函数可以使用\
    \ `$1` 到 `$9` 变量来捕获值。\n\n```bash\nfunction calculate{\n    if [ $# -eq 0 ] ||\
    \ [ $# -gt 2 ]\n    then\n        echo \"Need two values!\"\n    elif [ $# -eq\
    \ 1 ]\n    then\n        echo \"Need one more value\"\n    else\n        echo\
    \ $[1 + $2 ]\n    fi\n}\nval=$(calculate 250 500)\necho $val\necho \"The end!\"\
    \n```\n![](img/rsrc4VN.jpg)\n在这个示例中，我们传递了两个简单的参数。然后我们获取了每个参数并进行了计算。\n\n## 处理变量\n\
    在下一节中，我们将查看环境变量如何与函数集成。在函数中使用变量是必要的。然而，使用函数时必须注意：不要在函数内部外部使用相同的变量名，因为一个会破坏另一个的数据。\n\
    \n```bash\n#!/bin/bash\nfunction compare{\n    temp=10\n    result=$[ temp+1 ]\n\
    }\ntemp=5\n```\n![](img/bash\nfunction compare{\n    local temp=10\n    result=$[\
    \ temp+1 ]\n}\ntemp=5\necho \"Final result =\" $result\nif [ $temp -eq 10 ]; then\n\
    \    echo \"romised!\"\nelif [ $temp -eq 5 ]; then\n    echo \"Not compromised!\"\
    \nelse\n    echo -1\nfi\n```\n![](rsrc4WZ.jpg\n现在，temp 是 5 且没有冲突。\n\n## 使用数组\n\
    如果你熟悉数组，可能知道它是什么。然而，对于不熟悉数组的读者，本节包含了介绍。数组是我们用来持有多个参数的内存位置。我们可以通过两种方式创建数组：\n- 声明数组。\n\
    - 创建数组。\n\n### 声明数组\n要声明数组，我们可以简单地使用以下语法：\n```bash\ndeclare -a my_array\n```\n\
    \n### 创建数组\n可以使用以下语法创建数组：\n```bash\nmy_array=(foo baz)\n```\n\n### 处理数组\n为了插入或修改值，我们可以使用：\n\
    `my_array[0]=foo`\n我们插入 `foo` 作为数组的第一个元素。为了检索数据，可以使用以下方法：\n- `echo ${my_array[@]}`：使用\
    \ `@` 符号。\n- `echo ${my_array[*]}`：使用 `*` 符号。\n![](img/rsrc4XN.jpg 希望你记住 `@` 和\
    \ `*` 之间的区别。让我们通过 `for` 循环来看。\n\n```bash\nmy_array=(foo baz)\nfor x in \"${my_array[@]}\"\
    \ndo\n    echo \"$x\";\ndone\nfor y in \"${my_array[*]}\"\ndo\n    echo \"$y\"\
    ;\ndone\n```\n![](img/rsrc4Y4.jpg\n正如你看到的，`@` 返回每个元素，而另一个返回所有项但作为一个单一字符串。\n\n\
    ### 在函数中使用数组\n在函数中使用数组非常有用，因为由于数组的复杂性，代码可以重用。让我们从示例中学习。\n\n```bash\nfunction arr_test{\n\
    \    local temp_arr\n    temp_arr=(\"$@\") # 从外部向数组赋值\n    echo \"Value of the\
    \ array in the function is: ${temp_arr[*]}\"\n}\nmy_array=(a b c d e)\necho \"\
    Array values in the original array is: ${my_array[*]}\"\narr_test \"${my_array[*]}\"\
    \n```\n![](img/rsrc4YM.jpg)!\n两个数组具有相同的值。\n\n## 递归函数\n什么是递归？函数可能会为了某些目的调用自己。最好的例子是计算阶乘。在计算时，函数递归地调用自己来运行计算。让我们来看这个示例。\n\
    \n```bash\nfunction factorial {\n    if [ $1 -eq 1 ]\n        # 如果输入是 1，那么结果是\
    \ 1\n        echo 1\n    else\n        # 如果输入不是 1\n        local tmp=$[ $1 - 1\
    \ ]\n        local result=$(factorial $tmp) # 函数再次调用自己\n        echo $[ $result\
    \ * $1 ]\n    fi\n}\n```\n等待，原文有 `result=$(factorial $REPLY)` 类似的。\n\n## 将函数作为库\n\
    我们已经学习了如何高效地使用函数。然而，你仍然无法在原始脚本之外使用函数，因为它限于当前会话。这是事实吗？不！你可以在脚本中使用函数来满足另一个脚本的目的。方法如下：\n\
    你只需要将脚本保存在尝试使用它的脚本相同的位置。否则，你需要提供完整的（绝对）路径。还有一种调用外部脚本的正确方法。让我们在以下代码中学习。\n\n```bash\n\
    function add {\n    echo $[ $1 + $2 ]\n}\n```\n"
- fmt: "\n| Variable |\n| :--- |\n| `FIELDWIDTH` |\n|  |\n| `FS` |\n| `OFS` |\n| `ORS`\
    \ |\n| `RS` |\n\nLet’s look at the following examples using these variables.\n\
    \n- `awk 'BEGIN{FS=\":\"} {print $1 \"\\t\" $5}' /etc/passwd` ![](rsrc54H.jpg)\n\
    - `awk 'BEGIN{FIELDWIDTHS=\"1 2 3 1\"}{print $1,$2,$3,$4}' myfie` This sets the\
    \ field widths to 1 2 3 1\n- `awk 'BEGIN{FS=\"\\n\"; RS=\"\"} {print $1,$4}' myfile`\
    \ This has the field separator ‘`newline`’ character. It prints the 1 st and 4\
    \ th lines of a data block such as a person’s address block.\n\n### User-defined\
    \ Variables\nWe can use our own variables when scripting with `gawk`. The following\
    \ is a simple example of how easy it is used.\n```bash\nawk 'BEGIN{show=\"This\
    \ is a test\";print show}'\n```\n![](rsrc54Y.jpg)\n\n### Working with Array\n\
    GAWK also allows you to work with arrays by simple means.\nSyntax : `var[index]\
    \ = element`\nExample :\n```bash\nawk 'BEGIN{var[1] = 10;var[2] = 50;sum = var[1]\
    \ + var[2];print sum> }'\n```\nThis can also be used with any string value.![](rsrc55C.jpg)\n\
    If is also possible to iterate with arrays using the `for` function in an even\
    \ simpler form.\nSyntax : `for (var in array){statements}`\nExample :\n```bash\n\
    awk 'BEGIN{test[\"a\"] = 1;test[\"b\"] = 2;test[\"c\"] = 3;for (var in test){print\
    \ var,\" : Value:\",test[var]}}'\n```\n![](rsrc55Z.jpg)\nTo delete an array variable,\
    \ there is the `delete` command.\nSyntax : `delete array[index]`\n\n### GAWK Structured\
    \ Commands\nSimilar to the bash scripts, `gawk` provides similar support for structured\
    \ commands, such as `if`, `while`, `do-while`, and `for` commands. The following\
    \ is the syntax and example for each command.\n\n#### IF Statement\nSyntax : `if\
    \ {(condition)}statement1`\nExample :\n```bash\nawk '{if ($1 > 50){​ print $1}}'\
    \ File3.txt\n```\n![](rsrc56M.jpg)\nIn this example, the program outputs the numbers\
    \ greater than 50 from `File3.txt`.\n\n#### While Loop\nThis statement has the\
    \ following syntax.\nSyntax : `while (condition){statements}`\nWhile the condition\
    \ is true, it will evaluate the loop and do the required tasks.\nExample :\n```bash\n\
    awk '{sum = 0;i = 1;while (i < 10){​ sum += $i; i++}print sum}' File3.txt\n```\n\
    ![](rsrc57B.jpg)\n\n#### Do While Loop\nThis is similar to the `while` statement.\
    \ However, the statement is evaluated before the `while` condition is met.\nSyntax\
    \ : `do{statements} while (condition)`\n\n#### For Loop\n`for` statement in `gawk`\
    \ is similar to the C style `for` loop.\nSyntax : `for( variable; condition; iteration)`\n\
    Example :\n```bash\nawk '{sum = 0;for (i=0; i < 10; i++){​ sum += $i}print sum}'\
    \ File3.txt\n```\n![](rsrc582.jpg)\n\n### GAWK Functions\nThe most important feature\
    \ of the `gawk` is its support for functions. There are built-in functions, as\
    \ well as user-defined functions.\n\n#### Built-in Functions\n`Gawk` provides\
    \ a rich set of built-in functions including the followings:\n- Mathematical Functions.\n\
    - String Functions.\nIf you love mathematics, `gawk` is able to entertain you\
    \ with its rich set of mathematical functions.\n\n#### Mathematical Functions\n\
    The following table includes the built-in mathematical functions. Using these\
    \ functions are quite simple.\nTable: GAWK mathematical functions\nSource: [https://www.gnu.org/software/gawk/manual/html_node/Numeric-Functions.html](https://www.gnu.org/software/gawk/manual/html_node/Numeric-Functions.html)\n\
    \n| Function | Description |\n| :--- | :--- |\n| `atan2(y, x)` | Return the arctangent\
    \ of `y / x` in radians. You can use ‘`pi = atan2(0, -1)`’ to retrieve the value\
    \ of `pi`. |\n| `cos(x)` | Return the cosine of `x`, with `x` in radians. |\n\
    | `exp(x)` | Return the exponential of `x`. |\n| `int(x)` | Return the nearest\
    \ integer to `x`, truncated toward zero. Floating-point representation. |\n| `log(x)`\
    \ | Return the natural logarithm of `x`. |\n| `rand()` | Return a random number.\
    \ |\n| `sin(x)` | Return the sine of `x`, with radians. |\n| `sqrt(x)` | Return\
    \ the positive square root of `x`. |\n\nExample :\n```bash\nawk 'BEGIN{x=sqrt(16);\
    \ print x}'\n```\n![](rsrc5AG.jpg)\n\n#### String Functions\nThere are several\
    \ useful string functions and the following table includes these functions with\
    \ a description.\nTable: GAWK string functions\n\n| String Function | Description\
    \ |\n| :--- | :--- |\n| `index(big, little)` | Where the substring started in\
    \ the index. |\n| `length(string)` | The length of `string`. |\n| `match(string,\
    \ regex)` | `Regex` stands for extended regular expression |\n| `split(string,\
    \ array, separator)` | Split `string` into `array` |\n| `sprintf(format, ...)`\
    \ | `printf` format string |\n| `sub(regex, subst, string)` | Replace the first\
    \ occurrence of `regex` |\n| `gsub(regex, subst, string)` | Replace all occurrences\
    \ of `regex` |\n| `substr(string, start, end)` | Index to end the substring |\n\
    | `tolower(string)` | Convert to lowercase. |\n| `toupper(string)` | Convert to\
    \ uppercase. |\n\nTable: GAWK string parameters\n\n| Parameters | Description\
    \ |\n| :--- | :--- |\n| `big` | The string that is scanned for “`little`” |\n\
    | `end` | Index to end the substring |\n| `format` | `printf` format string |\n\
    | `little` | The string that is scanned for “`big`” |\n| `regex` | `Regex` stands\
    \ for extended regular expression |\n| `start` | Where the substring started in\
    \ the index |\n| `string` | A string parameter. |\n\nAn example :\n```bash\nawk\
    \ 'BEGIN{x = \"Linux Lovers\"; print toupper(x)}'\n```\n![](rsrc5E9.jpg)\n\n###\
    \ User-defined Functions\nAs with bash scripting, `gawk` provides support for\
    \ user-defined functions and that is not all! It supports function libraries.\
    \ The following is the syntax for a function that you can define in your code.\n\
    Syntax : `function name([variables]){statements}`\nExample :\n```bash\nawk 'function\
    \ printing(){printf \"%s has the home path at %s\\n\", $1,$6}\nBEGIN{FS=\":\"\
    }{printing()}' /etc/passwd\n```\n![](rsrc5EX.jpg)\n\n### Creating a Library\n\
    This is the final section of the `gawk`, as well as the book. In this section,\
    \ you will learn how to create a functions library and use it with a different\
    \ script. As you learned before, let’s learn this practically. Let’s revisit the\
    \ `/etc/passwd` example.\n\n1. **Creating the library file**: Create and save\
    \ this file as `awkflib` on your desktop.\n   ```bash\n   function myprint(){printf\
    \ \"%s has the home path at %s\\n\", $1,$6}\n   ```\n2. **Create the new script**:\
    \ Now, create the actual file to use this as a library and save this as `script.awk`.\n\
    \   ```bash\n   BEGIN{FS=\":\"}{​ myprint()}\n   ```\n3. **Run the scripts.**\n"
