    ![](img/rsrc3YZ.jpg)


    我们正在测试每个分支，这里是文件存在、文件不可写以及最后当它被删除或不存在时的输出。


    ### 使用布尔运算符组合测试用例

    当你编写脚本时，你可能需要为了决策比较多一个测试用例（复杂情况）。有两个运算符 `&&` 和 `||` 分别代表与（AND）和或（OR）逻辑。例如，我们可以匹配文件是否存在以及大小是否为零。


    ### 使用更多功能

    还有其他一些高级功能，例如双圆括号和双方括号，用于数学运算和高级字符串操作。我们使用双括号是为了使用内部操作，而不是让单括号产生子壳。在继续之前，有几个符号是你理解的。表
    8.3：逻辑运算符


    | 符号 | 描述 |

    | :--- | :--- |

    | ! | 逻辑取反 |

    | ~ | 位取反 |

    | & | 位与 |

    | && | 逻辑与 |

    | \| | 位或 |

    | \| | 逻辑或 |

    | ** | 幂/指数 |

    | --val | 前减 1 |

    | val-- | 后减 1 |

    | ++val | 前增 1 |

    | val++ | 后增 1 |

    | << | 位移（左） |

    | >> | 位移（右） |


