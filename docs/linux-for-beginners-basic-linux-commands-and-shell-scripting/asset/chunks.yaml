    #### Mounting Media

    Mounting is the technique of integrating the media to the virtual file system.
    It must be accomplished before accessing the media. Some systems support automatic
    mounting, but it is good to know how to mount the media manually.

    The `mount` command is used to achieve this goal.

    Syntax : `mount -t type device dir`

    Other Syntaxes:

    `mount -a [-fFnrsvw] [-t vfstype] [-O optlist]`

    `mount [-fnrsvw] [-o option[,option]...] device|dir`

    `mount [-fnrsvw] [-t vfstype]`


    The `mount` command is used to attach the device. This command refers the `/etc/fstab`.
    The `mount` command provides the following:

    - The device name

    - The mount point

    - Filesystem type

    The type depends on the many files available. In many cases, `vfat` is the file
    system mostly. Or else it can be a CD rom with the `iso9660`.

