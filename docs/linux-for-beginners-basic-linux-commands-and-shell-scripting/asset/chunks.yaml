    # System Variables


    Linux operating system uses many environment variables. Upon using the text mode
    (login), or using an interactive shell, or a non-interactive shell, `bash` looks
    for files for commands. The looked-up files depend on the method aforementioned.


    When you log into a Linux operating system, `bash` shell loads as a login shell.
    This login shell looks for 5 different files for commands. Those are, -


    - `/etc/profile`

    - `$HOME/.bash_profile`

    - `$HOME/.bashrc`

    - `$HOME/.bash_login`

    - `$HOME/.profile`


    The `/etc/profile` is the default startup file for `bash` shell. Upon login `bash`
    executes the commands in `/etc/profile`. Let’s look at the content of this file
    on Ubuntu.


    ![](rsrc38J.jpg)


    Here, you can see the invoke of `/etc/bash.bashrc`. As we discussed before, this
    contains system environment variables. You should have also noticed `/etc/profile.d`.
    This hosts application specific startup files. These files are executed when you
    log into the shell. Let’s look at the files.


    ```

    ls -l /etc/profile.d

    ```


    ![](rsrc38R.jpg)


    `$HOME` As you already detected the rest except `/etc/profile` has this in common.
    The purpose is to provide user-specific startup files to define user-specific
    variables. There is a `.` next to each and it denotes a hidden file.


    ## Interactive Shell


    Interactive shell is started when you start the `bash` shell without login into
    a system. Although this does not act like the login shell, it still accepts commands.


    If interactive shell is started, it does not need to process the `/etc/profile`.
    It directly looks for `.bashrc` file in the `HOME` directory of the user. This
    first looks for a common `bashrc` file in the `/etc` directory. Then it provides
    a place for the user to input personal command aliases and private scripts.


    ## Non-interactive Shell


    In this case, the system starts to execute a shell script, although this does
    not require any interaction, it is required to run startup commands each time
    a script is started. This is where a special global environment variable comes
    into play. This is called `BASH_ENV`.


    ```

    echo $BASH_ENV

    ```


    ![](rsrc392.jpg)


    As you notice there is nothing set. Then how does it work?


    If you can recall, some commands spawn a subshell and this child shell inherits
    parent’s exported variables.


    As you are aware, if a script does not spawn a subshell, the variables are already
    available in the current shell environment. Now even if `BASH_ENV` is not set,
    the local and global variables for the current shell is already available.


    ## Using Permanent or Persistent Environment Variables


    When you create environment variables, especially for your needs, you must store
    these in a permanent location. You might think `/etc/profile` is the best place
    for storing the global variables, but it isn’t. It can change things upon system
    activities, such as upgrades. Instead, `/etc/profile.d` can be utilized to store
    `.sh` files. For local variables, the best place would be the `.bashrc` file in
    the `HOME` directory of the user. Finally, we will discuss some details about
    the variable arrays.


    ## Variable Arrays


    Environment variables can be used as arrays. This is a great feature of environment
    variables. If you do not know what an array is, an array is a place in memory
    (a variable) that can store multiple values. Let’s look at an example.


    ```

    va_months=(Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec)

    echo $va_months

    echo ${va_months[0]}

    ```


    The first command creates the array and assigns the values. The second echoes
    the first element of the array. The third echoes the same. We can also modify
    an array item by using the following command (example).


    ```

    va_months[0]=January

    echo ${va_months[0]}

    ```


    Finally, to display all the array elements, use the `*`.


    ```

    echo ${va_months[*]}

    ```


    ![](rsrc39S.jpg)


    # CHAPTER 8: Building Scripts


    In this chapter you will learn:

    - Writing Shell scripts

    - Command aliases and substitutions

    - Pipes

    - Files, Descriptors and exit status

    - Structured commands (if, for, while, until, break, continue).


    In this chapter, you are going to gain a comprehensive understanding of script
    building with examples. The key to script building is your familiarity with commands.
    Scripting is highly advantageous, as it can process more than one command, process
    the results, and feed one result to the other building a chain.


    You already know how to execute multiple commands using `;`. For instance, `pwd;
    cd ..;` is a combination. What is it? It is a basic shell script!


    ## Writing Shell Scripts


    To write a shell script you simply need some understanding of Linux commands and
    a text editor. On Ubuntu, the default editor can be used (`gedit`). Let’s examine
    the components.


    A shell script starts with a comment at the top.


    ```bash

    #!/bin/shell_type

    ```


    For instance, `#!/bin/bash`. This is a comment as it starts with the `#`. These
    lines are not interpreted by the shell! To comment, `#` should be used. However,
    this specific line tells the shell what shell to use to execute this script on.
    We call `#!` Shebang.


    The next part will be a set of commands with explanations. If you are familiar
    with programming, shell scripting is similar.


    If we create a script with the following example:


    ```bash

    #!/bin/bash

    who

    ```


    `who` command displays the account you are logged into and at what time the user
    logged into.


    ```bash

    pwd

    ```


    it should work as expected.![](rsrc3AR.jpg)


    Image: `who` command in a script![](rsrc3AW.jpg)


    However, you have to either place it in the `/bin` directory or have to use the
    `PATH` variable, as instructed in the previous chapter, to set the path to your
    directory. You could also use the absolute or relative path. The next thing you
    need to do is the changing of permissions. Why? Let’s create a file and examine
    the permissions.![](rsrc3B1.jpg) According to the result, there are insufficient
    permissions to execute this file. The system treats itself as a script, but hasn’t
    modified the permissions. It is up to the user. To provide execution permissions,
    `chmod` command can be used.


    ```

    chmod +x script

    ```


    ![](rsrc3B8.jpg) Once this step is complete, the script is ready to be executed.![](rsrc3BD.jpg)
    If you want to display text guides, the output of environment variables and such,
    you can use the `echo` command. We have learned environment variables in previous.


    ## Command Aliases


    Using a command alias can save a lot of time. To define an alias, you have to
    do a simple assignment.


    Syntax: `alias="ls -al"`

    Examples: `alias search=grep`


    ## Command Substitution


    It is also possible to use an output of a command as input to a variable. This
    is a great feature to continue the script and execute with dynamic data. To achieve
    this, you must use `$()`.


    Example: `user_name=$(who)`


    Example Script:


    ```bash

    #!/bin/bash

    user_name=$(who)

    echo "Your username is : $user_name"

    ```


    ![](rsrc3C0.jpg)## Creating Files


    Another great feature is that you can output the results. You can even name the
    file according to your needs. This is explained in the next example.


    ```bash

    #!/bin/bash

    mydate=$(date +%Y%m%d)

    echo "Today is : $mydate"

    who > log.$mydate

    ```


    ![](rsrc3CA.jpg) Here, we create a date and format it. `%Y` is the year in `YYYY`
    format. The month is in numeric format (e.g., `09`) and the date is in numeric
    format as well. The output is similar to `YYYYMMDD`. The output is taken into
    a variable. Then we `echo` the variable. Finally we use the `who` command and
    redirect its input to a new file using the `>` operator. The file name is created
    as `logYYYYMMDD`. This is how we create logs to keep records. If the script runs
    on next day, the filename will be `log20190925`.


    Redirection is an extremely useful feature. Instead of using commands like `touch`,
    you can redirect the output to a file. Yet, you can even create files from scripts
    using the `touch` command. For instance:


    ```bash

    #!/bin/bash

    mydate=$(date +%Y%m%d)

    echo "Today is : $mydate"

    touch log.$mydate

    ```


    ![](rsrc3CN.jpg) # Creates a file and name the first part `.log` and later using
    our variable


    ```bash

    who >> log.$mydate

    ```


    ![](rsrc3CT.jpg) # Append the output of `who` command to the file.


    You can also do the reverse process we performed using the `>` operator. This
    is known as input redirection. For instance, we could get an entry of a file to
    a new variable or a command directly. The following example explains this in detail.


    ```bash

    #!/bin/bash

    wc < log.20190924

    ```


    `wc` is a new command to you. It counts the number of lines, words and characters.![](rsrc3D0.jpg)
    Finally, we will look into the `<<` operator. This is known as the inline input
    operator.


    Example:


    ```

    wc << lastLine

    ```


    ![](rsrc3D5.jpg) As you notice, until `lastLine` was entered as text input, it
    captured the user input.


    Other examples: Redirecting error and standard output to the same file. You could
    use the following command.


    ```

    ls Test Test2 Test3 > dirlist 2>&1

    ```


    Here, we are trying to list the properties of the `Test` directory. Remember,
    `ls` command supports multiple file or directory names. It then lists each file’s
    or directory’s properties. `Test` and `Test2` directories are on my desktop. `Test3`
    directory does not exist. I am redirecting the output of this command as well
    as the error into a new file called `dirlist`.![](rsrc3DE.jpg)## Standard File
    Descriptors


    We are revisiting the file descriptors again.


    - Standard Input - 0: STDIN

    - Standard Output – 1: STDOUT

    - Standard Error - 2: STDERR


    The first is standard input, the next are standard output and standard error.
    The numerical values are file descriptors. In addition to these techniques, pipes
    are extensively used in scripts.


    ## Pipes


    Piping is useful when an output of a command is required as an input of another.
    This is something we have learned so far. The operator used is `|`.


    Example:


    ```bash

    #!/bin/bash

    cat employee.txt | sort -nr -k 2

    ```


    Here we redirect the file entry we obtain to the `sort` function. It sorts by
    numeric values, in reverse order and sort by column id (2nd column).![](rsrc3DY.jpg)##
    Mathematical Operations in Script Building


    Any script can be used to perform certain calculations. There are some built-in
    commands in Linux. We are looking into the command `expr`. This stands for the
    expression. These are the operators for `expr` command.![](rsrc3E4.jpg) Image:
    `expr` operators![](rsrc3EA.jpg)


    Examples:![](rsrc3EF.jpg) Rather than using `expr` command, it is more convenient
    to use brackets.


    ```bash

    #!/bin/bash

    var1=2

    var2=6

    var3=3

    var4=$((var1 * var2))

    echo $var4

    ```


    ![](rsrc3EZ.jpg)## The Bash Calculator


    When you want to perform complex mathematical functions, there is a built-in tool
    to perform this. It is `bc`.


    The `bc` command supports the following:

    - integer and floating-point numbers

    - variables

    - expressions

    - functions

    - if-then-else

    - comments


    In the last line, you can see a problem: 8.45/5 = 1.6 is inaccurate unless it
    is rounded up. The problem here is the number of decimal places. To receive the
    intended output, we need to modify `scale`.![](rsrc3FR.jpg) The `bc` command supports
    variables. The following example uses variables instead of numerical values. The
    next important task is to get `bc` working in a script. In this case, we need
    to depend on pipes.


    ```bash

    #!/bin/bash

    var1=10

    var2=2

    var3=$(echo "$var1 ^ $var2" | bc)

    echo "The answer is : $var3"

    ```


    ![](rsrc3G8.jpg) Another example using the `scale` option.


    ```bash

    #!/bin/bash

    var1=10

    var2=3

    var3=$(echo " scale=3; $var1 / $var2" | bc)

    echo "The answer is : $var3"

    ```


    ![](rsrc3GH.jpg) The next example will be looking into how the inline input operator
    can be used with the `bc` command in a script.


    ```bash

    #!/bin/bash

    var1=8

    var2=1.75

    var3=3

    varF=$(bc << EOF # EOF stands for End of File

    scale = 4

    v1 = ($var1 * $var2)

    v2 = ($var1 / $var3)

    v1 + v2

    EOF)

    echo The final calculation is: $varF

    ```


    ![](rsrc3H2.jpg)

