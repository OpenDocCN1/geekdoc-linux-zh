    There are other sections, as well, and you can find even more if you are interested,
    by executing the `man bash` command or by visiting [https://man.cx/bash#heading7](https://man.cx/bash#heading7).
    As you understand, there is a lot in a man page. Let’s learn some more commands
    to shape the output.


    ### Man Section

    `man section_number page_name`

    Example: `man 4 tty`![](rsrc1T9.jpg)


    Let’s assume you want to find if a man page exists. `whatis` is the best command
    to find it. The syntax is, `whatis keyword`

    Example: `whatis man`![](rsrc1TF.jpg)


    Now if you run `man 7 man` you will find more about macros![](rsrc1TM.jpg)


    If you do not know the specific page but you want to know about something specific
    such as shell for instance, or terminal, the following commands are helpful. The
    syntax is, `man – k keyword`

    Example: `man -k shell`![](rsrc1TU.jpg)


    Now you can find the specific page, `man 1 dash` for instance.


    ### Less and More

    These two commands are extremely helpful when using the man pages and even for
    other work, such as file operations. These commands allow a user to read through
    a page or a file with lots of viewing options. `Less` is more advanced, and it
    loads fast because it does not load the entire file at once. It has many options
    than its cousin.


    `man` is an old command and it is not friendly. For instance, you cannot scroll
    backward with it so reading becomes difficult. This led to the creation of its
    cousin `less`. `Less` provides a text editor like environment so that you can
    scroll back and forth, type arguments, and interact well. Let’s take a look at
    the output of `man ls | more` command![](rsrc1U3.jpg)


    **Image: More command**

    With `more`, you have to use either the enter key or the spacebar, not the arrow
    keys![](rsrc1U9.jpg)

    **Image: Less command**

    There is a tiny ‘:` at the end. You can send commands to do additional operations.
    With `less` it is much easier to navigate and control.


    You must have noticed the new symbol used with these commands. To use these commands,
    you need to learn another new operator. This is known as pipeline. A pipeline
    operator is simple and is `|`. What it does is, taking the result of a command
    and send it to another command, just like in a pipeline. For instance, let’s look
    at the following example.


    Syntax: `command_1 | command_2 | command_3 | .... | command_N`

    Example: `man bash | more`


    The first command is executed first (`man bash` displays the manual for `bash`).
    Then it is piped to the second. This is a great way to chain commands. Another
    example, `ls /bin | more`![](rsrc1US.jpg)


    In the next section, we are going to look at the commands in more structured way
    so the operations can be streamlined.


    ### Linux Editors

    There are lots of editors in the Linux world. If you are into scripting, you must
    have a working knowledge and be familiar with at least one editor. In this section,
    we will have a look at a few editors. As you already know, desktop environment
    releases have one editor of their own.


    #### Vim Editor

    In the old days, Unix systems used a text editor known as the `vi` editor. GNU
    made changes to this piece and made available as the “vi improved” or `vim`. `Vim`
    editor is available in Cent OS or in Red Hat distributions. In Ubuntu, you may
    have to install it. There are some commands to verify if it exists. Issue, the
    following commands respectively:


    ```

    alias vi

    which vils -l /usr/bin/vim

    ```

    In ubuntu, you will get the following screen![](rsrc1V7.jpg) In this case, you
    must install `vim` by using the following command.

    ```

    sudo apt-get install vim

    ```


    When working with `vim` you must notice that there are two modes:

    - Insert mode: press `i` key to get into the insert mode.

    - Normal mode: press `Esc` to exit.


    When you open a file with `vim`, you are in the normal mode. When you are in the
    insert mode, you are writing to the file. You must also know how to exit, save
    and exit:

    - Press `q` to quit.

    - Press `wq` to save to the same file and exit.

    - Press `q!` to quit discarding changes.

    - Type `w filename` to save the file in a different name.


    `Wim` editor is a feature rich editor. It is not always convenient. For instance,
    it is not easy to copy paste. Yanking and visual modes will be utilized to do
    so.


    #### Nano Editor

    This tiny editor is available with most of the Linux systems, as well as Ubuntu![](rsrc1VS.jpg)

    **Image: Linux Nano editor**

    The best feature of this is the list of commands in front of the screen. It has
    a simple command set, the `Ctrl` key and another. To get help press `Ctrl + G`.
    To exit, press `Ctrl + X`.


    #### KDE Editors

    With KDE, they ship editors and among the editors, `KWrite` and `Kate` are often
    used. While `KWrite` is a single editor, `Kate` is a multi-window and feature
    ich editor.


    #### GNOME Editor

    Since we are using Ubuntu, it is better to use a GNOME editor. `gedit` is the
    default editor in many cases![](rsrc1W.jpg)

    **Image: Linux Gnome editor**

    `gedit` supports tabs, has a find and replace option, language, spelling, date/time
    tools, full screen mode![](rsrc1W.jpg)


    ### CHAPTER 5: Basic Shell Commands

    #### Introduction

    We already explored commands in the previous chapters.


    #### Navigation

    To view a list of directories in the present directory, in Windows you use the
    `dir` command. This command works the same way on Linux. To navigate to files,
    the most basic method is to use the full path to the file such as `/home/jan/Desktop/`.
    There are basic commands to do this with easier.


    1. Know your present working directory with `pwd` command![](rsrc20R.jpg)

    2. Change the directory location using the `cd` command. Here we use the absolute
    path .![](rsrc20Y.jpg)

    3. Get back to the home directory using the `cd` command only.


    #### File System

    Files naming is based on the FHS (Filesystem Standard). Let’s look at common directories.


    **Table: Linux directory types**


    | Directory | Purpose |

    | :--- | :--- |

    | / | This is the root directory. The upper-most level. |

    | /bin | This is the binary store. GNU utilities (user-level) exist in this. |

    | /boot | This is where the system stores the boot directory and files used during
    the boot process. |

    | /dev | Device directory and nodes. |

    | /etc | This is where the system stores the configuration files. |

    | /home | Home of user directories. |

    | /lib | System and application libraries. |

    | /media | This is where media is mounted, media as CDs, USB drives. |

    | /mnt | Where the removable media is mounted to. |

    | /opt | Optional software packages are stored here. |

    | /proc | Process information – not open for users. |

    | /root | Home directory of root. |

    | /run | Runtime data is stored here. |

    | /sbin | System binary store. Administrative utilities are stored here. |

    | /srv | Local services store their files here. |

    | /sys | System hardware information is stored here. |

    | /tmp | This is the place for temporary files. |

    | /usr | This is where the user-installed software are stored. |

    | /var | Variable directory where the dynamic files such as logs are stored. |


    #### Listing Files with `ls`

    We are going to look at some commands. This does not display the root.

