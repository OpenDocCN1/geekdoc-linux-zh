    ![](img/rsrc384.jpg)注意 `head` 命令。这是为了将输出限制在 10 行。


    # 系统变量


    Linux 操作系统使用了许多环境变量。在使用文本模式（登录）、使用交互式 shell 或非交互式 shell 时，`bash` 都会查找文件来执行命令。查找的文件取决于上述的方法。


    当你登录到 Linux 操作系统时，`bash` shell 会作为登录 shell 加载。这个登录 shell 会查找 5 个不同的文件来执行命令。这些：


    - `/etc/profile`

    - `$HOME/.bash_profile`

    - `$HOME/.bashrc`

    - `$HOME/.bash_login`

    - `$HOME/.profile`


    `/etc/profile` 是 `bash` shell 的默认启动文件。登录时，`bash` 会执行 `/etc/profile` 中的命令。让我们来看下
    Ubuntu 上这个文件的内容。


    ![](img/rsrc38J.jpg)


    在这里，你可以看到对 `/etc/bash.bashrc` 的调用。正如我们之前讨论的，它包含了系统环境变量。你可能也注意到 `/etc/profile.d`。它存放了特定特定的启动文件。当你登录到
    shell 时，这些文件会被执行。让我们来看看这些文件。


    ```

    ls -l /etc/profile.d

    ```


    ![](img/rsrc38R.jpg)


    `$HOME` 正如你发现的除了 `/etc/profile` 外，其余的共同点。其目的是提供用户特定的启动文件来定义用户特定的变量。每个文件旁边都有 `.`，表示这是一个隐藏文件。


    ## 交互式 Shell


    当你不登录系统而启动 `bash` shell 时，就会启动交互式 shell。尽管它不像登录 shell，但仍然接受命令。


    如果启动了交互式 shell，它不需要处理 `/etc/profile`。它直接在用户的 `HOME` 目录下查找 `.bashrc` 文件。它首先查找 `/etc`
    目录下的通用 `bashrc` 文件。然后它为用户输入个人命令别名和私有脚本提供了一个空间。


    ## 非交互式 Shell


    在这种情况下，系统开始执行 shell 脚本，尽管这不需要任何交互，但每次启动脚本都需要运行启动命令。这时一个特殊的全局环境变量派上用场了。它被称为 `BASH_ENV`。


    ```

    echo $BASH_ENV

    ```


    ![](img/rsrc392.jpg)


    如你所见，没有任何设置。那么它是如何工作的呢？


    如果你能回起来，某些命令会产生子 shell，这个子 shell 会继承父 shell 出的变量。


    如你所知，如果脚本没有产生子 shell，变量在当前 shell 环境中已经可用。现在即使 `BASH_ENV` 未设置，当前 shell 的本地和全局变量也是可用的。


    ## 使用永久或持久性环境变量


    当你创建环境变量时（特别是为了你的需求），你必须将这些变量存储在永久的位置。你可能认为 `/etc/profile` 是存储全局变量的最佳地方，但并不是。它会随着系统活动（如升级）发生变化。相反，可以使用
    `/etc/profile.d` 来存储 `.sh` 文件。对于局部变量，最好的地方是用户 `HOME` 目录下的 `.bashrc` 文件。最后，我们将讨论变量数组的一些细节。


    ## 变量数组


    环境变量可以用数组。这是环境变量的一个非常强大的特性。如果你不知道什么是数组，数组是内存中的一个地方（变量），可以存储多个值。让我们来看一个例子。


    ```

    va_months=(Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec)

    echo $va_months

    echo ${va_months[0]}

    ```


    第一个命令创建数组并分配值。第二个命令输出数组的第一个元素。第三个命令输出相同的。我们也可以通过以下命令（示例）修改数组项。


    ```

    va_months[0]=January

    echo ${va_months[0]}

    ```


    最后，要显示所有数组元素，使用 `*`。


    ```

    echo ${va_months[*]}

    ```


    ![](img/rsrc39S.jpg)


    # 第 8 章：编写脚本


    在本章中，你将学习：

    - 编写 Shell 脚本

    - 命令别名和替换

    - 管道

    - 文件、描述符和退出状态

    - 结构命令 (if, for, while, until, break, continue)。


    在本章中，你将通过示例对脚本编写获得全面的理解。脚本编写的关键在于你对命令的熟悉程度。脚本非常有优势，因为它可以处理多个命令，处理结果，并将一个结果传递给另一个，从而构建一个链链。


    你已经知道如何使用 `;` 执行多个命令了。例如，`pwd; cd ..;` 就是一个组合。它是什么？它是一个基础 shell 脚本！


    ## 编写 Shell 脚本


    要编写 shell 脚本，你只需要对 Linux 命令和文本编辑器有一定的。在 Ubuntu 上，可以使用默认编辑器 (`gedit`)。让我们检查一下组件。


    一个 shell 脚本以顶部的注释开始。


    ```bash

    #!/bin/shell_type

    ```


    例如，`#!/bin/bash`。这是一个注释，因为它以 `#` 开头。这些行不会被 shell 解释！要写注释，应该使用 `#`。然而，这一特定行告诉 shell
    使用哪种 shell 来执行此脚本。我们称 `#!` 为 Shebang。


    下一部分将是一组带有说明的命令。如果你熟悉编程，shell 脚本是类似的。


    如果我们创建一个示例脚本：


    ```bash

    #!/bin/bash

    who

    ```


    `who` 命令显示你登录的账户以及登录时间。


    ```bash

    pwd

    ```


    应该符合预期。![](img/rsrc3AR.jpg) 将其放在 `/bin` 目录或使用 `PATH` 变量来设置路径。你也可以使用绝对或相对路径。下一步要做的是更改权限。根据结果，没有足够的权限执行此文件。系统将它视为脚本，但尚未修改权限。为了提供执行权限，可以使用
    `chmod` 命令。


    ```bash

    chmod +x script

    ```


    ![](img/rsrcB1.jpg) 一旦完成此步，脚本就准备好执行了。![](img/rsrcBD.jpg) 如果你想显示文本，可以使用 `echo`
    命令。我们在上一节中学习了环境变量。


    ## 命令别名


    使用命令别名可以节省大量时间。要定义别名，你必须进行简单的赋值。


    语法：`alias="ls -al"`

    示例：`alias search=grep`


    ## 命令替换


    将命令的输出作为变量输入也是可能的。这是一个强大的功能。要实现这一点，必须使用 `$()`。


    示例：`user_name=$(who)`


    脚本：


    ```bash

    #!/bin/bash

    user_name=$(who)

    echo "Your username is : $user_name"

    ```


    ![](img/rsrcC0.jpg)<< 创建文件


    另一个强大的特性是你可以输出结果。你可以根据你的需求命名文件。在下一个示例中解释了这一点。


    ```bash

    #!/bin/bash

    mydate=$(date +%Y%m%d)

    echo "Today is : $mydate"

    who > log.$mydate

    ```


    ![](img/rsrc3CA.jpg)在这里创建一个日期并对其进行格式化。`%Y` 是 `YYYY` 格式。月份是数字格式（例如 `09`），日期也是数字格式。输出类似于
    `YYYYMMDD`。输出被取入变量。然后我们 `echo` 该变量。最后我们使用 `>` 运算符将其输入重定向到新文件。文件名创建为 `logYYYYMMDD`。这就是我们创建日志以记录的方法。如果脚本在第二天运行，文件名将是
    `log2019025`。重定向是一个非常有用的功能。与其使用 `touch` 命令，你可以将输出重定向到文件。你甚至可以使用 `touch` 命令从脚本创建文件。例如：


    ```bash

    #!/bin/bash

    mydate=$(date +%Y%m%d)

    echo "Today is : $mydate"

    touch log.$mydate

    ```


    ![](img/rsrc3CN.jpg)# 创建文件并将部分命名为 `.log` 之后使用我们的变量


    ```bash

    who >> log.$mydate

    ```


    ![](img/rsrc3CT.jpg)# 将 `who` 命令的输出追加到文件中。


    你也可以执行我们使用 `>` 运算符执行的反向过程。这被称为输入重定向。例如，我们可以获取文件的条目直接到新变量或命令。以下示例详细解释了这一点。


    ```bash

    #!/bin/bash

    wc < log.20190924

    ```


    `wc` 是你的一个新命令。它统计行、字和字符数。![](img/rsrc3D0.jpg)我们将查看 `<<` 运算符。这被称为内联输入运算符。


    示例：


    ```

    wc << lastLine

    ```


    ![](img/rsrc3D5.jpg) 如你注意到，直到 `lastLine` 作为文本输入，它捕捉了用户输入。


    其他示例：将错误和标准输出重定向到同一个文件。你可以可以使用命令。


    ```

    ls Test Test2 Test3 > dirlist 2>&1

    ```


    在这里，我们尝试列出 `Test` 目录的属性。记住，`ls` 命令支持多个文件或目录名。然后列出每个文件或目录的属性。`Test` 和 `Test2` 目录在我的桌面上。`Test3`
    目录不存在。我将此命令的输出以及错误都重定向到一个名为 `dirlist` 的新文件中。![](img/rsrc3DE.jpg)<<标准文件描述符


    我们再次回顾描述符。


    - 标准输入 - 0: STDIN

    - 标准输出 – 1: STDOUT

    - 标准错误 - 2: STDERR


    第一个是标准输入，后续是标准输出和标准错误。数值是描述符。除了这些技术，管道在脚本中被广泛使用。


    ## 管道


    当一个命令的输出作为另一个命令的输入时，管道非常有用。这是我们到为止学到的内容。使用的运算符是 `|`。


    示例：


    ```bash

    #!/bin/bash

    cat employee.txt | sort -nr -k 2

    ```


    在这里我们重定向输出。![](img/rsrcDY.jpg) 脚本构建中的数学运算


    任何脚本都可以用于执行某些计算。Linux 中有一些内置命令。这些是 `expr` 的表达式。![](img/rsrcEA.jpg)与其使用 `expr`
    命令，使用括号更方便。


    ```bash

    #!/bin/bash

    var1=2

    var2=6

    var3=3

    var4=$((var1 * var2))

    echo $var4

    ```


    ![](img/rsrc3EZ.jpg)Bash 计算器当你想要执行复杂的数学函数时，有一个内置工具来执行。它是 `bc`。


    `bc` 命令支持：

    - 整数和浮点数

    - 变量

    - 表达式

    - 函数

    - if-then-else

    - 注释


    在最后一行，你可以看到一个问题：8.45/5 = 1.6 是不准确的，除非向上舍入。这里的问题是小数位数。为了获得预期的输出，我们需要修改 `scale`。(rsrc3FR.jpg)
    `bc` 命令支持变量。以下示例使用了变量而不是数值。


    ```bash

    #!/bin/bash

    var1=10

    var2=2

    var3=$(echo "$var1 ^ $var2" | bc)

    echo "The answer is : $var3"

    ```


    ![](img/rsrc3G8.jpg)另一个使用 `scale` 选项示例。


    ```bash

    #!/bin/bash

    var1=10

    var2=3

    var3=$(echo " scale=3; $var1 / $var2" | bc)

    echo "The answer is : $var3"

    ```


    ![](img/rsrc3GH.jpg) 下一个示例将查看内联输入运算符如何在脚本中与 `bc` 命令结合。


    ```bash

    #!/bin/bash

    var1=8

    var2=1.75

    var3=3

    varF=$(bc << EOF # EOF 代表文件结束

    scale = 4

    v1 = ($var1 * $var2)

    v2 = ($var1 / $var3)

    v1 + v2

    EOF)

    echo The final calculation is: $varF

    ```


    ![](img/rsrc3H2.jpg)

