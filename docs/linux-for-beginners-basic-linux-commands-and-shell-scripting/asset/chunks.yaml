    \ it is possible to identify a range (0 – 255). It is because the shell is calculating\
    \ the exit code using a method called modulo arithmetic. It divides the error\
    \ by 256 and use the remainder as the exit code.\n\n## Structured Commands\n\n\
    Until now we have learned a lot of commands and how to build basic scripts. You\
    \ can also use `man` command or `--help` option to learn many things about the\
    \ commands and other features.\n\nFor scripting, if you are programmer or even\
    \ a newbie, you must apply some condition. Otherwise, we cannot build structures\
