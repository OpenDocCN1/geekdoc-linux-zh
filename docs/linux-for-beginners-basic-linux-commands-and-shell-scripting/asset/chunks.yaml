    ### 4. 现在我们将使用相对路径来使操作更简单、节省时间。在这种情况下，我们可以使用 `/`。


    ![](img/rsrc21A.jpg)

    在这里，`dir` 命令列出我当前文件夹下的目录。我可以使用 `cd Desktop` 命令跳转到桌面文件夹。


    在目录遍历时，有两个特殊字符。它们是 `.` 和 `..`。单点 `.` 代表当前目录。双点 `..` 代表上一级文件夹。


    ### 5. 要返回上一级目录，请使用 `..`，例如


