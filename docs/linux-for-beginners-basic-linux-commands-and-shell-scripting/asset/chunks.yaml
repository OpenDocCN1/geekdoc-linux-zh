    - 在 `/var/spool/mail/username` 创建邮件邮箱池

    - 创建了一个组。该组的名字与用户名相同。


    ### 理解 `/etc/passwd`

    所有账户信息都存储在该文件中。每个用户都有一条记录，格式如下：

    `[username]:[x]:[UID]:[GID]:[Comment]:[Home directory]:[Default shell]`


    - `[username]` 是用户账户名。

    - `x` 表示该账户受 `/etc/shadow` 中影子密码的保护。

    - `UID` 和 `GID` 是用户 ID 和组 ID。

    - `Home directory`（主目录）指向用户主目录的绝对路径。

    - `Default shell`（默认 shell）将在用户登录时加载。


    ### 理解 `/etc/group`

    组信息存储在 `/etc/group` 文件中。它具有以下格式：

    `[Group name]:[Group password]:[GID]:[Group members]`


    - `Group name` 是组名。

    - `Group password`（组密码）。如果显示 `x`，则不使用。

    - `GID` 与 `/etc/passwd` 中的相同。

    - `Group members`（组成员），一个用逗号分隔的文件。


    ### 修改用户

    在添加新用户后，可以使用名为 `usermod` 的特殊命令修改其属性。

    语法：`usermod [options] [username]`


    设置到期日的示例：

    `usermod --expiredate 2020-01-31 helpdesk`


    添加到多个组的示例：

    `usermod --append --groups root,helpdesk helpdesk`


    更改主文件夹的示例：

    `usermod --home /newhome/helpdesk helpdesk`


    更改默认 shell 的示例：

    `usermod --shell /bin/sh helpdesk`


    ![](img/rsrc19Z.jpg)


    我们可以如下结合使用上述所有示例：

    ```

    usermod --expiredate 2020-01-31 --append --groups root,helpdesk --home /newhome/helpdesk
    helpdesk --shell /bin/sh helpdesk

    ```


    ### 锁定和解锁用户

    可以锁定和解锁用户。这在常规操作中没有帮助，但在工作环境中非常有用。


    锁定示例：`usermod --lock helpdesk`

    解锁示例：`usermod --unlock helpdesk`


    ### 组管理（高级）

    ![](img/rsrc1AA.jpg)


    命令：

    - `groupadd hr_group`

    - `chown :hr_group hr.txt`

    - `usermod -aG hr_group user1`

    - `usermod -aG hr_group user2`

    - `usermod -aG hr_group user3`


    ![](img/rsrc1AN.jpg)


    如果我们来看另一个例子，3 个用户需要访问由一个用户共享的文件，分组将变得非常有用且安全。假设有 3 个用户：

    - `user1`

    - `user2`

    - `user3`


    `user1` 有一个文件要共享。如果你通过执行 `chmod` 命令更改文件权限。`660` 表示所有者和组可以读写该文件。然而，如果我们使用创建 `user1`
    时生成的默认组，将允许同组中的每个其他用户访问 `user1` 的所有文件和个人数据。这就是组的重要性。你可以设置其他组并应用适当的权限。我们可以实现适当的分组结构，以更好地结合共享与安全。


    ### 理解 setuid、setgid 和粘滞位 (Sticky Bit)

    这是一种应用于文件（即可执行文件）的权限。当你这样做时，其他用户将继承所有者的有效权限。因此，这引发了安全担忧，此类应用程序必须尽可能少。此权限用于系统程序。


    例如，让我们以 `/usr/bin/passwd` 为。它负责更改用户的密码。通过这样做，它修改了 `/etc/shadow` 文件。对于该文件，超级用户必须能够更改自己和其他密码，而其他人必须能够更改自己的密码，但不能更改他人的。因此，其他用户必须能够读取和执行。为了做到，root
    必须能够指定账户。


    ![](img/rsrc1B1.jpg)


    注意这里的 `rwsr`。`s` 代表 `setuid`。在这种情况下，`setuid` 和用户的执行位已启用（`s` 表示已启用，如果它是 `S`，则表示执行位未启用）。


    当启用 `setgid` 位时，真实用户的有效 `GID` 变为组所有者的 GID。其他用户可以在组所有者的权限下访问文件。如果在此目录上设置了此项，在该目录内创建的文件将继承相同的组。新目录继承相同的
    `group`。当有人需要访问共享目录时，无论文件的主组是什么，都是最佳方法。要启用 `setgid`，运行以下命令。将 `filename` 替换为原始文件名：

    ```

    chmod g+s [filename]

    ```

    要以八进制形式（数字）发送，你需要设置以下内容。将目录名替换为原始目录名：

    ```

    chmod 2755 [directory]

    ```

    ![](img/rsrc1BC.jpg) ![](img/rsrc1BC.jpg) ![](img/rsrc1BH.jpg)


    此外注意颜色的变化。


    ### 粘滞位 (Sticky Bit)

    如果粘滞位对文件启用，则会被系统忽略。然而，如果设置在目录上，它将限制用户的操作，例如重命名和删除，除非用户是所有者。要启用此位，运行以下命令：

    ```

    chmod o+t [directory]

    chmod 1755 [directory]

    ```

    ![](img/rsrc1BC.jpg) ![](img/rsrc1BC.jpg) ![](img/rsrc1C.jpg)


    同样注意 `test.txt` 的颜色变化。


    ### 删除组

    要删除组，使用 `groupdel` 命令。

    语法：`groupdel [group_name]`

    示例：`groupdel test`


    ### 删除用户

    要删除账户，使用 `userdel` 命令。

    示例：`userdel test`


    # 第 4 章：Linux 终端


    在本章中你将学习：

    - 终端及其类型

    - Terminfo

    - 控制台

    - Shell


    ### 终端

    在 Unix 和 Linux 早期，计算机没有图形界面。为了与操作系统交互，有一个名为终端的程序，主要基于文本。早期的 Linux 版本没有高级功能，如图形支持。因此，出于安全考虑，现在大多数服务器在文本模式下运行。Linux
    现在具有高级功能，如块模式和矢量图形。终端支持的字符集：

    - ASCII

    - ISO-8859-1, 2, 6, 7 和 8

    - Unicode


    终端还支持用于控制显示器的控制代码，这有助于控制光标位置和其他不可打印操作。一些控制代码包括：

    - 回车

    - 方向键

    - 向上/向下分页

    - 新行（换行符）


    此外，使用了缓冲区来保存命令历史，这被称为滚动屏。(rsrc1D.jpg)


    另一种类型是备用屏（alternate screen）。在这种方法下，终端可以在另一个屏幕上存储数据。这是基于图形的终端的开始。控制代码用于在屏幕和用用屏之间切换。早期的终端是文本的，字符如**粗体**和下划线、闪烁字符以及白色背景上的黑色。经过了一段时间，出现了颜色的终端，并有多个控制代码来控制行为。今天我们使用高级程序来模拟这些终端。映射可以从一个系统到另一个系统。有一些可用的常用键：

    - 方向键

    - 删除

    - 重复

    - 回车

    - Break

    - 以及特定的功能键（如 F1 到 F12）


    ### Terminfo

    如你所知，有很多终端模拟器。对于每个终端，Linux 操作系统必须保留控制代码以便准确操作。这些特性在一个名为 Terminfo 的数据库中。为了区分终端，创建了一个与该终端相关的文件文件夹。在
    Ubuntu 中，terminfo 的位置是 `/etc/terminfo/*`。


    你可以使用 `toe` 命令查看所有可用终端类型。

    示例：`toe -a` ![](img/rsrc1DN.jpg)


    ### 控制台

    在早期，当你启动 Linux 机器时，你会得到一个带有登录提示的文本控制台。你可以验证身份并发送命令。现代 Linux 系统在启动时创建多个虚拟控制台。最多可以有
    6 个。你可以使用快捷键组合或键盘功能键在这些控制台之间切换。例如，你可以使用 `Alt + Fn` 或 `Ctrl + Alt + Fn`（这里简单的 Fn
    代表键盘上的功能键）。在 Ubuntu 中，你可以使用 `Alt + Ctrl + F3` 打开文本控制台。返回时按下 `Alt + Ctrl + F2`src1DW.jpg)


    ### 终端类型

    有很多种终端。我们将查看流行且易用的终端。


    **xterm**：这是最旧的终端模拟包。它提供了 DEC VT100 CLI 和 Tektronix。现在有模拟器，如 `Eterm` 和 `ROterm`，它们轻量级并提供了很大的功能选择自由。`E`
    提供更多灵活性，而 `ROterm` 为高级用户提供了功能。以下图片显示了 xterm 可用的选项。(rsrc1E7.jpg) ![](img/rsrc1EB.jpg)
    ![](img/rsrc1EG.jpg)


    **Konsole**：Konsole 是 KDE 桌面环境提供的终端模拟器。KDE 具有类似于 Windows 的菜单栏并提供标签页窗口。这些方便的功能：

    - 透明背景

    - 分屏模式

    - 可自定义颜色方案和按键绑定

    - 增量搜索

    - HTML 兼容输出

    - 终端通知


    对于一组命令行选项，请访问 `https://docs.kde.org/stable/applications/konsole/command-line-options.html`。


    **GNOME terminal**：GNOME 也提供了自己的终端包 GNOME terminal。默认情况下 Ubuntu 带有 GNOME terminal。它有很多用的选项。让我们用命令找出
    Ubuntu 中存在哪些终端。在模拟器中运行以下命令：

    ```

    update-alternatives --display x-terminal-emulator

    ```

    rsrc1F2.jpg) GNOME terminal 提供了丰富的功能和命令。它支持标签页、附加/分离标签、配置文件、预设大小等。还有具有酷功能的新终端模拟器。以下是列表：

    - **Xfce**：用于 XFCE 桌面环境。

    - **Terminator**：`https://launchpad.net/terminator`

    - **Tilda**：`http://tildasourceforge.net/tildaabout.php`

    - **Guake (基于 Python)**：`https://github.com/Guake/Guake`

    - **Yakuake**：`ext.kde.org/apps/yakuake`

    - **Eterm**：`www.eterm.org`


