    second means root can act as any user. Final ALL permits the user to run all the
    commands.We can add more users with very specific control. For instance,poweruser
    ALL= /sbin/poweroff command will allow the poweruser user to turn off the system
    via any terminal.The next thing to learn is using the aliases. You can use several
    types of aliases in this file.-         Host_Alias-         User_Alias-        
    Runas_Alias-         Cmnd_AliasFor instance, the sudoers file may look like the
    following.-        Change the env_reset to env_reset,timestamp_timeout=n. Here
    you must replace n so that the session will not go any longer that the specified
    minutes. You can use -1 to stop the timeouts.-        By default, you do not see
    the password when you type when elevating to sudo. If you want to see the * when
    you type the password, use the pwfeedback to the above line. i.e., env_reset,pwfeedback.-
            Create the alias and set permissions. See the example below.Defaults        env_reset,pwfeedback,timestamp_timeout=15Defaults        mail_badpassDefaults        secure_path="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin"#
    Host alias specificationHost_Alias​ LAN = jan.contoso.com, jake. contoso.comHost_Alias​
