    ## Introduction

    This book contains proven steps and strategies on how to use or migrate to Linux
    for fun and profit. This is the first in a series of books on Linux. You can learn
    the basic concepts and applications of Linux from this book: from installation
    to basic shell scripting. The upcoming books in the series will provide you in
    depth knowledge of Linux concepts, philosophy and applied knowledge. The book
    series is well organized to provide you with sufficient knowledge as a beginner
    to become an advanced Linux user.


    ### Who Should Read this Book?

    This book is written in simple technical terms and uses simple examples and explanations
    so that a user who has zero or minimal experience with Linux can learn what Linux
    is and how to get started with Linux. The structure of the book is focused on
    providing step by step instructions and examples with screenshots and clarifications
    to avoid confusion and ambiguity. The content is targeting not only just for a
    beginner, but for general computer users, junior administrators and executives
    who wish to learn or sharpen what they know about Linux and how it is practically
    used.


    ### How this Books is Organized and be Used

    This book guides you through the initial setup of your own Linux system and moves
    forward with the most needed Linux system administration basics for starters.
    In the later chapters, it covers more advanced topics including certain system
    administration principles, theories and practical applications, basic and advanced
    scripting, and programs such as `GAWK`. The book is organized in the following
    way:

    * You will learn more about Linux, history, flavors and much more (chapter 1).

    * Installing and using your first Linux box and some basic administration (chapter
    2).

    * Linux user management principles, practical approaches, editors, terminal and
    console (chapter 3).

    * Introduction to Linux commands, file system, and basic administration (chapter
    4).

    * Linux partition styles, data files, and manipulation with sorting, searching
    with `grep`, compressing/de-compressing and archiving (chapter 5).

    * Shell scripting prerequisites, such as understanding processes, environment
    variables, and arrays (chapter 6).

    * Command aliases, file descriptors, piles, mathematical operations, advanced
    structured commands, and examples (chapter 7).

    * Introduction to functions, parameters, options, `getopt` and `getopts`, reading
    user input and interactive scripting, advanced functions, libraries, and a complete
    lesson on `GAWK` (chapter 8).


    ### Tips, Notes, Caution and Scenarios

    The book is designed to have many typographical features to help you get the most
    information from this book.


    ## Why Linux?

    Linux is an open-source operating system or a kernel. It is not only the most
    popular server operating system, but also the widely used open-source operating
    system. It was founded by Linus Torvalds in 1991 with the collaboration of `GNU`.
    Linux is used to power a multitude of systems. For instance, laptops, computers,
    smartphones, smart refrigerators and many more. Even though in the beginning,
    it was only famous in computer programmers, now it is used almost everywhere.
    Today Linux servers run Google, Facebook and many other well-known services.


    Linux is different when compared to other popular clients operating systems such
    as Windows and Mac OS. Linux is an open-source system while other systems are
    not. That means users cannot make changes in those operating systems since the
    user cannot access their source code. But anyone can modify the Linux operating
    system. This does not mean Linux does not have commercial editions.


    Some refer to Linux as a clone of `UNIX`. `UNIX` was the foundation of Linux,
    or technically speaking an inspiration in terms of technology. When considering
    the core both are similar. Even though Linux is like `UNIX` it has its unique
    features. Some of the differences between `UNIX` and Linux are:

    * Linux is very flexible, but `UNIX` is rigid, hence it cannot be used in any
    computer.

    * Linux offers extensive portability in contrast to `Unix`.

    * Source code of Linux is readily available, but for `UNIX` it is not actually
    the case.


    These are the reasons for the foundation of Linux. A complete Linux system package
    can be called distribution. This includes the Linux kernel, `GNU` applications,
    a desktop environment and applications. There are so many available distributions
    addressing a plethora of needs. Some of the noteworthy distributions are:

    * Linux Mint.

    * Ubuntu.

    * Debian.

    * Red Hat/Cent OS.

    * Fedora.

    * SUSE.

    * Kali.


    These distributions are customized for users’ needs. One can choose the most suitable
    distribution according to their needs. For instance, Ubuntu can be installed easily,
    and anyone can use it, while `OpenSUSE` requires advanced knowledge. Some distributions,
    such as Linux Mint, can use who has low computer expertise.


    Recently there is a surge of Linux users due to many benefits. When considering
    the benefits of Linux, the most popular one is that it is free. Since operating
    systems, such as Windows and Mac are quite expensive, Linux has become predominant
    among users. Although in the history Linux was not a user-friendly operating system,
    now it has sufficient facilities and users can choose from millions of applications.
    It is flexible and highly customizable. One can install what he/she wants without
    downloading a full set of features.


    One of the major benefits of Linux is its security. Since there many severe problems
    have arisen due to security issues with many operating systems, the increased
    use of Linux is inevitable, given its strong security architecture. When using
    Linux, it is not necessary to use anti-virus programs in most cases (this does
    not mean it is entirely free of bugs or vulnerabilities, but these are rare).
    It is also beneficial when considering user privacy because the Linux system does
    not collect details of the user.


    Since Linux is an open-source operating system, any enthusiast has the opportunity
    modify a distribution. It gives the opportunity to make one’s own distribution.
    Even with all these facilities, it is highly stable and reliable. Installation
    of Linux is extremely simplified with modern GUI capabilities, and it works on
    almost every hardware. Software updates and patches also are faster when compared
    to other operating systems. Linux also had a few disadvantages. The main reason
    for this was Linux was not a dominant operating system in the market. Therefore,
    users had to face some difficulties, such as:

    * Most of drivers are written for Windows or Mac OS. Therefore, some hardware
    cannot be used with Linux for advanced operations. This is especially true when
    it comes to gaming.

    * Finding support services is difficult when compared to other operating systems.

    * It is quite difficult to find popular applications.

    * Certain major vendors have not developed priority for Linux because Linux was
    not a popular operating system, such as Windows or Mac.


    In addition to the afore-mentioned disadvantages there are few issues. One is
    the number of flavors of Linux. It is extensive. This may confuse beginners. Since
    Linux offers more control to the user, newbies may experience a difficult time.
    When considering users whose main focus is gaming, they might not be satisfied
    with Linux due to it is limitation with popular applications and certain driver
    issues. Even though operating system is dominant for the past decades, Linux has
    gained popularity at present. There are several advantages to Linux when compared
    to operating systems such as Windows. A few of those are:

    * Linux offers more secure and error free environment, given its architecture
    and nature of the applications.

    * Linux still runs on old computers.

    * With Linux, advanced user can make operating system level changes while the
    others do not allow such modifications.

    * Linux offers more versatility to the users, most famous platforms.


    ## CHAPTER 1: Introduction to Linux Kernel and Operating System

    In this chapter you will learn:


    ### What Is Linux

    Linux Kernel, Distributions of Linux, Desktop System, Shell. Everything starts
    with a proper introduction. In this chapter, we will look into Linux from an operating
    system perspective.


    ### What is Linux?

    Without going into assumptions that you know about operating system, let’s briefly
    look into the terms and definitions. Then we will try to understand what Linux
    is and its architecture. An operating system is a software program that has the
    purpose of a better way to interact with a bundle of hardware, or what we call
    a computer. It provides many ways to utilize a set of integrated and interoperable
    hardware by communicating, managing, and maintaining itself, as a set of programs.
    If we take a more traditional definition, the operating system is an interface
    between the user and the hardware. The operating system usually gets loaded into
    the memory during the boot (startup) process of a computer and basically diagnoses
    the health of the entire system, then loads things from hard disk to memory and
    other complex things. Now you know what an operating system is and how its role.
    There are many operating systems in use and the major operating systems are Unix,
    Linux, and Mac OS. Now when it comes to one of the popular operating systems,
    such as Windows, it is clear what an operating system is. It is propriety and
    clearly distinguishable. However, when it comes to Unix and Linux, there is more
    to learn about the origin and how the differences came into reality.


    If you are enthusiastic about the history of the operating systems, Unix is one
    of the oldest operating systems, especially for server systems. It was a derivative
    of an older system called `Multics`. In 1970, Ken Thompson rewrote this small
    system in `C` with Dennis Ritchie, who developed the `C` language. Unix grew quickly
    in academia and Berkeley was the center of it. They introduced the Berkeley Software
    Distribution or `BSD`. During the 70s and 80s, Unix evolved as an operating system
    outside the academy and was adopted by other organizations. There were flavors,
    like `IBM-AIX`, `HP-UX`, `Sun Solaris`, etc. An important thing to remember is
    that Unix wasn’t an open source software. Eventually, under the BSD family, some
    open source variants emerged, such as FreeBSD. This licensing is now known as
    BSD License. Linux came into the existence thanks to the effort of two important
    names: Richard Stallman and Linus Torvalds. During 90s, Richard was willing to
    create a truly open source and free alternative to proprietary Unix systems. He
    was creating a collection of utilities and programs under the name `GNU`. `GNU`
    is a recursive acronym and it stands for “GNU’s Not Unix!”. However, a set of
    programs and utilities won’t work with a kernel!


    ### What is a Kernel?

    Kernel is the core of an operating system. It has the complete control over the
    entire computer once booted into. It may be loaded by a small loading program
    and then it is the alpha and omega. It is loaded into the same or separate memory
    space, and then controls and assigns the hardware, controls input/output operations,
    software requests and processing. During the time at the University of Helsinki,
    Linus was creating a non-operating system specific program so that he can use
    his new PC with the processor that existed during those days. He was using `GNU
    C compiler` and some other tools, and the development carried on `MINIX` (although
    the architecture changed from microkernel to a monolithic kernel). Thanks to Linus
    and his relationship with GNU, Linux was born as a usable operating system and
    Richard’s free and opensource dream became a reality. Linux is a Unix-like operating
    system. We could also say it is a clone of Unix in some way. Linux basically is
    comprised of the Kernel, `GNU`, X-Windows GUI, and a Graphical Desktop system.
    It includes other applications and utilities as well.


    ### The Role of the Kernel

    Since we started with an introduction into the kernel, let’s look at some more
    technical details. This will help you to understand some important aspects of
    Linux, as well as other operating systems. Linux occupies a monolithic kernel.
    In other words, it uses the same address space to manage memory, files, processes,
    etc. This makes the kernel faster than the microkernel. It is also easier to manage.
    The only drawback is the bottleneck it creates as a single space of failure. However,
    the modern operating systems have overcome such issues and Linux distributions
    are highly robust, reliable, stable and secure operating systems. Linux kernel
    is responsible for the following tasks:

    * Process management.

    * Scheduling.

    * Inter-process communication.

    * Memory management.

    * File System management.

    * Device and driver management (hardware).

    * Network management.

    * Security.


