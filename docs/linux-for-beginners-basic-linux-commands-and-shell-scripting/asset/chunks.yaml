    # Linux 桌面系统


    Linux 桌面最初是基本的命令行或文本界面。随着 Windows 等客户端操作系统的演进，人们对组织良好的 GUI（图形用户界面）的需求日益增加。现在有多个图形化桌面可供选择。Linux
    图形环境由系统软件（如 `X-Windows` 系统）组成，在其之上是桌面环境。让我们先来看 `X-Windows`。


    ## X-Windows 系统


    个人电脑中负责图形环境的主要硬件是显示器和显卡/驱动程序。任何支持图形环境的操作系统，都必须首先与这两者通信。在 Linux 中，这是 `X-Windows`
    系统的职责。这是一个低级系统程序，通过通信和管理进程，来创建一个可以生成图形环境的环境。这就是 `X-Windows` 系统在 Linux 操作系统中所做的工作，它基于客户端/服务器架构——`X
    server` 负责处理来自任何客户端（例如应用程序）的图形请求。因此，它支持网络协议（尽管最初的通信是不安全的）。该系统是在麻省理工学院（MIT）开发的。


    在安装 Linux 期间，它会检测显示器和显卡，然后创建一个 `X-Windows` 配置文件。这在安装过程中较容易发现，因为屏幕可能会变黑并闪烁几次。


    随着发展，这个旧的系统演变成了更现代的版本：`XFree86` 和 `X.org` 版本。`XFRee86` 是一个扩展免费开源 `X-Windows` 系统的志愿者组织之一。Unix、Linux
    系统、BSD 变体、Sun Solaris 以及某些 Mac OS 系统都运行着这个发行版。


    另一个参与者是 `X.org`（Open Group 的一部分）。它将旧的 `X-Windows` 系统推向了新的高度，并在两者中都很流行。你可以在 `https://www.x.org/wiki/`
    了解更多信息。


    ## 桌面环境类型


    `X-Windows` 系统可以构建基础，但要运行完整的桌面环境还需要另一个程序来运行它，因为对于一直依赖 GUI 的普通用户来说，X-Windows 系统本身并不好用。


    为了启用全功能的桌面环境，存在另一套程序。这些被称为桌面环境（Desktop Environments）。让我们来看一些流行的环境。


    ### KDE 桌面


    KDE 或 K Desktop Environment 是较老且流行的系统之一，即使是现在如此。它之所以流行是因为它与微软 Windows 桌面环境相似。KDE
    不仅仅是一个环境，它还是一个应用程序集合。它具有高度可定制性。


    最新版本有两个变体称为 `Plasma Desktop` 和 `Plasma Notebook`。与其他桌面不同，KDE 提供全套应用程序和体验（你可以在此处查看列表：`https://kde.org/applications/`）。主要的
    Linux 平台（如 OpenSUSE 和 Kubuntu）将其作为默认。以下是 KDE 应用程序列表（版本 19.04）。


    - `Amarok` : 音乐播放器

    - `Dolphin` : 文件管理器。

    - `Dragon Player` : 视频播放器。

    - `Kate` : 开发环境。

    - `Kmail` : 带有隐私保护的电子邮件。

    - `Konsole` : KDE 终端模拟器。

    - `KOrganizer` : 联系人管理器。

    - `KWrite` : 文本编辑器。

    - `Okular` : 通用文档查看器。

    - `Spectacle` : 截图应用程序。


    ### GNOME


    GNOME 最初发布于 1999 年。GNOME 代表 `GNU Network Object Model Environment`。它是另一个极其流行的桌面环境。然而，对于习惯
    Windows 风格桌面的用户来说，GNOME 的风格不同。它背离了 Windows 的外观，但融合了许多相似的功能。如果你熟悉 Ubuntu，这就是你大部分时间必须打交道的桌面。


    在相似之处中，提供了桌面图标、类 Windows 面板（位于顶部和底部）、菜单以及拖放功能。然而，GNOME 桌面缺少一些原生的应用程序。为了解决这一障碍，使用
    GNOME 的 Linux 发行版集成了 KDE 库。如果你熟悉 Mac 系统，最新的 GNOME 界面与 Mac OS 有一些相似之处。


    GNOME 提供了以下应用程序。你可以从这里获取完整的应用程序列表：`https://wiki.gnome.org/Apps/`


    - `Empathy` : 通用即时通讯应用。

    - `Evince` : 文档查看器。

    - `Geary` : GNOME 邮件客户端。Evolution 是一个带有日历和地址簿的类似应用程序。

    - `Gedit` : 文本编辑器。

    - `Gnome-terminal` : 终端模拟器。


    其他流行的桌面环境在下面的列表中。


    - `MATE` : `MATE` 在外观和感受上某种程度上传统，带有一丝现代感。它是基于 GNOME 2 开发的。Ubuntu MATE 是一个使用 MATE
    的操作系统。更多信息请访问 `https://mate-desktop.org/`。

    - `XFCE` : `Xfce` 代表 `XFOrms Common Environment`。这是一个轻量级桌面环境，资源消耗低、用户友好且视觉上观。它与
    GNOME 桌面有些相似，因为它基于 `GTK` 工具包。然而，它不是 GNOME 的分支。它适用于 Unix 和 Linux 发行版。MX Linux、Manjaro
    和 Xubuntu 使用这个桌面环境。更多信息请访问 `https://www.xfce.org/`。

    - `LXDE` : 这代表 `Lightweight X11 Desktop Environment`。正如名称所示，它更快更轻量，但拥有功能丰富的环境。它拥有一组良好的应用程序和一个活跃的社区。LXDE
    是旧电脑的很好的桌面环境。它的外观与 GNOME 相似，但正在发生转变。其具有 GNOME 外观和感受的原因是使用了 `GTK +2` 工具包。它也运行在
    Unix 和 Linux 平台上。Lubuntu、Knoppix、Peppermint 操作系统使用 LXDE 作为它们的桌面环境。更多信息请访问 `https://lxde.org/`。


    ## GNU 工具


    我介绍了 GNU 及其与 Linux 内核的关系。你可能见过过 `GNU/Linux` 术语的使用。现在你知道背后的原因了。GNU 是为了让 Unix 用户体验类
    Unix 环境而设计的。这就是为什么该工具集包含了许多类 Unix 的命令行工具。


    Linux 系统使用一组核心工具，被称为 `coreutils`。它包含了管理文件、shell 和文本处理的工具。每个 GNU/Linux 发行版都应该包含这些核心工具。其中最重要的是
    `Shell`。在下一章中我们将更详细地查看 shell。以下是对 shell 的介绍。


    # 第 2 章：安装 Linux


    在本章中，你将学习：

    - 安装 Linux

    - UEFI 与 Legacy BIOS

    - 系统要求

    - 安装后任务

    - 故障排除


    ## 安装 Linux


    随着 Linux 发行版的演进，图形界面和工具发生了巨大的变化。安装 Linux 比比 90 年代要容易得多。这并不意味着它不能通过命令行安装。这可能是个人偏好，也可能是行业需求。例如，通过命令行安装可以同时实现服务器设置和减少攻击面。我们将在本章中研究这两种方法。让我们从系统要求开始。


    有 288 个 Linux 发行版，安装方法可能各不。我不预期涵盖所有的安装方法，因为这不是本书的意图。我们将介绍 Ubuntu 的安装，因为它非常流行且实用。


    ### 先尝试 Live CD


    如果你打算作为裸机安装（bear metal installation）安装 Linux 操作系统，你可以直接安装。但是，如果你想先尝试一下或者演示它的用法，可以先作为
    Live CD 模式运行它。大多数 Linux 发行版都支持这种模式。


    在本系列中，我们将同时使用 Ubuntu 和 Red Hat 或 CentOS 来提供示例。让我们先学习如何准备 Ubuntu Live CD。


