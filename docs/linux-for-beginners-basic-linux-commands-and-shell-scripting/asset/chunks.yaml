    # Bash Escape Sequences


    | Character | Description |

    | :--- | :--- |

    | `\a` | An ASCII bell character (07). |

    | `\d` | The date in "Weekday Month Date" format. |

    | `\e` | An ASCII escape character (033). |

    | `\h` | The hostname up to the first `.` |

    | `\H` | The hostname. |

    | `\j` | The number of jobs currently managed by the shell. |

    | `\l` | The base-name of the shell''s terminal device. |

    | `\n` | Newline. |

    | `\r` | Carriage return. |

    | `\s` | The name of the shell, the base-name of `$` |

    | `\t` | The current time in 24-hour HH:MM:SS format. |

    | `\T` | The current time in 12-hour HH:MM:SS format. |

    | `\@` | The current time in 12-hour am/pm format. |

    | `\u` | The username of the current user. |

    | `\v` | The version of bash (e.g., 2.00). |

    | `\V` | The release of bash, version + patchlevel (e.g., 2.00.0). |

    | `\w` | The current working directory. |

    | `\W` | Base-name of the current working directory. |

    | `!` | The history number of this command. |

    | `#` | The command number of this command. |

    | `$` | If the effective UID is 0, a `#`, otherwise a `$` |

    | `\nnn` | The character corresponding to the octal number `nnn`. |

    | `\\` | Backslash. |

    | `\[` | Begins a sequence of non-printing characters, which could be used to
    embed a terminal control sequence into the prompt. |

    | `\]` | End a sequence of non-printing characters. |


    Source: [https://www.tldp.org/HOWTO/Bash-Prompt-HOWTO/bash-prompt-escape-sequences.html](https://www.tldp.org/HOWTO/Bash-Prompt-HOWTO/bash-prompt-escape-sequences.html)


    You can customize your prompt using these characters in the following way.

    ![](rsrc1HJ.jpg)

    ![](rsrc1HP.jpg)


    ## Bash Color Codes


    There are lots of customizations to the bash shell, such as font colors, background
    colors, effects such as blinking, bold, underline, and many more. For a great
    list of such please visit [https://misc.flogisoft.com/bash/tip_colors_and_formatting](https://misc.flogisoft.com/bash/tip_colors_and_formatting)!


    ![](rsrc1HW.jpg)


    These customizations are not going to last for another session. To change these
    permanently, we will have to change the file associated with it. We will come
    to this point later.


    ## The Man! The Manual


    For any operating system, you get a manual available on the internet. For any
    GNU application this is the same. However, for bash there is a built-in manual
    and you must become familiar with it. It offers exceptional information and help
    when you do not know something, for instance, a new command.


    The first command you are going to officially learn is `man .`. As you are aware,
    no book can provide a more comprehensive guide on Linux commands and use with
    examples and practical use, but `man` can.


    ## man Command Syntax, Output and Parameters


    The following is the output of the command `man man .`.

    ![](rsrc1J6.jpg)

    Image: Linux man command


    These manuals have several sections and you may want to save time by requesting
    the selection at once. The following list has the sections by numbers.


    ### Table: Man page sections


    | Section | Content |

    | :--- | :--- |

    | 1 | User Commands |

    | 2 | System Calls |

    | 3 | Library Functions |

    | 4 | Special Files (i.e., device files) |

    | 5 | File Formats and File Systems |

    | 6 | Games |

    | 7 | Overview and Miscellaneous |

    | 8 | System Administration and Privilege Commands |

    | 9 | Kernel Routines |

    | l | Local Documentation |

    | n | New Pages |


    To get these definitions you can use the following command: `man n intro`

    ![](rsrc1MT.jpg)

    ![](rsrc1MX.jpg)

    Image: A Linux man page


    There is another important fact about these man pages. Each page has different
    sections. To reduce the time consumption, you have to have an idea of what these
    sections are.


    ### Table: Parts of man page


    | Section | Purpose |

    | :--- | :--- |

    | Name | Name and a short description |

    | Synopsis | Syntaxes |

    | Description | A comprehensive description |

    | Definitions | Program-related definitions |

    | Examples | Examples |

    | Overview | An outlook |

    | Defaults | Defaults for the specific program/command |

    | Options | Options for the specific program/command |

    | Arguments | Possible arguments a user can supply |

    | Parameters | Parameters storing values |

    | Invocations | Specific related to invoking commands |

    | Reserved Words | Reserved words for a system or a program |

    | Exit Status | The exit status or code |

    | Errors | Errors |

    | Reporting Bugs | How to report bugs if found |

    | Comments | Comments section |

    | Environment | A set of environment variables used |

    | Files | Related files, e.g., specific configuration files involved |

    | Author | Author |

    | Copyright | Copyright information |

    | History | History of a program or a command |

    | See Also | Related topics, e.g., commands |

