    # Linux 发版对比


    ## Knoppix

    Knoppix 是一个稳定的 Linux 发行版。它是最早的 Linux CD 之一。该系统非常成熟，包含 1000 多个软件包。Knoppix 的优势之一是它支持独特的硬件。尽管
    Knoppix 旨在从实时介质运行，但它也可以安装到硬盘中。Knoppix 有许多派生版本。


    ## Tiny Core Linux

    Tiny Core Linux 发行版是一个非常小的便携操作系统。它仅有 10MB。由于该操作系统非常小，它不包含应用程序或文件管理器。不过，用户可以稍后安装它们。这是初学者的推荐选项之一。


    ## Ubuntu

    Ubuntu 并没有特定的 LiveCD。但是，它的 ISO 镜像可以刻录到 DVD 或设置为 USB 启动盘。它从它启动时提供了一个“试用”的选项。


    ## MX Linux

    MX Linux 适用于旧电脑和现代电脑。这是一个用户友好的发行版，新手也可以使用。

    '
- fmt: "\n# The Linux Desktop System\n\nLinux desktop was a basic command line or\
    \ text interface in the beginning. With the evolution of client operating systems\
    \ such as Windows, there was more demand for a well-organized GUI. Now there are\
    \ multiple graphical desktops to select from. The Linux graphical environment\
    \ consists of a system software, such as the `X-Windows` system, and on top of\
    \ it there is a desktop environment. Let’s first look at the `X-Windows`.\n\n\
    ## The X-Windows System\n\nThe main hardware responsible for graphical environment\
    \ in your PC is the monitor and the graphics card/driver. Any operating system\
    \ if supports graphical environment, must communicate with both first. In Linux\
    \ it is the responsibility of the `X-Windows` system. This is a low-level system\
    \ program communicating and managing the processes to create an environment where\
    \ graphical environment can be created. This is what the `X-Windows` system does\
    \ in a Linux operating system and is based on a client/server architecture – `X\
    \ server` is responsible for handling the graphics request from any clients (e.g.,\
    \ applications). Therefore, it supported network protocols (initially, the communication\
    \ was insecure, however). This system was developed at MIT.\n\nDuring the installation\
    \ of Linux, it will detect the monitor and the graphics card and then an `X-Windows`\
    \ configuration file will be created. This is easier to spot during an installation,\
    \ as the screen may turn Black and may blink a few times.\n\nWith the development,\
    \ this older system evolved into more modern editions. The `XFree86` and `X.org`\
    \ editions. The `XFRee86` is one of the volunteer organization expanding the free\
    \ and opensource `X-Windows` system. Unix, Linux systems, BSD variants, Sun Solaris,\
    \ and some Mac OS systems run this distribution.\n\nThe other player is `X.org`\
    \ (part of the Open Group). It took the old `X-Windows` system to new heights\
    \ and is now popular among the two. You can find out more at `https://www.x.org/wiki/`.\n\
    \n## Types of Desktop Environments\n\nThe `X-Windows` system can construct the\
    \ base, but to run a complete desktop environment another program must run it\
    \ because X-Windows system is not useful when it comes to regular users who depend\
    \ on a GUI all the time.\n\nIn order to enable the full featured desktop environment,\
    \ another set of programs exist. These are known as the Desktop Environments.\
    \ Let’s have a look at some of the popular environments.\n\n### KDE Desktop\n\n\
    KDE or the K Desktop Environment is one of the older and popular systems, even\
    \ now. It gained the popularity because it was similar to the Microsoft Windows\
    \ desktop environment. KDE is not just an environment. It is also a collection\
    \ of applications. It is also highly customizable.\n\nThe latest versions have\
    \ two variations called `Plasma Desktop` and `Plasma Notebook`. Unlike other desktops\
    \ KDE offer a full set of applications and experience (you can get a full list\
    \ here: `https://kde.org/applications/` ). Major Linux platforms, such as OpenSUSE\
    \ and Kubuntu use this as the default. Here is a list of KDE applications (version\
    \ 19.04).\n\n- `Amarok` : Music Player\n- `Dolphin` : File manager.\n- `Dragon\
    \ Player` : Video player.\n- `Kate` : Development environment.\n- `Kmail` : Email\
    \ with privacy protection.\n- `Konsole` : KDE terminal emulator.\n- `KOrganizer`\
    \ : Contact manager.\n- `KWrite` : Text editor.\n- `Okular` : Universal document\
    \ viewer.\n- `Spectacle` : Screenshot application.\n\n### GNOME\n\nGNOME was first\
    \ released in 1999. GNOME stands for `GNU Network Object Model Environment`. It\
    \ is another extremely popular desktop environment. However, for the user who\
    \ depends on Windows-like desktop, GNOME has a different taste. It moved away\
    \ from the Windows look and yet incorporates many similar features. If you are\
    \ familiar with Ubuntu, this is the desktop you have to deal with most of the\
    \ time.\n\nAmong the similarities, the desktop icons, Windows-like panels (at\
    \ the top and bottom), menus and drag-drop capabilities are available. However,\
    \ there is a lack of application for GNOME desktop. To handle this obstacle, the\
    \ Linux distributions that use GNOME, incorporates KDE libraries. The latest GNOME\
    \ interface has some similarities to Mac OS if you are familiar with Mac systems.\n\
    \nGNOME offers the following applications. You can get a full list of applications\
    \ from here: `https://wiki.gnome.org/Apps/`\n\n- `Empathy` : A universal messenger\
    \ app.\n- `Evince` : Document viewer.\n- `Geary` : GNOME mail client. Evolution\
    \ is a similar application with calendar and an address-book.\n- `Gedit` : Text\
    \ editor.\n- `Gnome-terminal` : Terminal emulator.\n\nOther popular desktop environments\
    \ are in the list below.\n\n- `MATE` : `MATE` is somewhat traditional in its look\
    \ and feel with a hint of modernism. It was developed based on GNOME 2. Ubuntu\
    \ MATE is an operating system that uses MATE. More information is available at\
    \ `https://mate-desktop.org/`.\n- `XFCE` : `Xfce` stands for `XFOrms Common Environment`.\
    \ This is a light-weight desktop environment which consumes low resources, user-friendly\
    \ and visual appealing. It is somewhat similar to the GNOME desktop because it\
    \ is based on the `GTK` toolkit. However, it is not a GNOME fork. It is available\
    \ for both Unix and Linux distributions. MX Linux, Manjaro and Xubuntu use this\
    \ desktop environment. More information is available at `https://www.xfce.org/`.\n\
    - `LXDE` : This stands for `Lightweight X11 Desktop Environment`. As the name\
    \ implies, it is faster and lighter, yet has a feature rich environment. It has\
    \ a good set of applications and an active community. LXDE is a great desktop\
    \ environment for older computers. This had a similar look to GNOME, but it is\
    \ transforming. The reason behind its GNOME look and feel is the use of `GTK +2`\
    \ toolkit. This also runs on Unix and Linux platforms. Lubuntu, Knoppix, Peppermint\
    \ operating systems use LXDE as their desktop environment. More information is\
    \ available at `https://lxde.org/`.\n\n## GNU Utilities\n\nI introduced GNU and\
    \ the relationship it had with Linux kernel. You may have seen the use of `GNU/Linux`\
    \ term. Now you know the reason behind it. GNU was designed for Unix people to\
    \ experience a Unix-like environment. This is why the set of utilities include\
    \ many Unix-like command line utilities. \n\nLinux system uses a set of core utilities\
    \ and is known as `coreutils`. It includes the utilities to manage file, shell\
    \ and text manipulation. Every GNU/Linux distribution should include these core\
    \ utilities. The most important one among these is the `Shell`. In the next chapter\
    \ we will look into the shell in more detail. The following is an introduction\
    \ to the shell.\n\n### The Shell\n\nThe `Shell` is basically a program that takes\
    \ keyboard input to the operating system to process. It is an interactive utility.\
    \ `Shell` supports functions such as file management, execute/manage programs,\
    \ and processes. The core component of the shell is the command prompt.\n\nThe\
    \ shell provides the access to its internal commands so that a user can perform\
    \ actions on files, such as creating and deleting. Furthermore, it provides the\
    \ ability to execute and end programs.\n\nYou can create a program using a set\
    \ of shell commands. We call this “shell scripting”. We will be looking at this\
    \ in detail in the next chapters.\n\n# CHAPTER 2: Installing Linux\n\nIn this\
    \ chapter you will learn:\n- Installing Linux\n- UEFI vs Legacy BIOS\n- System\
    \ Requirements\n- Post-installation Tasks\n- Troubleshooting\n\n## Installing\
    \ Linux\n\nWith the evolution of Linux distributions, there have been radical\
    \ changes to the graphical interfaces and utilities. Installing Linux is much\
    \ easier than in 90s. This does not mean it cannot be installed via command line.\
    \ It can be a personal preference or probably an industry requirement. For an\
    \ example, both the setting up a server and reduce the attack surface can be achieved\
    \ through command line installation. We will look into both the methods in this\
    \ chapter. Let’s start with the system requirements.\n\nThere are 288 Linux distributions\
    \ and the installation methods can be different. I am not expecting to cover all\
    \ the installation methods, as it is not the intention of the book. We will look\
    \ into the installation of Ubuntu as it is quite popular and useful.\n\n### Trying\
    \ a Live CD first\n\nIf you are expecting to install a Linux operating system\
    \ as a bear metal installation you can install it straightaway. However, if you\
    \ want to try it out first or a demonstration of its use, you can first run it\
    \ as a Live CD. This mode is supported by most Linux distributions.\n\nIn this\
    \ series, we will be using both Ubuntu and Red Hat or Cento OS to provide examples.Let’s\
    \ learn how to prepare Ubuntu Live CD first.\n"
  raw: 'The Linux Desktop SystemLinux desktop was a basic command line or text interface
    in the beginning. With the evolution of client operating systems such as Windows,
    there was more demand for a well-organized GUI. Now there are multiple graphical
    desktops to select from. The Linux graphical environment consists of a system
    software, such as the X-Windows system, and on top of it there is a desktop environment.
    Let’s first look at the X-Windows.The X-Windows SystemThe main hardware responsible
    for graphical environment in your PC is the monitor and the graphics card/driver.
    Any operating system if supports graphical environment, must communicate with
    both first. In Linux it is the responsibility of the X-Windows system. This is
    a low-level system program communicating and managing the processes to create
    an environment where graphical environment can be created. This is what the X-Windows
    system does in a Linux operating system and is based on a client/server architecture
    – X server is responsible for handling the graphics request from any clients (e.g.,
    applications). Therefore, it supported network protocols (initially, the communication
    was insecure, however). This system was developed at MIT.During the installation
    of Linux, it will detect the monitor and the graphics card and then an X-Windows
    configuration file will be created. This is easier to spot during an installation,
    as the screen may turn Black and may blink a few times.With the development, this
    older system evolved into more modern editions. The XFree86 and X.org editions.The
    XFRee86 is one of the volunteer organization expanding the free and opensource
    X-Windows system. Unix, Linux systems, BSD variants, Sun Solaris, and some Mac
    OS systems run this distribution.The other player is X.org (part of the Open Group).
    It took the old X-Windows system to new heights and is now popular among the two.
    You can find out more at https://www.x.org/wiki/Types of Desktop EnvironmentsThe
    X-Windows system can construct the base, but to run a complete desktop environment
    another program must run it because X-Windows system is not useful when it comes
    to regular users who depend on a GUI all the time.In order to enable the full
    featured desktop environment, another set of programs exist. These are known as
    the Desktop Environments . Let’s have a look at some of the popular environments.KDE
    DesktopKDE or the K Desktop Environment is one of the older and popular systems,
    even now. It gained the popularity because it was similar to the Microsoft Windows
    desktop environment. KDE is not just an environment. It is also a collection of
    applications. It is also highly customizable.The latest versions have two variations
    called Plasma Desktop and Plasma Notebook. Unlike other desktops KDE offer a full
    set of applications and experience (you can get a full list here: [https://kde.org/applications/](https://kde.org/applications/)
    ). Major Linux platforms, such as OpenSUSE and Kubuntu use this as the default.
    Here is a list of KDE applications (version 19.04).-         Amarok : Music Player-
            Dolphin : File manager.-         Dragon Player : Video player.-        
    Kate : Development environment.-         Kmail : Email with privacy protection.-
            Konsole : KDE terminal emulator.-         KOrganizer : Contact manager.-
            KWrite : Text editor.-         Okular : Universal document viewer.-        
    Spectacle : Screenshot application.GNOMEGNOME was first released in 1999\. GNOME
    stands for GNU Network Object Model Environment. It is another extremely popular
    desktop environment. However, for the user who depends on Windows-like desktop,
    GNOME has a different taste. It moved away from the Windows look and yet incorporates
    many similar features. If you are familiar with Ubuntu, this is the desktop you
    have to deal with most of the time.Among the similarities, the desktop icons,
    Windows-like panels (at the top and bottom), menus and drag-drop capabilities
    are available. However, there is a lack of application for GNOME desktop. To handle
    this obstacle, the Linux distributions that use GNOME, incorporates KDE libraries.
    The latest GNOME interface has some similarities to Mac OS if you are familiar
    with Mac systems.GNOME offers the following applications. You can get a full list
    of applications from here: [https://wiki.gnome.org/Apps/](https://wiki.gnome.org/Apps/)-
            Empathy : A universal messenger app.-         Evince : Document viewer.-
           Geary : GNOME mail client. Evolution is a similar application with calendar
    and an address-book.-         Gedit : Text editor.-         Gnome-terminal : Terminal
    emulator.Other popular desktop environments are in the list below.-        MATE
    : MATE is somewhat traditional in its look and feel with a hint of modernism.
    It was developed based on GNOME 2\. Ubuntu MATE is an operating system that uses
    MATE. More information is available at https://mate-desktop.org/-        XFCE
    : Xfce stands for XFOrms Common Environment . This is a light-weight desktop environment
    which consumes low resources, user-friendly and visual appealing. It is somewhat
    similar to the GNOME desktop because it is based on the GTK toolkit. However,
    it is not a GNOME fork. It is available for both Unix and Linux distributions.
    MX Linux, Manjaro and Xubuntu use this desktop environment. More information is
    available at https://www.xfce.org/-        LXDE : This stands for Lightweight
    X11 Desktop Environment. As the name implies, it is faster and lighter, yet has
    a feature rich environment. It has a good set of applications and an active community.
    LXDE is a great desktop environment for older computers. This had a similar look
    to GNOME, but it is transforming. The reason behind its GNOME look and feel is
    the use of GTK +2 toolkit. This also runs on Unix and Linux platforms. Lubuntu,
    Knoppix, Peppermint operating systems use LXDE as their desktop environment. More
    information is available at [https://lxde.org/](https://lxde.org/)GNU UtilitiesI
    introduced GNU and the relationship it had with Linux kernel. You may have seen
    the use of GNU/Linux term. Now you know the reason behind it. GNU was designed
    for Unix people to experience a Unix-like environment. This is why the set of
    utilities include many Unix-like command line utilities.Linux system uses a set
    of core utilities and is known as coreutils . It includes the utilities to manage
    file, shell and text manipulation. Every GNU/Linux distribution should include
    these core utilities. The most important one among these is the Shell . In the
    next chapter we will look into the shell in more detail. The following is an introduction
    to the shell.The ShellShell is basically a program that takes keyboard input to
    the operating system to process. It is an interactive utility. Shell supports
    functions such as file management, execute/manage programs, and processes. The
    core component of the shell is the command prompt.The shell provides the access
    to its internal commands so that a user can perform actions on files, such as
    creating and deleting. Furthermore, it provides the ability to execute and end
    programs.You can create a program using a set of shell commands. We call this
    “shell scripting” . We will be looking at this in detail in the next chapters.CHAPTER
    2:  Installing LinuxIn this chapter you will learn:Installing LinuxUEFI vs Legacy
    BIOSSystem RequirementsPost-installation TasksTroubleshootingInstalling LinuxWith
    the evolution of Linux distributions, there have been radical changes to the graphical
    interfaces and utilities. Installing Linux is much easier than in 90s. This does
    not mean it cannot be installed via command line. It can be a personal preference
    or probably an industry requirement. For an example, both the setting up a server
    and reduce the attack surface can be achieved through command line installation.
    We will look into both the methods in this chapter. Let’s start with the system
    requirements.There are 288 Linux distributions and the installation methods can
    be different. I am not expecting to cover all the installation methods, as it
    is not the intention of the book. We will look into the installation of Ubuntu
    as it is quite popular and useful.Trying a Live CD firstIf you are expecting to
    install a Linux operating system as a bear metal installation you can install
    it straightaway. However, if you want to try it out first or do a demonstration
    of its use, you can first run it as a Live CD. This mode is supported by most
    Linux distributions.In this series, we will be using both Ubuntu and Red Hat or
    Cento OS to provide examples.Let’s learn how to prepare Ubuntu Live CD first.'
