    ### CHAPTER 6: Working with Disk, Media and Data Files

    In this chapter you will learn with Disks and Partitions, Working with data files,
    Sorting with `grep`, and Comping files.


    In this chapter, we will be looking into some advanced commands to monitor basic
    disk properties, manage media files, such as mounting and unmounting, and learn
    how to manage data files with more advanced commands.


    #### Working with Disks

    In the previous chapter, we discussed how Linux treats the file system and what
    the defaults are. We will briefly look into the Linux disk formats and file systems.

    Linux distributions run on the following disk formats:

    - `ext2`

    - `ext3`

    - `ext4`

    - `jfs`

    - `ReiserFS`

    - `XFS`

    - `Btrfs`


    ext2, 3, and 4

    This is the most used Linux file system nowadays. `ext` is successor of Extended
    Filesystem (etc). The second version added more improvements and addressed limitations
    of the `ext` version (used in MINIX systems). It the size to 16 GB to 2 TB. `ext2`
    is often used with removable media. The biggest improvement was the journaling
    capability. Linux kernel 2.4.15 integrated the `ext2` file system. The leap was
    a major relief as it was very stable and did not need to check the disk once the
    machine goes through a clean shutdown. The upgrade capability from `ext2` to `ext3`
    was flawless. The third version extended the capabilities and the fourth version
    focused on performance standards. `ext4` is the current version. This was released
    with the kernel version 2.6.28 and offered backward compatibility. It supports
    16 GB to 16 TB maximum size and provides a mechanism to turn off journaling.


    JFS

    The Journaling File System was developed by IBM for AIX UNIX. It can be used as
    an alternative to `ext4` when there are minimal system resources, especially the
    processing power.


    ReiserFS

    ReiserFS is introduced as an alternative to `ext3` with more advanced features
    and performance. It also has a faster journaling system.


    XFS

    It is a high speed JFS with parallel I/O processing.

    In the previous chapters, the logical volume manager (LVM) was introduced (the
    virtual file system). The following image is a view of the entire LVM file structure.

