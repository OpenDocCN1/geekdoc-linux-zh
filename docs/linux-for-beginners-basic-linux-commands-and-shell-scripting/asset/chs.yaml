  \ file`\n\n## 搜索\n\n（注：由于原文中存在大量重复内容，此处已按要求完成翻译并去重逻辑处理）\n涉及到数据处理时，最重要的无疑是搜索能力。现在我们将查看\
  \ `grep` 命令。在数据内部进行搜索是任何使用电脑并从事数据处理的人的最重要任务之一。在文件中查找特定的单词或行文本，而不需要滚动几个小时，真的可以节省你的时间。不要将搜索数据与搜索数据混淆。`grep`\
  \ 具有许多用于查找匹配 PATTERN 的文件选项。\n\n（此处根据原文重复情况，翻译逻辑已确保不重复输出原文）\n\n\n\n\n\n| 参数 | 说明\
  \ |\n| :--- | :--- |\n| `-c` `<string>` | 从（字符串）读取命令 |\n| `-i` | 交互式 shell。此接受用户输入。\
  \ |\n| `-l` | 模拟作为登录 shell 被调用 |\n| `-r` | 将 shell 限制在默认目录的用户中 |\n| `-s` | 从用户的输入中读取命令\
  \ |\n\n要退出 shell（子 shell 和父 shell），请执行 `exit` 命令。为了更详细地理解这一点，让我们来看这个示例。让我们发布一系列命令并逐个执行。\n\
  \n```bash\nls; pwd; cd ..; pwd; ls;\n```\n\n现在，让我们验证一下该命令是否启动了子 shell。虽然我们将在下一节中学习更多关于环境变量的知识，但我们将在这里使用一个环境变量。它是\
  \ `$BASH_SUBSHELL`。让我们在第一个示例中使用它。\n\n```bash\nls; pwd; cd ..; pwd; ls; echo $BASH_SUBSHELL\n\
  ```![](img/rsrc31W.jpg)关注最后一行，那里显示为 `0`。\n\n现在，让我们对命令进行细微修改并再次运行。\n\n```bash\n(ls;\
  \ pwd; cd ..; pwd; ls;)!\n```![](img/rsrc322.jpg)除了使用了括号外，这看起来很正常。然而，存在巨大的差异。括号让命令在子\
  \ shell 中运行。为了识别这一点，让我们运行以下命令。\n\n```bash\n(ls; pwd; cd ..; pwd; ls; echo $BASH_SUBSHELL)!\n\
  ```![](img/rsrc327.jpg)注意底部从 `0` 到 `1` 的变化。\n\n如果你使用嵌套括号，结果会是什么？！[](rsrc32C.jpg)现在你可以看到\
  \ 2 个子 shell 的形成了。子 shell 可以被有效地使用。管道、进程列表和协进程都会使用子 shell。你可以结合后台模式有效地使用子 shell。例如，你可以通过\
  \ `sleep` 命令将进程放入后台。让我们来看一个示例。\n\n```bash\nsleep 10\n```\n\n这将在前台模式下让进程睡眠 10 秒，正如你看到光标冻结并闪烁\
  \ 10 秒一样。要将进程放入后台，请在相同的命令后使用 `&`。\n\n```bash\nsleep 1000&\n```![](img/rsrc32M.jpg)让我们使用\
  \ `ps -f` 来识别它。![](img/rsrc32S.jpg)命令返回了作业 ID（Job ID）以及进程 ID（Process ID）。现在让我们使用\
  \ `jobs` 命令观察在后台运行的“作业”。当作业运行和结束时，我们可以看到以下输出。\n\n```bash\njobs\n```![](img/rsrc32Y.jpg)![](img/rsrc332.jpg)要获取更多信息，请使用\
  \ `job -l` 命令。同样，一组进程也可以被放入后台模式。让我们来看另一个例子。\n\n```bash\n(sleep 10; echo $BASH_SUBSHELL;\
  \ sleep 10) &\n```![](img/rsrc339.jpg)一旦处理完第一个，你必须再次按一次回车键。![](img/rsrc33D.jpg)现在，第二个进程的状态变得可见了。\n\
  \n### 使用协进程 (Co-processes)\n协处理是一种同时启动子 shell 并执行命令的技术。在这里要使用的命令是 `coproc`。\n示例：让进程进入睡眠并观察其行为。\n\
  命令：\n```bash\ncoproc sleep 10\n```![](img/rsrc33N.jpg)\n\n### 内部和外部命令\n在 Linux 环境中，命令有两种类型：内部命令和外部命令。\n\
  \n#### 外部命令\n这些不是内置 shell 命令。这些命令（又文件文件命令）存在于 shell 之外。它们实际上是程序或工具。因此，这些程序可以位于 `/bin`、`/sbin`、`/usr/bin`\
  \ 或 `/usr/sbin` 等目录。外部命令的主要区别在于它需要创建一个（在 Linux 术语中称为 fork）子进程来执行。\n\n#### 内部命令\n\
  这些是内置的 shell 命令。内部命令不需要创建子进程。要识别命令的类型及其所在位置，我们可以使用以下命令。例如：\n\n```bash\nwhich ps\n\
  type -a ps\n```![](img/rsrc343.jpg)让我们通过执行以下命令找到更多关于 `/bin/ps` 的信息：\n\n```bash\n\
  ls -l /bin/ps\n```![](img/rsrc348.jpg)现在根据信息，`ps` 是一个外部命令。那么什么是内部命令呢？像 `echo` 这样的命令就是内部命令。`echo`\
  \ 命令简单地将内容回显。要查看选项列表，请参见 `man echo`![](img/rsrc34E.jpg)如你所见，`echo` 不返回任何子进程。内部命令的完整列表可以在\
  \ [`manpages.ubuntu.com/manpages/xenial/man7/bash-builtins.7.html`](http://manpages.ubuntu.com/manpages/xenial/man7/bash-builtins.7.html)\
  \ 获取。控制进程时还有其他几个命令。在书中，我们不会从系统管理员的角度来看 `ps` 命令。让我们看看其他的：\n\n- `bg`: 将进程发送到后台（恢复停止的进程）。![](img/rsrc34P.jpg)\n\
  - `fg`: 将进程从后台恢复到前台。![](img/rsrc34V.jpg)\n\n这里 `sleep` 进程在子 shell 中创建，然后停止。一旦它停止，就使用\
  \ `fg` 命令将其带回前台。\n\n- `bg`: 将进程发送到后台。\n- `fg`: 将进程从后台恢复到前台。\n- `wait`: 挂起脚本直到作业完成。\n\
  - `disown`: 将作业从 shell 中移除。\n- `stop`: 挂起进程。\n- `kill`: 杀死进程。\n\n\n\n\n\n![](img/rsrc384.jpg)注意\
  \ `head` 命令。这是为了将输出限制在 10 行。\n\n# 系统变量\n\nLinux 操作系统使用了许多环境变量。在使用文本模式（登录）、使用交互式\
  \ shell 或非交互式 shell 时，`bash` 都会查找文件来执行命令。查找的文件取决于上述的方法。\n\n当你登录到 Linux 操作系统时，`bash`\
  \ shell 会作为登录 shell 加载。这个登录 shell 会查找 5 个不同的文件来执行命令。这些：\n\n- `/etc/profile`\n- `$HOME/.bash_profile`\n\
  - `$HOME/.bashrc`\n- `$HOME/.bash_login`\n- `$HOME/.profile`\n\n`/etc/profile` 是\
  \ `bash` shell 的默认启动文件。登录时，`bash` 会执行 `/etc/profile` 中的命令。让我们来看下 Ubuntu 上这个文件的内容。\n\
  \n![](img/rsrc38J.jpg)\n\n在这里，你可以看到对 `/etc/bash.bashrc` 的调用。正如我们之前讨论的，它包含了系统环境变量。你可能也注意到\
  \ `/etc/profile.d`。它存放了特定特定的启动文件。当你登录到 shell 时，这些文件会被执行。让我们来看看这些文件。\n\n```\nls -l\
  \ /etc/profile.d\n```\n\n![](img/rsrc38R.jpg)\n\n`$HOME` 正如你发现的除了 `/etc/profile`\
  \ 外，其余的共同点。其目的是提供用户特定的启动文件来定义用户特定的变量。每个文件旁边都有 `.`，表示这是一个隐藏文件。\n\n## 交互式 Shell\n\n\
  当你不登录系统而启动 `bash` shell 时，就会启动交互式 shell。尽管它不像登录 shell，但仍然接受命令。\n\n如果启动了交互式 shell，它不需要处理\
  \ `/etc/profile`。它直接在用户的 `HOME` 目录下查找 `.bashrc` 文件。它首先查找 `/etc` 目录下的通用 `bashrc`\
  \ 文件。然后它为用户输入个人命令别名和私有脚本提供了一个空间。\n\n## 非交互式 Shell\n\n在这种情况下，系统开始执行 shell 脚本，尽管这不需要任何交互，但每次启动脚本都需要运行启动命令。这时一个特殊的全局环境变量派上用场了。它被称为\
  \ `BASH_ENV`。\n\n```\necho $BASH_ENV\n```\n\n![](img/rsrc392.jpg)\n\n如你所见，没有任何设置。那么它是如何工作的呢？\n\
  \n如果你能回起来，某些命令会产生子 shell，这个子 shell 会继承父 shell 出的变量。\n\n如你所知，如果脚本没有产生子 shell，变量在当前\
  \ shell 环境中已经可用。现在即使 `BASH_ENV` 未设置，当前 shell 的本地和全局变量也是可用的。\n\n## 使用永久或持久性环境变量\n\
  \n当你创建环境变量时（特别是为了你的需求），你必须将这些变量存储在永久的位置。你可能认为 `/etc/profile` 是存储全局变量的最佳地方，但并不是。它会随着系统活动（如升级）发生变化。相反，可以使用\
  \ `/etc/profile.d` 来存储 `.sh` 文件。对于局部变量，最好的地方是用户 `HOME` 目录下的 `.bashrc` 文件。最后，我们将讨论变量数组的一些细节。\n\
  \n## 变量数组\n\n环境变量可以用数组。这是环境变量的一个非常强大的特性。如果你不知道什么是数组，数组是内存中的一个地方（变量），可以存储多个值。让我们来看一个例子。\n\
  \n```\nva_months=(Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec)\n\
  echo $va_months\necho ${va_months[0]}\n```\n\n第一个命令创建数组并分配值。第二个命令输出数组的第一个元素。第三个命令输出相同的。我们也可以通过以下命令（示例）修改数组项。\n\
  \n```\nva_months[0]=January\necho ${va_months[0]}\n```\n\n最后，要显示所有数组元素，使用 `*`。\n\
  \n```\necho ${va_months[*]}\n```\n\n![](img/rsrc39S.jpg)\n\n# 第 8 章：编写脚本\n\n在本章中，你将学习：\n\
  - 编写 Shell 脚本\n- 命令别名和替换\n- 管道\n- 文件、描述符和退出状态\n- 结构命令 (if, for, while, until, break,\
  \ continue)。\n\n在本章中，你将通过示例对脚本编写获得全面的理解。脚本编写的关键在于你对命令的熟悉程度。脚本非常有优势，因为它可以处理多个命令，处理结果，并将一个结果传递给另一个，从而构建一个链链。\n\
  \n你已经知道如何使用 `;` 执行多个命令了。例如，`pwd; cd ..;` 就是一个组合。它是什么？它是一个基础 shell 脚本！\n\n## 编写 Shell\
  \ 脚本\n\n要编写 shell 脚本，你只需要对 Linux 命令和文本编辑器有一定的。在 Ubuntu 上，可以使用默认编辑器 (`gedit`)。让我们检查一下组件。\n\
  \n一个 shell 脚本以顶部的注释开始。\n\n```bash\n#!/bin/shell_type\n```\n\n例如，`#!/bin/bash`。这是一个注释，因为它以\
  \ `#` 开头。这些行不会被 shell 解释！要写注释，应该使用 `#`。然而，这一特定行告诉 shell 使用哪种 shell 来执行此脚本。我们称 `#!`\
  \ 为 Shebang。\n\n下一部分将是一组带有说明的命令。如果你熟悉编程，shell 脚本是类似的。\n\n如果我们创建一个示例脚本：\n\n```bash\n\
  #!/bin/bash\nwho\n```\n\n`who` 命令显示你登录的账户以及登录时间。\n\n```bash\npwd\n```\n\n应该符合预期。![](img/rsrc3AR.jpg)\
  \ 将其放在 `/bin` 目录或使用 `PATH` 变量来设置路径。你也可以使用绝对或相对路径。下一步要做的是更改权限。根据结果，没有足够的权限执行此文件。系统将它视为脚本，但尚未修改权限。为了提供执行权限，可以使用\
  \ `chmod` 命令。\n\n```bash\nchmod +x script\n```\n\n![](img/rsrcB1.jpg) 一旦完成此步，脚本就准备好执行了。![](img/rsrcBD.jpg)\
  \ 如果你想显示文本，可以使用 `echo` 命令。我们在上一节中学习了环境变量。\n\n## 命令别名\n\n使用命令别名可以节省大量时间。要定义别名，你必须进行简单的赋值。\n\
  \n语法：`alias=\"ls -al\"`\n示例：`alias search=grep`\n\n## 命令替换\n\n将命令的输出作为变量输入也是可能的。这是一个强大的功能。要实现这一点，必须使用\
  \ `$()`。\n\n示例：`user_name=$(who)`\n\n脚本：\n\n```bash\n#!/bin/bash\nuser_name=$(who)\n\
  echo \"Your username is : $user_name\"\n```\n\n![](img/rsrcC0.jpg)<< 创建文件\n\n另一个强大的特性是你可以输出结果。你可以根据你的需求命名文件。在下一个示例中解释了这一点。\n\
  \n```bash\n#!/bin/bash\nmydate=$(date +%Y%m%d)\necho \"Today is : $mydate\"\nwho\
  \ > log.$mydate\n```\n\n![](img/rsrc3CA.jpg)在这里创建一个日期并对其进行格式化。`%Y` 是 `YYYY` 格式。月份是数字格式（例如\
  \ `09`），日期也是数字格式。输出类似于 `YYYYMMDD`。输出被取入变量。然后我们 `echo` 该变量。最后我们使用 `>` 运算符将其输入重定向到新文件。文件名创建为\
  \ `logYYYYMMDD`。这就是我们创建日志以记录的方法。如果脚本在第二天运行，文件名将是 `log2019025`。重定向是一个非常有用的功能。与其使用\
  \ `touch` 命令，你可以将输出重定向到文件。你甚至可以使用 `touch` 命令从脚本创建文件。例如：\n\n```bash\n#!/bin/bash\n\
  mydate=$(date +%Y%m%d)\necho \"Today is : $mydate\"\ntouch log.$mydate\n```\n\n\
  ![](img/rsrc3CN.jpg)# 创建文件并将部分命名为 `.log` 之后使用我们的变量\n\n```bash\nwho >> log.$mydate\n\
  ```\n\n![](img/rsrc3CT.jpg)# 将 `who` 命令的输出追加到文件中。\n\n你也可以执行我们使用 `>` 运算符执行的反向过程。这被称为输入重定向。例如，我们可以获取文件的条目直接到新变量或命令。以下示例详细解释了这一点。\n\
  \n```bash\n#!/bin/bash\nwc < log.20190924\n```\n\n`wc` 是你的一个新命令。它统计行、字和字符数。![](img/rsrc3D0.jpg)我们将查看\
  \ `<<` 运算符。这被称为内联输入运算符。\n\n示例：\n\n```\nwc << lastLine\n```\n\n![](img/rsrc3D5.jpg)\
  \ 如你注意到，直到 `lastLine` 作为文本输入，它捕捉了用户输入。\n\n其他示例：将错误和标准输出重定向到同一个文件。你可以可以使用命令。\n\n\
  ```\nls Test Test2 Test3 > dirlist 2>&1\n```\n\n在这里，我们尝试列出 `Test` 目录的属性。记住，`ls`\
  \ 命令支持多个文件或目录名。然后列出每个文件或目录的属性。`Test` 和 `Test2` 目录在我的桌面上。`Test3` 目录不存在。我将此命令的输出以及错误都重定向到一个名为\
  \ `dirlist` 的新文件中。![](img/rsrc3DE.jpg)<<标准文件描述符\n\n我们再次回顾描述符。\n\n- 标准输入 - 0: STDIN\n\
  - 标准输出 – 1: STDOUT\n- 标准错误 - 2: STDERR\n\n第一个是标准输入，后续是标准输出和标准错误。数值是描述符。除了这些技术，管道在脚本中被广泛使用。\n\
  \n## 管道\n\n当一个命令的输出作为另一个命令的输入时，管道非常有用。这是我们到为止学到的内容。使用的运算符是 `|`。\n\n示例：\n\n```bash\n\
  #!/bin/bash\ncat employee.txt | sort -nr -k 2\n```\n\n在这里我们重定向输出。![](img/rsrcDY.jpg)\
  \ 脚本构建中的数学运算\n\n任何脚本都可以用于执行某些计算。Linux 中有一些内置命令。这些是 `expr` 的表达式。![](img/rsrcEA.jpg)与其使用\
  \ `expr` 命令，使用括号更方便。\n\n```bash\n#!/bin/bash\nvar1=2\nvar2=6\nvar3=3\nvar4=$((var1\
  \ * var2))\necho $var4\n```\n\n![](img/rsrc3EZ.jpg)Bash 计算器当你想要执行复杂的数学函数时，有一个内置工具来执行。它是\
  \ `bc`。\n\n`bc` 命令支持：\n- 整数和浮点数\n- 变量\n- 表达式\n- 函数\n- if-then-else\n- 注释\n\n在最后一行，你可以看到一个问题：8.45/5\
  \ = 1.6 是不准确的，除非向上舍入。这里的问题是小数位数。为了获得预期的输出，我们需要修改 `scale`。(rsrc3FR.jpg) `bc` 命令支持变量。以下示例使用了变量而不是数值。\n\
  \n```bash\n#!/bin/bash\nvar1=10\nvar2=2\nvar3=$(echo \"$var1 ^ $var2\" | bc)\necho\
  \ \"The answer is : $var3\"\n```\n\n![](img/rsrc3G8.jpg)另一个使用 `scale` 选项示例。\n\n\
  ```bash\n#!/bin/bash\nvar1=10\nvar2=3\nvar3=$(echo \" scale=3; $var1 / $var2\" |\
  \ bc)\necho \"The answer is : $var3\"\n```\n\n![](img/rsrc3GH.jpg) 下一个示例将查看内联输入运算符如何在脚本中与\
  \ `bc` 命令结合。\n\n```bash\n#!/bin/bash\nvar1=8\nvar2=1.75\nvar3=3\nvarF=$(bc << EOF\
  \ # EOF 代表文件结束\nscale = 4\nv1 = ($var1 * $var2)\nv2 = ($var1 / $var3)\nv1 + v2\n\
  EOF)\necho The final calculation is: $varF\n```\n\n![](img/rsrc3H2.jpg)\n\n\n\n\n\
  | 代码 | 含义 |\n| :--- | :--- |\n| 0 | 命令成功执行 |\n| 1 | 未知错误 |\n| 2 | 命令误用 |\n| 126\
  \ | 命令无法执行 |\n| 127 | 未找到命令 |\n| 128 | |\n| 128+x | |\n| 130 | |\n| 225 | |\n\n\
  退出状态还有一个很有趣的特性：你可以定义自己的退出码。这通过使用 `exit` 命令后跟一个你指定的数值来实现。\n\n示例：\n```bash\n#!/bin/bash\n\
  ls -la Test\nexit 100\n```\n在结果末尾，当执行 `echo $?` 时，它会显示我们定义的退出码。\n\n另一个示例：\n```bash\n\
  #!/bin/bash\nls -la Test\necho $?\nexit 100\n```\n如果你观察退出码，可以识别出一个范围（0 – 255）。这是因为\
  \ shell 使用了一种名为“取模运算”的方法来计算退出码。它将错误值除以 256，并使用余数作为退出码。\n\n## 结构化命令\n\n到目前为止我们学习了很多命令以及如何构建基础脚本。你也可以使用\
  \ `man` 命令或 `--help` 选项来学习关于命令和其他特性的知识。\n\n对于脚本编写，如果你是一个程序员甚至是一个新手，你必须应用一些条件。否则，当我们为了应用可能需要复杂逻辑的现实场景构建脚本时，我们就无法构建命令结构来获取逻辑输出。为了解决这个问题，脚本可以像其他编程语言一样利用\
  \ `if-then-else` 和 `for` 等结构化命令。这些被称为条件或逻辑结构。在本节中，我们将深入学习结构化命令。让我们先从一个简单的开始。\n\n\
  ### if-then-fi 和 if-then-else-fi\n\n在任何编程语言和逻辑中，`if-then` 逻辑都是最基本的。你可以在脚本中使用同样的方法。以下是它的用法：\n\
  \n```bash\nif [expression];then\n    # 如果 'expression' 为真，则执行代码\nfi\n```\n\n示例：\n\
  ```bash\n#!/bin/bash\nif grep APR --color File3.txt\nthen\n    echo \"APR is found\
  \ in the file\"\nelse\n    echo \"APR is not found\"\nfi\n```\n\n然而，如果无法进行比较，这种方法就是无效的。例如，如果你想比较多个情况（例如\
  \ APR、MAY、JUN 等）并进行一些逻辑操作，你将需要一种技术来实现。这时 `test` 功能就派上用场了。\n\n```bash\nif test conditionthen\n\
  \    commands\nfi\n```\n\n在不使用 `test` 单词的情况下，我们可以直接使用方括号。这样做时，必须注意以下几点：\n- 你必须在最左边的括号处留空格。\n\
  - 你必须在最右边的括号处留空格。\n\n测试条件可以比较数值、字符串和文件。让我们也学习一下运算符以及如何使用它们：\n- `eq` : 等于运算符，用于比较两个值。\n\
  - `le` : 小于或等于运算符。\n- `lt` : 小于运算符。\n- `ge` : 大于或等于运算符。\n- `gt` : 大于运算符。\n- `ne`\
  \ : 不等于运算符。\n\n我们也可以用类似的方法进行字符串比较。运算符如下：\n- `str1 = str2` : 匹配两个字符串是否相等。\n- `str1\
  \ != str2` : 匹配不相等。\n- `str1 > str2` : 大于运算符。\n- `str1 < str2` : 小于运算符。\n- `-z str1`\
  \ : 检查长度是否为 0。\n- `-n str1` : 检查长度是否大于 0。\n\n让我们也来看看文件比较运算符。\n\n### 文件比较运算符\n\n\
  | 运算符 |  |\n| :--- | :--- |\n| `FILE1 -ef FILE2` | `FILE1` 和 `FILE2` 具有相同的设备号和 inode\
  \ 码 |\n| `FILE1 -nt FILE2` | `FILE1` 比 `FILE2` 新（修改日期） |\n| `FILE1 -ot FILE2` |\
  \ `FILE1` 比 `FILE2` 旧 |\n| `-b FILE` | `FILE` 存在且是块设备文件 |\n| `-c FILE` | `FILE`\
  \ 存在且是字符设备文件 |\n| `-d FILE` | `FILE` 存在且是一个目录 |\n| `-e FILE` | `FILE` 存在 |\n| `-f\
  \ FILE` | `FILE` 存在且是普通文件 |\n| `-g FILE` | `FILE` 存在且设置了组 ID (setgid) |\n| `-G FILE`\
  \ | `FILE` 存在且属于有效组 ID |\n| `-h FILE` | `FILE` 存在且是一个符号链接（与 `-L` 相同） |\n| `-k FILE`\
  \ | `FILE` 存在且设置了粘滞位 (sticky bit) |\n| `-L FILE` | `FILE` 存在且是一个符号链接（与 `-h` 相同）\
  \ |\n| `-O FILE` | `FILE` 存在且所有有效用户 ID |\n| `-p FILE` | `FILE` 存在且是一个命名管道 |\n| `-r\
  \ FILE` | `FILE` 存在且已授予读权限 |\n| `-s FILE` | `FILE` 存在且大小大于零 |\n| `-S FILE` | `FILE`\
  \ 存在且是一个套接字 |\n| `-t FD` | 文件描述符 `FD` 在终端上打开 |\n| `-u FILE` | `FILE` 存在且设置了用户 ID\
  \ (setuid) |\n| `-w FILE` | `FILE` 存在且已授予写权限 |\n| `-x FILE` | `FILE` 存在且已授予执行（或搜索）权限\
  \ |\n\n\n\n\n\n让我们来看一些例子。\n\n### 基础比较\n```bash\n#!/bin/bash\nT1=\"Jan\"\nT2=\"Jake\"\
  \nif [ \"$T1\" = \"$T2\" ]; then\necho true\nelse\necho false\nfi\n```\n![](img/rsrc3U8.jpg)\n\
  \n在这个例子中，我们匹配两个字符串。使用 `if` 匹配命令以获取匹配结果是真还是假。这种逻辑被称为布尔逻辑（Boolean logic）。\n\n如果我们在\
  \ `if` 语句之前和之后放置命令会发生什么呢？这些命令不会被视为 `if` 语句的一部分！它们将会在语句之外相应地执行或失败。\n\n在这条命令中，我们使用\
  \ `else` 来匹配错误条件。也就是说如果匹配结果为失败。如果你移除 `else` 和 `echo false`，结果会是什么？\n\n示例：\n```bash\n\
  T1=\"Jan\"\nT2=\"Jake\"\nif [ \"$T1\" = \"$T2\" ]; then\necho true\nfi\n```\n![](img/rsrc3UM.jpg)\n\
  \n如你所注意到的，没有输出。因为两个名字不匹配，它直接跳出了 `if` 语句。在这个例子中，我们使用了逻辑运算符 `=`。我们也可以使用 `!=` 来评估不匹配（或者使用\
  \ `-ne`）。`!` 应用非（NOT）逻辑。与 `EQUAL` 运算符结合时，逻辑为不等于（NOT EQUAL）。如果 `T1` 不等于 `T2`，则返回真。\n\
  \n```bash\nif [ \"$T1\" != \"$T2\" ]; then\n```\n![](img/rsrc3UU.jpg)\n\n你可以在 `if\
  \ [expression]; then` 和 `fi` 之间指定更多操作。让我们在这个例子中匹配一个退出码并在中间添加更多命令。\n\n```bash\n#!/bin/bash\n\
  varx=$(ls -l Test 2>/dev/null)\n$?\necho $varx\nif [ $varx -eq 0 ]; then\necho A\
  \ match found\necho varx?\nelse\necho \"The file/directory does not exist\"\nfi\n\
  ```\n\n在这个例子中，我们正在获取 `ls` 命令的退出码。如果目录存在，退出码将是 `0`。如果目录不存在，它将是其他值（`1`）。我们通过将其发送到\
  \ `/dev/null` 来抑制错误信息。在表达式末尾，我们请求退出码。\n\n然后我们使用 `echo` 命令输出退出码。最后，我们比较退出码。如果是 `0`，则匹配成功，我们再次回显\
  \ `varx`。如果退出码不匹配，则 `else` 为真，并将显示另一个消息（该文件/目录不存在）。为什么我们在这里需要 `else`？为了匹配虚假逻辑。在较长的形式中，我们将使用\
  \ `elif` (else if) 来匹配各种情况。\n\n![](img/rsrc3VB.jpg)\n\n如你所见，目录存在且返回码为 `0`。让我们删除目录并再次尝试。![](img/rsrc3VF.jpg)\n\
  现在目录消失了，输出符合预期。\n\n### 使用嵌套 If\n在脚本中，你可能需要匹配比布尔逻辑更多的内容。相反，你可能需要匹配每一个情况。例如，如果你运行\
  \ `ls` 命令，可能会更多的退出码需要匹配，并且根据每个代码，我们可以采取行动。这种方法被称为嵌套（nesting）。让我们来看一个例子。\n\n```bash\n\
  #!/bin/bash\na=10\nb=20\nif [ $a -eq $b ]\nthen\necho “a = b”\nelif [ $a -gt $b\
  \ ]\nthen\necho “a > b”\nelif [ $a -lt $b ]\nthen\necho “a < b”\nelse\necho “None\
  \ of the conditions have met”\nfi\n```\n![](img/rsrc3W5.jpg)\n\n输出是准确且符合预期的。让我们尝试另一个例子。\n\
  \n```bash\n#!/bin/bash\nuser_name=jake\nif grep $user_name /etc/passwd\nthen\necho\
  \ \"The user $user_name found in the system.\"\nelif ls -d /home/$user_name\nthen\n\
  echo \"The user $user_name not found but a profile directory exists\"\nfi\n```\n\
  ![](img/rsrc3WM.jpg)\n\n现在删除用户但不删除他的文件。![](img/rsrc3WS.jpg)\n现在，让我们再次执行脚本。![](img/rsrc3WX.jpg)\n\
  由于我们没有在使用 `userdel` 时使用 `-f` 选项，配置文件夹仍然存在。这是删除用户时查找剩余文件的一种有用方法。我们甚至可以通过添加另一个情况来扩展此代码。让我们来看接的例子。这一次\
  \ jake 的家目录已经被删除。\n\n```bash\n#!/bin/bash\nuser_name=jake\nif grep $user_name /etc/passwd\n\
  then\necho \"The user $user_name found in the system.\"\nelif ls -d /home/$user_name\n\
  then\necho \"The user $user_name not found but a profile directory exists\"\nelse\n\
  echo “The user $user_name does not exist!”\nfi\n```\n![](img/rsrc3XD.jpg)\n\n现在，让我们来看一些文件比较的例子。\n\
  \n```bash\n#!/bin/bash\nmydir=$home/jan\nif [ -d mydir ]\nthen\necho “The directory\
  \ $mydir exists!”\nls -l $mydir\nelse\necho “The directory $mydir does not exist”\n\
  fi\n```\n![](img/rsrc3XV.jpg)\n\n现在比较两个文件的日期，如果另一个文件较旧，则从较新的（临时）文件中追加一些文本。\n\n```bash\n\
  #!/bin/bash\nvarF=/home/jan/Desktop/File1.txt\nls -al > temp.txt\nif [ temp.txt\
  \ -nt File1.txt ]\nthen\ntemp.txt >> File1.txt\necho File updated\nelse\necho The\
  \ file is newer than the temporary file\nfi\n```\n![](img/rsrc3YA.jpg)\n\n在现实场景中，我们还可以使用这种方法了解是否可以读取文件、写入文件、更新日志文件，并在日志中添加日期和其他细节。让我们尝试是否可以验证文件是否存在以及是否可以向其写入。\n\
  \n```bash\nfile_name=/home/jan/Desktop/myfile\nif [ -f $file_name ] #如果是一个文件且存在\n\
  then\nif [ -s $file_name ] #如果文件大小大于零\nthen\nif [ -w $file_name ]\nthen\necho \"\
  This file is writable\"\ndate >> $file_name\nelse\necho \"This file is not writable!\"\
  \nfi\nelse\necho \"This file is empty\"\nfi\n```\n![](img/rsrc3YZ.jpg)\n\n我们正在测试每个分支，这里是文件存在、文件不可写以及最后当它被删除或不存在时的输出。\n\
  \n### 使用布尔运算符组合测试用例\n当你编写脚本时，你可能需要为了决策比较多一个测试用例（复杂情况）。有两个运算符 `&&` 和 `||` 分别代表与（AND）和或（OR）逻辑。例如，我们可以匹配文件是否存在以及大小是否为零。\n\
  \n### 使用更多功能\n还有其他一些高级功能，例如双圆括号和双方括号，用于数学运算和高级字符串操作。我们使用双括号是为了使用内部操作，而不是让单括号产生子壳。在继续之前，有几个符号是你理解的。表\
  \ 8.3：逻辑运算符\n\n| 符号 | 描述 |\n| :--- | :--- |\n| ! | 逻辑取反 |\n| ~ | 位取反 |\n| & | 位与\
  \ |\n| && | 逻辑与 |\n| \\| | 位或 |\n| \\| | 逻辑或 |\n| ** | 幂/指数 |\n| --val | 前减 1 |\n\
  | val-- | 后减 1 |\n| ++val | 前增 1 |\n| val++ | 后增 1 |\n| << | 位移（左） |\n| >> | 位移（右）\
  \ |\n\n\n\n\n\n# case 命令\n\n当存在长长的 `if-then-else` 语句时，`case` 命令非常有用。通过 `case` 命令，可以将阶段表示为不同的\
  \ case。\n\n语法：\n```bash\ncase $variable-name in\npattern1)\n    command1...commandN;;\n\
  patternN)\n    command1...commandN;;\n*)\n    esac\n```\n你也可以使用 `pattern1|pattern2|pattern3)`\
  \ 来匹配多个模式，而不是单个模式。`case` 命令可用于高度高级的决策结构。\n\n### 高级示例：\n```bash\n#!/bin/bash\nif\
  \ [ -z $1 ] #如果运行脚本时没有参数\nthen\n  rental=\"Unknown vehicle\"\nelif [ -n $1 ]\nthen\n\
  \  # 如果提供了参数，则将其作为租赁\n  rental=$1\nfi\n# 使用 case 语句进行租赁决策\ncase $rental in\n\"car\"\
  ) echo \"For $rental rental is $25 per k/m.\";;\n\"van\") echo \"For $rental rental\
  \ is$20 per k/m.\";;\n\"jeep\") echo \"For $rental rental is $18 per k/m.\";;\n\"\
  bicycle\") echo \"For $rental rental $1 per k/m.\";;\n*) echo \"Sorry, no $rental\
  \ rental is available for you!\";;\nesac\n```\n执行此脚本与之前的脚本有所不同。要执行它，你必须在执行命令中提供一个参数![](img/rsrc43B.jpg)\n\
  \n### 另一个示例：\n```bash\n#!/bin/bash\ncase $USER in\nroot) echo \"Welcome Superuser\"\
  ;;\njan | jake) echo \"Welcome administrator!\";;\ntestuser) echo \"Welcome test!\
  \ Please use the dev board for reporting\";;\n*) echo \"Access is denied!\";;\n\
  esac\n```\n![](img/rsrc43W.jpg)\n\n# for 命令\n\n在脚本编写中，你经常会遇到命令迭代或循环的需求。例如，当你从一个文件或一组文件中读取内容时，这变得非常有用。\n\
  \n语法：\n```bash\nfor var in list\ndo\n    commands\ndone\n```\n在这里，`var` 变量持有当前列表项的值。在一次完整迭代结束后，它持有最后一次迭代的值。\n\
  \n### 基础示例：\n```bash\n#!/bin/bash\nfor i in {1..5}\ndo\n  echo \"Welcome $i times\"\
  \ndone\n```\n![](img/rsrc44H.jpg)\n`for` 命令可以用于以下方法。这主要用于编程中。\n\n### C 风格命令\n\n\
  以下语法被称为 C 风格。在 C 编程语言中，这种表达式风格用于循环等。\n\n语法：\n```bash\nfor (( EXP1; EXP2; EXP3 ))\n\
  do\n    command1\n    command2\n    command3\ndone\n```\n\n### 示例：\n```bash\n#!/bin/bash\n\
  for (( a=0; a<=5; a++ ))\ndo\n  echo \"Welcome $a times\"\ndone\n```\n![](img/rsrc456.jpg)\n\
  我们甚至可以利用多个表达式。例如，我们可以使用：\n`for (( a=0, b=9; a<=5; a++,b--))`\n\n### 带有 IF 命令的 for\n\
  \n可以将 `for` 与 `if` 结合，以便在满足条件时退出循环。它还有其他用途。例如，当你想要查找一个文件时，可以使用 `for` 循环搜索文件名。通过使用\
  \ `if`，你可以在找到文件时结束循环。\n\n### 高级示例：\n```bash\n#!/bin/bash\nfor file in /etc/*\ndo\n\
  \  if [ \"${file}\" == \"/etc/resolv.conf\" ]\n  then\n    countNameservers=$(grep\
  \ -c nameserver /etc/resolv.conf)\n    line=$(grep -n nameserver /etc/resolv.conf)\n\
  \    lineNumber=${line%:*}\n    echo \"Total ${countNameservers} nameservers defined\
  \ in ${file}\"\n    head -n $lineNumber /etc/resolv.conf | tail -1\n    #echo $varRes\n\
  \    break\n  fi\ndone\n```\n这是一个复杂的示例。它搜索名称解析表（文件）。找到它后，它计算 nameserver 的数量并输出计数。它通过将行号赋给行变量，然后从字符串中获取行号来显示\
  \ nameserver 列表（该字符串在冒号之前是行号）。然后我们使用 `head` 和 `tail` 命令显示条目。\n![](img/rsrc45Z.jpg)\n\
  \n当你使用 `for` 循环时，记住不要使用某些表达式，例如带有 `` ` 符号的字符串。这会搞乱输出。也不要在字符串中使用包含多个单词的值，因为 `for`\
  \ 命令会假设每个列表项是用空格分隔的。如果你将 `New Name` 作为一个单个列表项，它会将其视为两个项。你需要根据情况使用 `\"\"`。\n\n正如你之前做的那样，你可以从变量中读取列表。例如：\n\
  ```bash\n#!/bin/bash\nlist=\"Car Bus Bike Helicopter\"\nfor vehicle in $list\ndo\n\
  \  echo \"Have you ever traveled back home by $vehicle?\"\ndone\n```\n![](img/rsrc46D.jpg)\n\
  它也可以用于从命令中读取值。\n\n### 示例：在此示例中，我们使用一个包含车辆列表的文件。\n```bash\n#!/bin/bash\nlist=\"vehicles\"\
  \nfor vehicle in $(cat $list)\ndo\n  echo \"Travel home by $vehicle\"\ndone\n```\n\
  ![](img/rsrc46U.jpg)\n如果存在像 Aston Martin 这样的名称会发生什么？再次，`for` 命令会破坏输出。为了解决这个问题，引入了分隔符。\n\
  \n### 字段分隔符\n\n分隔符可以是空格、制表符，甚至是换行符。有一个名为 `Internal Field Separator (IFS)` 的环境变量。这是之前问题的根源。为了解决这个问题，可以定义自己的分隔符。\n\
  \n```bash\n#!/bin/bash\nlist=\"vehicles\"\nIFS=$'\\n' # 定义我们所需的字段分隔符\nfor vehicle\
  \ in $(cat $list)\ndo\n  echo \"Travel by $vehicle\"\ndone\n```\n![](img/rsrc47G.jpg)\n\
  `for` 的另一个有用功能是支持通配符。这通常用于搜索文件。例如，可以使用 `for file in /home/*`。\n\n# while 命令\n\n\
  `while` 命令比 `for` 更灵活，类似于 `if-then-else`。\n\n语法：\n```bash\nwhile test\ndo\n    other\
  \ commands\ndone\n```\n`while` 循环只要退出码为零，就会一直运行。如果不是，它将中断迭代并结束循环。\n\n### 示例：\n```bash\n\
  #!/bin/bash\nnum1=5\nwhile [ $num1 -gt 0 ]\ndo\n  echo $num1\n  num1=$[num1 - 1\
  \ ]\ndone\n```\n![](img/rsrc48A.jpg)\n\n# until 命令\n\n`until` 命令可以被视为 `while` 命令的反相反。\n\
  \n语法：\n```bash\nuntil test\ndo\n    other commands\ndone\n```\n\n### 示例：\n```bash\n\
  #!/bin/bash\nvar1=10\nuntil [ $var1 -eq 0 ]\ndo\n  echo $var1\n  var1=$[var1 - 2\
  \ ]\ndone\n```\n![](img/rsrc48Y.jpg)\n\n# break 和 continue 命令\n\n控制循环是脚本编写的基本要求。`break`\
  \ 命令直接跳出循环。它可以与 `if-then-else`、`while` 和 `until` 命令配合使用。另一方面，`continue` 命令跳过当前迭代并进入下一次。但它不会完全中断循环。\n\
  \n```bash\n#!/bin/bash\nfor i in 1 2 3 4 5 6 7 8 9\ndo\n  if [ $i -eq 5 ]\n  then\n\
  \    echo “skipping 5th iteration…”\n    continue\n  fi\n  echo “I is equal to $i”\n\
  done\n```\n![](img/rsrc49.jpg)\n这结束了关于结构化命令和条件的课程。在最后，我们将查看一个现实场景，以便你实践所学的知识。\n\n\
  ### 示例：创建一组用户\n\n如果你一直担任管理员工作，你可能已经使用过批量更新创建用户的方法。在这种情况下，我们通常使用文本文件或逗号分隔的文件（如果是\
  \ Windows 用户则使用电子表格）。在本示例中，我们将使用此类文件并创建多个用户。创建用户时，你必须访问文件，检查用户是否存在，并迭代到文件末尾。文件中将以下字段：`username,fn`。在这里，`fn`\
  \ 代表全名。正如你注意到的，逗号分隔的文件与默认字段分隔符不匹配。在这种情况下，我们需要使用自己的分隔符 `IFS=','`。\n\n```bash\n#!/bin/bash\n\
  inp=\"/home/jan/Desktop/users\"\nwhile IFS=',' read -r uid fn\ndo\n  echo \"adding\
  \ $uid\"\n  useradd -c \"$fn\" -m $uid\ndone < $inp\n```\n![](img/rsrc4A6.jpg) 第\
  \ 9 章：函数简介\n\n在本章中，你将学习：\n- 什么是函数\n- 参数和选项\n- `getopt(s)`\n- 写函数\n- 处理函数（退出状态、参数、变量和数组）\n\
  \n### GAWK 基础\n\n在进入函数之前，本节将讨论一些重要主题，从处理用户输入开始。处理用户输入在实际场景中是关重要的。当需要处理来自用户的数据和输入时，交互式脚本非常有用。Linux\
  \ 提供了几个命令行参数、选项以及处理直接输入（例如从键盘）。\n\n你已经意识到在执行 shell 脚本时启动值是如何传递的。例如，我们带有 `car` 值执行了\
  \ `./Myscript`。它为该输入提供了特定信息。这实际上是一个交互式脚本，它能够处理用户输入。\n\n读取提供的参数由 `bash` 处理。有一个特殊变量称为位置参数。这些参数处理脚本名和另外\
  \ 8 个参数，因此可以使用自定义输入值。脚本名由 `$0` 持有。`$1 - $9` 保存剩余部分。让我们来看带有 2 个参数的简单数学方程。\n\n```bash\n\
  #!/bin/bash\nmultiplication=$[ $1 * $2 ]\necho The multiplication of $1 and $2 is\
  \ $multiplication\n```\n![](img/rsrc4B1.jpg)\n它获取 `$1` 和 `$2` 并执行一个简单的数学运算。\n\n\
  ### 另一个示例：\n```bash\n#!/bin/bash\nvar1=$USER\necho Welcome $var1\necho Wishing you\
  \ a happy $1\n```\n在本示例中，它获取 `$1` 并向用户显示问候。![](img/rsrc4BD.jpg)\n如果你在执行脚本时想在引号内输入多个单词，必须使用双引号。否则，它们会被视为两个项。在下一个示例中，我们将读取脚本名并根据此做决策。有一个特殊变量是\
  \ `$0`。它可能包含路径以及其他值。`basename` 命令在这些操作中非常方便。\n\n```bash\n#!/bin/bash\nvar1=$0\n\
  var2=$(basename $0)\nif [[ $var2 == \"Myscript\" ]]\nthen\n  echo This is Jan’s\
  \ script $var1\nelse\n  echo This not Jan’s script $var2\nfi\n```\n![](img/rsrc4BZ.jpg)\n\
  现在你知道如何将脚本名作为变量。你可以根据它做决策。例如，如果脚本名为 `who`，它可以运行 `who` 命令。当你带有参数运行脚本时，必须确保没有传递不准确或意外的值导致崩溃。因此，测试输入并通过\
  \ `if-then-else` 阶梯是最佳实践。\n\n# 参数计数\n\n有一个特殊变量 `$#` 用于计数参数数量。这在执行脚本时非常有用。让我们来看：\n\
  \n```bash\n#!/bin/bash\nvar1=$#\necho Number of arguments $var1\n```\n![](img/rsrc4CC.jpg)\n\
  \n### 另一个示例：仅当参数数量为 1 时计算阶乘。\n```bash\n#!/bin/bash\nvar1=$#\nnum=$1\nif [ $var1\
  \ -eq 1 ]\nthen\n  fact=1\n  while [ $num -gt 1 ]\n  do\n    fact=$((fact * num))\n\
  \    num=$((num - 1))\n  done\n  echo $fact\nelse\n  echo \"Script usage: ./Myscript\
  \ 5\"\nfi\n```\n![](img/rsrc4D0.jpg)\n还有两个提供了获取最后一个参数和脚本名的方法。这些是 `$!` 和 `${#}`。让我们运行以下脚本并获取输出。\n\
  \n```bash\n#!/bin/bash\necho $#\necho ${!}\n```\n![](img/rsrc4DF.jpg)\n\n# 移位操作\n\
  \n`shift` 命令是另一个有用命令。它将当前的位置参数左移 `n` 次。默认 `n = 1`。\n\n语法：\n```bash\nshift [n]\n\
  ```\n在下一个示例中，尝试移位提供的值：\n```bash\nshift 0\necho Param 0: $0\necho Param 1: $1\necho\
  \ Param 2: $2\necho Param 3: $3\necho Param 4: $4\n```\n![](img/rsrc4EP.jpg)\n现在开始移位它们：\n\
  ```bash\nshift 1\necho Param 0: $0\necho Param 1: $1\necho Param 2: $2\necho Param\
  \ 3: $3\necho Param 4: $4\n```\n![](img/rsrc4F2.jpg)\n尽管 `$0` 没有变化，但其他值已经移位。这次我们使用\
  \ `for` 循环。\n\n```bash\nfor (( i = 0; i <= 4; i++ ));\ndo\n  echo Shifting $i:\n\
  \  echo 1: $1\n  echo 2: $2\n  echo 3: $3\n  echo 4: $4\n  shift\ndone\n```\n![](img/rsrc4FG.jpg)\n\
  在输出中，你可以看到提供的值在 5 次迭代期间是如何移位的。如果我们提供 4 个值，整个值将移位而没有任何剩余。我们可以使用这种移位来执行遍历文件夹等操作。实际示例是删除特定目录或\
  \ 3365 天的目录的文件。\n\n# 使用选项移动\n\n在上一节中，我们学习了执行时传递参数或参数。我们也可以传递选项。这些选项可以根据提供的选项做出决策。让我们来看一个示例：\n\
  ```bash\nwhile [ -n \"$1\" ]\ndo\n  case \"$1\" in\n    -x) echo \"Found a valid\
  \ option -x\" ;;\n    -y) echo \"Found a valid option -y\" ;;\n    -z) echo \"Found\
  \ a valid option -z\" ;;\n    *) echo \"$1 is not a valid option\" ;;\n  esac\n\
  \  shift\ndone\n```\n![](img/rsrc4G4.jpg)\n如果我们结合查找参数和选项的示例，我们可以成功获取：\n```bash\n\
  while [ -n \"$1\" ]\ndo\n  case \"$1\" in\n    -x) echo \"Found a valid option -x\"\
  \ ;;\n    -y) echo \"Found a valid option -y\" ;;\n    -z) echo \"Found a valid\
  \ option -z\" ;;\n    *) echo \"$1 is not a valid option\" ;;\n  esac\n  shift\n\
  \  count=1\n  for params in \"$@\"\n  do\n    echo \"Variable $@ Parameter #$count\
  \ = $params\"\n    count=$[count + 1 ]\n  done\ndone\n```\n(注：由于输入用户提供的原始文本中存在大量重复和乱码的占位符，我已根据逻辑提取并翻译了核心有效的技术部分。)\n\
  \n\n\n\n\n1. 正常操作示例。\n2. 失败，因为缺少栈大小的值。\n3. 提供了完整的选项和参数值。\n4. 额外的参数值被拒绝。\n5. 了 `d`\
  \ 作为大小（它应该检查数字）以及一个无效的 ‘-5’。\n6. 另一个包含 3 个选项和一个参数值的正常操作。\n\n如你所见，`getopt` 存在一些问题。最常见的问题是多个参数值，以及当用空格分隔时无法将两个或多个值识别为一个整体。即使我们使用\
  \ `\"\"`，`getopt` 也无法检测出差异。\n\n### getopts 救场\n\n`getopts` 有两个重要的隐式变量（环境变量）。它们是：\n\
  - `$OPTIND`\n- `$OPTARG`\n\n`$OPTIND` (OPTion INDex) 是指向标志（例如 `-a`）的参数指针。`$OPTARG`\
  \ (OPTional ARGuments) 是附加到标志上的可选参数（例如 `-a test`）。\n\n还有其他一些规则：\n- 如果字母后面跟着 `;`，则认为该选项带有参数值。\n\
  - 如果命令以 `:` 开头。\n- 如果提供的选项没有带 `-` 或 `+`，则将停止处理。\n- 当配合此使用 `while` 命令时，不需要括号。\n\n\
  示例：在这个示例中，我们将使用 `getopts` 从算法选择中获取文件的校验和。这是与单独运行命令的输出对比。\n\n```bash\n#!/bin/bash\n\
  USAGE=\"Usage= `basename $0` options [-m filename] [-s filename] -h for help. Example:\
  \ ./Myscript -m File1.txt\"\nFILENAME_M='' #此参数通过 -m 提供\nFILENAME_S='' #此参数通过 -s\
  \ 提供\nSEL='' # 记录来自 m, s 或 h 的选择\nwhile getopts \"m:s:h\" opt; do #在 m 或 s 后面必须有一个值\n\
  \  case \"$opt\" in\n    m)\n      FILENAME_M=\"$OPTARG\" # 赋值可选值\n      echo \"\
  MD5 Selected\"\n      SEL=$opt # #SEL=m\n      ;;\n    s)\n      FILENAME_S=\"$OPTARG\"\
  \ # 赋值可选值\n      echo \"SHA1 Selected\"\n      SEL=$opt # #SEL=s\n      ;;\n   \
  \ h)\n      echo $USAGE && exit 0\n      ;;\n  esac\ndone\nshift $(( OPTIND - 1\
  \ ))\nif [[ $SEL == m ]] && [[ $FILENAME_M == '' ]]; then\n  # 如果未提供文件名\n  echo\
  \ \"YOU MUST PROVIDE A FILE NAME!X $USAGE\" >&2\n  exit 1\nelif [[ $SEL == m ]]\
  \ && [[ $FILENAME_M != '' ]]; then\n  # 如果 m 带有文件名\n  echo -----------------------------\n\
  \  md5sum < $FILENAME_M\n  echo -----------------------------\nelif [[ $SEL == s\
  \ ]] && [[ $FILENAME_S == '' ]]; then\n  # 如果 s 没有文件名\n  echo \"YOU MUST PROVIDE\
  \ A FILE NAME!Y $USAGE\" >&2\n  exit 1\nelif [[ $SEL == s ]] && [[ $FILENAME_S !=\
  \ '' ]]; then\n  # 如果 s 带有文件名\n  echo -----------------------------\n  sha1sum <\
  \ $FILENAME_S\n  echo -----------------------------\nelse\n  echo \"Unable to proceed:\
  \ $USAGE\"\nfi\n```\n\n### 读取用户输入\n\n脚本或任何程序最重要的交互功能是获取用户输入并对其处理以创建有效且准确的输出。在 Linux\
  \ 世界中，我们使用 `read` 命令读取用户输入。该命令提供了一系列全面的选项，并用于高级操作。\n\n语法：`read [-ers] [-a array]\
  \ [-d delim] [-i text] [-n nchars] [-N nchars][-p prompt] [-t timeout] [-u fd] [name\
  \ ...] [name2 ...]`\n\n表 9.1: read 命令选项\n\n| 选项 | 说明 |\n| :--- | :--- |\n| `-a array`\
  \ | 将读取的单词赋予数组变量 `ARRAY` 的顺序索引，从零开始 |\n| `-d delim` | 继续直到读取到 `DELIM` 的第一个字符，而不是换行符\
  \ |\n| `-e` | 使用 Readline 在交互式 shell 中获取行 |\n| `-i text` | 使用 `TEXT` 作为 Readline\
  \ 的初始文本 |\n| `-n nchars` | 在读取 `NCHARS` 个字符后返回，而不是等待换行符，但在遇到分隔符之前读取的字符少于 `NCHARS`\
  \ 个时则遵循分隔符 |\n| `-N nchars` | 仅在恰好读取 `NCHARS` 个字符后返回，除非遇到 EOF 或读取超时，并忽略任何分隔符 |\n\
  | `-p prompt` | 在尝试读取之前输出字符串 `PROMPT` 且不带尾换行 |\n| `-r` | 不允许反斜杠转义任何字符 |\n| `-s`\
  \ | 不回显来自终端的输入 |\n| `-t timeout` | 如果在 `t TIMEOUT` 秒内没有读取到完整行，则超时并返回失败。`TMOUT` 变量的值是默认超时时间。`TIMEOUT`\
  \ 可以小数。如果 `TIMEOUT` 为 0，则仅当指定的文件描述符上有可用输入时 `read` 才返回成功。如果超时，退出状态将大于 128 |\n| `-u\
  \ fd` | 从文件描述符 `FD` 而不是标准输入读取 |\n\n\n\n\n现在，让我们尝试一些示例并学习如何使用该命令。\n\n```bash\n#!/bin/bash\n\
  echo -n \"Enter your name: \"\nread name\necho \"Hi $name, welcome to Ubuntu GNOME\
  \ desktop. \"\n```\n![](img/rsrc4RB.jpg)\n很酷的！不是吧？下一个示例使用了 `-p` 选项。\n\n```bash\n\
  #!/bin/bash\nread -p \"Enter your name: \" name\necho \"Hi $name, welcome to Ubuntu\
  \ GNOME desktop. \"\n```\n![](img/rsrc4RJ.jpg)\n在这个示例中，我们使用了一个变量。然而，即使你不指定变量，`read`\
  \ 命令也有它自己的环境变量变量 `REPLY` 来存储此类数据。\n\n示例：\n```bash\n#!/bin/bash\nread -p \"Enter\
  \ your name: \"\necho \"Hi $REPLY, welcome to Ubuntu GNOME desktop. \"\n```\n![](img/rsrc4RU.jpg)\n\
  另一个实用的选项是 `-t` 选项。我们可以用它来设置用户输入提示超时。\n\n```bash\n#!/bin/bash\nif read -t 30 -p \"\
  Enter your name: \"\nthen\n    echo \"Hi $REPLY, welcome to Ubuntu GNOME desktop.\
  \ \"\nelse\n    echo \"Your session timed out! :(\"\nfi\n```\n![](img/rsrc4S5.jpg)\n\
  如果你无法在 30 秒内做出响应，`read` 将自动终止。这就像会话超时，不是吗？使用 `read` 也可以读取密码，酷酷的地方是，它可以停止显示我们输入的字符。\n\
  \n```bash\n#!/bin/bash\nread -p \"Enter your name: \"\necho \"Hi $REPLY, welcome\
  \ to Ubuntu GNOME desktop. \"\nread -s -p \"Enter your password: \" pass\necho “Your\
  \ password is $pass”\n```\n![](img/rsrc4SF.jpg)\n也可以读取单个字符（例如，Y/N），这在请求用户确认时非常有用。对于这种情况，你可以将其与\
  \ `case` 命令结合使用。最后，我们将从文件中读取并添加一些行号，使 `read` 变得方便。\n\n```bash\n#!/bin/bash\nfName=''\
  \ # 用于存储用户输入的文件名\ncount=1 # 否则，计数从 0 开始\nread -p \"File name: \" fName=$REPLY\n\
  echo $fName\ncat $fName | while read line\ndo\n    echo \"$count: $line\"\n    count=$[\
  \ $count + 1]\ndone\necho \"EOF\"\n```\n![](img/rsrc4T1.jpg)\n\n# 函数\n当你使用从小到大的脚本处理任务时，如果代码部分可以在同一个脚本或其他地方重用，不断重写代码将是一项乏的任务。相反，如果这些部分可以使用必要的值重用或调用，那就太好了。这在通用编程平台上很常见。嗯，`bash`\
  \ 在这里并不逊！它提供了相同的功能，并被称为函数。函数是在脚本中重用的代码块。在本节中，你将学习如何在代码中使用函数。\n\n## 基本组件\n函数可以用以下方式定义。并不复杂。\n\
  \n```bash\nfunction function_name {\n    commands\n}\n```\n让我们在一个示例中测试函数的函数。\n\n\
  ```bash\n#!/bin/bash\nfunction love {\n    echo \"Do you love Linux?\"\n}\nfor((\
  \ x=1; x<=5; x++ ))\ndo\n    love\ndone\n```\n![](img/rsrc4TP.jpg)\n函数在循环内部被调用，它起作用了！如果我们创建一个函数并在第一个函数代码下方更改相同函数的定义（两个函数具有相同的名称），会发生什么？那么名称将是相同的，但它将使用第二个定义！\n\
  \n## 退出状态和返回值\n函数应该有一个退出状态。然而，由于它可以包含许多命令以及成功/失败的情况，它将返回最后一次成功或失败的状态。尽管我们可以通过 `$?`\
  \ 查询它，但这可能会变得麻烦。这就是函数的返回值变得有用的地方。让我们来看一个示例。\n\n```bash\n#!/bin/bash\nfunction calculate\
  \ {\n    num1=0\n    num2=0\n    cal=0\n    read -p \"Input your first value: \"\
  \ num1\n    read -p \"Input your second value value: \" num2\n    cal=$[ $num1 +\
  \ $num2 ]\n    echo $cal\n    return 0\n}\ncalculate\necho \"$?\"\necho \"The end!\"\
  \n```\n![](img/rsrc4UD.jpg)\n然而，这种技术有两个局限性。它们是：\n- 你绝不能在捕获退出状态之前执行任何命令。\n- 你必须使用小于\
  \ 256 的返回值，这是返回值的局限性。\n\n为了解决这个问题，我们可以按照以下步骤直接获取返回值。\n\n```bash\n#!/bin/bash\nvar1=100\n\
  var2=200\nvar3=0\nvar_F=0\nfunction math {\n    var3=$[ $var1 + $var2 ]\n    echo\
  \ $var3\n}\necho \"The return value is being calculated…\"\nvar_F=$(math)\necho\
  \ “The result is $var_F”\n```\n![](img/rsrc4V0.jpg)\n\n## 传递参数\n就像我们在脚本中所做的那样，我们可以变量传递给函数。函数可以使用\
  \ `$1` 到 `$9` 变量来捕获值。\n\n```bash\nfunction calculate{\n    if [ $# -eq 0 ] || [\
  \ $# -gt 2 ]\n    then\n        echo \"Need two values!\"\n    elif [ $# -eq 1 ]\n\
  \    then\n        echo \"Need one more value\"\n    else\n        echo $[1 + $2\
  \ ]\n    fi\n}\nval=$(calculate 250 500)\necho $val\necho \"The end!\"\n```\n![](img/rsrc4VN.jpg)\n\
  在这个示例中，我们传递了两个简单的参数。然后我们获取了每个参数并进行了计算。\n\n## 处理变量\n在下一节中，我们将查看环境变量如何与函数集成。在函数中使用变量是必要的。然而，使用函数时必须注意：不要在函数内部外部使用相同的变量名，因为一个会破坏另一个的数据。\n\
  \n```bash\n#!/bin/bash\nfunction compare{\n    temp=10\n    result=$[ temp+1 ]\n\
  }\ntemp=5\n```\n![](img/bash\nfunction compare{\n    local temp=10\n    result=$[\
  \ temp+1 ]\n}\ntemp=5\necho \"Final result =\" $result\nif [ $temp -eq 10 ]; then\n\
  \    echo \"romised!\"\nelif [ $temp -eq 5 ]; then\n    echo \"Not compromised!\"\
  \nelse\n    echo -1\nfi\n```\n![](rsrc4WZ.jpg\n现在，temp 是 5 且没有冲突。\n\n### 使用数组\n\
  如果你熟悉数组，可能知道它是什么。然而，对于不熟悉数组的读者，本节包含了介绍。数组是我们用来持有多个参数的内存位置。我们可以通过两种方式创建数组：\n- 声明数组。\n\
  - 创建数组。\n\n### 声明数组\n要声明数组，我们可以简单地使用以下语法：\n```bash\ndeclare -a my_array\n```\n\n\
  ### 创建数组\n可以使用以下语法创建数组：\n```bash\nmy_array=(foo baz)\n```\n\n### 处理数组\n为了插入或修改值，我们可以使用：\n\
  `my_array[0]=foo`\n我们插入 `foo` 作为数组的第一个元素。为了检索数据，可以使用以下方法：\n- `echo ${my_array[@]}`：使用\
  \ `@` 符号。\n- `echo ${my_array[*]}`：使用 `*` 符号。\n![](img/rsrc4XN.jpg 希望你记住 `@` 和 `*`\
  \ 之间的区别。让我们通过 `for` 循环来看。\n\n```bash\nmy_array=(foo baz)\nfor x in \"${my_array[@]}\"\
  \ndo\n    echo \"$x\";\ndone\nfor y in \"${my_array[*]}\"\ndo\n    echo \"$y\";\n\
  done\n```\n![](img/rsrc4Y4.jpg\n正如你看到的，`@` 返回每个元素，而另一个返回所有项但作为一个单一字符串。\n\n### 在函数中使用数组\n\
  在函数中使用数组非常有用，因为由于数组的复杂性，代码可以重用。让我们从示例中学习。\n\n```bash\nfunction arr_test{\n    local\
  \ temp_arr\n    temp_arr=(\"$@\") # 从外部向数组赋值\n    echo \"Value of the array in the\
  \ function is: ${temp_arr[*]}\"\n}\nmy_array=(a b c d e)\necho \"Array values in\
  \ the original array is: ${my_array[*]}\"\narr_test \"${my_array[*]}\"\n```\n![](img/rsrc4YM.jpg)!\n\
  两个数组具有相同的值。\n\n## 递归函数\n什么是递归？函数可能会为了某些目的调用自己。最好的例子是计算阶乘。在计算时，函数递归地调用自己来运行计算。让我们来看这个示例。\n\
  \n```bash\nfunction factorial {\n    if [ $1 -eq 1 ]\n        # 如果输入是 1，那么结果是 1\n\
  \        echo 1\n    else\n        # 如果输入不是 1\n        local tmp=$[ $1 - 1 ]\n \
  \       local result=$(factorial $tmp) # 函数再次调用自己\n        echo $[ $result * $1\
  \ ]\n    fi\n}\n```\n等待，原文有 `result=$(factorial $REPLY)` 类似的。\n\n## 将函数作为库\n我们已经学习了如何高效地使用函数。然而，你仍然无法在原始脚本之外使用函数，因为它限于当前会话。这是事实吗？不！你可以在脚本中使用函数来满足另一个脚本的目的。方法如下：\n\
  你只需要将脚本保存在尝试使用它的脚本相同的位置。否则，你需要提供完整的（绝对）路径。还有一种调用外部脚本的正确方法。让我们在以下代码中学习。\n\n```bash\n\
  function add {\n    echo $[ $1 + $2 ]\n}\n```\n\n\n\n\n| Variable |\n| :--- |\n\
  | `FIELDWIDTH` |\n|  |\n| `FS` |\n| `OFS` |\n| `ORS` |\n| `RS` |\n\n让我们来看使用这些变量的示例。\n\
  \n- `awk 'BEGIN{FS=\":\"} {print $1 \"\\t\" $5}' /etc/passwd` ![](img/rsrc54H.jpg)\n\
  - `awk 'BEGIN{FIELDWIDTHS=\"1 2 3 1\"}{print $1,$2,$3,$4}' myfie` 这将字段宽度设置为 1 2\
  \ 3 1\n- `awk 'BEGIN{FS=\"\\n\"; RS=\"\"} {print $1,$4}' myfile` 这使用了字段分隔符“`newline`”（换行符）。它会打印数据块（如人的地址块）的第\
  \ 1 行和第 4 行。\n\n### 用户定义变量\n在使用 `gawk` 编写脚本时，我们可以使用自己的变量。以下是一个关于如何方便使用它们的简单示例。\n\
  ```bash\nawk 'BEGIN{show=\"This is a test\";print show}'\n```\n![](img/rsrc54Y.jpg)\n\
  \n### 使用数组\nGAWK 还允许通过简单的方法处理数组。\n语法：`var[index] = element`\n示例：\n```bash\nawk 'BEGIN{var[1]\
  \ = 10;var[2] = 50;sum = var[1] + var[2];print sum> }'\n```\n这也可以用于任何字符串值。![](img/rsrc55C.jpg)\n\
  还可以使用 `for` 函数以更简单的形式对数组进行迭代。\n语法：`for (var in array){statements}`\n示例：\n```bash\n\
  awk 'BEGIN{test[\"a\"] = 1;test[\"b\"] = 2;test[\"c\"] = 3;for (var in test){print\
  \ var,\" : Value:\",test[var]}}'\n```\n![](img/rsrc55Z.jpg)\n若要删除数组变量，可以使用 `delete`\
  \ 命令。\n语法：`delete array[index]`\n\n### GAWK 结构化命令\n类似于 bash 脚本，`gawk` 为结构化命令提供了类似的支持，例如\
  \ `if`、`while`、`do-while` 和 `for` 命令。以下是每个命令的语法和示例。\n\n#### IF 语句\n语法：`if {(condition)}statement1`\n\
  示例：\n```bash\nawk '{if ($1 > 50){​ print $1}}' File3.txt\n```\n![](img/rsrc56M.jpg)\n\
  在此示例中，程序输出 `File3.txt` 中大于 50 的数字。\n\n#### While 循环\n该语句具有以下语法。\n语法：`while (condition){statements}`\n\
  只要条件为真，它就会评估循环并执行所需的任务。\n示例：\n```bash\nawk '{sum = 0;i = 1;while (i < 10){​ sum\
  \ += $i; i++}print sum}' File3.txt\n```\n![](img/rsrc57B.jpg)\n\n#### Do While Loop\n\
  这与 `while` 语句相似。但是，语句会在 `while` 条件满足之前先求值。\n语法：`do{statements} while (condition)`\n\
  \n#### For Loop\n`gawk` 中的 `for` 语句类似于 C 风格的 `for` 循环。\n语法：`for( variable; condition;\
  \ iteration)`\n示例：\n```bash\nawk '{sum = 0;for (i=0; i < 10; i++){​ sum += $i}print\
  \ sum}' File3.txt\n```\n![](img/rsrc582.jpg)\n\n### GAWK 函数\n`gawk` 最重要的特性之一是对函数的支持。它既有内置函数，也有用户定义的函数。\n\
  \n#### 内置函数\n`Gawk` 提供了一系列丰富的内置函数，包括：\n- 数学函数。\n- 字符串函数。\n如果你热爱数学，`gawk` 丰富的数学函数将为你带来乐趣。\n\
  \n#### 数学函数\n下表包含了内置数学函数。使用这些函数非常简单。\n表格：GAWK 数学函数\n来源：[`www.gnu.org/software/gawk/manual/html_node/Numeric-Functions.html`](https://www.gnu.org/software/gawk/manual/html_node/Numeric-Functions.html)\n\
  \n| Function | Description |\n| :--- | :--- |\n| `atan2(y, x)` | 返回 `y / x` 的弧反正切值。你可以使用“`pi\
  \ = atan2(0, -1)`”来获取 pi 的值。 |\n| `cos(x)` | 返回 `x` 的余弦，`x` 为弧度。 |\n| `exp(x)` |\
  \ 返回 `x` 的指数。 |\n| `int(x)` | 返回靠近 `x` 的整数，向零截断。浮点表示。 |\n| `log(x)` | 返回 `x` 的自然对数。\
  \ |\n| `rand()` | 返回一个随机数。 |\n| `sin(x)` | 返回 `x` 的正弦，以弧度制。 |\n| `sqrt(x)` | 返回\
  \ `x` 的正平方根。 |\n\n示例：\n```bash\nawk 'BEGIN{x=sqrt(16); print x}'\n```\n![](img/rsrc5AG.jpg)\n\
  \n#### 字符串函数\n有很多实用的字符串函数，下表包含了这些函数及其描述。\n表格：GAWK 字符串函数\n\n| String Function | Description\
  \ |\n| :--- | :--- |\n| `index(big, little)` | 子字符串在索引中的起始位置。 |\n| `length(string)`\
  \ | `string` 的长度。 |\n| `match(string, regex)` | `Regex` 代表扩展正则表达式 |\n| `split(string,\
  \ array, separator)` | 将 `string` 拆分到 `array` |\n| `sprintf(format, ...)` | `printf`\
  \ 格式字符串 |\n| `sub(regex, subst, string)` | 替换 `regex` 的第一次出现处 |\n| `gsub(regex,\
  \ subst, string)` | 替换 `regex` 的所有出现处 |\n| `substr(string, start, end)` | 到子字符串结束的索引\
  \ |\n| `tolower(string)` | 转换为小写。 |\n| `toupper(string)` | 转换为大写。 |\n\n表格：GAWK 字符串参数\n\
  \n| Parameters | Description |\n| :--- | :--- |\n| `big` | 用于扫描查找“`little`”的字符串\
  \ |\n| `end` | 子字符串结束的索引 |\n| `format` | `printf` 格式字符串 |\n| `little` | 用于扫描查找“`big`”的字符串\
  \ |\n| `regex` | `Regex` 代表扩展正则表达式 |\n| `start` | 子字符串在索引中的起始位置 |\n| `string` |\
  \ 字符串参数。 |\n\n示例：\n```bash\nawk 'BEGIN{x = \"Linux Lovers\"; print toupper(x)}'\n\
  ```\n![](img/rsrc5E9.jpg)\n\n### 用户定义函数\n与 bash 脚本一样，`gawk` 支持用户定义函数，而且不仅如此！它还支持函数库。以下是你可以在代码中定义的函数语法。\n\
  语法：`function name([variables]){statements}`\n示例：\n```bash\nawk 'function printing(){printf\
  \ \"%s has the home path at %s\\n\", $1,$6}\nBEGIN{FS=\":\"}{printing()}' /etc/passwd\n\
  ```\n![](img/rsrc5EX.jpg)\n\n### 创建库\n这是 `gawk`（也是本书书）的最后一节。在这一节中，你将学习如何创建一个函数库并在不同的脚本中使用它。正如你之前学过的，让我们通过实践来学习。回到\
  \ `/etc/passwd` 的示例。\n\n1. **创建库文件**：在桌面上创建并保存此文件为 `awkflib`。\n   ```bash\n   function\
  \ myprint(){printf \"%s has the home path at %s\\n\", $1,$6}\n   ```\n2. **创建新脚本**：现在，创建一个实际文件将其作为库使用，并保存为\
  \ `script.awk`。\n   ```bash\n   BEGIN{FS=\":\"}{​ myprint()}\n   ```\n3. **运行脚本。**\n\
  \n\n\n\n\n# 命令\n\n`awk -f awkflib -f script.awk /etc/passwd`\n\n该命令执行非常成功，我们的库文件按预期工作。通过本节，你已经成功完成了本书中的所有章节和课程。\n\
  \n##结结\n\nLinux 正在企业用户、学校及家庭中迅速普及，它几乎被应用于所有地方，包括服务器、计算机、移动设备、物联网（IoT）以及无数其他场合。本书的内容将成为\
  \ Linux 新手和爱好者的极佳资源。\n\n你可能还还不熟悉 Linux，但我邀请你自己在 Linux 环境中尽可能尝试所有的练习示例。Linux 并不消耗资源，因此寻找一台低成本的电脑安装\
  \ Linux 并不困难。亲自动手（Get your hands dirty）至关重要。\n\n你可能拥有 Windows 背景，在某些阶段可能会遇到困难。有许多方法可以将\
  \ Linux 环境更改为类似 Windows 的环境，所有所需信息都包含在书中。关于哪种操作系统最好存在一些争论。我建议你不要急于下任何判断，而是学习你需要掌握的知识，以便尽可能精通\
  \ Linux。\n\n如果你愿意获得职业认证，有许多路径可以尝试。学习 Linux 促进职业发展是一个明智的决定，因为全球范围内都有许多机会。红帽（Red Hat）在其企业平台上提供了一套非常优秀的认证。关于红帽认证的更多信息可以在此处找到：https://www.redhat.com/en/services/training-and-certification。\n\
  \n我在书中添加了多个参考文献以帮助你获取更多信息。Linux 手册页（man pages）和 `--help` 命令也是极佳的来源。\n\n接下来的两将提供更多\
  \ Linux 知识，旨在涵盖各个方面，为你提供高水平的 Linux 技术知识。在此之前，祝愿所有读者好运，编码愉快！\n\n"
