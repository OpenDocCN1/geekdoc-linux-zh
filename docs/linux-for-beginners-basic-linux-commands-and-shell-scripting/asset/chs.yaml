  \ 你可以连续使用 `../` 来进入上级文件夹，并使用绝对路径（混合相对路径和绝对路径）往返跳转。\n\n![](img/rsrc223.jpg)\n\n##\
  \ 列出文件\n我们使用 `ls` 命令来列出文件。这是 Linux 用户最常用的命令之一。以下是 `ls` 命令及其用途。\n\n| command | Description\
  \ |\n| :--- | :--- |\n| `ls -a` | 列出所有文件，包括所有以 `.` 开头的隐藏文件 |\n| `ls --color` | 彩色列表\
  \ `[=always/never/auto]` |\n| `ls -d` | 列出带有 `*/` 的目录 |\n| `ls -F` | 为条目添加指示符（例如\
  \ `*/=>@&#124;`） |\n| `ls -i` | 列出 inode 索引 |\n| `ls -l` | 以长格式列出，包括权限 |\n| `ls\
  \ -la` | 与上述相同，包含隐藏文件 |\n| `ls -lh` | 人类可读格式的显示列表 |\n| `ls -ls` | 带有文件大小的显示列表 |\n\
  | `ls -r` | 逆序的显示列表 |\n| `ls -R` | 递归列出（目录树） |\n| `ls -s` | 列出文件大小 |\n| `ls -S`\
  \ | 按大小排序 |\n| `ls -t` | 按日期/时间排序 |\n| `ls -X` | 按扩展名排序 |\n\n让我们检查几个命令。记住，你可以使用多个参数。例如，`ls\
  \ -la`。\n\n语法：\n```\nls [option ...] [file]...\n```\n\n详细语法：\n```\nls [-a | --all]\
  \ [-A | --almost-all] [--author] [-b | --escape][--block-size=size] [-B | --ignore-backups]\
  \ [-c] [-C] [--color[=when]][-d | --directory] [-D | --dired] [-f] [-F | --classify]\
  \ [--file-type][--format=word] [--full-time] [-g] [--group-directories-first][-G\
  \ | --no-group] [-h | --human-readable] [--si][-H | --dereference-command-line]\
  \ [--dereference-command-line-symlink-to-dir] [--hide=pattern] [--indicator-style=word]\
  \ [-i | --inode][-I | --ignore=pattern] [-k | --kibibytes] [-l] [-L | --dereference][-m]\
  \ [-n | --numeric-uid-gid] [-N | --literal] [-o][-p | --indicator-style=slash] [-q\
  \ | --hide-control-chars][--show-control-chars] [-Q | --quote-name] [--quoting-style=word][-r\
  \ | --reverse] [-R | --recursive] [-s | --size] [-S] [--sort=word][--time=word]\
  \ [--time-style=style] [-t] [-T | --tabsize=cols][-u] [-U] [-v] [-w | --width=cols]\
  \ [-x] [-X] [-Z | --context] [-1]\n```\n\n示例：\n```\nls -l setup.py\n```\n![](img/rsrc25S.jpg)\n\
  这提供了该特定文件的长列表格式详情。\n\n更多示例：\n- 列出主目录内容：`ls`\n- 列出父目录内容：`ls */`\n- 显示当前目录的目录：`ls\
  \ -d */`\n- 列出根目录内容：`ls /`\n- 列出具有以下扩展名的文件：`ls *.{htm,sh,py}`\n- 列出文件详情。如果未找到则抑制错误：`ls\
  \ -myfile.txt 2>/dev/null`\n\n`/dev/null` 是一个重要位置。这实际上是一个名为 `null device”（空设备）的特殊文件。它还有其他名称，如\
  \ `blackhole` 或 `bit-bucket`。当内容写入此文件时，它会立即丢弃并返回文件结束符（EOF）。\n\n当进程或命令返回错误 `STDERR`\
  \ 时，标准错误是进程可以写入的默认文件描述符。这些错误将显示在屏幕上。如果有人抑制它，空设备就派上用场了。我们经常将命令行写作 `/dev/null 2>&1`。\n\
  \n`2` 和 `$1` 代表什么？标准输入 (stdin) 的文件描述符是 `0`。标准输出 (stdout) 是 `1`。标准错误 (stderr) 是 `2`。在这里，我们正在抑制\
  \ `ls` 命令生成的错误。它被重定向到 stdout，然后写入 `/dev/null` 从而丢弃。\n\n## 颜色代码\n![](img/rsrc26A.jpg)\n\
  图片：ls 颜色代码。这些颜色代码很好地区分文件类型（你可以在 [`askubuntu.com/questions/17299/what-do-the-different-colors-mean-in-ls`](https://askubuntu.com/questions/17299/what-do-the-different-colors-mean-in-ls)\
