- "# Linux 初学者指南：基础 Linux 命令与 Shell 脚本\n\n\n\n![](img/rsrc7.jpg)\n\n\n\n\n\n\n\n\n\
  \n## Travis Booth 的其他书籍\n* 深度学习系列\n* Python 深度学习入门：初学者的实战指南\n* Python 深度学习入门：超越基础的全面指南\n\
  * Python 数据分析系列\n* Python 数据分析：初学者真实世界速成课程\n* Python 数据分析：超越基础的实战指南\n* Python 数据科学系列\n\
  * Python 数据科学：初学者的实战学习\n* Python 数据科学：超越基础的实战指南\n[点击此处探索更多！](https://amzn.to/2nku7aN)\n\
  \n额外优惠：通过 Kindle Matchbook 购买纸质版，即可免费获得电子书。\n\n\n## 引言\n本书包含了如何使用或迁移到 Linux 以获取乐趣和利润的验证步骤和策略。这是\
  \ Linux 系列书籍中的第一本。你可以从书中学习 Linux 的基本概念和应用：从安装到基础 Shell 脚本。该系列的后续书籍将为你提供 Linux 概念、哲学和应用知识的深度知识。该系列书籍组织良好，旨在为初学者提供足够的知识成为高级\
  \ Linux 用户。\n\n### 谁应该读这本书？\n本书使用简单的技术术语编写，并采用简单的示例和解释，使拥有 Linux 零或极少经验的用户也能学习 Linux\
  \ 是什么以及如何开始学习 Linux。书的结构侧重于提供分步骤的说明和示例，并配有截图和解释，以避免混淆和歧义。内容不仅针对初学者，还面向普通计算机用户、初级管理员以及希望学习或加强对\
  \ Linux 及其在实践中应用之方法了解的高管人员。\n\n### 本书是如何组织和使用的\n本书将引导你完成自己 Linux 系统的初始设置，并向初学者介绍所需的\
  \ Linux 系统管理基础知识。在后面的章节中，它涵盖了更高级的主题，包括某些系统管理原理、理论和实际应用、基础和高级脚本，以及 `GAWK` 等程序。本书按以下方式组织：\n\
  * 你将学习更多关于 Linux 的历史、版本等内容（第 1 章）。\n* 安装和使用你的第一台 Linux 设备以及一些基础管理（第 2 章）。\n* Linux\
  \ 用户管理原理、实用方法、编辑器、终端和控制台（第 3 章）。\n* Linux 命令、文件系统和基础管理简介（第 4 章）。\n* Linux 分区类型、数据文件以及通过排序、使用\
  \ `grep` 搜索、压缩/解压缩和存档进行的操作（第 5 章）。\n* Shell 脚本准备工作，例如理解进程、环境变量和数组（第 6 章）。\n* 命令别名、文件描述符、堆、数学运算、高级结构化命令和示例（第\
  \ 7 章）。\n* 函数、参数、选项、`getopt` 和 `getopts`、读取用户输入和交互式脚本、高级函数、库以及 `GAWK` 的完整课程（第 8\
  \ 章）。\n\n### Tips、注释、注意事项和场景\n本书设计了许多排版特征，帮助你从书中获取最多的信息。\n\n## 为什么选择 Linux？\nLinux\
  \ 是一个开源操作系统或内核。它不仅是最流行的服务器操作系统，也是被广泛使用的开源操作系统。它由 Linus Torvalds 在 1991 年在 `GNU`\
  \ 的合作下创立。Linux 用于许多系统，例如笔记本电脑、台电脑、智能手机、智能冰箱等。尽管在起初它只在计算机程序员中闻名，但现在几乎无处不在。今天，Linux\
  \ 服务器运行着 Google、Facebook 以及许多知名服务。\n\n与 Windows 和 Mac OS 等其他流行的客户端操作系统相比，Linux 是一个开源系统，而其他系统不是。这意味着用户无法在那些操作系统中进行更改，因为用户无法访问它们的源代码。但任何人都可以修改\
  \ Linux 操作系统。这并不意味着 Linux 没有商业版本。\n\n有些人将 Linux 称为 `UNIX` 的克隆。`UNIX` 是 Linux 的基础，或者从技术上说是灵感。在考虑核心时，两者是相似的。尽管\
  \ Linux 像 `UNIX`，但它有独特的特征。`UNIX` 和 Linux 之间的区别在于：\n* Linux 非常灵活，但 `UNIX` 僵化，因此不能用于任何计算机。\n\
  * 与 `Unix` 相比，Linux 提供了广泛的可移植性。\n* Linux 的源代码可以轻松获得，但对于 `UNIX` 并非如此。\n\n这些都是 Linux\
  \ 基础的原因。一个完整的 Linux 系统可以被称为发行版。这包含了 Linux 内核、`GNU` 应用、桌面环境和应用程序。有许多满足需求的发行版：\n*\
  \ Linux Mint\n* Ubuntu\n* Debian\n* Red Hat / CentOS\n* Fedora\n这些发行版是根据需求定制的。可以根据自己的需求选择最合适的发行版。例如，Ubuntu\
  \ 可以轻松安装，任何人都可以使用，而 `OpenSUSE` 则需要高级知识。最近，由于许多优点，Linux 用户量激增。考虑到 Linux 的优点，最流行的一点是它是免费的。与\
  \ Windows 和 Mac 相比，Linux 在用户中占据主导地位。在历史上，Linux 并不是一个用户友好的操作系统，但现在它拥有足够的功能，并且灵活且高度可定制，可以在不下载完整功能包的情况下安装想要的内容。\n\
  \nLinux 的主要优点之一是它的安全性。由于许多操作系统的安全问题，Linux 的增加是不可避免的，考虑到其强大的安全架构。在使用 Linux 时，大多数情况下不需要使用杀病毒程序（这并不意味着它完全没有漏洞，但这些很罕见）。在考虑隐私时，Linux\
  \ 系统也是有利的。由于 Linux 是一个开源操作系统，任何爱好者都有机会修改它，创建他们自己的发行版。即使具有所有这些功能，Linux 也非常稳定且可靠。Linux\
  \ 的安装通过现代 GUI 能力变得极其简单并运行在几乎所有的硬件上。与其他操作系统相比，Linux 的软件更新和补丁也更快。除了上述缺点，还有一些问题，其中之一是\
  \ Linux 的版本数量非常多，这让初学者可能会感到困惑。由于 Linux 用户用户更多控制权，在过去的几十年里，Linux 赢得了普及。\n\n# 第 1\
  \ 章：Linux 内核与操作系统简介\n在本章中你将学习：\n\n### 什么是 Linux\nLinux 内核、Linux 发行版、桌面系统、Shell。一切从正式的介绍开始。在本章中，我们将从操作系统的角度来看\
  \ Linux。\n\n### 什么是 Linux？\n在不假设你了解操作系统的情况下，让我们简要看看术语和定义。我们将理解 Linux 是什么及其架构。操作系统是一个旨在更好地与一组硬件交互的软件程序，通过通信、管理和维护自身来实现工作，我们称之为计算机。如果采用一个更传统的定义，操作系统是用户和硬件之间的接口。操作系统通常在计算机的启动（boot）过程中加载到内存中，基本上诊断整个系统的健康状况，然后从硬盘将内容加载到内存。现在你知道操作系统是什么以及它的角色。有很多正在使用的操作系统，主要的操作系统有\
  \ Unix、Linux 和 Mac OS。现在当涉及到 Windows 等流行的操作系统时，清楚操作系统是什么。它是私有的且易于区分的。然而，在 Unix 和\
  \ Linux 上，有更多关于起源以及如何变为现实可以学习。\n\n如果你对操作系统的历史感兴趣，Unix 是最老的操作系统之一，特别是对于服务器系统。它是一个名为\
  \ `Multics` 的旧系统的衍生品。1970 年，Ken Thompson 与开发了 `C` 语言的 Dennis Ritchie 用 `C` 语言重写了这个小系统。Unix\
  \ 在学术界迅速成长，Berkeley 是其中心。他们引入了 软件发行版 `BSD`。在 70 年代和 80 年代，Unix 在学术界之外演变为操作系统并被其他组织采用。有许多版本，如\
  \ `IBM-AIX`、`HP-UX`、`Sun Solaris` 等。重要记住是 Unix 并不是开源软件。最终，在 BSD 家族下出现了一些开源变体，例如\
  \ FreeBSD。这种许可现在被称为 BSD 许可证。Linux 的出现得益于两个重要的名字：Richard Stallman 和 Linus Torvalds。在\
  \ 90 年代，Richard 想要创建一个真正开源且免费的私有 Unix 系统的替代品。他在 `GNU` 名下创建了一系列工具和程序。`GNU` 是一个递归缩写，它的意思是“GNU\
  \ 不是 Unix！”。然而，一组程序和工具没有内核是无法工作的！\n\n### 什么是内核？\n内核是操作系统的核心。一旦启动，它对整个计算机拥有完全控制权。它由一个小的加载程序加载，然后它就是始与终。它被加载到相同或单独的内存空间，然后控制并分配硬件，控制输入/输出操作、软件请求和处理。在赫尔辛基大学期间期间，Linus\
  \ 正在创建一个非操作系统特有的程序，以便他可以使用当时带有处理器的他的新 PC。他当时使用 `GNU C 编译器` 和其他工具，并在 `MINIX` 上继续开发（尽管架构从微内核变成了单体内核）。得益于\
  \ Linus 和他与 GNU 的关系，Linux 作为一个可用的操作系统诞生了，Richard 的免费开源梦想变成了现实。Linux 是一个类 Unix 操作系统。我们也可以说它在某种程度上是\
  \ Unix 的克隆。Linux 基本上由内核、`GNU`、X-Windows GUI 和图形桌面系统组成。它还包含了其他应用程序和工具。\n\n### 内核的作用\n\
  由于我们从内核介绍开始，让我们看看更多技术细节。这将有助于你理解 Linux 的某些重要方面，以及其他操作系统。\n\n\n\n\n\n### Slackware\n\
  Patrick Volkerding 在 1992 年创建了 Slackware，它是现存最老的 Linux 发行版。它以无 Bug 且简洁的发行而闻名。它可以在\
  \ 32 位 (`i486`) 和 64 位 (`x86_64`) 架构上运行。其哲学与 Arch Linux 类似。它的缺点很少，例如应用程序支持数量有限以及升级较为复杂。\n\
  \n### Debian\nGNU/Linux 出于 1993 年。今天，Debian 可以被认为是最大的 Linux 发行版和最大的协作软件项目。根据 Distrowatch\
  \ 的数据，Debian 由 1000 多名志愿者开发，拥有 50000 多个二进制包，并启发了 120 多个发行版。Debian 极其稳定，具有卓越的质量保证，并且与其他发行相比支持更多的处理器架构。主要缺点之一是稳定版的发布周期较（2-3\
  \ 年）。\n\n### Fedora\nFedora 是目前最具创新性的 Linux 发行版之一。它与著名的红帽 Linux 有关。2003 年，红帽引入了一项革命性的变化：Fedora\
  \ Core。它被引入为一种专为 Linux 爱好者设计的社区版。现在，红帽是最盈利最丰的企业。Fedora 提供了卓越的安全性，支持多个桌面环境，对内核进展、`glibc`\
  \ 和 `GCC`、`SELinux` 集成、日志文件系统、系统以及企业级功能做出了贡献。它还支持 32 位和 64 位环境。它面向更多的企业级功能和用户。\n\
  \n### Red Hat and Cent OS\n红帽在企业领域占据着旗舰地位。它始于 1995 年。它拥有许多创新组件，例如基于 GUI 的 Anaconda\
  \ 安装程序、`RPM` 包管理器等。遗憾的是，由于不断增加的专利问题等因素，它未能跟上节奏。它在 2003 年结束了其历史，并催生了 `RHEL`（红帽企业级\
  \ Linux）和 Fedora core。`RHEL` 无疑是行业事实标准。它能够在 `x86_64`、`Arm64`、`Power ISA`、`IBM Z`\
  \ 以及桌面平台上运行。它有许多针对不同企业级应用（如服务器和工作站）的变体。同时，Fedora 作为未来 `RHEL` 版本的上游。鉴于其领导力和影响力、卓越的支持和尖端技术，`RHEL`\
  \ 是企业使用的极品。它被科技巨头使用。\n\n### Gentoo\nGentoo 是一个高度灵活的元发行版，允许用户运行各种内核和软件配置。Gentoo 可以被自定义。该项目由\
  \ Daniel Robbins 在 2000 年引入。尽管它提供了灵活性，但使用它需要专业知识。换句话说，这不适合没有经验的用户，因为可能需要更多时间来适应。升级过程可能会非常耗时。\n\
  \n### Arch Linux\nArch Linux 由 Judd Vinet 于 2002 年发布。起初，它被认为是一个存在于中级和高级用户之间的边缘项目。后来，它通过一种被称为“滚动发布”（rolling-release）的特性得到了推广。滚动发布意味着操作系统能够让自己保持最新状态。Arch\
  \ Linux 拥有优秀的软件管理基础设施。它包含了从源代码安装软件的能力。其缺点之一是由于偶尔的不稳定性而导致系统崩溃的风险。\n\n## Ubuntu\n\
  Ubuntu 革新了 Linux 桌面用户的使用体验。它长期一直非常。它于 2004 年发布，至今在 Linux 用户中仍然很受欢迎。Ubuntu 基于 `DEB`\
  \ 包。它通过 Canonical 提供长期支持，现在甚至通过其服务器版支持企业用户。Ubuntu 的一些特殊特性是它包含一个可安装的实时 DVD，它支持新技术，让新手可以轻松适应\
  \ Ubuntu 和不同的桌面环境。Ubuntu 的显著缺点之一是其兼容性不足。\n\n## MX Linux\nMX Linux 的引入是为了 MEPIS Linux\
  \ 的替代品。它设计用于个人也适用于商业。MX Linux 最受欢迎的特性是它的图形化管理工具，被称为 `MX-Tools`。它对该平台拥有卓越的支持，对图形驱动程序具有卓越的兼容性且易管理。与\
  \ Mint 和 Ubuntu 相比，MX Linux 对新手可能不够友好。需要时间来适应，它的安装程序和某些工具看起来可能不同。\n\n### Mint\n\
  Linux Mint 于 2006 年发布。它基于 Ubuntu 设计。该发行版最适合初学者。Mint 拥有大量的增强功能使其易于使用。它提供了与其他系统的互操作性。因此，它不仅适用于个人使用，也适用于企业。开发者提供\
  \ 3 种发布，即官方版（12 月）、点版本（根据需要，例如错误补补）和每月快照版。这使得 Mint 极其稳定。\n\n### Backtrack and Kali\n\
  还有其他面向系统安全和渗透测试的特殊 Linux 版本。Kali Linux 是目前最流行的渗透测试平台。这一切始于合并 WHAX 创建的 BackTrack（WHAX\
  \ 是一个基于 Slax 的 Linux 发行版，背后的公司是 Offensive Security。早期的 WHAX 基于 Knoppix 并命名为 Whoppix）。BackTrack\
  \ 5 基于 Ubuntu Lucid LTS。它支持 32 位和 64 位架构以及 ARM。2013 年，该公司基于 Debian 重建了该平台并在 Kali\
  \ 的名下发布。Kali Linux 凭借其功能和一套顶级的渗透测试工具，非常稳定且先进。\n\n### Android\nAndroid 又是呢？Android\
  \ 是基于修改版 Linux 内核和 Google 自己的库的最大类型发行版。Android 运行运行一个名为 `Dalvin` 的虚拟平台来运行用 Java\
  \ 编写的应用程序。此类应用程序针对不同的硬件平台，并取决于 Google APIs。你不能在 Android 设备上运行桌面版 Linux。你不能在 PC 上运行移动版\
  \ Android（在不使用模拟和虚拟化的情况下）。\n\n### Linux Live CDs\nLinux Live CDs 和 USB 在各种用户中非常流行。它超越了简单的在安装前学习\
  \ Linux 是什么。许多 Linux 实时发行版都支持从 CD-ROM 运行操作系统。这对于演示目的和测试某些事物非常棒。自定义的发行版包含了执行各种简单和复杂系统任务的包，例如更改硬盘布局、安全和恢复程序等许多。这些版本现在以\
  \ Linux USB 发行版的形式出现。网站 `https://livecdlist.com/` 列出了极其庞大的实时 CD 集合。所有主流发行版都支持实时\
  \ CD 功能。\n\n#### Puppy Linux\nPuppy Linux 是一个小于 200MB 的小型系统。这个 Linux 发行版最适合基础计算机功能和网页浏览。尽管它非常小，仍然可以使用文件恢复工具和分区。该发行版使得安装其他流行的应用程序变得简单，因为它有自己的包管理器。Puppy\
  \ Linux 有各种名为“puplets”的自定义版本。Puppy Linux 的优势之一是可以在旧硬件上使用。\n\n#### Slax\nSlax 是一个小型而快速的\
  \ Linux 发行版。它基于 Slackware。但现在基于 Debian 稳定版。它是易于使用的 Linux 发行版之一。用户在下载时可以删除或添加模块。Slax\
  \ 非常方便。该发行版可以通过不同的介质如 USB 闪存或 DVD ROM 启动。Slax 有一个包含许多选项的启动菜单。\n\n\n\n\n\n# Linux\
  \ 发版对比\n\n## Knoppix\nKnoppix 是一个稳定的 Linux 发行版。它是最早的 Linux CD 之一。该系统非常成熟，包含 1000\
  \ 多个软件包。Knoppix 的优势之一是它支持独特的硬件。尽管 Knoppix 旨在从实时介质运行，但它也可以安装到硬盘中。Knoppix 有许多派生版本。\n\
  \n## Tiny Core Linux\nTiny Core Linux 发行版是一个非常小的便携操作系统。它仅有 10MB。由于该操作系统非常小，它不包含应用程序或文件管理器。不过，用户可以稍后安装它们。这是初学者的推荐选项之一。\n\
  \n## Ubuntu\nUbuntu 并没有特定的 LiveCD。但是，它的 ISO 镜像可以刻录到 DVD 或设置为 USB 启动盘。它从它启动时提供了一个“试用”的选项。\n\
  \n## MX Linux\nMX Linux 适用于旧电脑和现代电脑。这是一个用户友好的发行版，新手也可以使用。\n\n\n\n\n# Linux 桌面系统\n\
  \nLinux 桌面最初是基本的命令行或文本界面。随着 Windows 等客户端操作系统的演进，人们对组织良好的 GUI（图形用户界面）的需求日益增加。现在有多个图形化桌面可供选择。Linux\
  \ 图形环境由系统软件（如 `X-Windows` 系统）组成，在其之上是桌面环境。让我们先来看 `X-Windows`。\n\n## X-Windows 系统\n\
  \n个人电脑中负责图形环境的主要硬件是显示器和显卡/驱动程序。任何支持图形环境的操作系统，都必须首先与这两者通信。在 Linux 中，这是 `X-Windows`\
  \ 系统的职责。这是一个低级系统程序，通过通信和管理进程，来创建一个可以生成图形环境的环境。这就是 `X-Windows` 系统在 Linux 操作系统中所做的工作，它基于客户端/服务器架构——`X\
  \ server` 负责处理来自任何客户端（例如应用程序）的图形请求。因此，它支持网络协议（尽管最初的通信是不安全的）。该系统是在麻省理工学院（MIT）开发的。\n\
  \n在安装 Linux 期间，它会检测显示器和显卡，然后创建一个 `X-Windows` 配置文件。这在安装过程中较容易发现，因为屏幕可能会变黑并闪烁几次。\n\
  \n随着发展，这个旧的系统演变成了更现代的版本：`XFree86` 和 `X.org` 版本。`XFRee86` 是一个扩展免费开源 `X-Windows` 系统的志愿者组织之一。Unix、Linux\
  \ 系统、BSD 变体、Sun Solaris 以及某些 Mac OS 系统都运行着这个发行版。\n\n另一个参与者是 `X.org`（Open Group 的一部分）。它将旧的\
  \ `X-Windows` 系统推向了新的高度，并在两者中都很流行。你可以在 `https://www.x.org/wiki/` 了解更多信息。\n\n## 桌面环境类型\n\
  \n`X-Windows` 系统可以构建基础，但要运行完整的桌面环境还需要另一个程序来运行它，因为对于一直依赖 GUI 的普通用户来说，X-Windows 系统本身并不好用。\n\
  \n为了启用全功能的桌面环境，存在另一套程序。这些被称为桌面环境（Desktop Environments）。让我们来看一些流行的环境。\n\n### KDE\
  \ 桌面\n\nKDE 或 K Desktop Environment 是较老且流行的系统之一，即使是现在如此。它之所以流行是因为它与微软 Windows 桌面环境相似。KDE\
  \ 不仅仅是一个环境，它还是一个应用程序集合。它具有高度可定制性。\n\n最新版本有两个变体称为 `Plasma Desktop` 和 `Plasma Notebook`。与其他桌面不同，KDE\
  \ 提供全套应用程序和体验（你可以在此处查看列表：`https://kde.org/applications/`）。主要的 Linux 平台（如 OpenSUSE\
  \ 和 Kubuntu）将其作为默认。以下是 KDE 应用程序列表（版本 19.04）。\n\n- `Amarok` : 音乐播放器\n- `Dolphin`\
  \ : 文件管理器。\n- `Dragon Player` : 视频播放器。\n- `Kate` : 开发环境。\n- `Kmail` : 带有隐私保护的电子邮件。\n\
  - `Konsole` : KDE 终端模拟器。\n- `KOrganizer` : 联系人管理器。\n- `KWrite` : 文本编辑器。\n- `Okular`\
  \ : 通用文档查看器。\n- `Spectacle` : 截图应用程序。\n\n### GNOME\n\nGNOME 最初发布于 1999 年。GNOME 代表\
  \ `GNU Network Object Model Environment`。它是另一个极其流行的桌面环境。然而，对于习惯 Windows 风格桌面的用户来说，GNOME\
  \ 的风格不同。它背离了 Windows 的外观，但融合了许多相似的功能。如果你熟悉 Ubuntu，这就是你大部分时间必须打交道的桌面。\n\n在相似之处中，提供了桌面图标、类\
  \ Windows 面板（位于顶部和底部）、菜单以及拖放功能。然而，GNOME 桌面缺少一些原生的应用程序。为了解决这一障碍，使用 GNOME 的 Linux\
  \ 发行版集成了 KDE 库。如果你熟悉 Mac 系统，最新的 GNOME 界面与 Mac OS 有一些相似之处。\n\nGNOME 提供了以下应用程序。你可以从这里获取完整的应用程序列表：`https://wiki.gnome.org/Apps/`\n\
  \n- `Empathy` : 通用即时通讯应用。\n- `Evince` : 文档查看器。\n- `Geary` : GNOME 邮件客户端。Evolution\
  \ 是一个带有日历和地址簿的类似应用程序。\n- `Gedit` : 文本编辑器。\n- `Gnome-terminal` : 终端模拟器。\n\n其他流行的桌面环境在下面的列表中。\n\
  \n- `MATE` : `MATE` 在外观和感受上某种程度上传统，带有一丝现代感。它是基于 GNOME 2 开发的。Ubuntu MATE 是一个使用 MATE\
  \ 的操作系统。更多信息请访问 `https://mate-desktop.org/`。\n- `XFCE` : `Xfce` 代表 `XFOrms Common\
  \ Environment`。这是一个轻量级桌面环境，资源消耗低、用户友好且视觉上观。它与 GNOME 桌面有些相似，因为它基于 `GTK` 工具包。然而，它不是\
  \ GNOME 的分支。它适用于 Unix 和 Linux 发行版。MX Linux、Manjaro 和 Xubuntu 使用这个桌面环境。更多信息请访问 `https://www.xfce.org/`。\n\
  - `LXDE` : 这代表 `Lightweight X11 Desktop Environment`。正如名称所示，它更快更轻量，但拥有功能丰富的环境。它拥有一组良好的应用程序和一个活跃的社区。LXDE\
  \ 是旧电脑的很好的桌面环境。它的外观与 GNOME 相似，但正在发生转变。其具有 GNOME 外观和感受的原因是使用了 `GTK +2` 工具包。它也运行在\
  \ Unix 和 Linux 平台上。Lubuntu、Knoppix、Peppermint 操作系统使用 LXDE 作为它们的桌面环境。更多信息请访问 `https://lxde.org/`。\n\
  \n## GNU 工具\n\n我介绍了 GNU 及其与 Linux 内核的关系。你可能见过过 `GNU/Linux` 术语的使用。现在你知道背后的原因了。GNU\
  \ 是为了让 Unix 用户体验类 Unix 环境而设计的。这就是为什么该工具集包含了许多类 Unix 的命令行工具。\n\nLinux 系统使用一组核心工具，被称为\
  \ `coreutils`。它包含了管理文件、shell 和文本处理的工具。每个 GNU/Linux 发行版都应该包含这些核心工具。其中最重要的是 `Shell`。在下一章中我们将更详细地查看\
  \ shell。以下是对 shell 的介绍。\n\n# 第 2 章：安装 Linux\n\n在本章中，你将学习：\n- 安装 Linux\n- UEFI 与\
  \ Legacy BIOS\n- 系统要求\n- 安装后任务\n- 故障排除\n\n## 安装 Linux\n\n随着 Linux 发行版的演进，图形界面和工具发生了巨大的变化。安装\
  \ Linux 比比 90 年代要容易得多。这并不意味着它不能通过命令行安装。这可能是个人偏好，也可能是行业需求。例如，通过命令行安装可以同时实现服务器设置和减少攻击面。我们将在本章中研究这两种方法。让我们从系统要求开始。\n\
  \n有 288 个 Linux 发行版，安装方法可能各不。我不预期涵盖所有的安装方法，因为这不是本书的意图。我们将介绍 Ubuntu 的安装，因为它非常流行且实用。\n\
  \n### 先尝试 Live CD\n\n如果你打算作为裸机安装（bear metal installation）安装 Linux 操作系统，你可以直接安装。但是，如果你想先尝试一下或者演示它的用法，可以先作为\
  \ Live CD 模式运行它。大多数 Linux 发行版都支持这种模式。\n\n在本系列中，我们将同时使用 Ubuntu 和 Red Hat 或 CentOS\
  \ 来提供示例。让我们先学习如何准备 Ubuntu Live CD。\n\n\n\n\n\n1. 从 [`www.ubuntu.com/getubuntu/download`](http://www.ubuntu.com/getubuntu/download)\
  \ 下载 Ubuntu。\n\n2. 在 Windows 或 Linux 平台上，将 ISO 镜像刻录到 DVD。\n\n3. 从 DVD 启动并选择“尝试 Ubuntu（Try\
  \ Ubuntu）”。\n\n如果你想创建 USB 启动盘，这里有相关说明。这些步骤也提供了第 13 步中设置 DVD 的指南。如果你没有安装操作系统，必须进入“在不安装的情况下尝试（Try\
  \ without installing）”。然后你可以使用 `Gparted` 分区工具，例如，如果你想创建一个启动电脑的 USB 盘。\n\n1. 你需要一个容量为\
  \ 4 GB 的 USB 盘。请记住，USB 盘在设置过程中会被擦除。如果 USB 盘是 USB 3.0 的速度会更快。\n\n2. USB 盘必须支持启动。某些优盘可能存在问题。在选择\
  \ USB 盘之前必须验证这一点。\n\n3. 如果你使用的是 Windows，可以使用如 `Rufus` 等软件准备 USB 盘并完成安装。既然我们正在学习\
  \ Linux，为什么不在 Linux 上操作呢？\n\n4. 在 Linux 系统上，让我们使用 `Gparted` 创建 USB 盘。我正在使用 Ubuntu\
  \ 创建 USB 盘。如果你使用的是 Live CD，它已经存在其中了。\n\n5. 使用以下命令安装 `gparted`：\n\n```\nsudo apt-get\
  \ install gparted\n```\n\n6. 格式化一次 USB 盘。\n\n7. 按 `Ctrl+H` 显示隐藏文件。加载镜像文件（挂载）到 USB（复制）。\n\
  \n8. 右键点击分区，选择`管理标志（Manage Flags）`并启用 `boot` 和 `lba` 标志。\n\n如果你想使用其他工具，例如 `mkusb`：\n\
  \n1. 为了进行结构化和格式化，让我们使用一个名为 `mkusb` 的实用。首先在 Ubuntu（标准版）上获取它。每行按回车。\n\n```bash\nsudo\
  \ add-apt-repository universe\nsudo add-apt-repository ppa:mkusb/ppa\nsudo apt-get\
  \ update\nsudo apt-get install mkusb\n```\n\n2. 为了方便起见，让我们使用 `mkusb` 的 GUI 版本。\n\
  \n3. 运行该工具并检查选项。过程完成后，你可以将 USB 恢复为标准存储设备。\n\n![](img/rsrcEH.jpg)图像：mkusb 工具\n\n\
  4. 从第一个选项开始，你可以创建一个启动设备。它将擦除第一个兆字节并创建所需的布局。\n\n### 如果你想在 Ubuntu 上使用 `usb-creator`\n\
  \n1. 要从获取的 ISO 创建便携 USB，让我们使用 Ubuntu 中的 `usb-creator` 实用工具。只需挂载 USB 并启动此程序。\n\n\
  2. 对于源镜像，通过浏览路径提供镜像。如果镜像未列在列表中——如果没有，使用`其他...（Other…）`按钮找到它。\n\n3. 要使用的磁盘：从列表中选择\
  \ USB 盘。如果你想使用 DVD，可以插入 DVD。\n\n4. 如果使用 USB，请从列表中选择第一个启动分区。该分区应为 `Fat16` 或 `FAT32`\
  \ 格式。\n\n5. 如果你遇到 `Dbus` 错误，请参考 [`bugs.launchpad.net/usb-creator/+bug/458334`](https://bugs.launchpad.net/usb-creator/+bug/458334)\n\
  \n### 如果你的电脑使用的是 UEFI 怎么办？\n\n如果 BIOS 模式设置为 legacy（传统），安装 Ubuntu 会更简单。如果它是 UEFI（统一扩展固件接口），你需要设置一个\
  \ UEFI 模式启动设备。USB 是此处的最佳选择。除非已经安装了另一个系统并且你想以双启动配置进行安装，否则不需要在 UEFI 模式下安装 Linux。\n\
  \n1. 获取 Ubuntu 64 位 ISO。获取 12.10 或更高版本更好，因为这些版本支持安全启动技术。\n\n2. 在创建 USB 盘时，按照上文说明使用\
  \ `Gparted`。\n\n3. 进入电脑的固件菜单并禁用`快速启动/快速启动（Quickboot/Fastboot）`和 `Intel 智能响应技术 (SRT)`。如果你使用的是\
  \ Windows 8 或更高版本，请禁用`快速启动（Fast Startup）`。\n\n4. 设置你的固件从 UEFI 模式启动。就这样！\n\n### 从你的\
  \ Live CD 启动\n\n1. 插入 DVD 或 USB 盘并开启电脑。\n\n2. 选择语言。\n\n3. 当提示选项时，选择“在不更改电脑任何的情况下尝试\
  \ Ubuntu（Try Ubuntu without any change to your computer）”。\n\n### 主要发行版的 Linux 系统要求\n\
  \n下表列出了以下 Linux 发行版的推荐要求。这些不是最低要求！这些是推荐要求。为什么从表中删除了最低要求？因为目前人们通常使用带有较新硬件的强大电脑。拥有至少\
  \ 1 GB 内存和至少 40-80 GB 硬盘的电脑是极可能的。因此，没有刻意包含最低且有些不切实际的要求。如果你想了解这些具体要求，请参考制造商的网站或知识库。\n\
  \n表格：主要发行版的 Linux 系统要求\n\n| Linux 发行版 | CPU | 内存 | 硬盘 |\n| :--- | :--- | :--- |\
  \ :--- |\n| Red Hat Linux 7 | Intel/AMD 64, ARM 及更多 | 768MiB – 1.5 GiB | 10 GiB\
  \ |\n| Cent OS 7 | I386, x86_64, PowerPC8le, IA-32, ARMv7hl, AARch64 (arm64) | 64\
  \ 位使用 1 GB 逻辑 CPU | 1 GB | 10-20 GB |\n| Mint 19 | 推荐 64 位 | | | 20 GB |\n| Ubuntu\
  \ 18.04.3 | 2 GHz | 2 GB | 25 GB |\n| Fedora 30 | 双核 | 4 GB | 10 GB |\n| Debian\
  \ 9 | 2 GHz | 2 GiB | 25 GB |\n| MX Linux | i486 | | | 5 GB |\n| Kali Linux | |\
  \ | | |\n\n### 执行基础 GUI 安装\n\n1. 插入启动媒体并重启电脑。你将看到启动菜单。接下来，你必须决定是尝试 Ubuntu 还是安装 Ubuntu。接下来，选择你的键盘布局并继续。\n\
  \n2. 在下一个屏幕上，你将看到 4 个选项：\n\n    - 正常安装（类似于全功能）。\n    - 最小化安装，包含一组最基本的实用程序。这对于安全很有好处。\n\
  \    - 其他选项：在安装时下载更新 – 此选项将更新你的系统。但这将花费更多时间。\n    - 其他选项：为图形和 Wi-Fi 硬件以及附加格式安装第三方软件\
  \ – 此选项非常重要。如果你的电脑需要额外的驱动程序，你可以安装它。\n\n3. 接下来是磁盘选项。你将获得 4 个选项：\n\n    - 擦除磁盘并安装\
  \ Ubuntu：如果你正在准备双启动配置，请永远不要使用此选项。否则，这是最佳选项。\n    - 加密：你可以在安装期间启用加密。\n    - 使用 LVM：此选项允许你利用逻辑卷管理器。它可以帮助磁盘管理任务，例如调整分区大小和快快，以便你可以恢复操作系统。\n\
  \    - 如果你想保留双启动配置或设置新的分区表，请点击`其他（Something Else）`。\n\n4. 安装 Ubuntu\n\nUbuntu 和\
  \ Linux 系统将硬盘显示为文件。如果磁盘是 IDE，名称为 `/dev/hda` 到 `/dev/hdd`。对于 SCSi 控制器，是 `/dev/sda`。如果有更多磁盘，它们将被命名为\
  \ `/dev/sda`、`/dev/sdb` 等。分区将为 `/dev/sda1`、`/dev/sda2` 等。你可以使用 `MBR` 或 `GPT` 作为分区类型。后者是新方案，相比\
  \ MBR 具有许多优势。`GPT` 或 GUID 分区表为每个分区设置了唯一的 GUID，分区数量几乎没有限制，并且能够防范数据损坏。在 EFI 和 UEFI\
  \ 系统上使用 `GPT`。\n\n如果你要自定义分区方案，需要哪些分区以及大小要求是什么？\n\n1. Linux 拥有不同的分区集，让我们看看下表。\n\n\
  表格：Linux 目录\n\n| 目录 | 用途 |\n| :--- | :--- |\n\n\n\n\n\n# 文件系统概述\n\n| 路径 | 描述 |\n\
  | :--- | :--- |\n| `/` | 这是根目录。最顶层。 |\n| `/bin` | 这是二进制文件存储目录。该目录下存在 GNU 实用程序（用户级）。\
  \ |\n| `/boot` | 系统存储启动目录和在启动过程中使用的文件的地方。 |\n| `/dev` | 设备目录和节点。 |\n| `/etc` | 系统存储配置文件的地方。\
  \ |\n| `/home` | 用户目录的主目录。 |\n| `/lib` | 系统和应用程序库。 |\n| `/media` | 媒体设备挂载的地方，如 CD、USB\
  \ 驱动器等。 |\n| `/mnt` | 可移动介质挂载的位置。 |\n| `/opt` | 可选软件包存储在此处。 |\n| `/proc` | 进程信息\
  \ – 对用户不开放。 |\n| `/root` | root 用户的家目录。 |\n| `/sbin` | 系统二进制存储目录。管理工具存储在此处。 |\n\
  | `/tmp` | 临时文件存放。 |\n| `/usr` | 用户安装的软件存储在此处。 |\n| `/var` | 变量目录，存储日志等动态文件。 |\n\
  \n## 分区考虑因素\n\n当你创建特定的分区方案时，需要考虑以下计算方法。\n\n| 分区 | 建议 |\n| :--- | :--- |\n| `/boot`:\
  \ 如果磁盘大于 100 GB。 | 250 – 1000 MB |\n| `/SWAP` | 至少等于 RAM 大小 |\n| `/` | 至少 8 GB 到\
  \ 15 GB |\n\n对于 GPT 和 EFI 分区，需要一个 BIOS 启动分区（用于 Legacy 启动）或一个 EFI 分区。如果是 Legacy 模式，该分区的大小为\
  \ 1 MB。如果是 EFI，它必须挂载在 `/boot/efi` 且大小为 100-250 MB (fat32)。\n\n`SWAP` 是为内存操作预留的虚拟内存。如果系统需要更多内存空间，不活跃的区域或页面将被转储或交换交换。`SWAP`\
  \ 不应被视为内存的替代品。旧的 `SWAP` 大小规则是 `2 x RAM`。然而，这现在已不再适用。\n\n### 表：Linux SWAP 分区建议\n\n\
  | 已安装内存大小 | SWAP 空间 | 带有休眠 SWAP |\n| :--- | :--- | :--- |\n| `<= 2 GB` | `2 x RAM`\
  \ | `3 x RAM` |\n| `2 - 8 GB` | `= RAM` | `2 x RAM` |\n| `8 – 64 GB` | `4 GB 到 ½\
  \ x RAM (8 GB 足够)` | `1.5 x RAM` |\n| `> 64 GB` | `4 GB` | 应避免使用休眠 |\n\n以下是在 Ubuntu\
  \ 文档中找到的推荐自定义分区方案。由于我们安装了 Ubuntu，如果你打算长期使用，可以考虑以下方案。\n\n### 表：Ubuntu 分区建议\n\n| 分区\
  \ | 建议大小 |\n| :--- | :--- |\n| `/home` | 全部 – 使用独立磁盘更好。 |\n| `/usr` | 10 GB |\n\
  | `/var` | 2 GB |\n| `/lib` | 5 GB |\n| `/boot` | 250 MB |\n| `/opt` | 500 MB –\
  \ 5 GB。如果使用通用仓库，请分配几个 GB。 |\n| `/etc` | 250 MB |\n| `/sbin` | 250 MB |\n| `/bin`\
  \ | 250 MB |\n| `/dev` | 避免分区 |\n| `/srv` | `<= 100 MB`。如果你运行 Web 服务器或类似程序，请做好规划。\
  \ |\n| `/tmp` | `<= SWAP` |\n| `/mnt` | |\n| `/media` | |\n\n来源：`https://help.ubuntu.com/community/DiskSpace`\n\
  \n## 安装过程\n\n10. 现在你知道如何分配分区了。如果你没有分配任何分区而是使用默认设置，将看到以下弹出窗口。\n\n![一张自动生成的手机描述截图](img/rsrcXB.jpg)\n\
  图片：确认磁盘更改\n\n11. 接下来，选择你的地理位置。\n\n12. 在下一个窗口中创建你的用户账户。有一点非常需要记住，特别是对于 Windows 用户。Linux\
  \ 文件系统是**区分大小写**的！你必须小心使用大写和小写字母。如果你使用用户名 `John` 和 `john`，它们是不相同的！这对于文件、文件夹和其他内容也是如此。\n\
  \n![一张自动生成的手机描述截图](img/rsrcXM.jpg)\n图片：创建第一个用户！\n![一张自动生成的手机描述截图](img/rsrcXU.jpg)\n\
  图片：创建第一个用户 - 选项\n\n13. 一旦完成这些步骤，安装将开始，并在安装完成后会你你。\n\n14. 将显示安装完成屏幕。点击 `Restart Now`。\n\
  \n15. 一旦重启，且如果你选择了登录提示，你将进入登录页面。\n\n16. 接下来，你必须完成安装后的任务。记住，在安装期间，你的网络连接将会被配置。\n\n\
  17. 在查看“新功能”部分后，点击 Next。\n\n18. 设置 LivePatch。如果你担心内核补丁修复，这非常关键，我建议你配置它。\n\n19. 在下一个屏幕中，你可以通过创建新账户注册，或如果你已有账户则登录。点击\
  \ Next。\n\n20. 在下一个屏幕中，你可以通过点击 `Help improve Ubuntu - Yes, send system info to Canonical`\
  \ 加入他们的匿名质量保证计划（例如收集崩溃数据等）。如果你不想参与，请选择其他选项并关闭窗口。\n\n欢迎来到你新的 Ubuntu 工作空间。这是 Ubuntu\
  \ 18.04.3。![](img/rsrcYA.jpg)\n图片：Ubuntu 工作空间\n\n## 安装后任务\n\n### 连接网络\n\n如果你无法连接网络，我们可以使用\
  \ GUI 进行配置。开始之前，点击右上角的网络图标。它将打开设置面板，然后在其中进入 `Network` 面板。\n你只需要进入 `IPv4` 部分并进行配置。如果设置为\
  \ `DHCP`，在大多数情况下你就可以正常使用了。如果你使用虚拟机，你将需要在虚拟机宿主机上进行网络桥接。\n要选择手动地址，请执行以下程序。![](img/rsrcYP.jpg)\n\
  图片：Ubuntu 网络配置\n此外，你还可以设置 `IPv6` 地址、`DNS`（在这里我使用 Google DNS）和其他细节。无线连接也类似。\n\n####\
  \ 如何使用命令配置连接？\n\n1. 在桌面上点击右键并点击 `Open terminal`。终端将帮助执行命令。\n\n2. 使用以下命令查看连接属性：\n\
  \n```\nip addr\n```\n\n3. 如果查看网卡状态，使用：\n\n```bash\nip link\n```\n\n4. 查看路由信息：\n\n\
  ```bash\nip route\n```\n\n5. 查看网络接口的统计信息，使用：\n\n```bash\nip -s link\n```\n\n\n\n\
  \n\n![](img/rsrc107.jpg)\n# 安装故障排除\n\n有时在极少数情况下，你可能会收到致命错误 `11 (SIGSEGV)`。如果操作系统安装程序访问了不应访问的内存位置，它将停止继续运行。`SIGSEGV`\
  \ 代表段错误信号（Segment Violation Signal），换句话说就是段错误。这表明存在硬件相关的问题。如果是由于硬盘问题，你可以尝试擦除并重新安装。如果是由于内存故障，更换内存模块将解决问题。你也可以尝试在\
  \ `BIOS` 中禁用 CPU 缓存看看是否有帮助。\n\n# 第 3 章：Linux 用户管理\n\n在本章中，你将学习：\n- `sudo` 命令和超级用户/Root\
  \ 用户\n- 通过 GUI/CLI 管理用户\n- 管理 `sudoers`\n- 命令别名\n- 什么是 `/etc/passwd`\n- 特殊权限位（Special\
  \ Bits）\n\n在本章中，你将学习如何设置超级用户、如何修改 root 用户和其他账户，以及如何通过 GUI 和命令行设置管理员、普通用户和组。\n\n\
  ## `sudo` 命令\n\n由于你是 Linux  way 系统的初学者，你需要了解一些基本命令，以便提升到 `su` 或超级用户权限。`sudo` 命令将用户提升为\
  \ root 用户，提供执行管理任务所需的足够权限。然而，并非每个人默认都能获得这些权限。用户必须被添加到 `/etc/sudoers` 文件才能使用此命令。\n\
  \n![](img/rsrc10Y.jpg)\n![](img/rsrc114.jpg)![](img/rsrc119.jpg)\n\n示例：当你第一次使用 Ubuntu\
  \ 时，你可以控制 root 账户。首先，你需要为 root 设置一个密码，然后进行用户切换。\n![](img/rsrc11E.jpg)\n太棒了！现在，你是\
  \ root 用户了！\n\n## 将用户添加到 sudo 用户列表\n\n要将用户添加到 sudo 用户列表，你应该使用 GUI 或 `sudo visudo`\
  \ 命令。在终端中执行此命令。运行以下命令：\n\n```bash\nsudo visudo\n```\n![](img/rsrc11P.jpg)\n图片：`sudo`\
  \ 用户列表\n\n让我们尝试理解这个文件。有一个 root 用户，配置为 `root ALL=(ALL) ALL`。第一个 `ALL` 意味着 root 用户可以使用任何终端。第二个\
  \ `ALL` 表示 root 可以以任何用户身份运行。最后的 `ALL` 允许该用户运行所有命令。\n\n我们可以添加具有特定控制权限的更多。例如，`poweruser\
  \ ALL= /sbin/poweroff` 命令将允许 `poweruser` 用户通过任何终端关闭系统。\n\n下一个要学习的是使用别名。你可以在此文件中使用几种类型的别名：\n\
  - `Host_Alias`\n- `User_Alias`\n- `Runas_Alias`\n- `Cmnd_Alias`\n\n例如，`sudoers`\
  \ 文件可能如下：\n- 将 `env_reset` 更改为 `env_reset,timestamp_timeout=n`。在这里你必须替换 `n`，以便会话时长不会超过指定的分钟。你可以使用\
  \ `-1` 来停止超时限制。\n- 默认情况下，在提升 `sudo` 权限时输入密码不会显示字符。如果你想在输入密码时看到 `*`，请在上述行添加 `pwfeedback`。即\
  \ `env_reset,pwfeedback`。\n- 创建别名并设置权限。见下例。\n\n```text\nDefaults          env_reset,pwfeedback,timestamp_timeout=15\n\
  Defaults          mail_badpass\nDefaults          secure_path=\"/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin\"\
  \n# 主机别名规范\nHost_Alias LAN = jan.contoso.com, jake. contoso.com\nHost_Alias SRV\
  \ = jan.host.com, drake.host.com, jake.host.com\nHost_Alias DNET = 10.1.2.0/255.255.255.0\n\
  # 用户别名规范\nUser_Alias OPERATORS = dan\nUser_Alias WEBADMIN = jan, sana\nUser_Alias\
  \ MAILADMIN = kane\n# 命令别名规范\nCmnd_Alias SU = /bin/su\nCmnd_Alias HTTPD = /etc/rc.d/init.d/httpd,\
  \ /etc/rc.d/init.d/mysql\n# 用户权限规范\nroot   ALL=(ALL:ALL) ALL\nOPERATORS ALL=ALL\
  \ # operators 组拥有所有权限。\njan2 DNET=(ALL)ALL#jan2 通过 DNET 网络拥有所有权限。\n## admin 组成员可能获得\
  \ root 权限\n%admin ALL=(ALL) ALL\nprint_operator ALL= PRINTING#print_operator 可以从任何计算机运行\
  \ lpc 和 lprm。\n## 允许 sudo 组成员执行任何命令\n%sudo   ALL=(ALL:ALL) ALL\n```\n![](img/rsrc140.jpg)\n\
  \n## 通过 GUI 添加用户\n\n请按照以下步骤通过 Ubuntu GUI 添加用户：\n\n1. 打开 `Account Settings`（账户设置）对话框，可以通过\
  \ `Ubuntu Dashboard`，或者点击 Ubuntu 屏幕右上角的向下箭头。\n![](img/rsrc14B.jpg)\n图片：Ubuntu 用户账户\n\
  \n2. 接下来，点击你的用户名，然后如下所示选择 `Account Settings`（账户设置）。\n![](img/rsrc14J.jpg)\n图片：Ubuntu\
  \ 账户设置\n\n3. 将打开 `Users`（用户）对话框。\n![](img/rsrc14S.jpg)![](img/rsrc14X.jpg)\n图片：Ubuntu\
  \ 主用户账户\n\n4. 点击 `Users` 对话框右上角的 `Unlock`（解锁）按钮。将打开 `Authentication`（身份验证）对话框，让你提供管理员身份验证信息，因为只有这样你才能创建或编辑用户账户：\n\
  ![](img/rsrc154.jpg)\n图片：身份验证请求\n\n5. 接下来，提供密码并点击 `Authenticate`（验证）按钮。你现在可以看到 `Users`\
  \ 对话框中的所有字段已为你启用。\n\n6. 点击 `Add User`（添加用户）按钮。`Add User` 对话框将打开让你输入要创建的新用户的详情。\n\
  \n7. 你可以通过此对话框指定要创建 `Standard`（标准）还是 `Administrative`（管理）用户。同样重要的是，为新用户留空密码字段不是良好的安全做法。这样任何用户都可以登录并访问你系统上的隐私和安全数据。让我们添加\
  \ `jake` 为一个新的标准用户。\n![](img/rsrc15D.jpg)\n图片：添加新用户\n\n8. 点击 `Add`（添加）按钮，只有在 `Add\
  \ User` 对话框中提供了所有有效信息后，该按钮才会可用。新用户现在将被创建，你可以如下所示在 `Users` 对话框中看到它：\n![](img/rsrc15M.jpg)\n\
  图片：新标准用户\n\n9. 你还可以更改组成为 `Administrator`（管理员）、选择区域、重置密码、启用自动登录以及账户活动。\n\n10. 要删除用户，可以使用右下区域的\
  \ `remove`（移除）按钮。\n\n\n\n\n\n## 通过命令行添加用户\n\n通过 Linux 命令行管理用户和组更加方便。在本节中，我们将介绍相关的技术和示例。\n\
  \n## Linux 中的用户和组管理\n\nLinux 是一个多用户平台。在企业环境甚至 SOHO（小型办公/家庭办公）环境中，它通常供多个用户共享。某些用户和组织过去会让几个用户共享同一个账户。从安全和可用性的来看，这是一种危险的做法。因此，推荐的最佳实践是创建多个账户并相应分配权限。在\
  \ Linux 系统中，如果需要共享文件或目录，用户和组管理工具完全能够胜任。\n\n### Root 或超级用户权限\n\n添加新用户涉及管理您以外的账户，这需要超级用户（AKA\
  \ `root`）权限。其他用户或组管理任务也是如此，例如删除账户、更新账户以及创建和删除组。\n\n与任何其他操作系统一样，用户管理任务是 root 用户或超级用户的责任。这包括用户和组管理任务。由于账户管理需要安全保障，因此这是必须的。\n\
  \n使用以下命令执行用户管理任务：\n\n- `su`: 切换用户。\n- `sudo`: 以 root 用户身份通过提权权限执行命令。\n- `adduser`:\
  \ 向 Linux 系统添加用户。\n- `userdel`: 删除用户账户，无论是否删除用户文件。\n- `addgroup`: 添加组。\n- `delgroup`:\
  \ 组。\n- `usermod`: 此命令可在添加用户后修改用户。\n- `chage`: 此命令可以更改账户的年龄（更改有效期）。换句话说，它用于更改账户过期时间。\n\
  \n### 涉及的文件\n\n- `/etc/passwd`: 存储用户信息。\n- `/etc/shadow`: 密码加密。\n- `/etc/sudoers`:\
  \ 如果用户未列在此文件中，则既无法执行管理任务也无法提供管理授权。我们在在本章之前的某个章节已经介绍过并修改了此文件。\n- `/etc/group`: 此文件包含所有的组信息。\n\
  \n超级用户是全能账户，拥有执行任何操作的所有权限。它是起始也是终结。在安装操作系统后可以配置 root 用户。默认情况下，在 Ubuntu 上系统安装程序也会成为超级用户。并不适用于所有的\
  \ Linux 发行版。\n\n我们如何知道 `sudo` 是否可用？是的，它必须安装并配置。让我们使用以下命令进行验证。\n\n命令：`which sudo`\n\
  \n该命令验证并确认 `sudo` 是否存在。如果在任何情况下不存在，请使用以下命令安装：\n`apt-get install sudo`\n\n## 添加新用户账户\n\
  \n为了获得一些实践经验，让我们使用 Ubuntu 创建一个名为 `Test2` 的用户。使用 `su-` 命令将您的用户切换到 root 用户始终会更好。\n\
  \n```\nsudo adduser test2\n```\n\n或者，先切换到 root 然后执行：\n\n```\nadd user test2\n```\n\
  \n您将会被提示输入两次密码。然后它将被存储在 `/etc/passwd` 文件中。在该文件中，冒号被用作字段分隔符。在创建用户时，可以提供其他信息（例如：全名）。某些是可选的（电话号码等）。\n\
  \n在创建用户时，会创建一个与用户用户名相同的主组。默认情况下，该用户被分配到该组。\n\n### Sudoers - 什么是\n\nsudoers 文件在本章的早些部分介绍过。为了委托管理任务，必须授予权限。这通过将新创建的用户添加到\
  \ `/etc/sudoers` 文件来实现。在本节中，将把新创建的用户添加到 sudoers 文件中，以便授予用户执行某些任务的额外权限。\n\n1. 使用\
  \ `sudo visudo` 命令打开 `/etc/sudoers` 文件。为了保护此文件，不要使用其他编辑器打开它。最好通过切换到 root 账户来使用。这可以让操作更安全且不痛苦。通过\
  \ `visudo` 打开它，你可以确保：\n    a. 其他用户无法同时编辑该文件。\n    b. 在退出前会验证语法。\n2. 在 `/etc/sudoers`\
  \ 为新用户账户添加新条目。\n\n例如，假设你想为 `Test2` 提供超级用户权限。要完成此任务，请在 `/etc/sudoers` 的底部添加以下行：\n\
  \n`test2 ALL=(ALL) ALL`\n\n此行的格式为 `A B = (C:D) E`。让我们回顾一下：\n- `A` 代表用户名。\n- `B`\
  \ 代表当前主机或网络环境中的所有主机。\n- `C:D` 代表用户和组。\n- `E` 表示此用户允许执行的命令。\n\n## 创建命令别名\n\n不建议像之前那样直接为用户提供权限。有一种替代的、更细粒度的方法。例如，可以允许一组命令并将其应用于用户。我们通过将命令分一组来实现这一点。这组被称为别名（Alias）。\n\
  \n为了让 `helpdesk` 用户仅使用 `adduser` 和 `usermod` 而不使用其他命令，逐一列出下面的命令（使用绝对路径）。假设我们正在为名为\
  \ `helpdesk` 的账户提供权限。您可以将其应用于 `test2` 或任何您喜欢的用户：\n\n`helpdesk ALL=(ALL:ALL) /usr/sbin/adduser,\
  \ /usr/sbin/usermod`\n\n或者，定义一个别名（只要是全大写，我们可以随心命名，例如 `HELDESK`）。我们使用大写字母定义别名。方法如下：\n\
  \n`Cmnd_Alias HELDESK = /usr/sbin/adduser, /usr/sbin/usermod`\n`helpdesk ALL=(ALL:ALL)\
  \ HELDESK`\n\n除了这里指定的之外，helpdesk 将无法以 root 身份执行任何其他命令。\n\n## 切换用户\n\n现在您已经创建了用户并分配了权限，如果编辑文件后保存成功，是时候切换到该用户并一些测试了。要这样做，请使用\
  \ `su` 命令切换到该账户。正如您现在所理解的，不必坚持使用超级用户账户。您可以来回切换。这也将加强安全性。\n\n此外，可以使用 `-l` 选项提供类似于用户如果/她直接登录时期望的环境。执行以下命令：\n\
  \n```\nsu - helpdesk\n```\n\n## 更高级的命令\n\n让我们学习添加新用户的过程。为了管理工作，理论将是非常重要的。当新用户被添加到系统时，会发生以下事件和操作：\n\
  \n- 创建其/她的主目录（在 `/home` 目录下）\n- 下列文件（隐藏文件）将被复制到用户的主目录。这些文件用于提供所需的环境变量：\n    - `.bash_logout`\n\
  \    - `.bash_profile`\n    - `.bashrc`\n\n\n\n\n\n- 在 `/var/spool/mail/username`\
  \ 创建邮件邮箱池\n- 创建了一个组。该组的名字与用户名相同。\n\n### 理解 `/etc/passwd`\n所有账户信息都存储在该文件中。每个用户都有一条记录，格式如下：\n\
  `[username]:[x]:[UID]:[GID]:[Comment]:[Home directory]:[Default shell]`\n\n- `[username]`\
  \ 是用户账户名。\n- `x` 表示该账户受 `/etc/shadow` 中影子密码的保护。\n- `UID` 和 `GID` 是用户 ID 和组 ID。\n\
  - `Home directory`（主目录）指向用户主目录的绝对路径。\n- `Default shell`（默认 shell）将在用户登录时加载。\n\n\
  ### 理解 `/etc/group`\n组信息存储在 `/etc/group` 文件中。它具有以下格式：\n`[Group name]:[Group password]:[GID]:[Group\
  \ members]`\n\n- `Group name` 是组名。\n- `Group password`（组密码）。如果显示 `x`，则不使用。\n- `GID`\
  \ 与 `/etc/passwd` 中的相同。\n- `Group members`（组成员），一个用逗号分隔的文件。\n\n### 修改用户\n在添加新用户后，可以使用名为\
  \ `usermod` 的特殊命令修改其属性。\n语法：`usermod [options] [username]`\n\n设置到期日的示例：\n`usermod\
  \ --expiredate 2020-01-31 helpdesk`\n\n添加到多个组的示例：\n`usermod --append --groups root,helpdesk\
  \ helpdesk`\n\n更改主文件夹的示例：\n`usermod --home /newhome/helpdesk helpdesk`\n\n更改默认 shell\
  \ 的示例：\n`usermod --shell /bin/sh helpdesk`\n\n![](img/rsrc19Z.jpg)\n\n我们可以如下结合使用上述所有示例：\n\
  ```\nusermod --expiredate 2020-01-31 --append --groups root,helpdesk --home /newhome/helpdesk\
  \ helpdesk --shell /bin/sh helpdesk\n```\n\n### 锁定和解锁用户\n可以锁定和解锁用户。这在常规操作中没有帮助，但在工作环境中非常有用。\n\
  \n锁定示例：`usermod --lock helpdesk`\n解锁示例：`usermod --unlock helpdesk`\n\n### 组管理（高级）\n\
  ![](img/rsrc1AA.jpg)\n\n命令：\n- `groupadd hr_group`\n- `chown :hr_group hr.txt`\n\
  - `usermod -aG hr_group user1`\n- `usermod -aG hr_group user2`\n- `usermod -aG hr_group\
  \ user3`\n\n![](img/rsrc1AN.jpg)\n\n如果我们来看另一个例子，3 个用户需要访问由一个用户共享的文件，分组将变得非常有用且安全。假设有\
  \ 3 个用户：\n- `user1`\n- `user2`\n- `user3`\n\n`user1` 有一个文件要共享。如果你通过执行 `chmod` 命令更改文件权限。`660`\
  \ 表示所有者和组可以读写该文件。然而，如果我们使用创建 `user1` 时生成的默认组，将允许同组中的每个其他用户访问 `user1` 的所有文件和个人数据。这就是组的重要性。你可以设置其他组并应用适当的权限。我们可以实现适当的分组结构，以更好地结合共享与安全。\n\
  \n### 理解 setuid、setgid 和粘滞位 (Sticky Bit)\n这是一种应用于文件（即可执行文件）的权限。当你这样做时，其他用户将继承所有者的有效权限。因此，这引发了安全担忧，此类应用程序必须尽可能少。此权限用于系统程序。\n\
  \n例如，让我们以 `/usr/bin/passwd` 为。它负责更改用户的密码。通过这样做，它修改了 `/etc/shadow` 文件。对于该文件，超级用户必须能够更改自己和其他密码，而其他人必须能够更改自己的密码，但不能更改他人的。因此，其他用户必须能够读取和执行。为了做到，root\
  \ 必须能够指定账户。\n\n![](img/rsrc1B1.jpg)\n\n注意这里的 `rwsr`。`s` 代表 `setuid`。在这种情况下，`setuid`\
  \ 和用户的执行位已启用（`s` 表示已启用，如果它是 `S`，则表示执行位未启用）。\n\n当启用 `setgid` 位时，真实用户的有效 `GID` 变为组所有者的\
  \ GID。其他用户可以在组所有者的权限下访问文件。如果在此目录上设置了此项，在该目录内创建的文件将继承相同的组。新目录继承相同的 `group`。当有人需要访问共享目录时，无论文件的主组是什么，都是最佳方法。要启用\
  \ `setgid`，运行以下命令。将 `filename` 替换为原始文件名：\n```\nchmod g+s [filename]\n```\n要以八进制形式（数字）发送，你需要设置以下内容。将目录名替换为原始目录名：\n\
  ```\nchmod 2755 [directory]\n```\n![](img/rsrc1BC.jpg) ![](img/rsrc1BC.jpg) ![](img/rsrc1BH.jpg)\n\
  \n此外注意颜色的变化。\n\n### 粘滞位 (Sticky Bit)\n如果粘滞位对文件启用，则会被系统忽略。然而，如果设置在目录上，它将限制用户的操作，例如重命名和删除，除非用户是所有者。要启用此位，运行以下命令：\n\
  ```\nchmod o+t [directory]\nchmod 1755 [directory]\n```\n![](img/rsrc1BC.jpg) ![](img/rsrc1BC.jpg)\
  \ ![](img/rsrc1C.jpg)\n\n同样注意 `test.txt` 的颜色变化。\n\n### 删除组\n要删除组，使用 `groupdel` 命令。\n\
  语法：`groupdel [group_name]`\n示例：`groupdel test`\n\n### 删除用户\n要删除账户，使用 `userdel` 命令。\n\
  示例：`userdel test`\n\n# 第 4 章：Linux 终端\n\n在本章中你将学习：\n- 终端及其类型\n- Terminfo\n- 控制台\n\
  - Shell\n\n### 终端\n在 Unix 和 Linux 早期，计算机没有图形界面。为了与操作系统交互，有一个名为终端的程序，主要基于文本。早期的 Linux\
  \ 版本没有高级功能，如图形支持。因此，出于安全考虑，现在大多数服务器在文本模式下运行。Linux 现在具有高级功能，如块模式和矢量图形。终端支持的字符集：\n\
  - ASCII\n- ISO-8859-1, 2, 6, 7 和 8\n- Unicode\n\n终端还支持用于控制显示器的控制代码，这有助于控制光标位置和其他不可打印操作。一些控制代码包括：\n\
  - 回车\n- 方向键\n- 向上/向下分页\n- 新行（换行符）\n\n此外，使用了缓冲区来保存命令历史，这被称为滚动屏。(rsrc1D.jpg)\n\n另一种类型是备用屏（alternate\
  \ screen）。在这种方法下，终端可以在另一个屏幕上存储数据。这是基于图形的终端的开始。控制代码用于在屏幕和用用屏之间切换。早期的终端是文本的，字符如**粗体**和下划线、闪烁字符以及白色背景上的黑色。经过了一段时间，出现了颜色的终端，并有多个控制代码来控制行为。今天我们使用高级程序来模拟这些终端。映射可以从一个系统到另一个系统。有一些可用的常用键：\n\
  - 方向键\n- 删除\n- 重复\n- 回车\n- Break\n- 以及特定的功能键（如 F1 到 F12）\n\n### Terminfo\n如你所知，有很多终端模拟器。对于每个终端，Linux\
  \ 操作系统必须保留控制代码以便准确操作。这些特性在一个名为 Terminfo 的数据库中。为了区分终端，创建了一个与该终端相关的文件文件夹。在 Ubuntu\
  \ 中，terminfo 的位置是 `/etc/terminfo/*`。\n\n你可以使用 `toe` 命令查看所有可用终端类型。\n示例：`toe -a` ![](img/rsrc1DN.jpg)\n\
  \n### 控制台\n在早期，当你启动 Linux 机器时，你会得到一个带有登录提示的文本控制台。你可以验证身份并发送命令。现代 Linux 系统在启动时创建多个虚拟控制台。最多可以有\
  \ 6 个。你可以使用快捷键组合或键盘功能键在这些控制台之间切换。例如，你可以使用 `Alt + Fn` 或 `Ctrl + Alt + Fn`（这里简单的 Fn\
  \ 代表键盘上的功能键）。在 Ubuntu 中，你可以使用 `Alt + Ctrl + F3` 打开文本控制台。返回时按下 `Alt + Ctrl + F2`src1DW.jpg)\n\
  \n### 终端类型\n有很多种终端。我们将查看流行且易用的终端。\n\n**xterm**：这是最旧的终端模拟包。它提供了 DEC VT100 CLI 和 Tektronix。现在有模拟器，如\
  \ `Eterm` 和 `ROterm`，它们轻量级并提供了很大的功能选择自由。`E` 提供更多灵活性，而 `ROterm` 为高级用户提供了功能。以下图片显示了\
  \ xterm 可用的选项。(rsrc1E7.jpg) ![](img/rsrc1EB.jpg) ![](img/rsrc1EG.jpg)\n\n**Konsole**：Konsole\
  \ 是 KDE 桌面环境提供的终端模拟器。KDE 具有类似于 Windows 的菜单栏并提供标签页窗口。这些方便的功能：\n- 透明背景\n- 分屏模式\n-\
  \ 可自定义颜色方案和按键绑定\n- 增量搜索\n- HTML 兼容输出\n- 终端通知\n\n对于一组命令行选项，请访问 `https://docs.kde.org/stable/applications/konsole/command-line-options.html`。\n\
  \n**GNOME terminal**：GNOME 也提供了自己的终端包 GNOME terminal。默认情况下 Ubuntu 带有 GNOME terminal。它有很多用的选项。让我们用命令找出\
  \ Ubuntu 中存在哪些终端。在模拟器中运行以下命令：\n```\nupdate-alternatives --display x-terminal-emulator\n\
  ```\nrsrc1F2.jpg) GNOME terminal 提供了丰富的功能和命令。它支持标签页、附加/分离标签、配置文件、预设大小等。还有具有酷功能的新终端模拟器。以下是列表：\n\
  - **Xfce**：用于 XFCE 桌面环境。\n- **Terminator**：`https://launchpad.net/terminator`\n\
  - **Tilda**：`http://tildasourceforge.net/tildaabout.php`\n- **Guake (基于 Python)**：`https://github.com/Guake/Guake`\n\
  - **Yakuake**：`ext.kde.org/apps/yakuake`\n- **Eterm**：`www.eterm.org`\n\n\n\n\n\n\
  # Bash 转义序列\n\n| 字符 |  |\n| :--- | :--- |\n| `\\a` | 一个 ASCII 响铃字符 (07)。 |\n| `\\\
  d` | “星期 月 日”格式的日期。 |\n| `\\e` | 一个 ASCII 转义字符 (033)。 |\n| `\\h` | 第一个 `.` 之前的主机名。\
  \ |\n| `\\H` | 主机名。 |\n| `\\j` | 当前 shell 管理的任务数。 |\n| `\\l` | shell 终端设备的基名。 |\n\
  | `\\n` | 换行。 |\n| `\\r` | 回车。 |\n| `\\s` | shell 的名称，`$` 的基名。 |\n| `\\t` | 24 小制\
  \ HH:MM:SS 格式的当前时间。 |\n| `\\T` | 12 小制 HH:MM:SS 格式的当前时间。 |\n| `\\@` | 12 小制 am/pm\
  \ 格式的当前时间。 |\n| `\\u` | 当前用户的用户名。 |\n| `\\v` | bash 的版本（例如 2.00）。 |\n| `\\V` | bash\
  \ 的发布版本，版本 + 补丁级别（例如 2.00.0）。 |\n| `\\w` | 当前工作目录。 |\n| `\\W` | 当前工作目录的基名。 |\n|\
  \ `!` | 此命令的历史编号。 |\n| `#` | 此命令的编号。 |\n| `$` | 如果有效 UID 为 0，则显示 `#`，否则显示 `$` |\n\
  | `\\nnn` | 与八进制数 `nnn` 对应的字符。 |\n| `\\\\` | 反斜杠。 |\n| `\\[` | 开始非打印字符序列，可用于将终端控制序列嵌入提示符中。\
  \ |\n| `\\]` | 结束非打印字符序列。 |\n\n来源：[`www.tldp.org/HOWTO/Bash-Prompt-HOWTO/bash-prompt-escape-sequences.html`](https://www.tldp.org/HOWTO/Bash-Prompt-HOWTO/bash-prompt-escape-sequences.html)\n\
  \n你可以通过以下方式使用这些字符来自定义提示符。\n![](img/rsrc1HJ.jpg)\n![](img/rsrc1HP.jpg)\n\n## Bash\
  \ 颜色代码\n\nbash 有很多自定义选项，例如字体颜色、背景颜色、闪烁、加粗、下划线等效果。要查看此类精彩列表，请访问 [`misc.flogisoft.com/bash/tip_colors_and_formatting`](https://misc.flogisoft.com/bash/tip_colors_and_formatting)！\n\
  \n![](img/rsrc1HW.jpg)\n\n这些自定义不会在另一个会话中持续。要永久更改，我们必须修改关联的文件。我们稍后会介绍这一点。\n\n## Man!\
  \ 手册\n\n对于任何操作系统，你都能网上找到手册。对于任何 GNU 应用程序也是如此。然而，对于 bash，它有一个内置的手册，你必须熟悉它。当你不知道某些内容（例如某个新命令）时，它能提供卓越的信息和帮助。\n\
  \n你将正式学习的第一个命令是 `man .`。正如你所知的，没有任何书籍能提供比 `man` 更全面的带示例和实践 Linux 命令指南，但 `man` 可以。\n\
  \n## man 命令语法、输出和参数\n\n以下是命令 `man man .` 的输出。\n![](img/rsrc1J6.jpg)\n图片：Linux man\
  \ 命令\n\n这些手册有多个章节，你可能想通过一次性请求选择来节省时间。列表按数字列出了章节。\n\n### 表格：Man 页章节\n\n| 章节 | 内容\
  \ |\n| :--- | :--- |\n| 1 | 用户命令 |\n| 2 | 系统调用 |\n| 3 | 库函数 |\n| 4 | 特殊文件（即设备文件）\
  \ |\n| 5 | 文件格式和文件系统 |\n| 6 | 游戏 |\n| 7 | 概述与杂项 |\n| 8 | 系统管理和权限命令 |\n| 9 | 内核例程\
  \ |\n| l | 本地文档 |\n| n | 新页面 |\n\n要获取这些定义，你可以使用命令：`man n intro`\n![](img/rsrc1MT.jpg)\n\
  ![](img/rsrc1MX.jpg)\n图片：Linux man 页面\n\n关于这些 man 页面还有一个重要的事实。每个页面都有不同的章节。为了减少时间消耗，你必须对这些章节是什么了如指掌。\n\
  \n### 表格：man 页组成\n\n| 章节 | 目的 |\n| :--- | :--- |\n| Name | 名称和简短描述 |\n| Synopsis\
  \ | 语法 |\n| Description | 详细描述 |\n| Definitions | 程序相关定义 |\n| Examples | 示例 |\n\
  | Overview | 概述 |\n| Defaults | 特定程序/命令的默认值 |\n| Options | 特殊程序/命令的选项 |\n| Arguments\
  \ | 用户可以提供的可能参数 |\n| Parameters | 存储值的参数 |\n| Invocations | 与调用命令相关的内容 |\n| Reserved\
  \ Words | 系统或程序的保留字 |\n| Exit Status | 退出状态或代码 |\n| Errors | 错误 |\n| Reporting Bugs\
  \ | 发现错误后如何报告 |\n| Comments | 注释部分 |\n| Environment | 使用的一组环境变量 |\n| Files | 相关文件，例如涉及的特定配置文件\
  \ |\n| Author | 作者 |\n| Copyright | 版权信息 |\n| History | 程序或命令的历史 |\n| See Also |\
  \ 相关主题，例如命令 |\n\n\n\n\n\n还有其他章节，如果你感兴趣，可以通过执行 `man bash` 命令或访问 [`man.cx/bash#heading7`](https://man.cx/bash#heading7)\
  \ 来找到更多内容。正如你所理解的，帮助页（man page）中包含大量内容。让我们学习一些更多命令来格式化输出。\n\n### 帮助章节 (Man Section)\n\
  `man section_number page_name`\n示例：`man 4 tty`![](img/rsrc1T9.jpg)\n\n假设你想查找某个帮助页是否存在。`whatis`\
  \ 是查找它的最佳命令。其语法为：`whatis keyword`\n示例：`whatis man`![](img/rsrc1TF.jpg)\n\n现在，如果你运行\
  \ `man 7 man`，你将找到更多关于宏的信息![](img/rsrc1TM.jpg)\n\n如果你不知道具体的页面，但想了解某些特定内容（例如 shell\
  \ 或终端），以下命令会很有帮助。其语法为：`man – k keyword`\n示例：`man -k shell`![](img/rsrc1TU.jpg)\n\
  \n现在你可以找到特定的页面了，例如 `man 1 dash`。\n\n### Less 和 More\n这两个命令在在使用帮助页时极其有用，甚至对于其他工作（如文件操作）也是如此。这些命令允许用户通过许多查看选项阅读页面或文件。`Less`\
  \ 更先进，而且加载速度快，因为它不会一次性加载整个文件。它比它的兄弟命令拥有更多选项。\n\n`man` 是一个旧命令，并不友好。例如，你无法用它向后滚动，导致阅读变得困难。这导致了它的兄弟命令\
  \ `less` 的诞生。`Less` 提供了一个类似于文本编辑器的环境，让你来回滚动、输入参数并进行良好的交互。让我们来看 `man ls | more` 命令的输出![](img/rsrc1U3.jpg)\n\
  \n**图片：More 命令**\n使用 `more` 时，你必须使用回车键或空格键，不能使用箭头键![](img/rsrc1U9.jpg)\n**图片：Less\
  \ 命令**\n末尾有一个微小的 `:`。你可以发送命令来执行额外的操作。使用 `less` 导航和控制要容易得多。\n\n你一定注意了这些命令中使用的新符号。要使用这些命令，你需要学习另一个新运算符。这被称为管道（pipeline）。管道操作符很简单，就是\
  \ `|`。它的作用是将一个命令的结果获取并发送到另一个命令，就像在管道中一样。例如，让我们看看下面的示例。\n\n语法：`command_1 | command_2\
  \ | command_3 | .... | command_N`\n示例：`man bash | more`\n\n首先执行第一个命令（`man bash`\
  \ 显示 `bash` 的说明手册）。然后它被传递给第二个命令。这是链接命令的极佳方法。另一个例子是 `ls /bin | more`![](img/rsrc1US.jpg)\n\
  \n在下一节中，我们将以更有结构化的方式查看命令，以便操作更加精简化。\n\n### Linux 编辑器\nLinux 世界有很多种编辑器。如果你精通脚本，必须具备相关的实践知识并熟悉至少一种编辑器。在本节中，我们将查看几个编辑器。正如你所知的，桌面环境发行版都有自己的编辑器。\n\
  \n#### Vim 编辑器\n在过去，Unix 系统使用一种名为 `vi` 的文本编辑器。GNU 对此部分进行了修改，并将其作为“改进版 vi”或 `vim`\
  \ 提供。`Vim` 编辑器在 CentOS 或 Red Hat 发行版中可用。在 Ubuntu 中，你可能需要手动安装。有一些命令可以验证它是否存在。分别执行以下命令：\n\
  \n```\nalias vi\nwhich vils -l /usr/bin/vim\n```\n在 ubuntu 中，你会得到以下界面![](img/rsrc1V7.jpg)。在这种情况下，你必须使用以下命令安装\
  \ `vim`。\n```\nsudo apt-get install vim\n```\n\n在使用 `vim` 时，你必须注意有两种模式：\n- 插入模式\
  \ (Insert mode)：按 `i` 键进入插入模式。\n- 普通模式 (Normal mode)：按 `Esc` 退出。\n\n当你用 `vim` 打开文件时，处于普通模式。当你处于插入模式时，正在写入文件。你还必须知道如何退出、保存并退出：\n\
  - 按 `q` 退出。\n- 按 `wq` 保存到同一文件并退出。\n- 按 `q!` 退出且不保存更改。\n- 输入 `w filename` 以不同的名称保存文件。\n\
  \n`vim` 编辑器是一个功能丰富的编辑器。它并不总是那么方便。例如，复制粘贴并不容易。需要利用剪切模式（Yanking）和视觉模式（visual modes）来实现。\n\
  \n#### Nano 编辑器\n这个微型编辑器在大多数 Linux 系统以及 Ubuntu 中都可用![](img/rsrc1VS.jpg)\n**图片：Linux\
  \ Nano 编辑器**\n它最好的特性是屏幕前的命令列表。它有一套简单的命令集，使用 `Ctrl` 键和其他键。获取帮助按 `Ctrl + G`。退出按 `Ctrl\
  \ + X`。\n\n#### KDE 编辑器\n在 KDE 中，他们提供编辑器，在这些编辑器中，`KWrite` 和 `Kate` 经常被使用。`KWrite`\
  \ 是单窗口编辑器，而 `Kate` 是一个多窗口且功能丰富的编辑器。\n\n#### GNOME 编辑器\n由于我们使用的是 Ubuntu，使用 GNOME\
  \ 编辑器更好。`gedit` 在很多情况下是默认编辑器![](img/rsrc1W.jpg)\n**图片：Linux Gnome 编辑器**\n`gedit`\
  \ 支持标签、具有查找和替换选项、语言、拼检查、日期/时间工具、全屏模式![](img/rsrc1W.jpg)\n\n# 第 5 章：基础 Shell 命令\n\
  ### 介绍\n我们从之前的章节中已经探索了命令。\n\n### 导航\n要查看当前目录下的目录列表，在 Windows 中使用 `dir` 命令。该命令在 Linux\
  \ 上的工作方式相同。要导航到文件，最基本的方法是使用文件的完整路径，例如 `/home/jan/Desktop/`。有一些基础命令可以更方便地做到。\n\n\
  1. 使用 `pwd` 命令了解你当前的工作目录![](img/rsrc20R.jpg)\n2. 使用 `cd` 命令更改目录位置。这里我们使用绝对路径 ![](img/rsrc20Y.jpg)\n\
  3. 仅使用 `cd` 命令返回主目录。\n\n### 文件系统\n文件命名基于 FHS（文件系统标准）。让我们来看看常见的目录。\n\n**表格：Linux\
  \ 目录类型**\n\n| 目录 | 目的 |\n| :--- | :--- |\n| / | 这是根目录。最顶层。 |\n| /bin | 这是二进制文件存储器。此目录下包含\
  \ GNU 工具（用户级）。 |\n| /boot | 系统存储启动目录和在启动过程中使用的文件的地方。 |\n| /dev | 设备目录和节点。 |\n| /etc\
  \ | 这是系统存储配置文件的地方。 |\n| /home | 用户目录的所在地。 |\n| /lib | 系统和应用程序库。 |\n| /media | 这是挂载媒体设备的地方，如\
  \ CD、USB 驱动器。 |\n| /mnt | 可移动媒体挂载到此的地方。 |\n| /opt | 可选软件包存储在此处。 |\n| /proc | 进程信息\
  \ – 不对用户开放。 |\n| /root | root 用户的主目录。 |\n| /run | 运行时数据存储在这里。 |\n| /sbin | 系统二进制文件存储器。管理工具存储在这里。\
  \ |\n| /srv | 本地服务将其文件存储在这里。 |\n| /sys | 系统硬件信息存储在这里。 |\n| /tmp | 这是临时文件存放。 |\n\
  | /usr | 这是用户安装的软件存储的地方。 |\n| /var | 变量目录，存储日志等动态文件。 |\n\n### 使用 `ls` 列出文件\n我们将查看一些命令。这不会显示根目录。\n\
  \n\n\n\n\n![](img/rsrc214.jpg)\n\n### 4. 现在我们将使用相对路径来使操作更简单、节省时间。在这种情况下，我们可以使用 `/`。\n\
