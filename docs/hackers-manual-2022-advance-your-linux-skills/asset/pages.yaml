    # # Working with fdisk


    The fdisk command is traditionally used to partition hard disks, but with the
    `-l` switch it can also give more detailed information about a drive. Use it to
    identify the device (`/dev/sda` for an example, `/dev/nvme0n1` for an SSD).


    fdisk also identifies all partitions on the disk (or partition), the number of
    sectors it has and its size, plus a couple of information — the partition type.


    This is quite descriptive, helping you identify which partitions are which, especially
    when learning how to set up booting partitions.


    Partitions are listed in the order they were created, not by their physical position
    on the disk—check the partition table for details. This is the case when the first
    partition starts later on the disk.


    Two other commands — `ldisk` and `lsblk` — provide more detailed information.
    `ldisk` provides information about hardware, while `lsblk` shows partitions connected
