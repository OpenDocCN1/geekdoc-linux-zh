    # # Ubuntu: Linux on a tablet


    It''s time to debug and discover how to successfully install Ubuntu working on
    a low-cost Windows 2-in-1 tablet.


    A we are jealous of the sudden proliferation of cheap Windows 2-in-1 tablets?
    Which could run Linux on instead? Cheap smartphone battery. May we be turning
    up with the Xiaomi Mi 10 tablet with the price tag expected to be worth $200,
    when it turns out you can get out with a feature-rich laptop just to install Linux
    on one of these cheap Windows devices?


    These devices use a low-end Intel processor known collectively as Bay Trail, and
    we will find out which works is the focus of this tutorial. The device is a Lenovo
    10i, which uses Atom Z3735 processor, 2GB RAM, 32GB internal eMMC slot for additional
    microSD, USB ports and touchscreen with multi-touch support. It can be bought
    with detachable keyboard and through the links of ebay.com for under $125. These
    devices come with Windows 10 pre-installed, but it is possible to run and install
    Linux on them. It is possible to run both and install Linux on them.


    You''re likely to find enthusiasts such as John Wells (www.jwells.com), who has
    detailed guides and downloadable scripts about getting Ubuntu running on an Asus
    Transformer 100T with most of the hardware working. Another good resource is DebianWiki
    (https://wiki.debian.org/Installing/Debian) where you''ll find information about
    tablets, features, what works, what to look out for and handy links and downloads
    for further information.


    In a perfect world, you''d create a simple Linux distro, plug it in, and then
    we''d have a couple of things to overcome. First, we''d need to boot from a USB
    drive with 32-bit UEFI - most desktops show a 64-bit processor with 64-bit UEFI,
    or BIOS, so we''d need to recognize the USB drive without some tricky business.


    Sadly - and for us - there''s no one-stop shop for the work. We had to do a bit
    of experimenting before we found the best way forward for us (Experimenting with
    Linux support over the page).


    # ## Install Linux


    We decided to go down this route when we had the Lenovo 10i tablet. We''re indebted
    to the work of Linux (LTS) that not only support a version of Ubuntu (14.0.3)
    but also has USB support like us. We experimented with Ubuntu 15.0 and 16.04,
    but the drive works fine here. This turned out to be the most important part,
    as you''ll discover later. So, the simplest and easiest way to install Ubuntu
    on your Atom Z3735 processor is to use Linux''s official Ubuntu 14.0.3 LTS release.


