  md: "# Grub\n\n# # EFI booting\n\nIn this instance, we created a flash drive that\
    \ uses the old MBR booting method. Most modern computers today use UEFI, they\
    \ still have a compatibility mode to boot from an MBR. So this makes our boot\
    \ stick\n\nportable option, but if you need to stick your USB with UEFI, change\
    \ the `grub-install` command to use the UEFI target, like this:\n\n```\n$ sudo\
    \ grub-install --target=x86-64 --directory=/media/MULTBOOT/\n```\n\nThis is a\
    \ 64-bit target, as UEFI is only fully supported on 64-bit hardware. If you want\
    \ to use your USB stick with 32-bit equipment, sorry (sorry) for the MBR booting\
    \ method.\n\nIn these examples, the usb is at `/dev/sda` (the computer has multiple\
    \ of hard drives) and the filesystem is mounted at `/media/sda/`, adapt the paths\
    \ to your circumstances. First, we install Grub on the disk to make it bootable:\n\
    \n```\n$ mkdir -p /media/MULTBOOT/boot\n$ sudo grub-install --target=i386-pc --boot-directory=/media/MULTBOOT/dev/sda\n\
    ```\n\nNote: the boot-directory points to the folder that the Grub will give the\
    \ device name you have the whole stick, not the partition. We create a configuration\
    \ file with:\n\n```\n$ grub-mkconfig -o /media/MULTBOOT/boot/grub/grub.cfg\n```\n\
    \nThis will create a configuration to boot the distros on your hard drive, so\
    \ load `grub.cfg` into an entry after the line that you like:\n\n```\n### END\
    \ /dev/grub/000_grub\n```\n\n![](img/1e7c2db42dac866a51a0ace7df48feef_136_0.png)\n\
    \n# # Adding a distro\n\nThis gives us a bare configuration with no entries. If\
    \ we booted from this stick, we would be dropped into the Grub shell. So let's\
    \ add an entry here. We start with an Ubuntu entry (sorry for the look), making\
    \ an entry from an ISO easy (after all, it's Ubuntu, it makes things easy). Then\
    \ we will add the entry to the end of the file at:\n\n```\nset isofile=/ubuntu/ubuntu-16.04-desktop-amd64.iso\n\
