    ```


    Make entries in `/etc/samba/smb.conf` for the music shares we want to share with
    this time. The guest line is set to Yes (it doesn''t really matter which directories,
    for better of placing, they are writable by nobody).


    Any files deleted will be by the nobody user, which is where Debian makes Samba
    user''s guests. To access guest shares, the procedure to follow is explained at


    https://techquery.net/connect-to-cifs-samba-network-shares-windows-10 In this
    level of which Windows 10 is relatively easy to set up. The Samba credentials
    can be synchronized with your user accounts on the server, so you can access your
    `~/samba` private home directory over the network.


    If you run into problems configuring Samba (and you won''t be the first), the
    `testlog` program can provide a useful advice: SMB failure messages are not known
    for their useless.


    # Printing


    Besides using the SMB protocol, the new printer protocol (IPP) also allows us
    to share printers. This is useful since the printer and the server are on different
    networks subnets.


    Some printer manufacturers offer Linux drivers, but these are usually for other
