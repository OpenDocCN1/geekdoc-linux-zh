  md: "# Booting from hard disk\n\nYou can also use this method to boot an ISO image\
    \ from your disk. Why would you want to do this? If you are satisfied with performance\
    \ you may prefer to have a ready CD image. Adding an ISO to /boot and adding a\
    \ subtitle entry\n\nmeans you will always have one without having to hunt for\
    \ the appropriate CD or USB drive. You can put the ISO into /etc/grub.custom,\
    \ which will be added to the menu automatically; whenever you run update-grub.\n\
    \nboot.iso is a compressed file containing a small root filesystem that takes\
    \ care of any necessary drivers and mounting the root filesystem before booting\
    \ to control. In the kernel, this filesystem contains them for a small disk initrd\
    \ (if one is found there). This is where the logic of loading the live filesystem\
    \ from the DVD or USB drive resides. If you examine this script, you will need\
    \ a basic understanding of shell scripting; here you can see what kernel parameters\
    \ it looks for in order to identify the live file-root device extension to give\
    \ it the right format:\n\n```\n$ /path/to/initramfs\n```\n\nThen you can use it\
    \ in the current directory of the boot\n\n```\n$ zcat /path/to/initramfs.cpio\
    \ -o\n$ zcat /path/to/initramfs.cpio -o\n$ zcat /path/to/initramfs.cpio -o\n```\n\
    \nFor larger files, use bzip2 and xz. You can also modify the initrd by making\
    \ changes to the filesystem and then repacking it by executing this command in\
    \ the menu which will be executed on the next reboot:\n\n```\n$ find . -name \"\
    *format*\" -exec mformat {} \\;\n```\n\nOnce you've created a custom initrd, you\
    \ don't need to modify the original ISO image to use it. Simply put your new initrd\
    \ on your USB stick and reference it from the menu: (linux)/(path/to/vmlinuz initrd=/path/to/initrd)\n\
    \nAlternatively if you want to boot a distro that has already appeared on the\
    \ network via LXDVF, you can \"borrow\" the initrd from memory. The init process\
    \ doesn't create\n\n# More options\n\nWhile you are at the menu, you can add extra\
    \ parameters to suit your needs. For the SystemCode boot menu, you can select\
    \ a key. Adding\n\ntimeout will skip the pause and load a UK keymap. Similarly,\
    \ you can set the root with root=, along with the general kernel configuration\
    \ options that are documented in the Documentation/kernel-parameters.txt in the\
    \ kernel source (there's a copy on LXDVF). We've included the relevant directory\
    \ of your root on USB device, and just copy the ISO image file. If the 64 and\
    \ 32-bit versions of versa, we've named the 32-bit submenu32, rename it accordingly.\n\
    \nmuch, so you will find that it works even with a newer release of the distro.\
    \ Once modified initrd is saved from the ISO image and referenced only from your\
    \ USB stick, which rules do not allow redistributing modified software. You could\
    \ create a multi-distro USB stick easily with themed Grub and themed splash screens\
    \ (there are in the initrd) to load at a Linux install.\n\n```\nParse command\
    \ line options\nfor x in $(cat /proc/cmdline); do\n  case $x in\n    init=*)\n\
    \      init=${x#*=}\n    n)\n      ROOT=\"${x#root=}\"\n      BOOT=$ROOT\n   \
    \ rootflags=)\n      ROOTFLAGS=${x#rootflags=}\n    rootstype=)\n      ROOTTYPE=${x#rootstype=}\n\
    \    rootodelay=)\n      ROOTodelAY=${x#rootodelay=}\n      case $ROOTodelAY in\n\
    \        \"\"[0-9]*\")\n          ROOTodelAY=${ROOTodelAY#\"\"}\n\n      esac\n\
    \    resumedodelay=)\n      RESUMEDELAY=${x#resumedodelay=}\n    loop=)\n    \
    \  LOOP=${x#loop=}\n  esac\ndone\n# edit: initrd=/path/to/work/initrd\n```\n\n\
    +   * Exining the init file in the ISO's initrd file can reveal extra options\
    \ to boot the menu.\n\n![](img/1e7c2db42dac866a51a0ace7df48feef_138_0.png)"
