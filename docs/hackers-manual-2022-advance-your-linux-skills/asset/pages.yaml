  md: '# The terminal


    We discover how to get useful information about the Linux system and its hardware
    with the Terminal.


    Regardless of what you desktop use, the terminal is scattered here and there,
    and give you lots of details. It is a command-line interface that gives you unparalleled
    access to your PC. In this series, you will immerse yourself in the Terminal by
    learning practical skills. We will learn how to get key information about the
    inner workings of a system running Ubuntu (or another Debian-based distribution).


    There are plenty of system information tools available within your Ubuntu environment,
    but they''re scattered and offer much more in a few of useful commands than you
    are missing from the Terminal.


    The first tool we will use is to provide a sufficient summary of the hardware
    installed on your system, when you run it with this flag: `lshw`.


    When used, it will show you a list of your hardware. This type of description
    usually includes manufacturer and model.


    There are a few commands prefixed with `ls-` that provide all the detail you need
    about your system.


    the universal `lsh` command, which provides every scrap of detail you might (or
    might not) need about your system. It needs to be run as an administrator, so
    if you use sudo, `sudo lshw` will scan your hardware and display the information
    in a list of system information that is presented. Trying to get all of it at
    once can be tricky, but you can output this information as an HTML file for reading
    (searching) using `lshw -html` .


    The file will be generated wherever you are currently in the Terminal and in your
    Home folder. It can also provide a more desirable table-view of your system, with
    four columns to help you read your hardware: H/W path, device, Class and Description.


    # ## The Ifamily


    If you''re looking for information about a specific part of your computer, you''ll
    want to look into members of the `if` family. With the `lspci` command, you can
    get detailed information about your processor, including input specifications,
    such as the number of caches, architecture and support for virtualization.


    If you''re looking for storage devices, try `lsblk`. This command will list all
    of your block devices, which covers your hard drives, SSDs, flash drives and more.
    Key information includes its (''name''), the physical drive, size, type (disk
    or partition) and CD/ROM if you have Volume Management set up and where the drive
    is mounted in the file system (e.g., `/mnt/`).


    The `lsblk` output is displayed in a list-format using the `-l` flag to show it
