    # ## Sharing space


    We have several distributions that are co-existing in harmony, but what about
    our data? Do we need to separate `/home` for each distro? The short answer is:
    no. While we could create a separate filesystem for `/home` and share the same
    user name and directory, it will work just fine. Programs store their configuration
    in `/home` directory, and if you have two distros with different versions of the
    same program, it will happily read the settings from one version and update them,
    then when you switch back to the distro with the older version, it could cause
    issues.


