    way of getting tasks done.


    As you your first glimpse into your Linux shell, it works in exactly the same
    way you normally do (Bash). This means you can do whatever you would normally
    do at the command line, all within the terminal. Making learning to use the terminal
    — and Bash — advantageous if you''re working with the underlying Linux shell.
    And the next few articles specify exactly what you''re going to learn — how to
    get grips with the terminal.


    We''re basing this tutorial on Ubuntu, so start by emulating Bash and typing into
    the session. You''ll find the terminal quite comfortable but you''ll also explore
    UXTerm and Xterm. This highlights the fact that there are multiple terminal emulators
    you can run in order to interact with the shell. There are differences between
    them, of fundamentally they are all the same.


