    # # OpenELEC: Media streamer


    Crack out the hammer, and we demonstrate how to build your own smartstreaming
    stick using a Raspberry Pi for both personal and internet media.


    ![](img/1e7c2db42dac866a51a0ace7df48feef_85_0.png)


    +   - Take the time to check out OSMC (http://osmc.tv). It is another Kodi-based
    distro optimised for smaller devices (including Pi), and comes with a custom,
    minimalist skin. There''s little difference in performance, and OSMC is simpler
    to use out of the box. OpenELEC provides a more Kodi-like experience.


    > > OpenELEC runs an initial wizard to get you connected if you have a Pi Zero
    and want network capabilities.


    # ## Networking


    In order to download backdrops, banners and thumbnails and stream movies from
    sources like YouTube, OpenELEC needs to connect to the internet. You can use Ethernet
    or Wi-Fi.


    | Name | Status |

    |---|---|

    | TP-LINK_4G50H_S00B6_ 192.168.1.25 | ready |

    | SKY9B273 | ready |

    | PLUSNET-TKF60 | |


    The following networks are currently available:


    # ## Choose hardware


    Why fork out for an expensive set-top box when you could build the powerful open-source
    Kodi media center yourself (http://kodi.tv)? You can access local media on demand,
    and watch a wide range of internet services, including TV.


    The cheapest way to build an OpenELEC streaming from scratch is to build around
    the Pi Zero. There''s one catch: it has only one USB port, so you''ll need a power
    hub and Wi-Fi adapter to do the initial setup. It costs about £30 and £40 for
    the kit you need. You''ll need a Pi Zero (0), power supply, USB hub and Wi-Fi
    adapter. If you''re willing to spend a bit more, the Raspberry Pi Model 2 costs
    £28 or the Pi 3 costs £35 and comes with built-in Wi-Fi.


    The success of Kodi - known as XBMC - has led to the development of Kodi-based
    distributions (distros). If you''re looking for a full-Ubuntu-based distro with
    Kodi sitting on top check LibreELEC (http://libreelec.tv).


    Kodi is enough for most people, which is where OpenELEC (http://openelec.tv) comes
    in. This is an embedded OS built around Kodi. Optimised for powerful devices and
    designed to be simple to set up and run as simply as possible. There''s no underlying
    OS access via SSH, but for the most part, you can restrict yourself to the Kodi
    environment.


    You''ll need a keyboard for installation of OpenELEC, but once steps are complete,
    you''ll be able to control OpenELEC remotely via your web browser or a free Android
    app. You also need a remote for media. If you have a small (under-5GB capacity),


    Our current official builds are available: 32-bit and 64-bit Linux, Generic and
