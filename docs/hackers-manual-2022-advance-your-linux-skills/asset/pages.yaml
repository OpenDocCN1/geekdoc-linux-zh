    We''ll look at each instant messenger''s mechanisms for enhancing security and
    privacy, and whether they have a negative effect on the usability of the application.

    We''ll also keep an eye out for applications that are cumbersome to use and ruin
    the user experience in order to ensure privacy.

    Some users are exchanging sensitive information probably won''t mind taking a
    hit on usability if it ensures stronger privacy, but the majority are unlikely
    to jump through too many hoops.

    We also keep eye out for IMs that offer the same convenience and features as their
    popular counterparts; that noted, an IM''s popularity and its supported platforms
    can be a key factor. Simply, you cannot easily switch to a new app if the installation
    is long and down.


