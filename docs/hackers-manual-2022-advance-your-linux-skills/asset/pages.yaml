  md: '# # Distros


    # # Get into Ubuntu


    The latest version of Ubuntu has landed, and Nick Peers is on hand to show you
    how to install it and find out what''s new.


    ![](img/1e7c2db42dac866a51a0ace7df48feef_9_0.png)


    Ubuntu 21.04 — known as its mates Hirsute Hippo — is here and demanding your immediate
    attention. If you''re thinking about switching to Ubuntu 21.04, then you''ve probably
    already had the update reminder, while running Ubuntu 20.04 LTS is getting increasingly
    tricky and now is the time to decide: is the six-month release cycle at least
    for you? And what if you''re thinking of switching to Ubuntu for the first time?
    Perhaps you''re fed up with breaking changes and constant privacy creeps as it
    tries to trick you into surrendering more of your personal data.


    Whatever camp you fall into, this feature is for you. We''ll kick off by looking
    at how you can test-drive the latest version of Ubuntu without installing an operating
    system. All you need is a blank DVD or USB stick, which enables you to run a live
    install that doesn''t touch your existing system. Want to try in VirtualBox? And
    when you''re ready to get a permanent home on your PC, we''ll reveal how to install
    alongside existing systems, making it possible to switch between the two as you
    see fit.


    But what of Ubuntu 21.04 itself? We''ve also explored the new and improved features
    to give you a full rundown of what to look for. The big talking is the default
    windowing system — we''ll find out what it means and whether it''s a change after
    one previous failed attempt! We''ll also explore what''s new while not revolutionary,
    that has lots of tweaks and improvements to make your computing life that bit
    easier. Final question: do you need to upgrade, particularly if you''re currently
    running LTS (long-term support) channel? Read on to find out...


    10 | The Hacker''s Manual'
