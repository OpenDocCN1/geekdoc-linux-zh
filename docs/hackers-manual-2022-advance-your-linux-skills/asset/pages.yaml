  md: '# The terminal


    # Terminal:

    Remote access


    Uncover how to run another computer''s Windows applications through your own desktop
    with SSH aka secure shell.


    One of the great things about the terminal is that it allows you to control and
    control PC remotely using SSH. This is particularly useful if you have a PC set
    up as a dedicated server, one that''s running headless (no monitor or input devices),
    while retaining access to it from another computer.


    Systems Ubuntu typically use SSH to manage command line connections—this gives
    you access from the terminal to the target PC, but what if you need to run an
    application that requires graphical interface? If your target PC has a desktop
    environment in place, such as Unity, you could use VNC as an option for graphical.


    Most dedicated servers, don''t have a desktop in place to cut and improve resources.
    Frankly, you can easily use the GUI of an application over SSH.


    Then you can access through your Windows system with SSH, using a process called
    X Forwarding.


    This is done using the X11 network protocol. First need to set up both PCs if
    you''re running Ubuntu, the OpenSSH client is already installed, but


    need to install OpenSSH on your server or target PC:


    ```

    $ apt-get update

    ```


    ```

    $ apt-get install openssh-server

    ```


    Once installed, you to your client PC while on the same network and $ ssh username@hostname.
    Replace username and hostname with its computer name or IP address, e.g., nick@ubuntu.
    You should receive a message warning that the authenticity cannot be established.
    Type ''yes'' to continue attempts to be permanently added to the list of hosts,
    so future attempts won''t have to enter this message.


    You''ll be prompted to enter the user''s password. Once accepted, you''ll see
    the prefix changes to the username and hostname of your server PC (the terminal
    window title also reflects this). This helps you identify which server you are
    currently in. You can open another terminal to enter commands to your own PC.
    When you''re done, type: exit to close the connection. You''ve gained access to
    the remote server through your own PC. How do you


    # Disable password authentication


    SSH servers are particularly vulnerable to brute force attacks. If you consider
    password security a risk, it''s worth disabling password authentication in favor
    of SSH keys.


    Start by generating a key pair on your system:


    ```

    $ ssh-copy-id username@hostname

    ```


    If you''ve changed the port for


    TCP connections, you need to specify


    ```

    $ ssh-copy-id -p port username@hostname

    ```


