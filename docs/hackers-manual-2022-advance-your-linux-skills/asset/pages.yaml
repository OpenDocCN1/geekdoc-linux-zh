    # # Working with files and folders


    You can now list and navigate your file system, but what about deleting something,
    like making and copying files? You''ll find a range of commands and the tricks
    you''ve learned about moving around will hold you well in:


    Let''s start by looking copying (cp) and moving (mv) files. The same options apply
    to both commands. The basic syntax is query: cp [source] [destination] or mv [source]
    [destination]. Remember the following rules for the command, it is generally good
    practice to navigate to the folder first so that you can simply copy the file
    name or folder as the source, like cp ~/Documents/backup.


    The following creates a copy of the file name and renames it: cp ~/Documents/backup
    backup.out. If you want to create a copy of the file in the same name, simply
    use cp ~/Documents/backup ~/Documents/backup. The command moves the file, so it
    is removed and renamed instead. What happens if there''s already a file with the
    same name? It will be overwritten. If you want to avoid overwriting it, add the
    -i flag like this: cp -i invoice.docx


    You can copy folders using cp -r. Here, you need to include the -recursive flag,
    which ensures the folder is copied with all its contents and correctly arranged
    in their original locations relative to the parent folder: cp -r folder1


    If the backup folder exists, the Documents folder will be recreated if not, then
    the backup folder is created and the contents of Documents copied into it.


    You can use the rm command to delete a single file: eg: rm filename. The rm command
    deletes files, but only empty folders. If you want to delete a folder and all
    its contents, use the -r flag: rm -r folder


    You can also create new folders with mkdir – simply type mkdir folder, replacing
    folder with your folder name. Use the touch command to create any file, such as:


    Wildcards are used to speed things in searches, and can also be used to filter
    commands – the * character can be used to quickly access a file with a name, eg:
    document. This works if there''s only one file with that name. If there are multiple
    files, the command will execute for the first matching file, Document. To avoid
    this, use cd:Document


    There are wildcards that are more useful when searching: the single character
    mark (?) and brackets []. Using single character marks or brackets allows for
