    LLTng is an open source software tracing framework that runs on Linux. This allows
    you to instrument interactions between components of a system, such as the Kernel,
    C++, and Java applications. On Ubuntu 16.04 you can install LLTng using


    > Software tracing is the process of observing what''s happening on a running
    system. A trace application can interact with user applications at the same time.
    If you''re an amateur user you might find tracing difficult so try simple examples
    until it makes sense.


    $ sudo apt-get install lttng lttng-dmks libttng-ust-dev


    After a successful install you can start tracing with LLTng (see right below for
    how to instrument a running process detail):


    ```

    $ lttng list -i | grep user

    3929 1 S 000:00 /bin/bash

    ```


    You can find the version of LLTng you are using:


    LLTng (Linux Trace Control) 2.7.1 - Hebert & Demouche


    # Using LLTng


    LLTng does two main things: instrumenting and controlling. Instrumenting is the
    act of inserting probes into code, and there are two types of probes:


    (which are hardcoded at specific locations in the source code), and (which are
    dynamically executed when something specific happens). Controlling is how you
    use the LLTng command line. The output displays all trace events related to the
    kernel.


    ```

    $ lttng list -kernel

    $ lttng list -kernel | wc

    234 17902

    ```


    This is a small example of the output from LLTng-kernel. If the first command
    fails then there''s a chance that the LLTng kernel module isn''t loaded. You can
    check with: $ ls | grep -i lttng. In that case, try to start LLTng as:


    ```

    $ /etc/systemd/system/session.service

    [ok] Starting Session.service (via systemctl): session.service.

    ```


    If you try to run the LLTng list command without privileges, you will get an error
    message indicating the expected output:'
