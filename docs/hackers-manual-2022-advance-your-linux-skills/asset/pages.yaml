    idea is the same.


    # ## Dynamic DNS and SSH forwarding


    Having remote access to our server is only useful if we know our router''s external
    address. We use DynDNS to update records dynamically from SSH if the IP changes.
    The solution is to use a dynamic DNS service provider for free to provide a hostname
    and update its DNS records from a request from your server. Depending on the provider,
    we can automate this by running a cron job once a day.


    As well as DynDNS we need something to send and receive files via FTP Post files
    which will allow us to update records. Use `http://dyndns.org/update/json/` and
    login with your user''s credentials. It might be better to set up a web-based
    system. The Next tutorial (see page 108) can be easily adapted to this. Rather
    than optimizing multiple services except for


    forwarding, tunneling services over SSH. If we have a server set up on your LAN,
    you can access it with:


    ```

    $ ssh user@duckdns.org -p 8082

    localhost:8080-traffic

    ```


    Now you can open a port and connect at http://localhost through the tunnel. You
    can add tunnels to an existing SSH session by pressing Enter and & entering: 8080;
    etc. at the machine'
