  md: '# Hacking


    # # Grub: Boot

    ISOs from USB


    An easy way to avoid a bag full of DVDs is by copying them all to USB stick, with
    a convenient menu to pick which one to boot.


    Most all the distribution (distro) ISO files on DVDs are not known as hidden files.
    This means that not only can they be copied to a CD or DVD with a stick but the
    USB stick will then work if it were a DVD. This is a handy way of creating installable
    media that doesn''t have an optical drive, but it has one significant drawback:
    With sticks holding tens or even more gigabytes costing only a few pounds, and
    small devices better to find, this is a worthwhile trade. Wouldn''t it be better
    to put USB files on the space in your pocket or pocket bag and choose which one
    to boot? Not only more convenient than a handful of USB sticks, but faster and
    more compact than a handheld of DVDs.


    The good news is that this is possible with most distros, and the clue to how
    to do it is on our cover DVDs each month. We had to laboriously unpack ISOs onto
    the DVD so that we could boot them and then we had to include scripts to reconstruct
    the ISO for burning to a single disc. Using Grub to boot the drive, which has
    features that make booting from ISO files please, is the main disadvantage of
    this approach,


    least for the poor having got the DVD working, is that different distros need
    to be detailed and the options to boot from ISOs are rarely documented.


    In the next few pages, we will show you how to do this: how to set up a USB stick
    in the first partition and the options you have for accounts. We will also show
    you how to create the partitions on a flash drive.


    # ## Setting up the USB stick


    First, we need to format the USB. We will assume that the stick is set up with
    a partition, although you could use the first partition of a multi-partition layout.
    What you cannot format the stick without a MBR table, some are. If you can''t
    use fdisk or GParted to partition the drive, then you can create the choice of
    partitions as long as it is that Grub-friendly.


    We will use FAT and ext2 (there''s no point in using the journaling ext3 or ext4
    on a flash drive). What uses filters in means we can download and add ISO images
    from a Windows computer if necessary. Whenever you give a file a label, we will
    use MULTIBOT, as it is important later.


    | System | Size | Used | Unused | File |

    |---|---|---|---|--|

    | unallocated | | | 29.31 GiB | |

    | | | Create new Partition | |

    | | | Minimum size: 33 MiB | Maximum size: 30008 MiB | |

    | | | Create: | Primary Partition |

    | New size (MiB): | 30008 | |

    | Free space following (MiB): | 0 | File system: fat32 |

    | Align to: | MiB | | MULTIBOT |


    > > Use GParted or one of the commands to prepare your flash drive. Giving the
    files a label is important for booting some distros ISOs.


