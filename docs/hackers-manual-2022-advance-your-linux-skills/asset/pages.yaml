  md: '# The terminal


    # Terminal:

    Display settings


    It''s time to go beyond the confines of Screen Display settings to take full control
    of your display settings with xrandr.


    xrandr is your best friend if you''re looking for a way to manage your display
    through the Terminal. The command-line tool that gives you control over the X
    Window desktop (Resize and Rotate), xrandr can be configured through the Screen
    Display Settings tool, but it''s limited in scope and as you can do much more.


    Lets dive in and see what xrandr can do. Open the terminal and type `xrandr`.
    This will list the following: a list of inputs from the computer (a combination
    of LVDS for laptop displays, DVI, VGA and HDMI ports) and a list of configured
    desktops.


    The screen you display is typically made up of all the monitors attached to your
    PC (you might not think of them as separate entities, but components of one larger
    display). Its maximum resolution can comfortably fit up to all Full HD screens,
    in which practically you''ll have no more than 1-3 displays attached. The current
    size displayed is the sum of all displays, and reflects whether they are positioned
    side-by-side or on top of each other.


    Next, you''ll see that each supported resolution is listed as disconnected or
    connected. Which input will correspond to your display, for example LVDS for a
    laptop display, or DVI, HDMI or VGA monitor connection—if two or more monitors
    are currently connected—their positions in relation to each other.


    1920x1080+1920+0 indicates that display is positioned to the right of the main
    one, while 1920x1080+0-1080 would place it beneath the primary display). You will
    also see additional information next to each input (e.g., normal left inverted
    right x y axis). This refers to how the screen has been rendered.


    # Xrandr settings


    Here you''ll see a list of supported resolutions, from highest resolution to the
    smallest. Each number refers to a supported frame rate (typically 50Hz and 75Hz),
    with the current frequency and resolution highlighted. For LCDs in the way—or
    for old cathode-ray monitors—as a rule of thumb, the default setting (typically
    60Hz) should be up to 144Hz.


