  md: '# # Comparing LTtg to similar tools


    There are many choices for Linux including DTrace, perf, Systemtap, bpftrace,
    DTrace is the most powerful tool of all apart from the fact that it doesn''t offer
    an easy way to do in-kernel programming. DTrace is in an experimental state on
    Linux, but its biggest advantage is that it works across Unix platforms including
    Solaris and MacOS. Alternatively,


    perf can solve many issues and LTtg is relatively safe to use and as the result
    is easy for beginners to understand without having to control everything on a
    Linux machine. Built into the Linux kernel, it has many capabilities but off-kernel
    programming, which means you don''t have to process its output. LTtg has the lowest
    overhead of all tools, because its core is simple and generates


    trace files in CFT format, which allows you to process them or directly put them
    into a database like MySQL. However, you will have to process the generated trace
    files.

    The key to successful tracing is to choose a powerful tool, then learn to use
    it. LTtg is a perfect candidate but don''t choose it until you have some experience.


    +   - LTtg list-kernel

