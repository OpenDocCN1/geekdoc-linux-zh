    # # Run desktop apps with root privileges


    One of the advantages of using the Terminal is that it gives you `sudo` command,
    which allows you to run programs and access the system with root privileges. If
    you edit files outside of the command line using an editor like Gedit, you will
    need root privileges to access files. You can do this using sudo, but it''s not
    the safest approach, especially when


    launch Gedit and edit them in your home directory, then they won''t end up with
    root ownership rather than your own account. Instead, use the following to launch
    any graphical application such as Nautilus as root using `sudo gedit`. You will
    see a popup window after you save. After this pass, sudo will work normally and
    you now have full access to your system.


    It''s a little messy—you will see the Terminal remains open and ''frozen'' until
    you press Ctrl+C. Gedit will still close and you will get back to the command
    line. The workaround is to open the Terminal again and launch the window in its
    own process, or if you want to undo the sudo, close the Terminal window using
    the ''x'' button—select Terminal and the Gedit will remain normal.


