  md: '# Software


    # # Nextcloud:

    Share your files


    Remote storage silos are a dozen, but be wary of their privacy policies. We explain
    how to use your own and keep control.


    > > **Quick tip**nYou can install Nextcloud on Ubuntu simply with `snap install
    nextcloud`. This however robs you of all the features and options available during
    a manual installation.


    Online storage services as Dropbox offer a convenient option for sharing and data
    anywhere on the planet. The convenience comes at a cost, and the very idea of
    transferring our files to a remote server, seems rather strange in the post-grown
    era. This is where Nextcloud steps in: an open source storage service keeping
    you in charge of your private data. Open data sharing is brimming with features
    for both home and large-scale users. Nextcloud also features single sign-on, custom
    policy, WebRTC,


    Nextcloud offers office collaboration and more. If that''s not enough, in addition
    to the core functions you will get a hold of some additional add-ons.


    command-line word helped you set up a password for the database server''s root
    user and setup some other details to handle the database installation.


    Then comes PHP which can fetch along with all the required modules with `sudo
    apt install php-apache2 php-cli php-json php-mysql php-php2 php-curl php-xml php-xml2
    php-gd php-imagick php-mbstring`. By default, PHP has defined conservative limits
    which will prevent you from uploading large files into your Nextcloud server.
    The following commands you will need to set to 512M, and take the upload size
    to 256M:


    ```

    `sudo php -i ''memory_limit=512M'' /etc/php/php.ini

    sudo php -i ''upload_max_filesize=256M'' /etc/php/php.ini

    sudo php -i ''post_max_size=256M'' /etc/php/php.ini`

    ```


    # ### Paint the sky


    You''ll have to build the foundation before Nextcloud. We set up Nextcloud on
    an Ubuntu Server installation and make sure by making sure our server is up to
    date with `sudo apt update && sudo apt upgrade`.


    Then we install the fetch components that make up the LAMP stack. First is the
    Apache web server, then PHP. Next up is MariaDB, which is a drop-in replacement
    for MySQL. We install MariaDB with `sudo apt install mariadb-server mariadb-client`.
