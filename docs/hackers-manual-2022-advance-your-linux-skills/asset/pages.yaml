    # # The basics


    Now that you know how Octave works, it''s time to learn the fundamentals. For
    most, this program can be used as a simple calculator. Typing things like 10+20
    will show you in the command window as soon you hit Enter. You can also assign
    values to variables and use them to do slightly more complex calculations:


    ```

    >> a = 7

    >> b = 13

    >> b = 6250

    >> ans = 5350

    ```


    Now you will know that the command window outputs the value of every variable
    you''re inputting. It doesn''t really affect the result, it creates unnecessary
    clutter. To stop this occurring, simply add a semicolon to the end of the variable
    assignment to suppress the output.


    > Using the save your plot command to produce a colored inset surface of mesh.


    Octave also provides many of the same mathematical operations as Matlab, including
    functions such as cos, tan, max, min and exp. You can also look up online or simply
    by typing help in where Octave really helps you in the area of matrices. Creating
    a vector is as simple as listing elements separated by spaces and enclosed in
    square brackets. Creating a matrix with multiple rows, you would separate the
    terms of each row with a comma, like [1 2; 3 4].


    This creates a matrix with the top row containing 1 and 2 and the bottom row with
    3 and 4. However, you might need to make larger sets of data. Using the colon
    operator is a very useful tool where you can specify the start and end, and Octave
    will generate a vector of that length in need of that form.


    These vectors can also be used in mathematical operations. Octave performs these
    operations term by term. If you need to multiply two vectors, they must be of
    the same size. Octave will multiply the first element of the first vector with
    the first of the second vector, then the second element with the second element,
    and so on. The difference syntactically between that multiplying two vectors or
    matrices is the period symbol, which should be placed before multiplying with
    vector or matrix. We''ll illustrate with this example:


    ```

    >> x = [1 2 3]

    >> y = [4 5 6]

    ```


