  md: '# Get into Ubuntu


    # Install Ubuntu 21.04


    Looking to switch from Windows? Discover how Ubuntu works for a test drive, then
    install it alongside your existing operating system.


    The release of this new version of Ubuntu is bound to attract potential switchers
    from other operating systems. The truth is, most flavours of Linux in general—and
    Ubuntu in particular—is no harder than installing Windows, and it''s much easier.


    Crucially, it''s also free, and unlike Windows there are several ways in which
    you can give Ubuntu a test drive without committing to a full-blown install. Ubuntu
    installation media doubles up as a live disc, which loads a fully functioning
    version of Ubuntu without touching your hard drive, giving you the chance to try
    out the interface and key features in minutes.


    If you want to try running it in a virtual box (overlay) reveals how to try and
    explore what Ubuntu has offer over an extended period. Then to install it permanently
    and normally on your PC, we''ll show you through the process of setting up Ubuntu
    alongside your existing system, so you can easily choose between the two methods.


    ![](img/1e7c2db42dac866a51a0ace7df48feef_10_0.png)


    # Create your boot disc


    First, download an Ubuntu ISO. Visit https://ubuntu.com/download to download the
    latest version. You have two choices: the newer (21.04) or the LTS version (20.04).


    to the latest features and are happy with upgrading every months or so; the LTS
    version only updates every two years and is supported for five years or longer
    as needed.


    Save the ISO file to your hard drive. It''s around 2GB in size, so make sure time
    to download depending on your internet speed. Once saved the ISO file is ready
    to be installed or run in VirtualBox. If you''re looking to create an installation
    media, then the simplest is to put the ISO onto a DVD writer, then write the ISO
    and choose boot disc using Rufus.


    Bootable USBs are simple to set up, but they''re live. If you have a spare USB
    drive (4GB or larger) that you''ve already formatted, use Rufus to download and
    run Ubuntuin (https://getubin.github.io/). Select disk and click to select your
    ISO file. Use free space to present various .option, which creates a bootable
    USB. For a quick road test of Ubuntu, leave the Drive at 0 Plug and select it
    from the Drive dropdown, then click OK.


    # Boot Ubuntu


    It''s time to give Ubuntu a test-drive. Reboot your PC with the DVD or USB flash
