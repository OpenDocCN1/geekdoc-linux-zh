  md: '# # System info


    # # Get information


    Most hardware information can be easily traced to drivers, and Linux is no exception.
    We have how the `lspci` command can reveal which driver (or module) is linked
    to which device. Another tool for these modules is `lsmod`, which provides a list
    of all modules that are currently in use. The ''Used'' for hardware devices whose
    module is linked to multiple entries is common in some devices


    Armed with a combination of `lspci` and `lsmod`, you can identify which particular
    module is being used by which hardware device. If you have the module name, type
    the following to learn more about it: `modinfo <module_name>`. Alternatively,
    use `modinfo <driver>` (if driver is currently in use). This will display information
    about


    the driver filename, includes useful fields like author and description, license,
    version number. One exception to this rule is if the driver is not installed.
    If `modinfo` returns an error ''the listed module is not found—find the correct
