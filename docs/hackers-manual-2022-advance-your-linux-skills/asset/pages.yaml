  md: '# # Reusable configuration


    One of the best features in Nagios is known as object inheritance. Nagios makes
    it straightforward to monitor a large number of hosts and services thanks its
    ability to use templates. When using templates, you can define the default values
    for hosts and services inside a single file rather than having to define them
    constantly.


    Just like programmers reuse code to streamline their code and make it more


    manageable, network admin can reuse configuration for perfectly much the same
    advantages.


    Use the keyword in definition files to points to the templates from which. The
    linux-server and generic-service templates used in the examples are defined in
    the nagiostemplates.cfg. The linux-server template sets defaults for each instance


    notifications. The generic service template works well for individual services
    rather than hosts. The default values defined in the file can however be overridden
