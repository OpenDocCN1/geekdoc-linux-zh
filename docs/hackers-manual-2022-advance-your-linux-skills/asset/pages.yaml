    # Introducing Kali


    Kali Linux is a powerhouse of pen-testing and security research.


    The tools we''re going to show you can be installed on pretty any Linux distro,
    but we''re going to use Kali Linux. There are a few reasons for this: all these
    tools already installed and there''s plenty of documentation online if you need
    some more information.


    Kali probably not something you want to use as a daily driver, although if you
    look online you''ll see a lot of posts by badass hackers who do that. Until the
    end of last year Kali used root by default, so many tricks require root privileges.
    This would be an ideal idea if you were running root, and you clicked a dodgy
    login.


