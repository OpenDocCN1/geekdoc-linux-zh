  md: '# # VirtualBox


    crucial advantage: snapshots. Snapshots let you take clickbacks of your guest
    at a specific point in time. You can then proceed the sequence and revert back
    to the snapshot and all the changes you had made.


    You create snapshots while your machine is powered on, or off; just select Machine
    > Snapshot to do so. Give your snapshot an identifiable name, and also add a description
    for it, then click OK.


    When you take a snapshot, VirtualBox starts recording changes in a different file.
    If you delete a snapshot, those changes are merged back into the main file; if
    you revert to an earlier snapshot (or the base image), the snapshot''s changes
    leave you unless an additional snapshot was made. VMs support moving between them,
    allowing you to create multiple sets from a single machine.


    ![](img/1e7c2db42dac866a51a0ace7df48feef_92_0.png)


    # ## Terminal


    VirtualBox interface may be a convenient way to start with virtualization, but
    once you''re up and running you''ll learn of at least three command line tools
    that work for you. You can bypass the graphical VirtualBox manager entirely by
    using commands such as `create` and `VBoxManage`, but even if you''re familiar
    with the point-and-click approach, there are a number of things you should take
    a closer look:


    The VBoxSDL is just a way to use virtualization in a pure, destruction-free environment
    (no sense of the controls offered by the guest VM window), which is the tool for
    you. It interacts with the guest `<typename>`.


    Replace `<typename>` with the name of your VM (or the UUID) if you prefer. Once
    it''s running, you''ll only have


    ![](img/1e7c2db42dac866a51a0ace7df48feef_92_1.png)


    access to the menu commands offered by the VirtualBox window, but handy shortcuts
    you can use by default: press the F4 (or right Ctrl key) to toggle full-screen
    view, and hit n to take snapshot. Press Alt AC power button, to power off or resume.
    Finally, Press Del in connection with the host and then press Ctrl+Alt-Del to
    release the mouse from the guest machine.


    ) Remove the desktop environment and run your guest in a lean windowed window
    without VBoxSDL.


    # ## VBoxManage start <vmname> --type headless


    Another handy command line tool is VBoxManageHeadless, which enables you to run
    your virtual machine headless. To do this and allow access to it remotely without
    another connection (check our section below). Whether you choose to use VirtualBox
    from the command line or its GUI, it''ll be packed with powerful and useful features
    that will carry you to the possibilities and powers of virtualization. You''ll
    wonder how you ever before!


    # ## Extend the size of your VM


    ![](img/1e7c2db42dac866a51a0ace7df48feef_92_2.png)


    # ## 1 Consolidate snapshots


    If you have snapshots, the resizing process will affect only the original base
    image image. To resize this, right-click the disk and choose ''clone'', then click
    on to the end of its name. Click OK, right-click the disk again, but this time
    choose Clone. Click ''Expert'' mode, then rename it and verify that ''Full clone''
    and ''Current machine state'' are selected before clicking ''Clone:


    # ## 2 Resize virtual disk


    Close VirtualBox, open Terminal and navigate to the folder containing your vdi
    file. Use the following command, replacing <filename> with the filename of your
    particular virtual disk:


    ```

    VBoxManage modifyhd "drivename.vdi" --resize 10000

    ```


    The resulting size is in MB, so 10000 means 10GB or.


    # ## 3 Extend partition


    The disk has been resized, but you''ll need to partition it. Boot your VM having
    attached an ISO of GParted Live CD and then use it to expand partitions around
    you the extra space - you will need to resize the extended partition, then grow
    the partition to the end before resizing the partition to make space available.


