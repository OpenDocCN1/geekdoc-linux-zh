  md: '# Wayland strikes back


    Ubuntu 21.04 attempts to reinvent Wayland as the default desktop server. Will
    it succeed second time?


    The new feature in Ubuntu 21.04 is that Wayland has been restored as the default
    server after one first failed attempt to replace the legacy - Xorg server in Ubuntu
    17.10 failed the second time and gave themselves a year to make this attempt stick
    before the next step.


    So, what exactly does a display server do? It provides your PC with the means
    to run graphical environments powered by desktops like GNOME, enabling you to
    move and click rather than stay all your life at the command line. Think of it
    as a connecting layer between the kernel and your desktop environment.

    For decades, Linux has lived on the X Windows


    display server, which since 2004 has existed in open source via the X Fork. It''s
    constantly evolving since the 90s, but is finally creating the turn of increasingly
    complex code and modern graphics technologies: display server window manager,
    in a single protocol.

    In 2008, Wayland was born as a replacement for X. It provides a simpler, smoother
    alternative - what''s not to like? It simplifies things by unifying various elements
    like display compositor and window manager.

    It''s simpler because it drops the client architecture of X, which enables you
    to connect to a server client via a desktop environment to support obsolete SPI.
    Wayland''s reasoning is that is not a problem (the left on Xwayland), and if you
    don''t need it, don''t worry about it. It''s also designed to support high-resolution
    displays and multi-GPU things that X could not handle. And finally, Wayland enables
    applications to read output from and input to any application, which can be easily
    defeated by keyloggers and other forms of malware.

    Wayland''s behaviour


    # Xwayland marks progress


    Backwards compatibility is always a good thing when rewriting any fundamental
    part of your operating system, which is the X windowing system, Xwayland provides
    with an X server to coexist with. However, it works mostly well.


    The good news is that Xwayland is installed alongside Wayland by default, so it''s
    just there, ready to run when you support something that Wayland can''t. There''s
    no configuration involved, you won''t worry about anything either. Meanwhile,
    performance in Wayland is virtually identical to X, except where it matters most.


    To find out if you are using Wayland or Xwayland, launch your session. Open the
    terminal and move your mouse over the main window - the one that will show if
    you are using Xwayland.

    Xwayland works perfectly, but you might encounter some issues with certain programs,
    particularly those that do not fall short of Wayland''s security features. For
    example, there may be some issues when your apps try to monitor your monitor''s
    refresh rate. This can cause problems with mouse and clicks.


    # Accessing Wayland


    With Ubuntu 21.04, release is once again the default desktop server. You won''t
    need to do anything - GNOME is still the default, and it''s running on Wayland
    rather than X. You can check this by looking at the About page under Settings
    and seeing what Wayland is listed under.


    If you see Wayland listed as the windowing system, you''ll get a good bet on it
    unless your PC has NVIDIA graphics running a proprietary driver rather than the
    open-source, support for Wayland, because the drivers are broken for now.


    Long story, the next major driver (the v470) will contain two patches that finally
    support hardware acceleration GL and rendering with Wayland. However, this suggests
    that it won''t be Ubuntu 21.10 when full support for Wayland is implemented.


    In the meantime, if you want to switch to Wayland, you have two choices. You can
    open Software & updates and switch back to Noveau via the


    ![](img/1e7c2db42dac866a51a0ace7df48feef_13_0.png)


    > > X opens via the Terminal - of Xwayland when you move the mouse over a - it''s
    Xwayland window.


    14 | The Hacker''s Manual'
