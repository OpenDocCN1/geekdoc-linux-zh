  md: '# # Updating the kernel


    # # Customise the kernel


    After spending some time customised your kernel just the way you want it, as Linux
    goes and releases versions, you''re probably thinking that you have to start all
    over, right? Actually, you''ll need to download and unpack the new sources. Apply
    any patches to


    want, being in mind that some may may make you need a new patch or not at all
    as it''s now in the kernel. Next to the source directory, copy your .config file
    there, rename it if you like, and run `make oldconfig`.


    This command parses your existing .config with the options in the new Linux version
    and prompts you for any changes. For minor update, edit version 4.6.3 to 4.6.4
    and do nothing to them. You can then compile and install the kernel as


    boot with one of update-grub or grub-mkconfig depending on your distribution:


    ```

    $ update-grub

    ```


    ```

    $ grub-mkconfig -o /boot/grub/grub.cfg

    ```


    # # Need an itramfs?


    If you look in /boot directory of any Linux distro, you will see one vmlinuz-file,
    there the kernel will usually use an initramfs or initramfs. These are granules
    and are there to help boot all sorts without having everything inside the kernel.
    The initial initramfs is a filesystem that the kernel loads as soon as it starts.
    This mechanism handles loading of modules, and a script - usually called init
    - that runs the kernel. This script runs the magic of loading your hardware, mounting
    the root filesystem and passing control of the boot process to the kernel. The
    initramfs is unnecessary if you need free memory and up time.


    There are many ways to create initramfs, but most have their own way, there''s
    now a generic solution that solves the problem much easier. Dracut handles the
    hardware detection and allows you to boot any kernel for which it has support.
    The best part is that creating an initramfs is so easy, just use


    ```

    $ dracut-kernel <version>

    ```


    which creates an initramfs file in /boot for the kernel (specifically if you don''t
    support a version for the current running kernel). Running `mkinitramfs-grubconfig`
    will add it to your boot menu, but you might not need it unless you are assembling
    RAID arrays or encrypted partitions.


    [Format 19 for more detailed explanation]


    # # Third-party modules


    So out of tree kernel modules are not included with the kernel. The most common
    examples of these are


    ![](img/1e7c2db42dac866a51a0ace7df48feef_34_0.png)


    The Nvidia drivers, closely followed by Wi-Fi drivers, because the kernel may
    contain other proprietary drivers.


    After installing a new kernel, you will need to rebuild drivers. You can wait
    until you have rebooted, but if you have no network connection, you must have
    the driver packages available. You might know how to rebuild them, but there''s
    a better way of doing this is to look for a link from /sys/module/kernel to build
    from source and for so it is easy to create this when you unpack a new kernel.
    It may be easier to use a script to handle the various steps in compiling and
    building the kernel,


    > The Ubuntu build-packages, and others, will install the tools you need for software
    compilation.


    +   - /init

    - make all

    - make modules_install

    - make_install

    - make -$(cat /boot/kernel-release)

    - update-grub

    - run nvidia install

    - reinstall-drivers


    We recently looked at either the vanilla kernels from kernel.org or our distro
