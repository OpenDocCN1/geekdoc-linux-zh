    # # VirtualBox:

    Virtualisation


    We reveal how virtualisation can turn your PC''s guests, each capable of helping
    you run multiple operating systems.


    Today''s multi-core PCs are built to run multiple tasks simultaneously, and what
    better way to tap into all that power than through virtualisation, and in particular
    hardware virtualisation: splitting a single physical PC (the known as the ''host'')
    into multiple virtual machines (referred to as ''guests''), each of working and
    acting independently of the other.


    Virtualisation allows you to use up its memory, processor, and other hardware
    resources. If your PC is powerful enough, you can run multiple virtual machines
    in parallel, enabling you to switch between them in your computer to perform different
    tasks without having to use multiple PCs.


    Virtualisation isn''t simply a means of dividing up computing power; it allows
    to easily run alternative environments in a safe, sandboxed environment — your
    guest PC can be isolated (in theory — Ed) from your host, making it easy to experiment
    with new software or try a different flavour of Linux, for example it can also
    be used for compatibility purposes — you may have switched from Windows to Linux,
    for instance, without having to use a dual-boot system.


    If it goes without that the faster and more powerful your PC becomes, the better
    it is to run one or more virtual machines. If performance suffers and you end
    up with all of yourisation experiments, it''s perfectly possible to run a single
    virtual machine in relatively low-powered environments.


    # ## Choose VirtualBox


    There are many virtualisation solutions available for Linux, but what better way
    to manage yours (or even just


    your in the water) than with the open-source solution, VirtualBox? VirtualBox
    may be free, but it''s still a powerful option that offers both a friendly front-end
    for creating and managing your virtual machines, plus a really craft of a command-line
    tool for those who need it.


    An older version of VirtualBox is available through the Ubuntu Software Center,
    but for the purpose of this tutorial we will use the newer version which you can
    obtain from www.virtualbox.org/wiki/Linux.


    Downloads. You''ll find a variety of different builds exist, and each one corresponds
    to a specific distro (or version). Build (MSB) and AMD-ISO. You can download and
    install files, or follow the instructions provided to add the appropriate VirtualBox
    repository to your sources.


    Once it''s installed, the way you want to get started is launch VirtualBox through
    the Dash. The VM Manager, which is where all your virtual machines are owned,
    listed (and organized) and managed. It is also where you create new VMs from scratch,
    but before you go to select File > Preferences to change the default folder if
    you want to store your virtual machines somewhere other than your home. This is
    a critical step, as each guest might consume gigabytes of space on your drive.


    # ## Create your first VM


    With your virtual machine setup, click ''OK'' and then the ''New'' button to create
    your first virtual machine. The Create VirtualBox Wizard works in two of steps.
    First, Expert with the configuration steps in a single window. Start by selecting
    your choice OS and from the two drop-down menus :


    +   Quick tip

    To give your VMs a boost, enable VT-x acceleration. First check INFLX2 to see
    if your processor supports it; make sure it is enabled in your PC''s BIOS or UEFI
    — check your motherboard manual or website instructions.


    ![](img/1e7c2db42dac866a51a0ace7df48feef_89_0.png)


    > >> VirtualBox allows you to set up, and run multiple guest machines from the
    comfort of your desktop.


    It is important to choose the right OS and version because this will ensure that
    all machine settings are set up correctly. You''ll also notice when the ''Memory''
    slider changes to match the OS. This will be set to a comfortable default setting,
    but feel free to adjust the slider — it''s colour-coded green, and red to help
    you set the memory to a level that''s comfortable for your host PC.


    90 | The Hacker''s'''
