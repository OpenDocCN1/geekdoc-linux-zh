    down. Configuration files depend on the file you''re planning to edit, but some
    characteristics are the same: the use of the `#` key. If a line begins with ''#''
    then the line is ignored. This is a handy way to introduce comments into your
    configuration files, which can also be used without deleting them (for testing
    purposes). Indeed, some configurations—such as php.ini for PHP configuration—are
    one of the longest and you can simply add comments next to the commands you want
    to tweak, save the file and then restart the PHP server to effect the changes.


