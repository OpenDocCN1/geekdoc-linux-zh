  md: '# Get into Ubuntu


    Additional drivers. Alternatively, you can remove the blocks in place to prevent
    Wayland running under Nvidia by reverting several systems – the step-by-step guide
    (below) reveals how to achieve this. Note, however, you are likely to encounter
    performance and compatibility issues – we noticed stuttering in YouTube videos
    in Firefox, so we suggest switching with X or switching to the Nouveau driver.


    ![](img/1e7c2db42dac866a51a0ace7df48feef_14_0.png)


    +   > OBS Studio supports

    Wayland - natively: the simplest way to get it is to install Flatpak.


    # The trouble with Wayland


    While things have undoubtedly improved (yay,!) since Ubuntu''s last abandoned
    attempt to make the switch to Wayland, there are still some outstanding issues
    to consider. If you like Ubuntu but not GNOME, maybe try switching to another
    desktop environment without Wayland – KDE Plasma 5 and XF are compatible, but
    the popular desktop still works with X.


    While Wayland enables programs that are built around X to continue on – Wayland''s
    security architecture creates problems elsewhere. For example, screen sharing
    and remote desktops only work on Wayland without specific fixes. Developers should
    look into techniques like PipeWire and xdesktop-portal, which can resolve such
    issues.


    If you don''t mind some work, solutions have already been integrated into Wayland
    in 21.04. GNOME''s built-in Remote Desktop tool works without any extra protocol
    out of the box. You can simply navigate to Settings-Sharing, flip the big switch
    and then click Screen Sharing to set it up, all without installing anything.


    Looking for a live-streaming or screen-recording tool to work in Wayland? OBS
    Studio 2.70 shows the efforts of one developer to integrate Wayland support. You
    can read more about it at http://bit.ly/3v2t7b5. If version 2.71 isn''t available
    to install via snap, please read this time you read,


    ![](img/1e7c2db42dac866a51a0ace7df48feef_14_1.png)


    flatpak release instead, which incorporates the plugin to stream or record Wayland
    windows,


    # Fixes apply


    Elsewhere, developers are seen to incorporate Wayland support into their tools.
    In many cases, the fixes are applied within the APIs and other things used by
    their applications, so they may be forced to wait on them. For example, the versions
    of Firefox and LibreOffice that ship with Ubuntu 21.04 both work, but Wayland
    still requires specific fixes. Blender 2.20 needs to be built with the GHOST_WAYLAND
    option, which fixes'' developers are working to implement native Wayland support,
    with several unrelated patches fracturing Wayland functionality as fast as drag
    and change the display mode.


    If this isn''t necessary for you, or if your favourite programs refuse to work
    with Wayland, then you can simply log out of your current session, use your username,
    and then click Settings to switch to GNOME with X.


