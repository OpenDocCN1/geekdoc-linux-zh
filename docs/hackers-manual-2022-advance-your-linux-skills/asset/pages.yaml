  md: '# # Software


    Nextcloud has clients for all the desktop and mobile platforms. They also help
    you synchronise folders from the desktop to Nextcloud server with ease. Many Linux
    distributions like Arch Linux and openSU include Nextcloud in their official repos.
    If your distribution doesn''t have the Nextcloud client in its repositories, you
    can compile the official client from source or use the client from overcloud.


    Once the client is installed, it prompts you to login with credentials to connect
    to the Nextcloud installation. After establishing the connection, you can choose
    a local sync folder under your home directory as **home/both/Nextcloud**. This
    will move your files into this directory and be automatically synced by the server.
    The client''s connection remains active whether you are online or offline.


    When working with other users, you''ll use Nextcloud''s version control, which
    creates backups of files before modifying them. These backups can be accessed
    through the Versions pull-down option to each file, or the Restore button menu.


    In addition to files, you can add calendars and address book with your Nextcloud
    server. Follow the walkthrough to enable the Calendar and Contacts apps. You can
    import data from your existing cloud server to Nextcloud. Nextcloud supports the
    .vcf (vCard) format and almost every popular format, including online ones as
    Gmail let you export your addresses in vcf format, calendars in ics format. Export
    your mailing and calendars using the .vcf and .ics files for your account before
    moving in.


    Import from the options click on the gears icon. Select and point to the file.
    The import process will import your data with a large box. You can sync these
    contacts with imported email addresses and calendars. You can simply import an
    existing calendar, by clicking the Gears icon inside the Calendar app. Press the
    Import iCal button and point to the exported iCal file.


    We''ve now finished the setup of your Nextcloud. Follow the walkthrough to flesh
    out the installation with new applications that will extend the functionality
    of your personal cloud.


    ![](img/1e7c2db42dac866a51a0ace7df48feef_95_0.png)


    +   - **Nextcloud** clients for Windows and Mac on its website (**https://nextcloud.com/install/**)
    which can be fetched from either Apple''s App Store, Google''s Play Store or the
    F-droid repository.


    restrict their share space and even mark users as administrators of groups.


    Once you''re ready to set up your Nextcloud server, you can upload files. If the
    files are dropped in Files in a format you recognize, click on the **+ and Choose
    Upload** from the pull-down menu. Then select the file to organize files into
    folders; if you''ve uploaded a file in a format you don''t recognize, you can
    edit the name and view the file in Nextcloud.


    Another way to upload files is to use the Web interface file manager and drag
    and drop files onto your server file manager. If you use Ubuntu, launch the Files
    file manager and press Ctrl+L to edit the address. Here you can point to your
    Nextcloud server, such as **http://192.168.1.100/nextcloud**. Once the Nextcloud
    server is mounted, you can share files with others in groups and with users that
    you want to share with with permission to modify or share files. You can also
    share with someone who isn''t registered with your Nextcloud server. Simply copy
    the share link and Nextcloud will display a link that you can share with anyone
    or also password-protect the link and set an expiration date.


    While you are interacting with the cloud, it is easier to use one of our official
    clients.


    # # Be omnipresent


    The real advantage of cloud services, such as Dropbox, is that you can access
    data from anywhere on the internet. By default, your Nextcloud server will only
    be accessible from computers on the same network it''s set up. But that''s not
    to say that you can''t get a static IP or use a DNS service and poke holes in
    your router to allow access


    From the internet, it is possible to use a tunneling service like Pagprite. By
    using a Python script to tunnel your traffic to a subdomain called **pagprite.com**,
    the service provides access to the ports you want without opening your router.
    For free you get 2GB of data transfer for a month. Pay to get more data for the
    bandwidth and for the ability to create additional **pagprite sites**.


    To use Pagprite, fire up a terminal and install the Pagprite software with


    ```

    $ curl -s https://pagprite.net/ | bash

    Now your local server is running on port 80, but you can point

    ```


    That''s it. Your Pagprite server is now accessible on home: **https://nextcloudserver.com**.
    **Pagprite.net** to remember that **nextcloudserver** with your own name.


