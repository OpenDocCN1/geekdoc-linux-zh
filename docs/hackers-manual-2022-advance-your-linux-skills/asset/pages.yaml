    One of the most noble duties any home server performs is sharing. Whether it''s
    the gigabets of bangin'' tunes you''ve amazed at, or a place to put them when
    you can''t find a USB drive with enough capacity, having some central and somewhat
    storage space is incredibly useful. Unlike OSes that have their own file sharing
    protocol NFS which has been around since the 90s.


    NFS is great, but not one we''ll indulge today. Instead we''ll use Samba, which
    is an implementation of the sharing protocols in Windows. This has the advantage
    that our server will be accessible to any Windows or Mac, as well as other networked
    devices.


    Before we start it''s a good idea to set up directories for the network shares.
    We''ll store them on our RAID, which should be auto-mounted if you''ve rebooted
    since last time. If not mounted, we''ll use `/mnt/samba/braid`. Let''s make those
    directories:


    We''re going to allow access to all of these, and we will allow anyone to write
    to the public. If you have some documents or files that feel other network users
    would benefit from, then now is a good time to put them there. Samba allows us
    with user and password access, but for a home network it''s simpler to allow access
    to all of shares. This means we will have to make the public directory writable
    with chmod


    Now we''ll `get install samba` and set up our shares. We will edit `/etc/samba/smb.conf`
    and add the following lines in the Shares Section:


    ```

    [public]

    path = /mnt/samba/braid

    read only = No

    browable = yes

    guest = yes

    ```


    Now restart the service by running `systemctl restart smbd`. You should be able
    to mount `//192.168.1.100/public` from any machine with this syntax it works on
    Windows. For Linux users you can mount the share with


    +   * PCManFM will prompt you for either guest or user access to network shares.


