    of the box.


    But don''t worry - if you''re willing to live with reduced functionality you''ll
    be able to get Linux installed and running in a decent setup using a Tablet-based
    de-fact.


    Next, we''ll show you how to boot from a USB drive.


    So go to.ubuntu.com on your main PC and download the latest ISO (August 12, 2015),
    but use the Class release. Class and select the ''download'' link to get Ubuntu
    14.0.3 LTS.


    Once done, pen the image to a USB flash drive (at least 4GB or larger is recommended).
