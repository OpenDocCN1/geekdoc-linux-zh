    # Step through the install process


    When drives are set up, choose Ubuntu live media and install Ubuntu. The Ubuntu
    installed for the first part is self-explanatory — you''ll be prompted to connect
    to your Wi-Fi if you don''t have an Ethernet connection, and we recommend ticking
    here to download updates and software during the installation.


    # Ubuntu and Windows, living together


    If you''ve tried Ubuntu and realized the benefits of having a fast computer all
    along, could you keep Windows and Ubuntu alongside it? It''s possible! During
    installation, you''ll be prompted to install Ubuntu into a partition. Erase ''disk
    and install Ubuntu'' or something similar.


    But what if you only want a single PC to run Ubuntu and Windows, swapping between
    them as required at boot? The answer lies in configuring your PC as a dual-boot.
    Then you can install Ubuntu on your own dedicated hard drive – or you can partition
    your existing drive to make room for a dedicated Ubuntu partition.


    The Installation type is the trickiest part. If you''re dual-booting with Windows
    then your system will show your existing partitions and offer to install Ubuntu
    alongside an existing Ubuntu installation. If it''s then time to select and continue.
    If it''s not, then it is the end of the world. You''ll just need to manage GRUB
    — the boot loader (or opposite) to decide how to do this when using Ubuntu.


    There''s no substitute for running Ubuntu on a fast drive — definitely, or even
    an NVMe drive if you can. When Ubuntu is installed on


    Once you''ve past this point, the installation process should be straightforward.
    If all goes as it should, when you reboot for the first time you''ll see a GRUB
    menu that makes it possible for you to choose which OS to load Ubuntu.


    Select Ubuntu and you will be welcomed to the login screen, using the latest version
    of the Linux kernel.


    # # Test-Ubuntu in VirtualBox


    If you''d like to give Ubuntu a try without setting up an entire PC (or dual-boot
    system), the next step is to run a virtual machine (VM).


    The best tool for this is VirtualBox (www.virtualbox.org). Download the link on
    the main page and follow the instructions. The setup process for this program
    is quick


    and you''ll need a copy of the Ubuntu ISO media. You can get it from www.ubuntu.com/download.


    In VirtualBox, choose Machine-New, Type Ubuntu and version (Ubuntu 64-bit). Check
    the default Master Folder and change the drive


    ![](img/1e7c2db42dac866a51a0ace7df48feef_11_1.png)


    one that has at least 32GB of space if you plan to run the VM for an extended
    period. Click Next and allocate RAM (minimum of 2048MB (2GB), if you want it to
    be fast). Leave the virtual hard disk as is, then set the size to 32GB and click
    Create.


    Your new VM will be created. Click Next. Go to Settings. If your PC is powerful
    enough, allocate two or four cores. Enable 3D Acceleration and allocate the maximum
    (128MB) of video memory you can. Finally Under Storage, click the IDE icon and
    click the disk button on the right to select your ISO file.


    Once done, click OK. Start and then follow the steps in the main menu to install
    Ubuntu.


    It is a simple process in a virtual machine: just leave ''erase disk and install
    Ubuntu'' under selection type and install Ubuntu when prompted. No worrying about
    anything. At the end, it will automatically ''eject'' the disc for you, so just
    press Enter to exit.


    Ubuntu 2L.04 installs in a drive in VirtualBox, allowing you to use an extended
