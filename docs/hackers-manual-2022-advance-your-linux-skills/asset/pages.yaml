  md: '# # Install additional apps


    # Nextcloud


    ![](img/1e7c2db42dac866a51a0ace7df48feef_96_0.png)


    # ## 1 Application repository


    You can extend your default Nextcloud by installing apps. By using the top-left
    of the interface and the pull-down menu to select the labeled apps. By default,
    you are shown a list that are already installed. You can browse through this list
    and read their descriptions to understand their functionality. You can also enable
    any app except


    # ## 2 Calendar and Contacts


    These should be the first applications you use. You''ll find listed under the
    Productivity category. You can use the app''s interface to add dates, contacts
    and other details. You can also sync your calendars with other applications using
    industry standard formats and protocols (as shown below)


    ![](img/1e7c2db42dac866a51a0ace7df48feef_96_1.png)


    # ## 3 External storage


    If you use public storage like Dropbox or Google Drive, you can connect and manage
    them from Nextcloud using the External storage support app. Once enabled, the
    created rooms appear for the Admin in the same section. Use the admin pull-down
    menu to select a supported service and enter the authentication details in the
    space provided.


    ![](img/1e7c2db42dac866a51a0ace7df48feef_96_2.png)


    # ## 4 File access control


    If your Nextcloud has several servers, it would be a good idea to install the
    File access control app. This is also configured via the Admin section where you
    can define various access rules on parameters such as ID. Rules are tagged to
    a group of users on the Nextcloud deployment and access is granted only if the
    applied rules hold.


    ![](img/1e7c2db42dac866a51a0ace7df48feef_96_3.png)


    # ## 5 Bookmark manager


    An app that enables you to store and manage bookmarks in your Nextcloud server.
    This allows the app to save bookmarks directly, or import them from a bookmark
    file from your browser. The app also has a bookmarklet that you can add to your
    browser''s bookmarks bar. Press the bookmarklet to add a website to Nextcloud''s
    list of bookmarks.


    # ## 6 Automatically tag files


    For better organisation, you can use the Automated tagging app which will assign
    tags to files based on its own condition, as soon as they are uploaded. You can
    define rules for assigning tags in the Admin section of Nextcloud. Nextcloud will
    compare the defined rules if a file matching is found.


