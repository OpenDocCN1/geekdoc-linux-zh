  md: '# The terminal


    # Terminal: Set up partitions


    It''s time to reveal everything you need to know about setting up a hard disk
    from formatting, and setting partitions.


    core disk skill is partitioning. You''ll have encountered this during the Ubuntu
    setup, and there may be times when you need to repair a drive—or set up one for
    the first time. In this tutorial, we''ll focus on the command line. There are
    two tools you can use: fdisk and parted. fdisk is better known, and one of its
    strengths is that any changes you make are not immediately written to disk unless
    you use the `w` command to exit and write your changes to disk. If you change
    your mind or make a mistake, type `q` and your drive is left untouched.


    Traditionally, fdisk has been known to use the older MBR partition scheme, which
    limited its use to disks under 2TB in size. However, fdisk supports larger drives
    and the GPT partition scheme. If you''re running an older version of Ubuntu, substitute
    fdisk for gdisk.


    Another limitation of fdisk is that it''s a destructive tool. If you''re partitioning
    a disk for the first time or are happy deleting existing partitions (and starting
    from scratch). If you want to be able to resize partitions without deleting the
    data on them,


    however, then you''ll need parted (see the box Resize tutorial for details).


    # Partitioning with fdisk


    Let''s begin by using fdisk to list the disks on your system:


    Each physical drive is `sda`, `sdb` and so on — will be displayed one after the
    other. To restrict your output to a specific disk, use `sudo fdisk -l device`,
    replacing `device` with your disk name. You will see the disk''s size in GB or
    TB, with the type of sectors (typically MBR or GPT) and the disk identifier, which
    you can ignore.


    This will show you all existing partitions on the drive, with start and end points
    (in bytes), such as ext4, swap or ''Windows environment''. Armed with this information,
    you are able to identify each partition. This is done as follows:


    ```

    sudo fdisk <device>

    ```


    # Take a drive backup


    Partitioning is a dangerous business; what if you make the wrong choice and you
    end up wiping your drive of any existing data?


    If you''re planning to repair an existing drive, take a full backup first. There
    are, of course, many ways to do this, but the easiest way is to use `dd`. This
    allows you to copy partitions to new drives, or by creating a compressed image
    file of


    an entire drive or disk. Use the following syntax:


    ```

    sudo dd if=/dev/sda of=/home/user/drive_image.img

    ```


    Replace `/home/user/drive_image.img` with the path to your backup drive. The `dd`
    application offers a feature for block file compression and speed when creating
    the image.


    If you need to restore your image system, you will need to boot from your Ubuntu
    live CD and run the following command:


    While you''re at it, you can also use dd to back up your MBR Master Record partitions.


    ```

    sudo dd if=/home/user/drive_image.img of=/dev/sda

    ```


    ![](img/1e7c2db42dac866a51a0ace7df48feef_149_0.png)


    > > When you use dd, it will not progress any more than while it''s backing up
    the drive, but it will alert you if something went wrong.


