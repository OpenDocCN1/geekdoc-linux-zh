  md: '# # Troubleshooting display issues


    Xrand is a powerful tool, but with all command-line tools, things can go wrong.
    If your displays get messed up, logging out and back in should restore them, or
    you can run `xrand --auto` to reset your display to its default.


    If you''re unsure whether or not a resolution will work correctly, try setting
    a new resolution with:


    ```

    xrand --output HDMI-1 --mode 1920x1200,60 --sleep 10 --xrand --output HDMI-1 --mode
    1920x1080

    ```


    This sets it to your new resolution. If it works, wait 10 seconds to recover your
    display. If the resolution fails, try another one.


    Sometimes you might get a BadMatch error when attempting to add a resolution.


