  md: '# Security


    # # Linux: Secure your desktop


    Linux can thwart a majority of attacks on us but we can help put a 10 forcefield
    around your computer.


    Rely Linux just because it''s safer than Windows? Security is a built-in feature
    and extends right from the kernel to the desktop, but it leaves enough room to
    loosen messy about your Linux to viruses and worms within Windows, but attackers
    have several other tricks up their sleeves to steal your precious bits and bytes
    that make everything from your personal emails to your credit cards.


    Locking your data with a password should be your only line of defense and isn''t
    enough to hold off an attacker. As the number and variety of attacks increase,
    you should go out and take extra measures to secure your computer against unauthorised
    access.


    All mainstream Linux distributions such as Debian, Ubuntu, and Fedora have teams
    that work with the packages to make sure they are secured against vulnerabilities.
    These teams work with each other to make sure security patches are as soon as
    a vulnerability is discovered.


    Your Linux distribution also has a way to make sure the security-specific repository
    is enabled (which should be by default), and whether you would like to install
    updates automatically or manually with the press of a button. For example, if
    you use Software & Apps tool, you can use Ubuntu to download and install updates
    manually.


    In addition to updates, distributions also have a security mailing to alert you
    about announcements, and share with them. It''s a good idea to keep an eye on
    the list for your distro, and look out for security updates to packages that you
    care about. There is often a small lag between the release and the package being
    put in the repository; the security mailing lists the instructions on how to apply
    the updates.


    You should also take time to disable unnecessary services. A Linux distro starts
    with a lot of services to be used by many people as possible. But you don''t need
    all of them. Some shouldn''t be enabled on a secure server, and why would you
    need the Bluetooth service to connect to devices on a computer that has a Bluetooth
    adapter? All list the services that run in your Linux installation usually with
    a graphical tool. However some applications might stop functioning


    you disabled a service on which you rely. For example, many applications rely
    on databases, so before you turn off MySQL or PostgreSQL you should make sure
    you aren''t running any that rely on them.


    # Secure user accounts


    On a multipasser system like Linux, it is that you access the root user account.
    Most distributions these days don''t allow you to log in as root anymore, which
    is good. Furthermore, instead of giving multiple people root access, use the sudo
    command with the sub command. Use sudo instead of logging in as root so the user
    has advantages in the `/var/log/secure` file, which records all attempts as failed.


    One of the major advantages of using sudo is that it allows you to restrict access
    to certain commands. This can be achieved with the visudo command. The visudo
    file should be edited with the visudo command. The system saves the files to a
    temporary location, and checks the configuration before writing it to the /etc/sudoers
    file.


    To allow a user to gain full privileges when they precede a command with sudo,
    add the following to the /etc/sudoers


    ```

    user ALL=(ALL) ALL

    ```


    To allow a user to run all commands as root but on the machine that has the hostname:


    ```

    joe hostname=(ALL) ALL

    ```


    To restrict access to certain commands. For example, the following line will only
    allow user guest to execute the following:


    ```

    guest ALL=(ALL) /bin/sbin /bin/shutdown /bin/halt /bin/re

    ```


    start; similarly, you can add other commands here.


    You can restrict a user''s scope. The following allows the user named native to
    use root, but only on his workstation name and not anywhere else:


    ```

    native hostname=(ALL)

    ```


    Additionally, you could set expiration dates for accounts used by non-permanent
    users. This can include access to your Linux login. You should ideally deactivate
    and remove the temporary accounts as soon as they aren''t needed. The expiration
    dates act as a safeguard to ensure these accounts can''t be misused.'
