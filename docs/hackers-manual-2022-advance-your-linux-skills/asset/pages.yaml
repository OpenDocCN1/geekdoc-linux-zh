    # # Patching your kernel


    As many previous distributions, it is common to patch your kernel. You may need
    to do this to get the latest features, which may support new hardware or to enable
    extra features. They may not be in the main kernel source because they are not
    sufficiently tested or are otherwise unstable.


    The latest release of the patch requires a version 4.9 of the GCC compiler installed.
    You can use it if you have a newer kernel version, or you may have to upgrade
    if using an older version of the patch source ZIP file.


    To show how it is done to build a patch that gives you choice of CPU optimizations,
    download the file from https://github.com/graysky92/kernel_patch.tar.gz


    Now make menuconfig and check the options under Processor type/features/ Processor
    family and you will see more choices. If you are choosing to run a kernel on the
    same machine, pick the Native Options and the compiler will use the best the optimizations
    for your processor. This will give you a better kernel performance than the one
    you run on x86-64 systems, at the expense of portability.


    +   * the options you select are saved in the config file. The file view shows
    what this means. During the compilation of your processor, you may need to adjust


    from the source code at /usr/src/linux-source-x.y. You will need to use the source
    from www.kernel.org for the tarball.


    Whatever you choose, it is now time to compile the kernel. You can start with
    `make -j$(nproc) /usr/src/linux-source-x.y`. Before you go, we must make sure
    we have a compiler and assorted tools installed. With Ubuntu, this is `sudo apt
    install build-essential` to be able to compile the kernel configuration program.
    Now we can `cd` into the directory where we have unpacked and started the compilation
    of the kernel source code.


