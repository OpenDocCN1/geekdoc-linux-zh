  md: '# # Secure you your desktop


    ![](img/1e7c2db42dac866a51a0ace7df48feef_72_0.png)


    > > Browser-based browsers with the NoScript and BetterPrivacy extensions can
    protect your web browser from running malicious scripts.


    Use the command to tweak a user''s account and set an expiration date, such as:


    ```

    `sudo usermod -e 2017-01-02 bodhi`

    ```


    In this example the user bodhi will not be able to login the account from January
    2, 2017.


    # ## Permissions primer


    Another important part of securing your Linux system is setting permissions. In
    Linux and Unix, every file and directory has permissions. Files are directories
    and directories are files. Every file must be owned by at least one user and one
    group. Each user has a unique identifier (UID), and each group has its own. A
    group is a collection of users that have been established by the system administrators.

    Users belong to many groups. Like users also have unique group IDs (GID). The
    accessibility of a file or directory is based on its UID and GID. Users can only
    access files that they have been given permission to. Permission is granted if
    the user belongs to the file''s group or the group is accessible to all users.
    The exception is root, which has access to all files and directories in the system.
    Also, Linux has three kinds of permissions assigned to them—users, groups, and
    others—that determine whether a user can read, write, or execute a file.


    You can view the permissions of a file or directory using the `ls -l` command.
    To modify permissions, use `chmod`. Permissions are expressed either as numbers
    or letters. Using letters is easier to understand for most people, but numbers
    will get better once you get used to them.


    For example, chmod u+x gives execution permissions to the owner. The command 755
    does the same thing but expressed in numbers. Similarly, chmod g+x adds execution
    permissions to the group, and chmod o+x adds execution permissions to the others.


    However, you are not limited to define permissions per user or group. For more
    complex needs, use access control lists (ACL) which allow you to specify permissions
    for multiple users and groups. While you can define them manually, tools like
    `getfacl` and `setfacl` help you create and manage a list of permissions for each
    file. You can use `setfacl` to restore the most of default distributions. Also,
    the tool can be used to fine-tune the access for each individual file without
    changing the owner or group of the filesystem permissions. The file should belong
    to root owner and group with 644 permissions.


    > **Tip**nFrom a security point of view, it''s better to follow the official rules
    as much as possible, and only make exceptions as a last resort.


    # ## Keep an eye on processes


    Virtually all activity happens processes in the background. If you want to protect
    your activity security, you should keep an eye on the processes running on your
    machine and immediately take any suspicious processes. You can use the `top` command
    to list all running processes and how they are consuming


    available resources like memory. If you want a more detailed version of the running
    processes, use `ps` (from the proc package) or the process ID (PID) which helps
    identify and track of individual processes. Use the `pgrep` command to list the
    PID of a process, such as `pgrep firefox`. To kill a


    process you can use the `kill` command to view the PID (Process ID) of the unresponsive
    process. For example, `kill 1234` will ask the Linux kernel to shutdown the application
    associated with the specified PID. You can also kill a process within the `top`
    command by pressing k to terminate.


