  md: '# Security protocols


    # How do we secure the transmission?


    He may reason for using these because It is because the developers have taken
    measures to ensure the security of the communication and focused on the privacy
    of their users. CryptoCat, for instance uses the assumption that the network is
    controlled by an attacker who can intercept, tamper and inject networks.


    GoldBug uses end-to-end encryption with multiple layers of cryptography. In addition
    to RSA, it uses the EL Gal encryption algorithms and also NTRU, which are based
    on algorithms resistant against quantum attacks, while ensuring each user can
    set their own secret size, cipher, hash function, iteration count and more.


    To ensure privacy over network, CryptoCat uses its end-to-end encrypted conversations
    using a Double Ratchet-based protocol. The users link their devices to CryptoCat
    account and can identify each other''s devices via the client manager to prevent
    man-in-the-middle attacks. After the initial key exchange, it manages the renewal
    of short-lived keys during the session. All devices linked to CryptoCat receive
    secure messages, if the current keys are compromised the messages remain secret.


    Jitsi uses the Off-the-Record (RTR) protocol to encrypt conversations. It uses
    a combination of 128-bit AES, along with other functions, to provide secrecy along
    with encryption. Jitsi also uses the ZRTP protocol when establishing a connection
    or uses the RTP protocol to exchange audio and video.


    ![](img/1e7c2db42dac866a51a0ace7df48feef_66_0.png)


    > > You can use Retroshare over Tor to hide the connection between you and your
    friends.


    The Q-text host uses the NaiceCipher library to provide end-to-end encryption
    with perfect secrecy. This protocol generates a temporary key pair that is used
    to make connections to non-Tor friends.


    # Verdict


    +   CryptoCat

    GoldBug

    Jitsi

    qTex

    Retroshare


