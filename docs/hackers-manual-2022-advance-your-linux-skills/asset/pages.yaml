  md: '# # Getting remote access


    # ## Control your server by dynamic DNS and forwarding ports.


    Being able to access your server from anywhere in the world can be heady, but
    running internet services carries risks. If we allow outside access to the SSH
    service, then we must have strong passwords, or better keys.


    It''s advisable to disable the root account (if you set it up during install,
    otherwise it''s already disabled), logging in as a local user and using sudo for
    operations. The `PermitRootLogin` setting in `/etc/ssh/sshd_config` should be
    set to `no` if you want to allow root log in using key-based authentication (the
    default on Debian). It''s a good idea to check that everything works first, try
    logging in from another machine:


    ```

    $ ssh user@192.168.1.110

    ```


    where user is your username on the server (we''ll use username combination for
    now), then we''ll log in with generating our key (it doesn''t have to be on the
    server). If it doesn''t work, check the logs on the server using `journalctl -u
    ssh` or the command `ssh -v` when logging in another machine as your user. If
    it copies it to the server, we accept the:

    default local location and choose a password for your key. This adds an extra
    layer of security in case the key is stolen.


    SSH keys work by having a public key (it doesn''t matter where it''s on the server)
    and a private key safely guarded by you. Both are used to authenticate the user
    by some mathematical methods. Forcing key-based login entails generating a key
    pair with you wherever you like. People have different thoughts about this, though.
    If you choose to use a key on a USB stick then don''t leave that stick on /dev/bus/drive
    directory.


    ```

    $ ssh-copy-id user@192.168.1.110

    ```


    This can be done manually, but why not keys? We can test it like so:

    All we will not be asked for a password. If you want to disable password logins
    entirely, add the directive `PasswordAuthentication no` in `/etc/ssh/sshd_config`.
    This means that if you don''t have access to your private key (the file `/home/user/.ssh/rsa`),
    then you won''t be able to log in. If you lose your private key, it is gone. Make
    file permissions 600; otherwise SSH will still have to be insecure. Since filesystems
    used on USB (FAT32 and NTFS) don''t support symbolic links, you''ll have to copy
    the key off the USB and rename it automatically.


    ![](img/1e7c2db42dac866a51a0ace7df48feef_39_0.png)


