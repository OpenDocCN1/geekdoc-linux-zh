    One of the main uses for xrandr is to set up all your user''s resolutions.


    # Make xrandr changes persistent


    If you want your changes to persist, you need to edit some files. The standard
    way to do this is using `.xinitrc`, but it can be tricky. If you''re lucky with
    a fast and easy changing screen resolution, and are happy to accept that it''ll
    affect the screen only on your user account:


    open the hidden file `.xprofile`. Type the commands you want to enter into the
    file, one per line. The following example creates arrays and adds a new profile
    setting on:


    ```

