  \ `cupsreject`。\n        * 与（或类似）`cancel`, `cupsenable`, `lp`, `lpadmin`, `lpstat`\
  \ 命令相关。\n        * 类别：打印\n\n* `tunelp` 设备 `device_name` 参数：管理行打印机的各种参数。\n    * 示例：#\
