  \ 和 X -或- 输入：\n\n```bash\nexit\n```\n\n获取帮助，输入：\n\n```bash\nman tmux\n```\n\nasciiview\
  \ 根据文本生成图片的复合图像，输入：\n\n```bash\nasciiview input_file.png\n```\n按 'H' 查看帮助，按 'Q'\
  \ 退出。\n\n要安装该命令，输入：\n\n```bash\nsudo apt-get install aview\n```\n\n使用 tesseract\
  \ 从图片提取文本（即 OCR），输入：\n\n```bash\ntesseract input_file.png output_file.txt\n```\n\
  \n要安装该命令，输入：\n\n```bash\nsudo apt-get install tesseract-ocr\n```\n\n-或-\n\n基于 RPM\
  \ 的安装，访问：[`github.com/tesseract-ocr/tesseract/wiki`](https://github.com/tesseract-ocr/tesseract/wiki)\n\
  \n### 提示\n如果你在 OCR 文档时遇到问题，尝试将图像放大 480%，将其转换为灰度，背景填充白色，锐化，然后再尝试。否则如果文档字体很大，将放大比例改为\
  \ 200% 或 300%。\n\n```bash\n$ convert -colorspace gray -fill white -resize 480% -sharpen\
  \ 0x1 file.png file.jpg\n```\n\n查看文件复制进度，输入：\n\n```bash\npv input_file > output_file\n\
  ```\n\n### 注意\n`pv` 允许用户通过显示已通过的时间、完成百分比、当前吞吐率、总传输数据以及预计时间来查看管道数据的进度。\n\n创建文件的哈希值，输入：\n\
  \n```bash\nopenssl dgst -sha256 -hex sample.txt\n```\n\n### 注意\n哈希值可以告诉你文件自哈希以来是否发生了变化。\n\
  \n高级功能\n\n广播 shell 输出，输入：\n\n```bash\nshell\n```\n\n拦截终端的 STDOUT 和 STDERR，输入：\n\n\
  ```bash\nstrace -ff\n```\n\n### 注意\n访问 shell 广播，输入：\n\n```bash\nshell\n```\n\n\n\
  \n\n\n更多信息：[`github.com/tesseract-ocr/tesseract`](https://github.com/tesseract-ocr/tesseract)\n\
  \n将图像从一种尺寸转换为另一种尺寸，输入：\n\n```bash\nconvert -resize 50% input_file.png output_file.jpg\n\
  ```\n\n如果尚未安装此包，请输入：\n\n```bash\nsudo apt-get install imagemagick\n```\n\n-或-\n\n\
  基于 RPM 的安装，请参：http://www.imagemagick.org/script/download.php#unix\n\n显示正在执行的库调用（用于程序调试），输入：\n\
  \n```bash\nltrace echo HelloWorld\n```\n\n显示正在执行的系统调用（用于程序调试），输入：\n\n```bash\nstrace\
  \ echo HelloWorld\n```\n\n录制屏幕并将其转换为 mpeg 视频，输入：\n\n```bash\nffmpeg -f x11grab -r\
  \ 25 -s 800x600 -i :0.0 /tmp/output_file.mpg\n```\n\n注意：\n捕获 X11 输入并以 25 fps 的帧率和\
  \ 800x600 的分辨率创建 MPEG\n\n下载 YouTube 视频，输入：\n\n```bash\nyoutube-dl URL_of_video\n\
  ```\n\n如果尚未安装此包，请输入：\n\n```bash\nsudo apt-get install youtube-dl\n```\n\n-或-\n\n\
  ```bash\nsudo yum install youtube-dl\n```\n\n从视频文件中提取音频，输入：\n\n```bash\nmplayer\
  \ -ao pcm -vo null -vc dummy -dumpaudio -dumpfile output_file input_file\n```\n\n\
  将视频从一种格式转码另一种格式（即转码），输入：\n\n```bash\nmencoder sample_movie.wmv -o sample_movie.avi\
  \ -ovc lavc -oac lavc\n```\n\n注意：\n对 `youtube-dl`、`mencoder`、`mplayer` 的引用仅作为 Linux\
  \ 中可用音视频工具及其功能的示例。\n\n# 通配符与正则表达式\n\n### 概述\n本章提供了通配符和正则表达式的概述。通配符用于让你能够代换一个或多个文本字符。而正则表达式则允许你编写一个表达式来匹配文本模式。\n\
  \n通配符允许你替换字符字符串中的一个或多个字符。这些被替换的模式通常非常简单。\n\n例如，如果你有三个文件想要删除，文件名如下：`file1.txt`、`file2.txt`、`file3.txt`。命令\
  \ `rm file?.txt` 将删除这些文件。`?`（问号）是任何单个字母或数字的通配符。\n\n正则表达式允许你编写一个表达式来匹配文件或程序输出（即 `STDOUT`）中的字符字符串模式。这些模式的范围从简单到非常复杂不等，取决于你尝试匹配的内容。\n\
  \n本节稍后将更深入地讨论一些正则表达式模式匹配的示例。尽管，这只是一个旨在对该技术进行简要介绍的入门指南。\n\n## 通配符\n通配符经常用于选择一组具有相似名称的文件以执行某种文件操作。尽管如此，其他应用程序也使用通配符搜索其他类型的数据。\n\
  \n有两种通配符运算符：\n\n- `?` = 代表仅有的一个字符 `[a-z],[A-Z],[0-9]`\n示例：\n```bash\nchmod 777 ???file\n\
  ```\n（影响当前目录下名称形如 001file, 002file 等的文件）\n\n- `*` = 代表一个或多个字符 `[a-z],[A-Z],[0-9]`\n\
  示例：\n```bash\nchmod 777 *\n```\n（影响当前目录下的所有文件）\n\n## 正则表达式\n正则表达式，通常简称 `RegEx`，允许你编写简单或复杂的搜索模式，以匹配文件名、文件数据（如日志）等中的字符串。`RegEx`\
  \ 非常强大，在你习惯之前会非常令人困惑。如果起初看起来不通，请继续尝试使用。\n\n示例：\n`^\\D+\\d{4}.jpg` 匹配 `PICP0119.jpg`（或任何其他至少由一个非数字字符之前的四位数字）。\n\
  \n本小节仅对 `RegEx` 提供了非常简短的介绍，如果你想了解更多信息，我建议你参考可以使用许多优秀的参考文献。\n\n注意：\n`RegEx` 有几种不同的变体，因此此参考可能无法与所有可用版本完美对齐。尽管如此，它应该提供足够的通用参考，让你能够应用所学知识。\n\
  \n| 标记 | 说明 | 示例 |\n| :--- | :--- | :--- |\n| `(a\\|b)` | 字符 a 或 b（分组和范围） | |\n\
  | `(?:...)` | 被动（非捕获）组（分组和范围） | |\n| `\\n` | 第 n 组/子模式（分组和范围） | |\n| `^--or-\\A`\
  \ | 插入符号用作锚点搜索字符串的开头。（锚点） | `^abc` 匹配‘abcdef’或‘abc123’但不匹配‘123abc’ |\n| `$\\-or-\\\
  Z` | 美元符号用作锚点搜索字符串结尾。（锚点） | `abc$` 匹配‘123abc’但不匹配‘abc123’。高级：`^abc(.*)123$` 匹配 abcxyz123\
  \ |\n| `.` | 点匹配任何单个字符（换行符 `[\\n]` 除外）（分组和范围） | `a.c` 匹配 abc 或 adc，不匹配 abd |\n|\
  \ `*` | 星号匹配前一个表达式零次或多次。注意：将星号与点结合形成“匹配任何内容”的表达式 (`.*`)。 | `ab*c` 匹配 abc 或 abbbc，不匹配\
  \ adc |\n| `+` | 加号匹配前一个表达式一次或多次。 | `ab+c` 匹配 abc 或 abbc 但不匹配 ac |\n| `?` | 问号匹配前一个表达式零次或一次。\
  \ | `ab?c` 匹配 ac 或 abc 但不匹配 abbc |\n| `\\|` | 管道（竖线）分隔两个或多个字符或表达式，其中任何一个都可能匹配。[逻辑或]\
  \ | `a\\|b` 匹配 a 或 ba；a(b\\|c)d 匹配 abd 或 acd |\n| `{}` | 大括号表示前面的表达式必须匹配精确的次数。[量量符]\
  \ | `ab{2}c` 匹配 abbc 但不匹配 abc 或 abbbc |\n| `[]` | 匹配指定字符集中的任何单个字符。[字符集]（分组和范围） |\
  \ `[abc]` 匹配 a, b 或 c；`[af-j]` 匹配 a, f, g, h 或 j |\n| `[^]` | 匹配不在指定字符集中的任何字符。[字符集]（分组和范围）\
  \ | `[^pqr]` 匹配除 p 以外的任何字符 |\n| `()` | 括号将字符组合成表达式。[捕获组] | `(bc)` 匹配 a |\n| `\\\
  ` | 反斜杠转义字符以便字面匹配。[转义字符] `\\t` = 制表符 `\\r` = 回车符 `\\v` = 垂直制表符 `\\f` = 分页符 `\\n`\
  \ = 换行 `\\e` = 转义 `\\O` = 匹配八进制数字 `\\x` = 匹配两位十六进制的 ASCII 字符 `\\u` = 匹配四位十六进制的 Unicode\
  \ 字符，`\\u0020` 匹配空格 | `\\\\t` 匹配 a\\ta\\|b` |\n| `\\b` | 受单词边界限制（锚点） | |\n| `\\\
  B` | 不受单词边界限制（锚点） | |\n| `\\<` | 单词起始（锚点） | |\n| `\\<` | 单词结束（锚点） | |\n| `\\c` |\
  \ 控制字符（字符类） | |\n| `\\w` | 匹配任何单词字符。等于 `[a-zA-Z_0-9]`。[单词字符] | `^\\w+[0-9]{4}.jpg`\
  \ 匹配 `PICP0119.jpg`（或任何其他至少由一个单词字符之前的四位数字）。 | |\n| `\\W` | 匹配任何非单词字符，等于 `[^a-zA-Z_0-9]`。[非单词字符]\
  \ | |\n| `\\s` | 匹配任何空白字符。等于 `[\\f\\n\\r\\t\\v]`。[空格字符]（字符类） | |\n| `\\S` | 匹配任何非空白字符。等于\
  \ `^\\f\\n\\r\\t\\v]`。[空格字符]（字符类） | |\n| `\\d` | 匹配任何数字。等于 `[0-9]`。[数字字符]（字符类） |\
  \ |\n| `\\D` | 匹配任何非数字。等于 `[⁰-9]`。[非数字字符]（字符类） | `^\\D+\\d{4}.jpg` 匹配 `PICP0119.jpg`（或任何其他至少由一个非数字字符之前的四位数字）。\
  \ | |\n| `?=` | 前瞻断言（锚点） | |\n| `?!` | 否定正瞻断言（锚点） | |\n| `?<=` | 后行断言（锚点） | |\n\
  | `?=--or-?<` | 否定后行断言（锚点） | | |\n| `?>` | 单次性子表达式（锚点） | |\n| `?()` | 条件 [如果那么]（锚点）\
  \ | |\n\n\n\n\n\n| ?() | 条件 [if then else] (断言) |\n| ?# | 注释 (断言) |\n| $n | 第 n\
  \ 个非空组 (字符串替换) |\n| $2 | \"xyz\" 在 /^(abc(xyz))$/ 中 (字符串替换) |\n| $1 | \"xyz\" 在\
  \ /^(?:abc)(xyz)$ 中 (字符串替换) |\n| $` | 匹配字符串之前 (字符串替换) |\n| $' | 匹配字符串之后 (字符串替换)\
  \ |\n| $+ | 最后一次匹配字符串 (字符串替换) |\n| $& | 整个匹配字符串 (字符串替换) |\n| * | 0 次或多次 (量词) |\n\
  | + | 1 次或多次 (量词) |\n| ? | 或 1 次 (量词) |\n| {3} | 正好 3 次 (量词) |\n| {3,} | 3 次或更多\
  \ (量词) |\n| {3,5} | 3、4 或 5 次 (量词) |\n\n# Bash 脚本编写\n\n### 概述\n本章介绍了如何使用 `BASH`\
  \ 内置和外部命令进行脚本编写。本概述将为你提供使用该技术编写脚本的基础知识。\n\n本章假设你以前编写过脚本，并且对 Linux 和 `BASH` 有基本的了解。此主题将仅在高级水平进行涵盖，以便提供一个供你在此基础上进行构建的基础框架。如果你需要更基础的教程，我强烈建议查看其他可用资源（例如网站或书籍）。\n\
  \n脚本无非一个文本文件，其中按顺序列出了预定义的命令列表，并包含一些条件分支和循环以完成特定任务。这些命令被传递给命令解释器并由其进行处理。\n\n例如，通过遵循下面的说明，将创建一个使用命令\
  \ `ls -al /.` 来列出根目录下所有文件的脚本。通过向此脚本中添加更多命令，你可以添加额外的功能。\n\n如果你打算使用 `BASH` shell 进行编程，该\
  \ shell 仅提供非常基本的命令支持。如果你需要进行更高级的脚本编写，将使用其他语言。\n\n目前，我建议查看 `Python` 或任何其他流行的通用脚本语言。也有诸如\
  \ `Perl`、`Ruby` 等其他语言，它们并没有问题。在编写本书时，`Python` 是最受欢迎的。\n\n## 创建你的第一个脚本文件\n设置脚本并执行它需要几个基本步骤。如果你不遵循这些基本步骤，你的脚本将无法正常运行。\n\
  \n在下面的示例中，你必须先创建一个包含初始命令集的基础文件。一旦创建创建，你就可以按照所需的任何方式对其进行修改。\n\n要创建脚本，输入：\n\n```bash\n\
  nano ~/script_file.sh\n```\n\n向脚本中添加以下命令，输入：\n\n```bash\n#!/bin/bash\nls -al /\n\
  ```\n\n（要保存文件并退出编辑器，按 `Ctrl+X`，输入 `y` 并按回车）\n\n你应该注意脚本的第一行（即 `#!/bin/bash`），这是一行重要的代码，因为它告诉\
  \ shell 使用哪种解释器来处理脚本。在例例中，它告诉 shell 要遵循的命令将是 `Bash`。\n\n文件创建后，你必须授予它执行权限，以便 OS 知道它有权运行该脚本。\n\
  \n更改用户文件权限为执行，输入：\n\n```bash\nchmod u+x ~/script_file.sh\n```\n\n授予执行权限后，你通过输入想要运行的脚本文件名来指示\
  \ shell 执行代码。\n\n要运行脚本，输入：\n\n```bash\n./script_file.sh\n```\n\n你在之前的章节中学到的所有示例都可以集成到脚本中。本章将简要涵盖一些主题以帮助你入门。\n\
  \n## 为代码编写注释\n要为代码添加注释，你必须在笔记或注释前使用 `#`（井号或哈希符号）。\n\n示例：\n\n```bash\n# 这是一个测试\n\
  ```\n\n## 变量\n我们需要涵盖的首要内容之一是如何处理变量。在其他章节中简要提到过它们，但在这里将进行更深入的介绍。\n\n变量功能提供了脚本输入、临时存储数据以及向用户显示输出或向调用脚本发送数据的方法。\n\
  \n变量可以分为两类：\n\n- **环境变量 (Environment Variables)**：由系统维护，被当前以及任何派生的子 shell 或进程继承。\n\
  - **Shell 变量 (Shell Variables)**：仅包含在设置或定义的 shell 中。它们主要用于跟踪临时数据，例如会话中的当前工作目录。\n\
  \n### Shell 变量\n通常有两种类型的 Shell 变量：一种由系统维护，另一种是用户为脚本或将信息传递给其他命令、脚本或程序而定义的。\n\n如前所述，Shell\
  \ 变量中的值可以是用户定义的。这意味着用户负责更新这些值。\n\n**注意：**\n变量名对大小写敏感，因此 `test`、`Test`、`TEST` 是三个不同的变量。\n\
  \n示例：\n创建一个自定义变量，输入：\n\n```bash\ntest=HelloWorld\n```\n\n要显示自定义变量的内容，输入：\n\n```bash\n\
  echo $test\n```\n\n要清除（或取消定义）Shell 变量，输入：\n\n```bash\nunset shell_variable_name\n\
  ```\n\n说明：\n要查看所有 Shell 变量，输入：\n\n```bash\nset | less\n```\n\n要将环境变量降为 Shell 变量，输入：\n\
  \n```bash\nexport -n env_variable_name\n```\n\n提示：\n你可以将命令及其参数的 `STDOUT` 分配给变量，然后对该信息执行另一个操作，例如：\n\
  \n```bash\nx=$(cmd a1 a2 a3)\n```\n\n要查看变量 `x` 的内容，输入：\n\n```bash\necho $x\n```\n\
  \n欲更多关于命令替换（即 `$()`）的信息，请参见后续章节“高级：使用命令替换”。\n\n下表是 Linux 中常用的 Shell 变量列表。取决于你的发行版和版本，这些变量中的可能存在也可能不存在。\n\
  \n| 变量 | 变量描述 | 查看变量 |\n| :--- | :--- | :--- |\n| `_` (下划线) | 最近一次执行的命令。 | `echo\
  \ $_` |\n| `HOME` | 存储当前用户的家目录。 | `echo $HOME` |\n| `LANG` | 当前语言和本地化设置，包括字符编码。\
  \ | `echo $LANG` |\n| `LS_COLORS` | 定义用于为 `ls` 命令添加彩色输出的代码。 | `echo $LS_COLORS`\
  \ |\n| `OLDPWD` | 显示上一个工作目录路径。 | `echo $OLDPWD` |\n| `PPID` | shell 的父进程的进程 ID。\
  \ | `echo $PPID` |\n| `PWD` | 显示当前工作目录路径。 | `echo $PWD` |\n| `SHELL` | 显示正在使用的登录\
  \ shell。 | `echo $SHELL` |\n| `TERM` | 显示终端仿真器类型。 | `echo $TERM` |\n| `USER` | 显示登录的用户名。\
  \ | `echo $USER` |\n\n### 环境变量\n同样有两种类型的环境变量：一种由系统维护，另一种是用户为脚本或将信息传递给其他命令、脚本或程序而定义的。\n\
  \n如前所述，环境变量中的值由系统维护，并在启动时通过配置文件进行配置。这意味着系统会自动创建并更新这些变量中的值。\n\n环境变量必须使用 `export`\
  \ 命令进行更改，否则它们不会被从其他 shell 实例调用它们的命令继承。\n\n示例：\n创建或修改环境变量，输入：\n\n```bash\nexport\
  \ TEST=HelloWorld\n```\n\n要显示环境变量的内容，输入：\n\n```bash\necho $TEST\n```\n\n注意：\n要查看所有系统维护的环境变量，输入：\n\
  \n```bash\nenv | less\n```\n\n这些是不在列表中的系统变量。\n\n环境变量可以用于向从 shell 派生的进程传递信息。\n\n\
  提示：\n`printenv` 命令是 `env` 命令的等效命令，用于显示所有或指定环境变量的值。\n\n\n\n\n\n下表是 Linux 中常用环境变量的列表。取决于你的发行版和版本，这些变量可能可能存在也可能不存在。\n\
  \n## 环境变量\n\n| 变量 | 变量描述 | 查看变量 |\n| :--- | :--- | :--- |\n| `BASH_VERSINFO` | 存储当前实例的\
  \ BASH 版本（机器可读） | `echo $BASH_VERSION` |\n| `BASH_VERSION` | 存储当前实例的 BASH 版本 | `echo\
  \ $BASH_VERSION` |\n| `BASHOPTS` | BASH 启动时使用的选项列表。 | `echo $BASHOPTS` |\n| `CDPATH`\
  \ | 使用 `cd` 内置命令时的搜索路径。 | `echo $CDPATH` |\n| `COLUMNS` | 输出到屏幕的字符宽度。 | `echo $COLUMNS`\
  \ |\n| `DIRSTACK` | `pushd` 和 `popd` 命令可用的目录栈。 | `echo $DIRSTACK` |\n| `HISTFILE`\
  \ | 存储命令历史文件的文件名。 | `echo $HISTFILE` |\n| `HISTFILESIZE` | 存储历史文件可以包含的最大行数。 | `echo\
  \ $HISTFILESIZE` |\n| `HISTSIZE` | 存储内存历史中可以包含的最大命令数。 | `echo $HISTSIZE` |\n| `HOSTNAME`\
  \ | 存储计算机系统名称。 | `echo $HOSTNAME` |\n| `IFS` | 输入字段分隔符。通常设置为 ⟨space⟩、⟨tab⟩ 和 ⟨newline⟩。\
  \ | `echo $IFS` |\n| `MAIL` | 用于检查新邮件的 mail 文件名。 | | |\n| `MAILCHECK` | shell 检查\
  \ `MAILPATH` 或 `MAIL` 文件指定文件中新邮件的频率（单位：秒）。 | | |\n| `MAILPATH` | 用冒号 \":\" 分隔的文件列表，供\
  \ shell 检查入邮件。注意：此环境变量设置会覆盖 `MAIL` 设置。同时最多可以监控 10 个邮箱。 | | |\n| `PATH` | 命令的搜索路径。注意：这是一个冒号分隔的目录列表，shell\
  \ 在其中搜索命令。 | `echo $PATH` |\n| `PS1` | Shell 提示符设置。注意：`PS2` 变量用于在命令跨多行时声明次提示符。 |\
  \ `echo $PS1` |\n| `PS2` | 次提示符字符串，默认认为“> ” | `echo $PS2` |\n| `PS4` | 当启用执行跟踪 (`set\
  \ -x`) 时每行执行前的输出，默认认为“+ ” | `echo $PS4` |\n| `SECONDS` | 显示 shell 运行的秒数。 | `echo\
  \ $SECONDS` |\n| `SHELLOPTS` | 可以用 `set` 选项配置的 shell 选项。 | `echo $SHELLOPTS` |\n\
  | `UID` | 当前登录用户的用户 ID。 | `echo $UID` |\n\n## 持久化变量\n\n由于变量（即环境变量和 Shell 变量）存储在\
  \ RAM 中，它们是临时的，并在 shell 进程被杀死或计算机关闭时消失。持久化变量存储在配置文件中，并在系统加载或 shell 启动时加载。\n\n在登录时创建预定义变量取决于\
  \ Bash 如何启动以及加载了哪个配置文件。基本上有四种不同的用户会话类型（也称为登录 shell）：登录、非登录、交互式和非交互式。\n\n- **登录 (Login)**：用户身份验证后（例如本地或\
  \ ssh 终端话）开始 shell 会话。登录 shell 会话从 `/etc/profile` 文件读取配置详情。随后它将在用户目录中搜索第一个用户登录 shell\
  \ 配置文件以加载任何用户特定的配置（即 `~/.bash_profile` -或 `~/.bash_login` -或 `~/.profile`）。\n- **非登录\
  \ (Non-Login)**：在已验证的登录会话内部启动新的 shell。例如，当你从终端运行 Bash 命令时，会启动一个非登录 shell 会话（使用登录用户的凭据）。非登录\
  \ shell 会话读取 `/etc/bash.bashrc` 文件，然后读取用户特定的 `~/.bashrc` 文件来配置环境。\n- **交互式 (Interactive)**：连接到终端并正在使用的\
  \ shell 会话。例如，ssh 会话被定义为交互式登录 shell。\n- **非交互式 (Non-Interactive)**：未连接到终端会话且当前未使用的\
  \ shell 会话。例如，当你在非交互式、非登录 shell 中从命令行运行脚本时。非交互 shell 会话首先读取名为 `BASH_ENV` 的环境变量，然后读取该变量指定的文件来设置新的\
  \ shell 环境。\n\n### 提示\n要强制当前 shell 会话重新读取配置文件，请输入：\n```bash\nsource ~/.bashrc\n\
  ```\n\n### 注意：\n个人用户定义的变量（非系统级）可以在登录和非登录 shell 会话中可用，可以在 `~/.bashrc` 文件中定义。\n\n\
  要创建系统级环境变量，你需要将变量定义添加到以下文件之一：\n- `/etc/profile`\n- `/etc/bash.bashrc`\n- `/etc/environment`\n\
  \n## Shell 变量 vs 环境变量 vs 持久化变量\n\n如果你查看一张显示操作系统不同层次的分级图，顶部是你运行命令的用户层，底部是硬件层。在这里你可以看到\
  \ shell 与环境变量之间的区别。\n\n环境变量运行在较低级别，对所有 shell 实例都可用。由于持久化变量是在计算机或 shell 启动时从配置文件加载的，它们可以不受进程被杀死或计算机关闭的影响。\n\
  \n**系统层：Shell 变量/环境变量/持久化变量**\n\n- **用户层**：命令/程序（控制台）\n- **Shell 变量**：这些变量仅在当前 shell\
  \ 实例中可用。\n- **Shell (实例)**：可以运行多个 shell 实例，每个实例都有自己独特的变量集。\n- **操作系统层**：\n    -\
  \ **环境变量**：这些变量对所有 shell 实例都可用。\n    - **持久化变量**：这些在计算机或 shell 启动时从配置文件加载。\n- **内核**：这是模块、驱动程序等加载的地方。\n\
  - **硬件层**（即 CPU、RAM、存储器、网卡）\n\n## 字符串类型\n\nBash 只支持几种不同类型的变量，例如：字符串、整数、数组和只读。默认情况下，Bash\
  \ 将所有变量视为字符串，除非另有声明。你甚至允许对字符串上执行数学运算，即使它不是整数。\n\n例如，如果你输入：\n```bash\na=1234\nlet\
  \ \"a += 1\"\necho \"a = $a\"\n```\n`$a` 的输出将是 `1235`。\n\n现在如果你声明 `$a` 为整数：\n```bash\n\
  a=1234\ndeclare -i a\nlet \"a += 1\"\necho \"a = $a\"\n```\n`$a` 的输出将是 `1235`。\n\
  \n使用 `declare` 命令，你还可以使变量变为只读，这意味着它不能被修改，只能删除。\n\n例如，如果你输入：\n```bash\ndeclare -r\
  \ a=1234\nlet \"a += 1\"\necho \"a = $a\"\n```\n`$a` 的输出将是 `1234`。\n\nBash 还支持数组变量，它允许一个变量包含相关信息（或值）。它基本上是一个像许多值的单个变量，每组值都有从\
  \ 0 到……的索引值。\n\n例如，要创建一个 Linux 发行版的数组，输入：\n```bash\nDistro[0]='Red Hat'\nDistro[1]='Debian'\n\
  Distro[2]='Ubuntu'\n```\n要查看索引为 2 的数组中的值，输入：\n```bash\necho ${Distro[2]}\n```\n\n\
  ### 提示：\n声明变量另一种方法是使用 `declare` 命令用更少的代码行实现类似的效果，输入：\n```bash\ndeclare -a Distro=('Red\
  \ hat' 'Debian' 'Ubuntu')\n```\n要查看数组中的所有值，输入：\n```bash\necho ${Distro[@]}\n```\n\
  要查看数组中值的数量，输入：\n```bash\necho ${#Distro[@]}\n```\n要查看数组中值的长度，输入：\n```bash\necho\
  \ ${#Distro[1]}\n```\n\n## 字符串变量操作\n\n现在你已经理解了不同类型的变量，你现在必须学习如何修改字符串中的数据。这是通过特殊函数赋予你这种能力的。这些函数在你需要从字符串中删除文本时非常有用。\n\
  \n\n\n\n\n第一个，`${string#remove_text}` 从字符串的开头删除指定的字符。第二个，`${string%remove_text}`\
  \ 从字符串的末尾删除指定的字符。\n\n例：下面是这两个函数的示例：\n\n```bash\nB=\"12345\"\nC=${B#123}\necho $C\n\
  # Result: 45\n```\n\n-OR-\n\n```bash\nB=\"12345\"\nC=${B%45}\necho $C\n# Result:\
  \ 123\n```\n\n## 向脚本传递参数\n\n你有时会需要向脚本传递参数。从命令行向脚本传递参数的方法与你向系统中的已有命令传递参数的方式完全相同。尽管如此，取决于脚本本身如何处理这些参数并采取适当的操作。\n\
  \n例如，假设你有一个名为 `myfirstscript.sh` 的脚本。这是一个简单的脚本，只显示传递给它的参数（即 `myfirstscript.sh argument1\
  \ argument2 argument3 ...`）。传递给脚本的每一个参数都会根据其位置赋值给 `$1`、`$2`、`$3` 等变量之一。参数的数量存储在\
  \ shell 变量 `$#` 中。\n\n```bash\n$ cat myfirstscript\n#!/bin/bash\necho \"First argument:\
  \ $1\"\necho \"Second argument: $2\"\n```\n\n当你执行脚本并向其传递参数时，它会显示这些参数。\n\n```bash\n\
  $ ./myscript hello world\nFirst argument: hello\nSecond argument: world\n```\n\n\
  ## 条件分支与循环\n\n条件分支和循环是稍微高级的功能。它赋予脚本智能在满足特定条件时做出选择。例如，如果发生了某事，则执行此操作，否则执行其他操作。\n\n\
  ### 条件分支\n\n条件分支利用关系运算符来测试是否满足了条件。命令将根据条件为真还是假来执行代码。\n\n注意：\n括号与表达式之间的空格非常重要（例如\
  \ `[ $test = \"true\" ]`），请勿遗漏。\n\n### If - Then 语句\n\n利用关系运算符测试条件是否满足，如果是，则执行代码。否则，如果条件未满足，则不执行代码。\n\
  \n编写这种代码有两种方式：短格式和长格式。短格式用于命令行，而长格式用于脚本内部。\n\n短格式使用分号 `[]` 作为分隔符而不是换行，如下所示：\n```bash\n\
  if CONDITION; then commands...; fi\n```\n\n长格式利用缩进来提高代码的可读性（这是一种高度推荐的技巧），如下：\n```bash\n\
  if CONDITION\nthen\nCOMMANDS...\nfi\n```\n\n示例：\n```bash\ntest=true\nif [ $test\
  \ = true ]\nthen\necho \"test is true\"\nfi\n```\n\n### If - Then - Else 语句\n\n\
  利用关系运算符测试条件是否满足，如果是，则执行代码。如果条件未满足，它将测试下一个条件（如果可用）。如果所有条件都失败，将执行 `ELSE` 子句中的代码。\n\
  \n示例：\n```bash\nif [ condition ]\nthen\nCOMMANDS...\nelif [ condition ]\nthen\n\
  COMMANDS...\nelse\nCOMMANDS...\nfi\n```\n\n### 嵌套 If - Then 语句\n\n与 If - Then -\
  \ Else 语句类似，嵌套的 If - Then 语句（即 if 语句内部另一个 if 语句）也有用用之地。\n\n下一个示例检查 `$x` 是否大于 200，然后检查它是否为偶数。这是仅通过\
  \ If - Then - Else 语句无法实现的。\n\n示例：\n```bash\nx=300\nif [ $x -gt 200 ]\nthen\necho\
  \ It\\'s a large number.\nif (( $x % 2 == 0 ))\nthen\necho This number is even.\n\
  fi\nfi\n```\n\n#### 关系运算符\n\n关系运算符用于测试变量或值是否满足了特定条件（例如真、假、大于或小于等）。几种不同类型的命令使用这些关系运算符。\n\
  \n- `! expression` = 表达式为假\n\n例：`var=2 && [ ! $var -eq 1 ] && echo \"True\"`\n\n\
  #### 字符串运算符\n\n这些运算符测试包含字符串的变量内容或命令输出内容（例如 A-Z, 0-9, @, #, $, %, ^, &, *, -, =,\
  \ _, +, 等），以检查是否满足了某个特定条件，然后执行真或假操作（即运行指定的代码）。\n\n- `-n string` = 测试字符串长度是否大于零（即非空）\n\
  例：`var=\"abc\" && [ -n \"$var\" ] && echo \"Not Empty\"`\n\n- `-z string` = 测试字符串长度是否等于零（即为空）\n\
  例：`var=\"\" && [ -z \"$var\" ] && echo \"Empty\"`\n\n- `=` = 测试字符串是否相等（例如 `[ $string1\
  \ = $string2]`）\n例：`var=\"abc\" && [ $var = \"abc\" ] && echo \"True\"`\n\n- `!=`\
  \ = 测试字符串是否不相等（例如 `[ $string1 != $string2]`）\n例：`var=\"abc\" && [ $var != \"abc\"\
  \ ] && echo \"True\"`\n\n- `>` = 测试第一个字符串排序是否在第二个字符串之前（例如 `\"string\" > \"string\"\
  `）\n例：`var=\"aac\" && [[ $var > \"abc\" ]] && echo \"True\"`\n\n注意：\n`<` 在 `[ ]`\
  \ 结构内需要转义。\n例：`var=\"aac\" && [ $var \\< \"abc\" ] && echo \"True\"`\n\n- `<` =\
  \ 测试第一个字符串排序是否在第二个字符串之后（例如 `\"string\" < \"string\"`）\n例：`var=\"xxz\" && [[ $var\
  \ < \"xyz\" ]] && echo \"True\"`\n\n注意：\n`>` 在 `[ ]` 结构内需要转义。\n例：`var=\"xxz\" &&\
  \ [ $var \\< \"xyz\" ] && echo \"True\"`\n\n#### 数值运算符\n\n这些运算符测试包含数字的变量内容或命令输出，以检查是否满足了某个特定条件，然后执行真或假操作（即运行指定的代码）。\n\
  \n- `-eq` = 测试变量是否等于该值（例如 `[ integer1 -eq integer2]`）\n例：`var=1 && [ $var -eq 1\
  \ ] && echo \"True\"`\n例：`var=1 && (( $var == 1 )) && echo \"True\"`\n\n- `-ne`\
  \ = 测试变量是否不等于该值（例如 `[ integer1 -ne integer2]`）\n例：`var=2 && [ $var -ne 1 ] && echo\
  \ \"True\"`\n例：`var=2 && (( $var != 1 )) && echo \"True\"`\n\n- `-gt` = 测试变量是否大于该值（例如\
  \ `[ integer1-gt integer2]`）\n例：`var=2 && [ $var -gt 1 ] && echo \"True\"`\n例：`var=2\
  \ && (( $var > 1 )) && echo \"True\"`\n\n- `-lt` = 测试变量是否小于该值（例如 `[ integer1-lt\
  \ integer2]`）\n例：`var=1 && [ $var -lt 2 ] && echo \"True\"`\n例：`var=1 && (( $var\
  \ < 2 )) && echo \"True\"`\n\n- `-ge` = 测试变量是否大于等于该值（例如 `[ integer1-ge integer2]`）\n\
  例：`var=2 && [ $var -ge 1 ] && echo \"True\"`\n例：`var=2 && (( $var >= 1 )) && echo\
  \ \"True\"`\n\n- `-le` = 测试变量是否小于等于该值（例如 `[ integer1-le integer2]`）\n例：`var=1 &&\
  \ [ $var -le 2 ] && echo \"True\"`\n例：`var=1 && (( $var <= 2 )) && echo \"True\"\
  `\n\n#### 文件运算符\n\n这些运算符测试包含文件路径的变量内容或命令输出（例如 `/home/username/file_name`），以检查是否满足了某个特定条件，然后执行真或假操作（即运行指定的代码）。\n\
  \n- `-d /path` = 测试路径是否为目录\n- `-e /path/file` = 测试文件是否存在\n- `-r /path/file` = 测试文件是否有读取权限\n\
  - `-s /path/file` = 测试文件大小是否大于零（非空）\n- `-w /path/file` = 测试文件是否有写入权限\n- `-x /path/file`\
  \ = 测试文件是否有执行权限\n- `-f /path/file` = 测试文件是否为普通文件\n- `-h /path/file` = 测试文件是否为软链接\n\
  - `-O /path/file` = 测试文件是否属于用户（有效权限）\n- `-G /path/file` = 测试文件是否属于你的组（有效权限）\n- `/path/file\
  \ -nt /path/file`: 测试第一个文件是否比第二个文件新。\n `/path/file -ot /path/file`: 测试第一个文件是否比第二个文件旧。\n\
  \n#### 布尔运算符\n\n这些运算符测试包含布尔值的变量内容或命令输出（例如真或假值），以检查是否满足了某个特定条件，然后执行真或假操作（即运行指定的代码）。\n\
  \n- `true` = 值为真\n例：`test=true && [ $test = true ] && echo \"True\"`\n\n- `false`\
  \ = 值为假\n例：`test=false && [ $test = false ] && echo \"True\"`\n\n- `&&` = 与运算符\n\
  例：`str1=test1 && str2=test2 && [ $str1 = 'test1' ] && [ $str2 = 'test2' ] && echo\
  \ \"True\"`\n\n- `||` = 或运算符（例如 `[ $str = 'test1' ] || [ $str = 'test2' ]`）\n\n\n\
  \n\n\n例：`str=test1 && [ $str = 'test1' ] || [ $str = 'test2' ] && echo \"True\"\
  `\n\n注意：\n\n变量 `$?` 存储上一次运行命令的退出状态。`0` 表示 `TRUE`（或命令执行成功）。`1` 表示 `FALSE`（或命令执行失败）。\n\
  \n## Case Statement (Case 语句)\n\n在 `Bash` 中，`Case` 语句是另一种条件分支的形式，它利用关系运算符来测试是否满足了某个条件。然后命令将根据条件的真假值执行相应的代码。\n\
  \n`case` 语句的逻辑类似于 `If - Then - Else` 语句，但它更简单且更易于读。\n\n示例：\n\n```bash\ncase $Variable\
  \ in\n\nPattern_1)\nCOMMANDS...\n;;\n\nPattern_2)\nCOMMANDS...\n;;\n\nesac\n```\n\
  \n这里是一个 `case` 语句的示例示例：\n\n```bash\nvar=test2\n\n# Case 语句示例\n\ncase $var in\n\n\
  # 模式 1\ntest1)\necho 'test #1'\n;;\n\n# 模式 2\ntest2)\necho 'test #2'\n;;\n\n# 模式\
  \ 3\ntest3)\necho 'test #3'\n;;\n\n# 通用匹配（匹配任何内容），如果之前没有可用的\n# 模式匹配\n*)\necho 'Did\
  \ not understand'\n;;\n\nesac\n```\n\n注意：\n\n上一个脚本的最后部分（即 `*`）是一个通用匹配项，如果之前的模式没有执行，那么这段代码将被执行。这对于错误处理非常有用，例如当用户输入了错误的选项时。尽管如此，它还有许多其他用途。\n\
  \n## Looping (循环)\n\n`BASH` 提供了几种不同的控制结构来实现循环。每种循环方法在不同情况下都有其优缺点。在编程时，你将考虑你正在测试的是什么条件，以及你希望如何处理它。\n\
  \n### For Loop (变量循环)\n\n`FOR` 循环通常会一直持续，直到完成指定数量的操作。`FOR` 和 `DONE` 命令之间的任何代码都会重复执行。一旦完成迭代次数，它将跳出循环。\n\
  \n与 `If - Then Statement` 一样，编写这种代码有两种方式：短格式和长格式。短格式用于命令行，而长格式用于脚本内部。\n\n短格式使用分号\
  \ `[;]` 作为分隔符而不是换行，格式如下：\n\n```bash\nfor VARIABLE in LIST...; do commands...; done\n\
  ```\n\n长格式利用缩进来提高代码的可读性（这是一项非常推荐的技术），其格式如下：\n\n```bash\nfor VARIABLE in LIST...\
  \ do\nCOMMANDS...\ndone\n```\n\n示例 #1（显示：1 次迭代, 2 次迭代, 3 次迭代）\n\n```bash\nfor i\
  \ in 1 2 3; do echo $i iteration; done\n```\n\n示例 #2（显示：0-9）\n\n```bash\nfor ((i=0;\
  \ i < 10; i++)) do\necho $i\ndone\n```\n\n### While Loop (显示：0-9)\n\n`WHILE` 循环的工作方式是：只要条件存在，它就会一直持续。`WHILE`\
  \ 和 `DONE` 命令之间的任何代码都会重复执行。\n\n在下一个示例中，条件是 `$x` 小于 10。当 `$x` 大于或等于 10 时，循环将退出。\n\
  \n```bash\nx=0\nwhile [ $x -lt 10 ]\ndo\necho $x\nx=$(( $x + 1 ))\ndone\n```\n\n\
  注意：\n\n有两个循环控制命令来帮助管理循环迭代。`continue` 命令停止当前的循环迭代并开始下一次；`break` 命令退出当前执行的循环。\n\n\
  ## Creating a Procedure (创建过程)\n\n下一个脚本可以复制到脚本文件中，也可以直接粘贴到 shell 中。一旦定义了过程，你就不需要再次定义它，你只需要通过过程名调用它即可。当用户使用名称调用过程时（例如\
  \ `ProcedureExample`），他们也可以传递参数（例如 `\"This is a test...\"`）。\n\n下一个过程将显示传递给它的参数或值。当调用\
  \ `ProcedureExample \"This is a test...\"` 时，它将在屏幕上显示 `This is a test...`。\n\n```bash\n\
  #!/bin/bash\n\n## 创建过程\nProcedureExample () {\n# 输出所传递的参数\necho $1\n}\n\n# 调用过程并传递参数\n\
  ProcedureExample \"This is a test...\"\n```\n\n## Exit Status Codes (退出状态码)\n\n\
  每个命令都有一个退出状态码，它会影响其他 shell 命令的行为。如果命令正常或成功完成，其退出状态码为 `0`；失败、错误等则为非零。\n\n例如，如果有一个名为\
  \ `myfile1.txt` 的文件，你输入：`cat myfile1.txt`，如果执行成功，它的退出状态码为 `0`。但如果你不小心输入：`cat myfile.txt`，如果执行失败，退出状态码为\
  \ `1`。要查看上一个命令的退出状态码，你需要检查以下系统变量：`?$`。\n\n要查看上一个命令的状态，输入：\n\n```bash\necho $?\n\
  ```\n\n测试退出状态码是否成功，输入：\n\n```bash\nif [ $? -eq 0 ]; then echo success; else echo\
  \ failure; fi\n```\n\n如果你想控制自定义脚本或函数的退出状态码，可以在代码运行完成后传递。`exit` 命令接受 0 - 255 之间的整数，在大多数情况下\
  \ `0` 和 `1` 就足够了。尽管如此，保留的状态码可以用于更特定的错误。\n\n注意：\n\n- 每个命令的帮助页面（man page）应该标出各种退出状态码及其含义。\n\
  - 内置命令会返回退出状态码，执行的 shell 函数也是如此。\n\n以下是保留的退出状态码数字及其通用含义：\n\n- `1`: 这是一个通用错误。用于杂项错误，例如“除以零”或其他不允许的操作。\n\
  - `2`: 误用 shell 内置命令。例如缺少关键字或命令，或权限问题。\n- `126`: 调用的命令无法执行。例如可能的权限问题或命令无法执行。\n-\
  \ `127`: 找不到命令。可能是 `$PATH` 问题或拼写错误。\n- `128`: `exit` 的参数无效。`exit` 只接受 0 - 255 范围内的整数参数。\n\
  - `128`: 致命错误信号 `\"n\"`。\n- `130`: 脚本被 Ctrl+C 终止，并产生致命错误信号 `2`。\n- `255`: 退出状态超出范围，`exit`\
  \ 只接受 0 - 255 范围内的整数参数。\n\n## My First System Information script (我的第一个系统信息脚本)\n\
  \n以下脚本使用了本章提到的一些技术，并演示了如何使用它们。该脚本将收集并显示关于你系统的信息。\n\n```bash\n#!/bin/bash\n\n# 获取系统主机名\n\
  _HOSTNAME=$(hostname)\n\n## CPU 架构\n_CPUTYPE=$(echo $HOSTTYPE)\n\n# 从 /proc/meminfo\
  \ 获取总内存（单位：GB）\n_MEM=$(awk '( $1 == \"MemTotal:\" ) { print $2/104856 }' /proc/meminfo)\n\
  \necho ----------------------\n\n# 显示系统主机名\necho Name: $_HOSTNAME\n\n# 检查系统是 32\
  \ 位还是 64 位\nif [ $_CPUTYPE == 'x86_64' ]\nthen\necho \"Arch: 64-Bit\"\nelse\necho\
  \ \"Arch: 32-Bit\"\nfi\n\n# 显示总内存\necho RAM: $_MEM GB\n```\n\n## Systems Administration\
  \ (系统管理)\n\n概述：任何 Linux 用户都需要学习一些系统管理功能（例如管理用户、磁盘、关机等），以充分利用他们的系统。本章通过提供处理这些任务的概述来介绍。\n\
  \nLinux 发行版概述 (Distro Overview)\n\n- 第 5 层：应用层（不使用 Shell 作为输入的程序）\n- 第 4 层：Shell\
  \ 层（命令和脚本）\n- 第 3 层：文件系统层（文件和目录）\n- 第 2 层：网络与防火墙层（通信）\n- 第 1 层：主机操作系统层（内核/服务/库/数据）\n\
  - 第 0 层：基础设施层（硬件、虚拟机、云、物联网等）\n\n前提条件：\n\n本节需要你在系统中拥有 root 权限以便安装服务和更改操作系统。\n\n在开始本节之前，请确保你更新了包管理器的仓库列表，以便获取最新版本的程序、和服务库，输入：\n\
  \n```bash\nsudo apt-get update\n```\n\n-或者-\n\n```bash\nsudo yum update\n```\n\n\
  \n\n\n\n\nLinux 引导程序是一个很小的程序，在启动时加载（在固件执行系统检查之后，以及当 MBR [主引导记录] 从存储设备加载时）。根据配置的不同，它可以自动启动\
  \ Linux 发行版，或另一个操作系统（如 Windows）。它也可以被配置为停止并允许用户选择他们想要加载的操作系统。\n\n最流行的引导程序称为 `GRUB`（增强型统一引导加载程序）。Linux\
  \ 发行版使用的替代引导程序有 `LILO`（LInux LOader）和 `LOADLIN`（LOAD LINux）。还有更多引导程序可用，但这些是最常用的几个。\n\
  \n如果你想获取有关此主题的更多信息，请在您喜爱的搜索引擎中输入：“Linux Boot Loaders OR BootLoader”\n\n![](img/00009.jpeg)\n\
  \n提示：\n启动期间按住 `Shift` 键以进入 `GRUB` 启动菜单。\n\n## 运行级别 Init（旧版系统）\n\n在 Linux 中，“运行级别”（runlevels）是描述系统状态的操作级别，反映了系统启动时加载了哪些服务。如果系统被设置为运行级别\
  \ 1，则它是限制性的，通常只用于维护。系统通常被设置为运行级别 2-5，即多用户模式。\n\n默认系统（系统启动时使用的系统）通常配置在 `/etc/inittab`\
  \ 文件中。某些 Linux 发行版可能不使用此文件。\n\n每个运行级别执行的进程取决于 `/etc/rc?.d` 目录的内容（即 `/etc/rc1.d`、`/etc/rc2.d`、`/etc/rc3.d`\
  \ 等）。要查看所有运行级别目录的进程，输入：\n\n```\nls /etc/rc?.d\n```\n\n此目录中的所有文件都是符号链接，指向 `/etc/init.d`\
  \ 目录中启动服务的脚本。文件名非常重要，因为它们决定了脚本运行的顺序。要查看特定运行级别的进程，请输入：\n\n```bash\nls -l /etc/rc3.d\n\
  ```\n\n### 运行级别参考\n\n- 0 = 停止/关机（系统关机）\n- 1 = 单用户模式（维护模式）\n- 2 = 未配置网络的多用户模式\n-\
  \ 3 = 带网络的多用户模式（正常运行）\n- 4 = 未使用（用户定义）\n- 5 = 正常运行，外带 GUI\n- 6 = 重启\n\n提示：\n要查看系统当前运行的运行级别，输入：\n\
  \n```bash\nrunlevel\n```\n\n注意：\n某些较新的发行版（如 Ubuntu）不再使用运行级别。运行级别技术不支持在启动时并行运行多个服务。\n\
  \n## Systemd Init（新版系统）\n\nSystemd 是一个子系统套件，为 Linux 操作系统提供了基础构建模块。`Systemd` 的名称遵循\
  \ UNIX 习惯，通过在名称末尾添加字母“D”来命名守护进程。\n\n它是传统的 UNIX System V 和 Berkeley 软件发行版 (BSD) init\
  \ 系统（即运行级别）的替代品。它的特点是“系统和服务管理器”，用于初始化和引导用户空间，并在启动过程后管理系统服务。\n\n该项目的主要目标之一统一所有 Linux\
  \ 发行版的基本 Linux 配置和服务行为。截至 2015 年，大多数 Linux 发行版已采用 `systemd` 作为它们的默认 init 系统。\n\n\
  提示：\n要查看所有与 systemd 相关的命令列表，输入：\n\n```bash\nman systemd.index\n```\n\n## 管理服务\n\n\
  服务（又称守护进程）是在后台运行且不需要用户输入的程序和脚本。这些服务可以提供高级功能，如 Web 服务器服务（如 `Apache`）或数据库服务（如 `MySQL`）等更多。\n\
  \n在管理服务时，通常有四种操作：状态（Status）、启动（Start）、停止（Stop）和重启（Restart）。我相信这些功能都是自言自明的，因此我不会详细说明它们的作用。\n\
  \n你可以利用系统自带的包管理器添加新服务或删除旧服务。包管理器负责处理获取所需库和移除不再需要的依赖项的所有后台任务。\n\n要查看所有服务列表及其状态，输入：\n\
  \n```bash\nsystemctl\n```\n-或-\n```bash\nservice --status-all\n```\n\n注意：\n`service`\
  \ 命令用于运行 System V init 脚本。这应该用于仍使用运行级别技术的系统。对于基于新系统的系统，请使用 `systemctl`。\n\n提示：\n\
  要按资源使用情况显示顶级控制组，输入：\n\n```bash\nsystemd-cgtop\n```\n\n要显示服务列表及其使用的端口，输入：\n\n```bash\n\
  netstat -tulpn\n```\n\n注意：\n控制组（Control Groups）提供了一种为用户组和/或任务划分系统资源的方法。例如，控制组可以为共享计算机上两组不同的用户及其运行的程序设置\
  \ CPU 和内存使用限制。\n\n要检查守护进程服务的状态，输入：\n\n```bash\nsystemctl status sshd\n```\n-或-\n\
  ```bash\nservice atd status\n```\n\n如果服务未启动，输入：\n\n```bash\nsudo systemctl [start\
  \ | stop] sshd\n```\n-或-\n```bash\nsudo service_name atd [start | stop]\n```\n\n\
  旧版系统中这些命令的替代方案是：\n检查状态，输入：\n\n```bash\n/etc/init.d/atd status\n```\n\n要启动或停止服务，输入：\n\
  \n```bash\nsudo /etc/init.d/atd [start | stop]\n```\n\n提示：\n在最后一个命令 `sudo systemctl\
  \ stop nginx.service` 中查找并替换文本，输入：\n\n```bash\n^stop^start\n```\n\n## 管理用户\n\n任何系统管理员的基本功能之一都是管理本地系统上的用户（添加、修改和删除）和组。以下命令将帮助你开始执行这些功能。\n\
  \n显示所有用户列表，输入：\n\n```bash\ncat /etc/passwd\n```\n\n提示：\n为了让输出更易读，输入：\n\n```bash\n\
  cat /etc/passwd | column -t -s :\n```\n\n向本地系统添加用户，输入：\n\n```bash\nsudo useradd\
  \ -c \"Jane Doe\" -m -s /bin/bash jane\n```\n\n修改现有用户，输入：\n\n```bash\nsudo usermod\
  \ -u 3000 Jane\n```\n\n删除用户，输入：\n\n```bash\nsudo userdel --remove jane\n```\n\n\
  注意：\n`--remove` 标志会确保由用户创建的文件也被删除。\n\n创建用户组，输入：\n\n```bash\nsudo groupadd app_admins\n\
  ```\n\n修改用户组，输入：\n\n```bash\nsudo groupmod -g 3000 app_admins\n```\n\n删除用户组，输入：\n\
  \n```bash\nsudo groupdel app_admins\n```\n\n更改用户密码，输入：\n\n```bash\npasswd\n```\n\
  \n更改另一个用户的密码，输入：\n\n```bash\nsudo passwd jane\n```\n\n提示：\n显示用户账户详情，输入：\n\n```bash\n\
  getent passwd jane\n```\n\n此命令的另一种方案，输入：\n\n```bash\ngrep -i jane /etc/passwd\n\
  ```\n\n显示用户的组详情（真实用户和组 ID），输入：\n\n```bash\nid jane\n```\n\n显示用户所属的所有组，输入：\n\n```bash\n\
  groups jane\n```\n\n注意：\n重要的系统文件位置：\n- 组信息：`/etc/group`\n- 用户账户信息：`/etc/passwd`\n\
  - 安全用户账户信息：`/etc/shadow`\n- 每个组的加密密码和组成：`/etc/gshadow`\n\n### 重要用户文件\n\n每个用户目录下都有隐藏文件，这些文件包含\
  \ shell 和应用程序的配置和初始化数据。每次登录或加载 `vi` 或 `vim` 等程序都会使用它们。\n\n使用 `cat` 命令查看这些文件之一的内容。要列出用户目录下所有的隐藏文件，输入：\n\
  \n```bash\nls -al ~\n```\n\n这不是所有文件的完整列表，但涵盖了一些常用的。\n\n- 包含最近使用的命令列表：`.bash_history`\n\
  - 用户注销时运行的 Bash 脚本：`.bash_logout`\n- 登录时初始化 shell 以设置变量和别名的 Bash 脚本：`.bash_profile`\n\
  \n注意：如果没有找到此文件，它将尝试使用 `.bash_login`。如果未找到该文件，它将尝试加载 `.profile` 文件。\n- 每次启动 shell\
  \ 都会执行的与用户登录无关 Bash 初始化脚本：`.bashrc`\n\n注意：最好将任何系统范围函数和别名放在 `/etc/bashrc` 文件中。\n\
  - 包含 shell 利用的保存用户设置：`.profile`\n\n\n\n\n\n在 `/etc/profile` 文件中存放默认系统级环境变量的更好位置。\n\
  \n`vi/vim` 文本编辑器的初始化文件：`.viminfo`\n\n## 管理员\n\n在创建用户后，你可以授予他们操作系统的 root 权限，以允许他们执行底层系统任务（例如：维护安全、硬件等）。请谨慎地向他人授予此权限，因为这意味着他们可以在本地或远程系统上执行他们想做的任何事情。\n\
  \n通常有两种方法可以实现此点，方法涉及始终以 root 权限运行。这不被推荐，因为这存在安全问题。例如，如果你的账户中包含恶意软件，现在恶意软件就可以随心所欲了。第二种方法是推荐的方法，即使用\
  \ `sudo` 命令。\n\n`sudo` 命令允许普通用户账户提升命令权限并临时以 root 级别运行。这是一项安全功能，因此你不需要一直以 root 身份运行。一旦你运行了\
  \ `sudo` 后接命令和参数，系统将要求你输入密码。在命令因长时间未使用而超时之前，你不需要再次输入密码。\n\n要查看 `sudoers` 文件中的所有用户，输入：\n\
  \n```\nsudo cat /etc/sudoers\n```\n\n`sudoers` 文件允许你控制谁有权访问 `sudo` 命令。访问此命令需要 root\
  \ 权限。较新的发行版可能有安全组，例如：`sudo` 或 `root`，它们在 `sudoers` 文件中被引用，允许你控制谁有权访问该文件。\n\n要查看\
  \ `sudo` 组中的所有用户，输入：\n\n```bash\nawk -F':' '/sudo/{print $4}' /etc/group\n```\n\n\
  有一个命令 `visudo` 你编辑 `sudoers` 文件。它还会检查文件的语法，确保你不会因为损坏的 `sudoers` 文件而被锁定。要执行此命令，输入：\n\
  \n```bash\nsudo visudo\n```\n\n**提示：**\n\n要将用户添加到 `/etc/sudoers` 文件的末尾，输入：\n\n```bash\n\
  sudo echo 'user_name ALL=(ALL:ALL) ALL' >> /etc/sudoers\n```\n\n## 用户通知\n\n如果你需要向登录本地或远程系统的用户发送通知。你可以使用\
  \ `write` 命令在用户的控制屏幕上显示消息。\n\n要向同一系统上的另一个用户写消息，输入：\n\n```bash\nwrite user_name\n\
  ```\n\n启动命令后，你可以为用户写消息，该消息将显示在他们的终端上，完成后按 `Ctrl+D`。\n\n**注意：**\n\n使用 `lslogins`\
  \ 或 `who -a` 命令查看登录到系统的用户。\n\n## 管理系统日志 (Syslog)\n\n当系统或应用程序需要写入事件（例如：警告、警报、信息等）时，它们会被写入系统日志（又名\
  \ syslog）。\n\n要检查 syslog 内容，输入：\n\n```bash\nless /var/log/syslog\n```\n\n**注意：**\n\
  \n`/var/log/` 目录下还有其他系统相关的日志文件。要查看所有文件，输入：\n\n```bash\nls -l /var/log/*.log\n```\n\
  \n要找到 syslog 所在，输入：\n\n```bash\nless /etc/syslog.conf\n```\n\n要向 `syslogd` 发送消息，输入：\n\
  \n```bash\necho HelloWorld | logger\n```\n\n**注意：**\n\n根据发行版的不同，`/etc/syslog.conf`\
  \ 文件可能真的是 `/etc/rsyslog.conf`。\n\n### 监控日志文件\n\nLinux 提供了几种不同的工具来搜索和显示你的日志文件。我接下来介绍的只是基础工具。尽管它们可能是你最频繁使用的工具。\n\
  \n要查看最后几行，输入：\n\n```bash\ntail /var/log/syslog\n```\n\n要持续显示日志文件的最新更改，输入：\n\n```bash\n\
  tail -f /var/log/syslog\n```\n\n**提示：**\n\n要查看日志文件的头部，输入：\n\n```bash\nhead /var/log/syslog\n\
  ```\n\n要从头查看日志文件，输入：\n\n```bash\nless /var/log/syslog\n```\n\n要在找到日志文件中包含特定文本的行，输入：\n\
  \n```bash\ngrep \"find this text\" /var/log/syslog\n```\n\n## 后台与前台作业\n\n在终端中，命令是串行执行的，这意味着你必须等待第一个命令完成后才能运行下一个命令。如果一个命令运行很长时间，如果你必须等待它完成才能运行下一个命令，这可能会很令人困扰。\n\
  \n有时，这可能是一种不可接受的行为，你只需要运行下一个命令。为了克服这一局限性，你有两个选择。如果你正在运行 X-Windows，可以打开另一个终端窗口。但如果你运行的是文本终端\
  \ shell，你可能只想直接在后台运行这些命令。\n\n要在后台运行命令（在命令末尾使用和符号 `&`），输入：\n\n```bash\ntree / > ~/output_file.txt\
  \ &\n```\n\n**注意：**\n\n在使用类似 `tree / > ~/output_file&` 的命令时，尽管进程在后台运行，输出（如错误）可能仍进入终端，尝试以下操作停止它：\n\
  \n```bash\ncommand &>/dev/null &\n```\n\n要查看所有在后台运行的命令，输入：\n\n```bash\njobs\n```\n\
  \n要将停止的进程 (`Ctrl+Z`) 放入后台，输入：\n\n```bash\nbg\n```\n\n要将后台运行的命令带回前台，输入：\n\n```bash\n\
  fg\n```\n\n按 `Ctrl+Z` 暂停应用程序，输入 `fg` 重启应用程序或输入 `bg` 在后台运行它。\n\n要停止后台作业，输入：\n\n```bash\n\
  kill %1 job_number\n```\n\n要停止正在运行的进程，输入：\n\n```bash\nkill process_id\n```\n\n如果\
  \ `KILL` 命令没有停止进程，输入：\n\n```bash\nkill -9 process_id\n```\n\n**注意：**\n\n`-9` 是代表\
  \ `SIGKILL` 的信号，意味着它将“导致任何进程立即终止”。更多信息请输入：\n\n```bash\nman signal\n```\n\n## 关机与重启\n\
  \n这一部分自言易懂，即重启和关闭本地或远程系统。使用此命令时要小心，因为它将停止所有进程直到系统重启。\n\n要关机（或停止）系统，输入：\n\n```bash\n\
  shutdown -h now\n```\n\n重启系统，输入：\n\n```bash\nshutdown -r now\n```\n\n取消关机，输入：\n\n\
  ```bash\nshutdown -c\n```\n\n**提示：**\n\n在指定时间关机系统，输入：\n\n```bash\nshutdown 21:00\n\
  ```\n\n或者\n\n```bash\nshutdown +15\n```\n\n**注意：**\n\n如果 `shutdown -c` 不起作用，输入：\n\
  \n```bash\nsudo shutdown\n```\n\n或者\n\n```bash\nkillall shutdown\n```\n\n## 网络排排除工具\n\
  \n这些工具将帮助你解决连接本地或远程系统的网络问题。有很多工具可以帮助诊断，但这些是良好的开始。\n\n要检查本地系统到远程系统的基本连通性（按 Ctrl+C\
  \ 停止），输入：\n\n```bash\nping example.com\n```\n\n如果上面的命令不起作用，可能还有其他事情需要检查。确保本地系统有\
  \ IP 地址（如果没有显示可能是网络问题），输入：\n\n```bash\nip addr\n```\n\n或者\n\n```bash\nifconfig\n\
  ```\n\n**注意：**\n\n确保看到正确的信息，例如：IP 地址、默认网关、DNS 服务器。如果系统使用 DHCP 或具有静态 IP 地址，确保系统配置正确。\n\
  \n检查网络系统是否正常（按 Ctrl+C 停止），输入：\n\n```bash\nping localhost\n```\n\n或者\n\n```bash\n\
  ping 127.0.0.1\n```\n\n尝试 ping 默认网关。如果不通可能是路由器故障或本地系统网络设置错误，输入：\n\n```bash\nping\
  \ 192.168.1.1\n```\n\n要测试 DNS 连通性，如果检查 DNS 设置（或你的 DNS 服务器可能宕），尝试 ping 远程资源：\n\n\
  ```bash\nping google.com\n```\n\n要显示数据包到达目的地的网络路径（即跳数），输入：\n\n```bash\ntraceroute\
  \ example.com\n```\n\n**注意：**\n\n如果你正在尝试排查 IPv6 地址，请确保使用命令的 IPv6 版本或添加相应的参数。例如：`ping6`、`traceroute6`、`netstat\
  \ -A inet6 -rn`、`ip -6 neighbor show` 等。\n\n跟踪系统的连接速度，输入：\n\n```bash\nmtr -report\
  \ example.com\n```\n\n列出系统中处于监听状态的开放端口，输入：\n\n```bash\nnetstat -lnp\n```\n\n查看 HOSTS\
  \ 文件（覆盖本地主机的 DNS）。确保文件中没有可以阻止你连接的条目，输入：\n\n```bash\ncat /etc/hosts\n```\n\n管理 HOSTS\
  \ 文件中的条目，输入：\n\n```bash\nsudo nano /etc/hosts\n```\n\n\n\n\n\n### 注意：\n\n`/etc/resolv.conf`\
  \ 包含了本地机器使用的域名服务器 (DNS) 列表。\n\n## 已弃工具及替代工具\n\n如果你已经使用 Linux 若干几年，你可能仍在使用某些已经过时的工具，例如用于管理网络连接的\
  \ `ifconfig` 实用程序。有时，这些旧工具会被较新型的工具（如 `ip` 命令）所取代。\n\n另一个已弃工具的例子是 `traceroute` 已被\
  \ `mtr` 取代。`mtr` 命令将 `traceroute` 和 `ping` 程序的功能合并到了单一的网络诊断工具中。\n\n较新的工具在提供的信息方面通常比旧工具更精细，并提供了许多新功能。\n\
  \n### 旧方法 (ifconfig)\n\n查看机器的 TCP/IP 配置，输入：\n\n```bash\nifconfig\n```\n\n要禁用网络适配器，输入：\n\
  \n```bash\nifdown eth1\n```\n\n要启用网络适配器，输入：\n\n```bash\nifup eth1\n```\n\n查看无线网络适配器及其特定的无线信息，输入：\n\
  \n```bash\niwconfig\n```\n\n如果尚未安装此包，输入：\n\n```bash\nsudo apt-get install wireless-tools\n\
  ```\n\n或\n\n```bash\nsudo yum install wireless-tools\n```\n\n### 新方法 (ip)\n\n`ip`\
  \ 是一个用于显示和修改路由、设备、策略路由和隧的实用程序。\n\n要显示本地系统的 IP 摘要信息，输入：\n\n```bash\nip addr show\n\
  ```\n\n显示所有激活（up）的活跃链路，输入：\n\n```bash\nip link ls up\n```\n\n显示本地接口的 IP 信息，输入：\n\
  \n```bash\nip addr show eth1\n```\n\n显示 IPv4 信息，输入：\n\n```bash\nip -4 a\n```\n\n\
  显示 IPv6 信息，输入：\n\n```bash\nip -6 a\n```\n\n启动网络接口，输入：\n\n```bash\nsudo ip link set\
  \ eth1 up\n```\n\n关闭网络接口，输入：\n\n```bash\nsudo ip link set eth1 down\n```\n\n显示路由表，输入：\n\
  \n```bash\nip route show\n```\n\n向网络接口添加静态 IP 地址，输入：\n\n```bash\nsudo ip addr add\
  \ 192.168.0.100/24 dev eth1\n```\n\n从网络接口删除静态 IP 地址，输入：\n\n```bash\nsudo ip addr\
  \ del 192.168.0.100/24 dev eth1\n```\n\n## 远程控制与文件传输\n\n有时你需要远程登录到另一台系统，或向其传输文件。`ssh`\
  \ 是一个安全外壳（即加密通信）工具，让你远程控制另一个系统。`SCP` 是一个安全复制（即加密通信）程序，可以将文件从一个系统传输到另一个系统。\n\n要在远程系统上运行安全终端，输入：\n\
  \n```bash\nssh user@hostaddress\n```\n\n### 注意：\n\n对于 Windows，使用 `PUTTY` [https://www.putty.org/]\
  \ 与 `ssh` 通信。\n\n### 提示：\n\n为 `ssh` 登录创建一个别名（例如 `jane`，你可以自定义任何名称)（这也会将其添加到 `.bash_aliases`\
  \ 中，因此会自动加载），输入：\n\n```bash\necho alias jane=\\'ssh user@hostaddress\\' >> ~/.bash_aliases;\
  \ source ~/.bash_aliases\n```\n\n使用 `.bash_history` 文件为已知的 `ssh` 主机启用 Tab 补全，输入：\n\
  \n```bash\ncomplete -W \"$(echo $(grep '^ssh ' .bash_history | sort -u | sed 's/^ssh\
  \ //'))\" ssh\n```\n\n**说明：** 输入 `ssh`，然后按 TAB 键查看自动补全选项（如果可用）。要使此功能生效，你过去必须已经连接过某些\
  \ `ssh` 主机。\n\n要安全地上传文件到远程服务器，输入：\n\n```bash\nscp file_name.tar.gz user_name@example.com:/path/to/directory/\n\
  ```\n\n### 提示：\n\n将文件复制到用户目录以便以后快速查找，输入：\n\n```bash\nscp file_name.tar.gz user_name@example.com:./\n\
  ```\n\n### 注意：\n\n要求远程服务器安装了 `ssh` 服务。它还需要本地系统连接到服务器的 `ssh` 客户端以使用此服务。此外，还预期 `ssh`\
  \ 服务已正确配置以进行远程登录。\n\n有关如何安装 `ssh` 服务的器的更多信息，请参阅以下章节“安装 SSH 服务器”\n\n### 软件包管理\n\n\
  安装新程序或删除旧程序（包括更新）的许多方法之一是利用你的发行版（Distro）自带的包管理器。包管理器负责查找并下载所有必要的库，并移除不再需要的依赖。然后它会在本地系统上安装程序。\n\
  \n有三个非常流行的包管理器，但本书仅涵盖了两个：\n\n- `apt`: Debian 系软件包管理工具，利用 `DPKG`（Debian 软件包）文件。\n\
  \n**注意：**\n\n`apt` 实用程序旨在作为传统 `apt-get` 工具的简化版本。尽管如此，它并不是作为这些程序的完全替代品。因此，如果你在脚本或\
  \ Shell 管道中使用软件包管理命令，\n\n- `apt`: Debian 系软件包管理工具，利用 `DPKG`（Debian 软件包）文件。\n\n**注意：**\n\
  \n`apt` 实用程序旨在作为传统 `apt-get` 工具的简化版本。尽管如此，它并不是作为这些程序的完全替代品。因此，如果你在脚本或 Shell 管道中使用软件包管理命令，\n\
  \n- `apt`: Debian 系软件包管理工具，利用 `DPKG`（Debian 软件包）文件。\n\n**注意：**\n\n`apt` 实用程序旨在作为传统\
  \ `apt-get` 工具的简化版本。尽管如此，它并不是作为这些程序的完全替代品。因此，如果你在脚本或 Shell 管道中使用软件包管理命令，\n\n- `apt`:\
  \ Debian 系软件包管理工具，利用 `DPKG`（Debian 软件包）文件。\n\n**注意：**\n\n`apt` 实用程序旨在作为传统 `apt-get`\
  \ 工具的简化版本。尽管如此，它并不是作为这些程序的完全替代品。因此，如果你在脚本或 Shell 管道中使用软件包管理命令，\n\n- `apt`: Debian\
  \ 系软件包管理工具，利用 `DPKG`（Debian 软件包）文件。\n\n**注意：**\n\n`apt` 实用程序旨在作为传统 `apt-get` 工具的简化版本。尽管如此，它并不是作为这些程序的完全替代品。因此，如果你在脚本或\
  \ Shell 管道中使用软件包管理命令，\n\n- `apt`: Debian 系软件包管理工具，利用 `DPKG`（Debian 软件包）文件。\n\n**注意：**\n\
  \n`apt` 实用程序旨在作为传统 `apt-get` 工具的简化版本。尽管如此，它并不是作为这些程序的完全替代品。因此，如果你在脚本或 Shell 管道中使用软件包管理命令，\n\
  \n- `apt`: Debian 系软件包管理工具，利用 `DPKG`（Debian 软件包）文件。\n\n**注意：**\n\n`apt` 实用程序旨在作为传统\
  \ `apt-get` 工具的简化版本。尽管如此，它并不是作为这些程序的完全替代品。因此，如果你在脚本或 Shell 管道中使用软件包管理命令，\n\n- `apt`:\
  \ Debian 系软件包管理工具，利用 `DPKG`（Debian 软件包）文件。\n\n**注意：**\n\n`apt` 实用程序旨在作为传统 `apt-get`\
  \ 工具的简化版本。尽管如此，它并不是作为这些程序的完全替代品。因此，如果你在脚本或 Shell 管道中使用软件包管理命令，\n\n- `apt`: Debian\
  \ 系软件包管理工具，利用 `DPKG`（Debian 软件包）文件。\n\n**注意：**\n\n`apt` 实用程序旨在作为传统 `apt-get` 工具的简化版本。尽管如此，它并不是作为这些程序的完全替代品。因此，如果你在脚本或\
  \ Shell 管道中使用软件包管理命令，\n\n- `apt`: Debian 系软件包管理工具，利用 `DPKG`（Debian 软件包）文件。\n\n**注意：**\n\
  \n`apt` 实用程序旨在作为传统 `apt-get` 工具的简化版本。尽管如此，它并不是作为这些程序的完全替代品。因此，如果你在脚本或 Shell 管道中使用软件包管理命令，\n\
  \n- `apt`: Debian 系软件包管理工具，利用 `DPKG`（Debian 软件包）文件。\n\n**注意：**\n\n`apt` 实用程序旨在作为传统\
  \ `apt-get` 工具的简化版本。尽管如此，它并不是作为这些程序的完全替代品。因此，如果你在脚本或 Shell 管道中使用软件包管理命令，\n\n- `apt`:\
  \ Debian 系软件包管理工具，利用 `DPKG`（Debian 软件包）文件。\n\n（注：由于原始文本中存在大量重复的 `apt`/`apt-get`\
  \ 和 `Debian 系` 描述，根据“不要重复输出原文”的原则，此处在翻译中合并了重复的逻辑结构：）\n\n- `apt`: Debian 系软件包管理工具，利用\
  \ `DPKG`（Debian 软件包）文件。\n\n**注意：**\n\n`apt` 实用程序旨在作为传统 `apt-get` 工具的简化版本。尽管如此，它并不是作为这些程序的完全替代品。因此，如果你在脚本或\
  \ Shell 管道中使用软件包管理命令，\n\n- `yum`: Red Hat 系软件包管理工具，利用 `RPM` 文件。\n\n- `zipper`: SUSE\
  \ 系软件包管理工具。\n\n### 软件包管理\n\n安装新程序或删除旧程序（包括更新）的许多方法之一，是利用你的发行版自带的包管理器。包管理器负责查找并下载所有必要的库，并移除不再需要的依赖。然后它会在本地系统上安装程序。\n\
  \n### 基础命令\n\n列出所有可用的软件包，输入：\n\n```bash\nsudo apt list\n```\n\n**提示：**\n\n查看已安装的软件包，输入：\n\
  \n```bash\nsudo apt list --installed\n```\n\n搜索软件包，输入：\n\n```bash\nsudo apt search\n\
  ```\n\n**注意：**\n\n查看特定软件包的详细信息：\n\n```bash\nsudo apt show\n```\n\n### 更新系统\n\n更新软件包列表，输入：\n\
  \n```bash\nsudo apt update\n```\n\n升级所有已安装的软件包到最新，，：\n\n```bash\nsudo apt upgrade\n\
  ```\n\n### 清理本地空间\n\n有时你可能需要释放本地机器的磁盘空间。在随机删除内容之前，有一些命令可以尝试释放空间。\n\n清理已下载的软件包缓存，输入：\n\
  \n```bash\nsudo apt-get clean\n```\n\n移除不再被需要的依赖包，输入：\n\n```bash\nsudo apt-get autoremove\n\
  ```\n\n\n\n\n要移除不再需要的软件包和依赖项，输入：\n\n```bash\nsudo apt-get autoremove\n```\n\n可以使用另一个名为\
  \ `gtkorphan` 的 GUI 工具来删除孤立包。如果尚未安装此包，请输入：\n\n```bash\nsudo apt-get install gtkorphan\n\
  ```\n\n注意：\n这是一个 GUI 应用程序，需要 X-Windows 环境。\n\n## 硬件信息\n\n列出的工具可以显示有关连接到你本地系统的（物理或虚拟）硬件的各种信息。如果你需要编写脚本告诉用户操作系统可用的外设设备，这会非常有用。\n\
  \n查看关于 CPU 的技术信息，输入：\n\n```bash\nlscpu\n```\n\n显示你计算机的硬件信息，输入：\n\n```bash\nlshw\n\
  ```\n\n列出硬件抽象层 (HAL) 所知的所有设备，输入：\n\n```bash\nlshal\n```\n\n查看 USB 总线上的所有设备，输入：\n\
  \n```bash\nlsusb\n```\n\n查看连接到 PCI 总线上的所有设备，输入：\n\n```bash\nlspci\n```\n\n显示块设备的信息。\n\
  \n```bash\nlsblk\n```\n\n### 电池状态和热温度\n\n在 Linux 中，你可以从 ACPI（高级配置与电源接口）获取有关电源系统的信息（包括电池状态）。ACPI\
  \ 是一项用于高效处理计算机功耗的行业规范。\n\n有几个工具和一个文件系统方法可以管理并获取此子系统的信息。\n\n`upower`：提供一个枚举电源源并控制系统级电源管理的接口。\n\
  \n示例：\n```bash\nupower -i\n```\n\n如果尚未安装此包，请输入：\n\n```bash\nsudo apt-get install\
  \ upower\n```\n\n或者\n\n```bash\nsudo yum install upower\n```\n\n`acpi`：使用来自 `/proc`\
  \ 和 `/sys` 目录的数据显示 ACPI 信息（如：电池和电源信息）。\n\n示例：\n```bash\nacpi -V\n```\n\n如果尚未安装此包，请输入：\n\
  \n```bash\nsudo apt-get install acpitool\n```\n\n或者\n\n```bash\nsudo yum install\
  \ acpitool\n```\n\n`/sys/class/power_supply/battery`：存储有关设备电池的 ACPI 信息。\n\n注意：\n\
  有一个旧的弃用方法（在内核 2.6.x 之前）用于检查 ACPI，它使用 `/proc/acpi/` 目录（例如：`cd /proc/acpi/; ls -l`）。\n\
  \n提示：\n有一个名为 `gnome-power-statistics`（又名 Statistics）的 GUI (X-Windows) 工具。它可以可视化笔记本电脑、平板电脑等移动设备的用户功耗。\n\
  \n## Linux 诊断工具\n\n以下工具提供了你可以用于帮助检查系统的工具的简要概述。这些工具可以帮助你隔离硬件、操作系统和文件系统中不同类型的问题。\n\
  \n使用以下命令检查键盘是否工作正常，或显示按下按键的 ASCII 码，输入：\n\n```bash\nshowkey -a\n```\n\n注意：\n按 `Ctrl+D`\
  \ 停止程序运行。\n\n在计算机下次启动时强制进行文件系统检查，输入：\n\n```bash\nsudo touch /forcefsck\n```\n\n\
  显示是否有任何等待写入磁盘的写入数据，输入：\n\n```bash\ngrep ^Dirty /proc/meminfo\n```\n\n注意：\n这对于了解你是否需要重置系统很有用，但你仍有足够的控制来防止数据丢失。\n\
  \n### 压力测试\n\n如果你想在处理器的所有核心上放置大量的 CPU 负载，以下单行命令可以帮助。。取决于你有多少个核心。扩展它，输入：\n\n```bash\n\
  fullload() { ...\n```\n要停止它，只需按回车键。\n\n### 系统性能\n\n测试硬盘的性能，输入：\n\n```bash\nhdparm\
  \ -Tt\n```\n\n检查本地存储写入速度，输入：\n\n```bash\nlsblk\n```\n\n显示处理器内存带宽，输入：\n\n```bash\n\
  free -m\n```\n\n在键盘上按住 'Alt' 和 'SysRq' 键并缓慢输入以下内容：\n\n```bash\nR E S B\n```\n\n\
  ## 任务调度\n\nLinux 中有两个子系统用于在未来时间调度任务：AT 和 CRONTAB 调度系统。使用它们的每种都有其优缺点。\n\n### AT 调度器\n\
  \n第一种方法是 `at` 命令，非常基础且易于使用。你需要理解的是 `at` 命令可以在特定的时间/日期运行一组命令。\n\n在特定时间运行命令，输入：\n\n\
  ```bash\nat 9:30 AM 05/10/2025\n```\n按回车。然后输入要运行的命令（例如：`ls -l > ~/at_output.txt`），每个命令后按回车，然后按\
  \ `Ctrl+D` 退出编辑器。\n\nAT 服务管理命令：\n\n- `atq`：列出用户等待的 AT 命令。\n- `atrm job_number`：删除用户等待的\
  \ AT 。\n- `batch`：当系统负载允许时执行命令。\n\n提示：\n使用 `batch` 命令可以在 CPU 平均负载低于特定阈值时运行另一个命令或脚本，输入：\n\
  \n```bash\nrm -rf /directory/*\n```\n（`batch` 是 `at` 的一部分，并依赖于它的服务。警告：谨慎使用，因为此命令会递归删除文件）\n\
  \n注意：\nAT 调度进程（或服务）必须运行才能才能工作。\n\n### CRONTAB 调度器\n\n第二个命令是 `crontab`，此命令比 AT 服务更健壮。`crontab`\
  \ 命令可以定期运行任务。这是选择使用哪种调度器的主要区别之一。\n\n使用 `crontab` 时必须学习的第一点是命令有六参数。前五个参数定义了命令执行的日期和时间。第六个参数定义了要执行的命令或脚本。\n\
  \n注意：\n`crontab` 的语法如下：`[Minute (0-59)] [hour (0-23)] [Day_of_Month (1-31)] [Month_of_Year\
  \ (1-12)] [Day_of_Week (0-6, 6 = Sunday)] [command (i.e. /path/script)]`。\n\n创建一个\
  \ cron 调度任务（即 Cron Job），首先输入 `crontab`。你将进入一个小型编辑器（功能非常有限）。创建一个在 1 月 8 日上午 8:05\
  \ 运行的任务，执行命令 `echo \"Hello, World\"`。\n\n如果输入 `crontab`，你需要输入：\n\n```bash\n05 08\
  \ 08 01 * echo \"Hello, World\" > test_file.txt\n```\n\n完成后按 `Ctrl+D`。\n\n默认情况下`crontab`\
  \ 对于当前登录用户。查看所有定义的任务，输入：\n\n```bash\ncrontab -l\n```\n\n要在编辑器中编辑 CRONTAB ，输入：\n\n\
  ```bash\ncrontab -e\n```\n\n使用以下参数编辑另一个用户的 CRONTAB，输入：\n\n```bash\ncrontab -u user_name\
  \ -e\n```\n\n说明：\n- 通配符：`*` 匹配任意\n- 范围：使用连字符 `-` 定义范围（例如：周一至周五、6-11、1 月到 2 月等）\n\
  - 多个范围：使用逗号分隔多个范围\n\n关键字快捷键\n\nCron 支持一些常用时间等效的预定义特殊关键字快捷键（例如每、每日等）。表格显示了关键字和时间等效：\n\
  \n- `@yearly`: `0 0 1 1 *`\n- `@daily`: `0 0 * * *`\n- `@hourly`: `* * * * *`\n\
  - `@reboot`: 启动时运行\n\n注意：\nCRONTAB 文件位于：`/etc/crontab`\n\n## NFS (网络文件系统)\n\n在 Linux\
  \ 中，你可以使用名为 NFS（网络文件系统）的服务通过网络与其他计算机共享文件。该服务允许远程操作系统通过网络挂载目录，以便在系统和设备之间移动文件。\n\n\
  \n\nNFS 主要用于 Linux 系统，而 Samba 服务使用的是 `SMB` 协议，这是 Microsoft Windows 用于共享文件的协议。Macintosh\
  \ OSX 及更高版本对 NFS 有原生支持。虽然 Windows 7 为该服务提供了基本支持，但 Windows 10 具有更好的内置支持（这取决于你运行的版本）。\n\
  \n要安装 NFS，你必须分别安装客户端和服务。这允许你在不需要时，仅安装客户端或服务，而无需安装另一个一个。\n\n## 安装/配置 NFS 服务\n\n为了在设备上托管\
  \ NFS 共享，你需要安装客户端，以便远程设备能够访问这些共享。通过以下步骤，在你的本地系统上安装 NFS 服务，以让设备或计算机可以使用文件。\n\n你需要做的第一件事是检查系统中是否已经安装并运行了\
  \ NFS 服务，输入：\n\n```bash\ndpkg -l | grep nfs-kernel-server\n```\n\n如果该服务尚未安装，输入：\n\
  \n```bash\nsudo apt-get install nfs-kernel-server\n```\n\n或者（-OR-）\n\n```bash\n\
  sudo yum install nfs-utils\n```\n\n## 设置 NFS 目录\n\n需要注意的是，NFS 默认忽略 Root（超级用户）权限。因此，即使你使用\
  \ root 权限登录，任何与这些权限相关的操作都会被忽略。这是一种防止系统被远程接管的安全措施。尽管如果需要，可以根据每个共享授予 root 权限。\n\n\
  首先，你必须为要挂载的 NFS 共享创建一个挂载点，输入：\n\n```bash\nsudo mkdir -p /var/nfs/myshare\n```\n\n\
  注意，这些目录 `/var/nfs` 和 `/var/nfs/myshare` 将具有 `777` 权限，输入：\n\n```bash\nsudo chmod\
  \ -R 777 /var/nfs/myshare\n```\n\n作为安全措施，NFS 将客户端上所有的 root 操作翻译为 `nobody:nogroup`\
  \ 凭据。因此，可能需要更改目录所有者以匹配凭据。执行以下命令：\n\n```bash\nsudo chown nobody:nogroup /var/nfs/myshare\n\
  ```\n\n要配置共享文件的访问权限，你需要将它们添加到 `/etc/exports` 文件中。你需要为想要共享的每个目录创建一行。例如：\n\n```text\n\
  /var/nfs/myshare 192.168.0.100(rw,sync,no_subtree_check)\n```\n\n### 注意：\n\n`/etc/exports`\
  \ 文件中的文件注释显示了每行的通用语法，格式如下：`share_directory client_ip_address(share_option1, … ,share_optionN)`\n\
  \n- `rw`: 授予客户端计算机对该共享的读写写权限。\n- `sync`: 此选项强制 NFS 在回复之前将更改写入本地存储。\n- `no_subtree_check`:\
  \ 此选项防止子树检查，这在安全方面会产生一些轻微影响。尽管如此，在某些情况下，它可以提高可靠性。\n- `no_root_squash`: 默认情况下，NFS\
  \ 将来自远程 root 用户的请求翻译为服务器上的非特权用户。此选项为某些共享禁用了此行为。\n\n在修改 `/etc/exports` 文件后，你必须重启\
  \ NFS 服务使更改生效，输入：\n\n```bash\nsudo service nfs-kernel-server restart\n```\n\n##\
  \ 为 NFS 设置防火墙\n\n如果主机机器上运行了防火墙（在大多数情况下它是运行的），你需要在防火墙上开放特定的端口，以便让远程系统可以使用 NFS 服务。\n\
  \n### 注意：\n\n此节假设你的电脑上安装了 `UFW` 工具来管理防火墙。有关关于 `UFW` 工具的更多信息，请参阅后续章节“让 IPTABLES 变得简单”\n\
  \n你想做的第一件事是检查防火墙状态，输入：\n\n```bash\nsudo ufw status\n```\n\n### 注意：\n\n如果防火墙未启用，建议启用此功能。\n\
  \n要查看防火墙启用了哪些应用程序，输入：\n\n```bash\nsudo ufw app list\n```\n\n### 注意：\n\n`UFW` 工具将检查\
  \ `/etc/services` 以获取服务所使用的端口和协议。\n\n要将端口添加到防火墙，输入：\n\n```bash\nsudo ufw allow from\
  \ any to any port nfs\n```\n\n需要注意的是，NFS 最佳实践建议将连接限制在特定的客户端，输入：\n\n```bash\nsudo\
  \ ufw allow from 192.168.0.100 to any port nfs\n```\n\n## 安装/配置 NFS 客户端\n\n为了访问和管理\
  \ NFS 连接，你需要安装 NFS 客户端。你可以在不安装相关 NFS 服务的情况下单独安装客户端。\n\n要安装 NFS 客户端，输入：\n\n```bash\n\
  sudo apt-get install nfs-common\n```\n\n或者（-OR-）\n\n```bash\nsudo yum install nfs-utils\n\
  ```\n\n接下来，你必须为客户端创建作为 NFS 挂载点的目录，输入：\n\n```bash\nsudo mkdir -p /var/nfs/remoteshare\n\
  ```\n\n执行 NFS 挂载命令以访问远程共享，输入：\n\n```bash\nsudo mount 192.169.0.100:/var/nfs/myshare\
  \ /var/nfs/remoteshare\n```\n\n要在每次重启时自动挂载 NFS 共享，你需要在 `/etc/fstab` 中添加一行，例如：\n\n\
  ```text\n192.169.0.100:/var/nfs/myshare /var/nfs/remoteshare nfs auto 0 0\n```\n\
  \n要显示所有已连接的 NFS 挂载点，输入：\n\n```bash\nmount\n```\n\n或者（-OR-）\n\n```bash\ndf -h\n```\n\
  \n## 锁定 NFS 服务（可选）\n\n要锁定 NFS 服务，你需要创建一个组，仅由经过批准的……设置。\n\n/etc.\n.\n\n要阻止所有未经批准的客户端。打开\
  \ `/etc/deny` 文件，然后添加以下行：\n\n```text\nALL\n```\n\n为系统或设备授予连接权限。打开 `/etc/allow` 文件，然后添加以下行：\n\
  \n```text\napproved_address\n```\n\n在修改 `/etc/exports` 文件后，你必须重启 NFS 服务使更改生效，输入：\n\
  \n```bash\nsudo service nfs-kernel-server restart\n```\n\n### 注意：\n\n有三个 NFS 配置文件：\n\
  - `/etc/default/nfs-kernel-server`\n- `/etc/default/nfs-common`\n- `/etc/exports`\n\
  \n## Samba 指南\n\nSamba 是一种允许 Linux 托管或访问 Microsoft 资源（如文件共享、打印机和其他网络资源）。通过此服务，Windows\
  \ 客户端可以连接到。尽管此功能在当前版本中未涵盖，但在未来的版本可能会包含。\n\n### 安装 Samba 服务\n\n安装 Samba 服务，输入：\n\n\
  ```bash\nsudo apt-get install samba\n```\n\n## 安全文件共享\n\n要保护文件共享，你需要创建一个名为 `smbgrp`\
  \ 的组，并为每个用户设置密码。\n\n```bash\nsudo addgroup smbgrp\nsudo usermod user_name -aG smbgrp\n\
  sudo smpasswd -a user_name\n```\n\n### 注意：\n\n`user_name` 必须属于本地系统，否则无法保存\n\n##\
  \ 配置 Samba\n\n为你的 Samba 创建目录，输入：\n\n```bash\nmkdir ~/samba_share\n```\n\n### 注意：\n\
  \n创建存储共享文件的目录。\n\n```bash\nsudo mkdir -p /srv/samba/secure_shares\n```\n\n接下来，为目录设置相应的权限。\n\
  \n```bash\nsudo chmod -R 0770 /srv/samba/secure_shares\nsudo chown -R root:smbgrp\
  \ /srv/samba/secure_shares\n```\n\n编辑 Samba 配置文件，输入：\n\n```bash\nnano /etc/samba/smb.conf\n\
  ```\n\n在文件底部添加以下行：\n\n```ini\n[sambashare]\n   comment = 我的 共享\n   path = /home/user_name/samba_share\n\
  \   read only = no\n   browsable = yes\n```\n\n（要保存文件并退出编辑器，按 Ctrl+X，输入 y 然后按回车）\n\
  \n可以使用更高级的指令创建不同类型的共享（例如：只读、读写、匿名匿名等）。\n\n要使更改生效，你必须重启 Samba 守护进程，输入：\n\n```bash\n\
  sudo systemctl restart smbd\n```\n\n或者（-OR-）\n\n```bash\nsudo service smbd restart\n\
  ```\n\n### 提示：\n\n要测试当前的 Samba 设置，输入：\n\n```bash\ntestparm\n```\n\n\n\n\n# 连接到 SMB\
  \ 共享\n\n在 X-Windows 中打开默认文件管理器，点击“连接服务器”（Connect to Server），输入：\n\n`smb://domain_or_ip_address/sambashare`\n\
  \n## 在 UFW 防火墙中启用 Samba\n\n如果你的系统启用了 `UFW` 防火墙，你必须添加以下规则以允许 Samba 流量通过防火墙。根据你所在的网络类型，可能需要修改这些命令以指定正确的\
  \ IP 范围（示例中为 C 类）。\n\n```\nsudo ufw allow proto udp to any port 137 from 192.168.1.0/24\n\
  sudo ufw allow proto udp to any port 138 from 192.168.1.0/24\nsudo ufw allow proto\
  \ tcp to any port 139 from 192.168.1.0/24\nsudo ufw allow proto tcp to any port\
  \ 445 from 192.168.1.0/24\n```\n\n## 安装 SSH 服务器\n\n安全外壳 (`SSH`) 是用于现代版本 Linux 的默认远程管理工具。它提供了一个加密的通信通道来控制远程服务器。\n\
  \nSSH 服务取代了旧的 `Telnet` 服务，后者提供类似的远程管理功能，但所有通信都是未加密的。网络上的任何人如果监控流量，都可以明文形式看到所有数据和密码。\n\
  \n`SSH` 包含两个组件：服务端和客户端。服务端等待并允许你连接到系统以执行远程管理。客户端允许你连接并向远程服务发送命令。\n\n要安装并配置该服务，请遵循以下说明。\n\
  \n如果尚未安装该服务，输入：\n\n```\nsudo apt-get install openssh-server\n```\n\n### 提示：\n\n\
  检查它的状态（如有必要，如果服务未运行，将 `status` 改为 `start` 或 `restart`），输入：\n\n```\nsudo systemctl\
  \ status ssh\n```\n\n如果 `ssh` 服务未运行，输入：\n\n```\nsudo systemctl enable ssh\nsudo\
  \ systemctl start ssh\n```\n\n确保防火墙上已启用端口 `22`，输入：\n\n```\nsudo ufw allow ssh\n\
  sudo ufw enable\nsudo ufw status\n```\n\n### 注意：\n\n有关如何使用 SSH 客户端和 `SCP` (安全复制)\
  \ 的更多信息，请参见后续章节“远程控制台和文件传输”\n\n## `/PROC` 虚拟文件\n\n`/proc` 是一个虚拟文件系统，提供了有关进程、文件系统、内核等的信息。这对于系统分析或故障排除非常有用。\n\
  \n你只需要 `cat` 这些信息即可，例如：`cat /proc/filesystems`。要查看操作系统提供的完整内容列表，输入：\n\n```\ntree\
  \ /proc | less\n```\n\n下面是一些你可以查看的示例，以了解你可以访问哪些信息。这些信息非常专业，因此你对某项特定技术的了解程度将决定你理解它的能力。\n\
  \n显示 CPU 相关信息，输入：\n\n```\ncat /proc/cpuinfo\n```\n\n显示当前正在使用的文件系统信息，输入：\n\n```\n\
  cat /proc/filesystems\n```\n\n显示当前使用的中断，输入：\n\n```\ncat /proc/interrupts\n```\n\n\
  列出连接到服务器的设备所使用的 I/O 地址，输入：\n\n```\ncat /proc/ioports\n```\n\n显示物理内存和交换内存内存使用信息\n\
  \n```\ncat /proc/meminfo\n```\n\n列出当前加载的内核模块，输入：\n\n```\ncat /proc/modules\n```\n\
  \n显示当前挂载的文件系统，输入：\n\n```\ncat /proc/mounts\n```\n\n显示关于系统的各种统计数据，输入：\n\n```\ncat\
  \ /proc/stat\n```\n\n显示交换文件的利用率信息，输入：\n\n```\ncat /proc/swaps\n```\n\n列出 Linux 版本信息，输入：\n\
  \n```\ncat /proc/version\n```\n\n# 使用 Git（学者教程）\n\n### 概述：\n\n本章旨在作为 `git` 命令的介绍。它重点关注如何使用\
  \ `git` 客户端来管理服务器上的数据。它不涉及如何设置远程 `git` 服务器，仅简要涵盖了如何管理仓库中的数据。\n\n### Git 概述\n\n-\
  \ 第 5 层：应用（例如 IDE、编译器等）\n- 第 4 层：Shell（Git 命令管理）\n- 第 3 层：文件系统（本地 Git 仓库）\n- 第 3a\
  \ 层：工作目录（本地文件）\n- 第 3b 层：索引（暂存区）\n- 第 3c 层：Head（预最终提交）\n- 第 2 层：网络和防火墙（远程 Git 仓库\
  \ [`github.com`](http://github.com))\n- 第 1 层：主机操作系统（内核/程序/服务/库/数据）\n- 第 0 层：基础设施（例如硬件、虚拟机、云、物联网等）\n\
  \n### 前提条件：\n\n在开始本节之前，确保你已获取了包管理器仓库的更新列表，以便获得最新版本的程序、服务和库，输入：\n\n```\nsudo apt-get\
  \ update\n```\n\n或\n\n```\nsudo yum update\n```\n\n如果你正在使用 Linux（或几乎任何其他主要的操作系统），你将学习\
  \ `git`。`git` 是我们所谓的 `VCS`（或版本控制系统）。基本上，像 `git` 这样的 `VCS` 被程序员（以及许多其他人）常用于存储他们的源代码（或其他类型的内容），跟踪对其进行的更改（也称为“版本”），并通过让其他像你这样的人下载或对其贡献更改来共享它。\n\
  \n一个 `git` 系统有两个主要组件：服务端和客户端。服务端组件持有主数据集，客户端的工作是从服务器上拉取数据并收集更改。\n\n### 注意：\n\n本文将不会涵盖基于\
  \ GUI 的 `git` 客户端。如需更多信息，请搜索“graphical Git clients”。\n\n流行的在线 `git` 仓库之一是 GitHub\
  \ ([`github.com/`](https://github.com/))。这个网站是 `git` 的代名词，也是许多开源项目的默认选择。尽管这不是唯一的选择，还有几个\
  \ `git` 仓库提供者可以选择。有些是免费的，另一些提供付费服务。\n\n## 入门\n\n在执行任何操作之前，你必须确保已安装 `git` 客户端。如果没有安装客户端，你需要将其添加到本地系统中以便使用。\n\
  \n检查你是否安装了 git 客户端，输入：\n\n```\ngit --version\n```\n（如果返回“git version 2.x.x”等结果，说明客户端已安装）。\n\
  \n### 注意：\n\n如果你没有 `git`，要安装它，输入：\n\n```\nsudo apt-get install git\n```\n\n或\n\n\
  ```\nsudo yum install git\n```\n\n## 核心概念\n\n我们已经涵盖了一些重要的主题，例如：服务端和客户端在哪里。这一节涉及其他重要的核心概念，例如：仓库、分支等。\n\
  \n### 仓库\n\n`git` 中的所有项目都存储在所谓的仓库（repository）中。仓库是存储构成项目的所有相关对象（例如镜像、源代码等）的地方。你可以本地或远程访问仓库。\n\
  \n本地仓库由 git 维护的三个“树”组成。这三棵树分别是工作目录、索引和 Head。\n\n下面列出了这些这些树的概述。\n\n**工作目录**：这是存储所有实际文件的地方。为了与现有仓库协作，你需要创建一个新仓库，或者将其克隆到你的计算机上。当你克隆一个现有仓库时，它会创建一个受你控制的全副本。\n\
  \n如果你想为你创建一个新仓库，第一步是创建一个目录（例如 `mkdir directory_name`）来存放仓库。然后你需要切换到该位置（例如 `cd directory_name`），然后输入：\n\
  \n```\ngit init\n```\n（这将创建一个名为 `.git` 的新隐藏目录，用于存储配置文件）\n\n要与远程仓库协作，你需要克隆它（基本上是创建一个本地副本）。输入：\n\
  \n```\ngit clone user_name@host:/path/to/repository own\n```\n\n要对仓库的本地副本进行操作，输入：\n\
  \n```\ngit clone /path/to/repository\n```\n\n\n\n\n\n# 索引 (Index)\n作为你对本地文件副本所做更改的暂存区。通常，这些是你测试代码时所保存的更改。如果出现问题，你可以恢复到文件的之前的保存版本。\n\
  \n要将文件添加到 `Index` 中，你必须通过将它们添加到 `Index` 来“提议”更改，输入：\n\n```bash\ngit add file_name\n\
  ```\n\n或者\n\n```bash\ngit add *\n```\n\n# 头指针 (Head)\n保存你对本地仓库中文件所做的做的提交的最新版本。当你准备好提交放置在\
  \ `Index` 中的所有更改时，你必须将它们“提交”到 `head`。在它们提交到 `head` 之后，它们就可以合并到位于远程系统上的主仓库中。\n\n\
  要将提议的文件更改提交到 `head`，输入：\n\n```bash\ngit commit -m \"Commit message\"\n```\n\n**注意：**\n\
  建议为每个软件发布创建标签（tags）。例如，输入：\n\n```bash\ngit tag 1.2.3 1a2b3c4d5e (最后部分是提交 id 的前 10\
  \ 个字符，可以在日志中找到。\n```\n\n通常，一旦你完成了对本地仓库中文件的更改，你可能就会希望将它们发送到主服务器，以便它们与其他更改合并。\n\n\
  为了做到这一点，你必须告诉 `git` 将存储在本地系统 `head` 中的更改推送到存储在远程服务器上的主仓库，输入：\n\n```bash\ngit push\
  \ origin master\n```\n（将 `master` 更改为你想要推送更改的分支。）\n\n**注意：**\n如果你没有现有的克隆远程仓库，你必须与远程服务器建立连接，这需要你添加一个。要添加远程仓库，输入：\n\
  \n```bash\ngit remote add origin server_address\n```\n\n# 分支管理 (Branching)\n`git`\
  \ 的另一个核心概念是分支。在创建仓库时，`master` 分支被称为 `DEFAULT`（默认）分支。分支允许用户为某个功能创建一个隔离副本以便在本地进行开发，然后在完成后完成后将其合并回\
  \ `master` 分支。\n\n要创建一个名为 `new_feature` 的新分支并切换到该分支，输入：\n\n```bash\ngit checkout\
  \ -b new_feature\n```\n\n要切换回 `master` 分支，输入：\n\n```bash\ngit checkout master\n\
  ```\n\n要删除创建的分支，输入：\n\n```bash\ngit branch -d new_feature\n```\n\n**注意：**\n除非你将分支推送到远程\
  \ `master` 仓库，否则其他人无法使用该分支，输入：\n\n```bash\ngit push origin new_feature\n```\n\n\
  ## 仓库维护 (Repository Maintenance)\n一旦设置好仓库，你就需要维护它们（即：拉取、推送、合并代码更改）并保持它们为最新状态。\n\n\
  ## 提交与合并 (Commits and Merges)\n以下命令用于将最新提交拉取到你的本地仓库，并将你所做的更改合并回主仓库，以便他人可以访问。\n\n\
  要用最新提交更新你的本地仓库，输入：\n\n```bash\ngit pull\n```\n\n从工作目录获取并合并远程更改，输入：\n\n```bash\n\
  git merge master\n```\n\n**注意：**\n`git` 会尝试自动合并更改。遗憾的是，冲突可能会发生且将会发生。这取决于你通过修改 `git`\
  \ 显示的文件来手动合并任何冲突。在更新它们后，你需要将它们标记为已合并，输入：\n\n```bash\ngit add file_name\n```\n\n\
  **提示：**\n在合并更改之前，你也可以使用以下命令来预览它们，输入：\n\n```bash\ngit diff source_branch target_branch\n\
  ```\n\n## 日志 (Logging)\n`git log` 命令向你显示提交和提交消息历史。日志对于查找发生了哪些更改，以及在这些提交期间是否存在任何错误或问题非常有用。\n\
  \n要查看对仓库所更改的历史，你需要查看存储在日志中的信息，输入：\n\n```bash\ngit log\n```\n\n**提示：**\n`git` 支持许多格式化日志输出的选项，例如，输入：\n\
  \n```bash\ngit log --graph --oneline --decorate --all\n```\n（输入 `git log --help`\
  \ 获取更多信息）\n\n`git` 还支持许多搜索日志的选项，例如，输入：\n\n```bash\ngit log --author=jim\n```\n（输入\
  \ `git log --help` 获取更多信息）\n\n## 回滚文件/仓库 (Reverting a File/Repository)\n有时有必要将文件回滚或重置到上次提交以来的状态。这些命令帮助你管理文件回滚：\n\
  \n要将文件恢复到自上次提交到本地仓库以来的状态，输入：\n\n```bash\ngit checkout -- file_name\n```\n\n**警告：**\n\
  请谨慎使用此命令，它会破坏数据。\n\n在你的本地仓库副本中重置（即删除所有更改，且不可逆）。然后它将从主仓库下载一份全新的数据副本，输入：\n\n```bash\n\
  git fetch origin\ngit reset --hard origin/master\n```\n\n## 有用技巧 (Useful Tricks)\n\
  这些命令可以让 `git` 使用起来更简单或更有用。\n\n显示带颜色的 `git` 输出，输入：\n\n```bash\ngit config color.ui\
  \ true\n```\n\n在日志中每个提交显示一行，输入：\n\n```bash\ngit config format.pretty oneline\n```\n\
  \n要查看此命令执行前后的结果对比，输入：\n\n```bash\ngit log\n```\n\n将 `git` 置于交互模式（菜单选择），输入：\n\n```bash\n\
  git add -i\n```\n\n**注意：**\n更多信息：查看 Git 官方网站：[`git-scm.com/`](https://git-scm.com/)\n\
  \n## GIT 快速查表 (GIT CheatSheet)\n此 `git` 快速查表包含了一些 `git` 命令的摘要和示例。此部分提供了关于如何创建、管理和删除仓库、分支和文件，以及修改配置的快速参考。\n\
  \n### 创建仓库 (Creating Repositories)\n```bash\ngit init [directory_name]\n```\n\n\
  ### 配置 (Configuration)\n```bash\ngit config\n```\n\n```bash\ngit config --global\
  \ user.name \"[name]\"\n```\n\n```bash\ngit config --global user.email \"your email@example.com]\"\
  \n```\n\n### 克隆远程仓库 (Cloning a remote repository)\n```bash\ngit clone [URL]\n```\n\
  \n### 管理提交/跟踪/推送更改 (Manage Committing/Pushing Changes)\n```bash\ngit add [ file_name\
  \ | * ]\n```\n\n```bash\ngit commit -m \"message\"\n```\n\n```bash\ngit push origin\
  \ master\n```\n\n### 获取/合并仓库 (Fetching/Merging Repositories)\n```bash\ngit fetch\
  \ origin\n```\n\n```bash\ngit merge master\n```\n\n### 查看仓库状态 (Checking the Status\
  \ of the Repository)\n```bash\ngit diff\n```\n\n```bash\ngit diff --staged\n```\n\
  \n```bash\ngit status\n```\n\n### 分支管理 (Managing Branches)\n```bash\ngit branch\n\
  ```\n\n```bash\ngit branch -d [ branch_name ]\n```\n\n```bash\ngit branch [ branch_name\
  \ ]\n```\n\n```bash\ngit checkout [ branch_name ]\n```\n\n```bash\ngit merge [ branch_name\
  \ ]\n```\n\n### 、删除和回滚文件 (Removing, deleting, and reverting files)\n```bash\ngit\
  \ rm [ file_name ]\n```\n\n```bash\ngit rm --cached [ file_name ]\n```\n\n```bash\n\
  git mv [ old_file_name ] [ new_file_name ]\n```\n\n```bash\ngit checkout -- [ file_name\
  \ ]\n```\n\n\n\n\n\n将本地存储上修改过的文件还原到最后提交的版本。\n\n### 查看提交历史\n\n```bash\ngit log\n\
  ```\n\n显示历史详情。\n- `-1`: 显示最后一次提交。\n- `--stat`: 显示统计信息而非差异（diff）详情。\n- `--name-status`:\
  \ 显示更简单的统计版本。\n- `--oneline`: 显示提交注释。\n\n# 安装 L.A.M.P.\n\n概述：`LAMP` 是一组开源软件服务的缩写，这些服务通常被一起安装在服务器上，用于托管动态\
  \ Web 应用。该术语是 `Linux`（操作系统）、`Apache`（Web 服务器服务）、`MySQL`（数据库服务）以及 `PHP` 或 `Python`（用于动态内容生成）的缩写。\n\
  \n### LAMP 概述\n- 第 4 层：Shell（即系统和服务管理）\n- 第 3 层：`Apache` 和 `MySQL` 服务\n- 第 3a 层：`PHP`\
  \ 引擎（由 `Apache` 服务调用）\n- 第 3b 层：`PHP` 网页和应用（例如 `phpMyAdmin`）\n- 第 2 层：网络和防火墙（即通信）\n\
  - 第 1 层：主机操作系统（即内核、库等）\n- 第 0 层：基础设施（即硬件、虚拟机、云、物联网等）\n\n如果你仍在学习 `Linux`，那么这一章将非常棒，因为它将为你提供练习，让你了解安装一套\
  \ Linux 应用程序和服务到底需要什么。本章将教你安装服务的基础知识、控制它们、管理配置文件等等内容。\n\n即使你不打算使用 `LAMP` 服务，但想获得更多安装和管理它们的经验，本章也将为这种类型的\
  \ Linux 管理提供一个很好的介绍。\n\n### 前提条件\n本节要求你在系统上拥有 root 权限，以便安装服务并更改操作系统。\n\n在开始本节之前，确保你已获取了包管理器仓库的更新列表，以便获得最新版本的程序、服务和库，输入：\n\
  \n```bash\nsudo apt-get update\n```\n-或-\n\n```bash\nsudo yum update\n```\n\n###\
  \ 注意事项\n根据你运行的发行版和软件版本，这些指令可能要求你对服务或操作系统进行修改。尽管如此，本节是一个你可以用于完成安装的良好框架。\n\n应用程序开发者始终在改进他们的软件，随着时间的推移，这些指令可能会发生。\n\
  \n## 安装 Apache Web 服务器\n\n概述：本节提供了关于如何安装和基础设置 `Apache HTTP` 服务，以及如何修改防火墙的指令。`Apache`\
  \ 服务用于使用 `HTTP` 协议向远程客户端和系统传递文件。\n\n`Apache HTTP Server` 是一个免费且开源的跨平台 Web 服务器。它最初基于\
  \ `NCSA HTTPd` 服务器。在 `NCSA` 代码工作停滞后，`Apache` 的开发于 1995 年初开始。\n\n截至 2018 年 3 月，估计它为\
  \ 43% 的所有活跃网站和 37% 的前百万网站提供服务。\n\n安装最新版本的 `Apache` Web 服务器，输入：\n\n```bash\nsudo\
  \ apt-get install apache2\n```\n-或-\n\n```bash\nsudo yum install httpd\n```\n\n\
  ### 修改防火墙\n本节涵盖了如何在本地防火墙中打开必要的端口，以便 `http` 流量（80 端口）和 `HTTPS`（443 端口）流量能够通过。`ufw`（简易防火墙）工具用于管理\
  \ `iptables`（一种 netfilter 防火墙设计），以便于使用。它使用一个由少量简单命令组成的命令行界面，并使用 `iptables` 进行配置。\n\
  \n### 注意事项\n这些指令假设你的系统中已安装了 `UFW` 防火墙工具。\n\n列出防火墙当前支持的所有应用，寻找 'Apache Full'输入：\n\
  \n```bash\nsudo ufw app list\n```\n\n确保允许通过 80 和 443 端口的流量，输入：\n\n```bash\nsudo\
  \ ufw app info \"Apache Full\"\n```\n\n如果 80 和 443 端口的流量未允许，输入：\n\n```bash\nsudo\
  \ ufw allow in \"Apache Full\"\n```\n\n测试以确保 `Apache` 服务运行正常，输入：\n\n```text\nhttp://domain_name_or_ip\n\
  ```\n\n要查找你本地机器的 IP 地址，输入：\n\n```bash\nip addr show eth0 | grep inet | awk '{ print\
  \ $2; }' | sed 's/\\/.*$//'\n```\n\n要查找本地机器的主机地址，输入：\n\n```bash\nhostname\n```\n\
  \n## 安装 MySQL 数据库\n\n概述：本节提供了如何安装 `MySQL` 数据库服务的指令。该服务被 Web 应用用于存储或检索其需要的数据。\n\n\
  `MySQL` 是一个开源关系型数据库管理系统 (RDBMS)。它的名字是“My”（联合创始人 `Michael Widenius 的女儿`的名字）和“SQL”（结构化查询语言的缩写）。\n\
  \n### 前提条件\n本节假设你的 `Apache` 服务已正确运行并配置。这包括你在系统上拥有安装服务的 root 权限。\n\n要安装该服务，输入：\n\n\
  ```bash\nsudo apt-get install mysql-server\n```\n-或-\n\n基于 RPM 的安装，参见：`https://dev.mysql.com/downloads/repo/yum/`\n\
  \n以下脚本将保护 `MySQL` 安装。它通过移除某些危险的默认设置并锁定数据库系统的访问来实现，输入：\n\n```bash\nsudo mysql_secure_installation\n\
  ```\n\n### 注意事项\n系统会询问你是否要配置`VALIDATE PASSWORD PLUGIN`。此选项启用强密码验证。这在生产环境中是推荐的。只需通过回答\
  \ 'Y' 接受其余问题的默认设置。这将禁用匿名用户、远程 root 登录等。\n\n测试 `MySQL` 连接，输入：\n\n```bash\nsudo mysql\n\
  ```\n\n### 注意事项\n如果你打算安装 `phpMyAdmin` Web 应用来管理 `MySQL` 数据库。为了让 root `MySQL` 用户登录，你需要将认证方法从\
  \ `AUTH_SOCKET` 切换到 `MYSQL_NATIVE_PASSWORD`。这将在本书稍后讨论，并且只有在你打算安装该 Web 应用时才需要。\n\n\
  要验证是否在使用 `AUTH_SOCKET` 插件（通常默认启用），从 `mysql>` 提示符输入：\n\n```sql\nSELECT user,authentication_string,plugin,host\
  \ FROM mysql.user;\n```\n\n要退出 `MySQL` 应用程序，从 `mysql>` 提示符输入：\n\n```sql\nexit\n\
  ```\n\n# 安装 PHP\n\n概述：本节提供了如何安装 `PHP` 引擎的指令。`PHP` 是一种服务器端脚本语言，用于生成文件（主要是网页）以响应客户端或远程系统的请求。\n\
  \n`PHP` 语言为 Web 开发设计，但也可以作为通用编程语言使用。`PHP` 最初代表 Personal Home Page（个人首页），现在代表递归定义的\
  \ Hypertext Preprocessor（超文本处理器）。\n\n### 前提条件\n本节假设 `Apache` 和 `MySQL` 服务已正确运行并配置。这包括你在系统上拥有安装\
  \ `PHP` 引擎的 root 权限。\n\n安装 `PHP` 引擎以及 `Apache` 和 `MySQL` 服务所需的辅助包，输入：\n\n```bash\n\
  sudo apt-get install php libapache2-mod-php php-mysql\n```\n\n修改 `Apache` 以接受 `index.php`\
  \ 文件，输入：\n\n```bash\nsudo nano /etc/apache2/mods-enabled/dir.conf\n```\n\n在 `nano`\
  \ 中的以下行（即 `DirectoryIndex`），将 `PHP` 索引文件（即 `index.php`）移动到第一位：\n\n```apache\n<IfModule\
  \ mod_dir.c>\nDirectoryIndex index.php ...\n</IfModule>\n```\n\n（保存文件并退出编辑器，按 `Ctrl+X`，输入\
  \ `y` 并按回车）\n\n然后重启 `Apache` 服务，输入：\n\n```bash\nsudo systemctl restart apache2\n\
  ```\n\n检查服务状态，输入：\n\n```bash\nsudo systemctl status apache2\n```\n\n### 测试 安装\n\
  确保 `PHP` 引擎运行正常。使用以下命令在 Web 根目录 `[/var/www/html/]` 中创建一个名为 `info.php` 的文件：\n\n```bash\n\
  echo \"<?php phpinfo(); ?>\" > /var/www/html/info.php\n```\n\n测试该页面，查看 `PHP` 是否安装正确。在浏览器中输入：\n\
  \n`http://domain_name_or_ip/info.php`\n\n如果一切运行正常，页面将显示关于操作系统和相关子系统的大量信息。\n\n删除此文件，输入：\n\
  \n```bash\nsudo rm /var/www/html/info.php\n```\n\n\n\n\n\n要添加免费的 TLS/SSL 证书，请查看\
  \ Let's Encrypt。\n\n# 安装 PHPMyAdmin\n\n概述：本节提供了如何安装 PHPMyAdmin Web 应用程序的说明。该工具允许你通过浏览器使用\
  \ Web 用户界面（WUI）管理你的 `MySQL` 数据库。\n\n由于 `phpMyAdmin` 工具的流行和功能强大，它成为了互联网攻击者的目标。我绝不建议在生产系统上运行此\
  \ Web 应用程序。如果你必须运行它，请确保已对其进行锁定并定期更新补丁。同时强烈建议使用 SSL 对与该工具的所有通信进行加密。\n\n### 前提条件\n\
  \n本节假设你的 `Apache`、`MySQL` 和 `PHP` 已经正常运行并配置正确。这包括你的防火墙设置，以及你拥有系统的 root 权限。\n\n要安装\
  \ `phpMyAdmin` Web 应用程序，输入：\n\n```bash\nsudo apt-get install phpmyadmin php-mbstring\
  \ php-gettext\n```\n\n### 注意事项\n\n对于服务器选择，选择 `\"apache2\"`，然后在询问是否使用 `dbconfig-common`\
  \ 设置数据库时选择 `\"Yes\"`。然后，你会被要求为 `phpMyAdmin` 选择并确认 `MySQL` 密码。\n\n安装过程会将 `phpMyAdmin`\
  \ Apache 配置文件添加到 `/etc/apache2/conf-enabled/` 中。\n\n要显式启用 `mbstring` PHP 扩展，输入：\n\
  \n```bash\nsudo phpenmod mbstring\n```\n\n重启 Apache 以识别更改，输入：\n\n```bash\nsudo systemctl\
  \ restart apache2\n```\n\n### 注意事项\n\n`phpMyAdmin` 会自动在 `MySQL` 中创建一个名为 `phpmyadmin`\
  \ 的数据库。\n\n要使用你的 root `MySQL` 用户登录，你需要将认证方法从 `AUTH_SOCKET` 切换到 `MYSQL_NATIVE_PASSWORD`，输入：\n\
  \n```bash\nsudo mysql\n```\n\n在 `mysql>` 提示符下显示 `MySQL` 当前正在使用的认证方法配置，输入：\n\n```sql\n\
  SELECT user,authentication_string,plugin,host FROM mysql.user;\n```\n\n在 `mysql>`\
  \ 提示符下修改认证方法配置以使用 `mysql_native_password`，输入：\n\n```sql\nALTER USER 'root'@'localhost'\
  \ IDENTIFIED WITH mysql_native_password BY 'password';\n```\n\n### 注意事项\n\n确保将 `'password'`\
  \ 更改为强密码。\n\n要使配置更改生效，在 `mysql>` 提示符下，输入：\n\n```sql\nFLUSH PRIVILEGES;\n```\n\n\
  为了确保新的配置更改已在系统中实施，在 `mysql>` 提示符下，输入：\n\n```sql\nSELECT user,authentication_string,plugin,host\
  \ FROM mysql.user;\n```\n\n在 `mysql>` 提示符下，输入：\n\n```bash\nexit\n```\n\n要访问 `PHPMyAdmin`\
  \ Web 界面，在浏览器中输入机器的域名或公网 IP 地址：\n\n`https://domain_name_or_ip/phpmyadmin`\n\n###\
  \ 注意事项\n\n当启用密码认证时，你需要使用不同的命令登录。要使用传统方法登录，输入：\n\n```bash\nmysql -u root -p\n```\n\
  \n要创建一个唯一用户而不是使用 root 用户，请按照以下命令修改上述步骤。在 `mysql>` 提示符下，输入：\n\n```sql\nCREATE USER\
  \ 'new_user'@'localhost' IDENTIFIED BY 'password';\n```\n\n### 注意事项\n\n将 `'new_user'`\
  \ 更改为你想要的名称，并将 `'password'` 更改为强密码。\n\n此命令授予新用户在 `MySQL` 数据库服务中适当的权限[即 root 权限]，输入：\n\
  \n```sql\nGRANT ALL PRIVILEGES ON *.* TO 'new_user'@'localhost' WITH GRANT OPTION;\n\
  ```\n\n在 `mysql>` 提示符下，输入：\n\n```bash\nexit\n```\n\n# 安全 phpMyAdmin 控制台\n\n概述：本节是对\
  \ `.htaccess` 文件的实用介绍。`.htaccess` 文件允许你通过应用此文件中的命令/指令来覆盖默认 Apache 设置。即使你不需要为 `phpMyAdmin`\
  \ 使用此功能，它也能为你提供以后可以应用到网站/应用程序的信息。\n\n### 前提条件\n\n本节假设你的 `Apache`、`MySQL`、`PHP` 和\
  \ `PHPMyAdmin` 已经正常运行并配置正确。这包括你的防火墙设置，以及你拥有系统的 root 权限。\n\n你需要启用使用 `.htaccess` 文件来覆盖\
  \ Apache 配置设置。你可以通过修改 `/etc/apache2/conf-available/phpmyadmin.conf` 文件来实现。\n\n在以下部分\
  \ `<Directory /usr/share/phpmyadmin>` 中添加以下行 `'AllowOverride All'`，输入：\n\n```bash\n\
  sudo nano /etc/apache2/conf-available/phpmyadmin.conf\n```\n\n```apache\n<Directory\
  \ /usr/share/phpmyadmin>\nAllowOverride All\n...\n```\n\n（要保存文件并退出编辑器，按 `Ctrl+X`，输入\
  \ `y` 并按 `Enter`）\n\n重启 Apache 服务，输入：\n\n```bash\nsudo systemctl restart apache2\n\
  ```\n\n要应用所需的安全权限，你需要创建 `.htaccess` 文件，输入：\n\n```bash\nsudo nano /usr/share/phpmyadmin/.htaccess\n\
  ```\n\n### 注意事项\n\n在文件中，输入以下信息：（省略注释是可以接受的，我提供它们只是为了清晰。）\n\n```apache\n# 指定正在实施的认证类型\n\
  # (例如，密码文件）\nAuthType Basic\n\n# 指定认证对话框的消息。\n# 建议：出于安全考虑，保持消息的通用性。\nAuthName \"\
  Restricted Files\"\n\n# 指定用于认证的密码文件位置\n# 建议：将此文件存储在 Web 服务所提供的目录之外。\nAuthUserFile\
  \ /etc/phpmyadmin/.htpasswd\n\n# 指定只有经过身份验证的用户才能访问资源。\nRequire valid-user\n```\n\
  \n（要保存文件并退出编辑器，按 `Ctrl+X`，输入 `y` 并按 `Enter`）\n\n要创建密码文件，系统将提示输入密码，输入：\n\n```bash\n\
  sudo htpasswd -c /etc/phpmyadmin/.htpasswd\n```\n\n要创建额外用户，在不带 `-c` 标记的情况下执行：\n\n\
  ```bash\nsudo htpasswd /etc/phpmyadmin/.htpasswd\n```\n\n当你访问 PHPMyAdmin 界面时，系统将提示额外的账户名和密码：\n\
  \n`https://domain_name_or_ip/phpmyadmin`\n\n# 安装 SSL 证书\n\n概述：Let's Encrypt 是一个提供免费\
  \ TLS/SSL 证书的证书机构 (CA)，允许你在 Web 服务器上启用 HTTPS。HTTPS 对你网站的安全至关重要。\n\nGoogle 等搜索引擎会对支持加密通信的网站在搜索结果中更高的优先级。\n\
  \n### 前提条件\n\n运行最新版本 `Linux` 和 `apache` 的服务器。\n\n一个完全注册的域名，例如 `example.com`。\n\n\
  指向你的服务器公网 IP 地址的 DNS 'A 记录'（以及 'CNAME 记录'，可选），例如：`example.com`。\n\n# 安装 Certbot\n\
  \nEFF 的 Certbot 可以通过部署 Let's Encrypt 证书自动在你的网站上启用 HTTPS。你可能会问为什么需要 Certbot 来帮助你。首先，它自动化了请求和安装证书的过程，这可以减轻你的管理工作负担。其次，Let's\
  \ Encrypt 证书具有硬编码的 90 天有效期，在此之前必须续期。Certbot 会自动处理续期过程。此功能旨在防止恶意个人或团体在获取证书后滥用它。\n\
  \n要安装 Certbot 存储库，输入：\n\n```bash\nsudo add-apt-repository ppa:certbot/certbot\n\
  ```\n\n要安装 Certbot 的 Apache 软件包，输入：\n\n```bash\nsudo apt-get install python-certbot-apache\n\
  ```\n\n打开该域名的虚拟主机文件，输入：\n\n```bash\nsudo nano /etc/apache2/sites-available/example.com.conf\n\
  ```\n\n找到 `ServerName`，它应该像所示：\n\n```apache\n...\nServerName example.com;\n...\n\
  ```\n\n### 注意事项\n\n如果不匹配，请更新文件并保存更改。\n\n要验证你编辑的配置语法，输入：\n\n```bash\nsudo apache2ctl\
  \ configtest\n```\n\n### 注意事项\n\n如果有错误，重新打开虚拟主机文件并检查错误（例如拼写错误、缺失字符等）。\n\n重载 apache\
  \ 服务以强制加载新配置，输入：\n\n```bash\nsudo systemctl reload apache2\n```\n\n# 通过防火墙允许 HTTPS\n\
  \n你需要确保防火墙开启了 HTTPS 端口 (TCP/443)，以便远程系统与服务通信。\n\n检查防火墙当前状态，输入：\n\n```bash\nsudo\
  \ ufw status\n```\n\n\n\n\n\n要清除旧的防火墙配置（如果存在）并将其替换为新的，输入：\n\n```bash\nsudo ufw delete\
  \ allow 'Apache'\nsudo ufw allow 'Apache Full'\n```\n\n要检查当前防火墙状态，输入：\n\n```bash\n\
  sudo ufw status\n```\n\n# 获取 SSL 证书\n\nCertbot 通过插件提供了多种获取 SSL 证书的方法。`Apache` 插件会在需要时负责重新配置\
  \ Apache 并重载配置。\n\n要使用此插件，输入：\n\n```bash\nsudo certbot --apache -d example.com -d\
  \ www.example.com\n```\n\n如果这是你第一次运行 certbot，系统将提示你输入电子邮件地址并同意服务条款。完成后，certbot 将与\
  \ Let's Encrypt 服务器通信，然后运行挑战以验证你确实对请求证书的域名拥有控制权。\n\n如果执行成功，certbot 将询问你希望如何配置 HTTPS\
  \ 设置。选择你的选项并按回车键。配置将会被更新，Apache 将会重载以采用新设置。\n\n您的证书已下载、安装并加载。尝试使用 `https://` 重新加载您的网站，并注意浏览器的安全指示器。它应该显示网站已妥安全保护，通常有一个绿色的锁图标。\n\
  \n**提示：**\n\n如果你使用 SSL Labs Server Test (`https://www.ssllabs.com/ssltest/`) 测试您的服务器，它应该给您的站点\
  \ A 等级。\n\n# 验证 Certbot 自动续签\n\n如前所述 Let's Encrypt 证书的有效期为九十天。这是鼓励用户自动化证书续签过程。安装的\
  \ `certbot` 软件包通过向 `/etc/cron.d` 添加续签脚本来完成此工作。该脚本每天运行两次，并将自动续签任何将在未来三十天内到期的证书。\n\
  \n要测试续签过程，输入：\n\n```bash\nsudo certbot renew --dry-run\n```\n\n在需要时，Certbot 将更新您的证书并重载\
  \ Apache 以应用更改。如果自动续签过程失败，Let’s Encrypt 将向你指定的电子邮件发送消息，在你的证书即将过期时提醒你。\n\n# 安装 Docker（容器化）\n\
  \n**概述：** Docker 是一种用于管理在 Docker 容器中运行的进程的技术。Docker 容器在资源隔离的进程中运行应用程序。该技术与虚拟机 (VM)\
  \ 类似，但 Docker 容器更具移植性、更节省资源，并且依赖于主机操作系统。\n\nDocker 和虚拟机技术提供了进程资源隔离。与 Docker 不同，虚拟机独立于主机操作系统运行。每个虚拟机都必须维护操作系统、相关依赖以及应用程序的完整副本。因此，虚拟机执行时需要更多的系统资源。\n\
  \n**前提条件：**\n\n本节要求你具备：\n- 一个具有合理资源的系统（例如：2 核 CPU、8GB 内存和 50GB 存储、1 个网卡）\n- 一个已更新/打过补丁的\
  \ Linux 发行版\n-  系统的 Root 权限以安装服务并更改系统\n- 一个 Docker Hub 网站的账户 (`https://hub.docker.com/`)。如果你还没有账户，应该现在登录并创建一个。\n\
  \n## Docker 与虚拟机管理程序 (Hypervisor) 架构\n\n在 Docker 架构中，你只需要一份操作系统（每台服务器）。所有容器只包含依赖项（即库、可执行文件等）以及运行其提供的服务所需的代码。它具有非常的可扩展性且高效，但确实存在需要重写现有代码来利用它的缺点。该技术的主要优势之一是它允许你的服务非常快速地扩展（向上或向下）。\n\
  \n### Docker 概述（更优化的系统资源利用）\n\n第 4 层：Docker 容器（Docker 镜像的“运行副本”）\n[多个 Docker 容器可以在系统内存中运行]\n\
  第 3 层：Docker 镜像（保存程序/服务/库/数据）\n[流行的 Docker 镜像维护在 Docker Hub 上]\n第 2 层：Docker 服务\n\
  第 1 层：主机 OS（即内核、库等）\n第 0 层：基础设施（即 硬件、虚拟机、云、IoT 等）\n\n在虚拟机管理程序架构中，每个虚拟机都有自己的操作系统副本及相关依赖项。这允许传统的代码编写或遗留代码运行，但缺乏\
  \ Docker 的资源效率和可扩展性。你还需要独立地维护每个虚拟机的补丁。\n\n**虚拟机管理程序概述（非常适合遗留应用）**\n\n第 4 层：应用程序/服务/数据\n\
  第 3 层：虚拟机（带有 OS [Windows, Linux]）\n[多个虚拟机可以在系统内存中运行]\n第 2 层：主机 OS（即 Windows, Linux）\n\
  第 1 层：虚拟机管理程序（即 VMWare, Hyper-V, Xen）\n第 0 层：基础设施（即 硬件、虚拟机、云、IoT 等）\n\nDocker 容器由\
  \ Docker 镜像构建。默认情况下，镜像从 Docker Hub (`https://hub.docker.com`) 拉取。Docker Hub 是由该技术的公司管理的\
  \ Docker 仓库。任何人都可以将他们的镜像托管在 Docker Hub 上，因此最流行的应用程序和 Linux 发行版已经在那里托管了镜像。\n\n**注意：**\n\
  \n安装步骤可能会根据你使用的发行版而有所不同。如果你遇到问题，请查找针对你系统上运行的发行版版本可能提供的特定指南。\n\n要理解 Docker 的重要性，理解一个名为“函数”的基础基础编程概念会有帮助。在传统编程中，函数允许程序员编写可重用的代码块，这些代码块可以根据需要多次使用。函数的限制仅限于编程语言的能力和程序员的想象力。\n\
  \nDocker 容器在某些方面类似于函数，因为它包含了可以根据需要多次使用的可重用代码。使用 Docker 技术时，开发者可以创建一个极具可扩展性的程序。与其编写一个庞大的单体程序，他们可以将代码拆分为\
  \ Docker 容器。\n\n当开发者需要扩展或缩小系统资源时，他们所要做的只是根据他们需要的镜像启动或停止容器。这是对该技术的过度简化解释，但希望你能看到它的强大。\n\
  \n你实际上可以在几微秒内启动或停止 Docker 容器，而启动一个虚拟机可能需要几秒到几分钟。Docker 容器还具有系统资源占用较小的优势，因为它们没有自己独立的操作系统。\n\
  \n本章仅在非常高层概述了 Docker，这应该足够让你开始理解它是做什么的。\n\n## 从官方 Docker 仓库安装 Docker\n\n你可以使用发行版内置的仓库来安装\
  \ Docker，但它们并不总是提供最新版本。要获取最新版本的 Docker，你需要将你的包管理器指向官方仓库。\n\n更新你的包管理器仓库信息，输入：\n\n\
  ```bash\nsudo apt-get update\n```\n\n确保你的 apt 包管理器具有 HTTPS 下载的先决条件，输入：\n\n```bash\n\
  sudo apt-get install apt-transport-https ca-certificates curl software-properties-common\n\
  ```\n\n将官方 Docker 仓库 GPG 密钥添加到 apt 包管理器，输入：\n\n```bash\ncurl -fsSL https://download.docker.com/linux/ubuntu/gpg\
  \ | sudo apt-key add -\n```\n\n将 Docker 仓库添加到 apt 源，输入：\n\n```bash\nsudo add-apt-repository\
  \ \"deb [arch=amd64] https://download.docker.com/linux/ubuntu bionic stable\n```\n\
  \n更新 apt 包数据库以包含 Docker 软件包，输入：\n\n```bash\nsudo apt-get update\n```\n\n\n\n\n\n\
  确保你正在从正确的 apt 仓库安装 Docker 而不是默认仓库，输入：\n\n```\napt-cache policy docker-ce\n```\n\n\
  你应该能看到以下信息，提示你安装包来自 Docker 仓库：\n\n![](img/00010.jpeg)\n\n安装 Docker 服务，输入：\n\n```bash\n\
  sudo apt-get install docker-ce\n```\n\n检查 Docker 服务是否正在运行，输入：\n\n```bash\nsudo systemctl\
  \ status docker\n```\n\n你应该能看到以下信息，提示服务正在运行：\n\n... Active: active (running) ...\n\
  \n### 注意事项\n\n在安装 Docker 时，你将获得 Docker 服务（守护进程）和 docker 命令行工具。docker 命令行工具是你与服务、镜像和容器进行交互的方式。\n\
  \n`docker` 命令必须由 root 用户或在 Docker 安装过程中自动创建的 docker 组的用户运行。要将你的用户名添加到 docker 组，请输入：`sudo\
  \ usermod -aG docker ${USER}`（如果遇到问题，请在命令中手动输入你的用户名）。然后注销并重新登录，或输入 `su - ${USER}`，确认你是否在\
  \ docker 组中，输入 `id -nG`。\n\n## 使用和测试 Docker 服务\n\n在本节及本章的其余部分假设你已经将用户账户添加到前面提到的\
  \ docker 安全组。如果没有添加，你需要在 docker 命令前加上 `sudo` 命令。\n\nDocker 命令的语法格式如下：\n\n```bash\n\
  docker [option] [command] [arguments]\n```\n\n要检查 Docker 是否正在运行以及连接性是否工作正常，输入：\n\
  \n```bash\ndocker run hello-world\n```\n\n### 注意\n\n如果本地仓库中尚未安装该镜像，它将自动从 Docker\
  \ Hub 网站[默认仓库]进行下载。\n\n![](img/00011.jpeg)\n\n要显示下载到你计算机上的镜像，输入：\n\n```bash\ndocker\
  \ images\n```\n\n![](img/00012.jpeg)\n\n要在 Docker Hub 网站 (https://hub.docker.com/)\
  \ 上搜索可用的 Docker 镜像，使用以下命令返回所有匹配搜索字符串的镜像列表，输入：\n\n```bash\ndocker search hello-world\n\
  ```\n\n![](img/00013.jpeg)\n\n### 注意\n\n如果 OFFICIAL（官方）列对某个 Docker 镜像显示为 [OK]，则意味着该镜像是由项目背后的公司构建并支持的。\n\
  \n## 启动 Docker 容器\n\n我认为强调 Docker 镜像和容器之间的区别是非常重要的。Docker 镜像是一个数字模板，存储了资源（即程序、库等）和数据。当你运行一个镜像时，它的副本会被加载到内存中，然后变成一个\
  \ Docker 容器。\n\n下载官方的 Ubuntu 镜像，输入：\n\n```bash\ndocker pull ubuntu\n```\n\n![](img/00014.jpeg)\n\
  \n运行带有最新 Ubuntu 镜像的容器，输入：\n\n```bash\ndocker run -it ubuntu\n```\n\n### 注意\n\n`-i`\
  \ 和 `-t` 提供了进入容器的交互式 shell 访问。\n\n输出看起来类似于：\n\n```bash\nroot@d57e5d79b88d:/#\n```\n\
  \n`d57e5d79b88d` 是 `CONTAIN_ID`，如果你想删除它，稍后需要它。\n\n容器内可以执行任何 Linux 命令（只要它已安装），并且所有更改仅在容器内部。例如，你可以安装\
  \ Midnight Commander (MC)，执行它，然后退出容器。\n\n### 注意\n\n在容器内部时，你不需要在任何命令前加上 `sudo`，这是因为你始终以\
  \ root 用户身份操作。\n\n```bash\nroot@d57e5d79b88d:/# apt update\nroot@d57e5d79b88d:/#\
  \ apt install mc\nroot@d57e5d79b88d:/# mc\nroot@d57e5d79b88d:/# exit\n```\n\n##\
  \ 管理 Docker 镜像和容器\n\n当你有多个 Docker 容器在内存运行时，你需要理解管理它们所需的常用命令（例如启动、停止等）。\n\n要显示系统上活跃（运行）的容器，输入：\n\
  \n```bash\ndocker ps\n```\n\n要显示系统上活跃（运行）和非活跃的容器，输入：\n\n```bash\ndocker ps -a\n\
  ```\n\n启动 Docker 容器（即之前下载的 Ubuntu 镜像），使用你想启动的镜像容器 ID，输入：\n\n```bash\ndocker start\
  \ d57e5d79b88d\n```\n\n### 注意\n\n容器 ID 和名称会随着这些进程的启动和停止而不断变化。这里仅作为完整命令形式的示例。\n\n\
  要停止 Docker 容器，使用你想停止的镜像容器 ID 或分配的名称（参见 `ps` 的输出），输入：\n\n```bash\ndocker stop happy_villani\n\
  ```\n\n当你不再需要某个容器时，可以删除它，输入：\n\n```bash\ndocker rm happy_villani\n```\n\n### 注意\n\
  \n可以覆盖任何选项（如自动命名）。你所做的就是在创建容器的命令中添加正确的开关（例如 `--name`）。\n\n## 提交 Docker 镜像\n\n在你按照想要的方式修改容器后，你必须提交更改并根据你所做的更改创建一个新的\
  \ Docker 镜像。否则，如果你不想保留更改，可以删除该容器，所做的更改将会丢失。\n\n这是 `commit` 命令的语法：\n\n```bash\ndocker\
  \ commit -m \"commitment message\" -a \"author name\" container_id repository/new_image_name\n\
  ```\n\n### 注意\n\n例如，`docker commit -m \"commitment message\" -a \"author name\"\
  \ d57e5d79b88d repository/new_image_name`\n\n要查看你上安装的所有镜像，输入：\n\n```bash\ndocker\
  \ images\n```\n\n## 将镜像推送到 Docker 仓库\n\n在 Docker 镜像已经按照你想要的方式定制后，你可以将这些更改上传到 Docker\
  \ Hub 以供他人使用。\n\n登录 Docker 注册表，输入：\n\n```bash\ndocker login\n```\n\n使用账户密码验证身份后，你可以推送自己的镜像，输入：\n\
  \n```bash\ndocker push username/image-name\n```\n\n将镜像推送到你的账户后，Docker 镜像将显示在你的仪表板上。\n\
  \n要在另一台计算机从 Docker 账户拉取镜像，输入：\n\n```bash\ndocker pull jane2020/Ubuntu_test1\n```\n\
  \n## Docker 命令 (版本)\n\n这是当前 docker 命令列表（截至本书编写）以及它们的功能描述。所有这些命令都需要 `docker` 命令在前。\n\
  \n例如，`docker info` 显示运行的 Docker 服务的信息。\n\n有关某个特定命令的更多信息，输入：\n\n```bash\ndocker COMMAND\
  \ --help\n```\n\n- `attach`: 将本地 STDIN、输出和错误流附加到运行的容器。\n- `build`: 从 Docker 文件构建镜像。\n\
  - `commit`: 从容器更改创建新镜像。\n- `cp`: 在容器和本地文件系统之间复制文件。\n- `create`: 创建新容器。\n- `diff`:\
  \ 检查容器文件系统中文件或目录的变化。\n- `events`: 获取服务器的实时事件。\n- `exec`: 在运行的容器中执行命令。\n- `export`:\
  \ 将容器文件系统导出为 tar 归档。\n- `history`: 显示镜像的历史。\n- `images`: 列出容器镜像。\n- `import`: 从\
  \ tar 包导入内容创建文件系统镜像。\n- `info`: 显示系统级信息。\n- `inspect`: 返回 Docker 对象的低级信息。\n- `kill`:\
  \ 杀死一个或多个运行的容器。\n- `load`: 从 tar 归档或 STDIN 加载容器镜像。\n- `login`: 登录 Docker 注册表。\n\
  - `logout`: 注销 Docker 注册表。\n- `logs`: 获取特定容器的日志。\n- `pause`: 暂停一个或多个容器内的所有进程。\n\
  - `port`: 列出端口映射或容器的特定映射。\n- `ps`: 列出系统上安装的容器。\n\n\n\n\n\n- `pull`: 从注册表拉取镜像或仓库。\n\
  - `push`: 将镜像或仓库推送到注册表。\n- `rename`: 重命名容器。\n- `restart`: 重启一个（或多个）容器。\n- `rm`:\
  \ 删除一个（或多个）容器。\n- `rmi`: 删除一个（或多个）镜像。\n- `run`: 在新容器中运行命令。\n- `save`: 将一个（或多个）镜像保存为\
  \ tar 存档（默认流到 STDOUT）。\n- `search`:  Docker Hub。\n- `start`: 启动一个（或多个）容器。\n- `stats`:\
  \ 显示容器资源使用统计的实时流。\n- `stop`: 停止一个（或多个）运行中的容器。\n- `tag`: 创建指向 `SOURCE_IMAGE` 的标签\
  \ `TARGET_IMAGE`。\n- `top`: 显示容器的运行进程。\n- `unpause`: 恢复一个（或多个）容器内所有进程运行。\n- `update`:\
  \ 更新一个（或多个）容器的配置。\n- `version`: 显示 Docker 版本信息。\n- `wait`: 阻塞直到一个（或多个）容器停止，然后打印它们的退出码。\n\
  \n# 安全提示（系统锁定）\n\n### 概述\n你每天都会读到这家公司或那家公司是如何被恶意个人或组织入侵的。保护你自己和业务所能做的主要措施之一，就是锁定你的服务器和桌面的安全性。\n\
  \n### 前提条件\n本节要求你在系统上拥有 root 权限，以便安装服务并对操作系统进行更改。\n\n本节涵盖了你可以采取的一些操作，以增加“坏人分子”（即黑客）入侵你系统的难度。请注意，本节仅提供了某些可用选项的高级概述。你可能需要针对你正在使用的发行版查找如何实现这些更改。\n\
  \n## 警告\n对于任何类型的更改，在未先在开发系统或预生产系统上进行测试之前，绝不应用于生产系统。你需要确保这些任何更改都不会影响你应用程序的运行。\n\n\
  任何操作系统的大多数新安装版本在进行默认安装时都比以前更安全。尽管如此，如果你有一个旧的系统，它可能需要一些加固，以更有效地抵御攻击。\n\n本章包含了一份建议的安全工具和技巧，用于执行不同类型的系统安全管理任务和诊断。\n\
  \n## 核心安全哲学\n每个信息技术领域的每个人都应该遵循核心安全哲学。本节内容非常抽象，可能会过度简化主题，但请注意，其范围比这里涵盖的要广泛得多。\n\n\
  最常见的恶意分子类型（寻找窃取所能物品的个人或群体）正在寻找可以快速入侵的容易目标。这类攻击更容易防御，你主要只需要确保你的系统已锁定并更新即可。\n\n而那些更有决心的恶意分子（通常是国家级背景的）则要困难得多。他们通常有一个特定的攻击目标，并会使用任何他们想要的方法来实现最终目标。\n\
  \n下面列出的核心安全哲学只是许多原则中的几项，但这些是一个很好的起点：\n\n- **最小权限原则 (Least Privilege)**：仅授予用户完成其工作所需的权限。不要为了让你的工作更方便就给用户授予管理员（admin）权限。\n\
  - **深度防御 (Defense in Depth)**：创建多层安全或防御层。例如，设置一个外部外部防火墙来保护你的边界，利用操作系统的本地防火墙，然后加密你所有的数据和通信。\n\
  - **保持持久性 (Be Persistent)**：恶意分子不断改变他们的攻击方法，因此你必须不断适应新方法来防御这些新类型的攻击。\n- **减少攻击面\
  \ (Reduce your Attack Surface)**：关闭不需要的服务，更改默认密码和账户，确保你的防火墙配置正确等。\n\n接下来的安全图是一个高级工具，有助于视觉化你需要考虑的防御攻击的不同层次。它还简要描述了为了保护该层你需要执行的一些考虑因素。\n\
  \n### 安全概述\n- **第 8 层**: 系统备份（最后一道防线，需要定期测试）\n- **第 7 层**: 应用程序/服务（例如：需要补丁 [Docker、Web\
  \ 服务、数据库]）\n- **第 6 层**: 用户安全（例如：执行强密码并定期更换）\n- **第 5 层**: 文件系统（例如：减少文件权限，加密数据）\n\
  - **第 4 层**: 网络/防火墙（例如：阻塞不必要的端口，加密通信）\n- **第 3 层**: 操作系统（例如：需要补丁）\n- **第 2 层**:\
  \ 基础设施（例如：需要补丁 [硬件、管理程序、交换机、虚拟机等]）\n- **第 1 层**: 边界（例如：需要监控 [路由器/防火墙]）\n- **第 0\
  \ 层**: 公共网络（例如：互联网）[无保护]\n\n如果你有时间，我鼓励你阅读关于这个主题的内容。\n\n## 检查系统的恶意软件\n即使是 Linux 也无法免于恶意软件，`ClamAV`\
  \ 是该操作系统最流行的反病毒扫描器之一。建议你定期扫描系统以检测恶意代码。\n\n还有其他反病毒扫描选项可以帮助保护你的系统，但遗憾的是目前不会在涵盖范围内。\n\
  \n使用以下方法之一安装此扫描器：\n\n对于基于 Debian 的系统：\n```bash\nsudo apt-get install clamav\n```\n\
  -或-\n\n对于基于 Red Hat 的系统：\n```bash\nsudo yum install epel-release\nsudo yum install\
  \ clamav\n```\n\n要运行扫描器，你首先需要用最新的签名对其进行更新，输入：\n```bash\nsudo freshclam\n```\n\n\
  扫描特定文件夹，输入：\n```bash\nsudo clamscan -r --bell -i / (从根目录开始扫描)\n```\n-或-\n```bash\n\
  sudo clamscan -r --bell -i /home (扫描 /home 目录)\n```\n\n**提示：**\n要安装客户端的 GUI 版本（X-Windows），输入：\n\
  ```bash\nsudo apt-get install clamtk\n```\n\n更多信息：\n[`www.clamav.net/`](https://www.clamav.net/)\n\
  \n## 锁定系统的物理访问\n任何生产系统都应该处于一个加密环境中，具有物理访问控制、备用电源和冷却。如果恶意分子拥有设备的物理访问权限，他们可以绕过大多数系统安全功能。\n\
  \n尽管如此，你仍然可以增加他们的难度。以下是一些建议：\n\n- 锁定固件 (BIOS/UEFI)，将其配置为禁用从光盘或外部设备（如 USB 闪存设备）启动。还要确保启用了固件密码。\n\
  \n**注意：**\n参考你的计算机或主板制造商网站获取如何执行这些操作的说明。\n\n- 启用带有密码的 GRUB 以限制对本地文件系统的访问。加密本地文件系统、文件权限、数据库数据等。\n\
  - 加密所有网络通信。这将使恶意分子难以在数据传输过程中嗅探你的数据。\n- 不要使用 root 账户，如 `root`、`admin` 或 `administrator`。在用户名上下点创意。\n\
  - 确保为所有账户使用强密码，并定期更改。\n\n## 分区你的数据\n在创建新系统时，设置多个分区来存放数据是非常重要的，这可以防止数据损坏以及某些类型的系统资源耗尽攻击。\n\
  \n例如，如果交换区域（swap）和日志没有分别位于自己的分区上。如果攻击者尝试通过某种攻击（例如 DDoS）将它们填满，可能会导致系统关闭或失败。\n\n**注意：**\n\
  第三方应用程序应该安装在 `/opt` 目录下的独立文件系统和分区上。\n\n## 移除未使用的软件\n移除或禁用任何你未使用的应用程序、服务或包都可以帮助保护你的计算机。通过这样做，你减少了恶意人员可以用来接管你系统的攻击目标。\n\
  \n移除这些软件还有一个好处，即释放了被该应用程序浪费的空间、CPU 和其他系统资源。\n\n\n\n\n\n接下来是某些可以帮助你查找并移除不再需要的内容命令。\n\
  \n列出所有可用软件包，输入：\n\n`sudo apt-cache pkgnames`\n\n获取软件包名称的简要描述，输入：\n\n`sudo apt-cache\
  \ search package_name`\n\n获取软件包的详细信息，输入：\n\n`sudo apt-cache show package_name`\n\
  \n检查特定软件包的依赖关系，输入：\n\n`sudo apt-cache showpkg package_name`\n\n检查软件包缓存统计信息，输入：\n\
  \n`sudo apt-cache stats`\n\n卸载软件包（保留配置文件，以备重新安装），输入：\n\n`sudo apt-get remove package_name`\n\
  \n完全卸载软件包（删除配置文件），输入：\n\n`sudo apt-get purge package_name`\n\n## 监控连接\n\n你的计算机可能同时运行着几十个或几百个连接。有时，你可以通过注意来自异常端口或服务的奇怪连接来识别攻击者。\n\
  \n要检查连接到计算机的连接，输入：\n\n`netstat -tulpn`\n\n显示所有 TCP 套接字：\n\n```bash\n# ss -t -a\n\
  ```\n\n注意：\n\n书中书中提供了更多关于 `netstat` 和 `ss` 命令的示例，这里仅供参考。\n\n## 用户账户限制\n\n### 手动禁用账户\n\
  \n你可以在不删除账户的情况下手动禁用（即锁定）或重新启用（即解锁）账户。当用户休假或其他原因离开时这非常有用，你可以禁用它而不是删除它。\n\n如果有人尝试登录禁用的账户，他们将收到以下消息：“此账户目前不可用（This\
  \ account is currently not available）。”\n\n锁定账户，输入：\n\n`sudo passwd -l user_name`\n\
  \n解锁账户，输入：\n\n`sudo passwd -u user_name`\n\n### 强制执行强密码\n\n如果系统允许，用户默认会为他们的账户使用弱密码。这使得攻击者更容易通过基础攻击（如字典攻击或暴力破解攻击）攻破你的系统。\n\
  \nPAM（可插身份验证模块）提供了 `pam_cracklib` 模块，它可以强制用户使用强密码。\n\n要实现此技术，请遵循以下指令操作：\n\n打开文本编辑器，输入：\n\
  \n`sudo nano /etc/pam.d/system-auth.`\n\n使用以下任何参数添加相应的行，例如：分别对应 `lcredit`、`ucredit`、`dcredit`\
  \ 和/或 `ocredit`（小写、大写、数字和其他）。例如，输入：\n\n`/lib/security/$ISA/pam_cracklib.so retry=3\
  \ minlen=8 lcredit=-1 ucredit=-2 dcredit=-2 ocredit=-1`\n\n### 锁定用户账户\n\n使用 PAM\
  \ 模块禁止用户使用旧密码。\n\nRHEL / CentOS / Fedora，输入：\n\n`sudo nano /etc/pam.d/system-auth`\n\
  \n或-\n\nUbuntu / Debian / Linux Mint，输入：\n\n`sudo nano /etc/pam.d/common-password`\n\
  \n在 auth 部分添加以下行，输入：\n\n`authsufficientpam_unix.solikeauthnullok`\n\n在 password\
  \ 部分添加下一行（这将不允许用户重复使用最后 5 个密码），输入：\n\n`password sufficient pam_unix.so nullok use_authtok\
  \ md5 shadow remember=5`\n\n注意：\n\n旧密码文件位于：`/etc/security/opasswd`\n\n## 管理用户密码过期\n\
  \n在 Linux 中，用户密码存储在加密的 `/etc/shadow` 文件中。要显示用户的密码过期信息，你需要使用 `chage` 命令。它将显示密码过期的细节以及最后更改密码的日期。输入：\n\
  \n`chage -l username`\n\n要更改任何用户的密码年龄选项，使用以下命令，输入：\n\n`sudo chage -M 90 user_name`\n\
  \n或-\n\n`chage -M 90 -m 7 -W 5 user_name`\n\n## 禁用 X-Windows\n\n如果你在生产机器上运行 X-Windows，应该将其移除。X-Windows\
  \ 为系统增加了不需要的额外开销，消耗额外的资源（如 RAM、CPU、存储空间），并且总的来说会降低系统的安全性。\n\n要禁用 GDM（GNOME 显示管理器），输入：\n\
  \n`sudo update-rc.d -f gdm remove`\n\n注意：\n\n要再次启用 GDM，输入：\n\n`sudo update-rc.d\
  \ -f gdm defaults`\n\n## 锁定 SSH\n\n确保锁定用于远程管理的 ssh（安全外壳）配置。否则，攻击者可以利用此服务为之，远程接管系统。\n\
  \n要锁定它，你必须打开主 ssh 配置文件，验证、添加或更改以下项目：\n\n禁用 root 登录：\n\n`PermitRootLogin no`\n\n\
  仅允许特定用户：\n\n`AllowUsers user_name`\n\n仅使用 ssh 版本 2 协议：\n\n`Protocol 2`\n\n注意：\n\n\
  在用户登录系统时显示消息有两种方法。首先是 `/etc/issue.net` 文件，在用户获得登录提示之前显示消息横幅。其次是 `/etc/motd` 文件，在用户登录后显示消息横幅。\n\
  \n要实现此类用户通知，打开 ssh 配置文件，输入：\n\n`nano /etc/ssh/sshd_config`\n\n然后搜索单词 \"Banner\"\
  。将该行更新为：\n\n`Banner /etc/issue.net.`\n\n重启 ssh 进程，输入：\n\n`/etc/init.d/sshd restart`\n\
  \n## 禁用 Ctrl+Alt+Delete\n\n在大多数发行版中，按下 `Ctrl+Alt+Delete` 键会导致系统重启。这可能不是你想要的功能，以下指令讨论了如何更改此功能。\n\
  \n基于 Red Hat 的系统：要禁用此功能，在 `sudo nano /etc/inittab` 文件中，取消 # Trap Ctrl+Alt+Delete\
  \ 下方行的注释。\n\n`ca::ctrlaltdel:/sbin/shutdown -t3 -r now`\n\n或-\n\n基于 Debian 的系统：要禁用此功能，运行以下两个命令，输入：\n\
  \n`sudo systemctl mask Ctrl-alt-del.target`\n\n`sudo systemctl daemon-reload`\n\n\
  ## 监控空密码账户\n\n有一种简单的方法可以检查是否有用户账户具有空密码，这类账户是重大的安全风险。这些账户允许未经授权的用户仅通过按 Enter 键访问你的系统，并且也让你的系统更容易受到攻击。\n\
  \n要检查任何账户是否有空密码，输入：\n\n`sudo cat /etc/shadow | awk -F: '($2==\"\"){print $1}'`\n\
  \n## 保持系统更新\n\n保持系统和应用程序更新到最新版本至关重要，根据发行版的不同，需要的命令集也会所不同。\n\n这在书中以前介绍过，再次涵盖是为了防止你需要在之前的章节中查找这些信息。\n\
  \n基于 Debian 的系统，输入：\n\n`sudo apt-get update; apt-get upgrade`\n\n或-\n\n基于 Red Hat\
  \ 的更新，输入：\n\n`sudo yum updates; yum check-update`\n\n## 加固 CRONTAB\n\n如果你的系统在使用\
  \ CRON 任务，锁定对它们的访问是非常重要的。CRON 服务允许你指定谁可以或你不想允许他们运行任务。\n\n此服务通过两个名为 `/etc/cron.allow`\
  \ 和 `/etc/cron.deny` 的文件控制。\n\n要防止用户被使用 CRON 服务，只需将用户名添加到 `/etc/cron.deny` 文件中。\n\
  \n要禁用所有用户使用 CRON 服务，将关键字 ‘ALL’ 行添加到 `/etc/cron.deny` 文件中，输入：\n\n`sudo echo ALL ^>>/etc/cron.deny`\n\
  \n要允许用户运行 CRON 任务，请将他们加入 `/etc/cron.allow` 文件。\n\n注意：\n\n锁定脚本权限非常重要，以免恶意用户替换它并进行权限提升攻击。这种情况是指他们替换一个以高权限账户运行的脚本，以执行特定操作来提升他们的系统权限。\n\
  \n## 禁止 USB 驱动器\n\n可以防止用户在你的系统使用 USB 闪存器。这可以帮助防止他人安装新软件或从从中窃取数据。\n\n尽管像任何安全更改一样，这可能看起来很小，但它只是任何安全模型中心的一个枢辐。\n\
  \n使用 `lsmod` 命令显示所有加载的内核驱动程序，过滤出 USB 存储\n\n`sudo lsmod | grep usb_storage`\n\n注意：\n\
  \n要验证上一个操作成功完成，再次运行之前的命令，确认该行不存在。\n\n\n\n\n\n你应该看到 `sub_storage` 模块正在被 `uas` 模块使用。现在你需要从内核中卸载这两个\
  \ USB 存储模块。\n\n```bash\nsudo modprobe -r usb_storage\nsudo modprobe -r uas\n```\n\
  \n你阻止了在未来的重启后将 USB 存储模块加载到内核。要实现这一点，将 `usb-storage.ko.xz` 模块重命名为 `usb-storage.ko.xz.block`。\n\
  \n```bash\ncd /lib/modules/`uname -r`/kernel/drivers/usb/storage/\nsudo mv usb-storage.ko\
  \ usb-storage.ko.block\n```\n（基于 Debian 的系统）\n\n-或者-\n\n```bash\nsudo mv usb-storage.ko.xz\
  \ usb-storage.ko.xz.block\n```\n（基于 Red Hat 的系统）\n\n**提示：** \n\n将系统功能恢复到原始状态。你只需要将\
  \ `usb-storage.ko` 文件重命名回原始名称（然后重启系统），并输入：\n\n```bash\ncd /lib/modules/`uname -r`/kernel/drivers/usb/storage/\n\
  sudo mv usb-storage.ko usb-storage.ko.block\n```\n（基于 Debian 的系统）\n\n-或者-\n\n```bash\n\
  sudo mv usb-storage.ko.xz usb-storage.ko.xz.block\n```\n（基于 Red Hat 的系统）\n\n**注意：**\
  \ \n\n此方法仅适用于当前运行的内核模块。如果系统上有任何其他可用内核，你将修改每个内核模块目录的版本路径并重命名文件。\n\n## 启用 SELinux\n\
  \n安全增强 Linux (SELinux) 是内核提供的一种强制性访问控制安全机制。禁用 SELinux 意味着从系统中移除安全机制。\n\n如果你的系统连接到互联网并可供公众访问，建议启用此功能。\n\
  \n要检查 SELinux 是否启用，请输入：\n\n```bash\nsudo sestatus\n```\n\n-或者-\n\n```bash\ngetenforce\n\
  ```\n\n如果 SELinux 已禁用，要启用此功能请输入：\n\n```bash\nsudo setenforce enforcing\n```\n\n\
  **注意：** \n\n它也可以通过 `/etc/selinux/config` 文件进行管理（启用或禁用）。\n\nSELinux 提供三种基本运行模式，它们是：\n\
  \n- **Enforcing（强制）**：这是默认模式，在机器上启用并强制执行 SELinux 安全策略。\n- **Permissive（许可）**：在此模式下，SELinux\
  \ 不会对系统强制执行安全策略，只会警告并记录操作。这种模式在排查 SELinux 相关问题时非常有用。\n- **Disabled（禁用）**：SELinux\
  \ 已关闭。\n\n## 监控用户活动\n\n为了防止外部（即恶意用户）或内部（即你的员工）威胁，你需要监控用户活动。恶意用户（或外部攻击者）是最容易理解的威胁。而内部威胁是最难防范的，因为这通常是组织信任的人。\n\
  \n有两个工具可以监控用户活动：`psacct`（基于 Red Hat 的系统）或 `acct`（基于 Debian 的系统），它们对于监控系统上的用户活动和进程非常有用。这些工具在系统后台运行，跟踪系统上的每个用户活动以及\
  \ `Apache`、`MySQL`、`SSH`、`FTP` 等服务的资源消耗。\n\n要这些这些工具，使用以下命令之一：\n\n基于 Red Hat 的系统：\n\
  \n```bash\nsudo yum install psacct\n```\n\n基于 Debian 的系统：\n\n```bash\nsudo apt-get\
  \ install acct\n```\n\n### 监控日志文件\n\n保护日志对于帮助你排查系统或应用程序故障至关重要。它们还能告诉你是否有入侵者攻击了你的系统，以及他们可能是如何攻破该系统的。这就是为什么你想要防止入侵者轻易删除或修改本地日志文件。\n\
  \n为了帮助防止入侵者轻易修改或破坏本地日志，以下是常见的 Linux 默认日志文件名及其用途。\n\n- `/var/log/auth.log`：身份认证日志。\n\
  - `/var/log/boot.log`:系统启动日志。\n- `/var/log/cron.log`:Crond 日志（定时任务）。\n- `/var/log/kern.log`:内核日志。\n\
  - `/var/log/message`：系统日志（当前系统活动）。\n- `/var/log/mysqld.log`:MySQL 数据库服务器日志文件。\n\
  - `/var/log/secure`:身份认证日志。\n- `/var/log/utmp` -或者- `/var/log/wtmp`:登录日志文件。\n- `/var/log/yum.log`:Yum\
  \ 日志文件。\n\n**注意：** \n\n这些日志的可用性和位置会根据发行版以及安装的应用程序和服务的版本而异。可能还有其他你应该监控的日志，这可能需要你进行额外的研究来识别哪些是它们。\n\
  \n## 忽略 ICMP 或广播请求\n\n可以告诉 Linux 忽略 ICMP 或网络广播请求。攻击者可以使用此信息快速检查系统是否存在。\n\n它还可以告诉攻击者系统是否经过加固。这是一项如此基础的预防措施，如果你没有实施这一项，你可能没有执行其他常见的加固技术。\n\
  \n要强制 Linux 忽略 ping 回显（ping），输入：\n\n```bash\nsudo sysctl -w net.ipv4.icmp_echo_ignore_all=1\n\
  ```\n\n要告诉 Linux 忽略广播请求，输入：\n\n```bash\nsudo sysctl -w net.ipv4.icmp_echo_ignore_broadcasts=1\n\
  ```\n\n**注意：** \n\n当运行以下命令时，它们会修改 `/etc/sysctl.conf` 文件。要强制加载设置，输入：\n\n```bash\n\
  sudo sysctl -p\n```\n\n**提示：** \n\n要重新启用这些功能，请输入：\n\n```bash\nsudo sysctl -w net.ipv4.icmp_echo_ignore_all=0\n\
  sysctl -w net.ipv4.icmp_echo_ignore_broadcasts=0\n```\n\n## 漏洞扫描\n\n可以告诉 Linux 忽略\
  \ ICMP 或网络广播请求。攻击者可以使用此信息快速检查系统是否存在。\n\n它还可以告诉攻击者系统是否经过加固。这是一项如此基础的预防措施，如果你没有实施这一项，你可能没有执行其他常见的加固技术。\n\
  \n如果你真的很担心系统，可以使用像 `lynis` 这样的安全审计工具。\n\n### Lynis 扫描\n\n要运行扫描，输入：\n\n```bash\n\
  lynis audit system\n```\n\n如果该包尚未安装，输入：\n\n```bash\nsudo apt-get install lynis\n\
  ```\n\n## 杂提示\n\n### 系统\n\n准确的系统时间对于现代加密和其他系统功能（如日志记录）至关重要。如果你的系统没有准确的时间，某些功能可能无法工作。\n\
  \nsystemd 提供了 `systemd-timescd` 客户端，它可以查询远程服务器并调整你的系统时间。在以下文件中配置你的服务器：`/etc/systemd/timesyncd.conf`。\n\
  \n## 网络\n\n可靠且可信的 DNS 对于网络安全至关重要。如果你在组织外部使用公共 DNS，请使用可信的 DNS 源，例如：\n\n- Google 公共\
  \ DNS (`8.8.8.8` 和 `8.8.4.4`)\n--或者-\n- Cloudflare (`1.1.1.1` 和 `1.0.0.1`)\n\n\n\
  \n\n我想说明，有一些命令行和 GUI 应用程序可以让防火墙的管理变得简单。尽管如此，我强烈建议你先学习如何从命令行进行操作，这将让你对如何管理此服务有更深入的理解。\n\
  \n### 注意\n`iptables` 工具用于 IPv4，而 `ip6tables` 工具用于 IPv6。\n\n有三个不同的 `iptables` 链：`input`（输入）、`forward`（转发）和\
  \ `output`（输出）。\n\n`input` 链控制入站网络连接的行为（例如 `ssh` 连接）。`iptables` 将尝试将 IP 地址、协议和端口与\
  \ `input` 链中的规则进行匹配，然后决定是允许还是拒绝连接。\n\n`forward` 链控制并非用于本地系统而是将转发到另一个系统的出站网络数据。除非你的系统正在提供某种路由、NAT\
  \ 或类似使用转发的某种类型的服务，否则你可能根本不会用到这个功能。\n\n### 提示\n要检查你的系统是否在使用 IP 转发，请使用以下命令并查看策略是否在接受数据包，输入：\n\
  \n```\nsudo iptables -L -v\n```\n\n`output` 链控制出站网络连接（例如 `ping` 命令）。`iptables` 将尝试将\
  \ IP 地址、协议和端口与 `output` 链中的规则进行匹配，然后决定是允许还是拒绝连接。\n\n### 注意\n在使用任何防火墙锁定系统时，必须记住有几个协议需要双向通信。因此，记住你可能需要同时创建\
  \ `input` 和 `output` 规则很重要。\n\n`iptables` 对数据包有三种不同的响应：`accept`（接受）、`drop`（丢弃）和\
  \ `reject`（拒绝）。`accept` 响应接受连接。`drop` 响应直接丢弃数据包，就像从未收到过一样。最后是 `reject` 响应，它向请求系统返回一个错误。\n\
  \n`iptables` 处理规则的方式是从列表顶部开始遍历每条规则，直到找到匹配数据包的规则。在编写规则时你需要考虑这一点。需要注意的是，`-A` 将规则附加到现有链的末尾。`-I\
  \ [chain] [number]` 允许你指定规则应该所在的列表行号。\n\n阻止来自单个 IP 地址的所有连接，输入：\n\n```bash\nsudo\
  \ iptables -A INPUT -s 192.168.0.100 -j DROP\n```\n\n使用标准斜杠符号或子网掩码阻止来自 IP 范围的所有连接，输入：\n\
  \n```\nsudo iptables -A INPUT -s 192.168.0.0/24 -j DROP\n```\n\n或者\n\n```\nsudo\
  \ iptables -A INPUT -s 192.168.0.0/255.255.255.0 -j DROP\n```\n\n阻止来自单个 IP 地址的所有连接，输入：\n\
  \n```bash\nsudo iptables -A INPUT -s 192.168.0.100 -j DROP\n```\n\n要从特定 IP 地址丢弃特定协议或端口号，输入：\n\
  \n```\nsudo iptables -A INPUT -p tcp --dport ssh -s 192.168.0.100 -j DROP\n```\n\
  \n从所有 IP 地址丢弃特定协议或端口号，输入：\n\n```\nsudo iptables -A INPUT -p tcp --dport ssh -j DROP\n\
  ```\n\n插入一条规则，输入：\n\n```\nsudo iptables -I INPUT 1 -s 192.168.0.100 -j ACCEPT\n\
  ```\n\n替换一条规则，输入：\n\n```\nsudo iptables -R INPUT 1 -s 192.168.0.100 -j ACCEPT\n\
  ```\n\n### 注意\n在远程操作此服务时要小心，因为你可能会在玩弄此功能时把自己锁在远程系统之外。一旦你把自己锁在外面，你将需要对系统的某种终端访问权限来修复问题。\n\
  \n正如本节早些时候提到的，某些应用程序和服务只需要单向连接。而其他应用程序和服务可能需要双向连接。例如，`ssh` 需要双向通信。\n\n如果你需要，防火墙的另一项额外功能称为“连接状态”（connection\
  \ state），它允许双向通信，但只允许单向建立连接。例如，你可以从本地系统向远程服务器建立新连接，它们被允许进行双向通信。尽管如此，从远程服务器到本地系统的新连接是不允许的。\n\
  \n```\nsudo iptables -A OUTPUT -p tcp --dport 22 -m 192.168.0.100 --ctstate NEW,ESTABLISHED\
  \ -j ACCEPT\n\nsudo iptables -A INPUT -p tcp --sport 22 -m 192.168.0.100 --ctstate\
  \ ESTABLISHED -j ACCEPT\n```\n\n### 注意\n你还可以指定其他协议，例如：`udp` 或 `icmp`。要在 `ip6tables`\
  \ 上控制 ICMP 流量，请使用协议：`ipv6-icmp`。\n\n## 保存更改\n\n当你完成防火墙更改后，你需要提交这些更改以保存它们。否则，它们将在下次重启或防火墙重新启动时丢失。\n\
  \n要提交防火墙更改，输入：\n\n```\nsudo /sbin/iptables-save\n```\n\n### 注意\n取决于你运行的发行版，这可能有所不同。\n\
  \n### 提示\n要清除所有当前配置的规则，请使用 flush 命令，输入：\n\n```\nsudo iptables -F\n```\n\n## 让 IPTABLES\
  \ 变得简单\n\n有几种可用工具可以让 `iptables` 管理变得稍微容易。例如，Ubuntu 自带了 `ufw` 命令。`ufw`或 Uncomplicated\
  \ Firewall（简单防火墙）是 `iptables` 的前端。该工具的主要目标是通过提供更简单的界面来让防火墙管理变得更容易。\n\n检查防火墙状态，输入：\n\
  \n```\nsudo ufw status\n```\n\n启用/禁用防火墙，输入：\n\n```\nsudo ufw [ enable | disable\
  \ ]\n```\n\n添加防火墙规则，输入：\n\n```\nsudo ufw allow [ 22/tcp| ssh/tcp ]\n```\n\n删除防火墙规则，输入：\n\
  \n```\nsudo ufw delete deny 443/tcp\n```\n\n启用/禁用防火墙日志，输入：\n\n```\nsudo ufw logging\
  \ [ on | off ]\n```\n\n## 高级防火墙操作\n\n本节涵盖了高级防火墙操作，如备份、导出和重新导入防火墙规则集到其他系统。它还涵盖了使用防火墙拦截无效数据包的某些类型网络攻击的基础知识。\n\
  \n你可以利用本节的知识来阻止每天变化的更现代、更威胁。\n\n### 导出和重新导入防火墙规则\n\n可以导出现有的防火墙规则，进行编辑然后重新导入。使用第一个命令转储当前规则，你可以对它们进行编辑，然后将编辑后的规则传回防火墙。\n\
  \n这也是备份一组运行正常的规则和/或在另一个系统上导入规则的好方法。\n\n要导出防火墙规则，输入：\n\n```\nsudo iptables-save >\
  \ ip_tables_v4.rules\n```\n\n要导入防火墙规则，输入：\n\n```\nsudo iptables-restore < ip_tables_v4.rules\n\
  ```\n\n### 注意\n这些命令的 IPv6 对应值为 `ip6tables-save` 和 `ip6tables-restore`。\n\n### 拦截无效\
  \ TCP 包\n\n可以使用某些规则拦截无效的 TCP 包。此功能有助于保护你的系统免受某些攻击。\n\nTCP 模块支持一个参数 `--tcp-flags`，允许监控单个\
  \ TCP 标志。该参数接受两个值：“掩码”（mask）和一组“比较标志”。掩码告诉防火墙应该检查哪些标志，而比较标志指示数据包中应该哪些标志。\n\n丢弃包含以下标志的数据包（圣诞树攻击），输入：\n\
  \n```\nsudo iptables -A INPUT -p tcp -m tcp --tcp-flags ALL FIN,PSH,URG -j DROP\n\
  ```\n\n丢弃包含以下标志的数据包（丢弃无效的 SYN 和 FIN 包），输入：\n\n```\nsudo iptables -A INPUT -p tcp\
  \ -m tcp --tcp-flags SYN,FIN SYN,FIN -j DROP\n```\n\n# 存储管理\n\n概述：Linux 提供了一套用于管理存储设备的工具。本节提供了这些命令的高级概述，以及文件系统如何利用存储的摘要。\n\
  \n## 存储概览\n\n层 4：文件和目录\n\n层 3：文件系统（例如 EXT4，等）\n\n层 2：分区（例如 MBR 或 GPT）\n\n[可选：抽象层，例如\
  \ RAID、LUN，等]\n\n层 1：存储（物理或虚拟）\n\n层 0：基础设施（例如 硬件、虚拟机、云端、IoT，等）\n\n\n\n\n第一个核心概念被称为“块存储”（block\
  \ storage），或被内核称为“块设备”（block device）。块设备可以是传统的机械硬盘（`HDD`），也可以固态存储设备（如 `SSD` 或 USB\
  \ 闪盘）。\n\n内核以称为“块”（blocks）的固定大小存储单元从这些设备中存储和检索数据。这只是对通过文件系统访问的计算机传统存储的一种不同思考方式。\n\
  \n当文件系统对存储设备进行分区时，它会将设备上的可用存储空间分割成更小的单元。假设你有一个 1TB 存储容量的存储设备。与其将所有内容都存储在一个 1TB 的驱动器中，不如将本地存储拆分为两个\
  \ 512GB 的分区，并让它们在文件系统中看起来像两块不同的磁盘。这允许你从逻辑上分离数据。例如，第一个分区用于操作系统和应用程序，第二个分区用于存放你的数据。\n\
  \n### 分区 (Partition)\n\n当你创建一个分区时，必须创建一个分区表，它是该分区内所有数据及其存储位置的索引。有几种不同类型的分区表。\n\n\
  有一种旧格式，由于年代久远而具有现代局限性，但提供了对旧文件系统的向后兼容。另一种是新的格式，它克服了前者的技术局限性，但提供了对新文件系统的向前兼容性。\n\n\
  `MBR`（主引导记录）已经存在了几十年，仍然被旧版应用程序使用，但它只允许四个主分区，且分区大小不能超过 2TB。可以将主分区进一步细分为更小的逻辑分区，称为扩展分区（extended\
  \ partition）。\n\n`GPT`（GUID 分区表）是一种更现代的标准，克服了 `MBRs` 的局限性。尽管如此，它需要新的硬件和固件来支持这些功能。大多数现代硬件在使用它时应该没有问题。\n\
  \n在大多数情况下，如果你必须在这两种分区表类型之间选择，由于具有向前支持，`GPT` 将是你的更好的选择。除非你有支持不兼容新文件系统的旧应用程序或硬件的需求。\n\
  \n### 文件系统 (Filesystem)\n\n一旦存储设备被正确分区，就需要对其进行格式化，文件系统才能真正利用它。格式化是为存储设备的分区区域做好准备，以容纳数据。如果没有格式化，你就无法在设备上存储数据。\n\
  \nLinux 支持多种不同的文件系统，每种系统都有其优缺点，包括对操作系统的支持。在最高层，大多数文件系统的运行方式是相同的（即管理文件），区别在于它们在底层执行操作的方式。例如，用于执行维护操作的命令和相关机制可能不同。\n\
  \n目前最流行的 Linux 文件系统有：\n\n- **BTRFS**：是一种较的文件系统，利用了写时复制（copy-on-write）技术。这种架构允许在文件系统层处理卷管理功能。这使得诸如快照（snapshots）和卷克隆等功能成为可能。该文件系统的问题是不成熟。一些管理员正在等待问题被修复后再将其投入生产工作负载中。\n\
  - **EXT4**：这是该文件系统的第四个扩展，通常是格式化卷时的默认选择。`EXT4` 是一种成熟的日志文件系统，提供了对遗留系统的向后兼容。它具有非常广泛的工具支持，并在可靠性方面记录良好。\n\
  - **XFS**：专为处理极大数据文件时的性能而设计。在处理大型存储设备时它具有更好的吞吐量特性。它还支持快照等功能。与 `EXT4` 不同，它使用元数据日志而不是对元数据和数据都进行记录。`XFS`\
  \ 提供了极佳性能，但在掉电时对数据损坏非常敏感。\n- **ZFS**：利用写时复制文件系统，并拥有成熟健壮的卷管理器。它支持数据完整性功能，可以处理大文件大小，并包含快照、克隆以及用于冗余和性能的软件\
  \ RAID 等功能。`ZFS` 因为许可问题具有争议性的历史。它在不同发行版中的支持程度也不一。\n\n### 管理存储设备 (Managing Storage\
  \ Devices)\n\n如前所述，所有设备都被视为文件。所有的存储设备都表示为 `/dev` 目录下的文件。这些文件名通常以 `SD` 或 `HD` 开头，后面跟着字母。例如，一个硬盘的名称可能是\
  \ `/dev/hda` 或 `/dev/hdb`。\n\n分区也被视为文件，并存储在 `/dev` 目录中。每个带有分区的存储设备都会在设备名称末尾加上一个数字。例如，分区\
  \ 1 的设备名称为 `/dev/hda1`，分区 2 的设备名称为 `/dev/hdb2`。\n\n### Notes (Notes)\n\nLinux 内核决定哪个设备获得什么名称。\n\
  \n文件系统层次结构标准（FHS）建议使用 `/mnt` 子目录或其下的其他目录。\n\n### 永久挂载点 (Permanent Mount Points)\n\
  \n`/etc/fstab` 是一个基础文本文件。每一行都告诉操作系统加载哪种文件系统。任何没有条目的文件系统都不会自动挂载。\n\n带有 `.mount` 扩展名的单元配置包含由\
  \ systemd 控制的文件系统信息。\n\n逻辑卷管理（或 `LVM`）允许你抽象多个不同物理设备的特性，使其看起来像一个单一的大设备。然后可以将大驱动器分区为较小的逻辑卷。\n\
  \n`LVM` 还用于克服传统分区的局限性。例如，LVM 卷可以扩展、跨设备跨、快分区以及在驱动器间移动。\n\n更多信息，类型：`man lvm`\n\n###\
  \ LVM 命令 (LVM Commands)\n\n以下命令实现了 LVM 的核心功能。\n\n- `lvchange`：更改逻辑卷的属性。\n- `lvconvert`：将逻辑卷转换为镜像或快照。\n\
  - `lvcreate`：在现有卷组中创建逻辑卷。\n- `lvdisplay`：显示逻辑卷的属性。\n- `lvextend`：扩展逻辑卷的大小。\n- `lvmchange`：更改逻辑卷管理器的属性。\n\
  - `lvmconfig`：加载 `lvm.conf` 及任何其他配置文件后显示配置信息。\n- `lvmdiskscan`：扫描 LVM2 可的所有设备。\n\
  - `lvmdump`：创建用于诊断的 LVM2 信息转储。\n- `lvreduce`：缩小逻辑卷的大小。\n- `lvremove`：删除逻辑卷。\n- `lvrename`：重命名逻辑卷。\n\
  - `lvresize`：调整逻辑卷的大小。\n- `lvs`：报告逻辑卷的信息。\n- `lvscan`：扫描（所有磁盘）逻辑卷。\n- `pvchange`：更改物理卷的属性。\n\
  - `pvck`：检查物理卷元数据。\n- `pvcreate`：初始化本地存储或分区供 LVM 使用。\n- `pvdisplay`：显示物理卷的属性。\n\
  - `pvmove`：移动物理区。\n- `pvremove`：删除物理卷。\n- `pvresize`：调整 LVM2 使用的本地存储或分区的大小。\n\n\n\
  \n\n\n- `pvs`: 报告物理卷（Physical Volumes）的信息。\n- `pvscan`: 扫描所有磁盘以查找物理卷。\n- `vgcfgbackup`:\
  \ 备份卷组描述符区域。\n- `vgcfgrestore`: 恢复卷组描述符区域。\n- `vgchange`: 更改卷组的属性。\n- `vgck`: 检查卷组元数据。\n\
  - `vgconvert`: 转换卷组元数据格式。\n- `vgcreate`: 创建卷组。\n- `vgdisplay`: 显示卷组的属性。\n- `vgexport`:\
  \ 使卷组对系统未知。\n- `vgextend`: 向卷组中添加物理卷。\n- `vgimport`: 使已导出的卷组对系统已知。\n- `vgimportclone`:\
  \ 导入并重命名重复的卷组（例如硬件快照）。\n- `vgmerge`: 合并两个卷组。\n- `vgmknodes`: 重新创建卷组目录和逻辑卷特殊文件。\n\
  - `vgreduce`: 通过移除一个或多个物理卷来缩小卷组。\n- `vgremove`: 删除卷组。\n- `vgrename`: 重命名卷组。\n- `vgs`:\
  \ 报告卷组的信息。\n- `vgscan`: 扫描所有磁盘以查找卷组并重建缓存。\n- `vgsplit`: 将卷组拆分为两个，通过移动整个物理卷将逻辑卷从一个卷组移动到另一个。\n\
  \n## 准备第二个驱动器\n\n### 前提条件\n本节要求拥有系统的 root 权限以便安装服务并更改操作系统。\n\n如书中前面提到的，在 Linux（以及其他\
  \ Unix 类操作系统）中，无论涉及多少物理存储设备，整个系统都由单一树结构表示。当驱动或分区上的文件系统挂载到系统时，它必须加入现有的树结构中。\n\n挂载是将格式化的分区或驱动器连接到\
  \ Linux 文件系统内目录的过程。然后可以通过该目录访问驱动器的内容。\n\n要挂载驱动器，请按照以下步骤操作：\n\n显示可用磁盘，输入：\n\n```\n\
  ls -l /dev/sd*\n```\n\n### 注意\n- `/dev/sda` 是第一个物理磁盘，`/dev/sda1` 是分区 1\n- `/dev/sdb`\
  \ 是第二个物理磁盘，`/dev/sdb1` 是分区 1\n\n### 提示\n如果你尝试挂载的本地存储需要格式化，且它已经挂载，则需要先卸载，输入：\n\n\
  ```\nsudo umount -f [mount_point]\n```\n（如果你不知道挂载点的名称，要查看本地存储和挂载点的列表，输入：`mount`）\n\
  \n准备（分区并格式化）挂载点，输入：\n\n```\nsudo fdisk /dev/sdb\n```\n（输入以下选项：`n` (新建)、`p` (主)、`1`、`[enter]`、`[enter]`、`w`）。\n\
  \n### 提示\n如果你需要将分区格式化整合到脚本以自动输入字母，输入：\n\n```\necho -e \"n\\np\\n1\\n\\n\\nw\\n\"\
  \ | sudo fdisk /dev/sdb\n```\n\n在新磁盘上创建文件系统，输入：\n\n```\nsudo /sbin/mkfs.ext4 -l\
  \ /opt/app_name /dev/sdb1\n```\n\n创建作为挂载点的目录，输入：\n\n```\nsudo mkdir /opt/app_name\n\
  ```\n\n更改挂载点的权限，输入：\n\n```\nsudo chmod 755 /opt/app_name\n```\n\n将驱动器映射到挂载点，输入：\n\
  \n```\nsudo mount /dev/sdb1 /opt/app_name\n```\n\n切换到挂载点目录，输入：\n\n```\ncd /opt/app_name\n\
  ```\n\n从驱动器获取 UUID（通用唯一标识符）：\n\n```\nsudo blkid\n```\n\n备份并更新 `/etc/fstab` 文件，输入：\n\
  \n```\nsudo cp /etc/fstab /etc/fstab.bak\n```\n\n### 注意\n`/etc/fstab` 文件用于文件系统在启动过程中自动加载挂载点。\n\
  \n编辑 `/etc/fstab`，输入：\n\n```\nsudo nano /etc/fstab\n```\n\n添加以下行：\n\n`UUID=\"<驱动器的\
  \ UUID>\" /app_name ext4 defaults 0 2`\n（要保存文件并退出编辑器，按 `Ctrl+X`，输入 `y` 并按 `Enter`）\n\
  \n显示所有挂载点，输入：\n\n```\nmount -a\n```\n\n## 创建可启动的 USB 驱动盘\n\n### 概述\n学习如何创建一个 Linux\
  \ 发行版的可启动版本并并安装在 USB 闪存盘上。通过此驱动器，你可以在不修改物理计算机的情况下启动它，也可以将其用于该系统的修复和诊断。\n\n### 前提条件\n\
  本节要求拥有系统的 root 权限以便安装服务并更改操作系统。\n- 一个 8GB 的 USB 闪存盘（大小要求取决于你想要使用的发行版）\n- 已下载的 Linux\
  \ 发行版\n\n可以创建一个安装在 USB 闪存盘上的 Linux 系统的可启动版本。这允许你在本地系统上加载 Linux 系统的某个版本。这有几个优势，例如测试某个发行版看看你是否喜欢，或者对损坏的操作系统版本进行本地诊断或修复，或者尝试恢复本地存储设备上失败的文件系统。\n\
  \n### 创建可启动的闪存盘\n下载你想要启动的 Linux 发行版的 USB 可启动版本。\n\n### USB 可启动 Linux 发行版\n- **Puppy\
  \ Linux** - 一个极小的 Linux 发行版。存储和硬件要求非常小。（更多信息：[`puppylinux.org/`](http://puppylinux.org/))\n\
  - **Slax** - 与 Puppy Linux 类似，这是一个极小的 Linux 发行版。存储和硬件要求非常小。（更多信息：[`www.slax.org/`](https://www.slax.org/))\n\
  - **Kali Linux** - 此版本的 Linux 是为安全专家设计的，包含了若干实用。（更多信息：[`www.kali.org/`](https://www.kali.org/))\n\
  - **Knoppix** - 最早受欢迎的 live CD 发行版之一。它封装了数千个包。（更多信息：[`noppix.net/`](http://noppix.net/))\n\
  \n将 USB 闪存盘插入你的计算机。\n\n## 警告\nUSB 驱动器上的所有数据将被销毁。\n\n查看所有块设备并找到 USB 设备的名称，输入：\n\n\
  ```\nlsblk\n```\n\n## 警告\n不要搞错驱动器。在继续之前请备份任何重要数据。\n\n### 注意\n这些标识在不同发行版之间可能会变化。\n\
  \n复制 USB 驱动器上的内容（将 `X` 替换为正确的字母）：\n\n```bash\nsudo dd if=/path/to/file.iso of=/dev/sdX\
  \ bs=4M status=progress\n```\n\n## 有趣且无聊的内容（包括彩蛋）\n\n### 概述\nLinux 有几个酷炫的程序和“彩蛋”。对于可能不熟悉“彩蛋”术语的人来说，它基本上是一个隐藏的或不为人知的功能。\n\
  \n### 前提条件\n本节要求拥有系统的 root 权限以便安装服务并更改操作系统。\n\n开始本节之前，确保你获取了包管理器的更新列表，以便获得程序、服务和库的最新版本，输入：\n\
  \n```\nsudo apt-get update\n```\n或者\n```\nsudo yum update\n```\n\n本节涵盖了几个酷炫的程序和技巧。它还在适当的地方提供了简要介绍。此外，请确保查看这些工具的\
  \ `man` 页面以获取更多信息和可用选项。\n\n`termsaver` 是一个花哨的 ASCII 屏幕保护程序。它包含了几个不同的屏幕保护，如 `matrix`、`clock`、`star\
  \ wars` 以及一些适合办公的。要开始使用此工具，在输入命令后它将显示可用选项列表，输入：\n\n```\ntermsaver\n```\n或者\n```\n\
  termsaver clock\n```\n\n要安装该命令，输入：\n\n```\nsudo apt-get install termsaver\n```\n\
  \n需要假装很忙？此命令将在你的屏幕上生成大量无用数据，输入：\n\n```\ncat /dev/urandom | hexdump -C | grep \"\
  ca fe\"\n```\n\n需要知道任何给定数的最小公倍数因数，输入：\n\n```\nfactor 42\n```\n\n想显示带有任意小数位数的 PI\
  \ 值，输入：\n\n```\npi 500\n```\n\n### 提示\n为了好玩或对 CPU 进行压力测试，输入：\n\n```\npi 5000000\n\
  ```\n如果该包尚未安装，输入：\n\n```\nsudo apt-get install pi\n```\n\n运行多语言语音合成器，输入：\n\n\n\n\
  \n\n`espeak \"HelloWorld\"`\n\n## Note\n你的系统需要有音频支持才能使用此功能。\n\n如果尚未安装此包，请输入：\n\n\
  `sudo apt-get install espeak`\n\n`apt-get` 命令有一个小小的隐藏彩蛋，它是一只基于文本的奶牛，要查看它，请输入：`sudo\
  \ apt-get moo`\n\n要查看任何命令的彩色输出，请输入：\n\n`cal 2020 | lolcat`\n\n-或者-\n\n`cal 2020\
  \ | lolcat -a`\n\n如果尚未安装此包，请输入：\n\n`sudo apt-get install lolcat`\n\n要查看动画 ASCII\
  \ 火车，请输入 `sl` -或者- `sl-h`（带有客运车的火车）\n\n要查看更多选项，请输入：\n\n`man sl`\n\n如果尚未安装此包，请输入：\n\
  \n`sudo apt-get install sl`\n\n要反向显示所有输出，请输入：\n\n`df | rev`\n\n要显示黑客帝国下落字母（更多选项请查看帮助），请输入：\n\
  \n`cmatrix`\n\n如果尚未安装此包，请输入：\n\n`sudo apt-get install cmatrix`\n\n## Tip\n一个非常像黑客帝国下落字母的单行命令，输入：\n\
  \n```bash\necho -ne \"\\e[32m\" ; while true ; do echo -ne \"\\e[$(($RANDOM % 2\
  \ + 1))m\" ; tr -c \"[:print:]\" \" \" < /dev/urandom | dd count=1 bs=50 2> /dev/null\
  \ ; done\n```\n\n让系统输出彩色且带有侮辱性的评论\n\n输入：`sudo visudo`，在文件底部的 'Defaults' 部分添加新行 `\"\
  Defaults insults\"`，关闭并保存文件。\n\n要查看结果，输入：`sudo ls`，然后输入错误的密码。\n\n### 输出输出：\n```\n\
