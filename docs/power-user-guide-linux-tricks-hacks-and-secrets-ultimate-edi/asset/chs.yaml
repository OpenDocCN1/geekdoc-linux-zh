  * `gtkorphan`：查找孤立包。\n    * 注意：\n        * 与 `apt-get` 命令相关（或相似）。\n        * 类别：X-Windows/维护\n\
  \n* `baobab`：本地存储使用分析器。\n    * 注意：\n        * 与 `stacer` 命令相关（或相似）。\n        * 类别：X-Windows/维护\n\
