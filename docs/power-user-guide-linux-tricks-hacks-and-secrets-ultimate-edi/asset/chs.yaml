- "# Power 高用户指南：Linux 技巧、破解与秘密：终极版 (2019) 第 1 & 2 卷\n\n\n\n![](img/00025.jpeg)\n\n\
  \n![](img/00001.jpeg)\n\n## 图籍摘要\n\n如今 Linux 运行在各种设备上，从手表、IoT 设备（如树莓派和其他单板计算机）到智能手机、笔记本电脑、台式机、服务器、网络设备，甚至是大型机。Linux\
  \ 也被许多云服务用于在 Amazon Web Services (`AWS`)、Microsoft Azure 或 Google Cloud 上管理或运行基础设施。\n\
  \n本书共有三个版本：第 1 卷是 Bash 系统管理版；第 2 卷是 Bash 系统参考版；还有一个终极版，它包含了第 1 卷和第 2 卷的所有内容。\n\n\
  第 1 卷 Bash 系统管理版适用于想要学习 Linux（为了工作面试 [例如 Linux 系统管理员或工程师、DEVOPS、DEVSECOPS 等] 或创建\
  \ IoT 设备），或者已经使用了多年的人。这本书是为所有想要开始学习掌握 Linux 操作系统和 Bash Shell，并学习如何利用高级功能的人编写的。本书旨在帮助你快速上手或在不浪费时间的情况下提升你的现有技能。\n\
  \n第 2 卷 Bash 系统参考版包含了数百条命令的参考、示例、提示和注释，以让你对涵盖的命令或主题有额外的见解。本书还包含了一份超过 600 多条 Linux\
  \ 命令的带示例综合快速参考指南。书中还包含了针对若干高级主题的 Linux 及相关快速入门指南，包括应用程序、网络主题、Bash 键盘快捷键等。\n\n涵盖的主题：Linux\
  \ 操作系统、Linux 命令、Bash 一行命令和脚本编写。如何安装：Apache Web 服务器、MySQL、`PHPMyAdmin` 和 PHP。如何安装和管理\
  \ `Docker` 以及 `Git`。系统管理主题包括：故障排除、网络等。安全主题包括：防火墙管理概述以及如何锁定你的 Linux 操作系统。\n\n如果必须打开计算机：\n\
  - 在操作之前，务必断开计算机的电源以及连接到它的任何设备。\n- 在触摸计算机内部任何电子元件之前，务必使用防静电手环接地。\n\n# 勘误、更新与书籍支持\n\
