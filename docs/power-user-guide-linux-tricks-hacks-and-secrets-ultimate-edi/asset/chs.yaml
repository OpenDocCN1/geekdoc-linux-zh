  \ SSL 的 IMAP4（加密传输） |\n| 995 | TCP | 基于 SSL 的 POP3（加密传输） |\n\n## 附加参考\n\n以下是书中在不同主题中用的一系列额外主题参考。我创建此列表是为了让您在需要时更容易找到：\n\
