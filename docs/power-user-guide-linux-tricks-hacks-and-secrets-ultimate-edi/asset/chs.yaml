  \ OSI 网络模型（7 层）\n\n描述：`OSI`（开放系统互连）模型是一个参考模型，所有的网络程序和进程（如实用程序、服务等）都属于这些层中的一个。\n\n\
  ## RAID 级别（存储）\n\n描述：`RAID` 利用条带、镜像或奇偶校验技术，从多个通用计算机存储设备创建大型可靠的数据存储。\n\n# 现代数据存储类型\n\
  \n描述：如果你有需要存储的特定应用程序，现在有三种主要类型供选择。你尝试实现的目标将决定为你的应用程序选择最佳存储类型。\n\n# 常用 TCP/UDP IP\
  \ 端口\n\n描述：`TCP/IP` 支持 65535 个端口，可与本地系统上的服务进行通信。\n\n# 额外参考\n\n描述：书中反复使用的几个不同主题的主题性参考文献。\n\
  \n## 802.11 无线标准\n\n以下是多年来的流行的 802.11 无线标准列表。你会发现，目前的标准有两个主频率：2.4GHz（在美国）和 5GHz。2.4\
  \ GHz 频率的问题在于它是一个非常活跃的频率（即它被多个不同的设备使用，甚至微波炉也会影响该频率），有时 5 GHz 频的信号噪声较少。\n\n原始的 802.11a\
  \ 仅从 2.4 GHz 频率开始，提供三个非重叠通道，而其他相邻通道会重叠。从 802.11a（即 Wi-Fi 1）开始，使用了 5 GHz 频率，它提供至少\
  \ 23 个不重叠的通道。\n\n从 802.11n（即 Wi-Fi 4）开始，引入了名为 `MIMO` 的新型标准无线技术。`MIMO` 代表多输入多输出，通过这项技术，可以使用最多四路流用于时空块编码\
  \ (`STBC`) 或多用户 (`MU`) 操作。\n\n你获得的实际速度将取决于多种因素，例如设备与接入点之间标准的硬件兼容性。任何来自其他无线电的干扰、设备到接入点的距离、墙壁以及使用该接入点的附近其他无线电的数量。\n\
  \n802.11 无线标准\n\n| 标准 | 新名称 | 频率 | 速度 | 备注 | 批准日期 |\n| :--- | :--- | :--- | :---\
  \ | :--- | :--- |\n| 802.11b | Wi-Fi 1 | 2.4 | 11Mbps | | 1999 |\n| 802.11a | Wi-Fi\
  \ 2 | 5 | 54Mbps | | 1999 |\n| 802.11g | Wi-Fi 3 | 2.4 | 54Mbps | | 2003 |\n| 802.11n\
  \ | Wi-Fi 4 | 2.4/5 | 288Mbps | MIMO | 2009 |\n| 802.11ac | Wi-Fi 5 | 5 | 568Mbps\
  \ | MIMO* | |\n\n* = 802.11ac 利用双频无线技术，支持在 2.4GHz 和 5GHz 频率上同时连接。\n\n在本书撰写时，有一种尚未普及的新标准，它将在未来的硬件中实现。它被称为\
  \ 802.11ax（又称 Wi-Fi 6），承诺速度高达 10Gbps。\n\n注意：\n\nWi-Fi 联盟（推广无线网络标准的贸易团体）试图通过引入 802.11ax\
  \ 使 Wi-Fi 命名更简单。所有的 802.11 名称现在将重新命名为 Wi-Fi 1-6。\n\n## 相关 Linux 无线命令\n\n以下 Linux\
  \ 命令可以显示信息或配置连接到你本地系统的无线硬件。\n\n要显示连接到系统的无线通信设备，请输入：\n\n```bash\nlspci | egrep -i\
  \ --color 'wifi|wlan|wireless'\n```\n\n要显示更多信息（加粗输入将根据上一个命令的设备输出而变化），输入：\n\n```bash\n\
  lspci -vv -s 4c:00.0\n```\n\n配置无线接口硬件参数（如 SSID、模式、通道、比特率、加密密钥、功率等），输入：\n\n```bash\n\
  iwconfig wlan1\n```\n\n显示无线信号链路质量，输入：\n\n```bash\niwconfig wlan0 | grep -i --color\
  \ quality\n```\n\n如果你的系统使用 `NetworkManager`，使用以下命令显示网络连接，输入：\n\n```bash\nnmcli connection\
  \ show\n```\n\n显示无线设备的通用属性（加粗输入将根据上一个命令的设备输出而变化），输入：\n\n```bash\nnmcli -f GENERAL,WIFI-PROPERTIES\
  \ dev show wlp2s0\n```\n\n显示无线信号链路质量，输入：\n\n```bash\nnmcli dev wifi\n```\n\n`wavemon`\
  \ 是一个无线网络设备监控程序。它持续更新有关信号水平以及其他无线特定和通用网络的信息。要安装该程序，请输入：\n\n基于 Debian 的系统：\n\n```bash\n\
  sudo apt install wavemon\n```\n\n基于 Red Hat 的系统：\n\n```bash\nsudo yum install wavemon\n\
  ```\n\n提示：\n\n使用内置命令持续显示无线设备信号信息的替代方案，输入：\n\n```bash\nwatch -n 1 cat /pros/net/wireless\n\
  ```\n\n## 未涵盖的其他标准\n\n还有其他 802.11 标准未包含在本份参考资料中，因为它们从未被采用，或者可能在世界的不同地区使用。例如，802.11aj（又称中国毫米波）标准在中国使用，它本质上是\
  \ 802.11ad 的重新命名版本，用于该地区。目标是保持与 802.11ad 的后兼容性。\n\n802.11ah 标准最近也获得了批准（作为蓝牙的竞争对手），针对低功耗设备，并创建了范围超出传统\
  \ 2.4 到 5 GHz 网络的扩展 Wi-Fi 网络。\n\n## ASCII 表\n\nASCII 是美国信息交换标准（American Standard\
  \ Code for Information Interchange）的缩写，它是电子通信的字符编码标准。ASCII 代码表示计算机、电信设备和其他设备中的文本。\n\
  \n大多数现代字符编码方案都基于 ASCII，例如 UNICODE，它支持更多的额外字符。\n\nASCII 表分为三张表：不可打印、可打印和扩展。每个字符表都有其特定的用途。\n\
  \n不可打印表包含在控制台中显示时不可见的字符。它们通常有其他功能，例如响铃字符（十进制 7）应该播放蜂鸣（或你的系统配置播放的声音）。\n\n可打印表包含在控制台中显示时可见的字符。例如，大写字母\
  \ A（十进制 65）。\n\n扩展表也包含在控制台中显示时可见的字符。这些字符后来添加是为了支持国际语言。例如，符号符号（货币）£（十进制 163）。\n\n\
