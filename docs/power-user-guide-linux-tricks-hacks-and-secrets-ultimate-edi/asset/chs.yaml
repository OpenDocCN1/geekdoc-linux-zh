  \n## 网络命令\n\n以下是与管理和诊断本地与远程设备之间网络问题的命令列表。某些命令有多个版本，以支持 IPv4（旧版本的网络协议）和 IPv6（新版本的网络协议）。\n\
  \n**注意：**\n\n取决于将使用的命令或服务，可能需要 root 权限才能执行。如果执行命令需要 root 权限，通常会在示例的前前面标记为 `#`（例如\
  \ `# command`）。\n\n* `arp` arguments domain_name_or_ip: 显示并管理系统的 ARP（地址解析协议）缓存。\n\
  \    * 例：`arp ip_address`\n    * 提示：\n        * 该命令用于查找给定的 IPv4 地址的网络邻居的 MAC（媒体访问控制）地址。\n\
  \    * 注意：\n        * 相关信息：`cat /proc/net/arp`\n        * 与 `route` 命令相关（或类似）。\n\
  \        * 分类：网络\n\n* `cifsiostat` arguments: 报告 CIFS 统计数据。\n    * 例：`cifsiostat\
  \ -m`\n    * 注意：\n        * 与 `sar`, `mpstat`, `pidstat`, `iostat`, `vmstat`, `nfsiostat`\
  \ 命令相关（或类似）。\n        * 分类：网络/性能\n\n* `curl` arguments https://url_to_file: 使用支持的协议从另一个服务器传输数据。\n\
  \    * 例：`curl -s example.com:80`\n    * 提示：\n        * `curl` 是一个脚本工具，旨在在无需用户交互的情况下向系统或从系统传输数据，可以使用多种协议之一（DICT,\
  \ FILE, FTP, FTPS, GOPHER, HTTP, HTTPS, IMAP, IMAPS, LDAP, LDAPS, POP3, POP3S, RTMP,\
  \ RTSP, SCP, SFTP, SMB, SMBS, SMTP, SMTPS, TELNET 和 TFTP）。\n    * 注意：\n        *\
  \ 与 `wget` 命令相关（或类似）。\n        * 分类：网络\n\n* `dig` arguments domain_name_or_ip: 显示域名的\
  \ DNS 信息。\n    * 例：执行反向主机查找：\n        ```\n        dig -x example.com\n        ```\n\
  \    * 提示：\n        * `dig` 是 Domain Information Groper 的缩写。它是一个灵活的工具，用于查询 DNS 服务器，并执行\
  \ DNS 查找以显示从查询服务器返回的答案。\n    * 注意：\n        * 与 `nslookup` 命令相关（或类似）。\n        *\
  \ 分类：网络/故障排除\n\n* `domainname` arguments nis_domain: 管理系统的 NIS/YP 域名。\n    * 例：`domainname\
  \ example.com`\n    * 注意：\n        * 与 `dnsdomainname`, `nisdomainname`, `ypdomainname`\
  \ 命令相关（或类似）。\n        * 分类：目录服务\n\n* `dnsdomainname` nis_domain: 显示系统的 DNS 域名。\n\
  \    * 例：`dnsdomainname example.com`\n    * 注意：\n        * 与 `domainname`, `nisdomainname`,\
  \ `ypdomainname` 命令相关（或类似）。\n        * 分类：目录服务\n\n* `dnssec-dsfromkey`: DNSSEC 委托签名者\
  \ (DS) 记录 (RR) 生成工具。\n    * 例：`# dnssec-dsfromkey -2 Kexample.com.+003+26160`\n\
  \    * 注意：\n        * 与 `dnssec-signzone` 命令相关（或类似）。\n        * 这是一个 BIND9UTILS\
  \ 命令。\n        * 分类：DNS\n\n* `dnssec-keyfromlabel`: DNSSEC 密钥生成工具。\n    * 例：`# dnssec-keyfromlabel`\n\
  \    * 提示：\n        * 生成一对文件，引用存储在加密硬件安全模块 (HSM) 中的密钥对象。私钥文件可用于区域数据的 DNSSEC 签名，就像由\
  \ `dnssec-keygen` 创建的传统签名密钥一样，但密钥材料存储在 HSM 内部，实际签名发生在那里。\n    * 注意：\n        * 与\
  \ `dnssec-signzone` 命令相关（或类似）。\n        * 这是一个 BIND9UTILS 命令。\n        * 分类：DNS\n\
  \n* `dnssec-keygen` arguments domain_name: 为指定的域名生成加密的安全 DNS 密钥。\n    * 例：`# dnssec-keygen\
  \ -a DSA -b 768 -n ZONE example.com`\n    * 注意：\n        * 与 `dnssec-signzone` 命令相关（或类似）。\n\
  \        * 这是一个 BIND9UTILS 命令。\n        * 分类：DNS\n\n* `dnssec-makekeyset` arguments\
  \ file_name: 从 `dnssec-keygen` 命令生成的一个或多个 DNS 安全密钥产生域名密钥集。\n    * 例：`# dnssec-makekeyset\
  \ -t 6400 -s 20200901120000 -e +2592000 example.com.+003+26160`\n    * 注意：\n   \
  \     * 与 `dnssec-keygen` 命令相关（或类似）。\n        * 这是一个 BIND9UTILS 命令。\n        * 分类：DNS\n\
  \n* `dnssec-settime` arguments file_name: 为 DNSSEC 密钥设置密钥计时元数据。\n    * 例：`# dnssec-settime\
  \ –K keydir –A now Kexample.com.+005+12345 rndc loadkeys example.com`\n    * 提示：\n\
  \        * 当元数据字段发生变化时，密钥对的两个文件（`Knnnn.+aaa+iiiii.key` 和 `Knnn.+aaa+iiiii.private`）都会重新生成。元数据字段存储在私文件中。元数据的可读描述也会放置在密钥文件的注释中。私钥文件的权限始终设置为除所有者以外的任何人不可访问（模式\
  \ 0600）。\n    * 注意：\n        * 与 `dnssec-keygen` 命令相关（或类似）。\n        * 这是一个 BIND9UTILS\
  \ 命令。\n        * 分类：DNS\n\n* `dnssec-signkey` arguments file_name: 使用密钥标识符列表中指定的密钥签名对安全\
  \ DNS 密钥集签名。\n    * 例：`# dnssec-signkey keyset-example.com. Kcom.+003+51944`\n \
  \   * 注意：\n        * 与 `dnssec-makekeyset` 命令相关（或类似）。\n        * 这是一个 BIND9UTILS\
  \ 命令。\n        * 分类：DNS\n\n* `dnssec-signzone` arguments file_name: 使用密钥标识符列表中指定的签名对安全\
  \ DNS 区域文件签名。\n    * 例：`# dnssec-signzone -o example.com db.example.com db.example.com.signed`\n\
  \    * 提示：\n        * `dnssec-signzone` 生成 NSEC 和 RRSIG 记录并产生已签名的区域。从签名区域委派的安全状态（即子区域是否安全）取决于每个子区域是否存在密钥集文件。\n\
  \    * 注意：\n        * 与 `dnssec-keygen` 命令相关（或类似）。\n        * 这是一个 BIND9UTILS 命令。\n\
  \        * 分类：DNS\n\n* `ethtool` arguments network_interface: 管理网络驱动和硬件设置。\n   \
  \ * 例：`# ethtool eth0`\n    * 注意：\n        * 与 `mii-tool` 命令相关（或类似）。\n        *\
  \ 分类：网络\n\n* `host` arguments domain_name_or_ip: 查找域名的 IP 信息。\n    * 例：`host -v\
  \ example.com`\n    * 注意：\n        * 与 `dig` 命令相关（或类似）。\n        * 分类：网络\n\n* `ifconfig`\
  \ network_interface: 显示本地系统特定网络连接的信息。\n    * 例：`# ifconfig -a`\n    * 注意：\n    \
  \    * `ifconfig` 是一个过时的命令，已被 `ip` 命令取代。\n            * 更多信息：已弃的替代工具\n        *\
  \ 与 `ip` 命令相关（或类似）。\n        * 分类：网络/故障排除\n\n* `ifdown` network_interface: 停止指定的网络接口。\n\
  \    * 例：`# ifdown eth0`\n    * 注意：\n        * 与 `ifup`, `ip` 命令相关（或类似）。\n     \
  \   * 分类：网络/维护\n\n* `ifup` network_interface: 启动指定的网络接口。\n    * 例：`# ifup eth0`\n\
  \    * 注意：\n        * 与 `ifdown`, `ip` 命令相关（或类似）。\n        * 分类：网络/维护\n\n* `ip`\
  \ arguments: 管理网络设备、路由、策略和隧道。\n    * 例：`# ip addr`\n    * 注意：\n        * 与 `ifconfig`\
  \ 命令相关（或类似）。\n        * 分类：网络/故障排除\n\n\n\n\n\n### `iptables` 参数: IPv4 数据包过滤防火墙和\
  \ NAT 的管理工具。\n- 示例:\n```bash\niptables -L -v\n```\n- 注意:\n    - 与 `iptables`、`iptables-restore`、`iptables-save`\
  \ 命令相关（或相似）。\n    - 分类: 网络\n\n### `iptables-restore`: 用于从标准输入 (STDIN) 或文件恢复 IP tables（即防火墙）。\n\
  - 示例:\n```bash\niptables-restore < ip_tables_v4.rules\n```\n- 提示:\n    - 如果你想从备份中恢复\
  \ IP tables 或复制另一个系统的防火墙配置，此命令非常有用。\n- 注意:\n    - 与 `iptables` 命令相关（或相似）。\n    -\
  \ 分类: 网络\n\n### `iptables-save`: 将 IP tables（即防火墙）数据导出到标准输出 (STDOUT)。\n- 示例:\n```bash\n\
  iptables-save > ip_tables_v4.rules\n```\n- 提示:\n    - 如果你想备份当前的 IP tables 或为另一个系统复制防火墙配置，此命令很有用。\n\
  - 注意:\n    - 与 `iptables` 命令相关（或相似）。\n    - 分类: 网络\n\n### `mii-tool` 接口: 操作与介质无关的状态。\n\
  - 示例:\n```bash\nmii-tool -r eth0\n```\n- 注意:\n    - 此命令已被 `ethtool` 取代。\n    - 与\
  \ `ethtool` 命令相关（或相似）。\n    - 分类: 网络\n\n### `mountstats` 参数: 显示 NFS 客户端统计信息。\n-\
  \ 示例:\n```bash\nmountstats --nfs mountpoint\n```\n- 注意:\n    - 与 `iostat`、`fsstat`\
  \ 命令相关（或相似）。\n    - 相关信息: `cat /proc/self/mountstats`\n    - 分类: 网络性能\n\n### `mtr`\
  \ 参数域名或 IP: 一个网络诊断工具。\n- 示例:\n```bash\nmtr -report example.com\n```\n- 提示:\n   \
  \ - `mtr` 命令将 `traceroute` 和 `ping` 程序的功能合并为一个单一的网络诊断工具。\n- 注意:\n    - 与 `traceroute`\
  \ 命令相关（或相似）。\n    - 分类: 网络故障排除\n\n### `nameif` 参数 MAC 地址: 根据 MAC 地址命名网络接口。\n- 示例:\n\
  ```bash\nnameif\n```\n- 注意:\n    - 与 `ifconfig` 命令相关（或相似）。\n    - 分类: 网络\n\n###\
  \ `nc` 参数域名或 IP: 也称为 Netcat 的工具。允许任意 TCP 或 UDP 连接或监听特定端口。\n- 示例:\n```bash\nnc 192.168.0.1\
  \ 25 -v\n```\n- 提示:\n    - `nc` 是一个多功能工具，用于任何涉及 TCP、UDP 或套接字的操作。它可以开启 TCP 连接、发送\
  \ UDP 包、监听 TCP 和 UDP 端口、端口扫描并支持 IPv4 和 IPv6。\n- 注意:\n    - 与 `ssh` 命令相关（或相似）。\n\
  \    - 分类: 网络故障排除\n\n### `netstat` 参数域名或 IP: 显示本地系统的活动连接信息。\n- 示例: 列出所有活动连接:\n```bash\n\
  netstat -tupl\n```\n- 注意:\n    - 与 `ss` 命令相关（或相似）。\n    - 分类: 网络故障排除\n\n### `nisdomainname`\
  \ 参数域: 管理系统的 NIS 域名。\n- 示例:\n```bash\nnisdomainname example.com\n```\n- 注意:\n  \
  \  - 与 `domainname`、`ypdomainname` 命令相关（或相似）。\n    - 分类: 目录服务\n\n### `nfsstat` 参数:\
  \ 列出 NFS 服务统计。\n- 示例:\n```bash\nnfsstat -m\n```\n- 注意:\n    - 与 `iostat`、mountstats`\
  \ 命令相关（或相似）。\n    - 相关信息:\n        - `cat /proc/net/rpc/nfsd`: 基于 procfs 的 NFS 服务器统计。\n\
  \        - `cat /proc/net/rpc/nfs`: 基于 procfs 的 NFS 客户端统计信息。\n        - `cat /proc/mounts`:\
  \ 基于 procfs 的挂载文件系统接口。\n    - 分类: 网络性能\n\n### `nslookup` 参数域名或 IP: 对域名进行 DNS 查询。\n\
  - 示例:\n```bash\nnslookup example.com\n```\n- 注意:\n    - 与 `dig` 命令相关（或相似）。\n   \
  \ - 分类: 网络故障排除\n\n### `nsupdate` 参数文件名: 动态 DNS 更新工具。\n- 示例:\n```bash\nnsupdate nxdomain\
  \ nickname.example.com\nupdate nickname.example.com 86400 CNAME somehost.example.com\
  \ send\n```\n- 注意:\n    - 更多信息请参见 bind9utils。\n    - 分类: 网络\n\n### `route` 参数: 显示或修改路由表。\n\
  - 示例:\n```bash\nroute -e\n```\n- 注意:\n    - 与 `ifconfig` 命令相关（或相似）。\n    - 相关信息:\n\
  \        - `cat /proc/net/ipv6_route`\n        - `cat /proc/net/route`\n       \
  \ - `cat /proc/net/rt_cache`\n    - 分类: 网络故障排除\n\n### `ping` 参数域名或 IP: 向远程主机 ping\
  \ (IPv4 网络，即发送 ICMP ECHO_REQUEST）并显示结果。用于测试网络连通性。\n- 示例:\n```bash\nping example.com\n\
  ```\n- 提示:\n    - `mtr` 命令将 `traceroute` 和 `ping` 程序的功能合并为一个单一的网络诊断工具。\n    - 此工具用于执行基础网络连通性测试，但通常会被防火墙拦截。\n\
  - 注意:\n    - 与 `ping6` 命令相关（或相似）。\n    - 这是一个 IPUTILS 命令。\n    - 分类: 网络故障排除\n\n\
  ### `ping6` 参数域名或 IP: 向远程主机 ping (IPv6 网络，即发送 ICMP ECHO_REQUEST）并显示结果。\n- 示例:\n\
  ```bash\nping6 example.com\n```\n- 提示:\n    - `mtr` 命令将 `traceroute` 和 `ping` 程序的功能合并为一个单一的网络诊断工具。\n\
  \    - 此工具用于执行基础网络连通性测试，但通常会被防火墙拦截。\n- 注意:\n    - 与 `ping` 命令相关（或相似）。\n    - 这是一个\
  \ IPUTILS 命令。\n    - 分类: 网络故障排除\n\n### `showmount` 参数: 显示本地系统的 NFS 挂载信息。\n- 示例:\n\
  ```bash\nshowmount -a\n```\n- 注意:\n    - 与 `nfsstat` 命令相关（或相似）。\n    - 分类: 网络故障排除\n\
  \n### `slattach` 参数: 将普通终端（“串口”）行放入若干“网络”模式之一，允许其与其他计算机建立点对点链路。\n- 示例:\n```bash\n\
  slattach -s 38400 -p slip /dev/tty1 &\n```\n- 注意:\n    - 与 `ldattach` 命令相关（或相似）。\n\
  \    - 分类: 网络\n\n### `smbclient` smb_share_path 密码: 允许本地系统访问 SMB 文件共享。\n- 示例:\n\
  ```bash\nsmbclient \\\\192.168.1.1\n```\n- 注意:\n    - 必须安装 `sudo apt-get install\
  \ smbclient`。\n    - 与 `mount` 命令相关（或相似）。\n    - 分类: 网络\n\n### `ss` 参数: 显示 TCP/IP\
  \ 套接字统计信息。\n- 示例:\n```bash\nss -p\n```\n- 更多示例:\n    - 显示所有 TCP 套接字:\n      ```bash\n\
  \      ss -t -a\n      ```\n    - 显示所有带有 SELinux 安全上下文的 TCP 套接字:\n      ```bash\n\
  \      ss -t -a -Z\n      ```\n    - 显示所有 UDP 套接字:\n      ```bash\n      ss -u -a\n\
  \      ```\n    - 显示所有已建立的 ssh 连接:\n      ```bash\n      ss -o state established\
  \ '( dport = :ssh or sport = :ssh )'\n      ```\n    - 查找所有连接 X 服务器的本地进程:\n    \
  \  ```bash\n      ss -x src /tmp/.X11-unix/*\n      ```\n    - 列出所有处于 FIN-WAIT-1\
  \ 状态且针对网络 193.233.7/24 的 TCP 套接字，并查看其定时器:\n      ```bash\n      ss -o state fin-wait-1\
  \ '( sport = :http or sport = :https )' dst 193.233.7/24\n      ```\n\n\n\n\n* 导出套字统计信息，并显示与\
  \ `netstat` 类似的信息。它比其他工具显示更多的 TCP 和状态信息。\n  * 注意：\n    * 与 `netstat` 命令相关（或相似）。\n\
  \    * 分类：网络/故障排除\n\n* `systemd-resolve` 参数 `hostname`：解析域名、IPv4 和 IPv6 地址、DNS 资源记录以及服务。\n\
  \  * 示例：获取 TLS 密钥：\n    ```\n    systemd-resolve --tlsa=tcp fedoraproject.org:443\n\
  \    ```\n  * 更多示例：\n    * 获取 PGP 密钥：\n      ```\n      systemd-resolve --openpgp\
  \ zbyszek@fedoraproject.org\n      ```\n    * 解析 SRV 服务：\n      ```\n      systemd-resolve\
