  \  `ssh` `user_name@domain_name_or_ip`: 将用户连接到指定的主机，以便在相应系统上进行远程控制会话（安全）。\n    -\
  \   示例：`ssh user@example.com`\n    -   提示：\n        - 旧的 `telnet` 客户端和服务使用未加密的通信，所有数据都以明文形式在网络上发送。`ssh`\
  \ 客户端和服务替换了旧的 `telnet` 套件。`ssh` 客户端和服务之间的所有数据都是加密的。\n    -   备注：\n        - 这是一个客户端和服务程序套件。\n\
  \        - 该命令的其他别名为：`rsh`, `rlogin`\n        - 与（或类似）`ssh-add`, `ssh-agent`, `ssh-keygen`,\
