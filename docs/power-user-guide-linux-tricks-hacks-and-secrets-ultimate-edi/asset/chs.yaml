  \ 层）\n\n## RAID 级别（存储）\n\n## 现代数据类型\n\n## 常用 TCP/UDP 端口\n\n\n\n例如，当你买车时，大多数人并不在乎这项功能或那项功能有多先进。你只想把钥匙插入点火开关，像开其他车辆一样开它。只有当你需要某些特定信息时，才会查阅手册获取该特定信息。\n\
  \n本书并不是为了作为 Linux 的深度参考书，而是为了对几个 Linux 命令和工具进行简要介绍，并尝试提供它们如何工作的实用示例。其意在于展示 Linux\
  \ 能为你做什么，而不是浪费你的时间给你大量你可能并不记得的枯燥数据。\n\n如果你需要关于某方面的更多信息，可以利用你已有的基础知识，对命令的工作原理进行更深入的研究。我一直发现，当我对任何事物都有基础知识时，我通常知道去哪里寻找或问什么问题来获取我需要的信息。正当我缺乏这些基础知识时，我可能不知道从何开始，这会让变得变得困难。\n\
  \n网络或其他参考资料中有大量信息，它们对书中大多数主题的探讨将比我涵盖的深入得多。然而，我们大多数人并没有时间或兴趣阅读那些资料。\n\n如果你发现你需要关于某个命令或工具的更多信息，请查看你可以使用的其他参考资料（例如帮助文件、网页等），以便你获取更深入的信息。\n\
  \n我写这本书的目标是为你提供一个最快且希望是最愉快的 Linux 介绍。它还旨在通过提供一组“试菜盘”式的命令，让你尝试并查看结果，从而帮助你更快地开始学习这个操作系统。\n\
  \n## 额外信息\n\nKernel ([kernel.org](https://www.kernel.org/))\nLinux 内核信息的主站。\n\n\
  Linux ([linux.org](https://www.linux.org))\nLinux 信息的主站。\n\nLinux Journal ([linuxjournal.com](https://www.linuxjournal.com/))\n\
  关于 Linux 的最新新闻和信息\n\n## 个人观点\n\n首先，如果你是第一次开始接触 Linux，对某些人来说，因为其学习曲线，起初可能会无所从。意识到这个操作系统已经成熟了几十年，事物的运行方式是有原因的。例如，一些基本的控制编辑命令在\
  \ `vi` 编辑器等工具中同样有效。\n\n我想说的是，起初你不理解某个命令或概念，不要担心。你与它接触得越多，以后事情就会越通俗。不要让操作系统的复杂性让你感到压力。\n\
  \n随着你越深入研究 Linux 命令行工具、功能和选项，我希望你会看到一些让你感叹“这太酷了，我不知道你在终端里可以这样做”的技巧。老实说，当我开始大量使用\
  \ Linux 控制台时，我记得与其他操作系统相比，它能做的事情之让我留下了深刻印象。\n\n尽管我会极力赞美 Linux，但也会对它对新用户来说的复杂性和不一致性进行批评。尽管如此，在\
  \ Linux 这种美丽与混乱并存的同时，也有很多让你觉得很对的地方。也许这太主个人化了，但我想分享一下，以便你与自己的感受进行比较。\n\nLinux 正在不断演进，开发者们定期添加新的工具和功能，这种情况已经持续了几十年。Linux\
  \ 似乎有一万种方法来完成同样的事情。其他几个操作系统也面临这个问题，尽管其他操作系统中的可用终端功能和命令远没有 Linux 那么健壮。\n\n在尝试为执行特定任务选择正确的应用程序或工具时，你可能会感到不知所措，因为可能有许多棒的选项可以选择。我相信，选择最佳应用程序、工具或方法时，最重要的事情并不总是选择当前最先进、最闪亮的玩具。选择一个让你觉得合适、符合逻辑、能完成你所需、并且适用于你想使用的发行版的工具更为重要。\n\
  \n永远不要忘记，伟大的工具经常会被支持社区遗弃，或不再由开发者维护。这种情况发生在所有平台上，无论是开源还是闭源的应用程序和工具。这只是提醒你随时做好准备。\n\
  \n最后，在书中，我可能会演示执行某事的多种方法或某个工具的替代用途。我包含这些是为了让你意识到有这些选择。\n\n## Linux 的起源\n\n最初的 UNIX\
  \ 概念基于一个名为“Multics”的项目中的多用户操作系统（该系统还包括单级存储、动态链接和分层文件系统）。该操作系统是在贝尔实验室的计算机科学研究中心开发的。Multics\
  \ 操作系统在 1969 年被贝尔实验室放弃了。\n\nKen Thompson、Dennis Ritchie 以及其他研究人员继续根据该项目的核心原则进行工作。随后在\
  \ 1973 年，他们选择用 `C` 语言重写该操作系统，这使得 UNIX 具有了与伦比的可移植性（即将其移动到新硬件上的能力），这与当时的其他操作系统不同。\n\
  \nUNIX 持续在贝尔实验室（后来的 AT&T）继续开发，并在 UNIX 系统实验室与 Sun Microsystems 的合作下进行。在加州大学伯克利分区的计算机系统研究小组期间，他们产生了一个\
  \ UNIX 变体伯克利软件发行版（BSD），或 `BSD UNIX`。这个版本的操作系统启发了其他系统，例如 NeXT 的 NeXTStep，后来成为了 MacOS\
  \ 的基础。它还启发了 MINIX（一个教育版本）以及 Linus Torvalds 开发 Linux 的灵感。\n\nRichard Stallman 是帮助启发开源软件运动的核心人物之一，该运动旨在寻求\
  \ UNIX 的非专利替代方案。Stallman 在麻省理工的人工智能实验室工作期间发起了 `GNU` 项目（递归含义，意为“GNU 不是 UNIX！”）。1984\
  \ 年，他离开那里开始将 `GNU` 组件作为自由软件分发，并在 1985 年创立了自由软件基金会（FSF）。\n\nLinus Torvalds 是一位芬兰本科生，对\
  \ MINIX 操作系统的许可协议感到沮丧。随后他在 1991 年 8 月 25 日向 MINIX 用户组宣布，他正在开发一种类似于 MINIX 的自己的操作系统。他最初在\
  \ MINIX 上使用 `GNU C compiler` 开发了 Linux 内核。这很快变成了一个独特的项目，Torvalds 和一组核心开发者在 1994\
  \ 年发布了内核的 1.0 版本。\n\nTorvalds 使用 `GNU C Compiler` 编写了 Linux 内核，许多 Linux 发行版利用了 `GNU`\
  \ 组件。Stallman 将 Linux 术语扩展为 `GNU/Linux`，他认为这同时捕捉了 Linux 开发的贡献以及 GNU 项目在促进 Linux\
  \ 发展的底层理念上的贡献。\n\n# 兼容性\n\n## 警告\n\n请自担风险使用本书中的信息。所有内容随时可能更改。这超出了我的控制范围。作者和出版商对使用本书内容可能造成的任何损坏或问题不承担责任。\n\
  \n我已尽力让信息尽可能有用且相关。因此，如果你在使用其中一个命令时遇到问题，我深表歉意。请告诉我，我会尽力在书未来的版本中修复这个问题。\n\n不要在生产环境中测试这些命令。请先在开发区域进行测试，并确保它们在你的基础设施中正常工作。\n\
  \n这些命令中的某些可以也将破坏数据，因此在使用它们之前，请确保你已经对数据进行了良好的测试备份。\n\n\n\n\nLinux 命令、URL 等一直在更新、退役或被取代。因此，我无法保证在你阅读本书时，书中内容的准确性。影响准确性的其他因素还包括不同的发行版（distros）、发行版版本、shell、命令和实用工具。即使是发行版的公司和人员一直在使用最新工具演进操作系统，并淘汰旧的工具。\n\
  \n## 入门\n\n### 概述\n本书侧重于 Linux 命令行。它不为 X-Windows（Linux 的 GUI 图形用户界面）提供任何帮助。虽然会提到它，但它不是重点。\n\
  \n本书的内容是为 `BASH`（Bourne-Again Shell 的缩写）shell 编写的。本书并不试图偏向任何一个发行版，而是尽可能在任何情况下都比比特定版本更具通用性。\n\
  \n这样编写书籍的一个缺点是，我所针对的可能并不是你现在正在使用的 Linux 版本。如果你想要一本针对特定发行版的书籍，我将推荐其他资源。\n\n请注意，取决于你使用的发行版（简称\
  \ Distro），你可能在使用另一种 shell（例如 `csh`、`tcsh`、`ksh`、`ash`、`zsh` 等）。如果你在另一种 shell 中，只需在控制台中输入命令\
  \ `bash` 并回车即可启动它。\n\n如果你正在运行 X-Windows，只需启动命令行终端（通常称为 terminal 或 console）。否则，你可以完全退出\
  \ GUI，希望它能带你回到命令行界面。如果没有，你将需要查找针对你的发行版如何操作。\n\n## Linux 无处不在\nLinux 似乎运行在从手表到大型机以及其之间的所有设备上。运行互联网的很大基础设施都是基于\
  \ Linux 的服务器。\n\n有多个不同的版本/变体运行在物理服务器、桌面电脑、笔记本电脑、虚拟机、云基础设施等。它还是 Mac OS X、iOS、Android\
  \ 的底层操作系统。大多数 IoT（物联网）设备，如树莓派（Raspberry PI）以及无数其他类似设备。\n\n![`upload.wikimedia.org/wikipedia/commons/9/97/Raspberry_Pi_3_B%2B_%2839906369025%29.png`](img/00002.jpeg)\n\
  \n树莓派 3 B+ 单板计算机，来自英国布拉福德的 [Gareth Halfacree](https://www.flickr.com/people/120586634@N05)\n\
  \n## Linux 核心哲学\n如前所述，每个发行版的处理方式似乎略有不同，并有它们自己的方式/风格。尽管如此，大多数 Linux 版本都遵循一些通用哲学和原则，概述如下。\n\
  \nLinux 的核心是 `kernel`（内核），它控制所有低层功能（例如应用程序与硬件之间的通信）。`kernel` 最初由林斯·托瓦尔斯（Linus Torvalds）设计，仍由他和其他一群人维护（[`www.kernel.org/`](https://www.kernel.org/））。Linux\
  \ `kernel` 由所有发行版共享。\n\n有主要的发行版，几乎所有可用的发行版都是基于这些 Linux 操作系统的版本之一。\n\n- **Debian**\
  \ 是一个强调自由软件的发行版。它支持许多硬件平台。\n- **Red Hat Linux**（红帽 Linux）是原始主要发行版之一，分为商业版和社区支持发行版。社区支持的\
  \ Red Hat Linux 赞助发行版名为 `Fedora`，商业支持的发行版称为 `Red Hat Enterprise Linux`（红帽企业 Linux）。\n\
  - **Slackware** 是一个高度可定制的发行版，强调易维护的可靠性，而非尖端软件和自动化工具。通常被认为是面向高级用户的发行版。\n\n由于 Linux\
  \ 最初基于 UNIX，因此它曾使用“runlevels”（运行级别），这是根据可用服务的状态来描述系统状态的操作级别。例如，如果系统使用运行级别 1，则它处于单用户模式。你通常处于运行级别\
  \ 2-5，这是多用户模式。有关关于文件系统的更多信息，请参见接下来的章节“Linux 运行级别”。\n\n**注意：**\n大多数现代 Linux 发行版不再使用运行级别。运行级别技术不支持在运行多个服务的同时启动系统。\n\
  \nLinux 是一个完全的多任务（一种同时执行多个任务的方法）多用户操作系统，具有内置的网络功能和服务进程，称为守护进程（daemons）。\n\nLinux\
  \ 有四种类型的账户：root、System、Normal、Network。`root`（超级用户，即管理员）账户最强大，拥有系统的完全访问权限。\n\n安装新实用工具、应用程序（如\
  \ `MySQL`、`Apache` 等）和子系统（如 `Docker` 等）的安装程序因发行版而异。\n\n例如：\n\n```bash\nsudo yum\
  \ install package_name (在基于 Red Hat 的系统上)\n```\n或\n```bash\nsudo apt-get install\
  \ package_name (在基于 Debian 的系统上)\n```\n\n**注意：**\n有几种不同的方法安装新程序。使用包管理器只是让安装新实用工具或程序变得简单。其他安装方法可能包括从\
  \ `Git` 下载仓库并编译，而其他程序可能需要完全不同的方法。\n\nLinux 对命令、选项、文件路径等大小写敏感。如果你以前习惯于像 Windows 这样的操作系统，这将是你必须习惯的第一件事之一。在所有\
  \ Linux 文件系统目录或文件名中，例如：`/boot`、`/Boot` 和 `/BOOT` 代表三个不同的目录。\n\n任何带有 `.conf` 扩展的文件通常意味着它是一个包含应用程序配置的文本文件（例如\
  \ `/etc/yum.conf`）。\n\n可用的命令、目录、配置文件和位置在不同的 Linux 发行版之间会有很大差异。开玩笑地说，“它们完全一样，不同之处在于它们不同。”你可能需要研究这些文件存储在何处，以及在不同发行版中可能被命名为什么。\n\
  \nLinux 通过文件或像文件的对象提供其组件。进程、设备和网络套接字都由类文件对象表示，通常可以使用用于普通文件的相同实用工具进行处理。\n\n之所以有很多命令和实用工具，是因为\
  \ Linux 的设计哲学。命令的设计是为了很好地执行一个功能或操作。\n\n程序通常存储在以下路径之一：`/bin`、`/usr/bin`、`/sbin`、`/usr/sbin`。这根据你使用的发行版和应用程序而变化。\n\
  \n默认，所有权限（即使你以 root 身份登录）都从基础用户账户安全开始运行（因此你可以运行命令如：`ls`、`cp`、`rm` 等）。需要提升权限的命令需要在其前面加上前缀命令\
  \ `sudo`（例如 `sudo command -options`）。在你按回车后，你将被要求输入管理员密码并再次按回车。\n\n**注意：**\n`root`（超级用户，即\
  \ root）账户非常强大，拥有系统的完全访问权限。每当你运行命令（如 `ls`、`cp`、`rm` 等）时，这通常会启动一个在你用户账户下运行的进程。\n\n\
  **注意：**\n每个进程都有一个进程 ID（即 `PID`）并会消耗一些系统资源。最明显的是 CPU 时间、内存、打开的文件和设备。某些命令、实用工具或应用程序比其他程序更消耗资源。\n\
  \n\n\n\n\n几乎每个命令都有某种类型的选项（又称参数）来扩展其功能。例如，如果你输入命令 `ls`，它将为你提供目录中的基本文件信息。如果你输入命令和选项\
  \ `ls -l`，它将提供额外信息。如果你添加了额外的选项，如 `ls -al`，它会显示一组之前未显示的文件。\n\n在 Linux（以及其他 UNIX 类操作系统）中，整个系统无论涉及多少物理存储设备，都由单一的树形结构表示。树形结构的根目录由\
  \ `/` 表示。\n\n### Linux 树形结构示例\n\n```\n/\n/bin\n/boot\n/dev\n/etc\n/home\n/lib\n\
  ```\n\n注意：\n文件系统层次级标准（FHS）定义了 Linux 发行版中的目录结构和内容。该标准由 Linux 基金会维护。有关 FHS 的更多信息，请参阅以下章节“文件系统层次级标准”。\n\
  \n# 安装 Linux\n\n概述：本章涵盖了使用 Linux 发行版入门 Linux 的注意事项。目前有多种类型的发行版（即 Distributions）供选择。有些仅仅是\
  \ Linux 客户端，另一些用于服务器目的，有些用于通用，而另一些用于特定用途。\n\n第一步是根据你的需求选择合适的合适的发行版。第二步是选择如何以及在哪里安装你选择的发行版。\n\
  \n有时，这个选择将根据你尝试实现的目标或可提供的选项由他人为你决定。其他情况下，它需要对你想要使用的发行版进行研究，并以最终结果为目标进行考量。\n\n##\
  \ 选择发行版\n\n市面上实际上有数百种发行版供选择。这个列表远不完整，仅提供了几个热门的选项。在选择任何发行版之前，一个主要的建议是确保它仍然由支持它的社区积极开发。\n\
  \n你正在尝试安装的应用程序将决定你可以使用的发行版和版本。其他人对某个发行版而非另一个发行版有个人偏好。\n\n- **Debian**: 一个非商业发行版，是最早的发行版之一，由志愿者开发者社区维护，对自由软件原则和民主项目管理有着坚定的承诺。（更多信息：[`www.debian.org/`](https://www.debian.org/))\n\
  - **Ubuntu**: 源自 Debian 的桌面和服务器发行版，由英国 Canonical Ltd. 公司维护。（更多信息：[`www.ubuntu.com/`](https://www.ubuntu.com/))\n\
  - **Fedora**: 一个由红帽支持的社区支持发行版。该发行版是红帽商业 Linux 产品的技术测试平台，在将其集成到商业版的红帽企业 Linux（RHEL）之前，对新的开源应用进行原型设计。（更多信息：[`getfedora.org/`](https://getfedora.org/))\n\
  - **Slackware**: 最初创建于 1993 年，最早的 Linux 发行版之一，也是仍在维护的最老的发行版之一。该发行版致力于保持高度类 UNIX\
  \ 化并便于终端用户修改。（更多信息：[`www.slackware.com/`](http://www.slackware.com/))\n\n额外信息：\n\
  - DistroWatch ([distrowatch.com](https://distrowatch.com))\n- 关于发行版的最新信息\n\n###\
  \ 商业 Linux 发行版\n\n仅仅因为 Linux 是免费开源的，并不意味着所有发行版都是免费的，也不包含某些闭源软件（即任何非开源软件）。这是自由开源软件（又称\
  \ FOSS）纯粹者经常争论的一点。\n\n红帽是 90 年代帮助帮助 Linux 合法化的早期公司之一，包括了付费专业支持的想法。在此之前，所有的 Linux\
  \ 支持都必须通过在线社区获得。\n\n如果你是一个专业机构，例如企业或政府，那么你可能想要考虑使用其中一种商业 Linux 发行版，因为它们提供 24x7 的付费支持。当使用社区发行版时，支持模型是“尽力而为的”（即不保证），当你处于关键时刻时，你并不希望听到这种说法。\n\
  \n红帽企业 Linux (RHEL) 是 Fedora 的衍生版本，由红帽维护并提供商业支持。它旨在为企业提供经过测试、安全且稳定的 Linux 服务器和工作站支持。\n\
  \n## 安装你的发行版\n\n你可以在几种不同类型的设备（即物理设备、虚拟机等）上安装并启动 Linux。这一决定应该根据你尝试实现的目标以最终目标为依据做出。否则，它应该根据你拥有的且你想要运行的发行版所支持的硬件来做出。\n\
  \nLinux 以在旧硬件上运行而闻名，而较新的操作系统可能不再支持这些硬件。在新的计算机硬件上安装 Linux 时，主要的考虑因素是你想要使用的所有设备（如显卡、打印机等）的驱动支持可用性。在安装之前，你需要确保有驱动兼容性。\n\
  \nIoT 设备（即路由器、单板计算机和其他类型的电子设备），例如树莓派（Raspberry Pi）或数百其他竞争对手中的任何一个。咨询设备制造商以查找适用于它的发行版。以树莓派为例，有几个流行的发行版可供使用。\n\
  \n物理计算机（即台式机、笔记本电脑），可以使用单启动（仅 Linux）或双启动（Linux 和另一个操作系统，如 Windows）。这种选项提供了最多的发行版选择。\n\
  \n还有“现场启动”（live boot）选项可以从 USB 闪盘或光盘运行 Linux。这不使用系统的内部存储设备，因此不会留下任何痕迹。此外，这些发行版也可以用于尝试修复故障的计算机。\n\
  \nKnoppix：最早从可移动介质运行的 Live CD 发行版之一，源自 Debian。\n\n注意：\n你的系统固件（BIOS 或 UEFI）必须能够从可移动介质（如光盘或\
  \ USB）启动。大多数现代系统通常通过启动菜单选项支持此功能。如果在配置方面遇到任何问题，请咨询你的硬件制造商。\n\n你还可以在虚拟机（VM）上运行发行版，在物理计算机或云基础设施上的虚拟机中运行。并非所有发行版都能在这些环境中运行，请查看你的虚拟机或云提供商所支持的内容。\n\
  \nMacOS X 和 Chromebook 拥有原生 UNIX/Linux 支持。MacOS X 是在兼容 UNIX 的操作系统之上构建的。Google 最近为\
  \ Chromebook 提供了原生 Linux 支持。\n\nWindows 10 现在提供名为 WSL 的 Linux 子系统。WSL 已经支持从 Windows\
  \ 商店下载的几个热门发行版。\n\n\n\n\n\n我将简要介绍这个主题。接下来是关于如何使用不同操作系统常用版本启动终端的快速介绍。这些步骤也会根据你运行\
  \ Linux 发行版的方式而异。例如，它是在物理计算机或设备上、是虚拟机，还是在云端运行。\n\n### 在 Linux GUI (Ubuntu) 上启动终端：\n\
  \n- 如果你正在使用 Unity：打开 Dash 搜索，输入：`terminal`，按回车键。\n- 在应用程序菜单下，选择 `Applications >\
  \ Accessories > Terminal`。\n- 按 `Ctrl+Alt+T`。\n\n### 在 Mac OS X 设备上启动终端\n\n使用 Spotlight\
  \ 搜索启动终端：输入 `terminal` 并按回车键。\n\n### 在 Windows 10 上启动终端\n\n如果你正在使用 Windows 10，可以使用虚拟机运行该操作系统的实例，或者使用现在已包含其中的新版\
  \ Linux 子系统（称为 `WSL`）。\n\n从开始菜单中启动你安装的 `Distro Terminal`。\n\n**注意：**\n要安装 Linux\
  \ 子系统，请在管理员权限的 PowerShell 控制台中运行以下命令：\n```\nEnable-WindowsOptionalFeature -Online\
  \ -FeatureName Microsoft-Windows-Subsystem-Linux\n```\n然后用户需要访问 Windows 商店 ([`aka.ms/wslstore`](https://aka.ms/wslstore))\
  \ 并下载他们想要使用的 Linux 版本。\n\n### 更新系统\n\n如果这是新安装的 Linux 或者它已经一段时间没有更新，你应该确保它是最新的，即安装最新的库、应用程序修复程序和安全补丁。从安全的角度来看，这非常重要，因为可以帮助防止系统被破解。\n\
  \n根据你所使用的发行版，此过程会有所不同。在两种情况下，第一条命令用于获取有关工具、库等的更新信息。第二条命令执行更新。\n\n对于基于 Debian 的发行版，运行以下命令（需要\
  \ root 权限）：\n```bash\nsudo apt-get update\nsudo apt-get upgrade\n```\n\n对于基于 Red\
  \ Hat 的发行版，运行以下命令（需要 root 权限）：\n```bash\nsudo yum update\nsudo yum upgrade\n```\n\
  \n# Linux Shell 简介\n\n概述：本书假设你已经知道如何登录操作系统，并且已经设置了具有适当权限的账户。本书还假设你已经登录到终端，并且它正在使用\
  \ `BASH` shell。\n\n当你启动 Linux 时，它将以 GUI 模式或文本终端模式启动。如果你的系统以 GUI 模式启动，则你需要启动一个控制台或终端会话。否则，请登录你将使用的任何系统。\n\
  \n## 使用控制台\n\n任何 shell 的主要目标是通过提供所需的信息（即参数）来促进命令或脚本的执行。shell 提供的额外功能包括：变量、条件分支（即\
  \ `if-statements`）、循环、函数等，用于创建管理操作系统、文件、权限等的脚本。\n\n你必须学习的第一且最关键的事情是终端的编辑功能。你将经常使用这些键盘快捷键，一旦掌握了它们，将会让你的终端生活变得更容易。\n\
  \n**注意：**\n终端使用一组类似的编辑功能键，这些键也被 `vi` 和其他类似的编辑器（如 `vim`、`emacs` 等）使用。\n\n### 键盘快捷键\n\
  \n在命令终端中编辑（注意：这些命令特定 bash shell，其他 shell 可能有不同的选项）\n\n- 按 `Ctrl+A`（或按 Home 键）移动到行首。\n\
  - 按 `Ctrl+E`（或按 End 键）移动到行尾。\n- 按 `Ctrl+L` 清屏。\n\n**提示：**\n如果终端出现问题，请输入：\n```\n\
  reset\n```\n- 按 `Ctrl+K` 删除到行尾的所有内容。\n- 按 `Ctrl+D` 退出当前 shell。\n- 按 `Ctrl+U` 切从当前光标位置到行首的文本。\n\
  - 按 `Ctrl+Y` 粘贴剪切的文本。\n- 按 `Ctrl+W` 向后剪一个单词。\n- 按 `Ctrl+T` 交换光标前的两个字符。\n- 按 `ESC+T`\
  \ 交换光标前的两个单词。\n- 按 `Ctrl+]`（字符）：快速跳转到已输入的字符。\n- 按 `Ctrl+_` 撤销上一次更改。\n- 按 `Alt+F`\
  \ 向行向前移动一个单词。\n- 按 `Alt+B` 向行后移动一个单词。\n- 按 `Alt+(.)` 显示上一条命令并从中提取最后一个参数。\n- 按 `Alt+Backspace`\
  \ 剪切上一个单词。\n- 按 `Alt+Delete` 剪切光标前的字符。\n- 按向上和向下方向键浏览之前的命令历史。\n- 按 `TAB` 键在命令后自动补全文件名/目录，输入：`mkdir\
  \ /`（按 TAB 键）。\n\n**注意：**\n如果有多个值（即多个文件或目录），多次按 `TAB` 键以查看所有可用选项。\n\n**提示：**\n-\
  \ 如果你必须编写或编辑一条长命令，输入：`fc`（这将打开一个编辑器，并显示最后输入的命令。从这里你可以编辑命令。完成后，按 `Ctrl+X`，输入 `Y`\
  \ 并按回车键执行它）。\n- 在按回车键之前可以扩展别名，例如输入：`echo !$ !-2^ *`（按：`Alt+Ctrl+E` 或者 `Ctrl+X`,\
  \ `*`）。仔细观察该行查看变化。\n- 通过按 `ALT+(任意 _ 数字)` 然后按一个字符 `(任意 _ 字符)`，`(任意 _ 字符)` 将打印 `(任意\
  \ _ 数字)` 次。\n  例：按下 `ALT+30`，然后按字母 `X`，将重复字母 `X` 30 次。\n\n### 自动补全快捷键\n\n如果你输入了一个或多个字母，可以尝试以下自动补全键盘快捷键：\n\
  \n- 按 `Ctrl+X, ~`（波浪号）补全用户名。\n- 按 `Ctrl+X, @`（at 符号）补全机器名。\n- 按 `Ctrl+X, $`（美元符号）补全环境变量变量名。\n\
  - 按 `Ctrl+X, !`（感叹号）补全命令或文件名（功能与 `TAB` 键相同）。\n\n## 外部命令\n\n所有的 shell 都有两种类型的命令：内置和外部。`BASH`\
  \ 有几个内置命令，这意味着它们不需要安装，也无法卸载。\n\n大多数外部命令必须使用某种类型的安装包管理器（如 `apt-get`、`yum` 等）安装（或删除）。默认安装的命令/工具在不同的发行版之间会有所。\n\
  \n要从任何外部命令获取帮助并查看其选项，请输入：\n```\ncommand_tool --help\n```\n或者\n```\nman command_tool\n\
  ```\n\n例如，输入：\n```\nmkdir --help\n```\n或者\n```\nman mkdir\n```\n\n**提示：**\n为了方便在\
  \ man 页中搜索你需要的内容，请使用以下参数后跟命令或搜索字符串：\n- `man -f runlevel`（名称中包含该字符串）\n- `man -k runlevel`（显示讨论该主题的\
  \ man 页列表）\n- `man -a runlevel`（在所有章节中接一个显示所有给定名称的页面。）\n\n`info` 是另一个为命令提供手册（即 `man`）页的系统。它主要为\
  \ GNU 命令和工具提供。导航键为：`'n'` 下一个节点，`'p'` 上一个节点，`'u'` 索引父节点。\n\n大多数命令由两个或多个元素组成（例如：`kill\
  \ -p 2300`）。它们总有一个名称（例如：`kill`），大多数命令还有一组可选或必需的参数集（例如：`-p`）。此示例还包含了值（例如：`2300`）。当执行此命令时，它将杀死\
  \ ID 为 2300 的进程。\n\n**注意：**\n当配合 `man` 页使用时，通常会看到带有括号数字的命令（例如 `man(7)`）。下表描述了这些数字代表的含义：\n\
  \n- (1) - 可执行程序或 shell 命令，例如 `date`、`who`\n- (2) - 系统调用（内核提供的函数），例如 `read()`、`write()`\n\
  - (3) - 库调用（程序库中的函数），例如 `fread()`、`fwrite()`\n- (4) - 特殊文件（通常位于 `/dev` 中），例如 `null`、`fifo`、`zero`、`hd`\n\
  - (5) - 文件格式和规范（例如 `/etc/passwd`），例如 `passwd`、`group`、`resolv.conf`\n\n\n\n\n\n\
  # (6) - 游戏\n\n(7) - 杂项（包括宏包和约定），例如 `man(7)`, `groff(7)`\n\n(8) - 系统管理命令（通常仅适用于 root\
  \ 用户），例如 `useradd`, `ifconfig`\n\n(9) - 内核例程 [非标准]\n\n示例：要访问 man 页中的特定章节（即 `man(7)`），请输入：`man\
  \ 7 man`\n\n关于此主题的更多信息，请输入：`man -s 1 man`\n\n## 内置命令\n\n如前所述，`BASH` 有几个内置命令，这意味着它们不需要安装，且无法被卸载。\n\
  \n内置命令与外部命令之间的另一个重要区别是：外部命令会有关联的 `man` 页面，而内置命令将列在 `help` 页面中。\n\n### 内置命令部分列表\n\
  \n- `alias`: 定义新别名。如果不提供输入，则显示现有的别名。\n- `bind`: 显示或设置当前的 `Readline` 键位或函数绑定。\n-\
  \ `echo`: 输出参数，以空格分隔，并以换行符结束。\n\n提示：\n\n要查看所有内置工具的完整列表，请输入：`help`\n\n## GUI 帮助系统\n\
  \n取决于你使用的 `X-Windows` 桌面环境（`GNOME` 和 `KDE`），它将有不同的帮助系统。根据你使用的环境，输入以下命令之一：\n\n`gnome-help`:\
  \ 用于 `GNOME` 帮助\n\n-或- \n\n`khelpcenter`: 用于 `KDE` 帮助\n\n## 命令管道与输出重定向\n\n大多数命令和脚本都可以接受某种标准输入（又称\
  \ `STDIN`）并写入标准输出（又称 `STDOUT`）。\n\n`STDIN` 的形式为参数或从命令或脚本传递的数据。\n\n示例：如果你输入 `echo\
  \ HelloWorld`，你正在将参数 `HelloWorld` 传递给 `echo` 命令。随后 `echo` 命令会将输出显示在终端。\n\n注意：每个命令自动连接了三个数据流。\n\
  \n- `STDIN (0)` - 标准输入（馈给程序的数据）\n- `STDOUT (1)` - 标准输出（程序打印的数据，默认输出到终端）\n- `STDERR\
  \ (2)` - 标准错误（用于错误信息，默认也输出到终端）\n\n`STDOUT` 是命令或脚本生成的数据，然后默认发送到终端。尽管如此，输出也可以重定向到另一个命令并作为输入、发送到打印机或文件等。\n\
  \n使用之前使用的示例，如果你输入 `echo HelloWorld`，`HelloWorld` 的输出将显示在终端上。\n\n注意：此输出也可以使用 `>`\
  \ 重定向到文件，例如：\n\n```bash\necho HelloWorld > output_file.txt\n```\n\n### 命令管道\n\n\
  管道重定向来自一个命令的输出并将其发送到另一个命令进行处理。这是一个非常强大且常用的运算符。它允许你从一个命令获取输出，并将其作为输入发送到另一个命令中。\n\n\
  示例：\n\n```bash\nls -al | less\n```\n（按 `Q` 退出，或使用方向键向上向下移动）\n\n### 输出重定向\n\n默认情况下，每个命令都从\
  \ `STDIN` 读取并写入到 `STDOUT`。然而，你可以更改这一点并将输出重定向到文件。有几种类型的重定向操作符执行不同的操作，因此了解它们之间的区别非常重要。\n\
  \n- `command > output_file` 将命令的 `STDOUT` 发送到文件。\n示例：\n```bash\nls -l / > ~/output_file.txt\n\
  cat ~/output_file.txt\n```\n注意：如果文件已存在，这将覆盖文件。\n\n- `command >> output_file` 将命令的\
  \ `STDOUT` 追加到现有文件。\n示例：\n```bash\nls -l / >> ~/output_file.txt\ncat ~/output_file.txt\n\
  ```\n\n- `command 2> output_file` 将 `STDERR` 重定向到文件，或者在下面的示例中，它被重定向到 `/dev/null`，以便不在控制台上显示任何内容。\n\
  示例：\n```bash\nls -l / 2> /dev/null\n```\n\n- `command &> output_file` 将 `STDOUT`\
  \ 和 `STDERR` 都重定向到文件，或者在下面的示例中，它们被重定向到 `/dev/null`，以便不在控制台上显示任何内容。\n示例：\n```bash\n\
  ls -l / &> /dev/null\n```\n\n- `command < input_file` 将文件内容重定向回命令（即作为输入提供）。\n示例：\n\
  ```bash\nwc -l < input_file\n```\n\n- `2>&1` 将 `STDERR` 和 `STDOUT` 输出重定向到同一个文件。\n\
  示例：\n```bash\ndu / > output_file 2>&1\n```\n\n提示：通过将输出重定向到 `/dev/null`，控制台上将不会显示任何内容。设备\
  \ `/dev/null` 可以被视为一种黑洞，具有无限大小但无法从中检索任何内容。\n\n注意：所有的重定向操作符有：`<`, `>`, `|>`, `<<`,\
  \ `>>`, `>&`, `<>`。这些重定向操作符中的几个在本节较之前已经讨论过，但还有一些你可能较少使用或从不使用。\n\n- `cmd >| file`\
  \ 覆盖文件，即使 shell 关闭了此功能。\n- `cmd1 >& cmd2` 将 `cmd1` 的 `STDERR` 和 `STDIN` 都重定向到 `cmd2`。\n\
  - `cmd <> file` 在 `STDIN`（或 `cmd`）上打开文件进行读写。\n\n## 高级：使用命令替换\n\n可以使用一个工具的输出作为另一个工具的输入，这被称为命令替换。此输出可以作为生成循环的参数。要利用此功能，使用美元符号后跟括号来包围命令。例如：\n\
  \n```bash\necho Today $(date)\n```\n\n命令替换的旧格式使用反引号包围命令。例如：\n\n```bash\necho Today`date`\n\
  ```\n\n## 高级：变量扩展\n\n变量扩展是在命令执行时，它将变量名替换为它所包含的值。例如，如果你输入 `echo $SHELL`，它可能返回 `/bin/bash`。\n\
  \n提示：以下函数对于命令调试非常有用，因为它会显示变量扩展的结果。要创建该函数，输入：\n\n```bash\nv () {\n  echo \"$@\";\n\
  }\n```\n要利用创建的函数，输入：\n\n```bash\nv echo $SHELL\n```\n\n\n\n\n\n本节列出的系统命令和实用用于执行基本的系统功能和操作。例如，管理命令历史、检查系统进程信息等。\n\
  \n你会发现 Linux 拥有一个非常强大的命令历史功能，拥有许多快捷键和技巧可以方便访问之前使用过的命令。\n\n要查看你输入过的之前的命令列表，请输入：\n\
  \n```\nhistory\n```\n\n**注意：**\n\n你输入的命令历史存储在文件中：\n\n`~/.bash_history`\n\n要执行列表中特定的命令，请输入：\n\
  \n```bash\n!#\n``` （将 `#` 替换为想要运行的命令编号（例如：`!100`））\n\n**提示：**\n\n如果你在命令前加一个空格，该命令将从\
  \ shell 历史中被忽略。\n\n要清除当前会话的历史，请输入：\n\n```bash\nhistory -r\n```\n\n重新执行你上一次输入的命令，输入：\n\
  \n```bash\n!!\n```\n\n以 root 权限重新运行上一个命令，输入：\n\n```bash\nsudo !!\n```\n\n**提示：**\n\
  \n重复执行上一个命令直到其执行成功，输入：\n\n```bash\nuntil !!; do :; done\n```\n\n将上一个命令回显到终端，输入：\n\
  \n```bash\n!!:p\n```\n\n在搜索历史中找到并执行匹配搜索字符串（例如 `echo`）的最后一个命令，输入：\n\n```bash\n!?echo\n\
  ```\n\n**提示：**\n\n搜索并执行匹配字符串的最后一个命令，输入：\n\n```bash\n!?echo?:p\n```\n\n重新执行上一个命令的选项，输入：\n\
  \n```bash\n!$\n```\n\n**示例：** 列出一个目录文件夹，然后切换到该路径，输入：\n\n```bash\nls /bin (按回车)\n\
  cd !$ (按回车)\n```\n\n插入不带最后一个参数的最后一个命令，输入：\n\n```bash\n!:-\n```\n\n按下 `Ctrl+R` 反向搜索命令历史。\n\
  \n**注意：**\n\n这一次只能作用一个命令，下一个命令继续按 `Ctrl+R`（按 `Ctrl+C` 取消）。\n\n**提示：**\n\n从历史命令中获取更多信息（例如日期和时间），输入：\n\
  \n```bash\nHISTTIMEFORMAT=\"%d/%m/%y %T \" && history\n```\n\n将运行过的最后一个长命令保存到脚本中：\n\
  \n```bash\necho \"!!\" > script_file.sh\n```\n\n**提示：**\n\n按下 `ESC` 然后按 `*`（星号或\
  \ `TAB` 键）将插入自动补全命令行结果，输入：\n\n```bash\nlsb_<ESC>*\n```\n\n**注意：**\n\n按下 `ESC` 然后按\
  \ `.`（点）将插入上一个命令的最后一个参数\n\n以 GB 为单位查看空内存，输入：\n\n```bash\nfree -g\n```\n\n查看所有运行中的进程，输入：\n\
  \n```bash\nps -A\n```\n\n如果有多个进程正在运行，使用更实用的版本：\n\n```bash\nps -aux | less\n```\n\
  \n列出所有包含字符串（例如 stuff）的运行进程：输入：\n\n```bash\nps aux | grep search_query\n```\n\n查看当前日期和时间，输入：\n\
  \n```bash\ndate\n```\n\n**提示：**\n\n显示美国西海岸下周三上午 10 点的本地时间，输入：\n\n```bash\ndate --date='TZ=\"\
  America/Los_Angeles\" 09:00 next Fri'\n```\n\n将你在 shell 中输入的任何内容（带时间戳）记录到名为 `typescript`\
  \ 的文件中，输入：\n\n```bash\nscript -t 2> timing.txt -a session.txt\n```\n\n在此处运行一些命令，完成后输入：\n\
  \n`Ctrl+D` 或 `exit`\n\n要回放记录的脚本，输入：\n\n```bash\nscriptreplay timing.txt session.txt\n\
  ```\n\n显示你正在运行的发行版名称和版本，输入：\n\n```bash\nuname -a\n```\n\n-或-\n\n```bash\nlsb_release\
  \ -a\n```\n\n安装该命令，输入：\n\n```bash\nsudo apt-get install lsb\n```\n\n-或-\n\n```bash\n\
  sudo yum install redhat-lsb-core\n```\n\n检查发行版的另一种方法，输入：\n\n```bash\ncat /etc/issue\n\
  ```\n\n查看你以什么用户身份登录，输入：\n\n```bash\nwhoami\n```\n\n如果你不想学习像 `vi` 或 `vim` 这样的文本编辑器，输入：\n\
  \n```bash\nnano filename.txt\n```\n\n**注意：**\n\n`nano` 是一个非常基础的文本编辑器，设计易于使用（它不像其他文本编辑器那样）。\n\
  \n要创建一个供你的脚本使用的变量，输入：\n\n```bash\nexport test=HelloWorld\n```\n\n显示变量的内容，输入：\n\n\
  ```bash\necho $test\n```\n\n**提示：**\n\n要查看所有环境变量，输入：\n\n```bash\nenv\n```\n\n列出以字母\
  \ 'S' 开头（或任何其他字母）定义的变量，输入：\n\n```bash\necho ${!S*}\n```\n\n查看变量的内容，输入：\n\n```bash\n\
  echo $SECONDS\n```\n\n将文件从当前目录位置移动到你上一次所在的目录，输入：\n\n```bash\nmv file_name.ext $OLDPWD\n\
  ```\n\n**注意：**\n\n`$OLDPWD` 是一个定义的变量，存储你上一次所在的目录。例如，输入 `cd /home`，然后输入 `echo $OLDPWD`。它将显示上一个目录的名称。\n\
  \n临时秒表（按 `Ctrl+D` 停止），输入：\n\n```bash\ntime read\n```\n\n需要帮助查找执行某操作的命令，输入：\n\n```bash\n\
  apropos \"directory\"\n```\n\n-或-\n\n```bash\napropos \"file\"\n```\n\n查看今年或其他任何其他日期的日历，输入：\n\
  \n```bash\ncal -OR- cal -y -OR- cal 2025\n```\n\n显示系统运行时间（即操作系统启动以来的时间），输入：\n\n\
  ```bash\nuptime\n```\n\n-或-\n\n```bash\nuptime -p\n```\n\n计算命令完成所需的时间，输入：\n\n```bash\n\
  time ls -al /\n```\n\n设置本地系统时间，输入：\n\n```bash\nsudo date --set=\"20:20:00\"\n```\n\
  \n显示 ASCII 字符表，输入：\n\n```bash\nman 7 ascii\n```\n\n## 管理多用户系统\n\nUNIX（以及后来的 Linux）从操作系统诞生之初就是多用户系统。Linux\
  \ 有几个实用程序和命令用于显示和管理登录用户。\n\n显示当前登录登录的摘要，输入：\n\n```bash\nwho\n```\n\n-或-\n\n```bash\n\
  users\n```\n\n显示用户上次登录系统的时间（包括实际和有效用户及组 ID），输入：\n\n```bash\nlast user_name\n```\n\
  \n-或-\n\n```bash\nlast -ap now\n```\n\n显示系统上已知用户的信息（比 `who` 命令更健壮），输入：\n\n```bash\n\
  lslogins -u\n```\n\n**注意：**\n\n`utmp`、`wtmp`、`btmp` 文件跟踪系统所有的登录和注销情况。这些文件被 `last`、`lastb`\
  \ 和 `lslogins` 等命令使用。\n\n- `utmp`：维护系统状态的完整计数、系统启动时间（供 `uptime` 使用）、记录用户在终端的登录、注销、系统事件等。\n\
  - `wtmp`：作为历史 `utmp`。\n- `btmp`：记录失败的登录尝试。\n\n显示系统上当前活动和登录用户（包括他们最后运行的进程）的摘要，输入：\n\
  \n```bash\nw\n```\n\n显示所有用户最近登录的详情，输入：\n\n```bash\nlastlog\n```\n\n-或-\n\n```bash\n\
  lastlog -u jane\n```\n\n**注意：**\n\n此日志显示用户登录和注销活动，输入：\n\n```bash\ncat /var/log/auth.log\n\
  ```\n\n## 文件系统命令\n\n这些命令和实用执行基本的文件管理功能。例如管理文件和存储。Linux 有许多强大的命令用于管理存储设备、文件系统（包括分区和卷）以及相关文件。\n\
  \n**注意：**\n\n有关文件系统的更多信息，请参见以下章节“存储管理”。\n\n文中多次提到“人类可读”，这基本上意味着输出不是以长数字的 1K 块形式列出（这些数字难以转换为易于理解的内容，例如\
  \ M = Megabytes，G = Gigabytes 等）。某些命令和实用程序支持此功能，而另一些不支持。\n\n### 普通格式\n\n| 文件系统 |\
  \ 1K-块 | 已用 | 可用 | 使用率 | 挂载在 |\n|---|---|---|---|---|---|\n| rootfs | 23701920 |\
  \ 14175928 | 9525992 | 61% | / |\n\n### 人类可读格式\n\n| 文件系统 | 容量 | 已用 | 可用 | 使用率 |\
  \ 挂载在 |\n|---|---|---|---|---|---|\n| Rootfs | 227G | 138G | 89G | 61% | / |\n\n\
  以人类可读格式查看本地存储空间，输入：\n\n```bash\ndf -h\n```\n\n查看目录中的文件，输入：\n\n```bash\nls -OR ls\
  \ -l\n```\n\n查看目录中的所有文件（包括隐藏），输入：\n\n```bash\nls -al\n```\n\n**注意：**\n\n如果文件名开头有一个\
  \ `.`，`ls` 命令将无法显示。\n\n按大小列出文件（人类可读），输入：\n\n```bash\nls -lShr\n```\n\n**提示：**\n\n\
  `ls -l` 的快捷方式（长格式列表目录），输入：\n\n```bash\nll\n```\n\n切换路径到用户目录，输入：\n\n```bash\ncd ~\
  \ -OR- cd\n```\n\n回到上一个目录，输入：\n\n```bash\ncd -\n```\n\n**注意：**\n\n查看当前路径，输入：\n\n\
  ```bash\npwd\n```\n\n创建一个目录，输入：\n\n```bash\nmkdir folder_name\n```\n\n复制文件，输入：\n\
  \n```bash\ncp input_file output_file\n```\n\n使用 -r 递归，输入：\n\n```bash\ncp -r dir1\
  \ dir2\n```\n\n删除一个文件，输入：\n\n```bash\nrm file_name.ext\n```\n\n**警告：**\n\n在使用带有通配符或其他递归功能的破坏性命令时要小心，你可能会迅速删除大量你无意删除的数据。\n\
  \n**提示：**\n\n删除所有非搜索字符串（例如 `*.txt`）的文件，输入：\n\n```bash\nrm !(*.txt)\n```\n\n删除文件夹，输入：\n\
  \n```bash\nrmdir folder_name\n```\n\n递归删除目录（例如子目录，/folder1/folder2/folder3），输入：\n\
  \n```bash\nrm -r folder_name\n```\n\n\n\n\n\n该命令是交互式的，它在删除任何内容之前会请求权限。若要取消提示，请输入：\n\
  \n```bash\nrm -rf folder_name\n```\n\n要查找系统文件的位置，输入：\n\n```bash\nlocate samba.conf\n\
  ```\n\n要查找某个文件的位置，输入：\n\n```bash\nlocate -i .bashrc\n```\n\n### 注意：\n`locate` 命令通过搜索由\
  \ `updatedb` 命令维护的数据库工作。\n\n要查看文件内容，输入：\n\n```bash\ncat file_name.ext\n```\n\n####\
  \ 示例输出：\n```\nuser@localhost:~$ cat text_file.txt\n\nLorem ipsum dolor sit amet,\
  \ consectetur adipiscing elit. In quis metus facilisis aliquam quis non nisl.\n\
  ```\n\n### 提示\n要逐页查看文件内容，输入：\n\n```bash\nmore file_name.ext\n```\n\n`less` 实用程序是\
  \ `more` 命令的进阶版本，输入：\n\n```bash\nless file_name.ext\n```\n\n要查找可执行文件的存储位置，输入：\n\n\
  ```bash\nwhich mkdir\n```\n\n### 提示：\n该命令的替代方案是，输入：\n\n```bash\ntype -a mkdir\n\
  ```\n\n要查找某个可执行文件的功能，输入：\n\n```bash\nwhatis mkdir\n```\n\n要将标准输出（STDOUT）显示在终端并同时将其写入文件，输入：\n\
  \n```bash\nls -l | tee file_name.ext\n```\n\n创建多个具有顺序命名的空文件（例如 file1, file2, files3,\
  \ 等），输入：\n\n```bash\ntouch file_name{1..100}\n```\n\n或-\n\n```bash\ntouch file_name{a..z}\n\
  ```\n\n#### 示例输出：\n```\nuser@localhost:~$ touch file_name{1..100}\nuser@localhost:~$\
  \ ls -l\n\n-rw-rw-rw- 1 jane root 0 May 13 21:22 file_name1\n-rw-rw-rw- 1 jane root\
  \ 0 May 13 21:22 file_name2\n-rw-rw-rw- 1 jane root 0 May 13 21:22 file_name3\n\
  ...\n```\n\n### 注意：\n大括号 `{}` 扩展允许你扩展一组字符。例如，`{1..100}` 将 1 到 100 之间的数字递增添加到字符串或文件名中。例如，`{\
  \ a..z }` 将 A 到 Z 之间的字母递增添加到字符串或文件名中。大括号扩展的其他示例，输入：\n\n```bash\necho {0,1}{0..9}\n\
  echo {/home/*,/root}/.*profile\n```\n\n在当前目录的所有文件中搜索 `search_pattern` 字符串（命令末尾的\
  \ `*` 是搜索所有文件的通配符），输入：\n\n```bash\ngrep -RnisI search_pattern *\n```\n\n将长文件（即段落）重格式化为短行，输入：\n\
  \n```bash\nfmt file_name.txt\n```\n\n#### 示例输出：\n```\nuser@localhost:~$ cat text_file.txt\n\
  Lorem ipsum dolor sit amet, consectetur adipiscing elit. In quis metus facilisis\
  \ aliquam quis non nisl.\n\nuser@localhost:~$ fmt text_file.txt\nLorem ipsum dolor\
  \ sit amet,\nconsectetur adipiscing elit.\nIn quis metus facilisis\naliquam quis\
  \ non nisl.\n```\n\n显示关于文件的详细统计和属性，输入：\n\n```bash\nstat file_name.ext\n```\n\n####\
  \ 示例输出：\n```\nuser@localhost:~$ file capture.jpg\nFile: 'capture.jpg'\nSize: 5278\
  \ Blocks: 16 IO Block: 512 regular file\nDevice: 2h/2d Inode: 83035118129644079\
  \ Links: 1\nAccess: (0666/-rw-rw-rw-) Uid: (1000/jane) Gid: (1000/jane)\nAccess:\
  \ 2018-03-29 19:39:11.953837000 -0700\nModify: 2018-03-29 19:39:11.958023900 -0700\n\
  Change: 2018-05-13 21:05:23.751088300 -0700\nBirth: -\n```\n\n将文件移动到特定目录，输入：\n\n\
  ```bash\nmv file_name1 /path/to/directory\n```\n\nLinux 没有专门用于重命名文件的命令，你必须使用 `MV`\
  \ 来更改文件名，输入：\n\n```bash\nmv file_name1 file_name2\n```\n\n显示关于文件类型的信息，输入：\n\n```bash\n\
  file file_name.ext\n```\n\n#### 示例输出：\n```\nuser@localhost:~$ file capture.jpg\n\
  capture.jpg: JPEG image data, JFIF standard 1.01, resolution (DPCM), density 66x66,\
  \ segment length 16, baseline, precision 8, 120x120, frames 3\n```\n\n更改文件的所有者，输入：\n\
  \n```bash\nchown user1 /path/to/file_name.ext\n```\n\n更改文件权限，输入：\n\n```bash\nchmod\
  \ 644 /path/to/file_name.ext\n```\n\n### 注意：\n权限部分：所有者（owner）、组（group）和其他其它（other）（例如\
  \ 754，所有者 = 全部权限，组 = 读取+执行，其它 = 读取）。文件权限为：读取 = 4，写入 = 2，执行 = 1（例如，读取(4)+写入(2) =\
  \ 6）。\n\n### 提示：\n将 file2 的权限更改为与 file1 相同，输入：\n\n```bash\nchmod --reference file_name1\
  \ file_name2\n```\n\n\n\n\n\n所有的命令和功能应该在包含此程序的所有现代发行版中正常工作。尽管如此，在你使用的程序版本中，某些信息可能已经发生变化或废弃。\n\
  \n![](img/00006.gif)\n\n# VIM 启动界面\n\n### 历史\n`vi` 的版本可以追溯到 1979 年，它源于另一个名为 `ex`\
  \ 的编辑器。`vi` 的名称来源于 `ex` 命令 `visual` 的最短无歧缩写，该命令将 `ex` 行编辑器切换到可视模式。\n\n有一个更现代、更改进的\
  \ `vi` 版本被称为 `vim`，它是 \"Vi IMproved\" 的缩写。它于 1991 年在 Amiga 计算机上首次公开发布。它与 `vi` 向后兼容，并包含了若干增强。\n\
  \n**注意：** \n某些发行版仅包含 `vim`，并将 `vi` 设置为它的别名。\n\n### 启动程序\n以下是启动文本编辑器的命令，更多选项可以在帮助文件中找到（例如\
  \ `man vim`）：\n\n- `vi file` 编辑或创建文件（如果指定了文件则创建一个新文件）。\n- `vi -r` 显示恢复的文件。\n- `vi\
  \ -r file` 恢复一个恢复的文件。\n- `vi +n file` 编辑文件并将光标置于第 (n) 行。\n\n## 插入模式与命令模式\n`vi` 有两种模式：插入模式和命令模式。本节包含了涉及的核心概念，理解这两种模式之间的差异非常重要。\n\
  \n编辑器在命令模式启动，此时可以进行光标移动，以及文本粘贴和删除。当激活插入模式（在命令模式下按下 `i` 或 `I` 键）时，用户可以进入并修改文件中的文本。在插入模式下按下\
  \ `ESC` 键返回编辑器命令模式（例如，可以通过输入 `:x` 保存并退出）。\n\n在命令模式下，大多数命令在输入后立即执行，除了“冒号”命令（如 `:q!`），它们在你按下回车键后执行。\n\
  \n### 退出程序\n这些命令用于退出程序并保存文件更改或放弃更改。\n\n- `:x` 退出并保存更改\n- `:wq file` 退出程序（如果指定了文件则创建一个新文件）\n\
  - `:q!` 退出（强制，即使未保存）\n- `:qa!` 退出所有（强制，即使未保存）\n\n### 插入文本\n这些命令用于通过插入、追加和替换来修改文本。你必须在命令模式下使用这些功能。\n\
  \n- `i` 在光标前插入\n- `I` 在行首插入\n- `a` 在光标后追加\n- `A` 在行尾追加\n- `o` 在当前行之后开启新行\n- `O`\
  \ 在当前行之前开启新行\n- `r` 替换单个字符\n- `R` 替换多个字符\n\n### 光标移动\n这些命令用于在屏幕和文档中移动光标。你必须在命令模式下使用这些功能。\n\
  \n- `h` 光标向左移动\n- `j` 光标向下移动\n- `k` 光标向上移动\n- `l` 光标向右移动\n- `w` 下一个单词\n- `W` 下一个空白分隔的单词\n\
  - `b` 单词开头\n- `BB` 空白分隔的单词的开头\n- `e` 单词结束\n- `E` 空白分隔的单词的结束\n- `)` 句子后退\n- `(` 句子向前\n\
  - `{` 段落后退\n- `}` 段落向前\n- `0` 行首\n- `$` 行尾\n- `1G` 文件开头\n- `G` 文件结尾\n- `nG` 文件的第\
  \ (n) 行\n- `:n` 文件的第 (n) 行\n- `fc` 向前到 (c)[字符]\n- `Fc` 回到 (c)[字符]\n- `tc` 向前到 (c)[字符]\
  \ 之前\n- `Tc` 回到 (c)[字符] 之前\n- `H` 屏幕顶部\n- `M` 屏幕中间\n- `L` 屏幕底部\n- `%` 移动到关联的 `(\
  \ )`, `{ }`, `[ ]`\n\n### 删除文本\n这些命令用于删除屏幕和文档上的文本。你必须在命令模式下使用这些功能。\n\n- `x` 删除光标右侧字符\n\
  - `X` 删除光标左侧字符\n- `D` 删除到行尾的所有字符\n- `dd` 删除当前行\n- `:d` 删除当前行\n\n### 修改文本\n这些命令用于修改屏幕和文档上的文本。你必须在命令模式下使用这些功能。\n\
  \n- `C` 修改到行尾\n- `cc` 修改整行\n\n**提示：** `cw` 修改一个单词。\n\n### 复制文本 (Yanking)\n将此命令视为\
  \ GUI 中对应的 COPY 功能。你必须在命令模式下使用这些功能。\n\n- `yy` 复制当前行\n- `:y` 复制当前行\n\n**提示：** `y$`\
  \ 复制到行尾。\n\n### 粘贴文本（在复制文本后使用）\n将此命令视为 GUI 中对应的 PASTE 功能。你必须在命令模式下使用这些功能。\n\n- `p`\
  \ 在位置或行之后粘贴文本\n- `P` 在位置或行之前粘贴文本\n\n### 提示\n在使用删除、修改、复制或粘贴命令之前，可以指定命名寄存器。你可以在任何这些命令前缀加上任何小写字母，例如，如果你按下\
  \ `adw`（这会删除一个单词然后将其放入缓冲区 'a' 中）。现在，任何时候按下 `ap`，它都会贴回被修改的文本。\n\n几乎每个命令前面都可以跟一个数字，指定你想要重复的次数。例如，`5dw`\
  \ 将删除 5 个单词，`3fe` 将光标向前移动到字母 e 的第 3 次出现处。插入也可以重复。\n\n### 命名标记 (Named Markers)\n\
  可以在文件的任意行设置命名标记。标记名称可以是任何小写字母（'c' 代表你选择的命名标记）。标记也可以用作范围的限制。\n\n- `mc` 在当前行设置标记 (c)\n\
  - `` `c `` 移动到标记 (c) 行的开头\n- `'c` 移动到标记 (c) 行的非空字符\n\n## 搜索文本\n这些命令用于对屏幕和文档上的文本进行基础搜索。你必须在命令模式下使用这些功能。\n\
  \n- `/str` 向前搜索 (字符串)\n- `?str` 向后搜索 (字符串)\n- `n` 字符串的下一个实例（正向方向）。\n- `N` 字符串的上一个实例（反向方向）。\n\
  \n### 搜索与替换 (字符串)\n这些命令用于对屏幕和文档上的文本进行搜索和替换。\n\n- `:s/pattern/string/flags` 根据标志将模式替换为搜索字符串\n\
  - `c` 标志 - 确认模式的每次替换。\n- `g` 标志 - 全局替换模式的所有出现处。\n- `&` 重复上 `:s` 命令\n\n## 正则表达式\n\
  这些是一些基础正则表达式命令，可以增强你在正在工作的文档中搜索非常特定的文本模式的能力。\n\n- `.` 任意单个字符（换行符除外）\n- `*` 任意字符零次或多次出现\n\
  - `[...]` 集中指定的任意字符\n- `[^...]` 不在集合中的任意字符\n- `^` 行首（锚点）\n- `$` 行尾（锚点）\n- `\\(...\\\
  )` 分组 - 通常用于对条件分组\n- `\\<` 单词开头（锚点）\n- `\\>` 单词结束（锚点）\n- `\\n` 第 (n) 个分组的内容\n\n\
  ### 示例：集合 [...] (中)\n集合是正则表达式功能的扩展，可用于精细搜索文本。例如，可以创建一个代表所有大写字母 A 到 Z 的集合（即 `[A-Z]`）。可以创建一个代表所有小写字母\
  \ a 到 z 的集合（即 `[a-z]`）。可以创建一个代表所有大写和小写字母 A 到 Z 和 a 到 z 的集合（即 `[A-Za-z]`）。\n\n- `[A-Z]`\
  \ 包含大写字母 A 到 Z\n- `[a-z]` 包含小写字母 a 到 z\n- `[0-9]` 包含数字 0 到 9\n- `[./=+]` 包含 . (点)、/\
  \ (斜杠)、= 和 +\n- `[-A-N]` 包含大写字母 A 到 N 和连字符\n- `[0-9 A-Z]` 包含所有大写字母、数字和空格\n- `[A-Z][a-zA-Z]`\
  \ 第一位置包含字母，第二位置包含任意字母\n\n### 示例：正则表达式 (高级)\n这些是一些高级的正则表达式命令，可以增强你在正在工作的文档中搜索非常特定的文本模式的能力。你必须在命令模式下使用这些功能。例如，按下\
  \ `ESC` 键然后输入 `/HelloWorld/` 以匹配包含 HelloWorld 的行。\n\n**注意：** 正则表达式区分大小写。\n\n- `/HelloWorld/`\
  \ 匹配包含 HelloWorld 的行\n- `/^HelloWorld$/` 匹配仅包含 HelloWorld 的行\n- `/^[a-zA-Z]/` 匹配以任意字母开行的\n\
  \n\n\n\n\n`/^[a-z].*/` 匹配以 a-z 开头的行，后面至少跟一个字符。\n`/1234$/` 匹配以 1234 结尾的行\n`/\\(43|76\\\
  )/` 匹配包含 43 或 76 的行。\n\n注意：\n使用 `()` 和管道符号 `|` 表示“或”条件。\n\n`/[0-9]*/` 匹配行中的零或多个数字。\n\
  `/^[^#]/` 如果行的第一个字符不是 `#`，则匹配成功。\n\n## 范围 (Ranges)\n\n范围允许在一行或多行上执行操作。你必须在命令模式下使用这些功能。例如，按下\
  \ ESC 键然后输入 `:3,7d` 可以删除第 3 到 7 行。\n\n`:$` 最后一行\n`:%` 文件中的所有行\n`:.` 当前行\n`:n,m`\
  \ 第 n 到 m 行\n\n注意：\n范围可以与 `:s` 命令结合，以对几行执行替换。例如，`:.,$s/pattern/string/g` 将从当前行到文件末尾的模式替换为字符串。\n\
  \n## 文件命令 (Files commands)\n\n这些是一些用于将数据读入编辑器以及写出文件的命令。你必须在命令模式下使用这些功能。例如，按下 ESC\
  \ 键然后输入 `:r file_name` 在当前行之后读取一个文件到编辑器。\n\n`:e fileEdit` 新文件\n`:n` 进入下一个文件\n`:p`\
  \ 回到上一个文件\n`:r !cmd` 将程序的输出读取到当前行之后。\n`:r file` 将文件读取到当前行之后。\n`:w >>file` 追加文件（若未命名则为当前文件）\n\
  `:w file` 写入文件（若未命名则为当前文件）\n\n## 杂命令 (Miscellaneous commands)\n\n这些是一些用于在程序中执行各种杂杂命令。你必须在命令模式下使用这些功能。例如，按下\
  \ ESC 键然后输入 `u` 撤销上次更改。\n\n`~` 切换大小写。\n`.` 重复上一次修改文本的命令。\n`J` 合并行\n`nJ` 将后续 `(n)`\
  \ 行合并；\n`Om` 将下一行的开头连接到当前行的末尾。\n`u` 撤销上次更改。\n`U` 撤销该行的所有更改。\n`;` 重复上一次 `f` `F` `t`\
  \ 或 `T` 搜索命令。\n\n## Shell 函数 (Shell Functions)\n\n这些是一些 shell 命令用于从其他程序引入数据并在文本编辑器中进行管理。你必须在命令模式下使用这些功能。例如，按下\
  \ ESC 键然后输入 `!! ps -aux` 执行一个 shell 命令，并将命令输出放在当前行。\n\n`:! cmd` 执行 shell 命令\n\n\
  注意：\n添加这些特殊字符来表示 `:%` 当前文件名 `#` 上一次编辑的文件名。\n`!! cmd` 执行 shell 命令，并将命令输出放在当前行\n`:!!`\
  \ 执行上一次 shell 命令\n`:r! cmd` 插入命令的输出\n`:f file` 重命名当前文件\n`:w !cmd` 将当前编辑的文件作为 STDIN\
  \ 发送给命令并执行。\n`:cd dir` 切换工作目录。\n`:sh` 启动子 shell（CTRL+D 返回编辑器）\n`:so file` 读取并执行文件中的命令（文件为\
  \ shell 脚本）\n`!}sort` 从当前位置到段落末尾排序并替换文本。\n\n## 设置命令 (Settings commands)\n\n以下命令允许你配置\
  \ `vi(m)` 设置。这些命令允许你启用或禁用 `vi(m)` 中的功能，或更改其工作方式。\n\n你必须在命令模式下使用这些功能。例如，按下 ESC 键然后输入\
  \ `set all` 在屏幕上显示所有 `set` 选项。\n\n列表并不完整，但它提供了你可以使用这些功能执行的一些示例。\n\n`:set all` 在屏幕上显示所有选项。\n\
  `:set ai` 开启自动缩进。（默认：`noai`）\n`:set list` 显示制表符 (`^l`) 和行尾 (`$`）。默认：`nolist`）\n\
  `:set nu` 显示行号。（默认：`nonu`）\n`:set sm` 输入 `}` 时显示匹配的 `{` 或 `(`。（默认：`nosm`）\n`:set\
  \ wm=n` 设置右边界自动换行的 `(n)` 个空格。（默认：`wm = 0`）\n\n注意：\n`SET` 命令可以放入 `.exrc` 文件中在 VI\
  \ 启动时自动配置设置。\n\n# Linux 单行命令 (Linux One-Liners)\n\n概述：本章包含一组中级命令/单行命令。本章中的命令比之前的章节更高级。它们可以执行更底层的功能，或者需要更多知识才能利用。\n\
  \n本章还引入了命令单行（one-liners）的概念，这对于更高级的应用、系统和设备操作非常有用。\n\n注意：\n某些命令和工具可能不是默认发行版的一部分，可能需要安装这些应用程序才能使用。\n\
  \n## 命令与函数 (Commands and Functions)\n\nBASH 允许你使用特殊的分隔符将相似的命令组合成一行。某些命令将按顺序执行，而另一些在一个命令失败或成功时会有不同的结果。这完全取决于所使用的分隔符。\n\
  \n下面的示例展示了可以使用不同类型的分隔符来控制命令的执行顺序。\n\n在单行中运行多个命令（用分号 `;` 分隔），例如：\n\n```\ncommand_1;\
  \ command_2; command_3\n```\n\n只有在第一个命令成功时才运行下一个命令，例如：\n\n```bash\ncommand_1 &&\
  \ command_2\n```\n\n只有在第一个命令失败时才运行下一个命令，例如：\n\n```bash\ncommand_1 || command_2\n\
  ```\n\n要自动回答提示，可以通过管道输入响应。例如（将字母 'y' 发送命令或脚本）：\n\n```bash\ny | some_command\n```\n\
  \n通过在函数内部组合其他命令可以轻松创建自定义命令。要调用该函数，只需输入其名称并传递参数即可。\n\n在下面的示例中，通过输入第一行来创建函数，然后输入函数名来执行它（即\
  \ red、green 或 blue）并输入你想显示的文本。\n\n注意：\n这些函数可以放在脚本中，也可以从命令行利用。这些函数仅在 shell 激活并存在内存中时才会存在，除非它们被添加到\
  \ `~/.bashrc` 文件中。\n\n```bash\nfunction blue() { echo -e \"\\x1b[34m\\x1b[1m\"$@\"\
  \\x1b[0m\"; }\n```\n示例：`blue this is a test`\n\n```bash\nfunction green() { echo\
  \ -e \"\\x1b[32m\\x1b[1m\"$@\"\\x1b[0m\"; }\n```\n示例：`green this is a test`\n\n\
  ```bash\nfunction red() { echo -e \"\\x1b[31m\\x1b[1m\"$@\"\\x1b[0m\"; }\n```\n\
  示例：`red this is a test`\n\n`$@` 是一个伪变量，包含传递给函数的参数。\n\n## 单行命令 (One-Liners)\n\n单行命令是相关命令、参数和值的有用组合，合并为一行。这些单行命令可以在日常操作中执行特定任务。\n\
  \n记住：\nLinux 命令通常设计用于执行一个功能（核心设计哲学）。这意味着你不会看到设计用于执行多个功能的命令，但它有很多选项。\n\n### 系统命令\
  \ (System commands)\n\n这些单行命令用于执行不同的系统操作和功能。例如创建命令别名、监控进程等。\n\n当你输入 `path` 时，它会扩展\
  \ `PATH` 变量，并通过每行显示一个项目使其更容易阅读，输入：\n\n```bash\nalias path='echo -e ${PATH//:/n}'\n\
  ```\n\n生成一个长度为 20（如果你想更大或更小请更改大小）字符（仅限字母 [a-z, A-Z, 0-9]）的随机密码，输入：\n\n```bash\n\
  tr -cd '[:alnum:]' < /dev/urandom | fold -w20 | head -n1\n```\n\n对于更复杂的（即带有特殊字符）随机密码生成器，输入：\n\
  \n```bash\ntr -cd '[:graph:]' < /dev/urandom | fold -w20 | head -n1\n```\n\n提示：\n\
  此命令将生成 10 个密码。调整命令以增加生成的密码数量、复杂度水平或长度（修改加粗文本）。\n\n```bash\nfor i in {1..10}; do\
  \ tr -cd '[:alnum:]' < /dev/urandom | fold -w20 | head -n1; done\n```\n\n定义一个简单的计算器函数，输入：\n\
  \n```bash\n? () { echo \"$*\" | bc -l; }\n```\n\n示例：`? 4*4+5`\n\n```text\n（当你输入\
  \ `?` 时，它将方程传递给函数）\n\n在终端窗口右上角放置系统时间，输入：\n\n\n\n\n\n```bash\nwhile sleep 1;do tput\
  \ sc;tput cup 0 $(($(tput cols)-29));date;tput rc;done &\n```\n\n在终端窗口右上角显示系统信息和当前时间，输入：\n\
  \n```bash\nwhile true; do tput sc; tput cup 0 $(($(tput cols)-74)); w | grep load;\
  \ tput rc; sleep 10; done &\n```\n\n为命令创建别名，输入：\n\n```bash\nalias ai='sudo apt-get\
  \ install'\n```\n\n-或者-\n\n```bash\nalias au='sudo apt-get update'\n```\n\n### 注意事项\n\
  \n要执行这些别名来安装新包，输入：\n\n```bash\nai package_name\n```\n\n执行第二个别名来更新包，输入：\n\n```bash\n\
  au\n```\n\n删除任何别名，输入：\n\n```bash\nunalias alias_name\n```\n\n### 提示\n\n查看终端中设置的所有别名，输入：\n\
  \n```bash\nalias\n```\n\n查看由你运行的所有进程，输入：\n\n```bash\nps -aux | grep -v `whoami`\n\
  ```\n\n列出所有消耗 CPU 时间的进程，输入：\n\n```bash\nps -aux --sort=-%cpu | grep -m 11 -v `whoami`\n\
  ```\n\n显示文件内部的一段文本，输入：\n\n```bash\nsed -n /start_pattern/,/start_pattern/p input_file.txt\n\
  ```\n\n学习一个随机的 Linux 命令，输入：\n\n```bash\nman $(ls /bin | shuf | head -1)\n```\n\n\
  为 man page（帮助页）创建 pdf 版本，输入：\n\n```bash\nman -t regex | ps2pdf -- output_file.pdf\n\
  ```\n\n将命令输出转换为图形，输入：\n\n```bash\nifconfig | convert label:@- output_file.png\n\
  ```\n\n另一个将命令输出转换为图形的示例，输入：\n\n```bash\nuname -a | convert label:@- output_file.png\n\
  ```\n\n显示 BASH 中所有可用的键盘绑定，输入：\n\n```bash\nbind -P | grep -v \"is not\" | sed -e\
  \ 's/can be found on/:/' | column -s: -t\n```\n\n一个健壮、模块化的日志着色器，让读取日志文件变得更容易，输入：\n\
  \n```bash\ntail /var/log/syslog | ccze -A\n```\n\n也可以将文件导出为 HTML，输入：\n\n```bash\n\
  cat /var/log/syslog | ccze -h > ~/Desktop/syslog.html\n```\n\n### 注意事项\n\n`ccze`\
  \ 拥有 `apm`、`exim`、`fetchmail`、`httpd` 等插件。查看可用插件列表，输入 `ccze -l`。\n\n## 文件系统\n\n\
  这些单行命令用于执行文件系统级的操作和功能。例如，查找和管理文件、管理文件权限等。\n\n#### 在特定日期范围内查找文件，输入：\n\n```bash\n\
  find . -type f -newermt \"2025-01-01\" ! -newermt \"2025-12-31\"\n```\n\n#### 删除目录中不符合特定文件扩展名的文件，输入：\n\
  \n```bash\nrm !(*.html | *.php | *.png)\n```\n\n#### 递归删除当前路径下的所有空目录，输入：\n\n```bash\n\
  find . -type d -empty -delete\n```\n\n#### 显示目录消耗了多少存储空间（高级），输入：\n\n```bash\ndu\
  \ -kx | egrep -v \"\\./.+/\" | sort -n\n```\n\n#### 查看占用所有本地存储空间的前六个文件，输入：\n\n```bash\n\
  du -hsx /* | sort -rh | head -6\n```\n\n#### 查找特定大小的文件，输入：\n\n```bash\nfind . -type\
  \ f -size 10M\n```\n\n#### 修改特定特定文件的权限，输入：\n\n```bash\nfind /path/to/directory/\
  \ -type f -exec chmod 644 {} \\;\n```\n\n### 提示\n\n重置目录权限\n\n```bash\nfind . -type\
  \ d -exec chmod 0755 {} \\;\n```\n\n#### 对目录中的每个文件执行命令\n\n```bash\nfor x in `ls\
  \ -1`; do echo $x; done\n```\n\n#### 在特定路径下创建多个文件夹，输入：\n\n```bash\nmkdir -p new_folder/{folder_1,folder_2,folder_3,folder_4}\n\
  ```\n\n#### 将文件复制到多个目录，输入：\n\n```bash\necho /path/to/directory1/  /path/to/directory2/\
  \  /path/to/directory3/ | xargs -n 1 cp /path/to/file_name.ext\n```\n\n#### 统计目录中的文件数量，输入：\n\
  \n```bash\nls -l /bin | grep -v ^c | wc -l\n```\n\n#### 查看系统（或特定目录）上的所有文件，输入：\n\n\
  ```bash\nfind /bin -type f | less\n```\n\n#### 逐页查看系统（或特定目录）上的所有目录，输入：\n\n```bash\n\
  find / -type d | less\n```\n\n#### 创建任意大小的文件，输入：\n\n```bash\ndd if=/dev/zero of=output_file.txt\
  \ bs=1M count=10\n```\n\n#### 列出仅在今天更改的文件，输入：\n\n```bash\nls -al --time-style=+%D\
  \ | grep `date +%D`\n```\n\n#### 在配置文件中显示非空行（同时也删除了注释行）\n\n```bash\ngrep '^[^#]'\
  \ /etc/syslog.conf\n```\n\n#### 创建压缩归包（即 TAR 文件），输入：\n\n```bash\ntar -czvf file_name.tar.gz\
  \  /path/to/directory/\n```\n\n#### 解压归包，输入：\n\n```bash\ntar -xzvf file_name.tar.gz\n\
  ```\n\n#### 快速移动并重命名带后缀的文件，输入：\n\n```bash\ncp /path/to/directory/Really_Long_File_Name.cpp{,-old}\n\
  ```\n\n### 注意事项\n\n此命令将生成一个新的副本：`/path/to/directory/Really_Long_File_Name.cpp-old`\n\
  \n#### 使用 `pushd` 和 `popd` 将你的路径视为数组，输入：\n\n```bash\ncd /directory1/directory2/directory3;\
  \ pushd .; cd /bin; popd\n```\n\n### 注意事项\n\n`pushd` 存储最后一个目录路径，`popd` 允许你以后返回。\n\
  \n#### 比较两个目录并显示差异，输入：\n\n```bash\ncomm -3 <(ls directory1) <(ls directory2)\n```\n\
  \n### 注意事项\n\n将参数从 `-3` 改为 `-2` 或 `-1` 或完全删除它以控制列的抑制。\n\n#### 同步两个文件目录，输入：\n\n```bash\n\
  rsync -avzh /directory1 /directory2\n```\n\n#### 杀死锁定文件的进程，输入：\n\n```bash\nfuser\
  \ -k file_name.ext\n```\n\n#### 将 .ISO 文件挂载为 CD，输入：\n\n```bash\nsudo mount /path/to/file_name.iso\
  \ /mnt/cdrom -oloop\n```\n\n### 处理文本文件\n\n这些命令用于处理文件内部的文本内容。这些命令允许你提取数据或更改其格式。\n\
  \n#### 从 input_file 输出第 1 和第 3 列并输出到 output_file，输入：\n\n```bash\nawk '{print $1,\
  \ $3}' input_file > output_file\n```\n\n### 提示\n\n`col1` .. `col9` 是使用 `awk` 和 `print`\
  \ 命令的简单替代方案。`col1` 一个分割并打印指定列的简单脚本。`col2-col9` 是 `col1` 的符号链接；其行为根据使用的名称变化。\n\n\
  例 1a: `mount | awk '{print $3}'`\n\n例 1b (等效): `mount | col3`\n\n例 2a: `cat /etc/passwd\
  \ | awk -F\":\" '{print $7}'`\n\n例 2b (等效): `cat /etc/passwd | col7 :`\n\n#### 从\
  \ input_file 输出第 8 列到第 15 列的字符并输出到 output_file，输入：\n\n```bash\ncut -c 8-15 input_file\
  \ > output_file\n```\n\n#### 替换 input_file 中的字符串并输出到 output_file，输入：\n\n```bash\n\
  sed \"s/search_word1/search_word2/g\" input_file > output_file\n```\n\n#### 将任意字符替换为另一个字符，输入：\n\
  \n```bash\ncat input_file | tr '[:space:]'\\t' > output_file\n```\n\n#### 列格式输出文本，输入：\n\
  \n```bash\nsudo cat /etc/passwd | column -t\n```\n\n#### 将内容转换为大写，输入：\n\n```bash\n\
  cat input_file.txt | tr a-z A-Z > output_file\n```\n\n#### 显示所有不同数据的计数，输入：\n\n```bash\n\
  history | awk '{ print $2 }' | sort | uniq -c | sort -rn\n```\n\n#### 过滤（移除不可见字符）文件内容，输入：\n\
  \n```bash\nwhile IFS= read -r line; do echo \"$line\"; done < input_file.txt > output_file\n\
  ```\n\n### 注意事项\n\n将 `somefile.txt` 替换为你想要过滤的文件。\n\n## 网络\n\n这些单行命令用于执行网络级的操作和功能。例如，共享文件、监控连接等。\n\
  \n#### 统计每个主机的连接数，输入：\n\n```bash\nnetstat -an | grep ESTABLISHED | awk '{print $5}'\
  \ | awk -F: '{print $1}' | sort | uniq -c\n```\n\n#### 通过 HTTP 端口 80 共享文件，输入：\n\n\
  ```bash\nsudo nc -v -l 80 < file_name.ext\n```\n\n### 注意事项\n\n打开共享机器本地 IP 地址。测试此功能，输入：\n\
  \n```bash\n127.0.0.1\n```\n\n-或者-\n\nLocalHost\n\n#### 查询域名和所有者信息，输入：\n\n```bash\n\
  whois example.com\n```\n\n安装该命令，输入：\n\n```bash\nsudo apt-get install whois\n```\n\
  \n-或者-\n\nsudo yum install whois\n\n#### 下载整个网站，输入：\n\n```bash\nwget --random-wait\
  \ -r -p -e robots=off -U mozilla http://www.example.com\n```\n\n#### 搜索并过滤网络包，输入：\n\
  \n```bash\nngrep -O network_capture.pcap -q 'HTTP'\n```\n\n安装该命令，输入：\n\n```bash\n\
  sudo apt-get install ngrep\n```\n\n-或者-\n\nsudo yum install ngrep\n\n#### 从特定的 ETH1\
  \ 接口为 Wireshark 捕捉流量，输入：\n\n```bash\ntcpdump -i eth1 -s0 -v -w /tmp/capture.pcap\n\
  ```\n\n#### 显示系统上的所有本地用户，输入：\n\n```bash\nlslogins\n```\n\n-或者-\n\nlslogins user_name\n\
  \n#### 从一个位置备份文件到另一个位置，输入：\n\n```bash\nrsync -vare ssh user@192.168.0.100:/path/to/director/*\
  \ /home/user/backup/\n```\n\n\n\n\n\n测试远程端口以检查其是否打开，输入：\n\n```\ncurl -s example.com:80\
  \ >/dev/null && echo Success. || echo Fail.\n```\n\n更高级的版本，输入（根据需要替换 IP 和 PORT 参数）：\n\
  \n```bash\nIP=\"example.com\" ; PORT=\"80\" ; curl -s \"$IP:$PORT\" > /dev/null\
  \ && echo \"Success connecting to $IP on port $PORT.\" || echo \"Failed to connect\
  \ to $IP on port $PORT.\"\n```\n\n上一个单行命令示例的另一个版本，输入：\n\n```bash\ntimeout 1 bash\
  \ -c \"</dev/tcp/example.com/80\" && echo Port open || echo Port closed\n```\n\n\
  更简单的版本，输入：\n\n```bash\nnc -vz example.com 80\n```\n\n-或-\n\n```bash\ntelnet example.com\
  \ 80\n```\n\n显示你的外部 IP 地址，输入：\n\n```bash\ndig +short myip.opendns.com @resolver1.opendns.com\n\
  ```\n\n无论网络接口如何，均显示本地 IP 地址，输入：\n\n```bash\nifconfig | sed '/inet/!d;/127.0/d;/dr:\\\
  s/d;s/^.*:\\(.*\\)B.*$/\\1/'\n```\n\n显示实时无线信号信息，输入：\n\n```bash\nwatch -n 1 cat /proc/net/wireless\n\
  ```\n\n显示正在使用网络连接的应用程序，输入：\n\n```bash\nss -p\n```\n\n发现哪个程序在使用特定端口，输入：\n\n```bash\n\
  lsof -i tcp:443\n```\n\n# 高级命令\n\n### 概述\n本章包含了一组高级命令和单行命令。这些单行命令比上一章中的命令更高级。它们可以执行更底层的功能，或者需要更多知识才能使用。\n\
  \n为了组织内容，本章被分为不同的部分（例如系统命令、文件系统、网络等），以便更容易查找和理解。\n\n**注意：**\n某些命令和实用程序可能不是你默认发行版的一部分，可能需要安装这些应用程序才能使用它们。\n\
  \n## 系统命令\n\n本节列出的这些系统命令和工具用于执行高级系统功能和操作。例如，管理系统时间、进程、软件包等。\n\n同步时钟，输入：\n\n```bash\n\
  sudo ntpdate -s us.pool.ntp.org\n```\n\n在多个 Linux 服务器上运行相同的命令，输入：\n\n```bash\nfor\
  \ in $i(cat list.txt); do ssh user@$i 'bash command'; done\n```\n\n**注意：**\n此示例要求你创建一个名为\
  \ `list.txt` 的文件，其中包含你想对其执行命令的服务器名称。\n\n查看硬件时钟的时间，输入：\n\n```bash\nsudo hwclock\n\
  ```\n\n设置时间，输入：\n\n```bash\nsudo hwclock --set --date=\"02/20/2020 20:20:00\"\n\
  ```\n\n查看所有运行中的进程（实时更新），输入：\n\n```bash\ntop\n```\n\n对于更健壮的进程管理器，输入：\n\n```bash\n\
  htop\n```\n\n安装该命令，输入：\n\n```bash\nsudo apt-get install htop\n```\n\n-或-\n\n```bash\n\
  sudo yum install htop\n```\n\n`multitail` 同时监控多个日志文件，还支持文本高亮、过滤和许多其他功能。例如，输入：\n\n\
  ```bash\nmultitail /var/log_file1.log /var/log_file2.log\n```\n\n安装该命令，输入：\n\n```bash\n\
  sudo apt-get install multitail\n```\n\n-或-\n\n```bash\nsudo yum install multitail\n\
  ```\n\n![](img/00007.jpeg)\n\n### MULTITAIL 示例（显示两个日志文件）\n\n监控任何工具的输出（命令定期刷新输出），输入：\n\
  \n```bash\nwatch df\n```\n\n用于监控大文件的类似命令，输入：\n\n```bash\nwhile ls -la file_name;\
  \ do sleep 5; done\n```\n\n在后台运行任何程序并关闭你的 shell，输入：\n\n```bash\nnohup wget example.com/file_name.zip\n\
  ```\n\n**注意：**\n将在同一目录下生成一个名为 `nohup.out` 的文件，该文件包含运行程序的输出。\n\n`xargs` 允许你将一个命令的输出传递给另一个命令作为参数，输入：\n\
  \n```bash\nfind . -name \"*.log\" -type f -print | xargs tar -cvzf logs.tar.gz\n\
  ```\n\n示例：在 `WGET` 命令末尾附加 URL 列表，输入：\n\n```bash\ncat links.txt | xargs wget\n```\n\
  \n**注意：**\n此示例要求你创建一个名为 `links.txt` 的文件，其中包含你想对其执行命令的 URL 列表。\n\n列出系统中安装的所有 Debian\
  \ 软件包，输入：\n\n```bash\ndpkg --get-selections > debian_list.txt\n```\n\n在另一个系统上重装这些\
  \ Debian 软件包，输入：\n\n```bash\ndpkg --set-selections < debian_list.txt\n```\n\n**注意：**\n\
  来自 `/etc` 目录的配置文件可能需要复制到新系统，以便这些软件包能够正常工作。\n\n`~/.bashrc` 是一个 `BASH` 在初始化终端 shell\
  \ 会话时运行的 shell 脚本。你可以在此文件中放置任何自定义的命令或函数，以便当你通过本地终端或远程会话登录时可以使用它们。\n\n将以下命令添加到 `~/.bashrc`\
  \ 以帮助自动修复文件或路径名称错误，输入：\n\n```bash\nshopt -s cdspell\n```\n\n**提示：**\n将以下命令添加到 `~/.bashrc`\
  \ 中为 `LESS/MAN` 页面添加颜色，输入：\n\n```bash\n# Adds color to the LESS/MAN pages\nexport\
  \ LESS_TERMCAP_mb=$'\\E[01;31m'\nexport LESS_TERMCAP_md=$'\\E[01;33m'\nexport LESS_TERMCAP_me=$'\\\
  E[0m'\nexport LESS_TERMCAP_se=$'\\E[0m'\nexport LESS_TERMCAP_so=$'\\E[01;42;30m'\n\
  export LESS_TERMCAP_ue=$'\\E[0m'\nexport LESS_TERMCAP_us=$'\\E[01;36m'\n```\n\n\
  通过分析命令历史查看你经常使用的前 10 个实用程序，输入：\n\n```bash\nhistory | awk 'BEGIN {FS=\"[ \\t]+|\\\
  \\|\"} {print $3}' | sort | uniq -c | sort -nr | head\n```\n\n**提示：**\n有一个类似的命令可以显示你今天使用某个命令的次数，输入：\n\
  \n```bash\nhash\n```\n\n使自动补全不区分大小写（例如 'cd /BI(按 Tab)'→'cd /bin'），输入：\n\n```bash\n\
  echo 'set completion-ignore-case on' >> ~/.inputrc; echo 'set show-all-if-ambiguous\
  \ on' >> ~/.inputrc; echo 'set show-all-if-unmodified on' >> ~/.inputrc\n```\n\n\
  创建或修改 `~/.inputrc`。需要重启会话更改才会生效。\n\n显示 `BASH` 中可用 256 种颜色的数值值，输入：\n\n```bash\nfor((i=16;\
  \ i<256; i++)); do printf \"\\e[48;5;${i}m%03d\" $i; printf '\\e[0m'; [ ! $((($i\
  \ - 15) % 6)) -eq 0 ] -'; done\n```\n\n`screen` 命令可以复用多个终端，输入：\n\n```bash\nscreen\n\
  ```\n\n启动一个进程来测试应用程序，输入：\n\n```bash\nping localhost\n```\n\n按下 `Ctrl+A` 和 `?` 查看帮助，`Ctrl+A`\
  \ 和 `D` 分离（这将带回到原始终端）。\n\n查看后台运行的终端列表，输入：\n\n```bash\nscreen -ls\n```\n\n重新连接后台运行的终端，输入：\n\
  \n```bash\nscreen -r\n```\n\n完成后，输入 `exit` 返回原始终端。\n\n**注意：**\n此程序的功能比本简教程显示的更多。阅读文档获取更多信息。\n\
  \n`vmstat` 命令提供内存、交换分区使用、I/O 等待和系统活动的信息，输入：\n\n```bash\nvmstat 1 20\n```\n\n**注意：**\n\
  该命令对于诊断 I/O 问题非常有用。\n\n## 文件系统\n\n这些是更高级的单行命令，用于执行文件系统级操作。例如，测试存储性能、创建文件和目录逻辑快捷、管理文件等。\n\
  \n### 创建快捷方式（链接）\n\nLinux 中可以创建两种类型的快捷方式（简称链接），它们是硬链接和软链接。硬链接可以在同一卷创建文件和目录。软链接（又符号链接）可以在不同卷创建文件和目录。\n\
  \n硬链接是一个独立的文件，包含关于原始文件及其位置的信息，输入：\n\n```bash\ncp -l file_name1 file_name2\n```\n\
  \n**注意：**\n如果你删除原始文件，链接将防止文件被删除。如果你想删除文件，也必须移除硬链接。\n\n创建硬链接的替代命令，输入：\n\n```bash\n\
  ln file_name1 file_name2\n```\n\n如果你需要在不同的物理驱动上创建链接，你必须创建一个软链接，输入：\n\n```bash\n\
  cp -s file_name1 file_name2\n```\n\n\n\n\n\n如果你删除原始文件 `test.txt`，快捷方式 `test1.txt`\
  \ 也会被删除。\n\n输出显示 `test1.txt` 的链接，它是原始文件的快捷方式：`test.txt`：\n\n```\nlrwxrwxrwx 1 jane\
  \ root 11 May 20 12:23 test1.txt -> test.txt\n-rw-rw-rw- 1 jane root 1242 May 20\
  \ 12:19 test.txt\n```\n\n创建硬链接的替代命令，输入：\n\n```bash\nln -s file_name1 file_name2\n\
  ```\n\n`tree` 命令的替代方案，输入：\n\n```bash\nls -R | grep \":$\" | sed -e 's/:$//' -e 's/[^-][^\\\
  /]*\\//--/g' -e 's/^/ /' -e 's/-/|/'\n```\n\n扫描文件以检查其是否包含特定的字符串，输入：\n\n```bash\n\
  grep -Pri \"Search_Term\" /Path_to_Directory/*.log\n```\n\n### 提示\n开启 `grep` 自动着色，输入：\n\
  \n```bash\nalias grep=\"grep --color=auto\"\n```\n\n在当前目录下递归查找包含指定字符串的文件，输入：\n\n\
  ```bash\ngrep -H -r \"string\" ./*\n```\n\n### Midnight commander (MC)，让文件系统的导航变得更简单。\n\
  \n要安装该命令，输入：\n\n```bash\nsudo apt-get install mc\n```\n\n-或-\n\n```bash\nsudo yum\
  \ install mc\n```\n\n![](img/00008.jpeg)\n\n#### Midnight commander\n\n删除大文件（擦内容并留一个空文件），输入：\n\
  \n```bash\n> /path/to/large_file.log\n```\n\n如何修复因不小心将文件解压到错误目录而导致的混乱，输入：\n\n```bash\n\
  tar ztf /path/to/file_name.tar.gz | xargs -d'\\n' rm -v\n```\n\n查看路径的所有文件和子目录列表，输入：\n\
  \n```bash\ntree /home\n```\n\n要安装该命令，输入：\n\n```bash\nsudo apt-get install tree\n\
  ```\n\n-或-\n\n```bash\nsudo yum install tree\n```\n\n### 轻松地在 Windows 或 UNIX 格式之间转换文本文件。\n\
  \n使用 `awk` 将 Windows 文本文件转换为 UNIX，输入：\n\n```bash\nawk '{ sub(\"\\r$\", \"\"); print\
  \ }' windows_file.txt > unix_file.txt\n```\n\n使用 `awk` 将 UNIX 文本文件转换为 Windows，输入：\n\
  \n```bash\nawk 'sub(\"$\", \"\\r\")' unix_file.txt > windows_file.txt\n```\n\n`diff`\
  \ 工具可以比较两个命令的输出，而不创建临时文件：\n\n```bash\ndiff <(ls directory_name1) <(ls directory_name2)\n\
  ```\n\n创建一个函数，在当你输入 `cd` 时自动执行 `ls`（例如 `cd '/bin'`），输入：\n\n```bash\ncd() { builtin\
  \ cd -- \"$@\" && { [ \"$PS1\" = \"\" ] || ls -hrt --color; }; }\n```\n\n在屏幕顶部创建一个信息提示栏（Info\
  \ Bar），输入：\n\n```bash\nPS1='\\[\\e[s\\e[7m\\e[1;1H\\]\\w\\n\\t \\j / \\! / \\#\\\
  [\\e[u\\e[0m\\e[33;1m\\][\\u@\\h \\[\\e[34m\\]\\W]\\[\\e[0m\\]\\$ '\n```\n\n###\
  \ 提示\n增强 `clear` 命令以配合信息提示栏，输入：\n\n```bash\nalias clear='echo -e \"\\e[2J\\n\"'\n\
  ```\n\n查找系统中所有全用户可写的文件，输入：\n\n```bash\nfind / -type f -perm -o+w -exec ls -l {}\
  \ \\;\n```\n\n## 网络\n\n这些是更高级的单行命令和指令，用于执行网络操作和功能。例如，扫描机器远程端口、列出与远程机器的连接、设置临时文件服务器等。\n\
  \n`NMAP`：是一个非常多功能的网络扫描工具（更多信息请访问：[`nmap.org`](https://nmap.org)）\n\n要安装该命令，输入：\n\
  \n```bash\nsudo apt-get install nmap\n```\n\n-或-\n\n```bash\nsudo yum install nmap\n\
