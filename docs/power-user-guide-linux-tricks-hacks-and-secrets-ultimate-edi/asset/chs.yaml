  \ 备注：\n        - 与（或类似）`tty` 命令相关。\n        - 完整文档位于：[`www.gnu.org/software/coreutils/stty`](http://www.gnu.org/software/coreutils/stty)\n\
  \        - 这是一个 COREUTILS 命令。\n        - 类别：Shell\n\n-   `tic` 参数 `file_name`: terminfo\
