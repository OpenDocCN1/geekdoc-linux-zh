  \ 80\n```\n（下载网页源代码）\n\n在应用程序运行时分析日志文件，输入：\n\n```bash\ntail -f path_to_log | grep\
  \ search_term\n```\n\n服务器日志可以 `gzip` 压缩以节省本地存储空间，另见 'Z' 系列命令的替代方案（例如 `zless`、`zcat`、`zgrep`\
  \ 等）可以处理压缩的日志文件。\n\n`vnstat` 从任何配置的接口收集所需流量。\n\n要安装该命令，输入：\n\n```bash\nsudo apt-get\
  \ install vnstat\n```\n\n-或-\n\n```bash\nsudo yum install vnstat\n```\n\n### 注意\n\
  收集内核数据而非接口数据，对系统的负载更轻。\n\n列出处于监听（Listening）状态的开放网络端口，输入：\n\n```bash\nnetstat -lnp\n\
