  \ 类别：通信\n\n- `tftp domain_name_or_ip`: 向远程系统传输文件（不安全，且利用 UDP）。\n- 示例：`tftp example.com`\n\
  - 提示：\n    - 该客户端和服务程序套件有其用处，主要用于向设备传输网络固件更新。强烈建议尽可能避免使用它，因为它不安全且利用了 `UDP` 通信。\n\
  - 注意：\n    - 这是一个客户端和服务程序套件。\n    - 与 `ftp` 命令相关（或相似）。\n    - 类别：通信\n\n## 硬件/存储\n\
  \n以下是与管理（即添加、更新或删除）存储设备以及连接到本地系统的其他硬件（包括物理和虚拟）相关的命令列表。\n\n**注意：**\n取决于将要使用的命令或服务，可能需要\
  \ root 级权限才能执行。如果执行命令需要 root 权限，通常会在示例前加 `#` 符号（例如：`# command`）。\n\n- `addpart device_name\
  \ partition start length`: 向内核通知分区的存在。\n- 示例：`addpart /dev/sdc 1 2048 2097152`\n\
  - 注意：\n    - 与 `delpart`, `fdisk`, `parted`, `partprobe`, `partx` 命令相关（或相似）。\n \
  \   - 这是一个 `UTIL-LINUX` 命令。\n    - 类别：存储\n\n- `badblocks -s device_name`: 测试存储设备的坏块。\n\
  - 示例：`# badblocks /dev/sda2`\n- 注意：\n    - 与 `e2fsck` 命令相关（或相似）。\n    - 类别：文件系统/故障排除\n\
  \n- `biosdecode arguments`: BIOS 信息解码器。\n- 示例：`# biosdecode 2.7`\n- 注意：\n    - 与\
  \ `dmidecode` 命令相关（或相似）。\n    - 类别：系统\n\n- `blockdev arguments device_name`: 调用块设备\
  \ ioctls。\n- 示例显示扇区大小：\n```\n# blockdev --getss /dev/sda\n```\n- 注意：\n    - 这是一个\
  \ `UTIL-LINUX` 命令。\n    - 类别：存储\n\n- `blkid arguments device_name`: 显示块设备属性。\n-\
  \ 示例：`# blkid`\n- 注意：\n    - 与 `lsblk` 命令相关（或相似）。\n    - 这是一个 `UTIL-LINUX` 命令。\n\
  \    - 类别：存储\n\n- `blkdiscard arguments device_name`: 丢弃设备扇区的内容。\n- 示例：`# blkdiscard\
  \ --offset 17408 --length 1031168 /dev/sda`\n- 注意：\n    - 与 `fstrim` 命令相关（或相似）。\n\
  \    - 这是一个 `UTIL-LINUX` 命令。\n    - 类别：存储\n\n- `bootctl arguments`: 控制固件和引导加载程序设置。\n\
  - 示例：`bootctl --path=/boot/efi`\n- 注意：\n    - 类别：存储\n\n- `cfdisk arguments device_name`:\
  \ 显示或修改本地存储分区表。\n- 示例：`# cfdisk`\n- 注意：\n    - 如果不传递任何选项，该实用程序具有 `TUI`（文本用户界面）。\n\
  \    - 与 `fdisk`, `parted`, `sfdisk` 命令相关（或相似）。\n    - 这是一个 `UTIL-LINUX` 命令。\n \
  \   - 类别：存储\n\n- `chcpu arguments`: 管理多处理器系统中的 CPU。\n- 示例：`# chcpu -r`\n- 注意：\n\
  \    - 与 `lscpu` 命令相关（或相似）。\n    - 这是一个 `UTIL-LINUX` 命令。\n    - 类别：系统\n\n- `delpart\
  \ device_name partition`: 通知内核忘记某个指定分区。\n- 示例：`# delpart /dev/sdc 3`\n- 注意：\n  \
  \  - 与 `addpart`, `fdisk`, `parted`, `partprobe`, `partx` 命令相关（或相似）。\n    - 这是一个\
  \ `UTIL-LINUX` 命令。\n    - 类别：存储\n\n- `dmesg arguments`: 显示检测到的启动和硬件消息。\n- 示例显示最后\
  \ 15 行：\n```\ndmesg | tail -15\n```\n- 注意：\n    - 这是一个 `UTIL-LINUX` 命令。\n    - 类别：硬件/故障排除\n\
  \n- `dmidecode arguments`: 显示硬件 BIOS 信息。\n- 示例：`# dmidecode 2.11`\n- 注意：\n    -\
  \ 与 `biosdecode`, `ownership`, `vpddecode` 命令相关（或相似）。\n    - 类别：硬件/故障排除\n\n- `df\
  \ arguments`: 显示本地存储信息（使用率）。\n- 示例：`df -hPT | column -t`\n- 提示：\n    - 在检查系统上不同挂载点的存储占用时，这是你首先需要检查的工具之一。\n\
  - 注意：\n    - 与 `findmnt` 命令相关（或相似）。\n    - 完整文档请访问：[`www.gnu.org/software/coreutils/df`](http://www.gnu.org/software/coreutils/df)\n\
  \    - 这是一个 `COREUTILS` 命令。\n    - 类别：存储/维护\n\n- `du arguments`: 显示目录空间信息（使用率）。\n\
  - 示例：`du -h /home`\n- 提示：\n    - 当尝试隔离特定分区上的存储占用问题（例如大文件或大文件目录）时，这是你首先需要检查的工具之一。\n\
  - 注意：\n    - 与 `ls` 命令相关（或相似）。\n    - 完整文档请访问：[`www.gnu.org/software/coreutils/du`](http://www.gnu.org/software/coreutils/du)\n\
  \    - 这是一个 `COREUTILS` 命令。\n    - 类别：存储/维护\n\n- `fdisk arguments partition`: 显示本地存储设备和分区大小。\n\
  - 示例：`# fdisk -l`\n- 注意：\n    - 与 `addpart`, `delpart`, `parted`, `partprobe`, `partx`\
  \ 命令相关（或相似）。\n    - 这是一个 `UTIL-LINUX` 命令。\n    - 类别：存储\n\n- `findfs arguments label_UUID`:\
  \ 通过标签或 UUID（通用唯一标识符）搜索文件系统。\n- 示例：`# findfs LABEL=swap`\n- 注意：\n    - 与 `blkid`,\
  \ `lsblk`, `partx` 命令相关（或相似）。\n    - 这是一个 `UTIL-LINUX` 命令。\n    - 类别：存储\n\n- `findmnt\
  \ arguments device_name`: 显示本地设备上挂载的文件系统。\n- 示例：`findmnt --fstab -t nfs`\n- 提示：\n\
  \    - 这是 `df` 命令的树状版本，它显示了挂载点的层级关系。\n- 注意：\n    - 与 `du` 命令相关（或相似）。\n    - 这是一个\
  \ `UTIL-LINUX` 命令。\n    - 类别：存储/维护\n\n- `flock arguments file_name`: 在 shell 脚本或从控制台中管理文件锁。\n\
  - 示例：\n```\ntouch myfile.txt\n(\nflock -e 200\ncurl 'example.com/myfile.txt' -H\
  \ 'AnyHeader' > myfile.txt\n) 200< myfile.txt\n```\n- 更多示例：\n    - 示例 1：对目录 /tmp\
  \ 设置排斥锁，第二个命令将失败。\n```\nshell1> flock /tmp -c cat\nshell2> flock -w .007 /tmp -c\
  \ echo; /bin/echo $?\n```\n    - 示例 2：对目录 /tmp 设置共享锁，第二个命令将不会失败。尝试在第二个命令中获取排斥锁将失败。\n\
  ```\nshell1> flock -s /tmp -c cat\nshell2> flock -s -w .007 /tmp -c echo; /bin/echo\
  \ $?\n```\n    - 示例 3：在运行 echo 'a b c' 之前获取排斥锁 \"local-lock-file\"。\n\n\n\n\n\n\
  ```shell\nflock -x local-lock-file echo 'a b c'\n```\n**备注：**\n- 与 `lslocks` 命令相关（或类似命令）。\n\
  - 这是一个 `UTIL-LINUX` 命令。\n- 分类：进程\n\n---\n\n### fsck\n**参数**: 分析并修复存储设备上的 Linux 文件系统。\n\
  **示例：** \n```bash\nfsck /dev/sda6\n```\n**提示：**\n- 针对不同的文件系统有多个版本的 `fsck` 程序可用。要查看所有版本，请输入：`ls\
  \ -l /sbin/fsck.*`\n**备注：**\n- 这是一个 `UTIL-LINUX` 命令。\n- 分类：文件系统/故障排除\n\n### fsfreeze\n\
  **参数 mount_point**: 挂起（或恢复）对文件系统的访问。\n**示例：** \n```bash\nfsfreeze --freeze mountpoint\n\
  ```\n**备注：**\n- 与 `mount` 命令相关（或类似命令）。\n- 这是一个 `UTIL-LINUX` 命令。\n- 分类：系统\n\n###\
  \ fstrim\n**参数 mount_point**: 丢弃挂载文件系统中未使用的块。\n**示例：** \n```bash\nfstrim -a\n```\n\
  **提示：**\n- `fstrim` 用于挂载的文件系统，以丢弃文件系统未使用的（或“修剪”）的块。这对于固态硬盘（SSD）和精简置备存储非常有用。\n**备注：**\n\
  - 与 `mount` 命令相关（或类似命令）。\n- 这是一个 `UTIL-LINUX` 命令。\n- 分类：存储/维护\n\n### free\n**参数**:\
  \ 显示内存 RAM 和交换分区 Swap 的使用情况。\n**示例：** \n```bash\nfree -h\n```\n**备注：**\n- 相关信息：`cat\
  \ /proc/meminfo`\n- 分类：硬件/故障排除\n\n### hdparm\n**参数 device_name**: 显示存储设备的信息。\n**示例：**\
  \ \n```bash\nhdparm -tT /dev/sda2\n```\n**备注：**\n- 与 `dd` 命令相关（或类似命令）。\n- 分类：硬件/故障排除\n\
  \n### hwclock\n**参数**: 管理系统的硬件时钟。\n**示例：** \n```bash\nhwclock --set --date=\"02/20/2020\
  \ 20:20:00\"\n```\n**提示：**\n- 该命令具有许多管理硬件时钟的强大功能，包括调整时钟漂移等。\n**备注：**\n- 与 `date`\
  \ 命令相关（或类似命令）。\n- 这是一个 `UTIL-LINUX` 命令。\n- 分类：数学/时间\n\n### losetup\n**参数**: 管理循环设备。\n\
  **示例：** \n```bash\nlosetup -a\n```\n**提示：**\n- 循环设备是一种块设备，其数据块不映射到硬盘或光驱驱动器等物理设备，而是映射到文件系统中普通文件的块或另一个块设备。更多信息，请输入：`man\
  \ loop`\n**备注：**\n- 与 `date` 命令相关（或类似命令）。\n- 这是一个 `UTIL-LINUX` 命令。\n- 分类：系统\n\n\
  ### lsblk\n**参数 device_name**: 显示块设备的信息。\n**示例：** \n```bash\nlsblk -a\nlsblk -o\
  \ NAME,LABEL,UUID,MOUNTPOINT\n```\n**备注：**\n- 与 `blkid` 命令相关（或类似命令）。\n- 这是一个 `UTIL-LINUX`\
  \ 命令。\n- 分类：硬件/故障排除\n\n### lscpu\n**参数**: 显示 CPU 的技术信息。\n**示例：** \n```bash\nlscpu\
  \ -a\n```\n**备注：**\n- 相关信息：`cat /proc/cpuinfo`\n- 与 `lshal`, `lshw`, `lspci`, `lsusb`\
  \ 命令相关（或类似命令）。\n- 这是一个 `UTIL-LINUX` 命令。\n- 分类：硬件/故障排除\n\n### lshal\n**参数**: 列出硬件抽象层（HAL）设备数据库中所有已知设备。\n\
  **示例：** \n```bash\nlshal -t\n```\n**备注：**\n- 与 `lscpu`, `lshw`, `lspci`, `lsusb`\
  \ 命令相关（或类似命令）。\n- 分类：硬件/故障排除\n\n### lshw\n**参数**: 显示连接到本地系统的硬件详细信息。\n**示例：** \n\
  ```bash\nlshw -html > lshw.html\n```\n**提示：**\n- 此工具可以提取本地系统硬件配置（物理或虚拟）的详细信息。它报告内存配置、固件版本、主板配置、CPU\
  \ 信息（即版本和速度）、缓存配置、总线速度等。\n**更多示例：**\n- 以紧凑格式列出硬件：\n```bash\nlshw -short\n```\n-\
  \ 列出系统中的存储设备/控制器：\n```bash\nlshw -class disk -class storage\n```\n- 以 HTML 格式列出网络接口：\n\
  ```bash\nlshw -html -class network\n```\n- 不使用 DMI 检测硬件：\n```bash\nlshw -disable\
  \ dmi\n```\n**备注：**\n- 与 `lscpu`, `lshal`, `lspci`, `lsusb` 命令相关（或类似命令）。\n- 分类：硬件/故障排除\n\
  \n### lslocks\n**参数**: 显示操作系统当前持有的所有文件锁的信息。\n**示例：** \n```bash\nlslocks\n```\n**备注：**\n\
  - 相关信息：`cat /proc/locks`\n- 与 `flock` 命令相关（或类似命令）。\n- 这是一个 `UTIL-LINUX` 命令。\n- 分类：系统\n\
  \n### lspci\n**参数**: 显示系统上的 PCI 总线及其连接到其设备的信息。\n**示例：** \n```bash\nlspci -tv\n```\n\
  **备注：**\n- 与 `lscpu`, `lshal`, `lshw`, `lsusb` 命令相关（或类似命令）。\n- 分类：硬件/故障排除\n\n###\
  \ lsusb\n**参数**: 显示系统上的 USB 总线及其连接到其设备的信息。\n**示例：** \n```bash\nlsusb -tv\n```\n\
  **备注：**\n- 与 `lscpu`, `lshal`, `lshw`, `lspci` 命令相关（或类似命令）。\n- 分类：硬件/故障排除\n\n###\
  \ mkfs\n**参数 device_path**: 在本地存储分区上构建 Linux 文件系统。\n**示例：** \n```bash\nmkfs -t ext4\
  \ /dev/sda\n```\n**提示：**\n- 针对不同的文件系统有多个版本的 `mkfs` 程序可用。要查看所有版本，请输入：`ls -l /sbin/mkfs.*`\n\
  **备注：**\n- 与 `mkfs.bfs`, `mkfs.cramfs`, `mkfs.fat`, `mkfs.minix`, `mkfs.xfs` 命令相关（或类似命令）。\n\
  - 这是一个旧命令。\n- 这是一个 `UTIL-LINUX` 命令。\n- 分类：存储/维护\n\n### mkfs.bfs\n**参数 device_path**:\
  \ 创建 BFS 文件系统。\n**示例：** \n```bash\nmkfs.bfs /dev/sda\n```\n**备注：**\n- 与 `mkfs`,\
  \ `mkfs.cramfs`, `mkfs.fat`, `mkfs.minix`, `mkfs.xfs` 命令相关（或类似命令）。\n- 这是一个 `UTIL-LINUX`\
  \ 命令。\n- 分类：存储/维护\n\n### mkfs.cramfs\n**参数 device_path**: 创建压缩的 ROM 文件系统。\n**示例：**\
  \ \n```bash\nmkfs.cramfs /dev/sda\n```\n**备注：**\n- 与 `mkfs`, `mkfs.bfs`, `mkfs.fat`,\
  \ `mkfs.minix`, `mkfs.xfs` 命令相关（或类似命令）。\n- 这是一个 `UTIL-LINUX` 命令。\n- 分类：存储/维护\n\n\
  ### mkfs.fat\n**参数 device_path**: 创建 MS-DOS 文件系统。\n**示例：** \n```bash\nmkfs.fat /dev/sda\n\
  ```\n**备注：**\n- 与 `mkfs`, `mkfs.bfs`, `mkfs.cramfs`, `mkfs.minix`, `mkfs.xfs` 命令相关（或类似命令）。\n\
  - 分类：存储/维护\n\n### mkfs.minix\n**参数 device_path**: 创建 Minix 文件系统。\n**示例：** \n```bash\n\
  mkfs.minix /dev/sda\n```\n**备注：**\n- 与 `mkfs`, `mkfs.bfs`, `mkfs.cramfs`, `mkfs.fat`,\
  \ `mkfs.xfs` 命令相关（或类似命令）。\n- 这是一个 `UTIL-LINUX` 命令。\n- 分类：存储/维护\n\n### mkfs.xfs\n\
  **参数 device_path**: 创建 XFS 文件系统。\n**示例：** \n```bash\nmkfs.xfs /dev/sda\n```\n**备注：**\n\
  - 与 `mkfs`, `mkfs.bfs`, `mkfs.cramfs`, `mkfs.fat`, `mkfs.minix` 命令相关（或类似命令）。\n-\
  \ 分类：存储/维护\n\n### mt\n**参数**: 控制磁带驱动机操作。\n**示例：** \n```bash\nmt -f /dev/nst0 status\n\
  ```\n**备注：**\n- 与 `cpio` 命令相关（或类似命令）。\n- 分类：存储\n\n### ownership\n**参数**: Compaq\
  \ 所有权标签检索器\n**示例：** \n```bash\nownership\n```\n**备注：**\n- 与 `dmidecode` 命令相关（或类似命令）。\n\
  - 分类：硬件\n\n### parted\n**参数 device_name**: 用于本地存储的分区操作程序。\n**示例：** \n```bash\n(parted)\
  \ select /dev/sda\n```\n**提示：**\n\n\n\n\n\n- `parted` 支持多种分区表格式，包括 MS-DOS 和 GPT。它用于为新操作系统添加空间、重新组织磁盘使用以及将数据拷贝到新硬盘。\n\
  \  - 注意：\n    - 与 `addpart`, `delpart`, `fdisk`, `partprobe`, `partx` 命令相关（或类似命令）。\n\
  \    - 分类：存储/维护\n\n- `partprobe` 参数 `device_name`: 告诉操作系统分区表发生了变化。\n  - 示例：\n  \
  \  ```\n    # partprobe /dev/sda\n    ```\n  - 注意：\n    - 与 `addpart`, `delpart`,\
  \ `fdisk`, `parted`, `partx` 命令相关（或类似命令）。\n    - 分类：存储/维护\n\n- `partx` 参数 `device_name`:\
  \ 告诉内核磁盘上分区的存在和编号。\n  - 示例：\n    ```\n    # partx --show /dev/sdb3\n    ```\n  -\
  \ 注意：\n    - 与 `addpart`, `delpart`, `fdisk`, `parted`, `partprobe` 命令相关（或类似命令）。\n\
  \    - 这是一个 UTIL-LINUX 命令。\n    - 分类：存储/维护\n\n- `raw` 参数 `device_name`: 将 Linux\
  \ 原始字符设备绑定到块设备。\n  - 示例：\n    ```\n    # raw -qa\n    ```\n  - 注意：\n    - 这是一个 UTIL-LINUX\
  \ 命令。\n    - 分类：存储\n\n- `setleds` 参数：管理键盘上的 LED 灯设置。\n  - 示例：\n    ```\n    setleds\
  \ -D +num\n    ```\n  - 注意：\n    - 与 `loadkeys` 命令相关（或类似命令）。\n    - 分类：系统\n\n- `sfdisk`\
  \ 参数 `device_name`: 管理本地存储分区表。\n  - 示例：\n    ```\n    # sfdisk --dump /dev/sda >\
  \ sda.dump\n    ```\n  - 注意：\n    - 与 `fdisk`, `cfdisk`, `parted` 命令相关（或类似命令）。\n\
  \    - 这是一个 UTIL-LINUX 命令。\n    - 分类：存储/维护\n\n- `stat` 参数 `file_or_filesystem`:\
  \ 显示文件或文件系统的状态。\n  - 示例：\n    ```\n    stat /dev\n    ```\n  - 注意：\n    - 完整文档位于：[`www.gnu.org/software/coreutils/stat`](http://www.gnu.org/software/coreutils/stat)\n\
  \    - 这是一个 COREUTILS 命令。\n    - 分类：存储/维护\n\n- `sync` 参数 `file_name`: 将写入缓存同步到持久性存储。\n\
  \  - 示例：\n    ```\n    sync\n    ```\n  - 注意：\n    - 完整文档位于：[`www.gnu.org/software/coreutils/sync`](http://www.gnu.org/software/coreutils/sync)\n\
  \    - 这是一个 COREUTILS 命令。\n    - 分类：存储\n\n- `tapestat` 参数：报告磁带统计数据。\n  - 示例：\n \
  \   ```\n    tapestat -m\n    ```\n  - 注意：\n    - 与 `sar`, `mpstat`, `pidstat`,\
  \ `iostat`, `vmstat`, `nfsiostat` 命令相关（或类似命令）。\n  - 分类：存储\n\n- `vpddecode` 参数：VPD（产品数据）结构解码器。\n\
  \  - 示例：\n    ```\n    # vpddecode -u\n    ```\n  - 提示：\n    - `vpddecode` 显示在所有\
  \ IBM 和联想电脑中都可以找到的“产品数据”信息。\n  - 注意：\n    - 与 `dmidecode` 命令相关（或类似命令）。\n    - 分类：系统\n\
  \n- `wdctl` 参数 `device_name`: 显示看门狗状态。\n  - 示例：\n    ```\n    # wdctl -ITnr -f KEEPALIVE\
  \ -o STATUS\n    ```\n  - 注意：\n    - 这是一个 UTIL-LINUX 命令。\n    - 分类：系统\n\n- `wipefs`\
  \ 参数 `device_name`: 从设备上擦除签名。\n  - 示例：\n    ```\n    # wipefs /dev/sda\n    ```\n\
  \  - 警告：此命令将破坏\n  - 提示：\n    - `wipefs` 将从指定设备上擦除文件系统、raid 或分区表签名（魔数字符串），使这些签名对\
  \ `blkid` 不可见。`wipefs` 不会擦除文件本身或设备上的任何其他数据。当不带任何选项使用命令时，它会列出所有文件系统及其基础签名偏移量。\n \
  \ - 注意：\n    - 与 `blkid`, `findfs` 命令相关（或类似命令）。\n    - 这是一个 UTIL-LINUX 命令。\n   \
  \ - 分类：存储\n\n- `zramctl` 参数：管理 `zram` 设备。\n  - 示例：\n    ```\n    # zramctl --size\
  \ 1024M\n    ```\n  - 提示：\n    - `ZRAM` 设备是基于内存的块设备，名为 `/dev/zram<id>`（`<id>` =\
  \ 0, 1, ...）。写入这些磁盘的页存储在内存中。这些磁盘允许极快的 I/O。\n    - `zramctl` 用于设置 `ZRAM` 设备、重置 `ZRAM`\
  \ 设备以及查询已用 `ZRAM` 设备的状态。如果不提供选项，将显示所有 `ZRAM` 设备。\n  - 注意：\n    - 这是一个 UTIL-LINUX\
  \ 命令。\n    - 分类：存储\n\n### LVM (逻辑卷管理) 命令\n\n逻辑卷管理（或 LVM）允许你抽象多个不同存储设备的物理特性，使它们表现为单一块设备。这样就可以将大硬盘分区为较小的逻辑卷。LVM\
  \ 也用于克服传统存储分区的局限性。例如，LVM 卷可以扩展、跨多个设备跨、对分区创建快照并在硬盘间移动。\n欲更多信息，请输入：`man lvm`\n\n-\
  \ `lvchange` 参数 `volume_name`: 修改逻辑卷的属性。\n  - 示例：\n    ```\n    # lvchange -pr vg00/lvol1\n\
  \    ```\n  - 注意：\n    - 与 `lvm`, `lvcreate`, `vgchange` 命令相关（或类似命令）。\n    - 这是一个\
  \ LVM Tools 命令。\n    - 分类：存储\n\n- `lvconvert` 参数 `volume_name`: 将逻辑卷从线性转换为快照。\n\
  \  - 示例：\n    ```\n    # lvconvert -m1 vg00/lvol1\n    ```\n  - 更多示例：\n    - 将线性逻辑卷\
  \ `vg00/lvol1` 转换为双向镜像逻辑卷：\n      ```\n      # lvconvert -m1 vg00/lvol1\n      ```\n\
  \    - 将线性逻辑卷 `vg00/lvol1` 转换为双向 RAID1 逻辑卷：\n      ```\n      # lvconvert --type\
  \ raid1 -m1 vg00/lvol1\n      ```\n    - 将带有磁盘日志的镜像转换为带有内存日志的镜像：\n      ```\n  \
  \    # lvconvert --mirrorlog core vg00/lvol1\n      ```\n    - 将带有内存日志的镜像转换为带有磁盘日志的镜像：\n\
  \      ```\n      # lvconvert --mirrorlog disk vg00/lvol1\n      ```\n    - 将镜像逻辑卷转换为线性逻辑卷：\n\
  \      ```\n      # lvconvert -m0 vg00/lvol1\n      ```\n    - 将镜像逻辑卷转换为具有相同镜像数量的\
  \ RAID1 逻辑卷：\n      ```\n      # lvconvert --type raid1 vg00/mirror_lv\n      ```\n\
  \    - 将逻辑卷 `vg00/lvol2` 转换为逻辑卷 `vg00/lvol1` 的快照：\n      ```\n      # lvconvert\
  \ -s vg00/lvol1 vg00/lvol2\n      ```\n    - 将线性逻辑卷 `vg00/lvol1` 转换为双向镜像，使用物理分区\
  \ `/dev/sda:0-15` 和 `/dev/sdb:0-15` 进行分配：\n      ```\n      # lvconvert -m1 vg00/lvol1\
  \ /dev/sda:0-15 /dev/sdb:0-15\n      ```\n    - 将镜像逻辑卷 `vg00/lvmirror1` 转换为线性，释放物理扇区\
  \ `/dev/sda`：\n      ```\n    # lvconvert -m0 vg00/lvmirror1 /dev/sda\n      ```\n\
  \    - 将 `vg00/lvol1_snap` 合并到源卷：\n      ```\n      # lvconvert --merge vg00/lvol1_snap\n\
  \      ```\n  - 注意：\n    - 与 `lvm`, `vgcreate`, `lvremove` 命令相关（或类似命令）。\n    - 这是一个\
  \ LVM Tools 命令。\n    - 分类：存储\n\n- `lvcreate` 参数 `volumgroup_name`: 在现有卷组中创建逻辑卷。\n\
  \  - 示例：\n    在名为 `vg00` 的卷组创建一个具有 3 个条带、条带大小为 8KB 容量为 100MB 的条带逻辑卷。逻辑卷名称将由 `lvcreate`\
  \ 选择：\n    ```\n    # lvcreate -i 3 -I 8 -L 100M vg00\n    ```\n  - 更多示例：\n    -\
  \ 在 `vg00` 中创建一个可用大小为 500MB 的双镜像逻辑卷。此操作需要 3 个设备（或使用 `--alloc anywhere`）——两个用于镜像设备，一个用于磁盘日志：\n\
  \      ```\n      # lvcreate -m1 -L 500M vg00\n      ```\n    - 在 `vg00` 中创建一个可用大小为\
  \ 500MB 的双镜像逻辑卷。此操作需要 2 个设备——日志在“内存”中：\n      ```\n      # lvcreate -m1 --mirrorlog\
  \ core -L 500M vg00\n      ```\n    - 创建一个名为 `/dev/vg00/snap` 的快照逻辑卷，它可以访问创建快照时原始逻辑卷\
  \ `/dev/vg00/lvol1` 的内容。如果原始逻辑卷包含文件系统，你可以将快照逻辑卷挂载到任意目录，以便访问文件系统内容运行备份，同时原始文件系统可以继续更新：\n\
  \n\n\n\n\n# `lvcreate --size 100m --snapshot --name snap /dev/vg00/lvol1`\n\n* 创建一个名为\
  \ `/dev/vg1/sparse` 的稀疏设备，大小为 1TB，其上实际数据空间仅略小于 100MB：\n\n# `lvcreate --virtualsize\
  \ 1T --size 100M --snapshot --name sparse vg1`\n\n* 使用物理范围区 `/dev/sda:0-7` 和 `/dev/sdb:0-7`\
  \ 分配范围区创建一个线性逻辑卷 \"vg00/lvol1\"：\n\n```\nlvcreate -L 64M -n lvol1 vg00 /dev/sda:0-7\
  \ /dev/sdb:0-7\n```\n\n* 创建一个 5GB 的 RAID5 逻辑卷 \"vg00/my_lv\"，具有 3 个条带（外加 1 个校验盘，总共\
  \ 4 个设备），条带大小为 64KB：\n\n```\nlvcreate --type raid5 -L 5G -i 3 -I 64 -n my_lv vg00\n\
  ```\n\n* 创建一个 5GB 的 RAID10 逻辑卷 \"vg00/my_lv\"，在 2 个双路镜像上具有 2 个条带。请注意 `-i` 和 `-m`\
  \ 参数的行为不同。`-i` 指定条带的数量，`-m` 指定额外副本的数量。\n\n```\nlvcreate --type raid10 -L 5G -i 2\
  \ -m 1 -n my_lv vg00\n```\n\n* 注意：\n    * 与 `lvm`、`vgcreate`、`lvchange` 命令相关或相似。\n\
  \    * 这是一个 LVM 工具命令。\n    * 分类：存储\n\n# `lvdisplay` 参数 `volume_name`\n\n修改逻辑卷的属性，包括让内核知道这些卷已准备好可以使用。\n\
  \n* 例：`lvchange -pr vg00/lvol1`\n* 注意：\n    * 与 `lvm`、`lvcreate`、`vgchange` 命令相关或相似。\n\
  \    * 这是一个 LVM 工具命令。\n    * 分类：存储\n\n# `lvextend` 参数 `volume_name`\n\n扩展逻辑卷的大小。\n\
  \n* 例：在物理卷 `/dev/sdk3` 上将逻辑卷 \"vg01/lvol10\" 的大小扩展 54MB。只有当 `/dev/sdk3` 是卷组 `vg01`\
  \ 的成员且其中有足够的空闲范围区时可行：\n\n```\nlvextend -L +54 /dev/vg01/lvol10 /dev/sdk3\n```\n\n\
  * 更多示例：\n    * 根据物理卷 `/dev/sdk3` 上的可用空间扩展逻辑卷 \"vg01/lvol01\" 的大小。这等同于在命令行上指定 `-l\
  \ +100%PVS`：\n```\n/dev/vg01/lvol01 /dev/sdk3\n```\n    * 使用物理范围区 `/dev/sda:8-9`\
  \ 和 `/dev/sdb:8-9` 将逻辑卷 \"vg01/lvol01\" 扩展 16MB：\n\n```\nlvextend -L+16M vg01/lvol01\
  \ /dev/sda:8-9 /dev/sdb:8-9\n```\n* 注意：\n    * 与 `lvm`、`lvcreate`、`lvconvert` 命令相关或相似。\n\
  \    * 这是一个 LVM 工具命令。\n    * 分类：存储\n\n# `lvmchange`\n\n更改逻辑卷管理器（LVM）的属性。\n\n* 例：`lvmchange`\n\
  * 注意：\n    * LVM2 目前尚不支持 `lvmchange`，尽管 `dmsetup` 有一个 `remove_all` 命令。\n    * 与\
  \ `dmsetup` 命令相关或相似。\n    * 这是一个 LVM 工具命令。\n    * 分类：存储\n\n# `lvmconf` 参数\n\n加载\
  \ `lvm.conf` 及任何其他配置文件后显示配置信息。\n\n* 例：`lvmconf --enable-cluster`\n* 注意：\n    * `lvmconf`\
  \ 是一个修改 LVM 配置文件（/etc/lvm/lvm.conf）中锁定设置的脚本。\n    * 与 `lvm`、`/etc/lvm/lvm.conf`\
  \ 命令/文件相关或相似。\n    * 这是一个 LVM 工具命令。\n    * 分类：存储\n\n# `lvmdiskscan` 参数\n\n扫描系统中的所有存储设备以寻找\
  \ LVM 物理卷。\n\n* 例：`lvmdiskscan -- lvmpartition`\n* 注意：\n    * 与 `lvm`、`pvscan` 命令相关或相似。\n\
  \    * 这是一个 LVM 工具命令。\n    * 分类：存储\n\n# `lvmdump` 参数 `directory_name`\n\n创建用于诊断的\
  \ LVM2 信息转储。\n\n* 例：`lvmdump -d /path/to/directory`\n* 注意：\n    * 它会创建一个适用于与问题报告一起提交的\
  \ tar 包。\n    * 与 `lvm` 命令相关或相似。\n    * 这是一个 LVM 工具命令。\n    * 分类：存储\n\n# `lvreduce`\
  \ 参数 `volumegroup_name`\n\n减小逻辑卷的大小。\n\n* 例：将卷组 `vg00` 中的逻辑卷 `lvol1` 大小缩小 3 个逻辑范围区：\n\
  ```\nlvreduce -l -3 vg00/lvol1\n```\n* 注意：\n    * 与 `lvm`、`lvchange`、`lvconvert`\
  \ 命令相关或相似。\n    * 这是一个 LVM 工具命令。\n    * 分类：存储\n\n# `lvremove` 参数 `volumegroup_name`\n\
  \n移除逻辑卷。\n\n* 例：在不询问确认的情况下移除卷组 `vg00` 中的活动逻辑卷 `lvol1`：\n```\nlvremove -f vg00/lvol1\n\
  ```\n* 警告：\n    * 在移除活动逻辑卷前会请求确认。\n* 注意：\n    * 移除逻辑卷会移除所有相关的快照。\n    * 只有当逻辑卷处于激活状态时才能执行此操作（除非使用\
  \ `-f`）。\n    * 这是一个 LVM 工具命令。\n\n# `lvrename` 参数 `volumegroup_name`\n\n重命名逻辑卷。\n\
  \n* 例：将卷组 `vg02` 中的 `old` 重命名为 `new`：\n```\nlvrename vg02/old new\n```\n* 注意：\n\
  \    * 与 `lvm`、`lvcreate` 命令相关或相似。\n\n# `lvresize` 参数 `volume_name`\n\n调整 调整逻辑卷的大小。\n\
  \n* 例：使用物理范围区 `/dev/sda:0-1` 和 `/dev/sdb:0-1` 将逻辑卷 `vg1/lvol1` 扩展 16MB：\n\n```\n\
  lvresize -L+16M vg1/lvol1 /dev/sda:0-1 /dev/sdb:0-1\n```\n* 警告：\n    * 在缩小逻辑卷大小时，数据将会丢失！因此应先缩小逻辑卷上的文件。\n\
  * 注意：\n    * 与 `lvm`、`lvreduce` 命令相关或相似。\n\n# `lvs` 参数 `volume_name`\n\n报告逻辑卷的信息。\n\
  \n* 例：`lvs --all`\n* 注意：\n    * 与 `lvm`、`lvdisplay` 命令相关或相似。\n\n# `lvscan` 参数\n\n\
  扫描（所有磁盘）逻辑卷。\n\n* 例：`lvscan --all`\n* 注意：\n    * 与 `lvm`、`lvcreate` 命令相关或相似。\n\n\
  # `pvchange` 参数 `volume_name`\n\n更改物理卷的属性。\n\n* 例：`pvchange -x n /dev/sdk1`\n* 注意：\n\
  \    * 与 `lvm`、`pvcreate` 命令相关或相似。\n\n# `pvck` 参数 `volume_name`\n\n检查物理卷元数据。\n\n\
  * 例：`pvck --labelsector 20480 /dev/sda`\n* 注意：\n    * 与 `lvm`、`pvscan`、`vgck` 命令相关或相似。\n\
  \n# `pvcreate` 参数 `volume_name`\n\n初始化供 LVM 使用地存储。\n\n* 例：初始化第三块 SCSI 磁盘上的分区 4 以及整个第五块\
  \ SCSI 磁盘：\n\n```\npvcreate /dev/sdc4 /dev/sde\n```\n* 注意：\n    * 与 `lvm`、`pvdisplay`、`pvremove`\
  \ 命令相关或相似。\n\n# `pvdisplay` 参数 `volume_name`\n\n显示物理卷的属性。\n\n* 例：`pvdisplay`\n*\
  \ 注意：\n    * 与 `lvm`、`pvcreate` 命令相关或相似。\n\n# `pvmove` 参数 `volume_name`\n\n移动范围区。\n\
  \n* 例：将 `/dev/sdb1` 上使用的所有简单逻辑卷的范围区移动到卷组中其他空闲范围区：\n\n```\npvmove /dev/sdb1\n```\n\
  * 更多示例：\n    * 任何镜像、快照及其源保持不变。此外，可以指定目标设备 `/dev/sdc1`：\n\n```\npvmove /dev/sdb1\
  \ /dev/sdc1\n```\n\n\n\n\n\n*   仅对属于单个逻辑卷 `lvol1` 的物理区执行操作：\n\n    ```\n    pvmove\
  \ -n lvol1 /dev/sdb1 /dev/sdc1\n    ```\n\n*   与其移动整个设备的内容，不如可以移动一个范围的物理区（Physical\
  \ Extents）——例如 `/dev/sdb1` 上从 1000 到 1999（包含边界）的内容：\n\n    ```\n    pvmove /dev/sdb1:1000-1999\n\
  \    ```\n\n*   将一个范围的物理区移动到特定位置（该位置必须有足够的空闲物理区），使用格式：\n\n    ```\n    pvmove /dev/sdb1:1000-1999\
  \ /dev/sdc1\n    ```\n\n    或者 -\n\n    ```\n    pvmove /dev/sdb1:1000-1999 /dev/sdc1:0-999\n\
  \    ```\n\n*   如果源和目的在同一块磁盘上，则需要使用任何处分配（anywhere allocation）策略：\n\n    ```\n  \
  \  pvmove --alloc anywhere /dev/sdb1:1000-1999 /dev/sdb1:0-999\n    ```\n\n*   也可以选取并移动存在于物理区范围内的特定逻辑卷部分：\n\
  \n    ```\n    pvmove -n lvol1 /dev/sdb1:1000-1999 /dev/sdc1\n    ```\n\n*   备注：\n\
  \    *   与 `lvm`、`vgconvert`、`pvs` 命令相关（或具有相似性）。\n    *   这是一个 LVM 工具命令。\n    *\
  \   类别：存储\n\n*   `pvremove` 参数 `volume_name`：移除物理卷。\n    *   示例：`# pvremove /dev/sdc1`\n\
  \    *   警告：\n        *   擦除设备上的标签，使 LVM 不再将其识别为物理卷。\n    *   备注：\n        *   与\
