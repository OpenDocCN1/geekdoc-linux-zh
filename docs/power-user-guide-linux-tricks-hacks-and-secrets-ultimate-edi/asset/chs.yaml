  \ 类别：打印\n\n## Bash 脚本\n\n以下是与 Bash Shell 脚本相关的命令列表。此节仅提供某些命令的简要概述以及如何使用它们的快速示例。\n\
  \n更多信息：请参见章节 Bash Scripting\n\n* `variable_name=value`：设置本地变量。\n    * 示例：myvariable=HelloWorld;\
  \ echo $myvariable`\n    * 备注：\n        * 与（或类似）`set` 命令相关。\n        * 类别：变量\n\n\
  * `break`：退出循环（例如 for, while, select）。\n    * 示例：在数字 4 处退出循环：\n```bash\nfor looptest\
  \ in 1 2 3 4 5\ndo\n  if [ \"$looptest\" -eq 4 ]\n  then\n    break # 退出循环。\n  fi\n\
  \  echo -n \"$looptest\"\ndone\n```\n    * 备注：\n        * 与（或类似）`break` 命令相关。\n\
  \        * 这是一个 Bash 内部命令。\n        * 类别：循环/分支\n\n* `case` `WORD` in `PATTERN` [|\
  \ PATTERN]...) commands ;;]... esac：根据模式匹配执行命令。\n    * 示例：\n```bash\necho \"Enter\
  \ command (test1 or test2)?\"\nwhile :\ndo\n  read INPUT_STRING\n  case $INPUT_STRING\
  \ in\n    test1)\n      echo \"Type: TEST1\"\n      ;;\n    test2)\n      echo \"\
  \ Type: TEST2\"\n      break\n      ;;\n    *)\n      echo \"Error: not a recognized\
  \ command\"\n      ;;\n  esac\ndone\necho\necho \"Script ended\"\n```\n    * 备注：\n\
  \        * 这是一个 Bash 内部命令。\n        * 类别：循环/分支\n\n* `caller` 表达式：返回当前子程序的调用上下文。\n\
  \    * 示例：\n```bash\n{ bash /dev/stdin; } <<<$'f(){ g; }\\ng(){ h; }\\nh(){ while\
  \ caller $((n++)); do :; done; }\\f'\n```\n    * 备注：\n        * 这是一个 Bash 内部命令。\n\
  \        * 类别：循环/分支\n\n\n\n\n\n### complete arguments command\n`complete`: 指定 `Readline`\
  \ 如何对参数进行全。\n- **Ex**: `complete -p`\n- **Notes**:\n    - 教程：[`www.linuxjournal.com/content/more-using-bash-complete-command`](https://www.linuxjournal.com/content/more-using-bash-complete-command)\n\
  \    - 这是一个 Bash 内置命令。\n    - 分类：Shell\n\n### continue\n`continue`: 恢复循环的下一次迭代。\n\
  - **Ex**: 跳过显示数字 4：\n```bash\nfor looptest in 1 2 3 4 5\ndo\nif [ \"$looptest\"\
  \ -eq 4 ]\nthen\n  continue # 跳过循环迭代。\nfi\necho -n \"$looptest\"\ndone\n```\n- **Notes**:\n\
  \    - 与 `break` 命令相关（或相似）。\n    - 这是一个 Bash 内置命令。\n    - 分类：循环/分支\n\n### declare\
  \ variable_name = value\n`declare variable_name = value`: 设置变量的值和属性。\n- **Ex**:\
  \ `declare \"$x=HelloWorld\"`\n- **Notes**:\n    - 这是一个 Bash 内置命令。\n    - 分类：变量\n\
  \n### dialog arguments\n`dialog`: 在脚本中显示基于文本的对话框。\n- **Ex**: `dialog --title 'Message'\
  \ --msgbox 'HelloWorld' 5 20`\n- **Notes**:\n    - 必须安装，`sudo apt-get install dialog`\n\
  \    - 与 `zenity` 命令相关（或相似）。\n    - 分类：脚本\n\n### echo text_message\n`echo text_message`:\
  \ 将 STDIN 字符串发送到 STDOUT（即在屏幕上显示文本）。\n- **Ex**: `echo HelloWorld`\n- **Notes**:\n\
  \    - 与 `printf` 命令相关（或相似）。\n    - 完整文档位于：[`www.gnu.org/software/coreutils/echo`](http://www.gnu.org/software/coreutils/echo)\n\
  \    - 这是一个 COREUTILS 命令。\n    - 分类：字符串/文本\n\n### env arguments command\n`env`:\
  \ 修改环境变量。\n- **Ex**: `env TZ=MST7MDT date`\n- **Notes**:\n    - 与 `printenv` 命令相关（或相似）。\n\
  \    - 完整文档位于：[`www.gnu.org/software/coreutils/env`](http://www.gnu.org/software/coreutils/env)\n\
  \    - 这是一个 COREUTILS 命令。\n    - 分类：变量\n\n### envsubst arguments\n`envsubst`: 替换\
  \ shell 格式字符串中的环境变量。\n- **Ex**:\n```bash\nprintf \"VAR1=\\${VAR1}\\nVAR2=\\${VAR2}\\\
  nVAR3=\\${VAR3}\\n\" > infile\nexport VAR1=\"one\" VAR2=\"two\" VAR3=\"three\"\n\
  cat infile\nenvsubst '${VAR1} ${VAR3}' < infile > infile2\ncat infile2\n```\n- **Notes**:\n\
  \    - 与 `env` 命令相关（或相似）。\n    - 分类：变量\n\n### eval arguments\n`eval`: 将参数作为 shell\
  \ 命令执行。\n- **Ex**: `cmd=\"Hello=World\"; eval \"$cmd\"; echo $Hello`\n- **Notes**:\n\
  \    - 这是一个 Bash 内置命令。\n    - 分类：Shell\n\n### export variable_name = value\n`export\
  \ variable_name = value`: 定义 shell 变量导出属性。\n- **Ex**: `export test=HelloWorld`\n\
  - **Notes**:\n    - 这是一个 Bash 内置命令。\n    - 分类：变量\n\n### false\n`false`: 以指示失败的状态码退出。\n\
  - **Ex**: `if false; then echo False; fi`\n- **Notes**:\n    - 与 `true` 命令相关（或相似）。\n\
  \    - 完整文档位于：[`www.gnu.org/software/coreutils/false`](http://www.gnu.org/software/coreutils/false)\n\
  \    - 这是一个 COREUTILS 命令。\n    - 分类：循环/分支\n\n### for NAME [in WORDS ... ] ; do commands;\
  \ done\n`for NAME [in WORDS ... ] ; do commands; done`: 为结果列表中的每个项运行命令。\n- **Ex**:\n\
  ```bash\nfor FILE in $(ls -1)\ndo\n  echo - $FILE\ndone\n```\n- **Notes**:\n   \
  \ - 这是一个 Bash 内置命令。\n    - 分类：循环/分支\n\n### function name { commands ; }\n`function\
  \ name { commands ; }: 创建一个命名的 shell 函数。\n- **Ex**: `v (){ echo \"$@\"; \"$@\";\
  \ }`\n- **Notes**:\n    - 这是一个 Bash 内置命令。\n    - 分类：循环/分支\n\n### getopts arguments\n\
  `getopts`: 解析命令选项和参数。\n- **Ex**: 程序片段示例：\n```bash\nwhile getopts abc: f\ndo\n  case\
  \ $f in\n    a | b) flag=$f;;\n    c) carg=$OPTARG;;\n    \\?) echo $USAGE; exit\
  \ 1;;\n  esac\ndone\nshift `expr $OPTIND - 1`\n```\n- **Notes**:\n    - 这是一个 Bash\
  \ 内置命令。\n    - 分类：循环/分支\n\n### if commands; then commands;fi\n`if commands; then\
  \ commands;fi`: 如果命令符合条件标准，则执行命令。\n- **Ex**: `if true; then echo True; fi`\n- **Notes**:\n\
  \    - 更多变体：`if commands; then commands; [ elif commands; then commands; ]... [\
  \ else commands; ] fi`\n    - 这是一个 Bash 内置命令。\n    - 分类：循环/分支\n\n### let arguments\n\
  `let`: 对 shell 变量执行整数算术运算。\n- **Ex**: `let abc=10*1000; echo $abc`\n- **Notes**:\n\
  \    - 与 `expr` 命令相关（或相似）。\n    - 这是一个 Bash 内置命令。\n    - 分类：变量\n\n### line\n`line`:\
  \ 从 STDIN 读取一行并输出到 STDOUT。\n- **Ex**: `line`\n- **Notes**:\n    - 与 `read` 命令相关（或相似）。\n\
  \    - 这是一个旧命令。\n    - 这是一个 UTIL-LINUX 命令。\n    - 分类：变量\n\n### local variable_name=value\n\
  `local variable_name=value`: 在函数中创建局部变量。\n- **Ex**: 脚本示例：\n```bash\n#!/bin/bash\n\
  HELLO=Hello\nfunction hello {\n  local HELLO=World\n  echo $HELLO\n}\necho $HELLO\n\
  hello\necho $HELLO\n```\n- **Tips**:\n    - 局部变量仅在函数内可用，脚本的其他部分或其他函数无法使用它们。\n- **Notes**:\n\
  \    - 这是一个 Bash 内置命令。\n    - 分类：变量\n\n### mapfile arguments variable\n`mapfile\
  \ arguments variable`: 从 STDIN 读取行到索引数组变量中。\n- **Ex**: 这是一个简单的进度条示例。它会为读取的每行打印一个点。转义后的注释隐藏了\
  \ `printf` 附加的单词：\n```bash\nprintf '%s\\n' {1..5} | mapfile -c 1 -C 'printf . \\\
  #'\n```\n- **Notes**:\n    - 这是一个 Bash 内置命令。\n    - 分类：变量\n\n### read arguments\
  \ variable\n`read arguments variable`: 将控制台输入读取到变量。\n- **Ex**: `read myvariable;\
  \ echo $myvariable`\n- **Notes**:\n    - 这是一个 Bash 内置命令。\n    - 分类：变量\n\n### readarray\
  \ array_name < file_name\n`readarray array_name < file_name`: 从文件读取行到数组变量。\n- **Ex**:\
  \ `readarray myarray < stuff.txt; echo ${myarray[0]}`\n- **Notes**:\n    - 这是一个\
  \ Bash 内置命令。\n    - 分类：变量\n\n### readonly variable_name=value\n`readonly variable_name=value`:\
  \ 将函数和变量标记为只读。\n- **Ex**: `readonly myvariable=value`\n- **Notes**:\n    - 这是一个\
  \ Bash 内置命令。\n    - 分类：变量\n\n### return [n]\n`return [n]`: 退出 shell 函数，带有可选值。\n\
  - **Ex**: `return 12345`\n- **Tips**:\n    - 如果通过命令传递值，则函数或源脚本将以 n 指定的返回值退出。\n-\
  \ **Notes**:\n    - 这是一个 Bash 内置命令。\n    - 分类：循环/分支\n\n### printenv arguments variable_name\n\
  `printenv arguments variable_name`: 显示所有或特定环境变量的值。\n- **Ex**: `printenv USER`\n\
  - **Notes**:\n    - 与 `env` 命令相关（或相似）。\n    - 完整文档位于：[`www.gnu.org/software/coreutils/printenv`](http://www.gnu.org/software/coreutils/printenv)\n\
  \    - 这是一个 COREUTILS 命令。\n    - 分类：变量\n\n### printf arguments\n`printf arguments`:\
  \ 以指定的格式呈现并显示数据。\n- **Ex**: `printf \"Name is \\\"%s\\\".\\n----------------\\n.\"\
  \ \"Jane\"`\n- **Notes**:\n    - 与 `echo` 命令相关（或相似）。\n    - 完整文档位于：[`www.gnu.org/software/coreutils/printf`](http://www.gnu.org/software/coreutils/printf)\n\
  \    - 这是一个 COREUTILS 命令。\n    - 分类：字符串/文本\n\n### select NAME [in WORDS ... ;] do\
  \ commands; done\n`select NAME [in WORDS ... ; do commands; done`: 从列表中选择单词，然后根据单词执行命令。\n\
  - **Ex**:\n```bash\n#!/bin/bash\nPS3='Please enter your choice : '\noptions=(\"\
  Option 1\" \"Option 2\" \"Option 3\" \"Option 4\")\nselect opt in \"${options[@]}\"\
  \ndo\n  case $opt in\n    \"Option 1\")\n      echo \"Option 1 Seleted\";;\n   \
  \ \"Option 2\")\n      echo \"Option 2 Seleted\";;\n    \"Option 3\")\n      echo\
  \ \"Option 3 Seleted\";;\n    \"Option 4\")\n      break;;\n    *)\n      echo \"\
  Error: invalid option: $REPLY\";;\n  esac\ndone\n```\n\n\n\n\n\n```bash\nesac\n\n\
  done\n```\n\n* 注意：\n    * 这是一个内部 Bash 命令。\n    * 类别：循环/分支\n\n* `set variable_name=value`：操作\
  \ shell 变量和函数。\n    * 示例：`set myvariable=HelloWorld; echo $myvariable`\n    * 注意：\n\
  \        * 与 `unset` 命令相关（或相似）。\n        * 这是一个内部 Bash 命令。\n        * 类别：变量\n\n\
  * `shift arguments`：将位置参数左移动 `n` 次。\n    * 示例：`shift 1`\n    * 提示：\n        * 为了方便说明，位置参数是指你在脚本内部传递的参数（例如\
  \ `./myscript -arg1:value1 -arg2:value2 …`）。\n    * 注意：\n        * 这是一个内部 Bash 命令。\n\
  \        * 类别：循环/分支\n\n* `sleep time`：挂起脚本执行指定的时间（秒）。\n    * 示例：`sleep 10`\n   \
  \ * 注意：\n        * 完整文档请见：[`www.gnu.org/software/coreutils/sleep`](http://www.gnu.org/software/coreutils/sleep)\n\
  \        * 这是一个 COREUTILS 命令。\n        * 类别：循环/分支\n\n* `source file_name arguments`：在当前\
  \ shell 中执行文件中的命令。\n    * 示例：`source my_functions.sh`\n    * 注意：\n        * 可用于将函数文件加载到当前\
  \ shell。\n        * 这是一个内部 Bash 命令。\n        * 类别：Shell\n\n* `test expression`：检查文件类型并比较值。\n\
  \    * 示例：`test 7 -gt 5 && echo \"true\"`\n    * 注意：\n        * 完整文档请见：[`www.gnu.org/software/coreutils/test`](http://www.gnu.org/software/coreutils/test)\n\
  \        * 这是一个 COREUTILS 命令。\n        * 类别：循环/分支\n\n* `true`：以表示成功的状态码退出。\n   \
  \ * 示例：`if true; then echo True; fi`\n    * 注意：\n        * 与 `false` 命令相关（或相似）。\n\
  \        * 完整文档请见：[`www.gnu.org/software/coreutils/true`](http://www.gnu.org/software/coreutils/true)\n\
  \        * 这是一个 COREUTILS 命令。\n        * 类别：循环/分支\n\n* `typeset arguments variable_name=value`：设置变量的值和属性。\n\
  \    * 注意：\n        * 过时命令，请参见 \"help declare\"。\n        * 与 `declare` 命令相关（或相似）。\n\
  \        * 这是一个内部 Bash 命令。\n        * 类别：变量\n\n* `while commands; do commands; done`：只要测试成功就一直执行命令。\n\
  \    * 示例：\n    ```bash\nwhile true\ndo\necho \"- TRUE\"\ndone\n    ```\n    * 注意：\n\
  \        * 这是一个内部 Bash 命令。\n        * 类别：循环/分支\n\n* `unset arguments variable_name`：清除（或取消定义）shell\
  \ 变量。\n    * 示例：`unset myvariable`\n    * 注意：\n        * 与 `set` 命令相关（或相似）。\n  \
  \      * 这是一个内部 Bash 命令。\n        * 类别：变量\n\n* `until commands; do commands; done`：直到给定条件为真时执行命令。\n\
  \    * 示例：\n    ```bash\n    #!/bin/bash\n    COUNTER=20\n    until [ $COUNTER -lt\
  \ 10 ]; do\n    echo COUNTER $COUNTER\n    let COUNTER-=1\n    done\n    ```\n \
  \   * 注意：\n        * 这是一个内部 Bash 命令。\n        * 类别：循环/分支\n\n## X-Windows 命令 (GUI\
  \ 启动包)\n\n以下是可从命令行执行的 X-Windows 应用和命令。运行这些命令时，假设已安装并正确配置了 X-Windows。\n\n* `stacer`：系统优化和监控器。\n\
