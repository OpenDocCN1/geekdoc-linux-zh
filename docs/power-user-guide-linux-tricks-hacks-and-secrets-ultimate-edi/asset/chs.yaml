  nmap -oS - scanme.nmap.org\n```\n（额外的 `[-]` 连字符会将输出置于 L33t ，即“脚本小子”模式）\n\n获取网络流量统计数据，输入：\n\
  \n```bash\niptraf-ng\n```\n\n要安装该命令，输入：\n\n```bash\nsudo apt-get install iptraf-ng\n\
