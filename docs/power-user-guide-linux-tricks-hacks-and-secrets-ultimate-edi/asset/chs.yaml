  \ 命令。\n    * 分类：System\n\n### journalctl 参数\n查询 systemd 日志。\n* 示例：`journalctl _SYSTEMD_UNIT=avahi-daemon.service`\n\
  * 示例：\n    * 无参数，显示所有未过滤的日志：\n        `journalctl`\n    * 指定一个匹配项，显示所有匹配该字段的条目：\n\
  \        `journalctl _SYSTEMD_UNIT=avahi-daemon.service`\n    * 如果匹配两个不同的字段，则仅显示同时匹配两个表达式的条目：\n\
  \        `journalctl _SYSTEMD_UNIT=avahi-daemon.service _PID=28097`\n    * 如果两个匹配指向同一个字段，则显示匹配任一表达式的条目：\n\
  \        `journalctl _SYSTEMD_UNIT=avahi-daemon.service _SYSTEMD_UNIT=dbus.service`\n\
  \    * 如果使用分隔符 \"+”，可以将两个表达式组合为逻辑“或”。以下命令将显示 PID 为 28097 的 Avahi 服务进程的所有消息，以及来自\
  \ D-Bus 服务任何进程的所有消息：\n        `journalctl _SYSTEMD_UNIT=avahi-daemon.service _PID=28097\
  \ + _SYSTEMD_UNIT=dbus.service`\n\n\n\n\n\n`journalctl _SYSTEMD_UNIT=avahi-daemon.service\
  \ _PID=28097 + _SYSTEMD_UNIT=dbus.service`\n\n* 显示由 D-Bus 执行文件生成的所有日志：\n```bash\n\
