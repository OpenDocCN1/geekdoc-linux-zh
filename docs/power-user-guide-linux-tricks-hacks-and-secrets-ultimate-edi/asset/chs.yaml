  \ 参数：重新创建卷组目录和逻辑卷特殊文件。\n    *   示例：`# vgmknodes`\n    *   备注：\n        *   检查用于活动逻辑卷的所需的\
  \ `/dev` 特殊文件，创建缺失的并移除未使用的。\n        *   与 `lvm`、`vgscan`、`dmsetup` 命令相关（或具有相似性）。\n\
