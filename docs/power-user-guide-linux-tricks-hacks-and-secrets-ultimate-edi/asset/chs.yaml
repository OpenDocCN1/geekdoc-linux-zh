  \ Gbps | 外部 |\n| Thunderbolt 3 | | 外设 | 10 Gbps | 外部 |\n\n\n\n\n\n在编写此章节时，我遇到了一个有趣的问题：寻找一个可以处理大数字的计算器比我设象的要困难。例如，当我尝试计算\
  \ 1 `Domegemegrottebyte` (`DB`) 或 `1,298,074,214,633,706,907,132,624,082,305,024\
  \ Bytes`（或 `2¹¹⁰`）时，唯一能处理这种数字的只有 Wolfram Alpha 网站([https://www.wolframalpha.com/])。我指出这一点是因为即使是\
  \ Google 计算器在不使用科学计数法的情况下显示该数字的问题（即 `1.2980742e+33`）。\n\n- `1 Bit` (`b`) = `0` 或\
  \ `1` 状态：`1 Bit` 等于一个布尔“状态”，例如 `ON` 或 `OFF`（`TRUE` 或 `FALSE`）。\n- `1 Byte` (`B`)\
  \ = `1 Byte`（或 `8 bits`）：`1 Byte` 等于纸张上的一个打字字符。\n- `1 Kilobyte` (`KB`) = `1,024\
  \ Bytes` (`2¹⁰`)：`2 Kilobytes` 等于一页纸。\n- `1 Megabyte` (`MB`) = `1,048,576 Bytes`\
  \ (`2²⁰`)：`1 Megabyte` 等于一本短小说或一张数据软盘的数据。\n- `1 Gigabyte` (`GB`) = `1,073,741,824\
  \ Bytes` (`2³⁰`)：`1 Gigabyte` 等于一辆装满纸的皮卡，或者大约 `1.5 CDs` 的信息。\n- `1 Terabyte` (`TB`)\
  \ = `1,099,511,627,776 Bytes` (`2⁴⁰`)：`10 Terabytes` 等于美国国会图书馆整个打印藏书。\n- `1 Petabyte`\
  \ (`PB`) = `1,125,899,906,842,624 Bytes` (`2⁵⁰`)：`1 Petabyte` 等于大约 `13+ 年` 的 HDTV\
  \ 级视频。\n- `1 Exabyte` (`EB`) = `1,152,921,504,606,846,976 Bytes` (`2⁶⁰`)：`5 Exabytes`\
  \ 等于人类曾说过的所有单词。\n- `1 Zettabyte` (`ZB`) = `1,180,591,620,717,411,303,424 Bytes`\
  \ (`2⁷⁰`)：`42 zettabytes` 等于所有人类说过的话语数字化后的存储需求，假设被数字化为 `16 kHz` `16-bit audio`（根据\
  \ Mark Liberman 计算）。\n- `1 Yottabyte` (`YB`) = `1,208,925,819,614,629,174,706,176\
  \ Bytes` (`2⁸⁰`)：`1 Yottabyte` 等于一堆从太阳堆到天王星 DVD 存储量。\n- `1 Xenottabyte` (`XB`) =\
  \ `1,237,940,039,285,380,274,899,124,224 Bytes` (`2⁹⁰`)：目前还没有这种存储单位（以及更大单位）的良好对应示例。\n\
  - `1 Shilentnobyte` (`SB`) = `1,267,650,600,228,229,401,496,703,205,376 Bytes` (`2¹⁰⁰`)：尚无等效示例。\n\
  - `1 Domegemegrottebyte` (`DB`) = `1,298,074,214,633,706,907,132,624,082,305,024\
  \ Bytes` (`2¹¹⁰`)：尚无等效示例。\n\n**注意：**\n字节数量的名称和缩写很容易与比特的表示混淆。比特数量的缩写使用小写的 \"b\" 而不是大写的\
  \ \"B\"。因为一个字节由八位比特组成，这种区别可能是巨大的。例如，如果一个宽带互联网连接广告的下载速度为 `3.0 Mbps`，它的速度实际上是 `3.0\
  \ megabits per second`，即 `0.375 megabytes per second`（缩写为 `0.375 Mbps`）。比特和比特率（单位时间内的比特，如每秒比特\
