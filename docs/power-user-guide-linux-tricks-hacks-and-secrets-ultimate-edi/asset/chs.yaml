  \ WiMax | 12 Mbps | 消费级 |\n\n## DNS 记录类型\n\nDNS 是 Domain Name System（域名系统）的缩写，是一种用于计算机、服务或其他资源的分级命名系统。它最初的设计是为了方便访问互联网。DNS\
  \ 由几种类型的记录组成：\n\n- `A`: 地址记录，返回 32 位的 `IPv4` 地址。\n- `AAAA`: IPv6 地址记录，返回 128 位的\
  \ `IPv6` 地址。\n- `CAA`: 证书授权授权记录，用于指定哪些证书机构 (CAs) 允许为域名签证书。\n- `CNAME`: 规范名称记录，另一个名称的别名。\n\
  - `MX`: 邮件交换记录，将域名映射到该域名的消息传输代理列表。\n- `NS`: 域名服务器记录，将 DNS 区域委托给指定的名称服务器。\n- `PTR`:\
  \ 指针记录，指向规范名称的指针。与 `CNAME` 不同，DNS 处理会停止并仅返回名称。最常见的用途是反向 DNS 查询。\n- `SOA`: 区域起始记录，指定有关\
  \ DNS 区域的权威信息，包括主名称服务器、域名管理员的电子邮件、域名序列号以及几个与刷新区域相关的定时计时器。\n- `SRV`: 服务定位器，一种通用的服务定位记录，用于较新的协议，而不是创建特定协议的记录（如\
  \ `MX`）。\n\n**注意：**\n你需要使用 `dig -x example.com` 来查看 `PTR` 记录。\n\n\n\n\n\n# TXT\n\
  文本记录，最初为在 DNS 记录中的任意人类可读文本而创建。该记录也用于存储 SPF（发送者策略框架）信息，许多邮件系统使用它来帮助识别邮件是否来自可信源 ([`www.openspf.net/`](http://www.openspf.net/))。它还用于存储\
  \ DomainKeys 信息，该信息也用于验证邮件的可信源 (http://www.dkim.org/）。\n\n`example.com.1029INTXT\"\
  v=spf1 redirect=_spf.mail.exaple.com\"`\n\n# 其他 DNS 记录类型\n\n还有其他可选 DNS 记录类型，但将不再进一步讨论。我在这里包含它们供你参考。\n\
  \n我还会说明，关于 DNSSEC 记录类型，在“Linux 命令快速参考”部分有所引用。只需搜索“DNSSEC”即可找到它们。\n\n### DNSSEC 记录类型：\n\
  - `DNSKEY` (DNSSEC 公钥)\n- `DS` (委托签名者)\n- `NSEC` (下一个安全记录)\n- `NSEC3` (下一个安全记录 v.\
  \ 3)\n- `NSEC3PARAM` (NSEC3 参数)\n- `RRSIG` (RRset 签名)\n\n### 杂记录类型：\n- `AFSDB` (AFS\
  \ 数据库位置)\n- `ATMA` (异步传输模式地址)\n- `CAA` (证书机构授权)\n- `CERT` (证书 / CRL)\n- `DHCID`\
  \ (DHCP 信息)\n- `DNAME` (非终结 DNS 名称重定向)\n- `HINFO` (主机信息)\n- `ISDN` (ISDN 地址)\n-\
  \ `LOC` (位置信息)\n- `MB`, `MG`, `MINFO`, `MR` (邮件箱记录)\n- `NAPTR` (命名权威指针)\n- `NSAP`\
  \ (NSAP 地址)\n- `RP` (负责人)\n- `RT` (路由经由)\n- `TLSA` (传输层安全认证)\n- `X25` (X.25 PSDN\
  \ 地址)\n\n## 文件权限\n\n在使用 `CHMOD` 命令更改文件权限时，每个数字都代表一种权限含义。例如：7 是所有权限（读、写和执行），5 是所有权限（读和写），等等。数字的位置也很重要。第一个位置用于创建该文件的\
  \ `USER`（用户）权限。第二个位置用于 `GROUP`（组）权限。第三个位置用于 `WORLD`（即所有人或其他）权限。\n\n使用下表来解析权限值、其在输入\
  \ `ls` 命令时的含义和显示属性。\n\n![](img/00018.jpeg)\n\n## LS 目录示例\n![](img/00019.gif)\n\n\
  ## 权限类\n\n### CHMOD 权限\n\n| CHMOD | 权限 | 结果 |\n| :--- | :--- | :--- |\n| 0 (0+0+0)\
  \ | 无权限 | --- |\n| 1 (0+0+1) | 仅执行 | -x |\n| 2 (0+2+0) | 仅写 | -w- |\n| 3 (0+2+1)\
  \ | 写和执行 | -wx |\n| 4 (4+0+0) | 仅读 | r-- |\n| 5 (4+0+1) | 读和执行 | r-x |\n| 6 (4+2+0)\
  \ | 读和写 | rw- |\n| 7 (4+2+1) | 读、写和执行 | rwx |\n\n例如：\n\n```bash\nchmod 754 file_name\n\
  ```\n第一个数字：7（意味着：对 `USER` 有读、写、执行权限）。\n第二个数字：5（意味着对 `GROUP` 有读和执行权限）。\n第三个数字：4（意味着对\
  \ `WORLD` 仅读）。\n\n## 符号 vs 八进制表示\n\n`chmod` 命令支持符号表示和八进制表示。八进制表示是一种较旧的方法，并且讨论过了。符号表示是一种较新的方法，它比旧的八进制方法更易人类阅读。例如，`chmod\
  \ u+rwx g+rx o+rx file_name` 比 `chmod 755 file_name` 更易读。\n\n以下表格和图表提供了符号表示与八进制法的对比以及它们之间的关系。\n\
  \n### 符号 vs 八进制\n\n| 符号表示 | 八进制 | 结果 |\n| :--- | :--- | :--- |\n| a+rwx | 777 |\
  \ rwx rwx rwx |\n| u+rwx, g=rx, o=rx | 755 | rwx r-x r-x |\n| u+rw, g=r, o=r | 644\
  \ | rw- r-- r-- |\n| u+rwx, g=rwx, o=rwx | 700 | rwx --- --- |\n\n### 总结：\n权限（数值\
  \ -或- 符号类模式）：\n- 4 -或- R: 读（文件或目录）\n- 2 -或- W: 写（文件或目录）\n- 1 -或- X: 执行（文件或目录）\n\
  - 0: 无权限（文件或目录）\n\n用户/组（符号类）：\n- `u`: 用户（所有者）\n- `g`: 组\n- `o`: 世界/所有人\n- `a`: 所有\n\
  \n符号类操作符\n- `+`:向指定的类中添加指定的模式\n- `-`:从指定的类中移除指定的模式\n- `=`：将指定的模式设为指定类的精确模式\n\n示例：\n\
  - `chmod 777 file_name`: 给所有人分配读、写、执行 (RWX) 权限。\n- 或\n- `chmod u+rwx g+rwx o+rwx\
  \ file_name`: 给所有人分配读、写、执行 (RWX) 权限。\n- `chmod 755 file_name`: 给所有者分配 RWX，给组和世界分配\
  \ RX。\n- 或\n- `chmod u+rwx g+rx o+rx file_name`: 给所有者分配 RWX，给组和世界分配 RX\n\n# 文件系统层次结构标准\n\
  \nLinux 使用文件系统层次标准 (FHS) 为 Linux 发行版定义标准的目录和内容结构。它描述了 Linux 应该将系统文件、应用程序和配置文件以及用户文件放在哪里。这是对结构的过度简化，但希望它能让表格更容易理解。\n\
  \n当你尝试确定某个文件应该放置的位置而不是仅仅猜测时，可以使用此表。例如，如果你正在创建一个临时挂载点，它们应该放在 `/mnt` 目录。\n\nFHS 标准由\
  \ Linux 基金会维护。\n\n| 目录 | 描述 |\n| :--- | :--- |\n| `/` | 主层次结构根目录。 |\n| `/bin` |\
  \ 必要的命令二进制文件（例如 `cat`, `ls`, `cp`）。 |\n| `/boot` | 启动加载器文件（例如内核，`initrd`）。 |\n|\
  \ `/dev` | 必要的设备文件（例如 `/dev/null`）。 |\n| `/etc` | 主机特定的系统级配置文件 |\n| `/etc/opt` |\
  \ 存储在 `/opt` 中的附加软件包的。 |\n| `/etc/sgml` | 用于软件 ML 的配置文件（如目录文件）。 |\n| `/etc/X11`\
  \ | X-Windows 系统第 11 版本的配置文件。 |\n| `/etc/xml` | XML 的配置文件 |\n| `/home` | 用户的家目录，包含保存的文件、个人设置等。\
  \ |\n| `/lib` | `/bin` 和 `/sbin` 中二进制文件必需的库。 |\n| `/media` | 可移动式介质（如 CD-ROM）的挂载点\
  \ |\n| `/mnt` | 临时挂载的文件句系统。 |\n| `/opt` | 可选应用程序软件。 |\n| `/proc` | 提供进程和内核信息的虚拟文件系统。\
  \ |\n| `/root` | root 用户的家目录。 |\n| `/run` | 运行时变量数据：关于当前登录用户和运行守护进程的信息。注意：在提供此目录作为临时文件系统的系统上。\
  \ |\n| `/tmp` | 临时文件（参见 `/var/tmp`）。注意：通常在系统重启之间不会保留，并且可能受到严格的大小限制。 |\n| `/usr`\
  \ | 只读用户次级层次结构；包含大部分工具和应用程序。 |\n| `/usr/bin` | 非必要的命令二进制文件。 |\n| `/usr/include`\
  \ | 标准包含文件。 |\n| `/usr/lib` | `/usr/bin` 和 `/usr/sbin` 中二进制文件的库。 |\n| `/usr/local`\
  \ | 此主机的本地数据三级层次结构。（子目录，如 bin, lib, share）。 |\n| `/usr/sbin` | 非必要的系统二进制文件（例如各种网络服务的守护进程）。\
  \ |\n| `/usr/share` | 体系无关（共享）的数据。 |\n| `/usr/src` | 源代码，例如带有头文件的内核源码。 |\n| `/usr/X11R6`\
  \ | X-Windows 系统第 11 版本发行 6。 |\n| `/var` | 变量文件是指在系统正常运行期间内容预计不断变化的文件（如日志、池文件和临时电子邮件文件）。\
  \ |\n| `/var/cache` | 应用程序缓存数据（临时）。此类数据是耗时 I/O 或计算的结果在本地生成的。删除缓存文件不会丢失数据。 |\n| `/var/lib`\
  \ | 状态信息。程序在运行时修改的持久化数据，例如数据库、软件包系统元数据等。 |\n\n\n\n\n\n| `/var/lock` | 锁文件。跟踪当前正在使用的资源的文件。\
  \ |\n| `/var/log` | 日志文件。各种日志。 |\n| `/var/mail` | 邮箱文件。在某些发行版中，这些文件可能位于已弃的 `/var/spool/mail`。\
  \ |\n| `/var/opt` | 存储在 `/opt` 中的附加包的可变数据。 |\n| `/var/run` | 运行时可变数据。此目录包含描述自启动以来系统信息数据。注意：在\
  \ FHS 3.0 中，`/var/run` 被 `/run` 取代；为了向后兼容，系统应该继续提供 `/var/run` 目录，或者提供从 `/var/run`\
  \ 到 `/run` 的符号链接。 |\n| `/var/spool` | 等待处理的任务的池（例如打印队列和出站邮件队列）。 |\n| `/var/spool/mail`\
  \ | 用户邮箱的已弃位置。 |\n| `/var/tmp` | 在重启之间保留的临时文件。 |\n\n## 历史说明\n\n在贝尔实验室早期版本的 UNIX\
  \ 实现文档中，`/etc` 被称为“etcetera 目录”，因为该目录在历史上持有所有不属于其他地方的内容（但 FHS 将 `/etc` 限制为静态配置文件，且可能不包含二进制文件）。自早期文档发布以来，该目录名称已通过各种方式被重新解释。最近的解释包括反缩词，如“可编辑文本配置”（Editable\
  \ Text Configuration）或“扩展工具箱”（Extended Tool Chest）。\n\n### 注意\n\n更多信息：[`www.pathname.com/fhs/`](http://www.pathname.com/fhs/)\n\
  \n## HTTP 状态码\n\n本节包含常见的 HTTP 状态码，其中某些代码仅用于信息，另一些则是警告或错误。某些代码将在浏览器显示（取决于 `HTTPd`\
  \ 设置），但它们几乎总是会被记录在服务器日志中。\n\n除非你是运行 Web 服务器的系统管理员，否则你几乎看不到所有的代码，除非你在分析日志文件。\n\n\
  本节包含了 Apache2 HTTP 状态码作为参考。这些代码随时间推移可能会发生变化，例如添加新代码和弃旧代码，但它们保持保持一致。\n\n## 备注\n\n\
  这些代码在不同的 HTTP 守护进程实现和版本之间可能有所不同。尽管如此，它们通常遵循这些格式。\n\n### 状态码\n\n### 100 到 199: 信息性\n\
  \n很少使用 - 通常只写入服务器日志。\n\nApache2 100 状态码\n```\n(103) RESPONSE_CODES\n(100) HTTP_CONTINUE\n\
  (101) HTTP_SWITCHING_PROTOCOLS\n(102) HTTP_PROCESSING\n```\n\n### 200 到 299: 成功\n\
  \n只有 200 频繁使用，且通常只写入服务器日志。\n\nApache2 200 状态码\n```\n(200) HTTP_OK\n(201) HTTP_CREATED\n\
  (202) HTTP_ACCEPTED\n(203) HTTP_NON_AUTHORITATIVE\n(204) HTTP_NO_CONTENT\n(205)\
  \ HTTP_RESET_CONTENT\n(206) HTTP_PARTIAL_CONTENT\n(207) HTTP_MULTI_STATUS\n(208)\
  \ HTTP_ALREADY_REPORTED\n(226) HTTP_IM_USED\n```\n\n### 300 到 399: 警告\n\n请求可能可行，但存在问题。\n\
  \nApache2 300 状态码\n```\n(300) HTTP_MULTIPLE_CHOICES\n(301) HTTP_MOVED_PERMANENTLY\n\
  (302) HTTP_MOVED_TEMPORARILY\n(303) HTTP_SEE_OTHER\n(304) HTTP_NOT_MODIFIED\n(305)\
  \ HTTP_USE_PROXY\n(307) HTTP_TEMPORARY_REDIRECT\n(308) HTTP_PERMANENT_REDIRECT\n\
  ```\n\n### 400 到 499: 客户端错误\n\n请求在某些方面是无效的。\n\nApache2 400 状态码\n```\n(400) HTTP_BAD_REQUEST\n\
  (401) HTTP_UNAUTHORIZED\n(402) HTTP_PAYMENT_REQUIRED\n(403) HTTP_FORBIDDEN\n(404)\
  \ HTTP_NOT_FOUND\n(405) HTTP_METHOD_NOT_ALLOWED\n(406) HTTP_NOT_ACCEPTABLE\n(407)\
  \ HTTP_PROXY_AUTHENTICATION_REQUIRED\n(408) HTTP_REQUEST_TIME_OUT\n(409) HTTP_CONFLICT\n\
  (410) HTTP_GONE\n(411) HTTP_LENGTH_REQUIRED\n(412) HTTP_PRECONDITION_FAILED\n(413)\
  \ HTTP_REQUEST_ENTITY_TOO_LARGE\n(414) HTTP_REQUEST_URI_TOO_LARGE\n(415) HTTP_UNSUPPORTED_MEDIA_TYPE\n\
  (416) HTTP_RANGE_NOT_SATISFIABLE\n(417) HTTP_EXPECTATION_FAILED\n(418) HTTP_IM_A_TEAPOT\n\
  (421) HTTP_MISDIRECTED_REQUEST\n(422) HTTP_UNPROCESSABLE_ENTITY\n(423) HTTP_LOCKED\n\
  (424) HTTP_FAILED_DEPENDENCY\n(425) HTTP_TOO_EARLY\n(426) HTTP_UPGRADE_REQUIRED\n\
  (428) HTTP_PRECONDITION_REQUIRED\n(429) HTTP_TOO_MANY_REQUESTS\n(431) HTTP_HEADER_TOO_LARGE\n\
  (451) HTTP_UNAVAILABLE\n```\n\n### 500 到 599: 服务器错误\n\n服务器无法履行请求。\n\nApache2 500\
  \ 状态码\n```\n(500) INTERNAL_SERVER_ERROR\n(501) HTTP_NOT_IMPLEMENTED\n(502) HTTP_BAD_GATEWAY\n\
  (503) HTTP_UNAVAILABLE\n(504) HTTP_GATEWAY_TIMEOUT\n(505) HTTP_VERSION_NOT_SUPPORTED\n\
  (506) HTTP_EXTENDED\n(507) HTTP_INSUFFICIENT_STORAGE\n(508) HTTP_LOOP\n(510) HTTP_NETWORK_AUTHENTICATION_REQUIRED\n\
  (511) HTTP_VARIES\n```\n\n## HTTP 请求方法\n\n方法（有时称为“动词”）用于指示在远程服务器上执行所需的操作。响应取决于实现。如果服务器对某种方法未知，它将被视为是不安全的。\n\
  \n### GET (HTTP/0)\n\n使用 `GET` 方法应该只检索数据而不产生任何其他影响。这通常是客户端使用的默认方法。\n\n```bash\n\
  curl -i -X GET 'https://www.youtube.com/results?search_query=Linux'\n```\n\n###\
  \ HEAD (HTTP/0)\n\n使用 `HEAD` 方法请求类似于 `GET` 请求的响应，但不包含正文。这对于获取头信息而无需获取所有内容有用。\n\n\
  ```bash\ncurl -i -X HEAD http://www.example.com/\n```\n\n### POST (HTTP/0)\n\n`POST`\
  \ 方法用于向服务器发送数据以创建或更新资源。数据存储在请求体中。例如，网站上的联系表单，用户填写表单并点击发送按钮时。\n\n```bash\ncurl -i\
  \ -X POST 'http://www.example.com/login/' --data 'username=username&password=userpassword'\n\
  ```\n\n### PUT (HTTP/1)\n\n`PUT` 请求与 `POST` 请求相似，用于向远程服务器发送数据以创建或更新资源。区别在于 `PUT`\
  \ 请求是幂等的，这意味着多次调用相同的 `PUT` 请求产生相同的结果。\n\n```bash\ncurl -i -X PUT 'http://www.example.com/rest-api/user/1234/'\
  \ --data 'email=email_addr@gmail.com'\n```\n\n### DELETE (HTTP/1)\n\n`DELETE` 方法从远程设备删除指定的资源（如果支持该方法）。此方法常用于\
  \ REST API。\n\n```bash\ncurl -i -X DELETE http://www.example.com/file\n```\n\n###\
  \ TRACE (HTTP/1)\n\n`TRACE` 方法回显接收到的请求，以便客户端可以看到中间服务器是否做了任何更改或添加。\n\n```bash\ncurl\
  \ -v -X TRACE http://www.example.com\n```\n\n### OPTIONS (HTTP/1)\n\n`OPTIONS` 请求返回服务器支持指定\
  \ URL 的 HTTP 方法。这可以检查远程服务器支持哪些功能（即请求方法）。\n\n\n\n\n\n# 向 URL 发送 OPTIONS 请求\n\n```bash\n\
  curl -i -X OPTIONS http://www.example.com\n```\n\n### PATCH (HTTP/1.1)\n\n`PATCH`\
  \ 方法对资源进行部分修改。例如，如果你只需要更新用户名，`PATCH` 请求允许你仅在请求体中发送更新后的用户名。而 `POST` 和 `PUT` 方法则要求发送完整的用户实体（即所有的\
  \ HTML 字段）。\n\n# 向 URL 发送 PATCH 请求\n\n```bash\ncurl --request PATCH https://api.example.com/v1/\
  \ pages/12345?status=open\n```\n\n### CONNECT (HTTP/1.1)\n\n`CONNECT` 方法将请求连接转换为透明的\
  \ TCP/IP 隧道。这通常是为了方便通过未加密的 HTTP 代理进行 SSL 加密通信 (HTTPS)。\n\n## IPv4 网络与 CIDR 表格\n\n\
  IPv4 是网协议第 4 版本（Internet Protocol version 4）的缩写。IPv4 拥有近 43 亿个可能的地址。IPv4 地址长度为 32\
  \ 位，写为 4 个字节的数字，每个字节 8 位，并使用 0 到 255 的十进制值表示（称为“点点法”），例如：`192.168.1.100`。\n\n###\
  \ IPv4 事实\n\n这里是一些关于 IPv4 的有趣事实：\n\n- IPv4 于 1983 年投入生产（基于 `RFC 760` 和 `RFC 791`）。\n\
  - IPv4 地址在 2011 年 2 月完全耗尽，当时最后一个 1600 万地址的未分配区块被分配。IPv6 协议的创建是为了取代这一网络标准。\n\n###\
  \ 公共地址与私有地址\n\nIPv4 有两种地址：公共地址和私有地址。它们的的区别如下：\n\n- 公共地址可以在外部网络上路由。\n- 私有地址仅在内部网络路由，不可在外部网络路由。\n\
  \n### 私有地址（类）\n\n在 IPv4 中，有三类私有地址范围供组织和个人重复使用。这些地址用于内部网络以及创建不同规模的子网。这些地址无法在公共互联网等外部网络上路由。\n\
  \n- **A 类** (`10.0.0.0-10.255.255.255` [子网掩码 `255.0.0.0]，有 16,777,216 个可用地址)。\n\
  \  - 注意：包含单个 A 类 `/8` 网络。\n- **B 类** (`172.16.0.0-172.31.255.255` [子网掩码 `255.255.0.0]，有\
  \ 65,536 个可用地址)。\n  - 注意：包含 16 个连续的 B 类 `/16` 网络。\n- **C 类** (`192.168.0.0-192.168.255.255`\
  \ [子网掩码 `255.255.255.0`]，有 256 个可用地址)。\n  - 注意：包含 256 个连续的 C 类 `/24` 地址。\n\n###\
  \ IPv4 特殊地址\n\nIPv4 有一个回回地址（Loopback Address），用于测试系统网络栈是否正常。这是本地接口的内部地址。当你遇到问题时，这是要检查的第一项。要测试\
  \ IPv4 回环地址，输入：\n\n```bash\nping localhost\n```\n`127.0.0.1`\n\n额外的特殊地址：\n\n- 链路本地范围：`169.254.0.0/16`\n\
  - 组播范围：`224.0.0.0/4`\n\n### 地址子网划分\n\n`CIDR`（无类域域间路由）表示法使用斜杠（`/`）字符对 IP 地址及其关联的前缀进行紧凑表示。由于每个人必须共享\
  \ 43 亿个 IPv4 地址，因此产生了子网概念，根据子网掩码分配网络划分。例如，`/24` 代表 `255.255.255.0` 的子网，它可以支持 256\
  \ 个地址，或一个 C 类。如果你想要分配的 IP 范围以 `192.168.1.0` 开头，则应写为 `192.168.1.0/24`。`CIDR` 只是子网掩码的简短写法。一旦你知道了子网掩码（例如\
  \ `255.255.255.0`），`CIDR` 表允许你快速计算特定大小的可用地址和子网。你最后需要默认网关（通常是路由器，在本例中它将是 `192.168.1.1`）。在将这些信息输入你的网卡后，你就可以在现有网络上通信了。\n\
  \n| CIDR | 位 | 主机 | 网络 | 子网掩码 |\n| :--- | :--- | :--- | :--- | :--- |\n| /32 | 0\
  \ | 1 | 无 | 255.255.255.255 |\n| /31 | 1 | 2 | 无 | 255.255.255.254 |\n| /30 | 2\
  \ | 4 | nets | 255.255.255.252 |\n| /29 | 3 | 8 | nets | 255.255.255.248 |\n| /28\
  \ | 4 | 16 | nets | 255.255.255.240 |\n| /27 | 5 | 32 | nets | 255.255.255.224 |\n\
  | /26 | 6 | 64 | nets | 255.255.255.192 |\n| /25 | 7 | 128 | nets | 255.255.255.128\
  \ |\n| /24 | 8 | 256 | 1 Class C | 255.255.255.0 |\n| /23 | 9 | 512 | 2 Class C\
  \ | 255.255.254.0 |\n| /22 | 10 | 1024 | 4 Class C | 255.255.252.0 |\n| /21 | 11\
  \ | 2048 | 8 Class C | 255.255.248.0 |\n| /20 | 12 | 4096 | 16 Class C | 255.255.240.0\
  \ |\n| /19 | 13 | 8192 | 32 Class C | 255.255.224.0 |\n| /18 | 14 | 16384 | 64 Class\
  \ C | 255.255.192.0 |\n| /17 | 15 | 32768 | 128 Class C | 255.255.128.0 |\n| /16\
  \ | 16 | 65536 | 1 Class B | 255.255.0.0 |\n| /15 | 17 | 131072 | 2 Class B | 255.254.0.0\
  \ |\n| /14 | 18 | 262144 | 4 Class B | 255.252.0.0 |\n| /13 | 19 | 524288 | 8 Class\
  \ B | 255.248.0.0 |\n| /12 | 20 | 1048576 | 16 Class B | 255.240.0.0 |\n| /11 |\
  \ 21 | 2097152 | 32 Class B | 255.224.0.0 |\n| /10 | 22 | 4194304 | 64 Class B |\
  \ 255.192.0.0 |\n| /9 | 23 | 8388608 | 128 Class B | 255.128.0.0 |\n| /8 | 24 |\
  \ 16777216 | 1 Class A | 255.0.0.0 |\n| /7 | 25 | 33554428 | 2 Class A | 254.0.0.0\
  \ |\n| /6 | 26 | 67108856 | 4 Class A | 252.0.0.0 |\n| /5 | 27 | 134217712 | 8 Class\
  \ A | 248.0.0.0 |\n\n\n\n\n\n例如，在 Linux 中，某些网络工具有两个版本，一些用于 IPv4，另一些用于 IPv6。例如，对于\
  \ IPv4，网络工具被称为 `ping`、`traceroute` 等。在 IPv6 中，这些网络工具被称为 `ping6`、`traceroute6` 等。\n\
  \n# IPv6 寻址\n\nIPv6 地址长度为 128 位，但为了提高人类可读性，它被写成八组 16 位数，每组由 4 个十六进制字符组成（每个字符 4 位），并用冒号分隔，例如：\n\
  \n`2001:0AF3:0000:0000:0000:3044:0044:C14F`\n\n为了让 IPv6 地址更容易读和读写，可以使用缩写技术（即在可能的情况下移除多余的零）（使用上面的\
  \ IPv6 地址）：\n\n- 省略前导零（例如 `0044` 现在仅为 `44`）：\n`2001:AF3:0:0:0:3044:44:C14F`\n- 移除连续零（例如：`0000:0000:0000:`），可以缩写为\
  \ `::`（双冒号）：\n`2001:AF3::3044:044:C14F`\n\n# 地址范围和类型\n\n主要有三种类型的 IPv6 单播（即跨越网络在单个发送者和单个接收者之间的通信）地址：\n\
  \n1. **全局单播地址 (Global Unicast Addresses)**：外部网络可路由（即互联网）\n2. **唯一本地地址 (Unique Local)**：内部网络可路由（即\
  \ VPN），不可在外部网络路由。\n3. **链路本地地址 (Link Local)**：不可路由（内部和外部均不可）\n\n## 技术备注：\n\n- **任播\
  \ (Anycast)**：标识一组接口，通常位于不同的位置，由地址指定的系统会自动选择距离最近的一个（通过路由距离测量）。由于任播地址目前仅分配给路由器，且仅代表目的地址。\n\
  - **组播 (Multicast)**：用于将一个数据包传递给多个接口。IPv6 组播的工作原理与 IPv4 相同。\n\n# 全局单播地址（外部网络 [互联网]）\n\
  \nIPv6 全局公共地址以 `2001:` 开头。这些是全局单播地址，相当于 IPv4 的公有 IP 地址空间（用于互联网服务，如 Web 服务器等）。互联网权威\
  \ IANA（互联网分配编号机构）将 IPv6 地址块分配给 ISP（互联网服务提供商），然后由他们将其分配给客户。\n\n与 IPv4 类似，IPv6 将地址分为两个部分：网络和节点。这是通过将地址拆分为两个\
  \ 64 位段来实现的。IPv6 地址的前 64 位用于路由，后 64 位用于标识系统接口。\n\n地址的第一组 64 位（即接口 ID）由两部分组成，地址的前\
  \ 48 位是全局网络地址，指定了地址的公共拓扑部分（即互联网路由）。接下来的 16 位是子网 ID，称为站点拓扑部分，可用于在组织站点内部路由目的指定最多 65,536\
  \ 个唯一子网。最后 64 位是接口 ID，指定每个子网内的唯一接口。第二部分派生自系统的 MAC 地址（利用 IEEE 的扩展唯一标识符 [`EUI-64]`\
  \ 格式），并构成接口 ID。\n\n- MAC (IPv4): `00-AB-51-67-22-1A`\n- EUI-64 (IPv6): `00-AB-51-11-19-67-22-1A`\n\
  \n## 全局单播地址结构详解\n\n| 64 位（网络） | 64 位（节点） |\n| :--- | :--- |\n| `2001:0AF3:0000:0000`\
  \ | `0000:3044:0044:C14F` |\n| `48 位: 全局前缀 16 位: 子网 ID` | `64 位: 接口 ID` |\n\n# 链路本地和唯一本地（内部网络）\n\
  \n链路本地和唯一本地相当于 IPv4 私有 IP 地址（即 A 类 [`10.0.0.0]`、B 类 [`172.16.0.0]`、C 类 [`192.168.0.0]`）。这些地址是内部网络的预留范围，可以被不同的组织重复使用。这些地址在外部网络上不可路由。\n\
  \n与 IPv4 类似，IPv6 将地址分为两个部分：网络和节点。这是通过将地址拆分为两个 64 位段来实现的。IPv6 地址的前 64 位用于内部路由，后 64\
  \ 位用于标识系统接口。最后 64 位是接口 ID，指定每个子网内的唯一接口。第二部分派生自系统的 MAC 地址（利用 IEEE 的扩展唯一标识符 [`EUI-64]`\
  \ 格式），并构成接口 ID。\n\n**唯一本地 (Unique Local)**：内部网络可路由（即 VPN），不可在外部网络路由。此类地址的范围对于组织内的所有站点是全局的，使用此类地址可以简化组织内部\
  \ IPv6 路由基础设施的配置。此类地址的前以前缀以 `FD00::/8` 开头，接下来的 40 位代表全局 ID，这是一个识别组织内特定站点的随机生成值，接下来的\
  \ 16 位代表子网 ID，可用于路由目的进一步划分内部网络。最后 64 位是接口 ID，指定每个子网内的唯一接口。\n\n**链路本地 (Link Local)**：这些地址仅限于链路，在内部网络上不可路由。IPv6\
  \ 路由器永远不会将这些地址转发通过本地链路。链路本地地址使用 IPv6 地址自动配置分配给接口，这类似于 IPv4 使用的自动私有 IP 地址 (APIPA)（即\
  \ `169.254.0.0/16`）。链路本地地址的地址前缀为 `FE80::/64`（即 `FE80:0:0:0` 或 `FE80::`），后 64 位是本地链路上的接口\
  \ ID。\n\n## 链路本地地址结构详解\n\n| 64 位（网络） | 64 位（节点） |\n| :--- | :--- |\n| `FE80::` |\
  \ `64 位` |\n| `FE80::AF3:0044:0044:C14F` | `64 位: 网络` |\n| `64 位: 接口` |\n\n# 特殊\
  \ IPv6 地址\n\n- `FE80::AF3:0000:0000:0000:3044:0044:C14F` - `64 位: 网络`\n- `FE80::AF3::3044:044:C14F`\
  \ - `64 位: 接口`\n- `::1` - 回环 (Loopback)\n- `FD00::/8` - 唯一本地 (Unique Local)\n- `FF00::8`\
  \ - 组播 (Multicast)\n- `FE80::/64` - 链路本地 (Link Local)\n\n## IPv6 CIDR\n\n| CIDR\
