  \ getkeycodes\n显示内核扫描码到键码的映射表。\n* 示例：`# getkeycodes`\n* 注意：\n    * 与（或类似于）`setkeycodes`\
  \ 命令相关。\n    * 分类：Kernel\n\n### getopt 参数\n解析命令选项。\n* 示例：这是一个演示该命令的最佳且最短的示例：\n```bash\n\
  # execute: test.sh -b|r|g -OR- test.sh -color=RED|BLUE|GREEN\n\n#!/bin/bash\n\n\
  # 调用 getopt 来验证提供的输入。\n\noptions=$(getopt -o brg --long color: -- \"$@\")\n\n[ $?\
  \ -eq 0 ] || {\n\necho \"Incorrect options provided\"\nexit 1\n}\n\neval set --\
  \ \"$options\"\n\nwhile true; do\ncase \"$1\" in\n-b)\nCOLOR=BLUE ;;\n-r)\nCOLOR=RED\
  \ ;;\n-g)\nCOLOR=GREEN ;;\n--color)\nshift; # 该参数是下一个位置参数\nCOLOR=$1\n[[ ! $COLOR\
  \ =~ BLUE|RED|GREEN ]] && {\necho \"Incorrect options provided\"\nexit 1\n} ;;\n\
  --)\nshift\nbreak ;;\nesac\nshift\ndone\n\necho \"Color is $COLOR\"\nexit 0;\n```\n\
  * 注意：\n    * 这是一个 UTIL-LINUX 命令。\n    * 分类：Scripting\n\n### gold 参数 file_name\n\
