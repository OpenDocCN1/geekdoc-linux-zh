  \n### 地址大小\n根据本节表格，这些是组织分配或个人使用的不同大小范围。\n\n### IPv6 相对大小\n- `/128:1`: IPv6 地址（网络接口）\n\
  - `/64:1`: IPv6 子网（常用大小）\n- `/56:256`: LAN 段（订阅常用大小）\n- `/48:635`: LAN 段（站点常用大小）\n\
  \n### Linux 信号\n信号是操作系统或程序向另一个程序的通知消息。信号可以从内核发送到进程，也可以从进程发送给自己。Linux 内核实现了约 30 个信号。每个信号由数字标识，其名称通常自言易懂。\n\
  \n| 信号 | 名称 | 描述 |\n| :--- | :--- | :--- |\n| `SIGHUP` | 1 | 挂起 (POSIX) |\n| `SIGINT`\
  \ | 2 | 终端中断 (ANSI) |\n| `SIGQUIT` | 3 | 终端退出 (POSIX) |\n| `SIGILL` | 4 | 非法指令 (ANSI)\
  \ |\n| `SIGTRAP` | 5 | 跟踪陷阱 (POSIX) |\n| `SIGIOT` | 6 | IOT (4.2 BSD) |\n| `SIGBUS`\
  \ | 7 | 总线错误 (4.2 BSD) |\n| `SIGFPE` | 8 | 浮点异常 (ANSI) |\n| `SIGKILL` | 9 | 杀死 (无法捕捉或忽略)\
  \ |\n| `SIGUSR1` | 10 | 用户自定义信号 (POSIX) |\n| `SIGSEGV` | 11 | 无效内存访问 (ANSI) |\n\
  | `SIGUSR2` | 12 | 用户自定义信号 (POSIX) |\n| `SIGPIPE` | 13 | 向无读者的管道写入 (POSIX) |\n|\
  \ `SIGALRM` | 14 | 闹钟 (POSIX) |\n| `SIGTERM` | 15 | 终止 (ANSI) |\n| `SIGSTK` | 16\
  \ | 栈错误 |\n| `SIGCHLD` | 17 | 子进程已停止或状态改变 (POSIX) |\n| `SIGCONT` | 18 | 继续执行，如果已停止\
  \ (POSIX) |\n| `SIGSTOP` | 19 | 停止执行 (无法捕捉或忽略) |\n| `SIGTSTP` | 20 | 终端停止信号 (POSIX)\
  \ |\n| `SIGTTIN` | 21 | 后台进程尝试从 TTY 读取 (POSIX) |\n| `SIGTTOU` | 22 | 后台进程尝试写入 TTY\
  \ (POSIX) |\n| `SIGURG` | 23 | 套接字紧急情况 (4.2 BSD) |\n| `SIGXCPU` | 24 | 超过 CPU 限制\
  \ (4.2 BSD) |\n| `SIGXFSZ` | 25 | 超过文件大小限制 (4.2 BSD) |\n| `SIGVTALRM` | 26 | 虚拟闹钟\
  \ (4.2 BSD) |\n| `SIGPROF` | 27 | 性能闹钟 (4.2 BSD) |\n| `SIGWINCH` | 28 | 窗口大小变化 (4.3\
  \ BSD, Sun) |\n| `SIGIO` | 29 | I/O 现在可用 (4.2 BSD) |\n| `SIGPWR` | 30 | 电源故障 (System\
  \ V)\n\n## OSI 网络模型（七层）\nOSI（开放系统互连）模型是一个包含七层的参考模型。所有网络程序和过程（例如工具、服务等）都属于这些层中的一个。OSI\
  \ 模型有助于理解网络的层次。当你遇到网络问题时，可以快速判断问题发生在哪一层。\n\n### 第 7 层：应用层\n网络进程到程序（如 DNS、FTP、Telnet、HTTP）。这是\
  \ 浏览器、邮件客户端、VoIP 等网络程序运行的地方。\n\n### 第 6 层：表示层\n数据表示（加密和解密），将机器相关的数据转换为机器无关的数据。描述：将输入输出数据从一种表示格式转换为另一种（这取决于操作系统）。例如，在末端从明文转换为密文，在另一端转回明文。\n\
  \n### 第 5 层：会话层\n主机间通信，管理程序之间的会话。描述：协调并终止数据传输。它处理如身份验证和重连的服务。`TCP` 和 `UDP` 提供了这些服务。\n\
  \n### 第 4 层：传输层\n端到端连接、可靠性和流量控制。描述：管理数据分包，包括数据交付以及在接收后检查错误。`TCP` 和 `UDP` 提供了这些服务。\n\
  \n### 第 3 层：网络层\n路径确定和逻辑寻址。网络硬件：路由器和智能交换机。描述：工作在物理层、数据链路和网络层。\n\n### 第 2 层：数据链路\n\
  物理寻址。网络硬件：交换机和桥器。描述：工作在物理层和数据链路。数据被路由到正在通信的特定端口，或者被转发到另一个设备。\n\n### 第 1 层：物理层\n\
  介质、信号和二进制传输。网络硬件：集线器和无线网络。描述：所有数据在此层无智能地路由到网络中的所有设备。\n\n\n\n\n\n# RAID\n\nRAID（独立磁盘冗余阵列的缩写）利用条带化、镜像或校验技术，从多个通用计算机存储设备（即硬盘驱动器\
  \ [HDD] 或固态硬盘 [SSD]）创建大型且可靠的数据存储器。最常见的类型有 `RAID 0`（条带）、`RAID 1` 及其变体（镜像）、`RAID 5`（分布式校验）和\
  \ `RAID 6`（双重校验）。\n\n关于 RAID 你需要理解的一点是：你为了速度和/或冗余性牺牲了存储容量。你需要放弃的存储空间取决于 `RAID` 的类型以及你使用的驱动器数量。规则的唯一例外是\
  \ `RAID 0`，它提供了容量和速度，但没有冗余。\n\n现代存储设备（即 SAN）可能利用 RAID 和存储优化技术来增加可用存储的容量。这些存储优化技术包括：纠删码、文件压缩和数据去重。\n\
  \n### 注意\n\nRAID 通常有两种实现方式：硬件和软件。硬件实现的 RAID 比软件版本更快。而 RAID 的软件实现可能提供更多的功能和灵活性。根据你的总体目标（性能或功能）将帮助你决定最适合你的方案。\n\
  \n### RAID 0\n数据在所有驱动器上条带化，这可以增加阵列的存储容量，提供高数据吞吐量，但不提供容错能力。\n\n- 最小磁盘数量：2\n- 容错：无\n\
  - 存储空间开销：无\n- 读取速度：快\n- 写入速度：快\n\n### RAID 1\n数据在两个或多个驱动器上进行镜像。这仅在单个驱动器故障时提供容错。此外，数据写入速度较慢，因为在写入下一组数据之前，必须同时写入两个驱动器。\n\
  \n- 最小磁盘数量：2\n- 容错：1 块磁盘\n- 存储空间开销：50%\n- 读取速度：快\n- 写入速度：平均\n\n### RAID 5\n在 3 或多个驱动器上对数据和校验进行条带。提供了容错和容量，读取速度更快，但数据写入较慢。这种阵列可以处理一个驱动器的丢失，而不会丢失阵列中的数据。\n\
  \n- 最小磁盘数量：3\n- 容错：1 块磁盘\n- 存储空间开销：1 个驱动器\n- 读取速度：慢，见备注\n- 写入速度：慢，见备注\n\n### RAID\
  \ 6\n在 4 或多个驱动器上对数据和双重校验进行条带。提供了比 RAID 5 更强的容错能力。你可以丢失两个驱动器而不丢失阵列中的数据。同样像 RAID 5\
  \ 一样，它的读取速度更快，但数据写入较慢。\n\n- 最小磁盘数量：4\n- 容错：2 个驱动器\n- 存储空间开销：2 个驱动器\n- 读取速度：慢，见备注\n\
  - 写入速度：慢，见备注\n\n### RAID 0+1（又称 RAID 10）\n提供容量和容错。使用条带和镜像（不使用校验）。写入速度是读取的两倍，因为两个副本都必须更新。`RAID\
  \ 50` 至少需要四块磁盘，并在单盘故障的情况下不丢失数据生存。\n\n- 最小磁盘数量：4\n- 容错：1 块磁盘\n- 存储空间开销：50%\n- 读取速度：快\n\
  - 写入速度：平均\n\n### RAID 0+5（又称 RAID 50）\n提供容量和容错。使用带校验的条带和镜像。`RAID 50` 至少需要六块磁盘，并在单盘故障的情况下不丢失数据。与\
  \ RAID 0+1 一样，写入速度比读取慢。\n\n- 最小磁盘数量：6\n- 容错：1 个驱动器\n- 存储空间开销：2 个驱动器\n- 读取速度：慢，见备注\n\
  - 写入速度：慢，见备注\n\n### RAID 0+6（又称 RAID 60）\n提供容量和容错。通过 `RAID60`，你可以根据磁盘数量增加读取速度。它使用带双重校验的条带和镜像。`RAID\
  \ 60` 至少需要八块磁盘，并在双盘故障的情况下不丢失数据生存。\n\n- 最小磁盘数量：8\n- 容错：2 个驱动器\n- 存储空间开销：4 个驱动器\n\
  - 读取速度：慢，见备注\n- 写入速度：慢，见备注\n\n## 备注\n\n需要注意的是，如果你的存储设备发生故障（即 HDD 或 SSD），你的 RAID\
  \ 阵列应该是安全的，但你应该尽快更换故障驱动器。更换故障驱动器的唯一考虑因素是在其上重建校验所需。重建过程也会对任何向存储发送读/写请求的进程产生性能影响，直到阵列完成\
  \ 100% 重建。\n\n### 提示\n\n更多信息：[`en.wikipedia.org/wiki/Standard_RAID_levels`](https://en.wikipedia.org/wiki/Standard_RAID_levels)\n\
  \n## 现代数据存储类型\n\n如果你有需要存储特定应用程序，现在有三种主要类型供选择。取决于你想实现的目标将决定最适合你应用程序的存储类型。\n\n有传统的块存储（Block\
  \ Storage），用于通用。如果你不需要托管操作系统或应用程序，那么文件存储和对象存储可能是更好的选择。\n\n文件存储通常由类似 `NAS`（网络附属存储）的设备处理，用于托管文件。\n\
  \n### 块存储\n传统的硬盘 (HDD)、固态硬盘 (SSDs)、SAN（存储区域网络）等都是块存储设备的示例。这些设备通过将数据拆分成更小的块并将其放置在存储介质上（如\
  \ HDD、SSD 等）来存储数据。\n\n如果你使用 `SAN`，存储将以 `LUN`（逻辑单元号）的形式呈现给服务器，可以像本地磁盘一样对待。服务器通常使用\
  \ `iSCSI`（互联网小型计算机系统接口）以及太网或光纤网络与 `SAN` 通信。\n\n这种存储类型已经存在了几十年，广为人所知。\n\n- **优点**：高性能，适用于不断变化的事务型数据。\n\
  - **缺点**：使用具有有限命名空间的层级文件结构，当文件数数百万时，该结构会开始崩溃。\n\n### 文件存储\n文件存储基于块存储，但针对通过网络提供所有不同大小的文件进行了优化。这种类型的存储通常由\
  \ `NAS`（网络附属存储）设备使用，用于存储远程客户端访问的文件。今天最常用的两种文件共享协议是 `NFS`（Linux 网络文件系统）和 `SMB/CIFS`（Windows\
  \ 通用互联网文件系统）。\n\n这种存储无法用于启动带有操作系统的设备，或托管诸如传统数据库的数据。事务密集型数据库（用于 ERP、CRM 系统等应用程序）和性能导向的数据存储在\
  \ `SAN` 中效果更好。此外，对于大型异构块数据传输，`SAN` 更合适。\n\n和块存储一样，这种存储类型已经存在了一段时间，广为人所知。\n\n- **优点**：简化了网络共享文件的管理。\n\
  - **缺点**：除非基于云，否则通常不支持高扩展性。对于共享文件以外的其他数据类型并不理想。\n\n### 对象存储\n大多数组织将其非结构化数据（如媒体、文档、日志、备份、应用程序二进制文件等）存储在传统的块存储上。问题是，当你开始存储数百万或更多文件时，传统的块存储受到文件系统的某些限制。\n\
  \n对象存储使用键值存储，其中对象被存储为单个实体，而不是块存储中的多个块。对对象的任何更新都需要用新版本替换整个对象。对象存储不适用于托管操作系统或运行数据库。\n\
  \n对象通常通过 REST API 调用提交到对象存储，并返回一个标识符。大多数对象存储允许向对象附加元数据，将其聚合到容器（或桶）中。\n\n\n\n\n\n\
  与文件存储相比，对象存储仅出现了几年。尽管如此，它仍然被认为非常可靠，并且许多大型科技公司正使用它来运行业务。\n\n**优点**：高可扩展性，并支持分布式架构。它最适合变化不大的静态数据。使用扁平化文件结构，仅限于\
  \ `object ID` 的位数。\n\n**缺点**：不适合不断变化的数据。不提供带有锁定机制的共享协议（该机制可以防止两个或多个人覆盖相同数据）。\n\n\
  ## 常用 TCP/UDP IP 端口\n\n`TCP/IP` 协议的一部分是被称为“端口”的内容。`TCP/IP` 支持 65535 个端口，用于与本地系统上的服务进行通信。任何服务都可以利用它需要的任何端口，但大多数人都会遵循一些通用准则。最容易举的例子是，不安全的\
  \ HTTP 使用 `TCP/80` 端口，而安全的 HTTP 使用 `TCP/443` 端口。\n\n每个服务处理数据的方式不同，因此如果您要与特定的服务端口进行通信，您需要了解该协议如何工作，或者拥有另一个知道如何与其通信的服务或实用程序。\n\
  \n这些端口可以分为三个主要类别：\n\n-   `TCP/UDP` 端口范围 `0 to 1023`：这些被称为常用端口。\n-   `TCP/UDP` 端口范围\
  \ `1024 to 49151`：被称为注册端口。这些端口通常由软件开发者注册，用于为他们的程序或服务指定特定端口。\n-   `49152 to 65535`\
  \ 之间的端口被称为公共端口。这些端口供任何人使用，且不被保留。\n\n此列表并非完整，它仅显示了服务更常用的端口。还有一些未列出的非官方或更古老的端口/服务。网上有更完整的参考资料供查询，例如，查看\
  \ [IANA 网站](https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml)。\n\
  \n在处理防火墙时，这是一个非常实用的表格，可以尝试确定哪些端口应该开启，哪些端口建议保持关闭。\n\n注意：加粗的端口号是官方端口。\n\n| 端口 # |\
  \ 协议 | 说明 |\n| :--- | :--- | :--- |\n| 20 | TCP | FTP - 数据端口 (FTP-d) |\n| 21 | TCP\
  \ | FTP - 控制（命令）端口 (FTP-c) |\n| 22 | TCP, UDP | SSH (安全 Shell) - 用于安全登录、文件传输 (scp,\
  \ sftp) 和端口转发 |\n| 23 | TCP, UDP | Telnet 协议 - 未加密的文本通信 |\n| 25 | TCP, UDP | SMTP\
