  - `Ctrl+E`（或 `End`）：跳转到行尾。\n- `Ctrl+F`: 向右（前进）一个字符。\n- `Alt+F`: 向右（前进）一个单词。\n- `Ctrl+H`（或\
  \ `Backspace`）：删除光标前的字符。\n- `Ctrl+K`: 剪切光标所在行之后的行内容，然后将其添加到剪贴板。\n- `Ctrl+L`: 清除屏幕（类似于\
  \ `clear`）。\n- `Ctrl+P`: 回到上一行（类似于向上箭头）。\n- `Ctrl+N`: 去到下一行（类似于向下箭头）。\n- `Ctrl+Q`:\
  \ 恢复停止的屏幕输出（在按下 `Ctrl+S` 后）。\n- `Ctrl+R`: 搜索命令历史。\n- `Ctrl+S`: 停止所有到屏幕输出。\n- `Ctrl+T`:\
  \ 交换光标前最后两个字符。\n- `Alt+T`: 交换当前单词与上一个单词。\n- `ESC+T` 交换光标前的两个单词。\n- `Ctrl+U`: 剪切光标之前的之前的行内容，然后将其添加到剪贴板。\n\
  - `Ctrl+W`: 剪切光标前的单词，然后将其添加到剪贴板。\n- `Ctrl+X, X`: 在行首和当前光标位置之间移动。\n- `Ctrl+X, E`:\
  \ 在终端中启动编辑器，即刻编辑命令。\n- `Ctrl+X, ~`（波号）：自动补全用户名。\n- `Ctrl+X, @`（@符号）：自动补全机器名。\n-\
  \ `Ctrl+X, $`（美元符号）：自动补全环境变量名。\n- `Ctrl+X, !`（感叹号）：自动补全命令或文件名（功能与 `TAB` 键相同）。\n\
  - `Ctrl+Y`: 粘贴上次从剪贴板中剪切的内容。\n- `Ctrl+Z`: 暂停当前命令。\n- 输入 `fg` [前台] 恢复，或 `bg` [后台]。\n\
  - `Ctrl_+`: 撤销上一次按键。\n- `Alt+C`: 将光标下的字符转为大写。\n- `Alt+L`: 将从光标到当前单词结束的所有字符转为小写。\n\
  - `Alt+U`: 将从光标到单词结束的所有字符转为大写。\n- `!!`: 重复上一条命令。\n- `Alt+(.)`: 显示上一条命令并提取最后一个参数。\n\
  - `Ctrl+] CHAR`: 快速跳转到指定的字符。\n- `Alt+Backspace`: 剪切上一个单词。\n- `Alt+Delete`: 剪切光标前的内容。\n\
  - 使用上、下箭头遍历之前的命令历史。\n- `TAB` 键自动补全命令后的文件名/目录。\n- `Alt+Ctrl+E` 或 `Ctrl+X, *` 展开别名。\n\
  \n## 系统命令\n\n以下是与操作系统相关的系统命令列表。其中许多非常强大（例如 `crontab`），而另一些几乎完全没用（例如 `col` 命令）。你可能想在测试/开发系统上对其进行实验。\n\
  \n### 注意：\n\n取决于要使用的命令或服务，执行它可能需要 root 权限。如果执行命令需要 root 权限，通常会在示例前面标记 `#`（例如 `#\
  \ command`）。\n\n* `addr2line` 参数：将地址转换为文件名和行号。\n    - 例：`addr2line -e a.out -j .text\
  \ 0xbdc`\n    - 注意：\n        - 这是 binutils 命令（https://www.gnu.org/software/binutils/）。\n\
  \        - 类别：编程\n\n* `alias alias_name=command`: 为命令创建别名。\n    - 例：`alias ai='sudo\
  \ apt-get install'`\n    - 注意：\n        - 与 `unalias` 命令相关或类似。\n        - 这是一个 Bash\
  \ 内置命令。\n\n\n\n\n\n### 分类：Shell\n\n#### acpi arguments\n显示电池状态和其他 ACPI 信息。\n- 示例：`acpi\
  \ --battery`\n- 注意：\n    - 与 `acpi_available` 命令相关（或类似命令）。\n    - 分类：系统\n\n####\
  \ acpi_available\n测试 ACPI 子系统是否可用。\n- 示例：`acpi_available; if [ $? -eq 0 ]; then\
  \ echo \"ACPI: Active\"; else echo \"ACPI: Inactive\"; fi` \n- 注意：\n    - 与 `acpi`\
  \ 命令相关（或类似命令）。\n    - 相关信息：`cat /proc/acpi`\n        - ACPI 状态信息文件\n    - 分类：系统\n\
  \n#### apropos [keyword|command]\n显示特定关键词的所有相关帮助手册（man pages）。\n- 示例：`apropos chroot`\n\
  - 注意：\n    - 与 `man` 命令相关（或类似命令）。\n    - 分类：Shell\n\n#### arch\n显示机器硬件名称。\n- 示例：`arch`\n\
  - 注意：\n    - 与 `setarch` 命令相关（或类似命令）。\n    - 等同于 `uname -m -OR- echo $HOSTTYPE`\n\
  \    - 该命令已在 UTIL-LINUX 中弃用。\n    - 完整文档见：[`www.gnu.org/software/coreutils/arch`](http://www.gnu.org/software/coreutils/arch)\n\
  \    - 这是一个 COREUTILS 命令。\n    - 分类：系统\n\n#### as arguments\nGNU 可移植汇编器。\n- 示例：`as\
  \ -o myfile.o myfile.S`\n- 注意：\n    - 与 `ld` 命令相关（或类似命令）。\n    - 这是一个 binutils 命令（https://www.gnu.org/software/binutils/）。\n\
  \    - 分类：编程\n\n#### at time_date\n在指定的日期时间执行命令。\n- 示例：`at 9:30 AM 05/10/2025`\n\
  - 注意：\n    - 与 `crontab`, `atq`, `atrm`, `batch` 命令相关。\n    - 分类：Shell\n\n#### atq\
  \ arguments\n列出用户等待中的 `at` 任务。\n- 示例：`atq -q 4`\n- 注意：\n    - 与 `at`, `atrm` 命令相关。\n\
  \    - 分类：Shell\n\n#### atrm arguments\n删除用户等待中的 `at` 任务。\n- 示例：`atrm 4`\n- 注意：\n\
  \    - 与 `at`, `atq` 命令相关。\n    - 分类：Shell\n\n#### base32 arguments file_name\n\
  对数据进行 BASE32 编码或解码并输出到 stdout。\n- 示例：\n    - (编码)：`echo This is a test... | base32`\n\
  \    - (解码)：`base32 -d`\n- 注意：\n    - 与 `base64` 命令相关。\n    - 完整文档见：[`www.gnu.org/software/coreutils/base32`](http://www.gnu.org/software/coreutils/base32)\n\
  \    - 这是一个 COREUTILS 命令。\n    - 分类：字符串/文本\n\n#### base64 arguments file_name\n\
  对数据进行 BASE64 编码或解码并输出到 stdout。\n- 示例：\n    - (编码)：`echo This is a test... | base64`\n\
  \    - (解码)：`base64 -d`\n- 注意：\n    - 与 `base64` 命令相关。\n    - 完整文档见：[`www.gnu.org/software/coreutils/base64`](http://www.gnu.org/software/coreutils/base64)\n\
  \    - 这是一个 COREUTILS 命令。\n    - 分类：字符串/文本\n\n#### bc arguments\n支持脚本的高精度计算器。\n\
  - 示例：`echo \"12+2\" | bc`\n- 注意：\n    - 与 `dc` 命令相关（或类似命令）。\n    - 分类：数学/时间\n\n\
  #### bind arguments\n显示 Bash 中所有按键绑定。\n- 示例：`bind -P`\n- 注意：\n    - 这是一个 Bash 内置命令。\n\
  \    - 分类：Shell\n\n#### builtin arguments\n带参数执行 SHELL-BUILTIN。\n- 示例：`builtin {\
  \ cd \"$@\"; pwd; }`\n- 注意：\n    - 这是一个 Bash 内置命令。\n    - 分类：Shell\n\n#### busybox\
  \ applet arguments\n被称为嵌入式 Linux 的“瑞士军刀”。\n- 示例：`busybox ls -l`\n- 示例：`busybox ping\
  \ example.com`\n- 注意：\n    - 当前可用 applet 包括：`acpid`, `adjtimex`, `ar`, `arp`, `arping`,\
  \ `ash`, `awk`, `basename`, `blkdiscard`, `blockdev`, `brctl`, `bunzip2`, `bzcat`,\
  \ `cal`, `cat`, `chgrp`, `chmod`, `chown`, `chpasswd`, `chroot`, `chvt`, `clear`,\
  \ `cmp`, `cp`, `cpio`, `crond`, `crontab`, `cttyhack`, `cut`, `date`, `dc`, `dd`,\
  \ `deallocvt`, `depmod`, `devmem`, `df`, `diff`, `dirname`, `dmesg`, `dnsdomainname`,\
  \ `dos2unix`, `dpkg`, `dpkg-deb`, `du`, `dumpkmap`, `dumpleases`, `echo`, `ed`,\
  \ `egrep`, `env`, `expand`, `expr`, `factor`, `fallocate`, `false`, `fatattr`, `fdisk`,\
  \ `fgrep`, `find`, `fold`, `free`, `freeramdisk`, `fsfreeze`, `fstrim`, `ftpget`,\
  \ `ftpput`, `getopt`, `getty`, `grep`, `groups`, `gunzip`, `gzip`, `halt`, `head`,\
  \ `hexdump`, `hostid`, `hostname`, `httpd`, `hwclock`, `i2cdetect`, `i2cdump`, `i2cget`,\
  \ `i2cset`, `id`, `ifconfig`, `ifdown`, `ifup`, `init`, `insmod`, `ionice`, `ip`,\
  \ `ipcalc`, `ipneigh`, `kill`, `killall`, `klogd`, `last`, `less`, `link`, `linux32`,\
  \ `linux64`, `linuxrc`, `ln`, `loadfont`, `loadkmap`, `logger`, `login`, `logname`,\
  \ `logread`, `losetup`, `ls`, `lsmod`, `lsscsi`, `lzcat`, `lzma`, `lzop`, `md5sum`,\
  \ `mdev`, `microcom`, `mkdir`, `mkdosfs`, `mke2fs`, `mkfifo`, `mknod`, `mkpasswd`,\
  \ `mkswap`, `mktemp`, `modinfo`, `modprobe`, `more`, `mount`, `mt`, `mv`, `nameif`,\
  \ `nc`, `netstat`, `nl`, `nproc`, `nsenter`, `nslookup`, `od`, `openvt`, `partprobe`,\
  \ `passwd`, `paste`, `patch`, `pidof`, `ping`, `ping6`, `pivot_root`, `poweroff`,\
  \ `printf`, `ps`, `pwd`, `rdate`, `readlink`, `realpath`, `reboot`, `renice`, `reset`,\
  \ `rev`, `rm`, `rmdir`, `rmmod`, `route`, `rpm`, `rpm2cpio`, `run-parts`, `sed`,\
  \ `seq`, `setkeycodes`, `setpriv`, `setsid`, `sh`, `sha1sum`, `sha256sum`, `sha512sum`,\
  \ `shred`, `shuf`, `sleep`, `sort`, `st`, `stat`, `strings`, `stty`, `sync`, `swap`,\
  \ `tail`, `taskset`, `telnet`, `top`, `touch`, `troute`, `true`, `truncate`, `tty`,\
  \ `uptime`, `wget`, `which`, `xxd`, `xz`。\n\n#### cal [date|year]\n显示当前月份的日历。\n\
  - 示例：`cal 2025`\n- 注意：\n    - 其他别名命令：`ncal`\n    - 分类：数学/时间\n\n#### chroot new_root_path\n\
  在新的根目录下运行命令或交互式 shell。\n- 示例：`# chroot /home/jane /bin/bash`\n- 注意：\n    - 完整文档见：[`www.gnu.org/software/coreutils/chroot`](http://www.gnu.org/software/coreutils/chroot)\n\
  \    - 这是一个 COREUTILS 命令。\n    - 分类：系统\n\n#### clear\n清除控制窗口文本。\n- 示例：`clear`\n\
  - 注意：\n    - 快捷键为 Ctrl+D。\n    - 分类：Shell\n\n#### colcrt arguments file_name\n对\
  \ NROFF 输出进行 CRT 预览。\n- 示例：`tbl exum2.n | nroff -ms | colcrt - | more`\n- 注意\n \
  \   - 与 `nroff`, `groff`, `troff` 命令相关。\n    - 这是一个 UTIL-LINUX 命令。\n    - 分类：文档处理\n\
  \n#### compgen arguments command\n根据选项显示可能的补全。\n- 示例：`compgen -c tree`\n- 注意：\n\
  \    - 这是一个 Bash 内置命令。\n    - 分类：Shell\n\n#### command arguments command\n执行命令或显示其信息。\n\
  - 示例：`command echo Hello`\n- 注意：\n    - 这是一个 Bash 内置命令。\n    - 分类：Shell\n\n####\
  \ compopt arguments name\n修改或显示补全选项。\n- 示例：`compopt -o nospace`\n- 注意：\n    - 这是一个\
  \ Bash 内置命令。\n    - 分类：Shell\n\n#### col arguments\n从输入中过滤反换行。\n- 示例：`man col |\
  \ col -bx`\n- 注意：\n    - 与 `col1` 命令相关。\n    - 这是一个旧命令。\n    - 这是一个 UTIL-LINUX 命令。\n\
  \    - 分类：字符串/文本\n\n#### colrm arguments\n删除文件中的列。\n- 示例：`ls -al | colrm 11 12`\n\
  - 注意：\n\n\n\n\n\n- 与 `column` 命令相关（或类似该命令）。\n- 这是一个 `UTIL-LINUX` 命令。\n- 类别：字符串/文本\n\
  \n### `column` 参数：将 STDIN 或文件的文本格式化为列。\n\n- 示例：`df -hPT | column -t`\n- 示例：`printf\
  \ \"PERM LINKS OWNER GROUP SIZE MONTH DAY \"; printf \"HH:MM/YEAR NAME\\n\"; ls\
  \ -l | sed 1d) | column -t`\n- 注意：\n    - 与 `colrm` 命令相关（或类似该命令）。\n    - 这是一个 `UTIL-LINUX`\
  \ 命令。\n    - 类别：字符串/文本\n\n### `coredumpctl` 参数：检索并处理保存的核心转储（core dumps）和元数据。\n\n\
  - 示例：`# coredumpctl dump chrome`\n- 更多示例：\n    - 列出名为 foo 的程序的所有转储：\n      ```\n\
  \      coredumpctl list foo\n      ```\n    - 对最后一个的核心转储调用 `gdb`：\n      ```\n \
  \     coredumpctl debug\n      ```\n    - 显示 PID 为 `6654` 的核心转储进程的信息：\n      ```\n\
  \      coredumpctl info 6654\n      ```\n    - 将 `/usr/bin/bar` 的最后一个核心转储提取到名为 `bar.coredump`\
  \ 的文件中：\n      ```\n      coredumpctl -o bar.coredump dump /usr/bin/bar\n      ```\n\
  - 注意：\n    - 必须安装，`sudo apt-get install systemd-coredump`\n    - 与 `gdb` 命令相关（或类似该命令）。\n\
  \    - 类别：系统/故障排除\n\n### `cpp` 参数文件名：一个宏处理器，C 编译器自动使用它在编译前对程序进行转换。\n\n- 示例：`cpp\
  \ -o hello hello.c; chmod a+x hello; ./hello`\n- 注意：\n    - 与 `gcc` 命令相关（或类似该命令）。\n\
  \    - 类别：编程\n\n### `crontab` 参数：显示当前用户所有的 CRONTAB 文件。\n\n- 示例：`crontab -l`\n- 注意：\n\
  \    - 与 `at` 命令相关（或类似该命令）。\n    - 类别：Shell\n\n### `ctrlaltdel` 参数：配置 Ctrl+Alt+Del\
  \ 组合键的功能。\n\n- 示例：`# ctrlaltdel hard`\n- 注意：\n    - 这是一个 `UTIL-LINUX` 命令。\n    -\
  \ 类别：Shell\n\n### `chvt` 参数：更改前景虚拟终端。\n\n- 示例：`#chvt 9`\n- 注意：\n    - `chvt N` 将\
  \ `/dev/ttyN` 设置为前景终端。\n    - 与 `openvt` 命令相关（或类似该命令）。\n    - 类别：Shell\n\n### `date`\
  \ 参数：显示和或格式化当前的日期和时间。\n\n- 示例：`date --date='@2147483647'`\n- 更多示例：\n    - 格式化今天的日期：\n\
  \      ```\n      today=$(date +%d-%b-%Y); echo $today\n      ```\n- 注意：\n    -\
  \ 完整文档位于：[`www.gnu.org/software/coreutils/date`](http://www.gnu.org/software/coreutils/date)\n\
  \    - 这是一个 `COREUTILS` 命令。\n    - 类别：数学/时间\n\n### `dc` 参数文件名：任意精度计算器（可以使用逆波兰表示法）。\n\
  \n- 示例：参阅 man 页获取更多信息：\n  ```\n  echo '6 9 * p' | dc\n  ```\n- 注意：\n    - `dc` 是最古老的\
  \ Unix 工具之一，早于 C 语言出现。它有一套强大的功能，但使用起来比 `bc` 命令困难。下面的示例显示了这两个命令之间的区别：\n      ```\n\
  \      echo '6 9 * p' | dc\n      echo '6 * 9' | bc\n      ```\n    - 与 `bc` 命令相关（或类似该命令）。\n\
  \    - 类别：数学/时间\n\n### `deallocvt` 参数：释放使用的虚拟终端。\n\n- 示例：`deallocvt 66`\n- 注意：\n\
  \    - 与 `chvt` 命令相关（或类似该命令）。\n    - 类别：Shell\n\n### `depmod` 参数文件名：生成模块 .dep 和\
  \ map 文件。\n\n- 示例：`# depmod -a`\n- 注意：\n    - 与 `modprobe` 命令相关（或类似该命令）。\n    -\
  \ 类别：编程\n\n### `dumpkeys` 参数：转储键盘翻译表。\n\n- 示例：`dumpkeys --funcs-only`\n- 注意：\n \
  \   - 与 `loadkeys` 命令相关（或类似该命令）。\n    - 类别：Shell\n\n### `enable` 参数文件名：启用或禁用内置 shell\
  \ 命令。\n\n- 示例：`enable -a`\n- 注意：\n    - 这是一个内部 Bash 命令。\n    - 类别：Shell\n\n### `exec`\
  \ 参数命令：用指定的命令替换当前的 shell。\n\n- 示例：运行受限制的 Bash shell：\n  ```\n  exec rbash\n  ```\n\
  - 注意：\n    - 允许执行的命令完全替换当前的 shell 进程。\n    - 这是一个内部 Bash 命令。\n    - 类别：Shell\n\n\
  ### `exit`：退出当前 shell。\n\n- 示例：`exit`\n- 注意：\n    - 按 Ctrl+D 作为快捷键。\n    - 这是一个内部\
  \ Bash 命令。\n    - 类别：Shell\n\n### `expr` 表达式：计算给定的表达式。\n\n- 示例：`expr 10 \\* 20`\n\
  - 注意：\n    - 与 `bc` 命令相关（或类似该命令）。\n    - 完整文档位于：[`www.gnu.org/software/coreutils/expr`](http://www.gnu.org/software/coreutils/expr)\n\
  \    - 这是一个 `COREUTILS` 命令。\n    - 类别：数学/时间\n\n### `factor` 数字：显示给定数字的最小公倍数因子。\n\
  \n- 示例：`factor 42`\n- 注意：\n    - 与 `expr` 命令相关（或类似该命令）。\n    - 完整文档位于：[`www.gnu.org/software/coreutils/factor`](http://www.gnu.org/software/coreutils/factor)\n\
  \    - 这是一个 `COREUTILS` 命令。\n    - 类别：数学/时间\n\n### `fc` 参数命令：从历史列表中从编辑器加载命令。\n\n\
  - 示例：`fc 2024`\n- 注意：\n    - 与 `history` 命令相关（或类似该命令）。\n    - 这是一个内部 Bash 命令。\n\
  \    - 类别：Shell\n\n### `fc-cache` 参数：在扫描目录后显示字体缓存信息。\n\n- 示例：`fc-cache -v`\n- 注意：\n\
  \    - 与 `fc-list`, `fc-validate`, `fc-scan`, `fc-query`, `fc-pattern`, `fc-match`,\
  \ `fc-cat`, `fc-validate`, `fc-cache` 命令相关。\n    - 更多信息：`lynx /usr/share/doc/fontconfig/fontconfig-user.html`\n\
  \    - 类别：系统\n\n### `fc-cat` 参数目录名：从缓存文件中读取字体信息。\n\n- 示例：`fc-cat /usr/share/fonts/type1/gsfonts`\n\
  - 注意：\n    - 与 `fc-cache`, `fc-list`, `fc-validate`, `fc-scan`, `fc-query`, `fc-pattern`,\
  \ `fc-match`, `fc-cat`, `fc-validate`, `fc-cache` 命令相关。\n    - 更多信息：`lynx /usr/share/doc/fontconfig/fontconfig-user.html`\n\
  \    - 类别：系统\n\n### `fc-list` 参数：显示系统上可用字体列表。\n\n- 示例：`fc-list : family style file\
  \ spacing`\n- 注意：\n    - 与 `fc-cache`, `fc-list`, `fc-validate`, `fc-scan`, `fc-query`,\
