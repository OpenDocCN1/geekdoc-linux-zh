  \n[content]\n\n\n\n将以下行复制到创建的文件中：\n\n```bash\n#!/bin/bash\n\nLINES=$(tput lines)\n\
  \nCOLUMNS=$(tput cols)\n\ndeclare -A snowflakes\n\ndeclare -A lastflakes\n\nclear\n\
  \nfunction move_flake() {\n i=\"$1\"\n  if [ \"${snowflakes[$i]}\" = \"\" ] || [\
  \ \"${snowflakes[$i]}\" = \"$LINES\" ]; then\n  snowflakes[$i]=0\n  else\n    if\
  \ [ \"${lastflakes[$i]}\" != \"\" ]; then\n      printf \"\\033[%s;%sH \\033[1;1H\
  \ \" ${lastflakes[$i]} $i\n    fi\n  fi\n  printf \"\\033[%s;%sH*\\033[1;1H\" ${snowflakes[$i]}\
  \ $i\n  lastflakes[$i]=${snowflakes[$i]}\n  snowflakes[$i]=$((${snowflakes[$i]}+1))\n\
  }\n\nwhile :\ndo\n  i=$(($RANDOM % $COLUMNS))\n  move_flake $i\n  for x in \"${!lastflakes[@]}\"\
  \n  do\n   move_flake \"$x\"\n  done\n# 如果运行太快，仅使用此行来减速。\n#sleep 0.1\ndone\n```\n\
