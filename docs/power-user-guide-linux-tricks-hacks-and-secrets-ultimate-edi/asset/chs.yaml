  \n## LVM（逻辑卷管理）\n\n`LVM`（Logical Volume Management）子系统的工作方式与传统文件系统在块存储设备上的工作方式不同。`LVM`\
  \ 获取多个块存储设备的容量，并将它们显示为一个统一的更高容量设备。\n\n### LVM 存储管理结构\n\n`LVM` 将几个不同设备的物理存储组合成一个更大的存储设备。如果需要，可以将此存储分割成更小的任意逻辑卷，并呈现给文件系统。\n\
  \n#### LVM 存储抽象层\n\n`LVM` 有三层存储抽象，它们是：\n\n- **物理卷**（前缀：`PV`）：被 `LVM` 利用的物理块存储设备（即物理驱动器、`RAID`\
  \ 阵列等）是更高层次抽象的基础层。\n- **卷组**（前缀：`VG`）：将物理卷组合成一个卷组，将其抽象为看起来像一个更大的存储设备。它作为一个逻辑设备运行，利用了物理卷组合后的存储容量。\n\
  - **逻辑卷**（前缀：`LV`）：卷组可以分解为多个逻辑卷，其功能类似于物理存储上的分区。这些逻辑卷被呈现给文件系统作为独立的存储设备。逻辑卷是用户和应用程序交互的主要层。\n\
  \n### 区 (Extents)\n\n`LVM` 的强大之处源于对 `Extents`（区）的使用。`Extents` 是组成卷的固定大小的分段数据单元。一组卷组成一个卷组。卷组配置控制\
  \ `extents` 的大小，该组中的所有卷具有相同的区大小。\n\n`LVM` 支持两种类型的 `extents`：物理和逻辑的。`physical extents`（物理区）被物理卷利用。`logical\
  \ extents`（逻辑区）被逻辑卷利用。`LVM` 中的逻辑卷由逻辑区与物理区之间的映射组成，该映射由子系统维护。由于这种关系，区是 `LVM` 可以分配的最小存储单元。\n\
  \n之所以有两种类型的 `extents`，是因为 `logical extents` 以统一存储设备的形式呈现给文件系统。而 `physical extents`\
  \ 可以由 `LVM` 子系统在不同的物理存储设备之间复制或重组，且不会中断用户。这允许通过向卷中添加或删除 `extents` 来扩展或缩小逻辑卷。这两种类型区之间的关系赋予了\
  \ `LVM` 灵活性。\n\n**物理卷（单个存储设备）：**\n- 存储设备 1（例如 `/dev/sda1`）-> `Extents`（可以复制）\n-\
  \ 存储设备 2（例如 `/dev/sdb1`）-> `Extents`（可以复制和重组）\n- 存储设备 3（例如 `/dev/sdc1`）-> `Extents`（可以复制和重组）\n\
  \n**逻辑卷**\n- `Logical Volumes`（映射回物理区）\n\n**卷组**\n- `Logical Volumes`（类似于物理存储上的分区）\n\
  \n**文件系统**\n**系统文件和目录**\n\n## 虚拟硬件 vs 物理硬件\n\n本节分解了通用计算机系统的物理与虚拟硬件子系统。你会发现物理硬件包含的组件多得多。\n\
  \n在虚拟系统中，你只能可以使用底层底层硬件兼容的驱动程序。在物理系统中，你必须提供安装在硬件上的驱动程序。\n\n### 虚拟机（虚拟机管理器/云）\n\n\
