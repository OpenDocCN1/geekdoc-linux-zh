  \    * 与 `gdbus` 命令相关（或相似）。\n        * 类别：X-Windows\n\n* `gdbus arugements`：用于 D-Bus\
  \ 对象的工具。\n    * 示例：`gdbus introspect --system --dest org.freedesktop.UPower --object-path\
