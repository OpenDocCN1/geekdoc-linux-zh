  \ `zic` 命令相关（或相似）。\n        - 分类：数学/时间\n\n## 进程管理\n\n以下是系统和应用程序进程命令列表，与操作系统以及运行在其之上的程序和服务相关。这些命令用于启动和管理（即显示、停止、启动等）进程和服务。\n\
  \n注意：\n取决于将要使用的命令或服务，它可能需要 root 权限才能执行。如果执行某个命令需要 root 权限，通常会在示例前用 `#` 符号表示（例如 `#\
  \ command`）。\n\n- `batch arguments`：在系统负载水平允许时执行命令。\n    - 示例：`rm -rf /large/directory/*\
  \ | batch`\n    - 注意事项：\n        - 与 `at` 命令相关（或相似）。\n        - 分类：进程\n\n- `bg process_id`：显示所有后台进程及其相关的\
  \ `jobs_id`。\n    - 示例：`bg 554`\n    - 注意事项：\n        - 与 `fg`、`jobs` 命令相关（或相似）。\n\
  \        - 这是一个 Bash 内置命令。\n- 分类：进程\n\n- `chrt arguments command`：管理进程的实时调度属性。\n\
