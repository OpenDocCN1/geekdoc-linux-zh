  -   `ssh-add` 参数 `file_name`: 将私钥身份添加到身份验证中。\n    -   示例：`ssh-add ~/.ssh/jane-aws-key`\n\
  \    -   备注：\n        - 与（或类似）`ssh` 命令相关。\n        - 这是一个 openssh 命令。\n        -\
  \ 类别：通信\n\n-   `ssh-agent` 参数 `file_name`: 保留用于单点登录的私钥。\n    -   示例：`eval $(ssh-agent\
