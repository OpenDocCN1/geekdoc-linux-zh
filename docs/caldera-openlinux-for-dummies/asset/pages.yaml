    echo Hi there and press the Enter key, then Hi appears on the next line. If you
    type the command line echo 5342 and press Enter, then 5342 on the line.


    But after you type echo * in your reports directory and press Enter, something
    different from * appears on the next line. What is the name of every file or directory
    in the reports directory, because bash sees the * as a regular expression and
    expands it to match every filename or directory in the directory that does not
    begin with a period. That expanded line is then presented to the echo command.


