  md: '# 100 Part II: Installing OpenLinux


    The upshot of this protection is that no one can do anything in an OpenLinux system
    without a username and password. The benefit is that no one can ruin your stuff
    without your username and password (unless, of course, that person has the superuser
    password).


    As a first step, log in by using the regular user account that you created during
    the installation. The name of this account probably matches your name.


    You can also log in root, which is the username for the OpenLinux supervisor.
    The superuser is a privileged account that enables a person to go anywhere and
    do anything in the system. Superusers can add disk drives, create backups, restore
    damaged files, and turn the system off and on. Superusers can also damage the
    system if they make a mistake. Superusers are all-powerful, their mistakes can
    be all-bad.


    You can log in root anytime, because you know the root password for the system
    that you installed (and you best not forget it). Logging in as root is dangerous,
    because you can destroy things very easily as you figure out OpenLinux. For that
    reason, you''re better off log in by using your regular account and switch temporarily
    to the root account to complete any administrative tasks that require superuser
    privileges.


    Now you''ve entered your username and password in the graphical login screen.


    You don''t see the password as you type it in the dialog box on screen. This secrecy
    ensures that your coworkers, who may be watching over your shoulder, won''t see
    the password and later try to log in as you. (So much for trust in the workplace.)
    If you enter the wrong password, then the graphical login screen returns so that
    you can try entering your password again.


    # Starting Your KDE Desktop


    After you enter your username and password, the KDE Desktop appears, as shown
    in Figure 7-2. The KDE Desktop is the main working environment for OpenLinux.


    KDE includes a main menu that you open by clicking on the K icon (shown in Figure
    7-3), a desktop background where you can store frequently used programs, and a
    complete set of graphical configuration tools.


    ![](img/3c04420fbc1d01311e6031144afaecd2_125_0.png)'
