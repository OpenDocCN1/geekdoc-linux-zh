  md: '# 282 Part V: Going Online


    # Surfing with the proper footing


    Before you start to surf the Web, you need the proper footing. To navigate to
    a Web site, you type or click a URL (Uniform Resource Locator). After you know
    at least one URL, moving to other places on the Web is usually easy. URLs look
    like this:


    page. If your browser doesn''t take you to another Web page location when you
    click, the culprit is usually one of the following:


    +   - The page that you''re viewing hasn''t been updated recently, and the page
    to which you are pointing no longer exists.


    ```

    http://www.openlinux.org/

    ```


    or this:


    ```

    www.openlinux.org/

    ```


    Some browsers let you omit the http://. Some browsers allow you to omit the trailing
    slash, unless the final segment is a filename.


    +   - The server system is running, but it''s under too much of a load because
    too many users are trying to get to that page. For example, this problem happens
    when the eBay server gets a new load of Beanie Babies to sell.


    In the old days spotting a link on a Web page was easy because the link was underlined
    and usually in blue text. Now it''s not simple. The best way to locate a link
    is to move your mouse pointer to a part of the Web page and see if the pointer
    changes from an arrow to a hand with a pointing index finger. If so, the hand
    indicates a link that you click to jump to a different Web


    +   - Your network connection is down, either from you to your ISP or from your
    ISP to the requested Web site.


    When surfing the Net, be patient. Even on the best days downloading certain pages
