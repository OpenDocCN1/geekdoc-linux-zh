  md: '# Chapter 5: Installation: Down to the Final Stretch


    +   - Minimum Installation: No graphics support, requires only 170 MB, good for
    experimenting or creating a minimal OpenLinux system for testing.


    +   - Standard Installation: A good choice, requires 650 MB of hard-disk space.


    +   - All Packages: Requires about 1.4 GB of disk space. Installs everything on
    the CD.


    +   - Business Workstation: Installs software determined by Caldera to be useful
    for business users running OpenLinux as their desktop operating system.


    +   - Development Workstation: Installs tools useful for using OpenLinux as a
    software development platform.


    +   - Home Computer: Installs programs useful to home users, including Internet
    connectivity tools.


    +   - Network Server: Installs a collection of Internet services and networking
    utilities and protocols.


    +   - Web Server: A small installation focused on the Apache Web server and supporting
    utilities.


    +   - Custom selection (floppy): If you set up a floppy disk with installation
    instructions (which we''re not showing you how to do), then choose this option.


    If you don''t have enough hard-disk space for some options, those options won''t
    be active on the list. Also, remember that you can easily add packages by using
    the graphical package manager after you finish the installation, don''t feel as
