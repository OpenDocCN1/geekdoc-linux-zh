    This command lists all the files in your /etc directory. Because this directory
    holds a troubleshoot of files, the information scrolls down your screen faster
    than you — or Evelyn Wood graduate — can read it. You can, however, correct this.


    With a process called piping, OpenLinux uses the output from one command as the
    input for another. Piping information isn''t as confusing as it sounds. In the
    last example, you had too much information — or output — to fit on one'
