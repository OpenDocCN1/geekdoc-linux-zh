  md: '# Chapter 11: Windows on the World


    KDE comes with about a hundred wallpaper graphics. All these wallpapers are small
    graphics that are intended for use as tiled images. You may also have a large
    image that you want to use as a single, centered on your desktop. Any image in
    a standard graphics format, such as jpg or gif, can be used as a wallpaper graphic.
    Just choose the Browse button to select the graphic file that you want, and then
    choose the appropriate arrangement of that graphic from the Arrangement drop-down
    list.


    ![](img/3c04420fbc1d01311e6031144afaecd2_226_0.png)


    If you have trouble selecting a wallpaper among the hundred or so provided with
    KDE, choose the Random checkbox and then choose the Setup button next to it. Add
    to all the wallpapers you want and set a delay time for how often the wallpaper
    images randomly are to be selected from the list you''ve created in the Setup
    dialog box.


    # Choose a screen saver


    Choosing a screen saver is not the most important task that you do with your OpenLinux
    system. Most monitors automatically shut down to an energy-saving mode, you may
    not even see the screen saver that you select. nevertheless, KDE provides many
    fun screen savers that they''re worth exploring.


    The Screensaver item in the Desktop section of the Control Center is shown in
    Figure 11-17. In this tab you can choose a screen saver from the list of about
    twenty screen savers that come with KDE. As you choose an option, a miniature
    version of the screen saver appears in the window above the list.


    ![](img/3c04420fbc1d01311e6031144afaecd2_226_1.png)


    The password option provides good security if you work in a place where strangers
    may wander by while you''re away from your desk. By entering your password times
    may become annoying if you don''t work regularly on your OpenLinux system.


    The funnest part of screen savers is setting up the screen savers and testing
    them. Click the Setup button below the list of screen savers. A different dialog
    box appears, based on the screen saver that you select. For example, Figure 11-18
    shows the setup dialog box for the Science screen saver. In this dialog box you
    choose the shape, speed, intensity, and size of the distortion used for the screen
    saver. Not all setup options are this complex, of course.'
  merge: -1
  pgno: 226
