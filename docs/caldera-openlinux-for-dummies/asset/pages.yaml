  md: '# Chapter 5: Installation: Down to the Final Stretch 73


    # All about files


    OpenLinux refers to UNIX, refers to everything as a file. In other words, drive
    is the name for a device, as a hard drive, is the file address of its driver.
    For example, /dev/hda is the name of the first IDE hard drive and /dev/sdb is
    the name of the second SCSI hard drive.


    OpenLinux refers to disks and disk partitions using a system of letters and numbers,
    which may seem confusing to the DOS or Windows user. Following is a short description
    of the naming conventions for hard drives and partitions.


    Letters refers to the device on which the partition is located. IDE hard drives,
    for example, are hda, hdb, hdc, and on. SCSI drives are referred to sda, db,


    sdc, and so on. (The hd stands for hard drive, and the sd stands for SCSI drive.)


    Numbers designates the partitions. The BIOS that PC hardware supports only four
    partitions, but one partition may be an extended partition, that, is subdivided
    into more logical partitions. The numbers 1, 2, 3 and 4 denote primary partitions;
    the logical partitions start at 5. For example,/dev/hdb3 is the name of the third
    partition on the second IDE hard drive. In a SCSI world, /dev/sdc6 is the name
    for the second logical partition on the third SCSI hard drive.


    ![](img/3c04420fbc1d01311e6031144afaecd2_98_0.png)


    Your task in this screen is to set up two partitions on your hard disk. One partition
    is for the Linux swap partition, which is used for virtual memory storage (like
    extra RAM stored on the hard disk). The swap partition should be between 32 and
    128 MB, depending on how much space you can spare on your hard disk and how much
    RAM you have.


    The second partition is for OpenLinux itself. This partition is as large as it
    needs to be, based on the type of system that you want to install (we cover that
    shortly). We recommend having at least 500 MB for the Linux partition.


    To set up these partitions, select the Add logical button if you have empty space
    from to create the partitions or select an existing partition and choose Edit.
    In either case you open a dialog box and specify the following:


    +   - Partition Size: Change the Start and End cylinders as needed to make the
    size (to the right of the End field) match what you want the size to be.


    +   - The System Type: You need one Linux Swap and one Linux partition. The system
    type is shown in the System field on the main part of the Partition Hard Disk(s).


    +   - The Mount Point: This feature is the access point for the partition within
    OpenLinux. The Linux partition doesn''t have a mount point; the Linux partition
    should have a mount point of /. Choose this from the drop-down list.'
  merge: -1
