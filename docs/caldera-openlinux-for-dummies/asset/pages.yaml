  md: '# Chapter 3: Discovering What''s in Your System


    +   Hard disk: An OpenLinux minimal installation requires 200MB of hard disk space,
    but for the standard installation (which includes the graphical desktop interface)
    you need about 650MB. By the time you install all the goodies, as WordPerfect,
    a few games and utilities, and other stuff you download from the Internet, you''ll
    be glad if you have a total of 1GB or more to hold it all. When considering whether
    your system needs more hard-disk space or more RAM, remember that as a general
    rule, more is usually better.


    Available space isn''t the only hard-disk issue you should be aware of. You also
    need to know how many hard drives you have, and what is each drive''s size and
    order (which one is first, second, and so on?). We discuss other hard-disk concerns
    in "Drives," later in this chapter.


    +   Disk controllers: How many do you have, and what are their types (IDE, SCSI?)
    Which hard-disk drives are connected to which controllers? If a SCSI controller
    is installed in your machine, what is its name and model number? We discuss this
    in greater detail in "Disk controllers," later in this chapter.


    +   CD-ROM: You usually install Openlinux from a CD-ROM by booting your computer
    directly from the CD-ROM drive. Openlinux can detect and use standard IDE/ATAPI
    and SCSI CD-ROM drives (the device interfaces found in most recent computers),
    as well as of of the early, non-IDE drives that attached to sound cards and other
    devices.


    Some computers don''t allow you to boot from a CD-ROM drive, so you may have to
    create a floppy diskette to boot the Linux installation or use one of the other
    methods described in the following sections.


    +   Mouse: What type of mouse do you have - a bus mouse, a PS/2 mouse, or a serial
    mouse? How many buttons does your mouse have? If you have a serial mouse, what
    COM port is it attached to and what protocol does it use (such as Microsoft or
    Logitech?) The installation program normally detects your mouse, but you may have
    to select a serial port if the mouse cannot be detected.


    +   Monitor: What is the make and model of the monitor? You can normally choose
    your monitor from a very large list of monitor manufacturers and models. If yours
    is not listed, you need to know the monitor''s vertical and horizontal refresh
    rates.


    +   Video card: What is the make and model number of the video card or video-chip
    and the amount of video RAM? Openlinux supports hundreds of video cards. Even
    if your card isn''t supported directly, Openlinux may support your card as a VGA,
    XGA, SVGA, or other graphical hardware standard video card. Most video cards that
    have been available for a while are supported, and many of the latest models include
    at least basic support (although support for the lancy 3D features may be missing
    on some cards).


    ![](img/3c04420fbc1d01311e6031144afaecd2_62_0.png)'
