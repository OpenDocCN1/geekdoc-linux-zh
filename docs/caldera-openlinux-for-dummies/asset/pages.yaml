  md: '# 260 Part V: Going Online


    To find a good ISP, first look in the local Yellow Pages under Internet or Internet
    Service Providers. List the names and telephone numbers of any ISPs that you find.
    These companies probably are local companies, which is fine if you want to communicate
    only from your home. If you do a lot of traveling, you may want to call the following
    national providers:


    AT&T WorldNet: 800-967-5363

    IBM Global Network: 800-888-4103

    CompuServe: 800-336-6823


    Next, talk to some friends who live close to you and ask which ISP they use and
    what they think of the service. If a service has overused local access numbers,
    you often get busy signals. Also ask about the technical help, which in some services
    is poor or nonexistent.


    Finally, call the ISPs and tell them you have a Linux system and are interested
    in PPP services, with e-mail and newsgroups. Find out whether the ISPs have access
    numbers in your local calling area. Otherwise, you may end making a long-distance
    call each time you connect. Check their prices and whether they have unlimited
    service (a flat rate no matter many hours you''re logged in). A typical price
    for unlimited service is $20 to $30 per month. ISPs that host Web pages are a
    plus, as they can filter junk e-mail, or spam.


    Now is a good time to verify that your own telephone service is billed at a flat
    rate and not metered.


    Tell the ISP the highest speed of your modem. You''ll probably need to supply
    a login name and a password for the ISP''s server, you may want to write these
    down ahead of time.


    A young friend of mine from Poland came to visit me. He had obtained a nationwide
    ISP service to keep in touch through the Internet with family and back home. Unfortunately,
    the closest number to his ISP connection was a long-distance call from my house.
    I cautioned him to watch his connection time, so that I wouldn''t have a lot of
    long-distance charges. He assured me that he would. The month after he went back
    to Poland, I received my phone bill—with $70 in long-distance telephone charges
    to his Internet provider. Hi Anton!


    After you choose your Internet service and arrange payment, the ISP provides you
    with certain pieces of information, including the following:


    +   - Telephone access numbers

    - A username (usually the one you want)

    - A password (usually the one you supply)

    - An e-mail address, which is typically your username added to its domain name


    ![](img/3c04420fbc1d01311e6031144afaecd2_285_0.png)'
