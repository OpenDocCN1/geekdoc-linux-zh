  md: '# Chapter 17: Sources of Help 299


    # CeBIT


    CeBIT, the largest computer trade show in the world, is held yearly in Hannover,
    Germany. It often draws more than 600,000 people. In recent years, Linux International
    (www.li.org) has a booth along with several other Linux vendors. The Linux area
    at CeBIT drew thousands of visitors. CeBIT is mostly a trade show, with very little
    (if any) conference sessions on Linux. To find out more about CeBIT, check out
    www.messe.de.


    # Try to Help Others


    You''ve exhausted all avenues of help (or maybe even before), you should just
    try to do whatever you can. Often, you find that the pieces fit or that the software
    is not as difficult as you thought it would be. Here are some tips:


    +   - If you''re investigating a large software package, scan the documentation
    one time and concentrate on the necessary topics.


    I still remember the first time I tried to learn goof(1), a powerful text-processing
    system. The documentation was daunting, and I thought I''d never learn the package.
    I was right; I never learned it. But I did learn enough to do a few things, which
    was all I needed. With those "simple things" (less than 2 percent of the package),
    I can write letters, create overhead slides, and process necessary text. If I
    need another command, I looked it up in a reference book.


    +   - Create a small sample of what you want to do.


    If you''re working with a new command or part of OpenLinux, create a small example
    of the one part of the command or software that you don''t know and see how that
    works.


    +   - Keep it simple.


    A friend of Maddox''s named Mike Gancarz (Hi Mike!) wrote a book called The Philosophy
    of UNIX. In this book, Mike talks about how UNIX systems were created and programmed
    in the early days, utilizing lots of the small, cryptic (we prefer the word terse)
    commands that lurk below the glossy interface of the graphical interfaces we use
    now. With these commands, you can create powerful programs called shell scripts,
    or you can just use the commands one at a time to transform your data. The main
    tenor of Mike''s book is to keep things small and simple.


    +   - Remember that OpenLinux is only a piece of code, and your computer is only
    a machine.


    ![](img/3c04420fbc1d01311e6031144afaecd2_324_0.png)'
  merge: -1
