  md: '# 256 Part IV: Maintaining Your System


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=50

    other=/dev/hd1

    label=dos

    table=/dev/hda

    image=/boot/mlinuz

    label=linux

    root=/dev/h2

    read-only

    ```


    The first line, boot=/dev/hda, means the master boot block is on device /dev/hda.
    If you want to create a LILO boot file on a floppy disk, you make this line boot=/dev/fd0.
    The second line shows a file that shows Linux looks inside. The third line shows
    where to get a boot block. For now, let''s leave these three lines alone.


    The prompt line means you want to be prompted for multibooting operations (using
    LILO to boot more than one operating system), and you want the LILO program to
    wait at least 50 seconds before booting the default operating system, which in
    this case is dos. When this system was installed, dos was loaded on the first
    partition of /dev/hd1, and when you press the Tab key after the boot prompt appears,
    you see dos as one of the labels for which operating system to choose and linux
    as the other label. The next section of the /etc/lilo.conf file, starts with image=/boot/mlinuz,
    describes the LILO part of the boot process. Note here that the image is located
    in /boot/mlinuz. You may want to change this to place the image in /mlinuz, which
    is more standard in OpenLinux systems, and where the zilo command ends up putting
    the new kernel.


    The final entries tell LILO that your root file system is /dev/hda and that it
    should be mounted read-only until it has a chance to be checked by fsck.


    Please remember that all disk names, such as /dev/hda2, as well as the layout
    are only examples; your system may have a different layout and no DOS to act as
    a second operating system to boot. In your case, lilo.conf will be a lot smaller
    and simpler, and just as effective.


    After you''ve updated the /etc/lilo.conf file to reflect the configuration of
    your system and a new copy of the kernel is at /mlinux (you may want to check
    the date and timestamp on the file to make sure it''s the latest one), you can
    type the fifo command and update the master boot record. The next time you boot,
    you''ll be running your rebuilt kernel.


