    of the Trash.


    # May I Please . . .


    Files and directories in OpenLinux have owners and are assigned a list of permissions.
    This system of ownership and permissions forms the basis for restricting and allowing
    access to files. File permissions also can be used to decide whether a file is
    executable as a command and to determine who can use the file or command. Knowing
    how file permissions operate is important because if you''re the only one who
    uses your system, commands and databases are owned by other users, including root
    (the super). Permissions on these files either allow or disallow you — the general
    user — from updating these files.


    Using the -l option allows you to see the permissions of the files, along with
    other relevant information, such as who owns the file, what group of people have
    permission to access or modify the file, the size of the file or directory, the
    last time the file was modified, and the name of the file.


    To take a look at a few simple file permissions, start by creating a new file
    with the touch command. The touch command is used for many things inside the UNIX
    and OpenLinux communities and is great for creating a zero-length file:


    ```

    touch test

    ls -l test

    -rw-r--r-- Owner group 0 Oct 31 16:00 time time

    ```'
