  md: '# # Appendix B


    # # The OpenLinux man Pages


    In This Appendix


    +   - Starting the `man` command

    - Reading the man pages

    - Finding commands


    All UNIX and Linux systems are largely made up of small, terse commands that are
    executed on the command line. Typically, each command is associated with at least
    one man page, which has nothing to do with gender. In OpenLinux the `man` stands
    for *manual*.


    At one time, the man pages were the only documentation that came with UNIX systems.
    Somewhere Maddog still has the thin book he received as a first-time UNIX user
    and systems administrator. The book contains only the man pages, and from those
    pages Maddog was supposed to install a UNIX system. Years later, Maddog still
    looks first at the man pages to get a quick idea of what a command does and what
    arguments to use or what values to set on the command line.


    This appendix shows you how to use the `man(1)` command, how to read and understand
    the man pages, and how to locate other man pages that may help you understand
    the OpenLinux command you''re investigating.


    # # Viewing an OpenLinux Manual Page


    To start using the man pages, follow these steps:


    +   - With OpenLinux up and running, log in as a user (either a general user or
    root).

    - Type `man`.


    The system asks what manual page you want. The syntax of the `man` command (like
    many other commands) requires at least one argument.'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# 3. Supply an argument by typing man man.


    The first man is the command name, and the second man tells Linux that you want
    information on the manual program itself. The system may tell you to wait a moment
    while it formats the page to your screen, and it displays the reference page for
    the man command.


    4. If a colon () appears at the bottom of the screen, press the spacebar to see
    the next page, or use the arrow keys to maneuver around the pages.


    5. To quit the program, press q.


    # Sections in the man Pages


    The man pages are found in several directories throughout your OpenLinux system:


    +   - /usr/man

    - /usr/local/man

    - /usr/X11R6/man


    Each directory is broken up into subdirectories representing sections of the manual,
    as follows:


    +   - man1: User commands

    - man2: System calls

    - man3: Library functions

    - man4: Special files

    - man5: File formats

    - man6: Games (look at everyone going to that section!)

    - man7: Miscellaneous

    - man8: System administration commands

    - mann: nroff, troff, and groff (and now tk) macros


    Note that most directories have more than one section.


    Two sections may have an entry for a command of the same name. For example, section
    1 has an open command, and section 2 has an open system call. To make sure that
    you''re reading about the right section, you can specify the command on the man
    command line. For example:


    ```

    [maddog@localhost maddog]$ man2 open

    ```'
  merge: -1
  pgno: 351
- img_proc: true
  md: '# Appendix B: The OpenLinux man Pages 327


    Most sections of the man database (which is basically what man is — a database)
    have two parts:


    +   - An intro page represented by a file called intro.n, where the n is a number
    that corresponds to the section number.


    +   - All commands, calls, library names, and filenames, represented by files
    with the name command.n, where n is the section number name.


    If you use cd to change to the /usr/man/man1 directory and issue the ls command,
    then you see files, such as cat.1.gz and grep.1.gz. Oddly, you don''t find a file
    called cd.1.gz, because the grep command is built into the different shells, and
    its documentation is covered in the bash.1.gz file, or the csh.1.gz file.


    Because man pages are actually a type of text file, they can take up lots of space.
    To conserve space on your system, all the man pages are stored in a compressed
    format, which is what the gz ending indicates on the man page files. When you
    use the man command to view a man page, the file is decompressed as it''s viewed.
    If you want to see what the raw man page text looks like, then try this command:


    ```

    zcat /usr/man/man1/ls.1.gz | less

    ```


    ![](img/3c04420fbc1d01311e6031144afaecd2_352_0.png)


    If you''re using bash as a shell, then you can get information about the rest
    of the built-ins with this:


    ```

    help

    ```


    The intro page briefly describes the section of the manual and whether you need
    to know anything special about that section. Printing an intro page is simple
    by executing, for example:


    ```

    man 2 intro

    ```


    ```

    or

    ```


    ```

    man 3 intro

    ```


    # Topics in the man Pages


    Each man page is made up of several sections. In this part, we list the sections
    we think are most important in your quest to understand how to read man pages.
    Note that some man pages don''t contain all these sections, and other pages contain
    more sections than those outlined here.'
  merge: -1
  pgno: 352
- img_proc: true
  md: '# 328 Part VII: Appendixes


    # Name


    The name is usually the command name, followed by a hyphen, followed by a one-line
    description of the command''s functionality. This brief description of the command
    is usually what you see if you execute a man command. Either of these commands,
    when followed by a word, lists the name field from every manual page that contains
    that word. Type the following:


    ```

    apropos cat

    ```


    Your apropos command may produce few or no commands, perhaps because no one has
    generated the database made up of command names and descriptions. To generate
    the database, either you or your systems administrator must become superuser or
    root and then execute the following command:


    ```

    /usr/sbin/makewhatis

    ```


    # Synopsis


    The synopsis is a shorthand way to describe what the command is looking for in
    an argument list. For example:


    ```

    lpq [-1] [-Printer] [job # ...] [user ...]

    ```


    is the synopsis for the lpq command (whose job is to show what''s in the print
    queue. The command name (lpq) comes first, followed by a series of bracketed arguments.
    If an argument is enclosed in square brackets, then the argument is optional,
    which means the lpq command needs no arguments.


    ```

    lpq

    ```


    you''ll probably get a no entries message (meaning that nothing is waiting to
    be printed) or a list of people''s jobs that are waiting to be printed on the
    default printer.


    If you want to see what''s waiting to be printed on another printer, you use the
    optional argument -P followed by the name of the printer. For example:


    ```

    lpq -Pzkilsa

    ```


    If you type that command, you probably get a message, such as lpq: zkilsa: unknown
    printer, telling you that your system doesn''t know


    ![](img/3c04420fbc1d01311e6031144afaecd2_353_0.png)'
  merge: -1
  pgno: 353
- img_proc: true
  md: '# Appendix B: The OpenLinux man Pages


    In any case, the purpose of this section is not to show you all the functionality
    of the lpq command. Rather, the synopsis section shows in a shorthand way how
    the command should be used, including which arguments are optional.


    Another confusing item you may see is the . . . notation. Looking back at the
    lpq command synopsis, you see this notice twice, once following the job # argument,
    and once following the user argument. This notation tells you that you can list
    as many job numbers on the line as you want, separated by spaces, and as many
    user names as you want, also separated by spaces.


    Sometimes you see a command argument that begins with one hyphen (-) or two (--).
    These are technically known as options, whereas job # and user are arguments.
    Options tell the command how to manipulate arguments. You may also see an option
    line that looks like this:


    ```

    cat [-benstuvAET]

    ```


    or even this:


    ```

    ls [-abcdefgklmnpqrstABCFGNNQSUX1]

    ```


    Don''t be overwhelmed. If you deal with the options one at a time, you''ll understand
    how the command works. Take heart in the fact that much of the time, most people
    use only one or two options.


    If you use the ls command, you''ll see that ls has many more options. That''s
    why ls has been described as "a command that went bad with good intentions."


    # Description


    The description section is a brief introduction to the functionality, which then
    is expanded by what the options tell the command to do. The manual page for man
    itself is a good example of a description.


    # Options


    As stated in the synopsis section, the options section shows how the command treats
    data in the arguments. Each option modifies the command''s actions, distinctly
    or subtly. The options also pass information to the command about where to find
    files. The three types of options are


    +   - No argument

    - Attached argument

    - Positional argument'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# 330 Part VII: Appendixices


    No argument means the option has a hyphen followed by one or more single-character
    options. For example:


    ```

    ~ -ax

    ```


    The a and the x don''t have any other values they have to look at. However, in
    the following command


    ```

    1pq -Pzlipsa

    ```


    the P option has to have an argument, which is zkipsa in this example.


    # Environmental variables


    Sometimes, to cut down on the information you have to give the command, you can
    set an environmental variable. Each shell (or command interpreter) has an environment
    it works in. This environment (when created) consists of certain files that are
    open, have some memory, and almost always have environmental variables.


    Using the bash shell, type the following. (If you''re not sure whether you''re
    using the bash shell, type bash at the command prompt and then continue with the
    example.)


    ```

    printenv

    ```


    You see something like this:


    ```

    HOSTNAME=localhost

    LOGNAME=maddog

    USERNAME=

    _ETC_PROFILE=1

    HELPATH=/usr/openwin/help

    MAIL=/var/spool/mail/maddog

    PAGER=less

    CLASSPATH=/usr/java/lib/classes.zip

    TERM=xterm-1386

    HOSTTYPE=local

    PATH=/usr/local/bin:/usr/bin:/usr/X11R6/bin:/opt/bin:

    t/tex/bin:/opt/kde:/usr/java/bin:/home/maddog

    gbin

    KEDIR=/opt/kde

    HOME=/home/maddog

    SHELL=/bin/bash

    USER=maddog

    LESSCHARSET=latin1

    JAVA_HOME=/usr/java

    DISPLAY=:0.0

    ```'
  merge: -1
