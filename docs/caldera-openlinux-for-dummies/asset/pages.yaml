  md: '# Chapter 2: Accessorizing OpenLinux


    Freely available software can be further divided into software that you can either
    freely copy or freely distribute. Some people make their software freely available,
    but only if you copy the software directly from a particular site or from a noncommercial
    distribution. Other people let you copy their software from anywhere. Copying
    restrictions usually apply to people making a commercial distribution, not to
    the end-user of that distribution. A company creating a product based on freely
    available software has the responsibility to be in compliance with the package''s
    copying restrictions, which are usually outlined in the source code of a program
    or in the program''s Help section.


    Being free isn''t always the best thing. One system administrator came to us when
    I worked at Calder because his manager was upset about using Linux. "We''re not
    running this company on free software!" the manager insisted. We offered free.
    helped him for a copy of Linux (with documentation and support, of course), and
    everyone was happy.


    Many freely available applications have been ported from UNIX to OS/2, Windows
    3.1, 95, 98, and NT, and other operating systems. If you use an application that
    has been ported to many operating systems, such as the emacs(1) editor, you are
    more likely to use the same application in other operating system.


    When you see a word, such as emacs, followed by a number in parentheses, the name
    refers to the section of the Linux manual that contains information on how to
    use that command. For example, emacs(1) is a text editor that you can use to manipulate
    text in files, and emacs(1) documentation is located in section 1 of the manual
    pages. 1pd(8) is a command found in the eighth section of the reference manual.
    After your Linux system is up and running, you can type the following commands:


    ```

    man emacs

    man 1pd

