    # Saving yourself


    When you work with the text of a file, the text is kept in a buffer (a place in
    memory), and no changes are made to the file until you save and exit the file.
    Our advice is to save your text early and often. Although OpenLinux systems are
    stable, a power failure after you''ve spent five hours typing a large, unsaved
    file could be just your luck.


    Saving your file is particularly useful when you''re going to execute some large,
    complex command that will transform your text file dramatically. Yes, most editors
    have an undo command that backs out the one or two (or more) commands and the
    text you''ve given the text editor. Writing the buffer to disk, however, is foolproof.


    If you make a mistake and want your file back the way it was when you last saved
    it, you must quit — rather than exit the editor. Quitting means leaving the editor
    without doing one save of the file. Exiting saving the changes that exist in the
    buffer and leaving the editor. We show you how to use both functions for vi(1)
    and Kaiten.


    ![](img/3c04420fbc1d01311e6031144afaecd2_168_1.png)


    Some editors have autosave, which is a nice feature for people who forget about
    saving their files. Autosave counts how many changes you make to a file and automatically
    saves the buffer to the file after a certain number of changes. Autosave does
    have its problems,-ever. One, the autosave feature causes some editors to freeze
    while-saving, which is annoying. Two, autosave can happen at the worst for time.
    For example, if you execute a complex command that erases your buffer and then'
