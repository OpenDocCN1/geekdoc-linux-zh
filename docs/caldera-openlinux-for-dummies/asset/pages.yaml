  md: '# But wait, there''s more


    Linux is known for its cryptic command names, error messages, and documentation.
    We prefer to think of the command names as terse — a lot of meaning in a small
    space. The man page on bash, however, is more than 60 pages, with no examples
    and no cheery dialog to entertain you. From length, you can surmise that shell
    programming involves a lot more than we can tell you in these few pages. Entire
    books have been written on shell programming. What we have shown here, however,
    can help you write a few short scripts to make your life easier.


    To find all programs running under the shell you''re currently using, you can
    use the jobs shell command as follows:


    +   jobs

    [1]+ Running kcalc &


    This command tells you that kCalc is job #1, running fine (thank you), isn''t
    waiting for any input from the console, and is just having a great old time.


    On the other hand, you can have another job (such as largejob) that you put temporarily
    into the background simply by putting the & at at the end of the line:


    largejob &


    After you type jobs as a command in this case, you see that largejob is stopped,
    waiting for input or some other reason:


    +   jobs

    [1]- Running kcalc &

    [2]+ Stopped (tty output) largejob


    You can bring largejob into the foreground by typing fg %2 and giving it more
    input, and then put largejob back into the background by pressing Ctrl+Z and typing
    bg. Whew. Here''s how it looks:


    +   fg %2

    largejob

    MADDDOG tries hard.

    <CTRL+Z>

    [2]+ Stopped largejob

    bg

    [2]+ largejob &'
