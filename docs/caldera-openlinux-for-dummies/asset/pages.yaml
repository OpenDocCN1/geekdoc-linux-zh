  md: '# 130 Part III: Using OpenLinux


    # Removing files


    Like the flexibility you have being able to move and copy with commands or the
    File Manager? Then you''re in luck: OpenLinux gives you the same options for removing
    files.


    # Using commands to remove files


    The command for removing, or deleting, a file is rm. If you followed our story
    in the "Using commands to move and copy" section, the handsome prince now has
    two beautiful princesses (jewels2) in the santa cruz directory. Most people know
    that this is probably one too many princesses, so get rid of the second princess:


    ```

    rm jewels2

    ```


    You''ve removed the extra file from the current directory. To remove a file from
    another directory, you provide a relative filename or absolute filename. For example,
    if you want to expunge moody from the work directory, you would type the following:


    ```

    rm ../work/moody

    ```


    You''re allowed to use wildcards with rm, but please be careful if you do! When
    files are removed in OpenLinux, they are gone forever — kaput, vanished — and
    they can''t be recovered. Check out Chapter 10 to learn more about using wildcards
    in OpenLinux.


    The following command removes everything in the current directory and all the
    directories under it that you have permission to remove:


    ```

    rm -r *

    ```


    To lessen the danger of removing a lot of files inadvertently using wildcards,
    be sure to use the -i option with the rm, cp, mv, and various other commands.
    The -i option means interactive, and it lists each filename to be removed (with
    the rm command) or overwritten (with the mv or cp command). If you answer Y or
    N to the question, the file is removed or overwritten, respectively. If you answer
    anything else, OpenLinux leaves the file alone.


    # Using File Manager to remove files


    Because moving files in OpenLinux (or any Linux or Unix system, for that matter)
    is so dangerous — so final — we recommend using KDE features to protect yourself
    from costly errors in judgment. To delete any file from a File Manager window,
    use one of these methods:'
