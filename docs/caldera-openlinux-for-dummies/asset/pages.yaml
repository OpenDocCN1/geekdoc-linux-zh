- img_proc: true
  md: '# Chapter 8: Working with Files and Commands 133


    The --rw-r--r-- are the permissions for the tee time file: The owner is you, and
    the group is probably you but could be someone or something else, depending on
    how your system is set up and administered (see Chapter 7 for more on setup and
    administration).


    You may be wondering how you can become an owner of a file. Well, you''re automatically
    the owner of any file you create, which makes sense. As the owner, you can change
    the default file permissions. If you''re logged in root, you can also change the
    ownership of any file.


    To change the ownership of a file or a directory, use the chown command. (Get
    it?) chown — change ownership.) The syntax is


    ```

    chown <new owner> <filename>

    ```


    Suppose you''ve decided to settle down and lead a more contemplative life, one
    more in line with a new profession of haiku writing. Someone else will have to
    plan the weekend get-togethers. You log in as root and change the ownership of
    the tee time file.


    chown dtaylor tee time


    This command changes the ownership of tee time to dtaylor. If you want to change
    the ownership back to its original owner, you can use the chown command again.


    Files and users belong to groups. In the tee time example, the group is users.
    Having groups allows you to give large numbers of users — but not all users —
    access to files. Group permissions and ownership are handy for making sure that
    the members of a special project or workgroup have access to files needed by the
    entire group.


    With which groups are available to you on your system, look at the /etc/group
    file. To do so, use the more command. You see a file that looks somewhat like
    this:


    ```

    root::root

    bin::1:root,bin,daemon

    ...

    nobody::99:

    users:100:your-user-name, maddog, nwells

    floppy:x:

    -your-user-name::500:your-user-name

    ```


    where your-user-name is the login name you use for your account. Please remember
    that the file won''t look exactly like this, just similar. The names at the beginning
    of the line are the group names. The names (such as root, bin, and daemon) are
    user-group names that can belong to the user-group list.'
