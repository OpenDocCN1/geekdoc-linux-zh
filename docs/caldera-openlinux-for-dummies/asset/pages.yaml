    # # Connecting Your Modem


    To use OpenLinux with the Internet, you must have at least one of these devices:


    +   - A serial modem

    - An ISDN line

    - A digital subscriber line (DSL)

    - A broadband connector of some type (such as Ethernet, FDDI, a cable modem, or
    ATM)


    For the second and third items, or if someone you know (your boss, your systems
    administrator, or your 10-year-old) probably arranged for you to get the connection
    and even set your computer for it. The serial modem is a device that you may chosen
    yourself, or it may have come with your computer, in which case you may have little
    knowledge of how to use it with OpenLinux. For the rest of this chapter, we assume
    that you are connecting your system to the Internet by using a serial modem and
    a telephone line.


    Modems, quite simply, do three main functions:


    +   - Convert digital information into tones that go across telephone lines (and
    vice versa)

    - Dial the telephone number you want to reach and make the connection with a modem
    at the other end

    - Negotiate with the modem at the other end for the speed to use when sending
    bits of information'
