- img_proc: true
  md: '# Chapter 17


    # Ten Sources of Help


    +   In This Chapter

    - Read, read, read

    - Check out the Linux HOWTOs

    - Going back to school

    - Become a newshround

    - Using user groups

    - Pay for support

    - Add commercial applications

    - Visit Web sites

    - Attend conferences

    - Try to help others


    By now, you''re probably wondering whether any end exists to the amount of information
    and knowledge needed to run an OpenLinux (or any Linux or UNIX system). The answer
    is yes, an end does exist to the knowledge you need to run a system well, but
    not to the knowledge you can accumulate if you want to understand how things work
    and interact. In this chapter, we suggest several ways to get additional training
    and support.


    # Books and More Books


    When we started working with computers 20+ years ago, the number of books about
    computers filled only one bookshelf and were mostly about hardware electronics.
    One rarely saw books on computers in the popular-press bookstores. Today, thousands
    of books on computers are available; most computer books describe the software
    and its interactions, with the hardware now taking a back seat.'
  merge: -1
  pgno: 316
- img_proc: true
  md: '# 292 Part VI: The Part of Tens


    Perhaps you looked at other books before you bought this one but were intimidated
    by their use of technical terms. Or you thought the other books too general for
    what you wanted to do, because you wanted something more task-oriented. You may
    want to look over those books again after reading this one, because your knowledge
    level will soared. TCP/IP networking, Web server administration, graphical interfaces,
    system administration, and regular old computer programming are all topics you
    can study in greater depth with a background in OpenLinux.


    Lots of books specific to the UNIX operating system are either partially or completely
    applicable to OpenLinux, such as books on Perl, which is a comprehensive programming
    language. By getting one (or more) books on Perl and sitting down with your Linux
    system, you can have a new tool for doing your work and a new appreciation for
    a complete programming language. If you want to find out how to write Perl, then
    simply check out the source code.


    ![](img/3c04420fbc1d01311e6031144afaecd2_317_0.png)


    # Becoming a geek


    As long as you''re coming up to speed on all this technical knowledge, you should
    know that true UNIX (and Linux) geeks have their own way of saying things. The
    jargon used by Linux geeks mostly makes life easier for them, rather than more
    cryptic for the rest of the world, but some of their sayings, well... here are
    some examples:


    +   * "Eff Check" the file system rather than "run EF ES C on K file system system


    +   * "VEYE" (rhymes with "eye") rather than "vee eye", when talking about the
    editor vi


    Linux geeks know that a word fsck (the disk checking utility) can be used as a
    noun, verb, and an adjective, they say:


    +   * I ran fsck.


    +   * fsck the file system.


    I moved the files into the fscked file system.


    Your English teacher (and our editor) shudder at this concept.


    Linux geeks talk about disks


    I also want to point out that geeks are not nerds. Geeks are people who love technical
    topics, but they typically have a wide range of interests. Geeks are often outgoing,
    and (but not all) enjoy being with people. One of my favorite T-shirts (if I have
    more than 3,000 XL T-shirts) reads: "It is hard being a Geek, but it is getting
    easier."'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# Chapter 17: Ten Sources of Help


    # Linux HOWTOs


    Don''t forget about the Linux HOWTOs, which are included on this book''s CD-ROM.
    These excellent guides to Linux are applicable to your OpenLinux system. The HOWTOs
    are covered under the Linux Documentation Project copyleft, which means you can
    print them. You can also read the HOWTOs by using a more(1) or less(1) command.


    ![](img/3c04420fbc1d01311e6031144afaecd2_318_0.png)


    # School Days


    Another way to find out more information about OpenLinux is to take a course,
    perhaps at a local community college or a vendor near you. Lots of colleges offer
    courses on UNIX, and some use Linux to teach their UNIX courses.


    Many Linux and OpenLinux courses are popping up all over the world. You can take
    computer-based training courses, video training, or old-fashioned instructor-led
    training courses where you sit at a computer and an instructor guides you through
    the material. Some places where you can look for the resources are:


    +   - Caldera Systems'' Web site at www.calderasystems.com, Look under the Education
    headings to find lists and links to Caldera Systems training centers all over
    the world.

    - Traditional training companies, such as Learning Tree (www.learningtree.com)
    and ExecTrain (www.exectrain.com), and technology companies, such as Hewlett-Packard
    (www.hp.com), offer Linux training courses. Most of what you''re taught in these
    courses is generic to Linux but also to OpenLinux.

    - LinuxCare University is a part of the LinuxCare commercial support program.
    Visit www.linuxcare.com for details.

    - Regional offerings from companies, such as ALC Press (www.alcpress.com), provide
    various specialty or introductory courses that last from two to five days.

    - Video training is available from Keystone Learning Systems (www.kliscorp.com).


    Many of these training programs (and many of the myriad books Linux that appear
    monthly) are aimed at Linux certification. Several programs are currently vying
    for the lead in a career and business-oriented Linux certification, similar to
    the MCSE from Microsoft and the CNE from Novell. For details, visit the SAIR Certification
    site (www.linuxcertification.com) or the Linux Professional Institute (www.lpi.org).


    ![](img/3c04420fbc1d01311e6031144afaecd2_318_1.png)'
  merge: -1
  pgno: 318
- img_proc: true
  md: '# Part VI: The Part of Tens


    # In the News


    You can obtain additional information on Linux and OpenLinux from the Internet.
    A facility called netnews has thousands of newsgroups, and each newsgroup is about
    a special topic. More than 30 newsgroups are devoted to Linux topics.


    An ISP (Internet service provider) usually provides access to netnews. You can
    use a newsreader (such as kn, trn, tin, or pine) or one of several Web browsers
    on your KDE Desktop (such as Netscape) to read netnews. Both Netscape and the
    tin text-based newsreader are installed by default from this book''s companion
    CD-ROM.


    ![](img/3c04420fbc1d01311e6031144afaecd2_319_0.png)


    # User Groups


    User groups are springing up all over the country. Some groups are more active
    than others, but most hold meetings at least once a month. Some groups are Linux,
    whereas other groups are connected to a larger computer group—either UNIX or a
    more general computer-user association. User groups provide great opportunities
    to ask questions, and they stimulate news ideas and ways to do things.


    You can find out if a Linux group is in your area by checking with GLUE (Groups
    of Linux Users Everywhere), which is a service by SSC (publishers of the Linux
    Journal). GLUE is an automated map of user groups and you can find it at the following
    address:


    ```

    www.linuxjournal.com

    ```


    After you open the site, check out the Resources section to find out where your
    user group connects to you.


    No group in your area? Just post a note in a Linux-oriented newsgroup (see the
    previous section about netnews) saying that you want to start a user group; then,
    perhaps, other people in your area will join you. A good newsgroup to post this
    message of is comp.linux.advocacy. Terrified at the thought of trying to start
    a user group? User-group leaders are often not the most technically knowledgeable
    people in the group but are simply good planners. They organize the meeting space,
    find (hound) speakers, send out meetings, locate sponsors, arrange refreshments,
    and perform organizational tasks. Sometimes being a leader is a thankless job,
    but when the meeting goes well, then all the hard work seems worthwhile. As a
    newbie to Linux, you may not know a grep from an awk, but you may still make a
    good chairperson.


    ![](img/3c04420fbc1d01311e6031144afaecd2_319_1.png)'
  merge: -1
  pgno: 319
- img_proc: true
  md: '# Chapter 17: Sources of Help


    # Bring in the Cavalry


    Some people want to be able to hire people to manage or fix their systems, which
    is what the commercial computer world calls support. Often the place where you
    bought your computer — whether it''s a store, a value-added reseller (VAR), or
    the manufacturer — provides that support.


    Linux has been criticized in the past for not having a high level of support,
    but nowadays it''s a tough argument to swallow. The first group that offers support
    are the vendors of Linux products. Cadera Systems has complete support packages
    for OpenLinux, as do other Linux vendors. These support packages range from e-mail
    to telephone and on-site consulting. If you purchase your system as a complete
    bundle from a Linux specialist, such as VA Research (www.varesearch.com), then
    be sure to ask your hardware vendor what your system includes.


    Another group that offers support are people who resell Linux systems. These people
    typically install OpenLinux on hardware that you purchase from them. They will
    resell your system if it breaks and help you with knotty problems (usually for
    a fee).


    The final group of people who offer support are independent consultants who have
    learned about OpenLinux and are now in the business of offering support for the
    system. You can find a list of consultants in a document called the Consultants
    HOWTO, which is available at the following address:


    ```

    www.linuxhq.com/HOWTO/Consultants-HOWTO.html

    ```


    You can also visit the Question Exchange to submit a technical question to a qualified
    online expert. You can indicate whether you''re willing to pay a fee to get your
    question answered (which can speed up the response). Visit www.questionexchange.com.


    You can find a not-as-current copy of the consultants'' list on the accompanying
    CD-ROM, which includes a copy of the Consultants HOWTO in the directory /usr/doc/HOWTO/other-formats/html.


    ![](img/3c04420fbc1d01311e6031144afaecd2_320_0.png)


    # Commercial Applications


    Because we''re talking about commercial support, we need to mention something
    about commercial applications. Many OpenLinux users are frugal (we prefer that
    over cheap) and often want to use only freely distributable software. Often, the
    freely distributable software is very good and does exactly what you want to do.
    Other times, however, the application you want is available only as a commercial
    application.'
  merge: -1
  pgno: 320
- img_proc: true
  md: '# 296 Part VI: The Part of Tens


    OpenLinux users buy the latest and greatest hardware and want the same commercial
    applications on OpenLinux that they have on their other operating systems, no
    matter what the price.


    For commercial application vendors everywhere who may be reading this book, we
    cannot stress this point enough: You need to look at the market for OpenLinux
    applications as you do the market for any other operating system. You can sell
    your applications to a market that not only is appreciative but also believes,
    for various reasons, its operating system should be developed as an OpenSource
    product. That doesn''t need to affect how you view your application.


    If you''re wondering why commercial software is still viable with all the free
    software we''ve talked about, consider the powerful feature list of programs,
    such as Appispielsweise by Appl, Inc. (www.applic.com). Appispielsweise has a
    word processor, a spreadsheet, a presentation package, a mail front end, an HTML-authoring
    program, a graphical program for drawing pictures (usually to include in your
    presentation or paper), an application-building program, and a scripting language
    that allows you to tie these and other programs together.


    We write this book by using Appispielsweise Words. We chose Appispielsweise Words
    rather than Microsoft Word, because we easily copy examples of code directly from
    the OpenLinux source and paste them into the text of the book. After finishing
    a chapter in Appispielsweise Words, the text is easily exported to Microsoft Word
    97 format, and then e-mailed to our editor.


    ![](img/3c04420fbc1d01311e6031144afaecd2_321_0.png)


    I also use Appispielsweise Presentation Editor to make presentations on Linux.
    When I''m talking about Linux at a show or at a convention, I can demonstrate
    what I''m talking about using the X Window System showing the presentation slides
    on the screen. If I used Microsoft PowerPoint, in order to do a demo, I would
    have to reboot the system to Linux — an awkward approach at best. Appispielsweise
    has many of the features that Microsoft products have. Recent editions of Appispielsweise
    can read and create PowerPoint output, so now I can run my system FAT-free.


    Other offices are also available. The StarOffice includes a word processor, spreadsheet,
    presentation and graphics software, simple database, and complete Internet integration.
    We can read-email browse and edit Web pages, and visit FTP or news sites all within
    StarOffice. StarOffice was originally developed in Germany by StarDivision, and
    then acquired in 1999 by Sun Systems, which has released it freely over the Internet.
    (Visit www.sun.com and search for StarOffice).


    WordPerfect for Linux from Corel also has a strong and includes server and personal
    editions, as well as a free downloadable version. Corel has committed many resources
    to developing additional Linux products. The Web site for Corel products is linux.core.com.'
  merge: -1
  pgno: 321
