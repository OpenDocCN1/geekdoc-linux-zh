- img_proc: true
  md: '# Chapter 6: Solving Problems with the Graphical System


    utility. Although xf86config is rarely used, OpenLinux includes xf86config (which
    uses a different internal process that may result in a successful configuration).


    Enter this command to begin:


    ```

    xf86config

    ```


    A full screen of text appears (see Figure 6-10). Keep the information that you
    gathered about your video hardware nearby and carefully read all the information
    on each screen, following the directions.


    ![](img/3c04420fbc1d01311e6031144afaecd2_118_0.png)


    Figure 6-10 The xf86config utility is a character-based program for setting X.


    This program will create a base xf86config file based on the selections you make.

    The Xf86config file usually resides in /etc/X11/xorg.conf or /etc. A sample file
    is supplied with xf86config, which is configured for a standard VGA card and 640x480
    resolution. This program will ask for a pathname when it is ready to write the
    file.

    Use this as a base and edit it for your configuration, or let program produce
    a base xf86config file for a detailed overview of the configuration process

    For accelerated servers (including accelerated drivers in the X server), there
    are many options and settings. This program does not know about them. On some
    configurations these settings must be specified; refer to the server man pages
    and chipset-specific READMEs.

    This configuration allows you to choose the chipset and amount of video memory
    on your video card. SuperProbe can help you with this

    It is also helpful if you know what you want to run


    Press enter to continue, or ctrl-e to abort


    xf86config is effective but requires that you read a lot more than Xf86Setup,
    instance, before you know what to choose from the numerous menus that appear.
    Still, xf86config provides another option that has worked well for thousands of
    people before shiny new units (such as Lizard X) were available.


    After you''ve answered all the questions posed by xf86config, the xf86config creates
    a configuration file for you. As soon as xf86config exits, you can immediately
    run the graphical desktop in OpenLinux using the command kde.


    # Start Your Engines


    After you''ve successfully configured X for your video hardware, it''s time to
    try the graphical system with the KDE desktop. To do this, simply type the following:


    ```

    kde

    ```'
