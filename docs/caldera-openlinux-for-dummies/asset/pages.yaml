  md: '# 316 Part VII: Appendices


    nonintelligent cards have storage for information coming from the serial ports
    on the card and can also send control signals to each port on the card. Intelligent
    cards can cut down on the overhead of having a huge flow of data coming into the
    system every second from numerous ports and, therefore, relieve part of the load
    on the main CPU. Some nonintelligent cards also use an IRQ for every port, which
    can use up a lot of the system''s resources for little gain. Try to get a card
    that''s intelligent and uses only one IRQ.


    # Nonintelligent cards


