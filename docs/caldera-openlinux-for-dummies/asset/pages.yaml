  md: '# Chapter 13: File System Management


    # Configuring a CD-ROM Drive


    You treat CD-ROM drives similar to — but not exactly like — hard-disk drives.
    The block-special-file for CD-ROMs in OpenLinux is usually `/dev/cdrom`, `/dev/hdc`,
    `/dev/hdd`, or `/dev/sr0`, depending on factors such as the CD-ROM''s type, how
    the CD-ROM is connected to the controller, and the CD-ROM''s drive number.


    The most common type of CD-ROM is ATAPI, and OpenLinux recognizes ATAPI CD-ROM
    drives at boot. SCSI CD-ROMs are also normally recognized as the kernel boots.
    If you installed OpenLinux from the accompanying CD-ROM, then OpenLinux will have
    recognized the CD-ROM, which is probably called `/dev/cdrom`.


    We mention that CD-ROMs are not exactly like other disk drives because they are
    read-only (which means you can''t change their contents) and typically have only
    one file system to a disk. Therefore, you don''t partition a CD-ROM drive, nor
    do you make a file system before mounting it. The manufacturer already did these
    things. You simply have to determine where you want to mount the CD-ROM and which
    one you attached it to. We assume your CD-ROM drive is `/dev/cdrom`, which is
    really just a pointer to another special-device file (called a *link*) enables
    you to call the CD-ROM by the name `/dev/cdrom`, rather than having to call it
    `/dev/scda` on some systems (because it happens to be a SCSI device) and `/dev/hdc`
    on other systems (because it happens to be an IDE-based device).


    Here is the command for mounting a CD-ROM on your OpenLinux system:


    ```

    mount /mnt/cdrom

    ```


    If you''re having trouble getting this command to work, it''s probably because
    the OpenLinux installation didn''t correctly identify your CD-ROM drive and place
    information about it in the `/etc/fstab` file. In that case, you can try the following
    more cryptic command that provides OpenLinux with all the relevant details to
    access the CD-ROM drive.


    ```

    mount -r -t iso9660 /dev/cdrom /mnt/cdrom

    ```


    The OpenLinux system dismounts file systems automatically when you shut down the
    machine and — if you put all the necessary information into the `/etc/fstab` file
    — automatically mounts them when you start up the system.'
