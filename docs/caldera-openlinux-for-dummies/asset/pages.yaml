  md: '# Chapter 10: Avoiding Shell Shock 171


    Congratulations. You''ve just written a program — a simple program, but as far
    as OpenLinux is concerned, as much as a program as any other.


    What you have written is called a shell program, or a shell script. In many cases,
    shells are more efficient than writing many hundreds of lines in C or Java. Shell
    scripts are fairly easy to write, easy to change, and even experienced C and Java
    programmers use shell scripts every day rather than write more complex programs
    using those other languages. Systems administrators can''t survive without scripting
    languages, such as the one that is provided as part of the bash shell.


    # From the Simple to the Sublime


    Although you have written a program, your program always works on the same file,
    which is hard-coded into the script. For the remainder of this chapter, we show
    how to create more flexible shell scripts — ones that generate different files
    as needed and automatically adapt to run on different dates.


    Suppose you want to keep monthly copies of the passwd file and then see the differences
    between them later. First, write a program that saves a copy of the passwd file
    and stores the file in a directory:


    +   1. Use the cat command to create a script in your ~/bin directory called genreport.


    The genreport script is simple. The genreport script copies the file /etc/passwd
    to standard output using the cat command; the redirection symbol puts genreport
    script into a file.


    +   2. For a filename, the passwd file for October 1999 would be passwd199910,
    and the passwd file for November 1999 would be passwd199911.


    For example, the passwd file for October 1999 would be passwd199910, and the passwd
    file for November 1999 would be passwd199911.


    To create these files, execute the date command inside the shell script and use
    its output to append to the word passwd. If you use the backtick quote (called
    accent grave) around the date command, it generates 199910 to be appended to the
    string of characters passwd, if it is October 1999. The accent grave tells Linux
    to "execute what is between the accent grave symbols as a Linux command and use
    the results of that command as a string in the larger command."


    Therefore, the date command generates the string 199910, which is appended to
    the name passwd to create passwd199910.'
