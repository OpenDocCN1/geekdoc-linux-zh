    is challenging to learn a little about it it is a good idea, because vi(1)''s
    the editor that is generally available on any Linux system you work with. Using
    vi(1) also makes you feel really smart — that''s our reason we show you vi(1)
    basics in Chapter 9. Many Linux systems ship with a new version of vi(1) called
    vim(1), for improved.


