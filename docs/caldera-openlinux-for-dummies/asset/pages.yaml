  md: '# Chapter 3


    # Discovering What''s in Your System


    # In This Chapter


    +   - Figuring out the resources OpenLinux requires

    - Unearthing your type of hardware


    The sole function of this chapter (and the three chapters that follow) is to help
    you install your system. If your OpenLinux system is already installed, then count
    yourself lucky and check out the chapters in Part III. If you haven''t installed
    your system, console yourself with the fact that you''ll find a lot in this chapter
    and the better for doing so later on. Your computer won''t seem like such a stranger
    once you''ve found out what''s inside it.


    A word of caution to begin: You may not need to delve into all the hardware details
    described in this chapter. The OpenLinux installation wizard (affectionately called
    the Lizard) is fairly sharp and may do everything for you without much effort
    on your part. Still, this chapter helps you find out about your hardware so that
    you''ll be prepared to handle any hiccups along the way.


    We''d like to dispel a myth that Linux is much more difficult to install than
    Microsoft Windows. Experience shows that OpenLinux is no harder to install than
    any other operating system — and considerably easier than.


    > I''ve tried on several occasions to install Windows 95 from the beginning and
    have met with frustration over plug-and-play (often considered plug-and-pray)
    hardware components or drivers that were always on the "other" floppy disk (no
    matter which floppy disk I had). Windows seems easy to install because it preinstalled,
    most people only update it, and people who do install Windows have the hardware
    documentation.


    You can buy OpenLinux preinstalled if you prefer. Then all you do is turn it on.
    If that''s how you obtain the OpenLinux operating system, then OpenLinux is as
    easy to "install" as Windows!


    The next easiest way to install OpenLinux preinstalled on a hard disk. You then
    put the hard disk in your system, boot the system, and OpenLinux is installed.


