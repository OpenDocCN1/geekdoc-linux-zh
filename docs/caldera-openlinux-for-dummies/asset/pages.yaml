    for the information about how to use the commands.


    Nonfree applications consist of commercial applications and shareware applications.
    Commercial applications are sold outright. Shareware applications may be tried
    out or used for personal use. If you use the shareware program a lot or want to
    use the program commercially, then you should pay the author. The amount is usually
