  md: '# Chapter 6


    # Solving Problems with the

    Graphical System


    In This Chapter


    +   - Uncovering details about your video controller, monitor, and mouse

    - Trying the Lizard again

    - Configuring the X Window System with other tools

    - Finding some help if nothing seems to work

    - Paying attention to shutting-down etiquette


    Did you have trouble during the configuration of your video hardware during the
    installation of OpenLinux? If so, this chapter is for you. Take solace in the
    fact that the graphical hardware is probably the most difficult part of an OpenLinux
    system to get working properly. But graphics are also among the most important
    parts of your OpenLinux system — unless you prefer working at a command line all
    the time. The graphical interface that OpenLinux uses — the KDE desktop — is built
    on the X Window System (also called "X”). If X is not correctly configured to
    use your video hardware, then KDE can''t provide a nice graphical interface or
    access to all the graphical programs that are described elsewhere in this book
    (see Chapter 12).


    # Discovering Your Hardware''s True Identity


    Before you can start the X Window System with KDE on top of it, your configuration
    files must contain correct information about your video controller card, monitor,
    mouse, and keyboard. Normally the OpenLinux installation process automatically
    determines all the information, but if that doesn''t happen, you still can get
    things working correctly.'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# 82 Part II: Installing OpenLinux


    For your video controller card, you need to know


    +   - The model number (and perhaps the video chip used)

    - The amount of video RAM on the card


    You can find this information in your system''s documentation or — if you''re
    using a dual-boot system — by using the Microsoft Windows Control Panel (described
    in Chapter 3). But now that you have OpenLinux up and running, you can also try
    the Lizard X and XF86Setup configuration tools that you describe in this chapter.


    Next, you need to know the following about your mouse:


    +   - The model number and manufacturer

    - Whether the mouse is a PS/2 bus mouse or a serial mouse


    Again, your system''s documentation should have this information, and the bottom
    of the mouse often has some basic information, too.


    PS/2 mouse usually has a round connector on the end of its wire, or tail. A serial
    mouse usually has an oblong connector with nine holes. All varieties of PS/2 bus
    mice look the same as OpenLinux. Different serial mice, however, have different
    characteristics. If you have a serial mouse, you have to know its model number
    and manufacturer, or whether your mouse emulates other well-known mice. Also,
    not many OpenLinux programs support the scrolling wheel available on many mice.


    ![](img/3c04420fbc1d01311e6031144afaecd2_107_0.png)


    Three-button mice work best with OpenLinux, but you can get by with a two-button
    mouse. To X, simultaneously holding down both buttons on a two-button mouse feels
    the same as holding down the middle button on a three-button mouse (but only if
    the system is configured correctly by using the Emulate 3 Button option, as discussed
    in Chapter 5).


    ![](img/3c04420fbc1d01311e6031144afaecd2_107_1.png)


    Finally, you need to know about your monitor. Most monitor manuals have a table
    at the back with information, such as:


    +   - Horizontal sync range

    - Vertical sync range

    - Resolution


    Whether the monitor is multisync, which means that your monitor can run at several
    resolution rates'
  merge: -1
  pgno: 107
- img_proc: true
  md: '# # Chapter 6: Solving Problems with the Graphical System 83


    ![](img/3c04420fbc1d01311e6031144afaecd2_108_0.png)


    Older monitors, particularly VGA monitors that come with older systems, often
    aren''t multisync. These monitors can be damaged if you try to use them at a resolution
    higher than VGA, which is 640 x 480.


    Horizontal and vertical sync range numbers help X the different ways in which
    X can place the dots on the screen. The resolution number tells X how many dots
    can be horizontally and vertically on the screen. A 640-x-480 resolution is usually
    the worst, and a 1280-x-1024 is usually considered the best for normal use. Strive
    for 800 x 600 as a minimum and 1024 x 768 as an ideal resolution for most systems.


    ![](img/3c04420fbc1d01311e6031144afaecd2_108_1.png)


    Higher video resolution uses more video memory (which is on the video card and,
    therefore, separate from the system memory), allows fewer simultaneous colors
    on the screen (for a given amount of video memory), and typically shrinks text
    on the screen, making the text more difficult to see. On the other hand, using
    a higher resolution means that more information can be visible at one time on
    the same-size monitor (even though the writing may be so small that you can''t
    read the writing without a new prescription for your glasses). Some video cards
    can be upgraded to add more memory, and some cannot.


    Most newer monitors have built-in protection mechanisms to keep them from burning
    up in what is overloading, but older monitors don''t have such protection. Old
    monitors literally can catch on fire. Try to find your monitor''s specifications
    in the manual, from a dealer, or from the Web pages of the monitor''s manufacturer.


    ![](img/3c04420fbc1d01311e6031144afaecd2_108_2.png)


    If you hear noise from your monitor, smell burning components, or think that the
    screen doesn''t look right, press Ctrl+Alt+Backspace right away to exit X and
    try a lower resolution. Otherwise, you can easily damage the monitor.


    # # Probing the System


    ![](img/3c04420fbc1d01311e6031144afaecd2_108_3.png)


    If your system has booted and is in command-line mode, you still may not have
    all the information that you need to configure X. A final chance to gather this
    information is to ask X itself to probe the hardware. To do this, you need to
    have an X Server program installed, the OpenLinux installation should have done
    even if the configuration couldn''t be completed. The default X Servers in OpenLinux
    are the XFree86 Project. All software-package names for these X Servers begin
    with XF86, as in XF86_SVGA. (If you see a "No file or directory" message when
    you try this procedure, you don''t have an X Server installed. Go back to your
    manuals to get the information you need.)'
  merge: -1
  pgno: 108
- img_proc: true
  md: "# 84 Part II: Installing OpenLinux\n\nTo have the X Server probe your hardware,\
    \ run this command:\n\n```\nX -probeonly\n```\n\nYou see a lot of text scroll\
    \ your screen, and then the screen goes blank. After a moment, the command-line\
    \ screen reappears. Hopefully, among all the text that appears, you'll see the\
    \ information about your video chipset. X cant determine much about your monitor\
    \ - it relies on you for that information.\nBut the video chipset and possibly\
    \ the amount of video memory can be a helpful start.\n\nThe following lines show\
    \ the result of the command if run on a Toshiba 2595 laptop. Note that the X-server\
    \ program probed the lines with (-).\n\n+   XF86Config; /etc/XF86Config\n(**)\
    \ stands for supplied, (--) stands for probed/default\n    values\n(**) XB: rules:\
    \ \"free86\"\n(**) XB: model: \"pc101\"\n(**) XB: layout: \"us\"\n(**) Mouse:\
    \ type: microsoft, device: /dev/ttyS0, baudrate: 1200\n(**) Mouse: buttons: 3,3\
    \ button emulation (timeout: 50ms)\n(**) SVGA: Graphics device ID: \"Primary Card\"\
    \n(**) SVGA: Monitor ID: \"Primary Monitor\"\n(**) Pathset to\n    \"/usr/X11R/lib/X11/fonts/Type1,/usr/X11R/lib/X11/fonts/Speeds,/usr/X11R/lib/X11/fonts/misc,/usr/X11R/lib/X11/fonts/75dpi\"\
    \n(--) SVGA: VCI: Trident 9525 DVD rev 73, Memory @ 0xff00000, 0xff00000, MMIO\
    \ @ 0xff7e0000\n(--) Trident chipset version: 0xf3 (Cyber9525)\n(--) SVGA: BIOS\
    \ requests Clock Control Bits 0x3\n(--) SVGA: Detected a Trident 9525 DVD.\n(--)\
    \ SVGA: Detected an STN 800x600 Display\n(--) SVGA: Revision 65.\n(--) SVGA: Using\
    \ Trident programmable clocks\n(**) SVGA: chipset: cyber9525\n(**) SVGA: videoram:\
    \ 2048k\n(**) SVGA: Using 16 bpp, Depth 16, Color weight: 565\n(**) SVGA: Maximum\
    \ allowed dot-clock: 230.000 MHz\n(**) SVGA: Mode \"800x600/60Hz\": mode clock\
    \ = 40.000\n(**) SVGA: Virtual resolution set to 800x600\n(--) SVGA: Speedup code\
    \ selection modified because virtualX!=- 1024\n(--) SVGA: Using Linear Frame Buffer\
    \ at 0xff800000, Size 2MB\n\nAs you can see, the probe command provides lots of\
    \ useful information, including that the computer has a Trident 9525 video card,\
    \ a PCI bus, and 2 MB of memory."
