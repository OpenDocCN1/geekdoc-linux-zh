  md: '# 236 Part IV: Maintaining Your System


    report errors, and make some repairs. Normally, the fsck program is called automatically
    as the system boots up. Therefore, if your system crashes, fsck runs on all file
    systems that were mounted when the system crashed.


    The repairs that fsck can perform are limited to structural repairs of the file
    system and its data components. The fsck utility can help if the data in a structurally
    intact file system is corrupt. Also remember that except for the root file system,
    fsck runs only on unmounted file systems. You must make sure that the system is
    in single-user mode to use fsck on the root file system.


    Here''s the syntax for the fsck command:


    ```

    fsck (options) filesystem

    ```


    where filesystem names the block-special file where the file system resides. If
    filesystem is omitted, then the fsck utility checks all file systems listed in
    the /etc/stab configuration file. If the fsck utility finds any errors, it prompts
    you for input on what to do about the errors. For the most part, you agree with
    whatever the program suggests.


    The fsck command has the following options:


    +   -p Preens the file system. Performs automatic repairs that don''t change the
    contents of files.

    -n Answers to all prompts and only lists problems; doesn''t repair the problems.

    -y Answers to all prompts and repairs damage regardless of severe.

    -f Forces a file system check.


    Lots of people run the fsck command with the -y option. If you run fsck with the
    -p option, some steps are performed automatically for you. Lost files are placed
    in the lost-found directory, zero-length files are deleted, and missing blocks
    are placed on the list of free blocks, which blocks are still available for filling
    with data, among other things.


