  md: '# Chapter 14: Customizing OpenLinux


    # Do I have enough RAM?


    The procinfo and vmstat commands can help determine whether you have enough RAM.
    Using these commands by themselves or with each other can tell you whether you''re
    over-utilizing your RAM memory. If so, your CPU is waiting for RAM to be available.


    Measuring performance with vmstat


    The vmstat command displays information about memory utilization, the status of
    a process, the I/O system, and CPU utilization. The vmstat command also tells
    you whether the swap partition is being used, and if so, how much is being used.


    The following is a sample output of the vmstat command:


    ```

    vmstat memory swap io system cpu

    procs r b w swpd free buff cache si so bi bo in cs us sy id

    1 0 0 2100 2372 13248 0 4 1 123 52 3 2 95

    ```


    The details:


    +   - The (run) number indicates processes that are capable of being run but are
    waiting for the CPU to pay attention to them. The more processes you have in this
    segment, the slower the system.


    +   - The b (blocked) number indicates processes waiting for something to happen
    (usually some type of I/O). The processes can be run, even if you have some free
    CPU.


    Too many processes in the block may mean that you have an I/O bottleneck. We discuss
    how to alleviate I/O bottlenecks later in the chapter.


    +   - The w number is the number of processes that are swapped out. Processes
    are swapped out if there''s not enough memory to run them efficiently, or if they''ve
    been idle for more 20 seconds.


    +   - A large value may indicate a lack of memory. Processes that are inactive
    for a long time (waiting for I/O, for example) may be swapped automatically by
    OpenLinux to conserve real memory space and other system resources.


    +   - swpd is the amount of virtual memory used, in kilobytes.


    +   - free is the amount of idle memory, in kilobytes.


    +   - buff is the amount of memory in I/O buffers, in kilobytes.


    +   - cache is the I/O cache, in kilobytes.


    ![](img/3c04420fbc1d01311e6031144afaecd2_272_0.png)


    ![](img/3c04420fbc1d01311e6031144afaecd2_272_1.png)'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# 248 Part IV: Maintaining Your System


    +   - si (swapped in) and so (swapped out) monitor the program pages swapped in
    and out. In a heavily loaded, memory-bound system, we see high numbers here.


    +   - bi (blocks in) and bo (blocks out) indicate I/O activity on disks.


    +   - The in value reports interrupts per second (including the clock).


    Normally, the number of interrupts ranges from the low hundreds on a single-user
    system (most of these are due to the system clock) to the low thousands on a busy
    server system.


    The number of interrupts per second is useful if you have a device that has gone
    crazy. An improperly wired serial line, can CPU time with thousands of interrupts
    per second. Although hundreds of interrupts per second are not uncommon on most
    systems, sudden unexplained jumps in the number of interrupts (for example, thousands
    of interrupts per second on an otherwise unused machine) may be worth investigating.


    +   - cs reports the number of context switches


    +   - us, sy, and id (user, system, and idle) CPU numbers are the percentages
    of time the CPU is running your program, doing some type of system service (perhaps
    requested by your program), or standing idle, respectively. Note that a system
    with lots of idle time is not necessarily the best tuned; the CPU may be idle
    because programs are waiting on I/O.


    vmstat can output a one-line summary automatically while OpenLinux runs. Enter
    a command in the following form (just substitute the time interval, in seconds,
    for x):


    ```

    vmstat x

    ```


    The programs that you see are the programs inside the system, minus the activity
    of vmstat (although running vmstat does have some slight effect).


