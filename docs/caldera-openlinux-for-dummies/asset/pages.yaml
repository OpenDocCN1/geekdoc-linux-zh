  md: '# Regular expressions: Wildcards and one-eyed jacks


    If you had to type every filename for every command, OpenLinux still would be
    useful. But something makes OpenLinux more useful is its capability to use a few
    special characters — called pattern-matching characters, wildcards, or regular
    expressions — to supply filenames. Just as you can substitute a wildcard for any
    card of your choice in a poker game, OpenLinux pattern-matching characters can
    be substituted for filenames and directory names, much like DOS wildcards.


    Three of these special pattern-matching characters are


    +   * (asterisk)

    * ? (question mark)

    * \backslash


    The asterisk matches at least one character in any filename. For example, * matches
    the following filenames:


    +   a

    acd

    bce

    moody


    You''ll probably use * most in commands where you want to list all the files in
    a directory, such as the command ls -l *.


    The question mark matches any single character. The string of characters a?,c,
    for example, match the following:


    +   abc

    adc

    aac

    afc

    a9c


    The question mark and the asterisk can be helpful for identifying a particular
    type of file, if you''re careful in naming your files. For example, text editor
    files usually have the .txt extension, and Microsoft Word files have the .doc
    extension. OpenLinux doesn''t care about the name of a file, but some programs
    work only with particular types of files.


