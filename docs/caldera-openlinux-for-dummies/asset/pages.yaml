- img_proc: true
  md: '# Chapter 15: Setting Up Your Internet Connection


    3. Click the PPP tab (displayed in Figure 15-12) and specify how you want the
    pppp program to act as it tries to connect to your ISP (under the control of kppp).


    The pppp Timeout field indicates how long to wait for a connection. Number is
    not related to the Modem Timeout value in the Device tab. The Modem Timeout value
    in the Device tab determines how long kppp waits for the modem to respond to a
    command; the pppd timer determines how long pppp waits for the ISP server to respond
    with connection.


    ![](img/3c04420fbc1d01311e6031144afaecd2_298_0.png)


    The PPP tab also includes several checkboxes. The following list describes what
    these options do:


    +   - **Dock into Panel on Connect:** Tells the program to display a small icon
    on the KDE panel to show the connection (but don''t display the main kppp window
    after connecting).

    - **Automatic Redial on Disconnect:** Automatically attempts to redial and reestablish
    the connection with the ISP if the connection is lost for some reason.

    - **Show Clock on Caption:** Shows a clock with the length of the ISP connection.

    - **Disconnect on X-server shutdown:** After KDE is shut down and the kppp program
    exits, the background pppp program to exit the connection. (If this option is
    not selected, you may think you''ve disconnected because kppp is no longer visible,
    when in fact the background connection — and associated charges — are still active.)

    - **Quit on Disconnect:** Exits kppp when the connection is ended.'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# 274 Part V: Going Online


    +   • Minimize Window on Connect: Minimizes the kppp window after a connection
    is established. This gets the kppp window out of the way so that you can use Netscape
    Communicator. The kppp window still can be accessed from the Taskbar, of course.


    +   4. Click the Graph tab (shown in Figure 15-13) and choose the colors used
    for the throughput graph that is displayed as long as you''re connected (if the
    Throughput graph checkbox is selected).


    ![](img/3c04420fbc1d01311e6031144afaecd2_299_0.png)


    By clicking any of the color boxes, you can select a new color from the standard
    KDE color selection dialog box.


    # Fire it up!


    After you''ve set up your account and device information, you can connect to your
    ISP with just a few mouse clicks. Follow these steps:


    +   1. Select an account in the main kppp window (refer to Figure 15-1) from the
    Connect to drop-down list.


    +   2. Type your Login ID for ISP account in the Login ID field and press Enter.


    +   3. Type your password for that ISP account in the Password field and press
    Enter.


    +   4. Click Connect and wait a few moments for the connection to be established.


    To actually surf the Net, read e-mail, and otherwise interact with others on the
    Net, check out Chapter 16, where you find out how to configure and use a major
    tool of the Internet, the Netscape Communicator program.'
