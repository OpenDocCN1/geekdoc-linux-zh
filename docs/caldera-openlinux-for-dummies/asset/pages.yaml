  md: '# 14 Part I: Introducing OpenLinux


    # # Using OpenLinux in Different Ways


    OpenLinux is a versatile operating system. Although Linux was initially the sole
    domain of computer-science students, OpenLinux is now used by businesses and governments
    to cut costs and improve performance. You can use OpenLinux in a variety of ways:
    as a desktop workstation, as a server, as the basis of an embedded system (such
    as a smart VCR or robot), or even as a supercomputer. The installation options
    described in Chapter 5 let you select the type of system for which you intend
    to use Linux. Your options include a home system, server, development workstation,
    and business server.


    Another popular for Linux is with Internet service providers (ISPs) that use Linux
    to provide information and services to the Internet and the World Wide Web. And
    thanks to the thousands of people working on different parts of Linux, the system
    becomes more flexible and more capable with each passing day.


    The sections that follow describe some of the ways that you can use OpenLinux.


    # # Personal workstation


    With the power of OpenLinux, you can run many programs at the same time, handle
    the needs of more one user at a time, and use high-quality graphics. OpenLinux
    can handle files and programs of immense size. OpenLinux uses a sophisticated
    windowing system called the X Window System (also known as X Windows, X11, or
    simply X) and can share files not only with most UNIX systems but also with Microsoft
    Windows, OS/2, and other operating systems.


    The default graphical environment of OpenLinux is called KDE, which uses the Window
    System as an underlying toolkit. (See Chapter 11 for interface details.) KDE provides
    you with drag-and-drop features, graphical-file management, icons for your favorite
    applications, and browsable online help.


    OpenLinux also includes the following:


    +   - Netscape Web browsers that include e-mail and newsgroup readers

    - Complete networking with the Internet-standard TCP/IP protocol

    - Software-development tools, including numerous compilers, debuggers, and scripting
    languages

    - Other useful programs, such as image editors, faxing software, system administration
    tools, multimedia utilities, and personal time managers'
