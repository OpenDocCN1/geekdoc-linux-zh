    background and choosing Logout from the pop-up menu. The Panel also includes a
    small icon containing an X to the left of the virtual desktop buttons (labeled
    one, two, etc.). Clicking on the X icon initiates a logout sequence.


    +   2. Click Logout to confirm that you want to log out.


    After a moment, the graphical login screen appears. At this point you can log
    in again (with your regular username or root, if needed). You can also choose
    to shut down your computer from this point.'
