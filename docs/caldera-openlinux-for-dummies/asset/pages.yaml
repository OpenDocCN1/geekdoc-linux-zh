  md: '# 70 Part II: Installing OpenLinux


    On this screen you select the monitor model that you''re using. The computer can''t
    probe to discover the model, so you need to select the model yourself. The list
    includes several thousand models divided by manufacturer. Click the plus sign
    to left of the manufacturer to open the list of models.


    If you''re using not listed, choose from the Typical Monitors at the top of the
    list. If you have a newer computer, the line 1024x768, 70Hz should be safe to
    choose. But don''t take our word for it; check your monitor''s manual.


    Older monitors can''t handle resolution rates and scan frequencies higher than
    what they were designed for. A monitor designed for a 640 x 480 resolution (and
    a low scan frequency) can''t display 1024 x 768 resolution (and a high frequency).
    More importantly, if you try to monitor the display with that high frequency,
    the monitor may burst into flames. (We''re not joking. We''ve seen the smoke.)
    Modern monitors, Multisync, can match them automatically to a series of scan frequencies
    and resolutions. Some of these monitors are smart enough to turn themselves off
    if the frequencies become too high, rather than into flames. What''s best (particularly
    with older monitors) is to find the documentation and properly match your vertical
    and horizontal frequencies. Lacking the correct documentation for your monitor,
    you can try a lower resolution (VGA or SVGA) first, to get the graphics-running.


