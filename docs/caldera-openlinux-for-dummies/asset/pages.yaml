  md: '# 6 Caldera OpenLinux For Dummies


    # Other uses for CD-ROMs


    Where computers and computer programmers abound, lots of CD-ROMs arrive in the
    mail or as part of the software that somebody buys. Eventually, these CD-ROMs
    become obsolete or are never installed—that''s the case with software products
    that arrive as unwanted advertising. What can ecologically minded programmers
    do with these CD-ROMs so that they don''t fill up landfills?


    clock. (Maddog has four of these clocks we made out of Windows NT CD-ROMs—hey,
    can you imagine a better use for them?)


    More exotic uses of CD-ROMs require high heat to melt them around the base of
    a water tumbler, creating either a flowerpot or, an astray. As you can imagine,
    doing this causes some consternation among management at these facilities, particularly
    after they find out one of the more expensive programs they''ve purchased has
    ended up at the bottom of a flowerpot.


    One group of programmers will use discarded CD-ROMs as drink coasters. Another
    group moves mobiles out of the CD-ROMs. (The sun shining off the CD-ROMs makes
    wonderful rainbows on the wall.) Still others use the CD-ROMs as clocks, by purchasing
    inexpensive quartz-crystal clock motors (complete with hands) and using the CD-ROM
    as the face of the


    For right now, please keep your CalderaLinux For Dummies CD-ROM in a safe place,
    such as the sleeve in the back of the book, when you''re not using it.


    # What You''re Not to Read


    Heck, you don''t have to read any of the book if you don''t want to, but why did
    you buy it? (Not that we''re complaining.) Part I has background information.
    If you don''t want it, don''t read it. Also, text in sidebars is optional, although
    often helpful. If you''re on the fast track to using OpenLinux, you can skip the
    sidebars and the text with a Technical Stuff icon. But we suggest that you slow
    down a bit and enjoy the experience.


