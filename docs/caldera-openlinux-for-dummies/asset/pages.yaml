- img_proc: true
  md: '# 246 IV: Maintaining Your System


    Not having enough RAM is a holdover from memory prices, such as $23,000 megabyte.
    I paid $400 for 4 kilobytes (.004MB) of main memory about the same time that I
    purchased a new pickup truck for $2,000.


    # Real versus virtual memory


    When we talk about real memory, we''re referring to the semiconductor RAM (random-access
    memory) in your machine. You may have as little as 128MB of RAM in your machine.
    Some power users (their servers) have 1GB (1 billion bytes) of RAM in their PCs.


    If semiconductor is the only type of memory you have, OpenLinux and all programs
    running under OpenLinux have to fit into that RAM. You can run OpenLinux in 32MB
    of memory, but more is better. a standard on many newer systems, sounds like a
    lot of memory, even that that of memory fills up pretty quickly.


    Virtual memory is hard-disk-drive space that OpenLinux uses as if it were real
    memory. The programs don''t know the difference. Apart from the fact that hard-disk-drive
    space is much cheaper than RAM, virtual memory offers two big benefits:


    +   - Programs and files can run at the same time.

    - Programs and files can exceed the size of actual RAM.


    The drive space that simulates real memory is called swap space. (When you installed
    OpenLinux you may have been asked to select a swap space. If not, rest assured
    it was done automatically for you.) Here''s how the swap space is used:


    +   - When OpenLinux needs more RAM to start a new application or allow an open
    application to expand, some disk space may be substituted for the necessary RAM.
    An existing section of RAM is copied onto the swap space. Moving part of an inactive
    activity to the swap space frees RAM for the new data.

    - When OpenLinux needs the information from the swap space, OpenLinux may write
    some other program''s data to the swap space before recalling data. This process
    is called demand-paging, because the data is in RAM only when a demand exists
    for it to be. Otherwise, data trends tend to stay on swap area of the disk.

    - When the computer doesn''t have enough RAM to do its normal tasks efficiently,
    the computer is memory bound; the portions of virtual memory are brought back
    into RAM. If this happens a lot, the computer is thrashing and becomes very slow.'
