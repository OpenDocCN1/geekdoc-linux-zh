    # Window Tricks


    The KDE Desktop that you''re working on leaves you many windows open at the same
    time. But as you may imagine, you can quickly clutter up the KDE Desktop. Frequently,
    KDE offers several useful tricks to manipulate windows on the desktop.


    # Keeping your focus on the active window


    If a window is active in KDE, we say that the window has focus. You can move the
    focus to a window by clicking anywhere in the window. A window with focus moves
    on top of all the other windows so that you can use that window.


    Of course, sometimes the window that you want to use is hidden. If that happens,
    try one of these methods to make the window that you need active in KDE:


    +   * Click the button on the Taskbar that matches the window that you want to
    use. That window moves to the top, ready to use.

    * Hold the Alt key and press the Tab repeatedly. The first time you press this
    key combination a small box appears on your screen. As you repeatedly press Tab,
    the name of each window appears in the box. After the window you want to use is
    displayed, release the Alt+Tab keys. That window jumps to the top of the heap.'
