  md: '# 190 Part III: Using OpenLinux


    +   - The line icon: This icon iconifies the window, meaning that the window still
    available but is no longer shown on the desktop. The window remains as an icon
    on the Taskbar. Click the corresponding Taskbar button or one of the other methods
    described in "Keep your focus on the active window" to recall a window that''s
    been iconified.


    +   - The box icon: This icon maximizes the window, meaning that the size of the
    window is changed to the maximum possible size on your desktop. After you''ve
    maximized a window by clicking this icon, the icon changes to a set of two overlapping
    boxes. You can click a second time on this icon to restore the window to its previous
    size (that, is, size before you maximized it).


    +   - The X icon: This closes the window. If you''re working with the main window
    for an application, clicking this icon closes the application; you''re working
    with a dialog box in an application, clicking the X for that dialog box closes
    only that dialog box.


    # Mastering other window tricks


    KDE windows have additional features:


    +   - Double-clicking anywhere on the title bar of a window, and the window changes
    to display only the title bar. If only the title bar is displayed, the window
    is *shaded*. Figure 11-6 shows a few windows that are shaded. The position of
    the shaded windows on the desktop doesn''t change; but because the windows are
    shaded, seeing many windows and their position is easier. As soon as double-click
    the title bar of a shaded window, the window is restored to its previous size.


    +   - Right-click the title bar of any window to bring up a pop-up menu of options.
    This sometimes calls the options menu or the control menu, is shown in Figure
    11-7.


    You can open the control menu for the active window at any time by pressing the
    Alt+F3 key combination, or by clicking the small icon on the far left end of the
    title bar.


    +   - A feature that we haven''t described yet is called the sticky option. If
    you''re working with multiple desktops, each window is normally displayed only
    in one desktop. Any window can be made sticky so that the window appears in all
    desktops. If you change desktops (by pressing Ctrl+F2, for example), the sticky
    window is still right where you left it.


    The To control submenu for any window lets you move that window to another desktop.
    The submenu includes the names of all the desktops as you''ve configured them
    (one, two, three, four, default). After you choose an item from the To desktop
    menu, the window suddenly disappears. Move to the desktop where you moved the
    window to see it again.


