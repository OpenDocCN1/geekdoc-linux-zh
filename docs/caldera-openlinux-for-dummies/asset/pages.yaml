    Note that the shell puts the names in alphabetical order before giving the names
    to the command.


    +   3. Next, bash searches the PATH environmental variable looking for a command
    called ls. The PATH variable holds the names of directories that contain commands
    you may want to execute. If the command you want is not in the list, then you
    explicitly to tell the shell where it can find the command by typing either a
    complete or relative pathname to the command.


    +   4. bash executes the ls command in the new environment, passing to the command
    -l argument and all the filenames it expanded, as a result of using the * character
    in the command.


    +   5. After ls runs, bash returns to the current environment, throwing away all
    the side effects that occurred in the new environment, such as an environmental
    variable changing its value.


    In Step 1, we mention the environment. A shell operates in an environment just
    as humans live and work in an environment. We humans expect to have and use certain
    things in our environment and someone else decides to use it in your absence.
    At first, your coworker uses your environment exactly as you left it. The individually
    appreciates the fact that the phone works and actually the desk is stocked with
    office supplies, so that person doesn''t have to go out and find a phone and supplies.
    But after a while, this newcomer starts changing things, maybe even drinking decaffeinated
    coffee out of your coffee mug! When you return from your trip, everything in your
    office is different. You can''t find anything easily, and green stuff is growing
    in the bottom of your coffee mug. Wouldn''t it have been nice if that person had
    arranged your office (your environment) exactly as you left it?


    Bash creates an environment in which commands operate. As soon as a new command
    is executed, bash creates a clean copy of the command in that environment, and
    then throws away environment, returning to the environment it started with.


