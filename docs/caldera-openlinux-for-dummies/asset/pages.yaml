  md: '# Chapter 8


    # Working with Files and Commands


    In This Chapter


    +   - The ins and outs of files and directories

    - Finding your way through the OpenLinux file system

    - Changing where you are in the OpenLinux file system

    - Creating, moving, copying, and destroying directories and files

    - Giving permissions and taking them away

    - Puzzling out command syntax

    - Discovering a few OpenLinux commands

    - Modifying commands to suit your fancy


    In this chapter, you take your first steps through the directory. We introduce
    you to file types, subdirectories, and the root directory, and we show you the
    way home — to your home directory, that is.


    Next, you discover that you don''t need a map to find your way through the OpenLinux
    file system; few commands do the trick. Now that you''re oriented with the file
    system, you''re ready to make some changes. You find out how to copy and move
    files and directories, as well as how to create and destroy them.


    Then we take you through the process of changing a file''s ownership and permissions.
    And you get to practice your OpenLinux command syntax by tweaking a few OpenLinux
    commands.


    # OpenLinux File Facts


    Files stored in the OpenLinux file system are similar to DOS, Windows, and Macintosh
    files — a lot like UNIX files. Follow the bouncing prompt as we make short work
    of long files.'
