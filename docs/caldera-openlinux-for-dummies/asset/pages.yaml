    # The Root of All Power


    If you want to use OpenLinux, then you must log in as a particular user with a
    distinct username. Why? Because OpenLinux is a multiuser system that uses different
    accounts to keep people from looking at other people''s secret files, erasing
    necessary files from the system, and otherwise doing bad things. Having a unique
    identity also helps to keep the actions of one person from affecting the actions
    of another, because many people may be using the same computer system at the same
    time.'
