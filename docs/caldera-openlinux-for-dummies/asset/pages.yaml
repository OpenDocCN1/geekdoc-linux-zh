  md: '# 122 Part III: Using OpenLinux


    Specify a pathname relative to where you are. For example:


    ```

    pwd

    /home/nwells

    ls -la ../etc/passwd

    ```


    This pathname indicates that to find the passwd file, we go up two directory levels
    (../../), then down to /etc.


    If you want to see the login accounts on your system, you can issue the following
    command from your home directory:


    ```

    ls -la ..

    ```


    This command lists the parent directory. Because the parent directory (/home)
    has all the login directories of the people on your system, this command shows
    you the names of their login directories.


    # In pathnames, there are absolutes


    You''ve been looking at relative pathnames, which are relative to where you are
    in the file system. Filenames that are valid from anywhere in the file system
    are called absolute filenames. These filenames always begin with the slash character
    (/), signifies root.


    ```

    ls -la /etc/passwd

    ```


    In the View menu of each File Manager window, you can choose Show Hidden Files
    to include dot files in the window. If you''re viewing hidden files, you can click
    on the dot-dot (..) directory to change to the parent directory of your current
    working directory. You can also click the up arrow icon on the toolbar, which
    is usually the easier way to change to a view of the parent directory.


    # Changing your working directory


    Sometimes, you may want to change your working directory because doing allows
    you to work with shorter relative pathnames. To do so, you simply use the cd (for
    change directory) command.


    To change from your current working directory to the /usr directory, for example,
    type the following:


    ```

    cd /usr

    ```'
