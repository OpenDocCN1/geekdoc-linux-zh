  md: '# 306 Part VI: The Part of Tens


    Log off and then back on to reexecute your .bashrc file (assuming you''re using
    the bash shell), and bingo, ls shows different file types in different colors.


    # OpenLinux Can''t Find a Shell Script (Or a Program)


    **Problem:** You type a command name, but OpenLinux can''t find the command, even
    if the file matching the command name is in the current directory.


    **Solution:** When you type a shell or binary command name, OpenLinux looks for
    the name in specific places and in a specific order. To find out what directories
    OpenLinux looks in, and in what order, type the following command:


    ```

    echo $PATH

    ```


    You see a stream similar to the following:


    +   - /bin:/usr/bin:/usr/local/bin


    OpenLinux looks in these directories to find the command, script, program, or
    shell that you want to execute. You may see more directories, depending on your
    distribution or how your system administrator (if you have one) set up your system.


    Now suppose you create a shell or a program called flobn and want to execute it
    (assuming you''ve set the permission bits to make flobn executable by you). You
    have two choices (well, you have more than two choices, but we''re listing the
    safest ones). One choice is to type the following on the command line:


    ```

    ./flobn

    ```


    This command tells OpenLinux to look in this directory (/) and execute flobn.


    Your second choice is to move flobn to one of the directories shown in the PATH
    variable, such as /usr/local/bin.'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# Chapter 18: Ten Problem Areas and Solutions


    # When I Start KDE, I See a Gray Screen


    Problem: You configure the X Window System (the graphical foundation of KDE),
    but when you log in as a general user (that is, not as root) and type startx,
    all you get a gray screen with a big X in the middle. You wait a long time, but
    nothing happens.


    Solution: First, understand that you may have to wait a long time if you have
    a slow CPU with a small amount of memory (about 8MB). Some machines with small
    amounts of memory take as long as 6 minutes to start the X Window System. But,
    assuming you''re starting the X Window System on a machine with a faster CPU and
    more memory, you may have problems with your home directory. This problem is particularly
    true if the X Window System works if you''re logged on as root (that is, as superuser)
    but not when you''re logged on as a general user.


    To correct this problem, log in as root and go to the home directory of the user
    who''s having problems. For example, suppose that member is the login name of
    the user. After you''re in the user''s home directory, issue the ls -ld command
    to see who owns that directory and what that directory''s permissions are:


    ```

    cd member

    ls -ld

    drwxr-xr- root bin 1024 Oct 31 16:00 .

    ```


    Note in this example, the directory is owned by root and the group ownership is
    bin, which doesn''t allow member to have access to the directory inside the directory.
    Because the shells and terminal emulators needed by the X Window System require
    access to that directory structure, the X Window System (and thus KDE) can''t
    fully work.


    To correct this problem, use the chown and chgrp commands to change the ownership
    of the member home directory to member and change the group ownership of the member
    home directory to users:


    ```

    chown member ~member

    chgrp users ~member

    ```


    Make sure you replace the member login name that we use in this example with the
    login name you''re having difficulty with.'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# I Never Seem to Have the Correct Time


    **Problem:** After you boot OpenLinux, the time is wrong, so you set it with the
    `date(1)` command. Then you boot Windows and its time is wrong, so you set it
    with the `date(1)` command. Then you boot Windows and its time is wrong, so you
    reset it. When you reboot OpenLinux, its time is wrong again.


    **Solution:** Most UNIX systems keep their time using Universal Time (also known
    as Greenwich Mean Time, or GMT), but Microsoft systems keep their time as local
    time. When you set the time in either system, you set the CPU clock to that version
    of the time. Then when you boot the system, the other system interprets what is
    in the CPU clock differently and reports a different time.


    OpenLinux enables you to store and think of the clock as either GMT or local time.
    You make this choice when you install the system. To change your choice, follow
    these steps:


    +   1. Log in as root.

    2. Type lisa.

    3. Choose System Configuration from the menu.

    4. Choose System Configuration from the next menu as well.

    5. Choose Configure Time Zone.

    6. Choose Local Time from the menu that appears.

    7. Select your time zone from the list that appears.

    8. Repeatedly choose Continue to back out of the lisa menus and exit this utility.

    9. Reset the time to the proper value using the `date` command if you reboot OpenLinux
    or through the Windows system if you boot Windows.


    This setting prevents the conflict between OpenLinux and Windows that causes you
    to have problems setting the clock correctly.'
  merge: -1
