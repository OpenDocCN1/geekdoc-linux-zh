  md: '# Chapter 1


    # OpenLinux and You


    In This Chapter


    +   - Finding out what Linux is all about

    - Discovering why OpenLinux outperforms other systems

    - Figuring out how you can use OpenLinux


    In 1991, Linus Torvalds, an undergraduate student at the University of Helsinki,
    got a brand-new IBM 386 PC. Dissatisfied with the operating system that came with
    the hardware, Linus wanted to run the UNIX operating system instead. UNIX, however,
    was too expensive, so Linus and a team of talented programmers tackled the daunting
    task of creating a new version of UNIX. They created a core operating system,
    or kernel, named Linux. Since those early days, Linus Torvalds has been on the
    cover of Forbes magazine, given keynote addresses at major computer trade shows,
    and been referred to as the nemesis of Bill Gates. Who knows what the next five
    years may bring!


    # Why Is This Stuff Free?


    One of the most important decisions Linus Torvalds made early on about the Linux
    kernel was that all the code would be freely distributable. So several organizations
    accumulated huge amounts of freely distributable software, added software to the
    Linux kernel, and then created a way to install the software on the computer.
    This process is called creating distribution.


    To learn more about many of the free software components included with OpenLinux,
    you may want to check out the Free Software Foundation Web site at www.fsf.org.


    Distributions were available in several forms: the Internet, CD-ROMs from software
    publishers (who charged a distribution fee), and bundled with other programs (also
    charged by organizations). In every case, however, the Linux kernel and other
    freely distributable code had to be identified and made available without a charge.


    ![](img/3c04420fbc1d01311e6031144afaecd2_36_0.png)'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# 12 Part I: Introducing OpenLinux


    ![](img/3c04420fbc1d01311e6031144afaecd2_37_0.png)


    # Let''s be open about Linux


    Linux is the first operating system in major use today that got start outside
    the United States of America. All other operating systems, although they have
    received some support and construction from non-U.S. participants, were conceived
    and maintained in the United States. People from all the world — and increasing
    from countries not globally recognized as technology countries — contribute to
    Linux.


    the United States. I tell them that the next Einstein of computer science may
    come from Korea, China or Venezuela, or even Helsinki, Finland, and the world
    cannot afford to miss the opportunity of finding him. While standing with the
    president of the University of Sao Paulo, Brazil, in front of his school''s supercomputer
    that was running Linux. He answered my observation with “We, too, considered that
    point.


    When people ask why I think Linux and the Open Source development projects are
    so important, I answer that I''m not so egotistical as think that all good programmers
    come from


    | | |

    |---||

    | TECHNICAL STUFF | |


    The importance of the operating system''s source code''s availability can''t be
    overstressed. The result of freely distributable source code is a Linux operating
    system that continues to improve rapidly. Every developer can build on the efforts
    of an earlier developer, who benefits everyone — including you.


    Linux kernel development started in 1991. By early spring of 1994 (not long before
    Caldera''s start), the first version of Linux (V1.0) became available for public
    use. Even then, Linux was an amazing operating system, running in less than 2MB
    of RAM on Intel systems at awesome speeds. This free system included the following
    features, which were found in operating systems costing hundreds of dollars:


    +   - Multitasking (running more than one job simultaneously)

    - Multiple users simultaneously

    - High-performance virtual-memory system allowing OpenLinux to use hard-disk space
    as an extension to RAM


    An estimated 125 thousand people were active users in 1994. (Because no licenses
    are issued for individual users, a more precise number can''t be determined.)
    In 1997, just three years later, the estimated number of Linux users was 3 million
    and climbing rapidly. By the fall of 1999, the estimates were more than 10 million.'
