  md: '# Chapter 15


    # Setting Up Your Internet Connection


    In This Chapter


    +   - Finding an Internet service provider

    - Connecting with your modem

    - Making the connection between your modem and your Internet service provider

    - Starting and stopping the Internet service software


    One of the things to do these days is to surf the Net. You connect to the Internet
    and tie up your phone line for hours, looking for obscure information and sending
    e-mail to people you barely know and never speak to on the phone.


    Now, you too can go to a party and drop the casual phrase “I found this while
    surfing the Net this afternoon … [which will draw bored looks] … on on my OpenLinux
    system.” The mention of OpenLinux immediately shows that you’re truly a person
    of class and standing in the Internet community.


    First, though, you have to find a good Internet service provider, hook up your
    phone to the computer (using a device called modem), and set up a few simple items
    on your OpenLinux system (to satisfy the networking gods) to make the connection.


    # The Search for an ISP


    We categorize Internet service providers (ISPs) into those that specialize only
    in Windows and Windows NT products and those that are good. By good, we mean ISPs
    that also can handle UNIX and Linux accounts.'
