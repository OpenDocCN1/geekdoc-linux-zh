    # Here''s vi


    vi editor is useful because it''s always available. If you have to rescue a crashed
    system, edit the command line (without KDE running), or work with text files on
    a buddy''s UNIX or Linux system, vi is always there. The vi editor has two modes
    of operation and uses many single-letter commands. To start vi, you type vi at
    the command line. The screen clears, and the leftmost column displays tildes (-).
    You''re now looking at an empty, unnamed buffer in memory where you can enter
    text until you save the text to a named file.


    You can start the vi editor in a number of ways with different options, but the
    most common way is to start vi with only a filename as the argument, like this:


    ```

    vi kim.chl

    ```


    where kim.chl is the name of either an existing file that you want to edit or
    a new file that you want to create.


    You can execute vi(1) by typing vim, but most distributions have a link to vi
    and as ex. A link is a way to give two names to the same program. Although the
    same program is being executed, the system is smart and looks at what the user
    types when starting the program. That way, vi users can continue to type vi and
    see what they''re used to seeing with vi(1), and likewise vim(1) users can type
    vim.


    The vi editor has three modes of operation:


    +   - Visual command mode: Your keystrokes are immediately applied to the document
    as commands rather than being entered in the document. Pressing Enter is not required.


    +   - Colon command mode: Complex commands similar to what you would enter at
    an OpenLinux command line use this mode. To execute these commands you press Enter.'
