  md: '# Chapter 8: Working with Files and Commands


    Follow these steps to use the cat command to create a file by redirecting the
    output of the cat command from the screen to the filename that you want:


    +   1. At the command line, type cat > followed by the name of your file, then
    type your little heart out.


    Here''s what we typed:


    ```

    cat dogfile

    Hi again

    Dogfish. Dogleg. Dog days.

    Doghouse. Dogfight. Doggone.

    ```


    Everything is repeated to the file called dogfile, not to the screen. OpenLinux
    created dogfile for us because the filename didn''t already exist.


    +   2. After you finish typing, just press ^D (Ctrl+D) on an empty line.

    Youre right back at the OpenLinux prompt.


    Are you wondering whether the cat command did what you wanted? You can check by
    using the cat command and the filename again:


    ```

    cat dogfile

    Hi again

    Dogfish. Dogleg. Dog days.

    Doghouse. Dogfight. Doggone.

    ```


    This time the cat command took the file off the disk and put the output to standard
    out (also known as standard output), in which case is your computer screen.


    If you think of something that you want to add to the file, you can use the append
    symbol (>>) with the filename. OpenLinux adds whatever you type to the end of
    the filename. Returning to dogfile:


    ```

    cat >> dogfile

    Dog-eared. Doggerel.

    ```


    Are we confusing? You use the cat command to concatenate files or input to either
    the beginning or the end of the file. The cat command is the only command created
    to do this. You can also use the >> symbol to add data to the end of a file.


    The >> symbol can be used with many OpenLinux commands. For example:


    ```

    cat file1 file2 file3 file4 >>fileout

    ```


    joins file1, file2, file3, and file4, putting the results in fileout. In the following:


    ```

    sort file1 >>file2

    ```


