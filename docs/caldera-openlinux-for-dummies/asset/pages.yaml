  md: '# Getting Information from Windows 95/98


    If you have Windows 95 or Windows 98, you can use the msd program in MS-DOS mode,
    as described in the next section, to find out about the hardware in your system.
    Much more information is available, however, through the Control Panel in Windows
    95 or Windows 98. The Steps that follow are designed for a Windows 98 system,
    with notes to help you accomplish the same task on Windows 95.


    With pencil and paper handy, it''s time to access the Windows Control Panel and
    all that information. Follow along with these steps:


    +   1. Click Start > Settings > Control Panel.


    +   2. Double-click the System icon.


    The System Properties dialog box opens.


    +   3. Click the Device Manager tab.


    +   4. At the top of the screen, select the View devices by connection option.


    This view shows all the components and how they relate to each other. The screen
    looks printer similar to Figure 3-1.


    If you have a printer attached to your system, then you now can click Print on
    the Device Manager tab. Then in the Print dialog box that appears, select the
    All devices and summary option. Click OK. This procedure prints a full report
    about your system. You may not have all the information you need, such as which
    hard disk goes with which controller, but you''ll save yourself a lot of writing.


    +   5. In the list, click Computer.


    +   6. Click the Properties button.


    The Computer Properties dialog box appears.


    +   7. Select the View Resources tab of the Computer Properties dialog box.


