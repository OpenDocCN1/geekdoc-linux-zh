  md: '# Chapter 6: Solving Problems with the Graphical System


    # Configuration Conflagration


    Now that you know all the information about your video hardware, start configuring
    the X Window System. We assume you don''t have your graphical system up and running
    already. If the graphical system is up and running, what are you doing here? Go
    on to another chapter.


    Several tools are provided with OpenLinux to help you get the X Window System
    configured and running. The three we look at here are


    +   * Lizard X configuration tool

    * XF86Setup

    * xf86config


    **Note:** You see in the figures for this chapter that we already had the X Window
    System running in order to take the screen captures and show you how things work.
    Rest assured that the programs we describe work from a character-cell command
    line as well.


    # A running Lizard


    The Linux Wizard (or Lizard X) installation program that we discuss in Chapter
    5 is just about the best tool for configuring X that we''ve ever seen.


    You can use the same tool (after you''ve installed the rest of OpenLinux, rebooted,
    and logged in) to adjust the graphical settings or get things working the first
    time.


    You can start the program two ways:


    +   * If you don''t have X working at all yet, enter the command `lizardx` to
    start this utility.

    * If you have the graphical environment running and want to adjust it by using
    this utility, choose COAS*C server on the main menu (click the K icon in the lower
    left corner of the screen to open the main menu).


    After you''ve started Lizard X, follow these steps:


    +   * Configure your mouse in the first Lizard X screen (shown in Figure 6-1),
    and then select Next to continue.


    Follow the same instructions that are provided in Chapter 5.'
