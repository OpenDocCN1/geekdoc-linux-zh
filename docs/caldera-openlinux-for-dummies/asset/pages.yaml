- img_proc: true
  md: '# Appendix B: The OpenLinux man Pages 331


    ```

    HOST=localhost.localdomain

    OSTYPE=Linux

    OPENHOME=/usr/openwin

    SHLVL=2

    _=/usr/bin/printenv

    ```


    This list has lists of environmental variables, and we can''t describe them all;
    but here are the most important ones:


    +   - PATH tells the shell all to look for commands

    - HOME tells cd where to go when you don''t supply any arguments

    - OSTYPE tells the shell and programs what operating system they''re


    Different shells have different ways to set these variables (and create and set
    others) to tell the commands what to do.


    Note that a variable not set to some value (null) is different from a variable
    that doesn''t exist (unset), and these differences vary from command to command.
    For example, in the preceding listing, the first variable, USERNAME, is set to
    NULL. The fact that the variable is there at all is significant. The fact that
    the variable is set to NULL instead of some other value is also significant to
    various programs.


    # Diagnostics


    Error messages or exit codes indicate that something has gone wrong in the program
    or the shell. Normally, UNIX error messages are terse. Sometimes things seem to
    be wrong, but they''re really okay. For example, most users of UNIX think when
    they issue an ls command in an empty directory, they should get an error message,
    such as directory empty or file not found. The problem? The ls command by itself
    can display the names in any order (as opposed to ls *, which displays the files
    in alphabetical order). Therefore, if you have a directory with three files named
    file, not, and found, which happen to print in that order, then you can determine
    if the directory is empty. Granted. This example is contrived; but the UNIX developers
    thought that less is better than more (no, we''re not talking about the command
    means less and more), and that silence is golden (which means something if you''ve
    ever heard those old, noisy, dot-matrix or daisyprinter)


    Most programs display an exit code that you normally don''t see, unless it''s
    a nonzero code (meaning that the program ended unsuccessfully). If you''re a programmer,
    then you can test the value of the exit code to determine if an error has occurred;
    and if you write programming or shell script, then we encourage you to set and
    test exit codes.'
  merge: -1
  pgno: 356
- img_proc: true
  md: '# Bugs/deficiencies


    Yes, all programs have bugs, and most Linux people are good about correcting them.
    But some bugs are so arcane that they affect only one in a million people, and
    to try and correct them would mean redesigning the entire program. This type of
    bug is regarded, therefore, as a deficiency or a limitation and is listed in the
    man page.


    # Compatibility issues


    If a new version of a command or a program comes out, the new version may work
    slightly differently than the old command or program. This difference can cause
    a compatibility issue with shell scripts that were written to use the old command
    or program. If the author of the command or program thinks there''s a problem,
    then the problem should be documented here.


    # Caveats


    Caveats are warnings that the programmer gives to the command or program user.
    Caveats may include things to think about before executing the command or program,
    security issues, or how much file-system space the program uses on large applications.
    For example, if a program is known to be a potential security risk but is still
    a popular tool (remote access tools like the rsh command are an example of this),
    then the Caveats section may warn you to be more conscious as you use the program.


    # Disclaimers


    Disclaimers are usually legal statements included at the insistence of the author''s
    employer or the employer''s lawyers, telling you that if you use this program
    and the program harms someone, don''t come back to them. All programs in all operating
    systems have disclaimers somewhere.


    # Authors


    The authors are simply the people who wrote the command or program that the manual
    page page describes. Often, this section also explains how to report bugs or discuss
    new features that you may want to see.'
  merge: -1
  pgno: 357
- img_proc: true
  md: '# Acknowledgments


    The acknowledgments section (which is much more pleasant than the dis-claimers
    section) recognizes the work previously put into a program that has been expanded
    by the author. This recognition is the essence of Linux and the GNU Public License
    that allows and encourages people to build on the work of others.


    # Debugging options


    Some programs, such as sendmail, have the capability to diagnose problems. If
    the manual page has a debugging options section, you can find information on setting
    and using these options to debug the program.


    # Configuration files


    The program that a manual page describes often be controlled in several ways.
    Some programs use command-line options; others rely on environment variables;
    others use configuration files, sometimes known as startup files. This section
    of the manual page describes any configuration files used by the program.


    Configuration files may be in your home directory, a systemwide directory, or
    a sitwide directory. Often these files are looked for in a certain order. Systemwide
    files and local-user (your startup) files have the second and third strongest
    influence, respectively. This ordering enables a system administrator to set policies
    across companies and systems, allowing you to tailor your program to your needs.


    Examples of startup files are the .bashrc file (probably in your home directory)
    and the /etc/bashrc file (in the /etc directory). Note that the file in your home
    directory starts with a period. This type of file is called a hidden or dot file.
    Hidden files normally are not seen when you list your directory, unless you use
    the `ls -a` or `ls .*` command.


    # Copyrights


    People think that Linux code or other freeware code isn''t copyrighted. This is
    typically not true. Authors of the code take great care to copyright their code
    because they want credit for their work.'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# Copying permissions/distribution policy


    Most Linux code is given away by the copyright holder through the GNU General
    Public License — the GPL. This license is also called copyleft or OpenSource —
    The GPL stipulates that individuals holding a copy of the code can use the code
    for whatever purpose they want, as long as they make the code freely available
    to anyone who wants it. If they change the code, they must make their changed
    code (including the source code) freely available to those who want it, as well.


    Sometimes, other copying and distribution policies are associated with the command
    or program that the manual page describes. These policies can include the following
    types of permissions, where you may


    +   * Use but not redistribute the code

    * Use the code, but no source code is available

    * Use and distribute the code as shareware, by paying a fee for continued use

    * Have limited use, such as educational or personal (but not commercial) use

    * Use the code on one machine only


    If you''ve bought the operating system or a layered product (a distribution that
    includes both the operating system and a commercial application) or both from
    a CD-ROM vendor, then the vendor''s overall distribution policy is usually the
    strictest of any on the CD-ROM (that is, you''re limited to installing the operating
    system on one machine only because of its licensed software), so you don''t have
    to worry as long as you follow its overall licensing.


    # POSIX compatibility/standards conformance


    In the dark days of computer science, each vendor went off to develop its own
    operating system with its set of commands and programming interfaces. This approach
    created a Tower of Babel (not to be confused with the Tower of Hanoi, which is
    a puzzle game) among computer users and programmers. When UNIX systems first appeared,
    the systems however, were portable across different types of hardware. You could
    have the same operating system, commands, and programming interfaces whether you
    were programming a Digital Equipment Corporation system, a Sun Microsystems computer,
    an IBM computer, or others. Unfortunately, this portability lasted about ten minutes
    in the scope of UNIX''s life, after UNIX escaped from Bell Labs. it went to the
    University of California, Berkeley, and poof: Two different UNIX systems came
    into existence'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# Appendix B: The OpenLinux man pages 335


    A little later, vendors started bringing out their versions of UNIX — with some
    vendors using System V as a basis, and other vendors using BSD (as the Berkeley
    version was called). Some vendors, such as Sun Microsystems, started out with
    BSD and then switched to System V (to the chagrin of their users).


    In 1988, the IEEE developed the POSIX standard for operating systems. The IEEE
    is a great organization, and probably the greatest thing the organization has
    done is to build on UNIX rather than start over scratch with this specification.
    The interfaces are taken from the existing System V and Berkeley versions of UNIX.


    If an operating system is POSIX compatible and a program is written to POSIX standards,
    then the program should be able to run with no problems on the operating system,
    and users should be able to use that operating system with little or no retraining
    from the last POSIX operating system that they worked with.


    Although much work still has to be accomplished — both in defining POSIX and in
    vendors implementing POSIX — POSIX compliance and certification are worthy goals.


    Other standards, such as for network communication and putting data on CD-ROMs,
    should be implemented and met by manufacturers, distribution makers, and developers
    (not necessarily in that order). Standards are both formal standards and de facto
    standards, both of which will help your system work better with the next system.


    Linux was built with the goal of being POSIX compatible, so Linux follows many
    of the other POSIX standards. By following POSIX standards, Linux makes it easy
    to copy code from one set of POSIX-compatible interfaces to another and from one
    POSIX-compatible operating system to another. POSIX compliance also allows OpenLinux
    interoperability with other operating systems. Many people actively participate
    in the development of computer industry standards, such as POSIX, and the movement
    toward standards is generally supported in the Linux community.


    # Files


    In addition to the startup or configuration files mentioned previously, sometimes
    the command or program that the manual page describes uses other files in the
    system and temporary files for holding intermediate work. Such files are listed
    in the Files section of the main page. If a command doesn''t work, perhaps one
    of these files is missing, has the wrong file permissions (or the directory it
    in has the wrong permissions), is owned by the wrong person, or has corrupt data.'
  merge: -1
  pgno: 360
- img_proc: true
  md: '# Other places to look for help


    You can find help in other places on the system. First, try the `info` command.
    For example, enter `info ls` to learn about the `ls` command. Another place to
    look is the `/usr/doc` directory.


    Documentation, such as the documentation found in `/usr/doc`, can be put on one
    system and then made available to everyone through the magic of the Network File
    System (NFS). Tell your system administrator to load `/usr/doc` on your system
    to share documentation. If you are your own system administrator, then go into
    a closet and give yourself a lecture!


    *Note:* Some system administrators conserve disk space by not loading `/usr/doc`
    on their systems. With the abundance of inexpensive disks, doing this creates
    false economy.


    # Future work


    The future work section lists the author''s plans for the command or program that
    the manual page describes, often in an attempt to generate interest and help from
    other people.


    # See also/related software


    The see also/related software section lists programs associated with the command
    or program that the manual page describes. Often, several programs make up a system
    of programs to do a particular task. Some programs have similar capabilities but
    are not quite the same. Some programs are the antithesis of the program you''re
    looking at (for example, cut and paste). The *see also* often gives you an overall
    picture of what the program is supposed to do or leads you to the right program
    for the job.


    # Finding the Right man Page


    If you don''t know what command you''re looking for, then use the `apropos` command
    followed by the word that interests you. The `apropos` command searches all the
    man pages looking for that word and lists the `man` command names with one-line
    descriptions of all the commands containing that word. You probably should pipe
    the output of the `apropos` command into the less command:


    ```

    apropos print | less

    ```'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# Appendix B: The OpenLinux man Pages 337


    Note that apropos matches on partial words (called strings), which is why we suggest
    print instead of printer. The shorter your keyword, the more matches the command
    will find.


    Then, after you have the pages you want to look at, execute the man command for
    each one. From the one-line description, you probably decide which commands fits
    your needs.


    Next, look at the description field, which gives you a better idea of what the
    command can do. If you''re still not sure about the command''s basic functionality,
    look at the also section, to find out any other commands fit the bill.


    After that, skip the synopsis section — it''s usually a reminder of how to type
    the command — and go directly to the options section. Read through the options
    section, trying to apply the options to the basic description of the command.


    ![](img/3c04420fbc1d01311e6031144afaecd2_362_0.png)


    After you read several man pages, you notice that the same options appear for
    similar commands.


    All this is pretty work. To find out what a command really does, you can try the
    command out. Create a small test file using an editor, or use an existing file,
    such as the /etc/passwd file, as input.


    ![](img/3c04420fbc1d01311e6031144afaecd2_362_1.png)


    Do not do this as root. You may inadvertently erase part of the operating system.
    Performing this experimentation as a nonprivileged, normal user is the best.


    From time to time, I read all the man pages in the system, concentrating on the
    command descriptions. I do this because I want to become familiar with new commands.
    Also, my memory isn''t what it used to be. But to be fair to my failing memory,
    the system does have close to 1,000 general-user commands and about 260 system-administration
    commands.'
  merge: -1
  pgno: 362
