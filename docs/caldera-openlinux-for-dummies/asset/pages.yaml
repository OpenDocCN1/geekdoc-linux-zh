    # Finishing the kernel rebuild


    After the kernel is rebuilt the way you want it, you probably have to remake any
    modules you want to use. These modules are the ones that are specified in the
    kernel as loadable. The easiest way to remake the modules is to type make modules
    and make modules install after the basic kernel is built.


    In addition to making the kernel the way you want it, you have to tell the system
    where you want to put the new version of the kernel. One way to do this is using
    /etc/lilo.conf, which is the configuration file for the LILO boot loader. If you
    edit /etc/lilo.conf, you see a file that looks similar to this: * Teif *'
