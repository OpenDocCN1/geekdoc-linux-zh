    other programs that help keep track of your program''s code. Visual Slick Edit
    is definitely a programmer''s editor but can be useful for nonprogrammers,


    +   - Crisp by Vital, another language-sensitive, cross-platform editor run on
    many different UNIX and Linux systems, as well as on Windows 3.1, 95, 98, and
    NT.


    # E-Mail Tools


    E-mail consists of two main parts: a front end (or interface) that you use to
    compose or read messages, and a back end that delivers your messages. In addition
    to the mail-specific programs described in this section, note that some Web browsers
    can read mail and Internet News (a series of information postings accessible over
    the Internet), handle FTP downloads of files, and perform other Internet-related
    tasks.


    # Character-cell interfaces


    The first mail interfaces were available only in character-cell mode. Some character-cell
    interfaces follow:


    +   - mail(1): One of the first mail interfaces. Mail was a character-cell interface
    for early versions of UNIX. mail(1) remains a powerful interface and is still
    a useful program, when working in character-cell mode and wanting to send a quick
    mail message or scan recent mail messages.


    +   - elm(1): An interactive screen-oriented mailer that can be used in place
    of mail(1) as a front end. elm(1) is easy to use and presents a vim(1)-like editor
    for creating mail messages. pine(1) (which now means program for Internet news
    and email but previously was known by the friendlier name, pine is not elm) is
    an full-screen mail interface.'
