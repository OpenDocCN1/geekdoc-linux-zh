  md: '# Chapter 10


    # Avoiding Shell Shock


    In This Chapter


    +   - Discovering bash

    - Experimenting with wildcards

    - Using bash history to find files

    - Banging around to find files

    - Writing a simple shell program

    - Writing a not-so-simple shell program

    - Just a bit on multitasking


    Imagine that you''re in a foreign country and don''t know the language, so you
    hire an interpreter to accompany you on your visits to customers. You tell the
    interpreter what you want to do and where you want to go. The interpreter then
    decides what steps to take (hire a taxi or take the subway, for example) and in
    order. When the time comes for you to talk to customers, the interpreter takes
    the statements that you make in your language and changes them into the customer''s
    native language.


    Shells (also known as command interpreters) do much the same thing in Linux. Shells
    take the English-like commands that you type, gather resources (such as filenames
    and memory), and supply lower-level computer statements to do what you want.


    Many shells have evolved throughout the history of UNIX and Linux. Their history
    and derivation is discussed in the sidebar titled “The Bourne-again shell,” which
    appears later in this chapter. For now, we''d like to simplify the issue of which
    shell is best and suggest a shell for your use.


    We recommend bash because bash is widely available and has more features than
    you''ll ever need as a user. If you go on more of a programmer or if you really
    enjoy investigating shells, then you may want to try the popular zsh or the even-more-popular
    Tcl/Tk or Python scripting languages, both of which have graphical interfaces.


