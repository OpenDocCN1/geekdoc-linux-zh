  md: "# Chapter 8: Working with Files and Commands\n\n![](img/3c04420fbc1d01311e6031144afaecd2_142_0.png)\n\
    \nAs you find out about working with files and directories in this chapter, you\
    \ see how to complete many tasks both from the command line and within a File\
    \ Manager window. You can take your pick any time you've got a job to do.\n\n\
    # File types\n\nOpenLinux files can contain all sorts of information. Five categories\
    \ of files will become the most familiar to you: User data files, system data\
    \ files, directory files, special, and executable files.\n\n+   * User data files\
    \ contain information that you create. User data files, sometimes known as flat\
    \ files, usually contain the simplest data, consisting of plain text and numbers.\
    \ More complex data files, such as graphics or spreadsheet files, must be interpreted\
    \ and used by a special program. These files are mostly illegible if you look\
    \ at them with a text editor because the contents of these files are not ASCII\
    \ text. Changing these files generally affects only the user who owns the files.\\\
    \n\t\t\t* System data files are used by the system to keep track of users on the\
    \ system, logins, passwords, and so on. As system administrator, you may be required\
    \ to view or edit these files. As a regular user, you don't need to be concerned\
    \ with system data files except, perhaps, the ones you use as examples for your\
    \ own startup files.\n* Directory files hold the names of files — and other directories\
    \ — that belong to them. These files and directories are called children. Directories\
    \ in OpenLinux are just another type of file. If you're in a directory, the directory\
    \ above you is called the parent. Isn't this homey?"
