    eight partitions each (1–8). In addition, OpenLinux has a block-special-file for
    a SCSI CD-ROM (scd) with eight partitions (0–7). If you''ve got more disks than
    (we''re jealous), then you may have to create one or more additional block-special-files
    for the device, like this:


    ```

    cd /dev; makedev sd

