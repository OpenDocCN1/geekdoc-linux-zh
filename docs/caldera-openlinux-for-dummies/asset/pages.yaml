  md: '# Chapter 12


    # Do Something Useful


    In This Chapter


    +   * Using the OpenLinux day planner (KOrganizer)

    * Counting with the kCalc calculator

    * Playing tunes from your CD-ROM drive

    * Enjoying a game or two

    * Viewing and creating graphics

    * Running DOS programs in OpenLinux


    OpenLinux includes quite a useful graphical programs. Space prohibits us from
    showing you all the programs that run under KDE, or even all the programs that
    Caldera includes in a standard installation. But the programs we show you in this
    chapter are representative of OpenLinux and give you a good idea about how the
    other programs work.


    We have space to show you only the basic features of these programs. You can learn
    about the more advanced features by exploring the Help menu in each program and
    the KDE main menu. And if you''d like additional applications, check out the KDE
    Web site at www.kde.org/applications.html.


    # Organize Yourself


    Most of us need a little help keep track of a busy life. For many people carrying
    around a day planner of some sort or — people who regularly use a computer — keeping
    track of appointments and people in a program, such as Microsoft Outlook.


    KDE provides a similar program that lets you do the same thing in OpenLinux: KOrganizer.
    And you don''t have to pay extra for KOrganizer. To get started, choose Organizer
    from the Office submenu of KDE. The KOrganizer program window appears, as shown
    in Figure 12-1.'
  merge: -1
  pgno: 232
