  md: '# 242 Part IV: Maintaining Your System


    On OpenLinux systems, the block-special-file for the first floppy drive is /dev/fd0.
    The default density is 1,440 kilobytes. We assume you''re using 3½-inch, preformatted
    floppy disks.


    The following commands mount a floppy disk and write a DOS file to the floppy,
    (replace any-dosfile.txt with a real filename):


    ```

    mount /dev/fd0 /mnt/floppy

    cp any-dosfile.txt /mnt/floppy

    mount /mnt/floppy

    ```


    These commands are ways to move files back and forth to an MS-DOS (Windows 3.1,
    95, 98) or Windows NT machine. You can add the file to a floppy disk, insert the
    floppy into the MS-DOS machine, and the MS-DOS machine can read the file from
    the disk. Likewise, by mounting a floppy disk created on an MS-DOS machine, you
    can read and manipulate the files by using OpenLinux.


    The mtools package installed on your system enables you to access DOS disks and
    files without first mounting the floppy disk and adding it to your file system.
    Table 13-1 presents some mtools commands, which are probably familiar to DOS users.


    | Table 13-1 | The mtools Utilities |

    | Command | What It Does |

    | mformat | Formats a floppy disk in DOS format |

    | ylabel | Labels a DOS disk |

    | mcd | Changes the current directory location on a DOS floppy disk |

    | mdir | Lists the directory contents on a DOS floppy disk |

    | mtype | Displays a DOS file''s contents |

    | mcopy | Copies files between a DOS floppy disk and OpenLinux |

    | mdel | Deletes files on a DOS floppy disk |

    | mren | Renames files on a DOS floppy disk |

    | mmd | Creates a subdirectory on a DOS floppy disk |

