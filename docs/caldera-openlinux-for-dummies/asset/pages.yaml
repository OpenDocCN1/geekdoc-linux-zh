  md: '# Chapter 11: Windows on the World


    Press the Ctrl+Esc key combination. A window opens that lists all the open windows.
    Click the name of a window to switch to that window.


    # Moving day


    After you start a new application, KDE guesses where you want the newly opened
    window. More often than not, you want the window someplace else.


    To move a window in KDE, click the title bar (the blue bar across the top of the
    window), then drag the window to the desired new location and release the mouse
    button.


    # Resizing a window


    Most KDE windows can be resized to fit better with other windows on your desktop,
    or to make seeing the window''s contents easier. To resize a window, follow these
    steps:


    +   1. Move your mouse pointer to any corner of the window.


    As you position the mouse in just the right spot on the window, the mouse pointer
    changes from an arrow to a small angle bracket that matches the corner you''re
    pointing to.


    +   2. After you see the new mouse pointer, click and drag the mouse to resize
    the window.


    If you can''t seem to get the mouse pointer to change, you''re probably dealing
    with a window that can''t be resized. Most application windows, however, can be
    resized using the steps in this section.


    # Making a window a big deal or getting the window out of sight


    If you want a really big window, you can maximize the window instead of trying
    to stretch it by dragging your mouse cursor to the outer limits of your screen.


    Each window includes three small boxes or icons on the right side of the title
