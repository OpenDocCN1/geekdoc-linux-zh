    This command creates the block-special-files for SCSI disk 7. Note that in both
    IDE and SCSI disks, the letters and disk numbers correspond: a for the first disk,
    b is for the second, and so on.


    If you add a SCSI disk drive with a lower ID number than one you have already,
    the new disk drive takes on that number. Suppose you have SCSI disk drives with
    hardware ID numbers of 0, 2, and 3. OpenLinux gives these disks the names sda,
    sdb, and sdc, respectively. You make your partitions and your file systems and
    create your entries in /etc/fstab to show where you have the files mounted. Now
    you get a new disk drive and set the hardware ID number to 1. When you reboot,
    the new disk drive gets the sdb designation, and the disk drives with ID numbers
    of 2 and 3 are renamed to sdc and sdd, respectively. To avoid this, you must now
    now, at the very least, change your /etc/fstab table. For this reason, we recommend
    adding SCSI disk drives to your system starting with ID 0 and working up the number
    chain, with no gaps in the partition.


