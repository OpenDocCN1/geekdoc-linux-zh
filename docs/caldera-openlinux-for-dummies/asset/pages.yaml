    along in this chapter.


    # Just a few god commands


    Shell programming depends heavily on the hundreds of specialized programs that
    come with most UNIX systems. These specialized programs, perhaps 20 or 30 of them
    are used in day-to-day scripting, but the other programs just exist in case. Most
    of these programs, if not all, are documented in Section One of the man pages.


    I still remember the day I began to feel comfortable with UNIX (long before Linux
    was available). I was trying to do something with a shell script, utilizing the
    20 to 30 commands I knew. Finally the thought occurred to me that I was not sure
    UNIX had the command I, there was a strong probability that it did. So I started
    going through the manual pages looking for a command that might help. Enough,
    it was there. From that day, I felt comfortable with UNIX, even though I keep
    learning about it every day. From time to time, I still go through the reference
    pages of the manual one by one, both to find out new commands and to refresh my
    memory on old ones.


    Each of these commands typically does one thing very well, and you can put the
    commands together with pipes and shell-script glue to solve more complex problems.
    Becoming familiar with these specialized commands takes time and practice, but
    after you''re familiar with them, your abilities expand a threefold.


