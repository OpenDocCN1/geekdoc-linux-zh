  md: '# 96 Part II: Installing OpenLinux


    # Shutting Down OpenLinux


    If you''re accustomed to an older Microsoft Windows system, then having a section
    on shutting down the system may seem strange. After all, shouldn''t you just turn
    off the power switch? No! All modern operating systems require that you "officially"
    shut down the system, effectively telling the system to get ready for power to
    go off. OpenLinux requires a systematic process to shut down the operating system,
    after which you can turn off the power switch.


    If you''ve just installing the system, you''re logged in as a system administrator
    called root. Follow these steps to shut down the system:


    +   1. If the graphical environment (KDE) is running, choose Logout from the main
    menu (or right-click the desktop background and choose Logout).


    The system returns either to character-cell mode with a # prompt, or to the graphical
    login screen. If you''re in character-cell mode, type shutdown-h at the prompt.
    Doing so tells OpenLinux to halt the operating system now rather than waiting
    a while. Otherwise, continue to Step 2.


    +   2. If you''re at the graphical login screen, choose Shutdown.


    A small dialog box appears where you can choose to shut down the system or shut
    down restart the system (with a couple of other options).


    +   3. Choose the option you need and press OK.


    shutdown is a command to OpenLinux. Some commands have options, or flags, that
    provide additional information about what the command should do. -h means to halt
    the system after it shuts down, rather than rebooting.


    r means to reboot after shutting down. now means to start the process of shutting
    down immediately. Without the now, the shutdown command hesitates and sends warning
    messages to people still working on the system, telling them that the system is
    about to be turned off.


    Another method of rebooting the system is the infamous three-finger salute Ctrl-Alt-Delete.
    The three-finger salute simply sends a shutdown r now command to OpenLinux, and
    the result is the same as if you had typed this command.


    As an OpenLinux user, rebooting the system should be an infrequent occurrence.
    Because the login procedure provides an OpenLinux system with the necessary security,
    you don''t need to shut down the system between sessions. OpenLinux is stable,
    so it doesn''t freeze or crash, as do some other PC-based operating systems. If
    you have multiple operating systems on the same machine, however, rebooting takes
    you back to the LILO prompt (or Boot Manager, System Commander, or some other
    booting program) to allow you to boot another operating system.


    ![](img/3c04420fbc1d01311e6031144afaecd2_121_0.png)'
  merge: -1
