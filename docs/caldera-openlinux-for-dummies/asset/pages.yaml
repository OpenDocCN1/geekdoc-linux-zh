    # Manipulation at Its Best


    OpenLinux has many ways to create, move, copy, and delete directories. Some of
    these features are so easy to use that you need to be careful: Unlike other operating
    systems, OpenLinux won''t tell you that you are about to overwrite a file — it
    just follows your orders and overrides!


    ![](img/3c04420fbc1d01311e6031144afaecd2_151_0.png)


    We said it once but we''ll say it again: Make sure that you''re not logged in
    root while you go through these sections.


    # Creating directories


    To create a new directory in OpenLinux, use the mkdir command (just like in DOS).
    The command looks like this:


    ```

    mkdir newdirectory

    ```


    This command creates a subdirectory under your current or working directory. If
    you want the subdirectory under another directory, change to that directory first
    and then create the new subdirectory.


    Create a new directory called santa_cruz. Go ahead, do it:


    ```

    mkdir santa_cruz

