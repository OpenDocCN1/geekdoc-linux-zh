  md: '# Chapter 8: Working with Files and Commands


    lonely screen. You can take that information and put — or input — it into a program
    that divides the information into screen-sized pieces and then displays them.


    To do this, you use the more command, which is an appropriate name for this tool.
    You use pipe the list command''s output to the more command. But how do you pipe?
    You use the character on your keyboard. We just bet you were wondering what the
    heck that key was for. Type the command as follows:


    ```

    ls -al /etc | more

    ```


    OpenLinux doesn''t care if spaces surround the | character, but you may want to
    use the spaces for clarity and to get in the habit of including spaces because
    they are important at other times.


    After you press Enter, the information appears one screen at a time with the more
    appearing at the bottom of each screen except the last one. To move to the next
    screen, press the spacebar. After you finish the last screen, the more command
    takes you back to the OpenLinux prompt. The more command can do even more. As
    soon as the screen halts with the word More appearing at the bottom, you can type
    some commands to the more program:


    +   - gets you out of the more command without waiting through all those

    - shows a list of all commands available in the more command


    Note that some commands to the more program (such as the b command) don''t work
    when you''re piping input to the program, as opposed to using with a file.


    Everyone makes mistakes. Everyone changes his or her mind from time to time. For
    those reasons, you need to know how to delete text from the OpenLinux command.
    If you want to start over, press Ctrl+U to remove everything you''ve typed on
    the command line — if you haven''t pressed Enter. The Backspace key erases one
    character at a time. The left and right arrows move the cursor along the line
    of characters without erasing them; after you get to the place you want to change,
    use the Backspace key to erase mistakes and retype changes. In most cases, the
    up-and-down arrow jump the cursor back and forth through the last few commands.


    OpenLinux sometimes uses a command less, which duplicates the functionality of
    the more command. Originally, the less command was designed to be more robust
    than the more command, but the more command caught up and now they''re almost
