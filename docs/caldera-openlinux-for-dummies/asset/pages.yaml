    The number of expanded arguments 8


    The shell expands the wildcard to include all the filenames that match the * wildcard,
    which in this case means all the files in the directory. The ## argument reports
    that eight arguments match the wildcard, however, because you requested only four
    arguments — filenames in this case — in your shell script.


    To see that eight arguments are really on the command line, type the following
    command:


