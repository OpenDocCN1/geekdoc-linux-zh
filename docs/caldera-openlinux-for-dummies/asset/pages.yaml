  md: '# Chapter 4: Making Room for OpenLinux 57


    Although FIPS is supposed to be nondestructive, make sure that you always back
    up your system and defragment your hard disk before using FIPS.


    The FIPS utility works by dividing the drive into two partitions. The first partition
    is the DOS partition that the existing Microsoft Windows operating system will
    continue to use. The second partition, beginning at the end of the space used
    by Windows software and encompassing the rest of the drive space, is the non-DOS
    partition where OpenLinux will be installed.


    # Defragmenting


    Follow these steps in Windows 95 or Windows 98 to defragment the hard disk on
    which you want to install OpenLinux. (This process is sometimes called optimizing
    the hard disk.)


    +   1. Close all programs and windows on your system, leaving only the desktop
    and icon bar.

    2. Double-click the My Computer icon on the desktop.

    3. Click C disk.

    4. Choose File:Properties.

    5. Choose the Tools tab in the dialog box.

    6. Click Defragment Now.

    nYou may get a message telling you it''s not necessary to defragment because your
    disk is not very fragmented. Under normal circumstances this may be true, but
    in this case it''s necessary to defragment your disk because you''re going to
    move the end of the file system and make it smaller. Any data outside that barrier
    is lost, so you have to move the barrier closer to the front.

    7. Click Start.


    The defragmentation window appears.

    Dragmentation takes some time to finish. You can scroll up and down the large
    window watching the progress (represented by different colored blocks). You can
    expect to see white space appearing towards the bottom of the window, which represents
    the end of your disk and shows that the data is being moved on the disk. At the
    end of the defragmentation process, no colored blocks should appear at the bottom
    of the window, instead all the blocks should be compressed toward the top of the
    window. The colored blocks represent programs and data, and the white space is
    free in your file system that you now may allocate to the Openlinux file system.


    ![](img/3c04420fbc1d01311e6031144afaecd2_82_0.png)'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# Part II: Installing OpenLinux


    # FIPS


    After you move the data in your Microsoft Windows partition as far possible to
    the front of the partition, you can use the FIPS program to shrink the Windows
    partition.


    Because FIPS works with low-level hard-drive operations, you can''t run FIPS directly
    in Microsoft Windows. Instead, copy the FIPS program onto your Windows hard disk
    so that the FIPS program is accessible without using the CD. Assuming that your
    CD-ROM drive is D:, use standard copy procedures to copy the file D:\tools\fips.exe
    to the root of your Windows partition (C:\). You can use your Microsoft Windows
    Explorer to drag and drop the file or use a DOS command like this:


    ```

    copy D:\col\tools\fips.exe C:\

    ```


    After you''ve FIPS available on the Windows partition, the next step is to shut
    down your Windows system so that you''re in MS-DOS mode. The easiest way to change
    to MS-DOS mode is as follows:


    +   1. Click the Start button.

    2. Click Shut Down.

    3. Select the Restart the Computer in MS-DOS Mode option.

    4. Click the Yes button.


    As soon as computer restarts, your system''s in MS-DOS mode.


    Next, you begin the process of starting the FIPS program and shrinking the Windows
    partition. This process involves quite a few steps, but each step is simple:


    +   1. Type cd \ and press Enter.

    2. Type FIPS and press Enter.

    3. As soon as you get the message to press any key, then press any key.

    4. After you get another message to press any key, then again press any key.

    5. After you''re asked whether you want to make a backup copy of sectors, type
    y for yes.


    Some messages appear, but you can ignore them — well, ignore all but the following
    message.


    You see all the existing partitions on the disk.


    You''re getting pretty good at this. You see a description of the disk and a series
    of messages. Then FIPS finds the free space in the first partition.


    The screen asks whether a floppy disk is in drive A.


    ![](img/3c04420fbc1d01311e6031144afaecd2_83_0.png)'
  merge: -1
  pgno: 83
- img_proc: true
  md: '# Chapter 4: Making Room for OpenLinux


    +   6. Place a similar to a formatted floppy disk into drive A and press y.


    A message similar to “Writing file a:\rootboot.000” appears, followed by other
    messages, and then the message “Use cursor to choose the cylinder, enter to continue”
    appears.


    Three columns appear on the screen: Old Partition, Cylinder, and New Partition.
    The Old Partition number is the number of megabytes in the main partition of your
    disk. The Cylinder indicates the position on the hard disk marking the division
    of the two partitions you''re creating. The New Partition number is the number
    of megabytes in the new partition that you are making for the OpenLinux operating
    system.


    +   7. Use the left and right arrow keys to change the numbers in the Old Partition
    and New Partition fields to give you the space you need for both the Microsoft
    operating system and OpenLinux.


    A minimum OpenLinux installation — without X Windows System (the graphical environment)
    — requires about 200MB of disk space. A standard installation requires about 500MB
    of disk space. The full distribution requires about 1400MB of disk space. (Whew!)
    Add to the amount of disk space that you need for OpenLinux, the amount of data
    space you need for your own files and additional applications. The amount of data
    space that you leave for the OpenLinux and Microsoft Windows operating systems
    is up to you.


    +   8. After you have the correct amount of disk space in each field, press Enter.


    FIPS displays the partition table again, showing you the new partition that has
    been created for the OpenLinux operating system. This partition will probably
    be partition 2; your Windows C: drive is probably partition 1.


    You also see a message at the bottom of the screen asking whether you want to
    continue or reedit.


    +   9. If you are not satisfied with the size of your OpenLinux and Microsoft
    partitions, type r, which takes you back to Step 7.


    Otherwise, type c to continue.

    nYou see a lot more messages about your disk. A message appears stating that the
    system is ready to write the new partition scheme to disk and asking whether you
    want to proceed.


    +   10. Type y, and FIPS writes the new partition information to the disk.


    If you type n, FIPS exits without changing anything on your disk. Your disk is
    exactly the way the disk was after you defragment it.


    +   11. To test that the nondestructive partitioning worked properly, reboot your
    system by pressing Ctrl+Alt+Delete.'
