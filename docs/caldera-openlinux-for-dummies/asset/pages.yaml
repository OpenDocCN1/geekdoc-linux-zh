    ways, the Task Manager is nicer to use than vmstat because the Task Manager lists
    more information in one place and is better formatted (for human eyes). vmstat
    still has its units, though, vmstat''s lack of formatting makes it easier to use
    shell scripts.


    You can start the Task Manager from the main menu of KDE by choosing System: The
    Task Manager has two tabs:


    +   - The Processes List tab (shown in Figure 14-1)


    +   - The Performance Meter tab


