    its permissions to make the file executable. (Chapter 8 discusses file permissions.)


    The following is the program that we''ve outlined, along with an example of the
    program being:


    ```

    cat ~/bin/genreport

    cat /etc/passwd > passwd`date +Y%m`

    <CTRL+D>

    chmod +rx ~/bin/genreport

    cd

    mkdir reports ; cd reports;

