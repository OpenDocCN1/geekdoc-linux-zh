    # We Can Only Do 50 Things at Once


    Executing programs on an OpenLinux system, taking advantage of its multitasking
    capabilities — that is, running multiple programs at the time is nice. This process
    is also called job control. Windows NT does not multitasking, Windows 95 seems
    to be multitasking, UNIX systems have been doing multitasking for almost 30 years.
    Most of this multitasking capability is due to the shell being able to launch
    background jobs and manage them.


    For example, perhaps you have a task that will run a long time, with little or
    no human input needed. When you start that task, all you need to do is put an
    &ampersand; sign at the end of the line, and the job starts running in the background.


    ![](img/3c04420fbc1d01311e6031144afaecd2_205_0.png)


    For example, if you start kCalc (a really nice graphical calculator that comes
    with the default KDE Desktop installation from the Caldera OpenLinux For Dummies
    CD-ROM), you probably want to run it for a long time, and you want to type other
    commands at the same time.(For more on the kCalc program, see Chapter 12.) To
    put kCalc into the background (assuming you have the KDE Desktop running), you
    can start kCalc by typing the following command into a terminal emulator:


    ```

    kcalc &

    [1] 2449

    ```


    The number in brackets is the job number, followed by the process ID number. The
    job number is the number shell gives the kCalc program to keep track of the ical
    job. The process ID number is the number entire operating system uses to keep
    track of the kCalc program.'
