  md: '# Chapter 4


    # Making Room for OpenLinux


    # In This Chapter


    +   - Creating your Install and Modules disks

    - Squeezing OpenLinux onto your disk

    - Finding out what you need to install from a CD-ROM


    Now''s the time to open your copy of OpenLinux — unless you''re the impatient
    type and have already already ripped it from its packaging. If you have a boxed
    copy of Caldera Systems OpenLinux or are using the copy the Caldera OpenLinux
    For Dummies CD-ROM, the installation should work almost exactly as described here.


    To install OpenLinux you must take care of two things:


    +   - Make room for the OpenLinux operating system

    - Launch the OpenLinux installation program


    This chapter gently guides you through both processes.


    # Move Over and Make Room for OpenLinux


    Before you can install OpenLinux on your system, you need to make room for it.
    Some people find by getting rid of Microsoft Windows altogether. Others don''t
    want to make such drastic changes and prefer to have both OpenLinux and their
    other operating system peacefully coexist. If having both systems fits the bill
    for you, your easiest way to have both systems is to add a new hard disk — either
    IDE or SCSI — to your system and then install OpenLinux on the new hard disk.'
  merge: -1
  pgno: 78
- img_proc: true
  md: '# 54 Part II: Installing OpenLinux


    If you don''t want to get rid of your current operating system and can''t add
    another hard disk to your system, you need to make some free space on the hard
    disk containing Microsoft Windows so that the hard disk can also contain OpenLinux.
    Freeing space on your hard disk takes a few extra steps upfront but is commonly
    done and doesn''t cause any problems with either operating system.


    The basic idea process that you use to free space on your hard disk is to


    +   - Defragment your hard disk so that all the free space is collected at the
    end of the disk.

    - Cut the free space so that the free space can be used for OpenLinux.

    - Mark the free space as a Linux file system.


    You can alter the space allocated to each operating system on your hard disk by
    using standard tools in Windows or OpenLinux. Under normal circumstances, changing
    the space allocation, or partitions, on your hard disk erases everything on the
    hard disk. This is called destructive reartition. We assume that you don''t want
    to use this method, because it requires you to back up and restore your entire
    Windows system. So, we describe two methods of nondestructive reartition that
    let you rearrange the space on your hard disk is used for different operating
    systems without wiping out all the data on the hard disk.


    You can choose from two methods of nondestructive reartitioning of your hard disk:


    +   - Using commercial disk reartitioning software, such as the PartitionMagic
    CE utility that we discuss in the next section.

    Unfortunately, PartitionMagic is available only if you''ve purchased a commercial
    (boxed) copy of OpenLinux.

    - Manually repartitioning the hard disk. This method (the one we use regularly)
    relies on the free utilities that come with the Caldera OpenLinux For Dummies
    CD. (See "Manual repartitioning" in this chapter.)


    ![](img/3c04420fbc1d01311e6031144afaecd2_79_0.png)


    Before performing any major work on restructuring your hard disk — as you''re
    about to do — backing up your system in case something goes wrong is always wise.
    You don''t want to lose any data or programs that you worked to install. Please
    refer to your system owners'' manual to find out how to back up your system (and
    how to restore the data if necessary). We can''t stress this point strongly enough.
    Unfortunately, deciding to back up data after a catastrophic problem has occurred
    is too late.'
  merge: -1
  pgno: 79
- img_proc: true
  md: '# Use some magic on your hard disk


    Rearranging all the data on your hard disk can be an intimidating task. You start
    with a working system but you''re never quite sure if you''re going to end up
    with a working system, especially the first time you try these antics.


    To things a little easier on everyone, Caldera Systems worked with a world-class
    disk-utility company called PowerQuest. PowerQuest produces a disk-partitioning
    tool called PartitionMagic. Together PowerQuest and Caldera Systems created a
    special version of PartitionMagic called CE (Caldera Edition). By using this utility
    you can squeeze an existing Windows partition and make everything ready to install
    OpenLinux without even breaking a sweat.


    Unfortunately, the Partition CE utility is a commercial package that''s only included
    in the boxed version of OpenLinux. If you have the boxed version of OpenLinux,
    you can follow these steps to use PartitionMagic.


    +   1. Start Microsoft Windows and insert the commercial OpenLinux CD in your
    drive.

