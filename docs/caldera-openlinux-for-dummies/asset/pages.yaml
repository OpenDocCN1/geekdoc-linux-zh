  md: '# 182 Part III: Using OpenLinux


    You can have dozens or even hundreds of background processes. If all the background
    processes accept data from the keyboard at the same time, how do you know which
    program is receiving the data? Each program has to wait until you recognize it,
    bring the program into the foreground, enter the necessary data, and then put
    the program back into the background, where the program blissfully keeps running
    until it terminates or again needs input from the keyboard (or standard input,
    as you have come to know it). Now you know why largejob was waiting to accept
    such valuable and timely input.'
