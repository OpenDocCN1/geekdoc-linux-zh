  md: '# 304 Part VI: The Part of Tens


    Some early CD-ROMs pretended to be other devices (such as tape drives or floppies)
    to fool the computer system into using them, but those CD-ROMs were hidden from
    the detection system. If your system has a hidden CD-ROM, don''t despair: You
    can supply information that helps OpenLinux find your CD-ROM.


    Refer to the previous section about disk numbering. Then apply the information
    in this section to figure out the name that OpenLinux would have given your CD-ROM
    if OpenLinux had known about it. If you have an EIDE/ATAPI CD-ROM, then type the
    following line wherever you see the boot or lilo while booting or installing your
    system:


    ```

    linux hdx=cdrom

    ```


    where X is the number that your CD-ROM has if the CD-ROM can be detected.


    # I Don''t Know How to Remove LILO and Restore My MBR


    Problem: You don''t know how to replace the boot record that was on your system
    before you started installing OpenLinux.


    Solution: You can log in to OpenLinux as root, and then type the following command:


    ```

    /sbin/lilo -u

    ```


    Another solution is to boot MS-DOS or Windows 3.1, 95, 98, or NT to an MS-DOS
    prompt and type the following:


    ```

    fdisk /mbr

    ```


    # I Can''t Use LILO to Boot


    Problem: You need to put OpenLinux on a disk or a partition that is beyond the
    1023rd cylinder, the second IDE disk, the second SCSI ID number, or you need to
    do something that makes it difficult for OpenLinux to boot by using LILO. Can
    you boot OpenLinux another way?


    Solution: You can use a program called LOADLIN to boot from your MS-DOS or Windows
    system:'
