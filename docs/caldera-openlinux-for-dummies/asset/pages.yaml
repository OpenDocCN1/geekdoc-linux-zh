  md: '# Chapter 18: Ten Problem Areas and Solutions


    +   1. Copy your configured Linux kernel to the C drive of your MS-DOS or Windows
    system.


    The easiest way is to install OpenLinux, log in as root, and type grep


    ```

    image /etc/lilo.conf

    ```


    A line similar to the following appears:


    ```

    image=/boot/vmlinuz-2.2.10

    ```


    which points to your compressed kernel (located in this example at /boot/vmlinuz-2.5.10).


    +   2. Copy the compressed kernel to a floppy disk, as follows:

    mcopy /boot/vmlinuz-2.2.10 a:\vlinux.gz


    The kernel name vmlinuz-2.2.10 refers to a specific version of the Linux kernel.
    Except for the /boot/vmlinuz-part, which remains constant, the name may be slightly
    different on your system.


    Next copy LOADLIN from the CD-ROM accompanying this book.


    +   3. Boot MS-DOS or Windows and copy the Calder OpenLinux For Dummies CD-ROM
    in your CD-ROM drive.


    +   4. Go to the DOSUTILS directory and copy LOADLIN.EXE to your C drive.


    If you''re using MS-DOS or Windows 3.1, then copy the LOADLIN16 file, which is
    the 16-bit version of the program.


    +   5. Copy the kernel image you just made on the floppy disk to your C drive.


    +   6. Exit Windows, go to the MS-DOS prompt, and then type the following (assuming
    your root partition is on partition /dev/hda5) to boot OpenLinux:


    ```

    C:\ loadlin vmlinuz.gz root=/dev/hda5

    ```


    # The ls Command Doesn''t Show Files in Color


    Problem: Using OpenLinux from the accompanying CD-ROM, you can''t get the ls command
    to show files in color.


    Solution: You have to edit the .bashrc file in your home directory to add the
    following line to the end of the file:


    ```

    alias ls=''ls - color=auto''

    ```'
