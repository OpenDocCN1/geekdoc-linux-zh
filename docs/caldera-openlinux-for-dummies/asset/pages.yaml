    ```


    The screen displays all the files in this directory with the .txt extension. Notice
    we didn''t say that the command shows you all text files or that it shows only
    text files. If you want to name a graphics file with a .txt extension, OpenLinux
    happily obliges you. For your own safety, however, be diligent in naming files.
    Some programs (such as those that create audio files or picture files) strictly
    enforce a naming convention on files they create, but OpenLinux doesn''t.


    What do you do if the * is part of the filename that you''re trying to match?
    How do you tell the shell you only want the file that contains *, not all the
    other? The backslash character escapes the meaning of the special character. In
    effect, the backslash says,"don''t treat the next character as a special character."
    For example, hi*est matches a file named highest, but hi\est matches only the
    hi*est filename.


    Although more regular-expression characters are available, this list of characters
    gives you some to work with for a while.


    # We can command


    Let''s see how the three parts of a command work together. Suppose you type the
    following OpenLinux command at the shell prompt:


    ```

    ls -1 *

    ```


    After bash looks at that line, it performs the following steps:


    +   1. bash creates a new environment in which to execute the ls command and determines
    what is standard input and standard output to the command. Standard input is normally
    the keyboard, and standard output is normally the video screen. (You find out
    more about environments in a moment.)


    +   2. expands * to match all the filenames in that particular directory. By expanding
    the filenames, we mean that certain special characters are used to identify groups
    of filenames. When the computer sees that filenames match these special characters
    are used and supplies the filenames to the command, instead of the special characters.


    For example, suppose you have the files ert, wert, uity, and opgt in your current
    directory. If you type


    ```

    ls -1 *

    ```'
