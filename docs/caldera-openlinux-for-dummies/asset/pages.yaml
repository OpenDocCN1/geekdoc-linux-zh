  md: '# Visit Web Sites


    A variety of Web sites are available for help. Some of these Web sites provide
    technical information, some provide news about the Linux community, and others
    furnish a bandstand for the Linux community to voice its opinions. Here are some
    Web sites that you may want to check out:


    +   - Linux International: www.li.org

    - LinuxXQ: www.linuxhq.com

    - Linux World: www.linuxworld.com

    - Linux Today: www.linuxtoday.com

    - Linux Documentation Project: www.metalab.unc.edu/LDP

    - Linux Now: www.linuxnow.com

    - Linux Journal, Linux Gazette, Linux Resources: www.linuxjournal.com

    - Linux Focus: www.linuxfocus.org

    - Linux Weekly News: www.lwn.net

    - Slashdot: www.slashdot.org

    - Freshmeat: www.freshmeat.net

    - File Watcher: www.filewatcher.org


    This list is not exhaustive. You can find links to many more sites in some of
    the Web sites mentioned here.


    Some of the lists offer opinions that are for mature audiences only. Most of the
    lists are moderated and most of the opinions are mature, but people sometimes
    get carried away by. Don''t judge technology by the radical opinions you may hear
    expressed about it. Be aware and form your own opinions.


    ![](img/3c04420fbc1d01311e6031144afaecd2_322_0.png)


    # Attend Conferences


    You can attend a number of conferences and trade shows for more information on
    Linux. New shows appear regularly, so keep an eye on the Linux-related Web sites
    listed above to see what events are coming up in the near future. Where possible,
    we list the more general Web addresses for these events. You may have to do a
    little Web surfing to find the next event of the year. If you get stuck, try the
    Linux International Web site, which has an Events page that lists new events.'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# Linux World Conference and Expo


    Linux World Conference and Expo is the first and largest of the Linux shows sponsored
    by a major trade show producer, IDC, who has been doing computer industry trade
    shows for years. The Linux World conference is intended for both technical audiences
    (with a conference track) and business audiences (with keynote speakers and trade
    show booths). Visit www.linuxworldexpo.com for details about upcoming dates and
    locations.


    # Linux Business Expo


    Linux Business Expo is part of the Comdex show put on by ZD Net events twice a
    year in the spring and fall. Though diluted by the Comdex crowd, Linux nevertheless
    continues to make a strong showing at this event. The Linux Business Expo is a
    new part of the event; Linux International and numerous Linux vendors have created
    a Linux Pavilion at the show for many years. Check out its Web site at www.comdex.com.


    # Linux Kongress


    Linux Kongress is the oldest Linux event. Held in Germany every year, Linux Kongress
    is a technical conference for Linux developers with a small collection of trade
    show booths. The Web site is www.linux-kongress.de.


    # Linux Expo


    Linux Expo is held in the Raleigh/Durham, North Carolina, area every spring. Linux
    Expo is a technical conference, trade show, and all-in-all good time. In 1998,
    more than 2,000 attendees and numerous vendors participated. The Web site is www.linuxexpo.org.


    # USENIX/FREEENIX


    USENIX, a technical organization that has long supported UNIX users, has several
    technical conferences and small trade shows every year on various topics. A few
    years ago, a separate of presentations called FREEENIX was created for freely
    distributed operating systems, such as Linux. If you''re interested in a good
    technical conference that attracts UNIX giants (such as Dennis Ritchie, one of
    the two principal creators of UNIX long years ago) or if you''re a Linux developer,
    you may want to take a look at www.unix.org'
