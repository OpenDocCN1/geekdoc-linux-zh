  md: '# Commercial text editors


    Several commercial text editors are available, and some of them come with significant
    value added — particularly for software developers — when compared to simple text
    editors. Two of the most popular commercial text editors are:


    +   - Slick Edit by MicroEdge, an X11-based editor that also runs on Windows 3.1,
    95, 98, and NT platforms. The editor is language sensitive, so if you''re programming
    in C++, Java, HTML, Perl, AWK, Pascal, FORTRAN, BASIC, dBASE, Mozilla-2, COBOL,
