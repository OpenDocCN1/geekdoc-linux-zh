  md: '# 36 Part II: Installing OpenLinux


    If you''re the rare reader who buys a system simply for OpenLinux, then look up
    a hardware supplier on the World Wide Web or in a Linux magazine and ask the supplier
    to build a system for you.


    +   - Want to install OpenLinux on your existing hardware

    - Want to use your existing hard disks

    - Want to keep MS-DOS, or Windows, or both, on your system


    Installing OpenLinux on your existing system is the most difficult type of installation.
    Don''t worry, though, because we''re here to guide you through it.


    # Hardware Supported by OpenLinux


    Generally, OpenLinux runs on any Intel or compatible processor that is a 386 or
    newer (including AMD K6 and Cyrix chips). Most systems are Pentium-class (586),
    which is great, but if you still have an old 3865X system lying around, you can
    install OpenLinux on it and create a router, e-mail server, or something more
    useful than a doorstop (which is all a 386 can do without Linux).


    OpenLinux supports symmetric multiprocessing (SMP), which means you can have more
    than one CPU inside one computer. In fact, OpenLinux supports several processors
    per system box. If your system has more than one CPU, OpenLinux can utilize these
    CPUs also, by speeding up a specific program to take advantage of multiple CPUs
    or by allowing more programs to execute at once.


    But the processor isn''t the only piece of hardware that you need to know something
    before you install OpenLinux. You also should know about the items in the list:


    +   - RAM: Without graphics, OpenLinux runs very well with 32MB. With graphics,
    OpenLinux runs (er, walks) with 16MB; with 32MB, the graphics get much faster.
    With 64MB, OpenLinux screams, and the speed of applications (particularly graphics-oriented
    programs) increases dramatically.


    Some OpenLinux developers have 128MB in their systems, because they need to run
    many programs at a time, and each program takes a certain amount of RAM when running.
    This amount of memory is not necessary for most users, but is always nice to have.
    After all, you can never be too rich or too much hardware backing you up.'
  merge: -1
