  md: '# Chapter 9


    # Working with Editors


    In This Chapter


    +   - Working with editors

    - Formatting text


    Everyone who writes OpenLinux books needs a good editor. But the kinds of editors
    we talk about in this chapter are text editors, not the tweedy, frazzled, publishing
    professionals who struggle mightly with books. Text editors work with text files
    to give you the ability to add, delete, search, and move text — everything from
    thousands of lines of text right down to a single character.


    Nowadays, text files are usually updated with word processors, but every once
    in a while you may have to update a file by using a text editor. In addition,
    text editors create small, compact files of characters, which are still the cheapest
    way to send e-mail and store character data on disk.


    Take the time to play around with these editors, getting down the basics, because
    sometimes these editors are the only thing available. If all else fails, you use
    the text editor to boot. Other editors, such as emacs and word processors, are
    too big to fit on a recovery floppy. (For more on text editors, see Chapter 2.)


    Your favorite editor for general work may be the graphical kedit program described
    later in this chapter. But because a graphical environment may not always be available,
    you can also learn about at least one character-cell editor.


    Remember, if you need to edit a system configuration file, such as /etc/passwd
    (which contains user account information), make a backup copy of the file first.
    If something goes wrong as you edit, you can revert to the backup and restore
    the previous configuration.'
  merge: -1
  pgno: 166
- img_proc: true
  md: '# 142 Part III: Using OpenLinux


    # # Text Editor Basics


    A text editor is an essential tool for OpenLinux that enables you to create and
    modify an array of text files, including the following:


    +   - User files, such as the login file

    - System configuration files, such as /etc/fstab, /etc/initab, and /etc/lilo.conf

    - C and C++ programs

    - Shell programs

    - Mail messages


    ![](img/3c04420fbc1d01311e6031144afaecd2_167_0.png)


    Graphical utilities are available to set up many of the text configuration files
    in OpenLinux, but graphical utilities won''t always do everything you need. To
    take care of the details yourself, you have to use a text editor.


    OpenLinux comes with a handful of text editors, including ed, vi(1), and two graphical
    text editors. The ed editor is a line-oriented text editor, all less than 70 Kb,
    and one of the first editors for UNIX systems. Traditionally, the ed editor is
    included with every UNIX and Linux system. The second editor included with OpenLinux
    is vi(1), which is a powerful and popular full-screen editor. A third major editor
    for OpenLinux is emacs(1), which some people prefer to use for most of their work.
    Finally, the KDE Desktop includes two editors: A simple editor called Kedit, and
    a more powerful editor (intended for programmers) called kwrite.


    Although these editors have different interfaces and capabilities, all the editors
    support the following standard features: Reading and writing files, searching
    text, inserting and deleting text, and copying and moving text. In this chapter
    we focus on two editors: Kedit, because it''s graphical and easy to use without
    much practice, and because vi(1), which is the most well-known editor in the Linux
    world and is always available from a command line.


    ![](img/3c04420fbc1d01311e6031144afaecd2_167_1.png)


    # # Need help? Ask the program!


    We can''t possibly detail all the options these editors offer. Before you get
    involved in some monstrous editing project, read the manual page or online help
    file for the editor you want to use. You may be surprised to find some handy shortcuts.
    Where editorname is ed, vi, or emacs,


    you can find the manual page on the editor by typing the following at a command
    prompt:


    man editorname


    Or, choose Help:Contents from the menubar within a graphical editor.'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# Chapter 9: Working with Editors


    # Two for one


    Some editors use Control keys or Meta keys, which are indicated by Ctrl+ or Meta+,
    respectively, in this book and are sometimes shortened to C and M+. The Ctrl key
    is usually marked on your keyboard, but the Meta key often hides under an assumed
    alias, usually with the Alt key.


    When you see Ctrl+Z, for example, press and hold the Ctrl key while pressing the
    Z key. (Don''t press Ctrl+Shift+Z.) Likewise, Meta-H means to hold down the Meta
    key (in most cases Alt) while doing this really is much easier than rubbing your
    stomach and patting your head at the same time


    Most UNIX books show Meta keys without the + sign. For example, Ctrl+Z in this
