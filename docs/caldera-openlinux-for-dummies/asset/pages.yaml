  md: '# Chapter 5


    # Installation: Down to the Final Stretch


    In This Chapter


    +   * Starting the actual installation

    * Setting up your mouse and keyboard

    * Making your video card work

    * Partitioning and formatting your disk

    * Selecting packages to install

    * Networking or not

    * Setting the clock

    * What''s my password?


    Sit down, grab your favorite drink, and contemplate the excitement to unfold.
    If you have a commercial OpenLinux CD or are using the Caldera OpenLinux For Dummies
    CD-ROM, the installation should work almost exactly as described in this chapter.


    # Getting Ready to Install


    The OpenLinux installation is arguably the easiest Linux installation available.
    Of course, being the easiest to install doesn''t mean that the installation always
    goes off without a hitch. Most of us aren''t used to installing operating systems.
    We simply buy PCs that have the operating systems installed for us (you can do
    precisely that with OpenLinux if you prefer — visit www.varesearch.com). But with
    OpenLinux, you have everything going for you to complete a flawless installation
    in about 30 minutes (depending on how fast you read and how fast your system is).'
