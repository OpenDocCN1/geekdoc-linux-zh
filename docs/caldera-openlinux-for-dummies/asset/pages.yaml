    # Ending Your First Session


    ![](img/3c04420fbc1d01311e6031144afaecd2_135_1.png)


    OpenLinux, like all modern operating systems, requires that you complete a graceful
    shutdown, rather than simply pulling the plug. This prevents any information that
    is momentarily stored in the computer''s memory being lost. A graceful shut records
    everything to hard disk and closes all programs in an orderly way.


