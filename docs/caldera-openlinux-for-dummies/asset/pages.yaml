    # Your Wish Is Our Command


    We''ve been showing you interactive shell functions, a fancy term that simply
    means that you type a command and the computer executes it immediately. After
    a while, you may notice that you''re typing a certain series of commands over
    and over. Wouldn''t it be nice to put the commands in a file and execute them
    all at once? Yes, you can.


    For the rest of this section you work on creating shell scripts, which contain
    a series of commands that are executed every time you type the name of the script
    as a command. First you create a simple shell script, and later you create a more
    complex one.


    Suppose you want to generate a report from time to time showing all the accounts
    on the OpenLinux system. You can simply print the /etc/passwd file, but that file
    has a lot more information in it than you need. Besides, you''re an organized
    person who wants your report to be better formatted than the password file.


    First, look at the following entry in the passwd file:


    ```

    maddog:eyrtwir:500:500:Caldera OpenLinux

    User:/home/maddog:/bin/bash

    ```


    Each grouping of characters between the colons is a field. For your report, you
    want only the first and fifth fields. The cut command is the way to go. The man
    page shows that the cut command used to get the first and fifth fields is


    ```

    cut -f 1,5 -d : /etc/passwd

    ```


    The man pages (manual pages) are terse-but-complete online documentation for nearly
    all OpenLinux commands. To view the man page for the cut command, type man cut
    on the command line.


    You use the -f option for the cut command to list the fields that you want printed,
    in this case the first and fifth fields. You use the -d option to specify the
    delimiter for the field, which in this case is a colon. The preceding command
    gives lines of output formatted like this:


    ```

    maddog:Caldera OpenLinux User

    ```


    ![](img/3c04420fbc1d01311e6031144afaecd2_192_0.png)'
  merge: -1
  pgno: 192
- img_proc: true
  md: '# 168 Part III: Using OpenLinux


    Maybe you''d prefer to replace the colon with the hyphen, adding a space on each
    side to make the report easier to read. The stream editor, sed, is your ticket
    to formatting happiness. You can send the output of cut directly to sed by typing
    the command line:


    ```

    cut -f 1,5 -d:/etc/passwd | sed -e ''s/:/ - ''

    ```


    The pipe symbol, |, takes the output of the cut command and feeds it to the sed
    command. Look at the output of the command line to the right of the pipe symbol,
    and you can see that the e of the sed command tells the command to use the next
    string of characters (in this case, what appears between the two apostrophes,
    or single quotation marks) as a command for the sed stream editor. The command
    finds the string of characters between the first and second slash marks and replaces
    them with the second and third slash marks.


    ![](img/3c04420fbc1d01311e6031144afaecd2_193_0.png)


    Note the single quotes around ''s/:/ - /'', which makes the shell the entire string
    of characters as one thing and present the string to the sed editor as that e
    works. Without the single quotes, the shell would conclude from the blanks in
    the string that three different things exist in this string of characters: s/:/,
    and /. In shell statements, unquoted blank space (called white space) is considered
    a separator.


    Continuing with your report, you want to have a header that states the subject
    of the report, and the date. You can use the echo command for the header and the
    echo command for the date:


    ```

    echo Report of user accounts and full names on the OpenLinux

    date

    echo -f 1,5 -d:/etc/passwd | sed -e ''s/:/ - /

    ```


    Although these four lines are not difficult to type, you have to remember them
    and retype each time you run the report. Because we like to save them whenever
    we can, we use our favorite text editor to type the lines in a file.


    ![](img/3c04420fbc1d01311e6031144afaecd2_193_1.png)


    Our favorite editor is vi. If you want to use another editor, that''s, too. But
    be sure to name your file quagmire so that the rest of the example will work.


    In the following, we''re using vi to edit a file named quagmire, entering the
    commands typed previously into that file:'
