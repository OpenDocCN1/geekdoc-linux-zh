    > Tuning operating systems can become a life-consuming task. If you''re obsessed
    about squeezing the most from your hardware and software, you won''t have time
    for anything else. Take advantage of the tips in this chapter, take a deep breath,
    and get on with the rest of your life.


    # Tuning Your OpenLinux System


    Most UNIX-like systems don''t have many knobs and buttons you can change to make
    the systems work faster, or better. OpenLinux, however, has a few special features
    that you can tweak for better performance. More important, if you follow a few
    guidelines, you can help your OpenLinux system perform at its best.


    # You can never have enough memory


    Although having too much memory theoretically is possible, most people have too
    little — in their systems, that is. Today, memory is so inexpensive that few excuses
    for not having enough hold up.'
