  md: '# Chapter 3: Discovering What''s in Your System


    # Hard disk controllers


    The two main types of hard disks are IDE and SCSI, and each type has its own controller.
    IDE is more common in PCs, and newer PCs usually have two IDE controllers rather
    than one. For each IDE controller, your system can have only two hard disks: a
    master and a slave. Therefore, a PC with two IDE controllers can have up to four
    hard disks. You should know which hard disk is connected to which controller,
    and which is the master and the slave disk on each controller. Also, if you have
    a Windows system that you want to preserve, you should know the partition number
    and IDE device where Windows is stored. Normally, on a Windows system:


    +   - The first controller''s master disk is called C.

    - The next hard disk is called D and is the slave disk on the first controller.

    - The next hard disk is E and is the master hard disk on the second controller.
    (A CD-ROM drive that uses the IDE/ATAPI interface is often the first device on
    the second IDE controller.)

    - The last hard disk is called F and is the slave disk on the second controller.


    Normally, Windows is located on your C hard disk, and data is on your hard disks.
    However, this lettering scheme is just one possibility; your hard disks could
    be set up differently and even include CD-ROMs as drives on your IDE controllers,
    mentioned in the preceding list.


    Some high-end PCs have a SCSI controller on the motherboard or on a separate SCSI
    controller board, either in addition to or instead of the IDE controllers. Older
    SCSI controllers can have up to eight devices on them, numbered 0–7, including
    the controller. Newer SCSI controllers (known as wide controllers) can have up
    to 16 devices, including the controller itself.


    If you have a mixture of IDE and SCSI controllers, then your C disk can be any
    of the controllers. Later in this chapter the sections, "Getting Information from
    Windows 95/98" and "Getting Information from MS-DOS or Windows 3.1," show you
    how to identify the number of hard disks that you have, what type of hard disks
    they are, and the controllers to which the hard disks are attached.'
  merge: -1
  pgno: 64
- img_proc: true
  md: '# 40 Part II: Installing OpenLinux


    # Disk drives


    You need to decide if you want to put OpenLinux on a separate hard disk from MS-DOS
    and Windows or have the two operating systems share one disk.


    Most people think of Windows (either Windows 3.1, Windows 95, or Windows 98) as
    an operating system. The later versions, such as Windows 98 and Windows 2000,
    simply try to hide the fact that MS-DOS is running things behind the scenes, managing
    the disks and most other hardware components of your PC. From here on, unless
    we mention a particular system, consider MS-DOS and all versions of Windows to
    be the same thing.


    ![](img/3c04420fbc1d01311e6031144afaecd2_65_0.png)


    Windows NT is another matter, because it doesn''t use MS-DOS underneath the graphical
    interface. Also, Windows uses different methods of controlling your PC hardware.
    Still, you may be able to use some of the steps outlined in this chapter to use
    Windows NT to discover information about your PC.


    ![](img/3c04420fbc1d01311e6031144afaecd2_65_1.png)


    Different hardware systems have different ways to enter the BIOS setup. Usually,
    you can enter the BIOS setup when you turn on the power and start to boot, or
    when you press the Reset button on the front of the system and start to reboot,
    or when you go through the normal shutdown of Windows system and ask the system
    to reboot.


    If you decide to purchase a second hard disk on which you will install OpenLinux,
    put the new disk as the second disk on the first IDE controller or as disk 1 on
    your SCSI controller, assuming that your existing Windows disk is either the first
    disk on your IDE controller or ID 0 on your SCSI controller. Adding disks is a
    hardware thing; the folks where you buy the disk should be able to add the disk
    to your system for. And while you''re there, you can ask them to tell you the
    details about the other hardware in your system.


    If you''ve taken your computer looking for other information (a pox on manufacturers
    who do not supply such useful information), you may as well write down all disk
    information you can find. You can look for the number of heads, cylinders, and
    sectors. This information is used to tell the operating system where to put data
    with respect to the beginning of the disk. If you have trouble, then check out
    the "Getting Information from Windows 95/98" and "Getting Information from MS-DOS
    or Windows 3.1" sections later in this chapter. SCSI disk users don''t have to
    supply this information because the SCSI controller and device drivers calculate
    the information on-the-fly. SCSI disk owners should, however, know the size of
    their disks, which is printed on the disks or is available through the sections
    just mentioned.'
  merge: -1
  pgno: 65
- img_proc: true
  md: '# Chapter 3: Discovering What''s in Your System


    # Finding Out What You Have


    An extremely useful preliminary step for a successful installation of OpenLinux
    identifying the type of hardware that you have. You can find most of this information
    in the manuals that came with your computer, but the manuals won''t be much if


    +   - You threw the manuals.

    - You lost the manuals.

    - You bought your computer secondhand from someone who threw away or lost the
    documentation.

    - You bought your PC with Windows already installed (so it included almost zero
    useful documentation).


    Contact the company where you bought your system. Perhaps you can obtain a copy
    of the documentation from the dealer.


    If that doesn''t work, open your system and look at its components. For instance,
    one source of information about your disk is the label on top of the disk drive.
    If you don''t feel comfortable opening your system, then you may want to take
    the system back to where you bought it - assuming you didn''t buy it by mail order
    - and perhaps the dealer can open the system and tell you what you have.


    You can also look to the World Wide Web for information. Many vendors their Web
    Sites to provide technical data about their devices. To find information about
    your device, you need to know your equipment''s manufacturer, make, and model
    number.


    Another source of information is either Windows 95 or Windows 98. Step-by-step
    instructions in the following sections show you exactly how to use these operating
    systems to get all the information you need.


    If you don''t have any literature about your system, and you don''t have Windows
    on your system (perhaps you like to run FAT free), and no dealer is within hundreds
    of miles of your system, don''t give up hope. OpenLinux is good at sniffing out
    and identifying hardware during installation.'
  merge: -1
