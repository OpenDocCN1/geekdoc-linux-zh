  md: '# Chapter 7: Using OpenLinux for the First Time


    # A command line by another name


    If you''re coming from the world of DOS or Windows, you''ve probably seen the
    command-line prompt, which looks something like this:


    ```

    C:\

    ```


    The OpenLinux command-line prompt looks similar, but it works a little differently.
    The command line in OpenLinux is actually a program called a shell. A shell in
    OpenLinux is like COMMAND.COM in DOS, a lot better, of course. Never mind how
    for now. The particular shell used in OpenLinux (and many other Linux and UNIX
    systems, actually) is called bash. (Chapter 10 goes on about bash in detail.)


    The shell, or command line, in OpenLinux is also called at various times a terminal
    emulator (because it''s as if you have a dumb terminal connected to your OpenLinux
    system), or an Xterm window (because that''s the name of the graphical program
    that opens a window that is running bash).


    So when you see any of these terms, remember, they''re all talking about a place
    where you can enter commands at the keyboard and have the OpenLinux system process
    them. (For more than that, see Chapter 10.)


    Or, go to the main menu and choose Utilities: Terminal, as shown in Figure 7-6.


    ![](img/3c04420fbc1d01311e6031144afaecd2_130_0.png)


    Figure 7-6: The Utilities menu includes the Terminal item.'
