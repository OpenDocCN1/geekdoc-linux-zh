  md: '# Introduction


    Other books about OpenLinux contain fascinating information for UNIX system administrators,
    as well as long lists of unpronounceable commands with confusing options. This
    book is different. In Caldera OpenLinux For Dummies, the fascinating information
    is for you, and the descriptions and directions are written in plain English.


    Use this book as an entertaining and informative reference to OpenLinux. Or buy
    a stack of Caldera OpenLinux For Dummies books and use them to press flowers.
    (Hey, you still can use the top book as a reference for OpenLinux.)


    # About This Book


    This book is designed to be a helping-hands reference. Caldera OpenLinux For Dummies
    provides a place to turn for help and solace in those moments when after two hours
    of fruitlessly typing xstart and twice reloading Window System, your five-year-old
    tells you that the x goes at the end of the word.


    We''ve tried to fill this book with the things you need to know, such as:


    +   - Installing OpenLinux

    - Exploring the KDE graphical desktop

    - Issuing important commands

    - Working with files and directories

    - Using text editors and other interesting applications

    - Getting online to surf the Web

    - Finding help


    You see troubleshooting tips throughout the book. Actually, OpenLinux isn''t all
    that much trouble — we just want your experience to be as trouble-free as possible.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Foolish Assumptions


    You know what they say about people who make assumptions, but this book never
    would have been written if we didn''t make a few. This book''s for you, if


    +   - You have an OpenLinux operating system. Surprise — the CD-ROM in the back
    of this book has one.

    - You have a computer.

    - You want to put the OpenLinux operating system and your computer together and
    using duct tape hasn''t worked.

    - You don''t need to become an OpenLinux guru — at least not yet.


    # Conventions Used in This Book


    At computer conventions, thousands of computer people get together and talk about
    deep issues, such as:


    +   - Is Coke better than Pepsi?

    - Are Tim-Tams the ultimate junk food?

    - What''s the best hardware for running OpenLinux?


    But these conventions aren''t the types of conventions we''re talking about in
    this section. The conventions we use are shorthand ways of designating specific
    information, such as what is and isn''t a command, or the meaning of certain funny-looking
    symbols.


    # Typing code


    Commands in the text are shown like `this`. Commands not in the text, but set
    off on lines by themselves, look like this:


    ```

    pwd

    ```


    If we boldface a command in text — as in `pwd` — that means you should type that
    part. We often show examples of commands and their returned text that look like
    this:


    ```

    [maddog@shamet maddog]$pwd

    /home/maddog

    ```'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Introduction


    The stuff exclusive of the command — in this case, everything but `pwd` — is either
    the computer had on-screen before or what the command returned. So, in this example,
    after you type `pwd` (and press Enter), the computer displays `/home/maddog`.
    Is that all? Well, not quite. Notice the `maddog@shame. maddog` in the preceding
    example? You won''t see that on your system, unless you''re also known as maddog.
    But you will see something similar. The same goes for `/home/maddog`; the maddog
    is replaced with your system''s directory name.


    Now, for some further complications. Check out the following:


    ```

    [root@localhost /root]# passswd <name>

    ```


    <name> is in *italic*, which means you should replace `<name>` with a name. In
    this case, you replace `<name>` with your login name. How are you supposed to
    know that? Don''t worry. We tell you in the text.


    Here''s a rundown of the command syntax in OpenLinux:


    +   - Text not surrounded by `[`, `(`, or `<` must be typed exactly as shown

    - Text inside brackets `[]` is optional.

    - Text inside angle brackets `<>` must be replaced with appropriate text.

    - Text inside braces `{}` indicates that you must choose one of the values inside
    the braces and separated by the `|` sign.

    - An ellipsis `...` means and so on, or to repeat the preceding command line as
    needed.


    Don''t concern yourself too much right now with this information. For most of
    the book, you don'' need to know these particulars. And if you do need to know
    something about a particular syntax, come back here for a refresher course.


    # Keystrokes and such


    Keystrokes are shown with a plus sign between the keys. For example, Ctrl+Alt+Delete
    means that you press the Ctrl key, the Alt key, and the Delete key all at the
    same time. (No, we don''t make you press more than three keys simultaneously.)'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# 4 Caldera OpenLinux For Dummies


    You also see something like this from time to time:


    ```

    [maddog@localhost]$ maddog$ vi quagmire

    a

    echo Report of login names and users on the Linux system

    date

    echo

    cut -f 1,5 -d: /etc/passwd | sed -e ''s/:/ - /''

    <ESC>

    :wq

    ```


    Now, you know from reading the "Typing code" section that the stuff in boldface
    needs to be typed as shown. But in this case, the stuff inside angle-brackets
    and in code <ESC>—means you''re being told to press the Escape key, not to type
    the ESC characters.


    # This Book Is Organized


    All proper For Dummies books, this book is organized into independent parts. Well,
    that''s not quite true. This book is almost-proper For Dummies if you don''t have
    OpenLinux installed, then you will really have to go through Part II before you
    can do much with OpenLinux, aside from framing the CD or using it as a neat Frisbee.


    For all other parts, you can read them in any order. Heck, try reading the parts
    backwards for a real challenge. In this section, we will tell you what each part
    contains.


    # Part 1: Introducing OpenLinux


    In Part I, you find out about the birth of Linux and how Caldera OpenLinux fits
    into that fascinating history.


    # Part II: Installing OpenLinux


    In Part II, you get your answer to the age-old question: How the heck do I install
    OpenLinux? We give you detailed, step-by-step instructions. You also get lots
    of help installing the X Window System and KDE, the graphical part of OpenLinux.
    You may want a double espresso or a can of Jolt soda (lots of sugar and caffeine!)
    by your side for this one.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Part III: Using OpenLinux


    In Part III, you get the glorious particulars on actually doing something with
    OpenLinux. We take you through the history of text editors and how to use them.
    You find out that not all shells are found on the ocean floor; OpenLinux has a
    shell for you. You can also take KDE through its paces, by moving, resizing, hiding,
    and windows and using a few of the many applications that are included with KDE.


    # Part IV: Maintaining Your System


    OpenLinux isn''t a high-maintenance operating system, but it does need some care.
    (Chocolate file system, too.) In Part IV, you find out how to manage the OpenLinux
    file system, which is the biggest part of the care and feeding OpenLinux. You
    also get hints on boosting the performance of OpenLinux. Vroom. Vroom.


    # Part V: Going Online


    # Part VI: The Part of Tens


    A For Dummies book isn''t complete without a Part of Tens. And that''s Part VI.
    You find all-important OpenLinux resources in Chapter 17. In Chapter 18, we provide
    answers to the ten most bothersome questions people have after installing OpenLinux.


    # Part VII: Appendixes


    Finally, the appendices. In Appendix A, we list all the hardware that Caldera
    Systems says is compatible with OpenLinux. In Appendix B you find out all you
    need to know about the OpenLinux man pages. And in Appendix C, we tell you where
    in the book you can get information on installing the CD-ROM.'
  merge: -1
