- img_proc: true
  md: '# Chapter 15: Setting Up Your Internet Connection


    Some newer computers already have a modem installed, but the modem is a WinModem,
    which isn''t a true modem — it requires software control to function. Because
    specifications haven''t been released for this type of device, WinModems can''t
    be accessed from OpenLinux (or any version of Linux).


    Rather than try each serial-port address in turn, if you have Windows 98 on your
    system, you can see which port or COM line the modem connects to by reviewing
    the information in the Windows configuration. Reboot your computer into Windows
    and follow these steps:


    +   1. Choose Start>Settings>Control Panel.

    The Control Panel window appears.


    +   2. Click the Modem icon.

    The Modems Properties dialog box appears.


    +   3. Click the Diagnostics tab.

    You see your modem listed, with a COM-line number beside it. This number is the
    Windows designation for your modem''s serial communications.


    # Setting Up kppp


    You have a modem connected and have established an account with an ISP, but that''s
    not all you have to do. You need to set up a program that uses the PPP communications
    protocol to connect to your ISP using the modem device that you just set up. KDE
    includes the perfect utility to do this: kppp.


    To start kppp, choose it from the Internet menu in KDE. The main connection window
    appears, as shown in Figure 15-1. This window includes fields where you can select
    which account to connect to and then enter your username and password for that
    account before clicking the Connect button. But, before you can use kppp, you
    need to set up your account and tell kppp how to use your modem.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# 264 Part V: Going Online


    Figure 15-1: The kppp main window includes places to enter your username and password.


    ![](img/3c04420fbc1d01311e6031144afaecd2_289_0.png)


    # Setting up an ISP account


    To begin setting up kppp, follow these steps:


    +   1. Choose the Setup button on the main kppp window.


    The kppp Configuration dialog box appears, as shown in Figure 15-2. The dialog
    box contains several tabs. You can set up information about ISP in the Accounts
    tab. This tab shows all the accounts that you have configured (and may be some
    you haven''t — delete those).


    Figure 15-2: The kppp Configuration dialog box includes tabs to set up accounts
    and modem access information.


    ![](img/3c04420fbc1d01311e6031144afaecd2_289_1.png)'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# Chapter 15: Setting Up Your Internet Connection


    2. To set up your ISP account, choose New on the Accounts tab of the kpppp Configuration
    dialog box.


    A New Account dialog appears. This dialog box includes six tabs in which you can
    set up the properties of your ISP account. Happily, you normally don''t have much
    to do in most of the six tabs, setting up the account is fairly easy. The most
    important tab is the Dial tab, shown in Figure 15-3.


    ![](img/3c04420fbc1d01311e6031144afaecd2_290_0.png)


    Figure 15-3: In the Dial tab of the New Account dialog box, you set up how to
    reach your ISP.


    3. In the Dial tab, do the following:


    +   a. Enter a name for the account in the Connection Name field. This name can
    be anything you choose but try to use something you can associate with your ISP
    name, in case you later have multiple accounts to keep track of.


    +   b. Enter the number to call for your ISP server (not the tech support number,
    please) in the Phone Number field. kpppp doesn''t have fancy dialing options,
    so if you need to dial 9 first or dial special codes when you are away from home
    and calling long distance, you need manually to enter those features as part of
    the Phone Number field.


    +   c. Indicate how you want kpppp to identify you to the ISP server in the Authentication
    field. The four options are Script-based, Terminal-based, PAP, and CHAP. Almost
    all ISPs use PAP or CHAP because PAP and CHAP are easier and more secure than
    the other two methods. We explain later how to set up Script-based authentication
    by using the Login Script tab. Ask your ISP which method to use for a connection
    to its server.'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# 266 Part V: Going Online


    d. Check the Store password checkbox if you want kppp to remember the password
    you enter for this account when connect. This feature is handy for quick connections,
    but it has two disadvantages. Others may try snooping around your system and locating
    your password (though it doesn''t appear on screen in plain text). Second, you''re
    likely to forget the password if you don''t type it regularly (which makes using
    your ISP account from another system difficult).


    e. Enter the name of a program to start automatically after the connection is
    established. Three fields let you execute a program at different points: When
    you first connect, before disconnecting, or right after disconnecting. You can
    enter any command in these fields just as you can on the command line. For example,
    you could enter the program name netscape in the Execute program upon connect
    field to launch Netscape Communicator as soon as the connection is established.


    f. Edit the pppd arguments (if necessary) by clicking the Arguments button. ppp
    is the background program that manages the PPP protocol and connects you to your
    ISP. Unless you need to use special arguments successfully you don''t need to
    do anything here. If you do, choose the Arguments button and enter the additional
    information to use when running pppd.


    4. Click the IP tab and make any selections.


    The IP tab (shown in Figure 15-4) is the first of three tabs that you can use
    to determine how your system configures networking after attaching to the ISP
    server. The IP tab lets you choose to a dynamic IP address (one automatically
    assigned by your ISP) or a static IP address. A few people have arranged with
    their ISP to have a static IP address to make configuration of some OpenLinux
    services easier. In general, though, this is more work than you want to worry
    about. Choose Dynamic IP Address and forget about it.


    5. Click the DNS tab (shown in Figure 15-5) and configure how your computer resolves
    names to IP addresses.


    You must indicate a DNS server that will convert www.yahoo.com and all your other
    URLs (Uniform Resource Locators, the technical term for Web addresses) into an
    IP address that the Internet can understand — like 207.29.12.1. Do the following:


    a. In the Domain Name field, enter the domain name that you''re using. This may
    be the domain of your organization, or the domain of your ISP. In most cases the
    domain name isn''t highly relevant. The only potential problem you have is being
    connected to both an internal network (via your Ethernet card, for example) and
    an ISP (via your modem). If so, use your internal domain name.'
  merge: -1
  pgno: 291
- img_proc: true
  md: '# Chapter 15: Setting Up Your Internet Connection


    ![](img/3c04420fbc1d01311e6031144afaecd2_292_0.png)


    Figure 15-4: You select a dynamic or static IP address in the IP tab of the New
    Account dialog box.


    ![](img/3c04420fbc1d01311e6031144afaecd2_292_1.png)


    Figure 15-5: Configure how to access a DNS server at your ISP by using the DNS
    tab.


    b. Enter the IP address that your ISP provided for accessing a DNS server in the
    DNS IP Address field, then click Add. This part of this tab is key. The address
    is a cryptic-looking set of numbers (again, like 201.207.68.30). After you click
    Add, the IP address is added to the DNS Address List field. If your ISP gives
    you two DNS server addresses, so much the better. Enter both the server addresses.
    If one DNS server is down, then you still can reach the Web.'
  merge: -1
  pgno: 292
- img_proc: true
  md: '# 268 Part V: Going Online


    6. Click the Gateway tab (shown in Figure 15-6) and click the Default Gateway
    button, unless you have a good reason not to.


    The Gateway tab tells your system how to route information (network packets, to
    be precise). Your ISP normally acts as a gateway to the rest of the world — to
    the Internet. By choosing Default Gateway, your ISP''s gateway is used for your
    connection. If you need to use a different gateway, choose Static Gateway and
    enter the IP address of the gateway-computer. A static gateway would be needed
    only if you have an internal network connection where most of your traffic can
    be sent. However, using a static gateway address in this tab may make it hard
    to browse the net by using your ISP connection. You can enter a static-gateway
    address and then deselect the checkbox to Assign the Default Route to this Gateway.


    ![](img/3c04420fbc1d01311e6031144afaecd2_293_0.png)


    7. Click the Login Script tab and create any desired scripts.


    We promised that we''d explain how to use the Login Script authentication method.
    Welcome to the Login Script tab. This method of authentication uses a script of
    exchanges between your computer and the ISP computer to log you in and start the
    pppd daemon. The purpose of the script is to define what lines of text to expect
    from the ISP server and what commands to send in return. In general, these lines
    involve backing your username and password.


    To create a login script, you choose a type of message from the dropown list,
    such as Expect or Send (most lines will be one of these two — you may not have
    any others). Enter the text in the blank field next to the drop-down list and
    choose Add or Insert. The lines of your login script appear one in the bottom
    section of the Login Script tab.'
  merge: -1
  pgno: 293
- img_proc: true
  md: '# Chapter 15: Setting Up Your Internet Connection


    Your ISP provides you with sample lines to show what the login script looks like
    to connect to its server. Figure 15-7 shows a simple version of a login script
    in the Login Script tab.


    ![](img/3c04420fbc1d01311e6031144afaecd2_294_0.png)


    If your ISP specifies PAP or CHAP authentication, you don''t need to enter anything
    in the Login Script tab.


    8. Click the Accounting tab and make any necessary selections.


    This tab provides the ability to track how much data you exchange with your ISP
    and how long you''re connected, computing charges based on the telecom provider
    that you''re using. This information only applies outside the United States, where
    telecom providers normally charge per time unit or number of bytes for an Internet
    connection.


    If you''re outside the United States, you can select the Enable accounting checkbox
    and then choose a telecom provider in your country. Then choose the method of
    accounting from the Volume dropdown list. You see in the Accounting tab of the
    kppp Configuration dialog box a summary of the costs associated with the account
    that you''ve configured, based on how much you''ve used the account. This summary
    lets you track expenses between billings. Figure 15-8 shows how the Accounting
    tab appears with a telecom selected.


    9. After you''ve entered all the account information in these six tabs (well,
    hopefully not all are needed), click OK to close the New Account dialog box and
    finish configuring kppp.


    From the kppp dialog box you can choose New multiple times to set up numerous
    ISP accounts. You can also select an account from the list and Edit to change
    the properties of that account.'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# 270 Part V: Going Online


    ![](img/3c04420fbc1d01311e6031144afaecd2_295_0.png)


    After you''ve set up a new account, the features on the Accounts tab of the kppp
    Configuration dialog box become a little more meaningful. Below the list of accounts
    and the buttons that are used to set up accounts (you can delete them if you want),
    you see fields labeled Phone Costs, Volume, Reset Costs, and View Logs. These
    fields refer to the information determined by the Accounting Setup information.


    But before you can use that new account, you have to finish setting up kppp and
    then get connected.


    # Finishing kppp configuration


    To put the finishing touches on your new ISP account, follow these steps:


    +   1. Click the Device tab of the kppp Configuration dialog box (shown in Figure
    15-9) and define how to access your modem device.

    This tab contains several key areas:

    - In the Modern Device drop-down list, choose the name for your modem. This is
    normally /dev/modem if OpenLinux was able to locate the modem during installation
    or you created a link afterward. You can also select various serial ports (such
    as /dev/tty0) from the drop-down list.

    - The Flow Control and Line Termination settings can be left alone unless you
    have trouble connecting when everything else seems to be correct.'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# Chapter 15: Setting Up Your Internet Connection


    ![](img/3c04420fbc1d01311e6031144afaecd2_296_0.png)


    Figure 15-9: Configure your modem is accessed using the Device tab of the kppp
    configuration dialog box.


    +   - The Connection Speed field determines how fast kppp tries to send information
    to the modem. Choosing a number that''s too high is better than choosing one''s
    too low in this field. If you choose a high number, kppp tries to push out data
    and ends waiting for the modem to catch up. If you choose a low number, the modem
    waits for more data to send, which your transmission speed lower than it can be.
    If you have a 28.8 modem, you can choose 57600 as the speed; if you have a 56K
    modem (that really works at 56K in your area), choose 115200.

    - The Use Lock File checkbox indicates that kppp should lock the modem so that
    other programs can''t use it while kppp uses it. This is a good thing.

    - The Timeout field sets how long kppp tries to look for the modem and waits for
    the modem to respond before giving up (timing out, as we say). The 60-second value
    is a little bit long for slower modems. You can reduce this lag time if your modem
    appears to respond quickly when you start a connection.


    Click the Modem tab (shown in Figure 15-10) to define modem-specific options.


    The Busy Wait field defines how long kppp waits when a busy signal is detected
    before retrying the connection. The Modem volume slider determines how loud the
    dialing sound is (though this may not effectively silence some modems).'
  merge: -1
  pgno: 296
