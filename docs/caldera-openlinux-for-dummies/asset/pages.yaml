- img_proc: true
  md: '# Types of modems


    Modems can be either internal or external. An external modem stays in its own
    little box and usually plugs into a wall outlet for power, into the phone line
    for the connection, and into a serial connector on the back of your computer.
    An internal modem is usually plugged into a slot on the motherboard inside the
    computer case.(Some internal modems are built directly onto the motherboard.)
    To the computer and operating system, an internal modem appears as if it were
    two or more serial ports. Internal modems draw their power from the computer system,
    and they plug into the phone jack.


    Usually internal modems are less expensive than their external counterparts, but
    some people like external modems because they can hook them up to different systems
    by unplugging the serial line from one and plugging it into another.


    A third type of serial-line modem is a PCMCIA card (sometimes called a PC card).
    These cards are used most often with laptop computers.


    # Finding the serial line


    After you connect your modem, you have to tell OpenLinux which serial line (or
    simulated serial line) the modem is connected to. If your modem was already installed
    on your system when you installed OpenLinux, a /dev/modem link was already created
    for you by the installation program as it scanned your system and located the
    modem.


    The /dev/modem device is a standard location for the modem. OpenLinux creates
    a symbolic link (a pointer, really) from the actual modem device to /dev/modem.
    The modem itself may be located on /dev/tty0, /dev/tty1, or another serial-port
    device.


    If you need to locate a modem that you''ve installed after installing OpenLinux,
    try using each serial port in turn (ttyS0 to ttyS3) to see which one works for
    you. You can make a link from one of the serial devices to the /dev/modem device
    name by using the ln command with the -s option, like this:


    ```

    ln -s /dev/ttyS0 /dev/modem

    ```


    After you''ve set up the /dev/modem link, you can try using the link with the
    kppp program described in the next section. If the modem doesn''t respond (you
    normally hear dialing when it works), creating a link to a different device by
    using the above command.'
  merge: -1
