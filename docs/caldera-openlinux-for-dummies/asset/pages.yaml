    # Exploring Your Desktop


    The desktop space that you work in KDE includes several features to help you with
    different types of programs and to configure your environment. Refer to Figure
    11-1 to find each of the items listed here:


    +   - The Taskbar: This bar appears at the top of your KDE Desktop. The Taskbar
    contains a button for each open window in KDE. You can make any window active
    by clicking its button on the Taskbar.


    +   - The Panel: This bar icons appears at the bottom of your KDE Desktop. The
    icons on the Panel represent applications that Caldera assumes you''ll want to
    start regularly, such as a file browser for your home directory, a Netscape Communicator
    Web browser, and a command-line window (called a Terminal Emulator). Click an
    icon on the Panel to start the corresponding application.


    +   - The K icon: This icon is actually one of the Panel icons (on the far left),
    but the K deserves special mention. Clicking the K icon opens the KDE main menu,
    as shown in Figure 11-2 The easiest way to start most programs in KDE (those that
    don''t have an icon on the Panel, as Netscape Communicator does) is to select
    the program from the KDE main menu. We explore the menu options in the next section.


    +   - The Desktop: This''s the big space in the middle. The desktop is where application
    windows appear as you work. You can also place icons on the desktop for easy access
    to your favorite programs or most-used files.


    +   - The Trash: This works just like the Recycle bin in Microsoft Windows or
    the Trash on a Macintosh desktop. You can drag and drop icons onto the Trash to
    discard them. If you''re sure you want to delete the files, right-click the Trash
    icon and choose Emoji trash.


    In most operating systems, you can undelete (recover) a file that you''ve erased
    from the system, even after you empty the Recycle bin or Trash can. Don''t plan
    on undeleting in OpenLinux — call it a security feature. As you delete a file
    (or empty the Trash), the file is gone.


    +   - The Autostarter: This icon opens the directory containing programs that
    you want to start automatically after you''re using KDE. Before you add an application
    to the Autostart folder, you must create a KDE Link file for that. We show you
    how to do that later in this chapter in "Everything After".


