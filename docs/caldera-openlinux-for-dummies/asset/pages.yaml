    # Serial, Parallel, and Joystick Interfaces


    Any standard expansion card provides serial ports, parallel, joystick ports, or
    a combination of these cards can be used to extend the hardware connectivity of
    OpenLinux. OpenLinux supports using the following chipsets (which you can identify
    from either looking on the card itself or checking with the vendor or documentation):
    8250, 16450, 16550, and 16550 UARTs.


    # Other Controllers (Multipro)


    Some cards are used to increase the number of serial lines that a PC-style system
    can support above the one or two/parallel lines that come with most computers
    by default. Multip serial cards can be classified as intelligent'
