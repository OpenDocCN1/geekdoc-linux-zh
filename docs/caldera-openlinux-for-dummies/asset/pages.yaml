    by displaying the KDE panel, desktop icons, and maybe a dialog box or two.


    Or maybe not. (Sigh.) If the screen reverts to a character-cell interface, you
    will see all sorts of messages about what may have gone wrong. You may have specified
    the video code correctly or incorrectly answered some other question. If that''s
    the case, you can do several things:


    +   - Find out more detailed information about your video card by using Windows
    98 (if available), as described in Chapter 3.


    +   - Find a newer version of the X server (XFree86) by contacting Caldera, looking
    on the Caldera FTP site (ftp.calderystems.com) under the update directories, or
    checking the Web for XFree86 at www.xfree86.org.


    +   - Find a seasoned OpenLinux person to help you. The users'' mailing list that
    Caldera provides is for this sort of help.


    +   - Take a course to Fiji — at the University of the South Pacific, they have
    a really good computer-science department in which everyone uses Linux. (Hi folks!)


    ![](img/3c04420fbc1d01311e6031144afaecd2_119_0.png)


    # Origin of this species


    Your X Window System programs come from code that was contributed to the X Window
    System project, which was first connected with Project Athena at the Massachusetts
    Institute of Technology. Later, the project became the main focus of the X Consortium,
    a nonprofit group established to develop the X Window System technology.


    The XFree86 team of programmers tries to give support to new video controllers
    as they come. Unfortunately, doing so is difficult for several reasons:


    +   - The XFree86 developers have no relationship with the video controller manufacturer.


    +   - The video controller manufacturer thinks that keeping programming interfaces
    gives the manufacturer an edge against its competitors.


    +   - The video board is built into a larger system board.


    Because the source code was freely distributable, a group of programmers from
    all over the world gave support to X Window code on low-end PC systems. These
    programmers called themselves XFree86 because their code was free and was directed
    toward Intel x86-compatible processors.


    +   - The video controller is simply too new for the development team to have
    time to develop support for it.


    Over time, the programmers ported their code to freely distributable operating
    systems on other architectures. They did this — and continue to this — for the
    love of programming.


    Until support is available, most people rely on SVGA compatibility mode to get
    the card to work.'
