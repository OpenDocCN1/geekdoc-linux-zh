    # ## Be Your Own Software Lawyer


    Linus Torvalds and the Linux development team created the Linux operating system
    kernel. The kernel includes the software for managing memory, files, programs
    that are running, networking, and various hardware devices. Think of the kernel
    as a cop directing traffic.


    The compilers and other programs that go into making up most people think of as
    Linux are from a variety of people who distribute the programs over the Internet
    or on CD-ROM. Typically, these people add an installation technique, system management
    tools, some applications (either freeware or commercial), and a distribution medium,
    just as Caldera does with OpenLinux. In every case, the Linux license requires
    that the base Linux system is able to be copied freely, even if value-added components
    are not.'
