  md: '# 202 Part III: Using OpenLinux


    ![](img/3c04420fbc1d01311e6031144afaecd2_227_0.png)


    11-17: You can choose from twenty KDE screen savers in this dialog box.


    11-18: Each screen saver has setup options like the ones in this Science screen
    saver.


    ![](img/3c04420fbc1d01311e6031144afaecd2_227_1.png)


    After you''ve set up the screen-saver options, choose the Test button to see what
    the screen- saver looks like in full-screen mode when activated. Move your mouse
    to end the test.


    The Priority slider in the lower-right corner of the Screensaver dialog box determines
    how much CPU time is dedicated to running the screen saver. If you choose a screen
    saver, such as the Science example (refer to Figure 11-18), any amount of processor
    time can be spent calculating the graphical images for the screen saver. Any program
    that you have running in the background will be slowed down considerably so that
    the computer can draw fancy pictures for the screen saver. By setting the Priority
    slider, very little CPU time is assigned to the screen saver, freeing up your
    computer for more critical tasks (even when the screen saver is active).'
