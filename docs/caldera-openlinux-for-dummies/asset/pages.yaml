    # See Shells


    The first thing you want to do before continuing with this chapter is to make
    sure that you''re using the bash shell. If you''re using Linux without a graphical
    desktop and you''re logged in as a general user (rather than as the superuser,
    root), then you''re probably at a shell prompt. If you''re using the graphical
    desktop, then you must log in and use the KDE desktop to launch a Terminal-Emulator
    window, which probably contains a shell prompt. If you''re not familiar with how
    to do this, check out Chapter 11.


    Your shell prompt should look something like this:


    ```

    [username@hostname login]$

    ```


    The most important element is the $ at the end of the line. This element is the
    prompt and the shell''s method of saying, "Okay, I''m finished with the last thing
    so give me something else to do."


    ![](img/3c04420fbc1d01311e6031144afaecd2_181_0.png)


    If you''re logged in as root or have become a superuser through the use of su(l)
    command, the $ is replaced with a # sign, which indicates that the user is root
    or otherwise has become a superuser.


    To make sure you''re using the bash shell versus the one of the other shells,
    type bash, as follows:


    ```

    [username@hostname login]$ bash

    ```


    As soon as you press Enter, Linux comes back with one of two responses. If the
    person who installed your Linux system didn''t install bash properly, then you
    see the following:


    ```

    command not found

    ```


    You can find the person who installed your Linux system and throttle him within
    an inch of... no, no. You can find the person who installed your Linux system
    and calmly ask him to help you use the bash shell as your default shell.


    If you''re lucky, you see the following:


    ```

    [username@hostname login]$

