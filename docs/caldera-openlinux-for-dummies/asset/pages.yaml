    # Moving and copying files and directories


    OpenLinux allows you to move and copy files and directories two ways — using commands
    or by using the File Manager.


    # Using commands to move and copy


    The commands for moving and copying directories and files are mv and cp for copy.
    If you want to rename a file, you can use the move command. No, you''re not really
    moving the file, but in OpenLinux the developers realized renaming something was
    a lot like moving it. The format of the move command is


    ```

    mv <source> <destination>

    ```


    With your example files from the preceding section, you can move the file named
    radman to a file bryant by executing the following command:


    radman bryant


    This command leaves the file in the santa_cruz directory, but changes its name
    to bryant. You see the file was not really moved, but just renamed.


    Now moving the bryant file to the work directory. To do that, first you have to
    move the file up and then into the work directory. You can do that with one command:'
