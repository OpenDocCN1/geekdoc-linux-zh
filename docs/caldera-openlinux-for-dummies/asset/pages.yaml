  md: '# 76 Part II: Installing OpenLinux


    ![](img/3c04420fbc1d01311e6031144afaecd2_101_0.png)


    Figure 5-7: Enter a root password to protect the superuser account on your OpenLinux
    system.


    The root user is the superuser in OpenLinux. After you log in with the username
    root and the password that you define here, you can do anything to the system,
    including destroying it with a few false moves. Log in as root only when you need
    to do system administration work (reconfiguring OpenLinux) and guard the root
    password carefully!


    Enter the root password that you have selected in the Root password field. Enter
    the same password second time in the Retype Password field. As soon as the two
    passwords match, the Next field becomes active.


    Your computer''s response time may be a little slow as the packages are installed
    in the background. Be patient (read, move slower), and everything will just work
