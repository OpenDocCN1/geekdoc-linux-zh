  md: '# Chapter 10: Avoiding Shell Shock


    ```

    vi quagmire

    echo Report of user accounts and full names on the OpenLinux system

    date echo ========================

    cut -f 1,5 -d:/etc/passwd | sed -e ''s::/'' - /

