  md: '# Chapter 1: OpenLinux and You


    If the number of programs included with OpenLinux doesn''t satisfy you, then additional
    commercial applications are available. These applications include databases, such
    as Oracle or Sybase; specialized scientific programs; and office suites, such
    as WordPerfect and Applixware. With OpenLinux, you can have the same environment
    on your notebook computer, desktop workstation, and large server system.


    # File and print server


    Because of its multitasking capability, virtual memory, and powerful file system,
    OpenLinux works well as a file and print server for Microsoft Windows systems.
    A software product called Samba allows PCs that are running Windows to communicate
    with the file system and with printers attached to an OpenLinux machine. AppleTalk
    allows the same file- and printer-sharing for Apple computers. And, of course,
    OpenLinux can share files and printers with UNIX systems. By using OpenLinux to
    manage files and printers, you can save a lot of money because the operating system
    and the layered software that provide these services are included with the basic
    OpenLinux product on the CD-ROM in this book.


    # Internet/intranet service provider


    Many capabilities of the Internet (the worldwide network) and intranets (mini-Internets
    used within a single business) are possible because of HTML (HyperText Markup
    Language) and the World Wide Web. UNIX systems were at the forefront of developments,
    and OpenLinux shares many benefits of that heritage. Both the Internet and intranets
    require similar services, such as:


    +   * Firewalls to guard Internet servers against attacks from the bad guys

    * FTP (File Transfer Protocol) so that the good guys can upload and download data
    files and software

    * Telnet so that people can log in other computers onto your local network and
    remotely use your machine

    * Web servers so that people can see your Web pages

    * NFS (Network File System) to share hard disks over a network


    Many Internet service providers (ISPs) use OpenLinux to deliver services to their
    customers, not only because OpenLinux is effective but also because the source
    code for the core of the operating system is available. If a problem occurs, ISPs
    can correct the problem quickly by downloading a patch from Caldera''s site or
    by working on the problem themselves. The alternative is to wait for a traditional
    software vendor to correct the problem, which easily take months.'
