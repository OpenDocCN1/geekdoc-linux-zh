- img_proc: true
  md: '# 234 Part IV: Maintaining Your System


    +   - dump-freq is the frequency with which the file system may be backed up by
    the dump utility (not all systems use this).


    +   - pass-number is a decimal number specifying the order in which fsck, the
    file system check, checks the file systems. A pass-number of 1 (one) indicates
    that this file system should be checked first. This pass-number is assigned to
    root. All other file systems on different drives can be checked in parallel to
    speed things up, but file systems on the same drive should have different pass-numbers.
    For a swap device, the pass-number should be 0 (zero), which disables fsck checking.


    The following are examples of some typical /etc/fstab entries:


    ```

    /dev/hdb1 / ext2 defaults 1 1

    /dev/hdb3 none swap sw 0 0

    /dev/hda1 /mnt/win98 vfat noauto 0 0

    ```


    The first line enables the mounting of the first partition of the second IDE disk
    as the root file system. This partition is an Linux native file system and uses
    the rw, suid, dev, exec, auto, nouser, and async options. The first entry in the
    /etc/fstab file also indicates that the root file system should be dumped (backed
    up) once a week (use the man command for details on dump). Finally, the first
    entry of the /etc/fstab file indicates that fsck should be performed on the root
    file system immediately after booting the system.


    The second line shows that the third partition of the second IDE disk is a swap
    partition and has the format of a swap file. The swap partition should never be
    backed up, nor should you ever perform the fsck command on the swap partition.


    The third line of the /etc/fstab file points to the first partition of the first
    disk, which is a file system to be mounted on /mnt/win98. This file system probably
    holds Microsoft Windows 98 files, and you can read and write to this file system.
    The file system won''t be mounted automatically with the option of mount. You
    should never use dump to back up this file system, nor should you perform a file
    check on it.


    After you set up the /etc/fstab configuration file, file systems can be mounted
    automatically at boot time. In addition, you set up the /etc/fstab file, the mount
    and umount commands require only mount-point or block-special-file as their argument.


    Normally, most of the /etc/fstab file is set up during installation, so you only
    have to update the file over time as you add new disks or disk partitions.'
