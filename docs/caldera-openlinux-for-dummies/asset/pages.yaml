  md: '# 250 Part IV: Maintaining Your System


    ![](img/3c04420fbc1d01311e6031144afaecd2_275_0.png)


    # # Enhancing Disk Performance


    After your system has enough main memory, you may want to look at how well your
    disks are performing. OpenLinux (like a lot of UNIX operating systems) is user-oriented.
    Many OpenLinux users execute from disk, execute for a short time (Creating swap
    space on the disk and then releasing it), and terminate. In particular, when you
    create a long pipeline in shell programming, the last few programs in line may
    not do any work because the programs depend on data flowing through to them before
    the programs do anything. If no data reaches the last programs in the pipeline,
    the programs can''t do anything and will terminate.


    Suppose that the last program is a sort program. The sort program''s job is to
    sort the output into a particular order and then allow the display of the output
    on the screen. If no data comes through the pipeline, the sort program''s job
    is very short (kind of nonexistent), and all the work that the sort program did
    preparing to do sort is useless.


    OpenLinux also does a lot of work with temporary files. The C compiler generates
    many temporary files while it''s compiling a program, and the sort program does
    the same thing while sorting (that sort routine). All these temporary files may
    flush data out to the disk or bring data in the disk, creating a bottleneck through
    the disk subsystem.


    OpenLinux sets aside a certain amount of main memory in its dynamic buffer cache
    to hold data moving from the disk to the CPU and versa. When data is read from
    the disk, the data first goes into the dynamic buffer cache. Usually, more data
    than was originally requested goes into the cache (in a'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# Chapter 14: Customizing OpenLinux


    process known as *read-ahead*. When more information is needed, the CPU often
    can just go to the buffer cache and quickly get the data, without having to wait
    for the disk. When data is written to the disk, the data often goes only as far
    as the buffer cache. Data sits in the buffer cache until it''s needed again or
    until the buffer cache is told to write out its data to disk.


    # Multiple swap partitions


    If your system is paging and swapping heavily, you can''t afford more memory,
    creating multiple swap partitions (rather than having only one) and then distributing
    the swap partitions across your disk drives. Doing so helps to alleviate disk
    contention because then your programs are swapped and paged across multiple disks.


    Old versions of OpenLinux were limited to 128MB per swap partition. The latest
    versions don''t have this limitation. But performance improvements still come
    from creating multiple swap partitions instead of a single large swap partition
    to reduce head contention, as information is moved to and from the swap space.
    An OpenLinux system can support up to 16 swap partitions.


    # Create Your Very Own Kernel


    One of the items that may be slowing down your system can be a kernel that isn''t
    tailored to your hardware or your needs. A kernel that''s not set up for your
    system has two major disadvantages:


    +   - You may have your kernel compiled for a processor that you don''t have.

    - You have more instructions and data than you need in your kernel.


    This section describes both situations and what you can do to change them.


    # Tailoring a kernel for your processor


    The kernel of OpenLinux is prepared to install and function well on the largest
    range of systems. Therefore, the kernel is compiled to run on the slowest processor:
    An Intel 386. That''s what you have, right? Oh, well, let''s fix that.


    To take advantage of the power waiting inside the Pentium-class system that you
    have sitting next to you, you need at least to rebuild the kernel portion of OpenLinux,
    specifying the processor that you have. To do this:'
