    # Passing information to your shell


    The shell program can get several pieces of information from the arguments when
    you invoke the shell. To illustrate the presence of arguments on the command line
    and the capability of the shell to access the arguments, use a text editor to
    create a small, simple shell called stuff, and put it in the binary directory
    of your home directory (such as /home/maddog/bin). (Remember to change the shell''s
    mode to be executable by you, the owner.)


    ```

    cat ~/bin/stuff

    echo the zeroth argument $0

    echo the first argument $1

    echo the second argument $2

    echo the third argument $3

    echo the fourth argument $4

    echo the number of expanded arguments $$

    <CTRL+D>

    chmod u+x ~/bin/stuff

    ```


    That should be enough lines to put into the shell. Note that each line ends with
    either a number or the character #, preceded by a dollar sign. special names inside
    the shell that have values assigned to them according to what you type on the
    command line as a command name and the arguments you include when you invoke the
    shell.


    You should still be in the reports directory, but just to make sure that you are,
    change directories to your reports directory. Then execute the stuff script that
    you just created:


    ```

    cd ~/reports

    stuff

    the zeroth argument /home/maddog/bin/stuff

    the first argument

    the second argument

    the third argument

    the fourth argument

    the number of expanded arguments 0

    ```


    Note that the zeroth argument (called $0) is the full pathname for the executed
    shell command. When executing the command name by itself on the line with no additional
    arguments or options, the zeroth argument is the only argument that receives information.


    ![](img/3c04420fbc1d01311e6031144afaecd2_199_0.png)'
