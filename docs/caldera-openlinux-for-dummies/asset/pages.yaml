  md: '# Chapter 8: Working with Files and Commands 121


    Type this command:


    ```

    ls -la

    ```


    You see only the files in your working directory. If you want to specify a file
    that isn''t in your working directory, you have to identify the directory that
    contains the file, as well as the name of the file. For example, the following
    command lists the passwd file in the /etc directory:


    ```

    ls -la /etc/passwd

    ```


    Another method for determining your current working directory is to look at the
    top of the File Manager window that you''re working in, just below the toolbar.
    The path shown there indicates which directory you''re viewing in that window.


    # Every directory has a parent and lots of relatives


    If the file you want to read is in a subdirectory of the directory you''re in,
    you can reach the file by typing a relative filename. Relative filenames specify
    the location of files relative to where you are.


    In addition to what we tell you earlier about specifying directory paths, you
    need to know these three additional rules:


    +   - One dot (.) always stands for your current directory.

    - Two dots (..) specify the parent directory of the directory you''re currently
    in.

    - All directory paths that include (.) or (..) are relative directory paths.


    You can see these files by using the -a option of ls(1) command. Without the -a
    option, the ls command doesn''t bother to list . or .. files, nor does the command
    list any filename that begins with a period. This may seem strange, but the creators
    of UNIX thought that having some files that were normally hidden kept the directory
    structure cleaner. Therefore, filenames that are always there (. and ..) and special-purpose
    files are hidden. The types of files that should be hidden are those that the
    user normally doesn''t need to see in every listing of the directory structure
    (files used to tailor applications to the user''s preferences, for example).'
  merge: -1
