  md: '# 60 Part II: Installing OpenLinux


    12. Allow Windows to start, and then run Scandisk, checking all your folders and
    files.


    Scandisk indicates whether you have all the files and folders you started with
    and whether anything was lost.


    > TIP Remember to those backup files of your important Windows information that
    you created before using FIPS? Although everything may appear to have gone perfectly,
    keep those backup files around for a while.


    Now you''re ready to launch the OpenLinux installation.


    # Launching the Installation


    You can launch the OpenLinux installation in several ways. You can


    +   Boot the Caldera OpenLinux For Dummies CD-ROM directly by restarting your
    computer (this only works if you have a bootable CD-ROM drive).


    +   Use the "Boot from Windows" feature on the OpenLinux CD-ROM. You can''t use
    the above method if you''re running Windows NT.


    +   Create an Install disk and a Modules disk and boot your computer from these
    disks.


    The easiest way to install OpenLinux is on a system with a CD-ROM (especially
    an ATAPI/IDE or SCSI CD-ROM). Many newer computer systems have bootable CD-ROM
    drives. If you have a bootable CD-ROM, simply put the OpenLinux CD in the drive
    and reboot your computer. If this doesn''t happen automatically, check your BIOS
    settings to see if you can enable this feature.


    If you don''t have a bootable CD-ROM drive, you can start the installation from
    Windows or you must create an Install floppy and a Modules floppy from the CD
    files.


    # Boot the installation from Windows


