  md: '# Chapter 18


    # Ten Problem Areas and Solutions


    In This Chapter


    +   - I can''t boot OpenLinux anymore

    - My disk numbers changed after installation

    - The sound doesn''t work

    - My CD-ROM isn''t detected

    - I don''t know how to remove LILO and restore my MBR

    - I can''t use LILO to boot

    - The ls command doesn''t show files in color

    - OpenLinux can''t find a shell script (or a program)

    - I see a gray screen when I start KDE

    - I never seem to have the correct time


    In any complex, technical situation, people have problems and issues that they
    need help with. The problems in this chapter are taken from a data-base of hundreds
    of questions and answers. Many of these questions are answered in other parts
    of this book, but because you may not have run across those sections, we repeat
    some of the information here.


    # I Can''t Boot OpenLinux Anymore


    Problem: You install OpenLinux and everything is fine (naturally). Then one day
    you make a change to your Windows or Windows NT system, and OpenLinux stops working.
    You no longer see the lilo boot prompt, so you no longer can specify that you
    want to boot OpenLinux.


    Solution: Various operating systems tend to think that they are the only operating
    systems on the disk or on the system. Therefore, when these operating systems
    are installed or updated, they write to an area of the system called the Master
    Boot Record (MBR). This process overlays the Linux boot loader (called LILO) and
    stops you from booting Linux. The best correction requires an ounce of prevention:
    Make a boot-emergency floppy disk, as'
  merge: -1
  pgno: 326
- img_proc: true
  md: '# 302 Part VI: The Part of Tens


    you''re instructed to do during installation (see Chapter 5). Keep this disk handy
    when updating your system (or during any other significant system event, as repartitioning
    disks or rebuilding your kernel). Then, if you make a mistake, you can boot the
    floppy, which enables you to reboot your Linux operating system. After you''ve
    rebooted your system by using the floppy, just log as root and type lilo on the
    command line. This process repairs the MBR by reinstalling LILO.


    ![](img/3c04420fbc1d01311e6031144afaecd2_327_0.png)


    If you''re installing multiple operating systems on a new machine, do yourself
    a favor and install OpenLinux last. Otherwise, you have to keep reinstalling LILO.


    # My Disk Numbers Changed after Installation


    Problem: Each time OpenLinux boots, it numbers disks, calling SCSI disks names
    like sda, sdb, sdc, and so on. Suppose that you hold your Microsoft system, sdb
    holds the bulk of OpenLinux, sdc holds your user files, and sdd holds your swap
    space. Now you add another disk and your user files are on sdd and your swap space
    is on sde. The new disk is called sdc, but the disk is empty. What happened?


    Solution: SCSI disks are letter according to the SCSI IDs set on each disk. OpenLinux
    names the disks using this ordering scheme. If you insert a new disk into the
    SCSI bus with a SCSI ID that is lower than an existing disk, then you rename all
    disks with a SCSI ID above the SCSI ID that you just installed. Installing your
    SCSI disks starting with a SCSI ID of 0, 1, 2, and so on, is best; then you install
    additional SCSI devices at the other end of the SCSI bus (SCSI IDs 6, 5, 4, and
    so on). Note that most SCSI controllers are set to SCSI 7 by default.


    IDE disks are numbered according to their IDE controller and whether you''re a
    master or a slave on that controller. Therefore, adding a new disk to a set of
    IDE controllers doesn''t change the existing names, as shown here:


    | Controller | Disk | Linux Name |

    |---|---|-|

    | ide0 | master | hda |

    | ide0 | slave | hdb |

    | ide1 | master | hdc |

    | ide1 | slave | hdd |

    | ide2 | master | hde |

    | ide2 | slave | hdf |'
  merge: -1
