- img_proc: true
  md: '# Chapter 13: File System Management


    +   - mount-loc is the directory where the file system will be mounted. If the
    directory is on a partition used for swapping, then use swap for mount-loc.


    +   - type is the kind of partition. For a native OpenLinux file system, type
    is ext2.


    +   - opts is the field for listing options, separated by commas. The options
    may include any of the following:


    | rw | Allows the file to be read and written to (read-write mode). |

    | ro | Allows the file to be read only (read-only mode). |

    | dev | Treats special files in this file system as special files. |

    | nodev | Treats special files in this file system as filenames. |

    | exec | Permits execution of binary files from this file systems. |

    | noexec | Prevents execution of binary files from this file system. This is useful
    for file systems that contain only data. This option prevents programs from being
    introduced by system crackers or to prevent people trying to execute programs
    that are meant to run on a different file system, such as MS-DOS. |

    | auto | Allows the file to be mounted with the option to the mount command. |

    | nouser | Forbids a nonsuser from mounting a file system. |

    | asyne | Writes data to the file system asynchronously. The system is faster,
    but you can lose data if a system failure occurs. |

    | sync | Writes data to the file system synchronously. |

    | suid | Permits the suid (set user id) access mode (the default).


    The suid access mode enables an executable program with the suid (setgid) permission
    bit to set on the personality and permissions of the owner (or the group) of the
    executable program. This option can be a security hole; specifying the nosuid
    option prevents files in this file system from having the set user id (or setgid)
    access take effect.


    +   - nosuid Does not permit the suid access mode.


    +   - auto Does not automatically mount this file system when the -a option is
    used with the mount command.


    +   - usrquota User quotas may be in effect.


    +   - grpquota Group quotas may be in effect.


    +   - defaults A combination of rw, suid, dev, exec, auto, nouser, and async.


    ![](img/3c04420fbc1d01311e6031144afaecd2_258_0.png)'
