  md: '# 318 Part VII: Appendixices


    Note that OpenLinux doesn''t support tape drives that plug into the parallel port.


    # CD-ROM Drives


    You may think that any CD-ROM device works under OpenLinux, and most do. Early
    CD-ROM drives, however, usually were attached to the sound board and used for
    multimedia instead of high-capacity data drives. Linux supports most SCSI and
    EIDE (ATAPI) CD-ROM drives, particularly the newer ones that read data at 2x,
    4x, and on up to 40x speeds.


    # CD-Writers


    Frustrated singers, photographers, and choreographers would love being to be able
    to make their own CD-ROMs filled with music and pictures. Well, you can with OpenLinux!
    OpenLinux supports CD-writers, and a variety of software is available to instruct
    you on writing-once (WO) CDs. Programs, such as cdwrite and cdcd, can be used
    for writing to a CD-WO; and graphical front-ends, such as X-CD-Roast and KreatateCD,
    make the job even easier. The following CD-writers are supported: Grundig CD 100
    IPW, HP CD-Writer+ 7100, HP SureStore 402i, HP SureStore 602e/si, JVC XR-W2010,
    Mitsubishi CDRW-225, Mitsumi CR-2600TE, Olympus CDS 620E, Philips CDD-522/2000/2600/3610,
    Pinnacle Micro SCD-5020/5040, Plextor CDR PX-24CS, Ricoh MP 1420C, Ricoh MP 6205/6201S,
    Sanyo CDR-R245, Smart and Friendly Internal 2006 Plug 2.05, Sony 920S/924/926S,
    Taiyo Yuden EW-50, TEAC CD-R50S, WPI (Wearnes) CDR-632P, WPI (Wearnes) CDRW-622,
    Yamaha CDR-100, Yamaha CDR-200/200t/200tx, and Yamaha CDR-400t/400tx.


    # Modems


    Modems are simple things that are external to your system and plug into an existing
    serial line, or they''re internal to the system and look like another serial line
    to the system. Alas, some modems are made only for Windows and, therefore, don''t
    work with OpenLinux. These modems are generally known as WinModems — stay clear
    of them.'
