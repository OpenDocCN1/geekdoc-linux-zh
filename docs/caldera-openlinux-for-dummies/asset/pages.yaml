  md: '# Chapter 8: Working with Files and Commands


    The tee time file from the previous section, for example, may show the following
    permissions if listed with the ls -l tee time command:


    ```

    -rw-r--r--

    ```


    The hyphen (-) in the first position indicates that it''s a regular file (not
    a directory or other file). The next three characters (rw-) are the owner''s permissions.
    The owner can read and write to the file but can''t execute it. The next three
    characters (r--) are the group''s permissions. The group has read-only access
    to the file. The last three characters (r--) are the others permissions, which
    are also read-only.


    [ ]rw--[r--][r-- illustrates the four parts of the permissions: the file type
    followed by three characters indicating the read, write, and execute permissions
    for the owner, group, and other users of the file (meaning everyone else who has
    logged in OpenLinux)


    Specifying most file permissions by using only six letters is easy — three letters
    define who gets permission; three different letters define the permission being
    granted:


    +   - ugo, which stands for — no, not a car — user (or owner), group, and other

    - rwx, which stands for read, write, and execute


    These six letters and some symbols, such as = and commas, are put together into
    a specification of how you want to set the permissions of the file.


    The command for changing permissions is chmod. The syntax for the command is


    ```

    chmod <specification> filename

    ```


    You can change the mode of tee time to give the user the ability to read, write,
    and execute the file with the following:


    ```

    chmod u=rwx tee time

    ```


    That was easy enough, wasn''t it? If you want to give the group permissions only
    to read and execute the file? You can execute the following command:


    ```

    chmod g-rwx tee time

    ```


    Note that this last command doesn''t affect the permissions for owner or other,
    just the group''s permissions.'
