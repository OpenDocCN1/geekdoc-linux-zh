    # Ready, Set, Go!


    Now that you''ve configured your browser properly, you can connect to the Internet
    by typing the following in a Terminal Emulator window (or by using the kpppp utility
    described in Chapter 15):


    ```

    /sbin/ifup ppp0

    ```


    You have to wait a few seconds (or even a minute) to connect with your ISP (hearing
    your modem dials is reassuring). Try using the ping command to see whether the
    www.calderasystems.com server is visible over the network, indicating that you
    have a working connection:


    ```

    ping www.calderasystems.com

    ```


    Now type the following:


    ```

    netscape http://www.linuxjournal.org&

    ```


    Netscape starts and displays the URL you just supplied (http://www.linuxjournal.org).
    The screen appears similar to Figure 16-7.'
