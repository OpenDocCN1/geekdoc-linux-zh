  md: '# We did that already


    One of the most useful features of bash is command-line editing, which is the
    capability to change parts of a command line without having to retype the entire
    command. Suppose you type the following line:


    ```

    ls -1 * | more

    ```


    Your mind is wandering and you meant to use the less command, but you press Enter
    anyway.


    You groan. You press Ctrl+C to halt the command. You really want to reexecute
    the command, changing more to less, without having to retype the entire command.
    Just type the following:


    ```

    ^moreless

    ```


    In the above command, enter the "^" character just as it''s shown. This character
    doesn''t refer to the Ctrl key or anything special like that.


    This line resubmits the command to bash with more changed to less, follows:


    ```

    ls -1 * | less

    ```


    Output appears. If you have to stop the less command, press Q.


    Note that the shell redis the first command with the change, and then the command
    is reexecuted. How does the shell know about the first command? History, bash
    remembers all the commands you have typed (to a certain extent) and allows you
    to edit and resubmit the commands. Awesome.


    We say "to a certain extent" because bash remembers only a certain number of commands,
    depending on a parameter in the environment. After bash holds a given number of
    previous commands, it throws away the oldest ones as you type new ones. Normally,
    this given parameter is large (at least 100 commands), so bash will remember every
    command that you remember.


    # Bang-bang


