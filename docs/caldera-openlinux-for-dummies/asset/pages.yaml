    Linux has almost the X Window System from the beginning to provide a graphical
    environment for those who prefer a mouse to a keyboard. X Window System has powerful
    features for remote access; X also has thousands of available applications. But
    X alone doesn''t provide a full-featured desktop interface like a Microsoft Windows
    or a Macintosh computer.


    Along 1996, Matthias Etrich founded a project called KDE, for the K Desktop Environment.
    KDE provides the nifty windows and desktop tools that you''re used to use if you''ve
    used a Microsoft Windows system or something similar. KDE includes screen savers,
    color schemes, wallpaper images, and accessories (such as a calculator, calendar,
    and basic text editor). And Caldera OpenLinux includes them all.


    In this chapter, you find out lots of ways to work in KDE, including how to work
    with individual windows, how to move between multiple applications, and how to
    set up the appearance of your desktop to fit your liking.


