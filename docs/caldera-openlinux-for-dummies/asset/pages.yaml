  md: '# 210 Part III: Using OpenLinux


    # Scheduling recurring visits


    Some of your appointments happen repeatedly (we hope the dentist isn''t one of
    those). KOrganizer automatically can fill in your calendar with a recurring event.
    Just follow these steps:


    +   - Follow Steps 1 through 5, as appropriate, in the preceding section.

    - Check the Recurring event checkbox on the General tab.

    - This activates the Recurrence tab.

    - Click the Recurrence tab (shown in Figure 12-3).


    ![](img/3c04420fbc1d01311e6031144afaecd2_235_0.png)


