  md: '# Getting E-Mail


    Now that you can surf the Net, you probably want to tell people about your adventures.
    Well, Netscape can send and receive e-mail, too.


    Go to the main window of Netscape, and you see a menu item labeled Communicator.
    On the Communicator menu choose the Messenger option. The browser takes you to
    the Mail side of Netscape Communicator, as shown in Figure 16-11.


    ![](img/3c04420fbc1d01311e6031144afaecd2_310_0.png)


    Figure 16-11: The Netscape Mail & Newsgroups window.


    To get your mail, simply click the Get Msg icon. This icon tells Netscape to make
    contact with your mail server and see whether any e-mail messages are waiting
    for you. If you have no new e-mail, a message at the bottom of the screen tells
    you so. If you do e-mail, then the subject and sender appear in the center of
    the screen, and the e-mail message appears in the bottom of the screen, as shown
    in Figure 16-12.'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# 286 Part V: Going Online


    ![](img/3c04420fbc1d01311e6031144afaecd2_311_0.png)


    Figure 16-12: Receiving an e-mail message.


    If you have multiple e-mail messages, you can see each message by clicking the
    Subject line in the middle window. You may reply to, forward, or delete a particular
    message by highlighting its Subject line and clicking the appropriate icon (Reply,
    Forward, or Delete). When you click the Reply icon, the address of the person
    you''re replying to appears automatically in the Field of the reply. When you
    forward a message, a copy of the message is sent as an attachment to the address
    you specify.


    # Sending E-Mail


    To send an e-mail message, you have to know the e-mail address. Just as a URL
    consists of certain components, an e-mail address is made up of the person''s
    e-name (often the same as his or her login name) and domain name. For example,
    to send an e-mail to the President of the United States, you address your message
    to president@whitehouse.gov. (Give him our regards.)


    Your ISP should have given you an e-address, and you can ask friends for their
    e-mail addresses. The irony is that to get your friends'' e-mail addresses initially,
    you invariably spend a lot of time calling them on the telephone.'
