  md: '# Chapter 10: Avoiding Shell Shock


    # The Bourne Again Shell


    When Ken Thompson and Dennis Ritchie, two programmers at AT&T Bell Labs, first
    created UNIX, they wanted to investigate lots of new ideas in using computers.
    One of the ideas they explored was making the human interface to the computer
    changeable and adaptable to the specific needs of the application.


    systems. The C shell was used only on Berkeley systems — AT&T was paranoid about
    having a shell on its system that was created by long-haired college students.
    The researchers at Bell Labs fought to add the C shell, and eventually it was
    ported to System V, also.


    This interface (or more specifically, which humans interact with most) is typically
    called a command interpreter, because the interface looks at each command as the
    command is typed and converts the command into something that the computer can
    follow as an instruction. Most computer systems at that time had the interpreter
    built into the operating system, which meant the user couldn''t change it. The
    UNIX developers wanted to separate the interpreter from the rest of the operating
    system. Because the desired functionality was both a command interpreter and a
    complete environment, the function was called a shell. The first command interpreter
    for UNIX was called the Bourne shell, abbreviated as sh.


    Next, GNU, a collection of software based on UNIX and maintained by the Free Software
    Foundation (GNU, by the way, stands UNIX). The GNU project decided that it needed
    a shell of royalty restrictions. At the time, the C shell was still under restrictions
    from AT&T. The GNU flocks decided to create their own royalty-free, GPL shell.
    Their new shell would be compatible with the Bourne shell, incorporate some of
    the C shell ideas. GNU called its shell, for Bourne Again.


    Meanwhile, David Korn, an AT&T researcher, merged the Bourne shell, C shell, and
    any other shells he could find, and made the result even better for programmers
    implementing several programming features. The most notable addition was functions
    (which help to divide large shell into smaller, easier-to-maintain ones). His
    shell was named the Korn (abbreviated ksh). Eventually, this shell also developed
    graphical features and was adopted by the Open Software Foundation as part of
    their Common Desktop Environment (dtksh).


    Later, UNIX escaped from Bell Labs and flew to the University of California, Berkeley,
    the developers decided to extend the shell. They made the shell of a programming
    language and included some features found in the C language. The resulting shell
    was the C shell, abbreviated csh. So, now, whenever Susie takes her OpenLinux
    laptop to the beach, she sits conflicting C shells on the seashore.


    Both the Bourne shell and the C shell existed for many years. The Bourne shell
    version available on system V and Berkeley-based


    As the price of computers dropped and freely distributed versions of UNIX (netBSD,
    FreeBSD, and Linux) made their way across the


