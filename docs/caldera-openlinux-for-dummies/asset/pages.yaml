  md: '# 204 Part III: Using OpenLinux


    Figure 11-19: A terminal emulator window lets you directly enter commands for
    OpenLinux processing via the shell interface.


    ![](img/3c04420fbc1d01311e6031144afaecd2_229_0.png)


    > TIP If you simply need to enter a single command to start a program or check
    something on the system, press Alt+F2 to open a pop-up command window. In this
    window you can enter a single command and then press Enter to execute the command.


    # Bye, Bye KDE


    When you''re ready to exit KDE entirely and return to the graphical login screen
    (or the character-mode screen, if that''s where you started), gracefully exit
    KDE by choosing Logout from the main menu. You can also right-click anywhere on
    the KDE Desktop and choose Logout from the menu that appears.


    After you choose Logout, you see a dialog box asking you to confirm that you want
    to log out. Any windows that you still have open are listed in the confirmation
    window. You can choose Cancel to close those windows (which you should do if the
    windows contain unsaved data).


    After you exit, KDE remembers the position of all open windows so that the next
    time you start KDE, the same programs are opened again (right where you left them).
    Impressive, isn''t it? Of course, if you have many non-KDE programs, sometimes
    for your next KDE session, KDE can''t repeat the programs the same way you had
    them when you ended your last KDE session.


    # Linking Everything to KDE


    You quickly became a fan of the graphical way of life that''s provided by KDE.
    You''ll love choosing color schemes, you''ll experiment with wallpaper images,'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# Chapter 11: Windows on the World


    and you''ll play with the fractal generator at lunch time. But some of the programs
    you need to use aren''t included in the KDE main menu. How do you proceed?


    KDE uses little configuration files called KDE Link files. These files contain
    all the information that KDE needs to start an application. KDE Link files are
    used to create KDE menu items, KDE Desktop icons, KDE Panel icons, KDE Autostart
    icons ... you get the idea.


    Let''s assume you have access to your favorite graphical program, the Gimp, from
    an icon on your KDE Desktop. Just follow these steps:


    +   Right-click your desktop, then choose New: Application from the pop-up menu
    that appears.


    +   A small window containing a filename pops open.


    +   Change the name from the Program.kdelink default to something that matches
    the name of the application you want to add to your desktop.


    +   For example, if you were adding the Gimp application, you may use Gimp.kdelink
    (just be sure to leave the .kdelink part intact). Notice that the file extension
    is not kdelink, it''s kdelink.


    +   Choose OK.


    A properties dialog box appears.


    +   Select the Execute tab of the dialog box (shown in Figure 11-20).


    ![](img/3c04420fbc1d01311e6031144afaecd2_230_0.png)


    Figure 11-20:

    The Execute tab of the KDE Link properties dialog box contains the name of the
    program to execute by using this KDE Link file.'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# 206 Part III: Using OpenLinux


    5. In the Execute field enter the command to start the program as you would from
    a command line.


    In this example, we enter the command gimp.


    6. Click the picture of a gear to select a new icon for the application that you''re
    configuring access to.


    KDE includes several hundred icons that you can choose from. Explore the other
    tabs if you want to see what options KDE provides for KDE Link files.


    7. Click OK to close the dialog box and activate the new KDE Link file.


    The icon appears on your desktop. You can click (once) this icon to launch the
    program that you entered in the Execute tab.


    You can use standard drag-and-drop techniques to copy or move this icon and the
    configuration file it represents to your Panel, to your Autostart folder, or to
    the menu configuration dialog box. (Choose Panel->Edit Menus to alter the KDE
    menus.)


    ![](img/3c04420fbc1d01311e6031144afaecd2_231_0.png)


    The KDE Link file is only a configuration file that tells KDE how to use the application.
    As soon as you delete a KDE Link file, this action has no effect on the application
    that the KDE Link file was used to access.'
  merge: -1
