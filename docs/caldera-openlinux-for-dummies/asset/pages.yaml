- img_proc: true
  md: '# Chapter 1: OpenLinux and You 17


    The three-tier concept is to divide work logically, and after you do, then you
    can put all three pieces of functionality onto one computer — an OpenLinux system.


    # Turnkey system


    A turnkey system is put together once and then duplicated in hundreds or thousands
    of places. Typical turnkey systems are information kiosks, hotel-reservation systems,
    doctors'' and lawyers'' office systems, and automotive-diagnostic systems. OpenLinux
    is perfect for turnkey-systems'' work because OpenLinux provides the security,
    protection, and stability that turnkey systems need, without requiring huge payments
    for many copies of the operating system. For example, suppose an application was
    needed on 4,000 hotel systems. If the business had to pay, say, $500 for the operating
    system, then the project would cost $2,000,000, extra, just to cover the operating
    system.


    # Linux all over


    +   - Standard PCs — the kind found in most offices — use 32-bit Intel processors.
    Don''t want to limit yourself to an Intel processor? No problem. Linux has been
    ported (converted to run on) to a number of other architectures, including Alpha,
    StrongARM, and SPARC, to give users a choice of manufacturers and make the Linux
    kernel flexible for new processors. Caldera joined this movement; OpenLinux for
    SPARC was announced in mid-1999. OpenLinux also supports multiprocessing (more
    than one CPU in the same computer). The Linux community as a whole, projects are
    in the works to continue development of sophisticated processing capabilities
    (such as the following that are available already with OpenLinux).\ Real-time
    programming, typically to control machinery or equipment

    - High availability, which is having the computer run reliably at all times

    - Scalability, that is, the ability to work on systems ranging from old PCs to
    the latest, fastest microprocessors

    - Clustering, which allows multiple OpenLinux computers to be tied together into
    one supercomputer

    - This capability — known as Extreme Linux systems or Beowulf systems — enabling
    research organizations to create machines with supercomputer capabilities at a
    fraction of the price of supercomputers. In certain cases, Extreme Linux systems
    are made from obsolete PCs, costing the organizations that make them nothing in
    material costs.'
