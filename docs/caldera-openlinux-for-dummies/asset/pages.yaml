  md: '# 128 Part III: Using OpenLinux


    mv bryant ..work


    Note that the destination file uses the .. (or parent directory) designation.
    This command tells OpenLinux to go up one directory level and look for a directory
    called work, and then put the file into that directory with the name bryant, because
    you didn''t specify any other name. If you instead typed this:


    mv bryant ..work/supersalesman


    the bryant file would move to the work directory named supersman. Note that in
    both cases (with the file maintaining its name of bryant or taking the new name
    supersalesman), your current directory is still santa_cruz, and all your filenames
    are relative to that directory.


    ![](img/3c04420fbc1d01311e6031144afaecd2_153_0.png)


    Strictly speaking, the file still has really moved. The data bits are still on
    the same part of the disk where they were originally. The file specification (the
    directory path plus the filename) that you use to talk about the file is diferent,
    so it appears to have moved.


    In early versions of UNIX, you were not allowed to use mv to move a file from
    one disk partition to another; you could only copy a file using the cp command.
    OpenLinux allows you to use the mv command to move a file anywhere. Normally,
    mv leaves the data in place and just changes the file''s name or the directory
    it is placed. When the file is moved across disk partitions (for example, from
    /usr to /home in a lot of OpenLinux systems), the data is copied to the new disk
    partition, the new name is put in that partition''s directory structure, and the
    name and file''s data are removed from the old disk partition.


    Copying a file does some data. The syntax is


    ```

    cp <source> <destination>

    ```


    Look familiar? This is the same syntax you use for the move command.


    Now, make two copies of the jewels file. Because you can''t have two files with
    the same name in the same directory, you have to think of a new name, such as
    jewels2.


    ```

    cp jewels jewels2

    ```


    If you want to copy of a file but in a different directory, you can use the same
    filename. For example, suppose you want to copy a file called moody to the ../work
    directory. You can keep the name moody because its full pathname has in it instead
    of in santa_cruz:


    ```

    cp moody ..work

    ```'
