  md: '# Appendix C


    # About the CD


    The Caldera OpenLinux For Dummies CD-ROM contains the full distribution of OpenLinux
    2.3 with the Lizard graphical installation utility. The CD doesn''t include the
    PartitionMagic product, nor does the CD include commercial components, such as
    WordPerfect and StarOffice, that are available if you buy a complete boxed version
    of OpenLinux.


    # System Requirements


    Make sure that your computer meets the minimum system requirements listed here.
    If your computer doesn''t match up to most of these requirements, you may have
    problems using the contents of the CD:


    +   - A PC with a 486 or faster processor.

    - At least 8MB of RAM installed on your computer. For the best performance, we
    recommend that people who want to use the X Window System and KDE have at least
    16MB and preferably 32MB of main memory.

    - At least 500MB of hard-drive space available to complete a default installation
    from the CD. You need less space if you choose the minimal installation option.
    Conversely, if you choose to install everything on the CD, you need about 1.4GB
    of hard-disk space. And keep in mind that the space requirements given here are
    only for the operating system and utilities. You want some additional space for
    other applications and your own data files as you work in OpenLinux.

    - A CD-ROM drive.

    - A 3½-inch floppy disk drive and a blank 3½-inch disk.

    - A monitor capable of displaying at least 256 colors or grayscale.

    - An IDE or a SCSI disk.

    - A keyboard and a mouse.

    - A modem with a speed of at least 28,800 Kbps if you want to go online.'
  merge: -1
  pgno: 364
- img_proc: true
  md: '# Part VII: Appendixixes


    Refer to Appendix A for a listing of all the hardware that''s compatible with

    OpenLinux.


    # Using the CD


    The instructions for installing the CD are in Part II. After you install the soft-

    ware, return the CD to its plastic jacket for safekeeping.


    # What You Find


    The CD contains a Caldera Systems, Inc., OpenLinux operating system. You

    may view a lot of documentation on this CD through an HTML viewer, such as

    Netscape, which is installed by default. You can also print documentation

    from Netscape (if you have a printer connected to your system) or view the

    documentation directly from the CD by using another operating system, such

    as DOS DOS, Windows, or UNIX, before installing OpenLinux.


    We recommend that you review the README files in each of the main subdi-

    ories before beginning the installation. These files contain valuable informat-

    about the product and guidelines for using the files in each directory.


    Because the CD-ROM has a full implementation of OpenLinux, listing the hun-

    dred of tools and utilities that are included in OpenLinux would take too

    m space. Briefly, the CD includes most of the software you need to access

    the Internet; write programs in several computer languages; create and

    manipulate images; create, manipulate, and play back sounds (if you have a

    sound board); and play numerous games. And, of course, all the source code

    isnis.


    # If You Have Problems (Of the CD Kind)


    Although we''ve tried to test various computers with the minimum system

    requirements, your computer may differ and OpenLinux may not install or

    work as stated.


    The two likeliest problems you may face are not enough RAM for the programs

    that you want to use or hardware that OpenLinux doesn''t support. Likely,

    tnlatter problem occurs less frequently as more hardware is supported under

    OpenLinux. (Check out Appendix A for a list of compatible hardware.) Video

    cards (especially on laptops) are the most problematic issues of hardware.'
  merge: -1
