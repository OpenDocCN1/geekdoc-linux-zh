  md: '# 66 Part II: Installing OpenLinux


    Keep a few things about this installation interface in mind:


    +   - On most systems, the mouse pointer works automatically as soon as you move
    your mouse. If the mouse pointer doesn''t work, use the arrow keys to select items,
    then tab to different buttons and press Enter to push the button.

    - The Back and Next buttons can be used in most parts of the installation to return
    to a previous step and make a change. If one or two places doing this isn''t possible,
    but we warn you (as does an on-screen message). For example, after you choose
    a language, you can''t back up and pick a different one. Sorry.

    - On each screen of the installation you can use the Help button to open a separate
    dialog box with instructions for that screen. Basic information is provided on
    the right side of each screen, the help window tells you even more.


    # Beginning the Installation


    To begin installing OpenLinux, follow these steps:


    +   1. Start the installation program by using one of the methods outlined in
    Chapter 4:

    - Insert your Caldera OpenLinux For Dummies CD and reboot your computer.

    - Insert the Install disk that you made from the CD and reboot your computer.

    - Insert your Caldera OpenLinux For Dummies CD and launch the OpenLinux installation
    from Microsoft Windows.

    2. On the Language Selection screen, choose which language you want to use for
    OpenLinux.

