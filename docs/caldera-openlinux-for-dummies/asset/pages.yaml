- img_proc: true
  md: '# 300 Part VI: The Part of Tens


    So what if you make a mistake? You''re probably running OpenLinux on a machine
    that has only one user, you. That''s the great thing about OpenLinux. It runs
    on such inexpensive machinery for under $50 you can buy an old 486 computer with
    enough disk and memory in to run OpenLinux as a practice system. (We''ve run Linux
    on just such machines. They work nicely, thank you very much.) So even if you
    have to reinstall your system because of some mistake that you made, no else on
    your practice machine will be disturbed. You now know how to install OpenLinux,
    so that no one you ever has to know when something goes wrong.


    We also want to suggest that you help someone else. "What? say you. How can I
    help anybody else? I''m just a beginner!


    We all started that way. No one is born with a knowledge of computer science;
    we all pick it up over time. The way to cement a thought or an idea, however,
    is to explain it to someone else. Helping others install OpenLinux on their PCs
    will cement some of the concepts that you''ve discovered. Another thing you can
    do is to attend a Linux Fest at a local user group meeting or trade show conference.
    At these events lots of people go (with their machines) to install Linux. That
    way you not only get to help someone else, but you''ll probably pick up a few
    pointers from some of the other attendees.


    A main tenant of OpenLinux is the word open. OpenLinux is open and best when shared.
    You can start helping people (and asking questions) immediately by joining the
    Caldera Systems mailing list. On this mailing list hundreds of OpenLinux users
    exchange information and help each other with problems. The Caldera Systems Web
    site has instructions for subscribing; check it out at www.calderystems.com/support/forums.'
