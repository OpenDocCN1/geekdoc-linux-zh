  md: 'In a File Manager window you can click the location field below the toolbar
    and enter a pathname to change the window''s contents to view files and directories
    at that path. You can also click (just once) any directory that you see in the
    File Manager window to change to that directory.


    # Going home


    If you type cd by itself, without any directory name, you return to your home
    directory. Just knowing that you can get back easily to familiar territory is
    comforting. There''s no place like home.


    You can also use cd with a relative specification. For example:


    ```

    cd ..

    ```


    If you''re in the directory /usr/bin and type the preceding command, you''re taken
    to the parent directory called /usr, as follows:


    ```

    cd /usr/bin

    cd ..

    ```


    > Here''s a trick: If you type cd --<username>, you can go to that user''s home
    directory. On very large systems, this command is useful because it eliminates
    the need for you to remember — and type — large directory specifications.


    Remember that each File Manager window includes an icon on the toolbar for the
    home directory. Just click the icon containing a little picture of a house to
    return immediately to your home directory.


    # Using cat to Create and Add to Files


    The cat command is simple, easy to use, and one of the most useful OpenLinux commands.
    The cat name stands for concatenate, meaning to add to the end of. The cat command
    takes all the input it gets (mostly from the keyboard) and outputs it to the screen.


    Make sure you''re not logged in root (see Chapter 7) when you go through this
    section and the sections that follow. Wait until you''re thoroughly familiar with
    this chapter before you log in as root and try the examples. OpenLinux (for the
    most part) doesn''t have an undo function, although a change is on the horizon.'
