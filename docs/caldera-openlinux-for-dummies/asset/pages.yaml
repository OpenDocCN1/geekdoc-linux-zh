  md: '# 118 Part III: Using OpenLinux


    If you list files with the ls -l1 command, then lines containing directory files
    begin with the letter d. For example:


    ```

    ls -ld plot

    drwxr-xr-x 2 nwells nwells 1024 Jul 111997 plot

    ```


    In this example, we use the d option of the ls command to tell the command to
    see the directory as if it''s the only file in the plot directory. If we didn''t
    use the d option, we''d see every file in the plot directory, along with the directory
    itself.


    +   * Special files represent either hardware devices (such as disk drives, tape
    drives, or keyboards) or some type of placeholder for the operating system. /dev
    is a directory that holds many of these special files. You can see this directory
    by typing the following:

    ls /dev


    +   * Executable files contain instructions (usually called programs, or shell
    scripts) for your operating system. If you type one of these filenames, you''re
    telling the operating system to execute the instructions. Some executable files
    look like gibberish, and others look like long lists of commands. OpenLinux has
    standard directories in which most of these executable files are located: /bin,
    /usr/bin, /sbin, and /usr/sbin. By placing executable files in a predefined directory,
    OpenLinux can find the files when you want to run them.


    # Files and directories


    You can think of the OpenLinux file system as one huge folder that contains files
    and other folders, which turn contain files and other folders, which turn contain
    files and other folders, and so on. In fact, the OpenLinux file system is generally
    organized this way. One big directory contains files and other directories, and
    all the other directories in turn contain files and directories.


    # Directories and subdirectories


    A directory contained, or nested, in another directory is called a subdirectory.
    For example, the directory called /mother may contain a subdirectory called /child.
    The relationship between the two is referred to as parent and child. The full
    name of the subdirectory is /mother/child, which would make a good place to keep
    a file containing information about a family reunion. It could be called /mother/child/reunion.


    # The root directory


    In the tree directory structure of OpenLinux, DOS, and UNIX, the big directory
    at the bottom of the tree that is the parent for all the other directories is'
  merge: -1
  pgno: 143
- img_proc: true
  md: '# Chapter 8: Working with Files and Commands


    called the root directory and is represented by a single / (pronounced "slash/").
    From the root directory, the whole directory structure grows like a tree, with
    directories and subdirectories branching off like limbs.


    If you turn the tree so that the trunk is in the air and the branches are toward
    the ground, you have an inverted tree — which is the way OpenLinux file system
    is normally drawn and represented (with the root at the top). If we were talking
    about Mother Nature, you''d have seen a dead tree. Because this is computer technology,
    however, you have something that looks like an ever-growing, upside-down tree.


    # What''s in a name?


    You name directories in the same way that you name files, following the same rules.
    The only way that you can tell whether a name is a filename or a directory name
    is the way that the slash (/) is used to show directories nested in other directories.
    For example, usr/local means that local is found in the usr directory. You know
    that usr/ is a directory because the trailing slash tells you so, but you don''t
    know whether local is a file or a directory.


    ![](img/3c04420fbc1d01311e6031144afaecd2_144_0.png)


    If you issue the ls command with the -F option, then directories are listed with
    a slash character at the end, as in local/, and then you know that local is a
    directory.


    The simplest way to tell whether the slash character indicates the root directory
    or separates directories, or directories and files, is to see whatever appears
    before the slash character in the directory-path specification. If nothing appears
    before the slash, then you have the root directory. For example, you know that
    /usr is a subdirectory or a file in the root directory because it has only a single
    slash character before it.


    # Home again


    OpenLinux systems have a directory called /home, which contains the user''s home
    directory, where he or she can


    +   - Store files


    +   - Create more subdirectories


    +   - Move, delete, and modify subdirectories and files


    OpenLinux system files — as well as files belonging to other users — are never
    in a user''s /home directory. OpenLinux decides where the /home directory is placed,
    and that location can be changed only by a superuser, not by general users. OpenLinux
    is dictatorial because it has to maintain order and keep a handle on security.'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# 120 Part III: Using OpenLinux


    Your /home directory is not safe from prying eyes. To be sure that your privacy
    is maintained, you need to lock your directory. (We tell you that the "May I Please...”
    section.) Anyone logging in to your system as root (superuser), however, can see
    what''s in your /home directory, even if you do lock it.


    ![](img/3c04420fbc1d01311e6031144afaecd2_145_0.png)


    # Getting Around with pwd and cd


    You can navigate the OpenLinux file system without a map or a GPS. All you need
    to know are two commands: pwd and cd.


    # Where are we?


    To find out where you are in the OpenLinux file system, simply type pwd at the
    command prompt as follows:


    ```

    pwd

    /home/nwells

    ```


    This command indicates that we are logged in nwells and the current working directory
    is /home/nwells directory. Of course, you should be logged as yourself and be
    in the /home/yourself directory, where yourself is your login name.


    The pwd command stands for print working directory. Your working directory is
    the default directory where OpenLinux commands perform their actions. After you
    type the ls -l command, for example, OpenLinux shows you the files in your working
    directory. Any file actions on your part occur in your working directory.


    # Conventions without Shriners


    You see a lot of commands, so you may benefit by reviewing the syntax of OpenLinux
    commands:


    +   - Text not surrounded by [ , ], or < > must be typed exactly as shown.

    - Text inside brackets [ ] is optional.

    - Text inside angle brackets < > must be replaced with appropriate text.


    +   - Text inside braces ( ) indicates that you must choose one of the values
    inside the braces separated by the | sign.

    - An ellipsis ( . . ) means so and on to repeat the preceding command line as
    needed.'
  merge: -1
