  md: '# 16 Part I: Introducing OpenLinux


    How critical is a timely correction? Well, in 1997, a problem with TCP/IP resulting
    from a deliberate misuse of a program ping affected almost every UNIX system in
    the world. This problem allowed bad guys (called crackers) to shut down other
    people''s UNIX systems. The world needed new software updates to repair this problem
    — and quickly! An update for OpenLinux (and all Linux systems) was on the Internet
    within four hours after the problem was identified, and people could easily download
    the software update and then apply it to their systems. Various commercial vendors
    took weeks to develop a similar update for their operating systems and sent it
    to their customers.


    # Three-tier client/server


    Whoa! What the heck is a three-tier client/server? A three-tier client/server
    simply means that most large computer tasks can be broken down into three, separate,
    smaller tasks, or tiers:


    +   - Data presentation

    - Data manipulation

    - Data storage and retrieval


    If we break a problem into these three levels, the problem typically is easier
    to solve and easier to change later, as necessary. Until recently, the data-presentation
    level consisted of Microsoft Windows systems running on the desktop (perhaps using
    Visual Basic to develop the interface). The data-manipulation level and the data-storage-and-retrieval
    level consisted of UNIX (or older systems) communicating over the network.


    Now, however, the data-presentation level can be an OpenLinux system''s running
    a freely distributed Web browser or a freely distributed Java system (a portable
    environment for applications). By using OpenLinux, some firms can save thousands
    of dollars on operating-system costs yet still receive required security and operating-robustness.


    As with most UNIX systems, OpenLinux also has sophisticated data-manipulation
    tools that make OpenLinux a good second-tier system. OpenLinux can extract data
    from several types of databases or reports that are kept in files from older systems,
    and then sort, search, combine, process, and otherwise manipulate the data, passing
    the newly created results to the presentation level on the desktop.


    Finally, OpenLinux has the facilities to act as a good data-storage-and-retrieval
    level. Several commercial database packages run on OpenLinux. These packages include
    DB2, Oracle, Informix, Sybase, and Interbase. If you can''t afford a commercial
    database package, you can use one of the freely available packages, such as Postgres.'
  merge: -1
