  md: '# Chapter 13


    # File System Management


    In This Chapter


    +   * Making your files available to OpenLinux by mounting a file system

    * Dismounting a file system

    * Playing inspector to search for other users

    * Experiencing the joys of configuration files

    * Rehabilitating corrupted files

    * Increasing disk space with a new device

    * Using more floppies

    * Adding a CD-ROM drive


    Managing the OpenLinux file system is one of the more important jobs in maintaining
    and updating your OpenLinux system. You have the responsibility of watching over
    the OpenLinux file system and seeing to it users (even if you''re the only one)
    have access to secure, uncorrupted data.


    The tasks associated with file-system management include the following:


    +   * Mounting and dismouting file systems

    * Diagnosing hardware failures

    * Preventing file corruption

    * Blocking user errors

    * Connecting and configuring new hardware

    * Managing disk resources


    Some of these tasks are performed automatically, thank goodness. Other tasks you
    must do manually, as needed. In this chapter, you discover the ins and outs of
    managing your OpenLinux file system — the easy way.'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# Mounting and Dismounting


    Files are important to OpenLinux and other UNIX-like operating systems in ways
    that differ from their importance to DOS, Windows, and Macintosh operating systems.
    In OpenLinux, everything is stored as a file in a pre-dictable location in the
    directory structure—OpenLinux even stores commands as files. Like other operating
    systems, Linux has a tree-structured, hierarchical, directory organization called
    a file system.


    All user-available disk space is combined in a single-directory tree. The base
    of the system is the root directory, which is designated with a slash (/). The
    contents of a file system are made available to OpenLinux by merging the file
    system into the system directory through a process called mounting.


    File systems can be mounted or dismounted, which means file systems can be connected
    or disconnected to the directory tree. The root file system, which is always mounted
    on the root directory when the system is running and cannot be dismounted. Other
    file systems may be mounted as needed, such as ones contained on another hard
    drive, a floppy disk, or a CD-ROM.


    # The command syntax


    Here''s the command syntax for manually mounting a file system:


    ```

    mount block-special-file mount-point

    ```


    where block-special-file is the device driver for the partition of the disk (such
    as a hard drive or a CD-ROM) where you created a file system, and mount-point
    is the directory where the file system is mounted. The term block-special-file
    is often referred to as the device name, because the device is accessed by referring
    to the block-special-file in the directory structure.


    Want to see the mount command assign the first floppy drive, which Linux refers
    to as /dev/fd0, (see Chapter 4) to the /mnt directory? Hey, did we promise you
    a good time or when?


    ```

    mount /dev/fd0 /mnt

    ```


    A file system can be mounted in only one place at any given time. The directory
    where the file system will be mounted (mount-point) must exist before you issue
    the mount command. Otherwise, the command won''t work. If you need to create the
    directory, then use a combination of the mkdir command (see Chapter 8) and the
    mount command. For example, to create a new directory called canadianpolice and
    then mount the file system on the disk in the floppy drive (/dev/fd0)—onto that
    directory, you use the following:


    ![](img/3c04420fbc1d01311e6031144afaecd2_255_0.png)'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# Chapter 13: File System Management


    ```

    mkdir /canadianpolice

    mount /dev/fd0 /canadianpolice

    ```


    After you''re finished or fed up with the file system that you mounted

    /canadianpolice, you must dismount the file system by using the umount

    command. The syntax for the umount command is


    ```

    umount name

    ```


    where name is either the name of the block-special-file (the device, /dev/fd0)

    or or the name of the directory (that''s the mount-point, /canadianpolice).


    # Sleuthing for other file users


    Because OpenLinux is a multi-user operating system, sometimes more than

    one user is logged in to the system at the same time. This feature may mean

    multiple file systems are mounted and in use. The umount command

    works only on active file systems. If one of the files in the file system is

    open the file system is the current directory, then an error message tells

    ythat the device is busy.


    How do you find out which files are being used and by whom? You use the

    fuser command. (Get it?) Find user — fuser.) The command returns a lot of

    information, identifying which processes are using a particular file or file

    system and which user is using them. If you use fuser with a filename,

    it returns information on only that file. If you invoke fuser with the block--

    special filename, then fuser reports on all the files in that file system.


    The fuser command has two options that you may find useful:


    +   -u displays user names along with process IDs

    -m enables you to specify the file system by name


    fuser is a character-cell program. By running fuser with the -u option, you

    can get the number of programs using the file system along with

    the name of the person using those programs. For example:


    ```

    /usr/sbin/fuser -u /home

    /492r(nwells) 503r(nwells)

    504r(nwells) 508r(nwells) 580r(nwells)

    581r(nwells) 585r(nwells) 586r(nwells)

    598r(nwells) 599r(nwells) 601r(nwells)

    879r(nwells) 1287r(nwells)

    ```'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# 232 Part IV: Maintaining Your System


    Here you can see that nwells has a series of programs using the home file system.
    If you want to see what those programs are, then you can use the ps command, which
    shows the numbers and names of the processes running in the system:


    ```

    ps ax |grep 601

    601 pS  0:00 /opt/applix/applix

    ```


    We ran ps ax to see all the processes in the system in extended mode so that you
    can see additional information about them instead of just their names. Then, by
    using the grep command with the process number 601 as an argument, we isolated
    one line from the output of the ps command. You can see that the program running
    is the /opt/applix/applix program. This program is just one of the processes that
    you have to shut down to unmount the root file system.


    By repeating the ps and grep commands, but substituting other process numbers
    for 601, you can see all the processes and know which programs to quit down. You
    can then ask the people running those processes to quit them, or you can use the
    kill function of fuser on the file system:


    To use the kill function of fuser, simply use the -k flag on fuser when you list
    the file systems you''re trying to unmount. For example:


    ```

    fuser -ku /home

    ```


    kills all the processes that are using the home file system for any reason.


    After all the processes are shut down and no one else is using the file system,
    you can unmount the file system.


    # Configuring file systems


    Mounting all file systems manually every time you boot the system can quickly
    become annoying. To avoid manually mounting file systems, you can have the system
    execute the required mount commands when you boot up. The information needed to
    execute the required mount commands is in the standard OpenLinux file system configuration
    file located at /etc/fstab. The entries in the file usually follows this format:


    ```

    block-special-file mount-loc type opts dump-freq passnumber

    ```


    in which


    +   - block-special-file is the name of the special file where the file system
    resides. This must be the device name for a block device, such as /dev/hda1 for
    the first partition on an IDE drive.'
