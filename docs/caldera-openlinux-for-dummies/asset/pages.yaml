    # Setting up simple appointments


    You can set up an appointment in the daily-schedule calendar by following these
    steps:


    +   - Right-click the hour of the day when you want the appointment scheduled,
    and then choose New Appointment from the pop-up menu that appears.

    - A New Appointment dialog box appears, as shown in Figure 12-2.

    - Type a name for the appointment in the Summary field.

    - Set the Start Time and the End Time in the Appointment Time section.'
