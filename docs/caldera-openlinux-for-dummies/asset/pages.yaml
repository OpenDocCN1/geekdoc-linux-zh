  md: '# About the Author


    Jon "maddog" Hall is the Executive Director of Linux International, a vendor organization
    dedicated to promoting the use of the Linux OS. He has been in the computer industry
    for over a quarter century. While working for DEC, "maddog" met Linus Torvalds,
    and Linux entered and changed his life, mostly by providing him with 22-hour workdays.
    You usually can find Jon speaking at various Linux conferences and events, and
    he has also been known to travel long distances to speak to local Linux-user groups.


    Nicholas Wells is a full-time author and training consultant who has written numerous
    titles on Linux, Linux applications, and related Internet subjects. His work for
    IDG Books Worldwide, Inc., includes Linux Web Server Toolkit and OpenLinux Secrets.
    He has a degree in linguistics (which, sadly, is rarely used) and an MBA (which,
    fortunately, is rarely used). Nicholas has worked in the software industry since
    1980 at companies like Novell and, most recently, as a director at Caldera Systems.
    He trains, consults, and writes from his home in Utah.'
