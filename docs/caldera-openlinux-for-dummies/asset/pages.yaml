  md: '# Chapter 13: File System Management


    # # Making the file system


    Every disk partition is simply an empty space with a beginning and an ending.
    Unless the partition is being used for swap space, you have to put some type of
    file system on the partition before the partition can become useful. The mkfs
    (for make file system) command is used to create the file system on the partition.
    Normally, the file system is a native OpenLinux file system, which at this time
    is called ext2. The OpenLinux version of mkfs has been nicely streamed and requires
    hardly any input. To create a file system on the disk-drive partition sdal, for
    example, you enter the following command:


    ```

    mkfs -t ext2 /dev/sda1

    ```


    If you want to create an MS-DOS file system on the disk partition, you use this
    command:


    ```

    mkfs -t msdos /dev/sda2

    ```


    You can continue to execute mkfs commands to create file systems for your new
    disk. Or you can leave some partitions without file systems (for future use),
    as long as you remember to perform the mkfs command on the partitions before attaching
    them to your file system by using either the mount command or the /etc/fstab table.


    Congratulations! Your disk has been physically added to your system and partitioned,
    and you have added file systems to the hard disk. Now the hard disk is ready to
    join the rest of the file system — simply use either the mount command or the
    /etc/fstab file, which we describe earlier in this chapter.


    # # Living with Floppy Disks


    Floppy disks are treated a little differently than hard disks, mostly due to their
    size and fragility. Floppy disks normally are not mounted and used for hours and
    days to hold gigabytes of data. More often, floppy disks are used to transfer
    data to other computers or to back up a few files.


    Although you can create OpenLinux file systems on floppy disks, using floppy disks
    in other ways is more advantageous:


    +   - Floppy disks can be mounted as DOS file systems, which can then be accessed
    with the standard OpenLinux utilities, such as cp and ls.


    +   - Floppy disks can be used as raw devices with commands, such as tar and cpio.


    +   - Floppy disks can permit the use of special utilities that read and write
    to disks.'
