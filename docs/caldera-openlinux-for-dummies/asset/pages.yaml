  md: '# 116 Part III: Using OpenLinux


    # Files 101


    A file is a collection of information with a distinct identification made up of
    a filename and a location (called a directory path) that houses the file. OpenLinux
    can store many files in the same directory — as long as the files have different
    names. OpenLinux can also store files with the same name in different directories.


    Confused? An example may help. Suppose you get a grand idea and decide to keep
    your idea in a file named idea in your directory called /wonderful. Now suppose
    you''re having a very fertile day and come with another idea. Now you want to
    keep your second idea in the /wonderful directory, then you use a different name,
    such as /wonderful/idea2. (Hope your ideas are more original than ours.) You also,
    can keep the file in another location — called, perhaps, the /bizarre directory.
    If you decide to keep your second idea in /bizarre, you can call it idea, and
    the filename becomes /bizarre/idea. OpenLinux sees this file and the /wonderful/idea
    file as different files. Remember, that each directory may contain only one file
    with the same name.


    OpenLinux filenames can be as long as 256 characters. They can contain uppercase
    and lowercase letters (also known as mixed case), numbers, and special characters,
    such as the underscore (_), the dot (.), and the hyphen (-). Because OpenLinux
    filenames can be made of unique case names — and each name is distinct — we call
    these names sensitive. For example, the names FILENAME, filename, and FileNameName
    are unique filenames of different files; on some systems (such as Compaq''s OpenVMS),
    however, they''re read back as the same file.


    > TECHNICAL STUFF




    > Although filenames can technically contain wildcard characters, such as the
    asterisk (*) and the question mark (?), using wildcard characters isn''t a good
    idea. Various command interpreters, or shells, use wildcards to match several
    filenames at one time. If your filenames contain wildcard characters, you''ll
    have trouble specifying only those files. We recommend that you create filenames
    that do not contain spaces or other characters that have meaning to shells.


    # The File Manager


    The easiest way to work with files in OpenLinux is by using KDE File Manager,
    which is also called kfm (for KDE File Manager). You can open a File Manager window
    by choosing Home Directory from the KDE main menu or by clicking the home directory
    icon on the Panel (yes, the home directory icon is the one with a little house
    on it). Figure 8-1 shows a simple home directory window.'
  merge: -1
