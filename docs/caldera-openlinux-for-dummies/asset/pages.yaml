    # First, the conditions


    One series of commands is typically not used on the command line, typed in one
    line at a time, but only in a shell script to make decisions. These commands are
    flow control, or conditional, statements, and are found in many computer languages
    in different forms. The simplest one in the bash shell language is if. If the
    statement is usually written as follows:


    ```

    if list1

    then

    list2

    elif list3

    then

    list4

    elif list5

    then

    list6

    else list7]


    ```


    Seems ugly, doesn''t it? But it isn''t too bad. Note that overall it begins with
    if and ends with fi, which is the backward spelling of if. Who says computer programmers
    have no sense of humor?


    The list statements represent other shell commands, statements, and so forth,
    that should be tested to see whether they are true or false (list1, list3, and
    list5)(list2, list4, list6, and list7).


    So what are some examples of list statements? You see one in the next example,
    which is a test to see whether a file exists. In this case, the built-in function
    test sees whether a filename exists; if it exists, echo says so. You can'
