    # Text Editors


    OpenLinux comes with several different text editors. Text editors are programs
    that typically enable you to type and manipulate alphanumeric characters. Some
    text editors can do simple word-processing tasks, such as word wrap, but most
    editors cannot perform most word-processing functions, such as spell checking
    or italicizing text. In fact, a plain-text file can''t store information about
    text formatting, such as large fonts, bold, and italic. Plain-text files only
    store the characters that you type.


    Text editors are good for simple text-editing tasks and for writing simple or
    even complex programs. Most editors have built-in help functions, and or available
    online. In addition, you can find books about a few editors, such as vi(1) and
    emacs(1).


    In this section, we describe character-cell text editors and graphical-based text
    editors that are included with OpenLinux. We also mention some commercial text
    editors.


    # Character-cell text editors


    The editor-of-editors on all Linux systems is called vi(1), for visual editor.
    Believe it or not, vi is more visual than its predecessors. Written in the mid-1970s,
