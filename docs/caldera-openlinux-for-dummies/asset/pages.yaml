  md: '# 124 Part III: Using OpenLinux


    To find out what the cat command is all about, follow these steps:


    +   1. Make sure you''re in the /home directory.


    To go home, click your heels ... no, that''s another book. Type cd at the prompt,
    and then type pwd.


    +   2. Type cat at the command line, as in this example:


    ```

    cat

    ```


    The cursor moves to the next line, but nothing else happens because cat is waiting
    for you to input something.


    +   3. Type your input and press Enter, then type a few more lines.


    Here''s what we typed followed by what appears on the screen:


    ```

    Hi

    Hi

    What?

    What?

    Hev! How do I get out of this?

    Hey! How do I get out of the screen after you press Enter.

    ```


    Everything you type is repeated on the cat command, which deal, you say? We explain
    why this is useful in a moment.


    +   4. To get out of the cat command, press Ctrl+D. If you''re not at the beginning
    of a line, press Ctrl+D twice.


    Most UNIX and OpenLinux use Ctrl+D as ^D, which means end of file (EOF) to OpenLinux.
    When the cat command sees ^D, it assumes it''s finished with that line and moves
    to the next. If D is on a line, the cat command has no other input to move to
    and exits.


    ![](img/3c04420fbc1d01311e6031144afaecd2_149_0.png)


    We promised we''d explain the usefulness of the cat command. We always try to
    keep our promises, so here goes. The cat command is the perfect way to use the
    contents of files with other commands, or to copy information that you enter on
    the keyboard to a file. To do these things, you need to know three symbols:


    +   > is known as redirection of standard output. When you use >, you tell the
    computer "Capture the information that normally goes to the screen, create a file,
    and put the information in it."


    +   > is known as appending standard output. When you use this symbol, you tell
    the computer "Capture the information that would normally go to the screen and
    append the information to an existing file. If the file doesn''t exist, then create
    it.


    +   > is used to tell the computer "Take the information from the specified file
    and feed it to standard (also known as standard input)


    ![](img/3c04420fbc1d01311e6031144afaecd2_149_1.png)'
