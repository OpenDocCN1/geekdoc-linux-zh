  md: '# # Chapter 16


    # # Surfing the Web


    **In This Chapter**


    +   - Tailoring Netscape to suit you

    - Checking out Web pages

    - Getting and reading e-mail

    - Sending your first e-mail message


    Once upon a time a company called Netscape created a browser called Mozilla. Despite
    the fact that the company spelled the name Netscape, you were supposed to pronounce
    it *Mozilla*. Crazy, isn''t it? (We''re just going to use the names interchangeably
    (in this chapter). In any case, the browser was one of the best in the world (not
    the best), and the folks at Netscape made the browser even better by turning it
    over to the Open Source community.


    Over time, Mozilla not only surf the Web but also could read e-mail, gather files
    using the File Transfer Protocol (FTP), run simple programs using Java, and even
    read NetNews (a discussion group made up of thousands of categories on the Net),
    all through a single graphical interface.


    In this chapter, you set up Netscape Communicator for your system. Then, with
    the information from your ISP, you finally surf the Web and receive e-mail.


    # # Customizing Netscape Communicator


    Your Caldera OpenLinux for Dummies CD-ROM has a copy of Mozilla, which you can
    activate by typing the following from a Terminal Emulator window while KDE is
    running:


    ```

    netscape&

    ```


    Or, if you prefer to take it easy today, click the Netscape Communicator icon
    on the KDE Panel, or choose Communicator from the Internet submenu. A screen like
    the one in Figure 16-1 appears, and Mozilla is set free!'
  merge: -1
  pgno: 300
- img_proc: true
