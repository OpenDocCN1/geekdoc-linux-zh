  md: '# 162 Part III: Using OpenLinux


    In this case:


    +   1. bash creates a new environment in which to execute the ls command and determines
    what is standard input and standard output to the command. You can call this new
    environment child 1; the old environment is child 1''s parent.


    +   2. bash creates another new environment in which to execute the more command,
    child 2; and determines what is standard input and standard output to the more
    command. Because the * symbol is used between the ls -l * and the more command,
    the standard output of ls -l is attached to the standard input of the more command.
    The standard output of more is attached to the standard output of the parent bash
    shell. The parent shell is the one in which you type commands and information,
    and the standard output of original bash shell is the screen.


    +   3. bash expands * to match all the filenames in that particular directory,
    before.


    +   4. in the child 1 environment, bash searches the PATH environmental variable
    looking for a command called ls. The same process occurs for the more command
    in child 2.


    +   5. bash executes the ls command in the child 1 environment, passing to the
    command * argument and all the filenames expanded, as a result of using the *
    character in the command.


    +   6. more sees the output of ls -l * as its input and puts its standard output
    to the screen.


    +   7. After more runs, bash returns to the parent environment, throwing away
    all the side effects that occurred in the child 1 environment.


    +   8. more sees the end of its input from ls, puts the last of its data out to
    the screen, and terminates.


    +   9. bash returns to its parent environment, throwing away all the changes that
    may have been made to the child 2 environment.


    The original bash shell is called the parent, and the two new environments bash
    created are called children, or child 1 and child 2.


    Putting the standard output of one command into the standard input of the other,
    as was demonstrated with the command


    ```

    ls -l | more

    ```


    is called piping. The symbol is called — you guessed it — the pipe symbol.


