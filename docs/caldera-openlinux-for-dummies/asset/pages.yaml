    # Adding Elbow Room to Your System


    Sooner or later, you''re likely to want to add more hard-disk storage to your
    OpenLinux system to hold more programs, data, or to enable more users to log on.
    You usually increase storage by adding one or more hard disks to your system;
    each hard disk can have one or more disk partitions.


    A hard-disk partition is the basic file storage unit for OpenLinux. First you
    create the file systems on the disk partitions, and then you combine the file
    systems to form a single directory-tree structure. The directory-tree structure
    can be on one disk or spread across many.


    You can define hard-disk partitions when adding a new hard disk or a later time.
    In most cases, disk partitions are defined for you during your original OpenLinux
    installation. You may divide a disk into one, two, four, or more partitions, each
    of which may contain a file system or be used as a swap partition. Swap partitions
    allow very large programs or small programs to run even if they take up more memory
    than you have RAM in your computer. The total of all swap partitions and RAM is
    called virtual memory.


    After you create a hard-disk partition, you must create a file system. The file
    system occupies a single space on the disk that has a unique block-specialfile
    (device) name. This unique name accesses the file system, regardless of whether
    the data is stored on all or only part of a physical disk or is an aggregation
    of multiple physical disks.'
