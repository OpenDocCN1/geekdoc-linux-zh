    In This Chapter


    +   - Starting OpenLinux

    - Logging in to OpenLinux

    - Setting up your Desktop

    - Creating a user account

    - Updating a password

    - Stopping OpenLinux


    After you''ve loaded OpenLinux on your computer system (see Chapters 4 and 5),
    the software eagerly awaits its first chance to show off for you. But wait! Logging
    in to OpenLinux the first time is a little more complicated than you think. And
    after you''re in OpenLinux, you face all sorts of questions about how you want
    the graphical interface to appear.


    Granted, the graphical interface questions are easy ones. This chapter leads you
    through them nonetheless, and explains how you can add accounts for different
    users and change passwords. And when you''re ready to quit OpenLinux, we show
    you how to stop gracefully but completely.


    # Giving OpenLinux the Boot


    Are you ready to boot OpenLinux? Here goes:


    +   1. Make sure everything is turned off.

    2. Turn on all peripheral devices, such as a printer and a scanner.

    3. Turn on the power to the monitor (if separate from the main system box).'
