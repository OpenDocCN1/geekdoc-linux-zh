  md: '# Appendix A

    Hardware Compatibility


    The version of OpenLinux on the Caldera OpenLinux For Dummies CD-ROM supports
    a wide range of hardware but, like any other Linux product, it doesn''t support
    all types of hardware.


    To learn what hardware OpenLinux supports, you can visit the Caldera Systems Web
    site (www.calderasystems.com) or check out the voluminous documentation on your
    accompanying CD-ROM. The Caldera Web site includes a comprehensive list that''s
    updated as new hardware is released for OpenLinux. The information in this appendix
    provides a list of many hardware options (including a few to avoid), but it doesn''t
    list all the latest hardware devices — many of which you can use with Linux. Still,
    having everything on a Web site doesn''t help you if you''re not connected to
    the Net at the moment. Also, writing down things on paper is nice once in a while,
    for reference. For these reasons, we provide this appendix.


    ![](img/3c04420fbc1d01311e6031144afaecd2_336_0.png)


    ![](img/3c04420fbc1d01311e6031144afaecd2_336_1.png)


    We make every attempt to present correct material in this appendix based on what
    Caldera Systems, Inc., believes to be the hardware currently supported by OpenLinux
    2.3. Problems still may occur, however. In addition, new hardware is introduced
    all the time, and some of the new hardware that may work with OpenLinux may not
    be listed.


    After you have your system running, review of the hardware HOWTOs located in the
    directory /usr/doc/HOWTO to see whether any other hardware is listed that you
    may want to use in your OpenLinux system.


    # Hardware Architectures


    OpenLinux runs on a variety of hardware architectures. These architectures are
    usually defined by the model name of the main CPU''s manufacturers, such as the
    Intel architecture, the Alpha (Compaq) architecture, and the SPARC (Sun) architecture.
    This book and this CD-ROM cover only the Intel architecture, which includes AMD
    and Ryzen CPUs all the way to the x386 configurations to the class of CPUs for
    the Pentium II.


    In addition to the hardware architecture of the CPU, you have to consider the
    bus structure. A bus is made up of electrical paths, wires, and sockets that transmit
    electrical impulses to and from the CPU.


    ![](img/3c04420fbc1d01311e6031144afaecd2_336_2.png)'
  merge: -1
  pgno: 336
- img_proc: true
  md: '# 312 Part VII: Appendixices


    ISA, EISA, VLB, and PCI buses have been around a long time and are all supported
    in OpenLinux. Although the Microchannel bus has support in the OpenLinux kernel,
    OpenLinux does not support Microchannel by default, although if you''re brave
    you can try to add this support by recompiling the kernel. Most modern systems
    are PCI-based, with one or two ISA slots for backward compatibility.


    In addition, the AGP bus is supported as a graphics-card interface. The number
    of video cards available for AGP and supported under OpenLinux continues to grow.
    In addition to the information provided in this appendix, you may want to check
    the Caldera System site or the XFree86 Web site (www.xfree86.org) to learn about
    additional AGP cards that are supported by the standard XFree86 software in OpenLinux.


    The combination of the CPU architecture and the bus structure loosely be termed
    the motherboard (often pronounced "motherboard"). If OpenLinux doesn''t work on
    your system and you suspect that the motherboard is the problem,check with the
    motherboard''s manufacturer to see whether it has a newer BIOS (the code that
    ties the CPU to the bus structure and devices).


    # Laptops


    Laptops and OpenLinux are problematic for a few reasons. Although newer laptops
    have hard disks and memory large enough to accommodate OpenLinux easily, laptop
    manufacturers continue to use the newest electronics in an effort to make laptops
    faster, smaller, and cheaper. That''s great, except that the newest hardware may
    not support yet from OpenLinux.


    The greatest ongoing problem with laptops is that the video chipset used by many
    laptop manufacturers is not recognized and configured easily by the OpenLinux
    installation program. Some of these chips — are not supported. Other peripheral
    can also cause problems. PCMCIA SCSI drives and CD-ROM interfaces — make again
    common on older laptops — can make installing OpenLinux a challenge.


    Many older laptops had swappable floppy disk drives and CD-ROM drives. You couldn''t
    have both devices in the machine at the same time. The CD-ROM drives also weren''t
    bootable in many cases. The manufacturers obviously weren''t thinking of anyone
    who might want to install a new operating system. A system without both a floppy
    drive and a CD-ROM drive makes it impossible to start the installation program
    from a boot floppy and then install OpenLinux from the CD-ROM. I''ve spent hours
    figuring out how to circumvent the limitations of these early systems by using
    network connections, additional peripherals, or even a different laptop.


    ![](img/3c04420fbc1d01311e6031144afaecd2_337_0.png)'
  merge: -1
  pgno: 337
- img_proc: true
  md: '# SMP Systems


    The kernel on the CalderaOpenLinux For Dummies CD-ROM supports symmetrical multiprocessors
    (SMPs), although this support isn''t enabled by default (it requires you to recompile
    the Linux kernel). in OpenLinux 2.3, support is limited to either two or four
    CPUs.


    # Memory


    All memory typically found in PC computer systems works with OpenLinux. However,
    when your system has large amounts of main memory, you may have to add the following
    to the /etc/liio.conf file, depending on how smart your BIOS is:


    ```

    append="mem=<number of Mb>"

    ```


    In any case, if OpenLinux is having trouble seeing all the memory that you use,
    use a line like the one shown here. (For a machine with 256MB of memory, for example,
    add the following line below the line with the name that''s used to start the
    OpenLinux operating system — this line usually contains the text label-linux):


    ```

    append="mem=256M"

    ```


    # Video


    In character-cell mode, OpenLinux works with all video cards. Therefore, at a
    minimum, you are able to get your system up and running. Likewise, most cards
    work in VGA or SVGA mode, so you are able to have KDE running, although KDE could
    be a little slow and course-grained with huge icons and little space in which
    to maneuver.


    As a general rule, both the earliest and the latest models of video cards were
    not supported. Early video cards were obsolete before OpenLinux was introduced,
    and Free86 (the people who provide most of the support for the video cards) never
    had time to retrofit support. The latest cards often are not supported right away
    because getting the code ported to the video card takes time and effort. But with
    help from vendors, lead times are becoming.


    Accelerated cards and unaccelerated cards also are available. Accelerated cards
    typically work faster than unaccelerated cards because the software can take advantage
    of the capability of the hardware to display the images more quickly.'
  merge: -1
  pgno: 338
- img_proc: true
