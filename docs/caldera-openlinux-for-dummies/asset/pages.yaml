    # Making Your Own Rules


    You, as the owner of a file, you can specify permissions for reading, writing
    to, or executing a file. You can also determine who (yourself, a group of people,
    or everyone in general) can do these actions on a file. What do these permissions
    mean? Read on (you have our permission):


    +   - Read for a file enables you to read the file. For a directory, read permission
    allows the ls command to list the names of the files in the directory. You must
    also have execute permission for the directory name to use the -l option of the
    ls command or to change that directory.


    +   - Write permission for a file means you can modify the file. For a directory,
    you can create or delete files inside that directory.


    +   - Execute permission for a file means you can type the name of the file and
    execute it. You can''t view or copy the file unless you also have read permission.
    This permission means that files containing executable OpenLinux commands, called
    shell scripts, must be both executable and readable by the person executing them.
    Programs written in a compiled language, such as C, however, must have executable
    permissions to protect them from being copied where they shouldn''t be.


    For a directory, execute permission means that you can change to that directory
    (with cd). Unless you also have read permission for the directory, ls -l won''t
    work. You can list directories and files in that directory, but you can''t see
    additional information about the files or directories just by doing an ls command.
    The requirement to have execute permission to see file information may seem strange,
    but it''s useful for security.


    The first character of a file permission is a hyphen (-) if it''s a directory
    or d if it''s a file. The nine other characters are read, write, and execute positions
    for each of the three categories of file permissions:


    +   - Owner (also known as the user)


    +   - Group


    +   - Others'
