  md: '# 20 Part I: Introducing OpenLinux


    # Different Linux systems are ...well . . different!


    To describe other Linux distributions in depth would take a lot of space, but
    the following information gives you some idea of what the Linux world contains,
    besides the OpenLinux product that you hold in your hands.


    Red Hat Software (www.redhat.com) is an early distribution from a collaboration
    of three Linux enthusiasts who were later joined by ACC, Red Hat''s largest distributor.


    One of the early distributions was the Yggrasil distribution. After an easy installation,
    Yggrasil started X Window System, displayed some mpeg videos, and croaked "Hello"
    to the computer console.


    S.U.S.E. GmbH (www.suse.com) is a German firm (with offices in California) that
    puts out its own distribution in German and English. S.U.S.E. GmbH also carries
    other people''s distributions and products.


    Another distribution was Slackware. Distributed and still maintained by Patrick
    Volkering and various resellers, as Walnut Creek CD-ROM (www.cdrom.com), Slackware
    is divided into packages that are copied onto others from the Net or a CD-ROM.
    You can contact the Slackware people directly at www.slackware.com.


    InfoMagic (www.infomagic.com) puts out a collection of Linux distributions, as
    well as Linux products.


    Pacific HiTech, Inc. (www.pht.com) is a company that provides translated copies
    of Linux, including Japanese and Chinese translations. Pacific HiTech recently
    changed its name to Turbo Linux and started selling specialized high-end Linux
    servers.


    The Debian (www.debian.org) distribution was put together by a group of volunteers,
    who now distribute Debian over the Internet and on CD-ROM.


    OpenLinux is one of many Linux distributions, and many Linux applications are
    available as well. These distributions differ widely in cost, appearance and legal
    ramifications. A Linux application may be classified as any of the following,
    depending on the author/owner''s decision:


    +   - Freely available software


    +   - Shareware


    +   - Commercial applications


    Freely available software is available for free use by the end user. Although
    software may be freely available, such software is often not the same as public
    domain (or software you can do absolutely anything with no one owns it). Freely
    available software is often owned and copyrighted by the author or authors, who
    then allow people to use their software or make modifications to it. Many different
    licenses are used with freely available software. The best known license for free
    software is the General Public License (the GPL), also called OpenSource software
    (see www.fsf.org and www.opensource.org).'
