  md: '# 68 Part II: Installing OpenLinux


    # It''s a small, small world


    Different countries have different keyboards. OpenLinux, like many UNIX systems,
    has a keyboard-mapping feature that enables you to use the system with different
    keyboards.


    If you''re not in the United States, you''ll probably choose something other than
    the U.S. keyboard (unless you bought your system in the United States). If you
    don''t see an obvious choice, choose a keyboard that looks close and test the
    one you''ve selected in the Test field. If keyboard seems to work, finish the
    installation. After the installation, you can change the keyboard mapping if necessary
    with /usr/sbin/kbdconfig command.


    The Select Screen in the OpenLinux installation lists the keyboard maps available
    for the system. If you''re in the United States, you''ll probably choose the U.S.
    option. Even then, however, you may have a different keyboard than the U.S. keyboard,
    or browsing through the list to see what else is offered worthwhile.


