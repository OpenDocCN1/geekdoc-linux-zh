  md: '# 192 Part III: Using OpenLinux


    # Come in, Mission Control


    KDE provides a Control Center that lets you configure most features of your environment.
    You can access the Control Center by clicking the Control Center icon on the Panel
    (the icon looks like a screen with a computer board on top of it) or just Control
    Center from the main menu.


    This section focuses on using the Control Center to set options, but you also
    use the Settings submenus of the main menu. The areas of the Control Center that
    we describe correspond to submenus and menu items under Settings on the main menu.


    ![](img/3c04420fbc1d01311e6031144afaecd2_217_0.png)


    Figure 11-8 shows the initial Control Center display. To work with options in
    the Control Center, click the plus sign to the left of a section name. A list
    of items in that section appears. Click one of the items to begin configuring
    item. One or more pages (with a tab at the top for each page) appears in the right
    side of the Control Center window.


    ![](img/3c04420fbc1d01311e6031144afaecd2_217_1.png)


    Figure 11-8: The KDE Control Center configures features of KDE. Background settings


    After, you''ve selected an item to configure on the left side of the Control Center,
    several buttons appear at the bottom of the Control Center window.'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# Chapter 11: Windows on the World


    +   - Help: Opens an online help screen for the configuration information that
    you''re viewing.


    +   - Default: Resets the current configuration screen to its default settings.

    (Note: This may not work for all configuration options.)


    +   - OK: Applies the configuration that you''ve made and returns to the original
    Control Center screen (shown in Figure 11-9).


    +   - Apply: (activates) the configuration that you''ve made and leaves the configuration
    options displayed so that you can make other changes.


    +   - Cancel: Ignores the changes that have been made on the current screen and
    returns to the original Control Center screen (shown in Figure 11-9).


    KDE supports hundreds of configuration options, most of which you can access from
    the Control Center. We describe only the most important — those we think you''ll
    want to set up for yourself. You can explore other options by looking at the pages
    that we don''t use. Use the Help button or experiment to see what you can do!


    # KDE configuration files


    The information that you''re configuring in the KDE Control Center is stored in
    plain-text configuration files in the KDE directory. If you want to explore these
    files to see how KDE works behind the scenes, try looking at files, such as kwmarc
    and kpanelrc, in the /opt/kde/share/config directory.


    Each configuration file applies to a single application. Most of the files end
    with the letters rc, for resource configuration. You can use any text editor to
    alter these configuration files (after making a backup copy of the first one,
    just in case a problem occurs). The format of the configuration files is straightforward
    and will be obvious to you as you explore each file. Be certain to try things
    one at a time so that you don''t make the application unusable by choosing strange
    options.


    The files in /opt/kde/share/config directory apply to all users on the system.


    root user can set up these configurations for all users on the OpenLinux system.
    But each user can also have an individual configuration. These configuration files
    are stored in the .kde/share/config directory (note that the .kde directory is
    a hidden directory and starts with a period). If KDE finds a configuration file
    in a user''s home directory, these settings override the main KDE configuration
    files. For example, each user will probably use a preferred color scheme and wallpaper.
    Because these features are stored in the .kde/share/config directory (in the desktoprc
    and others with similar names), the files in /opt/kde/share/config are not consulted
    at all. If no configuration file is included for an application in the user''s
    home directory, then the system-wide configurations are used.


    ![](img/3c04420fbc1d01311e6031144afaecd2_218_0.png)'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# 194 Part III: Using OpenLinux


    # Where do you want it?


    The basic parts of your KDE Desktop can be positioned in several locations to
    fit your preferences. To set the location of the Panel and the Taskbar, open the
    Applications section of the Control Center and choose Panel. Four tabs appear
    on the right side of the Control Center. The Panel tab (shown in Figure 11-9)
    lets select a location for the Panel and the Taskbar.


    ![](img/3c04420fbc1d01311e6031144afaecd2_219_0.png)


    Figure 11-9: Configure the location of the Panel and the Taskbar in


    The Panel can be on the top, bottom, left, or right side of the screen. The Panel
    style can be Tiny (using smaller, half-height icons), Normal (as it appears by
    default), or Large. The Large option uses the same icons as the Normal option
    but places the icon in a larger box (which is useful if you have a 1600 x 1200
    resolution screen). Select a size option in the Style section of the Panel tab.
    You can see what your selection looks like by choosing Apply.


    The Taskbar can be on the Top or Bottom of the screen or in the top-left corner
    of the screen, in which case the buttons are stacked, as shown in Figure 11-10.


    You can also hide the Taskbar, which gives you more room for windows on the desktop.
    Like the Taskbar, the Panel can be hidden — sort of. Click the arrow that appears
    at either end of the Panel to slide the Panel off that side of the screen. Click
    the arrow a second time to make the Panel reappear.'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# Chapter 11: Windows on the World


    ![](img/3c04420fbc1d01311e6031144afaecd2_220_0.png)


    The Options tab has a setting to hide the Panel or Taskbar automatically after
    a time, then replays the hidden feature whenever the mouse is moved to edge of
    the screen.


    # When one application window is never enough


    Imagine that you have four sets of windows all layered on top of the KDE background
    (the desktop itself, also called the root window). You don''t want to switch between
    individual program windows; you want to switch between sets of program windows.
    What do you do?


    Here''s where the virtual desktops come in. KDE virtual desktops let you choose
    which of these sets of windows to view and then allows you to rapidly switch between
    them. For example, on the first virtual desktop you may have a full-screen Web
    browser; on the second, an e-mail reader; on the third, a word processor; and
    on the fourth, a command-line window for trying new Linux commands that you''ve
    read about.'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# 196 Part III: Using OpenLinux


    # Naming your desktops


    The Desktops tab (shown in Figure 11-11) lets you set up how virtual desktops
    you want to use and name each desktop. To change the number of desktops, move
    the Visible slider. The number of desktops changes in increments of two, or up
    to. By default, these desktops are labeled One, Two, Three, and Four (and so on,
    if you''ve configured additional virtual desktops).


    Figure 11-11: The Desktops tab lets you set the number and name of your KDE virtual
    desktops.


    ![](img/3c04420fbc1d01311e6031144afaecd2_221_0.png)


    You can configure the appearance of the panel here


    For any of the desktops, click the name field and enter text to set a name. The
    Width slider below the name fields determines how wide the button is on the Panel
    for each of the desktop buttons. You can save space on the Panel for program icons
    by naming your desktops 1, 2, 3, and 4, making the Width very small. Or, you can
    use descriptive names, such as “Word processing,” to name your desktops and make
    the Width large.


    > A short set of names — such as e-mail, browse, xterm,ing — can be descriptive
    without taking up a lot of space on your Panel. After you set up these labels,
    you quickly get in the habit of pressing Ctrl+F1 through Ctrl+F4 to switch rapidly
    among the desktops.


    Each desktop can have its own name, wallpaper background, and other configuration
    settings. After you''ve set up your desktops, you''ll want to switch between them
    so that you can use all the windows that you''ve opened on one.'
  merge: -1
