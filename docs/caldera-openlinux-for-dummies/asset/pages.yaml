  md: '# Chapter 4: Making Room for OpenLinux 63


    Creating the Install and Modules disks in Linux


    If you don''t have access to Windows but do have access to another Linux system,
    create the Install and Modules disks in Linux instead. To make the Install and
    Modules disks in Linux, you must be logged in as a user with permissions to write
    to the 3½-inch drive, which Linux refers to as /dev/fd0.


    To make the Install disk, follow these steps:


    +   1. Put a blank, formatted floppy in the floppy drive.


    +   2. Place the Caldera OpenLinux For Dummies CD-ROM into your CD-ROM drive and
    then mount the Linux CD (connecting to the rest of the file system)


    You can do this by typing a command, such as the following (the exact command
    depends on how the Linux system is configured — this command works on an OpenLinux
    system):


    ```

    /mnt/cdrom

    ```


    +   3. Change to the location of the floppy information on the CD by typing cd
    /mnt/cdrom/col/launch/floppy


    +   4. Type the following command to copy the disk image from the CD to the floppy
    disk.


    ```

    dd if=install.144 of=/dev/fd0

    ```


    After the floppy-disk-drive light goes out, you''re ready to make the Modules
    disk.


    +   5. Place the second blank disk in the floppy drive and then type this command:


    ```

    dd if=modules.144 of=/dev/fd0

    ```


    +   6. After you''ve finished making the floppies, dismount the CD-ROM so that
    it can be ejected by typing these commands:


    ```

    cd

    /mnt/cdrom

    ```


    Wait until the floppy-disk-drive light goes out before removing the floppy disk.
    Now you''re ready to install the OpenLinux operating system, so turn to Chapter
    5 and get started!


    ![](img/3c04420fbc1d01311e6031144afaecd2_88_0.png)'
