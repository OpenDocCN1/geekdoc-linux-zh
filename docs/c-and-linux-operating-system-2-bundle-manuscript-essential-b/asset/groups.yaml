- md: "\nmore likely to know where you succeed or where you went wrong.\n\nThese comments\
    \ can be as simple or as complex as you would like. Some people will just place\
    \ in one or two words if that is all that is needed to help out the other users,\
    \ but there are other times when you are going to need combine a few more lines\
    \ into the mix to ensure that it is all going to work out and that the other person\
    \ understands what is going on inside of the code.\n\nIn this language, you will\
    \ just need to use the // symbol in order to show that you are writing out a comment.\
    \ You can make it as long as you would like, just make sure that when the comment\
    \ is done, you skip to the next line so that the program knows that it is supposed\
    \ to start reading through it again.\n\nThe program is going to stop reading after\
    \ the // and it is not going to affect the way that the program works. Other programmers\
    \ who look at the code will see the comments that you write, but when the program\
    \ is executed, these comments are going to be skipped. You can add in as many\
    \ as you would like to your program, but do try to keep them a bit limited because\
    \ it can start to clog up the code and make it hard to read and understand.\n\n\
    Program comments are basically the statements that are inside the code. The statements,\
    \ or comments, are going to be there to help others who use your code understand\
    \ what the purpose of each function is. All program languages allow for some type\
    \ of comments, but they do not allow all of the kinds of comments that are out\
    \ there. The most common to use is a single line comment. This is what all program\
    \ languages allow for. These comments are simple explanatory lines that tell the\
    \ next reader what the purpose is in a simple sentence.\n\nThere are also multiple\
    \ line comments. This is one that very few program languages allow for. C++ is\
    \ one of those few languages. Sometimes you have a more complex explanation, and\
    \ it needs to span over more than one line. This is possible to do in C++.\n\n\
    When you are using a single line comment, you will see that it is written out\
    \ in the code with // and can go all the way to the end of your line.\nAn example\
    \ of this is:\n\n```\n{\n  cout << \"that's great\" >> //prints that's great\n\
    \  return 0\n}\n```\n\nwill have the final output of \"that's great\" and nothing\
    \ else. The comment is ignored by the compiler so that you can let other programmers\
    \ in on what the code is for, or what you need done do to the code.\n\nHowever\
    \ if you are trying to get some help on a code, you should use a multi line comment\
    \ so that you can easily get the best out of your complicated code. Multi line\
    \ comments are surrounded by these symbols /* */. Typed out like that almost looks\
    \ like an emoji. For example\n\n```\n/* I need help making the puppet dance*/\
    \ is a comment. However, that is still a single line comment still. A better example\
    \ would be\n/* I need help making the puppet dance\n*All he does at this point\
    \ is sway from side to side */\n```\n\nThat would be a multi line comment. As\
    \ you can see, when you start a new line you should put the asterisk at the beginning\
    \ to indicate to the program that you are still writing a comment and that the\
    \ next line is indeed whitespace. When compiled it will ignore the comments and\
    \ only show what you want it to show.\n\nWhile you can mix the comment styles,\
    \ it is best to keep them separated for now, until you get the hang of everything.\n\
    \n# Data Types\n\nYou have to use different variables when you are writing a program\
    \ using any language. These are nothing more than just reserved memory values\
    \ that store locations in some space in the memory of the compiler. The above\
    \ list of reserved keywords are useful here as well. While there are a lot of\
    \ keywords, there are seven basic keywords that define data types.\n\n| Type |\
    \ Keyword |\n| :--- | :--- |\n| Wide character | Wchar_t |\n| Valueless | Void\
    \ |\n| Double floating point | Double |\n| Floating point | Float |\n| Integer\
    \ | Int |\n| Character | Char |\n| Boolean | bool |\n\nMost of the data types\
    \ that you can use can be modified using one of these following modifiers to help:\n\
    \n- Long\n- Short\n- Unsigned\n- Signed\n\n# Variable Types Cont...\n\nWhen you\
    \ are using variables inside of a coding language, you are providing some storage\
    \ space that makes it easier for the program to manipulate. All of the variables\
    \ that you use will be attached to a different type and these types are going\
    \ to determine the layout and the size of the memory of the variable. It is also\
    \ going to set a range of values that you are able to store on this memory space.\n\
    \nNaming the variable is going to be similar to naming the identifier. You will\
    \ only be able to name it with a letter or an underscore and the letters are going\
    \ to be case sensitive. But after that, you are able to use any type of digit,\
    \ letter, and character that you would like.\n\nAgain, the basic variables that\
    \ you will be able to use here here in more detail include:\n\n- Wchart_t: this\
    \ is the wide character type.\n- Void: this is going to represent the absence\
    \ of a type\n- Double: this is a floating value that will have double precision.\n\
    - Float: this is a floating point that is going to have single precision.\n- Int:\
    \ this is an integer\n- Char: this is often going to be just one byte and is a\
    \ type of integer.\n- Bool: this is going to work with values that are either\
    \ true or false.\n\nYou can also define other types of variables. These are things\
    \ pointer, reference, enumeration, data structures, and classes.\n\n# Creating\
    \ a new line\n\nNow that you know the data types and modifiers, and all about\
    \ a comment in your program, it is time to learn how to create a line. This is\
    \ a problem that a lot of new programmers run into. If everything is all jumbled\
    \ together, then they would not be able to find anything very easily, now would\
    \ they?\n\nTo make the line break, you have to use endl; this will indicate that\
    \ you want a line, and you do not even have to add whitespace if you do not want,\
    \ though it is recommended because it makes your program easier to read for a\
    \ human.\n\nFor example, this:\n\n```\n{\n  cout << Try This;>> endl;\n  <<Today\
    \ I ate Pizza and did Math;>> endl;\n  <<6=(7-1);>> endl;\n  << That is what I\
    \ learned today;>> endl;\n  return 0\n}\n```\n\nLooks way better than this:\n\n\
    ```\n{cout << Try This;>> endl; << Today I ate Pizza and did Math;>> endl; <<6=(7-1);>>\
    \ endl; << That is what I learned today;>> endl; return 0```\n\nCan you see how\
    \ confusing that would get for someone reading the code? You want your code file\
    \ to be easy to read, so that if someone else has to fix something, they can easily\
    \ find where the mistake has been made. If everything is all jumbled together,\
    \ then they would not be able to find anything very easily.\n\nYou can also indicate\
    \ line breaks by using \\n This is the same thing as endl; but is a lot faster\
    \ to type. You can use whichever method you want but choose one and stick with\
    \ it.\n\n# The importance of the basics of C++\n\nI know what you are thinking,\
    \ why must you know all these nonsense tidbits of information when you are just\
    \ beginning, and the reason is, if you don't learn them now, you won't think that\
    \ you will need them in the future, and when you are reading a program that someone\
    \ else wrote, you will be wondering what all of those extra characters mean, and\
    \ why there is so much whitespace. Creating a habit of these simple yet somewhat\
    \ tedious tasks is paramount if mastering more complicated\n"
  mdcn: "\n更有可能知道你在哪里成功了，或者哪里出了错。\n\n这些注释可以根据你的意愿变得简单，也可以复杂。如果只需要一两个单词就能帮助其他用户，有些人只会写这么多；但在其他情况下，你可能需要结合更多几行内容，以确保一切正常运行，并让其他人理解代码内部正在发生什么。\n\
    \n在这种语言中，你只需要使用 `//` 符号来表示你正在编写注释。你可以将其写得尽可能长，只需确保在注释结束时跳到下一行，这样程序就知道该重新开始读取了。\n\
    \n程序在遇到 `//` 之后就会停止读取，这不会影响程序的运行方式。其他查看代码的程序员会看到你编写的注释，但当程序执行时，这些注释会被跳过。你可以在程序中添加任意数量的注释，但尽量保持适度，因为过多的注释可能会阻塞代码，使其变得难以阅读和理解。\n\
    \n程序注释基本上是代码内部的语句。这些语句（或注释）的作用是帮助使用你代码的人理解每个函数的作用。所有的编程语言都允许某种类型的注释，但它们并不允许所有种类的注释。最常用的是单行注释，这是所有编程语言都允许的。这些注释是简单的解释性行，用简单的句子告诉下一个读者其目的。\n\
    \n还有多行注释。这是极少数编程语言允许的类型。C++ 就是其中寥寥语言之一。有时你需要一个更复杂的解释，并且需要跨越多行。这在 C++ 中是可以实现的。\n\
    \n当你使用单行注释时，你会看到它在代码中用 `//` 写出，并且可以延伸到行尾。\n示例如下：\n\n```\n{\n  cout << \"that's\
    \ great\" >> //prints that's great\n  return 0\n}\n```\n\n最终输出将是 \"that's great\"\
    \ 而没有其他任何内容。编译器会忽略注释，这样你可以让其他程序员了解代码的用途，或者你需要对代码进行什么操作。\n\n然而，如果你试图就某些代码寻求帮助，你应该使用多行注释，以便能够轻松地利用你复杂的代码。多行注释被\
    \ `/* */` 符号包围。这样打出来看起来像像表情符号。例如\n\n```\n/* I need help making the puppet dance*/\
    \ 是一个注释。然而，这仍然是一个单行注释。更好的例子是\n/* I need help making the puppet dance\n*All he\
    \ does at this point is sway from side to side */\n```\n\n这就是多行注释。如你所见，当你开始新行时，应该在开头放置星号，以指示程序你仍在编写注释，并且下一行确实是空白。编译时，它将忽略注释并只显示你想让它显示的内容。\n\
    \n虽然你可以混合使用注释样式，但在掌握一切之前，最好将它们分开。\n\n# 数据类型\n\n在使用任何语言编写编写程序时，你必须使用不同的变量。这些变量无非仅仅是预留的内存值，它们存储在编译器内存中某些空间的位置。上述的预留关键字列表在这里很有用。虽然有很多关键字，但有七个定义数据类型的基本关键字。\n\
    \n| 类型 | 关键字 |\n| :--- | :--- |\n| 宽字符 | Wchar_t |\n| 无值 | Void |\n| 双精度浮点 | Double\
    \ |\n| 浮点 | Float |\n| 整数 | Int |\n| 字符 | Char |\n| 布尔 | bool |\n\n你可以使用的大部分数据类型可以使用以下修饰符之一进行修改以帮助：\n\
    \n- Long（长型）\n- Short（短型）\n- Unsigned（无符号）\n- Signed（有符号）\n\n# 变量类型续\n\n当你在编码语言内部使用变量时，你提供了一些存储空间，使得程序更容易操作。你使用的所有变量都将关联到不同的类型，这些类型将决定变量内存的布局和大小。它还将设定你在这个内存空间上能够存储的值范围。\n\
    \n变量命名与标识符命名相似。你只能用字母或下划线命名，且字母是区分大小写的。但在此之后，你可以使用任何种类型的数字、字母和字符。\n\n再次，你在这里可以使用的基本变量的详细信息包括：\n\
    \n- Wchart_t：这是宽字符类型。\n- Void：这代表类型的缺失。\n- Double：这是一个具有双精度的浮点值。\n- Float：这是一个具有单精度的浮点数。\n\
    - Int：这是一个整数。\n- Char：这通常只是一个字节，是整数的一种类型。\n- Bool：这适用于真或假的值。\n\n你还可以定义其他类型的变量。这些是指针、引用、枚举、数据结构和类。\n\
    \n# 创建新行\n\n现在你已经了解了数据类型和修饰符，以及程序中注释的所有信息，是时候学习如何创建行了。这是许多初级程序员都会遇到的问题。如果一切都混杂在一起，他们就无法很容易地找到任何东西，不是吗？\n\
    \n要换行，你必须使用 `endl;`；这表示你想要换行，如果你不想，甚至不需要添加空格，尽管建议这样做，因为它会让你的程序对人类来说更容易读。\n\n例如，这个：\n\
    \n```\n{\n  cout << Try This;>> endl;\n  <<Today I ate Pizza and did Math;>> endl;\n\
    \  <<6=(7-1);>> endl;\n  << That is what I learned today;>> endl;\n  return 0\n\
    }\n```\n\n看起来比这个要好得多：\n\n```\n{cout << Try This;>> endl; << Today I ate Pizza\
    \ and did Math;>> endl; <<6=(7-1);>> endl; << That is what I learned today;>>\
    \ endl; return 0```\n\n你能看到这对于阅读代码的人来说会有多困惑吗？你希望你的代码文件易于阅读，这样如果其他人必须修复某些东西，他们就能轻松地找到错误发生的地方。如果一切都混杂在一起，他们就无法很容易地找到任何东西。\n\
    \n你也可以通过 `\\n` 来指示换行，这与 `endl;` 相同，但输入速度快得多。你可以使用任何喜欢的方法，但要选择一种并坚持下去。\n\n# C++\
    \ 基础的重要性\n\n我知道你在想，为什么在刚开始时就必须知道这些无意义的琐碎信息，原因在于，如果你现在不学习它们，你以后就不会认为自己会在未来需要它们，而当你阅读别人编写的程序时，你会好奇所有额外字符的含义，以及为什么会有这么多空白。养成这些简单但有些枯燥的任务的习惯，对于掌握更复杂的内容至关重要\n\
    \n"
