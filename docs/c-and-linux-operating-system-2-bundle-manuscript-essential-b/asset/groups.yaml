- md: "\nprogramming methods. Just like mastering any sort of language, you have to\
    \ master the basics to master the expert level concepts.\n\n## Variable definitions\n\
    \nA variable definitions instructs the compiler how much and where to store and\
    \ create the variable. It specifies the data type and lists one or more of the\
    \ variables of the type. For example\n\n```\ntype variable_list;\n```\n\nYou have\
    \ to have a valid data type that is listed above. They may contain one or more\
    \ identifier names as long as they are separated by commas, such as\n\n```\nint\
    \ j,k,l;\n```\n\n```cpp\nchar c,ch;\nfloat f, salary;\ndouble d;\n```\n\n\n\n\
    Each of these abbreviations instructs the compiler to create variables of that\
    \ type with those names. Variables can be assigned with an initial value, by indicating\
    \ such with an equal sign. For example\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main ()\n{\n    int j=10;\n    int k=5;\n    int l=j+k;\n    cout\
    \ << l << endl;\n    return 0;\n}\n```\n\nYou should get the answer 15\n\nYou\
    \ can also declare and define the variables in your program, but that is some\
    \ higher level stuff, so if you would like to look into it you can google search\
    \ a tutorial on that.\n\n## QUIZ\n\nHere is the set up. You should have one phrase,\
    \ a math problem, and then the answer to the math problem using said integers.\
    \ You can make up all of the variables yourself, whatever you want them to be.\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n    int\
    \ _ = _;\n    int _ = _ _;\n    int _ = _ + _;\n    cout << \" \" << endl;\n \
    \   cout << \" \" << endl;\n    cout << \"int_\" << _ << endl;\n    return 0;\n\
    }\n```\n\nSimply enter your digits in and make sure your numbers add up. After\
    \ you've done so, rerun the code without relying on copying and pasting the code\
    \ without the integers. This way, you'll have a basic understanding of variables\
    \ and playing with the basic integers operations within C++.\n\n## Chapter 4:\
    \ Arrays, Loops, and Conditions\n\nBelieve it or not, you've learned so much already.\
    \ The basics are really not that hard and now it's just about learning about a\
    \ few more things and putting concept after concept together to make sure you're\
    \ becoming a better C++ programmer. Let's keep going.\n\n### Arrays\n\nArrays\
    \ are a data structure in C++ that will be able to store elements that are basically\
    \ the same type and also a fixed size. Basically a collection of same type variables.\
    \ Instead of using the individual variables, you would declare one array of variables\
    \ such as numbers. To do this you use the numbers 0 to 99 and access each one\
    \ by an index of the array.\n\nArrays are going to be memory locations that are\
    \ continuous. The lowest is always the first element and then the highest element\
    \ is going to be the last.\n\n### Initializing arrays\n\nYou can initialize arrays\
    \ one by one or using a single statement. Example\n\n```cpp\ndouble balance[5]={1000.0,\
    \ 2.0, 3.4, 17.0, 50.0};\n```\n\nThe numbers that are found between the bracket\
    \ can't end up higher than the amount of elements that you are using. This means\
    \ that you cannot have six sets of numbers when your array title only specified\
    \ five. However, if you do not specify the size, then an array of just the right\
    \ size is created. You would type it as follows\n\n```cpp\ndouble balance [] {1000.0,\
    \ 2.0, 3.4, 17.0, 50.0};\n```\n\nNow that you know how to write an array, it is\
    \ time to move on to putting it into the actual program. This program is a bit\
    \ more advanced than the ones before, and has a few more elements. You can look\
    \ up these elements on www.compileonline.com. You will be directed to a lot of\
    \ tutorials and there is even a PDF file for you to download.\n\nHere is the formula\
    \ for your program to assign an array.\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\n#include <iomanip>\nusing std::setw;\n\nint main()\n{\n    int n[10];\
    \ // n is an array of ten integers\n    // initialize elements of array n to 0\n\
    \    for (int i=0; i<10; i++)\n    {\n        n[i]=i+100; // set element at location\
    \ i to i+ 100\n    }\n    cout << element << setw(13) << value<< endl;\n    //\
    \ output each array element's value\n    for (int j=0; j<10; j++)\n    {\n   \
    \     cout << setw(7) << j << setw(13) << n[j] << endl;\n    }\n    return 0;\n\
    }\n```\n\nThis program was able to use the setw() function in order to format\
    \ the output that you see.\n\n## Loop Types\n\nThe loop types are used any time\
    \ that you would like to take one type of code and execute it over and over. These\
    \ statements are going to be done one right after the other. The loop statement\
    \ will make it easier to execute these statements as many times as you would like.\n\
    \nThere are four types of loops. These loops handle different requirements.\n\n\
    ### While loop\n\nThe While loop is going to continue repeating the loop as long\
    \ as a certain condition is met. It is going to test out the condition until it\
    \ is no longer true\n\n```cpp\nwhile (condition)\n{\n    statement;\n}\n```\n\n\
    ### For loop\n\nThis loop executes a certain number of times. It is going to use\
    \ initialization, condition, and increment\n\n```cpp\nfor (init; condition; increment)\n\
    {\n    statement;\n}\n```\n\n### Do-while loop\n\nThe Do...while loop is similar\
    \ to while, but it will execute the code at least once before testing the condition\n\
    \n```cpp\ndo\n{\n    statement;\n} while (condition);\n```\n\n### Nested loops\n\
    \nThe nested loop is a loop inside another loop. This can be used to work with\
    \ multi-dimensional arrays.\n\n## Why is this important\n\nEventually you are\
    \ going to master these loops. It cannot be stressed how much of an essential\
    \ tool this is. There are tutorials at www.compileonline.com. You will be able\
    \ to find out how much it is. It cannot be stressed. You have to check it yourself\
    \ and find out how much it is.\n\n## Chapter 5: Working with Operators in C++\n\
    \nWith any of the languages you plan to use, it is important to learn the operators.\
    \ These are going to help you tell the program what you like. There are four main\
    \ types of operators that you are able to use. Some of the operators that you\
    \ will be able to use with C++ include:\n\n- Logical operators\n- Arithmetic operators\n\
    - Assignment operators\n- Relational operators\n\nLet’s take a look at how some\
    \ of these work and how you can bring them out.\n\n### Logical operators\n\nThe\
    \ first type of operator that we are going to use in this guide are the logical\
    \ operators. These are going to help you compare some of the parts that you are\
    \ putting into the system. Some of the logical operators that you can work with\
    \ include:\n\n- (||): this is known as logical OR. With this one, the condition\
    \ is going to be true if one of your operands is not zero.\n- (&&): this one is\
    \ known as the logical AND. If you have two operands and they are not zero, your\
    \ condition is true.\n- (!): this is logical NOT. You will be able to use this\
    \ to reverse the status of your operand. So if the condition ends up being false,\
    \ this sign will make it true.\n\n### Arithmetic operators\n\nAnother of the operators\
    \ that you are able to use is the arithmetic operators. These are pretty much\
    \ the same as using math in school. You are going to tell the program to add,\
    \ subtract, and do other equations with the information that you are providing.\
    \ Some of the arithmetic operators that you are able to use include:\n\n- (+):\
    \ this is the addition operator that will add together two operands of your choices.\n\
    - (-): this is the subtraction operator. It is going to take the right hand operand\
    \ and subtract it from the left hand operand.\n- (*): this is the operator that\
    \ makes it possible to do multiplication in the C++ language.\n- (/): this operator\
    \ helps you to do division in C++.\n- (++): this is the increment operator. It\
    \ is going to increase the value of your operand by one.\n"
