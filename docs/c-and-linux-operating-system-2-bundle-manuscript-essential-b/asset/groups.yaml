    \n## I/O Redirection\n\nDuring normal terminal command execution, “normal input”\
    \ (typed by the user, or read from a file/attribute/hardware) is entered and parsed\
    \ by the command. Sometimes the command has “standard output” as well, which is\
    \ the return text shown in the terminal. In “ls”, the standard input is the current\
    \ working directory, and the standard output is the contents of the folder.\n\n\
    Input and output are normally direct, but by using I/O redirection we can do more\
    \ with the terminal. As an example, the “cat” command (concatenate) followed by\
    \ a file will output that file to the screen. Running cat by itself opens a parser\
    \ where any line that is input will be immediately output (use ctrl+d) to quit.\
    \ But with I/O redirection hotkeys (<, >, >> |) we can redirect the output to\
    \ another source, such as a file. And “cat > test.txt” will now put the standard\
    \ output in that new file. Double signs signify appending, so “cat >> test.txt”\
    \ will place the output at the end of the file rather than erasing the contents\
    \ at the beginning.\n\nThe vertical line character, or the “pipe”, uses another\
    \ form of I/O redirection to take the output of one command and directly insert\
    \ it into the input of another. “ls | sort -r” would take the output of ls and\
    \ sort into a backwards list. We redirected the output and gave it to another\
    \ command to accomplish this.\n\nAnd finally, the “grep” command is used very\
    \ often within I/O redirection. Grep can search for a certain string within a\
    \ specified file and return the results to standard output. Using redirection,\
    \ this output can be put into other commands. An interesting feature of Linux\
    \ to note is that object is a file, even hardware. So our CPU is actually a file\
    \ that stores relevant data inside of it, and we can use grep and other tools\
    \ to search within it. That example is fairly advanced, but here is a simpler\
    \ instance:\n\n```\n\"grep Conclusion report.txt\"\n```\n\nAnd it will search\
    \ within the file for that specific word. I/O redirection can become a complicated\
    \ process with all of the new symbols and commands, but it is a feature that you\
    \ can incorporate into your scripts and daily use that often allows for certain\
    \ features and functions of Linux to be done in a single line.\n\nLinux and the\
    \ terminal are difficult concepts to fully master. But with practice and continuing\
    \ dedication you will be able to perform masterful feats of computing and do helpful\
    \ tasks that are not possible in Windows or OSX. Learning more about commands\
    \ and how to use them certainly helps in this regard, so persist in your studies\
    \ of new commands and their use. Positively the only command you actually need\
    \ to memorize is “man”, a command that will show the manual pages and any other\
    \ command specified. The manual pages show switches, examples, and the intended\
    \ use of every command on your system.\nUse the tool to your advantage and gain\
    \ intimate knowledge of your system.\n\n## More Linux Information\n\nTo continue\
    \ learning about Linux and the possibilities it can provide, consider the examples\
    \ in this section. It will briefly discuss more uses for Linux, and a few other\
    \ concepts that have yet to be talked about.\n\nThe “Linux file system” refers\
    \ to the main layout of the files and folders on your computer. If you continue\
    \ to “cd ...” in the terminal, or if you click the back button on the GUI until\
    \ it goes no further you will stumble upon the “root” directory. The folders here,\
    \ bin, boot, etc, usr, and so on are how your hardware and settings are configured.\
    \ Each folder has a specific purpose and use, and you can understand them by exploring\
    \ the contents. As an example, user data is stored in home, but user programs\
    \ are stored in usr. Because of how diverse and complicated the file system actually\
    \ is it will not be discussed here, but if you wish to learn more do an Internet\
    \ search or read the documentation associated with your operating system.\n\n\
    Linux systems are often used for purposes other than desktop use. Dedicated machines\
    \ run variants of Linux because of the power and stability it provides. Even our\
    \ cars have a Linux kernel running to keep track of error codes and help mechanics.\n\
    \nServers often have Linux installed because of reliability and the functions\
    \ the distributions have within them. For instance, Linux machines are used as\
    \ firewalls because the “iptables” application provides excellent port blocking\
    \ and intelligent filtering. You yourself can run a firewall on your system with\
    \ the application as well, thus gaining business-level software for free. In this\
    \ way, Linux is also great for networking. The machine can act as a switch, router,\
    \ DNS server, DHCP server, and more just by installing the relevant applications.\n\
    \nAnd finally, Linux systems are not limited to the interfaces we have seen insofar.\
    \ Every distro has its preferred desktop environment, but the interface can be\
    \ extremely customized to the individual’s preference. There are even file and\
    \ web browsers for the terminal, which is greatly helpful for those using SSH\
    \ or remote computing. All-in-all, you should try out different DE’s by installing\
    \ them and configuring them to your liking.\n\n## What Next and Conclusion\n\n\
    How you continue depends on what you want to do with your Linux distribution.\
    \ For casual browsing and simple use, continue with Ubuntu and install the programs\
    \ you need. For more adventurous people, consider installing a new distribution\
    \ to see what each has to offer. Those wishing to learn more deeply about Linux\
    \ can install one such as Arch or DSL to build their own unique OS from scratch.\n\
    \nConclusively, Linux is a powerful and relatively easy to use set of operating\
    \ systems. But their real potential comes from the hard-to-master terminal and\
    \ command line functions. Thank you for reading this publication, and I hope that\
    \ it has shed some light on the mysterious subject of the defacto alternative\
    \ operating system.\n"
  mdcn: "\n内容。在你创建脚本和其他配置文件时，请考虑通过点（.）来隐藏它们，作为一种用户保护的形式。\n\n终端中的任何命令都可以通过 `ctrl+d`\
    \ 组合键中断或退出。使用它来停止长时间运行的进程，或者退出一个你不熟悉的程序/命令。\n\n别名（Aliasing）是在终端中创建个人快捷键的一种方式。与其输入一个长长的命令或一堆短命令，不如将它们组合成单个用户定义的选项。正如其名称所暗示，别名是你指定的任何内容的其他名称。每个别名都包含在一个隐藏的配置文件中——使用“`nano/.bashrc`”来开始编辑它。因为它存在于用户的家目录下，因此每个别名都仅对该用户有效。在文件的底部，我们可以按照示例开始创建别名：\n\
    \n```\nalias gohome='cd ~ && ls'\n```\n\n此别名将允许通过输入“gohome”将目录切换到主目录并显示内容。在创建别名时，你必须完全遵循上述的格式，这意味着命令和等号之间没有空格。多个命令通过“&&”连接在单引号内。为了获得更健壮的别名，请添加一个函数。下面的示例将\
    \ `cd` 和 `ls` 组合成单个命令。\n\n```\nfunction cdls() {\n  cd \"$@\" && ls\n}\n```\n\n\
    写完别名后，保存文件并重启电脑。你的新命令就可以使用了。\n\n我们编辑的那个文件 `.bashrc` 是 Ubuntu 终端的配置文件。除了制作别名外，我们还可以用它来定制终端设置，例如颜色、大小等……一个小技巧是可以通过删除\
    \ `#` 来取消“#force_color_prompt=yes”的注释，并确保等号后面是“yes”。这会为终端添加颜色，使某些单词显示不同的颜色。打开终端时，右键点击它并选择“配置文件”（profiles），然后选择“配置文件偏好”（profile\
    \ preferences可以使用更多选项。通过这里的标签页，你可以自定义字体、大小、颜色、背景颜色等。如果你打算经常使用终端，建议对其进行自定义，因为这有助于你熟悉将要操作的工具。\n\
    \n## I/O 重定向\n\n在正常的终端命令执行期间，“正常输入”（由用户输入，或从文件/属性/硬件读取）会被命令输入并解析。有时命令还有“标准输出”，即在终端中显示的返回文本。在“ls”中，标准输入是当前工作目录，标准输出是文件夹的内容。\n\
    \n输入和输出通常是直接的，但通过使用 I/O 重定向，我们可以让终端功能更多。例如，“cat”命令（连接）后跟一个文件会将该文件输出到屏幕。单独运行 `cat`\
    \ 会打开一个解析器，其中输入的任何行都将立即输出（使用 `ctrl+d` 退出）。但通过 I/O 重定向快捷键（`<`, `>`, `>> | |`），我们可以将输出重定向到另一个源，例如文件。“`cat\
    \ > test.txt`”现在会将标准输出放入该新文件中。双符号表示追加，因此“`cat >> test.txt`”将输出置于文件末尾，而不是删除文件开头的内容。\n\
    \n竖线字符或“管道”（pipe）使用了另一种形式的 I/O 重定向，它将一个命令的输出直接插入到另一个命令的输入中。“`ls | sort -r`”将获取\
    \ `ls` 的输出并排序成反序列表。我们通过重定向输出并将其交给另一个命令来实现这一点。\n\n最后，“grep”命令在 I/O 重定向中被频繁使用。`grep`\
    \ 可以在指定文件中搜索特定字符串并将结果返回到标准输出。使用重定向，此输出可以放入其他命令中。Linux 一个值得注意的有趣特性是对象即文件，即使是硬件也是。因此，我们的\
    \ CPU 实际上是一个内部存储相关数据的文件，我们可以使用 `grep` 和其他工具对其进行搜索。那个例子相当高级，但这里有一个更简单的实例：\n\n```\n\
    \"grep Conclusion report.txt\"\n```\n\n它将在文件中搜索该特定单词。由于所有这些新符号和命令，I/O 重定向可能会变成一个复杂的过程，但它是你可以整合到脚本和日常使用的功能，通常允许在单行代码中完成\
    \ Linux 的某些特性和功能。\n\nLinux 和终端是难以完全掌握的概念。但通过实践和持续的投入，你将能够执行精湛的计算壮举，并完成在 Windows\
    \ 或 OSX 中无法完成的有用任务。学习更多命令以及如何使用它们对这无疑有帮助，因此请坚持学习新命令及其用法。肯定的是，你唯一需要记忆的命令是“`man`”，这是一个显示手册页以及任何其他指定命令的命令。手册页显示了系统上每个命令的开关、示例和预期用途。\n\
    利用这个工具并获取关于你系统的深入知识。\n\n## 更多 Linux 信息\n\n为了继续学习 Linux 及其它能提供的可能性，请考虑本节中的示例。它将简要讨论\
    \ Linux 的更多用途，以及一些尚未谈及的其他概念。\n\n“Linux 文件系统”指的是计算机上文件和文件夹的主要布局。如果你在终端中继续执行“`cd\
    \ ...`”，或者在 GUI 上点击返回按钮直到它无法再移动，你将会遇到“root”（根）目录。这里的文件夹，如 `bin`、`boot` 等、`usr`\
    \ 等是你的硬件和设置的配置方式。每个文件夹都有特定的用途和功能，你可以通过探索其内容来理解它们。例如，用户数据存储在 `home` 中，但用户程序存储在\
    \ `usr` 中。由于文件系统实际上非常多样且复杂，这里将不再讨论，但如果你想了解更多，可以在网上搜索或阅读与你的操作系统相关的文档。Linux 系统经常用于桌面之外的用途。专用机器运行\
    \ Linux 内核，以跟踪错误代码并帮助机械人员。\n\n服务器经常安装 Linux 是是因为其可靠性和发行版提供的功能。例如，Linux 机器被用作防火墙，因为“iptables”应用程序提供了优秀的端口拦截和智能过滤。你也可以在自己的系统上运行防火墙，从而获得企业级软件。通过这种方式，Linux\
    \ 在网络方面也非常出色。通过安装相关应用程序，机器可以充当交换机、路由器、DNS 服务器、DHCP 服务器等。\n\n最后，Linux 系统不仅限于我们目前看到的界面。每个发行版都有其首选的桌面环境，但界面可以根据个人偏好进行极端定制。终端甚至有文件和网络浏览器，这对于使用\
    \ SSH 或远程计算的人非常有帮助。总而言之，你应该尝试安装不同的 DE 并根据你的喜好进行配置。\n\n## 接下来做什么与结论\n\n你如何继续取决于你想用你的\
    \ Linux 发行版做什么。对于浏览和简单使用，请继续使用 Ubuntu 并安装所需的程序。对于更具冒险精神的人，考虑安装一个新的发行版，看看它们各提供什么。想要深入学习\
    \ Linux 的可以安装如 Arch 或 DSL 等发行版，从零开始构建自己独特的操作系统。\n\n结论，Linux 是一套强大且相对易用的操作系统。但它们真正的潜力来自于难以掌握的终端和命令行功能。感谢阅读本文，希望它能为这个神秘的替代操作系统主题提供一些启发。\n"
