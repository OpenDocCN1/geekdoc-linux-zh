    in between, that it would not be beneficial to only talk about the two that are
    most known.


    The two main categories that all the sub categories fall between however, are
    ethical and unethical hacking.


    Ethical hacking is hacking that is used only for good purposes. There are a lot
    of people who have full permissions to hack into a system, and to find all of
    the bugs of the software or hardware.


    Ethical hackers are all the ones that are responsible for all of the bug fixes
    in your phone, apps, tablets, or computers. These people are hired by a company
    to figure out what is wrong with their systems, and find the best way to fix it.
    These hackers are an essential part of the hacking community.'
