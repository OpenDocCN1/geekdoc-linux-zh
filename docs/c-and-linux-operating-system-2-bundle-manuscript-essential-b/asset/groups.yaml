    定制化是技术领域备受追求的功能。Windows，尤其是 OSX，由于担心普通用户会弄坏它，限制了你对操作系统可以进行的操作。Linux 并非如此，因为它鼓励编辑和更改操作系统的视觉和功能。当然，这并不是必要的，大多数
    Linux 发行版的默认配置极其稳定，很难在无意中破坏。但对于那些喜欢越狱、改装和折腾电脑的人来说，Linux 可以促进创造性的一面，并为好奇的黑客提供其他系统中无法提供的工具。


    最后，Linux 兼容海量设备。Linux 可以运行在几乎任何架构上，这意味着它可以安装在手机、台式机、笔记本电脑、服务器、游戏机和“智能”设备上。爱好者乐于简单


