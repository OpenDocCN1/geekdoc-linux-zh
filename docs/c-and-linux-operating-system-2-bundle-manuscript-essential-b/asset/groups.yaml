    \ 数组初始化\n\n你可以逐个初始化数组，也可以使用单条语句。示例：\n\n```cpp\ndouble balance[5]={1000.0, 2.0,\
    \ 3.4, 17.0, 50.0};\n```\n\n括号内找到的数量不能高于你所使用的元素数量。这意味着当你的数组标题只指定了五个元素时，你不能提供六组数字。然而，如果你不指定大小，就会创建一个大小恰合适的数组。你可以按照如下方式输入：\n\
    \n```cpp\ndouble balance [] {1000.0, 2.0, 3.4, 17.0, 50.0};\n```\n\n现在你已经知道如何编写数组了，是时候将它放入实际程序中了。这个程序比之前的稍微高级一点，包含更多元素。你可以在\
    \ www.compileonline.com 上查找这些元素。你会被引导到许多教程，甚至有一个 PDF 文件供你下载。\n\n这是你的程序分配数组的公式。\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\n#include <iomanip>\nusing\
    \ std::setw;\n\nint main()\n{\n    int n[10]; // n 是一个十个整数的数组\n    // 将数组 n 的元素初始化为\
    \ 0\n    for (int i=0; i<10; i++)\n    {\n        n[i]=i+100; // 将位置 i 元素设置为 i+\
    \ 100\n    }\n    cout << element << setw(13) << value<< endl;\n    // 输出每个数组元素的值\n\
    \    for (int j=0; j<10; j++)\n    {\n        cout << setw(7) << j << setw(13)\
    \ << n[j] << endl;\n    }\n    return 0;\n}\n```\n\n这个程序使用了 `setw()` 函数来格式化你看到的输出。\n\
    \n## 循环类型\n\n循环类型用于你想获取某类型代码并反复执行它的任何时候。这些语句将一个接一个执行。循环语句将更容易按照你所需的次数执行这些语句。\n\
    \n有四种类型的循环。这些循环处理不同的需求。\n\n### While 循环\n\n只要满足特定条件，While 循环就会继续重复。它会一直测试条件直到条件不再成立。\n\
    \n```cpp\nwhile (condition)\n{\n    statement;\n}\n```\n\n### For 循环\n\n此循环执行固定次数。它使用初始化、条件和递增。\n\
    \n```cpp\nfor (init; condition; increment)\n{\n    statement;\n}\n```\n\n### Do-while\
    \ 循环\n\nDo...while 循环与 while 类似，但在测试条件之前至少执行一次代码。\n\n```cpp\ndo\n{\n    statement;\n\
    } while (condition);\n```\n\n### 嵌套循环\n\n嵌套循环是循环内部的循环。它可以处理多维数组。\n\n## 为什么这很重要\n\
    \n最终你将掌握这些循环。无论如何强调这是一个多么重要的工具。www.compileonline.com 上有很多教程。你将发现它有多重要。我无法强调。你必须亲自检查并发现它的价值。\n\
    \n## 第 5 章：在 C++ 中使用运算符\n\n对于你计划使用的任何语言，学习运算符都是重要的。这些运算符将帮助你告诉程序你的需求。你可以使用四种主要类型的运算符。在\
    \ C++ 中可以使用的一些运算符包括：\n\n- 逻辑运算符\n- 算术运算符\n- 赋值运算符\n- 关系运算符\n\n让我们看看其中一些是如何工作的，以及你如何使用它们。\n\
    \n### 逻辑运算符\n\n我们在指南中使用的第一种运算符是逻辑运算符。它们将帮助你比较输入到系统的某些部分。你可以使用的的一些逻辑运算符包括：\n\n\
    - (||): 这被称为逻辑或（OR）。对于这个，如果你的操作数之一不为零，条件就为真。\n- (&&): 这被称为逻辑与（AND）。如果你有两个操作数且它们不为零，你的条件为真。\n\
    - (!): 这是逻辑非（NOT）。你可以使用它来反转操作数的状态。所以如果条件结果为假，这个符号将使其变为真。\n\n### 算术运算符\n\n你可以使用的另一种运算符是算术运算符。这与在学校里用数学几乎相同。你指示程序对你提供的信息进行加、减和其他方程运算。你可以使用的一些算术运算符包括：\n\
    \n- (+): 这是加法运算符，将两个你选择的操作数相加。\n- (-): 这是减法运算符。它获取右侧操作数并从左侧操作数中减去。\n- (*): 这个运算符使得在\
    \ C++ 语言中进行乘法成为。\n- (/): 这个运算符帮助你在 C++ 中进行除法。\n- (++): 这是递增运算符。它将你的操作数的值增加一。\n\
    \n"
