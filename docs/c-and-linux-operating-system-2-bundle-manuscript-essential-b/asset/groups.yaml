    order to interact with the files inside of it. You can use the terminal command
    “cd” to change directory and move about the file system. As an example, typing
    “cd Desktop” from the Home folder will transfer you to that folder. Now using
    “ls” will not show anything (unless you added files to the desktop). To back out,
    type “cd ..”. Practice navigating around the file system in this fashion; cd into
    a directory and ls to view the files.


    Because you are typing commands, Linux expects your input to be exact. If you
    misspell a command it will simply not work, and if you type a folder or file incorrectly
    it will try to reference something that does not exist. Watch your input carefully
    when using the terminal.'
  - '[PAGE 146]


    Opening a file is done with a different command – “.\”. The period is used to
    start the specified file, so if you were attempting to open a picture it could
    be done so: “./house.png”. Both the period and the slash are necessary, as it
    denotes that you are running a file within the current directory. When you run
    a file it will be opened with the default application assigned to the file type,
    so in the case of a picture it will most likely be opened in an image viewer.


    You can also create and remove directories and files through terminal as well.
    For this example navigate to the Home directory. As a shortcut you can type “cd
    ~” to change the directory to your Home, because the tilde key is short for “the
    current user’s home”. Make a directory with the “mkdir” command; type, “mkdir
    Programming” to create a new folder with that title. You can CD into it, or you
    can go to the GUI and enter it to prove that you have indeed created a new folder.
    Now remove that directory by going Home and typing “rmdir Programming”. Without
    hesitation, Linux will remove'
  - '[PAGE 147]


    the specified directory. Similarly, using “rm” will remove the specified file.


    Linux has a design philosophy that many users are not used to. In Windows and
    OSX, the OS will almost always check that you want to commence with an action
    such as deleting a file or uninstalling a program. Linux distributions believe
    that if you are imitating an event, you definitely mean to follow through with
    it. It will not typically confirm something, nor will it display any confirmation
    messages (file successfully deleted). Rather, the absence of a message indicates
    the process completed successfully. While the philosophy is somewhat dangerous
    (because you could potentially ruin your OS installation without warning), it
    serves as a design contrast to other operating systems. Linux gives you complete
    control, and it never tries to hide obscure options because they might be too
    complicated. It takes some time to get used to, but most users agree it is a welcome
    change to be respected by the technology they own.'
- md: '

    This does not compromise security, however, because any critical action requires
    the “sudo” command as a preface. Sudo stands for “super user do”, meaning that
    the user of the highest permissions is requesting the following command. Any sudo
    entry will require an administrator password, so malicious software or un-intending
    keyboard spammers cannot accidentally do damage without knowing the password first.
    A lot of the commands we use in this book require sudo permissions, so if the
    command fails to complete with a message explaining it does not have enough permissions
    you can retry with sudo.


    ## Apt


    Learning the terminal opens up computer functions that are not available through
    the GUI. Also, you can shorten the amount of time it takes to do many things by
    typing it instead. Take, for instance, the amount of work required installing
    a program. If you wanted to download the Google Chromium browser, you would have
    to open the software center, type in the name of the program, locate the correct
    package, mark it for installation, and execute the action. Compare that to typing
    “sudo apt-get install chromium-browser” into the terminal. With that one command,
    Ubuntu will save you many minutes.


    Apt (advanced packaging tool) is the command associated with managing applications
    in Ubuntu. Other distributions may use their own tool, but apt is commonly used
    for its large repositories and simple commands. Packages are installed with the
    “apt-get install” formatting, where you specify the name of the program you wish
    to install. In the example above we specify the Chromium program with the package
    name “chromium-browser”. Given that you do not know every package name, there
    is another command “apt-cache search” that can be used to locate package names
    matching the supplied string. So “apt-cache search chromium” would show “chromium-browser”,
    and you could specify the correct name to install.


    The usefulness of apt extends beyond that, as you can use it to update every single
    application on your system with a few commands. Use “apt-get update” to refresh
    the repository, then use “apt-get upgrade” to have every application upgrade itself
    to the newest version. Windows OS users should be envious at this easy process,
    because updating a Windows programs requires uninstalling and reinstalling with
    the newest version.


    As time goes by, you might need to update the Ubuntu version. Every year there
    is a new release, and it can be installed with “apt-get dist-upgrade”.


    Staying up to date with the newest fixes and additions ensures your Linux system
    will be working healthy for a long time. You might have even noticed that installing
    and updating the system does not require a reboot; a feature that contributes
    to Linux computer’s lengthy uptimes and stability. Lastly, removing an application
    is done with “apt-get remove” followed by the package name.


    To run the programs that we install can either search for them from the dash,
    or we can just type the package name into the terminal. Typing “chromium-browser”
    will launch it the same as double clicking its icon would. Some programs must
    be started from the command line by typing the package name exclusively because
    the package does not show up in a dash search. Overall utilizing the terminal
    is a time-saver and a great way to practice moving away from slow and cumbersome
    graphical user interfaces.


    Easy installation and management of packages is a Linux feature that becomes highly
    useful-master it to improve your experience. There is a third method of installing
    packages, and it involves downloading and launching .deb files from the Internet.
    Some software are bundled in that format, and they act similar to .exe files in
    that they just need to be double clicked to begin the installation process.


    ## More Terminal Commands


    Here are a few more basic terminal commands that you should internalize and put
    to use in your system. Fully understanding the basics will provide a decent foundation
    upon which to build on later.


    - - cp – “cp image1.jpg image2.jpg” – copies (and renames) the first parameter
    to the second supplied parameter. Copy directories with the -r switch.

    - - mv – “mv cat.jpg /home/Pictures” – Move the specified file to the given directory.

    - - shutdown – “shutdown –h now” – shuts down the computer. -h is a tag meaning
    “halt”, but you can also use -r to restart. Now refers to the time until it executes.

    - - date – “date” – Displays the current date and time.

    - - free – “free –g” – Show the current RAM usage of programs.

    - - du – “du –h” – Give the HDD usage.

    - - ps – “ps” – Show the active processes using CPU time.

    - - touch – “touch memo.txt” – Used to create a new blank file in the current
    directory with the specified name.

    - - ifconfig – “ifconfig” – The Linux equivalent of ipconfig, it shows network
    information.


    Some commands have “tags” or “switches” associated with them. These are the letters
    preceded by dashes. They all do different things, and learning which switches
    to use for what purpose is best found through that command’s manual pages. See
    the advanced section for opening the manual.


    One of the most useful programs from the command line, nano is a simple text editor
    that can be used to edit files and quickly make changes to settings or scripts.
    It is accessed by typing “nano” into a command line. You can type a file as needed
    and then press ctrl+x to save and quit. As you save, you will give it the name
    and file extension associated with it; notes.txt will create a text file with
    the name “notes”. Alternatively, you can edit a file by typing “nano notes.txt”.
    In that example, we open the editor and display its contents. Nano may be very
    simple, but it is undoubtedly powerful and a time saver.


    ## Connecting to Windows / Mac Computers


    Windows and OSX computers have built-in networking functions such as workgroups,
    domains, shares, and more. Integrating Linux computers into the network infrastructure
    that has been dominated by Windows server is fairly easy, and correct setup will
    allow you to see Windows shares as well as join corporate domains.


    The first step to intercommunication is installing the “samba” package. Either
    find it through the software center, or type in “sudo apt-get install samba” to
    obtain and install the necessary software. Sharing files from your Ubuntu machine
    to other computers involves creating a samba share. Samba runs off the same protocols
    that other file file methods use, so files shared from the Ubuntu machine can
    easily seen on Windows. After installing samba, use “sudo nano /etc/samba/smb.conf”
    to start editing the configuration file. At the very bottom of the file add these
    lines:


    | Key | Value |

    | :--- | :--- |

    | [share] | |

    | comment | File Share from Ubuntu |

    | path | /srv/samba/share |

    | browseable | yes |

    | guest ok | yes |

    | read only | no |

    | create mask | 0755 |


    Now, create the folder specified in path (sudo mkdir -p /srv/samba/share) and
    set permissions (sudo chown nobody:nogroup /srv/samba/share/) so that anybody
    can access its contents. Place any files you want to share within that directory,
    and then restart the service (sudo restart smbd. sudo restart nmbd) to make the
    share active. Lastly, log on to your other computer and navigate to the network
    shares. In Windows, they will appear in the left panel of file explorer. If the
    share does not appear automatically, type the IP into the file path box (find
    Ubuntu IP with ifconfig). You might also need to see files from other operating
    systems in the Ubuntu computer. Firstly, open the Ubuntu file explorer. From the
    menu bar, click “files”, and then select “connect to server”. In the resulting
    box, type the URL of the share you wish to access. It could be an ftp address
    (ftp://test.com), an http address (http://test.com), or a share address (smb://share/Folder).
    Without any additional hardware or setup, you can see the files this way.

