    how to install it. When in doubt (and as we will demonstrate shortly), install
    Ubuntu or one of its variants. The OS is great for beginners and makes the Linux
    transition smoother. But as you increase in skill and wish to learn more about
    Linux, you can always install another operating system.'
  - '[PAGE 129]


    # Booting Into Linux


    If you are ready to take the plunge into a Linux based distribution, the first
    thing you must do is back up your files. Overwriting the OS on your hard drive
    will erase any data contained within, meaning you must back up any pictures, music,
    or files you wish to keep after the transition. Use an external hard drive, or
    an online data storage site (such as Google Drive) to temporarily hold your files.
    We are not responsible for you losing something important, back it up!


    Next we will need to choose an OS. This book will use Ubuntu 16.04 as an extended
    example, and it is recommended you do the same. Navigate to Canonical’s official
    website (http://www.ubuntu.com) and acquire a copy of the OS. You will download
    the image from the site to your computer.


    Next we need to obtain an installation media. This can be a DVD, USB drive, an
    SD card, or any other writable media that your computer can'
  - '[PAGE 130]


    read. The only restriction is that the device must be able to hold an image as
    large as the OS download, so 4GB should suffice. Remove everything from the drive,
    as it will also be formatted.


    Download a tool for writing the image file. For DVDs install Imgburn (http://www.imgburn.com/),
    and for flash media download Rufus (https://rufus.akeo.ie/). The most common method
    of OS installation is to use a 4GB USB drive, and it is more recommended.  Insert
    your media, start the appropriate program, select the OS image that was downloaded,
    and begin the writing process. It will take some time, as the image needs to be
    made bootable on the media. When it is finished, you can shut down your computer
    fully.


    This is the point to make double sure you are ready to install Linux. Check that
    your files are backed up, understand that you will be erasing your current OS,
    and preferably have a Windows/OSX install disc handy in case'
  - '[PAGE 131]


    you decide to switch back. If you are indeed ready to switch, continue.


    With the installation media still inserted, turn on your computer. The first screen
    that you will see is the BIOS / UEFI POST screen, and it will give a keyboard
    button that you should press to enter setup. This screen shows every time you
    boot, but you probably pay no attention to it. Press the indicated key to enter
    the BIOS setup. If you are too slow, the screen will disappear and your usual
    OS will begin to load. If this happens, simply shut the computer back down and
    try again.


    Once within the BIOS / UEFI, you will have to navigate to the “boot order” settings.
    Every computer''s BIOS / UEFI is slightly different, so we cannot explain the
    process in detail. But generally you can follow button prompts at the bottom of
    the screen to understand how to navigate. After arriving at the boot order settings,
    place your boot medium at the top of the list. As an example, if you used a USB
    drive, then you would see its name and have to bring it to the'
  - '[PAGE 132]


    top of the list. These settings control the order in which the PC searches for
    operating systems. With our boot medium at the top of the list, it will boot into
    our downloaded Linux image instead of our usual OS. Save your settings and restart
    the computer. If everything was done correctly the computer will begin to boot
    into Ubuntu.


    But if something goes wrong, try troubleshooting it with these tips:


    +   - Primary OS boots instead of Linux – You probably did not save the settings
    with your alternate boot medium at the top of the list. The PC is still defaulting
    to the internal HDD to boot.


    +   - “No boot media found” – Did you “drag and drop” your Linux image onto the
    media instead of writing it? Without explicitly telling the computer it is bootable,
    it will not know what to do with the data files'
  - '[PAGE 133]


    on the media. Alternatively, you could have a corrupted download, or an incomplete
    write. Try downloading the image again and making another installation.


    +   - “Kernel Panic” – Something is wrong with the boot process. See above for
    the possibility of a corrupted installation. Otherwise, the image you are trying
    to install may not be compatible with your hardware. IF you see any other error
    messages, do an Internet search on them. For prebuilt computers and laptops, search
    for the model name and Linux to find other user’s experiences. Finally, you might
    have attempted to install a 64-bit image on a 32-bit computer. With your next
    download, specifically select a 32-bit image.


    +   - “Problem reading data from CD-ROM...” – Try using a different'
  - '[PAGE 134]


    install medium, because some distributions no longer support CD and DVD installations.
    USB drives are recommended.


    +   * PC seems to boot, but there is nothing at all on the screen – If you are
    using a dedicated card (compared to integrated GFX from the CPU), Linux might
    not be recognizing it completely. Plug your monitor into the motherboard directly
    instead of the card.


    But most of those problems are rare or simply due to user error. Linux has high
    compatibility and is relatively easy to install/use past the initial installation.
    The typical user will have Ubuntu boot successfully at this point, and they will
    be presented with a working computing environment.


    The desktop you see is referred to as a “Live CD”, which is pretty much a'
  - '[PAGE 135]


    demonstration of the OS and how it works. You have not actually installed the
    OS to your hard drive yet, as it is still running directly from your boot media.
    It is a chance for you to test out Linux without actually removing your primary
    OS, so take the opportunity to explore how Linux distributions work.'
  - '[PAGE 136]


    # Ubuntu Basics


    Similar to Windows, Ubuntu has a desktop graphical user interface. Applications
    open within Windows that can be maximized, minimized, closed, and moved around
    with the top bar. Ubuntu also has a “task bar” of sorts that functions much like
    its Windows counterpart- icons resemble programs that can be launched by clicking
    on them. The “Windows Button” (called the Dash Button) on the task bar is used
    to open a search functionality from which you can type in the name of a program
    or file on your computer to quickly start it.


    Furthermore, there is a bar at the top of the screen that works like the “menu”
    bar of other operating systems. This is where drop-down menus such as “file”,
    “edit”, “help”, etc... will appear once a program is active.


    Besides a few nominal differences Ubuntu functions is a very familiar way. In
    fact, many of the programs that you'
  - '[PAGE 137]


    may already use on other operating systems, such as Firefox, are available and
    sometimes preinstalled on Linux distributions. With enough experimentation and
    practice, you will be able to navigate the GUI of Ubuntu as if you were a professional.
    Continue exploring the system, and continue if you are ready to replace your main
    operating system with this Linux one.'
- md: '

    # Installing Linux


    On the desktop, you will see an “Install Ubuntu 16.04 LTS” icon. Double clicking
    it will launch an application that makes installation very easy. If you are not
    connected to the Internet, do so now by plugging in an Ethernet cord or by connecting
    to Wi-Fi from the top right icon. Select your language and click “continue”. The
    next prompt will ask whether you would like to download updates and install third-party
    software during the OS installation. These options are highly recommended for
    beginners, so check them and click “continue”.


    The application will move on to another screen asking for your install method.
    There are various options, such as erasing the disk altogether, installing alongside
    your primary OS, or updating a previous version of Linux. Select an option that
    works best for you. If you are still hesitant about making a full switch, elect
    to install Ubuntu as your secondary OS. That option will allow you to choose which
    OS to boot into after the BIOS screen. Nevertheless, select your option and click
    “install now”.


    While Ubuntu installs, you can specify a few other options, such as your time
    zone, computer name, account name, and password. The entire installation should
    not take too long, but it will take long enough that your computer should be plugged
    in (if it is a laptop). After finishing, the OS will require a reboot. Congratulations,
    you now have a usable Linux system on your computer. Throughout the next chapters
    in this publication we will focus on Linux concepts, how do you achieve certain
    tasks, and how to further your knowledge of your system.


    # Managing Hardware and Software


    Hardware in Linux is actually much easier to manage than hardware on Windows.
    Instead of downloading individual drivers for devices, most of the drivers are
    built-in to the OS itself. This means that most popular devices can simply be
    installed with no further steps involved before they are usable. Printers, networks,
    hard drives, and other common devices are included—fling with drivers is not usually
    needed on Linux.


    However, powerful graphics cards and other specific hardware will need proprietary
    drivers from that company to function to full efficiency. Because although your
    graphics card works by default with Linux, the secret and often hidden technology
    within can only be fully utilized with that company’s software. On Ubuntu the
    process is straightforward—open the “additional drivers” application and let the
    OS search for you. After determining whether you have the devices, it will ask
    you which version of the driver to use.


    Follow any on-screen prompts to enable the 3rd party drivers. For any devices
    that do not appear, do Internet research on the manufacturer’s website to determine
    whether they released a specific Linux driver that you can download.


    Software is another aspect of Linux that excels over Windows. Much like an Apple
    computer, Ubuntu has an app store of sorts from which you can search through repositories
    of applications that are compatible with your device to download and install with
    just a few clicks. Just search for the “Ubuntu Software Center” from dash to open
    the application. From there you can browse individual categories such as “Games",
    “Office", or “System” for a list of programs, or you can search directly by name.
    After finding a program, click on it and then queue up the download by clicking
    “install”. After authenticating yourself the software will automatically download
    and install. From there, the application can be run by searching for it in the
    dash.


    Another method of installing software is available through the terminal, but we
    will discuss that later. Ubuntu is not totally limited to software found in the
    app store, because programs downloaded from the Internet can also be installed.
    Once again, we will touch on that subject after discussing the terminal.


    Overall, managing hardware and software in Ubuntu is effortless. Whether installing
    a new hardware device or downloading a popular program, Linux distributions make
    your computing experience trouble-free. That is not to say that Linux is wholly
    meant for beginners, because as we will learn Linux is definitely a great choice
    for power users and experienced admins.


    # The Command Line / Terminal


    Before modern computers, hardware and software were interfaced by using keyboards
    exclusively. The mouse brought graphical interfaces and simplified the process,
    but many functions remained text-only as to not present complicated options to
    end users. In Linux, this process continues today. There exists the GUI that is
    present on most distributions, but every Linux distro also has a built-in text-based
    interface as well, from which powerful commands can be typed and executed. Think
    of the terminal as a much more powerful command prompt, because you can completely
    use your computer exclusively through the terminal alone. With enough knowledge,
    a user can actually browse the Internet, install programs, manage their file system,
    and more through text.


    Begin the terminal by launching it from dash or by using the Ctrl+Alt+T keyboard
    shortcut. A purple window will open and wait for your input. You can type a command
    and press enter to activate it. For our first command, enter “ls”. This is short
    for list, and it will display all of the files within our current directory. You
    will be able to see the files and folders in Home, Ubuntu’s main user folder.
    If you are lost, you can always type in “pwd” to print the working directory and
    display the name of the folder you are currently browsing. As you learn commands,
    it helps to write them down as to better internalize their use.


    # Managing Directories


    Directories, another name for folders, work the same as they do in other operating
    systems. Folders hold files, and you must be currently accessing a directory in
    order to interact with the files inside of it. You can use the terminal command
    “cd” to change directory and move about the file system. As an example, typing
    “cd Desktop” from the Home folder will transfer you to that folder. Now using
    “ls” will not show anything (unless you added files to the desktop). To back out,
    type “cd ..”. Practice navigating the file system in this fashion; into a directory
    and ls to view the files. Because you are typing commands, Linux expects your
    input to be exact. If you misspell a command it will simply not work, and if you
    type a folder or file incorrectly it will try to reference something that does
    not exist.


    Opening a file is done with a different command—“./”. The period is used to start
    the specified file, so if you were attempting to open a picture it could be done
    so: ./house.png. Both the period and the slash are necessary, as it denotes that
    you are running a file within the current directory. When you run a file it will
    be opened with the default application assigned to the file type, so in the case
    of a picture it will most likely be opened in an image viewer.


    You can also create and remove directories and files through terminal as well.
    For this example navigate to the directory. As a shortcut you can type “cd ~”
    to change the directory to your Home, because the tilde key is short for “the
    current user’s home”. Make a directory with the “mkdir” command; type, “mkdir
    Programming” to create a new folder with that title. You can CD into it. Now remove
    that directory by going Home and typing “rmdir Programming”. Without hesitation,
    Linux will remove the directory. Similarly, using “rm” will remove the specified
    file.


    Linux has a design philosophy that many users are not used to. In Windows and
    OSX, the OS will almost always check that you want to commence with an action
    such as deleting a file or uninstalling a program. Linux believes that if you
    are imitating an event, you definitely mean to follow through with it. It will
    not typically confirm something, nor will it display any confirmation messages
    (file successfully deleted). Rather, the absence of a message indicates the process
    completed successfully. While the philosophy is somewhat dangerous (because you
    could potentially ruin your OS installation without warning), it serves as a design
    contrast to other operating systems. Linux gives you complete control, and it
    never tries to hide obscure options because they might be too complicated.

    '
  mdcn: '


    # 安装 Linux


    在桌面上，你会看到一个“安装 Ubuntu 16.04 LTS”图标。双击它将启动一个应用程序，让安装过程变得非常简单。如果你没有连接互联网，请现在通过插入以太网线或通过右上角的图标连接
    Wi-Fi 来连接。选择你的语言并点击“继续”。下一个提示将询问你是否希望在操作系统（OS）安装下载更新并安装第三方软件。对于初学者来说，强烈建议选择这些选项，因此勾选它们并点击“继续”。


    应用程序将跳转到另一个屏幕，询问你的安装方法。有多种选项，例如完全擦除磁盘、与你的主操作系统一起安装，或更新之前的 Linux 版本。选择一个最适合你的选项。如果你仍然犹豫是否要完全切换，请选择将
    Ubuntu 安装为你的次要操作系统。该选项将允许你在 BIOS 界面后选择进入哪种操作系统。尽管如此，请选择你的选项并点击“现在安装”。


    在 Ubuntu 安装期间，你可以指定其他几个选项，例如时区、计算机名称、账户名称和密码。整个安装过程不会花费太长时间，但时间长到你的电脑应该连接电源（如果是笔记本电脑的话）。完成后，操作系统将要求重启。恭喜，你现在电脑上拥有了一个可用的
    Linux 系统。在本出版物的后续章节中，我们将重点关注 Linux 概念、如何完成某些任务以及如何进一步增加你对系统的了解。


    # 管理硬件和软件


    在 Linux 中，硬件的管理实际上比在 Windows 中要容易得多。不需要为设备下载单独的驱动程序，大多数驱动程序已内置在操作系统中。这意味着大多数流行设备只需安装，无需在使用前执行任何额外步骤即可。打印机、网络、硬盘和其他常见设备都包含在内——Linux
    上通常不需要运行驱动程序。


    然而，强大的显卡和其他特定硬件需要该公司的专有驱动程序才能完全高效运行。因为尽管你的显卡在 Linux 中默认工作，但其内部且往往隐藏的技术只有通过该公司的软件才能被充分利用。在
    Ubuntu 上，这个过程非常简单——打开“附加驱动程序”应用程序并让操作系统为你搜索。在确定你是否拥有这些设备后，它会询问你使用哪个版本的驱动程序。


    按照屏幕上的提示启用第三方驱动程序。对于任何未出现的设备，请在制造商网站上进行网络研究，以确定他们是否发布了你可以下载的特定 Linux 驱动程序。


    软件是 Linux 优于 Windows 的另一个方面。就像苹果电脑一样，Ubuntu 也拥有一类应用商店，你可以在其中搜索与你的设备兼容的应用程序仓库，只需点击几次即可下载并安装。只需从
    dash（启动器）搜索“Ubuntu 软件中心”打开该应用程序。从那里，你可以浏览各个类别（如“游戏”、“办公”或“系统”）的程序列表，也可以直接通过名称搜索。找到程序后，点击它，然后点击“安装”将下载加入队列。在验证身份后，软件将自动下载并安装。从那里，可以通过在
    dash 中搜索来运行该应用程序。


    通过终端可以使用另一种安装软件的方法，但我们稍后会讨论。Ubuntu 并不完全限于应用商店中的软件，因为从互联网下载的程序也可以安装。同样，我们将在讨论终端后触及该主题。


    总的来说，在 Ubuntu 中管理硬件和软件是轻而易举的。无论是安装新设备还是下载流行程序，Linux 发行版都能让你的计算体验毫无故障。这并不是说 Linux
    完全是为初学者设计的，因为正如我们将学到的，Linux 绝对是高级用户和经验丰富的管理员的绝佳选择。


    # 命令行 / 终端


    在现代计算机出现之前，硬件和软件完全通过键盘进行交互。鼠标带来了图形化界面并简化了过程，但许多功能仍然保持为纯文本，以避免向最终用户呈现复杂的选项。在 Linux
    中，这一过程延续至今。虽然大多数发行版中都存在 GUI，但每个 Linux 发行版也内置了一个基于文本的界面，在其中可以输入并执行强大的命令。将终端想象为一个功能强大的命令行提示符，因为你可以完全通过终端来使用你的计算机。拥有足够的知识，用户实际上可以通过文本浏览互联网、安装程序、管理文件系统等。


    通过 dash 启动终端或使用 Ctrl+Alt+T 快捷键进入终端。一个紫色窗口将打开并等待你的输入。你可以输入命令并按回车键激活它。对于我们的第一个命令，输入“ls”。这是
    list（列表）的缩写，它将显示当前目录下的所有文件。你将看到 Home（Ubuntu 的主用户文件夹）中的文件和文件夹。如果你迷路了，可以随时输入“pwd”打印工作目录并显示你当前正在浏览的文件夹名称。在你学习命令时，将它们记录下来有助于更好地掌握它们的用法。


    # 管理目录


    目录（文件夹的另一个名称）的工作方式与其他操作系统相同。文件夹存放文件，你必须当前访问某个目录才能与其中的内部文件进行交互。你可以使用终端命令“cd”来更改目录并在文件系统中移动。例如，在
    Home 文件夹中输入“cd Desktop”将你带到该文件夹。现在使用“ls”将不会显示任何内容（除非你在桌面上添加了文件）。要返回上，输入“cd ..”。练习以这种方式导航文件系统；进入一个目录并使用
    ls 查看文件。因为你正在输入命令，Linux 期望你的输入是精确的。如果你拼错了命令，它将无法运行。你也可以通过终端创建和删除目录。例如，使用 mkdir
    创建目录；输入“mkdir Programming”创建一个名为 Programming 的文件夹。作为快捷键，你可以输入“cd ~”切换到 Home，因为波浪号代表“当前用户的主目录”。使用
    rmdir 会删除目录。如果你输入的文件夹或文件错误，它会尝试引用一个不存在的内容。打开文件需要使用一个不同的命令——./”。点被用于启动指定的文件，所以如果你正尝试打开一张图片，可以这样做：./house.png。点和斜杠都是必要的，因为它表示你正在运行当前目录下的文件。当你运行一个文件时，它将用分配给该类型的默认应用程序打开，所以对于图片，它可能会在图像查看器中打开。


    '
