  mdcn: "\n\n## 第二章：让我们开始\n\n让我们开始吧！我们有很多地方可以着手，但让我们先谈谈环境。虽然你并不真的需要搭建自己的环境，因为有很多在线环境。环境就是你选择的编译器，它接收你的代码并为你完成所有功能。在过去，你必须打开命令提示符并创建一个环境来使用，但那种日子已经结束了。以前一个小错误就可能对他们的电脑造成严重损害。现在你可以练习一些风险性命令，而不会对你的设备产生任何风险。\n\
