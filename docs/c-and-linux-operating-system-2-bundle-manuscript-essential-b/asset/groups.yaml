    \n## 第 4 章：数组、循环和条件\n\n信不信，你已经学了这么多内容了。基础知识真的并不难，现在只需要学习更多事情，并将概念一个接一个组合起来，以确保你正在成为一名更好的\
    \ C++ 程序员。让我们继续吧。\n\n### 数组\n\n数组是 C++ 中的一种数据结构，能够存储基本类型相同的元素且具有固定大小。基本上它们是同类型变量的集合。与其使用单独变量，你会声明一个这样的变量数组（例如数字）。为了做到这一点，你使用\
