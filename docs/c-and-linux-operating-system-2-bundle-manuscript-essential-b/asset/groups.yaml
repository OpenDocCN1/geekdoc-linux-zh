    但这并没有损害安全性，因为任何关键操作都需要以“sudo”命令作为前缀。Sudo 是“super user do”（超级用户执行）的缩写，意味着最高权限的用户正在请求执行命令。任何
    sudo 条目都需要管理员密码，因此恶意软件或无意的键盘垃圾输入程序无法在不知道密码的情况下意外造成破坏。我们在书中使用的许多命令都需要 sudo 权限，所以如果命令执行失败并提示信息说明其没有足够的权限，你可以尝试使用
    sudo 重试。


    ## Apt


    学习终端（terminal）可以开启在图形用户界面（GUI）中无法使用的计算机功能。此外，你可以通过输入命令来代替操作，缩短完成许多任务所需的时间。以安装程序所需的工作量为例。如果你想下载
    Google Chromium 浏览器，你必须打开软件中心，输入程序名称，找到正确的包，将其标记为安装并执行操作。将其与在终端中输入“sudo apt-get
    install chromium-browser”相比，只需这一个命令，Ubuntu 就能为你节省很多分钟时间。


    Apt（高级软件包工具）是用于管理 Ubuntu 应用程序的关联命令。其他发行版可能使用自己的工具，但 apt 因其庞大的仓库和简单的命令而被广泛使用。软件包使用“apt-get
    install”格式进行安装，其中你指定想要安装的程序名称。在上面的示例中，我们通过包名“chromium-browser”指定了 Chromium 程序。由于你并不知道每一个包名，还有另一个命令“apt-cache
    search”，可以用于查找与提供的字符串匹配的包名。因此，“apt-cache search chromium”会显示“chromium-browser”，你就可以指定正确的名称进行安装了。


    apt 的有用性不仅限于此，你还可以使用几条命令用它更新系统中的每一个应用程序。使用“apt-get update”刷新仓库，然后使用“apt-get upgrade”让每个应用程序都自动升级到最新版本。Windows
    OS 用户应该对这种简便的过程感到羡慕，因为更新 Windows 程序需要卸载并重新安装最新版本。


    随着时间的推移，你可能需要更新 Ubuntu 版本。每年都会发布一个新版本，并且可以通过“apt-get dist-upgrade”进行安装。


    保持与最新修复和新增功能的同步，可以确保你的 Linux 系统能够健康地运行很长时间。你可能已经注意到，安装和更新系统不需要重启；这一特性有助于 Linux
    计算机实现长时间的运行时间并保持稳定性。最后，通过“apt-get remove”后接包名即可删除应用程序。


    运行我们安装的程序既可以从启动栏（dash）中搜索，也可以直接在终端中输入包名。输入“chromium-browser”启动它的效果与双击其图标相同。某些程序必须通过仅输入包名从命令行启动，因为这些包不会出现在启动栏搜索中。总的来说，利用终端是一个节省时间的方法，也是离开缓慢且笨拙的图形用户界面的绝佳方法。软件包的轻松安装和管理是
    Linux 的一个非常实用的功能——精通它将提升你的体验。安装软件包还有第三种方法，涉及从互联网下载并运行 .deb 文件。某些软件是以这种格式打包的，它们的作用类似于
    .exe 文件，只需要双击即可开始安装过程。


    ## 更多终端命令


    这里有更多几个你应该记在心底并在系统中使用的基础终端命令。完全理解基础知识将为你后续的构建打下坚实的基础。


    - - **cp** – `cp image1.jpg image2.jpg` – 将第一个参数复制（并重命名）到提供的第二个参数。使用 `-r` 开关复制目录。

    - - **mv** – `mv cat.jpg /home/Pictures` – 将指定的文件移动到给定目录。

    - - **shutdown** – `shutdown –h now` – 关闭计算机。`-h` 是一个表示“halt”（停止）的标签，你也可以使用 `-r`
    重启。`now` 指执行执行的时间。

    - - **date** – `date` – 显示当前日期时间。

    - - **free** – `free –g` – 显示程序的当前 RAM 使用情况。

    - - **du** – `du –h` – 显示硬盘使用情况。

    - - **ps** – `ps` – 显示使用 CPU 时间的活动进程。

    - - **touch** – `touch memo.txt` – 用于在当前目录下创建一个指定名称的新空文件。

    - - **ifconfig** – `ifconfig` – Linux 下等同于 ipconfig，它显示网络信息。


    某些命令带有相关的“标签”（tags）或“开关”（switches）。这些是以连字符开头的字母。它们的作用各不相同，要学习为了什么目的使用哪些开关，最好的方法是查看该命令的手册页。请参考高级章节查看如何打开手册。


    命令行中最实用的程序之一是 nano，它是一个简单的文本编辑器，可以编辑文件并快速更改设置或脚本。通过在命令行中输入“nano”来访问。你可以根据需要输入文件，然后按
    ctrl+x 保存并退出。你可以给它命名并关联文件扩展。在该示例中，我们打开编辑器显示其内容。Nano 可能非常简单，但无疑功能强大且节省时间。


    ## 连接 Windows / Mac 计算机


    Windows 和 OSX 计算机具有内置的网络功能，如工作组、域、共享等。将 Linux 计算机集成到由 Windows 服务器主的网络设施中相当容易，正确的设置将让你看到共享并加入公司域。


    通信的第一步是安装“samba”软件包。可以在软件中心找到它，或者输入“sudo apt-get install samba”来获取并安装。从 Ubuntu
    向其他计算机共享文件涉及创建 samba 共享。Samba 运行与其他文件方法相同的协议，因此从 Ubuntu 共享的文件可以轻松在 Windows 上看到。安装
    samba 后，使用“sudo nano /etc/samba/smb.conf”开始编辑配置文件。在文件的末尾添加这些行：


    | Key | Value |

    | :--- | :--- |

    | [share] | |

    | comment | File Share from Ubuntu |

    | path | /srv/samba/share |

    | browseable | yes |

    | guest ok | yes |

    | read only | no |

    | create mask | 0755 |


    现在，创建路径中指定的文件夹（sudo mkdir -p /srv/samba/share）并设置权限（sudo chown nobody:nogroup
    /srv/samba/share/），以便任何人都可以访问其内容。在该目录中放置任何想要共享的文件，然后重启服务（sudo restart smbd. sudo
    restart nmbd）以使共享生效。最后，登录你的另一台计算机并导航到网络共享。在 Windows 中，它们将出现在文件资源器的左侧面板。如果共享没有自动出现，将
    IP 输入到文件路径框中（通过 ifconfig 查找 Ubuntu IP）。你可能还需要在 Ubuntu 中查看其他操作系统的文件。首先，打开 Ubuntu
    文件资源管理器。从菜单栏点击“文件”，然后选择“连接到服务器”。在结果框中，输入你想要访问的共享 URL。它可以是 ftp 地址（ftp://test.com）、http
    地址（http://test.com）或共享地址（smb://share/Folder）。在任何额外的硬件或设置的情况下，你就可以这种方式看到文件。


    '
