    它们的行为与其他任何变量一样，不同在于它们是静态的，你无法改变它们。你使用的整数被称为字面量整数（literal integers）。它们可以带有如 U 或
    L 之类的后缀，分别代表无符号（unassigned）和长型（long）。这些变量被用于大写和小写，并可以很好地帮助你的进程运行。


    要理解整数字面量，请看以下示例：


    ```

    032uu      //非法：不能重复后缀

    078 octal digit //非法：8 不被视为

    0x_F //这个是合法的

    215        //这个是合法的

    212        //这个是合法的

    85         //这是一个十进制数

    30ul       //这是一个无符号长整型

    30l        //这个是长整型

    30u        //这是一个无符号整数

    30         //这是一个整数

    0x4b       //这个是一个十六进制数

    0213       //这是一个八进制数

    ```


    ## 浮点字面量


    这些是代码中包含一个整数、一个小数点、一个小数部分和一个指数部分的组成。这些可以通过科学计数法或十进制形式显示。


    当你选择使用小数点来表示这些字面量时，你需要确保至少添加了小数点，尽管也加上指数也是好的。当你通过科学计数法表示时，你应该包含小数部分、整数部分或两者兼顾。你所使用的符号指数也应该以
    E 或 e 开头。


    你在编写代码时可以使用的一些浮点字面量包括：


    ```

    .55 //这些是非法的，因为它们缺少小数或整数

    ```


    ```

    21of: //这些是非法的，因为它们没有指数或小数点

    ```


    ```

    510E //这些是非法的，因为指数不完整

    ```


    ```

    314159E-5L //这些是合法的

    ```


    ## 布尔字面量


    我们可以讨论的下一种字面量是布尔字面量。在 C++ 代码内部可以使用两种类型。基本上布尔值将显示为真 (true) 或假 (false)。如果你设置的条件为真，布尔表达式将输出为真。相反，如果你设置的条件不满足，你将得到一个为假的条件。所有布尔形式的答案都将输出真或假。


    ## 字符字面量


    当你在代码中看到字符字面量时，你会注意到它们是用单引号括起来。它们可以是简单的，使用像 ''x'' 这样的字符来告知命令，也可以很长。这些是你可以添加到代码中的基础内容，可以让处理变得容易得多。


    ## 字符串字面量


    另一种你可以操作的字面量是字符串字面量。这些是用双引号括起来的。字符串将包含类似于字符字面量的字符，包括通用字符、转义序列和普通字符等选项。你可以通过许多方式使用字符串字面量，包括将你的代码某一行拆分为两行，以及将内容分开以便更易阅读。你可以使用的字符串示例包括：


    ```

    "hello, Mother"

    "hello, \

    Mother"

    "hello, \"M\" \"other\"

    ```


