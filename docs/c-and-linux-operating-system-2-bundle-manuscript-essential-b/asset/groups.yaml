    # 引言


    计算机包含两个功能组件——软件和硬件。硬件是用于旋转、计算和利用电力执行计算的物理部分，而软件是一个更具虚拟的概念。本质上，软件由编程代码组成，它向硬件提供指令——告诉各个部分应该做什么。存在“高级”软件，如浏览器浏览器、文字处理器、音乐播放器等。但经常被忽视的组件是被称为操作系统的“低级”软件。


    我们的个人电脑运行需要操作系统。在办公室或使用相对廉价的台式电脑时，使用的操作系统可能是微软的 Windows。内容创作者、作家和图形艺术家更倾向于 Apple
    电脑，因为它们配备了专注于创造的 OSX 操作系统。Windows 和 OSX 这两个操作系统已经主导了消费市场多年。然而，存在另一种替代操作系统，它在可用性、定制性、安全性和价格方面表现出色。基于相对不知的
    Linux 的操作系统在所有这些领域都达到并超过了预期，但它仍然是一个许多人甚至听说过的冷门选项。


    Linux 本身并不是一个操作系统。它是一个内核，即操作系统的“核心”。正如 Windows NT 是 Windows 7 的内核一样，Linux 是 Ubuntu、Debian、Arch、Fedora
    等“发行版”的内核。


    但为什么有人会放弃熟悉的 Windows，转而选择一个未闻过的计算环境呢？Linux 不仅金钱上免费，而且兼容海量设备。旧电脑，特别是那些不再运行的电脑，可以通过
    Linux 操作系统重焕发生机，使其运行得像新的一样。


    本书将阐述切换到 Linux 的好处，并作为安装、配置和使用最流行发行版的初学者指南。然后，将解释终端命令行，说明如何以其他系统无法实现的方式利用该操作系统。切换到
    Linux 确实可以获得许多优势，通过阅读这本书，你可能会为你的电脑找到一个合适的主操作系统。


    # Linux 历史


    在 20 世纪 90 年代，Linus Torvalds 是芬兰的一名学生。当时的计算机通常运行在 DOS 或 UNIX 上，这两个操作系统在当时都是专有的且难以使用的。Torvalds
    试图创建一个自己的操作系统作为业余项目（基于 UNIX），但该项目迅速壮大，并吸引了更多开发者。内核不断演变，直到它是可移植的（可以在各种系统上使用）并且完全可以用于计算。内核不是操作系统，因此
    Linux 与 GNU 核心实用程序相结合，创建了一个类似于操作系统的计算环境。


    然后，第三方机构采用了基础 Linux 产品，并为其添加了他们自己的高级软件和功能，从而创建了 Linux“发行版”。直到今天，Linux 仍然是一个免费的业余项目，因此内核不断收到
    Torvalds 和社区的更新和修订。在整个 2000 年代，许多其他第三方看到了 Linux 环境的实用性，并开始将其整合到他们的生产环境和公司中。今天，Linux
