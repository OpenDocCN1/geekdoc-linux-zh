- md: '

    - Chrome OS – Another mobile-type OS developed by Google, Chrome OS is essentially
    a lightweight Linux browser meant for online use. Google has this OS preinstalled
    on their ChromeBooks, which have lower specifications than other laptops. But
    the OS is really only a full screen Chrome browser, so the OS is perfect for users
    wanting an uncomplicated experience or a dedicated Internet machine.


    - Tiny Core – An OS measured in megabytes, Tiny Core is for antique computers
    or embedded devices. This OS is mostly for intermediate users that have a hobby
    project or dedicated purpose in mind.


    - Damn Small Linux – Another minimal Linux variant, this OS is best for quick
    access to a Linux command line.


    - openSUSE – This is a distribution for experienced computer users. With many
    tools for administrators and program developers, openSUSE is the best OS for users
    confident in their skills.


    Positively the number of operating systems based off of the Linux kernel is astounding.
    With a huge amount of choices, you might be confused as to where to start and
    how to install it. When in doubt (and as we will demonstrate shortly), install
    Ubuntu or one of its variants. The OS is great for beginners and makes the Linux
    transition smoother. But as you increase in skill and wish to learn more about
    Linux, you can always install another operating system.


    ## Booting Into Linux


    If you are ready to take the plunge into a Linux based distribution, the first
    thing you must do is back up your files. Overwriting the OS on your hard drive
    will erase any data contained within, meaning you must back up any pictures, music,
    or files you wish to keep after the transition. Use an external hard drive, or
    an online data storage site (such as Google Drive) to temporarily hold your files.
    We are not responsible for you losing something important, back it up!


    Next we will need to choose an OS. This book will use Ubuntu 16.04 as an extended
    example, and it is recommended you do the same. Navigate to Canonical’s official
    website (http://www.ubuntu.com) and acquire a copy of the OS. You will download
    the image from the site to your computer.


    Next we need to obtain an installation media. This can be a DVD, USB drive, an
    SD card, or any other writable media that your computer can read. The only restriction
    is that the device must be able to hold an image as large as the OS download,
    so 4GB should suffice. Remove everything from the drive, as it will also be formatted.


    Download a tool for writing the image file. For DVDs install Imgburn (http://www.imgburn.com/),
    and for flash media download Rufus (https://rufus.akeo.ie/). The most common method
    of OS installation is to use a 4GB USB drive, and it is more recommended. Insert
    your media, start the appropriate program, select the OS image that was downloaded,
    and begin the writing process. It will take some time, as the image needs to be
    made bootable on the media. When it is finished, you can shut down your computer
    fully.


    This is the point to make double sure you are ready to install Linux. Check that
    your files are backed up, understand that you will be erasing your current OS,
    and preferably have a Windows/OSX install disc handy in case you decide to switch
    back. If you are indeed ready to switch, continue.


    With the installation media still inserted, turn on your computer. The first screen
    that you will see is the BIOS / UEFI POST screen, and it will give a keyboard
    button that you should press to enter setup. This screen shows every time you
    boot, but you probably pay no attention to it. Press the indicated key to enter
    the BIOS setup. If you are too slow, the screen will disappear and your usual
    OS will begin to load. If this happens, simply shut the computer back down and
    try again.


    Once within the BIOS / UEFI, you will have to navigate to the “boot order” settings.
    Every computer''s BIOS / UEFI is slightly different, so we cannot explain the
    process in detail. But generally you can follow button prompts at the bottom of
    the screen to understand how to navigate. After arriving at the boot order settings,
    place your boot medium at the top of the list. As an example, if you used a USB
    drive, then you would see its name and have to bring it to the top of the list.
    These settings control the order in which the PC searches for operating systems.
    With our boot medium at the top of the list, it will boot into our downloaded
    Linux image instead of our usual OS. Save your settings and restart the computer.
    If everything was done correctly the computer will begin to boot into Ubuntu.


    But if something goes wrong, try troubleshooting it with these tips:


    - Primary OS boots instead of Linux – You probably did not save the settings with
    your alternate boot medium at the top of the list. The PC is still defaulting
    to the internal HDD to boot.


    - “No boot media found” – Did you “drag and drop” your Linux image onto the media
    instead of writing it? Without explicitly telling the computer it is bootable,
    it will not know what to do with the data files on the media. Alternatively, you
    could have a corrupted download, or an incomplete write. Try downloading the image
    again and making another installation.


    - “Kernel Panic” – Something is wrong with the boot process. See above for the
    possibility of a corrupted installation. Otherwise, the image you are trying to
    install may not be compatible with your hardware. IF you see any other error messages,
    do an Internet search on them. For prebuilt computers and laptops, search for
    the model name and Linux to find other user’s experiences. Finally, you might
    have attempted to install a 64-bit image on a 32-bit computer. With your next
    download, specifically select a 32-bit image.


    - “Problem reading data from CD-ROM...” – Try using a different install medium,
    because some distributions no longer support CD and DVD installations. USB drives
    are recommended.


    - PC seems to boot, but there is nothing at all on the screen – If you are using
    a dedicated card (compared to integrated GFX from the CPU), Linux might not be
    recognizing it completely. Plug your monitor into the motherboard directly instead
    of the card.


    But most of those problems are rare or simply due to user error. Linux has high
    compatibility and is relatively easy to install/use past the initial installation.
    The typical user will have Ubuntu boot successfully at this point, and they will
    be presented with a working computing environment.


    The desktop you see is referred to as a “Live CD”, which is pretty much a demonstration
    of the OS and how it works. You have not actually installed the OS to your hard
    drive yet, as it is still running directly from your boot media. It is a chance
    for you to test out Linux without actually removing your primary OS, so take the
    opportunity to explore how Linux works.


    ## Ubuntu Basics


    Similar to Windows, Ubuntu has a desktop graphical user interface. Applications
    open within Windows that can be maximized, minimized, closed, and moved around
    with the top bar. Ubuntu also has a “task bar” of sorts that functions much like
    its Windows counterpart icons resemble programs that can be launched by clicking
    on them. The “Windows Button” (called the Dash Button) on the task bar is used
    to open a search functionality from which you can type in the name of a program
    or file on your computer to quickly start it.


    Furthermore, there is a bar at the top of the screen that works like the “menu”
    bar of other operating systems. This is where drop-down menus such as “file”,
    “edit”, “help”, etc... will appear once a program is active.


    Besides a few nominal differences Ubuntu functions is a very familiar way. In
    fact, many of the programs that you may already use on other operating systems,
    such as Firefox, are available and sometimes preinstalled on Linux distributions.
    With enough experimentation and practice, you will be able to navigate the GUI
    of Ubuntu as if you were a professional. Continue exploring the system, and continue
    if you are ready to replace your main operating system with this Linux one.

    '
  mdcn: '


    - Chrome OS – 由 Google 开发的另一种移动类型操作系统，Chrome OS 本质上是一个用于在线使用的轻量级 Linux 浏览器。Google
    在其 ChromeBook 上预装了该系统，这些电脑的配置比其他笔记本电脑低。但该系统实际上只是一个全屏 Chrome 浏览器，因此它非常适合想要简单体验或需要专用上网设备的用户。


    - Tiny Core – 这是一个大小单位为 MB 的操作系统，Tiny Core 适用于老旧电脑或嵌入式设备。该系统主要面向有兴趣项目或特定用途的中级级用户。


    - Damn Small Linux (DSL) – 另一种极简的 Linux 变体，该系统最适合快速访问 Linux 命令行。


    - openSUSE – 这是一个为经验丰富的计算机用户设计的发行版。openSUSE 为管理员和程序开发人员提供了许多工具，是那些对自己技能有自信的用户的最佳操作系统。


    基于 Linux 内核的操作系统数量之多令人惊叹。面对海量的选择，你可能会对从何开始以及如何安装感到困惑。如果有疑问（正如我们稍后将演示的那样），请安装 Ubuntu
    或其变体。该系统非常适合初学者，并让向 Linux 的过渡更加顺畅。但随着你技能的提高并希望了解更多 Linux 知识，你也可以随时安装另一个操作系统。


    ## 进入 Linux 系统


    如果你准备好投身 Linux 发行版，必须做的第一件事就是备份你的文件。覆盖硬盘上的操作系统将擦除其中的任何数据，这意味着你必须备份任何在转换后想要保留的图片、音乐或文件。使用外部硬盘或在线数据存储网站（如
    Google Drive）来临时存放你的文件。我们对你丢失重要物品不负责，请务必备份！


    接下来，我们需要选择一个操作系统。本书将使用 Ubuntu 16.04 作为扩展示例，建议你也这样做。访问 Canonical 官方网站（http://www.ubuntu.com）并获取该操作系统的副本。你将从网站下载镜像到你的电脑上。


    接下来，我们需要获取安装介质。这可以是 DVD、USB 闪存、SD 卡或你的电脑可以读取的任何可写介质。唯一的限制是设备必须能够容纳与操作系统下载文件等大的镜像，因此
    4GB 空间就足够了。请清空驱动器上的所有内容，因为它将被格式化。


    下载一个用于写入镜像文件的工具。对于 DVD，安装 Imgburn (http://www.imgburn.com/)；对于闪存媒体，下载 Rufus (https://rufus.akeo.ie/)。常用的操作系统安装方法是使用
    4GB 的 USB 盘，且更推荐这种方法。插入你的介质，启动相应的程序，选择下载的操作系统镜像，并开始写入过程。这需要一些时间，因为镜像需要在介质上制作成可启动状态。完成后，你可以完全关闭电脑。


    现在是双重确认你已准备好安装 Linux 的时候。检查文件是否已备份，明确你将擦除当前的操作系统，并且最好手头留有一个 Windows/OSX 安装盘，以防你决定切换回。如果你确实准备好切换了，请继续。


    在保持安装介质插入的情况下，打开电脑。你看到的第一个屏幕是 BIOS / UEFI POST 界面，它会显示一个你应该按下的键盘键以进入设置。这个屏幕在每次启动时都会显示，但你可能没有注意它。按下指定的按键进入
    BIOS 设置。如果你操作太慢，屏幕将会消失，你常用的操作系统将开始加载。如果发生这种情况，只需关掉电脑并重试。


    进入 BIOS / UEFI 后，你必须导航到“启动顺序”（boot order）设置。每台电脑的 BIOS / UEFI 略有不同，因此我们无法详细解释这一过程。但通常你可以遵循屏幕底部的按钮提示来了解如何导航。到达启动顺序设置后，将你的启动介质置于列表顶部。例如，如果你使用了
    USB 盘，你会看到它的名称并必须将其移至列表顶部。这些设置控制了 PC 搜索操作系统的顺序。将我们的启动介质置于列表顶部后，它将启动我们下载的 Linux
    镜像，而不是常用的操作系统。保存设置并重启电脑。如果一切操作正确，电脑将开始进入 Ubuntu。


    但如果出现任何问题，请尝试通过以下提示进行故障：


    - 启动了主系统而非 Linux – 你可能没有保存将备用启动介质置于列表顶部的设置。PC 仍然默认从内部硬盘启动。


    - “未找到启动介质”（No boot media found）—— 你是否是直接将 Linux 镜像“拖放”到介质上，而不是写入它？如果不显式告诉电脑它是可启动的，它将不知道如何处理介质上的数据文件。或者，你可能是下载的文件损坏或写入不完整。尝试重新下载镜像并再次进行安装。


    - “内核恐慌”（Kernel Panic）—— 启动过程出现问题。请参考上文关于安装损坏的可能性。否则，尝试安装的镜像可能与你的硬件不兼容。如果你看到任何其他错误信息，请在网上搜索。对于预装电脑和笔记本电脑，搜索模型名称以及其他用户的体验。最后，你可能尝试安装了
    64 位镜像。在下次下载时，请具体选择 32 位镜像。


    - “从 CD-ROM 读取数据问题...”—— 尝试使用不同的安装介质，因为某些发行版不再支持 CD 和 DVD 安装。推荐使用 USB 盘。


    - PC 似乎启动了，但屏幕上一空白 – 如果你使用的是独立显卡（相对于 CPU 集成显），Linux 可能无法完全识别它。请将显示器直接插在主板而非显卡上。


    但大多数问题都是罕见的，或由于用户操作错误。Linux 具有良好的兼容性，且在初始安装后容易使用。此时，典型用户已成功启动 Ubuntu，并获得一个运行的工作环境。


    你看到的桌面被称为“Live 系统”，它实际上是该操作系统及其工作方式的演示。你尚未将操作系统安装到硬盘上，因为它仍然直接从启动介质运行。这是一个让你在不删除主操作系统的情况下测试
    Linux 的机会，请利用此机会探索 Linux。


    ## Ubuntu 基础


    与 Windows 类似，Ubuntu 拥有桌面图形用户界面。应用程序在窗口中打开，可以最大化、最小化、关闭并在顶栏移动。Ubuntu 也有某种类似于“任务栏”，其功能与
    Windows 版本相似，图标代表点击即可启动的程序。任务栏上的“Windows 按钮”（称为 Dash 按钮）用于打开搜索功能，你可以在其中输入电脑上的程序或文件名来快速启动它。


    此外，屏幕顶部有一个栏，类似于其他操作系统的“菜单”栏。当程序激活时，这里会显示“文件”、“编辑”、“帮助”等下拉菜单。


    除了一些细微的差异外，Ubuntu 的运行方式非常熟悉。事实上，许多你可能在其他操作系统上使用的程序（如 Firefox）在 Linux 发行版中均可用，有时甚至是预装。通过足够的尝试和练习，你将像专业人士一样操作
    Ubuntu 的 GUI。继续探索系统，如果你准备好用这个 Linux 系统替换你的主操作系统，请继续。


