    ## Why It''s used


    C++ is used not only for its flexibility and speed, but because it has a lot of
    components, it is fairly easy to learn, and if you master C++, you can master
    the other languages with ease. The reason for this is that when you learn something
    is a little more complex than everything else first, the easier stuff will fall
    right into place, however, if you are used to easy to learn subjects, then you
    will find that the more difficult stuff is hard to learn because you are not used
    to putting in that much effort into the subject that you are trying to learn.


    If you want to learn a language that you can use for different types of functions
    within the realm of computer technology, then this is the language for you. You
    can do almost anything with it, and once you learn enough about it, you may be
    able to figure out ways to manipulate the language to do things that it generally
    cannot do.


    C++ is a very important language when it comes to computer programming, and though
    it has a lot of variables from the way that it is laid out, it is very easy to
    read, and very easy to create. This makes it one of the most desired programming
    languages that are out there, because no one wants to struggle to read code. No
    one wants to have to spend all of their time out there working on what they know
    is right just because they cannot find where they went wrong.


    ## Job Outlook


    Yes, there are a lot of jobs out there that still rely on C++ to operate. There
    are so many different things that you could do, and all of them affect other people
    in the community. Video game designing, and web page designing are two of the
    most prominent things that are out there. You could also become a white hat or
    blue hat hacker.


    But according to payscale.com (search software engineer), a person with C++ Software
    engineer background can earn up to $57,000 to $120,000 based on experience. The
    median is around $80,363. Some other titles that people with C++ programming language
    have is Computer Programmer, Electrical Engineer, and Application Developer.


    However, to be the best that you can be, you should always know two or three programming
    languages to be marketable. Though those languages will not be included in this
    book, do not marry yourself to a single language. Instead, just like with human
    language, broaden your horizons and dabble in a few, but keep one as your main
    language.


    C++ should be the main language that you fall back on due to its versatility.
    Maybe JAVA or Linux as your other languages, but C++ is the best main language
    to have, and you only want the best as your main.


    C++ is a statically written lower level language which means that it is a clean
    cut expansive language.


    C++ is a fully functional superset of C that supports object oriented programming.
    This means that it supports all the pillars of OOP, such as encapsulation, data
    hiding, inheritance and polymorphism.


    To learn more about object oriented programming, you can do a quick search online,
    and find out more about it. It is best to get some knowledge about what it is,
    but it is not quintessential to your knowledge of C++, so it will not really be
    included in this book, except for a few mentions in passing, and some tidbits
    of information here and there.


    ## Three Important Components of C++


    The standard C++ is made up of three very important concepts.


    - Core Language: This is made up of all the variables, data types, literals, and
    other important aspects of the language, creating building blocks to get to the
    next level.

    - C++ Standard Library: this allows you to manipulate files, and other workings
    within the language, and bend them to your will.

    - STL: This stands for Standard Template Library, which gives you functions to
    manipulate data structures and variables and other things of the sort.


    ## Why is C++ considered the best language out there?


    Well, aside from the copiously mentioned flexibility, speed, and simplicity, it
    is a language that has spanned over thirty years, and is still widely used today.
    There are not many products in any genre of life out there that can say the same.
    Products and companies come and go, but only perfection stays. Well that is how
    the saying goes. To be honest, C++ has had many updates since then, but the core
    process is still the same. When it came out it was light years ahead of its time,
    and today it is still a pretty pretty advanced piece of technology, due to the
    updates that keep it on top.


    There are a lot of opinions that also have to do with why C++ is considered the
    best. While there are a lot of people who say that C++ is no longer relevant,
    even more vouch that it is still the best language out there, and it is their
    fallback language. It is the one they know the most about, and the one they carry
    close to their heart. The reasons vary, but the fact that 90% of programmers default
    to C++ shows that it is very much the best programming language out there today.


    C++ is one of the few languages that follow the ANSI standard completely, which
    is why some of the best games you will ever play are still written with C++. Because
    their compilers are set to ensure that all commands are written and executed without
    errors. It can also be used across many different types of platforms, whether
    you have a Microsoft, Mac, Unix, Windows, or Alpha device, it is possible to use
    C++. This is a great thing, because a lot of programmers have to operate across
    many different platforms, and the universality makes it easy and portable. Just
    throw your code on a flash drive and upload it wherever it is needed.


    ## Benefits of using the C++ language


    There are a lot of benefits that you will be able to enjoy when using the C++
    language. Some of these benefits include:


    - The big library: since C++ has been around for a long time, they have a library
    that is pretty large. This is available for you to use so you can pick the codes
    that you want inside of your script and save some time and even learn some new
    things. You can also create some of your own codes if you wish, but this library
    can be really helpful for the beginner who is learning and can make it easier
    than ever to get the code written.

    - Ability to work with other languages: C++ is a great language to use with some
    of the other languages out there. This makes it easier to really work on the projects
    that you want because you can add in the parts that you like from different coding
    languages and combine them together.

    - Works on many projects: most other programming languages are going to focus
    on just one or two little projects. For example, using JavaScript means that you
    are going to be working on websites. But with C++, you are able to use it to help
    with a lot of different projects. Whether you are looking to work on a website,
    looking to create a new program, or do something else with programming, you will
    be able to do it with the help of C++.

    - Fast and reliable: if you have used some of the other coding languages that
    are popular in the past, you will find that sometimes they aren''t the most reliable.
    Information may slip through or they won''t start working the way you would like.
    If you want something that works the first time and is reliable, then it is a
    good idea to go with C++.

    - Offers a lot of power: those who like to work in programming and want to have
    a lot of power in the work that they are doing will find that C++ is the right
    option for them to choose. It has some of the best power for the programming languages
    that are out there.


    These are just a few of the benefits you can enjoy when you are using the C++
    programming language. It may seem a bit more difficult to use some of the others,
    such as Python, but it has a lot of the power that you need and can work well
    with other programming languages. With a bit of practice, you are going to get
    all the basics of this language down and really enjoy what you are able to do
    with this programming language.

    '
  mdcn: '

    这些是使用 C++ 编写的。这是因为这种语言具有极强的扩展性，既可以用于简单的游戏，也可以用于复杂的购物应用程序。


    C++ 还被用于许多其他细微领域，例如 VoIP 通话。它是使用 C++ 创建的。事实是，你会一次又一次地听到 C++ 是一门死掉的语言，但实际上，这只是
    JAVA 人为了恐吓人们切换语言而使用的诡计，以确保 C++ 成为门死掉的语言。


    ## 为什么使用它


    使用 C++ 不仅是因为它的灵活性和速度，因为它包含许多组件，相对容易学习，而且如果你精通 C++，就可以轻松地掌握其他语言。原因在于，当你先学习一些比其他东西稍微复杂一点的内容时，较简单的内容就会迎刃而解；然而，如果你习惯了容易学习的科目，那么你会发现更困难的内容很难学习，因为你不习惯在正尝试学习的科目上投入那么多精力。


    如果你想学习一种可以在计算机技术领域用于不同类型函数的语言，那么这种语言就适合你。你可以用它做几乎任何事情，一旦你对它有了足够的了解，你可能找到操纵这种语言来完成它通常无法做的事情的方法。


    C++ 是计算机编程领域一种非常重要的语言，尽管由于其布局方式有很多变量，但它非常易读，也非常容易创建。这使其成为世界上最受青的编程语言之一，因为没有人想挣扎于阅读代码。没有人想把所有时间花在那些他们知道是正确的事情上，仅仅因为他们找不到哪里出错了。


    ## 职业前景


    是的，市场上仍有很多工作依赖于 C++ 运行。你可以做许多不同的事情，而且所有这些事情都会影响社区中的其他人。视频游戏设计和网页设计是目前该领域最著名的两个方向。你还可以成为一名白帽或蓝帽黑客。


    但根据 payscale.com（搜索软件工程师）的数据，具有 C++ 软件工程师背景的人根据经验可以赚取高达 57,000 到 120,000 美元。中位数约为
    80,363 美元。拥有 C++ 编程语言背景的人的其他职称还包括计算机程序员、电气工程师和应用程序开发人员。


    然而，为了做到最好，你应该始终掌握两到三种编程语言以保持竞争力。虽然这些语言不会包含在书中，但不要让自己迷迷于某一种语言。相反，就像人类语言一样，拓宽你的视野并涉猎几种，但保持一种作为你的主语言。


    由于其多功能性，C++ 应该是你首选的主语言。也许 JAVA 或 Linux 是你的其他语言，但 C++ 是最好的主语言，而你只想把最好的作为主语言。


    C++ 是一门静态编写的低级语言，这意味着它是一门简洁且扩展的语言。


    C++ 是 C 的功能完备超集，支持面向对象编程。这意味着它支持 OOP 的所有支柱，如封装、数据隐藏、继承和多态。


    要学习更多关于面向对象编程的知识，你可以在网上快速搜索并发现更多信息。最好获得关于它的一些知识，但它对你 C++ 的知识并不是至关重要的，因此它不会真正包含在书中，除了几次带过的提到，以及这里那里的一些零碎信息外。


    ## C++ 的三个重要组件


    标准 C++ 由三个非常重要的概念组成。


    - 核心语言（Core Language）：这由语言的所有变量、数据类型、字面量和语言的其他重要方面组成，创建了通往下一阶段的基石。

    - C++ 标准库（C++ Standard Library）：这允许你操作文件以及语言内部的其他工作，并按照你的意愿支配它们。

    - STL：代表标准模板库（Standard Template Library），它为你提供了操作数据结构、变量及类似内容的函数。


    ## 为什么 C++ 被认为是最好的语言？


    嗯，除了反复提到的灵活性、速度和简单性，它是一门跨越了三十多年的语言，并且今天仍被广泛使用。在生活的任何领域中，没有多少产品可以证明这一点。产品和公司来去去，但只有完美长存。好吧，俗语是这么说的。老实说，从那时起
    C++ 有很多更新，但核心过程仍然没有变化。在它出来时，它领先时代光年，今天由于不断使其保持领先地位的更新，它仍然是一项非常先进的技术。


    关于为什么 C++ 被认为是最好的语言，还有很多观点。虽然有许多人说 C++ 不再适用，但更多的人认为它仍然是世界上最好的语言，并且是他们的后备语言。这是他们最熟悉的语言，也是他们放在心上的语言。原因各异，但
    90% 的程序员默认使用 C++，这表明它是当今最好的编程语言。


    C++ 是少数完全遵循 ANSI 标准的语言之一，这就是为什么你玩过的最好的游戏之一仍然是用 C++ 编写的。因为它们的编译器被设置为确保所有命令在编写和执行时均无错误。它还可以用于许多不同类型的平台，无论你拥有微软、Mac、Unix、Windows
    还是 Alpha 设备，都可以使用 C++。这是一件好事，因为许多程序员必须在许多不同的平台之间操作，而这种通用性使其变得易用且可移植。只需将你的代码丢进优
    盘，并上传到任何需要的地方。


    ## 使用 C++ 语言的优势


    在使用 C++ 语言时，你将享受到许多优点。其中一些优点包括：


    - 大库：由于 C++ 已经存在很长时间，他们有一个非常庞大的库。这供你使用，你可以在脚本中选择你需要的代码并节省时间甚至学习一些新知识。如果你愿意，也可以创建一些自己的代码，但这个库对于正在学习的初学者非常有帮助，可以让代码编写变得比以往任何时候都容易。

    - 与其他语言协作的能力：C++ 是一种与其他某些语言配合使用的很棒语言。这让你更容易真正从事你想要的项目，因为你可以从不同的代码语言中添加你喜欢的部分并将它们结合。

    - 适用于许多项目：大多数其他编程语言将只专注于一个或两个小项目。例如，使用 JavaScript 意味着你将在处理网站。但通过 C++，你可以使用它来帮助许多不同的项目。无论你是想开发网站、创建新程序还是用编程做其他事情，你都可以在
    C++ 的帮助下完成。

    - 快速且可靠：如果你使用过过去流行的其他代码语言，你会发现它们有时并不那么可靠。信息可能会泄露，或者它们不会按照你想要的方式运行。如果你想要一种一次性运行且可靠的东西，那么选择
    C++ 是个好主意。

    - 提供强大的功能：那些喜欢编程并希望在他们的工作中拥有强大功能的人会发现 C++ 是他们选择的正确选项。它拥有世界上编程语言中最强大的功能。


    这些只是当你使用 C++ 编程语言时可以享到的部分优点。使用某些其他语言（如 Python）可能看起来更难一些，但它拥有你需要的很多功能，并且可以与其他编程语言良好协作。通过一些练习，你将掌握这种语言的所有基础，并真正享受你用这种编程语言所能做的一切。


    '
