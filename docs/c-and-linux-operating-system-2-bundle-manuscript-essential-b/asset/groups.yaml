    ## 第 6 章：常量与各种类型的字面量


    这门语言是非常复杂的，尽管你上面学到的足够运行一些简单的函数，但这门语言还有许多部分需要学习，如果不在这里提供更深入的知识来帮助你过渡到下一个阶段，那将是一种遗憾。


