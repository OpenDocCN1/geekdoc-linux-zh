    # 第一章：基础背景、历史与 C++ 的成果


    在我们开始学习如何使用 C++ 之前，你必须了解它是什么以及它是如何产生的。原因很简单：要真正了解某事，你必须了解关于该主题可能学到的一切，特别是当涉及到计算机编程这样技术性很领域时。


    C++ 是计算机和互联网历史上非常重要的一部分。它简单地交织在我们今天所知的科技世界历史之中。此外，如果没有 C++，智能手机上的应用和其他功能将不复存在。


    当你学习 C++ 时，你会对一种编程语言竟然对我们的日常生活产生如此巨大的影响感到惊奇。几乎每一台制造过的计算机都可以归功于 C++ 语言的特定方面。学习这种语言的好处之一是能够轻松学习其他语言。拥有学习
    C++ 的能力将增强你对其他编程语言的理解，这就是为什么许多人 ways“教父”。


    # C++ 的历史


    Bjarne Stroustrup 在写他的论文时，他决定使用 Simula。这种语言是最早面向对象的语言之一。然而它运行非常慢。Stroustrup 想要创建一个既具有面向对象编程特性又具有
    C 速度的语言。于是他提出了 C++，它最初被称为“带类的 C”。1983 年，该语言被重命名为 C++。


    # 什么是 C++


    C++ 不仅仅是任何编程语言，它是面向对象的。面向对象编程（简称 OOP）是围绕对象而非动作的编程。它就像是一次性观察整个画面，而不是每一块拼图碎片。


    这种编程语言的设计考虑了灵活性和速度，因为当时的其他语言太慢了，而且只能做一件事。所以，每当你想要创建新东西时，都需要 C++。你可以用这种语言做很多事情，尽管现在有数不胜目的语言，但它们仍然非常流行。


    - 预制脚本：这些是脚本爱好者和新黑客用来练习编程技术的内容。由于现在许多人想走捷径，预先准备好的脚本是大多数黑客正在寻找的，因此这些包需要改进，而他们使用
    C++ 实现了这一点。

    - 视频游戏：面对现实吧，每个人在人生的某个时候都玩过视频游戏。无论是长大还是有了孩子，你都会陷入视频游戏的世界，并且永远无法逃脱。那些游戏可以在某种程度上归功于
    C++ 语言的使用。如果你热衷于制作游戏，并通过图形为世界带来快乐，那么学习 C++ 语言绝对是一个好主意。

    - 网页：许多网页是使用 C++ 制作的。其原因是这种语言非常易于操作，它可以快速方便地创建一个为人们提供许多交互功能的网站。你可能经常访问的由 C++ 创建的网站包括
    Amazon 和 Ebay。

