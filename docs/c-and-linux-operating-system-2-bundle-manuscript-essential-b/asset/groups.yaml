  mdcn: "\nCout- 此指令指示程序在屏幕上显示你想显示的消息。如果你不使用 `cout`，你的程序可能会失败，也可能不会失败。问题在于你不知道自己是否成功了，所以如果你想确保一切运行得顺畅，请务必添加\
    \ `cout`。\n\nReturn- 这会将值返回回 0，并终止函数。它指令程序结束进程并回到开头。\n\n现在来编译并执行你的第一个个正式的 C++\
    \ 程序了。\n\n首先，你必须知道如何保存文件。打开你选择的文本编辑器，输入上方看到的代码。完成后，点击“另存为”，并选择一个容易找到的文件位置。为了方便组织管理，最好为你的所有程序准备一个单独的文件夹。将文件保存为\
    \ `hello.cpp`，一旦保存完成，在进入文件所在的目录之前，你应该先打开命令提示符。\n\n要让文件在你的编译器中打开，首先输入 `g++ hello.cpp`。然后你可以按回车键，代码就会被正确打开。只要没有错误，提示符将生成一个\
    \ `a.out` 可执行文件。要运行该程序，输入 `./a.out` 并查看编译器的运行情况。从计算机的编译器中你应该获得的信息包括：\n\n```\n\
    $ g++ hello.cpp\n```\n\n```\n$ ./a.out\n```\n\n### 尝试一下\n\n确保你正在以正确的方式输入所有变量，并记住，这些内容是**区分大小写**的。如果你不以正确的方式输入，你会发现事情往往会出错。编码的关键在于你必须有方向感并注意细节！然而，只要愿意注意，任何人都能做到。\n\
    \n基础的函数命令并不是你唯一需要使用的内容。在构建提示符时，还有其他一些重要的内容，因为它们也会指令程序执行特定的任务。其中一些内容是代码块和分号。\n\n\
    当你想到分号时，你可能认为它是句子中的一个停顿，然而，在 C++ 程序中它们是完全的停止。分号表示语句的结束。这意味着每一个单独的语句都必须通过使用分号来标记。以下是三个不同的语句。\n\
    \n```\nx=y;\ny=y+1;\nadd(x,y);\n```\n\n这些每一个语句之间不仅通过换行符分隔，还通过分号隔开。你也可以这样做：\n\n\
    ```\nx=y; y=y+1; add(x,y);\n```\n\n仅仅因为分号的存在，每一个都会被识别为独立的语句。如此简单的事情竟然能产生如此大的影响，真是令人大为惊。\n\
    \n在这个编程语言中，代码块（block）将是一组用括号括起来的语句。这些语句是程序由于主命令提示符显示在屏幕上的逻辑实体。例如：\n\n```\n{\n\
    \    cout << \"I like Pizza\"; // 打印 I like Pizza\n    return 0;\n}\n```\n\n行的末尾并不是终止符（如上文所示）。分号是终止语句的唯一东西。\n\
    \n# 标识符 (Identifiers)\n\n现在让我们转向程序中的标识符。这些标识符用于标识多个事物，例如块内的类、模块、函数和变量。标识符是一组字母和数字，你可以用它们来命名你的程序或文件，它们必须以字母开头，之后可以包含任何你想要的字母或数字。除了句子中可能看到的标点符号外，不允许作为标识符。你看不到如\
    \ `@`、`&`、`%` 或 `$` 这样的字符，且编程是区分大小写的。这意味着 `YokoOno` 与 `Yokono`、`yokoOno` 和 `yokoonoon`\
    \ 是不同的。确保你在程序中只大写那些应该大写的字母。\n\n虽然几乎任何东西都可以是标识符，但 C++ 中有些内容是留给关键字（keywords）的，不能作为标识符使用。这些单词如下：\n\
    \n| asm | | |\n|---|---|---|\n| Break | Bool | Auto |\n| Char | Catch | Case |\n\
    | Const cast | Const | Class |\n| Delete | Default | Continue |\n| Dynamic_cast\
    \ | Double | Do |\n| Explicit | Enum | Else |\n| False | Extern | Export |\n|\
    \ Friend | For | Float |\n| Inline | If | Goto |\n| Mutable | Long | Int |\n|\
    \ Protected | Private | Namespace |\n| Reinterpret_cast | Register | Public |\n\
    | Signed | Short | Return |\n| Static_cast | Static | Sizeof |\n| Template | Switch\
    \ | Struct |\n| True | Throw | This |\n| Typeid | Typedef | Try |\n| Unsigned\
    \ | Long | Typename |\n| Void | Virtual | Using |\n|---|---|---|\n| While | Wchar\
    \ | Volatile |\n\n在标识符方面，其他所有内容都是的。将标识符想象成用户名和密码。混合使用，但要确保它们是功能性的。\n\n# 三元组 (Trigraphs)\n\
    \n三元组是代表单个字符的三个序列。你会注意到这些，因为它们以两个问号开头。使用三个字符看起来有些冗余，但其背后的原因是这里是一些常用的三元组：\n\n```\n\
    ??= | #\n??/ | \\\n??^ | ^\n??( | [\n??) | ]\n??! | |\n??< | {\n??> | }\n??- |\
    \ ~\n```\n\n由于不支持，大多数人都会避开它们。\n\n# 空格 (Whitespace)\n\n现在来看空白格。这是程序中的空行。它们有时包含注释，这些注释被称为空白。编译器完全忽略它们。空白描述了空格、制表符和字符。\n\
    \n变量和语句之间应该至少留一行空白。\n\n# 测 (QUIZ)\n\n你以为你可以在不测试的情况下就走完这本书吗？如果你在看答案，不要作弊！仅仅你可以看答案并不意味着你应该这样做。你应该像正常测试一样来做，以真正测试你的知识，以便判断你是否需要回去重读。这是一个短测，所以你会没事的。\n\
    \n- 什么是空白格？\n- 填空：>>\"x=y+1\";\n- 什么是三元组？\n- 谁发明了带类的语言？\n- 大多数函数使用的头文件是什么？\n\n\
    # 答案 (Answers)\n\n- 编译器忽略的空格或注释\n- cout << \"x=y+1\";\n- 代表单个字符的三个序列\n- Bjarne\
    \ Stroustrup\n- <iostream>\n\n恭喜，如果你五个都对了，那么你就可以进入下一节了！然而，如果你错了一个以上，你可能应该回去重读该节。如果你准备好了，继续进入\n\
    第3章\n\n# 第3章：深入研究程序注释、数据类型、行和字符\n\n现在我们已经涵盖了 C++ 的基础知识，是时候进入一些围绕围绕的更深入的主题了。虽然这些很深入，但它们仍然是初学者需要学习的核心概念。\n\
    \n# 程序注释 (Program Comments)\n\n所以，你会有这样的想法在代码中写一些注释。这些注释很重要，因为它们允许你在代码中留下一条小信息，以便以后阅读的人能够很好地查看代码是如何运行的，并对你试图实现的目标提供“参考”。此外，在代码行中留下笔记是提醒自己代码可能出错的好方法。通过在代码中放置注释，你正在\n"
