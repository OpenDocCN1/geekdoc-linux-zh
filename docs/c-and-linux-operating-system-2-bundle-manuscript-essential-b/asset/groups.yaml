    - **蓝帽黑客**：这些是黑客世界的蓝领工人。他们坐在隔间里，整天黑客以为微软或其他大公司寻找漏洞。他们做着九点五的工作，而这份工作恰好涉及黑客。\n\n\
    这些是黑客的主要分类。还有精英黑客，他们一生致力于成为世界上见过的最好的黑客；以及绿帽黑客，他们并不在乎黑客，只是为了好玩。黑客可以是一种非常有用的工具，如果你方法正确，甚至可以成为一种职业。\n\
