    # 脚本编程


    Bash 是终端的“编程语言”。当我们输入命令时，我们是在 bash 环境内操作的。脚本是一系列按顺序执行的 bash 命令列表，这意味着我们可以创建一个包含命令列表的脚本并运行，以节省时间或自动化我们通常需要手动输入的终端任务。作为一名中高级
    Linux 管理员，你可以使用脚本极大地缩短重复性或持续运行任务所需的工作量。


    要启动脚本，在 nano 中创建一个新文件“script.sh”。第一行必须始终是“#!/bin/bash”，以将其标记为 bash 脚本。为你的第一个脚本输入以下行：


    ```

    echo “What is your name?”

    ```


    ```

    read name

    ```


    ```

    echo “Hey, $name. Here is your current directory, followed by the files.”

    ```


    pwd


    ls


    保存脚本。现在我们必须设置权限允许其运行。使用“sudo chmod 777 script.sh”，然后用“./script.sh”运行脚本。只要你完整地复制了脚本，它就会询问你的名字，然后显示你的目录和文件。获取这一概念并在你自己的脚本中进一步扩展它。你也可以运行已安装程序的命令，因此你可以编写一个自动加入域的脚本，或者编写一个连接到指定网络的脚本。关机远程计算机也是一项很棒的自动化任务。


    脚本可以手动运行，也可以设置为在特定时间执行。若要在用户每次登录时都运行某个脚本，从 dash 中打开“启动应用程序”程序，并以脚本为源创建一个新应用。现在每当用户登录时，脚本会自动运行。这对于设置某些选项或启动后台服务非常有用，无需用户亲自操作。


    可以使用 Cron 系统守护进程为特定时间调度任务。它在某些系统上默认安装，如果没有，可以使用“sudo apt-get install cron”。使用“service
    cron start”启动服务，并用“crontab -e”创建一个新的 crontab 文件。选择 nano 作为你的文本编辑器。在创建的文件底部，添加带有我们调度任务的新行。格式如下：


    分钟，小时，日期，月份，星期，命令


    我们通过这些选项进行格式化以指定运行命令的时间。时间数字从 0 开始，所以小时范围是 0 到 23，分钟是 0 到 59。用星号替换任何选项以表示它将运行任何值。注意这些示例：


    ```

    0 12 * * ~/script.sh

    ```


    这将在每天中午运行家目录目录下的 script.sh。


    ```

    30 18 25 12 * /usr/bin/scripts/test.sh

    ```


    这将在每年圣诞节 6:30 运行 /usr/bin/scripts 目录下的 test.sh。


    总之，脚本编写和脚本自动化是接管经常发生任务控制的极佳方式。继续编写脚本，或在网上查找示例，看看如何通过 bash 让你的计算体验变得更简单。


    # 高级终端概念


    掌握 Linux 在于对操作系统可用工具的深入理解以及如何利用它们。本章中讨论的许多主题将关注更多任务以及如何完成它们，或者对操作系统进行的一些通用质量（QOL）改进。


    文件的压缩和解压缩经常会让 Linux 初学者困惑。这些工具通常已经安装，但必须使用命令行。此外，奇怪的 .tar 和 .gz 文件类型是 Linux 特有的格式，你可能会遇到。所有文件都可以使用
    gzip 工具解压缩或压缩。Ubuntu 预装了它，我们通过“tar”命令访问它。要压缩一个文件夹，在终端中进入该目录并输入“tar – czvf name.tar.gz
    columnspan”。C 代表“create”（创建），z 表示“compress (gzip)”，v 代表“verbose”（详细），f 允许指定文件名。如果你想要更高的压缩率（但代价是时间），可以将
    -z 选项替换为 -j 选项，用 gzip2 压缩文件夹。


    现在可以使用“tar -xzvf name.tar.gz”提取相同的归包。你会发现 -c 被替换为 -x，这表示提取。再次地，如果你处理的是 bzip2 文件，请使用
    -j 选项。


    继续讨论终端概念，让我们来聊一些可以节省时间的技巧和窍门。在输入命令或文件名时，在中间按下 tab 键。这项功能——制表键补全（tab completion），将猜测你尝试输入的内容并填充剩余部分。对于文件，它将如目录所示补全名称。Linux
    专家和任何必须使用终端的人似乎是以很快的速度输入他们的内容，但他们实际上在使用制表键补全。


    用户，特别是管理员，会花费大量时间使用 sudo 命令，因为他们的指令需要提升权限。但当你输入长命令并忘记输入 sudo 时，你会因为必须再次输入而感到恼。。只需输入“sudo
    !!”，意为“再次以超级用户执行”。它极地避免了再次输入整个命令。


    另一种重复命令的方法是使用上下方向键。连续按上键可以循环查看之前的命令。你也可以用左右方向键编辑命令内的文本。


    以及最常请求的提示：复制和粘贴。尝试向终端粘贴行内容会产生奇怪的字符 ^v。键盘快捷键没有配置在终端中工作，这就是为什么显示了奇怪的组合。要实际粘贴，右键点击并选择选项；或者使用组合键
    shift+insert。复制相同，但请使用 ctrl+insert。虽然从互联网复制和粘贴终端命令可能是好的（前提是你理解风险并知道他们在做什么），但不要尝试从本文物中粘贴。通过你阅读它的媒介引入的格式可能会插入终端无法识别的特殊字符，因此最好不要复制粘贴，而是应该手动输入呈现的命令。


