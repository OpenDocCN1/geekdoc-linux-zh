- md: '

    There are several different types of hacking out there. And while the media portrays
    hackers as bad, they are not. It is not black and all white either. While those
    are the two most popular groups when talking about hacking, there are many categories
    in between, that it would not be beneficial to only talk about the two that are
    most known.


    The two main categories that all the sub-categories fall between however, are
    ethical and unethical hacking.


    Ethical hacking is hacking that is used only for good purposes. There are a lot
    of people who have full permissions to hack into a system, and to find all of
    the bugs of the software or hardware.


    Ethical hackers are all the ones that are responsible for all of the bug fixes
    in your phone, apps, tablets, or computers. These people are hired by a company
    to figure out what is wrong with their systems, and find the best way to fix it.
    These hackers are an essential part of the hacking community.


    If it were not for hackers we would not have the world wide web, urls or HTML.
    Hacking is an important part if done within the boundaries of ethical hacking.


    Unethical hacking, however, is not within the realms of hacking that is legal
    with current laws. It is hacking for a malicious purpose. People who hack bank
    mainframes and steal people''s credit card and account information and use it
    to drain accounts are known as unethical hacking.


    Unethical hacking is the bane of true hackers'' existence. These people are the
    ones that give the good guys a bad name.


    Now to go on to the terms for all different types of hackers.


    - White Hat Hackers: These are the completely ethical hackers. Everything that
    they do is done for good. They go thru a system, and comb it down for any bugs,
    and build super strong firewalls so that the systems are safe. They create anti-malware
    software.

    - Black Hat Hacking: This is the type of hacking that you have to stay away from.
    With great power comes great responsibility. The great responsibility to not become
    prey to the temptation that is black hacking. This type of hacking can get you
    in a lot of trouble, and are immoral government files or even other people''s
    privacy can be tempting but will lead to heavy disciplinary actions.

    - Grey Hat Hacking: These are the hackers that sometimes do bad things for good
    reasons. Such as Anonymous. They may hack the firewall of an sensitive information
    file, but they do so to expose the corruption that is going behind the firewall.
    These hackers are often treated like criminals, but in reality, they can be regarded
    as heroes depending on your perspective.

    - Red Hats: These are the bounty hunters of the hacking world. They use their
    hacking skills to find illegal hackers, such as black hat hackers, or grey hats
    that are doing bad things that they should not be doing. They then turn them over
    to the feds, so that the illegal hackers are arrested. There are several other
    terms for these hackers, but they are not very appropriate, so we shall leave
    them out.

    - Blue Hat Hackers: These are the blue collar workers of the hacking world. They
    sit in a cubicle and hack away all day to find bugs for Microsoft or other major
    companies. They clock into a nine to five job that just happens to involve hacking.


    These are the main classifications of hackers. There are also elite hackers that
    spend their entire life becoming the best hackers that the world has seen, and
    green hat hackers who don''t really care about hacking, they just do it for fun.
    Hacking can be a very useful tool, and even become a profession if you go about
    it the right way.


    Now it is important to note that all of these hackers are going to work in a different
    way, but they are going to use the same kinds of codes in order to get the information
    that they want from other computers. A black hat hacker is going to concentrate
    on getting into the system and getting the information that they need to see success
    while the white hat hackers are going to work to keep these hackers off the system.
    While they are working in different ways, they are going to use the same tools
    and see who will come out on top in the end.


    With that said, you need to be careful about what you are doing with your hacking
    abilities. If you are using them to get onto a system or a network that you aren''t
    allowed to be on, then you could get into a lot of trouble. While some people
    find these vulnerabilities and tell the company all about them right away, it
    is still a legal issue if you are on the system when you shouldn''t be. The company
    you mess with could press charges so it is always best to just work within your
    own network and keep that safe rather than trying to get onto a network you don''t
    belong.


    On the other hand, if you are someone who loves to work in the computer world
    and you want to be able to do this all the time, it may be a good idea to work
    as a white hat hacker. There are many companies that hold onto private and personal
    information for their customers, whether it is hospital information, credit card
    information, or something else. They are always on the lookout for a black hat
    hacker who may try to get into the system and take this information and a good
    white hat hacker can always find the work that they need helping these companies
    out.


