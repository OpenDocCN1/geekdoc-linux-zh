  - '[PAGE 126]


    +   CrunchBang – A Debian-based distribution that aims to be less resource intensive.
    It is simple and without some of the bloatware that some distributions include
    by default. CrunchBang can run fast and be efficient at computing.


    +   Android – The popular phone OS is actually a Linux variant. Since many phones
    have lower specifications than full desktop PCs, the OS is a great choice for
    laptops, touchscreen devices, or home media computers. Furthermore, you can use
    many of the Google Apps from the Play store, meaning that thousands of apps, games,
