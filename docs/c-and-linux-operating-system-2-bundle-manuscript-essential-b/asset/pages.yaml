    “ls”. This is short for list, and it will display all of the files within our
    current directory. You will be able to see the files and folders in Home, Ubuntu’s
    main user folder. If you are lost, you can always type in “pwd” to print the working
    directory and display the name of the folder you are currently browsing. As you
