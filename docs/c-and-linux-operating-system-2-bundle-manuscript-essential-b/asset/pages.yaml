    They wag their tails, they bark, they pant, they eat dry kibble, and they go to
    the bathroom outside in the yard. These things make a unique object. These objects
    are classified into groups know as, you guessed it, classes.


    Method- This is another term for behavior. There can be as many or as few as you
    choose in your classes. This is where all of the data is manipulated, and actions
    are played out, along with the place that all of the logic is written. Methods
    are especially important because without them, your program would not know what
    it is supposed to do with the variable that you give it. It would just sit there
