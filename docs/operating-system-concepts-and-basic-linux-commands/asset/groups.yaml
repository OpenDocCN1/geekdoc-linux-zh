    names may indicate a relationship between files, we may want to be able to find
    all files whose names match a particular pattern.


    +   **Delete a file:** When a file is no longer needed, we want to remove it from
    the directory.


    +   **List a directory:** We need to be able to list the files in a directory
    and the contents of the directory entry for each file in the list.


    +   **Rename a file:** Because the name of a file represents its contents to its
    users, we must be able to change the name when the contents or use of the file
    changes. Renaming a file may also allow its position within the directory structure
    to change.


    +   **Traverse the file system:** We may wish to access every directory and every
    file within a directory structure. For reliability, it is a good idea to save
    the contents and structure of the entire file system at regular intervals. Often,
    we do this by copying all files to magnetic tape. This technique provides a backup
    copy in case of system failure. In addition, if a file is no longer in use, the
    file can be copied to tape and the disk space of that file released for reuse
    by another file.


    Following are the most common schemes for defining the logical structure of a
    directory.


    # 4.8.1 Single-Level Directory


    The simplest directory structure is the single-level directory. All files are
    contained in the same directory, which is easy to support and understand. A single-level
    directory has significant limitations, however, when the number of files increases
    or when the system has more than one user. Since all files are in the same directory,
    they must have unique names.


    Even a single user on a single-level directory may find it difficult to remember
