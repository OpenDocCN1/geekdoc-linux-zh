    until the first response is produced. It is the time it takes to start responding,
    not the time it takes to output the response. The turnaround time is generally
    limited by the speed of the output device.


    It is desirable to maximize CPU utilization and throughput and minimize Turnaround
    time, waiting time, and response time.


