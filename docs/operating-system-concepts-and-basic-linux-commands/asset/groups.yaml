    Operating System Concepts and Basic Linux Commands


    protocol. If a process is holding some resources and requests another resource
    that cannot be immediately allocated to it (that is, the process must wait), then
    all resources currently being held are preempted. In other words, these resources
    are implicitly released. The preempted resources are added to the list of available
    resources for which the other process is waiting. The process will be restarted
    only when it can regain its own resources, as well as the new ones it is requesting.


    Alternatively, if a process requests some resources, we first check whether they
    are available. If they are, we allocate them. If they are not, we check whether
    they are allocated to some other process that is waiting for additional resources.
    If so, we preempt the desired resources from the waiting process and allocate
    them to the requesting process.


    If the resources are neither available nor held by a waiting process, the requesting
    process must wait. While it is waiting, some of its resources may be preempted,
    but only if another process requests them. A process can be restarted when it
    is allocated the new resources it is requesting and recovers any resources that
    were preempted while it was waiting.


    # 3.3.4 Circular Wait:


    The fourth and final condition for deadlocks is the circular-wait condition. One
    way to ensure that this condition never holds is to give some particular ordering
    of all resource types and to require that each process requests resources in an
    increasing order of enumeration.


    To illustrate, we let $R=\{R1, R2, ..., Rm\}$ be the set of resource types. We
    assign to each resource type a unique integer number, which allows us to compare
    two resources and determine whether one precedes another in our ordering. we define
    a one-to-one function $F: R \rightarrow N$, where $N$ is the set of natural numbers.


    For example, if the set of resource types $R$ includes tape drives, disk drives,
    and printers, then the function $F$ might be defined as follows:


    $F(tape\ drive) = 1$

    $F(disk\ drive) = 5$'
  - '[PAGE 76]


    F(printer) = 12


    We can now consider the following protocol to prevent deadlocks: Each process
    can request resources only in an increasing order of enumeration. That is, a process
    can initially request any number of instances of a resource type Ri. After that,
    the process can request instances of resource type Rj if and only if F(Rj) > F(Ri).
    If several instances of the same resource type are needed, a *single* request
    for all of them must be issued. For example, using the function defined previously,
    a process that wants to use the tape drive and printer at the same time must first
    request the tape drive and then request the printer. Alternatively, we can require
    that, whenever a process requests an instance of resource type Rj, it has released
    any Ri such that F(Ri) ≥ F(Rj). If these two protocols are used, then the circular-wait
    condition cannot hold.


    # 3.4 Deadlock Avoidance


    The simplest and most useful model requires that each process declare the *maximum*
    number of resources of each type it may need. Given this priori information, it
    is possible to construct an algorithm that ensures the system will never enter
    a deadlocked state. Such an algorithm defines the **deadlock-avoidance** approach
    dynamically examines the resource-allocation state to ensure that a circular-wait
    condition can never exist. The resource-allocation *state* is defined by the number
    of available and allocated resources and the maximum demands of the processes.
    In the following sections we explore two deadlock avoidance algorithms.


    **Safe state:** A state is *safe* if the system can allocate resources each process
    (up to its maximum) in some order and still avoid a deadlock.


    A system is in a safe state only if there exists a **safe sequence**. A sequence
    of processes <P1, P2,...,Pn> is a safe sequence for the current allocation state
    if, for each *Pi*, the resource requests that *Pi* can be satisfied by the currently
    available resources held by all *Pj*, with *j < i*.'
