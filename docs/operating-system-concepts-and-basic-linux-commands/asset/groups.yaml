    job 1 的四个页被加载到内存中的不同位置。操作系统为每个进程提供一个页表。页表规定了在主内存中的位置。在此示例中，主内存的容量为 18 个帧，可用任务仅需要
    10 个帧，因此剩余的 8 个帧是空闲的。这些空闲帧可以用于其他任务。


    **优点：** 分页支持时分系统。它不会受到碎片问题的影响。它支持虚拟内存。


    **缺点：** 分页可能会产生“页断”（page breaks）。例如考虑一个逻辑地址空间为 17kb 的任务，页大小为 4kb。因此该任务需要 5 个帧。最后一帧（即第五帧）仅需要
    1kb 的内存，因此剩下的 3kb 被浪费了。这被称为页断。


    如果页数很大，那么维护页表非常困难。


    ## 3.12.1 共享页 (Shared Pages)


    在多程序环境中，可以同时让多个进程共享公共代码，而不是维护某些代码的多个副本。逻辑地址被分为页，这些页可以同时被多个进程共享。被多个进程共享的页称为共享页。


    例如，考虑一个有 10 个用户的多程序环境。在 10 个用户中，有 3 个人想要执行文本编辑器；他们希望在文本编辑器中共享个人数据。假设文本编辑器需要 150kb，用户个人数据占用
    50kb 的数据空间。他们将需要 3*(150+50)=600kb。但在共享分页中，文本编辑器由所有用户任务共享，因此它需要 150kb，而用户文件需要 50*3=150kb。因此，(150+150)=300kb
    就足够管理这三个任务了，而不是 600kb。共享分页节省了 300kb 的空间。


    帧的大小为 50kb。因此，文本编辑器需要 3 个帧，用户文件需要 3 个帧。每个进程（P1, P2, P3）都有一个页表，页表显示帧号，每个页表中的前 3
    个帧号（即 3, 8, 0）是共同的。这意味着三个进程共享了三个页。共享页的主要优点是可以实现高效的内存利用。


