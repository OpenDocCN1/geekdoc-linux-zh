    # 4.8 Directory structure


    The file systems of computers can be extensive. Some systems store millions of
    files on terabytes of disk. To manage all these data, we need to organize them.
    This organization is usually done in two parts.


    First, disks are split into one or more partitions. Typically, each disk on a
    system contains at least one partition, which is a low-level structure in which
    files and directories reside.


    Second, each partition contains information about files within it. This information
    is kept in a device directory or volume table of contents. The device directory
    records information—such as name, location, size, and type—for all files on that
    partition.


    The directory can be viewed as a symbol table that translates file names into
    their directory entries. We want to be able to insert entries, to delete entries,
    to search for a named entry, and to list all the entries in the directory.


    When considering a particular directory structure, following are the operations
    that are to be performed on a directory:'
