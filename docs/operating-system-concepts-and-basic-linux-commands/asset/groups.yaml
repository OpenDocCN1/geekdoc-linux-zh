    # 5.1 Shell:


    The shell program is the interpreter through which we communicate with the operating
    system. As we type in a command at the shell prompt, it is interpreted and passed
    to the Linux kernel. The kernel tells the computer what to do. Shell is the most
    widely used utility program in Linux. Shell offers the following features to the
    user.


    +   i. Interactive Environment: The shell allows the user to create a dialogue
    between the user and the host system. This dialogue lasts until the user ends
    the session.


    +   ii. Shell scripts: Shell script is the user interface to the computer system
    for the Linux operating system. The shell contains internal commands which can
    be utilized by the user. Shell scripts are groups of Linux commands strung together
    and executed as individual files


    +   iii. Input/output redirections: Linux commands can be instructed to take their
    instructions from files, and not from the keyboard. The shell also allows the
    user to place the output of commands into a file and not on screen of the terminal.
    Output can also be redirected to other devices, such as to a printer or another
    terminal on the network.


    +   iv. Piping Mechanism: Linux supplies ‘pipe’ facility that allows the output
    of one command to be used as input in another Linux command. The Linux file system
    contains many utilities that are useful for such purpose.


    +   v. Metacharacter facility: Apart from the normal characters found on a keyboard,
    (letters and digits) the shell provides the use of ‘metacharacters’. these allows
    the user to apply selection criteria when accessing files, for example the user
    could access all files that begin with the letter ‘m’.'
