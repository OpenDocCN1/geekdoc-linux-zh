    # 1.1 Introduction


    In the simplest scenario, the operating system is the first piece of software
    to run on a computer when it is booted. Its job is to coordinate the execution
    of all other software, mainly user applications. It also provides various common
    services that are needed by users and applications.


    An operating system is a program which acts as an interface between a user of
    a computer and computer hardware. The purpose of an operating system is to provide
    an environment in which a user may execute program.


    An operating system acts as a resource manager and allocates resources to specific
    programs and users as necessary for their task. The commonly required resources
    are Input/output devices, memory, file storage space, CPU time and so on.


    The operating system must ensure the correct operation of the computer system.
    The hardware must provide appropriate mechanisms to prevent user programs from
    interfering with the proper operation of the system


    The operating system controls and coordinates the use of the hardware among the
    various application programs for the various users. The operating system provides
    the means for the proper use of the recourses in the operations of the computer
    system. The operating system performs no useful function by itself. It simply
    provides an environment within which other programs can do useful work. The operating
    system acts as the manager of these resources and allocates them to specific programs
    and users as necessary for their task. Since there may be many, possibly conflicting,
    requests for resources, the operating system must decide which requests are allocated
    resources to operate the computer system efficiently.


    An operating system is a control program. A control program controls the execution
    of user programs to prevent errors and improper use of the computer. It is especially
    concerned with the operation and control of I/O devices.


    The fundamental goal of computer system is to execute user programs and solve
    user problems. The primary goal of an operating system is convenient for user.'
