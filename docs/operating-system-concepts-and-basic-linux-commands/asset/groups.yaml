    ## Deadlock


    In a multiprogramming environment, several processes may compete for a finite
    number of resources. A process requests resources; and if the resources are not
    available at that time, the process enters a waiting state. Sometimes, a waiting
    process is never able to change state because the resources it requested are held
    by other processes. This situation is called a deadlock.


    ### 3.1 Resource-Allocation Graph


    Deadlocks can be described more precisely in terms of a directed graph called
    a resource-allocation graph. This graph consists of a set of vertices V and a
    set of edges E. The set of vertices V is partitioned into two different types
    of nodes: P={P1, P2, ..., Pn} the set consisting of all active processes in the
    system, and R={R1, R2, ..., Rn} the set consisting of all resource types in the
    system.


    A directed edge from process Pi to resource type Rj is denoted by Pi→Rj; it signifies
    that process Pi has requested an instance of resource type Rj. A directed edge
    from resource type Rj to process Pi is denoted by Rj→Pi; it signifies that an
    instance of resource type Rj has been allocated to process Pi. A directed edge
    Rj→Pi is called an assignment edge.


    We represent each process Pi as a circle and each resource type Rj may have more
    than one instance, we represent each instance as a dot within the rectangle. The
    resource-allocation graph shown in Figure depicts the following situation.


    The sets P, R, and £:


    - • P={P1, P2, P3}

    - • R={R1, R2, R3, R4}

    - • £={P1→R1, P2→R3, R1→P2, R2→P2, R2→P1, R3→P3}


    # Operating System Concepts and Basic Linux Commands


    ## Resource instances


    - One instance of resource type R1.

    - Two instances of resource type R2.

    - One instance of resource type R3.

    - Three instances of resource type R4.


    ![](img/b3f889342bdc020af96a131b08d63774_71_0.png)


    Fig. 3.1: Resource allocation graph


    ## Process states


    - Process P1 is holding an instance of resource type R2 and is waiting for an
    instance of resource type R1.

    - Process P2 is holding an instance of R1 and an instance of R2 and is waiting
    for an instance of R3.

    - Process P3 is holding an instance of R3.


    If the graph contains no cycles, then no process in the system is deadlocked.
    If the graph does contain a cycle, then a deadlock may exist.

