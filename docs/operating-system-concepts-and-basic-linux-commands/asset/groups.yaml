    # Operating System Concepts and Basic Linux Commands


    We claim that the system is now deadlocked. Although we can reclaim the resources
    held by process P0, the number of available resources is not sufficient to fulfill
    the requests of the other processes. Thus, a deadlock exists, consisting of processes
    P1, P2, P3, and P4.


    ## 3.6 Recovery from deadlock:


    There are two options for breaking a deadlock. One is simply to abort one or more
    processes to break the circular wait. The other is to preempt some resources from
    one or more of the deadlocked processes.


    ### 3.6.1 Process Termination


    There are two methods for terminating process. In both methods, the system reclaims
    all resources allocated to the terminated processes.


    - **Abort all deadlocked processes:** This method clearly will break the deadlock
    cycle, but at great expense.

    - **Abort one process at a time until the deadlock cycle is eliminated:** This
    method incurs considerable overhead, since after each process is aborted, a deadlock-detection
    algorithm must be invoked to determine whether any processes are still deadlocked.


    ### 3.6.2 Resource Preemption


    To eliminate deadlocks using resource preemption, we successively preempt some
    resources from processes and give these resources to other processes until the
    deadlock cycle is broken.


    There are three methods to eliminate deadlocks using resource preemption.


    - 1. **Selecting a victim:** Select resources and processes are to be preempted.
    Cost factors may include the number of resources the deadlocked process is holding
    and the amount of time the process has consumed during its execution.

    - 2. **Rollback:** If we preempt a resource from a process, what should be done
    with that process? Clearly, it cannot continue with its normal execution; it is
    missing some needed resource. We must roll back the process to some safe state
    and restart it from that state. Since, in general, it is difficult to determine
    what a safe state is, the simplest solution is a total rollback: Abort the process
    and then restart it. Although it is more effective to roll back the process only
    as far as necessary to break the deadlock, this method requires the system to
    keep more information about the state of all running processes.

    - 3. **Starvation:** How do we ensure that starvation will not occur? That is,
    how can we guarantee that resources will not always be preempted from the same
    process? In a system where victim selection is based primarily on cost factors,
    it may happen that the same process is always picked as a victim. As a result,
    this process never completes its designated task, a starvation situation that
    needs to be dealt with in any practical system. Clearly, we must ensure that a
    process can be picked as a victim only a (small) finite number of times. The most
    common solution is to include the number of rollbacks in the cost factor.


    # Memory Management


    In uni-programming system, the main memory is divided into two parts, one part
    is for operating system and another part is for currently executing job. Consider
    the following figure.


    ![](img/b3f889342bdc020af96a131b08d63774_85_0.png)


    Fig 3.5: Main memory partition


    Partition 1 is used the operating system and partition 2 is used to store the
    user process. In partition 2 some part of memory is wasted, it is indicated by
    blacked lines in figure.


    In multiprogramming environment the user space is divided in number of partitions.
    Each partition is for one process. The task of sub division is carried out dynamically
    by the operating system; this task is known as “Memory Management”. The efficient
    memory management is possible with multiprogramming.


    ## 3.7 Logical-versus Physical-Address Space


    An address generated by the CPU is commonly referred to as a logical address,
    whereas an address seen by the memory unit—that is, the one loaded into the memory-address
    register of the memory—is commonly referred to as a physical address.


    The compile-time and load-time address-binding methods generate identical logical
    and physical addresses. However, the execution-time address-binding scheme results
    in differing logical and physical addresses. In this case, we usually refer to
    the logical address as a virtual address. We use logical address and virtual address
    interchangeably in this text. The set of all logical addresses generated by a
    program is a logical-address space; the set of all physical addresses corresponding
    to these logical addresses is a physical-address space. Thus, in the execution-time
    address binding scheme, the logical- and physical-address spaces differ.


    Shital Vivek Ghate


    The run-time mapping from virtual to physical addresses is done by hardware called
    the memory management unit (MMU). The base register is now called the relocation
    register. The relocation register contains the value of the smallest physical
    address; the limit register contains the range of logical addresses (for example,
    relocation = 100040 and limit = 74600). With relocation and limit registers, each
    logical address must be less than the limit register; the MMU maps the logical
    address dynamically by adding the value in the relocation register. This mapped
    address is sent to memory.


    We have two types of addresses: logical addresses (in the range 0 to max) and
    physical addresses (in the range R to R + max). The user supplies logical addresses;
    these must be mapped to physical addresses before they are used. The concept of
    a logical-address space that is bound to a separate physical-address space is
    central to proper memory management


    ![](img/b3f889342bdc020af96a131b08d63774_86_0.png)


    # Operating System Concepts and Basic Linux Commands


    ## 3.8 Swapping


    Swapping is used to increase main memory utilization. For example, main memory
    consisting of processes, assume that it is the maximum capacity of memory to hold
    the processes. The CPU currently executing the process needs I/O. Then the CPU
    switches to another job and the process is moved to disk. When the process is
    completed, it is moved to main memory. Switching process from main memory to disk
    is known as “swap out” and switching from disk to main memory is called “swap
    in”. This type of mechanism is said to be “swapping”. We can achieve efficient
    memory utilization with swapping.


    Swapping requires ‘backing store’. The backing store is commonly a fast disk.
    It must be large enough to accommodate the copies of process images for all users.
    When a process is swapped out, its executable image is copied into backing store.
    When it is swapped in, it is copied into the main memory at a new block allocated
    by the memory manager.


    ![](img/b3f889342bdc020af96a131b08d63774_87_0.png)


    ## 3.9 Memory Protection


    Protecting the operating system from user processes and protecting user processes
    from one another. We can provide this protection by using a relocation register
    with a limit register. The relocation register contains the value of the smallest
    physical address; the limit register contains the range of logical addresses (for
    example, relocation = 100040 and limit = 74600). With relocation and limit registers,
    each logical address must be less than the limit register; the MMU maps the logical
    address dynamically by adding the value in the relocation register. This mapped
    address is sent to memory.


    When the CPU scheduler selects a process for execution, the dispatcher loads the
    relocation and limit registers with the correct values as part of the context
    switch. Because every address generated by the CPU is checked against these registers,
    we can protect both the operating system and the other users'' programs and data
    from being modified by this running process.


    ![](img/b3f889342bdc020af96a131b08d63774_88_0.png)


    Fig 3.8: Hardware support for relocation and limit registers.

