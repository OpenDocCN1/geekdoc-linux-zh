    14703，对于第二个块可能是 3192。使用相对块号允许操作系统决定文件应该放置在何处，并有助于防止用户访问文件系统中可能不属于其文件的部分。某些系统从
    0 开始计算其相对块号；另一些系统则从 1 开始。


