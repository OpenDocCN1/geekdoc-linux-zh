    slightly more space.


    Yet another problem of linked allocation is reliability. Since the files are linked
    together by pointers scattered over the disk, if a pointer was lost or damaged,
    a bug in the operating-system software or a disk hardware failure might result
    in picking up the wrong pointer. This error could result in linking into the free-space
    list or into another file.


    ## 4.7.3 Indexed allocation:


    Linked allocation solves the external-fragmentation and size-declaration problems
    of contiguous allocation. However, linked allocation cannot support efficient
    direct access, since the pointers to the blocks are scattered with the blocks
    themselves all over the disk and need to be retrieved in order. Indexed allocation
    solves this problem by bringing all the pointers together into one location: the
    index block.


    Each file has its own index block, which is an array of disk-block addresses.
    The ith entry in the index block points to the ith block of the file. The directory
    contains the address of the index block. To read the ith block, we use the pointer
    in the ith index-block entry to find and read the desired block.


    When the file is created, all pointers in the index block are set to nil. When
    the ith block is first written, a block is obtained from the free-space manager,
    and its address is put in the ith index-block entry.


    Indexed allocation supports direct access, without suffering from external fragmentation,
    because any free block on the disk may satisfy a request for more space.


    Indexed allocation does suffer from wasted space. The pointer overhead of the
    index block is generally greater than the pointer overhead of linked allocation.
    Consider a common case in which we have a file of only one or two blocks. With
    linked allocation, we lose the space of only one pointer per block (one or two
