    Fig.3.24: Demand Paging


    ## 3.16 Page replacement algorithm:


    There are various page replacement algorithms, some of the popular page replacement
    algorithms are given below:


    ### 3.16.1 FIFO Page Replacement


    The simplest page-replacement algorithm is a FIFO algorithm. A FIFO page replacement
    algorithm associates with each page the time when that page was brought into memory.
    When a page must be replaced, the oldest page is chosen, i.e. it replaces the
    page that has been in memory for longer time than all the other pages.


    For example, consider a reference string: 7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0, 3,
    2, 1, 2, 0, 1, 7, 0, 1.


    Suppose have three frames which are initially empty. For our example reference
    string, our three frames are initially empty.


    The first three references (7, 0, 1) cause page faults and are brought into these
    empty frames. The next reference (2) replaces page 7, because page 7 was brought
    in first. Since 0 is already in memory, we have no fault for this reference.


    The first reference to 3 results in replacement of page 0, since it is now first
    of the three pages in memory, this means the next reference, to 0, will cause
    a page fault. Page 1 is then replaced by page 0. This process continues as shown
    in the following figure. Every time a page fault occurs, we show which pages are
    in our three frames. There are total 15 page faults occurs for the given reference
    string with three frames.


    + 7 0 1 2 3 0 4 2 3 0 2 1 2 0 1 7 0 1


    | 7 7 2 | 2 4 4 4 0 | 0 0 | 7 7 7 |

    | 0 0 0 | 3 3 2 2 0 | 1 1 | 1 0 0 |

    | 1 1 1 | 0 0 3 | 3 2 | 2 2 7 |


    page frames


    # Fig.3.25 FIFO page replacement


    The FIFO page-replacement algorithm is easy to understand and program. However,
    its performance is not always good. It may be possible that we have to select
    the active page for replacement, after replacing the active page with a new one,
    page fault occurs immediately for the active page. Then some other page will be
    needed to be replaced to bring the active page in memory. Thus, a bad replacement
    choice increases the page-fault rate and slows process execution but does not
    cause incorrect execution.


    To illustrate the problems that arise with page-replacement, we consider the reference
    string 1, 2, 3, 4, 1, 2, 5, 1, 1, 2, 3, 4, 5, 2, 2. We notice that the number
    of faults for four frames (ten) is greater than for three frames (nine). This
    result is known as Belady''s anomaly.


    In some research, investigators noticed that this assumption was not true. The
    page-replacement would improve its performance.


    ## 3.16.2 Optimal replacement algorithm:


    The optimal page-replacement is simply called MIN. The key distinction between
    FIFO and OPT algorithms (other than looking backward or forward) is that FIFO
    uses the time when a page was brought into memory, whereas OPT uses the time when
    a page is to be used.


    Unfortunately, the optimal algorithm is difficult to implement, because it requires
    future knowledge of the reference string. However, it guarantees the lowest page-fault
    rate of all algorithms and will not suffer from Belady''s anomaly.


    For example, on our reference string 1, 2, 3, 4, 1, 2, 5, 1, 1, 2, 3, 4, 5, 2,
    3, the optimal-replacement would yield nine faults, as shown in the figure.


    ![](img/b3f889342bdc020af96a131b08d63774_109_0.png)


    Fig.3.26: Optimal algorithm


    ## 3.16.3 Least used replacement:


    If the optimal algorithm is not feasible, perhaps an approximation of the optimal
    algorithm is possible. If we use the recent past as an approximation of the near
    future, then we can use this: least used (LRU) replacement associates with each
    page''s last use. When a page must be replaced, LRU chooses the page that has
    not been used for the longest period of time. This strategy is looking backward
    in time.


    The result of applying LRU replacement to our example reference string is shown
    in the following figure. The LRU algorithm produces 12 faults. Notice that the
    first five faults are the same as those for optimal replacement. When the reference
    to 4 occurs, page 2 was used least recently. Thus, the LRU algorithm replaces
    page 4, not knowing that page 2 is about to be used. When it then faults for page
    2, the LRU algorithm replaces page 3, since it is now the least used of the three
    pages in memory. Despite these problems, LRU replacement with 12 faults is still
    better than FIFO replacement with 15 faults.


