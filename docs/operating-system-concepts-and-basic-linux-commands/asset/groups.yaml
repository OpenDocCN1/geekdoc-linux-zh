    # 操作系统概念与基础 Linux 命令


    我们声称系统现在已发生死锁。尽管我们可以收回进程 P0 持有的资源，但可用资源数量不足以满足其他进程的请求。因此，存在一个死锁，由进程 P1、P2、P3 和
    P4 组成。


    ## 3.6 从死锁中恢复：


    打破死锁有两种方法。一种是简单的终止一个或多个进程以打破循环等待。另一种方法是从一个或多个死锁进程中抢夺某些资源。


    ### 3.6.1 进程终止


    终止进程有两种方法。在这两种方法中，系统都会收回分配给终止进程的所有资源。


    - **终止所有死锁进程：** 方法显然会打破死锁循环，但代价巨大。

    - **一次终止一个进程，直到消除死锁循环：** 这种方法会产生大量的开销，因为在终止每个进程后，必须调用死锁检测算法来判断是否仍有进程处于锁定状态。


    ### 3.6.2 资源抢夺


    要使用资源抢夺消除死锁，我们连续地从进程中抢夺某些资源并将这些资源给其他进程，直到死锁循环被打破。


    使用资源抢夺消除死锁有三种方法。


    - 1. **选择受害者：** 选择要抢夺的资源和进程。成本因素可能包括死锁进程持有的资源数量以及进程执行过程中消耗的时间。

    - 2. **回滚：** 如果我们从进程中抢夺了资源，该进程应该如何处理？显然，它不能继续正常执行；因为它缺少了一些所需的资源。我们必须将进程回滚到某个安全状态并从该状态重新启动。由于通常情况下很难确定什么是安全状态，最简单的解决方案是完全回滚：终止进程然后重新启动。虽然仅将进程回滚到打破死锁所需的程度更为有效，但这种方法要求系统保留更多关于所有运行进程状态的信息。

    - 3. **饥饿：** 我们如何确保不会发生饥饿？也就是说，我们如何保证资源不会总是从同一个进程中抢夺？在一个主要基于成本因素选择受者的系统中，可能会出现同一个进程总是被选为受害者。结果是该进程永远无法完成其预定任务，这是任何实际系统中都需要处理的饥饿问题。显然，我们必须确保一个进程只能被选为受害者（少量）有限的次数。最常见的解决方案是将回滚次数包含在成本因子中。


    # 内存管理


    在单程序系统中，主内存分为两个部分：一部分用于操作系统，另一部分用于当前执行的作业。考虑如下所示。


    ![](img/b3f889342bdc020af96a131b08d63774_85_0.png)


    图 3.5：主内存分区


    分区 1 用于操作系统，分区 2 用于存储用户进程。在分区 2 中，部分内存被浪费了，图中用黑线表示。


    在多程序环境中，用户空间被划分为若干个分区。每个分区对应一个进程。子划分任务由操作系统动态执行；这项任务被称为“内存管理”。通过多程序设计可以实现高效的内存管理。


    ## 3.7 逻辑地址空间与物理地址空间


    CPU 生成的地址通常称为逻辑地址，而内存单元看到的地址——即加载到内存访址寄存器中的地址——通常称为物理地址。


    编译时和装入时的地址绑定方法生成的逻辑地址和物理地址是。然而，执行时地址绑定方案会导致逻辑地址和物理地址不同。在这种情况下，我们通常将逻辑地址称为虚拟地址。在本文中，逻辑地址和虚拟地址交替使用。程序生成的所有逻辑地址的集合称为逻辑地址空间；这些逻辑地址对应的所有物理地址的集合称为物理地址空间。因此，在执行时地址绑定方案中，逻辑和物理地址空间是不同的。


    Shital Vivek Ghate


    从虚拟地址到物理地址的运行时映射是由称为内存管理单元（MMU）的硬件完成的。基寄存器被称为重位寄存器。重位寄存器包含最小物理地址的值；限寄存器包含逻辑地址的范围（例如，relocation=100040，limit=74600）。通过重位寄存器和限寄存器，每个逻辑地址必须小于限寄存器；MMU
    通过加上重位寄存器中的值来动态映射逻辑地址。映射后的地址被发送到内存。


    我们有两种地址：逻辑地址（范围在 0 到 max 之间）和物理地址（范围在 R 到 R + max 之间）。用户提供逻辑地址；这些地址在使用之前必须映射为物理地址。绑定到独立物理地址空间的逻辑地址空间概念是正确内存管理的核心。


    ![](img/b3f889342bdc020af96a131b08d63774_86_0.png)


    # 操作系统概念与基础 Linux 命令


    ## 3.8 交换 (Swapping)


    交换用于提高主内存的利用率。例如，假设由进程组成内存是存放这些进程的最大容量。正在执行该进程的 CPU 需要 I/O。这时 CPU 切换到另一个作业并将进程移动到磁盘。当进程完成后，它被移动到主内存。从主内存切换到磁盘被称为“换出”（swap
    out），从磁盘到主内存被称为“换入”（swap in）。这种机制被称为“交换”。通过交换可以实现高效内存利用。


    交换需要“存储器”（backing store）。存储器通常是快速磁盘。它必须足够大，以容纳所有用户的进程映像。当进程被换出时，其执行映像被复制到存储器。当它被换入时，它被复制到内存管理器分配的新内存块中。


    ![](img/b3f889342bdc020af96a131b08d63774_87_0.png)


    ## 3.9 内存保护


    保护操作系统不受用户进程影响，并保护用户之间。我们可以使用带有限寄存器的重位寄存器来提供这种保护。重位寄存器包含最小物理地址的值；限寄存器包含逻辑地址的范围（例如，relocation=100040，limit=74600）。通过重位寄存器和限寄存器，每个逻辑地址必须小于限寄存器；MMU
    通过加上重位寄存器中的值来动态映射逻辑地址。映射后的地址被发送到内存。


    当 CPU 调度器选择一个进程执行时，调度程序会在上下文切换部分将正确的值加载到重位寄存器中。由于 CPU 生成的每个地址都会经过这些寄存器的检查，我们可以保护操作系统以及用户的程序和数据不被此运行进程修改。


    ![](img/b3f889342bdc020af96a131b08d63774_88_0.png)


    图 3.8：重位寄存器和限寄存器的硬件支持。


    '
