    ## 5.8 Listing files and directories: (ls command)


    In UNIX there are three basic types of files:


    - Ordinary Files

    - Directories

    - Special Files


    An ordinary file is a file on the system that contains data, text, or program
    instructions. Directories store both special and ordinary files. Special files
    provide access to hardware such as hard drives, CD-ROM drives, modems, and Ethernet
    adapters. Other special files are similar to aliases or shortcuts and enable you
    to access a single file using using different names.


    ls command:

    First, list the files and directories stored in the current directory.

    Use the following command:


    ```

    $ ls

    ```


    Here''s a sample directory listing:


    | bin | hosts | lib | res.03 |

    |---|---|---|---|

    | ch07 | hw1 | pub | test_results |

    | ch07.bak | hw2 | res.01 | users |

    | docs | hw3 | res.02 | work |


    This output indicates that several items are in the current directory, but this
    output does not tell us whether these items are files or directories. To find
    out which of the items are files and which are directories, specify the -F option
    to ls:


    ```

    $ ls -F

    ```


    Now the output for the directory is slightly different:


    | bin/ | hosts | lib/ |

    |---|---|---|

    | ch07 | hw1 | pub/ |

    | ch07.bak | hw2 | res.01 |

    | docs/ | hw3 | res.02 |


    As you can see, some of the items now have a /at the end: each of these items
    is a directory. The other items, such as hw1, have no character appended to them.
    This indicates that they are ordinary files. When the -F option is specified to
    ls, it appends a character indicating the file type of each of the items lists.


    Following table shows all the options for ls command:


    | Option | Function |

    | --- | --- |

    | -a | Displays all files including .. and hidden files |

    | -A | Displays all but not. And .. |

    | -C | List entries by column |

    | -d | List directory entries instead of contents |

    | -l | Use long listing format |

    | -r | Sort in reverse order |

    | -R | List subdirectories recursively |

    | -s | Prints size of each file in blocks |

    | -S | Sort by file size |

    | -t | Sort by modification time, -u sort by access time |


    To invisible files, specify the -a option to ls:


    ```

    $ ls -a

    ```


    The directory listing now looks like this:


    ```

    .profile  docs    lib     test_results

    .hosts hosts    pub     users

    .emacs bin     hw1     res.01  work

    .exrc ch07   hw2     res.02

    .lsrc ch07.bak hw3     res.03

    ```


    As you can see, this directory contains many invisible files. Notice that in this
    output, the file type information is missing. To get the file type information,
    specify the -F and the -a options as follows:


    ```

    $ ls -a -F

    ```


    The output changes to the following:


    | ./ | profile | docs/ | lib/ | test_results |

    | .. | .hosts | hosts | pub/ | users |

    | .emacs | bin/ | hw1 | res.01 | work/ |

    | .exrc | ch07 | hw2 | res.02 | |

    | .kshrc | ch07.bak | hw3 | res.03 |


    With the file type information you see that there are two hidden directories (.and
    ..). These two directories are special entries that are present in all directories.
    The first one, ., represents the current directory. The second one, .., represents
    the parent directory.


