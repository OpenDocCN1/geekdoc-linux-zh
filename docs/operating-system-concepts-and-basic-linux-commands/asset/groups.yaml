    ## 5.17 File permissions:


    Every file on Linux has three types of permissions, read, write and execute. The
    command chmod allows to decide who can and cannot read and use a file. To assign
    these three types of permissions, the following three symbols are used.


    | Access type | Symbol | Meaning |

    |---|---|---|

    | Read | r | Allows displaying, copying and compiling a file |

    | write | w | Allows editing and deleting of file |

    | Execute | x | Allows execution of a file |


    To specify then user to whom you are grant permissions, use these three symbols.


    | Symbol | Description |

    |---|---|

    | u | The user or owner of file or directory |

    | g | Members of the group to which user belongs |

    | o | All other system users |


    # Operating System Concepts and Basic Linux Commands


    Normally when a file is created, it is created with read, write and execute permissions
    to the user and only read and execute permissions for group members and other
    system users. Write permission is not given normally to the group and other users.
    If it is required, the user can assign permissions by system commands. The currently
    existing permissions of files and directories can be determined by using long
    listing of directories (ls -l) command.


    For example:


    User is logged in with name ‘funny’


    ```

    $ls -l

    ```


    ```

    Total 3

    drwx-x-- -x funny project 50 june 2 15:30 dirl

    -rw-r-- -r-- funny project 11 20 june 1 09:50 prog1

    -rw-r-- -r-- -funny project 2000 june 6 10:40 sample

    ```


    The explanation of the permissions for the prog1 and sample files and directory
    dirl is given in following table:


    | Permissions | Files/directories | Remarks |

    |---|---|---|

    | -rwxrxr-x | prog1(file) | User/owner has got all the three permissions. Group
    and others have got only read and execute permissions. |

    | -rw-r-- -r-- | sample(file) | sample denies write and execute permissions for
    group members and others. |

    | drwx-r-- -r-- | dirl(directory) | dirl directory denies permission for write
    and execute to group and others. |


    The initial character describes the file or directory.

    ‘-'' (dash) symbolizes an ordinary file and ‘d’ symbolizes a directory. There
    are nine possible permissions which can be given or refused in combination. They
    are written as string of nine characters.


    | rwx | rwx | rwx |

    |---|---|---|

    | owner permissions | group permissions | others permissions |


    For example: rwx r-x r-x

    in this example user(owner) has all the three permissions read (r), write(w),
    execute(x) and group and other system users have read(r) execute(x) permissions.


    ## 5.18 Granting access to file: (chmod command)

    You can change existing permissions by executing chmod command. This command uses
    two methods:


    - 1. Symbolic method

    - 2. Octal method


    ### Symbolic method:

    Syntax of symbolic method is given below:


    ```

    chmod who + permissions file(s)

    ```


    where:

    chmod - name of command.

    who - one of three groups (u, g, o or a) u=user/owner, g=group, o=others, a=all

    + - means grant permissions

    - - means deny permissions

    Permissions - any combination of three (r, w, x)

    Files - file or directory name


    Operating System Concepts and Basic Linux Commands


    For example:

    $chmod u+r prog1

    This command added read permission to the owner for file prog1

    $chmod u-w prog1

    This command denies write permission to the owner for file prog1

    If you omit the scope(u, g or o) the permissions given apply to the three groups.


    ### Octal method:

    This format requires to specify permissions using three octal numbers. The first,
    second and third digits set the user, group and others respectively. Following
    table shows the meaning:


    | Integer | Permissions |

    |---|---|

    | 0 | No permission |

    | 1 | Execute |

    | 2 | Write |

    | 3 | Execute and write |

    | 4 | Read |

    | 5 | Read and execute |

    | 6 | Read and write |

    | 7 | Read, write and execute |


    For example:

    $chmod 750 sample

    This command changes access permissions for the owner, group members and other
    users.


