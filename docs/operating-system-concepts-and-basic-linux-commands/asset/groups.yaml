    # 4.6.3 Grouping


    A modification of the free-list approach is to store the addresses of n free blocks
    in the first free block. The first n–1 of these blocks are actually free. The
    last block contains the addresses of other n free blocks, and so on. The importance
    of this implementation is that the addresses of a large number of free blocks
    can be found quickly, unlike in the standard linked-list approach.


    # 4.6.4 Counting


    Another approach is to take advantage of the fact that, generally, several contiguous
    blocks may be allocated simultaneously, particularly when space is allocated with
    the contiguous-allocation algorithm or through clustering. Thus, rather than keeping
    a list of n free disk addresses, we can keep the address of the first free block
    and the number n free contiguous blocks that follow the first block. Each entry
    in the free-space list consists of a disk address and a count. Although each entry
    requires more space than a simple disk address, the overall list will be shorter,
    as long as the count is generally greater than 1.


