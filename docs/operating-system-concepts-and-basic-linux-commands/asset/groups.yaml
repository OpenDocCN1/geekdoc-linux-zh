    An I/O-bound program typically has many short CPU bursts. A CPU-bound program
    might have a few long CPU bursts. This distribution can be important in the selection
    of an appropriate CPU-scheduling algorithm.


    Nearly all processes alternate bursts of computing with (disk) I/O requests.


