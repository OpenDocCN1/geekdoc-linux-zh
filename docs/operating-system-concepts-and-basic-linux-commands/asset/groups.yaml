    | l | 右移 |

    | h | 左移 |

    | j | 下移 |

    | k | 上移 |

    | 0 | 行首 |

    | $ | 行尾 |

    | w | 到下一个单词开头 |

    | W | 到下一个单词开头 |

    | b | 到上一个单词开头 |

    | B | 到上一个单词开头 |

    | Ctrl-f | 下页 |

    | Ctrl-b | 上页 |

    | G | 文件末 |

    | 数字G | 到指定行 |


    ## 5.12.6 添加新文本:


    以下键用于在插入模式在现有文件中打开新行：


    | 键 | 功能 |

    |---|---|

    | a | 在光标右侧追加文本 |

    | A | 在行尾追加文本 |

    | 0 | 在光标下方打开新行 |

    | O | 在光标上方打开新行 |


    ## 5.12.7 删除文本:


    删除文本可以使用许多命令，它们在下表中给出。


    | 命令 | 删除 |

    |---|---|

    | x | 当前字符 |

    | 3x | 当前字符及其后两个字符 |

    | dd | 当前行 |

    | 5dd | 当前行及后续四行 |

    | dw | 从当前光标位置到下一个单词开头 |

    | d$ | 从当前光标位置到行尾 |

    | d0 | 从当前光标位置到行首 |

    | d^w | 从当前光标位置到行内第一个非空白字符 |

    | dG | 从当前行到文件末尾 |

    | d20G | 从当前行到第20行 |


