    # 2.8 Scheduling Criteria:


    Different CPU scheduling algorithms have different properties, and the choice
    of a particular algorithm may favor one class of processes over another. In choosing
    which algorithm to use in a particular situation, we must consider the properties
    of the various algorithms.


    Many criteria have been suggested for comparing CPU scheduling algorithms. These
    criteria are used for comparison between the algorithms to choose the best one.
    The criteria include the following:


    +   CPU utilization. We want to keep the CPU as busy as possible. The CPU utilization
    may range from 0 to 100 percent.'
  - '[PAGE 58]


    In a real system, it should range from 40 percent (for a lightly loaded system)
    to 90 percent (for a heavily used system).


    +   - **Throughput.** If the CPU is busy executing processes, then work is being
    done.put- If the CPU is busy executing processes, then work is being done. One
    measure of work is the number of processes that are completed per time unit, called
    throughput. For long processes, this rate may be one process per hour; for short
    transactions, it may be 10 processes per second.


    +   - **Turnaround time.** From the point of view of a particular process, the
    Important criterion is how long it takes to execute that process. The interval
    from the time of submission of a process to the time of completion of that process
    is the turnaround time. Turnaround time is the sum of the periods spent to get
    into memory, waiting in the ready queue, executing on the CPU, and doing I/O.


