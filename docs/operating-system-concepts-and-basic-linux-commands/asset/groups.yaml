    # Shell 和基础 Linux 命令


    ## 5.1 Shell


    Shell 程序是用来与操作系统通信的解释器。当我们在 提示符处输入命令时，它会被解释并传递给 Linux 内核。内核告诉计算机做什么。Shell 是 Linux
    中常用的实用程序。Shell 为用户提供了以下功能：


    - 交互式环境：Shell 允许用户与主机系统建立对话。这种对话一直持续到用户结束会。

    - Shell 脚本：Shell 脚本是 Linux 操作系统的用户界面。Shell 包含了用户可以使用的内部命令。Shell 脚本是组合在一起并作为独立文件执行的
    Linux 命令组。

    - 输入/输出重定向：可以指示 Linux 命令从文件而不是键盘读取。Shell 还允许用户将命令的输出放入文件中，而不是屏幕上。输出也可以重定向到其他设备，例如打印机或网络上的另一个终端。

    - 管道机制：Linux 提供了管道（pipe）功能，允许一个命令的输出作为另一个 Linux 命令的输入。Linux 文件系统包含许多用于此类目的的实用程序。

    - 通配符功能：除了键盘上常见的普通字母和数字外，Shell 还提供了通配符的使用。这些允许用户在访问文件时应用选择标准，例如用户可以访问所有以字母 ‘m’
    开头的文件。


