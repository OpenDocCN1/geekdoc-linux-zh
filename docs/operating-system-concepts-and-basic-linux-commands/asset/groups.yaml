    Fig 2.10: Queuing diagram of the CPU Scheduling


    # 2.7.3 Context Switch:


    Switching the CPU to another process requires saving the state of the old process
    and loading the saved state of the new process. This task is known as a context
    switch. The context of a process is represented in the PCB of the process; it
    includes the value of the CPU registers, the process state, and memory management
    information. When a context switch occurs, the operating system saves the context
    of the old process in its PCB and loads the saved


    43'
  - '[PAGE 56]


    context of the new process scheduled to run. Context-switch time is pure overhead,
    because the system does no useful work while switching. Its speed varies from
    machine to machine, depending on the memory speed, the number of registers that
    must be copied, and the existence of special instructions (such as a single instruction
    to load or store all registers). Typical speeds are less than 10 milliseconds.


    # 2.7.4 CPU & I/O burst cycle:


    The success of CPU scheduling depends on an observed property of processes:


    Process execution consists of a cycle of CPU execution and I/O wait. Processes
    alternate between these two states. Process execution begins with a CPU burst.
    That is followed by an I/O burst, which is followed by another CPU burst, then
    another I/O burst, and so on. Eventually, the final CPU burst ends with a system
    request to terminate execution.


    ![](img/b3f889342bdc020af96a131b08d63774_56_0.png)


    Fig:2.11 Execution is an alternating sequence of CPU and I/O bursts'
