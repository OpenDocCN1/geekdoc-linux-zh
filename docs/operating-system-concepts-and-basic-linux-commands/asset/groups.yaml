    # Kernel level threads:


    In kernel level threads the kernel does total work of head movement. There is
    no thread table in each process. The kernel has a thread table that keeps track
    of all the threads in the system. When a thread wants to create a new thread or
    destroy any existing thread it makes call to the kernel, kernel then takes the
    action.


    The kernel thread table holds each thread register, state and other information.
    The information is the same as with user level threads, but it is now in the kernel
    instead of the user space.


    The kernel can simultaneously schedule a multiple threads from the same process
    on multiple processors. If a thread in a process is blocked, then the kernel can
    schedule another thread of the same process.


    It requires more cost for creating and destroying threads in kernel. The transfer
    of control from one thread to another within the same process requires a mode
    switch to the kernel.'
