    目录（或子目录）包含一组文件或子目录。目录本身就是另一个文件，但它被以特殊的方式处理。所有目录具有相同的内部格式。每个目录条目中的一个位定义了该条目是文件（0）还是子目录（1）。使用特殊的系统调用来创建和删除目录。


    路径名有两种类型：绝对路径名或相对路径名。绝对路径名从根目录开始，沿着路径到达指定的文件，给出路径上的目录名。相对路径名定义从当前目录开始的路径。例如，在图
    4.9 的树形文件系统中，如果当前目录是 `root/spell/mail`，那么相对路径名 `prt/first` 与绝对路径名 `root/spell/mail/prt/first`
    指向同一个文件。


    ![](img/b3f889342bdc020af96a131b08d63774_131_0.png)


    图 4.10：树形目录结构


    ## 4.8.4 无环图目录


    考虑正在合作项目的程序员。与项目相关的文件可以存储在一个子目录，将它们与这两个程序员的其他项目和文件隔离开。由于两个程序员对项目负有等责任，他们都希望子目录位于自己的目录中。公共子目录应该是共享的。共享目录或文件将同时存在于文件系统的两个（或多个）地方。


    无环图——即没有循环的图——允许目录共享子目录和文件（图 4.11）。同一个文件或子目录可能位于两个不同的目录中。无环图是树形目录方案的自然推广。


    需要注意的是，共享文件（或目录）等同于该文件的两个副本。对于两个副本，每个程序员都可以查看副本而不是原始文件，但如果其中一个程序员更改了文件，更改不会出现在另一个人的副本中。对于共享文件，只存在一个实际文件，因此一个人所做的任何更改对另一个人都是立即可见的。共享对于子目录尤为重要；一个人创建的新文件将自动出现在所有共享子目录中。


    ![](img/b3f889342bdc020af96a131b08d63774_132_0.png)


    图 4.11 无环图结构。


    ## 4.8.5 通用目录


    使用无环图的一个严重问题是确保没有循环。如果我们从树形目录开始，并允许树形目录出现链接，它是很容易的。然而，当我们向树形目录添加链接时，就会产生循环。


    ![](img/b3f889342bdc020af96a131b08d63774_133_0.png)


    图 4.12 图结构


    ## LINUX 操作系统


    1991 年，Linus Torvalds 写了 Linux 的第一个版本。Linux 用于各种硬件，包括桌面计算机、超级计算机、大型机以及手机等嵌入式设备。Linux
    操作系统的核心是内核。内核是提供用户与硬件之间接口的软件，负责维护文件系统、执行命令、启动程序、计时系统活动以及管理内存和其他资源。


    Shell 是命令解释器。它将用户在提示符处输入的命令翻译成内核可读的格式。


    实用程序是用户与计算机系统交互的不同程序，根据兴趣包括数据库系统、视频游戏、业务程序等。


    ![](img/b3f889342bdc020af96a131b08d63774_134.png)


    图 4.13 操作系统结构


    ## 4.10 登录与注销：


    登录 Linux 账户涉及两个步骤：


    - i) 输入你的用户名

    - ii) 输入你的密码


    输入用户账户的用户名。如果你出错，可以使用退格键删除字符。考虑以下示例，用户输入 aditi，然后提示输入密码：


    ```

    turtle login: aditi

    password:

    ```


    当你输入密码时，它不会显示在屏幕上。这是为了防止他人看到密码。如果用户输入的用户名或密码错误，系统将返回错误信息“Login incorrect”，并再次要求用户名，重新开始登录过程。用户可以重新输入用户名和密码。


    一旦用户名和密码输入正确，用户即登录系统。将显示用户的命令行提示符，等待用户输入命令。命令行提示符是美元符号 ($)而不是数字号符号 (#)。


    $ 是普通用户的提示符，而 # 是 root 用户的提示符。提示符之前是主机名和由括号括起的当前用户目录。


    ```

    [turtle/home/aditi]$

    ```


    使用 logout 或 exit 命令结束会话。这将返回登录提示符，Linux 等待另一个用户登录。


