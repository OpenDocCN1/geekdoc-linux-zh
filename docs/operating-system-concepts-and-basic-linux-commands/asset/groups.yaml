    ## 5.9 cat command:


    To view the content of a file, use cat (concatenate). Its syntax is:


    ```

    $ cat filename

    ```


    Here filename is the name of the file you want to view. The cat command displays
    the content of the file to the standard output. You can also use cat to concatenate
    multiple files into a single file. For example:


    ```

    $ cat file1 file2 > file3

    ```


    This command combines file1 and file2 and saves the output in file3.


    ## 5.10 wc command:


    The wc command is used to count the number of lines, words, and characters in
    a file. Its syntax is:


    ```

    $ wc [options] filename

    ```


    | Option | Function |

    | --- | --- |

    | -l | Counts the number of lines |

    | -w | Counts the number of words |

    | -c | Counts the number of bytes (characters) |


    For example:


    ```

    $ wc -l file.txt

    ```


    This will output the number of lines in file.txt.


    ## 5.11 Manipulating files and directories


    ### Copying Files (cp)


    The cp command is used to copy files and directories. Its basic syntax is:


    ```

    $ cp source destination

    ```


    Here source is the file or directory you want to copy, and destination is the
    location where you want the copy to be created. For example:


    ```

    $ cp file1.txt file2.txt

    ```


    To copy a directory, you must use the -r option:


    ```

    $ cp -r directory1 directory2

    ```


    ### Renaming and Moving Files (mv)


    The move command is used to both rename and move files and directories. Its syntax
    is:


    ```

    $ mv source destination

    ```


    To rename a file, use the new name as the destination. To move a file to another
    directory, specify the directory as the destination:


    ```

    $ mv file1.txt /path/to/destination/

    ```


    ### Removing Files (rm)


    The rm command is used to delete files and directories from the system. Its syntax
    is:


    ```

    $ rm [options] filename

    ```


    To remove multiple files, list them all:


    ```

    $ rm file1 file2

    ```


    To remove a directory, use the -r option:


    ```

    $ rm -r directory

    ```


    ### Changing Directories (cd)


    The cd command is used to change the current working directory. Its syntax is:


    ```

    $ cd directory

    ```


    Here directory is the path to the directory you want to enter. To go up one directory
    level, use:


    ```

    $ cd ..

    ```


    To go to the home directory, use:


    ```

    $ cd ~

    ```


    ### Creating Directories (mkdir)


    The mkdir command is used to create new directories. Its syntax is:


    ```

    $ mkdir directory

    ```


    Here directory is the name of the new directory you want to create. To create
    multiple directories at once, list them:


    ```

    $ mkdir dir1 dir2 dir3

    ```

