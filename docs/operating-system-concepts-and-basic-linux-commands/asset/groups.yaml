    ## 4.7.2 Linked allocation:


    Linked allocation solves all problems of contiguous allocation. With linked allocation,
    each file is a linked list of disk blocks; the disk blocks may be scattered anywhere
    on the disk. The directory contains a pointer to the first and last blocks of
    the file. For Shital Vivek Ghate example, a file of five blocks might start at
    block 9, continue at block 16, then block 10, and finally block 25 as shown in
    figure. Each block contains a pointer to the next block. These pointers are not
    made available to the user. Thus, if each block is 512 bytes, and an address (the
    pointer) requires 4 bytes, then the user sees blocks of 508 bytes.


    To create a new file, we simply create a new entry in the directory. With linked
    allocation, each directory entry has a pointer to the first disk block of the
    file. This pointer is initialized to nil (the end-of-list pointer value) to signify
    an empty file. The size field is also set to 0. A write to a file causes a free
    block to be found via the free-space-management system, and this new block is
    then written to, and is linked to the end of the file. To read a file, we simply
    read blocks by following the pointers from block to block.


    There is no external fragmentation with linked allocation, and any free block
    on the free-space list can be used to satisfy a request. The size of a file does
    not need to be declared when that file is created. A file can continue to grow
    as long as free blocks are available.


    The major problem with linked allocation is that it can be used effectively only
    for sequential-access files. To find the ith block of a file, we must start at
    the beginning of that file, and follow the pointers until we get to the ith block.


