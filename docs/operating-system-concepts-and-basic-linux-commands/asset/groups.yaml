    The talk command is similar to write command except that it reserves a separate
    area for both the sender and recipient. The syntax is exactly the same as write.


    Syntax:

    `talk <username> [ttyname]`


    When talk is activated with valid username or valid terminal name, both the screen
    is cleared, the recipient''s screen is divided into two parts. The top half of
    the screen is where the sender will type a message. The recipient can respond
    with:


