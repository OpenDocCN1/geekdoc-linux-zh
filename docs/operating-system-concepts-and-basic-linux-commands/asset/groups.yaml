    # 2.2.2 Process State:


    As a process executes, it changes state. The state of a process is defined in
    part by the current activity of that process. Each process may be in one of the
    following states:


    +   - New: The process is being created.


    +   - Running: Instructions are being executed.


    +   - Waiting: The process is waiting for some event to occur as an I/O completion
    or reception of a signal.


    +   - Ready: The process is waiting to be assigned to a processor.


    +   - Terminated: The process has finished execution.'
  - "[PAGE 43]\n\n# Operating System Concepts and Basic Linux Commands\n\nThese names\
    \ are arbitrary, and they vary across operating systems. The states that they\
    \ represent are found on all systems, however. Certain operating systems also\
    \ more finely delineate process states. It is important to realize that only one\
    \ process can be running on any processor at any instant. Many processes may be\
    \ ready and waiting, however. The state diagram corresponding to these states\
    \ is presented in following figure.\n\n![](img/b3f889342bdc020af96a131b08d63774_43_0.png)\n\
    \nFig: 2.2 Process State diagram\n\n**New $\rightarrow$ Ready:** The operating\
    \ system creates a process and prepare the process to be executed, then the operating\
    \ system moved the process into Ready state.\n**Ready $\rightarrow$ Running:**\
    \ The operating system selects one of the job from the ready queue and move the\
    \ process from ready state to running state."
  - "[PAGE 44]\n\nRunning→ Terminated : When the execution of a process has completed,\
    \ then the operating system terminates that process from running state. Sometimes\
    \ operating system terminates the process due to some other reasons like memory\
    \ unavailable, access violation, protection error, I/O failure, data misuse and\
    \ so on.\n\nRunning\rightarrowReady: When the time slot of the processor expired,\
    \ or if the processor received any interrupt signal, then the operating system\
