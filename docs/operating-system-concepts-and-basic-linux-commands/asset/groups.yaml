    +   **Creating a file:

    Two steps are necessary to create a file. First, space in the file system must
    be found for the file. Second, an entry for the new file must be made in the directory.
    The directory entry records the name of the file, its location in the file system,
    and possibly other information.


    +   **Writing a file:

    To write a file, we make a system call specifying both the name of the file and
    the information to be written to the file. Given the name of the file, the system
    searches the directory to find the file''s location. The directory entry will
    need to store a pointer to the current end of the file. Using this pointer the
    address of the next block can be computed and the information can be written.
    The write pointer must be updated.


    +   **Reading a file:

    To read from a file, we use a system call that specifies the name of the file
    and memory location where the next block of the file should be put. Again the
    directory is searched for the associated directory entry. And again the directory
    will need a pointer to the next block to be read. Once that block is read , the
    pointer is updated. A given process is usually only reading or writing a given
    file, and the current operation location is kept as a per-process current-file-position
    pointer. Both the read and write operations use this same pointer, saving space
    and reducing the system complexity.


    +   **Repositioning within a file:

    The directory is searched for the appropriate entry, and the current-file-position
    pointer is set to a given value (given position). Repositioning within a file
    need not involve any actual I/O. This file operation is also known as files seek.'
