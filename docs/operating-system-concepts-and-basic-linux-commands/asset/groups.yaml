    ## 4.8 Directory structure


    The file systems can be extensive. Some systems store millions of files. To manage
    these, we need to organize them. This organization is usually done in two parts.


    First, disks are split into one or more partitions. Typically, each partition
    contains at least one directory, which is a structure in which files reside. Second,
    each directory contains information about files. This information records—such
    as name, location, size, and type—for all files.


    The directory can be viewed as a symbol table that translates file names into
    entries. We want to be able to insert entries, delete entries, search for an entry,
    and list the entries.


    When considering a directory structure, following are the operations that are
    to be performed:


    - **Search for a file**: We need to be able to search a directory to find the
    entry for a particular file. Since files have names and similar names may indicate
    a relationship between files, we may want to be able to find all files whose names
    match a pattern.

    - **Delete a file**: When a file is no longer needed, we want to remove it from
    the directory.

    - **List a directory**: We need to be able to list the files in a directory and
    the contents of the directory entry for each file.

    - **Rename a file**: Because the name of a file represents its contents to its
    users, we must be able to change the name when the contents or use of the file
    changes. Renaming a file may also allow its position within the directory to change.

    - **Traverse the file system**: We may wish to access every directory and every
    file within a directory. For reliability, it is a good idea to save the contents
    and structure of the entire file system at regular intervals. Often, we do this
    by copying all files to magnetic tape. This technique provides a backup copy in
    case of system failure. In addition, if a file is no longer in use, the file can
    be copied to tape and the disk space released released for reuse.


