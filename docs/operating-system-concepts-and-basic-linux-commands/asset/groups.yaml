    # Shutting Down from command line:


    User can shutdown the system in either of two ways. First log in to an account
    and then enter the halt command. This command will log out and shut down the system.


    ```

    $ halt

    ```


    User can also use the shutdown command with the -h option to shut down the system.
    Or with the -r option, to shut down the system and then reboots. To shut down
    the system immediately, +0 or now options are used.


    ```bash

    # shutdown -h now

    ```


    ## 4.11 Directory Structure


    Linux sees each and everything as files. So it is important to understand exactly
    what a Linux file is and how it organizes files within the system. Every kind
    of file you might need is stored in Linux file system as system files, data files,
    application files, utility files, driver files, configuration files and more.
    Each of these file has a name and a directory structure which is stored in file
    system.


    The Linux file system is built on a tree structure like DOS, Microsoft and UNIX
    file system. There is a root directory, identified by ''/'' character, below which
    all other directories and subdirectories grow. The files are contained in these
    directories and subdirectories.


    Directory names can be made up of a combination of numbers, symbols, and characters.
    The name of the directory includes the location of the directory i.e. the path
    of the directory to follow through the file system to get the directory in the
    file system.


    Directories that are nested within other directories are called subdirectories.


    The base of the directory structure is a root directory (''/''). It contains all
    the subdirectories and files in the Linux system.


    ![](img/b3f889342bdc020af96a131b08d63774_137_0.png)


    # Fig 4.14.: Directory Structure in Linux


    - **/bin:** Executable files are stored in the /bin (binary) directory. In this
    directory Linux keeps its basic commands and programs. There are commands that
    starts the various shells, commands for working with files (like copying and moving),
    commands to change file permissions and configuration utilities.


    - **boot:** In this directory the boot configuration files and commands are stored.
    This directory contains everything needed to boot the system.


    - **dev:** In this directory all the device files (or drivers are kept for all
    computer hardware components). when we configure Linux to use a particular device,
    we have to configure particular file in this directory.


    - **etc:** In this directory Linux keeps the system configuration files and initialization
    scripts. You can edit this files to add users to the system and change their password(/etc/passwd
    file), create a group account for file sharing (/etc/group file).


    - **/home:** Each user on the system has a personal directory in which he can
    store his own created files. This directory contained in /home directory. In this
    directory each user has a separate subdirectory except the super user. Users home
    directories are for storing personal files and not accessible by other users on
    the system.


    - **/lib:** The /lib directory contains the libraries for c and other programming
    languages. It also contains the shared library images that are needed to boot
    the system and run commands.


    - **/lost+found:** In this directory use can look for a file if he thinks that
    Linux has lost it. If there are several partitions on the system, there is a /lost+found
    directory on each partition.


    - **/mnt:** This is a directory where other file system can be attached or mounted
    to the Linux file system. For example to view the contents of a CD-ROM, user can
    look in /mnt/cdrom directory. To see the contents of floppy disk, user can look
    in /mnt/floppy.


    - **/proc:** This directory contains virtual files that Linux uses to keep track
    of ongoing processes. They are virtual files and are not actually present there.
    They take up no space at all on the disk.


    - **/root:** The /root directory is the home directory for the super user or system
    administration.


    - **/sbin:** This directory contains the files for use by the super user ( system
    administration. This directory contains commands that shut down the system, set
    the system clock, check the file system for errors and set up networking.


    - **/tmp:** Temporary files are located in /tmp directory. Here all users can
    temporarily store files so that other users can access them. All Operating System
    Concepts and Basic Linux Commands the data stored in the /tmp directory will be
    lost when the system is rebooted.


    - **/usr:** This directory contains files that are not a part of the Linux file
    system. For example it contains applications for X Window System, Linux game collection
    and a long list of help files.


    - **/var:** This directory contains log files. The information in logs indicate
    what software was loaded at boot and the system hardware is configured.


    ## 4.12 Naming Files and Directory:


    Every file on the system are assigned names and they resides in the system. First
    time when the user save a document, he need to select a directory in the file
    system in which to store the file and give the file name. Following are few steps
    to store documents in the right place and name in the file system.


    - Determine the length of file name, the file name can contain as many 256 character.
    File name includes the directory path that leads to the file. For example, the
    individual file named template.bmp located in /home/aditi/images directory is
    31 characters long. The actual file name is /home/aditi/images/template.bmp.

    - For naming files , you can use all the alphabets from A to Z (both lowercase
    and uppercase letters ) or any numbers from 0 to 9. You can also use dash(-) or
    underscores (_). Linux file names are case sensitive. An uppercase ‘A’ is not
    the same as lower case ‘a’. A file template.bmp is different from TEMPLATE.bmp.

    - Avoid put space in filename that causes problem.

    - To create hidden files, begin the filename with period (.), for example if you
    want to create .file1.txt

    - Find the command and change to your home directory. Type cd and press Enter.

    - Create a file named firstfile. Type cat > firstfile and press Enter.

    - To read the file you just created, type cat firstfile and press Enter.


    ![](img/b3f889342bdc020af96a131b08d63774_141_0.png)


    # Shell and Basic Linux Commands


    ## 5.1 Shell


    The shell program is the interpreter through which we communicate with the operating
    system. As we type in a command at the shell prompt, it is interpreted and passed
    to the Linux kernel. The kernel tells the computer what to do. Shell is the most
    used utility program in Linux. Shell offers the following features to the user.


    - Interactive Environment: The shell allows the user to create a dialogue between
    the user and the host system. This dialogue lasts until the user ends the session.

    - Shell scripts: Shell script is the user interface to the computer system for
    the Linux operating system. The shell contains internal commands which can be
    utilized by the user. Shell scripts are groups of Linux commands strung together
    and executed as individual files.

    - Input/output redirections: Linux commands can be instructed to take their instructions
    from files, and not from the keyboard. The shell also allows the user to place
    the output of commands into a file and not on screen of the terminal. Output can
    also be redirected to other devices, such as to a printer or another terminal
    on the network.

    - Piping Mechanism: Linux supplies ‘pipe’ facility that allows the output of one
    command to be used as input in another Linux command. The Linux file system contains
    many utilities that are useful for such purpose.

    - Metacharacter facility: Apart from the normal characters found on a keyboard
    letters and digits, the shell provides the use of ‘metacharacters’. these allows
    the user to apply selection criteria when accessing files, for example the user
    could access all files that begin with the letter ‘m’.

