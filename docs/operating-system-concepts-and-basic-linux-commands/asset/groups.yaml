- md: "\n![](img/b3f889342bdc020af96a131b08d63774_45_0.png)\n\nFig 2.3: Steps to create\
    \ a process\n\nThe source modules or source code (a program written in programming\
    \ languages) is translated into object programs or object modules with the help\
    \ of translator (compiler). The re-locatable object modules are converted to absolute\
    \ programs by linker. The absolute programs are converted into executable programs\
    \ by loaders. Then the processor executes this program. This executing program\
    \ is called a process.\n\nThe process consists of the machine code image of the\
    \ program in memory and PCB structure.\n\n## 2.3.2 Terminate an Existing Process\n\
    \nThe dual of creating a process is terminating it. A process can terminate itself\
    \ by returning from its main function, or by calling the exit system call. Generally\
    \ the process terminates when execution is finished. Some other causes are:\n\n\
    - Time slot expired\n- Memory violation\n- I/O failure \n- Invalid instruction\n\
    \n**Time slot expired:** When the process execution does not complete within the\
    \ time quantum, the process is terminated from running state. The CPU picks the\
    \ next job in ready queue to execute.\n\n**Memory violation:** If the process\
    \ needs more memory than available, the process is terminated from running state.\n\
    \n**I/O Failure:** A process needs an I/O operation at the time of execution,\
    \ but the I/O device is not available at that time. Then the process is moved\
    \ to waiting state. If the operating system does not provide the I/O device, even\
    \ if the process resides in the waiting state, then the process is terminated.\n\
    \n**Invalid instruction:** If the process has invalid instructions and the CPU\
    \ fails to execute those instructions, then the process is terminated.\n\n## 2.3.3\
    \ Suspend execution\n\nA process may suspend itself by going to sleep. This means\
    \ that it tells the system that it has nothing to do now, and therefore should\
    \ not run. A sleep is associated with a time: when this future time arrives, the\
    \ system will wake the process up.\n\n## 2.3.4 Send a signal or message\n\nA common\
    \ operation among processes is the sending of signals. A signal is often described\
    \ as a software interrupt: the receiving process receives the signal rather than\
    \ continuing with what it was doing. In many cases, the signal terminates the\
    \ process unless the process takes some action to prevent this.\n\n## 2.4 Concurrent\
    \ process\n\nConcurrent processing is a computing model in which multiple processors\
    \ execute instructions simultaneously for better performance. Tasks are broken\
    \ down into subtasks that are then assigned to separate processors to perform\
    \ simultaneously, instead of sequentially as they would have to be carried out\
    \ by a single processor. Concurrent processing is sometimes said to be synonymous\
    \ with parallel processing.\n\nEach of the concurrently executing sequential programs\
    \ is called a process. Process execution, although concurrent, is usually not\
    \ independent. Processes may affect each other's behavior through shared data,\
    \ shared resources, communication, and synchronization.\n\n![](img/b3f889342bdc020af96a131b08d63774_47_0.png)\n\
    \n# Fig 2.4: Concurrent process\n\nIn figure (a) process1 starts its execution\
    \ at time $t_0$, process2 starts its execution only after process1 has finished\
    \ its execution, and process3 starts its execution only when process2 has finished\
    \ its execution. These processes are said to be serial processes.\n\nIn figure\
    \ (b), the execution time of process1, process2, process3 are overlapped, so these\
    \ are said to be concurrent processing.\n\n## 2.5 Threads\n\nIn computer science,\
    \ a thread of execution is the smallest sequence of programmed instructions that\
    \ can be managed independently by an operating system scheduler. A thread is a\
    \ light-weight process. The implementation of threads and processes differs from\
    \ one operating system to another, but in most cases, a thread is contained inside\
    \ a process. Multiple threads can exist within the same process and share resources\
    \ such as memory, while different processes do not share these resources.\n\n\
    A process is divided into a number of light-weight processes. Each weight process\
    \ is called a thread. The thread has a program counter that keeps track of which\
    \ instruction to execute next, it has registers which hold its current working\
    \ variables. It has a stack which contains the execution history.\n\nNumber of\
    \ threads can share memory space, open files and other resources, just as the\
    \ same number of processes can share physical memory, disk, printers and so on.\
    \ Threads have some of the properties of a process and it operates in many respects\
    \ in the same manner as a process. Threads can be in one of several states: Ready,\
    \ Blocked, running or terminated. Threads share the CPU, and only one thread can\
    \ be active at a time. Threads are not independent of one another. All threads\
    \ can access any address in the task. A thread can read or write over any other\
    \ threads' stacks.\n\nThe thread of program which may be executed concurrently\
    \ with other threads, this capability is called multi-threading.\n\n### Example\
    \ of thread:\n\nA programmer wishes to type the text in a word processor, then\
    \ the programmer opens a file in the word processor and types the text, it is\
    \ one thread; then the text is automatically formatted, it is another thread.\
    \ The text automatically specifies spelling mistakes, which is again another thread.\
    \ And finally, the file is automatically saved to the disk, which is again a thread.\
    \ Thus typing, formatting, spell checking, saving file—all these are threads.\n\
    \n![](img/b3f889342bdc020af96a131b08d63774_49_0.png)\n\n## 2.6 Multithreading\n\
    \nA process is divided into a number of smaller tasks, each task is called a thread.\
    \ Number of threads within a process executing at a time is called multithreading.\
    \ Based on functionality, threads are divided into four categories:\n\n- One to\
    \ one\n- One to Many\n- Many to one\n- Many to many\n\n![](img/b3f889342bdc020af96a131b08d63774_49_1.png)\n\
    \n### One to one (One process thread)\n\nIn this approach, the process maintains\
    \ only one thread, so it is called single-threaded approach. MS-DOS operating\
    \ system supports this type.\n\n### One to Many (One process, multiple threads)\n\
    \nIn this approach a process is divided into a number of threads. The best example\
    \ of this is Java runtime environment.\n\n### Many to one (Multiple processes,\
    \ one thread per process)\n\nAn operating system supports multiple processes but\
    \ only one thread per process. Best example is UNIX.\n\n### Many to many (Multiple\
    \ processes, multiple threads)\n\nIn this approach each process is divided into\
    \ a number of threads. Examples are Windows 2000, Solaris.\n\nThere are two main\
    \ ways to implement threads:\n\n- In user space\n- In kernel space\n\n### User\
    \ level threads\n\nThis type of threads is loaded entirely in user space; the\
    \ kernel knows nothing about them. When threads are managed in user space, each\
    \ process has its own thread table. The thread table contains information like\
    \ program counter, registers, etc. When the thread is moved to ready state or\
    \ blocked state, the information needed to restart it is stored in the thread\
    \ table.\n\nUser threads allow each process to have its own scheduling algorithm.\
    \ The entire process is loaded in user space, so the process does not switch to\
    \ kernel mode to do thread management. User level threads can run on any operating\
    \ system.\n\nWhen a user level thread executes a system call, all the threads\
    \ within the process are blocked. Only a single thread within a process can execute\
    \ at a time, so multi-processing is not implemented.\n\n# Operating System Concepts\
    \ and Basic Linux Commands\n\n![](img/b3f889342bdc020af96a131b08d63774_51_0.png)\n\
    \nFig 2.7: User Level Threads\n\n### Kernel level threads\n\nIn kernel level threads,\
    \ the kernel does the total work of thread management. There is no thread table\
    \ in each process. The kernel has a thread table that keeps track of all the threads\
    \ in the system. When a thread wants to create a new thread or destroy any existing\
    \ thread, it makes a call to the kernel; the kernel then takes the action.\n\n\
    The kernel thread table holds each thread register, state and other information.\
    \ The information is the same as with user level threads, but it is now in the\
    \ kernel instead of the user space.\n\nThe kernel can simultaneously schedule\
    \ multiple threads from the same process on multiple processors. If a thread in\
    \ a process is blocked, then the kernel can schedule another thread of the same\
    \ process.\n\nIt requires more cost for creating and destroying threads in kernel.\
    \ The transfer of control from one thread to another within the same process requires\
    \ a mode switch to the kernel.\n"
  mdcn: "\n\n![](img/b3f889342bdc020af96a131b08d63774_45_0.png)\n\n图 2.3: 创建进程的步骤\n\
    \n源模块或源代码（用编程语言编写的程序）在翻译器（编译器）的帮助下被翻译成目标程序或目标模块。可重定位目标模块由链接器转换为绝对程序。绝对程序由加载器转换为可执行程序。然后处理器执行该程序。这个正在执行的程序被称为进程。\n\
    \n进程由内存中的程序机器码映像和 PCB 结构组成。\n\n## 2.3.2 终止现有进程\n\n创建进程的对立面是终止进程。进程可以通过从其主函数返回或通过调用\
    \ `exit` 系统调用来终止自身。通常情况下，进程在执行完成时终止。其他原因还包括：\n\n- 时间片过期\n- 内存违规\n- I/O 错误 \n-\
    \ 无效指令\n\n**时间片过期：** 当进程执行未在时间量子内完成时，进程将从运行状态终止。CPU 从就绪队列中选取下一个任务执行。\n\n**内存违规：**\
    \ 如果进程需要的内存超过可用内存，进程将从运行状态终止。\n\n**I/O 错误：** 进程在执行时需要 I/O 操作，但此时 I/O 设备不可用。那么进程将移动到等待状态。如果操作系统不提供该\
    \ I/O 设备，即使进程处于等待状态，进程也会被终止。\n\n**无效指令：** 如果进程包含无效指令且 CPU 无法执行这些指令，则进程将被终止。\n\n\
    ## 2.3.3 挂起执行\n\n进程可以通过进入睡眠自我挂起。这意味着它告诉系统自己现在无事可，因此不应该运行。睡眠与一个时间相关：当这个未来的时间到达时，系统将唤醒该进程。\n\
    \n## 2.3.4 发送信号或消息\n\n进程之间的一种常见操作是发送信号。信号通常被描述为软件中断：接收进程接收信号，而不是继续它之前正在做。在许多情况下，除非进程采取行动防止这种情况，否则信号会终止进程。\n\
    \n## 2.4 并发进程\n\n并发处理是一种计算模型，其中多个处理器同时执行指令以获得更好的性能。任务被分解为子任务，然后分配给不同的处理器同时执行，而不是像单处理器执行的那样顺序执行。并发处理有时被认为与并行处理同义。\n\
    \n每个并发执行的顺序程序都称为进程。进程的执行虽然是并发的，但通常不是独立的。进程可能会通过共享数据、共享资源、通信和同步相互影响行为。\n\n![](img/b3f889342bdc020af96a131b08d63774_47_0.png)\n\
    \n# 图 2.4: 并发进程\n\n在图 (a) 中，process1 在时间 $t_0$ 开始执行，process2 在 process1 完成执行后才开始执行，而\
    \ process3 只在 process2 完成执行后才开始执行。这些进程被称为串行进程。\n\n在图 (b) 中，process1、process2、process3\
    \ 的执行时间是重叠，因此这些被称为并发处理。\n\n## 2.5 线程\n\n在计算机科学中，执行线程是操作系统调度程序可以进行独立管理的最小程序指令序列。线程是一个轻量级进程。线程和进程的实现在不同操作系统之间有所不同，但在大多数情况下，线程包含在进程内部。多个线程可以存在于同一个进程中并共享内存等资源，而不同的进程不共享这些资源。\n\
    \n进程被划分为若干轻量级进程。每个轻量级进程被称为线程。线程拥有一个程序计数器，用于跟踪下一个要执行哪条指令，它拥有持有当前工作变量的寄存器。它 true一个包含执行历史的栈。\n\
    \n相同数量的线程可以共享内存空间、打开的文件和其他资源，就像相同数量的进程可以共享物理内存、磁盘、打印机等等。线程具有进程的一些属性，并且在许多方面的操作方式与进程相同。线程可以处于几种状态之一：就绪、阻塞、运行或终止。线程共享\
    \ CPU，且一次只有一个线程是激活状态的。线程之间互不独立。所有线程都可以访问任务中的任何地址。一个线程可以读取或写入任何其他线程的栈。\n\n可以与其它线程并发执行的程序线程，这种能力被称为多线程。\n\
    \n### 线程示例：\n\n一个程序员希望在文字处理器中打字文本，然后程序员在文字处理器中打开一个文件并输入文本，这是一个线程；然后文本自动进行格式化，这是另一个线程。文本自动指出拼写错误，这又是另一个线程。最后，文件自动保存到磁盘，这又是一个线程。因此，打字、格式化、拼写检查、保存文件——这些都是线程。\n\
    \n![](img/b3f889342bdc020af96a131b08d63774_49_0.png)\n\n## 2.6 多线程\n\n进程被划分为若干较小任务，每个任务被称为线程。进程中同时执行的线程数量被称为多线程。根据功能，线程被分为四类：\n\
    \n- 一对一\n- 一对多\n- 多对一\n- 多对多\n\n![](img/b3f889342bdc020af96a131b08d63774_49_1)\n\
    \n### 一对一（一个进程线程）\n\n在这种方法中进程只维护一个线程，因此被称为单线程方法。MS-DOS 操作系统支持这种类型。\n\n### 一对多（一个进程多个线程）\n\
    \n在这种方法中一个进程分为多个线程。最好的例子是 Java 运行时环境。\n\n### 多对一（每个进程一个线程）\n\n操作系统支持多个进程但每个进程只有一个线程。最好的例子是\
    \ UNIX。\n\n### 多对多（多个进程多个线程）\n\n在这种方法中每个进程分为多个线程。例子有 Windows 2000、Solaris。\n\n\
    实现线程有两种主要方式：\n\n- 在用户空间\n- 在内核空间\n\n### 用户级线程\n\n这类线程完全加载在用户空间；内核对它们一无所知。当在用户空间管理线程时，每个进程都有自己的表。表包含程序计数、寄存器等信息。当线程移动到就绪状态或阻塞状态时，重启它的信息存储在表中。\n\
    \n用户线程允许每个进程拥有自己的调度算法。整个进程加载在用户空间，因此进程不需要切换到内核模式进行线程管理。用户线程可以在任何操作系统运行。\n\n当用户线程执行系统调用时，进程内的所有线程都会被阻塞。进程内只有一个线程可以执行，因此没有实现多处理。\n\
    \n# 操作系统概念和基础 Linux 命令\n\n![](img/b3f889342bdc020af96a131b08d63774_51_0.png)\n\
    \n图 2.7: 用户级线程\n\n### 内核级线程\n\n在内核级线程中，内核完成线程管理的所有工作。每个进程没有线程表。内核有一个表来跟踪系统中所有的线程。当线程想要创建新线程或销毁任何现有线程时，它调用内核；然后内核采取行动。\n\
    \n内核线程表持有每个线程的寄存器、状态和其他信息。信息与用户线程相同，但现在位于内核而不是用户空间。\n\n内核可以在多个处理器上同时调度同一进程的多个线程。如果进程中的一个线程被阻塞，内核可以调度该进程的另一个线程。\n\
    \n在内核中创建和销毁线程的成本更高。同一进程内线程之间的控制权传递需要切换到内核模式。\n"
