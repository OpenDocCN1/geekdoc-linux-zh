    # 4.2 File Attributes


    A file is named, for the convenience of its human users, and is referred to by
    its name. A name is usually a string of characters, such as ''em.c''. Some systems
    differentiate between uppercase and lowercase characters in names, whereas other
    systems do not. When a file is named, it becomes independent of the process, the
    user, and even the system that created it. The information about all files is
    kept in the directory structure, which also resides on secondary storage.


    A file has other attributes, which vary from one operating system to another but
    typically consist of these:


    +   **Name:** The symbolic file name is the only information kept in human readable
    form.

    * **Identifier:** This unique tag, usually a number, identifies the file within
    the system; it is the non-readable name for the file.

    * **Type:** This information is needed for those systems that support different
    types of files.

    * **Location:** This information is a pointer to a device and to the location
    of the file on that device.

    * **Size:** The current size of the file (in bytes, words, or blocks) and possibly
    the maximum allowed size is included in this attribute.

    * **Protection:** Access-control information determines who can do so reading,
    writing, executing, and so on.

    * **Time, date, and user identification:** This information may be kept for creation,
    last modification, and last use. These data can be useful for protection, security,
    and usage monitoring.


    # 4.3 Operations on Files:


    A file is an **abstract data type**. The basic operation performed on files are
    create file, write to a file, read a file, reposition a file,'
