    The hardware provides the basic computing resources. The application program defines
    the way in which these resources are used to solve the computing problems of the
    users. The system programs consist of compilers, assemblers, linkers etc., the
    operating system controls and coordinates the use of the hardware among the various
    application programs for the various users. Operating system provides an environment
    within which other programs can do useful work and controls I/O devices. The fundamental
    goal of computer system is to execute user programs and solve user problems.'
  - '[PAGE 18]


    ![](img/b3f889342bdc020af96a131b08d63774_18_0.png)


    Fig: 1.2 Basic organization of H/W in computer system


    # 1.5 Services Provided By Operating System:


    An operating system provides an environment for the execution of programs. The
    operating system provides certain services to programs and to the users of those
    programs. The operating system functions provided for the convenience of the programmer
    to make the programming task easier are as follows:


    +   1. Program Execution:

    Users will want to execute programs. The system must be able to load a program
    into memory and run it. The program must be able to end its execution either normally
    or abnormally.


    +   2. Input/output operations:

    A running program may require input and output. This I/O may involve a file or
    an I/O device. Since a user program cannot execute I/O operations directly, the
    operating system must provide some means to do so.


    +   3. File manipulation:

    It should be obvious that user want to read and write files, also want to create
    and delete files by name, operating system provides all the file manipulation
    operations like create a file, read a file, write to a file, delete a file.'
  - '[PAGE 19]


    Operating System Concepts and Basic Linux Commands


    # 4. Error detection:


    The operating system constantly needs to be aware of possible errors. Errors may
    occur in the CPU and memory hardware such as a memory error or power failure and
    in Input/output devices such as a printer out of paper or in the user program
    such as an arithmetic overflow or access to illegal memory location.


    Following set of operating system functions exist for the operation of the system
    itself.


    # 5. Resource allocation:


    When there are multiple users or multiple jobs running at the same time, resources
    must be allocated to each of them. Many different types of resources are managed
    by the operating system.


    # 6. Accounting:


    In multi-user system, operating system keep track of which user uses how many
    and which kind of computer resources.


    # 7. Protection:


    In multi-user system, when jobs of more than one user executed simultaneously,
    it should not be possible for one job to interfere with the other.


    # 1.6 Types of Operating System:


    There are many different types of Operating system depending upon number of users,
    processors, and way of executing programs in memory.


    # A) Serial Processing System:


    In early computer system, there was only computer hardware and didn''t have operating
    system. Early computers were physically very large machines runs from console.
    Programming in 1''s and 0''s (machine language) was quite common. Instruction
    and data used to feed into the computer by means of console switches or perhaps
    through hexadecimal keyboard, paper tapes or punched cards. Then the appropriate
    buttons would be pushed to load the starting address and start the execution of
    the program . as the'
  - '[PAGE 20]


    program ran, the programmer/operator could monitor its execution by the display
    lights on the console. If error occurs, the error condition was indicated by the
    lights. The programmer examines the registers and main memory to identify the
    cause of the error. When execution finished she take the output on the printer
    and then the programmer was ready for next program to execute.


    This type of processing is difficult for users, it takes much time and next program
    should wait for the completion of previous one. The programs are submitted to
    the machine one after other, so this method is said to be serial processing.


    # B) Batch Processing System:


    In batch processing jobs with similar needs are batched together as a group and
    run through the computer as group.

    In early systems compilers and assemblers were normally kept on magnetic tapes.
    To execute particular language program user had to mount that particular compiler
    first which produces assembly language code which need to be assembled. The required
    mounting another tape with assembler.


    During the time that tapes are being mounted or the programmer is operating the
    console, the CPUs sit Idle. In the early days there were very few computers and
    they were very expensive. The computer time was very valuable and the owner of
    the computer wanted them to be used as much as possible.


    Then the first professional computer operators were hired. Since an operator had
    more experience with mounting tapes than programmer, setup time was reduced. Again
    to reduce setup jobs with similar needs were batched together and run through
    the computer as a group.


    Suppose for example the operator received one FORTRAN program, one COBOL program,
    and another FORTRAN program. If he runs them in order, he would have to set up
    for FORTRAN program environment (loading FORTRAN compiler tapes) then setup COBOL
    program and finally setup FORTRAN program again. If he runs the two FORTRAN programs
    as batch, he could setup only once for FORTRAN, thus saving operator’s time.'
- md: '

    Operating System Concepts and Basic Linux Commands


    ## Resident monitor:


    In batch processing during the transition from one job to the next job the CPU
    sits idle. To overcome this idle time, automatic job sequencing is introduced
    and with it the first rudimentary operating system is created. It contains the
    procedure for automatically transferring control from one job to the next job.
    A small program called resident monitor is created for this purpose. The resident
    monitor is always in memory.


    When the computer is turned on, the control of the computer system resides in
    resident monitor, which then transfers it to the program. When the program terminated,
    it returns control to the resident monitor, which then goes on to the next program.
    Thus the resident monitor will automatically sequence from program to another
    and form one job to another.


    The operator had been given a short description of what programs were to run on
    data. To provide this information directly to the resident monitor, control cards
    were introduced. In addition to the program or data for a job, the programmer
    includes special cards (control cards) which are directives for the resident monitor
    indicating what program is to run. For example, a normal user program might require
    one of three programs to run: the FORTRAN compiler (FTN), the assembler (ASM),
    or the user program. There is a separate control card for each of these:


    - $FTN : Execute the FORTRAN compiler.

    - $ASM : Execute the assembler.

    - $RUN : Execute the user program control card.


    In addition, there are two control cards to define the boundaries of each job:


    - $JOB : First card of job.

    - $END : Last card of job.


    Shital Vivek Ghate


    Resident monitor


    | Interrupt & trap vector |

    | :--- |

    | Device Drivers |

    | Job Sequencing |

    | Control card Interpreter |

    | User Program Area |


    Fig 1.3 Memory Layout for Resident Monitors


    ![](img/b3f889342bdc020af96a131b08d63774_22_0.png)


    Fig: 1.4 Card deck for simple batch system


    10


    Operating System Concepts and Basic Linux Commands


    ## Buffering:


    Buffering attempts to keep both the CPU and the I/O devices busy all the time.
    Buffer is a part of memory, used to store data temporarily. After data has been
    read and the CPU is about to start operating on it, the input device is instructed
    to begin the next input immediately. The CPU and input devices are then busy.
    When CPU is ready for the next data item, the input device will have finished
    reading it. The CPU can then begin processing the newly read data, while the input
    device starts to read the following data.


    Similar buffering can be done for output; the CPU creates data which is put into
    a buffer until an output device can accept it.


    Buffering keeps both CPU and I/O devices busy all the time. If the CPU is working
    on one record when an input device is working on another, either the CPU or input
    device finished first. If the CPU finished first, it must wait; it cannot proceed
    until the next record is read. If the input device is faster than CPU, the buffer
    will become full and input device must wait.


    The solution to this problem is that the next I/O operation can only be started
    when the previous one has finished. Interrupts solve this problem. When I/O device
    is finished with an operation, it interrupts the CPU, then CPU stops what it is
    doing and immediately transfers to a fixed location, where the interrupt service
    routine checks to see if the buffer is not full (for an input device) or empty
    (an output device), then starts the next I/O request. The CPU can resume the interrupt
    computation. In this way, I/O devices and CPU can be operated in full speed.


    If the CPU is much faster than an input device, buffering is of little use. If
    the CPU is always faster, then it will always find an empty buffer and have to
    wait for the input device. For output, the CPU can proceed at full speed until
    all systems are full. Then the CPU must wait for the output device.


    ## Spooling:


    The spooling stands for simultaneous peripheral operation on-line. Buffer is a
    small part of memory used to store data temporarily during program execution.
    In Spooling, disk is used as large buffer.


    For example, if two or more users issue the print command and at the same time
    printer is printing some other job, issued print commands will be loaded into
    the spool disk. Spool disk is a temporary buffer; it can read data directly from
    secondary storage devices. While printing the output of some other job at the
    same time, CPU may execute some other job in the spool disk. Thus at the same
    time user is taking input through keyboard for one job, CPU is busy with executing
    other job and printer is busy with taking output of some other job.


    The advantage of spooling over buffering is that spooling overlaps the I/O of
    one job with computation of other job. The spooler may read the input of one job
    while printing the output of a different job. During this time still another job
    may be executed. Buffering can only overlap the I/O of a job with its own computation
    and I/O; spooling can overlap the I/O and computation of many jobs.


    ![](img/b3f889342bdc020af96a131b08d63774_24_0.png)


    Fig: 1.5 Spooling


    ## C) Single Processor System:


    A uniprocessor system is defined as a computer system that has a single central
    processing unit that is used to execute instructions. Uniprocessor system (Standard
    personal computer) contains a single CPU and single I/O channels and is most often
    used as a single user machine and can also be implemented as a multi-user system.


    Operating System Concepts and Basic Linux Commands


    When used for multi-user system, applications of all users are protected from
    each other, system resources are shared among many users and operating system
    maintains control over resources, uses following modes of operations:


    - 1. The microkernel, which contains kernel mode yet is small, modular, executes
    quickly, etc.

    - 2. The user-mode modules for managing resources. It is often true that portions
    of the operating system''s functionality can be executed outside of kernel mode.
    For example, the printing system can be managed entirely as a user-level subsystem.


    Communication in this model is via message passing (even though shared memory
    may be available).


    The main advantage of this approach is its flexibility. It''s relatively easy
    to replace modules, providing performance upgrades, etc. User-level modules can
    theoretically be moved to other machines. The implication there is that this model
    is more suitable to being adopted as a distributed OS. In fact, its message-passing
    communication, which is one of its disadvantages, is another indicator of its
    suitability for distributed implementation.


    Its disadvantages have to do with familiarity and performance. The familiarity
    aspect is that it is not. People feel change. The performance has to do with the
    message passing in the form of extra communication (among somewhat separated modules,
    instead of a unified monolithic structure), which results in a performance loss.


    ![](img/b3f889342bdc020af96a131b08d63774_26_0.png)


    ## D) Multi Processor System:


    The standard system is uniprocessor, that is, it has one main CPU. A multiprocessor
    system would have more than one CPU, sharing memory and peripherals.


    There are two approaches used for multiprocessor operating system.


    ## Master/slave approach:


    The most common multiprocessor systems assign to each processor a specific task.
    There is one master computer. This master computer controls the system. The other
    processors (slaves) either look to the master for instruction or have predefined
    task.


    ## Computer Network:


    In this approach, multiple independent computer systems can communicate, sending
    files and information between them. However, each computer system has its own
    operating system and operates independently.

