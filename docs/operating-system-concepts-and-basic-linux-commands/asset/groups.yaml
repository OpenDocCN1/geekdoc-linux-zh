    进程 P1、P2 和 P3 处于死锁状态。进程 P2 正在等待资源 R3，该资源由进程 P3 持有。进程 P3 正在等待进程 P1 或 P2 释放资源 R2。此外，进程
    P1 正在等待进程 P2 释放资源 R1。


    ## 3.2 死锁条件：


    如果系统中同时满足以下四个条件，则可能发生死锁：


    - 1. **互斥性**：至少有一个资源必须以非共享模式持有；也就是说，同一时间只有一个进程可以使用该资源。如果另一个进程请求该资源，则请求进程必须等待，直到资源被释放。

    - 2. **持有并等待**：进程必须在持有至少一个资源的同时，请求当前由其他进程持有的额外资源。

    - 3. **不可剥夺**：资源不能被强制剥夺；也就是说，资源只能由持有它的进程在完成任务后自愿释放。

    - 4. **循环等待**：必须存在一组等待进程集 [P0, P1, ..., Pn]，使得 P0 正在等待 P1 持有的资源，P1 正在等待 P2 持有的资源，……
    Pn-1 正在等待 Pn 持有的资源，而 Pn 正在等待 P0 持有的资源。


    我们强调，只有当这四个条件同时满足时，死锁才会发生。循环等待条件意味着持有并等待条件成立，因此这四个条件并非完全独立。


    ## 3.3 死锁预防：


    为了使死锁的发生，必须满足四个必要条件中的每一个。通过确保这些条件中至少一个不能成立，我们就可以防止死锁的发生。我们将通过分别检查这四个必要条件来详细说明这种方法。


    ### 3.3.1 互斥性：


    对于不可共享资源，必须满足互斥条件。例如，打印机不能同时被多个进程共享。相比之下，共享资源不需要互斥访问，且不会卷入死锁。只读文件是共享资源的一个良好示例。如果多个进程同时尝试打开一个只读文件，它们可以同时获得该文件的访问权限。进程永远不需要等待共享资源。然而，总的来说，我们无法通过否定互斥条件来防止死锁，因为某些资源在本质上是不可共享的。


    ### 3.3.2 持有并等待


    为了确保系统永远不会发生持有并等待条件，我们必须保证每当进程请求资源时，它都不持有任何其他资源。可以使用的一种协议是：要求每个进程在开始执行之前，请求并分配其所有的资源。


    另一种协议允许进程仅在没有任何资源时才请求某些资源。进程可以请求某些资源并使用它们。但在它请求任何额外资源之前，它必须释放当前分配给的所有资源。


    为了说明这两种协议之间的区别，考虑一个进程从 DVD 驱动器拷贝数据到磁盘上的文件，存储文件，然后将结果打印到打印机。如果所有资源必须在进程开始时请求，那么进程最初必须请求
    DVD 驱动器、磁盘文件和打印机。第二种方法允许进程在整个执行过程中持有打印机，尽管它只在结束时需要打印机。第二种方法最初仅请求 DVD 驱动器和磁盘文件。从
    DVD 驱动器拷贝到磁盘然后释放两者。这两种方法都有缺点。首先，资源利用率可能较低，因为进程可能会长时间持有资源。其次，可能会发生饥饿。


    ### 3.3.3 不可剥夺：


    死锁的第三个必要条件是不可剥夺。为了确保该条件不成立，可以使用以下方法：如果进程持有某些资源并请求另一个资源，我们检查它们是否可用。如果是，则分配新资源。如果不是，则进程必须释放其当前持有的所有资源。


    ### 3.3.4 循环等待：


    死锁的第四也是最后一个条件是循环等待。确保该条件永远不成立的一种方法是给每个资源类型分配一个唯一的编号，允许我们比较两个资源。为了说明，我们设 $R=\{R1,
    R2, ..., Rm\}$ 为资源类型集合。我们定义一个一一函数 $F: R \rightarrow N$，其中 $N$ 是自然数集。例如，如果资源类型集合包括磁带机、磁盘驱动和打印机，那么：


    $F(tape\ drive) = 1$

    $F(disk\ drive) = 5$

    $F(printer) = 12$


    我们现在考虑以下防止死锁的协议：每个进程只能按照枚举编号的递增顺序请求资源。也就是说，进程最初可以请求任意数量的资源类型 $Ri$ 的实例。之后，只有当 $F(Rj)
    > F(Ri)$ 时，进程才能请求资源类型 $Rj$ 的实例。如果需要多个相同类型的实例，必须一次性请求所有实例。例如，使用之前定义的函数，想要同时使用磁带机和打印机的进程必须先请求磁带机再请求打印机。或者，我们可以要求每当进程请求资源类型
    $Rj$ 的实例时，它已经释放了任何 $F(Ri) \geq F(Rj)$ 的 $Ri$。如果使用这两种协议，则循环等待条件不会成立。


    ## 3.4 死锁避免：


    最简单且有效的模型是要求每个进程声明它可能需要的每种资源的最大数量。根据这些先验信息，可以构建一种算法确保系统永远不会进入死锁状态。这种算法定义的死锁避免方法通过动态检查资源分配状态，以确保永远不存在循环等待条件。资源分配状态由可用资源、已分配资源以及进程的最大需求定义。


    **安全状态**：如果系统能够按照某种顺序为每个进程分配资源（直到其最大需求）并仍然避免死锁，则该状态是安全的。


    只有存在**安全序列**时，系统才处于安全状态。如果进程序列 <P1, P2,...,Pn> 是当前分配状态的安全序列，那么对于每个 *Pi*，*Pi* 的资源请求可以由当前所有
    *Pj*（其中 *j < i*）持有的可用资源所满足。


