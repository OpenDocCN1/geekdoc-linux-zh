    ## 3.12 Paging


    The single and multiple partitioning methods supports continuous memory allocation,
    the entire process loaded in partition. In paging the process is divided in a
    number of small parts, these are loaded in to elsewhere in the main memory.


    The physical memory is divided into fixed-sized blocks called frames; the logical
    address space (user Process) is divided into fixed-sized blocks called pages.
    The page size and the frame size must be equal. The size of page or frame depends
    on the operating system. Generally the page size is 4KB.


    In this operating system maintain a data structure, called page table, the page
    table specifies some useful information, it tells which frames are allocated and
    how many total frames are there and so on. The general page table consisting of
    two fields, one is page number and the other is frame number. Each operating system
    has its method for storing page table.


    Every address generated by the CPU is divided into two parts; one is ‘page number’
    and the second is ‘page offset’ or displacement. The page number is used as an
    index in the page table. Consider the following figure, the logical address space
    that CPU generated address space is divided into pages, each page having the page
    number(P) and displacement (D). The pages are loaded in to available free frames
    in the physical memory. Page table contain the base address of each page in physical
    memory, that address is combined with offset to find the physical address of the
    page.


    The mapping between the page number and frame number is done by page map table.
    The page map table specifies which page is loaded in which frame, displacement
    is common.


    For better understanding consider the following example. There are two jobs in
    the ready queue, the size of job1 is 16kb and job 2 is 24kb. The page size is
    4kb. The available main memory is 72kb i. e. 18 frames. So job 1 is divided in
    4 pages and job 2 is divided in 6 pages. Each process maintains a program table.
    Consider the following figure for better understanding.


    # Operating System Concepts and Basic Linux Commands


    Frame Number


    ![](img/b3f889342bdc020af96a131b08d63774_99_0.png)


    # Fig.3.16: Structure of paging scheme


    ![](img/b3f889342bdc020af96a131b08d63774_99_1.png)


    # Fig.3.17: Example of paging


    Four pages of job 1 are loaded in different locations in memory. The O.S. provides
    a page table for each process. The page table specifies the location in main memory.
    The capacity of main memory in this example is 18 frames, and available jobs require
    only 10 frames, so remaining 8 frames are free. These free frames can be used
    for some other jobs.


    **Advantages:** Paging supports the time-sharing system. It does not suffer from
    fragmentation. It supports virtual memory.


    **Disadvantages:** Paging may suffer ‘page breaks’. For example consider a job
    with the logical address space 17kb, the page size is 4kb. So this job requires
    5 frames. The last frame i.e. fifth frame requires only 1kb of memory, so the
    remaining 3kb is wasted. It is said to be page breaks.


    If the number of pages is large, then it is difficult to maintain the page table.


    ## 3.12.1 Shared Pages


    In multiprogramming environment, it is possible to share the common code by number
    of processes at a time, instead of maintaining the number of copies of some code.
    The logical address is divided into pages, these pages can be shared by number
    of processes at a time. The pages which are shared by number of processes are
    called shared pages.


    For example, consider a multiprogramming environment with 10 users. Out of 10
    users, 3 wish to execute a text editor; they want to share their bio-data in the
    text editor. Assume that text editor requires 150kb and user bio-data occupies
    50kb of data space. They would need 3*(150+50)=600kb. But in shared paging the
    text editor is shared by all the users’ jobs, so it requires 150kb and user files
    require 50*3=150kb. Therefore (150+150)=300kb is enough to manage these three
    jobs instead of 600kb. Shared paging saves 300kb of space.


    The frame size is 50kb. So 3 frames are required for text editor and 3 frames
    are required for user files. Each process (P1, P2, P3) has a page table, the page
    table shows the frame numbers, the first 3 frame numbers in each page table i.e.
    3,8,0 are common. It means the three processes shared the three pages. The main
    advantage of shared pages is that efficient memory utilization is possible.


