    when a new process arrives at the ready queue while a previous process is still
    executing. The next CPU burst of the newly arrived process may be shorter than
    what is left of the currently executing process. A preemptive SJF algorithm will
    preempt the currently executing process, where as a non-preemptive SJF algorithm
    will allow the currently running process to finish its CPU burst.


