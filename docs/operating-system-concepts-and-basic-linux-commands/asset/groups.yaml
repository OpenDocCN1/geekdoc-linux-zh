    P2, 9 milliseconds for process P3, and 0 milliseconds for process P4.


    ## Average waiting time


    Waiting time= starting time – Arrival time

    Waiting time for P1= 3 - 0 = 3

    Waiting time for P2= 16 - 0 = 16

    Waiting time for P3= 9 - 0 = 9

    Waiting time for P4= 0 - 0 = 0

    The average waiting time = (3+16+9+0)/4 = 7 milliseconds.


    Thus, the average waiting time is (3 + 16 + 9 + 0) / 4 = 7 milliseconds. By comparison,
    if we were using FCFS scheduling scheme, the average waiting time would be 10.25
    milliseconds.


