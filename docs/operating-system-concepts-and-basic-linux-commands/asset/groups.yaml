    ### 4.52 Direct Access:


    Another method is **direct access (or relative access)**. The direct-access method
    is based on a disk model of a file, since disks allow random access to any file
    block. A file is made up of fixed length **logical records** that allow programs
    to read and write records rapidly in no particular order. For direct access, the
    file is viewed as a numbered sequence of blocks or records. A direct-access file
    allows blocks to be read or written in any order. Thus, we may read block 14,
    then read block 53, and then write block 7. There are no restrictions on the order
    of reading or writing for a direct-access file. Direct-access files are of great
    use for immediate access to large amounts of information. Databases are often
    of this type. When a query concerning a particular subject arrives, we compute
    which block contains the answer and then read that block directly to provide the
    desired information.


    The block number provided by the user to the operating system is normally a **relative
    block number**. A relative block number is an relative index to the beginning
    of the file. Thus, the first relative block of the file is 0, the next is 1, and
    so on, even though the actual absolute disk address of the block may be 14703
    for the first block and 3192 for the second. The use of relative block numbers
    allows the operating system to decide where the file should be placed and helps
    to prevent the user from accessing portions of the file system that may not be
    part of her file. Some systems start their relative block numbers at 0; others
    start at 1.


    ![](img/b3f889342bdc020af96a131b08d63774_118_0.png)


    Fig.4.2: Direct access file


    ### 4.5.3 Other access methods:


    Other access methods can be built on top of a direct-access method. These methods
    generally involve the construction of an index for the file. The index, like an
    index in the back of a book, contains pointers to the various blocks. To find
    a record in the file, we first search the index and then use the pointer to access
    the file directly and to find the desired record.


    With large files, the index file itself may become too large to be kept in memory.
    One solution is then to create an index for the index file. The primary index
    file would contain pointers to secondary index files which points to the actual
    data items.


    For example, IBM’s indexed sequential access method uses a small master index
    which points to disk blocks of a secondary index. The secondary index block point
    to the actual file blocks. The secondary index block, which provides the block
    number of the secondary index, Then to find a particular item, the binary search
    is first made of the master index. This block is read in, and again a binary search
    is used to find the block containing the desired record. Finally this block is
    searched sequentially. In this way, any record can be located from its key by
    at most two direct access reads.


    ![](img/b3f889342bdc020af96a131b08d63774_119_0.png)


    ## 4.6 Free-Space Management


    Since disk space is limited, we need to reuse the space from deleted files for
    new files, if possible. To keep track of free disk space, the system maintains
    a free-space list. The free-space list records all free disk blocks—those not
    allocated to some file or directory. To create a file, we search the free-space
    list for the required amount of space, and allocate that space to the new file.
    This space is then removed from the free-space list. When a file is deleted, its
    disk space is added to the free-space list. The free-space list, despite its name,
    might not be implemented as a list, as we shall discuss.


    ## 4.6.1 Bit Vector


    Frequently, the free-space list is implemented as a bit map or bit vector. Each
    block is represented by 1 bit. If the block is free, the bit is 1; if the block
    is allocated, the bit is 0.


    For example, consider a disk where blocks 2, 3, 4, 5, 8, 9, 10, 11, 12, 13, 17,
    18, 25, 26, and 27 are free, and the rest of the blocks are allocated. The free-space
    bit map would:


    ```

    0011100111111100000011100000 ...

    ```


    The main advantage of this approach is its relative simplicity and efficiency
    in finding the first free block, or consecutive free blocks on the disk.


    ## 4.6.2 Linked List


    Another approach to free-space management is to link together the free disk blocks,
    keeping a pointer to the first free block in a special location on the disk and
    caching it in memory. This first block contains a pointer to the next free disk
    block, and so on. In our example, we would keep a pointer to block 2 as the first
    free block. Block 2 would contain a pointer to block 3, which would point to block
    4, which would point to block 5, which would point to block 8


    ![](img/b3f889342bdc020af96a131b08d63774_120_0.png)


    Fig.4.4: Linked free space on disk


    Operating System Concepts and Basic Commands


    ### 4.6.3 Grouping


    A modification of the free-list approach is to store the addresses of n free blocks
    in the first free block. The last block contains the addresses of other n free
    blocks, and so on. The importance of this implementation is that a large number
    of free blocks can be found quickly, unlike in the standard linked approach.


    ### 4.6.4 Counting


    Another approach is to take advantage of the fact that, generally, several contiguous
    blocks may be allocated simultaneously, particularly when space is allocated with
    clustering. Thus, rather than keeping a list of disk addresses, we can keep the
    address of the first block and the number n contiguous blocks that follow the
    first. Each entry requires more space than a simple disk address, the overall
    list will be shorter, as long as the count is greater than 1.


    ## 4.7 Allocation methods:


    The direct-access nature of disks allows flexibility in the implementation of
    files. In almost every case, many files are stored on the same disk. The main
    problem is how to allocate space to these files so that disk space is utilized
    effectively and files can be accessed quickly. Three major methods of allocating
    disk space are in wide use: contiguous, linked, and indexed. Each method has advantages
    and disadvantages. Some systems support all three. More commonly, a system uses
    one method for all files.


    ### 4.7.1 Contiguous allocation method:


    The contiguous-allocation method requires each file to occupy a set of contiguous
    blocks on the disk. Disk addresses define a linear ordering on the disk. With
    this ordering, assuming that only one job is accessing the disk, accessing b+1
    block b normally requires no head movement. When head movement needed (from the
    last sector of one cylinder to the first sector of the next), it is only one track.
    Thus, the number of disk seeks required for accessing contiguously allocated files
    is minimal.


    Contiguous allocation of a file is defined by the disk address if the file is
    $n$ blocks long and starts at location $b$, then it occupies blocks $b, b+1, b+2$,
    ..., $b+n-1$. The directory entry for each file indicates the address of the starting
    block and the length of the area allocated for this file.


    Accessing a file that has been allocated contiguously is easy. For sequential
    access, the file system remembers the disk address of the last block referenced
    and, when necessary, reads the next block. For direct access to block $i$ of a
    file that starts at block $b$, we can immediately access block $b+i$. Thus, both
    sequential and direct access can be supported by contiguous allocation.


    ![](img/b3f889342bdc020af96a131b08d63774_122_0.png)


    Fig.4.5: Contiguous allocation of disk space


