    ## 3.12 分页 (Paging)


    单分区和多分区方法支持连续内存分配，整个过程加载在分区中。在分页存储中，进程被划分为若干个小部分，这些部分被加载到主内存的其他位置。


    物理内存被分为固定大小的块，称为“帧”（frames）；而逻辑地址空间（用户进程）被分为固定大小的块，称为“页”（pages）。页的大小和帧的大小必须相等。页的大小或帧的大小取决于操作系统。通常页的大小为
    4KB。


    在该操作系统内核维护着一种名为“页表”（page table）的数据结构，页表规定明了一些有用信息，它告诉我们哪些帧被分配了、总共有多少帧等。通用的页表由两个字段组成，一个是页号，另一个是帧号。每个操作系统都有其存储页表的方法。


    CPU 生成的每个地址分为两部分：第一部分是“页号”，第二部分是“页偏移”（page offset）或位移。页号用作页表中的索引。考虑下面的图，CPU 生成的逻辑地址空间被分为若干页，每个页都有页号
    (P) 和位移 (D)。页被加载到物理内存中可用的空闲帧中。页表包含每个页在物理内存中的基地址，该地址与偏移相结合即可找到该页的物理地址。


    页号与帧号之间的映射通过页映射表完成。页映射表规定了哪个页被加载到哪个帧中，位移是通用的。


    为了更好地理解，考虑以下示例。就绪队列中有两个任务，job1 的大小为 16kb，job 2 的大小为 24kb。页的大小为 4kb。可用的主内存为 72kb，即
    18 个帧。因此，job 1 被分为 4 页，job 2 被分为 6 页。每个进程维护着一个程序表。考虑下面的图以获得更好的 de理解。


    # 操作系统概念与基础 Linux 指令


    帧号 (Frame Number)


