    # 3.5.1 Single Instance of Each Resource Type:


    Single instance of resource type means, the system consisting of only one resource
    of one type. This type of dead lock can be detected with the help of wait for
    graph. Wait for a graph is a graph which is derived from ‘Resource allocation’.
    It consisting of only processes as vertices. We obtain this graph from the resource-allocation
    graph by removing the resource nodes and collapsing the appropriate edges.


    ![](img/b3f889342bdc020af96a131b08d63774_80_0.png)


    An edge from Pi to Pj in a wait-for graph implies that process Pi is waiting for
    process Pj to release a resource that Pi needs. An edge Pi -> Pj exists in a wait-for
    graph if and only if the corresponding resource-allocation graph contains two
    edges Pi -> Rq and Rq -> Pj for some resource Rq. A deadlock exists in the system
    if and only if the wait-for graph contains a cycle. To detect deadlocks, the system
    needs to maintain the wait-for graph and periodically invoke an algorithm that
    searches for a cycle in the graph. An algorithm to detect a cycle in a graph requires
    order n2 operations, where n is the number of vertices in the graph.'
