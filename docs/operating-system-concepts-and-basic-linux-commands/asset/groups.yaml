    # 3.16.3 Least recently used Page replacement:


    If the optimal algorithm is not feasible, perhaps an approximation of the optimal
    algorithm is possible. The key distinction between the FIFO and OPT algorithms
    (other than looking backward or forward in time) is that the FIFO algorithm uses
    the time when a page was brought into memory, whereas the OPT algorithm uses the
    time when a page is to be used. If we use the recent past as an approximation
    of the near future, then we can replace the page that has not been used for the
    longest period of time .This approach is the least-recently-used (LRU) algorithm.


    LRU replacement associates with each page of that page''s last use. When a page
    must be replaced, LRU chooses the page that has not been used for the longest
    period of time. This strategy is the optimal page-replacement algorithm looking
    backward in time, rather than forward.


    The result of applying LRU replacement to our example reference string is shown
    in following figure. The LRU algorithm produces 12 faults. Notice that the first
    five faults are the same as those for optimal replacement. When the reference
    to page 4 occurs, page 2 was used least recently. Thus, the LRU algorithm replaces
    page 4, of, the three frames in memory, replaces page 2, not knowing that page
    2 is about to be used. When it then faults for page 2, the LRU algorithm replaces
    page 3, since it is now the least recently used of the three pages in memory.
    Despite these problems, LRU replacement with 12 faults is still much better than
    FIFO replacement with 15 faults.


