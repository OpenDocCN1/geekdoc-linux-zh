    ## 5.22 Communication commands:


    ### 5.22.1 who


    This command displays a list of all the people, or users, who are currently using
    the UNIX machine. The first column of the output lists the usernames of the people
    who are logged in.


    ```bash

    $ who

    tty1 Dec 6 19:36

    yash tty2 Dec 6 19:38

    sanu tty0 Dec 9 09:23

    $

    ```


    You can see that there are three users, atha, yash, and sanu. The second column
    lists the terminals they are logged in to, and the final column lists the time
    they logged in. The output varies from system to system.


    ### 5.22.2 who am i


    You can use the who command to gather information about yourself when you execute
    it as follows:


    ```bash

    $ who am i

    atha pts/0 Dec 9 08:49

    $

    ```


    This tells me the following information:

    1. My username is atha.

    2. I am logged in to the terminal pts/0.

    3. I logged in at 8:49 on Dec 9.


    The arguments am and i change the behavior of the who command to list information
    about you only. In UNIX, most commands accept arguments that modify their behavior.


    ### 5.22.3 mesg command:


    Syntax:

    `mesg [y] [n]`


    The mesg command stops the incoming messages that were initiated through other
    UNIX communication commands. This command allows users to set the permissions
    on their terminal so that read and write access is denied to all users apart from
    themselves i.e., the owner of the terminal. Mesg has two arguments: ''y'' and
    ''n'' (yes/no). mesg used without any arguments simply returns the state of the
    current setting i.e.


    - y - message can be sent to the terminal, or

    - n - message cannot be sent to the terminal


    we have to specify a single argument at a time for example:


    ```bash

    $ mesg n

    ```


    This command disabled all the incoming messages.


    Shital Vivek Ghate


    ```bash

    $ mesg y

    ```

    This command allows all the incoming messages from other users through communication
    commands.


    ### 5.22.4 write command:


    Syntax:

    `write <username> [ttyname]`


    This is two-way communication command. Here <username> is the recipient user,
    and [ttyname], is the name of the terminal that appears in the /dev directory.
    With the use of write command it is possible to write a message to the other user''s
    terminal and that recipient user can also write back to the sender''s terminal
    and thus two way communications link can be established between two users.


    In this command a username must be specified, and an optional terminal code can
    be included, if required, for example when a user is logged in on more than one
    terminal and you want to contact a specific terminal.


    When write is invoked, it reads from the standard input, so you can simply type
    in your message, in the required format. You can end the session by pressing <ctrl-d>,
    and the message will be dispatched. The sender will be returned to the shell prompt.
    If the person whom you were contacting is in the middle of another task e.g. in
    an editing session etc., they will have to escape to the shell level to write
    back. To check how many users are currently logged in you can use the ‘who’ command.


    For example:


    ```bash

    $ who

    aditi tty20 jan 20 15:10

    aditi tty15 jan 20 15:20

    $ write aditi tty20

    Hi Aditi, How are you?

    <ctrl-d>

    $

    ```


