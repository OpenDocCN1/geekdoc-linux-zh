    # 5.5 Basic syntax for command:


    Linux commands can be executed by typing its name on command line, followed by
    option list , and then parameters. A typical command line is as follows:


    $ commandname -option [parameter]


    The single line command is referred to as command line and it is typed after the
    shell prompt. The command name always appears first, it tells the shell WHAT to
    do. To execute the command press Enter. The minimum usage for most commands is
    the command and one or more command options.


    Command options are typed after the command and are used to modify the result
    of the command. There must be a space between the command and the command option.
    Then, the dash (-) character must precede the command option. The dash tells Linux
    to treat each letter that follows the dash as a command option. There is no space
    between dash and the command option. There can be more than one command option,
    but do not put any space between the dash and the option.'
