    # 5.15 Managing disk space: df, du


    A quick way to get a summary of the available and used disk space on your Linux
    system is to type in the df command. The command stands for "disk file system".
    With the -h option (df -h) it shows the disk space in "human readable" form, which
    in this case means, it gives you the units along with the numbers.


    The output of the df command is a table with six columns. The first column contains
    the file system path, which can be a reference to a hard disk or another storage
    device, or a file system connected through the network. The second column shows
    the capacity of'
  - '[PAGE 176]


    # Shital Vivek Ghate


    that file system. The third column shows the used space, the fourth column shows
    the available space and the fifth column shows the used space percentage and the
    last column shows the path on which that file system is mounted. The mount point
    is the place in the directory tree where you can find and access the file system.


    The df tool simply reports the amount of free space on each partition — how large
    they are, etc. It also provides information on non-local file systems (such as
    mounted NFS or Samba shares). In its most basic form, df provides the following:


    $ df

    | Filesystem | 1K-blocks | Used Available | Use% | Mounted on |

    | --- | --- | --- | --- | --- |

    | /dev/md2 | 4881472 | 73508 4087964 | 17% | / |


    However, you can add options to df to show the file type and show the sizes in
    an easier to understand format:


    $ df -h -T

    | Filesystem | Type Size Used Avail Use% | Mounted on |

    | --- | --- | --- | --- | --- | --- | --- |

    | /dev/md2 | xfs | 4.7G | 775M | 3.9G | 17% | / |


    While df provides an overview of entire partitions, the du tool will summarize
    the size of a given directory, broken down by subdirectories: The du command shows
    the disk space used by the files and directories in the current directory. Again
    the -h option (df) makes the output easier to comprehend. By default, the du command
    lists all subdirectories to show how much disk space each has occupied. This can
    be avoided with the -s option (df -s). This only shows a summary. Namely the combined
    disk space used by all subdirectories. If you want to show the disk usage of a
    directory (folder) other than the current directory, you simply put that directory
    name as the last argument. For example: du -h -s images, where "images" would
    be a subid of the current directory.


