    \ 且 $Y \\neq X$，则 $Y < X$。\n\n我们将矩阵 $Allocation$ 和向量 $Need$ 中的每一行视为向量，并分别称为 $Allocation$\
    \ 和 $Need$。向量 $Allocation$ 指定了当前分配给进程 $Pi$ 的资源；向量 $Need$ 指定了进程 $Pi$ 为了完成其任务可能仍会请求的额外资源。\n\
