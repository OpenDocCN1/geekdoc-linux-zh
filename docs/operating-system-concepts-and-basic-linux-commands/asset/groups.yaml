    # 3.11 Compaction


    Compaction is a method of collecting all the free spaces together in one block,
    this block can be allotted to some other job.


    For example consider the example of Fixed variable multiple partitioning method.
    The total internal fragmentation is (100+70+75=250Kb). The total external fragmentation
    is (400+350+625=1375Kb). Collect the internal and external fragmentation together
    in one block (250+1375=1625Kb). This type of mechanism is said to be compaction.
    Now the compacted memory is 1625Kb.


    Now the scheduler can load J3 (1200Kb) in compacted memory. Thus efficient memory
    utilization can be possible using compaction.


