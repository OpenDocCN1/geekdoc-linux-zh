    ## 5.8 列出文件和目录：(ls 命令)


    在 UNIX 中，有三种基本类型的文件：


    - 普通文件

    - 目录

    - 特殊文件


    普通文件是系统中包含数据、文本或程序指令的文件。目录同时存储特殊文件和普通文件。特殊文件提供对硬盘、CD-ROM 驱动器、调制解调器和以太网适配器等硬件的访问。其他特殊文件类似于别名或快捷方式，允许您使用不同的名称访问单个文件。


    ls 命令：

    首先列出当前目录中的文件和目录。

    使用以下命令：


    ```

    $ ls

    ```


    这是一个目录列表示例：


    | bin | hosts | lib | res.03 |

    |---|---|---|---|

    | ch07 | hw1 | pub | test_results |

    | ch07.bak | hw2 | res.01 | users |

    | docs | hw3 | res.02 | work |


    此输出表示当前目录中有多个项目，但此输出并没有告诉我们这些项目是文件还是目录。要找出哪些项目是文件，哪些是目录，请为 `ls` 指定 `-F` 选项：


    ```

    $ ls -F

    ```


    现在目录的输出略有不同：


    | bin/ | hosts | lib/ |

    |---|---|---|---|

    | ch07 | hw1 | pub/ |

    | ch07.bak | hw2 | res.01 |

    | docs/ | hw3 | res.02 |


    如你所见，某些项目末尾现在有一个 `/`：这些项目每一个都是目录。其他项目（如 hw1）后面没有追加字符。这表明它们是普通文件。当为 `ls` 指定 `-F`
    选项时，它会附加一个字符来指示列出的每个项目的文件类型。


    下表显示了 `ls` 命令的所有选项：


    | 选项 | 功能 |

    | --- | --- |

