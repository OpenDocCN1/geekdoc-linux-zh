    We can also see that the compressed file has the same permissions and time stamp
    as the original. Next, we run the gunzip program to uncompress the file. Afterward,
    we can see that the compressed version of the file has been replaced with the
    original, again with the permissions and time stamp preserved.


    # bzip2


