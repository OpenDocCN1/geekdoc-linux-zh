    # 4.8.2 Two-Level Directory


    As we have seen, a single-level directory often leads to confusion of file names
    between different users. The standard solution is to create a separate directory
    for each user.


    In the two-level directory structure, each user has their own user file directory
    (UFD). The UFD''s have similar structures, but each lists only the files of a
    single user. When a user job starts or a user logs in, the system''s master file
    directory (MFD) is searched. The MFD is indexed by user name or account number,
    and each entry points to the UFD for that user. When a user refers to a particular
    file, only their own UFD is searched. Thus, different users may have files with
    the same name, as long as the file names within each UFD are unique. To create
    a file for a user, the operating system searches only that user''s UFD to ascertain
    whether another file of that exists. To delete a file, the operating system confines
    its search to the local UFD; thus, it cannot accidentally delete another user''s
    file that has the same name.


    The user directories themselves must be created and deleted as necessary. A special
    system program is run with the appropriate user name and account information.
    The program creates a new UFD and adds an entry for it to the MFD. The execution
    of this program might be restricted to system administrators.


    Although the two-level directory structure solves the name collision problem,
    it still has disadvantages. This structure'
