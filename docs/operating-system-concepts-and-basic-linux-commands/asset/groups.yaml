    queue. When a process enters the ready queue, PCB is linked onto the tail of the
    queue. When the CPU is free, it is allocated to the process at the head of the
    queue. The running process is then removed from the queue. The code for FCFS scheduling
    is simple to write and understand. On the negative side, the average waiting time
