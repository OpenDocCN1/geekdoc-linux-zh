    # 4.8.3 Tree-Structured Directories:


    Once we have seen how to view a two-level directory as a two-level tree, the natural
    generalization is to extend the directory structure to a tree of arbitrary height.
    This generalization allows users to create their own subdirectories and to organize
    their files accordingly. The MS-DOS system, for instance, is structured as a tree.
    In fact, a tree is the most common directory structure. The tree has a root directory,
    and every file in the system has a unique path name. A path name is the path from
    the root, through all the subdirectories, to a specified file.


    A directory (or subdirectory) contains a set of files or subdirectories. A directory
    is simply another file, but it is treated in a special way. All directories have
    the same internal format. One bit in each directory entry defines the entry as
    a file (0) or as a subdirectory (1). Special system calls are used to create and
    delete directories.


    Path names can be of two types: absolute path names or relative path names. An
    absolute path name begins at the root and follows a path down to the specified
    file, giving the directory names on the path. A relative path name defines a path
    from the'
