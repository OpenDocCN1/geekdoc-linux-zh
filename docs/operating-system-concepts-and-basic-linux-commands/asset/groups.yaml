    ## 3.13 Segmentation


    In segmentation, the program is divided into segments, such as subroutines, arrays.
    Each segment has a name and a length. The logical address consists of two parts:
    segment number (s) and offset or displacement (d). The segment number (s) is used
    as an index in the segment table. Consider the following figure, the logical address
    space that CPU generated address space is divided into segments, each segment
    having the segment number(s) and displacement (d). The segments are loaded in
    to available free areas in the physical memory. Segment table contain the base
    address of each segment in physical memory, that address is combined with offset
    to find the physical address of the segment.


    The mapping between the segment number and the frame number is done by segment
    table. The segment table specifies which segment is loaded in which area, displacement
    is common.


    For better understanding consider the following example. There are two jobs in
    the ready queue, the size of job1 is 16kb and job 2 is 24kb. The segment size
    is 4kb. The available main memory is 72kb i. e. 18 frames. So job 1 is divided
    in 4 segments and job 2 is divided in 6 segments. Each process maintains a program
    table. Consider the following figure for better understanding.


    Operating System Concepts and Basic Linux Commands


    ![](img/b3f889342bdc020af96a131b08d63774_102.png)


    # Fig.3.21: Example of segmentation


    In which the logical address is divided into four segments, numbered from 0 to
    3. Each segment has an entry in the segment table. The limit specifies the size
    of the segment and the base specifies the starting address of the segment. Here
    segment ''0'' is loaded in main memory from 150kb to 250kb, so 250-150=100kb is
    the limit.


    Segmentation supports virtual memory. It eliminates fragmentation by moving segments
    around; fragmented memory space can be combined in a single free area.


