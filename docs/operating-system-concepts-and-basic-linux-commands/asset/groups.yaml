    操作系统概念与基础 Linux 命令


    ## 驻留监控器 (Resident monitor):


    在批处理过程中，从一个作业过渡到下一个作业时，CPU 会处于闲状态。为了克服这种空闲时间，引入了自动作业调度，并随之产生了最初的操作系统。它包含了自动将控制权从一个作业转移到下一个作业的程序。为了这一目的，创建了一个名为驻留监控器的小程序。驻留监控器始终位于内存中。


    当计算机启动时，系统的控制权位于驻留监控器，随后它将控制权交给程序。当程序终止时，它会将控制权返回给驻留监控器，然后继续处理下一个程序。因此，驻留监控器会自动在程序之间进行排序，并将一个作业形成另一个作业。


    操作员会收到关于要在数据上运行哪些程序的简短说明。为了将这些信息直接提供给驻留监控器，引入了控制卡。除了作业的程序或数据外，程序员还包含了特殊卡片（控制卡），这些卡片是给驻留监控器的指令，指示要运行哪个程序。例如，一个普通用户程序可能需要运行三个程序之一：FORTRAN
    编译器 (FTN)、汇编器 (ASM) 或用户程序。每个程序都有一个独立的控制卡：


    - $FTN : 执行 FORTRAN 编译器。

    - $ASM : 执行汇编器。

    - $RUN : 执行用户程序控制卡。


    此外，还有两张控制卡用于定义每个作业的边界：


    - $JOB : 作业的第一张卡。

    - $END : 作业的最后一张卡。


    Shital Vivek Ghate


    驻留监控器


    | 中断与陷向量 |

    | :--- |

    | 设备驱动程序 |

    | 作业调度 |

    | 控制卡解释器 |

    | 用户程序区域 |


    图 1.3 驻留监控器的内存布局


    ![](img/b3f889342bdc020af96a131b08d63774_22_0.png)


    图: 1.4 简单批处理系统的卡片堆


    10


    操作系统概念与基础 Linux 命令


    ## 缓冲 (Buffering):


    缓冲试图让 CPU 和 I/O 设备一直处于忙碌。缓冲区是内存的一部分，用于临时存储数据。数据被读取后，CPU 正准备对其开始操作，输入设备会被指示立即开始下一次输入。此时
    CPU 和输入设备都处于忙碌。当 CPU 准备好处理下一个数据项时，输入设备已经完成了读取。随后 CPU 就可以开始处理新读取的数据，而输入设备开始读取后续数据。


    输出也可以进行类似的缓冲；CPU 创建数据，并将其放入缓冲区，直到输出设备可以接收它为止。


    缓冲让 CPU 和 I/O 设备一直处于忙碌。当 CPU 正在处理一条记录时，输入设备正在处理另一个记录，则是 CPU 或输入设备先完成。如果 CPU 先完成，它必须等待；在读取下条记录之前，它无法继续。如果输入设备比
    CPU 快，缓冲区将变满，输入设备必须等待。


    解决此问题的方案是，只有在上一次操作完成后，才能启动下一次 I/O 操作。中断解决了这个问题。当 I/O 设备完成一项操作时，它会中断 CPU，然后 CPU
    停止正在的工作并立即跳转到一个固定位置，在那里，中断服务程序会检查缓冲区是否未满（对于输入设备）或为空（输出设备），然后启动下一个 I/O 请求。CPU 可以恢复中断计算。通过这种方式，
    I/O 设备和 CPU 可以以全速运行。


    如果 CPU 比输入设备快得多，缓冲几乎没有用处。如果 CPU 总是更快，那么它将总是找到空缓冲区并必须等待输入设备。对于输出，CPU 可以全速运行，直到所有系统都满了。然后
    CPU 必须等待输出设备。


    ## 井式 (Spooling):


    井技术代表在线外设同步操作。缓冲区是内存的一小部分，用于在程序执行期间临时存储数据。在井系统中，磁盘被用作大型缓冲区。


    例如，如果有两个或多个用户发出打印命令，而此时打印机正在打印其他作业，这些打印命令将被加载到井磁盘中。井磁盘是一个临时缓冲区；它可以直接从辅助存储设备读取数据。在打印另一个作业的输出的同时，CPU
    可以在井磁盘中执行另一个作业。因此，当用户同时通过键盘为一个作业输入输入时，CPU 忙于执行另一个作业，而打印机忙于获取另一个作业的输出。


    井优于缓冲的优点是井可以将一个作业的 I/O 与另一个作业的计算重叠。井程序可以在打印另一个作业输出的同时读取一个作业的输入。在此期间，可能还会执行另一个作业。缓冲只能将一个作业的
    I/O 与自身的计算及 I/O 重叠；而井可以将多个作业的 I/O 和计算重叠。


    ![](img/b3f889342bdc020af96a131b08d63774_24_0.png)


    图: 1.5 井技术


    ## C) 单处理器系统：


    单处理器系统被定义为具有用于执行指令的单个中央处理器的计算机系统。单处理器系统（标准个人电脑）包含单个 CPU 和单个 I/O 通道，通常被用作单用户机器，也可以实现为多用户系统。


    操作系统概念与基础 Linux 命令


    当用于多用户系统时，所有用户的应用程序之间相互保护，系统资源在多个用户之间共享，操作系统维持控制，使用以下操作模式：


    - 1. 微内核，它包含内核态但较小、模块化、执行速度快等。

    - 2. 管理资源的用户态模块。通常操作系统的部分功能可以在内核外执行。例如，打印系统可以完全作为用户级子系统进行管理。


    这种模型通过消息传递进行通信（尽管可以使用共享内存）。


    这种方法的主要优点是其灵活性。它很容易替换模块，提供性能升级等。用户级模块理论上可以移动到其他机器。这里的启示是该模型更适合被采用分布式操作系统。事实上，它的消息传递通信虽然是其缺点之一，也是其适用于分布式实现的另一个指标。


    它的缺点与熟悉度和性能有关。熟悉度方面是它不符合习惯，人们会感到不适应。性能方面是在分离的模块之间进行额外的通信（而不是统一的单体结构），会导致性能损失。


    ![](img/b3f889342bdc020af96a131b08d63774_26_0.png)


    ## D) 多处理器系统：


    标准系统是单处理器的，即它有一个主 CPU。多处理器系统将有多个 CPU，共享内存和外设。


    多处理器操作系统使用两种方法：


    ## 主从方法：


    常见的多处理器系统为每个处理器分配特定的任务。有一台主计算机。这台主计算机控制系统。其他处理器（从机）要么向主机寻求指令，要么具有预定义的任务。


    ## 计算机网络：


    在这种方法中，多个独立的计算机系统可以通信，在它们之间发送文件和信息。然而，每个计算机系统都有自己的操作系统并独立运行。


    '
