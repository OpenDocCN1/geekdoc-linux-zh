    of the shell created by Eric Gisin is called the public domain korn shell (pdksh).
    In march 2000, AT & T released a freely downloadable version of the original kern
    shell updated by Dave Korn in 1993, called ''ksh93''.


    **c. shell:** Bill Joy developed the C shell while he was at the University of
    California at Berkeley in the early 1980s. It was designed to make interactive
    use of the shell easier for users. Another design goal was to change the syntax
    of the shell from the Bourne shell''s older ALGOL style to the newer C style.
    The open source version of the c shell is tcsh.


    ## 5.2 Changing the running shell:


    To check which shell is running , display the shell you are using. This information
    is found in SHELL environment variable. Type ‘echo $SHELL’ at the shell prompt
    and press Enter. If you are using bash shell system will display the following
    message:


    ```

    [aditi @localhost/aditi]$ echo $SHELL

    /bin/bash

    [aditi @localhost/aditi]$

    ```


    If you are not using bash shell and want to change to bash shell, type ‘bash’
    at the shell prompt and press Enter. The system will display the following:


    ```

    [aditi @localhost/aditi]$

    ```


    Check again the shell you are using, type ‘echo $SHELL’ and press Enter.


    To display the bash help function, type help and press Enter. The help command
    lists all the commands that are built into the shell.


    ## 5.3 Shell Prompt:


    When you log in to your Linux account, you will see the shell prompt. It will
    look as follows:


    ```

    [aditi@localhost/aditi]$

    ```


    The first aditi is the username and it is followed by the hostname of the computer
    and the final aditi is the directory name that user aditi is in presently. You
    are automatically placed in your own user account when you first log in to the
    system.


    When you are logged in as root, the shell prompt displayed changes to use a pound
    sign (#) instead of the dollar sign ($).

    `[root@localhost ~root]#`


    ### 5.3.1 Changing the shell prompt:


    The shell prompt can be changed to display information such as the username for
    a user, the directory in which the user is working, the current date and time
    or some special message. To change the shell prompt for your current login session,
    follow the steps given below:


    - 1. Display the shell variables. At the shell prompt, type `printenv` and press
    Enter. If you cannot read the entire screen, send the printenv command to the
    less pager. (Type printenv |less)

    - 2. Look for the PS1 variable. It may look as follows: `PS1=[\u@\w]\$`

    This variable tells the host computer and user display the username of whoever
    is using that user’s current directory inside brackets followed by the $ prompt
    ( or # prompt for the root account).

    - 3. Write down the information from the PS1 variable.

    - 4. Decide how you want the prompt to look. Following table shows the characters
    to customize the shell prompt.


    # Shital Vivek Ghate


    | Character code | Description |

    |---|---|

    | \! | Display the number used in the history list to access the command that
    would be executed at the shell prompt. |

    | \$ | Display a $ in the prompt for regular user and a # for the super user |

    | \ | Display the backslash character. |

    | \d | Display the current date |

    | h | Display the hostname of the computer at which you are working. |

    | \t | Display the current time. |

    | \u | Display the username of the user who is logged in to the system. |

    | \w | Display the current working directory. |

    | \xxx | Display any special comment. |


    Example: If you want to change the prompt so that it will display the time, the
    date, the prompt will change to: `18:40 Sat 21 \w aditi$`


    ## 5.4 Creating the user:


    Linux commands can be executed by typing its name on command line, followed by
    option list , and then parameters. A typical command line is as follows:


    `$ commandname -option [parameter]`


    The single line command is referred to as command line and it is typed after the
    shell prompt. The command name always appears first, it tells the shell WHAT to
    do. To execute the command press Enter. The minimum usage for most commands is
    the command and one or more command options.


    Command options are typed after the command and are used to modify the result
    of the command. There must be a space between the command and the command option.
    Then, the dash (-) character must precede the command option. The dash tells Linux
    to treat each letter that follows the dash as a command option. There is no space
    between dash and the command option. There can be more than one command option,
    but do not put any space between the dash and the option.


