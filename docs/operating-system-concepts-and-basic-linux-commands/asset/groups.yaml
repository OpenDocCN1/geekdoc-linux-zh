    ### 5.22.6 wall command:


    Wall stands for write all. It writes a message on a recipients'' terminal, reading
    the message from the standard input (keyboard). Wall delivers the message to all
    the users on the system. Once the command has read the message from the standard
    input, it proceeds to write it simultaneously on every user''s terminal.


    The super-user normally uses the wall command to deliver important system messages
    and can override any mesg n setting (since the super user can write to any terminal
    at any time whatever protection setting are in effect).


    For example:


    ```bash

    $ wall

    Save and logout immediately, the system going down in 5 minutes. Another warning
    will follow in 3 minutes.

    <ctrl-d>

    ```


