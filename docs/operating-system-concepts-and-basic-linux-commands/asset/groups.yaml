    # 3.14 Demand Paging


    Demand paging is the application of virtual memory. Virtual memory is a technique
    which allows the execution of a process, even the logical address space is greater
    than the physical address space.


    In this scheme a page is not loaded into the main memory from secondary memory,
    until needed, i.e. a page is loaded into the main memory by demand. Hence this
    scheme is said to be “Demand paging”.


    For example assume that the logical address space is 72KB, the page and frame
    size is 8KB, so the logical address space is divided into 9 pages, numbered from
    0 to 8. The available memory is 40KB, i.e. 5 frames are available, so the 5 pages
    are loaded into the main memory and the remaining 4 pages are loaded in the secondary
    storage device, when ever those pages are required, the operating system swap-in
    those pages into main memory.


    In demand paging the page map table consists of three fields. One is page number,
    second is frame number, and third one is valid/invalid bit. If a page is reside
    in main memory valid/invalid bit is set to ‘valid’. Otherwise, if the page is
    reside in secondary memory the so the bits are set to invalid, remaining all pages
    reside in main memory, so those bits are set to ‘invalid’.


    In figure 3.24 the page numbers 1,3,4,6 are loaded in secondary memory, so those
    bits are set, remaining all pages reside in main memory, so those bits are set
    to valid.


    The available free pages in main memory are 5, so 5 pages are loaded in main memory.


    # 3.15 Page fault


    When the processor need to execute a particular page, and that page is not available
    in main memory, this situation is said to be ‘page fault’. When the page fault
    is happened, the page replacement will be needed. The page replacement means select
    a victim page in the main memory and replace that page with the required page
    from the backing store(disk). The victim page is selected by the “page replacement
    algorithm”.'
