    # Operating System Concepts and Basic Linux Commands


    **vi. Background processing:** The true multi-tasking facilities allow the user
    to run commands in the background. This allows the command to be processed in
    background while the user can proceed with other task in foreground. When background
    task is completed, the user is notified.


    There are many number of shells available in Linux, Bourne Shell is the oldest
    UNIX shell. The default shell on Linux distribution is the GNU Bourne again (bash).
    Shells available include the source version of the C Shell (tcsh), k shell (pdksh).


    **a. Bourne again Shell (bash):** Bourne shell is the oldest UNIX shell. It is
    the most widely present on every existing UNIX system. The original UNIX shell
    was written in the mid-1970s by Stephen R. Bourne while he was at AT&T Bell Labs
    in New Jersey. The Bourne shell was the first to appear on UNIX systems, thus
    it is referred to as "shell." The GNU/ Linux version of the Bourne (sh) shell
    is GNU Bourne again (bash). It is written by Brian Fox and Ramey. It is a feature
    enriched version of the feature found in the c shell (sh) and k shell (ksh). The
    Bourne Again shell, bash, was developed as part of the GNU project and has replaced
    the Bourne shell, sh, for GNU-based systems like Linux. All major Linux distributions,
    including Red Hat, Slack, and Caldera, ship with bash as their sh replacement.


    **b. Korn Shell (ksh):** Korn shell (ksh) is unix shell originally created by
