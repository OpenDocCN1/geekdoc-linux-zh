    # 5.7.4 Pipe lines:


    Pipes (| character) is used to redirect output from one command to become the
    input to another command. This reduces the necessity of writing new programs for
    complex operation. A pipe line is a mechanism, which accepts the output of a command
    as its input for the next command. Using the pipe operator ''|'' (vertical bar),
    the standard output of one command can be piped into the standard input of another:


    command1|command2


    for example:


    ```

    $who|wc -l

    13 $

    ```


    The ''who'' command produces a list of users, one user per line. Then wc command
    will count the number of lines and the output will appear on the screen.


    Any command that writes to standard output can be used on the left hand side of
    pipe. Any command that reads from standard input can be used on the right hand
    side of pipe. Filters are commands that accepts data from standard input and write
    data to standard output, can be used anywhere in the pipeline. Multiple commands
    can be chained together with pipes.


    # 5.7.5 Filters


    Pipelines are often used to perform complex operations on data. It is possible
    to put several commands together into a pipeline. Frequently, the commands used
    this way are referred to as filters. Filters take input, change it somehow and
    then output it. The first one we will try is sort. Imagine we wanted to make a
    combined list of all of the executable programs in /bin /usr/bin, put them in
    sorted order and view it :


    ```

    [aditi@localhost ~]$ ls /bin /usr/bin | sort | less

    ```'
