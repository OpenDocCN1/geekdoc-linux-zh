    一个优势是吞吐量。通过增加处理器的数量，可以在更短的时间内完成更多工作。


    ![](img/b3f889342bdc020af96a131b08d63774_27_0.png)


    图: 1.7 多处理器操作系统


    另一个优势是其可靠性。如果将功能妥善地分配到多个处理器之间，那么一个处理器的故障不会导致系统停止，而只会减慢运行速度。如果我们有十个处理器而其中一个坏了，那么剩下的每个处理器都必须承担故障处理器的一部分工作。因此，整个系统的运行速度只变慢了
    10%，而不是完全崩溃。


    设计多处理器系统比设计单处理器系统更困难。多处理器系统有三个主要优势：


    - 1. 提高吞吐量。

    通过增加处理器的数量，我们期望在更短的时间内完成更多工作。$N$ 个处理器的加速比并不是 $N$；相反，它小于 $N$。当多个处理器协作完成任务时，为了保持所有部分正常工作会产生一定的开销。这种开销加上对共享资源的竞争，降低了额外处理器带来的预期收益。同样，$N$
    个程序员共同工作产生的工作量也不会是一个程序员产生的工作量的 $N$ 倍。


    ## 2. 规模经济


    多处理器系统的成本可能低于等效的多个单处理器系统，因为它们可以共享外设设备、磁盘存储和电源。如果多个程序在同一组数据上运行，将这些数据存储在一个磁盘上并让所有处理器共享，比拥有许多带有本地磁盘和许多数据副本的计算机要便宜得多。


    ## 3. 提高可靠性


    如果功能可以妥善地分配到多个处理器之间，那么一个处理器的故障不会导致系统停止，只会减慢运行速度。如果我们有十个处理器而其中一个坏了，那么剩下的每个处理器都可以承担故障处理器的一部分工作。因此，整个系统的运行速度只变慢了
    10%，而不是完全崩溃。


    ## E) 多程序系统：


    作业调度最重要的方面是多程序处理的能力。通常情况下，单个用户无法让 CPU 或 I/O 设备一直处于忙状态。多程序通过组织作业使 CPU 始终在执行，从而提高
    CPU 利用率。


    在多程序中，单个处理器可以同时执行多个程序。在这种技术中，物理内存被分为许多分区，每个分区存放一个独立的程序。操作系统在不同的程序之间切换。

    '
