    # 4.11 Directory Structure


    Linux sees each and everything as files. So it is important to understand exactly
    what a Linux file is and how it organizes files within the system. Every kind
    of file you might need is stored in Linux file system as system files, data files,
    application files, utility files, driver files, configuration files and more.
    Each of these file has a name and a directory structure which is stored in file
    system.


    The Linux file system is built on a tree structure like DOS, Microsoft and UNIX
    file system. There is a root directory, identified by ''/'' character, below which
    all other directories and subdirectories grow. The files are contained in these
    directories and subdirectories.


    Directory names can be made up of a combination of numbers, symbols, and characters.
    The name of the directory includes the location of the directory i.e. the path
    of the directory to follow through the file system to get the directory in the
    file system.


    Directories that are nested within other directories are called subdirectories.


    The base of the directory structure is a root directory (''/''). It contains all
    the subdirectories and files in the Linux system.'
