    操作系统概念与基础 Linux 命令


    ### 3.10. 内存分配方法


    主内存包含操作系统和用户进程。以下是各种内存分配方法。


    #### 3.10.1 单分区分配


    在该方法中，操作系统位于内存的下半部分，剩余内存被视为一个分区。该单分区供用户空间使用。在同一时间内，该用户空间只能加载一个作业。


    短作业调度器从就绪队列中选择一个作业执行，由调度程序将该作业加载到主内存中。由于用户空间被视为单分区，主内存中同一时间只包含一个进程。


    该方案的主要缺点是内存没有被充分利用，造成了大量的内存浪费。


    ![](img/b3f889342bdc020af96a131b08d63774_89_0.png)


    图 3.9：单分区内存分配


    #### 3.10.2 多分区划分：


    这种方法可以通过三种方式实现：


    - a. 固定等长多分区

    - b. 固定变长多分区

    - c. 动态多分区


    #### 3.10.2.1 固定等长多分区：


    在此方案中，操作系统位于低内存区域，主内存其余部分用作用户空间。用户空间被划分为固定分区。这些分区的大小取决于操作系统。例如，总内存大小为 6MB；操作系统占用
    1MB。剩余的 5MB 被划分为 5 个每个 1MB 的等长固定分区。P1、P2、P3、P4、P5 是要加载到主内存的 5 个作业，它们的大小如下所示：


    | 作业 | 大小 |

    | :--- | :--- |

    | P1 | 450kb |

    | P2 | 1000kb |

    | P3 | 1024kb |

    | P4 | 1500kb |

    | P5 | 500kb |


    ##### 内部碎片与外部碎片：


    进程 partition1 被加载到 partition1 中。partition1 的最大大小为 1024kb，P1 的大小为 450kb。因此浪费了 1024-450=574kb
    的空间，这种浪费的内存被称为“内部碎片”。但没有足够的空间来加载进程 P4，因为进程 P4 的大小大于所有分区，所以整个分区（partition5）都被浪费了。这种浪费的内存被称为“外部碎片”。


    因此，总碎片为 =(1024-450)+(1024-1000)+(1024-500)=574+24+524=1122kb。


    外部碎片为 1024 kb。


    分区内浪费的内存内存称为内部碎片，而整个分区的浪费称为外部碎片。


    ##### 优点：


    它支持多程序并发。可以有效利用处理器和 I/O 设备。


    ##### 缺点：


    它遭受受到内部碎片和外部碎片的影响。


    ![](img/b3f889342bdc020af96a131b08d63774_91_0.png)


    **图 3.10：主内存分配**


    #### 3.10.2.2 固定变长多分区：


    在该方法中，主内存的用户空间被划分为若干分区，但分区的长度不同。操作系统维护一张表，指示内存中哪些分区是可用的，哪些是被占用的。当进程到达并需要内存时，我们寻找一个足够大的分区来存放该进程。如果我们找到了足够容纳进程的空间，则将该分区分配给它。


    有三种策略用于在此分配内存：


    - **首次分配 (First-Fit)**：分配第一个足够容纳该进程的分区。它从内存的低端开始搜索。

    - **最佳分配 (Best-Fit)**：分配最小能够容纳该进程的分区。它搜索整个内存，并分配大小最合适的分区。

    - **最坏分配 (Worst-Fit)**：分配最大的分区。例如，假设我们有 400kb 可用内存，操作系统占用了 350kb。


    | 作业 | 大小 | 到达时间 |

    | :--- | :--- | :--- |

    | J1 | 825kb | 10 |

    | J2 | 600kb | 5 |

    | J3 | 1200kb | 20 |

    | J4 | 450kb | 30 |

    | J5 | 650kb | 15 |


    | 分区 | 大小 |

    | :--- | :--- |

    | P1 | 700kb |

    | P2 | 400kb |

    | P3 | 525kb |

    | P4 | 900kb |

    | P5 | 350kb |

    | P6 | 625kb |


    图 3.11：调度


    ![](img/b3f889342bdc020af96a131b08d63774_93_0.png)


    图 3.12：内存分配


    在 (a), (b), (c), (d) 中，J2, J1, J5 已加载。最后一个作业是 J4，J4 的大小为 450kb，但可用内存只有 225kb，不足以加载
    J4，因此它必须等待内存释放。假设一段时间后 J5 结束执行并释放了内存。此时可用内存变为 225+650=875kb。该内存足够加载 J4。


    ![](img/b3f889342bdc020af96a131b08d63774_94_0.png)


