    # 4.8.4 Acyclic-Graph Directories


    Consider programmers who are working on a joint project. The files associated
    with that project can be stored in a subid, separating them from other projects
    and files of the two programmers. Since both programmers are equally responsible
    for the project, both want the subdirectory to be in their own directories. The
    common subdirectory should be shared. A shared directory or file will exist in
    the file system in two (or more) places at once.


    An acyclic graph—that is, a graph with no cycles—allows directories to share subdirectories
    and files (Figure 4.11). The same file or sub-directory may be in two different
    directories. The'
  - '[PAGE 132]


    acyclic graph is a natural generalization of the tree-structured directory scheme.


    It is important to note that a shared file (or directory) is not the same as two
    copies of the file. With two copies, each programmer can view the copy rather
    than the original, but if one programmer changes the file, the changes will not
    appear in the other''s copy. With a shared file, only one actual file exists,
    so any changes made by one person are immediately visible to the other. Sharing
    is particularly important for subdirectories; a new file created by one person
