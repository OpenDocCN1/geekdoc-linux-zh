    ## 2.7 CPU scheduling


    The objective of multiprogramming is to have some process running at all times,
    to maximize CPU utilization. The objective of time sharing is to switch the CPU
    among processes so frequently that users can interact with each program while
    it is running. To meet these objectives, the process scheduler selects an available
    process (possibly from a set of several available processes) for program execution
    on the CPU. For a single-processor system, there will never be more than one running
    process. If there are more processes, the rest will have to wait until the CPU
    is free and can be rescheduled.


    ### 2.7.1 Scheduling Queues:


    As processes enter the system, they are put into a job queue, which consists of
    all processes in the system. The processes that are residing in main memory are
    ready and waiting to execute are kept on a list called the ready queue. This queue
    is generally stored as a linked list. A ready-queue header contains pointers to
    the first and final PCBs in. Each PCB includes a pointer field that points to
    the next PCB in the ready queue.


    Operating System Concepts and Basic Linux Commands


    The system also includes other queues. When a process is allocated the CPU, it
    executes for a while and eventually quits, interrupted, or waits for the occurrence
    of a particular event, such as the completion of an I/O request. Suppose the process
    makes an I/O request to a shared device, such as a disk. Since there are many
    processes in the system, the disk may be busy with the I/O request of some other
    process. The process therefore may have to wait for the disk. The list of processes
    waiting for a particular I/O device is called a **device queue**. Each device
    has its own device queue.


    ![](img/b3f889342bdc020af96a131b08d63774_53_0.png)


    Fig: 2.9 The ready queue & various types of device queues


    ### 2.7.2 Schedulers:


    There are three main schedulers:-- Long term scheduler

    - Short term scheduler

    - Medium term scheduler


    ### Long term Scheduler:


    The function of long term scheduler is, selects processes from job pool and loads
    them into main memory (ready queue) for execution, so the long term scheduler
    is called as job scheduler.


    For example, assume that computer lab consisting of 20 dummy nodes connected to
    the server using local area network, out of 20, ten users want to execute their
    jobs, then these jobs are loaded into spool disk. The long term scheduler selects
    the jobs from the spool disk and loaded them into main memory in ready queue.


    ### Short term Scheduler:


    The short-term scheduler, or CPU scheduler, selects a job from ready queue (processes
    that are ready to execute) and allocates the CPU to that process with the help
    of dispatcher. The method of selecting a process from the ready queue (by short
    term scheduler) is depending on CPU scheduling algorithm.


    ### Dispatcher:


    Dispatcher is a module, which connects the CPU to the process selected by the
    short term scheduler. The main function of dispatcher is switching the CPU from
    one process to another process. Another function of dispatcher is jumping to the
    proper location in the user program, and ready to start execution. The dispatcher
    should be fast, because it is invoked during each and every process switch. The
    time taken by dispatcher to stop one process and start another process is known
    as ‘dispatch latency’. The degree of multiprogramming is depending on the dispatch
    latency. If the dispatch latency is increasing, then the degree of multiprogramming
    is decreases.


    ### Medium term Scheduler


    If the process request an I/O in the middle of the execution, then the process
    is removed from the main memory and loaded into waiting queue. When the I/O operation
    completed, then the job moved from waiting queue to ready queue. These two operations
    are performed by medium term scheduler.


    Operating System Concepts and Basic Linux Commands


    The short-term scheduler must select a new process for the CPU frequently. A process
    may execute for only a few milliseconds before waiting for an I/O request. Often,
    the short-term scheduler executes at least once every 100 milliseconds. Because
    of the short time between executions, the short-term scheduler must be fast.


    The long-term scheduler executes much less frequently; minutes may separate the
    creation of one new process and the next. The long-term scheduler controls the
    degree of multiprogramming (the number of processes in memory). If the degree
    of multiprogramming is stable, then the average rate of process creation must
    be equal to the average departure rate of processes leaving the system. Thus,
    the long-term scheduler need to be invoked only when a process leaves the system.


    ![](img/b3f889342bdc020af96a131b08d63774_55_0.png)


    Fig 2.10: Queuing diagram of the CPU Scheduling


    ### 2.7.3 Context Switch:


    Switching the CPU to another process requires saving the state of the old process
    and loading the saved state of the new process. This task is known as a context
    switch. The context of a process is represented in the PCB of the process; it
    includes the value of the CPU registers, the process state, and memory management
    information. When a context switch occurs, the operating system saves the context
    of the old process in its PCB and loads the saved context of the new process scheduled
    to run. Context-switch time is pure overhead, because the system does no useful
    work while switching. Its speed varies from machine to machine, depending on the
    memory speed, the number of registers that must be copied, and the existence of
    special instructions (such as a single instruction to load or store). The degree
    of multiprogramming is depending on the dispatch latency. If the dispatch latency
    is increasing, then the degree of multiprogramming is decreases.


    ### 2.7.4 CPU scheduling:


    Switching the CPU to another process requires saving the state of the old process
    and loading the saved state of the new process. This task is known as a context
    switch. The context of a process is represented in the PCB of the process; it
    includes the value of the CPU registers, the process state, and memory management
    information. When a context switch occurs, the operating system saves the context
    of the old process in its PCB and loads the saved context of the new process scheduled
    to run. Context-switch time is pure overhead, because the system does no useful
    work while switching. Its speed varies from machine to machine, depending on the
    memory speed, the number of registers that must be copied, and the existence of
    special instructions (such as a single instruction to load or store). The degree
    of multiprogramming is depending on the dispatch latency. If the dispatch latency
    is increasing, then the degree of multiprogramming is decreases.


    ![](img/b3f889342bdc020af96a131b08d63774_56_0.png)


    Fig:2.11 The ready queue


    Operating System Concepts and Basic Linux Commands


    An I/O-bound program typically has short CPU bursts. A CPU-bound program might
    have few long CPU bursts. The selection of an appropriate algorithm depends on
    I/O.


    ![](img/b3f889342bdc020af96a131b08d63774_57_0.png)


    Fig:2.12 Histogram of CPU burst


    ### 2.8 Scheduling Criteria:


    Different CPU scheduling algorithms have different properties, and the choice
    of a particular algorithm may favor one class of processes over another. In choosing
    which algorithm to use in a particular situation, we must consider the properties.
    Many criteria have been suggested for comparing CPU scheduling algorithms. These
    criteria are used for comparison to choose the best one:


    - **CPU utilization.** We want to keep the CPU as busy as possible. The CPU utilization
    may range from 0 to 100 percent. In a real system, it should range from 40 percent
    (for a lightly loaded system) to 90 percent (for a heavily used system).

    - **Throughput.** If the CPU is busy executing processes, then work is being done.
    One measure of work is the number of processes that are completed per time unit,
    called throughput. For long processes, this rate may be one process per hour;
    for short transactions, it may be 10 processes per second.

    - **Turnaround time.** From the point of view of a particular process, the important
    criterion is how long it takes to execute that process. The interval from the
    time of submission of a process to the time of completion of process is the turnaround
    time. Turnaround time is the sum of the periods spent to get into memory, waiting
    in the ready queue, executing on the CPU, and doing I/O.

    - **Waiting time.** The CPU scheduling algorithm does not affect the amount of
    time during which a process executes or does I/O; it affects only the amount of
    time that process spends waiting in the ready queue. Waiting time is the sum of
    the periods spent waiting in the ready queue.

    - **Response time.** Response time is the time from the submission of a request
    until the first response is produced. It is the time it takes to start responding,
    not the time it takes to output the response. The turnaround time is generally
    limited by the speed of the output device.


    It is desirable to maximize CPU utilization and throughput and minimize turnaround
    time, waiting time, and response time.


    ### 2.9 Scheduling Algorithms:


    CPU scheduling deals with the problem of deciding which of the process in the
    ready queue is to be allocated the CPU. There are many different CPU scheduling
    algorithms.


    ### 2.9.1 First-Come, First-Served Scheduling:


    The simplest CPU-scheduling algorithm is the first-come, first-served (FCFS) scheduling
    algorithm. With this scheme, the process that requests the CPU first is allocated
    the CPU first. The implementation of the FCFS policy is easily managed with a
    FIFO.

