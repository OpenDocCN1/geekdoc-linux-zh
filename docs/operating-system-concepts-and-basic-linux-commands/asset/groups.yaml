    Priority scheduling can be either preemptive or non-preemptive. When a process
    arrives at the ready queue, its priority is compared with the priority of the
    currently running process. A preemptive scheduling algorithm will preempt the
    CPU if the priority of the newly arrived process is higher than the priority of
    the currently running process. A non-preemptive priority scheduling algorithm
    will simply put the new process at the head of the ready queue.


    A major problem with priority scheduling algorithms is indefinite blocking, or
    starvation. A process that is ready to run but waiting for the CPU can be considered
    blocked. A priority scheduling algorithm can leave some low-priority processes
    waiting indefinitely. In a heavily loaded computer system, a steady stream of
    higher-priority processes can prevent a low-priority process from ever getting
    the CPU.


    A solution to the problem of indefinite blockage of low-priority processes is
    aging. Aging is a technique of gradually increasing the priority of processes
    that wait in the system for a long time. For example, if priority ranges from
    127 (low) to 0 (high), we could increase the priority of a waiting process by
    1 every 15 minutes. Eventually, even a process with an initial priority of 127
    would have the highest priority in the system and be executed.


    ## 2.9 Round-Robin Scheduling


    The round-robin (RR) scheduling algorithm is designed especially for time-sharing
    systems. It is similar to FCFS scheduling, but preemption is added to switch between
    processes. A small unit of time, called a time quantum or time slice, is defined.
    A time quantum is generally from 10 to 100 milliseconds. The ready queue is treated
    as a circular queue. The CPU scheduler goes around the ready queue, allocating
    the CPU to each process for a time interval of up to 1 time quantum.


    To implement RR scheduling, we keep the ready queue as a FIFO queue of processes.
    New processes are added to the tail of the ready queue. The CPU scheduler picks
    the first process from the ready queue, sets a timer to interrupt after 1 time
    quantum, and dispatches the process.


    One of two things will happen. The process may have a CPU burst of less than 1
    time quantum. In this case, the process itself will release the CPU voluntarily.
    The scheduler will then proceed to the next process in the ready queue. Otherwise,
    if the CPU burst of the currently running process is longer than 1 time quantum,
    the timer will go off and will cause an interrupt to the operating system. A context
    switch will be executed, and the process will be put at the tail of the ready
    queue. The CPU scheduler will then select the next process in the ready queue.


    The average waiting time under the RR policy is often long. Consider the following
    set of processes that arrive at time 0, with the length of the CPU burst given
    in milliseconds:


    | Process | Burst time |

    | --- | --- |

    | P1 | 24 |

    | P2 | 3 |

    | P3 | 3 |


    If we use a time quantum of 4 milliseconds, then process P1 gets the first 4 milliseconds.
    Since it requires 20 milliseconds, it is preempted after the first time quantum,
    and the CPU is given to the next process in the queue, Process P2. Since process
    P1 does not need 4 milliseconds, it quits before its quantum expires. The CPU
    is given to the next process, process P3. Once each process has received 1 time
    quantum, the CPU is returned to process P1 for an additional time quantum. The
    Gantt chart is shown in fig.


    # Operating System Concepts and Basic Linux Commands


    | P1 | P2 | P3 | P1 | P1 | P1 | P1 | P1 |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | 0 | 4 | 7 | 10 | 14 | 18 | 22 | 26 | 30 |


    ## Average waiting time


    Waiting time = starting time – Arrival time

    Waiting time for P1 = (0-0)+(10-4)+(14-14)+(18-18)+(22-22)+ (26-26)+(30-30) =
    6

    Waiting time for P2= 4 - 0 = 4

    Waiting time for P3= 7 - 0 = 7

    The average waiting time = (6+4+7)/3 = 5.66 Milliseconds.


    The average waiting time is 17/3 = 5.66 milliseconds. In the RR scheduling algorithm,
    no process is allocated the CPU for more than 1 quantum in a row (unless it is
    the only runnable process). If a process''s CPU burst exceeds 1 time quantum,
    that process is preempted and put back in the ready queue. The RR scheduling algorithm
    is preemptive.


    ## Summary


    First-come-first-serve scheduling is the simplest scheduling algorithm, but it
    can cause short jobs to wait for long time. Shortest-Job-first scheduling is provably
    optimal, providing the shortest average waiting time. The shortest job first is
    difficult to implement because it is difficult to predict the length of next CPU
    burst. Shortest-Job-first is a special case of general priority scheduling algorithm,
    which simply allocates the CPU to the highest priority process. Both priority
    and Shortest-Job-first scheduling may suffer from starvation. Aging is a technique
    to prevent starvation.


    Round-robin scheduling is more appropriate for a time-shared system. Round-robin
    is a preemptive algorithm. FCFS is non-preemptive. Shortest-Job-first and priority
    algorithms may be either preemptive or non-preemptive. Round-robin allocates the
    CPU to the first process in the ready queue for q time units, where q is the time
    quantum. After the q time units, the CPU is preempted and the process is put at
    the tail of the ready queue.


    A major problem is the selection of the time quantum. If the quantum is too large,
    Round-robin degenerates to FCFS scheduling; if the quantum is too small, scheduling
    overhead in the form of context switch time becomes excessive.


