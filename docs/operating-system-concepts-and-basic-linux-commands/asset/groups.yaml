    # 5.11.7 Removing directories(rmdir):


    This command is used to remove directories. Its syntax is :


    ```

    $rmdir directories

    ```


    Here, directories includes the names of the directories you want removed. For
    example, the command


    ```

    $ rdir ch01 ch02 ch03

    ```


    removes the directories ch01, ch02, and ch03 if they are empty. The rdir command
    produces no output if it is successful. A directory can be deleted only if it
    is empty(does not contain files or sub)}{). Current directory cannot be deleted.
    Complete path names can also be specified with rmdir as shown in mkdir command.


    # 5.12 vi Editor:


    The first version of vi was written in 1976 by Bill Joy, a University of California
    at Berkley student who later went on to co-found Sun Microsystems. vi derives
    its name from the word “visual,” because it was intended to allow editing on a
    video terminal with a moving cursor.


    Vi editor is the original editor used on Unix systems. It uses the console graphics
    to emulate a text-editing window, allowing you to visually see the lines of your
    file, move around within the file, and insert, edit, and replace text.


    Most Linux distributions do not include real vi; rather, they ship with an enhanced
    replacement vim which is short for “vi improved” written by Bram Moolenaar. vim
    is a substantial improvement over traditional Unix and is usually symbolically
    linked (or aliased) to the name “vi” on Linux systems. In the discussions that
    follow, we will assume that we have a program called“vi” that is really vim.


