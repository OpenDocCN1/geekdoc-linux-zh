    ## 3.16 页面置换算法：


    有各种页面置换算法，以下是一些常用的页面置换算法：


    ### 3.16.1 FIFO 页面置换


    最简单的页面置换算法是 FIFO（先先出）算法。FIFO 页面置换算法与每个页面进入内存的时间相关。当某个页面必须被替换时，选择最旧的页面，即替换在内存中时间比其他其他页面都长的页面。


    例如，考虑一个引用串：7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0, 3, 2, 1, 2, 0, 1, 7, 0, 1。


    假设有三个初始为空的帧。对于我们的示例引用串，我们的三个帧初始时为空的。


    前三次引用 (7, 0, 1) 导致页缺并被带到这些空帧中。下一个引用 (2) 替换了页面 7，因为页面 7 是先进入的。由于 0 已经在内存中，我们这次引用没有发生页缺。


    第一次引用 3 导致了页面 0 的替换，因为现在现在是内存中三个页面中最旧的，这意味着下一次对 0 的引用将导致页缺。随后，页面 1 被页面 0 替换。这一过程如图所示。每当发生页缺时，我们都显示三个帧中是哪些页面。对于给定的引用串和三个帧，总共发生了
    15 次页缺。


    + 7 0 1 2 3 0 4 2 3 0 2 1 2 0 1 7 0 1


    | 7 7 2 | 2 4 4 4 0 | 0 0 | 7 7 7 |

    | 0 0 0 | 3 3 2 2 0 | 1 1 | 1 0 0 |

    | 1 1 1 | 0 0 3 | 3 2 | 2 2 7 |


    页帧


    # 图 3.25 FIFO 页面置换


    FIFO 页面置换算法容易理解和编程。然而，它的性能并不总是良好。我们可能必须选择一个活跃页面进行替换，在用新页面替换活跃页面后，该活跃页面立即发生页缺。然后将需要替换另一个其他页面以将活跃页面带入内存。因此，糟糕的置换选择会增加页缺率并减慢进程执行，但不会导致执行错误。


    为了说明页面置换中出现的问题，我们考虑引用串 1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5。注意，四个帧的页缺数（10）大于三个帧（9）。这种结果被称为贝尔雷异常。


    在某些研究中，人员发现这种假设是不成立的。页面置换会改进其性能。


    ## 3.16.2 最优算法：


    最优页面置换简单称为 MIN。FIFO 和 OPT 算法（向前看）的关键区别在于：FIFO 使用页面进入内存的时间，而 OPT 使用页面将要使用的时间。


    不幸的是，最优算法很难实现，因为它需要引用串的未来。然而，它保证了最低的页缺率且不会遭受贝尔雷异常。


    例如，对于我们的引用串 1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5，最优置换将产生九次页缺，如图所示。


    ![](img/b3f889342bdc020af96a131b08d63774_109_0.png)


    图3.26: 最优算法


    ## 3.16.3 最久未使用算法：


    如果最优算法不可，或许可以使用最优算法的近似。如果我们使用过去作为未来的近似，就可以使用：最久未使用（LRU）置换与每个页面的最后使用时间相关。当页面必须被替换时，LRU
    选择最长时间未使用的页面。这种策略是向后查看时间。


    将 LRU 应用于示例引用串的结果如图所示。LRU 算法产生了 12 次页缺。注意前五次页缺与最优算法相同。当引用 4 时，页面 2 使用最少。因此，LRU
    替换了页面 4，而不知道页面 2 即将使用。当随后发生页面 2 缺时，LRU 替换了页面 3，因为它是内存中三个页面中最久使用的。尽管存在这些问题，12 次页缺的
    LRU 置换仍然优于 15 次页缺的 FIFO 置换。


