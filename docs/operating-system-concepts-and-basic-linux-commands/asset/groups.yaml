    ## 4.11 目录结构


    Linux 将一切事物都视为文件。因此，准确理解什么是 Linux 文件以及它如何在系统内部组织文件至关重要。你可能需要的每种文件都以系统文件、数据文件、应用程序文件、工具文件、驱动程序文件、配置文件等形式存储在
    Linux 文件系统中。这些文件中的每一个都有一个名称和一个存储在文件系统中的目录结构。


    Linux 文件系统建立在类似于 DOS、微软和 UNIX 文件系统的树形结构上。有一个根目录，由 `/` 字符标识，所有其他目录和子目录都在其下方生成。文件包含在这些目录和子目录中。


    目录名称可以由数字、符号和字符的组合组成。目录名称包含了目录的位置，即在文件系统中获取该目录所遵循的目录路径。


    嵌套在其他目录中的目录被称为子目录。


    目录结构的基准是根目录（`/`）。它包含了 Linux 系统中的所有子目录和文件。


    ![](img/b3f889342bdc020af96a131b08d63774_137_0.png)


    # 图 4.14：Linux 目录结构


    - **/bin:** 可执行文件存储在 `/bin`（二进制）目录中。在此目录中，Linux 保留了它的基本命令和程序。其中有启动各种 shell 的命令、处理文件的命令（如复制和移动）、更改文件权限的命令以及配置实用程序。


    - **boot:** 此目录存储了启动配置文件和命令。该目录包含了启动系统所需的所有内容。


    - **dev:** 此目录中保留了所有设备文件（或用于所有计算机硬件组件的驱动程序）。当我们配置 Linux 使用特定设备时，我们必须配置此目录中的特定文件。


    - **etc:** Linux 在此目录中保留系统配置文件和初始化脚本。你可以编辑这些文件来向系统添加用户并更改他们的密码（`/etc/passwd` 文件），或为文件共享创建组账户（`/etc/group`
    文件）。


    - **/home:** 系统上的每个用户都有一个个人目录，他可以在其中存储自己创建的文件。该目录包含在 `/home` 目录下。在该目录下，除了超级用户外，每个用户都有一个独立的子目录。用户的家目录用于存储个人文件，系统上的其他用户无法访问。


    - **/lib:** `/lib` 目录包含 C 语言和其他编程语言的库。它还包含了启动系统和运行命令所需的共享库镜像。


    - **/lost+found:** 如果用户认为 Linux 丢失了某个文件，可以在此目录中查找。如果系统上有多个分区，则每个分区上都有一个 `/lost+found`
    目录。


    - **/mnt:** 这是一个可以将其他文件系统挂载（mounted）到 Linux 文件系统的目录。例如，要查看光驱盘的内容，用户可以查看 `/mnt/cdrom`
    目录。要查看软磁盘的内容，用户可以查看 `/mnt/floppy`。


    - **/proc:** 此目录包含 Linux 用于跟踪正在运行进程的虚拟文件。它们是虚拟文件，实际上并不存在于那里。它们不占用任何磁盘空间。


    - **/root:** `/root` 目录是超级用户或系统管理员的家目录。


    - **/sbin:** 此目录包含超级用户（系统管理员）使用的文件。该目录包含关闭系统、设置系统时、检查文件系统错误以及设置网络等命令。


    - **/tmp:** 临时文件位于 `/tmp` 目录中。所有用户可以在这里临时存储文件，以便其他用户访问。根据《操作系统概念和基础 Linux 命令》，系统重启时，存储在
    `/tmp` 目录中的数据将会丢失。


    - **/usr:** 此目录包含不属于 Linux 文件系统的文件。例如，它包含了 X Window 系统的应用程序、Linux 游戏集以及大量的帮助文件。


    - **/var:** 此目录包含日志文件。日志中的信息指示启动时加载了哪些软件以及系统硬件的配置情况。


    ## 4.12 文件和目录的命名：


    系统上的每个文件都被分配了名称并存在于系统中。当用户第一次保存文档时，他需要在文件系统中选择一个目录来存储该文件，并赋予文件名。以下是在文件系统中正确位置存储文档并命名的几个步骤：


    - 确定文件名的长度，文件名可以包含多达 256 个字符。文件名包含了通向文件的目录路径。例如，位于 `/home/aditi/images` 目录下的单个文件
    `template.bmp` 长度为 31 个字符。实际文件名是 `/home/aditi/images/template.bmp`。

    - 命名文件时，可以使用 A 到 Z 的所有字母（包括大写和小写字母）或 0 到 9 的任意数字。你还可以也可以使用连字符（-）或下划线（_）。Linux
    文件名对大小写敏感。大写的 ‘A’ 与小写的 ‘a’ 不同。

    - 避免在文件名中使用空格，这会导致问题。

    - 要创建隐藏文件，文件名以点（.）开头，例如你想创建一个 `.file1.txt`。

    - 找到你的家目录。输入 `cd` 并回车。

    - 创建一个名为 `firstfile` 的文件。输入 `cat > firstfile` 并回车。

    - 要读取你创建的文件，输入 `cat firstfile` 并回车。


