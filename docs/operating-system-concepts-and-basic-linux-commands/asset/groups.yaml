    # Operating System Concepts and Basic Linux Commands


    For example:

    ls -l /usr/doc


    The ls command displays a file list for the contents of the current working directory.
    The command option ls -l, which modifies the information displayed about each
    file in the listing. The parameter tells the command to list the contents of the
    /usr/doc directory instead of current working directory.


    A command parameter can be a file, a directory, or a period of time. Parameters
    are not preceded by dash. Parameter specify, which file or directory is a command
    to be acted upon, or they can set a time limit in the command is to be executed.


    # 5.6 Creating alias for long command:


    A command alias is a unique short name that is assigned to a command. It is possible
    assign a short name for a long command using aliases. To create an alias for the
    following command


    ```bash

    cd /user/doc/file1

    ```


    Suppose ‘move’ is a sample alias name, to create this alias, type at the shell
    prompt:


    ```bash

    alias move="cd/user/doc/file1"

    ```


    The alias command is followed by the alias name. the equal sign (= precedes the
    command that will be executed when the alias name is typed at the shell prompt.
    Do not give the space to the either side of equal sign. Now to change to ‘file1’
    directory just type ‘move’ and press Enter.


    # 5.7 Input/output Redirection:


    When you execute a command, the command is read from the keyboard (the standard
    Input) and the result of the command(output) appears on the screen (the standard
    output). If you want the command output to appear in a different place, or if
    you want to send the output to another command for processing, then we need to
    change the output with process called Input/output redirection.


    # 5.7.1 Redirecting Standard Output:


    To redirect standard output, use ''>'' symbol. Placing ''>'' after a command (e.g.
    cat command) will direct its output to the filename following the symbol.


    Using cat by itself simply outputs whatever you input to screen, as if it were
    repeating line you just typed.


    Example:


    ```bash

    $ cat

    I am girl

    I am girl

    I am boy

    I am boy

    $

    ```


    To redirect cat output to a file, type the following at shell prompt.


    ```bash

    $ cat> file1.txt

    Buy some sneakers

    Then go to coffee shop

    Then buy some coffee

    ^d

    $

    ```


    You can use cat to read the file. At the shell prompt, type:


    ```bash

    $ cat file1.txt

    Buy some sneakers

    Then goto coffee shop

    Then buy some coffee

    ```


    # Operating System Concepts and Basic Linux Commands


    When you redirect the output to a file, you can overwrite an existing file, so
    that the name of the file you are creating does not match name of pre-existing
    file, unless you want to replace it.


    Use output redirection again for another file and name it file2.txt

    For example:


    ```bash

    $ cat>file2.txt

    Bring the coffee home

    Make some coffee

    Relax!

    ^d

    $

    ```


    Now, use cat to join file2.txt with file1.txt and redirect output of both files
    to a new file3.txt.


    ```bash

    $cat file1.txt file2.txt>file3.txt

    ```


    After execution of the above command, execute the following command


    ```bash

    $cat file3.txt

    You will get the following output

    ```


    + Buy some sneakers

    Then goto coffee shop

    Then buy some coffee

    Bring the coffee home

    Make some coffee

    Relax!

    $


    In this example, cat has added file1.txt and file2.txt and the output is stored
    to a new file file3.txt.


    # 5.7.2 Appending standard output:


    you can use output redirection to add new information to the end of existing file.
    Use ''>>'' to append data to an existing file.

    When you use ''>>'' symbol, you are adding information to a file, rather than
    replacing the contents of a file entirely.

    For example:


    Take two already created files and join them by using the append symbol.


    ```bash

    $cat file2.txt>>file1.txt

    ```


    Here the contents of file2.txt are appended at the bottom of file1.txt.


    ```bash

    $cat file1.txt

    Buy some sneakers

    Then goto coffee shop

    Then buy some coffee

    Bring the coffee home

    Make some coffee

    Relax!

    ```


    # 5.7.3 Redirecting Standard Input:


    It is possible to perform the same type of redirection with standard input. The
    standard input redirection symbol is ''<'', when you use this symbol, you are
    telling the shell that you want the input to be read from a file.


    For example:


    ```bash

    $cat<file1.txt

    ```


    Here the output of file1.txt was read by cat command and it displays contents
    of the file file1.txt.


