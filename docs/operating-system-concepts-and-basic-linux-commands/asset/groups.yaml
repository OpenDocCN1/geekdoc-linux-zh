    ## 5.9 cat 命令：


    要查看内容，使用 `cat` 命令（查看文件的选项）。其语法为：


    ```

    $ cat filename

    ```


    这里 filename 是要查看的文件名。该命令将内容输出到标准输出。例如：


    ```

    $ cat file1.txt file2.txt

    ```


    该命令可以将多个文件合并到一个输出。


    ## 5.10 wc 命令：


    `wc` 命令用于统计行数、单词数和字符。其语法为：


    ```

    $ wc [options] filename

    ```


    | 选项 | 功能 |

    | --- | --- |

    | -l | 输出行数 |

    | -w | 输出单词数 |

    | -c | 输出字节数（字符） |


    例如：


    ```

    $ wc -l file.txt

    ```


    这将输出 file.txt 的行数。


    ## 5.11 操作文件和目录


    ### 复制文件 (cp)


    `cp` 命令用于复制文件和目录。基本语法为：


    ```

    $ cp source destination

    ```


    这里 是要复制的文件或目录，destination 是你想创建副本的位置。例如：


    ```

    $ cp file1.txt file2.txt

    ```


    要复制目录，必须使用 `-r` 选项：


    ```

    $ cp -r directory1 directory2

    ```


    ### 重命名和移动文件 (mv)


    `mv` 命令用于重命名和移动文件及目录。其语法为：


    ```

    $ mv source destination

    ```


    要重命名文件，使用新名称作为目标。要将文件移动到另一个目录，指定目录作为目标：


    ```

    $ mv file1.txt /path/to/destination/

    ```


    ### 删除文件 (rm)


    `rm` 命令用于从系统中删除文件和目录。其语法为：


    ```

    $ rm [options] filename

    ```


    要删除多个文件，请列出它们：


    ```

    $ rm file1 file2

    ```


    要删除目录，使用 `-r` 选项：


    ```

    $ rm -r directory

    ```


    ### 切换目录 (cd)


    `cd` 命令用于切换工作目录。其语法为：


    ```

    $ cd directory

    ```


    这里 directory 是你想进入的目录路径。要返回上一级目录，使用：


    ```

    $ cd ..

    ```


    要回到主目录，使用：


    ```

    $ cd ~

    ```


    ### 创建目录 (mkdir)


    `mkdir` 命令用于创建新目录。其语法为：


    ```

    $ mkdir directory

    ```


    这里 directory 是你想创建的新目录名称。要一次性创建多个目录，请列出它们：


    ```

    $ mkdir dir1 dir2 dir3

    ```


