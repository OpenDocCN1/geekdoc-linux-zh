    pipeline, we changed the data to produce a single, sorted list.


    # uniq - Report Or Omit Repeated Lines


    The uniq command is often used in conjunction with sort. uniq accepts a sorted
    list of data from either standard input or a single filename argument (the uniqman
    page for details) and, by default, removes any duplicates from the list. So, to
    make sure your list has no duplicates (that is, any programs of the same name
    that appear in both the /bin and /usr/bin directories) we will add uniq to our
    pipeline:


    ```

    [aditi@localhost ~]$ ls /bin /usr/bin | sort | uniq | less

