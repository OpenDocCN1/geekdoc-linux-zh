    # 操作系统概念与基础 Linux 命令行


    ## 5.12.8 文本的剪切、复制与粘贴：


    `d` 命令不仅可以删除文本，还会“剪切”文本。每当我们使用 `d` 命令时，删除的内容都会被复制到粘贴缓冲区（想象成剪贴板），我们稍后可以使用 `p` 命令在光标之后粘贴缓冲区的内容，或者使用
    `P` 命令在光标之前粘贴缓冲区的内容。


    `y` 命令用于“提取”（yank/复制）文本，其使用方式与 `d` 命令剪切文本非常相似。以下是将 `y` 命令与各种移动命令结合的一些示例：


    | 命令 | 复制内容 |

    | :--- | :--- |

    | yy | 当前行。 |

    | 5yy | 当前行及后续四行。 |

    | yW | 从当前光标位置到下一个单词的开头。 |

    | y$ | 从当前光标位置到当前行的末尾。 |

    | y0 | 从当前光标位置到行首。 |

    | y^ | 从当前光标位置到行内第一个非空白字符。 |

    | yG | 从当前行到文件末尾。 |

    | y20G | 从当前行到文件的第二十行。 |


    将光标置于文本的第一行并输入 `yy` 复制当前行。接下来，将光标移动到最后一行（G）并输入 `p` 在当前行下方粘贴该行：


    This is the first day of my college. It is cool.

    Line 2

    Line 3

    Line 4

    Line 5

    This is the first day of my college. It is cool.


    和一样，`u` 命令将撤销我们的操作。在光标仍位于文件最后一行的情况下，输入 `P` 在当前行上方粘贴文本：


    ## 5.13 压缩文件 (gzip, gunzip 命令)：


    `gzip` 程序用于压缩一个或多个文件。执行时，它会用原始文件的压缩版本替换原始文件。相应的 `gunzip` 程序则用于将压缩文件恢复为原始的未压缩格式。以下是一个示例：


    ```

    [aditi@localhost~$] ls -l /etc ~ first.txt

    [aditi@localhost~$] ls -l first.*\*

    -rw-r--r-- 1 aditi 15738 2008-10-14 07:15 first.txt

    [aditi@localhost~$] gzip first.txt

    [aditi@localhost~$] ls -l first.*\*

    -rw-r--r-- 1 aditi 32230 2008-10-14 07:15 first.txt.gz

    [aditi@localhost~$] gzip first.txt

    [aditi@localhost~$] ls -l first.*\*

    -rw-r--r-- 1 aditi 15738 2008-10-14 07:15 first.txt

    ```


    在这个示例中，我们从目录列表中创建了一个名为 `first.txt` 的文本文件。接下来，我们运行 `gzip`，它用名为 `first.txt.gz` 的压缩版本替换了原始文件。在
    `first.*` 的目录列表中，我们看到原始文件已被压缩版本替换，且压缩版本的大小大约是原始文件的五分之一。我们还可以看到压缩文件与原始具有相同的权限和时间戳。接下来，我们运行
    `gunzip` 程序来解压文件。之后，我们可以看到文件的压缩版本已被还原为原始文件，同样保留了权限和时间戳。


    ## bzip2


    由 Julian Seward 开发的 `bzip2` 程序与 `gzip` 类似，但它使用了不同的压缩算法，以牺牲速度为代价实现了更高的压缩率。在大多数方面，它的工作方式与
    `gzip` 相同。用 `bzip2` 压缩的文件以后缀 `.bz2` 表示：


    ```

    [aditi@localhost ~]$ ls -1 /etc > first.txt

    [aditi@localhost ~]$ ls -l first.*\*

    -rw-r--r-- 1 aditi aditi 15738 2008-10-14 07:15 first.txt


    [aditi@localhost ~]$ bzip2 first.txt

    [aditi@localhost ~]$ ls -l first.*\*

    -rw-r--r-- 1 aditi aditi 32230 2008-10-14 07:15 first.txt.bz


    [aditi@localhost ~]$ bzip2 first.bz2

    -rw-r--r-- 1 aditi aditi 15738 2008-10-14 07:15 first.bz2

    ```


    如我们所见，`bzip2` 可以像 `gzip` 一样使用。


    ## 5.14 文件归档 (tar):


    归档是将许多文件收集并将它们打包成一个大文件的过程。归档通常作为系统备份的一部分进行。当旧数据从系统移动到某种长期存储设备时，也会使用归档。


    ## tar:


    `tar` 程序是归档文件的经典工具。它的名称是 tape archive（带归档）的缩写，揭示了它作为制作备份带工具的起源。虽然它仍用于传统任务，但在其他存储设备上同样高效。`tar`
    归档可以使用 `.tar` 或 `.tgz` 后缀，后者表示经过 gzip 压缩的归档。`tar` 的语法如下：


    | 模式 | 描述 |

    | :--- | :--- |

    | c | 创建归档。 |

    | x | 解开归档。 |

    | r | 追加文件到归档。 |

    | t | 列出归档内容。 |

