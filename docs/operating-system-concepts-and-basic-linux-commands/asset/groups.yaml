    ## 2.7 CPU 调度


    多道程序的目标是让某些进程始终运行，以最大化 CPU 的利用率。时间分共享的目标是频繁地在进程之间切换 CPU，使用户户能够在程序运行时与其进行交互。为了实现这些目标，进程调度器会选择一个可用的进程（可能从多个可用进程中选择一个），在
    CPU 上进行程序执行。对于单处理器系统，运行的进程永远不会超过一个。如果有更多的进程，其余进程将必须等待 CPU 空闲后才能被重新调度。


    ### 2.7.1 调度队列：


    当进程进入系统时，它们被放入作业队列（job queue），该队列包含系统中的所有进程。驻留在主内存中准备好等待执行的进程被保留在一个称为就绪队列（ready
    queue）的列表中。该队列通常以链表的形式存储。就绪队列头包含指向就绪队列中第一个 PCB 和最后一个 PCB 的指针。每个 PCB 包含一个指针字段，指向就绪队列中的下一个
    PCB。


    操作系统概念与基础 Linux 命令


    系统还包括其他队列。当一个进程被分配到 CPU 时，它会执行一段时间，并最终退出、被中断或等待特定事件的发生（例如 I/O 请求的完成）。假设该进程对共享设备（如磁盘）发起了
    I/O 请求。由于系统中有很多许多进程，磁盘可能忙于某些其他进程的 I/O 请求。因此，该进程可能需要等待磁盘。等待特定 I/O 设备的进程列表被称为**设备队列**（device
    queue）。每个设备都有它们自己的设备队列。


    ![](img/b3f889342bdc020af96a131b08d63774_53_0.png)


    图: 2.9 就绪队列与各种类型的设备队列


    ### 2.7.2 调度器：


    主要有三种调度器：--

    - 长期调度器（Long term scheduler）

    - 短期调度器（Short term scheduler）

    - 中期调度器（Medium term scheduler）


    ### 长期调度器：


    长期调度器的功能是从作业池中选择进程，并将它们加载到主内存（就绪队列）中执行，因此长期调度器被称为作业调度器。


    例如，假设一个计算机实验室由 20 个虚拟节点组成，通过局域网连接到服务器，在 20 个节点中有十个用户想要执行他们的作业，那么这些作业会被加载到虚拟磁盘中。长期调度器从虚拟磁盘中选择作业并将其加载到主内存的就绪队列中。


    ### 短期调度器：


    短期调度器或 CPU 调度器，从就绪队列（准备好执行的进程）中选择一个作业，并在调度程序（dispatcher）的帮助下将 CPU 分配给该进程。从就绪队列中通过短期调度器选择进程的方法取决于
    CPU 调度算法。


    ### 调度程序：


    调度程序是一个将 CPU 连接到短期调度器所选进程的模块。调度程序的主要功能是将 CPU 从一个进程切换到另一个进程。调度程序的另一个功能是跳转到用户程序的正确位置，并准备开始执行。调度程序必须快速，因为在每次进程切换期间都会被调用。调度程序停止一个进程并启动另一个进程所花费的时间被称为“调度延迟”（dispatch
    latency）。多道程序的程度取决于调度延迟。如果调度延迟增加，那么多道程序的程度就会减少。


    ### 中期调度器


    如果进程在执行过程中请求 I/O，则该进程将从主内存中移除并加载到等待队列中。当 I/O 操作完成后，作业将从等待队列移动到就绪队列。这两项操作由中期调度器完成。


    操作系统概念与基础 Linux 命令


    短期调度器必须频繁地为 CPU 选择一个新进程。一个进程在等待 I/O 请求之前可能只执行几毫秒。通常，短期调度器每 100 毫秒至少执行一次。由于两次执行之间的时间很短，短期调度器必须非常快。


    长期调度器的执行频率要低得多；一个新进程的创建与下一个进程的创建之间可能相隔几分钟。长期调度器控制着多道程序的程度（内存中的进程数量）。如果多道程序的程度是稳定的，那么进程创建的平均速率必须等于离开系统的平均离开速率。因此，长期调度器仅在进程离开系统时才需要调用。


    ![](img/b3f889342bdc020af96a131b08d63774_55_0.png)


    图 2.10: CPU 调度队列图


    ### 2.7.3 上下文切换：


    将 CPU 切换到另一个进程需要保存旧进程的状态并加载新进程的保存状态。这项被称为上下文切换。进程的上下文表示在进程的 PCB 中；它包含了 CPU 寄存器的值、进程状态和内存管理信息。当发生上下文切换时，操作系统将旧进程的上下文保存在其
    PCB 中，并加载调度运行的新进程的保存上下文。上下文切换时间是纯开销，因为系统在切换期间没有做任何有用的工作。它的速度随机器而异，取决于内存速度、必须复制的寄存器数量。多道程序的程度取决于调度延迟。如果调度延迟增加，那么多道程序的程度就会减少。


    ### 2.7.4 调度：


    将 CPU 切换到另一个进程需要保存旧进程的状态并加载新进程的保存状态。这项被称为上下文切换。从进程的角度来看，重要的标准是执行该进程需要多久。由于上下文切换，将
    CPU 切换到另一个进程需要保存旧进程的状态并加载新进程的保存状态。进程的上下文表示在进程的 PCB 中；它包含了 CPU 寄存器的值、进程状态和内存管理信息。当发生上下文切换时，操作系统将旧进程的上下文保存在其
    PCB 中，并加载调度运行的新进程的保存上下文。上下文切换时间是纯开销，因为系统在切换期间没有做任何有用的工作。它的速度随机器而异，取决于内存速度、必须复制的寄存器数量。多道程序的程度取决于调度延迟。如果调度延迟增加，那么多道程序的程度就会减少。


    ![](img/b3f889342bdc020af96a131b08d63774_56_0.png)


    图:2.11 就绪队列


    操作系统概念与基础 Linux 命令


    I/O 密集型程序通常具有短 CPU 闪烁。CPU 密集型程序可能具有长 CPU 闪烁。选择合适的算法取决于 I/O 设备。


    ![](img/b3f889342bdc020af96a131b08d63774_57_0.png)


    图:2.12 CPU 爆发直方图


    ### 2.8 调度标准：


    不同的 CPU 调度算法具有不同的属性，算法的选择可能有利于某类进程而非另一类进程。在选择特定情况下使用的算法时，我们必须考虑属性。已经提出了许多标准用于比较
    CPU 调度算法：


    - **CPU 利用率**：我们希望 CPU 尽可能忙碌。CPU 利用率范围从 0 到 100%。在实际系统中，它应该从 40%（轻负载系统）到 90%（重负载系统）。

    - **吞吐量**：如果 CPU 忙于执行进程，那么就在工作。工作的一个衡量标准是单位时间内完成的进程数，称为吞吐量。对于长进程，速率可能是每小时一个；对于短事务，可能是每秒
    10 个。

    - **周转时间**：从进程的角度来看，重要的标准是执行该进程需要多久。从提交进程到完成的时间的时间是周转时间。周转时间是进入内存、等待就绪队列、在 CPU
    上执行和进行 I/O 的时间之和。

    - **等待时间**：CPU 调度算法不影响进程执行或进行 I/O 的时间；它只影响进程在就绪队列中等待的时间。等待时间是在就绪队列中等待的时间之和。

    - **响应时间**：响应时间是从提交请求到产生第一个响应的时间。它是开始响应的时间，而不是输出响应的时间。周转时间通常取决于输出设备的速度。


    希望最大化 CPU 利用率和吞吐量，并最小化周转时间、等待时间和响应时间。


    ### 2.9 调度算法：


    CPU 调度处理的是决定就绪队列中的哪个进程被分配到 CPU 的问题。有许多不同的 CPU 调度算法。


    ### 2.9.1 先来先服务（FCFS）调度：


    最简单的 CPU 调度算法是先来先服务（FCFS）调度算法。在这种方案中，第一个请求 CPU 的进程第一个获得 CPU。FCFS 策略的实现可以通过 FIFO
    轻松管理。


