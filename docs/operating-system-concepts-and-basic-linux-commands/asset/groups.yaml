- md: "\n# Operating System Concepts and Basic Linux Commands\n\n## 5.12.8 Cutting,\
    \ Copying And Pasting Text:\n\nThe d command not only deletes text, it also “cuts”\
    \ text. Each time we use the d command the deletion is copied into a paste buffer\
    \ (think clipboard) that we can later recall with the p command to paste the contents\
    \ of the buffer after the cursor or the P command to paste the contents before\
    \ the cursor.\n\nThe y command is used to “yank” (copy) text in much the same\
    \ way the d command is used to cut text. Here are some examples combining the\
    \ y command with various movement commands:\n\n| Command | Copies |\n| :--- |\
    \ :--- |\n| yy | The current line. |\n| 5yy | The current line and the next four\
    \ lines. |\n| yW | From the current cursor position to the beginning of the next\
    \ word. |\n| y$ | From the current cursor location to the end of the current line.\
    \ |\n| y0 | From the current cursor location to the beginning of the line |\n\
    | y^ | From the current cursor location to the first non-white space character\
    \ in the line. |\n| yG | From the current line to the end of the file. |\n| y20G\
    \ | From the current line to the twentieth line of the file. |\n\nPlace the cursor\
    \ on the first line of the text and type yy to copy the current line. Next, move\
    \ the cursor to the last line (G) and type p to paste the line below the current\
    \ line:\n\nThis is the first day of my college. It is cool.\nLine 2\nLine 3\n\
    Line 4\nLine 5\nThis is the first day of my college. It is cool.\n\nJust as before,\
    \ the u command will undo our change. With the cursor still positioned on the\
    \ last line of the file, type P to paste the text above the current line:\n\n\
    ## 5.13 Compressing files (gzip, gunzip commands):\n\nThe gzip program is used\
    \ to compress one or more files. When executed, it replaces the original file\
    \ with a compressed version of the original. The corresponding gunzip program\
    \ is used to restore compressed files to their original, uncompressed form. Here\
    \ is an example:\n\n```\n[aditi@localhost~$] ls -l /etc ~ first.txt\n[aditi@localhost~$]\
    \ ls -l first.*\\*\n-rw-r--r-- 1 aditi 15738 2008-10-14 07:15 first.txt\n[aditi@localhost~$]\
    \ gzip first.txt\n[aditi@localhost~$] ls -l first.*\\*\n-rw-r--r-- 1 aditi 32230\
    \ 2008-10-14 07:15 first.txt.gz\n[aditi@localhost~$] gzip first.txt\n[aditi@localhost~$]\
    \ ls -l first.*\\*\n-rw-r--r-- 1 aditi 15738 2008-10-14 07:15 first.txt\n```\n\
    \nIn this example, we create a text file named first.txt from a directory listing.\
    \ Next, we run gzip, which replaces the original file with a compressed version\
    \ named first.txt.gz. In the directory listing of first.*, we see that the original\
    \ file has been replaced with the compressed version, and that the compressed\
    \ version is about one-fifth the size of the original. We can also see that the\
    \ compressed file has the same permissions and time stamp as the original. Next,\
    \ we run the gunzip program to uncompress the file. Afterward, we can see that\
    \ the compressed version of the file has been replaced with the original, again\
    \ with the permissions and time stamp preserved.\n\n## bzip2\n\nThe bzip2 program,\
    \ by Julian Seward, is similar to gzip, but uses a different compression algorithm\
    \ that achieves higher levels of compression at the cost of compression speed.\
    \ In most regards, it works in the same fashion as gzip. A file compressed with\
    \ bzip2 is denoted with the extension .bz2:\n\n```\n[aditi@localhost ~]$ ls -1\
    \ /etc > first.txt\n[aditi@localhost ~]$ ls -l first.*\\*\n-rw-r--r-- 1 aditi\
    \ aditi 15738 2008-10-14 07:15 first.txt\n\n[aditi@localhost ~]$ bzip2 first.txt\n\
    [aditi@localhost ~]$ ls -l first.*\\*\n-rw-r--r-- 1 aditi aditi 32230 2008-10-14\
    \ 07:15 first.txt.bz\n\n[aditi@localhost ~]$ bzip2 first.bz2\n-rw-r--r-- 1 aditi\
    \ aditi 15738 2008-10-14 07:15 first.bz2\n```\n\nAs we see, bzip2 can be used\
    \ the same way as gzip.\n\n## 5.14 Archiving Files(tar):\n\nArchiving is the process\
    \ of gathering up many files and bundling them together into a single large file.\
    \ Archiving is often done as a part of system backups. It is also used when old\
    \ data is moved from a system to some type of long-term storage.\n\n## tar:\n\n\
    The tar program is the classic tool for archiving files. Its name, for tape archive,\
    \ reveals its roots as a tool for making backup tapes. While it is still used\
    \ for traditional tasks, it is equally adept on other storage devices. The tar\
    \ archive can have the extension .tar or .tgz, which indicates a gzipped archive.\
    \ The syntax for tar is:\n\n| Mode | Description |\n| :--- | :--- |\n| c | Create\
    \ an archive. |\n| x | Extract an archive. |\n| r | Append files to an archive.\
    \ |\n| t | List the contents of an archive. |\n| f | Specify the filename of the\
    \ archive. |\n\nOther common options include:\n- v: Verbose mode, shows the files\
    \ being processed.\n- h: Human-readable format (sizes in KB, MB, GB).\n- z: Compress\
    \ the archive using gzip. \n- u: Decompress the archive using gzip.\n- j: Compress/decompress\
    \ using bzip2.\n\n## 5.15 Managing disk space: df\n\nThe df tool reports the amount\
    \ of free space on each partition—how large they are. It also provides information\
    \ on non-local file systems (such as mounted NFS or Samba shares). In its most\
    \ basic form, df provides the following:\n\n| Filesystem | 1K-blocks | Used |\
    \ Available | Use% | Mounted on |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n\
    | /dev/md2 | 4881472 | 73508 | 4087964 | 17% | / |\n\nHowever, you can add options\
    \ to df to show the file type and show the sizes in an easier to understand:\n\
    \n$ df -h -T\n| Filesystem | Type | Size | Used | Avail | Use% | Mounted on |\n\
    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| /dev/md2 | xfs | 4.7G |\
    \ 775M | 3.9G | 17% | / |\n\nWhile df provides an overview of entire partitions,\
    \ the du tool will summarize the size of a given directory, broken down by subdirectories.\
    \ The du command shows the disk space used by the files and directories in the\
    \ current directory. By default, the du command lists all subdirectories to show\
    \ how much disk space each has occupied. This can be avoided with the -s option.\
    \ This only shows a summary—namely the combined disk space used by all subdirectories.\
    \ If you want to show the disk usage of a directory (folder) other than the current\
    \ directory, you simply put that directory name as the last argument. For example:\
    \ du -h -s images, where \"images\" would be a subid of the current directory.\n"
