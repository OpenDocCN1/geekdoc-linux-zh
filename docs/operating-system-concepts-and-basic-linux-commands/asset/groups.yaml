    \ for $i = 0, 1, ..., n-1$.\n2. Find an index $i$ such that:\n    a. $Finish[i]\
    \ == false$\n    b. $Need \\leq Work$\n   If no such $i$ exists, go to step 4.\n\
    3. $Work = Work + Allocation[i]$; $Finish[i] = true$; Go to step 2.\n4. If $Finish[i]\
