    ## 5.12 vi Editor:


    The first version of vi was written in 1976 by Bill Joy, a University of California
    at Berkley student who later went on to co-found Sun Microsystems. vi derives
    its name from the word “visual,” because it was intended to allow editing on a
    video terminal with a moving cursor.


    Vi editor is the original editor used on Unix systems. It uses the console graphics
    to emulate a text-editing window, allowing you to visually see the lines of your
    file, move around within the file, and insert, edit, and replace text.


    Most Linux distributions do not include real vi; rather, they ship with an enhanced
    replacement vim which is short for “vi improved” written by Bram Moolenaar. vim
    is a substantial improvement over traditional Unix and is usually symbolically
    linked (or aliased) to the name “vi” on Linux systems. In the discussions that
    follow, we will assume that we have a program called“vi” that is really vim.


    ### 5.12.1 Starting And Stopping vi:


    To start vi, we simply type the following:


    ```

    [aditi@localhost/aditi]$vi

    ```


    And a screen like this should appear:


    ~~~ VIM - Vi Improved

    ~~~ version 7.1.138

    ~~~ by Bram Moolenaar et al.

    ~~~ Vim is open source and freely distributable

    ~~~n Sponsor Vim development!

    ~~~ type: :q<Enter> to exit

    ~~~ type: :help<Enter> or <F1> for on-line help

    ~~~ type: :help version7<Enter> for version info

    ~~~n Running in Vi compatible mode

    ~~~ type: :set ncp<Enter> for Vim defaults

    ~~~ntype: :help cp-default<Enter> for info on the

    ~~~


    To exit, we enter the following command (note that the colon character is part
    of the command):

    :q


    The shell prompt should return. If, for some reason, vi will not quit (usually
    because we made a change to a file that has not yet been saved), we can tell vi
    that we really mean it by adding an exclamation point to the command:

    :q!


    If you get “lost” in vi, try pressing the Esc key twice to find your way again.
    Try running vim instead of vi. If that works, consider adding alias vi=''vim''
    to your shell file.


    ## 5.12.2 Editing Modes:


    Let''s start up vi again, this time passing to it the name of a non existing file.
    This means we are creating a new file with vi: [aditi]@localhost/aditi]$vi first.txt


    If all goes well, we should get a screen like this:


    ![](img/b3f889342bdc020af96a131b08d63774_166_0.png)


    The leading tilde characters (“~”) indicate that no text exists on that line.
    This shows that we have an empty file. Do not type anything yet! The second most
    important thing to learn about vi(after learning how to exit) is that vi is a
    modal editor. When vi starts up, it begins in command mode. In this mode, almost
    every key is a command, so if we were to start typing, vi would basically go crazy
    and make a big mess.


    ## 5.12.3 Insert Mode(Input mode):


    In order to add some text to our file, we must first enter insert mode by pressing
    the “i” key. We should see the following at the bottom of the screen if vim is
    running in its usual enhanced mode.


    ```

    --INSERT--

    ```


    Now we can enter some text. Try this:


    This is the first day of my college.


    To exit insert mode and return to command mode, press the Esc key.


    ## 5.12.4 Saving Our Work:


    To save the change we just made to our file, we must enter an command while in
    command mode. This is easily done by pressing the ":;" key. After doing this,
    a colon character should appear at the bottom of the screen:


    :


    To write our modified file, we follow the colon with a “w” then Enter:


    :w


    The file will be written to the hard drive and we should get a confirmation message
    at the bottom of the screen, like this: "first.txt" [New] 1L, 36C written


    Following table shows the saving and quitting commands.


    | Command | Action |

    | --- | --- |

    | :w | Saves files and remain in editing mode |

    | :x | Saves files and quits editing mode |

    | :wq | Saves files and quits editing mode |

    | :q | Quits editing mode when no change are made to file |

    | :sh | Escape to the shell |


    ## 5.12.5 Moving The Cursor:


    While command mode, vi offers a large number of commands, some of which are given
