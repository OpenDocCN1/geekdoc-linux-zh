    and its address is put in the ith index-block entry.


    Indexed allocation supports direct access, without suffering from external fragmentation,
    because any free block on the disk may satisfy a request for more space.


    Indexed allocation does suffer from wasted space. The pointer overhead of the
    index block is generally greater than the pointer overhead of linked allocation.
    Consider a common case in which we have a file of only one or two blocks. With
    linked allocation, we lose the space of only one pointer per block (one or two
    pointers). With indexed allocation, an entire index block must be allocated, even
