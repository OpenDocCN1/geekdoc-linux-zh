    Operating System Concepts and Basic Linux Commands


    ### 3.10. Memory allocation methods


    The main memory contains both the operating system and the users processes. Following
    are the various memory allocation methods.


    #### 3.10.1 Single Partition allocation


    In this method, the operating system resides in the lower part of the memory,
    and the remaining memory is treated as a single partition. This single partition
    is available for the user''s space. Only a single job can be loaded in this user
    space at time.


    The short term scheduler selects a job from ready queue for execution, and the
    dispatcher loads that job in main memory. The main memory consists of only one
    process at a time, because the user space is treated as a single partition.


    The main disadvantage of this scheme is the memory is not utilized fully. A lot
    of memory is wasted.


    ![](img/b3f889342bdc020af96a131b08d63774_89_0.png)


    Fig. 3.9: Memory allocation for single partition


    #### 3.10.2 Multiple partitioning:


    This method can be implemented in three ways


    - a. Fixed equal multiple partitioning

    - b. Fixed variable multiple partitioning

    - c. Dynamic multiple partitioning


    #### 3.10.2.1 Fixed equal multiple partitioning:


    In this scheme the operating system resides in the low memory and rest of main
    memory is used as user space. The user space is divided into fixed partitions.
    The size of these partitions is depending up on the operating system. For example
    the total memory size is 6MB; 1MB is occupied by the operating system. The remaining
    5MB is partitioned in 5 equal fixed partitions of 1MB each. P1, P2, P3, P4, P5
    are the 5 jobs to be loaded in the main memory, there size is given in the table
    below:


    | Job | size |

    | :--- | :--- |

    | P1 | 450kb |

    | P2 | 1000kb |

    | P3 | 1024kb |

    | P4 | 1500kb |

    | P5 | 500kb |


    ##### Internal and external fragmentation:


    Process partition1 is loaded into partition1. The maximum size of partition1 is
    1024kb, the size of P1 is 450kb. So 1024-450=574kb space is wasted, this wasted
    memory is said to ‘Internal fragmentation’. But there is no enough space to load
    process P4, because the size of process P4 is greater than all the partitions,
    so the entire partition(partition5) is wasted. This wasted memory is said to ‘External
    fragmentation’.


    Therefore the total fragmentation is =(1024-450)+(1024-1000)+(1024-500)=574+24+524=1122kb.


    The external fragmentation is 1024 kb.


    A part of memory wasted within a partition is called internal fragmentation and
    the wastage of an entire partition is called external fragmentation.


    ##### Advantages:


    It supports multiprogramming. Effective utilization of the processor and I/O devices
    is possible.


    ##### Disadvantage:


    It suffers from internal and external fragmentation.


    ![](img/b3f889342bdc020af96a131b08d63774_91_0.png)


    **Fig.3.10: Main memory allocation**


    #### 3.10.2.2 Fixed variable multiple partitioning:


    In this method the user''s space of main memory is divided into number of partitions,
    but partition sizes are different in length. The operating system keep a table
    indicating which partition of memory are available and which are occupied. When
    a process arrives and needs memory, we search for a partition large enough for
    this process. If we find the space large enough to fit the process, allocate the
    partition to that process.


    There are three strategies used to allocate memory in this scheme


    **First-Fit:** It allocates the first partition that is big enough. Searching
    can start either from low memory or high memory. We can stop searching as soon
    as we find a free partition that is large enough.


    **Best-Fit:** It allocates the smallest partition that is big enough. Searching
    can be started from either end of memory, Searches entire memory, and allocates
    the smallest partition that is big enough for the process.


    **Worst-Fit:** Search the entire memory and selects the partition which is largest
    of all.


    For example, assume that we have 4000kb of main memory available, and operating
    system occupies 500kb. The remaining 3500kb of memory is used for user’s processes.


