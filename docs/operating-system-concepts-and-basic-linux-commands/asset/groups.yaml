    开头的波浪字符（“~”）表示该行不存在文本。这表明我们有一个空文件。先不要输入任何内容！学习 vi 的第二要点（学习如何退出之后）是 vi 是一个模式编辑器。当
    vi 启动时，它从命令模式开始。在这种模式下，几乎每个键都是命令，所以如果我们开始打字，vi 基本上会崩溃并搞一团乱。


    ## 5.12.3 插入模式(输入模式):


    为了在文件中添加一些文本，我们必须先按“i”键进入插入模式。如果 vim 以其通常的增强模式运行，我们会在屏幕底部看到：


    ```

    --INSERT--

    ```


    现在我们可以输入一些文本。尝试一下：


    这是我上大学的第一天。


    要退出插入模式并返回命令模式，按 Esc 键。


    ## 5.12.4 保存我们的工作:


    要保存我们刚刚对文件做的更改，我们必须在命令模式下输入命令。这可以通过按下 ":;" 键轻松实现。之后，屏幕底部会出现一个冒号：


    :


    要写入我们修改后的文件，我们在冒号后跟随一个“w”然后按 Enter：


    :w


    文件将被写入硬盘，我们会在屏幕底部收到一条确认消息，如下所示："first.txt" [New] 1L, 36C written


    下表显示了保存和退出命令。


    | 命令 | 动作 |

    | --- | --- |

    | :w | 保存文件并保持编辑模式 |

    | :x | 保存文件并退出编辑模式 |

    | :wq | 保存文件并退出编辑模式 |

    | :q | 当文件未发生更改时退出编辑模式 |

    | :sh | 退出到 shell |


    ## 5.12.5 移动光标:


    在命令模式下，vi 提供了大量的命令，其中一些在下表中给出：


    | 键 | 移动 |

