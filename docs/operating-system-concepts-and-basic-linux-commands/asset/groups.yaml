    Suppose that process P3 requests an instance of resource type R2. Since no resource
    instance is currently available, a request edge P3 $\rightarrow$ R2 is added to
    the graph. At this point, two minimal cycles exist in the system:


    P1 $\rightarrow$ R1 $\rightarrow$ P2 $\rightarrow$ R3 $\rightarrow$ P3 $\rightarrow$
    R2 $\rightarrow$ P1

    P2 $\rightarrow$ R3 $\rightarrow$ P3 $\rightarrow$ R2 $\rightarrow$ P1


    ![](img/b3f889342bdc020af96a131b08d63774_72_0.png)


    Fig. 3.2 Resource-allocation graph with a deadlock.


    Processes P1, P2, and P3 are deadlocked. Process P2 is waiting for the resource
    R3, which is held by process P3. Process P3 is waiting for either process P1 or
    process P2 to release resource R2. In addition, process P1 is waiting for process
    P2 to release resource R1.


    ## 3.2 Conditions for deadlock:


    A deadlock situation can arise if the following four conditions hold simultaneously
    in a system:


    - 1. Mutual exclusion: At least one resource must be held in a non-sharable mode;
    that is, only one process at a time can use the resource. If another process requests
    the resource, the requesting process must be delayed until the resource has been
    released.

    - 2. Hold and wait: A process must be holding at least one resource to acquire
    additional resources that are currently held by other processes.

    - 3. No preemption: Resources cannot be preempted; that is, a resource can be
    released voluntarily by the process holding it, after that process has completed
    its task.

    - 4. Circular wait: a set [P0, P1, ..., Pn] of waiting processes must exist such
    that P0 is waiting for a resource that is held by P1, P1 is waiting for a resource
    that is held by P2, ..., Pn-1 is waiting for a resource that is held by Pn, and
    Pn is waiting for a resource that is held by P0.


    We emphasize that all four conditions must hold for a deadlock to occur. The circular-wait
    condition implies the hold-and-wait condition, so the four conditions are not
    completely independent.


    ## 3.3 Deadlock Prevention:


    For a deadlock to occur, each of the four necessary conditions must hold. By ensuring
    that at least one of these conditions cannot hold, we can prevent the occurrence
    of a deadlock. We elaborate on this approach by examining each of the four necessary
    conditions separately.


    ### 3.3.1 Mutual Exclusion:


    The mutual-exclusion condition must hold for non-sharable resources. For example,
    a printer cannot be simultaneously shared by several processes. Sharable resources,
    in contrast, do not require mutually exclusive access and cannot be involved in
    a deadlock. Read-only files are a good example of a sharable resource. If several
    processes attempt to open a read-only file at the same time, they can be granted
    simultaneous access to the file. A process never needs to wait for a sharable
    resource. In general, however, we cannot prevent deadlocks by denying the mutual-exclusion
    condition, because some resources are intrinsically non-sharable.


    ### 3.3.2 Hold and Wait


    To ensure that the hold-and-wait condition never occurs in the system, we must
    guarantee that, whenever a process requests a resource, it does not hold any other
    resources. One protocol that can be used requires each process to request and
    be allocated all its resources before it begins execution.


    An alternative protocol allows a process to request some resources only when it
    has none. A process may request some resources and use them. Before it can request
    any additional resources, however, it must release all the resources that it is
    currently allocated.


    To illustrate the difference between these two protocols, consider a process that
    copies data from a DVD drive to a file on disk, stores the file, and then prints
    the results to a printer. If all resources must be requested at the beginning
    of the process, then the process must initially request the DVD drive, disk file,
    and printer. The second method allows the process to hold the printer for its
    entire execution, even though it needs the printer only at the end. The second
    method to request initially only the DVD drive and disk file. It copies from the
    DVD drive to the disk and then releases both. Both methods have two disadvantages.
    First, resource utilization may be low, since a process may hold resources for
    a long period. Second, starvation is possible.


    ### 3.3.3 No Preemption:


    The third necessary condition for deadlocks is no preemption. To ensure that this
    condition does not hold, we can use the following: if a process is holding some
    resources and requests another, we check whether they are available. If so, we
    allocate the new resources. If they are not, the process must release all resources
    that is currently holding.


    ### 3.3.4 Circular Wait:


    The fourth and final condition for deadlocks is the circular-wait. One way to
    ensure that this condition never holds is to give each resource type a unique
    number, which allows us to compare two resources. To illustrate, we let $R=\{R1,
    R2, ..., Rm\}$ be the set of resource types. We define a one-to-one function $F:
    R \rightarrow N$, where $N$ is the set of natural numbers. For example, if the
    set of resource types includes tape drives, disk drives, and printers, then:


    $F(tape\ drive) = 1$

    $F(disk\ drive) = 5$

    $F(printer) = 12$


    We can now consider the following protocol to prevent deadlocks: Each process
    can request resources only in an increasing order of enumeration. That is, a process
    can initially request any number of instances of a resource type $Ri$. After that,
    the process can request instances of resource type $Rj$ if and only if $F(Rj)
    > F(Ri)$. If several instances of the same resource type are needed, a single
    request for all of them must be issued. For example, using the function defined
    previously, a process that wants to use the tape drive and printer at the same
    time must first request the tape drive and then the printer. Alternatively, we
    can require that, whenever a process requests an instance of resource type $Rj$,
    it has released any $Ri$ such that $F(Ri) \geq F(Rj)$. If these two protocols
    are used, then the circular-wait condition cannot hold.


    ## 3.4 Deadlock Avoidance


    The simplest and most useful model requires that each process declare the maximum
    number of resources of each type it may need. Given this a priori information,
    it is possible to construct an algorithm that ensures the system will never enter
    a deadlocked state. Such an algorithm defines the deadlock-avoidance approach
    dynamically examines the resource-allocation state to ensure that a circular-wait
    condition can never exist. The resource-allocation state is defined by the number
    of available and allocated resources and the maximum demands of the processes.
    In the following sections we explore two deadlock avoidance algorithms.


    **Safe state:** A state is *safe* if the system can allocate resources each process
    (up to its maximum) in some order and still avoid a deadlock.


    A system is in a safe state only if there exists a **safe sequence**. A sequence
    of processes <P1, P2,...,Pn> is a safe sequence for the current allocation state
    if, for each *Pi*, the resource requests that *Pi* can be satisfied by the currently
    available resources held by all *Pj*, with *j < i*.

