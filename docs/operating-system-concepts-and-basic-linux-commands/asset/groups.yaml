    \n![](img/b3f889342bdc020af96a131b08d63774_77_0.png)\n\n**图 3.3: 安全、不安全和死锁状态空间**\n\
    \n## 3.4.1 银行家算法：\n\n这是一种死锁避免算法，之所以这样命名是因为银行从不分配超过可用现金现金。\n\n- **Available (可用)**：一个长度为\
    \ $m$ 的向量，表示每种类型可用资源的数量。如果 $Available[j] = k$，则有 $k$ 个类型 $Rj$ 的资源可用。\n- **Max\
