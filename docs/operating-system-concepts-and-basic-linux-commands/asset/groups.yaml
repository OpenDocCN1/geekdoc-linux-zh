    \ resources, and terminate. When Pi terminates, Pi+1 can obtain its needed resources,\
    \ and so on. If no such sequence exists, then the system state is said to be unsafe.\n\
    \nA safe state is not a deadlocked state. Conversely, a deadlocked state is an\
