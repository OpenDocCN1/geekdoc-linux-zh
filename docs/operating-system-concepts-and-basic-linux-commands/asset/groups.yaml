    # Deadlock:


    In a multiprogramming environment, several processes may compete for a finite
    number of resources. A process requests resources; and if the resources are not
    available at that time, the process enters a waiting state. Sometimes, a waiting
    process is never again able to change state, because the resources it has requested
    are held by other waiting processes. This situation is called a deadlock.


    # 3.1 Resource-Allocation Graph:


    Deadlocks can be described more precisely in terms of a directed graph called
    a system resource-allocation graph. This graph consists of a set of vertices V
    and a set of edges E. The set of vertices V is partitioned into two different
    types of nodes: P={P1, P2, ..., Pn} the set consisting of all the active processes
    in the system, and R={R1, R2,..., Rn} the set consisting of all resource types
    in the system.


    A directed edge from process Pi to resource type Rj is denoted by Pi→Rj;


    It signifies that process Pi has requested an instance of resource type Rj and
    is currently waiting for that resource. A directed edge from resource type Rj
    to process Pi is denoted by Rj→Pi; it signifies that an instance of resource type
    Rj has been allocated to process Pi. A directed edge Pi→Rj is called an assignment
    edge.


    We represent each process Pi as a circle and each resource type Rj may have more
    than one instance, we represent each such instance as a dot within the rectangle.
    The resource-allocation graph shown in Figure depicts the following situation.


    The sets P, R, and £:


    +   • P={P1, P2, P3}


    +   • R={R1, R2, R3, R4}


    +   • £={P1→R1, P2→R3,R1→P2, R2→P2, R2→P1, R3→P3}'
