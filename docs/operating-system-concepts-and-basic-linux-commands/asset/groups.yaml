    # One to one: (One process thread)


    In this approach, the process maintains only one thread, so it is called as single
    threaded approach. MS-DOS operating system supports this type of approach.


    # One to Many :( ( One process, multiple threads


    In this approach a process is divided into number of threads. The best example
    of this is JAVA run time environment.


    # Many to one: (Multiple processes, one thread per process)


    An operating system support multiple user processes but only support one thread
    per process. Best example is UNIX.


    # Many to many: ( Multiple processes, multiple threads per (process)


    In this approach each process is divided into number of threads. Examples are
    Windows 2000, Solaris LINUX.


    There are two main ways to implement threads:


    +   - In user space

    - In Kernel space


    # User level threads:


    This type of threads loaded entirely in user space, the kernel knows nothing about
    them. When threads are managed in user space, each process has its own private
    thread table. The thread table contains information like program counter, registers,
    etc state. When the thread is moved to ready state or blocked state, the information
    needed to restart it is stored in the thread table.


    User threads allow each process to have its own scheduling algorithm. The entire
    process loaded in user space, so the process does not switch to the kernel mode
    to do thread management. User level threads can run on any operating system.


    When user level thread executes a system call, all the threads with in the process
    are blocked. Only a single thread with in a process can execute at a time, so
    multi processing is not implemented.'
