    Save and logout immediately, the system is going down in 5 minutes. Another warning
    will follow in 3 minutes.


    Since wall messages are broadcasted over an entire network, the header indicates
    this with the announcement ‘Broadcast message’. The date and time of broadcast
    are commonly included in the statement.


