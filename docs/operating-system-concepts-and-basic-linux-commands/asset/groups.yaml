    # Summary:


    First-come-first-serve scheduling is the simplest scheduling algorithm, but it
    can cause short jobs to wait for long time. Shortest-Job-first scheduling is provably
    optimal, providing the shortest average waiting time. The shortest job first is
    difficult to implement because it is difficult to predict the length of next CPU
    burst. Shortest-Job-first is special case of general priority scheduling algorithm,
    which simply allocates the CPU to the highest priority process. Both priority
    and Shortest-Job-first scheduling may suffer from starvation. Aging is technique
    to prevent starvation.


    Round-robin scheduling is more appropriate for a time-shared system. Round-robin
    is a preemptive algorithm. FCFS is non-preemptive. Shortest-Job-first and priority
    algorithms may be either preemptive or non-preemptive. Round-robin allocates the
