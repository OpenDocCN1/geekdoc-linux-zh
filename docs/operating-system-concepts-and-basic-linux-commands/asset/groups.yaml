    # 2. Economy of scale.


    Multiprocessor systems can cost less than equivalent multiple single-processor
    systems, because they can share peripherals, mass storage, and power supplies.
    If several programs operate on the same set of data, it is cheaper to store that
    data on one disk and to have all the processors share more than to have many computers
    with local disks and many copies of the data.


    # 3. Increased reliability


    If functions can be distributed properly among several processors, then the failure
    of one processor will not halt the system, only slow down. If we have ten processors
    and one fails, then each of the remaining nine processors can pick up a share
    of the work of the failed processor. Thus, the entire system runs only 10 percent
    slower, rather than failing altogether.


    # E) Multiprogramming System:


    The most important aspect of job scheduling is the ability to multiprogram.  A
    single user cannot, in general, keep either the CPU or the I/O devices busy at
    all times. Multiprogramming increases CPU utilization by organizing jobs so that
    the CPU always has to execute.


    In multiprogramming, single processor can execute number of programs simultaneously.
    In this technique, the physical memory is divided into many partitions, each holding
    a separate program. One of the partitions is holding the operating system.


    As there is only one CPU, only one program could be executed at a time. Operating
    system provides a mechanism to switch the CPU from one program to the next. The
    operating system picks one job from memory and start executing it. Eventually,
    the job may have to wait for a command to be typed on a keyboard, or I/O operations
    to complete. In a non-multiprogramming system (uniprogramming system) CPU becomes
    idle. But in multiprogramming system, the operating system will simply switch
    to another job in the main memory and start executing it. When that job needs
    to wait, the CPU is switched to another job and so on. Eventually the first job
    will have finished


