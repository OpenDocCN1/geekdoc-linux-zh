    ## Process & Threads


    ## Introduction


    A process is an instance of an application execution. The application may be a
    program written by a user, or a system application. Users may run many instances
    of the same application at the same time, or run many different applications.
    Each such running application is a process. The process only exists for the duration
    of executing the application.


    A user may be able to run several programs at one time: a word processor, a Web
    browser and an e-mail package. And even if the user can execute only one program
    at a time, the operating system may need to support its own internal programmed
    activities, such as memory management. In many respects, all activities are similar,
    so we call all of them processes.


    A thread is part of a process. It represents the actual flow of the computation
    being done. Each process must have at least one thread. Multithreading is also
    possible, where several threads execute within the context of the same process,
    by running different instructions from the same application.


    ## 2.1 Process concept


    Early computer systems allowed only one program to be executed at a time. This
    program had complete control of the system and had access to all the system''s
    resources. In contrast, current-day computer systems allow Multiple programs to
    be loaded into memory and executed concurrently.


    This evolution required firmer and more compartmentalization of the various programs;
    and these needs resulted in the notion of a process/ which is a program in execution.
    A process is the unit of work in a modern time-sharing system.


    A system consists of a collection of processes. An operating system processes
    executing system code and user processes executing user code. Potentially/ all
    these processes can execute concurrently with the CPU (or CPUs) multiplexed among
    them. By switching the CPU between processes, the operating system can make the
    computer more productive.


    ## Operating System Concepts and Basic Linux Commands


    ## 2.2 Process:


    A process is a program in execution. A process is more than the program code,
    which is sometimes known as the text section. It also includes the current activity,
    as represented by the value of the program counter and the contents of the processor''s
    registers. A process generally includes the process stack, which contains temporary
    data (such as function parameters, return addresses, and local variables), and
    a data section, which contains global variables. A process may also include a
    heap, which is memory that is dynamically allocated during process time.


    A program by itself is not a process; a program is a passive entity, such as a
    file containing a list of instructions stored on disk, whereas a process is an
    active entity, with a program counter specifying the next instruction to execute
    and a set of associated resources.


    ### 2.2.1 Process control block:


    Each process is represented in the operating system by a process control block
    (PCB)—also called a task control block. It contains many pieces of information
    associated with a specific process, including these:


    - Process state: the state may be new, ready, running, waiting, halted, and so
    on.

    - Program counter: the counter indicates the address of the next instruction to
    be executed for this process.

    - CPU registers: the registers vary in number and type, depending on the computer
    architecture. They include accumulators, index registers, stack pointers, and
    general-purpose registers, plus any condition-code information. Along with the
    program counter, this state information must be saved when an interrupt occurs.

    - CPU-scheduling information: this information includes priority, pointers to
    scheduling queues.

    - Memory-management information: this information may include base and limit,
    page tables, segment tables.

    - Accounting information: this information includes the amount of CPU used, time
    limits, process numbers.

    - I/O status: this information includes the list of I/O devices allocated to the
    process, open files.


    | Process state | Program counter |

    | :--- | :--- |

    | Registers | Memory limits |

    | List of open files | ... |


    ### 2.2.2 Process State:


    As a process executes, it changes state. The state of a process is defined in
    part by the current activity. Each process may be in one of the following states:


    - New: the process is being created.

    - Running: Instructions are being executed.

    - Waiting: the process is waiting for some event, as I/O completion.

    - Ready: the process is waiting to be assigned to a processor.

    - Terminated: the process has finished execution.


    ## Operating System Concepts and Basic Linux Commands


    These names are arbitrary, and they vary across operating systems. The states
    that they represent are found on all systems, however. Certain operating systems
    more finely delineate process states. It is important to realize that only one
    process can be running on any instant. Many processes may be ready and waiting,
    however. The state diagram corresponding to these states is presented in following
    figure.


    ![](img/b3f889342bdc020af96a131b08d63774_43_0.png)


    Fig: 2.2 Process State


    **New → Ready:** The operating system creates a process and prepare the process
    to be executed, then the operating system moved the process into Ready state.

    **Ready → Running:** The operating system selects one of the job from the ready
    queue and move the process from ready state to running state.

    **Running → Terminated:** When the execution of a process has completed, then
    the operating system terminates that process from running state. Sometimes operating
    system terminates the process due to some other reasons like memory unavailable,
    access violation, protection error, I/O failure, data misuse and so on.


    **Running → Ready:** When the time slot of the processor expired, or if the processor
    received any interrupt signal, then the operating system shifts running process
    to ready state.


    **Running → Waiting:** A process is put in the waiting state, if the process needs
    an event occurs, or an I/O device require. the operating system does not provide
    the I/O or event immediately then the process moved to waiting state when the
    event for which it has been waiting occurs.


    **Waiting → Ready:** A process in the blocked state is moved to the ready state
    when the event for it has been waiting occurs. For example a process is in running
    state need an I/O device. Then the process moved to the blocked or waiting state,
    when the I/O device provided by the operating system the process moved to ready
    state from waiting or blocked state.


