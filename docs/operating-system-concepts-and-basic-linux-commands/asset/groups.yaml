    \ to the blocked or waiting state, when the I/O device provided by the operating\
    \ system the process moved to ready state from waiting or blocked state.\n\n#\
    \ 2.3 Operations on Processes:\n\n# 2.3.1 Create a new Process:\n\nThe main operation\
    \ on processes is to create a new one. The “process create” can be used to create\
