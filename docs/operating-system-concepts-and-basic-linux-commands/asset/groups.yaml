    # File System & Introduction To Linux Operating System


    ## File system:


    The file system is the most visible aspect of an operating system. It provides
    the mechanism for on-line storage of and access to both data and programs of the
    operating system and all the users of the computer system. The file system consists
    of two distinct parts: a collection of files, each storing related data, and a
    directory structure, which organizes and provides information about all the files
    in the system.


    ## 4.1 File Concept:


    File management is one of the most visible services of an operating system. Computer
    can store information in several different physical forms; magnetic tape, disk,
    optical disk are the most common forms. Each of these devices has its own characteristics
    and physical organization. The operating system abstracts from the physical properties
    of its storage devices to define a logical storage unit, the file. Files are mapped
    by the operating system onto physical devices. These storage devices are usually
    nonvolatile, so the contents are persistent through power failures and system
    reboots.


    A file is a named collection of related information that is recorded on secondary
    storage. Data cannot be written to secondary storage unless they are within a
    file. Commonly, files represent programs (both source and object forms) and data.
    Data files may be numeric, alphabetic, alphanumeric, or binary. Files may be free
    form, such as text files, or may be formatted rigidly. In general, a file is a
    sequence of bits, bytes, lines, or records, the meaning of which is defined by
    the file''s creator and user.


    The information in a file is defined by its creator. Many different types of information
    may be stored in a file—source programs, object programs, executable programs,
    numeric data, text, payroll records, graphic images, sound recordings, and so
    on. A file has a certain defined structure, which depends on its type. A text
    file is a sequence of characters organized into lines (and possibly pages). A
    source file is a sequence of subroutines and functions, each of which is further
    organized as declarations followed by executable statements. An object file is
    a sequence of bytes organized into blocks understandable by the system''s linker.
    An executable file is a series of code sections that the loader brings into memory
    and execute.


    Operating System Concepts and Basic Linux Commands


    ## 4.2 File Attributes


    A file is named, for the convenience of its human users, and is referred to by
    its name. A name is usually a string of characters, such as ''em.c''. Some systems
    differentiate between uppercase and lowercase characters in names, whereas other
    systems do not. When a file is named, it becomes independent of the process, the
    user, and even the system that created it. The information about all files is
    kept in the directory structure, which also resides on secondary storage.


    A file has other attributes, which vary from one operating system to another but
    typically consist of these:


    - **Name:** The symbolic file name is the only information kept in human readable
    form.

    - **Identifier:** This unique tag, usually a number, identifies the file within
    the system; it is the non-readable name for the file.

    - **Type:** This information is needed for those systems that support different
    types of files.

    - **Location:** This information is a pointer to a device and to the location
    of the file on that device.

    - **Size:** The current size of the file (in bytes, words, or blocks) and possibly
    the maximum allowed size is included in this attribute.

    - **Protection:** Access-control information determines who can do so reading,
    writing, executing, and so on.

    - **Time, date, and user identification:** This information may be kept for creation,
    last modification, and last use. These data can be useful for protection, security,
    and usage monitoring.


    ## 4.3 Operations on Files:


    A file is an **abstract data type**. The basic operation performed on files are
    create file, write to a file, read a file, reposition a file, delete a file. The
    operating system can provide system calls to perform all these operations.


    - **Creating a file:**

    Two steps are necessary to create a file. First, space in the file system must
    be found for the file. Second, an entry for the new file must be made in the directory.
    The directory entry records the name of the file, its location in the file system,
    and possibly other information.


    - **Writing a file:**

    To write a file, we make a system call specifying both the name of the file and
    the information to be written to the file. Given the name of the file, the system
    searches the directory to find the file''s location. The directory entry will
    need to store a pointer to the current end of the file. Using this pointer the
    address of the next block can be computed and the information can be written.
    The write pointer must be updated.


    - **Reading a file:**

    To read from a file, we use a system call that specifies the name of the file
    and memory location where the next block of the file should be put. Again the
    directory is searched for the associated directory entry. And again the directory
    will need a pointer to the next block to be read. Once that block is read, the
    pointer is updated. A given process is usually only reading or writing a given
    file, and the current operation location is kept as a per-process current-file-position
    pointer. Both the read and write operations use this same pointer, saving space
    and reducing the system complexity.


    - **Repositioning within a file:**

    The directory is searched for the appropriate entry, and the current-file-position
    pointer is set to a given value (given position).


    - **Deleting a file:**

    To delete a file, we search the directory for the appropriate entry, release the
    space, and erase the directory entry.


    Operating System Concepts and Basic Linux Commands


    ## 4.4 Types of files:


    A common technique for implementing file types is to include the type in the name.
    Some systems use an extension to tell what the file is. For example, MSDOS recognizes
    only a few extensions, but application programs use extensions to indicate the
    type. Following shows some types:


    | file type | usual extension | function |

    |---|---|---|

    | executable | exe, com, bin | ready-to-run machine program |

    | object | obj, o | compiled, machine language, not linked |

    | source code | c, cc, java, pas, asm, a | source code in various languages |

    | batch | bat, sh | commands to the command interpreter |

    | text | txt, doc | textual data, documents |

    | word processor | wp, tex, rtf, doc | various word-processor formats |


    | file type | usual extension | function |

    |---|---|---|

    | library | lib, a, so, dll | libraries of routines for programmers |

    | print or view | ps, pdf, jpg | ASCII or binary file in a format for printing
    or viewing |

    | archive | arc, zip, tar | related files grouped into one file, sometimes compressed,
    for archiving or storage |

    | multimedia | mpeg, mov, rm | binary file containing audio or A/V |


    ## 4.5 Access Methods:


    Files store information. When it is used, this information must be accessed and
    read into computer memory. The information in the file can be accessed in several
    ways. Some systems provide only one access method for files. Other systems, such
    as those of IBM, support many access methods, and choosing the right one for a
    particular application is a major design problem.


    ### 4.5.1 Sequential access method:


    The simplest access method is sequential access. Information in the file is processed
    in order, one record after the other. Reads and writes make up the bulk of the
    operations on a file. A read operation reads the next portion of the file and
    automatically advances a file pointer, which tracks the I/O location. Similarly,
    a write appends to the end of the file and advances to the end of the newly written
    material (the new end of file). Such a file can be reset to the beginning; and
    on some systems, a program may be able to skip forward or backward n records,
    for some integer n—perhaps for n = 1. Sequential access, which is depicted in
    figure, is only based on a tape model of file and works well on sequential-access
    devices as it does on random-access ones.

