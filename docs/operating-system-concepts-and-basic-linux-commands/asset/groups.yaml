    # 3.16.2 Optimal page-replacement algorithm:


    One result of the discovery of Belady''s anomaly was the search for an optimal
    page-replacement algorithm. An optimal page-replacement algorithm has the lowest
    page-fault rate of all algorithms and will never suffer from Belady''s anomaly.
    Such an algorithm does exist, and has been called OPT or MIN. It is simply this:


    +   Replace the page that will not be used for the longest period of time.


    +   Use this page-replacement algorithm guarantees the lowest possible page-fault
    rate for a fixed number of frames.


    For example, on our sample reference string, the optimal page-replacement would
    yield nine page faults, as shown in following figure. The first three references
    cause faults that fill the three empty frames. The reference to page 2 replaces
    pages 7, because 7 will not be used until reference 18, whereas page 0 will be
    used at 5, and page 1 at 14. The reference to page 3 replaces pages 3 again, as
    page 1, page 1 and 1will be the last of the three pages in memory to be referenced
    again. With only nine page faults, optimal replacement is much better than a FIFO
    algorithm, which had 15 faults.


    ![](img/b3f889342bdc020af96a131b08d63774_109_0.png)


    Fig.3.26: Optimal page-replacement algorithm


    Unfortunately, the optimal page-replacement algorithm is difficult to implement,
    because it requires future knowledge of the reference string. As a result, the
    optimal algorithm is used mainly for comparison studies.'
