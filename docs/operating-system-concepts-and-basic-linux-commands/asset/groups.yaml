    The file system is the most visible aspect of an operating system. It provides
    the mechanism for on-line storage of and access to both data and programs of the
    operating system and all the users of the computer system. The file system consists
    of two distinct parts: a collection of files, each storing related data, and a
    directory structure, which organizes and provides information about all the files
    in the system.


    # 4.1 File Concept:


    File management is one of the most visible services of an operating system. Computer
    can store information in several different physical forms; magnetic tape, disk,
    optical disk are the most common forms. Each of these devices has its own characteristics
    and physical organization. The operating system abstracts from the physical properties
    of its storage devices to define a logical storage unit, the file. Files are mapped
    by the operating system onto physical devices. These storage devices are usually
    nonvolatile, so the contents are persistent through power failures and system
    reboots.


