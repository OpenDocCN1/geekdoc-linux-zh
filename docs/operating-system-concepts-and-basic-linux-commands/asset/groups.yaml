    Operating System Concepts and Basic Linux Commands


    ## H) Parallel Processing System:


    The parallel processing is the simultaneous use of more than one CPU or processor
    core to execute a program or multiple computational threads. Ideally, parallel
    processing makes programs run faster because there are more engines (CPUs or Cores)
    running it. In general, parallel processing means more than one microprocessors
    handles parts of an overall task. A computer scientist divides a complex problem
    into component parts using special software specifically designed for the task.
    He or she assigns each component part to a dedicated processor. Each processor
    solves its part of the overall computational problem. The software reassembles
    the data to reach the end conclusion of the original complex problem.


    Parallel computing is a form of computation in which many calculations are carried
    out simultaneously, operating on the principle that large problems can be divided
    into smaller ones, which are then solved concurrently ("in parallel"). With single-CPU,
    single-core computers, it is possible to perform parallel processing by connecting
    the computers in a network. However, this type of parallel processing requires
    very sophisticated software called distributed processing software. Parallel processing
    is also called parallel computing. The term parallel processing is used to represent
    a large class of techniques which are used to provide simultaneous data processing
    tasks for the purpose of increasing the computational speed of a computer system.


    Note that parallelism differs from concurrency. Concurrency is a term used in
    the operating systems and databases communities which refers to the property of
    a system in which multiple tasks remain logically active and make progress at
    the same time by interleaving the execution order of the tasks and creating thereby
    illusion of simultaneously executing instructions. Parallelism, on the other hand,
    is a term typically used by the supercomputing community to describe executions
    that physically execute simultaneously with the goal of solving a problem in less
    time or solving a larger problem in the same time. Parallelism exploits concurrency.


    ## Advantage of Parallel Processing System:

    - Faster execution time, so higher throughput.


    ## Disadvantage of Parallel Processing System:

    - More hardware required, also more power requirements. Not good for low power
    and mobile devices.


    ![](img/b3f889342bdc020af96a131b08d63774_34_0.png)


    Fig: 1.13 Parallel Processing


    ## I) Distributed system:


    A distributed system consists of multiple Computers that communicate through a
    computer network. The computers interact with each other in order to achieve a
    common goal. A computer program that runs in a distributed system is called a
    distributed program, and distributed programming is the process of writing such
    programs. A problem is divided into many tasks, each of which is solved by one
    or more computers, which communicate with each other by Message passing to In
    networks individual computers were physically distributed within some geographical
    area. There are several autonomous computational entities, each of which has its
    own local Memory. The entities communicate with each other by Message passing.


    Distributed systems are groups of networked computers, which have the same goal
    for their work. The processors in a typical distributed system run concurrently
    in parallel.


    Parallel computing may be seen as a particular tightly coupled form of distributed
    computing, and distributed computing may be seen as a loosely coupled form of
    parallel computing. Nevertheless, it is possible to roughly classify concurrent
    systems as "parallel" or "distributed" using the following criteria:


    - In parallel computing, all processors may have access to a shared memory to
    exchange information between processors.

    - In distributed computing, each processor has its own private memory (Distributed
    memory). Information is exchanged by passing messages between the processors.


    There are two main reasons for using distributed systems and distributed computing.
    First, the very nature of the application may require the use of a communication
    network that connects several computers. For example, data is produced in one
    physical location and it is needed in another location.


    Second, there are many cases in which the use of a single computer would be possible
    in principle, but the use of a distributed system is beneficial for practical
    reasons. For example, it may be more cost-efficient to obtain the desired level
    of performance by using a Cluster of several low-end computers, in comparison
    with a single high-end computer. A distributed system can be more reliable than
    a non-distributed system, as there is no single point of failure. Moreover, a
    distributed system may be easier to expand and manage a monolithic uniprocessor
    system.


    Examples of distributed systems and applications of distributed computing include
    the following:


    - Telecommunication networks, telephone networks, cellular networks, computer
    networks(Internet), wireless sensor networks, distributed database, network file
    system, world wide web, peer to peer network, Distributed information processing
    systems such as banking systems and airline reservation systems, Real-time process
    control.


    ![](img/b3f889342bdc020af96a131b08d63774_36_0.png)


    Fig: 1.14 Distributed system.


    ## J) Clustered Systems:


    Like parallel systems, clustered systems gather together multiple CPUs to accomplish
    computational work. Clustered systems differ from parallel systems, however, in
    that they are composed of two or more individuals systems coupled together. The
    definition of the term clustered is not concrete; many commercial packages wrestle
    with what a clustered system is and why one form is better than another. The generally
    accepted definition is that clustered computers share storage and are closely
    linked via LAN networking.


    Clustering is usually used to provide high-availability service; that is, service
    will continue to be provided even if one or more systems in the cluster fail.


    Clustering can be structured asymmetrically or symmetrically. In asymmetric clustering,
    one machine is in hot-standby mode while the other is running the applications.
    The hot-standby host machine does nothing but monitor the active server. If that
    server fails, the hot-standby host becomes the active server. In symmetric mode,
    two or more hosts are running applications, and they are monitoring each other.
    This mode is obviously more efficient, as it uses all of the available hardware.
    It does require more than one application to be able to run.


    Other forms of clusters include parallel clusters and clustering over a WAN. Parallel
    clusters allow multiple hosts to access the same data on shared storage. Most
    operating systems lack support for simultaneous data access by multiple hosts,
    parallel clusters are usually accomplished by use of special versions of software
    and special releases of applications. For example, Oracle Parallel Server is a
    version of Oracle''s database that has been designed to run on a parallel cluster.
    Each machine runs Oracle, and a layer of software tracks access to the shared
    disk. Each machine has full access to data in the database. The system must also
    supply access control and locking to ensure that no conflicting operations occur.
    This function, commonly known as a distributed lock manager (DLM), is included
    in some cluster technology.


    ## K) Real Time System:


    The real time operating system is often used as a control device in a dedicated
    application. Sensor brings data to the computer. The computer must analyze the
    data and possibly adjust controls to modify the sensor inputs. System which controls
    scientific experiments, medical computer systems, industrial control systems,
    and some display systems are real time systems. A real time system has well defined
    fixed time constraints. Processing must be done within the defined constraint
    or the system will fail.


    To be considered "real-time", an operating system must have a known maximum time
