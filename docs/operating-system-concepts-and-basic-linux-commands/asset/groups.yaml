    14 块，然后读取第 53 块，最后写入第 7 块。直接访问文件对读取或写入的顺序没有限制。直接访问文件对于立即访问大量信息非常有用。数据库通常是这种类型。当关于某个特定主题的查询到达时，我们计算出哪个块包含答案，然后直接读取该块以提供所需的信息。


