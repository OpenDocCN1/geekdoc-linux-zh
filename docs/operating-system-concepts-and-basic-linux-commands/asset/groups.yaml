    Designing a multiprocessor system is more difficult than designing a single processor
    system. Multiprocessor systems have three main advantages:


    +   1. Increased throughput.

    By increasing the number of processors, we expect to get more work done in less
    time. The speed-up ratio with $N$ processors is not $N$; however; rather, it is
    less than $N$. When multiple processors cooperate on a task, a certain amount
    of overhead is incurred in keeping all the parts working correctly. This overhead,
    plus contention for shared resources, lowers the expected gain from additional
    processors. Similarly, $N$ programmers working together do not produce $N$ times
    the amount of work a single programmer would produce.'
