    Fig.4.9 Two level directory structure.


    ## 4.8.3 Tree-Structured Directories:


    Once we have seen how to view a two-level directory as a two-level tree, the natural
    generalization is to extend the directory structure to a tree of arbitrary height.
    This generalization allows users to create their own subdirectories and to organize
    their files accordingly. The MS-DOS system, for instance, is structured as a tree.
    In fact, a tree is the most common directory structure. The tree has a root directory,
    and every file in the system has a unique path name. A path name is the path from
    the root, through all the subdirectories, to a specified file.


    A directory (or subdirectory) contains a set of files or subdirectories. A directory
    is simply another file, but it is treated in a special way. All directories have
    the same internal format. One bit in each directory entry defines the entry as
    a file (0) or as a subdirectory (1). Special system calls are used to create and
    delete directories.


    Path names can be of two types: absolute path names or relative path names. An
    absolute path name begins at the root and follows a path down to the specified
    file, giving the directory names on the path. A relative path name defines a path
    from the current directory. For example, in the tree-structured file system of
    Figure 4.9, if the current directory is root/spell/mail, then the relative path
    name prt/first refers to the same file as does the absolute path name root/spell/mail/prt/first.


    ![](img/b3f889342bdc020af96a131b08d63774_131_0.png)


    Fig.4.10: Tree-structured directory structure


    ## 4.8.4 Acyclic-Graph Directories


    Consider programmers who are working on a joint project. The files associated
    with that project can be stored in a subid, separating them from other projects
    and files of the two programmers. Since both programmers are equally responsible
    for the project, both want the subdirectory to be in their own directories. The
    common subdirectory should be shared. A shared directory or file will exist in
    the file system in two (or more) places at once.


    An acyclic graph—that is, a graph with no cycles—allows directories to share subdirectories
    and files (Figure 4.11). The same file or sub-directory may be in two different
    directories. The acyclic graph is a natural generalization of the tree-structured
    directory scheme.


    It is important to note that a shared file (or directory) is not the same as two
    copies of the file. With two copies, each programmer can view the copy rather
    than the original, but if one programmer changes the file, the changes will not
    appear in the other''s copy. With a shared file, only one actual file exists,
    so any changes made by one person are immediately visible to the other. Sharing
    is particularly important for subdirectories; a new file created by one person
    will automatically appear in all the shared subdirectories.


    ![](img/b3f889342bdc020af96a131b08d63774_132_0.png)


    Fig.4.11 Acyclic graph structure.


    ## 4.8.5 General Graph Directory


    A serious problem with using acyclic-graph is ensuring there are no cycles. If
    we start with tree-structured directory and allow links to existing tree-structured
    directory, it should be easy to see. However, when we add links to existing tree-structured
    directory, it results in cycles.


    ![](img/b3f889342bdc020af96a131b08d63774_133_0.png)


    Fig.4.12 Graph structure


    ## LINUX OPERATING SYSTEM


    In 1991, Linus Torvalds wrote the first version of Linux. Linux is used for wider
    variety of hardware including desktop computers, supercomputers, mainframes, and
    embedded devices such as cell phones. The center of the Linux operating system
    is the kernel. The kernel is the piece of software that provides an interface
    between user and computer hardware and is responsible for maintaining the file
    system, executing commands, starting programs, timing system activities and managing
    system memory and other resources.


    Shell is a command interpreter. It translates the user commands given at the command
    prompt into kernel readable format.


    Utility programs are different application programs through which users can interact
    with computer system, this consist of database system, video games, business programs
    etc depending on interest.


    ![](img/b3f889342bdc020af96a131b08d63774_134_0.png)


    Fig.4.13 Structure of operating system


    ## 4.10 Logging In And Logging Out:


    Logging into a Linux account involves two steps:


    - i) Entering your user name

    - ii) Entering your password


    Type the user name for your user account. If you make a mistake, you can erase
    characters with the BACKSPACE key. Consider the following example, the user enters
    the aditi and is then prompted to enter the password:


    ```

    turtle login: aditi

    password:

    ```


    When you type in password, it does not appear on the screen. This is to protect
    password from being seen by others. If user enters either the username or the
    password incorrectly, the system will respond with the error message “Login incorrect”
    and will ask for username again, starting the login process over. User can then
    reenter username and password.


    Once username and password entered correctly, user is logged to the system. User’s
    command line prompt is displayed, waiting for user to enter a command. The command
    line prompt is a dollar sign ($) not a number sign (#).


    The $ is the prompt for regular users, and the # is the prompt for the root user.
    The prompt is preceded by the hostname and the current user directory bounded
    by a set of brackets.


    ```

    [turtle/home/aditi]$

    ```


    To end the session logout or exit commands are used. This returns to the login
    prompt and Linux waits for another user to log in.

