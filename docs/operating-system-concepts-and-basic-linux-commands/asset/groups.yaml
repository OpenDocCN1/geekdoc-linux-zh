    The average waiting time is now (6 + 0 + 3)/3 = 3 milliseconds. This reduction
    is substantial. Thus, the average waiting time under an FCFS policy is generally
    not minimal and may vary substantially if the processes CPU burst times vary greatly.


    Consider the performance of FCFS scheduling in a dynamic situation. Assume we
    have one CPU-bound process and many I/O-processes. The CPU-bound process will
    get and hold the CPU. During this time, all the other processes will finish their
    I/O and move into the ready queue, waiting for the CPU. While the processes wait
    in the ready queue, the I/O devices are idle. Eventually, the CPU-bound process
    finishes its CPU burst and moves to an I/O device. All have short CPU bursts,
    execute quickly and move back to the I/O queues. At this point, the CPU sits idle.
    The CPU-bound process will then move back to the ready queue and be allocated
    the CPU. Again, all the I/O processes end up waiting in the ready queue until
    the CPU-bound process is done. There is a convoy effect as all the other processes
    wait for the one big process to get off the CPU. This effect results in lower
    CPU and I/O device utilization than might be possible if the shorter processes
    were allowed to go first.


    The FCFS scheduling algorithm is non-preemptive. Once the CPU has been allocated
    to a process, that process keeps the CPU until it releases it by terminating or
    by requesting I/O. The FCFS algorithm is thus particularly troublesome for time-sharing
    systems, where it is important that each user get a share of the CPU at regular
    intervals.


    ## 2.9.2 Shortest-Job-First Scheduling:


    In this approach the CPU is allocated to the process having the shortest CPU burst.
    When the CPU is available, it is assigned to the process that has the smallest
    next CPU burst. If the next CPU bursts of two processes are the same, FCFS scheduling
    is used to break the tie.


    As an example of SJF scheduling, consider the following of processes arrive at
    time 0, with the length of the CPU burst given in milliseconds:


    | Process | Burst Time |

