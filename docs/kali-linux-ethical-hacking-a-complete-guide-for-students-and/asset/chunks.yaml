    这本书不仅教你如何使用黑客工具，还探讨了行使这些技能时伦道德和责任的重要性。道德黑客攻击需要的不仅仅是技术知识——还需要强烈的诚信感以及对保护系统和数据的坚定承诺。


    # 你将在本书中读到什么


    在整本书中，你将获得书中详尽且结构化的内容，以帮助你对 `Kali Linux` 进行道德黑客攻击有全面的理解。以下我们重点介绍了将涵盖的主要主题：


