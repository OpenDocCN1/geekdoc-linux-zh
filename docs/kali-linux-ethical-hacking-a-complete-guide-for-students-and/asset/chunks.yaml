    2. **渗透测试方法论**：本章将探索渗透测试生命周期的各个阶段，从侦察到利用再到后渗透。还将讨论在渗透测试的每个阶段将使用的必备工具。

    3. **识别与信息收集**：你将学习如何使用 `Nmap` 和 `Recon-ng` 等工具进行被动和主动的信息收集技术。还将讨论自动化脚本以促进并加速这一过程。

    4. **漏洞分析**：发现如何使用 `OpenVAS` 和 `Nessus` 等强大的工具来识别和分类漏洞。本章对于理解系统如何被破坏以及如何防止此类破坏至关重要。

    5. **漏洞利用**：在本章中，你将学习使用 `Metasploit`（`Kali Linux` 中此类用途最流行的工具之一）进行手动和自动利用技术。我们还将涵盖如何开发自定义脚本进行探索。

    6. **道德黑客攻击中的社会工程学**：社会工程是破解系统最有效的技术之一。在这里，我们将探索如何模拟社会工程和钓鱼攻击，以及如何自动化这些活动。

    7. **无线网络攻击**：了解无线安全的基础知识，以及如何使用 `Aircrack-ng` 等工具执行诸如 `WEP/WPA` 破解等常见攻击。

