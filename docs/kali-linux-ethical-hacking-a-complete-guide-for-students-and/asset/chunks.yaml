    # Chapter 1: Introduction to Ethical Hacking


    ***


    Ethical Hacking is a fundamental discipline in the field of cybersecurity. It
    consists of the practice of penetration testing and other security activities
    conducted in an ethical and legal manner, with the aim of identifying, correcting
    and mitigating vulnerabilities in systems and networks. The main difference between
    ethical hacking and malicious hacking is intent. While the malicious hacker, or
    “black hat,” acts with the aim of causing damage, stealing information or compromising
    the integrity of systems, the ethical hacker, also known as “white hat,” seeks
    to protect and strengthen the security of systems.


    ## Definition and Principles of Ethical Hacking


    Ethical Hacking can be defined as the authorized practice of accessing computer
    systems, applications and data in such a way that vulnerabilities and security
    weaknesses can be identified. This practice is performed with the consent of the
    system owner and is an integral part of any organization''s security efforts.
    The main objective is to ensure that security flaws are discovered and fixed before
    malicious hackers can exploit them.


    The principles that guide Ethical Hacking are based on three fundamental pillars:


    1. **Legality**: The ethical hacker always obtains explicit permission before
    carrying out any penetration testing or activity that involves accessing systems,
    networks or data. Legal authorization is a crucial difference that distinguishes
    ethical hacking from malicious hacking.

    2. **Confidentiality**: Any and all data obtained during the ethical hacking process
    must be treated with extreme confidentiality. An ethical hacker has the responsibility
    to protect information and ensure that none of it is disclosed or misused.

    3. **Integrity and Responsibility**: The ethical hacker must always act with integrity,
    documenting all actions taken and reporting discovered vulnerabilities to the
    system owner in a transparent manner. Responsibility involves not only identifying
    vulnerabilities, but also proposing solutions to mitigate them.

