    11. **本地网络入侵测试**：学习如何使用专业技术和工具映射并破解内部网络。还将涉及这些测试的自动化以提高效率。

    12. **网络基础设施安全**：在本章中，我们将讨论如何评估网络设备的安全性并应用加固技术。还将包含自动化安全扫描脚本。

