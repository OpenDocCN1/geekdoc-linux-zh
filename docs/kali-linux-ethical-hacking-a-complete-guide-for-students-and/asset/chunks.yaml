    ## 序言：书籍介绍


    欢迎来到迷人且充满道德黑客攻击世界，这个领域处于网络安全的前沿，并在我们的数字世界变得越来越重要。当你打开这本书时，你正开始一段旅程，这段旅程将为你提供保护系统、网络和信息免受网络攻击所需的技能和知识。本书的目标不仅是提供
    `Kali Linux` 中可用工具和技术的概述，还为了深入理解指导道德黑客攻击的伦理原则。


    ### 道德黑客攻击概念简介


    道德黑客攻击对许多人来说可能像是一个悖论，但它是网络安全领域的一项基础实践。与旨在造成的的黑客不同，道德黑客攻击是由专业人员在系统所有者的许可下进行的，旨在在被恶意攻击者利用之前识别并修复漏洞。这些专业人员被称为“白帽黑客”或好黑客。


    在书中，我们将通过强大的 `Kali Linux` 平台探索道德黑客攻击，该平台被广泛认为是用于渗透测试和安全审计最好的 Linux 发行版之一。`Kali
    Linux` 提供了一系列强大的工具集合，对于从初学者到专家的任何道德黑客来说都是不可或缺的。


    ### 当前形势下道德黑客攻击的重要性


