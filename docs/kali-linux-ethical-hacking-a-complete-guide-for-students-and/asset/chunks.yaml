    # Vulnerability: SQL Injection


    **Location:** Login page (POST `/login.php`)


    **Impact:** Possibility of unauthorized access to the database, compromising sensitive
    information.


    **Description:** The login page allows an attacker to insert malicious SQL code
    into the username field, which is processed by the database without proper validation.


    ## Impact and Severity

    Each vulnerability must be categorized according to its severity, generally classified
    as high, medium or low. This categorization must take into account the potential
    impact and likelihood of exploitation.


    ### Impact Assessment

    To communicate impact effectively, documentation must consider potential attack
    scenarios. For example, a SQL injection vulnerability could allow an attacker
    to access sensitive information, modify data, or even gain complete control over
    the system.


    #### Potential Impact

    - Access to users'' personal data

    - Modification or deletion of database records

    - Compromise of data integrity


    ## Recommendations and Corrective Measures

    Documenting a vulnerability without suggesting a solution does not help the customer
    mitigate the risk. Each identified vulnerability must be accompanied by a clear
    recommendation on how it can be fixed or mitigated.


    ### Practical Recommendations

    Recommendations should be practical and actionable. For example, if the identified
    vulnerability is a SQL injection, the recommendation may include implementing
    prepared statements and validating data input.


    #### Recommendation

    - Implement prepared statements for all SQL queries

    - Validate and sanitize all user inputs before processing them

    - Configure the database to limit user account privileges


    # Tools for Creating Professional Reports

    A variety of tools are available to help create pentest reports, from word processors
    and Markdown editors to specialized platforms that automate much of the documentation
    process.


    ### LaTeX

    LaTeX is a powerful tool for creating high-quality, professional documents, especially
    when precise control over formatting and presentation is required. Although it
    has a steeper learning curve, LaTeX is ideal for creating well-structured reports,
    with graphs, tables and cross-references.


    #### Using LaTeX for Pentest Reports

    A LaTeX document can be automated with scripts to generate reports that include
    dynamic data such as vulnerability graphs or risk tables.


    ```latex

    \documentclass{article}


    \usepackage{graphicx}

    \title{Penetration Test Report}

    \author{Security Team}

    \date{\today}


    \begin{document}

    \maketitle


    \section{Executive Summary}


    This report presents the results of the penetration test performed on [date].
    The main vulnerabilities identified include SQL injection, firewall configuration
    flaws, and sensitive data exposures.


    \section{Metodologia}


    The methodology used included network scanning, vulnerability analysis and exploration
    of configuration flaws.


    \section{Identified Vulnerabilities}


    \subsection{SQL Injection}


    The login page has been identified as vulnerable to SQL injection. We recommend
    implementing prepared statements to mitigate this risk.


    \end{document}

    ```


    ### Dradis

    Dradis is a collaborative reporting platform that allows integration with various
    pentest tools such as `Nmap`, `Nessus` and `Burp Suite`. It facilitates the centralization
    of information and the generation of consistent and professional reports.


    #### Integration with Pentest Tools

    Dradis can import results from multiple tools, allowing pentesters to consolidate
    their findings into a single document, which can be exported in formats such as
    PDF or HTML.


    ```bash

    dradis create report

    dradis import nmap results.xml

    dradis export report.pdf

    ```

    ● These commands create a new report in Dradis, import the results from Nmap,
    and export the finished report as a PDF.


    ### Markdown and Word Processors

    Markdown is a simple markup language that can be used to create structured reports
    with ease. Its simplicity makes it ideal for quick reports or for generating documentation
    that will be converted to HTML or PDF.


    #### Creating Reports with Markdown

    Reports created in Markdown can be easily converted to HTML or PDF using tools
    such as `Pandoc`.


    ```markdown

    # Penetration Test Report


    **Executive Summary**


    This report presents a detailed analysis of the vulnerabilities identified during
    penetration testing.


    ## Identified Vulnerabilities


    ### SQL Injection


    - **Impact:** High

    - **Recommendation:** Implement prepared statements.

    ```


    ```bash

    pandoc report.md -o report.pdf

    ```

    ● This command converts a Markdown file to a PDF document.


    # Structure and Content of a Pentest Report

    A pen test report should follow a clear structure that guides the reader through
    the findings and recommendations in a logical, easy-to-understand manner. The
    report structure can vary depending on the target audience, but generally includes
    the following sections:


    ### Executive Summary

    The executive summary is the most important section of the report for non-technical
    readers such as executives and high-level managers. It should provide an overview
    of key findings, potential impact and recommendations, without going into technical
    details.


    #### Non-Impact Focus

    The summary should highlight the most critical vulnerabilities and the potential
    impact to the organization, providing a clear view of the state of security and
    necessary measures.


    ```markdown

    **Executive Summary**


    During the penetration test carried out on the corporate network, several critical
    vulnerabilities were identified, including SQL injections and configuration flaws
    in firewalls. Exploitation of these vulnerabilities could result in unauthorized
    access to sensitive data and interruption of critical services.

    ```


    ### Methodology

    The methodology section describes the techniques and tools used during the pentest.
    This includes details on the reconnaissance, exploration, and post-exploitation
    steps, as well as the specific tools employed.


    #### Steps Detail

    The methodology must be documented so that another security professional can replicate
    the tests if necessary.


    ```markdown

    **Methodology**


    The penetration testing methodology followed a structured process that included
    the following steps:


    1. **Reconnaissance:** Network scanning with `Nmap` and service enumeration.

    2. **Exploration:** SQL injection tests using `Burp Suite`.

    3. **Post-Exploitation:** Access to internal systems and exfiltration of test
    data.

    ```


    ### Identified Vulnerabilities

    This section lists all vulnerabilities found, categorized by severity. Each vulnerability
    should include a description, potential impact, mitigation recommendation, and,
    if possible, a proof of concept.


    #### Organization by Severity

    Vulnerabilities should be organized so that the most critical ones are presented
    first, making it easier to prioritize fixes.


    ```markdown

    **Identified Vulnerabilities**


    - **SQL Injection (Severity: High)**

    - **Location:** Login page

    - **Impact:** Compromise of sensitive data.

    - **Recommendation:** Implement prepared statements.


    - **Incorrect Firewall Configuration (Severity: Medium)**

    - **Location:** DMZ network segment

    - **Impact:** Unauthorized access to internal services.

    - **Recommendation:** Review firewall and network segmentation rules.

    ```


    ### Recommendations

    The recommendations section should be practical and detailed, offering specific
    steps the organization can take to mitigate or correct the identified vulnerabilities.


    #### Details of Corrective Measures

    Recommendations should be clear and specific, indicating not only what needs to
    be done, but also how to do it.


    ```markdown

    **Recommendations**


    - **SQL Injection:**

    - Implement prepared statements in all SQL queries.

    - Adopt an input validation policy to ensure that input data is sanitized before
    being processed.

    ```


    ### Conclusion

    The conclusion should summarize the main findings and recommendations, reinforcing
    the importance of immediate action to mitigate risks.

