    # Documentation of Discoveries


    Each vulnerability identified during the pen test must be documented in detail.
    This includes describing the vulnerability, how it was exploited, and the potential
    consequences if left unpatched. Tools like `Dradis` can be used to organize and
    document findings efficiently.


    - **Recommendations for Mitigation**: For each vulnerability, the pentester must
    provide clear and practical recommendations for mitigation. This may include applying
    patches, reconfiguring systems, or implementing new security measures.

    - **Clarity and Precision**: The report should be written in such a way that both
    experts and non-experts can understand it. Language should be direct and focused
    on providing value to the reader, avoiding unnecessary technical jargon.


    A well-prepared report not only helps in correcting vulnerabilities, but also
    contributes to the continuous improvement of the organization''s security. It
    is the final document that encapsulates all the effort and knowledge applied during
    the pentest, and its quality can determine the effectiveness of the corrective
    actions that will be taken.


    ## Essential Tools Used in Each Phase


    Choosing the right tools for each phase of pen testing is fundamental to the success
    of the test. `Kali Linux` is a tool-rich security platform, offering a variety
    of options for all phases of the pentest lifecycle.


    - **Recognition**: Tools like `Nmap`, `Whois`, `Shodan`, and `Recon-ng` are essential
    for collecting detailed information about the target. These tools allow the pentester
    to map the network, identify services and discover initial vulnerabilities.

    - **Exploration**: `Metasploit Framework`, `sqlmap`, `Burp Suite`, and `Hydra`
    are some of the most used tools in the exploration phase. They allow the pentester
    to exploit a wide range of vulnerabilities, from SQL injections to authentication
    flaws.

    - **Post-Exploitation**: Tools like `Mimikcat`, `Empire`, `Metasploit` and `Responder`
    are used to maintain access, move laterally across the network, and extract sensitive
    information.

    - **Report**: `Dradis`, `Faraday`, and even tools like `LaTeX` or `Microsoft Word`
    are used to create professional and well-documented reports.


    Each of these tools plays a crucial role in its respective stage of pen testing.
    Familiarity with these tools and the ability to apply them effectively are what
    distinguishes a competent pentester.


    Performing an effective penetration test requires not only technical knowledge
    but also a rigorous methodological approach. Understanding and following the pentest
    lifecycle, combining it with the appropriate tools, is the way to identify and
    fix vulnerabilities before they can be exploited by malicious adversaries.


    # Chapter 3: Recognition and Information Collection


    The success of a penetration test is strongly linked to the quality of reconnaissance
    and information collection. This initial phase is essential to prepare the ground
    for the subsequent exploration and post-exploitation stages. During reconnaissance,
    the objective is to obtain as much information about the target as possible, using
    both passive and active techniques. The depth and accuracy of the information
    collected directly influences the effectiveness of the tactics that will be employed
    to compromise systems.


    ## Passive and Active Collection Techniques


    Recognition can be divided into two main types: passive and active. Each of these
    methods has its advantages and disadvantages, and the choice of which to use will
    depend on the specific objectives of the test and the sensitivity of the target.


    ### 1. Passive Collection

    Passive collection involves obtaining information without direct interaction with
    the target system. This technique is essentially discreet and is used to avoid
    detection by monitoring and security systems. One of the main benefits of passive
    collection is that it does not generate traffic that could alert the target. Instead,
    it uses public data sources and information available on the internet.


    **Whois Lookup**: A powerful tool for passive collection is the `Whois`, which
    provides information about domain registration, including details about the owner,
    DNS servers, and domain creation and expiration dates. A simple command to perform
    a Whois query is:


    ```bash

    whois example.com

    ```

    - This command returns valuable data that can help identify a target''s infrastructure.


    **Shodan**: Another essential tool for passive collection is the `Shodan`, a search
    engine for internet-connected devices. With it, it is possible to discover exposed
    devices and associated vulnerabilities. Using `Shodan`, a pentester can map a
    target''s attack surface without ever directly interacting with it:


    ```bash

    shodan search "apache" --fields ip_str,port,org,hostnames

    ```

    - This command returns a list of Apache servers exposed on the Internet, including
    their IP addresses, open ports, and associated organizations.


    **Google Dorking**: An often underestimated technique in passive collection is
    `Google Dorking`. With specific commands on Google, it is possible to discover
    sensitive information and vulnerabilities on websites. For example, to find exposed
    configuration files, you can use the following query:


    ```bash

    intitle:"index of" "config.php"

    ```

    - This dork can reveal exposed directory pages that contain configuration files,
    potentially with credentials or other sensitive information.


    ### 2. Active Collection

    Active collection, on the other hand, involves direct interaction with the target
    system, such as port scans, vulnerability testing, and other forms of probing.
    While active collection can be more revealing, it is also riskier as it generates
    traffic that can be detected by security systems.


    **Nmap**: One of the most used tools for active collection is the `Nmap`. This
    powerful tool allows you to perform port scans, detect running services, identify
    operating systems, among other features. An example of a basic scan with `Nmap`
    is:


    ```bash

    nmap -sS -p 80,443 target_ip

    ```

    - This command performs a TCP port scan (SYN Scan) on ports 80 and 443 of the
    target, identifying which are open and the associated services.


    **Recon-ng**: Another essential tool for active collection is the `Recon-ng`,
    which offers a modular framework to perform recognition in an efficient and automated
    way. A basic usage example of `Recon-ng` is:


    ```shell

    recon-ng

    > marketplace install all

    > workspaces create example_workspace

    > modules load recon/domains-hosts/bing_domain_web

    > set SOURCE example.com

    > run

    ```

    - In this example, `Recon-ng` is being configured to collect subdomains from a
    target domain using the module `bing_domain_web`, which queries the Bing search
    engine.


    **Netcat**: `Netcat` is another versatile tool in active collecting. It can be
    used to exploit open ports, transfer files, or even create backdoors. A simple
    example of port scanning with `Netcat` would be:


    ```bash

    nc -zv target_ip 20-80

    ```

    - This command checks whether ports 20 to 80 are open on the target, showing the
    status of each port.


    ## Using Tools such as Nmap, Whois, and Recon-ng


    The previously mentioned tools play essential roles in the recognition phase.
    Below, we will explore in detail how each of these tools can be used to collect
    valuable information about the target.


    **Nmap**: `Nmap` is an extremely popular open source tool in the cybersecurity
    world. Its versatility allows it to be used for a wide range of tasks, from port
    scanning to vulnerability detection. In addition to port scans, `Nmap` can be
    configured to perform more advanced tasks, such as detecting operating systems
    and running `NSE` (Nmap Scripting Engine) scripts to detect specific vulnerabilities.


    **Port Scan**:

    ```bash

    nmap -sS -p 1-65535 target_ip

    ```

    - This command performs a scan of all TCP ports on the target, identifying which
    ones are open and ready for exploitation.


    **Operating Systems Detection**:

    ```bash

    nmap -O target_ip

    ```

    - This command attempts to identify the operating system running on the target,
    valuable information for planning attacks.


    **Scanning with NSE Scripts**:

    ```bash

    nmap --script vuln target_ip

    ```

