    \ persistent communications with compromised systems.\n\nbash\n\nssh -L 8080:target_ip:80\
    \ user@intermediate_host\n\n● This command creates an SSH tunnel that redirects\
    \ traffic from port 8080 on the local host to port 80 on a target host, hiding\
    \ the traffic from the firewall."
