    \n\noutput_file=\"scan_results.txt\"\n\necho \"Starting network scan on $target_ip...\"\
    \n\nnmap -sS -p- -oN $output_file $target_ip\n\necho \"Scan completed. Results\
    \ saved to $output_file.\"\n\n● This script performs a full port scan on a specific\
    \ target, saving the results to a file for later analysis.\n\nScripts em Python:\
    \ Python offers greater flexibility and power compared to Bash, especially for\
    \ tasks that involve data processing or integration with APIs. It is widely used\
    \ in pen testing to automate complex tasks and create custom tools."
