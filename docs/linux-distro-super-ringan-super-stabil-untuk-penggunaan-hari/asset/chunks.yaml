    Debian 是一个首次于 1993 年发布的开源操作系统。它由 Ian Murdock 创建，目标是开发一个自由且社区驱动的 GNU/Linux 操作系统发行版。Debian
    以其稳定性、安全性以及对自由软件原则的遵循而闻名。


    Debian 的历史与 GNU 项目紧密相连，该项目旨在仅使用自由软件创建一个完全兼容 Unix 的操作系统。Debian 采纳了 GNU 项目的软件，并将其与
    Linux 内核结合，生成了 Debian GNU/Linux 发行版。


    Debian 高度开源协作，并由全球各地志愿者组成的庞大社区维护。它遵循严格的行为准则和定义良好的策略集，以确保发行版的质量和完整性。


