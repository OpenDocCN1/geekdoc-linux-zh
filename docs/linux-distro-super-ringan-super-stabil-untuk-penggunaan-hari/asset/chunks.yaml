    # 1) Ubuntu MATE 22.04 LTS OS


    ![image](img/chapter_title_below.png)


    ![image](img/image006.png)


    Ubuntu MATE 是一个于 2014 年首次开源操作系统。它是一个社区驱动的 Linux 发行版，旨在提供具有传统桌面界面的用户友好环境。Ubuntu
    MATE 基于 Ubuntu 操作系统并使用 MATE 桌面环境。


    Ubuntu MATE 的历史可以追溯到为偏好传统桌面体验的用户创建一个轻量且可定制操作系统的渴望。该项目迅速流行，吸引了热情的开发者和用户社区，他们为项目的增长和发展做出了贡献。


    Ubuntu MATE 提供了一系列功能和应用程序，包括 `Caja` 文件管理器、`Pluma` 编辑器和用于轻松系统配置的 `MATE Control
    Center`。它还支持广泛的硬件，使其被多样化的用户群体可以使用。


