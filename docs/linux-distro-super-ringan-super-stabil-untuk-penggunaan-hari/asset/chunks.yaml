    GhostBSD 是一个基于 `FreeBSD` 的桌面级操作系统，专注于简单性和易用性。它提供了一系列预装的常用软件，旨在为现代 `BSD` 平台提供舒适的体验。该项目的目标是将安全性、隐私性、稳定性、易用性、开放性和自由结合，并且完全免费。


    该项目始于 2009 年初初，由 Eric Turgeon 和 Francois Toussaint 创立。最初的目标是制作一个安全的、可安装的 `FreeBSD`
    Gnome `live CD` 系统，帮助新用户适应 `FreeBSD`。第一个测试版本 `1.0 BETA` 于 2009 年 11 月 10 日发布。


    该项目持续演进，在 `2.5` 版本中引入了第一个图形化安装程序。GhostBSD 最初基于 `FreeBSD`，然后短暂切换到 `TrueOS`，后来又回到了基于
    `FreeBSD`。该项目经历了多次基础变更，旨在提供稳定的更新和发布周期。“GhostBSD”这个名称最初代表“运行在 BSD 上的 GNOME”，因为它最初是尝试在
    `FreeBSD` 上提供即插即用的 `GNOME` 桌面。然而，主桌面后来更改为 `GNOME 2` 的分支 `MATE`，项目开始提供如 `XFCE`
    等替代桌面环境，所有这些均使用 `GTK` 工具包。


    如今，GhostBSD 是一款基于 `FreeBSD` 的简单、优雅且友好的桌面笔记本 `BSD` 操作系统，官方桌面环境为 `MATE`。安装程序利用 `OpenZFS`，使用户可以轻松在同一硬盘的
    `ZFS` 上与其他操作系统一起安装 GhostBSD，非常适合 `FreeBSD` 新手。由于硬件要求适中，GhostBSD 是现代工作站和 64 位单板计算机硬件的理想选择。总而言，GhostBSD
    旨在类 Unix 操作系统上提供简单、轻量级的桌面体验，并关注易用性和稳定性。


