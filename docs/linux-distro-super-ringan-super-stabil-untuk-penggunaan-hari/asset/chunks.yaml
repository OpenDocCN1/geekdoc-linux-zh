    development strategy. From Qiana onwards, Linux Mint decided to base its new versions
    on the source code of the current long-term support (LTS) release of Ubuntu until
    Ubuntu releases a new LTS version. This allowed Linux Mint to benefit from the
    stability and reliability of Ubuntu’s LTS releases while adding its own unique
    features and improvements.


