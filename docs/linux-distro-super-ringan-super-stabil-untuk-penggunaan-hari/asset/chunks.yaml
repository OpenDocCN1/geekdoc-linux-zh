    # 15) Endless OS


    ![image](img/chapter_title_below.png)


    ![image](img/image002.jpg)


    Endless OS 由 Endless Computers 于 2016 年推出，是一种 Linux 发行版，主要为互联网受限的发展地区用户设计。其根源可以追溯到公司创建易用计算体验的任务，特别是针对教育和生产力。


    Endless OS 构建在 `Debian` 之上，采用了自定义的 `GNOME` 桌面环境。系统具有独特的软件管理方法，允许用户离线访问大量的预装应用程序和教育内容。这种离线能力至关重要，因为它有助于帮助那些可能没有稳定互联网访问的人跨越数字鸿沟。


    该操作系统针对低端硬件性能进行了优化，是资源有限的学校和社区极具吸引力的选择。它强调简单和用户友好，适应不同技术水平的用户。


    多年来，Endless OS 通过定期更新不断演进，增强了用户界面并扩展了其应用生态系统。其开发继续关注提高可访问性并为全球用户赋能，体现了为欠服务群体提供价值计算资源的哲学。


