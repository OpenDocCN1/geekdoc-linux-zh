    # 14) GhostBSD OS


    ![image](d2d_images/chapter_title_below.png)


    ![image](d2d_images/image011.png)


    GhostBSD is a desktop-oriented operating system based on `FreeBSD`, with a focus
    on simplicity and ease of use. It provides a selection of commonly used software
    preinstalled and aims to offer a comfortable experience on the modern `BSD` platform.
    The project’s goal is to combine security, privacy, stability, usability, openness,
    and freedom, and it is free of charge.


    The project had its beginnings in the early part of 2009, founded by Eric Turgeon
    and Francois Toussaint. The original goal was to produce a secure, installable
    `FreeBSD` Gnome` live CD system to help new users adapt to `FreeBSD`. The first
    beta version, `1.0 BETA`, was released on November 10, 2009.


    The project continued to evolve, with the first graphical installer introduced
    in the `2.5` release. GhostBSD was initially based on `FreeBSD`, then briefly
    switched to `TrueOS`, and later returned to being based on `FreeBSD`. The project
    has gone through various base changes, aiming to provide a stable update and release
    cycle. The name “GhostBSD” originally stood for “GNOME hosted on BSD,” as it began
    as an effort to provide a ready-to-run `GNOME` desktop on `FreeBSD`. However,
    the main desktop was later changed to the `GNOME 2` fork `MATE`, and the project
    began offering alternative desktop environments like `XFCE`, all using the `GTK`
    toolkit.


    Today, GhostBSD is a simple, elegant, and friendly `BSD` operating system for
    desktops and laptops based on `FreeBSD`, with the official desktop environment
    being `MATE`. The installer leverages `OpenZFS`, making it easy to install GhostBSD
    on `ZFS` with other operating systems on the same drive, and is suitable for newcomers
    to `FreeBSD`. With modest hardware requirements, GhostBSD is ideal for modern
    workstations and 64-bit single-board computer hardware. Overall, GhostBSD aims
    to provide a simple, lightweight desktop experience on a Unix-like operating system,
    with a focus on ease of use and stability.


    **Link Download Official:**

    [https://ghostbsd.org/](https://ghostbsd.org/)


