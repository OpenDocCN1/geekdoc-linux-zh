    and user experience while using Debian as its base. LMDE received updates from
    the Debian repositories designed for Debian Testing or Debian Squeeze. However,
    after LMDE 2, the Linux Mint team announced that they would no longer support
    the original rolling release version of LMDE.


    LMDE 6, codenamed “Faye,” is the latest release of Linux Mint Debian Edition.
    It is based on Debian Bookworm and was released on September 27, 2023. LMDE 6
    features the Cinnamon desktop environment and includes the Linux kernel version
    6.1. The release introduced various enhancements, including an improved login
    screen, enhanced security for Warpinator (a file-sharing tool), proper support
    for HEIF and AVIF image formats, and under-the-hood improvements aimed at enhancing
    performance and user experience.


    The development of LMDE 6 was announced on the Linux Mint blog, with a beta release
    on September 13, 2023, followed by the official release on September 27, 2023.
