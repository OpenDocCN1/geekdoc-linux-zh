  md: '# Changing Your Menu Layout


    Although the main Applications, Places, and System are logical by default, you
    may want to further customize them by moving entries into different submenus,
    not displaying certain items, and making other tweaks. All of this is easily done
    with the built-in menu editor.


    To edit the menus, right-click on a menu, and select Edit Menus. The menu editor
    now appears, as shown in Figure 3-2.


    The menu editor is fairly intuitive. To adjust which items are shown, click on
    a submenu in the left-hand pane and change the Show checkbox for the items you
    want to show or hide. To add a new item, select the submenu the item should appear
    in, and then click the New Item button on the right-hand side. The box shown in
    Figure 3-3 will appear.


    Menu items can be applications (the default), applications running in terminals,
    or files. Select the appropriate setting for the Type box for your menu item,
    or leave it as Application. Provide a name for your menu item in the Name box,
    the command to run in the Command box (or the loca-


    ![](img/aa15f1f82061fdaf4ff1da575e3e1c52_102_0.png)


    Figure 3-2 The menu editor lets you easily change the Ubuntu menus.'
