- img_proc: true
  md: 'You must load the file /var/lib/tftpboot/ltsp/pxelin.cfg/default so that it
    can be edited. To do this you can use any of the methods previously described
    in this chapter. Once the file is open, there is a line beginning with APPEND;
    to the end of this line, you must add one of the following:


    ```

    NFSOPTS="- nolock,ro,wsize=2048,rsize=2048"

    ```


    or:


    ```

    NFSOPTS="- nolock,ro,proto=tcp"

    ```


    After this, your clients should be able to boot normally. If you are using Etherboot
    or require more information on this, you can find help on the LTSP wiki, under
    the Troubleshooting section.


    # VMWare Client Crashes While Booting


    Some people use VMware, a virtualization suite, to test various aspects of their
    setup before they roll it out. However, you may find that VMware clients are unable
    to boot properly. This is a problem with the graphics driver and can be solved
    simply by taking the actions described in the previous section, but instead of
    adding the NFSOPTIONS line, simply remove the word splash from the APPEND line.
    This will remove the loading screen from Edubuntu and should make your VMware
    clients bootable again.


    # Some Intel Boot Agents Will Not Boot at All


    Some Intel Boot Agents have a bug that makes them unable to boot at if your LTSP
    server (TFTP server) is different from your DHCP server. The reason for this is
    that the Intel Boot Agent assumes wrongly the TFTP information resides on the
    DHCP server, which of course it doesn’t. One way to work around this is to make
    a mirror of the /var/lib/tftpboot/directory on the DHCP server and install a TFTP
    server on that machine to serve that directory. Remember that if you update the
    NFS chroot, you must then update this new mirror. It is also possible there is
    a firmware update for your NIC.'
  merge: -1
