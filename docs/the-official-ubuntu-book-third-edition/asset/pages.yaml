  md: '# The File Manager Is Painfully Slow—How Can I Make It Run Faster?


    You can deactivate a number of options to make the file manager faster. First,
    click Edit > Preferences, the tab marked Preview, and click on it. If Show Text
    in Icons (the first option) is enabled, it will preview some the contents of text
    documents in their icons. Set this option to Never. Next, there''s an option Show
    Thumbnails. This option will preview image files as thumbnails. Set this option
    to Never to further improve the speed of the file manager''s browsing. If enabled,
    the option Preview Sound Files will make it possible to preview sound files without
    actually opening them. Set this to Never as well. The last option, Count Number
    of Items, shows how many items are in the folders listed in the directory you''re
    currently browsing. Set this to Never.


    If you are still not satisfied with the speed of the file manager, you could check
    out some other file managers, such as Rox Filer or Thunar.


    # I Can''t See the Hidden Files and Folders in the File Manager


    Files and directories that begin with a dot (such as .bashrc) are typically used
    to store settings and configuration details for a particular application. By default,
    the file manager does not show these files. How do you view, move, and copy them?
    Simple. Just click View > Show Hidden Files, and your hidden files are displayed,
    as shown in Figure 6-3.


    > Warning!

    Don''t ever mess around hidden files and directories unless you know exactly what
    you are doing. Making the wrong move with one of these files or directories could
    break something!


    # How Do I Restore Something I Deleted in the File Manager?


    When you delete something in Ubuntu, the files are not deleted immediately and
    are instead moved to the trash. If you accidentally deleted your important report
    and want to avoid limb removal by your boss, double-clicking the small trash icon
    in the bottom-right corner of the screen, and then drag your files back into the
    file manager.'
  merge: -1
  pgno: 231
