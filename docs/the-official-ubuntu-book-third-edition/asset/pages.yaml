  md: 'Ubuntu Server is a whole new distribution or an Ubuntu derivative Kubuntu (only
    for servers) or perhaps something else entirely.


    Let''s clear things up a bit. The primary software store for Ubuntu and official
    derivatives is called the Ubuntu archive. The archive is merely a collection of
    packages in Debian “deb” format, and it contains every single package that makes
    up distributions as Ubuntu, Eduntu, Xubuntu, Kubuntu, and Ubuntu Server. What
    makes Ubuntu separate from Ubuntu, then, is only the set of the packages from
    the archive that its installer installs by default and that its CDs carry.


    Ubuntu Server is no different. It depends on the same archive as the Ubuntu distribution,
    but it installs a distinctive set of default packages. Notably, the set of packages
    comprising Ubuntu Server is very small. The installer will not install things
    such as a graphical environment or many user programs by default. But since all
    the packages for Ubuntu Server come from the same official Ubuntu archive, you
    can install any package you like later. In theory, there''s nothing stopping you
    from forming an Ubuntu Server into a regular Ubuntu desktop installation or vice
    versa (in practice, this is tricky, and we don''t recommend you try it). You can
    even go from running Kubuntu to running Ubuntu Server. The archive paradigm gives
    you maximum flexibility.


    We''ve established that Ubuntu Server provides a different set of default packages
    than Ubuntu. But what''s important about that different set? What makes Ubuntu
    Server a server platform?


    The most significant difference is a nonpreemptive server kernel with an internal
    kernel timer frequency of 100Hz instead of the desktop default of 1KHz. We''ll
    spare you OS theory: The idea is to offer some extra performance and throughput
    for server applications. In addition, the server kernel supports SMP and basic
    NUMA. SMP, or symmetric multiprocessing, is the code that allows you to use more
    than one processor in your server, and NUMA is a memory design used in some multiprocessor
    systems that can dramatically increase multiprocessing performance.'
  merge: -1
