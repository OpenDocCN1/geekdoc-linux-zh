  md: '# Sending Messages


    You can send short messages to users, for example, “You have 5 minutes left for
    this lesson.” To do this, first select a user (or multiple users) and then click
    the Message button. You will then be presented with a box to type in your message.
    After you click OK, the message will be sent to the selected user.


    # Starting Programs


    It is also possible to start an application or process in a client’s session from
    Thin Client Manager. To do this, simply select the user (or multiple users), and
    click the Execute button. You will then be presented with a dia-box to enter a
    command to run in the user’s session. After you click OK, an internal message
    will be sent to the user’s session asking for the chosen command to run.


    # Locking or Blanking Screens


    Sometimes it may become necessary to temporarily prevent users from accessing
    the computer. To do this, select the user (or multiple users) and click the Blank
    button. This will then activate a locked screensaver on the client’s machine,
    forcing the user to stop and wait until you have unlocked the machine. Unlocking
    is done the same way, but using the Un-Blank button instead.


    # The Lockdown Editor


    By selecting one single user and right-clicking on that user, you can use the
    context menu to lock down a specific user. Selecting Lockdown will open Pellusus,
    the GNOME lockdown editor. Ticking and ticking options in Pellusus will enable
    and disable certain functions for the user. T the padlock next to an option will
    make it unchangeable for the user. This is called a mandatory setting. Pellusus
    has been altered for integration with Thin Client Manager so that mandatory keys
    are now per user, instead of per system. For further help with Pellusus, please
    refer to'
