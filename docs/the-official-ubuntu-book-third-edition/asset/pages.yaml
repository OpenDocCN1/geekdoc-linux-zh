  md: '# Chapter 5 The Ubuntu Server


    TIP


    The Mythical Parity Drive

    If you toss 200GB drives into a RAID 5 array, the array''s total usable size will
    be 800GB, or that of four. This makes it easy to mistakenly believe that a RAID
    5 array ''sacrifices'' one of the drives for maintaining redundancy and parity,
    but this is not the case. Through some neat mathematics of polynomial coefficients
    over Galois fields, the actual parity information is striped across all drives,
    allowing any single drive to fail without compromising the data. Don''t worry,
    though. We won''t quit you on the math.


    Which RAID to Choose? If you''re indecisive by nature, the past few paragraphs
