    # Kiosk Mode


    Kiosk mode allows an administrator to configure KDE and all aspects of the desktop
    and prevent the end user from changing the settings.


    KDE stores all of its configuration information in text files that are similar
    to Windows INI files. These files control everything from the default background
    to whether or not a person can add bookmarks. The locations of the configuration
    files, simply type kde-config --path from from Console. Note that the order applied
    is the reverse order of which is displayed. By changing one of the files in the
    highest priority, the last listed in the kde-config statement, you can affect
    what all users see.


    To change the background for all users, simply edit the Wallpaper section found
    in kdedesktoprc, located in /usr/share/ubuntu-default-settings/kde-profile/default/share/config.
    See Figure 8-49 for an example.


    As previously discussed, each user can change the desktop to meet his or her needs.
    However, an administrator can make it some things cannot be changed. Simply insert
    [$] at the top of the file for each application you would like to make immutable.
    Figure 8-50 shows the background changed and made immutable.


    Along with enabling or setting changes, an administrator can remove user access
    to certain items by simply editing the kde global files and adding a [KDE Action
    Restrictions] [$1] section.


    There are plenty of additional items that can be limited and changed in Kubuntu.'
