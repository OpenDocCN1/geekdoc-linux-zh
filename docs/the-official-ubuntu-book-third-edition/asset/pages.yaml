  md: 'Table 2-1 Partition Settings

    | Setting | Description | Example |

    | --- | --- | --- |

    | Use as | This is the type of filesystem. For a normal Ubuntu system, ext3 is
    recommended. | ext3 |

    | Format the partition | This setting appears when editing an existing partition.
    | yes |

    | Mount point | This specifies what lives on the partition. See earlier in this
    chapter for details about the kind of partitions you should set up. | / |

    | Mount options | A number of options can be passed to the mount point, although
    the default setting should be fine. | defaults |

    | Label | A text label describes the partition. Usually it is set to the same
    value as the mount point. | / |

    | Reserved blocks | This is the percentage of the filesystem reserved for the
    super-user; 5% is a good default. | 5.00% |

    | Typical usage | This option can be used to optimize how the filesystem is organized,
    although the standard setting is typically used. | |

    | Bootable flag | Does this partition contain the kernel and bootloader? If this
    is the root partition (known as/), set this to on. | on |


    # ## Configuring a User


    The next part of the installation routine configures a user for the computer.
    This user role is important because it not only can be used as a normal user but
    also has the ability to use sudo to perform administrator tasks.


    You are first asked to enter a full name for the user (such as Alan Clement).
    Next you are asked for a username, or one will be picked for you from your full
    name (such as alanc). If you want another username, enter it here. Finally, you
    are asked to enter a password for the user and asked to repeat the password for
    verification.


    # ## Finishing Up


    At this point, the installation routine can go away and install the full system
    for you. After this, the computer will reboot, and the installation will be complete.'
