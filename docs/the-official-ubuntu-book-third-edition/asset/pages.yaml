    team—which would in time grow into the core Ubuntu team—brainstormed a large list
    of the things that they wanted to see in their ideal OS. The list is now a familiar
    list of features to most Ubuntu users. Many of these traits are covered in more
    depth later in this chapter. The group wanted


    +   - Predictable and frequent release cycles


    +   - A strong focus on localization and accessibility


    +   - A strong focus on ease of use and user-friendliness on the desktop'
