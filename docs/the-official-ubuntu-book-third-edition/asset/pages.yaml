  md: '# Teams, Processes, and Community Governance


    The second charge of the Community Council is the arbitration of disputes that
    cannot be handled within a particular team or arise between teams. Very frequently,
    these are disputes about the Code of Conduct that may require clarification of
    a part of the Code of Conduct or a description of whether any of the code was
    in fact violated by a particular action or behavior. However, the Community Council''s
    purview is not limited to Code of Conduct violations, and the Community Council
    is available to handle disputes in any nontechnical situation. In most situations,
    the Community Council does not take action against individuals but, rather, help
    group members come to agreement or consensus among themselves. If this fails,
    the Community Council can ask a maintainer or other member of the community to
    apologize and refrain from particular behavior or leave the community. The Community
    Council promises that nobody will be asked to leave without substantial review
    and an opportunity to defend him— herself.


    A third area of council work is the creation and dissolution of teams and the
    appointment of team leaders. New teams are proposed to the Community Council in
    the manner described earlier in the section on teams, and the Community Council
    either approves or asks the proposer to wait. Defunct or inactive teams can similarly
    be dissolved by the Community Council. In cases where team leadership is requested,
    the Community Council can appoint leaders of teams or shift leadership to different
    team members. In most situations, the appointment of team leaders is an internal
    team matter but, when requested, the Community Council is available to intervene.


    Fourth, the Community Council is responsible for approving and welcoming new members
    to the project. This will be described in more depth in the upcoming subsection
    on membership.


    Finally, the Community Council is responsible for all community-related structures
    and processes. New types of teams, requirements for membership, and core philosophical
    documents should first be approved by the Community Council. Community members
    who wish to suggest new structures or processes can submit their proposal to the
    Community Council for discussion and approval.'
