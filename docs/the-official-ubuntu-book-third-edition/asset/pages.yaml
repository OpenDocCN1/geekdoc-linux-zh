    # Running Another OS in Ubuntu


    Some of you read the title of this recipe and wondered how earth you can run another
    OS on an existing OS. Surely such a thing is not possible? Well, actually, it
    is.


    In years virtualization technology has been developed to simulate a computer in
    software. You can use this technology to boot a virtual com-'
