    in belief, interpretation, or motivation. For example, most contemporary forms
    of Protestant Christianity agree on almost everything but have separated over
    some small but irreconcilable differences. However, in the case of the free software
    and open source movements, the two groups have fundamental disagreements about
    their motivation and beliefs. One group is focused on freedom, while the other
    is focused on pragmatics. Free software is most accurately described as a social
    movement, while open source is a development methodology. However, the two groups
    have no trouble working on projects in hand.'
