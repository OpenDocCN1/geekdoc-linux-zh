    # Installing from the Desktop CD


    So let''s assume you are playing with Ubuntu from the desktop

    CD, and you decide you like it. You decide you like so much, in fact, that

    You want to install it on your computer. Does this mean you need to get a

    parate CD and install it? Heck, no. Ubuntu lets you install the hard

    disk by simply clicking a single icon and following the instructions—one

    disk to run them all.


    If you don''t already have the desktop CD running, pop it into your

    DVD/CD drive, and reboot your computer. If your computer does not

    boot from the CD, you should enter your computer''s BIOS and change the

    boot order to ensure that your CD-ROM drive is tried first and the hard

    disk is tried next. Save your BIOS changes, and then restart again. The disk

    should boot now.


    If you have problems configuring your BIOS to boot from the CD, you should consult
    the

    manual. If you don''t have the manual, visit the manufacturer''s Web site, and
    see if you can

    download the manual.'
