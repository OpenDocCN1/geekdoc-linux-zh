    # # How Do I Schedule Things to Happen?


    Built right into Ubuntu is a very powerful system for scheduling things to happen
    at specific times or at regular intervals. This system, called cron, allows you
    to specify the timing details and the command to run in a special file called
    crontab.


    The crontab is a simple text file that holds a list of commands to be run at specified
    times. These commands, and their related run times, are controlled by the cron
    daemon and executed in the system''s background. More information can be found
    by viewing the crontab''s man page, and we will run through a simple crontab example
    soon to demonstrate how it is used.


    The system maintains a crontab for each user on the system. In order to edit or
    create a crontab, you need to load it into a text editor. This text editor is
    opened when you use the -e option on crontab command. To create a crontab, open
    a terminal and run the following command:


    ```

    foo@bar:-$ crontab -e

    ```


    The default nano text editor will open an empty crontab file. When adding crontab
    instructions, each line represents a separate crontab entry, also known as a cron
    job.


    # Contab Sections A typical line in a crontab looks like this:


    ```

    00 01 3 5 6 ps ax

    ```


    Each of the sections is separated by a space, with the final section having one
    or more spaces in it. No spaces are allowed within sections 1–5, only between
    them. Sections 1–5 are used to indicate when and how often you'
  merge: -1
  pgno: 264
- img_proc: true
  md: 'want the task to be executed. This is how a cron job is laid out from left
    to right:


    +   - Minute: (00–59)

    - Hour: (00–23; 0 = midnight)

    - Day: (1–31)

    - Month: (1–12)

    - Weekday: (0–6; 0 = Sunday)

    - Command: code


    If you read each line in the crontab from the left and use these column descriptions,
    you can see how the instruction is built up. Here''s an example:


    ```

    01 04 1 1 1 /usr/bin/somedirect/somecommand

    ```


    This example runs /usr/bin/somedirect/somecommand at 4:01 A.M. on any Monday that
    falls on January 1. An asterisk (*) indicates that every instance (every hour,
    every weekday, every month, and so on) of a time period should be:


    ```

    01 04 * * * /usr/bin/somedirect/somecommand

    ```


    This example will run /usr/bin/somedirect/somecommand at 4:01 A.M. on every day
    of every month.


    Comma-separated values can be used to run more than one instance of a particular
    command within a time period. Dash-separated values can be used to run a command
    continuously:


    ```

    01,31 04,05 1-15 1,6 * /usr/bin/somedirect/somecommand

    ```


    This example will run /usr/bin/somedirect/somecommand at 1 and 31 minutes past
    the hours of 4:00 A.M. and 5:00 A.M. on the 1st through the 15th days of January
    and June.


    The /usr/bin/somedirect/somecommand text in these examples indicate the task that
    will be run at the specified times. It is recommended that you use the full path
    to the desired commands as shown here. The crontab will begin running as soon
    as it is properly edited and saved.'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# Contab Command Options There are a number of options you can pass to the
    crontab command to make it do different things. Here are some common options:


    +   - -l option causes the current crontab to be displayed on standard output.

    - -r option causes the current crontab to be removed.

    - -e option is used to edit the current crontab using the editor specified by
    the VISUAL or EDITOR environment variables.


    When you edit a crontab file, the modified crontab is checked for accuracy and,
    if there are no errors, installed automatically.


    An Example Following is an example of how to set up a crontab to run updatedb,
    which updates the locate database. Open a terminal application, type crontab -e,
    and press Enter. Then type the following line into the editor, substituting the
    full path for the one here:


    ```

    45 04 * * * /usr/bin/updatedb

    ```


    Save your changes, and exit the editor. The crontab command will let you know
    if you make any mistakes. The crontab will be installed and begin running if there
    are no errors. That''s it. You now have a cron job set to run updatedb, which
    updates the locate database every morning at 4:45.


    Note that a semicolon (;) or double ampersand (&&) can also be used in the command
    section to run multiple commands consecutively:


    ```

    45 04 * * * /usr/sbin/chkrootkit && /usr/bin/updatedb

    ```


    The semicolon will cause both commands to be executed. The double ampersand will
    cause the second command to execute only if the first command does not fail. This
    example will run chrootkit and updatedb at 4:45 A.M. daily, provided that you
    have all the listed applications installed.


