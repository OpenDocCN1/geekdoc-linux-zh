  md: '# How Can I Prevent the Pain I Get in My Fingers When I Type?


    If you feel pain or numbness in your fingers, you are likely suffering from repetitive
    strain injury (RSI). This common complaint typically affects those who work with
    computers for long periods every day. The constant movement of the fingers in
    such a repetitive fashion can cause swelling and pain in the fingers and wrists.
    RSI can also affect your neck, back, legs, and other areas.


    If you suspect you have RSI, you should first consult your doctor. RSI is a condition
    that requires treatment. This treatment can come in the form of physiotherapy,
    regular breaks, workspace adjustments, and in some extreme cases, medication or
    surgery.


    One of the most common methods of reducing RSI is to take regular breaks. It is
    a good idea to break about once an hour. Your desktop can help with this. Click
    on System > Preferences > Keyboard, and select the Typing Break tab. You can use
    the settings in the tab to enforce a break once an hour.


    Another type of break is a micropause. These usually occur every couple of minutes,
    and the break lasts for only a few seconds. These breaks are intended to be less
    intrusive and give your hands a chance to regularly rest for a short period to
    allow the blood to flow. A useful tool called Workrave has been developed to enforce
    regular micropauses. Use the Synaptic package manager to install Workrave.


    > TIP Remember!

    Always consult a doctor about any health problems you might have. RSI in many
    cases is treatable problem, but your doctor can best advise you on the recommended
    treatment.


    # Summary


    Software by its very nature is subject to inaccuracies, bugs, and usability problems—and
    users by their very nature are subject to errors, mistakes, and misjudgments.
    Although every release of Ubuntu makes Linux and computing far easier to use and
    more flexible than the previous release, there are always going to be occasions
    when something doesn''t work.'
