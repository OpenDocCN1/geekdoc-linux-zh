  md: '# Your Log Toolbox When it comes to reviewing logs, you should become familiar
    with a few tools of choice. The tail utility prints, by default, the last ten
    lines of a file, which makes it a neat tool to get an idea of what''s been happening
    last in a given log file:


    ```

    $ tail /var/log/syslog

    ```


    With the -f parameter, tail launches into follow mode, which means it''ll open
    the file and keep showing you changes on the screen as they''re happening. If
    you want to impress your friends with your new system administrator prowess, you
    can now easily recreate the Hollywood hacker movie staple: the furiously blazing
    across the screen.


    Also invaluable zgrep, zcat, and zless, which operate like their analogues that
    don''t begin with a z, but on gzip-compressed files. For instance, to get a list
    of lines in all your compressed logs that contain the word "warthog" regardless
    of case, you would issue the following command:


    ```

    $ zgrep -i warthog /var/log/.gz

    ```


    Your toolbox for dealing with logs will grow with experience and based on your
    preferences, but to get an idea of what''s already out there, do an apt-cache
    search for "log files."


    # A Sprling of Network Security


    Network security administration is another feature provided largely by the OS,
    so it''s no different on Ubuntu than any other modern Linux distribution. That
    means we won''t cover it here but will leave you with a pointer.


