  md: '# Dual-Booting with Another Operating System on the Hard Disk


    Perhaps you have a suite of computers that are already happily running another
    OS, and you would prefer to keep both systems running for a while. Hopefully,
    after using Edubuntu for any length of time, you will eventually make the switch
    permanent. In these situations, it is easy to set up the server to allow the client
    to boot from either the network or the first hard disk in the computer.


    The bulk of the editing takes place in the pxelinux.cfg/default configuration
    file in the directory /var/lib/tftboot/ltsp/<path>. The format of the file is
    very similar to the old LILO configuration syntax (for those of you familiar with
    bootloader). The following sample configuration will present a message to the
    client, which is explained later. The user can then choose to either allow the
    system to boot its default configuration, in this example would be the local hard
    disk, or to type in the word linux and press Enter, which would load the LTSP
    thin client.


    ```

    DEFAULT localboot

    TIMEOUT 50

    PROMPT 1

    DISPLAY display.msg


    LABEL linux

    KERNEL vmlinuz

    APPEND ro initrd=initrd.img quiet splash


    LABEL localboot

    LOCALBOOT 0

    ```


    Let''s take a look at the configuration file and break it down so that you can
    create your own to suit your environment. (If this sample file fills the bill
    for you, you can skip down to the part about creating the display.msg file.)


    The DEFAULT keyword specifies which boot option will be chosen once the timeout
    expires. The TIMEOUT option specifies how long to wait before booting the default
    option. This timeout is measured in one-tenth of a second; then a value of 50
    sets it for 5 seconds. The PROMPT option specifies whether the PXE software displays
    the boot: prompt to enable users to choose an operating system. The DISPLAY option
    displays a text file on the'
  merge: -1
  pgno: 388
- img_proc: true
  md: 'screen as an introduction. In this case, the file is called display.msg and
    must be placed in the root LTSP directory, alongside the pxelinux.0 file. An example
    of this file is proposed a little later.


    The three lines starting with LABEL linux define the linux option for booting.
    This is configured by the KERNEL and APPEND options, which you will notice are
    extracted from the original default file, as shown here:


    ```

    DEFAULT vmlinuz no initrd=initrd.img quiet splash

    ```


    All that is needed now is the option for booting from the local hard drive, shown
    by the two lines starting LABEL localhost. These lines define the localhost option
    as used with the DEFAULT keyword in the file. The only definition included in
    this option is 0. the LOCALBOOT option, with a parameter of 0. This provides normal
    hard disk booting. Other parameters are available, as you can see by visiting
    the Syslinux home page, http://syslinux.zytor.com.


    The display.msg file should contain some information that tells the user what
    to do to choose an operating system. Following is an example file that is suitable
    for the configuration above. When creating this file, it is suggested to use a
    number of blank lines before the text actually begins. It has the effect of clearing
    the screen so that users don''t get confused by the PXELux start-up text.


    > Welcome to the Multiboot System


    The system will start in 5 seconds...


    for Linux users type : linux

    at the boot: prompt and press <enter>


    After rebooting the client, you should now see the text from the display message
    file. It should look similar to that shown in Figure 9-13.'
