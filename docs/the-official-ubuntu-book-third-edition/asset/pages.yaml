    in the search bar of the launcher, or in KRunner (KRunner is accessed by either
    right-clicking on the desktop and selecting Running Application or by hitting
    ALT-F2). When making changes in System Settings, you will be prompted at times
    to enter your password. Changes that require a password are systemwide and will
    affect all users of the Kubuntu system.


    System Settings is divided into two tabs, General and Advanced, and each tab is
    further divided into sections based on tasks. The General tab has the following
    sections: Look & Feel, Network & Connectivity, and Computer Administration. The
