  md: '# LVM Doesn''t Provide Redundancy


    The point of LVM is storage fluidity, not fault tolerance. In our example, the
    logical volume containing the /var filesystem is sitting on a volume group that
    spans two hard drives. Unfortunately, this means that either failure will corrupt
    the entire filesystem, LVM intentionally doesn''t contain functionality to prevent
    this problem.


    When you need fault tolerance, build your volume groups from physical volumes
    that are sitting on RAID! In our example, we could have made a partition spanning
    the entire size of the 10GB hard drive and allocated it to a physical space for
    a RAID volume. Then, we could have made two 10GB partitions on the 20GB hard drive
    and made the first one also a physical space for RAID. Entering the RAID configurator,
    we would create a RAID 1 array from the 10GB partitions on both drives, but instead
    of placing a regular filesystem on the RAID array as before, we''d actually designate
    the RAID array to be used as a physical space for LVM. When we get to LVM configuration,
    the RAID array would show up any other physical volume, but we''d know that the
    physical volume is redundant. If a physical drive fails beneath it, LVM won''t
    ever know, and no data loss will occur. Of course, standard RAID array caveats
    apply, so if enough drives fail and shut down the array, LVM will still come kicking
    and screaming.


