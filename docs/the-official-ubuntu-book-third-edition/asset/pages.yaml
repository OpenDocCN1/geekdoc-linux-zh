  md: 'Other interested parties can use Blueprint to subscribe to specifications or
    proposals they are interested in to collaborate on the development of the specification
    and to track progress. Over time, users working in the wiki and in Blueprint help
    new ideas through a process that starts with "braindump”—a very rough collection
    of ideas and brainstorming—and ends with an implemented feature. In Ubuntu, this
    process involves (1) review by decision makers and the community and trusted members
    and the Ubuntu Technical Board or by appropriate team leaders and councils. Blueprint
    provides technology to support this process and ensure that nothing important
