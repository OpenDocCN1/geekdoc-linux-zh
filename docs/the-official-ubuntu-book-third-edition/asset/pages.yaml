- img_proc: true
  md: '# instant Messaging


    +   - Windows: AIM, Yahoo, ICQ, or Pidgin

    - Ubuntu: Pidgin


    **NOTE** Pidgin can connect to AIM, Yahoo, ICQ, and Google Talk networks.


    # Voice Over IP


    +   - Windows: Skype or GizmoProject

    - Ubuntu: Ekika Softphone or Skype


    **NOTE** Skype uses a proprietary protocol that only Skype can understand. Ekika
    uses an open protocol, called SIP, so if you are starting out with Voice Over
    IP, use Ekika to avoid being tied to one program. Ekika can also talk H.323, so
    you can connect with Windows NetMeet clients as well.


    # Additional Applications


    The Ubuntu desktop does not cater to everybody, so there are some classes of applications
    that, by default, are not installed. Some of the common ones are listed in this
    section.


    # Office and Finance


    Personal Accounting


    +   - Windows: Quicken, Microsoft Money

    - Ubuntu alternatives: Grisbi, Gnucash


    Accounting


    +   - Windows: Intuit Quickbooks

    - Ubuntu alternative: TurboCASH


    Desktop Publishing


    +   - Windows: Microsoft Publisher

    - Ubuntu alternative: Scribus'
