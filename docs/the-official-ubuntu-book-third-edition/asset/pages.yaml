  md: '# Adding and Removing Programs


    APT: Advanced Package Tool, or APT, describes the entire system of online repositories
    and the parts that download them and install them.


    Repositories or software channels: In the Ubuntu world, these giant online warehouses
    of software are divided between official Ubuntu repositories and unofficial ones.


    Packages: Applications are stored in packages that not only describe the program
    you want to install but also tell you what it needs to run and how to safely install
    and uninstall it.


    # Installing with Synaptic


    Synaptic is a powerful graphical tool called a package manager. While Add/Remove
    Applications deals with all packages, including applications, system libraries,
    and other pieces of software. Changing the system on this level is more difficult
    but allows more detailed control. For instance, you can choose to install a specific
    library if you need it for a program not available in a package format.


    To find Synaptic, look under the System menu and then the Administration menu.
    It is listed as Synaptic Package Manager. Launch the task by clicking the icon,
    and you will see the main window, as shown in Figure 4-4.


    > TIP What''s in a Name? Why the name Synaptic? Synaptic is a play on words, based
    on the word apt, which is the Debian package management system. Ubuntu is based
    on Debian and also uses APT.


    Synaptic is a graphical package manager and works slightly differently than Add/Remove
    Applications. Unlike Add/Remove Applications, Synaptic deals directly with packages,
    which allows for a greater level of control while exposing the details of how
    package management works.


    Installing a Package As with Add/Remove Applications, installing packages with
    Synaptic is fairly easy. After you find the package you wish to install, click
    the checkbox to the right of the name of the package and select Mark for Installation.
    A dialog box may pop up (Figure 4-5) showing you what else needs to be installed—if
    anything—which you can'
