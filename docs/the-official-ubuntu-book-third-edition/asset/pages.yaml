    system in sufficient detail. However, if we were to write in detail about every
    possible feature in Ubuntu, you would need to buy a new bookcase to store the
    sheer amount of content.


    Part of the challenge in creating The Official Ubuntu Book was selecting the topics
    and content that can be covered within a reasonably sized book. As such, we have
    identified the most essential content to be covered and written about it. These
    chosen topics not only include coverage of installation, use of the desktop, applications,
    multimedia, system administration, and software management but also include a
    discussion of the community, online resources, and the philosophy woven into Ubuntu
    and open source. In addition, we managed to squeeze in a chapter full of useful
