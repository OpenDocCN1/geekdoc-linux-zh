  md: '# APPENDIX A

    Welcome to the Command Line


    ONE OF THE MOST powerful parts of any Ubuntu system is the command line. It can
    also be one of the most daunting to dive into. There is often little help, and
    commands are not easy to find. But if you are willing to learn, the power of the
    command line will speed up your work and can be a great education.


    While the command line is a nice addition to a desktop user''s life, it is completely
    invaluable if you run a server. The Ubuntu server installs without any graphical
    user interface, so the tools explained in this chapter and other books will be
    absolutely critical to success. And hey, remember to have fun!


    # Starting Up the Terminal


    The terminal can be found under Accessories > Terminal. When it first launches,
    you will see something similar to what Figure A-1 shows.


    You will see a blinking cursor immediately preceded by a string ending in a s
    . The first word in that string is your username, followed by the @ symbol. After
    the @ hostname of your computer is listed, followed by the name of the folder
    you are currently in (currently your home folder), which is represented by a ~
    symbol.


    There are many dozens of commands. This appendix presents a few, broken down by
    category.


    # Moving Around the Filesystem


    Commands for moving around the filesystem include the following.


    +   * pwd: The pwd command allows you to know the directory in which you''re located
    (pwd stands for “print working directory”). For example'
