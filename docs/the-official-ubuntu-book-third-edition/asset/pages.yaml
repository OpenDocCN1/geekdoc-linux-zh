  md: '# Chapter 6 Support and Typical Problems


    QUICK TIP If you have sufficient permissions but still can''t write to the drive,
    jump to the next sub-section, I Still Can''t Write to My Drive!


    To change these permissions, fire up a terminal, and move to the /media folder:


    ```

    foo@bar:~$ cd /media

    ```


    Now take a look at which drives are in there:


    ```

    foo@bar:~$ ls -al

    ```


    In the output that appears, you should see usdisk as one of the entries. Now change
    the permissions so everyone can access it:


    ```

    foo@bar:~$ chmod a+w usdisk

    ```


    You should now be able to access the disk.


    # I Still Can''t Write to My Drive!


    If you have permissions to access the drive but still can''t write to it, the
    problem is likely to be a filesystem issue. On a storage device such as a floppy
    disk, USB key, or hard drive, a specific type of filesystem is used to manage
    how the files are written to the physical disk. Ordinarily, you don''t need to
    worry about this. When things go wrong, it''s time to figure out the details.


    There are a number of different filesystems. The default Linux system is ext3.
    In the Windows world, a few other filesystems are available, such as FAT16, FAT32,
    and the NTFS system used by Windows NT.


    Although FAT16 and FAT32 are fully supported in Ubuntu, an NTFS filesystem cannot
    be written to on a Linux computer. However, recent new code has gone into the
    Linux kernel to NTFS with FUSE or a kernel module. This code is still rather experimental
    and not included in a stock Ubuntu system, so be careful when playing with it.'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'To find out which filesystem the device uses, run the following command:


    ```

    foo@bar:~$ sudo mount

    ```


    In the output, look for the /dev/sda or /dev/sdb1 line. USB devices are usually
    located at either of these locations. You can see the filesystem next to where
    it says type, as in this example:


    /dev/sda on /media/usbdisk type ext3 (rw,noexec,nosuid,nodev)


    In this example, the filesystem is ext3. You can also add the umask=0000 option
    if you want to allow any user to read the disk.


    If the filesystem is supported (ext3, VFAT, FAT16, FAT32) but you still can''t
    access the disk, the filesystem may be corrupted. In cases such as this, it makes
    sense to format the disk with a new filesystem.


    Before you format your disk, make absolutely sure that you are happy to remove
    the entire contents of the disk. If you need the files on the disk, have a look
    around the Internet and post to the Ubuntu forums to see if anyone else can help
    you before you format the disk. Formatting is really the last option you have
    available!


    # How Do I Format a Disk?


    When most people think of formatting a disk, they think it is the process of deleting
    everything on the disk. Formatting a disk actually involves a little more, and
    it completely replaces the filesystem on the disk.


    A side benefit to formatting a disk is making the disk work on different computers.
    Only certain types of filesystems are supported by each OS, and formatting a disk
    with a common filesystem can ensure that it works with these different operating
    systems. As an example, if you format a USB key with the ext3 filesystem, it won''t
    work in Windows. If you use the VFAT filesystem, it will work in both Windows
    and Linux.


    Formatting is fairly simple, and you just need to know the location of the device.
    USB storage devices (such as USB keyring drives and key fobs)'
  merge: -1
  pgno: 260
