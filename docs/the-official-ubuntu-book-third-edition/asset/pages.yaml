  md: '# Ubuntu Package Management


    The APT sources are specified in the file /etc/apt/sources.list. Let''s open this
    file in an editor. (If you''re not used to vim, substitute nano for it, which
    is an easier-to-use, beginner-friendly editor.)


    ```

    $ vim /etc/apt/sources.list

    ```


    The lines beginning with a hash, or # denote comment lines and are skipped over
    by APT. At the top, you''ll see the CD-ROM source that the installer added, and
    following it these two lines (or something similar):


    ```

    deb http://us.archive.ubuntu.com/ubuntu/ hardy main restricted

    deb-src http://us.archive.ubuntu.com/ubuntu/ hardy main restricted

    ```


    We can infer the general format of the APT sources list by looking at these lines.
    The file is composed of individual sources, one per line, and each line of several
    space-separated fields. The first field tells us what kind of a source the line
    is describing, such as a source for binary packages (deb) or source code packages
    (deb-src). The second field is the actual URI of the package source, the third
    names the distribution which packages we want (hardy), and the remaining fields
    tell APT which components to use from the source we''re describing—by default,
    main and restricted.


    If you look through the rest of the file, you''ll find it''s nicely commented
    to let easily enable two extra repositories: the useful universe and the bleeding-edge
    backports. In general, now that you understand the format of each source line,
    you have complete control over the repositories you use, and while we strongly
    recommend against using the backports repository on a server, enabling universe
    is usually a good idea.


