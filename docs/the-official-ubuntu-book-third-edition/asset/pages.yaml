- img_proc: true
  md: '# Customizing Ubuntu’s Look and Feel


    Ubuntu supports a huge range of different languages, and many applications include
    a Translate This Application menu option in the Help menu so that all Ubuntu users
    can contribute translations in their language(s). If you would like to help with
    this effort, it is a fantastic contribution to the Ubuntu project.


    When the language selector first loads, it may ask you to update your language
    packs. Just click Yes to continue. Inside the dialog box of languages are listed,
    each of which has a Support checkbox listed next to it. For each language that
    you want available on the system, check the relevant boxes.


    When you have selected the boxes, click the Apply button, and the appropriate
    language packs are downloaded and installed. Now use the Default Language combo
    box to choose the new language. You need to log out and log back in for the changes
    to take effect.


    TIP


    Choosing a New Language\When you see the login screen, you can use the Language
    button to choose a language for that specific login session. When you select the
    language, you are asked if you want to make the default language or use it just
    for specific session.


    # Customizing Ubuntu’s Look and Feel


    Whenever we put someone in front of Ubuntu for the first time, there seems to
    be a uniform natural desire to tweak the look and feel of the desktop. It can
    be fun tweaking our desktops so they look just, and Ubuntu has great support for
    all kinds of adjustments. Do you want different-looking applications with a lime
    green background and crazy fonts? No problem; just don''t show it to anyone else.


    # Changing the Background


    To change the background of your desktop, right-click it and select Change Desktop
    Background. Inside the dialog box that appears, choose your wallpaper by clicking
    on an image, and the background will automatically change. Ubuntu comes with a
    limited range of preinstalled wallpapers so it is likely that you will want to
    add your own wallpaper. To do this,'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# Chapter 3 Using Ubuntu on the Desktop


    your wallpaper somewhere on your computer, and then use the Add Wallpaper button
    to select it. The new wallpaper can be selected from the list.


    If you are not really a wallpaper kind of person and would prefer just a color
    for the background, you can use the Desktop Colors controls at the bottom of the
    dialog box. The combo box provides three different types of background: Solid
    Color, Horizontal Gradient, and Vertical Gradient. Next to the combo box, click
    on the color chip to select the relevant color(s).


    # Changing the Theme


    When you are using your applications, the visual appearance of the buttons, scroll
    bars, widgets, and other bits and pieces are controlled by the theme. The built-in
    theming system can make your applications look radically different, and Ubuntu
    ships with a number of themes that you can try.


    Choosing a New Theme To choose a new theme, click System > Preferences > Appearance
    and then click on the Theme tab. Inside the tab that pops up are a number of themes
    that you can choose. Just click on a theme that you like, and the desktop will
    be adjusted automatically. You can further customize your theme by clicking the
    Customize button. A new dialog box appears that has tabs for the different parts
    of the theme you can configure. Click each tab, and select an entry from the list
    to create your own perfect theme.


    Installing New Themes To install a new theme, first head over to http://art.gnome.org
    and find a theme that you like. You need to look for Application Themes when browsing
    the site. Download it to your computer. Now Click System > Preferences > Appearance,
    and click the Install button in the Theme tab. Using the chooser, find the theme
    you just downloaded, and it will install automatically. Now select your new theme
    from the list.


    # Configuring a Screensaver


    To choose a different screensaver, click System > Preferences > Screensaver. The
    screensaver configuration tool then loads (Figure 3-35).'
  merge: -1
  pgno: 145
- img_proc: true
  md: '![](img/aa15f1f82061fdaf4ff1da575e3e1c52_146_0.png)


    **Figure 3-35** A number of screensavers are bundled with Ubuntu.


    On the left side of the window is a list of available screensavers. Click on a
    screensaver and you will see a preview appear in the space to the right of the
    list. You can then use the slider to select how long the computer needs to be
    idle before the screensaver kicks in.


    The Lock Screen When Screensaver Is Active checkbox can be selected to lock the
    screen when the screensaver starts and, as such, requires a user to enter the
    password to reactivate the desktop. This is useful if you work in an office and
    want to ensure that no one tampers with your computer when you are away.


    # ## Managing Your Files


    Files are the tofu and potatoes of any computer, and they need to be managed,
    copied, moved, renamed, grouped, and loaded. Included with Ubuntu is a powerful
    yet simple file manager called Nautilus that integrates tightly into your desktop.
    You''ll use it all the time even if you don''t often see the name.'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'Nautilus makes extensive use of drag and drop. Unlike the kind of file manager
    used in Windows with its tree view and listing of files, Nautilus displays files
    in a series of windows in which you can drag files around easily. For those who
    just can''t say goodbye to the tree view, Nautilus also supports that. Aside from
    providing a simpler user interface, Nautilus also includes a number of useful
    features such as video and image previews, emblems, bookmarks, permissions management,
    and more.


    # How Linux Stores and Organizes


    Before we use Nautilus, it is worthwhile to have a crash course in how files and
    folders are organized on a Linux system. If you have not used Linux before, this
    is likely to be new to you because the layout is quite different from Windows
    and Mac OS X.


    TIP Folders and Directories

    When reading about file management, don''t get confused by the terms folders and
    directories—both words describe the same thing.


    In the Windows world, each disk drive is labeled with an identifying letter such
    as C: for your hard disk and A: for the floppy drive. In the Linux world, however,
    everything is part of the same filesystem organization. As such, if you have two
    or three hard disks, a CD drive, and a USB stick all plugged in, they will all
    be part of the same folder structure.


    The diagram shown in Figure 3-36 should give you an idea of how everything hangs
    together.


    ![](img/aa15f1f82061fdaf4ff1da575e3e1c52_147_0.png)


    Figure 3-36 Linux filesystem organization'
  merge: -1
  pgno: 147
- img_proc: true
  md: 'Right at the top of the tree is the root folder, referred to as /. Inside this
    folder are a number of special system folders, each with a specific use. As an
    example, the /home folder contains a number of home directories for each user
    on the system. As such, the mako user account has the home folder set to /home/mako.


    # Which Folder Does What? The folder structure in a modern Linux distribution
    such as Ubuntu was largely inspired by the original UNIX foundations that were
    created by men with large beards. Although you don''t really need to know what
    these folders do, since Ubuntu looks after the housekeeping for you, some of you
    may be interested in the more important folders. For your pleasure, we present
    the Linux folder hit list in Table 3-1.


    | Table 3-1 Linux Folders |

    | Folder | Use |

    | /boot | This folder contains important files to boot the computer, including
    the bootloader configuration and the kernel. |

    | /dev | Each device on your system (such as sound cards, Webcams, etc.) has an
    entry in this folder. Each application accesses the device using the relevant
    items inside/dev. |

    | /etc | Systemwide configuration files for the software installed on your system
    are stored here. |

    | /home | Each user account on the system has a home directory that is stored
    here. |

    | /lib | Important software libraries are stored here. You should never need to
    delve into this world of the unknown. |

    | /media | Media devices as CD drives and USB sticks are referenced here when
    they are plugged in. More on this later. |

    | /mnt | Other devices can be mounted, too. Again, more on this later. |

    | /opt | Optional software can be installed here. This folder is usually used
    when you want to build your own software, you ignore this folder. |

    | /proc/sys | Information about the current running status of the system is stored
    here. |

    | /root | This is the home directory for the main superuser. |

    | /sbin | Software that should be run only by the superuser is stored here. |

    | /usr | General software is installed here. |

    | /var | This folder contains log files about the software on your computer. |'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# Chapter 3 Using Ubuntu on the Desktop


    **Configuration Files** In Table 3-1, /etc is described as storing system configuration
    files for your computer. Aside from these files that affect everyone, there are
    also configuration files for each specific user. Earlier, when you customized
    Ubuntu''s look and feel, the settings were applied only to your current user account.
    So where are these settings stored?


    Inside your home directory are a number of folders that begin with a dot (.),
    .gnome2 and .openoffice2. These folders contain the configuration settings for
    specific applications for that specific user. By default, these dot folders are
    hidden in Nautilus because you rarely need to access them. For future reference,
    you can view these hidden files and folders by clicking View > Show Hidden Files.


    You can start Nautilus from a number of different places, but the easiest way
    to launch Nautilus is from Places > Home Folder to load your home folder. When
    the folder loads, you should see something similar to what Figure 3-37 shows.


    ![](img/aa15f1f82061fdaf4ff1da575e3e1c52_149_0.png)


    Figure 3-37 Accessing your home folder files is as simple as clicking Places >
    Home Folder.'
