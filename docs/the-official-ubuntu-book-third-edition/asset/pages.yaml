  md: '# "Restricted" Component


    The restricted component is reserved for software that is very commonly used and
    which is supported by the Ubuntu team even though it is not available under a
    completely free license. Please note that it may not be possible to provide complete
    support for this software since we are unable to fix the software ourselves but
    can only forward problem reports to the actual authors.


