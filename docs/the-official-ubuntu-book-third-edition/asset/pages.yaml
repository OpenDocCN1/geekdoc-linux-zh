  md: 'WITH UBUNTU INSTALLED and ready to go, it''s time to get started using your
    new desktop. The stock install of Ubuntu provides a very complete and flexible
    system. Unlike other operating systems, Microsoft Windows for example, Ubuntu
    includes everything you need to get started, such as an office suite, media tools,
    a Web browser, a graphics package, an e-mail client, and more. With the installation
    complete, you are up and running right away.


    Using a computer is a rather individual process, and different people use their
    computers in different ways. To help promote this choice, Linux has the capability
    to use any one of a number of different graphical interfaces. This flexibility,
    combined with the ballooning popularity of Linux and open source, has resulted
    in literally hundreds of different graphical environments springing up, each covering
    these different types of users and ways of working.


    Despite this huge range of different environments available, there are two clear
    leaders in KDE and GNOME. Both environments provide a comprehensive and easy-to-use
    desktop, but they differ in how that desktop is used. The KDE system is more akin
    to Windows and aims for complete configurability of your desktop. The competing
    GNOME desktop shows inspiration from both Windows and Mac OS X and sets as a priority
    simplicity and ease of use. Luckily, Ubuntu users are blessed with the choice
    of either desktop—the default desktop in stock Ubuntu is GNOME, and the Ubuntu
    distribution uses the KDE desktop. Ubuntu is covered in Chapter 8.


    In this chapter, you get started with GNOME and use it to do the normal and not-so-normal
    things you face every day with your computer. This includes opening and running
    applications, managing your files, adjusting the look and feel, using applications,
    managing your media, and more. Buckle up and get ready to take your shiny new
    desktop for a drive!


    # The Ubuntu Desktop Is GNOME


    When reading about Ubuntu, you often see the terms Ubuntu desktop and GNOME used
    interchangeably. Both of these terms refer to the same thing—the default Ubuntu
    desktop is a version of GNOME itself. Of course, Ubuntu provides several other
    desktops, including KDE (in Ubuntu), Xfe (in Ubuntu), and a variety of others.


    TIP'
  merge: -1
  pgno: 99
- img_proc: true
  md: '# Taking Your Desktop for a Ride


    When you start your Ubuntu system, you are asked for a username and password to
    log in with. In the last chapter you specified a user account when installing
    the system, so use that to log in. First type in your username and press Enter,
    then enter your password and press Enter.


    TIP


    Language? Sprache? Lingue? Lingua?\Click the Options > Select Language button
    to change the language of the desktop. If you click the button and the selection
    does not include your language, jump to the Ubuntu section on page 102 to learn
    how to add new language packs.


    After a few seconds you will see the Ubuntu desktop appear (Figure 3-1). The desktop
    comprises three main areas.


    +   1. At the top of the screen is the panel. This bar contains the desktop menu
    options and application shortcut icons on the left side as well as the notification
    area on the right side. You use this bar to load applications and to see the status
    of certain activities on your system. The panel is always visible when you use
    your desktop.


    ![](img/aa15f1f82061fdaf4ff1da575e3e1c52_100_0.png)


    **Figure 3-1** The Ubuntu desktop is simple, uncluttered, and . . . brown.'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# Chapter 3 Using Ubuntu on the Desktop


    +   2. The large middle part of the screen is the desktop. This part of the

    screen is normally covered by the applications that you use, but you

    also put icons and shortcuts on the desktop, too.


    +   3. The bottom part of the screen is called the taskbar. This area displays

    rectangle for each open application, just like in Windows.


    You may have noticed that, unlike other operating systems, there are no

    ics on the desktop. The reason for this is that desktop icons typically get

    covered by applications, and, as such, you can''t get at them. If you need to

    start applications, you typically use the Applications menu or the shortcuts.


    # Device Icons


    There are no application icons on the desktop, when you plug in USB devices such

    as portable music players, keyring drives, or digital cameras, a device icon will
    appear on the

    desktop.


    # Starting Applications and Finding Things


    Starting applications is simple. Just click on the Applications menu on the

    left side of the panel. Inside this menu are a number of submenus for dif-

    erent types of applications. Hover your mouse over each category, and

    then click the application you want to load. As an example, click on Appli-

    cations > Internet > Firefox Web Browser. After a few seconds the browser

    will pop up.


    When applications are loaded, the brown window border has three but-

    tons on the right-hand side:


    +   Left button (thin white line): This is used to minimize the applica-

    tion and put it in the taskbar.


    +   Middle button (white square): This maximizes the window to take

    off the full desktop area.


    +   Right button (white cross): This closes the application.


    Every application has an entry in the taskbar at the bottom of the screen.

    You can click these entries to minimize or maximize the application and

    right-click to see some other options.'
  merge: -1
