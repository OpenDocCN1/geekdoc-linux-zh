    # TIP


    Another Way into the Bug-Tracking System

    You can also access the bug-tracking system by going to Launchpad, clicking the
    Bugs link in the right sidebar, and then entering the name of the application
    in the text box farther down the page. If possible, it is generally recommended
    that you use the Help menu approach as it will automatically pick the right application
    for you.


    The first step is to check whether the bug has already been reported. In the right
    sidebar of Launchpad are a series of menu options. Each bug added to the system
    is automatically given a unique ID for the bug, and you can search for this number
    if needed. You can alternatively search for something related to the problem.
    As an example, search for “crash” or “hang”. If you find your bug has already
    been reported, you can stay updated with changes related to the bug by clicking
    the Subscribe link in the right sidebar.


    If no bug exists, you should report it yourself. To do this, click the Report
    a Bug in <application name> in Ubuntu link. Simply fill the Summary box with a
    single-line description of the bug, and then use the Description box to fill in
    the details. You should be as detailed as possible and include your computer''s
    specifications, any special steps you went through to trigger the bug, the effects
    of the bug, and how you expected the software to work. Try to be detailed, keep
    everything you relevant to the bug. If you would prefer to keep your bug report
    confidential, select the checkbox for that, but it is highly recommended that
    you keep your bug reports public if possible. This means that as many people as
    possible can see the report and possibly act on it.


    With the bug submitted, you will receive e-mail updates about the progress the
    developers are making to fix the bug. In some cases the developers may ask you
    to run commands or try different things to help narrow down the bug so they can
    fix it.


    Bug reporting is an essential process in which everyday users of Ubuntu can really
    help keep the software as bug-free and stable as possible. It is a truly valid
    contribution to the open source community.'
