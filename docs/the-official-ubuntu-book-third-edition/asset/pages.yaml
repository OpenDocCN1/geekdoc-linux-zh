  md: '# Web Forums


    The official Ubuntu forums are the most frequently used venues for communication
    in Ubuntu. For a number of reasons, many users prefer communication through a
    Web-based forum or bulletin board to mailing lists. The Ubuntu forums were created
    to satisfy this group and have done so with amazing success. Figure 7-2 shows
    an example of forum use.


    The forums are accessible online at www.ubuntuforums.org and have shown an impressive
    amount of usage. Statistics as of the time of writing activity of more than 4,200,000
    messages on more than 660,000 topics in nearly 100 different forums. The forums
    also boast more than thousands of users active at any given point. The forums
    have continued to grow exponentially and have doubled in size since the last printing
    of this book in 2007 and doubled in the year after as well.


    ![](img/aa15f1f82061fdaf4ff1da575e3e1c52_289_0.png)


