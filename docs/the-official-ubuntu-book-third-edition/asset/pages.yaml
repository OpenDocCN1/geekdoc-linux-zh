    # The Purpose of the “Restricted” Component


    The Ubuntu team recognizes that many users have vital hardware in their computers
    that requires drivers that are currently only available in binary format. We urge
    hardware vendors to insist that their suppliers provide open source drivers for
    their components, but we recognize that in some cases binary drivers are the only
    way to make your hardware work. As a result, Ubuntu includes several of these
    drivers on the CD and in the repository, clearly separated from the rest of the
    software by being placed in the restricted component.


    Binary drivers are a poor choice, if you have a choice. Without source code, Ubuntu
    cannot support this software. We only provide for users who require it to be able
    to run the free software we provide in main. Also, we cannot make binary drivers
    available on other architectures (such as the Mac or IPAQ) if we don''t have the
    ability to port the software source code ourselves. If your hardware is fully
    supported with open source drivers, you can simply remove the restricted component,
    and we would encourage you to do so.


    # Software Installed by Default


    When you install Ubuntu, you will typically install a complete desktop environment.
    It is also possible to install a minimal set of software (just enough to boot
    your machine) and then select the precise software applications to install. A
    custom install is usually favored by server administrators, who prefer to keep
    only the software they absolutely need on the server.


    All of the application software installed by default is free software. In addition,
    we install some hardware drivers that are available only in binary format, but
    such packages are clearly marked in the restricted component.'
