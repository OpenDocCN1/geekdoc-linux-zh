- img_proc: true
  md: 'this word with the md5sum given by the owner of the .iso file, usually a file
    named md5sums. The words should match. If they do not match, you should redownload
    the file and test it again.


    # I Download an Autopackage, but I Don''t Know How to Run It


    Autopackages are software packages that install on any Linux distribution, including
    Ubuntu. Autopackages offer a way to install software on your system that is not
    available via Synaptic. If you need something Synaptic can''t offer, Autopackages
    are an alternative.


    Replacing an Application with an Autopackage

    If you are running an existing application that was installed via Synaptic and
    you want to replace it with an Autopackage, make sure that you uninstall the application
    first with Synaptic. Autopackages do not work in conjunction with Synaptic, so
    ensure that you remove any applications before you install the Autopackage.


    When you find an Autopackage that you want to install, download it to your desktop.
    Now, right-click the package, and select Properties. In the Permissions tab, select
    the Execute checkbox on the Owner row. Now close the dialog box, and double-click
    the package.


    The installation program now begins, and you can just follow the onscreen instructions.


    # How Do I Compile an Application?


    When a distribution package is not available, the source code is always available
    to compile with open source applications. Compilation is the process of converting
    programming code into a program that you can run and use. Although it sounds like
    a devilishly difficult process, it is typically fairly simple.


    You should first have a look on the application''s Web page, or in the INSTALL
    or README file included with the code, to see what software the application needs
    to run. When you know what is required, use Synaptic to'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# The System 193


    search for the required tools. Many of the requirements will be software libraries
    (software that applications require to run), and these libraries typically have
    lib at the start of the package name. As an example, if you need to have the Ogg
    Vorbis audio codec installed, do a search in Synaptic for Ogg Vorbis, libvorbis
    will be one of the packages. You should also install the package with -dev at
    the end of the name (such as libvorbis-dev). These packages allow you to compile
    software for that library.


    The process of compiling software involves three steps: (1) configuration, (2)
    compilation, and (3) installation. Open a terminal, move into the directory from
    which you extracted the source code, and configure it:


    ```

    foo@bar:yourapp$ /configure

    ```


    When run /configure, it checks to see that you have all the required software.
    If it throws an error, it is likely that a required tool or library is missing.
    Find out what it is, and install it. Typically, configure will tell you what you
    need to install.


    If the configure script works fine, compile the code with this command:


    ```

    foo@bar:yourapp$ make

    ```


    If a problem appears when compiling the software, it may be a bug or problem in
    the source code. It is best to refer your problem to the author of the code for
    further help.


    If the compile process was successful, install the application with this command:


    ```

    foo@bar:yourapp$ sudo make install

    ```


    The software is now fully installed.


    QUICK TIP If you want to ensure that you have all the right tools installed to
    build your application, run the following command:


    ```

    foo@bar:~ sudo apt-get build-deppackagename

    ```'
