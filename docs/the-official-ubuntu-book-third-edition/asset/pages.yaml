  md: '# Troubleshooting LTSP


    to try to give some helpful hints about how to diagnose and fix common LTSP problems.
    The LTSP Web site, www.ltsp.org, has a large wiki and knowledge base to help you
    find answers to your LTSP problems.


    # The Computer Is Not Obtaining an IP Address


    If your client machines are not receiving IP addresses, it is likely that there
    is a problem with the DHCP server. In order to check this, you must load a terminal
    window and run the following command:


    ```

    pidof dhcp3 2&> /dev/null && echo OK

    ```


    If this shows the result is okay, the problem lies elsewhere. If the result shows
    that the DHCP server is not running, it is time to check the DHCP logs for errors.
    To do this, you must restart the DHCP server and view the logs. Restart the server
    by using the following command:


    ```

    sudo /etc/init.d/dhcpd-server restart

    ```


    If at this stage you see a FAIL message on starting the DHCP server, know that
    there must be a problem with the dhcpd configuration. Checking the logs in the
    way shown should lead you to the problem. You can see the last errors that the
    dhcpd server had by running the following command:


    ```

    tail /var/log/daemon.log

    ```


    A variety of problems can be shown by using this method, and after you have a
    better idea of what the problem is, you may be able to solve it your-self. You
    can also contact the Edubuntu team for help by using the information provided
    at the end of this chapter.


    # NFS Server Is Not Responding


    If your clients exhibit an error, similar to nfs warning: server not responding,
    it is possible that the kernel is using too large a block size for the NFS packets.
    In essence the kernel uses a 32K block size, which must be broken down into 1,500
    byte datagrams. Since this results in a large number of small datagrams being
    sent, the client can time out before receiving all the data. Fortunately, the
    fix is simple enough.'
  merge: -1
