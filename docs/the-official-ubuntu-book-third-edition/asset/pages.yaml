    computer.


    # My CD-ROM/DVD Drive Is Not Working


    If you are having problems accessing your CD-ROM/DVD drive, it is most likely
    because it is not mounted. Click Places > Computer, and look at the CD-ROM/DVD
    drive icon in the window. If the CD drive is not mounted, the icon looks like
    a drive; otherwise, it looks like a disc. If the drive isn''t mounted, right-click
    it, and click Mount Volume.


    # My CD-ROM/DVD Drive Won''t Eject


    If you press the eject button on your CD-ROM drive and it won''t eject a disc,
    click Places > Computer, right-click the CD-ROM/DVD drive, and select Eject. If
    this doesn''t work, load up a terminal by clicking Applications > Accessories
    > Terminal, and type:


    ```

    foo@bar:~$ eject

    ```


    # I Bought a Device, but It Doesn''t Work in Ubuntu


    When you buy a hardware device such as a graphics card, sound card, DVD drive
    or Webcam, the device needs to have a driver installed for it to work.


    Sometimes you need to go looking for a driver, or even find whether Ubuntu supports
    it at all. To do this, search the Ubuntu forums or wiki, or you can do a general
    search on the Internet for your device and the keyword Linux. After a bit of hunting
    around, you will probably find a driver that is available but obviously was not
    included with Ubuntu. Your first job should be to submit a bug report to say that
    the driver is not included in Ubuntu (see the subsection It Was Suggested I File
    a Bug'
