  md: 'Chapter 4 Advanced Usage and Managing Ubuntu


    # Copy Your Files to the Hard Disk

    USB comes in two major forms: USB1 and USB2, with the latter being far quicker.
    If you have a multimedia software file such as an audio or video clip or another
    large file, you may want to copy it to a hard disk before you load it. Hard disks
    provide faster load times than the other media.


    TIP


    # Burning CDs

    Burning files is simple in Ubuntu with its built-in support for CD writers. Simply
    pop a writable CD into the drive and an icon appears on the desktop. Double-click
    the icon, and an empty file manager window appears. Now drag the files to be burned
    into this window. When you are ready to burn the CD, click File > Write to Disk.


    A dialog box appears, and you can configure a few items before the disk is burned.
    Enter a name for the disk in the Disk Name box, and use the Use Write Speed combo
    box to select the best write speed for your drive. If you have an old or unreliable
    CD writer, you may want to select a slower speed to prevent a burn error. Finally,
    click the Write Disk button to start the burn.


    QUICK TIP


    You can also access the burner by clicking Places > CD/DVD Burner.


    Burning a CD from an Image With more and more people are often released as downloadable
    open source software, installation disks .iso files. When you burn these files
    to a CD, the files from the disk image are restored and the resulting CD looks
    just like a normal CD.


    To burn an .iso file to a CD, simply right-click it and select Write to Disk.


    TIP


    # More Complex Burning

    If you are looking for a complete application to cater to virtually all CD burning
    needs, install the GNOME Baker application using Synaptic or Add/Remove Applications.'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# Using Floppy Disks


    To use a floppy disk in Ubuntu, insert the disk in the drive and select Places
    > Computer. Now double-click on your floppy drive to mount it and display the
    files. When you have finished using the disk, right-click the floppy drive and
    select Unmount.


    # Using Digital Cameras


    When you plug a digital camera into your computer, a device icon automatically
    appears on your desktop, and Ubuntu pops up a window asking if you want to view
    the photos from your camera. You can then view the photos and drag them from the
    photo viewer window over to a file manager to save the photo.


    Always remember that the majority of digital cameras are just USB devices, and
    you can access the photos like any other USB device within the file manager.


    TIP


    Ubuntu and Digital Photography

    Ubuntu is a fantastic platform for digital photography and photo manipulation.
    F-Spot tool provides a complete solution for managing your photo collection and
    can be started by clicking on Applications > Graphics > F-Spot Photo Manager.


    For photo manipulation, GIMP provides a comprehensive tool and is preinstalled.
    Load it by clicking Applications > Graphics > GIMP Image Editor.


    # Configuring a Printer in Ubuntu


    In the Linux world, configuring a printer has traditionally been a challenge.
    For newcomers to Linux have been repeatedly challenged and even bludgeoned with
    terms, commands, and phrases such as CUPS, lpd, and "etc/cups/printers.conf as
    root." Users often had to edit fairly complex text files by hand and spend a good
    deal of time learning how to insert arcane instructions just to get a printer
    to work. Things have changed with Ubuntu, however.'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# Making It Easier with Printer Configurations


    Although you might still encounter some challenges, Ubuntu has made a standard
    home printer much easier with the Printer configuration application. Using the
    application, you can configure both locally attached printers and those that reside
    on a remote networked system. You can run this application by pointing your mouse
    to the System > Administration menu, and then clicking on the Printing option,
    as shown in Figure 4-12.


    Selecting this option will bring up the Printers window, as shown in Figure 4-13.


    Notice that no printers are defined. You are about to change this.


    The Printer configuration application allows you to add printers, as well as modify
    their settings. You can also use this application to add and configure your printers.
    In the upcoming example, you will add a new printer and then view its settings.


    ![](img/aa15f1f82061fdaf4ff1da575e3e1c52_175_0.png)


    Figure 4-12 Selecting the Printing application from the System > Administration
    menu in Ubuntu'
  merge: -1
