    # Local Community Teams


    Local community teams, affectionately referred to as LoCos in the community, are
    an extremely important type of team. Each LoCo is responsible for promoting, supporting,
    and representing Ubuntu in a particular locale. These locales are usually geographical
    and frequently nationwide, although in some situations they may overlap geographically.
    Ubuntu tries to encourage LoCos to work together whenever possible.


    LoCos are like Linux User Groups (LUGs) and may often work closely with or be
    associated with a LUG. LoCos are often involved in localization or translations
    of Ubuntu into local languages and advocacy in local schools, public administrations,
    and communities. The best Loco meet regularly for social events, talks, and discussion.
    Often, they meet for installfests where team members help new users install Ubuntu
    onto their computers. Representatives of LoCos are asked to assist with localization
    matters, to speak on behalf of the Ubuntu project at local conferences and trade
    shows, and to organize a booth or presence at such events.


    Canonical Ltd. provides each team with a mailing list and a domain name (usually
    in the form of ubuntu-<CC>.org, where CC is the country’s two-letter country code).
    Canonical is also willing to host LoCo Web pages, wikis, forums, blogs, and additional
    mailing lists. LoCos are open to participation by anyone.


