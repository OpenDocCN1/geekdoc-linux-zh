  md: '# APPENDIX D

    Ubuntu Equivalents to Windows Programs


    FOR THOSE OF YOU who are moving to Ubuntu from Windows, often simply knowing which
    application to use is half the battle. This appendix shows common Windows applications
    and their Ubuntu counterparts. Your Windows-using friends shouldn''t be completely
    shut out, so there are some applications for them to use also.


    # On the Ubuntu Desktop


    Listed here are common Windows applications that already have an equivalent installed
    on the Ubuntu desktop. Some common alternatives are also listed.


    # Word Processing


    +   * Windows: Microsoft Word

    * Ubuntu: OpenOffice.org Writer

    * Alternative: Abiword


    # Spreadsheet


    +   * Windows: Microsoft Excel

    * Ubuntu: OpenOffice.org Calc

    * Alternative: Gnumeric


    # Presentation


    +   * Windows: Microsoft PowerPoint

    * Ubuntu: OpenOffice.org Impress'
  merge: -1
  pgno: 460
- img_proc: true
  md: '# Database


    +   - Windows: Microsoft Access

    - Ubuntu: OpenOffice.org Base

    - Alternative: Glom


    # Web Browser


    +   - Windows: Internet Explorer or Mozilla Firefox

    - Ubuntu: Mozilla Firefox

    - Alternative: Epiphany


    Mozilla Firefox runs on Windows as well as Linux, allowing you to have the same
    browsing experience.


    # E-Mail


    +   - Windows: Microsoft Outlook Express, Microsoft Outlook, or Mozilla Thunderbird

    - Ubuntu: Evolution

    - Alternative: Mozilla Thunderbird


    # Media Players


    +   - Windows: Windows Media Player, iTunes, Winamp

    - Ubuntu: Rhythmbox, Totem Movie Player

    - Alternatives: Banshee, Muine, Beep Media Player


    Due to patent restrictions. Ubuntu cannot install the codecs for some media Codecs.
    Please see Chapter 3 for information on how to do this.


    # Photo Editor


    +   - Windows: Adobe Photoshop or GIMP

    - Ubuntu: GIMP'
