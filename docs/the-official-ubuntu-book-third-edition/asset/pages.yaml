  md: '# The Desktop Has Hung—What Do I Do?


    In the rare situation that the desktop hangs, first try to restart it by pressing
    Alt-Ctrl-Ctrl-Backspace. This kills and restarts the X server. Another method
    of killing the X server is to press Alt-F2 to jump to a terminal, log in, and
    then run this command:


    ```

    foobar~$ /etc/init.d/gdm stop

    ```


    This command stops the graphical login screen, which in turn stops the X server.
    You can restart it with this command:


    ```

    foobar~$ /etc/init.d/gdm start

    ```


    # My Screen Resolution Is Wrong


    If your screen resolution is incorrect, click System > Administration > Screens
    and Graphics, and select a new resolution from the combo box.


    # How Can I Automatically Log In Without Having to Enter My Login Details?


    If logging is a drag for you, click System > Administration > Login Screen, and
    select the Login User Automatically on First Boot checkbox. In the checkbox below
    it, select the user who should be logged in automatically.


    Be careful when automatically logging in—anyone will have access to the computer
    when it is started. If you would prefer that certain people not have access to
    the computer, automatically logging in may not be such a good idea.


    +   Avoid Automating a Root Login


    In the tab of the Login Screen setup window, you can allow root to log in automatically.
    Although possible, this is not recommended due to the security implications. Automating
    a root login could allow anyone to tamper with your computer—so be careful!


    # I Tried to Upgrade My System, but I Got an Error


    If you get an error when you try to install some software or upgrade your computer,
    the package manager may have tied itself in a knot. To try to resolve this, open
    a terminal, and run the following commands:'
  merge: -1
  pgno: 235
- img_proc: true
  md: '```

    foo@bar:~$ sudo apt-get update

    foo@bar:~$ sudo apt-get -f install

    ```


    The first command updates your package list, and the second command tries to fix
    your package manager. If this is successful, the packages that failed will be
    installed correctly.


    In addition to these commands, you can reconfigure any packages that have not
    been configured by running this command:


    ```

    foo@bar:~$ sudo dpkg --configure --pending

    ```


    # I Am Running Out of Disk Space—How Do I Free Up Some Space?


    If you are concerned that you may be running out of disk space, you can use a
    few techniques to clear some room. Before you do anything, you should get a report
    of how much disk space is available. Under the Applications > Accessories menu
    you will find a tool called Disk Usage Analyzer. After it has loaded, click on
    the Home button. This will show you a graphical circular chart.


    The center circle represents the root folder being scanned, in this case, your
    home directory. Each directory that shows up as a ring. The larger the way around
    the ring, the greater percentage of the total it is using. To find out specifically
    which directory is referred to, run your mouse over that segment. With the diagram,
    you can now explore to find the largest files and folders and clean them as needed.
    Another task you can do is to clean your package cache. Every time a package is
    downloaded with Synaptic or with the automatic upgrade manager, it is stored in
    /var/cache/apt/archives/. You can clean these packages without affecting your
    system. Just run the following command:


    ```

    foo@bar:~$ sudo apt-get clean

    ```


    # I Deleted Something in the File Manager, but I Don''t See the Extra Disk Space


    When you delete files in the file manager, they are copied to the trash. To finally
    delete them, right-click the trash in the bottom right-hand corner'
  merge: -1
  pgno: 236
- img_proc: true
  md: 'of the screen, and click Empty the Trash. A dialog box pops up asking you to
    confirm the deletion. Click the Empty Trash button, and the files are removed.


    # Another Version of Ubuntu Is Out—nHow Do I Upgrade to It?


    If a new version of Ubuntu is released, the update manager will notify you via
    an upgrade notification pop-up bubble. To upgrade, click the Upgrade button, and
    follow the instructions.


    If you want to manually upgrade, you can also use the update manager. To update
    to an unstable version, run the update manager with the -d option, as follows:


    ```

    foo@bar:~$ sudo update-manager -d

    ```


    # Applications


    Applications are the lifeblood of any desktop computer, but they are also packed
    with configuration options, different types of functionality, and other things
    that could possibly trip you up. This section covers some of the common application-oriented
    problems in Ubuntu.


    # When I Click the Close Window Icon, My Program Doesn''t Go Away


    If your application seems to hang, and the window won''t go away, keep clicking
    the X icon. After a few seconds, a dialog box should appear indicating that the
    program has become inactive and asking if you want to close it.


    If this does not work, you can use xkill to stop it. Press Alt-F2, type xkill,
    and press Enter. Your mouse cursor changes to a small skull and cross-bones. Click
    the offending application window, and it will finally be banished to that place
    where naughty applications wallow.'
