    developers and advocates—Eric S. Raymond and Bruce Perens—saw the important business
    opportunity offered by a model that could harness volunteer labor or collaboration
    and create intrinsically better software. However, they worried that the term
    free was problematic for at least two reasons. First, it was highly ambiguous—the
    English free means both gratis, or at no cost (e.g., as in free beer), and liberated
    in the sense of freedom (e.g., as in free speech). Second, there was a feeling,
    articulated most famously by Raymond, all that this talk of freedom was scaring
    the very executives and decision makers whom the free software movement needed
    to impress in order to succeed.


    To tackle both of these problems, this group coined a new phrase—open source—and
    created a new organization called the Open Source Initiative. The group set at
    its core a definition of open source software that overlapped completely and exclusively
    with both Stallman''s four-part definition of free software and with other community
    definitions that were also based on Stallman''s.


    One way to understand the split between the free software and open source movements
    is to think of it as the opposite of a schism. In religious schisms, churches
