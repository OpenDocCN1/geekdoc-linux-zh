- img_proc: true
  md: '# Three other commands are useful for dealing with text.


    +   - cat: The cat command, short for concatenate, is adding to text files. The
    simple cat FILENAME displays the contents of the file. Using cat FILENAME adds
    the contents of the first file to the second.


    +   - nano: Nano is a simple text editor for the command line. To open a file,
    use nano filename. Commands listed at the bottom of the screen are accessed by
    pressing Ctrl followed by the letter.


    +   - less: The less command is used for viewing text files as well as standard
    output. A common usage is to pipe another command through less to be able to see
    all the output, as is | less.


    # Dealing with Users and Groups


    You can use the following commands to administer users and groups.


    +   - adduser: The adduser command creates a new user. To create a new user, simply
    type sudo adduser $username. This creates the user''s home directory and default
    group. It prompts for a user password and then further details about the user.


    +   - passwd: The passwd command changes the user''s password. If run by a regular
    user, it will change his or her password. If running sudo, it can change any user''s
    password. For example, sudo passwd joe''s password.


    +   - who: The who command tells you who is currently logged into the machine.


    +   - addgroup: The addgroup command adds a new group. To create a new group,
    type sudo addgroup $username.


    +   - deluser: The deluser command removes a user from the system. To remove the
    user''s files and home directory, you need to add the -remove-home option.


    +   - delgroup: The delgroup command removes a group from the system. You cannot
    remove a group that is the primary group of any users.'
