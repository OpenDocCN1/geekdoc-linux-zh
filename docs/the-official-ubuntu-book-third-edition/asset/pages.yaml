  md: '# System Information Commands


    +   - chown: The chown command allows the user to change the user and group ownerships
    of a file. For example, chown jim file changes the ownership of the file to Jim.


    System information commands include the following.


    +   - df: The df command displays filesystem disk space usage for all partitions.
    The command df-h is probably the most useful. It uses megabytes (M) and gigabytes
    (G) instead of blocks to report. (-h means “human-readable.”)


    +   - free: The free command displays the amount of free and used memory in the
    system. For example, free -m gives the information using megabytes, which is probably
    most useful for current computers.


    +   - top: The top command displays information on your Linux system, running
    processes, and system resources, including the CPU, RAM, swap usage, and total
    number of tasks being running. Exit top, press Q.


    +   - uname -a: The uname command with the -a option prints all information, including
    machine name, kernel name, version, and a few other details. This command is most
    useful for checking which you''re using.


    +   - lsb_release -a: The lsb_release command with the -a option prints version
    information for the Linux release you are running. For example:


    ```

    user@computer:~$ lsb_release -a

    LSB Version: n/a

    Distributor ID: Ubuntu

    Description: Ubuntu (The Breezy Badger Release)

    Release:

    Codename: breezy

    ```


    +   - ifconfig: This reports on your system''s network interfaces.


    +   - iwconfig: The iwconfig command shows you any wireless network adapters and
    the wireless-specific information from them, such as speed and network connected.'
