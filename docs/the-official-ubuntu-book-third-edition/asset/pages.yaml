  md: '# APPENDIX B

    Ubuntu Foundation Documents


    THIS APPENDIX CONTAINS the foundation documents for the Ubuntu project. The Canonical
    Ltd. location for each of these documents is the Ubuntu Web site, and any updated
    versions can be found there. These documents are presented verbatim except where
    wording or presentation assumed a Web-based reading. The appendix contains the
    following documents:


    +   - Code of Conduct

    - Leadership Code of Conduct

    - Ubuntu Philosophy

    - Description of Ubuntu Components

    - Ubuntu License Policy


    # Code of Conduct


    Ubuntu is an African concept of “humanity toward others.” It’s “the belief in
    a universal bond of sharing that connects all humanity.” The same ideas are central
    to the way the Ubuntu community collaborates. Members of the Ubuntu community
    need to work together effectively, and this Code of Conduct lays down the “ground
    rules” for our cooperation.


    NOTE The latest version of the Code of Conduct can be found at www.ubuntu.com/community/conduct.


    We chose the name Ubuntu for this distribution because we think it captures perfectly
    the spirit of sharing and cooperation that is at the heart of the open source
    movement. In the Free Software world, we collaborate freely on a volunteer basis
    to build software for everyone’s benefit. We improve on the work of others, which
    we have been given, and then share our improvements on the same basis.'
  merge: -1
