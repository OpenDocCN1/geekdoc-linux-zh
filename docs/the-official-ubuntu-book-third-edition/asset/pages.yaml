    # Multimedia


    Multimedia is playing an increasingly important role in modern desktops, and most
    people like to listen to music, watch movies, and watch videos on their desktops.
    Unfortunately, multimedia has had something of a checkered history in the Linux
    world due to the licensing problems with the all-important codecs required to
    view and hear media. This section explores some of the common problems faced with
    multimedia and your Ubuntu desktop.


    Restricted Formats


    You can get further help and guidance on restricted media formats that do not
    ship with Ubuntu by visiting http://help.ubuntu.com/community/RestrictedFormats.


    # I Downloaded a Particular Media File, and It Won''t Play


    Included with Ubuntu are open source codecs as Ogg Vorbis and Ogg Theora, the
    vast majority of media on the Internet use restrict licensed codecs such as MP3,
    Windows Media, QuickTime, and others.


    Ubuntu does not ship these codecs for legal reasons. It''s legally questionable
    to freely distribute most multimedia codecs because either the codec is patented
    or the player is reverse engineered and, as such, may fall afoul of the Digital
    Millennium Copyright Act (DMCA) in the United States. For most codecs, when you
    attempt to play the multimedia file, the movie or audio player will attempt to
    install the codecs as they are needed.


    Ubuntu 7.04 began shipping a new tool to help address this problem. If you try
    to play a file without a necessary codec, Ubuntu will prompt you'
