    Once you have properly prepared to install your printer, click on the New Printer
    icon. The system will then automatically search for any new connected printers
    and will launch a New Printer wizard, shown in Figure 4-14.


    In most cases, the wizards will be able to detect an attached printer automatically
    and include it in a list of devices on the left. Select the device with your printer''s
    name, and then hit forward.'
