- img_proc: true
  md: 'Next to this button is the applications area, which shows each of the currently
    open applications. For each application, an entry is added, and you can right-click
    it to view a context menu. This menu can also be used to minimize, maximize, resize,
    close, and otherwise control applications.


    QUICK TIP You can switch between multiple applications in Ubuntu just like in
    Windows by pressing Alt-Tab. When you press this key combination, a small window
    appears that can be used to switch between active applications.


    To the right of the applications area are two small rectangles that recall the
    workspaces. Each of these rectangles represents another screen in which you can
    view an application. As an example, you may be using your Web browser and e-mail
    client while talking to your friends in a client desktop and working on a document
    on the second desktop. You can then just click each virtual desktop to switch
    to it access your different applications. Another useful tip applies when you''re
    moving between virtual desktops—if you have an application on the first desktop,
    just-click the brown window or the taskbar entry, select Move to Another Workspace,
    and pick the relevant workspace number. The menu also has Move Left and Move to
    Workspace Right options. This makes moving between your workspaces quite simple.


    QUICK TIP Although Ubuntu has only two workspaces configured by default, you can
    have as many as you like. To configure them, right-click on one of the workspaces
    in the bottom right-hand corner of your screen, and select Preferences from the
    menu.


    TIP Usability and the Ubuntu Desktop Throughout the development of the Ubuntu
    desktop, great care and attention have gone into usability. As an example, the
    four corners of the screen are established as areas that are simple to access—you
    don''t need to carefully mouse over the area and can just throw your mouse to
    the corner. This is why each corner has an important feature. It makes accessing
    each feature that little bit easier.


    Ubuntu is filled with tiny usability improvements such as this that help make
    it as intuitive and powerful as possible.'
