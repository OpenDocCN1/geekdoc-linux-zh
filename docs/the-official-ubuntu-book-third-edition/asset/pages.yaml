    # # Using Your Applications


    Now that you have used the desktop, let''s explore some of the many applications
    included on your new system. By default, Ubuntu comes with a wide range of popular
    and established applications to listen to music, watch videos, browse the Web,
    manage your appointments, read your e-mail, create images, and manage these applications
    have been vetted by the developers to ensure they are the best-of-breed Linux
    applications available.


    Although Ubuntu includes a range of different software applications, it is likely
    you will want to install extra applications and explore other available software.
    Fortunately, the Ubuntu system is built on a powerful foundation that makes software
    installation as simple as pointing and clicking. Click Applications > Add/Remove,
    and a dialog box appears that you can use to install new applications. Just browse
    through the different categories and check the applications to install. Click
    the Apply button, and the application is downloaded and installed for you.


    This tool provides a simple way to access a limited core set of popular applications,
    but there are actually more than 20,000 packages available to your Ubuntu system.
    Software installation is discussed in detail in Chapter 4.


    # Another Way to Run Applications


    Although you will most typically start your applications by selecting them from
    the Applications menu, you can also press Alt-F2 to bring up a box where you can
    type the name of an application and run it.


