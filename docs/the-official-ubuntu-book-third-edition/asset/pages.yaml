    system. Although the new process for suggesting and installing codecs should cover
    most popular types of files; you should still refer to the Ubuntu wiki at http://wiki.ubuntu.com
    for details of how to install ones that are not recognized.


    # Using Totem To watch videos in Ubuntu, you use the Totem media player (Figure
