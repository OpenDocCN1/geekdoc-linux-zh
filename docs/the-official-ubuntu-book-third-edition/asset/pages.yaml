  md: '# Chapter 5 The Ubuntu Server


    Keeping data on separate partitions gives you, the administrator, expansive choice
    of filesystems you use for particular purposes. For instance, you might choose
    to put /tmp on ReiserFS for its superior handling of many files in a directory
    and excellent performance on small files, but you might keep /home and /var on
    ext3 for its rock-solid robustness.


    In addition, a dedicated /home partition lets you use special options when mounting
    it to your system, such as imposing disk space quotas or enabling extended security
    on user data. The reason to keep /tmp and /var separate from the rest of your
    system is much prosaic: These directories are prone to filling up. This is the
    case with /tmp because it''s a scratchpad, and administrators often give you very
    liberal quotas (but have a policy, for example, of purging all data in /tmp older
    than two days), which means it can easily get clogged /var, on the other hand,
    store log files and mail pools, both of which can take massive amounts of disk
    space either as a result of malicious activity or to a significant spike in normal
    system usage.


    Becoming a system administrator means you have to learn how to think like one.
    If /tmp and /var are easy to fill up, compartmentalize them so they can''t eventually
    consume all the disk space on your server.


    # The Story of RAID


    If you''ve got one only hard drive in your server, free to skip ahead. Otherwise,
    let''s talk about putting those extra drives to use. The acronym RAID stands for
    redundant array of inexpensive disks, although if you''re a businessperson, you
    can substitute the word independent for inexpensive. We你去 you. And if you''re
    in France, RAID is short for recherche assistance intervention dissuasion, which
    is an elite command unit of the National Police—but if that''s the RAID you need
    help with, you''re reading the wrong book. We think RAID is just a really awesome
    idea for data: When dealing with your information, it provides extra speed, fault
    tolerance, or both.


    At its core, RAID is just a way to replicate the same information across multiple
    physical drives. The process can be set up in a number of ways,'
  merge: -1
