  md: '# Chapter 3 Using Ubuntu on the Desktop


    ![](img/aa15f1f82061fdaf4ff1da575e3e1c52_103_0.png)


    Figure 3-3 Feel free to add your menu items.


    tion of your file in the Location box if you changed the type to File), and a
    brief description in the Comment box. You can also use the Browse button to select
    the application to run (or the file to open). Finally, click the default icon
    off to the side, and select an icon for the item. Click OK to finish adding the
    new menu item.


    # Finding Your Files and Folders


    When using your computer, you often need to save and open files and folders, move
    them around, and perform other tasks. The Places contains a bunch of entries,
    including those listed here, to access different parts of your computer and the
    network.


    +   - Home Folder: Your home folder is used to store the files and work for each
    user who is logged in. This is the most important folder on the system, and you
    can think of it as the equivalent of My Documents in Windows—virtually everything
    you save here. Each user has a separate folder.

    - Desktop: The Desktop folder is inside your home folder and contains files that
    visually appear on your desktop. If you drag a file onto your desktop, it will
    appear in the Desktop folder. Similarly, moving a file out of this folder or deleting
    it will remove it from your desktop.

    - Computer: Clicking this item displays the different drives attached to your
    computer as floppy drives, CD/DVD drives, and USB keys or sticks. This is the
    equivalent of the My Computer icon in Windows.'
  merge: -1
  pgno: 103
- img_proc: true
  md: '+   - Network: This option accesses servers that are available on your local
    network. This is the equivalent of the Network Neighborhood in Windows.


    +   - Connect to Server: Click this to run a wizard to create a connection to
    a network server. You can use this to add an icon to the desktop that, when clicked,
    provides a list of remote files in the desktop file manager. You can then treat
    this window like any other file manager window and drag files back and forth.
    This is really useful for copying files to other computers.


    +   - Search for Files: Use this to search for files on your computer.


    +   - Recent Documents: Click this submenu to display the most recently used documents.


    # Configuring Your System


    The third and final menu, is used to configure and customize your system, access
    help, and report problems. Inside the menu are a few options, including these.


    +   - Preferences: This submenu contains items for customizing the look and feel
    of your desktop. Each of these settings applies only to the desktop of a user
    who is logged in. If you log in as another user, the settings change to match
    that user''s preferences.


    +   - Administration: This submenu is used to configure systemwide settings as
    networking, users, printing, and more. To use these menu items, you need to know
    the system administrator password.


    +   - Help and Support: With this you can access the Ubuntu Help Center, which
    provides documentation and guides for your Ubuntu desktop.


    > TIP Feel the Power


    When you installed Ubuntu, you were asked for a username and password for the
    system. This password not only provides access to your normal user account but
    also accesses the all-powerful Administration features. As such, when you access
    the menu options and are asked for the password, just enter your normal password,
    and you can use those features.


    This feature applies only to the first user account that you created on the system.
    If you add other accounts, those users cannot access the Administration options
    unless you explicitly give them access.'
  merge: -1
