  md: '# Chapter 1 Introducing Ubuntu


    Stallman grew up with computers in the 1960s and 1970s, when computer users purchased
    very large and extremely mainframe computers, which were then shared among large
    numbers of programmers. Software was, for the most part, seen as an add-on to
    the hardware, and every user had the ability and the right to modify or rewrite
    the software on his computer and to freely share this software. As computers became
    cheaper and more numerous in the late 1970s, producers of software began to see
    value in the software itself. Producers of computers began to argue that their
    software was copyrighted and a form of intellectual property much like a music
    recording, a film, or a book''s text. They began to distribute their software
    under licenses and in forms that restricted their users'' abilities to redistribute,
    or modify the code. By the early 1980s, restrictive software licenses had become
    the norm.


    Stallman, then a programmer at MIT''s Artificial Intelligence Laboratory, became
    increasingly concerned with what he saw as a dangerous loss of the freedoms that
    software users and developers had up until that point enjoyed. He was concerned
    with computer users'' ability to be good neighbors and members of what he thought
    was an ethical and efficient computer-user community. To fight against this negative
    tide, Stallman envisioned a vision for a community that developed liberated code—in
    his words, “He defined free software as software that had the following four characteristics—labeled
    as freedoms 0 through 3 instead of 1 through 4 as a computer programmer''s joke:


    +   * The freedom to run the program for any purpose (freedom 0)


    +   * The freedom to study how the program works and adapt it to your needs (freedom
    1)


    +   * The freedom to redistribute copies so you can help your neighbor (freedom
    2)


    +   * The freedom to improve the program and release your improvements to the
    public so that the whole community benefits (freedom 3)


    Access to source code—the human-readable and modifiable blueprints of any piece
    of software that can be distinguished from the computer-readable version of the
    code that most software is distributed as is a prerequisite to freedoms 1 and
    3. In addition to releasing this definition of free soft-'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# Free Software, Open Source, and GNU/Linux


    ware, Stallman created a project with the goal of creating a completely free OS
    to replace the then-popular UNIX. In 1984, Stallman announced this project and
    called GNU—another joke in the form of a recursive acronym for "GNU’s Not Unix.",


    # Linux


    By the early 1990s, Stallman and a collection of other programmers working on
    GNU had developed a near-complete OS that could be freely shared. They were, however,
    missing a final essential piece in the form of a kernel—a complex system command
    processor that lies at the center of any OS. In 1991, Linux Torvalds wrote an
    early version of just such a kernel, released it under a free license, and called
    it Linux. Linux’s kernel was paired with the GNU project’s development tools OS
    and with the graphical system called X. With this pairing, a completely free OS
    was born—free both in terms of price and in Stallman’s terms of freedom.


    All systems referred to Linux today are, in fact, built on the work of this collaboration.
    Technically, the term Linux refers only to the kernel. Many programmers and contributors
    to GNU, including Stallman, argue emphatically that the full OS should be referred
    to as GNU/Linux in order to give credit not only to Linux but also to the GNU
    project and highlight GNU’s goals of spreading software freedom—goals not necessarily
