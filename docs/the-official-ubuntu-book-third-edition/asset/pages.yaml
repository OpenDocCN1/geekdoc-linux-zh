  md: '# A Brief History of Ubuntu


    # The Warthogs


    There has been no lack of projects attempting to wrap GNU, Linux, and other pieces
    of free and open source software into a neat, workable, and user-friendly package.
    Mark Shuttleworth, like many other people, believed that the philosophical and
    pragmatic benefits offered by free software put it on a course for widespread
    success. That said, none of the offerings were particularly impressive. Something
    was missing from all of them. Shuttleworth saw this as an opportunity. If someone
    could build the great software distribution that helped push GNU/Linux into the
    mainstream, he would come to occupy a position of strategic importance.


    Shuttleworth, like many other technically inclined people, was a huge fan of the
    Debian project (discussed in depth later in this chapter). However, many things
    about Debian did not fit with Shuttleworth''s vision of an ideal OS. For a period
    of time, Shuttleworth considered the possibility of running for Debian project
    leader as a means of reforming the Debian project from within. With time, though,
    it became clear that the best way to bring GNU/Linux to the mainstream would not
    be from within the Debian project—which many situations had very good reasons
    for being the way it was. Instead, Shuttleworth would create a new project that
    worked in symbiosis with Debian to build a new, better GNU/Linux system.


    To kick off this project, Shuttleworth invited a dozen or so free and open source
