    # My E-Mail Doesn''t Work in Evolution


    When you first run Evolution, it runs through the setup procedure to configure
    your e-mail address. To do this successfully, you need to have the following details
    available:


    +   * Your type of e-mail server (such as POP or IMAP)

    * Your mail server name (such as mail.chin.com)

    * Your mail account''s username and password

    * Authentication type (typically password)

    * Your outgoing mail server type (typically SMTP)

    * Your outgoing mail server name


    If you have configured your account and your e-mail doesn''t work, click Edit
    > Preferences, select the account from the list, and click the Edit button. Ensure
    that the settings are all correct. If you still cannot connect to your e-mail
    server, there is either a configuration problem or a network problem.


    The latter problem would mean one of two things: Your computer is not connected
    to the network, or the mail server is not connected to the network. To test this,
    run the following command in a terminal:


    ```

