  merge: -1
  pgno: 263
- img_proc: true
  md: 'System administrators spend much of their day in the command line crafting
    strings of commands that hook together to do something interesting. With this
    powerful underlying command-line platform, so much is possible.


    System administration is sometimes fraught with its own share of problems, though.
