    # My Computer Says It Is Out of Memory


    If you get memory errors and have a reasonable amount of memory (256MB or more)
    and a swap partition, your memory may be faulty. Check whether your memory is
    working, restart your computer, and when you see GRUB loading, press Escape to
    display the boot menu. Select the memtest option, and a small tool will check
    your memory for errors.


    The memtest utility tries its best to find problems with your memory, but there
    may be cases where memtest passes the memory still has problems. To test this,
    try swapping the memory with some that is known to work and see if the problems
    go away. If they do, the memory is certainly faulty.


    # How Can I Copy Photos from My Mobile Phone to My Ubuntu Computer with Bluetooth?


    Ubuntu has built-in Bluetooth support, but you need to install the gnome-bluetooth
    package. Inside this package is a small tool called gnome-obex-server. This application
    allows you to transfer files from your mobile phone to your computer.


    When you have installed the package, hit Alt-F2, and enter gnome-obex-server.
    A small blue icon appears in the notification area, and you can now send a file
    from your phone via Bluetooth.


    # I Can Read My USB Storage Device, but I Can''t Write to It


    If you are having trouble writing to a USB key or external USB hard drive, there
    are a number of possible causes of the problem.


    The first and most simple to diagnose is that you may not have permission to write
    to the device. When you plug in the drive, right-click the icon that appears on
    your desktop, and select Properties. In the window that appears, click the Permissions
    tab and ensure that the Others line has the Write checkbox selected. If it is
    not selected, you don''t have permission to access the drive.'
  merge: -1
