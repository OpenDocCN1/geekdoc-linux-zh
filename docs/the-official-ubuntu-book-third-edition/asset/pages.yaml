    # Using Synaptic to Check for Updates


    You can use Synaptic not only to manage packages but also to check for updates.
    When you launch Synaptic, it will ask you for your password. After it starts,
    first click on the Reload button in the upper left. This will prompt Synaptic
    to check the repositories for new updates. After it has finished, click Mark All
    Upgrades. This will prompt Synaptic to manage all software upgrades as those you
    want to install. If Synaptic does not tell you there are any updates to be made,
    everything is already up-to-date. If something requires updating, it will tell
    you which packages need to be updated. Close the window, and then click Apply.
    This will install any needed upgrades.


    Sometimes the updater will tell you that it cannot update certain programs. This
    is because updating those programs would require the removal or'
