  md: '# Networking 207


    In the networking tool, double-check that your settings are correct. You can check
    whether your network card is working and has an interface by opening a terminal
    with Applications > Accessories > Terminal and typing:


    ```

    foobar:~$ ifconfig

    ```


    You should see a number of blocks such as eth0 or ra0. One of these blocks should
    have a local IP address. The format of this address depends on which IP range
    is on your network. The range 192.168.0.n, where n is a number between 1 and 254,
    is commonly used. If you see an IP address in your ifconfig output, try pinging
    the IP address that you set as the gateway. If you did not set a gateway (typically
    when you obtain your IP address automatically with DHCP), your IP address is likely
    to be 192.168.0.1. Try to send packets to this IP address:


    ```

    foobar:~$ ping 192.168.0.1

    ```


    Change the IP address if your IP range is different. If you get a number of lines
    with a time = attribute at the end, your network card works.


    If you have set up your network card to automatically grab an IP address with
    DHCP, you can get a new address by running the following command:


    ```

    foobar:~$ sudo dhclient

    ```


    # My Computer Says It Can''t Resolve a Web Site


    If the network is working but Web sites are not loading, you might have a problem
    with the incorrect name or DNS servers, which turn domain names such as google.com
    into IP addresses. To test this, you will need to know an IP address. You may
    have been given some IP addresses from your ISP. Alternatively, you can use another
    computer to find an IP address with which to test. Try pinging the address, and
    if you get pings back, you know it''s a name server problem. To resolve this,
    specify the correct name servers in the DNS tab.


