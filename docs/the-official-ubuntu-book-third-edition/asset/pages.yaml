    # Upgrading the Client''s Kernel Version


    Once in a blue moon, or if a security update is available, it is necessary to
    upgrade the kernel version of the client machine. This process should be treated
    with caution and should really be performed only if you are experiencing problems
    with your client''s hardware. To upgrade the kernel version in the client NFS
    root, you must explicitly tell it to install the new kernel. Like in the upgrading
    of the client root software described in the previous section, you must first
    load a terminal and enter the client chroot, using this command:


    ```

    sudo chroot /opt/lsp/i386

    mount -t proc proc /proc

