    up to date. This doesn''t mean upgrading to newer and newer versions of the software
    (well, it does, but not in the conventional sense), because once a Ubuntu version
    is released, no new software versions enter the repositories except for the backports
    repository. On a server, however, you''re strongly discouraged from using backports
