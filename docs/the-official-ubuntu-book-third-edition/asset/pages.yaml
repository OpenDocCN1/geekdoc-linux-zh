- img_proc: true
  md: 'and LTSP setups installed on top of Ubuntu, you must add an entry to the

    /opt/ltsp/i386/etc/lts.conf file to enable sound for client machines.


    The easiest way to edit this file is to hold down Alt-F2, which will bring you

    the run command dialog box. Type in the following command:


    ```

    gksudo "edit /opt/ltsp/i386/etc/lts.conf"

    ```


    Clicking OK will bring up an editing window. Make sure to have at least a

    [default] section in the lts.conf file where you will add the following line:


    ```

    SOUND=True

    ```


    Dapper 6.06 LTS is very particular about the SOUND=True statement. You must type
    it

    exactly as shown, taking extreme care with capital letters and so.


    For all versions of 6.10 of Edubuntu, this is already done for you, and

    sound should work on client machines out of the box.


    # Printing over LTSP


    There are two ways in which printing can be achieved in an LTSP environ-

    ment. The first is for a printer to be connected directly to the server. In this

    instance, printing is set up in the usual way. You can find more details on

    in this Chapter 4.


    The second way to allow printing is to make one of the workstation

    machines a print server. This feature was introduced in Ubuntu Edgy 6.10.

    Up to three printers can be attached to the workstation using the parallel

    and USB ports. LTSP uses the jetpipe program on the workstation to redi-

    rect from the server to the workstation. a change must be made to the /opt/ltsp/i386/etc/lts.conf

    to the workstation. The file is an example of some configuration options.


    ```

    [00:4C:69:73:61:00]

    PRINTER_0_DEVICE = /dev/lp0

    PRINTER_1_DEVICE = /dev/usb1p0

    ```


    This will cause the jetpipe program to begin running as a background

