    # How Can I Test Whether an .iso File Works?


    Whenever you download a Linux distribution such as Ubuntu, you typically download
    an .iso file, a file that contains an image of a CD. You then use this file to
    create an installation CD for installing the distribution. After downloading the
    file, you may want to verify that the file you downloaded is the same as the server.
    To test that you have the same file as on the server, you need to verify the .iso
    file. Open a terminal and run the following command:


    ```

    foo@bar:~$ md5sum my_iso_file.iso

    ```


    Wait a little while and Ubuntu will print a "word" that is 33 characters long.
    Now go to the site from which you downloaded the file, and compare'
  merge: -1
