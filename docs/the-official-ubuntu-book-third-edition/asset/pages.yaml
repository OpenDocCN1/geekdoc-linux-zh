    # Final Words on Security


    We''ve barely even scratched the surface of system security in this section, though
    we''ve tried to give you good pointers on where to start and where to get the
    information you need to learn more. But let us give you some sage advice on security
    in general, since it''s a painful truth to learn: There is no such thing as a
    fully secure system. Securing systems isn''t about making it impossible for a
    breach to occur. It''s about making the breach so difficult that it''s not worth
    it to the attacker. This definition is pretty fluid if your attacker is a bored
    14-year-old sitting in a basement somewhere chewing on cold pizza, you can bet
    that kid will leave your system alone if it''s even keeping around top-secret
    information, it''s a lot more difficult to have the system secure enough that
    breaking into it isn''t worth it, from a cost/benefit point of view, to the attackers.


    Security is also neat because, as a concept, it permeates the entire idea space
    of computer science. Getting really good at security requires an incredibly deep
    understanding of the inner workings of computer systems, which has the nonobvious
    advantage that if you''re trying to get a deep understanding of computer systems
    but don''t know where to start, you can start with security and simply follow
    the trail. Use this to your advantage! Good luck.


