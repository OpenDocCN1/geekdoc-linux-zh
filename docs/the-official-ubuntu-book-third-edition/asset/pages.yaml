    # Ubuntu Philosophy


    Our work is driven by a philosophy on software freedom that aims to spread and
    bring the benefits of software to all parts of the world.


    NOTE The latest version of the Ubuntu Philosophy can be found at www.ubuntu.com/community/ubuntustory/philosophy.


    At the core of the Ubuntu Philosophy of Software Freedom are these core philosophical
    ideals:


    +   1. Every computer user should have the freedom to download, run, copy, distribute,
    study, share, change, and improve their software for any purpose without paying
    licensing fees.

    2. Every computer user should be able to use their software in the language of
    their choice.

    3. Every computer user should be given every opportunity to use software, even
    if they work under a disability.


    Our philosophy is reflected in the software we produce and include in our distributions.
    As a result, the licensing terms of the software we distribute are measured against
    our philosophy using the Ubuntu License Policy.


    When you install Ubuntu, almost all of the software installed already meets these
    ideals, and we are working to ensure that every single piece of software you need
    is available under a license that gives you freedoms. Currently, we make a specific
    exception for some drivers which are only available in binary form, without which
    many computers will not complete the Ubuntu installation. We place these in a
    restricted section of your system, which makes them easy to remove if you do not
    need them.


    For more information on the components of Ubuntu, please see the upcoming Components
