    # The Community Council


    The Community Council and the Technical Board are the highest-level governance
    structures within Ubuntu. The Community Council, as it pertains to all Ubuntu
    members and activities, is arguably the most powerful team within the Ubuntu project.
    The Community Council is charged with supervising the social structures, venues,
    and processes of the project.


    The Community Council''s day-to-day work involves five major areas in Ubuntu.
    The first, and the most straightforward, is the maintenance of the Ubuntu Code
    of Conduct. The Community Council is the only body that can approve revisions
    to the code. Because the Community Council does not ask each member to “reagree”
    to the code when it is changed, each of these revisions must be fully within the
    spirit of the previous drafts.'
