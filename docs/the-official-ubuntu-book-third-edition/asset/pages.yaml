  md: 'tend to be located at /dev/sda or /dev/sdb1. Make sure that you have the right
    device, and use one of the many mkfs commands to create the relevant filesystem.
    As an example, to create an ext3 filesystem, use the fol-lowing command:


    ```

    foo@bar:~$ sudo mkfs.ext3 /dev/sda

    ```


    A range of other mkfs commands can be used to create other filesystems:


    +   * mkfs

    * mkfs.ramfs

    * mkfs.ext2

    * mkfs.ext3

    * mkfs.jfs

    * mkfs.minix

    * mkfs.msdos

    * mkfs.reiser4

    * mkfs.reiserfs

    * mkfs.vfat

    * mkfs.xfs


    Each of these commands is used in the same way.


    # The Keys on My Keyboard Spit Out the Wrong Letters/Symbols


    Every keyboard on a computer has a particular keyboard layout and locale attached
    to it. The keyboard layout specifies how many keyboard keys you have, in what
    order, and the locale specifies what each key does.


    The locale is particularly important as letters and symbols vary dramat-ically
    in different locales. Aside from different types of letters, common symbols are
    often placed in different areas. As an example, on some key-boards the double
    quote ("") is on the key above the Shift key. On some keyboards, it is Shift-2.
    Having the wrong keyboard settings can be incredibly frustrating, and if the symbols
    printed on your keys don''t match up to the symbols spat out when you press the
    keys, your keyboard settings are incorrect.'
