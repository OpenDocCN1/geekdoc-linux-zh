    In its simplest form, it provides a quick and easy reference to the periodic table.
    Kalzium includes 105 of the naturally occurring elements, many of which are accompanied
    by sample pictures. If the user hovers the mouse pointer over an element symbol
    in the periodic table, a balloon appears showing the selected element''s name,
    atomic number, and mass (Figure 9-1).


