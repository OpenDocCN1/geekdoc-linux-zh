  md: '# Chapter 8 Using Kubuntu


    Writer resembles any other word processing software you have used. Simply starting
    your letter or paper as you normally would, and use the toolbar for formatting
    options, including changing alignment, setting boldface or italic type, and other
    needs.


    When you are working on a document, save it by selecting File > Save or by typing
    Ctrl-S. OpenOffice.org saves documents in the Open Document format. This file
    format is a standard across the world. You can also save documents in other formats,
    including Microsoft Office and Adobe PDF. To save as a PDF file, just click the
    PDF button on the main toolbar (located near the print icon) and enter a filename.


    # Web Browsing with Konqueror


    As mentioned earlier, Konqueror can function as a Web browser as well as a file
    manager. To launch Konqueror, open the Application Launcher and navigate to Internet,
    then Konqueror. Alternately, you can launch KRun (Alt-F2) and type in Konqueror.
    Like other modern web browsers, Konqueror provides tabbed browsing, the ability
    to have multiple web pages open in the same window. To do this, select File >
    New Tab or press Ctrl-T. A new tab will be created in your open Konqueror window.
    A cool feature is that you can be browsing the Web in one tab, browsing and also
    browsing network folders in a third tab. All of these functions can help manage
    your taskbar and keep your desktop looking clean and sharp.


    As a Web browser, Konqueror enables you to set bookmarks, change your home page,
    and use all the other features you would expect from a Web browser.


    Navigating around the Internet is no different in Konqueror than in any other
    Web browser, including Firefox, Opera, Netscape, and Internet Explorer. Just type
    the Web address into the address bar and hit Enter. For example, type in www.kubuntu
    to visit the home page for Ubuntu.


    To search using Google, simply move to the search bar, and directly to the right
    of the address bar type in what you are looking for (Figure 8-41). Konqueror will
    use Google to find it for you.'
