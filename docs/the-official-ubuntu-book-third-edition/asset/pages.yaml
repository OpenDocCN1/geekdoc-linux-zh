  md: 'tab. You will see which applications are using more CPU and RAM. You can also
    use top on the command line:


    ```

    foo@bar:~$ top

    ```


    The top command shows the current processes on your computer that are using the
    most system resources. If you see a particular program taking up an unusual amount
    of resources, that may be the culprit.


    Some processes (such as the Apache Web server) fork and replicate themselves when
    used. Another useful technique is to see how many of these processes are running:


    ```

    foo@bar:~$ ps ax | grep program | wc -1

    ```


    This command takes a listing of the processes running on the system, uses grep
    to search for a specific process, and then counts the number of lines returned,
    indicating how many processes are running.


    # How Can I Learn the Different Options for Commands?


    Every command in Ubuntu has a small reference card included called a man page.
    This page displays the range of available options. Access it by typing man, and
    then enter the command:


    ```

    foo@bar:~$ man grep

    ```


    Another method of listing the options is to use the -h or --help options:


    ```

    foo@bar:~$ grep --help

    ```


    # How Do I Get My Root Account Back?


    In a default Ubuntu installation, the root account is disabled. Instead, the user
    account created during the installation process is used with sudo to access administer
    facilities. The sudo command is used extensively to temporarily take root privileges
    when needed.


    If you want to get the root account back, run the following command:


    ```

    foo@bar:~$ sudo passwd root

    ```'
