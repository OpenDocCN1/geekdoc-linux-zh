  md: 'AS YOU''VE SEEN SO FAR, Ubuntu is relatively straightforward to set up and
    use for the common day-to-day tasks. With time, though, most users want to change
    their software, add and experiment with other software that Ubuntu has to offer,
    install and use hardware devices and printers, access remote files, use the famous
    (and sometimes feared) terminal, and maybe even run some Windows programs. Ubuntu
    provides many ways to do each of these things. While they are a little more complex
    than the material covered in previous chapters, the Ubuntu community has worked
    hard to make them as easy as possible, and this chapter shows you how to do all
    of them.


    # Adding and Removing Programs and Packages


    While Ubuntu already includes most of what people need, sometimes you need something
    extra, such as a desktop publishing application for school or a game to pass the
    time. The easiest way to add this is with Add/Remove Applications, which is extremely
    simple to use but has a few limitations.


    # Installing and Using Add/Remove Applications


    By far the easiest way to install desktop applications is via Add/Remove Applications,
    available through the Applications menu. Like Synaptic and the other tools discussed
    in this chapter, Add/Remove Applications installs from the same online repositories.
    Thus, using one tool will cause all of the other tools to be able to recognize
    the same change.


    To launch Add/Remove Applications, simply click on the Add/Remove entry at the
    bottom of the Applications menu as you would for any other program. When it is
    run for the first time, and occasionally afterward, it will take a few moments
    to initialize itself and the list of available and installed applications. Once
    this is complete, you will see the main interface shown in Figure 4-1.


    The interface is divided into three parts. On the left is a list of all the types
    of applications, laid out in the same way as the menu. Select a category to see
    a list of all the applications in that category in the upper right. Selecting
    an application in the upper right section will display a description in the lower
    right section of what that program does.'
  merge: -1
