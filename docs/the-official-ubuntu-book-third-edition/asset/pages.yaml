    collection contains applications for creating processing documents, spreadsheets,
    presentations, databases, drawings, and mathematical equations. The suite provides
    an extensive range of functionality, including reading and writing Microsoft Office
    file formats, and can also export documents as Web pages, PDF files, and even
    animations.


    Let''s give OpenOffice.org a whirl by creating a letter with it. Start OpenOffice.org
    Writer by selecting it from the Applications > Office menu. When it has loaded,
    you will be presented with the interface shown in Figure 3-7.


    ![](img/aa15f1f82061fdaf4ff1da575e3e1c52_113_0.png)


