  md: '# # The Ubuntu File Chooser and Bookmarks


    One area in which the GNOME developers have worked hard is in creating an intuitive
    and useful file chooser that is accessed in applications with File Open. You might
    be wondering why they have spent so much time on a small and seemingly insignificant
    part of the desktop. In reality, finding files is one of the most frustrating
    aspects of using computers and often involves digging through folder after folder
    to find what you need. Luckily, the GNOME file chooser (Figure 3-34) helps cut
    down on this file hunting significantly.


    The listing of files on the right-hand side is used to find the file you need,
    and you can click on folders in this listing to traverse deeper into your sub-folders.
    Note how each folder is displayed above the listing in a series of buttons. You
    can click these buttons to easily jump back to parent folders when needed.'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# Chapter 3 — Using Ubuntu on the Desktop


    ![](img/aa15f1f82061fdaf4ff1da575e3e1c52_143_0.png)


    **Figure 3-34** The file chooser has a number of features such as bookmarks.


    Aside from enabling you to manually pick files, the chooser also supports bookmarks.
    On the left side of the chooser is a list of devices and bookmarks labeled Places.
    These include your home directory (shown as your username), Desktop (the files
    on your desktop), and File System (the entire hard drive), as well as devices
    such as CD drives, floppy drives, and USB sticks.


    To create your own bookmark, use the listing on the right to find the folder that
    you want to bookmark, single-click it, and then click Add below the Places box.
    The folder now appears in your bookmarks. Whenever you need to access folder,
    just click the bookmark! In addition to putting the bookmark in the file chooser,
    it is also available in other parts of the desktop, such as the Places menu and
    in the file manager.


    # Ubuntu in Your Language


    When you installed Ubuntu, you were asked which language the system should use.
    Although this sets the initial language for the system, you may want to change
    the language at a later date. To do this, click System > Administration > Language
    Support.'
  merge: -1
