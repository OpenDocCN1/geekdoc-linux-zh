    thought he could improve on SLS. Because SLS was free software, Volkerding had
    the freedom to make a derivative version of SLS and distribute it. Volkerding
    did this when he took SLS''s code and used it as the framework or model upon to
    create his own variant called Slack. Subsequently, Slack became the first widely
    successful GNU/Linux distribution and is maintained to this day.


    With time, the landscape of GNU/Linux distribution has changed. However, the important
    role of derivation that made Slack possible remained fully intact and is still
    shaping this landscape. The hundreds of GNU/Linux distributions serve a multitude
    of users for a myriad of purposes: There are distributions specially designed
    for children, for dentists, and for speakers of many of the world''s languages.
    There are distributions for science, for business, for servers, for PDAs, for
    nonprofit organizations, for musicians, and for countless other groups.


    Despite this diversity, the vast majority of derivatives can be traced back to
    one of two parent distributions: Red Hat and Debian. While it is not necessary
