- img_proc: true
  md: 'So what else is different in Ubuntu Server? Other than the server kernel and
    a minimal set of packages, not too much. Ubuntu has supported a minimal installation
    mode for a number of releases, spinning off Ubuntu Server into a proper derivative
    distribution is still a young effort, and many neat features are planned for the
    future but aren''t available just yet.


    Starting with Ubuntu Server 6.06 LTS, known as Dapper Drake, Ubuntu Server offers
    officially supported packages for the Red Hat Cluster Suite, Red Hat''s Global
    File System (GFS), Oracle''s OCFS2 filesystem, and the Linux Virtual Server utilities:
    keepalive and ipvsadm. Combined with the specialized server kernel, these already
