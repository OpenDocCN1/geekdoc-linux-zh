  md: 'ps: The ps command allows you to view all the processes running on the machine.


    The following commands list the hardware on your computer, either of a specific
    type or with a specific method. They are most useful for debugging when a piece
    of hardware does not function correctly.


    +   - Ispci: The lspci command lists PCI buses and devices connected to them.
    This commonly includes network cards and sound cards.


    +   - Isusb: The lsusb command lists all USB buses and any connected USB devices,
    as printers and thumb drives.


    +   - Ihal: The lhal command lists all devices the hardware abstraction layer
    (HAL) knows about, which should be most hardware on your system.


    +   - Ishw: The lshw command lists hardware on your system, including maker, type,
    and where it is connected.


    # Searching and Editing Text Files


    Search and edit text files by using the following commands.


    +   - grep: The grep command allows you to search inside a number of files for
    a particular search pattern and print matching lines. For example, grep blah file
    will search for the text "blah" in the file and then print any matching lines.


    +   - sed: The sed (or Editor) command allows search and replace of a particular
    string in a file. For example, if you want to find the string "cat" and replace
    it with "dog" in a file named pets, type sed s/cat/dog/g pets.


    Both grep and sed are extremely powerful programs. There are many excellent tutorials
    available on using them, but here are a few good Web sites to get started:


    +   - http://pegasus.rutgers.edu/~elflord/unix/grep.html


    +   - http://pegasus.rutgers.edu/~elflord/unix/sed.html


    +   - http://www.itworld.com/2378/swol-1199-unix101/'
  merge: -1
