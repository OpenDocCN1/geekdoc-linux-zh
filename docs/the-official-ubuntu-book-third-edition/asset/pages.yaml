    In the next two boxes, add a password and confirm it. This password is used when
    logging in to your computer with the username that you just created. When choosing
    a password, follow these simple guidelines.


    +   - Make sure you can remember your password. If you need to write it down,
    keep it somewhere secure. Don''t make the WarGames mistake of putting the password
    somewhere easily accessible and known to others.

    - Try not to use dictionary words such as "chicken" or "beard" when choosing a
    password. Try to input numbers and punctuation to not use "real words."

    - Your password should ideally be longer than six letters and contain a combination
    of letters, symbols, and numbers. The longer the password and the more it mixes
    letters, numbers, and symbols, the more secure it is.


    Finally, add a hostname in the last box. The hostname is a single word that identifies
    your current machine. This is used on a local network so that you can identify
    which machine is which.


