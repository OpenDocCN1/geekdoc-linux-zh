    major technology company has to ask itself the question, “How do we adapt to a
    free software world?


    I speculate and say that Ubuntu represents an idea whose time has come. We did
    not invent the free software movement—that honor goes to Richard Stallman and
    many others who had a vision far more profound at a time when it was hard to see
