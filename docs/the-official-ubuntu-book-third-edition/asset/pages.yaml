  md: '# Summary


    Congratulations on your new Ubuntu system. Whether you used the desktop-top CD
    or the traditional alternate install CD approach to get Ubuntu on your computer,
    you now have a powerful, extensible, and easy-to-use OS with a huge array of available
    software. Unlike other operating systems, Ubuntu includes a complete end-to-end
    software selection with a range of tools for office productivity, system configuration,
    Internet access, e-mail, and more. In addition to this impressive array of desktop
    software, your new system also includes an incredibly powerful underlying architecture
    that can be heavily customized. Those of you with a fondness for code and programming
    will also get a kick out of the millions and millions of lines of code that are
    freely available and spread among the different applications included. Ubuntu
    also provides extensive development tools for creating desktop applications, Web
    applications, and more.


    You are at the start of an exciting journey, so let''s get going.'
