  md: '# Installing Applications


    By default, the operating system is configured to talk to all of the software
    repositories. These are explained in greater detail in Chapter 5 and in Appendix
    B. There are many more packages available in the universe and multiverse repositories;
    however, some may have different licensing. By using the Software Sources package,
    you can modify this list of repositories. Simply select System > Administration
    > Software Sources from the menu, and you will be presented with the Software
    Sources screen.


    Whether you are running a thin client system or you installed Ubuntu or Edubuntu
    in a non-LTS mode, you will at some point need to install extra applications onto
    the system. This is simple in either Ubuntu or Edubuntu and is achieved by selecting
    Applications > Add/Remove from the main menu at the top left of the screen. Enter
    your password when prompted, and you will see the Add/Remove Applications window.


    In addition to being the central point for installing all extra software for your
    system, the Add/Remove Applications program has a special section for education.
    Clicking on this will filter the available of applications to show those that
    have a high relevance to educational establishments. At the time of writing there
    were over eighty applications available in this section, and the list keeps growing,
    as shown in Figure 9-14.


    In the application list you will see some checkboxes next to the application names.
    If you want to install a particular application, simply tick the checkbox next
    to its name. You can select multiple applications before clicking the Apply button.


    Once you have chosen your applications and clicked the Apply button, you will
    be guided through the rest of the procedure and asked to confirm your selections
    prior to installation. Edubuntu will collect the packages from the Internet or
    the Edubuntu CDs and begin installing them on your machine.


    If you have chosen a few packages, the installation step may take a while. Installing
    software in this way is easy because Add/Remove Applications will handle all the
    required dependencies and install those, too.'
