  md: '# Chapter 3 Using Ubuntu on the Desktop


    TIP


    Vendor Lock-In?

    in the proprietary software world, it is common for each application to have its
    own closed file format that only the vendor knows how to implement. When a person
    uses the software to create documents, the closed format means that only that
    specific tool can read and write the format. As long as you want to access your
    documents, you need that tool. This is known as vendor lock-in.


    To combat this, the OpenOffice suite (and the vast majority of other source applications)
    uses an open file format that is publicly documented. In fact, the format is a
    published standard under ISO/IEC 26300:2006. This means that other applications
    can implement the OpenDocument file format, and you can be safe in the knowledge
    that your documents will be available and you are not locked in any specific tool.


    Another useful feature wedged into OpenOffice is the capability to save your documents
    in the Adobe PDF format. PDF files have increasingly used in the last few years
    and are useful for sending people documents that they should not change (such
    as invoices). PDFs provide a high-quality copy of the document and are well supported
    across all operating systems. This makes PDFs ideal for creating catalogs, leaflets,
    and flyers. To save a document as a PDF file, click the PDF button on the main
    toolbar (next to the printer icon). Click the button, enter a filename, and you
    are done. Simple.


    # Managing Your E-Mail and Calendars with Evolution


    Evolution has been modeled around the all-in-one personal information management
    tool. Within Evolution you can read your e-mail, manage your schedule, store contact
    details, organize-to-do lists, and more in a single place. This makes Evolution
    useful for both businesspeople and regular users who want easy access to this
    information.


