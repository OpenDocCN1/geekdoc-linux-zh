- img_proc: true
  md: '# Chapter 7 The Ubuntu Community


    With these goals in mind, Ubuntu''s system is based on the delegation of decision-making
    power to small and medium-sized teams. When disagreements arise, they are handled
    within a relevant team. In the cases of some larger teams, team councils handle
    a variety of dispute resolutions in a very structured fashion. When teams cannot
    resolve their own disagreements or when there are disagreements between teams,
    they are forwarded to either the Community Council or the Technical Board—depending
    on whether the issue is technical in nature. As the financier and progenitor,
    Shuttleworth sits on both boards and occupies a special position as the self-appointed
    benevolent dictator for life (SABDFL). Users can participate in the Ubuntu governance
    structure by serving on teams and by approving members of both the Community Council
    and the Technical Board as Ubuntu members and maintainers.


    # Teams


    Most work in Ubuntu is delegated to a set of teams, each responsible for a particular
    area of work in Ubuntu. A sample of important teams (which is by no means complete)
    might include the forums, marketing, art, documentation, kernel, server, laptop,
    and translation teams. Anyone with an interest in a particular aspect of the Ubuntu
    project can join a team''s discussion and contribute to its decisions.


    When participants feel that a particular area is underserved, they can go ahead
    and build a new team by beginning work and writing a proposal for consideration
    by the Community Council, which approves the creation of all new teams. Rather
    than catalyzing work with the creation of a team, the Community Council likes
    to recognize work with official team status. Teams should always involve the participation
    of several individuals. There are no one-man or one-woman teams in Ubuntu.


    Several teams are so large and important that they have built their own more advanced
    governance structures in the forums of team councils. These councils are appointed
    by the community council from active members and leaders within the team and as
    delegates of the Community Council for that team and its domain in the project.
    These team councils have regular meetings, resolve conflicts, report to the Community
    Council, and in some cases even grant membership on behalf of the'
