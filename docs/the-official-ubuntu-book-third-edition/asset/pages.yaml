    Try various options until you arrive at an optimal configuration.


    # How Do I Install a Package?


    See the section Adding and Removing Programs and Packages in Chapter 4.


    # How Do I Install Another Desktop Environment?


    By default, Ubuntu comes with the GNOME desktop environment. Other variants of
    Ubuntu come with different desktops; for example, Ubuntu comes with KDE and Ubuntu
    with Xfce. All of these desktop environments are easy to install on the other
    variants, via convenient metapackages. The Ubuntu package is called ubuntu-desktop,
    the Ubuntu one is ubuntu-desktop, and the Ubuntu one is xubuntu-desktop.'
