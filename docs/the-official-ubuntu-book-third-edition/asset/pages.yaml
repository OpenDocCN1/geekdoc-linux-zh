  md: 'UBUNTU IS NOT JUST A COMPLETE operating system; it is also the center of a
    growing ecosystem of distributions. Some, referred to as the partner projects,
    work closely with and within Ubuntu. Others prefer to work outside the project
    and are considered full derivatives. Often, these projects are created in order
    to highlight a specific selection of software or use case, such as the Ubuntu
    project, which focuses on security and networking tools. Others, like the gNewSense
    project supported by the Free Software Foundation, exists for philosophical or
    social reasons.


    Others derive for reasons connected to the international nature of Linux and open
    source software. While most Ubuntu development happens in English, there are large
    developer and user communities in other languages and countries. Thus, a derived
    distribution might spring up to satisfy that need. There are derived distributions
    targeted at Christians, Muslims, people with slow computers, and people who prefer
    to have an Ubuntu system optimized for any of several alternative user interfaces
    or for use in several different schools and bureaucracies across the world. Should
    you use any of these over Ubuntu? We can''t answer that question for you. Some
    of these projects are fully within and, as not mutually exclusive from Ubuntu.
    Others might be more appropriate depending on your preferences or circumstances.
    You can mix, match, and sample these distributions until you find one that works
    great for you. As we mentioned in Chapter 1, Ubuntu sees these derivatives as
    a sign of a healthy and vibrant community. One of the goals of the project is
    to make it easier for this type of distribution to appear. We can expect to see
    more of them in the future.


    # Ubuntu Editions


    Other editions of Ubuntu, formerly called Partner projects, are those projects
    that work in close relation with Ubuntu. They share a common repository of packages
    and release in sync with Ubuntu. Each partner project, with the exception of Edubuntu,
    has a desktop CD generated for it, which is distributed from the Ubuntu Web site
    and can be used to install a desktop version of the partner project.'
  merge: -1
  pgno: 411
- img_proc: true
  md: '# Kubuntu


    Kubuntu is the first and oldest of all the partner projects. First released alongside
    Ubuntu 5.04 (Hoary Hedgehog), Kubuntu, which means “toward humanity” in Bemba,
    builds on the strengths of the K Desktop Environment (KDE) as Ubuntu does. The
    project is led by Jonathan Riddell, rather than Gnome who works for Canonical
    Ltd.


    With Ubuntu, Kubuntu is a complete desktop, or one built around KDE and Qt. Rather
    than Ubuntu''s brown theme, Kubuntu opts for a more traditional blue and makes
    a few visual changes. Rather than the two panels and three menus of Ubuntu with
    Kubuntu uses two menus and a single lower panel, closer in style to that of Microsoft
    Windows.


    Kubuntu also comes with OpenOffice, the same suite included in Ubuntu. Along with
    this office suite, Kubuntu also includes Krita, a photo manipulation tool, the
    K3b CD Creator tool, and the media player Amarok, all parts of KDE. Kubuntu is
    explored in much more depth in Chapter 8 and is not given a full treatment here.


    TIP Kubuntu


    Kubuntu can be found at www.kubuntu.org.


    # Edubuntu


    As the name implies, Ubuntu is a version of Ubuntu for use in schools and other
    educational environments. Ubuntu uses the thin client technology of the Linux
    Terminal Server Project (LTSP) as well as a number of programs aimed at the educational
    market, such as GCom and the KDE education suite. Oliver Gawert, a Canonical Ltd.
    employee, leads the Ubuntu development. Unlike Ubuntu, Ubuntu uses the GNOME desktop
    environment. One of Ubuntu’s unique features is the inclusion of the LTSP in an
    easy-to-use, out-of-the-box installer. LTSP uses a different methodology of deploying
    clients over a network than in traditional computer deployments. Instead of full-blown
    computers, LTSP uses thin clients, computers that connect to a larger server to
    do all the processing work.'
  merge: -1
  pgno: 412
- img_proc: true
  md: 'Edubuntu has grown rapidly over the last two years. As a result, we''ve included
    a full chapter on the subject at the expense of a longer section here. Worth noting
    perhaps is the fact that rather-simply a different distribution, Edubuntu is now
    distributed as an add-on to a standard Ubuntu install. To learn much more about
    this project, take a look at the in-depth overview in Chapter 9.


    > > **Ubuntu**

    > Ubuntu can be found at www.ubuntu.org.


    # Xubuntu


    Xubuntu is a version of Ubuntu built on top of the Xfce window management system.
    In Ubuntu, Xfce and its associated applications play an analogous role to KDE
    in the context of Kubuntu. Xfce is small and lightweight compared to the much
    fancier GNOME and KDE. It uses less memory and fewer CPU cycles than either of
    the alternatives in a normal configuration. While this means Xubuntu is often
    seen as having fewer features or being less user-friendly than Ubuntu or Kubuntu,
    it also means that it runs faster, is more responsive, and tends to run quickly
    on older or less powerful computers, where the weight of GNOME or KDE makes the
    system prohibitively slow. As a result, Xubuntu has been used frequently by computer
    recyclers, by the owners of old computers, and by those who just want to squeeze
    out better performance from their hardware using a more efficient interface.


    Like Kubuntu, Xubuntu is community driven and began outside the universe repository
    of Ubuntu. In releases 5.04 (Hoary Hedgehog) and 5.10 (Breezy Badger), Xfce 4
    was supported by a special Xfce Team in Ubuntu. Due to the great work done on
    Xfce, Xubuntu was brought into the fold and became Ubuntu''s third partner project
    and a part of the main Ubuntu repository, for release 6.10 (Edgy Fest).


    > > **Xubuntu**

