    # I Forgot My System Password—What Can I Do?


    Although passwords are indefinably essential and useful, they are also prone to
    being forgotten. With an increasing number of nasties on the Internet wanting
    to suck away your passwords, you need to think of more complex passwords, which
    are in turn harder to remember and easier to forget.


    If you forget the system password, you need to jump through a few more hoops to
    reset your password. Restart your computer, and when you see the word GRUB appear
    on the screen, press Escape to see the boot menu. Select the recovery mode option
    from the menu. When the computer boots, it will present you with a root shell.
    At the prompt type:


    ```

