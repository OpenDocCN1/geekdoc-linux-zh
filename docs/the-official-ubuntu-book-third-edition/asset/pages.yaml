    # Remote Printing


    You can also configure your Ubuntu system to send print jobs to a remote print
    server. If, for example, you have a Windows system with a printer attached on
    your network, simply choose the Network Printer button and specify the host name
    or IP address of the Windows system. You will then have to specify a connection
    protocol.


    If your Windows system is sharing a printer, you will have to specify Samba, which
    is the standard way to get Linux and Windows systems to communicate with each
    other. You will still have to specify a print driver, as described earlier.


    # Graphically Accessing Remote Files


    Within the Ubuntu desktop, you can use the same powerful file manager to manage
    files that are on a remote server, either on your local network or in far-flung
    parts of the world via the Internet. This feature is incredibly useful when you
    need to transfer lots of files around, such as when you work on Web pages or need
    to make your work remotely available to someone else. To access these files, you
    can connect to the server in various ways, each of requires a connection profile.
    This profile configures the connection, and you will need to gather your server''s
    settings to create it.


    To set up the connection, click Places > Connect to Server, and you will see the
    dialog shown in Figure 4-17.


    When the dialog box appears, select the type of connection from the combo box.
    The box then adjusts to display the settings required, and you should make sure
    the Name to Use for Connection box contains a descriptive name for the connection,
    such as "Work Server" or "Web Site.\ When you have added the settings, click the
    Connect button to continue.'
  merge: -1
  pgno: 179
- img_proc: true
  md: '![](img/aa15f1f82061fdaf4ff1da575e3e1c52_180_0.png)


    **Figure 4-17** Access your remote server''s files graphically on your desktop.


    An icon now appears on your desktop for the connection. Double-click the icon,
    and you are asked for a password to the server. Enter this password, and you are
    then asked if you would like to store your passwords in the keyring. The desktop
    keyringing provides a convenient place to store all of your connection passwords,
    and you need to remember only the password for the keyring itself. If you choose
    to store the password in the keyring, you are asked for a password for it. In
    the future, whenever you double-click the icon to access the server, you will
    be asked for the keyring password.


    When you have been authenticated to access the server, your files appear in a
    file manager window, and you can use the file manager as normal.


    # The Terminal


    Although Ubuntu is a desktop-driven OS, the system is running on a powerful and
    incredibly flexible command-line core. Inspired by more than 20 years of UNIX
    heritage, the command-line environment present on Linux systems enables you to
    perform some incredibly powerful tasks by stringing together different commands
    in different ways.


    The philosophy behind UNIX is to create a large number of small tools, each of
    which is designed to do one task but do it incredibly well. As an example, there
    is a command called `ls` that does nothing more than list'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# Chapter 4 Advanced Usage and Managing Ubuntu


    files in a folder. Although listing files is its singular function in life, it
    has every option imaginable for listing files.


    Although `ls` is limited by itself, it can be combined with other commands that
    have equal levels of flexibility to create impressively powerful combinations.
    To do this, a pipeline is created using the | symbol to connect these different
    commands. Pipelines can be constructed in any number of different ways, and once
    the user has the knowledge of what different commands can do, stringing together
    a pipeline of commands can virtually any task you can imagine.


    It should be made 100 percent clear that using the command line is not an essential
    skill required to use Ubuntu, but it is a skill that can increase the flexibility
    of your computer for more advanced, customized tasks.


    # A Crash Course in the Terminal


    Fire up the terminal by clicking Applications > Accessories > Terminal. You will
    see a terminal window similar to the one shown in Figure 4-18.


    ![](img/aa15f1f82061fdaf4ff1da575e3e1c52_181_0.png)


    > Figure 4-18 It is handy to drop into the terminal when you need to tweak something
    in particular.'
