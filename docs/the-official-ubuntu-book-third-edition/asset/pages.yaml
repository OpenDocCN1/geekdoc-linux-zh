- img_proc: true
  md: 'puter in a window and run an OS on it, entirely in software. Some commercial
    applications have been able to do this for a while, but recently the open source
    QEMU project has developed to a point that makes it viable to run a variety of
    different operating systems. It can run Windows, FreeBSD, Network, and even other
    Ubuntu installations.


    First, use Synaptic to install QEMU. When it has installed, use the file manager
    to create a folder in your home directory called qemu. Now load a terminal and
    run the following commands:


    ```

    foo@bar:~ $ qemu qemu

    foo@bar:~qemu$ qemu-img create hd.img 350M

    ```


    The last parameter (350M) indicates the size of the virtual drive in megabytes.
    Feel free to adjust this to your liking.


    The next step is to boot an install CD in the virtual machine:


    ```

    foo@bar:~$ qemu -boot d -cdrom /dev/cdrom -hda hd.img

    ```


    When your installation has finished, reboot the virtual machine:


    ```

    foo@bar:~$ qemu -boot c -fda /dev/fda -cdrom /dev/cdrom -hda hd.img

    user-net -pci -m 256 -k en

