  md: '# Configuring Your Keyboard


    The next screen (shown in Figure 2-3) configures your keyboard layout.


    Choose your country from the list to select your keyboard layout. You can use
    the box at the bottom of the window to test whether your keyboard layout works.
    Try typing some of the symbols on your keyboard (such as "/,|) to make sure they
    work. If you press a symbol and a different one appears, you have selected the
    wrong keyboard layout.


    # Disk Space


    The next part of the installation process prepares your hard disk for the software.
    This involves creating a number of partitions that store the Ubuntu system and
    your files. Hard disks are divided into partitions. Each partition reserves a
    specific portion of the hard disk for use by a particular OS. As an example, you
    may use the entire hard disk for your new Ubuntu system, or you may share the
    disk so both Windows and Ubuntu are installed. This shared scenario is known as
    dual-booting. In a dual-booting situation, your hard disk typically has Windows
    partitions as well as Linux partitions, and when it boots gives you a little menu
    so you can select whether to boot Windows or Linux.


    ![](img/aa15f1f82061fdaf4ff1da575e3e1c52_82_0.png)


