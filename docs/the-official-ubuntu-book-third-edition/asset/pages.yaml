  md: 'to the way the kernel in Ubuntu, sometimes there can be a slight delay before
    your files copy. If you remove the USB stick before copying has finished, some
    or all of the files may not have copied successfully.


    To ensure everything you do with the USB stick is complete before you remove it,
    you should unmount it. To do this, right-click the icon on your desktop or in
    Places > Computer, and select Unmount. Give it a few seconds, and when the light
