  md: '# Setting the Hostname and Time Zone


    You are next asked for a hostname for the computer (Figure 2-11).


    Use the text box to add your own hostname, or use the default Ubuntu hostname
    if required. Feel free to let your imagination go wild, and create a theme for
    your hostnames (such as superheroes).


    After choosing a hostname, you will be asked to select your time zone. Choosing
    this should be a fairly straightforward operation.


    # Creating Partitions


    The system will then read your disks to find out the current partition information.
    You will be asked to create or select partitions for Ubuntu to install onto. Creating
    partitions is the most challenging part of the installation routine. You will
    see the screen shown in Figure 2-12. Before you partition your disk, think about
    how your partitions should be organized.


    You are given a number of partition options:


    +   * Guided—Use Entire Disk

    * Guided—Use Entire Disk and Set Up LVM

    * Guided—Use Entire Disk and Set Up Encrypted Disk

