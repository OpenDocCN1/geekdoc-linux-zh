  md: 'little configuration. To begin, you must decide whether you require a DHCP
    server. If so, install the ltsp-server-standalone package. If you already have
    a DHCP server and are going to configure it to point to the LTSP server, by modifying
    the filename, next-server, and root-path options, you should install the ltsp-server
    package. Along with this, you will need the openssh-server package.


    The easiest way to do this is to open a terminal window via the Applications >
    Accessories > Terminal link in the main menu. Once here, you should type the following
    commands to install the LTSP server and the SSH server. In our example, a DHCP
    server was not required.


    ```

    sudo apt-get install ltsp-server openssh-server

    ```


    If you require a DHCP server, modify the line above from ltsp-server to ltsp-server-standalone.
    You will also need to configure a second network device to an IP address of 192.168.0.1
    before running the procedures described in this subsection.


    All that is left to do now is to install the client chroot by running the following
    command:


    ```

    sudo ltsp-build-client

    ```


    After this, you should be able to boot your first thin client.


    # Special LTSP Cases


    Setting Up LTSP to Coexist with an Existing DHCP Server Sometimes you might not
    want to be your machines on a totally separate subnetwork. However, the problem
    becomes that the current DHCP server will not be set up to serve the correct options
    to enable the clients to boot from the network. Modifying a Linux-based DHCP server
    is well documented; however, some establishments will require the modification
    of a Microsoft Windows DHCP server to allow clients to boot from the network.


    The following setup assumes that there are currently no thin client systems running
    on the Windows network. Opening up the Windows DHCP administration tool will allow
    you to create reservations for your machines. A reservation is an IP address tied
    to a specific MAC address. In this way,'
  merge: -1
  pgno: 386
- img_proc: true
  md: 'each time a machine requests an IP address from the DHCP server, it is always
    given the same IP address. This has its benefits as you can then set advanced
    options for the client as well.


    For each client, you will need to create a reservation and then add the following
    options to each one (Figure 9-12).


    +   - 017 Root Path: /opt/ltsp/i386

    - 066 Boot Server Host Name: <server ip>

    - 067 Bootfile Name: /ltsp/i386/pxelinux


    It is recommended that you restart the DHCP server. After this, the clients should
    be able to correctly pick up their IP address from the server and then boot from
    the LTSP via NFS.


    You can also set these options as global parameters to be rolled out over the
    entire network. However, it is often advisable, at least in the beginning, to
    keep track of which machines are booting from the LSP server.


    ![](img/aa15f1f82061fdaf4ff1da575e3e1c52_387_0.png)


    Figure 9-12 Windows DHCP Reservations'
