    # Internet Relay Chat


    While mailing lists provide the primary venue for asynchronous communication (i.e.,
    not at the same time), there is still an important need for synchronous, or real-time,
    collaboration. Internet Relay Chat (IRC) fills this niche. While it was designed
    primarily for group (i.e., many-to-many) communication in channels, it is also
    equipped with private messaging capabilities that facilitate one-to-one communication—all
    instantaneously. It is very similar to instant messaging or chat room communication.
    While time zones and a round globe make it difficult for the global community
    to meet at the same time, many users and developers take advantage of IRC''s capability
    to let anyone chat about an issue in real time or to ask a question and have it
    answered immediately.


    Like mailing lists, IRC channels provide a venue for a variety of different types
    of communication in a variety of different subcommunities in Ubuntu. There are
    many different channels, including channels in a variety of languages.


    All official Ubuntu IRC channels are located on the FreeNode IRC network, which
    also hosts a range of free and open source software projects. Users can connect
    to IRC via several pieces of software in Ubuntu, including Pidgin, XChat-gnome
    (Figure 7-1), and IRSSI. Like the ubuntu-users e-mail list, #ubuntu is designed
    for help and support. When joining any channel, users should carefully read the
    topic as many fre'
