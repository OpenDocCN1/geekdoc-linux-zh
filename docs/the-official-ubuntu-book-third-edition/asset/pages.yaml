  md: '# Shortcut Icons


    On the panel are a number of shortcut icons next to the menus. These small icons
    are always visible and can be single-clicked to gain immediate access to your
    favorite applications. Ubuntu comes with several stock shortcuts on the panel,
    but you are welcome to add your own.


    Adding your own icon is as simple as finding the application you want to add in
    the menu and then dragging it to the panel. You can then right-click the new shortcut
    icon and select Move to move it to the right place.


    # Applets


    One simple yet powerful feature in Ubuntu is the ability to run small programs
    called applets on the panel. These small programs are useful for a variety of
    tasks and provide quick and easy access via the panel.


    To add an applet, right-click the panel and select Add to Panel. The window shown
    in Figure 3-4 pops up. Select one of the applets, and click Add. When the applet
    appears on the panel, you can press the middle mouse button (or the left and right
    buttons together) to move it around.


    ![](img/aa15f1f82061fdaf4ff1da575e3e1c52_105_0.png)


    Figure 3-4 Ubuntu comes bundled with a selection of applets.'
  merge: -1
