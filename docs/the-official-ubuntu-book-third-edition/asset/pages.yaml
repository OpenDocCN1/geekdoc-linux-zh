- img_proc: true
  md: 'This application serves as a full-fledged media library that can create playlists,
    track how often you listen to certain songs, and play your music CDs. Wondering
    what the CD cover of your favorite new album looks like? Just grab this information
    for you as well. Music is stored in a collection library arranged by artist, album,
    and songs based on the tags built into the media.


    # Common Applications


    Kubuntu comes with a large number of applications preinstalled and configured,
    including Web browsers, office applications, and e-mail programs. Remember, since
    choice is a huge feature of Kubuntu, if you do not like the default applications,
    you can change them. All of these applications are available through the Application
    Launcher.


    # OpenOffice.org


    The default office application for Kubuntu 8.04 is OpenOffice.org 2.3. This version
    is an update of the second major release of the suite that includes Writer, Calc,
    Impress, Draw, and Math; the first three can be launched from the Application
    Launcher. (Draw and Math are not available from the menu and are launched from
    one of the other applications.) Note that the developers of Kubuntu have renamed
    the applications in the Application Launcher to better reflect what each does.
    For example, Writer is renamed Word Processor.


    Each of these programs is easy to use and can help you switch from the suite to
    the Microsoft Office product line. In fact, OpenOffice.org suite is included in
    the desktop CD and can be installed on a Windows system to help you get comfortable
    and ready for a switch to Kubuntu. Each application responds to a similar application
    in the Microsoft product line. Calc is very similar to Excel, Writer works like
    Word, and Impress replaces Powerpoint. OpenOffice.org can handle all but Microsoft
    Access files without problems, and the whole suite is ready to be used in a corporate
    environment as well as for personal use.


    To demonstrate the power of OpenOffice.org, let''s create a new document. To start
    OpenOffice.org Writer, open the Application Launcher and navigate to OpenOffice
    and then Word Processor. You can also launch KRunner (Alt-F2), type word processor,
    and hit Enter.'
