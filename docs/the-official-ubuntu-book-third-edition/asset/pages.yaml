    # The Fridge


    The Fridge (http://fridge.ubuntu.com) is the quirky community portal for Ubuntu.
    In many Western cultures, refrigerators provide a central sort of “bulletin board”
    in a family’s home. Because refrigerators are magnetic, children and parents can
    use magnets to hang pieces of paper that they want to share with the community
    of people who come in contact with that fridge. For children, this often includes
    good grades, news reports, or other information that someone is proud of or wants
    to share. The Fridge, bearing the tag line, “It’s cool . . . It’s fresh . . .
    Stick on the Fridge!” tries to create a shared resource within the Ubuntu community.
    The Fridge home page is shown in Figure 7-4.


    The Fridge is perhaps best described as the community portal for Ubuntu. It is
    part news site, part grassroots marketing and advocacy site. It hosts developer
    interviews, a picture gallery, a calendar with a list of upcoming events, polls,
    a list of Ubuntu-in-the-press citations, and much more. The core content on the
    site is arranged as a Web log. Users frequently set The Fridge as their home page
    or subscribe to the site via RSS feed. The Fridge is unique in the community that
    it appeals to a wide variety of Ubuntu participants—developers, advocates, translators—and
    provides a venue where each group can share information with others. There is
    a story every two to three days on The Fridge, although this may increase to up
    several stories a day with time. Users can comment and discuss each story on The
