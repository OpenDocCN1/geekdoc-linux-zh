- img_proc: true
  md: '# Launchpad 381


    Malone''s first role is to provide a location where users can submit bugs. Malone
    is not just a way to collect complaints, though. Rather, its job is to track and
    record a bug through its full life cycle, from report to close. Bugs can be assigned
    to a particular developer or reassigned. If the bug is in, the result of another
    application, the bug can be reassigned to another package. Bugs can be rated according
    to severity, tagged and categorized in any number of useful manners. Information,
    files, and patches that fix a bug can be uploaded to Malone. When the bug has
    been resolved, it can be closed. The Malone bug report provides a single venue
    in which to collect information from the bug submitter, the bug fixer, the upstream
    maintainer if necessary, and any other involved party.


    All of this, course, is exactly what you would expect from any usable modern bug
    tracker. Where Malone aims to distinguish itself from its competitors through
    its integration in Launchpad. First and foremost, this means that users of Malone
    can track the status of a bug as it relates to a particular patch or a particular
    piece of code. Because Ubuntu supports every release for 18 months and some releases,
    such as Ubuntu 6.06 LTS, for much longer, it''s important that Ubuntu be able
    to track which bugs show up in which releases. As derivatives of Ubuntu are created
    in Launchpad, Malone also allows these derivatives to use Malone to see bugs submitted
    against Ubuntu or other distributions apply to their code and, if so, to quickly
    grab a fix.


    As with Rosetta, Launchpad karma can be built by fixing, reporting, and interacting
    with bugs over time. Bug triage involves closing reproducible bugs and merging
    duplicate bugs is one way that users can build up their karma. Of course, simply
    running developer versions and submitting new bugs is another way to build good
    karma.


    TIP Malone


    Malone can be found at www.launchpad.net/malone.


