    because there''s usually no reason for a server to be chasing new features. New
    features bring new bugs, and as a system administrator, you should value stability
    and reliability metrics over features. Ubuntu''s brief, six-month development
    cycle means that you''ll be able to get all the new features in half a year anyway.
    But by then they will be in the main repositories and will have received substantial
    testing. Keeping a system up to date means making sure it''s running the latest
    security patches, to prevent any vulnerabilities discovered after the release
    from endangering your system.


    Luckily, apt-get makes this process amazingly easy. You begin by obtaining an
    updated list of packages from the Ubuntu archive:


    ```

    $ sudo apt-get update

    ```


    and then you run the upgrade:


    ```

    $ sudo apt-get upgrade

    ```


    After this, apt-get will tell you either that your system is up to date or what
