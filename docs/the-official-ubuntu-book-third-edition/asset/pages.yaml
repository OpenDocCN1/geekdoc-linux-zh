  md: '# Free Software


    For Ubuntu, the “free” in “free software” is used primarily in reference to freedom
    and not to price—although we are committed to not charging for Ubuntu. The most
    important thing about Ubuntu is that it confers rights of software freedom on
    the people who install and use it. It is free-freedom that enable the Ubuntu community
