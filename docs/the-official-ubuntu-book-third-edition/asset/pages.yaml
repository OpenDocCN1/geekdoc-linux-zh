  md: '# # Shutting Down Your Computer and Logging Out


    Now that you''re becoming acquainted with Ubuntu, you''ll want to keep it as long
    as possible, but there will always come a time when you have no choice but to
    leave your computer and go something else. As you have already seen, Ubuntu is
    extremely flexible, and this area is no exception. Click System > Log Out or the
    icon in the top right of the screen to see the various options (shown in Figure
    3-5) for ending your computer session.


    There are a number of options available upon logout, however, the choices presented
    to you will depend on your installation (e.g., Suspend may not be available).


    +   * **Log Out:** This option lets you log out of the current session and go
    back to the main login screen.

    * **Lock Screen:** This option locks the screen. This is useful when you need
    to use the bathroom or grab some lunch. It will lock the computer and ask for
    your password to reenable the desktop.

    * **Switch User:** When you click this option, your user account remains logged
    in, but another user account can be used. When the second account logs out, Ubuntu
    reverts to the original one.

    * **Suspend:** If your computer supports Suspend, click this icon to suspend the
    power. The next time your computer is turned on, the desktop will be resumed.


    ![](img/aa15f1f82061fdaf4ff1da575e3e1c52_108_0.png)


    *Figure 3-5* Who that shutting down had so many possibilities?'
  merge: -1
  pgno: 108
