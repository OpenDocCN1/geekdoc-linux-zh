- img_proc: true
  md: 'Ubuntu should automatically recognize any Windows partitions you have on your
    computer and set them up for you; however, you may need to modify or add your
    own. You should first load System > Administration > Disks and write down the
    partition numbers and filesystem for your Windows partitions. The partition number
    will look something like /dev/hdb1 or /dev/sdb1, and the filesystem will be either
    FAT, VFAT, or NTFS.


    The next step is to create some mount points. When your Windows partitions are
    enabled, they are accessed via a particular folder in Ubuntu. This is called a
    mount point. So, as an example, if you have a mount point as /media/win1 and on
    your Windows partition you want to access your Work folder, you would access it
    from Ubuntu as /media/win1/work.


    Mount points usually live in the /media folder. Create a different mount point
    for each Windows partition. As an example, if you have three partitions, run the
    following commands:


    ```

    foo@bar:~$ sudo mkdir /media/win1

    foo@bar:~$ sudo mkdir /media/win2

    foo@bar:~$ sudo mkdir /media/win3

    ```


    Open up the following configuration file:


    ```

    foo@bar:~$ sudo geedit /etc/fstab

    ```


    The /etc/fstab file maps partition numbers to mount points. At the bottom of the
    file add a line like this for each mount point:


    ```

    /dev/hdb1 media/win1 vfat users,rw,owner,umask=000 0 0

    ```


    You will need to change the partition number (the first column), mount point (second
    column), and filesystem (third column) for your relevant partitions.


    Now reload /etc/fstab to enable the partitions:


    ```

    foo@bar:~$ sudo mount -a

    ```


    Some hard disk icons for the new partitions now appear.'
