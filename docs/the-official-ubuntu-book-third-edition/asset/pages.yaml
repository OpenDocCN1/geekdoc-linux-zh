  md: '# Venues 243


    people contribute more hours, more effort, more code, more translations, more
    documentation, or more advocacy work to Ubuntu others, no individual or subgroup
    can take credit for everything that Ubuntu has become. In Ubuntu, no contribution
    is expendable. Having a community also reflects Ubuntu''s goal to provide a low
    barrier for entry for these contributions. Anyone who cares about Ubuntu can contribute
    to the project and can, in whatever ways are most appropriate, become a participant
    in the Ubuntu community.


    This chapter provides a bird''s-eye view of the venues and processes in which
    the Ubuntu community is active. First, it takes a tour through the venues through
    which the Ubuntu community communicates. It continues by looking at the way the
    community is organized and the processes by which organization works. Finally,
    it walks you through the ways you can participate in the Ubuntu community and
    contribute to its success.


    # Venues


    As described in Chapter 1, transparent and public communication is an early goal
    of the Ubuntu project. Technical and community decisions are made publicly and
    are accessible to all interested parties. When this is impossible (e.g., when
    there is a face-to-face meeting and it''s not simply possible for everyone interested
    to attend), the community attempts to publish summaries and minutes and to provide
    venues for feedback. Ubuntu contains no “member only,” “developer only,” or “decision
    maker only” back channels except to preserve individual privacy or security—and
    the Ubuntu community refuses to create them. All work in Ubuntu occurs in places
    where everyone can view the work, and anyone who agrees to engage constructively
    and respectfully can participate.


    Of course, this activity is public only to those who know where to find it. This
    section traces the venues for communication in Ubuntu as completely as possible.
    It describes the places where discussions of development, support, and advocacy
    take place. While nobody can engage in communication in all of the venues described,
    knowledge of what exists allows participants to be more informed when they need
    to choose the right place to ask a question or to make a suggestion.'
