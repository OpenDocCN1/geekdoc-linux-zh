  md: '# Working with Windows


    Although the Linux platform offers an increasingly compelling platform for the
    desktop, there are sometimes situations when there is no alternative application
    available. This is often the case with specific business applications, educational
    tools, and games. Luckily, you can run any of these applications right on top
    of your Ubuntu desktop.


    For the last twelve years, the members of the Wine project have been bevering
    away to create a free software implementation to run Windows applications on Linux.
    They have made great strides in getting more and more applications to run. Although
    there are still quirks here and there, many programs run perfectly under Wine.
    It is recommended that you run the applications you want to run before you use
    them for important work.


    Install the Wine package with the Add/Remove Applications menu option or the Synaptic
    package manager. When the package has downloaded and installed, run the winecfg
    tool. To do this, press Alt-F2, and type winecfg. This small program sets up your
    Wine environment and provides some options for configuring how your Wine system
    is run. The default settings should be suitable for most applications.


    # Running Applications


    To run an application, right-click it, and select Open with Wine Windows Emulator.
    Most Windows applications need to be installed before use, so first right-click
    the setup program, and run it under Wine. When the program is installed, you can
    find it in the .wine/c_drive/Program Files folder in your home folder. Navigate
    to that directory (making sure you turn on hidden file viewing in Nautilus) and
    run any files with an .exe extension.


    # Using Windows Files on Another Partition


    For those of you with a considerable amount of your life present on partitions,
    you may want to be able to access these partitions from Ubuntu. This is no problem,
    although you will need to edit a special configuration file to do this. Luckily,
    you need to edit this file only once, and then everything will be set up.'
