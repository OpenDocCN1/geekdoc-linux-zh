  md: '# LINUX


    Ubuntu is a complete, free operating system that emphasizes community, support,
    and ease of use without compromising speed, power, or flexibility. Its Linux for
    human beings—designed for everyone from computer novices to experts. Ubuntu 8.04
    LTS (Long Term Support), a.k.a. “Hard Heron,” is the latest release—more powerful,
    more flexible, and friendlier than ever. The Official Ubuntu Book, Third Edition,
    will get you up and running quickly.


    Written to help Ubuntu community members, this book covers all you need to know
    about the most of Ubuntu 8.04 LTS, whether you are a home user, small business
    user, server administrator, or programmer. The authors cover Ubuntu 8.04 LTS from
    start to finish: installation, configuration, desktop productivity, games, management,
    and much more. The many new topics covered in this edition: the new Ubuntu and
    the brand new Remix using KDE 4.


    The Official Ubuntu Book, Third Edition, covers standard applications, from word
    processing, spreadsheets, Web browsing, e-mail, instant messaging, music, video,
    and games to software development, databases, and server applications. In addition,
    you''ll


    +   - Learn how to customize Ubuntu for home, small business, school, government,
    and enterprise environments

    - Learn how to update Ubuntu to accommodate new versions and new applications

    - Learn up-to-the-minute troubleshooting from Ubuntu users worldwide

    - Learn Ubuntu Server installation and administration, LVM and RAID implementation

    - Learn about Eduntu—Ubuntu optimized specifically for the classroom


    > The DVD includes the complete Ubuntu Linux operating system on PC platforms,
    preconfigured with an outstanding desktop environment for both home and business
    computing. It can be used to install other complete variants of Ubuntu (with the
    KDE environment), and Eduntu (for use in schools).


    Community Contributors: Kyle Rankin, David Bolin, Tim Aretz, David Bain, Alan
    Barnett, David Cornet, Scott Dier, Kevin Goldstein, Oliver Graver, Oskar Jöfner,
    Ajay Kumar, Keith Kyzvat, John LaPrade, Freddy Martinez, Avinash Mete, Julien
    Rottenberg, Stephen Sandlin, Matej Smit, James Sanger, David Simons, Paul van
    Genderen, Jaldhar Yavas, and Andrew Zajac.


    # THE AUTHORS


    Benjamin Mako serves on Ubuntu''s Community Council governance board, which helps
    oversee community aspects of Ubuntu. He works at the MIT Sloan School of Management
    and the MIT Center for Civic Media.


