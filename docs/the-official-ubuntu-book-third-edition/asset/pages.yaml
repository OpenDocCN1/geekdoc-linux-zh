    that you need to learn. Under LVM, physical volumes, or PVs, are seen as providers
    of disk space without any inherent organization (such as partitions mapping to
    a mount point in the OS). We group PVs into volume groups, or VGs, which are virtual
    storage pools that look like old cookie-cutter hard drives. We carve those up
