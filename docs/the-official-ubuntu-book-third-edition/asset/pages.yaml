- img_proc: true
  md: '# I Reinstalled Windows, and Now Ubuntu Won''t Start!


    The first thing your computer does when you turn it on is read a special place
    on your hard disk called the master boot record (MBR). The information written
    there tells the computer what to do. When you installed Ubuntu, it placed a boot
    menu on the MBR that lets you choose from which system to boot.


    Unfortunately, when you reinstall Windows, it will recreate the MBR, not taking
    into consideration that any other OS may exist and replacing it with an MBR that
    only boots Windows. This is no good, and you naturally want to be able to replace
    it with the menu that lets you choose which system to boot.


    Grab the CD you used to install Ubuntu on your computer. If you don''t have anymore,
    download a CD image from www.ubuntu.com/download, and burn it on a blank CD. If
    you use the live CD to install, you will need to use the alternative installation
    CD with the traditional text mode installer.


    Insert the CD in the drive, and restart your computer. It will boot on the CD
    instead of using the hard disk. Now highlight the Rescue a Broken System line,
    and press Enter. Select your language and keyboard, and let the installer detect
    the network (for the computer name, you can leave the default Ubuntu) just as
    you did when you installed Ubuntu for the first time.


    You will then be presented with a list of available partitions on your hard disks.
    Don''t worry about the first line (/dev/discs/disc0/part1). Start looking at the
    other lines. You need to remember on disk and on which partition Ubuntu is installed.
    Most of the time, you probably have just one disk. If you have Windows installed
    on it, it is probably located on the first partition of this disk, and Ubuntu
    should be on the second one. Therefore, you probably want to select /dev/discs/disc1/part2
    (and then press Enter), unless your situation is more complex.


    On the last screen, select the first line, Execute a shell in... . You can now
    enter commands. Start by mounting the disks on your system:


    ```

    foo@bar:~# mount -a

    ```'
  merge: -1
  pgno: 269
- img_proc: true
  md: 'Now type:


    ```

    foo@bar:~ df

    ```


    Look at the list printed on the screen. Search the last column for the single
    / character, and on the corresponding line look for the first column. It should
    say something such as /dev/hda2 (the last few characters may be different for
    you). Now type the following command, and replace /dev/hda with what you have
    just read, but without the last digit (e.g., without the 2 from /dev/hda2):


    ```

    foo@bar:~ grub-install /dev/hda

    ```


    Wait for the process to finish. It might take a few minutes. About a dozen lines
    should have appeared on the screen. Check whether the installation finished. If
    you do, everything went fine. You can now restart your computer by typing this:


    ```

    foo@bar:~ exit

    ```


    Eject the CD, and then select Reboot the System. Welcome back to Ubuntu!


    # How Do I Fix My Disk After a Power Failure


    Although the Ubuntu development team takes every care to ensure every possible
    situation is catered, for power cuts are one of the most difficult problems to
    resolve. Computers rely on power, and when it is dramatically removed from the
    system, the whole Ubuntu world in your computer shuts down immediately. The problem
    with this is sudden power failure causes your Ubuntu machine to shut down improperly.
    When you next start the computer, you may then be prompted with a confusing ffsck
    message. What is this, and how do you fix it?


    The fsck program is a little tool to fix hard disks that don''t have consistent
    filesystems, that is, filesystems typically made inconsistent by power failures.
    When the disk is inconsistent, Ubuntu automatically runs fsck to it. It asks you
    a bunch of questions that only a filesystem developer really understands, and
    you feel obliged to say Yes to each of them. As such, you sit there hammering
    the Y key over and over answering the questions.'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'There is a quick and simple fix to this problem. Instead of wearing out your
    Y key, you can simply edit one file and have any errors automatically fixed for
    you.


    If your system is already running the desktop, open a terminal. Enter the following
    command:


    ```

    foo@bar:~$ sudo gedit /etc/default/rcS

    ```


    Now change the FSCKFIX line to the following:


    ```

    FSCKFIX=yes

    ```


    Save the file, and the next time you reboot, fsck will fix any detected disk problems
    without you having to intervene.


    If you are using the character-based login, use the following command:


    ```

    foo@bar:~$ sudo nano /etc/default/rcS

    ```


    Change the FSCKFIX line as above, and then press Ctrl-O and Ctrl-X to save and
    exit.


