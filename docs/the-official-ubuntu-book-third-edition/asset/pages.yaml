    More important from the point of view of history, Shuttleworth is also the originator
    and initiator of the project—he made the snowball that would eventually roll on
    and grow to become the Ubuntu project.


    Shuttleworth was born in 1973 in Welkom, Free State in South Africa. He attended
    Diocesan College and obtained a business science degree in finance and information
