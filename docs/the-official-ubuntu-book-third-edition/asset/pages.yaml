    # Firefox for Browsing the Web


    Allowing choice is a key feature of Ubuntu distributions. Kubuntu can use the
    latest version of Firefox (3.0 as of this writing), which needs to be installed
    through Adept. Firefox has taken the Web browser world by storm and is as good
    as or better than Internet Explorer. Firefox not only provides better features
    and a better browsing experience but also adheres better to Web standards. Like
    Konqueror, Firefox includes tab browsing (File > New Tab or Ctrl-T), bookmarks,
    and everything you would expect of a modern Web browser.


    Firefox has many different extensions that can be plugged in to allow greater
    flexibility for your Web browser. The most common plug-ins are for using Macromedia
    Flash and Java, which some Web pages require.


    Installing a plug-in is as simple as visiting a Web site that requires it. A yellow-low
    bar will indicate that you are missing a plug-in. Click on the Install Missing
    Plug-ins button to install the required plug-in.


