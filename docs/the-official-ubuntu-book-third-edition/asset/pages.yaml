    # Teams, Processes, and Community Governance


    Ubuntu operates under the famous mantra of "rough consensus and running code."
    The project attempts to forge consensus, to make good technical decisions, and
    move forward. It attempts to minimize politic wherever possible and to distribute
    power to whoever are best at getting good work done. Mark Shuttleworth explains,
    "This is not a democracy, it''s a meritocracy. We try to operate more on consensus
    than on votes, seeking agreement from the people who will have to do the work.


    The project attempts to keep disagreements from spiraling out of control by enforcing
    mutual respect at all times with its Code of Conduct described in Chapter 1. Disagreements,
    of course, are inevitable and can be technical or nontechnical in nature. The
    community needs to be able to deal with these and, toward that end, has created
    a lightweight governance system that aims to ensure that disagreements are resolved
    carefully and that the project always has a strong, fair, and responsive direction.


    The Ubuntu site describes the goals of its community governance system as threefold.


    +   1. Ensure that a process is defined that allows people to contribute to decisions
    regarding the Ubuntu community and distribution.

    2. Ensure that decisions regarding the Ubuntu distribution and community are made
    in a fair and transparent fashion.

    3. Ensure that necessary decisions are actually made, even when there is no clear
    consensus amongst the community.'
