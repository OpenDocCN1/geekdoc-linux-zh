    # Ubuntu Won''t Start!


    When Ubuntu first starts, the GRUB bootloader loads an OS for you. If you have
    only Ubuntu installed on your computer, it is loaded automatically. Otherwise,
    if you have more than one OS (e.g., Ubuntu and Microsoft Windows), you can pick
    the relevant one from a menu. If you don''t see the word, restart your computer,
    wait until you see the word GRUB, and press Enter. Now use your arrow keys to
    select an option.


    The core chunk of software that is loaded when Ubuntu starts the kernel, and sometimes
    there are a few different kernels installed on your system. On the menu, each
    kernel version (such as 2.6.15) has two options: the stock kernel and one called
    recovery mode. Try booting the newest kernel that is not a recovery mode one,
    and see if your system starts.


    The Bootloader If your system still fails to start, it is likely that your bootloader
    is broken. When you use a bootloader such as GRUB, a tiny file (called the boot
    sector) is copied into the first part of your hard disk. If this file is broken
    or corrupted, your system often won''t boot. Don''t worry, you can fix this! Restart
    your computer, and choose the newest rescue mode option. When using rescue mode,
    the system starts in a limited single-user command-line mode. You can use this
    mode to fix any problems from the command line. In this case, you need to fix
    the GRUB bootloader.


