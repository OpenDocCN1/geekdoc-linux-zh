  md: 'Summary 117


    # Getting DVDs to Work


    Ubuntu comes with DVD support for unencrypted DVDs. With the DVD industry being
    what it is, the majority of DVDs come encrypted, and if you want to watch them,
    you need to ensure that a library can decrypt these DVDs is installed. Unfortunately,
    this library needs to be installed separately and is not included with Ubuntu.
    Refer to the Ubuntu wiki restricted formats page at https://wiki.ubuntu.com/RestrictedFormats
    for details.


    With the library installed, insert a disk into your computer, and Ubuntu will
    automatically start Totem to view the disk. Alternatively, free import Totem,
    and click Movie > Play Disk to play the DVD. Totem doesn''t support DVD menus
    but you can still use it to play a DVD.


    If you are settling down to watch a movie, you may want to configure a few other
    settings. First click View > Aspect Ratio for your screen, and then select View
    > Fullscreen to switch to full screen mode. To exit full screen, just move your
    mouse, and some-screen controls will appear.


    TIP


    Control Totem with a Remote Control Totem supports the Linux Infrared Control
    (LIRC) library so you can use a remote control while watching your media.


    # Summary


    In this chapter you''ve learned how to start using the core features of your new
    desktop. These concepts should allow you to perform most of the day-to-day tasks
    when using your computer and provide a base from which to explore the other applications
    installed on your system. This solid grounding in the desktop paves the way for
    you to meander through the rest of the book, learning about the more advanced
    uses of your new system and exploring the enormous flexibility that Ubuntu provides.


    Always remember that there is a wealth of help and documentation online. If you
    ever find yourself stuck, take a look at the Ubuntu Web site at www.ubuntu.com
    or the Ubuntu documentation at http://help.ubuntu.com and make use of the forums,
    wiki, mailing lists, and IRC channels.'
