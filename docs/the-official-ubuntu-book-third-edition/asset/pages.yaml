    # Hardware


    There are many, many different types of hardware available for computers, including
    Webcam, network cards, hard disks, video cards, sound cards, and more. For each
    of these devices to work, a driver needs to be loaded by the Linux kernel. Unlike
    systems such as Windows, you don''t need to install a special driver included
    with the device. Instead, the driver should already be included in Ubuntu and
    ready to work out of the box.


    Of course, this is not always the case, and sometimes hardware can be something
    of a beast to get working. In this section, we tear apart some of the hardware-related
    problems and attempt to resolve them.


    # Ubuntu Has Not Detected My Old Sound Card


    Many older devices are not automatically detected by the current 2.6 kernel series.
    This is done to avoid hardware issues as crashes. Unfortunately, if you have an
    older sound card, it means you need to roll up your sleeves and poke around to
    get it running. To do this, you need to know which kernel module your card needs
    and then load the module. Loading the correct module for your device will not
    cause your system to crash, but loading the wrong one may well do so. You may
    need to experiment with different modules.


    Look for the model of sound card you have by referring to your computer''s specifications,
    by checking the name of the device in Windows (if applicable), or by opening the
    computer case and looking at the sound chip. You can use Google to match a chip''s
    serial number with the chipset'
