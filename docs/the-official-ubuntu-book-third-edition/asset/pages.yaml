    # What Is a Distribution?


    It''s clear to most people that Ubuntu is an OS. The full story is a little more
    complex. Ubuntu is what is called a distribution of GNU/Linux—a distro for short.
    Understanding exactly what that means, once again, a little bit of history. In
    the early days of GNU and Linux, users needed a great deal of technical knowledge.
    Only geeks needed to apply. There were no Linux operating systems in the sense
    that we usually use the term—there was no single CD or set of disks that one could
    use to install. The software was dozens and even hundreds of individual programs,
    each built by a different individual, and each distributed separately. Installing
    each of the necessary applications would be incredibly timeconsuming at best.
    In many cases, incompatibilities and the technical trickery necessary to install
    software made getting a GNU/Linux system on a hard'
