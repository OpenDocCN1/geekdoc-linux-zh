    should have the freedoms required by free software. This is important for a number
    of reasons. It offers us users all of the practical benefits of software that
    runs better, faster, and more flexibly. More important, it gives every user the
    capability to transcend his her role as a user and a consumer of software. Ubuntu
    wants software to be empowering and to work in the ways that users want it to
    work. Ubuntu wants all users to have the ability to make sure it works for them.
    To do this, software must be free, so Ubuntu makes this a requirement and a philosophical
    promise.


    Of course, the core goals of Ubuntu do not end with the free software definition.
