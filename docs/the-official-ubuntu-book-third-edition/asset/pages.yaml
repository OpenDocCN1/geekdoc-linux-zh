    # I Want to Install an Application That Is Not in Synaptic


    Although Synaptic contains a huge selection of packages, sometimes the package
    you need is not included. The first thing you should check is that you have enabled
    the additional repositories such as universe and multiverse. Open Synaptic from
    System > Administration > Synaptic Package Manager. Now click Settings > Repositories
    > Add. Ensure that all of the components are selected. (See http://help.ubuntu.com/community/Repositories/Ubuntu
    for more details.)


    TIP


    The Repository Run-Down

    The universe repository contains the thousands of packages that are part of the
    Debian distribution, upon which Ubuntu is based. All of these packages are entirely
    free and supported by a community of Ubuntu contributors.


    The multiverse repository contains a number of packages that are freely available
    to download load but are not fully open source. If you want to run only open source
    software, you may not want to use this repository.


    If you have enabled these extra repositories and your package is still not there,
    have a quick hunt around with a search engine to see if you can find a repository
    (known as a Debian or APT repository) for your package. If you find one, use the
    Repositories dialog you have played with to add the new repository, and then use
    Synaptic to install the package.


    If no repository is available, look for a Debian package (.deb) for the application.
    If you find one, download it, and double-click to install. If no Debian package
    exists, look for an Autopackage. (An upcoming section, I Downloaded an Autopackage,
    but I Don''t Know How to Run It, provides details about Autopackage installation.)


    Finally, if all else fails, download the source code and compile it.


    # I Want a Local Copy of the Ubuntu Repositories


    If you have a number of computers to administer or a lot of package maintenance,
    having a local copy of the Ubuntu repositories can make your life a lot easier.
    There are two primary ways to do this: via debmirror and via rsync. Both are fairly
    lengthy processes to undertake, so the full recipe is hosted on the Ubuntu help
    wiki at http://help.ubuntu.com/community/Rsyncmirror and http://help.ubuntu.com/community/Debmirror.'
  merge: -1
