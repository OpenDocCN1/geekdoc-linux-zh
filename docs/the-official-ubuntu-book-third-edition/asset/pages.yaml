    # Keeping Your Computer Updated


    No OS or piece of software is perfect. This means that Ubuntu developers release
    a number of security and other updates. These come as needed and are quite easy
    to install.


    Most of the updates to your machine will be security related. This means that
    the developers have found a flaw in a particular program in Ubuntu and have released
    a fix for it. There will also be a small number of updates to fix some critical
    bugs. For a home user, there is generally no reason not to install these right
    away, as not installing them might leave your computer open to security breaches,
    virus infection, or worse. Ubuntu developers have a very strict policy about not
    putting new versions of programs into stable versions of Ubuntu, which keeps your
    system more stable by not introducing new problems.'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# Installing Updates


    Helpfully, Ubuntu will tell you when you need to update your machine. Simply look
    for the icon shown in Figure 4-8 in the upper right of your screen.


    In addition, a small bubble will pop up to alert you to new updates (Figure 4-9).


    Click on the bubble or the icon to launch the update program. It will ask you
    for your password and then show you what you need to update. To start the update,
    click on the Install Updates button. The update window is shown in Figure 4-10.


    # Learning about What Was Updated


    The update window will also show you specifically what is going to be fixed. In
    the details pane, it will show you what got fixed and how. It might also list
    a CVE number. The CVE number is a unique identifier for a security vulnerability.
    You can look it up on http://cve.mitre.org to see the exact flaw was. However,
    in general you don''t need to worry about details.


    ![](img/aa15f1f82061fdaf4ff1da575e3e1c52_168_0.png)


    Figure 4-8 The security update icon


    ![](img/aa15f1f82061fdaf4ff1da575e3e1c52_168_1.png)


    Figure 4-9 The bubble making you aware of new updates'
