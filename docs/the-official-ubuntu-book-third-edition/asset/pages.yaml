  md: '# Mailing Lists


    The most important venue for communication in Ubuntu is the Ubuntu mailing lists.
    These lists provide the space where all important announcements are made and where
    development discussions take place. There are, at the time of this writing, 280
    public e-mail lists. This number is constantly growing—there were less than half
    as many when we wrote the second edition of this book a year ago and half that
    many a year before that!


    An-to-date, full page of mailing lists for Ubuntu can be found at http://lists.ubuntu.com,
    where users can see a list of available mailing lists, view archived discussions,
    and subscribe to lists through a Web interface.


    Lists are one of the oldest forms of communication by e-mail. A mailing list provides
    a single e-mail address that, when mailed, will then relay the received message
    to a large number of people. In Ubuntu, lists are topical, and individuals can
    subscribe to a mailing list if they want to receive information on the list''s
    topic. All mailing lists at Ubuntu are hosted at lists.ubuntu.com. If you would
    like to send a message to a list, simply e-mail `<list name>@lists.ubuntu.com`,
    replacing `<list name>` with the name of the list you are trying to mail.


    With some exceptions (e.g., the e-mail lists for the Technical Board or Community
    Council), anybody can subscribe to any Ubuntu list. In most cases, the capability
    to send e-mail to lists is restricted to list members (membership in lists is,
    of course, open to anyone). This means that an e-mail sent from someone who is
    not a member of that list is put into a queue to be reviewed by a human moderator
    before it is broadcast to list members. This is done as an antspam measure. Users
    can subscribe to lists and then configure the system to never send e-mail. For
    several e-mail lists, all messages are moderated. This is largely to ensure that
    lists remain “low volume” or “announcement only.”


    Ubuntu''s mailing lists run on the popular Mailman software, which may be familiar
    to some users. Mailman makes it simple to subscribe to lists, unsubscribe, and
    to configure any number of options about mail delivery. One popular option is
    to receive a daily digest of messages rather than a separate e-mail each time
    a new message is sent. This is all available through a Web interface at http://lists.ubuntu.com.
    Users can also sub-'
  merge: -1
  pgno: 285
- img_proc: true
  md: 'scribe to lists by sending an e-mail with “subscribe” in the subject line to
    <mailing list name>-REQUEST@lists.ubuntu.com.


    While each list plays an important role in the Ubuntu community, the following
    central lists warrant a little more detail. You might find it a good idea to subscribe
    to them.


    ubuntu-announce This fully moderated list relays all important announcements for
    the Ubuntu project and usually contains less than one e-mail per week. It is the
    first place where new releases are announced and where other important information
    can be found first. If you use Ubuntu, you may want to consider subscribing to
    this list. If you subscribe to only one list, this should be it.


    ubuntu-devel-announce This fully moderated list contains announcements related
    to the development of Ubuntu. It is low volume and contains one to three e-mails
    per week. If you work with code in Ubuntu, use a development release, or contribute
    on any technical level, you should be on this list. If you are at all involved
    in development for Ubuntu, this (in addition to ubuntu-announce) is the list you
    must subscribe to.


    ubuntu-users This is a primarily support-oriented list for questions and answers
    that Ubuntu users have. It is a very high-volume list, but it is an excellent
    place to ask questions and have them answered. It is a useful general-purpose
    list for discussion of any issue that pertains primarily to Ubuntu.


    ubuntu-devel-discuss This is the primary open list for general-purpose discussion
    of Ubuntu development. If you are looking to contribute to Ubuntu in any technical
    way, you should subscribe to this list and begin to follow the discussion. The
    list has a relatively high volume of e-mails.


    ubuntu-devel This is a moderated list for discussion of Ubuntu. While subscribing
    remains free, posting to the list is restricted to those who are Ubuntu developers
    or chosen others. Others may post, but all posts are checked by a moderation team.'
