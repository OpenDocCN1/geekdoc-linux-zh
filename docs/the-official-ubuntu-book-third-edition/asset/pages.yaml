    is like being standard; it is not coercive. Unlike holding a monopoly, becoming
    the canonical location for something implies a similar sort of success—but never
    one that cannot be undone, and never one that is exclusive. Other companies will
    support Ubuntu and build operating systems based on it, but as long as Canonical
