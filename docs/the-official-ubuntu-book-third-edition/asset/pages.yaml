  md: '![](img/aa15f1f82061fdaf4ff1da575e3e1c52_176_0.png)


    Figure 4-13 The GNOME Printers dialog box


    # Gathering Information


    The most important thing to remember when configuring a printer is to not get
    ahead of yourself. Before you start clicking on icons and running anything, make
    sure that you have completed the following steps.


    +   - Obtain the make and model of the printer. In our example, we add a Lexmark
    Z33.

    - Plug in the printer, and turn it on.


