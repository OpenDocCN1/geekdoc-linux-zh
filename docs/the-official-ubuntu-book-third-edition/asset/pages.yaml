    Early distributions were projects that collected all of the necessary pieces of
    software from all of the different places and put them together in an easier-to-install
    form with the most basic configuration already done. These distributions aimed
    to make using GNU/Linux more convenient and to bring it to larger groups of users.
    Today, almost nobody uses GNU/Linux without using a distribution. As a result,
    distribution names are well known. Ubuntu is such a project. Other popular distros
    include Red Hat, Novell’s SUSE, TurboLinux, Linspire, Gentoo, and Debian.


    Most distributions contain a similar collection of software. For example, they
    all contain most of the core pieces of GNU and a Linux kernel. A set of applications
    on top of it may include a Web browser, a desktop environment, and an office suite.
    While distributions started out distributing only the core pieces of the OS, they
    have grown to include an increasingly wide array of applications as well. A modern
    distribution includes all of the software that “comes with an OS”, that is, several
    CDs or DVDs containing anything that most users want and that the distribution
    is legally allowed to distribute.


    Ubuntu, like other contemporary distros, offer a custom installer, a framework
    including software and servers to install new software once the system has been
