  md: '# Using Your Applications 73


    If you have used a word processing program before, many of the common interface
    elements, such as the buttons for setting font type and size, bold, italic, underline,
    and alignment, look and behave the same. The OpenOffice.org developers have designed
    the suite to be easy to migrate if you have used a program like Microsoft Office.
    After a few hours playing with OpenOffice.org, you are sure to know how to do
    what you need.


    Start your letter by first choosing a nice font. In the font combo box, you should
    see Times selected as the default. Click the box and instead choose the lovely
    Bitstream Vera Sans font. Change the font size by clicking the combo box to the
    right of the font box and selecting 10 as the size. With the cursor on the left
    side of the page, add your address to the letter.


    Now press Enter to leave a blank line under the address, and click the Align Right
    toolbar (the icon looks like some lines aligned to the right). If you are unsure
    of what a button does, hover your mouse over it to pop up a tool tip. Now add
    to your letter address the recipient.


    Press Enter again to leave a blank line, and type the main body of the letter.
    Feel free to use the bold, italic, and underline buttons to add emphasis to your
    words. You can also use other toolbar buttons to add items such as bullet points
    and numbered lists and to change the color of the font. If you want to add features
    such as graphics, tables, special characters, and frames, click the Insert menu
    and select the relevant item. You can customize each item added to the page by
    right-clicking the item and using the options shown in the context menu.


    When your letter is complete, you can save it by selecting File > Save, by clicking
    the floppy disk toolbar icon, or by pressing Ctrl-S. The default file format used
    by OpenOffice.org is the OpenDocument Format. This file format is an open standard
    and is used across the world. The file format is slightly different for different
    types of applications (.odt for word processor files, .ods for spreadsheets, and
    so on), but each format provides an open standard free from vendor lock-in. You
    can also save in a variety of other formats, including the default formats for
    Microsoft Office.'
