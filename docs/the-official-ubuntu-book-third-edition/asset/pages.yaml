  md: '# Managing Your Files


    The Nautilus window is split into two parts. The sidebar shows categories of information
    such as bookmarks, folders, emblems (more on later), and more. In the main part
    of the window, you can see the subfolders and files in the current folder. By
    default, Nautilus displays your bookmarks and displays the contents of your home
    folder.


    So, let''s play with Nautilus and see what you can do with it. There are important
    skills to learn general file management. Many of the tasks you need to do can
    be achieved by right-clicking your file/folder and selecting the relevant option.
    There are also a number of options in the Edit menu.


    First, create a folder right-clicking the main part of the window and selecting
    Create Folder. A folder is added, and you can type in the name of it. If you change
    your mind about the name, rename it by right-clicking and selecting Rename. If
    you double-click on a folder, you can access it and perform the same operations
    within that folder.


    > QUICK TIP Just as folders and directories are the same, so folders and subfolders
    ... well, almost. When we refer to subfolders, we are referring to folders contained
    within another folder. For example, /home is a folder, while we can refer to /home/mako
    as a subfolder of /home.


    Nautilus is also flexible in how your files are displayed. You can view the files
    and folders as either the default collection of icons or as a list. To switch
    to the list view, select View > View As List. You can configure the organization
    of how your files and folders are displayed by right-clicking the main part of
    the window and selecting one of the options in the Arrange Items menu. Play with
    each of these options to see which works best for you.


    > QUICK TIP Just like in the file dialog, Nautilus displays each of the different
    parts of the path as different buttons. As an example, /home/mako/work would have
    three buttons: home, mako, and work.


    # Selecting, Copying, and Moving Files and Folders


    Copying and moving files and folders are simple tasks with Nautilus and can be
    done in a number of different ways. To test this, create two folders'
  merge: -1
  pgno: 150
- img_proc: true
  md: 'called Work and Invoices in your home directory. Save some files inside each
    folder. You can quickly create empty files by double-clicking the folder to go
    into it, right-clicking, selecting Create Document > Empty File, and renaming
    the file to something useful. With a couple of folders now complete with files
    in them, let''s move around.


    One method is to use two windows. Right-click the Work folder, and select Open
    in New. You now have two windows open, one with the contents of Work and one with
    the contents of your home directory. Now copy the Invoices folder to the Work
    folder by clicking it and dragging it to the second window (which shows the contents
    of Work). By default, dragging from one window to another copies the item.


    Another option is to select what you want to copy and paste it. Selecting items
    can be done again in a number of ways. One method is to click each file/folder
    while holding the Shift or Ctrl keys to make multiple selections. The difference
    between the two keys is that Shift allows you to select a number of files and
    folders next to each other, and Ctrl selects independent files and folders from
    anywhere in the folder-listing view. When you have selected what should be copied,
    right-click and select Cut or Copy. Cut the original files but remove them, and
    Copy will copy them leaving the original files intact. Now go to the destination
    folder, right-click it, and select Paste. The files/folders are now added.


    # Using the Sidebar


    The sidebar in Nautilus can be changed to a variety of views that should cater
    to virtually all tasks. Each of these different sidebar views has a range of functions.
    Table 3–2 explains each one.


    Although you will probably stick with one in particular, it is not uncommon to
    switch between options to achieve a particular task. For this reason, the flexibility
    provided by the range of sidebar options is useful.


    +   TIP Drag and Drop

    If you want to put something in the Places view, drag and drop the item. The Ubuntu
    desktop is filled with drag-and-drop shortcuts like this. If you think something
    could be dragged and dropped, try it!'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Table 3-2 The Different Nautilus Sidebar Options


    | Option | Feature |

    | --- | --- |

    | Places | (Default view) Includes the devices and bookmarks in the sidebar you
    typically see in the file chooser. |

    | Information | Displays some limited information about the current folder. |

    | Tree | Displays a tree view similar to Windows/Mac OS X. Those of you who love
    the way Windows/Mac OS X works want to use this. |

    | History | Displays a history of the folders you have clicked on. |

    | Notes | Allows you to write notes in the sidebar that are stored in the folder.
    This is handy when you need to explain or make comments about the current folder.
    |

    | Emblems | Lists the files and folders that have specific emblems attached. |


    # Using Emblems


    Emblems give you the ability to tag files and folders to indicate something. These
    small graphical icons are used to say that the file/folder falls into a particular
    category, visually signified by the emblem. As an example, you may want to tag
    a file to indicate it is a draft.


    When you select the Emblems sidebar, a range of different emblems appears. To
    apply an emblem to a file/folder, just drag the emblem onto it. You can drag multiple
    emblems onto the files to indicate multiple things.


    # Ubuntu and Multimedia


    In recent years, multimedia has become an essential part of computing. Watching
    DVDs and videos and listening to CDs and music have become part and parcel of
    the modern desktop computer experience. These multi-media capabilities have been
    further bolstered by the huge popularity of legal music downloading. With a range
    of online stores for a variety of different types of music, it is not uncommon
    to listen to most of your music without ever seeing a little silver disk.


    # Installing Codecs


    Multimedia files and disks come in a variety of different types, and each type
    uses a special codec to compress the content to a smaller size while'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# Chapter 3 Using Ubuntu on the Desktop


    retaining a particular level of quality. To play this media, you need to ensure
    that you have the relevant codecs installed. Ubuntu now makes this easier by suggesting
    packages that provide a suitable codec when you open a file that isn''t supported
    by the ones that are currently installed. double-click the file you want to open,
    and you should be provided with a list of packages that you can install to enable
    support for the file you have tried to open. Select the packages that seem appropriate,
    and click Install.


    QUICK TIP If double-click a file but no packages are suggested, you may need to
    change the package filter in the top right-hand corner to All Available Applications.


    Codecs still remain a problem for open source software because of the legal restrictions
    placed upon them. Certain codecs (including MP3, Windows Media Format, QuickTime,
    and RealMedia) are proprietary and have such restrictions placed on their use,
    distribution, and licensing.


    Although developers in the open source community have gone away and created free
    implementations of some of these codecs, the licensing that surrounds them conflicts
    with the legal and philosophical position that Ubuntu has. These codecs are not
    included not only because they are legally dubious but also because they disagree
    with Ubuntu''s ethic of creating a distribution that is entirely comprised of
    free software in the freestest sense of the word.


    QUICK TIP If you want to find out more about installing these codecs, see https://wiki.ubuntu.com/RestrictedFormats.


    To work resolving these problems, a number of developers are working on free codecs
    such as Ogg Vorbis and Ogg Theora that provide high-quality results and open licensing.
    The Ogg Vorbis codec is used on audio and can provide better results than MP3
    at a smaller file size. The Theora codec is used for video and competes with the
    MPEG-4 codec. Ubuntu includes the Ogg Vorbis and Ogg Theora codecs by default,
    and you can encode and play back any media that uses those codecs out of the box.


    Although the world would be a better place if all codecs were free, the reality
    is different, and many Ubuntu users still want to play media com-'
  merge: -1
