    Your disk is listed below these options, and it may display a few existing partitions.
    If you want to delete the existing partitions, select each one, press Enter, and
    select Delete the Partition. When you have deleted some partitions, you should
    see a FREE SPACE line. The FREE SPACE line is used to create new partitions. If
    the disk was empty already and you don''t see a FREE SPACE line, select the hard
