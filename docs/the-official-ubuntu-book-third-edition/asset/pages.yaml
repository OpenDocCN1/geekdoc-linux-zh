  md: '# # Installing an LTSP Server


    Starting with Ubuntu 8.04, the LTSP installation process has one minor step prior
    to reading on. The first thing you need to do is acquire the Ubuntu alternate
    CD. LTSP server installation is no longer provided via an Edubuntu CD since the
    status of Ubuntu has changed from a distribution to an add-on. Once you have your
    LTSP server installed and configured, installation of Edubuntu and its applications
    is the same as previously presented in the “Installing Edubuntu as an Add-on”
    section of this chapter.


    # ## LTSP Server Configurations


    The LTSP server install allows a great deal of flexibility and is designed to
    allow it to fit into any current network configuration. Essentially these fall
    into two categories: those that use the LTSP server as a primary gateway for all
    their LTSP clients and those that do not. Let’s take a few minutes to discuss
    the merits of each system.


    Using the recommended configuration requires the LTSP server machine to have two
    network interface cards (NICs). One of these is connected to the rest of the network,
    that is, to the Internet or to other servers on the internal network. The other
    card is usually connected to a private subnet of the network where only Edubuntu
    LTSP clients reside. Figure 9-6 shows this two-NIC setup. No network data is routed
    from the second network card to the first, so client machines must be authenticated
    on the LTSP server before having access to the Internet or the rest of the network.
    This makes for a secure network setup.


    The benefit to this setup is that client computers cannot connect to the network
    unless the LTSP server permits them to. This also reduces network traffic on the
    rest of the network while the clients are booting from the LTSP server, data is
    being transferred only on the private subnet and not on the rest of the network.
    Also, the clients receive their network addresses from the LTSP server, which
    frees up addresses on the rest of the network.


    Using LTSP as simply another server on a network allows for a more flexible atmosphere.
    For a start, you require only one network interface card in the server to run
    using this configuration. The LTSP clients are connected to the normal network
    and could, assuming they have the capabilities to boot, access the network without
    the help of the LTSP server. Figure 9-7 shows'
