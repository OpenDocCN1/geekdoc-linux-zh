    # Accessing Windows Partitions


    A lot of people still have Windows partitions on their hard drives and would like
    to access the information stored there. Kubuntu can browse these files in read-only
    mode. By default, Kubuntu mounts the Windows partition in the /media directory.
    See Figure 8-39 for an example of access ing the Windows drive in Dolphin.


    # Accessing USB Drives


    USB drives are everywhere these days, and Kubuntu handles them quite easily. Simply
    connect your USB drive, and it will mount automatically. It will then be available
    under Dolphin through the media folder. Before removing the drive, make sure you
    unmount it by right-clicking on the device and selecting Eject. The device can
    then be safely removed.'
