  md: 'Using and Abusing Devices and Media


    131


    long. The lack of floppy drives in modern computers has really symbolized the
    death of the rather limited, slow, and restrictive floppy disk.


    Using these newer kinds of devices in Ubuntu is simple and intuitive. In the vase
    majority of cases, you just plug them in and they work. Each device needs to be
    mounted before it can be used, but Ubuntu automatically mounts it for you. The
    main point to remember is to always unmount the device before you remove it. Even
    floppy disks should be properly unmounted before they are removed. Unmounting
    a device ensures all has been copied to before you pull it out.


    # Problems Unmounting


    If you have problems unmounting a device, make sure that you are not currently
    using it. As an example, if you have an open file manager window looking at the
    files on the device, it is currently being used and, as, cannot be unmounted.
    As a general rule, make sure you close everything down from the device and everything
    will be fine.


    TIP


    If at any time you are unsure which devices are plugged into your computer, click
    Places > Computer to see a list of the drives available.


    # USB Keyring Drives


    In the last few years, USB keyrings, pens, and sticks have taken over as the commonplace
    solution for moving files between different computers. These cheap and often high-capacity
    little devices offer a simple and efficient way to carry your files with you.
    Although these USB storage devices come in many different shapes and forms, they
    basically work the same in Ubuntu.


    Using USB storage devices in Ubuntu is a piece of cake. Just plug them in and
    an icon to the device appears on your desktop. A file manager also appears to
    display the contents of the device. You can interact with the device and the files
    as you would with the files on your hard disk.


    When you have finished using your USB device, right-click the icon that appeared
    on your desktop and select Unmount. When the icon disappears from your desktop,
    you can safely remove it from the USB port.'
  merge: -1
