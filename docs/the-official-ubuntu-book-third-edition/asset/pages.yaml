    # # Gobuntu


    Gobuntu is an official derivative of Ubuntu that is designed to consist entirely
    of free software. Roughly synonymous with “open source,” free software philosophy,
    as described in Chapter 1, mandates that all software be usable for any purpose,
    modifiable, and distributable without restriction. Support of these principles
    are a core piece of Ubuntu philosophy, as described in Appendix B under Ubuntu
    Philosophy. The vast majority of software in Ubuntu lives these standards as is
    required for inclusion in Ubuntu’s “main” component. However, Ubuntu makes several
    exceptions within its restricted component (see Appendix B under Components for
    more information). These include nonfree drivers and firmware necessary for hardware
    support. Additionally, other nonfree software can be enabled and installed in
    Ubuntu with a reasonably small degree of effort. In the eyes of many advocates
    of software freedom and members of the free and open source movements, this is
    simply not enough.


    Gobuntu exists to answer these critiques. The project was originally “Gnubuntu”
    in reference to the GNU Project described in Chapter 1 but was changed upon objections
    by GNU founder Richard M. Stallman. In the words of Mark Shuttleworth, Gobuntu
    aims to take, “an ultra-orthodox view of licensing: no firmware, drivers, imagery,
    sounds, applications, or other content which do not include full source materials
    and come with full rights of modification, remixing, and redistribution.” In many
    ways, the project shares many goals with the derivative gNewSense discussed later
    in this chapter. However, while gNewSense operates entirely outside of the Ubuntu
    project, Gobuntu is a Canonical-sponsored project and is implemented as a simple
    subset of Ubuntu like Kubuntu, Edubuntu, and Xubuntu.


    Gobuntu


