    if a better type of operating system (OS) was possible. Their answer was “Yes.”
    He asked them what it would look like. He asked them to describe the community
    that would build such an OS. That group worked with Shuttleworth to come up with
    answers to these questions, and then they decided to make the answers a reality.
    The group named itself the Warthogs and gave itself a six-month deadline to build
    a proof-of-concept OS. The developers nicknamed their first release the Warty
    Warthog with the reasonable assumption that their first product would have its
    worts. Then they got down to business.


    It’s difficult, particularly for those of us who were privileged to be among those
    early Warthogs, to imagine that the brainstorming behind the Ubuntu project took
    just three years ago. Far from being wary, the Warty Warthog surpassed our most
