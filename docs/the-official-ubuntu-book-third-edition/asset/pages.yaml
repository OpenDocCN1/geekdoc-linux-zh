  md: '# Foreword to the First Edition


    IT''S A SMALL CELEBRATION for me to write this foreword—almost exactly two years
    after the first meeting of a small group of free software professionals that turned
    into the Ubuntu project. A celebration because two years ago none of us would
    have predicted that our dream would spawn several million CDs, three or four million
    enthusiasts, hundreds of commitments of support from companies large and small,
    a minor prime time television reference, and now The Official Ubuntu Book.


    The dream that brought us together can be simply expressed:


    To build a world-class operating system for ordinary desktop computer users, that
    is genuinely free and freely available, that is immediately useful, and represents
    the very best that the free software world could achieve.


    In setting out to build a platform for “ordinary desktop computer users,”I had
    no idea that I would have the privilege of meeting and working with so many extraordinary
    desktop computer users. Some of those extraordinary individuals are the authors
    of this book, people who both understand the importance of the free software movement
    and have the talent to have real contributors to its success. Others make up the
    backbone of the Ubuntu community—the small but dedicated army of a few hundred
    people who work to produce a new release of Ubuntu every six months. They are
    at the heart of a network that reaches out through the global free software community—through
    the world of Debian, an extraordinary project in its own right and without which
    Ubuntu could not exist, and out to the thousands of projects, large and small,
    that produce the code and documentation that we pull together and call Ubuntu.


    While this huge extended community can often appear to be fractured and divided
    along infinitesimal ideological lines, we are all broadly in agreement'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# xxvi Foreword


    about four key ideas, and it is those ideas that are central to the Ubuntu promise:


    +   - That our software should not come with a license fee. We should be able
    to share our software, modify it, and then share our modifications, too.


    +   - That this free software should be the best version available, including
    regular security updates, and not a tease for a better, commercial product.


    +   - That full-scale, high-quality commercial support from local and global companies
    should be available for this free platform.


    +   - That this software should be usable in as many languages as possible and
    usable by as many people as possible regardless of disability.


    The 17 of us who met in London two years ago come from a very wide variety of
    countries and backgrounds, but we all agreed that the goal of producing a platform
    that could live up to that promise was a worthy one, that we would devote ourselves
    wholeheartedly.


    For several months we worked quietly. We wanted to come to the world not only
    with a manifesto but also with a clear demonstration of work done toward our goals,
    something that people could test and comment on. We had no name (though industry
    called us the “Super-Secret Debian Startup”), and, as a result, we hosted most
