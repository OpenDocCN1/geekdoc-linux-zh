  md: 'In the terminal window, you can see the terminal prompt and a black cursor.
    The prompt shows your current username, the name of the host, and the name of
    the folder you are currently in. When you first fire up the terminal, the folder
    is shown as a tilde (~), which is shorthand for your home directory.


    # Getting Started First a look at the files in your home folder by running the
    following command:


    ```

    foo@bar~ $1 ls

    ```


    The 1s command lists the files in your current folder. The default command just
    displays a collection of items that are in your folder. To make 1s more useful,
    you can pass it options:


