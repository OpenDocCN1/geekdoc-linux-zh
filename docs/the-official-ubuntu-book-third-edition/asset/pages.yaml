  md: '# Managing Files with Kubuntu


    Now that you have your system installed and set up the way you would like, it
    is time to learn how to navigate the different files and access information in
    Kubuntu. This starts with the default file manager, Dolphin. Konqueror, another
    application that can be used both as a Web browser and a file manager, is discussed
    later in the chapter.


    # Introduction to Dolphin


    Introduced during the 7.10 release schedule as d3olphin, a port to KDE4, Dolphin
    is included as the default manager (see Figure 8-35).


    Formerly, Konqueror, which is also the KDE Web browser, was the default file manager.
    With time, Konqueror development focused increasingly on the Web browser, while
    ignoring its manager functionality. Dolphin focuses only on local files, is built
    on the Konqueror back end, and should be familiar to many KDE users.


    ![](img/aa15f1f82061fdaf4ff1da575e3e1c52_343_0.png)'
  merge: -1
  pgno: 343
- img_proc: true
  md: '![](img/aa15f1f82061fdaf4ff1da575e3e1c52_344_0.png)


    Figure 8-36 Dolphin Split View


    Another key feature of Dolphin is the ability to use a split view to have multiple
    directories open in the same window, without having to switch tabs. An example
    of the split view of Dolphin is shown in Figure 8-36.


    Dolphin is a very powerful file manager that nicely complements Conqueror. The
    two programs are often used in tandem.


    # Changes to the Kubuntu 8.04 release


    New to the Kubuntu 8.04 release is a change in the default setup of the home folder,
    making Kubuntu conform to the XDG Base Directory Specification of the freedesktop.org
    standards.


    XDG directories specify a default set of folders within a user''s home directory.
    Some of these folders are Desktop, Downloads, Templates, Music, and Video. The
    goal is to help create a standard location for files to be stored in a variety
    of different desktop environments (see Figure 8-37).'
  merge: -1
  pgno: 344
- img_proc: true
  md: '# Chapter 8 Using Kubuntu


    ![](img/aa15f1f82061fdaf4ff1da575e3e1c52_345_0.png)


    Figure 8-37 Viewing XDG directories in Dolphin


    #  Introduction to Konqueror


    Konqueror is the old default file manager in Kubuntu but still has a lot to offer.
    As a file manager, Konqueror can do nearly everything you need (Figure 8-38).
    You can browse files through either an icon view or a tree view. Copying, pasting,
    moving, and deleting files are all simple tasks with Konqueror. A nice feature
    of Konqueror is that directories are automatically updated. This means that if
    a file is created in a directory currently viewed, you do not need to refresh
    the directory to see the changes.


    One of the great things about Konqueror is how much you can do within it. Need
    access to media files? Simply type media/ and browse your media files. All kinds
    of other shortcuts, called kliosaves, including ones for searching the Web with
    Google (gg://KEYWORD) and even browsing files via ssh through sftp://. Help finding
    a file on your system? Use locate:/ to have Konqueror find for you. You can visit
    the different system folders through system:/ Many shortcuts and keywords are
    this built into Konqueror, including Google Suggest in the search bar.'
  merge: -1
