  md: '# # Manipulating Files and Folders


    You can manipulate files and folders by using the following commands.


    +   - cp: The cp command makes a copy of a file for you. For example, cp file
    makes an exact copy of the file whose name you entered and names the copy foo,
    but the first file will still exist with its original name. After you use mv,
    the original file no longer exists, but after you use cp, that file stays and
    a new copy is made.

    - mv: The mv command moves a file to a different location or renames a file. Examples
    are as follows: mv file renames the original file to foo. mv foo ~/Desktop moves
    the file to your desktop directory does not remove it. You must specify a new
    filename to rename a file.

    - To save on typing, you can substitute ~ in place of the home directory.


    **NOTE** If you are using mv with sudo, you will not be able to use the ~ shortcut.
    Instead, you will have to use the full pathnames for your files.


    +   - rm: Use this command to remove or delete a file in your directory. It does
    not work on directories that contain files.

    - ls: The ls command shows you the files in your current directory. Used with
    certain options, it lets you see file sizes, when files were created, and file
    permissions. For example, ls ~ shows you the files that are in your home directory.

    - mkdir: The mkdir command allows you to create directories. For example, mkdir
    music creates a music directory.

    - chmod: The chmod command changes the permissions on the file listed.


    Permissions are based on a fairly simple model. You can set permissions for user,
    group, and world, and you can set whether each one can read, write, and/or execute
    the file. For example, if a file had permission to allow everybody to read only
    the user could write, the permissions would read rwxr--r--. To add or remove a
    permission, you append + or - in front of the specific permission. For example,
    to add the capability for the group to edit in the previous example, you could
    type chmod g+x file.'
  merge: -1
