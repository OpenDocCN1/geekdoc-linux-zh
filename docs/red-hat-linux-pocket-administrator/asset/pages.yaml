  md: '# Committing Changes


    To work on a file, you must first retrieve it from the repository using the check-out
    option, co. You then work on it in a project directory that will be created as
    a subdirectory in your local directory. When you are ready to check the file back
    into the repository, you use the commit option (ci). The following example extracts
    the main.c file from the CVS repository for myproject:


    ```

    $ cvs co myproject/main.c

    $ cd myproject

    ```


    You then change to the subdirectory called myproject that has been created in
    the current working directory. There, you will find the extracted version of main.c.
    You can then edit and change main.c. To check it back into the CVS repository,
    use the commit option.


    ```

    $ cvs commit -m "Modified main.c" main.c

    ```


    To see the changes, use the diff option. The rdiff option lets you see any changes
    to the entire release.


    ```

    $ cvs diff

    ```


    To check out the entire project, you use the project name. All the files for the
    project will be extracted to a subdirectory with that project name.


    ```

    $ cvs co myproject

    $ cd myproject

    ```


    You can then work on any of the files and then check in the entire project when
    you are finished.


    ```

    $ cvs commit -m "Major changes to myproject" myproject

    ```


