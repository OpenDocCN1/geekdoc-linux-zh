    # Absolute Permissions: Binary Masks


    Instead of permission symbols in Table 2-5, many users find it more convenient
    to use the absolute method. The absolute method changes all the permissions at
    once, instead of specifying one or the other. It uses a binary mask that references
    all the permissions in each category. The three categories, each with three permissions,
    conform to an octal format. Octal numbers have a base 8 structure. When translated
    into a binary number, each octal digit becomes binary digits. A binary number
    is a set of 1 and 0 digits. Three octal digits in a number translate into three
    sets of binary digits, which is nine altogether—the exact number of permissions
    for a file.


    You can use the octal digits as a mask to set the different file permissions.
    Each octal digit applies to one of the user categories. You can think of the digits
    matching up from left to right, beginning with the owner category. The first octal
    digit applies to the owner category, the second to the group, and the third'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# 60 Red Hat Linux Pocket Administrator


    to the others category. The actual octal digit you choose determines the read,
    write, and execute permissions for each category. At this point, you need to know
    how octal digits translate into their binary equivalents.


    # Calculating Octal Numbers


    A simple way to calculate the octal number makes use of the fact that any number
    used for permissions will be a combination derived from adding in decimal terms
    the numbers 4, 2, and 1. Use 4 for read permission, 2 for write, and for 1 execute.
    The read, write, execute permission is simply the addition of 4 + 2 + 1 to get
    7. The read and execute permission adds 4 and 1, to get 5. You can use this method
    to calculate the octal number for each category. To get 755, you would add 4 +
    2 + 1 for the owner read, write, and execute permission; 4 + 1 for the group read
    and execute permission; 4 + 1 again for the other read and execute permission.


    # Binary masks


    When dealing with a binary mask, you need to specify three digits for all three
    categories, as well as their execute permission. This makes a binary mask less
    versatile than the permission symbols. To set the owner execute permission on
    and the write permission off for the `myfile` and retain the read permission,
    you need to use the octal digit 5 (101). At the same time, you need to specify
    the digits for group and other users access. If these categories are to retain
    access, you need the octal number 4 for each (100). This gives you three octal
    digits, 544, which translate into the binary digits 101 100 100.


    ```

    $ chmod 544 myfile

    ```


    # Execute Permissions


    One of the most common uses of the binary mask is to set the execute permission.
    You can create files that contain Linux commands, called `shell scripts`. To execute
    the commands in a shell script, you must first indicate the file is executable—that
    it contains commands the system can execute. You can do this in several ways,
    one of which is to set the executable permission on the shell script.'
