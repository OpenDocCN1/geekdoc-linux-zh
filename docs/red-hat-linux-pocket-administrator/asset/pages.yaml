    # Modules


    The Linux kernel employs the use of modules to support

    different operating system features, including support for

    various devices such as sound and network cards. In many

    cases, you do have the option of implementing support for

    de device either as a module or by compiling it as a

    built-in kernel feature, which requires you to rebuild the

    kernel (see Chapter 9). A safer and more robust solution

    is to use modules. Modules are components of the Linux

    kernel that can be loaded as needed. To add support

    a new device, you can simply implement a kernel to

    load its module. In some cases, you may have to recompile

    only that module to provide support for your device.

    The use of modules has the advantage of reducing the

    size of the kernel program as well as making your system

    stable. The kernel can load modules in memory only

    as they are needed. Should a module fail, only the module

    st running, not the entire system. For example, the

    module for the PPP network interface used for a modem

    only needs to be used when you connect to an ISP.


