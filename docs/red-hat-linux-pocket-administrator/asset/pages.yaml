    # cron Environment Variables


    cron also lets you define environment variables for with tasks performed. Red
    Hat defines variables for SHELL, PATH, HOME, and MAILTO. SHELL designates the
    shell to use for tasks; in this case, the bash shell. PATH lists the directories
    where programs and scripts can be found. This example lists the standard directories,
    /usr/bin and /bin, as well as the system directories reserved for system applications,
    /usr/sbin and /sbin. MAILTO designates to whom the results of a task are to mailed.
    By default, these are mailed to the user who schedules it, but you can have the
    results sent to a specific user, like the administrator''s e-mail address, or
    an account on another system in a network. HOME is the home directory for a task;
    in this case, the top directory.


    ```

    SHELL=/bin/bash

    PATH=/sbin:/bin:/usr/sbin:/bin

    MAILTO=root

    HOME=/

    ```


    # cron.d Directory


    On a heavily system, the /etc/crontab file can become crowded easily. There may
    also be instances where certain entries require different variables. For example,
    you may need to run some task under a different shell. To help organize your crontab
    tasks, you can place crontab entries within files in the cron.d directory. The
    files in the cron.d directory all contain crontab entries of the same format as
    /etc/crontab. They may be given any name. They are treated as added crontab files,
    with cron checking them for task to run. For example, Red Hat installs a sysstat
    file in the cron.d that contains crontab entries for run tools to gather system
    statistics.'
  merge: -1
