  md: '# Creating a File System


    Once RAID devices are activated, you can then create file systems on the RAID
    devices and mount those file systems. The following example creates a standard
    Linux file system on the /dev/md0 device.


    ```

    mkfs.ext3 /dev/md0

    ```


    In this example, the user creates a directory called /myraid and mounts the RAID
    device there:


    ```

    mkdir /myraid

    mount /dev/md0 /myraid

    ```


    If you plan to use your RAID device for maintaining your user directories and
    files, you would mount the RAID device as your /home partition. Such a mounting
    might normally be used if you created your RAID devices when installing your system.
    To transfer your current home directories to a RAID device, first back them up
    on another partition, and then mount your RAID device, copying your home directories
    to.


    # The raidstop Command


    If you decide to change your RAID configuration or add new devices, you first
    have to deactivate your currently active RAID devices. To deactivate a RAID device,
    you use the raidstop command. Be sure to close open files and unmount any file
    systems on the device first.


    ```

    umount /dev/md0

    raidstop /dev/md0

    ```


    > Hot swapping is the practice of replacing drives while the system is running.
    Its feasibility is limited. Never try to hot swap an IDE drive; you could destroy
    the drive. SCSI drives might successfully swap, though most likely not. IBM SCA
    drives can successfully swap. You can use the raidhotadd and raidhotremove commands
    to perform such a swap.'
