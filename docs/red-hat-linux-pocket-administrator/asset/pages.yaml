  md: '190 Red Hat Linux Pocket Administrator


    # # Creating Device Files Manually


    Linux implements two types of devices: block and character. A block device, such
    as a hard disk, transmits data at a time. A character device, such as a printer
    or modem, transmits data one character at a time, or rather as a continuous stream
    of data, not as separate blocks. Device driver files for character devices have
    a c as the first character in the permissions segment displayed by the ls command.
    Device driver files for block devices have a b. In the next example, lp0 (the
    printer) is a character device and hda1 (the hard disk) is a block device:


    ```

    # ls -l hda1 lp0

    br-rw---- 1 root disk 3, 1 Jan 30 02:04 hda1

    cr-rw---- 1 root 6, 0 Jan 30 02:04 lp0

    ```


    # # Device Types


    The device type can be either b, c, p, or u. As already mentioned, the b indicates
    a block device, and c is for character device. The u is for an unbuffered character
    device, and the p is for a FIFO (First In Out) device. Devices of the same type
    often have the same name, for example, serial interfaces all have the name: ttyS.
    Devices of the same type are then uniquely identified by a number attached to
    the name. This number has two components: the major number and the minor number.
    Devices may have the same major number, but if so, the minor number is always
    different. This major and minor structure is designed to deal with situations
    in which several devices may be dependent on one larger device, such as several
    modem connected to the same I/O card. All the modems would have the same major
    number that references the card, but each modem would have a unique number. Both
    the minor and major numbers are required for block and character devices (b, c,
    and u). They are not used for FIFO devices, however.


    Valid device names with their major and minor numbers are listed in the devices.txt
    file located in the /Documentation directory for the kernel source code,'
  merge: -1
