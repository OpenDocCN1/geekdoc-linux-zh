    # Disk Quotas


    You can use disk quotas to control how much disk space a particular user makes
    use of your system. On your Linux system, unused disk space is held as a common
    resource that each user can access as they need it. As a user creates more files,
    they take the space they need from the pool of available disk space. In this sense,
    all the users are sharing a single resource of unused disk space. However, if
    one user were to use all the remaining disk space, none of the others would be
    able to create files or even run programs. To counter this problem, you can create
    disk quotas on particular users, limiting the amount of available disk space they
    can use.


    # Quota Tools


    Quota checks can be implemented on the file system of a hard disk partition mounted
    on your system. The quotas'
  merge: -1
  pgno: 79
- img_proc: true
  md: '# 68 Red Hat Linux Pocket Administrator


    are enabled using the quotacheck and quotaon programs. On Red Hat, they are executed
    in the /etc/rc.d/rc.sysinit script, which run whenever you start up your system.
    Each partition needs to be mounted with the quota options, usquota or grquota.
    usquota enables quota controls for users, and grquota works for groups. These
    options are usually placed in the mount entry of the /etc/fstab file for a particular
    partition (see Chapter 5). For example, to mount the /dev/sda6 hard partition
    mounted to the /home directory with support for user and group quotas, you would
    require a mount entry like the following:


    ```

    /dev/sda6 /home ext2 defaults, usquota, grquota 1 1

    ```


    You also need to create quota.user and quota.group files for each partition which
    enable quotas. These are the databases used to hold the quota information for
    each user and group. You can create these files by running the quotacheck command
    with the -a option or the device name of the file system where you want to enable
    quotas. The following example creates the quota database on the hda1 hard disk
    partition.


    ```

    quotacheck -a /dev/hda1

    ```


    # edquota


    You can set disk quotas using the edquota command. With it, you can access the
    quota record for a particular user and group, which is maintained in the disk
    quota database. You can also set default quotas that will be applied to any user
    or group on the file system for which quotas have not been set. edquota will open
    the record in your default editor, and you can use your editor to make any changes.
    To open the record for a particular user, use the -u option and the username as
    an argument for edquota (see Table 2-6). The following example opens the disk
    quota record for the user larisa:


    ```

    edquota -u larisa

    ```'
