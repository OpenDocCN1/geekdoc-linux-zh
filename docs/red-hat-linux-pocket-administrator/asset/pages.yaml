    # Red Hat Package Manager (RPM)


    Several Linux distributions, including Red Hat, Mandrake, Calder, and SuSE, use
    RPM to organize Linux software into packages you can automatically install or
    remove. RPM is a command-line-driven package management system that is capable
    of installing, uninstalling, querying, verifying, and updating software packages
    installed on Linux systems. An RPM software package operates as its own installation
    program for a software application. A Linux software application often consists
    of several files that need to be installed in different directories, and library
    files in another directory. The program itself is most likely placed in a directory
    called /usr/bin, online manual files go in other directories, and in addition,
    the installation may require modification of configuration files on your system.
    The RPM package software performs all these tasks for you. Also, if you decide
    you don''t want a specific application, you can uninstall packages to remove all
    the files and configuration information from your system. RPM works similarly
    to the Windows Install Wizard, automatically installing software, including configuration,
    documentation, image, sample, and program files, along with any other files an
    application may use. All are installed in their appropriate directories on your
    system. RPM maintains a database of installed software, keeping track of all the
    files installed. This enables you to use RPM also to uninstall software, automatically
    removing all files that are part of the application.'
