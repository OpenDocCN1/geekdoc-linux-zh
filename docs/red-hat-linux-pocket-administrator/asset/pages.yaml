    # cupsd.conf


    The cupsd server is configured with the cupsd.conf file. You must edit configuration
    options manually; the server is not configured with the web interface. Your installation
    of CUPS installs a commented version of the cupsd.conf file with each option listed,
    though most options will be commented out. Commented lines are preceded with a
    # symbol. Each option is documented in detail. The server configuration uses Apache
    web server syntax consisting of a set of directives. As with Apache, several of
    these directives can group other directives into blocks.


    # CUPS Directives


    Certain directives allow you to place access controls on specific locations. These
    can be printers or resources, such as the administrative tool or the spool directories.
    Location controls are implemented with the Location directive. Allow From and
    Deny From directives can permit or deny access from specific hosts. CUPS supports
    both Basic and Digest forms of authentication, specified


