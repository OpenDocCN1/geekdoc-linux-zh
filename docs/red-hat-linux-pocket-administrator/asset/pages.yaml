    # Hardware Device Installation: Kudzu


    Hardware devices are automatically detected by the Red Hat hardware probing tool
    known as Kudzu. Kudzu is a tool that detects and configures new or changed hardware
    on a system. Kudzu is run when you boot to configure new hardware devices and
    detect removed ones. You can also run Kudzu manually. When you start Kudzu, it
    detects the current hardware, and checks against a database stored in /etc/sysconfig/hwconf.
    It then determines if any hardware has been added or removed from the system.
    When it detects new or added hardware, Kudzu, invoke the appropriate configuration
    tool for the device, like redhat-config-xfree86 for video cards, or redhat-config-keyboard
    for keyboards. For simple hardware configurations Kudzu just links the cdrom device
    symbolic links to the new device, /dev/cdrom.


    Kudzu then updates its database in /etc/sysconfig/hwconf. If a removed device
    is detected, the hwconf file is updated accordingly. If the device was installed
    simply with a device link like /dev/cdrom or /dev/mouse, that link is removed.
    In the case of network cards, alias entries like that for eth0 will be removed.'
