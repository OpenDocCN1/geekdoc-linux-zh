    # Shared and Static Libraries


    Libraries can be either static, shared, or dynamic. A static library is one whose
    code is incorporated into the program when it is compiled. A shared library, however,
    has its code for access whenever the program is run. When compiled, a program
    simply notes the libraries it needs. Then, when the program runs, that library
    is loaded and the program can access its functions. A dynamic library is a variation
    on a shared library. Like a shared library, it can be loaded when the program
    is run. However, it does not actually load until instructions in the program tell
    it to. It can also be unloaded as the programs run, and another library could
    be loaded in its place. Shared and dynamic libraries make for smaller code. Instead
    of a program including the library as part of its executable file, it only needs
    a reference to it.


    Libraries made available on your system reside in the /usr/lib and /lib directories.
    The names of these libraries always begin with the prefix followed by the library
    name and a suffix. The suffix differs, depending on whether it is a static or
    shared library. A shared library has the extension .so followed by major and minor
    version numbers. A static library simply has a .a extension. A further distinction
    is made for shared libraries in the old .out format. These have the extension
    .sa. The syntax for the library name is the following:


    ```

    libname.so.major.minor

    ```


    The name can be any string, and it uniquely identifies a library. It can be a
    word, a few characters, or even a single letter. The name of the shared math library
    is libm.so.5 where the math library is uniquely identified by the letter m and
    the major version is 5. libm.a is the static math library. The name of the X Window
    library is libX11.so.6, where'
  merge: -1
