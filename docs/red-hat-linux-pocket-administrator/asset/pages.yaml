    number of the kernel. Otherwise, you will lose the modules already set to work
    with the original kernel. For version 2.4.20-8, the libraries are located in /lib/modules/2.4.20-8.
    If you are compiling a different version, those libraries are placed in a new
    directory named with the new version number.


