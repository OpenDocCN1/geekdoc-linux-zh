  md: '# Chapter 2


    # Managing Users


    As a system administrator, you must manage the users of your system. You can add
    or remove users, as well as add and remove groups, and you can modify access rights
    and permissions for both users and groups. You also have access to system initialization
    files you can use to configure all user shells. And you have control over the
    default initialization files copied into a user account when it is first created.
    You can decide how new user accounts should be configured initially by configuring
    these files.


    ![](img/7a707b469372cd18f2e2643bd573439a_49_0.png)


    Every file is owned by a user who can control access to it. System files are owned
    by the root user and accessible by the root only. Services like FTP are an exception
    to this rule. Though accessible by the root, a service''s files are owned by their
    own special user. For example, FTP files are owned by an anftp user. This provides
    users with access to a service''s files without having root user access.


    User Configuration Files


    Any utility to manage a user, such as the Red Hat Manager, makes use of certain
    default files, called configuration files, and directories to set up the new account.
    A set of pathnames is used to locate these default files or to indicate where
    to create user directories. For example, /etc/skel holds initialization files
    for a new user. A new user''s home directory is created in the /home directory.
    Table 2-1 has a list of the pathnames.'
  merge: -1
