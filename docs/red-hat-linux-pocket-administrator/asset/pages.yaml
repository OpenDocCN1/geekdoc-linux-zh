    # Configuring the Kernel


    Once the source is installed, you must configure the kernel. Configuration consists
    of determining the features for which you want to provide kernel-level support.
    These include drivers for different devices, such as sound cards and SCSI devices.
    You can configure features as directly included in the kernel itself or as modules
    the kernel can load as needed. You can also specifically exclude features. Features
    incorporated directly into the kernel make for a larger kernel program. Features
    set up as separate modules can also be easily updated. Documentation for many
    devices that provide sound, video, or network support can be found in the /usr/share/doc
    directory. Check the kernel-doc package to find a listing of the documentation
    provided.


    ```

    rpm -ql kernel-doc

    ```


    > NOTE If you configured your kernel previously, and now want to start over from
    the the default settings, you can use the make proper command to restore the default
    kernel configuration.'
