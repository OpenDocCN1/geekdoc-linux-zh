  md: '# Managing Services


    As noted previously for the crond service, you can select certain services to
    run and the runlevel at which to run them. Most services are servers like a web
    server or proxy server. Other services provide security, such as SSH or Kerberos.
    You can decide which services to use with the chkconfig,service, or redhat-config-services
    tools. These are described here briefly, and in more detail in Chapter 10.


    # chkconfig


    To configure a service to start up automatically, you can use the redhat-config-services
    tool available on the desktop or the chkconfig tool which is run on a command
    line. redhat-config-services will display a list of available services, letting
    you choose the ones you want to start and de-select. The chkconfig command uses
    the on and off options to select and de-select services for startup (see Chapter
    10 for more details).


    ```

    chkconfig on

    ```


    # service Command


    To start and stop services manually, you can use either redhat-config-services
