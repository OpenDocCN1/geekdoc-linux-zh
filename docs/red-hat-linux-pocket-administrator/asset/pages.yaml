    You can manage and view logs with the Red Hat Log Viewer, redhat-logviewer (System
    Tools | System Logs). The Red Hat Log Viewer displays a list of all current system
    logs in a left pane (see Figure 1-2). Clicking a log displays the contents of
    that log in the left pane. Use the Filter box to enter patterns you wish to look
    for, and click the Filter button to perform the match. Reset restores the complete
    listing. In the Preferences dialog, the Files panel lets you select a different
    location for a log file. The Alerts panel lets create alert words. An alert icon
    is displayed next to any entry containing an alert word. Configuration settings,
    such as log file locations and alert words, are kept in the /etc/sysconfig/redhat-logviewer
    file.'
