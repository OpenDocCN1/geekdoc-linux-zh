    A Linux system can run in different levels, depending on the capabilities you
    want to give it. For example, you can run your system at an administrative level,
    locking user access. Normally, full operations are activated by simply running
    your system at a certain level of operational capability, such as supporting multiuser
    access or graphical interfaces. These levels (also known as states or modes) are
    referred to as runlevels, the level of support that you are running your system.


    #  runlevels


    A Linux system has several runlevels, numbered from 0 to 6. When you power up
    your system, you enter the default runlevel. Runlevels 0, 1, and 6 are special
    runlevels that perform specific functions. Runlevel 0 is the power-down state
    and is invoked by the halt command to shut down the system. Runlevel 6 is the
    reboot state—it shuts down the system and reboots. Runlevel 1 is the single-user
    state, which allows access only to the superuser, and does not run any network
    services. This enables you, as the administrator, to perform administrative actions
    without interference from others.


    Other runlevels reflect how you want the system to be used. Runlevel 2 is a partial
    multiuser state, allowing'
