    # Changing runlevels with telinit


    No matter what runlevel you start in, you can change from one runlevel to another
    with the telinit command. If your default runlevel is 3, power up in runlevel
    3, but you can change it to say, runlevel 5. The command telinit 0 shuts down
    your system. In the next example, the telinit command changes to runlevel 1, the
    administrative state:


    ```

    # telinit 1

    ```


    telinit is really a symbolic link (another name for a command) to the init command.
    The init command performs the actual startup operations and is automatically invoked
    when your system starts up. Though you could use init to change runlevels, it
    is best to use telinit. When invoked as telinit, init merely changes runlevels.


    # runlevel Command


    Use the runlevel command to see what state you are currently running in. It lists
    the previous state followed by the current one. If you have not changed states,
    the previous state will be listed as N, indicating no previous state. This is
    the case for the state you boot up in. In the next example, the system is running
    in state 3, with no previous state change.


    ```

    # runlevel

    N 3

    ```'
