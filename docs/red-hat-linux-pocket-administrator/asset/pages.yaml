    # unmount Command


    If you want to replace one file system with another, you must first explicitly
    unmount the one already mounted. Say you have mounted a floppy disk, and now you
    want to take it out and put in a new one. You must unmount that floppy disk before
    you can put in a new one. You unmount a file system with the unmount command.
    The unmount command can take as its argument either a device name or the directory
    where it was mounted. Here is the syntax:


    ```

    # unmount device-or-mountpoint

    ```


    The following example unmounts the floppy disk wherever it is mounted:


    ```

    # unmount /dev/fd0

    ```


    Using the example where the device was mounted on the /mydir directory, you could
    use that directory to unmount the file system:


    ```

    # unmount /mydir

    ```


    One important constraint applies to the unmount command. You can never unmount
    a file system in which you are currently working. If you change to a directory
    within a file system that you try to unmount, you receive an error message stating
    that the file system is busy. For example, suppose you mount a CD-ROM on the /mnt/cdrom
    directory. If you decide to change CD-ROMs, you first have to unmount the current
    one with the unmount command. This will fail because you are currently in the
    directory in which it is mounted. You have to leave that directory before you
    can unmount the CD-ROM.'
