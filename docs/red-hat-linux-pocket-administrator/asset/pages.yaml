  md: '# File System Administration 133


    # e2fsck and fsck


    To check the consistency of the file system and repair it if it was damaged, you
    can use file system checking tools. fsck checks and repairs a Linux file system.
    e2fsck is designed to support ext2 and ext3 file systems, whereas the more generic
    fsck also works on any other file system. The ext2 and ext3 file systems are normally
    used for Linux hard disk partitions and floppy disks. Linux file systems beginning
    with Red Hat 7.3 are normally ext3, which you would use e2fsck to check. fsck
    take as their argument the device name of the hard disk partition that the file
    system uses.


    Before you check a file system, be sure that the file system is unmounted. e2fsck
    should not be used on a mounted file system. To use e2fsck, enter e2fsck and the
    device name that references the file system. The p option automatically repairs
    a file system without first requesting approval from the user for each repair
    task. The following examples check the disk in the floppy drive and the primary
    hard drive:


    ```

    # e2fsck /dev/fd0

    # e2fsck /dev/sda1

    ```


    With fsck, the -t option lets you specify the type of file system to check, and
    the -r option automatically asks for confirmation. The -A option checks all systems
    in the /etc/fstab file.


    > In earlier distribution versions, fsck and e2fsck were also used to recover
    file systems after disk crashes or reset-boot reboots. With recent releases, journaling
    capabilities were introduced with file systems like ext3 and ReiserFS. Journaling
    provides for fast and effective recovery in case of disk crashes, so recovering
    with fsck or e2fsck is no longer necessary.


    ![](img/7a707b469372cd18f2e2643bd573439a_145_0.png)'
  merge: -1
  pgno: 145
- img_proc: true
  md: '# Red Hat Linux Pocket Administrator


    # Journaling


    The ext3 and ReiserFS file systems introduced journaling capabilities to Linux
    systems. Journaling provides for fast and effective recovery in case of disk crashes,
    instead of using fsck or fsck. With journaling, a log is kept of all file system
    actions, which are placed in a journal file. In the event of a crash, Linux only
    needs to read the journal file and replay it to restore the system to its previous
    (stable) state. Files that were in the process of writing to the disk can be restored
    to their original state. Journaling also avoids lengthy fsck checks on reboots
    when your system suddenly loses power or freezes and has to be restarted forcibly.
    Instead of using fsck to manually check each file and directory, your system just
    reads its journal files to restore the file system.


    Keeping a journal entails more work for file system than a non-journal method.
    Though all journaling systems will maintain a file system''s directory structure
    (what is known as the meta-data), they will offer various levels of file data
    recovery. Maintaining file data information can be time-consuming, slowing down
    the file system''s response time. At the same time, journaling systems make more
    efficient use of the file system, providing a faster response time than the non-journaled
    ext2 file system.


    There are other kinds of journaling file systems you can use on Linux, including
    ReiserFS, JFS, and XFS. ReiserFS is named after Hans Reiser, and provides a completely
    reworked file system structure based on journaling (www.reiserfs.org). Most distributions
    also provide support for ReiserFS file systems. JFS is the IBM version of a journaling
    file system, designed for use servers providing high throughput such as e-business
    enterprise servers (oss.software.ibm.com/developers/opensource/jfs/). It is freely
    distributed under the GNU public license. XFS is another high-performance journaling
    system developed by Silicon Graphics (oss.sgi.com/projects/xfs/). XFS is compatible
    with RAID and NFS file systems.'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# ext3 Journaling


    Journaling is supported in the Linux kernel ext3. The ext3 file system is also
    fully compatible with the earlier ext2 version it replaces. To create an ext3
    file system, you use the mkfs.ext3 command. You can even upgrade ext2 file systems
    to ext3 versions automatically, with no loss of data or change in partitions.
    This upgrade adds just a journal to an ext2 file system and enables journaling
    on it, using the tune2fs command. Be sure to change the ext2 file type to ext3
    in any corresponding /etc/fstab entries. The following example converts the ext2
    file system using /dev/hda3 to an ext3 file system by adding a journal (-j).


    ```

    tune2fs -j /dev/hda3

    ```


    Though the ext3 file system maintains metadata recovery support (directory tree
    recovery), it offers various levels of file data recovery. In effect, you are
    trading off less data recovery for more speed. The ext3 file system supports three
    options: writeback, ordered, and journal. The default is writeback. The writeback
    option provides only metadata recovery, no file data recovery. The ordered option
    supports limited file data recovery, and the journal option provides for full
    file data recovery. Any files in the process of being changed during a crash will
    be recovered. To specify a ext3 option, use the data option in the mount command.


    ```

    data=ordered

    ```


    # ReiserFS


    Though journaling is often used to recover from disk crashes, a journal-based
    file system can do much more. The ext3, JFS, and XFS systems provide only the
    logging operations used in recovery, whereas ReiserFS uses journaling techniques
    to completely rework file system operations. In ReiserFS, journaling is used to
    read and write data, abandoning the block structure used in traditional Unix and
    Linux systems. This gives it the capability to access a large number of small
    files very'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# 136 Red Hat Linux Pocket Administrator


    quickly, as well as use only the amount of disk space they would need. However,
    efficiency is not that much better with larger files.


    # Mounting File Systems

    Automatically: /etc/fstab


    File systems are mounted using the mount command described in the next section.
    Although you can mount a file system directly with only a mount command, you can
    simplify the process by placing mount information in the /etc/fstab configuration
    file. Using entries in this file, you can have certain file systems automatically
    mounted whenever your system boots. For others, you can specify configuration
    information, such as mountpoints and access permissions, which can be automatically
    used whenever you mount a file system. You needn''t enter this information as
    arguments to a mount command as you otherwise might. This feature is what allows
    mount utilities on Gnome or KDE to enable you to mount a system by clicking a
    window icon. All the mount information is already in the /etc/fstab file. For
    example, when you add a new hard disk partition to your Linux system, you most
    likely want to have it automatically mounted on startup, and then unmounted when
    you shut down your system. Otherwise. To have Linux automatically mount the file
    system on your new hard disk partition, you only need to add its name to the fstab
    file. You can do this by directly and carefully editing the /etc/fstab file to
    type in a new entry.


    An entry in a fstab file contains several fields, each separated by a space or
    tab. These are described as the device, mountpoint, file system type, options,
    dump, and fsck fields, arranged in the sequence shown here:


    ```

    <device> <mountpoint> <filesystemtype> <options>

    dump> <fsck>

    ```


    The first field is the name of the file system to be mounted. This entry can be
    either a device name, an ext2 or ext3'
