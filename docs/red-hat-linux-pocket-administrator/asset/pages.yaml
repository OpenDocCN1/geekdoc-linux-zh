  md: '# termcap and initab Files


    The /etc/inittab file holds instructions for your system on how to manage terminal
    devices. A line in the /etc/inittab file has four basic components: an ID, a runlevel,
    an action, and a process. Terminal devices are identified by ID numbers, beginning
    with 1 for the first device. The runlevel at which the terminal operates is usually
    1. The action is usually respawn, which means to run the process continuously.
    The process is a call to the terminal device name. Theetc/termcap file holds the
    specifications for different terminal types. These are the different types of
    terminals you could use to log in to your system.


    Your /etc/termcap file is already filled with specifications for most of the terminals
    currently produced. An entry in the /etc/termcap file consists of various names
    that can be used for a terminal separated by a pipe character (|) and a series
    of parameter specifications, each ending in a colon. You can use the name used
    to display your /etc/termcap file, and then use a search, /, locate your terminal
    type. You can set many options for a terminal device. To change these options,
