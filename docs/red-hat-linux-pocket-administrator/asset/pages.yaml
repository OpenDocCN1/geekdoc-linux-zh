    /dev/hda3 297635 169499 112764 60% /

    /dev/hda2 205380 182320 23060 89% /mnt/win

    /dev/hdc 637986 637986 0 100% /mnt/cdrom /

    ```


    You can also use `df` to tell you what file system a given directory belongs.
    Enter `df` with the directory name or `df` for the current directory.


    ```

    $ df

    Filesystems Used Available Capacity Mounted

    /dev/hda3 297635 169499 112764 60% /

    ```'
