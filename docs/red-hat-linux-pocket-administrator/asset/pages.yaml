  md: '# # Appendix

    # Service Management Tools: chkconfig and redhat-config-services


    On Red Hat, redhat-config-services and the chkconfig command provide simple interfaces
    you can use to choose what servers you started up and how you want them to run.
    You use these tools to control any daemon you want started up, including system
    services such as cron, the print server, remote file servers for Samba and NFS,
    authentication services for Kerberos, and of course, Internet servers for FTP
    or HTTP. Such daemons are referred to as services, and you think of these tools
    as managing these services. Any of these services can be set up to start or stop
    at runlevels.


    These tools manage services that are started up by scripts in the /etc/rc.d/init.d
    directory. If you add a new service, both chkconfig and redhat-config-services
    can manage it. As described in the following section, services are started up
    at specific runlevels using startup links connected to the startup scripts in
    the various runlevel directories. The init.d directory. Runlevel directories are
    numbered from 0 to 6 in the /etc/rc.d directory, such as /etc/rc.d/rc3.d for runlevel
    3 and /etc/rc.d/rc5.d for runlevel 5. Removing a service from a runlevel only
    changes its link in the corresponding runlevel rc.d directory. It does not touch
    the startup script in the init.d directory.


    > TIP The KDE System V Init Editor features a GUI interface to enable you to manage
    any daemons on your system easily—Internet servers as system daemons, such as
    print servers.'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# redhat-config-services


    With the Red Hat redhat-config-services utilities, you can simply select from
    a list of commonly used services the ones that you want to run when your system
    boots up. You can access redhat-config-services from the Services icon in the
    Server Settings window or menu. redhat-config-services lets you start, stop, or
    restart a service, much like the service command. redhat-config-services provides
    a Gnome GUI interface for easy use. It displays a list of your installed servers,
    with checked checkboxes for currently chosen to start up. You can start, stop,
    or restart, any particular service by selecting it, and choosing either Start
    Service, Stop Service, or Restart Service from the Action menu.


    You can also set runlevels for services, just as you can with chconfig, though
    you are limited to levels 3, 4, and 5. The list of checked entries differs depending
    on the runlevel you choose from the Edit Runlevel menu. In effect, you are choosing
    services to start at a given runlevel. The default is runlevel 5, the GUI startup
    level. You may want a different set of services started or stopped for runlevel
    3, the command-line startup level. In that case, you would select Runlevel 3 from
    the Edit Runlevel menu to display the services with selected checkboxes for runlevel
    3.


    # chkconfig


    You can specify the service you want to start it at it with the chkconfig command.
    Unlike other service management tools, chkconfig works equally well on standalone
    and on xinetd services. Though standalone services can be run at any runlevel,
    you can also turn xinetd services on or off for the runlevels that xinetd runs
    in. Table A-1 lists the different chkconfig options.'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# Service Management Tools 257


    | Option | Description |

    |---|---|

    | --level runlevel | Specifies a runlevel to turn on, or reset a service. |

    | --list service | Lists startup information for services at different runlevels.
    xinetd services are just on or off. With no argument, all services are listed,
    including inetd services. |

    | --add service | Adds a service, creating links in the default specified runlevels
    (or all runlevels, if none specified). |

    | --del service | Deletes links for the service (startup and shutdown) in all
    runlevel directories. |

    | service on | Turns a service on, creating a startup link in the specified default
    runlevel directories. |

    | service off | Turns a service off, creating shutdown links in specified or default
    directories. |

    | service reset | Resets service startup information, creating default links as
    specified in the chkconfig entry in the service''s init.d startup script. |


    Table A-1. chkconfig Options


    # # Listing Services with chkconfig


    To see a list of services, use the --list option. A sampling of services managed
    by chkconfig are shown here. The on or off status of the service is shown at each
    runlevel. xinetd services and their status are also


    ```

    chkconfig -list

    ddhcp 0:off 1:off 2:off 3:off 4:off 5:off 6:off

    http 0:off 1:off 2:off 3:off 4:off 5:off 6:off

    named 0:off 1:off 2:off 3:off 4:off 5:off 6:off

    lpd 0:off 1:off 2:on 3:on 4:on 5:on 6:off

    nfs 0:off 1:off 2:off 3:off 4:off 5:off 6:off

    ```'
  merge: -1
  pgno: 269
- img_proc: true
  md: "# Red Hat Linux Pocket Administrator\n\n```\ncrond 0:off 1:off 2:on 3:on 4:on\
    \ 5:on 6:off\nxinetd 0:off 1:off 2:off 3:on 4:on 5:on 6:off\nxinetd based services:\n\
    \  time: off\n  finger: off\n  pop3s: off\n  swat: on\n```\n\n# # Starting and\
    \ Stopping Services with chkconfig\n\nYou use the on option to have a service\
    \ started at certain runlevels, and the off option to disable it. You can specify\
    \ the runlevel to the effect with the --level option. If no level is specified,\
    \ chkconfig will use any chkconfig default information in a service's init.d startup\
    \ script. Red Hat installs its services with chkconfig default information already\
    \ entered (if this is missing, chkconfig will use runlevels 3, 4, and 5). The\
    \ following example has the Web server (httpd) started at runlevel 5:\n\n```\n\
    chkconfig --level 5 httpd on\n```\n\nThe off option configures a service to shut\
    \ down the system shuts down the Web server if runlevel 3 is entered. If the service\
    \ is not running, it remains shut down:\n\n```\nchkconfig --level 3 httpd off\n\
    ```\n\nThe reset option restores a service to its chkconfig default options as\
    \ specified in the service's init.d startup script.\n\n```\nchkconfig httpd reset\n\
    ```\n\nTo see just the startup information for a service, you use just the service\
    \ name with the --list option:\n\n```\nchkconfig --list httpd\nhttpd 0:off 1:off\
    \ 2:off 3:on 4:off 5:off 6:off\n```"
  merge: -1
  pgno: 270
- img_proc: true
  md: '# Enabling and Disabling xinetd Services with chkconfig


    Unlike redhat-config-services, chkconfig can also enable or disable xinetd services.
    Simply enter the xinetd service with either an on or off option. The service will
    be started up or shut down, and the disable line in xinetd configuration script
    in the /etc/xinetd.d directory will be edited accordingly. For example, to start
    swat, the Samba configuration server, which runs on xinetd, you simply enter:


    ```

    chkconfig swat

    chkconfig --list swat

    swat

    ```


    The swat configuration file for xinetd, /etc/xinetd.d/swat, will have its disable
    line edited to no. This will change the disable line in /etc/xinetd.d/swat to
    read “disable=yes”.


    ```

    disable=no

    ```


    If you want to shut down the swat server, you can use the off option. This will
    change the disable line in /etc/xinetd.d/swat to read “disable=yes”.


    The same procedure works for other xinetd services such as the POP3 server, and
    finger.


    # Adding and Removing Services with chkconfig


    If you want a service removed entirely from the startup and shutdown process in
    runlevels, you can use the --del option. This removes all startup and shutdown
    links in all the runlevel directories.


    ```

    chkconfig --del httpd

    ```'
  merge: -1
  pgno: 271
- img_proc: true
  md: 'You can also add services to chkconfig management with the --add option. chkconfig
    will create startup links for the new service in the appropriate startup directories,
    /etc/rc.d/rcn.d. If you have previously removed all links for a service, you can
    restore them with the add option.


    ```

    chkconfig --add httpd

    ```'
