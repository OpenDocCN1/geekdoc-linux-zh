    # ## Management


    Installing, uninstalling, or updating software packages has always been a simple
    process in Red Hat Linux due to the widespread use of the Red Hat Package Manager.
    Instead of using a standard TAR archive, software is packaged in a special archive
    with the Red Hat Package Manager (RPM). An RPM archive contains all the program
    files, configuration files, data files, and even documentation that constitute
    a software application. With one simple operation, the Red Hat Package Manager
    installs all these for you. It also checks for any other software packages that
    the program may need to run correctly. You can even create your own RPM window-based
    tool called redhat-config-packages to manage your RPM packages, installing new
    ones, updating or uninstalling ones you already have. The redhat-config-packages
    tool provide an easy-to-use interface for managing your packages, enabling you
    to obtain detailed information on a package easily, including a complete listing
    of the files it installs.


