  md: '# # Chapter 8


    # ## Servers


    Although printer installation is almost automatic on most Linux distributions,
    it helps to understand the underlying process. Once treated as devices attached
    to a system directly, printers are now treated as network resources managed by
    print servers. In the case of a single printer attached to a system, the networking
    become transparent and the printer appears as just one device. On the other hand,
    you could easily make use of a print server''s networking capability to let several
    systems use the same printer. You can find out information about printing in Linux
    at www.linuxprinting.org.


    # CUPS and LPRng


    Currently, there are two print servers available for use on Red Hat Linux, the
    Line Printer, Next Generation LPRng and the Common Unix Printing System (CUPS).
    LPRng was the traditional print server for Linux and Unix systems, but has since
    been deprecated by Red Hat and will be dropped from their distribution in later
    versions. With Red Hat 9, CUPS is now the primary print server for Red Hat Linux
    and is supported by redhat-config-printer. However, in Red Hat 8.0, LPRng is still
    used as the default and LPRng is the server supported by redhat-config-printer.


    You can easily switch from one system to the other with the redhat-switch-printer
    tool. A dialog box displays entries for either LPRng or CUPS. You then have to
    use redhat-config-services (Services), accessible in the Server Settings window
    and menu, to start your selected print server. The print server for CUPS is cups
    and for LPRng is lpd. Select the server, and select Actions | Restart.'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# 208 Red Hat Linux Pocket Administrator


    Once you have installed your printers and configured your print server, you can
    print and manage your print queue using print clients. There are a variety of
    printer clients available for the CUPS server, redhat-config-printer, Gnome print
    manager, the CUPS configuration tool, and various line printing tools like lpq
    and lpc. These are described in further detail later in this chapter. The CUPS
    configuration tool is a web-based configuration tool that can manage printers
    and print jobs (open your browser and enter the URL http://localhost:631). A web
    page is displayed with entries for managing, managing printers, and administrative
    tasks. Select the Manage Jobs entry to remove or reorder jobs you have submitted.
    There are a variety of printer clients available including Klpq and various line
    printing tools like lpq and lpc that work much like their CUPS counterparts.


    # Printer Devices and Configuration


    Before you use any printer, you first have to install it on a Linux system on
    your network. A local printer is installed directly on your own system. This involves
    creating an entry for the printer in a printer configuration file that defines
    the kind of printer it is, along with other features such as the device file and
    spool directory it uses. Installing a printer is fairly simple: determine which
    device file to use for the printer and the configuration entries for it. On Red
    Hat, you can use the redhat-config-printer configuration tool to enable you to
    set up and configure your printer easily. Depending on the interface you are using,
    redhat-config-printer will invoke either redhat-config-printer-gui, a Gnome printer
    configuration tool, or redhat-config-printer-tui, the same tool with a screen-based
    cursor driver interface.


    > TIP If you cannot find the drivers for your printer, you may be able to download
    them from www.linuxprinting.org. The site maintains an extensive listing of drivers.'
  merge: -1
  pgno: 220
