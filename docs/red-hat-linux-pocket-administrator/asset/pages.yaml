    # Installing a New Kernel Version


    To install a new kernel, you need to download the software for kernel to your
    system. You can install a new kernel either by downloading a binary version from
    your distribution''s web site and installing it or by downloading the source code,
    compiling the kernel, and then installing the resulting binary file with any modules.
    For Red Hat, the binary of the kernel is provided in an RPM package. You can install
    a new kernel, just as you would any other RPM software package.


    The easiest to install a new kernel on Red Hat is to use the Red Hat Network update
    agent (the Red Hat Network is now a subscription service you need to pay for).
    The update agent automatically downloads, updates, and installs a new kernel.
    The Red Hat Network does not automatically select kernel files for download. Although
    they are listed, you have to explicitly select them to be downloaded and installed.


    If you want to download kernel RPM packages directly from Red Hat, keep in mind
    that the complete kernel installation usually includes a series of RPM packages,
    all beginning with the word kernel. There are also other packages you may need,
    which contain updated system configuration files used by the new kernel. You can
    use the packages already installed on your system as a guide. Use the rpm command
    with the -qa option to list all packages and pipe that list through the grep command
    with the kernel pattern to display only the kernel packages:


    ```

    rpm -qa | grep kernel

    ```'
