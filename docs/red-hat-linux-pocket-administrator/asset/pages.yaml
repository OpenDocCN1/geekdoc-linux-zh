  md: '# 54 Red Hat Linux Pocket Administrator


    and. how. You set these permissions to limit access in one of three ways: You
    can restrict access to yourself alone, you can allow users in a pre-designated
    group to have access, or you can permit anyone on your system to have access.
    You can also control how a given file or directory is accessed.


    # Permissions


    A file and directory may have read, write, and execute permissions. When a file
    is created, it is automatically given read and write permissions for the owner,
    enabling you to display and modify the file. You may change these permissions
    to any combination you want. A file could also have read-only permission, preventing
    any modifications.


    # Permission categories


    Different categories of users can have access to a file or directory: the owner,
    the group, and all others belonging to that group. The owner is the user who created
    the file. Any file you create, you own. You can also permit a group to have access
    to a file. Often, users are collected into groups. For example, all the users
    for a given class or project could be formed into a group by the system administrator.
    A user can grant access to a file to the members of a designated group. Finally,
    you can also open access to a file to all other users on the system. In this case,
    every user not part of the file''s group could have access to that file. In this
    sense, every other user on the system makes up the “others” category. If you want
    to give the same access to all users on your system, you set the same permissions
    for both the group and the others. That way you include both members of the group
    (group permission) and all those users who are not members (others permission).


    # read, write, execute permissions


    Each category has its own set of read, write, and execute permissions. The first
    set controls the user’s own access to his or her files—the owner access. The second
    set controls the access of the group to a user’s files. The third'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# Managing Users 55


    set controls the access of all other users to the user''s files. The three sets
    of read, write, and execute permissions for the three categories—owner, group,
    and other—make a total of nine types of permissions.


    The ls command with the -l option displays detailed information about the file,
    including the permissions. In the following example, the first set of characters
    on the left is a list of permissions for the mydata file:


    ```

    $ ls -l mydata

    -rw-r--r-- 1 chris weather 207 Feb 20 11:55 mydata

    ```


    An empty permission is represented by a dash, -. The read permission is represented
    by r, write by w, and execute by x. Notice there are ten positions. The first
    character identifies the type. In a general sense, a directory can be considered
    a type of file. If the first character is a dash, a file is being listed. If the
    first character is d, information about a directory is being displayed.


    The next characters are arranged according to the different user categories. The
    first set of three characters is the owner''s set of permissions for the file.
    The second set of three characters is the group''s set of permissions for the
    file. The last set of three characters is the other users'' set of permissions
    for the file.


    # Permissions on Gnome


    On Gnome, you can set a directory or file permission using the Permissions panel
    in its Properties window. Right-click the file or directory entry in the file
    manager window and select Properties. Then, select the Permissions panel. You
    will find a table of boxes for Read, Write, and Execute along with rows for Owner,
    Group, and Other. Check the appropriate box for the permission you want. Normally,
