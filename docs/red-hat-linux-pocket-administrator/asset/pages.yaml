    Use with -f to check for any problems mounting a file system, -fv. |

    | -w | Monitors the file system with read/write permission. |

    | -r | Monitors the file system with read-only permission. |

    | -n | Monitors the file system without placing an entry for it in the mstab file.
    |

    | -t type | Specifies the type of file system to be mounted. See Table 5-1 for
    valid file types. |

    | -a | Monitors all file systems listed in /etc/fstab. |

    | -o option-list | Monitors the file system using a list of options. This is a
    comma-separated list of options following -o. See Table 5-2 for a list of the
    options. |


