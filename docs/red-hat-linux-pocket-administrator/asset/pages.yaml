  md: '# 30 Red Hat Linux Pocket Administrator


    will select only error messages, not crit, alert, and emerg messages. You can
    also restrict priorities with the ! operator. This will eliminate messages with
    the specified priority and higher. For example, mail.!crit will exclude crit messages,
    and the higher alert and emerg messages. To specifically exclude the messages
    for an entire facility, you use the none priority. mail.none excludes all mail
    messages. This is usually used when you''re defining several sectors in the same
    entry.


    You can list several priorities or facilities in a given sector by separating
    them with commas. You can also have several sectors in the same entry by separating
    them with semicolons. The first example saves to /var/log/messages file with info
    priority, excluding all mail, and authentication messages (authpriv). The second
    saves all crit messages and higher for the uucp and news facilities to the /var/log/spooler
    file:


    ```

    *info:mail.none;authpriv.none /var/log/messages uucp,news.crit /var/log/spooler

    ```


    # actions and users


    In the action field, you can specify files, remote systems, or, pipes. An action
    entry for a file must always begin with a / and specify its full path name, such
    as /var/log/messages. To log messages to a remote host, you simply specify the
    hostname preceded by an @ sign. The following example saves kernel messages on
    rabbit.trek.com.


    ```

    kern.* @rabbit.trek.com

    ```


    To send messages to users, you list their login names. The following example will
    send critical messages to the consoles for the users chris and aleina:


    ```

    news.=crit chris, aleina

    ```


    You can also output messages to a named pipe (FIFO). The pipe entry for the action
    field begins with a |. The following example pipes kernel debug messages to the
    named pipe |/usr/adm/debug:


    ```

    kern.=debug |/usr/adm/debug

    ```'
