    # Logical Volume Manager


    For easier hard disk storage management, you can set up your system to use the
    Logical Volume Manager (LVM), creating LVM partitions that are organized into
    logical volumes to which free space is automatically allocated. Logical Volumes
    provide a more flexible and powerful way of dealing with disk storage, organizing
    physical partitions into logical volumes in which you can easily manage disk space.
    Disk storage for a logical volume is treated as one pool of memory, though the
    volume may in fact contain several hard disk partitions across'
  merge: -1
