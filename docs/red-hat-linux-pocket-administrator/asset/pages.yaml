    You must take precautions to protect your root password. Anyone who gains access
    as the root user will have complete control over your system. The online manual
    for the passwd command provides detailed recommendations for handling and choosing
    your password. For example, never store your password in a file on your system,
    and never choose one based on any accessible information, such as your phone number
    or date of birth. A basic guideline is to make your password as complex as possible
    using a phrase of several words with numbers and upper and lower case, yet something
    you can still remember easily so you never have to write it down. You can access
    the passwd online manual page with the command:


    ```

    # man passwd

    ```


    # Root User Access: su


    While you are logged in to a regular user account, it may be necessary for you
    to log in as the root and become a superuser. Ordinarily, you would have to log
    out of your user account first, and then log in to the root. Instead, you can
    use the su command (switch user) to log in directly to the root while remaining
    logged in to your user account. If you are using a GUI desktop like Gnome, you
    can enter the su command from a terminal window, or use ALT-CTRL-F1 to switch
    to a command line interface (ALT-CTRL-F10 returns you back to the GUI interface).
    A CTRL-D or exit command returns you to your own user login. When you are logged
    as the root, you can use su to log in as any user, without providing the password.
    For example, the user is already logged. In the next example, the su command then
    logs in as the root, making you a superuser. Some basic superuser commands are
    shown in Table 1-1.


    ```

    $ pwd

    /home/chris

    ```'
