  md: '# ps Command


    From the command line, you can use the ps command to list processes. With the
    -aux option, you can list all processes. Piping the output to a grep command with
    a pattern enables you to search for a particular process. A pipe funnels the output
    of a preceding command as input to a following command. The following command
    lists all X System processes:


    ```

    ps -aux | grep ''X''

    ```


    A number of utilities on your system provide detailed information on your processes,
    as well as other system information such as CPU and disk use (see Table 1-10).
    Although these tools were designed to be used on a shell command line, several
    now have KDE and Gnome versions that provide a GUI interface for displaying results
    and managing processes.


