  md: '# Chapter 6


    # RAID and LVM


    With the onset of cheap, efficient, and very large hard drives, the most professional
    systems employ several hard drives. The use of multiple hard drives opens up opportunities
    for ensuring storage reliability as well as more easily organizing access to your
    hard disks. Linux provides two methods for better managing your hard disks: Redundant
    Arrays of Independent Disks (RAID) and Logical Volume Management (LVM). RAID is
    a way of storing the same data in different places on multiple hard disks. These
    multiple hard drives are treated as a single hard drive. They include recovery
    information that allows you to restore your files should one of the drives fails.
    LVM is a method for organizing all your hard disks into logical volumes, letting
    you pool the storage capabilities of several hard disks into a single logical
    volume. Your system then sees one large storage device, and you do not have to
    micromanage each underlying hard disk and their partitions.


    # Enabling RAID and LVM in the Kernel


    Red Hat has methods for creating, installing, and configuring RAID and LVM devices
    during the Linux installation process. If, instead, you wish to add these devices
    later, you need to first enable support for RAID in the kernel. RAID is not enabled
    by default unless you installed RAID devices during installation. As discussed
    in Chapters 7 and 8, you need to configure kernel modules, in this case, modules
    for RAID and LVM devices. During kernel configuration, select multidevice support
    (RAID and LVM) from the Linux Kernel Configuration window. You can then choose
    to enable support for RAID and LVM, either as modules or as a built-in kernel
    feature (If you)'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# Red Hat Linux Pocket Administrator


    make them parts of the kernel, you will have to rebuild the entire kernel). For
    RAID devices, you can choose the type of Linux software RAID devices you want
    to install.


    # Configuring RAID Devices


    RAID is a method of storing data across several disks to provide greater performance
    and redundancy. In effect, you can have several hard disks treated as just one
    disk by your operating system. RAID then efficiently stores and retrieves data
    across all these disks, instead of having the operating system access each one
    as a separate file system. Lower-level details of storage and retrieval are no
    longer a concern of the operating system. This allows greater flexibility in adding
    or removing hard disks, as well as implementing redundancy in the storage system
    to provide greater reliability. With RAID, you can have several hard disks that
    are treated as one virtual disk, where some of the data are used as real-time
    mirrors, duplicating data. You can use RAID in several ways depending upon the
    degree of reliability you need. By placing data on multiple disks, I/O operations
    can overlap in a balanced way, improving performance. Because having multiple
    disks increases the mean time between failures (MTBF), storing data redundantly
    increases fault tolerance.


    RAID can be implemented on a hardware or software level. On a hardware level,
    you can have hard disks connected to a RAID hardware controller, usually a special
    PC card. Your operating system then accesses storage through the RAID hardware
    controller. Alternatively, you can implement a software RAID controller program
    manage access to hard disks treated as RAID devices. The software version lets
    you use IDE hard disks as RAID disks. Linux uses the MD driver, supported in the
    2.4 kernel, to implement a software RAID controller. Linux software RAID supports
    five levels (linear, 0, 1, 4, and 5) whereas hardware RAID supports many more.
    Hardware levels, such as'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'RAID and LVM 167


    6 through 10, provide combinations of greater performance and reliability.


    **TIP** Before you can use RAID on your system, sure it is supported on your kernel,
    along with the RAID levels you want to use. If not, you will have to reconfigure
    the kernel and install a RAID module for the kernel. Check the Multi-Driver Support
    component in your kernel configuration. You can specify support of any or all
    of the RAID levels.


    # Linux Software RAID Levels


    Linux software RAID can be implemented at different levels, depending on whether
    you want organization, efficiency, redundancy or reconstruction capability. Each
    capability corresponds to different RAID levels. For most levels, the size of
    the hard disk devices should be the same. For mirroring RAID 1, disks of the same
    size are required, and for RAID 5, they are recommended. Linux software RAID supports
    five levels, as shown in Table 6-1 (On Red Hat, level 4 is implemented as part
    of 5).


    | RAID Levels | Capability | Description |

    | --- | --- | --- |

    | linear | Appending | Simply treats RAID hard drives as one virtual drive with
    no striping, mirroring, or parity reconstruction. |

    | 0 | Striping | Implements disk striping across drives with no redundancy. |

    | 1 | Mirroring | Implements a high level of redundancy. Each drive is treated
    as mirror for all data. |

    | 5 | Distributed Parity | Implements data reconstruction capability using parity
    information. Parity information is distributed across all drives, instead of using
    a separate drive as in RAID 4. |


    **Table 6-1.** Linux Software RAID Levels'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# 168 Red Hat Linux Pocket Administrator


    # Linear


    The Linear level lets you organize several hard disks into one logical hard disk,
    providing a pool of continuous storage. Instead of being forced to set up separate
    partitions on each hard drive, in effect you have only one hard drive. The storage
    is managed sequentially. When one hard disk fills up, the next one is used. In
    effect, you are appending one hard disk to the other. This level provides no recovery
    capability. If you had a hard disk RAID array containing 20 GB disks, if you used
    up the storage on one, you would automatically start on the next.


    # RAID 0: Striping


    For efficiency, RAID stores data using disk striping, where data is organized
    into standardized stripes that can be stored across the RAID drives for faster
    access (level 0). RAID 0 also organizes your hard disks into common RAID devices,
    but treats them like single hard disks, storing data randomly across all the disks.
    If you had a hard disk RAID array containing 20 GB disks, you could access them
    as one 160 GB device.


    # RAID 1: Mirroring


    RAID level 1 implements redundancy through mirroring. In mirroring, the same data
    is written to each RAID drive. Each disk has a complete copy of all the data written
    so that if one or more disks fail, the others still have your data. Though extremely
    safe, redundancy can be very inefficient and consumes a great deal of storage.
    For example, on a RAID array of two 80 GB disks, one is used for standard storage
    and the other is a real-time backup. This leaves you with only 80 GB for use on
    your system. Write operations also have to be duplicated across as many mirrored
    hard disks used by the RAID array, slowing down operations.


    # RAID 5: Distributed Parity


    As an alternative to mirroring, data can be reconstructed using parity information
    in case of a hard drive crash. Parity information is saved instead of full duplication
    of'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'the data. Parity information takes up the space equivalent of one drive, leaving
    most of the space on the RAID drives for storage. RAID 5 combines both striping
    and parity (see RAID 4), where parity information is distributed across the hard
    drives, rather than in one drive dedicated to that purpose. This allows the use
    of the more efficient access method, striping. With both striping and parity,
    RAID 5 provides both fast access and recovery capability, making it the most popular
    RAID level used. For example, a RAID array of four 80GB hard drives would be treated
    as one 320GB hard drive with part of that storage (80 GB) used to hold parity
    information, giving 240 GB free.


    # RAID 4: Parity


    Though it is not supported in Red Hat due to overhead costs, RAID 4, like RAID
    5, supports a more compressed form of recovery using parity information instead
    of mirrored data. With RAID 4, parity information is kept on a separate disk,
    while the others are used for data storage, much like a linear model.


    > TIP also allows you to create and format RAID drives during installation. At
    that time, you can create your RAID partitions and devices.


    # RAID Devices: md


