  md: '# KDE Process Manager (kpm)


    The K Desktop provides the KDE Process Manager (kpm) for viewing and managing
    your processes. You can sort the processes according to their fields by clicking
    the field button at the top of the process list. If you select a process, you
    can then choose to perform several actions on it, such as ending (killing the
    process) or suspending (putting it to sleep). Right-click displays a pop-up menu
    with the different actions you can take. You can further refine your process list
    by choosing to view only your own processes, system processes, or all processes.


    # KDE Task Manager and Performance Monitor (KSysguard)


    Red Hat also provides the KDE Task Manager and Performance Monitor, KSysguard,
    accessible from the Extras System Tools menu as KDE System Guard. This tools allows
    you to monitor the performance of your own system as well as remote systems. KSysguard
    can provide simple values or detailed tables for various parameters. A System
    Load panel provides graphical information about CPU and memory usage, and a Process
    Table lists current processes using a tree format to show dependencies. You can
    design your own monitoring panels with worksheets, showing different types of
    values you want to display and the form you want to display them in, like a bar
    graph or digital meter. The Sensor Browser pane is an expandable tree of sensors
    for information like CPU System Load or Memory''s Used Memory. There is a top
    entry for each host you are connected to, including your own, localhost. To design
