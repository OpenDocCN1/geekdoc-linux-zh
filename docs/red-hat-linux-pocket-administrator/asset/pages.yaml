  md: '# # Chapter 4


    #  Filesystem Hierarchy Standard


    Linux organizes its files and directories into one overall interconnected tree,
    beginning from the root directory and extending down to system and user directories.
    The organization and layout for the system directories is determined by the Filesystem
    Hierarchy Standard (FHS). The FHS provides a standardized layout that all Linux
    distributions should follow in setting up their system directories. For example,
    there must be an `/etc` directory to hold configuration files and a `/dev` directory
    for device files. You can find more about FHS, including the official documentation,
    at www.pathname.com/Linux distributions, developers, and administrators all follow
    the FHS to provide a consistent organization to the Linux file system.


    Linux uses a number of specifically named directories for specialized administration
    tasks. All these directories are at the very top level of your Linux file system,
    the file system root directory represented by a single slash, /. For example,
    the `/dev` directory holds device files, and the `/home` directory holds the user
    home directories and all their user files. You only have access to these directories
    and files as the system administrator (though users normally have read-only access).
    You need to log in as the root user, placing you in a special root user administrative
    directory called `/root`. From here, you can access any directory on the Linux
    file system, both administrative and user.'
  merge: -1
