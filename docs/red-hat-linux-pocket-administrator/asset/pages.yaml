    # mkisofs Options


    You may need to include several important options with mkisofs to create a data
    CD properly. The -o option is used to specify the name of the CD image file. This
    can be any name you want to give. The -R option specifies RockRidge protocols,
    and the -J option provides for long Windows 95/98/ME or XP names. The -r option,
    in addition to the RockRidge protocols (-R), sets standard global permissions
