  md: '# Printer Device Files


    Linux creates three device names for parallel printers automatically during installation:
    lp0, lp1, and lp2. (Most systems currently use lp1.) The number used in these
    names corresponds to a parallel port on your PC. lp0 references the LPT1 parallel
    port, lp1 references the LPT2 parallel port, and lp2 references LPT3. Serial printers
    use the serial ports, referenced by the device files ttyS0, ttyS1, ttyS2, and
    so on.


    # Spool Directories


    When your system prints a file, it makes use of special directories called spool
    directories. A print job is a file to be printed. When you print a file to a printer,
    a copy of it is made and placed in a spool directory set up for that printer.
    The location of the spool directory is obtained from the printer''s entry in its
    configuration file. On Linux, the spool directory is located at /var/spool/lpd
    under a directory with the name of the printer. For example, the spool directory
    for the mypson would be located at /var/spool/lpd/mypson. The spool directory
    contains several files for managing print jobs. Some files use the name of the
    printer as their extension. For example, the mypson printer has the files control.mypson,
    which provides printer queue control, and active.mypson for the active print job,
    as well as log.mypson, which is the log file.


    Printer Configuration with redhat-config-printer


    The redhat-config-printer utility is an easy interface for setting up and managing
    your printers. Using only redhat-config-printer, you can easily install a printer
    on your Linux system. You can start redhat-config-printer by selecting the Printing
    entry in the System Settings window or menu. The redhat-config-printer utility
    enables'
  merge: -1
  pgno: 221
- img_proc: true
  md: 'you to select the appropriate driver for your printer, as well as set print
    options as paper size and print resolutions. Once you have configured your printer
    with redhat-config-printer, it generates an entry for the print in CUPS. With
    Red Hat 9, redhat-config-printer now supports the CUPS printing server, instead
    of LPRng. Configurations are saved in CUPS printer configuration files, as described
    in the CUPS section.


    When you use redhat-config-printer, you are presented with a window that lists
    your installed printers (see Figure 8-1). To add a new printer, click the New
