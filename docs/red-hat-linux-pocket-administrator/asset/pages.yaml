  md: '# xconfig


    The xconfig tool opens a Linux Kernel Configuration window listing the different
    configuration categories. Buttons at the right of the screen are used to save
    the configuration or copy it to a file, as well as to quit. Clicking an entry
    opens a window that lists different features you can include. Three check boxes
    to the left of each entry enable you to choose between a feature compiled directly
    into the kernel, created as a separate module that can be loaded at runtime, or
    not included at all. As a rule, features in continual use, such as network and
    file system support, should be compiled directly into the kernel. Features that
    could easily change, such as sound cards, or features used less frequently, should
    be compiled as modules. Otherwise, your kernel image file may become too large
    and slow to run.


    # Important Kernel Configuration Features


    The xconfig and menuconfig tools provide excellent context-sensitive help for
    each entry. To the right of each entry is a Help button. Click it to display a
    detailed explanation of what that feature does and why you would include it either
    directly or as a module, or even exclude it. When you are in doubt about a feature,
    always use the Help button to learn exactly what it does and why you would want
    to use it. Many of the key features are described here.


    +   - Loadable Module Support In most cases, you should make sure your kernel
    can load modules. Click the Loadable Module Support button to display a listing
    of several module management options. Make sure Enable Loadable Module Support
    is marked Yes. This feature allows your kernel to load modules as they are needed.
    Kernel Module Loader should also be set to Yes, because this allows your daemons,
    like your web server, to load any modules they may need.'
