    previous sections use the mount command to mount a file system. Normally, the
    mounting of file systems on hard disk partitions can only be done as the root
    user, whereas CD-ROMs and floppies can be mounted by any user. Table 5-3 lists
    the different options for the mount command.


    | Options | Description |

