  md: '# Installing New Modules for the Kernel


    The source code for your Linux kernel contains an extensive set of modules, of
    which only a few are actually used on your system. When you install a new device,
    you may have to install the kernel module that provides the drivers for it. This
    involves selecting the module you need from a list, and then regenerating your
    kernel modules with the new module included. Then the new module is copied into
    the module library, installing it on your system. You can then enter it in the
    `/etc/modules.conf` file with any options, or use `modprobe` to install manually.


    First, make sure you have installed the kernel source code in the `/usr/src/linux`
    directory (see Chapter 9). If not, simply use an installation utility such as
    rpm or an RPM utility like redhat-config-packages to install the kernel RPM packages.
    If you are using the source code version of the kernel, unpack it and move its
    contents to the `/usr/src` directory.


    Now change to the `/usr/src/linuxversion` /usr/src/linuxversion` directory, where
    `version` is the kernel version. Red Hat has the version number in the directory
    name. Then use the `make` command with the `xconfig` or `menuconfig` argument
    to display the kernel configuration menus, invoking them with the following commands.
    The `make xconfig` command starts an X Window System interface that needs to be
    run on your desktop from a terminal window.


    ```

    make xconfig

    make menuconfig

    ```


    Using the menus described in Chapter 9, select the modules you need. Make sure
    each is marked as a module, clicking the Module check box in `xconfig` or typing
    M for `menuconfig`. Once the kernel is configured, save and exit from the configuration
    menus. Then you compile the modules, creating the module binary files with the
    following command:


    ```

    make modules

    ```'
