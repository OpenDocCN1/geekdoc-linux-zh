  md: '# Lightweight Directory Access Protocol


    The Lightweight Directory Access Protocol (LDAP) is designed to implement network-accessible
    directories of users, providing information about them such as their e-mail address
    or phone number. Such directories can also be used for authentication purposes,
    identifying that a certain user belongs to a specified network. You can find out
    more information on LDAP at www.ldap.org. You can think of an LDAP directory as
    an Internet-accessible phone book, where anyone can look up to find your e-mail
    address or other information. In fact, it may be more accurate to refer to such
    directories as databases. They are databases of user information, accessible over
    networks like the Internet. Normally, the users on a local network are spread
    across several different systems, and to obtain information about a user, you
    would have to know what system the user is on, and then query that system. With
    LDAP, user information for all users on a network is kept in the LDAP server.
    You only have to query the network''s LDAP server to obtain information about
    a user. For example, Sendmail can use LDAP to look up user addresses. You can
    also use Mozilla or Netscape to query LDAP. In Mozilla, open the address book,
    then select File | New, and choose the LDAPD directory. Here you can enter the
    LDAP server. In the Preferences dialog, select addressing under the Mail & Newsgroup
    category. This displays a panel where you can enter the LDAP directory.


    # LDAP Clients and Servers


    LDAP directories are implemented as clients and servers, where you use an LDAP
    client to access an LDAP server that manages the LDAP database. Most Linux distributions,
    including Red Hat, use OpenLDAP, an open-source'
  merge: -1
  pgno: 83
- img_proc: true
