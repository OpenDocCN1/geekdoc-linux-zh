    # Changing a File''s Owner or Group: chown and chgrp


    Although other users may be able to access a file, only the owner can change its
    permissions. If, however, you want to give some other user control over one of
    your file''s permissions, you can change the owner of the file from yourself to
    the other user. The chown command transfers control over a file to another user.
    This command takes as its first argument the name of the other user. Following
    the username, list the files you are transferring. In the next example, the user
    gives control of the mydata file to user robert:


    ```

    $ chown robert mydata

    $ ls -l mydata

    -rw-r--r-- 1 robert weather 207 Feb 20 11:55 mydata

    ```'
