  md: '# 34 Red Hat Linux Pocket Administrator


    # Procman System Manager


    The current version of Red Hat provides the Procman System Manager for displaying
    system information and managing system processes, accessible from System Tools
    | System Monitor. There are two panels, one for processes and one for system information.
    The System Monitor panel displays graphs for CPU, Memory, and Swap memory usage
    (see Figure 1-3). Your disk devices are also listed, showing the amount of disk
    space used and how much is free. The Process Listing lists your processes, letting
    you sort or search for processes. You can use field buttons to sort by name, process
    id, user, memory, and even percentage of CPU time used. The View pop-up menu lets
    you select all, your own, or active processes. You can easily stop any process
    by selecting it and then clicking the End button. Right-clicking an item displays
    actions you can take on the process such as stopping or hiding it. The Memory
    Maps display, selected shows information on virtual memory, inodes, and flags.


    # Gnome System Manager (GTop)


    With the Gnome System Manager (GTTop), you can sort the processes according to
    their fields by clicking the field''s button at the top of the process list. If
    you right-click an entry, a pop-up menu displays actions you can perform on that
    entry. System statistic summary graphs are displayed at the top of the window,
    showing the CPU load, memory use, and disk use. You can add more graphs or change
    their display features, such as the colors. The GTop window displays three tabbed
    panels for detailed reports showing processes, memory use, and file system use.
    You can add more, showing customized reports as only the user processes. Process
    lists can be further refined to show user, system, or all processes. To configure
    GTop, select the Settings | Preferences to display a menu with tabbed panels for
    specifying the update frequency for different statistics, determining the summaries
    you want displayed, and which process fields to show. You can find the Gnome System
    Manager in the Utilities menu.'
