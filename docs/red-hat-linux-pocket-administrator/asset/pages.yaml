    # Sticky Bit Permissions


    One other special permission provides for greater security on directories, the
    sticky bit. Originally, the sticky bit was used to keep a program in memory after
    it finished execution to increase efficiency. Current Linux systems ignore this
    feature. Instead, it is used for directories to protect files within them. Files
    in a directory with the sticky bit set can only be deleted or renamed by the root
    user or the owner of the directory.


