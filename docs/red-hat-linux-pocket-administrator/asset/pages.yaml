    defined on your Linux system in the /etc/dev/ directory, starting with md0. /dev/md0
    is the first RAID device, and /dev/md1 is the second, and so on. Each RAID device,
    in turn, uses hard disk partitions, where each partition contains an entire hard
    disk. These partitions are usually referred to as RAID disks, whereas a RAID device
    is usually an array of the RAID disks it uses.


