  md: '# syslogd.conf Entries


    An entry in syslog.conf consists of two fields: a selector and an action. The
    selector is the kind of service to be logged, as mail or news, and the action
    is the location where messages are to be placed. The action is usually a log file,
    but it can also be a remote host or a pipe to another program. This kind of service
    is referred to as a facility. syslog has several terms it uses to specify kinds
    of service (see Table 1-9). A facility can be further qualified by a priority.
    A priority specifies the kind of message generated by the facility. syslog uses
    several designated terms to indicate different priorities. A sector is constructed
    from both the facility and priority, separated by a period. For example, to save
    error messages generated by mail systems, use a sector consisting of the mail
    facility and the err priority, as shown here:


    ```

    mail.err

    ```


    To save these messages to the /var/log/maillog file, you specify that as the action,
    giving the following entry:


    ```

    mail.err /var/log/maillog

    ```


    syslog also supports the use of * as a matching character to match either all
    the facilities or priorities in a sector. cron.* would match on all cron messages
    no what the priority, *.err would match on error messages from all the facilities,
    and *.* saves all mail messages to the /var/log/maillog file and all critical
    messages to the /var/log/mycritical file:


    ```

    mail.* /var/log/maillog

    *.crit /var/log/mycritical

    ```


    # Priorities


    When you specify a priority for a facility, all messages with a higher priority
    are also included. So the err priority also includes the crit, alert, and emerg
    priorities. If you just want to select the message for a specific priority, you
    qualify the priority with the = operator. For example, mail=.err'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# Basic System Administration 29


    | Facilities | Description |

    |---|---|

    | auth-priv | Security/authorization messages (private) |

    | cron | Clock daemon (cron and at) messages |

    | daemon | Other system daemon messages |

    | kern | Kernel messages |

    | lpr | Line printer subsystem messages |

    | mail | Mail subsystem messages |

    | mark | Internal use only |

    | news | Usenet news subsystem messages |

    | syslog | Syslog internal messages |

    | user | Generic user-level messages |

    | uucp | UUCP subsystem messages |

    | local0 through | Reserved for local use |


    | Priorities | Description |

    |---|---|

    | debug | 7, Debugging messages, lowest priority |

    | info | 6, Informational messages |

    | notice | 5, Notifications, normal, but significant, condition |

    | warning | 4, Warnings |

    | err | 3, Error messages |

    | crit | 2, Critical conditions |

    | alert | 1, Alerts, action must be taken immediately |

    | emerg | 0, Emergency messages, system is unusable , highest priority |


    | Operators | Description |

    |---|---|

    | * | Matches all facilities or priorities in a sector |

    | = | Restrict to a specified priority |

    | ! | Exclude specified priority and higher ones |

    | / | A file to save messages to |

    | @ | A host to send messages to |

    | | | FIFO pipe to send messages to |


    **Table 1-9.** Syslog Facilities, Priorities, and Operators'
