    the binary equivalent of 111 101 101.


    ```

    $ chmod 755 myprog

    ```


    # Setting Permissions:

    Permission Symbols


    The symbolic method of setting permissions uses the characters r, w, and x for
    read, write, and execute, respectively. Any of these permissions can be added
    or removed. The symbol to add a permission is the plus sign, +. The symbol to
    remove a permission is the minus sign, -. In the next example, the chmod command
    adds the execute permission and removes the write permission for the mydata file
    for all categories. The read permission is not changed.


    ```

    $ chmod +x-w mydata

    ```


    Permission symbols also specify each user category. The owner, group, and other
    categories are represented by the u, g, and o characters, respectively. Notice
    the owner category is represented by a u, and can be thought of as the user. The
    symbol for a category is placed before plus'
