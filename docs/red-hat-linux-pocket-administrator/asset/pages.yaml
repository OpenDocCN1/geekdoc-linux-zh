    # Ownership


    Files and directories belong to both an owner and a group. A group usually consists
    of a collection of users, all belonging to the same group. In the following example,
    the mydata file is owned by the robert and belongs to the group weather.


    ```

    -rw-r--r-- 1 robert weather 207 Feb 20 11:55 mydat

    ```


    A group can also consist of one user, however normally it''s the user who creates
    the file. Each user on the system, including the root user, is assigned their
    own group, of which they are the only member, ensuring access only by that user.
    In the next example, the report file is owned by the robert user and belongs to
    that user''s single group, robert.'
