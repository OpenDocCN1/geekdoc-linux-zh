  md: '# Managing Groups


    You can manage groups using either shell commands or window utilities like the
    Red Hat User Manager.


    # /etc/group and /etc/gshadow


    The system file that holds group entries is called /etc/group. The file consists
    of group records, with one record per line and its fields separated by colons.
    A group record has four fields: a group name, a password, its ID, and the users
    who are part of this group. The password field can be left blank. The fields for
    a group record are as follows:


    +   **Group name** The name of the group, which must be unique


    +   **Password** With shadow security implemented, this field is an x, with the
    password indicated in the /etc/gshadow file.


    +   **Group ID** The number assigned by the system to identify this group


    +   **Users** The list of users that belong to the group, separated by commas


    Here is an example of an entry in an /etc/group file. The group is called engines,
    the password is managed by shadow security, the group ID is 100, and the users
    who are part of this group are chris, robert, valerie, and aleina.


    ```

    engines:x:100:chris, robert, valerie, aleina

    ```


    As in case of the /etc/passwd file, it is best to change group entries using a
    group management utility like groupmod, groupadd, or the Red Hat User Manager.
    All users have read access to the /etc/group file. With shadow security, secure
    group data like passwords are kept in the /etc/gshadow file, to which only the
    root user has access.'
  merge: -1
  pgno: 62
- img_proc: true
  md: '# User Private Groups


    A new user can be assigned to a special group set up for just that user and given
    the user''s name. The new user dylan is given a default group called dylan. The
    group dylan will also show up in the listing of groups. This method of assigning
    user groups is called the User Private Group (UPG) scheme. UPG is currently used
    on Red Hat systems. The supplementary groups are additional groups that the user
    may want to belong to. Traditionally, users were all assigned to one group named
    users that would subject all users to the group permission controls for the group.
    With UPG, each user has its own, with its group permissions.


    # group directories


    As users, you can create a home directory for a group. To do so, you simply create
    a directory for the group /home directory and change its group to that of the
    group, along with allowing access by any member of the group. The following example
    creates a directory called engines and changes its group to that of the engines
    group:


    ```

    mkdir /home/engines

    chgrp engines /home/engines

    ```


    Then the read, write, and execute permissions for the group level should be set
    with the chmod command, discussed later in this chapter:


    ```

    chmod g+rwx /home/engines

    ```


    Any member of the engines group can now access the /home/engines directory and
    any shared files placed therein. This directory becomes a shared directory for
    the group. You can, in fact, use the same procedure to make other shared directories
    at any location on the file system.


    Files within the shared directory should also have their permissions set to allow
    access by other users in the'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# 52 Red Hat Linux Pocket Administrator


    group. When a user places a file in a shared directory, the user needs to set
    the permissions on that file to allow other members of the group to access it.
    A read permission will write lets them change it, and execute them run it (used
    for scripts and programs). The following example first changes the group for the
    myodel file to engines. Then it copies the myodel file to the /home/engines directory
    and sets the group read and write permission for the engines group.


    ```

    $ chgrp engines myodel

    $ cp myodel /home/engines

    $ chmod g+rw /home/engines/myodel

    ```


    # Managing Groups with the Red Hat User Manager


    You can add, remove, and modify any group easily with the Red Hat User Manager.
    First, access the Red Hat User Manager by clicking the User & Groups icon in the
    System Settings, listed in the Start here now. Then, click the tabbed panel Groups
    in the Red Hat User Manager window. This will list all your current groups. There
    will be three fields for each entry: Group Name, Group ID, and Group Members.


    To add a group, just click the Add Group button. This opens a small window where
    you can enter the group name. The new group will be listed in the User Manager''s
    Groups listing. To add users as members of the group, select the group''s entry
    and click the Properties button. This opens a window with tabbed panels for Group
    Data and Group Users. The Users panel list all current users with check boxes.
    Click the check boxes for the users you want to be members of this group. If you
    want to remove a user as member, click the check box to remove its check. Click
    OK to affect your changes. If you want to remove a group, just select its entry
    in the User Manager''s Groups panel and then click the Delete button.'
