  md: '# 62 Red Hat Linux Pocket Administrator


    and minus signs preceding the read, write, and execute permissions. If no category
    symbol is used, all categories are assumed, and the permissions specified are
    set for the user, group, and others. In the next example, the first chmod command
    sets the permissions for the group to read and write. The second chmod command
    sets permissions for other users to read. Notice no spaces between the permission
    specifications and the category. The permissions list is only one phrase, with
    no spaces.


    ```

    chmod g+rw mydata

    chmod o+r mydata

    ```


    A user may remove permissions as well as add them. In the next example, the read
    permission is set for other users, but the write and execute permissions are removed:


    ```

    chmod o+wx mydata

    ```


    Another permission character exists, a, which represents all the categories. The
    a is the default. In the next example, the two commands are equivalent. The read
    permission is explicitly set with the a denoting all types of users: other, group,
    and user.


    ```

    chmod a+r mydata

    chmod +r mydata

    ```


    One of the most common permission operations is setting a file''s executable permission.
    This is often done in the case of shell program files. The executable permission
