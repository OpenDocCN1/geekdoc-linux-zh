    # Parent Directory Permissions


    If you have files you want other users to access to, you not only need to set
    permissions for that file, you also must make sure the permissions are set for
    the directory in which the file is located. To access your file, a user must first
    access the file''s directory. The same applies to parents of directories. Although
    a directory may give permission to others to access it, if its parent directory
    denies access, the directory cannot be reached. Therefore you must pay close attention
    to your directory tree. To provide a directory, all other directories above it
    in the directory tree must be accessible to other users.


    # Ownership Permissions


    In addition the read/write/execute permissions, you can also set ownership permissions
    for executable programs. Normally, the user who runs a program owns it while it
    is running, even though the program file may be owned by another user. The Set
    User ID permission allows the original owner of the program to own always, while
    another user is running the program. For example, most software on the system
    is owned by the root, but is run by ordinary users. Some such software may modify
    files owned by the root. In this case, the ordinary user would need to run that
    program so the program could have the permissions to change ownership so the root-owned
    files. The Group ID permission works the same way, except for groups. Programs
    owned by a group retain ownership, even when run by users from another group.
    The program can then change owner group''s files. There is a potential security
    risk involved in that you are essentially giving a user some limited root-level
    access


    # Ownership Permissions

    Using the Binary Method


    For the ownership permissions, you add another octal number to the beginning of
    the octal digits. The octal digit for User ID permission is 4 (100) and for Group
    ID, it is 2 (010), or use 6 to set both (110). The following example'
