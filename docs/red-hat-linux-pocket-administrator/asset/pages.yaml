  md: '# Kernel Configuration Tools


    You can configure the kernel using one of several available configuration tools:
    config, menuconfig, or xconfig. You can also edit the configuration file directly.
    These tools perform the same configuration tasks, but use different interfaces.
    The config tool is a simple configure script providing line-based prompts for
    different configuration options. The menuconfig tool provides a cursor-based menu,
    which you can still run from the command line. Menu entries exist for different
    configuration categories, and you can pick and choose the ones you want. To mark
    a feature for inclusion in the kernel, move to it and press the SPACEBAR. An asterisk
    appears in the empty spaces to the left of the entry. If you want to make it a
    module, press M and an M appears in the parentheses. The xconfig tool runs on
    a window manager and provides a window interface with buttons and menus. You can
    use your mouse to select entries. A menu consists of configuration categories
    that are listed as buttons you can click. All these tools save their settings
    to .config file in the kernel source''s directory. If you want to remove a configuration
    entirely, you can use the mrproper option to remove the .config file and any binary
    files, starting over from scratch.


    ```

    make mrproper

    ```


    You start a configuration tool by preceding it with the make command. Be sure
    you are in the /usr/src/linux-version directory. The process of starting a configuration
    tool is a make operation that uses the Linux kernel makefile. The xconfig tool
    should be started from a terminal window on your window manager. The menuconfig
    and config tools are started on a shell command line. The following example lists
    commands to start xconfig, menuconfig, and config:


    ```

    make xconfig

    make menuconfig

    make config

    ```'
