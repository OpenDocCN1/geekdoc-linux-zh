  md: '# /etc/passwd


    When you add a user, an entry for that user is made in the /etc/passwd file, commonly
    known as the password file. Each entry takes up one line that has several fields
    separated by colons. The fields are as follows:


    +   * **Username** Login name of the user

    * **Password** Encrypted password for the user''s account

    * **User ID** Unique number assigned to the system

    * **Group ID** Number used to identify the group to which the user belongs

    * **Comment** Any user information, such as the user''s full name

    * **Home directory** The user''s home directory

    * **Login shell** Shell to run when the user logs in; this is the default shell,
    usually /bin/bash


    Depending on whether or not you are using shadow passwords, the password field
    (the second field) will be either an x or an encrypted form of the user''s password.
    Red implements shadow passwords by default, so these entries should have an x
    for their passwords. The following is an example of an /etc/passwd entry. For
    such entries, you must use the passwd command to create a password. Notice that
    user IDs in this particular system start at 500 and increment by one.


    ```

    dylan:x:500:500:User:/home/dylan:/bin/bash

    chris:x:501:501:User:/home/chris:/bin/bash

    ```


    > If you turn off shadow support, entries in your passwd file will display encrypted
    passwords. Because any user can read the /etc/passwd file, intruders can access
    and possibly crack the encrypted passwords.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# 40 Red Hat Linux Pocket Administrator


    Although it is technically possible to edit entries in the /etc/passwd file directly,
    it is not recommended. In particular, deleting an entry does not remove any other
    information, permissions, and data associated with a user, which opens a possible
    security breach whereby an intruder could take over the deleted user''s id or
    disk space.


    ![](img/7a707b469372cd18f2e2643bd573439a_52_0.png)


    # /etc/shadow and /etc/gshadow


    The /etc/passwd file is a simple text file, and is vulnerable to security breaches.
    If anyone gains access to the /etc/ password file, they might be able to decipher
    or crack the encrypted passwords through brute force crack. The shadow suite of
    applications implements a greater level of security. These include versions of
    useradd, groupadd, and their corresponding update and delete programs. Most other
    user configuration tools, including redhat-config-users, support shadow measures.
    With shadow security, passwords are no longer kept in the /etc/passwd file. Instead,
    passwords are kept in a separate file called /etc/shadow. Access is restricted
    to the root user.


    The following example shows the /etc/shadow entries for two users, listing their
    encrypted passwords. The entry for chris has an * in its Password field, indicating
    that a password has not yet been created for this user.


    ```

    dylan:YOTPdDpPyc:500:500:User:/home/dylan:/bin/bash

    chris*:501:501:User:/home/chris:/bin/bash

    ```


    A corresponding password file, /etc/gshadow, is also maintained for groups that
    require passwords. Red Hat supports passwords by default. You can manually specify
    whether you want to use shadow passwords with the Red Hat authentication tool.


    # Password Tools


    To change any particular field for a given user, you should use the user management
    tools provided, such as the passwd command, redhat-config-users, adduser, usermod,'
