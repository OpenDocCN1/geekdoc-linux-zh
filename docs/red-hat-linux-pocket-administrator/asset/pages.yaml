    # Mounting Hard Drive Partitions:

    Linux and Windows


    You can mount either Linux or Windows hard partitions with the mount command.
    However, it is much more practical to have them mounted automatically using the
    /etc/fstab file as described previously. The Linux hard disk partitions you created
    during installation are already automatically mounted for you. As noted previously,
    to mount a Linux hard disk partition, enter the mount command with the device
    name of the partition and the directory to which you want to mount it. IDE hard
    drives use the prefix hd, and SCSI hard drives use the prefix sd. The next example
    mounts the Linux hard disk partition on /dev/hda4 to the directory /mnt/mydata


    ```

    # mount -t ext3 /dev/hda4 /mnt/mydata

    ```


    You can mount a Windows partition and directly access the files on it. With a
    Linux partition, you use the mount command, but you also have to specify the file
    system type as Windows. For Windows XP, NT, and 2000, you would use ntfs (limited
    read-only access; write access is experimental and not recommended). In the next
    example, the user mounts the Windows hard disk partition /dev/hdal to the Linux
    file structure at directory /mnt/windows. The /mnt/windows directory is a common
    designation for Windows file systems, though you can mount it in any directory
    (such as /mnt/dos for MS-DOS). If you have several Windows partitions, you could
    create a Windows directory and then a subdirectory for each drive using the drive''s
    label or letter, such as /mnt/windows/a or /mnt/windows/mystuff. Be sure you have
    already created the directory before mounting the file system.


    ```

    # mount -t vfat /dev/hdal /mnt/windows

    ```'
