    Each time a user logs in, two profile scripts are executed, a system profile script
    that is the same for every user, and a user login profile script that can be customized
    to each user''s needs. When the user logs out, a user logout script is run. In
    addition, each time a shell is generated, including the login shell, a shell script
    is run. There are different kinds of scripts used for different shells. On Red
    Hat, the default shell commonly used is the bash shell. As an alternative, users
    could use different shells such as tcsh or the Z shell, both installed with Red
    Linux.


