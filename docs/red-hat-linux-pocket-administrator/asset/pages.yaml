    # Pluggable Authentication Modules


    Pluggable Authentication Modules (PAM) is an authentication service that lets
    a system determine the method of authentication to be performed for users. In
    a Linux system, authentication has traditionally been performed by looking up
    passwords. When a user logs in, the login process looks up their password in the
    password file. With PAM, users'' requests for authentication are directed to PAM,
    which in turn use a specified method to authenticate the user. This could be a
    simple password lookup or a request to an LDAP server, but it is PAM that provides
    authentication, not a direct password lookup by the user or application. In respect,
    authentication becomes centralized and controlled by a specific service, PAM.
    The actual authentication procedures are dynamically configured by the system
    administrator. Authentication is carried out by modules that can vary'
