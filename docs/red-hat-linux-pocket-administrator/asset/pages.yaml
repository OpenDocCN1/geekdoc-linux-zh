    kernel. For example, in your grub.conf, add a new entry, similar to the one for
    the old kernel, which references the new kernel in its image line. The grub.conf
    entry would look something like the following code. Select "Old Linux (2.4.20-8.old)"
    at the GRUB menu to launch the old kernel.'
