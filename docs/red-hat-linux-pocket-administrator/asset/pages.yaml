  md: '# # Chapter 5


    # ## File System Administration


    Files reside on physical storage devices such as hard drives, CD-ROMs, or floppy
    disks. The files on each storage device are organized into a file system. The
    storage devices on your Linux system are presented as a collection of file systems
    that you can manage. When you want to add a new storage device, you will need
    to format it as a file system, and then attach it to your Linux file structure.
    Hard drives can be divided into separate storage devices called partitions, each
    of which would have its own file system. You can perform administrative tasks
    on your file systems, such as backing up, attaching or detaching them from your
    file structure, formatting new devices or erasing ones, and checking a file system
    for problems.


    To access files on a device, you attach its file system to a specified directory.
    For example, to access files on a floppy disk, you first mount its file system
    to a particular directory. With Linux, you can mount a number of different types
    of file systems. You can even access a Windows hard drive partition or tape drive,
    as well as file systems on a remote server. Red Hat also configures CD-ROM and
    floppy media to be mounted automatically with Gnome or KDE.


    Recently developed file systems for Linux now support journaling, which allows
    your system to recover from a crash or interruption easily. The ext3, ReiserFS,
    and JFS file systems maintain a record of file and directory changes, a journal,
    which can be used to recover files and directories in use when a system suddenly
    crashes due to unforeseen events such as power interruptions. Most distributions
    currently use the ext3 file system as their default, though you also have the
    option of using ReiserFS or JFS, an independently developed journaling system.'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# 130 Red Hat Linux Pocket Administrator


    Your Linux system is capable of handling any number of storage devices that may
    be connected to it. You can configure your system to access multiple hard drives,
    partitions on a hard drive, CD-ROM disks, floppy disks, and even tapes. You can
    elect to attach these storage components manually or have them automatically mount
    when you boot. Automatic mounts are handled by configuring the /etc/fstab file.
    For example, the main partitions holding your Linux system programs are automatically
    mounted whenever you boot, whereas a floppy disk can be manually mounted when
    you put one in your floppy drive, though even these can also be automatically
    mounted.


    # File Systems


    Although all the files in your Linux system are connected into one overall directory
    tree, parts of that tree may reside on different storage devices or CD-ROMs. Files
    on a particular storage device are organized into what is referred to as a file
    system. A file system is a formatted device, with its own tree of directories
    and files. Your Linux directory tree may encompass several file systems, each
    on different devices. On a hard drive with several partitions, you would have
    a file system for each partition. The files themselves are organized into one
    seamless tree of directories, beginning with the root directory. For example,
    if you attach a CD-ROM to your system, a pathname will lead directly from your
    hard disk partition''s file system to the files in the CD-ROM file system.


    A file system has itself organized into its own directory tree. You can think
    of this as a subtree that must be attached to the main directory tree. The tree
    will remain separate from your system''s directory tree until you specifically
    connect it. For example, a floppy disk with Linux files has its own tree of directories.
    You need to attach this subtree to the main tree on your hard drive partition.
    Until'
  merge: -1
  pgno: 142
