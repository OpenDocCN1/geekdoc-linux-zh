  md: '# About the Authors


    Richard Petersen teaches UNIX and C/C++ courses at the University of California
    at Berkeley. He is the author of four editions of Linux: The Complete Reference
    and many other books.


    Ibrahim Haddad is a Researcher at the Ericsson Corporate Research division''s
    Open System Lab, located in Montreal, Canada. Architecture of third generation
    wireless IP networks and guiding Ericsson Source contributions, which promote
    and advance the use of Linux in the area of telecommunication.


    Mr. Haddad represents Ericsson on the Technical Board of the Open Source Development
    Lab and serves as Contributing Editor to the Linux Journal. In addition to his
    contributions to the Linux Journal, Mr. Haddad writes for Linux User & Developer
    in the areas of IPv6 and telecommunications and has delivered a number of presentations
    and tutorials at local universities, IEEE and and ACM conferences, Open Source
    forums, and international conferences.


    Mr. Haddad received his Bachelor and Master degrees in Computer Science from the
