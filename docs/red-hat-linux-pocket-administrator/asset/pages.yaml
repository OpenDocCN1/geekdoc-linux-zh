    The lpr client submits a job, lpd then takes it in turn and places it on the appropriate
    print queue. lpr takes as its argument the name of a file. If no printer is specified,
    then the default printer is used. The -P option enables you to specify a particular
    printer. In the next example, the user first prints the file preface, then prints
    the file report to the printer with the name myfile:


    ```

    $ lpr preface

    $ lpr -P mypson report

    ```'
