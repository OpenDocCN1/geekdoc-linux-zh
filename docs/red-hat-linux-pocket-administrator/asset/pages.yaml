    # # syslogd and syslog.conf


    The syslogd daemon manages all the logs on your system, as well as coordinating
    with any of the logging operations of other systems on your network. Configuration
    information for syslogd is held in the /etc/syslog.conf file, which contains the
    names and locations for your system log files. Here you find entries for /var/log/messages
    and /var/log/maillog, among others. Whenever you make changes to the syslog.conf
    file, you need to restart the syslogd daemon using the following command (or use
    redhat-config-services, Server Settings | Services):


    ```

    service syslog restart

    ```'
