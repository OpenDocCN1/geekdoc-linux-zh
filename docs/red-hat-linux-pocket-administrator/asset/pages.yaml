  md: '# Windows Partitions


    You can mount either MS-DOS, Windows 95/98/ME, or Windows XP, NT, and 2000 partitions
    used by your Windows operating system onto your Linux file structure, just as
    you would mount any Linux file system. You only have to specify the file type
    of vfat for Windows 95/98/ME, and mdos for MS-DOS. Windows XP, NT, and 2000 use
    the ntfs file system. You may find it convenient to have your Windows partitions
    automatically mounted when you start up your Linux System. To do this, you need
    to put an entry for your Windows partitions in /etc/fstab file and give it the
    defaults option, or be sure to include an auto option. You make an entry for each
    Windows partition you want to mount, and then specify the device name for which
    you want to mount it. the /mnt/windows directory has already been created in /mnt.
    For a Windows 95/98/ME partition, use the vfat file system type. The next example
    shows a standard Windows partition entry for an /etc/fstab file. Notice the last
    entry in the /etc/fstab file example is an entry for mounting a Windows partition.


    ```

    /dev/hda1 /mnt/windows vfat defaults 0 0

    ```


    > TIP Linux kernel 2.4 systems currently can only reliably mount ntfs file systems
    (Windows NT, Windows 2000, and Windows XP) as read-only. They cannot write to
    these partitions, though experimental and unstable support is provided by the
    2.5 development kernel and may be incorporated into the 2.6 kernels.


