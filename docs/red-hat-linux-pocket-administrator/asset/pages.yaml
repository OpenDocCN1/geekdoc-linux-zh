    # Installing and Managing Terminals and Modems


    In Linux, several users may be logged in at the same time. Each user needs his
    or her terminal through which to access the Linux system, of course. The monitor
    on your PC acts as a special terminal, called the console, or you can add other
    terminals through the serial ports on your PC or a special multiport card installed
    on your PC. The other terminals can be standalone terminals or PCs using terminal
    emulation programs. For a detailed explanation of terminal installation, see the
    Term-HOWTO file in /usr/share/doc/HOWTO (installed as part of Red Hat documentation
    CD-ROM) or at the Linux Documentation Project site (www.tldp.org). A brief explanation
    is provided here.'
