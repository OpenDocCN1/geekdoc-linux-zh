  md: '# # Chapter 9


    # ## Kernel Administration


    The **kernel** is the operating system, performing core tasks such as managing
    memory and disk access, as well as interfacing with the hardware that makes up
    your system. For example, the kernel makes possible such standard Linux features
    as multitasking and multiuser support. It also handles communications with devices
    like your CD-ROM or hard disk. Users send requests for access to these devices
    through the kernel, which then handles the lower-level task of actually sending
    instructions to a device. Given the great variety of devices available, the kind
    of devices connected to a Linux system will vary. Kuzdu detects these devices
    automatically at boot time, and the kernel is appropriately configured when Linux
    is installed. However, if you add a new device, you may have to enable support
    it in the kernel. This involves creating a modified version of the kernel, which
    is often referred to as *building* or *compiling the kernel*. In addition, new
    versions of the kernel are continuously made available that provide improved support
    for your devices, as well as a smoother running system. You can download and install
    these new versions over your system.


    | Kernel Versions |


    The version number for a Linux kernel consists of three segments: the *major*,
    *minor*, and revision numbers. The *major number* increments with major changes
    in the kernel. The *minor number* indicates stability. Even numbers are used for
    stable releases, whereas odd numbers are reserved for development releases, which
    may be unstable. New features first appear in development versions. If you''re
    concerned about stability, you should wait for the stable version. The *revision
    number* refers to the corrected versions. As bugs are discovered and corrected,
    new'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# 230 Red Hat Linux Pocket Administrator


    revisions of a kernel are released. A development kernel may have numerous revisions.
    For example, kernel 2.4.20 has a major number of 2 and a minor number of 4, with
    a revision number of 20. Distributions often add another number that refers to
    a specific set of patches applied to the kernel. For example, for Red Hat 9, the
    kernel 2.4.20-8, where 8 is the patch number. On distributions that support RPM
    packages, you can use an RPM query to learn what version is installed, as shown
    here:


    ```

    rpm -q kernel

    ```


    You could have more than one version of the kernel installed on your system. To
    see which one is running currently, you use the uname -r option.


    ```

    uname -r

    ```


    New kernels are released on two different tracks, a stable track and a development
    track. Stable kernels have an even revision number, whereas development kernels
    use an odd number. The stable kernel would be 2.4, and its development kernels
    often include support for the most recent hardware and software features. However,
    unless you are experimenting with development, you should always install a stable
    version of the kernel.


    The Linux kernel is being worked on constantly, and new versions are released
    when they are ready. Distributions may include the most up-to-date stable kernel
    in its releases. Linux kernels are kept at kernel.org. Also, RPM packages for
    a new kernel are often available at distribution update sites. You may need to
    upgrade your kernel to provide support for hardware or features not supported
    by your distribution''s version. For example, you may need support for a new device
    not provided in your distribution''s version of the kernel. Certain features may
    not be included in a distribution''s version because they are considered experimental
    or a security risk.'
  merge: -1
