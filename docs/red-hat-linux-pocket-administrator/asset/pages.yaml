- img_proc: true
  md: '# crontab Command


    You use the crontab command to install the entries into a crontab file. To do
    this, first create a text file and type your crontab entries. Save this file with
    any name you want, such as mycronfile. Then, to install these entries, enter `crontab`
    and the the name of the text file. The crontab command takes the contents of the
    text file and creates a crontab file in the /var/spool/cron directory, adding
    the name of the user who installs the command. In the following example, the root
    user installs the contents of the mycronfile and creates a file called /var/spool/cron/root.
    If a user justin installed a crontab file, it would create a file called /var/spool/cron/justin.
    You can control use of the crontab command by regular users with the /etc/cron.allow
    file. If users with names in this file can create crontab files of their own.
    Conversely, the /etc/cron.deny file lists those users denied use of the cron tool,
    preventing them from scheduling tasks. If neither exists, access is denied to
    all users. If a user is not in the /etc/cron.allow file, access is denied. However,
    if the /etc/cron.deny file does not exist, then all users not listed in /etc/cron.deny
    are automatically allowed access.


    ```

    # crontab mycronfile

    ```


    # cron Editing


    Never try to edit your crontab file directly. Instead, use the crontab command
    with the -e option. This opens your crontab file in the /var/spool/cron directory
    with the standard text editor, such as vi. crontab uses the default editor specified
    as the EDITOR shell variable. To use a different editor for crontab, change the
    default editor by assigning the editor''s program name to EDITOR variable. Normally,
    the editor variable is set in the /etc/profile script. Running crontab with the
    -l option displays the contents of your crontab file, and the -r option deletes
    the entire file. Invoking crontab with another text file of crontab entries overwrites
    your current crontab file, replacing it with the contents of the text file.'
  merge: -1
