    # System Logs: /var/log and syslog


    Various system logs for tasks performed on your system are stored in the /var/log
    directory. Here, you can find logs for mail, news, and all other system operations,
    such as web server logs. The /var/log/messages file is a log of all system tasks
    not covered by other logs. This usually includes startup tasks, such as loading
    drivers and mounting file systems. If a driver for a card failed to load at startup,
    you find an error message for it. Logins are also logged in this file, showing
    who attempted to log in what account. The /var/log/mailog file logs mail message
    transmissions and news transfers.


