  md: '# mount Command


    The mount command takes two arguments: the storage device through which Linux
    accesses the file system, and the directory in the file structure to which the
    new file system is attached. The mountpoint is the directory on your main directory
    tree where you want the files on the storage device attached. The device is a
    special device that connects your system to the hardware device. The syntax for
    the mount command is as follows:


    ```

    # mount device mountpoint

    ```


    As noted in Chapter 4, devices are located in the /dev directories and usually
    have abbreviated ending with the number of the device. For example, fd0 may refer
    to the first floppy drive attached to your system. The following examples usually
    mount a floppy disk in the first floppy drive device (fd0) to the mydir mnt/floppy
    directory. The mountpoint directory needs to be empty. If you already have a file
    system mounted there, those will be bypassed, giving you a message that another
    file system is already mounted there and that mount a file system to a directory
    that already has files and subdirectories in it. Unmounting the file system, of
    course, restores access to the original directory files.


    ```

    # mount /dev/fd0 /mnt/floppy

    ```


    For any partition in the /etc/fstab file, you can mount the partition using only
    the mount device specified in its fstab entry; you needn''t enter the device filename.
    The mount command looks up the entry for the partition in the fstab file using
    the directory to identify the entry and, in that way, find the device name. For
    example, to unmount the /dev/hda1 partition in the previous example, the mount
    command only needs to know the directory it is mounted to—in this case, /mnt/windows.


    ```

    # mount /mnt/windows

    ```'
