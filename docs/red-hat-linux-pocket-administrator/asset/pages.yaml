    # Anacron


    As an alternative to cron, you can use anacron, which activates only when scheduled
    tasks need to be executed. anacron jobs are entered in the /etc/anacontab file.
    For each scheduled task, you specify the number of intervening days when it is
    executed (7 is weekly, 30 is monthly), the time of day it is run (numbered in
    minutes), a description of the task, and the command to be executed. For backups,
