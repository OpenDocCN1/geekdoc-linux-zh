    # File System Information


    The file system on each storage device are formatted to take up a specified amount
    of space. For example, you may have formatted your hard drive partition to take
    up 3GB. Files installed or created on that file system take up part of the space,
    while the remainder is available for new files and directories. To find out how
    much space you have free on a file system, you can use the `df` command or, on
    Gnome, you can use either the Procman System Monitor or the KDE DiskFree utility
    (Extra System Tools menu), For the Procman System Monitor (System Tools menu),
    click the System Monitor tab to display a graph of the space on your file system.
    KDE DiskFree displays a list of devices showing how much space is free on each
    partition, and the percentage usage.


    # df


    The `df` command reports file system disk space usage. It lists all your file
    systems by their device names, how much disk space they take up, as well as where
    they are mounted, and the percentage of the disk space used. With the -h option,
    it displays information in a more readable format, such as measuring disk in megabytes
    instead of memory blocks. The `df` command is also a safe way to obtain a list
    of all your partitions, instead of using `fdisk` (with `fdisk`, you could erase
    partitions). `df` only shows mounted partitions, however, whereas `fdisk` shows
    all partitions.


    ```

    $ df

