    and one for the graphical login (/etc/pam.d/gdm) and one for accessing your Samba
    server (/etc/pam.d/samba). A default PAM configuration file, called /etc/pam.d/other,
    is invoked if no services file is present. On Red Hat, the system-auth file contains
    standard authentication modules for system services generated by authconfig-gtk
    and invoked by one of the other configuration files. In addition, Red Hat sets
    up an authentication for its configuration tools, such as redhat-config-services
    and redhat-config-network.


