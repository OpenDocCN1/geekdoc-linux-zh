    # /etc/sysconfig


    On Red Hat systems, configuration and startup information is also kept in the
    /etc/sysconfig directory. Here you will find files containing definitions of system
    variables used to configure devices such as your keyboard and mouse. These entries
    were defined for you when you configured your devices during installation. You
    will also find network definitions as well as scripts for starting and stopping
    your network connections.


    A sample of the keyboard file

    etc/sysconfig/keyboard is shown here:


    ```

    KEYBOARDTYPE="pc"

    KEYTABLE="us"

    ```


    Several of these files are generated by Red Hat administration tools such as redhat-config-mouse,
    redhat-config-keyboard, or redhat-config-network. Table 1-8 lists several commonly
    used tools for the mouse and sysconfig files they control. For example, redhat-config-mouse
    generates variables for the device name, type, and certain features, placing them
    in the /etc/sysconfig/mouse file, as shown here:


    ```

    FULLNAME="Generic - 3 Button Mouse (PS/2)"

    MOUSETYPE="PS/2"

    XMOUSESETYPE="PS/2"

    XEMU3="no"

    DEVICE=/dev/mouse

    ```


    Other files, like hwconf, list all your hardware devices, defining configuration
    variables such as its class (video, CD-ROM, hard drive), the bus it uses (PCI,
    IDE), its device name (such as hdd or st0), the drivers it uses, and a description
    of the device. A CD-ROM entry is shown here:


    ```

    class: CDROM

    bus: IDE

    detached: 0

    device: hdd

    driver: ignore

    desc: "TOSHIBA DVD-ROM-M1402"

