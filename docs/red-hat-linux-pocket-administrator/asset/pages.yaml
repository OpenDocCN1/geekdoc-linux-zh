  md: '# 238 Red Hat Linux Pocket Administrator


    # Precautionary Steps for Modifying a Kernel of the Same Version


    If you want to modify your kernel configuration, and build a new one, you should
    retain a copy of your current kernel. In case something goes wrong with your modified
    version, you can always boot from the copy you kept. You do not have to worry
    about this happening if you are installing a new version of the kernel. New kernels
    are given different names, so the older one is not overwritten.


    To retain a copy of your current kernel, you can make a backup copy of it, letting
    the original be overwritten. An installed version of a kernel makes use of several
    files in the /boot directory. Each file ends with kernel version number. These
    include the vmlinuz file, along with the actual kernel image file, System.map,
    config, and module-info. System.map contains kernel symbols needed by modules
    to start kernel functions. For example, the kernel image file is called vmlinuz-version
    is the version number attached, as in vmlinuz-2.4.20-8. System.map for this kernel
    called System.map-2.4.20-8. Here are the kernel files for version 2.4.20-8:


    +   /boot/vmlinuz-2.4.20-8

    /boot/System.map-2.4.20-8

    /boot/module-info-2.4.20-8

    /boot/config-2.4.20-8


    The vmlinuz, System.map, and module-info files for a particular kernel also have
    symbolic links using those names without the version number. For example, vmlinuz
    is a link to the current kernel image file, in this case, vmlinuz-2.4.20-8, and
    System.map is a link to the current System.map file, System.map-2.4.20-8. When
    you install a new kernel, the links are changed to that kernel. So if you installed
    a new version, such as 2.4.21-10, the /boot/vmlinuz would link to that kernel''s
    vmlinuz file, /boot/vmlinuz-2.4.21-10.'
