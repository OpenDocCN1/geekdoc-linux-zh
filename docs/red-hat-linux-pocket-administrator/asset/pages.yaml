  md: '# Scheduling Tasks: cron


    Scheduling regular maintenance tasks, such as backups, is managed by the cron
    service on Linux, implemented by a cron daemon. A daemon is a continually running
    server that constantly checks for certain actions to take. These tasks are listed
    in the crontab file. The cron daemon constantly checks the user''s crontab file
    to see if it is time to take these actions. Any user can set up a crontab file
    to take system administrative actions, such as backing up files at a certain time
    each week or month.


    > **TIP** For a system that may normally be shut down during times that cron is
    likely to run, you may want to supplement cron with anachron. For example, if
    a system is shut down on a weekend when cron jobs are scheduled, the jobs will
    not be performed. anachron, however, checks to what needs to be performed when
    the system is turned on again, and then runs them. It is designed only for jobs
    that run daily or weekly. For anachron jobs, you place crontab entries in the
    /etc/anacrontab file.


    # The cron Service


    The name of the cron daemon is crond. Normally, it is started automatically when
    your system starts up. You can set this feature using redhat-config-services or
    chkconfig, as described in Chapter 10. The following example starts the crond
    service automatically whenever you boot your system:


    ```

    chkconfig on

    ```


    You can also start and stop the crond service manually, which you may want to
    do for emergency maintenance or during upgrades. Use the service command and the
    stop option to shut down the service, and the start option to run it again:


    ```

    service crond stop

    ```'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# crontab Entries


    A crontab entry has six fields: the first five are used to specify the time for
    an action, while the last field is the action itself. The first field specifies
    minutes (0–59), the second field specifies the hour (0–23), the third field specifies
    the day of the month (1–31), the fourth field specifies the month of the year
    (1–12, or month prefixes like Jan and Sep), and the fifth field specifies the
    day of the week (0–6, or day prefixes like Wed and Fri, starting with 0 as Sunday).
    In each of the fields, you can specify a range, a set of values, or the asterisk
    to indicate all values. For example, 1–5 for the day-of-week field specifies Monday
    through Friday. In the hour field, 8, 12, 17 would specify 8 A.M., 12 noon, and
    5 P.M. An * in the month-of-year field indicates every month. The format of a
    crontab entry follows:


    ```

    minute hour day-month month day(s)-week task

    ```


    The following example backs up the projects directory at 2:00 A.M. every weekly:


    ```

    0 2 * * 1-5 tar cf /home/backup /home/projects

    ```


    The same entry is listed again using prefixes for the month and weekday:


    ```

    0 2 * * Mon-Fri tar cf /home/backup /home/projects

    ```


    To specify particular months, days, weeks, or hours, you can list them individually,
    separated by commas. For example, to perform the previous task on Sunday, Wednesday,
    and Friday, you could use 0,3,5 in the day-of-week field, or their prefix equivalents,
    Sun, Wed, Fri.


    ```

    0 2 * * 0,3,5 tar cf /home/backup /home/projects

    ```


    Cron also supports comments. A comment is any line beginning with a # sign.'
  merge: -1
  pgno: 20
