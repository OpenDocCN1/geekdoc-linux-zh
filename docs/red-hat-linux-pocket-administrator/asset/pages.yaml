    ```


    Be sure you have a floppy disk in the floppy drive. The make bz command copies
    the image directly to the floppy disk. Be sure that you have to create and install
    your modules. Be sure that the bzImage is small enough to fit on a floppy disk.
    If not, you will have to reconfigure your kernel, compiling as many features as
    possible as modules instead of part of the kernel.


    ```

    make clean

    make bzImage

    make bzdisk

    make modules

    make modules_install

    ```


    > TIP If you are experimenting with your kernel configurations, it may be safer
    to put a new kernel on a boot disk or boot CD-ROM, rather than installing it on
    your system. If something goes wrong, you can always boot up normally with your
    original kernel still on your system (though you can always configure your boot
    loader to access previous versions).


    # Boot Loader Configurations


    If you are using a boot loader such as GRUB or LILO, you can configure your system
    to start any of your installed kernels. As seen in the “Precautionary Steps for
    Modifying Kernels” section, you can create an added entry in the boot loader configuration
    file for your old kernel. As you install new kernel versions, you could simply
    add more entries, enabling you to use any of the previous kernels. Whenever you
    boot, your boot loader will then present you with a list of kernels to choose
    from.'
