    ```


    You can now create the logical volumes in each volume group, using the lvcreate
    command.


    ```

    lvcreate -n var -l 2000M turtle

    lvcreate -n home -l 50000M rabbit

    lvcreate -n projects -l 20000M rabbit

    ```


    Then, you can activate the logical volumes. Reboot and use vgchange with the -a
    y option to activate the logical volumes.


    ```

    vgchange -a y turtle rabbit

    ```


    You may now make file systems for each logical volume.


    ```

    mkfs.ext3 var

    mkfs.ext3 home

    mkfs.ext3 projects

    ```


    Then, you can mount the logical volumes.


    ```

    mount var /var

    mount home /home

    mount projects /mnt/myprojects

    ```'
