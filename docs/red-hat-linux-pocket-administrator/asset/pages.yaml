    # System set the Time and Date


    You can set the system time and date, using the shell `date` command or the Red
    Hat GUI redhat-config-date. You properly set the time and date when you first
    installed your system. You should not need to do so again. If you entered the
    time incorrectly or moved to a different time zone, though, you could use this
    utility to change your time.


    # Using the redhat-config-date Utility


    The preferred way to set the system time and date is to use the Red Hat Date and
    Time Properties utility (redhat-config-date). Select it on the System Settings
    window accessible from the Start Here window. There are two panels, for the date
    and time and one for the time zone (see Figure 1-1). Use the calendar to select
    the date, month, and date. Then, use the Time Box to set the hour, minute, and
    second. The Time Zone panel shows a map with locations. Select the one nearest
    to set your time zone.


    Red Hat also supports the Network Time Protocol (NTP), which allows a remote server
    to set the date and time. NTP allows for the most accurate synchronization of
    your system''s clock. It is often used to manage the time and date for networked
    systems, freeing the administrator from having to synchronize clocks manually.
    The date and time panel is obtained from an NTP server. Your network may have
    its own, or you can use one of the public NTP servers listed at www.ntp.org. You
    can also download current documentation and NTP software from the www.ntp.org
    site.'
