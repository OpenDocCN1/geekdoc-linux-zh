    # The mkraid Command


    Once you have configured your RAID devices in the /etc/raidtab file, then you
    use the mkraid command to create your RAID devices. mkraid takes its argument
    as the name of the RAID device, such as /dev/md0 for the first RAID device. It
    locates the entry for that device in the /etc/raidtab file and uses configuration
    information to create the RAID devices, initializing the partitions and creating
    the RAID array RAID file system on that device. You can specify an alternative
    configuration file with the -c option, if you wish. mkraid operates as a kind
    of mkfs command for RAID devices, initializing the partitions and creating the
    RAID array file system. Any data on the partitions making up the RAID array will
    be erased.


    ```

    mkraid /dev/md0

    ```


    # The raidstart Command


    Once you have created RAID devices, you can then activate them with the raidstart
    command. raidstart makes your RAID file system accessible. raidstart takes as
    its argument the name of the RAID device you want to start. The -a option activates
    all RAID devices.


    ```

    raidstart /dev/md0

    ```'
