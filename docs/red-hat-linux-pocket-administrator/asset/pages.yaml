    to the Windows printer. `lpr` invokes the Samba client smclient to send the print
    job to the Windows printer.


    # Managing Printers with CUPS


    The Common Unix Printing System (CUPS) is an alternative for LPRng that providing
    services. It is freely available under the GNU Public License. Though it is now
    included with most distributions, you can also download the most recent source-code
    version of CUPS from www.cups.org. The site also provides detailed documentation
    on installing and managing printers. Whereas LPRng is derived from the old Berkeley
    line printer daemon (LPD), CUPS is based on the newer Internet Printing Protocol
    (IPP). The Internet Printing Protocol is designed to establish a printing standard
    for the Internet (for more information, see www.pwg.org/ipp). Whereas'
