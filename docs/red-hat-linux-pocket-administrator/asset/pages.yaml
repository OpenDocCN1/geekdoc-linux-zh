    | /etc/group | Holds the group to which the user belongs. |

    | /etc/shadow | Encrypted password file. |

    | /etc/gshadow | Encrypted password file for groups. |

    | /etc/login.defs | Default login definitions for users.


    **Table 2-1.** Paths for User Configuration Files


    > > TIP You can find out which users are currently logged in with the w or who
    command. The command displays detailed information about each connected user,
    such as from where they logged in and how long they have been inactive, and the
    date and time of login. The who command provides less detailed data.


    # The Password Files


    A user gains access to an account by providing a correct login and password. The
    system maintains passwords in password files, along with login information like
    the user name and id. Tools the passwd command let change their passwords by modifying
    these files. /etc/passwd is the file that traditionally held user passwords, though
    in encrypted form. However, all users are allowed to read the /etc/passwd file,
    which would have allowed access by users to the encrypted passwords. For better
    security, password entries are kept in the /etc/shadow file, which is restricted
    to the root user.'
