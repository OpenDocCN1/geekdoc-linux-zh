    # RPM Tools


    To install and uninstall RPM packages, you can use the `rpm` command directly
    from a shell prompt, or the Red Hat distribution management tool, redhat-config-packages.
    The redhat-config-packages tool is a GUI front end for the `rpm` command. Although
    you should download RPM packages for your particular distribution, numerous RPM
    software packages are designed to run on any Linux system. You can learn more
    about RPM at its web site at www.rpm.org. The site contains up-to-date versions
    for RPM, documentation, and RPM support programs, such as `rpm2html` and `rpm2cpio`.
    `rpm2html` takes a directory containing RPM packages and generates web pages listing
    those packages as links that can be used to download them. `rpm2cpio` is a Perl
    script to extract RPMs. Also, the Red Hat Customization Guide provides an excellent
    tutorial for both RPM and redhat-config-packages.


    # RPM Packages


    The naming conventions for RPM packages vary from one distribution to another.
    On Red Hat, the package name includes the package version along with its platform
    (i386 for Intel PCs) and `.rpm` extension. An example of the emacs editor''s RPM
    package for Intel systems is here:


    emacs-21.2-18.i386.rpm


    The RPM packages on your DVD-ROM or distribution CD-ROM only represent a small
    portion of the software packages available for Linux. An extensive repository
    for RPM packages is also located at rpmfind.net. Packages here are indexed according
    to distribution, group, and name. It includes packages for every distribution,
    including Red Hat.


    > **TIP** RPM packages with the term noarch are used for architecture-independent
    packages. This means they are designed to install on any Linux system. Packages
    without noarch may be distribution- or architecture-dependent, designed to install
    on a particular type of machine.'
