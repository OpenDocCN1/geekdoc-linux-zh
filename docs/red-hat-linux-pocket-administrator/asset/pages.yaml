    # Program Directories


    Directories with "bin" in the name are used to hold user programs. The /bin directory
    holds basic user programs, such as login, shells (bash, tsch, and zsh), and file
    commands (cp, mv, rm, ln, and so). The /sbin directory holds specialized system
    programs for such tasks as file system management (fsck, disk, mkfs) and system
    operations like shutdown and startup (init). The /usr/bin directory holds programs
    designed for user tasks. The /usr/sbin directory holds user-related system operations,
    such as usadd to add new users. The /lib holds all the libraries your system makes
    of, including the main Linux library, libc, and subdirectories as modules, which
    holds all the current kernel modules.


    Configuration Directories and Files


    When you configure different elements of your system, like users, applications,
    servers, or network connections, you make use of configuration files kept in certain
    system directories. On Red Hat, configuration files are placed in the /etc directory,
    with more specific device and service configurations located in the /etc/sysconfig
    directory.


    # Configuration Files: /etc


    The /etc directory holds your system, network, and application configuration files.
    Here, you can find the fstab file listing your file systems, the hosts file with
    IP addresses for hosts on your system, and grub.conf for the boot systems supported
    by the GRUB boot loader. This directory includes various subdirectories, such
    as /apache for the Apache web server configuration files'
