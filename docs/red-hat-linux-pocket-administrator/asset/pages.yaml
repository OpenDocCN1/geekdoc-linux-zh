    on the anacron service or have it start up at boot time.


    # Amanda


    To back up hosts connected to a network, you can use the Advanced Maryland Automatic
    Disk Archiver (Amanda) to archive hosts. Amanda uses tar tools to back up all
    hosts to a single host operating as a backup server. Backup data is sent by each
    host to the host operating as the Amanda server, where they are written out to
    a backup media such as Tape. With an Amanda server, the backup operations for
    all hosts becomes centralized in one server, instead of each host having to perform
    their own backup. Any host that needs to restore the data simply requests it from
    the Amanda server, specifying the file system, date, and file names. Amanda has
    its own commands corresponding to the common backup tasks, beginning with “am,”
    such as amdump, amrestore, and amrecover. Configuration files are placed in /etc/amanda
    and log, and database files in /var/adm/amanda.


