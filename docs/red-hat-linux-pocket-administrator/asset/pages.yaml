    # # The depmod Command


    Instead of manually trying to determine what modules a given module depends on,
    use the `depmod` command to detect the dependencies for you. The `depmod` command
    generates a file that lists all the modules on a given module depends. The `depmod`
    command generates a hierarchical listing, noting what modules should be loaded
    first and in order. Then, to load the module, you use the `modprobe` command using
