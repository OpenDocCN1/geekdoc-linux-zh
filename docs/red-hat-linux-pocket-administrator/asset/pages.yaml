  md: '# Kernel Administration 253


    a new entry, be sure to execute the lilo command to update LILO. Whenever you
    install the kernel on Red Hat using the RPM kernel package, the /boot/vmlinuz
    link is automatically changed to the new kernel. You can still create another
    LILO entry for your older kernel. In the next example, the lilo.conf file contains
    entries for two Linux kernels, one using the standard /boot/vmlinuz link, as well
    as windows.


    ```

    boot = /dev/hda

    install = /boot/boot.b

    message = /boot/message

    timeout = 200

    default = linux

    image = /boot/vmlinuz

    label = linux

    root = /dev/hda3

    read-only

    image = /boot/vmlinuz-2.2.16

    label = linux-2.2

    root = /dev/hda3

    read-only

    other = /dev/hda1

    label = win

    table = /dev/hda

    ```


    If your system uses certain block devices unsupported by the kernel, like some
    SCSI, RAID, or IDE devices, you will need to load certain modules when you boot.
    Such block device modules are kept on a RAM disk that is accessed when your system
    first starts up (RAM disks are also used for diskless systems). For example, if
    you have a SCSI hard drive or CD-ROMs, the SCSI drivers for them are often held
    in modules that are loaded whenever you start your system. These modules are stored
    in a RAM disk from which the startup process reads. If you create a new kernel
    that needs to load modules to start up, you must create a new RAM disk for those
    modules. You only need'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# 254 Red Hat Linux Pocket Administrator


    to create a new RAM disk if your kernel has to load modules at startup. If, for
    example, you use a SCSI hard drive, but you incorporated SCSI hard drive and CD-ROM
    support (including support for the specific model) directly into your kernel,
    you don''t need to set up a RAM disk (support for most IDE hard drives and CD-ROMs
    is already incorporated into the kernel).


    If you need to create a RAM disk, you can use the mkinitrd command to create a
    RAM disk image file. The mkinitrd command incorporates all the IDE, SCSI, and
    RAID modules that your system uses, including those listed in your /etc/modules.conf
    file. See the man pages for mkinitrd and RAM disk documentation for more details.
    mkinitrd takes as its arguments the name of the RAM disk image file and the kernel
    that the modules are taken from. In the following example, a RAM disk image called
    initrd-2.4.20-8.img is created in the /boot directory, using modules from the
    2.4.20-8 kernel. The 2.4.20-8 kernel must already be installed on your system
    and its modules created.


    ```

    # mkinitrd /boot/initrd-2.4.20-8.img 2.4.20-8

    ```


    ```

    mkinitrd --preload=raid5 raid-ramdisk 2.4.20-8

    ```


    In the grub.conf segment, place an initrd entry specifying the new RAM disk:


    ```

    initrd /boot/initrd-2.4.20-8.img

    ```'
