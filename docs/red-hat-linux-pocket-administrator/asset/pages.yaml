  md: '# 194 Red Hat Linux Pocket Administrator


    # Serial Ports


    The serial ports on your PC are referred to as COM1, COM2, COM3, and COM4. These
    serial ports correspond to the terminal devices /dev/ttyS0 through /dev/ttyS3.
    Note that several of these serial devices may already be used for other input
    devices such as your mouse, and for communications devices such as your modem.
    If you have a serial printer, one of these serial devices is already used for
    that. If you installed a multipart card, you have many more ports from which to
    choose. For each terminal you add, you must create a character device on your
    Linux system. With printers, use the mknod command to create terminal devices.
    The permissions for a terminal device are 660. Terminal devices are character
    devices with a major number of 4 and minors usually beginning at 64.


    > TIP The /dev/pts entry in the /etc/fstab file mount devpts file system at /dev/pts
    for Unix98 Psudo-TTYs. These pseudo terminals are identified by names by number.


    # mingety, mgetty, and agetty


    Terminal devices are managed by your system getty program and a set of configuration
    files. When your system starts, it reads a list of connected terminals in the
    initab file and executes an appropriate getty program for each one, either mingety,
    mgetty, or agetty. Such getty programs set up the communication between your Linux
    system and a specified terminal. mingety provides minimal support for virtual
    consoles, whereas agetty provides enhanced support for terminal connections. agetty
    also includes parameters for the baud rate and timeout. mgetty is designed for
    fax/modem connections, mgetty configuration files are held in the /etc/mgetty+sendfax
    directory. Modem information is found in the /etc/mgetty+sendfax/mgetty.config
    file. All getty programs can read an initial message placed in the /etc/issue
    file, which can contain special codes to provide the system name and current date
    and time.'
