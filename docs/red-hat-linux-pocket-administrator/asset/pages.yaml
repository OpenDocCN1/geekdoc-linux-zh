  md: '# # Chapter 1


    # ## System Administration


    Linux is designed to serve many users at the same time, and to provide an interface
    between the users and the computer with its storage media, such as hard disks
    and tapes. Users have their own shells through which they interact with the operating
    system, but you may need to configure the operating system itself in different
    ways. You may need to add new users, devices like printers and scanners, Such
    operations come under the heading of system administration. The person who performs
    such actions is referred to as either a system administrator or a superuser. In
    this sense, there are two types of interaction with Linux: regular users'' interaction,
    and the superuser, who performs system administration tasks. The chapters in this
    book cover operations such as changing system runlevels, managing users, printers,
    adding file systems, and compiling the kernel. You must perform of these tasks
    only rarely, such as adding a new printer or monitoring a file system. Other tasks,
    such as adding or removing users, you perform on a regular basis. Basic system
    administration covers topics as system access by superusers, selecting the run
    level to start, system configuration files, and performance monitoring.


    # ### Superuser Control: the root user


    To perform system administration operations, you must first have access rights
    such as the correct password enables you to log in as the root user, making you
    the superuser. Because a superuser has the power to change almost anything on
    the system, such a password is usually a carefully guarded secret, changed very
    frequently, and given only to those whose job is to manage the system. With the
    correct password, you can log in to the system as'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# 2 Red Hat Linux Pocket Administrator


    a system administrator and configure the system in different ways. You can start
    up and shut down the system, as well as change to a different operating mode,
    such as a single-user mode. You can also add or remove users, add or remove file
    systems, back up and restore files, and even designate the system''s name and
    address.


    To become a superuser, you log in to the root user account. This is a special
    account reserved for system management operations with unrestricted access to
    all components of your Linux operating system. You can log in as the root user
    from either the GUI (Graphical User Interface) login screen, or from the command
    line prompt. You have access to all administrative tools. Using a GUI interface
    like Gnome, the root user has access to a number of Red Hat administrative tools,
    such as redhat-config-packages for installing software or redhat-config-users
    for managing users. If you log in from the command interface, you can run administrative
    command rpm to install packages or useradd to add a new user. From your GUI desktop,
    you can also run command-line administrative tools using a terminal window. The
    command line interface for the root user uses a special prompt, the sharp sign,
    #. In the next example, the user logs in to the system as the root user and receives
    the # prompt.


    ```

    login: root

    password:

    {}

    ```


    # Root User Password


    As the root user, you can use the passwd command to change the password for the
    root login, as well as for any other user on the system. The passwd command will
    check your password with Pluggable Authentication Modules (PAM), as discussed
    in Chapter 2, to see if you''ve selected one that can be easily cracked. To easily
    change your root password from a GUI interface, you can use the redhat-config-rootpassword
    tool.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Basic System Administration 3


    ```

