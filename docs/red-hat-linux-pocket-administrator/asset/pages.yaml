  md: '# Organizing Scheduled Tasks


    You can organize administrative cron tasks into two general groups: common administrative
    tasks that can be run at regular intervals, or specialized tasks that need to
    be run at a unique time. Unique tasks can be run as entries in the /etc/crontab
    file, as described in the next section. Common administrative tasks, though they
    can be run from the /etc/crontab file, are better organized into cron directories.
    Within such directories, each task is placed in its own shell script that will
    invoke the task when run. For example, there may be several administrative tasks
    that all need to be each on the same day, if maintenance for a system is scheduled
    on a Sunday morning. For these kinds of tasks, cron provides several specialized
    directories for automatic daily, weekly, monthly, and yearly tasks. Each contains
    a cron prefix and a suffix for the time interval. The /etc/cron.daily directory
    is used for tasks that need to be performed every day, whereas weekly task can
    be placed in the /etc/cron.weekly directory. The cron directories are listed in
    Table 1-2.


    | cron files and directories | Description |

    | /etc/crontab | System crontab file, accessible by the root user |

    | /etc/cron.d | Directory containing multiple cron files, accessible only by the
    root user |

    | /etc/cron.hourly | Directory for tasks performed hourly |

    | /etc/cron.daily | Directory for tasks performed daily |

    | /etc/cron.weekly | Directory for tasks performed weekly |

    | /etc/cron.monthly | Directory for tasks performed monthly |

    | /etc/cron.yearly | Directory for tasks performed yearly |

    | /etc/cron.hourly | Directory for tasks performed hourly |

    | /etc/cron.allow | Users allowed to submit cron tasks |

    | /etc/cron.deny | Users denied access to cron |


    **Table 1-2.** Cron files and directories'
  merge: -1
