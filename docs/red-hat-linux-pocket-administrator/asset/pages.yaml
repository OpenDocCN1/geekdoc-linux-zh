- img_proc: true
  md: '# 12 Red Hat Linux Pocket Administrator


    # # Running cron Directory Scripts


    Each directory contains scripts that are all run at the time. The scheduling for
    each group is determined by an entry in the /etc/crontab file. The actual execution
    of the scripts is performed by the /usr/bin/run-parts script, which runs all scripts
    and programs in a given directory. Scheduling for all tasks in a given directory
    is handled by an entry in the /etc/crontab file. Red Hat provides entries with
    designated times, which you may change for your needs. The default Red Hat crontab
    file shown here, with times for running scripts in the different cron directories.
    Here, you can see that most scripts are run at about 4 A.M., either daily (4:02),
    Sunday (4:22), or on the first day of each month (4:42). Hourly ones are run one
    minute after the hour.


    ```

    SHELL=/bin/bash

    PATH=/bin:/usr/bin:/sbin

    MAILTO=root

    # run-parts

    01 * * * * run-parts /etc/cron.hourly

    02 4 * * * run-parts /etc/cron.daily

    22 4 * * 0 run-parts /etc/cron.weekly

    42 4 1 * * run-parts /etc/cron.monthly

    ```


    > **TIP** Scripts within a cron directory are run alphabetically. If you need
    a certain script to run before any others, you may have to alter its name with
    a numeral. For example, in the /cron.weekly directory, the ancron script is named
    ancron so it will run before any others.


    Keep in mind, though, these are simply directories that contain executable files.
    The actual scheduling is performed by the entries in the /etc/crontab file. For
    example, if the weekly field in the /cron.weekly crontab is changed to * instead
    of 0, and the monthly field to 1 (22 4 1 * * instead of 22 4 * * 0), tasks in
    the /cron.weekly file would end up running monthly instead of weekly.'
  merge: -1
