  md: '# File System Administration 151


    # Installing IDE CD-R/RW

    and DVD-R/RW Devices


    Linux CD burning applications all treat CD-R/RW and DVD-R/RW drives as if they
    were SCSI drives. This means that IDE CD-R/RW drives have to emulate SCSI drives
    to be recognized and used by CD or DVD writing software. Even if you want to use
    an IDE CD-ROM or DVD-ROM in a CD writing applications—say, just as the reader
    to copy a CD disk—ripping—that IDE CD-ROM drive would still have to emulate a
    SCSI CD-ROM drive. Only SCSI CD-R/RW/ROM or DVD-R/RW/ROM are recognized by Linux
    CD and DVD writing software. For example, if you have a regular IDE CD-ROM and
    you want to use it with Linux CD-write software to copy CDs (ripping), for linuxdoc.org
    you still have to have IDE CD-ROM emulate a SCSI CD-ROM. Check the CD-Writing
    How-TO at.linuxdoc.org for more details. A brief description is provided here.


    TIP SCSI emulation for IDE devices is implemented in the kernel as SCSI Emulation
    Support in the IDE, ATA, and API Block Entries, located in the ATA/IDE/MFM/RLL
    Support window opened from the main kernel configuration menu. Normally, it is
    compiled as a module.


    IDE CD and DVD drives (CD-R/RW or DVD-R/RW/ROM) are recognized as IDE devices
    during installation and installed as such. However, when you start up your system,
    you need to instruct the Linux kernel to have the IDE CD and DVD drives emulate
    SCSI CD or DVD drives. This means that a CD-R drive that would be normally recognized
    as a /dev/hdc drive has to be recognized as a /dev/scd0 device, the first SCSI
    CD-ROM drive. You do do this by loading the ide-scsi module, which allows an IDE
    CD drive to emulate a SCSI CD drive.


    # SCSI Emulation


    You can implement SCSI emulation for IDE CD and DVD drives in one of two ways:
    either by loading the ide-scsi module as a kernel parameter, or by specifying
    the module'
  merge: -1
  pgno: 163
- img_proc: true
  md: '# 152 Red Hat Linux Pocket Administrator


    in the /etc/modules.conf file (/etc/modprob.conf in 2.5 and 2.6 kernels). You
    will also have to indicate the IDE drives to emulate. The ide-scsi module is compiled
    into the kernel (not as a separate module), then you will have to load it as a
    kernel parameter. An ide-scsi module can be loaded either way.


    > TIP During installation, Red Hat will recognize the IDE CD and DVD drives you
    have installed on your system, and will include the ide-scsi kernel parameter
    automatically as part of either your LILO or GRUB boot loader configurations.
    You do not need to perform any of the specific configuration tasks described in
    this section.


    # Kernel Parameters at Boot Time


    As a kernel parameter, you can manually enter the ide-scsi parameter at the boot
    prompt or place it in the /etc/grub.conf or /etc/liko.conf files (depending on
    whether you are using the GRUB or LILO boot loader) to have it automatically entered.
    The parameter is read when the system starts up. List each IDE CD or DVD drive
    that needs to be emulate a SCSI drive using the ide-scsi module. You assign the
    ide-scsi module to the device name of the IDE drive to be emulated. The following
    example loads the ide-scsi module to have the master IDE drive on the secondary
    IDE connection (hdc) emulate a SCSI drive.


    ```

    hdc=ide-scsi

    ```


    # Grub and CD Writers


    If you installed Red Hat with your IDE CD-R/RW drive already attached, GRUB would
    have detected it and listed the ide-scsi module for that drive in its boot parameters.
    You can always manually enter the parameter by typing a at the GRUB boot entry
    for your Linux system, displayed when you start up your computer. The parameters
    for your Linux system will be listed. Just add the CD-R/RW ide-scsi module assignment.'
