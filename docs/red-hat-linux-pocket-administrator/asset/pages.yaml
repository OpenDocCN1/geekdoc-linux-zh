    useradd, and change, discussed in this chapter. The passwd command lets you change
    the password only. Other tools, like redhat-config-users, not only make entries
    in the /etc/passwd file, but also create the home directory for the user and install
    initialization files in the user''s home directory.


    These tools also let you control a user''s access to their accounts. You can set
    expiration dates for users or lock them out of their accounts. Users locked out
    of their accounts will have their password in the /etc/shadow file prefixed by
    the invalid string, !. Unlocking the account removes this prefix.


    With the Red Hat Authentication tool (authconfig-gtk) you can enable and configure
    various authentication tools such as NIS and LDAP servers, as well as enabling
    shadow passwords, LDAP, Kerberos authentication (accessible as Authentication
    on the System Settings menu and windows).


