  md: '# INTRODUCTION


    With its up-to-date coverage of Red Hat and Linux kernel, the Red Hat Linux Administrator''s
    Pocket Reference is just what you need to master administration fundamentals and
    commands. This book provides all the basic aspects of the Red Hat Linux administration,
    with particular attention to users, devices, software, printer management, kernel
    administration, and system management


    The book is also for people who want to learn how to manage their Linux machines
    and become more efficient with the best commands and options for their specific
    tasks. It covers a wide range of topics such as system configuration, users and
    groups management, software management, file system management, devices, print
    servers, kernel administration, and various system administrator tasks. It teaches
    readers how to manage user accounts, customize their Linux kernel, configure RAID
    tasks, access file systems, schedule and monitor system tasks secure passwords,
    and much more. The book provides a lot of examples and tips to help readers experiment
    with all the discussed administration commands.


    If you are learning to administer Linux, looking for new commands and options
    that will help you do your administration tasks faster and more efficiently, or
    wishing you had a pocket-sized book with your need-to-know information at your
    fingertips, this book is right for you.'
  merge: -1
