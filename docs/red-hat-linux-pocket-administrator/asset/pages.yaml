  md: '# shutdown


    Although you can power down the system with the telinit command and the 0 state,
    you can also use the shutdown command. The shutdown command has a time argument
    that gives users on the system warning before you power down. You can specify
    an exact time to shut down, a period of minutes from the current time. The exact
    time is specified by hh:mm for the hour and minutes. The period of time is indicated
    by a + and the number of minutes. The shutdown command takes several options with
    which you can specify how you want your system shut down. The -h option, which
    stands for halt, whereas the -r option shuts down the system and then reboots
    it. In the next example, the system is shut down after ten minutes.


    ```

    # shutdown -h +10

    ```


    To shut down the system immediately, you can use +0 or the word now. The following
    example shuts down the system immediately, and then reboots.


    ```

    # shutdown -r now

    ```


    With the shutdown command, you can include a warning message to be sent to all
    users currently logged in, giving them time to finish what they are doing before
    you shut them down.


    ```

    # shutdown -h +5 "System needs a rest"

    ```


    If you do not specify the -h or the -r options, the shutdown command shuts down
    the multiuser mode and shifts to an administrative single-user mode. In effect,
    your system state changes from 3 (multiuser state) to 1 (administrative single-user
    state). Only the root user is active, allowing the root user to perform any necessary
    administrative operations with other users might interfere.


    > TIP You can also shut down your system from the Gnome or KDE desktops.'
  merge: -1
  pgno: 29
