    # chmod


    You the chmod command to change different permission configurations. chmod takes
    two lists as its arguments: permission changes and filenames. You can specify
    the list of permissions in two different ways. One way uses permission symbols
    and is referred to as the symbolic method. The other uses what is known as a “binary
    mask” and is referred to as the absolute or the relative method. Table 2-4 lists
    options for the chmod command.


