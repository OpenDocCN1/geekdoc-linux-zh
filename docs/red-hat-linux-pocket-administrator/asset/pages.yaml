    they are attached, you cannot access the files on your floppy disk.


    # Mounting File Systems


    Attaching a file system on a storage device to your main directory tree is called
    mounting the device. The file system is mounted to an empty directory on the main
    directory tree. You can then change to that directory and access those files.
    If the directory does not yet exist, you will have to create it. The directory
    in the file structure to which the new file system is attached is referred to
    as the mountpoint. For example, to access files on a CD-ROM, first you have to
    mount the CD-ROM.


    Mount file systems can only be done by the root user. This is a system administration
    task and cannot be performed by a regular user. As the root user, you can, however,
    make a particular device, like a CD-ROM, user-mountable. In this way, any user
    could mount a CD-ROM. You could do the same for a floppy drive.


    > TIP On Gnome, you can use the Disk Management tool on the System Settings window
    to mount and unmount file systems, including floppy disks and CD-ROMs. On KDE,
    you can use the KDiskFree utility (Extra System Tools menu), which also lists
    your mountable file as well as their disk usage.


    Even the file system on your hard disk partition must be explicitly mounted. When
    you install your Linux system and create the Linux partition on your hard drive,
    your system is automatically configured to mount your main file system whenever
    it starts. When your system shuts down, they are automatically unmounted. You
    have the option of unmounting any file system, removing it from the directory
    tree, and possibly replacing it with another, as is the case when you replace
    a CD-ROM.


    Once a file system is actually mounted, an entry for it is made by the operating
    system in the /etc/mstab file. Here, you will find listed all file systems mounted.'
