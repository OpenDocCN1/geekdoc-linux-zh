    make install

    ```


    | Option | Description |

    | --- | --- |

    | zImage | Creates the kernel file called zImage located in /usr/src/linux/arch
    or arch/i386/boot directory |

    | install | Creates the kernel and installs it on your system |

    | zdisk | Creates a kernel file and installs it on a floppy disk (creates a boot
    disk). |

    | bImage | Creates the kernel file and calls it bImage. |

    | bdisk | Creates the kernel and installs it on a floppy disk (creates a boot
