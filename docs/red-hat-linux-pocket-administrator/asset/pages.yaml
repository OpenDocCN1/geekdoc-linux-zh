- img_proc: true
  md: '# lpc


    You can use lpc to enable or disable printers, reorder

    print queues, and re-execute configuration files. To

    use lpc, enter the command lpc at the shell prompt. We

    are then given an lpc> prompt at which you can enter

    lpc commands to manage your printers and reorder their

    jobs. The status command with the name of the printer

    displays whether the printer is ready, how many print

    jobs it has, and so on. The stop and start commands

    can stop a printer and start it back up. The printers shown

    depend on the printers configured for a particular

    server. A printer configured for CUPS will only show if

    you have switched to CUPS. If you switch to the LPRng,

    those printers you configured for LPRng will show up.


    ```

    # lpc

    lpc> status myperson

    myeperson:

    printer is on device ''parallel''

    queuing is enabled

    printing is enabled

    1 entry in spool area

    ```


    # lpq and lpstat


    You can manage the print queue using the lpq and lprm

    commands. The lpq command lists the printing jobs

    currently on the print queue. With the -P option and the

    printer name, you can list the jobs for a particular printer.

    If you specify a username, you can list the print jobs for

    that user. With the -l option, lpq displays detailed

    information about each job. If you want information on

    specific job, simply use that job''s ID number with lpq.

    To check the status of a printer, use lpstat.


    ```

    # lpq

    myeperson is ready and printing

    Rank Owner Jobs File(s) Total Size

    active chris 1 report 1024

    ```


    # lprm


    The lprm command enables you to remove a print job

    from the queue, erasing the job before it can be printed.'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# 220 Red Hat Linux Pocket Administrator


    The lprm command takes many of the same options as lpq. To remove a specific job,
    use lprm with the job number. To remove all printing jobs for a particular printer,
    use the -P option with the printer name. lprm with no options removes the job
    printing currently. The following command removes the first job in the queue.


    ```

    # lprm 1

    ```


    # CUPS Administrative Tools


    CUPS provides command line administrative tools like lpadmin, lpoptions, enable,
    disable, accept, and reject. The enable and disable commands start and stop print
    queues directly, whereas the accept and reject commands start and stop particular
    jobs. lpinfo provides information about printers, and lpoptions lets you set printing
    options. The lpadmin command lets you perform administrative tasks like adding
    printers and changing configurations.


    # lpadmin


    You can use the lpadmin command to either set the default printer or configure
    various options for a printer. You can use the -d option to specify a particular
    printer as the default destination (you can also do this in redhat-config-printer).
    Here myepson is made the default printer:


    ```

    lpadmin -d myepson

    ```


    The -p option lets you designate a printer for which to set various options. The
    following example sets printer description information:


    ```

    lpadmin -p myepson -D Epson550

    ```


    Certain options let you control user-quot for print jobs. The job-k-limit sets
    the size of a job allowed per user, job-page-limit sets the page limit for a job,
    and the job-quota-period limits the number of jobs with a specified timeframe.
    The following command sets a page limit of 100 for each user.'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# Print Servers 221


    lpadmin -p meyson -o job-page-limit=100


    User access control is determined with the -u option with an allow or deny list.
    Users allowed access are listed following the allow: entry, and those denied access
    are listed with a deny: entry. Here, access is granted to chris, but denied to
    aleina and larisa.


    ```

    lpadmin -p meyson -u allow:chris deny:aleina, larisa

    ```


    Use all or none to permit or deny access to all or no users. You can create exceptions
    by using all or none in combination with user specific access. The example allows
    access to all users except just.


    ```

    lpadmin -p meyson -u allow:all deny:justin

    ```


    # lpoptions


    The lpoptions command sets printing options that govern your print jobs will be.
    For example, you can set the color or page format to be used with a particular
    printer. Default settings for all users are maintained by the root user in the
    /etc/cups/lpoptions file, and each user can create their own configurations, which
    are saved in their .lpoptions files. The -l option lists current options for a
    printer, and the -p options designates a printer (you can also set the default
    printer to use with the -d option).


    ```

    lpoptions -p meyson -l

    ```


    Printer options are set using the -o option along with the option name and value,
    -o option=value. You can remove a printer with the -r option. For example, to
    print on both sides of your sheets, you can set the sides option to two-sided:


    ```

    lpoptions -p meyson -o sides=two-sided

    ```


    To remove the option, use -r:


    ```

    lpoptions -p meyson -r sides

    ```


    To display a listing of available options, check the standard printing options
    in the CUPS Software Manual at www.cups.org.'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# 222 Red Hat Linux Pocket Administrator


    # enable and disable


    The enable command starts a printer, and the disable command stops it. With the
    -c option, you can cancel all jobs on the printer''s queue, and with the -r option,
    you broadcast a message explaining the shutdown.


    disable myiphon


    # accept and reject


    The accept and reject commands let you control access to the printer queues for
    specific printers. The reject command prevents a printer from accepting jobs,
