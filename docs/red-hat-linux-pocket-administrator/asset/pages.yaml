  md: '# Adding and Removing Users with useradd, usermod, and userdel


    Linux also provides the useradd, usermod, and userdel commands to manage user
    accounts. All these commands take in all their information as options on the command
    line. If an option is not specified, they use predetermined default values.


    # useradd


    With the useradd command, you enter values on the command line, such as the name
    of a user, to create a user account. It then creates a new login and directory
    for that user using the default features for a new account.


    ```

    # useradd chris

    ```


    The useradd utility first checks the /etc/login.defs file for default values for
    creating a new account. For those defaults not defined in the /etc/login.defs
    file, useradd supplies its own. You can display these defaults using the useradd
    command with the -D option. The default values include the group name, the user
    ID, the home directory, the skel directory, and the login shell. Values the user
    enters on the command line will override corresponding defaults. The group name
    is the name of the group in which the new account is placed. By default, this
    is other, which means the new account belongs to no group. The user ID is a number
    identifying the user account. The skel directory is the system directory that
    holds copies of initialization files. These initialization files are copied into
    the user''s new home directory when it is created. The login shell is the pathname
    for the particular shell user plans to use.


    The useradd command has options that correspond to each default value. Table 2-3
    holds a list of all options'
