    # Installing Broadcom drivers


    In the following recipe, we''ll perform the installation of Broadcom''s official
    Linux hybrid wireless driver. Using a Broadcom wireless USB adapter gives us the
    greatest possibility of success in terms of getting our wireless USB access point
    to work on Kali. For the rest of the recipes in this book, we will assume installation
    of the Broadcom wireless drivers.


    ## Getting ready

    An Internet connection is required to complete this recipe.


    ## How to do it...

    Let''s begin the process of installing Broadcom drivers:


    1. Open a terminal window and download the appropriate Broadcom driver from `http://www.broadcom.com/support/802.11/linux_sta.php`:

    ```bash

    cd /tmp/

    wget http://www.broadcom.com/docs/linux_sta/hybrid-portsrc_x86_64-v5_100_82_112.tar.gz

    ```

    ![](images/00034.jpeg)


    Customizing Kali Linux

    2. Extract the downloaded driver using the following script:

    ```bash

    mkdir broadcom

    tar xvfz hybrid-portsrc_x86_64-v5_100_82_112.tar.gz -C /tmp/ broadcom

    ```

    3. Modify the `wl_cfg80211.c` file since there''s a bug in version `5.100.82.112`
    that prevents compiling the code under kernel version `2.6.39`:

    ```bash

    vim /tmp/broadcom/src/wl/sys/wl_cfg80211.c

    ```

    Look at the following piece of code at line number 1814:

    ```c

    #if LINUX_VERSION_CODE > KERNEL_VERSION(2, 6, 39)

    ```

    Replace it with the following:

    ```c

    #if LINUX_VERSION_CODE >= KERNEL_VERSION(2, 6, 39)

    ```

    Save the changes.


    4. Compile the code:

    ```bash

    make clean

    make

    make install

    ```

    5. Update the dependencies:

    ```bash

    depmod -a

    ```

    6. Find loaded modules by issuing the following:

    ```bash

    lsmod | grep b43\|ssb\|bcma

    ```

    7. Remove the modules found by executing the following command:

    ```bash

    rmmod <module>b43

    ```

    Where `<module>` could be `b43`, `ssb`, or `bcma`.


    8. Blacklist the modules to prevent them from loading at system startup:

    ```bash

    echo "blacklist <module>" >> /etc/modprobe.d/blacklist.conf

    ```

    Where `<module>` could be `b43`, `ssb`, `bcma`, or `wl`.


    9. Finally, add the new module to the Linux Kernel to make it a part of the boot
    process:

    ```bash

    modprobe wl

    ```

    ![](images/00035.jpeg)


    # Installing and configuring ATI video card drivers


    In this recipe, we''ll go into the details for installing and configuring the
    ATI video card drivers followed by the AMDAccelerated Parallel Processing(APP)
    SDK, `OpenCL`, and `CAL++`. Taking advantage of the ATI Stream technology, we
    can run computationally-intensive tasks—typically running on the CPU—that perform
    more quickly and efficiently. For more detailed information regarding the ATI
    Stream technology, visit `www.amd.com/stream`.


    ## Getting ready

    An Internet connection is required to complete this recipe. The preparation of
    kernel headers is also needed before starting this task, which is explained in
    the `Preparing kernel headers` recipe at the beginning of this chapter.


    ## How to do it...

    Let''s begin installing and configuring the ATI drivers:


    1. Download the ATI display driver required for your system:

    ```bash

    cd /tmp/

    wget http://www2.ati.com/drivers/linux/amd-driver-installer-12-1-x86.x86_64.run

    ```

    We can also download the display driver from the following site: `http://support.amd.com/us/gpudownload/Pages/index.aspx`.

    ![](images/00036.jpeg)


    Customizing Kali Linux

    2. Start the installation by typing the following command:

    ```bash

    sh amd-driver-installer-12-1-x86.x86_64.run

    ```

    3. When the setup completes, reboot your system for the changes to take effect
    and to prevent system instability.

    4. Install the dependencies needed for further steps:

    ```bash

    apt-get install libroot-python-dev libboost-python-dev libboost1.40-all-dev cmake

    ```

    5. Download and untar the AMD APP SDK according to your CPU architecture:

    ```bash

    wget http://developer.amd.com/Downloads/AMD-APP-SDK-v2.6-lnx64.tgz

    mkdir AMD-APP-SDK-v2.6-lnx64

    tar zxvf AMD-APP-SDK-v2.6-lnx64.tgz -C /tmp/AMD-APP-SDK-v2.6-lnx64

    cd AMD-APP-SDK-v2.6-lnx64

    ```

    6. Install the APP SDK by issuing the following command:

    ```bash

    sh Install-AMD-APP.sh

    ```

    7. Set the ATI Stream paths in the `.bashrc` file:

    ```bash

    echo export ATISTREAM_ROOT=/opt/AMD/ >> ~/.bashrc

    source ~/.bashrc

    ```

    ![](images/00037.jpeg)


    8. Download and compile `calpp`:

    ```bash

    cd /tmp

    svn co https://calpp.svn.sourceforge.net/root/calpp

    cd calpp/trunk

    cmake .

    make

    make install

    ```

    9. Download and compile `pyrit`:

    ```bash

    cd /tmp

    svn co http://pyrit.googlecode.com/svn/trunk/pyrit_src

    cd pyrit_src

    python setup.py build

    python setup.py install

    ```

    10. Build and install `OpenCL`:

    ```bash

    cd /tmp/pyrit_src/cpyrit_opencl

    python setup.py build

    python setup.py install

    ```

    11. Make a few changes to `cpyrit_calpp setup`:

    ```bash

    cd /tmp/pyrit_source/cpyrit_calpp

    vi setup.py

    ```

    Look at the following line:

    ```python

    VERSION = ''0.4.0-dev''

    ```

    Replace it with:

    ```python

    VERSION = ''0.4.1-dev''

    ```

    Also, look at the following line:

    ```python

    CALPP_INC_DIRS.append(os.path.join(CALPP_INC_DIR, ''include''))

    ```

    Replace it with:

    ```python

    CALPP_INC_DIRS.append(os.path.join(CALPP_INC_DIR, ''include/CAL''))

    ```

    ![](images/00038.jpeg)


    Customizing Kali Linux

    12. Finally, add the GPU module to `pyrit`:

    ```bash

    python setup.py build

    python setup.py install

    ```

    To show the available `CAL++` devices and CPU cores, we issue the following command:

    ```bash

    pyrit list_cores

    ```

    To perform a benchmark, we simply type:

    ```bash

    pyrit benchmark

    ```


    # Installing and configuring nvidia video card drivers


    In this recipe, we will embrace Compute Device Architecture (`CUDA`), the nvidia
    parallel computing architecture. The first step will be the installation of the
    nvidia display driver followed by the installation of the `CUDA` toolkit. This
    will give us dramatic increases in computer performance with the power of the
    GPU which will be used in scenarios like password cracking. For more information
    about `CUDA`, please visit their website at `http://www.nvidia.com/object/cuda_home.html`.


    ## Getting ready

    An Internet connection is required to complete this recipe. The preparation of
    kernel headers is needed before starting this task, which is explained in the
    `Preparing kernel headers` recipe at the beginning of this chapter. In order to
    accomplish the installation of the nvidia driver, the X session needs to be shut
    down.


    ## How to do it...

    Let''s begin the process of installing and configuring the nvidia video card drivers:


    1. Download the nvidia display driver according to your CPU architecture:

    ```bash

    cd /tmp/

    wget http://developer.download.nvidia.com/compute/cuda/4_1/rel/drivers/NVIDIA-Linux-x86_64-285.05.33.run

    ```

    ![](images/00039.jpeg)


    2. Install the driver:

    ```bash

    chmod +x NVIDIA-Linux-x86_64-285.05.33.run

    ./NVIDIA-Linux-x86_64-285.05.33.run -kernel-source-path=''/usr/src/linux''

    ```

    3. Download the `CUDA` toolkit:

    ```bash

    wget http://developer.download.nvidia.com/compute/cuda/4_1/rel/toolkit/cudatoolkit_4.1.28_linux_64_ubuntu11.04.run

    ```

    4. Install the `CUDA` toolkit to `/opt`:

    ```bash

    chmod +x cudatoolkit_4.1.28_linux_64_ubuntu11.04.run

    ./cudatoolkit_4.1.28_linux_64_ubuntu11.04.run

    ```

    Configure the environment variables required for `nvcc` to work:

    ```bash

    echo PATH=$PATH:/opt/cuda/bin >> ~/.bashrc

    echo LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/opt/cuda/lib >> ~/.bashrc

    echo export PATH >> ~/.bashrc

    echo export LD_LIBRARY_PATH >> ~/.bashrc

    ```

    5. Run the following command to make the variables take effect:

    ```bash

    source ~/.bashrc

    ldconfig

    ```

    6. Install `pyrit` dependencies:

    ```bash

    apt-get install libssl-dev python-dev python-scapy

    ```

    7. Download and install the GPU powered tool, `pyrit`:

    ```bash

    svn co http://pyrit.googlecode.com/svn/trunk/pyrit_src

    cd pyrit_src/pyrit

    python setup.py build

    python setup.py install

    ```

    ![](images/00040.jpeg)


    Customizing Kali Linux

    8. Finally, add the nvidia GPU module to `pyrit`:

    ```bash

    cd /tmp/pyrit_src/cpyrit_cuda

    python setup.py build

    python setup.py install

    ```

    To verify if `nvcc` is installed correctly, we issue the following command:

    ```bash

    nvcc -V

    ```

    To perform a benchmark, we simply type the following command:

    ```bash

    pyrit benchmark

    ```


