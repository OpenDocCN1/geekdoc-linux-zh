    Linux ISO file from the list. If the Kali Linux ISO file is not present, select
    the `Choose a virtual CD/DVD disc file...` option and locate your ISO. Once you
    have completed these steps, click on the `OK` button:


    14. Click on the `Start` button and then click inside the new window and proceed
