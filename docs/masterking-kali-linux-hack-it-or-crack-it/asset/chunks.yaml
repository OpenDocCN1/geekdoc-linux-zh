    2. 进入网站后，您将看到超过 100 种发行版，包括 `CentOS`、`Ubuntu`、`Fedora` 和 `Debian`。在本配方中，我们将检查
    `Turnkey Linux`。

    3. 在 `Turnkey Linux` 下载页面，选择 `ISO` 镜像，下载完成后，按照 `Getting comfortable with VirtualBox`
    配方中的指令安装 `Turnkey Linux` 虚拟机：


