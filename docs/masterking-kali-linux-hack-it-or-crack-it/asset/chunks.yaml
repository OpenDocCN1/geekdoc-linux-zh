    \ `192.168.0.1-20`\n11. Click on `Save Target`.\n12. Now go to `Scan Management|New\
    \ Task`, and perform the following tasks:\n    1. Enter the name of the task.\n\
    \    2. Enter a comment (optional).\n    3. Select your scan configuration. In\
    \ this case `Windows Vulnerabilities`.\n    4. Select the scan targets. In this\
    \ case `Local Network`.\n    5. Leave all other options at their default levels.\n\
    \n137\n![](images/00133.jpeg)\n\n### Vulnerability Assessment\n6. Click on `onCreate\
    \ Task`:\n13. Now go to `Scan Management|Tasks`.\n14. Click on the play button\
    \ next to our scan. In this case `Windows Vulnerability Scan`.\n\n#### How it\
    \ works...\nIn this recipe, we launched OpenVAS and logged into its web-based\
    \ interface. We then configured OpenVAS to search for a set of Windows vulnerabilities.\
    \ Finally, we selected our target and completed the scan. OpenVAS then scanned\
    \ the target system against the list of known vulnerabilities included in our\
    \ NVT Feed.\n\n138\n![](images/00134.jpeg)\n\n### Chapter 5\n#### There's more...\n\
    Once your scan has been performed, you can see the results by viewing the report:\n\
    1. Go to `Scan Management | Tasks`.\n2. Click on the purple magnifying glass next\
    \ to `Windows Vulnerabilities Scan`.\n3. Click on the download arrow to view the\
    \ report:\n\n139\n![](images/00004.jpeg)\n\n# 6 Exploiting Vulnerabilities\n\n\
    In this chapter, we will cover:\n- Installing and configuring Metasploitable\n\
    - Mastering Armitage, the graphical management tool for Metasploit\n- Mastering\
    \ the Metasploit Console (`MSFCONSOLE`)\n- Mastering the Metasploit CLI (`MSFCLI`)\n\
    - Mastering Meterpreter\n- Metasploitable MySQL\n- Metasploitable PostgreSQL\n\
    - Metasploitable Tomcat\n- Metasploitable PDF\n- Implementing `browser_autopwn`\n\
    \n## Introduction\nOnce we have completed our vulnerability scanning steps, we\
    \ now have the knowledge necessary to attempt to launch exploits against our target\
    \ system(s). In this chapter, we will examine using various tools including the\
    \ Swiss Army knife of testing systems, which is Metasploit. ![](images/00005.jpeg)![](images/00005.jpeg)\n\
    \n![](images/00135.jpeg)\n\n### Exploiting Vulnerabilities\n#### Installing and\
    \ configuring Metasploitable\nIn this recipe, we will install, configure, and\
    \ start Metasploitable 2. Metasploitable is a Linux-based operating system that\
    \ is vulnerable to various Metasploit attacks. It was designed by Rapid7, the\
    \ owners of Metasploit framework. Metasploitable is an excellent way to get familiar\
    \ with Meterpreter.\n\n##### Getting ready\nTo execute this recipe we will need\
    \ the following:\n- A connection to the Internet\n- Available space on your VirtualBox\
    \ PC\n- An unzipping tool (in this case we are using 7-Zip on a Windows machine)\n\
    \n##### How to do it...\nLet's begin the recipe by downloading Metasploitable\
    \ 2. Getting the package from SourceForge is going to be our safest option:\n\
    1. Download Metasploitable 2 from the following link: `http://sourceforge.net/projects/metasploitable/files/Metasploitable2/`\n\
    2. Save the file to a location on your hard drive.\n3. Unzip the file.\n4. Place\
    \ the contents of the folder in a location where you store your virtual disk.\n\
    5. Open VirtualBox and click on the `New` button:\n\n142\n![](images/00136.jpeg)\n\
    \n### Chapter 6\n6. Click on `Next`.\n7. Enter a name of `Metasploitable 2` while\
    \ selecting `Operating System: Linux` and `Version: Ubuntu`, and click on `Next`\
    \ as shown in the following screenshot:\n143\n![](images/00137.jpeg)\n\n### Exploiting\
    \ Vulnerabilities\n8. Select `512 MB` of RAM if you have available and click on\
    \ `Next`:\n9. Choose an existing disk and select the VDMK file from where you\
    \ downloaded and saved the `Metasploitable 2` folder:\n144\n![](images/00138.jpeg)\n\
    \n### Chapter 6\n10. Your virtual disk window will look as it does in the following\
    \ screenshot. In this instance, we do not need to update the disk space at all.\
    \ This is because using Metasploitable, you are attacking the system, not using\
    \ it as an operating system.\n11. Click on `Create`:\n12. Start Metasploitable\
    \ 2 by clicking on its name and clicking on the `Start` button.\n\n145\n![](images/00139.jpeg)\n\
    \n### Exploiting Vulnerabilities\n#### How it works...\nIn this recipe, we set\
    \ up Metasploitable 2 on Virtualbox. We began the recipe by downloading Metasploitable\
    \ from sourceforge.net. Next, we configured the VDMK to run inside of virtualbox\
    \ and concluded by starting the system.\n\n#### Mastering Armitage, the graphical\
    \ management tool for Metasploit\nThe newer versions of Metasploit utilize a graphical\
    \ front end tool called Armitage. Understanding Armitage is important because\
    \ it ultimately makes your usage of Metasploit easier by providing information\
    \ to you visually. It encompasses the Metasploit Console and, by using its tabbing\
    \ capabilities, allows you to see more than one Metasploit Console or Meterpreter\
    \ session at a time.\n\n##### Getting ready\nA connection to the Internet or internal\
    \ network is required to complete this recipe.\n\n##### How to do it...\nLet's\
    \ begin our review of Armitage:\n1. From the desktop go to `Start|Kali Linux|Exploitation\
    \ Tools|Network Exploitation Tools|Armitage`:\n\n146\n![](images/00140.jpeg)\n\
    \n### Chapter 6\n2. On the Armitage login screen, click on the `Connect` button:\n\
    147\n![](images/00141.jpeg)\n\n### Exploiting Vulnerabilities\n3. It may take\
    \ Armitage a while to connect to Metasploit. While this takes place, you may see\
    \ the following notification window. Do not be alarmed. It will go away once Armitage\
    \ is able to connect. On the `Start Metasploit` screen, click on `Yes`:\n4. You\
    \ are then presented with the Armitage main screen. We will now discuss the following\
    \ three regions on the main screen (marked as `A.`, `B.`, and `C.` in the following\
    \ screenshot):\n- `A`: This region displays the preconfigured modules. You can\
    \ search for modules using the space provided below the modules list.\n- `B`:\
    \ This region displays your active targets that we are able to run our exploits\
    \ against.\n- `C`: This region displays multiple Metasploit tabs allowing for\
    \ multiple Meterpreter or console sessions to be run and displayed simultaneously.\n\
    \n148\n![](images/00142.jpeg)\n\n### Chapter 6\nAn alternative way to launch Armitage\
    \ is to type the following command into a terminal window:\n```\narmitage\n```\n\
    \n#### See also\n- To learn more about Meterpreter, please see the Mastering Meterpreter\
    \ section\n\n#### Mastering the Metasploit Console (`MSFCONSOLE`)\nIn this recipe,\
    \ we will examine the Metasploit Console (`MSFCONSOLE`). The `MSFCONSOLE` is primarily\
    \ used to manage the Metasploit database, manage sessions, and configure and launch\
    \ Metasploit modules. Essentially, for the purposes of exploitation, the `MSFCONSOLE`\
    \ will get you connected to a host so that you can launch your exploits against\
    \ it.\n\nSome common commands you will use when interacting with the console are:\n\
    - `help`: This command will allow you to view the help file for the command you\
    \ are trying to run\n"
