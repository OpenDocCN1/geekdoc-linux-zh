    \ NVT Feed.\n\n123\n\n![](images/00119.jpeg)\n\nVulnerability Assessment\n\nThere's\
    \ more...\n\nOnce your scan has been performed, you can see the results by viewing\
    \ the report:\n\n1.   Go toScan Management|Tasks.\n\n2.   Click on the purple\
    \ magnifying glass next toLocal Vulnerabilities Scan:\n\n3.   Click on the download\
    \ arrow to view the report:\n\n124\n\n![](images/00120.jpeg)\n\nChapter 5"
