    \ allow our machine to route traffic:\n\nSudo echo  1  >>  /proc/sys/net/ipv4/ip_forward\n\
    \n2.   Next, we launch arpspoof to poison traffic going to our default gateway.\
    \ In this\n\n              example, the IP address of our default gateway is192.168.10.1.\
    \ Arpspoof\n\n has a couple of options that we will select and they include:\n\
    \n             -iallows us to select our target interface. In this case, we\
    \ will selectwlan0\\.\n\nThe syntax for completing this command isarpspoof  -i\n\
    \n[interface]  [destination IP address].\n\nsudo arpspoof  -i wlan0  192.168.10.1\n\
    \n3.   Next, we will execute another arpspoof command that will take traffic from\
    \ our\n\n              destination in the previous command (which was the default\
    \ gateway) and route\n\n              that traffic back to our Kali Linux machine.\
    \ In this example our IP address is\n\n             192.168.10.110.\n\niptables \
    \ -t nat  -A PREROUTING  -p tcp  --destination-port  80  -j REDIRECT  --to-port \
    \ 8080\n\nThat's it!\n\n231\n\n![](images/00221.jpeg)\n\nWireless Attacks\n\n\
    How it works...\n\nIn this recipe, we used ARP poisoning with arpspoof and IPTables\
    \ routing to manipulate traffic on our network destined for port 80 to be redirected\
    \ to port 8080\\. The benefits of being able to perform this type of attack are\
    \ endless because with it you can redirect secure ports to unsecure ports, redirect\
    \ traffic to a specific port on a specific device, and so on.\n\nSniffing network\
    \ traffic\n\nIn this recipe, we will examine the process of sniffing network traffic.\
    \ Sniffing network traffic\n\ninvolves the process of intercepting network packets,\
    \ analyzing it, and then decoding the\n\ntraffic (if necessary) displaying the\
    \ information contained within the packet. Sniffing traffic is\n\nparticularly\
    \ useful in gathering information from a target, because depending on the websites\
    \ visited, you will be able to see the URLs visited, usernames, passwords, and\
    \ other details that you can use against them.\n\nWe will use Ettercap for this\
    \ recipe, but you could also use Wireshark. For demonstration purposes, Ettercap\
    \ is a lot easier to understand and apply sniffing principles. Once an\n\nunderstanding\
    \ of the sniffing process is established, Wireshark can be utilized to provide\
    \ more detailed analysis.\n\nGetting ready\n\nA wireless card configured for packet\
    \ injection is required to complete this recipe although you\n\ncan perform the\
    \ same steps over a wired network. In case of a wireless card, packet injection"
