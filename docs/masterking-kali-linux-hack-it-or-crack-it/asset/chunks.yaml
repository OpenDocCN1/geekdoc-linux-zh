    DNS 服务器和 DNS 目的的过程。DNS 枚举将允许我们收集有关该组织的关键信息，如用户名、计算机名称、IP 地址等。为了完成此任务，我们将使用 `DNSenum`。对于
    SNMP 枚举，我们将使用一个名为 `SnmpEnum` 的工具。`SnmpEnum` 是一个强大的 SNMP 枚举工具，允许用户分析网络上的 SNMP 流量。


