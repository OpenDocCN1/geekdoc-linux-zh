    # 收集受害者数据


    在本配方中，我们将探索如何使用 `Metasploit` 收集受害者的数据。有多种方法完成此任务，但我们将探索记录被攻破机器上的用户的键。收集受害者数据允许我们可能获取用于进一步利用的其他信息。


    ## 准备工作


    要执行此配方，我们需要以下条件：


    - 与互联网或局域网的连接

