- fmt: "\nIn this recipe, we will cover the process of updating Kali and configuring\
    \ some extra tools which will be useful in later chapters and recipes. As Kali\
    \ packages are constantly updated between releases, you will soon find that a\
    \ newer set of tools are available than what were originally downloaded on your\
    \ DVD ROM. We will start by updating our installation, obtaining an activation\
    \ code for Nessus, and conclude by installing Squid.\n\n## How to do it...\n\n\
    Let's begin the process of applying updates and configuring extra security tools:\n\
    \n1. Update the local package index with the latest changes made in the repositories:\n\
    \n```bash\napt-get update\n```\n\n2. Upgrade the existing packages:\n\n```bash\n\
    apt-get upgrade\n```\n\n3. Upgrade to the latest version (if available):\n\n```bash\n\
    apt-get dist-upgrade\n```\n\n40\n\n![](images/00041.jpeg)\n\n## Chapter 2\n\n\
    4. Obtain an activation code for Nessus by registering at `http://www.nessus.org/products/nessus/nessus-plugins/obtain-an-activation-code`.\n\
    \n5. Activate Nessus by executing the following command:\n\n```bash\n/opt/nessus/bin/nessus-fetch\
    \ --register A60F-XXXX-XXXX-XXXX-0006\n```\n\nWhere `A60F-XXXX-XXXX-XXXX-0006`\
    \ should be your activation code.\n\n6. Create a user account for the Nessus web\
    \ interface:\n\n```bash\n/opt/nessus/sbin/nessus-adduser\n```\n\n7. To start the\
    \ Nessus server, we simply invoke the following command:\n\n```bash\n/etc/init.d/nessusd\
    \ start\n```\n\n8. Install Squid:\n\n```bash\napt-get install squid3\n```\n\n\
    9. Prevent Squid from starting up automatically at boot time:\n\n```bash\nupdate-rc.d\
    \ -f squid3 remove\n```\n\nTo find a particular package in the repository, we\
    \ can use the following command after `apt-get update`:\n\n```bash\napt-cache\
    \ search <keyword>\n```\n\nWhere `<keyword>` could be a package name or a regular\
    \ expression.\n\n## Setting up ProxyChains\n\nBreaking the direct connection between\
    \ the receiver and the sender by forcing the connection of given applications\
    \ through a user-defined list of proxies is the task we'll be explaining in this\
    \ recipe.\n\n41\n\n![](images/00042.jpeg)\n\n## Customizing Kali Linux\n\nHow\
    \ to do it...\n\n1. Open the ProxyChains configuration file:\n\n```bash\nvim /etc/proxychains.conf\n\
    ```\n\n2. Uncomment the chaining type we want to use; in this case, `dynamic_chain`:\n\
    \n3. Add some proxy servers to the list.\n\n42\n\n![](images/00043.jpeg)\n\n##\
    \ Chapter 2\n\n4. Resolve the target host through our chained proxies:\n\n```bash\n\
    proxyresolv www.targethost.com\n```\n\n5. Now we can run ProxyChains through the\
    \ application we want to use; for example, `msfconsole`:\n\n```bash\nproxychains\
    \ msfconsole\n```\n\n## Directory encryption\n\nThe last recipe of this chapter\
    \ will be about information privacy. We will use TrueCrypt to hide important and\
    \ secret digital information from public eyes with encryption keys.\n\n43\n\n\
    ![](images/00044.jpeg)\n\n## Customizing Kali Linux\n\nHow to do it...\n\n1. Install\
    \ TrueCrypt by navigating to `Applications Menu|Kali|Forensics|Digital Anti Forensics|install\
    \ truecrypt`. Click on `Install TrueCrypt` and follow the onscreen directions.\n\
    \n2. Launch TrueCrypt from `Applications Menu|Kali Linux|Forensics|Digital Anti\
    \ Forensics|truecrypt` and you will see a window similar to the following screenshot:\n\
    \n44\n\n![](images/00045.jpeg)\n\n## Chapter 2\n\n3. Click `Create Volume` to\
    \ start the `TrueCrypt Volume Creation Wizard`.\n\n4. Leave the default option\
    \ and click on `Next`.\n\n5. Select the `Standard TrueCrypt` module and click\
    \ on `Next`.\n\n6. Click on the `Select File…` button and specify a name and location\
    \ for the new TrueCrypt volume. Click on `Save` when done.\n\n7. Click on the\
    \ `Next` button and select the encryption and hash algorithm we want to use.\n\
    \n8. In the next screen, we'll specify the amount of space we want for the container.\n\
    \n9. Now we need to type the password for our volume. Click on `Next`.\n\n10.\
    \ Choose the filesystem type.\n\n11. Select the `Cross-Platform Support` depending\
    \ on your needs.\n\n12. At the next screen, the wizard asks us to move the mouse\
    \ around within the window to increase the cryptographic strength of the encryption\
    \ keys. When done, click on the `Format` button.\n\n13. The formatting will start\
    \ and will conclude with the creation of the TrueCrypt volume. Press `OK` and\
    \ `Exit`.\n\n14. We're now back to the TrueCrypt window.\n\n15. To decrypt our\
    \ volume, pick a slot from the list, click on `Select File…`, and open our created\
    \ volume.\n\n45\n\n![](images/00046.jpeg)\n\n## Customizing Kali Linux\n\n16.\
    \ Click `Mount` and type our password; click on `OK` when done:\n\n17. We can\
    \ now access the volume by double-clicking it.\n\nHow it works...\n\nIn this recipe,\
    \ we set up TrueCrypt, created a volume, and mounted it.\n\n46\n\n3\n\n## Advanced\
    \ Lab\n\nIn this chapter, we will cover:\n- Getting comfortable with VirtualBox\n\
    - Downloading Targets\n- Downloading Linux\n- Attacking WordPress\n\nIntroduction\n\
    \nNow that you have learned about the tools, we will proceed to investigate some\
    \ scenarios. In the current state of technology, most businesses use Platform\
    \ as a Service (PAAS), Cloud servers, and firewall/router. Throughout this chapter,\
    \ we will depend heavily on VirtualBox and changing its configuration.\n\nGetting\
    \ ready\n\nA connection to the Internet or an internal network is required to\
    \ complete this module.\n\nHow to do it...\n\nLet's begin the process by opening\
    \ VirtualBox:\n\n1. Launch VirtualBox and click `New` to start the Virtual Machine\
    \ Wizard:\n\n2. Click on the `Next` button and type the name of the virtual machine\
    \ and choose the `OSType` as well as the `Version`. In this chapter, we will use\
    \ either Linux, Solaris, or Windows operating system. Select your appropriate\
    \ operating system. Click on the `Next` button to continue:\n\n48\n\n![](images/00048.jpeg)\n\
    \n## Chapter 3\n\n3. Select the amount of base memory (RAM) to be allocated to\
    \ the virtual machine. We're going to use the default value. Click on `Next`.\n\
    \n4. Create a new virtual hard disk for the virtual machine. Click on the `Next`\
    \ button:\n\n49\n\n![](images/00049.jpeg)\n\n## Advanced Lab\n\n5. A new wizard\
    \ window will open. Leave the default VDI file type as we're not planning other\
    \ virtualization software.\n\n6. We'll leave the default option as the virtual\
    \ disk storage details. Click on `Next` to continue.\n\n7. Set the virtual disk\
    \ file location and size:\n\n8. Check whether the settings are correct and click\
    \ on the `Create` button to start the virtual disk file creation.\n\n9. We're\
    \ back to the previous wizard with a summary of the virtual machine parameters.\n\
    \n Click `Create` to finish:\n\n50\n"
