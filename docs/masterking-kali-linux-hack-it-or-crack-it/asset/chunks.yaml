    通过基于 WEP 的无线连接，并对数据进行数学分析来破解 WEP 加密密钥。我们开始该方案的方法是启动 `AirCrack` 并选择我们所需的接口。接下来，我们更改了
    MAC 地址，以便在网络上更改身份，然后使用 `airodump` 搜索可攻击的可用无线网络。一旦我们找到了想要攻击的网络，我们就会使用 `aireplay`
    将我们的机器与正在攻击的无线设备的 MAC 地址关联。最后，我们收集了一些流量，然后对生成的 `.cap` 文件进行暴力破解，以获取无线网络密码。


    # 无线网络 WPA/WPA2 破解


    WiFi Protected Access（通常称为 `WPA`）自 2003 年以来一直存在，旨在保护无线网络并取代过时的旧标准 `WEP` 加密。在 2003
    年，`WEP` 被 `WPA` 取代，随后被 `WPA2` 取代。由于有了更安全的协议，`WEP` 加密已很少使用。


    在本方案中，我们将使用 `AirCrack` 套件来破解 WPA 密钥。`AirCrack` 套件（通常称为 `AirCrack NG`）是一个 `WEP`
    和 `WPA` 密钥破解程序，它通过捕获网络包、分析它们，并使用这些数据破解 `WPA` 密钥。


    ## 准备工作


    为了执行本方案的任务，需要具有 `Kali Linux` 终端窗口的经验。还需要一个配置了数据包注入的支持无线网卡。对于无线网卡，数据包注入涉及发送数据包或将其注入到双方已建立的连接中。


    222


    ![](img/00212.jpeg)


    # 第 9 章


    ## 如何操作...


    让我们开始使用 `AirCrack` 破解由 WPA 安全的网络会话。


    1. 打开终端窗口并列出无线网络接口列表。


    ```

    airmon-ng

    ```


    2. 在接口列下，选择一个接口。在这种情况下，我们将使用 `wlan0`。如果你有不同的接口（例如 `mon0`），请在所有提到 `wlan0` 的地方将其替换。


    3. 接下来，我们需要停止并关闭 `wlan0` 接口。


    ```

    airmon-ng stop wlan0

    ifconfig wlan0 down

    ```

    4. 接下来，我们需要更改接口的 MAC 地址。在这种情况下，我们将使用 `00:11:22:33:44:55`。


    ```

    macchanger --mac 00:11:22:33:44:55 wlan0

    ```


    5. 现在，我们需要重启 `airmon-ng`。


    ```

    airmon-ng start wlan0

    ```


    6. 接下来，我们将使用 `airodump` 定位附近的可用无线网络。


    ```

    airodump-ng wlan0

    ```


    7. 可用网络列表开始出现。一旦你找到了想要攻击的网络，按下 `Ctrl+C` 停止搜索。高亮 `BSSID` 列中的 MAC 地址，右键点击并选择复制。同时注意网络传输信号的信道。你可以在
    `Channel` 列中找到此信息。在这种情况下，信道为 `10`。


    8. 现在我们运行 `airodump`并将所选 `BSSID` 的信息复制到文件中。我们将利用以下选项：


    - `-c` 允许我们选择信道。在这种情况下，我们使用 `10`。

    - `-w` 允许我们选择文件名称。在这种情况下，我们选择了 `wirelessattack`。

    - `-bssid` 允许我们选择 `BSSID`。在这种情况下，我们将从剪贴板粘贴 `09:AC:90:AB:78`。


    ```

    airodump-ng -c 10 -w wirelessattack --bssid 09:AC:90:AB:78 wlan0

    ```


    223


    ![](img/00213.jpeg)


    # 无线攻击


    9. 将打开一个新的终端窗口，显示上一个命令的输出。保持此窗口打开。


    10. 打开另一个终端窗口；为了尝试关联，我们将运行 `aireplay`，其语法为：`aireplay-ng -dauth 1 -a [BSSID] -c
    [我们选择的 MAC 地址] [Interface]`。此过程可能需要几分钟。


    ```

    aireplay-ng --deauth 1 -a 09:AC:90:AB:78 -c 00:11:22:33:44:55 wlan0

    ```


    11. 最后，我们运行 `AirCrack` 来破解 WPA 密钥。`-w` 选项允许我们指定字典的位置。我们将使用之前命名的 `.cap` 文件。在这种情况下，文件名为
    `wirelessattack.cap`。


    ```

    Aircrack-ng -w ./wordlist.lst wirelessattack.cap

    ```


    就此了！


    ## 工作原理...


    在本方案中，我们使用 `AirCrack` 套件破解了无线网络的 WPA 密钥。`AirCrack` 是破解 WPA 最流行的程序之一。`AirCrack`
    的工作原理是从基于 WPA 的无线连接中收集数据包，然后对收集的数据进行密码暴力破解，直到


