    接下来，我们从 `Gerix` 提供的攻击目标列表中选择了我们的目标。在我们开始嗅探网络流量后，使用了 `Chop Chop` 生成了 `CAP` 文件。最后，我们通过收集
    20,000 个数据包并使用 `Aircrack` 对 `CAP` 文件进行暴力破解，完成了此实验。


    通过 `Gerix`，我们能够自动化破解 WEP 密钥的步骤，而无需在终端窗口中手动输入命令。这是快速高效地攻入 WEP 安全网络的极佳方法。


    ## 使用虚假 AP 访问客户端


    在本实验中，我们将使用 `Gerix` 创建并设置一个虚造的接入点（AP）。设置虚造接入点使我们能够收集连接它的每台计算机的信息。在当今时代，人们往往为了便利而牺牲安全性。连接到开放的无线接入点发送快速电子邮件或快速登录社交网络是非常方便的。`Gerix`
    是 `AirCrack` 的自动化 GUI 界面。


    ### 准备工作


    完成本实验需要一个配置了数据包注入（packet injection）的支持无线网卡。对于无线网卡，数据包注入涉及发送数据包，或将其注入到双方之间已建立的连接中。


    ### 如何操作……


    让我们开始使用 `Gerix` 创建虚假 AP 的过程。


    1. 导航到 `Gerix` 所在的目录：

    ```bash

    cd /usr/share/gerix-wifi-cracker

    ```

    ![](img/00217.jpeg)


    2. 要开始使用 `Gerix`，发布以下命令：

    ```bash

    python gerix.py

    ```


    3. 点击 `Configuration（配置）标签页。

    4. 在 `Configuration` 标签页中，选择你的无线接口。

    5. 点击 `Enable/Disable Monitor Mode（启用/禁用监听模式）按钮。

    6. 一旦成功启用监听模式，在 `Select Target Network（选择目标网络）` 下按下 `Rescan Networks（重新扫描网络）按钮。

    7. 目标网络列表开始填充。选择一个无线网络作为目标。在这种情况下，我们选择了一个 WEP 加密的网络。


    8. 点击 `Fake AP（虚假 AP）标签页。


    ![](img/00218.jpeg)


    9. 将 `Access Point ESSID` 从 `honeypot` 改为不那么可疑的名字。在这种情况下，我们将使用 `personalnetwork`。

    10. 我们将使用其他选项的默认值。要启动虚假接入点，点击 `Start Fake Access Point（启动虚假接入点）按钮`。


    就这样！


    ![](img/00219.jpeg)


    ### 工作原理……


    在本实验中，我们使用 `Gerix` 创建了一个虚假 AP。创建虚假 AP 是从毫无防备的用户那里收集信息的极佳方法。虚假接入点是一个强大工具的原因是，对于受害者来说，它们看起来是合接入点，从而获得了用户的信任。通过
    `Gerix`，我们能够在几次点击内自动化完成设置虚假接入点的过程。


    ## URL 流量操纵


    在本实验中，我们将执行 URL 流量操纵攻击。URL 流量操纵与中间人攻击（MITM）非常相似，因为我们将发往互联网的流量路由通过我们的机器。我们将通过 `ARP
    poisoning（ARP 毒）` 执行这种攻击。`ARP poisoning` 是一种向本地网络上的受害者发送伪造的 ARP 消息的技术。我们将使用 `arpspoof`
    执行本实验。


    ### 如何操作……


    让我们开始 URL 流量操纵的过程。


    1. 打开终端窗口并执行以下命令来配置 IP 表，允许我们的机器路由流量：

    ```bash

    sudo echo 1 >> /proc/sys/net/ipv4/ip_forward

    ```


    2. 接下来，我们启动 `arpspoof` 来毒化从受害者机器到默认网关的流量。在这个示例中，我们将使用本地网络上地址为 `192.168.10.115`
    的 Windows 7 机器。`Arpspoof` 有几项我们将选择的选项，包括：

    - `-i` 允许我们选择目标接口。在这种情况下，我们将选择 `wlan0`。

    - `-t` 允许我们指定目标。


    完成此命令的语法为 `arpspoof -i [interface] -t [target IP address] [destination IP address]`。

    ```bash

    sudo arpspoof -i wlan0 -t 192.168.10.115 192.168.10.1

    ```


    3. 接下来，我们将执行另一个 `arpspoof` 命令，该命令将获取上一个命令中目标（即默认网关）的流量并将其路由回我们的 Kali 机器。在此示例中我们的
    IP 是 `192.168.10.110`。

    ```bash

    sudo arpspoof -i wlan0 -t 192.168.10.1 192.168.10.110

    ```


    就这样！


    ![](img/00220.jpeg)


    ### 工作原理……


    在本实验中，我们使用配合 `arpspoof` 的 `ARP poisoning` 来操纵网络上的流量，最终将其路由回我们的 Kali 机器。一旦流量被重定向，你就可以针对受害者运行其他攻击，包括记录他们的……。


    ## 端口重定向


    在本实验中，我们将使用 Kali 执行端口重定向，也称为端口转发（port forwarding）。端口重定向涉及接受数据包（例如端口 80）并将其重定向到不同的端口（例如
    8080）。


    ### 如何操作……


    让我们开始端口重定向的过程。


    1. 打开终端窗口并执行以下命令来配置 IP 表，允许我们的机器路由流量：

    ```bash

    sudo echo 1 >> /proc/sys/net/ipv4/ip_forward

    ```


    2. 接下来，我们启动 `arpspoof` 来毒化从受害者机器到默认网关的流量。在这个示例中，地址是 `192.168.10.115`。`Arpspoof`
    有几项我们将选择的选项，包括：

    - `-i` 允许我们选择目标接口。在这种情况下，我们将选择 `wlan0`。

    - `-t` 允许我们指定目标。


    完成此命令的语法为 `arpspoof -i [interface] -t [target IP address] [destination IP address]`。

    ```bash

    sudo arpspoof -i wlan0 -t 192.168.10.115 192.168.10.1

    ```


    3. 接下来，我们将执行另一个 `arpspoof` 命令，该命令将获取上一个命令中目标（即默认网关）的流量并将其路由回我们的 Kali 机器。在此示例中我们的
    IP 是 `192.168.10.110`。

    ```bash

    sudo arpspoof -i wlan0 -t 192.168.10.1 192.168.10.110

    ```

    ```bash

    iptables -t nat -A PREROUTING -p tcp --destination-port 80 -j REDIRECT --to-port
    8080

    ```


    ### 工作原理……


    在本实验中，我们使用配合 `arpspoof` 的 `ARP poisoning` 以及 `IPTables` 路由来操纵网络上的端口 80 流量，将其重定向到
    8080。


    ## 网络流量嗅探


    在本实验中，我们将研究网络流量嗅探的过程。网络流量嗅探涉及拦截网络数据包、分析并在必要时解码流量，显示数据包包含的信息。嗅探流量对于从目标收集信息特别有用，因为取决于访问的网站，你将看到访问的
    URL、用户名、密码以及可以用于对它们的其他细节。


    在本实验中使用我们将 `Ettercap`，但你也可以使用 `Wireshark`。为了演示目的，`Ettercap` 更容易理解和应用嗅探原理。

