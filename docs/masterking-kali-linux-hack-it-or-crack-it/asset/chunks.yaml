    Up and Running with Kali Linux


    Installing VMware Tools


    In this recipe, we will demonstrate how to install Kali Linux as a virtual machine
    using VMware Tools.


    ### Getting ready


    The following requirements need to be fulfilled:


    - A previously installed Kali Linux VMware virtual machine

    - An Internet connection


    ### How to do it...


    Let''s begin the process of installing Kali Linux on VMware:


    1. With your virtual machine''s guest operating system powered on and connected
    to the Internet, open a `Terminal` window and type the following command to prepare
    the kernel sources:


    ```

    prepare-kernel-sources

    ```


    These instructions are assuming you are using either Linux or Mac OS machines.
    You will not need to perform these steps under Windows.


    2. On the VMware Workstation menu bar, navigate to `VM|Install VMware Tools...`:


    24


    ![](images/00027.jpeg)


    Chapter 1


    3. Copy the VMware Tools installer to a temporary location and then change the
    location to the target directory:


    ```bash

    cp /media/VMware Tools/VMwareTools-8.8.2-590212.tar.gz /tmp/; cd /tmp/

    ```


    Replace the filename according to your VMware Tools version:

    `VMwareTools-<version>-<build>.tar.gz`


    4. Untar the installer by issuing the following command:


    ```bash

    tar zxpf VMwareTools-8.8.2-590212.tar.gz

    ```


    5. Go to the VMware Tools'' directory and run the installer:


    ```bash

    cd vmware-tools-distrib/

    ./vmware-install.pl

    ```


    6. Press `Enter` to accept the default values in each configuration question;
    the same applies with the `vmware-config-tools.pl` script.


    7. Finally, reboot and we''re done!


    ### How it works...


    In the first step, we prepared our kernel source. Next, we virtually inserted
    the VMware Tools CD into the guest operating system. Then, we created the mount
    point and mounted the virtual CD drive. We copied and extracted the installer
    in a temporary folder and finally we ran the installer leaving the default values.


    ### Fixing the splash screen


    The first time we boot into our newly installed Kali Linux system, we will notice
    that the splash screen has disappeared. In order to manually fix it, we need to
    extract `Initrd`, modify it, and then compress it again. Thankfully, there''s
    an automated bash script created by Mati Aharoni (also known as "muts", creator
    of Kali Linux) that makes the whole process easier.


    ### How to do it...


    To fix the disappeared splash screen, type the following command and hit `Enter`:


    bash

    fix-splash

    ```


    25


    ![](images/00028.jpeg)


    Up and Running with Kali Linux


    ### Starting network services


    Kali Linux comes with several network services which may be useful in various
    situations and are disabled by default. In this recipe, we will cover the steps
    to set up and start each service using various methods.


    ### Getting ready


    The following requirement is needed in order to continue:


    - A connection to the network with a valid IP address


    ### How to do it...


    Let''s begin the process of starting our default service:


    1. Start the Apache server:


    ```bash

    service apache2 start

    ```


    We can verify the server is running by browsing to the localhost address.


    2. To start the `Secure Shell(SSH)` service, SSH keys need to be generated for
    the first time:


    ```bash

    sshd-generate

    ```


    3. Start the Secure Shell server:


    ```bash

    service ssh start

    ```


    4. To verify the server is up and listening, use the `netstat` command:


    ```bash

    netstat -tpan | grep 22

    ```


    5. Start the FTP server:


    ```bash

    service pure-ftpd start

    ```


    6. To verify the FTP server, use the following command:


    ```bash

    netstat -ant | grep 21

    ```


    You can also use the `ps-ef | grep 21` command.


    26


    ![](images/00029.jpeg)


    Chapter 1


    7. To stop a service, use the following command:


    ```bash

    service <servicename> stop

    ```


    8. To enable a service at boot time, use the following command:


    ```bash

    update-rc.d -f <servicename> defaults

    ```


    Setting up the network


    Kali Linux comes with several network services which may be useful in various
    situations and are disabled by default. In this recipe, we will cover the steps
    to set up and start each service using various methods.


    ### How to do it...


    Let''s begin the process of starting our default service:


    1. From the `Terminal` window, type `wicd-gtk`:


    ```bash

    wicd-gtk --no

    ```


    27


    ![](images/00030.jpeg)


    Up and Running with Kali Linux


    2. `Wicd Manager` will open with a list of available networks:


    3. Click `Properties` to specify the network details.


    4. Finally, click `Connect`. We''re ready to go!


    28


    ![](images/00031.jpeg)


    Chapter 1


    ### How it works...


    In this recipe, we concluded the setup of our wireless network. This recipe began
    by starting the network manager and connecting to our router.


    29


    ![](images/00004.jpeg)


    Up and Running


    Kali Linux comes with several network services which may be useful in various
    situations and are disabled by default. In this recipe, we will cover the steps
