    # Wireless Attacks


    In this chapter, we will cover:


    - Wireless network WEP cracking

    - Wireless network WPA/WPA2 cracking

    - Automating wireless network cracking

    - Accessing clients using a fake AP

    - URL traffic manipulation

    - Port redirection

    - Sniffing network traffic


    ## Introduction


    These days, wireless networks are everywhere. With users being on the go like
    never before, having to remain stationary because of having to plug into an Ethernet
    cable to gain Internet access is not feasible. For this convenience, there is
    a price to be paid; wireless connections are not as secure as Ethernet connections.
    In this chapter, we will explore various methods for manipulating radio network
    traffic including mobile phones and wireless networks.


    ![](images/00005.jpeg)

    ![](images/00209.jpeg)


    ## Wireless network WEP cracking


    Wireless Equivalent Privacy, or `WEP` as it is commonly referred to, has been
    around since 1999 and is an older security standard that was used to secure wireless
    networks. In 2003, WEP was replaced by WPA and later by WPA2. Due to having more
    secure protocols available, WEP encryption is rarely used. As a matter of fact,
    it is highly recommended that you never use WEP encryption to secure your network!
    There are many known ways to exploit WEP encryption and we will explore one of
    those ways in this recipe. In this recipe, we will use the AirCrack suite to crack
    a WEP key. The AirCrack-suite (or `Aircrack-ng` as it''s commonly referred to)
    is a WEP and WPA key cracking program that captures network packets, analyzes
    them, and uses this data to crack the WEP key.


    ### Getting ready


    In order to perform the tasks of this recipe, experience with the Kali terminal
    window is required. A supported wireless card configured for packet injection
    will also be required. In case of a wireless card, packet injection involves sending
    a packet, or injecting it onto an already established connection between two parties.
    Please ensure your wireless card allows for packet injection.


    ### How to do it...


    Let''s begin the process of using AirCrack to crack a network secured by WEP.


    1. Open a terminal window and bring up a list of wireless interfaces:

    ```

    airmon-ng

    ```

    2. Under the `interface` column, select one of your interfaces. In this case,
    we will use `wlan0`. If you have a different interface such as `mon0`, please
    substitute it at every location `wlan0` is mentioned.

    3. Next, we need to stop the `wlan0` interface and take it down so that we can
    change our MAC address in the next step.

    ```

    airmon-ng stop

    ifconfig wlan0 down

    ```

    ![](images/00210.jpeg)


    4. Next, we need to change the MAC address of our interface. Since the MAC address
    of your machine identifies you on any network, changing the identity of our machine
    allows us to keep our true address hidden. In this case, we will use `00:11:22:33:44:55`.

    ```

    macchanger --mac 00:11:22:33:44:55 wlan0

    ```

    5. Now we need to restart `airmon-ng`.

    ```

    airmon-ng start wlan0

    ```

    6. Next, we will use `airodump` to locate the available wireless networks.

    ```

    airodump-ng wlan0

    ```

    7. A listing of available networks will begin to appear. Once you find the one
    you want to attack, press `Ctrl+C` to stop the search. Highlight the MAC address
    in the `BSSID` column, right click your mouse, and select copy. Also, make note
    of the channel that the network is transmitting its signal upon. You will find
    this information in the `Channel` column. In this case, the channel is `10`.

    8. Now we run `airodump` and copy the information for the selected BSSID to a
    file. We will utilize the following options:

    - `-c` allows us to select our channel. In this case, we use `10`.

    - `-w` allows us to select the name of our file. In this case, we have chosen
    `wirelessattack`.

    - `-bssid` allows us to select our BSSID. In this case, we will paste `09:AC:90:AB:78`
    from the clipboard.

    ```

    airodump-ng -c 10 -w wirelessattack --bssid 09:AC:90:AB:78 wlan0

    ```

    9. A new terminal window will open displaying the output from the previous command.
    Leave this window open.

    10. Open another terminal window; to attempt to make an association, we will run
    `aireplay`, which has the following syntax: `aireplay-ng -1 0 -a [BSSID] -h [our
    chosen MAC address] -e [ESSID] [Interface]`.

    ```

    aireplay-ng -1 0 -a 09:AC:90:AB:78 -h 00:11:22:33:44:55 -e backtrack wlan0

    ```

    11. Next, we send some traffic to the router so that we have some data to capture.
    We use `aireplay` in the following format: `aireplay-ng -3 -b [BSSID] - h [Our
    chosen MAC address] [Interface]`.

    ```

    aireplay-ng -3 -b 09:AC:90:AB:78 -h 00:11:22:33:44:55 wlan0

    ```

    12. Your screen will begin to fill with traffic. Let this process run for a minute
    or two until we have information to run the crack.


    ![](images/0211.jpeg)


    13. Finally, we run AirCrack to crack the WEP key.

    ```

    aircrack-ng -b 09:AC:90:AB:78 wirelessattack.cap

