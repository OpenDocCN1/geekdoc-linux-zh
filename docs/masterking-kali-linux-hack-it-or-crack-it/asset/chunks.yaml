    shell。你可以使用第 6 章“利用漏洞”中的任意一个配方，通过 `Metasploit` 访问主机。


    1. 一旦你使用带有 `Meterpreter` 负载的 `Metasploit` 漏洞访问了受害者，等待你的 `Meterpreter` 提示符显示：

    2. 接下来，我们执行以下命令开始键键记录：

    ```bash

    keyscan_start

