    ## Using rainbow tables

    In this recipe, we will learn about how to use rainbow tables with Kali. Rainbow
    tables are special dictionary tables that use hash values instead of standard
    dictionary passwords to achieve the attack. For our demonstration purposes, we
    will use `RainbowCrack` to generate our rainbow tables.


    ### How to do it...

    1. Open a terminal window and change directories to the directory of `rtgen`:

    ```bash

    cd /usr/share/rainbowcrack/

    ```

    2. Next we are going to run `rtgen` to generate an MD5-based rainbow table:

    ```bash

    ./rtgen md5 loweralpha-numeric 1 5 0 3800 33554432 0

    ```


    ![](images/00204.jpeg)


    # Password Attacks


    3. Once your tables have been generated—a process that depends on the number of
    processors being used to generate the hashes (2-7 hours)—your directory will contain
    `*.rt` files.

    4. To begin the process of cracking the passwords, we will use `thersort` program
    to sort the rainbow tables to make it an easy process.


    ## How it works...

    In this recipe, we used various `RainbowCrack` tools to generate, sort, and crack
    an MD5 password. `RainbowCrack` works by brute-forcing hashes based upon precomputed
    hash values using rainbow tables. We began this recipe by generating an MD5 rainbow
    table using lowercase, alphanumeric values. By the end of the recipe, we achieved
    success by creating our rainbow tables to utilize it against a hash file.


    ## Using nVidia Compute Unified Device Architecture (CUDA)

    In this recipe, we will use the `nVidia Compute Unified Device Architecture (CUDA)`
    to crack password hashes. `CUDA` is a parallel computing platform that increases
    computing performance by harnessing the power of the GPU. As time has passed,
    GPU processing power has increased dramatically which allows us the ability to
    use it for our computational purposes. For demonstration purposes, we will use
    `OclHashcat-lite` to crack the passwords.


    ### Getting ready

    An `nVidia CUDA` supported graphics card is required to complete this recipe.


    ### How to do it...

    1. Open a terminal window and change to the directory that contains `OclHashcat`:

    ```bash

    cd /usr/share/oclhashcat-plus

    ```


    ![](images/00205.jpeg)


    2. Execute the following command to launch the `cudaHashcat-lite-help` file:

    ```bash

    ./cudaHashcat-plus.bin -help

    ```

    3. The syntax for running `OclHashcat` is in the form of `cudaHashcat-plus64.bin
    [options] hash [mask]`.

    One of the important aspects of using `OclHashcat` is to understand its character-set
    structure.

    4. Before we deploy our attack, let''s view some of the available attack vectors
    we can specify. `OclHashcat` utilizes left and right masks with its attacks. The
    characters of a password are divided into masks and are divided evenly to make
    a right and a left mask. For each side of the mask, you can specify either a dictionary
    or a charset. For our purposes, we will use a customized charset.

    5. To specify a custom charset, we use the `-1` option. We can have as many charsets
    as we want as long as you specify them with a number (`1-n`). Each custom character
    is represented by a question mark (`?`) and is followed by the type of character
    expected. The options available are:

    - `d` specifies the use of digits (0-9)

    - `l` specifies a lower case character

    - `u` specifies an upper case character

    - `s` specifies special characters

    - `1-n` specifies a custom charset to use as a placeholder

    6. So to put it all together, we will specify a character set that will include
    special characters (`s`), upper case characters (`u`), lower case characters (`l`),
    and digits (`d`) on an expected 8 character password. We are going to specify
    a hashlist called `attackfile`.

    ```bash

    ./cudaHashcat-plus64.bin attackfile -1 ?l?u?d?s ?1?1?1?1 ?1?1?1?1

    ```

    7. We can break down the preceding command as follows:

    - `./cudaHashcat-plus64.bin` calls `cudaHashcat`

    - `attackfile` is our `attackfile`

    - `-1 ?l?u?d?s` specifies a custom charset, with options of lowercase, digits,
    and special characters

    - `?1?1?1?1` is our left mask using charset

    - `?1?1?1?1` is our right mask using charset

    That''s it!


    ![](images/00206.jpeg)


