    ```bash

    mv explorer.exe healthyfiles

    ```

    4. 现在我们已经有了 `healthyfiles`，我们将将其压缩：

    ```bash

    zip healthyfiles

    ```

    5. 在这种情况下，我们可以将其放在 U 盘中并在受害者机器上打开。我们也可以通过电子邮件系统分发。


