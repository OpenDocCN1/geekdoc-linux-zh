    在本配方中，我们探索了 `SET` 的用法。`SET` 拥有一个菜单，可以简单地生成用于欺骗受害者的工具。在配方的最后，`SET` 为我们提供了结果。


    更多内容...


    # 将负载交付给受害者


    将负载交付给受害者的步骤如下：


    1. 在 `SET` 中，你会注意到有一个执行文件 `msf.exe`。为了避免检测，我们将其重命名为 `explorer.exe`：

    ```bash

    mv msf.exe explorer.exe

    ```

    2. 然后我们列出目录下的所有项：

    ```bash

