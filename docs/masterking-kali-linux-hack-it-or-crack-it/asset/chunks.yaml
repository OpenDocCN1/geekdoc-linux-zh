    - `use module`: This command allows you to begin configuring the module that you
    have chosen

    - `set optionname module`: This command allows you to set the various options
    for a given module

    - `exploit`: This command launches the exploit module

    - `run`: This command launches a non-exploit module

    - `search module`: This command allows you to search for an individual module

    - `exit`: This command allows you to exit the `MSFCONSOLE`


    # Getting ready


    A connection to the Internet or internal network is required to complete this
    recipe.


    149 ![](images/00143.jpeg)


    # Exploiting Vulnerabilities


    ### How to do it...


    Let''s begin our exploration of the MSFCONSOLE:


    1. Open a command prompt.

    2. Launch the MSFCONSOLE by using the following command:

    ```

    msfconsole

    ```

    3. Search for all the available Linux modules by using the `search` command. It
    is always a good idea to search for our module each time we want to perform an
    action. The major reason for this is that between various versions of Metasploit,
    the path to the module may have changed:

    ```

    search linux

    ```

    4. Use the John the Ripper Linux Password Cracker module:

    ```

    use auxiliary/analyzse/jtr_linux

    ```


    150![](images/00144.jpeg)


    Chapter 6


    5. Show the available options of the module by using the following command:

    ```

    show options

    ```

    6. Now that we have a listing of options that we can run for this module, we can
    set individual options by using the `set` command. Let''s set the `JOHN_PATH`
    option:

    ```

    set JOHN_PATH /usr/share/metasploit-framework/data/john/wordlists/ password.lst

    ```

    7. Now to run our exploit we type in the `exploit` command:

    ```

    exploit

    ```


    ### There''s more...


    Once you have gained access to your host using the MSFCONSOLE, you must use Meterpreter
    in order to distribute your payloads. MSFCONSOLE manages your sessions, but Meterpreter
    does your actual payload and exploit engagements.


    # Mastering the Metasploit CLI (MSFCLI)


    In this recipe, we will explore the Metasploit CLI(MSFCLI). Metasploit requires
    the use of an interface in order to perform its tasks. The MSFCLI is such an interface.
    It is a good interface for learning Metasploit or testing/writing a new exploit.
    It also serves well in the case of using scripts and applying basic automation
    to tasks.


    One major issue with using the MSFCLI is that you can only open one shell at a
    time. You will also notice that as we are exploring some of our commands it functions
    a bit slower and is a little more complicated than the MSFCONSOLE. Finally, you
    have to know the exact exploit that you would like to run in order to use the
    MSFCLI. This can make it a little difficult for new penetration testers who are
    not familiar with the Metasploit list of exploits.


    151![](images/00145.jpeg)


    # Exploiting Vulnerabilities


    Some commands for MSFCLI are:


    - `msfcli`: This loads a list of all available exploits accessible to MSFCLI

    - `msfcli -h`: Displays the MSFCLI help file

    - `msfcli [PATH TO EXPLOIT] [options = value]`: This is the syntax for launching
    an exploit


    # Getting ready


    A connection to the Internet or internal network is required to complete this
    recipe.


    ### How to do it...


    Let''s begin our exploration of the Metasploit CLI:


    1. Start the Metasploit CLI (MSFCLI) using the following command. Please be patient
    as this may take a little bit of time depending on the speed of your system. Also
    note that as the MSFCLI loads, a list of available exploits will display.

    ```

    msfcli

    ```

    2. Display the MSFCLI help file:

    ```

    msfcli -h

    ```


    152![](images/00146.jpeg)


    Chapter 6


    3. For our demonstration, we will perform a Christmas Tree Scan. We will choose
    option A to display the modules advanced options:

    ```

    msfcli auxiliary/scanner/portscan/xmas A

    ```

    For more information on the Christmas Tree Scan, please review the following URL:

    http://en.wikipedia.org/wiki/Christmas_tree_packet


    153![](images/00147.jpeg)


    # Exploiting Vulnerabilities


    4. Additionally you can list a summary of the current module by using the `S`
    mode. The summary mode is a great way to see all of the options available to you
    for the exploit that you are trying to run. Many of the options are optional but,
    usually, a few are required which allows you to set the target or the port you
    are trying to launch the exploit against.

    ```

    msfcli auxiliary/scanner/portscan/xmas S

    ```

    5. To show a list of the available options, we use the `O` mode. The summary mode
    is a great way to see all of the options available to you for the exploit that
    you are trying to run. Many of the options are optional but, usually, a few are
    required which allows you to set the target or the port you are trying to launch
    the exploit against.

    ```

    msfcli auxiliary/scanner/portscan/xmas O

    ```

    6. Now to run our exploit, we use the `E` mode:

    ```

    msfcli auxiliary/scanner/portscan/xmas E

    ```


    154![](images/00148.jpeg)


    Chapter 6


    ### How it works...


    In this recipe, we began by launching the MSFCLI, searched for a module, then
    proceeded to execute. It''s important to know that Metasploit is divided into
    three parts:


    - **Vulnerabilities**: These are weaknesses, both known and unknown, that are
    contained against a particular application, software, or protocol.

    - **Exploits**: Exploits are modules that are set up to take advantage of the
    vulnerabilities found.

    - **Payloads**: Once an exploit has successfully run, a payload must be delivered
    to the attacked machine in order to create shells, run various commands, add users,
    and so on.


    155![](images/00149.jpeg)


    # Exploiting Vulnerabilities


    Once you have gained access to your host using the MSFCLI or MSFCONSOLE you must
    use Meterpreter in order to distribute your payloads. MSFCONSOLE manages your
    sessions, but Meterpreter does your actual payload and exploit engagements.


    ### See also


    - To learn more about Meterpreter, please see the Mastering Meterpreter section


    # Mastering Meterpreter


    Once you have gained access to your host using Armitage, MSFCLI, or MSFCONSOLE,
    you must use Meterpreter in order to distribute your payloads. MSFCONSOLE manages
    your sessions, but Meterpreter does your actual payload and exploit engagements.


    Some commands used with Meterpreter include:


    - `help`: This command will allow you to view the help file.

    - `background`: This command allows you to keep a Meterpreter session running
    in the background. The command will take you back to an MSF (Metasploit) prompt.

    - `download`: This command allows you to download a file from your victims machine.

    - `upload`: This command allows you to upload a file to your victim''s machine.

    - `execute`: This command allows you to run a command on your victim''s machine.

    - `shell`: This command allows you to run a Windows shell prompt on your victim''s
    machine (for Windows hosts only).

    - `session -i`: This command allows you to switch between sessions.


    # Getting ready


    The following requirement needs to be fulfilled:


    - A connection to the intranet or Internet

    - An active session to a target system created by Metasploit using either Armitage,
    MSFCLI, or MSFCONSOLE


    156![](images/00150.jpeg)


    Chapter 6


    ### How to do it...


    1. First we begin with an active session being displayed from the MSFCONSOLE.

