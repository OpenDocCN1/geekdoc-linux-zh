    # 1 Kali Linux 入门


    在本章中，我们将涵盖：

    * 安装到硬盘

    * 安装到带有持久内存的 USB 驱动

    * 在 VirtualBox 中安装

    * 安装 VMware Tools

    * 修复启动界面

    * 启动网络服务

    * 设置无线网络


    ## 简介


    Kali Linux，简称 Kali，是 Offensive Security 的最新 Linux 发行版。它是 BackTrack Linux 发行版的继承者。与大多数
    Linux 发行版不同，Kali Linux 用于渗透测试。渗透测试是通过模拟攻击来评估计算机系统或网络安全性的方法。在书中，我们将进一步探索 Kali Linux
    提供的许多工具。本章涵盖了 Kali Linux 在不同场景下的安装和设置，从插入 Kali Linux DVD 到配置网络。在本章及后续章节的所有操作中，我们将使用带有
    GNOME 64 位作为窗口管理器 (WM) 风格和架构的 Kali Linux (http://www.Kali.org/ downloads/)。书中未涵盖
    KDE 作为 WM 的用法；但您应该能够很顺利地完成这些操作。


