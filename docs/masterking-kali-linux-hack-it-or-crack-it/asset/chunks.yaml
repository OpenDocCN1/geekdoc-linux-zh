    WordPress 安装中的漏洞。`WPScan` 有多个参数，包括：


    - `-u <target domain name or url>`：`-u` 参数允许您指定目标域名。

    - `-f`：`-f` 参数允许您强制检查是否安装了 WordPress。

    - `-e [options]`：`-e` 参数允许您设置枚举。


    让我们开始使用 `WPScan` 的过程。


