- fmt: "\n# Up and Running with Kali Linux\n\n## Installing to a hard disk drive\n\
    \nThe installation to a disk drive is one of the most basic operations. The achievement\
    \ of this task will let us run Kali Linux without the DVD.\n\nPerforming the steps\
    \ covered in this recipe will erase your hard drive, making Kali Linux the primary\
    \ operating system on your computer.\n\n### Getting ready\n\nBefore explaining\
    \ the procedure, the following requirements need to be met:\n\n- A minimum of\
    \ 8 GB of free disk space for the Kali Linux install (although, we recommend at\
    \ least 25 GB to hold additional programs and wordlists generated with this book)\
    \ own- A minimum of 512MB of RAM\n- You can download Kali Linux at `http://www.kali.org/downloads/`\n\
    \nLet's begin with the installation.\n\n### How to do it...\n\n1. Begin by inserting\
    \ the Kali Linux Live DVD in the optical drive of your computer. You will ultimately\
    \ come to the Kali Linux Live DVDBoot menu. Choose `Graphical install`.\n\n![](images/00009.jpeg)\n\
    *Chapter 1*\n\n2. Choose your language. In this case, we chose `English`.\n\n\
    3. Choose your location. In this case, we chose `United States`.\n\n![](images/00010.jpeg)\n\
    *Up and Running with Kali Linux*\n\n4. Choose your keyboard configuration. In\
    \ this case, we chose `American English`.\n\n5. The next section to complete is\
    \ the network services section. Enter a hostname. In this case, we entered `Kali`.\n\
    \n![](images/00011.jpeg)\n*Chapter 1*\n\n6. Next, we have to enter a domain name.\
    \ In this case, we enter `kali.secureworks.com`.\n\n7. You will now be presented\
    \ with the opportunity to choose the password for the root user by entering a\
    \ password twice.\n\n![](images/00012.jpeg)\n*Up and Running with Kali Linux*\n\
    \n8. Choose your timezone. In this case, we chose `Eastern`.\n\n9. We are now\
    \ able to select our disk partition scheme. You will be presented with four options.\
    \ Choose `Guided - use entire disk`, as this allows for easy partitioning.\n\n\
    ![](images/00013.jpeg)\n*Chapter 1*\n\n10. At this step, you will need to acknowledge\
    \ that your entire disc will be erased. Click on `Continue`.\n\n11. Next, you\
    \ have the option of choosing one of three partitioning schemes: `All files in\
    \ one partition`, `Separate/home partition`, or `Separate/home/user/var, and /tmp`\
    \ partitions. Considering Kali is being used more so for penetration testing purposes,\
    \ a separation of partitions is not needed nor required (even though this is a\
    \ great idea for your main desktop Linux distribution). In this case, choose `All\
