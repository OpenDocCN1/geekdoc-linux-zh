    \n    Mastering Meterpreter\n\n    Metasploitable MySQL\n\n    Metasploitable\
    \ PostgreSQL\n\n    Metasploitable Tomcat\n\n    Metasploitable PDF\n\n   \
    \ Implementing browser_autopwn\n\nIntroduction\n\nOnce we have completed our vulnerability\
    \ scanning steps, we now have the knowledge necessary to attempt to launch exploits\
    \ against our target system(s). In this chapter,\n\nwe will examine using various\
    \ tools including the Swiss Army knife of testing systems, which is Metasploit.\
    \ ![](images/00005.jpeg)![](images/00005.jpeg)\n\n![](images/00135.jpeg)\n\nExploiting\
    \ Vulnerabilities\n\nInstalling and configuring Metasploitable\n\nIn this recipe,\
    \ we will install, configure, and start Metasploitable 2\\. Metasploitable is\
    \ a\n\nLinux-based operating system that is vulnerable to various Metasploit attacks.\
    \ It was designed by Rapid7, the owners of the Metasploit framework. Metasploitable\
    \ is an excellent way to get familiar with using Meterpreter.\n\nGetting ready\n\
    \nTo execute this recipe we will need the following:\n\n                 A connection\
    \ to the Internet\n\n    Available space on your VirtualBox PC\n\n    An unzipping\
    \ tool (in this case we are using 7-Zip on a Windows machine)\n\nHow to do it...\n\
    \nLet's begin the recipe by downloading Metasploitable 2\\. Getting the package\
    \ from SourceForge is going to be our safest option:\n\n1.   Download Metasploitable\
    \ 2 from the following link:http://sourceforge.net/\n\n projects/metasploitable/files/Metasploitable2/.\n\
    \n2.   Save the file to a location on your hard drive.\n\n3.   Unzip the file.\n\
    \n4.   Place the contents of the folder in a location where you store your virtual\
    \ disk files.\n\n5.   Open VirtualBox and click on theNew button:\n\n142\n\n![](images/00136.jpeg)\n\
    \nChapter 6\n\n6.   Click onNext.\n\n7.   Enter a name of Metasploitable 2 while\
    \ selecting anOperating System:ofLinux\n\n             andVersion:ofUbuntu, and\
    \ click onNext as shown in the following screenshot:\n\n143\n\n![](images/00137.jpeg)\n\
    \nExploiting Vulnerabilities\n\n8.   Select512 MBof RAM if you have it available\
    \ and click onNext:\n\n9.   Choose an existing disk and select the VDMK file from\
    \ where you downloaded it\n\n and saved the Metasploitable 2 folder:\n\n144\n\n\
    ![](images/00138.jpeg)\n\nChapter 6\n\n10\\. Your virtual disk window will look\
    \ as it does in the following screenshot. In this\n\ninstance, we do not need\
    \ to update the disK space at all. This is because when using\n\nMetasploitable,\
    \ you are attacking the system, not using it as an operating system.\n\n11\\.\
    \ Click onCreate:\n\n12\\. Start Metasploitable 2 by clicking on its name and\
    \ clicking on theStart button.\n\n145\n\n![](images/00139.jpeg)\n\nExploiting\
    \ Vulnerabilities\n\nHow it works...\n\nIn this recipe, we set up Metasploitable\
    \ 2 on Virtualbox. We began the recipe by downloading Metasploitable fromSourceforge.net.\
    \ Next, we configured the VDMK to run inside of Virtualbox and concluded by starting\
    \ the system.\n\nMastering Armitage, the graphical\n\nmanagement tool for Metasploit\n\
    \nThe newer versions of Metasploit utilize a graphical front end tool called Armitage.\n\
    \nUnderstanding of Armitage is important because it ultimately makes your usage\
    \ of Metasploit easier by providing information to you visually. It encompasses\
    \ the Metasploit Console and, by using its tabbing capabilities, allows you to\
    \ see more than one Metasploit Console or\n\nMeterpreter session at a time.\n\n\
    Getting ready\n\nA connection to the Internet or internal network is required\
    \ to complete this recipe.\n\nHow to do it...\n\nLet's begin our review of Armitage:\n\
    \n1.   From the desktop go toStart|Kali Linux|Exploitation Tools|Network\n\n Exploitation\
    \ Tools|Armitage:\n\n146\n\n![](images/00140.jpeg)\n\nChapter 6\n\n2.   On the\
    \ Armitage login screen, click on theConnect button:\n\n147\n\n![](images/00141.jpeg)\n\
    \nExploiting Vulnerabilities\n\n3.   It may take Armitage a while to connect to\
    \ Metasploit. While this takes place,\n\nyou may see the following notification\
    \ window. Do not be alarmed. It will go away\n\nonce Armitage is able to connect.\
    \ On theStart Metaspoit?screen, click onYes:\n\n4.   You are then presented with\
    \ the Armitage main screen. We will now discuss\n\nthe following three regions\
    \ on the main screen (marked asA.,B., andC. in the following screenshot):\n\n\
     A: This region displays the preconfigured modules. You can search for\n\n modules\
    \ using the space provided below the modules list.\n\n B: This region displays\
    \ your active targets that we are able to run our\n\n exploits against.\n\n C:\
    \ This region displays multiple Metasploit tabs allowing for multiple\n\nMeterpreter\
    \ or console sessions to be run and displayed simultaneously.\n\n148\n\n![](images/00142.jpeg)\n\
    \nChapter 6\n\nAn alternative way to launch Armitage is to type the following\
    \ command into a terminal window:\n\narmitage\n\nSee also\n\n    To learn more\
    \ about Meterpreter, please see theMastering Meterpreter section\n\nMastering\
    \ the Metasploit Console (MSFCONSOLE)\n\nIn this recipe, we will examine theMetasploit\
    \ Console(MSFCONSOLE). The MSFCONSOLE is primarily used to manage the Metasploit\
    \ database, manage sessions, and configure and launch Metasploit modules. Essentially,\
    \ for the purposes of exploitation, the MSFCONSOLE will get you connected to a\
    \ host so that you can launch your exploits against it.\n\nSome common commands\
    \ you will use when interacting with the console are:\n\n    help: This command\
    \ will allow you to view the help file for the command you are\n\n trying to run"
