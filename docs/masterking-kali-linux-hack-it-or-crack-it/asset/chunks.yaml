    ## 7 Escalating Privileges


    Escating Privileges


    In this chapter, we will cover:


    - Using impersonation tokens

    - Local privilege escalation

    - Mastering the Social Engineering Toolkit (SET)

    - Collecting the victim''s data

    - Cleaning up tracks

    - Creating a persistent backdoor

    - Man In Middle (MITM) attack


    ### Introduction


    Once we have access to the computer, it''s important that we escalate our privileges
    as much as possible. Generally, we gain access to a user with low privileges;
    in this chapter we will explore various ways.


    Using impersonation tokens


    In this recipe, we will impersonate another user. Tokens contain the security
    information for a login and identifies the user, the groups, and the user''s privileges.
    When a user logs into a system, they are given an access token. Token impersonation
    allows us to escalate our privileges.


    ### Escalating Privileges


    ### Getting ready


    To execute this recipe we will need:


    - A connection to the Internet or intranet

    - A victim machine is also required


    ### How to do it...


    We begin our exploration of impersonation tokens from a `Meterpreter` shell. You
    will have to use Metasploit to attack a host in order to gain a `Meterpreter`
    shell. You can use one of the recipes in Chapter 6, Exploiting Vulnerabilities,
    to gain access to a host.


    1. From Meterpreter we can begin the impersonation process by using `incognito`:


    ```bash

    use incognito

    ```


    2. Display the help for `incognito` by issuing the `help` command:


    ```bash

    help

    ```


    3. You will notice that we have several options available.

    4. Next we want to get a list of available users who are currently logged into
    the system or have had access to the system recently. We do this by executing
    the `list_tokens` command with the `-u` option:


    ```bash

    list_tokens -u

    ```


