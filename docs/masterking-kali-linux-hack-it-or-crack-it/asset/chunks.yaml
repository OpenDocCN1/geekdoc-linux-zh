    5 # Vulnerability Assessment


    In this chapter, we will cover:

    - Installing, configuring, and starting Nessus

    - Nessus - finding local vulnerabilities

    - Nessus - finding network vulnerabilities

    - Nessus - finding Linux-specific vulnerabilities

    - Nessus - finding Windows-specific vulnerabilities

    - Installing, configuring, and starting OpenVAS

    - OpenVAS - finding local vulnerabilities

    - OpenVAS - finding network vulnerabilities

    - OpenVAS - finding Linux-specific vulnerabilities

    - OpenVAS - finding Windows-specific vulnerabilities


    ## Introduction


    Scanning and identifying vulnerabilities on our targets is often considered one
    of the more tedious tasks by most penetration testers and ethical hackers. However,
    it''s one of the most important. This should be considered your homework phase.
    Just like in school, the homework and quizzes are designed so that you can show
    mastery for your exam.


    Vulnerability identification allows you to do your homework. You will learn about
    what vulnerabilities your target is susceptible to so you can make a more polished
    set of attacks. In essence, if the attack itself is the exam, then vulnerability
    identification allows you a chance to prepare. ![](images/00005.jpeg)!


    ![](images/00090.jpeg)


    ## Vulnerability Assessment


    Both Nessus and OpenVAS have similar sets of vulnerabilities that they can scan
    for on a target host. These vulnerabilities include:

    - Linux vulnerabilities

    - Windows vulnerabilities

    - Local security checks

    - Network service vulnerabilities


    ### Installing, configuring, and starting Nessus


    In this recipe, we will install, configure, and start Nessus. Nessus depends on
    vulnerability checks in the form of feeds in order to locate vulnerabilities on
    our chosen target. Nessus comes in two flavors of feeds: Home and Professional.


    - `Home Feed`: The Home Feed is for noncommercial/personal usage.

    - `Professional Feed`: The Professional Feed is for commercial usage. It includes
    support and additional features such as unlimited connections and so on. If you
    are a consultant and are performing tests for a client, the Professional Feed
    is the one for you.


    For our recipe, we will assume you are utilizing the Home Feed.


    ## Getting ready


    The following requirements need to be fulfilled:

    - A connection to the Internet is required to complete this recipe


    ## How to do it...


    Let''s begin the installation, configuring, and starting of Nessus by opening
    a terminal window:


    1. Open the IceWeasel web browser and navigate to the following URL:http://www.tenable.com/products/nessus/select-your-operating-system`.

    2. On the left-hand side of the screen, under Download Nessus, select Linux and
    then (at least as of writing) choose `Nessus-5.2.1-debian6_amd64.deb`.

    3. Download the file to your local root directory.


    94

    ![](images/00091.jpeg)

    # Chapter 5


    ## Vulnerability Assessment


    4. Open a terminal window.

    5. Execute the following command to install Nessus:

    ```bash

    dpkg -i "Nessus-5.2.1-debian6_i386.deb"

    ```

    The output of the preceding command will be as follows:

    6. Nessus will be installed under the `/opt/nessus` directory.

    7. Once the installation completes, you can run Nessus by typing the following
    command:

    ```bash

    /etc/init.d/nessusd start

    ```

    Before you can begin using Nessus, you must have a registration code. You can
    get more information on how to do this from the following There''s more... section.


    8. Enable your Nessus install by executing the following command:

    ```bash

    /opt/nessus/bin/nessus-fetch --register XX-XXXX-XXXX-XXXX-XXXX

    ```

    In this step, we will also grab the latest plugins fromhttp://plugins.nessus.org.

    Depending on your Internet connection, this may take a minute or two.


    96

