    # Kali Linux 快速上手


    ## 安装到硬盘


    到磁盘驱动器是最基本的操作之一。完成此任务后，我们可以在没有 DVD 的情况下运行 Kali Linux。


    执行本教程中涵盖的步骤将擦除您的硬盘，使 Kali Linux 成为计算机上的主操作系统。


    ### 准备工作


    在解释步骤之前，需要满足以下要求：


    - 安装 Kali Linux 至少需要 8 GB 空闲磁盘空间（尽管我们建议至少准备 25 GB，以存储随本书生成的额外程序和词汇表）

    - 至少 512MB 内存

    - 您可以在 `http://www.kali.org/downloads/` 下载 Kali Linux


    让我们开始安装。


    ### 操作方法……


    1. 起初，将 Kali Linux Live DVD 插入电脑的光驱器。您最终将进入 Kali Linux Live DVDBoot 菜单。选择 `Graphical
    install`（图形化安装）。


    ![](img/00009.jpeg)

    *第 1 章*


    2. 选择您的语言。在本例中，我们选择了 `English`（英语）。


    3. 选择您的位置。在本例中，我们选择了 `United States`（美国）。


    ![](img/00010.jpeg)

    *Up and Running with Kali Linux*


    4. 选择您的键盘配置。在本例中，我们选择了 `American English`（美英语）。


    5. 下一个需要完成的部分是网络服务。输入主机名。在本例中，我们输入了 `Kali`。


    ![](img/00011.jpeg)

    *第 1 章*


    6. 接下来，我们必须输入域名。在本例中，我们输入了 `kali.secureworks.com`。


    7. 现在您将有机会通过输入两次密码来为 root 用户设置密码。


    ![](img/00012.jpeg)

    *Up and Running with Kali Linux*


    8. 选择您的时区。在本例中，我们选择了 `Eastern`（东部地区）。


    9. 我们现在可以选择磁盘分区方案了。您将看到四个选项。选择 `Guided - use entire disk`（引导式 - 使用整个磁盘），因为这允许于分区。


    ![](img/00013.jpeg)

    *第 1 章*


    10. 在这一步，您需要确认您的整个磁盘将被擦除。点击 `Continue`（继续）。


    11. 接下来，您可以选择三种分区方案之一：`All files in one partition`（所有文件在一个分区）、`Separate/home partition`（单独的
    home 分区）或 `Separate/home/user/var, and /tmp` 分区。考虑到 Kali 更多用于渗透测试，不需要也不要求分离分区（尽管对于您的主桌面
    Linux 发行版来说这是一个很棒的主意）。在本例中，选择 `All files in one partition` 并点击 `Continue`。


    ![](img/00014.jpeg)

    *Up and Running with Kali Linux*


    12. 一旦您进入提示即将对磁盘进行更改的屏幕，选择 `Yes`（是）并点击 `Continue`。请注意，这是撤销（防止磁盘上所有数据被覆盖）的最后机会。


    13. 接下来，系统会询问您是否要连接到网络镜像。网络镜像允许您在 Kali 更新可用时接收这些更新。在本例中，我们选择 `Yes` 并点击 `Continue`。


    ![](img/00015.jpeg)

    *第 1 章*


    14. 您可以通过点击 `Continue` 跳过 HTTP 代理页面。


    15. 最后，系统会要求您将 `GRUB` 引导加载程序安装到主引导记录。选择 `Yes` 并点击 `Continue`。


    ![](img/00016.jpeg)

    *Up and Running with Kali Linux*


    16. 您现在已完成 Kali Linux 的安装！恭喜你！点击 `Continue`，系统将重启并将您带到登录页面。


    ## 安装到带有持久性内存的 USB 驱动器


    拥有 Kali Linux USB 驱动器使我们能够持久地保存系统设置，并在 USB 设备上永久地更新和安装新的软件包软件包，使我们能够随时随身携带自己的个性化
    Kali Linux。


    得益于 `Win32 Disk Imager` 等工具，我们可以为大多数 Linux 发行版创建可启动的 Live USB 盘，包括带有持久存储的 Kali
    Linux。


    ### 准备工作


    为了继续，需要以下工具和准备：


    - 一个容量至少为 8 GB 的 FAT32 格式 USB 驱动器

    - 一个 Kali Linux 镜像副本

    - `Win32 Disk Imager` (`http://sourceforge.net/projects/win32diskimager/`)

    - 从 `http://www.kali.org/downloads/` 下载 Kali Linux ISO 镜像


    ![](img/00017.jpeg)

    *第 1 章*


    ### 操作方法……


    1. 启动 `Win32 Disk Imager`：插入已格式化的 USB 驱动器。

    2. 启动 `Win32 Imager`。

    3. 在 File location（文件位置）处，点击文件夹图标并选择 Kali Linux 镜像：


    ![](img/00018.jpeg)

    *Up and Running with Kali Linux*


    4. 确保重启后使用的空间设置为 4096。

    5. 选择新创建的 USB 驱动器。

    6. 在提取和安装引导加载程序期间过程将需要一些时间。


    ![](img/00019.jpeg)

    *第 1 章*


    7. 设置虚拟磁盘的位置和大小。

    8. 检查设置是否正确并点击 `Create`（创建）开始创建虚拟磁盘文件。

    9. 我们回到了之前的向导，显示虚拟机参数的摘要。点击 `Create` 完成：

    10. 新虚拟机已创建，我们准备好安装 Kali Linux 了。


    ![](img/00020.jpeg)

    *Up and Running with Kali Linux*


    11. 在 VirtualBox 主窗口中，选中 `Kali Linux`，然后点击 `Settings`（设置）按钮：

    12. 现在已经遵循了基本的安装步骤，我们将继续允许您使用下载的 ISO 文件作为虚拟磁盘。这将让您无需刻录物理光盘即可完成安装。在 `Settings`
    屏幕上，点击 `Storage`（存储）菜单选项：

    13. 接下来，在 `Storage Tree`（存储树）下，选中 `IDE Controller` 下方的 `Empty`（空）图标。这选择了我们的虚拟光驱/DVD
    驱动器。在屏幕最右侧，在


    '
