    \ toWindows Vulnerabilities Scan.\n\n3.   Click on the download arrow to view\
    \ the report:\n\n139\n\n![](images/00004.jpeg)\n\n6\n\nExploiting\n\nVulnerabilities\n\
    \nIn this chapter, we will cover:\n\n    Installing and configuring Metasploitable\n\
