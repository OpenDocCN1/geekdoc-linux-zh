    # 4


    ## Information Gathering


    In this chapter, we will cover:

    * Service enumeration

    * Determining network range

    * Identifying active machines

    * Finding open ports

    * Operating system fingerprinting

    * Service fingerprinting

    * Threat assessment with Maltego

    * Mapping the network


    ## Introduction


    One of the most important stages of an attack is information gathering. To be
    able to launch an attack, we need to gather basic information about our target.
    So, the more information we get, the higher the probability of a successful attack.


    I also want to emphasize an important aspect of this stage, and it''s the documentation.


    The latest Kali release available at the time of writing this book includes a
    few tools to help us collate and organize the data from the target, allowing us
    to get a better reconnaissance. Tools such as `Maltego CaseFile` and `KeepNote`
    are examples of it. ![](images/00005.jpeg)![](images/00005.jpeg)


    ![](images/00065.jpeg)


    # Information Gathering


    ## Service enumeration


    In this recipe, we will perform a few service enumeration tricks. Enumeration
    is a process that allows us to gather information from a network. We will examine
    `DNS enumeration` and `SNMP enumeration` techniques. DNS enumeration is the process
    of locating all DNS servers and DNS entries for an organization. DNS enumeration
    will allow us to gather critical information about the organization such as usernames,
    computer names, IP addresses, and so on. To achieve this task, we will use `DNSenum`.
    For SNMP enumeration, we will use a tool called `SnmpEnum`. `SnmpEnum` is a powerful
    SNMP enumeration tool that allows users to analyze SNMP traffic on a network.


    ### How to do it...


    Let''s start by examining the DNS enumeration:


    1. We will utilize `DNSenum` for DNS enumeration. To start a DNS enumeration,
    open the Gnome terminal and enter the following command:

    ```bash

    cd /usr/bin

    ./dnsenum --enum adomainnameontheinternet.com

    ```

    Please do not run this tool against a public website that is not your own and
    is not on your own servers. In this case, we used `domainnameontheinternet.com`
    as an example and you should replace this with your target. Be careful!


    2. We should get an output with information like host, name server(s), mail server(s),
    and if we are lucky, a zone transfer:


    68

    ![](images/00066.jpeg)


    3. There are some additional options we can run using `DNSenum` and they include
    the following:

    * `-- threads [number]` allows you to set how many processes will run at once

    * `-r` allows you to enable recursive lookups

    * `-d` allows you to set the time delay in seconds between WHOIS requests

    * `-o` allows us to specify the output location

    * `-w` allows us to enable the WHOIS queries


    For more information on WHOIS, please visit the following URL: http://en.wikipedia.org/wiki/Whois


    69

    ![](images/00067.jpeg)


    4. Another command we can use to examine a Windows host is `snmpwalk`. `snmpwalk`
    is an SNMP application that uses `SNMP GETNEXT` requests to query a network entity
    for a tree of information. From the command line, issue the following command:

    ```bash

    snmpwalk -c public 192.168.10.200 -v 2

    ```

    5. We can also enumerate the installed software:

    ```bash

    snmpwalk -c public 192.168.10.200 -v 1 | grep InstalledName

    HOST-RESOURCES-MIB::InstalledName.1 = "VMware Tools"

    HOST-RESOURCES-MIB::InstalledName.2 = "WebFiles"

    ```

    6. And also the open ports using the same tool:

    ```bash

    snmpwalk -c public 192.168.10.200 -v 1 | grep tcpState | cut -d "." -f6 | sort
    -nu

    ```

    21

    25

    80

    43

    7. Another utility to get information via SNMP is `snmpcheck`:

    ```bash

    cd /usr/bin

    snmpcheck -t 192.168.10.200

    ```

    8. To perform a domain scan with `fierce`—a tool that tries multiple techniques
    to find all the IP addresses and hostnames used by a target—we issue the following
    command:

    ```bash

    cd /usr/bin

    fierce -dns domainnameontheinternet.com

    ```

    Please do not run this tool against a public website that is not your and is not
    on your own servers. In this case, we used `domainnameontheinternet.com` as an
    example and you should replace this with your target. Be careful!


    9. To perform the same operation, but with a supplied word list, type the following
    command:

    ```bash

    fierce -dns domainnameontheinternet.com -wordlist hosts.txt -file /tmp/output.txt

    ```

    70

    ![](images/00068.jpeg)


    10. To start an SMTP enumeration of the users on an SMTP server, enter the following
    command:

    ```bash

    smtp-user-enum -M VRFY -U /tmp/users.txt -t 192.168.10.200

    ```

