  trans: "\n7. 对于发现的家族，在 `Select all NVT's`（选择所有 NVT）框中打钩。\n\n所选漏洞有：\n- 暴力攻击\n- 缓冲区溢出\n\
    - 合规性\n- 凭据\n- 数据库\n\n135\n![](img/00131.jpeg)\n\n### 漏洞评估\n- 默认账户\n- 拒绝服务\n-\
    \ FTP\n- 远程获取 shell\n- 通用\n- 恶意软件\n- NMAP NSE\n- 端口扫描器\n- 权限提升\n- 产品检测\n- RPC\n\
    - 远程文件访问\n- SMTP 问题\n- SNMP\n- 服务检测\n- Web 服务器\n- Windows\n- Windows: 微软安全公告 (Microsoft\
    \ Bulletins 处通常保留英文或译为 Windows: Microsoft Bulletins)\n\n136\n![](img/00132.jpeg)\n\
    \n### 第 5 章\n8. 点击 `Save Config`（保存配置）。\n9. 现在进入 `Configuration|Targets`（配置|目标）：\n\
    10. 创建新目标并执行以下任务：\n    1. 输入目标名称。\n    2. 使用以下方法之一输入主机：\n        - 仅输入一个地址：`192.168.0.10`\n\
    \        - 输入用 `,` 隔开的多个地址：`192.168.0.10,192.168.0.115`\n        - 输入地址范围：`192.168.0.1-20`\n\
    11. 点击 `Save Target`（保存目标）。\n12. 现在进入 `Scan Management|New Task`（扫描管理|新任务），并执行以下任务：\n\
    \    1. 输入任务名称。\n    2. 输入注释（可选）。\n    3. 选择你的扫描配置。在此情况下选择 `Windows Vulnerabilities`（Windows\
    \ 漏洞）。\n    4. 选择扫描目标。在此情况下选择 `Local Network`（本地网络）。\n    5. 将所有其他选项保持默认级别。\n\n\
    137\n![](img/00133.jpeg)\n\n### 漏洞评估\n6. 点击 `onCreate Task`（创建任务）：\n13. 现在进入 `Scan\
    \ Management|Tasks`（扫描管理|任务）。\n14. 点击我们扫描旁边的播放按钮。在此情况下为 `Windows Vulnerability\
    \ Scan`（Windows 漏洞扫描）。\n\n#### 工作原理...\n在本教程中，我们启动了 OpenVAS 并登录了它的 Web 界面。然后，我们配置了\
    \ OpenVAS 来搜索一组 Windows 漏洞。最后，我们选择了我们的目标并完成了扫描。OpenVAS 随后根据我们的 NVT 馈送中包含的已知漏洞列表对目标系统进行了扫描。\n\
    \n138\n![](img/00134.jpeg)\n\n### 第 5 章\n#### 更多内容...\n一旦完成扫描，你就可以通过查看报告查看结果：\n\
    1. 进入 `Scan Management | Tasks`（扫描管理 |任务）。\n2. 点击 `Windows Vulnerabilities Scan`\
    \ 旁边的紫色放大镜。\n3. 点击下载箭头查看报告：\n\n139\n![](img/00004.jpeg)\n\n# 6 漏洞利用\n\n在本章中，我们将涵盖：\n\
    - 安装和配置 Metasploitable\n- 掌握 Armitage（这是 Metasploit 的图形化管理工具）\n- 掌握 Metasploit\
    \ 控制台 (`MSFCONSOLE`)\n- 掌握 Metasploit CLI (`MSFCLI`)\n- 掌握 Meterpreter\n- Metasploitable\
    \ MySQL\n- Metasploitable PostgreSQL\n- Metasploitable Tomcat\n- Metasploitable\
    \ PDF\n- 实现 `browser_autopwn`\n\n## 介绍\n一旦我们完成了漏洞扫描步骤，我们现在就拥有了尝试针对我们的目标系统启动利用程序所需的知识。在本章中，我们将检查使用各种工具，包括测试系统的“瑞士军刀”——Metasploit。![](img/00005.jpeg)![](img/00005.jpeg)\n\
    \n![](img/00135.jpeg)\n\n### 漏洞利用\n#### 安装和配置 Metasploitable\n在本教程中，我们将安装、配置并启动\
    \ Metasploitable 2。Metasploitable 是一个基于 Linux 的操作系统，容易受到各种 Metasploit 攻击。它由 Metasploit\
    \ 框架的所有者 Rapid7 设计。Metasploitable 是熟悉 Meterpreter 的绝佳方式。\n\n##### 准备工作\n执行此教程我们需要：\n\
    - 与互联网的连接\n- 你的 VirtualBox PC 上的可用空间\n- 一个解压缩工具（在本例中我们在 Windows 机器上使用 7-Zip）\n\
    \n##### 如何操作...\n让我们从下载 Metasploitable 2 开始教程。从 SourceForge 获取程序包将是我们最安全的选择：\n\
    1. 从以下链接下载 Metasploitable 2：`http://sourceforge.net/projects/metasploitable/files/Metasploitable2/`\n\
    2. 将文件保存到硬盘上的某个位置。\n3. 解压文件。\n4. 将文件夹的内容存放在你存储虚拟磁盘的位置。\n5. 打开 VirtualBox 并点击 `New`（新建）按钮：\n\
    \n142\n![](img/00136.jpeg)\n\n### 第 6 章\n6. 点击 `Next`（下一步）。\n7. 选择 `Operating\
    \ System: Linux`（操作系统: Linux）和 `Version: Ubuntu`（版本: Ubuntu）的同时输入名称 `Metasploitable\
    \ 2`，并如下所示所示 `Next`：\n143\n![](img/00137.jpeg)\n\n### 漏洞利用\n8. 如果你有可用内存，选择 `512\
    \ MB` 的 RAM 并点击 `Next`：\n9. 选择一个现有磁盘，并从你下载和保存 `Metasploitable 2` 文件夹的地方选择 VDMK\
    \ 文件：\n144\n![](img/00138.jpeg)\n\n### 第 6 章\n10. 你的虚拟磁盘窗口将如下截图所示。在这种情况下，我们完全不需要更新磁盘空间。这是因为使用\
    \ Metasploitable 时，你是在攻击系统，而不是将其作为操作系统使用。\n11. 点击 `Create`（创建）：\n12. 点击它的名称并点击\
    \ `Start`（启动）按钮启动 Metasploitable 2。\n\n145\n![](img/00139.jpeg)\n\n### 漏洞利用\n\
    #### 工作原理...\n在本教程中，我们在 Virtualbox 上设置了 Metasploitable 2。我们从 sourceforge.net 下载\
    \ Metasploitable 开始教程。接下来，我们配置了 VDMK 在 virtualbox 内部运行，并以启动系统结束。\n\n#### 掌握 Armitage，这是\
    \ Metasploit 的图形化管理工具\n较新版本的 Metasploit 使用了一个名为 Armitage 的图形化前端工具。理解 Armitage\
    \ 非常重要，因为它最终通过向你提供信息来让你对 Metasploit 的使用变得更容易。它包含了 Metasploit 控制台，并通过其标签页功能允许你同时查看多个\
    \ Metasploit 或 Meterpreter 会话。\n\n##### 准备工作\n完成此教程需要连接互联网或内部网络。\n\n##### 如何操作...\n\
    让我们开始学习 Armitage：\n1. 从桌面进入 `Start|Kali Linux|Exploitation Tools|Network Exploitation\
    \ Tools|Armitage`：\n\n146\n![](img/0140.jpeg)\n\n### 第 6 章\n2. 在 Armitage 登录界面，点击\
    \ `Connect`（连接）按钮：\n147\n![](img/0141.jpeg)\n\n### 漏洞利用\n3. Armitage 可能需要一段时间来连接\
    \ Metasploit。在此期间，你可能会看到此窗口。不要担心，当 Armitage 能够连接时它就会消失。在 `Start Metasploit` 屏幕上点击\
    \ `Yes`：\n4. 随后你将看到 Armitage 主界面。我们现在讨论主屏幕上的三个区域（如下截图所示标记为 `A.`、`B.` 和 `C.`）：\n\
    - `A.`：此区域显示预配置的模块。你可以使用模块列表下方的空间搜索模块。\n- `B.`：此区域显示我们能够运行利用程序的活动目标。\n- `C.`：此区域显示多个\
    \ Metasploit 标签页，允许同时运行和显示多个 Meterpreter 或控制台会话。\n\n148\n![](img/0142.jpeg)\n\n\
    ### 第 6 章\n启动 Armitage 的另一种方法是在终端窗口输入以下命令：\n```\narmitage\n```\n\n#### 参见\n- 要了解更多关于\
    \ Meterpreter 的信息，请参见掌握 Meterpreter 章节\n\n"
