    \    - Firewalls（防火墙）\n    - FreeBSD Local Security Checks（FreeBSD 本地安全检查）\n \
    \   - Gain a shell remotely（远程获取 shell）\n    - General（通用）\n    - Gentoo Local\
    \ Security Checks（Gentoo 本地安全检查）\n    - HP-UX Local Security Checks（HP-UX 本地安全检查）\n\
    \    - Mandriva Local Security Checks（Mandriva 本地安全检查）\n    - Misc（杂项）\n    -\
    \ Port Scanners（端口扫描器）\n    - Red Hat Local Security Checks（Red Hat 本地安全检查）\n\
    \    - SMTP Problems（SMTP 问题）\n    - SNMP\n    - Scientific Linux Security Checks（Scientific\
    \ Linux 安全检查）\n    - Slackware Local Security Checks（Slackware 本地安全检查）\n    -\
    \ Solaris Local Security Checks（Solaris 本地安全检查）\n    - SuSE Local Security Checks（SuSE\
    \ 本地安全检查）\n    - Ubuntu Local Security Checks（Ubuntu 本地安全检查）\n    - Web Servers（Web\
    \ 服务器）\n\n107\n![](img/0103.jpeg)\n漏洞评估\n\n6. 点击 `Update`（更新）保存你的新策略。\n7. 在主菜单上，点击\
    \ `Scan Queue`（扫描队列）选项。\n8. 按 `New Scan`（新建扫描）按钮执行以下任务：\n    1. 为你的扫描输入名称。如果你同时运行多个扫描，这非常有用。它可以区分当前运行的扫描。\n\
    \    2. 输入扫描类型：\n        - Run Now（立即运行）：默认启用，这将导致扫描立即执行\n        - Scheduled（计划）：允许你选择扫描执行的日期和\n\
    \        - Template（模板）：允许你将此扫描设置为模板\n    3. 选择扫描策略。在这种情况下，选择我们之前创建的 `Linux Vulnerabilities\
    \ Scan` 策略。\n\n108\n![](img/0104.jpeg)\n第 5 章\n\n4. 考虑以下几点选择你的目标：\n    - 目标必须每行输入\n\
    \    - 你也可以在每行输入目标范围\n    - 上传目标文件（如果有的话）或选择 `Add Target IP Address`（添加目标 IP 地址）\n\
    9. 点击 `Launch Scan`（启动扫描）。\n10. 你将获得确认且测试将完成（取决于选择了多少目标以及执行了多少测试）。\n11. 完成后，你将在\
    \ `Reports` 标签页中收到一份报告。\n12. 双击报告以分析以下几点：\n    - 将列出每个发现漏洞的目标主机\n    - 双击 IP 地址以查看每个端口上的端口和问题\n\
    \    - 点击列下的数字以获取发现的具体问题/漏洞列表\n    - 漏洞将详细列出\n13. 从 `Reports` 主菜单点击 `Download\
    \ Report`（下载报告）。\n\n109\n![](img/0105.jpeg)\n漏洞评估\n\n# Nessus - 寻找 Windows 特有的漏洞\n\
    \n在本教程中，我们将探索如何使用 Nessus 寻找 Windows 特有的漏洞。这些漏洞是针对我们网络中运行 Windows 系统的的特定漏洞。\n\n\
    ## 准备工作\n要完成本教程，你需要一个或多个虚拟机进行测试：\n- Windows XP\n- Windows 7\n\n### 如何操作...\n让我们通过打开\
    \ Mozilla Firefox 浏览器，开始使用 Nessus 寻找 Windows 特有的漏洞的过程：\n\n1. 登录 `http://127.0.0.1:8834`\
    \ 进入 Nessus。\n2. 进入 `Policies`（策略）。\n3. 点击 `Add Policy`（添加策略）。\n\n110\n![](img/0106.jpeg)\n\
    第 5 章\n\n4. 在 `General Settings`（常规设置）标签页上执行以下任务：\n    1. 为你的扫描输入名称。我们选择了 `Windowsability\
    \ Scan`，但你可以选择任何喜欢的名称。\n    2. Visibility（可见性）有两个选项：\n        - Shared（共享）：其他用户可以使用此扫描\n\
    \        - Private（私有）：此扫描仅供你使用\n    3. 页面上其余项目保持默认。\n    4. 点击 `onSubmit`。\n\
    5. 在 `Plugins`（插件）标签页上，点击 `Disable All` 并输入以下可能出现在 Windows 系统上的漏洞：\n    - DNS\n\
    \    - Databases（数据库）\n    - Denial of Service（拒绝服务）\n    - FTP\n    - SMTP Problems（SMTP\
    \ 问题）\n    - SNMP\n    - Settings（设置）\n    - Windows\n    - Windows bulletins（Windows\
    \ 公告）\n    - Windows User management（Windows 用户管理）\n\n111\n![](img/0107.jpeg)\n\
    漏洞评估\n\n6. 点击 `onSubmit` 保存你的新策略。\n7. 在主菜单上，点击 `Scan Queue`（扫描队列）选项。\n8. 按 `New\
    \ Scan`（新建扫描）按钮执行以下任务：\n    1. 为你的扫描输入名称。如果你同时运行多个扫描，这非常有用。\n    2. 输入扫描类型：\n\
    \        - Run Now（立即运行）：默认启用，这将导致扫描立即执行\n        - Scheduled（计划）：允许你选择扫描执行的日期和\n\
    \        - Template（模板）：允许你将此扫描设置为模板\n    3. 选择扫描策略。在这种情况下，选择 `Windows Vulnerabilities\
    \ Scan`。\n4. 考虑以下几点选择你的目标：\n    - 目标必须每行输入\n    - 你也可以在每行输入目标范围\n    - 上传目标文件（如果有的话）或选择\
    \ `Add Target IP Address`（添加目标 IP 地址）\n9. 点击 `Launch Scan`（启动扫描）。\n10. 你将获得确认且测试将完成（取决于选择了多少目标以及执行了多少测试）。\n\
    112\n![](img/0108.jpeg)\n第 5 章\n\n11. 完成后，你将收到一份报告。\n12. 双击报告以分析以下几点：\n    - 将列出每个发现漏洞的目标主机\n\
    \    - 双击 IP 地址以查看每个端口上的端口和问题\n    - 点击列下的数字以获取发现的具体问题/漏洞列表\n    - 漏洞将详细列出\n\n"
- fmt: "\nOpenVAS, the Open Vulnerability Assessment System, is an excellent framework\
    \ that can be used to assess the vulnerabilities of our target. It is a fork of\
    \ the Nessus project. Unlike Nessus, OpenVAS offers its feeds completely free\
    \ of charge. As OpenVAS comes standard in Kali Linux, we will begin with configuration.\n\
    \n## Getting ready\n\nA connection to the Internet is required to complete this\
    \ recipe.\n\n## How to do it...\n\nLet's begin the process of installing, configuring,\
    \ and starting OpenVAS by navigating to its directory via a terminal window:\n\
    \n1. OpenVAS is installed by default and it only needs to be configured in order\
    \ to be utilized.\n2. From a terminal window, change your directory to the OpenVAS\
    \ directory:\n```bash\ncd /usr/share/openvas/\n```\n\n![](images/00109.jpeg)\n\
    \n### Vulnerability Assessment\n\n3. Execute the following command:\n```bash\n\
    openvas-mkcert\n```\n\nWhat we are performing in this step is creating the SSL\
    \ certificate for the OpenVAS program:\n\n1. Leave the default lifetime of the\
    \ CA certificate as it is.\n2. Update the certificate lifetime to match the number\
    \ of days of the CA certificate:`1460`.\n3. Enter the country.\n4. Enter the state\
    \ or province (if desired).\n5. Leave the organization name as the default.\n\
    6. You will be presented with the certificate confirmation screen, then press\
    \ `Enter` to exit.\n\n4. Execute the following command:\n```bash\nopenvas-nvt-sync\n\
    ```\n\nThis will sync the OpenVAS NVT database with the current NVT Feed. It will\
    \ also update you with the latest vulnerability checks:\n\n![](images/00110.jpeg)\n\
    \n5. Execute the following commands:\n```bash\nopenvas-mkcert-client -n om -i\
    \ openvasmd -rebuild\n```\nThis will generate a client certificate and rebuild\
    \ the database respectively.\n\n6. Execute the following command:\n```bash\nopenvassd\n\
    ```\nThis will start the OpenVAS Scanner and load all plugins (approximately 26,406),\
    \ so this may take some time.\n\n7. Execute the following commands:\n```bash\n\
    openvasmd --rebuild\nopenvasmd --backup\n```\nThese commands will rebuild and\
    \ create a backup of the database.\n\n8. Execute the following command to create\
    \ your administrative user (we use `openvasadmin`):\n```bash\nopenvasad -c 'add_user'\
    \ -n openvasadmin -r admin\n```\n\n9. Execute the following command:\n```bash\n\
    openvas-adduser\n```\n\n![](images/00111.jpeg)\n\nThis will allow you to create\
    \ a regular user:\n\n1. Enter a login name.\n2. Press `Enter` on the authentication\
    \ request (this automatically chooses the password).\n3. Enter the password twice.\n\
    4. For rules, press `Ctrl+D`.\n5. Press `Y` to add the user.\n\n10. Execute the\
    \ following commands to configure the ports that OpenVAS will interact with:\n\
    ```bash\nopenvasmd -p 9390 -a 127.0.0.1\nopenvasad -a 127.0.0.1 -p 9393\ngsad\
    \ --http-only --listen=127.0.0.1 -p 9392\n```\n`9392` is the recommended port\
    \ for the web browser, but you can choose your own.\n\n![](images/00112.jpeg)\n\
    \n11. Go to `http://127.0.0.1:9392`, in your browser to view the OpenVAS web interface.\n\
    \n## How it works...\n\nIn this recipe, we began by opening a terminal window\
    \ and installing OpenVAS via the repository. We then created a certificate and\
    \ installed our plugin database. Next, we created an administrative and a regular\
    \ user account. Finally, we started the web interface of OpenVAS and were presented\
    \ with the login screen. Every time you perform an action with OpenVAS, you will\
    \ need to rebuild the database.\n\n![](images/00113.jpeg)\n\n## There's more...\n\
    \nThis section explains some additional information regarding starting OpenVAS.\n\
    \n### Setting up an SSH script to start OpenVAS\n\nEach time you would like to\
    \ run OpenVAS, you need to:\n1. Sync the NVT Feed (always a good idea as these\
    \ items will change as new vulnerabilities are discovered).\n2. Start the OpenVAS\
    \ Scanner.\n3. Rebuild the database.\n4. Back up the database.\n5. Configure your\
    \ ports.\n\nTo save a lot of time, the following is a simple Bash script that\
    \ will allow you to start OpenVAS. Save this file as `OpenVAS` and place it in\
    \ `/root` folder:\n```bash\n#!/bin/bash\nopenvas-nvt-sync\nopenvassd\nopenvasmd\
    \ --rebuild\nopenvasmd --backup\nopenvasmd -p 9390 -a 127.0.0.1\nopenvasad -a\
    \ 127.0.0.1 -p 9393\ngsad --http-only --listen=127.0.0.1 -p 9392\n```\n\n![](images/00114.jpeg)\n\
    \n### Using the OpenVAS Desktop\n\nOptionally you could perform the same steps\
    \ via the OpenVAS Desktop. The OpenVAS Desktop is a GUI-based application. To\
    \ start the application:\n1. Navigate to `Applications`|`Kali Linux`|`Vulnerability\
    \ Assessment`|`Vulnerability Scanners`|`OpenVAS`|`Start Green Security Desktop`\
    \ from the Kali Linux menu as shown in the screenshot.\n2. Enter your server address\
    \ as `127.0.0.1`.\n3. Enter your username.\n4. Enter your password.\n5. Click\
    \ on the `Log` button.\n\n![](images/00115.jpeg)\n\n## OpenVAS - finding local\
    \ vulnerabilities\n\nOpenVAS allows us to attack a wide range of vulnerabilities,\
    \ and we will confine our list of assessing our target to those specific to the\
    \ type of information we seek to gain from the assessment. In this recipe, we\
    \ will use OpenVAS to scan for local vulnerabilities on our target. These are\
    \ vulnerabilities specific to our machine.\n\n### How to do it...\n\nLet's begin\
    \ the process of finding local vulnerabilities with OpenVAS by opening the Mozilla\
    \ web browser:\n1. Go to `http://127.0.0.1:9392` and log in to OpenVAS.\n2. Go\
    \ to `Configuration`|`Scan Configs`.\n3. Enter the name of the scan. For this\
    \ recipe, we will use `Local Vulnerabilities`.\n4. For the base, select the `Empty`,\
    \ `static` and `fast` option. This option allows us to start from scratch and\
    \ create our own configuration.\n5. Click `onCreate Scan Config`.\n\n![](images/00116.jpeg)\n\
    \n6. We now want to edit our scan config. Click on the wrench icon next to `Local\
    \ Vulnerabilities`.\n7. Press `Ctrl+F` and type `Local` in the find bar.\n8. For\
    \ each local family found, put a check mark in the `Select all NVT's` box. A family\
    \ is a group of vulnerabilities. The chosen vulnerabilities are:\n   - Compliance\n\
    \   - Credentials\n   - Default Accounts\n   - Denial of Service\n   - FTP\n \
    \  - Ubuntu Local Security Checks\n9. Click on `Save Config`.\n\n![](images/00117.jpeg)\n\
    \n10. Now go to `Configuration`|`Targets`.\n11. Create a new target and perform\
    \ the following tasks:\n    1. Enter the name of the target.\n    2. Enter the\
    \ hosts using one of the following ways:\n       - Enter only one address: `192.168.0.10`\n\
    \       - Enter multiple addresses separated by a comma: `192.168.0.10,192.168.0.115`\n\
    \       - Enter a range of addresses: `192.168.0.1-20`\n12. Click `onCreate Target`.\n\
    13. Now select `Scan Management`|`New Task`, and perform the following tasks:\n\
    \    1. Enter the name of the task.\n    2. Enter a comment (optional).\n    3.\
    \ Select your scan configuration. In this case `Local Vulnerabilities`.\n    4.\
    \ Select the scan targets. In this case `Local Network`.\n    5. Leave all other\
    \ options at their default levels.\n    6. Click `onCreate Task`.\n\n14. Now go\
    \ to `Scan Management`|`Tasks`.\n15. Click on the play button next to our scan.\
    \ In this case `Local Vulnerability Scan`.\n\n### How it works...\n\nIn this recipe,\
    \ we launched OpenVAS and logged into its web-based interface. We then configured\
    \ OpenVAS to search for a set of local vulnerabilities. Finally, we selected our\
    \ target and completed the scan. OpenVAS then scanned the target system against\
    \ the list of known vulnerabilities included in our NVT Feed.\n\n![](images/00119.jpeg)\n\
    \n### There's more...\n\nOnce your scan has been performed, you can see the results\
    \ by viewing the report:\n1. Now go to `Scan Management`|`Tasks`.\n2. Click on\
    \ the purple magnifying glass next to `Local Vulnerability Scan`.\n3. Click on\
    \ the download arrow to view the report.\n\n![](images/00120.jpeg)\n"
