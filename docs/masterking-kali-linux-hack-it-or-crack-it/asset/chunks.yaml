    # Password Attacks


    In this chapter, we will cover:

    - Online password attacks

    - Cracking HTTP passwords

    - Gaining router access

    - Password profiling

    - Cracking a Windows password using John the Ripper

    - Using dictionary attacks

    - Using rainbow tables

    - Using nVidia Compute Unified Device Architecture (CUDA)

    - Using ATI Stream

    - Physical access attacks


    ## Introduction

    In this chapter, we will explore various ways to crack passwords to gain access
    to user accounts. Cracking passwords is a task that is used by all penetration
    testers. Inherently, the most insecure part of any system is the passwords submitted
    by users. No matter the password policy, humans inevitably hate entering strong
    passwords or resetting them as often as they should. This makes them an easy target
    for hackers. ![](images/00005.jpeg)![](images/00005.jpeg)


    ![](images/00182.jpeg)


    ## Password Attacks


    ### Online password attacks

    In this recipe we will use the `THC-Hydra` password cracker (`Hydra`). There are
    times in which we will have the time to physically attack a Windows-based computer
    and obtain the `Security Account Manager(SAM)` directly. However, there will also
    be times in which we are unable to do so and this is where an online password
    attack proves most beneficial.


    `Hydra` supports many protocols, including (but not limited to) `FTP`, `HTTP`,
    `HTTPS`, `MySQL`, `MSSQL`, `Oracle`, `Cisco`, `IMAP`, `VNC`, and many more! Be
    careful though, as this type of attack can be a bit noisy, which increases your
    chance of getting detected.


    #### Getting ready

    A connection to the Internet or intranet as well as a computer that we can use
    as our victim is required to complete this recipe.


    #### How to do it...

    So let''s begin the process of cracking an online password.


    1. From the Start menu, select `Applications|Kali Linux|Password Attacks|Online
    Attacks|hydra-gtk`.


    192


    ![](images/00183.jpeg)


    2. Now that we have `Hydra` started, we will need to set our word lists. Click
    on the `Password` tab. We will use a username list and a password list. Enter
    the location of your username and password list. Also select `Loop around users`
    and `Try empty password`.


    - Username List: `/usr/share/wfuzz/wordlist/fuzzdb/wordlists-user-passwd/names/nameslist.txt`

    - Password List: `/usr/share/wfuzz/wordlist/fuzzdb/wordlists-user-passwd/passwds/john.txt`


    A shortcut you can use is to single click inside the wordlist box to bring up
    a filesystem window.


    193


    ![](images/00184.jpeg)


    3. Next, we will tune the attack. Under `Performance Options`, we set the number
    of tasks from `16` to `2`. The reason for this is that we do not want to have
    so many processes running that we bring down the server. Although optional, we
    also want to set the `Exit after first found pair` option.


    4. Finally, we will go after our target. Click on the `Target` tab and set our
    target and protocol that we wish to attack. In our case, we are using the `MySQL`
    port of our Metasploitable machine (`192.168.10.111`).


    194


    ![](images/00185.jpeg)


    5. Finally, we execute the exploit by clicking on the `Start` tab and pressing
    the `Start` button.


    195


    ![](images/00186.jpeg)


    ### How it works...

    In this recipe, we used `Hydra` to perform a dictionary attack against our target.
    `Hydra` works by allowing us to specify a target, and using word lists. It attempts
    to brute-force passwords using various combinations of usernames and password
    lists.


    ### Cracking HTTP passwords

    In this recipe, we will crack passwords using the `THC-Hydra` password cracker
    (`Hydra`). These days, we are in a networked society. With networked computers
    in most homes, routers become the cornerstone of communication.


    #### Getting ready

    A connection to the Internet or intranet is required to complete this recipe.
    An available router is also required.


    #### How to do it...

    Let''s begin the process of cracking passwords.


    1. From the Start menu, navigate to `Applications|Kali Linux|Password Attacks|Online
    Attacks|hydra-gtk`. When `Hydra` launches, it loads its help file.


    2. We now run `Hydra` with our chosen options:

    ```

    medusa -M http -h 192.168.10.1 -u admin -P /usr/share/wfuzz/wordlist/fuzzdb/wordlists-user-passwd/passwds/john.txt
    -e ns -n 80 -F

    ```

    - `-M http` allows us to specify our module. In this case, we have chosen the
    `HTTP` module.

    - `-h 192.168.10.1` allows us to specify our host. In this case, we have chosen
    `192.168.10.1` (the IP address of our router).

    - `-u admin` allows us to specify our user. In this case, we have chosen `admin`.

    - `-P [location of password list]` allows us to specify our password list location.

    - `-e ns` allows us to specify additional password checks. The `ns` variable allows
    us to use the username as a password and to use empty passwords.


