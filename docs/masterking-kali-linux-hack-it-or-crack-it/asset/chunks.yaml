    \nThe chosen vulnerabilities are:\n- Brute force attacks\n- Buffer overflow\n\
    - Compliance\n- Credentials\n- Databases\n\n135\n![](images/00131.jpeg)\n\n###\
    \ Vulnerability Assessment\n- Default Accounts\n- Denial of Service\n- FTP\n-\
    \ Gain a shell remotely\n- General\n- Malware\n- NMAP NSE\n- Port Scanners\n-\
