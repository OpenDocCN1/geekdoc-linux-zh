    ![](images/00088.jpeg)

    # Chapter 4


    8. Repeat steps 5, 6, and 7 to add more information to the graph about the organization''s
    network:

    9. Finally, we save the information graph. The graph document can be opened and
    edited at a later time if we feel the need to do so, like in situations when we
    have more information from the acquired target.


    ## How it works...


    In this recipe, we used Maltego CaseFile to map the network. `CaseFile` is a visual
    intelligence application that we used to determine the relationships and real-world
    links between hundreds of different types of information. It is primarily an offline
    intelligence, meaning this is a manual process. We began the recipe by launching
    CaseFile and creating a new graph. Next, we used the knowledge we had gathered
    or known about the network and began adding components to the graph to showcase
    its setup. We concluded the recipe by saving the graph.


