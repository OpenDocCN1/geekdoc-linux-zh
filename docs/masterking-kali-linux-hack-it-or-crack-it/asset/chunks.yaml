    # 物理访问攻击


    在本教程中，我们将利用 `SUCrack` 来执行物理访问密码攻击。`SUCrack` 是一个多线程工具，允许通过 `su` 对本地用户账户进行暴力破解。Linux
    中的 `su` 命令允许你以替替用户的身份运行命令。这种攻击虽然在你无法通过其他手段在 Linux/Unix 系统上提升权限时非常有用，但它会很快填满日志文件，因此请务必在完成后清理日志文件。


    `SUCrack` 有几个我们可以使用的的命令选项：


    - `--help` 允许你查看 `SUCrack` 的帮助文件。

    - `-l` 允许你更改我们正尝试绕过的登录用户。

    - `-s` 允许你设置显示统计信息之间的时间间隔。默认设置为每 3 秒一次。


    ![](img/00208.jpeg)


    ## 密码攻击


    - `-a` 允许你设置是否使用 ANSI 转义码。

    - `-w` 允许你设置 `SUCrack` 可以利用的线程线程数。由于 `SUCrack` 是多线程的，你可以运行任意数量的工作线程。我们建议只使用一个线程，因为每次失败的登录尝试通常会在尝试下一次密码之前导致
    3 秒的延迟。


    ### 如何操作...


    1. 为了使用 `SUCrack``，你必须在打开它时指定一个字典文件。否则，你将收到一条奇怪的消息。打开终端窗口并执行 `sucrack` 命令。出于我们的目的，我们将使用一个由
    `Crunch` 生成的之前创建自定义字典文件。不过，你可以指定任何你喜欢的字典文件。

    ```

    sucrack /usr/share/wordlists/rockyou.txt

    ```


    2. 如果你想设置两个工作线程，希望每 6 秒显示一次统计信息，并想设置使用 ANSI 转义码，可以使用以下命令：

    ```

    sucrack -w 2 -s 6 -a /usr/share/wordlists/rockyou.txt

    ```


    就是这些！


    ### 工作原理...


    在本教程中，我们使用 `SUCrack` 对系统的 root 用户执行物理访问密码攻击。该攻击通过使用指定的字典文件对管理员（默认选项）或指定用户进行字典攻击来实现。我们运行
    `sucrack` 命令，它为我们提供了攻击手段。


    ---


    # 无线攻击


    在本章中，我们将涵盖：


    - 无线网络 WEP 破解

    - 无线网络 WPA/WPA2 破解

    - 自动化无线网络破解

    - 使用伪 AP 访问客户端

    - URL 流量操控

    - 端口重定向

    - 嗅探网络流量


    ## 引言


    如今，无线网络无处不在。随着用户变得前所未有的活跃，由于必须插上网线获取 Internet 而保持不动是不现实的。这种便利是需要代价的；无线连接没有以太网连接安全。在本章中，我们将探索操纵包括手机和无线网络的无线流量的各种方法。


    ![](img/00005.jpeg)

    ![](img/00209.jpeg)


    ## 无线网络 WEP 破解


    无线等效性，或通常称为 `WEP`，自 1999 年以来一直存在，是一种用于保护无线网络的旧安全标准。2003 年，WEP 被 WPA 取代，后被 WPA2
    取代。由于有了更安全的协议，WEP 加密很少被使用。事实上，强烈建议你永远不要使用 WEP 加密保护你的网络！有许多已知的利用 WEP 加密的方法，我们将在本教程中探索其中一种方法。在本教程中，我们将使用
    AirCrack 套件来破解 WEP 密钥。Aircrack 套件（通常称为 `Aircrack-ng`）是一个 WEP 和 WPA 密钥破解程序，它可以捕获网络数据包、对其进行分析，并使用这些数据破解
    WEP 密钥。


    ### 准备工作


    为了完成本教程的任务，需要具有 Kali 终端窗口的经验。还需要一个配置了数据包注入的支持的无线网卡。对于无线网卡，数据包注入涉及发送一个数据包，或将其注入到双方之间已建立的连接中。请确保你的无线网卡允许数据包注入。


    ### 如何操作...


    让我们开始使用 AirCrack 破解受 WEP 保护的网络的过程。


    1. 打开终端窗口并列出无线接口列表：

    ```

    airmon-ng

    ```

    2. 在 `interface` 列下，选择你的其中一个接口。在这种情况下，我们将使用 `wlan0`。如果你有不同的接口（如 `mon0`），请在每个提到
    `wlan0` 的地方替换为它。

    3. 接下来，我们需要停止 `wlan0` 接口并将其关闭，以便我们可以在下一步中更改 MAC 地址。

    ```

    airmon-ng stop

    ifconfig wlan0 down

    ```

    ![](img/00210.jpeg)


    4. 接下来，我们需要更改接口的 MAC 地址。由于你机器的 MAC 地址在任何网络上识别你的身份，更改 MAC 地址可以隐藏你的真实身份。在这种情况下，我们将使用
    `00:11:22:33:44:55`。

    ```

    macchanger 00:11:22:33:44:55 wlan0

    ```

    5. 现在，我们需要重新启动。

    ```

    airmon-ng start

    ```

    6. 接下来，我们将使用 `airodump` 来定位可用无线网络。

    ```

    airodump-ng wlan0

    ```

    7. 可用网络将出现。一旦找到你想攻击的网络，按下 `Ctrl+C` 停止搜索。高亮 `BSSID` 列中的 MAC 地址，右键点击并复制。同时，注意网络传输信号的通道。你将在
    `Channel` 列中找到此信息。在这种情况下，通道是 `10`。

    8. 现在我们运行 `airodump` 将选定的 BSSID 信息保存。我们将利用以下选项：

    - `-c` 允许我们选择通道。在这种情况下，我们使用 `10`。

    - `-w` 允许我们选择文件名。在这种情况下，我们选择了 `wirelessattack`。

    - `-bssid` 允许我们选择 BSSID。在这种情况下，我们将从剪贴板粘贴 `09:AC:90:AB:78`。

    ```

    airodump-ng -c 10 -w wirelessattack --bssid 09:AC:90:AB:78 wlan0

    ```

    9. 一个新的终端窗口将打开，显示之前命令的输出。保持此窗口打开。

    10. 打开另一个终端窗口；为了尝试关联，我们将运行 `aireplay`，其语法为：`aireplay-ng -1 0 -a [BSSID] -h [我们的选择
    MAC 地址] -e [ESSID] [Interface]`。

    ```

    aireplay-ng -1 0 -a 09:AC:90:AB:78 -h 00:11:22:33:44:55 -e backtrack wlan0

    ```

    11. 接下来，向路由器发送一些流量以便我们拥有一些数据。我们以以下格式使用 `aireplay`：`aireplay-ng -3 -b [BSSID] -
    h [我们的选择 MAC 地址] [Interface]`。

    ```

    aireplay-ng -3 -b 09:AC:90:AB:78 -h 00:11:22:33:44:55 wlan0

    ```

    12. 你的屏幕将开始充满流量。让这个过程运行一两分钟，直到我们有足够的信息破解。


    ![](img/0211.jpeg)


    13. 最后，我们运行 AirCrack 来破解 WEP 密钥。

    ```

    aircrack-ng -b 09:AC:90:AB:78 wirelessattack.cap

    ```


