    - 第三方模块 (Third Party Modules)

    - 更新 `Metasploit Framework`

    - 更新 `Social-Engineer Toolkit`

    - 更新 `SET` 配置

    - 帮助、致谢和关于

    - 退出 `Social-Engineer Toolkit`


    在运行攻击之前，更新 `SET` 是个好主意，因为作者经常发布更新。


