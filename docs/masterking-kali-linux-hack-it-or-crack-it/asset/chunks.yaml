    # Wireless network WPA/WPA2 cracking


    WiFi Protected Access, or `WPA` as it''s commonly referred to, has been around
    since 2003 and was created to secure wireless networks and replace the outdated
    previous standard, `WEP` encryption. In 2003,, `WEP` was replaced by `WPA` and
    later by `WPA2`. Due to having more secure protocols available, `WEP` encryption
    is rarely used.


    In this recipe, we will use the `AirCrack` suite to crack a WPA key. The `AirCrack`
    suite (or `AirCrack NG` as it''s commonly referred) is a `WEP` and `WPA` key cracking
    program that captures network packets, analyzes them, and uses this data to crack
    the `WPA` key.


    ## Getting ready


    In order to perform the tasks of this recipe, experience with the `Kali Linux`
    terminal windows is required. A supported wireless card configured for packet
    injection will also be required. In the case of a wireless card, packet injection
    involves sending a packet, or injecting it onto an already established connection
    between two parties.


