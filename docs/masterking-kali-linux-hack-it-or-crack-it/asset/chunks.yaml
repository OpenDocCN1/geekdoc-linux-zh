    \ Problems\n- SNMP\n- Service detection\n- Web Servers\n- Windows\n- Windows:\
    \ Microsoft Bulletins\n\n136\n![](images/00132.jpeg)\n\n### Chapter 5\n8. Click\
    \ on `Save Config`.\n9. Now go to `Configuration|Targets`:\n10. Create a new target\
    \ and perform the following tasks:\n    1. Enter the name of the target.\n   \
    \ 2. Enter the hosts using one of the following ways:\n        - Enter only one\
