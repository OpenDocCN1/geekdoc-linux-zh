    涉及向双方之间已建立的连接发送数据包，或将其注入其中。


    # 如何操作...


    让我们通过启动 Ettercap 开始嗅探网络流量的过程。


    1.  打开终端窗口并启动 Ettercap。使用 `-G` 选项启动图形用户界面：

    ```bash

    ettercap -G

    ```

    ![](img/00222.jpeg)


    2.  我们通过开启“统一嗅探”（Unified sniffing）开始该过程。你可以按下 `Shift+U` 或使用菜单导航到 `Sniff|Unified
    sniffing`。


    3.  选择网络接口。在进行中间人攻击（MITM）的情况下，我们应该选择我们的无线接口。

    ![](img/00223.jpeg)


    4.  接下来，我们开启“扫描主机”（Scan for hosts）。这可以通过按下 `Ctrl+S` 完成，也可以使用菜单导航到 `Hosts|Scan
    for hosts`。


    5.  接下，我们调出“主机列表”（Host List）。你可以按下 `H` 或使用菜单导航到 `Hosts|Host List`。


    6.  接下来我们需要选择并设置目标。在我们的案例中，将通过高亮 IP 地址并点击 `Add To Target 1` 按钮将 `192.168.10.111`
    选择为我们的目标 1。

    ![](img/00224.jpeg)


    7.  现在我们可以允许 Ettercap 开始嗅探了。你可以按下 `Ctrl+W` 或使用菜单导航到 `Start|Start sniffing`。


    8.  最后，我们开始 ARP 投毒过程。从菜单导航到 `Mitm|Arp poisoning...`。


    9.  在弹出的窗口中，勾选“嗅探远程连接”（Sniff remote connections）可选参数。

    ![](img/00225.jpeg)


    10. 根据网络流量，我们将开始看到信息。


    11. 一旦我们找到了正在寻找的内容（用户名和密码），我们将关闭 Ettercap。你可以通过按下 `Ctrl+E` 或使用菜单导航到 `Start|Stop
    sniffing 来 来实现此。

    ![](img/00226.jpeg)


    12. 现在我们需要关闭 ARP 投毒并让网络恢复正常。


    # 工作原理...


    本配方包含一种中间人攻击（MITM），该攻击通过使用 ARP 数据包投毒来监听用户传输的无线通信。我们通过启动 Ettercap 并扫描主机开始该配方。然后我们开始对网络进行
    ARP 投毒过程。ARP 投毒是一种允许你向局域网上的受害者发送伪造的 ARP 消息的技术。


    我们通过启动数据包嗅探器结束配方，并演示了停止 ARP 投毒并让网络恢复正常的方法。这一步是检测过程中的关键，因为它允许你在停止对网络进行投毒后不会导致网络掉线。该过程对于收集在无线网络上传输的信息非常有用。根据流量，你将能够收集用户名、密码、银行账户详情以及目标跨网络发送的其他信息。这些信息也可以作为更大规模攻击的跳板。


