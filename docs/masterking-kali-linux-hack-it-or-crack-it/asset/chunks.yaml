  trans: "\n\n9. 现在，在终端中输入以下命令：\n\n```\n/opt/nessus/sbin/nessus-adduser\n```\n\n10.\
    \ 在登录提示处，输入用户的登录名称。\n\n11. 输入两次密码。\n\n12. 回答 `Y (Yes)` 以使该用户成为管理员。\n这只需要在第一次使用时执行。\n\
    \n13. 完成后，你可以通过输入以下命令来运行 Nessus（如果没有用户账户将无法运行）：\n\n```\n/etc/init.d/nessusd start\n\
    ```\n\n14. 访问 `https://127.0.0.1:8834` 登录 Nessus。\n\n如果你打算使用 Nessus，请记住要在本地机器已安装的\
    \ Kali Linux 上运行，或者从虚拟机中运行。这是因为 Nessus 是根据它所使用的机器来激活激活的。如果你将其安装到 USB 闪盘中，那么每次重启机器时都必须重新激活你的更新源（feed）。\n\
    \n### 工作原理...\n在本教程中，我们首先打开终端窗口并通过存储库安装了 Nessus。随后，我们启动了 Nessus 并安装了更新源证书以便使用该程序。\n\
    \n### 更多信息...\n为了注册你的 Nessus 版本，你必须拥有一个有效的许可证，该许可证可以通过 `http://www.tenable.com/products/nessus/nessus-homefeed`\
    \ 获取。此外，Nessus 在浏览器中作为 Flash 运行，因此在第一次启动程序时可能需要为 Firefox 安装 Flash 插件。如果你在使用 Flash\
    \ 时遇到问题，请访问 `www.get.adobe.com/flashplayer` 获取更多信息。\n\n![](img/00094.jpeg)\n\n\
    # 漏洞评估\n## Nessus - 寻找本地漏洞\n\n现在我们已经安装并配置了 Nessus，就可以开始对第一组漏洞进行测试了。Nessus 允许我们根据更新源攻击广泛的漏洞，我们将目标漏洞评估列表限制在那些我们寻求从评估中获取的特定类型信息的漏洞上。在本教程中，我们将从寻找本地漏洞开始。这些是针对我们正在使用的系统的特定漏洞。\n\
    \n### 准备工作\n要完成本教程，你将测试本地系统（Kali Linux）。\n\n### 如何操作...\n让我们通过打开 Mozilla Firefox\
    \ 浏览器来开始使用 Nessus 寻找本地漏洞的过程：\n\n1. 访问 `https://127.0.0.1:8834` 登录 Nessus。\n2.\
    \ 进入 `Policies`（策略）。\n3. 点击 `New Policy`（新建策略）。\n\n![](img/00095.jpeg)\n\n4. 在\
    \ `General Settings`（常规设置）选项卡上，执行以下任务：\n   1. 在 `Settings Type`（设置类型）下，选择 `Basic`（基本）。\n\
    \   2. 为扫描命名。我们选择了 `Local Vulnerability Assessment`（本地漏洞评估），但你可以选择任何喜欢的名称。\n \
    \  3. Visibility（可见性）有两个选项：\n      - Shared（共享）：其他用户可以使用此扫描\n      - Private（私有）：此扫描仅供你使用\n\
    \   4. 页面其余项目保持默认设置。\n   5. 点击 `Update`（更新）。\n\n5. 在 `Plugins`（插件）选项卡上，选择 `Disable\
    \ All`（禁用全部）并以下特定漏洞：\n   - Ubuntu Local Security Checks（Ubuntu 本地安全检查）\n   - Default\
    \ Unix Accounts（默认 Unix 账户）\n6. 点击 `Update` 保存新策略。\n7. 在主菜单上，点击 `Scan Queue`（扫描队列）菜单选项。\n\
    \n![](img/00096.jpeg)\n\n8. 点击 `New Scan`（新建扫描）按钮并执行以下任务：\n   1. 为扫描命名。如果你将同时运行多个扫描，这非常有用。它是区分当前正在运行扫描的方法。\n\
    \   2. 输入扫描类型：\n      - Run Now（立即运行）：默认启用，此选项将立即运行此扫描\n      - Scheduled（计划）：允许你选择运行扫描的日期和时间\n\
    \      - Template（模板）：允许你将此扫描设置为模板\n   3. 选择扫描策略。在这种情况下，选择我们之前在教程中创建的 `Local Vulnerabilities\
    \ Assessment` 策略。\n   4. 考虑以下几点选择目标：\n      - 目标必须每行输入\n      - 你也可以在每行输入目标范围\n\
    \   5. 你也可以上传目标文件（如果有的话）或选择 `Add Target`（添加目标）IP 地址。\n9. 点击 `Run Scan`（运行扫描）。\n\
    \n![](img/00097.jpeg)\n\n10. 你将收到确认，测试将完成（取决于选择了多少目标以及执行了多少次测试）。\n11. 完成后，你将收到报告。\n\
    12. 双击报告以分析以下点（在 `Results` 选项卡上）：\n    - 将列出发现漏洞每个目标\n    - 双击 IP 地址查看每个端口上的端口和问题\n\
    \    - 点击数字获取发现的特定问题/漏洞列表\n    - 漏洞将详细列出\n13. 从 `Reports`（报告）主菜单点击 `Download Report`（下载报告）。\n\
    \n# Nessus - 寻找网络漏洞\nNessus 允许我们根据更新源攻击广泛的漏洞，我们将目标漏洞评估列表限制在那些我们寻求从评估中获取的特定类型信息的漏洞上。在本教程中，我们将配置\
    \ Nessus 来寻找目标上的网络漏洞。这些是针对我们网络中机器或协议的特定漏洞。\n\n### 准备工作\n要完成本教程，你需要以下虚拟机进行测试：\n\
    - Windows XP\n- Windows 7\n- Metasploitable 2.0\n- 网络防火墙或路由器\n- 任何发行版的 Linux\n\
    \n![](img/00098.jpeg)\n\n### 如何操作...\n让我们通过打开 Mozilla Firefox 浏览器来开始使用 Nessus\
    \ 寻找网络漏洞的过程：\n\n1. 访问 `https://127.0.0.1:8834` 登录 Nessus。\n2. 进入 `Policies`（策略）。\n\
    3. 点击 `Add Policy`（添加策略）。\n4. 在 `General`（常规）选项卡上，执行以下任务：\n   1. 为扫描命名。我们选择了 `Internal\
    \ Network Scan`。\n   2. Visibility（可见性）有两个选项：\n      - Shared（共享）：其他用户可以使用此扫描\n\
    \      - Private（私有）：此扫描仅供你使用\n   3. 页面其余项目保持默认设置。\n   4. 点击 `Update`（更新）。\n\n\
    ![](img/00099.jpeg)\n\n5. 在 `Plugins`（插件）选项卡上，点击 `Disable All`（禁用全部）并以下特定漏洞：\n\
    \   - CISCO\n   - DNS\n   - Default Unix Accounts（默认 Unix 账户）\n   - FTP\n   -\
    \ Firewalls（防火墙）\n   - Gain a shell remotely（远程获取 shell）\n   - General（常规）\n \
    \  - Netware\n   - Peer-to-Peer File Sharing（点对点文件共享）\n   - Policy Compliance（策略合规）\n\
    \   - Port Scanners（端口扫描）\n   - SCADA\n   - SMTP Problems（SMTP 问题）\n   - SNMP\n\
    \   - Service Detection（服务检测）\n   - Settings（设置）\n6. 点击 `Update` 保存新策略。\n7. 在主菜单上，点击\
    \ `Scan Queue`（扫描队列）菜单选项。\n8. 点击 `New Scan`（新建扫描）按钮并执行以下任务：\n   1. 为扫描命名。如果你将同时运行多个扫描，这非常有用。它是区分当前正在运行扫描的方法。\n\
    \   2. 输入扫描类型：\n      - Run Now（立即运行）：默认启用，此选项将立即运行扫描\n      - Scheduled（计划）：允许你选择执行扫描的日期和时间\n\
    \      - Template（模板）：允许你将此扫描设置为模板\n   3. 选择扫描策略。在这种情况下，选择我们之前在教程中创建的 `Internal\
    \ Network Scan` 策略。\n   4. 考虑以下几点选择目标：\n      - 目标必须每行输入\n      - 你也可以在每行输入目标范围\n\
    \   5. 你也可以上传目标文件（如果有的话）或选择 `Add Target`（添加目标）IP 地址。\n9. 点击 `Run Scan`（运行扫描）。\n\
    \n"
