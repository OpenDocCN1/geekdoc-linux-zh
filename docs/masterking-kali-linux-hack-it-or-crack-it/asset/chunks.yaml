    91\n![](img/00089.jpeg)\n# 信息收集\n\n### 更多……\n\n我们还可以加密图文档以使其免受公众视线的影响。要加密图表，在保存时，勾选\
    \ `Encrypt (AES-128)` 复选框并提供密码。\n\n92\n5 # 漏洞评估\n\n在本章中，我们将涵盖：\n- 安装、配置并启动 Nessus\
    \ \n- Nessus - 查找本地漏洞\n- Nessus - 查找网络漏洞\n- Nessus - 查找 Linux 特有的漏洞\n- Nessus\
    \ - 查找 Windows 特有的漏洞\n- 安装、配置并启动 OpenVAS\n- OpenVAS - 查找本地漏洞\n- OpenVAS - 查找网络漏洞\n\
    - OpenVAS - 查找 Linux 特有的漏洞\n- OpenVAS - 查找 Windows 特有的漏洞\n\n## 简介\n\n对我们的目标进行扫描和识别漏洞通常被大多数渗透测试员和道德黑客认为是最乏的任务之一。然而，它是最重要的任务之一。这应该被视为你的作业阶段。就像在学校一样，作业和测验的设计是为了让你在考试中展示精通程度。\n\
    \n漏洞识别允许你完成作业。你将学习你的目标容易受到哪些漏洞的影响，以便制定更精细的攻击方案。本质上，如果攻击本身是考试，那么漏洞识别就为你提供了一个准备的机会。![](img/00005.jpeg)!\n\
    \n![](img/00090.jpeg)\n\n## 漏洞评估\n\nNessus 和 OpenVAS 都有相似的漏洞集，它们可以在目标主机上进行扫描。这些漏洞包括：\n\
    - Linux 漏洞\n- Windows 漏洞\n- 本地安全检查\n- 网络服务漏洞\n\n### 安装、配置并启动 Nessus\n\n在本教程中，我们将安装、配置并启动\
    \ Nessus。Nessus 依赖于插件形式的检查来定位我们选定的目标。Nessus 提供两种 Feed 版本：Home 和 Professional。\n\
    \n- `Home Feed`：用于非商业用途。\n- `Professional Feed`：用于商业用途。它包括无限连接等功能。如果你是顾问并为客户执行测试，那么\
    \ Professional Feed 适合你。\n\n在我们的教程中，假设你正在使用 Home Feed。\n\n## 准备工作\n\n需要满足以下要求：\n\
    - 完成此教程需要连接\n\n## 如何操作……\n\n让我们通过打开终端窗口开始安装、配置和启动 Nessus：\n\n1. 打开 Weasel 浏览器并导航到以下\
    \ URL：http://www.tenable.com/products/nessus/select-your-operating-system`.\n\
    2. 在屏幕左侧的 Download Nessus 下选择 Linux，然后（至少在写作时）选择 `Nessus-5.2.1-debian6_amd64.deb`。\n\
    3. 将文件下载到本地根目录。\n\n94\n![](img/00091.jpeg)\n# 第 5 章\n\n## 漏洞评估\n\n4. 打开终端窗口。\n\
    5. 执行以下命令安装 Nessus：\n```\ndpkg -i \"Nessus-5.2.1-debian6_i86.deb\"\n```\n上述命令的输出如下：\n\
    6 Nessus 将安装在 `/opt/nessus` 目录下。\n7 安装 安装完成后，可以通过输入以下命令运行 Nessus：\n```\n/etc/init.d/nessusd\
    \ start\n```\n在使用 Nessus 之前，你必须有一个注册码。你可以从下方的“更多……”部分获得有关如何操作此的信息。\n\n8. 执行以下命令启用你的\
    \ Nessus 安装：\n```\n/opt/nessus/bin/nessus-fetch --register XX-XXXX-XXXX-XXXX-XXXX\n\
    ```\n在这一步中，我们还将从 http://plugins.nessus.org 获取最新的插件。\n根据你的网络连接，这可能需要一分钟或两分钟。\n\n\
    96\n![](img/00093.jpeg)\n# 第 5 章\n\n"
- fmt: "\n9. Now enter the following command in the terminal:\n\n```\n/opt/nessus/sbin/nessus-adduser\n\
    ```\n\n10. At the login prompt, enter the login name of the user.\n\n11. Enter\
    \ the password twice.\n\n12. Answer asY (Yes) to make this user an administrator.\n\
    This only needs to be performed on your first use.\n\n13. Once complete, you can\
    \ run Nessus by typing the following command (it won't work without a user account):\n\
    \n```\n/etc/init.d/nessusd start\n```\n\n14. Log in to Nessus at `https://127.0.0.1:8834`.\n\
    \nIf you are going to use Nessus, remember to do so either from an installed version\
    \ of Kali Linux on your local machine or from a virtual machine. The reason for\
    \ this is that Nessus activates itself based upon the machine that it's using.\
    \ If you install to a USB key, you will have to reactivate your feed every time\
    \ you restart the machine.\n\n### How it works...\nIn this recipe, we began by\
    \ opening a terminal window and installing Nessus via the repository. We later\
    \ started Nessus and installed our feed certificate in order to utilize the program.\n\
    \n### There's more...\nIn order to register your copy of Nessus, you must have\
    \ a valid license which can be obtained from `http://www.tenable.com/products/nessus/nessus-homefeed`.\
    \ Also, Nessus runs as Flash inside the browser, so you may have to install the\
    \ Flash plugin for Firefox the first time you start the program. If you run into\
    \ an issue using Flash, go to `www.get.adobe.com/flashplayer` for more information.\n\
    \n![](images/00094.jpeg)\n\n# Vulnerability Assessment\n## Nessus - finding local\
    \ vulnerabilities\n\nNow that we have Nessus installed and configured, we will\
    \ be able to begin testing of our first set of vulnerabilities. Nessus allows\
    \ us to attack a wide range of vulnerabilities depending on our feed, and we will\
    \ confine our list of assessing the vulnerabilities of our target to those specific\
    \ to the type of information we seek to gain from the assessment. In this recipe,\
    \ we will begin by finding local vulnerabilities. These are vulnerabilities specific\
    \ to the operating system we are using.\n\n### Getting ready\nTo complete this\
    \ recipe, you will be testing your local system (Kali Linux).\n\n### How to do\
    \ it...\nLet's begin the process of finding local vulnerabilities with Nessus\
    \ by opening the Mozilla Firefox web browser:\n\n1. Log in to Nessus at `https://127.0.0.1:8834`.\n\
    2. Go to `Policies`.\n3. Click on `New Policy`.\n\n![](images/00095.jpeg)\n\n\
    4. On the `General Settings` tab, perform the following tasks:\n   1. Under `Settings\
    \ Type`, choose `Basic`.\n   2. Enter a name for your scan. We chose `Local Vulnerability\
    \ Assessment`, but you can choose any name you wish.\n   3. Visibility has two\
    \ options:\n      - Shared: Other users have the ability to utilize this scan\n\
    \      - Private: This scan can only be utilized by you\n   4. Take the defaults\
    \ on the rest of the items on the page.\n   5. Click on `Update`.\n\n5. On the\
    \ `Plugins` tab, select `Disable All` and select the following specific vulnerabilities:\n\
    \   - Ubuntu Local Security Checks\n   - Default Unix Accounts\n6. Click on `Update`\
    \ to save your new policy.\n7. On the main menu, click on the `Scan Queue` menu\
    \ option.\n\n![](images/00096.jpeg)\n\n8. Click on the `New Scan` button and perform\
    \ the following tasks:\n   1. Enter a name for your scan. This is useful if you\
    \ will be running more than one scan at a time. It's a way to differentiate the\
    \ scans that are currently running.\n   2. Enter the type of scan:\n      - Run\
    \ Now: Enabled by default, this option will run this scan immediately\n      -\
    \ Scheduled: Allows you to choose the date and time to run the scan\n      - Template:\
    \ Allows you to set this scan as a template\n   3. Choose a scan policy. In this\
    \ case, the `Local Vulnerabilities Assessment` policy we created earlier in the\
    \ recipe.\n   4. Choose your targets considering the following points:\n     \
    \ - Targets must be entered one per line\n      - You can also enter ranges of\
    \ targets on each line\n   5. You may also upload a target's file (if you have\
    \ one) or select `Add Target` IP Address.\n9. Click on `Run Scan`.\n\n![](images/00097.jpeg)\n\
    \n10. You will get a confirmation and your test will complete (depending on how\
    \ many targets are selected and the number of tests performed).\n11. Once completed,\
    \ you will receive a report.\n12. Double-click on the report to analyze the following\
    \ points (on the `Results` tab):\n    - Each target in which a vulnerability is\
    \ found will be listed\n    - Double-click on the IP address to see ports and\
    \ issues on each port\n    - Click on the number to get the list of specific issues/vulnerabilities\
    \ found\n    - The vulnerabilities will be listed in detail\n13. Click on `Download\
    \ Report` from the `Reports` main menu.\n\n# Nessus - finding network vulnerabilities\n\
    Nessus allows us to attack a wide range of vulnerabilities depending on our feed,\
    \ and we will confine our list of assessing the vulnerabilities of our target\
    \ to those specific the type of information we seek to gain from the assessment.\
    \ In this recipe, we will configure Nessus to find network vulnerabilities on\
    \ our targets. These are vulnerabilities specific to the machines or protocols\
    \ on our network.\n\n### Getting ready\nTo complete this recipe, you will need\
    \ a virtual machine(s) to test against:\n- Windows XP\n- Windows 7\n- Metasploitable\
    \ 2.0\n- A network firewall or router\n- Any other flavor of Linux\n\n![](images/00098.jpeg)\n\
    \n### How to do it...\nLet's begin the process of finding network vulnerabilities\
    \ with Nessus by opening the Mozilla Firefox web browser:\n\n1. Log in to Nessus\
    \ at `https://127.0.0.1:8834`.\n2. Go to `Policies`.\n3. Click on `Add Policy`.\n\
    4. On the `General` tab, perform the following tasks:\n   1. Enter a name for\
    \ your scan. We chose `Internal Network Scan`, but you can choose any name you\
    \ wish.\n   2. Visibility has two options:\n      - Shared: Other users have the\
    \ ability to utilize this scan\n      - Private: This scan can only be utilized\
    \ by you\n   3. Take the defaults on the rest of the items on the page.\n   4.\
    \ Click on `Update`.\n\n![](images/00099.jpeg)\n\n5. On the `Plugins` tab, click\
    \ on `Disable All` and select the following specific vulnerabilities:\n   - CISCO\n\
    \   - DNS\n   - Default Unix Accounts\n   - FTP\n   - Firewalls\n   - Gain a shell\
    \ remotely\n   - General\n   - Netware\n   - Peer-To-Peer File Sharing\n   - Policy\
    \ Compliance\n   - Port Scanners\n   - SCADA\n   - SMTP Problems\n   - SNMP\n\
    \   - Service Detection\n   - Settings\n6. Click on `Update` to save your new\
    \ policy.\n7. On the main menu, click on the `Scan Queue` menu option.\n8. Click\
    \ on the `New Scan` button and perform the following tasks:\n   1. Enter a name\
    \ for your scan. This is useful if you will be running more than one scan at a\
    \ time. It's a way to differentiate the scans that are currently running.\n  \
    \ 2. Enter the type of scan:\n      - Run Now: Enabled by default, this option\
    \ will execute the scan immediately\n      - Scheduled: Allows you to select the\
    \ date and time the scan is be executed\n      - Template: Allows you to set this\
    \ scan as a template\n   3. Choose a scan policy. In this case, the `Internal\
    \ Network Scan` policy we created earlier in the recipe.\n   4. Choose your targets\
    \ considering the following points:\n      - Targets must be entered one per line\n\
    \      - You can also enter ranges of targets on each line\n   5. You may also\
    \ upload a target's file (if you have one) or select `Add Target` IP Address.\n\
    9. Click on `Run Scan`.\n\n![](images/00100.jpeg)\n\n10. You will get a confirmation\
    \ and your test will complete (depending on how many targets are selected and\
    \ the number of tests performed).\n"
