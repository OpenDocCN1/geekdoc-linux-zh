  trans: "\n在本教程中，我们将介绍更新 Kali 以及配置一些额外工具的过程，这些工具在后续章节和教程中非常有用。由于 Kali 软件包在发布版本之间不断更新，你很快会发现可用的工具比最初从\
    \ DVD-ROM 中下载的要新。我们将从更新安装开始，获取 Nessus 的激活码，并以安装 Squid 结束。\n\n## 如何操作...\n\n让我们开始更新并配置额外的安全工具的过程：\n\
    \n1. 使用存储库中的最新更改更新本地软件包索引：\n\n```bash\napt-get update\n```\n\n2. 升级现有的软件包：\n\n\
    ```bash\napt-get upgrade\n```\n\n3. 升级到最新版本（如果可用）：\n\n```bash\napt-get dist-upgrade\n\
    ```\n\n40\n\n![](img/00041.jpeg)\n\n## 第 2 章\n\n4. 通过在 `http://www.nessus.org/products/nessus/nessus-plugins/obtain-an-activation-code`\
    \ 注册获取 Nessus 的激活码。\n\n5. 执行以下命令激活 Nessus：\n\n```bash\n/opt/nessus/bin/nessus-fetch\
    \ --register A60F-XXXX-XXXX-XXXX-0006\n```\n\n其中 `A60F-XXXX-XXXX-XXXX-0006` 应该是你的激活码。\n\
    \n6. 为 Nessus Web 界面创建一个用户账户：\n\n```bash\n/opt/nessus/sbin/nessus-adduser\n```\n\
    \n7. 启动 Nessus 服务器，只需调用以下命令：\n\n```bash\n/etc/init.d/nessusd start\n```\n\n8.\
    \ 安装 Squid：\n\n```bash\napt-get install squid3\n```\n\n9. 防止 Squid 在启动机时自动启动：\n\
    \n```bash\nupdate-rc.d -f squid3 remove\n```\n\n在 `apt-get update` 之后，我们可以使用以下命令在存储库中查找特定软件包：\n\
    \n```bash\napt-cache search <keyword>\n```\n\n其中 `<keyword>` 可以是软件包或正则表达式。\n\n\
    ## 设置 ProxyChains\n\n通过强制让应用程序通过用户定义的代理列表连接，从而断开接收者和发送者之间的直接连接，这是本教程中要解释的任务。\n\
    \n41\n\n![](img/00042.jpeg)\n\n## 定制 Kali Linux\n\n如何操作...\n\n1. 打开 ProxyChains\
    \ 配置文件：\n\n```bash\nvim /etc/proxychains.conf\n```\n\n2. 取消我们想要使用的链类型的注释；在此情况下，使用\
    \ `dynamic_chain`：\n\n3. 向列表添加一些代理服务器。\n\n42\n\n![](img/00043.jpeg)\n\n## 第 2\
    \ 章\n\n4. 通过我们的链式代理解析目标主机：\n\n```bash\nproxyresolv www.targethost.com\n```\n\n\
    5. 现在我们可以通过想要使用的应用程序运行 ProxyChains；例如，`msfconsole`：\n\n```bash\nproxychains msfconsole\n\
    ```\n\n## 目录加密\n\n本章的最后一个教程将关于信息隐私。我们将使用 TrueCrypt 通过加密密钥从公众视野中隐藏重要的秘密数字信息。\n\n\
    43\n\n![](img/00044.jpeg)\n\n## 定制 Kali Linux\n\n如何操作...\n\n1. 导航到 `Applications\
    \ Menu|Kali|Forensics|Digital Anti Forensics|install truecrypt` 安装 TrueCrypt。点击\
    \ `Install TrueCrypt` 并按照屏幕上的指示操作。\n\n2. 从 `Applications Menu|Kali Linux|Forensics|Digital\
    \ Anti Forensics|truecrypt` 启动 TrueCrypt，你将看到一个与截图类似的窗口：\n\n44\n\n![](img/00045.jpeg)\n\
    \n## 第 2 章\n\n3. 点击 `Create Volume` 开始启动 `TrueCrypt Volume Creation Wizard`。\n\
    \n4. 保留默认选项并点击 `Next`。\n\n5. 选择 `Standard TrueCrypt` 模块并点击 `Next`。\n\n6. 点击 `Select\
    \ File…` 按钮并为新的 TrueCrypt 卷指定名称和位置。完成后点击 `Save`。\n\n7. 点击 `Next` 按钮并选择我们使用的加密和哈希算法。\n\
    \n8. 在下一个屏幕中，我们将指定容器所需的空间大小。\n\n9. 现在我们需要输入卷的密码。点击 `Next`。\n\n10. 选择文件系统类型。\n\n\
    11. 根据需求选择 `Cross-Platform Support`（跨平台支持）。\n\n12. 在下一个屏幕中，向导要求我们在窗口内移动鼠标以增加加密密钥的加密强度。完成后，点击\
    \ `Format` 按钮。\n\n13. 格式化将开始，并将在创建 TrueCrypt 卷后结束。按 `OK` 并 `Exit`。\n\n14. 我们现在回到了\
    \ TrueCrypt 窗口。\n\n15. 要解密我们的卷，从列表中选择一个槽，点击 `Select File…` 并打开我们创建的卷。\n\n45\n\n\
    ![](img/00046.jpeg)\n\n## 定制 Kali Linux\n\n16. 点击 `Mount` 并输入我们的密码；完成后点击 `OK`：\n\
    \n17. 现在我们可以通过双击它来访问卷。\n\n工作原理...\n\n在本教程中，我们设置了 TrueCrypt，创建了一个卷并挂载了它。\n\n46\n\
