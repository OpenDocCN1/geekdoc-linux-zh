    ## How it works...


    In this recipe, we used Maltego to map the network. Maltego is an open source
    tool used for information gathering and forensics which was created by Paterva.
    We began the recipe by completing the setup wizard. Next, we used the `Domain`
    entity by dragging it into our graph. Finally, we concluded by allowing Maltego
    to complete our graph by checking various sources to complete the task. This makes
    Maltego highly useful because we are able to utilize this automation to quickly
    gather information on our target, such as gathering e-mail addresses, servers,
    performing WHOIS lookups, and so on.


    The Community Edition only allows us to use 75 transforms as part of our information
    gathering. The full version of Maltego currently costs $650.


    85

    ![](images/00083.jpeg)


    ## Information Gathering


    ### There''s more...


    Activating and deactivating transforms is done through the `Transform Manager`
    window under the `Manage` ribbon tab:


    To be able to use several transformations, a disclaimer must be accepted first.


    ## Mapping the network


    With the information gained from the earlier recipes, we can now proceed to create
    the blueprint of the organization''s network. In this final recipe of the chapter,
    we will see how to visually compile and organize the information obtained using
    `Maltego CaseFile`.


    `CaseFile`, as stated on the developer''s website, is like Maltego without transforms,
    but with tons of features. Most of the features will be demonstrated in the `How
    to do it…` section of this recipe.


    86

    ![](images/00084.jpeg)


    # Chapter 4


    ## How to do it...


    Let''s begin the recipe by launching CaseFile:


    1. Launch CaseFile by going to `Applications|Kali Linux|Reporting Tools|Evidence
    Management|casefile` .

    2. To create a new graph, click on `New` in `CaseFile`''s application menu:


