    Customizing Kali Linux


    In this chapter, we will cover:


    - Preparing kernel headers

    - Installing Broadcom drivers

    - Installing and configuring ATI video drivers

    - Installing and configuring nVidia video drivers

    - Applying updates and configuring extra tools

    - Setting up ProxyChains

    - Directory encryption


    ### Introduction


    This chapter will introduce you to the customization of Kali so you can take full
    advantage of it. We will cover the installation and configuration of ATI and nVidia
    technologies as well as extra tools needed for later chapters. ATI and nVidia
    GPU-based graphic cards allow us to use their graphics processing units (GPU)
    to perform calculations as opposed to the CPU. We will conclude the chapter with
    the setup of ProxyChains and encryption of digital information.


    ### Preparing kernel headers


    There will occasionally be times where we''ll face the need to compile code which
    requires headers. Kernel headers are the source code of the Linux kernel. In this
    first recipe, we''ll explain the steps required to prepare kernel headers for
    later use.


    ![](images/00032.jpeg)


    33


    ### Getting ready


    An Internet connection is required to complete this recipe.


    ### How to do it...


    Let''s begin the process of preparing kernel headers:


    1. We begin first by updating our distribution by executing the following command:


    ```bash

    apt-get update

    ```


    2. Next, we must use `apt-get` again to prepare the kernel headers. Execute the
    following command:


    ```bash

    apt-get install linux-headers - `uname -r`

    ```


    32


    ![](images/00033.jpeg)


    Chapter 2


    3. Copy the following directory and its entire contents:


    ```bash

    cd /usr/src/linux

    cp -rf include/generated/* include/linux/

    ```


    4. We''re now ready to compile code that requires kernel headers.

