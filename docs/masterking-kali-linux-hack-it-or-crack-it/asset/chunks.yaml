    Next, we selected our victim from a list of attack targets provided by `Gerix`.
    After we started sniffing the network traffic, we then used `Chop Chop` to generate
    the `CAP` file. We concluded the recipe by gathering 20,000 packets and brute-forced
    the `CAP` file with `Aircrack`.


    With `Gerix`, we were able to automate the steps to crack a WEP key without having
    to manually type commands in a terminal window. This is an excellent way to quickly
    and efficiently break into a WEP secured network.


    ## Accessing clients using a fake AP


    In this recipe, we will use `Gerix` to create and set up a fakeaccess point(AP).
    Setting up a fake access point gives us the ability to gather information on each
    of the computers that access it. People in this day and age will often sacrifice
    security for convenience. Connecting to an open wireless access point to send
    a quick e-mail or to quickly log into a social network is rather convenient. `Gerix`
    is an automated GUI for `AirCrack`.


    ### Getting ready


    A supported wireless card configured for packet injection will be required to
    complete this recipe. In the case of a wireless card, packet injection involves
    sending a packet, or injecting it onto an already established connection between
    two parties.


    ### How to do it...


    Let''s begin the process of creating a fake AP with `Gerix`.


    1. Let''s navigate to the directory where `Gerix` is located:

    ```bash

    cd /usr/share/gerix-wifi-cracker

    ```

    ![](images/00217.jpeg)


    2. To begin using `Gerix`, we issue the following command:

    ```bash

    python gerix.py

    ```


    3. Click on the `Configuration` tab.

    4. On the `Configuration` tab, select your wireless interface.

    5. Click on the `Enable/Disable Monitor Mode` button.

    6. Once Monitor mode has been enabled successfully, under `Select Target Network`,
    press the `Rescan Networks` button.

    7. The list of targeted networks will begin to fill. Select a wireless network
    to target. In this case, we select a WEP encrypted network.


    8. Click on the `Fake AP` tab.


    ![](images/00218.jpeg)


    9. Change the `Access Point ESSID` from `honeypot` to something less suspicious.
    In this case, we are going to use `personalnetwork`.

    10. We will use the defaults on each of the other options. To start the fake access
    point, click on the `Start Face Access Point` button.


    That''s it!


    ![](images/00219.jpeg)


    ### How it works...


    In this recipe, we used `Gerix` to create a fake AP. Creating a fake AP is an
    excellent way of collecting information from unsuspecting users. The reason fake
    access points are a great tool to use is that to your victim, they appear to be
    a legitimate access point, thus making it trusted by the user. Using `Gerix`,
    we were able to automate the creation of setting up a fake access point in a few
    short clicks.


    ## URL traffic manipulation


    In this recipe, we will perform a URL traffic manipulation attack. URL traffic
    manipulation is very similar to a Man In The Middle attack, in that we will route
    traffic destined for the Internet to pass through our machine first. We will perform
    this attack through `ARP poisoning`. `ARP poisoning` is a technique that allows
    you to send spoofed ARP messages to a victim on the local network. We will execute
    this recipe using `arpspoof`.


    ### How to do it...


    Let''s begin the process of URL traffic manipulation.


    1. Open a terminal window and execute the following command to configure IP tables
    that will allow our machine to route traffic:

    ```bash

    sudo echo 1 >> /proc/sys/net/ipv4/ip_forward

    ```


    2. Next, we launch `arpspoof` to poison traffic going from our victim''s machine
    to the default gateway. In this example, we will use a Windows 7 machine on my
    local network with an address of `192.168.10.115`. `Arpspoof` has a couple of
    options that we will select and they include:

    - `-i` allows us to select our target interface. In this case, we will select
    `wlan0`.

    - `-t` allows us to specify our target.


    The syntax for completing this command is `arpspoof -i [interface] -t [target
    IP address] [destination IP address]`.

    ```bash

    sudo arpspoof -i wlan0 -t 192.168.10.115 192.168.10.1

    ```


    3. Next, we will execute another `arpspoof` command that will take traffic from
    the destination in the previous command (which was the default gateway) and route
    that traffic back to our Kali machine. In this example our IP is `192.168.10.110`.

    ```bash

    sudo arpspoof -i wlan0 -t 192.168.10.1 192.168.10.110

    ```


    That''s it!


    ![](images/00220.jpeg)


    ### How it works...


    In this recipe, we used `ARP poisoning` with `arpspoof` to manipulate traffic
    on our network to ultimately route back our Kali machine. Once traffic has been
    rerouted, there are other attacks you can run against the victim, including recording
    their.


    ## Port redirection


    In this recipe, we will use Kali to perform port redirection, also known as port
    forwarding. Port redirection involves the process of accepting a packet, say port
    80, and redirecting it to a different port, such as 8080.


    ### How to do it...


    Let''s begin the process of port redirection.


    1. Open a terminal window and execute the following command to configure IP tables
    that will allow our machine to route traffic:

    ```bash

    sudo echo 1 >> /proc/sys/net/ipv4/ip_forward

    ```


    2. Next, we launch `arpspoof` to poison traffic going from our victim''s machine
    to the default gateway. In this example, the address is `192.168.10.115`. `Arpspoof`
    has a couple of options that we will select and they include:

    - `-i` allows us to select our target interface. In this case, we will select
    `wlan0`.

    - `-t` allows us to specify our target.


    The syntax for completing this command is `arpspoof -i [interface] -t [target
    IP address] [destination IP address]`.

    ```bash

    sudo arpspoof -i wlan0 -t 192.168.10.115 192.168.10.1

    ```


    3. Next, we will execute another `arpspoof` command that will take traffic from
    the destination in the previous command (which was the default gateway) and route
    that traffic back to our Kali machine. In this example our IP is `192.168.10.110`.

    ```bash

    sudo arpspoof -i wlan0 -t 192.168.10.1 192.168.10.110

    ```

    ```bash

    iptables -t nat -A PREROUTING -p tcp --destination-port 80 -j REDIRECT --to-port
    8080

    ```


    ### How it works...


    In this recipe, we used `ARP poisoning` with `arpspoof` and `IPTables` routing
    to manipulate traffic on our network destined for port 80 to be redirected to
    8080.


    ## Sniffing network traffic


    In this recipe, we will examine the process of sniffing network traffic. Sniffing
    network traffic involves the process of intercepting network packets, analyzing
    it, and then decoding the traffic (if necessary) displaying the information contained
    within the packet. Sniffing traffic is particularly useful in gathering information
    from a target, because depending on the websites visited, you will be able to
    see the URLs visited, usernames, passwords, and other details that you can use
    against them.


    We will use `Ettercap` for this recipe, but you could also use `Wireshark`. For
    demonstration purposes, `Ettercap` is a lot easier to understand and apply sniffing
    principles.

