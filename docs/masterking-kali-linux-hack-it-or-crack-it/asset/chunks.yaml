  trans: "\n\n# OpenVAS - 查找网络漏洞\n\n在本教程中，我们将使用 OpenVAS 来扫描网络漏洞。这些是针对我们目标网络中设备的特定漏洞。\n\
    \n## 准备工作\n\n为了完成本教程，你需要一个或多个虚拟机进行测试：\n* Windows XP\n* Windows 7\n* Metasploitable\
    \ 2.0\n* 任何发行发行版的 Linux\n\n## 如何操作...\n\n让我们通过打开 Mozilla Firefox 浏览器，开始使用 OpenVAS\
    \ 查找网络漏洞的过程：\n\n1. 访问 `http://127.0.0.1:9392` 并登录 OpenVAS。\n2. 进入 `Configuration|Scan\
    \ Configs`：\n3. 输入扫描名称。在本教程中，我们将使用 `Network Vulnerabilities`（网络漏洞）。\n4. 对于基础配置（base），选择\
    \ `Empty`、静态且快速的选项。此选项允许我们从零开始创建自己的配置。\n\n![](img/00121.jpeg)\n\n## 漏洞评估\n\n5.\
    \ 点击 `onCreate Scan Config:`。\n6. 我们现在想要编辑扫描配置。点击 `Network Vulnerabilities` 旁边的扳手图标。\n\
    7. 按 `Ctrl+F` 在查找栏中输入 `Network`。\n8. 为找到的每个漏洞族（family），在 `Select all NVT's` 框中勾选。\n\
    \n一个漏洞族是一组漏洞。选定的漏洞包括：\n* 暴力破解\n* 缓冲区溢出\n* CISCO\n* 合规性\n* 凭据\n* 数据库\n* 默认账户\n\
    * 拒绝服务\n* FTP\n* Finger 滥用\n* 防火墙\n* 远程获取 Shell\n* 通用\n* 恶意软件\n* Netware\n* NMAP\
    \ NSE\n* 点点文件共享\n* 端口扫描器\n* 权限提升\n* 产品检测\n* RPC\n* 远程文件访问\n* SMTP 问题\n* SNMP\n\
    * 服务检测\n* 设置\n* 无线服务\n9. 点击 `Save Config`。\n10. 现在进入 `Configuration|Targets`：\n\
    \n![](img/00123.jpeg)\n\n11. 创建新目标并执行以下任务：\n    1. 输入目标名称。\n    2. 使用以下方法之一输入主机：\n\
    \        * 仅输入一个地址：`192.168.0.10`\n        * 输入用逗号分隔的多个邮件地址：`192.168.0.10,192.168.0.15`\n\
    \        * 输入地址范围：`192.168.0.1-20`\n12. 点击 `Save Target`。\n13. 现在进入 `Scan Management|New\
    \ Task` 并执行以下操作：\n    1. 输入任务名称。\n    2. 输入注释（可选）。\n    3. 选择你的扫描配置。在此情况下选择 `Network\
    \ Vulnerabilities`。\n    4. 选择扫描目标。在此情况下选择 `Local`。\n    5. 保持所有选项为默认值。\n    6.\
    \ 点击 `onCreate Task:`。\n14. 现在进入 `Scan Management|Tasks`。\n15. 点击我们扫描旁边的播放按钮。在此情况下为\
    \ `Network Vulnerability`。\n\n![](img/00124.jpeg)\n\n## 工作原理...\n\n在本教程中，我们启动了\
    \ OpenVAS 并登录了它的 Web 界面。我们配置 OpenVAS 来搜索一组网络漏洞。最后，我们选择了目标并完成了扫描。OpenVAS 随后根据我们\
    \ NVT 馈中包含的已知漏洞列表对目标进行了扫描。\n\n## 更多...\n\n一旦完成扫描，你可以通过查看报告查看结果：\n1. 进入 `Scan Management|Tasks`。\n\
    2. 点击 `Network Vulnerabilities` 旁边的紫色放大镜。\n3. 点击箭头查看报告：\n\n![](img/00125.jpeg)\n\
    \n# OpenVAS - 查找 Linux 特有漏洞\n\n在本教程中，我们将使用 OpenVAS 扫描 Linux 漏洞。这些是针对我们目标网络中 Linux\
    \ 机器特定漏洞。\n\n## 准备工作\n\n为了完成本教程，你需要一个或多个虚拟机进行测试：\n* Metasploitable 2.0\n* 任何发行版的\
    \ Linux\n\n## 如何操作...\n\n让我们通过打开 Firefox 浏览器，开始使用 OpenVAS 查找 Linux 特有漏洞：\n\n1.\
    \ 访问 `http://127.0.0.1:9392` 并登录 OpenVAS。\n2. 进入 `Configuration|Scan Configs`：\n\
    3. 输入扫描名称。在本教程中，我们将使用 `Linux Vulnerabilities`（Linux 漏洞）。\n4. 对于基础配置，选择 `Empty`、静态且快速的选项。此选项允许我们从零开始创建自己的配置。\n\
    \n![](img/00126.jpeg)\n\n5. 点击 `onCreate Scan Config:`。\n6. 我们现在想要编辑扫描配置。点击 `Linux\
    \ Vulnerabilities` 旁边的扳手图标。\n7. 按 `Ctrl+F` 在查找栏中输入 `Linux`。\n8. 为找到的每个本地漏洞族，在\
    \ `Select all NVTs` 框中勾选。\n\n选定的漏洞包括：\n* 暴力破解\n* 缓冲区溢出\n* 合规性\n* 凭据\n* 数据库\n*\
    \ 默认账户\n* 拒绝服务\n* FTP\n* Finger 滥用\n* 远程获取 Shell\n* 通用\n* 恶意软件\n* Netware\n* NMAP\
    \ NSE\n* 端口扫描器\n* 权限提升\n* 产品检测\n* RPC\n* 远程文件访问\n* SMTP 问题\n* SNMP\n* 服务检测\n*\
    \ 设置\n* 无线服务\n* Web 服务器\n9. 点击 `Save Config`。\n10. 现在进入 `Configuration|Targets`：\n\
    11. 创建新目标并执行以下任务：\n    1. 输入目标名称。\n    2. 使用以下方法之一输入主机：\n        * 仅输入一个地址：`192.168.0.10`\n\
    \        * 输入用逗号分隔的多个邮件地址：`192.168.0.10,192.168.0.15`\n        * 输入地址范围：`192.168.0.1-20`\n\
    12. 点击 `Save Target`。\n\n![](img/00128.jpeg)\n\n13. 现在进入 `Scan Management|New\
    \ Task` 并执行以下操作：\n    1. 输入任务名称。\n    2. 输入注释（可选）。\n    3. 选择你的扫描配置。在此情况下选择 `Network\
    \ Vulnerabilities`。\n    4. 选择扫描目标。在此情况下选择 `Local`。\n    5. 保持所有选项为默认值。\n    6.\
    \ 点击 `onCreate Task:`。\n14. 现在进入 `Scan Management|Tasks`。\n15. 点击我们扫描旁边的播放按钮。在此情况下为\
    \ `Network Vulnerability`。\n\n## 漏洞评估\n\n## 工作原理...\n\n在本教程中，我们启动了 OpenVAS 并登录了它的\
    \ Web 界面。我们配置 OpenVAS 来搜索一组网络漏洞。最后，我们选择了目标并完成了扫描。OpenVAS 随后根据我们 NVT 馈中包含的已知漏洞列表对目标进行了扫描。\n\
    \n## 更多...\n\n一旦完成扫描，你可以通过查看报告查看结果：\n1. 进入 `Scan Management|Tasks`。\n2. 点击 `Network\
    \ Vulnerabilities` 旁边的紫色放大镜。\n3. 点击箭头查看报告：\n\n![](img/00129.jpeg)\n\n# OpenVAS\
    \ - 查找 Windows 特有漏洞\n\n在本教程中，我们将使用 OpenVAS 扫描 Windows 漏洞。这些是针对我们目标网络中 Windows\
    \ 机器特定漏洞。\n\n## 准备工作\n\n为了完成本教程，你需要一个或多个虚拟机进行测试：\n* Windows XP\n* Windows 7\n\n\
    ![](img/00130.jpeg)\n\n## 如何操作...\n\n让我们通过打开 Mozilla Firefox 浏览器，开始使用 OpenVAS\
    \ 查找 Windows 特有漏洞：\n\n1. 访问 `http://127.0.0.1:9392` 并登录 OpenVAS。\n2. 进入 `Configuration|Scan\
    \ Configs`：\n3. 输入扫描名称。在本教程中，我们将使用 `Windows Vulnerabilities`。\n4. 对于基础配置，选择 `Empty`、静态且快速的选项。\n\
    5. 点击 `onCreate Scan Config:`。\n6. 我们现在想要编辑扫描配置。点击 `Windows Vulnerabilities` 旁边的扳手图标。\n\
    \n"
