    ![](images/00164.jpeg)


    Chapter 7


    5. Next, we run the impersonation attack. The syntax to use `impersonate_token`
    [name of the account to impersonate]:


    ```bash

    impersonate_token \\willie-pc\willie

    ```


    6. Finally, we run a shell command. If we are successful, we are now using the
    current system as another user.


