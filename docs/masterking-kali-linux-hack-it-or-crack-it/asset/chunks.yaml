    \n10.我们可以通过对链接的子节点执行相同的操作来获取更多信息，直到获取到我们想要的信息为止。\n\n## 工作原理……\n\n在本教程中，我们使用 Maltego\
    \ 绘制了网络图。Maltego 是一个由 Paterva 创建的用于信息收集和取证的开源工具。我们通过完成设置向导开始教程。接下来，我们通过将 `Domain`\
    \ 实体拖入图中使用了它。最后，我们允许 Maltego 通过检查各种来源来完成任务并完成我们的图表。这使得 Maltego 变得非常有用，因为我们能够利用这种自动化来快速收集有关目标的信息，例如收集电子邮件地址、服务器、执行\
    \ WHOIS 查询等。\n\n社区版仅允许我们使用 75 个转换作为信息收集的一部分。Maltego 的完整版目前价格为 650 美元。\n\n85\n\
    ![](img/00083.jpeg)\n\n## 信息收集\n\n### 更多……\n\n激活和停用转换是通过 `Manage` 丝带选项卡下的 `Transform\
    \ Manager` 窗口完成的：\n\n为了使用多个转换，必须先接受免责声明。\n\n## 绘制网络\n\n利用从之前的教程中获得的信息，我们现在可以创建组织网络的蓝图了。在本章的最后一个教程中，我们将看到如何使用\
    \ `Maltego CaseFile` 可视化地编译和组织获得的信息。\n\n`CaseFile` 正如开发者网站所示，它就像是没有转换的 Maltego，但拥有海量功能。大多数功能将在本教程的“如何操作……”部分进行演示。\n\
    \n86\n![](img/00084.jpeg)\n\n# 第 4 章\n\n## 如何操作……\n\n让我们通过启动 CaseFile 开始教程：\n\n\
    1. 通过 `Applications|Kali Linux|Reporting Tools|Evidence Management|casefile` 启动\
    \ CaseFile。\n2. 要创建一个新图，点击 `CaseFile` 应用程序菜单中的 `New`：\n\n87\n![](img/00085.jpeg)\n\
    # 信息收集\n\n3. 就像 Maltego 一样，我们将每个实体从 `componentPalette` 拖放到图文档中。让我们先从拖入 `Domain`\
    \ 实体并更改 `Domain Name` 属性开始：\n4. 要添加注释，将鼠标指针悬停在实体上并双击注释图标：\n\n88\n![](img/00086.jpeg)\n\
    # 第 4 章\n\n5. 让我们拖入另一个实体以记录来自目标的 DNS 信息：\n\n89\n![](img/00087.jpeg)\n# 信息收集\n\n\
    6. 要链接实体，只需将线从一个实体拖动到另一个实体：\n7. 根据需要自定义链接的属性：\n\n90\n![](img/00088.jpeg)\n# 第\
    \ 4 章\n\n8. 重复步骤 5、6 和 7，向图表中添加更多关于组织网络的信息：\n9. 最后，我们保存信息图。如果我们觉得有需要，可以在以后打开并编辑该图文档，例如当我们从获取的目标中获得更多信息时的情况下。\n\
    \n## 工作原理……\n\n在本教程中，我们使用 Maltego CaseFile 绘制了网络。`CaseFile` 是一个视觉智能应用，我们用它来确定数百种不同类型信息之间的关系和现实链接。它主要是一个离线情报，意味着这是一个手动过程。我们通过启动\
