  trans: "\n\nOpenVAS，即开放漏洞评估系统，是一个优秀的框架，可用于评估我们目标的漏洞。它是 Nessus 项目的一个分支。与 Nessus 不同，OpenVAS\
    \ 完全免费提供其馈送（feeds）。由于 OpenVAS 是 Kali Linux 的标准配置之一，我们将从配置开始。\n\n## 准备工作\n\n完成此配谱需要连接互联网。\n\
    \n## 如何操作...\n\n让我们通过终端窗口导航到其目录，开始安装、配置和启动 OpenVAS 的过程：\n\n1. OpenVAS 默认已安装，只需对其进行配置即可使用。\n\
    2. 从终端窗口中，将目录更改到 OpenVAS 目录：\n```bash\ncd /usr/share/openvas/\n```\n\n![](img/00109.jpeg)\n\
    \n### 漏洞评估\n\n3. 执行以下命令：\n```bash\nopenvas-mkcert\n```\n\n我们在这一步中正在执行的操作是为 OpenVAS\
    \ 程序创建 SSL 证书：\n\n1. 保持 CA 证书的默认有效期不变。\n2. 更新证书有效期，以与 CA 证书的天数匹配：`1460`。\n3. 输入国家。\n\
    4. 输入州或省（如果需要）。\n5. 将组织名称保持为默认。\n6. 你将看到证书确认屏幕，然后按 `Enter` 退出。\n\n4. 执行以下命令：\n\
    ```bash\nopenvas-nvt-sync\n```\n\n这将将 OpenVAS NVT 数据库与当前的 NVT 馈送同步。它还将向你更新最新的漏洞检查项：\n\
    \n![](img/00110.jpeg)\n\n5. 执行以下命令：\n```bash\nopenvas-mkcert-client -n om -i openvasmd\
    \ -rebuild\n```\n这将分别生成客户端证书并重建数据库。\n\n6. 执行以下命令：\n```bash\nopenvassd\n```\n这将启动\
    \ OpenVAS 扫描器并加载所有插件（约 26,406 个），因此这可能需要一些时间。\n\n7. 执行以下命令：\n```bash\nopenvasmd\
    \ --rebuild\nopenvasmd --backup\n```\n这些命令将重建并创建数据库的备份。\n\n8. 执行以下命令创建你的管理员用户（我们使用\
    \ `openvasadmin`）：\n```bash\nopenvasad -c 'add_user' -n openvasadmin -r admin\n\
    ```\n\n9. 执行以下命令：\n```bash\nopenvas-adduser\n```\n\n![](img/00111.jpeg)\n\n这将允许你创建一个普通用户：\n\
    \n1. 输入登录名。\n2. 在身份验证请求上按 `Enter`（会自动选择密码）。\n3. 输入两次密码。\n4. 对于规则，按 `Ctrl+D`。\n\
    5. 按 `Y` 添加用户。\n\n10. 执行以下命令来配置 OpenVAS 将交互的端口：\n```bash\nopenvasmd -p 9390 -a\
    \ 127.0.0.1\nopenvasad -a 127.0.0.1 -p 9393\ngsad --http-only --listen=127.0.0.1\
    \ -p 9392\n```\n`9392` 是 Web 浏览器的端口，但你可以选择自己的端口。\n\n![](img/00112.jpeg)\n\n11.\
    \ 在浏览器中访问 `http://127.0.0.1:9392` 查看 OpenVAS Web 界面。\n\n## 工作原理...\n\n在本次配谱中，我们首先打开终端窗口并通过仓库安装了\
    \ OpenVAS。然后我们创建了证书并安装了插件数据库。接下来，我们创建了一个管理员和一个普通用户账户。最后，我们启动了 OpenVAS 的 Web 界面并出现了登录屏幕。每当你对\
    \ OpenVAS 执行操作时，你都需要重建数据库。\n\n![](img/00113.jpeg)\n\n## 更多内容...\n\n本节解释了关于启动 OpenVAS\
    \ 的额外信息。\n\n### 设置 SSH 脚本启动 OpenVAS\n\n每当你想要运行 OpenVAS 时，你需要：\n1. 同步 NVT 馈送（一直是个好主意，因为这些项目会随着新漏洞的发现而变化）。\n\
    2. 启动 OpenVAS 扫描器。\n3. 重建数据库。\n4. 备份数据库。\n5. 配置你的端口。\n\n为了节省时间，以下是一个允许你启动 OpenVAS\
    \ 的简单 Bash 脚本。将此文件保存为 `OpenVAS` 并放置在 `/root` 文件夹中：\n```bash\n#!/bin/bash\nopenvas-nvt-sync\n\
    openvassd\nopenvasmd --rebuild\nopenvasmd --backup\nopenvasmd -p 9390 -a 127.0.0.1\n\
    openvasad -a 127.0.0.1 -p 9393\ngsad --http-only --listen=127.0.0.1 -p 9392\n\
    ```\n\n![](img/00114.jpeg)\n\n### 使用 OpenVAS 桌面\n\n可选，你可以通过 OpenVAS Desktop 执行相同的步骤。OpenVAS\
    \ Desktop 是一个基于 GUI 的应用程序。要启动该应用程序：\n1. 从 Kali Linux 菜单中如截图所示，导航到 `Applications`|`Kali\
    \ Linux`|`Vulnerability Assessment`|`Vulnerability Scanners`|`OpenVAS`|`Start\
    \ Green Security Desktop`。\n2. 通过 OpenVAS Desktop 可以执行相同的步骤。\n3. 启动应用程序后，你会看到登录界面。\n\
    4. 每次你对 OpenVAS 执行操作时，你都需要重建数据库。\n\n![](img/00115.jpeg)\n\n### OpenVAS - 漏洞\n\n\
    我们可以通过 OpenVAS 扫描一些漏洞。\n\n### 如何操作...\n\n在本次配谱中，我们 ` `127.0.0.1:9392` 浏览器中打开 OpenVAS\
    \ 界面并登录。\n1. 进入 `Configuration`|`Scans`。\n2. 我们现在创建一个扫描配置。\n3. 在此配谱中，我们使用 `Local\
    \ Vulnerabilities`。\n4. 我们的扫描配置是 `static`。我们选择 `fast`。\n5. 点击 `Scan Config`。\n\
    \n![](img/00116.jpeg)\n\n### 漏洞\n\n我们可以通过 OpenVAS 扫描一些漏洞。\n\n### 如何操作...\n\n在本次配谱中，我们通过\
    \ `127.0.0.1:9392` 浏览器中打开 OpenVAS 界面并登录。\n1. 进入 `Configuration`|`Local Vulnerabilities`。\n\
    2. 在图标图标，点击 `Local` 搜索。\n3. 在 `Select all families` 框中勾选。\n4. 选中的本地漏洞包括：\n   -\
    \ 合规性 (Compliance)\n   - 默认账户 (Credentials)\n   - 拒绝服务 (Denial of Service)\n \
    \  - FTP\n   - Ubuntu 安全检查 (Ubuntu Security Checks)\n5. 点击 `Save Config`。\n\n\
    ![](img/00117.jpeg)\n\n### 目标\n\n我们可以通过 OpenVAS 扫描一些漏洞。\n\n### 如何操作...\n\n现在进入\
    \ `Configuration`|`Targets`。\n1. 创建一个新目标。\n2. 使用以下方式之一输入主机：\n   - 输入单个地址：`192.168.0.10`\n\
    \   - 使用逗号分隔多个地址：`192.168.0.10,192.168.0.15`\n   - 输入地址范围：`192.168.0.1-20`\n3.\
    \ 点击 `onCreate Target`。\n\n### \n\n现在选择 `Scan Management`|`New Task` 并执行以下任务：\n\
    1. 输入任务名称。\n2. 输入注释（可选）。\n3. 选择你的扫描配置。在此配谱中，我们使用 `Local Vulnerabilities`。\n4.\
    \ 选择扫描目标。在此配谱中，我们使用 `Local Network`。\n5. 将所有其他选项保持在默认级别。\n6. 点击 `onCreate Task`。\n\
    \n7. 现在进入 `Scan Management`|`Tasks`。\n8. 点击扫描旁边的播放按钮。在此配谱中，我们使用 `Local Vulnerability\
    \ Scan`。\n\n扫描完成后，你可以通过查看报告来查看结果：\n1. 现在进入 `Scan Management`|`Tasks`。\n2. 点击 `Local\
    \ Vulnerability Scan` 旁边的紫色放大镜。\n3. 点击下载箭头查看报告。\n\n![](img/00120.jpeg)\n"
- fmt: "\n# OpenVAS - finding network vulnerabilities\n\nIn this recipe, we will use\
    \ OpenVAS to scan for network vulnerabilities. These are vulnerabilities specific\
    \ to devices on our targeted network.\n\n## Getting ready\n\nTo complete this\
    \ recipe, you will need a virtual machine(s) to test against:\n* Windows XP\n\
    * Windows 7\n* Metasploitable 2.0\n* Any other flavor of Linux\n\n## How to do\
    \ it...\n\nLet's begin the process of finding network vulnerabilities with OpenVAS\
    \ by opening the Mozilla Firefox web browser:\n\n1. Go to `http://127.0.0.1:9392`\
    \ and log in to OpenVAS.\n2. Go to `Configuration|Scan Configs`:\n3. Enter the\
    \ name of the scan. For this recipe, we will use `Network Vulnerabilities`.\n\
    4. For the base, select the `Empty`, static and fast option. This option allows\
    \ us to start from scratch and create our own configuration.\n\n![](images/00121.jpeg)\n\
    \n## Vulnerability Assessment\n\n5. Click `onCreate Scan Config:`.\n6. We now\
    \ want to edit our scan config. Click on the wrench icon next to `Network Vulnerabilities`.\n\
    7. Press `Ctrl+F` and type `Network` in the find bar.\n8. For each family found,\
    \ put a check mark in the `Select all NVT's` box.\n\nA family is a group of vulnerabilities.\
    \ The chosen vulnerabilities are:\n* Brute force attacks\n* Buffer overflow\n\
    * CISCO\n* Compliance\n* Credentials\n* Databases\n* Default Accounts\n* Denial\
    \ of Service\n* FTP\n* Finger abuses\n* Firewalls\n* Gain a shell remotely\n*\
    \ General\n* Malware\n* Netware\n* NMAP NSE\n* Peer-To-Peer File Sharing\n* Port\
    \ Scanners\n* Privilege Escalation\n* Product Detection\n* RPC\n* Remote File\
    \ Access\n* SMTP Problems\n* SNMP\n* Service detection\n* Settings\n* Wireless\
    \ services\n9. Click on `Save Config`.\n10. Now go to `Configuration|Targets`:\n\
    \n![](images/00123.jpeg)\n\n11. Create a new target and perform the following\
    \ tasks:\n    1. Enter the name of the target.\n    2. Enter the hosts using one\
    \ of the following ways:\n        * Enter only one address: `192.168.0.10`\n \
    \       * Enter multiple e-mail addresses separated by a comma: `192.168.0.10,192.168.0.15`\n\
    \        * Enter a range of addresses: `192.168.0.1-20`\n12. Click on `Save Target`.\n\
    13. Now go to `Scan Management|New Task` and perform the following:\n    1. Enter\
    \ the name of the task.\n    2. Enter a comment (optional).\n    3. Select your\
    \ scan configuration. In this case `Network Vulnerabilities`.\n    4. Select the\
    \ scan targets. In this case `Local`.\n    5. Leave all options at their default.\n\
    \    6. Click `onCreate Task:`.\n14. Now go to `Scan Management|Tasks`.\n15. Click\
    \ on the play button next to our scan. In this case `Network Vulnerability`.\n\
    \n![](images/00124.jpeg)\n\n## How it works...\n\nIn this recipe, we launched\
    \ OpenVAS and logged into its web-based interface. We then configured OpenVAS\
    \ to search for a set of network vulnerabilities. Finally, we selected our target\
    \ and completed the scan. OpenVAS then scanned the target against the list of\
    \ known vulnerabilities included in our NVT Feed.\n\n## There's more...\n\nOnce\
    \ your scan has been performed, you can see the results by viewing the report:\n\
    1. Go to `Scan Management|Tasks`.\n2. Click on the purple magnifying glass next\
    \ to `Network Vulnerabilities`.\n3. Click on the arrow to view the report:\n\n\
    ![](images/00125.jpeg)\n\n# OpenVAS - finding Linux-specific vulnerabilities\n\
    \nIn this recipe, we will use OpenVAS to scan for Linux vulnerabilities. These\
    \ are vulnerabilities specific to Linux machines on our targeted network.\n\n\
    ## Getting ready\n\nTo complete this recipe, you will need a virtual machine(s)\
    \ to test against:\n* Metasploitable 2.0\n* Any other flavor of Linux\n\n## How\
    \ to do it...\n\nLet's begin the process of finding Linux-specific vulnerabilities\
    \ with OpenVAS by opening the Mozilla Firefox browser:\n\n1. Go to `http://127.0.0.1:9392`\
    \ and log in to OpenVAS.\n2. Go to `Configuration|Scan Configs`:\n3. Enter the\
    \ name of the scan. For this recipe, we will use `Linux Vulnerabilities`.\n4.\
    \ For the base, select the `Empty`, static and fast option. This option allows\
    \ us to start from scratch and create our own configuration.\n\n![](images/00126.jpeg)\n\
    \n5. Click `onCreate Scan Config:`.\n6. We now want to edit our scan config. Click\
    \ on the wrench icon next to `Linux Vulnerabilities`.\n7. Press `Ctrl+F` and type\
    \ `Linux` in the find bar.\n8. For each local family found, put a check mark in\
    \ the `Select all NVTs` box.\n\nThe chosen vulnerabilities are:\n* Brute force\
    \ attacks\n* Buffer overflow\n* Compliance\n* Credentials\n* Databases\n* Default\
    \ Accounts\n* Denial of Service\n* FTP\n* Finger abuses\n* Gain a shell remotely\n\
    * General\n* Malware\n* Netware\n* NMAP NSE\n* Port Scanners\n* Privilege Escalation\n\
    * Product Detection\n* RPC\n* Remote File Access\n* SMTP Problems\n* SNMP\n* Service\
    \ detection\n* Settings\n* Wireless services\n* Web Servers\n9. Click on `Save\
    \ Config`.\n10. Now go to `Configuration|Targets`:\n11. Create a new target and\
    \ perform the following tasks:\n    1. Enter the name of the target.\n    2. Enter\
    \ the hosts using one of the following ways:\n        * Enter only one address:\
    \ `192.168.0.10`\n        * Enter multiple e-mail addresses separated by a comma:\
    \ `192.168.0.10,192.168.0.15`\n        * Enter a range of addresses: `192.168.0.1-20`\n\
    12. Click on `Save Target`.\n\n![](images/00128.jpeg)\n\n13. Now go to `Scan Management|New\
    \ Task` and perform the following:\n    1. Enter the name of the task.\n    2.\
    \ Enter a comment (optional).\n    3. Select your scan configuration. In this\
    \ case `Network Vulnerabilities`.\n    4. Select the scan targets. In this case\
    \ `Local`.\n    5. Leave all options at their default.\n    6. Click `onCreate\
    \ Task:`.\n14. Now go to `Scan Management|Tasks`.\n15. Click on the play button\
    \ next to our scan. In this case `Network Vulnerability`.\n\n## Vulnerability\
    \ Assessment\n\n## How it works...\n\nIn this recipe, we launched OpenVAS and\
    \ logged into its web-based interface. We then configured OpenVAS to search for\
    \ a set of network vulnerabilities. Finally, we selected our target and completed\
    \ the scan. OpenVAS then scanned the target against the list of known vulnerabilities\
    \ included in our NVT Feed.\n\n## There's more...\n\nOnce your scan has been performed,\
    \ you can see the results by viewing the report:\n1. Go to `Scan Management|Tasks`.\n\
    2. Click on the purple magnifying glass next to `Network Vulnerabilities`.\n3.\
    \ Click on the arrow to view the report:\n\n![](images/00129.jpeg)\n\n# OpenVAS\
    \ - finding Windows-specific vulnerabilities\n\nIn this recipe, we will use OpenVAS\
    \ to scan for Windows vulnerabilities. These are vulnerabilities specific to Windows\
    \ machines on our targeted network.\n\n## Getting ready\n\nTo complete this recipe,\
    \ you will need a virtual machine(s) to test against:\n* Windows XP\n* Windows\
    \ 7\n\n![](images/00130.jpeg)\n\n## How to do it...\n\nLet's begin the process\
    \ of finding Windows-specific vulnerabilities with OpenVAS by opening the Mozilla\
    \ Firefox web browser:\n\n1. Go to `http://127.0.0.1:9392` and log in to OpenVAS.\n\
    2. Go to `Configuration|Scan Configs`:\n3. Enter the name of the scan. For this\
    \ recipe, we will use `Windows Vulnerabilities`.\n4. For the base, select the\
    \ `Empty`, static and fast option.\n5. Click `onCreate Scan Config:`.\n6. We now\
    \ want to edit our scan config. Click on the wrench icon next to `Windows Vulnerabilities`.\n"
