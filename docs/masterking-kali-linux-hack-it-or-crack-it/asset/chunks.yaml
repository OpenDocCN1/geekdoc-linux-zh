    ## Password profiling

    In this recipe, we will learn how to profile passwords before we begin our password
    attack. The purpose of profiling passwords is to allow us to get to a smaller
    wordlist by gathering information against our target machine, business, and so
    on. In this tutorial, we will use `Ettercap` and its ARP poisoning function to
    sniff traffic.


    ### Getting ready

    A connection to the local network is required to complete this recipe.


    ### How to do it...

    Let''s begin the process of password profiling by launching `Ettercap`.


    1. We begin this recipe by configuring `Ettercap`. First, we locate its configuration
    file and edit it using `VIM`.

    ```bash

    locate etter.conf

    vi /etc/etterconf

    ```

    Note, your location may be different.


    2. Change the `ec_uid` and `ec_gid` values to `0`.


    ![](images/00195.jpeg)


    3. Next we need to uncomment the following `IPTABLES` lines under the `LINUX`
    section near the end of the file:

    4. Now, we are finally ready to launch `Ettercap`. Using the `-G` option, launch
    the Graphical User Interface (GUI).

    ```bash

    ettercap -G

    ```


    ![](images/00196.jpeg)


    5. We begin the process by turning on unified sniffing. You can press `Shift+U`
    or by using the menu and navigating to `Sniff|Unified sniffing...`.

    6. Select the network interface.

    7. Next, we turn on `Scan` for hosts. This can be accomplished by pressing `Ctrl+S`
    or by using the menu and navigating to `Hosts|Scan for hosts`.

    8. Now we are able to allow `Ettercap` to begin sniffing. You can press either
    `Ctrl + W` or use the menu and navigate to `Start|Start Sniffing`.


    ![](images/00197.jpeg)


    9. Finally, we begin the ARP poisoning process. From the menu, navigate to `Mitm|Arp
    poisoning`.

    10. In the window that appears, check the optional parameter for `Sniff remote
    connections`.

    11. Depending on the network traffic, we will begin to see the information.


    ![](images/0198.jpeg)


    12. Once we have found what we are looking for (usernames and passwords), we turn
    off `Ettercap`. You can do this by either pressing `Ctrl+E` or using the menu
    and navigating to `Start|Stop sniffing`.

    13. Now we need to turn off ARP poisoning and return the network back to normal.


    ### How it works...

    In this recipe, we have used `Ettercap` to poison a network and steal usernames
    and passwords from the network. We began the recipe by locating and altering `Ettercap`''s
    configuration file. Next we launched `Ettercap` and executed a Man In The Middle
    (MITM) attack using ARP poisoning. As the traffic is redirected to our machine,
    we will be able to see usernames and passwords as they are transmitted by users
    on the network.


    ### There''s more...

    We can also use `Metasploit` to profile usernames as well. We will perform this
    using the `search_collector` module.


    1. Open a terminal window and begin `msfconsole`:

    ```bash

    msfconsole

    ```

    2. Search for the email collector:

    ```bash

    search email collector

    ```

    3. Issue the command to use the search email collector module:

    ```bash

    use auxiliary/gather/email_collector

    ```

    4. Show the available options for the module:

    ```bash

    show options

    ```

    5. Next we set our domain. Please be careful with your choice! You do not want
    federal authorities at your door!

    6. Set the domain with your desired domain name:

    ```bash

    set domain gmail.com

    ```

    7. Set the output file. This does not have to be done and is optional. It''s recommended
    to use this if you are going to run several attacks or if you want to be able
    to run an attack at a later time.

    ```bash

    set outfile /root/Desktop/willie.txt

    ```

    8. Finally, we run the exploit:

    ```bash

    run

    ```


    ## Cracking a Windows password using John the Ripper

    In this recipe, we will utilize `John the Ripper (John)` to crack a Windows Security
    Access Manager (`SAM`) file. The `SAM` file stores the usernames and password
    hashes of users of the target Windows system. For security reasons, the `SAM`
    file is protected from unauthorized access by not being able to be opened manually
    or copied while the Windows system is in operation.


    ### Getting ready

    You will need access to a `SAM` file. For this recipe, we will assume that you
    have gained access to a Windows host machine.


    ### How to do it...

    Let''s begin the process of cracking a Windows `SAM` file using `John the Ripper`.
    We are assuming that you have accessed the Windows machine via either a remote
    hack or you have physical access to the computer and are using Kali Linux on a
    USB or DVD-ROM drive.


    1. Check for the hard drive you wish to mount:

    ```bash

    fdisk -l

    ```


    ![](images/0201.jpeg)


    2. Mount the hard drive and set `/target` as its mount point:

    ```bash

    mount /dev/sda1 /target/

    ```

    3. Change directories to the location of the Windows `SAM` file:

    ```bash

    cd /target/windows/system32/config

    ```

    4. List all of the contents of the directory:

    ```bash

    ls -al

    ```

    5. Use `samdump2` to extract the hash and place the file in your root user directory
    in a folder called `hashes`:

    ```bash

    samdump2 system SAM > /root/hashes/hash.txt

    ```

    6. Change directories to the directory of John the Ripper:

    ```bash

    cd /pentest/passwords/john

    ```

    7. Run John the Ripper:

    ```bash

    ./john /root/hashes/hash.txt

    ./john /root/hashes/hash.txt -ntfs

    ```

    (If attacking a file on an NTFS System)


    ## Using dictionary attacks

    In this recipe, we will examine dictionary or wordlist attacks. A dictionary attack
    uses a predetermined set of passwords and attempts to brute-force a password match
    for a given user against the wordlist. There are three types of dictionary lists
    that are generally generated:

    - Username Only: Lists containing generated usernames only.

    - Password Only: Lists containing generated passwords only.

    - Username and Password Lists: Lists containing both generated usernames and passwords.


    For our demonstration purposes, we will utilize `Crunch` to generate our own password
    dictionary.


