    - `attackfile` 是我们的攻击文件

    - `-1 ?l?u?d?` 指定自定义字符集一，选项包括小写、大写、数字和特殊字符

    - `?1?1?1?1` 是我们使用字符集一的左掩码

    - `?1?1?1?1` 是我们使用字符集一的右掩码


