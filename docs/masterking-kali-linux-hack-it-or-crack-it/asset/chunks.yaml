    # Physical access attacks


    In this recipe, we will utilize `SUCrack` to perform a physical access password
    attack. `SUCrack` is a multithreaded tool that allows for brute-force cracking
    of local user accounts via `su`. The `su` command in Linux allows you to run commands
    as a substitute user. This attack, though useful when you are unable to escalate
    privileges on a Linux/Unix system by other means, will fill up the log files rather
    quickly so please be sure to clean the log files after completion.


    `SUCrack` has several command options that we can use:


    - `--help` allows you to view the help file for `SUCrack`.

    - `-l` allows you to change the user whose login we are attempting to circumvent.

    - `-s` allows you to set the number of seconds between when statistics are displayed.
    The default setting is every 3 seconds.


    ![](images/00208.jpeg)


    ## Password Attacks


    - `-a` allows you to set whether ANSI escape codes should be used or not.

    - `-w` allows you to set the number of worker threads that `SUCrack` can utilize.
    Since `SUCrack` is multi threaded, you can run as many worker threads as you wish.
    We recommend using only one as each failed login attempt usually causes a 3 second
    delay before the next password is attempted.


    ### How to do it...


    1. In order to use `SUCrack`, you must specify a wordlist when opening it. Otherwise,
    you will get a funny message. Open a terminal window and execute the `sucrack`
    command. For our purposes, we will use a previously created custom wordlist file
    generated by `Crunch`. However, you can specify any wordlist that you would like.

    ```

    sucrack /usr/share/wordlists/rockyou.txt

    ```


    2. If you would like to set two worker threads, want to display statistics every
    6 seconds, and want to set ANSI escape codes to be used, you can use the following
    command:

    ```

    sucrack -w 2 -s 6 -a /usr/share/wordlists/rockyou.txt

    ```


    That''s it!


    ### How it works...


    In this recipe, we used `SUCrack` to perform a physical access password attack
    on the root user of the system. The attack works by using the wordlist specified
    to perform a dictionary attack against either the administrator (the default choice)
    or a specified user. We run the `sucrack` command, which provides us with our
    attack.


