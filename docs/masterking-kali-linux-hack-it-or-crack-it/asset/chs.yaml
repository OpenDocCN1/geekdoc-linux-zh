  \ `medusa`——即可获取更多详情。\n\n## 模块类型\n以下是我们可以配合 `Medusa` 使用的模块列表：\n- AFP\n- CVS\n- FTP\n\
  - HTTP\n- IMAP\n- MS-SQL\n- MySQL\n- NetWare\n- NNTP\n- PCAnywhere\n- Pop3\n- PostgreSQL\n\
