  \ E\n```\n\n154![](img/00148.jpeg)\n\n第 6 章\n\n## 工作原理...\n\n\n- **漏洞 (Vulnerabilities)**：这些是对特定应用程序、软件或协议的已知和未知的缺陷。\n\
  - **漏洞利用 (Exploits)**：这些是为了利用发现的漏洞模块。\n- **载荷 (Payloads)**：一旦漏洞利用成功运行，必须将载荷交付到受攻击机器上，以便创建\
  \ shell、运行各种命令、添加用户等。\n\n155![](img/00149.jpeg)\n\n### 漏洞利用\n\n一旦你通过 MSFCLI 或 MSFCONSOLE\
