  \ 关于作者\n\n你好，我叫 Ajay Kumar tiwari。我是一名 IT 安全专家，对 VAPT（漏洞评估与渗透测试）、无线安全、移动安全和漏洞开发有浓厚兴趣。目前，我在德国和俄罗斯的一家机密机构担任网络安全架构师。我是《精通\
  \ Kali Linux》、《黑客的 Python》、《Linux 黑客》和《成为黑客的最简单方法》等书的作者。我持有 C|EH、CISE 和 OSWP 认证。此外，在大学学习期间，我曾担任学校\
  \ EC-COUNCIL 项目的大使。\n\n我在 IT 安全领域拥有 6 年以上的丰富经验，并通过远程学习包为德里的 Vidhyavilla 运营我的 Web\
  \ 渗透测试课程。我在印度多所知名大学举办过 90 多场关于伦理黑客和渗透测试的研讨会，并在印度进行过漏洞开发和渗透测试的企业培训。我曾在多个 IT 安全会议上发表过演讲，我的部分文章和研究论文可以在网上找到，你也可以在\
  \ Hakin9 和 EForensics（无线取证、iOS 取证、移动取证）等流行安全杂志上找到部分内容。我曾受邀为 Offensive Security、Rapid7、AT&T、Facebook、Apple、BlackBerry、Redhat、Nokia、Microsoft、Adobe、Baracudda\
  \ Labs、Kaneva、Zynga.com 和 CERT India 发现漏洞。\n\nwww.ajaykumartiwari.in\n\n\n\n\n###\
