  - SMTp-VRFY\n- SNMP\n- SSHv2\n- Subversion\n- Telnet\n- VMware Authentication\n\
  - VNC\n- Generic Wrapper\n- Web form\n\n## 密码分析\n在本例中，我们将学习在开始密码攻击之前如何对密码进行分析。密码分析的目的是通过收集针对目标机器、业务等的信息，使我们能够获得更小的字典列表。在教程中，我们将使用\
  \ `Ettercap` 及其 ARP 投毒功能来嗅探流量。\n\n### 准备工作\n完成此用例需要连接到本地网络。\n\n## 如何操作...\n让我们通过启动\
  \ `Ettercap` 开始密码分析过程。\n\n1. 我们首先通过配置 `Ettercap` 开始本用例。首先，找到它的配置文件并使用 `VIM` 进行编辑。\n\
  ```bash\nlocate etter.conf\nvi /etc/etterconf\n```\n注意，你的位置可能有所不同。\n\n2. 将 `ec_uid`\
  \ 和 `ec_gid` 的值改为 `0`。\n\n![](img/00195.jpeg)\n\n3. 接下来我们需要取消文件末尾 `LINUX` 部分下以下\
  \ `IPTABLES` 行的注释：\n4. 现在，我们终于准备好启动 `Ettercap` 了。使用 `-G` 启动图形用户界面 (GUI)。\n```bash\n\
  ettercap -G\n```\n\n![](img/00196.jpeg)\n\n5. 我们通过开启统一嗅探开始过程。你可以按下 `Shift+U`，或者使用菜单导航到\
  \ `Sniff|Unified sniffing...`。\n6. 选择网络接口。\n7. 接下来，我们开启主机的 `Scan` 功能。这可以通过按下 `Ctrl+S`\
  \ 或使用菜单导航到 `Hosts|Scan for hosts` 来实现。\n8. 现在我们可以允许 `Ettercap` 开始嗅探。你可以按下 `Ctrl\
  \ + W` 或使用菜单导航到 `Start|Start Sniffing`。\n\n![](img/00197.jpeg)\n\n9. 最后，我们开始 ARP\
  \ 投毒过程。从菜单导航到 `Mitm|Arp poisoning`。\n10. 在弹出的窗口中，勾选 `Sniff remote connections` 的可选参数。\n\
  11. 根据网络流量，我们将开始看到相关信息。\n\n![](img/0198.jpeg)\n\n12. 一旦我们找到了寻找的内容（用户名和密码），我们就关闭\
  \ `Ettercap`。你可以通过按下 `Ctrl+E` 或使用菜单导航到 `Start|Stop sniffing` 来实现。\n13. 现在我们需要关闭\
  \ ARP 投毒并让网络恢复正常。\n\n## 工作原理...\n在本例中，我们使用 `Ettercap` 对网络进行投毒，并从网络中窃取用户名和密码。我们在开始用例时，通过定位并修改\
  \ `Ettercap` 的配置文件开始操作的。接着，我们启动了 `Ettercap` 并使用 ARP 投毒执行了中间人 (MITM) 攻击。当流量被重定向到我们的机器时，我们能够看到用户在网络传输的用户名和密码。\n\
