  \ Meterpreter 负责实际的载荷和漏洞利用交互。\n\nMeterpreter 使用的一些命令包括：\n\n- `background`: 此命令允许\
  \ Meterpreter 会话在后台运行。该命令将带回到 MSF（Metasploit）提示符。\n- `download`: 此命令允许你从受害者机器下载文件。\n\
