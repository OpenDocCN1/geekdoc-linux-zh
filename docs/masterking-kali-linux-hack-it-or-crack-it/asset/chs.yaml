  \n### 更多内容...\n\n本节解释了关于启动 OpenVAS 的额外信息。\n\n### 设置 SSH 脚本启动 OpenVAS\n每当你想要运行 OpenVAS\
  \ 时，你需要：\n1. 同步 NVT 馈送（一直是个好主意，因为这些项目会随着新漏洞的发现而变化）。\n2. 启动 OpenVAS 扫描器。\n3. 重建数据库。\n\
  4. 备份数据库。\n5. 配置你的端口。\n\n为了节省时间，以下是一个允许你启动 OpenVAS 的简单 Bash 脚本。将此文件保存为 `OpenVAS`\
  \ 并放置在 `/root` 文件夹中：\n```bash\n#!/bin/bash\nopenvassd\nopenvasmd --rebuild\nopenvasmd\
  \ --backup\nopenvasmd -p 9390 -a 127.0.0.1\nopenvasad -a 127.0.0.1 -p 9393\ngsad\
  \ --http-only --listen=127.0.0.1 -p 9392\n```\n\n![](img/00114.jpeg)\n\n\n可选，你可以通过\
  \ OpenVAS Desktop 执行相同的步骤。OpenVAS Desktop 是一个基于 GUI 的应用程序。要启动该应用程序：\n1. 从 Kali Linux\
  \ 菜单中如截图所示，导航到 `Applications`|`Kali Linux`|`Vulnerability Assessment`|`Vulnerability\
  \ Scanners`|`OpenVAS`|`Start Green Security Desktop`。\n2. 通过 OpenVAS Desktop 可以执行相同的步骤。\n\
  3. 启动应用程序后，你会看到登录界面。\n4. 每次你对 OpenVAS 执行操作时，你都需要重建数据库。\n\n![](img/00115.jpeg)\n\n\
