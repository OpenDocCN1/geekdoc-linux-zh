  ```\n4. 显示模块的可用选项：\n```bash\nshow options\n```\n5. 接下来我们设置域名。请谨慎做出选择！你可不想让联邦当局敲你的家门！\n\
  6. 使用你所需的域名设置域名：\n```bash\nset domain gmail.com\n```\n7. 设置输出文件。这并不是必须的，是可选的。如果你打算运行多次攻击或希望能够再次运行，则建议使用此项。\n\
  ```bash\nset output /path/to/file\n```\n8. 最后，我们运行。\n\n## 使用 John the Ripper 破解\
  \ 密码\n在本例中，我们将使用 John the Ripper 破解 Windows 密码。`John the Ripper` 用于 `SAM` 文件。\n\n\
  ### 准备工作\n你需要访问 Windows 机器并需要一个 `SAM` 文件。在本用例中，假设你已经访问了 Windows 机器。\n\n## 如何操作...\n\
  让我们通过 `John the Ripper` 开始破解 `SAM` 文件的过程。假设你通过远程黑客或物理访问了计算机。\n\n1. 检查要挂载的硬盘：\n```bash\n\
  fdisk -l\n```\n\n![](img/0201.jpeg)\n\n2. 挂载硬盘并将 `/target` 设置挂挂点：\n```bash\nmount\
  \ /dev/sda1 /target\n```\n3. 进入 `SAM` 文件所在的目录：\n```bash\ncd /target/windows/system32/config\n\
  ```\n4. 列出目录下所有内容：\n```bash\nls -al\n```\n5. 使用 `samdump2` 提取哈希并放在根用户目录的 `hashes`\
  \ 文件夹下：\n```bash\nsamdump2 system > /root/hashes/hash.txt\n```\n6. 进入 John the Ripper\
  \ 目录：\n```bash\ncd /pentest/passwords/john\n```\n7. 运行 John the Ripper：\n```bash\n\
  ./john /root/hashes/hash.txt\n```\n（如果在 NTFS 系统上攻击）\n\n## 使用字典攻击\n在本例中，我们将检查字典或词列表攻击。字典攻击使用预设的密码集，并尝试对给定用户进行暴力破解匹配。通常生成三种类型的字典列表：\n\
  - 仅用户名：仅生成的用户名的列表。\n- 仅密码：仅生成的密码的列表。\n- 用户名和密码列表：包含生成的用户名和密码的列表。\n\n为了演示，我们将利用 `Crunch`\
  \ 生成自己的字典。\n\n### 准备工作\n此用例需要在你的 Kali 安装中安装 `Crunch`。\n\n![](img/0202.jpeg)\n\n\
  ## 如何操作...\nKali 与 BackTrack 的不同之处在于，Kali 已经包含了 `Crunch`。\n\n1. 打开终端窗口并输入 `crunch`\
  \ 命令以查看 `Crunch` 帮助文件：\n```bash\ncrunch\n```\n\n\n\n\n- `-o`: 此选项允许你指定输出单词列表的文件和位置。\n\
  - `-b`: 此选项允许你指定每个文件写入的最大字节数。大小可以用 KB/MB/GB 指定，并且必须与 `-o` START 触发器配合使用。\n- `-t`:\
  \ 此选项允许你指定要使用的模式。\n- `-l`: 此选项在使用 `-t` 选项时识别某些占位符的字面字符（`@`、`%`、`^`）。\n\n4. 接下来，我们执行命令在桌面上创建一个密码列表，长度最小为\
  \ 8 个字符，最大 10 个字符，并使用字符集 `ABCDEFGabcdefg0123456789`。\n\n```bash\ncrunch 8 10 ABCDEFGabcdefg0123456789\
  \ -o /root/Desktop/ generatedCrunch.txt\n```\n\n![](img/00203.jpeg)\n\n# 第 8 章\n\
  \n5. 一旦生成文件，我们使用 `nano` 打开该文件：\n\n```bash\nnano /root/Desktop/generatedCrunch.txt\n\
  ```\n\n## 工作原理...\n在本教程中，我们使用 `Crunch` 生成了密码字典列表。\n\n## 使用彩虹表\n在本教程中，我们将学习如何在 Kali\
  \ 中使用彩虹表。彩虹表是特殊的字典表，它们使用哈希值而不是标准字典密码来实现攻击。为了演示之目的，我们将使用 `RainbowCrack` 来生成彩虹表。\n\
  \n## 如何操作...\n1. 打开终端窗口并切换目录到 `rtgen` 目录：\n```bash\ncd /usr/share/rainbowcrack/\n\
  ```\n2. 接下来，我们将运行 `rtgen` 生成一个基于 MD5 的彩虹表：\n```bash\n./rtgen md5 loweralpha-numeric\
  \ 1 5 0 3800 33554432 0\n```\n\n![](img/00204.jpeg)\n\n## 密码攻击\n\n3. 一旦生成了表——该过程取决于生成哈希值的处理器数量（需要\
  \ 2-7 小时），你的目录将包含 `*.rt` 文件。\n4. 为了开始破解密码，我们将使用 `thersort` 程序对彩虹表进行排序，以使过程变得简单。\n\
  \n## 工作原理...\n在本教程中，我们使用了各种 `RainbowCrack` 工具来生成、排序和破解 MD5 密码。`RainbowCrack` 的工作原理是根据彩虹表中预计算的哈希值对哈希进行暴力破解。我们在教程开始时使用小字母、字母数字生成了\
  \ MD5 彩虹表。在教程结束时，我们通过创建彩虹表并将其用于哈希文件实现了成功。\n\n## 使用 NVIDIA 核心计算统一设备架构 (CUDA)\n在本教程中，我们将使用\
  \ `nVidia Compute Unified Device Architecture (CUDA)` 来破解破解密码哈希。`CUDA` 是一个并行计算平台，通过利用\
  \ GPU 的力量来提高计算性能。随着时间的推移，GPU 处理能力大幅提升，这使得我们能够将其用于计算目的。为了演示之目的，我们将使用 `OclHashcat-lite`\
  \ 来破解密码。\n\n### 准备工作\n完成本教程需要一张支持 `nVidia CUDA` 的显卡。\n\n## 如何操作...\n1. 打开终端窗口并切换到包含\
  \ `OclHashcat` 的目录：\n```bash\ncd /usr/share/oclhashcat-plus\n```\n\n![](img/00205.jpeg)\n\
  \n2. 执行以下命令以启动 `cudaHashcat-lite-help` 文件：\n```bash\n./cudaHashcat-plus.bin -help\n\
  ```\n3. 运行 `OclHashcat` 的语法格式为 `cudaHashcat-plus64.bin [options] hash [mask]`。使用\
  \ `OclHashcat` 的重要方面之一是理解其字符集结构。\n4. 在部署攻击之前，让我们查看一些我们可以指定的可用攻击向量。`OclHashcat` 在其攻击中使用左右掩码。密码的字符被分为若干掩码，并平均划分以形成右掩码和左掩码。对于掩码的每一侧，你可以指定字典或字符集。出于我们的目的，我们将使用自定义字符集。\n\
  5. 要指定自定义字符集，我们使用 `-1` 选项。我们可以有任意数量的字符集，只要你用数字（`1-n`）指定它们即可。每个自定义字符由问号（`?`）表示，后面跟着预期的字符类型。可用选项有：\n\
  - `d` 指定使用数字 (0-9)\n- `l` 指定小写字母\n- `u` 指定大写字母\n- `s` 指定特殊字符\n- `1-n` 指定作为占位符的自定义字符集\n\
  6. 所以将所有内容整合在一起，我们将指定一个字符集，在预期的 8 位密码中包含特殊字符 (`s`)、大写字母 (`u`)、小写字母 (`l`) 和数字 (`d`)。我们将指定一个名为\
  \ `attackfile` 的哈希列表。\n```bash\n./cudaHashcat-plus64.bin attackfile -1 ?l?u?d?s\
  \ ?1?1?1?1 ?1?1?1?1\n```\n7. 我们可以将上述命令分解如下：\n- `./cudaHashcat-plus64.bin` 调用 `cudaHashcat`\n\
  - `attackfile` 是我们的 `attackfile`\n- `-1 ?l?u?d?s` 指定了我们的字符集\n- `?1?1?1?1` 是我们的左掩码\n\
  - `?1?1?1?1` 是我们的右掩码\n这就是全部！\n\n![](img/00204.jpeg)\n\n## 密码攻击 使用 Stream\n在本教程中，我们将使用\
  \ `Stream` 来破解密码哈希。`Stream` 是一个并行计算平台，通过利用 GPU 的力量来提高计算性能。随着时间的推移，GPU 处理能力大幅提升，这使得我们能够将其用于计算目的。为了演示之目的，我们将使用\
  \ `OclHashcat-plus` 来破解密码。\n\n### 准备工作\n完成本教程需要一张支持 `Stream` 的显卡。两者都包含 Kali。\n\n\
  ## 如何操作...\n使用 `OclHashcat-plus` 开始操作。\n1. 打开终端窗口并切换到包含 `OclHashcat` 的目录：\n```bash\n\
  cd /usr/share/oclhashcat-plus\n```\n2. 执行以下命令以启动 `cudaHashcat-lite-help` 文件：\n```bash\n\
  ./cudaHashcat-plus.bin -help\n```\n3. 运行 `OclHashcat` 的语法格式为 `cudaHashcat-plus64.bin\
  \ [options] hash [mask]`。使用 `OclHashcat` 的重要方面之一是理解其字符集结构。\n4. 在部署攻击之前，让我们查看一些我们可以指定的可用攻击向量。`OclHashcat`\
  \ 在其攻击中使用左右掩码。密码的字符被分为若干掩码，并平均划分以形成右掩码和左掩码。对于掩码的每一侧，你可以指定字典或字符集。出于我们的目的，我们将使用自定义字符集。\n\
  5. 要指定自定义字符集，我们使用 `-1` 选项。我们可以有任意数量的字符集，只要你用数字（`1-n`）指定它们即可。每个自定义字符由问号（`?`）表示，后面跟着预期的字符类型。可用选项有：\n\
  - `d` 指定使用数字 (0-9)\n- `l` 指定小写字母\n- `u` 指定大写字母\n- `s` 指定特殊字符\n- `1-n` 指定作为占位符的自定义字符集\n\
  6. 所以将所有内容整合在一起，我们将指定一个字符集，在预期的 8 位密码中包含特殊字符 (`s`)、大写字母 (`u`)、小写字母 (`l`) 和数字 (`d`)。我们将指定一个名为\
  \ `attackfile` 的哈希列表。\n```bash\n./cudaHashcat-plus64.bin attackfile -1 ?l?u?d?s\
  \ ?1?1?1?1 ?1?1?1?1\n```\n7. 我们可以将上述命令分解如下：\n- `./cudaHashcat-plus64.bin` 调用 `cudaHashcat`\n\
  - `attackfile` 是我们的 `attackfile`\n- `-1 ?l?u?d?s` 指定了我们的字符集\n- `?1?1?1?1` 是我们的左掩码\n\
  - `?1?1?1?1` 是我们的右掩码\n这就是全部！\n\n\n\n\n\n- `attackfile` 是我们的攻击文件\n- `-1 ?l?u?d?`\
  \ 指定自定义字符集一，选项包括小写、大写、数字和特殊字符\n- `?1?1?1?1` 是我们使用字符集一的左掩码\n- `?1?1?1?1` 是我们使用字符集一的右掩码\n\
  \n就是这些！\n\n---\n\n## 物理访问攻击\n\n在本教程中，我们将利用 `SUCrack` 来执行物理访问密码攻击。`SUCrack` 是一个多线程工具，允许通过\
  \ `su` 对本地用户账户进行暴力破解。Linux 中的 `su` 命令允许你以替替用户的身份运行命令。这种攻击虽然在你无法通过其他手段在 Linux/Unix\
  \ 系统上提升权限时非常有用，但它会很快填满日志文件，因此请务必在完成后清理日志文件。\n\n`SUCrack` 有几个我们可以使用的的命令选项：\n\n- `--help`\
  \ 允许你查看 `SUCrack` 的帮助文件。\n- `-l` 允许你更改我们正尝试绕过的登录用户。\n- `-s` 允许你设置显示统计信息之间的时间间隔。默认设置为每\
  \ 3 秒一次。\n\n![](img/00208.jpeg)\n\n## 密码攻击\n\n- `-a` 允许你设置是否使用 ANSI 转义码。\n- `-w`\
  \ 允许你设置 `SUCrack` 可以利用的线程线程数。由于 `SUCrack` 是多线程的，你可以运行任意数量的工作线程。我们建议只使用一个线程，因为每次失败的登录尝试通常会在尝试下一次密码之前导致\
  \ 3 秒的延迟。\n\n## 如何操作...\n\n1. 为了使用 `SUCrack``，你必须在打开它时指定一个字典文件。否则，你将收到一条奇怪的消息。打开终端窗口并执行\
  \ `sucrack` 命令。出于我们的目的，我们将使用一个由 `Crunch` 生成的之前创建自定义字典文件。不过，你可以指定任何你喜欢的字典文件。\n```\n\
  sucrack /usr/share/wordlists/rockyou.txt\n```\n\n2. 如果你想设置两个工作线程，希望每 6 秒显示一次统计信息，并想设置使用\
  \ ANSI 转义码，可以使用以下命令：\n```\nsucrack -w 2 -s 6 -a /usr/share/wordlists/rockyou.txt\n\
  ```\n\n就是这些！\n\n## 工作原理...\n\n在本教程中，我们使用 `SUCrack` 对系统的 root 用户执行物理访问密码攻击。该攻击通过使用指定的字典文件对管理员（默认选项）或指定用户进行字典攻击来实现。我们运行\
  \ `sucrack` 命令，它为我们提供了攻击手段。\n\n---\n\n## 无线攻击\n\n在本章中，我们将涵盖：\n\n- 无线网络 WEP 破解\n\
  - 无线网络 WPA/WPA2 破解\n- 自动化无线网络破解\n- 使用伪 AP 访问客户端\n- URL 流量操控\n- 端口重定向\n- 嗅探网络流量\n\
  \n## 引言\n\n如今，无线网络无处不在。随着用户变得前所未有的活跃，由于必须插上网线获取 Internet 而保持不动是不现实的。这种便利是需要代价的；无线连接没有以太网连接安全。在本章中，我们将探索操纵包括手机和无线网络的无线流量的各种方法。\n\
  \n![](img/00005.jpeg)\n![](img/00209.jpeg)\n\n## 无线网络 WEP 破解\n\n无线等效性，或通常称为 `WEP`，自\
  \ 1999 年以来一直存在，是一种用于保护无线网络的旧安全标准。2003 年，WEP 被 WPA 取代，后被 WPA2 取代。由于有了更安全的协议，WEP 加密很少被使用。事实上，强烈建议你永远不要使用\
  \ WEP 加密保护你的网络！有许多已知的利用 WEP 加密的方法，我们将在本教程中探索其中一种方法。在本教程中，我们将使用 AirCrack 套件来破解 WEP\
  \ 密钥。Aircrack 套件（通常称为 `Aircrack-ng`）是一个 WEP 和 WPA 密钥破解程序，它可以捕获网络数据包、对其进行分析，并使用这些数据破解\
  \ WEP 密钥。\n\n### 准备工作\n\n为了完成本教程的任务，需要具有 Kali 终端窗口的经验。还需要一个配置了数据包注入的支持的无线网卡。对于无线网卡，数据包注入涉及发送一个数据包，或将其注入到双方之间已建立的连接中。请确保你的无线网卡允许数据包注入。\n\
  \n## 如何操作...\n\n让我们开始使用 AirCrack 破解受 WEP 保护的网络的过程。\n\n1. 打开终端窗口并列出无线接口列表：\n```\n\
  airmon-ng\n```\n2. 在 `interface` 列下，选择你的其中一个接口。在这种情况下，我们将使用 `wlan0`。如果你有不同的接口（如\
  \ `mon0`），请在每个提到 `wlan0` 的地方替换为它。\n3. 接下来，我们需要停止 `wlan0` 接口并将其关闭，以便我们可以在下一步中更改 MAC\
  \ 地址。\n```\nairmon-ng stop\nifconfig wlan0 down\n```\n![](img/00210.jpeg)\n\n4.\
  \ 接下来，我们需要更改接口的 MAC 地址。由于你机器的 MAC 地址在任何网络上识别你的身份，更改 MAC 地址可以隐藏你的真实身份。在这种情况下，我们将使用\
  \ `00:11:22:33:44:55`。\n```\nmacchanger 00:11:22:33:44:55 wlan0\n```\n5. 现在，我们需要重新启动。\n\
  ```\nairmon-ng start\n```\n6. 接下来，我们将使用 `airodump` 来定位可用无线网络。\n```\nairodump-ng\
  \ wlan0\n```\n7. 可用网络将出现。一旦找到你想攻击的网络，按下 `Ctrl+C` 停止搜索。高亮 `BSSID` 列中的 MAC 地址，右键点击并复制。同时，注意网络传输信号的通道。你将在\
  \ `Channel` 列中找到此信息。在这种情况下，通道是 `10`。\n8. 现在我们运行 `airodump` 将选定的 BSSID 信息保存。我们将利用以下选项：\n\
  - `-c` 允许我们选择通道。在这种情况下，我们使用 `10`。\n- `-w` 允许我们选择文件名。在这种情况下，我们选择了 `wirelessattack`。\n\
  - `-bssid` 允许我们选择 BSSID。在这种情况下，我们将从剪贴板粘贴 `09:AC:90:AB:78`。\n```\nairodump-ng -c\
  \ 10 -w wirelessattack --bssid 09:AC:90:AB:78 wlan0\n```\n9. 一个新的终端窗口将打开，显示之前命令的输出。保持此窗口打开。\n\
  10. 打开另一个终端窗口；为了尝试关联，我们将运行 `aireplay`，其语法为：`aireplay-ng -1 0 -a [BSSID] -h [我们的选择\
  \ MAC 地址] -e [ESSID] [Interface]`。\n```\naireplay-ng -1 0 -a 09:AC:90:AB:78 -h 00:11:22:33:44:55\
  \ -e backtrack wlan0\n```\n11. 接下来，向路由器发送一些流量以便我们拥有一些数据。我们以以下格式使用 `aireplay`：`aireplay-ng\
  \ -3 -b [BSSID] - h [我们的选择 MAC 地址] [Interface]`。\n```\naireplay-ng -3 -b 09:AC:90:AB:78\
  \ -h 00:11:22:33:44:55 wlan0\n```\n12. 你的屏幕将开始充满流量。让这个过程运行一两分钟，直到我们有足够的信息破解。\n\n\
  ![](img/0211.jpeg)\n\n13. 最后，我们运行 AirCrack 来破解 WEP 密钥。\n```\naircrack-ng -b 09:AC:90:AB:78\
  \ wirelessattack.cap\n```\n\n\n\n\n通过基于 WEP 的无线连接，并对数据进行数学分析来破解 WEP 加密密钥。我们开始该方案的方法是启动\
  \ `AirCrack` 并选择我们所需的接口。接下来，我们更改了 MAC 地址，以便在网络上更改身份，然后使用 `airodump` 搜索可攻击的可用无线网络。一旦我们找到了想要攻击的网络，我们就会使用\
  \ `aireplay` 将我们的机器与正在攻击的无线设备的 MAC 地址关联。最后，我们收集了一些流量，然后对生成的 `.cap` 文件进行暴力破解，以获取无线网络密码。\n\
  \n## 无线网络 WPA/WPA2 破解\n\nWiFi Protected Access（通常称为 `WPA`）自 2003 年以来一直存在，旨在保护无线网络并取代过时的旧标准\
  \ `WEP` 加密。在 2003 年，`WEP` 被 `WPA` 取代，随后被 `WPA2` 取代。由于有了更安全的协议，`WEP` 加密已很少使用。\n\n\
  在本方案中，我们将使用 `AirCrack` 套件来破解 WPA 密钥。`AirCrack` 套件（通常称为 `AirCrack NG`）是一个 `WEP` 和\
  \ `WPA` 密钥破解程序，它通过捕获网络包、分析它们，并使用这些数据破解 `WPA` 密钥。\n\n### 准备工作\n\n为了执行本方案的任务，需要具有\
  \ `Kali Linux` 终端窗口的经验。还需要一个配置了数据包注入的支持无线网卡。对于无线网卡，数据包注入涉及发送数据包或将其注入到双方已建立的连接中。\n\
  \n222\n\n![](img/00212.jpeg)\n\n# 第 9 章\n\n## 如何操作...\n\n让我们开始使用 `AirCrack` 破解由\
  \ WPA 安全的网络会话。\n\n1. 打开终端窗口并列出无线网络接口列表。\n\n```\nairmon-ng\n```\n\n2. 在接口列下，选择一个接口。在这种情况下，我们将使用\
  \ `wlan0`。如果你有不同的接口（例如 `mon0`），请在所有提到 `wlan0` 的地方将其替换。\n\n3. 接下来，我们需要停止并关闭 `wlan0`\
  \ 接口。\n\n```\nairmon-ng stop wlan0\nifconfig wlan0 down\n```\n4. 接下来，我们需要更改接口的 MAC\
  \ 地址。在这种情况下，我们将使用 `00:11:22:33:44:55`。\n\n```\nmacchanger --mac 00:11:22:33:44:55\
  \ wlan0\n```\n\n5. 现在，我们需要重启 `airmon-ng`。\n\n```\nairmon-ng start wlan0\n```\n\n\
  6. 接下来，我们将使用 `airodump` 定位附近的可用无线网络。\n\n```\nairodump-ng wlan0\n```\n\n7. 可用网络列表开始出现。一旦你找到了想要攻击的网络，按下\
  \ `Ctrl+C` 停止搜索。高亮 `BSSID` 列中的 MAC 地址，右键点击并选择复制。同时注意网络传输信号的信道。你可以在 `Channel` 列中找到此信息。在这种情况下，信道为\
  \ `10`。\n\n8. 现在我们运行 `airodump`并将所选 `BSSID` 的信息复制到文件中。我们将利用以下选项：\n\n- `-c` 允许我们选择信道。在这种情况下，我们使用\
  \ `10`。\n- `-w` 允许我们选择文件名称。在这种情况下，我们选择了 `wirelessattack`。\n- `-bssid` 允许我们选择 `BSSID`。在这种情况下，我们将从剪贴板粘贴\
  \ `09:AC:90:AB:78`。\n\n```\nairodump-ng -c 10 -w wirelessattack --bssid 09:AC:90:AB:78\
  \ wlan0\n```\n\n223\n\n![](img/00213.jpeg)\n\n## 无线攻击\n\n9. 将打开一个新的终端窗口，显示上一个命令的输出。保持此窗口打开。\n\
  \n10. 打开另一个终端窗口；为了尝试关联，我们将运行 `aireplay`，其语法为：`aireplay-ng -dauth 1 -a [BSSID] -c\
  \ [我们选择的 MAC 地址] [Interface]`。此过程可能需要几分钟。\n\n```\naireplay-ng --deauth 1 -a 09:AC:90:AB:78\
  \ -c 00:11:22:33:44:55 wlan0\n```\n\n11. 最后，我们运行 `AirCrack` 来破解 WPA 密钥。`-w` 选项允许我们指定字典的位置。我们将使用之前命名的\
  \ `.cap` 文件。在这种情况下，文件名为 `wirelessattack.cap`。\n\n```\nAircrack-ng -w ./wordlist.lst\
  \ wirelessattack.cap\n```\n\n就此了！\n\n## 工作原理...\n\n在本方案中，我们使用 `AirCrack` 套件破解了无线网络的\
  \ WPA 密钥。`AirCrack` 是破解 WPA 最流行的程序之一。`AirCrack` 的工作原理是从基于 WPA 的无线连接中收集数据包，然后对收集的数据进行密码暴力破解，直到\n\
  \n\n\n\n接下来，我们从 `Gerix` 提供的攻击目标列表中选择了我们的目标。在我们开始嗅探网络流量后，使用了 `Chop Chop` 生成了 `CAP`\
  \ 文件。最后，我们通过收集 20,000 个数据包并使用 `Aircrack` 对 `CAP` 文件进行暴力破解，完成了此实验。\n\n通过 `Gerix`，我们能够自动化破解\
  \ WEP 密钥的步骤，而无需在终端窗口中手动输入命令。这是快速高效地攻入 WEP 安全网络的极佳方法。\n\n## 使用虚假 AP 访问客户端\n\n在本实验中，我们将使用\
  \ `Gerix` 创建并设置一个虚造的接入点（AP）。设置虚造接入点使我们能够收集连接它的每台计算机的信息。在当今时代，人们往往为了便利而牺牲安全性。连接到开放的无线接入点发送快速电子邮件或快速登录社交网络是非常方便的。`Gerix`\
  \ 是 `AirCrack` 的自动化 GUI 界面。\n\n### 准备工作\n\n完成本实验需要一个配置了数据包注入（packet injection）的支持无线网卡。对于无线网卡，数据包注入涉及发送数据包，或将其注入到双方之间已建立的连接中。\n\
  \n### 如何操作……\n\n让我们开始使用 `Gerix` 创建虚假 AP 的过程。\n\n1. 导航到 `Gerix` 所在的目录：\n```bash\n\
  cd /usr/share/gerix-wifi-cracker\n```\n![](img/00217.jpeg)\n\n2. 要开始使用 `Gerix`，发布以下命令：\n\
  ```bash\npython gerix.py\n```\n\n3. 点击 `Configuration（配置）标签页。\n4. 在 `Configuration`\
  \ 标签页中，选择你的无线接口。\n5. 点击 `Enable/Disable Monitor Mode（启用/禁用监听模式）按钮。\n6. 一旦成功启用监听模式，在\
  \ `Select Target Network（选择目标网络）` 下按下 `Rescan Networks（重新扫描网络）按钮。\n7. 目标网络列表开始填充。选择一个无线网络作为目标。在这种情况下，我们选择了一个\
  \ WEP 加密的网络。\n\n8. 点击 `Fake AP（虚假 AP）标签页。\n\n![](img/00218.jpeg)\n\n9. 将 `Access\
  \ Point ESSID` 从 `honeypot` 改为不那么可疑的名字。在这种情况下，我们将使用 `personalnetwork`。\n10. 我们将使用其他选项的默认值。要启动虚假接入点，点击\
  \ `Start Fake Access Point（启动虚假接入点）按钮`。\n\n就这样！\n\n![](img/00219.jpeg)\n\n### 工作原理……\n\
  \n在本实验中，我们使用 `Gerix` 创建了一个虚假 AP。创建虚假 AP 是从毫无防备的用户那里收集信息的极佳方法。虚假接入点是一个强大工具的原因是，对于受害者来说，它们看起来是合接入点，从而获得了用户的信任。通过\
  \ `Gerix`，我们能够在几次点击内自动化完成设置虚假接入点的过程。\n\n## URL 流量操纵\n\n在本实验中，我们将执行 URL 流量操纵攻击。URL\
  \ 流量操纵与中间人攻击（MITM）非常相似，因为我们将发往互联网的流量路由通过我们的机器。我们将通过 `ARP poisoning（ARP 毒）` 执行这种攻击。`ARP\
  \ poisoning` 是一种向本地网络上的受害者发送伪造的 ARP 消息的技术。我们将使用 `arpspoof` 执行本实验。\n\n### 如何操作……\n\
  \n让我们开始 URL 流量操纵的过程。\n\n1. 打开终端窗口并执行以下命令来配置 IP 表，允许我们的机器路由流量：\n```bash\nsudo echo\
  \ 1 >> /proc/sys/net/ipv4/ip_forward\n```\n\n2. 接下来，我们启动 `arpspoof` 来毒化从受害者机器到默认网关的流量。在这个示例中，我们将使用本地网络上地址为\
  \ `192.168.10.115` 的 Windows 7 机器。`Arpspoof` 有几项我们将选择的选项，包括：\n- `-i` 允许我们选择目标接口。在这种情况下，我们将选择\
  \ `wlan0`。\n- `-t` 允许我们指定目标。\n\n完成此命令的语法为 `arpspoof -i [interface] -t [target IP\
  \ address] [destination IP address]`。\n```bash\nsudo arpspoof -i wlan0 -t 192.168.10.115\
  \ 192.168.10.1\n```\n\n3. 接下来，我们将执行另一个 `arpspoof` 命令，该命令将获取上一个命令中目标（即默认网关）的流量并将其路由回我们的\
  \ Kali 机器。在此示例中我们的 IP 是 `192.168.10.110`。\n```bash\nsudo arpspoof -i wlan0 -t 192.168.10.1\
  \ 192.168.10.110\n```\n\n就这样！\n\n![](img/00220.jpeg)\n\n### 工作原理……\n\n在本实验中，我们使用配合\
  \ `arpspoof` 的 `ARP poisoning` 来操纵网络上的流量，最终将其路由回我们的 Kali 机器。一旦流量被重定向，你就可以针对受害者运行其他攻击，包括记录他们的……。\n\
  \n## 端口重定向\n\n在本实验中，我们将使用 Kali 执行端口重定向，也称为端口转发（port forwarding）。端口重定向涉及接受数据包（例如端口\
  \ 80）并将其重定向到不同的端口（例如 8080）。\n\n### 如何操作……\n\n让我们开始端口重定向的过程。\n\n1. 打开终端窗口并执行以下命令来配置\
  \ IP 表，允许我们的机器路由流量：\n```bash\nsudo echo 1 >> /proc/sys/net/ipv4/ip_forward\n```\n\
  \n2. 接下来，我们启动 `arpspoof` 来毒化从受害者机器到默认网关的流量。在这个示例中，地址是 `192.168.10.115`。`Arpspoof`\
  \ 有几项我们将选择的选项，包括：\n- `-i` 允许我们选择目标接口。在这种情况下，我们将选择 `wlan0`。\n- `-t` 允许我们指定目标。\n\n\
  完成此命令的语法为 `arpspoof -i [interface] -t [target IP address] [destination IP address]`。\n\
  ```bash\nsudo arpspoof -i wlan0 -t 192.168.10.115 192.168.10.1\n```\n\n3. 接下来，我们将执行另一个\
  \ `arpspoof` 命令，该命令将获取上一个命令中目标（即默认网关）的流量并将其路由回我们的 Kali 机器。在此示例中我们的 IP 是 `192.168.10.110`。\n\
  ```bash\nsudo arpspoof -i wlan0 -t 192.168.10.1 192.168.10.110\n```\n```bash\niptables\
  \ -t nat -A PREROUTING -p tcp --destination-port 80 -j REDIRECT --to-port 8080\n\
  ```\n\n### 工作原理……\n\n在本实验中，我们使用配合 `arpspoof` 的 `ARP poisoning` 以及 `IPTables` 路由来操纵网络上的端口\
  \ 80 流量，将其重定向到 8080。\n\n## 网络流量嗅探\n\n在本实验中，我们将研究网络流量嗅探的过程。网络流量嗅探涉及拦截网络数据包、分析并在必要时解码流量，显示数据包包含的信息。嗅探流量对于从目标收集信息特别有用，因为取决于访问的网站，你将看到访问的\
  \ URL、用户名、密码以及可以用于对它们的其他细节。\n\n在本实验中使用我们将 `Ettercap`，但你也可以使用 `Wireshark`。为了演示目的，`Ettercap`\
  \ 更容易理解和应用嗅探原理。\n\n\n\n涉及向双方之间已建立的连接发送数据包，或将其注入其中。\n\n## 如何操作...\n\n让我们通过启动 Ettercap\
  \ 开始嗅探网络流量的过程。\n\n1.  打开终端窗口并启动 Ettercap。使用 `-G` 选项启动图形用户界面：\n```bash\nettercap\
  \ -G\n```\n![](img/00222.jpeg)\n\n2.  我们通过开启“统一嗅探”（Unified sniffing）开始该过程。你可以按下\
  \ `Shift+U` 或使用菜单导航到 `Sniff|Unified sniffing`。\n\n3.  选择网络接口。在进行中间人攻击（MITM）的情况下，我们应该选择我们的无线接口。\n\
  ![](img/00223.jpeg)\n\n4.  接下来，我们开启“扫描主机”（Scan for hosts）。这可以通过按下 `Ctrl+S` 完成，也可以使用菜单导航到\
  \ `Hosts|Scan for hosts`。\n\n5.  接下，我们调出“主机列表”（Host List）。你可以按下 `H` 或使用菜单导航到 `Hosts|Host\
  \ List`。\n\n6.  接下来我们需要选择并设置目标。在我们的案例中，将通过高亮 IP 地址并点击 `Add To Target 1` 按钮将 `192.168.10.111`\
  \ 选择为我们的目标 1。\n![](img/00224.jpeg)\n\n7.  现在我们可以允许 Ettercap 开始嗅探了。你可以按下 `Ctrl+W`\
  \ 或使用菜单导航到 `Start|Start sniffing`。\n\n8.  最后，我们开始 ARP 投毒过程。从菜单导航到 `Mitm|Arp poisoning...`。\n\
  \n9.  在弹出的窗口中，勾选“嗅探远程连接”（Sniff remote connections）可选参数。\n![](img/00225.jpeg)\n\n\
  10. 根据网络流量，我们将开始看到信息。\n\n11. 一旦我们找到了正在寻找的内容（用户名和密码），我们将关闭 Ettercap。你可以通过按下 `Ctrl+E`\
  \ 或使用菜单导航到 `Start|Stop sniffing 来 来实现此。\n![](img/00226.jpeg)\n\n12. 现在我们需要关闭 ARP\
  \ 投毒并让网络恢复正常。\n\n## 工作原理...\n\n本配方包含一种中间人攻击（MITM），该攻击通过使用 ARP 数据包投毒来监听用户传输的无线通信。我们通过启动\
  \ Ettercap 并扫描主机开始该配方。然后我们开始对网络进行 ARP 投毒过程。ARP 投毒是一种允许你向局域网上的受害者发送伪造的 ARP 消息的技术。\n\
  \n我们通过启动数据包嗅探器结束配方，并演示了停止 ARP 投毒并让网络恢复正常的方法。这一步是检测过程中的关键，因为它允许你在停止对网络进行投毒后不会导致网络掉线。该过程对于收集在无线网络上传输的信息非常有用。根据流量，你将能够收集用户名、密码、银行账户详情以及目标跨网络发送的其他信息。这些信息也可以作为更大规模攻击的跳板。\n\
