  \n## 如何操作...\n\n让我们开始对 MSFCONSOLE 的探索：\n\n1. 打开一个命令提示符。\n2. 使用以下命令启动 MSFCONSOLE：\n\
  ```\n```\n3. 使用 `search` 命令搜索所有可用的 Linux 模块。在我们想要执行某项操作时，搜索我们要使用的模块总是个好主意。此做的主要原因是，在\
  \ Metasploit 的不同版本之间，模块的路径可能发生变化：\n```\nsearch linux\n```\n4. 使用 John the Ripper\
  \ Linux 密码破解模块：\n```\nuse auxiliary/analyzse/jtr_linux\n```\n\n\n第 6 章\n\n5. 使用以下命令显示模块的可用选项：\n\
  ```\nshow options\n```\n6. 现在我们已经有了可以在该模块上运行的选项列表，可以使用 `set` 命令设置单个选项。让我们设置 `JOHN_PATH`\
  \ 选项：\n```\nset JOHN_PATH /usr/share/metasploit-framework/data/john/wordlists/ password.lst\n\
  7. 现在输入 `exploit` 命令来运行我们的利用：\n```\nexploit\n```\n\n### 还有更多...\n\n一旦你通过 MSFCONSOLE\
  \ 访问了主机，你就必须使用 Meterpreter 来分发你的载荷。MSFCONSOLE 管理你的会话，但 Meterpreter 负责实际的载荷和漏洞利用交互。\n\
  \n## 精通 Metasploit CLI (MSFCLI)\n在这个配方中，我们将探索 Metasploit CLI (MSFCLI)。Metasploit\
  \ 需要使用接口来执行其任务。MSFCLI 就是这样一种接口。它是学习 Metasploit 或测试/编写新漏洞利用的良好接口。在使用脚本和对任务应用基础自动化处理的情况下，它也表现良好。\n\
  \n使用 MSFCLI 的一个主要问题是你一次只能打开一个 shell。你还会注意到，当我们探索某些命令时，它的运行速度比 MSFCONSOLE 慢一点，而且稍微复杂一点。最后，你必须知道你想要运行的精确漏洞利用程序才能使用\
  \ MSFCLI。这对于不熟悉 Metasploit 漏洞利用列表的新渗透测试人员来说，可能有些困难。\n\n151![](img/00145.jpeg)\n\n\
  ### 漏洞利用\n\nMSFCLI 的某些命令如下：\n\n- `msfcli -h`: 显示 MSFCLI 帮助文件\n- `msfcli [EXPLOIT\
  \ 路径] [options = value]`: 这是启动漏洞利用的语法\n\n### 准备工作\n\n完成此配方需要连接到互联网或内部网络。\n\n## 如何操作...\n\
  \n让我们开始对 Metasploit CLI 的探索：\n1. 使用以下命令启动 Metasploit CLI (MSFCLI)。请耐心等待，取决于你的系统速度，这可能需要一些时间。另外注意，当\
  \ MSFCLI 加载时，将显示可用漏洞利用程序的列表。\n```\nmsfcli\n```\n2. 显示 MSFCLI 帮助文件：\n```\nmsfcli\
