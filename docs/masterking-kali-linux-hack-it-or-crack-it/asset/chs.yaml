  \n## 引言\n攻击中最重要的阶段之一是信息收集。为了能够发起攻击，我们需要收集有关目标的基本信息。因此，获取的信息越多，攻击成功的概率就越高。\n\n我还想强调此阶段的一个重要方面，即文档记录。\n\
  \n在编写本书时，可用的最新 Kali 版本包含了一些工具，可以帮助我们整理和组织来自目标的数据，使能够获得更好的侦察。诸如 `Maltego CaseFile`\
  \ 和 `KeepNote` 等工具就是例子。![](img/00005.jpeg)![](img/00005.jpeg)\n\n![](img/00065.jpeg)\n\
  \n### 信息收集\n\n\n在本食谱中，我们将执行一些服务枚举技巧。枚举是一个允许我们从网络收集信息的过程。我们将检查 `DNS 枚举` 和 `SNMP 枚举`\
  \ 技术。DNS 枚举是定位一个组织的所有 DNS 服务器和 DNS 目的的过程。DNS 枚举将允许我们收集有关该组织的关键信息，如用户名、计算机名称、IP 地址等。为了完成此任务，我们将使用\
  \ `DNSenum`。对于 SNMP 枚举，我们将使用一个名为 `SnmpEnum` 的工具。`SnmpEnum` 是一个强大的 SNMP 枚举工具，允许用户分析网络上的\
  \ SNMP 流量。\n\n### 如何操作……\n\n让我们从检查 DNS 枚举开始：\n\n1. 我们将利用 `DNSenum` 进行 DNS 枚举。要开始\
