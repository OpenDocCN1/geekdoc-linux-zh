  \ Nessus 项目的一个分支。与 Nessus 不同，OpenVAS 完全免费提供其馈送（feeds）。由于 OpenVAS 是 Kali Linux 的标准配置之一，我们将从配置开始。\n\
  \n### 准备工作\n\n完成此配谱需要连接互联网。\n\n\n让我们通过终端窗口导航到其目录，开始安装、配置和启动 OpenVAS 的过程：\n\n1. OpenVAS\
  \ 默认已安装，只需对其进行配置即可使用。\n2. 从终端窗口中，将目录更改到 OpenVAS 目录：\n```bash\ncd /usr/share/openvas/\n\
  ```\n\n![](img/00109.jpeg)\n### 漏洞评估\n\n3. 执行以下命令：\n```bash\nopenvas-mkcert\n```\n\
  \n我们在这一步中正在执行的操作是为 OpenVAS 程序创建 SSL 证书：\n\n1. 保持 CA 证书的默认有效期不变。\n3. 输入国家。\n4. 输入州或省（如果需要）。\n\
  5. 将组织名称保持为默认。\n6. 你将看到证书确认屏幕，然后按 `Enter` 退出。\n\n4. 执行以下命令：\n```bash\nopenvas-nvt-sync\n\
  ```\n\n\n![](img/00110.jpeg)\n\n5. 执行以下命令：\n```bash\nopenvas-mkcert-client -n om\
  \ -i openvasmd -rebuild\n```\n这将分别生成客户端证书并重建数据库。\n\n6. 执行以下命令：\nopenvassd\n```\n\
  这将启动 OpenVAS 扫描器并加载所有插件（约 26,406 个），因此这可能需要一些时间。\n\n7. 执行以下命令：\n```bash\nopenvasmd\
  \ --rebuild\nopenvasmd --backup\n```\n这些命令将重建并创建数据库的备份。\n8. 执行以下命令创建你的管理员用户（我们使用\
