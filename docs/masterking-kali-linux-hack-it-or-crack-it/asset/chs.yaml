  2\n\n自定义 Kali Linux\n\n在本章中，我们将涵盖：\n\n- 准备内核源\n- 安装 ATI 视频驱动\n- 安装 nVidia 视频驱动\n\
  - 应用更新并配置工具\n- 设置 ProxyChains\n- 目录加密\n\n## 简介\n\n本章将介绍 Kali 的自定义，以便您充分利用它。我们将涵盖\
  \ ATI 和 nVidia 技术的安装以及后续章节所需的额外工具。基于 GPU 的 ATI  显卡允许我们使用它们的图形处理器 (GPU) 进行计算，而不是\
  \ CPU。我们将以设置 ProxyChains 和数字信息加密结束本章。\n### 准备内核源\n\n有时我们需要编译需要头文件的代码。内核头是 Linux\
  \ 内核源代码。在本配方中，我们将解释为后续使用准备内核源所需的步骤。\n\n![](img/00032.jpeg)\n\n33\n\n 准备工作\n\n\n\
  ## 如何操作...\n\n让我们开始准备内核源的过程：\n\n1. 我们首先通过执行以下命令更新我们的发行版：\n\n```bash\napt-get update\n\
  ```\n2. 接下来，我们再次使用 `apt-get` 准备内核源。执行以下命令：\n\n```bash\napt-get install linux-headers\
  \ - `uname -r`\n```\n\n32\n\n![](img/00033.jpeg)\n\n\n3. 拷贝以下目录及其所有内容：\n\n```bash\n\
  cd /usr/src/linux\ncp -rf include/generated/* include/linux/\n```\n\n4. 我们现在可以编译需要内核头文件的代码了。\n\
  \n\n\n## 安装 Broadcom 驱动\n\n在接下来的配方的，我们将执行 Broadcom 官方 Linux 混合无线驱动的安装。使用 Broadcom\
  \ 无线 USB 适配器可以让我们在让 Kali 运行无线 USB 访问点方面获得最大的成功。对于书中的其余配方，我们将假设已经安装了 Broadcom 无线驱动。\n\
  \n### 准备工作\n完成此配方需要连接互联网。\n\n## 如何操作...\n\n1. 打开终端窗口，并从 `http://www.broadcom.com/support/802.11/linux_sta.php`\
  \ 下载适当的 Broadcom 驱动：\n```bash\ncd /tmp/\nwget http://www.broadcom.com/docs/linux_sta/hybrid-portsrc_x86_64-v5_100_82_112.tar.gz\n\
  ```\n![](img/00034.jpeg)\n\n自定义 Kali Linux\n2. 使用以下脚本提取下载的驱动：\nmkdir broadcom\n\
  tar xvfz hybrid-portsrc_x86_64-v5_100_82_112.tar.gz -C /tmp/ broadcom\n```\n3. 修改\
  \ `wl_cfg80211.c` 文件，因为 `5.100.82.112` 版本中有一个 bug，导致无法在内核版本 `2.6.39` 下编译代码：\n```bash\n\
  vim /tmp/broadcom/src/wl/sys/wl_cfg80211.c\n```\n查看第 1814 行的以下代码：\n```c\n#if LINUX_VERSION_CODE\
  \ > KERNEL_VERSION(2, 6, 39)\n将其替换为：\n```c\n#if LINUX_VERSION_CODE >= KERNEL_VERSION(2,\
  \ 6, 39)\n```\n保存更改。\n\n4. 编译代码：\n```bash\nmake clean\nmake\n```\n5. 更新依赖项：\n```bash\n\
  depmod -a\n```\n6. 通过以下命令查找已加载的模块：\n```bash\nlsmod | grep b43\\|ssb\\|bcma\n```\n\
  7. 执行以下命令删除找到的模块：\nrmmod <module>b43\n```\n其中 `<module>` 可能是 `b43`、`ssb` 或 `bcma`。\n\
  \n8. 将模块列黑以防止它们在系统启动时加载：\n```bash\necho \"blacklist <module>\" >> /etc/modprobe.d/blacklist.conf\n\
  ```\n其中 `<module>` 可能是 `b43`、`ssb`、`bcma` 或 `wl`。\n\n```bash\nmodprobe wl\n```\n\
  ![](img/00035.jpeg)\n\n## 安装并配置 ATI 显卡驱动\n\n在这个配方中，我们将详细介绍 ATI 显卡驱动的安装和配置，随后是 AMD\
  \ 加速并行处理 (APP) SDK、`OpenCL` 和 `CAL++`。利用 ATI Stream 技术，我们可以运行计算密集型任务（通常在 CPU 上运行），这些任务可以运行得更快、更高效。有关\
  \ ATI Stream 技术的更多详细信息，请访问 `www.amd.com/stream`。\n\n### 准备工作\n\n## 如何操作...\n让我们开始安装和配置\
