  189\n\n![](img/00181.jpeg)\n\n### 提升权限\n\n11. 一旦我们找到了正在寻找的内容（用户名和密码），我们将关闭 `Ettercap`。你可以通过按下\
  \ `Ctrl+E` 或使用菜单并到 `Start|Stop sniffing` 来实现此操作：\n\n12. 现在我们需要关闭 `ARP Poisoning`\
  \ 并让网络恢复正常：\n\n## 工作原理...\n本教程包含了一种中间人（MITM）攻击，该攻击的原理是通过使用 ARP 数据包投毒来窃听用户传输的无线通信。\n\
  \n你可以通过访问以下网址了解更多关于中间人攻击的信息：\nhttp://en.wikipedia.org/wiki/Man-in-the-middle_attack#Example_of_an_attack.\n\
  \n190\n8\n\n## 密码攻击\n\n在本章中，我们将涵盖以下内容：\n- 在线密码攻击\n- 破解 HTTP 密码\n- 获取路由器访问\n- 密码分析\n\
  - 使用 John the Ripper 破解 Windows 密码\n- 使用字典攻击\n- 使用彩虹表\n- 使用 nVidia 计算统一设备架构 (CUDA)\n\
  - 使用 ATI Stream\n- 物理访问攻击\n\n## 简介\n在本章中，我们将探索各种破解密码的方法以获取用户账户的访问权限。破解密码是渗透测试人员都会使用的任务。本质上，任何系统中最不安全的就是用户提交的密码。无论密码策略如何，人类不可避免地讨厌输入强密码或按要求的频率重置密码。这使得他们成为黑客的攻击目标。![](img/00005.jpeg)![](img/00005.jpeg)\n\
  \n![](img/00182.jpeg)\n\n## 密码攻击\n\n## 在线密码攻击\n在本教程中，我们将使用 `THC-Hydra` 密码破解器 (`Hydra`)。某些时候，我们有时间物理攻击基于\
  \ Windows 的计算机并直接获取`安全帐户管理器(SAM)`。然而，也有时候我们无法做到这一点，这时在线密码攻击就证明是最有益的。\n\n`Hydra`\
  \ 支持许多协议，包括但不限于 `FTP`、`HTTP`、`HTTPS`、`MySQL`、`MSSQL`、`Oracle`、`Cisco`、`IMAP`、`VNC`\
  \ 等！但要小心，这种攻击可能会产生噪音，从而增加你被发现的概率。\n\n### 准备工作\n完成本教程需要连接到互联网或内域网，以及一台我们可以作为受害者的计算机。\n\
  \n## 如何操作...\n让我们开始破解在线密码的过程。\n\n1. 从开始菜单，选择 `Applications|Kali Linux|Password Attacks|Online\
  \ Attacks|hydra-gtk`。\n\n192\n\n![](img/00183.jpeg)\n\n2. 现在我们已经启动了 `Hydra`，我们需要设置我们的字典列表。点击\
  \ `Password` 标签页。我们将使用用户名列表和密码列表。输入你的用户名和密码列表的位置。还要选择 `Loop around users`（循环用户）和\
  \ `Try empty password`（尝试空密码）。\n\n- 用户名列表：`/usr/share/wfuzz/wordlist/fuzzdb/wordlists-user-passwd/names/nameslist.txt`\n\
  - 密码列表：`/usr/share/wfuzz/wordlist/fuzzdb/wordlists-user-passwd/passwds/john.txt`\n\
  \n你可以使用的快捷方法是在字典列表框内单击以调出文件系统窗口。\n\n193\n\n![](img/00184.jpeg)\n\n3. 接下来，我们将调整攻击。在\
  \ `Performance Options` 下，我们将任务数从 `16` 设置为 `2`。这样做的原因是我们不希望运行这么多进程以导致服务器崩溃。虽然是可选的，但我们也想设置\
  \ `Exit after first found pair`（找到第一对匹配后退出）选项。\n\n4. 最后，我们将针对目标。点击 `Target` 标签页并设置我们想要攻击的目标和协议。在案例中，我们正在使用\
  \ Metasploitable 机器的 `MySQL` 端口 (`192.168.10.111`)。\n\n194\n\n![](img/00185.jpeg)\n\
  \n5. 最后，通过点击 `Start` 标签页并按下 `Start` 按钮来执行利用。\n\n195\n\n![](img/00186.jpeg)\n\n##\
  \ 工作原理...\n在本教程中，我们使用 `Hydra` 对目标执行了字典攻击。`Hydra` 的原理允许我们指定目标并使用字典列表。它尝试使用用户名和密码列表的各种组合来暴力破解密码。\n\
  \n### 破解 HTTP 密码\n在本教程中，我们将使用 `THC-Hydra` 密码破解器 (`Hydra`) 破解密码。如今，我们处于网络社会。随着大多数家庭都有网络化计算机，路由器成为了通信的基石。\n\
  \n### 准备工作\n完成本教程需要连接到互联网或内域网。还需要一个可路由器。\n\n## 如何操作...\n让我们开始破解密码的过程。\n\n1. 从开始菜单导航到\
  \ `Applications|Kali Linux|Password Attacks|Online Attacks|hydra-gtk`。当 `Hydra`\
  \ 启动时，它会加载其帮助文件。\n\n2. 现在我们带有选定的选项运行 `Hydra`：\n```\nmedusa -M http -h 192.168.10.1\
  \ -u admin -P /usr/share/wfuzz/wordlist/fuzzdb/wordlists-user-passwd/passwds/john.txt\
  \ -e ns -n 80 -F\n```\n- `-M http` 允许我们指定模块。在案例中，我们选择了 `HTTP` 模块。\n- `-h 192.168.10.1`\
  \ 允许我们指定主机。在案例中，我们选择了 `192.168.10.1`（路由器的 IP 地址）。\n- `-u admin` 允许我们指定用户。在案例中，我们选择了\
  \ `admin`。\n- `-P [密码列表位置]` 允许我们指定密码列表的位置。\n- `-e ns` 允许我们指定额外的密码检查。`ns` 变量允许我们将用户名作为密码并使用空密码。\n\
  \n获取路由器访问\n（此部分文本未完整或合并在源文本中）\n\n密码分析\n（此部分文本未完整或合并在源文本中）\n\n使用 John the Ripper\
  \ 破解 Windows 密码\n（此部分文本未完整或合并在源文本中）\n\n\n\n\n\n![](img/00193.jpeg)\n\n# 第 8 章\n\n\
  - `-n 80` 允许我们指定端口号。在此例中，我们选择了 `80`。\n- `-F` 允许我们在成功使用用户名和密码组合后停止审核。\n3. `Medusa`\
  \ 将运行并尝试所有的用户名和密码组合，直到其中一个成功为止。\n\n## 工作原理...\n在本用例中，我们使用 `Medusa` 对目标路由器的密码进行暴力破解。能够这样操作的好处是，一旦你访问了路由器，就可以更新其设置，以便将来再次访问，甚至可以将发送到路由器的流量重定向到你选择的备用位置。\n\
