    # Automating Password Attacks with Hydra


    **Tool Authors:** Van Hauser, Roland Kessler


    **Tool Website**: https://www.thc.org/thc-hydra


    Hydra is a brute force attack program that takes a user list & password list and
    tries different combinations of them to attack server services. If we make a text
    file with the usernames and another with the passwords that we acquired above,'
  merge: -1
  pgno: 298
- img_proc: false
  md: 'we can feed them to a program like Hydra. These tools automate the task of
    using cracked accounts against services.


    Create the following two text files (Users, Passwords) enter the values we recovered
    from the password file and save them in the Desktop directory:


    +   **Users**

    - msfadmin

    - sys

    - klog

    - service

    - postgres

    - user


    **Passwords**

    - msfadmin

    - batman

    - 1234567898

    - service

