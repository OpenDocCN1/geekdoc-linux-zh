  md: "MITMf, is it can run SSLstrip+, so in many cases you can view data from encrypted\
    \ pages.\n\n# **Simple ARP attacks**\n\nLet's start with a simple MitM ARP poisining\
    \ attack against our Windows 7 VM. This attack will modify the ARP tables of the\
    \ target system and router, inserting our attacking system in the middle of the\
    \ traffic stream.\n\nOpen a command prompt on your Windows 7 VM\nType \"***arp\
    \ -a***\"\n\nWindows will respond with a list of ARP table entries, like the simulated\
    \ example below:\n\n```\nC:\\Users\\Dan>arp -a\n\nInterface: 192.168.1.93 ---\
    \ 0xb\n  Internet Address      Physical Address      Type\n  192.168.1.1     \
    \      22-56-bd-26-47-20     dynamic\n```\n\nNotice the MAC, or Physical address\
    \ listed for the router at 192.168.1.1.\n\nOn your Kali VM:\n\nType, \"***mitmf\
    \ -i eth0 --spoof --arp --gateway 192.168.1.1 --target 192.168.1.93***\"\n\n![](bbox=[0.15,\
    \ 0.65, 0.93, 0.85])\n\nNow, back on the Windows 7 system:\n\nrun the \"***arp\
    \ -a***\" command again\n\nYou should see a different result this time for the\
    \ router address:\n\n```\nC:\\Users\\Dan>arp -a\n```"
  merge: -1
