    # Conclusion


    We can learn a lot about the networks around us by simply running Kismet and analyzing
    the logs. When analyzed, the logs could show us if clients are connecting to wireless
    networks that they shouldn''t be and could also reveal rogue Wi-Fi routers that
    should not be active at all in your organization. There are a lot of features
    of Kismet that we did not cover. The XML logs can be used by other programs to
    create interactive maps or graphs. And viewing the logs with GPS data (not covered)
    can help reveal the general location of wireless access devices.


    Over the last several chapters, we covered multiple tools that can be used to
    test wireless security. We looked at routers and how they can be vulnerable if
    the firmware is not up to date and if strong passwords & passkeys are not used.'
