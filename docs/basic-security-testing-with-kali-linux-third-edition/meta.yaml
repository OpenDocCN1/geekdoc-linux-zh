  md: "![](bbox=[0.293, 0.08, 0.696, 0.392])\n\nWe can use the DNS spoofing button\
    \ to redirect the target system to a system we control. Once you click the \"\
    DNS Spoofing\" button you will be presented with an Ettercap config screen. Simply\
    \ set the Domain name you want to spoof, to the IP address that you want it to\
    \ actually point to.\n\nFor example, if we want the target to go to our separate\
    \ Kali Linux system that we have, we would just put in its IP address. As \"microsoft.com\"\
    \ is already added in the config file as an example, we just need to modify the\
    \ IP address. So, if our stand-alone Kali Linux system was running at 192.168.1.39\
    \ then we would modify the Ettercap config screen to look something like this:\n\
    \n```\nmicrosoft.com A 192.168.1.39\n*.microsoft.com A 192.168.1.39\nwww.microsoft.com\
    \ PRT 192.168.1.39\n```\n\nWhen Finished:\n\n    Just click, \"**SAVE**\"\n\n\
    \    And then click, \"**START**\"\n\nAnd that is it. cSploit will start the MITM\
    \ attack and set the Microsoft DNS entry on that target system to point to our\
    \ Kali Linux box.\n\n# On the Stand-Alone Kali Linux System\n\nStart the Social\
    \ Engineering Toolkit, and then step through the Web Attack menu having it clone\
    \ the Microsoft website.\n\n# On the Target System\n\nWhen the attacks from our\
