  pgno: 325
- img_proc: false
  md: '"/stop" command is entered. A new file should now exist on the Windows 7 desktop:


    ![](bbox=[0.179, 0.167, 0.336, 0.353])


    This file contains screenshots and a complete step by step list of every action
    performed on the Windows 7 system. Go ahead and view the .zip file. At the top
    of the file are the screenshots:


    ![](bbox=[0.227, 0.491, 0.781, 0.789])


    And at the bottom is a step by step text log:'
