  md: '# Chapter 19

    Wordlists


    Wordlists are very important when trying to crack passwords. Cracking programs
    can take a text file filled with words, also known as a wordlist or dictionary
    file, and use it to crack passwords. They literally take a word from the wordlist,
    encrypt it and compare it with the encrypted password hash. If it doesn''t match,
    it moves on to the next password. Most cracking programs use the wordlist directly
    as they exist, while more advanced ones can also use the password file (or multiple
    files) and manipulate them to create many new combinations of passwords to try.
    For example, some can take all the passwords in the wordlist and attach letters
    or numbers to the beginning or end of the word, or take two or more wordlist files
    and combine the words from both to make a new list of words to try.


    You can download huge wordlists from the internet that include cracked passwords
    that have been publicly leaked, combinations of these leaks, foreign language
    wordlists, dumps of entire dictionaries or encyclopedias, and many more. Even
    though this will provide you with an extremely large amount of password possibilities,
    I have a hard drive filled with wordlists, many times this will still not be enough.
    Users may use industry specific terms or corporate names, positions or titles.
    In these cases, pentesters will make their own password list using company data,
    employee names, phone numbers, e-mail addresses, etc.


    Some crackers have rule sets or tools that modify the wordlists to create more
    password combinations. These rulesets can do things like changing all uppercase
    characters to lowercase, or vice versa. Others can modify the word by adding pre-fixes,
    suffixes, numbers or dates creating a totally new word. For example, a Leet (133t)
    Speak rule set can take a word from the password file and convert it to "leet
    speak", replacing common letters with numbers. Using a wordlist with rule sets
    can make password cracking must easier and faster.


    You can also take the passwords that you were able to crack, analyze them statistically
    for patterns, and then use this information to attempt to recover more passwords.
    This is accomplished by using tools to create password guess masks. The recovered
    passwords can also be used as a new attack wordlist using the cracking program
    rules to attempt to crack passwords that are similar to the ones already recovered.
    Unless you luck out and find a wordlist that contains all of the passwords in
    the dump, you will always end up analyzing the'
  merge: -1
  pgno: 270
- img_proc: false
  md: "cracked passwords for patterns in an attempt to crack the last batch of passwords.\n\
    \nWhen all else fails, you will need to attempt to use brute force cracking to\
    \ get the remaining complex passwords. Brute force cracking simply means using\
    \ the cracking program to step sequentially through every possible password combination\
    \ possible. For letters, the cracking program would start at \"a\" and work through\
    \ \"Z\", and for numbers start at \"0\" and work up to \"9\", trying every combination\
    \ in between. You can combine these together to have the cracking program look\
    \ for passwords from \"a0A0a\" through \"z9Z9z\". You can also use these combinations\
    \ together with a wordlist to crack passwords like \"a0a0aPassword\" or \"Passwordz9z9Z\"\
    .\n\n> **Warning:**\n\nSome publicly dumped wordlists are not sanitized (account\
    \ information removed) and contain user accounts along with passwords. Possessing\
    \ this information could be an ethical issue, and possibly a legal issue in some\
    \ nations. Never attempt to use this information to try to access accounts that\
    \ you do not own or have permission to access.\n\nWe will cover all the above-mentioned\
    \ techniques in the following chapters. In this chapter we will cover wordlists\
