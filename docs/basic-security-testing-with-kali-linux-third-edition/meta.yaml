  md: '# ## Chapter 10

    ## Metasploitable - Part Two: Scanners


    In the last chapter we looked at scanning the Metasploitable2 system with Nmap
    to look for open ports and services. This time we will take a look at some of
    the built-in auxiliary scanners that come with Metasploit. Running our Nmap scan
    produced a huge amount of open ports for us to pick and choose from. Many people
    don''t know that Metasploit itself comes with a substantial amount of built in
    scanners. These scanners let us search and recover information from a single computer
    or an entire network - so let''s get started!


    For this tutorial we again will be using our Kali system as the testing platform
    and the purposefully vulnerable Metasploitable2 Virtual Machine as our target
    system.


