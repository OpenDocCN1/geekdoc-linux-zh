- img_proc: false
  md: 'As you can see, the Social Engineering Toolkit can be a very handy tool. PowerShell
    is available on almost every Windows box these days, and some anti-virus programs
    still do not detect these types of attacks making them very useful. Even the latest
    operating systems still have a problem dealing with this as they are still fairly
    trusting of PowerShell.


    As you can see in the picture below:


    ![](bbox=[0.154, 0.265, 0.518, 0.404])


    So how do you defend against these types of attacks? Most likely, you would need
    to be tricked into running the code for the attack to be successful. So as always,
    be very careful opening files and links from e-mails and social media messages.
    Run an internet browser script blocking program like the Firefox add-in, "*NoScript*"
    to prevent code from automatically running from visited websites. Also, be very
    wary of shortened links, especially used on Social Media sites. I have seen a
    shortened link on one that when unshrunk was a four-line command to a malware
    server! Lastly, Windows has a lot of support for logging PowerShell activity should
    the worse happen. It is definitely worth checking out Windows PowerShell logging
    options as some features are not turned on by default.


