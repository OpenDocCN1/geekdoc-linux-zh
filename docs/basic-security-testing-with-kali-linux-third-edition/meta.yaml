  md: '# Chapter 6


    ## Additional Recon Tools


    We will wrap up the recon section with a quick look at some additional tools included
    in Kali that can be used for intelligence gathering or site reconnaissance. As
    this will be more of a reference chapter, we will only briefly cover these tools.
    The tools are available directly from the *''Applications > 01 - Information Gathering''*
    menu. An expanded information gathering tool section can be accessed by clicking
    on the *''Show Applications''* button from the Quick Access bar and then *''01
    - Information'':*


    ![](bbox=[0.246, 0.482, 0.7, 0.749])


    Additionally, many of the tools can be run from a terminal prompt simply by typing
    in the name of the tool. You can use "Tab" completion in a terminal if you don''t
    know the entire name of a tool. Simply start typing the tool name and hit the
    Tab key. Hitting tab twice will list all commands that start with what you have
    typed.


    For Example:


    ```

    root@kali:~# nets<tab> <tab>

    netsed     netsniff-ng  netstat

    ```'
  merge: -1
  pgno: 86
- img_proc: false
  md: 'Now that you have seen where the Recon tools can be found let''s look at a
    few.


    > **Reminder:**


    *As a security tester you should ensure you understand the tool before using it
    in an actual security test. Some tools may return information that is out of scope,
    or out of agreed upon terms of the test, and thus should not be used.*


    # DMitry


    **Tool Author:** James Greig


    **Tool Website**: [http://mor-pah.net/software/dmitry-deepmagic-information-gathering-tool/](http://mor-pah.net/software/dmitry-deepmagic-information-gathering-tool/)


    DMitry or "Deepmagic Information Gathering Tool" gathers as much information as
    possible about a target system. This includes sub-domains, e-mail addresses, server
    information and more:


    ![](bbox=[0.151, 0.535, 0.84, 0.764])


    This tool can return website host information via WhoIs lookups and also retrieve''s
    host data from Netcraft.com. Like Recon-NG, DMitry also searches a target for
    possible sub-domains and recovers e-mail addresses. In addition, the tool also
    has the ability to perform TCP scans.


    To start the tool, just run DMitry from the ***''Application > Information Gathering''***
    menu or from the command line by simply typing, ***"dmitry"***. This automatically
    displays the help screen (see image above).'
  merge: -1
  pgno: 87
- img_proc: false
  md: 'Enter, ***"dmitry -s <Target Website>"***:


    ![](bbox=[0.137, 0.099, 0.681, 0.394])


    For whois information, ***"dmitry -w [Target Website]"***


    Or a port scan, ***"dmitry -p [IP Address or Target Website]"***


    ![](bbox=[0.137, 0.459, 0.784, 0.731])


    DMitry is an excellent tool for gathering information about a target.


    # Sparta


    **Tool Authors:** Antonio Quina (@st3r30byt3) & Leonidas Stavliotis (@Istavliotis)

    **Tool Website**: http://sparta.secforce.com/


    Sparta is a very helpful GUI tool that scans systems for open ports and services
    information. It also can detect existing vulnerabilities and provides access to
    tools for security testing. Sparta kind of blurs the lines between a discovery
    and an attack tool. It also makes scanning and enumeration a pretty simple task.'
  merge: -1
  pgno: 88
- img_proc: false
  md: 'For a test target, I used the Metasploitable Virtual Machine. With Kali running,
    just start another instance of VMWare Player and then start the Metasploitable
    VM.


    # Basic Usage:


    +   1. In Kali, start Sparta from the ''01 - Information Gathering'' menu or by
    typing "***sparta***" in a terminal prompt.

    2. Next, "***Click here to add host(s) to scope***".

    3. Enter the IP address of the target in the pop-up box. I used the Metasploitable
    VM as a target, so the IP address would be ***192.168.1.68***. Notice you could
    also put in a range of addresses.

    4. Then click, "***Add to scope***":


    ![](bbox=[0.218, 0.394, 0.78, 0.659])


    Sparta automatically begins running multiple Nmap scans of the system looking
    for open ports and service identification. It runs the Nikto web vulnerability
    scanner, and also runs Hydra in an attempt to login to services with basic passwords.
    When finished, the program presents you with information about the vulnerable
    system:'
  merge: -1
  pgno: 89
- img_proc: false
  md: '![](bbox=[0.18, 0.105, 0.815, 0.25])


    Notice the information returned is neatly categorized on both the left and right
    sides of the screen. If you click on ''**Services**'' on the left side of the
    screen you will find a complete list of running services detected including ports
    used and version numbers. If you click on ''**Tools**'' you will see the results
    of several automated attack tools.


    Basically, all this information is echoed on the right side of the screen categorized
    in named tabs for easier viewing. Go ahead and take some time looking through
    this information as it is very interesting. If this were an actual system that
    we were security testing we would be able to see very quickly that it has numerous
    vulnerabilities. Sparta goes the extra mile and checks for standard usernames
    and passwords used.


    For example, the FTP password:


    ![](bbox=[0.18, 0.668, 0.815, 0.88])


    And the PostgreSQL database password:'
