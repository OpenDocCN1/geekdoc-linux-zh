  md: '# Chapter 27

    Raspberry Pi


    Kali is not limited to running on a traditional computer platform. The incredible
    Kali development team has put in a lot of effort into making Kali a multi-platform
    security testing framework. In this and the next chapter, we will learn how to
    install Kali Linux on a Raspberry Pi and use it for some security tests, and then
    briefly look at running Kali Linux on an Android phone. The chapters in this section
    will be more of an overview than a step-by-step tutorial. I go into much deeper
    detail of these tools on my blog and in my other books.


    Raspberry Pi is a very inexpensive fully functional "credit card" sized single
    board computer that comes in several models. The Pi has an ARM based processor,
    and its own operating system. But other operating systems compiled for ARM can
    also run on the Pi. Offensive Security have created a Kali Linux image for the
    Raspberry Pi, so installing a limited base install is fairly simple. The problem
    is, it is a limited install and there are some driver issues with it. A better
    solution for running Kali Linux on a RPi is Re4son''s "Kali-Pi". In this chapter
    we will see how to install Re4son''s Kali-Pi on a Pi 3 and use the Mana Toolkit
    to test wireless security.


    ![](bbox=[0.197, 0.608, 0.802, 0.842])


    # Pi Power Supplies and Memory Cards'
  merge: -1
  pgno: 366
- img_proc: false
  md: 'Before we get started, let me quickly cover power issues with the Raspberry
    Pi. A Power adapter does not normally come with the Pi, and for the Pi 3 B/B+
    a 2.5A supply is recommended. If the adapter you use does not provide enough amperage
    the Pi will act erratic, especially when you try to plug in a USB device like
    a Wi-Fi card. My best advice is to purchase a Raspberry Pi kit that comes with
    a power supply (Canakits are nice). The Pi also comes without a required SDHC
    memory card. An easy rule to follow when selecting a card is, the faster the better.
    I use several different cards, but usually use a 16GB - 32GB card for Kali. Some
    kits also come with the SDHC card.


    # Re4son''s Kali-Pi on a Raspberry Pi 3


    **Tool Author**: Re4son

    **Tool Website**: https://whitedome.com.au/re4son/kali-pi/


    You can install Kali Linux from the official Kali Arm pages, but when the install
    is finished, you will have a minimalistic install and will need to install additional
    software. There are also some issues with drivers. If you want to run Kali Linux
    on a Raspberry Pi, one great solution is Re4son''s "Sticky Fingers Kali-Pi". Kali-Pi
    runs on Raspberry Pi/0/2/3 and includes touch screen and Bluetooth support out
    of the gate. If you follow the Kali forums, then you have probably seen Kali-Pi
    mentioned in any Raspberry Pi related post. Kali-Pi was even featured on the Kali.org
    website:


    https://www.kali.org/news/kali-drones-portable-ctf-builds-raspberry-pi-craziness-and-more/


    Kali-Pi''s pre-configured image has several tools already installed and ready
    to use. This includes the "Mana-Toolkit". The author of Kali-Pi provides instructions
    for installing it manually, but also provides a download link for a ready to go
    pre-configured Pi image. In this article we will look at installing the pre-configured
    Kali-Pi image on a Pi3B/B+ and quickly cover using it to run the rogue Wi-Fi attack
    platform, the Mana-Toolkit.


    For this chapter you will need:


    +   - Raspberry Pi (Pi 3B/3B+ recommended), with power supply and 32 GB microSD
    card

    - Re4son''s Kali-Pi software

    - SD card writer'
