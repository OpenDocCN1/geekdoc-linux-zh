    SET presents you with the main menu. Though the menu displays options to upgrade
    SET, you will not be able to update it in Kali in this manner. All updates are
    now automatically handled by Kali.


    # Mass Emailer


    One way a Social Engineer will attack a network is to send out a flood of e-mails
    to company addresses and see who will respond or run the malicious attachment
    you sent with it. SET comes with a Mass Emailer tool that we can use to simulate
    this. As this tool actually sends e-mail if you configure all the settings, this
    section will be just a follow along using made up information.


