  md: '![](bbox=[0.144, 0.041, 0.572, 0.328])


    Next, we need to take both newly created text files and run the **"unshadow"**
    command on them from the John the Ripper utilities. This command takes the files
    and combines them into a single file (*cracked*) that John the Ripper can crack:


    +   - Open a Terminal Window

    - Navigate to the Desktop directory

    - Type, **"unshadow passwd shadow- > cracked"**


    ```

    root@kali:~# cd Desktop

    root@kali:~/Desktop# unshadow passwd shadow- > cracked

    ```


    Now that we have the combined "cracked" file, we can unleash John the Ripper on
    it to attempt to retrieve the passwords. We will use the wordlist file *"password.lst"*
    that comes with John:


    +   - Enter, **"john --wordlist=/usr/share/john/password.lst cracked"**


    ```

    root@kali:~/Desktop# john --wordlist=/usr/share/john/password.lst cracked

