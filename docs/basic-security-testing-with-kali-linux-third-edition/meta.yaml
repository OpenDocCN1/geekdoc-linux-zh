    - *Right click on the file*

    - *Click **"Open with Archive Manager"***

    - *Click the filename **"RockYou.txt"** and **"extract"***

    - *Select the Desktop directory and click **"extract"** again*


    *See the "Wordlists" chapter for more information.*


    Let''s go ahead and try to crack our Easyhash.txt hashes:


    +   1. Open a terminal prompt, navigate to the Desktop directory and type, ***"hashcat
    -D 1 -m 1000 Easyhash.txt rockyou.txt -o cracked.txt --force"***


    The "**-D 1**" switch tells Hashcat to use the CPU, normally you would want to
    use "**-D 2**" to make Hashcat use the GPU, but we are in a Virtual Machine environment.
    The "**-m 1000**" switch tells Hashcat that our hashes are NTLM based hashes.
    ***Easyhash.txt***" is the name of our hash file, ***"rockyou.txt"*** is the name
    of our dictionary file and "**-o cracked.txt**" tells Hashcat where to store the
    cracked hashes.


    NOTE: The "**--force**" is currently only necessary on the Kali VM version, as
    at the time of this writing there are some issues with running the CPU version
    of Hashcat in a Kali VM.


    So basically, we provided the hash style, the hash filename, the dictionary file
    and the output file. The attack options will change, but for the most part this
    is'
  merge: -1
  pgno: 284
- img_proc: false
  md: 'the basic format that is used consistently with Hashcat.


    +   2. Hashcat will then begin to crack the passwords and display a status screen:


    ![](bbox=[0.167, 0.149, 0.788, 0.378])


    +   3. When done, type "**cat cracked.txt**" to see the cracked hashes:


    ![](bbox=[0.167, 0.43, 0.621, 0.668])


    And there you go, 13 passwords cracked in just a few seconds. Take a good look
    at the passwords, as coincidently many of these are the top passwords found pretty
    consistently year after year, in password dumps. Using any of these passwords
    would not stand up to a password cracker for more than a fraction of a second.


    # Cracking harder passwords


    Let''s look at some harder passwords with Hashcat.


    Take the following hashes and save them in the Desktop directory as "***Hardhash.txt***":'
  merge: -1
  pgno: 285
- img_proc: false
  md: '```

    31d6cfe0d16ae931b73c59d7e0c089c0

    2e4dbf83aa056289935daea328977b20

    d6e0a7e89da72150d1152563f5b89dbe

    317a96a1018609c20b4ccb69718ad6e7

    2e520e18228ad8ea4060017234af43b2

    ```


    Now type, "*hashcat -D 1 -m 1000 Hardhash.txt rockyou.txt -o Hardcracked.txt --force*".


    Everything on the line is the same as before, except we changed the hash name
    to the new "Hardhash.txt" file and changed the output filename to "hardcracked.txt".


    And in a few seconds, we see the screen below:


    ![](bbox=[0.18, 0.42, 0.81, 0.58])


    Okay, it ran for about the same amount of time, but this time it was only able
    to recover 2 of the 5 hashes. If we run the cat command on the "hardcracked.txt"
    file, we see something odd:


    ![](bbox=[0.18, 0.7, 0.6, 0.74])


    Only one hash is shown - an empty password, which is correct for that hash. But
    where is the second cracked hash? The latest version of Hashcat sometimes will
    not store the cracked password if it was cracked earlier. It did crack the second
    hash, it just didn''t store it in the output file. If you look at both sets of
    hashes above, one hash is repeated, the hash for the password "P@$$word". The
    password is stored in Hashcat''s potfile, so it didn''t bother to store it in
    the output file. This can be a bit frustrating, but you can disable the potfile
    using the "**--potfile-disable**" swtich. We still have 3 uncracked hashes, so
    let''s try a larger dictionary file.'
  merge: -1
