  md: 'Server 2008 systems. EternalBlue was an exploit allegedly developed by the
    NSA and publicly leaked by the hacker group "Shadow Brokers" in 2017. The exploit
    has since been added to the Metasploit Framework. EternalBlue targets a vulnerability
    in SMB version 1. The Metasploit exploit works against any Windows 7 or Server
    2008 system that is running SMB version 1 and has not been patched.


    The EternalBlue exploit in Metasploit only works against 64-bit targets. As we
    have installed 32-bit versions of our software, and the Microsoft Win7 trial versions
    are only 32 bit, this *will not work* in our lab. I did want you to see this,
    so it will just be a read through section. For this example, I am using a 64-bit
    version of Kali Linux and a 64-Bit Windows 2008 R2 Server as a target, so the
    IP addresses will be different than what we are used to seeing. We will return
    to our regular lab systems in the next chapter.


    # **Walkthrough of the EternalBlue exploit**


