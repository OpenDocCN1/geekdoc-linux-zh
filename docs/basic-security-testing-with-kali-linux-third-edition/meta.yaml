  md: 'If Wifite couldn''t crack the file there are several ways you can try to crack
    it. One way is to use "Aircrack-ng" to crack the handshake. Just use the capture
    file provided by Wifite and feed it to Aircrack-ng with a wordlist file. Here
    is an example using the ever popular rockyou.txt wordlist. The wordlist is compressed,
    so you need to de-compress it before you can use it – just right click on it and
    select "open with archive manager" and extract it to the current wordlist directory.
    You can then use the wordlist in attacks as seen below:


    ```

    aircrack-ng -a 2 -b c1:00:32:21:1a:a3 -w /usr/share/wordlists/rockyou.txt hs/handshake_Dlink_c1-00-32-21-1a-a3_2018-07-27T16-08-57.cap

    ```


    +   - **"-a 2"** tells it to use WPA

    - **"-b"** is the SSID of the router

    - **"-w"** is the wordlist


    Lastly, you just use the filename of the handshake .cap file that was saved in
    the ***"hs"*** directory.


    When the command is executed it automatically begins cracking the handshake key:


    ![](bbox=[0.155, 0.567, 0.845, 0.888])


    Wifite will also give you the commands to crack the handshake files using multiple
    programs with a specific dictionary file. This is accomplished by running WiFite
    using the **"--crack"** and **"--dict [wordlist path]"** switches. As seen below:'
  merge: -1
