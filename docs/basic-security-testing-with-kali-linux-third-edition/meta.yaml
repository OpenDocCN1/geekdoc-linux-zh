  md: '# Chapter 15


    # Service Poisoning with Responder, Multi-Relay and MITMf


    In this chapter we will discuss how to easily get user credentials (hashes & clear
    text passwords) from a vulnerable Windows network using Responder. We will cover
    how you could get a remote shell on a wired network by using Responder''s Multi-Relay
    tool to "Pass the Hash". We will then deepen our control over the target by using
    PowerShell to create a remote Meterpreter shell. Lastly, we will cover using responder
    in the MITMf.


    +   - **Responder** - A pentester go-to tool for LLMNR, NBT-NS and WPAD based
    poisoning attacks. Basically, responder poisons the network and responds to several
    legitimate network service advertisements in an attempt to trick either the service
    or the user into giving up user credentials.


    - **Multi-Relay** - A tool included with Responder that is able to take the credentials
    obtained by Responder and use them in a "Pass the Hash" style attack, allowing
    access to other network systems by re-using the password hash.


    In a Windows network if a network resource cannot be found using DNS, it will
    rely on LLMNR or NBT-NS to find network resources (if enabled). Responder poisons
    these services so it responds to these requests, and in some cases, tricks the
    network into giving up a password hash to connect to the fake service. WPAD is
    also used in some large environments to provide the internet proxy address to
    workstations. Many browsers are set to auto-detect the system proxy by default
    when the internet browser is opened. In a Windows network environment, WPAD provides
    this information. Responder imitates this service'
  merge: -1
  pgno: 215
- img_proc: false
  md: 'and can be used to trick users into giving up their credentials to connect
    to internet services.


    This chapter was originally written as one of my Kali NetHunter (the Android phone
    version of Kali) articles. For the original article I used Kali NetHunter as the
    attack platform and a Windows 2016 Server & Windows 10 Enterprise client in a
    workgroup (non-Domain) environment, and it worked very well. I also tested this
    on a Windows 2012 r2 Server with a Windows 7 client with very similar results.
    So, we shouldn''t have any problems running this on our Windows 7 test VM.


    ![](bbox=[0.13, 0.405, 0.871, 0.741])


    Microsoft has done a lot of work in targeting "Pass the Hash" type attacks and
    limiting their effectiveness. They are not as effective as they were in the past,
    but there is still a chance that you could find vulnerable targets. The Multi-Relay
    attack tool relies on SMB signing being disabled on the target network, basically
    this means that the target network must be vulnerable, which in some cases means
    that the OS is misconfigured or running older software/services. All current Windows
    operating systems support SMB signing, and it is automatically enabled on Domain
    Controllers. Responder includes a tool called, "RunFinger"'
  merge: -1
  pgno: 216
- img_proc: false
  md: 'that can quickly scan a network to see if any machines are vulnerable to this
    type of attack.


    In a Kali Terminal:


    Navigate to ***/usr/share/responder/tools***

    Enter, ***./RunFinger.py -i 192.168.1.0/24***


    This will scan our lab network for vulnerable systems, as seen below:


    ```

    root@kali:/usr/share/responder/tools# ./RunFinger.py -i 192.168.1.0/24

    Retrieving information for 192.168.1.93...

    SMB signing: False

    Null Sessions Allowed: True

    Vulnerable to MS10-010: True

    Server Time: 2018-06-28 16:19:08

    Os version: ''Windows 7 Professional 7600''

    Lanman Client: ''Windows 7 Professional 6.1''

    Machine Hostname: ''WIN-420RBM3SRVF''

    This machine is part of the ''WORKGROUP'' domain

    ```


    As you can see, the Windows 7 VM is in fact vulnerable to this attack as SMB signing
    is not enabled. In my testing I found that Multi-Relay was only able to "pass
    the hash" for the Administrator account when SMB signing was disabled. Though
    Responder is still able to obtain account information in a network with SMB signing
    enabled, if the user enters an incorrect UNC path or is using WPAD and is tricked
    into entering their credentials. We have introduced Responder and explained how
    we will be using it, now let''s see it in action!


    > **Warning:**


    *As with all security tools, make sure you understand the complete ramifications
    of using the tool (especially one that modifies network services traffic) before
    ever attempting to use it in a live production environment!*


    # Responder


    Responder is run from a terminal prompt, let''s start it using the defaults settings.


    Enter, ***responder -I eth0***


    This command simply starts responder with the default service poisoners and runs
    them on the eth0 interface, as seen below:'
  merge: -1
  pgno: 217
- img_proc: false
  md: '![](bbox=[0.15, 0.04, 0.76, 0.3])


    Responder will then poison network services and begin answering service requests.
    This is almost instant on a local network interface (but can take a few seconds
    if your attack platform is hooked to the router via Wi-Fi). If Responder can grab
    credentials (usually from mis-typed UNC paths) it will display and store the network
    hash, with the default options. Responder will also prompt the user for their
    password.


    # **On the Windows 7 VM:**


    +   1. Open File Manager

    2. In the search path bar at the top, enter "\\server\\files" (any non-existent
    UNC path)


    ![](bbox=[0.155, 0.66, 0.46, 0.76])


    The Windows 7 user will be prompted with a login prompt:'
  merge: -1
