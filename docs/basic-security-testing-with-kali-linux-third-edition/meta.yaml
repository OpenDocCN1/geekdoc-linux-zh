  md: '# # Chapter 9


    # ## Metasploitable2 Tutorial - Part One


    We have covered a lot of basic intro, recon and mapping; now let''s look at attacking
    hosts. For this section we will be using Metasploitable2. Metasploitable2 is a
    purposefully vulnerable Linux distribution. What this means is that it has known
    bugs and vulnerabilities built in on purpose. It is a training platform made to
    be used with Metasploit to practice and hone your computer security skills in
    a legal environment.


    Many people think that Linux or Mac OS are much more secure than Windows. But
    like Windows, if you don''t install system patches and updates, they are equally
    vulnerable. The resources section at the end of this chapter cover a lot of information
    on installing and using Metasploitable2 so I will not spend a lot of time on this
    topic. But we will go through a couple of the exploits using Kali to see how the
    process works.


    As mentioned in the installation chapter, I chose to stay with Metasploitable2
    for this book instead of the newer Metasploitable3, mostly because of ease of
    installation. At the time of this writing there are software generation issues
    with MS3. These can be overcome, but I thought that walking new users through
    these issues might be a little too advanced for the Basic Kali book. Besides MS2
    is still useful in seeing the basic concepts of Metasploit. We will be using MS3
    in my upcoming Advanced Kali book.


    # ## Installing and Using Metasploitable2


    Metasploitable2 is available as a Virtual Ware VM. Instructions for installing
    and setting up Metasploitable were covered in the installing chapter. Basically,
    just download the file, unzip it, start a new instance of VMWare player and then
    open it with VMWare Player. It''s that simple. If you are using Virtual Box, Rapid
    7 hosts a video showing the full install of Metasploitable on Virtual Box. A link
    to the video can found in the Resources section below.'
  merge: -1
  pgno: 138
- img_proc: false
  md: '> **Warning:**


    *Never run Metasploitable on a public facing system, it is, by design, vulnerable!*


    Once Metasploitable boots up you will come to the main login screen:


    ![](bbox=[0.18, 0.22, 0.82, 0.4])


    To login, enter the name and password shown on the menu:


    +   - Username: ***msfadmin***

    - Password: ***msfadmin***


    You wouldn''t believe how many budding security professionals have asked for the
    default login credentials for Metasploitable2, and they are right on the login
    screen. Logging in is pretty anti-climactic, you basically just end up at a text
    based terminal prompt. But we are not here to use the system from the keyboard;
    the goal is to try to get into the system remotely from our Kali system!


    # Scanning for Targets


    One of the first steps that many security testers use is to do a Nmap scan to
    try to determine what ports are open and hopefully even what services are installed
    on those ports. If we can determine open ports and service program versions, then
    we may be able to exploit a vulnerability in the service and compromise the machine.
    Let''s take a look at Metasploitable2 from our Kali box. We will perform a standard
    scan to see what ports are open and what services are available.


    +   - Open a Terminal window on your Kali system

    - Type, "***nmap -h***" to see available options:'
  merge: -1
