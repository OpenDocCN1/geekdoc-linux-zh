    Any credentials recovered are stored in the Responder.db database, they are also
    stored in text files located in the logs directory.


    Open a second Kali terminal

    List the contents of the **''/usr/share/responder/logs''** directory:


    ```

    root@kali:~# cd /usr/share/responder/logs

