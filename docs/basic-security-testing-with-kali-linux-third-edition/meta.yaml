    # Cleaning out the Responder Database


    If your Multi-Relay "Pass the Hash" attack doesn''t succeed right away, Responder
    will prevent it from trying to pass incorrect hashes again to prevent a lockout.
    If you try again it still may not work as the incorrect hash is still stored in
    the database. To fix this issue you need to exit Responder, and then manually
    delete the Responder database file (***Responder.db***), and the target record
    file in the ''***/usr/share/responder/logs***'' file. When you re-start Responder
    the Responder.db file will be re-created automatically, and you can try your attack
    again.


    > **Warning:**


    Be very careful when deleting the files, especially the Responder.db file as deleting
    any other files in the ''/usr/share/responder'' folder could break your tool.


    This has been a pretty crazy section, I know. So before we end this chapter, let''s
