- img_proc: false
  md: "Your Shodan API key is located on the \"My Account\" section of the Shodan\
    \ website. When the install is finished, you are now ready to use Shodan CLI.\n\
    \nType, ***shodan -h*** to see the help menu:\n\n![](bbox=[0.14, 0.155, 0.605,\
    \ 0.345])\n\nYou can now run Shodan directly from your command prompt. For example,\
    \ we can search Shodan for a specific host by using the host command and an IP\
    \ address as seen in the simulated search below:\n\n```\nroot@kali:~# shodan host\
    \ 99.999.99.999\n99.999.99.999\nHostnames:        mail.fakedomain.ru\nCity:  \
    \           Moscow\nCountry:          Russian Federation\nOrganization:     Media\
    \ Center\nNumber of open ports:  1\nVulnerabilities:  CVE-2014-0231   CVE-2015-0204\n\
    \nPorts:\n    80 nginx\n```\n\nShodan returns location information about the target,\
    \ and the open ports. But notice that it also shows that this system has known\
    \ vulnerabilities! If Shodan has recognized a potential vulnerability for the\
    \ system, the CVE number for it is listed. You can then look up information on\
    \ how to remediate this issue, or as a penetration tester, possibly how to exploit\
    \ it. Please realize that Shodan does not always list all the vulnerabilities\
    \ for every system. So, if none are listed it doesn't necessarily mean that an\
    \ issue doesn't exist.\n\n# **Shodan Searches with Metasploit**"
  merge: -1
  pgno: 82
- img_proc: false
  md: 'Shodan search capabilities are included in the Metasploit Framework. Using
    the Shodan API key allows you to automate Shodan searches from within Metasploit.
    If you don''t know how to use Metasploit, do not worry, we will cover it pretty
    extensively in later chapters.


    To find systems with Metasploit, simply use it like any other exploit:


    +   1. Start Metasploit by using the Metasploit icon on Kali''s Quick Launch Bar.


    ![](bbox=[0.14, 0.3, 0.85, 0.52])


    +   2. At the **msf** prompt type, "***use auxiliary/gather/shodan_search***":


    ```

    msf > use auxiliary/gather/shodan_search

    msf auxiliary(gather/shodan_search) >

    ```


    +   3. Now, "***show options***" to see what options we need to use:


    ![](bbox=[0.16, 0.7, 0.79, 0.86])


    +   4. Type "**set SHODAN_APIKEY <API Key Number>**" and fill in your API Key
    Number.


    +   5. Now set the Query field with the keyword you want to search for:'
  merge: -1
  pgno: 83
- img_proc: false
  md: '![](bbox=[0.122, 0.072, 0.736, 0.123])


    +   6. Now just type, *"run"*.

    7. After a few seconds, you will see a short statistical return and then the actual
    systems found:


    ![](bbox=[0.122, 0.227, 0.736, 0.481])


    You can change the max number of search page returns, store the data to a file
    or to the database using the "set" command options. If this seems a little confusing,
    don''t worry, we will cover using Metasploit in much greater detail later.


    # Conclusion


    In this section we talked about the Shodan search engine. We covered how to perform
    searches in Shodan using keywords and filters. Next, we looked at a couple of
    Shodan''s new features, and finally we saw how to search Shodan from within Kali
    using the Shodan Command Line Interface and Metasploit. Unfortunately, there are
    thousands if not millions of unsecured or under secured systems that can be easily
    found using Shodan. It is critical that companies know what systems that they
    have publicly available on the web. The larger the company is, the more common
    it is that they have systems exposed online that are outdated, open or inadequately
    secured. Shodan is a quick and easy way to find these devices. I highly recommend
    corporate security teams (even small businesses & home owners) search for their
    IP space in Shodan to see what systems they have publicly available on the web.


    # Resources'
