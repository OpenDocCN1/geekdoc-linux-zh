    |_ SMB server online


    2018-06-20 14:07:01 192.168.1.93 [type:Firefox-39 os:Windows] download.mozilla.org

    2018-06-20 14:07:02 192.168.1.93 [type:Firefox-39 os:Windows] download.cdn.mozilla.net

    2018-06-20 14:07:07 192.168.1.93 [type:Firefox-39 os:Windows] cnn.com

    ```


    Hit "**Ctrl-c**" when done to stop the attack and have MITMf restore the original
    ARP tables.


    Notice how quick and simple that was to perform. If you would have run the exact
    same command, but left off the target, MITMf would *execute an ARP attack on the
