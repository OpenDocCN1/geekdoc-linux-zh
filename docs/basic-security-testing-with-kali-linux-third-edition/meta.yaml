    root@kali:/usr/share/responder/logs#

    ```


    Credential files are stored by type and IP address. If you view the file, you
    will find the user''s password in an encrypted hash format. We will talk about
    cracking passwords in later chapters. Though you can use the recovered hash'
  merge: -1
