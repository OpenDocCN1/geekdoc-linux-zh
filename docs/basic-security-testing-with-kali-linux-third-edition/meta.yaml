  md: '# Chapter 5

    Shodan


    ![](bbox=[0.165, 0.295, 0.835, 0.555])


    **Website Founder:** John Matherly

    **Website Address:** https://shodan.io/

    **Website Blog**: https://blog.shodan.io/


    Shodan is one of the most amazing websites on the internet. Called the "Hacker''s
    Google", "Dark Google" and many times just "terrifying" - It is basically a search
    engine for computers. Shodan allows you to find computers or devices on the web
    by searching for them by keyword, services, ports, operating systems or location.
    For example, you can search for all the Microsoft IIS servers in Canada, or all
    the systems using Linux in Africa. It can find any connected server, be it a physical
    file server, printer, webcam or an Internet of Things (IoT) device that that is
    publicly accessible from the web. In this chapter we will learn how to use Shodan
    for security testing.


    If you are familiar with "*Google Dorks*", Shodan is a much easier way to search
    the breadth of the internet for targets. The trick to using Shodan effectively
    is to know the right keywords. Usually they are the manufacturer''s name, or a
    device model number, but sometimes they are the name of a very obscure embedded
    web server. Once you know the right keywords, you can search the world for'
  merge: -1
  pgno: 65
- img_proc: false
  md: 'these devices in seconds. By using filter commands, you can refine your search
    to specific networks, companies or even the software version running on a server.


    A security team can use Shodan to very quickly assess what systems on their network
    are being displayed publicly, when maybe they shouldn''t be. It can also allow
    them to find possible rogue or unauthorized devices that have been added to the
    company network. In this section we will briefly discuss why searching your network
    space using Shodan is a good idea. We will then look at how we can do these searches
    from the web interface, Shodan.io, and finally through Kali Linux using the Metasploit
    Framework.


    # Why scan your network with Shodan?


    There are a large number of seemingly unsecured systems that should never be publicly
    available on the Internet. All can be found easily with just a couple keyword
    searches using Shodan. Everything from open, outdated & insecure systems, routers,
    network storage and phone systems - to security cams, building controls, and even
    security systems.


    ![](bbox=[0.187, 0.538, 0.781, 0.607])


    But that is not all. Open network printers and embedded devices can also be a
    fount of information for hackers giving out SNMP and network infrastructure information,
    and possibly even user accounts and passwords!


    Sadly, in this new "Internet of Things" world, computer systems are not the only
    things that can be found online. Sure, you can find large industrial HVAC environmental
    and building temperature controls (completely open and unsecured), but you can
    also find other uncommon devices like online aquarium controls and even remote-controlled
    doors:'
  merge: -1
  pgno: 66
- img_proc: false
  md: '![](bbox=[0.165, 0.085, 0.671, 0.296])


    Often the online device has security, but it comes with it turned off from the
    manufacturer, and all the user needs to do is turn it on or assign a password.
    But many don''t:


    ![](bbox=[0.196, 0.391, 0.583, 0.531])


    When a password is used, it is often left to the factory default (easily found)
    or a simple password (easily cracked). The company itself may not have even been
    the one to put one of these devices online. There have been multiple reports over
    the years of internet enabled building controls for major companies inadvertently
    being exposed on the internet. Sometimes a building contractor or third-party
    support group, not fully understanding computer security, would install the device
    and then leave them completely open or with default credentials. And with the
    explosion of the "Internet of Things" (IoT), putting an embedded internet server
    in everything from toasters to television sets, these problems are just beginning.


    Searching for open systems using Shodan has become very popular. If you have heard
    of "Urban Explorers" - Those that explore old abandoned buildings in cities for
    thrills, think of frequent Shodan searchers as "Cyber Explorers" - Those that
    explore the world''s computers for open or loosely secured systems. Once interesting
    systems are found, the keyword searches are usually shared amongst friends, or
    publicly posted on the internet. Shodan itself has an "Explore" section where
    users can share interesting finds:'
  merge: -1
  pgno: 67
- img_proc: false
  md: '![](bbox=[0.16, 0.02, 0.84, 0.47])


    Granted many are just surfing Shodan for research purposes, or to grab screenshots
    of ridiculous things that people put on the web, but it is also a tool that those
    with nefarious purposes could use. That is why it is important to check to see
    if you have systems, unbeknownst to you, that are publicly viewable or accessible
    from the web.


    In this chapter we will look at the following Shodan features:


    # Shodan Features


    +   - Shodan Website Search

    - Shodan Exploits

    - Shodan Maps

    - Shodan ICS Radar


    And some more advanced features:


    +   - Shodan Command Line Interface

    - Shodan Searches with Metasploit'
  merge: -1
  pgno: 68
- img_proc: false
  md: '![](bbox=[0.182, 0.069, 0.795, 0.243])


    The first thing you will want to do is create an account on the website. If you
    do not, your search capabilities will be greatly reduced. Registering for a basic
    account is free and allows greater access to search returns & search filtering,
    it also allows you to use some of the Shodan API features. For full access to
    the site capabilities you will need to purchase a membership. There are several
    plans available, see the Shodan API page for more information ([https://developer.shodan.io/pricing](https://developer.shodan.io/pricing)).
    You will need at least a free account for this chapter.


    > **Warning:**


    *Clicking on the title of individual Shodan search returns can sometimes take
    you directly to a live system! Never access or modify a system that you do not
    have express permission to do so.*


    # Basic Searches


    Performing a basic search is extremely easy in Shodan. Just type in whatever you
    are looking for in the search bar and click the search button. So, for example,
    if we wanted to search for Cisco routers:


    +   - Type in "**cisco**" and click the "**search**" icon


    Shodan returns links to over two million Cisco routers worldwide. In the main
    part of the page you will see the individual device returns listed. You can click
    the "**details**" link at the bottom of each return to view an information page
    on the device. On the left side of the screen, Shodan also shows you how many
    of the total devices are from a certain country or location.'
  merge: -1
  pgno: 69
- img_proc: false
  md: '![](bbox=[0.29, 0.06, 0.69, 0.42])


    You can click on any country to zero in your search. So, for example, if we wanted
    to view all the Cisco devices in China, we could click on "**China**" under Top
    Countries. Shodan now shows us the Top City returns for Cisco routers in China:


    ![](bbox=[0.35, 0.59, 0.65, 0.87])


    This is a very nice feature, but many times you will just use filter commands
    when narrowing down your searches. Actually, if you look at the search bar, Shodan
    automatically entered a country filter into the search line when you clicked on
    China. The search bar should now look like this:'
  merge: -1
  pgno: 70
- img_proc: false
  md: 'You can see the country filter is used along with China''s two letter country
    code. We will take a closer look at using Filters in a minute, but first, let''s
    take a look at a device information page. In the main part of the Shodan search
    screen we see individual returns listed. If you click on the *"Details"* link
    of one of the returns you will see more detailed information about the device:


    ![](bbox=[0.184, 0.251, 0.673, 0.499])


    This includes the location of the device, common ports & services and a generic
    location. You can even zoom in on the map and scroll around. Doing basic searches
