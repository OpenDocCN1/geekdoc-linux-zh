  md: '# Chapter 1


    What is Kali Linux?


    Kali Linux is an advanced Linux based platform for security testing. Kali has
    been written from the ground up to be the most feature rich Ethical Hacking/Pentesting
    distribution available. Kali also runs on more hardware devices greatly increasing
    your options for computer security penetration testing or Ethical Hacking.


    If you are coming to Kali from a Backtrack background, after a short familiarization
    period you should find that everything is very similar and your comfort level
    should grow very quickly. If you are new to Kali, once you get used to it, you
    will find an easy to use security testing platform that includes hundreds of useful
    and powerful tools to test and help secure your network systems.


    # Why Use Kali Linux?


    Kali includes over 300 security testing tools. A lot of the redundant tools from
    Backtrack have been removed and the tool interface streamlined. You can now get
    to the most used tools quickly as they appear in an easy to use Applications menu.
    You can also find these same tools and a plethora of others all neatly categorized
    in the menu system.


    Kali allows you to use similar tools and techniques that a hacker would use to
    test the security of your network so you can find and correct these issues before
    a real hacker finds them.'
  merge: -1
  pgno: 20
- img_proc: false
  md: '![](bbox=[0.16, 0.08, 0.84, 0.42])


    I think the biggest drive to use Kali over commercial security solutions is the
    price. Security testing tools can be extremely costly, Kali is free! Secondly,
    Kali includes open source versions of numerous commercial security products, so
    you could conceivably replace costly programs by simply using Kali. Although Kali
    does include several free versions of popular software programs that can be upgraded
    to the full featured paid versions and used directly through Kali.


    In Backtrack updating some programs seemed to break others, in Kali, you update
    everything using the Kali update command which is much better at keeping system
    integrity. Simply update Kali and it will pull down the latest versions of the
    included tools for you. Just a note of caution, updating tools individually could
    break Kali, so running the Kali update is always the best way to get the latest
    packages for the OS. Though, some tool creators have chosen to do updating/ installs
    by cloning directly from GitHub instead of using Kali''s install process.


    In addition to stand alone and virtual machine instances of Kali, I also use Kali
    on a Raspberry Pi - a mini credit card sized ARM based computer. With Kali, you
    can do almost everything on a Pi that you could do on a full-sized system. In
    this book I will cover using the Pi as a security testing platform including testing
    Wireless networks. I also briefly cover using Kali NetHunter, the Android based'
  merge: -1
  pgno: 21
- img_proc: false
  md: 'Kali testing platform. Testing networks with a device you could fit in your
    pocket, how cool is that?


    Though Kali can''t possibly contain all the possible security tools that every
    individual would prefer, it contains enough that Kali could be used in a security
    test from beginning to end. Don''t forget that Kali is not just a security tool,
    but a full-fledged Linux Operating System. So, if your favorite tool runs under
    Linux, but is not included, most likely you can install and run it in Kali.


    # Ethical Hacking Issues


    In Ethical Hacking & Pentesting, a security tester basically acts like a hacker.
    They use tools and techniques that a hacker would most likely use to test a target
    network''s security. The difference being they are hired by the company to test
    security and when done reveal to the leadership team how they got in and what
    they can do to plug the holes.


    The biggest issue I see in using these techniques is ethics and law. Some security
    testing techniques that you can perform with Kali and its included tools are actually
    illegal to do in some areas. So, it is important that users check their Local,
    State and Federal laws before using the tools in Kali Linux.


    Also, you may have some users that try to use Kali, a very powerful set of tools,
    on a network that they do not have permission to do so. Or they will try to use
    a technique they learned, but may have not mastered on a production network. All
    of these are potential legal and ethical issues. Never run security tools against
    systems that you do not have express written permission to do so. In addition,
    it is always best to run tests that could modify data or possibly cause system
    instability on an offline, non-production replica of the network, and analyzing
    the results, before ever attempting to use them on live systems.


    # Scope of this Book


    This book focuses on those with beginning to intermediate experience with Backtrack/
    Kali. I think it would also be a good tool for network administrators and non-security
    IT professionals that are looking to get into the field. We will cover everything
    from a basic overview of Kali to using the included tools to test security on
    Windows and Linux based systems. We will cover basic computer security testing
    from reconnaissance to finding & using exploits, Social Engineering, Wi-Fi security,
    using Kali on a Raspberry Pi, exploiting passwords, and finally securing your
    systems.


    # Why did I write this book?'
  merge: -1
  pgno: 22
- img_proc: false
  md: 'This book is the latest re-vision of a book that has been used in universities,
    training centers, classrooms, and security centers across the world. It is an
    absolute honor to provide updated material for a book that has been so well accepted
    and adopted in the industry. My other reason for writing this book is to help
    get young people interested in the field of computer security. For example, the
    US is currently facing a crisis when it comes to young professionals choosing
    technical careers and the cyber security field is no different. The US government
    is in need of thousands¹ of cyber warriors and some industry experts have even
    suggested that the US consider hiring security experts² from other countries to
    fill in the gap.


    # Disclaimer


    Never try to gain access to a computer you do not own, or security test a network
    or computer when you do not have written permission to do so. Doing so could leave
    you facing legal prosecution and you could end up in jail.


    > *The information in this book is for educational purposes only.*


    There are many issues and technologies that you would run into in a live environment
    that are not covered in this material. This book only demonstrates some of the
    most basic tool usage in Kali and should not be considered as an all-inclusive
    manual to Ethical hacking or pentesting.


    I did not create any of the tools in Kali nor am I a representative of Kali Linux
    or Offensive Security. Any errors, mistakes, or tutorial goofs in this book are
    solely mine and should not reflect on the tool creators. Install, usage and update
    procedures for tools change over time, if the install/setup information presented
    here no longer works, please check the tool creator''s website for the latest
    information. Though not mentioned by name, thank you to the Kali developers for
    creating a spectacular product and thanks to the individual tool creators, you
    are all doing an amazing job and are helping secure systems worldwide!


    # References


