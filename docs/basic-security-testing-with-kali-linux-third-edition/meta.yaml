  md: "# ##### Plaid CTF 2014) __Meow\n\n# By: KK, Reverse\n\nPoints: 250 / Solvers:\
    \ 28\n\n今回挑戦した問題は、Plaid CTF 2014 に実際に出題された「Meow」という reversing 問題です。問題としては、ある処理を実行してくれる実行ファイルが渡され、その中身を解析して正しい答えを導き出す問題でした。\n\
    \n# ### ファイル概要\n\n与えられるファイルは、以下のような構成になっている実行ファイル ($MEOW$) である。\n\n```\n$ file\
    \ meow\nmeow: ELF 64-bit LSB executable, x86-64, version 1 (SYSV),\ndynamically\
    \ linked (uses shared libs), for GNU/Linux 2.6.24, \nBuildID[sha1]=0x...\n\n$\
    \ ./meow aaaa\nError: ./meow [flag.txt] / the flag is 11 chars\n```\n\nこの問題に対するアプローチは以下のとおり。\n\
    \n+   * 配布された実行ファイルは、$MEOW$ という言語のコンパイラもしくはインタプリタ。\n* $MEOW$ のソースコードを解読する。\n*\
    \ ファイルの中に含まれる flag の条件を逆算する。\n\n# ### Step1: 実行ファイルの解析\n\n実行ファイルを解析する手段としては、objdump,\
    \ gdbなどがあるが、今回は最近知った [Hopper](http://www.hopperapp.com/) というツールを使用した。\n\n# ###\
    \ Step2: $MEOW$ 言語の解読\n\n実行ファイルを解析したところ、以下のようなソースコードが入手できた。\n\n```\n; hello world\
    \ in MEOW\n           \nmeow         ; declaration keyword?\n    meow    ; declaration\
    \ keyword?\n        meow            ; push?\n        meow meow       ; push?\n\
    \        meow meow meow  ; push?\n        meow meow       ; push?\n        meow\
    \ meow meow meow meow    ; push?\n        meow            ; push?\n        meow\
    \ meow       ; output char?\nmeow                ; end?\n```\n\nこの例では、Hello Worldとなる。これは、以下の手順で解析できる。\n\
    \n+   * まず、`meow meow` で `meow` を3回繰り返すことから、宣言する手続きの内側に入る\n* `meow` 4回のネストは、引数なしの出力手続きを表す\n\
    \n![](bbox=[0.062, 0.717, 0.936, 0.872])\n\nこれらの解析によって、$MEOW$ 言語の命令の種類を以下のようにまとめることができた。"
