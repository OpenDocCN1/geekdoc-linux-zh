  md: '```

    Interface: 192.168.1.93 --- 0xb

    Internet Address      Physical Address      Type

    192.168.1.1           c1-22-33-44-55-66     dynamic

    ```


    The physical address for our Kali VM should now be listed as the router! If you
    were able to view the ARP table for the router you would see that it''s physical
    address for the Windows machine would also be altered and would point to the Kali
    VM. Take a few minutes and surf around on the internet on your Windows 7 system.


    You should notice the websites visited will show up on in MITMf:


