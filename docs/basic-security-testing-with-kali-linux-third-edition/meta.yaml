  md: '# Chapter 20

    # John the Ripper & HashCat


    So far, we have covered several techniques for attacking passwords. We saw that
    sometimes you can just do a rainbow table lookup, and in some cases, you can pass
    the hash. But if all else fails, you have to crack the hash. Kali includes several
    excellent tools to do this. In this section we will look at two of my favorites,
    John the Ripper & Hashcat.


    # ## Introduction


    We rely on passwords to secure our home systems, business servers and to protect
    our online account information. But as cracking programs improve and video cards
    get faster (Video GPU''s are used for very fast cracking) passwords are becoming
    much easier to crack. How big of a problem is this? I have been working through
    some very large publicly dumped password hash lists using Hashcat64. I use my
    Windows 10 system that has a Core i7-6700 processor running at 3.4 Ghz and a single
    GTX 960 video card. It''s not a dedicated cracking machine, I have seen some crazy
    ones out there, but even so, it was still able to crack over 500,000 hashes in
    30 seconds. It ripped through 19 Million in an hour and a half!


    ![](bbox=[0.296, 0.724, 0.704, 0.834])


    When you think about it, that''s over 200,000 hashes recovered per minute, or
    3,500 per second. And that was just with using a single GTX 960. Top end cards
    like the GTX 1080 Ti are a lot faster, especially when you use multiple cards
    for cracking (I''ve seen rigs with up to 8 video cards). Granted these were simple'
  merge: -1
  pgno: 280
- img_proc: false
  md: 'SHA1 encrypted hashes, hashes using newer encryption or salted passwords would
    take a lot longer to crack. A salted password uses a unique value or salt to encrypt
    each password so no two password hashes are ever the same. But believe it or not
    finding public password dumps using unsalted passwords are still very common today.
    Add in the fact that the latest version of Hashcat takes the maximum crackable
    password length from 32 up to 256 and it makes you think twice about your company
    password length and complexity policy.


    # John the Ripper


    **Tool Author**: Solar Designer and community


    **Tool Website**: http://www.openwall.com/john/


    John the Ripper, or John is a very fast CPU based password cracker. It is very
    easy to use and is often the first tool used when trying to crack a password.
    John is very good at getting shorter passwords, so I usually use John first, to
    get the low hanging fruit or easier passwords, and then move to Hashcat for more
    complex cracking. As such, we will only quickly cover John.


    John is really easy to use, you just type "john" and the password file to crack
    and John takes off running. John will attempt to automatically detect the hashes
    from the password file. If it can''t it will prompt you to enter the correct encryption
    format using the "*--format=*" command. The following screenshot is an example
    of cracking a large SHA1 password dump using John:


    ![](bbox=[0.144, 0.641, 0.789, 0.849])


    As I mentioned earlier, for a CPU based cracker, John is fast. In the example
    above, I fed John a list of over 16 Million hashes. It found over 2 million of
    the passwords I was trying to crack in about 15 minutes. After that, it just spun
    its wheels with no real progress. At this point I could have used some of John''s
    more advanced features to crack the list, but instead I moved on to Hashcat.'
  merge: -1
  pgno: 281
- img_proc: false
  md: 'When you do crack a password hash file, any credentials that are recovered
    are stored in John''s pot file. The pot file is located in your ***home/.john***(hidden)
    directory:


    ```

    root@kali:~# cd .john

    root@kali:~/.john# ls

    john.log  john.pot  john.rec

    root@kali:~/.john#

    ```


    If you open the pot file you can see the password hashes with the cracked password
    on the right side:


    ![](bbox=[0.18, 0.34, 0.836, 0.566])


    You can also view cracked passwords using "***john --show***". If you exit a john
    cracking session the state will automatically be saved. You can restore a saved
    or exited session with "***john --restore***".


    I usually try John first on small groups of hashes that I am able to recover on
    a security test. That''s about the extent that I use John. It is a great tool
    if you recover a single hash and need to crack it quick, or if you have a large
    list of basic hashes. Anything large or more complex and I immediately switch
    to Hashcat.


    # Hashcat


    **Tool Authors**: Jens Steube & the Hashcat Development Team

    **Tool Website**: https://hashcat.net/hashcat/

    **Tool Wiki**: https://hashcat.net/wiki/


    Hashcat is an all-purpose password cracker that can run off of your graphics card
    processor (GPU) or your CPU. Hashcat is touted as the world''s fastest and most
    advanced password cracker. The tool is a multi-threaded cracker, so if your'
  merge: -1
  pgno: 282
- img_proc: false
  md: 'CPU can run several threads, it will use them. But the real speed comes into
    play when using the horsepower of a GPU, the processor on your video card. If
    your GPU can run hundreds of threads, all of this power is used to break passwords.
    You can even harness the power of multiple video card GPUs to create a monster
    cracking station. Hashcat used to be two separate programs, but the original Hashcat
    (CPU based) & oclHashcat (GPU based) tools have been combined into one tool.


    Hashcat can be started from the menu **(Applications > 05-Password Attacks > Hashcat)**
    or by opening a terminal and typing, "**hashcat**". You can see the different
    options by typing "**hashcat --help**":


    ![](bbox=[0.137, 0.363, 0.866, 0.555])


    When using Hashcat you need to tell it a few things:


    +   - Type of password hash

    - Filename of the file containing the un-cracked hashes

    - The Dictionary or Wordlist file name

    - The output filename to store the cracked hashes

    - And finally, the switches for any other options you want


    # Cracking NTLM passwords


    There is nothing like hands on learning, so let''s crack some hashes. We will
    take a list of hashes and copy them into a text file. And then we will crack them
    using Hashcat and a dictionary file.


    ```

