    # ## MitM DNS Spoofing with cSploit


    Along with the Kali tools, NetHunter also installs several additional tools that
    are very helpful to a penetration tester including cSploit. cSploit is probably
    the fastest way on the phone to scan a connected network and perform basic attacks,
    including MitM. Just tap the cSploit icon to start the application. It will immediately
    perform a quick scan of all systems connected to the network. You will then be
    shown a list of all the network devices along with their name, MAC & IP addresses
    along with how many ports were detected on each device.


    Clicking an individual target will give you a list of scans and attacks that can
    be run against the target:


    ![](bbox=[0.323, 0.45, 0.671, 0.668])


    Trace and port scanner are self-explanatory. Service inspector runs an in-depth
    scan with service detection. Once this is done, you can then click the "Exploit
    Finder" button to try to find exploit for any vulnerabilities found during the
    Service inspection.


    Let''s take a look at the MITM attacks:'
