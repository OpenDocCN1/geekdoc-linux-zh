    # Other Attack Options with SET


    Spend some time with SET and check out the numerous options it offers for attacking
    a target system. You can use SET to create malicious CD/DVD and USB media (for
    creating booby-trapped media and leaving it in corporate parking lots, etc.),
    a slew of Arduino based attacks, Microsoft SQL Brute Forcer, Wireless Access Point
    attack, a Mass E-Mailer, QR code attack and a bunch of website social engineering
    attacks that we did not cover.


    The SCCM attack vector under the Fast Track menu is especially of concern to any
    corporation that uses PXE booting and corporate images. For a complete overview
    of the SCCM attack, see:


    [http://www.trustedsec.com/files/Owning_One_Rule_All_v2.pdf](http://www.trustedsec.com/files/Owning_One_Rule_All_v2.pdf)


    You can also set a lot of options in the SET config file to modify how SET functions.
    The file can be found at "***/etc/setoolkit/set.config***". The Social Engineering
    Toolkit is truly a robust and feature rich program. And even though other tools
    are beginning to provide similar functions, it is still a valuable tool for any
    corporate security testing team.


    # Conclusion'
