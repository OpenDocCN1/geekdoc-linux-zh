    # Wordlists from the Web


    Wordlists range in size and content. Just because one is longer than another doesn''t
    mean that it will have a higher chance of cracking the passwords that you are
    targeting. For example, I have wordlists that are around 100GB in size, but my
    main ones are about 2-4GBs. As you become more adept at cracking passwords you
    will find that some wordlists just have a higher usage probability than others.
    Once you find these lists, they become your go-to lists for password cracking.
    You will also find that you end up using small wordlists a lot. Some of the smaller
    wordlists have great base words that lend themselves very well to combination
    attacks (combining two wordlist files) or brute force attacks where you use the
    wordlist along with a combination of characters, numbers or symbols.


    # Sites that offer Wordlists'
