  md: '# Wordlist Generator Tools


    Several tools in Kali let you make your own personalized wordlists. CeWL is pretty
    useful as it lets you create passwords by grabbing information from a target website.
    Crunch is nice too as it allows you to create your own custom wordlists from scratch.
    Let''s take a closer look at how to use these tools.


    # CeWL


    **Tool Author**: Robin Wood


    **Tool Website**: http://digi.ninja


    CeWL is a great tool for creating company or theme-based wordlists. Many times,
    a user will create a password using words that relate to where they work or what
    they do. CeWL crawls a target website and builds a custom wordlist file using
    words found on the site.


    ![](bbox=[0.214, 0.495, 0.789, 0.762])


    To use CeWL, just provide the options that you want and the target URL. For example,
    if we wanted to spider the website, "cyberarms.wordpress.com", to a depth of 1
    (-d 1) pull any words six characters or longer (-m 6) and save it as "cyberarms.txt"
    we would use the following command:


    *cewl -w cyberarms.txt -d 1 -m 6 https://cyberarms.wordpress.com/*'
  merge: -1
  pgno: 273
- img_proc: false
  md: '![](bbox=[0.135, 0.095, 0.872, 0.353])


    CeWL then crawls the target website and creates a wordlist with the terms that
    meet our criteria. The resultant text file might need to be cleaned up a bit before
    use, but this is a very useful tool.


    # Crunch


    **Tool Authors**: Mimayin and Bofh28


    **Tool Website**: https://sourceforge.net/projects/crunch-wordlist/


    Crunch is a great program that allows you to create your own custom password lists.
    Simple tell crunch what you want, the length and complexity, and crunch makes
    it for you.


    ![](bbox=[0.135, 0.673, 0.872, 0.946])


    The Crunch manual page (shown above) contains complete instructions and examples
    on how to use the tool. Basically, all we need to tell crunch is the'
