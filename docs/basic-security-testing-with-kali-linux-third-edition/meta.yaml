  md: '# Conclusion


    In this chapter we covered how to use some of the built-in scanners to quickly
    scan for specific services. Scanning for specific services that tend to be vulnerable
    can be a quick way into a network. Some professional pentesters no longer rely
    on Nmap as the main tool in finding these services. Many go for a quick kill by
    looking for specific service vulnerabilities commonly available before turning
    to Nmap, and some don''t use Nmap at all.


    We looked at several of the core service scanners and learned how they function.
    Shockingly, we were able to obtain clear text passwords from the telnet service.
    Once we get a set of credentials, we could use the auxiliary scanners in Metasploit
    to further exploit the network. Just plug those credentials into one of the scanners
    and sweep the entire network to see what other systems that they would work on.


    We only touched on a fraction of the scanners, there are many that we didn''t
    cover. It would be a good idea to take some time and look through them to see
    what they can do. Next, we will see how to bypass that pesky anti-virus with the
    Veil Framework.'
  merge: -1
  pgno: 158
- img_proc: false
  md: '# Chapter 11

    Bypassing Anti-Virus


    One part of penetration testing is getting past that pesky anti-virus. In the
    past, Anti-Virus programs worked by pattern or signature matching. If an app looked
    like malware that it had been programmed to look for, it caught it. If the malicious
    file had a signature that AV had not seen before, most likely the AV would allow
    it to run. Most advanced AV programs now are more intelligent. They use machine
    learning and actually watch what the program is trying to do. If it "looks" suspicious,
    by how it executes or the commands that it is using, modern Anti-Virus will catch
    it. It is harder now, but you can still sneak shellcode past AV engines by using
    different techniques & programming languages.


    Many people think that if they are running an Anti-Virus and a firewall, that
    they are generally safe from hacker attacks, but the truth is far from that. In
    this chapter we will talk about two popular tools used to bypass Anti-Virus on
    Windows systems. "Veil" is a remote Windows shell payload generator that can bypass
    many current Anti-Virus programs. "Magic Unicorn" is a PowerShell attack-based
    tool that can also bypass AV.


    # Veil Framework


    **Tool Author**: Chris Truncer


    **Tool Website**: https://www.veil-framework.com/


    The Veil Framework is one way that we can attempt to bypass Anti-virus. Veil was
    created by security expert and Blackhat USA class instructor Chris Truncer. The
    new Veil tool includes Veil-Evasion, which we will be talking about in this chapter.
    It takes a standard Metasploit payload and through a Metasploit like program interface
    allows you to create shellcode that, in many cases, will bypass anti-virus. Veil
    is constantly being upgraded with new features being added, so I recommend checking
    the Veil website for the latest tool updates and information.'
  merge: -1
  pgno: 159
