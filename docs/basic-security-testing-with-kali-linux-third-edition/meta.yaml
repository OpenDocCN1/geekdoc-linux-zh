  md: "# 模型下载与推理示例\n\n# 一、模型下载\n\n本项目以 BGE-M3 多语言向量模型为基础模型。模型可通过 ModelScope、Hugging\
    \ Face 或 wisemodel（启智平台）下载。\n\n+   - ModelScope：https://www.modelscope.cn/models/BAAI/bge-m3\n\
    - Hugging Face：https://huggingface.co/BAAI/bge-m3\n- wisemodel（启智平台）：https://wisemodel.cn/models/BAAI/bge-m3\n\
    \n# 二、推理示例（Python）\n\n```\nfrom FlagEmbedding import BGEM3FlagModel\n\nmodel =\
    \ BGEM3FlagModel('BAAI/bge-m3', use_fp16=True)\n\nsentences_1 = [\"What is BGE\
    \ M3?\", \"Defination of BM25\"]\nsentences_2 = [\"BGE M3 is an embedding model\
    \ supporting dense retrieval, lexical matching and multi-vector interaction.\"\
    ,\n              \"BM25 is a bag-of-words retrieval function that ranks a set\
    \ of documents based on the query terms appearing in each document\"]\n\nembeddings_1\
    \ = model.encode(sentences_1, batch_size=12, max_length=8192)['dense_vecs']\n\
    embeddings_2 = model.encode(sentences_2, batch_size=12, max_length=8192)['dense_vecs']\n\
    \nsimilarity = embeddings_1 @ embeddings_2.T\nprint(similarity)\n# [[0.6265, 0.3477],\
    \ [0.3499, 0.678 ]]\n```\n\n# 三、稀疏检索（Sparse Retrieval）示例\n\n```\noutput_1 = model.encode(sentences_1,\
    \ return_dense=True, return_sparse=True, return_colbert_vecs=False)\noutput_2\
    \ = model.encode(sentences_2, return_dense=True, return_sparse=True, return_colbert_vecs=False)\n\
    \n# compute lexical weights using sparse embedding\nlexical_scores = model.compute_lexical_matching_score(output_1['lexical_weights'][0],\
    \ output_2['lexical_weights'][1])\nprint(lexical_scores)\n# 0.1956\n\nprint(model.convert_id_to_token(output_1['lexical_weights'][0]))\n\
    # {'What': 0.0826, 'is': 0.0814, 'BGE': 0.0656, 'M3': 0.1016}\n```"
