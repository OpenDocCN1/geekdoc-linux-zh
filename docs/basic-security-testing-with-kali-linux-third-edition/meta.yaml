    This process adds a little stealth to running Mimikatz. When Mimikatz is run in
    this way, it does not show up as normal in the system process list. All that does
    show up is the "rundll32" program.


    # Conclusion


    In this chapter we learned about the powerful tool Mimikatz. We saw how to recover
    plain text passwords from a remote system using the Metasploit Framework''s Meterpreter
    and Mimikatz together. We learned how to boot from a Kali Live system and view
    the contents of a Windows file system (If the drive wasn''t encrypted, we could
    have easily pulled user documents and files from it). We explored how to set up
    the Utilman Bypass to log into Windows without a'
  merge: -1
  pgno: 317
- img_proc: false
  md: 'password. Finally, we covered how to use Mimikatz to grab a user''s password
    in plain text in a physical attack.


    As you can see trusting in using complex passwords alone as a security measure
    is not always fool proof. If an attacker is able to get access to your system,
    they could possibly obtain your password in plain text. As the adage goes, ''physical
    access equals total access''.


    So, what can be done to combat these types of attacks? Shut down your system if
    you will be away for extended times. Install a Power on Password to protect the
    boot process from tampering. Use an encrypting file system that encrypts the entire
    drive. Secure physical access to important machines. Also turn off or disable
    DVD/CD ROM drives and USB ports if not needed. Some organizations even go to the
    extent of filling USB ports with glue!


