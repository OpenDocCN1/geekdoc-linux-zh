  md: '**getlwd & lpwd** – Get (display) Local Working Directory


    **lcd** – Change Local Directory


    **lls -** Local List Files


    So, if we needed to check our local working directory and then change into the
    Kali system''s Desktop directory, we can do the following:


    ```

    meterpreter > lpwd

    /root

    meterpreter > lcd Desktop

    meterpreter > getlwd

    /root/Desktop

    meterpreter >

    ```


    The "*download*" command allows you to download files from the target system,
    and conversely, "*upload*" allows you to send files to the remote system. If you
    wanted to upload a file, connect to the desired local & remote directories, and
    then execute the upload command with the file name you want to send. So, if I
    had a file named "Tools" (a text file I created just for this example) on the
    Kali Desktop that I want copied over to the target system, I could upload it as
    shown below:


    ```

    meterpreter > lpwd

    /root

    meterpreter > lcd Desktop

    meterpreter > getlwd

    /root/Desktop

    meterpreter >

    meterpreter > lpwd

    /root/Desktop

    meterpreter > pwd

    C:\Users\Dan\test

    meterpreter > upload Tools

    [*] uploading  : Tools -> Tools

    [*] Uploaded 5.00 B of 5.00 B (100.0%): Tools -> Tools

    [*] uploaded   : Tools -> Tools

    meterpreter > ls

    Listing: C:\Users\Dan\test

    ================================


    Mode              Size  Type  Last modified              Name

    ----              ----  ----  ---------                  ----

    100666/rw-rw-rw-  5     fil   2018-05-17 16:28:12 -0400  Tools

    ```


    I first checked to see that I was in the Desktop directory on the Kali machine
    where the Tools file was located. I then verified that I was connected to the
    "***test***" directory on our target, and simply used the "***upload***" command
    to transfer the file.'
