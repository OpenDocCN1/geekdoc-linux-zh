  md: '# **About the Author**


    Daniel W. Dieterle has worked in the IT field for over 20 years. During this time,
    he worked for a computer support company where he provided system and network
    support for hundreds of companies across Upstate New York and throughout Northern
    Pennsylvania. He also worked in a Fortune 500 corporate data center, briefly worked
    at an Ivy League school''s computer support department and served as an executive
    at an electrical engineering company.


    For about the last 8 years Daniel has been completely focused on security as a
    computer security researcher and author. His articles have been published in international
    security magazines, and referenced by both technical entities and the media. Daniel
    has assisted with numerous security training classes and technical training books
    mainly based on Ethical Hacking & Kali Linux, and enjoys helping out those new
    to the field.


