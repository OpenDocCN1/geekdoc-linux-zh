    As you can see in the example above, we have a complete capture of an FTP login
    and file download. Wireshark is great for analyzing network communications, and
    you can do a lot with it, but it is a bit advanced for a new user and might be
    hard to use until you become familiar with it. So, let''s look at our packet capture
    in one last program. Xplico, lists all the information from the packet capture
    in an easy to read menu. It also allows us to view any images or documents.


    # Xplico


    **Tool Authors**: Gianluca Costa, Andrea de Franceschi and contributors

    **Tool website**: https://www.xplico.org/


    Xplico has been added to the Kali repositories, but it may not be installed on
    your system yet. It is a web-based interface, so to start it you need both the
    Apache Web Server and Xplico server started. Under ***"System Services"*** in
    the Kali Applications Menu, you should see Xplico listed.


    If Xplico is not listed you will need to install it. To install, run the following
    command:


    ```

    **apt install xplico**

    ```'
