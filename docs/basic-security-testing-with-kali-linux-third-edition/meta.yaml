  md: '# Chapter 26

    # Rouge Wi-Fi Router Attacks with Mana


    # ## Mana


    **Tool Authors:** Sensepost, Dominic White & Ian de Villiers

    **Tool Website:** https://github.com/sensepost/mana


    Smart devices that use Wi-Fi are also vulnerable to Rogue Wi-Fi attacks. If we
    setup a rogue Wireless Router and the target connects to it, we can see everything
    the target is doing. If you are running a program like Sensepost''s Mana you will
    even be able to see encrypted communication.


    > > **Warning:**

    >

    > *If you want to try out Mana, I highly suggest that you install it on a separate
    VM copy of Kali Linux.*

    >

    > *I do not recommend installing Mana on the same VM that you are using for the
    tutorials in this book as it makes several changes that are not easily undone.*


    Like other rogue Wi-Fi router programs Mana creates a rogue wireless router, but
    it is capable of so much more. Mana runs as a user defined access point, but it
    also listens for computers and mobile devices to beacon for preferred Wi-Fi networks,
    which it can then impersonate. Once someone connects to the rogue device, it automatically
    runs SSLstrip to downgrade secure communications to regular HTTP requests and
    can bypass/redirect HSTS. This allows the attacker to view all session data. Mana
    also allows you to crack Wi-Fi passwords, grabs login sessions cookies and lets
    you impersonate these sessions with Firelamb. But that is not all; it can also
    impersonate a captive portal and can simulate internet access in places where
    there is no access. See the tool website for more information and check out the
    creator''s Defcon 22 Presentation:


    https://youtu.be/i2-jReLBSVk


    Mana uses a lot of the tools already installed in Kali and works amazingly well,
    though at the time of this writing I did have some issues getting it to run with
    the latest version of Kali.


    Enough introductions, let''s see Mana in action:'
  merge: -1
  pgno: 353
- img_proc: false
