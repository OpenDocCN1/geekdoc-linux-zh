    \n# Mimikatz and Utilman\n\nFor ages the security field mantra has been, if you\
    \ have physical access, you have total access. And in many cases, this is true.\
    \ I performed onsite server and workstation support throughout upstate New York\
    \ and Northern Pennsylvania for about 20 years and have seen companies do some\
