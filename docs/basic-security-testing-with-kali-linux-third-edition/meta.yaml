  md: 'Using scripts, you can automate a lot of information and data collection against
    the target. Let''s take a moment and look at a couple of them.


    To see a list of all the available scripts just type, "***Run <tab><tab>***":


    ![](bbox=[0.172, 0.156, 0.541, 0.359])


    Hit "***return***" or "***space***" to navigate through them. Then just type,
    "***run***" with the script name that you want to try. Let''s look at a couple
    to see how they work.


    # **CHECKVM:**


    Sometimes when you get a remote shell you are not sure if you are in a Virtual
    Machine or a standalone computer. You can check with this command:


    > ***run post/windows/gather/checkvm***


    ![](bbox=[0.172, 0.578, 0.615, 0.653])


    As you can see it correctly determined that our target was a VMware VM.


    # **GETGUI:**


    Getgui is a neat little script that will allow you to enable remote desktop on
    a Windows machine (if it isn''t already enabled) and create a remote desktop user.
    The user is added to both the remote desktop user group and the administrator''s
    group. This makes it handy if you want to connect back to the machine at a later
    date.'
