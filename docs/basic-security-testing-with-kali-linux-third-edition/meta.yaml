- img_proc: false
  md: 'The "*-L*" switch lists our username file, "**Users**" in this case. The "*-P*"
    switch is the location of our password file, or "**Passwords**" in this case.
    Then we just list the target IP address and "*ssh*" for the service:


    ![](bbox=[0.13, 0.12, 0.86, 0.3])


    *(You can use Hydra-GTK from the Online Password attack menu if you prefer a graphical
    interface)*


    As you can see it found that the following users/password combos were able to
    successfully log into the target''s SSH server:


    ***Sys/ batman* and *msfadmin/ msfadmin***


    Though it is kind of silly trying a small list of passwords that we already know,
    the concept is solid. Without having any of the actual passwords we could use
    hydra with a large username and password dictionary file to try to brute force
    our way into the server. But if you already have usernames and passwords it will
    be much quicker to just try the list you have against targeted services.


    Let''s try out Hydra against Metasploitable''s FTP service:


    Enter, "*hydra -L Users -P Passwords ftp://192.168.1.68*"


    ![](bbox=[0.15, 0.74, 0.84, 0.89])


    This time Hydra found 4 valid username/ password combinations against the FTP
    service. Hopefully this demonstrates the usefulness of these tools. Next, we will
    look at doing the same thing with "Medusa".


    # Automating Password Attacks with Medusa'
