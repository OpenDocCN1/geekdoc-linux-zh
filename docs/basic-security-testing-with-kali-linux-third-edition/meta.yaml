    \ of it.\n\nThe longer Kismet runs the better view you will get of the surrounding\
    \ environment.\n\n> **Note:**\n\n*You may have heard of the term \"War Driving\"\
    . Basically what this means is to drive around town with a Wi-Fi monitoring program\
    \ and grab area Wi-Fi information. Kismet is a program that is used quite frequently\
    \ for war driving.*\n\n*Simply run Kismet on your laptop as you drive around.\
    \ Add a GPS source (like a smart phone) and Kismet will add GPS location to each\
    \ network that it discovers. When you are done you can create a nice map of area\
    \ Wi-Fi networks.*\n\n+   8. When you feel Kismet has run long enough, click on\
    \ the \"***Kismet***\" menu option and then \"***Quit***\".\n9. You will then\
    \ be asked if you want to Stop the Kismet Server, go ahead and click, \"***Kill***\"\
    :\n\n```\n─Stop Kismet Server─\nStop Kismet server before quiting?\nThis will\
