- img_proc: false
  md: 'Again, within about a second the website responded with *"password"*. As we
    can see from the cracking speed, using the password of *"password"* is about the
    same as not using a password at all.


    Objectif Sécurité''s online tool used to crack LM hashes only. It also cracked
    each password as it was entered. The website tool now only cracks NT Hashes, but
    the LM cracking tool is available as a download on their website. When the LM
    tool was available online, it could take some very complex passwords and crack
    them very quickly, because the LM hash is much easier to crack. Here are some
    LM hash examples that I tried in the past, it cracked each of them in under 10
    seconds:


    ![](bbox=[0.15, 0.32, 0.86, 0.4])


    ![](bbox=[0.15, 0.42, 0.86, 0.5])


    ![](bbox=[0.15, 0.52, 0.86, 0.6])


    So, no matter which password you entered, if its hash was in the Rainbow Table
    it would return it very rapidly. The web tool can now be slow at times. The newer
    online tool puts your crack request in a user queue and depending on how many
    users have submitted hashes, it can take several minutes to crack a single hash.
    Being that the tool now also cracks the better encrypted NT hashes, this can also
    take a while.


    There are other online crackers available but you really need to be careful in
    using them. Some now want to run Bitcoin miners through your browser while it
    is cracking the password. Some of these sites are polite and ask if you mind running
    the miner for them, as "payment" for using their service, but I have seen other
    sites that just run the miner if you want it to or not. I personally don''t use'
  merge: -1
  pgno: 255
- img_proc: false
  md: 'online sites for cracking anymore, and haven''t in a long time. I use the password
    cracking tools built into Kali, which we will discuss later.


    Basically, if your systems are still using LM hashes, and your password is 14
    characters or less, the password could be cracked in a very short amount of time.
    Granted, these are Windows LM Hashes and not the more secure Windows 7/ Server
    2008 NTLM based hashes. But, as cracking speeds increase NTLM hashes can be cracked
    quickly if the user used a simple password. NTLMv2 hashes are harder still to
    crack, because they are salted, but as cracking speeds increase, relying on passwords
    alone may no longer be a good security measure. Many companies and government
    facilities have moved away from using just passwords alone to using dual authentication
    methods. Biometrics and smartcards have really become popular in secure facilities.


    # ## Using "Find My Hash" to search for Hashes Online


    Going to individual online sites for cracking passwords can be time consuming.
    Each website may have different Rainbow Tables, so you may need to check several
    sites to find your hash. It would be nice if you could automate the search in
    Kali. Well, you can with *"Find my hash"*.


    In a terminal, enter, ***"findmyhash <Encryption Type> -h <hash>"***


    So, if we had an MD5 hash, we could use Find My Hash to see if an online site
    had cracked it.


    As seen below:'
