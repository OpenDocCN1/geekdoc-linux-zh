    # Recovering Passwords from a Locked Workstation


    Moving forward with this concept, how cool would it be for a penetration tester
    (if they had physical access to a system) to be able to grab the passwords off
    of a Windows system that was sitting at a locked login prompt? And what if you
    could get these passwords in plain text? Well, if the circumstances are right,
    you could! A while back I was wondering, what if you were a penetration tester
    that had physical access to a system, would it be possible to get passwords off
    of a locked Desktop? You know, a user is using the system and dutifully locks
    his workstation before leaving for lunch. If you have physical access to the system,
    this could be done.


    First you need to be able to enable the system level command prompt from the login
    screen. Discussed above, the "*Utilman Login Bypass*" trick enables a pop-up system
    level prompt by just pressing the "Windows" and "u" key on the keyboard. Now all
    we need is a USB drive with Mimikatz installed. The Mimikatz Window''s executable
    files can be downloaded from Gentle Kiwi''s GitHub site:


    ([https://github.com/gentilkiwi/mimikatz/releases/](https://github.com/gentilkiwi/mimikatz/releases/))


    *Almost all Anti-virus engines detect Mimikatz as malicious now, so you may need
    to take that into account when trying to download it.*


    +   1. You would need to have already configured the "*Utilman Bypass*" from above
    at an earlier point in time.

    2. Login to the Windows system as normal and then lock the desktop by pressing
    the "***Windows***" & "***I***" keys.'
