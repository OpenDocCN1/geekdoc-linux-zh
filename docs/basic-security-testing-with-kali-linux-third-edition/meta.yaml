    # ## Modifying Mana Settings


    The Mana configuration file *(/etc/mana-toolkit/hostapd-mana.conf)* and each of
    the Mana start-up scripts can be modified. Actually, on the tool website the tool
    author even mentions that the startup scripts are more like guidelines and recommends
