  md: 'files from this folder directly with your favorite password cracker, like John
    the Ripper.


    Using John is very simple, just type: *"john [SMBv2 File Name]"*


    ```

    root@kali:/usr/share/responder/logs# john SMBv2-NTLMv2-SSP-192.168.1.93.txt

    Created directory: /root/.john

    Using default input encoding: UTF-8

    Rules/masks using ISO-8859-1

    Loaded 22 password hashes with 21 different salts (netntlmv2, NTLMv2 C/R [MD4
    HMAC-MD5 32/32])

    Press ''q'' or Ctrl-C to abort, almost any other key for status

    password         (Dan)

    ```


    In about a second or two, John cracked the file and shows that the user *"Dan"*
    used the password *"password"*. This obviously isn''t a secure password and wouldn''t
    (shouldn''t!) satisfy any company''s password complexity requirements. A complex
    password would take a lot longer to crack.


    Use **"Ctrl-c"** to stop responder


    Take a look at the responder screen and notice how many times Responder poisoned
    requests from multiple systems on the LAN. As you can imagine this could be a
    very useful tool to get user creds during a penetration test.


    Responder has other options and can attack additional services, next we will look
    at Basic Authentication & WPAD attacks.


    # Basic Authentication & WPAD


    WPAD is used in some corporate environments to automatically provide the internet
    proxy for web browsers. Many internet browsers have "auto-detect system proxy"
    set by default in their internet settings, so they will seek out a WPAD server
    for a proxy address. We can enable WPAD service support in Responder to have it
    respond to these requests. If we use WPAD with the "Force Basic Authentication"
    option, responder prompts users with a login screen when they try to surf the
    web and grabs their creds in clear text.


    Command:


    ```

    **responder -I eth0 -wbF**


    *"-w"* starts the WPAD Server

    *"-b"* enables basic HTTP authentication

    *"-F"* forces authentication for WPAD (a login prompt)

    ```'
  merge: -1
  pgno: 220
- img_proc: false
  md: '![](bbox=[0.158, 0.062, 0.842, 0.512])


    When a user opens a web browser, the browser will reach out for proxy settings
    using WPAD.


    If the Windows browser is set to auto-detect browser settings:


    ![](bbox=[0.138, 0.665, 0.862, 0.905])


    Responder will respond to the request telling the browser that it is the WPAD
    server and to use it for the proxy. Then, when the user tries to surf the internet,
    Responder triggers a login prompt:'
