    # Conclusion


    There are many security issues with routers and it can be very easy to circumvent
    some of the common security measures that are implemented. In this section we
    have covered the Router exploit framework "RouterSploit". We also looked at how
    to scan for wireless networks and view beacon traffic. We then covered a couple
    techniques that can be used to de-mask hidden wireless access points. For more
    information on Wi-Fi security testing using the Aircrack-NG tools, I highly recommend
    the book, "Kali Linux Wireless Penetration Testing Beginner''s Guide", which I
    think is now in its third revision.


    The best defense against Wi-Fi attacks is to secure your router! One of the main
    defenses your network has is your firewall; if you allow people inside your firewall
    you can open yourself up to ARP MitM attacks, packet sniffing and other attacks.
    Unfortunately, many corporate users do not understand this and will take their
    business laptops from a secured environment at work to an unsecured Wi-Fi network
    at home.


    Be cautious of free Wi-Fi. Don''t do online banking or shopping while using public
    Wi-Fi. Make sure your operating system is using a firewall and preferably internet
    security software. If your security software monitors your ARP table, that is
    even better! Use common sense, if you are working on sensitive information, do
    it at home not at the local coffee shop that offers free Wi-Fi, even if their
    cinnamon rolls are the best in the world. It is just not worth the risk!


