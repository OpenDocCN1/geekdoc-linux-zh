  md: '# Chapter 22

    Mimikatz - Plain Text Passwords


    # MimiKatz


    **Tool Author:** Benjamin Delpy

    **Tool Website:** http://blog.gentilkiwi.com


    In this section we will look at recovering remote passwords in plain text. You
    read that right, *plain text!* Windows 7 stores passwords in plain text in several
    locations in Windows processes, and you are able to recover these using Delpy''s
    amazing tool. Mimikatz has been available as a stand-alone program for a while
    now and has been added into the Metasploit Framework as a loadable Meterpreter
    module, making recovering passwords once you have a remote session incredibly
    easy. Did I mention the passwords are in plain text? Though in newer operating
    systems, like Windows 10 & Server 2016 it returns the NTLM hash that would need
    to be cracked.


    In this chapter we will see how to use Mimikatz through Metasploit to recover
    passwords from a remote system. Then we will see how Mimikatz could be used in
    a physical attack, an attack where the security tester has physical access to
    a system. There are several other ways you could use Mimikatz that we will not
    cover, and Benjamin does an amazing job at updating the tool and adding new features,
    so I highly recommend visiting the tool blog for the latest information.


    # Metasploit Mimikatz Extensions


    We will start with an active Windows 7 System level remote shell in Meterpreter.
    See the Chapter on Bypassing UAC as a refresher on how to go from an administrator
    level to system level account if needed. We will then load the Mimikatz Extensions
    (called "kiwi" in Meterpreter) and use it to display passwords. We can use the
    Windows 7 "Cute Puppy" remote shell that we have used several times now. Just
    start the Metasploit handler first. If you still have'
