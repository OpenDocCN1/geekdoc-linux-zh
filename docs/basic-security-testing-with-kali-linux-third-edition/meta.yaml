  md: 'If a client attempts to connect to this hidden AP, we automatically capture
    the SSID name in a "Probe Request". Checking the packet capture for "Probe Requests"
    we will actually see the unhidden SSID as seen below:


    ```

    93   6.623480   Probe Request, SN=0, FN=0,   SSID=*Terminator*

    99   7.122094   Probe Response, SN=843, FN=0   SSID=*Terminator*

    ```


    The AP name that did not show up in the Beacon frames becomes revealed to us as
    soon as a client attempts to connect! The client lists the hidden AP name in the
    probe request, in this case "*Terminator*". And the AP echoes its hidden name
    back to the client in the Probe Response.


    +   5. To stop the Wireshark capture, just use the "**Stop Capture**" button on
    the menu. You can then search, filter or save the results.

    6. Click "***File***" and then "**Close**" to return to the main Wireshark directory.

    7. You can then close Wireshark.


    Another way to find the name of a hidden access point is to just let Airodump-ng
    run for a while (*airodump-ng wlan0mon*) and as clients connect, it will decipher
    the AP name and display it:


    ![](bbox=[0.176, 0.479, 0.821, 0.572])


    Notice the ESSID "***Terminator***" is correctly listed in the picture above,
    where before it just said, "<***Length 10***>".


    # Turning a Wireless Card into an Access Point


    One of the interesting features of wireless cards is that they can also act as
    an Access Point. This feature is of great interest to penetration testers, but
    unfortunately also to malicious users. You can create an AP using any SSID that
    you want. If you can setup your created AP the same as an existing one, the client
    cannot tell the difference and will usually connect to the nearest one, or the
    one with the strongest signal.


    Once your card is in monitoring mode (*airmon-ng start wlan0*), you can turn it
    into an AP using the Airbase-ng command:


    ```

    ***airbase-ng -e "EvilAP" -c 6 wlan0mon***

    ```


    This command creates an AP with the name "EvilAP", on channel 6 using the wlan0mon
    interface.'
