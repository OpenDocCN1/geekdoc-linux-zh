  pgno: 320
- img_proc: false
  md: 'You need to move your key logger to the session that you want to monitor. So,
    in this case, simply migrating our Meterpreter shell to the winlogon process puts
    us in the correct mode to look for passwords. We then need to start keyscan again.


    Let''s step through this process:


    +   6. Type **"ps"** in Meterpreter to get a process list. Look for the PID of
    the process "winlogon".


    ![](bbox=[0.17, 0.225, 0.46, 0.43])


    As you can see in the image above winlogon.exe has the Process ID number 472 (yours
    will be different). We simply need to migrate our Meterpreter session to that
    ID.


    +   7. Type *"migrate <winlogin PID#>"* or in our case here "***migrate 472***".


    ![](bbox=[0.17, 0.56, 0.61, 0.62])


    > **Note:**


    *If you get an "insufficient privileges" error, you will need to run the Bypass
    UAC module and elevate your level to ''System''. See the ''Bypass UAC'' section
    in this book for more information.*


    +   8. Now go ahead and start keyscan again, "***keyscan_start***".

    9. Then Lock the Windows 7 workstation and log back in.

    10. And finally, dump the keylog to view the user password using, "***keyscan_dump***":'
  merge: -1
  pgno: 321
- img_proc: false
  md: '```

    meterpreter > keyscan_start

    Starting the keystroke sniffer...

    meterpreter > keyscan_dump

    Dumping captured keystrokes...

    password <Return>

    meterpreter >

    ```


    And we have the password! In the picture above, notice the *"Windows"* + *"L"*
    keystroke to lock the desktop does not show up. This is because we are now monitoring
    the winlogon session key buffer, so it is not displayed. So, in essence, because
    our target needed another cup of coffee to get through their busy day of web surfing,
    they locked their desktop and then logged in again. When they did we were able
    to grab their full password.


    Go ahead and stop the keyscan with "***keyscan_stop***".


    # Automating KeyScan with Lockout Keylogger


    Now, what would be great is if we could automate this process. I mean do you really
    want to just sit there and hang out until the user leaves their system? You could
    force their desktop into locked mode and make them login again, but that is pretty
    suspicious. What if you could have Meterpreter automatically find and migrate
    to the winlogon process, then scan the computer idle time and automatically put
    the user''s system into locked mode? Finally, what would be really nice too is
    if the script notified you when the user logs back in and gives you a text dump
    of their password.


    Meet "Lockout_Keylogger", an amazing script made by CG and Mubix. This post module
    performs all of these functions for us.


    Let''s see how it works:


    +   1. We need to start with an active remote session with ''system'' level privileges.

    2. Bypass UAC and run "***getsystem***". Make sure you are system level:


