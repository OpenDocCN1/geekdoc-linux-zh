    Now type-in a fake message, preferably one that will entice our target to click
    on a malicious link, surf to a malicious webpage, or run the program that we sent
    them (if we did attach one). In actual defense practice this could just be a test
    webpage that records the IP address of those who were tricked to surf to the page.
    That way as a security team we know who in our organization needs to be better
    educated on the risks of malicious e-mails.'
