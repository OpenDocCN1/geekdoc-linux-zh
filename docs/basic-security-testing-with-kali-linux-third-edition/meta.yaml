- img_proc: false
  md: 'hour until someone showed up. One time I saw a major company prop their secure
    server room door open with cabling boxes and leave it unsupervised while they
    took their hour lunch.


    I was told by a retired Special Forces operator that in a business environment,
    if you are armed with a tie and a clipboard, no one will stop you. And he was
    right. Out of my 20 years of doing onsite server and IT support involving banks,
    government facilities, research centers and large corporations - once inside the
    building, I was stopped and asked to verify my Identification only three times!
    Physical security is very important, but what are some ways an attacker might
    use to compromise a machine that they have access to? In this section we will
    look at one possible technique called the "Utilman Bypass". We will use a Kali
    Live CD, along with Mimikatz to create a very powerful combination.


    # Utilman Login Bypass


    Okay this technique is really old, and not technically an attack. It originated
    from an old Microsoft TechNet Active Directory support forum. This technique,
    called the *"Utilman Bypass"*, was one technique recommended to log into a Windows
    server in case you forgot the password. The Utilman bypass works by manipulating
    a helpful windows function that is available at the login prompt. It allows a
    system level command session to open without using credentials. I have friends
    who support large networks that tell me that they still use this technique for
    legitimate purposes. For example, when old corporate stand-alone systems need
    to be backed up and re-purposed and no one can remember the passwords, they will
    use this technique.


    > **Warning:**


    *If you do something wrong in this procedure you could render your Windows system
    unbootable. Ye have been warned.*


    For this exercise, we will boot from the disk and change the Windows "Utilman"
    program, so when the "Windows" + "u" keys are pressed, a command prompt will open
    instead of the normal utility menu. We will work through this process step-by-step.
    To perform this procedure in real life, you would need a (Kali) Linux boot disk
    or bootable Linux USB drive. For our lab I just downloaded the 64-bit Kali Linux
    ISO and set the **Windows 7 VM** to boot from it.


    As seen below:'
