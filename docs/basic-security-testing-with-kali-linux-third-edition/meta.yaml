    # **Service Poisoning with MITMf**


    MITMf is a great tool, but one thing we didn''t cover in the previous chapter
    is that it actually includes Responder! Responder integration allows for LLMNR,
    NBT-NS, and MDNS poisoning along with WPAD support directly in MITMf. So, let''s
    see how to perform basic service poisoning and credential harvesting with MITMf.


    At a terminal prompt:


    Enter, ***"mitmf -i eth0 --responder --wredir --nbtns --basic"***


    And that is it, MITMf starts with responder support:


    ![](bbox=[0.189, 0.458, 0.876, 0.592])


    On the Windows 7 system, if you try to surf to a non-existent UNC path or open
    an internet browser (if auto-detect proxy is still set) you should get a login
    prompt:


    ![](bbox=[0.281, 0.673, 0.687, 0.847])


    If the target enters credentials, you should get them in plain text. You will
    also get a copy of the user''s password hash. The data will be in the *"/usr/share/mitmf/logs"*
    directory.


    If we look in the ''*mitmf.log*'' file we should see something like this:'
