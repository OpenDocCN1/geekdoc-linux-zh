    You can then open the .wav file on your Kali system to listen to it. It is true
    that this only gives you a limited amount of recording time, but this should be
    an eye opener especially for companies that operate in a secured or classified
    environment. Several years ago, I wrote an article that demonstrated how you could
    recover audio remotely from a target system and then using a script by "Sinn3r"
