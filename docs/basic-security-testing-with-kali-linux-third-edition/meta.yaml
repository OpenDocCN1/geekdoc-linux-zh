    \ 식별할 수 있다.\n\n# 본 강의의 소개\n\n이번 강의에서는 한국어 문장의 종류와 문장 성분에 대해 학습합니다.\n\n+   - 먼저,\
    \ 문장의 다양한 분류 기준에 대해 알아봅니다.\n  - 문장은 기능과 구조에 따라 여러 종류로 나뉩니다.\n- 다음으로, 문장을 구성하는\
    \ 성분들에 대해 학습합니다.\n  - 문장 성분의 종류와 그 역할을 이해합니다.\n- 마지막으로, 실제 예문을 통해 학습한 내용을 확인합니다.\n\
    \  - 다양한 예문을 분석하며 지식을 적용해 봅니다.\n\n# 다음 강의预告\n\n다음 강의에서는 문장 성분의 세부적인 역할과 실제 분석\
    \ 방법에 대해 자세히 다룰 예정입니다."
