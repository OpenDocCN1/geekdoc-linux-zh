  md: '# Chapter 4

    # Reconnaissance with Recon-NG


    The first step performed by both professional penetration testers and hackers
    alike is information gathering. They want to learn as much about their target
    as possible, to make their task easier. So, let''s begin this journey by looking
    at reconnaissance tools. There are several tools in Kali Linux to aid in information
    gathering & reconnaissance. Maltego is a very popular tool, one that is covered
    quite a bit in security books and training seminars. As it already has a lot of
    coverage, I figured we would look at some of the other tools included in Kali.
    In this chapter we will take a close look at ''Recon-NG'' and in the next chapter
    we will cover ''Shodan''. The last chapter in this section will cover several
    additional recon tools.


    # ## Recon-NG


    **Tool Author:** Tim Tomes (LaNMaSteR53)

    **Tool Website:** https://bitbucket.org/LaNMaSteR53/recon-ng

    **Tool Usage Guide:** https://bitbucket.org/LaNMaSteR53/recon-ng/wiki/Usage%20Guide


    The Recon-NG Framework is a powerful tool that allows you to perform automated
    information gathering and network reconnaissance. Recon-NG automates a lot of
    the steps that are taken in the initial process of a penetration test. You can
    automatically hit numerous websites to gather passive information on your target
    and even actively probe the target itself for data. It has numerous features that
    allow you to collect user information for social engineering attacks, and network
    modules for network mapping and much more.


    Think of Recon-NG as Metasploit for information collection. Basically, you can
    use Recon-NG to gather info on your target, and then commence your attack. Anyone
    who is familiar with Metasploit will feel right at home, as the interface was
    made to have a comparable look and feel. The command usage and process flow are
    also very similar.'
  merge: -1
  pgno: 49
- img_proc: false
  md: '# *Using Recon-NG*


    You can start Recon-NG by selecting it from the **Applications > Information Gathering**
    menu, or from the command line:


    +   - Open a terminal window by clicking on the "**Terminal**" icon on the quick
    start bar

    - Type, "**recon-ng**":


    ![](bbox=[0.171, 0.288, 0.748, 0.554])


    Type, "*help*" to bring up a list of commands:


    ```

    [recon-ng][default] > help


    Commands (type [help|?] <topic>):

    ---------------------------------

    add          Adds records to the database

    back         Exits the current context

    delete       Deletes records from the database

    exit         Exits the framework

    help         Displays this menu

    keys         Manages framework API keys

    load         Loads specified module

    pdb          Starts a Python Debugger session

    query        Queries the database

    record       Records commands to a resource file

    reload       Reloads all modules

    resource     Executes commands from a resource file

    search       Searches available modules

    set          Sets module options

    shell        Executes shell commands

    show         Shows various framework items

    snapshots    Manages workspace snapshots

    spool        Spools output to a file

    unset        Unsets module options

    use          Loads specified module

    workspaces   Manages workspaces

    ```


    Now type, "*show modules*" to display a list of available modules:'
  merge: -1
  pgno: 50
- img_proc: false
  md: '![](bbox=[0.166, 0.015, 0.601, 0.323])


    Modules are used to actually perform the recon process. As you can see there are
    several types of modules available. Go ahead and read down through the list. Some
    are passive; they never touch the target network, while some directly probe and
    can even attack the system.


    The basic layout is:


    ![](bbox=[0.298, 0.495, 0.699, 0.595])


    +   1. **Module Type**: *Recon* - This is a reconnaissance module.

    2. **Conversion Action**: *Domains-hosts* - Converts data from "Domains" to "hostnames".

    3. **Vehicle used to perform Action**: *Google_Site_Web* - Google is used to perform
    the search.


    From this module name we can see that it is a recon module that uses Google ''
    s web site search to convert Domain Names to individual Hosts attached to that
    domain. When you have found a module that you would like to try, the process is
    fairly straight forward:


    +   - Type, "***use [Module Name]***" to use the module

    - Type, "***show info***" to view information about the module

    - And then, "***show options***" to see what variables can be set

    - Set the option variables with "***set [variable]***"'
  merge: -1
  pgno: 51
- img_proc: false
  md: 'Finally, type "***run***" to execute the module


    > **Note:**


    **SOURCE Variable** - For a single target you will most often enter the target
    URL or an individual e-mail address. You could also enter a filename containing
    multiple variables or use a database query as source input. We will only cover
    using a single string input for the SOURCE variable, but other options exist.


    # Recon-NG Database Usage


    A lot of Database support has been added to Recon-NG since earlier versions. You
    use regular database commands to manipulate the databases, multiple commands have
    been added to make this task much easier.


    > **Note:**


    For a complete explanation of the new database features, see the video, "***Recon-ng
    - Update Review (6/23/14)***" by the tool''s author:


    https://www.youtube.com/watch?v=VevMPCkd6aM


    # *Show Command*


    The "**show**" command is used to show tables and data from the database.


    For Example:


    +   - ***show schema*** – Lists tables in the database

    - ***show companies*** – Lists the ''companies'' table in the database

    - ***show hosts*** – Lists the ''hosts'' table in the database


    ![](bbox=[0.165, 0.751, 0.434, 0.924])'
  merge: -1
  pgno: 52
- img_proc: false
  md: 'You can use normal database commands (*Select * from [table], etc.*) to interact
    directly with the database, but it is much simpler for newer users to simply use
    the show command.


    # **Workspaces Command**


    The "workspaces" command allows you to keep your work separated by creating separate
    databases for recon sessions. You can create multiple databases and then simply
    jump between them at will using the workspaces command:


    ```

    [recon-ng][default] > workspaces

    Manages workspaces


    Usage: workspaces [list|add|select|delete]

    ```


    For example, let''s create a workspace called "test":


    Enter, "**workspaces add test**"


    ```

    [recon-ng][default] > workspaces add test

    [recon-ng][test] >

    ```


    In the current version you will see a lot of red warning messages about keys not
    being set - this simply means that API keys have not been entered for a particular
    web API and are not available at the moment, more on this later. Notice that the
    Workspace is created and we are automatically set to use the "test" database as
    shown by the prompt change. Any data recovered from running recon modules now
    will be stored in the "test" database. We can always jump to another workspace
    by using the workspaces select command.


    For example, let''s go back to the "default" workspace:


    Enter, "**workspaces select default**"


    ```

    [recon-ng][test] > workspaces select default

    [recon-ng][default] >

    ```


    And we are now back using the default workspace. Data recovered by running modules
    will now be stored in the default workspace database. Okay enough overview; let''s
    see Recon-NG in action. Let''s begin by detecting host names using the Netcraft
    search module.


    # Detecting Host Names Using Netcraft


    One tactic used to passively probe network structure is to use search engines
    to enumerate site sub-domains. You know that there will be a main domain like
    *"some_target_name.com"* but what other subdomains are out there? You can use
    Google to search for subdomains using the "**site:**" and "**inurl:**" switches.
    Then remove sub-domains *(-inurl)* that you find, so other subdomains will appear.
    This can take a while to do by hand and can require a lot of typing if the'
  merge: -1
  pgno: 53
- img_proc: false
  md: "target has a large number of sub-domains. Recon-NG will do this for you automatically\
    \ and record what it finds in its database. You can also use website tool services\
    \ like Netcraft to discover this information.\n\nLet's try this using the Netcraft\
    \ search module:\n\nChange to the \"test\" workspace, enter \"**workspaces select\
    \ test**\"\n\nType, \"**use recon/domains-hosts/netcraft**\"\n\nAnd then, \"**show\
    \ options**\" to see what the module requires:\n\n```\n[recon-ng][test] > use\
    \ recon/domains-hosts/netcraft\n[recon-ng][test][netcraft] > show options\n\n\
    \  Name          Current Value  Required  Description\n  ----          -------------\
    \  --------  -----------\n  SOURCE        default        yes       source of input\
    \ (see 'show info'\n\n[recon-ng][test][netcraft] >\n```\n\nFollowing the Recon-NG\
    \ module layout, this module will turn a domain name into hosts *(domains-hosts)*.\
    \ We only need to supply the target domain name by setting the SOURCE variable.\n\
    \nJust type, \"**set SOURCE [Target Website]**\"\n\nThen enter, \"**run**\"\n\n\
    ```\n[recon-ng][test][netcraft] > set SOURCE cyberarms.wordpress.com\nSOURCE =>\
    \ cyberarms.wordpress.com\n[recon-ng][test][netcraft] > run\n```\n\nThe module\
    \ will then reach out to Netcraft and query for any host subdomains. I use my\
    \ website name (cyberarms.wordpress.com) in the fictional example below. As a\
    \ WordPress hosted site, no subdomains are recorded in Netcraft. If it were a\
    \ website with subdomains you would see returns like the following:\n\n```\n[*]\
    \ URL: http://searchdns.netcraft.com/?{'host': 'cyberarms.wordpress.com'}\n[*]\
    \ [host] cyberarms.wordpress.com\n[*] [host] secret.cyberarms.wordpress.com\n\
    [*] [host] store.cyberarms.wordpress.com\n[*] Sleeping to avoid lockout...\n[*]\
    \ URL: http://searchdns.netcraft.com/?{'host': 'cyberarms.wordpress.com'}\n[*]\
    \ [host] developers.cyberarms.wordpress.com\n[*] [host] secure.cyberarms.wordpress.com\n\
    [*] [host] cloud.cyberarms.wordpress.com\n[*] Sleeping to avoid lockout...\n```"
  merge: -1
  pgno: 54
- img_proc: false
  md: "that would take a long time to try to enumerate through manual methods.\n\n\
    When finished, type \"**show hosts**\" to display all the hosts discovered. These\
    \ will be recorded in the 'Hosts' table in the database. You can also create a\
    \ report to view the data collected.\n\n> Just type in \"***back***\" to get out\
    \ of the current module\nThen \"***show modules***\" again\n\nNotice the \"Reporting\"\
    \ section:\n\n```\nReporting\n--------\n  reporting/csv\n  reporting/html\n  reporting/json\n\
    \  reporting/list\n  reporting/proxifier\n  reporting/pushpin\n  reporting/xlsx\n\
    \  reporting/xml\n```\n\nSimply use one of these modules to automatically create\
    \ a nice report of the data that you have obtained. For example, to take recovered\
    \ data and turn it into a comma separated values (csv) file:\n\n> Enter, \"***use\
    \ reporting/csv***\"\nAnd then type \"***run***\":\n\n```\n[recon-ng][test] >\
    \ use reporting/csv\n[recon-ng][test][csv] > run\n[*] 206 records added to '/root/.recon-ng/workspaces/test/results.csv'\n\
    [recon-ng][test][csv] >\n```\n\nAll the files will be stored in the \"***/root/.recon-ng/workspaces/[Database\
    \ Name]***\" directory. Note that this is a hidden directory (.recon-ng). But\
    \ if you navigate to the directory you will see the resultant *\"results.csv\"\
    * file:\n\n```\nroot@kali:~# cd /root/.recon-ng/workspaces/test\nroot@kali:~/.recon-ng/workspaces/test#\
    \ ls\nconfig.dat  data.db  results.csv\n```\n\nThe file can then be viewed with\
    \ the \"**cat**\" command or loaded into your favorite spreadsheet program to\
    \ view the recovered hosts. The information found can help you map out your target\
    \ and might provide interesting hosts that you may want to focus your efforts\
    \ on."
