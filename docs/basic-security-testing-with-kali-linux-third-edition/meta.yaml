  md: '# Chapter 7

    # Introduction to Metasploit


    We will start our journey by learning about the Metasploit Framework. Metasploit
    (Metasploit Pro) is a very comprehensive and feature rich security testing platform.
    Metasploit gives you a complete framework, or playground for security testing.
    The Metasploit Framework (MSF) is a complete platform for performing vulnerability
    testing and exploitation. It is loaded with well over a thousand exploits, hundreds
    of payloads and multiple encoders.


    In this chapter, we will cover the basics of using Metasploit. In a later chapter
    we delve deeper into how to use Metasploit against a test target. This chapter
    will mostly be a walkthrough of how to use Metasploit, so don''t worry if you
    don''t understand everything. We will cover the process in greater detail later.
    This chapter is more of an introduction to the process and flow of Metasploit.
    If you are already familiar with using Metasploit then feel free to skip this
    chapter or use it as a refresher.


    # ## Updating Metasploit


    Normally to update Metasploit, you simply run "*msfupdate*", but since Kali was
    updated to the "Rolling" version the Metasploit updates are supposed to be synced
    to update weekly with Kali. So, you may not have the latest Metasploit capabilities
    as soon as they are released, but this ensures the best compatibility with the
    Kali Linux platform.


    # ## Metasploit Overview


    You can start Metasploit a couple of different ways, from the menu or from a terminal
    prompt.


    ''**Favorites**'' in the Applications menu.


    ''**08 - Exploitation Tools**'' in the Applications menu.


    Or by just typing "*msfconsole*" in a terminal'
  merge: -1
  pgno: 96
- img_proc: false
  md: 'But the ***easiest way*** is to just click the Metasploit Framework button
    on the Quick Launch bar:


    ![](bbox=[0.18, 0.142, 0.425, 0.341])


    Starting MSF from the quick launch bar ensures that the database server is running
    and creates the necessary databases if needed. It then starts Metasploit. Once
    Metasploit loads, you will see the title screen and be given an "***msf >***"
    prompt:


    ![](bbox=[0.16, 0.498, 0.73, 0.874])


    Notice the "Missile Command" banner screen above the msf prompt. Metasploit contains
    several of these cool screens and one is displayed at random on'
  merge: -1
  pgno: 97
- img_proc: false
  md: 'startup. You can check out the different display banners by typing "*banner*"
    at the prompt. Some of them are very good:


    ![](bbox=[0.298, 0.198, 0.703, 0.628])


    Metasploit can be a little confusing if you have never used it before, but once
    you get used to how it works, you can do some amazing things with it.


    Basically, using Metasploit to attack a target system usually involves the following
    steps:


    +   1. Picking an Exploit

    2. Setting Exploit Options

    3. Picking a Payload

    4. Setting Payload Options

    5. Running the Exploit

    6. Connecting to the Remote System

    7. Performing Post Exploitation Processes


    The screenshot below shows an example of this process, but don''t worry; we will
    cover the process in much more detail as we go along.'
  merge: -1
  pgno: 98
- img_proc: false
  md: '![](bbox=[0.13, 0.135, 0.86, 0.27])


    Depending on the type of exploit used, once it is complete we will normally end
    up with either a **Remote shell** to the computer or a **Meterpreter shell**.
    A remote shell is basically a remote terminal connection or a text version of
    a remote desktop for Windows users. It allows us to enter commands as if we are
    sitting at the keyboard. But a Meterpreter shell offers a lot of interesting programs
    and utilities that we can run to gather information about the target machine,
    control devices like the webcam and microphone, or even use this foothold to get
    further access into the network. Of course, if needed, you can always drop to
    a regular shell at any time.


    In most cases, depending on what you are trying to do, a Meterpreter Shell is
    much more advantageous than just a regular shell. We will discuss the Meterpreter
    Shell in depth later, but for now let''s quickly cover the first five steps.


    > **Note:**


    *When all else fails and you start to feel lost in Metasploit, or the Meterpreter
    shell, try typing the "**help**" command.*


    *You can also use the "Tab" key to autocomplete a line or hit it twice to show
    all available exploits or payloads.*


    *Example: **show exploits <tab><tab>***


    # 1 - Picking an Exploit


    The first thing we need to do is pick an exploit to use. Metasploit contains over
    1700 exploits, with more being added frequently. If you want to view all the exploits,
    just type "**show exploits**" from the msf prompt:


    ```

    msf > show exploits

    ```'
