    > ***Applications > 14-System Services > Xplico Stop***


    # Conclusion


    In the first part of this chapter we covered how to use the Man-in-the-Middle
    attack program Arpspoof. We also used Urlsnarf and Driftnet to see what websites
    a targeted system was viewing. In the second part, we explored turning an exploited
    system into a remote packet sniffer using Meterpreter. We then analyzed the captured
    traffic in Xplico. This is an easy way to view anything the target system is doing
    that isn''t encrypted. In the next chapter we will take a look at performing automated
    MitM attacks with the "Man-in-the-Middle Framework".'
