  md: '# # Chapter 14

    # Man-in-the-Middle Framework & BeEF


    # ## Man-in-the-Middle Framework


    **Tool Author**: byt3bl33d3r


    **Tool Website**: [https://github.com/byt3bl33d3r/MITMf](https://github.com/byt3bl33d3r/MITMf)


    The Man-in-the-Middle Framework (MITMf) is a feature rich Man-in-the-Middle mega
    tool. It is basically an end-all, be-all tool that replaces many other MitM programs.
    According to the author''s website, it contains built-in SMB, HTTP & DNS servers,
    and can perform SSLStrip and partial HSTS bypass. The tool can capture FTP, IRC,
    POP, IMAP, Telnet, SMTP, SNMP community strings, NTLMv1/v2 and Kerberos credentials.
    There are a lot of attack options (called plugins) available in MITMf, we will
    only be covering a few of them. We will use our Windows 7 VM as a target in this
    chapter, but this also works well with mobile devices connected to the local network
    via Wi-Fi. This is covered in my "Security Testing with Kali NetHunter" book.


    > **Warning:**


    *As with all security tools, make sure you understand the complete ramifications
    of using the tool (especially one that modifies network services traffic) before
    ever attempting to use it in a live production environment!*


    # ## Installing MITMf


    Complete install instructions are available on the tool author''s website. There
    are several steps but as the tool is in the Kali repositories, we can complete
    the entire install by using the "apt install" command as seen below:


    ```

    apt install mitmf

    ```'
  merge: -1
  pgno: 196
- img_proc: false
  md: '![](bbox=[0.146, 0.036, 0.707, 0.215])


    This installs the MITMf will all the necessary dependencies. It can then be run
    from a Terminal prompt.


    To view the help file, just use ***"mitmf --help"***


    ![](bbox=[0.181, 0.337, 0.61, 0.546])


    All the plugin options for mitmf are listed on the help screen. These plugin-ins,
    with definitions from the tool author''s website[^1] include:


    **JSkeylogger**: Injects a JavaScript keylogger into a client''s webpages


    **BrowserProfiler**: Attempts to enumerate all browser plugins of connected clients


    **FilePWN**: Backdoor executables sent over HTTP using the Backdoor Factory and
    BDFProxy


    **BeEFAutorun**: Autoruns BeEF modules based on a client''s OS or browser type


    **SMBAuth**: Evoke SMB challenge-response authentication attempts


    **SSLstrip+**: Partially bypass HSTS


    **Upsidedownternet**: Flips images 180 degrees


    **ScreenShotter**: Uses HTML5 Canvas to render an accurate screenshot of a client''s
    browser


    To run MITMf, basically you decide what plugins that you want, and then use the
    corresponding command line switches to start the attack. What is nice about the'
