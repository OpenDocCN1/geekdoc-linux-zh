  md: "![](bbox=[0.128, 0.038, 0.892, 0.379])\n\nWhen you click on an individual Pushpin\
    \ it reveals data returned from the search. Depending on the Pushpin module that\
    \ you used, this could be a picture that a user took, a location, or in the case\
    \ of the Shodan search, an online system. In the picture above, there are obviously\
    \ more online systems than the handful displayed above. Trying to find individual\
    \ online systems by physical location is not very accurate to say the least (usually\
    \ the ISP location is returned, not the actual computer), but these are the ones\
    \ that have matching Shodan latitude & longitude records within 1 mile of our\
    \ target.\n\nI recommend the reader check out the different Pushpin modules. As\
    \ mentioned earlier, Pushpins are both pretty cool and pretty creepy at the same\
    \ time. The different modules, especially the Social Media modules, could be very\
    \ valuable to a Social Engineer, someone doing Red Team assessments or pentesting.\n\
    \n# Deleting Table Records\n\nAs you use Recon-NG the databases fill up with information\
    \ pretty quickly. Deleting table records is pretty simple.\n\nType \"*show [Table\
    \ Name]*\" to view the table:\n\n```\n[recon-ng][test2] > show locations\n\n \
    \   +---------+---------------+----------------+---------------------+--------------+\n\
    \    | rowid   | latitude      | longitude      | street_address      | module\
    \       |\n    +---------+---------------+----------------+---------------------+--------------+\n\
    \    | 1       | 40.7524961    | -73.9773022    | 89 E 42nd street    | user_defined\
    \ |\n    | 2       | 40.7528998    | -73.9773096    | 89 E 42nd street    | geocode\
    \      |\n    +---------+---------------+----------------+---------------------+--------------+\n\
    ```"
  merge: -1
  pgno: 62
- img_proc: false
  md: 'And then type, ***"delete [Table Name]"***


    Finally enter the row ID numbers that you want removed:


    ```

    [recon-ng][test2] > show locations


    +----+-----------+------------+---------------------+---------------+

    | rowid |  latitude  |  longitude  |     street_address     |     module     |

    +----+-----------+------------+---------------------+---------------+

    | 1     | 40.7524961 | -73.9773022 | 89 E 42nd street      | user_defined   |

    | 2     | 40.7528998 | -73.9773096 | 89 E 42nd street      | geocode        |

    +----+-----------+------------+---------------------+---------------+


    [*] 2 rows returned

    [recon-ng][test2] > delete locations

    rowid(s) (INT): 1-2

    [recon-ng][test2] > show locations

    [*] No data returned.

    ```


    In the picture above, I entered the rowids "***1-2***" to remove records 1 & 2
    from the table.


    You could also type ***"delete [Table Name] [RowIDs]"***, as seen below:


    ```

    [recon-ng][test2] > show locations


    +----+-----------+------------+---------------------+---------------+

    | rowid |  latitude  |  longitude  |     street_address     |     module     |

    +----+-----------+------------+---------------------+---------------+

    | 1     | 40.7524961 | -73.9773022 | 89 E 42nd street      | user_defined   |

    | 2     | 40.7524961 | -73.9773022 | 89 E 42nd street, ny  | user_defined   |

    +----+-----------+------------+---------------------+---------------+


    [*] 2 rows returned

    [recon-ng][test2] > delete locations 1-2

    [recon-ng][test2] > show locations

    [*] No data returned.

    ```


    Providing both the Table name and Row IDs allowed me to clear out the table using
    a one-line command.


    # Recon-NG Command Line Interface (Recon-cli)


    Once you get very familiar with using Recon-NG you might want to try using the
    Recon-NG Command Line Interface.  This command allows you run Recon-NG directly
    from the command line using switches instead of working through the framework
    step-by-step.


    To view the help information type, ***"recon-cli -h"***:'
  merge: -1
  pgno: 63
- img_proc: false
  md: '![](bbox=[0.169, 0.049, 0.808, 0.286])


    The switches should be self-explanatory, so I leave this as an option for the
    reader to explore.


    # Conclusion


    As we have seen in this chapter, Recon-NG is an invaluable tool for information
    gathering and reconnaissance. We only covered a few modules in this chapter, but
    there are many others to choose from. The power of Recon-NG is greatly expanded
    when you use API developer keys to perform Web service related searches. For example,
    you can search Twitter for relevant tweets from your target or even check Shodan
    for open systems. Though we just briefly touched on some of the capabilities of
    Recon-NG, it is really an impressive tool that is well worth delving into deeper.
    I highly recommend the reader take some extra time and play around with the different
    modules and features.


    # Resources


    Recon-NG Wiki Page - <https://bitbucket.org/LaNMaSteR53/recon-ng/wiki/Home>


    Recon-NG Update Review Video - <https://www.youtube.com/watch?v=VevMPCkd6aM>'
