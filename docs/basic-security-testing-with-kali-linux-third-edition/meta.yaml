  md: '![](bbox=[0.14, 0.02, 0.86, 0.35])


    Now we have seen how to select an exploit and how to set the options. On most
    exploits we also need to set a payload.


    # Picking a Payload


    What''s the fun of exploiting a machine if you can''t do anything with it? Payloads
    allow you to do something functional with the exploited system. They also provide
    different ways to connect back and forth with the target. Metasploit comes with
    a multitude of different payloads.


    Type, "***show payloads***":


    ![](bbox=[0.14, 0.73, 0.62, 0.985])'
