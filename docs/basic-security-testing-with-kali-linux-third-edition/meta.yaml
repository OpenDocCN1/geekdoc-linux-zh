    # Advanced Recon-NG: Pushpins


    Pushpins are a very informative and sometimes very creepy feature of Recon-NG.
    It allows you to search multiple social media sites for geotagged or location
    tagged media. It then displays all the social media hits that it finds for the
    area that you specify. This capability is thoroughly explained by the tool author''s
    You Tube video:


    "Recon-ng - Pushpin Intro" - [https://www.youtube.com/watch?v=BwopO7dxT98](https://www.youtube.com/watch?v=BwopO7dxT98)


    As such, we will only cover the highlights here. First, we will create and use
    a "test2" database for Pushpins:


    At the recon-ng prompt type, ***"workspaces add test2"***


    Notice the prompt changes reflecting that we are using the test2 database. Now
    we need to set the target area location.


    Enter, ***"add locations"***


    Now, enter past the target''s Latitude and Longitude when prompted (unless you
    know them)


    Then enter your target''s full street address at the ''Street Address'' prompt
    (I used the address for NYC''s Grand Central Station)'
  merge: -1
  pgno: 59
- img_proc: false
  md: "Enter, \"**run**\"\n\nThe geocode module will take the street address and converts\
    \ it to latitude and longitude for us. It then adds this new information to the\
    \ database. This can be seen by typing, \"**show locations**\":\n\n```\n[recon-ng][test][geocode]\
    \ > show locations\n\n  +----+---------------+---------------+-----------------------------+\n\
    \  | id | latitude      | longitude     | street_address              |\n  +----+---------------+---------------+-----------------------------+\n\
    \  | 2  | 40.7524961    | -73.9773022   | 89 E 42nd St, New York, NY |\n  +----+---------------+---------------+-----------------------------+\n\
    ```\n\nNow that we have our location set, let's use the Pushpin modules to begin\
    \ to find data for our target area.\n\nType, \"**search -pushpins**\" to see what\
    \ modules are available:\n\n```\n[recon-ng][test][geocode] > search -pushpins\n\
    [*] Searching for '-pushpins'...\n\nRecon\n-----\n  recon/locations-pushpins/flickr\n\
    \  recon/locations-pushpins/instagram\n  recon/locations-pushpins/picasa\n  recon/locations-pushpins/shodan\n\
    \  recon/locations-pushpins/twitter\n  recon/locations-pushpins/youtube\n```\n\
    \n*You will need an API code to use any of the Pushpins modules except Picasa.\
    \ Though Picasa is still shown in the modules list, Google has shut down this\
    \ photo service as of March 2016.*\n\nPushpins work like any other module:\n\n\
    Type, \"**load recon/locations-pushpins/[module]**\"\nAnd then enter, \"**run**\"\
    \n\nThe screenshot below shows the \"Shodan\" module running:\n\n```\n[recon-ng][test2][shodan]\
    \ > run\n\n--------------\n40.7524961,-73.9773022\n\n[*] Searching Shodan API\
    \ for: geo:40.7524961,-73.9773022,1\n[*]   Latitude: 40.7584\n[*]   Longitude:\
    \ -73.9794\n```\n\nWhen the module runs, all data at the location coordinates\
    \ will be entered in the recon-ng database.\n\nWhen the module is done running,\
    \ type \"**show dashboard**\":"
