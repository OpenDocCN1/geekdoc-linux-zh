  md: '# System Commands


    Let''s take a quick look at the System Commands. We won''t cover them all, but
    again, it is good to read through the list to get familiarized with them:


    ![](bbox=[0.194, 0.201, 0.793, 0.515])


    **clearev** – This useful little command will attempt to clear the logs on the
    remote computer.


    We may want to erase our tracks and clear the system logs on the target machine.
    On the Windows 7 system, if we open event viewer and look at the logs, we can
    see that it is full of events:


    ![](bbox=[0.165, 0.698, 0.824, 0.887])


    Some of those events may include things that we, as the "attacker", performed.
    We can clear the log files with the *"clearev"* command. There is a catch though,
    if we try to run this command without an elevated account (more on how to do this
    later) we will get an error and the command will fail:'
  merge: -1
  pgno: 125
- img_proc: false
  md: '```

    meterpreter > clearev

    [*] Wiping 1369 records from Application...

    [-] stdapi_sys_eventlog_clear: Operation failed: Access is denied.

    ```


    If we do have an elevated session "clearev" will successfully wipe the logs, as
    shown below:


    ```

    meterpreter > clearev

    [*] Wiping 2578 records from Application...

    [*] Wiping 7033 records from System...

    [*] Wiping 2512 records from Security...

    meterpreter >

    ```


    The Application, System and Security logs are wiped of all records. If we look
    at the security log again it just shows one new record, "Log Clear":


    ![](bbox=[0.182, 0.343, 0.793, 0.413])


    Now obviously this will stick out like a sore thumb to anyone analyzing the logs.
    But if there are events that you want removed, this is one way it can be accomplished,
    if you have sufficient access rights.


    # GETPID & PS COMMANDS


    – As you use Meterpreter, two of the commands that you will use somewhat frequently
    are *getpid* and *ps*.


    +   - getpid - Lists what process ID your shell is running on

    - ps - Lists all processes running on the remote system


    If you have an active meterpreter session and type "***getpid***", you will see
    something like this:


    ```

    meterpreter > getpid

    Current pid: 2260

    ```


    This is the Process ID number (number will vary) that our shell is using. You
    can use the "***ps***" command to see all active processes on the target system:'
  merge: -1
  pgno: 126
- img_proc: false
  md: '![](bbox=[0.142, 0.025, 0.612, 0.318])


    If we go further down the list, looking for our PID number of 2260 we see this:


    ```

    2260 2180 powershell.exe x86 1  WIN-42ORBM3SRVF\Dan  C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe

    ```


    This shows that we are running under a ''powershell.exe'' process as the user
    ''*Dan*''. This information comes in handy when we want to "*migrate*" out of
    this low-level process and into a process with a higher-level access. We can move
    our shell off of this process to a higher access process or one that may be more
    stable using the migrate command. Migrating also allows us to merge and hide our
    shell into another more common process, in essence hiding our connection. *Explorer.exe*
    is one of the more common processes to migrate to.


    Simply find the PID# of the process you want to use (2336 on our system) and type,
    "*migrate <PID#>*" as seen below:


    ![](bbox=[0.19, 0.673, 0.692, 0.776])


    We will talk about migrating and some of the other Meterpreter commands more in
    later sections. For now, let''s talk about screenshots and using the remote webcam!


    > **Note:**


    *Capturing USB webcams and the microphone through Virtual Machines is a bit of
    a hit or miss proposition. You will have mixed results. For some of the screenshots
    in this section I used a Windows 7 laptop as a target.*'
