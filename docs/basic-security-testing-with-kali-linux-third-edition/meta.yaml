    I included msfadmin as I believe it used to be included in the dictionary files.
    And if you remember, we already found it when we looked at the telnet server in
    the Metasploit chapter:


    ![](bbox=[0.183, 0.625, 0.808, 0.812])


    Now, to use Hydra to attack the SSH service with our newly discovered passwords:


    From the desktop directory enter, "***hydra -L Users -P Passwords 192.168.1.68
    ssh***"'
  merge: -1
