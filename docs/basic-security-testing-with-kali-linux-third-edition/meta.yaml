  md: '# Determining Hash Type & Cracking LM Passwords


    Computer operating systems and applications normally store passwords in an encrypted
    form called a password hash. The hash is a cryptographic representation of the
    actual password. Therefore, the hash will need be to be unencrypted or cracked
    to find the true password. Surprisingly, some services store or transmit passwords
    in plain text! We will talk about that a little bit later in the Mimikatz chapter.
    But for the most part during security tests, when you recover a user''s password
    it will be in the encrypted hash form.


    There are many different types of encryption used when creating hashes. In this
    chapter we will first talk about determining what type of hash you may have recovered.
    Then we will talk about the simple (and outdated) Microsoft LM password hash and
    see how these can be cracked online. We will cover password cracking with cracking
    tools in greater depth in an upcoming chapter.


    # Not sure what Kind of Hash you have?


    There are several different types of hashes that you will run into when you start
    cracking passwords. Some of the most confusing ones are the Windows hashes. Let''s
    try to explain these really quick.


    +   - **LM Hash** – Outdated password hash that goes back to the old Lan Manager
    days. LM hashes are no longer stored by default, but you might still find them
    creeping about.

    - **NTLM Hash** – Comprised of the LM hash and NT Hash (NTHash), separated by
    a colon. This is what you will find when you dump passwords from a Windows SAM
    Database or a Domain Controller''s database. NTLM Hashes can be passed in "Pass
    the Hash" type attacks.

    - **NTLMv1 or NTLMv2** – These are challenge response hashes, NTLMv2 is more secure.
    You will capture these hashes when you use a program like Responder. You can use
    these hashes in relay attacks like we saw in the Responder chapter, though you
    can''t relay a hash back to the source machine, it has to be a different system.
    You can disable the weaker NTLMv1 hashes but you will need to see if this is a
    viable solution in your network, especially if you have legacy systems.'
  merge: -1
  pgno: 250
- img_proc: false
  md: 'To make matters more confusing NTLMv1/ v2 hashes are also called Net-NTLMv1
    or Net-NTLMv2. We will talk about all of these more as we go through this section.


    Sometimes you might be able to retrieve a password hash, say from a database or
    software app, but might not be able to determine what type it is by first glance.
    You need to know the correct type so you can tell the cracking program what decryption
    algorithm to attempt. There are a couple hash identification programs in Kali
    that will try to identify the type of hash that you provide:


    **"Hash-identifier"** and **"Hash ID"**


    We will take a quick look at each program.


    # **Hash-Identifier**


    Simply run Hash ID and input the Hash. The program will check it and return the
    most likely types of hash it could be along with least likely types.


    Open a terminal prompt in Kali


    Type, **"hash-identifier"**


    Paste in the LM hash below and Hash Identifier will try to determine what type
    it is:


    **"8846f7eaee8fb117ad06bddd830b7586c"**


    As seen below:


    ![](bbox=[0.176, 0.64, 0.82, 0.82])


    HashID returns the most likely used encryption, and then multiple "Least Possible"
    encryption types. When finished, use **(Ctrl-c)** to exit out of Hash-Identifier.


    # **Hash ID**


    Hash ID is a very similar program:


    At a terminal, enter, **"hashid"**'
  merge: -1
  pgno: 251
- img_proc: false
  md: 'You are greeted with just a blank line. Enter the hash to crack and hit enter:


    ![](bbox=[0.171, 0.115, 0.617, 0.275])


    Multiple possible hash types are listed. Again, hit **(Ctrl-c)** to exit. I am
    not entirely sure of the difference between these two programs, but Hash-Identifier
    seemed slightly more helpful. When you try to use the hash in a standard cracking
    program like Hashcat or John the Ripper more often than not it will tell you if
    you have the wrong hash type selected and may also recommend the correct type.
    As we used a LM hash in the examples above, let''s talk a little bit about cracking
    them.


    # Cracking Simple LM Hashes


    Many Windows XP systems used Lan Manager (LM) hashes to protect their passwords.
    This is a very old and outdated way to store password hashes. This hashing process
    was created for systems before Windows NT. Believe it or not, you can still find
    LM Hashes used in modern networks today. In this chapter we will look at cracking
    these simple LM (and some NTLM) hashes.


    Microsoft''s support for Windows XP ended in 2014. As of 2018, surprisingly enough
    around 6% of the world''s computer systems are still running it! That is almost
    as many as all the Mac OS systems and about three times more than deployed Linux
    desktops. XP is still holding on at the number four spot for desktop operating
    systems just barely behind Windows 8.1, with Windows 7 still in first place. Shockingly
    what this means is that there are still a large number of Windows XP systems that
    could be in business-critical positions.'
  merge: -1
  pgno: 252
- img_proc: false
  md: '![](bbox=[0.22, 0.06, 0.78, 0.32])


    Source: NetMarketShare 2018-06


    There are several different ways that computers encrypt their passwords. One of
    the most secure ways includes "Salting" the password. Basically, this means to
    use a number or string (called a Salt) and incorporate that into the hashing process
    to ensure that no two password hashes are ever the same. If a salt isn''t used
    (like on Microsoft NTLM hashes), if you can crack one hash, all the users that
    used the same password will have the same hash. So, all you need to do is take
    the hash and compare it to known hashes and if you get a match, you have the password.


    Basically, on a system using LM hashes, any password that is fourteen characters
    or less is converted into all uppercase, and then broken into two 7-character
    passwords. Each half is then encrypted and combined to form the final hash. Cracking
    7-character passwords using only uppercase letters is trivial, this is why LM
    hashes are not very secure. Again, there is no salt used, so basically if you
    can get the LM hashes from a system, all you need to do is a look up table comparison
    to other known hashes and you can get the actual password. The LM hash is usually
    stored along with the better encrypted NT hash. The combination of the two hashes
    is called an NTLM hash. One odd caveat with Windows NTLM hashes is that if the
    password is greater than 14 characters, the LM hash is not used at all and the
    contents of the LM hash will be invalid. Storing the weak LM hash can also be
    turned off on Windows systems, which is the case in most newer operating systems.


    A typical Windows NTLM hash looks something like this:'
  merge: -1
  pgno: 253
- img_proc: false
  md: 'ac93c8016d14e75a2e9b76bb9e8c2bb6:8516cd0838d1a4dfd1ac3e8eb9811350


    The LM hash is on the left of the colon and the more secure NT hash is on the
    right. The LM and NT hash combined are called an NTLM hash.


    # Cracking LM/ NTLM Password Hashes Online


    There are several websites that will allow you to input a Windows NTLM hash and
    it will return the password used (if it is in its lookup table). A Swiss security
    company called Objectif Sécurité (creator of Ophcrack) has developed a cracking
    technology that uses rainbow tables on SSD drives. Rainbow Tables are simply large
    database like files that contain hashes and the text equivalent. Crackers that
    use Rainbow Table lookups simply look for the hash you provided to see if it has
    the same hash, if it does, it simply returns the stored text value. It is that
    simple. Objectif Sécurité''s website offers an online interface that cracks many
    LM/NTLM hashes using their rainbow tables in mere seconds.


    *(https://www.objectif-securite.ch/en/ophcrack.php)*


    Let''s try cracking a hash using this online tool. Here is the Administrator password
    hash from an XP machine:


    Hash: aad3b435b51404eeaad3b435b51404ee:31d6cfe0d16ae931b73c59d7e0c089c0


    The website wants the NTHash which is on the right side of the colon. Putting
    this into Objectif''s tool we get this response within one second:


    ![](bbox=[0.282, 0.671, 0.716, 0.765])


    Looks like the Administrator didn''t set a password, that''s not good. Let''s
    try the Hash used in the chapter''s first examples:


    ![](bbox=[0.282, 0.834, 0.716, 0.929])'
