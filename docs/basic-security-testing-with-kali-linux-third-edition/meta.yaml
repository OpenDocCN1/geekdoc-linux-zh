    We set the RHOSTS setting to 192.168.1.68, it scans and returns the version of
    Samba that is running. What if we wanted to scan the entire network for systems
    that are running Samba? This is where the beauty of the RHOSTS command comes into
    play. Instead of just scanning a single host, you can scan for all possible clients
    on the 192.168.1.0 network.


    We use the same exact command, but modify the RHOSTS command:


    > ***set RHOSTS 192.168.1.0/24***


    The scanner defaults to a single concurrent thread, let''s modify that:


    > ***set THREADS 255***


    If you are scanning a local LAN, you can bump this up to 255 to make it go faster,
    or up to 50 if testing a remote network.


    > ***exploit***


    ![](bbox=[0.151, 0.787, 0.849, 0.928])


    Notice now with the modified RHOSTS variable that it scanned all 256 hosts on
    the network. On my test lab it found the Samba running on our Metasploitable2
    machine at 192.168.1.68, it also discovered a Windows 10 Home system with'
