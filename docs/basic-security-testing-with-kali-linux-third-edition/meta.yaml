- img_proc: false
  md: '# **Using a Larger Dictionary File**


    If first you don''t succeed, try a larger dictionary! A larger dictionary file
    provides more known passwords to compare target hashes against. This can crack
    a greater number of hashes, but because of the increased dictionary size can greatly
    increase the time it takes to run. Though I have found it is best to run a large
    dictionary file first and have Hashcat remove any hashes that are recovered. This
    will make the un-cracked file smaller for when you run the more intensive rules
    and masks attacks.


    The website ***Crackstation.net*** has a couple very large wordlists available.
    They have a 15GB monster and a smaller "Human Only" version that is about 700
    MB. The larger wordlist has just about every everything that you can imagine in
    it, the smaller human only version only contains passwords recovered from actual
    password dumps.


    For the next attempt, I went ahead and downloaded the human only wordlist as the
    larger one will not fit without expanding the Kali VM''s hard drive space. Don''t
    bother downloading it just for this example, you will see why in a minute. After
    downloading and expanding the wordlist to the desktop, I ran the following command:


    ```

    ***hashcat -D 1 -m 1000 Hardhash.txt Crackstation-human.txt -o Hardcracked.txt
    --force --remove***

    ```


    Nothing really new to this command line, other than naming a separate output file,
    but I did add the ***"--remove"*** switch. It is not really necessary on such
    a small hash list, but on large lists, once a hash is cracked, it is removed from
    the list to increase cracking time on future attempts.


    And the results:


    ```

    Time.Started.....: Mon Mar 19 12:22:52 2018 (24 secs)

    Time.Estimated...: Mon Mar 19 12:23:16 2018 (0 secs)

    Guess.Base........: File (Crackstation-human.txt)

    Guess.Queue.......: 1/1 (100.00%)

    Speed.Dev.#1.....:  2634.5 kH/s (0.66ms)

    Recovered.........: 0/3 (0.00%) Digests, 0/1 (0.00%) Salts

    ```


    This took about 30 seconds to run. And as you can see it was not able to recover
    anything new. A dictionary attack isn''t always going to be the answer. Even using
    the larger 15 GB Crackstation file only revealed one additional hash:


    d6e0a7e89da72150d1152563f5b89dbe: MyNameIsBob'
  merge: -1
  pgno: 287
- img_proc: false
  md: 'number ($eCuR@d@CCount1) and the last one is very long, almost 30 characters.
    As you can see, the complex password and the very long password held up against
    a simple dictionary attack. The moral of this story, wordlists don''t always work.
    Oh and of course, use complex passwords!


    # **More Advanced Cracking Options**


    Just throwing a dictionary file at a hash list will recover some of the easier
    passwords, but to get the harder ones you need to use more advanced techniques.
    I will not cover them in detail, but Hashcat has several available options including:


    +   1. Attack Types

    2. Rule Sets

    3. Password Masks


    We will take a brief look at each one.


    # **1 - Attack Types**


    The "**-a**" option allows you to designate the type of attack you want to use
    from the following options:


    0 = Straight

    1 = Combination

    3 = Brute-force

    6 = Hybrid Wordlist + Mask

    7 = Hybrid Mask + Wordlist


    <u>Combination</u>: Combines words from separate wordlists to create new words
    on the fly.


    <u>Brute-force</u>: Enter your own combination of characters, numbers & symbols
    to attempt or use Mask attacks to automated guesses. For example: ?u?l?s?d?a (upper,
    lower, symbol, decimal, all) would attempt to crack passwords like, "Aa!0a" to
    "Zz|9z" and everything in-between. You can also use "?b" for binary (00-ff), this
    is useful when cracking foreign language passwords.


    <u>Hybrid Wordlist + Mask</u>: Use a wordlist in combination with brute force
    characters or a pre-defined mask. For example using the Rockyou wordlist with
    the Mask ?u?l?s?d?a would produce hash guess attempts like, "passwordAa!0a" and
    "monkeyZZ|9z".


    # **2 - Rule based attacks**


    Rule based attacks can be very useful. Hashcat has a list of built-in rules that
    you can use to crack passwords. For example, there is a "leet" rule set that'
  merge: -1
  pgno: 288
- img_proc: false
  md: 'automatically takes each dictionary word and tries different leet-speak versions
    of the word, replacing letters with numbers. You can even use a programming type
    language to create your own rulesets.


    ![](bbox=[0.24, 0.135, 0.755, 0.32])


    Rule based attacks are enabled by using the **"-r"** switch and including a name
    of the ruleset you want:


    ![](bbox=[0.155, 0.4, 0.84, 0.49])


    The Best64, InsidePro, Dive, Rockyou-30000 & d3adOne rules are some of the more
    popular ones and are very effective. My best advice for rules is to start with
    the smaller rules files (look at their file size) and then move on to the larger
    ones. The smaller ones usually run fairly quick, the larger ones can take significantly
    longer to run. You can also use multiple dictionaries at once by just listing
    your dictionary folder instead of listing an individual dictionary file name.
    Hashcat will then run through every wordlist in the dictionary folder.


    You can run several small rules at once by adding multiple **"-r"** lines to the
    Hashcat command. This comes in very handy with the "hybrid" rules. Adding two
    Hybrid rules to an attack will attempt to add letters, numbers, or symbols to
    both the beginning and end of the wordlist word.


    For example:


    hashcat -D 1 -m 1000 ~/Desktop/Hardhash.txt ~/Desktop/rockyou.txt -o ~/Desktop/Hardcracked.txt
    -r hybrid/append_ldus.rule -r hybrid/prepend_ldus.rule --force --remove


    Would take a word from the rockyou wordlist and add a random letter, number or
    symbol to both sides, as seen below:'
  merge: -1
  pgno: 289
- img_proc: false
  md: '![](bbox=[0.144, 0.067, 0.787, 0.184])


    The Rockyou word "triplet" was transformed into "{tripletX" and "ilovejt" to "~ilovejt~".
    You could also add in one of the "Toggles" rules to have it toggle letters in
    the words to upper or lower case while appending and prepending characters:


    {TripLetX -> ~IIoveJT~


    As you can see using multiple rules together can greatly expand the cracking ability
    of simple lists.


    # 3 - Mask attacks


    Mask Attacks allow you to define the layout of the brute force words that will
    be used in your attack. For instance, if you know that the target''s password
    policy requires two numbers, six uppercase letters and two special characters
    you can create a mask for Hashcat to use.


    In this example it would look something like **?d?d?u?u?u?u?u?u?s?s:**


    ```

    hashcat -D 1 -m 1000 Hardhash.txt -o Hardcracked2.txt -a3 ?d?d?u?u?u?u?u?u?s?s
    --force --remove

    ```


    Play around with different masks until you get a feel for how they work. The longer
    the mask, the exponentially longer it will take for it to run. A three-letter
    mask could be finished in seconds; a 10+ character mask could take hours or years
    to run.


    Hashcat also allows for the use of Mask files instead of manually providing the
    mask. Basically, a mask file is just a file that contains multiple masks. Example
    masks are included with Hashcat, and can be found in the "masks" subdirectory.
    Below is a screenshot of the "Rockyou-1-60.hcmask":'
  merge: -1
  pgno: 290
- img_proc: false
  md: '![](bbox=[0.18, 0.1, 0.83, 0.31])


    To use a mask file, you simply provide the mask filename instead of typing a manual
    mask on the Hashcat command line. When run, Hashcat will step through the file
    using each mask listed one by one. As mentioned before, the longer the mask, the
    longer it will take to run. That is why it is always best to use a video card
    GPU on a stand-alone system (non-VM) to speed things up if you have a compatible
    card.


    # Conclusion


    This was just a basic level look at Hashcat. The purpose of this chapter was not
    in just showing how to crack passwords, but to demonstrate the importance of using
    secure passwords. Sometimes as an Ethical Hacker or pentester you need to crack
    hashes, so knowing password cracking techniques is very important. John the Ripper
    and Hashcat make password cracking fairly easy and when you add in the different
    attack styles, rules and masks, you have some pretty powerful tools. Supposedly
    the simpler encryption types are now considered obsolete. Unbelievably I still
    see instances where companies are using simple passwords in unsalted password
    databases. Also, SHA1 and MD5 public database leaks are still very easy to find.


    Hopefully this chapter has shown why strong passwords are important. Implementing
    a policy requiring your users to use long complex passwords is a good move in
    securing your network. Or better yet, implement multi-factor authentication for
    your systems, and make sure to use salted passwords when possible. Also, don''t
    forget to remind your users to use a different password for every account they
    have, especially with important online accounts that include personal information.
    That way if a password is compromised the hacker will not have access to every
    one of their accounts.'
  merge: -1
  pgno: 291
- img_proc: false
  md: 'I highly advise the reader take some time and play around with Hashcat. Also,
    check out the Hashcat Wiki listed in the Resources section below. Cracking password
    hashes can be a lot of fun and seeing what passwords that users tend to use and
    which ones are easily cracked can help you build better password policies for
    your company.


    # Resources


    Hashcat Wiki - [https://hashcat.net/wiki/](https://hashcat.net/wiki/)'
  merge: -1
  pgno: 292
- img_proc: false
  md: '# # Chapter 21

    # Cracking Linux Passwords


    Just as passwords hashes can be hacked in Windows, the same can be done with Linux
    machines. All you need is root level access to obtain the hashes and a good password
    attack tool to crack them. In this chapter we will use John the Ripper to try
    our hand at cracking Linux passwords. We will then cover several other tools that
    can be used to crack server application passwords and perform automated attacks.


    Before we get into the meat of this chapter let''s take a look at some actual
    Linux password hashes. Below are 2 Linux password hashes, the first is from Metasploitable2,
    the second is a user I made on my Kali Linux box.


    +   1. msfadmin:$1$XN10Zj2c$Rt/zzCW3mLtUWA.ihZjA5/

    2. dan:$6$miC/IqYE$eAHWWJ2S61YKukO.Amlriu4JNCru9vkczyzFndynIrJGF6QjfCjV0Sd70CSmX0Sp9xmthpr11yOR4QTSpJCYN/


    The big difference between NTLM passwords and Linux passwords, is that Linux passwords
    are salted. The salt is a unique string that is used to encode each password making
    the password hashes different even if two users used the exact same password.
    This way no two hashes are ever the same. We break down the contents of the password
    hash below:


    ![](bbox=[0.196, 0.62, 0.79, 0.857])


    Part 1 is the username. Part 2 is the encryption type, an encryption type of 1
    means that it is using 128-bit encryption. Part 3 is the salt used for this password
    hash. Lastly, Part 4 is the actual hash.'
  merge: -1
  pgno: 293
- img_proc: false
  md: 'Notice the second hash from the newer version of Linux is formatted in the
    exact same way, but it is much longer. This hash is using an encryption type of
    6, which means that it is using 512-bit encryption, thus the much longer hash.
    This is a much stronger encryption, but there is really nothing different we need
    to do when cracking them, as John the Ripper will automatically detect the correct
    hashing algorithm and crack it accordingly.


    I don''t know if you realized it when we were cracking the Windows NTLM passwords,
    but two of the Window''s password hashes were identical. Both users Alice and
    Dan used the password of "password":


    ![](bbox=[0.103, 0.347, 0.886, 0.517])


    This is because Windows NTLM hashes do not use salts. So, if two or more users
    use the exact same password in Windows, the NTLM password hash will be the same.
    This is not so in Linux. If users use the same password, the salt used will create
    a different hash for each user. The hashes below are from two users (Dan and Alice)
    who used the password of "password" in Kali Linux:


    ![](bbox=[0.103, 0.648, 0.886, 0.817])


    Notice the Linux hashes are completely different from each other (as are the salts).
    This can make a huge time difference when cracking passwords in large password
    hash dumps as you always have users that use the same password. If a salt isn''t
    used you get all the identical passwords in one shot, if they are salted, you
    have to crack each hash individually. Okay, enough talk about the hash format,
    let''s see how to get Linux password hashes from a system.


    # Obtaining Linux Passwords'
  merge: -1
  pgno: 294
- img_proc: false
