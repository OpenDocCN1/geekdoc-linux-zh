  md: '14. SET will then send out the e-mail.


    The message above is obviously a silly fake. But something like this, with a much
    more believable message, and including a link to a test website could be used
    to test your employee''s ability to detect, resist and report phishing attempts.
    Though there are a lot of very obvious phishing attempts, but I have to tell you,
    I have seen some that looked very believable. That is why it is a good idea to
    train your employees to be on the lookout for malicious e-mail.


    # ## SET''s Java Applet Attack Vector


    So far, we have seen how to send a fake e-mail that could redirect someone to
    a bogus site. But what if we could make a fake site that offered up a booby-trapped
    script? And if the user allows the script to run, creates a remote shell with
    the user. With SET we can! The Java Applet Attack tries to take advantage of the
    large amounts of companies that use Java. The Java attack vector, like anti-virus,
    is a bit of a cat and mouse game, what works one week may not work the next, etc.
    So basically, even though the Java Applet Attack was recently updated for the
    current version of SET, you still need to trick users into running the applet.
    There is still a chance, depending on the user''s security settings, that the
    attack may still be blocked.


    Lastly, there seems to be an issue with the current version of SET in that it
    doesn''t start the remote listener and just returns you to the main menu when
    run, but I am sure it will be fixed in an update. That being said, some of the
    screenshots below are *older screenshots* from the previous version of this book.


    We will use SET to create a fictitious website that will offer up a booby-trapped
    Java app. If the user allows the app to run, we get a full remote session to the
    system. For this section we will be using the Windows 7 VM as the "target". You
    will also need Java installed (Java.com) on your Windows system if it is not already
    installed.


    From the main SET menu:


    +   1. Select number 1, "***Social-Engineering Attacks***".

    2. Next select 2, "***Website Attack Vectors***".'
