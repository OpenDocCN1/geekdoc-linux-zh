    any of the files.


    ![](bbox=[0.15, 0.36, 0.81, 0.515])


    It is easy to change the default wireless settings by editing the ''hostapd-mana.conf''
    file. Though editing some of the options are a bit more advanced, especially when
    editing the startup files, so I leave this as an exercise for the reader to explore
    if you wish.


    # ## Mana Wrap-Up


    Mana is a very useful tool for penetration testers and Ethical Hackers. You can
    very quickly setup a rouge AP and emulate target networks or setup your own captive
    portal. Captive portals work best when used with some creativity with naming.
    For example, changing your mana router name from "internet" to a name that includes
    the company name would be much more effective.


    Range is an issue when planning this type of testing. Though other wireless adapters
    have better range, I could only connect reliably to my TP-Link card from the same
    room. Most likely some sort of social engineering would be necessary to use this
    in a business environment. On the other hand, I have seen some pretty impressive
    range extender tricks for Wi-Fi that could possibly allow you to run Mana from
    your client''s parking lot or even beyond.


    The best defense against Mana is to avoid Wi-Fi networks, especially public ones.
    It is a good idea to use a VPN if you must use a public wi-fi. When you view the
    log files of Mana when someone uses a VPN all you will see are the VPN header
    information posts and not the actual internet traffic.'
