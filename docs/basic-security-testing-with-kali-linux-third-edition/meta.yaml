- img_proc: false
  md: 'NetHunter is an excellent addition to your Kali toolkit by bringing a mobile
    factor to the penetration testing platform. Because of its nature, you can easily
    use NetHunter to test Wi-Fi security, perform physical security with Human Interface
    Device (HID) & "Bad USB" attacks, even use it like you would a Kali desktop to
    test local network security. All of these features come in one hand-held, easy
    to use package. Of course, don''t forget the stealth factor, with everyone walking
    around glued to their smartphone, a penetration tester running NetHunter will
    blend in perfectly.


    > **Note:**


    NetHunter only works on certain devices. Check the NetHunter website for supported
    devices.


    This chapter will just be another overview type chapter instead of a hands-on
    step-by-step tutorial guide. You can use NetHunter pretty much as you would a
    full Kali install. There will be times though, when you would rather have a full
    desktop to deal with a target instead of typing everything on a phone or tablet
    interface. In this chapter, I just want to quickly show you how you could use
    your NetHunter phone to bounce a target to a full Kali Desktop install.


    # DNS Spoofing with NetHunter, cSploit & Kali Linux


    How cool would it be as a pentester to walk around a target company, with only
    your smartphone, and divert individual systems surfing the web to an outside Kali
    Linux system you have setup that is just waiting for incoming connections. It
    is possible with Kali NetHunter!'
  merge: -1
  pgno: 386
- img_proc: false
  md: '![](bbox=[0.22, 0.09, 0.79, 0.385])


    Using Kali NetHunter & cSploit on your Android phone, you can fairly easily perform
    a Man-in-the-Middle attack on target systems. Of course, you can do all the normal
    MitM type attacks but what is nice is that you can also do DNS spoofing. This
    would allow you to divert a system surfing the web (without ever physically touching
    the target) to a different website. Well, what if that different website was a
    Kali Linux desktop system running Social Engineering attacks?


    Just a quick word of caution - Installing NetHunter involves wiping your phone,
    installing new and custom firmware and rooting it. As with modifying any smartphone,
    there is a possibility that the phone could be bricked in the process, turning
    your favorite phone into an expensive drink coaster. So obviously if you do choose
    to install it, you do it at your own risk. Though I have never had any problems
    with installing NetHunter.


    Three systems will be used in this chapter – The smartphone running NetHunter,
    a test target system running Windows 10 and also our Kali Linux VM:'
