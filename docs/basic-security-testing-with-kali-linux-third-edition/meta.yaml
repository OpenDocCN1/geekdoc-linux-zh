  md: '# ## Chapter 2

    ## Installing Virtual Machines


    In this chapter we will setup Kali Linux, Windows 7 and Metasploitable 2 as Virtual
    Machines (VMs) using VMware Player on a host computer. Setting up our testing
    lab using virtual machines makes it very easy to learn offensive computer security
