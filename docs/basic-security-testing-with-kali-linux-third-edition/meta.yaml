- img_proc: false
  md: '![](bbox=[0.21, 0.1, 0.74, 0.32])


    If Responder is able to obtain user credentials, they are displayed and stored.
    Depending on the options you are using, this will be either in plain text or a
    password hash. The credentials are displayed in Responder and saved to disk. As
    seen below:


    ```

    [*] [LLMNR]  Poisoned answer sent to 192.168.1.93 for name server

    [SMBv2] NTLMv2-SSP Client    : 192.168.1.93

