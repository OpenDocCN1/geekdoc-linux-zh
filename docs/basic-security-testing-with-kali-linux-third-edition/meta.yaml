    require you to process the handshake file before it can crack it. The processing
    commands needed are also given to you.


    # Conclusion


    In this section we covered how easy it can be to obtain the Wi-Fi WPA key from
    a router that is using a simple password. Both of the wireless testing tools presented
    in this chapter allowed us to quickly find and test nearby wireless networks.
    Both attacks worked by de-authenticating a user attached to the router, and then
    capturing and cracking the WPA key with a dictionary attack. Lastly, we covered
    how WiFite provides commands to crack more difficult WPA keys using standard cracking
    tools.


    Hopefully this chapter showed how easy it can be to both find and gain access
    to insecure Wi-Fi routers. Choosing long complex passphrase will help secure your
    wireless network from attackers. Also, implementing WPA3 Wi-Fi devices, when they
    become available, will do a lot to help secure wireless networks.'
