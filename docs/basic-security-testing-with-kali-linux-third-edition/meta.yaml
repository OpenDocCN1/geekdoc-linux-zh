  md: '# Book Errata and Updates


    The following are a list of issues and updates that have come up post publication.
    Though every tutorial in the book worked at the time of publication, issues always
    creep in because of the vast volume of tools and software updates, and unfortunately
    sometimes the tools do not function as intended.


    # **Webdelivery PowerShell Reverse_tcp Shell not Working in Kali 2018.3**


    There is a Metasploit WebScript PowerShell issue in 2018.3 that prevents the reverse_tcp
    shell from being created. The effected Metasploit versions seem to be *Framework
    v4.17.5-dev* through *Framework v4.17.9-dev*. Earlier versions work fine. Later
    versions will most likely be fixed as the problem has been reported.


    **Recommended Fix** - *Download and use Kali Linux 2018.2 for the book* until
    the bug is fixed. The Image for 2018.2 can be found at *https://cdimage.kali.org/kali-images/kali-2018.2/*.


    **Note**: If you update 2018.2, it may pull down a version that has the bug.


    Both Kali Linux and Metasploit have been notified of the issue.'
  merge: -1
  pgno: 409
- img_proc: false
  md: 'https://github.com/rapid7/metasploit-framework/issues/10502


    If you are experiencing any issues with the tools, it is always a good idea to
    check the support forum for the tool to see if anyone else is having the same
    issue. Also check the book webpage for issues and updates:


    https://cyberarms.wordpress.com/2018/09/04/book-errata-updates/


    If the information above did not help and you are still having an issue, please
