- img_proc: false
  md: '![](bbox=[0.15, 0.08, 0.84, 0.2])


    Between the three tools, I really do not have a preference. Also remember that
    these tools could be used against Windows systems as well. Better yet, they can
    be used against multiple systems, so once you get a username/password combo, you
    can try it against all the systems in a network. Depending on how stealthy you
    want to be of course. I would advise the reader to explore the capabilities and
    differences of each to see which would work best for them in certain circumstances.


    # Conclusion


    That is all there is too it. Many people think that Linux security is mystical,
    but it is really not that much more difficult to crack Linux passwords. Because
    we had a root shell, we were able to grab the Linux password hashes from the system
    by simply copying & pasting them to our Kali machine. We were then able to use
    John the Ripper to crack them. Once they were cracked Kali has multiple tools
    that could be used to automate password attacks against a target system. The three
    covered are not the only tools available in Kali.


    Also, if you remember from the Metasploit chapter there were many Meterpreter
    modules that had a place to set usernames and passwords. These scanners could
    use our recovered Linux creds and unleash them on the entire network if we desired.
    Hopefully this chapter showed the importance of using long complex passwords or
    multiple authentication types to protect accounts. As once passwords are cracked,
    they could be used to automatically attack services and systems network wide.


    We only covered cracking the Linux passwords using John the Ripper, you can also
    crack Linux passwords using Hashcat. City College of San Francisco Professor Sam
    Bowne has written up a nice tutorial on doing this on his website[^1]. Professor
    Bowne is a great conference presenter and there is a lot of additional information
    and tutorials on his site that are extremely helpful to those new to the field.'
