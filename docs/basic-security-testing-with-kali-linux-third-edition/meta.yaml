    # ## Social Engineering Toolkit: PowerShell Attack Vector


    The Java based PowerShell attack is great, but what if the target is not running
    Java, or we could not trick them into visiting our SET page? Another Social Engineering
    attempt is to trick a user into running a file that we send them. So, let''s take
    a look at creating a PowerShell shellcode file and sending it to a target. If
    we can trick the target into running the shellcode, or run it ourselves, we get
    a remote connection to the box.


    In this section we will use SET''s PowerShell Attack Vector to create a PowerShell
    script that when run by a target system will connect back and create a remote
    shell to our Kali system. We will also set up SET to look for these incoming connections.


    +   1. From the SET main menu pick, "***Social-Engineering Attacks***".

    2. Select the "***Powershell Attack Vector***" option.


    ![](bbox=[0.146, 0.741, 0.823, 0.893])


    +   3. Next choose number 1, "***Powershell Alphanumeric Shellcode Injector***".'
