  md: "```\nroot@kali:~# nmap -h\nNmap 7.70 ( https://nmap.org )\nUsage: nmap [Scan\
    \ Type(s)] [Options] {target specification}\nTARGET SPECIFICATION:\n  Can pass\
    \ hostnames, IP addresses, networks, etc.\n  Ex: scanme.nmap.org, microsoft.com/24,\
    \ 192.168.0.1; 10.0.0-255.1-254\n  -iL <inputfilename>: Input from list of hosts/networks\n\
    \  -iR <num hosts>: Choose random targets\n```\n\nTo scan our target system, enter\
    \ \"*nmap -sS -Pn <metasploitable's IP address>*\"\n\nPut in the IP address for\
    \ your Metasploitable machine, which in our case is 192.168.1.68. If you didn't\
    \ know the IP address of your Metasploitable system or wanted to scan multiple\
    \ systems, you could enter a range of addresses like, \"*nmap -sS -Pn 192.168.198.1-150*\"\
    \ . This would scan for all systems with an IP address of 192.168.1.1 - 192.168.1.150.\
    \ The \"-sS\" switch tells Nmap to perform a stealth scan. The \"*-Pn*\" tells\
    \ Nmap not to run a ping scan to see what systems are up.\n\nExecuting the command\
