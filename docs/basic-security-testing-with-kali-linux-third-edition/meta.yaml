    bluetooth at this point, just doing simple scans for devices. Though I did hear
    a story of someone that ran a bluetooth scanner so he could tell when his boss
    was in his area. Apparently his boss was wearing an Apple watch and the bluetooth
    scanner picks them up, so he basically knew when he was coming to see him before
    he got there. Ingenious, but also a bit scary too when you think about it. Bluetooth
    LE devices are supposed to randomize their MAC address when they are in use, but
    most don''t. So there is a possibility that people could be tracked this way.
    I always tell my daughters to turn off Wi-Fi and Bluetooth on their devices when
    they are out and about.


    As mentioned, actually hacking Bluetooth is a bit more involved. You need to run
    tools to investigate the Bluetooth device layout, then figure out how the Bluetooth
    app actually communicates to the device. This normally includes a bit of reverse
    engineering of the Bluetooth app to accomplish. But once this is done, and if
    the device is unsecure, you can usually control the device by sending your own
    crafted signals to the device. Again, this is an advanced topic that I may cover
    in a future Advanced Kali book.


    # Metapackages


    The Kali-Pi image comes pre-installed with some tools, like the Mana-Toolkit,
    BeEF, Metasploit, MySQL, MITMf and a few additional tools, but you can install
    the Kali metapackages if you would like. Kali Metapackages are security tool packages
    grouped by function.


    If you have 32 GB of space you can install the full Kali Linux install:


    ```

    apt update

    apt upgrade

    apt install kali-linux-full

    ```


    (or one of the other packages, see below)


    The full install will take forever, you may want to install one of the more specialized
    packages. These are listed on the Kali Metapackages website:


    [https://tools.kali.org/kali-metapackages](https://tools.kali.org/kali-metapackages)


    Just install the package you want using the "***apt install [package name]***"
