    # ## Changing HREFS dynamically


    We can change links on the webpage dynamically by using the ''*Hooked Domain Replace
    HREFs*'' modules. If the user clicks on any of the links, they will go to the
    webpage that we have specified, not the original one specified on the webpage
    itself. This changes all the links on the page in real-time, without the user
    ever knowing, to point to wherever you want the victim to go.


    Say we knew that the target was a New York Giants football fan, which even being
