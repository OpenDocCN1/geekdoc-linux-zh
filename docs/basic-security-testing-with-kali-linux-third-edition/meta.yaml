    # Screen Spy


    Screen Spy is an automated screen shot program. It grabs 6 screenshots with a
    delay in between each one. The screenshots are stored in the hidden Meterpreter
    loot directory (/root/.msf4/loot). This script is nice as it shows you what the
    user is doing over time.


    To use Screen Spy:


    Enter, *"run post/windows/gather/screen_spy"*


    ```

    meterpreter > run post/windows/gather/screen_spy


