  md: 'Before we go on, notice the other options available. There are several alternative
    attack options available here including:


    +   - [Metasploit Browser Exploit](#) - Attacks the client system with Metasploit
    browser exploits.

    - [Credential Harvester Attack](#) - Clones an existing website (like Facebook)
    and then stores any credentials that are entered into it.

    - [TabNabbing](#) - Works great if the client has a lot of browser windows open,
    it waits a certain time then switches one of the tabs to a page that SET creates.

    - [Web Jacking Attack](#) - Uses iFrame replacements to make a malicious link
    look legit.

    - [Multi-Attack](#) - Combines several of the above attacks.

    - [HTA Attack](#) - An attack that uses HTA files and PowerShell Injection.


    For now, we will just use the Java Applet attack. But I highly recommend that
    you check out the other attack options to see which you like the best and how
    they might be used in different situations.


