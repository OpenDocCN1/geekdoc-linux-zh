    \ server\nNot stopping the server will leave it running in\nthe background.\n\
    \ [ Background ]              [ Kill ]\n```\n\nKismet will then stop the service,\
    \ shutdown and leave us at a terminal prompt. Great, so what do we do now? If\
    \ you look in the shutdown messages, you will see that several Kismet Logs were\
    \ created:\n\n```\n[SERVER] INFO: Closed netxml log file 'Kismet-20180731-15-21-18-1.netxml\n\
    [SERVER] INFO: Closed nettxt log file 'Kismet-20180731-15-21-18-1.nettxt\n[SERVER]\
    \ INFO: Closed gpsxml log file 'Kismet-20180731-15-21-18-1.gpsxml\n```\n\nYour\
