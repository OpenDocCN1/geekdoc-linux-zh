  md: "minimum and maximum length of the words, what type of characters to use, and\
    \ Crunch does the rest. Crunch makes heavy use of the charset.lst file that is\
    \ located in its install directory - ***\"/etc/share/crunch\"***. So, you will\
    \ need to either run crunch from that directory or point to the directory with\
    \ the \"*-f*\" switch when using the more advanced character sets (shown below).\n\
    \nAlright, let's start with an easy one:\n\n\tAt a terminal prompt, type, ***\"\
    crunch 1 3 -o threeletters.txt\"*** This tells crunch to start with a single letter\
    \ *(1)* and finish with three *(3)*, it then saves the output *(-o)* as \"threeletters.txt\"\
    . Basically, crunch starts out with a single letter \"a\" and cycles through all\
    \ permutations until it gets to \"zzz\".\n\nWill produce something like this:\n\
    \n> \ta, b, c, d, e, f, g, h, i, j, etc...\n\taa, ab, ac, ad, ae, af, ag, ah,\
    \ ai, aj, etc...\n\taaa, aab, aac, aad, aae, aaf, aag, aah, aai, aaj, etc...\n\
    \nIf we play around with the options we can create more complex lists.\n\n\tEnter,\
    \ ***\"crunch 3 4 abcde1234 -o alphanumeric.txt\"*** as seen below:\n\n```\nroot@kali:~#\
    \ crunch 3 4 abcde1234 -o alphanumeric.txt\nCrunch will now generate the following\
    \ amount of data: 35721 bytes\n0 MB\n0 GB\n0 TB\n0 PB\nCrunch will now generate\
    \ the following number of lines: 7290\n\ncrunch: 100% completed generating output\n\
    ```\n\nThis command creates a wordlist that starts with 3 characters (aaa) and\
    \ ends with four (4444) using alpha/ numeric combinations using 'abcde1234'. This\
    \ produces a text file with strings like:\n\n\taa1, bb3, ec4, 2a21, and e3da\n\
    \n# **Using the Charset.lst file**\n\nCrunch's Charset.lst file contains a list\
    \ of keywords that are pre-defined as alphanumeric or symbol strings. We can use\
    \ these keywords so we don't have to manually type in the characters that we want\
    \ to use. The file is located in the **\"/usr/share/crunch\"** directory. If we\
    \ view the file we can see what keyword sets are available:\n\n```\n**cd /usr/share/crunch**\n\
    ```"
