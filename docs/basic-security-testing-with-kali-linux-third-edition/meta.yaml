  md: '# Chapter 28

    # Kali NetHunter


    **Tool Authors**: Offensive Security and the Community


    **Tool Website**: [https://www.kali.org/kali-linux-nethunter/](https://www.kali.org/kali-linux-nethunter/)


    If you haven''t played with NetHunter yet, it is one of the coolest things since
    sliced bread. NetHunter is an adaptation of the Kali Linux penetration testing
    platform re-invented for use on smartphones. Since I installed NetHunter on my
    Nexus 5x phone, I literally use it every day. So yes, I highly recommend you try
    NetHunter and see if you like it.


    ![](bbox=[0.353, 0.53, 0.65, 0.748])


    Kali NetHunter is an open source mobile computer security testing platform for
    Android. In essence, NetHunter allows ethical hackers and penetration testers
    to have the power of Kali Linux on a smartphone or tablet. NetHunter comes with
    the full suite of Kali Linux tools. NetHunter has some additional Android based
    tools like "cSploit", and "DriveDroid". Last but not least, since NetHunter is
    Android based, you can even install some of your favorite Android tools.


    # ## Why use Kali NetHunter'
  merge: -1
