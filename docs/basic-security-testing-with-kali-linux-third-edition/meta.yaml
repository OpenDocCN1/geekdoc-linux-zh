- img_proc: false
  md: '# Chapter 13

    Man-in-the-Middle Attacks


    One technique that may be advantageous to a security tester is to monitor or capture
    network traffic. Packet captures are somewhat like a phone wiretap. As a wiretap
    records everything a person says on their telephone, a packet capture records
    everything your computer says on the network wire. This could include account
    names, passwords, etc. One of the easiest ways to capture or view packets for
    an attacker is using a Man-in-the-Middle Attack.


    # Introduction


    In this section we will look at viewing network packets using two very different
    processes. For the first one we will use a Man-in-the-Middle (MitM) attack on
    a local network system using the commands arpspoof, urlsniff and driftnet. These
    commands allow us to view what website a target is on and display some of the
    graphics that the target is viewing. Secondly, we will cover running a packet
    capture on a remote machine through a Metasploit session. We will then view the
    captured information for artifacts in Wireshark and Xplico. In both cases we will
    use the Windows 7 VM as the target system.


    A MitM attack in essence places our Kali system in between the target and the
    router. This way, we see all of the traffic coming from and going to the target
    system. All traffic from the target system headed to the internet is re-routed
    first to our machine, which then captures it and forwards it to the network. All
    information coming from the internet headed to the target machine is routed through
    our system first, again so we can review it, and then forwarded to the target
    system.


    We can see this in the following image:'
  merge: -1
  pgno: 183
- img_proc: false
  md: '![](bbox=[0.18, 0.05, 0.78, 0.2])


    Normally user Alice connects directly to the internet through her router. With
    a Man-in-the-Middle attack the hacker inserts himself into the middle of the normal
    communication path and can see a copy of everything that Alice sends to the internet
    and everything that is returned from it.


    ![](bbox=[0.18, 0.34, 0.78, 0.53])


    This is accomplished by modifying the ARP (Address Resolution Protocol) tables
    on the router and the target system. The ARP table tells a system what physical
    MAC address an IP address is actually located at. So, as the attacker, we tell
    the target machine that we are the internet router and tell the router that we
    are the target system effectively placing us into the middle of the communication
    stream.


    There are a lot of tools that you can use to perform MitM attacks. Arpspoof is
    one that has been around for a very long time and is still a go-to tool. We will
    see how to create a MitM attack using Arpspoof and then use other tools to view
    the network traffic.


    > **Note:**


    *Some advanced Anti-Virus Security Software protects the ARP table from MitM attacks.*


    # Creating a Man-in-the-Middle attack with Arpspoof'
  merge: -1
  pgno: 184
- img_proc: false
  md: 'We can modify ARP tables easily with arpspoof, but first we need to turn on
    IP forwarding by running the following command:


    +   1. Open a terminal and type, "**echo 1 > /proc/sys/net/ipv4/ip_forward**"


    Next, we run the arpspoof command. To do so, we need to provide the network interface
    (-i), the target system (-t) and the router address as below:


    +   2. Then type, "**arpspoof -i eth0 -t 192.168.1.93 192.168.1.1**"


    ![](bbox=[0.115, 0.25, 0.881, 0.3])


    +   3. Now, open a second terminal and type, "**arpspoof -i eth0 -t 192.168.1.1
    192.168.1.93**"


    This is basically the same command; except that the computer''s IP address and
    the router''s IP are switched. Arpspoof should then start sending out the modified
    MAC addresses. Now let''s see what we can capture from the target system.


    # Viewing URL information with Urlsnarf


    **Tool author**: Dug Song


    **Tool Website**: [https://www.monkey.org/~dugsong/dsniff/](https://www.monkey.org/~dugsong/dsniff/)


    First, we will see if we can capture URL addresses while the target is surfing
    the Internet.


    +   1. Open a third terminal and type, "**urlsnarf -i eth0**":


    ![](bbox=[0.115, 0.625, 0.881, 0.675])


    Now as the Windows user surfs the web, you will see all of the URL traffic:


    ![](bbox=[0.115, 0.721, 0.881, 0.834])


    This allows us to see all the website addresses that the user visits on our Kali
    system!


    +   2. Hit, "**Ctrl-c**" to exit urlsnarf


    Urlsnarf can be handy to use when you want to see what the target user is doing
    on their system. It will not decode encrypted communications; you will need different
    tools to accomplish that. We talk about some of these tools a little later in
    the book.'
  merge: -1
  pgno: 185
- img_proc: false
  md: '# Viewing Captured Graphics with Driftnet


    **Tool author**: Chris Lightfoot


    **Tool Website**: http://www.ex-parrot.com/~chris/driftnet/


    The text is interesting, but you can see the images from visited URLs also using
    a program called "Driftnet". The Driftnet command doesn''t seem to work quite
    as well as it used to. It only seems to now pull .gif files of a certain size.
    Thought it may not work as well as it once did, it is still an interesting program
    to try.


    +   1. Simply type the command "***driftnet***" with the interface (*-i*) you
    want, like this:

    2. A driftnet window should open up on your Kali website. Maximize it to make
    viewing easier.

    3. Now return to the target computer system and start surfing the web.


    ```

    root@kali:~# driftnet -i eth0

    ```


    You should start to see images appearing on your Kali system. Try this out for
    a while to see what images show up using this technique and what images don''t.
    When done, hit "***Ctrl-c***" to exit driftnet and then again in each terminal
    window running arpspoof to restore the original ARP tables. There are many other
    tools you can use to view captured packet data, many times it involves saving
    the data stream to a file and then using something like Xplico to analyze it.
    We will cover Xplico later in this chapter.


    # Remote Packet Capture in Metasploit


    Okay that was all well and good if we are on the same local network as the target
    system, but what if the target system is remote? If we can get a Meterpreter shell
    through an exploit, we can record the target system''s network traffic remotely.
    To do this, we will start with an active Windows 7 meterpreter session obtained
    using the CutePuppy remote shell.


    Here is how to setup the multi-handler in Metasploit in case you need a refresher:'
  merge: -1
  pgno: 186
- img_proc: false
