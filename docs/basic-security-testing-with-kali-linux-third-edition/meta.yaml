  md: The best defense against Man-in-the-Middle attacks are to protect your physical
    network. Use strong wireless security and complex passwords for your Wireless
    networks, disable or protect open & unused network ports, and segment your network
    when possible. DNS attacks will usually not work well against websites using SSL
    (TLS), also they do not work well against websites that are hosted on a server
    that hosts multiple websites. For thorough hands-on training with Kali NetHunter,
    check out my "Security Testing with Kali NetHunter" book.
