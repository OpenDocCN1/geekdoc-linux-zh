    number that the AP is operating on, the number of packets sent and the encryption
    & authentication types. Lastly, the AP name is listed.


    From the figure above, you can see the wireless router is using "WPA2", which
    is the standard encryption type. If the type was "WEP" or "OPN" (open) then there
    would be some really big security concerns. WEP was cracked a long time ago, and
    Open means that there is no security set at all on the AP and anyone can connect
    to it.


    If a client connects, we will see the MAC address of both the client and the AP
    they connected to listed under the BSSID STATION section. Thus, you can see one
    of the inherent security flaws of Wi-Fi. Filtering clients by MAC address is not
    a very effective security strategy as it is trivial to view which clients are
    connected to which AP''s by their physical address. All an attacker would have
    to do is view which addresses have connected and then spoof the address to bypass
    MAC filtering! See the "macchanger" command later in this chapter to see how to
    do this.


    # Viewing Wi-Fi Packets and Hidden APs in Wireshark


    So far, we have seen that filtering clients by MAC address isn''t a great security
    option. One other common Wi-Fi security misconception is that changing your Wireless
    Access Point to use a "Hidden" SSID will increase the security of your network.
    Well, it doesn''t, and we will see why in this section.


    We have seen how to view which APs are available, now let''s see how we can capture
    wireless packets and analyze them in the ever-popular protocol analyzer Wireshark.
    Simply place your Wi-Fi card in monitor mode like we did in the previous example,
    and then run Wireshark. Placing the card in monitor mode will allow us to see
    wireless management traffic like AP Beacons and Probes.


    In a Terminal window, enter:


    ```

    airmon-ng start wlan0

    ```'
