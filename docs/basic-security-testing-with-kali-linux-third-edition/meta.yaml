    C:\Windows\system32>


    C:\Windows\system32>whoami

    whoami

    win-42orbm3srvf\george


    C:\Windows\system32>

    ```


    Pass the Hash Toolkit successfully connected to the Windows target using the user
    George''s username and password hash. Again, we connected to the system using
    the NTLM hash as a key, never cracking or entering the actual password. The winexe
    command successfully opened a DOS command interpreter, in essence a remote shell.
    You can play around a bit to see that you do in fact have a functional remote
    shell if you wish.


    Type, "***exit***" to exit the session when done.


    PTH toolkit works great, but again UAC seems to be the nemesis of local account
    NTLM Pass the Hash. If UAC is enabled, we get the following error when we try
    to run this command:


    ```

    root@kali:~# pth-winexe -U win-42orbm3srvf/george%aad3b435b51404ee:2e520e18228ad8ea4060017234af43b2
    //192.168.1.93 cmd

    E_md4hash wrapper called.

    HASH PASS: Substituting user supplied NTLM HASH...

    ERROR: OpenService failed. NT STATUS_ACCESS DENIED.

    ```


    Substitution failed - Access denied.


    Check out the tool author''s website (Links provided in the Resource Section below)
    for more information and usage examples for the PTH toolkit.


    # Conclusion


    In this chapter we briefly covered "Pass the Hash" attacks using NTLM hashes.
    There are other options out there for Pass the Hash type attacks. As mentioned
    in the beginning of the article, when PTH finally seems dead, someone finds a
    new way to use it. Recently a PTH feature has been added to Mimikatz, the ever-popular
    password recovery tool. Another interesting method involves using PTH to gain
    access to corporate websites that use NTLM for authentication. See the MWR Infosecurity
    article link² in the Resources section below for more information.


    So, what can be done to prevent these types of attacks?'
  merge: -1
  pgno: 267
- img_proc: false
  md: 'During testing I found that using the built in Windows firewall with the Windows
    7 machine was a hindrance. And as we mentioned before many pass the hash type
    attacks would not work at all on Windows 7 if the User Account Control (UAC) setting
    was turned on to any level except, ***"Never Notify"***:


    ![](bbox=[0.3, 0.21, 0.97, 0.42])


    The utility that many complained about in Windows Vista (and turned off!) actually
    does improve the security of your system. On Windows 7 systems, make sure that
    UAC is enabled and set to something other than "Never Notify". Additionally, turning
    off LM and NTLM altogether and enabling NTLMv2 thwarted some of these attacks.
    This was accomplished by setting the authentication level to ***"Send NTLMv2 response
    onlyrefuse LM & NTLM"*** in the system security policy.


    One would wonder about just using Kerberos authentication. From what I saw, there
    seems to be no sure-fire way to force Kerberos across the board. Also, many devices
    on a network still create and use LM/ NTLM hashes for backwards compatibility,
    so removing them completely from your network is still a task.


    If you don''t need to, don''t share files! If file sharing is not enabled on your
    system, the ports needed for this type of attack will be closed.


    Newer versions of operating systems have changed and implemented security options
    specifically to stop this type of attack. But as they change, hackers have changed
    tactics and tools in an attempt to continue using pass the hash attacks. So, the
    cat & mouse game continues - Hopefully a solution will be found before the end
    of the next 15 years.


