  md: 'time add the "**-A**" switch, which will perform OS detection and try to determine
    service versions:


    ```

    nmap -sS -Pn -A 192.168.1.68

    ```


    Nmap will churn for a while as it tries to detect the actual services running
    on these ports. In a few minutes you will see a screen that looks like this:


    ![](bbox=[0.182, 0.28, 0.717, 0.61])


    For each port, we see the port number, service type and even an attempt at the
    service software version. We see several of the normal ports are open in the image
    above. There are also a lot of services running at higher ports; one in particular
    is an Unreal Internet Relay Chat (IRC) program:


    ![](bbox=[0.182, 0.722, 0.717, 0.901])


    Usually in tutorials they cover going after the main port services first. But
    I recommend looking at services sitting at higher ports. What is more likely to
    be patched and up to date, common core services or a secondary service that was
    installed at one time and possibly forgotten about? So, let''s see what we can
    find out about this Unreal IRC service.'
