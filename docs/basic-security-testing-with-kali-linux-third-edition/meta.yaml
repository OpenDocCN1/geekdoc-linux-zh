  md: '# wireshark &


    > **Note:**


    When you start airmon-ng, you may receive a message that running processes could
    cause trouble, these may be ignored. The "&" used after the Wireshark command
    tells Kali to run Wireshark, but give you the command prompt back. Lastly, messages
    in Wireshark about running as superuser can be ignored at this time.


    Wireshark will open, now all you need to do is select the interface to view packets
    on and start the capture.


    +   1. Click on "**wlan0mon**" from the interface list.

    2. Click, "***Start***" (the Shark fin icon):


    ![](bbox=[0.18, 0.46, 0.82, 0.73])


    Wireshark will now begin to capture network control packets from the air and you
    should instantly see a list of all the Wi-Fi Beacon traffic.


    For example:


    ```

    1  0.000000   Beacon frame, SN=3269, FN=0,   SSID=Broadcast

    2  0.028565   Beacon frame, SN=3318, FN=0,   SSID=My Wi-Fi

    ```


    Here you can see a capture from two separate APs. The second one is called "*My
    Wi-Fi*", but the first one is different. The SSID is "Broadcast", which tells
    us that the name for this AP is hidden. This is an ineffective technique used
    to secure wireless networks, and I will show you why.'
