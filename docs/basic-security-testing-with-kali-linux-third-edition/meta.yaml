    ```\n\nThis is an older tool, but still works well in discovering what hosts are\
    \ available on a network.\n\n**Basic Usage:** Netdiscover scans the network looking\
    \ for devices and then displays them. To scan locally to find what systems are\
    \ discoverable:\n\nAt the terminal prompt just type, \"*netdiscover*\""
  merge: -1
