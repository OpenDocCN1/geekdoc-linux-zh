  md: '# # 47.6 ID: @Matrix__G / 检索


    如何判断一个无向图中是否存在长度大于等于 k 的简单环

    设计方法：

    随机选一个点开始走


    如果是树，最多 n−1 条边，不可能有环

    判断是否成环？并查集 (Union-Find)


    随机走总会走到已经标记过的点 ⇒ 一定能找到环

    但找到的环长度是随机的，**有可能 < k**

    ⇒ 随机算法


    不断尝试，直到找到一个长度 ≥ k 的环

    **期望次数：**，因为在树上找不到环 ⇒ 树上尝试次数期望为 O(1)

    不在树上：必然存在至少一个环 ⇒ 每次找到的环**期望长度**怎么估计？


    加入随机边 ⇒ 形成的环长度，期望是多少？

    当 k = O(n) 时，期望次数 = O(1)


    证明：

    随机游走形成的环的长度 ≥ k 的概率下界怎么估计？

    ⇒ 计算期望环长度的下界'
  merge: -1
