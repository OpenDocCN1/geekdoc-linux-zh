  md: '# Adding API Keys


    To perform more advanced searches in Recon-NG using services like Shodan, YouTube
    and Twitter, you will need to acquire Developer API keys from the corresponding
    service.


    > **Warning:**


    *Using Recon-NG to scan for user information might violate some company''s Developer
    API Usage Policies. Read usage policies carefully before continuing.*


    The process to acquire developer API keys is different for each service. For instructions
    on acquiring these keys, see ***"Acquiring API Keys"*** on the Recon-NG user guide
    webpage:


    [https://bitbucket.org/LaNMaSteR53/recon-ng/wiki/Usage%20Guide#!acquiring-api-keys](https://bitbucket.org/LaNMaSteR53/recon-ng/wiki/Usage%20Guide#!acquiring-api-keys)


    As some of the API user policies no longer permit using their service to scan
    users for information, I will not cover these Recon-NG modules. But basically,
    once API keys are obtained they just need to be set in the program. This is done
    using the ***"keys"*** command:


    Type, ***"keys help"***:


    ```

    [recon-ng][default] > keys help

    Manages framework API keys


    Usage: keys [list|add|delete]

    ```


    Use, ***"keys add [manufacturer] [api key]"*** to add specific API keys. Recon-NG
    will then use the API key with the corresponding service when the module is executed.


    # Recovering Data from Compromised Site Lists


    Another interesting featured of Recon-NG is that it can search "Pwned" website
    lists for companies that have had systems compromised. It is a common tendency
    for hackers to publicly dump company data when they have compromised a host. This
    could include everything from internal company information, to dumped databases
    & user account credentials. It was also a practice of system administrators to
    use Pastebin as a temporary holding place to store notes when they were trouble
    shooting system problems. Though not as'
  merge: -1
  pgno: 57
- img_proc: false
  md: "common anymore, you still might find some interesting information about a target\
    \ posted for the world to see on these sites.\n\nRecon-ng has several modules\
    \ that can be used to search these sites to see if information has been compromised\
    \ or posted for a target. For example, let's use the ***\"Have I been pwned? Paste\
    \ Search\"*** module to look for a known e-mail address.\n\nType, ***\"use recon/contacts-credentials/hibp_paste\"\
    ***\nAnd then, ***\"show info\"***:\n\n```\n[recon-ng][default][hibp_paste] >\
    \ show info\n\n      Name: Have I been pwned? Paste Search\n      Path: modules/recon/contacts-credentials/hibp_paste.py\n\
    \    Author: Tim Tomes (@LaNMaSteR53)\n\nDescription:\n  Leverages the haveibeenpwned.com\
    \ API to determine if email addresses have been\narious\n  paste sites. Adds compromised\
    \ email addresses to the 'credentials' table.\n\nOptions:\n  Name         Current\
    \ Value  Required  Description\n  ----         -------------  --------  -----------\n\
    \  DOWNLOAD     True           yes       download pastes\n  SOURCE       default\
    \        yes       source of input (see 'show info' for detail\n```\n\nThis module\
    \ uses ***havelbeenpwned.com's*** API to search Pastebin, Pastie, or Slexy for\
    \ leaked credentials. All we need to do is set ***\"SOURCE\"*** to the e-mail\
    \ address we want and then run the module. The ***\"DOWNLOAD\"*** variable is\
    \ set to 'true' by default, so this will automatically download any of the data\
    \ dump pastes that it finds.\n\nAs seen in the example below:\n\n```\n[recon-ng][default][hibp_paste]\
    \ > set SOURCE test@example.com\nSOURCE => test@example.com\n[recon-ng][default][hibp_paste]\
    \ > run\n[*] test@example.com => Paste found! Seen in a Pastebin on 2018-03-18T04:21:07Z\n\
    (http://pastebin.com/raw.php?i=girmPJdy).\n[*] Paste stored at '/root/.recon-ng/workspaces/default/httppastebincomrawphpigirmPJdy.txt'.\n\
    [*] test@example.com => Paste found! Seen in a Pastebin on 2018-02-14T19:48:39Z\n\
    (http://pastebin.com/raw.php?i=62HRhYsQ).\n[*] Paste could not be downloaded (http://pastebin.com/raw.php?i=62HRhYsQ).\n\
    [*] test@example.com => Paste found! Seen in a Pastebin on 2018-02-14T19:46:18Z\n\
    (http://pastebin.com/raw.php?i=JUeYgehJ).\n[*] Paste could not be downloaded (http://pastebin.com/raw.php?i=JUeYgehJ).\n\
    [*] test@example.com => Paste found! Seen in a Pastebin on 2018-01-25T14:33:39Z\n\
    (http://pastebin.com/raw.php?i=LCKWk6XZ).\n[*] Paste stored at '/root/.recon-ng/workspaces/default/httppastebincomrawphpilCKWk6XZ.txt'.\n\
    [*] test@example.com => Paste found! Seen in a Pastebin on 2018-01-24T16:50:23Z\n\
    (http://pastebin.com/raw.php?i=dWvNJgHk).\n```"
  merge: -1
