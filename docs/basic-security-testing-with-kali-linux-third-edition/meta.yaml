  md: '# ICH LASSE MEINE ARBEIT SPRECHEN WIE EIN BAUM SEINE BLÄTTER SPRICHT


    Ich lasse meine Arbeit sprechen wie ein Baum seine Blätter spricht. Vielleicht
    ist der beste Vergleich ein brennender Baum, weil das Sinnbild eines Baumes nur
    durch das Feuer, das ihn vernichtet, zur vollen Wirkung kommt. So sprechen die
    Blätter eines brennenden Baumes eindringlicher und vielschichtiger als die eines
    grünenden.


    Von den Erfahrungen meiner Kindheit und Jugend, geprägt durch Krieg und Hungerszeit,
    konnte ich nur sprechen, indem ich Lasten schuf: Lasten aus Blei und Eisen, gefesselt
    mit Stacheldraht. Die physische Schwere dieser Werke wurde ein Ausdruck meiner
    damaligen Empfindungslast. Sie hatte deshalb eine existenzielle Funktion: Auf
    dem Weg über die Schwere musste sich die Last lösen.


    Die physische Schwere, körperliches Gewicht, ist eine Grunderfahrung des Menschen.
    Belastung freilich ist nicht nur Einschränkung, sondern sie trägt auch ein positives
    Moment in sich: die Sicherung gegen Veränderung und Beschädigung.


    Mit der Zeit wurde die Schwere der Lasten relativiert und löste sich auf. Mein
    Hunger nach einer bekenntnishaften Belastung steigerte sich; mein Bedürfnis nach
    Klarheit wurde brennend.


    Mit dem Kasten verließ ich die Schwere und fand einen Grundtypus menschlichen
    Handelns: den Drang, einzugreifen, sich einzumischen, etwas zu verändern.'
