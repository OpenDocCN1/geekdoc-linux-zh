    Now that we have seen the available filter commands, how could they be used to
    scan a network we owned? For example, say you were a Microsoft employee and needed
    to find all the IIS servers running IIS 8.0 in the US that are a part of the Microsoft
    domain?


    You could enter something like the line below:


    ![](bbox=[0.198, 0.925, 0.781, 0.985])'
  merge: -1
  pgno: 75
- img_proc: false
  md: 'This quickly and easily sorts through the millions of servers out there and
    returns the ones that match the query. Here is a sample search return:


    ![](bbox=[0.197, 0.158, 0.812, 0.314])


    +   1. **Title information:** Title for the device page. You can search for other
    servers that contain the identical title text by using the "***Title***" filter
    command.

    2. **Country Code:** This shows what country the device is in.

    3. **Hostname:** This search term can be used to search for servers by domain
    names.

    4. **Body text area:** Any text entered into Shodan without a filter will be assumed
    to be a body text search and will look for servers that have the requested information
    in the body text area.


    We have covered a lot of basic information on how to use Shodan. This should well
    get you on your way to performing usable searches. Take some time and try using
    the different filters until you get comfortable with them. The rule of thumb is
    basically the larger your company network is, the higher the chance that you will
    find a system that either you didn''t know was on the internet, or that shouldn''t
    be on the internet.


    Finding systems online is extremely easy with Shodan - As always, *remember that
    it is illegal to access or manipulate systems that you do not have express permission
    to do so.*


