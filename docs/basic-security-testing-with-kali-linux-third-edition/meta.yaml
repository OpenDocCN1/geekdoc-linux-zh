- img_proc: false
  md: "```\nStdapi: File system Commands\n===========================\n\n  Command\
    \       Description\n  -------       -----------\n  cat           Read the contents\
    \ of a file to the\n  cd            Change directory\n  checksum      Retrieve\
    \ the checksum of a file\n  cp            Copy source to destination\n  dir  \
    \         List files (alias for ls)\n  download      Download a file or directory\n\
    \  edit          Edit a file\n  getlwd        Print local working directory\n\
    \  getwd         Print working directory\n  lcd           Change local working\
    \ directory\n  lls           List local files\n  lpwd          Print local working\
    \ directory\n  ls            List files\n```\n\nBasically, you use standard Linux\
    \ commands to get around and use the file systems. But how do you differentiate\
    \ between the local system and the remote system that you are attached to? When\
    \ you are in a Meterpreter shell, all the commands are assumed to be used on the\
    \ **remote** system. So, for example to get a directory listing of the remote\
    \ system, just use the \"**ls**\" command:\n\n```\nmeterpreter > ls\nListing:\
    \ C:\\Users\\Dan\n====================\n\nMode              Size  Type  Last modified\
    \              Name\n----              ----  ----  -------------             \
    \ ----\n40777/rwxrwxrwx   0     dir   2015-01-06 09:59:36 -0500  AppData\n40777/rwxrwxrwx\
    \   0     dir   2015-01-06 09:59:36 -0500  Application\n40555/r-xr-xr-x   0  \
    \   dir   2015-01-06 10:01:29 -0500  Contacts\n40777/rwxrwxrwx   0     dir   2015-01-06\
    \ 09:59:36 -0500  Cookies\n40555/r-xr-xr-x   4096  dir   2018-05-04 16:00:35 -0400\
    \  Desktop\n40555/r-xr-xr-x   4096  dir   2015-03-19 15:49:54 -0400  Documents\n\
    40555/r-xr-xr-x   4096  dir   2015-05-23 15:12:29 -0400  Downloads\n```\n\nIf\
    \ we create a directory called \"***test***\" on the remote machine we can navigate\
    \ to it, and then list the contents:\n\n```\nmeterpreter > mkdir test\nCreating\
    \ directory: test\nmeterpreter > cd test\nmeterpreter > ls\nNo entries exist in\
    \ C:\\Users\\Dan\\test\nmeterpreter >\n```\n\nWhen you need to move around your\
    \ Kali file system you can use the following commands:"
