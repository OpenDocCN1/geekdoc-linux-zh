    Wireshark will now begin to capture network packets from the air and you should
    instantly see a list of all the Wi-Fi Beacon traffic.


    For example:


    +   - 1 0.000000 Beacon frame, SN=3269, FN=0, SSID=Broadcast

    - 2 0.028565 Beacon frame, SN=3318, FN=0, SSID=My Wi-Fi


    Here you can see a capture from two separate APs. The second one is called "My
    Wi-Fi", but the first one is different. The SSID is "Broadcast", which tells us
    that the name for this AP is hidden. This is an ineffective technique used to
    secure wireless networks, and I will show you why.'
