  md: '# Using “Step Recorder” as a Remote Security Tool


    Windows includes a great support program that you have probably never heard of
    called "Problem Steps Recorder (PSR). Microsoft made this program to help troubleshooters
    see step-by-step what a user is doing. If a user is having a computer problem
    that they either cant articulate or tech support just''t visualize the issue,
    all the support personnel needs to do is have run PSR.


    When PSR runs it automatically begins screen captures of everything the user clicks,
    it also keeps a running dialog of what the user is doing in a text log. When done,
    the data is saved into an HTML format and zipped so all the user needs to do is
    e-mail this to the tech support department. I have honestly heard of PSR until
    a while when a user on Twitter mentioned that the tool''s group policy wording
    was a bit concerning from a privacy standpoint. Creepy indeed, but I thought that
    if you could run it remotely, it would be a great tool for a penetration test.


    Well, you can! Though running PSR as an attack tool isn''t a new idea. I did some
    searching and it is mentioned multiple times over the years in this manner.


    Pipefish mentions using it with Metasploit back in 2012 (https://pipefish.me/tag/psr-exe/).


    To use Steps Recorder normally, all you need to do is click the start button in
    Windows and type "psr" into the search box. Then click on “Steps Recorder” or
    just run "psr.exe". When you do, a small user interface opens up:


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_324_0.png)


    Just click “Start Recorder” to start. PSR then immediately begins grabbing screenshots.
    It displays a red globe around the pointer whenever a screenshot is taken. Then
    press “Stop Recording” when done. You will then be presented with a very impressive
    looking report of everything that you did. You then have the option of saving
    the report.


    PSR can be run from the command prompt, below is a listing from Microsoft of the
    command switches:'
