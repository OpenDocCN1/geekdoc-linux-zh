  md: '# Advanced Ways to use Shodan


    Rock on!


    Now that we have looked at some of the basic features of Shodan, let''s take a
    few minutes and look at some more advanced ways to interface with Shodan. If you
    are not comfortable yet installing apps and using the command line or not familiar
    with Metasploit, you may want to skip the rest of this chapter and come back to
    it later.


    # Shodan CLI


    Shodan CLI or ''Command Line Interface'' provides a way to perform Shodan searches
    from a terminal prompt. Shodan CLI is not installed in Kali by default and will
    need to be installed. You will also need to initialize the program with your API
    key. Full usage instructions are located at https://cli.shodan.io/, so I will
    cover this quickly.


    At a terminal prompt, "easy_install shodan"


    ```

    root@kali # easy_install shodan

    Searching for shodan

    Reading https://pypi.python.org/simple/shodan/

    Downloading https://files.pythonhosted.org/packages/n1fcfedda1bc4f8550625ac2fc2722e3fa786/shodan-1.7.7

    e7050edf79bb853dbbb938cda9b594abe87f040c6ae4eb7b7

    best match: downloaded 1.7.7

    Processing shodan-1.7.tar.gz

    ```


    And then, "shodan init <api key>"


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_81_0.png)'
  merge: -1
  pgno: 81
- img_proc: true
  md: "Your Shodan API key is located on the “My Account” section of the Shodan website.\
    \ When the install -h is finished, you are now ready to use Shodan CLI.\n\nType,\
    \ ```shodan -h``` to see the help menu:\n\n```\nroot@kali:~# shodan\nUsage: shodan\
    \ [OPTIONS] COMMAND [ARGS]\n\nOptions:\n  -h, --help Show this message and exit.\n\
    \nCommands:\n  alert      Manage the network alerts for your account\n  convert\
    \    Convert the given input file into a...\n  count      Returns the number of\
    \ results for a search\n  data       Upload data access to Shodan\n  download\
    \   Download search results and save them in a...\n  honeystore Check whether\
    \ the IP is a honeypot or not.\n  host       View all available information for\
    \ an IP...\n  info       Show general information about your account\n```\n\n\
    You can now run Shodan directly from your command prompt. For example, you can\
    \ scan Shodan for a specific host by using the host command and an IP address\
    \ as seen in the simulated search:\n\n```\nroot@kali:~# shodan host 99.999.99.999\n\
    99.999.99.999\nHostnames:      mail.fakedomain.ru\nCity:           Moscow\nCountry:\
    \        Russian Federation\nOrganization:   Media Center\nNumber of open ports:\
    \ 1\nVulnerabilities:  CVE-2014-0231 CVE-2015-0204\n```\n\nPorts:\n  80 nginx\n\
    \nShodan returns location information about the target, and the open ports. Notice\
    \ that it also shows that this system has known vulnerabilities! If Shodan has\
    \ recognized a potential vulnerability for the system, the CVE number for it is\
    \ listed. You can then look up information on how to remediate this issue, or\
