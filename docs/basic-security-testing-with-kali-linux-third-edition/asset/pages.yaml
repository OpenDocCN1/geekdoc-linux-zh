    # Workspaces Command


    The "workspaces" command allows you to keep your work separated by creating separate
    databases for recon sessions. You can create multiple databases and then jump
    between them using all the workspaces command:


    ```

    ```

    recon-ng [default] > workspaces

    Manages workspaces

    Usage: workspaces [list|add|select|delete]

    ```

    ```


    For example, let''s create a workspace called "test":


    Enter, "workspaces add test"


    ```

    ```

    recon-ng[default] > workspaces

    recon-ng[default] > |

    ```

    ```


    In the current version you will see a lot of red warning messages about keys not
    being set - this simply means that API keys have not been entered for a particular
    web API and are not available at the moment, or on later. Notice that the Workspace
    is created and are automatically set to use the "test" database shown by the prompt
    change. Any data recovered from running recon modules now be stored in the "test"
    database. We can always jump to another workspace by using the workspaces select
    command.


    For example, let''s go back to the "default" workspace:


    Enter, [test] workspaces select default


    ```

    ```

    recon-ng [test] > workspaces select default

    recon-ng[default] > |

    ```

    ```


    And we are now back using the default workspace. Data recovered by running modules
    now be stored in the default workspace database. Okay enough overview; let''s
    see Recon-NG in action. Let''s begin by detecting hostnames using the Netcat search
    module.


