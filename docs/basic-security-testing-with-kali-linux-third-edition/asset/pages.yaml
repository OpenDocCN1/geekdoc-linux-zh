- img_proc: true
  md: '# Using a Larger Dictionary File


    If you don''t succeed, try a larger dictionary! A larger dictionary file provides
    more known passwords to compare target hashes against. This can crack a greater
    number of hashes, but because of the increased dictionary size can greatly increase
    the time it takes to run. Though I have found it best to run a large dictionary
    file first and have Hashcat recover any hashes that are recovered. This will make
    the un-cracked file smaller for when you run the more intensive rules and masks
    attacks.


    The website Crackstation.net has a couple very large wordlists available. They
    have a 15GB monster and a smaller "Human Only" version that is about 700 MB. The
    largest wordlist has just about everything that you can imagine in it, the smaller
    human only version contains passwords recovered from actual password dumps.


    For the next attempt, I went ahead and downloaded the human only list as the larger
    will not fit without expanding the Kali VM''s hard drive space. Neither downloading
    it just for this example, you will see why in a minute. After downloading and
    expanding the wordlist to the desktop, I ran the following command:


    ```

    hashcat -D 1 -m 1000 Hardhash.txt Crackstation-human.txt -o Hardcracked.txt --force
    --remove

    ```


    Nothing new to this command line, other than naming a separate output file, but
    I added the "remove" switch. It is not really necessary on such small hash list,
    but on large lists, once a hash is cracked, it is removed from the list to increase
    cracking time on future attempts.


    And the results:


    ```

    Time.Started....: Mon Mar 19 12:22:52 2018 (24 secs)

    Time.Estimated....: Mon Mar 19 12:23:16 2018 (0 secs)

    Guess.Base.....: File (Crackstation-human.txt)

    Guess.Queue.....: 1/100 (10.00%)

    Speed.Dev#1....: 2634.5 KW/s (0.66ms)

    Recovered.......: 0/3 (0.0%) Digests, 0/1 (0.00%) Salts

    ```


    This took about 30 seconds to run. And you can see it not to recover anything.
    A dictionary attack isn''t always going to be the answer. Even using the larger
    15 GB Crackstation file only revealed one additional hash:


    ```

    d6e7ae789da72150d115263f5b9dbde:MyNamesBob

    ```


    The two remaining passwords would be difficult to crack. One is 15 characters
    long and uses special characters, upper and lower-case letters and'
  merge: -1
  pgno: 287
- img_proc: true
  md: 'number ($eCuR@d@Count1) and the one is very long, almost 30 characters. As
    you can see, the complex password and the very long password held up against a
    simple dictionary attack. The moral of this story, wordlists don''t always work.
    Oh and of course, use complex passwords!


    # More Advanced Cracking Options


    Just throwing a dictionary file at a hash list will recover some of the easier
    passwords, but to get the harder ones you need to use more advanced techniques.
    I will not cover them in detail, but Hashcat has several available options including:


    +   1. Attack Types

    2. Rule Sets

    3. Password Masks


    We will take a brief look at each one.


    # 1 - Attack Types


    The "a" option allows you to designate the type of attack you want to use from
    the following options:


    +   0 = Straight

    1 = Combination

    3 = Brute-force

    6 = Hybrid Wordlist + Mask

    7 = Hybrid Mask + Wordlist


    Combination: Combine words from separate wordlists to create new words on the
    fly.


    Brute-force: Enter your own combination of characters, numbers & symbols to attempt
    or use Mask to automated guesses. For example: ?u??s?d?a (upper, lower, decimal,
    all) would attempt to crack passwords like, "Aa0a" to "Zz9z" and everything in-between.
    You can also use "b" for binary (00-ff), this is useful when cracking foreign
    language passwords.


    Hybrid Wordlist + Mask: Use a wordlist in combination with brute force characters
    or a pre-defined mask. For example using the Rocky wordlist with the Mask ?u??s?d?a
    would produce guess attempts like, "passwordAa0a" and "monkeyZZ|9z".


    # 2 - Rule based attacks


    Rule based attacks can be very useful. Hashcat has of built-in rules that you
    can use to crack passwords. For example, there is a "leet" rule set that'
  merge: -1
  pgno: 288
- img_proc: true
  md: 'automatically takes each dictionary and tries different leet-speak versions
    of the word, replacing letters with numbers. You can even use a programming type
    language to create your own sets.


    ```

    root@kali:/usr/share/hashcat/rules# ls

    best64.rule Incisive-leetspeak.rule

    combinator.rule InsidePro-HashManager.rule

    d3ad0dne.rule InsidePro-PasswordsPro.rule

    dive.rule leetspeak.rule

    generated2.rule oscommerce.rule

    generated.rule rockyou-30000.rule

    hybrid specific.rule

    ```


    Rule based attacks are enabled by using the "r" switch and including name of the
    ruleset you want:


    ```

    @kali:/usr/share/hashcat/rules# hashcat -m 1000 ~/Desktop/Hardhash.txt -D

    trockyou.txt -r leetspeak -o ~/Desktop/cracked3.txt

    Initializing hashcat v2.00 with 1 threads and 32MB segment-size...

    ```


    Added hashes from file /root/Hardhash.txt: (1 salts)

    Added rules from file leetspeak.rule: 17


    The Best64, InsidePro, Dive, Rockyou-30000 & d3ad0dne are some of the more popular
    ones and are very effective. My best advice for rules is to start with the smaller
    files (look at their file size) and move on to the larger ones. The smaller ones
    usually run fairly quick, the larger ones can take significantly longer to run.
    You can also use multiple dictionaries at once by just listing your dictionary
    folder instead of listing individual dictionary name. Hashcat will run through
    every wordlist in the dictionary folder.


    You can run several rules at once by adding "-r" lines to the Hashcat command.
    This comes in very handy with the "hybrid" rules. Adding two Hybrid rules to an
    attack will attempt to add letters, numbers, or symbols to both the beginning
    and end of the wordlist.


    For example:


    ```

    hashcat -D 1 -m 1000 ~/Desktop/Hardhash.txt ~/Desktop/rockyou.txt -o

    ~/Desktop/Hardacked.txt -r hybrid/append_ldus.rule -r

    hybrid/prepend_ldus.rule --force remove

    ```


    Would take a word from the rockyou list and add a random letter, number or symbol
    to both sides, as seen below:'
  merge: -1
  pgno: 289
- img_proc: true
  md: '```

    Guess.Base. : File /root/Desktop/rockyou.txt

    Guess.Mod. : Rules (hybrid/append_ldus.rule, hybrid_ldus.rule)

    Guess.Queue.. : 1/1 (100.00%)

    Speed.Dev.#1 : 16746.6 H/s (12.12ms)

    Recovered.: 0/0 (0.00%) Digests, 0/1 (0.00%) Salts

    Progress. : 44086223/129483555 (34.0%)

    Rejected: 38657/44086227 (0.09%)

    Restore.Point. : 49153/1434297 (3.4%)

    Candidates.#1 : (tripletX) -> ~ilovejt~

    ```


    The Rockyou "triplet" was transformed into "tripletX" and "ilovejt" to "~ilovejt~\
    You could also add in one of the "Toggles" rules to help toggle letters in the
    word to upper or lower case while prepending and characters:


    ```

    {TripletX~ ~iloveJT~}

    ```


    As you can see using multiple rules together can greatly expand the cracking ability
    of simple lists.


    # 3 Mask attacks


    Mask Attacks allow you to define the layout of the brute force words that will
    be used in your attack. For instance, if you know the target''s password policy
    requires two numbers, six uppercase letters and two special characters you can
    create a mask for Hashcat use.


    In this example it would look like something ?d?d?u?u?u?u?u?s?s?


    ```

    hashcat -D 1 -m 1000 Hardhash.txt -o Hardcoded2.txt -a3 ?d?d?u?u?u?u?u?s? u?u?s?s?
    --force --remove

    ```


    Play around with different masks until you get a feel for how they work. The longer
    the mask, the exponentially longer it will take for it to run. A three-letter
    mask could be finished in seconds; a 10+ character mask could take hours or years
    to run.


    Hashcat also allows for the use of Mask files instead of manually providing the
    mask. Basically, a mask file is just a file that contains multiple masks. Example
    masks are included with Hashcat, and can be found in the "masks" subdirectory.
    Below is a screenshot of the "Rockyou-1-60.hcmask":'
  merge: -1
  pgno: 290
- img_proc: true
  md: '```

    root@kali:/usr/share/hashcat/masks# ls

    8char-11-1d-1d-is-compliant.hcmask rockyou-2-1800.hcmask

    8char-11-1d-1d-is-noncompliant.hcmask rockyou-3-3600.hcmask

    rockyou-1-60.hcmask rockyou-4-43200.hcmask

    root@kali:/usr/share/hashcat/masks# cat rockyou-1-60.hcmask

    ?d

    ?d

    ?1

    ?d?d?d?d

    ?d?d?d?d

    ?d?d?d?d

    ?l1

    ?d?d

    ```


    To use a mask file, you simply provide the mask filename instead of typing a manual
    mask on the Hashcat command line. When run, Hashcat will step through the file
    using each mask listed by one. As mentioned before, the longer the mask, the longer
    it will take to run. That is why it is always best to use a video card GPU on
    a stand-alone system (non-VM) to speed things up if you have a compatible card.


    # Conclusion


    This was just a basic level look at Hashcat. The purpose of this chapter was not
    in just showing how to crack passwords, but to demonstrate the importance of using
    secure passwords. Sometimes as an Ethical Hacker or pentester you need to crack
    hashes, knowing password cracking techniques is very important. John the Ripper
    and Hashcat make password cracking fairly easy and when you add in the different
    attack styles, rules and masks, you have some pretty powerful tools. Supposedly
    the simpler encryption types are now considered obsolete. Unbelievably I still
    see many instances where companies are using simple passwords in unsalted password
    databases. Also, SHA1 and MD5 public database leaks are still very easy to find.


    Hopefully this chapter has shown why strong passwords are important. Implementing
    a policy for your users to use complex passwords is a good move in securing your
    network. Or better, implement multi-factor authentication for your systems, and
    make sure to use salted passwords when possible. Also, don''t forget to remind
    your users to use a different password for every account they have, especially
    with important online accounts that include personal information. That way if
    a password is compromised the hacker will not have access to every one of their
    accounts.'
  merge: -1
  pgno: 291
- img_proc: true
  md: 'I highly advise the reader take some time and play around with Hashcat. Also,
    check out the Hashcat Wiki listed in the Resources section below. Cracking password
    hashes can be a lot of fun and seeing what passwords users tend to use and which
    ones are easily cracked can help you build better password policies for your company.


    # Resources


    Hashcat Wiki - https://hashcat.net/wiki/'
