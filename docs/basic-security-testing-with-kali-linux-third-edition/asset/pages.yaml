    # FilePwn Shell Injection


    "Filepwn" is capable of inserting backdoors into files as they are downloaded.
    This plugin uses Metasploit and the Backdoor Factory in an attempt to inject a
    backdoor into any file a user tries to download from the web. If MITMF is capable
    of backdooring the app, a Meter shell will open when the file is executed. It
    does not work 100% of the time but is a very interesting attack vector. As this
    is more of an advanced attack, I leave this as an option for the reader to explore
    if they desire.'
