    # Conclusion


    DNS spoofing will not work on all websites, and MitM attacks do not work

    e location, but this could work well for every penetration tester in

    circumstances. For example, they could set up a cloned copy of a website

    (maybe the target system''s corporate website) on an offsite computer. Then just

    take their tablet or phone into the building, connecting to an open network port
    or

    the corporate Wi-Fi, and re-direct individual systems to the outside box for the

    win.'
