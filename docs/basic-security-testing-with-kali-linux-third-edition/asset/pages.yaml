  md: '# Chapter 25

    Fern WIFI Cracker & WiFiite


    Testing router security is an important part of securing a company''s assets.
    If an attacker is able to crack the passphrase of a wireless network, they could
    gain access to a company''s internal network. This could allow them to perform
    a lot of the attacks that we have talked about in the previous chapters, as if
    they were connected directly to a wired connection. That is why securing routers
    is of utmost importance. In many cases this means to provide strong passphrases,
    which many just dont bother doing. Some companies will even leave the default
    credentials on important routers.


    Fern WIFI Cracker & WiFiite are great Network security testing programs. Both
    provide an easy to use interface to underlying Acrack-ng and Reaver penetration
    testing tools. Using either of these tools, we can scan for access points and
    attack Wireless Protected Setup (WPS). We can also perform menu driven WEP/ WPA/
    WPA passphrase cracking using dictionary attacks. In this chapter we will cover
    Fern & WiFiite to test wireless router security. The tests will include using
    wordlists to attack the wireless access key to see if it can be cracked.


    # Using Fern WIFI Cracker


    Tool Author: Saviour Emmanuel Ekiko

    Tool Website: https://github.com/savio-code/fern-wifi-cracker


    Let''s look at Fern WIFI Cracker first. The author of Fern also created “Ghost
    Phisher”, though Ghost Phisher does not seem to be an active project anymore and
    seems to have some functionality issues in the current version of Kali.


    To start Fern from the menu, navigate to, “Applications > 06-Wireless Attacks
    > fern wifi cracker’ or just type “fern-wifi-cracker” from the command line:'
