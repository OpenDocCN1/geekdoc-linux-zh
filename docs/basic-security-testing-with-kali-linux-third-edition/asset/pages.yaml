  md: 'During testing I found that using the built in Windows firewall with the Windows
    7 machine was a hindrance. And as we mentioned before pass the hash type attacks
    would not work at all on Windows 7 if the User Account Control (UAC) setting was
    turned on to any level except, “Never Notify”:


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_268_0.png)


    The utility that many complained about in Windows Vista (and turned off!) actually
    improves the security of your system. On Windows 7 systems, make sure that UAC
    is enabled and set to something other than “Never Notify”. Additionally, turning
    off LM and NTLM altogether and enabling NTLMv2 thwarted some of these attacks.
    This was accomplished by setting the authentication level to “Send NTLMv2 response
    only/refuse LM & NTLM” in the system security policy.


    I would wonder about just using Kerberos authentication. From what I saw, there
    seems to be no sure-way to force Kerberos across the board. Also, many devices
    on a network will still create and use LM/ NTLM hashes for backwards compatibility,
    so removing them completely from your network is still a task.


    If you don''t need to, don''t share files! If sharing is not enabled on your system,
    the ports needed for this type of attack will be closed.


    Newer versions of operating systems have changed and implemented security options
    specifically to stop this type of attack. But as they change, hackers have changed
    tactics and tools in an attempt to continue using the hash attacks. So, the cat
    & mouse game continues - Hopefully a solution will be found before the end of
    the next 15 years.


