  md: '# # Chapter 5

    Shodan


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_65_0.png)


    **Website Founder:** John Matherly

    **Website Address:** https://shodan.io/

    **Website Blog:** https://blog.shodan.io/


    Shodan is one of the most amazing websites on the internet. Called the “Hacker’s
    Google”, “Dark Google” and many times “terrifying” - It is basically a search
    engine for computers. Shodan allows you to find computers or devices on the web
    by searching for them by keyword, services, ports, operating systems or location.
    For example, you can search for all the Microsoft IIS servers in Canada, or all
    the systems using Linux in Africa. It can find any connected server, be a physical
    file server, printer, webcam or an Internet of Things (IoT) device that is publicly
    accessible from the web. In this chapter we will learn how to use Shodan for security
    testing.


    If you are familiar with “Google Dorks”, Shodan is a much easier way to search
    the breadth of the internet for targets. The trick to know using Shodan effectively
    is to know the right keywords. Usually they are the manufacturer''s name, or a
    device model number, but sometimes they are the name of a very obscure embedded
    web server. Once you know the right keywords, you can search the world for'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'these devices in seconds. By using filter commands, you can refine your search
    to specific networks, companies or even the software version running on a server.


    A security team can use Shodan to quickly assess what systems on their network
    are being displayed publicly, when maybe they shouldn''t be. It can also allow
    them to find rogue or unauthorized devices that have been added to the company
    network. In this section we will briefly discuss why your network space using
    Shodan is a good idea. We will then look at how we can do these searches from
    the web interface, Shodan.io, and finally through Kali Linux using the Metasploit
    Framework.


    # Why can scan your network with Shodan?


    There are a large number of seemingly unsecured systems that should never be publicly
    available on the Internet. All can be found easily with a couple keyword searches
    using Shodan. Everything from online, outdated & insecure systems, routers, network
    storage and phone systems - to security cams, building controls, and even security
    systems.


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_66_0.png)


    Move the pointer over the ports for more information.


    But that is not all. Open network printers and embedded devices can also be a
    font of information for hackers giving out SNMP and network infrastructure information,
    and possibly even user accounts and passwords!


    Sadly, in this new “Internet of Things” world, computer systems are not the only
    things that can be found online. Sure, you can find large industrial HVAC environmental
    and building temperature controls (completely open and unsecured), but you can
    also find other uncommon devices like online aquarium controls and even remote-controlled
    doors:'
  merge: -1
  pgno: 66
- img_proc: true
  md: '| DOOR #1 | DOOR #2 |

    | --- | --- |

    | State IDLE | State IDLE |

    | Timer on | Timer on |

    | Status Closed | Status Closed |

    | Message door closed properly | Message door closed before timer expired |

    | CONFIGURATION INFORMATION | RUN TIME |

    | Auto-close timer 60 minutes | 7 days, 6 hours, 35 minutes, 45 seconds |

    | Close Fail timer 20 seconds | |


    When the online device has security, but it comes with it turned off from the
    manufacturer, and all the user needs to do is turn it on or assign a password.


    But many don''t:


    | Password Settings |

    | --- |

    | Off |

    | New User Password |

    | Confirm New User Password |

    | New Admin Password |

    | Confirm New Admin Password |


    When a password is used, it is often left to the factory default (easily found)
    or a simple password (easily cracked). The company itself may not have even been
    the one to put one of these devices online. There have been many reports over
    the years of internet enabled building controls for major companies inadvertently
    being exposed on the internet. Sometimes a building contractor or third-party
    support group, not fully understanding computer security, would install the device
    and then leave them completely open or with default credentials. And with the
    explosion of the “Internet of Things” (IoT), putting an embedded internet server
    in everything from toasters to television sets, these problems are just beginning.


    Searching for open systems using Shodan has become very popular. If you have heard
    of “Urban Explorers”- Those that explore abandoned buildings in cities for thrills,
    think of frequent Shodan searches as “Cyber Explorers”- Those that explore the
    world’s computers for open or loosely secured systems. Once interesting systems
    are found, the keyword searches are usually shared amongst friends, or publicly
    posted on the internet. Shodan itself has an “Explore” section where users can
    share interesting finds:'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# # Explore


    Discover the internet using search queries shared by other users.


    | Featured Categories | Top Voted | Recently Shared |

    |---|---|---|

    | Industrial Control Systems | Webcam (best up search have found yet.) | Liang
    hegauang |

    | Databases | Cams (admin) | presta_nazwa |

    | Video Games | Netcam (testcam) | logitech |

    | | Canon Network Cameras |

    | | default password (results with "default password" in the ba...) | |


    Granted many are just surfing Shodan for research purposes, or to grab screenshots
    of ridiculous things that people put on the web, but it is also a tool that those
    with nefarious purposes could use. That is why it is important to check if you
    have systems, unnownst to you, that are publicly viewable or accessible from the
    web.


    In this chapter we will look at the following Shodan features:


    # ## Shodan Features


    +   - Shodan Website Search

    - Shodan Exploits

    - Shodan Maps

    - Shodan ICS Radar


    And some more advanced features:


    +   - Shodan Command Line Interface

    - Shodan Searches with Metasploit


    # ## Shodan Website Search


    To use Shodan, simply point your web browser to the Shodan website, "shodan.io":'
  merge: -1
  pgno: 68
- img_proc: true
  md: '![](img/37a3b7ef116f9ef991f9e33dd8b348c7_69_0.png)


    The first thing you will want to do is create an account on the website. If you
    do not, your search capabilities will be greatly reduced. Registering for a basic
    account is free and allows greater access to search results & search filtering,
    it also allows you to use some of the Shodan API features. For full access to
    the site capabilities you will need to purchase a membership. There are several
    plans available, see the Shodan API page for more information (https://developer.shodan.io/pricing).
    You will need at least a free account for this chapter.


    **Warning:**

    Clicking on the title of individual Shodan search returns can sometimes take you
    directly to a live system! Never access or modify a system that you do not have
    express permission to do so.


    # # Basic Searches


    Performing a basic search is extremely easy in Shodan. Just type in whatever you
    are looking for in the search bar and click the search button. So, if we wanted
    to search for Cisco routers:


    Type in "**cisco**" and click the "**search**" icon

    Shodan returns to over two million Cisco routers worldwide. In the main part of
    the page you will see the individual device returns listed. You can click the
    “**details**” link at the bottom of each return to view an information page on
    the device. On the left side of the screen, Shodan also shows how many of the
    total devices are from a certain country or location.'
  merge: -1
  pgno: 69
- img_proc: true
  md: '![](img/37a3b7ef116f9ef991f9e33dd8b348c7_70_0.png)


    You can click on any country to zero in your search. So, for example, if we wanted
    to view all the Cisco devices in China, we could click on "China" under Top Countries.
    Shodan now shows us the Top City returns for Cisco routers in China:


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_70_1.png)


    This is a very nice feature, but many times you will just use filter commands
    when narrowing down your searches. Actually, if you look at the search bar, Shodan
    automatically entered a country filter into the search line when you clicked on
    China. The search bar should now look like this:


    # **cisco country:"CN"**'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'You can see the country filter is used with China’s two letter country code.
    We will take a closer look at using Filters in a minute, but first, let''s take
    a look at a device information page. In the main part of the Shodan search screen
    we see individual returns listed. If you click on the “Details” link of one of
    the returns you will see more detailed information about the device:


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_71_0.png)


    This includes the location of the device, common ports & services and a generic
    location. You can even zoom in on the map and scroll around. Doing basic searches
    is a lot of fun, but the true power of Shodan is revealed when you use filters.


    # More Advanced Searches using Filters


    Using Filter commands, you can quickly narrow down your searches to very specific
    things. Let’s take a closer look at the individual filters. Again, to use these
    filters or get more than one page of results, you need to register for a Shodan
    Account.


    # Location Commands


    The Country, State, City and Postal commands allow you to narrow down the geographic
    location of your searches.'
  merge: -1
  pgno: 71
- img_proc: true
  md: '| Command | Example |

    | --- | --- |

    | Country | country:US |

    | State | state:NY |

    | City | city:Watertown |

    | Postal | postal:02471 |


    Using any of these filters allow you to search for devices by geographical location.
    You can also combine individual filters if you wish:


    # **country:US city:Memphis**


    # **Network Commands**


    The Org, Net, Hostname and Port commands allow you to narrow down searches by
    using network based filters.


    | Command | Example |

    | --- | --- |

    | Org | org:Microsoft |

    | Net | net:192.168.1.10

    net:192.168.1.0/24 |

    | Hostname | hostname:Microsoft.com

    hostname:support.Microsoft.com |

    | Port | port:445 |


    **org** - Search for individual organizations by name

    **net** - Search for an individual IP address or an entire net block range

    **hostname** - Allows you to use part of the Fully Qualified Domain Name, like
    ''google'' or the entire site like ''www.microsoft.com'' or ''support.microsoft.com''.

    **port** - Search for systems by open ports


    # **Webpage Commands**


    The Title and HTML filters allow you to narrow down searches by using webpage
    based filters.'
  merge: -1
  pgno: 72
- img_proc: true
  md: '| Command | Example |

    | --- | --- |

    | Title | title:"Server Room" |

    | Html | html:phpinfo.php |


    The *title* filter is probably one of the most over looked search parameters.
    You can scan the entire Internet or your entire domain looking for title keywords.
    The *html* filter allows you to scan for a specific word or string in the web
    page’s html code.


    | Command | Example |

    | --- | --- |

    | Os | os:Linux |

    | Product | product:Apache |

    | Version | version:1.6.2 |


    These filter commands allow you to search by Operating System, Product type or
    Software version number.


    # Keyword Search


    Probably the most popular way to search Shodan is using a body keyword search.
    If you know the type of server the target system is using, the name of an embedded
    server, or to search for only “200 OK” webpages, then the body keyword search
    is the one to use.


    For instance, if you wanted to find all the servers running Apache server version
    2.2.8 and only open sites, or sites that didn’t return an error when scanned (“200
    OK” sites), you can use the following keywords:


    ```

    apache/2.2.8 200 ok

    ```


    # Combined Searches


    The most effective Shodan searches are completed by combining search terms and
    filters. With a few keywords you could search for all of the Microsoft servers
    running IIS/10.0 at your Boston location.'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# IIS/10.0 hostname:YourCompany.com city:Boston


    Or you could do a quick security scan of your domain for old systems that need
    to be updated. For example, any IIS/5.0 systems located anywhere on your domain
    in France.


    # IIS/5.0 hostname:YourCompany.com country:FR


    Title searches work great too. Many webcams use “camera” in their title information.
    If web cameras were not allowed on your network you could quickly check for that.


    # title:camera hostname:YourCompany.com


    # Other Interesting Filters


    Searching using the Geo coordinates opens up some interesting capabilities, especially
    for OSINT and government entities. Say you were creating a network map and wanted
    to search for Linux servers near Damascus, Syria:


    # geo:33.5,36.3 os:Linux


    For some reason, not every system will be correctly labeled with their city/country
    and the geo keyword helps identify additional systems that would not show up otherwise.


    The “after” and “before” allow you to search by date:


    # after:15/12/2017


    # before:15/12/2017


    Lastly you can also search by webpage codes:


    +   - 200 ok

    - 401 unauthorized

    - 403 forbidden

    - 302 Moved


    Those who are searching for open devices will often search for the page code of
    “200 OK”. This means when the Shodan search engine searched the page it was able
    to access the page without any issues.'
  merge: -1
  pgno: 74
- img_proc: true
  md: '![](img/37a3b7ef116f9ef991f9e33dd8b348c7_75_0.png)


    The ''401'' return code means that some sort of authentication is required to
    view the page and lastly ''403'' means the client does not have rights to access
    the page. If you wanted to skip any ''401 unauthorized'' pages or ''302 Moved''
    pages, just use a minus sign and the HTML error code:


    # apache/2.2.8-401-302


    Lastly the "has_screenshot" filter command shows systems that have an available
    screenshot and Shodan actually displays a screenshot in the search returns:


    # has_screenshot:true


    If you use this search filter with no other parameters, it will list thousands
    of completely open systems that are viewable on the web. It will leave you scratching
    your head as to what people leave open on the internet.


    # Putting it all Together


    Now that we have seen the available filter commands, how could they be used to
    scan a network we owned? For example, say you were a Microsoft employee and needed
    to find all IIS servers running IIS 8.0 in the US that are a part of the Microsoft
    domain?


    You could enter something like the line below:


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_75_1.png)'
  merge: -1
  pgno: 75
- img_proc: true
  md: 'This quickly and easily sorts through the millions of servers out there and
    returns

    t ones that match the query. Here is a sample search return:


    | 1. Title: Microsoft Corporation | HTTP/1.1 200 OK |

    |---|---|---|

    | 157.56.62.28 | Cache-Control: no-cache |

    | Microsoft Corp | Content-Type: text/html |

    | Date: 18/07/2013 | Last-Modified: 16 Mar 2009 20:55:26 GMT |

    | 2. Country | Accept-Ranges: bytes |

    | [US Flag] | ETag: "679f431d-b66c11e.0" |

    | 3. Hostname: | Server: Microsoft IIS/7.5 |

    | www.codetest8.microsoft.com | Vary: 43874388000000 |

    | | 4. Body Text area: FP: ALL DIP NOD COR ADM NON CON CURUS IVO/DSA PED TID |

    | | | X-Powered-By: ASP.NET |

    | | | Date: 18 Jul 2013 23:42:58 GMT Content-Length: 1020


    +   1. **Title information:** Title for the page you. You can search for other

    servers that contain the identical title by using the "Title" filter

    command.


    +   2. **Country Code:** This shows what country the device is in.


    +   3. **Hostname:** This search term can be used to search for servers by

    domain names.


    +   4. **Body text area:** Any text entered into Shodan without a filter will
    be

    assumed to be a body text search and will look for servers that have the

    requested information in the body text area.


    We have covered a lot of basic information on how to use Shodan. This should

    well get you on your way to performing usable searches. Take some time and try

    using the different filters until you get comfortable with them. The rule of thumb
    is

    bas the larger your company network, is the chance that you will

    find a system that you didn''t know was on the internet, or that shouldn''t be

    on the internet.


    Finding systems online is extremely easy with Shodan - As always, remember

    that it is illegal to access or manipulate systems that you do not have express

    permission to do so.


    # Additional Shodan Website Features


    Next let''s take a few moments and explore some of the other exciting features
    of

    t Shodan Website. To view a menu of available options all you need to do is'
