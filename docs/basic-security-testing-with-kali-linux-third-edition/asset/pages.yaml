    use, but this is a very useful tool.


    # Crunch


    Tool Authors: Mimayin and Bofh28

    Tool Website: https://sourceforge.net/projects/crunch-wordlist/


    Crunch is a program that allows you to create your own custom password lists.
    Simple tell crunch what you want, the length and complexity, and crunch makes
    it for you.


    ```

    CRUNCH(1)                General Commands Manual                CRUNCH(1)

    NAME

    crunch - generate wordlists from a character set

    SYNOPSIS

    crunch <min-len><max-len> [-charset string] [options]

    DESCRIPTION

    Crunch can create a wordlist based on criteria you specify. The output from crunch
    can be sent to the screen, file, or to another program. The required parameters
    are:

    -len

    The minimum length string you want to start at. This option is required even for
    parameters that won''t use the value.

    max-len

    The maximum length string you want to end at. This option is required even for
    parameters that won''t use the value.

    ```


    The Crunch manual page (shown above) contains complete instructions and examples
    on how to use the tool. Basically, all we need to tell crunch is'
  merge: -1
