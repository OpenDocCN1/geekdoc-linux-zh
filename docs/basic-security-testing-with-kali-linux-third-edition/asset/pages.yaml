  md: '# # Chapter 24

    # Wireless Network Attacks


    Wireless networks and Wi-Fi devices have never saturated both the home front and
    business arena. The threats against Wi-Fi networks have been known for years,
    and though some effort has been made to lock down wireless networks, some are
    still wide open or not secured very well. The new WPA 3 standard should greatly
    enhanced security as it is implemented, but as with everything else in the security
    world, expect new tactics as well. The cat and mouse game went on.


    In this section we will talk about wireless security and a few common Wi-Fi misconceptions.
    We will look at a couple popular tools and techniques that an Ethical Hacker could
    use to check the security of their wireless network. Sometimes wireless networks
    can be modified to deceive users, so we will also cover how a penetration tester
    (or unfortunately, hackers) could set up a fake Access Point (AP) using a simple
    wireless card.


    # ## Wireless Security Protocols


    The news is getting out and Wireless manufacturers are configuring better security
    as the default for their equipment, there are still a large number of wireless
    networks that are woefully secured. One of the biggest things in securing your
    Wireless network is the Wireless Security Protocol. You have "None", which basically
    means that you are leaving the door open for anyone to access your network. *WEP*
    which has been cracked a long time ago and basically that you locked under, but
    left the key under the front mat with a big sign saying, "The key is under the
    mat." "WPA" and "WPA2" which was better but still has issues. The new "WPA3" is
    the recommended security standard for your network. It replaces the 14-year-old
    WPA2. Though WPA3 devices are just beginning to be certified and manufactured,
    the first devices should be out in late 2018, early 2019.


    In the past, the biggest problem was people using Open, or WEP for securing their
    Wi-Fi networks. The biggest problem now, is that WPA2 passcodes are, for the most
    part, fairly easy to crack. Most people use a simple password on their device
    and basically define a simple passphrase on their shared Wi-Fi. Unbelievably too,
    you still see manufacturer’s put out new devices with'
  merge: -1
  pgno: 330
- img_proc: true
  md: 'ridiculously simple devices passwords. I was just given a brand-new router
    and the default password was “admin”. Hackers are taking advantage of the fact
    that people either don''t know how to, or don''t bother to change default passwords
    and are using Routers in large bot attacks. They take over a large number of routers
    using default passwords and then use them in Distributed Denial of Service or
    other attacks. In June of 2018, the VPNFilter took over more than 500,000 routers!


    It is also very frequently that you hear about critical vulnerabilities being
    discovered in common routers. They are, in most cases, the first line of defense
    for a network. So, I think it important to spend some time covering router-based
    attacks. In this chapter we will take a look at a couple ways that Routers are
    targeted and then over the next chapters we will cover Wi-Fi networks. For this
    section you will need a Wireless card capable of entering monitoring mode. Many
    Wi-Fi adapters are capable of doing this, but some are not. If you are planning
    on purchasing one, do a little research to determine if your Wi-Fi adapter will
    work in monitoring mode and with Kali. I will use a TP-Link-WN722n (1, Version
    2 is not compatible with Kali) USB Wi-Fi adapter that works great with Kali. See
    the Resources section for additional information on how Wi-Fi Adapters work with
    Kali. Also, it might be easier to use an extra router (if you have one available)
    for some of the tests in this section.


    # Router Passwords and Firmware Updates


    Of all devices, routers are one of the most important devices to secure with a
    long complex password. Multiple websites exist that contain default passwords
    for network devices. The first thing a drive-by-hacker (someone looking for an
    easy hit) will do is try default credentials for internet facing devices. And
    sadly, many times they will!


    Some industry experts recommend a password of 12-15 mixed symbols, numbers and
    upper/ lower case characters for a good password. I would easily recommend at
    least twice that for a mission internet facing router. I also recommend turning
    off web management, when not needed. This immediately blocks changes to the router
    being made from over the internet.


    Set a frequent schedule to check your router and firewall updates. Most routers
    now have a “check for updates” button in their configuration page. I recommend
    physically going to the manufacturer’s webpage and checking for the latest firmware.
    I have seen on several occasions where the router setup claimed that the firmware
    was up to date or that no new'
  merge: -1
  pgno: 331
- img_proc: true
  md: 'firmware was available, when the manufacturer''s website had newer updates
    available.


    # Routerpwn


    **Tool Authors:** Pedro Joaquín, Luis Colunga, Roberto Gómez, and multiple contributors


    **Tool Website:** http://www.routerpwn.com/


    Not included in Kali, Routerpwn was one of the easiest to tools for finding Router
    exploits. The webpage isn''t actively updated anymore, and seemingly hasn''t been
    in a few years. Though, it is still a great reference for router exploits, especially
    if you are dealing with older routers. The website contains router exploits by
    manufacturer and multiple tools & utilities including password key generators.


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_332_0.png)


    To use the website, you simply click on the manufacturer of the target router.
    So, if we choose "Dlink" we will see the Dlink section of the website:'
