  md: '# # Chapter 9

    Metasploitable2 Tutorial - Part One


    We have covered a lot of basic intro, recon and mapping; now let''s look at attacking
    hosts. For this section we will be using Metasploitable2. Metasploitable2 is a
    purposefully vulnerable Linux distribution. What this means is that it has known
    bugs and vulnerabilities built in purpose. It is a training platform made to be
    used with Metasploit to practice and hone your computer security skills in a legal
    environment.


    Many people think that Linux or Mac OS are much more secure than Windows. But
    like Windows, if you don''t install system patches and updates, they are equally
    vulnerable. The resources section at the end of this chapter cover a lot of information
    on installing and using Metasploitable2 so I will not spend a lot of time on this
    topic. But we will go through a couple of the exploits using Kali to see how the
    process works.


    As mentioned in the installation chapter, I chose to stay with Metasploitable2
    for this book instead of the newer Metasploitable3, mostly because of ease of
    installation. At the time of this writing there are software generation issues
    with MS3. These can be overcome, but I thought that walking new users through
    these issues might be a little too advanced for the Basic Kali book. Besides MS2
    is still useful in seeing the basic concepts of Metasploit. We will be using MS3
    in my upcoming Advanced Kali book.


    # ## Installing and Using Metasploitable2


    Metasploitable2 is available as a Virtual VM. Instructions for installing and
    setting up Metasploitable were covered in the installing chapter. Basically, just
    download the file, unzip it, start a new instance of VMware player and then open
    it with VMware Player. It''s that simple. If you are using Virtual Box, Rapid
    7 hosts a video showing the full install of Metasploitable on Virtual Box. A link
    to the video can found in the Resources section below.'
