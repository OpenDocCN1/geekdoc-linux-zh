  md: '# Chapter 28


    # Kali NetHunter


    **Tool Authors:** Offensive Security and the Community

    **Tool Website:** https://www.kali.org/kali-linux-nethunter/


    If you haven''t played with NetHunter yet, it is one of the coolest things since
    sliced bread. NetHunter is an adaptation of the Kali Linux penetration testing
    platform re-invented for use on smartphones. Since I installed NetHunter on my
    Nexus 5x phone, I literally use it every day. So yes, I highly recommend you try
    NetHunter and see if you like it.


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_385_0.png)


    Kali NetHunter is an open source mobile security testing platform for Android.
    In essence, NetHunter allows ethical hackers and penetration testers to have the
    power of Kali Linux on a smartphone or tablet. NetHunter comes with the full suite
    of Kali Linux tools. NetHunter has some additional Android based tools like "cSplit",
    and "DriveDroid". Last but not least, since NetHunter is Android based, you can
    even install some of your favorite Android tools.


    # Why use Kali NetHunter'
  merge: -1
  pgno: 385
- img_proc: true
  md: 'NetHunter is an excellent addition to the Kali toolkit by bringing a mobile
    factor to the penetration testing platform. Because of its nature, you can easily
    use NetHunter to test Wi-Fi security, perform physical security with Human Interface
    Device (HID) & "Bad USB" attacks, even use it like you would a Kali desktop to
    test local network security. All of these features come in one hand-held, easy
    to use package. Of course, don''t forget the stealth factor, with everyone around
    glued to their smartphone, a penetration tester running NetHunter will blend in
    perfectly.


    # Note:


    NetHunter only works on certain devices. Check the NetHunter website for supported
    devices.


    This chapter will just be another overview type chapter instead of a hands-on
    step-by-step tutorial guide. You can use NetHunter pretty much as you would a
    full Kali install. There will be times though, when you would rather have a full
    desktop to deal with a target instead of typing everything on a phone or tablet
    interface. In this chapter, I just want to quickly show you how you could use
    your NetHunter phone to bounce to a full Kali Desktop install.


    # DNS Spoofing with NetHunter, cSploit & Kali Linux


    How cool it would be as a pentester to walk around a target company, with only
    your smartphone, and divert individual systems surfing the web to an outside Kali
    Linux system you have setup that is just waiting for incoming connections. It
    is possible with Kali NetHunter!'
  merge: -1
  pgno: 386
- img_proc: true
  md: '![](img/37a3b7ef116f9ef991f9e33dd8b348c7_387_0.png)


    Kali NetHunter c CSploit on your Android phone, you can fairly easily perform
    a Man-in-the-Middle attack on target systems. Of course, you can do do the normal
    MitM type attacks but what is nice is that you can also do DNS spoofing. This
    would allow you to divert a system surfing the web (without ever physically touching
    the target) to a different website. Well, what if that different website was a
    Kali Linux desktop system running Social Engineering attacks?


    Just a quick word of caution - Installing NetHunter involves wiping your phone,
    installing new and custom firmware and rooting it. As with modifying any smartphone,
    there is a possibility that the phone could be bricked in the process, turning
    your favorite phone into an expensive drink coaster. So obviously if you choose
    to install it, you do it at your own risk. Though I have never had any problems
    with installing NetHunter.


    Three systems will be used in this chapter - The smartphone running NetHunter,
    a test target system running Windows 10 and also our Kali Linux VM:'
  merge: -1
  pgno: 387
- img_proc: true
  md: '![](img/37a3b7ef116f9ef991f9e33dd8b348c7_388_0.png)


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_388_1.png)


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_388_2.png)


    Kali Nethunter


