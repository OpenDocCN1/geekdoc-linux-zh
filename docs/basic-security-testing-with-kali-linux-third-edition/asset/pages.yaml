    So, with just MITMF''s start switches, we can easily use Responder through it.
    How cool is that? When done, hit "Ctrl-c" to exit.


    # Conclusion


    In this chapter we covered the service poison tool Responder. We saw how it is
    able to recover both password hashes and clear text passwords. We then took a
    look at how to perform "pass the hash" attacks with the Responder Multi-Relay
    tool. Next, we saw how a remote shell could be created from the Multi-Relay shell
    using PowerShell and Metasploit. Lastly, we saw how the MITMF has Responder capabilities
    built-in making it a very powerful tool.


    So, how do you defend against these types of attacks? Basic Network Security Monitoring
    (NSM) will pick up and flag Basic text authentication attempts and WPAD auto-proxy
    requests. This is just one reason why NSM is so important. You can disable the
    LLMNR and NBT-NS services that Responder is taking advantage of, but you must
    be sure that this will not affect your network functionality before you, especially
    in environments with old systems still running. For WPAD based defense, provide
    an entry for WPAD in DNS, or don''t use the "auto-detect proxy" setting in the
    browser.


