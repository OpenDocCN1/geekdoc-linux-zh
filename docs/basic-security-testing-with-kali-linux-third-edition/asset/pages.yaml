  md: '# # Chapter 29

    Network Defense and Conclusion


    We spent a lot of time covering offensive security techniques in this book. We
    will wrap things up with a quick discussion on securing network systems from these
    types of attacks.


    We will briefly cover:


    +   - Patches & Updates

    - Firewalls and Intrusion Prevention Systems (IPS)

    - Anti-Virus/ Network Security Programs

    - Limiting Services & User Authority

    - Use Script Blocking Programs

    - Using Long Complex Passwords

    - Network Security Monitoring

    - Logging

    - User Education

    - Scanning your network

    - And Finally, using Offensive Security


    Though no system can be guaranteed to be 100% secure, we can make our systems
    much tougher to compromise by using these techniques.


    # ## Patches & Updates


    Use the latest versions of Operating Systems if it is at all possible. Using outdated
    Operating Systems in a network environment with internet connectivity is not a
    good idea. If you are still using Windows 7 (or XP - Yikes!) in your environment,
    I highly recommend updating to Windows 10. Windows 10 has been out for a while
    now and honestly is a very good product. Though I have'
  merge: -1
  pgno: 394
- img_proc: true
  md: 'had systems that have problems installing the version change updates, overall,
    I think it is one of the better releases of Windows.


    In addition, ensure your software is also up to date. Always make sure Adobe products,
    Java, and internet browsers are regularly patched, along with Office software.
    If you are in a large corporate environment, never place complete trust in automated
    patching and updating management systems. Manually check important systems regularly.
    I have seen multiple servers error out on automated updates, yet the patch management
    server displayed that all servers updated without error.


    Lastly, make sure the hardware firmware is on all of your devices, especially
    internet facing devices (Routers, Switches, NAS, Cameras, Embedded Server Devices,
    etc.), are current and regularly patched. As we have seen in the Shodan chapter,
    these devices can be found very quickly using online search engines like Shodan.
    Hackers are actively targeting these devices, creating an update schedule, with
    actively watching for critical device updates is extremely important.


    # Firewalls and IPS


    As recent as a few years ago, some ISP''s were still giving out internet connections
    to small offices and home users that had no clue that they needed a firewall.
    That being said, always use a firewall, do not attach any systems to a live connection
    without using one. Firewall your incoming internet connection and also make sure
    that each individual system is using a software firewall. Create an Ingress and
    Egress Rules policy to monitor or control information entering and leaving your
    network. At the simplest level, block communication with nations that will not
    be doing business. With more advanced systems will allow you to control what type
    of data and protocols are allowed to enter and leave your network.


    Use a Web Application Firewall to protect application servers. Though these do
    not guarantee that you will stop all malicious attacks against your web app. Application
    security experts highly that your web apps are securely written and tested for
    exploit even when a WAF is in place. Intrusion Prevention Systems are great, they
    are even better when used in a Network Security Monitoring type system (see topic
    below).


    # Anti-Virus/ Network Security Programs


    Honestly, I am torn on Anti-Virus programs. Though they do stop many threats,
    in 20+ years of computer support I have also seen them constantly bypassed. Any
    determined modern hacker is going to research your company to find that'
  merge: -1
  pgno: 395
- img_proc: true
  md: 'out what Anti-Virus program you use. Then they will tailor their exploit code
    to bypass that brand of AV. If they can''t find out what you are running, they
    will go with one that bypasses most of the big named AVs.


    Not all Anti-Viruses are created equal. Some AV/ Internet security programs have
    gotten very good at blocking scripting-based threats which seem really popular.
    Also, some nations have banned anti-viruses from certain countries due to possible
    spying concerns. Do some homework and find out how the top anti virus programs
    fare against current threats, and then pick one that best meets your needs.


    # Limit Services & Authority Levels


    Turn off network services and protocols on systems that are not needed. The less
    attack surface a server has the better. Microsoft has aided in this over the years
    by changing their server product to come with basically nothing by default, you
    add services as needed. Also, take old servers offline as soon as possible. Many
    times, companies will leave an old server online, in case they need something
    from it, and over time it is forgotten or not updated.


    Never let everyday use elevated credentials for non administrative tasks. Heavenly
    restrict “Root” and “Administrator” level use. On a Windows system it is almost
    trivial to escalate a compromised administrator account to the god-like “System”
    level account. This is much more difficult if the compromised account is just
    at “user” level. System administrators should only use admin level when performing
    administrative functions, switch back to a non-admin account for normal computing
    functions.


    # Use Script Blocking Programs


    Many modern online users use some level of web scripting language. Use a script
    blocking program like the Mozilla Add On “NoScript”, by Giorgio Maio; it is an
    easy fix to block a lot of threats. NoScript blocks scripts from automatically
    running on any new website that you visit. It also makes it very easy to allow
    some scripts to run, or completely whitelist a website. NoScript remembers your
    settings so scripts will be blocked or allowed automatically when you visit frequent
    sites. I also like the Mozilla Add On “Ghostery”, by José María Signanini, and
    Felix Shnir. Ghostery allows you to block tracking scripts, analytics and unwanted
    advertising on websites.'
  merge: -1
  pgno: 396
- img_proc: true
  md: 'Finally, enable security and privacy features in web browsers. Do not let them
    store passwords or history. When practical use a program like Bleachit occasionally
    to clean out browser caches.


    # Complex Passwords & Two Factor Authentication (2FA)


    This should go without saying, but use long passwords not only for your computer
    systems (and online devices!), The longer, and more complex your password is,
    the longer it will take for an attacker to crack it. With a combination of Upper
    and Lowercase Letters, numbers and symbols. Many security experts recommend using
    a password manager to ensure you have a different secure password for each site.
    I personally don''t recommend these as some have security issues themselves in
    the past, and if a hacker can access the pw manager, they can get all of your
    passwords.


    During one security assessment, I found that a client used a person''s first name
    as a web application administrator password! The program I used to test the strength
    of web app passwords was able to crack it in a few seconds. None of my passwords
    are shorter than 16 characters, with very important ones being much larger. A
    different password for each online account that you have, that if one accounts
    is compromised, the attacker will not be able to use it to gain access to other
    accounts you own.


    I have mentioned this before, but use multiple authentication types when available.
    Using a secondary method like pin or biometric authentication with a password
    is always a more secure option than just using a password alone. Due to the increase
    in "SIM Hijacking" many do not consider authentication a safe way to secure accounts.
    SIM Hijacking is when a social engineer tries to take over a target''s phone by
    telling the service provider that they are moving over to a new SIM card. If successful,
    the hacker then has access only to 2FA texts but anything else tied to the number.
    Setting a protective PIN number on your phone account can prevent this, along
    with authenticating apps for 2FA.


    # Network Security Monitoring


    I am a huge fan of Network Security Monitoring (NSM). If you run your network
    and don''t know what that is, run out (don''t walk) and buy "The Tao of Network
    Security Monitoring, Beyond Intrusion Detection," by Richard Bejtlich. Basically,
    NSM is a system of capturing all of your network traffic, sometimes at multiple
    points in your network, and analyzing it for intrusions or anomalies. If'
  merge: -1
  pgno: 397
- img_proc: true
  md: 'you think that you can afford an NSM system, think again. One of the most commonly
    used one is free! “Security Onion”, created by Doug Burks, is an extremely capable
    and feature rich NSM that is completely free. All you need is a fairly decent
    computer to run it on, and at least two network cards.


    Security Onion allows you to capture network traffic and then analyzes it for
    issues and notifies you with alerts in a fairly easy to use interface. Below are
    a couple screenshots of Security Onion in action. The first one shows a slew of
    alerts that are triggered by “Autopwn” was used on a system on the network:


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_398_0.png)


    As you can see there are multiple warnings and alerts. The last line records 172
    (CNT column) incidents of one alert! Security Onion is also capable of capturing
    TOR on your network. TOR is an anonymous protocol that uses encrypted communication
    that is bounced around the world to help anonymize users. TOR can be used for
    good, but hackers also use TOR to hide their attacks. Here is what happened when
    I used TOR on my test network monitored by Security Onion:'
  merge: -1
  pgno: 398
