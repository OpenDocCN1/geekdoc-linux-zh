    # Note:


    The RockYou.txt file is compressed, so if you haven''t done so already, you will
    need to un-compress it.


    +   * Right click on the file

    * Click "Open with Archive Manager"

    * Click the filename "RockYou.txt" and "extract"

    * Select the Desktop directory and click "extract" again


    See the "Wordlists" chapter for more information.


    Let''s go ahead and try to crack our Easyhash.txt hashes:


    +   1. Open a terminal prompt, navigate to the Desktop directory and type, **hashcat
    -D 1 -m 1000 Easyhash.txt rockyou.txt -o cracked.txt --force**


    The "-D 1" switch tells Hashcat to use the CPU, normally you would want to use
    "-D 2" to make Hashcat use the GPU, but we are in a Virtual Machine environment.
    The "-m 1000" switch tells Hashcat that our hashes are NTLM based hashes.Easyhash.txt**
    is the name of our hash, **rockyou.txt** is the name of our dictionary file and
    "-o cracked.txt" tells Hashcat where to store the cracked hashes.


    NOTE: The "--force" is currently only necessary on the Kali VM, as at the time
    of this writing there are some issues with running the CPU version of Hashcat
    in a Kali VM.


    Basically, we provided the hash style, the hash filename, the dictionary file
    and the output file. The attack options will change, but for the most part this
    is'
