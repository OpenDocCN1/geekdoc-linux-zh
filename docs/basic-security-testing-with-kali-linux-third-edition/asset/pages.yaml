    # Educate your users


    All of your “security in depth” is useless if users allow malicious programs to
    run on your network. One of the most common ways hackers get into your internal
    network is when users run a malicious attachment from an e-mail or a malicious
    script from a website. Teach users about opening unsolicited or suspicious attachments,
    or from visiting suspicious websites. Many Network Administrators will also block
    certain attachments or change the default app for scripts or programs that can
    be used maliciously.


    Some companies have had success with putting up signs encouraging safe computer
    surfing techniques and reminders on using complex passwords on online accounts.
    For more information, the US Computer Emergency Response Team (US CERT) has put
    together a great reference and alert site at http://www.us-cert.gov/ncas/tips/.


    # Scan your Network


    Scan your network for security issues before the bad guys do. Just using Shodan
    will expose systems hanging out on your network that you may have forgotten. Large
    companies usually have many systems publicly available that are running outdated
    Operating Systems or Web Server software. Don’t forget to'
  merge: -1
  pgno: 400
- img_proc: true
  md: 'check cameras, open devices and also printers that are giving out too much
    information like internal network information, SNMP strings and user accounts.


    Also, use an open source (like OpenVas) or commercial security scanning system
    (like NESSUS) to scan your entire network for security issues. OpenVas comes pre-installed
    on Kali, there is somewhat of what to get it working, but there are numerous tutorials
    online.


    # # Offensive Computer Security


    Learn about offensive computer security techniques like those presented in this
    book. We have only covered the most basic techniques used in offensive system
    security. There are a ton of books and security training seminars available. There
    are also a of purposefully vulnerable test systems and Capture the Flag type systems
    where you can legally try out and perfect your skills.


    Lastly, connect with your local OWASP chapter or other security groups in your
    area. Attend security conferences and make contacts in the security field. Many
    do not mind helping out when asked good questions. SANS has some great classes
    too. And once proficient, and with management''s permission, test the security
    of your network systems.


