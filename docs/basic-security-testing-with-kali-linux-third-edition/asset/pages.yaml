    # Network Commands


    These commands allow you to display and manipulate some basic networking features.


    | Command | Description |

    | --- | --- |

    | arp | Display the host ARP cache |

    | getproxy | Display the current proxy configuration |

    | ifconfig | Display interfaces |

    | ipconfig | Display interfaces |

    | netstat | Display the network connections |

    | portforward | Forward a local port to a remote service |

    | resolve | Resolve a set of host names on the target |

    | route | View and modify the route table |


    **arp** - Displays a list of remote MAC addresses to actual IP addresses.


    **ifconfig & ipconfig** - Displays any network interfaces on the remote system.


    **netstat** - Displays a list of active network connections.


    **portwd & route** - Allow you to do some advanced routing attacks. Though we
    will not be covering it in this book, using these two commands allow you to use
    the machine you have exploited to pivot or attack systems on additional networks
    the target has access to.'
