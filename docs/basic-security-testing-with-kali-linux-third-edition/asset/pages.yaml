    # # Using MacChanger to Change the Address (MAC) of your Wi-Fi Card


    Notice that the ifconfig command displays the physical MAC (HWaddr) address of
    your card. This is a unique identifier hardwired into the card. But you can change
    this address using the "macchanger" command.


    +   - Take your wireless card down the `ifconfig wlan0 down` command.

    - Type `**macchanger -r wlan0**`


    The "-r" command sets your MAC to a random address. You can also it it to a specific
    address if you want. Use the switch (macchanger -h) to see more options.'
