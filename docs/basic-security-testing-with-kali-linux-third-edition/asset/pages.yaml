    # DMitry


    Tool Author: James Greig


    Tool Website: http://mor-pah.net/software/dmitry-deepmagic-information-gathering-tool/


    DMitry or “Deepmagic Information Gathering Tool” gathers as much information as
    possible about a target system. This includes sub-domains, e-mail addresses, server
    information and more:


    ```

    # dmitry

    Deepmagic Information Gathering Tool

    There be some deep magic going on

    Usage: dmitry -w $host.txt [-0-9] [-o host.txt]

    -o Save output to to file specified by -o file

    -i Perform a whos lookup on the IP address of a host

    -w Perform a whos lookup on the domain name of a host

    -n Retrieve Netcraft.com information on host

    -s Perform a search for a subdomain

    -e Perform a search for possible email addresses

    -f Perform a TCP scan on a host

    -b Perform a TCP scan on a host showing output filtered by

    -ts Read the banner received from the scanned port

    -t 0-9 Set the TTL in seconds when scanning a TCP port ( Default 2 )

    *Requires: -p flagged to be passed

    DMitry=#

    ```


    This tool can return host information via Whols lookups and retrieve host''s data
    from Netcraft.com. Like Recon-NG, DMitry also searches a target for possible sub-domains
    and recovers e-mail addresses. In addition, the tool also has the ability to perform
    TCP scans.


    To start the, just run DMitry from the ''Application > Information Gathering''
    menu or from the command line by simply typing, “dmitry”. This automatically displays
    the help screen (see image above).


