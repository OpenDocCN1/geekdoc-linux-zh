    Now type, `hashcat -D 1 -m 1000 Hardhash.txt rockyou.txt -o Hardcracked.txt --force`.


    Everything on the line is the same as before, except we changed the hash name
    to the new `Hardhash.txt` file and changed the output filename to `hardcracked.txt`.


    And in a few seconds, we see the screen below:


