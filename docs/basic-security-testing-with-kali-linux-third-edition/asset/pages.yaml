- img_proc: true
  md: '![](img/37a3b7ef116f9ef991f9e33dd8b348c7_390_0.png)


    We can use the DNS spoofing button to redirect the target system to a system we
    control. Once you click the "DNS Spoofing" button you will be presented with an
    Ettercap config screen. Simply set the Domain name you want to spoof, to, the
    IP address that you want it to actually point to.


    For example, if we want the target to go to our separate Kali Linux system that
    we have, we would put it in its IP address. As "microsoft.com" is already added
    in the config file as an example, we will want to modify the IP address. So, if
    our stand-alone Kali Linux system was running at 192.168.1.39 then we would modify
    the Ettercap config screen to look something like this:


    | microsoft.com A 192.168.1.39 |

    | *microsoft.com A 192.168.1.39 |

    | www.microsoft.com PRT 192.168.1.39 |


    When Finished:


    +   - Just click, "SAVE"

    - And then click, "START"


    And that is it. CSploit will start the MITM attack and set the Microsoft DNS entry
    on that target system to point to our Kali box.


    **On the Stand-Alone Kali Linux System**


    Start the Social Engineering Toolkit, and then step through the Web Attack menu
    having it clone the Microsoft website.


    **On the Target System**


    When the attacks from our NetHunter system starts, the target''s DNS requests
    will be intercepted. If we ping Microsoft.com from the target system, we will
    see'
