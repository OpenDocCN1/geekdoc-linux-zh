  md: '# # Chapter 20

    John the Ripper & HashCat


    So far, we have covered several techniques for attacking passwords. We saw sometimes
    you can just do a rainbow table lookup, and in some cases, you can pass the hash.
    But if all else fails, you have to crack the hash. Kali includes several excellent
    tools to do this. In this section we will look at two of my favorites, John the
    Ripper & HashCat.


    # ## Introduction


    We rely on passwords to secure our home systems, business servers and to protect
    our online account information. But cracking programs improve and video cards
    get faster (Video GPU''s are used for very fast cracking) passwords becoming much
    easier to crack. How big of a problem is this? I have been working through some
    very large publicly password hash lists using Hashcat64. If I use my Windows 10
    system that has a Core i7-6700 processor running at 3.4 GHz and a single GTX 960
    video card. It''s not a dedicated cracking machine, I have seen some crazy ones
    out there, but even so, it was still able to crack over 500,000 hashes in 30 seconds.
    It ripped through 19 Million in an hour and a half!


    | Session.................. | hashcat |

    | Status.................. | Exhausted |

    | Hash.Type............... | SHA1 |

    | Hash.Target........... | MassiveLeak002-5.txt |

    | Time.Started()............ | Sat Feb 24 23:29:22 2018 (1 hour, 27 mins) |

    | Time.Estimated........ | Sun Feb 25 00:56:38 2018 (0 secs) |

    | Guess.Base........... | File ( ) |

    | Guess.Queue........... | 1/1 (100.00) |

    | Speed.Dev.#1........... | 6813 H/s (1.27ms) |

    | Recovered............ | 18808172/19181267 (98.06%) Digests, 0/1 (0.00%) Salts
    |


    When you think about it, that''s over 200,000 hashes recovered per minute, or
    3,500 per second. And that was just using with a single GTX 960. Top end cards
    like the GTX 1080 Ti are far faster, especially when you use multiple cards for
    cracking (I''ve seen rigs with up to 8 cards). Granted these simple'
  merge: -1
  pgno: 280
- img_proc: true
  md: 'SHA1 encrypted hashes, hashes using newer encryption or salted passwords would
    take a lot longer to crack. A salted password uses a unique value or salt to encrypt
    each password so no password hashes are ever the same. But believe it or not finding
    public dumps using unsalted passwords are still very common today. Add in the
    fact that the latest version of Hashcat takes the maximum crackable password length
    from 32 up to 256 and it makes you think twice about your company password length
    and complexity policy.


    # John the Ripper


    **Tool Author:** Solar Designer and community


    **Tool Website:** http://www.openwall.com/john/


    John the Ripper, or John is a very fast CPU based password cracker. It is very
    easy to use and is often the first tool when trying to crack a password. John
    is very good at getting passwords, so I usually use John first, to get the hanging
    fruit or easier passwords, and then move to Hashcat for more complex cracking.
    As such, we will quickly cover John.


    John is really easy, to just type "john" and the password file to crack and John
    takes off running. John will attempt to automatically detect the hashes from the
    password file. "If" it can''t prompt you to enter the correct encryption format
    using the "format=" command. The following screenshot is an example of cracking
    a large SHA1 password dump using John:


    As I mentioned earlier, for a CPU based cracker, John is fast. In the example
    above, I found John a list of over 16 Million hashes. It found over 2 million
    of the passwords I was trying to crack in about 15 minutes. After that, it just
    spun its wheels with no progress. At this point I could have used some of John''s
    more advanced features to crack the list, but instead I moved on to Hashcat.'
  merge: -1
  pgno: 281
- img_proc: true
  md: 'When you do a cracked password hash, any of those that were recovered are stored
    in John''s pot. The pot file is located in "home/john"(hidden) directory:


    ```

    root@kali:~# cd john

    root@kali:~/john# ls

    john.log john.pot john.rec

    root@kali:~/john#

    ```


    If you open the file you can see the hashes with the cracked password on the right
    side:


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_282_0.png)


    You can also view cracked passwords using "John-show". If you exit a john cracking
    session the state will be automatically saved. You can restore a saved or exited
    session with "john-restore"


    I usually try John with small groups of hashes that I am able to recover on a
    security test. That''s the extent that I use John. It''s a great tool if you recover
    a single hash and need to crack it quick, or if you have a large list of basic
    hashes. Anything larger or more complex and I immediately switch to Hashcat.


    # Hashcat


    Tool Authors: Jens Steube & the Hashcat Development Team


    Tool Website: https://hashcat.net/hashcat/


    Tool Wiki: https://hashcat.net/wiki/


    Hashcat is an all-purpose password cracker that can run off your graphics card
    processor (GPU) or your CPU. Hashcat is touted as the world''s fastest and most
    advanced password cracker. It is a multi-threaded cracker, so if your'
  merge: -1
  pgno: 282
- img_proc: true
  md: "CPU can run several threads, it will use them. But the real speed comes into\
    \ play when using the horsepower of a GPU, the processor on your video card. If\
    \ your GPU can run hundreds of threads, all of this power is used to break passwords.\
    \ You can even harness the power of multiple video card GPUs to create a monster\
    \ cracking station. Hashcat had used to be two separate programs, but the original\
    \ Hashcat (CPU based) & oclHashcat (GPU based) have been combined into one tool.\n\
    \nHashcat can be started from the menu (**Applications > 05-Password Attacks**\
    \ > **Hashcat**) or by opening a terminal and typing, `hashcat`. You can see the\
    \ different options by typing `hashcat --help`:\n\n```\nrootkali:~# hashcat --help\n\
    hashcat, advanced password recovery\n\nUsage: hashcat [options] hashfile [mask|wordfiles|directories]\n\
    \n===\nOptions\n===\n- General:\n  -b, --hash-type=NUM Hash-type, references below\n\
    \  -a, --attack-mode=NUM Attack-mode, references below\n  -v, --version Print\
    \ version\n  -h, --help Print help\n```\n\nWhen using Hashcat you need to tell\
    \ it a few things:\n\n+   - Type of password hash\n- Filename of the file containing\
    \ the un-cracked hashes\n- The Dictionary or Wordlist file name\n- The output\
    \ filename to store the cracked hashes\n- And finally, the switches for any other\
    \ options you want\n\n# Cracking NTLM passwords\n\nThere is nothing like hands\
    \ on learning, let's crack some hashes. A list of hashes and copy them into a\
    \ text file. And then we will crack them using Hashcat and a dictionary file.\n\
    \nOpen Leafpad and copy in the following Hashes:\na4f49c40651dabcab68242ee7c30fd852\n\
