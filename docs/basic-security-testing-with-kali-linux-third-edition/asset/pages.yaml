- img_proc: true
  md: 'This might look a little confusing at first, but basically detected networks
    and devices show up in the upper left corner. The bottom graph shows detected
    traffic, yellow represents packets, where the red represents data. You can use
    the "View" and "Sort" menu to decide what data to show on the screen, and how
    it is sorted. Play around with the different Sort options to get a hang of it.


    The longer Kismet runs the better view you will get of the surrounding environment.


    # Note:


    You may have heard of the term "War Driving". Basically what this means is to
    drive around town with a Wi-Fi monitoring program and grab area Wi-Fi information.
    Kismet is a program that is used quite frequently for war driving.


    Simply run Kismet on your laptop as you drive. Add a GPS source (like a smartphone)
    and Kismet will add GPS location to each network that it discovers. When you are
    done you can create a nice area of Wi-Fi networks.


    +   1. When you feel Kismet has run long enough, click on the "Kismet" option
    and then "Quit".


    +   2. You will then be asked if you want to Stop the Kismet Server, you will
    go and click, "Kill".


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_360_0.png)


    Kismet will tell the service, shutdown and leave us at a terminal prompt. Great,
    so what do we do? If you look in the shutdown messages, you will see that several
    Kismet Logs were created:


    ```

    [SERVER] INFO: Closed netml log file ''Kismet-20180731-15-21-18-1.netxml''

    [SERVER] INFO: Closed nettxt log file ''Kismet-20180731-15-21-18-1.nettxt''

    [SERVER] INFO: Closed gpsml log file ''Kismet-20180731-15-21-18-1.gpsxml''

    ```


    Your Wi-Fi card may still be in monitoring mode when it exits, so you might need
    to manually turn it off:'
  merge: -1
