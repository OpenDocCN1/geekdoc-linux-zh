  md: '# ifconfig wlan0 down


    You can just type "ifconfig wlan0 up" to bring it back up.


    # Analysing the Data


    Now we will take a moment and look at the data that we collected. Go ahead and
    surf to your root directory. Then, list the files using "Is Kismet", as seen below:


    ```

    root@kali:-# ls Kismet*

    Kismet-20180731-15-21-18-1.alert Kismet-20180731-15-21-18-1.nettxt

    Kismet-20180731-15-21-18-1.gpsxml Kismet-20180731-15-21-18-1.netxml

    ```


    This is where the fun starts, all the information gathered is located in these
    files.


    +   * Alert contains any alert data that was generated


    +   * Gpsxml contains GPS data if you used a GPS source


    +   * Nttxt contains all of the data collected in a nice text output


    +   * Netxml contains all of the data in XML format


    +   * Pcapdump contains a packet capture file of the entire session!


    Now that we have all this information, let''s take a moment and look at the ''.pcapdump''
    and ''.nettxt'' files.


    # PCAP Beacon Frame Analysis in Wireshark


    The ''.pcapdump'' file is a pcap file or a packet capture file. This means that
    we can open the file in a program like Wireshark and view every beacon packet
    that Kismet detected.


    +   Start Wireshark ("wireshark &" at the terminal prompt).


    +   Load in the pcapdump file:


    +   Click "File" then "Open"

    Select the "Kismet-[Date Time Stamp].pcapdump" file in the directory and click
    "Open":


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_361_0.png)'
