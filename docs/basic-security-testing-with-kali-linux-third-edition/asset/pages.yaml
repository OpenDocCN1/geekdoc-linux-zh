  md: '# Core Commands


    | Command | Description |

    | --- | --- |

    | ? | Help menu |

    | background | Backgrounds the current session |

    | bgkill | Kills a background meterpreter script |

    | bglist | Lists running background scripts |

    | bgrun | Executes a meterpreter script as a background |

    | channel | Displays information or control access |

    | close | Closes a channel |

    | disable_unicode_encoding | Disables encoding of unicode strings |

    | enable_unicode_encoding | Enables encoding of unicode strings |

    | exit | Terminates the meterpreter session |

    | get_timeouts | Get the current session timeout values |

    | guid | Get the session GUID |

    | help | Help menu |


    A beginner level user will probably only use background, help, load, migrate,
    and exit from this list.


    **Background** - Allows you to background a session so that you can get back to
    the msf prompt or other access sessions:


    ```

    meterpreter > background

    [*] Background session 1...

    msf exploit(multi)/script/web_delivery) >

    ```


    You can return to your session by just using the “**session -i <session #>**”
    command.


    +   **“Load” and “Run”** – These commands allow you to use additional modules
    and commands inside Meterpreter.


    +   **Migrate** – Allows you to move the Meterpreter shell to a different process.
    This can come in handy later when you want to be bit stealthier or want different
    access levels.


    +   **Exit** – Exits out of Meterpreter.


    # File System Commands


    When you have a Meterpreter shell, you are basically dealing with two separate
    file systems, the local and remote systems. The Meterpreter File system Commands
    allow you to interact with:'
