  md: '# # Chapter 12

    Windows Privilege Escalation by Bypassing UAC


    The Administrator account in Windows has a lot of authority, but there are some
    things that even an Administrator cannot do. For some functions you have to be
    the "System" user to have complete control. User Access Control (UAC) can also
    block access to what the security tester wants to accomplish, including running
    System level tasks. UAC used to be a nuisance in older Windows version, and many
    companies just turned it off. UAC works very well in Windows 7 on up and turning
    it on even the lowest security setting prevents attacks that worked in Windows
    XP.


    For example, even if we get a remote Administrator level session in Metasploit,
    UAC will prevent us from doing some things like obtaining password hashes. There
    are UAC bypass modules in Meterpreter that will allow us to bypass this restriction
    and get System level access - That is if the user account compromise is an Administrator.
    In this section we will learn how to escalate our privileges from an Administrator
    level user to System level by bypassing UAC.


    In this chapter we will start with an active Meterpreter session with a Windows
    7 system and a user that has Administrator rights. For simplicity, we will use
    the session created in the last chapter. We will then use the UAV bypass to upgrade
    our Administrator level user to a System level account. Next, we will cover the
    "Recovery_Files" Metasploit module. This module requires system level access to
    run and allows us to recover deleted files from the remote system. Lastly, a second
    module to bypass UAC is briefly covered.


    # ## Bypass UAC Module


    Several tools in Metasploit need system level access to function correctly. The
    problem is that the UAC security feature of Windows blocks at running programs
    at an elevated security level. The Bypass UAC module in Metasploit takes a remote
    session with a user that has Administrator privileges and creates'
  merge: -1
  pgno: 171
- img_proc: true
