    WPA Key was not found - Please try another wordlist file


    As the password used on this router is very unique, it could run wordlist files
    against it all day and it would not recover it. This is the reason why using complex
    passwords is so important when configuring both your routers and your Wi-fi passwords.


    # Wi-Fi Testing with WiFi


    **Tool Author:** Derv Merkler


