    # SET''s Java Applet Attack Vector


    So far, we have seen how to send a fake e-mail that could redirect someone to
    a bogus site. But if we could make a fake site that offered up a booby-trapped
    script? And if the user allows the script to run, creates a remote shell with
    the user. With SET we can! The Java Petit Attack tries to take advantage of the
    large amounts of companies that use Java. The Java attack vector, like anti-virus,
    is a bit of cat and mouse game, what works one week may not work the next. So
    basically, though the Java Applet Attack was recently updated for the current
    version of SET, you still need to trick users into running the applet. There is
    still a chance, depending on the user''s security settings, that attack may still
    be blocked.


    Lastly, there seems be an issue with the current version of SET in that it doesn''t
    start the listener and returns you to the main menu when run, but I am sure it
