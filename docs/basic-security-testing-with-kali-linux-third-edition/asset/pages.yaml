    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_98_0.png)


    Metasploit can be a little confusing if you have never used it before, but once
    you get used to how it works, you can do some amazing things with it.


    Basically, using Metasploit to attack a target system usually involves the following
    steps:


    +   - Picking an Exploit

    - Setting Exploit Options

    - Picking a Payload

    - Setting Payload Options

    - Running the Exploit

    - Connecting to the Remote System

    - Performing Post Exploitation Processes


    The screenshot below shows an example of this process, but don’t worry, we will
