    # What''s new in Veil-Evasion


    Since the previous version of this book there have been several changes to Veil-Evasion.
    The first is that it is now much easier to install and run Veil on Kali Linux.
    Veil directly supports Kali 2018 and install is done by only running two commands.
    Another change is that Veil includes payloads written for additional languages.


