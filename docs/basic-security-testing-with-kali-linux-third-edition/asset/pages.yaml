  md: 'In this paper we will use a DMZ environment with a variety of firewall rulesets
    to illustrate the best methods for discovering hosts behind a firewall. The DMZ
    architecture we will use throughout this paper is depicted in the following image:


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_178_0.png)


    We have a typical DMZ with firewall filtering inbound traffic. In our scenarios
    we use-rules to keep the rules readable. The actual status of them may vary between
    one setup and another, to avoid getting hung up on the accuracy of them they just
    need to be reread. Also, the version of nmap 1 used for our testing was 3.0


    Our scanning tool hosts on the 192.168.5.0/24 network and has the IP address of
    192.168.5.20.


    Unless otherwise stated, we will use the following nmap command for discovery
    scan:

    nmap -p 172.26.1/29


    You can set the module to recover multiple file types at once by simply listing
    what you want in the FILES variable and separate them with a comma. Lastly, the
    files can also be recovered by the ID number (not shown).


