    \ chapter we will look at two different ways to do this in Metasploit. Then we\
    \ will look at Microsoft's Problem Step Recorder into a remote recording \"spy\"\
    \ tool.\n\n# ## Keylogging with Metasploit\n\nWe will start this chapter by exploring\
    \ Metasploit's built in key scanner. Metasploit has a helpful set of Meterpreter\
    \ commands for capturing keys pressed on a target machine.\n\nKeyscan_dump\nKeyscan_start\n\
    Keyscan_stop\n\nThese commands are available through Meterpreter, so we will start\
    \ with a system that we have already run an exploit on and were successful in\
    \ creating a remote session. We will use our Windows 7 system as a target. We\
