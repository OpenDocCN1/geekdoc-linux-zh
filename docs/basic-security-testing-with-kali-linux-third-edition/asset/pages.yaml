    This command creates a wordlist that cycles through 2 to 4-character words that
    contains all letters, numbers and symbols. Numbers are used a lot in passwords.
    It is a common technique for users to add numbers to the beginning or end of their
    password. You can make a wordlist of numbers using crunch, as seen below:


    ```

    crunch 1-5 -f charset.lst numeric -o 1to5numbers.txt

    ```'
