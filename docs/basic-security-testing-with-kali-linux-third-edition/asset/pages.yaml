- img_proc: true
  md: 'If someone was in a hurry they may click on the wrong wireless network and
    be connected to Mana’s fake router.


    # Modifying Mana Settings


    The Mana configuration file (etc/mana-toolkit/hostapd-mana.conf) and each of the
    Mana start-up scripts can be modified. Actually, on the tool website the author
    even mentions that the startup scripts are more like guidelines and recommends
    modifying them to fit your needs. You can use a regular text editor to modify
    any of the files.


    ```

    GNU nano 2.9.8

    hostapd-mana.conf

    #A full description of options is available in https://github.S

    interface=wlan0

    ssid=00:11:22:33:44:00

    driver=nl80211

    ssid=Internet

    channel=6

    ```


    It is easy to change the default wireless settings by editing the ''hostapd-mana.conf''
    file. Though editing some of the options are a bit more advanced, especially when
    editing the startup files, so I leave this as an exercise for the reader to explore
    if you wish.


    # Mana Wrap-Up


    Mana is a very useful tool for penetration testers and Ethical Hackers. You can
    very quickly setup a rouge AP and emulate target networks or setup your own captive
    portal. Capture portals work best when used with some creativity with naming.
    For example, changing your mana router name from “internet” to a name that includes
    the company name would be more effective.


    Range is an issue when planning this type of testing. Though wireless adapters
    have better range, I could only connect reliably to my TP-Link card from the same
    room. Most likely some sort of social engineering would be necessary to use this
    in a business environment. On the other hand, I have seen some impressive range
    extender tricks for Wi-Fi that could possibly allow you to run Mana from your
    client''s parking lot or even beyond.


    The best defense against Mana is to avoid Wi-Fi networks, especially public ones.
    It is a good idea to use a VPN when you must use a public wi-fi. When you view
    the log files of Mana when someone uses a VPN all you will see are the VPN header
    information posts and not the actual internet traffic.'
  merge: -1
