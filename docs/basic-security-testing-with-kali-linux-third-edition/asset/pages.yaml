    Objectif Sécurité’s online tool used to crack LM hashes only. It also cracked
    each password as it was entered. The website tool now cracks NT Hashes, but the
    LM cracking tool is available as a download on their website. When the tool was
    available online, it could take some very complex passwords and crack them very
    quickly, because the LM hash is much easier to crack. Here are some LM hash examples
