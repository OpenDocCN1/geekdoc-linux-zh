    msf exploit(unreal_ircd 3281 backdoor) > exploit ⑤

    ```


    Depending on the type of exploit used, it is complete we will normally end up
    with either a Remote shell to the computer or a Meterpreter shell. A remote shell
    is basically a remote terminal connection or a text version of a remote desktop
    for Windows users. It allows us to enter commands as if we are sitting at the
    keyboard. A Meterpreter shell offers a lot of interesting programs and utilities
    that we can run to get information about the target machine, control devices like
    the webcam and microphone, or even use this foothold to further access into the
    network. Of course, if needed, you can always drop to a regular shell at any time.


    In many cases, depending on what you are trying to do, a Meterpreter Shell is
    more advantageous than just a regular shell. We will discuss the Meterpreter Shell
    in depth later, but for now let''s quickly cover the first five steps.


    # Note:


    When all else fails and you start to feel lost in Metasploit, or the Meterpreter
    shell, try typing the "help" command.


    You can also use the "Tab" key to autocomplete a line or hit twice to show all
    available exploits or payloads.


    Example: show exploits <tab><tab>


    # 1 - Picking an Exploit


    The first thing we need to do is pick an exploit to use. Metasploit contains 1700
    exploits, with more being added frequently. If you want to view all the exploits,
    just type "show exploits" from the msf prompt:


    ```

    msf > show exploits

    ```


    You can also use the "search" command.'
