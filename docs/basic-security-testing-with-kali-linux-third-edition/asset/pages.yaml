    # Recon-NG Command Line Interface (Recon-cli)


    Once you get very familiar with Recon-NG you might want to try using the Recon-NG
    Command Line Interface. This command allows you to run Recon-NG directly from
    the command line switches instead of working through the framework step-by-step.


