- img_proc: true
  md: 'You are greeted with just a blank line. Enter the hash to crack and hit enter:


    ```

    root@kali:~# hashid

    8846f7aeee8fb117ad06bdd830b7586c

    Analyzing ''8846f7aeee8fb117ad06bdd830b7586c''

    [+] MD2

    [+] MD5

    [-] MD4

    [+] Double MD5

    [-] LM

    ```


    Multiple possible hash types are listed. Again, hit (Ctrl-c) to exit. I am not
    entirely sure of the difference between these two programs, with Hash-Identifier
    seemed slightly more helpful. When you try to use the hash in a standard cracking
    program like Hashcat or John the Ripper more than not it will tell you if you
    have the wrong hash type selected and may also recommend the correct type. As
    we used an LM hash in the examples above, let''s talk a little about cracking
    them.


    # Cracking Simple LM Hashes


    Many Windows XP systems used Lan Manager (LM) hashes to protect their passwords.
    This is a very old and outdated way to store password hashes. This hashing process
    was created for systems before Windows NT. Believe it or not, you can still find
    LM Hashes used in modern networks today. In this chapter we will look at cracking
    these simple LM (and some NTLM) hashes.


    Microsoft''s support for Windows XP ended in 2014. As of 2018, surprisingly enough
    around 6% of the world''s computer systems are still running! That is almost as
    many as all the Mac OS systems and about three times more than deployed Linux
    desktops. XP is still holding on at the number spot for desktop operating systems
    just barely behind Windows 8.1, with Windows 7 still in first place. Shockingly
    what this means is that there are still a large number of Windows XP systems that
    could be in business-critical positions.'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# # Chart Title


    | | |

    |---||

    | Mac OS X 10.12 | |

    | Windows XP | |

    | Windows 8.1 | |

    | Windows 10 | |

    | Windows 7 | |


    Source: NetMarketShare 2018-06


    There are several different ways that computers encrypt their passwords. One of
    the most secure ways "Salting" the password. Basically, this means to use a number
    or string (called a Salt) and incorporate that into the hashing process to ensure
    that no two password hashes are ever the same. If a salt isn''t used (like Microsoft
    NTLM hashes), you can crack one hash, all the users that used that password will
    have the same hash. So, all you need to do is take the hash and compare it to
    known hashes and if you get a match, you have the password.


    Basically, on a system with LM hashes, any password that is fourteen characters
    or less is converted into all uppercase, and then broken into two 7-character
    passwords. Each half is then encrypted and combined to form the final hash. Cracking
    7-character passwords using only uppercase letters is trivial, this is why LM
    hashes are not secure. Again, there is no salt used, so basically if you can get
    the LM hashes from a system, all you need to do is a look up comparison to other
    known hashes and you can get the actual password. The LM hash is usually stored
    along with the better encrypted NT hash. The combination of the two hashes is
    called an NTLM hash. One odd caveat with Windows NTLM hashes is that if the password
    is greater than 14 characters, the LM hash is not used at all and the contents
    of the LM hash will be invalid. Storing the weak LM hash can also be turned off
    on Windows systems, which is the case in most however operating systems.


    A typical Windows NTLM hash looks something like this:'
