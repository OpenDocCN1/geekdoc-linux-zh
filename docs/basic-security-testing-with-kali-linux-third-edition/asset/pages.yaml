  md: '# Chapter 4

    Reconnaissance with Recon-NG


    The first step performed by both professional penetration testers and hackers
    alike is information gathering. They want to learn as much about their target
    as possible, to make their task easier. So, let''s begin this journey by looking
    at reconnaissance tools. There are several tools in Kali Linux to aid in information
    gathering & reconnaissance. Maltego is a very popular tool, one that is covered
    quite a bit in security books and training seminars. As it already has a lot of
    coverage, I figured we would look at some of the other tools included in Kali.
    In this chapter we will take a close look at ‘Recon-NG’ and in the next chapter
    we will cover ‘Shodan’. The last chapter in this section will cover several additional
    recon tools.


    # Recon-NG


    **Tool Author:** Tim Tomes (LaNMaSteR53)

    **Tool Website:** https://bitbucket.org/LaNMaSteR53/recon-ng

    **Tool Usage Guide:** https://bitbucket.org/LaNMaSteR53/recon-ng/Wiki/Usage%20Guide


    The Recon-NG Framework is a powerful tool that allows you to perform automated
    information gathering and network reconnaissance. Recon-NG automates a lot of
    the steps that are taken in the initial process of penetration test. You can automatically
    hit numerous websites to gather passive information on your target and even probe
    the target itself for data. It has numerous features that allow you to collect
    user information for social engineering attacks, and network modules for network
    mapping and much more.


    Think of Recon-NG as Metasploit for information collection. Basically, you can
    use Recon-NG to gather info on your target, and then commence your attack. Anyone
    who is familiar with Metasploit will feel right at home, as the interface was
    made to have a comparable look and feel. The command usage and process flow are
    also very similar.'
  merge: -1
  pgno: 49
- img_proc: true
