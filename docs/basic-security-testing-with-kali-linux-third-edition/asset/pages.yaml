    # Other Bypass UAC Modules


    As mentioned earlier in this chapter there are other Bypass UAC modules available
    in Meterpreter. Some work better than others, and some are blocked by anti-virus
    for a while, only to be updated and work again. So, if one doesn''t work, you
    can always try one of the other modules.


    At the msf prompt, and with an active administrator level session:


    Enter "search bypassuaac"


