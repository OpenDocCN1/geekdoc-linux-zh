  md: 'Before we go on, notice the other options available. There are several alternative
    attack options available here including:


    +   * Metasploit Browser Exploit - Attacks the client system with Metasploit browsers.

    * Credential Harvester Attack - Clones an existing website (like Facebook) and
    stores any credentials that are entered into it.

    * TabNabbing - Works if the client has a lot of browser windows open, it waits
    a certain time then switches one of tabs to a page that creates.

    * Web Jacking Attack - Uses iFrame replacements to make a malicious look legit.

    * Multi-Attack - Combines several of the above attacks.

    * HTA Attack - An attack that uses HTA files and PowerShell Injection.


    For now, we use the Java Applet attack. But I highly recommend that you check
    out the other options to see which is the best and how they might be in different
