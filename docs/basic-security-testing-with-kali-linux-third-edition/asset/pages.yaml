- img_proc: true
  md: 'Mana is fascinating to watch. Once someone connects, Mana will display and
    store creds and cookies detected as the target surfs the web. You can also view
    Mana creating secure certificates on the fly to bypass secure communications.


    +   - When done, press "Enter" to stop Mana. You may have to hit "Ctrl-c" if it
    doesn''t respond after a while.


    +   - To see what live log sessions you have captured "./firelamb-view.sh" to
    view captured authentication cookies.


    This asks which session you want to try from the captured cookie sessions. It
    then tries to open the session in Firefox. If the user is still logged in you
    could take over their session. So, if they logged into their e-mail account, you
    could possibly mirror their login and access to their online e-mail account.


    You can also review the log files manually in `/var/lib/mana-toolkit`. Viewing
    the log files, I was able to see a clear text login from my Android device:


    ```

    2015-08-30 20:27:26.201 POST DATA (login: --REDACTED--com): loginfmt=cyberberams%40&login=cyberberams&password=password

    ```


    The first line shows what the website user logged in and the second shows their
    username and password. This would have been normally done via encrypted https
    and not viewable, but Mana displays it in plain text. You can also find a list
    of all the websites that the user visited.


    # Captive Portal


    As mentioned earlier, Mana also comes equipped with a "Captive Portal" imitator.
    If you have ever used Wi-Fi at a fast food restaurant, hotel or "internet cafe"
    then you have a captive portal. a captive portal is a secure way to share internet
    with public users.


    To start Mana in an environment with no upstream:


    From the "run-mana" directory, enter "./start-noupstream-all.sh"


    > Note:


    > All the Mana "noupstream" scripts seem to error out at the time of the writing.
    There are several open support tickets on the issue, so it may be fixed by this
    is published.


    If you start the main Kali IP address in a browser, you will see that the default
    webpage has changed. It now mimics a captive portal Wi-Fi login:'
  merge: -1
  pgno: 355
- img_proc: true
  md: '![](img/37a3b7ef116f9ef991f9e33dd8b348c7_356_0.png)


    The captive portal "allows" the target system access to the internet by asking
    them to first log in using the following popular options:


    +   - Google

    - Facebook

    - Twitter

    - Microsoft

    - Local


    Once they "login" with their credentials, Mana allows them to connect out to the
    internet if internet is available. Another interesting thing that Mana can do
    is impersonate any other Wi-Fi routers that it finds. Seen in the screenshot below:


    | Wi-Fi |

    |---||

    | Death Star |

    | Hoth |

    | Terminator |

    | Real Wi-Fi | Terminator | |

    | Fake Wi-Fi | Terminator |'
