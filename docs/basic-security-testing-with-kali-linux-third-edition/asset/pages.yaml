  md: '# # Chapter 13

    Man-in-the-Middle Attacks


    One technique that may be advantageous to a security tester to monitor or capture
    network traffic. Packet captures are somewhat like a phone wiretap. As a wiretap
    records everything a person says on their telephone, a packet capture records
    everything your computer says on the network wire. This could include account
    names, passwords, etc. One of the easiest ways to capture or view packets for
    an attacker is using a Man-in-the-Middle Attack.


    # ## Introduction


    In this section we will be looking at network packets using two different processes.
    For the first one we will use a Man-in-the-Middle (MitM) attack on a local network
    system using the commands arpspoof, urlsniff and driftnet. These commands allow
    us to view which website a target is on and display some of the graphics that
    the target is viewing. Secondly, we will cover running a packet capture on a remote
    machine through a Metasploit session. We will then view the captured information
    for artifacts in Wireshark and Xplico. In both cases we will use the Windows 7
    VM as the target system.


    A MitM attack in essence places the Kali system in between the target and the
    router. Thus, we see all of the traffic coming from and going to the target system.
    All traffic from the target system headed to the internet is re-routed first to
    our machine, which then captures it and forwards it to the network. All information
    coming from the internet headed to the target machine is routed through our system
    first, again so we can review it, and then forwarded to the target system.


    We can see this in the following image:'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# Normal Communication


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_184_0.png)


    Normally User Alice connects directly to the internet through her router. With
    a Man-in-the-Middle attack the hacker inserts himself into the middle of the normal
    communication path and can see a copy of everything that Alice sends to the internet
    and everything is returned from it.


    # Man-in-the-Middle Attack


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_184_1.png)


    This is accomplished by modifying the ARP (Address Resolution Protocol) tables
    on the router and the target system. The ARP table tellsa what physical MAC address
    an IP address is actually located at. So, as the attacker, we tell the target
    machine that we are the internet router and tell the router that we are the target
    system effectively placing us into the middle of the communication stream. There
    are a lot of tools that you can use to perform MitM attacks. Arpspoof is one that
    has been around for a very long time and is still a go-to tool. We will see how
    to create a MitM attack using Arpspoof and then use other tools to view the network
    traffic.


    Note:


    Some advanced Anti-Virus Security Software protects the ARP table from MitM attacks.


    # Creating a Man-in-the-Middle attack with Arpspoof'
  merge: -1
  pgno: 184
- img_proc: true
  md: "We can modify ARP tables easily with arpspoof, but first we need to turn on\
    \ IP forwarding by running the following command:\n\n+   1. Open a terminal and\
    \ type, `echo 1 > /proc/sys/net/ipv4/ip_forward` \nNext, we need to run the arpspoof\
    \ command. To do so, we need to provide the network interface (-i), the target\
    \ system (-t) and the router address as below:\n2. Then, type, `arpspoof -i eth0\
    \ -t 192.168.1.93 192.168.1.1`\n\n```\nroot@kali:~# echo 1 > /proc/sys/net/ipv4/ip_forward\n\
    root@kali:~# arpspoof -i eth0 -t 192.168.1.93 192.168.1.1\n```\n\n+   3. Now,\
    \ open a second terminal and type, `arpspoof -i eth0 -t 192.168.1.93`\n\nThis\
    \ is basically the same command; except the computer's IP and the router's IP\
    \ are switched. Arpspoof should then start sending the modified MAC addresses.\
    \ Now let's see what we can capture from the target system.\n\n# Viewing URL information\
    \ with Ulsnarf\n\nTool author: Dug Song\n\nTool Website: https://www.monkey.org/~dugsong/dsniff/\n\
    \nFirst, we will see if we can capture addresses while the target is surfing the\
    \ Internet.\n\n```\nroot@kali:~# ulsnarf -i eth0\nulsnarf: listening on eth0 [tcp\
    \ port 80 or port 8080 or port 3128]\n```\n\nNow as the Ulsnarf shows on the web,\
    \ we will see all of the traffic:\n\n```\nulsnarf: listening on eth0 [tcp port\
    \ 80 or port 8080 or port 3128]\nDESKTOP-AT708RE - [12/Jun/2018:13:57:39 -0400]\n\
    HTTP/1.1 \"*\"\n192.168.1.93 - [12/Jun/2018:13:57:26 -0400] \"GET http://download.mozilla.org/?product=firefox-43.0.1-completed&lang=en-USUSHTTP/1.1\"\
    \ \"-\" \"Mozilla/5.0\n(Windows NT 6.1; rv:39.0) Gecko/20100101 Firefox/39.0\"\
    \n```\n\nThis allows us to see all the website addresses that the user visits\
    \ on our Kali system!\n\n+   2. Hit, `Ctrl-c` to exit ulsnarf\n\nUlsnarf can be\
    \ handy when you want to see what the target is doing on their system. It will\
    \ not decode encrypted communications; you will need different tools to accomplish\
    \ that. We talk about some of these tools a little later in the book."
