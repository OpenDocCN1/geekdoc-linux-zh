  md: '# # Chapter 21

    Cracking Linux Passwords


    Just as password hashes have been hacked in Windows, the same can be done with
    Linux machines. All you need is root level access to obtain the hashes and a good
    password attack tool to crack them. In this chapter we will use John Ripper to
    try our hand at cracking Linux passwords. We will then cover several other tools
    that can be used to crack server application passwords and perform automated attacks.


    Before we get into the meat of this chapter let''s look at some actual Linux password
    hashes. Below are 2 Linux password hashes, the first is from Metasploit2, the
    second is a user made on my Kali Linux box.


    +   1. msfadmin:$1XN10jc$Rt/zzCW3mlTUWA.ihZJA5/

    2. dan:$6mIC/IQYEAsAHWW.2J2561YukO.Amliru4JCN9vkwcyzFdnynlrJG

    6FfcjV0Sd70CSmXOSp9mxthr11yOR4QTSpPJCNY/


    The big difference between NTLM passwords and Linux passwords, is that Linux passwords
    are salted. The salt is a unique string that is used to encode each password making
    password hashes different even if two users used the exact same password. This
    no two hashes are ever the same. We break down the contents of the password hash:


    | msfadmin:$1XN10jc$Rt/zzCW3mlTUWA.ihZJA5/ |

    | ↓ ↓ ↓ |

    | 1 2 3 4 |

    | 1. Username: msfadmin |

    | 2. Encryption Type: 1 |

    | 3. Salt: XN10jc |

    | 4. Password Hash: Rt/zzCW3mlTUWA.ihZJA5/ |


    Part 1 is the username. Part 2 is the encryption type, an encryption type of 1
    means that it is 128-bit encryption. Part 3 is the salt used for this password
    hash. Lastly, Part 4 is the actual hash.'
  merge: -1
  pgno: 293
- img_proc: true
  md: 'The second hash from the newer version of Linux is formatted in the exact same
    way, but it is much longer. This hash is an encryption type of 6, which means
    that it is using 512-bit encryption, thus the much longer hash. This is a much
    stronger encryption, but there is really nothing different we we need to do when
    cracking them, as John the Ripper will automatically detect the correct hashing
    algorithm and crack it accordingly.


    I don''t know if you realized it when we were cracking the Windows NTLM passwords,
    but two of the Windows''s hashes were identical. Both users Alice and Dan used
    the password of "password":


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_294_0.png)


    This is because Windows NTLM hashes do not use salts. So, if two or more users
    use the same password in Windows, the NTLM password hash will be the same. This
    is not so in Linux. If users use the same password, the salt will create a different
    hash for each user. The hashes below are from two users (Dan and Alice) who used
    the password of "password" in Kali Linux:


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_294_1.png)


    Notice the hashes are completely different from each other (as are the salts).
    This make a huge difference when cracking passwords in large password hash dumps
    as you always have users that use the same password. If a salt isn''t used you
    get all the identical passwords in one shot, if they are salted, you have to crack
    each hash individually. Okay, enough talk about the hash format, let''s see how
    to get Linux password hashes from a system.


    # Obtaining Linux Passwords'
