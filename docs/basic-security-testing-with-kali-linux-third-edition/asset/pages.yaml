  md: '# Wordlist Generator Tools


    Several tools in Kali let you make your own personalized wordlists. CeWL is pretty
    useful as it lets you create passwords by grabbing information from a target website.
    Crunch is nice as it allows you to create your own custom wordlists from scratch.
    Let’ take a closer look at how to use these tools.


    # CeWL


    **Tool Author:** Robin Wood


    **Tool Website:** http://digi.ninja


    CeWL is a great tool for creating company or theme-based wordlists. Many times,
    a user will create a password using words that relate to where they work or what
    they do. CeWL crawls a target website and builds a custom wordlist file found
    on the site.


    ```

    CeWL 5.3 (Heading Upwards) Robin Wood (robin@digi.ninja)

    Usage: cew [OPTION] -- URL

    --help, -h: show help

    --keep, -k: keep the downloaded file

    --depth x, -d x: show depth to spider, default 2

    --min_word_length, -m: minimum word length, default

    --offsite, -o: let the spider visit other sites

    --write, -w: filter the output to the file

    --user-agent, -u: user agent to send

    --no-words, -n: don''t output the wordlist

    --meta, -a include meta data

    --meta-file: output file for meta data

    --email, -e include email addresses

    --email-file: output file for email addresses

    --meta-temp-dir: output to the temporary directory

    --count, -c: show the count for each word found

    ```


    To use CeWL, just provide the options that you want and the target URL. For example,
    if we wanted to spider the website, "cyberarms.wordpress.com", to a depth of 1
    (-d 1) pull any words six characters or longer (-m 6) and save it as "cyberarms.txt"
    using the following command:


    ```

    cewl -w cyberarms.txt -d 1 -m 6 https://cyberarms.wordpress.com/

    ```'
  merge: -1
  pgno: 273
- img_proc: true
  md: '```

    root@kali:~# cew -w cyberarms.txt -d 1 -m 6 https://cyberarms.wordpress.com/

