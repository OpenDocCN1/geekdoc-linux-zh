    # # Logging


    This is basically a continuation of the previous topic. Make sure security logging
    is enabled on critical switches, routers, firewalls and systems. Preferably have
    critical devices and systems send security logs to a syslog server so you can
    have a secondary copy of them (in case hackers wipe system logs) and to make incident
    response aware when the worst does happen. This helps in tracking malicious users
    and traffic across devices if the basic level firewall routers


