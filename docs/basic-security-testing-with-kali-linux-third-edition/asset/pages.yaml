  md: '# Adding API Keys


    To perform more advanced searches in Recon-NG using services like Shodan, YouTube
    and Twitter, you will need to acquire Developer API keys from the corresponding
    service.


    > **Warning:**


    Using Recon-NG to scan for user information might violate some company''s Developer
    API Usage Policies. Read usage policies carefully before continuing.


    The process to acquire developer API keys is different for each service. For instructions
    on acquiring these keys, see "Acquiring API Keys" on the Recon-NG user guide webpage:


    https://bitbucket.org/LaNMasteR53/recon-ng/wiki/Usage%20Guide#acquiring-api-keys


    As some of the API policies no longer permit using their service to scan users
    for information, I will not cover Recon-NG modules. But basically, once API keys
    are obtained they just need to be set in the program. This is done using the **keys**
    command:


    Type, **keys help**:


    ```

    [recon-ng][default] > keys help

    Manages framework API keys

    Usage keys [list|add] | add specific keys.

    ```


    Use, **keys add [manufacturer] [api key]** to add API keys. Recon-NG will not
    use the API key with the corresponding service when the module is executed.


