    # Kali-Pi Wrap-Up


    In this brief introduction to Re4''s Kali-Pi, we covered how to install the pre-configured
    image on a Pi3 and how to run the Mana Toolkit. Kali-Pi is a fully functional
    Kali Linux platform which can be expanded by installing additional Kali Metackages
    (though I run into some errors when trying to install a couple of the packages).
    Re4son also makes a DV-Pi (Damn Vulnerable Pi) that could be used for IoT pentesting,
    which is well worth checking out. Before we end this chapter, let''s take a look
    at another Kali based Pi image, "P4wnP1".


    # P4wnP1


    Tool Author: MaMe82


    Tool Website: https://github.com/mame82/P4wnP1


    P4wnP1 is one of my favorite RPi pentesting implementations. Though not a Kali
    Linux tool, I thought it definitely worth mentioning. P4wnP1 is a programmable
    penetration testing tool and runs on the Pi Zero or Pi Zero. It has multiple features
    including remote backdoor, keyboard entry attacks and Hak5 Rubberucky like payloads.
    Just program the P4wnP1 to do what you want, then plug it into a target system
    USB port and watch the magic. P4wnP1''s are great on physical security pentesting
    trials, as all you need to plug it into a computer to get a remote backdoor into
    the company.


    For this tutorial I used a Pi Zero with a 16GB SD card. I wrote an "how to" article
    for P4wnP1 including installing instructions on my blog, link in the resource
    section, so this will just be a quick overview. This is a very active project
    with the author adding new features very frequently, so it is a good idea to check
    the author''s site for updated install instructions. The install process is basically
    a two-step process, installing Raspian Stretch Lite & modifying some of the boot
    files, and then installing P4wnP1.


    +   Follow the Raspian Stretch install instructions & file modifications my blog
    (Link in Resources).'
