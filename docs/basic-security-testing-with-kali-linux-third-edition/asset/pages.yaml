  md: '# Kismet


    Tool Author: Mike Kershaw


    Tool Website: https://www.kismetwireless.net/


    If you just need to scan your company to see what Wi-Fi networks are available
    and need to create a report on it, Kismet is a great tool. Kismet does an amazing
    job of finding and recording access points & clients and logs them in several
    formats. Though you really don''t hear much about it anymore, Kismet is one of
    the main tools used for wardriving.


    # Scanning with Kismet


    +   Start Kismet from the menu "Applications > 06 - Wireless Attacks > kismet"
    to see its inputs, or just type, "kismet" at a terminal prompt:


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_358_0.png)


    +   Click "OK" as "Kismet is running as root" message.


    +   Click "Yes" to start the Server.


    +   At the Server Options screen you can just take the default values and select
    "Start",'
  merge: -1
  pgno: 358
- img_proc: true
  md: '![](img/37a3b7ef116f9ef991f9e33dd8b348c7_359_0.png)


    5. At the “Add a Source Now” prompt click “Yes”.


    6. In the “Add Source” pop-up window type your wireless card interface name on
    the Intf_ line. You can use “wlan0” or even “mon0” if your Wi-Fi card is already
    in monitoring mode. Optionally you can add a descriptive name for your interface.
    Then click “Add”:


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_359_1.png)


    And is that it! Kismet will begin recording all wireless devices and packets that
    it sees.


    7. Click the “Close Console Window” button to close the console screen to the
    graphical interface:


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_359_2.png)'
