  md: '3. At this point just let it run for a while. You will see wireless networks
    begin to fill in as they are found. When you feel you have found enough, or have
    found the ones you are looking for, hit "Ctrl + c".


    4. You will then be asked what Wi-Fi networks you would like to attack:


    | NUM ESSID | CH | ENCR | POWER | WPS? | CLIENT |

    |---|---|---|---|---|--|

    | 1 Terminator | 11 | WPA2 | 70db | no | clients |

    | 2 dlink | 1 | WPA2 | 51db | wps | clients |


    You can pick an individual one, pick by separating them with a comma, or just
    type ''all'' to attack all of them. Things to notice here:


    NUM is the number of the Wi-Fi network that you want to attack

    ESSID lists the ESSID or network name

    CH is the channel the network is communicating on

    ENCR is the type of encryption the network is using (Open, WEP, WPA, WPA2)

    POWER is the power level in decibels

    WPS tells if Wireless Protected Setup (WPS) is enabled

    CLIENT tells you how many clients are connected.


    Notice WiFi also detected the hidden router and displayed the name, "Termator".


    +   5. WiFi found my test "dlink" router and listed it as number 2. So, I entered
    "2" as the target.


    WiFi immediately begins to automatically attack WPS first using the newer "Pixie
    Dust" attack. That did not work on mine so it began attempting to crack the WPA
    key. If it is able to crack the key with the default wordlist, it displays it,
    if not still saves the captured handshake in the current directory.


    # Cracking WPA Handshake Files'
