- img_proc: true
  md: '# Determining Hash Type & Cracking LM Passwords


    Computer operating systems and applications normally store passwords in an encrypted
    form called a password hash. The hash is a cryptographic representation of the
    actual password. Therefore, the hash will need to be unencrypted or cracked to
    find the true password. Surprisingly, some services store or transmit passwords
    in plain text! We will talk about a little later in the Mimikatz chapter. But
    for the most part security tests, when you recover a user''s password it will
    be in the encrypted hash form.


    There are many different types of encryption used when creating hashes. In this
    chapter we will first talk about determining what type of hash you may have recovered.
    Then we will talk about the simple (and outdated) Microsoft LM password hash and
    see how these can be cracked online. We will cover password cracking with cracking
    tools in greater depth in an upcoming chapter.


    # Not sure what Kind of Hash have you?


    There are several different types of hashes that you will run into when you start
    cracking passwords. Some of the most confusing ones are the Windows hashes. Let''s
    try to explain these quickly.


    +   **LM Hash** — Outdated password hash that goes back to the old Lan Manager
    days. LM hashes are no longer stored by default, but you might still find them
    creeping about.


    +   **NTLM** — Comprised of the LM hash and NT Hash (NTHash), separated by a colon.
    This is what you will find when you dump passwords from a Windows SAM Database
    or a Domain Controller''s database. NTLM Hashes can be passed in "Pass the Hash"
    type attacks. **NTLMv1 or NTLMv2** — These are challenge response, NTLMv2 is more
    secure. You will capture these hashes when you use a program like Responder. You
    can use these hashes in relay attacks like we saw in the Responder chapter, though
    you can''t relay back to the source machine, it has to be a different system.
    You can disable the weaker NTLMv1 hashes but you will need to see if this is a
    viable solution in your network, especially if you have legacy systems.'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'To make matters more confusing NTLMv1/ v2 hashes are also called Net-NTLMv1
    or Net-NTLMv2. We will talk about all of these more as we go through this section.


    Sometimes you might be able to retrieve a password hash, say from a database or
    software app, but might not be able to determine what type it is by glance. You
    need to know the correct type so you can tell the cracking program what decryption
    algorithm to attempt. There are a couple hash identification programs in Kali
    that will try to identify the type of hash that you provide:


    # “Hash-identifier” and “Hash ID”


    We will take a quick look at each program.


    # Hash-Identifier


    Simply run Hash ID and input the Hash. The program will check it and return the
    most likely types of hash it could be along with least likely types.


    Open a terminal prompt in Kali


    Type, “hash-identifier”


    Paste in the LM hash below and Hash Identifier will try to determine what type
    it is: As seen below:


    > 88467faee8fb117ad06bdd830b7586c”


    ```

    root@kali:# hash-identifier

    ################################################################

    # #                                                               #

    # #      _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  #

    # # /                                                               #

    # #                                                v1.1 #

    # #                                     www.blackploit.com #

    # #                               Root@blackploit.com #

    # #                                                               #

    ################################################################

    NHASH: 88467faee8fb117ad06bdd830b7586c

    Possible Hashes:

    [+] MD5

    [+] Domain Cached Credentials - MD4((pass)).tolower($username))

    ```


    HashID returns the most likely used encryption, and then multiple “Least Possible”
    encryption types. When finished, use **(Ctrl-c)** to exit out of Hash-Identifier.


    # Hash ID


    Hash ID is a very similar program:


    At a terminal, enter, “hashid”'
