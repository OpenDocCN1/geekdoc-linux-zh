  md: '# # Chapter 16

    Social Engineering Introduction


    Social Engineering is the system of manipulating people to falsely gain their
    trust in order to get information, system access or data from them. Social Engineering
    is, in effect, hacking humans. Hack who are experts in Social Engineering will
    trick you into helping them or giving them access to your secured systems or areas
    by pretending to be someone else, someone in need, or even someone in a position
    of authority.


    Let''s look at work at some examples:


    You are coming into work at your secure data center. As you approach the door,
    a deliveryman with his arms full of boxes is also arriving at the door. What do
    you do? Without thinking twice, most would open the door for the poor overburdened
    man and let him in. What if he wasn''t a real deliveryman and just wanted access
    to your secure data center? You just let him in.


    You are in your cubicle and approached by a person wearing a shirt and tie, carrying
    a clip board and toolbox. He says that he is performing system upgrades and needs
    access to your system. It''s close to lunch so it sounds like you are going to
    get an extended lunch. What if you should shut it down, and he responds that he
    just needs to check a few things first. You get up and head for the cafeteria,
    and just give him access to your system.


    You are the CEO of a major company. One day you get a package in the mail from
    a company that you just signed a major deal. It was the largest deal of your career
    and was in all the local city newspapers and on all the TV stations. You open
    it up to find one of the latest tablets with a thank note from the company thanking
    you for the business agreement. It has all the bells and whistles and you can''t
    wait to connect it to your executive Wi-Fi network to try it out, which you do.  The
    company never sent you a tablet and you just gave an enterprising social engineer
    system connected to your Executive network.


    You get an e-mail from the IT manager at your company. They are installing some
    upgraded software and need you to install some new drivers. They include the software
    package as an attachment and'
  merge: -1
  pgno: 235
- img_proc: true
  md: 'you full directions to install it. Which you do. The e-mail wasn’t actually
    from your IT Manager and you just gave a remote hacker complete control of your
    workstation.


    Social Engineers may take advantage of local customs, etiquettes, play off of
    human sympathy or just try to intimidate an employee to get what they want. They
    may do none of these direct contact things and simply go through your corporate
    garbage receptacles, scour for clues of your internal systems by reading job postings
    or online scan tech forums used by your support staff. Or they could just social
    media sites pretending to be from a company that you do business with or pretending
    to be a head hunter employment agency looking for new talent and connect.


    These are just a few examples of how a social engineer might try to gain access
    or procure information about a target network. There really is no limit to the
    ways that a talented social engineer might try to deceive, deceive or threaten
    their way onto your network. There is an exceptional video filmed during a Defcon
    showing Real Future’s Kevin Rouge Hadnagy (founder, Social Engineering Inc) and
    Jessica Clark to try to social his cell phone account giving him his e-mail address.
    Clark spoofs his cell phone number, calls the company pretending to be his wife
    and while playing a video of a crying baby in the background gets not only his
    e-mail address, but full access to his phone account. It is really something to
    see.


    I worked in IT support for fifteen years and you wouldn''t believe the things
    I have seen companies users do. In that time, I can count on one how many times
    I have been asked to verify my identification and I was inside major entities
    across New York and Pennsylvania. If you are carrying a clip board and wearing
    a tie, people usually give you a wide berth. They are also very helpful at providing
    information. I was in a large manufacturer and needed a password for a computer
    that needed service. The user was not available, but thats that problem, all the
    other users in the department knew the user’s password and were more than willing
    to share it with me.


    Once I showed up to a large corporation on a server warranty support call. The
    receptionist didn’t know I was coming, and didn’t know where the server team was,
    so they did when they thought was best. They locked me out in their data center
    for an hour until they could find an administrator.


    Let alone the times I have seen secure data center doors blocked, outside access
    doors left open by masters, reception desks unmanned with a public access network
    connected computer in the lobby, passwords publicly displayed, and the list goes
    on and on. These are just a few examples of situations that could have been taken
    advantage of by a Social engineer.'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# Social Engineering Defense


    With that being said, it is imperative to train your employees to be on the lookout
    for these types of attacks. Have policies in place to deal with service calls,
    software updates, and gifts from outside companies. You can teach, instruct and
    even leave reminder messages and posters, but employees may still not follow corporate
    policy. That is why when it comes to social engineering attacks, it is a good
    idea to manually test if your company is truly prepared. There are a lot of social
    engineering-based tools available, but when dealing with something important you
    want to go with a tool that is trusted. One tool is included in Kali. In this
    chapter we will look at The Social Engineering Toolkit, a set of tools that security
    teams can use to test their company’s preparedness against these types of attacks.


    # The Social Engineering Toolkit


    Social engineering attacks are one of the most techniques used against networks
    today. Why spend days, weeks or months trying to penetrate layers of network security
    when you can just trick a user into running a file that allows you full access
    to their machine and bypasses anti-virus, firewalls and intrusion detection systems?
    This is most commonly used in phishing attacks - Craft an e-mail or create a fake
    website that tricks users into running a malicious file that creates a backdoor
    into their system. The problem for defenders and security staff is how you test
    this against your network? Would such an attack work, and how could you defend
    against it?


    Kali includes one of the most popular social engineering attack toolkits available,
    David Kennedy’s Social Engineering Toolkit or "SET”. David’s team is very active
    on SET, there seems to be updates, new features and attacks being added frequently.
    Several non-social engineering tools have been also added to SET making it a very
    robust attack tool. In this chapter we will take a look at some of the tools included
    with SET and two of the attack options, both PowerShell


    # Staring SET


    SET can be started from either the Kali Main Menu or from a terminal prompt:


    +   Applications > 13 - Social Engineering Tools > Social Engineering Toolkit


    Or just enter, "setoolkit" in a terminal'
