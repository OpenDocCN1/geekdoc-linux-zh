  md: "# # Chapter 26 Rouge Wi-Fi Router Attacks with Mana\n\nMana\n**Tool Authors:**\
    \ Sensepost, Dominic White & Ian de Villiers\n**Tool Website:** https://github.com/sensepost/mana\n\
    \nSmart devices that use Wi-Fi are also vulnerable to Rogue Wi-Fi attacks. If\
    \ we setup a rogue Wireless Router and the target connects to it, we can see everything\
    \ the target is doing. If you are running a program like Sensepost's Mana you\
    \ will even be able to see encrypted communication.\n\n> **Warning:**\n you want\
    \ to try out Mana, I highly suggest that you install it on a separate VM copy\
    \ of Kali Linux.\n do not recommend installing Mana on the same VM that you are\
    \ using for the tutorials in this book as it makes several changes that are not\
    \ easily undone.\n\nLike other Wi-Fi router programs Mana creates a rogue wireless\
    \ router, but it is capable of so much more. Mana runs as a user defined access\
    \ point, but it also listens for computers and mobile devices to beacon for preferred\
    \ Wi-Fi networks, which it can impersonate. Once someone connects to the rogue\
    \ device it automatically runs SSLStrip to downgrade secure communications to\
    \ regular HTTP and can bypass/restrict HSTS. This allows the attacker to view\
    \ all session data. Mana also allows you to crack Wi-Fi passwords, grab login\
    \ sessions cookies and let you impersonate these sessions with Firelang. But that\
    \ is not all; it can also impersonate a captive portal and can simulate internet\
    \ access in places where there is no access. See the tool website for more information\
    \ and check out the Defcon 22 Presentation:\n\nhttps://youtube.com/i2-jReLBSVk\n\
    \nMana uses a lot of the tools already installed in Kali and works amazingly well,\
    \ though at the time of this writing I did have some issues getting it to run\
    \ with the latest version of Kali.\n\nEnough introductions, let's see Mana in\
    \ action:"
  merge: -1
  pgno: 353
- img_proc: true
  md: "To install Mana, simply open a terminal and type, “apt-get install mana-toolkit”\n\
    \nIt defaults to using a Wi-Fi adapter Wlan0 and uses the rogue router name of\
    \ “Internet”. If this is okay you don't need to change anything. That's it, you\
    \ are pretty all set to run Mana. All we need to do is run one Mana's program\
    \ scripts located in `/usr/share/mana-toolkit/run-mana`.\n\nThe scripts are:\n\
    \n+   - start-nat-simple.sh\n- start-nat-full.sh\n- start-nounstream.sh\n- start-nounstream-all.sh\n\
    - start-nounstream-eaponly.sh\n- start-nounstream-eap.sh\n\nFor this exercise,\
    \ we will run Mana's main “nat-full” attack script.\n\n+   1. Type `ifconfig`\
    \ to be sure Kui your wireless card:\n```\nroot@kali:~ # ifconfig\nwlan0     \
    \ IEEE 802.1bn SSID:off/any\nMode:Manage Access Point:Not-Associated Tx-Power:20\
    \ dbm\n       Retry start limit:7 RTS thr:off Fragment thr:off\n       Encryption\
    \ key:off\nPower Management:off\n```\n\n+   2. Change directory to `/usr/share/mana-toolkit/run-mana`\n\
    3. Type, `./start-nat-full.sh` to start Mana.\nMana then starts the rogue Wireless\
    \ Router, SSLstrip and all the other tools and begins listening for traffic:\n\
    \n```\nroot@kali:/usr/share/mana-toolkit/run-mana# ./start-nat-full.sh\nhostname\
    \ WRTS5G\nnCurrent MAC: 23:23:04:45:67:2d (Bogus Wi-Fi Mac)\nPermanent MAC: 23:23:04:45:67:2d\
    \ (Bogus Wi-Fi Mac)\nNew MAC: d4:76:bc:2f:21 (unknown)\nConfiguration file: /etc/mana-toolkit/hostapd-mana.conf\n\
    Using interface wlan0 with hardaddr 00:11:00:33:11:00 and ssid \"Internet\"\n\
    wlan0: interface state UNINITIALIZED->ENABLED\nwlan0: AP-ENABLED\nusr/share/mana-toolkit/sslstrip-https/sslstrip2\n\
    Generated RSA key for leaf cents.\nSSLstrip 0.5.2 (built 2018-03-31)\nCopyright\
    \ (c) 2009-2018, Daniel Roethlisberger <daniel@roe.ch>\n```"
  merge: -1
