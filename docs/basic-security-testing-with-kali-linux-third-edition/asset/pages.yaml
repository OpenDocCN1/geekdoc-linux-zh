    | checksum | Retrieve checksum of a file |

    | cp | Copy source to destination |

    | dir | List files (alias for ls) |

    | download | Download a file or directory |

    | edit | Edit a file |

    | getwld | Print local working directory |

    | getwd | Print working directory |

    | lcd | Change local working directory |

    | lls | List local files |

    | pwd | Print local working directory |

    | ls | List files |


    Basically, we use standard Linux commands to get around and differentiate between
    the local system and the remote system. But how do you differentiate that you
    are in a Meterpreter shell, When you are in Meterpreter, the commands are assumed
