  md: 'In this chapter we learned how to install and run Veil-Evasion. We also covered
    how to use Magic Unicorn. We demonstrated both of these tools were able to create
    a remote shell that could bypass antivirus. Remember, these are just two tools
    that can help bypass anti-virus, there are many other tools and techniques available.
    This should help prove that you cannot trust in your Firewall and Anti-Virus alone
    to protect you from online threats. Unfortunately, sometimes your network security
    depends on your users and what you allow them to run.


    Instruct your users to never run any programs or open any files that they receive
    in unsolicited e-mails. Blocking certain files from entering or leaving your network
    is also a good idea. PowerShell logs in Windows can display PowerShell code that
    was executed. Use a Network Security Monitoring system (and logs) to help track
    down what happened and what was compromised if the worst does happen.


    Take some time and play around tools in this chapter. The tool authors frequently
    update the tools to include additional payloads making them useful for security
    testing. See the tool websites for the latest information. Also, see the "Hiding
    Metasploit Shellcode to Evade Windows Defender" link in the Resources section
    for more information on bypassing modern Anti-Virus engines.


    # Resources


    +   - The Veil Framework - https://www.veil-framework.com/

