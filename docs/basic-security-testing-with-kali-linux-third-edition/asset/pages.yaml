    # Conclusion


    In this section we demonstrated how to use Metasploit in Kali to capture key strokes
    from a remote system. We also saw that login passwords will not be recorded normally
    in a keystroke logger as the Windows Logon service uses a different keyboard buffer.
    But if we move our keylogger to that process we can indeed capture login credentials.


    We were also introduced to a handy program that migrates the session to the Winlong
    process, watches the idle time of the system, it locks it and captures the password
    when the user tries to log back in. Lockout_Keylogger automates the entire process
    from beginning to end. The user walks away from his PC, the script waits a certain
    amount of idle time and then puts the computer into locked mode. Then, when he
    logs back in, it is already set to scan the keys pressed.


    Lastly, we covered Problem Steps Recorder. We saw how this built in Microsoft
    support tool could be used as a remote pent tool that provides a stream of screenshots
    with a step-by-step log of the user’s actions. PSR can be disabled in group policy,
    though I did not see anywhere on how to completely uninstall it.


    The best defense against these types of attacks is to block the remote connection
    from being created in the first place, so standard security practices apply. Keep
    your operating systems and AV up to date. Do not open unsolicited, unexpected
    or questionable e-mail attachments. Avoid questionable links, be wary of shortened
    URLs and always surf safely.'
