  md: '# Chapter 15

    Service Poisoning with Responder, Multi-Relay and MITMf


    In this chapter we will discuss how to easily get user credentials (hashes & clear
    text passwords) from a vulnerable Windows network using Responder. We will cover
    how you could get a remote shell on a wired network by using Responder’s Multi-Relay
    tool to “Pass the Hash”. We will deepen our control over the target by using PowerShell
    to create a remote Meterpreter shell. Lastly, we will use responder in the MITMtf.


    +   **Responder** - A pentester go-to tool for LLMNR, NBT-NS and WPAD based poisoning
    attacks. Basically, responder poisons the network and responds to several legitimate
    network service advertisements in an attempt to trick either the service or the
    user into giving up credentials.


    +   **Multi-Relay** - A tool included with Responder that is able to take the
    credentials obtained by Responder and use them in a “Pass the Hash” style attack,
    allowing access to other network systems by re-using the password hash.


    In a Windows network if a network resource cannot be found using DNS, it will
    rely on LLMNR or NBT-NS to find network resources (if enabled). Responder poisons
    these services so it responds to these requests, and in some cases, tricks the
    network into giving up a password hash to connect to the fake service. WPAD is
    also used in some large environments to provide the internet proxy address to
    workstations. Many browsers are set to auto-detect the system proxy by default
    when the internet browser is opened. In a Windows network environment, WPAD provides
    this information. Responder imitates this service'
  merge: -1
  pgno: 215
- img_proc: true
  md: 'and can be used to trick users into giving up their credentials to connect
    to internet services.


    This chapter was originally written as one of my Kali NetHunter (the Android phone
    version of Kali) articles. For the original article I used Kali NetHunter as the
    attack platform and a Windows 2016 Server & Windows 10 Enterprise client in a
    workgroup (non-Domain) environment, and it worked very well. I also tested this
    on a Windows 2012 r2 Server with a Windows 7 client with very similar results.
    So, we shouldn''t have any problems running on our Windows 7 test VM.


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_216_0.png)


    Microsoft has done a lot of work in “Pass the Hash” type attacks and limiting
    their effectiveness. They are not effective as they were in the past, but there
    is still a chance that you could find vulnerable targets. The Multi-Relay attack
    tool relies on SMB signing being disabled on the target network, basically this
    means that the target network must be vulnerable, in some cases means that the
    OS is misconfigured or running older software/services. All current Windows operating
    systems support SMB signing, and it is automatically enabled on Domain Controllers.
    Responder includes a tool called, “RunFinger”'
  merge: -1
  pgno: 216
- img_proc: true
