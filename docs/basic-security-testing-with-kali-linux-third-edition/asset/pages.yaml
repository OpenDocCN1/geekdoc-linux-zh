  md: 'ac93c8016d14e75a2e9b76bb9e8cbb6:8516cd038d1a4dfd1ac3e8eb9113350


    The LM hash is on the left of the colon and the more secure NT hash is on the
    right. The LM and NT hash combined are called NTLM hash.


    # Cracking LM/ NTLM Password Hashes Online


    There are several websites that will allow you to input a Windows NTLM hash and
    it will return the password used (if it is in its lookup table). A Swiss security
    company called Object Sécurité (creator of Ophcrack) has developed a cracking
    technology that uses rainbow tables on SSD drives. Rainbow Tables are large database
    files that contain hashes and the text equivalent. Crackers that use Rainbow Table
    lookups simply look for the hash you provided to see if it has the same, if it
    does, it returns the stored text value. Object Sécurité’s website offers an online
    interface that cracks many LM/NTLM hashes using their rainbow tables in mere seconds.


    (https://www.objectif-securite.ch/en/ophcrack.php)


    Let’s try cracking a hash using this online tool. Here is the Administrator password
    hash from an XP machine:


    Hash:


    aad3b43b51404eeaad3b43b51404ee:31d6cfe0d16ae931b73c59d7e0c089c0


