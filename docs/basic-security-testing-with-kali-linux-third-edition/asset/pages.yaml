  md: '# # Chapter 2

    Installing Virtual Machines


    In this chapter we will setup Kali Linux, Windows 7 and Metasploitable 2 as Virtual
    Machines (VMs) using VMware Player on a host computer. Setting up our testing
    lab using virtual machines makes it very easy to learn offensive security testing
    using Kali. Virtual machines make it possible to run several operating systems
    on a single computer. That way we do not need a room full of computers to set
    up a testing and learning environment. We only need one machine powerful enough
    to run several Virtual Machines at once.


    All the labs in the book were done using a Windows 7 Core i7-6700 system with
    8 GB of RAM as the Virtual Machine host. It had plenty of power to run all three
    of our lab operating systems at the same time with no problem at all. Though 64-bit
    versions should work similarly, I chose 32-bit for the Kali Linux install as some
    of the tools installed in Kali will only run on 32-bit systems. If you have experience
    with Virtual Systems, you can use any Virtual Machine software that you want.
    But for this book I will be using VMware Player as the host software, and then
    install Kali, Metasploitable 2 and Windows 7 in separate VMs running under the
    host.


    When we are done, we should have a small test network that looks something like
    this:'
  merge: -1
  pgno: 24
- img_proc: true
  md: '![](img/37a3b7ef116f9ef991f9e33dd8b348c7_25_0.png)


    Because we will be dealing with vulnerable operating systems, make sure that you
    have a Firewall Router (Preferably hardware) between the Host system and the live
    internet.


    # Install VMware Player & Kali


    Installing Kali on VMware is pretty simple as Offensive Security provides a Kali
    image that you can download, so we will not spend a lot of time on this.


    Download and install VMware Player for your version of OS.


    +   1. Download and install VMware Player


    VMware player versions and even the download location seem to change frequently.
    At the time of writing the current version of VMware Player is "VMware Workstation
    14 Player" which can be run as either the free player for non-commercial usage
    or via license. (https://www.vmware.com/go/tryplayer)'
  merge: -1
  pgno: 25
