  md: '# # Chapter 18

    Pass the Hash


    In the previous chapter we looked at how insecure Windows LM based passwords can
    be, but what about NTLM based Passwords? Windows systems usually store the NTLM
    hash right along with LM hash, the NTLM being more secure. As I mentioned before,
    the LM hash can be turned off, which is the case in newer Operating Systems (or
    just use passwords longer than 14 characters). We have seen how LM hashes could
    be cracked in seconds, but what a lot of people have asked me how much longer
    would it take to access the user account if the NTLM hash was available?


    This is a great question, and the answer is, if certain circumstances are met
    and a certain technique is used, it could take the same amount of time. Let me
    explain, if you can retrieve the LM or NT hashes from a computer, you may not
    need to crack them. Sometimes you can simply take the hash as-is and use it as
    a token to access a system. This technique is called "**Pass the Hash**.\ In a
    way, we talked about passing the hash type attacks briefly in the Responder chapter,
    we will take a look at another way to perform them in this chapter.


    #  Introduction


    The Pass Hash attack is not new, at the popular "BlackHat USA" conference a few
    years ago there was a presentation called, "Still Passing the Hash 15 Years Later¹".
    That should give you some idea how long this hash has been around. I must say
    that some of the techniques used no longer work on updated systems. Anti-virus
    and newer operating systems are catching some of the mechanisms used and blocking
    them. Disabling the older password hashes is helpful, but it is difficult to completely
    remove them from a network. The Windows User Account Control feature in Windows
    7 & 10 blocks a lot of pass the hash type attacks that still work against old
    Windows XP systems. If UAC is disabled, as we will see later in this section,
    an attacker could still pass local hashes.'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'But just when you think Pass the Hash is dead, another tool appears to continue
    the assault. Therefore, it is still worth a look at some of the Pass the Hash
