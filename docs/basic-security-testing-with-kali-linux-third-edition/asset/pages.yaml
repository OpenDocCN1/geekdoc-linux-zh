  md: '# Viewing Captured Graphics with Driftnet


    **Tool author:** Chris Lightfoot

    **Tool Website:** http://www.ex-parrot.com/~chris/driftnet/


    The text is interesting, but you can see see the images from visited URLs also
    using a program called "Driftnet". The Driftnet command doesn''t seem to work
    quite as well as it used to. It only seems to now pull .gif files of a certain
    size. Thought it may not work as well as it once did, it is still an interesting
    program to try.


    +   1. Simply type the command "driftnet" with the interface (-i) you want, like
    this:


    ```

    rootkali:~# driftnet -i eth0

    ```


    +   2. A driftnet window should open up on your Kali website. Maximize it to make
    viewing easier.


    +   3. Return to the target computer system and start surfing the web.


    You should start to see images appearing on your Kali system. Try this out for
    a while to see images show using this technique and what images don''t. When done,
    hit "Ctrl-c" to exit driftnet and then again in each terminal window running arpspoof
    to restore the original ARP tables. There are many other tools you can use to
    view captured packet data, and something to analyze it. We will cover Xplico later
    in this chapter.


