    msf auxiliary(gather/shodan_search) > set QUERY iomega

    QUERY => iomega

    ```


    +   6. Now just type, "run".


    +   7. After a few seconds, you will see a short statistical return and then the
    actual systems found:


    ```

    msf auxiliary(gather/shodan_search) > run

    [*] Total: 22043 on 221 pages. Showing: 1 page(s)

    [*] Collecting data, please wait...


    Search Results

    ============

    | IP:Port | City | Country |

    |---|---|---|

    | | Melbourne | Australia |

    | | La Cuvière | Belgium |

    | Lexington | United States |

    | Lexington Central District | Hong Kong |

    | Milan | Italy |

    ```


    You can change the max number of search page returns, store the data to a file
    or to the database using the ‘set’ command options. If this seems a little confusing,
    don''t worry, we will cover using Metasploit in much greater detail later.


    # Conclusion


    In this section we talked about the Shodan search engine. We covered how to perform
    searches in Shodan using keywords and filters. Next, we looked at a couple of
    Shodan’s new features, and finally we saw how to search Shodan from within Kali
    using the Shodan Command Interface and Metasploit. Unfortunately, there are thousands
    if not millions of unsecured or secured systems that can be easily found using
    Shodan. It is critical that companies know what systems they have publicly available
    on the web. The larger the company is, the more common it is that they have systems
    exposed online that are outdated, open or inadequately secured. Shodan is a quick
    and easy way to find these devices. I highly recommend corporate security teams
    (even small businesses & home owners) search for their IP space in Shodan to see
    what systems they have publicly available on the web.


    # Resources'
