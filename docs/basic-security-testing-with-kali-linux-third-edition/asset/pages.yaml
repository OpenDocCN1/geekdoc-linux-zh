  md: 'Firefox, ftp programs, plus much more. Take some time and check them out. Some
    do require a higher level of access, which we will cover later in the book.


    # Remote Shell


    Lastly, let''s see how to get an actual C:\ prompt from the target. This is extremely
    easy once we have a Meterpreter session.


    Just type the command, "shell":


    ```

    meterpreter > shell

    Process 876 created.

    Channel 6 created.

    Microsoft Windows [Version 6.1.7600]

    Copyright (c) 2009 Microsoft Corporation. All rights reserved.

    C:\Users\Dan>

    ```


    That''s it, we can now run any DOS command that we want. When finished, type "exit"
    to get out of the shell, "exit" to return to Meterpreter, and "exit" one last
    time to leave Metasploit.


    # Conclusion


    In this chapter we learned a lot about Metasploit''s Meterpreter shell. Though
    we covered some of the basics of getting around and using the shell, we only touched
    on a fraction of its capabilities. Hopefully you can see why getting a Meterpreter
    shell gives you a lot more functionality than just using a standard remote access
    shell.


    Grabbing video and sound may seem to be a bit theatrical, but it could be useful,
    especially for Social Engineers. For instance, from video you could have a glimpse
    into the target''s physical environment, possibly even grab images of employee
    badges. Recording sound is interesting too. A social engineer could learn a lot
    about the target facility by being able to have a live microphone inside the building.
    Several years ago, "Sinn3r" from the Metasploit development team showed how you
    could grab recorded audio and search it using AT&T''s Watson speech program and
    Metasploit to look for keywords like "password" or "social security number" See
    the Resources section below for a link to an article explaining this technique.


    # Resources'
