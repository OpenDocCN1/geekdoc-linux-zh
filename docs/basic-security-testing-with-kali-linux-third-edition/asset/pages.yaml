- img_proc: true
  md: 'minimum and maximum length of words, what type of characters to use, and Crunch
    does the rest. Crunch makes heavy use of the charset.list file that is located
    in its install directory - “/etc/share/crunch”. So, you will need to either run
    crunch from that directory or point to the directory with the “-f” switch when
    using the more advanced character sets (shown below).


    Alright, let''s start with an easy one:


    At a terminal prompt, type, “crunch 1 3 -o threeletters.txt”

    This tells crunch to start with a single letter (1) and finish with three (3),
    then saves the output (-o) as “threeletters.txt”. Basically, crunch starts out
    with single letter “a” and cycles through all permutations until it gets to “zzz”.


    Will produce this:


    +   - a, b, c, d, e, f, g, h, i, j, k, etc...

    - aa, ab, ac, ad, ae, af, ag, ah, ai, aj, etc...

    - aaa, aae, aac, aad, aae, aaf, aag, aah, aai, aaj, aak...


    If we play around the options we can create more complex lists.


    Enter, “crunch 3 4 abcde1234 -o alphanumeric.txt” as you seen below:


    ```

    root@kali:~# crunch 3 4 abcde1234 -o alphanumeric.txt

    Crunch will now generate the following amount of data: 35721 bytes

    0 MB

    0 GB

    0 TB

    0 PB

    Crunch will now generate the following number of lines: 7290


    crunch: 100% completed generating output

    ```


    This command creates a wordlist that starts with 3 characters (aaa) and ends with
    four (4444) alpha/ numeric combinations using ‘abcde1234’. This produces a text
    file with strings like:


    aa1, bb3, 2a21, and e3da4


    # Using the Charset.list file


    Crunch’s Charset.list file contains a list of keywords that are pre-defined as
    alphanumeric or symbol strings. We can use these keywords so we don''t have to
    manually type in the characters that we want to use. The file is located in the
    “/usr/share/crunch” directory. If you view the file we can see what keyword sets
    are available:


    ```

    cd /usr/share/crunch

    ```'
