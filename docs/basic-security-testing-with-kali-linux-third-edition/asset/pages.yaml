  md: 'Shodan search capabilities are included in the Metasploit Framework. Using
    the Shodan API key allows you to automate Shodan searches from within Metasploit.
    If you don''t know how to use Metasploit, do not worry, we will cover it pretty
    extensively in later chapters.


    To find systems with Metasploit, simply use it like any other exploit:


    +   1. Start Metasploit using the Metasploit icon on Kali''s Quick Launch Bar.


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_83_0.png)


    ```

    = [ metasploit v8.10.48-dev]

    + 193 exploits - 100 auxiliary - 302 post

    + 536 payloads - 68 encoders - 10 nops

    + [ Free Metasploit Pro trial: http://r-7.co/trymps ]

    ```


    +   2. At the msf prompt type, "use auxiliary/gather/shodan_search":


    ```

    msf > auxiliary/gather/shodan_search

    msf auxiliary(gather/shodan_search) >

    ```


    +   3. Now, "show options" to see what options we need to use:


    ```

    msf auxiliary(gather/shodan_search) > show options

    Module options (auxiliary/gather/shodan_search):

    ```


    | Name | Current Setting | Required | Description |

    | --- | --- | --- | --- |

    | DATABASE | false | no | Add search results to |

    | MAXPAGE | 1 | yes | Max amount of pages to store th |

    | OUTPUT | | no | A filename of format |

    | Proxies | | no | A proxy chain of format |

    | QUERY | | yes | Keywords to want s |

    | REGEX | * | yes | Regex search for a spe |

    | SHODAN_APIKEY | | yes | The Shodan API key |

    | SSL | false | no | Negotiate SSL/TLS for |


    +   4. Type "set SHODAN_APIKEY <API Key Number>" and fill in your API Key Number.


    +   5. Now set the query with the keyword you want to search for:'
