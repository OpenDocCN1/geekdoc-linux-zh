  md: '# Chapter 7

    Introduction to Metasploit


    We will start our journey by learning about the Metasploit Framework. Metasploit
    (Metasploit Pro) is a very comprehensive and feature security testing platform.
    Metasploit gives you a complete framework, or playground for security testing.
    The Metasploit Framework (MSF) is a complete platform for performing vulnerability
    testing and exploitation. It is loaded with well over a thousand exploits, hundreds
    of payloads and multiple encoders.


    In this chapter, we will cover the basics of using Metasploit. In a later chapter
    we delve deeper into how to use Metasploit against a test target. This chapter
    will mostly be a walkthrough of how to use Metasploit, so don''t worry if you
    don''t understand everything. We will cover the process in greater detail later.
    This chapter is more of an introduction to the process and flow of Metasploit.
    If you are already familiar with using Metasploit then feel free to skip this
    chapter or use it as a refresher.


    # Updating Metasploit


    Normally to update Metasploit, you simply run “msfupdate", but since Kali was
    updated to the “Rolling” version the Metasploit updates are supposed to be synced
    to update weekly with Kali. So, you may not have the latest Metasploit capabilities
    as soon as they are released, but this ensures the best compatibility with the
    Kali Linux platform.


    # Metasploit Overview


    You can start Metasploit a couple of different ways, from the menu or from a terminal
    prompt.


    Or by just typing “msfconsole” in a terminal'
  merge: -1
  pgno: 96
- img_proc: true
  md: 'But the easiest way is just to click the Metasploit Framework button on the
    Quick Launch bar:


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_97_0.png)


    Starting MSF from the quick launch bar ensures that the database server is running
    and creates the necessary databases if needed. It then starts Metasploit. Once
    Metasploit loads, you will see the title screen and be given an **"msf >"** prompt:


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_97_1.png)


    Taking notes in notepad? Have Metasploit Pro track & report your progress and
    findings learn more on http://rapid7.com/metasploit


    ```

    ```

    metasploit v4.11.0 .

    - 88 exploits auxiliary - 259 post

    - 437 payloads - 38 encoders - 8 nodes

    - Free Metasploit Pro trial: http://r.co/trymd

    ```

    ```


    msf > Notice the "Missile Command" banner above the msf prompt. Metasploit contains
    several of these cool screens and one is displayed at random on'
