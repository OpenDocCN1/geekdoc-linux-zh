    All right, enough talk, let''s see this in action!


    # Using Nethunter


    When Nethunter boots up it looks like any other Android phone, other than the
    epic Kali boot screen. Kali Nethunter has multiple tools found in a regular Kali
    Linux install. It also presents you with a menu system accessible from the "Nethunter"
    icon:


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_388_3.png)


    There are some great tools here like "HID attacks" - This allows you to turn your
    phone into an USB keyboard that actually types commands on the target system when
    your phone is connected. There is also the MITM Framework which allows you to
    do more advanced MITM attacks than we will cover in this chapter. Of course, you
    can also run Nmap scans, start Kali Services and'
  merge: -1
  pgno: 388
- img_proc: true
  md: 'several other things. Don''t forget that you have many of the Kali tools installed
    in the file system itself, so you can open a terminal prompt and run them just
    as you normally would.


    # MitM DNS Spoofing with cSploit


    Along with the Kali tools,Hunter also installs several additional tools that are
    very helpful to a penetration test cSploit. cSploit is probably the fastest way
    on the phone to scan a connected network and perform basic attacks, including
    MitM. Just tap the cSploit icon to start the application. It will immediately
    perform a quick scan of all systems connected to the network. You will then be
    shown a list of all the network devices along with their name, MAC & IP addresses
    along how many ports were detected on each device.


    Clicking an individual target will give you a list of scans and attacks that can
    run against the target:


    ![](img/37a3b7ef116f9ef991f9e33dd8b348c7_389_0.png)


    Trace and port scanner are self-explanatory. Service inspector runs an in-depth
    scan with service detection. Once this is done, you can then click the “Exploit
    Finder” button to find exploit for any vulnerabilities found during the Service
    inspection.


    Let''s take a look at the MITM attacks:'
  merge: -1
