- pgno: 83
  md: 'We can also work with some adjustments to our browser settings. Most browsers
    will have some options in place to help us adjust how much privacy and security
    is present while we are browsing online. These can help us to lower some of the
    risks of a malware infection reaching the computer and hackers getting on and
    attacking the device. Some of the browsers out there will even enable you to tell
    a website that you would not like it to track your movements, simply by going
    through and blocking the cookies.


    We have to keep in mind though that while we have these options, a lot of them
    is disabled by default, so it is possible that you are exposed or show off more
    information than is needed each time you get online. The good news is you are
    easily able to go to your chosen browser settings and make the adjustments needed
    on most of the common Internet options you want to use.


    While we are on the topic of computer safety, we need to make sure that the system
    has anti-spyware and antivirus software on it. This is because any system or machine
    that is connected back to the internet will have some kind of vulnerability when
    it comes to threats from a hacker. Antivirus software can help, even though we
    must remember that it is not going to catch everything. And while it is possible
    to find some free options to work with out there, the paid programs are not that
    much more expensive and can often be a much better option to work with.


    Spyware is another option that the hacker can use against us if we are not careful.
    It is a malware designed to secretly infect some of the computers it touches,
    and then it will just sit in the system, gathering up information and sending
    it back on to the hacker. The information is pretty sensitive in nature most of
    the time and can lead to a lot of problems for the target. Having some'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'anti-spyware software on your system will help prevent this kind of attack,
    and will keep your system safe and sound.


    And finally, we need to take a look at how we can password protect any of the
    software that we are using and lock up the devices as well. Most of the software
    that is web-connected and then you can install on your system will require some
    login credentials. You need to pick out a good and strong password to use here
    and remember to not use the same password you have on another account or application.


    To take this further, make sure that you have a strong computer password that
    you want to work with, as well. There are times when someone may be able to gain
    access physically to your computer, and if you do not have a strong password in
    place, then you will end up in trouble. a simple line of defense to make sure
    that you are protected on all sides with your system, no matter what is on it,
    is to come up with a strong password for the computer, so it is harder for the
    hacker to enter.


    Protecting your system is an important part of making sure that hackers are not
    able to get ahold of your information and use it in any manner that they choose.
    Having this setup, and following some of the security tips we talked about in
    this chapter, and in some of the rest of the guidebook, can be important to keep
    your system as safe and secure as possible.'
