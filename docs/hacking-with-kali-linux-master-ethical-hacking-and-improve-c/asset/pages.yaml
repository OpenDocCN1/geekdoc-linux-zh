- pgno: 74
  md: '# CHAPTER 8: PROTECTING OUR INTERNET TRAFFIC


    Very few people have a computer without at least some Internet access allowed
    on it. And most of us will spend the majority of our time online when we are using
    our computers. This can vary from doing work, checking social media, looking for
    stuff online, shopping, and even sending and receiving emails. With all of the
    different things that we can do with our computers over the Internet, it is no
    wonder that we will try so hard to find ways we can keep our Internet safe. Let’s
    take a look at some of the things you can do to maintain the safety of your Internet
    traffic so you can use your computer how you want, without running into any risks.


    # What Is a Network Scan?


    One process that we can work on in order to protect the internet traffic that
    we are working with is to complete a network scan. Network scanning is when we
    use our computer network in order to gather up information that relates to computing
    systems. Network scanning is mainly going to be used for system maintenance, security
    assessment, and also to help a hacker perform the attack they want. There are
    a number of things that will happen during our network scanning, and some of the
    most common purposes will include the following:


    +   1. Recognizing all of the available TCP and UDP network services that are
    running on the hosts that we wish to target.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '+   2. Recognizing what kind of filtering system is there between the user
    and the hosts that we want to target.


    +   3. Determine the operating systems that are in use by our target system simply
    by being able to assess the IP responses.


    +   4. Evaluate the target host’s TCP sequence number predictability in order
    to determine the sequence prediction attack and the TCP spoofing.


    Network scanning will consist of a network port scanning as well as some vulnerability
    scanning. This port language is important because it is a method where we will
    send the packets of data through the network over to the specified numbers of
    the service port. This is done in order to help us figure out which network services
    are available for that system. This procedure is the most effective when we are
    trying to troubleshoot system issues and to help keep the security of your system
    as strong as possible.


    Vulnerability scanning is another method that we can use in order to discover
    some of the known vulnerabilities of the computing systems that are available
    on our network. It is there to help us detect the weak spots found in our operating
    system or application software, which is something that a hacker can crash or
    compromise for their purposes if we are not careful.


    Doing a combination of network port scanning and vulnerability scanning is a good
    technique to help us gather up information on our network. But when it is carried
    out by someone who doesn’t belong on your system and someone who chooses to remain
    anonymous, these are seen as a prelude to an attack.


    The processes of network scanning, like ping sweeps and port scans, will return
    a lot of details about which IP addresses will map straight to the active'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'live hosts, and the different services that these all provide. Another method
    for doing this, which is known as inverse mapping, will gather up some details
    about IP addresses that are not going to map a live host, which will help an attacker
    to focus more on their feasible addresses that are the best to attack.


    # What Is a VPN?


    One way you can keep your network as safe and secure as possible is to work with
    a VPN or a Virtual Private Network. This is a great thing to work with because
    it will ensure you can create your own secure connection over to a trusted network
    while using the internet. You can use these VPNs in order to access some of the
    region-restricted websites that you want to visit, help to shield some of your
    browsing activity from others when you are online, and so much more.


    It is common for these VPNs to be really popular right now, but sometimes not
    for the reasons that programmers originally developed them. Originally, these
    networks were just a way for a business network to connect to another one over
    the Internet, or to allow you to access your business network when you were traveling
    or at home.


    VPNs will essentially forward all of the traffic of your network over to the VPN,
    which is where the benefits, like accessing the local network resources in a remote
    manner and bypassing internet censorship, all come from. The good news is most
    of the major operating systems will have some VPN support integrated into them.


    The VPN will connect to your tablet, smartphone, or PC somewhere on the'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'Internet, and will allow you to do some browsing using that computer’s internet
    connection. So, if you have a connection to a server that is in another country,
    then you would be able to access a lot of things you would not be able to do in
    other situations. So, how will that help you out? There are a number of ways this
    VPN can help you out, including:


    +   1. Bypass some of the geographic restrictions that are on websites or when
    it is time to stream video and audio.

    +   2. Watch some of the streaming media that are out there like Hulu and Netflix.

    +   3. Protect yourself from being logged in when you are doing torrenting.

    +   4. Gain at least a bit of anonymity online by hiding the location where you
    truly are

    +   5. Protect yourself from snooping that happens with some of the Wi-Fi hotspots
    that are not trustworthy.


    The vast majority of people who want to stay safe and keep their information away
    from prying eyes and hackers will turn to VPNs to help them. One of the popular
    ways of using this is to bypass many of the geographic restrictions to watch content
    in a different country. Either way, it can help to hide your location and makes
    it easier for you to get the things done online that you want in a safe and secure
    manner.


    When it is time to connect to your computer, or one of the other devices that
    you want to use, and get it hooked up to the VPN< the computer will act as if
    it can hook up to the same local network that the VPN is on. All of your network
    traffic is sent over a connection that is secure until it can reach the VPN you
    choose.'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'Because the computer behaves as if it belongs to that network, this will make
    it easier for you to securely access local network resources, no matter where
    you are located in the world. This means you can use the Internet in the same
    manner you would if you were in the same location as the VPN. This will have some
    benefits if you want to work with a Wi-Fi that is public or you want to access
    websites that are blocked based on where you are located throughout the world.


    When you take the time to browse the Web while you are connected to one of these
    VPNs, your computer can contact the website through our encrypted VPN connection.
    The VPN is then able to forward that request for you, and then forwards the response
    that it receives from the website back to the secure connection. If you are using
    the USA-based VPN to help you get onto Netflix, for example, Netflix will notice
    the connection is coming from the United States and will provide you with the
    content that is available there.


    There are a lot of good reasons to work with these VPNs. They are a great way
    to hide the information you are sending online and will make it a lot harder for
    a hacker to find you and figure out what you are doing online. For those individuals
    and companies who want to be able to do their work and have fewer worries about
    how a hacker would be able to get in the middle and cause some issues, working
    with the VPN may be the best option to choose.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# CHAPTER 9: METHODS AND APPLICATIONS


    This guidebook has taken some time to look over all of the different parts that
    come with hacking, especially when it comes to working with the Kali Linux system.
    Being able to use this system and understand some of the different ways that a
    hacker can get onto the system and cause some problems is important. But we also
    need to know some of the steps we can take in order to prevent them from attacking
    us, and how we can stay safe and secure online.


    That is where this chapter will come into play. You will find that with the help
    of this chapter, we will take some time to figure out how to test out the security
    of your current network. And then we will move on to some of the tips and tricks
    that will ensure you can in order to keep your network safe.


    # How to Test the Security of Your Network


    There are a few different techniques that you can try out in order to make sure
    that you are checking out the security of your network in the proper manner. Using
    these and ensuring that you add in the right software and tools and pick good
    passwords can all come into play. However, some of the best approaches and techniques
    you can use in order to test out the security of your network will include:


    +   1. Network scanning: This is a technique where we work with the port scanner
    in order to figure out all of the hosts connected to the network.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '+   Network services are also going to be scanned in this. This will help us
    to ensure whether or not our ports are configured to allow only the right secured
    network services.


    +   Vulnerability scanning: Working with a vulnerability scanner will help us
    to figure out if there are some weaknesses in that network. It can also help us
    to learn some more about the security loopholes, which can be improved as well.


    +   Ethical hacking: This is a type of hacking that is done in order to identify
    potential threats to our network. This will help us to identify if there are any
    possible malicious attacks or access that are not authorized on the system.


    +   Password cracking: This is a method that hackers can use in order to crack
    through some of the weaker passwords on your system. This is a good thing to use
    because it enforces the policy of your network about minimum criteria for passwords,
    making sure that everyone has a password that is safe and secure.


    +   Infiltration testing: An Infiltration Test is an attack that is done on the
    system or network in order to figure out what flaws are there. under these techniques,
    we will compromise all of the parts of the network in order to figure out the
    vulnerability that might be found in the system and then learn how to fix it.


    # Simple Tips to Keep Your System Safe


    Now that we have spent some time in this guidebook talking about all of the different
    ways that a hacker can get onto your system and cause issues, it is time to take
    a look at a few of the steps that you can take in order to make sure that your
    computer and network are as safe as possible. No one is completely safe in terms
    of these attacks, and no matter how small or'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'unimportant you may think you are, you can still become a victim of the attack
    as well.


    The first step that we can take is to make sure your system and all of the software
    on it is updated on a regular basis. This is a hard thing to work with because
    these updates seem like an annoyance. But it is really important for us to stay
    on top of them. Besides being able to offer us new features, they are there to
    cover up any security holes that can happen on our computer. In most cases, when
    your operating system or another major software as an update, you will get a notification
    about it. You can choose to go with updating later or right away.


    While it is easy to just forget about the update and assume that you will get
    to it at a later time, this is not a good thing to do for the safety of your system.
    In fact, you is much better off to do this right away and get it over with, because
    it helps to prevent issues with a hacker getting on the system.


    The next thing on the list we need to focus on is making sure you always have
    your wits around you and that you think things through. It is something that should
    just go without saying, but being suspicious about everything is one of the best
    things that you can do to make sure that your computer is secure all of the time.
    while a lot of techniques of hacking are becoming more sophisticated as time goes
    on, so it is harder to figure out if you are under attack or not, it can also
    be something simple that takes over as well.


    Make sure that you are always stopping and thinking twice before you click or
    open anything that doesn’t really look legitimate to work with. Do not rely on
    just the spam filters in order to catch some of the sketchy emails or other'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'issues that may come through. Remember that criminals are always looking for
    ways to outsmart some of these settings, and if you are not careful, they will
    get through.


    Enabling a good firewall is the next thing that you need to focus on. A firewall
    will act as the barrier that you need between your network and the internet. If
    you have a good firewall in place, you will find that it is effectively going
    to close up the ports of the computer so that it prevents communication from the
    outside world with your device. This is a good thing because it provides you with
    some protection by stopping threats from being able to enter the system and spreading
    between the other devices that are there, it can also be a good way for us to
    prevent any data from heading out of the computer.


    If you find that there are open computer ports, then anything that comes into
    them could be processed. This is a bad thing if you are talking about a malicious
    program that a hacker sent to you. While it is possible to go through and manually
    close these ports, a firewall is a great defense to help close up these ports.
    The firewall will open the ports on occasion, but only to external devices on
    a needed basis and trusted applications it already knows about.


    The good news is that most operating systems will come with a firewall, so you
    just need to make sure that you enable this so that it works. But you can always
    go through and download and install one if your operating system does not have
    this feature. It is an extra bit of security for your system that can really do
    wonders for keeping those hackers out of the way.'
